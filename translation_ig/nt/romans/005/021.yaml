reference: Romans 5:21
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἵνα ὥσπερ ἐβασίλευσεν ἡ ἁμαρτία ἐν τῷ θανάτῳ, οὕτως καὶ ἡ χάρις βασιλεύσῃ διὰ δικαιοσύνης εἰς ζωὴν αἰώνιον διὰ Ἰησοῦ Χριστοῦ τοῦ κυρίου ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/021.yaml
  text: so that[a], just as sin reigned in death[c][b], so also grace might reign through righteousness to eternal life through Jesus the Messiah our Lord.
translation:
  language: ig
  text: ka[a], dịka mmehie siri chịa n’ọnwụ, otú ahụkwa amara wee chịa site n’ezi omume[b] ruo ná ndụ ebighị ebi site n’aka Jizọs, bụ Mesaya na Onyenwe anyị.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'N’ụzọ nkịtị, ahịrịokwu a na-aga n’ihu n’ihe e kwuru n’amaokwu 20: “ka…”'
    reason: contextual_syntax
  - marker: b
    text: A pụkwara ịsụgharị ya, “site n’ikpe ziri ezi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: ka ... wee
  rationale: Na-egosipụta nzube ma ọ bụ ihe si na ya pụta, ma kwekọọ n'ụzọ Igbo si eji ahịrịokwu subjunctive ekwu okwu.
- source_word: ἐβασίλευσεν / βασιλεύσῃ
  choice: chịrị / chịa
  rationale: Na-echekwa ihe atụ Pọl ji banyere ịchị dịka eze, tinyere ọdịiche dị n’etiti indicative gara aga na subjunctive.
- source_word: ἐν τῷ θανάτῳ
  choice: n’ọnwụ
  rationale: Na-echekwa echiche nke ebe ma ọ bụ ọnọdụ ọnwụ n’enweghị ịkọwa ya gabiga ihe Grik kwuru.
- source_word: ἡ ἁμαρτία
  choice: mmehie
  rationale: Okwu Igbo a na-ahụkarị maka mmehie, ma na-ekwe ka e were ya dịka onye na-achị n’ihe atụ ahụ.
- source_word: ἡ χάρις
  choice: amara
  rationale: Okwu Igbo a na-ahụkarị maka grace, ma na-echekwa ime ka amara dị ka onye na-achị.
- source_word: διὰ δικαιοσύνης
  choice: site n’ezi omume
  rationale: Na-egosi διά dịka ụzọ ma ọ bụ ihe e ji eme ihe; ‘ezi omume’ na-eburu echiche nke δικαιοσύνη n’Igbo a na-aghọta nke ọma.
- source_word: εἰς ζωὴν αἰώνιον
  choice: ruo ná ndụ ebighị ebi
  rationale: ‘Ruo ná’ na-echekwa ntụziaka nke εἰς, ebe ‘ndụ ebighị ebi’ bụ okwu Igbo doro anya ma dị ebube.
- source_word: διὰ Ἰησοῦ Χριστοῦ τοῦ κυρίου ἡμῶν
  choice: site n’aka Jizọs bụ Mesaya, Onyenwe anyị
  rationale: Na-egosi διά dịka onye e sitere n’aka ya nweta ihe ahụ; ‘Mesaya’ na-eme ka Χριστός pụta dịka aha ọkwa, ebe ‘Onyenwe anyị’ na-asụgharị τοῦ κυρίου ἡμῶν.
theological_decisions:
- issue: Ma δικαιοσύνη ga-abụ ezi omume ka ọ bụ ikpe ziri ezi
  choice: site n’ezi omume
  alternative: site n’ikpe ziri ezi
  rationale: ‘Ezi omume’ na-echekwa echiche Pọl banyere ọnọdụ na omume ziri ezi, ma e debere akụkụ nke ikpe ziri ezi n’okpuru nkọwa.
- issue: Ma Χριστός bụ aha ọkwa ka ọ bụ akụkụ aha mmadụ
  choice: Jizọs bụ Mesaya
  alternative: Jizọs Kraịst
  rationale: N’ebe a, ‘Mesaya’ na-eme ka ihe Χριστός pụtara dịka aha ọkwa doo onye na-agụ Igbo anya, n’enweghị itinye ozizi otu ụka.
- issue: Mmekọrịta ἵνα na βασιλεύσῃ
  choice: ka ... chịa
  alternative: n’ihi ya ... chịrị
  rationale: A hapụrụ echiche nzube/nhụta nsonaazụ nke subjunctive ka ọ dị, kama ime ya naanị nkwupụta banyere ihe mere eme.
translation_notes:
  register: Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E debere ihe atụ banyere mmehie na amara dịka ndị na-achị, tinyere ndakọrịta ‘dịka ... ka ... sikwa.’
