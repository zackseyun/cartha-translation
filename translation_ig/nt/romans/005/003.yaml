id: ROM.5.3
reference: Romans 5:3
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οὐ μόνον δέ, ἀλλὰ καὶ ⸀καυχώμεθα ἐν ταῖς θλίψεσιν, εἰδότες ὅτι ἡ θλῖψις ὑπομονὴν κατεργάζεται,
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/003.yaml
  text: And not only that[a], but we also rejoice in afflictions, knowing that affliction produces endurance[c][b],
translation:
  language: ig
  text: Ọ bụghị naanị nke ahụ, kamakwa anyị na-aṅụrị ọṅụ[a] n’ime mkpagbu[b], ebe anyị maara na mkpagbu na-arụpụta ntachi obi[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “anyị na-anya isi” ma ọ bụ “anyị na-aṅụrị ọṅụ nke ukwuu.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ “ahụhụ” ma ọ bụ “oke nsogbu.”
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ “ịnọgide guzosie ike” ma ọ bụ “ịnọgidesi ike.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καυχώμεθα
  choice: anyị na-aṅụrịkwa ọṅụ
  rationale: Nke a na-egosi ọṅụ na ntụkwasị obi sitere n’ihe Chineke na-eme, na-enweghị ime ka okwu ahụ bụrụ ịnya isi n’ụzọ mpako. Ihe odide ala peeji chekwara echiche ọzọ nke ‘ịnya isi’ ma ọ bụ ‘ịṅụrị ọṅụ nke ukwuu.’
- source_word: θλίψεσιν / θλῖψις
  choice: mkpagbu
  rationale: ‘Mkpagbu’ na-egosi nrụgide, ahụhụ, na nsogbu siri ike. N’Igbo, otu ụdị aha a nwere ike ịrụ ọrụ ma n’echiche ọtụtụ ahụmahụ dị na nkebi mbụ ma n’echiche izugbe dị na nkebi nke abụọ.
- source_word: ὑπομονήν
  choice: ntachi obi
  rationale: ‘Ntachi obi’ bụ okwu Igbo doro anya nke na-egosi ịnọgide guzosie ike ma na-edi ihe n’okpuru nrụgide.
- source_word: κατεργάζεται
  choice: na-arụpụta
  rationale: ‘Na-arụpụta’ na-egosi na mkpagbu na-eweta ntachi obi dịka ihe si na ya pụta, dịka ngwaa Grik si kwuo.
- source_word: εἰδότες
  choice: ebe anyị maara
  rationale: Nkebi a na-ejigide njikọ participle ahụ na ahịrịokwu bụ isi, n’enweghị ịkọwa njikọ ahụ karịa ihe Grik kwuru.
theological_decisions:
- issue: Ihe καυχώμεθα pụtara n’ọnọdụ ime mmụọ a
  choice: Ịṅụrị ọṅụ nke dabeere n’ihe Chineke na-arụ
  alternative: Ịnya isi ma ọ bụ ịṅụrị ọṅụ nke ukwuu
  rationale: Ihe Pọl na-ekwu bụ ntụkwasị obi na ọṅụ n’etiti mkpagbu, ọ bụghị mpako mmadụ. Otú ọ dị, ihe odide ala peeji hapụrụ ohere maka ike okwu ‘ịnya isi/ịṅụrị ọṅụ nke ukwuu’ dị n’okwu Grik.
- issue: Mmekọrịta mkpagbu na ntachi obi
  choice: Mkpagbu na-arụpụta ntachi obi
  alternative: Mkpagbu na-eweta ma ọ bụ na-eme ka ntachi obi pụta
  rationale: A hapụrụ nkwupụta Pọl n’ụdị siri ike o ji kwuo ya, n’enweghị ịgbakwunye nkọwa banyere usoro ma ọ bụ ọnọdụ nke ihe a si eme.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. ‘Ọ bụghịkwa naanị nke ahụ’ na-ejikọta amaokwu a na ihe bu ya ụzọ. A naghị etinye ‘anyị’ n’ihu ‘mkpagbu’ dịka ihe nwe ya, n’ihi na nke ahụ adịghị na Grik. Akara [a], [b], na [c] niile pụtara n’ederede bụ isi.
