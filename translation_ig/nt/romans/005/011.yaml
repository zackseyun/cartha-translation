id: ROM.5.11
reference: Romans 5:11
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οὐ μόνον δέ, ἀλλὰ καὶ καυχώμενοι ἐν τῷ θεῷ διὰ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ, δι’ οὗ νῦν τὴν καταλλαγὴν ἐλάβομεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/011.yaml
  text: And not only that[a], but we also boast in God through our Lord Jesus the Messiah[d][c][b], through whom we have now received the reconciliation.
translation:
  language: ig
  text: Ọ bụghịkwa naanị nke ahụ, kama anyị na-anyakwa isi[a] n’ime Chineke site n’Onyenwe[b] anyị Jizọs bụ Mezaya[c], onye site n’aka ya ka anyị natara ugbu a ime ka anyị na Chineke dịghachi ná mma.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “anyị na-aṅụrịkwa ọṅụ n’ime Chineke.”
    reason: lexical_alternative
  - marker: b
    text: Maka “Onyenwe,” okwu ndị ọzọ a pụrụ ịtụle n’ọnọdụ ụfọdụ bụ “Nna Ukwu” ma ọ bụ, n’ọnọdụ ndị ọzọ, “ONYENWE.”
    reason: lexical_alternative
  - marker: c
    text: Grik bụ Christos; dịka omenala nsụgharị si dị, “Kraịst.”
    reason: alternative_reading
  - marker: d
    text: 'N’ụzọ dị nkenke karị: “anyị natara ugbu a ịdịghachi ná mma.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: καυχώμενοι
  choice: anyị na-anyakwa isi
  rationale: ‘Ịnya isi’ na-anọchi anya echiche bụ isi nke καυχάομαι. N’ebe a, ọ pụtara ntụkwasị obi na ọṅụ nke ihe Chineke mere, ọ bụghị ibuli onwe mmadụ elu.
- source_word: ἐν τῷ θεῷ
  choice: n’ime Chineke
  rationale: 'Nke a na-edobe ihe ἐν na θεῷ kwuru: Chineke bụ onye na ihe mere ha ji anya isi, nakwa ebe ntụkwasị obi ha dị.'
- source_word: διὰ τοῦ κυρίου ἡμῶν
  choice: site n’Onyenwe anyị
  rationale: ‘Site n’…’ na-egosi onye e ji mee ka nke a kwe omume; ‘Onyenwe’ bụ nsụgharị kwesịrị ekwesị nke κύριος n’ebe a.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jizọs bụ Mezaya
  rationale: Χριστός bụ utu aha pụtara onye e tere mmanụ, ya mere ‘Mezaya’ na-eme ka ihe utu aha ahụ pụtara doo anya n’Igbo. A tinyere ‘bụ’ ka okwu ahụ daa nke ọma n’Igbo.
- source_word: τὴν καταλλαγὴν
  choice: ime ka anyị na Chineke dịghachi ná mma
  rationale: Nkebi okwu a na-egosi καταλλαγή dị ka iweghachi mmekọrịta e mebiri emebi. E kwuru ‘Chineke’ n’ụzọ doro anya n’Igbo n’ihi na ọ bụ ya ka amaokwu ndị gbara ya gburugburu na-ekwu na e mere ka anyị na ya dịghachi ná mma.
- source_word: ἐλάβομεν
  choice: anyị ... nata ugbu a
  rationale: ‘Nata’ na-egosi na ime ka mmadụ na Chineke dịghachi ná mma bụ ihe e nyere, ọ bụghị ihe mmadụ rụpụtara n’onwe ya; ‘ugbu a’ na-anọchi anya νῦν.
theological_decisions:
- issue: Ihe καυχώμενοι pụtara mgbe Chineke bụ onye a na-anya isi n’ime ya
  choice: anyị na-anya isi n’ime Chineke
  alternative: anyị na-aṅụrị ọṅụ n’ime Chineke
  rationale: A họọrọ nsụgharị nke na-anọkarị nso n’okwu Grik, ma ihe gbara ya gburugburu na-eme ka o doo anya na nke a bụ otuto na ntụkwasị obi n’ebe Chineke nọ, ọ bụghị mpako mmadụ.
- issue: Nsụgharị Χριστοῦ dị ka utu aha
  choice: Mezaya
  alternative: Kraịst
  rationale: N’ebe a Χριστός na-arụ ọrụ dị ka utu aha. ‘Mezaya’ na-eme ka echiche onye Chineke tere mmanụ pụta ìhè, ebe ‘Kraịst’ nwere ike ịdị ka akụkụ aha mmadụ nye ọtụtụ ndị.
- issue: Onye ya na mmadụ dịghachiri ná mma na καταλλαγή
  choice: ime ka anyị na Chineke dịghachi ná mma
  alternative: ịdịghachi ná mma
  rationale: Amaokwu ndị bu ụzọ kọwara na ọ bụ Chineke ka e si n’ọnwụ Ọkpara ya mee ka anyị na ya dịghachi ná mma. Ikwupụta ‘Chineke’ na-eme ka Igbo doo anya n’enweghị ịgbanwe onye a na-ekwu banyere ya.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị ugwu ma dị mfe nghọta. ‘Ịnya isi’ na-edobe ike okwu Pọl, ebe nkọwa gbara ya gburugburu na-egbochi nghọta nke mpako onwe onye. A sụgharịrị καταλλαγή n’ụzọ nkọwa n’ihi na nke ahụ na-ada eke ma doo anya karịa iji otu aha Igbo pụrụ ịdị mgbagwoju anya.
