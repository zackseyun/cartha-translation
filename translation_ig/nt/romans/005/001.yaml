revisions:
- from: 'Ndị Rom 5:1


    Ya mere, ebe a gụrụ anyị ná ndị ezi omume site n’okwukwe[b], anyị na Chineke dị n’udo[a] site n’aka Onyenwe anyị Jizọs, bụ Mezaya[c].'
  to: 'Ndị Rom 5:1


    Ya mere, ebe a gụpụtara anyị dị ka ndị ezi omume site n’okwukwe[b], anyị na Chineke dị n’udo[a] site n’aka Onyenwe anyị Jizọs, bụ Mezaya[c].'
  rationale: 'Only the justification clause is adjusted for idiomatic Standard Igbo. “A gụpụtara anyị dị ka ndị ezi omume” preserves the passive, completed action and avoids deciding between fuller theological accounts of δικαιόω. Footnote anchors remain correctly attached to the relevant words: [b] to faith, [a] to the indicative/hortatory variant in the peace clause, and [c] to Messiah.'
