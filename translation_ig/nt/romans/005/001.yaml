id: ROM.5.1
reference: Romans 5:1
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Δικαιωθέντες οὖν ἐκ πίστεως εἰρήνην ⸀ἔχομεν πρὸς τὸν θεὸν διὰ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/001.yaml
  text: Therefore[a], since we have been justified by faith, we have peace with God through our Lord Jesus the Messiah[c][b],
translation:
  language: ig
  text: 'Ndị Rom 5:1


    Ya mere, ebe a gụpụtara anyị dị ka ndị ezi omume site n’okwukwe[b], anyị na Chineke dị n’udo[a] site n’aka Onyenwe anyị Jizọs, bụ Mezaya[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ụfọdụ akwụkwọ aka ochie nwere: “ka anyị na Chineke dịrị n’udo.”'
    reason: textual_variant
  - marker: b
    text: 'A pụkwara ịsụgharị ya: “na ndabere nke okwukwe.”'
    reason: lexical_alternative
  - marker: c
    text: Okwu Grik bụ Christos, nke pụtara “Mezaya”; dịka omenala si dị, a na-asụgharị ya “Kraịst.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Δικαιωθέντες
  choice: ebe a gụrụ anyị ná ndị ezi omume
  rationale: Nke a na-egosipụta ngwaa gara aga nke a na-eme onye ihe, ma na-ezere ịkọwa n’ụzọ sara mbara ma ọ bụ itinye ozizi pụrụ iche banyere otú ime ka mmadụ bụrụ onye ezi omume si arụ ọrụ.
- source_word: οὖν
  choice: Ya mere
  rationale: Ọ na-egosi nkwubi okwu Pọl si n’ihe o kwuru tupu amaokwu a nweta.
- source_word: ἐκ πίστεως
  choice: site n’okwukwe
  rationale: Ọ bụ ụzọ Igbo doro anya ma dị mfe isi kwuo na okwukwe bụ ụzọ ma ọ bụ ntọala e si gụọ anyị ná ndị ezi omume, n’agbanyeghị na ἐκ pụkwara ịpụta ‘site na’ ma ọ bụ ‘na ndabere nke.’
- source_word: εἰρήνην
  choice: udo
  rationale: ‘Udo’ na-edobe obosara okwu Grik ahụ ma ghara ibelata ya ka ọ bụrụ naanị mmetụta obi ma ọ bụ jiri okwu nkọwa dịka ‘ime udo ọzọ’ dochie ya.
- source_word: ἔχομεν
  choice: anyị na Chineke dị n’udo
  rationale: Ederede SBLGNT nyere nwere ụdị nkwupụta ἔχομεν, ‘anyị nwere’; n’Igbo, ‘anyị na Chineke dị n’udo’ bụ ụzọ ebumpụta ụwa isi kwuo ‘anyị nwere udo n’ebe Chineke nọ.’
- source_word: πρὸς τὸν θεὸν
  choice: na Chineke
  rationale: N’usoro okwu banyere udo, nke a na-egosi mmekọrịta udo dị n’etiti anyị na Chineke.
- source_word: διὰ τοῦ κυρίου ἡμῶν
  choice: site n’aka Onyenwe anyị
  rationale: ‘Site n’aka’ na-egosipụta onye e si n’aka ya nweta udo ahụ, ebe ‘Onyenwe anyị’ na-edobe aha nsọ κύριος n’ụzọ Igbo a na-aghọta nke ọma.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jizọs, bụ Mezaya
  rationale: Χριστός bụ aha ọkwa pụtara Mezaya; itinye ‘bụ’ na-eme ka aha ọkwa ahụ daa nke ọma n’Igbo kama ime ya ka ọ bụrụ naanị aha mmadụ.
theological_decisions:
- issue: Ihe δικαιωθέντες pụtara n’ozizi Pọl
  choice: ebe a gụrụ anyị ná ndị ezi omume
  alternative: ebe e mere ka anyị bụrụ ndị ezi omume; ebe a kwupụtara na anyị bụ ndị ezi omume
  rationale: Nhọrọ a na-egosi mkpebi ọma e mere banyere ndị kwere ekwe, ma ọ naghị ekpebi n’ime amaokwu a naanị ma okwu ahụ ọ pụtara nanị nkwupụta ikpe ma ọ bụ mgbanwe e mere n’ime mmadụ.
- issue: Ihe ‘udo na Chineke’ pụtara
  choice: anyị na Chineke dị n’udo
  alternative: anyị nwere udo nke obi Chineke na-enye; e mere ka anyị na Chineke dịghachi ná mma
  rationale: Okwu Grik bụ ‘udo’ ma na-elekwasị anya ná mmekọrịta anyị na Chineke. Nsụgharị ahụ anaghị eme ka ọ bụrụ naanị mmetụta dị n’obi, ọ dịghịkwa eji okwu nkọwa sara mbara karịa ihe amaokwu ahụ kwuru dochie ya.
- issue: Ụdị ederede dị iche na ἔχομεν/ἔχωμεν
  choice: anyị na Chineke dị n’udo
  alternative: ka anyị na Chineke dịrị n’udo
  rationale: A gbasoro ụdị nkwupụta ἔχομεν dị na SBLGNT, ebe e debere ụdị agbamume ἔχωμεν nke dị n’ụfọdụ akwụkwọ aka ochie n’okpuru peeji.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dịrị ndị nkịtị mfe nghọta. A họọrọ usoro okwu ebumpụta ụwa ‘anyị na Chineke dị n’udo’ kama ịsụgharị ‘anyị nwere udo n’ebe Chineke nọ’ n’ụzọ siri ike. E tinyere akara nkọwa ala peeji niile—[a], [b], na [c]—n’ebe okwu ha metụtara dị n’ahịrị amaokwu.
