source:
  edition: SBLGNT
  text: νόμος δὲ παρεισῆλθεν ἵνα πλεονάσῃ τὸ παράπτωμα· οὗ δὲ ἐπλεόνασεν ἡ ἁμαρτία, ὑπερεπερίσσευσεν ἡ χάρις,
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/020.yaml
  text: The law came in alongside so that the trespass might increase; but where sin increased, grace overflowed all the more,
translation:
  language: ig
  text: Iwu ahụ batara dị ka ihe agbakwunyere[a] ka mmejọ ahụ[b] wee baa ụba; ma ebe mmehie bara ụba, amara juru eju gabiga ókè[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “batara n'akụkụ” ma ọ bụ “batara”; okwu Grik ahụ na-egosi ịbata n'akụkụ ihe ọzọ ma ọ bụ ịbata dị ka mgbakwunye.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “njehie ahụ” ma ọ bụ “mmebi iwu ahụ.”
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “amara bara ụba karịa nke ukwuu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: νόμος
  choice: Iwu ahụ
  rationale: Nkọwa aha dị na Grik na gburugburu okwu Pọl na-atụ aka karịsịa n'Iwu Mosis; “Iwu ahụ” na-edobe ntụaka ahụ kpọmkwem.
- source_word: παρεισῆλθεν
  choice: batakwara n'akụkụ
  rationale: Nke a na-egosipụta echiche nke ịbata n'akụkụ ma ọ bụ dị ka ihe agbakwunyere, ọ bụghị naanị ịbata nkịtị.
- source_word: ἵνα πλεονάσῃ
  choice: ka ... wee baa ụba
  rationale: Usoro a na-edobe ike ebumnuche nke ἵνα na subjunctive, n'emeghị ka esemokwu nkà mmụta okpukpe dị n'okwu ahụ laa n'iyi.
- source_word: τὸ παράπτωμα
  choice: njehie ahụ
  rationale: “Njehie” na-egosi mmebi ma ọ bụ ịgafe ihe e nyere n'iwu, ma bụrụkwa okwu ndị nkịtị na-aghọta; nkọwa ala peeji na-enye nhọrọ ndị ọzọ.
- source_word: οὗ
  choice: ebe
  rationale: “Ebe” bụ ụzọ Igbo dị mfe ma kwekọọ n'usoro ntụnyere nke okwu a.
- source_word: ἁμαρτία
  choice: mmehie
  rationale: Nke a bụ okwu Igbo a na-ejikarị eme ihe maka echiche Pọl banyere ἁμαρτία.
- source_word: ὑπερεπερίσσευσεν
  choice: juputara gabiga ókè
  rationale: Ngwaa Grik a siri ike karịa naanị “ịba ụba”; okwu a na-egosi ụba karịrị akarị ma na-ada nke ọma n'Igbo.
- source_word: ἡ χάρις
  choice: amara
  rationale: “Amara” bụ okwu Igbo a nabatara nke ọma maka χάρις n'echiche nkà mmụta okpukpe a.
theological_decisions:
- issue: Ma a ga-asụgharị ἵνα dị ka ebumnuche doro anya ma ọ bụ mee ka ọ bụrụ naanị ihe si na ya pụta, iji zere echiche na Chineke kwadoro mmehie.
  choice: ka njehie ahụ wee baa ụba
  alternative: nke mere na njehie ahụ bara ụba
  rationale: ἵνα tinyere subjunctive na-akwado usoro ebumnuche. Nsụgharị ahụ na-edobe esemokwu dị n'okwu Pọl n'ekwughị na Chineke kwadoro mmehie n'omume.
translation_notes:
  register: Standard Igbo; asụsụ dị ùgwù ma dị mfe nghọta. E debere njikọ δέ site na “ma,” a hapụghịkwa okwu oge dịka “ugbu a” n'ihi na ọ dịghị n'isi mmalite. Akara ala peeji [a]–[c] niile pụtara n'ahịrị isi.
