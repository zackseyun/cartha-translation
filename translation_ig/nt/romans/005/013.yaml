  text: ἄχρι γὰρ νόμου ἁμαρτία ἦν ἐν κόσμῳ, ἁμαρτία δὲ οὐκ ἐλλογεῖται μὴ ὄντος νόμου,
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/013.yaml
  text: For until the law[a], sin was in the world; but sin is not counted where there is no law.
translation:
  language: ig
  text: N’ihi na ruo mgbe Iwu ahụ bịara, mmehie dị n’ụwa; ma a naghị agụta mmehie n’akaụntụ[a] mgbe iwu na-adịghị.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “a naghị edekọ mmehie n’akaụntụ” ma ọ bụ “a naghị ebo mmehie n’akaụntụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄχρι γὰρ νόμου
  choice: N’ihi na tupu e nye Iwu ahụ
  rationale: N’ọnọdụ arụmụka a, ἄχρι νόμου na-ezo aka n’oge tupu e nye Iwu Mosis. Igbo chọrọ ka e mee ihe a na-aghọta n’ụzọ doro anya; ‘tupu e nye’ na-egosipụta njedebe oge ahụ nke ọma.
- source_word: νόμου
  choice: Iwu ahụ / iwu
  rationale: N’okwu nke mbụ, ‘Iwu ahụ’ na-egosi Iwu Mosis nke akụkụ gbara amaokwu a gburugburu na-ekwu maka ya. N’okwu nke abụọ, ‘iwu’ na-anọgide n’ụdị izugbe dịka Greek si dị.
- source_word: ἁμαρτία
  choice: mmehie
  rationale: Nke a bụ okwu Igbo a na-ejikarị eme ihe maka echiche Pọl banyere mmehie; ọ na-echekwa ya dịka echiche nkịtị ma ghara ịkọwa ya karịa isi mmalite.
- source_word: ἐν κόσμῳ
  choice: dị n’ụwa
  rationale: Nke a bụ ntụgharị Igbo nkịtị ma doo anya nke na-egosi na mmehie nọ n’etiti ụwa mmadụ.
- source_word: ἐλλογεῖται
  choice: a naghị agụnye ... n’ụgwọ mmadụ
  rationale: Ngwaa a nwere ihe oyiyi ndekọ ego, ya bụ ide ihe n’akaụntụ mmadụ. Nkebiokwu Igbo a na-eme ka ihe oyiyi ahụ pụta ìhè n’enweghị iji okwu nkà mmụta okpukpe dị arọ.
- source_word: μὴ ὄντος νόμου
  choice: mgbe iwu na-adịghị
  rationale: Nke a na-egosi ọnọdụ nke enweghị iwu, ma na-ahapụ okwu ahụ n’ụdị izugbe dịka Greek si dị.
theological_decisions:
- issue: Ihe ‘iwu’ na-ezo aka na ya n’arụmụka Pọl
  choice: E ji ‘Iwu ahụ’ mee ihe n’okwu mbụ, nke na-eme ka Iwu Mosis pụta site n’ọnọdụ amaokwu a.
  alternative: Iji naanị ‘iwu’ mee ihe n’ebe abụọ ahụ n’emeghị ka Iwu Mosis pụta ìhè.
  rationale: Ndị Rom 5 na-atụle oge site n’aka Adam ruo Mosis. Ya mere, Iwu Mosis ka o yikarịrị ka a na-ekwu maka ya, ma etinyeghị ‘Mosis’ n’onwe ya n’amaokwu ahụ.
- issue: Ike na nkọwa nke ἐλλογεῖται
  choice: A sụgharịrị ya dịka ịgụnye mmehie n’ụgwọ mmadụ.
  alternative: ‘A naghị agụ mmehie’ ma ọ bụ ‘a naghị ewere mmehie dị ka nke mmadụ.’
  rationale: Nhọrọ a na-echekwa ihe oyiyi ndekọ ego nke ngwaa Greek, ma ọ naghị ekpebi arụmụka nkà mmụta okpukpe banyere ikenye mmehie n’aka mmadụ.
translation_notes:
  register: Asụsụ Igbo Izugbe, nke oge a ma dị ugwu. E ji ‘Iwu’ dee nnukwu mkpụrụedemede mgbe ọ na-ezo aka n’Iwu Mosis; a zere okwu nkà mmụta okpukpe siri ike n’ahịrị isi, ebe nkọwa ala peeji na-echekwa ụzọ ndị ọzọ e nwere isi ghọta ihe oyiyi ndekọ ego ahụ.
