revisions:
- from: Ya mere, ebe e mere ka anyị bụrụ ndị ezi omume ugbu a site n’ọbara ya,[a] ọ ga-akachasị doo anya na a ga-azọpụta anyị site n’aka ya pụọ n’iwe ahụ.[b]
  to: Ya mere, ebe e mere ka anyị bụrụ ndị ezi omume ugbu a site n’ọbara ya,[a] ọ ga-aka ukwuu na a ga-azọpụta anyị site na ya pụọ n’iwe ahụ.[b]
  rationale: The revision removes the unsupported notion of clarity and restores the source’s comparative force with “ọ ga-aka ukwuu na.” It also renders δι’ αὐτοῦ as “site na ya,” while retaining the draft’s careful treatment of justification, blood, future salvation, and the implied referent of “the wrath.”
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T10:25:04Z'
review_pass:
  verdict: revise
  source_fidelity: The draft preserves the temporal, passive, and future elements overall, but “ọ ga-akachasị doo anya na” adds the idea that something is clearer/evident, which is not expressed by πολλῷ ... μᾶλλον. The comparative intensification must be retained without supplying “clear.”
  naturalness: The revised wording uses a formal but readily intelligible Standard Igbo comparative construction suitable for a Bible translation. “Site na ya” is less idiomatically misleading than “site n’aka ya” for δι’ αὐτοῦ in this context.
  terminology: “E mere ka anyị bụrụ ndị ezi omume” remains an acceptable non-denominational rendering of δικαιωθέντες. “Iwe ahụ” correctly retains the definite Greek expression without inserting “Chineke” into the text. The footnote alternative is retained and its wording is made more natural.
  issues:
  - severity: high
    issue: The rendering of πολλῷ οὖν μᾶλλον includes “ọ ga-akachasị doo anya.”
    rationale: This says that the conclusion will be especially clear, whereas the Greek says “therefore, much more” and intensifies the certainty/force of the salvation conclusion without mentioning clarity.
  - severity: medium
    issue: “site n’aka ya” for δι’ αὐτοῦ may suggest action ‘from his hand.’
    rationale: Although it can express agency, “site na ya” more directly and naturally represents “through him” here.
  revised_text: Ya mere, ebe e mere ka anyị bụrụ ndị ezi omume ugbu a site n’ọbara ya,[a] ọ ga-aka ukwuu na a ga-azọpụta anyị site na ya pụọ n’iwe ahụ.[b]
  revised_footnotes:
  - marker: a
    text: A pụkwara ịsị, “ebe a gụrụ anyị ugbu a dịka ndị ezi omume site n’ọbara ya.”
    reason: lexical_alternative
  - marker: b
    text: Ya bụ, iwe Chineke, dịka ihe gbara amaokwu a gburugburu na-egosi.
    reason: cross_reference
  revision_rationale: The revision removes the unsupported notion of clarity and restores the source’s comparative force with “ọ ga-aka ukwuu na.” It also renders δι’ αὐτοῦ as “site na ya,” while retaining the draft’s careful treatment of justification, blood, future salvation, and the implied referent of “the wrath.”
