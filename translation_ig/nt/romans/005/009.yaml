  variant: Standard Igbo
source:
  edition: SBLGNT
  text: πολλῷ οὖν μᾶλλον δικαιωθέντες νῦν ἐν τῷ αἵματι αὐτοῦ σωθησόμεθα δι’ αὐτοῦ ἀπὸ τῆς ὀργῆς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/009.yaml
  text: Much more then[a], having now been justified by his blood[c][b], we shall be saved through him from the wrath.
translation:
  language: ig
  text: Ya mere, ebe e mere ka anyị bụrụ ndị ezi omume ugbu a site n’ọbara ya,[a] ọ ga-aka ukwuu na a ga-azọpụta anyị site na ya pụọ n’iwe ahụ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “ebe a gụrụ anyị ugbu a dịka ndị ezi omume site n’ọbara ya.”
    reason: lexical_alternative
  - marker: b
    text: Ya bụ, iwe Chineke, dịka ihe gbara amaokwu a gburugburu na-egosi.
    reason: cross_reference
lexical_decisions:
- source_word: πολλῷ οὖν μᾶλλον
  choice: Ya mere ... ọ ga-akachasị doo anya na
  rationale: Nke a na-egosi nkwubi okwu nke οὖν na nkwusi ike nke πολλῷ ... μᾶλλον n’Igbo dị ndụ, na-ejikọ amaokwu a na nke bu ya ụzọ.
- source_word: δικαιωθέντες
  choice: ebe e mere ka anyị bụrụ ndị ezi omume
  rationale: Na-egosi omume e mere anyị nke mezuru tupu nzọpụta ọdịnihu ahụ; ọ na-edobekwa echiche ikpe nke δικαιόω n’enweghị ịmanye nkọwa otu ụka.
- source_word: νῦν
  choice: ugbu a
  rationale: Na-edobe ihe ngosi oge nke okwu Grik ahụ.
- source_word: ἐν τῷ αἵματι αὐτοῦ
  choice: site n’ọbara ya
  rationale: ἐν n’ebe a na-egosi ụzọ ma ọ bụ ihe ndabere; ‘site n’ọbara ya’ bụ Igbo kwụ ọtọ ma na-edobe ihe ọbara Kraịst pụtara n’enweghị nkọwa agbakwunyere.
- source_word: σωθησόμεθα
  choice: a ga-azọpụta anyị
  rationale: Na-edobe ọdịnihu na olu nnabata nke ngwaa Grik ahụ.
- source_word: δι’ αὐτοῦ
  choice: site n’aka ya
  rationale: Na-egosi na ọ bụ ya bụ onye e si n’aka ya mee nzọpụta ahụ, dịka διά tinyere genitive si dị.
- source_word: ἀπὸ τῆς ὀργῆς
  choice: pụọ n’iwe ahụ
  rationale: Na-edobe artikel doro anya nke Grik ma ghara itinye ‘nke Chineke’ n’ahịrịokwu bụ isi, ebe ọ bụ na ihe gbara ya gburugburu ka na-egosi onye iwe ahụ bụ nke ya.
theological_decisions:
- issue: Ụdị okwu ikpe dị na δικαιωθέντες
  choice: e mere ka anyị bụrụ ndị ezi omume
  alternative: a gụrụ anyị ná ndị ezi omume
  rationale: Nhọrọ bụ isi na-edobe na Chineke mere ihe ahụ nye anyị ma na-ezere ibubata nkọwa pụrụ iche banyere otú ime ka mmadụ bụrụ onye ezi omume si arụ ọrụ. Nhọrọ ọzọ na-egosipụta akụkụ nkwupụta ikpe nke okwu ahụ.
- issue: Onye nwe iwe ahụ na ἡ ὀργή
  choice: iwe ahụ
  alternative: iwe Chineke
  rationale: Ihe gbara amaokwu ahụ gburugburu na-egosi iwe Chineke, ma okwu Grik ekwughị ‘Chineke’ kpọmkwem; ya mere, ahịrịokwu bụ isi anaghị agbakwunye ya.
translation_notes:
  register: Asụsụ Igbo Izugbe dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji ‘site n’ọbara ya’ na ‘site n’aka ya’ kewaa ụzọ/ndabere nke ἐν na onye e si n’aka ya mee ihe nke διά. Akara nkọwa ala ala [a] na [b] niile pụtara n’ahịrịokwu bụ isi.
