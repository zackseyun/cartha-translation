id: JHN.20.29
reference: John 20:29
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: λέγει αὐτῷ ὁ Ἰησοῦς· Ὅτι ἑώρακάς με πεπίστευκας; μακάριοι οἱ μὴ ἰδόντες καὶ πιστεύσαντες.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/029.yaml
  text: Jesus said to him, “Because you have seen me, you have believed? Blessed are those who have not seen and yet have believed.”
translation:
  language: ig
  text: Jizọs sịrị ya, “Ọ̀ bụ n’ihi na ị hụla m ka i ji kwere?[a] Ngọzi na-adịrị ndị na-ahụghị ma kwere.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ịsụgharị ya: “N’ihi na ị hụla m, i kwere.” Okwu Grik ahụ nwere ike ịbụ ajụjụ ma ọ bụ nkwupụta.'
    reason: alternative_reading
lexical_decisions:
- source_word: λέγει αὐτῷ ὁ Ἰησοῦς
  choice: Jizọs sịrị ya
  rationale: A sụgharịrị narrative present λέγει n’oge gara aga maka usoro akụkọ Igbo dị ebumpụta ụwa; αὐτῷ ka e gosiri n’okwu ‘ya,’ nke na-ezo aka na Tọmọs.
- source_word: Ὅτι
  choice: Ọ̀ bụ n’ihi na
  rationale: N’ebe a ὅτι na-egosi ihe kpatara nkwenye ahụ. Usoro a na-edobe ya dịka ajụjụ n’enweghị ịkọwa ihe karịrị ihe Grik kwuru.
- source_word: ἑώρακάς με
  choice: ị hụla m
  rationale: Ụdị ‘hụla’ na-egosi omume emechara nke ka nwere ihe ọ pụtara ugbu a, dịka perfect tense Grik si eme.
- source_word: πεπίστευκας
  choice: ka i ji kwere
  rationale: ‘Kwere’ bụ okwu Igbo kwesịrị ekwesị maka πιστεύω n’ebe a. Njikọ ‘ka i ji’ na-eme ka mmekọrịta dị n’etiti ịhụ na ikwere doo anya n’ajụjụ ahụ.
- source_word: μακάριοι
  choice: Ngọzi na-adịrị
  rationale: Nke a na-egosi ọnọdụ ndị Chineke gọziri, kama naanị mmetụta obi ụtọ.
- source_word: οἱ μὴ ἰδόντες
  choice: ndị na-ahụghị
  rationale: Ọ na-anọchite anya participle ahụ dịka otu ndị na-ahụghị, n’Igbo dị mfe ma dị ugbu a.
- source_word: καὶ πιστεύσαντες
  choice: ma kwere
  rationale: ‘Ma’ na-egosi ọdịiche dị n’etiti ‘na-ahụghị’ na ‘kwere’ n’ụzọ Igbo dị mma, n’agbanyeghị na καί bụ naanị njikọ; etinyeghị okwu ọzọ dịka ‘n’agbanyeghị nke ahụ.’
theological_decisions:
- issue: Ma okwu mbụ Jizọs bụ ajụjụ ka ọ bụ nkwupụta
  choice: 'E dere ya dịka ajụjụ: “Ọ̀ bụ n’ihi na ị hụla m ka i ji kwere?”'
  alternative: “N’ihi na ị hụla m, i kwere.”
  rationale: Ederede Grik n’onwe ya nwere ike ịnabata ajụjụ ma ọ bụ nkwupụta n’ihi na akara edemede nke oge a adịghị n’ihe odide ochie. Ajụjụ ahụ dabara na ọnọdụ okwu ahụ, ma ihe ọzọ kwere omume ka e debere n’ala peeji.
- issue: Ihe μακάριοι pụtara
  choice: Ngọzi na-adịrị
  alternative: Obi ụtọ na-adịrị
  rationale: Okwu a na-ekwu maka ọnọdụ ihu ọma/ngọzi, ọ bụghị naanị mmetụta obi ụtọ; a naghị etinye nkọwa nke otu ụka pụrụ iche.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke dị ugwu ma dị mfe nghọta. E jiri ‘Jizọs’ na ‘ngọzi’ dịka okwu ndị a na-amakarị. Akara ụda dị mkpa dị na mbido ajụjụ ‘Ọ̀’ iji mee ka ọgụgụ doo anya.
