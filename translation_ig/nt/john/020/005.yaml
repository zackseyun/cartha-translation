- from: O hulatara leba anya n’ime[a], hụ ákwà línịn ndị ahụ ka ha tọgbọ, ma ọ banyeghị.
  to: Ọ hulatara leba anya n’ime[a], hụ ákwà linin ndị ahụ ka ha tọgbọrọ, ma ọ banyeghị.
  rationale: The revision preserves every event and contrast in the Greek while correcting Standard Igbo orthography and replacing a misleading footnote explanation. “Leba anya n’ime” remains a natural rendering of παρακύψας; the serial narrative form “..., hụ ...” naturally communicates the ensuing act of seeing. No disputed textual or theological matter is altered.
