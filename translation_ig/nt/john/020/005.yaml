  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ παρακύψας βλέπει κείμενα τὰ ὀθόνια, οὐ μέντοι εἰσῆλθεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/005.yaml
  text: And stooping to look in[a], he sees the linen cloths lying there, yet he did not enter.
translation:
  language: ig
  text: Ọ hulatara leba anya n’ime[a], hụ ákwà linin ndị ahụ ka ha tọgbọrọ, ma ọ banyeghị.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ịsụgharị ya: “Ọ hulatara pee anya n’ime.” Okwu Grik ahụ na-ekwu maka ịhulata ile anya n’ime oghere.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακύψας
  choice: O hulatara leba anya n’ime
  rationale: Nkebi a na-egosi ma mmegharị ahụ—ịhulata—ma nzube ya, bụ ileba anya n’ime ili ahụ.
- source_word: βλέπει
  choice: hụ
  rationale: A sụgharịrị ya n’ụzọ akụkọ Igbo si aga nke ọma. Ọ bụ ezie na Grik ji oge ugbu a mee ka akụkọ dị ndụ, iji “hụ” ebe a na-eme ka Igbo bụrụ nke e ji ọnụ ekwu nke ọma n’enweghị ịgbanwe ihe omume ahụ.
- source_word: κείμενα
  choice: ka ha tọgbọ
  rationale: Nke a na-egosi na ákwà ndị ahụ dị n’ọnọdụ ha tọgbọrọ, ọ bụghị na mmadụ nọ n’amaokwu a na-edobe ha.
- source_word: τὰ ὀθόνια
  choice: ákwà línịn ndị ahụ
  rationale: Nke a na-ejigide ụdị ákwà e kwuru kpọmkwem; ọnọdụ akụkọ ahụ emeela ka o doo anya na ha bụ ákwà e ji lie ozu.
- source_word: οὐ μέντοι
  choice: ma
  rationale: “Ma” na-egosi ọdịiche dị n’etiti ịhụ ákwà ndị ahụ na ịghara ịbanye, n’ụzọ dị mfe ma bụrụkwa Igbo ebumpụta ụwa.
- source_word: εἰσῆλθεν
  choice: ọ banyeghị
  rationale: Nke a bụ ntụgharị kpọmkwem ma dịkwa mma n’Igbo maka ịghara ịbanye n’ime ili ahụ.
theological_decisions: []
translation_notes:
  register: E ji Igbo Ọha dị ugbu a, dị ùgwù ma dị mfe nghọta. A họọrọ “ákwà línịn” iji kọwaa ụdị ákwà ahụ n’enweghị ịgbakwunye nkọwa okpukpe na-adịghị na amaokwu ahụ; akara [a] dị n’ederede isi.
