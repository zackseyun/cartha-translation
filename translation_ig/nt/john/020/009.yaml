  text: οὐδέπω γὰρ ᾔδεισαν τὴν γραφὴν ὅτι δεῖ αὐτὸν ἐκ νεκρῶν ἀναστῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/009.yaml
  text: For they did not yet understand the Scripture[a], that he had to rise from the dead.
translation:
  language: ig
  text: N’ihi na ha aghọtabeghị ihe e dere n’Akwụkwọ Nsọ ruo mgbe ahụ, na ọ dị mkpa ka o si n’etiti ndị nwụrụ anwụ bilie.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐδέπω
  choice: ruo mgbe ahụ ... aghọtabeghị
  rationale: Na-egosi na nghọta ahụ erubeghị ha ruo n'oge a n'akụkọ ahụ.
- source_word: γὰρ
  choice: N’ihi na
  rationale: Na-ejikọta amaokwu a na nke bu ya ụzọ dịka nkọwa nke ihe mere.
- source_word: ᾔδεισαν
  choice: aghọtabeghị
  rationale: N’ọnọdụ a, ọ bụghị nanị ịma na Akwụkwọ Nsọ dị, kama ọ bụ ịghọta ihe ọ na-ekwu.
- source_word: τὴν γραφὴν
  choice: ihe e dere n’Akwụkwọ Nsọ
  rationale: Na-echekwa otu mkpụrụ okwu ahụ n’asụsụ Grik ma na-enye Igbo doro anya nke pụrụ izo aka n’otu akụkụ Akwụkwọ Nsọ ma ọ bụ n’ọgbụgba-ama ya.
- source_word: ὅτι
  choice: na
  rationale: Na-ebute ọdịnaya nke ihe ha na-aghọtabeghị.
- source_word: δεῖ
  choice: ọ dị mkpa ka
  rationale: Na-echekwa echiche nke ihe a ga-emerịrị, nke n’ebe a metụtara nzube Chineke.
- source_word: αὐτὸν
  choice: o
  rationale: A sụgharịrị ya dịka onye na-eme ihe n’ahịrịokwu infinitive ahụ n’Igbo ebumpụta ụwa.
- source_word: ἐκ νεκρῶν
  choice: si n’etiti ndị nwụrụ anwụ
  rationale: Na-egosipụta plural Grik nke ọma ma na-anọgide bụrụ okwu Igbo kwụ ọtọ banyere mbilite n’ọnwụ.
- source_word: ἀναστῆναι
  choice: bilie
  rationale: Ngwaa Grik dị n'ụdị active; ‘bilie’ na-echekwa ụdị ahụ n’etinyeghị passive.
theological_decisions:
- issue: Okwu banyere mbilite n’ọnwụ na onye mere ka ọ bilie
  choice: ọ dị mkpa ka o si n’etiti ndị nwụrụ anwụ bilie
  alternative: ọ dị mkpa ka e mee ka o si n’etiti ndị nwụrụ anwụ bilie
  rationale: Grik ji ngwaa active ἀναστῆναι, ya mere isi ederede kwesịrị igosi ‘bilie.’ Nhọrọ passive kwekọrọ n’ebe ndị ọzọ n’Agba Ọhụrụ, ma a naghị amanye ya n’amaokwu a.
translation_notes:
  register: Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E ji ‘ihe e dere n’Akwụkwọ Nsọ’ mee ka singular γραφή doo anya n’Igbo, ma ghara ikpebi ma ọ bụ otu amaokwu kpọmkwem ka ọ bụ ọgbụgba-ama Akwụkwọ Nsọ n’ozuzu.
