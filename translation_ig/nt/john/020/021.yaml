  text: εἶπεν οὖν αὐτοῖς ⸂ὁ Ἰησοῦς⸃ πάλιν· Εἰρήνη ὑμῖν· καθὼς ἀπέσταλκέν με ὁ πατήρ, κἀγὼ πέμπω ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/021.yaml
  text: So Jesus said to them again[a], “Peace to you. As the Father has sent me, even so I am sending you.”
translation:
  language: ig
  text: Ya mere, Jizọs gwara ha ọzọ, sị, “Udo dịrị unu.[a] Dị ka Nna zitere m, otú ahụ ka m na-eziga unu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Udo nye unu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Ya mere
  rationale: Ọ na-ejikọta okwu a na ihe mere tupu ya, ma na-egosikwa na okwu Jizọs sochiri ọnọdụ ahụ.
- source_word: πάλιν
  choice: ọzọ
  rationale: Ọ na-egosi na Jizọs kwughachiri ekele ahụ o kwuru n’amaokwu bu ụzọ.
- source_word: Εἰρήνη ὑμῖν
  choice: Udo dịrị unu
  rationale: Nke a bụ ekele Igbo doro anya ma dị ùgwù nke na-edobe nkenke na ọdịdị ekele nke okwu Grik na-enweghị ịgbakwụnye nkọwa.
- source_word: καθὼς
  choice: Dị ka
  rationale: Ọ na-amalite ntụnyere dị n’etiti izite Jizọs nke Nna zitere ya na izite ndị na-eso ụzọ nke Jizọs na-eziga ha.
- source_word: ἀπέσταλκέν
  choice: zitara m
  rationale: A họọrọ ụdị ngwaa zuru ezu nke Igbo; n’ọnọdụ a, ihe izite ahụ mere eme ka na-enye ọrụ Jizọs ntọala ugbu a.
- source_word: ὁ πατήρ
  choice: Nna
  rationale: Ọ na-edobe aha ahụ dịka okwu Grik si dị, na-etinyeghị ‘Nna m’ nke na-adịghị kpọmkwem na ederede.
- source_word: κἀγὼ
  choice: otu ahụ ka mụ onwe m
  rationale: Ọ na-egosipụta njikọ ntụnyere ahụ ma na-edobekwa nkwusi ike dị n’aha onye mbụ.
- source_word: πέμπω
  choice: na-eziga unu
  rationale: Ụdị ‘na-eziga’ na-egosi ọrụ izite ahụ Jizọs na-arụ ugbu a n’oge ọ na-enye ndị na-eso ụzọ ọrụ.
theological_decisions:
- issue: Mmekọrịta dị n’etiti Nna izite Jizọs na Jizọs izite ndị na-eso ụzọ ya
  choice: Dị ka Nna zitere m, otu ahụ ka mụ onwe m na-eziga unu.
  alternative: Dị nnọọ ka Nna zitere m, otú ahụ ka m na-eziga unu.
  rationale: Nsụgharị ahụ na-edobe ntụnyere gbasara ozi na ọrụ e nyere ha, ma ọ naghị ekwu na ikike, ụzọ, ma ọ bụ ọkwa nke izite abụọ ahụ hà nhata n’ụzọ niile.
translation_notes:
  register: E ji asụsụ Igbo Izugbe nke oge a, nke doro anya ma dị ùgwù. ‘Udo dịrị unu’ bụ ekele nkịtị ma kwekọọ n’ọnọdụ ahụ; ‘mụ onwe m’ na-edobe nkwusi ike nke κἀγώ.
