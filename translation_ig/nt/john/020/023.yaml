revisions:
- from: Ọ bụrụ na unu agbaghara mmehie ndị ọ bụla[a], a gbagharala ha mmehie ha; ọ bụrụ na unu ejigide ha[b], e jigideela ha.
  to: Ọ bụrụ na unu agbaghara onye ọ bụla mmehie ya[a], a gbagharala mmehie ya; ọ bụrụ na unu ejigide mmehie ya, e jigideela mmehie ya.
  rationale: The revision replaces the unclear possessive expression with idiomatic distributive Standard Igbo and explicitly retains 'sins' as the subject of each passive result. It preserves the conditional structure, plural address, perfect/resultative force, contrast between forgiving and retaining, and the unnamed passive agent. The unsupported interpretive footnote is removed.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T08:26:47Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly recognizes the conditional force of ἄν with the subjunctive, the plural address ('unu'), and the perfect-passive/resultative forms in both outcomes. However, 'mmehie ndị ọ bụla' is not idiomatic Standard Igbo for 'the sins of any [person],' and the pronouns in the main text do not consistently make clear that sins—not persons—are the grammatical subjects of the passive clauses.
  naturalness: A distributive formulation with 'onye ọ bụla' is clearer and more natural in contemporary Standard Igbo. Repeating 'mmehie ya' in the result clauses is warranted here, since it prevents 'ya' from being read as the person retained or forgiven rather than that person’s sins.
  terminology: '''Gbaghara ... mmehie'' appropriately renders forgiveness of sins. ''Ejigide mmehie'' is a suitably formal, intelligible rendering of κρατέω in contrast with forgiveness. The impersonal passives ''a gbagharala'' and ''e jigideela'' preserve the source’s unnamed agent and should not be changed to name God.'
  issues:
  - severity: medium
    issue: The phrase 'mmehie ndị ọ bụla' is structurally and idiomatically unclear.
    rationale: It can sound like 'any sins' rather than sins belonging to indefinite persons. The Greek τινων identifies the persons whose sins are in view. 'onye ọ bụla ... mmehie ya' expresses this naturally without adding an agent or theological interpretation.
  - severity: medium
    issue: The passive results are ambiguously phrased in the main text.
    rationale: In 'a gbagharala ha mmehie ha' and especially 'e jigideela ha,' the referent and syntactic role of 'ha' are unclear. Greek has 'the sins' as the subject of both perfect passives and the persons in the dative. Repeating 'mmehie ya' makes this relationship explicit in Igbo.
  - severity: low
    issue: Footnote a’s proposed dynamic alternative says only 'a gbagharala ya' / 'e jigideela ya.'
    rationale: That wording can imply that the person, rather than the person’s sins, is the item forgiven or retained. The alternative should retain 'mmehie ya' for source fidelity.
  - severity: low
    issue: Footnote b supplies an interpretive clarification rather than a translation alternative.
    rationale: Although retaining sins implies not forgiving them in context, 'ajụ ịgbaghara' introduces a refusal not stated by κρατῆτε. It is best omitted rather than presented as a lexical clarification.
  revised_text: Ọ bụrụ na unu agbaghara onye ọ bụla mmehie ya[a], a gbagharala mmehie ya; ọ bụrụ na unu ejigide mmehie ya, e jigideela mmehie ya.
  revised_footnotes:
