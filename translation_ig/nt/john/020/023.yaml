  yaml_path: translation/nt/john/020/023.yaml
  text: If you forgive the sins of any[a], they have been forgiven them; if you retain them[b], they have been retained.
translation:
  language: ig
  text: Ọ bụrụ na unu agbaghara onye ọ bụla mmehie ya[a], a gbagharala mmehie ya; ọ bụrụ na unu ejigide mmehie ya, e jigideela mmehie ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ịsụ ya n''ụzọ dị mfe karịa: “Ọ bụrụ na unu agbaghara onye ọ bụla mmehie ya, a gbagharala mmehie ya; ọ bụrụ na unu ejigide mmehie ya, e jigideela mmehie ya.” N’ahịrịokwu abụọ ahụ, Grik ji perfect passive, nke pụrụ imesi omume emezuworo na nsonaazụ ya ka dị ike.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄν τινων
  choice: Ọ bụrụ na ... ndị ọ bụla
  rationale: Ngwakọta ἄν na subjunctive na-egosi ọnọdụ a na-akọwaghị onye ọ metụtara; okwu a họọrọ na-edobe ma echiche ‘ọ bụrụ na’ ma nke ndị ọ bụla.
- source_word: ἀφῆτε
  choice: unu agbaghara
  rationale: N'ebe a ἀφίημι gbasara mmehie pụtara ịgbaghara; nke a bụ okwu Igbo nkịtị, doro anya.
- source_word: τὰς ἁμαρτίας
  choice: mmehie
  rationale: ‘Mmehie’ na-ebupụta ihe a na-agbaghara n'ụzọ dị mma n'Igbo, ebe Igbo anaghị achọ ka e gosipụta article Grik iche.
- source_word: ἀφέωνται αὐτοῖς
  choice: a gbagharala ha mmehie ha
  rationale: 'Ụdị ‘a gbagharala’ na-edobe perfect passive/resultative: ihe ahụ emezuwala, ọnọdụ ya ka dịkwa. Ikwughachi ‘mmehie ha’ na-eme ka ihe ‘ha’ na-ezo aka na ya doo anya n''Igbo n''enweghị ịkpọ onye mere omume ahụ aha.'
- source_word: κρατῆτε
  choice: unu ejigide ha
  rationale: ‘Ijigide’ na-egosi ịghara ịhapụ ma ọ bụ ịgbaghara mmehie, ma na-edobe ntụnyere megide ‘ịgbaghara.’
- source_word: κεκράτηνται
  choice: e jigideela ha
  rationale: Ụdị perfect passive a na-egosi omume emezuworo nke nsonaazụ ya ka na-adị, ma kwekọọ na ahịrịokwu mbụ.
theological_decisions:
- issue: Ma okwu a ò kwesịrị igosi na ndị na-eso ụzọ ji aka ha eme ka mgbaghara dị irè, ka ọ̀ bụ na omume ha kwekọrọ n'ihe Chineke merela.
  choice: E debere passive perfect n'okwu ‘a gbagharala’ na ‘e jigideela’ n'akpọghị onye mere omume ahụ aha.
  alternative: Ịsị kpọmkwem ‘Chineke agbagharala ha’ ma ọ bụ ‘Chineke ejigidela ha,’ ma ọ bụ iji present dị mfe kwuo na ‘a na-agbaghara ha.’
  rationale: Grik akpọghị Chineke aha dịka onye mere omume ahụ, ọ bụ ezie na passive nwere ike ime ka a ghọta ya otú ahụ. Nsụgharị ahụ na-edobe mgbagwoju anya na esemokwu nkà mmụta okpukpe dị n'isi mmalite kama idozi ya dịka otu ozizi ụka si chọọ.
translation_notes:
  register: Standard Igbo dị ugbu a, dị nsọ ma dị mfe nghọta. E ji ‘unu’ chekwaa plural nke ngwaa Grik. A họọrọ usoro passive na-enweghị ịkpọ agent aha iji chekwaa ambiguity nke isi mmalite.
