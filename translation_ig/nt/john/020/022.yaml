  yaml_path: translation/nt/john/020/022.yaml
  text: And after saying this[a], he breathed on them and said to them, “Receive the Holy Spirit.”
translation:
  language: ig
  text: Mgbe o kwusịrị nke a, ọ kuru ha ume[a], wee sị ha, “Naranụ Mmụọ Nsọ.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ọ fụnyere ha ume.” Ngwaa a na-emekwa ka a cheta okike na okike ọhụrụ, dịka dị na Jenesis 2:7 na Ezikiel 37.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο εἰπὼν
  choice: Mgbe o kwusịrị nke a
  rationale: Nkebi a na-egosi na ihe o kwuru buru ụzọ mee tupu o kuo ha ume. Ụdị a bụ Igbo dị mfe ma na-echekwa usoro ihe omume ahụ.
- source_word: ἐνεφύσησεν
  choice: ọ kuuru ha ume
  rationale: Okwu Grik a pụtara iku ume n’ahụ mmadụ ma ọ bụ ịfụnye ya ume. Nhọrọ a bụ nke e ji asụsụ Igbo nkịtị ekwu ya, ma ọ naghị ekpebi ma ume ahụ gara naanị n’ahụ ha ka ọ bụ n’ime ha.
- source_word: λέγει αὐτοῖς
  choice: sị ha
  rationale: Ọ bụ ezie na Grik ji ngwaa oge ugbu a mee akụkọ, ‘sị ha’ dabara n’usoro akụkọ Igbo ma na-enye otu ihe okwu ahụ pụtara.
- source_word: Λάβετε
  choice: Naranụ
  rationale: Ụdị iwu a na-agwa ọtụtụ mmadụ ka ha nata ihe e nyere ha. ‘Naranụ’ dabara nke ọma karịa okwu nwere ike igosi na ha ji aka ha were ya n’ike.
- source_word: πνεῦμα ἅγιον
  choice: Mmụọ Nsọ
  rationale: N’ọnọdụ a n’Oziọma Jọn, okwu ahụ na-ezo aka na Mmụọ Chineke. Igbo anaghị achọ isiokwu dịka ‘the,’ ya mere ‘Mmụọ Nsọ’ na-egosi onye a maara nke ọma n’enweghị ịgbakwunye ihe na-adịghị na Grik.
theological_decisions:
- issue: Ma πνεῦμα ἅγιον ọ̀ bụ mmụọ dị nsọ n’ozuzu ya, ka ọ̀ bụ Mmụọ Chineke
  choice: Mmụọ Nsọ
  alternative: mmụọ dị nsọ
  rationale: Ọnọdụ okwu a n’Oziọma Jọn na ojiji Agba Ọhụrụ na-akwado na ọ na-ezo aka na Mmụọ Nsọ, ọ bụghị ike ma ọ bụ mmụọ a na-akọwaghị onye ọ bụ.
- issue: Ma ἐνεφύσησεν ọ̀ ga-abụ iku ume n’ahụ ha ka ọ̀ bụ ịfụnye ha ume
  choice: ọ kuuru ha ume
  alternative: ọ fụnyere ha ume
  rationale: Isi okwu ahụ nwere ike iburu nghọta abụọ ahụ ma na-akpalite ihe oyiyi nke okike na okike ọhụrụ. Isi ederede ahọrọla okwu na-anaghị akọwa ya gabiga ókè, ebe nkọwa ala peeji na-echekwa nhọrọ nke ọzọ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta, dee ya. ‘Naranụ’ gosiri na a na-agwa ọtụtụ ndị okwu; ‘kuuru ha ume’ na-echekwa ihe okwu Grik pụtara n’enweghị ịmanye otu nkọwa naanị.
