review_pass:
  verdict: revise
  source_fidelity: The draft correctly renders the historical present with a past narrative form, preserves the perfect sense in “Ahụla m,” and retains the final clause's possible attachment to Mary's report. However, “ya” in “ndị na-eso ụzọ ya” adds an unstated possessive (“his”), whereas the Greek says simply “the disciples.”
  naturalness: “Meri Magdalin bịara na-agwa ndị na-eso ụzọ ahụ sị” is clear, idiomatic Standard Igbo for the narrative participle and its message. Retaining “na ọ gwara ya ihe ndị a” naturally permits the final clause to remain within what Mary reported.
  terminology: “Meri Magdalin,” “ndị na-eso ụzọ,” and “Onyenwe anyị” are appropriate established Standard Igbo biblical terms. “Onyenwe anyị” suitably retains the honorific and christological force of τὸν κύριον.
  issues:
  - severity: medium
    issue: The main text adds “ya” in “ndị na-eso ụzọ ya.”
    rationale: τοῖς μαθηταῖς contains no possessive pronoun. The surrounding context identifies whose disciples they are, but the translation should not add “his” in an optimal-equivalence rendering.
  - severity: low
    issue: The footnote's alternative likewise adds a possessive in “ndị na-eso ụzọ ya.”
    rationale: The alternative reading should preserve the same lack of an explicit possessive as the Greek.
