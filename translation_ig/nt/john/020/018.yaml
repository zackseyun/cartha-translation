  text: ἔρχεται ⸀Μαριὰμ ἡ Μαγδαληνὴ ⸀ἀγγέλλουσα τοῖς μαθηταῖς ὅτι ⸀Ἑώρακα τὸν κύριον καὶ ταῦτα εἶπεν αὐτῇ.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/018.yaml
  text: Mary Magdalene came announcing to the disciples[a], “I have seen the Lord,” and that he had said these things to her.
translation:
  language: ig
  text: Meri Magdalin bịara na-agwa ndị na-eso ụzọ ahụ[a] sị, “Ahụla m Onyenwe anyị,” nakwa na ọ gwara ya ihe ndị a.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ: “Meri Magdalin bịakwutere ndị na-eso ụzọ ahụ wee sị, ‘Ahụla m Onyenwe anyị,’ ọ gwakwara ya ihe ndị a.” A pụrụ ịghọta nkebi ikpeazụ dịka akụkụ nke ozi Meri, ma ọ bụ dịka nkọwa onye na-akọ akụkọ.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἔρχεται
  choice: bịara
  rationale: Ọ bụ historical present n'okwu Grik; oge gara aga bụ ụzọ Igbo kacha ebumpụta ụwa isi kọọ ihe a mere. “Bịara” na-egosikwa ngagharị ya ruo n'ebe ndị na-eso ụzọ nọ.
- source_word: Μαριὰμ ἡ Μαγδαληνὴ
  choice: Meri Magdalin
  rationale: E ji ụdị aha a maara nke ọma n'Igbo dee aha nwanyị ahụ na aha obodo e ji amata ya.
- source_word: ἀγγέλλουσα
  choice: na-agwa
  rationale: Ọ na-egosi na mgbe Meri bịara, ọ nọ na-ezisa ndị na-eso ụzọ ozi ahụ; okwu a bụ nke dị mfe ma bụrụkwa nke mmadụ nkịtị ga-aghọta.
- source_word: τοῖς μαθηταῖς
  choice: ndị na-eso ụzọ ya
  rationale: “Ndị na-eso ụzọ” bụ ntụgharị Igbo a na-ejikarị eme μαθηταί. E tinyere “ya” maka ịdị mfe nghọta n'Igbo, ebe ndị a bụ ndị na-eso ụzọ Jizọs n'akụkọ ahụ.
- source_word: ὅτι
  choice: sị
  rationale: “Sị” na-ewebata okwu Meri kwuru kpọmkwem n'ụzọ Igbo ebumpụta ụwa.
- source_word: Ἑώρακα
  choice: Ahụla m
  rationale: 'Ụdị a na-echekwa echiche perfect tense: Meri ahụla Onyenwe anyị, ihe ahụ ọ hụrụ ka dịkwa mkpa ugbu a.'
- source_word: τὸν κύριον
  choice: Onyenwe anyị
  rationale: Nke a bụ aha nsọpụrụ a na-ejikarị eme κύριος n'Igbo, ma na-echekwa ịdị arọ ya n'okwu banyere mbilite n'ọnwụ Jizọs.
- source_word: καὶ ταῦτα εἶπεν αὐτῇ
  choice: nakwa na ọ gwara ya ihe ndị a
  rationale: 'Nke a na-ewere nkebi ikpeazụ dịka akụkụ nke ozi Meri ziri: ọ gwara ha na ọ hụrụ Onyenwe anyị nakwa na Onyenwe anyị gwara ya ihe ndị a. Ọ na-echekwa taῦτα dịka “ihe ndị a.”'
theological_decisions:
- issue: Ntughari κύριος n'ọnọdụ mbilite n'ọnwụ
  choice: Onyenwe anyị
  alternative: nna ukwu
  rationale: “Onyenwe anyị” na-echekwa aha nsọpụrụ ahụ na mkpa ọ nwere banyere onye Jizọs bụ, n'emeghị ka ọ bụrụ naanị onyeisi mmadụ.
- issue: Mmekọrịta καὶ ταῦτα εἶπεν αὐτῇ na ozi Meri
  choice: 'E tinyere ya dịka akụkụ nke ihe Meri ziri: “nakwa na ọ gwara ya ihe ndị a”'
  alternative: 'Iwere ya dịka nkọwa onye na-akọ akụkọ: “Ọ gwakwara ya ihe ndị a”'
  rationale: Ọ bụ ezie na ὅτι nke abụọ adịghị na Grik, nkebi ahụ nwere ike ịga n'ihu dịka ihe dị n'ozi Meri. A hapụrụ ụzọ ọzọ n'ala ala peeji n'ihi na usoro Grik nwere ezigbo nghọtahie.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E chekwara mgbagwoju anya dị na nkebi ikpeazụ site n'ala ala peeji. Akara [a] dị n'ederede isi dịka achọrọ.
