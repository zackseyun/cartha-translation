review_pass:
  verdict: revise
  source_fidelity: The temporal sequence, showing of the hands and side, and the disciples’ resulting joy on seeing the Lord are retained. However, “akụkụ ahụ ya” can denote a body part generally and is less precise and idiomatic here than the ordinary contextual expression for “his side.”
  naturalness: The verse is otherwise clear, fluent Standard Igbo. “Akụkụ ya” is more natural in this paired reference to Jesus’ hands and side.
  terminology: “Ndị na-eso ụzọ ya,” “ṅụrịrị ọṅụ,” and “Onyenwe anyị” are established, intelligible Standard Igbo biblical renderings. No footnote is required.
  issues:
  - severity: medium
    issue: “akụkụ ahụ ya” for τὴν πλευράν
    rationale: This wording is somewhat heavy and may be understood broadly as “a part of his body,” whereas πλευρά specifically refers to his side. “Akụkụ ya” is the natural contextual Igbo expression and does not add the idea of a wound.
  revised_text: Mgbe o kwuchara nke a, o gosiri ha aka ya abụọ na akụkụ ya. Mgbe ahụ, ndị na-eso ụzọ ya ṅụrịrị ọṅụ mgbe ha hụrụ Onyenwe anyị.
