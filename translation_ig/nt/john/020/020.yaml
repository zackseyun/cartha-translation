  text: καὶ τοῦτο εἰπὼν ⸀ἔδειξεν τὰς χεῖρας καὶ τὴν πλευρὰν ⸀αὐτοῖς. ἐχάρησαν οὖν οἱ μαθηταὶ ἰδόντες τὸν κύριον.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/020.yaml
  text: And after saying this, he showed them his hands and his side. Then the disciples rejoiced when they saw the Lord.
translation:
  language: ig
  text: Mgbe o kwuchara nke a, o gosiri ha aka ya abụọ na akụkụ ya. Mgbe ahụ, ndị na-eso ụzọ ya ṅụrịrị ọṅụ mgbe ha hụrụ Onyenwe anyị.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῦτο εἰπὼν
  choice: Mgbe o kwuchara nke a
  rationale: Nkebi a na-egosi na okwu ahụ buru ụzọ mee tupu o gosi ha aka ya na akụkụ ahụ ya; “mgbe o kwuchara” bụ Igbo nkịtị nke na-edobe usoro oge ahụ.
- source_word: ἔδειξεν
  choice: o gosiri
  rationale: '“Gosiri” na-enye echiche δείκνυμι kpọmkwem: ime ka mmadụ hụ ihe.'
- source_word: τὰς χεῖρας
  choice: aka ya abụọ
  rationale: Grik ji ụdị ọtụtụ nke “aka”; Igbo “aka ya abụọ” na-eme ka ọnụọgụ ahụ doo anya ma jiri nnọchiaha nke onye nwe ihe dịka asụsụ Igbo si achọ n'ọnọdụ a.
- source_word: τὴν πλευράν
  choice: akụkụ ahụ ya
  rationale: πλευρά pụtara akụkụ ma ọ bụ akụkụ ahụ mmadụ. “Akụkụ ahụ ya” bụ okwu Igbo doro anya nke na-adịghị etinye okwu “ọnya” nke na-anọghị n'amaokwu a.
- source_word: αὐτοῖς
  choice: ha
  rationale: 'Dative a bụ ndị e gosiri ihe ahụ; n''Igbo, a na-etinye ya ozugbo n''azụ ngwaa: “gosiri ha.”'
- source_word: ἐχάρησαν
  choice: ṅụrịrị ọṅụ
  rationale: Nkebiokwu a na-egosipụta ọṅụ siri ike nke χαίρω n'ụzọ ebumpụta ụwa n'Igbo.
- source_word: οὖν
  choice: Mgbe ahụ
  rationale: N'ebe a οὖν na-akwalite akụkọ gaa n'ihe sochiri ya ma na-egosikwa ihe si n'ịhụ ya pụta; “Mgbe ahụ” na-arụ ọrụ ahụ n'Igbo nke ọma.
- source_word: οἱ μαθηταί
  choice: ndị na-eso ụzọ ya
  rationale: Nke a bụ okwu Igbo a na-ahụkarị maka ndị μαθηταί Jizọs; “ya” na-eme ka onye ha na-eso doo anya n'ọnọdụ a.
- source_word: ἰδόντες
  choice: mgbe ha hụrụ
  rationale: A tụgharịrị aorist participle ahụ dịka nkebi oge, nke na-egosi ihe kpalitere ọṅụ ha.
- source_word: τὸν κύριον
  choice: Onyenwe anyị
  rationale: “Onyenwe anyị” bụ nsụgharị Igbo a maara nke ọma maka κύριος dịka aha nsọpụrụ na aha Kraịst n'akụkọ mbilite n'ọnwụ a.
theological_decisions:
- issue: Nsụgharị κύριος
  choice: Onyenwe anyị
  alternative: Nna ukwu
  rationale: N'ọnọdụ ngosipụta Jizọs mgbe o si n'ọnwụ bilie, κύριος karịrị nanị ịkpọ onye isi ma ọ bụ onye nkuzi; “Onyenwe anyị” na-edobe ibu aha Kraịst ahụ n'enweghị ịgbakwunye nkọwa ọzọ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ usoro ahịrịokwu dị larịị ma zere okwu ụka pụrụ iche karịa ihe ederede Grik kwuru.
