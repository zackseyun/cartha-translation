id: JHN.20.14
reference: John 20:14
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸀ταῦτα εἰποῦσα ἐστράφη εἰς τὰ ὀπίσω, καὶ θεωρεῖ τὸν Ἰησοῦν ἑστῶτα, καὶ οὐκ ᾔδει ὅτι Ἰησοῦς ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/014.yaml
  text: After saying these things[a], she turned around and saw Jesus standing there, and she did not know that it was Jesus.
translation:
  language: ig
  text: Mgbe o kwusịrị ihe ndị a[a], ọ tụgharịrị azụ wee hụ Jizọs ka o guzo, ma ọ maghị na ọ bụ Jizọs.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ọ mataghị na onye ahụ bụ Jizọs.” N'ụzọ nkịtị, Grik sịrị, “ọ maghị na ọ bụ Jizọs,” na-egosi na ọ mataghị njirimara ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα
  choice: ihe ndị a
  rationale: Nnọchiaha nrụtụ aka a dị n'ụbara; “ihe ndị a” na-echekwa ụbara Grik ma na-ada ka Igbo nkịtị.
- source_word: εἰποῦσα
  choice: mgbe o kwusịrị
  rationale: Nke a bụ aorist participle nke na-egosi na okwu ahụ buru ụzọ mee tupu ọ tụgharịa; “mgbe o kwusịrị” na-egosipụta usoro ahụ n'Igbo doro anya.
- source_word: ἐστράφη εἰς τὰ ὀπίσω
  choice: ọ tụgharịrị lee azụ
  rationale: Nkebiokwu ahụ na-egosi na ọ tụgharịrị gaa n'ihe dị n'azụ ya; nsụgharị a bụ Igbo dị ndụ ma na-echekwa mmegharị ahụ.
- source_word: θεωρεῖ
  choice: hụ
  rationale: Ọ bụ historical present n'akụkọ Grik; a sụgharịrị ya dịka ihe mere eme n'Igbo, na-egosighị ihe karịrị ịhụ onye ahụ.
- source_word: ἑστῶτα
  choice: ka o guzo n'ebe ahụ
  rationale: Perfect participle ahụ kọwara ọnọdụ Jizọs ka ọ guzo; “n'ebe ahụ” na-eme ka ọnọdụ ihe ahụ pụta nke ọma n'Igbo.
- source_word: οὐκ ᾔδει
  choice: ọ maghị
  rationale: Nke a na-anọ nso na isi echiche οἶδα, ya bụ ịma; e debere echiche “ọ mataghị onye ọ bụ” dịka nkọwa ọzọ kama itinye ya n'ahịrị isi.
- source_word: ὅτι Ἰησοῦς ἐστιν
  choice: na ọ bụ Jizọs
  rationale: Nke a bụ ụzọ Igbo nkịtị si ekwu njirimara onye ahụ, ma na-echekwa na Meri amaghị na onye ahụ bụ Jizọs.
theological_decisions:
- issue: Njirimara Jizọs onye bilitere n'ọnwụ
  choice: ọ maghị na ọ bụ Jizọs
  alternative: ọ mataghị na onye ahụ bụ Jizọs
  rationale: Amaokwu ahụ kwuru na Meri amaghị njirimara onye ahụ, ma ọ kọwaghị ihe kpatara ya. Ahịrị isi na-echekwa esemokwu akụkọ ahụ n'etinyeghị nkọwa ọzọ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe nghọta ma nwee ugwu, dee ya. A họọrọ usoro okwu na-aga were were n'akụkọ, ma e chekwara ihe Grik kwuru banyere usoro omume na amaghị njirimara Jizọs.
