id: JHN.20.2
reference: John 20:2
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τρέχει οὖν καὶ ἔρχεται πρὸς Σίμωνα Πέτρον καὶ πρὸς τὸν ἄλλον μαθητὴν ὃν ἐφίλει ὁ Ἰησοῦς, καὶ λέγει αὐτοῖς· Ἦραν τὸν κύριον ἐκ τοῦ μνημείου, καὶ οὐκ οἴδαμεν ποῦ ἔθηκαν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/002.yaml
  text: So she runs and comes to Simon Peter and to the other disciple[a], whom Jesus loved, and says to them, “They have taken the Lord out of the tomb[b], and we do not know where they have laid him.”
translation:
  language: ig
  text: Ya mere, ọ gbara ọsọ bịakwute Saịmọn Pita na onye ọzọ ahụ na-eso ụzọ, onye Jizọs hụrụ n’anya[a], sị ha, “Ha ewepụla Onyenwe anyị n’ili, anyị amaghị[b] ebe ha debere ya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ngwaa Grik e ji mee okwu a sitere na φιλέω, nke nwere ike imesi mmetụta ịhụnanya ike. A pụkwara ịsụgharị ya, “onye Jizọs nwere nnọọ mmasị n’ebe ọ nọ.”
    reason: lexical_alternative
  - marker: b
    text: Meri kwuru, “anyị amaghị,” dịka okwu Grik nke na-egosi onye mbụ ọtụtụ si dị. Ụfọdụ na-aghọta na ọ gụnyere ụmụ nwanyị ndị ọzọ so ya; ma ihe odide a akọwaghị ihe kpatara o ji kwuo ya n’ụdị ọtụtụ.
    reason: alternative_reading
lexical_decisions:
- source_word: τρέχει οὖν καὶ ἔρχεται
  choice: Ya mere, ọ gbara ọsọ bịakwute
  rationale: “Ya mere” na-egosi ihe si n’ihe mere n’amaokwu bu ụzọ pụta. Igbo nkịtị ji ụdị ngwaa gara aga “ọ gbara ọsọ bịakwute” kọọ akụkọ n’ụzọ doro anya ma dị ndụ, kama ịmanye usoro ngwaa ugbu a nke Grik n’ebe ọ na-agaghị ada ka Igbo nkịtị.
- source_word: πρὸς Σίμωνα Πέτρον
  choice: bịakwute Saịmọn Pita
  rationale: πρός na-egosi ịga n’ebe mmadụ nọ; “bịakwute” na-enye echiche ahụ n’Igbo n'ụzọ ebumpụta ụwa.
- source_word: τὸν ἄλλον μαθητήν
  choice: onye ọzọ ahụ na-eso ụzọ
  rationale: Nke a na-edobe ọdịiche dị n’etiti Pita na onye ọzọ ahụ, ma na-asụgharị μαθητής n’ụzọ ndị na-agụ Igbo nke oge a ga-aghọta ngwa ngwa.
- source_word: ὃν ἐφίλει ὁ Ἰησοῦς
  choice: onye Jizọs hụrụ n’anya
  rationale: φιλέω na-egosi ịhụ mmadụ n’anya ma ọ bụ inwe mmetụta ịhụnanya n’ebe ọ nọ. “Hụrụ n’anya” bụ okwu Igbo dị ùgwù, dị mfe, nke na-adịghị eme ka mmetụta ahụ daa mbà.
- source_word: λέγει αὐτοῖς
  choice: sị ha
  rationale: “Sị ha” bụ ụzọ Igbo dị mkpirikpi ma bụrụkwa nke ebumpụta ụwa isi webata okwu kpọmkwem.
- source_word: Ἦραν τὸν κύριον ἐκ τοῦ μνημείου
  choice: Ha ewepụla Onyenwe anyị n’ili
  rationale: “Ewepụla” na-egosi ihe e mere nke nsonaazụ ya ka dị ugbu a—onye ahụ anọkwaghị n’ili. μνημεῖον n’ọnọdụ a bụ ili e liri mmadụ.
- source_word: οὐκ οἴδαμεν
  choice: anyị amaghị
  rationale: E debere onye mbụ ọtụtụ nke Grik n’enweghị ịgbanwe ya ka ọ bụrụ “amaghị m,” ya mere a naghị edozi n’ime ntụgharị onye Meri tinyere n’okwu “anyị.”
- source_word: ποῦ ἔθηκαν αὐτόν
  choice: ebe ha debere ya
  rationale: τίθημι pụtara itinye ma ọ bụ idowe. “Debere ya” bụ Igbo nkịtị nke na-egosi na a maghị ebe ahụ ya dị ugbu a.
theological_decisions:
- issue: Aha κύριος e ji kpọọ Jizọs
  choice: Onyenwe anyị
  alternative: Nna ukwu
  rationale: “Onyenwe anyị” bụ aha nsọpụrụ a na-eji kpọọ Jizọs n’Igbo, ma dabara na ọrụ κύριος dị ka aha Kraịst n’ọnọdụ akụkọ mbilite n’ọnwụ a. “Nna ukwu” nwere ike ime ka okwu ahụ bụrụ nanị aha onyeisi ma ọ bụ onye nwe mmadụ.
- issue: Ọtụtụ dị na οἴδαμεν
  choice: anyị amaghị
  alternative: amaghị m
  rationale: A hapụrụ ọtụtụ ahụ kpọmkwem dịka Grik si kwuo ya. Nke a anaghị ekpebi ma Meri ọ̀ na-agụnye ụmụ nwanyị ndị ọzọ; amaokwu ahụ n’onwe ya akọwaghị ya.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ usoro akụkọ Igbo ebumpụta ụwa, ebe e debere aha ndị mmadụ, ọtụtụ dị n’okwu Meri, na nghọtahie nke ihe odide ahụ n’enweghị ime ka ha dị larịị.
