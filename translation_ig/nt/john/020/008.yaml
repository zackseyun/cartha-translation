id: JHN.20.8
reference: John 20:8
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τότε οὖν εἰσῆλθεν καὶ ὁ ἄλλος μαθητὴς ὁ ἐλθὼν πρῶτος εἰς τὸ μνημεῖον, καὶ εἶδεν καὶ ἐπίστευσεν·
base_translation:
  language: en
  yaml_path: translation/nt/john/020/008.yaml
  text: Then the other disciple[a], who had arrived at the tomb first, also went in[b], and he saw and believed.
translation:
  language: ig
  text: Mgbe ahụ, onye na-eso ụzọ ọzọ ahụ, onye buru ụzọ bịarute n’ili ahụ, sokwa banye n’ili ahụ; ọ hụrụ ma kwere.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Asụsụ Grik na-ekwu naanị, “o kweere,” ma o kwughị kpọmkwem ihe o kweere. Ndị na-akọwa Akwụkwọ Nsọ nwere echiche dị iche iche: ụfọdụ sịrị na o kweere na Jizọs ebilitela n’ọnwụ; ụfọdụ sịrị na o kweere ihe akaebe ọ hụrụ; ndị ọzọ sịrị na o kweere akụkọ e buru ụzọ kọọrọ ya.'
    reason: alternative_reading
lexical_decisions:
- source_word: τότε οὖν
  choice: Mgbe ahụ
  rationale: Ọ na-egosi usoro ihe mere n’akụkọ ahụ, ma ọ nwekwara ntakịrị echiche nke ihe si n’ihe gara aga pụta; “Mgbe ahụ” bụ ụzọ Igbo dị mfe ma bụrụ nke e ji akọ akụkọ nke ọma.
- source_word: εἰσῆλθεν
  choice: banyekwara n’ime ya
  rationale: Ọ na-egosi na onye ahụ ọzọ sokwara banye n’ime ili ahụ. “N’ime ya” na-eme ka ebe ọ banyere doo anya n’Igbo.
- source_word: ὁ ἄλλος μαθητής
  choice: onye ahụ ọzọ na-eso ụzọ
  rationale: Nke a bụ okwu Igbo doro anya ma bụrụkwa nke a na-ejikarị akọwa μαθητής n’ọnọdụ a.
- source_word: ὁ ἐλθὼν πρῶτος εἰς τὸ μνημεῖον
  choice: bú onye buru ụzọ bịarute n’ili ahụ
  rationale: Ọ na-egosi na ọ bịarutere tupu Pita, ma na-edebe ọrụ participle ahụ n’ụzọ Igbo eke.
- source_word: μνημεῖον
  choice: ili
  rationale: N’akụkọ mbilite n’ọnwụ a, okwu ahụ na-ezo aka n’ebe e liri Jizọs; “ili” bụ okwu Igbo nkịtị, ziri ezi, ma doo anya.
- source_word: καὶ εἶδεν
  choice: ọ hụrụ
  rationale: Nke a na-asụgharị ngwaa ahụ kpọmkwem ma tinye isiokwu ya ka ahịrịokwu Igbo doo anya.
- source_word: ἐπίστευσεν
  choice: kwerekwa
  rationale: E tinyebeghị ihe o kweere n’asụsụ Grik. Ya mere, nsụgharị ahụ na-ahapụkwa ngwaa ahụ n’enweghị ihe e kwuru kpọmkwem na ọ bụ ya ka o kweere.
theological_decisions:
- issue: Ihe onye ahụ na-eso ụzọ kweere
  choice: A sụgharịrị ya naanị dị ka “kwerekwa,” n’ekwughị ihe ọ kweere.
  alternative: “o kweere na Jizọs esitela ná ndị nwụrụ anwụ bilie,” “o kweere akụkọ Meri,” ma ọ bụ “o wee nwee okwukwe”
  rationale: Asụsụ Grik ekwughị ihe okwukwe ahụ metụtara kpọmkwem. Ịgbakwunye ya ga-ekpebi ihe amaokwu ahụ hapụrụ ka ọ ghara ido anya, karịchaa ma e lee amaokwu na-esote anya.
translation_notes:
  register: Asụsụ ahụ bụ Igbo izugbe, nke oge a, dị ùgwù ma dị mfe nghọta. E ji “onye na-eso ụzọ” mee ka μαθητής bụrụ okwu eke nye ndị na-agụ Igbo taa. Akara nkọwa [a] dị n’isiokwu ahụ ma na-echekwa mgbagwoju anya dị n’okwu ἐπίστευσεν.
