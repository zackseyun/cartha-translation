- from: Mgbe ahụ, onye ahụ ọzọ na-eso ụzọ, bú onye buru ụzọ bịarute n’ili ahụ, banyekwara n’ime ya; ọ hụrụ, kwerekwa.[a]
  to: Mgbe ahụ, onye na-eso ụzọ ọzọ ahụ, onye buru ụzọ bịarute n’ili ahụ, sokwa banye n’ili ahụ; ọ hụrụ ma kwere.[a]
  rationale: The revision improves Standard Igbo idiom and clarity without altering the source's sequence or resolving the deliberately unstated content of the disciple's belief. The footnote continues to mark that ambiguity and now refers consistently to the singular disciple.
