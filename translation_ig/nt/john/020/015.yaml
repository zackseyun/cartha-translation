id: JHN.20.15
reference: John 20:15
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: λέγει ⸀αὐτῇ Ἰησοῦς· Γύναι, τί κλαίεις; τίνα ζητεῖς; ἐκείνη δοκοῦσα ὅτι ὁ κηπουρός ἐστιν λέγει αὐτῷ· Κύριε, εἰ σὺ ἐβάστασας αὐτόν, εἰπέ μοι ποῦ ἔθηκας αὐτόν, κἀγὼ αὐτὸν ἀρῶ.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/015.yaml
  text: Jesus says to her[a], “Woman, why are you weeping? Whom are you seeking?” She, supposing that he was the gardener, says to him, “Sir, if you carried him away, tell me where you put him, and I will take him away.”
translation:
  language: ig
  text: Jizọs sịrị ya, “Nwanyị, gịnị mere i ji na-ebe ákwá? Ònye ka ị na-achọ?” N’ihi na ọ chere na ọ bụ onye na-elekọta ubi ahụ, ọ sịrị ya, “Nna ukwu[a], ọ bụrụ na i bupụrụ ya, gwa m ebe i debere ya, m ga-eburu ya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Okwu Grik bụ κύριε, nke nwekwara ike ịpụta “Onyenwe.” N'ebe a, o yikarịrị ka Meri ji ya kpọọ nwoke ahụ “Nna ukwu” n'ụzọ nkwanye ùgwù, ebe ọ chere na ọ bụ onye na-elekọta ubi.
    reason: alternative_reading
lexical_decisions:
- source_word: Γύναι
  choice: Nwanyị
  rationale: Ọ bụ okwu a na-eji akpọ nwanyị ihu na ihu n'ụzọ nkwanye ùgwù n'ọnọdụ a; ọ naghị egosi nlelị, ọ naghịkwa etinye okwu ọzọ dịka “ezigbo” nke na-adịghị na Grik.
- source_word: τί κλαίεις
  choice: gịnị mere i ji ebe ákwá
  rationale: Nke a bụ ụzọ Igbo nkịtị na nke doro anya si ajụ ihe mere mmadụ ji akwa; “ebe ákwá” na-edobe ịdị arọ nke ọnọdụ ahụ.
- source_word: τίνα ζητεῖς
  choice: Ònye ka ị na-achọ?
  rationale: ζητέω pụtara ịchọ, τίνα na-ezo aka n'onye; usoro a bụ Igbo sitere n'okike ma na-edobe onye a na-achọ dị ka mmadụ.
- source_word: δοκοῦσα
  choice: Ebe ọ chere
  rationale: Ọ na-egosi echiche Meri nke mechara bụrụ ihe na-abụghị eziokwu, n'enweghị ime ka o doo ya anya karịa ihe Grik kwuru.
- source_word: ὁ κηπουρός
  choice: onye na-elekọta ubi ahụ
  rationale: Nke a na-akọwa onye ọrụ ubi n'Igbo doro anya ma bụrụkwa okwu ndị mmadụ na-aghọta ngwa ngwa.
- source_word: Κύριε
  choice: Nna ukwu[a]
  rationale: N'ọnọdụ a, Meri chere na ọ na-agwa onye na-elekọta ubi okwu, ya mere ọ bụ aha nkwanye ùgwù, ọ bụghị nkwupụta na ọ matala Jizọs dịka Onyenwe anyị. Ihe ọzọ κύριε nwere ike ịpụta ka edebere n'okpuru peeji.
- source_word: ἐβάστασας αὐτόν
  choice: ọ bụ gị bupụrụ ya
  rationale: βαστάζω nwere echiche ibu ma ọ bụ iwepụ ihe; “bupụrụ” dabara n'iwepụ ozu n'ebe ahụ ma na-adị mfe n'Igbo.
- source_word: ποῦ ἔθηκας αὐτόν
  choice: ebe i debere ya
  rationale: τίθημι bụ itinye, idowe, ma ọ bụ ịtọgbọ; “debere” bụ okwu Igbo sitere n'okike nke na-ahapụghị otú e si tinye ya ka ọ bụrụ ihe e kpebisiri ike.
- source_word: κἀγὼ αὐτὸν ἀρῶ
  choice: m ga-eburu ya
  rationale: αἴρω nwere ike ịpụta ibuli, ibu, ma ọ bụ iwepụ; “ga-eburu” na-edobe ọdịnihu na echiche Meri nke ibu ozu ahụ pụọ.
theological_decisions:
- issue: Otú e si sụgharịta κύριε mgbe Meri na-amatabeghị Jizọs bilitere n'ọnwụ
  choice: Nna ukwu
  alternative: Onyenwe anyị
  rationale: Ọ bụ ezie na κύριος na-apụtakarị “Onyenwe anyị,” ọnọdụ a na-egosi na Meri chere na nwoke ahụ bụ onye na-elekọta ubi. Ya mere, aha nkwanye ùgwù bụ nghọta kacha dabara; e debere “Onyenwe anyị” n'okpuru peeji iji gosipụta obosara okwu Grik ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. Mkparịta ụka ahụ bụ nke sitere n'okike; a zere okwu ụka pụrụ iche ebe ọnọdụ ahụ na-egosi naanị nkwanye ùgwù.
