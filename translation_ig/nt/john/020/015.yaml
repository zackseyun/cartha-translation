review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately conveys the two questions, Mary’s mistaken supposition that Jesus is the gardener, the conditional request, and her future intention. The polite rendering “Nna ukwu” for κύριε is contextually sound. However, the conditional clause needs a grammatical correction: Greek εἰ σὺ ἐβάστασας αὐτόν means “if you carried him away,” not literally “if it is you who carried him away.”'
  naturalness: “i ji ebe ákwá” is not idiomatic Standard Igbo; the customary expression is “i ji na-ebe ákwá.” The narrative participial transition is also smoother as “N’ihi na ọ chere...” in this context.
  terminology: “Nwanyị” appropriately retains the direct but non-derogatory Γύναι. “Onye na-elekọta ubi” is clear and natural for κηπουρός. “Nna ukwu” suitably expresses respectful address to the presumed gardener. The note should give the lexical alternative as “Onyenwe” rather than adding “anyị,” which is not present in κύριε.
  issues:
  - severity: medium
    issue: Non-idiomatic expression for weeping
    rationale: The draft’s “gịnị mere i ji ebe ákwá?” should be “Gịnị mere i ji na-ebe ákwá?” The latter is normal Standard Igbo and represents the present-tense κλαίεις.
  - severity: medium
    issue: Conditional clause is grammatically inaccurate in Igbo
    rationale: “ọ bụrụ na ọ bụ gị bupụrụ ya” omits the needed verbal form after the focused subject. “ọ bụrụ na ọ bụ gị bupụrụ ya” is not a safe Standard Igbo conditional; “ọ bụrụ na i bupụrụ ya” directly renders the Greek condition without unnecessary emphasis.
  - severity: low
    issue: Footnote alternative adds a possessive not explicit in Greek
    rationale: κύριε can be glossed “Onyenwe”/“Lord”; “Onyenwe anyị” adds “our,” which is not expressed by the Greek vocative.
  revised_text: Jizọs sịrị ya, “Nwanyị, gịnị mere i ji na-ebe ákwá? Ònye ka ị na-achọ?” N’ihi na ọ chere na ọ bụ onye na-elekọta ubi ahụ, ọ sịrị ya, “Nna ukwu[a], ọ bụrụ na i bupụrụ ya, gwa m ebe i debere ya, m ga-eburu ya.”
  revised_footnotes:
  - marker: a
    text: Okwu Grik bụ κύριε, nke nwekwara ike ịpụta “Onyenwe.” N'ebe a, o yikarịrị ka Meri ji ya kpọọ nwoke ahụ “Nna ukwu” n'ụzọ nkwanye ùgwù, ebe ọ chere na ọ bụ onye na-elekọta ubi.
    reason: alternative_reading
  revision_rationale: The revision corrects the idiom for weeping and the conditional verb while retaining all source-level ambiguity and the draft’s appropriate respectful register. The footnote preserves the alternative sense of κύριε without introducing the unexpressed possessive “anyị.”
