revisions:
- from: Jizọs sịrị ya, “Nwanyị, gịnị mere i ji ebe ákwá? Ònye ka ị na-achọ?” Ebe ọ chere na ọ bụ onye na-elekọta ubi ahụ, ọ sịrị ya, “Nna ukwu[a], ọ bụrụ na ọ bụ gị bupụrụ ya, gwa m ebe i debere ya, m ga-eburu ya.”
  to: Jizọs sịrị ya, “Nwanyị, gịnị mere i ji na-ebe ákwá? Ònye ka ị na-achọ?” N’ihi na ọ chere na ọ bụ onye na-elekọta ubi ahụ, ọ sịrị ya, “Nna ukwu[a], ọ bụrụ na i bupụrụ ya, gwa m ebe i debere ya, m ga-eburu ya.”
  rationale: The revision corrects the idiom for weeping and the conditional verb while retaining all source-level ambiguity and the draft’s appropriate respectful register. The footnote preserves the alternative sense of κύριε without introducing the unexpressed possessive “anyị.”
