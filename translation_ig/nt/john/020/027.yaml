  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἶτα λέγει τῷ Θωμᾷ· Φέρε τὸν δάκτυλόν σου ὧδε καὶ ἴδε τὰς χεῖράς μου, καὶ φέρε τὴν χεῖρά σου καὶ βάλε εἰς τὴν πλευράν μου, καὶ μὴ γίνου ἄπιστος ἀλλὰ πιστός.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/027.yaml
  text: Then he said to Thomas[a], “Bring your finger here and see my hands, and bring your hand and put it into my side, and do not become unbelieving, but believing.”
translation:
  language: ig
  text: Mgbe ahụ, ọ sịrị Tọmọs, “Weta mkpịsị aka gị n’ebe a, hụkwa aka m abụọ; wetakwa aka gị tinye ya n’akụkụ m. Aghọla onye na-ekweghị ekwe, kama bụrụ onye kwere ekwe.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Enwere ike ịsụgharị ya, “Aghọla onye na-adịghị ntụkwasị obi, kama bụrụ onye ntụkwasị obi.” Okwu nkọwa Grik abụọ ahụ nwere ike ịpụta ma ‘onye na-ekweghị ekwe / onye kwere ekwe’ ma ‘onye na-adịghị ntụkwasị obi / onye ntụkwasị obi.’ Ma n’ebe a, ihe e lekwasịrị anya bụ ma Tọmọs ò kwere na Jizọs bilitere n’ọnwụ.
    reason: alternative_reading
lexical_decisions:
- source_word: εἶτα
  choice: Mgbe ahụ
  rationale: Ọ na-egosi usoro ihe ndị mere n’akụkọ ahụ; okwu a bụ ụzọ Igbo dị mfe ma bụrụkwa nke a na-ejikarị egosi ‘mgbe nke ahụ gasịrị.’
- source_word: λέγει
  choice: ọ sịrị
  rationale: Ọ bụ ezie na Grik ji historical present, iji oge gara aga dabara n’ụzọ e si akọ akụkọ n’Igbo ma mee ka ahịrịokwu ahụ bụrụ ihe a na-aghọta ngwa ngwa.
- source_word: Φέρε ... φέρε
  choice: Weta ... wetakwa
  rationale: Nke a na-echekwa nkwughachi iwu abụọ dị na Grik ma na-egosi ibugharị mkpịsị aka na aka Tọmọs nso n’ebe Jizọs nọ.
- source_word: δάκτυλόν σου ὧδε
  choice: mkpịsị aka gị n’ebe a
  rationale: Ọ na-echekwa ma ihe a kpọrọ aha ma ike okwu ὧδε nke na-atụ aka n’ebe Jizọs nọ.
- source_word: ἴδε τὰς χεῖράς μου
  choice: hụkwa aka m abụọ
  rationale: ‘Hụ’ bụ okwu Igbo nkịtị maka iwu a; ‘abụọ’ na-eme ka ọtụtụ aka dị na Grik pụta ìhè n’agbanyeghị na ‘aka’ anaghị agbanwe ọdịdị ya n’Igbo.
- source_word: βάλε εἰς τὴν πλευράν μου
  choice: tinye ya n’akụkụ m
  rationale: ‘Tinye’ na-egosipụta iwu βάλε, ebe ‘n’akụkụ m’ bụ ụzọ Igbo dị nkenke isi kwuo akụkụ ahụ Jizọs a mapuru, n’enweghị ịgbanwe πλευρά ka ọ bụrụ otu akụkụ ahụ kpọmkwem dịka ọgịrịga.
- source_word: μὴ γίνου
  choice: Aghọla
  rationale: Ngwaa ‘ịghọ’ na-echekwa echiche nke γίνομαι gbasara ịbanye n’ọnọdụ, kama ime ka okwu ahụ bụrụ naanị ọnọdụ kwụ otu ebe.
- source_word: ἄπιστος ... πιστός
  choice: onye na-ekweghị ekwe ... onye kwere ekwe
  rationale: N’akụkọ a, okwu abụọ ahụ na-elekwasị anya n’ịkwere na Jizọs bilitere. Nsụgharị a na-echekwa ọdịiche ahụ n’Igbo doro anya ma hapụkwa ụzọ ọzọ lexical n’ala peeji.
theological_decisions:
- issue: Ọdịiche dị n’etiti ἄπιστος na πιστός n’ịdọ Tọmọs aka ná ntị
  choice: onye na-ekweghị ekwe / onye kwere ekwe
  alternative: onye na-ekwesịghị ntụkwasị obi / onye kwesịrị ntụkwasị obi
  rationale: Ihe gbara amaokwu ahụ gburugburu bụ na Tọmọs jụrụ ikwere akaebe banyere mbilite n’ọnwụ Jizọs ruo mgbe ọ hụrụ ya. Ya mere, isi echiche ebe a bụ ikwere; ma ala peeji na-edebe ohere lexical nke ‘enweghị ntụkwasị obi / kwesịrị ntụkwasị obi.’
translation_notes:
  register: E ji Standard Igbo nke oge a, dị nsọ ma dị mfe nghọta. E chekwara nkwughachi ‘weta ... wetakwa’ na iwu dị mkpirikpi nke okwu Grik. E tinyere akara ala peeji ozugbo n’ebe ọdịiche ἄπιστος / πιστός pụtara, ebe ọ bụ ya ka nkọwa ahụ metụtara.
