review_pass:
  verdict: revise
  source_fidelity: 'The main rendering follows the Greek sequence and imperatives closely: εἶτα is represented by “Mgbe ahụ,” the repeated Φέρε by “Weta ... wetakwa,” ὧδε by “n’ebe a,” the plural “hands” by “aka m abụọ,” and the inceptive force of μὴ γίνου by “Aghọla.” “Tinye ya n’akụkụ m” retains the directional force of βάλε εἰς and appropriately renders πλευρά as Jesus’ side.'
  naturalness: The text is clear, idiomatic Standard Igbo, with a suitably restrained biblical register. “Onye na-ekweghị ekwe ... onye kwere ekwe” naturally communicates the contextual contrast concerning Thomas’s belief.
  terminology: The principal terminology is sound. The alternative wording in the footnote, however, used “onye kwesịrị ntụkwasị obi,” which normally means someone worthy of trust rather than “faithful.” It should be adjusted so that the stated lexical alternative accurately expresses faithlessness/faithfulness.
  issues:
  - severity: medium
    issue: The footnote’s alternative “onye na-ekwesịghị ntụkwasị obi ... onye kwesịrị ntụkwasị obi” is semantically imprecise.
    rationale: In ordinary Igbo, “onye kwesịrị ntụkwasị obi” means ‘a person worthy of trust,’ not directly ‘faithful.’ The note is intended to preserve the possible ἄπιστος / πιστός sense ‘faithless / faithful,’ so its wording should reflect that contrast accurately.
  revised_text: Mgbe ahụ, ọ sịrị Tọmọs, “Weta mkpịsị aka gị n’ebe a, hụkwa aka m abụọ; wetakwa aka gị tinye ya n’akụkụ m. Aghọla onye na-ekweghị ekwe, kama bụrụ onye kwere ekwe.”[a]
