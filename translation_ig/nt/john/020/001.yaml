id: JHN.20.1
reference: John 20:1
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Τῇ δὲ μιᾷ τῶν σαββάτων Μαρία ἡ Μαγδαληνὴ ἔρχεται πρωῒ σκοτίας ἔτι οὔσης εἰς τὸ μνημεῖον, καὶ βλέπει τὸν λίθον ἠρμένον ἐκ τοῦ μνημείου.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/001.yaml
  text: On the first day of the week[a], Mary Magdalene comes to the tomb early, while it was still dark, and sees the stone having been taken away from the tomb.
translation:
  language: ig
  text: N’ụbọchị mbụ nke izu[a], Meri Magdalin bịara n’ili ahụ n’isi ụtụtụ, mgbe ọchịchịrị ka dị, wee hụ na e wepụla nkume ahụ n’ili ahụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’ụzọ nkịtị, “n’otu n’ime ụbọchị izu ike”; nke a bụ akpaala okwu pụtara “n’ụbọchị mbụ nke izu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τῇ δὲ μιᾷ τῶν σαββάτων
  choice: N’ụbọchị mbụ nke izu
  rationale: Nkebiokwu a bụ akpaala okwu Grik nke pụtara ụbọchị mbụ nke izu. Nsụgharị a na-enye ihe ọ pụtara n’Igbo dị mfe ma doo anya; a kọwara ọdịdị okwu nkịtị ya n’okpuru peeji.
- source_word: Μαρία ἡ Μαγδαληνὴ
  choice: Meri Magdalin
  rationale: A sụgharịrị aha ahụ dịka a na-akpọkarị ya n’Igbo, na-egosi Meri onye si Magdala.
- source_word: ἔρχεται
  choice: bịara
  rationale: Ọ bụ ezie na Grik ji ugbu a akụkọ ihe mere eme mee ka akụkọ dị ndụ, iji oge gara aga bụ ụzọ Igbo si akọ ihe mere n’ụzọ eke ma doo anya.
- source_word: πρωῒ
  choice: n’isi ụtụtụ
  rationale: Nke a na-egosi oge ụtụtụ dị nnọọ anya; nkebiokwu na-esote na-eme ka o doo anya na ọchịchịrị ka dị.
- source_word: σκοτίας ἔτι οὔσης
  choice: mgbe ọchịchịrị ka dị
  rationale: A tụgharịrị genitive absolute ahụ ka ọ bụrụ nkebiokwu oge dị mma n’Igbo, ma chekwaa ọnọdụ ọchịchịrị nke gara n’ihu.
- source_word: εἰς τὸ μνημεῖον
  choice: n’ili ahụ
  rationale: N’ọnọdụ a μνημεῖον bụ ili e liri mmadụ, ya mere “ili” bụ okwu Igbo doro anya ma kwekọọ na isi okwu ahụ.
- source_word: βλέπει
  choice: wee hụ
  rationale: “Hụ” na-egosipụta ịhụ ọnọdụ nkume ahụ; “wee” jikọtara ihe omume ahụ n’usoro akụkọ Igbo n’enweghị ịgbakwụnye nkọwa ọhụrụ.
- source_word: τὸν λίθον ἠρμένον
  choice: na e wepụla nkume ahụ
  rationale: Ụdị perfect passive participle na-egosi na e mechaala iwepụ nkume ahụ, ọnọdụ ya ewepụkwara ka dị mgbe Meri hụrụ ya. “E wepụla” na-echekwa ma passive ahụ ma nsonaazụ ya.
- source_word: ἐκ τοῦ μνημείου
  choice: n’ili ahụ
  rationale: N’Igbo, “wepụ ... n’ili” na-egosi nke ọma na e bugara nkume ahụ pụọ n’ebe ili ahụ, n’etinyeghị “ọnụ ụzọ,” nke isi mmalite ekwughị kpọmkwem.
theological_decisions:
- issue: Oge ngwaa n’akụkọ mbilite n’ọnwụ
  choice: Iji oge gara aga nke akụkọ Igbo (“bịara,” “wee hụ”)
  alternative: Ịṅomi historical present nke Grik site n’iji “na-abịa” na “na-ahụ”
  rationale: Historical present na-eme ka akụkọ Grik dị ndụ, ma ụdị ugbu a ga-ada ka ihe na-aga n’ihu ma ọ bụ ihe a na-eme ugboro ugboro n’Igbo. Oge gara aga na-ebuga otu ihe omume ahụ n’ụzọ eke, n’enweghị mgbanwe n’ihe mmụta okpukpe.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E jiri “ili” na “e wepụla” mee ka ọnọdụ ahụ doo anya, ma zere ịgbakwụnye na nkume ahụ si kpọmkwem n’ọnụ ụzọ ili n’ihi na isi mmalite ekwughị “ọnụ ụzọ.”
