translation_notes:
  register: E ji Standard Igbo dị ugbu a, dị ugwu ma dị mfe nghọta. Ahịrịokwu ahụ na-edobe omume na-aga n’ihu, ntụnyere ọsọ, na usoro onye mbụ rutere n’ili ahụ.
