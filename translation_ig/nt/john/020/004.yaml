  text: ἔτρεχον δὲ οἱ δύο ὁμοῦ· καὶ ὁ ἄλλος μαθητὴς προέδραμεν τάχιον τοῦ Πέτρου καὶ ἦλθεν πρῶτος εἰς τὸ μνημεῖον,
base_translation:
  language: en
  yaml_path: translation/nt/john/020/004.yaml
  text: The two were running together[a], and the other disciple ran ahead faster than Peter and came first to the tomb.
translation:
  language: ig
  text: Ha abụọ nọ na-agba ọsọ ọnụ; onye na-eso ụzọ ọzọ ahụ wee gbaa ọsọ karịa Pita[a], buru ya ụzọ rute n’ili ahụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “wee buru Pita ụzọ n’ọsọ.” Ngwaa Grik ahụ pụtara n’ụzọ nkịtị, “ịgba ọsọ buru ụzọ”; okwu “ọsọ karịa Pita” na-egosi ntụnyere ahụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔτρεχον
  choice: nọ na-agbakọ ọsọ
  rationale: Ụdị imperfect na-egosi ihe nọ na-aga n’ihu n’oge gara aga; ‘nọ na-agbakọ ọsọ’ na-egosipụta nke a n’Igbo nkịtị.
- source_word: δὲ
  choice: (ejighị okwu njikọ pụrụ iche)
  rationale: δέ bụ njikọ dị nro; usoro ahịrịokwu Igbo na-ejikọta akụkụ ndị a nke ọma n’enweghị itinye ‘ma’ nke ga-eme ka esemokwu pụta karịa ka Grik si kwuo.
- source_word: οἱ δύο ὁμοῦ
  choice: Ha abụọ ... na-agbakọ ọsọ
  rationale: ‘Ha abụọ’ na-ejide οἱ δύο, ebe ‘na-agbakọ ọsọ’ na-egosipụta na ha na-agba ọsọ ọnụ (ὁμοῦ) n’ụzọ Igbo si ekwu ya nke ọma.
- source_word: ὁ ἄλλος μαθητής
  choice: onye ọzọ ahụ na-eso ụzọ
  rationale: Nke a na-amata onye ahụ dị iche na Pita ma na-edobe μαθητής dịka ‘onye na-eso ụzọ,’ okwu a na-ahụkarị n’akụkọ Oziọma.
- source_word: προέδραμεν τάχιον τοῦ Πέτρου
  choice: wee gbaa ọsọ ọsọ karịa Pita
  rationale: 'Nke a na-edobe ntụnyere ahụ nke ọma: ọsọ onye nke ọzọ karịrị nke Pita. Ihe ọzọ e nwere ike isi kwuo ya dị n’okpuru peeji.'
- source_word: ἦλθεν πρῶτος
  choice: buru ya ụzọ rute
  rationale: ‘Buru ya ụzọ rute’ bụ ụzọ Igbo doro anya si egosi na onye nke ọzọ rutere mbụ.
- source_word: εἰς τὸ μνημεῖον
  choice: n’ili ahụ
  rationale: N’ebe a μνημεῖον bụ ebe e liri Jizọs. ‘Rute n’ili ahụ’ na-egosi iru ebe ahụ, ọ bụghị ịbanye n’ime ya, dịka amaokwu na-esote si dokwuo anya.
