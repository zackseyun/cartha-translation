source:
  edition: SBLGNT
  text: Θωμᾶς δὲ εἷς ἐκ τῶν δώδεκα, ὁ λεγόμενος Δίδυμος, οὐκ ἦν μετ’ αὐτῶν ὅτε ⸀ἦλθεν Ἰησοῦς.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/024.yaml
  text: Thomas[a], one of the Twelve, the one called Didymus, was not with them when Jesus came.
translation:
  language: ig
  text: Tọmọs, otu n’ime Ndị Iri na Abụọ, onye a na-akpọ Didimọs[a], anọghị n’etiti ha mgbe Jizọs bịara.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’asụsụ Grik, Δίδυμος pụtara “Ejima.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: E kwupụtaghị ya iche n’Igbo
  rationale: N’ebe a, δέ na-egosi naanị ntakịrị mgbanwe n’akụkọ, ọ bụghị nnukwu mmegide. Ịmalite ahịrịokwu ahụ ozugbo na “Tọmọs” na-eme ka mgbanwe ahụ doo anya n’Igbo eke n’etinyeghị okwu oge ma ọ bụ mmegide na-adịghị n’isiokwu ahụ.
- source_word: εἷς ἐκ τῶν δώδεκα
  choice: otu n’ime Ndị Iri na Abụọ
  rationale: Nke a na-egosi na Tọmọs bụ otu onye n’òtù ndịozi a maara dịka Ndị Iri na Abụọ; mkpụrụedemede ukwu na-egosi na ọ bụ aha òtù.
- source_word: ὁ λεγόμενος Δίδυμος
  choice: onye a na-akpọ Didimọs[a]
  rationale: E degharịrị Δίδυμος dịka aha Grik a na-akpọ ya, ma nkọwa ya, “Ejima,” dị n’ala peeji ka onye na-agụ ya ghọta ihe aha ahụ pụtara n’enweghị ịgbanwe aha ahụ n’ahụ amaokwu.
- source_word: οὐκ ἦν μετ’ αὐτῶν
  choice: anọghị n’etiti ha
  rationale: Nke a bụ ụzọ Igbo dị mfe ma bụrụ nke eke isi kwuo na Tọmọs anọghị n’ebe ndị ọzọ ahụ nọ n’oge ahụ.
- source_word: ὅτε ἦλθεν Ἰησοῦς
  choice: mgbe Jizọs bịara
  rationale: Ọ na-asụgharị nkebiokwu Grik ahụ ozugbo ma na-ahapụ ihe gbara ọbịbịa Jizọs gburugburu ka ọnọdụ akụkọ kọwaa ya.
theological_decisions:
- issue: Otú e si sụgharịa Δίδυμος
  choice: Debe ya dịka “Didimọs,” tinyekwa nkọwa “Ejima” n’ala peeji.
  alternative: Sụgharịa ya n’ahụ amaokwu dịka “Ejima.”
  rationale: Δίδυμος bụ aha/aha nkọwa Grik nwere ihe ọ pụtara. Idegharị ya dịka “Didimọs” na-echekwa ụdị aha dị n’ederede ahụ, ebe nkọwa ala peeji na-eme ka ihe ọ pụtara doo onye na-agụ ya anya. Nhọrọ a anaghị etinye nkọwa okwukwe pụrụ iche.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị mfe ma dị ugwu mee ihe. “Ndị Iri na Abụọ” bụ aha òtù a maara nke ọma; e zere okwu njikọ nke ga-eme ka δέ bụrụ mmegide siri ike ma ọ bụ okwu na-egosi oge.
