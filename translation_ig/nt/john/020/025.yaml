revisions:
- from: Ya mere, ndị na-eso ụzọ ndị ọzọ nọ na-agwa ya, “Anyị ahụla Onyenwe anyị.” Ma ọ sịrị ha, “Ọ bụrụ na ahụghị m akara ntu ndị ahụ n’aka ya, tinye mkpịsị aka m n’akara ntu ndị ahụ, tinyekwa aka m n’akụkụ ya, agaghị m ekwere ma ọlị.”[a]
  to: Ya mere, ndị na-eso ụzọ ndị ọzọ nọ na-agwa ya, “Anyị ahụla Onyenwe anyị.” Ma ọ sịrị ha, “Ma ọ bụrụ na m ahụghị n’aka ya akara ntu, ma m etinye mkpịsị aka m n’akara ntu, ma m etinye aka m n’akụkụ ya, agaghị m ekwere ma ọlị.”[a]
  rationale: The revision clarifies that all three actions are Thomas’s own first-person conditions, removes an unsupported demonstrative, and anchors the explanatory note directly to the emphatic negative. It otherwise retains the draft’s sound rendering of the source and its modern Standard Igbo register.
