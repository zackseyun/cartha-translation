id: JHN.20.25
reference: John 20:25
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἔλεγον οὖν αὐτῷ οἱ ἄλλοι μαθηταί· Ἑωράκαμεν τὸν κύριον. ὁ δὲ εἶπεν αὐτοῖς· Ἐὰν μὴ ἴδω ἐν ταῖς χερσὶν αὐτοῦ τὸν τύπον τῶν ἥλων καὶ βάλω τὸν δάκτυλόν μου εἰς τὸν τύπον τῶν ἥλων καὶ βάλω ⸂μου τὴν χεῖρα⸃ εἰς τὴν πλευρὰν αὐτοῦ, οὐ μὴ πιστεύσω.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/025.yaml
  text: So the other disciples were telling him[a], “We have seen the Lord.” But he said to them, “Unless I see in his hands the mark of the nails, and put my finger into the mark of the nails, and put my hand into his side, I will certainly not believe.”
translation:
  language: ig
  text: Ya mere, ndị na-eso ụzọ ndị ọzọ nọ na-agwa ya, “Anyị ahụla Onyenwe anyị.” Ma ọ sịrị ha, “Ma ọ bụrụ na m ahụghị n’aka ya akara ntu, ma m etinye mkpịsị aka m n’akara ntu, ma m etinye aka m n’akụkụ ya, agaghị m ekwere ma ọlị.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “agaghị m ekwere mgbe ọ bụla.” Okwu Grik ahụ nwere nkwụsị siri ike.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγον
  choice: nọ na-agwa
  rationale: Oge imperfect na-egosi ihe ndị na-eso ụzọ ahụ nọgidere ma ọ bụ ugboro ugboro na-agwa Tọmọs; nkebi a na-egosipụta omume ahụ na-aga n’ihu n’oge gara aga.
- source_word: οὖν
  choice: Ya mere
  rationale: Na-ejigide njikọ akụkọ na ihe mere tupu nke a, n’ụzọ doro anya n’Igbo.
- source_word: οἱ ἄλλοι μαθηταί
  choice: ndị na-eso ụzọ ndị ọzọ
  rationale: Nke a na-asụgharị okwu Grik ahụ ozugbo ma mee ka ọdịiche dị n’etiti Tọmọs na ndị ọzọ doo anya.
- source_word: Ἑωράκαμεν
  choice: Anyị ahụla
  rationale: Ụdị perfect na-egosi ihe mere eme nke ka nwere mkpa ugbu a; perfect Igbo a na-ejigide nghọta ahụ.
- source_word: κύριον
  choice: Onyenwe anyị
  rationale: Aha nsọpụrụ a na-ezo aka na Jizọs bilitere n’ọnwụ, ọ bụghị naanị onyeisi ma ọ bụ nna ukwu.
- source_word: Ἐὰν μὴ ἴδω
  choice: Ọ bụrụ na ahụghị m
  rationale: Nke a bụ ụzọ Igbo dị ndụ si kwuo ọnọdụ na-adịghị mma nke Grik ahụ n’enweghị ịgbanwe ihe ọ pụtara.
- source_word: ἐν ταῖς χερσὶν αὐτοῦ
  choice: n’aka ya
  rationale: Igbo na-ejikarị otu ‘aka’ akọwa aka mmadụ abụọ dịka akụkụ ahụ n’ozuzu; ọ dabara n’okwu banyere akara dị n’aka.
- source_word: τύπον
  choice: akara
  rationale: N’ebe a τύπος bụ akara ma ọ bụ mmetụta ntu hapụrụ; ‘akara’ bụ okwu doro anya ma bụrụkwa nke mmadụ niile na-aghọta.
- source_word: ἥλων
  choice: ntu ndị ahụ
  rationale: Ọ na-egosi ntu ndị kpọgidere Jizọs; iji ‘ndị ahụ’ na-eme ka ntụaka ahụ bụrụ nke doro anya n’Igbo.
- source_word: βάλω
  choice: tinye
  rationale: N’ọnọdụ a, ‘tinye’ na-egosi mmegharị banye n’ime dịka εἰς si chọọ, ma dịkwa mma n’Igbo.
- source_word: τὸν δάκτυλόν μου εἰς
  choice: tinye mkpịsị aka m n’
  rationale: ‘Mkpịsị aka m’ na-ejigide ihe ahụ e kwuru kpọmkwem, ebe ‘tinye ... n’akara’ na-egosi mmegharị banye n’ebe akara ahụ dị.
- source_word: μου τὴν χεῖρα
  choice: aka m
  rationale: Na-ejigide nnọchiaha nke onye nwe ihe nke Grik kwuru hoo haa.
- source_word: τὴν πλευρὰν αὐτοῦ
  choice: akụkụ ya
  rationale: πλευρά nwere ike ịpụta akụkụ ahụ ma ọ bụ ebe ọgịrịga dị; ‘akụkụ ya’ na-edobe obosara okwu ahụ n’ebughị nkọwa ọzọ bata.
- source_word: οὐ μὴ πιστεύσω
  choice: agaghị m ekwere ma ọlị
  rationale: ‘Ma ọlị’ na-egosipụta nkwuwa okwu siri ike nke οὐ μή n’Igbo nke oge a, n’emeghị ka ọ bụrụ nkwupụta na-adịru mgbe ebighị ebi.
theological_decisions:
- issue: Ike nkwụsị Tọmọs n’okwu οὐ μὴ πιστεύσω
  choice: agaghị m ekwere ma ọlị
  alternative: agaghị m ekwere mgbe ọ bụla
  rationale: Οὐ μή bụ nkwụsị siri ike. ‘Ma ọlị’ na-edobe ike ahụ n’okpuru ọnọdụ Tọmọs kwuru, ebe ‘mgbe ọ bụla’ nwere ike ime ka ọ dị ka mkpebi na-agaghị agbanwe agbanwe ruo mgbe ebighị ebi.
- issue: Ihe πλευρά na-akọwa n’ahụ Jizọs
  choice: akụkụ ya
  alternative: ọgịrịga ya
  rationale: ‘Akụkụ ya’ na-edobe ntụgharị sara mbara nke okwu Grik; ‘ọgịrịga ya’ nwere ike ime ka okwu ahụ kọwaa otu akụkụ ahụ kpọmkwem karịa isi mmalite si kwuo.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta mee ntụgharị a. A họọrọ usoro ahịrịokwu na okwu ndị nkịtị ga-aghọta, ma e jigidere nkwughachi ‘akara ntu ndị ahụ’ na ike nke nkwụsị Tọmọs dịka ha dị na Grik.
