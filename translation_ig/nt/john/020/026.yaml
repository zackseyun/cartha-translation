id: JHN.20.26
reference: John 20:26
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Καὶ μεθ’ ἡμέρας ὀκτὼ πάλιν ἦσαν ἔσω οἱ μαθηταὶ αὐτοῦ καὶ Θωμᾶς μετ’ αὐτῶν. ἔρχεται ὁ Ἰησοῦς τῶν θυρῶν κεκλεισμένων, καὶ ἔστη εἰς τὸ μέσον καὶ εἶπεν· Εἰρήνη ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/026.yaml
  text: And after eight days, his disciples were inside again, and Thomas was with them. Jesus comes, though the doors had been shut, and stood in the midst and said, “Peace to you.”
translation:
  language: ig
  text: Mgbe ụbọchị asatọ gachara, ndị na-eso ụzọ ya nọkwa n'ime, Tọmọs sokwa ha. Jizọs bịara, n'agbanyeghị na e mechiri ọnụ ụzọ ndị ahụ, guzoro n'etiti ha, sị, “Udo dịrị unu.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μεθ’ ἡμέρας ὀκτώ
  choice: Mgbe ụbọchị asatọ gachara
  rationale: Na-edobe ụzọ Gris si gụọ oge ahụ n'ụzọ Igbo doro anya, n'agbanyeghị na ọ nwere ike izo aka n'ụbọchị Sọnde sochirinụ.
- source_word: ἔσω
  choice: n'ime ụlọ ahụ
  rationale: ‘N'ime’ bụ isi ihe okwu ahụ pụtara; ‘ụlọ ahụ’ na-eme ka okwu Igbo zuo oke n'ọnọdụ a.
- source_word: ἔρχεται
  choice: bịara
  rationale: Ọ bụ ugbu a akụkọ ihe mere eme n'asụsụ Gris; oge gara aga na-ada ka Igbo akụkọ nkịtị ma ghara ịgbanwe ihe omume ahụ.
- source_word: τῶν θυρῶν κεκλεισμένων
  choice: mgbe e mechiri ụzọ niile
  rationale: Na-egosi ọnọdụ ụzọ ndị ahụ ka e mechiri emechi, n'ekwughị ihe ederede na-ekwughị banyere otú Jizọs si bata.
- source_word: Εἰρήνη ὑμῖν
  choice: Udo dịrị unu
  rationale: Ekele Igbo sitere n'okike nke na-edobe ma echiche ekele ma onyinye udo dị n'okwu Gris.
theological_decisions:
- issue: Otu Jizọs si bata mgbe ụzọ mechiri emechi
  choice: E kwughị na ọ gafere n'ụzọ ọrụ ebube; naanị ọnọdụ ụzọ ka e kwuru.
  alternative: ‘N'agbanyeghị na e mechiri ụzọ’ ma ọ bụ ịkọwa na ọ gafere n'ọnụ ụzọ ahụ.
  rationale: Gris na-ekwu na ụzọ mechiri emechi mgbe Jizọs bịara, ma ọ kọwaghị usoro o si bata; nsụgharị ahụ echekwala enweghị nkọwa a.
- issue: Oge ngwaa ἔρχεται
  choice: bịara
  alternative: ‘na-abịa’
  rationale: A ghọtara ya dị ka ugbu a akụkọ ihe mere eme; Igbo gara aga na-enye akụkọ eke n'ebughị nkọwa nkà mmụta okpukpe ọhụrụ.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. A họọrọ ‘ndị na-eso ụzọ’ kama okwu mgbazinye ma ọ bụ okwu ụka pụrụ iche; ahịrịokwu ahụ na-aga dịka akụkọ Igbo nkịtị.
