id: JHN.20.6
reference: John 20:6
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἔρχεται οὖν ⸀καὶ Σίμων Πέτρος ἀκολουθῶν αὐτῷ, καὶ εἰσῆλθεν εἰς τὸ μνημεῖον· καὶ θεωρεῖ τὰ ὀθόνια κείμενα,
base_translation:
  language: en
  yaml_path: translation/nt/john/020/006.yaml
  text: Then Simon Peter also came[a], following him, and entered into the tomb; and he sees the linen cloths lying there,
translation:
  language: ig
  text: Mgbe ahụ, Saịmọn Pita bịakwara[a], na-eso ya, wee banye n’ili ahụ; ọ hụkwara ákwà linin ndị ahụ ka ha tọgbọ n’ebe ahụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’asụsụ Grik, “bịa” na “hụ” dị n’ụdị ngwaa ugbu a e ji akọ ihe mere eme; e jiri ụdị gara aga sụgharịa ha n’ebe a ka akụkọ ahụ wee na-aga nke ọma n’Igbo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχεται
  choice: bịakwara
  rationale: A na-eji ngwaa gara aga mee ka akụkọ ahụ na-aga nke ọma n’Igbo; -kwara na-egosikwa echiche nke καὶ na Saịmọn Pita bịakwara dịka onye ọzọ ahụ bịara.
- source_word: οὖν
  choice: Mgbe ahụ
  rationale: Ọ na-egosi nzọụkwụ na-esote n’usoro akụkọ ahụ n’ụzọ doro anya ma dịkwa mma n’Igbo.
- source_word: καὶ Σίμων Πέτρος
  choice: Saịmọn Pita bịakwara
  rationale: 'Mgbakwunye -kwara na-ebute nghọta additive nke καὶ: Saịmọn Pita bịakwara, ọ bụghị nanị onye na-eso ụzọ nke ọzọ.'
- source_word: ἀκολουθῶν αὐτῷ
  choice: na-eso ya
  rationale: Nke a na-echekwa omume na-aga n’otu oge ahụ na isi omume, ma na-ada ka Igbo nkịtị.
- source_word: εἰσῆλθεν εἰς τὸ μνημεῖον
  choice: wee banye n’ili ahụ
  rationale: ‘Banye n’ili ahụ’ na-egosi ngagharị ịbanye n’ime ebe e liri mmadụ, dịka εἰς si mee.
- source_word: θεωρεῖ
  choice: ọ hụkwara
  rationale: N’agbanyeghị na Grik ji historical present, usoro ngwaa gara aga bụ nke kacha kwekọọ n’akụkọ Igbo; -kwara na-ejikọta ihe ọ hụrụ na mbata ya.
- source_word: τὰ ὀθόνια
  choice: ákwà linin ndị ahụ
  rationale: Nke a bụ ntụgharị lexical doro anya nke ákwà ndị e ji linin mee, n’agbanyeghị na ọnọdụ akụkọ na-egosi na ha bụ ákwà olili.
- source_word: κείμενα
  choice: ka ha tọgbọ n’ebe ahụ
  rationale: Ọ na-akọwa ákwà ndị ahụ dịka ihe dị n’ọnọdụ ịtọgbọ n’ebe ahụ, na-enweghị ikwu onye tinyere ha otú ahụ.
theological_decisions: []
translation_notes:
  register: Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta. E ji “ili” mee ihe maka μνημεῖον n’ọnọdụ olili a; e zere ịgbakwunye nkọwa ụka ma ọ bụ ozizi na-adịghị na isi mmalite.
