id: JHN.20.16
reference: John 20:16
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: λέγει ⸀αὐτῇ Ἰησοῦς· ⸀Μαριάμ. στραφεῖσα ἐκείνη λέγει αὐτῷ ⸀Ἑβραϊστί· Ραββουνι (ὃ λέγεται Διδάσκαλε).
base_translation:
  language: en
  yaml_path: translation/nt/john/020/016.yaml
  text: Jesus says to her[a], “Mary.” Turning, she says to him in Hebrew, “Rabboni!” (which means, “Teacher”).
translation:
  language: ig
  text: Jizọs sịrị ya, “Meri.” Mgbe ọ tụgharịrị, ọ sịrị ya n’asụsụ Hibru[a], “Rabuni!” (nke pụtara, “Onye Ozizi”).
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “n’asụsụ Arameik.” Okwu Jọn kpọrọ “n’asụsụ Hibru” pụrụ izo aka n'ụzọ sara mbara n’asụsụ Semitik ndị mmadụ na Judia na-asụ.
    reason: alternative_reading
lexical_decisions:
- source_word: λέγει
  choice: sịrị
  rationale: Igbo ordinarily narrates a past event with the past tense; this is natural and clear while retaining the direct, vivid speech.
- source_word: αὐτῇ
  choice: ya
  rationale: The Igbo object pronoun naturally conveys “to her” after the verb of speaking.
- source_word: Μαριάμ
  choice: Meri
  rationale: Uses the established, readily understood Igbo form of the personal name.
- source_word: στραφεῖσα
  choice: Mgbe ọ tụgharịrị
  rationale: Expresses the aorist participle naturally and preserves the sequence of her turning and speaking.
- source_word: ἐκείνη
  choice: ọ
  rationale: In context the demonstrative functions as the subject, naturally represented by the Igbo third-person pronoun.
- source_word: Ἑβραϊστί
  choice: n’asụsụ Hibru
  rationale: Follows the explicit Greek wording “in Hebrew”; the possible broader reference to Aramaic is retained in a footnote.
- source_word: Ραββουνι
  choice: Rabuni
  rationale: Transliterates the address rather than replacing it, since the Gospel itself immediately supplies its meaning.
- source_word: ὃ λέγεται Διδάσκαλε
  choice: nke pụtara, “Onye Ozizi”
  rationale: Naturally introduces the explanatory gloss and renders the vocative Διδάσκαλε as the standard Igbo title for a teacher.
theological_decisions:
- issue: Meaning of Ἑβραϊστί in Johannine usage
  choice: n’asụsụ Hibru
  alternative: n’asụsụ Arameik
  rationale: The main text follows the Greek form without silently deciding the historical linguistic question; the plausible Aramaic interpretation is noted separately.
translation_notes:
  register: Standard Igbo in a natural, dignified narrative register. The wording avoids stiffness, preserves the source-language gloss, and keeps the linguistic ambiguity visible through the footnote.
source_grounding:
  english_pob_role: consult_only
