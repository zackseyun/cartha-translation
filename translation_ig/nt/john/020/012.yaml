revisions:
- from: Ọ hụkwara ndị mmụọ ozi abụọ yi uwe ọcha[a] ka ha nọ ọdụ, otu n’akụkụ isi, otu n’akụkụ ụkwụ, n’ebe ahụ́ Jizọs tọgbọrọ na mbụ.[b]
  to: Ọ hụrụ ndị mmụọ ozi abụọ yi uwe ọcha[a] ka ha nọ ọdụ, otu n’akụkụ isi, nke ọzọ n’akụkụ ụkwụ, n’ebe ahụ ahụ Jizọs dina na mbụ.[b]
  rationale: The revision explicitly restores “the body of Jesus,” removes an unwarranted additive nuance from the opening verb, and improves the footnote phrasing. It preserves the source’s ambiguity regarding the exact temporal force of the imperfect while allowing the contextual prior state to be expressed by “na mbụ.”
  reviewer_model: gpt-5.6-terra
