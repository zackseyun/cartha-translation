review_pass:
  verdict: revise
  source_fidelity: 'The draft correctly identifies the two heavenly angels, their white attire, seated posture, and their positions at the head and feet. However, the final clause needs revision: the Greek explicitly says that Jesus’ body lay there, whereas the current wording is liable to be read as saying that Jesus himself lay there. The additive force of -kwara (“also”) in Ọ hụkwara is not required by καί.'
  naturalness: The revised wording uses clear, modern Standard Igbo. “Ahụ Jizọs” retains the explicit reference to the body without the sharper connotation of ozu (“corpse”), and “dina na mbụ” naturally represents the contextual prior state.
  terminology: Ndị mmụọ ozi is the appropriate contextual rendering of ἀγγέλους. Yi uwe ọcha is natural and suitably precise for ἐν λευκοῖς. Ahụ Jizọs is retained for σῶμα τοῦ Ἰησοῦ rather than ozu, and no doctrinal interpretation is added.
  issues:
  - severity: medium
    issue: The wording “n’ebe ahụ́ Jizọs tọgbọrọ na mbụ” does not explicitly retain “the body of Jesus.”
    rationale: The source has τὸ σῶμα τοῦ Ἰησοῦ. In Igbo, the current phrasing can be understood as “where Jesus lay,” which loses the source’s explicit noun and may be misleading in the empty-tomb setting.
  - severity: low
    issue: Ọ hụkwara introduces an unnecessary additive nuance.
    rationale: The suffix -kwara commonly means “also,” while καί here simply continues the narrative. Ọ hụrụ preserves the sense without that addition.
  - severity: low
    issue: Footnote a’s proposed alternative and literal explanation are awkward in Igbo.
    rationale: “Yi ihe ọcha” is less idiomatic for attire, and “n’ime ọcha” is not a helpful literal explanation. “N’uwe ọcha” and “n’ọcha” communicate the lexical alternative clearly.
  revised_text: Ọ hụrụ ndị mmụọ ozi abụọ yi uwe ọcha[a] ka ha nọ ọdụ, otu n’akụkụ isi, nke ọzọ n’akụkụ ụkwụ, n’ebe ahụ ahụ Jizọs dina na mbụ.[b]
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “n’uwe ọcha.” N’ụzọ nkịtị, Grik kwuru, “n’ọcha.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “n’ebe ahụ ahụ Jizọs dina.” Oge imperfect nke Grik nwere ike ịsụgharị n’ụzọ dị mfe otú a; “na mbụ” na-eme ka ọnọdụ gara aga pụta ìhè n’ọnọdụ akụkọ a.
    reason: lexical_alternative
  revision_rationale: The revision explicitly restores “the body of Jesus,” removes an unwarranted additive nuance from the opening verb, and improves the footnote phrasing. It preserves the source’s ambiguity regarding the exact temporal force of the imperfect while allowing the contextual prior state to be expressed by “na mbụ.”
