  text: καὶ θεωρεῖ δύο ἀγγέλους ἐν λευκοῖς καθεζομένους, ἕνα πρὸς τῇ κεφαλῇ καὶ ἕνα πρὸς τοῖς ποσίν, ὅπου ἔκειτο τὸ σῶμα τοῦ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/012.yaml
  text: and she sees two angels in white sitting[a], one at the head and one at the feet[b], where the body of Jesus had been lying.
translation:
  language: ig
  text: Ọ hụrụ ndị mmụọ ozi abụọ yi uwe ọcha[a] ka ha nọ ọdụ, otu n’akụkụ isi, nke ọzọ n’akụkụ ụkwụ, n’ebe ahụ ahụ Jizọs dina na mbụ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’uwe ọcha.” N’ụzọ nkịtị, Grik kwuru, “n’ọcha.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “n’ebe ahụ ahụ Jizọs dina.” Oge imperfect nke Grik nwere ike ịsụgharị n’ụzọ dị mfe otú a; “na mbụ” na-eme ka ọnọdụ gara aga pụta ìhè n’ọnọdụ akụkọ a.
    reason: lexical_alternative
lexical_decisions:
- source_word: θεωρεῖ
  choice: ọ hụkwara
  rationale: A họọrọ ngwaa dị mfe ma bụrụ nke a na-anụkarị n’Igbo maka ịhụ ihe. Ọ bụ ezie na Grik ji oge ugbu a mee akụkọ ahụ ka ọ dị ndụ, oge gara aga na njikọ “-kwara” na-aga nke ọma n’usoro akụkọ Igbo.
- source_word: ἀγγέλους
  choice: ndị mmụọ ozi
  rationale: N’ọnọdụ ili tọgbọ chakoo na uwe ọcha, okwu a na-ezo aka n’ụmụ mmụọ si n’eluigwe, ọ bụghị nanị ndị ozi mmadụ.
- source_word: ἐν λευκοῖς
  choice: yi uwe ọcha
  rationale: Grik kwuru nkenke “n’ime ọcha.” N’Igbo, “yi uwe ọcha” na-enye otu echiche ahụ n’ụzọ doro anya ma dị mma.
- source_word: καθεζομένους
  choice: ka ha nọ ọdụ
  rationale: Nke a na-akọ ọnọdụ ahụ ndị mmụọ ozi nọ na ya, n’enweghị ịgbakwụnye okwu ebe na-adịghị na Grik.
- source_word: ἕνα πρὸς τῇ κεφαλῇ καὶ ἕνα πρὸς τοῖς ποσίν
  choice: otu n’akụkụ isi, otu n’akụkụ ụkwụ
  rationale: “N’akụkụ” na-egosi ịdị nso n’isi na n’ụkwụ nke ebe ahụ́ ahụ́ dina, ma ọ naghị eme ka ọnọdụ ahụ doo anya karịa ka Grik mere.
- source_word: ἔκειτο τὸ σῶμα τοῦ Ἰησοῦ
  choice: ahụ́ Jizọs tọgbọrọ na mbụ
  rationale: “Ahụ́” na-asụgharị σῶμα n’ụzọ kwanyere ùgwù; “tọgbọrọ na mbụ” na-eme ka o doo anya na nke a bụ ọnọdụ dịbu tupu Meri ahụ ndị mmụọ ozi ahụ.
theological_decisions:
- issue: Ụdị ndị ἀγγέλους bụ
  choice: ndị mmụọ ozi si n’eluigwe
  alternative: ndị ozi
  rationale: Ọnọdụ mbilite n’ọnwụ, ili tọgbọ chakoo, na uwe ọcha na-egosi na ndị a bụ ndị mmụọ ozi; mkpebi a sitere n’ọnọdụ okwu ahụ, ọ bụghị n’ozizi otu ụka.
- issue: Ike oge nke ἔκειτο
  choice: ọnọdụ ahụ́ Jizọs dịbu, e gosiri ya site na “tọgbọrọ na mbụ”
  alternative: “ahụ́ Jizọs tọgbọrọ”
  rationale: Oge imperfect nke Grik nwere ike ịbụ naanị “tọgbọrọ,” ma “na mbụ” na-enyere onye na-agụ Igbo aka ịhụ na ahụ́ ahụ adịghịzi ebe ahụ, n’enweghị ịgbakwụnye nkwupụta ozizi ọzọ.
translation_notes:
  register: E ji Igbo Izugbe dị ugbu a, nke dị ùgwù ma dị mfe nghọta. E debere ahịrịokwu ahụ n’usoro akụkọ Igbo nkịtị, ma e jighị okwu ụka pụrụ iche ma ọ bụ nkọwa ozizi agbakwunyere.
