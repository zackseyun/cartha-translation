id: JHN.20.19
reference: John 20:19
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Οὔσης οὖν ὀψίας τῇ ἡμέρᾳ ἐκείνῃ τῇ ⸀μιᾷ σαββάτων, καὶ τῶν θυρῶν κεκλεισμένων ὅπου ἦσαν οἱ ⸀μαθηταὶ διὰ τὸν φόβον τῶν Ἰουδαίων, ἦλθεν ὁ Ἰησοῦς καὶ ἔστη εἰς τὸ μέσον, καὶ λέγει αὐτοῖς· Εἰρήνη ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/019.yaml
  text: So when it was evening on that day[a], the first day of the week, and the doors had been locked where the disciples were because of fear of the Jews, Jesus came and stood in the midst of them and said to them[b], “Peace to you.”
translation:
  language: ig
  text: Ya mere, mgbe mgbede ruru n’ụbọchị ahụ, bú ụbọchị mbụ n’izu, ọnụ ụzọ emechiela n’ebe ndị na-eso ụzọ nọ n’ihi egwu ndị Juu[a], Jizọs bịara guzoro n’etiti ha, sị ha, “Udo dịrị unu.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma eleghị anya, “ndị isi ndị Juu” ma ọ bụ “ndị Judia,” dabere n’otú e si aghọta okwu Grik Ἰουδαῖοι n’ọnọdụ a.
    reason: alternative_reading
  - marker: b
    text: A pụkwara ịsị, “Ka udo dịrị unu.” N’okwu nkịtị, Grik sịrị, “Udo nye unu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὔσης ... ὀψίας
  choice: mgbe o ruru ná mgbede
  rationale: Nkebiokwu oge a na-egosi ọnọdụ oge; ntụgharị a bụ Igbo e ji eme ihe nke ọma ma na-edobe ihe Grik pụtara.
- source_word: οὖν
  choice: Ya mere
  rationale: Na-ejikọta akụkọ a na ihe bu ya ụzọ ma na-egosi ntakịrị nkwubi okwu ma ọ bụ usoro akụkọ.
- source_word: τῇ ἡμέρᾳ ἐκείνῃ
  choice: n’ụbọchị ahụ
  rationale: Na-egosi kpọmkwem oge ihe ahụ mere.
- source_word: τῇ μιᾷ σαββάτων
  choice: ụbọchị mbụ n’izu
  rationale: Nke a bụ ụzọ doro anya ma bụrụ nke ndị Igbo na-aghọta maka okwu Grik na-ezo aka n’ụbọchị mbụ nke izu.
- source_word: τῶν θυρῶν κεκλεισμένων
  choice: e mechichara ọnụ ụzọ
  rationale: Na-egosi na emechiela ọnụ ụzọ ma ha ka nọ n’ọnọdụ ahụ; okwu Igbo a anaghị ekwusi ike na a kpọchiri ha mkpọchi ebe Grik nwere ike ịpụta imechi ma ọ bụ ịkpọchi.
- source_word: ὅπου ἦσαν οἱ μαθηταὶ
  choice: ebe ... ndị na-eso ụzọ Jizọs nọ
  rationale: Na-edobe echiche ọnọdụ dị mfe; etinyere ‘Jizọs’ iji mee ka nkebiokwu ahụ doo anya n’Igbo, n’enweghị ịgbakwunye na ha zukọtara ma ọ bụ biri ebe ahụ.
- source_word: μαθηταὶ
  choice: ndị na-eso ụzọ Jizọs
  rationale: Ọ bụ okwu Igbo nkịtị nke na-egosi ndị na-amụta ihe n’aka ya ma na-eso ya.
- source_word: διὰ τὸν φόβον
  choice: n’ihi egwu
  rationale: Na-egosipụta ihe kpatara ọnọdụ ahụ dịka διά tinyere accusative si mee.
- source_word: τῶν Ἰουδαίων
  choice: ndị Juu
  rationale: Na-edobe okwu isi mmalite n’enweghị ime ka ọ bụrụ naanị ndị isi; ihe odide ala peeji na-egosi nghọta ndị ọzọ kwe omume n’ọnọdụ a.
- source_word: ἦλθεν
  choice: bịara
  rationale: Ọ bụ ntụgharị akụkọ nkịtị na nke ziri ezi nke ἔρχομαι.
- source_word: ἔστη εἰς τὸ μέσον
  choice: guzoro n’etiti ha
  rationale: Na-echekwa ihe onyonyo gbasara ebe Jizọs guzoro n’etiti ndị ahụ.
- source_word: λέγει αὐτοῖς
  choice: sị ha
  rationale: Historical present Grik ka a gbanwere gaa n’ụdị oge gara aga nke na-aga nke ọma n’akụkọ Igbo.
- source_word: Εἰρήνη ὑμῖν
  choice: Udo dịrị unu
  rationale: Ọ bụ ekele Igbo sitere n’okwu ahụ n’ụzọ dị nso ma dịkwa ebube; ọ na-echekwa echiche ‘udo nye unu/ka udo dịrị unu.’
theological_decisions:
- issue: Onye ma ọ bụ ndị τῶν Ἰουδαίων na-ezo aka na ha n’Oziọma Jọn
  choice: ndị Juu n’ahịrị isi, ya na nkọwa ọzọ n’ihe odide ala peeji
  alternative: ndị isi ndị Juu; ndị Judia
  rationale: Grik ekwughị kpọmkwem ‘ndị isi.’ Ide ‘ndị Juu’ na-edobe ohere okwu ahụ nwere, ebe ihe odide ala peeji na-enyere onye na-agụ aka ịghọta na n’ọnọdụ a o nwere ike ịpụta ndị ọchịchị Juu ma ọ bụ ndị Judia, ọ bụghị ndị Juu niile.
- issue: Ụdị ekele Εἰρήνη ὑμῖν
  choice: Udo dịrị unu
  alternative: Ka udo dịrị unu; Udo nye unu
  rationale: Ahọrọla usoro dị ndụ ma dị ebube n’Igbo, ebe ihe odide ala peeji na-echekwa usoro nkịtị nke Grik.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. Ejiri ‘ndị na-eso ụzọ Jizọs’ kama okwu ụka pụrụ iche; e debere mgbagwoju anya nke ‘ndị Juu’ site n’ihe odide ala peeji. Akara [a] na [b] dị n’ahịrị isi ma kwekọọ n’ihe odide ala peeji.
