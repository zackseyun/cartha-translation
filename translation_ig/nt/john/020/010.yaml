revisions:
- from: Ya mere, ndị na-eso ụzọ ahụ laghachiri ọzọ n’ebe ha nọ.[a]
  to: N’ihi ya, ndị na-eso ụzọ ahụ laghachikwara n’ebe nke ha nọ.[a]
  rationale: The revision replaces the locative “n’ebe ha nọ” with the possessive expression “n’ebe nke ha nọ,” which better reflects πρὸς ἑαυτούς while retaining the contextual sense of returning to their lodging or own place. “Laghachikwara” naturally carries the return/repetition expressed by ἀπῆλθον ... πάλιν.
