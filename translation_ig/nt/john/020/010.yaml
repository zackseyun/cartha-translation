    reason: lexical_alternative
  revision_rationale: The revision replaces the locative “n’ebe ha nọ” with the possessive expression “n’ebe nke ha nọ,” which better reflects πρὸς ἑαυτούς while retaining the contextual sense of returning to their lodging or own place. “Laghachikwara” naturally carries the return/repetition expressed by ἀπῆλθον ... πάλιν.
