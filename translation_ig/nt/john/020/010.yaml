review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents the disciples’ departure/return, the narrative connective, and the referent “the disciples.” However, “n’ebe ha nọ” ordinarily means “where they are/were,” rather than the possessive and idiomatic force of πρὸς ἑαυτούς (“to their own place/where they belonged”).
  naturalness: The wording is generally clear Standard Igbo. “N’ebe nke ha” is both natural and more precise here. “Laghachikwara” expresses the return/repetition without the slightly repetitive combination “laghachiri ọzọ.”
  terminology: “Ndị na-eso ụzọ ahụ” is an appropriate established rendering for οἱ μαθηταί. No theological terminology is at issue.
  issues:
  - severity: medium
    issue: The phrase “n’ebe ha nọ” weakens the possessive/idiomatic sense of πρὸς ἑαυτούς.
    rationale: It can mean simply “to the place where they were,” whereas the Greek indicates return to their own place or quarters. “N’ebe nke ha” preserves the source expression’s ambiguity without specifying individual homes.
  revised_text: N’ihi ya, ndị na-eso ụzọ ahụ laghachikwara n’ebe nke ha nọ.[a]
