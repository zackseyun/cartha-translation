  text: ἀπῆλθον οὖν πάλιν πρὸς ⸀αὑτοὺς οἱ μαθηταί.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/010.yaml
  text: So the disciples went away again to their own homes[a].
translation:
  language: ig
  text: N’ihi ya, ndị na-eso ụzọ ahụ laghachikwara n’ebe nke ha nọ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, dịka okwu Grik ahụ si kwuo kpọmkwem, “n’ebe onwe ha nọ” ma ọ bụ “n’ebe nke ha.” O yikarịrị ka ọ pụtara na ha laghachiri n’ebe ha na-anọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπῆλθον
  choice: laghachiri
  rationale: N’ọnọdụ akụkọ a, ngwaa ahụ na-egosi na ha hapụrụ ili ahụ laa; “laghachiri” na-ejikọta echiche ịpụ na ịlaghachi n’ebe ha si bịa n’Igbo dị mfe.
- source_word: οὖν
  choice: Ya mere
  rationale: Ọ na-egosi njikọ na ihe mere tupu nke a, ma bụrụkwa okwu nkịtị na nke kwesịrị ekwesị n’akụkọ Igbo.
- source_word: πάλιν
  choice: ọzọ
  rationale: Ọ na-echekwa echiche nke imegharị ma ọ bụ ịlaghachi ọzọ.
- source_word: πρὸς αὑτούς
  choice: n’ebe ha nọ
  rationale: Okwu Grik a bụ nke nwere ike ịpụta n’ụzọ nkịtị “n’ebe onwe ha nọ,” ma n’ebe a o yikarịrị ka ọ na-ekwu maka ebe ha bi ma ọ bụ ebe ha nọrọ. Nhọrọ a bụ eke n’Igbo ma ọ naghị ekpebi na ọ bụ ụlọ nke onye nke ọ bụla.
- source_word: οἱ μαθηταί
  choice: ndị na-eso ụzọ ahụ
  rationale: Nke a bụ okwu Igbo a na-ejikarị akọwa ndị na-eso Jizọs ma na-amụta ihe n’aka ya.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke dị ugbu a, dị ùgwù ma dị mfe nghọta. A hapụrụ ntakịrị mgbagwoju anya dị n’okwu πρὸς αὑτούς kama ịkọwapụta ya n’amaokwu ahụ dị ka “ụlọ ha.”
