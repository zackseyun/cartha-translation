id: JHN.20.17
reference: John 20:17
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: λέγει ⸀αὐτῇ Ἰησοῦς· Μή μου ἅπτου, οὔπω γὰρ ἀναβέβηκα πρὸς τὸν ⸀πατέρα· πορεύου δὲ πρὸς τοὺς ἀδελφούς μου καὶ εἰπὲ αὐτοῖς· Ἀναβαίνω πρὸς τὸν πατέρα μου καὶ πατέρα ὑμῶν καὶ θεόν μου καὶ θεὸν ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/017.yaml
  text: Jesus said to her[a], “Do not cling to me, for I have not yet ascended to the Father. But go to my brothers and tell them, ‘I am ascending to my Father and your Father[b], and my God and your God.’”
translation:
  language: ig
  text: Jizọs sịrị ya, “Akwụsịla ijidesi m ike[a], n’ihi na akabeghị m arịgo gakwuru Nna ahụ. Kama, gakwuuru ụmụnna m[b], gwa ha, ‘Ana m arịgo gakwuru Nna m na Nna unu, Chineke m na Chineke unu.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “Emetụla m aka” ma ọ bụ “Ejidela m.” Okwu Grik ahụ nwere ike ịpụta na Meri na-ejidesi ya ike ma ọ bụ na-aga n’ihu ijide ya, ọ bụghị nanị na o metụrụ ya aka.
    reason: lexical_alternative
  - marker: b
    text: Okwu Grik a bụ aha nwoke n’ụdị ọtụtụ. N’ebe a, ọ na-ezo aka ná ndị na-eso ụzọ Jizọs, o nwekwara ike ịgụnye ìgwè sara mbara nke ha nọchitere anya.
    reason: cultural_note
lexical_decisions:
- source_word: Μή μου ἅπτου
  choice: Akwụsịla ijidesi m ike
  rationale: Ụdị iwu dị ugbu a nke e ji μή mee ka o yie ka a na-agwa Meri ka ọ kwụsị omume na-aga n’ihu. ‘Ijidesi m ike’ na-egosi ijide ma ghara ịhapụ, ọ bụghị nanị imetụ aka otu ntabi anya.
- source_word: οὔπω γὰρ ἀναβέβηκα πρὸς τὸν πατέρα
  choice: n’ihi na akabeghị m arịgakwuru Nna ahụ
  rationale: ‘Akabeghị m’ na-echekwa echiche nke ‘ọ bụghị ruo ugbu a,’ ebe ‘arịgakwuru’ na-egosi ma ịrịgo ma ebe ọ na-aga. ‘Nna ahụ’ na-edebe njirimara okwu ahụ n’ahịrịokwu mbụ, ebe isi mmalite ekwughị ‘Nna m’ n’ebe a.
- source_word: πορεύου
  choice: gaa
  rationale: Nke a bụ iwu mmegharị dị mfe; ‘gaa’ bụ okwu Igbo nkịtị ma doo anya.
- source_word: τοὺς ἀδελφούς μου
  choice: ụmụnna m
  rationale: ‘Ụmụnna’ bụ ụzọ Igbo sitere n’okike isi kwuo ndị mmadụ nwere mmekọrịta dịka ụmụnne ma ọ bụ ndị otu ezinụlọ; n’ebe a ọ na-arụ ọrụ maka ndị na-eso ụzọ Jizọs n’enweghị ịgbakwunye nkọwa n’ime amaokwu ahụ.
- source_word: εἰπὲ αὐτοῖς
  choice: gwa ha
  rationale: ‘Gwa ha’ bụ usoro Igbo dị mfe ma kwekọọ n’iwu ka o zie ha ozi ahụ.
- source_word: Ἀναβαίνω
  choice: Ana m arịgakwuru
  rationale: Usoro ugbu a na-echekwa mmegharị ahụ dị nso nke Jizọs na-ekwu maka ya, ma ‘-kwuru’ na-egosi onye ọ na-agakwuru.
- source_word: πατέρα μου καὶ πατέρα ὑμῶν
  choice: Nna m na Nna unu
  rationale: Nke a na-echekwa nhazi abụọ ahụ na ọdịiche dị n’etiti mmekọrịta Jizọs na nke ndị na-eso ụzọ ya.
- source_word: θεόν μου καὶ θεὸν ὑμῶν
  choice: Chineke m na Chineke unu
  rationale: Ntughari a kwụ ọtọ na-echekwa nhazi yiri nke ‘Nna m na Nna unu’ ma ghara ime ka okwu ‘Chineke m’ dị nro n’ihi echiche okpukpe.
theological_decisions:
- issue: Ihe Μή μου ἅπτου pụtara
  choice: Ka Meri kwụsị ijidesi Jizọs ike
  alternative: Emetụla m aka
  rationale: Ụdị okwu Grik na ọnọdụ ya na-akwado omume na-aga n’ihu karịa mmachibido imetụ ya aka ma ọlị. A hapụrụ ụzọ ọzọ n’ala peeji n’ihi na okwu ahụ nwere ike ịgụnye imetụ aka ma ọ bụ ijide.
- issue: Otu e si sụgharịa πατέρα n’ahịrịokwu mbụ
  choice: Nna ahụ
  alternative: Nna m
  rationale: Isi mmalite enweghị μου (‘m’) n’ahịrịokwu mbụ. ‘Nna ahụ’ na-edebe ọdịiche a, ebe okwu Jizọs sochirinụ kwuru hoo haa ‘Nna m na Nna unu.’
- issue: Ihe okwu ‘Chineke m na Chineke unu’ nwere ike ịpụta n’ihe gbasara onye Kraịst bụ
  choice: Ịsụgharị ya kpọmkwem dịka e dere ya
  alternative: Ịkọwagharị ya ka ‘Chineke m’ ghara ịdị ike
  rationale: A hapụrụ esemokwu nkà mmụta okpukpe dị n’okwu ahụ ka ọ dị, na-enweghị ime ka ọ dị nro ma ọ bụ tinye nkọwa nke otu ụka n’ime amaokwu ahụ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta mee ihe. ‘Jizọs,’ ‘Nna,’ na ‘Chineke’ na-agbaso usoro ederede Baịbụl Igbo a na-ahụkarị. A họọrọ ‘Akwụsịla ijidesi m ike’ iji mee ka echiche omume na-aga n’ihu pụta ìhè n’enweghị ịkọwa ihe karịrị isi mmalite.
