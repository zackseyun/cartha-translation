id: JHN.20.13
reference: John 20:13
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ λέγουσιν αὐτῇ ἐκεῖνοι· Γύναι, τί κλαίεις; λέγει αὐτοῖς ὅτι Ἦραν τὸν κύριόν μου, καὶ οὐκ οἶδα ποῦ ἔθηκαν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/013.yaml
  text: And they said to her[a], “Woman, why are you weeping?” She said to them, “They have taken away my Lord[b], and I do not know where they have put him.”
translation:
  language: ig
  text: Ha wee sị ya, “Nwanyị, gịnị mere i ji akwa ákwá?[a]” Ọ sịrị ha, “Ha ebupụla Onyenwe m[b], amaghịkwa m ebe ha tinyere ya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “Gịnị ka ị na-akwa ákwá maka?” N'ụzọ nkịtị, okwu Grik ahụ bụ “gịnị,” ma n'ajụjụ a ọ na-ajụ ihe kpatara ịkwa ákwá ahụ.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ “onyeisi m.” Okwu Grik bụ kyrios; ọ pụrụ ịbụ “Onyenwe” ma ọ bụ aha nkwanye ùgwù dịka “onyeisi,” dabere n'ọnọdụ ya.
    reason: alternative_reading
lexical_decisions:
- source_word: Γύναι
  choice: Nwanyị
  rationale: Ọ bụ okwu a na-eji akpọ nwanyị ihu na ihu n'ụzọ nkwanye ùgwù n'ọnọdụ a; nsụgharị a na-edobe okwu Grik ahụ n'ezoghị ya n'echiche ọzọ.
- source_word: τί
  choice: gịnị mere
  rationale: Ọ bụ ezie na τί pụtara ‘gịnị’ n'ụzọ nkịtị, n'ajụjụ τί κλαίεις ọ na-ajụ ihe kpatara ịkwa ákwá. ‘Gịnị mere ... ji’ bụ ụzọ Igbo kwụ ọtọ ma dị ndụ isi kwuo nke a.
- source_word: κλαίεις
  choice: i ji akwa ákwá
  rationale: Ụdị ngwaa dị ugbu a na-egosi na ịkwa ákwá ahụ ka na-aga n'ihu. ‘Ịkwa ákwá’ bụ okwu Igbo nkịtị ma kwesịkwa ọnọdụ mwute a.
- source_word: Ἦραν
  choice: ebupụla
  rationale: 'Ọ na-egosi omume e mechara nke nsonaazụ ya ka dị ugbu a: ewepụla ozu ahụ n''ili. ‘Ebupụla’ na-egosi ma iburu ma iwepụ.'
- source_word: κύριόν
  choice: Onyenwe
  rationale: ‘Onyenwe’ na-edobe ma nkwanye ùgwù Meri nwere n'ebe Jizọs nọ ma ohere nke aha ahụ inwe nghọta Kraịst miri emi; a naghị eme ka ọ bụrụ naanị ‘onyeisi’.
- source_word: οὐκ οἶδα
  choice: amaghịkwa m
  rationale: οἶδα nwere ọdịdị zuru oke ma na-arụ ọrụ dị ka ngwaa ọnọdụ dị ugbu a. ‘Amaghịkwa m’ na-asụgharịkwa njikọ καί dị ka ‘kwa’.
- source_word: ποῦ ἔθηκαν αὐτόν
  choice: ebe ha tinyere ya
  rationale: τίθημι pụtara itinye ma ọ bụ idowe. ‘Ebe ha tinyere ya’ bụ Igbo nke oge a, dị mfe ma ghara ịkọwa kpọmkwem otú e si dọba ozu ahụ.
- source_word: ἐκεῖνοι
  choice: Ha
  rationale: Nnọchiaha ngosi ahụ na-ezo aka n ndị mmụọ ozi abụọ a kpọtụrụ aha n'amaokwu bu ụzọ. ‘Ha’ bụ ụzọ Igbo kachasị eke ebe onye a na-ekwu maka ya doro anya.
theological_decisions:
- issue: Nsụgharị κύριος n'okwu Meri
  choice: Onyenwe m
  alternative: onyeisi m
  rationale: κύριος nwere ike ịbụ aha nkwanye ùgwù ma nwekwaa nghọta gbasara onye Jizọs bụ. ‘Onyenwe m’ na-echekwa oghere abụọ ahụ kama imechi ya n'echiche nke naanị mmekọrịta mmadụ na onyeisi ya.
- issue: Ụda okwu Γύναι
  choice: Nwanyị
  alternative: Ezigbo nwanyị
  rationale: Okwu Grik ahụ bụ nkwanye ùgwù n'ọnọdụ a, ma o tinyeghị okwu mmetụta dịka ‘ezigbo.’ ‘Nwanyị’ na-edobe kpọmkwem okwu na ụda isi mmalite ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe ma dị ùgwù mee nsụgharị ahụ. A họọrọ ‘wee sị’ maka usoro akụkọ, ‘ịkwa ákwá’ maka omume na-aga n'ihu, na ‘ebupụla’ maka omume e mechara nke ka metụtara ọnọdụ ugbu a. E zere okwu ụka pụrụ iche ma chekwaa nghọta abụọ κύριος nwere ike ibu.
