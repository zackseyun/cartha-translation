  text: ἐξῆλθεν οὖν ὁ Πέτρος καὶ ὁ ἄλλος μαθητής, καὶ ἤρχοντο εἰς τὸ μνημεῖον.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/003.yaml
  text: So Peter and the other disciple went out and were going to the tomb[a].
translation:
  language: ig
  text: Ya mere, Pita na onye na-eso ụzọ ọzọ ahụ pụtara, ha wee na-aga n’ili ahụ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ha gara n’ili ahụ.” Ngwaa Grik ahụ dị n’ụdị imperfect, nke a pụkwara ịsụgharị n’ụzọ dị nkenke; ma “ha wee na-aga” na-eme ka o doo anya karị na njem ahụ nọ na-aga n’ihu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: pụtara
  rationale: Ngwaa a na-egosi na Pita na onye ọzọ ahụ hapụrụ ebe ha nọ pụọ; “pụtara” bụ ụzọ Igbo dị nkenke ma bụrụkwa nke ebumpụta ụwa isi kwuo nke a.
- source_word: οὖν
  choice: Ya mere
  rationale: Ọ na-ejikọta ihe a na ihe mere n’amaokwu bu ya ụzọ, na-egosi ihe sochiri ozi Meri nyere ha.
- source_word: ὁ Πέτρος
  choice: Pita
  rationale: Nke a bụ nsụgharị aha Πέτρος a na-ejikarị eme ihe n’Igbo.
- source_word: ὁ ἄλλος μαθητής
  choice: onye ọzọ ahụ na-eso ụzọ
  rationale: Okwu “ahụ” na-egosi onye ọzọ ahụ a marala site n’ihe gbara amaokwu a gburugburu; “onye na-eso ụzọ” bụ okwu Igbo doro anya maka μαθητής n’akụkọ Oziọma.
- source_word: ἤρχοντο
  choice: ha wee na-aga
  rationale: Ụdị imperfect na-egosi omume na-aga n’ihu n’oge gara aga. “Ha wee na-aga” na-echekwa nghọta ahụ, ma na-adakwa nke ọma n’Igbo.
- source_word: εἰς τὸ μνημεῖον
  choice: n’ili ahụ
  rationale: N’ebe a μνημεῖον bụ ili e liri Jizọs. “N’ili ahụ” na-egosi njem chere ihu n’ili ahụ, ọ naghị ekwu na ha abanyelarị n’ime ya.
theological_decisions: []
translation_notes:
  register: E ji asụsụ Igbo Izugbe nke dị ugbu a, dị ùgwù, ma dị mfe nghọta mee ihe. A hapụrụ usoro akụkọ ahụ ka ọ gosi ma ọpụpụ ha ma njem ha na-aga n’ihu.
