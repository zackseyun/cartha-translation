    reason: lexical_alternative
  revision_rationale: The revision preserves the Greek narrative sequence, the directional sense of εἰς τὸ μνημεῖον, and the progressive force of ἤρχοντο. It replaces an awkward noun-phrase order with natural Standard Igbo and refines the explanatory footnote.
