  text: ⸀ἀπεκρίθη Θωμᾶς καὶ εἶπεν αὐτῷ· Ὁ κύριός μου καὶ ὁ θεός μου.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/028.yaml
  text: Thomas answered and said to him[a], “My Lord and my God!”
translation:
  language: ig
  text: Tọmọs zara, sị ya, “Onyenwe m na Chineke m!”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: zara
  rationale: Nke a bụ ụzọ Igbo nkịtị si akọ na mmadụ zara onye ọzọ; ọ dabara n'ọrụ akụkọ nke ἀποκρίνομαι.
- source_word: Θωμᾶς
  choice: Tọmọs
  rationale: A sụgharịghị aha ahụ; e dere ya n'ụdị mkpọpụta dabara n'Igbo.
- source_word: εἶπεν αὐτῷ
  choice: sị ya
  rationale: Ọ na-edobe onye okwu ahụ gara n'ebe ọ nọ dịka Greek si kwuo, n'etinyeghị aha Jizọs ebe Greek na-etinyeghị ya.
- source_word: Ὁ κύριός μου
  choice: Onyenwe m
  rationale: “Onyenwe” na-eburu nsọpụrụ na ibu nkà mmụta okpukpe nke κύριος n'okwu a, ebe “m” na-edobe njikọ onwe onye.
- source_word: ὁ θεός μου
  choice: Chineke m
  rationale: “Chineke” bụ ntụgharị doro anya nke θεός; “m” na-edobe nkwupụta nke onwe onye dị na μου.
- source_word: καὶ
  choice: na
  rationale: Njikọ a na-ejikọta utu aha abụọ ahụ n'otu nkwupụta dịka καὶ si eme.
theological_decisions:
- issue: Ma okwu Tọmọs bụ nkwupụta ọ gwara Jizọs ozugbo, ka ọ bụ naanị mkpu ọ kpọrọ Chineke n'akụkụ
  choice: 'E gosiri ya dịka okwu a gwara Jizọs ozugbo: “Onyenwe m na Chineke m!”'
  alternative: Ịghọta ya dịka mkpu a na-agwaghị Jizọs, ya bụ, “Onyenwe m na Chineke m!”
  rationale: Greek kwuru hoo haa εἶπεν αὐτῷ, “sị ya,” ya mere okwu ndị sochiri ya bụ okwu a gwara onye ahụ kpọmkwem. Ὁ κύριός μου na ὁ θεός μου bụ nominative nwere article ndị na-arụ ọrụ dịka ịkpọ onye okwu ihu na ihu n'Igbo Koine; ntụgharị ahụ anaghị ebelata ibu nkwupụta ahụ.
translation_notes:
  register: Standard Igbo nke oge a, dị mfe ma nwee ugwu. “Sị ya” bụ usoro okwu eke karịa ntụgharị siri ike dịka “kwuru ya nye ya,” ebe “Onyenwe” na “Chineke” na-edobe ibu nsọpụrụ na nkà mmụta okpukpe nke amaokwu ahụ.
