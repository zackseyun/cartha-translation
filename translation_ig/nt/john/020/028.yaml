review_pass:
  verdict: revise
  source_fidelity: The draft preserves Thomas, the response formula, the explicit dative addressee, and the coordinated direct address, “My Lord and my God.” However, “zara ya, sị ya” assigns the dative “ya” twice, although αὐτῷ occurs only with εἶπεν. Keeping it only with “sị ya” reflects the Greek syntax more closely.
  naturalness: “Tọmọs zara, sị ya” is idiomatic, clear Standard Igbo narrative style. The confession “Onyenwe m na Chineke m!” is natural and appropriately reverent.
  terminology: “Tọmọs,” “Onyenwe,” and “Chineke” are suitable Standard Igbo forms. The footnote should use “Grik,” rather than the English-form “Greek,” and should state the alternative without implying that the main reading is merely a theological inference.
  issues:
  - severity: medium
    issue: The addressee pronoun is duplicated in “Tọmọs zara ya, sị ya.”
    rationale: The Greek has one explicit dative pronoun, αὐτῷ, governed by εἶπεν (“said to him”). Rendering both “zara ya” and “sị ya” unnecessarily repeats the object and is less natural in Igbo.
  - severity: low
    issue: The footnote uses “Greek” rather than Standard Igbo “Grik.”
    rationale: “Grik” is the natural Standard Igbo designation for the language and maintains linguistic consistency.
  revised_text: Tọmọs zara, sị ya, “Onyenwe m na Chineke m!”
