    text: A pụkwara ịtụgharị ya, “ọ hulatara wee lee anya n’ime ili ahụ.” Ngwaa Grik ahụ gụnyere echiche nke ihulata iji lee anya n’ime ihe.
    reason: lexical_alternative
  revision_rationale: The revision preserves the Greek’s ongoing actions and final comma while using a less causally loaded narrative transition. It also corrects the Igbo grammar and idiom of the lexical-alternative footnote.
