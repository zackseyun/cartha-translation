review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys Mary’s continued standing and weeping, her subsequent stooping, and her looking into the tomb. However, “Ya mere” can imply a stronger causal inference than the narrative connective οὖν warrants here; a temporal-narrative transition is preferable. “N’èzí ili ahụ” adequately conveys her being outside in relation to the tomb without adding the somewhat cumbersome “n’akụkụ.”
  naturalness: The revision uses clear, modern Standard Igbo. “Mgbe ahụ, ka ọ na-akwa ákwá” preserves the narrative progression and ongoing weeping naturally. The footnote is revised because “A pụkwara ịsụ ya” is not idiomatic in this sense, and “leba” is imperative rather than a narrative verbal form.
  terminology: “Ili” is a suitable Standard Igbo term for μνημεῖον in this context. “Hulatara” appropriately expresses παρέκυψεν, including the bodily motion involved in looking into the tomb. No theological terminology is at issue.
  issues:
  - severity: medium
    issue: “Ya mere” overstates the force of οὖν.
    rationale: In this context οὖν primarily advances the narrative (“then/so”), rather than expressing a strong logical conclusion. “Mgbe ahụ” avoids an unnecessary causal implication.
  - severity: medium
    issue: The lexical footnote contains non-idiomatic and grammatically mismatched wording.
    rationale: “A pụkwara ịsụ ya” should be “A pụkwara ịtụgharị ya,” and “leba” is imperative. The alternative needs a narrative form such as “wee lee anya.”
  - severity: low
    issue: “n’èzí n’akụkụ ili ahụ” is unnecessarily heavy.
    rationale: The source locates Mary outside at the tomb; “n’èzí ili ahụ” expresses the essential spatial contrast idiomatically without adding an explicit ‘beside’ phrasing.
  revised_text: Ma Meri nọ na-eguzo n’èzí ili ahụ, na-akwa ákwá. Mgbe ahụ, ka ọ na-akwa ákwá, ọ hulatara ka o lee anya n’ime ili ahụ[a],
  revised_footnotes:
