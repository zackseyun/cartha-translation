revisions:
- from: Ma Meri nọ na-eguzo n’èzí n’akụkụ ili ahụ, na-akwa ákwá. Ya mere, ka ọ nọ na-akwa ákwá, ọ hulatara ka ọ lee anya n’ime ili ahụ[a],
  to: Ma Meri nọ na-eguzo n’èzí ili ahụ, na-akwa ákwá. Mgbe ahụ, ka ọ na-akwa ákwá, ọ hulatara ka o lee anya n’ime ili ahụ[a],
  rationale: The revision preserves the Greek’s ongoing actions and final comma while using a less causally loaded narrative transition. It also corrects the Igbo grammar and idiom of the lexical-alternative footnote.
