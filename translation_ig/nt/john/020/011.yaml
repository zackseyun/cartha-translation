source:
  edition: SBLGNT
  text: Μαρία δὲ εἱστήκει πρὸς ⸂τῷ μνημείῳ ἔξω κλαίουσα⸃. ὡς οὖν ἔκλαιεν παρέκυψεν εἰς τὸ μνημεῖον,
base_translation:
  language: en
  yaml_path: translation/nt/john/020/011.yaml
  text: But Mary was standing outside the tomb, weeping. So, as she was weeping, she bent over to look into the tomb,
translation:
  language: ig
  text: Ma Meri nọ na-eguzo n’èzí ili ahụ, na-akwa ákwá. Mgbe ahụ, ka ọ na-akwa ákwá, ọ hulatara ka o lee anya n’ime ili ahụ[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịtụgharị ya, “ọ hulatara wee lee anya n’ime ili ahụ.” Ngwaa Grik ahụ gụnyere echiche nke ihulata iji lee anya n’ime ihe.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Ma
  rationale: Ọ na-egosi obere mgbanwe ma ọ bụ ọdịiche n’akụkọ ahụ, mgbe ndị ọzọ laghachiri ma Meri nọgidere n’ebe ahụ.
- source_word: εἱστήκει
  choice: nọ na-eguzo
  rationale: Ụdị ngwaa Grik a na-egosi ọnọdụ nọgidere na-aga; okwu a na-egosi na Meri ka guzo ebe ahụ.
- source_word: πρὸς τῷ μνημείῳ ἔξω
  choice: n’èzí n’akụkụ ili ahụ
  rationale: Nke a na-edobe Meri n’èzí, n’akụkụ ili ahụ, ma na-echekwa ọdịiche dị n’etiti ebe ọ nọ na ebe ọ lere anya n’ime ya.
- source_word: μνημεῖον
  choice: ili
  rationale: N’Igbo ọkọlọtọ, ‘ili’ bụ okwu doro anya ma bụrụkwa nke a na-ejikarị ekwu ebe e liri mmadụ; ihe ndị gbara amaokwu ahụ gburugburu na-egosi na ọ bụ ili e nwere ike ileba anya n’ime ya.
- source_word: κλαίουσα
  choice: na-akwa ákwá
  rationale: Ọ na-egosi iru újú Meri na omume ahụ na-aga n’ihu mgbe ọ na-eguzo.
- source_word: ὡς οὖν
  choice: Ya mere, ka
  rationale: Ọ na-akwalite akụkọ ahụ gaa n’ihu ma jikọta ihe Meri mere na ịkwa ákwá ya, n’enweghị ime ka njikọ ahụ bụrụ nkwubi okwu siri ike.
- source_word: ἔκλαιεν
  choice: ọ nọ na-akwa ákwá
  rationale: Ụdị imperfect Grik na-egosi omume gara n’ihu; ‘nọ na-akwa’ na-echekwa akụkụ a.
- source_word: παρέκυψεν
  choice: ọ hulatara ka ọ lee anya
  rationale: Ọ na-egosi ma mmegharị nke ihulata ma nzube nke ileba anya n’ime ili ahụ.
- source_word: εἰς τὸ μνημεῖον
  choice: n’ime ili ahụ
  rationale: Ọ na-egosi ntụziaka anya ya n’ime ili ahụ n’ụzọ dị mfe ma bụrụ nke e ji eme ihe n’Igbo.
theological_decisions: []
translation_notes:
  register: E ji Igbo ọkọlọtọ dị ugbu a, nke dị ùgwù ma dị mfe nghọta. E chekwara nkwughachi nke ịkwa ákwá iji gosipụta omume na-aga n’ihu dịka Grik si mee; akara rikọm ikpeazụ na-egosi na ahịrịokwu ahụ na-aga n’ihu n’amaokwu na-esote.
