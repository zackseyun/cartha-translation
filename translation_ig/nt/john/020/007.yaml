- from: na akwa e ji kpuchie ihu ya, nke dịbu n’isi ya, esoghị akwa linin ndị ahụ dina, kama a pịakọtara ya[a] iche n’otu ebe.
  to: na akwa ihu ahụ, nke dịbu n’isi ya, esoghị akwa linin ndị ahụ dina, kama e kechiri ya[a] iche n’otu ebe.
  rationale: The main reading replaces the overly general ‘was gathered together’ with ‘was wrapped,’ which better represents ἐντετυλιγμένον. The alternative renderings remain in the footnote to acknowledge possible nuances of the cloth’s arrangement. No theological inference is added.
