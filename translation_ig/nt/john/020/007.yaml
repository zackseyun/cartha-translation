review_pass:
  verdict: revise
  source_fidelity: The draft correctly retains the contrast between the head/face cloth and the linen cloths, its separate location, and the cloth's prepared/wrapped condition. However, “a pịakọtara ya” most readily means ‘it was gathered/collected together’ and does not adequately represent ἐντετυλιγμένον (‘wrapped/rolled up’).
  naturalness: The sentence is generally clear Standard Igbo. “Akwa ihu ahụ” is more concise and natural than the longer descriptive noun phrase while retaining the burial-context sense. “Esoghị ... dina” works idiomatically for the cloth not lying together with the other linens.
  terminology: “Akwa ihu” appropriately renders σουδάριον in context; “akwa linin” retains the distinct plural burial linens. “E kechiri ya” is a safe, natural rendering of the participle without asserting a particular folding technique.
  issues:
  - severity: medium
    issue: The rendering “a pịakọtara ya” for ἐντετυλιγμένον is semantically imprecise.
    rationale: It can mean ‘was gathered/assembled,’ whereas the Greek indicates that the cloth was in a wrapped, rolled, or folded state. “E kechiri ya” preserves the basic lexical sense without over-specifying the precise arrangement.
  revised_text: na akwa ihu ahụ, nke dịbu n’isi ya, esoghị akwa linin ndị ahụ dina, kama e kechiri ya[a] iche n’otu ebe.
  revised_footnotes:
