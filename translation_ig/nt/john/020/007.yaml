  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ τὸ σουδάριον, ὃ ἦν ἐπὶ τῆς κεφαλῆς αὐτοῦ, οὐ μετὰ τῶν ὀθονίων κείμενον ἀλλὰ χωρὶς ἐντετυλιγμένον εἰς ἕνα τόπον·
base_translation:
  language: en
  yaml_path: translation/nt/john/020/007.yaml
  text: and the face cloth[a], which had been on his head, was not lying with the linen cloths but folded up separately in one place.
translation:
  language: ig
  text: na akwa ihu ahụ, nke dịbu n’isi ya, esoghị akwa linin ndị ahụ dina, kama e kechiri ya[a] iche n’otu ebe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “a pịakọtara ya” ma ọ bụ “a tụkọtara ya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: σουδάριον
  choice: akwa e ji kpuchie ihu ya
  rationale: N’ọnọdụ olili a, okwu ahụ na-ezo aka n’akwa e tinyere n’isi ma ọ bụ n’ihu Jizọs. Nsụgharị a doro ndị na-agụ Igbo anya ma kwekọọ na nkọwa na-esochi ya.
- source_word: ἐπὶ τῆς κεφαλῆς αὐτοῦ
  choice: nke dịbu n’isi ya
  rationale: Nke a na-agbasochi okwu Grik anya n’enweghị ịkọwa karịa ihe ederede kwuru banyere otú e si tinye akwa ahụ.
- source_word: ὀθονίων
  choice: akwa linin ndị ahụ
  rationale: Ụdị ọtụtụ nke okwu Grik na-ezo aka n’akwa linin ndị dị n’ili; ‘akwa linin’ bụ okwu doro anya ma ghara ịgbakwunye nkọwa na-adịghị na ederede.
- source_word: κείμενον
  choice: dina
  rationale: Okwu a na-akọwa ihe dị n’ebe ọ tọgbọrọ; ‘dina’ bụ ụzọ ebumpụta ụwa e si kwuo ya n’Igbo.
- source_word: χωρὶς
  choice: iche
  rationale: Ọ na-egosi na akwa ihu ahụ nọpụrụ iche n’akwa linin ndị ọzọ.
- source_word: ἐντετυλιγμένον
  choice: a pịakọtara ya
  rationale: Perfect passive participle ahụ na-egosi na akwa ahụ nọ n’ọnọdụ e tinyere ya site n’ịpịakọta, ịkechie, ma ọ bụ ịtụgharị ya. ‘A pịakọtara ya’ bụ okwu Igbo doro anya, ebe e debere ụzọ ndị ọzọ e nwere ike isi ghọta ya n’ala ala peeji.
- source_word: εἰς ἕνα τόπον
  choice: n’otu ebe
  rationale: Nke a na-edobe echiche nke otu ebe pụrụ iche n’enweghị ịkọwa ya dịka ‘ebe nke ya,’ nke ga-abụ ịgbakwunye nkọwa.
- source_word: καὶ
  choice: na
  rationale: Ọ bụ njikọ na-aga n’ihu n’akụkọ sitere n’amaokwu bu ụzọ.
theological_decisions:
- issue: Ma nhazi akwa olili ahụ ọ na-ekwu ihe mmụta okpukpe karịrị nkọwa ihe a hụrụ
  choice: E gosipụtara naanị na akwa ahụ nọ iche ma bụrụ nke a pịakọtara.
  alternative: Ịsị na akwa ahụ bụ ihe nnọchianya nke usoro pụrụ iche ma ọ bụ ihe akaebe nke otu nkọwa kpọmkwem banyere mbilite n’ọnwụ.
  rationale: Ederede Grik kọwara ọnọdụ na ebe akwa ahụ dị, ma o kwughị ihe nnọchianya ma ọ bụ nkwubi okwu ọzọ. Ya mere, nsụgharị ahụ anaghị etinye echiche na-adịghị n’ederede.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe ma nwee ugwu, dee ya. Ahịrịokwu ahụ malitere na ‘na’ iji chekwaa njikọ ya na amaokwu bu ụzọ. E zere okwu ụka pụrụ iche na nkọwa karịrị ihe Grik kwuru.
