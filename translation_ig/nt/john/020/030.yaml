  text: Πολλὰ μὲν οὖν καὶ ἄλλα σημεῖα ἐποίησεν ὁ Ἰησοῦς ἐνώπιον τῶν ⸀μαθητῶν, ἃ οὐκ ἔστιν γεγραμμένα ἐν τῷ βιβλίῳ τούτῳ·
base_translation:
  language: en
  yaml_path: translation/nt/john/020/030.yaml
  text: Jesus did many other signs in the presence of the disciples[a], which are not written in this book.
translation:
  language: ig
  text: Jizọs rụrụ ọtụtụ ihe ịrịba ama[a] ndị ọzọ n’ihu ndị na-eso ụzọ ya, ndị e deghị n’akwụkwọ a.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “ọrụ ebube.” Okwu Grik bụ “ihe ịrịba ama,” nke na-emesi ike na ọrụ ndị a na-ezo aka n’ihe karịrị onwe ha ma na-egosi onye Jizọs bụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πολλὰ μὲν οὖν καὶ ἄλλα
  choice: ọtụtụ ... ndị ọzọ
  rationale: Nke a na-egosipụta ịdị ọtụtụ na ịbụ ihe ndị ọzọ. A naghị atụgharị μὲν na οὖν iche iche n’ụzọ ga-eme ka Igbo sie ike; njikọ na ọdịiche ya na amaokwu na-esote ka ọnọdụ okwu na-egosi.
- source_word: σημεῖα
  choice: ihe ịrịba ama
  rationale: Okwu a na Jọn pụtara ọrụ dị ebube ndị na-arụkwa ọrụ dị ka akara na-ekpughe onye Jizọs bụ; “ihe ịrịba ama” na-echekwa echiche ahụ karịa naanị “ọrụ ebube.”
- source_word: ἐποίησεν
  choice: rụrụ
  rationale: “Ịrụ ihe ịrịba ama” bụ okwu Igbo dị mma nke na-egosi na Jizọs mere ọrụ ndị ahụ n’ezie.
- source_word: ἐνώπιον τῶν μαθητῶν
  choice: n’ihu ndị na-eso ụzọ ya
  rationale: “N’ihu” na-egosi na ndị na-eso ụzọ nọ ebe ahụ hụ ihe ndị ahụ. E tinyere “ya” n’ihi ido anya na Igbo, ọ bụ ezie na Grik enweghị okwu nnọchiaha nwe kpọmkwem.
- source_word: ἃ οὐκ ἔστιν γεγραμμένα
  choice: ma e deghị ha
  rationale: Nke a na-echekwa nkwupụta na ihe ịrịba ama ndị ahụ adịghị n’ihe e dere, ma na-ezere ahịrịokwu ndabere nke ga-ada mgbagwoju anya n’Igbo.
- source_word: ἐν τῷ βιβλίῳ τούτῳ
  choice: n’akwụkwọ a
  rationale: “Akwụkwọ” bụ okwu Igbo doro anya ma bụrụkwa nke a na-ejikarị akọwa akwụkwọ ozi ọma a.
theological_decisions:
- issue: Ojiji Jọn ji σημεῖα
  choice: ihe ịrịba ama
  alternative: ọrụ ebube
  rationale: “Ihe ịrịba ama” na-edobe nghọta na ọrụ ndị a na-atụ aka n’ofe onwe ha, na-ekpughe onye Jizọs bụ, kama ilekwasị anya nanị n’ike ha.
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, dị mfe nghọta ma dị ugwu. Ahịrịokwu ahụ na-aga nke ọma n’okwu ọnụ na n’ọgụgụ; “ma e deghị ha” na-eme ka ihe okwu nnọchiaha na-ezo aka na ya doo anya.
