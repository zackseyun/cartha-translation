- from: Jizọs rụrụ ọtụtụ ihe ịrịba ama[a] ndị ọzọ n’ihu ndị na-eso ụzọ ya, ma e deghị ha n’akwụkwọ a.
  to: Jizọs rụrụ ọtụtụ ihe ịrịba ama[a] ndị ọzọ n’ihu ndị na-eso ụzọ ya, ndị e deghị n’akwụkwọ a.
  rationale: The revision restores a natural Igbo relative clause corresponding to the Greek relative clause and retains the passive sense that these signs have not been written in this book. The footnote is adjusted only for idiomatic modern Igbo; its lexical and Johannine explanation is retained.
