    text: A pụkwara ịsị, “ọrụ ebube.” Okwu Grik bụ “ihe ịrịba ama,” nke na-emesi ike na ọrụ ndị a na-ezo aka n’ihe karịrị onwe ha ma na-egosi onye Jizọs bụ.
    reason: lexical_alternative
  revision_rationale: The revision restores a natural Igbo relative clause corresponding to the Greek relative clause and retains the passive sense that these signs have not been written in this book. The footnote is adjusted only for idiomatic modern Igbo; its lexical and Johannine explanation is retained.
