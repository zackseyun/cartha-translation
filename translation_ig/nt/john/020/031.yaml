  to: Ma e dere ihe ndị a ka unu wee kwere na Jizọs bụ Mesaya[a][b], Ọkpara Chineke, nakwa ka unu, site n'ikwere, nwee ndụ n'aha ya.
  rationale: The revision retains the source’s meaning and ambiguity, explicitly represents both coordinated purpose clauses, and uses a natural Igbo expression for possessing life. It also corrects the alternative-reading footnote’s anchor and content without adding theological interpretation.
