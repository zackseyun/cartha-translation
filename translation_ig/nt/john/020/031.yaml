id: JHN.20.31
reference: John 20:31
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ταῦτα δὲ γέγραπται ἵνα ⸀πιστεύητε ὅτι Ἰησοῦς ἐστιν ὁ χριστὸς ὁ υἱὸς τοῦ θεοῦ, καὶ ἵνα πιστεύοντες ζωὴν ἔχητε ἐν τῷ ὀνόματι αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/031.yaml
  text: But these have been written so that you may believe that Jesus is the Messiah[a], the Son of God[b], and so that by believing you may have life in his name.
translation:
  language: ig
  text: Ma e dere ihe ndị a ka unu wee kwere na Jizọs bụ Mesaya[a][b], Ọkpara Chineke, nakwa ka unu, site n'ikwere, nwee ndụ n'aha ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ụfọdụ akwụkwọ aka ochie na-agụ ụdị ngwaa nke pụrụ ịpụta, ‘ka unu bịa kwere,’ ebe ndị ọzọ na-akwado ụdị nke pụrụ ịpụta, ‘ka unu nọgide na-ekwere.’ Isi ederede sụgharịrị ya n’ụzọ sara mbara dịka, ‘ka unu wee kwere.’
    reason: textual_variant
  - marker: b
    text: Ma ọ bụ, ‘Kraịst.’ Okwu Grik ahụ, Χριστός, bụ aha ọkwa; a sụgharịrị ya ebe a dịka ‘Mesaya’ iji chekwaa ihe ọ pụtara.
    reason: alternative_reading
lexical_decisions:
- source_word: ταῦτα
  choice: ihe ndị a
  rationale: Na-ezo aka n’ihe ịrịba ama na ihe ndị e dere okwu ha n’ihu; nke a bụ ụzọ doro anya ma kwekọọ n’asụsụ Igbo.
- source_word: δὲ
  choice: Ma
  rationale: Na-egosi obere mgbanwe ma ọ bụ ntụgharị site n’okwu bu ụzọ.
- source_word: γέγραπται
  choice: e dere
  rationale: Na-egosi na e mechaala ide ihe ndị a, ha ka dịkwa n’akwụkwọ; usoro a bụ nke nkịtị n’Igbo.
- source_word: ἵνα πιστεύητε
  choice: ka unu wee kwere
  rationale: Na-echekwa ebumnuche nke ἵνα ma ghara ikpebi ma ọ bụ ikwere ọhụrụ ka a na-ekwu, ma ọ bụ ịnọgide n’okwukwe.
- source_word: Ἰησοῦς
  choice: Jizọs
  rationale: Ụdị aha a nabatara n’Igbo.
- source_word: ὁ χριστός
  choice: Mesaya
  rationale: A sụgharịrị aha ọkwa Χριστός dịka Mesaya iji chekwaa ihe ọ pụtara dịka Onye E Tere Mmanụ ahụ, kama iji naanị nsụgharị ụda.
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: Ọkpara Chineke
  rationale: Ụdị Igbo dị nkenke ma dị ùgwù nke na-echekwa aha njirimara Kraịst a.
- source_word: πιστεύοντες
  choice: site n’ikwere
  rationale: Na-egosi ụzọ e si enweta ndụ n’ahịrịokwu ahụ, n’etinyeghị nkọwa okpukpe ọzọ.
- source_word: ζωὴν
  choice: ndụ
  rationale: E chekwara okwu ahụ dịka ‘ndụ’ n’ihi na okwu Grik etinyeghị ‘ebighị ebi’ n’ebe a.
- source_word: ἐν τῷ ὀνόματι αὐτοῦ
  choice: n’aha ya
  rationale: Na-echekwa okwu na echiche nke isi mmalite n’ụzọ dị mfe ma bụrụkwa nke a na-aghọta n’Igbo.
theological_decisions:
- issue: Nsụgharị Χριστός dịka aha ọkwa
  choice: Mesaya
  alternative: Kraịst
  rationale: N’ebe a Χριστός bụ aha ọkwa nke na-akọwa onye Jizọs bụ; ‘Mesaya’ na-eme ka ọrụ ya dịka Onye E Tere Mmanụ ahụ pụta ìhè.
- issue: Ọdịiche ederede na akụkụ ngwaa πιστεύητε
  choice: ka unu wee kwere
  alternative: ka unu wee nọgide na-ekwere
  rationale: SBLGNT nwere present subjunctive πιστεύητε, ebe ụfọdụ akaebe nwere aorist πιστεύσητε. Isi ederede na-eji okwu sara mbara ka ọ ghara ikpebi esemokwu ahụ n’enweghị isi; nkọwa ala peeji na-edebe ọdịiche ahụ.
- issue: Ihe ‘ndụ’ pụtara
  choice: ndụ
  alternative: ndụ ebighị ebi
  rationale: Ọ bụ ezie na ‘ndụ’ nwere omimi pụrụ iche n’Oziọma Jọn, adjective ‘ebighị ebi’ adịghị n’ahịrịokwu Grik a, ya mere etinyeghị ya.
translation_notes:
  register: Ejiri Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. E debere nhazi ebumnuche abụọ nke ἵνα, ma e zere ịgbakwunye ‘ebighị ebi’ n’ebe isi mmalite kwuru naanị ‘ndụ.’
