id: JHN.2.13
reference: John 2:13
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Καὶ ἐγγὺς ἦν τὸ πάσχα τῶν Ἰουδαίων, καὶ ἀνέβη εἰς Ἱεροσόλυμα ὁ Ἰησοῦς.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/013.yaml
  text: The Passover of the Jews was near[a], and Jesus went up to Jerusalem.
translation:
  language: ig
  text: Emume Ngabiga nke ndị Juu dị nso[a], Jizọs wee rịgoro Jerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Emume Ngabiga nke ndị Judia.” N’akwụkwọ Jọn, Ἰουδαῖοι nwere ike ịpụta “ndị Judia” kama “ndị Juu” n’ebe ụfọdụ; ma n’ebe a, o yikarịrị ka ọ na-akọwa emume ahụ dị ka emume ndị Juu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγγὺς
  choice: dị nso
  rationale: N’ebe a, okwu a na-egosi na oge emume ahụ eruola nso. ‘Dị nso’ bụ ụzọ Igbo nkịtị si kwuo ya n’enweghị ịgbakwunye ihe na-adịghị n’isi mmalite.
- source_word: πάσχα
  choice: Emume Ngabiga
  rationale: ‘Ngabiga’ bụ aha emume ahụ, ebe ‘Emume’ na-eme ka o doo onye na-agụ ya anya na a na-ekwu banyere emume ndị Juu.
- source_word: τῶν Ἰουδαίων
  choice: ndị Juu
  rationale: N’ebe a, okwu ahụ na-akọwa Ngabiga dị ka emume ndị Juu n’ozuzu ya. Nhọrọ ‘ndị Judia’ ka edobere n’okpuru peeji n’ihi na Ἰουδαῖοι nwere ike inwe ihe ọ pụtara n’ụzọ ahụ n’ebe ụfọdụ n’akwụkwọ Jọn.
- source_word: ἀνέβη
  choice: rịgoro
  rationale: Okwu a pụtara ịrịgo, ọ bụkwa okwu a na-ejikarị eme njem gaa Jerusalem; ọ na-echekwa ma echiche banyere ebe obodo ahụ dị elu ma asụsụ njem ofufe.
- source_word: Ἱεροσόλυμα
  choice: Jerusalem
  rationale: Nke a bụ aha obodo ahụ a na-ejikarị eme ihe n’Igbo ugbu a.
- source_word: Καὶ ... καὶ
  choice: … wee …
  rationale: A hapụrụ njikọ mbụ ka usoro ahịrịokwu Igbo wee bụrụ nke e kere eke, ebe ‘wee’ na-ejikọta ihe abụọ ahụ n’ụzọ doro anya n’etinyeghị okwu oge dịka ‘ugbu a,’ nke na-adịghị n’isi mmalite.
theological_decisions:
- issue: Otú e si sụgharịa Ἰουδαῖοι n’akwụkwọ Jọn
  choice: ndị Juu
  alternative: ndị Judia
  rationale: Amaokwu a na-ekwu banyere Ngabiga dị ka emume ndị Juu, ọ bụghị kpọmkwem banyere otu ndị si n’ógbè Judia ma ọ bụ otu ndị a na-emegide. Ma ebe okwu Grik ahụ nwere ike ịpụta ‘ndị Judia’ n’ọnọdụ ụfọdụ, e debere nhọrọ ahụ n’okpuru peeji.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị mfe ma dị ùgwù, dee ya. ‘Wee rịgoro Jerusalem’ na-echekwa asụsụ njem gaa n’obodo ahụ n’enweghị nkọwa agbakwunyere.
