  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸀καὶ λέγει αὐτῇ ὁ Ἰησοῦς· Τί ἐμοὶ καὶ σοί, γύναι; οὔπω ἥκει ἡ ὥρα μου.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/004.yaml
  text: And Jesus said to her[a], “What does that have to do with me and with you[b], woman? My hour has not yet come.”
translation:
  language: ig
  text: Jizọs wee sị ya, “Gịnị ka nke a metụtara mụ na gị,[a] nwanyị?[b] Awa m erubeghị.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n’ụzọ kwekọrọ nnọọ n’okwu mbụ, “Gịnị dịịrị mụ na gị?” Nke a bụ akpaalaokwu na-egosi na ihe na-eche onye nke ọ bụla abụghị otu; ọ pụtaghị mgbe niile na iwe ma ọ bụ iro dị.
    reason: lexical_alternative
  - marker: b
    text: N’oge na omenala ahụ, “nwanyị” bụ ụzọ nkịtị e nwere ike isi kpọọ nwanyị n’ụzọ nkwanye ùgwù, ọ bụ ezie na ọ pụrụ ịdị ka okwu siri ike n’Igbo taa.
    reason: cultural_note
lexical_decisions:
- source_word: λέγει
  choice: wee sị
  rationale: Ọ bụ ezie na Grik ji ngwaa nke ugbu a n’akụkọ, “wee sị” na-aga nke ọma n’ụzọ Igbo si akọ ihe mere, ma na-edobe ọrụ okwu ahụ n’akụkọ.
- source_word: Τί ἐμοὶ καὶ σοί
  choice: Gịnị ka nke a metụtara mụ na gị
  rationale: Nke a bụ akpaalaokwu na-egosi na echiche ma ọ bụ ọrụ ha abụghị otu n’okwu ahụ, ma ọ pụtaghị na Jizọs kpọrọ nne ya asị. Nsụgharị a doro ndị na-agụ Igbo anya ma ghara ime ka okwu ahụ sie ike karịa ka Grik siri dị.
- source_word: γύναι
  choice: nwanyị
  rationale: Nke a bụ ihe okwu Grik ahụ pụtara kpọmkwem. A gbakwụnyeghị okwu na-egosi ịhụnanya nke na-adịghị na Grik, e tinyekwara nkọwa ala peeji iji kọwaa na ọ bụghị okwu mkparị n’ọnọdụ ahụ.
- source_word: οὔπω
  choice: erubeghị
  rationale: Ụdị ngwaa a na-egosi na oge ahụ abịabeghị ruo ugbu a, ya mere ọ na-ebute echiche “not yet” n'ụzọ Igbo dị mkpirikpi ma bụrụkwa eke.
- source_word: ἥκει
  choice: erubeghị
  rationale: “Iru” dabara nke ọma n’Igbo mgbe a na-ekwu na oge a kara aka abịala ma ọ bụ eruwela.
- source_word: ἡ ὥρα μου
  choice: Oge awa m
  rationale: “Oge awa” na-edobe okwu atụ pụrụ iche Jọn ji maka oge a kara Jizọs n’ọrụ ya, kama ime ka ọ bụrụ naanị “oge” n’ozuzu.
theological_decisions:
- issue: Ụda na ike okwu Jizọs gwara nne ya
  choice: Okwu nkwanye ùgwù nke na-egosikwa na echiche ma ọ bụ ọrụ ha dị iche n’ọnọdụ ahụ
  alternative: Ịba mba siri ike, ma ọ bụ okwu ịhụnanya pụrụ iche
  rationale: Akpaalaokwu ahụ na-eme ka e nwee ụfọdụ anya n’etiti ihe gbasara onye nke ọ bụla, ebe γύναι nwere ike ịbụ ụzọ kwesịrị ekwesị e si akpọ nwanyị. Nsụgharị ahụ edozighị esemokwu a n’ụzọ ga-eme ka okwu Jizọs bụrụ mkparị ma ọ bụ okwu mmetụta ịhụnanya karịa ihe Grik kwuru.
- issue: Ihe “oge awa m” pụtara n’Oziọma Jọn
  choice: Oge a kara Jizọs, nke nwere nghọta sara mbara n’ihe gbasara ọrụ ya na otuto ya
  alternative: Naanị oge ime ihe ịrịba ama ahụ, ma ọ bụ naanị okwu nkịtị banyere oge
  rationale: Jọn na-eji “oge awa” eme isiokwu pụrụ iche gbasara ọrụ Jizọs, ahụhụ ya, ọnwụ ya, mbilite n’ọnwụ ya na otuto ya. Idebe okwu ahụ n’ahịrị bụ isi na-ahapụ ndị na-agụ ya ka ha hụ njikọ ahụ n’enweghị ịkọwa ya karịa ihe amaokwu a kwuru.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dịkwa mfe nghọta. A hapụrụ akpaalaokwu ahụ ka ọ gosipụta ntakịrị anya dị n’okwu Jizọs n’enweghị ime ya mkparị; a hapụkwara “oge awa m” iji chekwaa isiokwu pụrụ iche nke Jọn.
