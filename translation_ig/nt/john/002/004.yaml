  terminology: 'Use “awa m” for ἡ ὥρα μου. It is concise, idiomatic, and preserves the Johannine keyword more closely than the redundant phrase “oge awa m.” The footnotes remain correctly anchored: [a] to the idiomatic question and [b] to “nwanyị.”'
