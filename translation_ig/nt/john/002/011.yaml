revisions:
- from: Jizọs mere nke a[a] na Kena nke Galili dị ka mmalite nke ihe ịrịba ama ya. O si otú a kpughee ebube ya, ndị na-eso ụzọ ya ekwerekwa na ya.
  to: Jizọs mere nke a[a] na Kena nke Galili dịka mmalite nke ihe ịrịba ama ya; ọ kpughere ebube ya, ndị na-eso ụzọ ya ekwerekwa na ya.
  rationale: Removed the added “si otú a” nuance, placed the Cana phrase directly with the act performed, and retained “mmalite nke ihe ịrịba ama ya” for ἀρχὴν τῶν σημείων. The footnote now gives the idiomatic and source-supported alternative “the first of his signs.”
  reviewer_model: gpt-5.6-terra
