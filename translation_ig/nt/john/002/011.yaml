id: JHN.2.11
reference: John 2:11
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ταύτην ⸀ἐποίησεν ἀρχὴν τῶν σημείων ὁ Ἰησοῦς ἐν Κανὰ τῆς Γαλιλαίας καὶ ἐφανέρωσεν τὴν δόξαν αὐτοῦ, καὶ ἐπίστευσαν εἰς αὐτὸν οἱ μαθηταὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/011.yaml
  text: Jesus did this[a], the beginning of his signs, in Cana of Galilee, and revealed his glory, and his disciples believed in him.
translation:
  language: ig
  text: Jizọs mere nke a[a] na Kena nke Galili dịka mmalite nke ihe ịrịba ama ya; ọ kpughere ebube ya, ndị na-eso ụzọ ya ekwerekwa na ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ihe ịrịba ama mbụ ya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ταύτην ἐποίησεν
  choice: mere nke a
  rationale: Nke a na-edobe nnọchiaha ngosipụta na ngwaa sara mbara nke Grik, n’etinyeghị ‘ọrụ ebube’ ma ọ bụ ‘ihe ịrịba ama’ n’ebe Grik kwuru naanị ‘nke a.’
- source_word: ἀρχὴν τῶν σημείων
  choice: dị ka mmalite nke ihe ịrịba ama ya
  rationale: ‘Mmalite’ na-egosipụta ἀρχή ma na-eme ka o doo anya n’Igbo na ihe a bụ mmalite nke usoro ihe ịrịba ama Jizọs mere.
- source_word: σημείων
  choice: ihe ịrịba ama
  rationale: 'Okwu a na-echekwa ọrụ σημεῖον dị n’Oziọma Jọn: ọrụ na-egosi ihe karịrị ike e ji mee ya, ya bụ, onye Jizọs bụ.'
- source_word: ἐν Κανὰ τῆς Γαλιλαίας
  choice: na Kena nke Galili
  rationale: Nsụgharị a na-esochi njikọ ebe dị na Grik ma na-akọwapụta Kena a na-ekwu maka ya.
- source_word: ἐφανέρωσεν
  choice: kpughee
  rationale: ‘Kpughee’ na-egosi ime ka ihe zoro ezo pụta ìhè ma ọ bụ bụrụ ihe a maara.
- source_word: τὴν δόξαν αὐτοῦ
  choice: ebube ya
  rationale: ‘Ebube’ bụ okwu Igbo kwesịrị ekwesị maka δόξα ma na-echekwa mkpa nkà mmụta okpukpe okwu ahụ nwere n’Oziọma Jọn.
- source_word: ἐπίστευσαν εἰς αὐτὸν
  choice: ekwerekwa na ya
  rationale: Nke a bụ ụzọ Igbo dị mfe ma bụrụkwa nke ebumpụta ụwa isi kwuo okwukwe na ntụkwasị obi a tụkwasịrị n’ebe mmadụ nọ.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: ndị na-eso ụzọ ya
  rationale: Nke a bụ okwu Igbo doro anya na nke a na-ejikarị akọwa μαθηταί.
theological_decisions:
- issue: Okwu σημεῖον nke Jọn ji eme ihe
  choice: ihe ịrịba ama
  alternative: ọrụ ebube
  rationale: ‘Ihe ịrịba ama’ na-echekwa echiche na ọrụ ahụ na-ekpughe onye Jizọs bụ, kama ilekwasị anya naanị n’ike ọrụ ebube ahụ.
- issue: Ike okwu ἀρχὴν τῶν σημείων
  choice: mmalite nke ihe ịrịba ama ya
  alternative: ihe ịrịba ama mbụ ya
  rationale: ‘Mmalite’ na-anọ nso n’ụdị okwu Grik ἀρχή, ebe ‘nke mbụ’ bụkwa nghọta ziri ezi e kwesịrị idebe n’okpuru peeji.
- issue: Nkwenye ndị na-eso ụzọ
  choice: ndị na-eso ụzọ ya ekwerekwa na ya
  alternative: ndị na-eso ụzọ ya tụkwasịrị ya obi
  rationale: ‘Kwere na ya’ na-echekwa okwu okwukwe nke Jọn ji eme ihe ma ghara ịkọwa oke ma ọ bụ ogo okwukwe ha karịa ihe amaokwu ahụ kwuru.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E kewara ahịrịokwu ahụ ụzọ abụọ ka njikọ ya doo anya n’Igbo, ma e chekwara usoro echiche nke Grik. Akara [a] dị n’isiokwu bụ isi ma kwekọọ na nkọwa dị n’okpuru peeji.
