review_pass:
  verdict: revise
  source_fidelity: The verse is substantially faithful. However, “ndị ọbịa” (guests) is not stated in the Greek; the generic subject is simply “they”/people generally. Removing it retains the banquet context without adding a referent. “Mgbe mmanya gbuworo ha” accurately and idiomatically conveys μεθυσθῶσιν, “when they have become drunk.”
  naturalness: The revised wording is natural Standard Igbo and preserves the concise proverbial contrast of the speaker’s observation. “Mmanya gbuworo ha” is a familiar idiom for intoxication.
  terminology: “Mmanya ọma,” “nke na-adịchaghị mma,” “edebela,” and “ruo ugbu a” represent the quality contrast, implied noun, perfect force, and temporal expression well. The footnote is revised because its prior explanation contained unnatural and imprecise wording (“ruo n’ịma mma”).
  issues:
  - severity: low
    issue: The draft adds “ndị ọbịa” to the subject of μεθυσθῶσιν.
    rationale: Guests are contextually plausible, but the Greek uses no noun here and makes a generic statement. “Ha” preserves the source’s breadth and avoids an unnecessary addition.
  - severity: medium
    issue: The footnote’s lexical explanation is imprecise and includes unnatural wording.
    rationale: μεθύω denotes becoming drunk/intoxicated; the explanatory phrase “ruo n’ịma mma” does not express this appropriately in Standard Igbo. The note should state the plain sense clearly while noting softened alternatives.
