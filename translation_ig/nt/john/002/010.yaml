id: JHN.2.10
reference: John 2:10
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτῷ· Πᾶς ἄνθρωπος πρῶτον τὸν καλὸν οἶνον τίθησιν, καὶ ὅταν ⸀μεθυσθῶσιν τὸν ἐλάσσω· σὺ τετήρηκας τὸν καλὸν οἶνον ἕως ἄρτι.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/010.yaml
  text: And he said to him[a], “Everyone sets out the good wine first, and when they have become drunk, then the inferior[b]. But you have kept the good wine until now.”
translation:
  language: ig
  text: Ọ sịrị ya, “Onye ọ bụla na-ebu ụzọ wepụta mmanya ọma; mgbe mmanya gbuworo ha[a], ọ na-ewepụta nke na-adịchaghị mma. Ma gị onwe gị edebela mmanya ọma ahụ ruo ugbu a.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “mgbe ha maburu mmanya” ma ọ bụ “mgbe ha ṅụrụ nke ukwuu.” Ngwaa Grik a na-apụtakarị na mmadụ abanyela n’ọnọdụ ịṅụbiga mmanya ókè; ụfọdụ nsụgharị na-eme ka okwu ahụ dị nro iji gosipụta na ha enweghịzi ike ịmata ọdịiche nke ọma.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει αὐτῷ
  choice: Ọ sịrị ya
  rationale: λέγει bụ historical present n’akụkọ a; Igbo na-eji oge gara aga, ‘sịrị,’ ekwu ya n’ụzọ sitere n’okike.
- source_word: Πᾶς ἄνθρωπος
  choice: Onye ọ bụla
  rationale: Nkebiokwu Grik a bụ generic singular nke na-ezo aka n’ebe mmadụ niile nọ, ọ bụghị naanị ụmụ nwoke; ‘Onye ọ bụla’ na-egosipụta nke a nke ọma n’Igbo.
- source_word: πρῶτον τὸν καλὸν οἶνον τίθησιν
  choice: na-ebu ụzọ wepụta mmanya ọma
  rationale: ‘Na-ebu ụzọ’ na-egosipụta usoro πρῶτον, ebe ‘wepụta’ na-enye echiche nke ịtọpụta ma ọ bụ isere ndị ọbịa mmanya n’oriri.
- source_word: ὅταν μεθυσθῶσιν
  choice: mgbe mmanya gbuworo ndị ọbịa
  rationale: Nke a bụ akpaalaokwu Igbo doro anya maka ndị mmanya mere ka ha ṅụọbiga ma maa mma; ọ naghị eme ka ihe μεθύω pụtara dị nro. E tinyere ‘ndị ọbịa’ iji mee ka ndị a na-ekwu banyere ha doo anya n’ọnọdụ oriri ahụ.
- source_word: τὸν ἐλάσσω
  choice: nke na-adịchaghị mma
  rationale: ‘Nke’ na-anọchi ‘mmanya’ a hapụrụ n’ahịrị Grik, ebe ‘na-adịchaghị mma’ na-egosipụta ọdịiche n’ịdị mma, ọ bụghị n’ọnụ ọgụgụ ma ọ bụ n’ọnụ ahịa.
- source_word: σὺ τετήρηκας τὸν καλὸν οἶνον
  choice: gị onwe gị edebela mmanya ọma ahụ
  rationale: ‘Gị onwe gị’ na-egosipụta nkwusi ike dị na σὺ; ‘edebela’ na-echekwa perfect tense, ya bụ, e debere mmanya ahụ ruo mgbe a.
- source_word: ἕως ἄρτι
  choice: ruo ugbu a
  rationale: Nke a bụ ụzọ Igbo sitere n’okike ma zie ezi isi gosi oge akụkọ ahụ ruru.
theological_decisions:
- issue: Otu e si sụgharị μεθυσθῶσιν n’akụkọ ọrụ ebube metụtara mmanya
  choice: mgbe mmanya gbuworo ndị ọbịa
  alternative: mgbe ha ṅụjuru afọ / mgbe ha ṅụrụ nke ukwuu
  rationale: μεθύω na-egosikarị ịṅụbiga mmanya ókè ruo n’ịma mma. Nsụgharị ahụ na-edebe okwu ahụ n’ụzọ doro anya, kama ime ka ọ dị nro n’ihi echiche okpukpe ma ọ bụ omume. Ọ bụ ihe onyeisi oriri kwuru banyere omenala ndị mmadụ, ọ bụghị nkwado ịṅụbiga mmanya ókè.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. ‘Mmanya ọma’ na ‘nke na-adịchaghị mma’ na-edebe ọdịiche nke ogo mmanya; a zere okwu pụrụ iche nke otu ụka ma ọ bụ nkọwa ga-eme ka esemokwu dị n’okwu banyere ịma mmanya pụọ.
