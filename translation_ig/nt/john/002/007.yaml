- from: Jizọs sịrị ha, “Were mmiri jujuo ite mmiri ndị ahụ.” Ha wee jujuo ha ruo n’ọnụ[a].
  to: Jizọs sịrị ha, “Jupụtanụ ite mmiri ndị ahụ na mmiri.” Ha wee jupụta ha ruo n’ọnụ[a].
  rationale: The revision replaces the less idiomatic and number-unmarked imperative construction with a natural plural imperative while preserving the command’s content. The final phrase and its alternative footnote retain the source sense of filling the jars completely to their upper limit.
  reviewer_model: gpt-5.6-terra
