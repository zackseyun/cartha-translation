review_pass:
  verdict: revise
  source_fidelity: The draft conveys Jesus’ command, the water jars, their filling with water, and the extent of filling. However, the imperative should explicitly address the plural audience, as does the Greek plural imperative γεμίσατε.
  naturalness: “Were mmiri jujuo” is understandable, but “Jupụtanụ ... na mmiri” is more idiomatic Standard Igbo for filling vessels with water and clearly marks the plural command. The narrative clause remains natural with “Ha wee jupụta ha ruo n’ọnụ.”
  terminology: “Ite mmiri” appropriately renders ὑδρίαι without importing “stone” from the preceding context. “Ruo n’ọnụ” is a suitable vessel-specific rendering of ἕως ἄνω, meaning to the brim/top.
  issues:
  - severity: medium
    issue: The command “jujuo” does not overtly mark the plural imperative.
    rationale: Γεμίσατε is explicitly plural. “Jupụtanụ” is a natural Standard Igbo plural imperative and avoids leaving this feature unexpressed.
  revised_text: Jizọs sịrị ha, “Jupụtanụ ite mmiri ndị ahụ na mmiri.” Ha wee jupụta ha ruo n’ọnụ[a].
  revised_footnotes:
