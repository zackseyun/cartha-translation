  text: λέγει αὐτοῖς ὁ Ἰησοῦς· Γεμίσατε τὰς ὑδρίας ὕδατος· καὶ ἐγέμισαν αὐτὰς ἕως ἄνω.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/007.yaml
  text: Jesus said to them[a], “Fill the water jars with water.” And they filled them to the brim.
translation:
  language: ig
  text: Jizọs sịrị ha, “Jupụtanụ ite mmiri ndị ahụ na mmiri.” Ha wee jupụta ha ruo n’ọnụ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ruo n’elu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: sịrị
  rationale: Ọ bụ ezie na Grik ji okwu dị n’oge ugbu a n’akụkọ ihe mere eme, “sịrị” bụ ụzọ Igbo si akọ ihe gara aga n’ụzọ eke.
- source_word: αὐτοῖς
  choice: ha
  rationale: Nnọchiaha a dị n’ụdị ọtụtụ ma na-egosi ndị Jizọs gwara okwu.
- source_word: Γεμίσατε
  choice: Were mmiri jujuo
  rationale: Ngwaa iwu a bụ maka ọtụtụ mmadụ. “Jujuo” na-enye iwu ka e mejupụta ite ndị ahụ kpamkpam, ebe “were mmiri” na-egosi ihe a ga-eji ju ha.
- source_word: τὰς ὑδρίας
  choice: ite mmiri ndị ahụ
  rationale: ὑδρία bụ ite e ji eche ma ọ bụ ebu mmiri. E tinyekwara “ndị ahụ” n’ihi mkpọaha Grik a kapịrị ọnụ na ihe ndị amaara site n’amaokwu bu ụzọ.
- source_word: ὕδατος
  choice: mmiri
  rationale: Ụdị genitive a na-egosi ihe a ga-eji mejupụta ite ndị ahụ; usoro “were mmiri jujuo” bụ Igbo doro anya ma dị eke.
- source_word: ἐγέμισαν
  choice: Ha wee jujuo ha
  rationale: Aorist indicative na-akọ na ha mezuru iwu ahụ; “wee” na-ejikọta omume a n’usoro akụkọ ahụ.
- source_word: ἕως ἄνω
  choice: ruo n’ọnụ
  rationale: Nkebiokwu a pụtara na mmiri ahụ ruru n’ebe kachasị elu. Maka ite, “ruo n’ọnụ” bụ okwu Igbo eke nke na-egosi na ha juru kpamkpam.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị ugbu a ma dị ùgwù. E ji “ite mmiri” mee ka ụdị arịa ahụ doo anya n’enweghị itinye nkọwa “nkume,” nke amaokwu a anaghị ekwughachi.
