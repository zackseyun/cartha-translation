id: JHN.2.16
reference: John 2:16
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ τοῖς τὰς περιστερὰς πωλοῦσιν εἶπεν· Ἄρατε ταῦτα ἐντεῦθεν, μὴ ποιεῖτε τὸν οἶκον τοῦ πατρός μου οἶκον ἐμπορίου.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/016.yaml
  text: And he said to those selling the doves[a], “Take these things away from here; do not make my Father’s house a house of trade.”
translation:
  language: ig
  text: Ọ sịrị ndị na-ere nduru, “Wepụnụ ihe ndị a n’ebe a; unu emela ụlọ Nna m ka ọ bụrụ ụlọ azụmahịa.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ebe a na-azụ ahịa.” N’asụsụ Grik, okwu ahụ bụ kpọmkwem “ụlọ azụmahịa,” nke na-edobe nkwughachi okwu “ụlọ” n’ahịrịokwu ahụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: περιστερὰς
  choice: nduru
  rationale: Okwu a na-ezo aka n’ụmụ nnụnụ a na-ere maka àjà; “nduru” bụ okwu Igbo a na-ejikarị eme ihe n’ọnọdụ a.
- source_word: πωλοῦσιν
  choice: ndị na-ere
  rationale: Nke a na-egosi ndị ahụ site n’ọrụ ire ahịa ha na-arụ mgbe ahụ, ma bụrụkwa ụzọ Igbo doro anya ma dị mfe.
- source_word: Ἄρατε
  choice: Wepụnụ
  rationale: Iwu a chọrọ ka ha mee ihe ozugbo ma kpebisie ike; “Wepụnụ” na-ejikọta echiche iburu ihe na iwepụ ya n’ebe ahụ.
- source_word: ταῦτα
  choice: ihe ndị a
  rationale: Nnọchiaha ahụ bụ nke ọtụtụ ihe na-abụghị mmadụ; “ihe ndị a” anaghị akọwapụta karịa ihe Grik kwuru.
- source_word: ἐντεῦθεν
  choice: n’ebe a
  rationale: Mgbe e jikọtara ya na “Wepụnụ,” ọ na-enye echiche zuru ezu nke iwepụ ihe site n’ebe ahụ.
- source_word: μὴ ποιεῖτε
  choice: unu emela ... ka ọ bụrụ
  rationale: Nke a na-edobe iwu mgbochi ahụ ma na-asụ ya n’ụzọ Igbo sitere n’okike, n’agbanyeghị na ọ naghị ekpebi ma ọ pụtara ịkwụsị ihe ha na-eme ugbu a ma ọ bụ izere ya.
- source_word: οἶκον τοῦ πατρός μου
  choice: ụlọ Nna m
  rationale: Nke a na-edobe ma ụlọ nsọ ahụ ma okwu Jizọs banyere mmekọrịta ya na Nna ya, n’enweghị ime ka “m” ghọọ “anyị” ma ọ bụ dochie ya na “Chineke.”
- source_word: οἶκον ἐμπορίου
  choice: ụlọ azụmahịa
  rationale: “Azụmahịa” na-egosi ire na ịzụ ahịa, ebe “ụlọ” na-edobe nkwughachi οἶκος nke dị n’ahịrịokwu Grik.
theological_decisions:
- issue: 'Aha Jizọs kpọrọ ụlọ nsọ ahụ: “ụlọ Nna m”'
  choice: E debere “ụlọ Nna m” kpọmkwem.
  alternative: ụlọ Nna anyị; ụlọ Chineke
  rationale: Grik nwere nnọchiaha nke onye mbụ otu, μου, ya mere nsụgharị ahụ kwesịrị idobe nkwupụta Jizọs banyere Nna ya na ikike ọ na-egosi n’ebe a, n’enweghị ịgbasa ma ọ bụ ime ka ọ dị nro.
- issue: Ichekwa ọdịiche dị n’etiti ụlọ Nna na ụlọ azụmahịa
  choice: E ji “ụlọ” mee ihe ugboro abụọ.
  alternative: ahịa; ebe a na-azụ ahịa
  rationale: Nkwughachi “ụlọ ... ụlọ” dị na Grik na-eme ka ọdịiche Jizọs kwuru pụta ìhè; nsụgharị ahụ na-edobe atụmatụ okwu a.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị nsọ ma dị mfe nghọta, mee ihe. E jiri ụdị ọtụtụ mmadụ “Wepụnụ” na “unu emela” mee ka o doo anya na Jizọs na-agwa ìgwè ndị na-ere nduru okwu. Akara nkọwa ala peeji [a] dị n’isiokwu ahụ ma kwekọọ na nkọwa ya.
