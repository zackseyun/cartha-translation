revisions:
- from: Ọ gwakwara ndị na-ere nduru sị, “Wepụnụ ihe ndị a n’ebe a; unu emela ụlọ Nna m ka ọ bụrụ ụlọ azụmahịa.[a]”
  to: Ọ sịrị ndị na-ere nduru, “Wepụnụ ihe ndị a n’ebe a; unu emela ụlọ Nna m ka ọ bụrụ ụlọ azụmahịa.[a]”
  rationale: The revision removes the unintended additive force in “Ọ gwakwara” while preserving the verse’s meaning, plural address, and the rhetorical repetition “ụlọ ... ụlọ.” The footnote continues to give the lexical alternative without losing that rhetorical feature.
