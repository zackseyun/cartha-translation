id: JHN.2.1
reference: John 2:1
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Καὶ τῇ ⸂ἡμέρᾳ τῇ τρίτῃ⸃ γάμος ἐγένετο ἐν Κανὰ τῆς Γαλιλαίας, καὶ ἦν ἡ μήτηρ τοῦ Ἰησοῦ ἐκεῖ·
base_translation:
  language: en
  yaml_path: translation/nt/john/002/001.yaml
  text: And on the third day there was a wedding in Cana of Galilee[b][a], and the mother of Jesus was there.
translation:
  language: ig
  text: N’ụbọchị nke atọ, e nwere agbamakwụkwọ[a] na Kena nke Galili, nne Jizọs nọkwa n’ebe ahụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “emume agbamakwụkwọ.” Okwu Grik ahụ nwere ike ịpụta ma agbamakwụkwọ n’onwe ya ma emume a na-eme maka ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: —
  rationale: E gosighị njikọ a site n’iji okwu Igbo pụrụ iche n’isi ahịrịokwu, n’ihi na ịmalite ozugbo na nkọwa oge na-aga were were n’akụkọ Igbo ma ka na-ejigide usoro akụkọ ahụ.
- source_word: τῇ ἡμέρᾳ τῇ τρίτῃ
  choice: N’ụbọchị nke atọ
  rationale: Nke a na-egosipụta kpọmkwem oge e kwuru n’asụsụ Grik n’etinyeghị nkọwa na ọ bụ ụbọchị nke atọ ‘mgbe nke ahụ gasịrị’ ma ọ bụ ihe nnọchianya.
- source_word: γάμος
  choice: agbamakwụkwọ
  rationale: ‘Agbamakwụkwọ’ bụ okwu Igbo nkịtị nke nwere ike ịpụta ma ihe omume alụmdi na nwunye ma emume ya, ya mere ọ na-echekwa obosara ihe okwu Grik ahụ pụrụ ịpụta.
- source_word: ἐγένετο
  choice: e nwere
  rationale: N’ebe a, γίνομαι na-ewebata ihe omume. ‘E nwere’ bụ ụzọ Igbo dị mfe ma kwekọọ n’ụdị akụkọ ahụ.
- source_word: ἐν Κανὰ τῆς Γαλιλαίας
  choice: na Kena nke Galili
  rationale: A sụgharịrị aha ebe ndị ahụ n’ụdị a na-amata n’Igbo, ebe ‘nke Galili’ na-egosipụta njikọ genitive nke Grik.
- source_word: ἡ μήτηρ τοῦ Ἰησοῦ
  choice: nne Jizọs
  rationale: Nke a bụ usoro genitive dị nkenke ma bụrụkwa nke e ji ekwu okwu n’Igbo, na-agbanweghị njikọ ahụ.
- source_word: ἦν … ἐκεῖ
  choice: nọkwa n’ebe ahụ
  rationale: ‘Nọ n’ebe ahụ’ na-egosipụta ọnọdụ na ebe ἦν na ἐκεῖ kwuru; ‘-kwa’ na-ejigide njikọ καὶ nke nkebi nke abụọ.
theological_decisions:
- issue: Nkọwa oge ‘ụbọchị nke atọ’
  choice: E debere ya dịka nkọwa oge n’enweghị ịtinye nkọwa banyere mbilite n’ọnwụ.
  alternative: Ịsụgharị ya n’ụzọ ga-egosi na ọ na-atụ aka n’ụzọ nnọchianya na mbilite n’ọnwụ.
  rationale: Ọ bụ ezie na onye na-agụ akwụkwọ nwere ike ịhụ njikọ isiokwu n’Oziọma Jọn, okwu ahụ n’onwe ya na-arụ ọrụ dịka nkọwa oge; nsụgharị ekwesịghị idozi ihe ọ pụrụ ịpụta n’ụzọ nkà mmụta okpukpe.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-agbaso usoro akụkọ Igbo eke, ma ọ naghị agbakwunye nkọwa na-adịghị n’asụsụ Grik.
