  terminology: “Agbamakwụkwọ” suitably preserves the breadth of γάμος as a wedding occasion, while “nne Jizọs” is a natural and accurate rendering of ἡ μήτηρ τοῦ Ἰησοῦ. The place names and temporal expression are appropriate.
