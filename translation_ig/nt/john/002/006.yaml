  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἦσαν δὲ ἐκεῖ ⸂λίθιναι ὑδρίαι⸃ ἓξ ⸂κατὰ τὸν καθαρισμὸν τῶν Ἰουδαίων κείμεναι⸃, χωροῦσαι ἀνὰ μετρητὰς δύο ἢ τρεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/006.yaml
  text: There were six stone water jars standing there[a], in accordance with the Jewish rites of purification[b], each holding two or three measures.
translation:
  language: ig
  text: N’ebe ahụ, e nwere ite mmiri isii e ji nkume mee, ndị a dọbere maka emume nsacha nke ndị Juu[a]. Nke ọ bụla n’ime ha pụrụ ịnabata ihe ọ̀tụ̀tụ̀ mmiri abụọ ma ọ bụ atọ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “dị ka emume nsacha nke ndị Juu si dị.” Okwu a na-ekwu banyere omume nsacha n’usoro okpukpe.
    reason: lexical_alternative
  - marker: b
    text: '“Ihe ọ̀tụ̀tụ̀ mmiri” (Grik: metretēs) bụ nkeji mmiri nke oge ochie, ihe dị ka galọn 8–9, ma ọ bụ lita 35–40.'
    reason: cultural_note
lexical_decisions:
- source_word: λίθιναι ὑδρίαι
  choice: ite mmiri ... e ji nkume mee
  rationale: Nke a na-egosi ma ụdị arịa ahụ—ite mmiri—ma ihe e ji mee ya—nkume—n’Igbo doro anya ma dịkwa n’okike.
- source_word: ἦσαν δὲ ἐκεῖ ... κείμεναι
  choice: E nwere ... e dowere ha n’ebe ahụ
  rationale: “E nwere” na-egosi ịdị ha n’ebe ahụ, ebe “e dowere ha” na-eburu echiche κείμεναι nke ihe edobere ma ọ bụ guzo n’otu ebe. A tụgharịghị δέ ka “ugbu a” n’ihi na ọ bụ njikọ akụkọ dị nro.
- source_word: κατὰ τὸν καθαρισμὸν τῶν Ἰουδαίων
  choice: dị ka usoro nsacha nke ndị Juu si dị
  rationale: “Usoro nsacha” na-egosi omume ime ka ihe ma ọ bụ mmadụ dị ọcha n’usoro okpukpe, ma ọ naghị akọwapụta karịa ihe Grik kwuru. “Ndị Juu” dabara n’ebe a n’ihi na okwu ahụ na-ekwu banyere omenala okpukpe ha, ọ bụghị nanị ógbè Judia.
- source_word: χωροῦσαι
  choice: Nke ọ bụla n’ime ha na-ebu
  rationale: Okwu a na-ekwu maka ikike arịa ọ bụla nwere ịnabata mmiri; “na-ebu” bụ ụzọ Igbo nkịtị si ekwu oke ihe arịa pụrụ ibu.
- source_word: ἀνὰ μετρητὰς δύο ἢ τρεῖς
  choice: ihe ọ̀tụ̀tụ̀ mmiri abụọ ma ọ bụ atọ
  rationale: ἀνά na-eme ka ọnụ ọgụgụ ahụ bụrụ nke ite nke ọ bụla. E debere nkeji oge ochie ahụ dị ka “ihe ọ̀tụ̀tụ̀ mmiri” n’ahụ amaokwu, ebe nkọwa ụkwụ na-enye nha nke oge a n’enweghị izi ezi karịrị nke isi mmalite.
theological_decisions:
- issue: Ihe Ἰουδαίων pụtara n’akụkọ Jọn
  choice: nke ndị Juu
  alternative: nke ndị Judia
  rationale: N’ebe a, ihe a na-ekwu bụ usoro nsacha okpukpe a maara n’etiti ndị Juu, ọ bụghị njirimara ndị si n’ógbè Judia. Ya mere, “ndị Juu” na-eburu echiche omenala na okpukpe nke okwu ahụ n’enweghị itinye ụda esemokwu.
- issue: Mmekọrịta κατά na usoro nsacha
  choice: dị ka usoro nsacha ... si dị
  alternative: maka usoro nsacha nke ndị Juu
  rationale: κατά nwere ike igosi nkwekọrịta na usoro ma ọ bụ njikọ arịa ndị ahụ na ebumnuche nsacha. Isi ntụgharị họọrọ echiche “dị ka ... si dị,” ebe nkọwa ụkwụ na-edobe nhọrọ nke ebumnuche ka a ghara ikpochapụ mgbagwoju anya dị na Grik.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. “Usoro nsacha” na-ezere okwu ụka pụrụ iche ma na-edobe echiche nsacha okpukpe. E tinyere akara nkọwa [a] ozugbo n’ebe okwu usoro nsacha dị, na [b] n’ebe nkeji ihe ọ̀tụ̀tụ̀ dị.
