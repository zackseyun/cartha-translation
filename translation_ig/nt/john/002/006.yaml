  to: N’ebe ahụ, e nwere ite mmiri isii e ji nkume mee, ndị a dọbere maka emume nsacha nke ndị Juu[a]. Nke ọ bụla n’ime ha pụrụ ịnabata ihe ọ̀tụ̀tụ̀ mmiri abụọ ma ọ bụ atọ[b].
