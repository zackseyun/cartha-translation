  text: καὶ ὑστερήσαντος οἴνου λέγει ἡ μήτηρ τοῦ Ἰησοῦ πρὸς αὐτόν· Οἶνον οὐκ ἔχουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/003.yaml
  text: And when the wine ran out[a], the mother of Jesus says to him[b], “They have no wine.”
translation:
  language: ig
  text: Mgbe mmanya gwụsịrị[a], nne Jizọs sịrị ya[b], “Ha enweghị mmanya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n’ụzọ dabara nnọọ n’okwu Grik, “mgbe mmanya kọrọ.”
    reason: lexical_alternative
  - marker: b
    text: 'Asụsụ Grik ji ugbu a nke akụkọ mee ihe: “na-ekwu” ma ọ bụ “na-asị.” N’Igbo, a sụgharịwo ya dịka “sịrị” ka ọ bụrụ okwu akụkọ nkịtị.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑστερήσαντος οἴνου
  choice: Mgbe mmanya gwụkwara
  rationale: Nkebiokwu genitive absolute nke nwere aorist participle na-egosi ọnọdụ mere tupu ngwaa bụ isi. “Mgbe mmanya gwụkwara” bụ Igbo ebumpụta ụwa nke na-egosi na mmanya adịkwaghị, ebe “-kwara” jikọtara ọnọdụ a na akụkọ gara aga.
- source_word: λέγει
  choice: asị
  rationale: Okwu Grik ji historical present mee ka akụkọ dị ndụ. “Asị” na-echekwa present ahụ n’ụzọ Igbo nwere ike ịnabata n’akụkọ.
- source_word: μήτηρ τοῦ Ἰησοῦ
  choice: nne Jizọs
  rationale: Nke a na-agbaso ụzọ Jọn si kpọọ ya n’ebe a ma na-ada nke ọma n’Igbo.
- source_word: πρὸς αὐτόν
  choice: ya
  rationale: N’usoro “asị ya,” nnọchiaha “ya” na-egosi onye a gwara okwu n’ụzọ dị mfe ma bụrụ Igbo ebumpụta ụwa.
- source_word: Οἶνον οὐκ ἔχουσιν
  choice: Ha enweghị mmanya
  rationale: “Ha” na-echekwa isiokwu ọtụtụ nke ederede hapụrụ ka ọnọdụ kọwaa, n’akọwaghị kpọmkwem na ọ bụ ndị nwe oriri ma ọ bụ ndị nọ n’oriri.
- source_word: οἶνος
  choice: mmanya
  rationale: “Mmanya” bụ okwu Igbo nkịtị maka wine; ọnọdụ a enyeghị ihe mere a ga-eji mee ka ihe okwu ahụ pụtara dị nro ma ọ bụ gbanwee ya.
theological_decisions:
- issue: Historical present n’akụkọ Jọn
  choice: E chekwara present ahụ site n’iji “asị.”
  alternative: A gaara eji “sịrị” mee ya past tense ka usoro akụkọ Igbo dịkwuo larịị.
  rationale: Ichekwa historical present na-egosipụta ịdị ndụ nke usoro okwu Grik ma ọ naghị etinye nkọwa ozizi ọhụrụ.
- issue: Onye “ha” na-anọchi anya n’okwu “Ha enweghị mmanya”
  choice: A hapụrụ ya dịka “ha,” ka ọnọdụ akụkọ kọwaa ya.
  alternative: A gaara akọwapụta ya dịka “ndị nwe oriri” ma ọ bụ “ndị nọ n’oriri.”
  rationale: Ederede Grik ekwughị kpọmkwem ndị ọ bụ. Ịghara ịkọwapụta ha na-echekwa nghọtahie nwere ike ịdị n’ederede ma zere itinye nkọwa na-anọghị na ya.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke dị ugbu a, dị nsọ ma dị mfe nghọta. E ji “Jizọs” dịka mkpoputa aha a na-ahụkarị n’Igbo Bible; e zere ịkọwapụta ndị “ha” bụ karịa ihe ederede kwuru.
