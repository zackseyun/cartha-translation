  text: καὶ λέγει αὐτοῖς· Ἀντλήσατε νῦν καὶ φέρετε τῷ ἀρχιτρικλίνῳ· ⸂οἱ δὲ⸃ ἤνεγκαν.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/008.yaml
  text: And he said to them[b][a], “Draw some out now and take it to the master of the feast.” So they took it.
translation:
  language: ig
  text: Ọ sịrị ha, “Kụpụta ugbu a, burukwa ya gakwuru onye na-elekọta oriri[a].” Ha wee buru ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “onyeisi ndị na-eje ozi na tebụl” ma ọ bụ “onye na-ahụ maka oriri.” Okwu Grik ahụ na-ezo aka n'onye nọ n'isi nlekọta oriri ahụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: Ọ sịrị
  rationale: Oge ugbu a e ji mee akụkọ n'asụsụ Grik ka e gosipụtara n'oge gara aga, nke bụ ụzọ ebumpụta ụwa e si akọ akụkọ n'Igbo.
- source_word: Ἀντλήσατε
  choice: setapụta ụfọdụ
  rationale: Okwu ahụ nyere iwu ka ha site n'ihe mmiri dị n'ime ya sepụta ụfọdụ; ‘ụfọdụ’ na-egosi ihe e zoro ezo n'ọnọdụ ahụ n'enweghị ịgbasawanye ihe odide.
- source_word: νῦν
  choice: Ugbu a
  rationale: Ọ na-edobe ngwa ngwa na oge iwu ahụ kpọmkwem.
- source_word: φέρετε
  choice: buru ya gakwuru
  rationale: N'Igbo, nke a na-egosi nke ọma iburu mmiri ahụ gaa nye onye ọzọ, ma na-edobe ntụziaka mmegharị ahụ.
- source_word: ἀρχιτρικλίνῳ
  choice: onye na-elekọta oriri
  rationale: Okwu Grik ahụ pụtara onye nọ n'isi nhazi na nlekọta oriri; nsụgharị a doro ndị na-agụ Igbo anya ma dị ùgwù.
- source_word: οἱ δὲ ἤνεγκαν
  choice: Ha wee buru ya gaa
  rationale: δέ bụ njikọ akụkọ dị nro, ‘wee’ na-egosikwa ihe ha mere n'ịgbaso iwu ahụ. E tinyere ‘ya’ n'ihi na ihe a na-ekwu maka ya pụtara ìhè site n'ọnọdụ ahụ.
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe nghọta ma dị ùgwù. A họọrọ ‘onye na-elekọta oriri’ kama okwu teknụzụ, ma e debere nhọrọ ndị ọzọ n'ala ala peeji. Akara ala ala peeji [a] dị n'akụkụ okwu ọ na-akọwa.
