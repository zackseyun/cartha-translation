  rationale: The revision uses a more idiomatic Standard Igbo verb for drawing liquid out while retaining the source's implied object. It keeps the immediate force of “ugbu a,” the command to take it to the banquet official, and the brief connective statement that the servants carried it. The existing lexical footnote remains properly anchored and adequate.
