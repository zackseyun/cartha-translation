id: JHN.2.22
reference: John 2:22
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὅτε οὖν ἠγέρθη ἐκ νεκρῶν, ἐμνήσθησαν οἱ μαθηταὶ αὐτοῦ ὅτι τοῦτο ἔλεγεν, καὶ ἐπίστευσαν τῇ γραφῇ καὶ τῷ λόγῳ ⸀ὃν εἶπεν ὁ Ἰησοῦς.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/022.yaml
  text: So when he was raised from the dead, his disciples remembered that he had been saying this, and they believed the Scripture and the word that Jesus had spoken.
translation:
  language: ig
  text: Ya mere, mgbe e mere ka o si nʼọnwụ bilie[a], ndị na-eso ụzọ ya chetara na ọ nọ na-ekwu nke a[b]. Ha wee kwere nʼAkwụkwọ Nsọ na nʼokwu ahụ Jizọs kwuru[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “mgbe o si nʼọnwụ bilie.” Ụdị ngwaa Grik bụ olu nnara, ya bụ, “e mere ka o bilie,” nke isi ederede chekwara.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “na o kwuru nke a.” Ụdị ngwaa Grik nwere ike igosi okwu a na-ekwu n’oge gara aga, ma ọ pụtaghị na a ga-aghọta ya dịka ihe e kwuru ọtụtụ ugboro.
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “nʼnkwupụta ahụ Jizọs kwuru.” Okwu Grik a nwere ike ịpụta okwu, nkwupụta, ma ọ bụ ozi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε οὖν
  choice: Ya mere, mgbe
  rationale: “Mgbe” na-egosi oge, ebe “ya mere” na-echekwa njikọ na ihe ndị bu ụzọ n’akụkọ ahụ.
- source_word: ἠγέρθη ἐκ νεκρῶν
  choice: e mere ka o si nʼọnwụ bilie
  rationale: Nke a na-echekwa olu nnara nke ngwaa Grik ma jiri okwu Igbo doro anya maka mbilite n’ọnwụ.
- source_word: ἐμνήσθησαν οἱ μαθηταὶ αὐτοῦ
  choice: ndị na-eso ụzọ ya chetara
  rationale: Ọ bụ nsụgharị Igbo nkịtị na nke doro anya nke icheta ihe e kwuru na mbụ.
- source_word: ὅτι τοῦτο ἔλεγεν
  choice: na ọ nọ na-ekwu nke a
  rationale: “Ọ nọ na-ekwu” na-egosipụta akụkụ na-aga n’ihu nke imperfect ἔλεγεν, n’enweghị ikwusi ike na o kwuru ya ọtụtụ ugboro.
- source_word: ἐπίστευσαν τῇ γραφῇ
  choice: Ha wee kwere nʼAkwụkwọ Nsọ
  rationale: “Kwere” na-echekwa ihe πιστεύω pụtara n’ebe a; “Akwụkwọ Nsọ” na-anọchi γραφή dị n’otu n’ụzọ Igbo a na-aghọta nke ọma.
- source_word: τῷ λόγῳ ὃν εἶπεν ὁ Ἰησοῦς
  choice: nʼokwu ahụ Jizọs kwuru
  rationale: “Okwu ahụ” na-arụtụ aka kpọmkwem n’ihe Jizọs kwuru, ma na-echekwa λόγος dị ka okwu ma ọ bụ nkwupụta.
theological_decisions:
- issue: Olu ngwaa nke mbilite n’ọnwụ
  choice: e mere ka o si nʼọnwụ bilie
  alternative: o si nʼọnwụ bilie
  rationale: Ụdị Grik bụ passive. Isi nsụgharị na-echekwa nke a kama ime ka ọ bụrụ naanị ngwaa nke onye ahụ mere n’onwe ya.
- issue: Ihe πιστεύω pụtara mgbe Akwụkwọ Nsọ na okwu Jizọs bụ ihe e kweere
  choice: kwere nʼAkwụkwọ Nsọ na nʼokwu ahụ
  alternative: tụkwasịrị Akwụkwọ Nsọ na okwu ahụ obi
  rationale: “Kwere” bụ nhọrọ na-adịghị etinye nkọwa okpukpe ọzọ n’ime ederede, ma na-egosi na ha nabatara ihe Akwụkwọ Nsọ na okwu Jizọs kwuru dị ka eziokwu.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “Ndị na-eso ụzọ” bụ okwu a na-ahụkarị maka μαθηταί; “Akwụkwọ Nsọ” bụ ụdị nkịtị maka γραφή n’ọnọdụ a. E kewara ahịrịokwu ahụ ụzọ abụọ iji mee ka ọ dị mfe ịgụ, ma e chekwara usoro echiche na njikọ nke Grik.
