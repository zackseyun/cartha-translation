id: JHN.2.20
reference: John 2:20
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἶπαν οὖν οἱ Ἰουδαῖοι· Τεσσεράκοντα καὶ ἓξ ἔτεσιν οἰκοδομήθη ὁ ναὸς οὗτος, καὶ σὺ ἐν τρισὶν ἡμέραις ἐγερεῖς αὐτόν;
base_translation:
  language: en
  yaml_path: translation/nt/john/002/020.yaml
  text: So the Jews said[a], “This temple was built in forty-six years[b], and will you raise it up in three days?”
translation:
  language: ig
  text: Ya mere, ndị Juu kwuru[a], “E ji afọ iri anọ na isii wuo ụlọ nsọ a, ma ị ga-ewulite ya[b] n’ime ụbọchị atọ?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị Judia.” N’asụsụ Grik, ọ bụ “ndị Juu”; Jọn na-eji okwu a n’ụzọ dịgasị iche dịka ọnọdụ siri dị.
    reason: alternative_reading
  - marker: b
    text: A pụkwara ịsụgharị ya, “ị ga-ewughachi ya.” Ngwaa Grik ahụ pụtara n’ụzọ bụ isi “ị ga-akpọlite ya” ma nwee njikọ Jọn ga-emesị mee na mbilite Jizọs n’ọnwụ; n’ọnọdụ a, ndị kwuru okwu a ghọtara ya dịka okwu banyere iwu ụlọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Ya mere
  rationale: Na-egosi njikọ nke ihe ha kwuru na okwu Jizọs kwuru tupu nke a, n’ụzọ doro anya ma bụrụkwa Igbo nkịtị.
- source_word: οἱ Ἰουδαῖοι
  choice: ndị Juu
  rationale: Na-edobe okwu Grik n’ebughị ụzọ mee ka ọ bụrụ naanị ndị isi okpukpe; n’Oziọma Jọn, ihe okwu a na-ezo aka na ya na-agbanwe dịka ọnọdụ siri dị.
- source_word: Τεσσεράκοντα καὶ ἓξ ἔτεσιν
  choice: afọ iri anọ na isii
  rationale: Na-egosi ogologo oge e ji rụọ ụlọ ahụ, dịka dative nke oge si arụ ọrụ n’ahịrịokwu a.
- source_word: οἰκοδομήθη
  choice: E ji ... wuo
  rationale: Na-enye aorist passive ahụ n’Igbo dị mfe ma na-egosi na ọrụ iwu ụlọ ahụ were oge a kpọrọ aha.
- source_word: ὁ ναὸς οὗτος
  choice: ụlọ nsọ a
  rationale: ναός na-ezo kpọmkwem n’ebe nsọ nke ụlọ ukwu ahụ; “ụlọ nsọ” bụ okwu Igbo doro anya ma kwekọọ n’ọnọdụ a.
- source_word: καὶ σὺ
  choice: ma ị
  rationale: “Ma” na-ebute ntụnyere nke jupụtara n’ịtụnanya, ebe “ị” na-eburu nkwusi ike dị na σὺ.
- source_word: ἐν τρισὶν ἡμέραις
  choice: n’ime ụbọchị atọ
  rationale: Na-egosi oge a ga-eji mee ihe ahụ ma na-edobe njikọ ya na okwu banyere mbilite n’ọnwụ.
- source_word: ἐγερεῖς
  choice: ga-ewulite ya
  rationale: “Wulite” nwere ike ịpụta ime ka ihe guzo ọzọ ma ọ bụ iwughachi ya; ya mere ọ na-edobe nghọta ndị na-ekwu okwu banyere ụlọ nakwa njikọ Jọn ga-eme na mbilite n’ọnwụ.
- source_word: αὐτόν
  choice: ya
  rationale: Na-ezo azụ n’ụlọ nsọ ahụ n’ụzọ Igbo nkịtị.
theological_decisions:
- issue: O nwere ike ịbụ na a ga-aghọta οἱ Ἰουδαῖοι dịka ndị Juu niile
  choice: ndị Juu
  alternative: ndị Judia; ndị isi ndị Juu
  rationale: A hapụrụ okwu isi mmalite ahụ n’ahịrịokwu bụ isi n’emeghị ka ndị ọ na-ekwu banyere ha dị warara karịa ka amaokwu ahụ kwuru; ndetu na-akọwa na ojiji Jọn na-adabere n’ọnọdụ.
- issue: Njikọ ἐγερεῖς na mbilite n’ọnwụ
  choice: ga-ewulite ya
  alternative: ga-ewughachi ya
  rationale: '“Wulite” na-edobe mgbagwoju anya ahụ: ndị na-ekwu okwu na-eche banyere ụlọ ahụ, ebe Jọn ga-ejikọta okwu ahụ na ahụ Jizọs na mbilite n’ọnwụ ya. “Wughachi” ga-ekpebi nghọta ha naanị ma bibie njikọ ahụ.'
translation_notes:
  register: Standard Igbo dị ugbu a, dị ugwu ma dị mfe nghọta. A họọrọ “ụlọ nsọ” maka ναός na “wulite” iji chekwaa ma echiche nke iwu ụlọ ma ihe atụ banyere mbilite n’ọnwụ. Ihe nrịbama ndetu [a] na [b] dị n’ahịrịokwu bụ isi.
