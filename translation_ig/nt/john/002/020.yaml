  verdict: revise
  source_fidelity: 'The main clauses accurately represent οὖν, οἱ Ἰουδαῖοι, the forty-six-year construction statement, the emphatic rhetorical question, and the three-day time expression. However, the note''s claim that “ewulite” itself preserves John’s later resurrection wording is too strong: in current Standard Igbo it is chiefly a construction verb and does not naturally carry the resurrection sense of ἐγείρω.'
  naturalness: The draft is generally fluent Standard Igbo. “E ji afọ iri anọ na isii wuo…” is an idiomatic way to express the time taken for construction. Moving the lexical note marker directly to “ewulite” makes its scope clear.
  terminology: “ụlọ nsọ” is appropriate for ναός, and “ndị Juu” correctly retains the source expression without importing “leaders.” “ndị Judia” is a suitable alternative in the contextual footnote. The wording “ewulite” can remain in the text as the natural construction-oriented sense understood by the interlocutors, while the footnote should state the lexical/thematic limitation accurately rather than asserting an exact Igbo verbal link to resurrection.
  issues:
  - severity: medium
    issue: The lexical footnote overstates the semantic effect of “ị ga-ewulite ya.”
    rationale: ἐγερεῖς is the verb John subsequently relates to resurrection. Igbo “ewulite” naturally means build/construct and does not itself preserve that resurrection wording. The main text may use it for natural idiom in the speakers’ temple-focused question, but the note must not claim that it directly retains the later verbal connection.
  - severity: low
    issue: Footnote marker [b] is placed after the closing quotation rather than at the expression it explains.
    rationale: The note concerns ἐγερεῖς/“ga-ewulite ya”; anchoring it immediately after that phrase improves clarity without altering meaning.
