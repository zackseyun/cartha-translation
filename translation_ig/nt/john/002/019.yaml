revisions:
- from: Jizọs zara ha sị, “Kwatuonụ ụlọ nsọ a, n’ime ụbọchị atọkwa, aga m akpọlite ya.”[a]
  to: Jizọs zara ha sị, “Kwatuonụ ụlọ nsọ a, aga m akpọlite ya n’ime ụbọchị atọ.”[a]
  rationale: The sole substantive revision removes “-kwa,” which has no basis in the Greek and introduces an unintended additive emphasis. The sentence order is adjusted so the temporal phrase naturally modifies “aga m akpọlite ya.” The footnote continues to preserve both the architectural alternative and the resurrection resonance, while leaving the verse’s enigma intact.
  reviewer_model: gpt-5.6-terra
