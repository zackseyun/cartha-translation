id: JHN.2.19
reference: John 2:19
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτοῖς· Λύσατε τὸν ναὸν τοῦτον καὶ ἐν τρισὶν ἡμέραις ἐγερῶ αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/019.yaml
  text: Jesus answered and said to them[a], “Destroy this temple, and in three days I will raise it up.”
translation:
  language: ig
  text: Jizọs zara ha sị, “Kwatuonụ ụlọ nsọ a, aga m akpọlite ya n’ime ụbọchị atọ.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Enwere ike ịsụgharị ya, “Kwatuonụ ụlọ nsọ a … aga m ewughachi ya.” Okwu Grik a sụgharịrị “akpọlite” nwekwara ụda metụtara mbilite n’ọnwụ; Jọn mechara kọwaa na Jizọs na-ekwu maka ụlọ nsọ nke bụ ahụ ya (2:21).
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη … καὶ εἶπεν
  choice: zara ha sị
  rationale: Nke a bụ ụzọ Igbo si akọpụta okwu Grik a n'ụzọ ebumpụta ụwa, na-egosikwa ma nzaghachi ma mmalite okwu ahụ n’enweghị ikwughachi okwu na-adịghị eke.
- source_word: Λύσατε
  choice: Kwatuonụ
  rationale: N’ọnọdụ a, λύω pụtara ịkwatu ma ọ bụ ibibi ụlọ; ‘kwatuonụ’ dabara nke ọma n’ihe gbasara ụlọ nsọ ma na-edobe iwu e nyere ọtụtụ mmadụ.
- source_word: τὸν ναὸν τοῦτον
  choice: ụlọ nsọ a
  rationale: ‘Ụlọ nsọ’ bụ okwu Igbo doro anya maka ναός n’ebe a; ‘a’ na-edobe τοῦτον ma hapụkwa ihe Jizọs na-ekwu maka ya ka ọ bụrụ ihe a ga-akọwa n’amaokwu nke 21.
- source_word: ἐν τρισὶν ἡμέραις
  choice: n’ime ụbọchị atọ
  rationale: Nke a na-edobe nkọwa oge nke Grik n’enweghị ịkọwapụta ya karịa ka isi mmalite si kwuo.
- source_word: ἐγερῶ αὐτόν
  choice: aga m akpọlite ya
  rationale: ‘Ịkpọlite’ nwere ike izo aka n’iweli ihe e kwaturu, ma nweekwa ụda metụtara mbilite n’ọnwụ. Ya mere, ọ naghị ebelata okwu ahụ ka ọ bụrụ naanị ‘iwughachi.’
theological_decisions:
- issue: Ma a ga-akọwa ‘ụlọ nsọ a’ ozugbo dịka ahụ Jizọs
  choice: Edobere ‘ụlọ nsọ a’ n’isi ederede n’enweghị mgbakwunye nkọwa.
  alternative: ụlọ nsọ a—ya bụ, ahụ m
  rationale: Amaokwu a kpachapụrụ anya hapụ ihe okwu ahụ pụtara n’ụzọ omimi; Jọn kọwara ya n’amaokwu nke 21. Ịghara ịkọwa ya tupu oge ya na-edobe usoro akụkọ na esemokwu nkà mmụta okpukpe dị n’ederede.
- issue: Ma a ga-asụgharị ἐγερῶ dịka okwu owuwu ụlọ ma ọ bụ okwu nwere ụda mbilite n’ọnwụ
  choice: aga m akpọlite ya
  alternative: aga m ewughachi ya
  rationale: ‘Akpọlite’ na-edobe njikọ nwere ike ịdị n’etiti iweli ụlọ nsọ ahụ na mbilite n’ọnwụ Jizọs, ebe ‘ewughachi’ ga-eme ka okwu ahụ bụrụ naanị nke owuwu ụlọ.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. ‘Zara ha sị’ bụ usoro okwu ebumpụta ụwa; ‘kwatuonụ’ na ‘akpọlite’ na-edobe ihe atụ ụlọ nsọ na ụda mbilite n’ọnwụ. Akara nkọwa ala peeji [a] dị n’isi ederede.
