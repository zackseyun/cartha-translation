review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys Jesus’ reply, the plural imperative to demolish the temple, the temporal phrase, and the deliberately ambiguous promise to raise it. However, the enclitic “-kwa” in “ụbọchị atọkwa” adds an ‘also/too’ emphasis not present in καί, which simply coordinates the two clauses.
  naturalness: “Jizọs zara ha sị” and “Kwatuonụ ụlọ nsọ a” are natural Standard Igbo. Removing “-kwa” makes the temporal clause idiomatic and faithful. The footnote has been lightly recast for smoother modern Igbo.
  terminology: “ụlọ nsọ” appropriately renders ναός here. “akpọlite ya” preserves the intended resonance with resurrection without prematurely identifying the temple as Jesus’ body; “ewughachi” remains a suitable lexical alternative in the note.
  issues:
  - severity: medium
    issue: Unwarranted emphatic/additive suffix in “ụbọchị atọkwa.”
    rationale: The Greek καί means ‘and’ between the imperative clause and the future clause; it does not add the sense ‘also/too’ to ‘three days.’ The suffix -kwa therefore changes the emphasis.
  revised_text: Jizọs zara ha sị, “Kwatuonụ ụlọ nsọ a, aga m akpọlite ya n’ime ụbọchị atọ.”[a]
  revised_footnotes:
  - marker: a
    text: Enwere ike ịsụgharị ya, “Kwatuonụ ụlọ nsọ a … aga m ewughachi ya.” Okwu Grik a sụgharịrị “akpọlite” nwekwara ụda metụtara mbilite n’ọnwụ; Jọn mechara kọwaa na Jizọs na-ekwu maka ụlọ nsọ nke bụ ahụ ya (2:21).
    reason: lexical_alternative
  revision_rationale: The sole substantive revision removes “-kwa,” which has no basis in the Greek and introduces an unintended additive emphasis. The sentence order is adjusted so the temporal phrase naturally modifies “aga m akpọlite ya.” The footnote continues to preserve both the architectural alternative and the resurrection resonance, while leaving the verse’s enigma intact.
