id: JHN.2.17
reference: John 2:17
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸀ἐμνήσθησαν οἱ μαθηταὶ αὐτοῦ ὅτι γεγραμμένον ἐστίν· Ὁ ζῆλος τοῦ οἴκου σου καταφάγεταί με.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/017.yaml
  text: His disciples remembered that it is written[a], “Zeal for your house will consume me.”
translation:
  language: ig
  text: 'Ndị na-eso ụzọ ya chetara na e dere[a], sị: “Ịnụ ọkụ n’obi maka ụlọ gị ga-eripịa m.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “eripịala m,” dịka okwu Abụ Ọma 69:9 si dị n’ọdịnala ederede ụfọdụ; ma Grik nke Jọn n’ebe a sịrị, “ga-eripịa m.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἐμνήσθησαν
  choice: chetara
  rationale: Ụdị aorist nke μιμνῄσκομαι pụtara na ha chetara ihe ahụ; “chetara” bụ okwu Igbo doro anya ma dịkwa n'ụzọ e si ekwu okwu ugbu a.
- source_word: μαθηταὶ
  choice: ndị na-eso ụzọ
  rationale: Nke a bụ nsụgharị Igbo a na-aghọta nke ọma maka ndị na-amụta ihe n’aka onye nkụzi ma na-eso ya.
- source_word: γεγραμμένον ἐστίν
  choice: e dere
  rationale: Ọ bụ usoro e ji ewebata ihe e dere n’Akwụkwọ Nsọ; “e dere” na-ada n’Igbo ebumpụta ụwa ma na-echekwa isi nghọta nke perfect passive ahụ.
- source_word: ζῆλος
  choice: ịnụ ọkụ n’obi
  rationale: N’ebe a ζῆλος na-egosi oke ịnụ ọkụ n’obi na nraranye siri ike. Nkebiokwu a bụ nke ndị Igbo nkịtị na-aghọta ma na-echekwa ike mmetụta ahụ.
- source_word: οἴκου
  choice: ụlọ
  rationale: A hapụrụ ya ka ọ bụrụ “ụlọ,” dị ka okwu e hotara n’Abụ Ọma, kama ịkọwa ya ozugbo dị ka “ụlọ nsọ,” nke ga-eme ka okwu ntụaka ahụ gbanwee.
- source_word: καταφάγεταί
  choice: ga-eripịa
  rationale: Future middle nke κατεσθίω nwere echiche iri ihe kpamkpam ma ọ bụ ime ka ihe gwụ; “ga-eripịa” na-echekwa ma ọdịnihu ma ike ihe atụ ahụ.
- source_word: με
  choice: m
  rationale: Nnọchiaha a bụ onye a na-eme ihe n’ahịrị ahụ, ya bụ onye na-ekwu okwu n’Abụ Ọma, nke Jọn metụtara Jizọs n’ebe a.
theological_decisions:
- issue: Ụdị ọdịnihu nke ngwaa dị n’okwu Abụ Ọma a dịka e si metụta ya na Jizọs
  choice: 'E debere ọdịnihu: “ga-eripịa m.”'
  alternative: “eripịala m” ma ọ bụ “ripịara m”
  rationale: Grik nke Jọn n’ebe a nwere καταφάγεταί, nke bụ ọdịnihu. Ya mere, nsụgharị ahụ na-agbaso okwu Jọn dịka e dere ya, n’emeghị ka ọ daba n’ụdị oge gara aga nke dị n’ọdịnala ederede ụfọdụ nke Abụ Ọma 69:9.
translation_notes:
  register: Asụsụ ahụ bụ Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “Ịnụ ọkụ n’obi” na-enye ζῆλος n’ụzọ ebumpụta ụwa, ebe “ga-eripịa” na-echekwa ihe atụ siri ike na ọdịnihu nke Grik.
