id: JHN.2.15
reference: John 2:15
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ποιήσας φραγέλλιον ἐκ σχοινίων πάντας ἐξέβαλεν ἐκ τοῦ ἱεροῦ τά τε πρόβατα καὶ τοὺς βόας, καὶ τῶν κολλυβιστῶν ἐξέχεεν ⸂τὰ κέρματα⸃ καὶ τὰς τραπέζας ⸀ἀνέστρεψεν,
base_translation:
  language: en
  yaml_path: translation/nt/john/002/015.yaml
  text: And after making a whip out of cords[a], he drove them all out of the temple courts, including both the sheep and the cattle[c][b]; and he poured out the coins of the money changers and overturned the tables.
translation:
  language: ig
  text: O ji ụdọ mee ụtarị, chụpụ ha niile n’ogige ụlọ nsọ ahụ[a]—ma atụrụ ma ehi[b][c]. Ọ wụsara mkpụrụ ego ndị na-agbanwe ego ahụ, kwatuokwa tebụl ndị ahụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Okwu Grik ἱερόν na-ezo aka n’ụlọ nsọ ahụ na ogige ya dum, ọ bụghị kpọmkwem n’ebe nsọ dị n’ime ya.
    reason: cultural_note
  - marker: b
    text: A pụkwara ịsụ ya, “ma atụrụ ma oke ehi.”
    reason: lexical_alternative
  - marker: c
    text: Okwu Grik ahụ buru ụzọ kwuo “ha niile,” mesịa kpọọ “ma atụrụ ma ehi” aha. Ọ naghị ekwu hoo haa na e ji ụtarị ahụ mee ihe n’ahụ ndị mmadụ.
    reason: alternative_reading
lexical_decisions:
- source_word: ποιήσας
  choice: O mechara ... mee
  rationale: Aorist participle ahụ na-egosi ihe o mere tupu isi omume ahụ; ntụgharị a na-egosi usoro omume ahụ n’Igbo dị mfe.
- source_word: φραγέλλιον
  choice: ụtarị
  rationale: Ọ bụ ngwa yiri ụtarị; okwu a bụ nke doro anya ma bụrụkwa nke ndị na-asụ Igbo taa maara.
- source_word: ἐκ σχοινίων
  choice: jiri ụdọ
  rationale: Ọ na-egosi ihe e ji mee ụtarị ahụ; “ụdọ” nwere ike ịpụta cord ma ọ bụ rope n’ụzọ dabara n’ebe a.
- source_word: πάντας
  choice: ha niile
  rationale: Ọ na-edobe ike okwu Grik nke pụtara ‘ha niile’ n’emeghị ka a mara kpọmkwem ma ọ na-ekwu naanị anụmanụ ma ọ bụ ndị mmadụ na anụmanụ.
- source_word: ἐξέβαλεν
  choice: chụpụ
  rationale: Okwu a na-egosi ịchụpụ n’ike ma bụrụkwa okwu Igbo e ji ekwu ụdị omume a.
- source_word: τοῦ ἱεροῦ
  choice: n’ogige ụlọ nsọ ahụ
  rationale: ἱερόν na-ezo aka n’ụlọ nsọ ahụ na ogige ya dum, ọ bụghị kpọmkwem n’ebe nsọ dị n’ime ụlọ ahụ.
- source_word: τά τε πρόβατα καὶ τοὺς βόας
  choice: ma atụrụ ma ehi
  rationale: Ọ na-edobe nhazi nke gụnyere ụdị anụmanụ abụọ ahụ. “Ehi” bụ okwu Igbo sara mbara ma dị mfe nghọta maka βοῦς.
- source_word: κολλυβιστῶν
  choice: ndị na-agbanwe ego
  rationale: Nke a na-akọwa ndị na-agbanwe otu ụdị ego ka ọ bụrụ ụdị ọzọ n’ogige ụlọ nsọ.
- source_word: ἐξέχεεν τὰ κέρματα
  choice: ọ wụsara mkpụrụ ego
  rationale: “Wụsara” na-edobe ihe oyiyi nkịtị nke ἐκχέω, ebe “mkpụrụ ego” na-enye κέρματα n’Igbo doro anya.
- source_word: ἀνέστρεψεν
  choice: kwatuokwa
  rationale: N’ebe a, ngwaa ahụ pụtara ịtụgharị tebụl ka ọ daa; “kwatuo” na-enye ihe omume ahụ n’Igbo eke.
theological_decisions:
- issue: Ndị Jizọs chụpụrụ na otú o si jiri ụtarị ahụ mee ihe
  choice: E debere “ha niile,” e mesịakwa kpọọ atụrụ na ehi aha, ma ekwughị na Jizọs ji ụtarị ahụ tie ma ọ bụ chụpụ ndị mmadụ.
  alternative: Ịsị na ọ chụpụrụ ndị mmadụ na anụmanụ niile, ma ọ bụ na ọ chụpụrụ naanị anụmanụ.
  rationale: Nhazi okwu Grik nwere πάντας, e mesịakwa kọwaa atụrụ na ehi; ma ọ naghị ekwu hoo haa na e jiri ụtarị ahụ mee ihe megide ndị mmadụ. Ya mere, ntụgharị ahụ na-ahapụ nghọtahie a ka ọ dị.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. A họọrọ “ogige ụlọ nsọ” iji kewaa ἱερόν na ebe nsọ dị n’ime ụlọ ahụ; e debekwara nghọtahie dị na πάντας n’enweghị ịmanye otu nkọwa.
