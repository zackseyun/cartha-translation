review_pass:
  verdict: revise
  source_fidelity: The translation correctly renders the emphatic contrast, Jesus’ non-self-commitment to the people, the causal clause, and the comprehensive object “all people.” However, “anaghị etinye” is present/habitual in ordinary Standard Igbo, whereas the Greek imperfect occurs in a past narrative setting. A past negative form is needed; the proposed form gives idiomatic narrative past while not overclaiming a particular nuance of the imperfect.
  naturalness: “Itinye onwe ya n’aka” is understandable, but “ịtụkwasị onwe ya n’aka” is the more natural Standard Igbo expression for entrusting oneself to others. The revised sentence is fluent and suitably dignified.
  terminology: “Jizọs n’onwe ya,” “n’ihi na,” and “mmadụ niile” are appropriate. The footnote should match the revised wording and accurately explain the Greek lexical connection with the preceding verse.
  issues:
  - severity: medium
    issue: The main verb “anaghị etinye” is present/habitual rather than past narrative.
    rationale: οὐκ ἐπίστευεν is an imperfect in a past narrative context. Although the imperfect may suggest a continuing disposition, Standard Igbo “anaghị” normally locates the denial in the present. “Atụkwasịghị” naturally renders the past negative without adding meaning.
  - severity: low
    issue: The text and footnote use different verb forms and wording for Jesus’ action.
    rationale: The text has “anaghị etinye,” while the footnote has “etinyeghị.” Aligning both with “atụkwasịghị onwe ya n’aka” improves consistency and makes the lexical explanation clear.
  revised_text: Ma Jizọs n’onwe ya atụkwasịghị onwe ya n’aka ha[a], n’ihi na ọ maara mmadụ niile.
  revised_footnotes:
  - marker: a
    text: 'N’asụsụ Grik, e ji otu ngwaa ahụ e ji mee ihe n’amaokwu bu ụzọ: ọtụtụ mmadụ “kweere na” Jizọs, ma Jizọs “atụkwasịghị onwe ya n’aka” ha.'
    reason: lexical_alternative
