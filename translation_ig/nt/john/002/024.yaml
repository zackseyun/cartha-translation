base_translation:
  language: en
  yaml_path: translation/nt/john/002/024.yaml
  text: But Jesus himself was not entrusting himself to them[a], because he knew all people,
translation:
  language: ig
  text: Ma Jizọs n’onwe ya atụkwasịghị onwe ya n’aka ha[a], n’ihi na ọ maara mmadụ niile.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'N’asụsụ Grik, e ji otu ngwaa ahụ e ji mee ihe n’amaokwu bu ụzọ: ọtụtụ mmadụ “kweere na” Jizọs, ma Jizọs “atụkwasịghị onwe ya n’aka” ha.'
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτὸς δὲ Ἰησοῦς
  choice: Ma Jizọs n’onwe ya
  rationale: A sụgharịrị δέ dị ka “Ma” iji gosi ntụgharị megidere ihe dị n’amaokwu gara aga; “n’onwe ya” na-egosipụta nkwusi ike nke αὐτός.
- source_word: οὐκ ἐπίστευεν
  choice: anaghị etinye onwe ya n’aka
  rationale: N’ebe a πιστεύω nwere onwe Jizọs dịka ihe ọ na-enyefe na ndị ahụ dịka ndị a ga-enyefe ya n’aka; ya mere okwu Igbo a na-egosi ịtụkwasị ma ọ bụ inyefe onwe ya n’aka mmadụ. Ụdị “anaghị” na-echekwa echiche omume na-aga n’ihu ma ọ bụ mkpebi ya n’oge ahụ.
- source_word: αὑτὸν αὐτοῖς
  choice: onwe ya n’aka ha
  rationale: Nke a bụ ụzọ Igbo dị mma isi kwuo inyefe ma ọ bụ ịtụkwasị onwe mmadụ n’aka ndị ọzọ, ma na-echekwa nnọchiaha nlọghachi αὑτόν na αὐτοῖς.
- source_word: διὰ τὸ
  choice: n’ihi na
  rationale: διά tinyere infinitive nwere article na-enye ihe kpatara ya; “n’ihi na” bụ okwu Igbo doro anya ma dịrị ndụ.
- source_word: αὐτὸν γινώσκειν
  choice: ọ maara
  rationale: A gbanwere ahịrị infinitive ahụ ka ọ bụrụ nkebiokwu zuru ezu n’Igbo, ebe γινώσκω n’ebe a pụtara ịma ma ọ bụ ịghọta mmadụ.
- source_word: πάντας
  choice: mmadụ niile
  rationale: Ụdị ọtụtụ nwoke a na-ekwu maka ụmụ mmadụ n’ozuzu ha; “mmadụ niile” adịghị amachi ya n’otu ìgwè ma kwekọọ n’Igbo nkịtị.
theological_decisions:
- issue: Ijigide njikọ dị n’etiti πιστεύω n’amaokwu 23 na 24
  choice: N’amaokwu 24, jiri “etinye onwe ya n’aka ha,” ma kọwaa njikọ okwu ahụ n’okpuru peeji.
  alternative: Iji otu okwu Igbo pụtara “ikwere” n’amaokwu abụọ ahụ, ma ọ bụ iji “ịtụkwasị ha obi.”
  rationale: 'Otu ngwaa Grik ahụ na-emepụta egwuregwu okwu: ọtụtụ kweere na Jizọs, ma Jizọs etinyeghị onwe ya n’aka ha. Ikwughachi “ikwere” agaghị ekwu ezi ihe n’Igbo n’amaokwu 24; nkọwa n’okpuru peeji na-echekwa njikọ ahụ n’emeghị ka ahịrịokwu ghara ịdị n’Igbo ọma.'
- issue: Oke πάντας
  choice: mmadụ niile
  alternative: ha niile; onye ọ bụla
  rationale: Ihe odide ahụ na-ekwu n’ozuzu ya gbasara ihe Jizọs maara banyere mmadụ, na-enweghị ime ka ọ bụrụ naanị otu ìgwè ma ọ bụ ịgbakwụnye nkọwa ozizi karịrị okwu amaokwu ahụ.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. “N’onwe ya” na-enye nkwusi ike; “itinye onwe ya n’aka” bụ akpaalaokwu ebumpụta ụwa nke na-egosi inyefe ma ọ bụ ịtụkwasị onwe mmadụ n’aka ndị ọzọ. Akara nkọwa [a] dị n’isiokwu ahụ.
