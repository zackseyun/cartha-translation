- from: Ma Jizọs n’onwe ya anaghị etinye onwe ya n’aka ha[a], n’ihi na ọ maara mmadụ niile.
  to: Ma Jizọs n’onwe ya atụkwasịghị onwe ya n’aka ha[a], n’ihi na ọ maara mmadụ niile.
  rationale: The revision changes the present/habitual negative to an idiomatic past narrative form and uses the more natural expression “ịtụkwasị onwe ya n’aka.” It preserves the emphatic contrast, the causal relation, the broad scope of πάντας, and the documented wordplay between believing in Jesus and Jesus’ not entrusting himself to the people.
