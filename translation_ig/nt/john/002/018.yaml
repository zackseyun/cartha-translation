id: JHN.2.18
reference: John 2:18
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀπεκρίθησαν οὖν οἱ Ἰουδαῖοι καὶ εἶπαν αὐτῷ· Τί σημεῖον δεικνύεις ἡμῖν, ὅτι ταῦτα ποιεῖς;
base_translation:
  language: en
  yaml_path: translation/nt/john/002/018.yaml
  text: So the Jews answered and said to him[a], “What sign do you show us, that you do these things?”
translation:
  language: ig
  text: N’ihi ya, ndị Juu zara ya sị[a], “Olee ihe ịrịba ama ị na-egosi anyị n’ihi na ị na-eme ihe ndị a?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịtụgharị ya “ndị isi ndị Juu” ma ọ bụ “ndị Judia.” N’Oziọma Jọn, “ndị Juu” pụrụ izo aka n’ụzọ dị warara n’otu ndị nnọchiteanya, karịchaa ndị ọchịchị Judia, dịka ọnọdụ okwu siri dị.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθησαν οὖν
  choice: N’ihi ya, ... zara
  rationale: “N’ihi ya” na-egosi njikọ na ihe Jizọs mere n’ụlọ nsọ n’amaokwu bu ụzọ; “zara” bụ ụzọ Igbo si ewebata nzaghachi n’akụkọ.
- source_word: οἱ Ἰουδαῖοι
  choice: ndị Juu
  rationale: Nke a na-edobe okwu Grik n’ụzọ kwụ ọtọ, n’etinyeghị “ndị isi” n’ahịrịokwu bụ isi ebe ederede ekwughị ya kpọmkwem.
- source_word: εἶπαν αὐτῷ
  choice: ya sị
  rationale: “Zara ya sị” bụ usoro okwu Igbo dị ndụ ma kwekọọ na okwu abụọ ahụ ọnụ, n’agbanyeghị na ọ naghị emegharị “zara” na “kwuru” n’ụzọ siri ike.
- source_word: Τί σημεῖον
  choice: Olee ihe ịrịba ama
  rationale: '“Ihe ịrịba ama” na-echekwa isi okwu σημεῖον n’Oziọma Jọn: ọrụ a na-ahụ anya nke na-egosi ma na-akwado ihe karịrị onwe ya; ọ bụghị naanị “ọrụ ebube.”'
- source_word: δεικνύεις ἡμῖν
  choice: ị ga-egosi anyị
  rationale: Ajụjụ a bụ arịrịọ ka o nye ha ihe ịrịba ama a ga-ahụ anya. N’Igbo, “ị ga-egosi anyị” na-ada nke ọma dị ka ihe akaebe ha na-achọ ugbu a, na-enweghị ịgbakwunye “ị nwere ike.”
- source_word: ὅτι ταῦτα ποιεῖς
  choice: iji gosi na i nwere ikike ime ihe ndị a
  rationale: 'N’ọnọdụ a, ὅτι na-ejikọta arịrịọ maka ihe ịrịba ama na ihe mere ha ji achọ ya: Jizọs na-eme ihe ndị a. N’Igbo, ntụgharị a na-eme ka ebumnuche nke ajụjụ ahụ doo anya—ha na-arịọ ihe ga-akwado ikike ya—ma na-echekwa “ihe ndị a” dịka nrụtụ aka n’ihe o mere n’ụlọ nsọ.'
theological_decisions:
- issue: Ndị οἱ Ἰουδαῖοι na-ezo aka na ha n’Oziọma Jọn
  choice: Edobere “ndị Juu” n’ahịrịokwu bụ isi, tinyekwa nkọwa ala peeji.
  alternative: “ndị isi ndị Juu” ma ọ bụ “ndị Judia”
  rationale: Okwu Grik n’onwe ya bụ “ndị Juu,” ọ bụ ezie na n’Oziọma Jọn ọ pụrụ izo aka n’ụzọ dị warara n’ahụ ndị nnọchiteanya ma ọ bụ ndị ọchịchị Judia. Ịhapụ okwu ahụ n’ahịrịokwu bụ isi ma kọwaa ohere ndị ọzọ na-ezere ịmanye otu nkọwa n’ime ederede.
- issue: Ihe arịrịọ maka σημεῖον pụtara n’ọnọdụ a
  choice: E gosipụtara ya dị ka ihe ịrịba ama ga-akwado ikike Jizọs ime ihe ndị a.
  alternative: “Olee ọrụ ebube ị ga-arụ?” ma ọ bụ ntụgharị nkịtị “...na ị na-eme ihe ndị a?”
  rationale: Ajụjụ ahụ abụghị naanị arịrịọ maka ọrụ ebube; ndị na-ekwu okwu na-achọ ihe ga-egosi na Jizọs nwere ikike maka omume ya n’ụlọ nsọ. “Ihe ịrịba ama” na-echekwa okwu Jọn, ebe “iji gosi na i nwere ikike” na-eme ka njikọ ὅτι pụta n’Igbo ekeghị ozizi ọzọ.
translation_notes:
  register: Standard Igbo; asụsụ dị ugbu a, dị ùgwù, ma dị mfe nghọta. Ejiri “zara ya sị” mee ka mmalite okwu kpọmkwem daa n’ụzọ Igbo nkịtị. Akara nkọwa [a] dị n’ahịrịokwu bụ isi.
