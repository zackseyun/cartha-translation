revisions:
- from: N’ihi ya, ndị Juu zara ya sị[a], “Olee ihe ịrịba ama ị ga-egosi anyị iji gosi na i nwere ikike ime ihe ndị a?”
  to: N’ihi ya, ndị Juu zara ya sị[a], “Olee ihe ịrịba ama ị na-egosi anyị n’ihi na ị na-eme ihe ndị a?”
  rationale: The revision removes the added notion of authority, restores the present force of δεικνύεις, and renders ὅτι as a ground (“n’ihi na”) for the demand, while retaining the plural “ihe ndị a.” The contextual implication that the sign would authenticate Jesus’ action remains available but is not inserted into the wording.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T05:37:54Z'
review_pass:
  verdict: revise
  source_fidelity: 'The draft adds material not expressed in the Greek: “iji gosi na i nwere ikike” (‘to show that you have authority’) interprets the requested sign as proof of authority and changes the ὅτι clause into a purpose construction. It also renders the present δεικνύεις as future (“ị ga-egosi”). The revision retains the sign terminology, present-time challenge, and causal/ground relation without making the implicit issue of authority explicit.'
  naturalness: “N’ihi ya, ndị Juu zara ya sị” is natural Standard Igbo narrative dialogue. “Olee ihe ịrịba ama ị na-egosi anyị n’ihi na ị na-eme ihe ndị a?” is clear and idiomatic while keeping the direct challenge.
  terminology: “ndị Juu” appropriately preserves οἱ Ἰουδαῖοι in the main text, and “ihe ịrịba ama” correctly preserves John’s σημεῖον terminology. The footnote appropriately signals possible contextual narrowing without putting it into the translation.
  issues:
  - severity: high
    issue: The phrase “iji gosi na i nwere ikike” adds an explicit claim of Jesus’ authority and a purposive construction.
    rationale: Neither “authority” nor a purpose infinitive is present in Τί σημεῖον δεικνύεις ἡμῖν, ὅτι ταῦτα ποιεῖς;. The question may imply a demand for authorization in context, but the translation should not state that implication as the text’s wording.
  - severity: medium
    issue: “ị ga-egosi” renders δεικνύεις as future.
    rationale: 'δεικνύεις is present tense: ‘you show/are showing.’ A present Igbo form better preserves the immediate challenge.'
  revised_text: N’ihi ya, ndị Juu zara ya sị[a], “Olee ihe ịrịba ama ị na-egosi anyị n’ihi na ị na-eme ihe ndị a?”
  revised_footnotes:
