id: JHN.2.25
reference: John 2:25
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ὅτι οὐ χρείαν εἶχεν ἵνα τις μαρτυρήσῃ περὶ τοῦ ἀνθρώπου, αὐτὸς γὰρ ἐγίνωσκεν τί ἦν ἐν τῷ ἀνθρώπῳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/025.yaml
  text: and because he had no need that anyone should testify about man[a], for he himself knew what was in man.
translation:
  language: ig
  text: ọ dịghịkwa ya mkpa ka onye ọ bụla gbaa àmà banyere mmadụ[a], n’ihi na ya onwe ya maara ihe dị n’ime mmadụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, ‘banyere otu onye’ / ‘ihe dị n’ime otu onye.’ Okwu Grik ahụ ji ‘mmadụ’ n’ụdị otu anọchite onye ọ bụla ma ọ bụ mmadụ n’ozuzu ha.
    reason: lexical_alternative
lexical_decisions:
- source_word: χρείαν εἶχεν
  choice: ọ dịghịkwa ya mkpa
  rationale: Nke a na-asụgharị akpaalaokwu ahụ n’ụzọ Igbo nkịtị ma na-edobe echiche nke ‘enweghị mkpa.’
- source_word: ἵνα τις μαρτυρήσῃ
  choice: ka onye ọ bụla gbaara ya àmà
  rationale: ‘Ịgba àmà’ na-edobe ike okwu μαρτυρέω nke ịkọ ihe mmadụ maara ma ọ bụ hụ; ‘onye ọ bụla’ dabara n’ụdị njụ nke ahịrịokwu ahụ.
- source_word: περὶ τοῦ ἀνθρώπου
  choice: banyere mmadụ
  rationale: ‘Mmadụ’ bụ okwu Igbo na-anọchite onye mmadụ n’ozuzu ya, ma na-edobe otu mkpụrụ okwu ahụ e ji mee ihe ugboro abụọ na Grik.
- source_word: αὐτὸς γὰρ
  choice: n’ihi na ya onwe ya
  rationale: ‘Ya onwe ya’ na-egosipụta nkwusi ike dị na αὐτός, ebe ‘n’ihi na’ na-egosi na nkebi a na-akọwa ihe kpatara nke bu ya ụzọ.
- source_word: ἐγίνωσκεν
  choice: maara
  rationale: ‘Maara’ bụ nsụgharị Igbo e ji ekwu ọnọdụ ọmụma na-adịgide adịgide; ọ dịghị mkpa ime ka imperfect pụta dịka omume na-aga n’ihu n’ụzọ na-adịghị eke n’Igbo.
- source_word: τί ἦν ἐν τῷ ἀνθρώπῳ
  choice: ihe dị n’ime mmadụ
  rationale: Nke a na-edobe obosara na nghọta ime obi nke okwu Grik ahụ, n’ejighị nkọwa ọzọ kpebie ma ọ bụ ọdịdị mmadụ n’ozuzu ya ma ọ bụ ihe dị n’ime onye ọ bụla.
theological_decisions:
- issue: Ókè ọmụma Jizọs banyere mmadụ
  choice: A sụgharịrị ya dịka ọmụma Jizọs n’onwe ya nwere banyere ihe dị n’ime mmadụ, n’emeghị ka ókè ya dị warara ma ọ bụ gbasaa ya site n’ịgbakwunye nkọwa ozizi.
  alternative: ‘ihe dị n’ime onye ọ bụla’ ma ọ bụ ‘ọdịdị mmadụ n’ozuzu ya’
  rationale: Otu mkpụrụ okwu ἀνθρώπου/ἀνθρώπῳ nwere ike ịnọchite mmadụ n’ozuzu ya ma nweekwa ntụaka nye onye ọ bụla. Nsụgharị ahụ na-ahapụ obosara a dịka isi mmalite si dị.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. E jigidere nkwughachi ‘mmadụ’ iji gosipụta njikọ okwu dị na Grik, ma e tinyere ‘ya’ mgbe ‘gbaara’ gasịrị iji mee ka Igbo doo anya na àmà ahụ bụ nke a ga-agbara Jizọs.
