revisions:
- from: ọ dịghịkwa ya mkpa ka onye ọ bụla gbaara ya àmà banyere mmadụ[a], n’ihi na ya onwe ya maara ihe dị n’ime mmadụ.
  to: ọ dịghịkwa ya mkpa ka onye ọ bụla gbaa àmà banyere mmadụ[a], n’ihi na ya onwe ya maara ihe dị n’ime mmadụ.
  rationale: The revision removes an added indirect object so that the testimony is only “about” humanity/a person, as in the Greek. It also uses the subjunctive-like Igbo form “gbaa” after “ka” and clarifies the footnote’s account of the generic singular, while retaining the source’s deliberate breadth and repeated “mmadụ.”
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T05:37:49Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys Jesus' lack of need for outside testimony and his direct knowledge of what is in humanity/persons. However, adding “ya” in “gbaara ya àmà” introduces Jesus as the recipient of the testimony; the Greek says only that someone might testify concerning a human being/person (περὶ τοῦ ἀνθρώπου).
  naturalness: The verse is otherwise clear, dignified Standard Igbo. “ka onye ọ bụla gbaa àmà banyere mmadụ” is both more natural in this construction and more faithful than “ka onye ọ bụla gbaara ya àmà banyere mmadụ.”
  terminology: “Mkpa,” “ịgba àmà,” and “maara ihe dị n’ime mmadụ” suitably render the key terms. The footnote should describe the Greek singular more idiomatically as use of “mmadụ” in a singular form, rather than “n’otu mkpụrụ okwu.”
  issues:
  - severity: medium
    issue: The phrase “gbaara ya àmà” adds a recipient (“to him”).
    rationale: μαρτυρήσῃ περὶ τοῦ ἀνθρώπου means “testify concerning/about the human being/person”; it contains no dative referring to Jesus. Removing “ya” avoids adding this relation.
  - severity: low
    issue: The footnote’s explanation “n’otu mkpụrụ okwu” is imprecise and unnatural for the Greek singular.
    rationale: The point is grammatical number/generic reference, not that the term is one word. “n’ụdị otu” expresses the intended point clearly.
  revised_text: ọ dịghịkwa ya mkpa ka onye ọ bụla gbaa àmà banyere mmadụ[a], n’ihi na ya onwe ya maara ihe dị n’ime mmadụ.
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, ‘banyere otu onye’ / ‘ihe dị n’ime otu onye.’ Okwu Grik ahụ ji ‘mmadụ’ n’ụdị otu anọchite onye ọ bụla ma ọ bụ mmadụ n’ozuzu ha.
    reason: lexical_alternative
  revision_rationale: The revision removes an added indirect object so that the testimony is only “about” humanity/a person, as in the Greek. It also uses the subjunctive-like Igbo form “gbaa” after “ka” and clarifies the footnote’s account of the generic singular, while retaining the source’s deliberate breadth and repeated “mmadụ.”
