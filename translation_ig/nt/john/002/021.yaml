  text: ἐκεῖνος δὲ ἔλεγεν περὶ τοῦ ναοῦ τοῦ σώματος αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/021.yaml
  text: But he was speaking about the temple of his body[a].
translation:
  language: ig
  text: Ma ọ nọ na-ekwu banyere ụlọ nsọ nke ahụ ya[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ebe nsọ nke ahụ ya.” Okwu Grik e ji mee ihe ebe a bụ naos; ọ na-ezokarị aka kpọmkwem n'ebe nsọ dị n'ime ụlọ nsọ, kama ọ bụghị n'ogige ụlọ nsọ dum.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκεῖνος
  choice: ọ
  rationale: N'okwu gbara ya gburugburu, nnọchiaha ngosi a na-arụtụ aka na Jizọs; “ọ” bụ ụzọ Igbo si kwuo ya nke ọma n'enweghị imesi ya ike na-enweghị mkpa.
- source_word: δὲ
  choice: Ma
  rationale: Ọ na-egosi obere ọdịiche dị n'etiti nghọtahie e kwuru n'amaokwu bu ụzọ na nkọwa Jọn nyere ebe a.
- source_word: ἔλεγεν
  choice: ihe ọ na-ekwu
  rationale: Ụdị imperfect na-egosi okwu ọ na-ekwu n'oge ahụ; ntụgharị a na-edobe echiche nke ikwu okwu kama iji “ihe ọ pụtara,” nke ga-abụ nkọwa agbakwunyere.
- source_word: περὶ
  choice: banyere
  rationale: Nke a bụ okwu Igbo doro anya ma kwekọọ na περί ya na genitive.
- source_word: ναοῦ
  choice: ụlọ nsọ
  rationale: “Ụlọ nsọ” bụ okwu Igbo a na-aghọta nke ọma maka temple; nkọwa ala peeji na-echekwa nghọta pụrụ iche nke ναός dịka ebe nsọ dị n'ime ụlọ ukwu ahụ.
- source_word: σώματος
  choice: ahụ
  rationale: Ọ na-edobe okwu nkịtị na nke dị mkpa n'echiche okpukpe nke na-arụtụ aka n'ahụ Jizọs.
- source_word: αὐτοῦ
  choice: ya
  rationale: Ọ na-egosi n'ụzọ doro anya na ahụ ahụ bụ nke Jizọs.
theological_decisions:
- issue: Iji ahụ Jizọs tụnyere ụlọ nsọ
  choice: ụlọ nsọ nke bụ ahụ ya
  alternative: ụlọ nsọ nke ahụ ya
  rationale: Nke a na-edobe ihe atụ ahụ kpọmkwem ma na-eme ka mmekọrịta genitive ahụ doo anya n'Igbo n'enweghị itinye nkọwa ozizi ọzọ. Nhọrọ nke dị nso n'ụdị Grik, “ụlọ nsọ nke ahụ ya,” nwere ike ịdị ka ụlọ nsọ bụ ihe dị iche nke ahụ nwere.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị mfe nghọta ma dịkwa nsọpụrụ. A họọrọ “ihe ọ na-ekwu” iji chekwaa omume gara aga nke imperfect, ebe “nke bụ” na-eme ka ihe atụ ahụ doo anya n'usoro Igbo.
