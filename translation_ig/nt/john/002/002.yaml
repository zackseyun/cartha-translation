  text: ἐκλήθη δὲ καὶ ὁ Ἰησοῦς καὶ οἱ μαθηταὶ αὐτοῦ εἰς τὸν γάμον.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/002.yaml
  text: Jesus also was invited to the wedding[a], along with his disciples.
translation:
  language: ig
  text: A kpọkwara Jizọs na ndị na-eso ụzọ ya òkù ịbịa n’agbamakwụkwọ ahụ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκλήθη
  choice: a kpọkwara ... òkù
  rationale: N'ọnọdụ emume agbamakwụkwọ, passive nke καλέω pụtara na a kpọrọ mmadụ òkù, ọ bụghị naanị na a kpọrọ ya aha ma ọ bụ kpọọ ya ka ọ bịa.
- source_word: δὲ καὶ
  choice: -kwara
  rationale: Ngwakọta δὲ na καὶ na-agbakwunye Jizọs na ndị a kpọrọ òkù e kwuru okwu ha na amaokwu gara aga; mgbakwunye -kwara na-egosipụta nke a n'Igbo n'ụzọ eke.
- source_word: ὁ Ἰησοῦς
  choice: Jizọs
  rationale: E dere aha ahụ n'ụdị a na-ejikarị ede ya n'Igbo.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: ndị na-eso ụzọ ya
  rationale: Nke a bụ okwu Igbo a maara nke ọma maka ndị na-amụta ihe n'aka Jizọs ma na-eso ya, ma na-egosikwa αὐτοῦ dị ka 'ya'.
- source_word: εἰς τὸν γάμον
  choice: ịbịa n'agbamakwụkwọ ahụ
  rationale: γάμος ebe a bụ emume agbamakwụkwọ ahụ. 'Ịbịa n'' na-eme ka echiche nke òkù gaa emume doo anya n'Igbo n'enweghị ịgbakwunye oriri a na-ekwughị kpọmkwem.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo izugbe, nke oge a ma dị ùgwù. A họọrọ usoro okwu dị mfe nghọta nye ndị nkịtị; a hapụghị 'oriri' n'ime agbamakwụkwọ n'ihi na okwu Grik n'amaokwu a ekwughị ya kpọmkwem.
