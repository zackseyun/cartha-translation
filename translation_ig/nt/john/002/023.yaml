  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ὡς δὲ ἦν ἐν τοῖς Ἱεροσολύμοις ἐν τῷ πάσχα ἐν τῇ ἑορτῇ, πολλοὶ ἐπίστευσαν εἰς τὸ ὄνομα αὐτοῦ, θεωροῦντες αὐτοῦ τὰ σημεῖα ἃ ἐποίει·
base_translation:
  language: en
  yaml_path: translation/nt/john/002/023.yaml
  text: When he was in Jerusalem at the Passover[a], during the feast[b], many believed in his name as they were seeing the signs that he was doing.
translation:
  language: ig
  text: Mgbe ọ nọ na Jerusalem n’oge Ememme Ngabiga, mgbe ememme ahụ na-aga, ọtụtụ mmadụ kweere n’aha ya[a] ka ha na-ahụ ihe ịrịba ama[b] ndị ọ nọ na-eme.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “kwere na ya.” N’ụzọ okwu Grik si dị kpọmkwem, ọ bụ “kwere n’aha ya,” okwu Jọn ji egosi ntụkwasị obi e tinyere n’onye Jizọs kpughere onwe ya ịbụ.
    reason: lexical_alternative
  - marker: b
    text: “Ihe ịrịba ama” bụ okwu Jọn na-ejikarị maka ọrụ ndị na-atụ aka n’ihe karịrị onwe ha, ya bụ, n’onye Jizọs bụ. Ụfọdụ nsụgharị na-asụ ya “ihe ịrịba ama ọrụ ebube.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὡς δὲ
  choice: Mgbe
  rationale: Ọ na-ewebata ọnọdụ ọhụrụ ma na-ejigide echiche oge, n’etinyeghị okwu pụtara ‘ugbu a’ nke na-adịghị n’asụsụ Grik.
- source_word: ἦν ἐν τοῖς Ἱεροσολύμοις
  choice: ọ nọ na Jerusalem
  rationale: Nke a bụ ụzọ Igbo nkịtị si akọ na mmadụ nọ n’otu ebe n’oge gara aga.
- source_word: ἐν τῷ πάσχα
  choice: n’oge Ememme Ngabiga
  rationale: ‘Ememme Ngabiga’ na-akọwa πάσχα dị ka ememme ahụ, ebe ‘n’oge’ na-egosi oge ememme ahụ na-aga.
- source_word: ἐν τῇ ἑορτῇ
  choice: n’oge mmemme ahụ
  rationale: A hapụrụ nkebi nke abụọ a ka ọ kọwakwuo na ọ bụ n’oge ememme ahụ, dị ka nkwughachi e ji gbasaa ihe e kwuru n’asụsụ Grik.
- source_word: πολλοὶ
  choice: ọtụtụ mmadụ
  rationale: A gbakwụnyere ‘mmadụ’ maka Igbo doro anya ma bụrụ nke a na-asụkarị; ọ naghị agbakwunye otu ọhụrụ n’ihe ederede.
- source_word: ἐπίστευσαν εἰς τὸ ὄνομα αὐτοῦ
  choice: kwere n’aha ya
  rationale: Nke a na-edobe okwu pụrụ iche Jọn ji, nke na-atụkwasị ntụkwasị obi n’aha ya—ya bụ, n’onye ọ kpughere na ọ bụ—kama ime ka ọ bụrụ naanị ‘kwere na ya.’
- source_word: θεωροῦντες
  choice: ka ha na-ahụ
  rationale: Ọ na-egosi na ịhụ ahụ na-aga n’ihu n’otu oge ahụ ha kwere, na-enweghị ikwubi kpamkpam ma ịhụ ahụ ọ bụ ihe kpatara okwukwe ahụ.
- source_word: τὰ σημεῖα
  choice: ihe ịrịba ama
  rationale: Nke a na-edobe okwu Jọn ji maka ọrụ ndị na-atụ aka n’ihe karịrị ọrụ ahụ n’onwe ya, kama ịgbasa ya ozugbo ka ọ bụrụ naanị ‘ọrụ ebube.’
- source_word: ἃ ἐποίει
  choice: ndị ọ nọ na-eme
  rationale: ‘Ọ nọ na-eme’ na-egosi omume gara aga nke nọ na-aga n’ihu, dịka imperfect ἐποίει si dị.
theological_decisions:
- issue: Ụdị okwukwe e kwuru na ἐπίστευσαν εἰς τὸ ὄνομα αὐτοῦ
  choice: ọtụtụ mmadụ kweere n’aha ya
  alternative: ọtụtụ mmadụ malitere ikwere na ya n’elu elu n’ihi ọrụ ebube ndị ahụ
  rationale: Amaokwu Grik ahụ kwuru hoo haa na ha kweere n’aha ya. A naghị ebelata okwukwe ahụ n’amaokwu a, n’ihi na amaokwu na-esote ga-enye nkọwa na mgbagwoju anya nke ya. Nke a na-edobe esemokwu dị n’akụkọ Jọn kama idozi ya site n’echiche okpukpe.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A hapụrụ nkwughachi ‘n’oge ... n’oge ...’ iji chekwaa nhazi Grik, ma e mere ya ka ọ daa nke ọma n’Igbo. E tinyere akara ala ala peeji [a] n’akụkụ ‘aha ya’ na [b] n’akụkụ ‘ihe ịrịba ama,’ ebe nkọwa nke ọ bụla metụtara kpọmkwem.
