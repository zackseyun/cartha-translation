  source_fidelity: The rendering accurately conveys μήτηρ αὐτοῦ as “Nne ya,” addresses διακόνοις as plural service attendants, and preserves the open-ended imperative force of Ὅ τι ἂν λέγῃ ὑμῖν ποιήσατε. “Ihe ọ bụla ọ gwara unu, meenụ ya” naturally communicates the contingent instruction in Igbo without unnecessarily making Jesus explicit.
