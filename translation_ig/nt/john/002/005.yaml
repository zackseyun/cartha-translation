id: JHN.2.5
reference: John 2:5
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: λέγει ἡ μήτηρ αὐτοῦ τοῖς διακόνοις· ⸂Ὅ τι⸃ ἂν λέγῃ ὑμῖν ποιήσατε.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/005.yaml
  text: His mother said to the servants[a], “Whatever he tells you, do it.”
translation:
  language: ig
  text: Nne ya gwara ndị na-eje ozi[a] sị, “Ihe ọ bụla ọ gwara unu, meenụ ya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị na-enye ihe n’oriri.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μήτηρ αὐτοῦ
  choice: Nne ya
  rationale: Nke a bụ ụzọ Igbo si ekwu njikọ a n'ụzọ doro anya ma dị mfe, na-echekwa njirimara ya dị ka nne Jizọs n'akụkọ ahụ.
- source_word: διακόνοις
  choice: ndị na-eje ozi
  rationale: N'ọnọdụ oriri agbamakwụkwọ a, okwu ahụ na-ezo aka n'ụmụ mmadụ na-elekọta ma na-enye ihe n'oriri ahụ, ọ bụghị n'ọkwa ụka nke dikọn.
- source_word: Ὅ τι ἂν
  choice: Ihe ọ bụla
  rationale: Nkebiokwu a na-egosi ihe ọ bụla nwere ike ịbụ nke a ga-agwa ha, na-enweghị ịkpa ókè; ‘Ihe ọ bụla’ bụ Igbo nkịtị ma ziri ezi.
- source_word: λέγῃ ὑμῖν
  choice: ọ gwara unu
  rationale: N'usoro a, subjunctive ya na ἄν na-enye echiche banyere ihe ọ bụla ọ ga-agwa ha; Igbo ‘ọ gwara unu’ na-arụ ọrụ n'ụzọ eke n'ahịrịokwu a, ebe ntụaka oge ya na-apụta site n'ọnọdụ ahụ.
- source_word: ποιήσατε
  choice: meenụ ya
  rationale: Imperative a bụ iwu e nyere ọtụtụ mmadụ ka ha mee ihe ahụ; ‘meenụ ya’ na-egosipụta ọtụtụ ndị a na-agwa ma na-eweta ihe a na-eme site na ‘ihe ọ bụla’.
theological_decisions:
- issue: Onye bụ isiokwu a na-ekwughị aha ya n'okwu ‘ihe ọ bụla ọ gwara unu’
  choice: E ji ‘ọ’ mee ya, nke na-ezo aka na Jizọs dịka ọnọdụ akụkọ ahụ si gosi.
  alternative: Ihe ọ bụla Jizọs gwara unu, meenụ ya.
  rationale: Grik ekwughị aha Jizọs n'ebe a, ọ bụ ezie na ọnọdụ ahụ na-eme ka onye a na-ekwu maka ya doo anya. Ide ‘ọ’ na-echekwa mkpụmkpụ na usoro isi mmalite ahụ ma zere itinye aha na-adịghị na nkebiokwu Grik.
translation_notes:
  register: 'Ejiri Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. ‘Ndị na-eje ozi’ bụ okwu sara mbara dabara n''ọnọdụ agbamakwụkwọ ahụ; ihe odide ala ala peeji na-akọwa ọrụ ha kpọmkwem. E debere okwu nne ya n''ụdị iwu nye ọtụtụ mmadụ: ‘meenụ.’'
