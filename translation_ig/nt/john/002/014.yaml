id: JHN.2.14
reference: John 2:14
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ εὗρεν ἐν τῷ ἱερῷ τοὺς πωλοῦντας βόας καὶ πρόβατα καὶ περιστερὰς καὶ τοὺς κερματιστὰς καθημένους,
base_translation:
  language: en
  yaml_path: translation/nt/john/002/014.yaml
  text: And he found in the temple those selling oxen and sheep and doves[a], and the money changers sitting there.
translation:
  language: ig
  text: Ọ hụrụ n’ụlọ nsọ[a] ndị na-ere ehi, atụrụ, na nduru, na ndị na-agbanwe ego nọ ọdụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Okwu Grik a sụgharịrị “ụlọ nsọ” bụ ἱερόν. Ọ na-ezo aka n’ogige na mpaghara ụlọ nsọ dum, ọ bụghị kpọmkwem ebe nsọ dị n’ime ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὗρεν
  choice: Ọ hụkwara
  rationale: N’ebe a, εὗρεν pụtara na Jizọs hụrụ ma ọ bụ zutere ihe ndị a mgbe ọ banyere; “hụrụ” bụ okwu Igbo dị mfe ma kwekọọ n’ọnọdụ ahụ.
- source_word: ἱερῷ
  choice: n’ime ụlọ nsọ
  rationale: ἱερόν na-ezo aka n’ogige na mpaghara ụlọ nsọ dum, ọ bụghị naanị ebe nsọ dị n’ime ya; e debere okwu Igbo a na-ahụkarị, ma kọwaa obosara ya n’ala peeji.
- source_word: πωλοῦντας
  choice: ndị na-ere
  rationale: Ọ na-egosi ndị nọ na-arụ ọrụ ire ere n’oge ahụ, ma sụgharịa ya n’ụzọ Igbo dị nkenke ma kwekọọ na participle ahụ.
- source_word: βόας
  choice: ehi
  rationale: βόας na-ezo aka n’anụ ụlọ ukwu nke ụdị ehi; “ehi” bụ okwu Igbo zuru oke ma ghara ịkọwapụta okike anụmanụ karịa ihe Grik kwuru.
- source_word: πρόβατα
  choice: atụrụ
  rationale: N’ọnọdụ anụmanụ àjà a, πρόβατα pụtara atụrụ.
- source_word: περιστερὰς
  choice: nduru
  rationale: περιστερά nwere ike ịpụta dove ma ọ bụ pigeon; “nduru” bụ okwu Igbo a na-ahụkarị nke na-ekpuchi anụ ufe a n’ọnọdụ ahụ.
- source_word: κερματιστὰς
  choice: ndị na-agbanwe ego
  rationale: Ọ na-ezo aka n’ọrụ mgbanwe mkpụrụ ego ma ọ bụ ụdị ego; nkebiokwu a bụ Igbo doro anya ma bụrụ nke a na-aghọta taa.
- source_word: καθημένους
  choice: ka ha nọ ọdụ
  rationale: Ọ na-echekwa ọnọdụ ahụ́ ha na ọnụnọ ha kwụsiri ike n’ebe ahụ.
theological_decisions:
- issue: Oke ihe ἱερόν na-ezo aka n’ụlọ nsọ Jerusalem
  choice: A sụgharịrị ya “ụlọ nsọ” n’ahịrịokwu, ma tinye nkọwa na ọ na-ezo aka n’ogige na mpaghara ụlọ nsọ dum.
  alternative: ogige ụlọ nsọ; mpaghara ụlọ nsọ; ebe nsọ
  rationale: Ebe ndị na-ere anụmanụ na ndị na-agbanwe ego nọ na-egosi na akụkọ a na-ekwu banyere mpaghara ụlọ nsọ sara mbara, ọ bụghị ebe nsọ dị n’ime. Nkọwa ala peeji na-echekwa ọdịiche ahụ n’etinyeghị okwu na-adịghị eke n’ahịrịokwu.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. Ejiri usoro “Ọ hụkwara ... hụkwa ...” mee ka njikọ abụọ nke καί pụta nke ọma n’Igbo, ebe a na-echekwa usoro na nkọwa nke isi Grik.
