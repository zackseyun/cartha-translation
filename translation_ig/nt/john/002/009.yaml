source:
  edition: SBLGNT
  text: ὡς δὲ ἐγεύσατο ὁ ἀρχιτρίκλινος τὸ ὕδωρ οἶνον γεγενημένον, καὶ οὐκ ᾔδει πόθεν ἐστίν, οἱ δὲ διάκονοι ᾔδεισαν οἱ ἠντληκότες τὸ ὕδωρ, φωνεῖ τὸν νυμφίον ὁ ἀρχιτρίκλινος
base_translation:
  language: en
  yaml_path: translation/nt/john/002/009.yaml
  text: When the master of the feast tasted the water that had become wine[a], and did not know where it came from (though the servants who had drawn the water knew)[c][b], the master of the feast calls the bridegroom
translation:
  language: ig
  text: Mgbe onye na-elekọta oriri ahụ[a] detụrụ mmiri ahụ, bụ́ nke ghọworo mmanya[b], ire, ọ maghị ebe mmanya ahụ si bịa—ma ndị na-eje ozi, bú ndị kutere mmiri ahụ, maara—onye na-elekọta oriri ahụ kpọrọ[c] nwoke na-alụ nwaanyị ahụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, ‘onyeisi ndị na-eje ozi n’oriri.’ Okwu Grik a na-ezo aka n’onye na-ahụ maka oriri ahụ.
    reason: lexical_alternative
  - marker: b
    text: 'N’ụzọ okwu Grik si dị: ‘mmiri ahụ nke ghọworo mmanya’; a pụkwara ịsụgharị ya, ‘mmiri ahụ tụgharịrị ghọọ mmanya.’'
    reason: lexical_alternative
  - marker: c
    text: 'Grik ji present akụkọ mee ihe n’ebe a: ‘na-akpọ’; a sụgharịrị ya n’ụdị akụkọ Igbo dị mma, ‘kpọrọ.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀρχιτρίκλινος
  choice: onye na-elekọta oriri ahụ
  rationale: Ọ na-egosi onye na-ahụ maka nhazi na ịga nke ọma nke oriri agbamakwụkwọ ahụ; okwu a doro ndị Igbo nke oge a anya ma ọ naghị eme ka ọrụ ya bụrụ naanị nke onye na-ebunye nri.
- source_word: ἐγεύσατο
  choice: detụrụ ... ire
  rationale: Nke a bụ ụzọ Igbo si ekwu n'ụzọ ebumpụta ụwa na mmadụ nụrụ ụtọ ihe site n’idetụ ya ire.
- source_word: τὸ ὕδωρ οἶνον γεγενημένον
  choice: mmiri ahụ ghọrọ mmanya
  rationale: Ọ na-egosi mgbanwe e mezuru, ya bụ na mmiri ahụ abụrụla mmanya, n’etinyeghị nkọwa ọzọ na-adịghị na Grik.
- source_word: οὐκ ᾔδει πόθεν ἐστίν
  choice: ọ maghị ebe o si bịa
  rationale: Nke a na-egosipụta ajụjụ banyere isi mmanya ahụ si pụta n’Igbo dị mfe ma bụrụkwa nke e ji eme ihe kwa ụbọchị.
- source_word: διάκονοι
  choice: ndị na-eje ozi
  rationale: N’ebe a okwu ahụ pụtara ndị na-arụ ọrụ n’oriri, ọ bụghị aha ọkwa n’ọgbakọ ndị Kraịst.
- source_word: ἠντληκότες
  choice: ndị kutere
  rationale: ‘Ikute mmiri’ bụ okwu Igbo nkịtị maka ịdọpụta ma ọ bụ iwere mmiri n’ebe e debere ya.
- source_word: φωνεῖ
  choice: akpọọ
  rationale: Ụdị a na-aga nke ọma n’akụkọ Igbo ma na-egosi na onye na-elekọta oriri ahụ kpọrọ nwoke ahụ ka ọ bịakwute ya; nkọwa ala peeji na-akọwa present akụkọ nke Grik.
- source_word: νυμφίον
  choice: nwoke na-alụ nwaanyị ahụ
  rationale: Nke a na-akọwa nwoke ahụ na-alụ nwaanyị n’agbamakwụkwọ a n’Igbo a na-aghọta ngwa ngwa, n’agbanyeghị na ‘nwoke ọhụrụ ahụ’ nwekwara ike ịdị mkpirikpi.
- source_word: ὡς δὲ
  choice: Mgbe
  rationale: ‘Mgbe’ na-ewebata ihe mere na-esote n’ụzọ dị mma, na-etinyeghị ‘ugbu a’ nke na-adịghị n’isi okwu Grik.
theological_decisions:
- issue: Nkọwa mgbanwe mmiri ahụ
  choice: mmiri ahụ ghọrọ mmanya
  alternative: mmiri ahụ tụgharịrị ghọọ mmanya
  rationale: Grik kwuru kpọmkwem na mmiri ahụ aghọọla mmanya. Nsụgharị a anaghị ebelata mgbanwe ahụ ka ọ bụrụ naanị otú ihe si yie, ọ naghịkwa atụkwasị nkọwa ozizi ọzọ.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. Akara ogologo ahụ kewapụrụ nkọwa dị n’etiti ahịrịokwu ka isi akụkọ ahụ doo anya. A zere okwu chọọchị maka διάκονοι, ma hapụ nkwupụta banyere mgbanwe mmiri ahụ ka o sie ike dịka isi mmalite Grik si kwuo.
