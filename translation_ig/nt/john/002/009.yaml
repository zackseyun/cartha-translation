revisions:
- from: Mgbe onye na-elekọta oriri ahụ[a] detụrụ mmiri ahụ ghọrọ mmanya[b] ire, ọ maghị ebe o si bịa—ma ndị na-eje ozi bú ndị kutere mmiri ahụ maara—onye na-elekọta oriri ahụ akpọọ[c] nwoke na-alụ nwaanyị ahụ.
  to: Mgbe onye na-elekọta oriri ahụ[a] detụrụ mmiri ahụ, bụ́ nke ghọworo mmanya[b], ire, ọ maghị ebe mmanya ahụ si bịa—ma ndị na-eje ozi, bú ndị kutere mmiri ahụ, maara—onye na-elekọta oriri ahụ kpọrọ[c] nwoke na-alụ nwaanyị ahụ.
  rationale: The revision resolves the ambiguous attachment of “ghọrọ mmanya” by expressing the Greek perfect participle with a clear Igbo relative clause (“bụ́ nke ghọworo mmanya”). It also uses the ordinary independent past narrative form “kpọrọ,” while preserving the source-language historical-present information in the anchored footnote. No theological interpretation has been added or removed.
