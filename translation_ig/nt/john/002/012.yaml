review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the movement to Capernaum, the accompanying persons, and the plural subject of the final verb. However, “ụbọchị ole na ole” (‘a few days’) is somewhat more definite/stronger than the Greek litotes οὐ πολλὰς ἡμέρας, ‘not many days.’
  naturalness: The wording is clear, idiomatic Standard Igbo, and the grouped apposition marked by dashes is readable. “Ọ bụghị ọtụtụ ụbọchị” is also natural and more closely retains the source’s restrained expression.
  terminology: “Kapanọm,” “nne ya,” “ụmụnne ya ndị nwoke,” and “ndị na-eso ụzọ ya” are suitable. The footnote appropriately preserves the possible wider-kinship sense of ἀδελφοί without deciding a theological question.
  issues:
  - severity: low
    issue: The duration is rendered more positively than the Greek wording.
    rationale: οὐ πολλὰς ἡμέρας literally and idiomatically means ‘not many days.’ “Ụbọchị ole na ole” can imply a specifically small number of days, whereas the Greek only states that the stay was not lengthy.
