  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Μετὰ τοῦτο κατέβη εἰς Καφαρναοὺμ αὐτὸς καὶ ἡ μήτηρ αὐτοῦ καὶ οἱ ⸀ἀδελφοὶ καὶ οἱ μαθηταὶ αὐτοῦ, καὶ ἐκεῖ ἔμειναν οὐ πολλὰς ἡμέρας.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/012.yaml
  text: After this he went down to Capernaum[a], he and his mother and his brothers and his disciples, and they stayed there not many days.
translation:
  language: ig
  text: Mgbe nke a gasịrị, ọ gbadara Kapanọm—ya na nne ya, ụmụnne ya ndị nwoke[a], na ndị na-eso ụzọ ya—ha wee nọrọ n'ebe ahụ ụbọchị anaghị ọtụtụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị ikwu ya”; okwu Grik ahụ nwere ike ịpụta ụmụnne ndị nwoke kpọmkwem, ma n'ọnọdụ ụfọdụ ọ pụkwara ịpụta ndị ikwu n'ezinụlọ sara mbara.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ τοῦτο
  choice: Mgbe nke a gasịrị
  rationale: Ọ bụ ụzọ Igbo dị ndụ ma doo anya isi gosi mgbanwe oge ahụ, ma na-echekwa echiche nke ‘mgbe nke a gasịrị.’
- source_word: κατέβη
  choice: ọ gbadara
  rationale: Na-echekwa ntụgharị ije gbadata nke ngwaa Grik, nke dabara na njem site na Kena ruo Kapanọm.
- source_word: εἰς Καφαρναοὺμ
  choice: Kapanọm
  rationale: A sụgharịghị aha obodo ahụ; e dere ya n'ụdị dabara n'usoro mkpọpụta na odide Igbo.
- source_word: ἡ μήτηρ αὐτοῦ
  choice: nne ya
  rationale: Na-agbasochi okwu Grik nke na-ekwughị aha Meri.
- source_word: οἱ ἀδελφοὶ
  choice: ụmụnne ya ndị nwoke
  rationale: Na-egosi ụdị ọtụtụ nke nwoke n'okwu Grik ma na-ahapụ ohere nke njikọ ezinụlọ sara mbara n'okpuru peeji.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: ndị na-eso ụzọ ya
  rationale: Nke a bụ okwu Igbo a na-aghọta nke ọma maka μαθηταί, ma na-egosi ma iso onye ahụ ma ịmụ ihe n'aka ya.
- source_word: ἐκεῖ ἔμειναν
  choice: ha wee nọrọ n'ebe ahụ
  rationale: Ụdị ọtụtụ ahụ na-egosi na Jizọs na ndị so ya niile nọrọ ebe ahụ.
- source_word: οὐ πολλὰς ἡμέρας
  choice: ụbọchị ole na ole
  rationale: Ọ bụ ntụgharị Igbo kachasị eke nke na-egosi na oge ahụ adịghị ogologo, n'agbanyeghị na Grik kwuru ya n'ụzọ nkịtị dị ka ‘ọ bụghị ọtụtụ ụbọchị.’
theological_decisions:
- issue: Ihe οἱ ἀδελφοὶ pụtara n'ihe gbasara ezinụlọ Jizọs
  choice: ụmụnne ya ndị nwoke
  alternative: ndị ikwu ya / ụmụnne ya n'ezinụlọ sara mbara
  rationale: Isi ihe okwu Grik pụtara ebe a bụ ụmụnne ndị nwoke, ma okwu ahụ nwekwara ike, n'ọnọdụ ụfọdụ, ịgụnye ndị ikwu n'ụzọ sara mbara. Ya mere, isi ederede anaghị edozi esemokwu nkà mmụta okpukpe ahụ, ebe nkọwa ala peeji na-echekwa ohere ọzọ.
translation_notes:
  register: Igbo Izugbe dị ugbu a, dị ugwu ma dị mfe nghọta. E ji ‘ụmụnne ya ndị nwoke’ zere mgbagwoju anya nke ‘ụmụnne’ naanị ya, ebe nkọwa [a] na-echekwa nghọta sara mbara okwu Grik ahụ nwere ike inwe.
