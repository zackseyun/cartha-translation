id: JHN.4.11
reference: John 4:11
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: λέγει αὐτῷ ⸂ἡ γυνή⸃· Κύριε, οὔτε ἄντλημα ἔχεις καὶ τὸ φρέαρ ἐστὶν βαθύ· πόθεν οὖν ἔχεις τὸ ὕδωρ τὸ ζῶν;
base_translation:
  language: en
  yaml_path: translation/nt/john/004/011.yaml
  text: The woman said to him[a], “Lord, you have neither a bucket nor is the well deep[b]. So where do you get the living water?”
translation:
  language: ig
  text: Nwanyị ahụ sịrị ya, “Onyenwe m,[a] i nweghị ngwá e ji adọpụta mmiri, olulu mmiri ahụ dịkwa omimi. Oleezi ebe i si nweta mmiri dị ndụ?[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “Nna m.” Okwu Grik bụ κύριε bụ ụzọ nkwanye ùgwù e ji akpọ mmadụ; n’ebe a, ọ pụrụ ịdị ka oku nkwanye ùgwù karịa nkwupụta zuru ezu banyere onye Jizọs bụ.
    reason: alternative_reading
  - marker: b
    text: A pụkwara ịsị, “mmiri na-asọ,” ya bụ, mmiri ọhụrụ na-asọ asọ, ọ bụghị mmiri kwụsịrị otu ebe. “Mmiri dị ndụ” na-echekwakwa nghọta ọzọ dị n’okwu Jizọs.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει αὐτῷ
  choice: sịrị ya
  rationale: Ọ bụ ezie na Grik ji ngwaa oge ugbu a n’akụkọ a, oge gara aga bụ ụzọ Igbo si akọ akụkọ n’ụzọ na-aga were were.
- source_word: ἡ γυνή
  choice: Nwanyị ahụ
  rationale: N’ebe a, okwu ahụ na-ezo aka n’ebe nwanyị Sameria ahụ nọ, ọ bụghị nwunye.
- source_word: Κύριε
  choice: Onyenwe anyị
  rationale: Nke a na-edobe nsụgharị bụ́ ‘Onyenwe anyị,’ ma ihe e ji asọpụrụ mmadụ dị ka ‘Nna m’ ka akọwara n’ala ala peeji.
- source_word: ἄντλημα
  choice: ihe e ji ekute mmiri
  rationale: Okwu Grik a pụtara ngwá e ji adọpụta mmiri. Nkebiokwu Igbo a doro anya ma ghara ịmanye na ọ bụ naanị bọket.
- source_word: τὸ φρέαρ
  choice: olulu mmiri a
  rationale: N’ọnọdụ a, φρέαρ bụ olulu e si adọpụta mmiri; ‘a’ na-eme ka ntụaka ahụ gaa n’olulu mmiri ha nọ n’akụkụ ya.
- source_word: βαθύ
  choice: dị omimi
  rationale: Nke a na-egosipụta ịdị omimi olulu ahụ n’enweghị itinye ‘nke ukwuu,’ nke na-adịghị n’isiokwu Grik.
- source_word: πόθεν οὖν
  choice: Oleezi ebe i si
  rationale: ‘Olee ebe ... si’ na-ajụ isi mmalite, ebe ‘zi’ na-egosi nkwubi okwu sitere n’ihe nwanyị ahụ kwuru tupu ya.
- source_word: τὸ ὕδωρ τὸ ζῶν
  choice: mmiri dị ndụ
  rationale: Nsụgharị a na-edobe ma okwu nkịtị nke nwere ike ịpụta mmiri na-asọ ma nghọta ime mmụọ dị omimi n’akụkọ Jọn.
theological_decisions:
- issue: Otu e si sụgharị Κύριε n’okwu nwanyị Sameria gwara Jizọs
  choice: Onyenwe anyị
  alternative: Nna m
  rationale: ‘Onyenwe anyị’ na-edobe aha ahụ n’ụzọ kwekọrọ ekwekọ, ma ebe mkparịta ụka a ka malitere, okwu Grik ahụ nwekwara ike ịbụ naanị ụzọ nkwanye ùgwù; ya mere, e debere nke ahụ n’ala ala peeji ka a ghara ikwu na nwanyị ahụ aghọtaworị onye Jizọs bụ n’uju.
- issue: Otu e si chekwaa nghọta abụọ dị na ὕδωρ τὸ ζῶν
  choice: mmiri dị ndụ
  alternative: mmiri na-asọ
  rationale: Okwu ahụ nwere ike ịpụta mmiri ọhụrụ na-asọ n’okwu nkịtị, ma n’akụkọ Jọn ọ nwekwara nghọta ime mmụọ. Isi nsụgharị ahụ na-edobe esemokwu a, ebe ala ala peeji na-akọwa nghọta nkịtị.
translation_notes:
  register: 'E ji Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta. ‘Ihe e ji ekute mmiri’ ka ahọrọ karịa okwu mbite ‘bọket’ iji gosi ọrụ ngwá ahụ n’ụzọ sara mbara ma kwekọọ n’isiokwu Grik. E mezighị ahịrịokwu ahụ ka ọ sị na olulu ahụ adịghị omimi: Grik kwuru na onye ahụ enweghị ihe e ji ekute mmiri nakwa na olulu ahụ dị omimi.'
