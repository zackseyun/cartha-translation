  verdict: revise
  source_fidelity: The draft correctly renders ἐξῆλθον ἐκ τῆς πόλεως as “Ha si n’obodo ahụ pụta” and preserves the ongoing force of imperfect ἤρχοντο with “na-abịakwute ya.” It also appropriately leaves the referent as “ya,” as does the Greek.
  naturalness: The sentence is natural Standard Igbo once the unintended additive particle -kwa is removed. The comma-linked construction suitably conveys that, after leaving the city, they were in the process of coming to him.
  terminology: “Obodo ahụ” is appropriately broad for πόλις, and “ịbịakwute ya” naturally expresses πρὸς αὐτόν. No theological terminology is involved.
  issues:
  - severity: medium
    issue: The main text has “na-abịakwutekwa.”
    rationale: The suffix -kwa means “also/too,” but Greek ἤρχοντο contains no additive element. It should be “na-abịakwute.”
  - severity: medium
    issue: The footnote has “nọkwa n’ụzọ.”
    rationale: Here too -kwa adds “also/too,” which is absent from the source and English audit alternative. It should be “nọ n’ụzọ.”
