  text: ἐξῆλθον ἐκ τῆς πόλεως καὶ ἤρχοντο πρὸς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/030.yaml
  text: They went out of the city and were coming to him[a].
translation:
  language: ig
  text: Ha si n’obodo ahụ pụta, na-abịakwute ya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Ha si n’obodo ahụ pụta, nọ n’ụzọ na-abịakwute ya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθον
  choice: Ha si ... pụta
  rationale: Aorist nke ἐξέρχομαι na-egosi na ha hapụrụ ebe ahụ a kọwara ókè ya; usoro ‘si ... pụta’ bụ Igbo nkịtị nke na-echekwa echiche nke isi n’ime ebe pụta.
- source_word: ἐκ
  choice: si n’
  rationale: ἐκ na-egosi mmegharị site n’ime obodo ahụ ruo n’èzí; ‘si n’... pụta’ na-enye echiche a n’ụzọ doro anya n’Igbo.
- source_word: τῆς πόλεως
  choice: obodo ahụ
  rationale: πόλις nwere ike ịbụ obodo ukwu ma ọ bụ obodo nta; ‘obodo’ bụ okwu Igbo sara mbara nke na-adịghị amanye nha obodo ahụ, ebe ‘ahụ’ na-anọchi akara nkọwa Grik.
- source_word: ἤρχοντο
  choice: na-abịakwutekwa
  rationale: Imperfect nke ἔρχομαι na-egosi omume gara n’ihu n’oge gara aga. N’usoro akụkọ Igbo, ‘na-abịakwutekwa’ na-egosi na ha nọ n’ụzọ na-abịakwute ya, ọ bụghị nanị na ha eruola.
- source_word: πρὸς αὐτόν
  choice: ya
  rationale: N'ime ngwaa ‘ịbịakwute,’ echiche πρός nke ịgakwuru mmadụ dị n'ime ‘-kwute’; ‘ya’ na-anọchi αὐτόν n’enweghị ịgbakwunye aha Jizọs nke isi mmalite ekwughị kpọmkwem n’amaokwu a.
theological_decisions: []
translation_notes:
  register: Ejiri Standard Igbo nke dị ugbu a, dị ùgwù ma dị mfe nghọta. ‘Obodo’ na-echekwa obosara nke πόλις, ebe usoro ‘na-abịakwute’ na-echekwa omume na-aga n’ihu nke imperfect Grik. Akara nkọwa [a] dị n’ederede isi.
