review_pass:
  verdict: revise
  source_fidelity: 'The principal rendering is faithful: γυναί is appropriately “Nwanyị ahụ,” and ἀνήρ is correctly rendered “di” in light of the immediate marital context (especially v. 18). “Jizọs sịrị ya” naturally renders the Greek historical present in an Igbo past-tense narrative. The wording for Καλῶς εἶπας should retain the commendation/confirmation without introducing an unnecessary temporal relation.'
  naturalness: “Nwanyị ahụ zara ya, sị” and “Enweghị m di” are natural Standard Igbo. Replacing “mgbe ị sịrị” with a direct content construction is more idiomatic for Jesus’ quotation of her statement and avoids making the Greek ὅτι temporal (“when”).
  terminology: '“Di” is the appropriate contextual term for ἀνήρ. “Jizọs” is standard. The existing note [a] is not valid as written: it labels the identical Igbo wording as a more literal alternative and is anchored after “sị,” although the stated alternative concerns the following reply. It should be removed. The note on ἀνήρ may remain, anchored to “di.”'
  issues:
  - severity: medium
    issue: Footnote [a] gives no actual alternative and has an unsuitable anchor.
    rationale: Its proposed ‘more literal’ wording, “Enweghị m di,” is identical to the main text. It therefore does not supply useful lexical or translation information; its location after “sị” also does not correspond to the phrase discussed.
  - severity: low
    issue: “mgbe ị sịrị” renders the content clause ὅτι as a temporal clause.
    rationale: Here ὅτι introduces what the woman said, not the time at which she said it. A direct quotation introduced with “sị:” preserves the relation more closely and reads naturally in Igbo.
  revised_text: 'Nwanyị ahụ zara ya, sị, “Enweghị m di.” Jizọs sịrị ya[b], “I kwuru eziokwu, sị: ‘Enweghị m di.’”'
