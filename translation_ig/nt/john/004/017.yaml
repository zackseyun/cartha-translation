base_translation:
  language: en
  yaml_path: translation/nt/john/004/017.yaml
  text: 'The woman answered and said to him[a], “I do not have a husband.” Jesus said to her[b], “You have spoken well: ‘I do not have a husband.’”'
translation:
  language: ig
  text: 'Nwanyị ahụ zara ya, sị, “Enweghị m di.” Jizọs sịrị ya[b], “I kwuru eziokwu, sị: ‘Enweghị m di.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Okwu Grik ἀνήρ nwere ike ịpụta “nwoke” ma ọ bụ “di”; n’ebe a, ọnọdụ okwu ahụ na-egosi “di.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη ἡ γυνὴ καὶ εἶπεν αὐτῷ
  choice: Nwanyị ahụ zara ya sị
  rationale: Nke a na-egosipụta usoro okwu Grik ahụ n’Igbo dị ire ma bụrụkwa nke a na-aghọta ngwa ngwa; ‘zara ... sị’ na-eburu ma ἀπεκρίθη ma καὶ εἶπεν.
- source_word: Οὐκ ἔχω ἄνδρα
  choice: Enweghị m di
  rationale: N’ebe a, ἀνήρ pụtara di n’ihi na amaokwu na-esote na-ekwu kpọmkwem banyere alụmdi na nwunye ya. ‘Enweghị m di’ bụ ụzọ Igbo dị mfe ma bụrụkwa nke okike.
- source_word: λέγει αὐτῇ ὁ Ἰησοῦς
  choice: Jizọs sịrị ya
  rationale: Ọ bụ ezie na Grik ji historical present, oge gara aga bụ ụzọ akụkọ Igbo si aga nke ọma n’ebe a.
- source_word: Καλῶς εἶπας
  choice: I kwuru eziokwu
  rationale: N’okwu a, καλῶς na-akwado na ihe nwanyị ahụ kwuru ziri ezi ma bụrụ eziokwu. Nke a na-ada nke ọma n’Igbo karịa nsụgharị mkpụrụokwu dịka ‘i kwuru nke ọma,’ nke nwere ike ịdị ka otuto maka etu o si kwuo ya.
- source_word: ὅτι Ἄνδρα οὐκ ἔχω
  choice: mgbe ị sịrị, ‘Enweghị m di’
  rationale: ὅτι na-ewebata ọdịnaya nke okwu nwanyị ahụ; ‘mgbe ị sịrị’ na-ejikọta nkwupụta Jizọs na nkwughachi okwu ahụ n’Igbo doro anya.
theological_decisions:
- issue: Ihe ἀνήρ pụtara n’okwu nwanyị ahụ
  choice: di
  alternative: nwoke
  rationale: Ọnọdụ okwu ahụ, ọkachasị amaokwu 18, na-egosi na a na-ekwu banyere ọnọdụ alụmdi na nwunye ya. ‘Di’ na-enye nghọta ahụ n’enweghị itinye nkọwa okpukpe ọzọ.
translation_notes:
  register: E jiri Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. ‘Zara ya sị’ bụ usoro akụkọ nkịtị; ‘I kwuru eziokwu’ na-egosipụta ebumnuche Καλῶς εἶπας n’enweghị ịgbanwe ya ka ọ bụrụ naanị otuto maka ụzọ e si kwuo okwu. Akara nkọwa [a] na [b] dị n’ederede bụ isi.
