id: JHN.4.45
reference: John 4:45
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὅτε οὖν ἦλθεν εἰς τὴν Γαλιλαίαν, ἐδέξαντο αὐτὸν οἱ Γαλιλαῖοι, πάντα ἑωρακότες ⸀ὅσα ἐποίησεν ἐν Ἱεροσολύμοις ἐν τῇ ἑορτῇ, καὶ αὐτοὶ γὰρ ἦλθον εἰς τὴν ἑορτήν.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/045.yaml
  text: So when he came into Galilee[a], the Galileans welcomed him, having seen all that he had done in Jerusalem at the feast[b], for they too had gone to the feast.
translation:
  language: ig
  text: Ya mere, mgbe ọ batara na Galili, ndị Galili nabatara ya[a], n’ihi na ha ahụla ihe niile o mere na Jerusalem n’oge emume ahụ[b], n’ihi na ha onwe ha gakwara emume ahụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Enwere ike ịsụgharị ya, “natara ya.” Okwu Grik a nwere ike ịpụta ịnara mmadụ ma ọ bụ ịnabata ya; n’ebe a, ọnọdụ akụkọ ahụ na-egosi nnabata ọma.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “mmemme ahụ.” Okwu Grik ἑορτή na-ekwu maka emume okpukpe; n’ọnọdụ akụkọ Jọn ebe a, o yikarịrị ka ọ na-ekwu banyere emume a na-aga Jerusalem.
    reason: cultural_note
lexical_decisions:
- source_word: ὅτε οὖν
  choice: Ya mere, mgbe
  rationale: Nke a na-egosi njikọ na ihe gara aga na ọganihu akụkọ ahụ, n’Igbo na-ada nke ọma.
- source_word: ἦλθεν εἰς τὴν Γαλιλαίαν
  choice: ọ batara na Galili
  rationale: “Batara na” na-echekwa echiche nke ịbanye n’ime mpaghara ahụ.
- source_word: ἐδέξαντο αὐτὸν
  choice: nabatara ya nke ọma
  rationale: δέχομαι nwere ike ịbụ ịnara ma ọ bụ ịnabata; ebe a, ọnọdụ akụkọ ahụ na-egosi nnabata ọma.
- source_word: οἱ Γαλιλαῖοι
  choice: ndị Galili
  rationale: Nke a bụ aha ndị bi na mpaghara Galili n’ụzọ dị mfe ma doo anya.
- source_word: πάντα ἑωρακότες ὅσα
  choice: ebe ha hụrụla ihe niile
  rationale: “Hụrụla” na-egosi na ịhụ ahụ mere tupu nnabata ahụ ma ka na-emetụta ya; “ebe” na-edobe njikọ ahụ n’enweghị ime ka ihe kpatara ya sie ike karịa Grik.
- source_word: ἐποίησεν
  choice: o mere
  rationale: Oge ihe omume pụtara ìhè site na “hụrụla,” ya mere ụdị a bụ Igbo nkịtị ma doo anya.
- source_word: ἐν Ἱεροσολύμοις
  choice: na Jerusalem
  rationale: Nsụgharị kwụ ọtọ nke ebe ihe ahụ mere.
- source_word: ἐν τῇ ἑορτῇ
  choice: n’oge Emume ahụ
  rationale: ἑορτή bụ emume okpukpe; “n’oge” na-egosi oge ihe ndị ahụ mere.
- source_word: καὶ αὐτοὶ γὰρ
  choice: n’ihi na ha onwe ha
  rationale: Nke a na-echekwa nkọwa γάρ na nkwusi ike/insonye nke αὐτοὶ.
- source_word: ἦλθον εἰς τὴν ἑορτήν
  choice: gakwara Emume ahụ
  rationale: “Gakwara” na-egosi na ha sokwa gaa emume ahụ tupu nke a, n’ụzọ Igbo na-ada eke.
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ “Emume” iji gosi mmemme okpukpe, a hapụkwara aha Jerusalem na Galili n’ụdị ndị Igbo maara. Akara nkọwa ala [a] na [b] dị n’ahịrịokwu ahụ.
