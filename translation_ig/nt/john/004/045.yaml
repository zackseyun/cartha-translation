- from: Ya mere, mgbe ọ batara na Galili, ndị Galili nabatara ya nke ọma[a], ebe ha hụrụla ihe niile o mere na Jerusalem n’oge Emume ahụ[b], n’ihi na ha onwe ha gakwara Emume ahụ.
  to: Ya mere, mgbe ọ batara na Galili, ndị Galili nabatara ya[a], n’ihi na ha ahụla ihe niile o mere na Jerusalem n’oge emume ahụ[b], n’ihi na ha onwe ha gakwara emume ahụ.
  rationale: The revision removes a mild intensification from the reception verb, makes the participial explanation explicit and natural in Igbo, regularizes the common noun “emume,” and rewrites both notes for idiomatic Standard Igbo while retaining their audit-trail functions and anchors.
