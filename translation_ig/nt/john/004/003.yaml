  yaml_path: translation/nt/john/004/003.yaml
  text: he left Judea and went back to Galilee[a].
translation:
  language: ig
  text: Ọ hapụrụ Judia wee laghachi Galili[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “gaa Galili ọzọ.” Okwu Grik πάλιν nwere ike ịpụta “ọzọ,” ma n’ebe a ọ yikarịrị ka ọ na-egosi ịlaghachi; ya mere e ji sụgharịa ya “laghachi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφῆκεν
  choice: ọ hapụrụ
  rationale: N’ebe a, ἀφίημι pụtara ịhapụ otu ebe. “Ọ hapụrụ” bụ okwu Igbo doro anya ma kwekọọ na ihe a na-ekwu banyere Judia.
- source_word: τὴν Ἰουδαίαν
  choice: Judia
  rationale: “Judia” bụ aha mpaghara ahụ n’ụdị Igbo a na-ejikarị eme ihe n’akụkọ Oziọma.
- source_word: ἀπῆλθεν
  choice: laghachikwa
  rationale: Ngwakọta ngwaa “laghachi” na “-kwa” na-egosi ma njem ahụ gaa ebe ahụ ma njikọ καί; ọ na-ada nke ọma n’Igbo karịa nsụgharị siri ike dịka “wee pụọ gaa.”
- source_word: πάλιν
  choice: laghachi
  rationale: N’ọnọdụ njem a, πάλιν nwere ike igosi nlọghachi, ya mere e tinyere echiche ya n’okwu “laghachi.”
- source_word: εἰς τὴν Γαλιλαίαν
  choice: Galili
  rationale: Mgbe e jiri “laghachi” mee ihe n’Igbo, ebe a na-aga nwere ike iso ya ozugbo n’enweghị “na,” ya mere “laghachi Galili” bụ okwu ebumpụta ụwa.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị nkenke ma dị ugwu. E debere isiokwu “ọ” dịka ọ dị na amaokwu bu ụzọ, ma jiri “laghachikwa” mee ka ahịrịokwu ahụ bụrụ nke ndị Igbo nke oge a ga-aghọta ngwa ngwa.
