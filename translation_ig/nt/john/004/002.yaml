  text: καίτοιγε Ἰησοῦς αὐτὸς οὐκ ἐβάπτιζεν ἀλλ’ οἱ μαθηταὶ αὐτοῦ—
base_translation:
  language: en
  yaml_path: translation/nt/john/004/002.yaml
  text: although Jesus himself was not baptizing[a], but his disciples were—
translation:
  language: ig
  text: ọ bụ ezie na Jizọs n’onwe ya anaghị eme baptizim[a], kama ọ bụ ndị na-eso ụzọ ya na-eme baptizim—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ịsụgharị ya: “Jizọs n’onwe ya emeghị baptizim, kama ndị na-eso ụzọ ya mere baptizim.” Ngwaa Grik ahụ dị n’ụdị imperfect, nke nwere ike igosi omume na-aga n’ihu ma ọ bụ nke a na-emekarị.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καίτοιγε
  choice: ọ bụ ezie na
  rationale: Nkebi okwu a na-ewebata nkọwa na-egosi ihe dị iche n’ihe e kwuru n’amaokwu gara aga; “ọ bụ ezie na” bụ ụzọ Igbo doro anya ma dịkwa eke isi gosipụta nke a.
- source_word: Ἰησοῦς
  choice: Jizọs
  rationale: Nke a bụ odide aha ahụ a na-ejikarị eme ihe n’Igbo.
- source_word: αὐτὸς
  choice: n’onwe ya
  rationale: Ọ na-emesi ike na ọ bụghị Jizọs n’onwe ya ji aka ya na-eme baptizim.
- source_word: οὐκ ἐβάπτιζεν
  choice: anọghị na-eme baptizim
  rationale: Ngwaa Grik dị n’ụdị imperfect; nsụgharị a na-egosi omume na-aga n’ihu ma ọ bụ nke a na-emekarị, n’asụsụ Igbo dị ugbu a.
- source_word: ἀλλ’
  choice: kama
  rationale: Ọ na-egosi ọdịiche doro anya n’etiti Jizọs na ndị na-eso ụzọ ya.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: ọ bụ ndị na-eso ụzọ ya na-eme ya
  rationale: Ọ bụ ezie na Grik ekwughachighị ngwaa ahụ, Igbo chọrọ ka e tinye echiche ngwaa ahụ iji mee ka ihe a na-ekwu doo anya; “ya” na-anọchi anya ime baptizim.
theological_decisions:
- issue: Onye ji aka ya na-eme baptizim n’ozi Jizọs
  choice: Jizọs n’onwe ya anọghị na-eme baptizim; ndị na-eso ụzọ ya bụ ndị na-eme ya.
  alternative: “Jizọs n’onwe ya emeghị baptizim, kama ndị na-eso ụzọ ya mere ya.”
  rationale: Nhọrọ e mere na-edobe nkwusi ike dị na αὐτός ma na-anwa ichekwa ọdịdị imperfect nke ἐβάπτιζεν, n’etinyeghị nkọwa ozizi karịrị ihe ederede kwuru.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta, dee ya. A hapụrụ akara ogologo ahịrị n’ikpeazụ n’ihi na amaokwu a bụ nkọwa etiti ahịrịokwu nke malitere n’amaokwu gara aga ma na-aga n’ihu n’amaokwu na-esote.
