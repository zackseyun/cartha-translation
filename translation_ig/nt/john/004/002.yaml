    reason: lexical_alternative
  revision_rationale: E dochiela «anọghị na-eme» anya n’«anaghị eme» iji zere echiche na Jizọs anọghị n’ebe ahụ, ma chekwaa nkọwa omume a na-emekarị/na-aga n’ihu nke imperfect nwere ike inye. E kwughachila «na-eme baptizim» n’akụkụ nke abụọ maka nghọta doro anya. Akara ntụaka na ogologo ahịrị n’ikpeazụ ka edobere.
