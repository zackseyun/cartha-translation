  variant: Standard Igbo
source:
  edition: SBLGNT
  text: λέγει οὖν αὐτῷ ἡ γυνὴ ἡ Σαμαρῖτις· Πῶς σὺ Ἰουδαῖος ὢν παρ’ ἐμοῦ πεῖν αἰτεῖς ⸂γυναικὸς Σαμαρίτιδος οὔσης⸃; οὐ γὰρ συγχρῶνται Ἰουδαῖοι Σαμαρίταις.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/009.yaml
  text: So the Samaritan woman said to him[a], “How is it that you, being a Jew, ask for a drink from me, a Samaritan woman?” (For Jews do not associate with Samaritans.)
translation:
  language: ig
  text: Ya mere, nwanyị Sameria ahụ sịrị ya, “Olee otú i si, ebe ị bụ onye Juu, arịọ m, nwanyị Sameria, ka ị ṅụọ?” (N’ihi na ndị Juu anaghị emekọrịta ihe na ndị Sameria.[a])
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “N’ihi na ndị Juu enweghị mmekọrịta na ndị Sameria.” O nwekwara ike ịpụta kpọmkwem na ha anaghị eji ihe ọnụ, dịka arịa e ji aṅụ mmiri.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει οὖν
  choice: Ya mere ... sịrị
  rationale: ‘Ya mere’ na-echekwa ike njikọ na-aga n’ihu n’akụkọ ahụ, ebe ‘sịrị’ bụ ụzọ Igbo dị mfe ma kwekọọ n’okwu Grik.
- source_word: ἡ γυνὴ ἡ Σαμαρῖτις
  choice: nwanyị Sameria ahụ
  rationale: Nke a na-egosi ma na ọ bụ nwanyị ma na ọ bụ onye Sameria, ebe ‘ahụ’ na-egosipụta isiokwu Grik ndị ahụ ugboro abụọ ji kọwaa onye a maara ama.
- source_word: Πῶς
  choice: Olee otú ... si
  rationale: Usoro a bụ Igbo nkịtị nke na-egosipụta ihe ijuanya nwanyị ahụ nwere banyere arịrịọ ahụ, n’ebughị ụzọ gbanwee ya ka ọ bụrụ naanị ‘Gịnị mere?’
- source_word: Ἰουδαῖος ὢν
  choice: gị onwe gị, onye Juu
  rationale: ‘Onye Juu’ na-egosipụta njirimara obodo na okpukpe nke a na-atụnyere ndị Sameria; ‘gị onwe gị’ na-enye ntụkwasị uche dị na σὺ ma hapụ kpọmkwem mmekọrịta participle ahụ ka ọ ghara ịkọwa ya karịa ihe e dere.
- source_word: παρ’ ἐμοῦ πεῖν αἰτεῖς
  choice: si arịọ mụ onwe m ... ka m nye gị mmiri ka ị ṅụọ
  rationale: Nke a bụ okwu Igbo doro anya maka ịrịọ mmadụ ihe ọṅụṅụ. ‘Mụ onwe m’ na-echekwa ntụkwasị uche nke παρ’ ἐμοῦ, ebe ‘mmiri’ sitere n’ọnọdụ mkparịta ụka banyere mmiri n’olulu ahụ.
- source_word: γυναικὸς Σαμαρίτιδος οὔσης
  choice: mụ onwe m, nwanyị Sameria
  rationale: Ntinye nkọwa a na-echekwa otú nwanyị ahụ si kọwaa onwe ya na ihe mere arịrịọ ahụ ji ju ya anya, n’enweghị ịmanye participle ahụ ka ọ bụrụ ‘n’ihi na.’
- source_word: συγχρῶνται
  choice: na-emekọrịta ihe
  rationale: Nke a na-egosipụta mmekọrịta ọha mmadụ n’ozuzu ya. Ebe okwu Grik ahụ nwekwara ike ịpụta iji ma ọ bụ ịkekọrịta ihe ọnụ, e debere ohere ahụ n’okpuru peeji.
theological_decisions:
- issue: Ihe Ἰουδαῖος pụtara n’ebe a
  choice: onye Juu
  alternative: onye Judia
  rationale: Ebe a, ntụnyere ahụ bụ n’etiti ndị Juu na ndị Sameria dị ka obodo nwere njirimara okpukpe na omenala, ọ bụghị naanị ndị bi na mpaghara Judia na Sameria.
- issue: Ogologo ihe συγχρῶνται na-ekpuchi
  choice: mmekọrịta ọha mmadụ n’ozuzu ya
  alternative: ịkekọrịta ma ọ bụ iji otu ihe ọnụ, dịka iko ma ọ bụ arịa e ji aṅụ mmiri
  rationale: Nkebi nkọwa ahụ nwere ike ikwu banyere nkewa dị n’etiti obodo abụọ ahụ n’ozuzu ya; ma ebe ihe a na-ekwu ugbu a bụ ịṅụ mmiri, echiche pụrụ iche banyere iji otu arịa ọnụ ka ga-ekwe omume. Ihe odide ala peeji na-echekwa nghọta abụọ ahụ.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị nsọ ma dị mfe nghọta. A hapụrụ ihe ijuanya dị n’ajụjụ nwanyị ahụ, tinyekwa nkọwa onye odee n’akara mkpọchi. E tinyere akara [a] n’isiokwu ebe ọ metụtara okwu συγχρῶνται.
