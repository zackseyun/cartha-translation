translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe nghọta ma nwee ugwu. “Ka ọ dị ugbu a” na “nọ na-arịọsi ya ike” na-eme ka ahịrịokwu ahụ bụrụ nke sitere n’okike n’Igbo, ebe ntụaka ala peeji na-echekwa nhọrọ okwu ndị ọzọ na nkọwa omenala.
