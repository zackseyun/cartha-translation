  yaml_path: translation/nt/john/004/031.yaml
  text: Meanwhile, the disciples were urging him, saying, “Rabbi, eat.”
translation:
  language: ig
  text: Ka oge ahụ na-aga[a], ndị na-eso ụzọ ya nọ na-arịọsi ya ike[b], sị, “Rabaị[c], rie nri.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “N’oge dị n’etiti ahụ.”
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ngwaa a, “na-arịọ ya” ma ọ bụ “na-arịọ ya ugboro ugboro.” N’ebe a, ọ pụtara na ha na-agba Jizọs ume ka o rie nri.
    reason: lexical_alternative
  - marker: c
    text: “Rabaị” bụ aha nsọpụrụ ndị Juu ji akpọ onye ha na-agwa okwu; ọ pụtakwara “Onye Ozizi.”
    reason: cultural_note
lexical_decisions:
- source_word: Ἐν τῷ μεταξὺ
  choice: Ka ọ dị ugbu a
  rationale: Akpaokwu a na-egosi oge dị n’etiti ọpụpụ nwanyị ahụ na mkparịta ụka sochirinụ. Nsụgharị a bụ Igbo nkịtị ma na-edobe echiche nke “ka ihe ndị ahụ na-eme.”
- source_word: ἠρώτων
  choice: nọ na-arịọsi ya ike
  rationale: Ụdị imperfect na-egosi omume na-aga n’ihu ma ọ bụ nke a na-eme ugboro ugboro. N’ebe a, ndị na-eso ụzọ na-agba Jizọs ume ka o rie nri; “na-arịọsi ya ike” na-egosi ma arịrịọ ahụ ma ịdịgide ya n’arịrịọ.
- source_word: αὐτὸν
  choice: ya
  rationale: Nnọchiaha a bụ ihe omume ngwaa dakwasịrị, ọ na-ezo aka na Jizọs.
- source_word: οἱ μαθηταὶ
  choice: ndị na-eso ụzọ ya
  rationale: Ọ bụ ìgwè ndị na-eso ụzọ a maara n’akụkọ ahụ. Ịtinye “ya” bụ ụzọ Igbo sitere n’okike si mee ka onye ha na-eso doo anya.
- source_word: λέγοντες
  choice: sị
  rationale: “Sị” na-ewebata okwu arịrịọ ha n’ụzọ dị mkpirikpi ma bụrụ nke sitere n’okike n’Igbo.
- source_word: Ῥαββί
  choice: Rabaị
  rationale: E debere aha nsọpụrụ ndị Juu ahụ n’ụdị mkpụrụokwu Igbo kama ịgbanwe ya ozugbo ka ọ bụrụ “Onye Ozizi”; nkọwa ya dị n’ala peeji.
- source_word: φάγε
  choice: rie nri
  rationale: Nke a bụ iwu ma ọ bụ arịrịọ kpọmkwem nye otu onye. “Rie nri” bụ ụzọ Igbo nkịtị si kwuo ya ma na-edobe ihe ngwaa ahụ pụtara.
