id: JHN.4.21
reference: John 4:21
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: λέγει αὐτῇ ὁ Ἰησοῦς· ⸂Πίστευέ μοι, γύναι⸃, ὅτι ἔρχεται ὥρα ὅτε οὔτε ἐν τῷ ὄρει τούτῳ οὔτε ἐν Ἱεροσολύμοις προσκυνήσετε τῷ πατρί.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/021.yaml
  text: Jesus said to her[a], “Believe me, woman[c][b], an hour is coming when neither on this mountain nor in Jerusalem will you worship the Father.”
translation:
  language: ig
  text: 'Jizọs sịrị ya, “Nwanyị[b], kwere m[a]: oge na-abịa[c] mgbe unu na-agaghị efe Nna ofufe n’ugwu a ma ọ bụ na Jerusalem.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “tụkwasị m obi.” Ngwaa Grik ahụ nwere ike ịpụta ikwere ihe mmadụ kwuru ma ọ bụ ịtụkwasị onye ahụ obi.
    reason: lexical_alternative
  - marker: b
    text: “Nwanyị” bụ ụzọ nkwanye ùgwù e si akpọ nwanyị okwu n’ọnọdụ a; ọ bụghị okwu mkparị.
    reason: cultural_note
  - marker: c
    text: Ma ọ bụ, “oge ahụ na-abịa.” Ọ bụ ezie na okwu Grik a enweghị okwu na-akọwapụta ya dịka “ahụ,” Jọn na-ejikarị “oge” ekwu maka oge mkpebi dị mkpa n’atụmatụ Chineke.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πίστευέ μοι
  choice: kwere m
  rationale: Nke a bụ arịrịọ kpọmkwem ka nwanyị ahụ kwenye n’ihe Jizọs na-ekwu. Ọ na-edebekwa njikọ ya na okwu πιστεύω nke a na-ahụ ugboro ugboro n’akwụkwọ Jọn, ebe ndetu ala peeji na-egosi na ọ pụkwara ịpụta ịtụkwasị mmadụ obi.
- source_word: γύναι
  choice: Nwanyị
  rationale: Nke a na-asụgharị okwu Grik ahụ n’ụzọ kwụ ọtọ. N’ọnọdụ a, ọ bụ ụzọ nkwanye ùgwù e si akpọ nwanyị okwu, ọ bụghị okwu mkparị.
- source_word: ἔρχεται ὥρα
  choice: oge na-abịa
  rationale: N’Igbo, ‘oge na-abịa’ bụ ụzọ dị ndụ ma doo anya e si kwuo ya. Ọ na-echekwa isi okwu Jọn banyere oge dị mkpa na-abịa n’atụmatụ Chineke, n’agbanyeghị na ịsụgharị ya dịka ‘oge awa’ ga-ada ka okwu a manyere amanye.
- source_word: ἐν τῷ ὄρει τούτῳ
  choice: n’ugwu a
  rationale: Nke a bụ ụzọ Igbo nkịtị si akọ ebe ofufe ahụ dị ma na-ezo aka n’ugwu nsọ ndị Sameria a na-ekwu banyere ya.
- source_word: ἐν Ἱεροσολύμοις
  choice: na Jerusalem
  rationale: Nke a bụ usoro Igbo kwesịrị ekwesị maka aha obodo Jerusalem.
- source_word: προσκυνήσετε
  choice: unu na-agaghị efe ... ofufe
  rationale: Ọ bụ ngwaa ọdịnihu nke na-agwa ọtụtụ mmadụ okwu. ‘Ife ofufe’ na-enye ihe okwu ahụ pụtara n’okwu gbara Jọn 4 gburugburu karịa nanị ihulata ala.
- source_word: τῷ πατρί
  choice: Nna
  rationale: N’ebe a, ọ na-ezo aka kpọmkwem n’ebe Chineke nọ dịka Nna; mkpụrụ edemede ukwu na-egosi na ọ bụ aha nsọ n’ọnọdụ a.
- source_word: οὔτε ... οὔτε
  choice: na-agaghị ... n’ugwu a ma ọ bụ na Jerusalem
  rationale: N’okpuru ngwaa jụrụ ajụ, usoro ‘ọ bụghị A ma ọ bụ B’ na Igbo na-egosi nke ọma na ọ bụghị n’otu n’ime ebe abụọ ahụ ka ofufe ahụ ga-adabere.
theological_decisions:
- issue: Ụda okwu Jizọs ji kpọọ nwanyị ahụ, γύναι
  choice: A sụgharịrị ya ‘Nwanyị’ n’enweghị okwu mgbakwunye ga-eme ka ọ dị nro.
  alternative: Nneanyị; ezigbo nwanyị
  rationale: Okwu ahụ abụghị mkparị n’ọnọdụ a. Nsụgharị kwụ ọtọ na-echekwa okwu e dere, ebe ndetu ala peeji na-akọwa omenala dị n’azụ ya.
- issue: Isi okwu ὥρα n’akwụkwọ Jọn
  choice: A sụgharịrị ya ‘oge’ ma hapụ echiche nke oge mkpebi dị mkpa ka ọ dị n’okwu ahụ.
  alternative: oge awa; oge ahụ
  rationale: ‘Oge’ bụ nsụgharị Igbo dị ndụ maka ὥρα n’ebe a ma ghara ịkọwa kpọmkwem ihe oge ahụ bụ karịa ka Grik si mee. Ndetu na-echekwa nhọrọ ‘oge ahụ’ nke nwere ike ime ka isi okwu Jọn pụta ìhè karị.
- issue: Ebe a ga-anọ fee Chineke ofufe
  choice: A hapụrụ okwu ahụ dịka amụma na ofufe agaghị adabere n’ugwu a ma ọ bụ na Jerusalem.
  alternative: Ịkọwa ya ozugbo dịka mkpochapụ ụdị ofufe ọ bụla metụtara ebe nsọ
  rationale: Amaokwu ahụ na-ekwupụta mgbanwe banyere ebe ofufe, ma ọ kọwaghị n’onwe ya nkọwa niile nke mgbanwe ahụ. Nsụgharị ahụ anaghị etinye nkwubi okwu ụka ọ bụla n’ime ya.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. A họọrọ ‘kwere m’ iji chekwaa nkenke na ike arịrịọ Jizọs; ‘oge na-abịa’ zere Igbo na-adịghị eke nke ‘oge awa na-abịa.’ A kpọrọ nwanyị ahụ ‘Nwanyị’ dịka isi Grik si dị, ma ndetu kọwara na okwu ahụ nwere nkwanye ùgwù.
