  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ὡς οὖν ἔγνω ὁ ⸀Ἰησοῦς ὅτι ἤκουσαν οἱ Φαρισαῖοι ὅτι Ἰησοῦς πλείονας μαθητὰς ποιεῖ καὶ βαπτίζει ἢ Ἰωάννης—
base_translation:
  language: en
  yaml_path: translation/nt/john/004/001.yaml
  text: Therefore[a], when Jesus knew that the Pharisees had heard that Jesus was making and baptizing more disciples than John—
translation:
  language: ig
  text: Ya mere, mgbe Jizọs matara na ndị Farisii anụla na ọ na-eme ka ọtụtụ mmadụ bụrụ ndị na-eso ụzọ karịa Jọn, na-emekwa ha baptizim[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “Jizọs na-eme ka ndị mmadụ bụrụ ndị na-eso ụzọ ma na-eme baptizim karịa Jọn.” Okwu Grik ahụ nwere ike ịpụta na ntụnyere ahụ metụtara ọrụ abụọ ahụ e jikọtara ọnụ, ọ bụghị nanị ọnụ ọgụgụ ndị na-eso ụzọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὡς οὖν
  choice: Ya mere, mgbe
  rationale: “Mgbe” na-egosi oge, ebe “ya mere” na-egosi njikọ na ihe ndị bu ụzọ mee; nke a na-echekwa ọrụ okwu abụọ ahụ n’ụzọ Igbo doro anya.
- source_word: ἔγνω
  choice: matara
  rationale: “Matara” na-egosi na Jizọs bịara mara ma ọ bụ ghọta akụkọ ahụ, ma bụrụkwa okwu nkịtị na nke dabara n’akụkọ a.
- source_word: οἱ Φαρισαῖοι
  choice: ndị Farisii
  rationale: Nke a bụ aha otu ahụ a na-ejikarị na Standard Igbo, a hapụkwaghị ọtụtụ mmadụ dị n’aha Grik ahụ.
- source_word: ἤκουσαν
  choice: anụla
  rationale: Ụdị ngwaa a na-egosi na ndị Farisii anụworị akụkọ ahụ tupu Jizọs amata ya.
- source_word: πλείονας μαθητὰς
  choice: ọtụtụ mmadụ karịa Jọn bụrụ ndị na-eso ụzọ ya
  rationale: Nke a na-egosipụta ntụnyere ọnụ ọgụgụ ndị ghọrọ ndị na-eso ụzọ n’Igbo dị mfe nghọta, n’enweghị iji akpaalaokwu na-adịghị eke.
- source_word: ποιεῖ
  choice: na-eme ka ... bụrụ ndị na-eso ụzọ ya
  rationale: N’ebe a ποιεῖ na μαθητάς pụtara ime ka ndị mmadụ ghọọ ndị na-eso ụzọ; ntụgharị a na-eme ka ihe okwu ahụ pụtara doo anya n’Igbo.
- source_word: βαπτίζει
  choice: na-emekwa ha baptizim
  rationale: “Ime baptizim” bụ okwu a maara nke ọma n’Igbo maka βαπτίζω; “ha” na-ezo aka n’ụdị isiokwu ahụ, ya bụ ndị na-eso ụzọ.
- source_word: ἢ Ἰωάννης
  choice: karịa Jọn
  rationale: Nke a na-echekwa ntụnyere dị n’asụsụ Grik n’ụzọ dị mkpirikpi ma bụrụkwa Igbo eke.
theological_decisions:
- issue: Okwu ahụ nwere ike iyi ka ọ na-ekwu na Jizọs ji aka ya mee ndị mmadụ baptizim.
  choice: E debere okwu amaokwu a dịka o siri dị, na-ekwughị tupu oge eruo nkọwa dị n’amaokwu nke abụọ.
  alternative: Ịsị na ndị otu Jizọs ma ọ bụ ndị na-eso ụzọ ya bụ ndị na-eme baptizim.
  rationale: Amaokwu nke abụọ ga-akọwa onye ji aka ya mee baptizim. Ịtinye nkọwa ahụ n’amaokwu a ga-ejikọta amaokwu abụọ ahụ tupu onye dere ya emee ya, ma wepụkwa esemokwu e ji ụma hapụ n’akụkọ ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ “ndị na-eso ụzọ ya” kama okwu nwere ike ịdị ka jargon, ma e debere “baptizim” dịka okwu Ndị Kraịst na ndị na-agụ Igbo maara nke ọma. Akara ogologo dị n’ọgwụgwụ na-egosi na ahịrịokwu ahụ gara n’ihu n’amaokwu na-esote.
