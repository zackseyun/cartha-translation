revisions:
- from: Ya mere, mgbe Jizọs matara na ndị Farisii anụla na ọ na-eme ka ọtụtụ mmadụ karịa Jọn bụrụ ndị na-eso ụzọ ya, na-emekwa ha baptizim[a]—
  to: Ya mere, mgbe Jizọs matara na ndị Farisii anụla na ọ na-eme ka ọtụtụ mmadụ bụrụ ndị na-eso ụzọ karịa Jọn, na-emekwa ha baptizim[a]—
  rationale: The sole substantive change moves “karịa Jọn” to follow the disciple-making predicate, so that the comparison has its intended referent. The coordinated baptism clause and its deliberate surface implication are retained, while the footnote continues to signal the viable wider scope of the comparison.
