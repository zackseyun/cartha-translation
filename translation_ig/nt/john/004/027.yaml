  to: N'oge ahụ, ndị na-eso ụzọ ya bịara. O juru ha anya na ọ na-agwa nwanyị okwu. Ma ọ dịghị onye kwuru, “Gịnị ka ị na-achọ[a]?” ma ọ bụ “Gịnị mere i ji na-agwa ya okwu[b]?”
