id: JHN.4.27
reference: John 4:27
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Καὶ ἐπὶ τούτῳ ἦλθαν οἱ μαθηταὶ αὐτοῦ, καὶ ⸀ἐθαύμαζον ὅτι μετὰ γυναικὸς ἐλάλει· οὐδεὶς μέντοι εἶπεν· Τί ζητεῖς; ἢ τί λαλεῖς μετ’ αὐτῆς;
base_translation:
  language: en
  yaml_path: translation/nt/john/004/027.yaml
  text: And at this point his disciples came[a], and they were amazed that he was speaking with a woman. Yet no one said, “What are you seeking?” or[b], “Why are you speaking with her?”
translation:
  language: ig
  text: N'oge ahụ, ndị na-eso ụzọ ya bịara. O juru ha anya na ọ na-agwa nwanyị okwu. Ma ọ dịghị onye kwuru, “Gịnị ka ị na-achọ[a]?” ma ọ bụ “Gịnị mere i ji na-agwa ya okwu[b]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Gịnị ka ị chọrọ?”
    reason: lexical_alternative
  - marker: b
    text: N'ụzọ nkịtị, “Gịnị ka gị na ya na-ekwu?” Ihe ọ pụtara bụ, “Gịnị mere i ji na-agwa ya okwu?”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπὶ τούτῳ
  choice: N'oge ahụ kpọmkwem
  rationale: Nkebiokwu a na-egosi oge ihe mere—‘n'oge ahụ’ ma ọ bụ ‘otu mgbe ahụ’—ọ bụghị ọnọdụ ebe. ‘Kpọmkwem’ na-eme ka njikọ oge dị na akụkọ ahụ doo anya.
- source_word: ἐθαύμαζον
  choice: O juru ha anya
  rationale: Nke a bụ ụzọ Igbo nkịtị na nke kwesịrị ekwesị si egosi mmeghachi omume nke ịtụnanya; ọdịdị imperfect nke ngwaa Grik na-egosi na ọ bụ ọnọdụ ha nọ na ya mgbe ha bịara.
- source_word: μετὰ γυναικὸς
  choice: na ... otu nwanyị
  rationale: γυνή enweghị article n'ebe a, ya mere ‘otu nwanyị’ na-egosi nwanyị a na-akọwaghị aha ya n'usoro ahịrịokwu ahụ. Ihe gbara ya gburugburu na-egosi na ọ pụtaghị ‘nwunye.’
- source_word: ἐλάλει
  choice: ọ na-agwa ... okwu
  rationale: Usoro ‘na-agwa ... okwu’ na-egosi mkparịta ụka na-aga n'ihu, dịka imperfect Grik si egosi, ma bụrụkwa Igbo dị ndụ ma kwanyere ugwu.
- source_word: μέντοι
  choice: Ma
  rationale: '‘Ma’ na-egosi ọdịiche ahụ: ọ bụ ezie na ihe ahụ juru ha anya, ọ dịghị onye kwuru ajụjụ ahụ n''ọnụ.'
- source_word: Τί ζητεῖς;
  choice: Gịnị ka ị na-achọ?
  rationale: ‘Na-achọ’ na-anọgide nso na ζητέω ma hapụ ihe onye ahụ na-achọghị ka a kpọọ ya aha, dịka Grik si mee. Ihe ọ pụtara n'ọnọdụ a nwekwara ike ịbụ ‘Gịnị ka ị chọrọ?’ nke e debere n'okpuru peeji.
- source_word: τί λαλεῖς μετ’ αὐτῆς;
  choice: Gịnị mere i ji na-agwa ya okwu?
  rationale: Ọ bụ ezie na τί bụ ‘gịnị’ n'ụzọ nkịtị, n'okwu a ajụjụ ahụ na-achọ ihe mere Jizọs ji agwa nwanyị ahụ okwu. Nsụgharị a na-enye ike ajụjụ ahụ n'Igbo eke, ebe nkọwa nke dị nso n'usoro okwu Grik dị n'okpuru peeji.
theological_decisions:
- issue: Ihe mmekọrịta obodo pụtara banyere Jizọs ịgwa nwanyị okwu
  choice: E kwuru naanị na o juru ndị na-eso ụzọ ya anya na ọ na-agwa otu nwanyị okwu.
  alternative: Ịgbakwunye n'ahịrịokwu ahụ na ihe kpatara ya bụ omenala ndị Juu na ndị Sameria ma ọ bụ iwu mmekọrịta nwoke na nwanyị.
  rationale: Grik ekwughị kpọmkwem ihe mere o ji ju ha anya. Nsụgharị ahụ na-edobe njide onwe nke ederede ma ghara itinye nkọwa omenala ma ọ bụ ozizi na-adịghị n'amaokwu ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị mfe nghọta ma dịkwa ugwu. ‘Ndị na-eso ụzọ’ bụ okwu a maara nke ọma maka μαθηταί; ahịrịokwu ndị ahụ na-aga nke ọma n'Igbo ọnụ na ederede. E tinyere akara nkọwa [a] na [b] kpọmkwem n'ebe okwu ha na-akọwa dị.
