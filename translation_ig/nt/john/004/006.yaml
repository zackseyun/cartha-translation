source:
  edition: SBLGNT
  text: ἦν δὲ ἐκεῖ πηγὴ τοῦ Ἰακώβ. ὁ οὖν Ἰησοῦς κεκοπιακὼς ἐκ τῆς ὁδοιπορίας ἐκαθέζετο οὕτως ἐπὶ τῇ πηγῇ· ὥρα ἦν ⸀ὡς ἕκτη.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/006.yaml
  text: Jacob’s well was there[a]. So Jesus, wearied from the journey, was sitting there by the well[c][b]. It was about the sixth hour.
translation:
  language: ig
  text: Olulu mmiri Jekọb dị n’ebe ahụ[a]. Ya mere, Jizọs, ebe ike gwụrụ ya n’ihi njem ahụ, nọ ọdụ n’akụkụ olulu mmiri ahụ otu ahụ[b]. Oge ahụ dị ihe dị ka awa nke isii[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “isi iyi Jekọb”; okwu Grik πηγή nwere ike ịpụta isi iyi ma ọ bụ olulu mmiri.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “n’ụzọ dị otu a” ma ọ bụ “dị ka ọ dị.” Okwu Grik ahụ nwere nghọta na-adịghị mfe ikpebi kpọmkwem n’ebe a.
    reason: lexical_alternative
  - marker: c
    text: Ọ bụrụ na a gụọ awa ụbọchị ahụ site n’ọwụwa anyanwụ, dịka a na-emekarị n’usoro ndị Juu, nke a bụ ihe dị ka etiti ehihie. Ma ụfọdụ na-atụ aro usoro oge ndị Rom, nke ga-eme ka ọ bụrụ ihe dị ka elekere isii nke mgbede.
    reason: alternative_reading
lexical_decisions:
- source_word: πηγὴ τοῦ Ἰακώβ
  choice: Olulu mmiri Jekọb
  rationale: N’agbanyeghị na πηγή nwekwara ike ịpụta isi iyi, ihe ndị gbara amaokwu ahụ gburugburu—karịchaa ịdọpụta mmiri—na-akwado ‘olulu mmiri’ dịka okwu kacha daba n’Igbo ebe a; a debere ‘isi iyi’ n’okpuru peeji.
- source_word: κεκοπιακὼς ἐκ τῆς ὁδοιπορίας
  choice: ebe ike gwụrụ Jizọs n’ihi njem ahụ
  rationale: Perfect participle ahụ na-egosi ọnọdụ ike ọgwụgwụ nke njem kpatara. ‘Ike gwụrụ’ bụ Igbo nkịtị ma doo anya, ‘n’ihi’ na-egosikwa ihe kpatara ya.
- source_word: ἐκαθέζετο
  choice: ọ nọ ọdụ
  rationale: Okwu a na-egosipụta ihe na-aga n’ihu n’oge gara aga; ‘ọ nọ ọdụ’ na-enye nkọwa ọnọdụ ahụ n’Igbo nke ọma.
- source_word: οὕτως
  choice: otu ahụ
  rationale: A sụgharịrị adverb ahụ n’ụzọ pụtara ìhè ka e wee ghara iwepụ nghọta ya na-esighị ike ikpebi. Ọ pụrụ ịpụta na Jizọs nọdụrụ dịka ike gwụrụ ya ma ọ bụ ‘otu ọ dị.’
- source_word: ἐπὶ τῇ πηγῇ
  choice: n’akụkụ olulu mmiri ahụ
  rationale: ἐπί na dative bụ ọnọdụ ebe a; ‘n’akụkụ’ bụ ụzọ Igbo si ekwu na mmadụ nọ nso olulu mmiri.
- source_word: ὥρα ἦν ὡς ἕκτη
  choice: Ọ dị ihe dị ka elekere nke isii
  rationale: ‘Ihe dị ka’ na-egosipụta ὡς, ebe idowe ‘elekere nke isii’ na-echekwa usoro oge nke Greek n’enweghị ikpebi ya ozugbo dịka ehihie.
- source_word: οὖν
  choice: Ya mere
  rationale: Okwu a na-ejikọta ọnọdụ Jizọs na njem ahụ na ihe o mere n’ihi ike ọgwụgwụ ya.
theological_decisions:
- issue: Ihe ‘elekere nke isii’ pụtara n’usoro oge nke oge a
  choice: E debere okwu nkịtị ahụ, ‘ihe dị ka elekere nke isii,’ n’ahịrị bụ isi.
  alternative: Ihe dị ka etiti ehihie; ma ọ bụ ihe dị ka elekere isii nke mgbede ma ọ bụrụ na a gụọ oge n’usoro ndị Rom.
  rationale: Greek ekwughị usoro a ji gụọ awa ahụ. Idowe okwu ahụ dịka ọ dị na-echekwa esemokwu dị na nkọwa usoro oge Jọn kama idozi ya n’ime ntụgharị.
translation_notes:
  register: Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. A họọrọ ‘ike gwụrụ’ kama okwu siri ike ma ọ bụ nke ochie. E gosipụtara οὕτως dịka ‘otu ahụ’ iji chekwaa nghọta ya na-enweghị idozi ihe ọ pụtara n’ụzọ otu akụkụ.
