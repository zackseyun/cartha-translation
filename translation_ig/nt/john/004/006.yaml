- from: Olulu mmiri Jekọb dị n’ebe ahụ[a]. Ya mere, ebe ike gwụrụ Jizọs n’ihi njem ahụ, ọ nọ ọdụ otu ahụ n’akụkụ olulu mmiri ahụ[b]. Ọ dị ihe dị ka elekere nke isii[c].
  to: Olulu mmiri Jekọb dị n’ebe ahụ[a]. Ya mere, Jizọs, ebe ike gwụrụ ya n’ihi njem ahụ, nọ ọdụ n’akụkụ olulu mmiri ahụ otu ahụ[b]. Oge ahụ dị ihe dị ka awa nke isii[c].
  rationale: The revision makes the sentence idiomatic in Standard Igbo, changes the time unit to the less anachronistically precise ‘awa,’ and revises the οὕτως note so that it preserves rather than resolves its debated nuance. It does not alter the passage’s meaning or settle the disputed Johannine time reckoning.
