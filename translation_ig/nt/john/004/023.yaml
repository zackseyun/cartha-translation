id: JHN.4.23
reference: John 4:23
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀλλὰ ἔρχεται ὥρα καὶ νῦν ἐστιν, ὅτε οἱ ἀληθινοὶ προσκυνηταὶ προσκυνήσουσιν τῷ πατρὶ ἐν πνεύματι καὶ ἀληθείᾳ, καὶ γὰρ ὁ πατὴρ τοιούτους ζητεῖ τοὺς προσκυνοῦντας αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/john/004/023.yaml
  text: But an hour is coming[a], and is now here, when the true worshipers will worship the Father in spirit and truth; for the Father indeed seeks such people to worship him.
translation:
  language: ig
  text: Ma oge na-abịa, ugbu a ka ọ dị, mgbe ndị na-efe ofufe n’ezie ga-efe Nna ahụ ofufe n’ime mmụọ[a] na eziokwu; n’ihi na Nna ahụ n’onwe ya na-achọ ndị dị otu a, ndị na-efe ya ofufe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “n’ime Mmụọ Nsọ”; okwu Grik ahụ nwere ike ịpụta ofufe nke Mmụọ Nsọ na-enye ike, ofufe sitere na mmụọ mmadụ, ma ọ bụ ofufe nke ọdịdị ya bụ nke mmụọ.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλὰ
  choice: Ma
  rationale: Na-egosi ọdịiche dị n’etiti okwu a na mkparịta ụka gara aga banyere ebe a ga-anọ fee ofufe.
- source_word: ἔρχεται ὥρα
  choice: oge na-abịa
  rationale: “Oge” bụ ụzọ Igbo nkịtị si akọwa ὥρα n’ebe a, ma ọ ka na-echekwa echiche banyere oge pụrụ iche na-abịa.
- source_word: καὶ νῦν ἐστιν
  choice: ọ bịakwala ugbu a
  rationale: Na-egosi nke ọma na oge ahụ a na-atụ anya ya amalitelarị ugbu a.
- source_word: οἱ ἀληθινοὶ προσκυνηταὶ
  choice: ndị na-efe ofufe n’ezie
  rationale: Na-ezipụta ndị na-efe ofufe n’ụzọ bụ ezi ya, n’etinyeghị nkọwa otu okpukpe ọ bụla.
- source_word: προσκυνήσουσιν τῷ πατρὶ
  choice: ga-efe Nna ahụ ofufe
  rationale: Na-echekwa ọdịnihu nke ngwaa ahụ na aha Chineke dịka Nna.
- source_word: ἐν πνεύματι καὶ ἀληθείᾳ
  choice: n’ime mmụọ na eziokwu
  rationale: Na-edebe πνεῦμα n’enweghị ịkọwa kpọmkwem ma ọ bụ Mmụọ Nsọ, mmụọ mmadụ, ma ọ bụ ụdị ofufe ime mmụọ; “eziokwu” ka bụ aha dịka ọ dị na Grik.
- source_word: καὶ γὰρ
  choice: n’ihi na ... kwa
  rationale: “N’ihi na” na-enye ihe kpatara okwu ahụ, ebe “kwa” na-echekwa ntakịrị ike mgbakwunye nke καί.
- source_word: τοιούτους ζητεῖ
  choice: na-achọkwa ndị dị otu a
  rationale: Na-anọchi anya omume ζητεῖ dị ugbu a ma na-ezo aka n’ụdị ndị ahụ a kọwara.
- source_word: τοὺς προσκυνοῦντας αὐτόν
  choice: ka ha na-efe ya ofufe
  rationale: Na-enye participle ahụ n’Igbo dị ndụ ma na-edebe Nna ahụ dịka onye a na-efe ofufe.
theological_decisions:
- issue: Ihe ἐν πνεύματι pụtara
  choice: n’ime mmụọ
  alternative: n’ime Mmụọ Nsọ; n’ụzọ ime mmụọ
  rationale: Grik ahụ enweghị article, ọ pụkwara izo aka n’ọrụ Mmụọ Nsọ, mmụọ mmadụ, ma ọ bụ ụdị ofufe nke bụ nke mmụọ. Isiokwu ahụ anaghị ekpebi otu nkọwa naanị.
- issue: Oke echiche nke οἱ ἀληθινοὶ προσκυνηταὶ
  choice: ndị na-efe ofufe n’ezie
  alternative: ezigbo ndị na-efe ofufe
  rationale: Nhọrọ a na-egosi ndị ofufe bụ ezi ha n’enweghị iweta nkewa otu okpukpe na-adịghị n’amaokwu ahụ.
translation_notes:
  register: Standard Igbo dị ugbu a, dị nsọ ma dị mfe nghọta. E ji “fee ... ofufe” mee ka προσκυνέω doo anya, e zerekwa idozi mgbagwoju anya dị na πνεύματι n’otu ụzọ naanị.
