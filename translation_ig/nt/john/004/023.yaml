revisions:
- from: Ma oge na-abịa[a], ọ bịakwala ugbu a, mgbe ndị na-efe ofufe n’ezie ga-efe Nna ahụ ofufe n’ime mmụọ na eziokwu; n’ihi na Nna ahụ na-achọkwa ndị dị otu a ka ha na-efe ya ofufe.
  to: Ma oge na-abịa, ugbu a ka ọ dị, mgbe ndị na-efe ofufe n’ezie ga-efe Nna ahụ ofufe n’ime mmụọ[a] na eziokwu; n’ihi na Nna ahụ n’onwe ya na-achọ ndị dị otu a, ndị na-efe ya ofufe.
  rationale: The revision corrects the realized-present clause, relocates the footnote anchor to the phrase it explains, and represents the emphatic explanatory force of καὶ γάρ more naturally. It otherwise preserves the draft’s source-faithful wording and its deliberate theological ambiguity concerning πνεύματι.
