revisions:
- from: Jizọs zara ya, sị, “A sị na ị maara onyinye Chineke, marakwa onye ọ bụ na-asị gị, ‘Nye m mmiri ka m ṅụọ,’ ị gaara arịọ ya, ya enye gị mmiri dị ndụ[a].”
  to: Jizọs zara ya, sị, “A sị na ị maara onyinye Chineke, marakwa onye na-asị gị, ‘Nye m mmiri ka m ṅụọ,’ ị gaara arịọ ya, ọ gaara enye gị mmiri dị ndụ[a].”
  rationale: The revision makes both sides of the contrary-to-fact condition explicit, improves the naturalness of the identity clause, and refines the lexical note without resolving the deliberate ambiguity of “living water.”
