review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately conveys Jesus’ response, the gift of God, the identity clause, the request for a drink, and the idiom “living water.” However, the second half of the counterfactual needs an explicit counterfactual form in Igbo: “ya enye gị” does not as clearly express “he would have given you” as the Greek ἔδωκεν ἄν requires.'
  naturalness: The register is natural Standard Igbo overall. “Jizọs zara ya, sị” is an idiomatic rendering of the Greek narrative doublet. “Mara onye na-asị gị” is smoother than “mara onye ọ bụ na-asị gị,” while retaining the intended identification.
  terminology: “Onyinye Chineke” and “mmiri dị ndụ” are appropriate and preserve the theological and lexical ambiguity. The note should foreground “mmiri na-asọ asọ,” the principal ordinary-water sense; the proposed alternative “mmiri ọhụrụ” is potentially unclear in Standard Igbo.
  issues:
  - severity: medium
    issue: The result clause lacks an explicit counterfactual auxiliary.
    rationale: The Greek apodosis ἔδωκεν ἄν means “he would have given.” In this context, “ya enye gị” may be read as a simple consecutive/subjunctive expression. “Ọ gaara enye gị” clearly preserves the contrary-to-fact force.
  - severity: low
    issue: The identity clause is slightly awkward.
    rationale: “Onye ọ bụ na-asị gị” is less idiomatic than “onye na-asị gị.” The latter naturally means “who is saying to you” in this conditional context.
  - severity: low
    issue: The footnote’s “mmiri ọhụrụ” is not the clearest lexical alternative.
    rationale: For ὕδωρ ζῶν, “mmiri na-asọ asọ” directly communicates running/flowing water. “Mmiri ọhụrụ” can be understood as newly obtained water rather than fresh/running water.
  revised_text: Jizọs zara ya, sị, “A sị na ị maara onyinye Chineke, marakwa onye na-asị gị, ‘Nye m mmiri ka m ṅụọ,’ ị gaara arịọ ya, ọ gaara enye gị mmiri dị ndụ[a].”
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ “mmiri na-asọ asọ.” Okwu a pụrụ izo aka na mmiri na-asọ, ma “mmiri dị ndụ” na-echekwa nghọta abụọ okwu ahụ nwere n’ebe a.
    reason: lexical_alternative
  revision_rationale: The revision makes both sides of the contrary-to-fact condition explicit, improves the naturalness of the identity clause, and refines the lexical note without resolving the deliberate ambiguity of “living water.”
