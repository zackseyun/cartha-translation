id: JHN.4.10
reference: John 4:10
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῇ· Εἰ ᾔδεις τὴν δωρεὰν τοῦ θεοῦ καὶ τίς ἐστιν ὁ λέγων σοι· Δός μοι πεῖν, σὺ ἂν ᾔτησας αὐτὸν καὶ ἔδωκεν ἄν σοι ὕδωρ ζῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/010.yaml
  text: Jesus answered and said to her[a], “If you knew the gift of God, and who it is who says to you, ‘Give me a drink,’ you would have asked him, and he would have given you living water.”
translation:
  language: ig
  text: Jizọs zara ya, sị, “A sị na ị maara onyinye Chineke, marakwa onye na-asị gị, ‘Nye m mmiri ka m ṅụọ,’ ị gaara arịọ ya, ọ gaara enye gị mmiri dị ndụ[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ “mmiri na-asọ asọ.” Okwu a pụrụ izo aka na mmiri na-asọ, ma “mmiri dị ndụ” na-echekwa nghọta abụọ okwu ahụ nwere n’ebe a.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῇ
  choice: Jizọs zara ya, sị
  rationale: Nke a na-egosipụta ngwaa abụọ Grik ahụ n’ụzọ e ji ekwu okwu n’Igbo nke ọma, n’enweghị ikwugharị okwu n’ụzọ na-adịghị eke eke.
- source_word: τὴν δωρεὰν τοῦ θεοῦ
  choice: onyinye Chineke
  rationale: “Onyinye” na-egosi ihe e nyere n’efu; njikọ a na-echekwa genitiv Grik n’emebighị ma ọ bụ onyinye nke Chineke ma ọ bụ nke sitere n’aka Chineke.
- source_word: τίς ἐστιν ὁ λέγων σοι
  choice: onye ọ bụ na-asị gị
  rationale: Nke a na-echekwa nkwusi ike dị n’ajụjụ njirimara Grik ma bụrụkwa okwu Igbo a na-aghọta nke ọma.
- source_word: Δός μοι πεῖν
  choice: Nye m mmiri ka m ṅụọ
  rationale: Igbo chọrọ ka ihe a na-enye pụta ìhè n’ebe a; “mmiri” doro anya site n’ọnọdụ mkparịta ụka ahụ, ma nkebiokwu a na-enye iwu ahụ n’ụzọ eke.
- source_word: ᾔτησας ... ἔδωκεν ἄν
  choice: ị gaara arịọ ya, ya enye gị
  rationale: “Gaara” na-egosi ọnọdụ megidere ihe mere n’ezie, dị ka usoro ọnọdụ Grik si egosi; “ya enye gị” bụ nsonaazụ ya n’Igbo dị mfe ma doo anya.
- source_word: ὕδωρ ζῶν
  choice: mmiri dị ndụ
  rationale: Nke a na-echekwa ma echiche nkịtị nke mmiri na-asọ ma nghọta ime mmụọ okwu Jizọs nwere ike ibu, kama ịhọrọ naanị otu n’ime ha.
theological_decisions:
- issue: Ichekwa ma nghọta nkịtị ma nghọta ime mmụọ nke ὕδωρ ζῶν
  choice: mmiri dị ndụ
  alternative: mmiri na-asọ asọ; mmiri ọhụrụ
  rationale: N’ọnọdụ a, okwu Jizọs na-akpata nghọtahie n’ogo anụ ahụ ma na-atụkwa aka n’eziokwu ime mmụọ. “Mmiri dị ndụ” na-ahapụ esemokwu na nghọta abụọ ahụ ka ha dị.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ usoro okwu eke kama ịsụgharị usoro Grik n’otu n’otu, ma e chekwara nkwusi ike, ọnọdụ megidere eziokwu, na nghọta abụọ dị n’okwu ikpeazụ.
