  yaml_path: translation/nt/john/004/033.yaml
  text: So the disciples were saying to one another[a], “Has anyone brought him something to eat?”
translation:
  language: ig
  text: Ya mere, ndị na-eso ụzọ ya nọ na-ekwu n'etiti onwe ha, sị, “Ọ̀ ga-abụ na e nwere onye wetara ya ihe ọ ga-eri?[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “N’ezie, ọ dịghị onye wetara ya ihe ọ ga-eri, ka ọ dị?” Ajụjụ Grik e ji μή malite na-atụ anya azịza na-adịghị mma.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγον
  choice: nọ na-agwa
  rationale: Oge imperfect na-egosi na okwu ahụ nọ na-aga n’ihu n’ime ihe omume ahụ, ọ bụghị naanị otu okwu e kwuru ozugbo.
- source_word: οὖν
  choice: Ya mere
  rationale: Ọ na-ejikọta ajụjụ ndị na-eso ụzọ ahụ na ihe Jizọs kwuru tupu ya, ma na-egosi ihe ha si na ya chee.
- source_word: οἱ μαθηταὶ
  choice: ndị na-eso ụzọ ya
  rationale: Nke a bụ okwu Igbo doro anya ma bụrụkwa nke a na-ejikarị akọwa ndị na-amụta ihe n’aka Jizọs ma na-eso ya.
- source_word: πρὸς ἀλλήλους
  choice: ibe ha
  rationale: Ọ na-egosi na ndị otu ahụ nọ na-agwa ibe ha okwu.
- source_word: Μή τις
  choice: Ọ̀ dị onye
  rationale: Ajụjụ a na-anọgide bụrụ ajụjụ n’ederede bụ isi; akara nkọwa na-egosi na μή na-atụ anya azịza na-adịghị mma.
- source_word: ἤνεγκεν
  choice: wetara
  rationale: N’ọnọdụ a, φέρω pụtara iweta ihe nye mmadụ.
- source_word: αὐτῷ
  choice: ya
  rationale: Nnọchiaha dative ahụ na-ezo aka na Jizọs dị ka onye e wetara ihe ahụ.
- source_word: φαγεῖν
  choice: ihe ọ ga-eri
  rationale: Nke a bụ ụzọ Igbo dị mfe ma pụta ihe e wetara ka o rie, n’agbanyeghị na Grik ekwughị aha ihe ahụ kpọmkwem.
