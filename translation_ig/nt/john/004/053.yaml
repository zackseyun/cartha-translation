revisions:
- from: Ya mere, nna ahụ matara na ọ bụ n’awa ahụ Jizọs gwara ya, “Nwa gị dị ndụ.”[a] Ya onwe ya na ndị ezinụlọ ya niile wee kwere.[b]
  to: Ya mere, nna ahụ ghọtara na ọ bụ n’awa ahụ ka Jizọs gwara ya sị, “Nwa gị dị ndụ.”[a] Ya onwe ya na ndị ezinụlọ ya niile kwere.[b]
  rationale: 'The revision corrects the temporal syntax, improves direct-speech phrasing, and retains the source’s sequence: the father recognizes the exact hour, then he and his whole household believe. Both footnote anchors are retained. The belief note remains deliberately noncommittal about whether πιστεύω refers narrowly to Jesus’ healing word or more broadly to faith in Jesus.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T05:38:29Z'
review_pass:
  verdict: revise
  source_fidelity: A safe revision is needed. The draft correctly represents the temporal recognition, Jesus’ declaration that the son is alive, and the belief of the father together with his whole household. However, “ọ bụ n’awa ahụ Jizọs gwara ya” omits the needed temporal linkage (‘when/that’) and is not a well-formed natural rendering of ἐκείνῃ τῇ ὥρᾳ ἐν ᾗ. The revised wording explicitly and naturally marks the hour at which Jesus spoke.
  naturalness: The revised text uses the idiomatic Igbo correlative construction “ọ bụ n’awa ahụ ka …,” with “sị” properly introducing direct speech. “Nna ahụ ghọtara” naturally expresses his recognition of the correspondence between the servants’ report and Jesus’ word. “Ya onwe ya na ndị ezinụlọ ya niile kwere” preserves the Greek coordination and emphasis without overstating the nature of their belief.
  terminology: “Dị ndụ” is a clear Standard Igbo rendering of ζῇ in this context. “Ndị ezinụlọ ya niile” appropriately renders the people of the household rather than a building. “Kwere” retains the semantic openness of ἐπίστευσεν. The explanatory note avoids saying that the father necessarily attained a fully defined or doctrinally complete faith.
  issues:
  - severity: medium
    issue: The temporal relative clause is missing from the main text.
    rationale: The wording “ọ bụ n’awa ahụ Jizọs gwara ya” lacks an equivalent for ἐν ᾗ (‘when/in which’) and is syntactically awkward. “Ọ bụ n’awa ahụ ka Jizọs gwara ya sị” restores the relationship without adding meaning.
  - severity: low
    issue: Footnote a describes its alternative as ‘N’ụzọ nkịtị’ and gives a less natural Igbo expression.
    rationale: “Nwa gị na-adị ndụ” can serve as a formal alternative, but it should be labeled simply as an alternative reading rather than as the ordinary or literal Igbo expression. The main rendering “Nwa gị dị ndụ” is the natural one.
  - severity: low
    issue: Footnote b’s phrase “okwukwe zuru ezu karị” can imply a degree of theological completion not specified by the Greek.
    rationale: πιστεύω is left without an explicit object or defined scope in this clause. A neutral description of a broader faith in Jesus better preserves the ambiguity.
  revised_text: Ya mere, nna ahụ ghọtara na ọ bụ n’awa ahụ ka Jizọs gwara ya sị, “Nwa gị dị ndụ.”[a] Ya onwe ya na ndị ezinụlọ ya niile kwere.[b]
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “Nwa gị na-adị ndụ.”
    reason: lexical_alternative
  - marker: b
    text: Ngwaa a sụgharịrị “kwere” nwere ike ịpụta na nna ahụ kwere okwu Jizọs kwuru kpọmkwem, ma ọ bụ na o nwere okwukwe n’ebe Jizọs nọ n’ụzọ sara mbara karị; Grik akọwaghị ókè ya.
    reason: alternative_reading
  revision_rationale: 'The revision corrects the temporal syntax, improves direct-speech phrasing, and retains the source’s sequence: the father recognizes the exact hour, then he and his whole household believe. Both footnote anchors are retained. The belief note remains deliberately noncommittal about whether πιστεύω refers narrowly to Jesus’ healing word or more broadly to faith in Jesus.'
