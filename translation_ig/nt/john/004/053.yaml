source:
  edition: SBLGNT
  text: ἔγνω οὖν ὁ πατὴρ ⸀ὅτι ἐκείνῃ τῇ ὥρᾳ ἐν ᾗ εἶπεν αὐτῷ ὁ ⸀Ἰησοῦς· Ὁ υἱός σου ζῇ, καὶ ἐπίστευσεν αὐτὸς καὶ ἡ οἰκία αὐτοῦ ὅλη.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/053.yaml
  text: So the father knew that it was at that hour when Jesus said to him[a], “Your son lives,” and he himself believed[b], and his whole household.
translation:
  language: ig
  text: Ya mere, nna ahụ ghọtara na ọ bụ n’awa ahụ ka Jizọs gwara ya sị, “Nwa gị dị ndụ.”[a] Ya onwe ya na ndị ezinụlọ ya niile kwere.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Nwa gị na-adị ndụ.”
    reason: lexical_alternative
  - marker: b
    text: Ngwaa a sụgharịrị “kwere” nwere ike ịpụta na nna ahụ kwere okwu Jizọs kwuru kpọmkwem, ma ọ bụ na o nwere okwukwe n’ebe Jizọs nọ n’ụzọ sara mbara karị; Grik akọwaghị ókè ya.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔγνω
  choice: matara
  rationale: Oge gara aga nke γινώσκω na-egosi na nna ahụ ghọtara na oge ndị ohu ya kwuru kwekọrọ n’oge Jizọs kwuru okwu ahụ. “Matara” na-edobe isi echiche nke ịmata ihe n’enweghị ịkọwa usoro ahụ karịa ihe odide Grik kwuru.
- source_word: οὖν
  choice: Ya mere
  rationale: Ọ na-egosi ihe nna ahụ kwubiri site n’ozi ndị ohu ya kwuru n’amaokwu bu ụzọ.
- source_word: ὁ πατὴρ
  choice: nna ahụ
  rationale: Nke a na-agbaso ọrụ ezinụlọ onye ahụ nke ederede Grik kpọrọ aha, kama ịlaghachi n’ịkpọ ya onyeisi ọchịchị.
- source_word: ἐκείνῃ τῇ ὥρᾳ
  choice: n’awa ahụ
  rationale: Ọ na-egosi kpọmkwem oge ahụ n’enweghị itinye okwu nkwusi ike ọzọ na-adịghị na Grik.
- source_word: εἶπεν αὐτῷ ὁ Ἰησοῦς
  choice: Jizọs gwara ya
  rationale: “Gwara ya” bụ ụzọ Igbo dị ugbu a ma dịkwa mfe isi kwuo λέγω ya na onye a gwara okwu.
- source_word: Ὁ υἱός σου ζῇ
  choice: Nwa gị dị ndụ
  rationale: ζῇ bụ ngwaa nke oge ugbu a na-ekwupụta ọnọdụ nwa ahụ ugbu a. “Dị ndụ” bụ ụzọ Igbo kacha doo anya ma kwekọọ n’okwu a.
- source_word: ἐπίστευσεν
  choice: kwere
  rationale: “Kwere” na-edobe okwu ahụ n’ụdị sara mbara dịka Grik si mee, n’akọwaghị ma ọ bụ ikwere okwu Jizọs kpọmkwem ka ọ bụ okwukwe sara mbara karị n’ebe Jizọs nọ.
- source_word: αὐτὸς
  choice: Ya onwe ya
  rationale: Nnọchiaha e kwuru hoo haa na Grik nwere nkwusi ike; “Ya onwe ya” na-echekwa nkwusi ike ahụ.
- source_word: ἡ οἰκία αὐτοῦ ὅλη
  choice: ndị ezinụlọ ya niile
  rationale: οἰκία ebe a pụtara ndị nọ n’ezinụlọ, ọ bụghị ụlọ a rụrụ arụ; “niile” na-echekwa ὅλη.
theological_decisions:
- issue: Ihe “kwere” pụtara banyere nna ahụ
  choice: Ederede bụ naanị na ya onwe ya na ndị ezinụlọ ya niile kwere, na-ahapụghị ókè okwukwe ahụ ka ọ bụrụ ihe akọwapụtara n’ahịrị bụ isi.
  alternative: Ọ pụrụ ịpụta na ha kwere okwu Jizọs banyere ọgwụgwọ ahụ kpọmkwem, ma ọ bụ na ha bịara nwee okwukwe zuru ezu karị n’ebe Jizọs nọ.
  rationale: πιστεύω nwere ike ibu ihe gbasara okwukwe miri emi n’Oziọma Jọn, ma amaokwu a anaghị akọwa ókè ma ọ bụ ụdị okwukwe ahụ kpọmkwem. Ya mere, nsụgharị ahụ anaghị edozi ihe Grik hapụrụ ghe oghe.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe nghọta ma nwee ugwu, sụgharịa amaokwu ahụ. A họọrọ “dị ndụ” karịa ụdị nkịtị “na-adị ndụ” n’ihi na ọ bụ okwu Igbo kacha dịrị ndị mmadụ mfe ma na-ekwupụta ọnọdụ ugbu a nke ọma. E jikwa “ndị ezinụlọ ya niile” mee ka o doo anya na οἰκία na-ekwu banyere ndị mmadụ, ọ bụghị ụlọ.
