  text: οἱ πατέρες ἡμῶν ἐν τῷ ὄρει τούτῳ προσεκύνησαν· καὶ ὑμεῖς λέγετε ὅτι ἐν Ἱεροσολύμοις ἐστὶν ὁ τόπος ὅπου ⸂προσκυνεῖν δεῖ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/020.yaml
  text: Our fathers worshiped on this mountain[b][a], and you say that in Jerusalem is the place where one must worship.
translation:
  language: ig
  text: Ndị nna anyị[a] fere ofufe n’elu ugwu a, ma unu na-ekwu na ọ bụ na Jerusalem ka ebe a ghaghị ife ofufe[b] dị.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Ndị nna ochie anyị.”
    reason: lexical_alternative
  - marker: b
    text: N’ụzọ nkịtị, “ebe ọ dị mkpa ka a fee ofufe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ πατέρες ἡμῶν
  choice: Nna nna anyị
  rationale: Ọ na-edobe akpaala okwu Grik nke pụtara ‘nna anyị,’ ma n’ebe a ọ na-arụtụ aka ná ndị bu ha ụzọ n’okwukwe na n’agbụrụ. Ihe ọzọ a pụrụ iji bụ ‘Ndị nna ochie anyị.’
- source_word: ἐν τῷ ὄρει τούτῳ
  choice: n’elu ugwu a
  rationale: Nke a bụ ụzọ Igbo si ekwu ebe a na-anọ n’ugwu, ma na-edobe ihe ngosipụta ‘a.’
- source_word: προσεκύνησαν
  choice: fere ofufe
  rationale: N’ọnọdụ a, okwu ahụ na-ekwu maka ife Chineke ofufe, ọ bụghị nanị ihulata ma ọ bụ ịkpọ isiala.
- source_word: ὑμεῖς
  choice: unu
  rationale: ‘Unu’ na-egosi na onye a na-agwa okwu karịrị otu ma na-edobe ọdịiche dị n’etiti ‘anyị’ na ‘unu’ nke dị na Grik.
- source_word: καὶ ὑμεῖς λέγετε
  choice: unu na-ekwukwa
  rationale: Mgbakwunye ‘-kwa’ na-edobe njikọ καὶ ma na-eme ka ọdịiche dị n’etiti ihe ndị nna ha mere na ihe ndị Juu na-ekwu pụta n’ụzọ Igbo dị ire, n’agbanyeghị na etinyeghị ‘ma.’
- source_word: ἐν Ἱεροσολύμοις
  choice: dị na Jerusalem
  rationale: Nke a bụ usoro okwu Igbo nkịtị maka igosi na ebe ahụ dị n’ime Jerusalem.
- source_word: ὁ τόπος ὅπου προσκυνεῖν δεῖ
  choice: ebe a ga-anọ fee ofufe
  rationale: Usoro ‘a ga-’ na-egosipụta mkpa ma ọ bụ iwu n’ụzọ na-adịghị akpọ onye ọ bụla aha kpọmkwem; ‘ebe a ga-anọ’ na-eme ka nkebiokwu ebe ahụ bụrụ Igbo nkịtị.
theological_decisions:
- issue: Ma a ga-akpọ ndị otu abụọ ahụ ndị Sameria na ndị Juu kpọmkwem
  choice: E tinyereghị aha ndị otu ahụ; ọdịiche ahụ ka dị n’okwu ‘anyị’ na ‘unu.’
  alternative: ‘Nna nna anyị ndị Sameria ... ma unu ndị Juu ...’
  rationale: Grik akpọghị ndị Sameria ma ọ bụ ndị Juu aha n’amaokwu a. Ịgbakwunye ha ga-akọwa ihe gbara amaokwu ahụ gburugburu karịa ihe amaokwu ahụ kwuru.
- issue: Otu e si egosipụta mkpa dị na προσκυνεῖν δεῖ
  choice: ebe a ga-anọ fee ofufe
  alternative: ebe o kwesịrị ka mmadụ nọ fee ofufe
  rationale: ‘A ga-’ na-edobe echiche mkpa ma ọ bụ iwu n’enweghị ime ya iwu a gwara otu onye kpọmkwem. Ihe ọzọ ahụ pụrụ ime ka ‘kwesịrị’ daa ka ndụmọdụ dị nro karịa δεῖ.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. ‘Nna nna anyị’ na-edobe akpaala okwu isi mmalite ahụ, ebe ihe odide ala peeji na-enye ‘ndị nna ochie’ dị ka nkọwa doro anya. E debere ọdịiche ‘anyị ... unu’ n’etinyeghị aha agbụrụ ndị na-adịghị n’amaokwu Grik.
