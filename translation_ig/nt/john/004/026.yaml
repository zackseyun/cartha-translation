translation:
  language: ig
  text: Jizọs sịrị ya[a], “Abụ m, onye na-agwa gị okwu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịtụgharị ya, “Abụ m ya, onye na-agwa gị okwu.” N’asụsụ Grik, ihe e dere kpọmkwem bụ, “Abụ m, onye na-agwa gị okwu”; site n’ihe nwanyị ahụ kwuru banyere Mesaya n’amaokwu bu ụzọ ka a ghọtara onye Jizọs na-ekwu na ọ bụ.
    reason: alternative_reading
lexical_decisions:
- source_word: λέγει
  choice: sịrị
  rationale: Ọ bụ ezie na Grik ji oge ugbu a nke akụkọ, oge gara aga bụ ụzọ Igbo si akọ akụkọ a n’ụzọ eke.
- source_word: αὐτῇ
  choice: ya
  rationale: N’usoro ‘sịrị ya,’ nnọchiaha a na-egosi n’ụzọ doro anya na ọ bụ nwaanyị ahụ ka Jizọs gwara okwu.
- source_word: Ἐγώ εἰμι
  choice: Abụ m
  rationale: Nke a na-edobe okwu Grik ahụ nkenke n’etinyeghị ‘ya’ ma ọ bụ ‘Mesaya ahụ,’ bụ́ okwu ndị a ghọtara site n’ihe gbara amaokwu ahụ gburugburu ma na-adịghị n’ahịrịokwu Grik n’onwe ya.
- source_word: ὁ λαλῶν σοι
  choice: onye na-agwa gị okwu
  rationale: Nke a bụ okwu Igbo dị eke maka nkebi participle ahụ, ma na-egosi na onye ahụ na-ekwu okwu nye nwaanyị ahụ ugbu a.
theological_decisions:
- issue: Ma a ga-eme ka njirimara Mesaya ahụ pụta ihe kpọmkwem n’ahịrịokwu bụ isi
  choice: E debere ‘Abụ m’ n’enweghị ịgbakwunye ‘ya’ ma ọ bụ ‘Mesaya ahụ.’
  alternative: ‘Abụ m ya, onye na-agwa gị okwu.’
  rationale: Amaokwu bu ụzọ na-eme ka o doo anya na Jizọs na-akọwa onwe ya dị ka Mesaya a na-atụ anya ya, ma okwu Grik etinyeghị nnọchiaha ahụ kpọmkwem. Nhọrọ a na-echekwa mkpụmkpụ okwu isi mmalite na nrụgide nkà mmụta okpukpe ya.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E ji ‘na-agwa gị okwu’ kama ntụgharị siri ike nke participle Grik, ka okwu ahụ daa nke ọma n’Igbo ma ghara ime ka ihe Grik hapụrụ n’amaghị ama bụrụ ihe a kọwara n’ụzọ otu akụkụ.
