  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῇ· Πᾶς ὁ πίνων ἐκ τοῦ ὕδατος τούτου διψήσει πάλιν·
base_translation:
  language: en
  yaml_path: translation/nt/john/004/013.yaml
  text: Jesus answered and said to her[a], “Everyone who drinks from this water will be thirsty again.”
translation:
  language: ig
  text: Jizọs zara ya sị, “Onye ọ bụla na-aṅụ mmiri a ga-akpọ nkụ ọzọ.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη ... καὶ εἶπεν αὐτῇ
  choice: zara ya sị
  rationale: Nke a bụ ụzọ Igbo si ekwu usoro ngwaa abụọ ahụ n'ụzọ ebumpụta ụwa, ma na-edobe ma nzaghachi ahụ ma okwu Jizọs gwara nwanyị ahụ.
- source_word: Πᾶς ὁ πίνων
  choice: Onye ọ bụla na-aṅụ
  rationale: Ọ na-egosi onye ọ bụla n’enweghị ịkpa ókè, ma na-edobe ike omume a na-emekarị nke participle dị na Greek.
- source_word: ἐκ τοῦ ὕδατος τούτου
  choice: mmiri a
  rationale: N’Igbo, ngwaa ‘ịṅụ’ anaghị achọ ka a sụgharịa ἐκ iche ebe a; ‘ịṅụ mmiri a’ na-ezo aka n’otu mmiri ahụ n'ụzọ doro anya ma dị mfe.
- source_word: διψήσει πάλιν
  choice: ga-akpọkwa nkụ ọzọ
  rationale: ‘Ịkpọ nkụ’ bụ okwu Igbo ebumpụta ụwa maka inwe akpịrị ịkpọ nkụ; ‘ọzọ’ na-edobe πάλιν, ebe ‘-kwa’ na-eme ka nkwughachi ahụ daa nke ọma n’Igbo.
theological_decisions:
- issue: Idobe usoro okwu abụọ ἀπεκρίθη ... καὶ εἶπεν
  choice: zara ya sị
  alternative: zara ya naanị, ma ọ bụ sịrị ya naanị
  rationale: ‘Zara ya sị’ na-edobe akụkụ abụọ nke usoro Greek ahụ n’Igbo dị ugbu a n’enweghị ime ka ahịrịokwu ahụ sie ike.
- issue: Ụdị nwoke n'ụtọ asụsụ Πᾶς ὁ πίνων
  choice: Onye ọ bụla na-aṅụ
  alternative: Nwoke ọ bụla na-aṅụ
  rationale: Ụdị ahụ na Greek na-anọchi anya mmadụ niile, ọ bụghị naanị ụmụ nwoke; ‘onye ọ bụla’ na-egosipụta oke izugbe ahụ nke ọma.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji ‘Jizọs’ mee aha ahụ, ‘zara ya sị’ mee usoro akụkọ, na ‘akpọ nkụ’ mee okwu nkịtị maka διψάω. Enweghị ihe mgbakwunye ụka ma ọ bụ nkọwa e tinyere n’amaokwu ahụ.
