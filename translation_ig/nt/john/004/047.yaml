revisions:
- from: Mgbe nwoke a nụrụ na Jizọs esiwo na Judia bata na Galili, ọ gakwuuru ya, rịọ ya[a] ka ọ rịdata[b] gwọọ nwa ya nwoke, n’ihi na ọ na-achọ ịnwụ.
  to: Mgbe nwoke a nụrụ na Jizọs esiwo na Judia bata na Galili, ọ gakwuuru ya, rịọ ya[a] ka ọ gbadata[b] gwọọ nwa ya nwoke, n’ihi na nwa ya nwoke ahụ na-achọ ịnwụ.
  rationale: The revision corrects the key movement verb to “gbadata” and replaces the inaccurate geographical explanation in footnote b with a restrained note faithful to the Greek. The final clause explicitly identifies the dying person as the son, as required by the immediate context, without altering the sense.
