id: JHN.4.47
reference: John 4:47
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οὗτος ἀκούσας ὅτι Ἰησοῦς ἥκει ἐκ τῆς Ἰουδαίας εἰς τὴν Γαλιλαίαν ἀπῆλθεν πρὸς αὐτὸν καὶ ⸀ἠρώτα ἵνα καταβῇ καὶ ἰάσηται αὐτοῦ τὸν υἱόν, ἤμελλεν γὰρ ἀποθνῄσκειν.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/047.yaml
  text: When this man heard that Jesus had come from Judea into Galilee[a], he went to him and asked him to come down and heal his son[b], for he was about to die.
translation:
  language: ig
  text: Mgbe nwoke a nụrụ na Jizọs esiwo na Judia bata na Galili, ọ gakwuuru ya, rịọ ya[a] ka ọ gbadata[b] gwọọ nwa ya nwoke, n’ihi na nwa ya nwoke ahụ na-achọ ịnwụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “na-arịọ ya,” ma ọ bụ “rịọgidere ya.” Ụdị imperfect nke ngwaa Grik nwere ike igosi na arịrịọ ahụ na-aga n’ihu ma ọ bụ na-eme ugboro ugboro.
    reason: lexical_alternative
  - marker: b
    text: “Gbadata” na-edobe echiche ịga n’ala dị na ngwaa Grik ahụ.
    reason: cultural_note
lexical_decisions:
- source_word: οὗτος
  choice: nwoke a
  rationale: Ọ na-ezo aka n’otu nwoke ahụ a kpọrọ onyeisi eze n’amaokwu bu ụzọ, ma na-edobekwa ike ngosipụta dị na οὗτος.
- source_word: ἀκούσας
  choice: Mgbe ... nụrụ
  rationale: A tụgharịrị participle aorist ahụ dị ka nkebi oge n’Igbo ka mmekọrịta ya na ngwaa bụ isi doo anya ma dịkwa mfe ọgụgụ.
- source_word: ἥκει
  choice: esiwo ... bata
  rationale: Nke a na-egosi na ọbịbịa Jizọs emechaala ma na ọ nọzi na Galili, dịka ἥκω si ebu echiche ọbịbịa nke rụpụtara ọnọdụ dị ugbu a.
- source_word: ἐκ τῆς Ἰουδαίας εἰς τὴν Γαλιλαίαν
  choice: na Judia bata na Galili
  rationale: Usoro a na-egosi ebe o si bịa na ebe ọ batara, ma na-ada ka Igbo nkịtị.
- source_word: ἀπῆλθεν πρὸς αὐτόν
  choice: ọ gakwuuru ya
  rationale: ‘Gakwuuru ya’ na-egosi njem nwoke ahụ gara n’ebe Jizọs nọ ma kwekọọ na πρὸς αὐτόν.
- source_word: ἠρώτα
  choice: rịọ ya
  rationale: ‘Rịọ’ na-enye isi echiche ἐρωτάω n’enweghị itinye ike arịrịọ karịrị ihe okwu Grik ahụ kwuru. E debere ohere nke omume na-aga n’ihu nke imperfect na nkọwa ala peeji.
- source_word: ἵνα καταβῇ
  choice: ka ọ rịdata
  rationale: ‘Rịdata’ na-edobe ntụgharị ala dị na καταβαίνω, ọ bụghị nanị ịbịa.
- source_word: ἰάσηται
  choice: gwọọ
  rationale: ‘Gwọọ’ bụ okwu Igbo doro anya ma bụrụkwa nke a na-ejikarị ekwu maka iweghachi ahụ ike.
- source_word: αὐτοῦ τὸν υἱόν
  choice: nwa ya nwoke
  rationale: Nke a na-egosi nke ọma na onye ọrịa ahụ bụ nwa nwoke nke onye ahụ.
- source_word: ἤμελλεν γὰρ ἀποθνῄσκειν
  choice: n’ihi na ọ na-achọ ịnwụ
  rationale: Akpaokwu a na-egosi na ọnwụ dị ya nso, nke kwekọrọ na imminence nke μέλλω tinyere infinitive.
theological_decisions:
- issue: Onye nnọchiaha dị na ‘ọ na-achọ ịnwụ’ na-ezo aka na ya
  choice: Ọ na-ezo aka na nwa nwoke ahụ.
  alternative: Jizọs ma ọ bụ nwoke ahụ gakwuuru Jizọs
  rationale: ‘Nwa ya nwoke’ bụ onye e kwuru ozugbo tupu nkebi a, ọ bụkwa ya ka ọnọdụ akụkọ ahụ na-egosi na ọnwụ dị nso.
- issue: Ike omume dị na ἠρώτα
  choice: E ji ‘rịọ’ mee ihe n’ahịrị isi, ma kọwaa imperfect ahụ na nkọwa ala peeji.
  alternative: ‘na-arịọ’ ma ọ bụ ‘rịọgidere’ n’ahịrị isi
  rationale: Imperfect Grik nwere ike igosi omume na-aga n’ihu ma ọ bụ ugboro ugboro, ma ọ naghị amanye nghọta ahụ n’ụzọ ga-eme ka ‘rịọgidere’ bụrụ naanị ntụgharị ziri ezi.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta mee ihe. A họọrọ ‘Judia’ na ‘Galili’ dịka ụdị aha ebe ndị na-agụ Baịbụl Igbo na-amakarị. E debeghị echiche nke imperfect n’otu ụzọ naanị; e gosipụtara ụzọ ndị ọzọ na nkọwa ala peeji.
