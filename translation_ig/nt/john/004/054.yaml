id: JHN.4.54
reference: John 4:54
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τοῦτο ⸀δὲ πάλιν δεύτερον σημεῖον ἐποίησεν ὁ Ἰησοῦς ἐλθὼν ἐκ τῆς Ἰουδαίας εἰς τὴν Γαλιλαίαν.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/054.yaml
  text: This again was the second sign Jesus did after coming from Judea into Galilee[a].
translation:
  language: ig
  text: Nke a bụkwa ihe ịrịba ama nke abụọ Jizọs mere ọzọ mgbe o si Judia bata na Galili.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya “ọrụ ebube.” Jọn na-ejikarị “ihe ịrịba ama” eme ka ọ pụta ìhè na ọrụ ahụ nwere ihe ọ na-egosi, ọ bụghị naanị ike dị na ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο
  choice: Nke a
  rationale: Ọ na-ezo aka n’ọgwụgwọ a kọrọ ozugbo tupu amaokwu a; “Nke a” bụ ụzọ doro anya ma bụrụkwa nke e ji asụ Igbo ugbu a.
- source_word: δὲ πάλιν
  choice: bụkwa
  rationale: Ngwakọta a na-ejikọta okwu ahụ na ihe gara aga ma na-egosikwa nkwughachi; “bụkwa” na-eburu njikọ ahụ n’ụzọ Igbo dị mfe n’enweghị ịgbakwunye “ma” nke nwere ike igosi mmegide na-adịghị ebe a.
- source_word: δεύτερον
  choice: nke abụọ
  rationale: Ọ bụ nọmba usoro na-akọwa “ihe ịrịba ama”; “nke abụọ” bụ usoro Igbo nkịtị.
- source_word: σημεῖον
  choice: ihe ịrịba ama
  rationale: Ọ na-echekwa echiche Jọn banyere ọrụ nke na-egosi ihe karịrị ike ọrụ ebube ahụ n’onwe ya.
- source_word: ἐποίησεν
  choice: mere
  rationale: ποιέω na σημεῖον jikọrọ ọnụ pụtara ime ọrụ ahụ; “mere” bụ okwu Igbo nkịtị, kpọmkwem.
- source_word: ἐλθὼν ἐκ τῆς Ἰουδαίας εἰς τὴν Γαλιλαίαν
  choice: mgbe o si Judia bata na Galili
  rationale: “Mgbe” na-enye participle ahụ nghọta oge n’enweghị ịmanye ma ọ bụ naanị mgbe ọ bịarutere ozugbo; “si… bata na…” na-echekwa mmegharị site Judia ruo n’ime Galili.
theological_decisions:
- issue: Okwu Jọn bụ σημεῖον
  choice: ihe ịrịba ama
  alternative: ọrụ ebube
  rationale: '“Ihe ịrịba ama” na-echekwa ọrụ edemede na nke nkà mmụta okpukpe okwu a nwere n’Oziọma Jọn: ọrụ ahụ na-arụtụ aka n’ihe ọ pụtara, ọ bụghị naanị n’ike ya.'
- issue: Mmekọrịta πάλιν na δεύτερον
  choice: bụkwa ihe ịrịba ama nke abụọ
  alternative: ọzọ, ihe ịrịba ama nke abụọ
  rationale: Usoro a na-enye Igbo dị ire ma na-echekwa ma njikọ/nkwughachi nke πάλιν ma ọnụọgụ usoro nke δεύτερον, n’enweghị ịkọwa nke a dị ka “ọrụ ebube nke abụọ Jizọs mere n’ozuzu ya.”
translation_notes:
  register: Standard Igbo; asụsụ dị ugbu a, dị ùgwù, ma dị mfe nghọta. E ji “Jizọs,” “Judia,” na “Galili” mee ihe dịka ụdị aha ndị a na-ahụkarị n’Igbo. Ahịrịokwu ahụ na-ezere asụsụ siri ike ma na-echekwa nghọta oge nke participle Grik n’enweghị ime ka ọ pụta na ihe ịrịba ama ahụ mere ozugbo Jizọs rutere.
