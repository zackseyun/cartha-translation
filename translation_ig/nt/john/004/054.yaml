  to: Nke a bụkwa ihe ịrịba ama nke abụọ Jizọs mere ọzọ mgbe o si Judia bata na Galili.[a]
  rationale: Retained the draft's accurate terminology and idiomatic movement expression, while adding 'ọzọ' to render πάλιν explicitly. 'Bụkwa' may continue to carry the verse's mild connective force; 'mere ọzọ' supplies the missing recurrence sense without imposing a more specific interpretation of the sequence.
