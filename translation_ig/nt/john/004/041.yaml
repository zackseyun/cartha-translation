  yaml_path: translation/nt/john/004/041.yaml
  text: And many more believed because of his word[b][a],
translation:
  language: ig
  text: Ọtụtụ ndị ọzọ kwere n’ihi okwu ya.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Okwu Grik ahụ na-emesi ntụnyere a ike: ọtụtụ ndị ọzọ karịa ndị e kwuru na mbụ kwere.'
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “n’ihi ozi ya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλῷ πλείους
  choice: Ọtụtụ ndị ọzọ
  rationale: Nkebiokwu Grik a bụ ntụnyere e mesiri ike, nke na-egosi na ọnụ ọgụgụ ndị kwere karịrị nke mbụ nke ukwuu. “Ọtụtụ ndị ọzọ” bụ Igbo doro anya ma dịkwa mfe nghọta.
- source_word: ἐπίστευσαν
  choice: kwere
  rationale: Ngwaa a pụtara kpọmkwem na ha kwere. E tinyeghị ihe ọzọ dịka “nabata okwukwe” ka a ghara ịgbasa ihe Grik kwuru.
- source_word: διὰ
  choice: n’ihi
  rationale: Ebe διά so ebubo nọ, ọ na-egosi ihe kpatara okwukwe ha; “n’ihi” na-egosipụta nke a n’ụzọ ebumpụta ụwa n’Igbo.
- source_word: τὸν λόγον
  choice: okwu
  rationale: “Okwu” na-ejide ma ihe Jizọs kwuru ma ụda pụrụ iche λόγος nwere n’Oziọma Jọn; “ozi” ka dị ka nkọwa ọzọ.
- source_word: αὐτοῦ
  choice: ya
  rationale: N’ebe a, nnọchiaha ahụ na-ezo aka na Jizọs; “ya” bụ ntụgharị Igbo kwesịrị ekwesị.
theological_decisions:
- issue: Otú e si sụgharị πιστεύω n’akụkọ metụtara nzọpụta
  choice: kwere
  alternative: bịara nwee okwukwe; tụkwasịrị ya obi
  rationale: Grik kwuru naanị na ọtụtụ ndị ọzọ kwere, n’enweghị ihe nnara e dere kpọmkwem n’amaokwu a. Ya mere, ntụgharị ahụ anaghị etinye nkọwa ozizi karịrị ihe ederede kwuru, ma gburugburu amaokwu ahụ ka na-egosi onye ha kwere.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke oge a, dị ùgwù ma dị mfe nghọta. E debere usoro okwu ahụ nkenke dịka Grik, ma e chekwara ntụnyere na nghọta abụọ λόγος nwere.
