id: JHN.4.40
reference: John 4:40
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὡς οὖν ἦλθον πρὸς αὐτὸν οἱ Σαμαρῖται, ἠρώτων αὐτὸν μεῖναι παρ’ αὐτοῖς· καὶ ἔμεινεν ἐκεῖ δύο ἡμέρας.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/040.yaml
  text: So when the Samaritans came to him[a], they asked him to stay with them, and he stayed there two days.
translation:
  language: ig
  text: Ya mere, mgbe ndị Sameria bịakwutere ya, ha nọ na-arịọ ya[a] ka ọ nọnyere ha; ọ nọkwara n’ebe ahụ ụbọchị abụọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ha rịọrọ ya.” Ụdị ngwaa Grik e ji mee ihe nwere ike igosi na ha nọgidere na-arịọ ya ma ọ bụ na ha rịọrọ ya ugboro ugboro.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς οὖν
  choice: Ya mere, mgbe
  rationale: Nke a na-egosipụta ma njikọ echiche nke οὖν ma oge nke ὡς n’ụzọ Igbo dị mfe ma doo anya.
- source_word: ἦλθον πρὸς αὐτὸν
  choice: bịakwutere ya
  rationale: “Bịakwutere ya” na-egosipụta ịbịaru mmadụ nso, dịka ἔρχομαι na πρός si pụta n’ebe a.
- source_word: οἱ Σαμαρῖται
  choice: ndị Sameria
  rationale: Nke a bụ aha obodo ma ọ bụ ìgwè mmadụ ahụ n’Igbo nkịtị.
- source_word: ἠρώτων
  choice: ha nọ na-arịọ ya
  rationale: Ụdị ngwaa imperfect na-egosi arịrịọ na-aga n’ihu ma ọ bụ nke e mere ugboro ugboro; usoro a na-echekwa akụkụ ahụ n’Igbo.
- source_word: μεῖναι παρ’ αὐτοῖς
  choice: ka ọ nọnyere ha
  rationale: “Nọnyere ha” na-egosipụta ịnọ n’ụlọ ọrụ ma ọ bụ n’etiti ha n’ụzọ Igbo sitere n’okike.
- source_word: καὶ ἔμεινεν ἐκεῖ
  choice: ọ nọkwara n’ebe ahụ
  rationale: Nke a na-anọgide na otu echiche nke μένω ma na-egosipụtakwa ἐκεῖ nke ọma.
- source_word: δύο ἡμέρας
  choice: ụbọchị abụọ
  rationale: Ntụgharị kpọmkwem nke oge ọ nọrọ.
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ “ha nọ na-arịọ ya” iji chekwaa ọdịdị imperfect nke Grik, ebe nkọwa ala peeji na-enye ụdị Igbo dị mkpụmkpụ karị.
