id: JHN.4.16
reference: John 4:16
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Λέγει ⸀αὐτῇ· Ὕπαγε φώνησον ⸂τὸν ἄνδρα σου⸃ καὶ ἐλθὲ ἐνθάδε.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/016.yaml
  text: He said to her[a], “Go, call your husband, and come here.”
translation:
  language: ig
  text: Ọ sịrị ya[a], “Gaa kpọọ di gị, bịakwa ebe a.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Ọ na-asị ya”—Grik ji oge ugbu a mee ihe n’akụkọ, bụ́ usoro a na-ejikarị eme ka ihe a na-akọ dị ka ọ na-eme ugbu a; n’Igbo, a pụrụ iji oge gara aga kwuo ya n’ụzọ ebumpụta ụwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: Λέγει
  choice: Ọ sịrị
  rationale: Oge ugbu a nke Grik bụ historical present n’akụkọ a; iji oge gara aga, “Ọ sịrị,” na-eme ka Igbo bụrụ nke e ji akọ akụkọ n’ụzọ ebumpụta ụwa.
- source_word: αὐτῇ
  choice: ya
  rationale: Nnochiaha dative a na-egosi onye a gwara okwu; “ya” na-enye nghọta ahụ n’Igbo.
- source_word: Ὕπαγε
  choice: Gaa
  rationale: Iwu a na-agwa ya ka ọ pụọ mee ihe na-esonụ; “Gaa” bụ ntụgharị dị mkpirikpi ma doo anya.
- source_word: φώνησον
  choice: kpọọ
  rationale: N’ebe a φωνέω pụtara ịkpọ mmadụ ka ọ bịa; “kpọọ” bụ okwu Igbo a na-ejikarị eme nke a.
- source_word: τὸν ἄνδρα σου
  choice: di gị
  rationale: ἀνήρ nwere ike ịpụta nwoke ma ọ bụ di; njikọ ya na “gị” na ọnọdụ ezinụlọ a na-egosi “di gị.”
- source_word: καὶ
  choice: -kwa
  rationale: Mgbakwunye “-kwa” na “bịa” jikọtara iwu nke abụọ na nke mbụ n’Igbo n’ụzọ dị mma.
- source_word: ἐλθὲ
  choice: bịa
  rationale: “Bịa” bụ ihe kwekọrọ kpọmkwem na iwu ἐλθὲ; etinyeghị “lọghachi” n’ihi na echiche ahụ adịghị n’okwu Grik n’onwe ya.
- source_word: ἐνθάδε
  choice: ebe a
  rationale: “Ebe a” bụ okwu Igbo nkịtị ma doo anya maka adverb ebe a.
theological_decisions: []
translation_notes:
  register: Standard Igbo nke oge a, dị mfe ma nwee ugwu. E tinyere akara nkọwa ala ala [a] ozugbo n’akụkụ okwu ọ na-akọwa.
