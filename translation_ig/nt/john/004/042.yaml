  text: τῇ τε γυναικὶ ἔλεγον ὅτι Οὐκέτι διὰ τὴν σὴν λαλιὰν πιστεύομεν· αὐτοὶ γὰρ ἀκηκόαμεν, καὶ οἴδαμεν ὅτι οὗτός ἐστιν ἀληθῶς ὁ σωτὴρ τοῦ ⸀κόσμου.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/042.yaml
  text: And they were saying to the woman[a], “We no longer believe because of your word, for we ourselves have heard[b], and we know that this one truly is the Savior of the world.”
translation:
  language: ig
  text: Ha nọkwa na-agwa nwanyị ahụ, sị, “Ọ bụghịzi n’ihi ihe i kwuru[a] ka anyị ji kwere; n’ihi na anyị onwe anyị anụla ya ma makwa na onye a[b] bụ n’ezie Onye Nzọpụta nke ụwa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'N’ụzọ dị nso n’okwu Grik: “n’ihi okwu gị” ma ọ bụ “n’ihi okwu ọnụ gị.” Ọ na-ezo aka n’ihe nwanyị ahụ kwuru dịka akaebe.'
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya “nwoke a” ma ọ bụ naanị “ọ.” Okwu Grik a na-egosi onye a kpọmkwem ma na-enye nkwusi ike.
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ τε γυναικὶ ἔλεγον
  choice: Ha nọkwa na-agwa nwanyị ahụ
  rationale: Ụdị imperfect nke ἔλεγον na-egosi okwu na-aga n’ihu n’oge gara aga; ‘nọkwa na-agwa’ na-ebuga akụkụ ahụ ma na-egosikwa obere ike njikọ nke τε.
- source_word: Οὐκέτι διὰ τὴν σὴν λαλιὰν πιστεύομεν
  choice: Ọ bụghịzi n’ihi ihe i kwuru ka anyị ji kwere
  rationale: ‘Ọ bụghịzi’ na-egosi nkwụsị nke ihe bụbu ihe ndabere ha ji kwere; ‘ihe i kwuru’ bụ Igbo nkịtị ma zie ezi maka okwu akaebe nwanyị ahụ, ebe διά na-egosi ihe kpatara ya ma ọ bụ ihe ndabere ya.
- source_word: αὐτοὶ γὰρ ἀκηκόαμεν
  choice: n’ihi na anyị onwe anyị anụla ya
  rationale: ‘Anyị onwe anyị’ na-echekwa nkwusi ike nke αὐτοί; ‘anụla’ na-egosipụta omume mezuru nke nsonaazụ ya ka dị ugbu a. Etinyere ‘ya’ dị ka ihe a nụrụ nke a ghọtara site n’ọnọdụ ahụ.
- source_word: καὶ οἴδαμεν
  choice: anyị makwaara
  rationale: οἴδαμεν bụ ngwaa ọnọdụ nke pụtara ịma ugbu a; ‘makwaara’ jikọtara ya n'ụzọ Igbo na nkwupụta gara aga.
- source_word: οὗτός ἐστιν ἀληθῶς
  choice: onye a bụ n’ezie
  rationale: ‘Onye a’ na-echekwa nkwusi ike nke demonstrative οὗτος karịa naanị ‘ọ’; ‘n’ezie’ na-edobe ịdị arọ nke ἀληθῶς.
- source_word: ὁ σωτὴρ τοῦ κόσμου
  choice: Onye Nzọpụta nke ụwa
  rationale: ‘Onye Nzọpụta’ na-echekwa aha ọrụ na ịdị arọ nke σωτήρ; ‘nke ụwa’ na-asụgharị κόσμος n’enweghị itinye ‘ụwa niile’ ma ọ bụ ịkpa ókè n’ókè ya.
theological_decisions:
- issue: Ókè na ike nkwupụta ndị Sameria banyere Jizọs
  choice: Onye a bụ n’ezie Onye Nzọpụta nke ụwa
  alternative: Onye Nzọpụta mmadụ niile; Onye Nzọpụta ndị a họpụtara n’ụwa
  rationale: A hapụrụ ‘ụwa’ n’obosara ya dịka ederede Grik si kwuo, n’etinyeghị nkọwa ozizi nke ga-eme ka ọ saa mbara karịa ma ọ bụ dị warara karịa ederede ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Nhazi ‘ka anyị ji kwere’ bụ ụzọ Igbo ebumpụta ụwa si egosi ihe ndabere nke nkwenye, ebe ‘anyị onwe anyị’ na-echekwa ọdịiche dị n’etiti akaebe a nụrụ n’ọnụ nwanyị ahụ na ihe ha nụrụ n’onwe ha.
