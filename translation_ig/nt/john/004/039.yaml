review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the origin ('from that town'), the partitive group of Samaritans, belief directed toward Jesus, the causal force of διά, and the content of the woman’s testimony. ‘M mere’ appropriately renders the aorist ἐποίησα; a present perfect is not required. The present participle μαρτυρούσης is better represented with an idiomatic ongoing-testimony construction.
  naturalness: ‘Nwanyị ahụ, onye nọ na-agba akaebe sị’ is awkward Standard Igbo, since the relative expression does not connect naturally to the following quotation formula. ‘Mgbe ọ na-agba akaebe, sị’ gives a natural narrative equivalent while retaining the participle’s imperfective sense. ‘Ọtụtụ n’ime ndị Sameria’ also makes the Greek partitive construction explicit.
  terminology: ‘Ndị Sameria,’ ‘kwere na ya,’ ‘okwu,’ and ‘akaebe’ are suitable Standard Igbo choices. The lexical-alternative footnote should be anchored to ‘okwu,’ the word it explains, rather than after the quotation.
  issues:
  - severity: medium
    issue: The rendering of μαρτυρούσης is syntactically awkward.
    rationale: ‘Nwanyị ahụ, onye nọ na-agba akaebe sị’ is not a smooth way to introduce direct testimony in Standard Igbo. Recasting it as ‘mgbe ọ na-agba akaebe, sị’ preserves the ongoing testimonial setting and is idiomatic.
  - severity: low
    issue: The lexical footnote anchor is misplaced.
    rationale: The footnote explains λόγος, rendered ‘okwu,’ so its marker should immediately follow ‘okwu’ rather than the quoted statement.
  - severity: low
    issue: The partitive sense can be made more explicit.
    rationale: ‘Ọtụtụ n’ime ndị Sameria’ directly reflects πολλοὶ ... τῶν Σαμαριτῶν and remains natural.
