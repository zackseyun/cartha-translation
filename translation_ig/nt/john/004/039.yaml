  text: Ἐκ δὲ τῆς πόλεως ἐκείνης πολλοὶ ἐπίστευσαν εἰς αὐτὸν τῶν Σαμαριτῶν διὰ τὸν λόγον τῆς γυναικὸς μαρτυρούσης ὅτι Εἶπέν μοι πάντα ⸀ἃ ἐποίησα.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/039.yaml
  text: And many of the Samaritans from that town believed in him because of the word of the woman who was testifying, “He told me everything I did.”
translation:
  language: ig
  text: Ọtụtụ n’ime ndị Sameria si n’obodo ahụ kwere na ya n’ihi okwu nwanyị ahụ[a], mgbe ọ na-agba akaebe, sị, “Ọ gwara m ihe niile m mere.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “n’ihi ozi nwanyị ahụ.” Okwu Grik λόγος nwere ike ịpụta “okwu,” “ozi,” ma ọ bụ “akụkọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐκ δὲ τῆς πόλεως ἐκείνης
  choice: si n’obodo ahụ
  rationale: ἐκ na-egosi ebe ha si, πόλις bụkwa ‘obodo.’ A hapụrụ δέ dị ka njikọ dị nro n’ihi na usoro ahịrịokwu Igbo adịghị achọ ka a sụgharịa ya iche mgbe niile.
- source_word: πολλοὶ ... τῶν Σαμαριτῶν
  choice: Ọtụtụ ndị Sameria
  rationale: 'Nke a na-egosipụta echiche partitive nke Grik n’ụzọ Igbo dị mfe ma doo anya: ọtụtụ ndị so ná ndị Sameria.'
- source_word: ἐπίστευσαν εἰς αὐτόν
  choice: kwere na ya
  rationale: Nkebi a na-egosi nkwenye ma ọ bụ ntụkwasị obi e tinyere n’ebe Jizọs nọ, n’enweghị ịgbasa ihe amaokwu ahụ kwuru.
- source_word: διὰ τὸν λόγον
  choice: n’ihi okwu
  rationale: διά na accusative na-egosi ihe kpatara ya. λόγος nwere ike ịbụ ‘okwu,’ ‘ozi,’ ma ọ bụ ‘akụkọ’; ‘okwu’ na-edobe obosara ihe okwu Grik ahụ pụrụ ịpụta.
- source_word: τῆς γυναικὸς μαρτυρούσης
  choice: nwanyị ahụ, onye nọ na-agba akaebe
  rationale: Participụl dị ugbu a na-egosi nwanyị ahụ ka ọ nọ na-enye akaebe; nhazi a na-edobe nuance ahụ n’Igbo a na-aghọta ngwa ngwa.
- source_word: Εἶπέν μοι πάντα ἃ ἐποίησα
  choice: Ọ gwara m ihe niile m mere
  rationale: ‘Ọ gwara m’ bụ ụzọ Igbo ebumpụta ụwa si kwuo λέγω ya na onye e gwara; aorist ἐποίησα dabara nke ọma na ‘m mere’ n’akụkọ a.
theological_decisions:
- issue: Ihe ἐπίστευσαν εἰς αὐτόν pụtara n’akwụkwọ Jọn
  choice: kwere na ya
  alternative: tụkwasịrị ya obi
  rationale: ‘Kwere na ya’ na-edobe nkwenye a tụkwasịrị n’ebe Jizọs nọ, ma ọ naghị etinye nkọwa ozizi karịrị ihe ederede ahụ kwuru.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. ‘Ndị Sameria’ bụ aha ndị obodo ahụ a na-ahụkarị; ahịrịokwu ahụ na-edobe ọdịdị akaebe nwanyị ahụ na ihe kpatara nkwenye ha.
