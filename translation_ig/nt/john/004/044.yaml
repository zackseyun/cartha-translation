  text: αὐτὸς ⸀γὰρ Ἰησοῦς ἐμαρτύρησεν ὅτι προφήτης ἐν τῇ ἰδίᾳ πατρίδι τιμὴν οὐκ ἔχει.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/044.yaml
  text: For Jesus himself testified that a prophet has no honor in his own homeland[a].
translation:
  language: ig
  text: N’ihi na Jizọs n’onwe ya gbara akaebe na onye amụma enweghị nsọpụrụ n’ala nna ya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “n’obodo nke ya” ma ọ bụ “n’ebe o si.” Okwu Grik πατρίς nwere ike ịpụta ala nna mmadụ ma ọ bụ ógbè ebe o si.
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: N’ihi na
  rationale: Ọ na-egosi na okwu a na-akọwa ihe metụtara akụkọ gbara ya gburugburu; “N’ihi na” na-eme ka njikọ ahụ doo anya n’Igbo.
- source_word: αὐτὸς ... Ἰησοῦς
  choice: Jizọs n’onwe ya
  rationale: Nke a na-echekwa nkwusi ike dị na αὐτός ma bụrụkwa okwu Igbo e ji eme ihe n'ụzọ ebumpụta ụwa.
- source_word: ἐμαρτύρησεν
  choice: gbara akaebe
  rationale: Ọ na-echekwa asụsụ nke ịgba akaebe, nke dị mkpa n’Oziọma Jọn, ma bụrụkwa Igbo doro anya.
- source_word: ὅτι
  choice: na
  rationale: “Na” na-ewebata ihe Jizọs gbara akaebe banyere ya n'ụzọ Igbo kwesịrị ekwesị.
- source_word: προφήτης
  choice: onye amụma
  rationale: 'Ọ na-enye echiche izugbe nke ilu a: onye ọ bụla bụ onye amụma.'
- source_word: ἐν τῇ ἰδίᾳ πατρίδι
  choice: n’ala nna ya
  rationale: “Ala nna ya” na-egosipụta ebe onye si ma ọ bụ ógbè nke ya, ma na-ahapụ kpọmkwem ebe ahụ n’enweghị mkpebi.
- source_word: τιμὴν οὐκ ἔχει
  choice: adịghị enweta nsọpụrụ
  rationale: Nke a bụ Igbo dị mfe ma dị ugbu a nke na-egosi na a naghị enye onye amụma nsọpụrụ n’ebe nke ya.
theological_decisions:
- issue: Ebe kpọmkwem “ala nna ya” na-ezo aka n’akụkọ Jọn
  choice: Ahapụla ya dị ka “ala nna ya” n’enweghị ịkpọ Juda, Galili, ma ọ bụ Nazaret aha.
  alternative: Ịkọwa ya kpọmkwem dị ka Juda, Galili, ma ọ bụ Nazaret.
  rationale: Amaokwu ahụ anaghị akọwa ebe ahụ kpọmkwem. Nsụgharị sara mbara na-echekwa nghọta dị iche iche na esemokwu dị n’akụkọ ahụ kama idozi ya n’ime ederede.
translation_notes:
  register: Asụsụ Igbo Izugbe dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji “gbara akaebe” chekwaa isiokwu ịgba akaebe nke Jọn; e jighị nkọwa okpukpe ọgbakọ ọ bụla dozie ebe “ala nna” ahụ bụ.
