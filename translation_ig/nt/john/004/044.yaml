- from: N’ihi na Jizọs n’onwe ya gbara akaebe na onye amụma adịghị enweta nsọpụrụ n’ala nna ya.[a]
  to: N’ihi na Jizọs n’onwe ya gbara akaebe na onye amụma enweghị nsọpụrụ n’ala nna ya.[a]
  rationale: Only the final predicate is revised, from “adịghị enweta nsọpụrụ” to “enweghị nsọpụrụ,” to reflect more directly the Greek “does not have honor.” The text and note continue to preserve the unresolved sense of πατρίς.
