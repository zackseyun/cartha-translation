reference: John 4:24
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: πνεῦμα ὁ θεός, καὶ τοὺς προσκυνοῦντας αὐτὸν ἐν πνεύματι καὶ ἀληθείᾳ δεῖ προσκυνεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/024.yaml
  text: God is spirit[b][a], and those who worship him must worship in spirit and truth.
translation:
  language: ig
  text: Chineke bụ mmụọ[b], ndị na-efe ya ofufe aghaghịkwa ife ya ofufe n'ime mmụọ na eziokwu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n'ime Mmụọ Nsọ na eziokwu.” A pụrụ ịghọta okwu Grik ahụ n'ụzọ a kapịrị ọnụ karị, ma okwu e ji mee ihe n'ahịrịokwu a na-edobe echiche ya sara mbara.
    reason: alternative_reading
  - marker: b
    text: “Chineke bụ mmụọ” na-akọwa ọdịdị Chineke; ọ pụtaghị naanị na Chineke bụ otu n'ime ọtụtụ ndị bụ mmụọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: πνεῦμα
  choice: mmụọ
  rationale: N'ahịrịokwu “Chineke bụ mmụọ,” okwu a na-akọ ụdị ọdịdị Chineke bụ; ọ bụghị ikwu na Chineke bụ naanị otu mmụọ n'etiti mmụọ ndị ọzọ.
- source_word: ὁ θεός
  choice: Chineke
  rationale: Nke a bụ okwu Igbo a na-ejikarị akọwa Θεός ebe a, ebe artikụl Grik na-egosi na Chineke bụ isiokwu ahịrịokwu ahụ.
- source_word: τοὺς προσκυνοῦντας αὐτόν
  choice: ndị na-efe ya ofufe
  rationale: Nkebi participle a na-ezo aka n'ozuzu nye ndị na-efe Chineke; okwu Igbo a bụ nke doro anya ma bụrụkwa nke e ji eme ihe ugbu a.
- source_word: ἐν πνεύματι
  choice: n'ime mmụọ
  rationale: Nke a na-edobe obosara na ntakịrị mgbagwoju anya dị na Grik, n'emeghị ka ọ bụrụ naanị ntụaka doro anya nye Mmụọ Nsọ ma ọ bụ naanị ezi obi mmadụ.
- source_word: ἀληθείᾳ
  choice: eziokwu
  rationale: “Eziokwu” bụ okwu Igbo kachasị kwekọọ n'okwu a, ma nwee ike ibu echiche nke ihe bụ eziokwu na eziokwu Chineke na-ekpughe.
- source_word: δεῖ
  choice: aghaghị
  rationale: “Aghaghị” na-egosipụta mkpa na iwu dị n'okwu Grik ahụ n'ụzọ dị nkenke ma sie ike.
- source_word: προσκυνεῖν
  choice: ife ... ofufe
  rationale: N'ọnọdụ a, okwu ahụ pụtara ife Chineke ofufe; ntụgharị a bụ nke nkịtị n'Igbo ma ghara ime ka mmegharị ahụ nke ịkpọ isiala bụrụ isi echiche.
theological_decisions:
- issue: Ihe “Chineke bụ mmụọ” pụtara
  choice: Ọ bụ nkwupụta banyere ọdịdị Chineke.
  alternative: Chineke bụ otu mmụọ n'etiti ndị ọzọ.
  rationale: Usoro okwu Grik na enweghị artikụl n'ihu πνεῦμα na-akwado nghọta nke na-akọ àgwà ma ọ bụ ọdịdị Chineke, ọ bụghị itinye ya naanị n'otu òtù nke ihe ndị bụ mmụọ.
- issue: Ihe “n'ime mmụọ na eziokwu” pụtara
  choice: Ofufe ahụ ga-abụ nke mmụọ na eziokwu ji mara, ebe a hapụrụ obosara okwu Grik ahụ ka ọ dị.
  alternative: N'ime Mmụọ Nsọ na n'eziokwu; ma ọ bụ jiri naanị ezi obi na eziokwu.
  rationale: πνεύματι na ἀληθείᾳ enweghị artikụl, ma e jikọtara ha ọnụ. Ya mere, ntụgharị a anaghị amachibido “mmụọ” ka ọ bụrụ naanị Mmụọ Nsọ, ọ dịghịkwa ebelata ya ka ọ bụrụ naanị mmetụta ime obi.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta, mee ntụgharị ahụ. “Ife ... ofufe” bụ usoro okwu ndị Igbo maara nke ọma. E debere “n'ime mmụọ na eziokwu” ka ọ ghara idozi n'ụzọ otu naanị mgbagwoju anya dị na isi mmalite Grik.
