source:
  edition: SBLGNT
  text: ἀφῆκεν οὖν τὴν ὑδρίαν αὐτῆς ἡ γυνὴ καὶ ἀπῆλθεν εἰς τὴν πόλιν καὶ λέγει τοῖς ἀνθρώποις·
base_translation:
  language: en
  yaml_path: translation/nt/john/004/028.yaml
  text: So the woman left her water jar and went into the town and says to the people,
translation:
  language: ig
  text: Ya mere, nwanyị ahụ hapụrụ ite mmiri ya, wee gaa n’obodo ahụ, sị ndị mmadụ,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑδρία
  choice: ite mmiri
  rationale: Ọ bụ ite e ji ekuru ma ọ bụ ebu mmiri; ‘ite mmiri’ bụ okwu Igbo doro anya ma bụrụkwa nke mmadụ niile ga-aghọta.
- source_word: πόλις
  choice: obodo
  rationale: N’ebe a, πόλις na-ezo aka n’obodo ahụ nwanyị ahụ gara; ‘obodo’ bụ nsụgharị Igbo nkịtị na nke kwesịrị ekwesị.
- source_word: ἄνθρωποι
  choice: ndị mmadụ
  rationale: Ụdị ọtụtụ a pụtara ndị mmadụ n’ozuzu, ọ bụghị naanị ụmụ nwoke.
- source_word: λέγει
  choice: wee sị
  rationale: Ọ bụ ezie na Grik ji ugbu a akụkọ ihe mere eme (‘ọ na-asị’), Igbo na-akọ usoro omume gara aga n'ụzọ eke site n’iji ‘wee sị’; nke a na-echekwa mmegharị akụkọ ahụ n’enweghị okwu na-ada ka ihe na-eme ugbu a n’ezie.
theological_decisions: []
translation_notes:
  register: 'Standard Igbo; asụsụ dị mfe, dị ùgwù, ma bụrụ nke ndị na-agụ akwụkwọ taa ga-aghọta. Ejikọtara omume atọ ahụ n’usoro akụkọ eke: hapụrụ, gaa, wee sị.'
