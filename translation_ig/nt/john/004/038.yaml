  text: ἐγὼ ἀπέστειλα ὑμᾶς θερίζειν ὃ οὐχ ὑμεῖς κεκοπιάκατε· ἄλλοι κεκοπιάκασιν, καὶ ὑμεῖς εἰς τὸν κόπον αὐτῶν εἰσεληλύθατε.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/038.yaml
  text: I sent you to reap what you have not labored for[a]; others have labored[b], and you have entered into their labor.
translation:
  language: ig
  text: M zigara unu ka unu wee ihe ubi nke unu na-arụghị ọrụ maka ya[a]. Ndị ọzọ adọọla aka n’ọrụ, unu abanyela n’ọrụ ha[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ka unu kpokọta ihe ubi.”
    reason: lexical_alternative
  - marker: b
    text: N’asụsụ Grik, ihe ọ na-ekwu kpọmkwem bụ, “unu abanyela n’ọrụ ha.” O nwekwara ike ịpụta, “unu eketala mkpụrụ ọrụ ha,” ma ọ bụ, “unu esonyela n’ọrụ ha.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλα
  choice: zigara
  rationale: Oge aorist na-egosi omume e mere; “zigara” bụ okwu Igbo dị mfe nke na-edobe echiche nke iziga mmadụ n’ọrụ n’etinyeghị nkọwa ọzọ dịka ‘inye ọrụ pụrụ iche.’
- source_word: θερίζειν
  choice: ka unu wee
  rationale: “Iwe” na-edobe ihe atụ ọrụ ugbo nke owuwe ihe ubi, ma na-ada nke ọma n’Igbo nkịtị.
- source_word: ὃ οὐχ ὑμεῖς κεκοπιάκατε
  choice: ihe unu na-arụghị ọrụ maka ya
  rationale: Nke a na-egosi na ihe a na-ewe sitere n’ọrụ ike ndị ọzọ rụrụ, ma ọ naghị atụgharị ya kpọmkwem ka ọ bụrụ naanị mkpụrụ ọrụ ha.
- source_word: ἄλλοι κεκοπιάκασιν
  choice: Ndị ọzọ arụsịala ọrụ ike
  rationale: “Arụsịala” na-egosipụta ọrụ gara aga nke nsonaazụ ya ka dị ugbu a; “ọrụ ike” na-eweta echiche nke κόπος/κοπιάω.
- source_word: εἰς τὸν κόπον αὐτῶν εἰσεληλύθατε
  choice: unu abanyekwala n’ọrụ ha
  rationale: Ntụgharị a na-agbaso okwu Grik nke na-ekwu ịbanye ‘n’ọrụ’ ndị ọzọ, kama ịkọwa ya naanị dị ka iketa mkpụrụ ọrụ ahụ.
- source_word: ἐγὼ ... ὑμεῖς
  choice: M ... unu
  rationale: A hapụrụ nnọchiaha ndị a n’ederede iji chekwaa ntụnyere dị n’etiti onye zitere na ndị e zitere, n’enweghị ịgbakwunye nkwusi ike na-adịghị na isi mmalite.
theological_decisions:
- issue: Ndị “ọzọ” na ihe atụ owuwe ihe ubi na-anọchi anya ndị
  choice: A hapụrụ “ndị ọzọ” n’ozuzu ya, a kọwaghị ha kpọmkwem.
  alternative: Ịkọwa ha dị ka ndị amụma, Jọn Onye Na-eme Baptizim, Jizọs, ma ọ bụ ndị akaebe mbụ.
  rationale: Amaokwu ahụ akọwaghị kpọmkwem ndị ọ na-ekwu maka ha. Ịhapụ okwu ahụ n’ozuzu ya na-echekwa nghọta dị iche iche isi mmalite ahụ nwere ike ikwe.
translation_notes:
  register: Ejiri Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E debere ihe atụ owuwe ihe ubi na nkwughachi echiche ‘ọrụ ike,’ ebe a zere ịkọwa ndị ‘ọzọ’ n’ụzọ amaokwu ahụ n’onwe ya na-akọwaghị.
