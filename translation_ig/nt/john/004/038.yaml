revisions:
- from: M zigara unu ka unu wee ihe unu na-arụghị ọrụ maka ya[a]. Ndị ọzọ arụsịala ọrụ ike, unu abanyekwala n’ọrụ ha[b].
  to: M zigara unu ka unu wee ihe ubi nke unu na-arụghị ọrụ maka ya[a]. Ndị ọzọ adọọla aka n’ọrụ, unu abanyela n’ọrụ ha[b].
  rationale: The revision explicitly supplies “ihe ubi” to express reaping/harvesting, replaces an unnatural expression for prior labor with idiomatic Standard Igbo, and retains the source’s ambiguity about who “others” are. It also preserves the Greek image of entering into others’ labor rather than reducing it in the main text to sharing only its results.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T05:38:22Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves the broad contrast between Jesus' sending, others' prior labor, and the disciples' participation. However, “ka unu wee ihe” lacks the explicit harvest object required by θερίζειν in this agricultural context, and “arụsịala ọrụ ike” is not natural Standard Igbo for the completed prior labor expressed by κεκοπιάκασιν.
  naturalness: “M zigara unu ka unu wee ihe ubi...” and “Ndị ọzọ adọọla aka n’ọrụ...” are clear, modern Standard Igbo. “Unu abanyela n’ọrụ ha” naturally retains the deliberately concrete metaphor of entering into others’ labor.
  terminology: “Ihe ubi” preserves the harvest metaphor. “Adọọla aka n’ọrụ” conveys having labored without identifying the unspecified “others.” The second clause retains “ọrụ ha” for κόπος and avoids interpreting it merely as the fruit or outcome of their work.
  issues:
  - severity: medium
    issue: The main text says “ka unu wee ihe,” without “ihe ubi.”
    rationale: θερίζειν means reap/harvest in the active agricultural metaphor of the context. The draft rationale itself invokes “iwe [ihe ubi],” but the translated text omits the needed object, leaving “ihe” overly indefinite.
  - severity: medium
    issue: “Ndị ọzọ arụsịala ọrụ ike” is awkward and semantically imprecise in Standard Igbo.
    rationale: This does not idiomatically express that others have labored/toiled. “Adọọla aka n’ọrụ” is a natural expression of sustained work and fits the contrast with the disciples’ entry into that work.
  - severity: low
    issue: Footnote a’s proposed alternative duplicates the necessary harvest sense but is less idiomatic as written.
    rationale: Once the main text explicitly says “wee ihe ubi,” an alternative such as “kpokọta ihe ubi” gives a usable lexical rendering without weakening the metaphor.
  revised_text: M zigara unu ka unu wee ihe ubi nke unu na-arụghị ọrụ maka ya[a]. Ndị ọzọ adọọla aka n’ọrụ, unu abanyela n’ọrụ ha[b].
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “ka unu kpokọta ihe ubi.”
    reason: lexical_alternative
  - marker: b
    text: N’asụsụ Grik, ihe ọ na-ekwu kpọmkwem bụ, “unu abanyela n’ọrụ ha.” O nwekwara ike ịpụta, “unu eketala mkpụrụ ọrụ ha,” ma ọ bụ, “unu esonyela n’ọrụ ha.”
    reason: lexical_alternative
  revision_rationale: The revision explicitly supplies “ihe ubi” to express reaping/harvesting, replaces an unnatural expression for prior labor with idiomatic Standard Igbo, and retains the source’s ambiguity about who “others” are. It also preserves the Greek image of entering into others’ labor rather than reducing it in the main text to sharing only its results.
