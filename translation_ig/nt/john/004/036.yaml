id: JHN.4.36
reference: John 4:36
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸀ὁ θερίζων μισθὸν λαμβάνει καὶ συνάγει καρπὸν εἰς ζωὴν αἰώνιον, ⸀ἵνα ὁ σπείρων ὁμοῦ χαίρῃ καὶ ὁ θερίζων.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/036.yaml
  text: The one who reaps is receiving wages and gathering fruit for eternal life[b][a], so that the one who sows and the one who reaps may rejoice together.
translation:
  language: ig
  text: Onye na-ewe ihe ubi na-anata ụgwọ ọrụ[a] na na-achịkọta mkpụrụ maka ndụ ebighị ebi[b], ka onye na-akụ mkpụrụ na onye na-ewe ihe ubi wee ṅụrịa ọṅụ ọnụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ụgwọ.” Okwu Grik ahụ nwere ike ịpụta ụgwọ a na-akwụ onye rụrụ ọrụ ma ọ bụ nkwụghachi.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ruo ná ndụ ebighị ebi.” Nkebi okwu ahụ nwere ike igosi nzube ma ọ bụ ihe omume ahụ na-arụpụta.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ θερίζων
  choice: onye na-ewe ihe ubi
  rationale: Nkebi okwu a na-arụ ọrụ dị ka aha ma na-egosi onye na-arụ ọrụ ahụ ugbu a; ntụgharị a bụ Igbo nkịtị ma debe ihe atụ owuwe ihe ubi.
- source_word: μισθὸν
  choice: ụgwọ ọrụ
  rationale: Okwu Grik a pụrụ ịpụta ụgwọ a na-akwụ onye rụrụ ọrụ ma ọ bụ ụgwọ nkwụghachi; “ụgwọ ọrụ” na-edobe ihe atụ onye ọrụ ugbo.
- source_word: λαμβάνει
  choice: na-anata
  rationale: Ụdị ugbu a na-egosi omume na-aga n’ihu ma ọ bụ nke na-eme ugbu a.
- source_word: συνάγει καρπὸν
  choice: na-achịkọtakwa mkpụrụ
  rationale: “Na-achịkọta” na-egosi ịchịkọta ihe owuwe ihe ubi, ebe “mkpụrụ” na-edobe ịdị obosara nke ihe atụ καρπός.
- source_word: εἰς ζωὴν αἰώνιον
  choice: maka ndụ ebighị ebi
  rationale: “Maka” na-ekwe ka nkebi okwu ahụ gosi ebe omume ahụ na-aga ma ọ bụ ihe ọ na-arụpụta, n’ebughị ụzọ kpebie naanị otu n’ime ha.
- source_word: ἵνα
  choice: ka ... wee
  rationale: Usoro Igbo a na-egosi nzube ma ọ bụ ihe si na ya pụta, dịka njikọ Grik si kwe omume n’ebe a.
- source_word: ὁ σπείρων
  choice: onye kụrụ mkpụrụ
  rationale: Nke a na-edobe ọdịiche na myirịta dị n’etiti onye na-agha mkpụrụ na onye na-ewe ihe ubi; oge gara aga na-ada nke ọma n’Igbo maka ọrụ ịgha mkpụrụ nke buru owuwe ụzọ.
- source_word: ὁμοῦ χαίρῃ
  choice: ṅụrịa ọṅụ ọnụ
  rationale: Nkebi okwu a na-egosi ọṅụ ha abụọ na-ekerịta ọnụ n’asụsụ Igbo dị ndụ ma dị ùgwù.
theological_decisions:
- issue: Ma a ga-etinye okwu pụtara ‘ugbua/amaala’ n’isi amaokwu ahụ
  choice: E tinyeghị ya
  alternative: Ịmalite site na “Ugbu a” ma ọ bụ “Amaala”
  rationale: Enweghị adverb pụrụ iche nke pụtara “ugbua” n’ahịrị Grik a. Oge ugbu a nke ngwaa na-egosi na omume ahụ na-eme, ya mere ọ dịghị mkpa ịgbakwunye okwu na-adịghị n’ederede.
- issue: Ihe εἰς ζωὴν αἰώνιον na-egosi
  choice: “maka ndụ ebighị ebi,” nke na-ahapụ ohere maka nzube ma ọ bụ nsonaazụ
  alternative: “banye ná ndụ ebighị ebi,” nke ga-eme ka ntụziaka/nsonaazụ pụta ìhè karịa
  rationale: εἰς nwere ike igosi ebe ihe na-aga, nzube, ma ọ bụ nsonaazụ. A ghaghị idebe obere nghọta abụọ a kama ikpebi otu n’enweghị mkpa.
translation_notes:
  register: Standard Igbo dị ugbu a, dị mfe nghọta ma dị ùgwù. E debere ihe atụ ọrụ ugbo na myirịta dị n’etiti onye kụrụ mkpụrụ na onye na-ewe ihe ubi; a zere okwu ụka nke otu òtù pụrụ iche.
