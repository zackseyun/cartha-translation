review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders the main clauses, including the present-tense actions, wages, gathered fruit, eternal life, and shared joy. However, “onye kụrụ mkpụrụ” changes the articular present participle ὁ σπείρων (“the one who sows”) to a past action. The source retains present participles in parallel for both sower and reaper.
  naturalness: The wording is generally clear, modern Standard Igbo, and appropriately dignified. “Onye na-akụ mkpụrụ” is both natural and more closely parallel to “onye na-ewe ihe ubi.”
  terminology: “Ụgwọ ọrụ,” “mkpụrụ,” “ndụ ebighị ebi,” and “ṅụrịa ọṅụ ọnụ” are suitable and do not impose a denominational interpretation. The lexical note’s alternative is more idiomatic as “ụgwọ” than “ụgwọ nkwụghachi.”
  issues:
  - severity: medium
    issue: Past-tense rendering of ὁ σπείρων
    rationale: “Onye kụrụ mkpụrụ” means “the one who planted/sowed,” whereas ὁ σπείρων is a present participle, coordinated directly with ὁ θερίζων. “Onye na-akụ mkpụrụ” preserves the source construction and rhetorical parallelism.
  - severity: low
    issue: Footnote a’s alternative expression is awkward
    rationale: “Ụgwọ nkwụghachi” is less natural in this context and may sound redundant. “Ụgwọ” is a straightforward alternative that can cover recompense/reward without altering the verse’s sense.
  revised_text: Onye na-ewe ihe ubi na-anata ụgwọ ọrụ[a] na na-achịkọta mkpụrụ maka ndụ ebighị ebi[b], ka onye na-akụ mkpụrụ na onye na-ewe ihe ubi wee ṅụrịa ọṅụ ọnụ.
  revised_footnotes:
