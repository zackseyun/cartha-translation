  yaml_path: translation/nt/john/004/019.yaml
  text: The woman said to him[a], “Lord, I see that you are a prophet.”
translation:
  language: ig
  text: Nwanyị ahụ sịrị ya, “Onyenwe m[a], ahụrụ m na ị bụ onye amụma.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Nna ukwu.” Okwu Grik bụ κύριε nwere ike ịbụ okwu nkwanye ùgwù e ji akpọ mmadụ, ọ nwekwara ike ịpụta “Onyenwe m.”
    reason: alternative_reading
lexical_decisions:
- source_word: λέγει
  choice: sịrị
  rationale: Ọ bụ ezie na Grik ji ngwaa oge ugbu a n’akụkọ a, oge gara aga bụ ụzọ Igbo nke oge a si akọ ihe mere n’ụzọ dị ire ma na-aga were were.
- source_word: αὐτῷ
  choice: ya
  rationale: Nnọchiaha a na-egosi onye nwanyị ahụ gwara okwu; ‘sịrị ya’ bụ usoro okwu Igbo nkịtị.
- source_word: ἡ γυνή
  choice: Nwanyị ahụ
  rationale: N’ebe a ọ na-ezo aka n’otu nwanyị Sameria ahụ a kpọtụrụla aha, ọ bụghị nwunye.
- source_word: Κύριε
  choice: Onyenwe m
  rationale: Nke a na-edobe echiche bụ́ ‘Lord’ ma na-arụkwa ọrụ dị ka okwu nkwanye ùgwù e ji akpọ mmadụ. E debere nghọta ọzọ, ‘Nna ukwu,’ n’okpuru peeji.
- source_word: θεωρῶ
  choice: ahụrụ m
  rationale: N’ebe a ngwaa ahụ pụtara ịghọta ma ọ bụ ịmata ihe site n’ihe Jizọs kpughere; ‘ahụrụ m’ na-edobe ihe oyiyi nke ịhụ ma bụrụkwa Igbo dị mfe.
- source_word: ὅτι
  choice: na
  rationale: ‘Na’ na-ewebata ihe nwanyị ahụ ghọtara n’ụzọ nkịtị n’Igbo.
- source_word: προφήτης
  choice: onye amụma
  rationale: Enweghị edemede na nkebi aha a, ihe ọ pụtara ebe a bụ na nwanyị ahụ matara ya dị ka onye amụma, ọ bụghị kpọmkwem ‘Onye Amụma ahụ.’
- source_word: σύ
  choice: ị
  rationale: Nnọchiaha Grik ahụ nwere nkwusi ike, ma n’Igbo ‘ị bụ’ na-ekwupụta onye a na-ekwu maka ya nke ọma n’enweghị itinye nkwusi ike a na-achọghị.
theological_decisions:
- issue: Otú e si sụgharịa κύριος mgbe nwanyị ahụ kpọrọ Jizọs okwu
  choice: Onyenwe m
  alternative: Nna ukwu
  rationale: Ihe gbara amaokwu a gburugburu nwere ike igosi naanị nkwanye ùgwù, ọ bụghị na nwanyị ahụ ekwupụtala okwukwe zuru ezu banyere onye Jizọs bụ. Ya mere, e debere ‘Onyenwe m’ n’ederede, ma kọwaa ‘Nna ukwu’ n’okpuru peeji ka mgbagwoju anya dị n’okwu Grik ghara ịla n’iyi.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị mfe ma nwee ugwu. ‘Sịrị ya’ na-eme ka akụkọ ahụ na-aga nke ọma, ebe ‘Onyenwe m’ na nkọwa [a] na-edobe nghọta abụọ dị na κύριε.
