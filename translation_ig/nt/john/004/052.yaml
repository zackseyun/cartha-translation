  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐπύθετο οὖν ⸂τὴν ὥραν παρ’ αὐτῶν⸃ ἐν ᾗ κομψότερον ἔσχεν· ⸂εἶπαν οὖν⸃ αὐτῷ ὅτι ⸀Ἐχθὲς ὥραν ἑβδόμην ἀφῆκεν αὐτὸν ὁ πυρετός.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/052.yaml
  text: So he asked them the hour in which he got better. Then they said to him[a], “Yesterday at the seventh hour the fever left him.”
translation:
  language: ig
  text: Ya mere, ọ jụrụ ha oge ahụ ọ malitere ịdịkwu mma. Ha wee sị ya, “Ụnyaahụ, n’awa nke asaa[a], ahụ ọkụ ahụ hapụrụ ya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’ihe dịka elekere otu nke ehihie,” ma ọ bụrụ na a na-agụ awa site n’ọwụwa anyanwụ; ụfọdụ na-aghọta na Jọn ji usoro ọzọ agụ oge.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπύθετο
  choice: ọ jụrụ ha
  rationale: Ngwaa a pụtara ịjụ ma ọ bụ ịmata ihe site n’ịjụ ajụjụ; ‘ọ jụrụ ha’ bụ okwu Igbo doro anya ma kwekọọ n’ọnọdụ ahụ.
- source_word: οὖν
  choice: Ya mere
  rationale: Ọ na-egosi njikọ sitere n’ihe mere n’amaokwu bu ụzọ, ọ bụghị naanị usoro akụkọ.
- source_word: τὴν ὥραν παρ’ αὐτῶν
  choice: ọ jụrụ ha oge ahụ
  rationale: N’Igbo, itinye ndị a jụrụ ozugbo n’azụ ngwaa bụ ụzọ eke e si kwuo παρά nwere nghọta nke isi mmalite; ‘oge ahụ’ na-eburu echiche nke otu oge a kapịrị ọnụ.
- source_word: ἐν ᾗ κομψότερον ἔσχεν
  choice: ọ malitere ịdịkwu mma
  rationale: Akpaokwu Grik a na-ekwu maka mgbanwe n’ahụ ike gaa n’ịdị mma; ‘malitere ịdịkwu mma’ na-egosi mmalite nke mgbake ahụ n’ụzọ Igbo dị eke.
- source_word: εἶπαν οὖν αὐτῷ
  choice: Ha wee sị ya
  rationale: ‘Wee’ na-egosi nzaghachi na usoro akụkọ nke οὖν n’ebe a.
- source_word: Ἐχθὲς
  choice: Ụnyaahụ
  rationale: Nke a bụ ntụgharị kpọmkwem nke okwu na-egosi ụbọchị gara aga.
- source_word: ὥραν ἑβδόμην
  choice: n’oge awa nke asaa
  rationale: E debere usoro ịgụ awa dị n’akwụkwọ mbụ kama ịgbanwe ya ka ọ bụrụ oge elekere nke oge a, n’ihi na usoro oge e ji mee ihe edoghị anya.
- source_word: ἀφῆκεν αὐτὸν ὁ πυρετός
  choice: ahụ ọkụ ahụ hapụrụ ya
  rationale: Nke a na-edobe ahụ ọkụ dịka isiokwu nke ahịrịokwu Grik ma bụrụkwa ụzọ Igbo doro anya e si akọ na ọrịa ahụ kwụsịrị.
theological_decisions:
- issue: Usoro ịgụ ‘awa nke asaa’
  choice: E debere ‘awa nke asaa’ n’ahịrịokwu bụ isi.
  alternative: Ihe dịka elekere otu nke ehihie ma ọ bụrụ na a gụọ awa site n’ọwụwa anyanwụ; ụfọdụ na-ewere ya dị ka oge ọzọ n’ihi usoro ịgụ oge dị iche.
  rationale: Amaokwu ahụ ekwughị usoro oge e ji agụ awa. Ịhapụ okwu ahụ dịka ọ dị na-echekwa nghọtahie ziri ezi dị n’ihe odide kama idozi ya n’enweghị ihe akaebe zuru ezu.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị ùgwù ma dị mfe nghọta. E ji ‘ahụ ọkụ’ maka fever, ‘wee’ maka usoro nzaghachi n’akụkọ, ma debe ‘awa nke asaa’ iji ghara ikpochapụ mgbagwoju anya nke usoro oge.
