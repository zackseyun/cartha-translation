  naturalness: 'The wording is generally clear and suitably formal in Standard Igbo. However, “n’oge awa nke asaa” is not idiomatic: oge and awa overlap in this construction. “N’awa nke asaa” is the natural, precise expression.'
  terminology: “ahụ ọkụ” suitably renders “fever,” and “hapụrụ ya” naturally retains the fever as the grammatical subject. “Ọ malitere ịdịkwu mma” adequately conveys the onset of improvement. The seventh-hour wording is retained without imposing a disputed chronology.
