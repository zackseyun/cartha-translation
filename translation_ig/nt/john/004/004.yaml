    text: A pụkwara ịsụ ya, “Ọ ghaghị ịgafe n’ala Sameria.” Asụsụ Grik na-egosi mkpa, ma ọ naghị akọwa kpọmkwem ihe kpatara mkpa ahụ.
    reason: lexical_alternative
