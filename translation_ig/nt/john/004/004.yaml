  text: ἔδει δὲ αὐτὸν διέρχεσθαι διὰ τῆς Σαμαρείας.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/004.yaml
  text: He had to pass through Samaria[a].
translation:
  language: ig
  text: Ọ dị mkpa ka ọ gafee n’ala Sameria[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “Ọ ghaghị ịgafe n’ala Sameria.” Asụsụ Grik na-egosi mkpa, ma ọ naghị akọwa kpọmkwem ihe kpatara mkpa ahụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔδει
  choice: Ọ dị mkpa
  rationale: Ụdị ngwaa a na-egosi mkpa dị n’akụkọ gara aga. Okwu Igbo a na-egosipụta mkpa ahụ nke ọma, ma ọ naghị ekpebi ihe kpatara mkpa ahụ.
- source_word: δὲ
  choice: —
  rationale: N’ebe a, δέ bụ obere njikọ na-eme ka akụkọ gaa n’ihu, ọ bụghị nnukwu ọdịiche. Ịhapụ ya n’enweghị okwu pụrụ iche bụ Igbo eke, ma ọ naghị etinye okwu oge dịka ‘ugbu a’ nke adịghị na Grik.
- source_word: αὐτὸν
  choice: o
  rationale: Ọ bụ ezie na αὐτόν nọ n’ọnọdụ accusative dịka isiokwu infinitive n’asụsụ Grik, Igbo eke na-eji ahịrịokwu nwere ngwaa zuru ezu na nnọchiaha isiokwu ‘o.’
- source_word: διέρχεσθαι
  choice: si ... gafee
  rationale: Ngwakọta okwu a na-egosi ịga site n’ime ógbè ma gafee ya; ‘si ... gafee’ bụ okwu Igbo doro anya ma dị eke.
- source_word: διὰ τῆς Σαμαρείας
  choice: si n’ala Sameria
  rationale: διά tinyere genitive na-egosi ije site n’otu ebe. Ịtinye ‘ala’ na-eme ka o doo anya na Sameria bụ ógbè ebe a, ọ bụghị naanị obodo.
theological_decisions:
- issue: Ụdị mkpa dị na ἔδει
  choice: E gosipụtara ya dịka ezigbo mkpa, n’akọwaghị kpọmkwem ihe kpatara ya.
  alternative: Ịkọwa ya naanị dịka ụzọ ala kacha mma, ma ọ bụ dịka mkpa sitere kpọmkwem n’uche Chineke.
  rationale: Grik kwuru na ọ dị mkpa, ma amaokwu a n’onwe ya akọwaghị ma mkpa ahụ ọ bụ nke ụzọ njem, nke ọnọdụ mmadụ, ma ọ bụ nke nzube Chineke. Nsụgharị ahụ na-ahapụ esemokwu a ka ọ dị.
translation_notes:
  register: Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E jiri ‘ala Sameria’ mee ka ihe gbasara ógbè pụta ìhè, ma zere ịkọwa isi mmalite nke mkpa ahụ.
