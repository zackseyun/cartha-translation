review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents ἔδει as necessity and does not specify its basis. It also correctly treats Samaria as the region traversed. However, the word order in “si n’ala Sameria gafee” can suggest movement from Samaria rather than movement through it.
  naturalness: “Ọ dị mkpa ka ọ gafee n’ala Sameria” is more idiomatic and unambiguously expresses passing through the region in Standard Igbo.
  terminology: “Sameria” and “ala Sameria” are appropriate. “Ọ dị mkpa” suitably preserves the unelaborated necessity of ἔδει without imposing an interpretation.
  issues:
  - severity: medium
    issue: The phrase “si n’ala Sameria gafee” is potentially directional-ambiguous.
    rationale: With “si,” the phrase may be heard as ‘pass from/out of the land of Samaria,’ whereas διὰ τῆς Σαμαρείας means movement through Samaria. Placing the regional phrase after “gafee” avoids this ambiguity.
  revised_text: Ọ dị mkpa ka ọ gafee n’ala Sameria[a].
  revised_footnotes:
