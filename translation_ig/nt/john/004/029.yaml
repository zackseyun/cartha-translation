id: JHN.4.29
reference: John 4:29
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Δεῦτε ἴδετε ἄνθρωπον ὃς εἶπέ μοι πάντα ⸀ὅσα ἐποίησα· μήτι οὗτός ἐστιν ὁ χριστός;
base_translation:
  language: en
  yaml_path: translation/nt/john/004/029.yaml
  text: Come[a], see a man who told me everything I have done. Could this be the Messiah?
translation:
  language: ig
  text: “Bịanụ, leenụ otu nwoke gwara m ihe niile m mere. Ọ̀ ga-abụ na onye a bụ Mezaya ahụ?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ịsụgharị ya: “Onye a ọ̀ bụ Mezaya ahụ?”'
    reason: Ụdị ọzọ e si egosipụta ajụjụ μήτι nke nwere obi abụọ.
lexical_decisions:
- source_word: Δεῦτε
  choice: Bịanụ
  rationale: Ọ bụ ọkpụkpọ a na-akpọ ọtụtụ mmadụ ka ha bịa; ụdị ọtụtụ mmadụ a na-egosi n'okwu Igbo ahụ na-edobe ike nke ọkpụkpọ ahụ.
- source_word: ἴδετε
  choice: leenụ
  rationale: Ọ bụ iwu e nyere ọtụtụ mmadụ ka ha hụ onye ahụ; ya na “Bịanụ” jikọtara nke ọma n'Igbo dị ka òkù kpọmkwem.
- source_word: ἄνθρωπον
  choice: otu nwoke
  rationale: Aha Grik ahụ nọ n'ọnụọgụ otu ma na-ezo aka n nwoke; “otu nwoke” bụ ụzọ doro anya ma dịkwa eke isi webata ya n'Igbo.
- source_word: ὃς εἶπέ μοι
  choice: gwara m
  rationale: N'ọnọdụ a, λέγω ya na onye a gwara ihe pụtara n'ụzọ eke “gwara m,” ọ bụghị naanị “sịrị m.”
- source_word: πάντα ὅσα
  choice: ihe niile
  rationale: Nke a na-edobe echiche zuru ezu nke ngwakọta okwu Grik ahụ n'Igbo dị mfe nghọta.
- source_word: ἐποίησα
  choice: m mere
  rationale: Oge gara aga dị mfe n'Igbo na-egosi omume ndị nwanyị ahụ mere n'oge gara aga n'ụzọ eke, na-enweghị itinye nkọwa oge ọzọ na-adịghị na isi mmalite.
- source_word: μήτι
  choice: Ọ̀ ga-abụ na
  rationale: Ajụjụ a na-egosi obi abụọ ma na-akpọ ndị na-ege ntị ka ha tụlee ihe ahụ; ọ naghị eme ya nkwupụta siri ike.
- source_word: ὁ χριστός
  choice: Mezaya ahụ
  rationale: Χριστός na-arụ ọrụ dị ka utu aha Mesaya a tụrụ anya ya n'ọnọdụ ndị Juu, ya mere a sụgharịrị utu aha ahụ kama idegharị ya naanị dịka aha.
theological_decisions:
- issue: Nsụgharị Χριστός dịka utu aha
  choice: Mezaya ahụ
  alternative: Kraịst ahụ
  rationale: N'ebe a, okwu ahụ bụ utu aha nke onye Chineke tere mmanụ a tụrụ anya ya, ọ bụghị aha onwe onye. “Mezaya” na-eme ka ọnọdụ ndị Juu na ọrụ utu aha ahụ doo anya.
- issue: Ike ajụjụ μήτι
  choice: Ọ̀ ga-abụ na onye a bụ Mezaya ahụ?
  alternative: Onye a ọ̀ bụ Mezaya ahụ?
  rationale: A họọrọ ụdị na-egosi obi abụọ na ntụnye maka ntụle, n'ihi na μήτι nwere ike ịtụ anya azịza na-adịghị mma ma n'ọnọdụ a nwanyị ahụ na-akpali ndị mmadụ ka ha nyochaa ya; e kwesịghị ime ka okwu ya bụrụ nkwupụta doro anya karịa Grik.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe ma dị ùgwù. Ụdị ọtụtụ mmadụ dị na “Bịanụ, leenụ” na-edobe ntụaka nke ngwaa Grik abụọ ahụ; ajụjụ ikpeazụ na-ahapụ obi abụọ dị n'isi mmalite ka ọ dị.
