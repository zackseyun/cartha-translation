  variant: Standard Igbo
source:
  edition: SBLGNT
  text: μὴ σὺ μείζων εἶ τοῦ πατρὸς ἡμῶν Ἰακώβ, ὃς ἔδωκεν ἡμῖν τὸ φρέαρ καὶ αὐτὸς ἐξ αὐτοῦ ἔπιεν καὶ οἱ υἱοὶ αὐτοῦ καὶ τὰ θρέμματα αὐτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/john/004/012.yaml
  text: Are you greater than our father Jacob[a], who gave us the well and drank from it himself, as did his sons and his livestock?
translation:
  language: ig
  text: Ị̀ ka nna anyị Jekọb ukwuu[a]? Ọ bụ ya nyere anyị olulu mmiri a; ya onwe ya ṅụrụ mmiri si na ya, ụmụ ya ndị nwoke na anụ ụlọ ya ṅụkwara mmiri si na ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ, n’ụzọ na-eme ka ihe ọ tụrụ anya ya pụta ìhè karị: “Ọ̀ bụghị na ị kaghị nna anyị Jekọb ukwuu?” Ajụjụ Grik e ji μή malite na-atụ anya azịza “mba.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ σὺ
  choice: Ị̀ ka ...?
  rationale: Ajụjụ a dị n’ụdị okwu a na-atụ anya ka azịza ya bụrụ mba. N’Igbo, ajụjụ mkparị a dị nkenke na-eburu ụda ahụ nke ọma; nkọwa ala peeji na-eme ka atụmanya azịza ọjọọ ahụ pụta ìhè.
- source_word: μείζων
  choice: ka ... ukwuu
  rationale: N'ebe a, okwu ahụ na-ekwu banyere ịdị ukwuu ma ọ bụ ọkwa, ọ bụghị ibu ahụ; ‘ka ... ukwuu’ bụ ntụnyere Igbo kwesịrị ekwesị.
- source_word: τοῦ πατρὸς ἡμῶν Ἰακώβ
  choice: nna anyị Jekọb
  rationale: Nke a na-edowe asụsụ ezinụlọ nke na-asọpụrụ Jekọb dị ka nna nna nke ndị ahụ, n’enweghị itinye nkọwa ọzọ n’ime amaokwu ahụ.
- source_word: ἔδωκεν ἡμῖν
  choice: nyere anyị
  rationale: Oge gara aga dị mfe dabara na aorist ahụ ma bụrụkwa Igbo a na-asụ nke ọma.
- source_word: τὸ φρέαρ
  choice: olulu mmiri a
  rationale: φρέαρ bụ olulu mmiri, ọ bụghị isi iyi; ‘a’ na-egosi olulu mmiri ahụ ha nọ n’akụkụ ya n’akụkọ a.
- source_word: καὶ αὐτὸς
  choice: ya onwe ya
  rationale: Nke a na-echekwa nkwusi ike dị na αὐτός.
- source_word: ἐξ αὐτοῦ
  choice: si na ya
  rationale: Nke a bụ ụzọ Igbo ebumpụta ụwa si kwuo na e si n’olulu mmiri ahụ ṅụọ mmiri.
- source_word: ἔπιεν
  choice: ṅụrụ mmiri
  rationale: Oge gara aga dị mfe na-egosi ihe mere eme nke Jekọb n'ụzọ doro anya ma bụrụkwa okwu Igbo zuru oke.
- source_word: οἱ υἱοὶ αὐτοῦ
  choice: ụmụ ya ndị nwoke
  rationale: Nke a na-echekwa nkọwa nwoke dị na υἱοί kama ime ya ka ọ bụrụ naanị ‘ụmụ ya.’
- source_word: τὰ θρέμματα αὐτοῦ
  choice: anụ ụlọ ya
  rationale: ‘Anụ ụlọ’ gụnyere anụ ndị a na-azụ n’ozuzu ya, n’enweghị ime ka okwu ahụ bụrụ naanị ehi.
theological_decisions:
- issue: Ike ajụjụ nke μή webatara
  choice: Ajụjụ mkparị na-atụ anya azịza ‘mba’
  alternative: ‘N’ezie, ị kaghị nna anyị Jekọb ukwuu, ka ị̀ ka?’
  rationale: μή na-egosi na nwanyị ahụ tụrụ anya na onye ọ na-agwa agaghị aka Jekọb ukwuu. E debere ya dị ka ajụjụ iji chekwaa ụda ịma aka na esemokwu dị n’okwu ahụ, ebe nkọwa ala peeji na-akọwa atụmanya ya.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe ma dị ùgwù mee ihe. A hapụrụ ajụjụ ahụ ka ọ bụrụ nke na-ama onye a na-agwa aka, ma e zere ịkọwa echiche okpukpe karịrị ihe odide Grik kwuru.
