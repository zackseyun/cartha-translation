  text: λέγει αὐτῷ ὁ Ἰησοῦς· Πορεύου· ὁ υἱός σου ζῇ. ⸀ἐπίστευσεν ὁ ἄνθρωπος τῷ λόγῳ ⸀ὃν εἶπεν αὐτῷ ὁ Ἰησοῦς καὶ ἐπορεύετο.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/050.yaml
  text: Jesus said to him[a], “Go; your son lives.” The man believed the word that Jesus spoke to him and went on his way.
translation:
  language: ig
  text: Jizọs sịrị ya, “Gaa; nwa gị nwoke dị ndụ.” Nwoke ahụ kwere[a] okwu ahụ Jizọs gwara ya, wee gawa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “tụkwasịrị okwu ahụ Jizọs gwara ya obi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Πορεύου
  choice: Laa
  rationale: Ọ bụ iwu dị nkenke ka nwoke ahụ pụọ ma laghachi; “Laa” bụ okwu Igbo nkịtị, doro anya, nke kwekọrọ n'ọsọ akụkọ ahụ.
- source_word: ὁ υἱός σου
  choice: nwa gị nwoke
  rationale: υἱός pụtara nwa nwoke kpọmkwem, ya mere nsụgharị a echekwala okike e gosiri n'asụsụ mbụ kama iji naanị “nwa” mee ya izugbe.
- source_word: ζῇ
  choice: dị ndụ
  rationale: Okwu a dị n'oge ugbu a, ọ pụtakwara na nwa ahụ ka dị ndụ ma ọ bụ na ahụ adịla ya mma; “dị ndụ” echekwala nkwupụta ahụ n'enweghị ime ya nkwa banyere ọdịnihu.
- source_word: ἐπίστευσεν
  choice: kwere
  rationale: N'ebe a πιστεύω pụtara ikwere ma ọ bụ ịtụkwasị okwu e kwuru obi. “Kwere” bụ okwu Igbo kachasị mfe ma na-echekwa nghọta bụ isi, ebe e tinyere ụzọ ọzọ n'okpuru ala peeji.
- source_word: ὁ ἄνθρωπος
  choice: Nwoke ahụ
  rationale: Amaokwu a kpọrọ ya ἄνθρωπος, “nwoke ahụ,” ọ bụghị aha ọkwa ya e kwuru n'akụkụ akụkọ ndị ọzọ.
- source_word: τῷ λόγῳ
  choice: okwu ahụ
  rationale: λόγος n'ebe a bụ ihe Jizọs kwuru; nkebi okwu na-esochi ya na-eme ka ihe “okwu ahụ” bụ doo anya.
- source_word: ὃν εἶπεν αὐτῷ ὁ Ἰησοῦς
  choice: Jizọs gwara ya
  rationale: Nke a bụ ụzọ Igbo dị mma isi gosi na ọ bụ okwu ahụ Jizọs gwara nwoke ahụ, n'enweghị nkwughachi na-adịghị mkpa.
- source_word: ἐπορεύετο
  choice: wee gawa
  rationale: Imperfect a na-egosi na nwoke ahụ malitere ma gaa n'ihu n'ụzọ ya mgbe o kwere okwu ahụ. “Wee gawa” na-egosipụta mmegharị akụkọ ahụ n'ụzọ Igbo eke n'ebughị ibu nkọwa karịa isi mmalite.
theological_decisions:
- issue: Nsụgharị πιστεύω mgbe nwoke ahụ zara nkwa Jizọs kwuru
  choice: kwere
  alternative: tụkwasịrị okwu ahụ Jizọs gwara ya obi
  rationale: “Kwere” na-egosi nzaghachi nwoke ahụ nye okwu Jizọs ma ọ naghị ekpebi ma okwukwe a ọ bụ okwukwe nzọpụta zuru ezu ma ọ bụ naanị ntụkwasị obi n'ihe e kwuru. Ya mere, a hapụrụ esemokwu dị n'akụkọ Jọn ka ọ dị.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị mfe ma dị ùgwù. Ahịrịokwu ahụ dị nkenke dịka isi mmalite Grik, a zerekwa okwu ụka pụrụ iche ma ọ bụ ịkọwapụta okwukwe nwoke ahụ karịa ihe amaokwu ahụ kwuru.
