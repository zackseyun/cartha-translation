review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the son, his being alive, the man's believing Jesus' spoken word, and his subsequent departure. However, “Laa” specifically suggests returning home; Πορεύου is the broader command “Go” and does not itself specify return.
  naturalness: The Igbo is clear, modern, and appropriately concise. “Kwere okwu ahụ Jizọs gwara ya” is natural in this context, and “wee gawa” suitably carries the narrative continuation.
  terminology: “Nwa gị nwoke,” “dị ndụ,” “kwere,” and “okwu ahụ” faithfully and naturally convey the relevant Greek expressions. The lexical-alternative footnote is appropriate and does not add theological interpretation.
  issues:
  - severity: low
    issue: “Laa” is somewhat more specific than Πορεύου.
    rationale: In Standard Igbo, “laa” normally means ‘go back/return home,’ whereas the Greek imperative simply directs the man to go. “Gaa” preserves the source's breadth while remaining idiomatic.
  revised_text: Jizọs sịrị ya, “Gaa; nwa gị nwoke dị ndụ.” Nwoke ahụ kwere[a] okwu ahụ Jizọs gwara ya, wee gawa.
