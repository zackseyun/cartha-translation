- from: Jizọs sịrị ya, “Laa; nwa gị nwoke dị ndụ.” Nwoke ahụ kwere[a] okwu ahụ Jizọs gwara ya, wee gawa.
  to: Jizọs sịrị ya, “Gaa; nwa gị nwoke dị ndụ.” Nwoke ahụ kwere[a] okwu ahụ Jizọs gwara ya, wee gawa.
  rationale: Only the imperative has been adjusted from “Laa” to “Gaa” so that the translation does not make explicit the return-home sense that is contextual but not stated by Πορεύου. The rest of the draft faithfully preserves the Greek wording and its theological restraint.
