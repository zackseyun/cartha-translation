id: JHN.4.34
reference: John 4:34
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: λέγει αὐτοῖς ὁ Ἰησοῦς· Ἐμὸν βρῶμά ἐστιν ἵνα ⸀ποιήσω τὸ θέλημα τοῦ πέμψαντός με καὶ τελειώσω αὐτοῦ τὸ ἔργον.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/034.yaml
  text: Jesus said to them[b][a], “My food is to do the will of him who sent me and to complete his work.”
translation:
  language: ig
  text: Jizọs sịrị ha, “Nri m bụ ime uche onye zitere m[b] na ịrụzu ọrụ ya[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ịrụcha ọrụ ya.”
    reason: lexical_alternative
  - marker: b
    text: N’ebe a, “onye zitere m” na-ezo aka na Nna, dịka ihe gbara amaokwu a gburugburu na-egosi; ma Grik akpọghị aha “Nna” kpọmkwem n’ebe a.
    reason: cross_reference
lexical_decisions:
- source_word: βρῶμά
  choice: Nri
  rationale: “Nri” bụ okwu Igbo nkịtị maka ihe oriri; ọ na-edobekwa ihe atụ Jizọs ji mee ihe n’ọnọdụ ndị na-eso ụzọ ya nọ na-ekwu maka iri nri nkịtị.
- source_word: Ἐμὸν βρῶμά ἐστιν
  choice: Nri m bụ
  rationale: Nsụgharị a na-edobe ihe atụ doro anya nke Grik ma na-ada nke ọma n’Igbo.
- source_word: ἵνα ποιήσω
  choice: bụ ime
  rationale: “Bụ ime” na-egosi ihe nri ahụ pụtara n’ụzọ Igbo si ekwu okwu, na-enweghị ịgbakwụnye nkọwa na-adịghị na Grik.
- source_word: τὸ θέλημα
  choice: uche
  rationale: “Uche” n’ahịrịokwu “ime uche onye” bụ ụzọ Igbo doro anya na nke a na-ahụkarị isi kwuo ọchịchọ ma ọ bụ nzube onye.
- source_word: τοῦ πέμψαντός με
  choice: onye zitere m
  rationale: Nke a na-asụgharị participle nwere article dị ka onye a kpọtụrụ aha n’enweghị ịgbakwụnye aha “Nna,” nke adịghị n’amaokwu Grik a.
- source_word: τελειώσω
  choice: ịrụzu
  rationale: “Ịrụzu” na-egosi ime ka ọrụ ruo n’isi ma ọ bụ n’ókè e bu n’obi, ọ bụghị naanị ịkwụsị ya.
- source_word: ἔργον
  choice: ọrụ
  rationale: “Ọrụ” bụ okwu Igbo kachasị dabara adaba maka ἔργον n’ebe a, ya bụ ọrụ e nyere Jizọs ka ọ rụọ.
- source_word: λέγει αὐτοῖς ὁ Ἰησοῦς
  choice: Jizọs sịrị ha
  rationale: Ọ bụ ezie na Grik ji present akụkọ ihe mere eme, oge gara aga bụ ụzọ okike e si akọ akụkọ a n’Igbo.
theological_decisions:
- issue: Onye “onye zitere m” na-ezo aka na ya
  choice: E debere ya dịka “onye zitere m.”
  alternative: “Nna onye zitere m” ma ọ bụ “Nna m onye zitere m.”
  rationale: Ihe gbara amaokwu ahụ gburugburu na-egosi na ọ na-ezo aka n’ebe Nna ahụ nọ, ma Grik akpọghị aha “Nna” kpọmkwem n’ebe a. Ya mere, nsụgharị ahụ anaghị akọwapụta ihe odide ahụ karịa ka isi mmalite si kwuo.
translation_notes:
  register: Ejiri Standard Igbo dị ugbu a, nke dị mfe nghọta ma dịkwa ùgwù. E debere ihe atụ “Nri m” na ntụaka na-akpọghị Nna aha kpọmkwem, iji nọgide nso n’ihe odide Grik ma zere ịkọwa ya karịa ka o kwuru.
