  naturalness: The revised wording is clear, modern Standard Igbo, and retains the natural expressions “akpịrị ghara ịkpọ m” and “ịbịa ebe a isere mmiri.”
  terminology: 'Use “Onyenwe m” for the main-text rendering of Κύριε: it preserves the project’s “Lord” rendering without the unwarranted plural possessive. The footnote should give the idiomatic respectful-address alternative “Nna m ukwu,” not “Nna anyị ukwu.”'
