id: JHN.4.15
reference: John 4:15
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: λέγει πρὸς αὐτὸν ἡ γυνή· Κύριε, δός μοι τοῦτο τὸ ὕδωρ, ἵνα μὴ διψῶ μηδὲ ⸀διέρχωμαι ἐνθάδε ἀντλεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/015.yaml
  text: The woman said to him[a], “Lord, give me this water, so that I may not be thirsty or come here to draw.”
translation:
  language: ig
  text: Nwanyị ahụ sịrị ya, “Onyenwe m[a], nye m mmiri a, ka akpịrị ghara ịkpọ m, ka m gharakwa ịbịa ebe a isere mmiri.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Nna m ukwu, nye m mmiri a …”
    reason: Κύριε nwere ike ịbụ okwu nkwanye ùgwù a na-agwa nwoke, ọ bụghị nkwupụta doro anya banyere onye ọ bụ.
lexical_decisions:
- source_word: λέγει
  choice: sịrị
  rationale: Ọ bụ ezie na Grik ji oge ugbu a nke akụkọ, ‘sịrị’ bụ ụzọ Igbo si akọ ihe mere n’ụzọ dị mma ma na-echekwa ọrụ okwu ahụ n’akụkọ.
- source_word: γυνή
  choice: Nwanyị ahụ
  rationale: N’ebe a, okwu ahụ na-ezo aka n’ebe nwanyị Sameria ahụ nọ, ọ bụghị nwunye.
- source_word: Κύριε
  choice: Onyenwe anyị
  rationale: Nke a na-echekwa ihe κύριος pụtara n’ụzọ bụ isi nakwa ohere nke nghọta miri emi dị n’Oziọma Jọn; e debere nghọta ya dịka okwu nkwanye ùgwù n’okpuru peeji.
- source_word: δός μοι
  choice: nye m
  rationale: Nke a bụ ntụgharị Igbo doro anya, kpọmkwem, ma bụrụkwa nke a na-asụkarị.
- source_word: τοῦτο τὸ ὕδωρ
  choice: mmiri a
  rationale: Grik kwuru naanị ‘mmiri a’; etinyeghị ‘mmiri dị ndụ’ nke na-apụtaghị n’amaokwu a.
- source_word: ἵνα μὴ διψῶ
  choice: ka akpịrị ghara ịkpọ m
  rationale: Nke a bụ ụzọ Igbo nkịtị si kwuo enweghị akpịrị ịkpọ nkụ, ma na-echekwa ebumnuche nke ἵνα na ọnọdụ subjunctive.
- source_word: μηδὲ διέρχωμαι ἐνθάδε
  choice: ka m gharakwa ịbịa ebe a
  rationale: ‘Gharakwa’ na-egosi njikọ nke ihe ọjọọ nke μηδέ, ebe ‘ịbịa ebe a’ na-enye echiche okwu ahụ n’ọnọdụ a n’ụzọ eke.
- source_word: ἀντλεῖν
  choice: isere mmiri
  rationale: N’Igbo, ngwaa a na-achọkarị ka e kwuo ihe a na-esere; ‘mmiri’ doro anya site n’ọnọdụ ahụ, ya mere nke a bụ ntụgharị eke, ọ bụghị itinye echiche ọhụrụ.
theological_decisions:
- issue: Otu e si sụgharịa κύριος n’okwu nwanyị Sameria
  choice: Onyenwe anyị
  alternative: Nna anyị ukwu
  rationale: Κύριος nwere ike ịbụ aha ‘Onyenwe anyị’ ma ọ bụ okwu nkwanye ùgwù dịka ‘Nna anyị ukwu.’ Isi ederede na-echekwa mgbagwoju echiche Jọn nwere ike ibu, ebe nkọwa ala peeji na-echekwa nghọta nke nkwanye ùgwù n’ọkwa mkparịta ụka.
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. ‘Ka akpịrị ghara ịkpọ m’ na ‘isere mmiri’ bụ akpaokwu Igbo eke; e chekwara ọdịiche dị n’etiti ‘Onyenwe anyị’ na okwu nkwanye ùgwù site na nkọwa ala peeji.
