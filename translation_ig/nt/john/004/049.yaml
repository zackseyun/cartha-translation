id: JHN.4.49
reference: John 4:49
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: λέγει πρὸς αὐτὸν ὁ βασιλικός· Κύριε, κατάβηθι πρὶν ἀποθανεῖν τὸ παιδίον μου.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/049.yaml
  text: The royal official said to him[a], “Lord, come down before my child dies.”
translation:
  language: ig
  text: Onye ọrụ eze ahụ sịrị ya, “Onyenwe m[a], gbadata tupu nwa m anwụọ.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Nna ukwu.” Okwu Grik bụ Κύριε, okwu nkwanye ùgwù nke nwekwara ike ịpụta “Onyenwe m.”
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ βασιλικός
  choice: onye ọrụ eze ahụ
  rationale: Okwu a na-arụ ọrụ dị ka aha onye nwere njikọ n’ebe eze ma ọ bụ n’obí eze nọ. Nsụgharị a na-egosi njikọ ya na eze n’enweghị itinye echiche na ọ bụ onye a mụrụ n’ezinụlọ ndị a ma ama.
- source_word: Κύριε
  choice: Onyenwe anyị
  rationale: Κύριε nwere ike ịbụ aha nkwanye ùgwù dịka “Nna anyị ukwu,” ma ọ nwekwara ike ịpụta “Onyenwe anyị.” Nsụgharị a na-edobe nghọta abụọ ahụ nwere ike ịdị n’okwu Jọn, ebe nkọwa ala peeji na-egosi nghọta nke nkwanye ùgwù.
- source_word: κατάβηθι
  choice: gbadata
  rationale: Iwu a pụtara ịdata site n’ebe dị elu gaa n’ebe dị ala. “Gbadata” bụ okwu Igbo doro anya ma na-edobe echiche gbasara ọnọdụ ala dị n’ọrụ Grik ahụ.
- source_word: πρὶν ἀποθανεῖν
  choice: tupu ... anwụọ
  rationale: πρίν ya na infinitive na-egosi ihe ga-eme tupu ihe ọzọ emee. Igbo nkịtị chọrọ ka e kwuo onye ga-anwụ, ya mere e jikọtara ya na “nwa m.”
- source_word: τὸ παιδίον μου
  choice: nwa m
  rationale: παιδίον pụtara nwa ma ọ bụ nwata. “Nwa m” na-edobe ihe okwu Grik kwuru n’ebughị ụzọ kọwaa na ọ bụ nwoke ma ọ bụ nwaanyị.
- source_word: λέγει πρὸς αὐτόν
  choice: sịrị ya
  rationale: Ọ bụ ezie na Grik ji present tense n’akụkọ a, “sịrị ya” bụ ụzọ Igbo si akọ ihe mere n’oge gara aga n’ụzọ dị mfe ma bụrụkwa ihe okwu ahụ na-arụ n’ahịrịokwu a.
theological_decisions:
- issue: Nsụgharị κύριος mgbe a na-akpọ Jizọs okwu
  choice: Onyenwe anyị
  alternative: Nna anyị ukwu
  rationale: N’ebe a, κύριος nwere ike ịbụ naanị okwu nkwanye ùgwù, ma Oziọma Jọn nwekwara ike ime ka okwu a nwee nghọta sara mbara banyere onye Jizọs bụ. “Onyenwe anyị” na-edobe ohere ahụ, ebe nkọwa ala peeji na-echekwa nghọta ọzọ n’ebughị ụzọ kpebie ihe onye ahụ kweere.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe ma nwee ugwu. A họọrọ “onye ọrụ eze” kama okwu nwere ike ime ka a ghọta na ọ bụ naanị onye eze na-achị ma ọ bụ onye sitere n’ezinụlọ a ma ama. E debere “gbadata” iji chekwaa nkọwa ọnọdụ ala dị n’ọrụ Grik.
