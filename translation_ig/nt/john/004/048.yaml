  text: εἶπεν οὖν ὁ Ἰησοῦς πρὸς αὐτόν· Ἐὰν μὴ σημεῖα καὶ τέρατα ἴδητε, οὐ μὴ πιστεύσητε.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/048.yaml
  text: So Jesus said to him[a], “Unless you see signs and wonders, you will certainly not believe.”
translation:
  language: ig
  text: Ya mere, Jizọs sịrị ya[a], “Ọ gwụla ma unu ahụ ihe ịrịba ama na ihe ebube, unu agaghị ekwere ma ọlị.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ngwaa ndị a sụgharịrị ‘unu ahụ’ na ‘unu agaghị ekwere’ dị n’ọnụọgụ ọtụtụ n’asụsụ Grik. Ya mere, okwu Jizọs nwere ike ịgụnye ndị ọzọ karịa nwoke ahụ a na-agwa okwu.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Ya mere
  rationale: Ọ na-egosi njikọ na ihe e kwuru tupu ya nakwa ihe si na ya pụta; ‘Ya mere’ bụ okwu Igbo doro anya ma kwekọọ na usoro akụkọ a.
- source_word: πρὸς αὐτόν
  choice: sịrị ya
  rationale: N’usoro okwu Igbo, ‘Jizọs sịrị ya’ na-egosipụta nke ọma na Jizọs gwara nwoke ahụ okwu.
- source_word: Ἐὰν μὴ
  choice: Ọ bụrụ na ... ahụghị
  rationale: Ụdị a na-egosipụta ọnọdụ na-adịghị eme, nke kwekọrọ na ‘ọ gwụla ma,’ ma na-ada nke ọma n’Igbo nke oge a.
- source_word: σημεῖα
  choice: ihe ịrịba ama
  rationale: N’Oziọma Jọn, okwu a na-ezo aka n’omume nke na-egosi ihe karịrị ọrụ ahụ n’onwe ya; ‘ihe ịrịba ama’ na-echekwa echiche ahụ n’etinyeghị nkọwa ọzọ.
- source_word: τέρατα
  choice: ihe ebube
  rationale: Ọ na-egosi ihe pụrụ iche nke na-akpali ịtụnanya; ‘ihe ebube’ bụ okwu Igbo a na-aghọta nke ọma ma na-edobe ọdịiche ya na ‘ihe ịrịba ama.’
- source_word: ἴδητε
  choice: unu ahụghị
  rationale: Ngwaa Grik a dị n’ọnụọgụ ọtụtụ. ‘Unu’ na-eme ka nke a pụta ìhè n’Igbo, ebe ọnọdụ na-adịghị eme chọrọ ụdị ‘ahụghị.’
- source_word: οὐ μὴ πιστεύσητε
  choice: unu agaghị ekwere ma ọlị
  rationale: Njikọ οὐ μή na-enye ngọnarị siri ike. ‘Agaghị ... ma ọlị’ na-echekwa ike ahụ n’Igbo eke.
- source_word: πιστεύσητε
  choice: ekwere
  rationale: ‘Ikwere’ bụ ntụgharị sara mbara ma na-adịghị agbakwụnye nkọwa nke πιστεύω n’Oziọma Jọn.
theological_decisions:
- issue: Ọnụọgụ na obosara ndị a na-agwa okwu
  choice: Akụkụ mmalite na-ekwu na Jizọs gwara otu nwoke (‘sịrị ya’), ma okwu Jizọs ji ‘unu’ mee ka ọnụọgụ ọtụtụ nke ngwaa Grik pụta ìhè.
  alternative: A pụrụ iji ‘ị’ mee ka okwu ahụ yie nke a gwara naanị onyeisi ahụ, ma nke ahụ agaghị echekwa ọnụọgụ ọtụtụ dị na Grik.
  rationale: πρὸς αὐτόν na-ezo aka n’otu nwoke, ebe ἴδητε na πιστεύσητε dị n’ọnụọgụ ọtụtụ. Ya mere, ntụgharị ahụ na-edobe esemokwu a n’akwụsịghị ikpebi kpọmkwem ókè ndị ọzọ okwu ahụ metụtara.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. ‘Unu’ na-echekwa ọnụọgụ ọtụtụ nke Grik n’ụzọ doro anya, ebe ‘ma ọlị’ na-egosipụta ngọnarị siri ike.
