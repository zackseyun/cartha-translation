revisions:
- from: Ya mere, Jizọs sịrị ya[a], “Ọ bụrụ na unu ahụghị ihe ịrịba ama na ihe ebube, unu agaghị ekwere ma ọlị.”
  to: Ya mere, Jizọs sịrị ya[a], “Ọ gwụla ma unu ahụ ihe ịrịba ama na ihe ebube, unu agaghị ekwere ma ọlị.”
  rationale: A safe correction is necessary because the draft’s conditional clause has the opposite sense from the Greek. ‘Ọ gwụla ma unu ahụ’ accurately renders Ἐὰν μὴ ... ἴδητε and retains the Greek plural. The revised footnote aligns with the corrected text and describes the wider scope as a possibility rather than a certainty.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T05:38:19Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly retains the singular narrative address (‘sịrị ya’) and explicitly represents the plural verbs with ‘unu.’ It also conveys the emphatic force of οὐ μή well with ‘agaghị ... ma ọlị.’ However, ‘Ọ bụrụ na unu ahụghị ...’ means ‘If you do not see ...,’ which reverses the condition. The Greek Ἐὰν μὴ ... ἴδητε means ‘Unless you see ...’ / ‘Except you see ...’.
  naturalness: The wording is generally natural Standard Igbo. ‘Ọ gwụla ma unu ahụ ...’ is the idiomatic and accurate conditional construction required here. ‘Ihe ịrịba ama na ihe ebube’ is clear and suitably formal.
  terminology: ‘Ihe ịrịba ama’ for σημεῖα, ‘ihe ebube’ for τέρατα, and ‘ekwere’ for πιστεύσητε are appropriate, non-interpretive choices. The plural ‘unu’ properly preserves a salient feature of the Greek.
  issues:
  - severity: high
    issue: The conditional clause reverses the source meaning.
    rationale: ‘Ọ bụrụ na unu ahụghị’ states a condition of not seeing, whereas Ἐὰν μὴ σημεῖα καὶ τέρατα ἴδητε means ‘unless/except you see signs and wonders.’ Replacing it with ‘Ọ gwụla ma unu ahụ ...’ preserves the Greek condition and the relation to the emphatic negative conclusion.
  - severity: medium
    issue: The footnote quotes the mistranslated conditional form.
    rationale: Since the main text should read ‘unu ahụ,’ the footnote should identify ‘unu ahụ’ and ‘unu agaghị ekwere’ as the plural verb expressions. Its explanation should note plurality without claiming more than the grammar establishes.
  revised_text: Ya mere, Jizọs sịrị ya[a], “Ọ gwụla ma unu ahụ ihe ịrịba ama na ihe ebube, unu agaghị ekwere ma ọlị.”
