id: JHN.4.25
reference: John 4:25
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: λέγει αὐτῷ ἡ γυνή· Οἶδα ὅτι Μεσσίας ἔρχεται, ὁ λεγόμενος χριστός· ὅταν ἔλθῃ ἐκεῖνος, ἀναγγελεῖ ἡμῖν ⸀ἅπαντα.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/025.yaml
  text: The woman said to him[a], “I know that Messiah is coming” (the one called Messiah). “When he comes, he will tell us all things.”
translation:
  language: ig
  text: Nwanyị ahụ sịrị ya, “Ama m na Mezaịa na-abịa—ya bụ, Onye E Tere Mmanụ[a]. Mgbe ọ bịara, ọ ga-agwa anyị ihe niile.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'N’asụsụ Grik: “onye a na-akpọ Kraịst.” Ma “Mezaịa” ma “Kraịst” pụtara “Onye E Tere Mmanụ.”'
    reason: Ichekwa ụzọ ihe odide mbụ si jiri aha-utu Grik χριστός kọwaa aha-utu Semitik Μεσσίας.
lexical_decisions:
- source_word: λέγει
  choice: sịrị
  rationale: Ọ bụ ezie na Grik ji ngwaa nke oge ugbu a kọọ akụkọ, ‘sịrị’ bụ ụzọ Igbo si akọ ihe mere n’oge gara aga n’ụzọ ebumpụta ụwa.
- source_word: γυνή
  choice: Nwanyị ahụ
  rationale: N’ebe a, okwu ahụ na-ezo aka kpọmkwem n’ebe nwanyị Sameria ahụ nọ.
- source_word: Οἶδα
  choice: Ama m
  rationale: Nke a bụ nsụgharị doro anya ma bụrụkwa okwu Igbo a na-ejikarị eme ihe.
- source_word: Μεσσίας
  choice: Mezaịa
  rationale: E debere aha-utu Semitik a n’ụdị a na-akpọ ya n’Igbo, ka ọnọdụ ndị Juu na ndị Sameria dị n’amaokwu ahụ ghara ịla n’iyi.
- source_word: ἔρχεται
  choice: na-abịa
  rationale: Ọ na-egosi ọbịbịa a na-atụ anya ya n’ọdịnihu ma na-edebekwa ịdị nso dị n’ụdị ngwaa Grik ahụ.
- source_word: ὁ λεγόμενος χριστός
  choice: ya bụ, Onye E Tere Mmanụ
  rationale: χριστός pụtara onye e tere mmanụ. Nsụgharị a na-eme ka nkọwa Jọn nyere banyere aha Mezaịa doo onye na-agụ Igbo anya.
- source_word: ὅταν ἔλθῃ ἐκεῖνος
  choice: Mgbe ọ bịara
  rationale: Nke a na-egosipụta ihe a na-atụ anya na ọ ga-eme n’ọdịnihu n’Igbo dị mfe ma dị mma.
- source_word: ἀναγγελεῖ
  choice: ọ ga-agwa
  rationale: N’ọnọdụ a, ngwaa ahụ pụtara ime ka ndị ọzọ mata ihe; ‘ga-agwa’ bụ okwu Igbo doro anya ma kwekọọ n’ihe a na-ekwu.
- source_word: ἡμῖν
  choice: anyị
  rationale: ‘Gwa anyị’ bụ usoro Igbo ebumpụta ụwa maka onye a na-eme ka ọ mata ihe.
- source_word: ἅπαντα
  choice: ihe niile
  rationale: Nke a na-egosipụta oke zuru ezu nke okwu Grik ahụ n’ụzọ Igbo a na-aghọta ngwa ngwa.
theological_decisions:
- issue: Otú e si gosipụta njikọ dị n’etiti Μεσσίας na χριστός
  choice: Mezaịa—ya bụ, Onye E Tere Mmanụ
  alternative: Mezaịa—onye a na-akpọ Kraịst
  rationale: Grik na-eji χριστός kọwaa aha Semitik Μεσσίας. Ịsụgharị χριστός dịka ‘Onye E Tere Mmanụ’ na-eme ka ihe nkọwa ahụ pụtara doo ndị na-agụ Igbo anya, ebe ntụaka ala peeji na-echekwa na okwu Grik ahụ bụ χριστός, nke a na-akpọkwa ‘Kraịst.’ Nke a anaghị eme ka Mezaịa na Kraịst bụrụ aha-utu abụọ dị iche.
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta. Ahịrịokwu ahụ na-asọ nke ọma n’okwu ọnụ, ma ntụaka ala peeji na-echekwa ọdịiche asụsụ abụọ dị n’ihe odide Grik.
