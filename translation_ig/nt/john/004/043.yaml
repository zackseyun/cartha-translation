  text: Μετὰ δὲ τὰς δύο ἡμέρας ἐξῆλθεν ⸀ἐκεῖθεν εἰς τὴν Γαλιλαίαν·
base_translation:
  language: en
  yaml_path: translation/nt/john/004/043.yaml
  text: After the two days[a], he departed from there for Galilee.
translation:
  language: ig
  text: Mgbe ụbọchị abụọ ahụ gasịrị, o si n’ebe ahụ pụọ gaa Galili.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “banye na Galili.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δὲ τὰς δύο ἡμέρας
  choice: Mgbe ụbọchị abụọ ahụ gasịrị
  rationale: μετά ya na aha nọ n’ụdị accusative na-egosi oge sochiri oge ọzọ, ya bụ “mgbe ... gasịrị.” “Ụbọchị abụọ ahụ” na-ezo aka n’ụbọchị abụọ a kpọtụrụ aha na amaokwu bu ụzọ. A sụgharịghị δέ iche n’ihi na ọ bụ njikọ dị nro, usoro ahịrịokwu Igbo a egosikwala njikọ ahụ nke ọma.
- source_word: ἐξῆλθεν
  choice: o ... pụọ
  rationale: Aorist nke ἐξέρχομαι pụtara ịpụ ma ọ bụ isi n’otu ebe gawa. “Pụọ” bụ okwu Igbo dị ndụ ma kwekọọ n’akụkọ njem a.
- source_word: ἐκεῖθεν
  choice: si n’ebe ahụ
  rationale: Ọ na-egosi ebe o si malite njem, ya bụ ebe a kpọtụrụ aha na mbụ. “Si n’ebe ahụ” bụ ụzọ Igbo e si ekwu ya n’ụzọ doro anya.
- source_word: εἰς τὴν Γαλιλαίαν
  choice: gaa Galili
  rationale: εἰς na-egosi ngagharị ihu n’ebe a na-aga. “Gaa Galili” bụ okwu Igbo nkịtị ma doo anya; echiche nke ịbanye n’ógbè ahụ ka nwere ike ịdị n’okpuru okwu Grik ahụ.
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị mfe ma nwee ugwu, sụgharịa amaokwu ahụ. E debere nrụtụ aka nke “ụbọchị abụọ ahụ” n’ihi ihe gbara ya gburugburu. E tinyere akara nkọwa ala peeji n’akụkụ “Galili,” ebe ihe ọzọ a pụrụ ịsụgharị metụtara εἰς τὴν Γαλιλαίαν.
