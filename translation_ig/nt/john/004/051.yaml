id: JHN.4.51
reference: John 4:51
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἤδη δὲ αὐτοῦ καταβαίνοντος οἱ δοῦλοι αὐτοῦ ⸀ὑπήντησαν ⸀αὐτῷ λέγοντες ὅτι ὁ παῖς ⸀αὐτοῦ ζῇ.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/051.yaml
  text: And while he was already going down[a], his servants met him, saying that his child was alive.
translation:
  language: ig
  text: Ka ọ na-agbadarị, ndị ohu ya zutere ya, na-ekwu na nwa ya dị ndụ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya ‘nwa nwoke ya’; okwu Grik bụ pais nwere ike ịpụta ‘nwa,’ ‘nwata nwoke,’ ma ọ bụ, n’ọnọdụ ụfọdụ, ‘ohu.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤδη
  choice: nọrịị
  rationale: Na-egosi na njem ahụ amalitelarị tupu nzute ahụ emee; ngwakọta ya na ‘na-agbada’ na-ada nke ọma n'Igbo.
- source_word: δὲ
  choice: Mgbe
  rationale: N'usoro genitive absolute a, a sụgharịrị njikọ akụkọ ahụ n'ụzọ eke site n'ahịrịokwu oge, kama ịmanye ‘ma’ ma ọ bụ ‘na’ ebe ọ na-adịghị mkpa n'Igbo.
- source_word: καταβαίνοντος
  choice: na-agbada
  rationale: Na-echekwa omume na-aga n'ihu mgbe nzute ahụ mere, nakwa echiche njem site n'ebe dị elu ruo n'ebe dị ala.
- source_word: δοῦλοι
  choice: ndị ohu
  rationale: Na-egosipụta ọnọdụ ndị nọ n'okpuru ikike onyeisi ụlọ ahụ nke ọma karịa okwu sara mbara bụ ‘ndị na-ejere ya ozi,’ ma ọ dịghị etinye nkọwa okpukpe ọzọ.
- source_word: ὑπήντησαν
  choice: zutere
  rationale: Ọ bụ okwu Igbo doro anya ma bụrụ nke eke maka izute onye na-abịa n'ụzọ.
- source_word: λέγοντες
  choice: na-ekwu
  rationale: Na-echekwa njikọ participle ahụ dị ka omume so nzute ahụ n'otu oge.
- source_word: παῖς
  choice: nwa
  rationale: ‘Nwa’ na-egosipụta mmekọrịta ezinụlọ n'ụzọ sara mbara, n'etinyeghị afọ ma ọ bụ nwoke/nwanyị karịa ka okwu Grik a kwuru.
- source_word: ζῇ
  choice: dị ndụ
  rationale: Na-enye ihe present tense ahụ pụtara n'ụzọ Igbo eke, n'akwunyeghị nkọwa dịka ‘agbakeela.’
theological_decisions:
- issue: Onye παῖς na-ezo aka na ya n'akụkọ ọgwụgwọ a
  choice: nwa ya
  alternative: nwa nwoke ya; ohu ya
  rationale: παῖς nwere ike ịpụta nwa, nwa nwoke, ma ọ bụ ohu dabere n'ọnọdụ. Akụkụ gbara ya gburugburu na-akwado mmekọrịta ezinụlọ, ma amaokwu a n'onwe ya anaghị achọ ka e mee ka ọ bụrụ kpọmkwem ‘nwa nwoke’; ya mere ‘nwa’ na-echekwa obosara okwu ahụ, ebe nkọwa ala peeji na-egosi nhọrọ ndị ọzọ.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke oge a ma dị ùgwù. Ahịrịokwu ahụ jiri nhazi oge nke na-ada eke n'Igbo, ma chekwaa mmegharị na-aga n'ihu na mgbagwoju pụtara nke παῖς.
