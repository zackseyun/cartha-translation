- from: Mgbe ọ nọrịị na-agbada, ndị ohu ya zutere ya, na-ekwu na nwa ya dị ndụ.[a]
  to: Ka ọ na-agbadarị, ndị ohu ya zutere ya, na-ekwu na nwa ya dị ndụ.[a]
  rationale: The revision replaces only the awkward temporal expression, preserving the Greek participial timing and ἤδη (‘already’) in idiomatic Standard Igbo. The rendering of δοῦλοι, παῖς, and ζῇ, as well as the lexical-alternative footnote, is retained.
