  to: Ya mere, ọ bịara ọzọ na Kena nke Galili, ebe o mere mmiri ka ọ ghọọ mmanya. O nwekwara otu onye ọrụ eze[a], onye nwa ya nwoke na-arịa ọrịa na Kapanọm.
  rationale: The revision removes an unsupported statement about the official’s location and uses a broader modern Igbo expression for his royal connection. It preserves the Greek narrative connective, repeated arrival, and the locative phrase specifying that the son—not necessarily the official—was in Capernaum.
