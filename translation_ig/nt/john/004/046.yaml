id: JHN.4.46
reference: John 4:46
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἦλθεν οὖν ⸀πάλιν εἰς τὴν Κανὰ τῆς Γαλιλαίας, ὅπου ἐποίησεν τὸ ὕδωρ οἶνον. καὶ ἦν τις βασιλικὸς οὗ ὁ υἱὸς ἠσθένει ἐν Καφαρναούμ.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/046.yaml
  text: So he came again to Cana of Galilee[a], where he had made the water wine[b]. And there was a certain royal official whose son was sick in Capernaum.
translation:
  language: ig
  text: Ya mere, ọ bịara ọzọ na Kena nke Galili, ebe o mere mmiri ka ọ ghọọ mmanya. O nwekwara otu onye ọrụ eze[a], onye nwa ya nwoke na-arịa ọrịa na Kapanọm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “onye na-ejere eze ozi” ma ọ bụ “onyeisi n’obí eze.” Okwu Grik ahụ, βασιλικός, na-ekwu maka onye metụtara eze ma ọ bụ obí eze ya; ọ kọwaghị ọkwa ya kpọmkwem.
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: Ya mere
  rationale: Na-ejide njikọ akụkọ na ihe ndị bu ụzọ, ma bụrụkwa okwu Igbo a na-aghọta nke ọma.
- source_word: πάλιν
  choice: ọzọ
  rationale: Na-egosi na ọ laghachiri ebe ahụ ọzọ.
- source_word: Κανὰ τῆς Γαλιλαίας
  choice: Kena nke Galili
  rationale: Na-edobe aha ebe ahụ na njikọ mpaghara dịka Grik si kwuo ya.
- source_word: ἐποίησεν τὸ ὕδωρ οἶνον
  choice: o mere mmiri ka ọ ghọọ mmanya
  rationale: Nke a bụ Igbo doro anya ma dịkwa nso n’ụzọ okwu Grik ahụ si kwuo na o mere mmiri mmanya.
- source_word: βασιλικός
  choice: onye na-eje ozi n’obí eze
  rationale: Na-egosi njikọ nwoke ahụ na ọchịchị ma ọ bụ obí eze, n’ebughị ụzọ kpebie ọkwa ọrụ ya kpọmkwem.
- source_word: τις
  choice: otu onye
  rationale: Na-ewebata otu nwoke a kapịrị ọnụ ma a na-akpọghị aha ya.
- source_word: υἱός
  choice: nwa ya nwoke
  rationale: Na-edobe nkọwa Grik na onye ahụ bụ nwa nwoke.
- source_word: ἠσθένει
  choice: na-arịa ọrịa
  rationale: Na-egosi ọrịa anụ ahụ n’Igbo nkịtị ma doo anya.
- source_word: Καφαρναούμ
  choice: Kapanọm
  rationale: Ọ bụ nsụgharị ụda aha obodo ahụ kwekọrọ n’usoro mkpụrụokwu Igbo.
theological_decisions:
- issue: Ịsụgharị βασιλικός n’ebughị amụma kpọmkwem banyere ọkwa nwoke ahụ n’obí Herọd Antipas
  choice: onye na-eje ozi n’obí eze
  alternative: onyeisi; onye ọrụ eze
  rationale: Okwu Grik ahụ na-egosi onye nwere njikọ n’ebe eze ma ọ bụ obí eze nọ, ma ọ kọwaghị ọkwa ya kpọmkwem. Nhọrọ a na-echekwa nghọta ahụ n’etinyeghị nkọwa akụkọ ihe mere eme a na-ejighị n’aka.
translation_notes:
  register: Igbo Izugbe dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji “onye na-eje ozi n’obí eze” zere okwu nwere ike ịpụta na a maara ọkwa nwoke ahụ kpọmkwem.
