review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the emphatic negation (οὐ μὴ), the enduring expression εἰς τὸν αἰῶνα, the inward location of the spring, and ‘eternal life.’ However, ἁλλομένου specifically depicts water springing/leaping up, not merely flowing out; ‘na-asọpụta’ weakens this image.
  naturalness: The verse is generally clear Standard Igbo. ‘Site na mmiri ahụ’ is more idiomatic than ‘n’ime mmiri ahụ’ for drinking from a specified water source. ‘Isi iyi mmiri nke na-awụli elu’ preserves the image while remaining understandable.
  terminology: ‘akpọ nkụ,’ ‘isi iyi,’ and ‘ndụ ebighị ebi’ are appropriate, natural terms. No doctrinally loaded expansion is introduced.
  issues:
  - severity: medium
    issue: ‘na-asọpụta’ does not fully render ἁλλομένου.
    rationale: The Greek participle means ‘springing/leaping up.’ A rendering limited to flowing omits the vigorous upward imagery in the source.
  - severity: low
    issue: ‘n’ime mmiri ahụ’ is less idiomatic for ‘drink from the water.’
    rationale: ‘Site na mmiri ahụ’ more naturally expresses the Greek ἐκ τοῦ ὕδατος without altering the sense.
  revised_text: Ma onye ọ bụla nke ga-aṅụ site na mmiri ahụ m ga-enye ya agaghị akpọ nkụ ruo mgbe ebighị ebi; kama, mmiri ahụ m ga-enye ya ga-aghọ n’ime ya isi iyi mmiri nke na-awụli elu ruo ná ndụ ebighị ebi.
  revised_footnotes: []
