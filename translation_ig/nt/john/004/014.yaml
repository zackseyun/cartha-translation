id: JHN.4.14
reference: John 4:14
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὃς δ’ ἂν πίῃ ἐκ τοῦ ὕδατος οὗ ἐγὼ δώσω αὐτῷ, οὐ μὴ ⸀διψήσει εἰς τὸν αἰῶνα, ἀλλὰ τὸ ὕδωρ ὃ δώσω αὐτῷ γενήσεται ἐν αὐτῷ πηγὴ ὕδατος ἁλλομένου εἰς ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/014.yaml
  text: But whoever drinks from the water that I will give him will never thirst forever; rather, the water that I will give him will become in him a spring of water welling up to eternal life.
translation:
  language: ig
  text: Ma onye ọ bụla nke ga-aṅụ site na mmiri ahụ m ga-enye ya agaghị akpọ nkụ ruo mgbe ebighị ebi; kama, mmiri ahụ m ga-enye ya ga-aghọ n’ime ya isi iyi mmiri nke na-awụli elu ruo ná ndụ ebighị ebi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐ μὴ διψήσει εἰς τὸν αἰῶνα
  choice: agaghị akpọ nkụ ruo mgbe ebighị ebi
  rationale: E ji nkwusioru siri ike ‘agaghị’ na nkebi oge ‘ruo mgbe ebighị ebi’ chekwaa ike na ogologo oge nke okwu Grik ahụ.
- source_word: πηγὴ ὕδατος
  choice: isi iyi nke mmiri
  rationale: ‘Isi iyi’ bụ okwu Igbo doro anya maka mmiri na-esi n’ala apụta, ma na-edobe ihe atụ dị na isi mmalite.
- source_word: ἁλλομένου
  choice: na-asọpụta
  rationale: N’ọnọdụ a, okwu ahụ na-egosi mmiri na-apụta ma na-aga n’ihu; ‘na-asọpụta’ na-enye echiche ahụ n’Igbo nkịtị n’enweghị ịgbakwunye nkọwa.
- source_word: ζωὴν αἰώνιον
  choice: ndụ ebighị ebi
  rationale: Nke a bụ ntụgharị Igbo doro anya ma guzosie ike nke okwu ahụ, na-echekwa ma echiche ndụ ma nke ịdịru ebighị ebi.
theological_decisions:
- issue: Nkwusioru siri ike banyere akpịrị ịkpọ nkụ
  choice: agaghị akpọ nkụ ruo mgbe ebighị ebi
  alternative: ọ dịghị mgbe ọ ga-akpọkwa nkụ ọzọ
  rationale: Nhọrọ a na-anọ nso n’usoro Grik, gụnyere εἰς τὸν αἰῶνα, ma ghara ịkọwa n’onwe ya ma okwu ahụ bụ naanị ihe atụ ime mmụọ ma ọ bụ otú ọzọ.
- issue: Ntụziaka nke isi iyi ahụ
  choice: na-asọpụta ruo ná ndụ ebighị ebi
  alternative: na-awụlikwa elu nye ndụ ebighị ebi
  rationale: ‘Ruo ná’ na-echekwa ntụziaka ebumnuche/nsonaazụ nke εἰς n’enweghị idozi n’ụzọ karịrị ederede mmekọrịta dị n’etiti mmiri ahụ na ndụ ebighị ebi.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke ugwu ma dị mfe nghọta. E debere ihe atụ mmiri, isi iyi, na ndụ ebighị ebi n’enweghị ịtinye nkọwa ụka pụrụ iche.
