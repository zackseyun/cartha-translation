  to: Ma onye ọ bụla nke ga-aṅụ site na mmiri ahụ m ga-enye ya agaghị akpọ nkụ ruo mgbe ebighị ebi; kama, mmiri ahụ m ga-enye ya ga-aghọ n’ime ya isi iyi mmiri nke na-awụli elu ruo ná ndụ ebighị ebi.
  rationale: The revision retains the draft’s strong and accurate rendering of the permanent negation and eternal life, while replacing ‘na-asọpụta’ with wording that reflects the source image of water springing up. It also uses the more natural Igbo expression for drinking from the water.
