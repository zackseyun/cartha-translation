  to: 'N’ihi na n’ihe a[b], okwu a bụ eziokwu[a]: “Otu onye na-agha mkpụrụ, onye ọzọ na-ewe ihe ubi.”'
  rationale: A single safe grammatical correction changes “ana-ewe” to “na-ewe.” This preserves the intended meaning while accurately rendering the active Greek participle and maintaining natural Standard Igbo.
  reviewer_model: gpt-5.6-terra
