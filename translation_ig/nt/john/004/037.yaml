source:
  edition: SBLGNT
  text: ἐν γὰρ τούτῳ ὁ λόγος ⸀ἐστὶν ἀληθινὸς ὅτι Ἄλλος ἐστὶν ὁ σπείρων καὶ ἄλλος ὁ θερίζων·
base_translation:
  language: en
  yaml_path: translation/nt/john/004/037.yaml
  text: 'For in this the saying is true: one is the one sowing[c][b][a], and another the one reaping.'
translation:
  language: ig
  text: 'N’ihi na n’ihe a[b], okwu a bụ eziokwu[a]: “Otu onye na-agha mkpụrụ, onye ọzọ na-ewe ihe ubi.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “ilu a bụ eziokwu” ma ọ bụ “okwu ahụ bụ eziokwu.”
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsị, “n’okwu a.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: n’ihe a
  rationale: Ọ na-edobe nrụtụ aka dị n’okwu Grik n’ebughị ụzọ kọwaa kpọmkwem ihe Jizọs na-atụ aka na ya.
- source_word: γὰρ
  choice: n’ihi na
  rationale: Ọ na-egosi na amaokwu a na-enye ihe mgbakwasị ụkwụ ma ọ bụ nkọwa maka okwu bu ya ụzọ.
- source_word: ὁ λόγος
  choice: okwu a
  rationale: N’ebe a, λόγος pụtara okwu amamihe a na-ekwu, ọ bụghị aha nsọpụrụ ‘Okwu ahụ.’ ‘Okwu a’ bụ asụsụ Igbo doro anya ma ghara ime ka ihe Grik kwuru sie ike karịa ka ọ dị.
- source_word: ἀληθινός
  choice: bụ eziokwu
  rationale: Ọ na-egosi na okwu ahụ ziri ezi ma kwekọọ n’ihe na-eme.
- source_word: ὅτι
  choice: ':'
  rationale: Akara ntụpọ abụọ na-ewebata ọdịnaya okwu ahụ n’ụzọ dị ire n’Igbo.
- source_word: ἄλλος ... καὶ ἄλλος
  choice: otu onye ... onye ọzọ
  rationale: Ọ na-edobe ọdịiche dị n’etiti mmadụ abụọ n’ụzọ Igbo nkịtị si ekwu ya.
- source_word: ὁ σπείρων
  choice: onye na-agha mkpụrụ
  rationale: Ọ na-egosipụta onye na-arụ ọrụ ịgha mkpụrụ, ma na-edobe ụdị ngwaa dị na participle Grik.
- source_word: ὁ θερίζων
  choice: onye ana-ewe ihe ubi
  rationale: Ọ na-egosipụta onye na-arụ ọrụ iwe ihe ubi ma debe ya n’usoro yiri ‘onye na-agha mkpụrụ.’
theological_decisions:
- issue: Ndị ịgha mkpụrụ na ndị iwe ihe ubi na-anọchi anya ha
  choice: A kọwaghị ndị okwu a na-atụ aka na ha n’ime nsụgharị ahụ.
  alternative: Ịkọwa na onye na-agha mkpụrụ bụ ndị amụma, Jọn Onye Na-eme Baptizim, ma ọ bụ Jizọs, na onye na-ewe ihe ubi bụ ndị na-eso ụzọ ya.
  rationale: Amaokwu Grik n’onwe ya na-enye okwu izugbe ma hapụ ka ihe gbara ya gburugburu gosi etu e si etinye ya n’ọrụ. Ịhapụ ya otu a na-ezere ịtinye nkọwa okpukpe n’ime ederede.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị nsọpụrụ ma dị mfe nghọta. E debere ahịrịokwu ahụ ka ọ daa dịka okwu amamihe a na-ekwukarị, ma a hapụghị njikọ ya na ihe bu ya ụzọ.
