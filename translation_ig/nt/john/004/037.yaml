    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsị, “n’okwu a.”
    reason: lexical_alternative
  revision_rationale: A single safe grammatical correction changes “ana-ewe” to “na-ewe.” This preserves the intended meaning while accurately rendering the active Greek participle and maintaining natural Standard Igbo.
