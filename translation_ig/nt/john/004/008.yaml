id: JHN.4.8
reference: John 4:8
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οἱ γὰρ μαθηταὶ αὐτοῦ ἀπεληλύθεισαν εἰς τὴν πόλιν, ἵνα τροφὰς ἀγοράσωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/008.yaml
  text: For his disciples had gone away into the city to buy food[a][b].
translation:
  language: ig
  text: N’ihi na ndị na-eso ụzọ ya agaala n’obodo[a] ịzụta nri[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “n’obodo ukwu” ma ọ bụ “n’obodo nta”; okwu Grik ahụ nwere ike ịpụta nke ọ bụla dịka ọnọdụ siri dị.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ihe oriri.”
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: N’ihi na
  rationale: Ọ na-egosi na ahịrịokwu a na-akọwa ihe kpatara ọnọdụ e kwuru n’ihu ya; “N’ihi na” na-edobe njikọ nkọwa ahụ n’Igbo doro anya.
- source_word: μαθηταὶ αὐτοῦ
  choice: ndị na-eso ụzọ ya
  rationale: Nke a bụ ụzọ Igbo nkịtị na nke nghọta si akọwa ndị na-amụta ihe n’aka onye nkuzi ma na-eso ya.
- source_word: ἀπεληλύθεισαν
  choice: agaala
  rationale: Ụdị ngwaa Grik a na-egosi na ọpụpụ ahụ emeelarị tupu ọnọdụ a na-akọ; “agaala” na-egosipụta nke ahụ n’Igbo n’enweghị okwu arọ.
- source_word: εἰς τὴν πόλιν
  choice: n’obodo
  rationale: Ọ na-egosi ngagharị ruo ma ọ bụ banye n’ebe ahụ. “N’obodo” bụ okwu Igbo dị mfe, ma “obodo” nwekwara ike ịpụta obodo ukwu ma ọ bụ obodo nta dịka ọnọdụ siri dị.
- source_word: ἵνα
  choice: ị
  rationale: Nganiihu infinitive “ị-” na-egosipụta nzube nke njem ahụ n’Igbo n’ụzọ ebumpụta ụwa.
- source_word: τροφὰς
  choice: nri
  rationale: “Nri” bụ okwu Igbo kachasị mfe ma kwekọọ na ihe a ga-eri; n’ọnọdụ a, ọ pụkwara ịpụta ihe oriri e zụtara maka mkpa ha.
- source_word: ἀγοράσωσιν
  choice: zụta
  rationale: “Zụta” bụ okwu Igbo nkịtị na nke ziri ezi maka inweta ihe site n’ịkwụ ụgwọ.
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo dị mfe ma dị ugwu dee ya. “Ndị na-eso ụzọ ya” bụ okwu Ndị Kraịst maara nke ọma ma bụrụkwa nkọwa nghọta nke μαθηταί. E debere nkọwa njikọ γάρ na oge gara aga nke ἀπεληλύθεισαν n’ụdị Igbo ebumpụta ụwa.
