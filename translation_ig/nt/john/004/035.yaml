revisions:
- from: 'Ọ̀ bụghị unu na-ekwu, sị, “Ọnwa anọ ka fọdụrụ, mgbe ahụ owuwe ihe ubi abịa”? Lee, ana m agwa unu: welienụ anya unu, lekwasị ubi ndị ahụ anya; ha achaala ọcha maka owuwe ihe ubi ugbu a.[a]'
  to: 'Ọ̀ bụghị unu na-ekwu, sị, “Ọnwa anọ ka fọdụrụ, mgbe ahụ owuwe ihe ubi ga-abịa”? Lee, ana m agwa unu: welienụ anya unu, hụnụ ubi ndị ahụ; ha adịworị ọcha[a] maka owuwe ihe ubi.'
  rationale: The revision retains the Greek agricultural metaphor and its visual description rather than making the spiritual application explicit. It replaces the merely temporal “ugbu a” with “adịworị” to represent ἤδη, clarifies the expected future harvest, and moves the note anchor to the word “ọcha” that the note addresses.
