source:
  edition: SBLGNT
  text: οὐχ ὑμεῖς λέγετε ὅτι Ἔτι τετράμηνός ἐστιν καὶ ὁ θερισμὸς ἔρχεται; ἰδοὺ λέγω ὑμῖν, ἐπάρατε τοὺς ὀφθαλμοὺς ὑμῶν καὶ θεάσασθε τὰς χώρας ὅτι λευκαί εἰσιν πρὸς θερισμόν· ἤδη
base_translation:
  language: en
  yaml_path: translation/nt/john/004/035.yaml
  text: 'Do you not say[a], ‘There are still four months, and then the harvest comes’? Look, I tell you: lift up your eyes and see the fields, that they are white for harvest already.'
translation:
  language: ig
  text: 'Ọ̀ bụghị unu na-ekwu, sị, “Ọnwa anọ ka fọdụrụ, mgbe ahụ owuwe ihe ubi ga-abịa”? Lee, ana m agwa unu: welienụ anya unu, hụnụ ubi ndị ahụ; ha adịworị ọcha[a] maka owuwe ihe ubi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ha charala acha maka owuwe ihe ubi.” Okwu Grik sịrị “ọcha,” na-edobe ihe oyiyi a na-ahụ anya n’ubi, ma na-egosi na ha eruola oge owuwe ihe ubi.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐχ ὑμεῖς λέγετε
  choice: Ọ̀ bụghị unu na-ekwu
  rationale: Ọ na-edobe ajụjụ nkwugide nke Grik na nkwusiri ike dị n'okwu nnọchiaha ὑμεῖς, ma na-ada nke ọma n'Igbo.
- source_word: Ἔτι τετράμηνός ἐστιν
  choice: Ọnwa anọ ka fọdụrụ
  rationale: Nke a bụ ụzọ Igbo nkịtị si egosi oge ka ga-afọdụ tupu ihe emee.
- source_word: ὁ θερισμὸς ἔρχεται
  choice: mgbe ahụ owuwe ihe ubi abịa
  rationale: Ọ na-egosi owuwe ihe ubi dị ka ihe ga-abịa mgbe oge ahụ gafere, ma na-edobe ọdịdị okwu a na-ekwukarị.
- source_word: ἰδοὺ
  choice: Lee
  rationale: Ọ bụ okwu Igbo dị mkpirikpi nke na-adọ ndị na-ege ntị aka ná ntị ka ha tinye uche.
- source_word: ἐπάρατε τοὺς ὀφθαλμοὺς ὑμῶν
  choice: welienụ anya unu
  rationale: Ọ na-edobe ihe oyiyi doro anya nke ibuli anya kama ịsụgharị ya naanị dịka ile anya.
- source_word: θεάσασθε
  choice: lekwasị ... anya
  rationale: Ọ na-egosi ile ihe anya nke ọma ma zere ikwughachi naanị okwu 'hụ' n'ụzọ na-adịghị ike.
- source_word: τὰς χώρας
  choice: ubi ndị ahụ
  rationale: N'ọnọdụ owuwe ihe ubi, χώρας na-ezo aka n'ala a kụrụ ihe, ya bụ ubi.
- source_word: λευκαί εἰσιν
  choice: ha achaala ọcha
  rationale: Ọ na-edobe agba na ihe oyiyi anya nke Grik, kama iji naanị nkọwa pụtara na ihe ubi charala acha dochie ya.
- source_word: πρὸς θερισμόν
  choice: maka owuwe ihe ubi
  rationale: Ọ na-edobe ihe atụ owuwe ihe ubi n'ụzọ doro anya ma dị mfe nghọta.
- source_word: ἤδη
  choice: ugbu a
  rationale: E debere ya n'ikpeazụ iji mesie na ubi eruworị oge owuwe ihe ubi ike, n'ụzọ megidere ichere ọnwa anọ.
theological_decisions:
- issue: Ma a ga-akọwa owuwe ihe ubi ozugbo dịka ịchịkọta ndị mmadụ n'amaokwu ahụ
  choice: E debere ihe oyiyi ọrụ ugbo ahụ dịka ọ dị
  alternative: Ịsụgharị ya n'ụzọ nkọwa dịka ‘ndị mmadụ adịla njikere ka a chịkọta ha’
  rationale: Ọnọdụ gbara amaokwu ahụ gburugburu na-egosi ihe ime mmụọ na ozi, ma okwu Grik n'onwe ya ka na-eji ubi na owuwe ihe ubi eme ihe atụ. Nsụgharị ekwesịghị itinye nkọwa ahụ kpọmkwem n'ime amaokwu.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E debere usoro okwu ọrụ ugbo na ihe oyiyi nke Grik, ebe e mere ahịrịokwu banyere ọnwa anọ ka ọ bụrụ nke na-ada nke ọma n'Igbo. E tinyere akara nkọwa [a] n'akụkụ okwu ọ na-akọwa.
