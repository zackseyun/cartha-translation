id: JHN.4.5
reference: John 4:5
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἔρχεται οὖν εἰς πόλιν τῆς Σαμαρείας λεγομένην Συχὰρ πλησίον τοῦ χωρίου ὃ ἔδωκεν Ἰακὼβ ⸀τῷ Ἰωσὴφ τῷ υἱῷ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/john/004/005.yaml
  text: So he came to a town of Samaria called Sychar[b][a], near the piece of land that Jacob had given to Joseph his son.
translation:
  language: ig
  text: Ya mere, ọ bịarutere n’otu obodo[a] dị na Sameria, nke a na-akpọ Saịka, nke dị nso n’ibe ala[b] Jekọb nyere Josef, nwa ya nwoke.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “obodo ukwu.” Okwu Greek bụ πόλις nwere ike ịpụta obodo ukwu ma ọ bụ obodo nta, dabere n’ihe a na-ekwu maka ya.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ubi.” Okwu Greek bụ χωρίον nwere ike ịpụta ubi, ala mmadụ nwe, ma ọ bụ otu ibe ala.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχεται
  choice: ọ bịarutere
  rationale: Ọ bụ present tense e ji akọ akụkọ ihe gara aga; past tense Igbo na-eme ka usoro akụkọ ahụ bụrụ ihe a na-aghọta nke ọma.
- source_word: οὖν
  choice: Ya mere
  rationale: Na-egosi njikọ na ihe e kwuru tupu ya na ịga n’ihu nke akụkọ ahụ, n’enweghị ime ka njikọ ahụ sie ike karịa ka Greek si dị.
- source_word: πόλιν
  choice: obodo
  rationale: “Obodo” bụ okwu Igbo sara mbara nke nwere ike ịpụta town ma ọ bụ city, ya mere ọ na-echekwa obosara ihe πόλις pụrụ ịpụta.
- source_word: τῆς Σαμαρείας
  choice: dị na Sameria
  rationale: Ọ na-egosi n'ụzọ Igbo dị ndụ na obodo ahụ dị n’ógbè Sameria, ebe ọ ka na-edobe njikọ genitive nke Greek.
- source_word: λεγομένην Συχὰρ
  choice: nke a na-akpọ Saịka
  rationale: Nke a bụ ụzọ Igbo doro anya ma dị ndụ isi kwuo participle na-akọwa aha obodo ahụ.
- source_word: πλησίον
  choice: dị nso
  rationale: Ọ na-enye kpọmkwem echiche nke ịdị nso n’ebe ahụ.
- source_word: χωρίου
  choice: ibe ala
  rationale: “Ibe ala” na-egosi otu akụkụ ma ọ bụ otu akụ̀ ala n’etinyeghị n’ime okwu ahụ na ọ bụ naanị ubi a na-akọ.
- source_word: ὃ ἔδωκεν Ἰακὼβ
  choice: Jekọb nyere
  rationale: Usoro a bụ Igbo dị mfe ma na-egosi omume ahụ mere tupu ọbịbịa Jizọs n’ebe ahụ.
- source_word: τῷ Ἰωσὴφ τῷ υἱῷ αὐτοῦ
  choice: Josef nwa ya nwoke
  rationale: Ọ na-echekwa Josef dịka onye natara ala ahụ ma kọwaa n’ụzọ doro anya na ọ bụ nwa Jekọb.
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ “obodo” na “ibe ala” iji chekwaa obosara okwu Greek ndị ahụ; ihe ndị ọzọ ha pụrụ ịpụta dị n’ala peeji.
