    text: 'A pụkwara ịsụgharị ya: “ndị mmadụ Juu.” N’ebe ụfọdụ ọzọ n’Oziọma Jọn, “ndị Judia” nwere ike ịdaba; ma n’ebe a, ntụnyere ahụ bụ n’etiti ndị Sameria na ndị Juu n’ihe gbasara ofufe na akụkọ nzọpụta.'
    reason: lexical_alternative
