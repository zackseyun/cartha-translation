revisions:
- from: Unu na-efe ihe unu na-amaghị; anyị na-efe ihe anyị maara, n’ihi na nzọpụta si n’etiti ndị Juu abịa.[a]
  to: Unu na-efe ihe unu na-amaghị; anyị na-efe ihe anyị maara, n’ihi na nzọpụta sitere n’aka ndị Juu.[a]
  rationale: The revision removes the added “from among” nuance while maintaining the Greek statement that salvation has its source in the Jews. It also repairs the footnote so that it supplies an actual alternative without imposing a theological interpretation beyond the verse.
  reviewer_model: gpt-5.6-terra
