id: JHN.4.22
reference: John 4:22
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὑμεῖς προσκυνεῖτε ὃ οὐκ οἴδατε, ἡμεῖς προσκυνοῦμεν ὃ οἴδαμεν, ὅτι ἡ σωτηρία ἐκ τῶν Ἰουδαίων ἐστίν·
base_translation:
  language: en
  yaml_path: translation/nt/john/004/022.yaml
  text: You worship what you do not know; we worship what we know[a], because salvation is from the Jews.
translation:
  language: ig
  text: Unu na-efe ihe unu na-amaghị; anyị na-efe ihe anyị maara, n’ihi na nzọpụta sitere n’aka ndị Juu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ịsụgharị ya: “ndị mmadụ Juu.” N’ebe ụfọdụ ọzọ n’Oziọma Jọn, “ndị Judia” nwere ike ịdaba; ma n’ebe a, ntụnyere ahụ bụ n’etiti ndị Sameria na ndị Juu n’ihe gbasara ofufe na akụkọ nzọpụta.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκυνεῖτε / προσκυνοῦμεν
  choice: na-efe
  rationale: N’ebe a, okwu ahụ na-ekwu maka ife ofufe okpukpe, ọ bụghị naanị ịkpọ isiala ma ọ bụ ịsọpụrụ mmadụ.
- source_word: ὃ
  choice: ihe
  rationale: Nnọchiaha Grik a bụ nke na-anọpụ iche; “ihe” na-edobe ọdịdị okwu ahụ n’enweghị ịkọwapụta ya dịka “onye”.
- source_word: οἴδατε / οἴδαμεν
  choice: ma / maara
  rationale: “Ịma” na-egosi ihe ọmụma banyere ihe a na-efe ma na-edobe ntụnyere siri ike dị n’ahịrịokwu ahụ.
- source_word: σωτηρία
  choice: nzọpụta
  rationale: “Nzọpụta” bụ okwu Igbo a na-ejikarị ekwu maka ọrụ Chineke nke ịzọpụta mmadụ, ọ bụghị naanị mgbapụta n’ihe ize ndụ nwa oge.
- source_word: ἐκ
  choice: si n’etiti ... abịa
  rationale: Nke a na-egosi isi mmalite ma ọ bụ ụzọ akụkọ ihe mere eme nke nzọpụta, n’ụzọ na-ada nke ọma n’Igbo.
- source_word: τῶν Ἰουδαίων
  choice: ndị Juu
  rationale: N’ebe a, ihe dị iche bụ n’etiti ndị Sameria na ndị Juu n’ihe gbasara ofufe na akụkọ nzọpụta; ya mere “ndị Juu” dabara karịa “ndị Judia”.
theological_decisions:
- issue: Ihe okwu “nzọpụta si n’etiti ndị Juu abịa” pụtara
  choice: Ọ na-ekwu na nzọpụta sitere n’akụkọ ihe mere eme na ọgbụgba ndụ Chineke ya na ndị Juu, ọ bụghị na agbụrụ Juu ka agbụrụ ndị ọzọ mma.
  alternative: Ọ pụrụ ịbụ naanị ntụaka banyere na Mesaya bụ onye Juu, ma ọ bụ okwu sara mbara banyere mkpa mkpughe na ofufe ndị Juu.
  rationale: Nsụgharị ahụ na-edobe okwu banyere isi mmalite nke nzọpụta n’enweghị itinye echiche ịkpa ókè agbụrụ ma ọ bụ ozizi ọzọ na-adịghị n’ihe odide ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E debere ntụnyere “unu/anyị” na nkwughachi nke “na-efe” na “maara” iji chekwaa ike na nhazi okwu Grik.
