id: JHN.4.7
reference: John 4:7
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἔρχεται γυνὴ ἐκ τῆς Σαμαρείας ἀντλῆσαι ὕδωρ. λέγει αὐτῇ ὁ Ἰησοῦς· Δός μοι πεῖν·
base_translation:
  language: en
  yaml_path: translation/nt/john/004/007.yaml
  text: A woman from Samaria came to draw water. Jesus said to her[a], “Give me a drink.”
translation:
  language: ig
  text: Otu nwaanyị si Sameria bịa isere mmiri. Jizọs sịrị ya[a], “Nye m mmiri ka m ṅụọ.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n’ụzọ dabara nnọọ n’okwu Grik, “na-abịa … na-asị”; Grik ji oge ugbu a akọ ihe mere n’oge gara aga.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔρχεται
  choice: bịa
  rationale: Ọ bụ ezie na Grik ji ngwaa oge ugbu a dịka historical present n’akụkọ, oge gara aga dabara n’ụzọ Igbo si akọ akụkọ ma na-edobe usoro ihe mere.
- source_word: γυνὴ
  choice: otu nwaanyị
  rationale: N’ebe a, okwu ahụ na-ezo aka n’otu nwanyị a na-akọwabeghị, ọ bụghị kpọmkwem nwunye.
- source_word: ἐκ τῆς Σαμαρείας
  choice: si Sameria
  rationale: Nke a na-egosi ebe o si bịa n’enweghị ịgbakwụnye na amaokwu a na ọ bụ nwaanyị Sameria n’agbụrụ ma ọ bụ n’okpukpe.
- source_word: ἀντλῆσαι ὕδωρ
  choice: isere mmiri
  rationale: Infinitive ahụ na-egosi nzube; “isere mmiri” bụ okwu Igbo nkịtị maka iwepụta mmiri n’olulu mmiri.
- source_word: λέγει αὐτῇ
  choice: sịrị ya
  rationale: Dịka ἔρχεται, nke a bụ historical present; oge gara aga bụ ụzọ ebumpụta ụwa isi kọọ ya n’Igbo.
- source_word: Δός μοι πεῖν
  choice: Nye m mmiri ka m ṅụọ
  rationale: Nke a na-egosipụta arịrịọ ahụ n’Igbo doro anya ma dị ugbu a, ma na-edobe echiche nke inye ya ihe ọ ga-aṅụ.
theological_decisions:
- issue: Ihe “Sameria” na-ezo aka na ya
  choice: A sụgharịrị ya dịka nwaanyị “si Sameria,” dịka okwu Grik si kwuo.
  alternative: Ịsị “otu nwaanyị Sameria” ma ọ bụ “otu nwaanyị si n’obodo Sameria.”
  rationale: Amaokwu ahụ n’onwe ya kwuru ebe nwaanyị ahụ si, ma ọ kpọghị ya kpọmkwem nwaanyị Sameria ma ọ bụ kwuo hoo haa na Sameria bụ obodo; nsụgharị ahụ anaghị etinye nkọwa agbụrụ, okpukpe, ma ọ bụ ọdịdị ebe karịrị ihe e dere.
translation_notes:
  register: Standard Igbo nke dị ugbu a, dị nsọpụrụ ma dị mfe nghọta. E ji “nwaanyị” mee ka asụsụ ahụ bụrụ nke mmadụ nkịtị na-eji; “isere mmiri” na “Nye m mmiri ka m ṅụọ” bụ ahịrịokwu Igbo doro anya ma kwekọọ n’ihe Grik pụtara.
