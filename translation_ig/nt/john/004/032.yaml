  yaml_path: translation/nt/john/004/032.yaml
  text: But he said to them[a], “I have food to eat that you do not know.”
translation:
  language: ig
  text: Ma ọ sịrị ha, “Enwere m nri m ga-eri nke unu na-amaghị.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịtụgharị ya, “Enwere m ihe m ga-eri nke unu na-amaghị.” N'ebe a, Jizọs ji nri mee ihe atụ, dị ka okwu ndị na-esote si mee ka o doo anya.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Ma
  rationale: Ọ na-egosi obere ọdịiche n’etiti okwu ndị na-eso ụzọ na nzaghachi Jizọs.
- source_word: εἶπεν αὐτοῖς
  choice: ọ gwara ha
  rationale: Nke a bụ ụzọ Igbo si ekwu okwu a n'ụzọ doro anya ma dịkwa eke.
- source_word: Ἐγὼ
  choice: Enwere m
  rationale: Usoro a na-egosi onye mbụ nke ọma; ọnọdụ ya n'okwu ahụ na-eburu ntụnyere dị n'okwu Grik n'enweghị itinye nkwusi ike gabigara ókè.
- source_word: βρῶσιν
  choice: nri
  rationale: N'ebe a okwu ahụ pụtara ihe a na-eri, ọ bụghị omume iri nri.
- source_word: ἔχω φαγεῖν
  choice: Enwere m nri m ga-eri
  rationale: Ọ na-egosipụta inwe nri a ga-eri n'ụzọ Igbo dị mfe ma kwekọọ n'usoro echiche Grik.
- source_word: ἣν
  choice: nke
  rationale: Ọ na-ezo aka n'‘nri’ ma na-amalite nkebiokwu na-akọwa ya.
- source_word: ὑμεῖς
  choice: unu
  rationale: Ọ bụ nnọchiaha ọtụtụ mmadụ, ma ọ na-edowe ọdịiche dị n'etiti Jizọs na ndị ọ na-agwa okwu.
- source_word: οὐκ οἴδατε
  choice: unu na-amaghị
  rationale: Ọ na-edowe okwu Grik n'ụzọ kpọmkwem ma bụrụkwa Igbo a na-aghọta nke ọma.
theological_decisions:
- issue: Ihe atụ Jizọs ji ‘nri’ mee
  choice: E debere ‘nri’ n'ahịrịokwu bụ isi n'akọwaghị ihe atụ ahụ ozugbo.
  alternative: Enwere m ihe na-enye m ume nke unu na-amaghị.
  rationale: Ọnọdụ na-esote ga-akọwa ihe Jizọs pụtara; amaokwu a n'onwe ya na-edowe nghọtahie ndị na-eso ụzọ, ya mere ntụgharị ekwesịghị idozi esemokwu ahụ tupu oge ya.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta. A họọrọ ‘nri’ iji chekwaa ihe atụ na nghọtahie ndị na-eso ụzọ; a zere ịkọwa ihe Jizọs pụtara tupu amaokwu ndị na-esote.
