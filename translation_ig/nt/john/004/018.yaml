base_translation:
  language: en
  yaml_path: translation/nt/john/004/018.yaml
  text: For you have had five husbands[a], and the man you now have is not your husband; this you have said truly.
translation:
  language: ig
  text: N’ihi na i nweela di ise[a], nwoke ahụ gị na ya nọ ugbu a abụghị di gị; ihe a i kwuru bụ eziokwu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ, n’ụzọ dị nso na mkpụrụokwu Grik: “N’ihi na i nweela ndị nwoke ise, nwoke ahụ gị na ya nọ ugbu a abụghị nwoke gị/di gị.” Okwu Grik ἀνήρ nwere ike ịpụta “nwoke” ma ọ bụ “di”; n’ebe a, ọnọdụ okwu ahụ na-akwado “di.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: πέντε
  choice: ise
  rationale: Ọnụọgụ a pụtara kpọmkwem “ise” ma na-akọwa ọnụ ọgụgụ ndị di ya.
- source_word: γὰρ
  choice: N’ihi na
  rationale: Ọ na-egosi ihe mere Jizọs ji kwuo na nwanyị ahụ kwuru eziokwu.
- source_word: ἄνδρας
  choice: di
  rationale: Ọ bụ ezie na ἀνήρ nwekwara ike ịpụta “nwoke,” ọnọdụ okwu gbasara alụmdi na nwunye na-eme ka “di” bụrụ nghọta kacha kwekọọ ebe a.
- source_word: ἔσχες
  choice: i nweela
  rationale: Ụdị ngwaa a na-eleghachi anya n’akụkọ ndụ ya gara aga nke ka metụtara ọnọdụ ya ugbu a; “i nweela” na-egosipụta nke a n’Igbo n'ụzọ dị mma.
- source_word: νῦν
  choice: ugbu a
  rationale: Ọ na-egosi ọnọdụ nwanyị ahụ n’oge ahụ.
- source_word: ὃν ἔχεις
  choice: nwoke ahụ gị na ya nọ
  rationale: N’ọnọdụ mmekọrịta a, okwu Igbo a na-ada nke ọma ma na-ezere nghọta nke inwe mmadụ dịka ihe onwunwe.
- source_word: οὐκ ἔστιν σου ἀνήρ
  choice: abụghị di gị
  rationale: Ọ na-egosi n'ụzọ doro anya na nwoke ahụ abụghị di nwanyị ahụ n’alụmdi na nwunye.
- source_word: τοῦτο ἀληθὲς εἴρηκας
  choice: ihe a i kwuru bụ eziokwu
  rationale: Nsụgharị a na-ezo aka n’okwu nwanyị ahụ kwuru ma na-edobe nkwenye Jizọs nyere na ọ bụ eziokwu.
theological_decisions:
- issue: Ihe ἀνήρ pụtara n’ebe abụọ ọ pụtara
  choice: A sụgharịrị nke mbụ “di,” ma nke abụọ pụta n’ahịrịokwu “abụghị di gị.”
  alternative: Ịsụgharị ha dịka “nwoke/ndị nwoke.”
  rationale: Ọnọdụ okwu ahụ na-ekwu banyere ndị di nwanyị ahụ lụrụ na mmekọrịta ya ugbu a nke na-abụghị alụmdi na nwunye. Nhọrọ “di” na-ekwupụta nghọta ahụ n’enweghị ịgbakwunye ozizi ọzọ.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “Gị na ya nọ” na-ekwupụta mmekọrịta dị ugbu a n’ụzọ ebumpụta ụwa, ebe akara ala na-edobe nhọrọ nkịtị “nwoke” nke okwu Grik nwere ike ịpụta.
