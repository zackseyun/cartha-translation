source:
  edition: SBLGNT
  text: Ἠκολούθει δὲ τῷ Ἰησοῦ Σίμων Πέτρος ⸀καὶ ἄλλος μαθητής. ὁ δὲ μαθητὴς ἐκεῖνος ἦν γνωστὸς τῷ ἀρχιερεῖ καὶ συνεισῆλθεν τῷ Ἰησοῦ εἰς τὴν αὐλὴν τοῦ ἀρχιερέως,
base_translation:
  language: en
  yaml_path: translation/nt/john/018/015.yaml
  text: Simon Peter was following Jesus[a], and so was another disciple. That disciple was known to the high priest, and he went in with Jesus into the courtyard of the high priest,
translation:
  language: ig
  text: Saịmọn Pita nọ na-eso Jizọs[a], onye ọzọ na-eso ụzọ sokwa na-eso ya. Onye na-eso ụzọ ahụ bụ onye onyeisi nchụaja maara, ọ wee soro Jizọs banye n’ogige ụlọ onyeisi nchụaja ahụ,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n’ụzọ na-agbasochi usoro okwu Grik anya karị, “Saịmọn Pita na onye ọzọ na-eso ụzọ nọ na-eso Jizọs.” Grik ekwughachighị ngwaa ahụ maka onye nke abụọ, kama ọ hapụrụ ka a ghọta na ya onwe ya sokwa na-eso Jizọs.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἠκολούθει
  choice: nọ na-eso
  rationale: Ụdị ngwaa imperfect na-egosi omume na-aga n’ihu n’akụkọ ahụ; “nọ na-eso” na-echekwa echiche ahụ karịa naanị “soro.”
- source_word: δὲ
  choice: (asụgharịghị ya iche)
  rationale: N’ebe a, ọ bụ njikọ dị nro na-aga n’ihu n’akụkọ. Igbo anaghị achọ okwu pụrụ iche n’isi ahịrịokwu a, ya mere nhazi ahịrịokwu ahụ na-eburu ọrụ njikọ ya n’enweghị itinye “ugbu a” na-adịghị na isi mmalite ahụ.
- source_word: καὶ ἄλλος μαθητής
  choice: onye ọzọ na-eso ụzọ Jizọs sokwa na-eso ya
  rationale: Nke a na-eme ka omume nke onye nke abụọ, nke Grik hapụrụ ka a ghọta ya site n’ihe e kwuru banyere Pita, doo anya n’Igbo dị ndụ.
- source_word: μαθητής
  choice: onye na-eso ụzọ Jizọs
  rationale: Nke a bụ okwu Igbo doro anya maka onye na-amụta ihe n’aka Jizọs ma na-eso ya; ịkpọ Jizọs aha na-egbochi mgbagwoju anya.
- source_word: ἐκεῖνος
  choice: onye ahụ
  rationale: Ọ na-atụ aka azụ n’ebe “onye ọzọ na-eso ụzọ Jizọs” nọ, dịka ngosipụta Grik ahụ si eme.
- source_word: γνωστὸς
  choice: bụ onye onyeisi nchụaja maara
  rationale: Ọ na-egosi na onyeisi nchụaja maara onye ahụ, ma ọ naghị ekwu ókè mmekọrịta ha ruru; ya mere, e tinyebeghị echiche dịka “ezigbo enyi” ma ọ bụ “onye ọ maara nke ọma.”
- source_word: ἀρχιερεῖ / ἀρχιερέως
  choice: onyeisi nchụaja
  rationale: Ọ bụ okwu Igbo kwesịrị ekwesị maka onye nchụaja kachasị elu, a na-edobekwa otu onye ahụ n’ebe abụọ a.
- source_word: συνεισῆλθεν
  choice: ọ wee soro Jizọs banye
  rationale: “Soro ... banye” na-echekwa echiche nke ịbanye ọnụ nke dị na nganiihu σύν, ebe “wee” na-aga n’ihu n’usoro akụkọ ahụ.
- source_word: αὐλήν
  choice: ogige ụlọ
  rationale: Ọ na-ezo aka n’ogige e mechiri emechi nke ụlọ onyeisi nchụaja; “ogige ụlọ” doro ndị na-agụ Igbo anya ma ọ naghị agbakwunye echiche nke obí eze.
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A kọwara omume onye nke abụọ n’ahịrịokwu bụ isi ka Igbo wee daa nke ọma, ebe nkọwa ala peeji na-echekwa usoro dị nkenke na ihe Grik hapụrụ ka a ghọta. E jighị okwu ọ bụla kpebie onye “onye ọzọ na-eso ụzọ Jizọs” ahụ bụ.
