  text: εἱστήκεισαν δὲ οἱ δοῦλοι καὶ οἱ ὑπηρέται ἀνθρακιὰν πεποιηκότες, ὅτι ψῦχος ἦν, καὶ ἐθερμαίνοντο· ἦν δὲ ⸂καὶ ὁ Πέτρος μετ’ αὐτῶν⸃ ἑστὼς καὶ θερμαινόμενος.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/018.yaml
  text: The servants and the officers were standing there[a], having made a charcoal fire because it was cold, and they were warming themselves[b]. Peter also was standing with them and warming himself.
translation:
  language: ig
  text: Ndị ohu[a] na ndị nche[b] nọ ebe ahụ guzo. Ha mụnyere ọkụ unyi n’ihi na oyi na-atụ, ha nọkwa na-ekpo ahụ. Pita kwa nọnyere ha, guzo na-ekpo ahụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “ndị na-eje ozi”; okwu Grik a nwere ike ịpụta ndị ohu ma ọ bụ ndị na-eje ozi, dabere n’ọnọdụ.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya “ndị ọrụ ọchịchị”; okwu a na-ezo aka ná ndị na-eje ozi n’ọrụ gọọmenti ma ọ bụ n’ụlọ ndị isi, ikekwe ndị metụtara ụlọ nsọ ma ọ bụ ụlọ nnukwu onye nchụàjà.
    reason: lexical_alternative
lexical_decisions:
- source_word: δοῦλοι
  choice: ndị ohu
  rationale: Okwu a na-egosi ndị nọ n’okpuru onye nwe ha; “ndị ohu” na-echekwa ọnọdụ mmekọrịta mmadụ nke okwu Grik ahụ nwere ike ịpụta n’ebe a.
- source_word: ὑπηρέται
  choice: ndị nche
  rationale: N’akwụkwọ Jọn, okwu a na-ezokarị aka n’ebe ndị ọrụ ọchịchị ma ọ bụ ndị e nyere ọrụ ijide ma chekwaa mmadụ nọ; “ndị nche” dabara n’ọnọdụ ụlọ nnukwu onye nchụàjà, ma nkọwa ala peeji na-echekwa nhọrọ sara mbara.
- source_word: ἀνθρακιὰν
  choice: ọkụ unyi
  rationale: Nke a na-ezipụta kpọmkwem ọkụ e ji unyi mụnye, nkọwa dị mkpa n’akụkọ Jọn.
- source_word: πεποιηκότες
  choice: Ha mụnyere
  rationale: Ọ na-egosi ihe ha merela nke nsonaazụ ya—ọkụ ahụ—ka dị ugbu a; nkewa ahịrịokwu ahụ na-eme ka Igbo bụrụ nke eke.
- source_word: ὅτι ψῦχος ἦν
  choice: n’ihi na oyi na-atụ
  rationale: Ọ na-echekwa ihe kpatara ha ji mụnye ọkụ, ma jiri ụzọ ndị Igbo si ekwu ọnọdụ oyi.
- source_word: ἐθερμαίνοντο
  choice: ha nọkwa na-ekpo ahụ
  rationale: “Nọ na-” na-egosi omume na-aga n’ihu, “ikpo ahụ” na-enyekwa nghọta reflexive nke ụdị Grik ahụ.
- source_word: ἦν δὲ καὶ ὁ Πέτρος μετ’ αὐτῶν
  choice: Pita sokwa ha
  rationale: “Sokwa” na-echekwa ma echiche nke Pita ịnọnyere ha ma nke καί, ya bụ na Pita bụkwa otu n’ime ndị nọ ebe ahụ.
- source_word: ἑστὼς
  choice: guzoro ebe ahụ
  rationale: Ọ na-egosi ọnọdụ Pita n’ụzọ doro anya ma kwekọọ na ọnọdụ ndị ahụ e kwuru na mbụ.
- source_word: θερμαινόμενος
  choice: na-ekpo ahụ
  rationale: Ọ na-echekwa omume Pita nke na-aga n’ihu ma na-eme ka ntụnyere ya na ndị ọzọ pụta ìhè.
- source_word: δέ
  choice: ejighị okwu pụrụ iche sụgharịa ya
  rationale: δέ bụ njikọ dị nro n’ebe a; usoro ahịrịokwu Igbo na-aga nke ọma n’enweghị itinye “ugbu a” ma ọ bụ ime ka ọdịiche sie ike karịa isi mmalite.
