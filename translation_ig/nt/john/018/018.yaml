revisions:
- from: Ndị ohu[a] na ndị nche[b] guzoro ebe ahụ. Ha mụnyere ọkụ unyi n’ihi na oyi na-atụ, ha nọkwa na-ekpo ahụ. Pita sokwa ha guzoro ebe ahụ na-ekpo ahụ.
  to: Ndị ohu[a] na ndị nche[b] nọ ebe ahụ guzo. Ha mụnyere ọkụ unyi n’ihi na oyi na-atụ, ha nọkwa na-ekpo ahụ. Pita kwa nọnyere ha, guzo na-ekpo ahụ.
  rationale: The revision makes Peter’s presence with the others explicit and represents the ongoing standing-state more naturally, while preserving the source’s sequence, causal relation, and lexical distinctions. The footnotes retain the intended alternatives and clarify the institutional scope of ὑπηρέται without making a stronger historical claim than the text supports.
