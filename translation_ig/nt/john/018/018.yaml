translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị mfe ma dị ùgwù mee ya. E kewara participial construction mbụ ka ọ bụrụ ahịrịokwu abụọ iji mee ka ọ bụrụ Igbo eke, ebe a ka chekwara usoro ihe omume, oyi, ọkụ unyi, na omume na-aga n’ihu. Ihe nrịbama ala peeji [a] na [b] dị n’akụkụ okwu ha na-akọwa.
