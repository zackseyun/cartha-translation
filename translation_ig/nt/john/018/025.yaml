    reason: lexical_alternative
  revision_rationale: The revision more closely follows the Greek aspect and ellipsis while maintaining clear modern Standard Igbo. It does not add “by the fire,” does not overstate δέ, and retains the question’s expectation of a negative reply and Peter’s terse denial.
