base_translation:
  language: en
  yaml_path: translation/nt/john/018/025.yaml
  text: Simon Peter was standing and warming himself. So they said to him[a], “You are not also one of his disciples, are you?” He denied it and said, “I am not.”
translation:
  language: ig
  text: Saịmọn Pita nọ na-eguzo, na-ekpo ọkụ n’ahụ. Ya mere, ha sịrị ya[a], “Gị kwa ọ̀ bụghị otu n’ime ndị na-eso ụzọ ya?” Ọ gọrọ agọ wee sị, “Abụghị m.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “N’ezie, gị kwa abụghị otu n’ime ndị na-eso ụzọ ya, ọ̀ bụghị ya?” Ajụjụ Grik e ji μή malite na-atụ anya azịza na-adịghị mma.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἦν δὲ
  choice: Saịmọn Pita guzoro
  rationale: δέ bụ njikọ dị nro na-aga n’ihu n’akụkọ ahụ; Igbo achọghị ka a tinye okwu pụrụ iche n’isi ahịrịokwu. Ἦν na participle zuru oke na-egosi ọnọdụ na-aga n’ihu, nke ‘guzoro’ na-ebute n'ụzọ eke.
- source_word: ἑστὼς καὶ θερμαινόμενος
  choice: guzoro na-ekpo ahụ ọkụ
  rationale: Nke a na-echekwa ma ọnọdụ Pita guzoro ma omume ya na-aga n’ihu. E tinyeghị ‘n’akụkụ ọkụ’ n’ihi na ọ bụ ezie na gburugburu amaokwu na-egosi ya, okwu ndị ahụ adịghị n’amaokwu a.
- source_word: εἶπον οὖν αὐτῷ
  choice: Ya mere, ha sịrị ya
  rationale: οὖν na-egosi njikọ ma ọ bụ ihe si n’ihe gara aga pụta; ‘Ya mere’ na-echekwa njikọ ahụ n’Igbo doro anya.
- source_word: Μὴ καὶ σὺ ... εἶ;
  choice: Ọ̀ bụghị na gị onwe gị sokwa ...?
  rationale: Ajụjụ nwere μή na-atụ anya azịza na-adịghị mma. ‘Ọ̀ bụghị na ...?’ na-egosipụta atụmanya ahụ, ‘gị onwe gị’ na ‘sokwa’ na-anọchi καὶ σύ.
- source_word: ἐκ τῶν μαθητῶν αὐτοῦ
  choice: ná ndị na-eso ụzọ ya
  rationale: ἐκ na genitive na-egosi ịbụ onye so n’otu; usoro Igbo a na-egosi n'ụzọ eke na a na-ajụ ma Pita ọ̀ bụ otu n’ime ndị na-eso ụzọ ya.
- source_word: ἠρνήσατο ἐκεῖνος
  choice: Ọ gọnahụrụ ya
  rationale: ‘Gọnahụrụ’ na-enye echiche nke ịjụ ikweta ihe a jụrụ ya. ‘Ya’ na-ezo aka n’ihe e kwuru, ọ bụghị na Jizọs, ka a ghara ịgbasa ihe Grik kwuru.
- source_word: Οὐκ εἰμί
  choice: Esoghị m
  rationale: Azịza Grik dị mkpirikpi ma na-ahapụ ihe a na-ekwu n’ime ajụjụ ka a ghọta ya. ‘Esoghị m’ bụ azịza Igbo dị mkpirikpi nke pụtara na ọ bụghị otu n’ime ha, na-enweghị itinye nkọwa ọzọ.
theological_decisions:
- issue: Ụdị ngọnahụ Pita
  choice: E gosipụtara ya dịka ngọnahụ na ọ bụ otu n’ime ndị na-eso ụzọ Jizọs.
  alternative: Ịsụgharị ya n’uju dịka ‘Abụghị m otu n’ime ha.’
  rationale: Grik dị nkenke ma dabere n’okwu ajụjụ gara aga. ‘Esoghị m’ na-echekwa mkpụmkpụ na ike nke azịza ahụ n’Igbo n’etinyeghị nkwupụta nkà mmụta okpukpe sara mbara.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E jighị okwu ụka pụrụ iche. Akara ụda dị mkpa n’ajụjụ ka e tinyere iji mee ka a gụọ ya nke ọma.
