revisions:
- from: Saịmọn Pita guzoro na-ekpo ahụ ọkụ. Ya mere, ha sịrị ya[a], “Ọ̀ bụghị na gị onwe gị sokwa ná ndị na-eso ụzọ ya?” Ọ gọnahụrụ ya wee sị, “Esoghị m.”
  to: Saịmọn Pita nọ na-eguzo, na-ekpo ọkụ n’ahụ. Ya mere, ha sịrị ya[a], “Gị kwa ọ̀ bụghị otu n’ime ndị na-eso ụzọ ya?” Ọ gọrọ agọ wee sị, “Abụghị m.”
  rationale: The revision more closely follows the Greek aspect and ellipsis while maintaining clear modern Standard Igbo. It does not add “by the fire,” does not overstate δέ, and retains the question’s expectation of a negative reply and Peter’s terse denial.
  reviewer_model: gpt-5.6-terra
