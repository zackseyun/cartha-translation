id: JHN.18.1
reference: John 18:1
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ταῦτα ⸀εἰπὼν Ἰησοῦς ἐξῆλθεν σὺν τοῖς μαθηταῖς αὐτοῦ πέραν τοῦ χειμάρρου ⸀τοῦ Κεδρὼν ὅπου ἦν κῆπος, εἰς ὃν εἰσῆλθεν αὐτὸς καὶ οἱ μαθηταὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/001.yaml
  text: After saying these things[a], Jesus went out with his disciples across the Kidron Valley, where there was a garden, into which he and his disciples entered.
translation:
  language: ig
  text: Mgbe Jizọs kwusịrị ihe ndị a, ya na ndị na-eso ụzọ ya pụrụ gafere iyi Kidrọn[a] gaa ebe otu ubi dị; ya na ndị na-eso ụzọ ya banyere n’ime ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ndagwurugwu Kidrọn.” Okwu Grik a na-ezo aka n’iyi mmiri na-adị naanị n’oge mmiri ozuzo.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταῦτα εἰπὼν
  choice: Mgbe Jizọs kwusịrị ihe ndị a
  rationale: A sụgharịrị nkebi aorist participle dị ka nkebi oge n’Igbo. Nke a na-egosi na ọpụpụ ahụ sochiri okwu Jizọs kwuru, ma ọ na-ada ka Igbo a na-asụ ugbu a.
- source_word: ἐξῆλθεν
  choice: pụrụ
  rationale: ‘Pụrụ’ na-echekwa echiche kpọmkwem nke ịpụ apụ, kama iji okwu ga-akọwa ya dịka ịla kpamkpam.
- source_word: σὺν τοῖς μαθηταῖς αὐτοῦ
  choice: ya na ndị na-eso ụzọ ya
  rationale: Nke a na-egosi n’ụzọ doro anya na ndị na-eso ụzọ ya so ya, ma bụrụkwa okwu Igbo nkịtị na nke ugwu.
- source_word: πέραν τοῦ χειμάρρου τοῦ Κεδρών
  choice: gafee iyi Kidrọn[a]
  rationale: ‘Gafee’ na-egosi ịga n’akụkụ nke ọzọ. ‘Iyi’ na-enye nghọta dị mfe banyere χείμαρρος, ebe nkọwa ala ahụ dịka ndagwurugwu ma ọ bụ ụzọ mmiri nke oge ụfọdụ ka edobere n’ala peeji.
- source_word: ὅπου ἦν κῆπος
  choice: ruo ebe e nwere otu ubi
  rationale: ‘Ubi’ bụ okwu Igbo sara mbara ma dị mfe nghọta maka κῆπος; ‘ebe e nwere’ na-echekwa ụzọ Grik si kwuo na ubi ahụ dị n’ebe ahụ.
- source_word: εἰς ὃν εἰσῆλθεν
  choice: wee banye n’ime ubi ahụ
  rationale: ‘Banye n’ime’ na-echekwa ntụziaka nke εἰς na omume ịbanye nke εἰσῆλθεν, ebe ịkpọghachi ‘ubi ahụ’ na-eme ka ahịrịokwu ahụ doo anya n’Igbo.
- source_word: αὐτὸς καὶ οἱ μαθηταὶ αὐτοῦ
  choice: ya na ndị na-eso ụzọ ya
  rationale: Nke a na-anọchi anya isiokwu ahụ doro anya n’ụzọ ebumpụta ụwa, na-enweghị itinye nkwusi ike pụrụ iche nke ‘ya onwe ya’ nke ihe gbara ya gburugburu na-adịghị achọ.
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe nghọta ma nwee ugwu, dee ya. A họọrọ ‘ndị na-eso ụzọ’ maka μαθηταί, ma degharịa aha Κεδρών dịka ‘Kidrọn.’ E tinyere akara ala peeji ozugbo n’akụkụ okwu ọ na-akọwa.
