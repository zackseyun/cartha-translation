review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the temporal participle, Jesus’ departure with his disciples, crossing to the far side of the Kidron watercourse, the presence of a garden, and the joint entry into it. A small syntactic revision makes the sequence of movement and the garden’s location clearer in Standard Igbo.
  naturalness: “Pụrụ, gafee ... ruo ebe e nwere” is understandable but is less smooth as a serial-verb construction and can make the garden sound like a separate destination after the crossing. “Pụrụ ... gafere ... gaa ebe otu ubi dị” is more natural and precise. Replacing the repeated noun with “n’ime ya” is idiomatic while retaining the garden as the antecedent.
  terminology: “Ndị na-eso ụzọ” suitably renders μαθηταί, “Kidrọn” appropriately transliterates Κεδρών, and “iyi” is an appropriate primary rendering of χειμάρρος. The note should identify the seasonal-watercourse sense in more idiomatic Igbo and retain “ndagwurugwu” only as an alternative rendering, not as the main lexical definition.
  issues:
  - severity: low
    issue: The movement clause is slightly awkward.
    rationale: The sequence “pụrụ, gafee iyi ... ruo ebe e nwere otu ubi” is not the clearest modern Standard Igbo representation of Jesus’ going out, crossing, and arriving where the garden was.
  - severity: low
    issue: The footnote’s description of a seasonal watercourse is unnatural.
    rationale: “Ụzọ mmiri nke na-enwekarị mmiri” is understandable, but “iyi mmiri na-adị naanị n’oge mmiri ozuzo” more naturally communicates the lexical sense of χειμάρρος.
  revised_text: Mgbe Jizọs kwusịrị ihe ndị a, ya na ndị na-eso ụzọ ya pụrụ gafere iyi Kidrọn[a] gaa ebe otu ubi dị; ya na ndị na-eso ụzọ ya banyere n’ime ya.
  revised_footnotes:
