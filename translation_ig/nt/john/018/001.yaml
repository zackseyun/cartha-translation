    text: Ma ọ bụ, “ndagwurugwu Kidrọn.” Okwu Grik a na-ezo aka n’iyi mmiri na-adị naanị n’oge mmiri ozuzo.
    reason: lexical_alternative
  revision_rationale: The revision preserves every source-language element while improving the serial-verb flow, making the relation of the garden to the crossing explicit, and refining the lexical footnote into natural Standard Igbo. No theological interpretation has been introduced.
