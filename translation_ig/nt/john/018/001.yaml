revisions:
- from: Mgbe Jizọs kwusịrị ihe ndị a, ya na ndị na-eso ụzọ ya pụrụ, gafee iyi Kidrọn[a], ruo ebe e nwere otu ubi; ya na ndị na-eso ụzọ ya wee banye n’ime ubi ahụ.
  to: Mgbe Jizọs kwusịrị ihe ndị a, ya na ndị na-eso ụzọ ya pụrụ gafere iyi Kidrọn[a] gaa ebe otu ubi dị; ya na ndị na-eso ụzọ ya banyere n’ime ya.
  rationale: The revision preserves every source-language element while improving the serial-verb flow, making the relation of the garden to the crossing explicit, and refining the lexical footnote into natural Standard Igbo. No theological interpretation has been introduced.
