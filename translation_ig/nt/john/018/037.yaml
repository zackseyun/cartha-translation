id: JHN.18.37
reference: John 18:37
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἶπεν οὖν αὐτῷ ὁ Πιλᾶτος· Οὐκοῦν βασιλεὺς εἶ σύ; ἀπεκρίθη ⸀ὁ Ἰησοῦς· Σὺ λέγεις ὅτι βασιλεύς ⸀εἰμι. ἐγὼ εἰς τοῦτο γεγέννημαι καὶ εἰς τοῦτο ἐλήλυθα εἰς τὸν κόσμον ἵνα μαρτυρήσω τῇ ἀληθείᾳ· πᾶς ὁ ὢν ἐκ τῆς ἀληθείας ἀκούει μου τῆς φωνῆς.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/037.yaml
  text: 'Then Pilate said to him[a], “So then, are you a king?” Jesus answered, “You say that I am a king. For this I have been born, and for this I have come into the world: that I should bear witness to the truth. Everyone who is of the truth listens to my voice.”'
translation:
  language: ig
  text: 'Mgbe ahụ Paịlet sịrị ya, “Ya bụ, ị bụ eze?” Jizọs zara, “Gị na-ekwu na abụ m eze.[a] Ọ bụ maka nke a ka a mụrụ m, ọ bụkwa maka nke a ka m bịara n’ụwa: ka m gbaa eziokwu akaebe. Onye ọ bụla sitere n’eziokwu na-ege olu m ntị.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ịsụ ya, “I kwuru ya: abụ m eze,” ma ọ bụ, “I kwuru eziokwu na abụ m eze.” Okwu Grik ahụ dị mkpirikpi, a pụkwara ịghọta ya dịka nkwenye e ji nwayọ kwuo.'
    reason: alternative_reading
lexical_decisions:
- source_word: Οὐκοῦν
  choice: Ya bụ
  rationale: Ọ na-egosi na Paịlet na-ewepụta nkwubi okwu site n’ihe e kwuru tupu nke a, ma ọ na-ada ka Igbo a na-asụ ugbu a.
- source_word: βασιλεὺς
  choice: eze
  rationale: Nke a bụ okwu Igbo kwụ ọtọ maka βασιλεύς, ọ na-echekwa ma echiche ọchịchị ma echiche Mesaya dị n’ajụjụ Paịlet.
- source_word: Σὺ λέγεις ὅτι βασιλεύς εἰμι
  choice: Gị na-ekwu na abụ m eze
  rationale: Nsụgharị a na-anọ ihe odide Grik nso ma hapụ okwu Jizọs ka ọ nọgide nwee nghọta karịrị otu, kama ime ya nkwenye siri ike ma ọ bụ ịgọnahụ.
- source_word: γεγέννημαι
  choice: a mụrụ m
  rationale: Nke a na-egosipụta ọmụmụ Jizọs n’ụzọ doro anya ma ghara itinye echiche pụrụ iche nke okwu ahụ anaghị achọ n’ebe a.
- source_word: ἐλήλυθα εἰς τὸν κόσμον
  choice: m bịara n’ụwa
  rationale: Ọ na-echekwa okwu gbasara ọbịbịa Jizọs n’ụwa na ọrụ ya, ma na-ada nke ọma n’Igbo.
- source_word: μαρτυρήσω τῇ ἀληθείᾳ
  choice: ka m gbaara eziokwu akaebe
  rationale: “Ịgba akaebe” na-echekwa asụsụ ikpe na ịgba ama nke Jọn ji eme ihe, ebe “ka” na-egosi nzube.
- source_word: πᾶς ὁ ὢν ἐκ τῆς ἀληθείας
  choice: Onye ọ bụla sitere n’eziokwu
  rationale: “Sitere” na-echekwa echiche isi mmalite ma ọ bụ njikọ dị na ἐκ, n’agbanyeghị na ọ bụ okwu nwere omimi n’akwụkwọ Jọn.
- source_word: ἀκούει μου τῆς φωνῆς
  choice: na-ege olu m ntị
  rationale: Nke a na-egosi ịnụ ihe nke na-esochi nnabata na nrube isi, ma na-echekwa “olu m” dịka ihe odide ahụ siri kwuo.
theological_decisions:
- issue: Ụdị nkwenye dị n’azịza Jizọs nye Paịlet
  choice: E debere ya dịka “Gị na-ekwu na abụ m eze,” nke nwere ike ịbụ nkwenye e ji oke kwuo.
  alternative: '“I kwuru ya: abụ m eze,” ma ọ bụ “I kwuru eziokwu na abụ m eze.”'
  rationale: Okwu Grik ahụ dị mkpirikpi, ọ pụkwara ịpụta nkwenye e ji oke kwuo. Isi ihe odide ahụ anaghị eme ya nkwenye siri ike ma ọ bụ okwu ịjụ; nkọwa ala peeji na-echekwa ụzọ ndị ọzọ e nwere ike isi ghọta ya.
- issue: Ọmụmụ Jizọs na ọbịbịa ya n’ụwa
  choice: 'E debere ahịrịokwu abụọ ahụ iche: “a mụrụ m” na “m bịara n’ụwa.”'
  alternative: Ịchịkọta ha ka ha bụrụ naanị otu nkwupụta banyere ozi ya.
  rationale: Jọn kewapụtara ọmụmụ ya na ọbịbịa ya n’ụwa. Idebe ha abụọ na-echekwa nghọta nwere ike ịdị n’okwu ahụ n’etinyeghị nkọwa ozizi ọzọ.
translation_notes:
  register: E ji Igbo Izugbe dị ugbu a, nke dị ugwu ma dị mfe nghọta. E jiri “ịgba akaebe” chekwaa asụsụ ịgba ama nke Jọn, ma e zere ịkọwa okwu Jizọs n’ụzọ ga-emechi nghọta ya n’otu akụkụ.
