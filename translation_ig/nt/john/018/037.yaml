revisions:
- from: 'Mgbe ahụ Paịlet sịrị ya, “Ya bụ, ị bụ eze?” Jizọs zara, “Gị na-ekwu na abụ m eze.[a] Ọ bụ n’ihi nke a ka a mụrụ m, ọ bụkwa n’ihi nke a ka m bịara n’ụwa: ka m gbaara eziokwu akaebe. Onye ọ bụla sitere n’eziokwu na-ege olu m ntị.”'
  to: 'Mgbe ahụ Paịlet sịrị ya, “Ya bụ, ị bụ eze?” Jizọs zara, “Gị na-ekwu na abụ m eze.[a] Ọ bụ maka nke a ka a mụrụ m, ọ bụkwa maka nke a ka m bịara n’ụwa: ka m gbaa eziokwu akaebe. Onye ọ bụla sitere n’eziokwu na-ege olu m ntị.”'
  rationale: 'The revision makes only two safe linguistic adjustments: it renders the two εἰς τοῦτο clauses with the purposive “maka nke a,” and it corrects the Igbo purpose-clause verb to “ka m gbaa.” The footnote is lightly smoothed while retaining the same alternatives and the source text’s ambiguity.'
