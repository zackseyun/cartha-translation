review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately preserves Pilate’s inferential question, the ambiguity of Jesus’ reply, the distinct references to birth and coming into the world, and the Johannine expression “from/of the truth.” The purpose clause requires a small grammatical correction: Greek ἵνα μαρτυρήσω expresses purpose, best represented here by Igbo “ka m gbaa … akaebe,” rather than “ka m gbaara … akaebe.” “Maka nke a” also expresses εἰς τοῦτο (purpose) more directly than “n’ihi nke a.”'
  naturalness: The text is generally clear Standard Igbo and maintains an appropriate dignified register. Correcting the purpose-clause verb to “gbaa” makes the sentence idiomatic and grammatically natural. Repeating “maka nke a” gives a clear, balanced rendering of the two parallel Greek clauses.
  terminology: “Eze,” “eziokwu,” “ụwa,” and “olu m” are appropriate. “Ịgba akaebe” suitably retains the testimonial/legal resonance of μαρτυρέω. The footnote appropriately preserves the interpretive range of Σὺ λέγεις without forcing it into either denial or an unqualified affirmation.
  issues:
  - severity: medium
    issue: Purpose-clause verb form
    rationale: In “ka m gbaara eziokwu akaebe,” “gbaara” is not the appropriate form for the prospective purpose introduced by “ka.” Use “ka m gbaa eziokwu akaebe,” which naturally renders ἵνα μαρτυρήσω.
  - severity: low
    issue: Goal nuance of εἰς τοῦτο
    rationale: “N’ihi nke a” can mean “because of this,” whereas εἰς τοῦτο marks purpose (“for this”). “Maka nke a” communicates the intended purpose more directly in contemporary Standard Igbo.
  revised_text: 'Mgbe ahụ Paịlet sịrị ya, “Ya bụ, ị bụ eze?” Jizọs zara, “Gị na-ekwu na abụ m eze.[a] Ọ bụ maka nke a ka a mụrụ m, ọ bụkwa maka nke a ka m bịara n’ụwa: ka m gbaa eziokwu akaebe. Onye ọ bụla sitere n’eziokwu na-ege olu m ntị.”'
  revised_footnotes:
  - marker: a
    text: 'A pụkwara ịsụ ya, “I kwuru ya: abụ m eze,” ma ọ bụ, “I kwuru eziokwu na abụ m eze.” Okwu Grik ahụ dị mkpirikpi, a pụkwara ịghọta ya dịka nkwenye e ji nwayọ kwuo.'
    reason: alternative_reading
