review_pass:
  verdict: revise
  source_fidelity: The draft conveys the speaker’s identity, his kinship to the injured man, Peter’s prior cutting off of the ear, and the question’s expected affirmative answer. However, the genitive relation in “the high priest’s slaves” needs explicit Igbo marking, and the final wording should make clear that the person addressed was with Jesus rather than risk reading “I saw you and him.”
  naturalness: “Otu n’ime ndị ohu nnukwu onye nchụàjà” lacks the needed linker and is not natural Standard Igbo. The proposed revision uses “ndị ohu nke nnukwu onye nchụàjà.” The focused question is recast idiomatically as “Ọ̀ bụghị m ka hụrụ gị …, mgbe gị na ya nọ?”
  terminology: “ndị ohu” appropriately retains the bonded-status sense of δοῦλοι/δούλων in this household setting. “nnukwu onye nchụàjà,” “onye ikwu,” “Pita,” and “ubi” are suitable Standard Igbo renderings in context. The footnote must not identify the inflected source form δούλων as δοῦλοι; it should identify the lemma δοῦλος and note the form used here.
  issues:
  - severity: medium
    issue: Missing genitive linker after “ndị ohu”
    rationale: The Greek τοῦ ἀρχιερέως means “of the high priest.” Igbo requires “ndị ohu nke nnukwu onye nchụàjà” for a clear and natural possessive relation.
  - severity: medium
    issue: Ambiguity in “hụrụ gị na ya”
    rationale: This can be read as “saw you and him,” rather than specifically seeing the addressed person while he was with Jesus. “mgbe gị na ya nọ” clearly preserves μετ’ αὐτοῦ.
  - severity: low
    issue: Footnote cites the wrong Greek form as the word under discussion
    rationale: The text has δούλων, while δοῦλοι is nominative plural. Referring to the lemma δοῦλος, with the contextual form δούλων, is accurate and reader-friendly.
  revised_text: Otu n’ime ndị ohu nke nnukwu onye nchụàjà, ebe ọ bụ onye ikwu nwoke ahụ Pita bepụrụ ntị ya, sịrị, “Ọ̀ bụghị m ka hụrụ gị n’ubi ahụ, mgbe gị na ya nọ?”
  revised_footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “ndị na-eje ozi.” Okwu Grik ahụ bụ δοῦλος (doulos; n’ebe a, δούλων), nke nwere ike ịpụta “ohu” ma ọ bụ “onye na-eje ozi,” dabere n’ọnọdụ e ji ya mee ihe; ebe a, “ndị ohu” na-egosipụta ọnọdụ ha dị ka ndị nọ n’agbụ nke ọma.
    reason: lexical_alternative
  revision_rationale: The revision supplies the required possessive linker, makes the question’s “with him” relation unambiguous, and corrects the Greek-form explanation in the footnote. It otherwise preserves the source’s participial identification, emphatic rhetorical question, and modern Standard Igbo register.
