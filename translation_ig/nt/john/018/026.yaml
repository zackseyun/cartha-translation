id: JHN.18.26
reference: John 18:26
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: λέγει εἷς ἐκ τῶν δούλων τοῦ ἀρχιερέως, συγγενὴς ὢν οὗ ἀπέκοψεν Πέτρος τὸ ὠτίον· Οὐκ ἐγώ σε εἶδον ἐν τῷ κήπῳ μετ’ αὐτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/john/018/026.yaml
  text: One of the high priest’s servants[a], being a relative of the man whose ear Peter had cut off, said, “Didn’t I see you in the garden with him?”
translation:
  language: ig
  text: Otu n’ime ndị ohu nke nnukwu onye nchụàjà, ebe ọ bụ onye ikwu nwoke ahụ Pita bepụrụ ntị ya, sịrị, “Ọ̀ bụghị m ka hụrụ gị n’ubi ahụ, mgbe gị na ya nọ?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δούλων
  choice: ndị ohu
  rationale: N’ọnọdụ a, okwu ahụ na-ezo aka ná ndị nọ n’okpuru nnukwu onye nchụàjà dị ka ihe onwunwe ezinụlọ ya; ‘ndị ohu’ na-echekwa ọnọdụ agbụ ahụ karịa ‘ndị na-eje ozi.’
- source_word: ἀρχιερέως
  choice: nnukwu onye nchụàjà
  rationale: Nke a bụ aha doro anya n’Igbo maka onye nọ n’ọkwa kachasị elu n’etiti ndị nchụàjà.
- source_word: συγγενὴς ὢν
  choice: ebe ọ bụ onye ikwu
  rationale: Ọ na-egosipụta nkebi participle ahụ nke na-akọwa na onye kwuru okwu bụ onye ikwu nwoke ahụ merụrụ ahụ.
- source_word: οὗ
  choice: nwoke ahụ ... ya
  rationale: 'E mere onye okwu nnọchi ahụ na-ezo aka na ya ka ọ pụta ìhè n’ụzọ Igbo si ekwu okwu: ‘nwoke ahụ Pita bepụrụ ntị ya.’'
- source_word: ἀπέκοψεν
  choice: bepụrụ
  rationale: Ọ na-enye echiche nke iwepụ ntị ahụ site n’ịkpụ ya, ma usoro akụkọ ahụ emeela ka o doo anya na nke a mere tupu okwu a.
- source_word: ὠτίον
  choice: ntị
  rationale: Nke a bụ nsụgharị nkịtị na nke sitere n’okwu Igbo ugbu a; a naghị achọ igosipụta ọdịdị diminutive ya ebe a.
- source_word: Οὐκ ἐγώ σε εἶδον
  choice: Ọ̀ bụghị m hụrụ gị
  rationale: Ajụjụ a na-atụ anya azịza nkwenye, ma ‘m’ na-echekwa nrụgide dị n’ἐγώ n’ụzọ dabara n’Igbo.
- source_word: ἐν τῷ κήπῳ
  choice: n’ubi ahụ
  rationale: ‘Ubi’ bụ okwu Igbo a na-ejikarị akọwa κῆπος n’ọnọdụ ubi a gbara ogige ebe e jidere Jizọs.
- source_word: μετ’ αὐτοῦ
  choice: na ya
  rationale: N’ebe a, ‘ya’ na-ezo aka na Jizọs, ‘na ya’ pụtakwara ịnọnyere ya.
theological_decisions:
- issue: Nsụgharị δοῦλος n’ọnọdụ ndị ọrụ ụlọ nọ n’agbụ
  choice: ndị ohu
  alternative: ndị na-eje ozi
  rationale: A họọrọ ‘ndị ohu’ ka a ghara ime ka ọnọdụ mmadụ ndị a nọ n’agbụ bụrụ ihe dị nro karịa ihe okwu Grik ahụ nwere ike ịpụta n’ọnọdụ a.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. E debere ajụjụ ahụ dị ka ajụjụ na-atụ anya nkwenye, ma e chekwara nkebi ‘ebe ọ bụ onye ikwu’ nke na-egosipụta participle Grik ahụ.
