revisions:
- from: Jizọs zara, “Alaeze m esighị n’ụwa a. A sị na alaeze m si n’ụwa a, ndị na-ejere m ozi gaara anọ na-alụ ọgụ ka a ghara inyefe m n’aka ndị Juu[a]. Ma otú ihe dị ugbu a, alaeze m esighị ebe a.”
  to: Jizọs zara, “Alaeze m esiteghị n’ụwa a. Ọ bụrụ na alaeze m sitere n’ụwa a, ndị na-ejere m ozi gaara na-alụ ọgụ ka a ghara inyefe m n’aka ndị Juu[a]. Ma otú ihe dị ugbu a, alaeze m esiteghị ebe a.”
  rationale: The revision makes a limited grammatical and idiomatic improvement while preserving the Greek contrast between origin “from this world” and the final deictic “from here.” It neither narrows τοῖς Ἰουδαίοις in the main text nor resolves the term’s contextual ambiguity beyond the footnote.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T08:27:14Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the repeated βασιλεία, the source/origin force of ἐκ, the contrary-to-fact conditional, the purpose clause, and the distinct concluding ἐντεῦθεν. However, replacing "esighị/si" with "esiteghị/sitere" more naturally and explicitly expresses continuing derivation or origin, rather than a completed act of coming.
  naturalness: The revision uses the more idiomatic Standard Igbo conditional "Ọ bụrụ na ... sitere" and source-language forms "esiteghị ... sitere." The prior wording is understandable, but these forms read more naturally in this context.
  terminology: “Alaeze,” “ndị na-ejere m ozi,” and “ndị Juu” are suitable. The footnote is retained and reworded so that its contextual reference to Judean authorities is grammatical and clear in Igbo, without replacing the source-near main-text term.
  issues:
  - severity: low
    issue: Source/origin verb form
    rationale: “Esighị” can be understood as a completed negative (‘did not come from’). “Esiteghị” better renders the present assertion that the kingdom is not derived from this world; correspondingly, “sitere” fits the hypothetical protasis.
  - severity: low
    issue: Footnote phrasing
    rationale: The phrase “n’ebe ndị ọchịchị Judia nọ” is not a natural way to state that the referent may be the Judean authorities. Rewording makes the alternative and its contextual limitation clear.
  revised_text: Jizọs zara, “Alaeze m esiteghị n’ụwa a. Ọ bụrụ na alaeze m sitere n’ụwa a, ndị na-ejere m ozi gaara na-alụ ọgụ ka a ghara inyefe m n’aka ndị Juu[a]. Ma otú ihe dị ugbu a, alaeze m esiteghị ebe a.”
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị Judia”; n’ebe a, okwu ahụ pụrụ izo aka karịsịa n’ndị ọchịchị Judia.
    reason: alternative_reading
  revision_rationale: The revision makes a limited grammatical and idiomatic improvement while preserving the Greek contrast between origin “from this world” and the final deictic “from here.” It neither narrows τοῖς Ἰουδαίοις in the main text nor resolves the term’s contextual ambiguity beyond the footnote.
