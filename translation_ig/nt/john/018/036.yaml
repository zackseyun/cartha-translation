id: JHN.18.36
reference: John 18:36
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς· Ἡ βασιλεία ἡ ἐμὴ οὐκ ἔστιν ἐκ τοῦ κόσμου τούτου· εἰ ἐκ τοῦ κόσμου τούτου ἦν ἡ βασιλεία ἡ ἐμή, οἱ ὑπηρέται ⸂οἱ ἐμοὶ ἠγωνίζοντο ἄν⸃, ἵνα μὴ παραδοθῶ τοῖς Ἰουδαίοις· νῦν δὲ ἡ βασιλεία ἡ ἐμὴ οὐκ ἔστιν ἐντεῦθεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/036.yaml
  text: Jesus answered[a], “My kingdom is not from this world. If my kingdom were from this world, my servants would be fighting so that I might not be handed over to the Jews. But as it is, my kingdom is not from here.”
translation:
  language: ig
  text: Jizọs zara, “Alaeze m esiteghị n’ụwa a. Ọ bụrụ na alaeze m sitere n’ụwa a, ndị na-ejere m ozi gaara na-alụ ọgụ ka a ghara inyefe m n’aka ndị Juu[a]. Ma otú ihe dị ugbu a, alaeze m esiteghị ebe a.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị Judia”; n’ebe a, okwu ahụ pụrụ izo aka karịsịa n’ndị ọchịchị Judia.
    reason: alternative_reading
lexical_decisions:
- source_word: βασιλεία
  choice: alaeze
  rationale: “Alaeze” bụ okwu Igbo a maara nke ọma maka ọchịchị eze ma ọ bụ ógbè ọ na-achị; n’ebe a, ọ na-ahapụ ma echiche banyere ọchịchị ma echiche banyere alaeze ka ha nọgide bụrụ ihe a pụrụ ịghọta.
- source_word: ἐκ τοῦ κόσμου τούτου
  choice: esighị n’ụwa a
  rationale: “Si” na-egosipụta isi mmalite ma ọ bụ ebe ihe sitere, kwekọọ na ἐκ karịa ntụgharị ga-ekwu naanị na alaeze ahụ abụghị akụkụ nke ụwa.
- source_word: κόσμος
  choice: ụwa
  rationale: “Ụwa” bụ ntụgharị kpọmkwem ma doo anya; ihe gbara amaokwu ahụ gburugburu na-enye ohere ịghọta usoro ụwa nke mmadụ n’enweghị ịgbasa ihe e dere.
- source_word: ὑπηρέται
  choice: ndị na-ejere m ozi
  rationale: Nkebiokwu a na-egosi ndị nọ n’okpuru ikike Jizọs na-ejere ya ozi, n’ebughị ụzọ kọwaa ha dịka ndị uwe ojii ma ọ bụ ndị agha.
- source_word: ἠγωνίζοντο ἄν
  choice: gaara anọ na-alụ ọgụ
  rationale: Ụdị a na-egosipụta omume agha nke gaara na-aga n’ihu n’ọnọdụ a na-eche n’echiche, dịka imperfect tinyere ἄν si egosi.
- source_word: ἵνα μὴ παραδοθῶ
  choice: ka a ghara inyefe m
  rationale: “Ka” na-egosipụta nzube, ebe “inyefe” na-edobe echiche nke ịnyefe mmadụ n’aka ndị ọzọ n’ọnọdụ ikpe ma ọ bụ njide.
- source_word: τοῖς Ἰουδαίοις
  choice: n’aka ndị Juu
  rationale: “Ndị Juu” na-anọ nso n’okwu Grik ahụ; e tinyere nkọwa ala peeji iji gosi na n’ebe a ọ pụrụ ịpụta kpọmkwem ndị Judia ma ọ bụ ndị isi ha.
- source_word: νῦν δὲ
  choice: Ma otú ihe dị ugbu a
  rationale: Nke a na-egosipụta ọdịiche dị n’etiti ọnọdụ a tụrụ n’uche na ọnọdụ dị adị, kama ime ka νῦν bụrụ naanị nkọwa oge.
- source_word: ἐντεῦθεν
  choice: esighị ebe a
  rationale: “Ebe a” na-edobe okwu ntụaka dị nkenke nke ἐντεῦθεν ma ghara ime ka njedebe ahụ bụrụ nanị nkwughachi zuru ezu nke “ụwa a.”
theological_decisions:
- issue: Ụdị mmekọrịta alaeze Jizọs na ụwa
  choice: “Alaeze m esighị n’ụwa a”
  alternative: “Alaeze m abụghị akụkụ nke ụwa a”
  rationale: Ntughari a na-ekwusi ike n’isi mmalite na agwa alaeze ahụ, ma ọ naghị ekpebi na alaeze ahụ enweghị ọnụnọ ma ọ bụ ọrụ n’ụwa.
- issue: Ndị τοῖς Ἰουδαίοις na-ezo aka na ha n’Oziọma Jọn
  choice: E debere “ndị Juu” n’isiokwu, tinyekwa nkọwa ala peeji.
  alternative: “ndị Judia” ma ọ bụ “ndị isi ndị Juu”
  rationale: Okwu Grik ahụ nwere ike ịpụta ndị Juu n’ozuzu ma ọ bụ, dịka ọnọdụ si dị, ndị Judia na ndị ọchịchị ha. Isiokwu ahụ na-anọ nso na Grik, ebe nkọwa ala peeji na-echekwa nghọta dị warara nke ọnọdụ a pụrụ ịkwado.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ “ndị na-ejere m ozi” kama okwu ọrụ gọọmenti pụrụ ime ka a ghọta ọrụ ha n’ụzọ dị warara; usoro ahịrịokwu ahụ na-echekwa nkwughachi na ọdịiche dị n’okwu Grik.
