revisions:
- from: Ya mere, nwa agbọghọ na-eje ozi nke na-eche ọnụ ụzọ ahụ sịrị Pita[a], “Gị onwe gị esoghịkwa n’ime ndị na-eso ụzọ nwoke a, ka ị so?” Ọ sịrị, “Anọghị m.”
  to: Ya mere, nwa agbọghọ na-eje ozi[a], bú onye na-eche ọnụ ụzọ, sịrị Pita, “Gị kwa, ị bụghị otu n’ime ndị na-eso ụzọ nwoke a?” Ọ sịrị, “Abụghị m.”
  rationale: The revision retains the source’s connective force, the young female servant’s role at the entrance, and the negatively framed question. It replaces an unnatural question structure with a clear Standard Igbo negative question, replaces a locative-sounding denial with the appropriate elliptical denial, and attaches the lexical-alternative note to its proper expression.
  reviewer_model: gpt-5.6-terra
