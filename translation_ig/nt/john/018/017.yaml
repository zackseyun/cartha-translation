  text: λέγει οὖν ⸂τῷ Πέτρῳ ἡ παιδίσκη ἡ θυρωρός⸃· Μὴ καὶ σὺ ἐκ τῶν μαθητῶν εἶ τοῦ ἀνθρώπου τούτου; λέγει ἐκεῖνος· Οὐκ εἰμί.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/017.yaml
  text: So the servant girl who kept the door said to Peter[a], “You are not also one of this man's disciples, are you?” He said, “I am not.”
translation:
  language: ig
  text: Ya mere, nwa agbọghọ na-eje ozi[a], bú onye na-eche ọnụ ụzọ, sịrị Pita, “Gị kwa, ị bụghị otu n’ime ndị na-eso ụzọ nwoke a?” Ọ sịrị, “Abụghị m.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “nwa agbọghọ ohu, bú onye na-eche ọnụ ụzọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Ya mere
  rationale: Na-egosi njikọ na ọganihu akụkọ ahụ; ọ na-edobe ike njikọ okwu Grik ahụ n’ụzọ Igbo doro anya.
- source_word: παιδίσκη
  choice: nwa agbọghọ na-eje ozi
  rationale: Na-egosi nwaanyị na-eto eto nke na-eje ozi, n’ebughị ụzọ kpebie kpọmkwem ma ọnọdụ ya bụ nke ohu iwu kwadoro.
- source_word: θυρωρός
  choice: nke na-eche ọnụ ụzọ ahụ
  rationale: Nkebi ahịrịokwu a na-akọ ọrụ ya n’ụzọ Igbo nkịtị ma doo anya.
- source_word: Μὴ καὶ σὺ
  choice: Gị onwe gị esoghịkwa ... ka ị so?
  rationale: Ajụjụ a na-atụ anya azịza na-adịghị mma; ụdị ajụjụ Igbo a na-egosipụta atụmanya ahụ n’enweghị ime ka olu ya sie ike karịa nke Grik.
- source_word: ἐκ τῶν μαθητῶν
  choice: n’ime ndị na-eso ụzọ
  rationale: Na-egosipụta ịbụ otu onye n’ime ìgwè ahụ n’Igbo eke.
- source_word: τοῦ ἀνθρώπου τούτου
  choice: nwoke a
  rationale: Na-edobe okwu nkịtị maka mmadụ nwoke na ụda nke ịtụ aka n’ebe ọ nọ, n’emeghị ya utu aha.
- source_word: ἐκεῖνος
  choice: Ọ
  rationale: N’ọnọdụ a ọ na-ezo aka na Pita; nnọchiaha Igbo bụ ụzọ kacha eke isi kwuo ya.
- source_word: Οὐκ εἰμί
  choice: Anọghị m
  rationale: Azịza dị mkpụmkpụ nke na-edobe ngọnarị ozugbo na ọdịdị ellipsis nke Grik.
theological_decisions:
- issue: Ike ajụjụ na-adịghị mma nke μή malitere
  choice: 'Ajụjụ na-atụ anya ngọnarị: “Gị onwe gị esoghịkwa ... ka ị so?”'
  alternative: 'Ajụjụ larịị: “Gị onwe gị sokwa n’ime ...?”'
  rationale: Nhọrọ a na-echekwa ntụziaka mkparịta ụka nke Grik, nke na-atụ anya ka Pita sị mba, n’etinyeghị nkọwa ozizi ọzọ.
- issue: Ọnọdụ mmekọrịta mmadụ nke παιδίσκη
  choice: nwa agbọghọ na-eje ozi
  alternative: nwa agbọghọ ohu
  rationale: Okwu Grik ahụ nwere ike ịpụta onye na-eje ozi ma ọ bụ ohu. Ebe a ọrụ ya na afọ/okike ya pụtara ìhè karịa ọnọdụ iwu ya; e debere ihe ọzọ nwere ike ịpụta na ndetu ala peeji.
translation_notes:
  register: Standard Igbo; asụsụ dị ugbu a, dị ùgwù, ma dị mfe nghọta. E ji “ndị na-eso ụzọ” mee μαθηταί, e wee jiri ụdị ajụjụ ọdụ “ka ị so?” gosi na a na-atụ anya azịza na-adịghị mma.
