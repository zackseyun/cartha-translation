source:
  edition: SBLGNT
  text: τί με ⸂ἐρωτᾷς; ἐρώτησον⸃ τοὺς ἀκηκοότας τί ἐλάλησα αὐτοῖς· ἴδε οὗτοι οἴδασιν ἃ εἶπον ἐγώ.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/021.yaml
  text: Why do you question me? Question those who have heard what I said to them. Look[a], they know what I said.
translation:
  language: ig
  text: “Gịnị mere i ji agba m ajụjụ[a]? Gbaa ndị nụrụ ihe m gwara ha ajụjụ. Lee, ndị a maara ihe m kwuru.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Gịnị mere i ji ajụ m? Jụọ ndị nụrụ ihe m gwara ha.” Ngwaa Grik ahụ nwekwara ike ịpụta naanị ‘ịjụ,’ ma ‘ịgba ajụjụ’ dabara nke ọma n’ọnọdụ nyocha ikpe a.
    reason: lexical_alternative
lexical_decisions:
- source_word: τί με ἐρωτᾷς
  choice: Gịnị mere i ji agba m ajụjụ?
  rationale: Ajụjụ a na-ama ihe onye isi nchụaja na-eme aka ozugbo. ‘Ịgba mmadụ ajụjụ’ dabara n’ọnọdụ nyocha ikpe a karịa naanị ‘ịjụ mmadụ,’ ma ọ ka bụ Igbo nkịtị.
- source_word: ἐρώτησον
  choice: Gbaa ... ajụjụ
  rationale: Ụdị iwu a chọrọ ka e mee ihe ahụ ozugbo. Ikwughachi ‘ịgba ajụjụ’ na-echekwa myirịta dị n’etiti ngwaa Grik abụọ ahụ.
- source_word: τοὺς ἀκηκοότας
  choice: ndị nụrụ
  rationale: Nke a na-akọwa ndị gere okwu Jizọs ntị. N’Igbo, ‘ndị nụrụ’ na-ada nke ọma ma na-enye echiche ahụ n’enweghị itinye ‘m’ nke na-adịghị n’ebe a na Grik.
- source_word: τί ἐλάλησα αὐτοῖς
  choice: ihe m gwara ha
  rationale: Nke a bụ ụzọ Igbo doro anya ma dị mfe isi kwuo okwu e kwuru nye mmadụ; ọ naghị eme ka okwu ahụ bụrụ nkuzi karịa ka Grik si kwuo ya.
- source_word: ἴδε
  choice: Lee
  rationale: ‘Lee’ bụ okwu Igbo dị ugbu a nke a na-eji adọta uche mmadụ; ọ na-echekwa ike nke interjection Grik ahụ.
- source_word: οὗτοι οἴδασιν
  choice: ndị a maara
  rationale: ‘Ndị a’ na-echekwa ike ngosipụta nke οὗτοι, ebe ‘maara’ na-egosi na ha nwere ihe ọmụma ahụ.
- source_word: ἃ εἶπον ἐγώ
  choice: ihe m kwuru
  rationale: Nke a bụ nsụgharị Igbo eke nke content clause ahụ. Ọ bụ ezie na ἐγώ pụtara ìhè maka imesi ‘m’ ike, usoro ahịrịokwu ahụ na nkwughachi onye mbụ ezuola ime ka nke ahụ pụta n’Igbo n’enweghị ‘mụ onwe m’ nke ga-ada arọ.
theological_decisions:
- issue: Ụda okwu metụtara nyocha ikpe n’azịza Jizọs nye onye isi nchụaja
  choice: Jiri ‘ịgba mmadụ ajụjụ’ n’ebe abụọ ahụ.
  alternative: Jiri ‘ịjụ mmadụ’ n’ebe abụọ ahụ.
  rationale: Ọnọdụ a bụ nyocha ọchịchị/ikpe. ‘Ịgba ajụjụ’ na-egosipụta ọnọdụ ahụ n’enweghị ịgbakwụnye echiche nke na-adịghị na Grik, ma footnote na-echekwa nsụgharị nkịtị karịa.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ ‘ịgba ajụjụ’ iji mee ka ọnọdụ nyocha ahụ pụta ìhè, ebe ‘Lee’ na ‘ndị a’ na-echekwa okwu ndọta-uche na ngosipụta dị na Grik.
