  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἔστιν δὲ συνήθεια ὑμῖν ἵνα ἕνα ⸂ἀπολύσω ὑμῖν⸃ ἐν τῷ πάσχα· βούλεσθε οὖν ⸄ἀπολύσω ὑμῖν⸅ τὸν βασιλέα τῶν Ἰουδαίων;
base_translation:
  language: en
  yaml_path: translation/nt/john/018/039.yaml
  text: But you have a custom that I release one man for you at the Passover[a]. So do you want me to release to you the King of the Jews?
translation:
  language: ig
  text: Ma unu nwere omenala na m na-atọhapụrụ unu otu onye n’oge Emume Ngabiga. Ya mere, unu chọrọ ka m tọhapụ unu Eze ndị Juu[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Eze ndị Judia.” Okwu Grik a nwere ike ịpụta ma ndị Juu ma ndị Judia, dabere n’ihe gbara ya gburugburu; n’ebe a, o yiri ka ọ bụ akụkụ nke aha a na-eji eme ihe mgbe niile n’akụkọ ahụhụ Jizọs.
    reason: alternative_reading
lexical_decisions:
- source_word: συνήθεια
  choice: omenala
  rationale: “Omenala” na-egosi usoro ndị mmadụ nabatara ma na-eme mgbe niile; ọ dabara n’ọnọdụ emume na ikpe a karịa okwu ga-apụta nanị àgwà mmadụ.
- source_word: ἵνα ἕνα ἀπολύσω ὑμῖν
  choice: na m na-atọhapụrụ unu otu onye
  rationale: Nke a na-akọwa ihe omenala ahụ bụ. “Otu onye” na-eme ka onye ἕνα na-ezo aka na ya doo anya n’Igbo, ebe “na-atọhapụrụ” na-egosi ihe a na-eme dịka omenala.
- source_word: ἀπολύω
  choice: tọhapụrụ
  rationale: N’ọnọdụ onye ọchịchị na-ahapụ onye mkpọrọ ka ọ nwere onwe ya, “tọhapụrụ” bụ okwu Igbo doro anya ma kwesị ekwesị; e jikwa ya mee ihe n’ebe abụọ okwu ahụ pụtara.
- source_word: ἐν τῷ πάσχα
  choice: n’oge Emume Ngabiga
  rationale: Nke a na-egosi na ihe ahụ na-eme n’oge emume ahụ, ma “Emume Ngabiga” bụ aha Igbo doro anya maka πάσχα.
- source_word: βούλεσθε οὖν
  choice: Ya mere, unu chọrọ
  rationale: “Ya mere” na-ebupụta echiche nkwubi okwu dị na οὖν, ebe “unu chọrọ” na-asụgharị βούλεσθε n’Igbo dị ugbu a ma dị mfe nghọta.
- source_word: τὸν βασιλέα τῶν Ἰουδαίων
  choice: Eze ndị Juu
  rationale: N’akụkọ ahụhụ Jizọs, nkebiokwu a na-arụ ọrụ dịka aha eze na ebubo a kpọkwasịrị ya; ide “Eze” na mkpụrụedemede ukwu na-egosi ọrụ ahụ.
theological_decisions:
- issue: Otú e si asụgharị Ἰουδαίων n’aha τὸν βασιλέα τῶν Ἰουδαίων
  choice: Eze ndị Juu
  alternative: Eze ndị Judia
  rationale: N’akụkọ ahụhụ dị na Jọn, nke a bụ aha/ebubo e ji ezo aka n’ọchịchị eze Jizọs, ya mere “ndị Juu” na-echekwa nghọta akụkọ na akụkọ ihe mere eme a maara nke ọma. Ma ebe okwu Grik ahụ nwekwara ike ịpụta ndị Judia dịka ndị obodo, e debere nhọrọ ahụ n’ala peeji ka a ghara izochi nghọta ọzọ nwere ike ịdị.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-echekwa ụda okwu Paịlet na njikọ nkwubi okwu nke οὖν, ma zere itinye nkọwa okpukpe nke otu ụka.
