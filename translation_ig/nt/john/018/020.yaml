id: JHN.18.20
reference: John 18:20
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀπεκρίθη ⸀αὐτῷ Ἰησοῦς· Ἐγὼ παρρησίᾳ ⸀λελάληκα τῷ κόσμῳ· ἐγὼ πάντοτε ἐδίδαξα ἐν συναγωγῇ καὶ ἐν τῷ ἱερῷ, ὅπου ⸀πάντες οἱ Ἰουδαῖοι συνέρχονται, καὶ ἐν κρυπτῷ ἐλάλησα οὐδέν·
base_translation:
  language: en
  yaml_path: translation/nt/john/018/020.yaml
  text: Jesus answered him[a], “I have spoken openly to the world. I always taught in the synagogue and in the temple, where all the Jews gather[b], and I said nothing in secret.”
translation:
  language: ig
  text: Jizọs zara ya, sị, “Ekwuola m okwu n’ihu ọha nye ụwa. M na-akụziri ndị mmadụ ihe mgbe niile n’ụlọ nzukọ ndị Juu na n’ụlọ nsọ[a], ebe ndị Juu niile na-ezukọ[b]. Ekwughị m ihe ọ bụla na nzuzo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “n’ogige ụlọ nsọ” ma ọ bụ “n’mpaghara ụlọ nsọ.” Okwu Grik ἱερόν na-ezo aka n’ụlọ nsọ na ogige ya, ọ bụghị naanị ebe nsọ dị n’ime ya.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya “ndị Juu n’ozuzu ha” ma ọ bụ, n’ọnọdụ ụfọdụ n’Oziọma Jọn, “ndị bi na Judia.” Ihe Ἰουδαῖοι pụtara na-adabere n’ọnọdụ e ji ya mee ihe.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρρησίᾳ
  choice: n’ihu ọha
  rationale: N’ebe a, okwu a na-emegide ‘na nzuzo’; ya mere, ‘n’ihu ọha’ na-egosi okwu e kwuru n’ezoghị ezo n’etinyeghị echiche nke nkwuwa okwu n’ike.
- source_word: λελάληκα
  choice: Agwala m ... okwu
  rationale: Ụdị ngwaa zuru oke na-egosi na okwu Jizọs kwuru n’oge gara aga ka bara uru n’oge a; usoro Igbo a na-ebute echiche ahụ n’ụzọ sitere n’okike.
- source_word: τῷ κόσμῳ
  choice: ụwa
  rationale: ‘Ụwa’ na-edobe ụdị okwu Jọn na obosara κόσμος kama ime ka ọ bụrụ naanị ‘ọha mmadụ.’
- source_word: πάντοτε ἐδίδαξα
  choice: Ana m akụzi ihe mgbe niile
  rationale: Usoro a na-egosipụta omume Jizọs na-eme mgbe niile n’ebe ọha na-ezukọ, nke bụ isi ihe πάντοτε na aorist a na-ekwu.
- source_word: ἐν συναγωγῇ
  choice: n’ụlọ nzukọ ndị Juu
  rationale: Nkọwa ‘ndị Juu’ na-eme ka onye Igbo nke oge a ghọta na συναγωγή bụ ebe ndị Juu na-ezukọ maka ofufe na nkuzi, ọ bụghị naanị ụlọ nzukọ nkịtị.
- source_word: ἐν τῷ ἱερῷ
  choice: n’ụlọ nsọ
  rationale: Nke a bụ okwu Igbo dị nkenke ma bụrụ nke a na-amakarị maka ụlọ nsọ dị na Jerusalem; ihe odide ala ala peeji kọwara na Grik na-ezo aka n’ogige na akụkụ niile nke ụlọ nsọ ahụ.
- source_word: πάντες οἱ Ἰουδαῖοι
  choice: ndị Juu niile
  rationale: N’ọnọdụ a, ụlọ nzukọ na ụlọ nsọ na-egosi ndị Juu n’ozuzu ha dịka obodo okpukpe, ọ bụghị nanị ndị ọchịchị Judea.
- source_word: συνέρχονται
  choice: na-ezukọ
  rationale: Nke a bụ okwu Igbo sitere n’okike nke na-egosi ndị mmadụ ịbịakọta ọnụ.
- source_word: ἐν κρυπτῷ
  choice: na nzuzo
  rationale: Ọ na-edobe mmegide doro anya dị n’etiti ikwu okwu n’ihu ọha na ikwu okwu na nzuzo.
- source_word: ἐλάλησα οὐδέν
  choice: Ekwughị m ihe ọ bụla
  rationale: Nke a bụ ụzọ Igbo sitere n’okike si kwuo nkwụsi ike nke njụ zuru ezu dị n’ahịrịokwu Grik.
- source_word: ἀπεκρίθη αὐτῷ
  choice: Jizọs zara ya
  rationale: Nke a bụ ntụgharị akụkọ dị nkenke ma doo anya n’Igbo.
theological_decisions:
- issue: Ihe Ἰουδαῖοι na-ezo aka na ya n’Oziọma Jọn
  choice: ndị Juu niile
  alternative: ndị Judea niile; ndị Juu niile dịka otu ndị mmadụ
  rationale: Ἰουδαῖοι nwere ike ịpụta ndị Judea, ndị isi ndị Juu, ma ọ bụ ndị Juu n’ozuzu ha dabere n’ọnọdụ. N’amaokwu a, okwu banyere ụlọ nzukọ na ụlọ nsọ na-akwado nghọta sara mbara nke obodo ndị Juu, ma ihe odide ala ala peeji na-edobe ụzọ ndị ọzọ e nwere ike isi ghọta ya.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta, mee ntụgharị a. ‘Ụlọ nzukọ ndị Juu’ na-ezere nghọtahie nke ‘ụlọ nzukọ’ dịka ụlọ nzukọ nkịtị. E debere mmegide dị n’etiti ‘n’ihu ọha’ na ‘na nzuzo,’ tinyekwara akara ihe odide ala ala peeji n’ebe okwu ndị a na-akọwa pụtara kpọmkwem.
