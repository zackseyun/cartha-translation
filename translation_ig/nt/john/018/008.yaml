id: JHN.18.8
reference: John 18:8
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς· Εἶπον ὑμῖν ὅτι ἐγώ εἰμι· εἰ οὖν ἐμὲ ζητεῖτε, ἄφετε τούτους ὑπάγειν·
base_translation:
  language: en
  yaml_path: translation/nt/john/018/008.yaml
  text: Jesus answered[a], “I told you that I am he. So if you are seeking me, let these men go.”
translation:
  language: ig
  text: Jizọs zara, “Agwara m unu na ọ bụ m.[a] Ya mere, ọ bụrụ na unu na-achọ m, hapụnụ ndị a ka ha laa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “Abụ m.” Okwu Grik etinyeghị okwu mmeju na-akọwa onye ma ọ bụ ihe ọ bụ; “ọ bụ m” na-eme ka nzube njirimara ya doo anya n’Igbo.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: zara
  rationale: Ọ bụ okwu Igbo a na-ejikarị akọ nzaghachi mmadụ nyere n’akụkọ mkparịta ụka.
- source_word: Εἶπον ὑμῖν
  choice: Agwara m unu
  rationale: N’ebe a, Jizọs na-echetara ha ihe ọ gwara ha na mbụ; “Agwara m unu” na-egosipụta nke a nke ọma n’Igbo.
- source_word: ἐγώ εἰμι
  choice: ọ bụ m
  rationale: N’ọnọdụ a, Jizọs na-eme ka a mata na ya bụ onye ha na-achọ. “Ọ bụ m” bụ ụzọ Igbo doro anya ma dịkwa mma isi kwuo njirimara ahụ, ebe e debere ọdịdị okwu Grik nke na-enweghị ihe mmeju na nkọwa ala peeji.
- source_word: ζητεῖτε
  choice: unu na-achọ
  rationale: Oge ugbu a nke ngwaa Grik dabara n’omume ha nọ na-eme n’oge ahụ; “na-achọ” na-egosipụta nke ahụ n’Igbo.
- source_word: ἄφετε
  choice: hapụnụ
  rationale: Iwu a pụtara ikwe ka ha pụọ, ọ bụghị na ọ ga-abụrịrị ịtọhapụ ndị e jidere.
- source_word: τούτους
  choice: ndị a
  rationale: Okwu Grik bụ nnọchiaha ngosi na-ezo aka n’ebe ndị ha na Jizọs nọ nọ; “ndị a” bụ ntụgharị eke nke na-adịghị etinye “ndị ikom” n’ebe isi mmalite ekwughị ya kpọmkwem.
- source_word: ὑπάγειν
  choice: ka ha laa
  rationale: N’usoro a, ngwaa ahụ pụtara ka e kwe ka ndị ahụ pụọ; “ka ha laa” bụ Igbo doro anya ma dị mfe.
theological_decisions:
- issue: Otú e si sụgharị ἐγώ εἰμι n’Oziọma Jọn
  choice: ọ bụ m
  alternative: Abụ m
  rationale: Ihe gbara amaokwu ahụ gburugburu na-egosi na Jizọs na-akọwa na ya bụ onye ha na-achọ, ya mere “ọ bụ m” na-enye nghọta nkịtị ahụ n’Igbo. Ma ebe okwu Grik pụtara n’enweghị okwu mmeju ma nwee ike ibu ụda mmụta okpukpe pụrụ iche n’Oziọma Jọn, e debere “Abụ m” dịka ntụgharị ọzọ na nkọwa ala peeji.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta mee ihe. Ahịrịokwu ahụ na-aga n’usoro okwu Igbo eke, ma na-echekwa mkpụmkpụ na ike iwu dị n’okwu Jizọs.
