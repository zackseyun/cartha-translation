  source_fidelity: 'The translation accurately conveys all clauses of the Greek: Jesus'' reply, his reminder that he is the person sought, the conditional request, and the imperative permitting his companions to leave. “Ọ bụ m” appropriately supplies the identification sense in natural Igbo, while the footnote preserves the Greek expression’s lack of an explicit predicate.'
