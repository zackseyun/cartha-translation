  source_fidelity: 'A chọrọ imezi ngwaa mbụ: “kpọrọ ya” bụ ụdị gara aga, ọ bụghị iwu ọtụtụ mmadụ maka Λάβετε. “Unu onwe unu were ya” na-asụgharị iwu ahụ ma na-echekwa nkwusi ike dị n’ὑμεῖς. “kpeenụ ya ikpe,” “dị ka iwu unu si dị,” na “Iwu ekweghị ka anyị gbuo onye ọ bụla” na-ebuga echiche Grik nke ọma.'
