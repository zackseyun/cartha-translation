  text: εἶπεν οὖν αὐτοῖς ⸀ὁ Πιλᾶτος· Λάβετε αὐτὸν ὑμεῖς, καὶ κατὰ τὸν νόμον ὑμῶν κρίνατε αὐτόν. ⸀εἶπον αὐτῷ οἱ Ἰουδαῖοι· Ἡμῖν οὐκ ἔξεστιν ἀποκτεῖναι οὐδένα·
base_translation:
  language: en
  yaml_path: translation/nt/john/018/031.yaml
  text: So Pilate said to them[a], “Take him yourselves and judge him according to your law.” The Jews said to him, “It is not lawful for us to put anyone to death.”
translation:
  language: ig
  text: Ya mere, Paịlet sịrị ha, “Unu onwe unu were ya, kpeenụ ya ikpe dị ka iwu unu si dị.” Ndị Juu[a] sịrị ya, “Iwu ekweghị ka anyị gbuo onye ọ bụla.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’asụsụ Grik, “Ndị Juu” (hoi Ioudaioi); n’ebe a, ọ na-ezo aka ná ndị ọchịchị Juu ma ọ bụ ndị na-ebo Jizọs ebubo nọ na-agwa Paịlet okwu, ọ bụghị ndị Juu niile.
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: Ya mere
  rationale: Na-ejikọta okwu a na ihe bu ya ụzọ ma na-egosi nsonaazụ ma ọ bụ nzaghachi n'ụzọ Igbo doro anya.
- source_word: Λάβετε αὐτὸν ὑμεῖς
  choice: Unu onwe unu kpọrọ ya
  rationale: “Unu onwe unu” na-echekwa nkwusi ike dị n’ὑμεῖς; “kpọrọ ya” bụ ụzọ ebumpụta ụwa isi kwuo ka ha were ya n’aka ha n’ọnọdụ a.
- source_word: κατὰ τὸν νόμον ὑμῶν
  choice: dị ka iwu unu si dị
  rationale: Na-egosipụta κατά dịka ụkpụrụ e ji ekpe ikpe, ma na-echekwa ụzọ Paịlet si kewapụ iwu ha na nke Rom.
- source_word: κρίνατε
  choice: kpeekwanụ ya ikpe
  rationale: Na-echekwa echiche iwu nke ikpe mmadụ ikpe n’enweghị ime ka ọ bụrụ naanị ụdị ikpe ụlọikpe Rom.
- source_word: οἱ Ἰουδαῖοι
  choice: Ndị Juu
  rationale: Nke a na-esochi okwu Grik n’ụzọ kwụ ọtọ; akara nkọwa na-akọwa na ebe a ọ bụ ndị isi ma ọ bụ ndị na-ebo Jizọs ebubo nọ n’ihu Paịlet.
- source_word: Ἡμῖν οὐκ ἔξεστιν
  choice: Iwu ekweghị ka anyị
  rationale: N’ọnọdụ ikpe a, nke a na-egosipụta na e nyeghị ha ikike ime ihe ahụ, n’Igbo dị ugbu a ma dị mfe nghọta.
- source_word: ἀποκτεῖναι οὐδένα
  choice: gbuо onye ọ bụla
  rationale: Na-echekwa okwu sara mbara nke Grik; ọnọdụ ahụ n’onwe ya na-egosi igbu mmadụ dịka ntaramahụhụ ikpe.
theological_decisions:
- issue: Onye okwu οἱ Ἰουδαῖοι na-ezo aka na ya n’akụkọ Jọn
  choice: E tinyere “Ndị Juu” n’ahịrịokwu, tinyekwa nkọwa na ọ na-ezo aka n’ebe a n’ebe ndị ọchịchị Juu ma ọ bụ ndị na-ebo Jizọs ebubo nọ.
  alternative: Ndị isi ndị Juu; ndị Judia
  rationale: Nke a na-echekwa ọdịdị okwu Grik ma na-egbochi nghọtahie na ọ na-ebo ndị Juu niile ebubo. Ọnọdụ akụkọ ahụ na-egosi ìgwè ahụ nọ na-agwa Paịlet okwu.
translation_notes:
  register: Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E jiri “Unu onwe unu” chekwaa nkwusi ike dị n’aha nnọchiaha Grik, ma jiri okwu iwu doro anya n’enweghị ịgbakwunye nkọwa ozizi.
