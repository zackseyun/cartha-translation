id: JHN.18.35
reference: John 18:35
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀπεκρίθη ὁ Πιλᾶτος· Μήτι ἐγὼ Ἰουδαῖός εἰμι; τὸ ἔθνος τὸ σὸν καὶ οἱ ἀρχιερεῖς παρέδωκάν σε ἐμοί· τί ἐποίησας;
base_translation:
  language: en
  yaml_path: translation/nt/john/018/035.yaml
  text: Pilate answered[a], “I am not a Jew, am I? Your own nation and the chief priests handed you over to me. What have you done?”
translation:
  language: ig
  text: Paịlet zara, “Ọ bụghị onye Juu[a] ka m bụ, ọ̀ bụ ya? Mba gị na ndị isi nchụàjà nyefere gị n’aka m. Gịnị ka i mere?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “onye Judia.” Okwu Grik a nwere ike ịpụta onye nwere njirimara agbụrụ ma ọ bụ okpukpe ndị Juu (“onye Juu”), ma ọ bụ onye sitere n’ógbè Judia (“onye Judia”), dabere n’ọnọdụ e ji ya mee ihe.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: zara
  rationale: Ọ bụ okwu Igbo a na-ejikarị egosi na mmadụ nyere onye ọzọ azịza n’ime mkparịta ụka.
- source_word: Μήτι
  choice: Abụ m ... ka m bụ?
  rationale: Ụdị ajụjụ a na-egosi na Paịlet na-atụ anya azịza na-adịghị mma, n’enweghị ime ka ajụjụ ahụ bụrụ nkwupụta doro anya karịa Grik.
- source_word: Ἰουδαῖός
  choice: onye Juu
  rationale: N’ebe a, Paịlet na-ekewapụ onwe ya n’ebe mba Jizọs na ndị boro ya ebubo nọ; ya mere, njirimara agbụrụ na nke okpukpe sara mbara dabara karịa naanị njirimara mpaghara.
- source_word: τὸ ἔθνος τὸ σὸν
  choice: mba gị
  rationale: Nke a na-echekwa echiche nke otu mba ma na-egosikwa n'ụzọ eke na Igbo na Paịlet na-ekwu banyere mba nke Jizọs.
- source_word: ἀρχιερεῖς
  choice: ndị isi nchụàjà
  rationale: Nke a bụ okwu Igbo doro anya maka ndị ndú nchụàjà nọ na Jerusalem, ọ bụghị naanị otu nnukwu onye nchụàjà.
- source_word: παρέδωκάν σε ἐμοί
  choice: nyefere gị n’aka m
  rationale: Ọ na-egosi inyefe mmadụ n’aka onye ọchịchị maka ikpe, n’etinyeghị echiche ‘ịrara mmadụ nye’ nke nwere ike ịdị arọ karịa okwu dị n’ebe a.
- source_word: τί ἐποίησας
  choice: Gịnị ka i mere?
  rationale: Ajụjụ Igbo a dị mfe ma dịkwa eke, na-ajụ banyere ihe Jizọs mere nke butere ọnọdụ ikpe a.
theological_decisions:
- issue: Ihe Ἰουδαῖος pụtara n’Oziọma Jọn
  choice: onye Juu
  alternative: onye Judia
  rationale: Ọ bụ ezie na okwu Grik ahụ nwere ike ịpụta onye Judia n’ọnọdụ ụfọdụ, ajụjụ Paịlet na okwu sochirinụ banyere ‘mba gị’ na-akwado njirimara agbụrụ na nke mba sara mbara n’ebe a. E debere ihe ọzọ ọ pụrụ ịpụta n’ala ala peeji ka a ghara izochi nghọta abụọ okwu Grik nwere.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dịkwa mfe nghọta. Ajụjụ “Abụ m ... ka m bụ?” na-echekwa ụda ajụjụ Paịlet nke na-atụ anya azịza ‘mba.’ Akara ala ala peeji [a] dị kpọmkwem n’akụkụ “onye Juu,” okwu ọ na-akọwa.
