review_pass:
  verdict: revise
  source_fidelity: The draft preserves the sequence of actions and identifies Malchus correctly, but its verb forms should consistently mark the completed past actions of the Greek aorists. “Ya mere” can represent οὖν, though it carries a slightly stronger inferential force than a simple narrative “then.”
  naturalness: The sentence is understandable, but “bipụ” is an infinitive/command-like form in this context; “bipụrụ” is the natural completed-past form. Using “nnukwu onye nchụàjà” is more idiomatic Standard Igbo for “high priest” than “onyeisi nchụaja.”
  terminology: “Ohu” appropriately renders δοῦλος here, with the alternative “onye na-ejere ... ozi” retained in the footnote. “Mma agha,” “ntị aka nri,” and “Malkọs” are suitable.
  issues:
  - severity: medium
    issue: The final action is rendered with the non-past form “bipụ.”
    rationale: ἀπέκοψεν is an aorist referring to Peter’s completed act. In this narrative, Standard Igbo requires “bipụrụ” (or an equivalent completed-past construction).
  - severity: low
    issue: “onyeisi nchụaja” is less idiomatic than “nnukwu onye nchụàjà.”
    rationale: “Nnukwu onye nchụàjà” is the established natural Standard Igbo expression for the Jewish high priest and avoids an awkward compound.
  revised_text: Ya mere, Saịmọn Pita, onye nwere mma agha, mịpụtara ya, were ya tie ohu[a] nnukwu onye nchụàjà ma bipụrụ ntị aka nri ya. Aha ohu ahụ bụ Malkọs.
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “onye na-ejere nnukwu onye nchụàjà ozi.” Okwu Grik bụ doulos, nke nwere ike ịpụta “ohu” ma ọ bụ “onye na-eje ozi,” dabere n’ọnọdụ e ji ya mee ihe.
    reason: alternative_reading
  revision_rationale: The revision keeps the draft’s meaning and register while correcting the completed-past verbal form for the cutting action and replacing the less natural designation for the high priest. The footnote is adjusted to match the revised main-text terminology.
