  to: Ya mere, Saịmọn Pita, onye nwere mma agha, mịpụtara ya, were ya tie ohu[a] nnukwu onye nchụàjà ma bipụrụ ntị aka nri ya. Aha ohu ahụ bụ Malkọs.
  rationale: The revision keeps the draft’s meaning and register while correcting the completed-past verbal form for the cutting action and replacing the less natural designation for the high priest. The footnote is adjusted to match the revised main-text terminology.
