id: JHN.18.10
reference: John 18:10
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Σίμων οὖν Πέτρος ἔχων μάχαιραν εἵλκυσεν αὐτὴν καὶ ἔπαισεν τὸν τοῦ ἀρχιερέως δοῦλον καὶ ἀπέκοψεν αὐτοῦ τὸ ⸀ὠτάριον τὸ δεξιόν. ἦν δὲ ὄνομα τῷ δούλῳ Μάλχος.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/010.yaml
  text: Then Simon Peter[a], having a sword, drew it and struck the high priest’s servant and cut off his right ear. Now the servant’s name was Malchus.
translation:
  language: ig
  text: Ya mere, Saịmọn Pita, onye nwere mma agha, mịpụtara ya, were ya tie ohu[a] nnukwu onye nchụàjà ma bipụrụ ntị aka nri ya. Aha ohu ahụ bụ Malkọs.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “onye na-ejere nnukwu onye nchụàjà ozi.” Okwu Grik bụ doulos, nke nwere ike ịpụta “ohu” ma ọ bụ “onye na-eje ozi,” dabere n’ọnọdụ e ji ya mee ihe.
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: Ya mere
  rationale: Na-ejikọta ihe a na ihe mere n’amaokwu bu ụzọ, ma na-aga n’ihu n’akụkọ ahụ n’ụzọ Igbo nkịtị.
- source_word: ἔχων μάχαιραν
  choice: onye nwere mma agha
  rationale: Na-egosipụta nke ọma na Pita nwere ngwa agha ahụ; “mma agha” bụ okwu Igbo sara mbara ma doo anya maka μάχαιρα.
- source_word: εἵλκυσεν αὐτὴν
  choice: mịpụtara ya
  rationale: N’ọnọdụ a, okwu a na-egosi na ọ mịpụtara ngwa agha ahụ n’ebe e debere ya.
- source_word: ἔπαισεν
  choice: tie
  rationale: Ọ bụ okwu Igbo doro anya ma dịkwa ugwu nke na-egosi iti mmadụ ihe.
- source_word: τὸν τοῦ ἀρχιερέως δοῦλον
  choice: ohu onyeisi nchụaja
  rationale: “Ohu” na-egosipụta ọnọdụ onye nọ n’okpuru onye ọzọ dị ka δοῦλος si kwuo; e debere “onye na-ejere ... ozi” n’ala peeji dịka nhọrọ ọzọ dabere n’ọnọdụ.
- source_word: ἀπέκοψεν
  choice: bipụ
  rationale: Na-egosipụta kpọmkwem iwepụ akụkụ ahụ site n’ịkpụ ya.
- source_word: ὠτάριον τὸ δεξιόν
  choice: ntị aka nri ya
  rationale: Ụdị mbelata ὠτάριον anaghị achọ okwu mbelata n’Igbo; “ntị” bụ okwu nkịtị, ebe “aka nri” na-edobe nkọwa nke akụkụ ahụ.
- source_word: ἦν δὲ ὄνομα τῷ δούλῳ Μάλχος
  choice: Aha ohu ahụ bụ Malkọs
  rationale: Ọ bụ usoro okwu Igbo dị mfe maka iwebata aha onye ahụ; “Malkọs” na-edepụta Μάλχος n’ụda Igbo.
theological_decisions:
- issue: Nsụgharị δοῦλος
  choice: ohu
  alternative: onye na-ejere onyeisi nchụaja ozi
  rationale: Njikọ onye ahụ na onyeisi nchụaja nwere ike igosi onye nọ n’ọnọdụ ohu, ya mere e ji “ohu” mee isi nsụgharị; ma ebe δοῦλος nwekwara ike ịpụta onye na-eje ozi, e debere nke ahụ dịka nhọrọ ọzọ n’ala peeji.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị mfe nghọta ma dịkwa ugwu, dee ya. A hapụrụ usoro akụkọ ahụ ka ọ na-aga ngwa ngwa, ma zere okwu ochie ma ọ bụ nkọwa ụka pụrụ iche.
