  text: πάλιν οὖν ⸀ἠρνήσατο Πέτρος· καὶ εὐθέως ἀλέκτωρ ἐφώνησεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/027.yaml
  text: Then Peter denied it again[a], and immediately a rooster crowed.
translation:
  language: ig
  text: Pita gọnahụrụ ya ọzọ[a], ozugbo oke ọkụkọ bere akwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “Pita gọnahụrụ ọzọ.” Grik ekwughị kpọmkwem ihe ọ gọnahụrụ, ma ajụjụ dị n’amaokwu bu ụzọ na-eme ka a ghọta ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν
  choice: ọzọ
  rationale: Na-egosi na Pita mere otu ihe ahụ ugboro ọzọ; “ọzọ” bụ okwu Igbo dị nkenke ma kwekọọ n’akụkọ a.
- source_word: οὖν
  choice: Ya mere
  rationale: Na-ejikọta nzaghachi Pita na ajụjụ gara ya n’ihu, ma na-edokwa mmetụta nke njikọ ma ọ bụ nsonaazụ dị na mkpụrụokwu Grik ahụ.
- source_word: ἠρνήσατο
  choice: gọnahụrụ ya
  rationale: Ngwaa a pụtara ịgọnahụ. E tinyere “ya” dịka ihe a na-agọnahụ n’ihi ajụjụ dị n’amaokwu bu ụzọ, ọ bụ ezie na Grik ekwughị ihe ahụ kpọmkwem.
- source_word: Πέτρος
  choice: Pita
  rationale: Ụdị aha a maara nke ọma n’Igbo maka Πέτρος.
- source_word: καὶ
  choice: -kwa
  rationale: Mgbakwunye “-kwa” na “ahụkwa” na-ejikọta ihe abụọ ahụ n'ụzọ Igbo sitere n’okike.
- source_word: εὐθέως
  choice: ozugbo ahụ
  rationale: Na-egosi na mkpu oke ọkụkọ sochiri ngọnahụ Pita n’enweghị oge gafere.
- source_word: ἀλέκτωρ
  choice: oke ọkụkọ
  rationale: Ọ bụ okwu Igbo doro anya maka ọkụkọ nwoke.
- source_word: ἐφώνησεν
  choice: bere akwa
  rationale: Mgbe isiokwu ya bụ oke ọkụkọ, “bere akwa” bụ ụzọ Igbo sitere n’okike isi kwuo na ọ kpọrọ oku ya.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị ugwu ma dị mfe nghọta. E chekwara njikọ akụkọ ahụ na ngwa ngwa mkpu oke ọkụkọ, ma ihe e tinyere dịka mmeju sitere n’ọnọdụ okwu ka akọwara n’ala ala peeji.
