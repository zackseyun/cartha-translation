source:
  edition: SBLGNT
  text: ταῦτα δὲ αὐτοῦ εἰπόντος εἷς ⸂παρεστηκὼς τῶν ὑπηρετῶν⸃ ἔδωκεν ῥάπισμα τῷ Ἰησοῦ εἰπών· Οὕτως ἀποκρίνῃ τῷ ἀρχιερεῖ;
base_translation:
  language: en
  yaml_path: translation/nt/john/018/022.yaml
  text: And when he had said these things[a], one of the officers standing by struck Jesus, saying[b], “Is this how you answer the high priest?”
translation:
  language: ig
  text: Mgbe o kwusịrị ihe ndị a, otu onye n’ime ndị ọrụ[a] nọ nso mara Jizọs ụra, sị, “Ọ bụ otu a ka ị si aza onyeisi nchụàjà?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “kụọ Jizọs aka.” Okwu Grik ahụ na-egosi iti mmadụ aka, nke nwere ike ịbụ ịma ya ụra ma ọ bụ ụdị iti yiri ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα
  choice: ihe ndị a
  rationale: Na-edobe ọtụtụ nke okwu Grik ma na-ezo aka n’okwu Jizọs kwuru tupu nke a.
- source_word: δὲ
  choice: Mgbe
  rationale: E tinyere njikọ akụkọ ahụ n’ahịrịokwu oge n’ụzọ Igbo si ada nke ọma, n’etinyeghị mmegide na-adịghị n’isiokwu ahụ.
- source_word: αὐτοῦ εἰπόντος
  choice: o kwusịrị
  rationale: Na-egosi na ihe Jizọs kwuru mere tupu ihe sochirinụ, dịka genitive absolute nwere aorist participle si arụ ọrụ.
- source_word: εἷς παρεστηκὼς τῶν ὑπηρετῶν
  choice: otu onye n’ime ndị nche nọ n’akụkụ ahụ
  rationale: “Ndị nche” dabara n’ọnọdụ ndị ọrụ ọchịchị nọ n’okpuru ndị isi nchụàjà; “nọ n’akụkụ ahụ” na-egosi na onye ahụ guzoro nso.
- source_word: ἔδωκεν ῥάπισμα
  choice: mara Jizọs ụra
  rationale: Akpaalaokwu Igbo a na-egosi iti mmadụ ụra ma ọ bụ ịkụ ya aka, na-enweghị ịkọwa kpọmkwem ma ọ bụ ụra ihu ka ọ bụ ụdị iti ọzọ.
- source_word: τῷ Ἰησοῦ
  choice: Jizọs
  rationale: Onye okwu Grik a na-emetụta ghọrọ ihe nnara nke ngwaa n’Igbo.
- source_word: εἰπών
  choice: sị
  rationale: Ụzọ Igbo dị nkenke ma bụrụkwa eke isi webata okwu onye kwuru kpọmkwem.
- source_word: Οὕτως ἀποκρίνῃ
  choice: Ọ bụ otu a ka ị si aza
  rationale: Na-edobe ajụjụ ịba mba nke metụtara otú Jizọs si zaa.
- source_word: τῷ ἀρχιερεῖ
  choice: nnukwu onye nchụàjà
  rationale: Okwu Igbo doro anya maka onye isi nchụàjà kachasị elu n’ọnọdụ a.
theological_decisions:
- issue: Ihe ὑπηρετῶν na-akọwa
  choice: ndị nche, ya bụ ndị ọrụ ọchịchị nọ n’ebe ahụ
  alternative: ndị na-eje ozi ma ọ bụ ndị odibo
  rationale: N’akụkọ ikpe Jizọs n’akwụkwọ Jọn, okwu ahụ yikarịrị ka ọ na-ezo aka n’ọrụ ndị nọ n’okpuru ndị isi nchụàjà, ma okwu Grik ahụ nwere ike ịpụta ndị na-eje ozi n’ụzọ sara mbara.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke oge a ma dị ùgwù. A họọrọ “mara ... ụra” maka omume ahụ, ebe nkọwa ala peeji na-edobe obosara ihe okwu Grik nwere ike ịpụta. E debere ajụjụ ịba mba ahụ n’ụdị okwu ndị mmadụ na-aghọta ngwa ngwa.
