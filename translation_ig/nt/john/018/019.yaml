  text: Ὁ οὖν ἀρχιερεὺς ἠρώτησεν τὸν Ἰησοῦν περὶ τῶν μαθητῶν αὐτοῦ καὶ περὶ τῆς διδαχῆς αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/019.yaml
  text: So the high priest questioned Jesus about his disciples and about his teaching[a].
translation:
  language: ig
  text: Ya mere, nnukwu onye nchụaja ahụ jụrụ Jizọs ajụjụ banyere ndị na-eso ụzọ ya na banyere nkuzi ya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “jụrụ Jizọs.” Okwu Grik ahụ pụrụ ịpụta “jụrụ” ma ọ bụ “jụrụ ajụjụ”; a họọrọ “jụrụ ajụjụ” iji gosipụta ọnọdụ nyocha a na-eme n’ihu ndị ọchịchị.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Ya mere
  rationale: Na-egosi njikọ na ihe ndị mere tupu nke a, ma na-aga n'ihu n'akụkọ ahụ n'Igbo dị mfe.
- source_word: ἀρχιερεὺς
  choice: nnukwu onye nchụaja
  rationale: Na-asụgharị aha ọkwa onyeisi nchụaja ndị Juu dị ka Grik si kwuo ya, n'etinyeghị aha Anas n'amaokwu ahụ.
- source_word: ἠρώτησεν
  choice: jụrụ ... ajụjụ
  rationale: Dabara n'ọnọdụ a na-enyocha Jizọs n'ihu ndị ọchịchị, ma ọ dịghị ike ruo n'ókè nke ịsị na a gbara ya ajụjụ ọnụ n'ụzọ mmanye.
- source_word: περὶ
  choice: banyere
  rationale: Na-egosi isiokwu ajụjụ ahụ n'ụzọ doro anya; e jikwa ya mee ihe ugboro abụọ dịka ọ dị na Grik.
- source_word: μαθητῶν
  choice: ndị na-eso ụzọ
  rationale: Ọ bụ okwu Igbo a na-aghọta nke ọma maka ndị na-amụta ihe n'aka onye nkuzi ma na-eso ya.
- source_word: διδαχῆς
  choice: ihe ọ na-akụzi
  rationale: Na-enye echiche nke nkuzi Jizọs n'Igbo eke ma dị mfe karịa okwu pụrụ ịdị ka nkà mmụta okpukpe.
- source_word: αὐτοῦ
  choice: ya / ọ
  rationale: 'Ha abụọ na-ezo aka na Jizọs: ‘ndị na-eso ụzọ ya’ na ‘ihe ọ na-akụzi.’'
theological_decisions:
- issue: Aha ọkwa ἀρχιερεύς n'ọnọdụ akụkọ ahụ metụtara Anas, ọ bụghị Kayafas onye Rom nabatara dị ka nnukwu onye nchụaja n'oge ahụ
  choice: Ịsụgharị aha ọkwa ahụ kpọmkwem dịka ‘nnukwu onye nchụaja’
  alternative: ‘Anas, nnukwu onye nchụaja’ ma ọ bụ ‘onyeisi ndị nchụaja’
  rationale: Nke a na-agbaso okwu Grik n'etinyeghị aha onye ahụ ma ọ bụ nkọwa na-adịghị n'amaokwu ahụ, ya mere ọ na-echekwa otú Jọn si kọọ akụkọ ahụ.
translation_notes:
  register: Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. E ji ‘nnukwu onye nchụaja’ mee ka aha ọkwa ahụ doo anya, ma jiri usoro ahịrịokwu na-adabara ndị na-agụ Igbo taa.
