id: JHN.18.3
reference: John 18:3
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ οὖν Ἰούδας λαβὼν τὴν σπεῖραν καὶ ἐκ τῶν ἀρχιερέων καὶ ⸂ἐκ τῶν⸃ Φαρισαίων ὑπηρέτας ἔρχεται ἐκεῖ μετὰ φανῶν καὶ λαμπάδων καὶ ὅπλων.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/003.yaml
  text: So Judas[a], having taken the cohort and officers from the chief priests and from the Pharisees[b], comes there with lanterns and torches and weapons.
translation:
  language: ig
  text: Ya mere, Judas weere òtù ndị agha[a] na ndị nche[b] sitere n’aka ndị isi nchụaja na ndị Farisii, bịara ebe ahụ ji oriọna, ọwa ọkụ, na ngwa agha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ‘òtù ndị agha’ dịka ‘akụkụ ndị agha’ ma ọ bụ ‘ìgwè ndị agha.’ Okwu Grik bụ σπεῖρα, nke nwere ike ịpụta otu ndị agha a na-akpọ cohort, ma ọ pụtaghị na ndị agha niile nọ n’otu ahụ bịara.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ‘ndị nche’ dịka ‘ndị ọrụ ọchịchị’ ma ọ bụ ‘ndị uwe ojii ụlọ nsọ.’ Okwu Grik bụ ὑπηρέτας, nke na-ezo aka n’ndị ọrụ na-ejere ndị ọchịchị ndị Juu ozi.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Ya mere
  rationale: Ọ na-ejikọta ihe a na akụkọ bu ya ụzọ ma na-egosi ihe si na ya pụta; okwu a bụkwa Igbo doro anya nke a na-eji n’akụkọ.
- source_word: λαβὼν
  choice: kpọọrọ
  rationale: N’ebe a, participle a pụtara na Judas duuru ma ọ bụ kpọọrọ ndị ahụ soro ya; ‘kpọọrọ’ na-eme ka usoro omume ahụ bụrụ Igbo eke.
- source_word: σπεῖραν
  choice: òtù ndị agha
  rationale: Okwu Grik a na-ezo aka n’otu ndị agha ma ọ bụ akụkụ ya. Nhọrọ a na-egosi ọdịdị agha ha n’enweghị ikwu na ndị agha niile nke cohort ahụ nọ ebe ahụ.
- source_word: ὑπηρέτας
  choice: ndị nche
  rationale: N’akwụkwọ Jọn, okwu a na-ezokarị aka n’ndị ọrụ ọchịchị ndị Juu na-eji eche nche ma ọ bụ jide mmadụ; ‘ndị nche’ bụ okwu Igbo a ghọtara ngwa ngwa n’enweghị ịkọwa ọrụ ha karịa ihe ederede kwuru.
- source_word: ἀρχιερέων
  choice: ndịisi nchụaja
  rationale: Nke a bụ ntụgharị Igbo kwesịrị ekwesị maka ndị nọ n’ọkwa ndu n’etiti ndị nchụaja, ọ bụghị ikwu na ha niile bụ otu nnukwu onye nchụaja n’otu oge.
- source_word: Φαρισαίων
  choice: ndị Farisii
  rationale: Ọ bụ aha otu okpukpe ahụ nke a na-asụgharịkarị n’ụdị a n’Igbo.
- source_word: ἔρχεται ἐκεῖ
  choice: bịa ebe ahụ
  rationale: Nhazi ‘kpọọrọ ... bịa’ bụ ụzọ Igbo eke isi gosipụta ọbịbịa Judas na ndị so ya, ma na-edobe ebe a kpọtụrụla aha na gburugburu okwu.
- source_word: φανῶν
  choice: oriọna
  rationale: Ọ na-ezo aka n’ihe ọkụ a na-ebugharị ebugharị; ‘oriọna’ na-ekewapụkwa ya na ọwa ọkụ nke na-esote.
- source_word: λαμπάδων
  choice: ọwa ọkụ
  rationale: Okwu a na-ezokarị aka n’ọwa na-enwu ọkụ; nhọrọ a na-echekwa ọdịiche dị n’etiti ụdị ọkụ abụọ ahụ.
- source_word: ὅπλων
  choice: ngwa agha
  rationale: Ọ bụ okwu sara mbara maka ihe e ji alụ ọgụ ma ọ bụ emerụ mmadụ ahụ, ya mere ọ naghị akọwa ụdị ngwa agha ederede na-akọwaghị.
theological_decisions:
- issue: Ndị mejupụtara ìgwè bịara ijide Jizọs
  choice: E debere ‘òtù ndị agha’ iche na ‘ndị nche’ sitere n’aka ndịisi nchụaja na ndị Farisii.
  alternative: A pụrụ ijikọ ha n’ụzọ sara mbara dịka ‘ìgwè ndị agha na ndị nche,’ ma ọ bụ kpọọ σπεῖρα ‘akụkụ ndị agha.’
  rationale: Ederede Grik na-egosi òtù ndị agha nakwa ndị ọrụ ndị ọchịchị ndị Juu. Ntugharị a na-echekwa ìgwè abụọ ahụ n’ebughị ụzọ kpebie ọnụ ọgụgụ ndị agha ma ọ bụ kwuo na cohort dum bịara.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ugwu ma dị mfe nghọta. Ahịrịokwu ‘kpọọrọ ... bịa’ na-asụ nke ọma n’Igbo ma na-edobe usoro omume dị na Grik. E kewapụrụ ‘oriọna’ na ‘ọwa ọkụ’ iji chekwaa okwu abụọ dị iche n’asụsụ mbụ.
