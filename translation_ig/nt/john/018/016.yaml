    reason: lexical_alternative
  - marker: b
    text: Ya bụ, onye e debere n’ebe ahụ ka ọ na-elekọta ụzọ mbata.
    reason: lexical_clarification
  revision_rationale: The revision removes a grammatical ambiguity concerning ‘the other disciple,’ expresses Peter’s continuing position more naturally, and improves the action sequence. The revised first footnote preserves the lexical alternative without adding a reciprocal relationship.
