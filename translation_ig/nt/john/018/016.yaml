id: JHN.18.16
reference: John 18:16
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ δὲ Πέτρος εἱστήκει πρὸς τῇ θύρᾳ ἔξω. ἐξῆλθεν οὖν ὁ μαθητὴς ὁ ἄλλος ⸀ὁ γνωστὸς ⸂τοῦ ἀρχιερέως⸃ καὶ εἶπεν τῇ θυρωρῷ καὶ εἰσήγαγεν τὸν Πέτρον.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/016.yaml
  text: But Peter was standing outside at the door[a]. So the other disciple, who was known to the high priest[b], went out and spoke to the doorkeeper and brought Peter in.
translation:
  language: ig
  text: Ma Pita nọ na-eguzo n’èzí n’ọnụ ụzọ. Ya mere, onye na-eso ụzọ ọzọ ahụ, bú onye nnukwu onye nchụàjà maara[a], wee pụọ gwa nwaanyị na-eche ọnụ ụzọ[b] okwu, wee kpọbata Pita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “bú onye nnukwu onye nchụàjà matara.” Asụsụ Grik ekwughị otú mmekọrịta ha siri dị nso.
    reason: lexical_alternative
  - marker: b
    text: Ya bụ, onye e debere n’ebe ahụ ka ọ na-elekọta ụzọ mbata.
    reason: lexical_clarification
lexical_decisions:
- source_word: εἱστήκει
  choice: guzo
  rationale: N’ebe a, ụdị ngwaa ahụ na-egosi na Pita nọgidere n’ọnọdụ iguzo; “guzo” na-enye echiche ahụ n’Igbo n’enweghị ịgbakwụnye oge na-adịghị n’ihe odide ahụ.
- source_word: πρὸς τῇ θύρᾳ ἔξω
  choice: n’èzí n’ọnụ ụzọ
  rationale: Nke a na-echekwa ma echiche nke ịnọ n’èzí ma ebe ọ nọ, ya bụ n’ọnụ ụzọ.
- source_word: ὁ μαθητὴς ὁ ἄλλος
  choice: onye ọzọ ahụ na-eso ụzọ
  rationale: Nke a bụ okwu Igbo doro anya maka μαθητής n’akụkọ Oziọma ma na-egosi mmekọrịta onye na-eso onye nkụzi, ọ bụghị naanị nwa akwụkwọ.
- source_word: ὁ γνωστὸς τοῦ ἀρχιερέως
  choice: onye nnukwu onye nchụàjà maara
  rationale: 'Nhọrọ a na-edebe nghọta sara mbara nke γνωστός: onye a maara, n’agbanyeghị otú mmekọrịta ha siri dị nso.'
- source_word: ἀρχιερεύς
  choice: nnukwu onye nchụàjà
  rationale: Nke a bụ aha ọrụ doro anya n’Igbo maka onyeisi nchụàjà ndị Juu.
- source_word: θυρωρῷ
  choice: nwaanyị na-eche ọnụ ụzọ
  rationale: Okwu ahụ pụtara onye nọ na-elekọta ụzọ mbata; ụdị njirimara nwanyị dị n’asụsụ Grik na-egosikwa na onye ahụ bụ nwaanyị.
- source_word: εἶπεν τῇ θυρωρῷ
  choice: gwa nwaanyị na-eche ọnụ ụzọ okwu
  rationale: Ebe e deghị kpọmkwem ihe o kwuru, “gwa … okwu” bụ Igbo dị mfe nke na-egosi na ọ gwara ya okwu.
- source_word: εἰσήγαγεν τὸν Πέτρον
  choice: kpọbata Pita
  rationale: “Kpọbata” na-egosi ime ka Pita si n’èzí bata n’ime, n’enweghị ịkọwa karịa ihe dị n’ihe odide Grik.
theological_decisions: []
translation_notes:
  register: E ji Igbo Izugbe dị ugbu a, dị ùgwù ma dị mfe nghọta. A hapụrụ ụdị mmekọrịta dị n’etiti onye ahụ na nnukwu onye nchụàjà ka ọ ghara ịpụta nke doro anya karịa otú Grik si kwuo ya.
