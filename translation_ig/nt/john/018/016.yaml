revisions:
- from: Ma Pita guzo n’èzí n’ọnụ ụzọ. Ya mere, onye ọzọ ahụ na-eso ụzọ, bú onye nnukwu onye nchụàjà maara[a], pụrụ gaa gwa nwaanyị na-eche ọnụ ụzọ[b] okwu, wee kpọbata Pita.
  to: Ma Pita nọ na-eguzo n’èzí n’ọnụ ụzọ. Ya mere, onye na-eso ụzọ ọzọ ahụ, bú onye nnukwu onye nchụàjà maara[a], wee pụọ gwa nwaanyị na-eche ọnụ ụzọ[b] okwu, wee kpọbata Pita.
