source:
  edition: SBLGNT
  text: ἵνα πληρωθῇ ὁ λόγος ὃν εἶπεν ὅτι Οὓς δέδωκάς μοι οὐκ ἀπώλεσα ἐξ αὐτῶν οὐδένα.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/009.yaml
  text: 'so that the word that he had spoken might be fulfilled: “Of those whom you have given me[a], I lost not one.”'
translation:
  language: ig
  text: 'ka okwu ahụ o kwuru wee mezuo: “N’ime ndị i nyeworo m, ọ dịghị ọbụna otu onye[a] m tufuru.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “ọ dịghị otu onye n’ime ha” ma ọ bụ “ọ dịghị onye n’ime ha m tufuru.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα πληρωθῇ
  choice: ka ... wee mezuo
  rationale: Nke a na-egosi nzube ma ọ bụ ihe si na ya pụta, ma na-edobekwa echiche nke okwu ahụ iru mmezu ya.
- source_word: ὁ λόγος ὃν εἶπεν
  choice: okwu ahụ o kwuru
  rationale: N'ebe a, λόγος bụ otu okwu Jizọs kwuru na mbụ, ọ bụghị aha nsọpụrụ ‘Okwu ahụ.’ Nhazi a bụ Igbo doro anya ma dịkwa ebube.
- source_word: Οὓς δέδωκάς μοι
  choice: ndị ahụ i nyeworo m
  rationale: ‘Nyeworo’ na-egosipụta omume e mere nke ihe ọ rụpụtara ka dị, dịka perfect δέδωκάς si dị.
- source_word: ἀπώλεσα
  choice: m furu efu
  rationale: N'ọnọdụ a, okwu ahụ pụtara na Jizọs ahapụghị ndị e nyere ya ka ha laa n'iyi; ‘furu efu’ na-edobe okwu Jọn ji na esemokwu echiche dị n'ime ya, kama ịtụgharị ya ka ọ bụrụ ‘bibiri.’
- source_word: ἐξ αὐτῶν οὐδένα
  choice: ọ dịghị onye ọbụla
  rationale: 'Nke a na-egosipụta nkwusi ike nke Grik: ọ dịghị ọbụna otu onye n''ime ha. Mmalite ahịrịokwu ahụ, ‘N’ime ndị ahụ,’ na-ebukwa echiche partitive nke ἐξ αὐτῶν.'
theological_decisions:
- issue: Ụdị mmezu a na-ekwu maka ya
  choice: A tụgharịrị πληρωθῇ dịka okwu Jizọs kwuru nke mezuru, n'ebughị ụzọ kpọọ ya amụma Akwụkwọ Nsọ.
  alternative: ‘ka okwu ahụ wee bụrụ eziokwu’
  rationale: Jọn na-eji asụsụ mmezu eme ihe maka okwu Jizọs n'onwe ya. ‘Wee mezuo’ na-edobe ịdị arọ nke nzube Chineke na mmezu dị n'akụkọ ahụ.
- issue: Ihe ἀπώλεσα pụtara gbasara ndị na-eso ụzọ
  choice: ‘m furu efu,’ nke na-egosi na Jizọs chebere ndị e nyere ya.
  alternative: ‘m bibiri’ ma ọ bụ ‘m kwere ka ọ laa n’iyi’
  rationale: Ihe na-eme n'akụkọ a bụ nchebe Jizọs na-echebe ndị na-eso ụzọ ya n'oge a na-ejide ya, ma okwu a na-ekwughachikwa Jọn 17:12. Nhọrọ a anaghị etinye nkọwa okwukwe otu òtù n'ime amaokwu ahụ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, doro anya ma dị ùgwù. Nhazi ‘N’ime ndị ahụ i nyeworo m’ na-edobe usoro na nkwusi ike nke Grik n'ụzọ onye Igbo nkịtị ga-aghọta.
