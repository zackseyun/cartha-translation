id: JHN.18.32
reference: John 18:32
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἵνα ὁ λόγος τοῦ Ἰησοῦ πληρωθῇ ὃν εἶπεν σημαίνων ποίῳ θανάτῳ ἤμελλεν ἀποθνῄσκειν.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/032.yaml
  text: so that the word of Jesus would be fulfilled[a], which he had spoken[c][b], indicating by what kind of death he was about to die.
translation:
  language: ig
  text: ka okwu Jizọs ahụ wee mezuo[a], bụ́ nke o kwuru[c][b], na-egosi ụdị ọnwụ ọ gaje ịnwụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ihe Jizọs kwuru.”
    reason: lexical_alternative
  - marker: b
    text: Ya bụ, Jizọs egosila ụzọ ọ ga-esi nwụọ; o yiri ka nke a na-ekwu maka ịkpọgide ya n’obe. Tulee Jọn 12:32–33.
    reason: cross_reference
  - marker: c
    text: Ma ọ bụ, “bụ́ nke o kwuru iji gosi.”
    reason: previous_rendering
lexical_decisions:
- source_word: ἵνα
  choice: ka ... wee
  rationale: Ụdị a na-egosi ebumnuche ma ọ bụ ihe si n’ihe gara aga pụta, ma na-adabara Igbo nke oge a.
- source_word: ὁ λόγος τοῦ Ἰησοῦ
  choice: okwu Jizọs ahụ
  rationale: N’ebe a, λόγος pụtara okwu Jizọs kwuru, ọ bụghị aha nsọpụrụ ahụ bụ ‘Okwu ahụ’ dị na Jọn 1:1.
- source_word: πληρωθῇ
  choice: wee mezuo
  rationale: ‘Mezuo’ na-echekwa asụsụ Akwụkwọ Nsọ banyere mmezu nke okwu e buru ụzọ kwuo.
- source_word: ὃν εἶπεν
  choice: bụ́ nke o kwuru
  rationale: Nke a na-ejikọta nkebi ahịrịokwu ahụ n’ụzọ doro anya na ‘okwu Jizọs ahụ,’ ma na-egosi na o kwuru ya tupu ihe a emee.
- source_word: σημαίνων
  choice: na-egosi
  rationale: Ọ na-edobe participle Grik dị ka nkọwa nke ihe Jizọs na-eme site n’okwu ahụ, n’enweghị ịmanye ya ka ọ bụrụ naanị ebumnuche.
- source_word: ποίῳ θανάτῳ
  choice: ụdị ọnwụ
  rationale: ποίῳ na-ajụ ụdị ma ọ bụ ụzọ ọnwụ ahụ ga-adị, ọ bụghị naanị na ọnwụ ga-eme.
- source_word: ἤμελλεν ἀποθνῄσκειν
  choice: ọ gaje ịnwụ
  rationale: ‘Gaje’ na-egosi ihe na-abịa ime n’oge na-adịghị anya, ma ọ naghị etinye echiche siri ike karịa nke μέλλω banyere akara aka.
theological_decisions:
- issue: Asụsụ mmezu gbasara okwu Jizọs buru ụzọ kwuo
  choice: okwu Jizọs ahụ wee mezuo
  alternative: ihe Jizọs kwuru wee bụrụ eziokwu
  rationale: ‘Mezuo’ na-echekwa ịdị arọ nke πληρωθῇ na isiokwu Jọn banyere mmezu nke okwu Jizọs.
- issue: Ike μέλλω nwere n’ihe gbasara ọnwụ Jizọs
  choice: ọ gaje ịnwụ
  alternative: a kara aka na ọ ga-anwụ
  rationale: Ihe odide ahụ na-ekwu maka ọnwụ na-abịa; ọ dịghị mkpa itinye n’amaokwu a echiche siri ike banyere akara aka.
- issue: Ihe σημαίνων na-akọwa
  choice: na-egosi
  alternative: iji gosi
  rationale: Participial rendering na-echekwa ohere ka nkebi ahụ kọwaa otú okwu Jizọs si arụ ọrụ, kama ikpebi na ọ bụ naanị nkebi ebumnuche.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. E debere ahịrịokwu ahụ dịka nkebi na-aga n’ihu site n’amaokwu bu ya ụzọ, dịka ọ dị na Grik; ‘ọ gaje ịnwụ’ zere ịgbakwunye nkwupụta siri ike banyere akara aka.
