id: JHN.18.30
reference: John 18:30
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀπεκρίθησαν καὶ εἶπαν αὐτῷ· Εἰ μὴ ἦν οὗτος ⸂κακὸν ποιῶν⸃, οὐκ ἄν σοι παρεδώκαμεν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/030.yaml
  text: They answered and said to him[a], “If this man were not an evildoer, we would not have handed him over to you.”
translation:
  language: ig
  text: Ha zara ya sị, “A sị na nwoke a adịghị eme ihe ọjọọ, anyị agaraghị enyefe ya n’aka gị.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθησαν καὶ εἶπαν αὐτῷ
  choice: Ha zara ya sị
  rationale: Nke a na-asụ Igbo n'ụzọ ebumpụta ụwa ma na-echekwa ma nzaghachi ahụ ma okwu ha kwuru, n'enweghị nkwughachi na-adịghị atọ ụtọ.
- source_word: Εἰ μὴ ἦν
  choice: A sị na ... adịghị
  rationale: Ụdị a na-egosipụta ọnọdụ megidere ihe ndị na-ekwu okwu chere na ọ bụ eziokwu, dị ka usoro Grik si mee.
- source_word: οὗτος
  choice: nwoke a
  rationale: Ọ na-ezo aka na Jizọs n'ụzọ kewapụrụ onwe ha n'ebe ọ nọ, ma ọ naghị etinye nlelị karịrị nke Grik kwuru.
- source_word: κακὸν ποιῶν
  choice: eme ihe ọjọọ
  rationale: Ọ na-echekwa ọdịdị omume nke participle ποιῶν na ebubo sara mbara nke κακόν, kama ịgbanwe ya ka ọ bụrụ aha iwu kpọmkwem.
- source_word: οὐκ ἄν σοι παρεδώκαμεν αὐτόν
  choice: anyị agaraghị enyefe ya n’aka gị
  rationale: “Agaraghị” na-egosipụta nsonaazụ ọnọdụ megidere eziokwu; “enyefe ... n’aka gị” dabara n'ọnọdụ ikpe ma bụrụ Igbo doro anya.
theological_decisions:
- issue: Ụdị na ike ebubo ndị ahụ boro Jizọs
  choice: “eme ihe ọjọọ” dị ka ebubo omume sara mbara
  alternative: “onye na-eme ihe ọjọọ” ma ọ bụ okwu na-akpọ ya onye omekome
  rationale: κακὸν ποιῶν abụghị aha iwu kpọmkwem. Nsụgharị a na-echekwa ebubo ha nke na-akọwaghị mpụ pụrụ iche ma ghara itinye nkọwa iwu na-adịghị n'ederede.
translation_notes:
  register: Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E ji “Ha zara ya sị” mee ka usoro akụkọ ahụ bụrụ nke ebumpụta ụwa; e jighị akara ntụaka ala peeji n'ihi na ọ dịghị ọdịiche ederede ma ọ bụ nkọwa dị mkpa chọrọ ya n'amaokwu a.
