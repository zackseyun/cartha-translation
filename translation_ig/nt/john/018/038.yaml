  text: λέγει αὐτῷ ὁ Πιλᾶτος· Τί ἐστιν ἀλήθεια; Καὶ τοῦτο εἰπὼν πάλιν ἐξῆλθεν πρὸς τοὺς Ἰουδαίους, καὶ λέγει αὐτοῖς· Ἐγὼ οὐδεμίαν ⸂εὑρίσκω ἐν αὐτῷ αἰτίαν⸃·
base_translation:
  language: en
  yaml_path: translation/nt/john/018/038.yaml
  text: Pilate said to him[a], “What is truth?” After saying this, he went out again to the Jews and said to them, “I find no case against him.”
translation:
  language: ig
  text: Paịlet sịrị ya, “Gịnị bụ eziokwu?” Mgbe o kwusịrị nke a, ọ pụtara ọzọ gaa n’ebe ndị Juu nọ[a], sị ha, “Ahụghị m ihe ndabere ọ bụla maka ebubo megide ya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị ndú ndị Juu.” N’Oziọma Jọn, “ndị Juu” nwere ike mgbe ụfọdụ ịpụta kpọmkwem ndị ọchịchị Judia ma ọ bụ ìgwè ndị nnọchiteanya na-emegide Jizọs n’ọnọdụ ahụ.
    reason: alternative_reading
lexical_decisions:
- source_word: λέγει αὐτῷ ὁ Πιλᾶτος
  choice: Paịlet sịrị ya
  rationale: A sụgharịrị λέγει, bụ́ historical present, n’oge gara aga ka akụkọ ahụ daa nke ọma n’Igbo.
- source_word: Τί ἐστιν ἀλήθεια;
  choice: Gịnị bụ eziokwu?
  rationale: ἀλήθεια enweghị article; “eziokwu” na-edobe ajụjụ ahụ n’ụdị sara mbara, na-etinyeghị nkọwa ọzọ.
- source_word: Καὶ τοῦτο εἰπὼν πάλιν ἐξῆλθεν
  choice: Mgbe o kwusịrị nke a, ọ pụkwara ọzọ
  rationale: “Mgbe o kwusịrị nke a” na-egosi na ihe mbụ mere tupu ọ pụọ; “ọ pụkwara ọzọ” na-edobe πάλιν na mmegharị ịpụ apụ.
- source_word: πρὸς τοὺς Ἰουδαίους
  choice: gaa n’ebe ndị Juu nọ[a]
  rationale: Isi okwu ahụ na-edobe ntụgharị kpọmkwem nke Ἰουδαίους, ebe ihe odide ala peeji na-egosi na n’ọnọdụ a ọ pụrụ ịpụta ndị isi Juu ma ọ bụ ìgwè ndị na-emegide Jizọs nọ ebe ahụ.
- source_word: Ἐγὼ οὐδεμίαν εὑρίσκω ἐν αὐτῷ αἰτίαν
  choice: Ahụghị m ihe ọ bụla e nwere ike iji boo ya ebubo
  rationale: N’ọnọdụ ikpe a, αἰτία pụtara ihe ndabere maka ebubo ma ọ bụ ikpe, ọ bụghị naanị ntụpọ omume; okwu Igbo a doro anya ma bụrụkwa nke mmadụ nkịtị ga-aghọta.
theological_decisions:
- issue: Ihe Ἰουδαίοις na-ezo aka na ya n’akụkọ ahụhụ Jizọs dị na Jọn
  choice: Ndị Juu n’isi okwu, tinyere nkọwa ala peeji
  alternative: Ndị isi Juu; ndị Judia
  rationale: Nke a na-edobe okwu Grik n’isi ederede, ma na-echekwakwa nghọta gbara ya gburugburu nke nwere ike ịbụ ndị ọchịchị ma ọ bụ ndị nnọchiteanya na-ebo Jizọs ebubo, ọ bụghị ndị Juu niile.
- issue: Ụdị ajụjụ Paịlet banyere ἀλήθεια
  choice: Gịnị bụ eziokwu?
  alternative: Gịnị bụ eziokwu ahụ?
  rationale: Enweghị article n’asụsụ Grik; e kwesịghị ime ka ajụjụ ahụ bụrụ nke a kapịrị ọnụ karịa ka isi mmalite si kwuo.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke oge a ma dị ùgwù. E ji okwu ikpe a na-aghọta ngwa ngwa kọwaa αἰτία, ma e debere nghọtahie kwesịrị ekwesị dị na Ἰουδαίους site n’ihe odide ala peeji.
