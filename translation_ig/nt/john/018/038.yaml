revisions:
- from: Paịlet sịrị ya, “Gịnị bụ eziokwu?” Mgbe o kwusịrị nke a, ọ pụkwara ọzọ gaa n’ebe ndị Juu nọ[a], sị ha, “Ahụghị m ihe ọ bụla e nwere ike iji boo ya ebubo.”
  to: Paịlet sịrị ya, “Gịnị bụ eziokwu?” Mgbe o kwusịrị nke a, ọ pụtara ọzọ gaa n’ebe ndị Juu nọ[a], sị ha, “Ahụghị m ihe ndabere ọ bụla maka ebubo megide ya.”
  rationale: The revision corrects the rendering of Pilate’s repeated exit and makes the legal sense of αἰτία explicit in idiomatic Standard Igbo. The footnote is lightly refined so that its first alternative directly matches “Jewish leaders,” while preserving the contextual ambiguity of Ἰουδαίους.
