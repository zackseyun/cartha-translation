id: JHN.18.6
reference: John 18:6
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὡς οὖν εἶπεν ⸀αὐτοῖς· Ἐγώ εἰμι, ἀπῆλθον εἰς τὰ ὀπίσω καὶ ἔπεσαν χαμαί.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/006.yaml
  text: So when he said to them[a], “I am he,” they went backward and fell to the ground.
translation:
  language: ig
  text: Ya mere, mgbe ọ gwara ha[a], “Ọ bụ m,” ha gara azụ ma daa n’ala.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n'ụzọ nkịtị karịa, “Abụ m.” Okwu Grik a nwekwara ike ịkpọghachi nkwupụta “Abụ m” ndị pụrụ iche dị n’Oziọma Jọn.
    reason: alternative_reading
lexical_decisions:
- source_word: ὡς οὖν
  choice: Ya mere, mgbe
  rationale: Na-egosi ma njikọ nke ihe a na ihe gara aga ma oge ihe ahụ mere, n’Igbo dị mfe ma kwụ ọtọ.
- source_word: εἶπεν αὐτοῖς
  choice: ọ gwara ha
  rationale: Ọ bụ ụzọ Igbo nkịtị si akọ na mmadụ kwuru okwu nye ndị ọzọ.
- source_word: Ἐγώ εἰμι
  choice: Ọ bụ m
  rationale: N’ọnọdụ a, okwu ahụ bụ ịkọwapụta onwe ya nye ndị na-achọ Jizọs; “Ọ bụ m” na-enye nghọta ahụ n’Igbo, ebe nkọwa ala peeji na-echekwa ọdịdị okwu Grik na mgbagwoju anya okwukwe ya.
- source_word: ἀπῆλθον εἰς τὰ ὀπίσω
  choice: ha laghachiri azụ
  rationale: Na-egosi mmegharị ha gara n’azụ n'ụzọ doro anya, na-enweghị ịgbakwunye ihe mere ha ji mee ya.
- source_word: ἔπεσαν χαμαί
  choice: daa n’ala
  rationale: 'Na-echekwa ihe omume ahụ kpọmkwem: ha dara ruo n’ala.'
theological_decisions:
- issue: Ụzọ e si sụgharịa Ἐγώ εἰμι n’Oziọma Jọn, ebe ọ nwere ike ịbụ nkwupụta njirimara ma nwekwaa ụda miri emi
  choice: Ọ bụ m
  alternative: Abụ m
  rationale: Ọnọdụ mkparịta ụka ahụ na-akwado nkwupụta njirimara nkịtị, ya mere isi amaokwu ji “Ọ bụ m.” Ma “Abụ m,” nke nọ nso n’usoro Grik ma nwee ike ịkpọghachi okwu “Abụ m” ndị ọzọ dị na Jọn, ka edobere na nkọwa ala peeji ka a ghara idozi mgbagwoju anya ahụ n’otu ụzọ naanị.
translation_notes:
  register: Standard Igbo nke oge a, dị nsọ ma dị mfe nghọta. E ji “Ọ bụ m” mee ka nkwupụta njirimara ahụ bụrụ nke nkịtị n’Igbo, ma chekwaa ọdịdị “Abụ m” na ụda okwukwe ya na nkọwa ala peeji.
