  source_fidelity: The draft preserves the temporal-inferential force of ὡς οὖν, Jesus’ self-identification, the backward movement, and the fall to the ground. However, “laghachiri azụ” can suggest returning to a prior place rather than simply moving backward; “gara azụ” is closer to ἀπῆλθον εἰς τὰ ὀπίσω.
