id: JHN.18.5
reference: John 18:5
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀπεκρίθησαν αὐτῷ· Ἰησοῦν τὸν Ναζωραῖον. λέγει ⸀αὐτοῖς· Ἐγώ εἰμι. εἱστήκει δὲ καὶ Ἰούδας ὁ παραδιδοὺς αὐτὸν μετ’ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/005.yaml
  text: They answered him, “Jesus the Nazarene.” He said to them, “I am he.” Now Judas, who was betraying him, was also standing with them.
translation:
  language: ig
  text: Ha zara ya, sị, “Jizọs onye Nazaret.” Ọ sịrị ha, “Ọ bụ m.” Judas, onye ahụ na-arara ya nye, sokwa ha guzoro n'ebe ahụ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰησοῦν τὸν Ναζωραῖον
  choice: Jizọs onye Nazaret
  rationale: Nke a na-egosipụta aha ahụ na njikọ ya na Nazaret n'Igbo doro anya ma dịkwa n'okike.
- source_word: Ἐγώ εἰμι
  choice: Ọ bụ m
  rationale: N'ọnọdụ ajụjụ nke amaokwu gara aga, nke a bụ ụzọ Igbo si aza ‘I am he’ n'ụzọ ebumpụta ụwa, ebe ọ ka na-edobe mkpirikpi na ibu okwu Grik ahụ.
- source_word: ὁ παραδιδοὺς αὐτόν
  choice: onye ahụ na-arara ya nye
  rationale: Present participle ahụ na-egosi omume Judas nọ na-eme n'oge ahụ; ‘na-arara ya nye’ na-eburu echiche nke inyefe mmadụ n'aka ndị iro site n'aghụghọ.
- source_word: εἱστήκει ... μετ’ αὐτῶν
  choice: sokwa ha guzoro n'ebe ahụ
  rationale: Nke a na-edobe ọnọdụ Judas dị ka onye guzo n'etiti ndị bịara ijide Jizọs.
theological_decisions:
- issue: Ma a ga-asụgharị Ἐγώ εἰμι dịka nkwupụta zuru oke ‘Abụ m’ ma ọ bụ dịka azịza njirimara ‘Ọ bụ m’
  choice: Ọ bụ m
  alternative: Abụ m
  rationale: Ọnọdụ mkparịta ụka ahụ na-akwado azịza njirimara nke nwere ihe e bu n'uche ma a kpọghị ya aha. Nhọrọ a anaghị agọnahụ nkwughachi okwu ahụ n'ebe ndị ọzọ n'Oziọma Jọn, ma ọ naghị amanye nkọwa nkà mmụta okpukpe n'ime Igbo na-adịghị ekwe nghọta n'onwe ya.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị mfe nghọta ma nwee ugwu. E ji ‘Jizọs’ na ‘Judas’ dịka ụdị aha ndị a maara nke ọma n'Igbo; ahịrịokwu ahụ na-edobe usoro akụkọ na ọdịiche dị n'etiti Jizọs na Judas.
