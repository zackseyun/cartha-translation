source:
  edition: SBLGNT
  text: ἀπεκρίθη ⸀αὐτῷ Ἰησοῦς· Εἰ κακῶς ἐλάλησα, μαρτύρησον περὶ τοῦ κακοῦ· εἰ δὲ καλῶς, τί με δέρεις;
base_translation:
  language: en
  yaml_path: translation/nt/john/018/023.yaml
  text: Jesus answered him[a], “If I spoke wrongly, testify about the wrong; but if rightly[b], why do you strike me?”
translation:
  language: ig
  text: Jizọs zara ya, sị, “Ọ bụrụ na m kwuru n’ụzọ na-ezighị ezi, gbaa akaebe banyere nke ahụ; ma ọ bụrụ na m kwuru n’ụzọ ziri ezi, gịnị mere i ji eti m ihe?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη αὐτῷ Ἰησοῦς
  choice: Jizọs zara ya, sị
  rationale: Nke a bụ ụzọ Igbo nkịtị si webata azịza n’akụkọ, ma ọ na-edobe Jizọs dị ka onye zara nwoke ahụ.
- source_word: Εἰ κακῶς ἐλάλησα
  choice: Ọ bụrụ na m kwuru ihe ọjọọ
  rationale: “Kwuru ihe ọjọọ” na-egosi na okwu ahụ nwere ike ịbụ nke na-ezighị ezi ma ọ bụ nke jọgburu onwe ya, n’etinyeghị nkọwa karịrị nke Grik.
- source_word: μαρτύρησον περὶ τοῦ κακοῦ
  choice: gbaa akaebe banyere ihe ọjọọ ahụ
  rationale: “Gbaa akaebe” na-echekwa ụda ikpe na ihe akaebe dị na μαρτύρησον; “ihe ọjọọ ahụ” na-edobe ọdịdị aha nke τοῦ κακοῦ.
- source_word: εἰ δὲ καλῶς
  choice: ma ọ bụrụ na m kwuru nke ọma
  rationale: E tinyere ngwaa ahụ ọzọ n’Igbo ka ahịrịokwu doo anya, ebe “nke ọma” na-emegide “ihe ọjọọ” n’enweghị ịkọwapụta ma ọ bụ eziokwu, omume, ma ọ bụ ụzọ ikwu okwu naanị ka e bu n’obi.
- source_word: τί με δέρεις
  choice: gịnị mere i ji eti m ihe?
  rationale: Akpaokwu a bụ ajụjụ “n’ihi gịnị”; “iti ihe” bụ okwu Igbo sara mbara nke nwere ike ịpụta ịkụ mmadụ, n’akọwaghị kpọmkwem ma ọ bụ ịma ụra, otu ọkpọ, ma ọ bụ iti ọtụtụ ihe.
theological_decisions:
- issue: Ụdị nzaghachi Jizọs nye ime ihe ike na-enweghị ihe akaebe
  choice: E gosipụtara ya dị ka ịrịọ ka e nye akaebe ma jụọ ihe kpatara e ji tie ya ihe.
  alternative: Ịgbasawanye ya ka ọ bụrụ nkwupụta doro anya banyere mmegbu ma ọ bụ iwu na-ezighị ezi.
  rationale: Grik ahụ na-eweta arụmụka nwere akụkụ abụọ—ọ bụrụ na okwu ya dị njọ, gbaa akaebe; ọ bụrụ na ọ dị mma, gịnị mere e ji tie ya? Nsụgharị ahụ anaghị etinye nkọwa ozizi ọzọ.
translation_notes:
  register: Standard Igbo dị ugbu a, nke a na-aghọta ngwa ngwa ma ka nwee ugwu. E jighị okwu iwu siri ike nke nwere ike ime ka amaokwu ahụ sie ndị nkịtị ike; “gbaa akaebe” ka na-echekwa ọnọdụ ikpe ahụ.
