- from: Jizọs zara ya, sị, “Ọ bụrụ na m kwuru ihe ọjọọ, gbaa akaebe banyere ihe ọjọọ ahụ; ma ọ bụrụ na m kwuru nke ọma, gịnị mere i ji eti m ihe?”
  to: Jizọs zara ya, sị, “Ọ bụrụ na m kwuru n’ụzọ na-ezighị ezi, gbaa akaebe banyere nke ahụ; ma ọ bụrụ na m kwuru n’ụzọ ziri ezi, gịnị mere i ji eti m ihe?”
  rationale: The revision makes the alleged defect and its opposite explicitly modify Jesus’ manner of speaking, matching κακῶς/καλῶς and avoiding an unnecessary implication that Jesus had spoken an intrinsically evil thing. It retains the legal force of “gbaa akaebe” and the broad, contextually appropriate “eti m ihe” for δέρεις.
