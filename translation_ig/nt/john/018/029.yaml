- from: Ya mere, Paịlet pụrụ gaa n’èzí n’ebe ha nọ, sị ha, “Olee ebubo unu na-ebo nwoke a?”
  to: Ya mere, Paịlet pụtara n’èzí gakwuuru ha, sị ha, “Gịnị bụ ebubo unu na-ebo nwoke a?”
  rationale: The revision corrects the verbal expression for Pilate’s movement out and makes the legal question more direct in modern Standard Igbo. It introduces no interpretive or theological expansion.
