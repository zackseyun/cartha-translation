source:
  edition: SBLGNT
  text: ἐξῆλθεν οὖν ὁ Πιλᾶτος ⸀ἔξω πρὸς αὐτοὺς καὶ ⸀φησίν· Τίνα κατηγορίαν φέρετε ⸀κατὰ τοῦ ἀνθρώπου τούτου;
base_translation:
  language: en
  yaml_path: translation/nt/john/018/029.yaml
  text: So Pilate went outside to them and said, “What accusation do you bring against this man?”
translation:
  language: ig
  text: Ya mere, Paịlet pụtara n’èzí gakwuuru ha, sị ha, “Gịnị bụ ebubo unu na-ebo nwoke a?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξῆλθεν ... ἔξω
  choice: pụtara gaa n’èzí
  rationale: Ngwakọta a na-egosi isi n’ime ụlọ pụta gaa n’èzí. Okwu Igbo a na-anọchi ma ngwaa ahụ ma nkwuwa okwu ἔξω n'ụzọ doro anya ma bụrụkwa nke e ji eme ihe n’asụsụ ugbu a.
- source_word: οὖν
  choice: Ya mere
  rationale: Ọ na-ejikọta ihe a na ihe e kwuru tupu ya, na-egosi ihe si na ọnọdụ ahụ pụta, ma dabara n’akụkọ Igbo.
- source_word: πρὸς αὐτούς
  choice: n’ebe ha nọ
  rationale: N’ebe a πρός na-egosi na Paịlet gara izute ndị ahụ; okwu a na-ada nke ọma n’Igbo karịa ntụgharị siri ike dịka ‘n’ebe ha.’
- source_word: φησίν
  choice: sị ha
  rationale: Ọ bụ ezie na Grik ji oge ugbu a nke akụkọ, Igbo na-ejikarị ‘sị’ kọọ okwu mere eme. Itinye ‘ha’ na-eme ka onye a gwara okwu doo anya.
- source_word: Τίνα κατηγορίαν
  choice: Olee ebubo
  rationale: κατηγορία bụ ebubo ma ọ bụ ihe e ji ebo mmadụ n’ikpe. ‘Ebubo’ bụ okwu Igbo doro anya ma na-echekwa ọnọdụ iwu ahụ.
- source_word: φέρετε κατὰ
  choice: unu na-ebo
  rationale: N’Igbo, a na-asịkarị ‘ibo mmadụ ebubo.’ Nhọrọ a na-enye echiche iwu nke iweta ebubo megide mmadụ n’ụzọ eke, ọ bụ ezie na ọ naghị eso usoro okwu Grik n’otu n’otu.
- source_word: τοῦ ἀνθρώπου τούτου
  choice: nwoke a
  rationale: N’ọnọdụ a ἄνθρωπος na-ezo aka n’otu nwoke, ya mere ‘nwoke a’ ziri ezi karịa okwu sara mbara dịka ‘onye a.’
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị mfe nghọta ma nwee ugwu. A họọrọ usoro ajụjụ eke ‘Olee ebubo unu na-ebo nwoke a?’ iji chekwaa nkọwa ikpe nke Grik n’enweghị asụsụ iwu siri ike.
