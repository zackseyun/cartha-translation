  text: εἶπεν οὖν ὁ Ἰησοῦς τῷ Πέτρῳ· Βάλε τὴν ⸀μάχαιραν εἰς τὴν θήκην· τὸ ποτήριον ὃ δέδωκέν μοι ὁ πατὴρ οὐ μὴ πίω αὐτό;
base_translation:
  language: en
  yaml_path: translation/nt/john/018/011.yaml
  text: So Jesus said to Peter[a], “Put the sword into its sheath[b]. Shall I not drink the cup that the Father has given me?”
translation:
  language: ig
  text: Ya mere, Jizọs sịrị Pita, “Tinye mma agha ahụ n'ọbọ ya[a]. Iko nke Nna nyeworo m, ọ bụ na m agaghị aṅụ ya[b]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ‘ọbọ’ dịka ‘akpa mma agha.’
    reason: lexical_alternative
  - marker: b
    text: 'N’Akwụkwọ Nsọ, ‘iko’ nwere ike ịbụ ihe atụ nke ahụhụ ma ọ bụ ihe Chineke kpebiri ma ọ bụ nyere mmadụ ka ọ zute. Tulee ekpere Jizọs na Getsemani: Mat. 26:39; Mak 14:36; Luk 22:42.'
    reason: cross_reference
lexical_decisions:
- source_word: οὖν
  choice: Ya mere
  rationale: Ọ na-ejikọta okwu Jizọs na ihe mere tupu ya ma na-egosi nzaghachi sitere n'ọnọdụ ahụ.
- source_word: Βάλε
  choice: Tinye
  rationale: N'ebe a, iwu a pụtara itinye ihe n'ime ebe e ji edebe ya; ‘tinye’ bụ okwu Igbo doro anya ma kwekọọ n'ọnọdụ ahụ.
- source_word: μάχαιραν
  choice: mma agha
  rationale: Ọ bụ aha ngwa ọgụ nwere agụba; ‘mma agha’ bụ nsụgharị Igbo a na-aghọta nke ọma ma ghara ime ka ụdị ngwa ọgụ ahụ dị warara karịa ihe Grik kwuru.
- source_word: θήκην
  choice: ọbọ
  rationale: ‘Ọbọ’ na-egosi ihe e ji ekpuchi ma ọ bụ edobe agụba mma agha, na-echekwa ihe oyiyi doro anya dị na Grik.
- source_word: ποτήριον
  choice: iko
  rationale: A hapụrụ ihe atụ ahụ dịka ‘iko’ kama ịkọwa ya ozugbo dịka ahụhụ, ọnwụ, ma ọ bụ iwe Chineke.
- source_word: δέδωκέν
  choice: nyeworo
  rationale: Ụdị ngwaa a na-egosi ihe e mere nke ka nwere mkpa ugbu a; ‘nyeworo’ na-ebute nghọta ahụ n'Igbo.
- source_word: ὁ πατήρ
  choice: Nna
  rationale: Ọ na-edobe okwu Jọn banyere ‘Nna’ n'etinyeghị ‘Nna m,’ nke na-adịghị n'okwu Grik a.
- source_word: οὐ μὴ πίω αὐτό;
  choice: ọ bụ na m agaghị aṅụ ya?
  rationale: 'Ajụjụ a na-atụ anya azịza nkwenye: Jizọs ga-aṅụ iko ahụ. Nhazi a na-edobe ike ajụjụ ahụ n''Igbo.'
theological_decisions:
- issue: Ihe ‘iko’ pụtara
  choice: E debere ‘iko’ dịka ihe atụ maka ahụhụ ma ọ bụ ihe Nna nyere Jizọs ka o zute, n'akọwaghị ya n'ụzọ dị warara n'ahịrị bụ isi.
  alternative: Ịsụgharị ya ozugbo dịka ‘ahụhụ,’ ‘ọnwụ,’ ‘obe,’ ma ọ bụ ‘iko iwe Chineke.’
  rationale: Ọnọdụ Akwụkwọ Nsọ na-egosi ahụhụ e kenyere ya, ma amaokwu a akọwaghị iko ahụ n'ụzọ dị warara. Idebe ihe atụ ahụ na-echekwa obosara na esemokwu nkà mmụta okpukpe dị n'okwu ahụ.
- issue: Nrubeisi Jizọs nye Nna
  choice: A sụgharịrị okwu ahụ dịka nrubeisi Jizọs ji obi ya nabata ihe Nna nyeworo ya, n'enweghị nkọwa ozizi agbakwunyere.
  alternative: Ịgbakwunye ‘Nna m nyere m ọrụ a’ ma ọ bụ nkọwa ọzọ banyere mmekọrịta Nna na Ọkpara.
  rationale: Okwu Grik na-egosi nrubeisi Jizọs nye Nna, ma ọ chọghị mgbakwunye nke na-adịghị n'amaokwu ahụ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. A hapụrụ ihe atụ ‘iko’ na ike ajụjụ nkwenye ahụ; e tinyekghị nkọwa ụka ma ọ bụ ozizi otu chọọchị pụrụ iche.
