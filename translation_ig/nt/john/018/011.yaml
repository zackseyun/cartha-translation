  source_fidelity: The draft accurately renders the command to put the sword into its sheath, preserves “the Father” without adding a possessive, retains the cup metaphor, and conveys the rhetorical question’s expected affirmative force. “Nyeworo” appropriately reflects the Greek perfect’s present relevance.
