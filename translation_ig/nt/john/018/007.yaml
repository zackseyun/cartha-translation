id: JHN.18.7
reference: John 18:7
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: πάλιν οὖν ⸂ἐπηρώτησεν αὐτούς⸃· Τίνα ζητεῖτε; οἱ δὲ εἶπαν· Ἰησοῦν τὸν Ναζωραῖον.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/007.yaml
  text: So he asked them again[a], “Whom are you seeking?” And they said, “Jesus the Nazarene.”
translation:
  language: ig
  text: Ya mere, ọ jụkwara ha ọzọ, “Ònye ka unu na-achọ?” Ha wee sị, “Jizọs onye Nazaret.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “Jizọs onye si Nazaret.” N’asụsụ Grik, ọ bụ “Jizọs onye Nazaret.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν οὖν
  choice: Ya mere, ọ jụkwara ha ọzọ
  rationale: “Ya mere” na-egosi njikọ na ihe mere tupu nke a, ebe “ọzọ” na-egosi na ọ jụrụ otu ajụjụ ahụ ugboro ọzọ.
- source_word: ἐπηρώτησεν αὐτούς
  choice: ọ jụkwara ha
  rationale: Nke a bụ ụzọ Igbo nkịtị si kwuo na ọ jụrụ ha ajụjụ; “-kwara” na-enyekwa aka igosi mmeghachi omume ahụ n’akụkọ.
- source_word: Τίνα ζητεῖτε
  choice: Ònye ka unu na-achọ?
  rationale: “Ònye” bụ nnọchiaha ajụjụ kwesịrị ekwesị maka mmadụ, “ka” na-egosi onye bụ ihe omume ahụ metụtara, “unu” na-edobe ọnụọgụ ọtụtụ nke Grik, “na-achọ” na-egosikwa omume ha nọ na-eme ugbu a.
- source_word: οἱ δὲ εἶπαν
  choice: Ha wee sị
  rationale: “Wee” na-egosi usoro ihe omume n’akụkọ n'ụzọ dị nro ma kwekọọ na ọrụ δέ n’ebe a.
- source_word: Ἰησοῦν
  choice: Jizọs
  rationale: Nke a bụ nsụgharị aha Ἰησοῦς a na-ejikarị eme ihe n’Igbo.
- source_word: τὸν Ναζωραῖον
  choice: onye Nazaret
  rationale: Ọ na-edobe okwu ahụ dị ka aha e ji amata Jizọs site na Nazaret, ma bụrụkwa okwu doro ndị na-agụ Igbo anya.
theological_decisions:
- issue: Otu e si sụgharị Ναζωραῖος dị ka aha e ji amata Jizọs
  choice: onye Nazaret
  alternative: onye si Nazaret
  rationale: “Onye Nazaret” na-edobe ọdịdị aha njirimara nke okwu Grik ma ghara itinye nkọwa ozizi ọzọ. “Onye si Nazaret” bụ nkọwa ebe o si, nke bụkwa nghọta kwe omume ma dị mfe karị.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị mfe nghọta ma nwee ugwu. E debere mkparịta ụka ahụ n’ụdị nkịtị, ma jiri “unu” gosipụta na a na-agwa ọtụtụ mmadụ okwu.
