  terminology: “Jizọs” and “Nazaret” are suitable standard forms. “Onye Nazaret” is an acceptable Igbo rendering of the epithet “the Nazarene”; the footnote responsibly supplies “onye si Nazaret” as a more explicative alternative without presenting it as the sole meaning.
