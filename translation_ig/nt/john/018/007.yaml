  source_fidelity: The rendering retains the repetition (πάλιν), the connective force of οὖν, Jesus' question to the plural group, and their reply. “Ònye ka unu na-achọ?” faithfully expresses the present-tense question, and “Jizọs onye Nazaret” preserves Ναζωραῖος as an identifying epithet rather than reducing it solely to a place-of-origin phrase.
