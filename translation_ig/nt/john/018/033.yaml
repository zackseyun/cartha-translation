id: JHN.18.33
reference: John 18:33
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Εἰσῆλθεν οὖν ⸂πάλιν εἰς τὸ πραιτώριον⸃ ὁ Πιλᾶτος καὶ ἐφώνησεν τὸν Ἰησοῦν καὶ εἶπεν αὐτῷ· Σὺ εἶ ὁ βασιλεὺς τῶν Ἰουδαίων;
base_translation:
  language: en
  yaml_path: translation/nt/john/018/033.yaml
  text: So Pilate went back into the governor’s headquarters and called Jesus and said to him[b][a], “Are you the King of the Jews?”
translation:
  language: ig
  text: Ya mere, Paịlet banyere ọzọ n’ụlọ ọrụ gọvanọ[a], kpọọ Jizọs, sị ya, “Ị bụ Eze ndị Juu[b]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “praetorium,” ya bụ, ebe obibi ma ọ bụ ụlọ ọrụ gọvanọ Rom.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ndị Judia.” Okwu Grik ahụ nwere ike izo aka ma ndị Juu n’ozuzu ha ma ọ bụ ndị si Judia.
    reason: alternative_reading
lexical_decisions:
- source_word: Εἰσῆλθεν ... πάλιν
  choice: laghachiri
  rationale: Ngwakọta okwu a na-egosi na Paịlet banyere ebe ahụ ọzọ; “laghachiri” na-egosipụta nlọghachi ahụ n’Igbo dị mfe ma bụrụkwa nke e ji eme ihe taa.
- source_word: οὖν
  choice: Ya mere
  rationale: Ọ na-ejikọta ihe a na ihe ndị bu ya ụzọ ma na-egosikwa otú akụkọ si aga n’ihu.
- source_word: πραιτώριον
  choice: ụlọ ọrụ gọvanọ
  rationale: N’ebe a, okwu ahụ na-ezo aka n’ebe gọvanọ Rom bi ma ọ bụ na-arụ ọrụ ọchịchị. Nsụgharị a na-eme ka ihe ọ pụtara doo ndị na-agụ akwụkwọ taa anya; e debere aha ọdịnala ya n’ala peeji.
- source_word: ἐφώνησεν
  choice: kpọọ
  rationale: Okwu Grik a pụtara ịkpọ mmadụ ka ọ bịa; “kpọọ” bụ okwu Igbo nkịtị nke na-adịghị agbakwụnye ike karịrị nke dị n’isi mmalite.
- source_word: εἶπεν αὐτῷ
  choice: sị ya
  rationale: Nke a na-agbaso ngwaa nkịtị nke pụtara ‘ịsị’ kama ịgbanwe ya ka ọ bụrụ ngwaa pụrụ iche nke pụtara ‘ịjụ,’ ebe mkpụrụokwu e kwuru n’onwe ya gosiri na ọ bụ ajụjụ.
- source_word: Σὺ εἶ
  choice: Ị bụ
  rationale: Usoro ajụjụ Igbo a bụ ihe e ji ekwu okwu n'ụzọ ebumpụta ụwa; ọnọdụ na olu ajụjụ na-eburu nkwusi ike dị na nnọchiaha Grik.
- source_word: ὁ βασιλεὺς
  choice: Eze
  rationale: “Eze” bụ okwu Igbo ziri ezi maka βασιλεύς, ma n’ebe a ọ bụ aha ọkwa n’ajụjụ gbasara onye Jizọs bụ.
- source_word: τῶν Ἰουδαίων
  choice: ndị Juu
  rationale: N’ebe ikpe a, aha a na-egosi ndị Juu dị ka otu ndị ọchịchị Rom maara, nke kwekọrọ na ebubo eze a kpọrọ aha; ohere nke ‘ndị Judia’ ka e debere n’ala peeji.
theological_decisions:
- issue: Nsụgharị Ἰουδαίων n’aha eze
  choice: ndị Juu
  alternative: ndị Judia
  rationale: “Eze ndị Juu” dabara n’ebubo ndọrọ ndọrọ ọchịchị a kpụụrụ Jizọs n’ihu Paịlet. Ma ebe okwu Grik ahụ nwere ike mgbe ụfọdụ ịpụta ndị si Judia, e chekwaghị ohere ahụ n’ala peeji kama idozi esemokwu ahụ n’enweghị nkọwa.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “Ụlọ ọrụ gọvanọ” na-ewepụ ọchịchịrị dị n’okwu mbinye “praetorium,” ebe ala peeji na-echekwa aha ahụ na nkọwa ya. Akara ala peeji [a] na [b] dị n’isi ederede n’ebe okwu ha metụtara dị.
