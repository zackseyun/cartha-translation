revisions:
- from: Ya mere, ndị agha ahụ, ọchịagha ha, na ndị nche ndị Juu[a] jidere Jizọs, kee ya agbụ.
  to: Ya mere, ndị agha ahụ, ọchịagha ahụ, na ndị nche ndị Juu[a] jidere Jizọs, kegide ya.
  rationale: The revision removes an unstated possessive from the reference to the commander and renders “bound him” without specifying chains. It otherwise preserves the draft’s accurate, natural Standard Igbo rendering and its contextual footnote on “the Jews.”
  reviewer_model: gpt-5.6-terra
