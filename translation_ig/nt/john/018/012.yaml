review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the narrative connective, the military detachment, the commander, the Jewish officers, and the seizure of Jesus. However, “ọchịagha ha” makes the commander’s relation to the soldiers more explicit than the Greek states, and “kee ya agbụ” can specifically suggest putting him in chains, whereas ἔδησαν simply says that they bound him.
  naturalness: The sentence is clear, idiomatic Standard Igbo, and has an appropriate restrained narrative register. Replacing “ọchịagha ha” with “ọchịagha ahụ” and using “kegidere ya” gives a more direct and natural rendering of the Greek wording.
  terminology: “Ndị agha ahụ” is a sound accessible rendering of σπεῖρα; “ọchịagha” suitably renders χιλίαρχος without importing a technical Roman title; and “ndị nche ndị Juu” appropriately conveys the official personnel denoted by ὑπηρέται τῶν Ἰουδαίων. The footnote preserves the contextual possibilities of τῶν Ἰουδαίων without resolving them in the main text.
  issues:
  - severity: low
    issue: “ọchịagha ha” includes an explicit possessive relation.
    rationale: The Greek says “the commander,” with no possessive pronoun. The association with the cohort is contextually likely, but “ọchịagha ahụ” follows the source more closely.
  - severity: medium
    issue: “kee ya agbụ” may over-specify the means of binding.
    rationale: ἔδησαν means “bound/tied” and does not specify chains. “Kegidere ya” retains the action without adding that detail.
  revised_text: Ya mere, ndị agha ahụ, ọchịagha ahụ, na ndị nche ndị Juu[a] jidere Jizọs, kegide ya.
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị isi ndị Juu,” ma ọ bụ “ndị Judia,” dabere n’ọnọdụ okwu. N’Oziọma Jọn, “ndị Juu” na-ezokarị aka n’otu ndị a kapịrị ọnụ, ọ bụghị ndị Juu niile.
    reason: alternative_reading
  revision_rationale: The revision removes an unstated possessive from the reference to the commander and renders “bound him” without specifying chains. It otherwise preserves the draft’s accurate, natural Standard Igbo rendering and its contextual footnote on “the Jews.”
