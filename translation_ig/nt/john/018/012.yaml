source:
  edition: SBLGNT
  text: Ἡ οὖν σπεῖρα καὶ ὁ χιλίαρχος καὶ οἱ ὑπηρέται τῶν Ἰουδαίων συνέλαβον τὸν Ἰησοῦν καὶ ἔδησαν αὐτὸν
base_translation:
  language: en
  yaml_path: translation/nt/john/018/012.yaml
  text: So the cohort[a], the commander, and the officers of the Jews seized Jesus and bound him.
translation:
  language: ig
  text: Ya mere, ndị agha ahụ, ọchịagha ahụ, na ndị nche ndị Juu[a] jidere Jizọs, kegide ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị isi ndị Juu,” ma ọ bụ “ndị Judia,” dabere n’ọnọdụ okwu. N’Oziọma Jọn, “ndị Juu” na-ezokarị aka n’otu ndị a kapịrị ọnụ, ọ bụghị ndị Juu niile.
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: Ya mere
  rationale: Ọ na-egosi na akụkọ a na-aga n’ihu dịka ihe si n’ihe ndị mere tupu ya pụta; okwu a bụ nke doro anya ma bụrụkwa Igbo a na-asụ ugbu a.
- source_word: σπεῖρα
  choice: ndị agha ahụ
  rationale: Okwu Grik a na-ezo aka n’otu ndị agha a haziri ahazi. Nsụgharị a na-eme ka ọrụ agha ha doo anya n’Igbo nkịtị, ma ọ naghị atụkwasị okwu ‘ndị Rom’ nke aha ahụ n’onwe ya ekwughị.
- source_word: χιλίαρχος
  choice: ọchịagha ha
  rationale: Ọ bụ onyeisi ndị agha ahụ. ‘Ọchịagha’ bụ okwu Igbo doro anya karịa iji aha ọkwa ndị agha Rom nke ọtụtụ ndị na-agụ akwụkwọ agaghị aghọta; ‘ha’ na-egosi njikọ ya na ndị agha ahụ.
- source_word: ὑπηρέται
  choice: ndị nche
  rationale: N’ebe a, okwu ahụ na-ezo aka n’ọgbọ ndị ọrụ e nyere ikike isonye na njide ahụ, ọ bụghị ndị odibo ụlọ. ‘Ndị nche’ na-egosi ọrụ ha n’enweghị ịkọwa ha kpọmkwem dịka ndị uwe ojii ụlọ nsọ.
- source_word: τῶν Ἰουδαίων
  choice: ndị Juu
  rationale: A hapụrụ okwu ahụ n’ụdị sara mbara nke dị na Grik. E tinyeghị ‘ndị isi’ n’ahịrị bụ isi, ebe ọ bụ na nke ahụ bụ nkọwa a pụrụ ịghọta site n’ọnọdụ okwu, ọ bụghị ihe ahịrịokwu ahụ kwuru kpọmkwem.
- source_word: συνέλαβον
  choice: jidere
  rationale: Ọ na-egosi ijide mmadụ n’ike ma ọ bụ ịkpọrọ ya n’okpuru ikike. ‘Jidere’ na-echekwa omume ahụ nke ọma n’enweghị ịgbakwunye usoro iwu nke okwu dịka ‘nwụchie’ pụrụ ime ka ọ pụta ìhè.
- source_word: ἔδησαν
  choice: kee ya agbụ
  rationale: Ọ na-akọ na ha kegidere Jizọs. Akpaalaokwu a bụ Igbo dị ndụ, doro anya, ma kwesịkwa ekwesị n’akụkọ dị nsọ.
theological_decisions:
- issue: Ndị okwu τῶν Ἰουδαίων na-ezo aka na ha na Oziọma Jọn
  choice: E dere ‘ndị Juu’ n’ahịrị bụ isi.
  alternative: ‘ndị isi ndị Juu’ ma ọ bụ ‘ndị Judia’
  rationale: Nke a na-echekwa okwu Grik n’enweghị ime ka ọ bụrụ na ọ na-ekwu banyere ndị Juu niile ma ọ bụ kpebie na ọ bụ naanị ndị isi ha. Ihe odide ala peeji na-egosi nghọta ndị ọzọ dabere n’ọnọdụ okwu.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe ma dị ùgwù. A họọrọ okwu ndị mmadụ nkịtị ga-aghọta, ma e zere aha ọkwa ndị agha e si n’asụsụ mba ọzọ webata. E debere akara ihe odide ala peeji [a] ozugbo n’azụ okwu ọ na-akọwa.
