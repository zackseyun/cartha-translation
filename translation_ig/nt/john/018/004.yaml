  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἰησοῦς ⸀οὖν εἰδὼς πάντα τὰ ἐρχόμενα ἐπ’ αὐτὸν ⸂ἐξῆλθεν, καὶ λέγει⸃ αὐτοῖς· Τίνα ζητεῖτε;
base_translation:
  language: en
  yaml_path: translation/nt/john/018/004.yaml
  text: Jesus therefore[a], knowing all the things coming upon him, went out and said to them, “Whom are you seeking?”
translation:
  language: ig
  text: Ya mere, Jizọs, ebe ọ maara ihe niile na-abịakwasị ya, pụtara, sị ha, “Ònye ka unu na-achọ?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὖν
  choice: Ya mere
  rationale: Na-egosi njikọ akụkọ na ihe si n'ọnọdụ ahụ pụta; ọ na-echekwa ike nkwubi okwu nke okwu Grik ahụ karịa nanị ‘mgbe ahụ.’
- source_word: εἰδὼς
  choice: ebe ... maara
  rationale: Na-egosi na Jizọs amaralarị nke ọma ihe ga-eme; usoro a bụ Igbo sitere n'okike ma ghara itinye nkọwa ọzọ.
- source_word: πάντα τὰ ἐρχόμενα ἐπ’ αὐτόν
  choice: ihe niile na-abịakwasị ya
  rationale: Na-echekwa mkpokọta πάντα na onyonyo nke ihe ndị na-abịa dakwasị ya, n'ekwughị kpọmkwem ihe omume ndị ahụ karịa ka Grik kwuru.
- source_word: ἐξῆλθεν
  choice: ọ pụrụ gaa
  rationale: Na-egosi na ọ si ebe ọ nọ pụta gaa n'ebe ha nọ, n'etinyeghị mmetụta ihe nkiri na-adịghị n'okwu Grik.
- source_word: λέγει
  choice: sị
  rationale: A gbanwere historical present nke Grik ka ọ bụrụ oge gara aga dabara n'akụkọ Igbo nke oge a.
- source_word: Τίνα
  choice: Ònye
  rationale: ‘Ònye’ bụ ụzọ Igbo kwesịrị ekwesị isi jụọ maka onye bụ ihe nnara nke ngwaa ahụ.
- source_word: ζητεῖτε
  choice: ka unu na-achọ
  rationale: Na-echekwa oge na-aga n'ihu na ụda dị arọ nke ζητέω n'Igbo sitere n'okike.
theological_decisions:
- issue: Ọmụma Jizọs banyere ihe ga-abịakwasị ya
  choice: Edebere na Jizọs maara ihe niile na-abịakwasị ya.
  alternative: A pụrụ ịsụgharị ya n'ụzọ na-akọwapụta n'ụzọ siri ike na ihe ndị ahụ ‘na-aga ịbịakwasị ya.’
  rationale: Amaokwu ahụ na-egosi ọmụma Jizọs tupu ihe ndị ahụ emee, ma nsụgharị ahụ anaghị agbakwunye nkwupụta ozizi karịrị ihe ederede kwuru.
translation_notes:
  register: Igbo Ọdịnala (Standard Igbo), n'ụdị asụsụ dị ugbu a, dị ùgwù ma doo ndị nkịtị anya. E jighị okwu ụka nke otu denominashọn ma ọ bụ nkọwa nke onye ọ bụla.
