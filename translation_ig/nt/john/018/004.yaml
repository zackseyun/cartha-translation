- from: Ya mere, ebe Jizọs maara ihe niile na-abịakwasị ya, ọ pụrụ gaa sị ha, “Ònye ka unu na-achọ?”
  to: Ya mere, Jizọs, ebe ọ maara ihe niile na-abịakwasị ya, pụtara, sị ha, “Ònye ka unu na-achọ?”
  rationale: The revision changes only the rendering of ἐξῆλθεν to “pụtara,” an idiomatic Standard Igbo narrative form meaning ‘went/came out.’ It retains the source's sequence, Jesus’ knowledge of all impending events, and the direct question without interpretive expansion.
