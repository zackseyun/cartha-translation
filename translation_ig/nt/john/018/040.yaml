  text: ἐκραύγασαν οὖν ⸀πάλιν λέγοντες· Μὴ τοῦτον ἀλλὰ τὸν Βαραββᾶν. ἦν δὲ ὁ Βαραββᾶς λῃστής.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/040.yaml
  text: So they shouted again[a], saying, “Not this man, but Barabbas!” Now Barabbas was a robber.
translation:
  language: ig
  text: Ya mere, ha tiri mkpu ọzọ, sị, “Ọ bụghị nwoke a, kama Barabas!” Barabas bụ onye ohi[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “onye na-apụnara mmadụ ihe.” Okwu Grik ahụ nwekwara ike ịpụta onye ohi, onye na-apụnara mmadụ ihe, ma ọ bụ, n’ọnọdụ ụfọdụ, onye omekome na-eme ihe ike.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκραύγασαν
  choice: ha tiri mkpu
  rationale: Nkebi okwu a na-egosi iti mkpu n’olu dara ụda, ma bụrụkwa okwu Igbo doro anya ma kwekọọ n’ike dị na ngwaa Grik.
- source_word: οὖν
  choice: Ya mere
  rationale: Ọ na-ejikọta nzaghachi ìgwè mmadụ a na mkparịta ụka bu ya ụzọ, dị ka οὖν si eme.
- source_word: πάλιν
  choice: ọzọ
  rationale: Ọ na-echekwa echiche nke imeghachi omume ahụ ọzọ.
- source_word: λέγοντες
  choice: sị
  rationale: Ọ na-echekwa participle nke na-ewebata kpọmkwem ihe ha kwuru, n’ụzọ Igbo na-asụkarị.
- source_word: Μὴ τοῦτον ἀλλὰ τὸν Βαραββᾶν
  choice: Ọ bụghị nwoke a, kama ọ bụ Barabas
  rationale: “Nwoke a” na-echekwa ike demonstrative nke τοῦτον; nhazi “ọ bụghị… kama…” na-egosipụta ọdịiche ahụ nke ọma n’Igbo.
- source_word: Βαραββᾶν / Βαραββᾶς
  choice: Barabas
  rationale: A sụgharịghị aha onye ahụ; e dere ya n’ụdị mkpụrụokwu kwekọrọ n’Igbo.
- source_word: ἦν δὲ
  choice: Ma ... bụ
  rationale: δέ na-ewebata nkọwa gbasara Barabas. “Ma” na-edobe njikọ ahụ n’enweghị ịgbakwunye nkọwa na-adịghị na Grik.
- source_word: λῃστής
  choice: onye ohi
  rationale: Nke a bụ nkọwa Igbo kacha mfe ma doo anya maka isi echiche λῃστής ebe a; ihe okwu ahụ nwekwara ike ịpụta ka edobere n’ala peeji.
theological_decisions:
- issue: Ụdị mpụ λῃστής ji kọwaa Barabas
  choice: onye ohi
  alternative: onye na-apụnara mmadụ ihe; onye ohi ji ọgụ alụso ọchịchị ọgụ
  rationale: Isi ihe λῃστής pụtara bụ onye ohi ma ọ bụ onye na-apụnara mmadụ ihe. N’ọnọdụ ụfọdụ, ọ pụrụ ịgụnye onye na-eme ihe ike ma ọ bụ onye nnupụisi, ma amaokwu a n’onwe ya anaghị amanye nkọwa ahụ; ya mere, e debere nghọta sara mbara n’ala peeji.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji “tiri mkpu” gosipụta ike okwu Grik, ebe a hapụrụ nghọta sara mbara nke λῃστής n’ala peeji iji zere ịmanye nkọwa akụkọ ihe mere eme n’ime isi ederede.
