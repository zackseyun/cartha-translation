  text: ⸀ἀπεκρίθη Ἰησοῦς· ⸂Ἀπὸ σεαυτοῦ⸃ σὺ τοῦτο λέγεις ἢ ἄλλοι ⸂εἶπόν σοι⸃ περὶ ἐμοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/john/018/034.yaml
  text: Jesus answered[a], “Are you saying this on your own, or did others tell you about me?”
translation:
  language: ig
  text: Jizọs zara, “Ọ bụ site n’onwe gị ka ị na-ekwu nke a, ka ndị ọzọ gwara gị banyere m?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: zara
  rationale: Ọ bụ ngwaa a na-ejikarị akọ nzaghachi n’akụkọ na mkparịta ụka; ọ dabara nke ọma n’Igbo nkịtị.
- source_word: Ἀπὸ σεαυτοῦ
  choice: n’obi gị
  rationale: N’ebe a, ἀπό na nnọchiaha nlọghachi na-egosi ebe okwu ahụ si malite—ma echiche ahụ sitere n’ime Paịlet n’onwe ya. ‘N’obi gị’ na-enye echiche a n’Igbo dị ndụ, n’enweghị ịkọwa ihe kpatara ya karịa ihe Grik kwuru.
- source_word: σὺ
  choice: gị / i
  rationale: E debere nrụgide dị na nnọchiaha Grik site n’ịsị ‘n’obi gị’ na ‘i ji ekwu,’ nke na-elekwasị anya n’ebe Paịlet n’onwe ya nọ.
- source_word: τοῦτο
  choice: nke a
  rationale: Ọ na-ezo aka n’ajụjụ Paịlet jụrụ tupu nke a; ‘nke a’ bụ Igbo doro anya ma bụrụkwa nke nkịtị.
- source_word: λέγεις
  choice: i ji ekwu
  rationale: Ọ na-egosi ihe Paịlet na-ekwu n’oge mkparịta ụka ahụ; usoro a na-ada nke ọma n’ajụjụ Igbo.
- source_word: ἢ
  choice: ka ọ bụ
  rationale: Ọ na-ewebata nhọrọ nke abụọ n’ajụjụ ahụ n’ụzọ Igbo e ji ekwu okwu.
- source_word: ἄλλοι
  choice: ndị ọzọ
  rationale: Ọ na-ezo aka n’ụfọdụ mmadụ ndị ọzọ na-abụghị Paịlet, n’enweghị ịkpọ aha ha.
- source_word: εἶπόν σοι
  choice: gwara gị
  rationale: Aorist a na-egosi na ndị ọzọ gwara Paịlet ihe; ‘gwara gị’ bụ ụzọ Igbo kachasị eke isi kwuo ya.
- source_word: περὶ ἐμοῦ
  choice: banyere m
  rationale: 'Ọ na-edobe ihe περί na genitive pụtara: ihe metụtara Jizọs ma ọ bụ ihe a gwara Paịlet banyere ya.'
theological_decisions:
- issue: Ihe ajụjụ Jizọs na-ajụ Paịlet pụtara
  choice: E gosiri ya dịka ajụjụ banyere ebe okwu Paịlet si malite—ma o sitere n’echiche ya onwe ya, ma ọ bụ n’ihe ndị ọzọ gwara ya.
  alternative: A pụrụ ịsụgharị ya n’ụzọ na-akọwa karịa, dịka ‘Ì ji aka gị kpebie ịjụ nke a?’
  rationale: Grik ahụ na-elekwasị anya n’isi mmalite okwu Paịlet, ọ bụghị n’ịkọwa ebumnobi ya n’ụzọ sara mbara. Nsụgharị ahụ na-ahapụ esemokwu na nghọta ime mmụọ dị n’ajụjụ ahụ ka ọ dị.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. ‘N’obi gị’ bụ akpaalaokwu Igbo na-egosi na okwu ahụ sitere n’echiche onye ahụ n’onwe ya; e zere nsụgharị mkpụrụokwu dịka ‘site n’onwe gị,’ nke ga-ada arọ ma ghara ịdị eke.
