    reason: lexical_alternative
  revision_rationale: The revision removes an unidiomatic redundant copula, restores λαός as “ndị mmadụ,” and uses “maka” to convey the benefactive/representative breadth of ὑπέρ without resolving its debated theological implications. Both required footnote anchors are retained and their wording is aligned with the corrected main text.
