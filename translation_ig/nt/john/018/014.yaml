source:
  edition: SBLGNT
  text: ἦν δὲ Καϊάφας ὁ συμβουλεύσας τοῖς Ἰουδαίοις ὅτι συμφέρει ἕνα ἄνθρωπον ⸀ἀποθανεῖν ὑπὲρ τοῦ λαοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/014.yaml
  text: Caiaphas was the one who had advised the Jews that it was better for one man to die for the people[a][b].
translation:
  language: ig
  text: Kayafas bụ onye dụrụ ndị Juu ọdụ na ọ ka mma ka otu nwoke nwụọ maka ndị mmadụ[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “ndị ndú ndị Juu” ma ọ bụ “ndị Judia,” dabere n’otú e si ghọta okwu Jọn bụ “ndị Juu” n’ebe a.
    reason: alternative_reading
  - marker: b
    text: A pụkwara ịsị, “n’ihi ndị mmadụ.” N’ọnọdụ a, okwu Grik ahụ nwekwara ike igosi na o mere ya maka ọdịmma ha ma ọ bụ nọchite anya ha, ma nwee ike iburu ndò nke ịchụ àjà.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν δὲ
  choice: Ọ bụkwa
  rationale: δέ bụ njikọ dị nro n’akụkọ a; “-kwa” na-ejikọta ahịrịokwu a na ihe gbara ya gburugburu n’enweghị ime ka ọ bụrụ nnukwu mmegide.
- source_word: Καϊάφας
  choice: Kayafas
  rationale: E dere aha onye ahụ dịka ụda ya si kwekọọ n’usoro mkpope Igbo.
- source_word: ὁ συμβουλεύσας
  choice: onye dụrụ ... ọdụ
  rationale: Nkebi participle a na-akọwa Kayafas site n’ihe o mere tupu oge a; “dụrụ ... ọdụ” bụ okwu Igbo doro anya ma dịkwa mma maka inye ndụmọdụ.
- source_word: τοῖς Ἰουδαίοις
  choice: ndị Juu
  rationale: Nke a na-edobe okwu Grik n’enweghị ịgbakwụnye na ọ bụ naanị ndị ndú, ebe onye okwu ahụ na-ezo aka n’ebe a ka nwere ike ịghọta ya n’ụzọ dị iche iche.
- source_word: ὅτι συμφέρει
  choice: na ọ ka mma
  rationale: Nke a na-egosipụta uru ma ọ bụ ihe ga-aba uru nke συμφέρει n’Igbo nkịtị na nke doro anya.
- source_word: ἕνα ἄνθρωπον
  choice: otu nwoke
  rationale: Ọ na-edobe ma ọnụọgụ ‘otu’ ma nwoke onye okwu ahụ kpọrọ aha, bụ́ Jizọs.
- source_word: ἀποθανεῖν
  choice: ka ... nwụọ
  rationale: Nke a bụ ntụgharị Igbo ebumpụta ụwa nke infinitive ‘ịnwụ’ n’usoro ahịrịokwu a.
- source_word: ὑπὲρ τοῦ λαοῦ
  choice: n’ihi ndị ahụ
  rationale: “N’ihi” nwere ike igosi uru ma ọ bụ ịnọchite anya ndị ahụ n’enweghị ịkọwapụta echiche ịchụ àjà karịa ka isi mmalite kwuru.
- source_word: λαοῦ
  choice: ndị ahụ
  rationale: λαός pụtara ndị mmadụ dị ka otu ìgwè; “ndị ahụ” na-ezo aka n’ìgwè ndị e kwuru banyere ha n’ọnọdụ a ma zere iji ἔθνος, ‘mba,’ dochie ya.
theological_decisions:
- issue: Ihe ὑπὲρ τοῦ λαοῦ nwere ike ịpụta banyere ịnọchite anya ma ọ bụ ịchụ àjà
  choice: n’ihi ndị ahụ
  alternative: n’aha ndị ahụ; n’ọnọdụ ndị ahụ
  rationale: ὑπέρ nwere ike igosi uru, ịnọchite anya, ma n’ọnọdụ sara mbara nwee ndò echiche ịchụ àjà. Isi ederede anaghị eme ka otu nkọwa ahụ bụrụ naanị nke ziri ezi.
- issue: Ndị τοῖς Ἰουδαίοις na-ezo aka na ha n’Oziọma Jọn
  choice: ndị Juu
  alternative: ndị ndú ndị Juu; ndị Judia
  rationale: Ederede Grik akọwaghị ya karịa Ἰουδαῖοι. Ya mere, isi ederede na-edobe okwu ahụ, ebe ndetu ala peeji na-egosi nkọwa ndị ọzọ dabere n’ọnọdụ.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E debere mgbagwoju anya dị na “ndị Juu” na ὑπέρ site na ndetu ala peeji kama idozi ya n’isi ederede.
