id: JHN.18.2
reference: John 18:2
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ᾔδει δὲ καὶ Ἰούδας ὁ παραδιδοὺς αὐτὸν τὸν τόπον, ὅτι πολλάκις ⸀συνήχθη Ἰησοῦς ἐκεῖ μετὰ τῶν μαθητῶν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/002.yaml
  text: Judas, who was betraying him, also knew the place, because Jesus had often gathered there with his disciples.
translation:
  language: ig
  text: Judas, onye na-arara ya nye[a], makwaara ebe ahụ, n’ihi na Jizọs na ndị na-eso ụzọ ya na-ezukọkarị n’ebe ahụ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “onye na-enyefe ya.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “n’ihi na Jizọs na ndị na-eso ụzọ ya na-agbakọtakarị n’ebe ahụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾔδει
  choice: maara
  rationale: “Ịma” bụ okwu Igbo nkịtị maka inwe ihe ọmụma ma ọ bụ ịmara ebe; n’ebe a ọ na-egosi na Judas maara ebe ahụ nke ọma.
- source_word: δὲ
  choice: ejighị okwu pụrụ iche sụgharịa ya
  rationale: δέ bụ njikọ akụkọ dị nro. N’Igbo, ịmalite ahịrịokwu ahụ ozugbo na “Judas” na-eme ka akụkọ gaa n’ihu nke ọma n’etinyeghị okwu oge ma ọ bụ nghọtahie banyere mmegide.
- source_word: καὶ
  choice: kwa
  rationale: '“Kwa” dị n’ime “makwaara” na-echekwa echiche mgbakwunye ahụ: Judas makwaara ebe ahụ.'
- source_word: ὁ παραδιδοὺς αὐτὸν
  choice: onye na-arara ya nye
  rationale: N’akụkọ a, nkebi a na-akọwa Judas dịka onye nọ n’ọrụ ịrara Jizọs nye. Nsụgharị a na-echekwa omume na-aga n’ihu, ọ bụghị naanị ịkpọ ya aha dịka “onye nrara.”
- source_word: τὸν τόπον
  choice: ebe ahụ
  rationale: “Ebe ahụ” bụ ụzọ Igbo doro anya ma bụrụkwa nke e ji ekwu maka otu ebe a kpọtụrụla aha n’akụkọ.
- source_word: ὅτι
  choice: n’ihi na
  rationale: N’ebe a ὅτι na-eweta ihe kpatara Judas ji mara ebe ahụ.
- source_word: πολλάκις
  choice: karị
  rationale: Mgbakwunye “-karị” n’ime “na-ezukọkarị” na-egosi na ihe ahụ mere ọtụtụ ugboro.
- source_word: συνήχθη
  choice: na-ezukọkarị
  rationale: Ụdị a bụ Igbo dị ndụ ma na-egosi nzukọ a na-eme ugboro ugboro. Ọ na-enye nghọta intransitive dabara n’ebe a n’enweghị ịmanye passive Greek ka ọ bụrụ passive na-adịghị eke n’Igbo.
- source_word: μετὰ τῶν μαθητῶν αὐτοῦ
  choice: Jizọs na ndị na-eso ụzọ ya
  rationale: Nhazi “Jizọs na ndị na-eso ụzọ ya” na-egosi n’Igbo n’ụzọ eke na Jizọs na ndị na-eso ụzọ ya nọkọtara na nzukọ ahụ.
theological_decisions:
- issue: Otu e si sụgharịa παραδιδοὺς gbasara Judas
  choice: onye na-arara ya nye
  alternative: onye na-enyefe ya
  rationale: “Ịrara ya nye” na-egosipụta ihe okwu ahụ pụtara n’akụkọ ọnwụ Jizọs na ịdị njọ nke omume Judas, ebe “ịnyefe” na-echekwa ihe okwu ahụ pụtara n’ụzọ nkịtị. E tinyere nke ọzọ na nkọwa ala peeji ka esemokwu lexical ahụ ghara ifu.
- issue: Uche dị na συνήχθη
  choice: Jizọs na ndị na-eso ụzọ ya na-ezukọkarị n’ebe ahụ
  alternative: Jizọs na ndị na-eso ụzọ ya na-agbakọtakarị n’ebe ahụ
  rationale: Ọ bụ ezie na Greek ji ụdị passive, n’ebe a ọ nwere ike ịrụ ọrụ dịka “izukọ” ma ọ bụ “ịbịakọta.” A họọrọ okwu Igbo kacha eke, ma debe ụzọ ọzọ na nkọwa ala peeji.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. “Makwaara” na-etinye ike mgbakwunye nke καί n’ụzọ eke. E zere ịgbakwunye okwu dịka “ugbu a” maka δέ, n’ihi na Greek enweghị okwu oge doro anya n’ebe ahụ.
