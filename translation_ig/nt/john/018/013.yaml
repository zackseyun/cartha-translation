- from: Ha buru ụzọ duru ya gaa n’ihu Anas, n’ihi na ọ bụ nna nwunye Kayafas, onye bụ nnukwu onye nchụàjà n’afọ ahụ.
  to: Ha buru ụzọ duru ya gakwuru Anas, n’ihi na ọ bụ nna nwunye Kayafas, onye bụ nnukwu onye nchụàjà n’afọ ahụ.
  rationale: The sole revision replaces “gaa n’ihu Anas” with “gakwuru Anas” to render πρὸς Ἅνναν as movement toward a person more directly. It does not alter the narrative setting or introduce an interpretation. The wording retains the explicit relationship and keeps the relative clause clearly attached to Kayafas.
