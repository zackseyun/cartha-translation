source:
  edition: SBLGNT
  text: καὶ ⸀ἤγαγον πρὸς Ἅνναν πρῶτον· ἦν γὰρ πενθερὸς τοῦ Καϊάφα, ὃς ἦν ἀρχιερεὺς τοῦ ἐνιαυτοῦ ἐκείνου·
base_translation:
  language: en
  yaml_path: translation/nt/john/018/013.yaml
  text: And they led him first to Annas, for he was the father-in-law of Caiaphas, who was high priest that year.
translation:
  language: ig
  text: Ha buru ụzọ duru ya gakwuru Anas, n’ihi na ọ bụ nna nwunye Kayafas, onye bụ nnukwu onye nchụàjà n’afọ ahụ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤγαγον
  choice: Ha ... duru ya
  rationale: ἄγω pụtara iduru ma ọ bụ ibuga mmadụ; n’ọnọdụ njide a, “duru ya” na-egosi na a na-ebuga ya dị ka onye nọ n’okpuru ndị jidere ya. E tinyere “ya,” bụ́ ihe nnọchiaha a ghọtara site n’okwu gbara ya gburugburu.
- source_word: πρὸς Ἅνναν
  choice: gaa n’ihu Anas
  rationale: πρός na-egosi ebe a na-eduru ya; n’ọnọdụ ikpe a, “gaa n’ihu Anas” bụ Igbo eke nke na-egosikwa na e duuru ya ka ọ pụta n’ihu Anas, na-enweghị ịgbanwe isi echiche nke mmegharị ahụ.
- source_word: πρῶτον
  choice: buru ụzọ
  rationale: 'Okwu a na-egosi usoro ihe mere: Anas bụ onye mbụ e duuru Jizọs gakwuru.'
- source_word: πενθερός
  choice: nna nwunye
  rationale: Okwu Grik a kpọmkwem pụtara nna nke di ma ọ bụ nwunye mmadụ; n’ebe a ọ bụ nna nwunye Kayafas.
- source_word: ἀρχιερεύς
  choice: nnukwu onye nchụàjà
  rationale: Nke a bụ aha ọkwa onyeisi nchụàjà ndị Juu, nke a na-asụ n’Igbo dịka “nnukwu onye nchụàjà.”
- source_word: τοῦ ἐνιαυτοῦ ἐκείνου
  choice: n’afọ ahụ
  rationale: Nsụgharị a na-edobe akara oge Jọn nyere ma na-ada nke ọma n’Igbo.
- source_word: Ἅνναν
  choice: Anas
  rationale: A sụgharịghị aha mmadụ; e dere ya n’ụdị a na-anụkarị n’Igbo.
- source_word: Καϊάφα
  choice: Kayafas
  rationale: A sụgharịghị aha mmadụ; e dere ya n’ụdị a na-anụkarị n’Igbo.
theological_decisions:
- issue: Onye nkebiokwu “onye bụ nnukwu onye nchụàjà n’afọ ahụ” na-ezo aka na ya
  choice: Ọ na-ezo aka na Kayafas.
  alternative: Ịgụ ya dịka ihe na-ezo aka na Anas.
  rationale: N’asụsụ Grik, nnọchiaha njikọ ὃς na-ezo n’ụzọ kacha eke aka n’aha kacha nso, Καϊάφα. Nhazi Igbo ahụ debere nkebiokwu ahụ ozugbo Kayafas ka ọ ghara iweta nghọtahie na-adịghị na isi mmalite.
translation_notes:
  register: Asụsụ Igbo Izugbe, nke ugbu a, dị ùgwù ma dị mfe nghọta. E ji “buru ụzọ duru” gosipụta usoro ihe omume, jiri “gaa n’ihu” kwekọọ n’ọnọdụ a kpọgara onye e jidere n’ihu onye ọchịchị okpukpe.
