review_pass:
  verdict: revise
  source_fidelity: The draft preserves the narrative sequence, emphasis in αὐτοί ('ha onwe ha'), early-morning setting, and the deliberately unresolved scope of φάγωσιν τὸ πάσχα. However, 'n’ụlọ Kayafas' adds 'house,' whereas ἀπὸ τοῦ Καϊάφα only says 'from Caiaphas,' and 'ndị e merụrụ emerụ' means injured/damaged rather than ritually defiled.
  naturalness: The proposed revision uses idiomatic Standard Igbo. 'Ka ha ghara imetọ onwe ha' naturally conveys ceremonial defilement, while 'rie Ngabiga' retains the source's eating language without the awkward literal expression 'iri Ememme Ngabiga.'
  terminology: '''Kaịfas'' and ''Jizọs'' follow established Igbo biblical naming. ''Ụlọ ọchịchị gọvanọ'' communicates πραιτώριον accessibly; the Praetorium transliteration is retained in a footnote. Ritual impurity is expressed through imetọ rather than physical injury.'
  issues:
  - severity: medium
    issue: The phrase 'n’ụlọ Kayafas' adds a location detail not explicit in the Greek.
    rationale: ἀπὸ τοῦ Καϊάφα means 'from Caiaphas'; it does not explicitly state 'from Caiaphas’s house.' 'Site n’ebe Kaịfas nọ' avoids this addition.
  - severity: high
    issue: '''Ndị e merụrụ emerụ n’usoro okpukpe'' mistranslates ritual defilement.'
    rationale: Merụrụ emerụ ordinarily denotes being wounded, harmed, or damaged. μιανθῶσιν concerns becoming ceremonially unclean; 'imetọ onwe ha' is the appropriate idiom.
  - severity: medium
    issue: '''Iri Ememme Ngabiga'' is unnatural in Igbo.'
    rationale: One normally eats food/a meal, not a festival. 'Rie Ngabiga' is a concise biblical-style expression that preserves the Greek wording's disputed breadth, clarified by the note.
  revised_text: Ya mere, ha sitere n’ebe Kaịfas nọ duru Jizọs gaa n’ụlọ ọchịchị gọvanọ[a]. Ọ bụkwa n’isi ụtụtụ. Ha onwe ha abataghị n’ụlọ ọchịchị gọvanọ ahụ, ka ha ghara imetọ onwe ha[b], kama ka ha nwee ike rie Ngabiga[c].
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “Pritọrịọm”; ya bụ, ebe obibi na ebe gọvanọ Rom na-arụ ọrụ ikpe.
    reason: lexical_alternative
  - marker: b
    text: “Imetọ onwe ha” pụtara ịghọ ndị na-adịghị ọcha n’usoro emume okpukpe.
    reason: cultural_note
  - marker: c
    text: “Rie Ngabiga” nwere ike ịpụta iri nri Ngabiga kpọmkwem, ma ọ bụ, n’ụzọ sara mbara, iri nri ma ọ bụ ime emume ndị metụtara oge Ngabiga.
    reason: alternative_reading
  revision_rationale: The revision removes an unsupported reference to Caiaphas’s house, corrects the central ritual-purity term, and improves the naturalness of the Passover expression while preserving its lexical and chronological ambiguity. All footnote anchors are retained and placed directly after their referents.
