id: JHN.18.28
reference: John 18:28
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἄγουσιν οὖν τὸν Ἰησοῦν ἀπὸ τοῦ Καϊάφα εἰς τὸ πραιτώριον· ἦν δὲ πρωΐ· καὶ αὐτοὶ οὐκ εἰσῆλθον εἰς τὸ πραιτώριον, ἵνα μὴ μιανθῶσιν ⸀ἀλλὰ φάγωσιν τὸ πάσχα.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/028.yaml
  text: So they led Jesus from Caiaphas into the governor’s headquarters[a]. Now it was early morning. They themselves did not enter the headquarters, so that they would not be defiled[c][b], but could eat the Passover.
translation:
  language: ig
  text: Ya mere, ha sitere n’ebe Kaịfas nọ duru Jizọs gaa n’ụlọ ọchịchị gọvanọ[a]. Ọ bụkwa n’isi ụtụtụ. Ha onwe ha abataghị n’ụlọ ọchịchị gọvanọ ahụ, ka ha ghara imetọ onwe ha[b], kama ka ha nwee ike rie Ngabiga[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Pritọrịọm”; ya bụ, ebe obibi na ebe gọvanọ Rom na-arụ ọrụ ikpe.
    reason: lexical_alternative
  - marker: b
    text: “Imetọ onwe ha” pụtara ịghọ ndị na-adịghị ọcha n’usoro emume okpukpe.
    reason: cultural_note
  - marker: c
    text: “Rie Ngabiga” nwere ike ịpụta iri nri Ngabiga kpọmkwem, ma ọ bụ, n’ụzọ sara mbara, iri nri ma ọ bụ ime emume ndị metụtara oge Ngabiga.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἄγουσιν
  choice: ha ... duru
  rationale: E ji oge gara aga kọwaa historical present a n’Igbo n’ụzọ akụkọ si ada nke ọma; “duru” gosikwara na ha na-akpọrọ Jizọs n’okpuru njide.
- source_word: οὖν
  choice: Ya mere
  rationale: Na-ejigide njikọ akụkọ na ihe si n’ihe gara aga pụta, n’asụsụ Igbo doro anya.
- source_word: πραιτώριον
  choice: ụlọ ọrụ gọvanọ
  rationale: Na-akọwa ebe gọvanọ Rom bi ma na-ekpe ikpe n’enweghị ịhapụ naanị aha Grik a sụgharịghị; nkọwa ala peeji na-enye aha ọzọ.
- source_word: πρωΐ
  choice: n’isi ụtụtụ
  rationale: Na-egosi akụkụ mbụ nke ụtụtụ n’enweghị ikwu kpọmkwem na ọ bụ mgbe chi na-abọ.
- source_word: αὐτοὶ
  choice: ha onwe ha
  rationale: Na-echekwa nkwusi ike dị na nnọchiaha Grik ahụ.
- source_word: εἰσῆλθον
  choice: abanyeghị
  rationale: Nsụgharị kwụ ọtọ ma bụrụkwa okwu Igbo nkịtị maka ịbanye n’ime ebe.
- source_word: μιανθῶσιν
  choice: ịbụ ndị e merụrụ emerụ n’usoro okpukpe
  rationale: Na-egosi na okwu ahụ bụ maka adịghị ọcha n’emume okpukpe, ọ bụghị naanị unyi anụ ahụ.
- source_word: φάγωσιν τὸ πάσχα
  choice: ha nwee ike iri Ememme Ngabiga
  rationale: Na-echekwa obosara okwu Grik ahụ ma ghara ikpebi ma ọ bụ nri Ngabiga kpọmkwem ka ọ bụ nri na emume ndị ọzọ n’oge ahụ.
- source_word: Καϊάφα
  choice: Kayafas
  rationale: E dere aha onye ahụ n’ụdị dabara na mkpọpụta na ide aha n’Igbo.
- source_word: Ἰησοῦν
  choice: Jizọs
  rationale: Ụdị aha Jizọs a na-ejikarị eme ihe n’Igbo.
theological_decisions:
- issue: Ihe “iri Ememme Ngabiga” pụtara n’ihe gbasara usoro ụbọchị n’Oziọma Jọn
  choice: 'E debere okwu ahụ n’obosara ya: “iri Ememme Ngabiga.”'
  alternative: “iri nri Ngabiga” ma ọ bụ “iri nri/emume ndị e ji eme Ngabiga”
  rationale: Okwu Grik ahụ apụtaghị n’enweghị mgbagha ma ọ na-ekwu naanị banyere nri Ngabiga kpọmkwem ka ọ bụ banyere nri na emume ndị ọzọ n’oge Ngabiga. Nsụgharị ahụ anaghị edozi esemokwu a n’ime amaokwu.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị ùgwù ma dị mfe nghọta. E jiri “ụlọ ọrụ gọvanọ” mee ka ọrụ πραιτώριον doo anya, ebe nkọwa ala peeji na-echekwa aha Praetorium na nkọwa akụkọ ihe mere eme. Akara nkọwa [a], [b], na [c] niile dị n’ebe okwu ha metụtara n’isi ederede.
