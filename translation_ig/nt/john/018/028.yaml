revisions:
- from: Ya mere, ha si n’ụlọ Kayafas duru Jizọs gaa n’ụlọ ọrụ gọvanọ[a]. Ọ bụkwa n’isi ụtụtụ. Ma ha onwe ha abanyeghị n’ụlọ ọrụ gọvanọ ahụ, ka ha ghara ịbụ ndị e merụrụ emerụ n’usoro okpukpe[b], kama ka ha nwee ike iri Ememme Ngabiga[c].
  to: Ya mere, ha sitere n’ebe Kaịfas nọ duru Jizọs gaa n’ụlọ ọchịchị gọvanọ[a]. Ọ bụkwa n’isi ụtụtụ. Ha onwe ha abataghị n’ụlọ ọchịchị gọvanọ ahụ, ka ha ghara imetọ onwe ha[b], kama ka ha nwee ike rie Ngabiga[c].
  rationale: The revision removes an unsupported reference to Caiaphas’s house, corrects the central ritual-purity term, and improves the naturalness of the Passover expression while preserving its lexical and chronological ambiguity. All footnote anchors are retained and placed directly after their referents.
