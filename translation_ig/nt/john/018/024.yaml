source:
  edition: SBLGNT
  text: ἀπέστειλεν ⸀οὖν αὐτὸν ὁ Ἅννας δεδεμένον πρὸς Καϊάφαν τὸν ἀρχιερέα.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/024.yaml
  text: So Annas sent him bound to Caiaphas the high priest[a].
translation:
  language: ig
  text: Ya mere, Anas zigara ya n’aka Kaịfas, onyeisi nchụaja, n’agbụ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, dịka ọnọdụ akụkọ ahụ siri dị, “Ma Anas ezipụlarị ya n’aka Kaịfas, onyeisi nchụaja, n’agbụ,” ma ọ bụrụ na a ghọta amaokwu a dịka nkọwa etinyere n’etiti akụkọ iji kọwaa ihe ndị mere tupu mgbe ahụ.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: zigara
  rationale: Ngwaa a dị n’oge aorist ma na-akọ ihe mere n’akụkọ ahụ; “zigara” bụ okwu Igbo doro anya ma dịkwa mma mgbe a na-eziga mmadụ n’aka onye ọzọ.
- source_word: οὖν
  choice: Ya mere
  rationale: Ọ na-ejikọta ihe a na ihe ndị bu ya ụzọ ma na-egosi ngagharị nke akụkọ; “Ya mere” na-echekwa ike njikọ ahụ n’Igbo nkịtị.
- source_word: δεδεμένον
  choice: mgbe e kere ya agbụ
  rationale: Perfect passive participle a na-egosi na ọ nọ n’ọnọdụ ịbụ onye e kere agbụ mgbe e zigara ya; nkebi okwu a na-eme ka ọnọdụ ahụ doo anya n’Igbo n’enweghị ịgbakwụnye echiche nke “ka” ma ọ bụ “ọ ka.”
- source_word: πρὸς
  choice: n’aka
  rationale: N’ebe a πρός na-egosi iziga mmadụ n’ebe onye ọzọ nọ; n’usoro okwu Igbo, “zigara ya n’aka Kayịfas” bụ ụzọ ebumpụta ụwa isi kwuo ya.
- source_word: Καϊάφαν
  choice: Kayịfas
  rationale: Nke a bụ nsụgharị mkpụrụolu nke aha Grik Καϊάφας kwekọrọ n’ụda na ide Igbo.
- source_word: τὸν ἀρχιερέα
  choice: onyeisi nchụaja ahụ
  rationale: Ọ na-ezo aka n’otu onye ji ọkwa onyeisi nchụaja; “onyeisi nchụaja” na-ekewapụ ya nke ọma n’aka ìgwè ndị isi nchụaja.
- source_word: ὁ Ἅννας
  choice: Anas
  rationale: Nke a bụ nsụgharị mkpụrụolu aha Grik Ἅννας n’ụdị dị mfe ma kwekọọ n’Igbo.
theological_decisions:
- issue: Usoro oge nke ihe a mere ma e jiri ya tụnyere amaokwu ndị gbara ya gburugburu
  choice: 'A sụgharịrị ya dịka ihe mere n’usoro akụkọ: Anas zigara Jizọs n’aka Kayịfas mgbe e kere ya agbụ.'
  alternative: 'A pụrụ ịghọta ya dịka nkọwa etinyere n’etiti akụkọ banyere ihe Anas mere tupu mgbe ahụ: “Ma Anas ezipụlarị ya...”'
  rationale: Aorist indicative Grik na-agụkarị dịka ihe mere n’akụkọ. Ma n’ihi na mmekọrịta amaokwu a na usoro ihe ndị gbara ya gburugburu nwere mgbagwoju anya n’ezie, ederede bụ isi anaghị etinye nkọwa ga-eme ka ha kwekọọ n’ike; ihe odide ala peeji na-echekwa nghọta ọzọ ahụ.
translation_notes:
  register: Standard Igbo; asụsụ dị ugbu a, dị ùgwù, ma dị mfe nghọta. E ji “onyeisi nchụaja” mee ka ọkwa otu onye ahụ pụta ìhè, ma e zere itinye nkọwa ga-ekpebi esemokwu gbasara usoro oge n’ederede bụ isi.
