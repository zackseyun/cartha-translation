revisions:
- from: Ya mere, Anas zigara ya n’aka Kayịfas, onyeisi nchụaja ahụ, mgbe e kere ya agbụ[a].
  to: Ya mere, Anas zigara ya n’aka Kaịfas, onyeisi nchụaja, n’agbụ[a].
  rationale: The revision retains the Greek narrative connective, Annas as subject, the transfer to Caiaphas, and the designation “the high priest.” It renders δεδεμένον as a continuing bound condition rather than as a temporal subordinate clause, and it preserves the disputed narrative-sequence alternative only in the footnote.
  reviewer_model: gpt-5.6-terra
