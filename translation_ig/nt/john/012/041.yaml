base_translation:
  language: en
  yaml_path: translation/nt/john/012/041.yaml
  text: Isaiah said these things because he saw his glory and spoke about him[a].
translation:
  language: ig
  text: Aịzaya kwuru ihe ndị a n’ihi na ọ hụrụ ebube ya, ọ kwukwara banyere ya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Aịzaya kwuru ihe ndị a n’ihi na ọ hụrụ ebube Chineke, ọ kwukwara banyere ya.” N’ihe gbara okwu a gburugburu n’akwụkwọ Jọn, nnọchiaha ndị a nwere ike ịzo aka na Jizọs; ma ndabere sara mbara n’akwụkwọ Aịzaya bụ ọhụụ nke ebube Onyenwe anyị (Aịz. 6:1).
    reason: alternative_reading
lexical_decisions:
- source_word: ταῦτα
  choice: ihe ndị a
  rationale: Nnọchiaha ngosi a dị n'ụbara ma na-ezo aka n'okwu amụma ndị e hotara tupu amaokwu a.
- source_word: εἶπεν
  choice: kwuru
  rationale: Nke a bụ nsụgharị kwụ ọtọ, dịkwa mfe nghọta, nke λέγω.
- source_word: Ἠσαΐας
  choice: Aịzaya
  rationale: Nke a bụ ọdịdị aha onye amụma ahụ nke a na-ejikarị eme ihe n'Igbo.
- source_word: ὅτι
  choice: n’ihi na
  rationale: N'ebe a, ὅτι na-egosi ihe mere Aịzaya ji kwuo ihe ndị a; ọ bụ ezie na ịsụgharị ya dị ka ‘na’ nwekwara ike ịdị n'usoro asụsụ.
- source_word: εἶδεν
  choice: ọ hụrụ
  rationale: Nke a na-egosipụta ihe aorist nke ὁράω n'ụzọ ebumpụta ụwa n'Igbo.
- source_word: δόξαν
  choice: ebube
  rationale: ‘Ebube’ na-eburu ịdị arọ nke δόξα n'akwụkwọ Jọn karịa okwu ga-apụta naanị ịma mma ma ọ bụ nchapụta.
- source_word: αὐτοῦ
  choice: ya
  rationale: Nnọchiaha Igbo ‘ya’ na-echekwa ụzọ ihe e zoro aka na ya si ghara ịpụta kpọmkwem n'okwu Grik.
- source_word: ἐλάλησεν
  choice: kwukwaa
  rationale: ‘Kwukwaa’ na-egosi omume nke abụọ ma na-eme ka ahịrịokwu ahụ bụrụ Igbo dị ire; Igbo anaghị enye ọdịiche siri ike n'ụzọ ebumpụta ụwa n'etiti εἶπεν na ἐλάλησεν n'ebe a.
- source_word: περὶ αὐτοῦ
  choice: banyere ya
  rationale: Nke a bụ ụzọ dị ugbu a ma dị mfe isi kwupụta περί ya na genitive, ma na-echekwa nnọchiaha ahụ.
theological_decisions:
- issue: Onye nnọchiaha αὐτοῦ / αὐτοῦ na-ezo aka na ya
  choice: E debere nnọchiaha abụọ ahụ dị ka ‘ya,’ ebe ihe gbara amaokwu ahụ gburugburu n'Jọn nwere ike ime ka ha zoo aka na Jizọs.
  alternative: A pụrụ ịkọwa ha hoo haa dị ka ndị na-ezo aka na Chineke/Onyenwe anyị, dịka ọhụụ Aịzaya 6 si dị.
  rationale: Grik n'onwe ya ji nnọchiaha, ọ kpọghịkwa onye ahụ aha n'amaokwu a. Ichekwa ‘ya’ n'ederede bụ isi na-echekwa mgbagwoju anya ahụ, ebe ihe odide Jọn na-akwado nghọta nke na-ezo aka na Jizọs, ma ndabere Aịzaya bụ ọhụụ ebube Onyenwe anyị.
translation_notes:
  register: Standard Igbo; asụsụ dị ugbu a, dị ùgwù, ma dị mfe nghọta. E ji ‘Aịzaya’ na ‘Jizọs’ dịka ọdịdị aha ndị a na-ahụkarị n'Igbo. E chekwara nnọchiaha ‘ya’ iji ghara idozi n'ederede isi ihe Grik hapụrụ ka ọnọdụ okwu kọwaa.
