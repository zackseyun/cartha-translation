review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the concession, the belief of many leaders, the Pharisees as the cause, and the intended avoidance of synagogue exclusion. However, “n’ihu ọha” (“in public”) adds a specification not expressed in this verse, and “a ghara ịchụpụ ha” is less close to γένωνται (“they might become”) than wording that retains the resultant status.
  naturalness: The proposed revision uses clear, modern Standard Igbo. “Ha anaghị ekwupụta ya” appropriately represents the imperfect as an ongoing/habitual failure to confess, without requiring an explicit object beyond the context.
  terminology: “Ndị Farisii,” “ndị ọchịchị,” and “ụlọ nzukọ” are suitable. Removing “ndị Juu” from “ụlọ nzukọ ndị Juu” avoids adding an ethnic qualifier absent from the Greek; the historical referent remains clear from “ụlọ nzukọ.”
  issues:
  - severity: medium
    issue: The phrase “n’ihu ọha” is added.
    rationale: οὐχ ὡμολόγουν means that they were not confessing/acknowledging, but this verse does not explicitly say “publicly.” The contextual implication should not be made part of the main text.
  - severity: medium
    issue: “ka a ghara ịchụpụ ha” does not directly reflect γένωνται.
    rationale: The Greek expresses becoming ἀποσυνάγωγοι, a state of exclusion. “Ka ha ghara ịbụ ndị a chụpụrụ” more closely preserves that resultant condition.
  - severity: low
    issue: “ndị Juu” is added to “ụlọ nzukọ.”
    rationale: A synagogue is understood in its Jewish setting, but the Greek word does not contain this qualifier. Omitting it is more textually restrained.
  revised_text: Ma otu o sina dị, ọtụtụ ndị ọbụna n’etiti ndị ọchịchị kwere na ya; ma n’ihi ndị Farisii, ha anaghị ekwupụta ya, ka ha ghara ịbụ ndị a chụpụrụ n’ụlọ nzukọ.[a]
  revised_footnotes:
