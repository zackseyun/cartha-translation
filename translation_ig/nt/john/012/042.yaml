source:
  edition: SBLGNT
  text: ὅμως μέντοι καὶ ἐκ τῶν ἀρχόντων πολλοὶ ἐπίστευσαν εἰς αὐτόν, ἀλλὰ διὰ τοὺς Φαρισαίους οὐχ ὡμολόγουν ἵνα μὴ ἀποσυνάγωγοι γένωνται,
base_translation:
  language: en
  yaml_path: translation/nt/john/012/042.yaml
  text: Nevertheless, even among the rulers many believed in him, but because of the Pharisees they were not confessing it, so that they might not become excluded from the synagogue.
translation:
  language: ig
  text: Ma otu o sina dị, ọtụtụ ndị ọbụna n’etiti ndị ọchịchị kwere na ya; ma n’ihi ndị Farisii, ha anaghị ekwupụta ya, ka ha ghara ịbụ ndị a chụpụrụ n’ụlọ nzukọ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “ka a ghara ịchụpụ ha n’ụlọ nzukọ,” ma ọ bụ, “ka a ghara igbochi ha iso n’ọgbakọ ụlọ nzukọ.” Okwu Grik na-egosi ịbụ onye e wepụrụ ná mmekọrịta nke ụlọ nzukọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅμως μέντοι
  choice: Ma otu o sina dị
  rationale: Nkebi okwu a na-egosi nkwenye na ihe e kwuru tupu ya ma na-ewetakwa ọdịiche siri ike; ntụgharị a bụ Igbo nkịtị ma doo anya.
- source_word: καὶ ἐκ τῶν ἀρχόντων πολλοὶ
  choice: ọtụtụ ndị nọ n’etiti ndị ọchịchị
  rationale: ἐκ na-egosi na ha so n’òtù ahụ, ebe ἄρχοντες na-ezo aka ná ndị nwere ọchịchị ma ọ bụ ikike, ọ bụghị ndị eze n’ozuzu.
- source_word: ἐπίστευσαν εἰς αὐτόν
  choice: kwere na ya
  rationale: Nke a na-egosi okwukwe ma ọ bụ ntụkwasị obi e tinyere na Jizọs, dịka okwu Jọn si adịkarị.
- source_word: διὰ τοὺς Φαρισαίους
  choice: n’ihi ndị Farisii
  rationale: διά tinyere accusative na-egosi ihe kpatara omume ahụ. Egwu dị n’ọnọdụ ahụ, ma okwu Grik ekwughị ya kpọmkwem.
- source_word: οὐχ ὡμολόγουν
  choice: ha ekwughị ya n’ihu ọha
  rationale: Imperfect na-egosi na ha nọgidere na-ezere nkwupụta ahụ. ‘Ya’ na Igbo nwere ike izo aka na Jizọs ma ọ bụ n’okwukwe ha, ya mere ọ naghị amanye ihe Grik hapụrụ n’ime nghọta.
- source_word: ἵνα μὴ
  choice: ka a ghara
  rationale: Nke a na-edobe ebumnuche ha, ya bụ izere ihe ga-esi na nkwupụta ahụ pụta.
- source_word: ἀποσυνάγωγοι γένωνται
  choice: ịchụpụ ha n’ụlọ nzukọ ndị Juu
  rationale: Okwu ahụ pụtara iwepụ mmadụ n’obodo na mmekọrịta nke ụlọ nzukọ; ntụgharị a na-egosi mwepụ ahụ n’enweghị itinye usoro iwu pụrụ iche na-adịghị n’okwu Grik.
theological_decisions:
- issue: Ụdị okwukwe ndị ọchịchị ahụ nwere n’ebe Jizọs nọ
  choice: A tụgharịrị ἐπίστευσαν ozugbo dịka ‘kwere na ya,’ ma hapụkwa esemokwu dị n’etiti okwukwe ha na enweghị nkwupụta ha.
  alternative: Ịsị na ha mere naanị ka hà kwere, ma ọ bụ ikwusi ike na okwukwe ha bụ okwukwe nzọpụta zuru oke.
  rationale: Amaokwu ahụ kwuru na ha kwere na Jizọs, ma kwuo kwa na ha ekwughị ya n’ihu ọha. Ntụgharị ekwesịghị ikpebi ọnọdụ ime mmụọ ha karịa ihe ederede kwuru.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. ‘Ụlọ nzukọ ndị Juu’ na-eme ka ihe ‘synagogue’ pụtara doo onye na-agụ akwụkwọ anya. ‘Ha ekwughị ya n’ihu ọha’ na-edobe enweghị kpọmkwem object dị n’ọdịnala Grik ma na-ada nke ọma n’Igbo.
