revisions:
- from: Ma otu o sina dị, ọtụtụ ndị nọ n’etiti ndị ọchịchị kwere na ya. Ma n’ihi ndị Farisii, ha ekwughị ya n’ihu ọha, ka a ghara ịchụpụ ha n’ụlọ nzukọ ndị Juu.[a]
  to: Ma otu o sina dị, ọtụtụ ndị ọbụna n’etiti ndị ọchịchị kwere na ya; ma n’ihi ndị Farisii, ha anaghị ekwupụta ya, ka ha ghara ịbụ ndị a chụpụrụ n’ụlọ nzukọ.[a]
  rationale: The revision removes the unsupported qualification “in public,” keeps the implicit object suitably ambiguous with “ya,” and renders the resultative force of γένωνται as becoming persons excluded from the synagogue. The footnote retains legitimate lexical alternatives while aligning its explanation with the revised wording.
  reviewer_model: gpt-5.6-terra
