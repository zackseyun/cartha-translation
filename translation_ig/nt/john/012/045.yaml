translation:
  language: ig
  text: Onye na-ahụ m na-ahụkwa onye zitere m[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “na-ele m anya” ma ọ bụ “na-ekiri m”; ngwaa Grik a nwere ike ịpụta ịhụ ma ọ bụ ile anya n’ụzọ nlezianya, ọ bụghị naanị ịhụ anya nkịtị.
    reason: lexical_alternative
lexical_decisions:
- source_word: θεωρῶν / θεωρεῖ
  choice: na-ahụ / na-ahụkwa
  rationale: “Ịhụ” bụ okwu Igbo dị mfe ma kwekọọ n’ụzọ e si kwughachi θεωρέω ugboro abụọ. “Na-ahụkwa” na-eme ka njikọ καὶ pụta n’Igbo n’ụzọ ebumpụta ụwa, ebe ihe ọ pụtara gbasara ile anya nke ọma ka edobere n’ala peeji.
- source_word: ἐμὲ / με
  choice: m
  rationale: Nnọchiaha onye mbụ dị ka ihe omume metụtara ka a sụgharịrị n’ụzọ nkịtị na nke doro anya.
- source_word: τὸν πέμψαντά
  choice: onye zitere
  rationale: Nke a na-edobe nkọwa nke onye ahụ site n’omume iziga, n’etinyeghị aha dịka “Nna” nke na-adịghị n’amaokwu Grik a.
- source_word: ὁ θεωρῶν
  choice: Onye na-ahụ
  rationale: Nkeji okwu a nwere article na participle na-ezo aka n’ozuzu nye onye ọ bụla na-eme ihe ahụ; “Onye na-ahụ” bụ Igbo kwụ ọtọ ma dịkwa ebumpụta ụwa.
theological_decisions:
- issue: Mmekọrịta dị n’etiti ịhụ Jizọs na ịhụ onye zitere ya
  choice: 'E kwuru ya ozugbo: onye na-ahụ Jizọs na-ahụkwa onye zitere ya.'
  alternative: Ịkọwa ya nanị dị ka ịmụ banyere onye zitere ya, ma ọ bụ ịgbakwunye okwu na-ekwu na ha bụ otu onye n’ụzọ amaokwu ahụ n’onwe ya na-ekwughị.
  rationale: Nsụgharị a na-edobe ike nke nkwupụta ahụ gbasara mkpughe na ịdị n’otu, ma ọ naghị akọwawanye ụdị ịdị n’otu ahụ karịa ihe ederede Grik kwuru.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe ma nwee ugwu. A kwughachiri ngwaa “ịhụ” dịka e mere na Grik, ma tinye “-kwa” iji gosipụta njikọ ahụ n’ụzọ Igbo si ada nke ọma.
