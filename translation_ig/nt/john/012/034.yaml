revisions:
- from: Ya mere, ìgwè mmadụ ahụ zara ya, sị, “Anyị anụla n’Iwu na Mesaịa ahụ ga-anọgide ruo mgbe ebighị ebi.[a] Oleezi otu i si asị na a ghaghị ibuli Nwa nke Mmadụ elu?[b] Ònye bụ Nwa nke Mmadụ a?”
  to: Ya mere, ìgwè mmadụ ahụ zara ya, sị, “Anyị anụla site n’Iwu na Mesaịa ahụ na-adịgide ruo mgbe ebighị ebi.[a] Olee otú i si asị na a ghaghị ibuli Nwa nke Mmadụ elu?[b] Ònye bụ Nwa nke Mmadụ a?”
  rationale: These limited revisions improve fidelity to the Greek preposition and verb tense, make the question more idiomatic in Standard Igbo, and clarify the footnote’s physical/exaltation contrast while preserving the source’s ambiguity.
