id: JHN.12.34
reference: John 12:34
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀπεκρίθη ⸀οὖν αὐτῷ ὁ ὄχλος· Ἡμεῖς ἠκούσαμεν ἐκ τοῦ νόμου ὅτι ὁ χριστὸς μένει εἰς τὸν αἰῶνα, καὶ πῶς ⸂λέγεις σὺ⸃ ⸀ὅτι δεῖ ὑψωθῆναι τὸν υἱὸν τοῦ ἀνθρώπου; τίς ἐστιν οὗτος ὁ υἱὸς τοῦ ἀνθρώπου;
base_translation:
  language: en
  yaml_path: translation/nt/john/012/034.yaml
  text: So the crowd answered him[a], "We have heard from the Law that the Messiah remains forever[b], and how can you say that the Son of Man must be lifted up? Who is this Son of Man?"
translation:
  language: ig
  text: Ya mere, ìgwè mmadụ ahụ zara ya, sị, “Anyị anụla site n’Iwu na Mesaịa ahụ na-adịgide ruo mgbe ebighị ebi.[a] Olee otú i si asị na a ghaghị ibuli Nwa nke Mmadụ elu?[b] Ònye bụ Nwa nke Mmadụ a?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Grik: “Kraịst ahụ”; e jiri “Mesaịa ahụ” mee ihe ebe a n’ihi na okwu ahụ bụ utu aha.'
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịghọta ya dị ka “ibuli n’otuto.” N’Oziọma Jọn, “ibuli elu” nwere ike ịpụta ma ibuli ya elu n’ụzọ anụ ahụ ma ibuli ya n’otuto.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη οὖν αὐτῷ ὁ ὄχλος
  choice: Ya mere, ìgwè mmadụ ahụ zara ya
  rationale: “Ya mere” na-edobe njikọ/inference nke οὖν, ebe “ìgwè mmadụ” bụ nsụgharị Igbo doro anya nke ὁ ὄχλος.
- source_word: Ἡμεῖς ἠκούσαμεν ἐκ τοῦ νόμου
  choice: Anyị anụla n’Iwu
  rationale: Ụdị perfect “anụla” na-egosi ihe ha natara n’ozizi nke ka dị mkpa ugbu a; “n’Iwu” na-edobe ụzọ okwu Grik na njikọ ya na Akwụkwọ Nsọ ndị Juu.
- source_word: ὁ χριστός
  choice: Mesaịa ahụ
  rationale: Χριστός na-arụ ọrụ dị ka utu aha ebe a; “Mesaịa” na-edobe ntọala Juu nke okwu ahụ karịa iji ya dị ka aha nkịtị.
- source_word: μένει εἰς τὸν αἰῶνα
  choice: ga-anọgide ruo mgbe ebighị ebi
  rationale: Nke a na-egosipụta ịdịgide nke μένει na okwu idiomatic εἰς τὸν αἰῶνα n’Igbo dị ugbu a.
- source_word: πῶς λέγεις σὺ
  choice: Oleezi otu i si asị
  rationale: Ajụjụ a nwere ụda nke ịtụnanya na ịma aka; “Oleezi otu” na-ewepụta nke ahụ n’Igbo eke.
- source_word: δεῖ ὑψωθῆναι
  choice: a ghaghị ibuli ... elu
  rationale: “A ghaghị” na-egosipụta mkpa nke δεῖ, ebe “ibuli elu” na-echekwa nghọta abụọ nke ὑψόω—ibuli n’ahụ na ibuli n’otuto—n’etinyeghị naanị otu nkọwa.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Nwa nke Mmadụ
  rationale: Nke a bụ ụzọ Igbo doro anya isi chekwaa utu aha ahụ na njikọ ya na ọdịnala Daniel, kama ịtụgharị ya ka ọ bụrụ naanị mmadụ nkịtị.
theological_decisions:
- issue: Nsụgharị Χριστός dị ka utu aha
  choice: Mesaịa
  alternative: Kraịst
  rationale: N’ahịrịokwu a, okwu ahụ bụ utu aha onye ndị mmadụ tụrụ anya ya; “Mesaịa” na-eme ka ọnọdụ atụmanya ndị Juu doo anya n’enweghị itinye ozizi ụka pụrụ iche.
- issue: Nghọta ὑψωθῆναι n’Oziọma Jọn
  choice: ibuli elu
  alternative: ibuli n’otuto
  rationale: “Ibuli elu” na-ahapụ nghọta abụọ ahụ—ịkpọgide ya n’obe na ibuli ya n’otuto—ka ha dịrị ọnụ, dịka okwu Jọn si arụ ọrụ.
translation_notes:
  register: Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. E ji akara ụda naanị ebe ọ na-enyere aka izere mgbagwoju anya; ahịrịokwu ahụ na-edobe ụda ịma aka nke ìgwè mmadụ ahụ na nghọta abụọ dị n’okwu “ibuli elu.”
