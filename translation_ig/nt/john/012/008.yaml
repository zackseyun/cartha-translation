id: JHN.12.8
reference: John 12:8
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τοὺς πτωχοὺς γὰρ πάντοτε ἔχετε μεθ’ ἑαυτῶν, ἐμὲ δὲ οὐ πάντοτε ἔχετε.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/008.yaml
  text: For you always have the poor with you[a], but you do not always have me.
translation:
  language: ig
  text: N’ihi na ndị ogbenye na-anọnyere unu mgbe niile, ma m anaghị anọnyere unu mgbe niile.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πτωχούς
  choice: ndị ogbenye
  rationale: Adjective a e ji dị ka aha na-ezo aka n’ìgwè ndị dara ogbenye; “ndị ogbenye” bụ okwu Igbo doro anya ma bụrụkwa nke a na-ejikarị eme ihe.
- source_word: γάρ
  choice: N’ihi na
  rationale: Ọ na-enye nkọwa ma ọ bụ ihe ndabere nye okwu bu ya ụzọ; “N’ihi na” na-egosipụta njikọ nkọwa ahụ n’ụzọ ebumpụta ụwa.
- source_word: πάντοτε
  choice: mgbe niile
  rationale: Ọ na-egosi ịdị adị ma ọ bụ inwe ohere ịhụ mmadụ mgbe nile; otu ntụgharị a ka e ji mee ihe n’ahịrịokwu abụọ ahụ iji chekwaa myirịta ha.
- source_word: ἔχετε
  choice: unu na-enwe / unu agaghị enwe
  rationale: N’ebe a, ngwaa ahụ na-egosi na mmadụ nọ n’ebe ha nọ ma ha nwere ohere ịnọnyere ya, ọ bụghị inwe mmadụ dịka ihe onwunwe. Ụdị Igbo ndị a dabara n’usoro nkwenye na nke ngọnarị.
- source_word: μεθ’ ἑαυτῶν
  choice: n’etiti unu
  rationale: Nkebiokwu ahụ pụtara na ndị ahụ nọ n’ụlọọrụ ma ọ bụ n’obodo ha. “N’etiti unu” bụ Igbo dị mfe ma na-ezere echiche nke inwe ha dịka ihe onwunwe.
- source_word: ἐμέ
  choice: m
  rationale: Nnochiaha onye mbụ nke na-ezo aka n’ebe Jizọs nọ dịka ihe ngwaa metụtara.
- source_word: δέ
  choice: ma
  rationale: Ọ na-egosi ọdịiche dị n’etiti ịdịgide nke ndị ogbenye n’etiti ha na oge dị mkpirikpi Jizọs ga-anọnyere ha.
- source_word: οὐ πάντοτε
  choice: agaghị ... mgbe niile
  rationale: N’usoro okwu Igbo a, ngọnarị ọdịnihu na-egosi na ọnụnọ Jizọs n’etiti ha agaghị adịgide mgbe niile, na-enweghị ịgbanwe ọdịiche nke Grik.
theological_decisions:
- issue: Enwere ike iji okwu Jizọs mee ka ilekọta ndị ogbenye yie ihe na-adịghị mkpa
  choice: E gosipụtara ya dịka ọdịiche dị n’etiti onye ga-anọgide na-adị n’etiti ha na oge pụrụ iche nke ọnụnọ Jizọs, n’etinyeghị echiche na ndị ogbenye adịghị mkpa.
  alternative: Ịkọwaghachi ya n’ụzọ na-eme ka ndị ogbenye yie ndị na-adịchaghị mkpa, ma ọ bụ ime ka ọdịiche ahụ ghara ịdị nkọ.
  rationale: Grik na-ekwu kpọmkwem na ndị ogbenye ga-adị n’etiti ha mgbe niile, ebe ha agaghị enwe Jizọs mgbe niile. Nsụgharị ahụ echekwala esemokwu a ma etinyeghị nkuzi ọzọ ederede ahụ na-ekwughị.
translation_notes:
  register: Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E ji “ndị ogbenye” mee ihe maka aha ìgwè mmadụ, ma jiri “n’etiti unu” gosi ọnụnọ n’obodo ha karịa echiche nke inwe ihe onwunwe.
