revisions:
- from: N’ihi na unu na-enwe ndị ogbenye mgbe niile n’etiti unu[a], ma unu agaghị enwe m mgbe niile.
  to: N’ihi na ndị ogbenye na-anọnyere unu mgbe niile, ma m anaghị anọnyere unu mgbe niile.
  rationale: The revision renders γάρ as “N’ihi na,” πτωχούς as “ndị ogbenye,” and preserves the parallel present-tense contrast of πάντοτε ἔχετε / οὐ πάντοτε ἔχετε through “na-anọnyere unu mgbe niile” / “anaghị anọnyere unu mgbe niile.” Rendering the contextual sense of “have ... with you” as presence is natural Igbo and avoids an unwanted possessive implication. No footnote is needed.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T06:25:06Z'
review_pass:
  verdict: revise
  source_fidelity: 'The draft correctly identifies the poor and the contrast, but its second clause, “unu agaghị enwe m,” uses future negation (“you will not have me”). The Greek οὐ πάντοτε ἔχετε is present tense: “you do not always have me.” The translation should retain this present contrast without adding a future-only sense.'
  naturalness: “Ndị ogbenye na-anọnyere unu” is natural Standard Igbo for the contextual sense of people being present with someone, and avoids construing people as possessions. Repeating “na-anọnyere unu” makes the contrast clear and idiomatic.
  terminology: “Ndị ogbenye” is accurate and customary for πτωχούς. No doctrinal expansion is introduced. The proposed footnote is removed because its wording (“unu na ha”) is not a viable lexical alternative and its explanation does not accurately support the translated phrase.
  issues:
  - severity: medium
    issue: The phrase “unu agaghị enwe m mgbe niile” shifts the second clause to future negation.
    rationale: οὐ πάντοτε ἔχετε is present tense and contrasts Jesus’ limited present availability with the poor’s continuing presence; it does not itself use a future verb form.
  - severity: low
    issue: Footnote a gives an unclear and unsupported alternative (“unu na ha”).
    rationale: It neither provides a meaningful alternative translation nor accurately explains the Greek phrase μεθ’ ἑαυτῶν.
  revised_text: N’ihi na ndị ogbenye na-anọnyere unu mgbe niile, ma m anaghị anọnyere unu mgbe niile.
  revised_footnotes: []
  revision_rationale: The revision renders γάρ as “N’ihi na,” πτωχούς as “ndị ogbenye,” and preserves the parallel present-tense contrast of πάντοτε ἔχετε / οὐ πάντοτε ἔχετε through “na-anọnyere unu mgbe niile” / “anaghị anọnyere unu mgbe niile.” Rendering the contextual sense of “have ... with you” as presence is natural Igbo and avoids an unwanted possessive implication. No footnote is needed.
