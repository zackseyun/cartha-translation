  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ οὖν ὄχλος ὁ ἑστὼς καὶ ἀκούσας ἔλεγεν βροντὴν γεγονέναι· ἄλλοι ἔλεγον· Ἄγγελος αὐτῷ λελάληκεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/029.yaml
  text: So the crowd that was standing there and had heard it was saying that thunder had happened; others were saying[a], “An angel has spoken to him.”
translation:
  language: ig
  text: Ya mere, ìgwè mmadụ ahụ nke guzoro n’ebe ahụ ma nụ ya nọ na-ekwu na égbè eluigwe dara[a]; ndị ọzọ na-ekwu, “Mmụọ ozi agwala ya okwu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ: “na égbè eluigwe mere.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Ya mere
  rationale: Na-egosi njikọ na ihe gara aga na nsonaazụ akụkọ ahụ, n’ụzọ dabara n’Igbo nkịtị.
- source_word: ὄχλος
  choice: ìgwè mmadụ
  rationale: Ọ bụ okwu Igbo doro anya maka ọtụtụ mmadụ gbakọtara n’otu ebe.
- source_word: ὁ ἑστὼς
  choice: ahụ guzo n’ebe ahụ
  rationale: Na-egosi ọnọdụ ìgwè mmadụ ahụ nọ na ya; participle perfect ahụ na-arụ ọrụ nkọwa.
- source_word: ἀκούσας
  choice: ndị nụrụ ya
  rationale: Na-egosi na ha buru ụzọ nụ ụda/olu ahụ tupu ha akọwaa ya; ‘ya’ na-anọchi ihe a nụrụ nke amaara site n’amaokwu bu ụzọ.
- source_word: ἔλεγεν
  choice: nọ na-ekwu
  rationale: Na-echekwa ọdịdị imperfect nke na-egosi okwu na-aga n’ihu ma ọ bụ nke a na-ekwughachi.
- source_word: βροντὴν γεγονέναι
  choice: na égbè eluigwe dara
  rationale: Nke a bụ ụzọ Igbo dị ndụ na nke mmadụ na-aghọta ozugbo isi kwuo na thunder mere, na-enweghị ilu ma ọ bụ nkọwa ọzọ.
- source_word: ἄλλοι
  choice: ndị ọzọ
  rationale: Na-ekewa otu ndị ọzọ n’ime ìgwè mmadụ ahụ.
- source_word: Ἄγγελος
  choice: Mmụọ ozi
  rationale: N’ọnọdụ a, okwu ahụ na-ezo aka n’onye ozi nke eluigwe, ọ bụghị onye ozi mmadụ.
- source_word: αὐτῷ
  choice: ya
  rationale: Na-egosi na Jizọs bụ onye a gwara okwu, dịka ọnọdụ akụkọ ahụ si gosi.
- source_word: λελάληκεν
  choice: agwala ... okwu
  rationale: Ụdị perfect ahụ na-egosi omume e mechara nke ka dị mkpa ugbu a; perfect Igbo ‘agwala’ na-egosipụta nke a nke ọma.
theological_decisions:
- issue: Ụdị onye kwuru okwu si n’eluigwe
  choice: Mmụọ ozi agwala ya okwu
  alternative: Onye ozi agwala ya okwu
  rationale: N’ebe a, ìgwè mmadụ ahụ na-akọwa olu si n’eluigwe dị ka nke mmụọ ozi. ‘Mmụọ ozi’ na-egosi onye nke eluigwe n’enweghị ịgbakwunye nkọwa ozizi na-adịghị n’amaokwu ahụ.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji ‘égbè eluigwe dara’ mee ka βροντὴν γεγονέναι bụrụ okwu Igbo eke; e debere ntụgharị dị nso n’usoro Grik n’ala ala peeji.
