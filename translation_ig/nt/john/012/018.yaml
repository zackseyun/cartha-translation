  text: διὰ τοῦτο ⸀καὶ ὑπήντησεν αὐτῷ ὁ ὄχλος ὅτι ⸀ἤκουσαν τοῦτο αὐτὸν πεποιηκέναι τὸ σημεῖον.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/018.yaml
  text: For this reason also the crowd went to meet him[b][a], because they heard that he had done this sign.
translation:
  language: ig
  text: Ọ bụkwa n’ihi nke a ka igwe mmadụ ahụ gara izute ya,[a] n’ihi na ha nụrụ na o mere ihe ịrịba ama a.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “zutere ya” ma ọ bụ “pụtara ịga izute ya.” Ngwaa Grik ahụ gụnyere echiche nke ịga izute mmadụ.
    reason: lexical_alternative
  - marker: b
    text: “Ihe ịrịba ama” bụ okwu Jọn na-ejikarị akọwa ọrụ ebube na-arụtụ aka n’ebe onye Jizọs bụ na ọrụ e zitere ya ịrụ nọ; a pụkwara ịsụ ya, “ọrụ ebube.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: n’ihi nke a
  rationale: Nke a na-egosi ihe kpatara omume ahụ ma jikọta amaokwu a nke ọma na ihe ndị bu ya ụzọ.
- source_word: καὶ
  choice: kwa
  rationale: ‘Kwa’ na-echekwa echiche mgbakwunye dị na njikọ Grik ahụ n’ụzọ dabara adaba n’Igbo.
- source_word: ὑπήντησεν αὐτῷ
  choice: gara izute ya
  rationale: Nhọrọ a na-echekwa echiche nke ịga n’ebe mmadụ nọ iji zute ya, nke ngwaa Grik ahụ nwere.
- source_word: ὁ ὄχλος
  choice: igwe mmadụ ahụ
  rationale: Nke a bụ okwu Igbo nkịtị ma doo anya maka ìgwè mmadụ gbakọtara ọnụ.
- source_word: ὅτι
  choice: n’ihi na
  rationale: N’ebe a, okwu ahụ na-ewebata ihe mere igwe mmadụ ahụ ji gaa izute Jizọs.
- source_word: ἤκουσαν
  choice: ha nụrụ
  rationale: Oge gara aga dị mfe na-enye aorist Grik ahụ nke ọma, ebe njikọ ihe kpatara ya na-eme ka usoro ihe ndị ahụ doo anya.
- source_word: τοῦτο αὐτὸν πεποιηκέναι τὸ σημεῖον
  choice: na ọ bụ ya mere ihe ịrịba ama a
  rationale: Usoro a bụ Igbo ebumpụta ụwa; ‘ọ bụ ya’ na-eme ka onye mere ihe ahụ doo anya, ebe ‘ihe ịrịba ama a’ na-echekwa demonstrative na okwu pụrụ iche Jọn ji.
theological_decisions:
- issue: Nsụgharị σημεῖον n’Oziọma Jọn
  choice: ihe ịrịba ama
  alternative: ọrụ ebube
  rationale: ‘Ihe ịrịba ama’ na-echekwa echiche Jọn na ọrụ ahụ na-arụtụ aka n’ụdị onye Jizọs bụ na ozi ya, ọ bụghị naanị na ọ bụ ihe dị ebube.
translation_notes:
  register: Ejiri Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E debere usoro ihe kpatara ya nke διὰ τοῦτο ... ὅτι, tinyekwa ike mgbakwunye nke καὶ. Ihe nrịbama ukwu niile dị n’ahịrịokwu bụ [a] na [b], ma ha kwekọrọ n’okpuru nkọwa.
