  to: Ọ bụkwa n’ihi nke a ka igwe mmadụ ahụ gara izute ya,[a] n’ihi na ha nụrụ na o mere ihe ịrịba ama a.[b]
  rationale: The revision removes an unmarked emphatic subject construction while retaining the completed action, causal relationship, and demonstrative reference to this sign. The footnote is lightly recast for natural Standard Igbo and continues to distinguish Johannine “sign” from a mere miracle.
