id: JHN.12.43
reference: John 12:43
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἠγάπησαν γὰρ τὴν δόξαν τῶν ἀνθρώπων μᾶλλον ἤπερ τὴν δόξαν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/043.yaml
  text: For they loved the glory of men rather than the glory of God[a].
translation:
  language: ig
  text: N’ihi na ha hụrụ otuto ndị mmadụ n’anya karịa otuto Chineke.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “otuto sitere n’aka ndị mmadụ karịa nke sitere n’aka Chineke”; a pụkwara ịghọta “otuto ndị mmadụ” dị ka “nkwado ndị mmadụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠγάπησαν
  choice: ha hụrụ … n’anya
  rationale: Nke a na-egosipụta ngwaa ἀγαπάω n’ụzọ Igbo nkịtị ma na-edobe ike okwu ahụ karịa nanị ịsị na ha họọrọ otu ihe.
- source_word: γὰρ
  choice: N’ihi na
  rationale: Ọ na-egosi na amaokwu a na-enye ihe kpatara okwu bu ya ụzọ.
- source_word: δόξαν
  choice: otuto
  rationale: “Otuto” nwere ike ịpụta nsọpụrụ, aha ọma, ma ọ bụ otuto a na-enye mmadụ; ikwughachi ya ugboro abụọ na-edobe myiri okwu Grik na esemokwu dị n’etiti nke ndị mmadụ na nke Chineke.
- source_word: τῶν ἀνθρώπων
  choice: ndị mmadụ
  rationale: ἄνθρωποι ebe a na-ezo aka n’ụmụ mmadụ n’ozuzu, ọ bụghị naanị ụmụ nwoke; “ndị mmadụ” bụ Standard Igbo doro anya ma ziri ezi n’ihe gbasara okike.
- source_word: μᾶλλον ἤπερ
  choice: karịa
  rationale: Ọ na-egosipụta ntụnyere na mmasị ha nwere n’otu otuto karịa nke ọzọ n’Igbo dị mfe ma bụrụkwa nke eke.
- source_word: τοῦ θεοῦ
  choice: Chineke
  rationale: “Otuto Chineke” na-edobe usoro yiri “otuto ndị mmadụ” ma ghara ikpebi kpamkpam ma genitive ahụ ọ̀ na-egosi isi iyi ka ọ̀ bụ ihe nwe ya.
theological_decisions:
- issue: Ihe δόξα pụtara n’esemokwu dị n’etiti ndị mmadụ na Chineke
  choice: otuto
  alternative: ebube; nsọpụrụ; nkwado
  rationale: “Otuto” na-edobe njikọ okwu ahụ na isiokwu Jọn banyere δόξα ma na-ahapụ ohere maka echiche nke nsọpụrụ, aha ọma, ma ọ bụ nkwado. “Nkwado” ga-akọwa ihe ahụ n’ụzọ dị warara karịa Grik.
- issue: Ma genitive dị na τῶν ἀνθρώπων na τοῦ θεοῦ ọ̀ na-egosi isi iyi ka ọ̀ bụ ihe nwe ya
  choice: otuto ndị mmadụ / otuto Chineke
  alternative: otuto sitere n’aka ndị mmadụ / otuto sitere n’aka Chineke
  rationale: Usoro a na-edobe nkenke na myiri nke Grik ma ghara idozi nghọta ahụ n’otu ụzọ naanị; ihe odide ala peeji na-egosi nghọta nke isi iyi.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe ma dị ugwu dee ya. “Ndị mmadụ” na-egosi mmadụ niile n’enweghị echiche na ọ bụ naanị ụmụ nwoke. E debere otu okwu “otuto” n’akụkụ abụọ iji chekwaa myiri na esemokwu nke ederede Grik.
