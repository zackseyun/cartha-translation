  source_fidelity: 'Igbo text accurately renders the Greek: γάρ is represented by “N’ihi na”; ἠγάπησαν by the natural idiom “ha hụrụ ... n’anya”; the repeated δόξαν is retained as “otuto”; and karịa expresses the comparative μᾶλλον ἤπερ. The paired genitives remain appropriately noncommittal, as in the source.'
