id: JHN.12.35
reference: John 12:35
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἶπεν οὖν αὐτοῖς ὁ Ἰησοῦς· Ἔτι μικρὸν χρόνον τὸ φῶς ⸂ἐν ὑμῖν⸃ ἐστιν. περιπατεῖτε ⸀ὡς τὸ φῶς ἔχετε, ἵνα μὴ σκοτία ὑμᾶς καταλάβῃ, καὶ ὁ περιπατῶν ἐν τῇ σκοτίᾳ οὐκ οἶδεν ποῦ ὑπάγει.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/035.yaml
  text: So Jesus said to them[a], “The light is still among you for a little while. Walk while you have the light, so that darkness may not overtake you. The one who walks in the darkness does not know where he is going.”
translation:
  language: ig
  text: Ya mere, Jizọs sịrị ha, “Ìhè ahụ ka dị n’etiti unu naanị nwa oge.[a] Jeenụ ije mgbe unu ka nwere ìhè ahụ, ka ọchịchịrị ghara iru unu. Onye na-eje ije n’ọchịchịrị amaghị ebe ọ na-aga.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “n’ime unu” ma ọ bụ “ya na unu nọ.” Akpaokwu Grik ahụ nwere ike ịpụta ihe karịrị otu, ma “n’etiti unu” kacha daba n’ọnọdụ a, ebe Jizọs ka nọ n’ihu ọha n’etiti ha.
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: Ya mere
  rationale: Ọ bụ njikọ okwu dị mfe nke jikọtara azịza Jizọs na mkparịta ụka gara aga, n’etinyeghị ike nkwubi okwu karịrị nke Grik.
- source_word: Ἔτι μικρὸν χρόνον
  choice: ka nọ ... nwa oge nta
  rationale: Nke a na-egosipụta ma echiche ‘ka nọ’ nke ἔτι ma obere oge nke μικρὸν χρόνον n’Igbo dị ugbu a.
- source_word: τὸ φῶς
  choice: Ìhè ahụ
  rationale: E debere ihe atụ nke ìhè kpọmkwem, ka ibu echiche ya n’Oziọma Jọn ghara ịla n’iyi.
- source_word: ἐν ὑμῖν
  choice: n’etiti unu
  rationale: N’ọnọdụ a, ọ kacha dabara n’ịkọwa ọnụnọ Jizọs n’etiti igwe mmadụ; a hapụrụ nghọta ndị ọzọ n’ala ala peeji.
- source_word: περιπατεῖτε
  choice: Na-eje ije
  rationale: Nke a na-echekwa ihe atụ Grik nke ije, nke nwekwara ike ịpụta ụzọ mmadụ si ebi ndụ.
- source_word: ὡς τὸ φῶς ἔχετε
  choice: mgbe unu ka nwere ìhè ahụ
  rationale: A ghọtara ὡς dị ka nke na-egosi oge ebe a, kwekọrọ n’ịdị ngwa nke ịdọ aka ná ntị ahụ.
- source_word: ἵνα μὴ
  choice: ka ... ghara
  rationale: Ụdị a na-egosipụta ebumnuche ma ọ bụ ihe a chọrọ izere n’Igbo doro anya.
- source_word: σκοτία
  choice: ọchịchịrị
  rationale: Ọ na-echekwa ọdịiche Jọn na-eme n’etiti ìhè na ọchịchịrị.
- source_word: καταλάβῃ
  choice: ịchụkwute
  rationale: Ọ na-egosi ọchịchịrị dị ka ihe na-achụ mmadụ ma mesịa rute ya; nke a dabara na ihe oyiyi njem dị n’amaokwu ahụ.
- source_word: ὁ περιπατῶν
  choice: Onye na-eje ije
  rationale: Ọ na-echekwa otu onye nke na-anọchite anya onye ọ bụla, dịka participle Grik ahụ si arụ ọrụ.
- source_word: ἐν τῇ σκοτίᾳ
  choice: n’ọchịchịrị
  rationale: Nsụgharị a bụ nke okike n’Igbo ma na-echekwa ọnọdụ nke ibi ma ọ bụ ịga ije n’ime ọchịchịrị.
- source_word: οὐκ οἶδεν ποῦ ὑπάγει
  choice: amaghị ebe ọ na-aga
  rationale: Ọ bụ okwu Igbo doro anya nke na-echekwa echiche nke amaghị ụzọ ma ọ bụ ebe njem na-eduga.
theological_decisions:
- issue: Ihe ἐν ὑμῖν pụtara n’ihe metụtara ‘ìhè ahụ’
  choice: n’etiti unu
  alternative: n’ime unu; ma ọ bụ, unu na ya nọ
  rationale: Ọnọdụ akụkọ ahụ na-egosi Jizọs na-ekwu maka obere oge ọ ka ga-anọ n’ihu ọha n’etiti ndị mmadụ dịka ìhè. Ma ebe ἐν nwere ike ibu nghọta nke ịnọ n’ime mmadụ ma ọ bụ ịnọnyere ha, e debere ụzọ nghọta ndị ahụ n’ala ala peeji kama iwepụ mgbagwoju anya ahụ.
translation_notes:
  register: E ji Igbo Izugbe dị ugbu a, dị ùgwù ma dị mfe nghọta. E chekwara ihe atụ nke ‘ije,’ ‘ìhè,’ na ‘ọchịchịrị’ kama ịkọwa ha n’ụzọ ga-emechi nghọta ha. Akara ala ala peeji [a] dị n’ederede isi.
