revisions:
- from: Ya mere, Jizọs sịrị ha, “Ìhè ahụ ka nọ n’etiti unu nwa oge nta.[a] Na-eje ije mgbe unu ka nwere ìhè ahụ, ka ọchịchịrị ghara ịchụkwute unu. Onye na-eje ije n’ọchịchịrị amaghị ebe ọ na-aga.”
  to: Ya mere, Jizọs sịrị ha, “Ìhè ahụ ka dị n’etiti unu naanị nwa oge.[a] Jeenụ ije mgbe unu ka nwere ìhè ahụ, ka ọchịchịrị ghara iru unu. Onye na-eje ije n’ọchịchịrị amaghị ebe ọ na-aga.”
  rationale: The revision corrects the motion/result nuance of καταλάβῃ, improves idiomatic Standard Igbo phrasing, and refines the footnote’s alternative rendering. It retains the public-presence reading ‘n’etiti unu’ in the main text while preserving the source phrase’s alternatives in the footnote.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T06:25:30Z'
review_pass:
  verdict: revise
  source_fidelity: The draft faithfully conveys the temporal limitation of the light, the command to walk while it is available, the purpose that darkness not catch up with the hearers, and the final statement about not knowing one’s destination. However, ọchịchịrị ghara ịchụkwute unu means chiefly ‘that darkness may not pursue/chase you’; καταλάβῃ denotes catching up with, overtaking, or seizing. A rendering with iru (‘reach/catch up with’) preserves the source image more accurately.
  naturalness: The verse is generally clear Standard Igbo. Recasting nwa oge nta as naanị nwa oge is more idiomatic in this sentence, and using Jeenụ ije gives a direct plural imperative corresponding to περιπατεῖτε.
  terminology: Ìhè, ọchịchịrị, and the walking image are retained appropriately. Jizọs is the standard name form. The footnote should express the associative alternative to ἐν ὑμῖν more naturally as ‘ya na unu nọ’ rather than ‘unu na ya nọ.’
  issues:
  - severity: medium
    issue: ‘ịchụkwute’ is not an exact rendering of καταλάβῃ.
    rationale: It depicts darkness pursuing the hearers, whereas the Greek emphasizes its reaching, catching, or overtaking them. ‘iru unu’ retains the intended warning without selecting the stronger interpretive sense ‘overcome.’
  - severity: low
    issue: The temporal phrase ‘nwa oge nta’ is less natural here.
    rationale: ‘naanị nwa oge’ idiomatically communicates ‘for only a little while’ while retaining both ἔτι and μικρὸν χρόνον in context.
  - severity: low
    issue: The footnote’s ‘unu na ya nọ’ is awkward as the alternative ‘with you.’
    rationale: ‘ya na unu nọ’ naturally states that the light is with the hearers and preserves the ambiguity noted in the English audit trail.
  revised_text: Ya mere, Jizọs sịrị ha, “Ìhè ahụ ka dị n’etiti unu naanị nwa oge.[a] Jeenụ ije mgbe unu ka nwere ìhè ahụ, ka ọchịchịrị ghara iru unu. Onye na-eje ije n’ọchịchịrị amaghị ebe ọ na-aga.”
  revised_footnotes:
  - marker: a
    text: A pụkwara ịsị, “n’ime unu” ma ọ bụ “ya na unu nọ.” Akpaokwu Grik ahụ nwere ike ịpụta ihe karịrị otu, ma “n’etiti unu” kacha daba n’ọnọdụ a, ebe Jizọs ka nọ n’ihu ọha n’etiti ha.
    reason: alternative_reading
  revision_rationale: The revision corrects the motion/result nuance of καταλάβῃ, improves idiomatic Standard Igbo phrasing, and refines the footnote’s alternative rendering. It retains the public-presence reading ‘n’etiti unu’ in the main text while preserving the source phrase’s alternatives in the footnote.
