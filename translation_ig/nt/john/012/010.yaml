  text: ἐβουλεύσαντο δὲ οἱ ἀρχιερεῖς ἵνα καὶ τὸν Λάζαρον ἀποκτείνωσιν,
base_translation:
  language: en
  yaml_path: translation/nt/john/012/010.yaml
  text: So the chief priests decided to kill Lazarus also,[a]
translation:
  language: ig
  text: Ma ndị isi nchụàjà kpebiri igbu Lazarọs kwa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “zubere igbu Lazarọs kwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐβουλεύσαντο
  choice: kpebiri
  rationale: N'ebe a, ngwaa a na-egosi na ha tụlere okwu ahụ wee ruo ná mkpebi ime ya. “Kpebiri” bụ okwu Igbo doro anya ma dịkwa mma n'akụkọ a.
- source_word: δὲ
  choice: N’ihi ya
  rationale: N'usoro akụkọ a, δέ na-ejikọta mkpebi ndị isi nchụàjà na ihe e kwuru n'amaokwu bu ụzọ. “N’ihi ya” na-egosipụta ọganihu ahụ n'ụzọ ebumpụta ụwa, n'agbanyeghị na “ma” ma ọ bụ “mgbe ahụ” nwekwara ike ịrụ ọrụ n'ọnọdụ ụfọdụ.
- source_word: οἱ ἀρχιερεῖς
  choice: ndị isi nchụàjà
  rationale: Okwu a na-ezo aka n'òtù ndị ndu nchụàjà, ọ bụghị naanị otu nnukwu onye nchụàjà. “Ndị isi nchụàjà” bụ nsụgharị ziri ezi ma ghọta ya ngwa ngwa.
- source_word: ἵνα
  choice: igbu
  rationale: Mgbe ọ na-esochi ngwaa nke mkpebi, ἵνα tinyere subjunctive na-egosi ihe ha kpebiri ime. Infinitive Igbo “igbu” na-egosipụta nke a n'ụzọ dị mfe.
- source_word: καὶ
  choice: -kwa
  rationale: Mgbakwunye “-kwa” n'okwu “igbukwa” na-egosi na Lazarọs sokwa ná ndị ha chọrọ igbu; ọ na-echekwa ọrụ mgbakwunye nke καί.
- source_word: τὸν Λάζαρον
  choice: Lazarọs
  rationale: E dere aha onye ahụ dịka “Lazarọs,” ụdị a na-ejikarị ede aha Lazarus n'Igbo. Isiokwu Grik ahụ achọghị okwu pụrụ iche n'Igbo.
- source_word: ἀποκτείνωσιν
  choice: igbu
  rationale: “Igbu” bụ okwu kpọmkwem na nke ebumpụta ụwa. “Ime ka ọ nwụọ” nwere ike ịdị ogologo ma ọ bụ mee ka okwu ahụ ghara ịdị ike; okwu nke pụtara igbu ọchụ n'ụzọ iwu kpọmkwem ga-agbakwụnye ikpe omume nke okwu Grik ahụ n'onwe ya ekwughị.
theological_decisions:
- issue: Otú e si gosi nzube ndị isi nchụàjà megide Lazarọs
  choice: E kwuru ya ozugbo dịka mkpebi igbu Lazarọs, n'etinyeghị nkọwa ọzọ banyere ihe kpatara ya.
  alternative: Iji okwu siri ike karị nke pụtara na ha gbara izu ma ọ bụ kpara nkata igbu ya.
  rationale: Amaokwu ahụ na-egosi mkpebi e ji ụma mee, ma ọ naghị eji okwu pụrụ iche nke pụtara ịgba izu. Nsụgharị a na-echekwa ịdị njọ nke nzube ha n'agbakwụnyeghị echiche na-adịghị n'ahịrịokwu ahụ.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke oge a, dị ùgwù ma dịkwa mfe nghọta. E jikọtara “-kwa” na “igbu” n'ụzọ ebumpụta ụwa iji gosipụta καί. Akara nkọwa [a] dị n'isiokwu dịka achọrọ.
