- from: N’ihi ya, ndị isi nchụàjà kpebiri igbukwa Lazarọs.[a]
  to: Ma ndị isi nchụàjà kpebiri igbu Lazarọs kwa.[a]
  rationale: The revision changes only the rendering of δέ from the overly causal “N’ihi ya” to the neutral narrative connective “Ma.” It retains the source’s deliberate decision, the plural chief-priestly group, the intended killing, and the additive force that includes Lazarus as an additional target. The footnote is adjusted to preserve the same additive placement in the alternative wording.
