review_pass:
  verdict: revise
  source_fidelity: The draft retains the main actions, the quantity, the expensive nard, and Mary’s use of her hair. However, its final clause says that the fragrance filled "in the house" rather than explicitly making the house the entity filled, as ἡ οἰκία ἐπληρώθη does.
  naturalness: The main narrative is understandable Standard Igbo. Recasting the last sentence with ụlọ ahụ as subject is more idiomatic and accurately reflects the Greek passive. The lexical-alternative note is also made more natural.
  terminology: Meri, Jizọs, litra, mmanụ otite, and nad are suitable. “Tee ... mmanụ” is retained as a non-doctrinal rendering of ἤλειψεν. The debated sense of πιστικῆς remains appropriately noted without resolving it beyond the text.
  issues:
  - severity: medium
    issue: The final sentence does not explicitly state that the house was filled.
    rationale: “Ísì ọma ... wee jupụta n’ụlọ ahụ” can mean that the fragrance became abundant within the house. The Greek specifically has “the house was filled with the fragrance.” Recasting it as “Ụlọ ahụ jupụtara n’ísì ọma...” preserves the source construction and sense.
  - severity: low
    issue: Footnote b’s phrase “nad ezigbo ya” is awkward Igbo.
    rationale: “nad nke bụ ezigbo ya” expresses the suggested alternative more naturally while retaining the lexical uncertainty of πιστικῆς.
  revised_text: Meri wee were otu litra[a] mmanụ otite nad dị ọcha[b][c], nke dị oke ọnụ, tee mmanụ ahụ n’ụkwụ Jizọs, jirikwa ntutu isi ya hichaa ụkwụ ya. Ụlọ ahụ wee jupụta n’ísì ọma mmanụ otite ahụ.
