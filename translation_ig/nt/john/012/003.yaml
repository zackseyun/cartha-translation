revisions:
- from: Ya mere, Meri weere otu litra[a] mmanụ otite dị oke ọnụ, nke e ji nad dị ọcha[b][c] mee, tee mmanụ ahụ n’ụkwụ Jizọs, jirikwa ntutu isi ya hichaa ụkwụ ya. Ísì ọma mmanụ otite ahụ wee juputa n’ụlọ ahụ.
  to: Meri wee were otu litra[a] mmanụ otite nad dị ọcha[b][c], nke dị oke ọnụ, tee mmanụ ahụ n’ụkwụ Jizọs, jirikwa ntutu isi ya hichaa ụkwụ ya. Ụlọ ahụ wee jupụta n’ísì ọma mmanụ otite ahụ.
  rationale: The revision preserves the draft’s sound terminology and its restraint regarding anointing, but corrects the final clause so that the house, not merely the space in which fragrance is present, is filled with the perfume’s fragrance. It also improves the wording of the lexical footnote without deciding the disputed meaning of πιστικῆς.
