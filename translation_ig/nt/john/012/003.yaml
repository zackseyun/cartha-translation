id: JHN.12.3
reference: John 12:3
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἡ οὖν ⸀Μαριὰμ λαβοῦσα λίτραν μύρου νάρδου πιστικῆς πολυτίμου ἤλειψεν τοὺς πόδας τοῦ Ἰησοῦ καὶ ἐξέμαξεν ταῖς θριξὶν αὐτῆς τοὺς πόδας αὐτοῦ· ἡ δὲ οἰκία ἐπληρώθη ἐκ τῆς ὀσμῆς τοῦ μύρου.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/003.yaml
  text: Then Mary took a litra of costly pure nard perfume[a], anointed Jesus's feet, and wiped his feet with her hair[c][b]. And the house was filled with the fragrance of the perfume.
translation:
  language: ig
  text: Meri wee were otu litra[a] mmanụ otite nad dị ọcha[b][c], nke dị oke ọnụ, tee mmanụ ahụ n’ụkwụ Jizọs, jirikwa ntutu isi ya hichaa ụkwụ ya. Ụlọ ahụ wee jupụta n’ísì ọma mmanụ otite ahụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Litra bụ ihe ọ̀tụ̀tụ̀ arọ ndị Rom, ihe dị ka ounce iri na abụọ, ya bụ ihe ruru otu ụzọ n’ụzọ atọ nke kilogram.
    reason: cultural_note
  - marker: b
    text: A pụkwara ịsụgharị ya “nad nke bụ ezigbo ya”; kpọmkwem ihe okwu Grik πιστικῆς pụtara ka ndị ọkà mmụta na-arụrịta ụka.
    reason: lexical_alternative
  - marker: c
    text: A na-akpọ nad ahụkwa “spikenard” n’asụsụ Bekee ọdịnala.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Ya mere
  rationale: Ọ na-ejikọta ihe Meri mere na akụkọ bu ya ụzọ; ‘Ya mere’ na-edobe njikọ ahụ n’Igbo doro anya.
- source_word: λαβοῦσα
  choice: weere
  rationale: A gbanwere participle a ka ọ bụrụ ngwaa n’usoro akụkọ, nke bụ ụzọ Igbo si ekwu ya n’enweghị isi ya efunahụ.
- source_word: λίτραν
  choice: otu litra
  rationale: E debere aha ihe ọ̀tụ̀tụ̀ ndị Rom iji ghara iji ihe ọ̀tụ̀tụ̀ nke oge a dochie ya n’ụzọ na-ezighị ezi; nkọwa dị n’ala peeji.
- source_word: μύρου
  choice: mmanụ otite
  rationale: Ọ na-egosi mmanụ na-esi ísì ụtọ e ji ete mmadụ; okwu a bụ nke a na-aghọta nke ọma n’Igbo ma dabara n’omume dị n’amaokwu ahụ.
- source_word: νάρδου
  choice: nad
  rationale: E ji ntụgharị-ụda debe aha ihe na-esi ísì ụtọ ahụ kpọmkwem kama ịgbanwe ya ka ọ bụrụ aha izugbe.
- source_word: πιστικῆς
  choice: dị ọcha
  rationale: Nke a na-egosipụta nghọta a na-ahụkarị nke okwu Grik a, ma a hapụrụ arụmụka gbasara kpọmkwem ihe ọ pụtara n’ala peeji.
- source_word: πολυτίμου
  choice: dị oke ọnụ
  rationale: Ọ na-egosi nnukwu ọnụ ahịa mmanụ ahụ n’asụsụ Igbo dị mfe ma bụrụkwa nke e ji ùgwù dee.
- source_word: ἤλειψεν
  choice: tee mmanụ ahụ
  rationale: Ọ na-akọwa omume nke itinye mmanụ otite ahụ n’ụkwụ Jizọs n’enweghị itinye nkọwa okpukpe ọzọ n’ime amaokwu ahụ.
- source_word: ἐξέμαξεν
  choice: hichaa
  rationale: Ọ na-egosi ihicha ma ọ bụ ihichapụ ihe ahụ, dịka ngwaa Grik si kwuo.
- source_word: ταῖς θριξὶν αὐτῆς
  choice: jiri ntutu isi ya
  rationale: Ọ na-edobe ntutu Meri dị ka ihe o ji hichaa ụkwụ ahụ, n’Igbo nkịtị ma doo anya.
- source_word: ἐπληρώθη
  choice: juputa
  rationale: Ọ na-egosi na ísì ahụ gbasara wee jupụta n’ụlọ ahụ.
- source_word: ὀσμῆς τοῦ μύρου
  choice: ísì ọma mmanụ otite ahụ
  rationale: ‘Ísì ọma’ na-egosi na ọ bụ isi na-atọ ụtọ sitere na mmanụ otite ahụ, ọ bụghị nanị isi ọ bụla.
theological_decisions:
- issue: Ịgụ ihe karịrị akarị n’omume ite mmanụ
  choice: A sụgharịrị ἤλειψεν dị ka ‘tee mmanụ ahụ’ iji kọwaa omume ahụ kpọmkwem.
  alternative: ‘tere ya mmanụ’ ma ọ bụ iji okwu pụrụ ịpụta emume echichi pụrụ iche
  rationale: Ihe a na-ekwu bụ ite Jizọs mmanụ otite. Nsụgharị ahụ na-ahapụ ihe omume ahụ ka ọ nwee ike ibu ihe atụ, ma ọ naghị amanye echiche banyere sakramenti, echichi eze, ma ọ bụ ozizi ọzọ amaokwu ahụ na-ekwughị kpọmkwem.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe ma nwee ùgwù. ‘Mmanụ otite’ na-akọwa μύρον n’ụzọ ndị na-agụ akwụkwọ nkịtị ga-aghọta, ebe ‘nad’ na-edobe aha ihe ahụ kpọmkwem. E tinyere akara ala peeji niile n’ebe okwu ha na-akọwa dị.
