id: JHN.12.28
reference: John 12:28
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: πάτερ, δόξασόν σου τὸ ὄνομα. ἦλθεν οὖν φωνὴ ἐκ τοῦ οὐρανοῦ· Καὶ ἐδόξασα καὶ πάλιν δοξάσω.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/028.yaml
  text: 'Father[a], glorify your name. Then a voice came from heaven: “I have glorified it, and I will glorify it again.”'
translation:
  language: ig
  text: Nna, mee ka aha gị dị ebube. Mgbe ahụ, otu olu sitere n’eluigwe bịara, sị, “Emeela m ka ọ dị ebube[a], m ga-emekwa ka ọ dị ebube ọzọ.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n’ụzọ na-agbasochi usoro okwu Grik anya karị, “Emere m ka ọ dị ebube, m ga-emekwa ka ọ dị ebube ọzọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πάτερ
  choice: Nna
  rationale: Ọ bụ okwu a na-eji akpọ Chineke okwu ozugbo. “Nna” bụ nsụgharị doro anya; etinyeghị “m” n’ihi na okwu Grik ahụ enweghị nnọchiaha nke na-egosi “nke m.”
- source_word: δόξασόν
  choice: mee ka ... dị ebube
  rationale: Nkebiokwu a na-egosipụta echiche δοξάζω nke ime ka ebube pụta ìhè. Ọ bụ Igbo nkịtị ma na-echekwa ịdị arọ nke okwu ebube n’Oziọma Jọn karịa naanị “sọpụrụ.”
- source_word: σου τὸ ὄνομα
  choice: aha gị
  rationale: Nke a na-echekwa okwu ihe atụ nke Akwụkwọ Nsọ, ebe “aha” na-anọchi anya onye Chineke bụ na otú o si kpughee onwe ya, n’emeghị ya nkọwa sara mbara.
- source_word: ἦλθεν οὖν
  choice: Mgbe ahụ ... si ... kwuo
  rationale: οὖν na-akwalite akụkọ gaa n’ihu, ya mere “Mgbe ahụ” dabara n’Igbo. E gosipụtara mbata olu ahụ site n’ikwu na o si n’eluigwe kwuo.
- source_word: φωνὴ
  choice: otu olu
  rationale: Okwu sochirinụ bụ okwu a na-ekwu nke ọma, ya mere “olu,” ọ bụghị naanị “ụda,” bụ ihe e bu n’obi.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: si n’eluigwe
  rationale: Nke a na-egosi ebe olu ahụ sitere na mmalite ya nke Chineke, ma ghara ime ka οὐρανός bụrụ naanị mbara elu.
- source_word: Καὶ ἐδόξασα καὶ πάλιν δοξάσω
  choice: Emeela m ka ọ dị ebube, m ga-emekwa ka ọ dị ebube ọzọ
  rationale: “Emeela m” na-egosi ihe e mezuru nke ka dị mkpa ugbu a; “ọ” na-alaghachi n’aha ahụ e kwuru ozugbo. “-kwa” na “ọzọ” na-echekwa njikọ καὶ ... καὶ πάλιν na nkwughachi nke omume ahụ.
theological_decisions:
- issue: Ihe nnọchiaha a na-aghọtaghị aha ya na nzaghachi Chineke na-ezo aka na ya
  choice: E tinyere “ọ” ka ọ laghachi n’“aha gị.”
  alternative: 'Ịhapụ ihe a na-eme ihe n’ahịrịokwu ahụ n’ekwughị ya: “Emeela m ka e nwee ebube, m ga-emekwa ka e nwee ebube ọzọ.”'
  rationale: Grik hapụrụ ihe a na-eme ihe n’ekwughị ya n’ihi na a pụrụ ịghọta ya site n’ihe e kwuru tupu ya; Igbo na-ada nke ọma ma doo anya mgbe “ọ” laghachiri n’aha ahụ, n’etinyeghị echiche ọhụrụ.
- issue: Otu e si asụgharị δοξάζω n’ebe echiche ebube dị mkpa n’Oziọma Jọn
  choice: mee ka ... dị ebube
  alternative: nye ... otuto; sọpụrụ
  rationale: Nhọrọ a na-echekwa njikọ dị n’etiti ebube Nna na nke Ọkpara n’akwụkwọ Jọn, ma ghara ime ka okwu ahụ bụrụ naanị ịsọpụrụ mmadụ ma ọ bụ ikwu okwu ọma banyere ya.
- issue: Uru oge nke ἐδόξασα, nke bụ aorist
  choice: Emeela m ka ọ dị ebube
  alternative: Emere m ka ọ dị ebube
  rationale: Ụdị a họọrọ na-egosi omume e mezuru nke nsonaazụ ya ka dị mkpa n’oge nzaghachi ahụ. Ihe odide ala peeji na-echekwa nsụgharị na-agbasochi ụdị aorist ahụ anya karị.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. E jighị okwu ụka pụrụ iche dochie okwu “ebube,” ma e chekwara ahịrịokwu dị mkpirikpi na ụda dị nsọ nke mkparịta ụka ahụ.
