  to: Nna, mee ka aha gị dị ebube. Mgbe ahụ, otu olu sitere n’eluigwe bịara, sị, “Emeela m ka ọ dị ebube[a], m ga-emekwa ka ọ dị ebube ọzọ.”
  rationale: Only the clause introducing the heavenly voice has been revised, restoring the sense of ἦλθεν while maintaining idiomatic Igbo. The existing rendering of the glory language, the implied object, and the aorist alternative footnote is retained.
