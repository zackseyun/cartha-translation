  to: Ọ bụrụkwa na onye ọ bụla anụ okwu m ma ọ naghị edebe ha[a], anaghị m ekpe ya ikpe[b]; n’ihi na abịaghị m ịkpe ụwa, kama ịzọpụta ụwa.
