  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἐάν τίς μου ἀκούσῃ τῶν ῥημάτων καὶ μὴ ⸀φυλάξῃ, ἐγὼ οὐ κρίνω αὐτόν, οὐ γὰρ ἦλθον ἵνα κρίνω τὸν κόσμον ἀλλ’ ἵνα σώσω τὸν κόσμον.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/047.yaml
  text: And if anyone hears my words and does not keep them[a], I do not judge him; for I did not come to judge the world[b], but to save the world.
translation:
  language: ig
  text: Ọ bụrụkwa na onye ọ bụla anụ okwu m ma ọ naghị edebe ha[a], anaghị m ekpe ya ikpe[b]; n’ihi na abịaghị m ịkpe ụwa, kama ịzọpụta ụwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, ‘ma ọ naghị erubere ha isi.’ Okwu Grik ahụ nwere ike ịpụta idebe, ichekwa, ma ọ bụ irube isi n’okwu ndị a.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, ‘anaghị m ama ya ikpe.’ N’ebe a, okwu Grik a sụgharịrị ‘ikpe’ nwekwara ike ibu echiche nke ikpe megide mmadụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐάν τίς
  choice: ọ bụrụ na onye ọ bụla
  rationale: Nke a na-egosi ọnọdụ gbasara onye ọ bụla n’enweghị ịkpa ókè; ọ bụkwa okwu Igbo doro anya ma kwekọọ n’ike izugbe nke Grik.
- source_word: ἀκούσῃ
  choice: anụ
  rationale: A họọrọ ‘anụ’ iji debe isi ihe okwu Grik pụtara, n’etinyeghị echiche siri ike karịa ya nke ige ntị nke ọma ma ọ bụ irube isi.
- source_word: τῶν ῥημάτων
  choice: okwu m
  rationale: ‘Okwu m’ bụ ụzọ Igbo dị mfe ma dị ùgwù isi kwuo okwu ndị Jizọs kwuru.
- source_word: φυλάξῃ
  choice: edebe ha
  rationale: ‘Idebe’ nwere ike ịgụnye ichekwa okwu n’obi na ime ya; ya mere, ọ naghị eme ka ihe okwu Grik pụtara dị warara ruo naanị ‘irube isi.’
- source_word: οὐ κρίνω αὐτόν
  choice: anaghị m ekpe ya ikpe
  rationale: ‘Ikpe ikpe’ na-edebe otu okwu ahụ e ji sụgharịa κρίνω n’ahịrịokwu na-esote, ma hapụkwa esemokwu nke echiche banyere ikpe n’Oziọma Jọn ka ọ dị.
- source_word: ἦλθον
  choice: abịaghị m
  rationale: Oge gara aga na-achịkọta nzube ọbịbịa Jizọs n’ụwa n’ụzọ dabara adaba n’Igbo.
- source_word: ἵνα κρίνω
  choice: ikpe
  rationale: Ụdị ngwaa a na-egosi nzube n’Igbo n’ụzọ dị nkenke ma dị ire.
- source_word: κόσμον
  choice: ụwa
  rationale: ‘Ụwa’ bụ okwu Igbo kwekọrọ na κόσμος ma na-edebe obosara echiche okwu ahụ nwere n’Oziọma Jọn.
- source_word: σώσω
  choice: ịzọpụta
  rationale: ‘Ịzọpụta’ na-eburu isi echiche nke nzọpụta ma ọ bụ nnapụta nke σῴζω nwere n’ebe a.
theological_decisions:
- issue: Ihe okwu Jizọs, ‘anaghị m ekpe ya ikpe,’ pụtara n’ihe gbasara okwu ikpe n’Oziọma Jọn
  choice: A sụgharịrị κρίνω dịka ‘ikpe ikpe’ n’ebe abụọ ahụ, na-akọwaghị ya dịka ikpe ọmụma naanị ma ọ bụ dịka ihe metụtara oge a naanị.
  alternative: ‘Anaghị m ama ya ikpe’ ma ọ bụ ‘anaghị m ekpe ya ikpe ugbu a.’
  rationale: Nke a na-edebe okwu nzube ozi Jizọs—nzọpụta kama ikpe—ma ghara idozi n’ime nsụgharị esemokwu ya na amaokwu ndị ọzọ gbasara ikpe.
- issue: Nnọchiaha αὐτόν nke na-alaghachi n’ebe τις nọ
  choice: ‘ya’
  alternative: ‘onye ahụ’
  rationale: N’Igbo, ‘ya’ bụ nnọchiaha otu onye nke anaghị egosi nwoke ma ọ bụ nwanyị; ọ na-egosipụta nke ọma ike izugbe nke ‘onye ọ bụla’ n’enweghị ịgbakwunye ihe Grik na-ekwughị.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị mfe ma dị ùgwù mee nsụgharị ahụ. E debere usoro echiche nke amaokwu Grik, mana e jiri akpaalaokwu Igbo dị ndụ dịka ‘ikpe ikpe’ na ‘ịzọpụta ụwa.’ Nnọchiaha ‘ya’ bụ nke nkịtị n’Igbo ma na-emetụta onye ọ bụla, nwoke ma ọ bụ nwanyị.
