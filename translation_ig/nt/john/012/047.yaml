review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately represents the conditional general case, hearing Jesus’ words, not keeping them, Jesus’ not judging that person, and the contrasting purposes of judging versus saving the world. However, the purpose infinitive in the second clause requires correction: “abịaghị m ikpe ụwa” is not idiomatic or grammatically complete for “I did not come to judge the world.”'
  naturalness: The wording is clear, modern Standard Igbo and maintains a suitably dignified biblical register. “Anaghị m ekpe ya ikpe” naturally renders the present-tense statement. Adding the infinitival prefix in “ịkpe ụwa” makes the final contrast fully natural and grammatical.
  terminology: “Okwu m,” “edebe ha,” “ikpe,” “ụwa,” and “ịzọpụta” are appropriate and preserve the lexical links and theological openness of the Greek. The footnote for “edebe ha” should describe the plural “okwu ndị a” more naturally.
  issues:
  - severity: medium
    issue: Missing infinitival prefix in the purpose clause
    rationale: The Greek ἦλθον ἵνα κρίνω expresses purpose, “I came to judge.” In Standard Igbo, “abịaghị m ikpe ụwa” should be “abịaghị m ịkpe ụwa.” Without ị-, the clause is grammatically deficient and less natural.
  - severity: low
    issue: Footnote a has an awkward singular reference
    rationale: The phrase “ime ihe okwu ahụ kwuru” refers awkwardly to a singular word although the antecedent is “okwu m”/“ha.” Revising it to refer to “okwu ndị a” improves clarity without changing the lexical note.
  revised_text: Ọ bụrụkwa na onye ọ bụla anụ okwu m ma ọ naghị edebe ha[a], anaghị m ekpe ya ikpe[b]; n’ihi na abịaghị m ịkpe ụwa, kama ịzọpụta ụwa.
