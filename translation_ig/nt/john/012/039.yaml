  text: διὰ τοῦτο οὐκ ἠδύναντο πιστεύειν ὅτι πάλιν εἶπεν Ἠσαΐας·
base_translation:
  language: en
  yaml_path: translation/nt/john/012/039.yaml
  text: 'For this reason they were not able to believe, because Isaiah said again:'
translation:
  language: ig
  text: 'N’ihi nke a, ha enweghị ike ikwere, n’ihi na Aịzaya kwukwara, sị:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: N’ihi nke a
  rationale: Nkebiokwu a na-egosi ihe kpatara ya ma jikọta amaokwu a kpọmkwem n’ihe e kwuru tupu ya.
- source_word: οὐκ ἠδύναντο
  choice: ha enweghị ike
  rationale: Nke a na-echekwa echiche nke enweghị ike dị n’okwu Grik, kama ime ka ọ bụrụ naanị na ha achọghị.
- source_word: πιστεύειν
  choice: ikwere
  rationale: Nke a bụ okwu Igbo doro anya ma kwekọọ n’otú Jọn si eji πιστεύω eme ihe ugboro ugboro.
- source_word: ὅτι
  choice: n’ihi na
  rationale: N’ebe a, okwu ahụ na-ewebata ihe mere ha enweghị ike ikwere, bụ́ okwu Aịzaya ọzọ na-esochi.
- source_word: πάλιν
  choice: kwara
  rationale: N’ime ‘kwukwara,’ ọ na-egosi na nke a bụ okwu ọzọ Aịzaya kwuru, mgbe e kwuchara ihe mbụ e hotara n’amaokwu bu ụzọ.
- source_word: εἶπεν
  choice: kwuru, sị
  rationale: Usoro a bụ ụzọ Igbo dị ndụ na nke ebumpụta ụwa isi webata okwu a ga-ehota.
- source_word: Ἠσαΐας
  choice: Aịzaya
  rationale: E ji ụdị aha a maara nke ọma n’Igbo dee aha onye amụma ahụ.
theological_decisions:
- issue: Ụdị enweghị ike ha nwere ikwere
  choice: ha enweghị ike ikwere
  alternative: ha achọghị ikwere
  rationale: Okwu Grik na-ekwu maka enweghị ike, ọ bụghị naanị enweghị ọchịchọ. Nsụgharị ahụ echekwala esemokwu nkà mmụta okpukpe dị n’amaokwu ahụ n’agbanyeghị na ọ kọwaghị kpọmkwem otú enweghị ike ahụ si arụ ọrụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe nghọta ma dịkwa ùgwù. ‘Kwukwara, sị:’ na-agụ nke ọma dị ka mmalite okwu a ga-ehota n’amaokwu na-esote.
