base_translation:
  language: en
  yaml_path: translation/nt/john/012/032.yaml
  text: And I[a], when I am lifted up from the earth[c][b], will draw all people to myself.
translation:
  language: ig
  text: Ma mụ onwe m, mgbe e buliri m elu site n’ụwa[a][b], aga m adọta mmadụ niile[c] n’ebe m nọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ọ bụrụ na e bulie m elu.” Grik ji usoro okwu ọnọdụ mee ihe, ma n’ebe a ọ na-ezo aka n’ọnwụ Jizọs nke na-abịaru nso dịka ihe ga-eme n’ezie.
    reason: alternative_reading
  - marker: b
    text: “E buliri m elu” nwekwara ike ịpụta “e buliri m n’ebube.” N’ụzọ dị otu a, Jọn na-ejikọta ibuli Jizọs n’obe na inye ya otuto.
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “niile.” Ụdị okwu Grik ahụ na-ezo aka n’ụmụ mmadụ. Amaokwu a n’onwe ya akọwaghị kpọmkwem otú “mmadụ niile” si metụta arụmụka ndị e mechara nwee banyere oke nzọpụta.
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀγὼ
  choice: Ma mụ onwe m
  rationale: Ngwakọta καί na ἐγώ jikọtara okwu a na ihe bu ya ụzọ ma mesie onye na-ekwu okwu ike. “Ma mụ onwe m” na-edobe njikọ ahụ na nkwusi ike ahụ n’Igbo dị mma.
- source_word: ἐὰν
  choice: mgbe
  rationale: Ọ bụ ezie na ἐάν na ngwaa subjunctive nwere ọdịdị ọnọdụ, n’akụkọ Jọn Jizọs na-ekwu banyere ọnwụ ya dị nso dịka ihe ga-eme. “Mgbe” na-egosipụta nke a n’Igbo nkịtị, ebe nkọwa ala peeji na-edobe ọdịdị ọnọdụ Grik.
- source_word: ὑψωθῶ
  choice: e buliri m elu
  rationale: Okwu ὑψόω n’ebe a na-ejikọta ibuli Jizọs n’obe na ibuli ya elu n’ebube. Nkebiokwu Igbo a nwere ike ibu echiche abụọ ahụ n’enweghị ịkagbu otu n’ime ha.
- source_word: ἐκ τῆς γῆς
  choice: site n’ụwa
  rationale: γῆ n’ebe a na-ezo aka n’ụwa ma ọ bụ ala e si bulie ya elu, ọ bụghị otu mpaghara ala kpọmkwem. “Site n’ụwa” dabara na nkọwa amaokwu na-esote banyere ụdị ọnwụ ya.
- source_word: πάντας
  choice: mmadụ niile
  rationale: Ụdị masculine plural a na-ezo aka n’ụmụ mmadụ n’ozuzu. Ịsị “mmadụ niile” na-eme ka ihe ngwaa ahụ metụtara doo anya n’Igbo, ma ọ naghị ekpebi arụmụka nkà mmụta okpukpe banyere otu a ga-esi ghọta oke okwu ahụ.
- source_word: ἑλκύσω
  choice: aga m adọta
  rationale: ἕλκω pụtara ịdọta ma ọ bụ ịkpọrọ ihe n’ebe onye nọ. “Adọta” na-edobe obosara echiche ahụ n’enweghị ịkọwapụta kpọmkwem otú ndọta ahụ si arụ ọrụ.
- source_word: πρὸς ἐμαυτόν
  choice: n’ebe mụ onwe m nọ
  rationale: ἐμαυτόν bụ nnọchiaha na-alaghachikwuru onye na-ekwu okwu ma nwee nkwusi ike. “N’ebe mụ onwe m nọ” na-edobe nkwusi ike ahụ n’Igbo dị mma karịa naanị “n’ebe m nọ.”
theological_decisions:
- issue: Oke πάντας n’ihe gbasara nzọpụta
  choice: mmadụ niile
  alternative: ha niile; ụdị mmadụ niile; onye ọ bụla
  rationale: Grik ahụ na-ezo aka n’ụmụ mmadụ, ọ bụghị n’ihe niile e kere eke. Nsụgharị a na-edobe obosara okwu Jizọs ma ọ naghị ekpebi ma ọ pụtara onye ọ bụla n’enweghị onye fọdụrụ, ma ọ bụ mmadụ sitere n’ụdị na ìgwè niile.
- issue: Echiche abụọ dị na ὑψωθῶ n’Akwụkwọ Jọn
  choice: e buliri m elu
  alternative: e buliri m n’ebube
  rationale: Jọn na-ejikọta ibuli Jizọs n’obe na ibuli ya elu n’ebube. “E buliri m elu” na-ahapụ echiche abụọ ahụ ka ha dị, ebe “e buliri m n’ebube” ga-eme ka naanị otu pụta ìhè.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta, dee amaokwu ahụ. Nhazi “Ma mụ onwe m” na “n’ebe mụ onwe m nọ” na-edobe nkwusi ike nke nnọchiaha Grik; “e buliri m elu” na-echekwa egwuregwu echiche Jọn banyere obe na ebube.
