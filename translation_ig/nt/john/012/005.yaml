revisions:
- from: “Gịnị mere na e reghị mmanụ otite a narị mkpụrụ ego denarị atọ, nye ndị ogbenye ego ya?”[a]
  to: “Gịnị mere na e reghị mmanụ otite a ka e nweta denarị narị atọ, ka e were ego ahụ nye ndị ogbenye?”[a]
  rationale: The revision retains the rhetorical question and all core source elements. “Ka e nweta denarị narị atọ” naturally states the sale price, and “ka e were ego ahụ nye ndị ogbenye” clearly expresses that the proceeds, rather than the ointment itself, would be given to the poor. This clarification follows the immediate sale-and-giving construction and does not introduce a doctrinal interpretation.
