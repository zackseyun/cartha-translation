  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Διὰ τί τοῦτο τὸ μύρον οὐκ ἐπράθη τριακοσίων δηναρίων καὶ ἐδόθη πτωχοῖς;
base_translation:
  language: en
  yaml_path: translation/nt/john/012/005.yaml
  text: Why was this perfume not sold for three hundred denarii and given to the poor?[a]
translation:
  language: ig
  text: “Gịnị mere na e reghị mmanụ otite a ka e nweta denarị narị atọ, ka e were ego ahụ nye ndị ogbenye?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Otu denarị bụ ụgwọ a na-akwụ onye ọrụ maka otu ụbọchị. Ya mere, denarị narị atọ dị ihe dịka ego a na-enweta n’ọrụ otu afọ, ma e wepụ ụbọchị ndị a na-adịghị arụ ọrụ.
    reason: cultural_note
lexical_decisions:
- source_word: Διὰ τί
  choice: Gịnị mere
  rationale: Ajụjụ a bụ ụzọ Igbo nkịtị si ajụ ‘n’ihi gịnị?’ ma na-edobe ike ajụjụ ahụ.
- source_word: μύρον
  choice: mmanụ otite
  rationale: Ọ na-ezo aka n’ihe na-esi ísì ụtọ dị oké ọnụ ahịa a na-ete mmadụ; ‘mmanụ otite’ bụ okwu Baịbụl Igbo doro anya ma ghara ime ka ọ bụrụ naanị senti nke oge a.
- source_word: οὐκ ἐπράθη
  choice: e reghị
  rationale: Na-edobe olu nnara nke ngwaa Grik na ụdị ajụjụ mkpesa ahụ.
- source_word: τριακοσίων δηναρίων
  choice: narị mkpụrụ ego denarị atọ
  rationale: Genitive ahụ na-egosi ọnụ ahịa. Idebe ‘denarị’ na-echekwa ụdị ego akụkọ ihe mere eme ahụ, ebe nkọwa ala peeji na-akọ uru ya.
- source_word: καὶ ἐδόθη πτωχοῖς
  choice: nye ndị ogbenye ego ya
  rationale: N’usoro Grik, ihe e nyere ndị ogbenye nwere ike bụrụ ego e nwetara n’ire ya. Igbo chọrọ ka ihe a na-enye doo anya; ‘ego ya’ na-egosipụta ihe ọnọdụ okwu ahụ pụtara n’enweghị ịgbakwunye nkọwa ụka.
theological_decisions:
- issue: Ihe a ga-enye ndị ogbenye n’okwu ἐδόθη
  choice: ego ya
  alternative: nye ya ndị ogbenye
  rationale: Ọnọdụ okwu ahụ na-egosi na ego e nwetara n’ire mmanụ ahụ ka a ga-enye. Nhọrọ a na-eme Igbo ka ọ bụrụ ihe doro anya ma ghara ịpụta na a ga-enye ndị ogbenye mmanụ ahụ n’onwe ya.
translation_notes:
  register: Asụsụ Igbo izugbe, nke oge a ma dị ùgwù. A họọrọ usoro ajụjụ dị mfe nghọta; e debere aha ego oge ahụ ma kọwaa ya na nkọwa ala peeji.
