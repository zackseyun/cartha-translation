  text: εἶπεν δὲ τοῦτο οὐχ ὅτι περὶ τῶν πτωχῶν ἔμελεν αὐτῷ, ἀλλ’ ὅτι κλέπτης ἦν καὶ τὸ γλωσσόκομον ⸀ἔχων τὰ βαλλόμενα ἐβάσταζεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/006.yaml
  text: He said this not because he cared about the poor[a], but because he was a thief, and having the money box[b], he used to take what was put into it.
translation:
  language: ig
  text: Ọ kwuru nke a, ọ bụghị n’ihi na ọ na-eche banyere ndị ogbenye, kama n’ihi na ọ bụ onye ohi, ma ebe ọ bụ ya ji igbe ego ahụ[a], ọ na-ewere ihe ndị a na-etinye n’ime ya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “akpa ego.” Okwu Grik ahụ nwere ike izo aka n’ihe e ji edebe ego, ma ọ̀ bụ igbe ma ọ bụ akpa.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsị, “ọ na-ebupụ ihe ndị a na-etinye n’ime ya,” ma ọ bụ, “ọ na-ezu ohi n’ihe ndị a na-etinye n’ime ya.” Okwu Grik a na-apụtakarị “ibu” ma ọ bụ “ebupụ”; ma n’ebe a, okwu ahụ bụ “ọ bụ onye ohi” na-egosi na ọ na-ewere ihe ahụ n’ụzọ na-ezighị ezi.
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπεν δὲ τοῦτο
  choice: O kwuru nke a
  rationale: A tụgharịrị δέ dị ka njikọ dị nro nke a na-ekwesịghị ime ka ọ bụrụ nnukwu mmegide; “O kwuru nke a” bụ Igbo doro anya ma kwekọọ kpọmkwem n’isi okwu ahụ.
- source_word: οὐχ ὅτι περὶ τῶν πτωχῶν ἔμελεν αὐτῷ
  choice: ọ bụghị n’ihi na ọ na-eche banyere ndị ogbenye
  rationale: Nkebiokwu a na-agọnahụ ihe kpatara okwu ahụ. “Na-eche banyere” na-egosipụta μέλει na περί + genitive n’ụzọ Igbo nkịtị.
- source_word: ἀλλ’ ὅτι κλέπτης ἦν
  choice: kama ọ bụ n’ihi na ọ bụ onye ohi
  rationale: “Kama ọ bụ n’ihi na” na-edobe nguzozi dị n’etiti οὐχ ὅτι na ἀλλ’ ὅτι; “onye ohi” bụ nkọwa ziri ezi nke κλέπτης.
- source_word: τὸ γλωσσόκομον ἔχων
  choice: Ebe ọ bụ ya ji igbe ego ahụ
  rationale: “Igbe ego” na-egosi akpa ma ọ bụ igbe e ji edebe ego, ebe “ọ bụ ya ji” na-egosi na Judas nwere ya ma na-elekọta ya, dịka participle ἔχων si dị n’ọnọdụ a.
- source_word: τὰ βαλλόμενα
  choice: ihe ndị a na-etinye n’ime ya
  rationale: A na-egosipụta passive participle ahụ n’ụzọ Igbo nkịtị; “n’ime ya” mere ebe a na-etinye ihe ndị ahụ ka o doo anya.
- source_word: ἐβάσταζεν
  choice: ọ na-ewere
  rationale: Ụdị “ọ na-” na-egosipụta omume na-eme ugboro ugboro nke imperfect. “Ewere” na-ahapụ ịdị obosara nke βαστάζω, ebe okwu bu ya ụzọ, “onye ohi,” na-egosi na ọ na-ewepụ ihe ahụ n’ụzọ na-ezighị ezi.
theological_decisions:
- issue: Ihe ἐβάσταζεν pụtara n’ihe gbasara izu ohi Judas
  choice: ọ na-ewere ihe ndị a na-etinye n’ime ya
  alternative: ọ na-eburu ihe ndị a na-etinye n’ime ya; ọ na-ezu ihe ndị a na-etinye n’ime ya
  rationale: Nkọwa ahụ na Judas bụ “onye ohi” na-akwado nghọta na ọ na-ewere ihe ahụ maka onwe ya, ọ bụghị naanị na ọ na-ebu ya. Ma “na-ewere” anaghị eme ka okwu Grik ahụ bụrụ “na-ezu” n’onwe ya, ya mere ọ na-edobe ntakịrị oghere lexical dị na βαστάζω.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ “ndị ogbenye,” “onye ohi,” na “igbe ego” dịka okwu ndị nkịtị na ndị na-agụ akwụkwọ ga-aghọta. E debere akara nkọwa [a] n’akụkụ “igbe ego” na [b] n’akụkụ omume “na-ewere,” ka ha kwekọọ n’ihe nkọwa ala peeji ọ bụla na-akọwa.
