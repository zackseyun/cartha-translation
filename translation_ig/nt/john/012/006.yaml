revisions:
- from: O kwuru nke a, ọ bụghị n’ihi na ọ na-eche banyere ndị ogbenye, kama ọ bụ n’ihi na ọ bụ onye ohi. Ebe ọ bụ ya ji igbe ego ahụ[a], ọ na-ewere ihe ndị a na-etinye n’ime ya[b].
  to: Ọ kwuru nke a, ọ bụghị n’ihi na ọ na-eche banyere ndị ogbenye, kama n’ihi na ọ bụ onye ohi, ma ebe ọ bụ ya ji igbe ego ahụ[a], ọ na-ewere ihe ndị a na-etinye n’ime ya[b].
  rationale: The revision retains the source’s ongoing accusation and lexical restraint in the main text (“ọ na-ewere”), while connecting the possession of the money container as an attendant circumstance. It also replaces an unsuitable footnote alternative with natural Standard Igbo and preserves the contextual alternative of theft without imposing it as the only lexical meaning of βαστάζω.
