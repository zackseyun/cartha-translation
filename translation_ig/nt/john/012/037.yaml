id: JHN.12.37
reference: John 12:37
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τοσαῦτα δὲ αὐτοῦ σημεῖα πεποιηκότος ἔμπροσθεν αὐτῶν οὐκ ἐπίστευον εἰς αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/john/012/037.yaml
  text: Although he had done so many signs before them[a], they did not believe in him[b],
translation:
  language: ig
  text: N’agbanyeghị na o mere ọtụtụ ihe ịrịba ama otú ahụ n’ihu ha, ha ka na-ekweghị na ya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “ha ekweghị na ya.” Ngwaa Grik dị n’ụdị imperfect, nke nwere ike igosi ekweghị-ekwe na-aga n’ihu ma ọ bụ na-eme ugboro ugboro.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοσαῦτα
  choice: ọtụtụ … otú ahụ
  rationale: Usoro a na-egosi nnukwu ọnụọgụ ihe ịrịba ama ahụ n’ụzọ Igbo dị mfe ma bụrụkwa nke e ji eme ihe.
- source_word: δὲ
  choice: N’agbanyeghị na
  rationale: A tụgharịrị njikọ ọdịiche δὲ na ike nkwenye dị n’ahịrịokwu ahụ site n’usoro concessive a, ka o doo anya na ekweghị-ekwe ahụ gara n’ihu n’agbanyeghị ihe ịrịba ama ndị ahụ.
- source_word: σημεῖα
  choice: ihe ịrịba ama
  rationale: N’Oziọma Jọn, okwu a na-egosi ọrụ ebube nke na-atụ aka n’ihe ọ na-ekpughe banyere Jizọs; ‘ihe ịrịba ama’ na-echekwa echiche ahụ karịa naanị ‘ọrụ ebube.’
- source_word: πεποιηκότος
  choice: o mere
  rationale: Oge gara aga n’usoro ‘N’agbanyeghị na’ na-egosi na omume ndị ahụ ewerela ọnọdụ tupu ekweghị-ekwe a kọwara, ma mmetụta ha ka dị mkpa.
- source_word: ἔμπροσθεν αὐτῶν
  choice: n’ihu ha
  rationale: Nke a na-egosi na o mere ihe ịrịba ama ndị ahụ ebe ha pụrụ ịhụ ha, n’ihu ọha, n’enweghị mgbakwunye nkọwa na-adịghị na Grik.
- source_word: οὐκ ἐπίστευον
  choice: ha ka na-ekweghị
  rationale: ‘Ka na-’ na-egosi ekweghị-ekwe na-aga n’ihu, kwekọọ na imperfect Grik, ma ọ naghị agbakwụnye echiche siri ike na ha kpachaara anya jụ ikwere.
- source_word: εἰς αὐτόν
  choice: na ya
  rationale: ‘Ikwere na ya’ bụ usoro Igbo kwesịrị ekwesị maka πιστεύω εἰς, na-egosi ntụkwasị obi e tinyere n’ebe Jizọs nọ.
theological_decisions:
- issue: Otu e si egosi ekweghị-ekwe na-aga n’ihu nke imperfect Grik
  choice: ha ka na-ekweghị na ya
  alternative: ha ekweghị na ya
  rationale: Nhọrọ bụ isi na-echekwa akụkụ omume na-aga n’ihu ma ọ bụ na-eme ugboro ugboro, ma ọ naghị ekwu karịa ihe ederede ahụ kwuru banyere uche ha.
- issue: Mmekọrịta dị n’etiti ọtụtụ ihe ịrịba ama na ekweghị-ekwe
  choice: N’agbanyeghị na … ha ka na-ekweghị
  alternative: Ma … ha ekweghị
  rationale: 'Usoro a na-echekwa esemokwu dị n’ederede: ihe ịrịba ama pụtara ìhè dị ọtụtụ, ma okwukwe esoghị ha; ọ naghị akọwa ihe kpatara ekweghị-ekwe ahụ.'
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ ‘ihe ịrịba ama’ iji chekwaa okwu pụrụ iche Jọn ji eme ihe; a zere okwu ụka pụrụ iche ma ọ bụ nkọwa na-ekpebi ihe kpatara ekweghị-ekwe ahụ.
