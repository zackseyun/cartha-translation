id: JHN.12.38
reference: John 12:38
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἵνα ὁ λόγος Ἠσαΐου τοῦ προφήτου πληρωθῇ ὃν εἶπεν· Κύριε, τίς ἐπίστευσεν τῇ ἀκοῇ ἡμῶν; καὶ ὁ βραχίων κυρίου τίνι ἀπεκαλύφθη;
base_translation:
  language: en
  yaml_path: translation/nt/john/012/038.yaml
  text: 'so that the word of Isaiah the prophet might be fulfilled[a], which he said: “Lord, who has believed our report? And to whom has the arm of the Lord been revealed?”'
translation:
  language: ig
  text: 'ka okwu Aịzaya onye amụma wee mezuo, dịka o kwuru sị: “Onyenwe anyị, ònye kweere ozi anyị[a]? Ònyekwa ka e kpugheere ogwe aka Onyenwe anyị?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ihe anyị nụrụ” ma ọ bụ “ozi anyị kwusara.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: ka ... wee
  rationale: Usoro a bụ ụzọ Igbo si egosipụta njikọ nke nzube ma ọ bụ ihe si na ya pụta, n’enweghị ikpebi nke Jọn bu n’obi n’ebe a.
- source_word: ὁ λόγος Ἠσαΐου τοῦ προφήτου
  choice: okwu Aịzaya onye amụma kwuru
  rationale: Nke a na-edobe echiche nke λόγος dị ka okwu onye amụma kwuru ma mee ka ahịrịokwu ahụ daa nke ọma n’Igbo.
- source_word: πληρωθῇ
  choice: wee mezuo
  rationale: Nke a na-egosipụta n'ụzọ ebumpụta ụwa na okwu Akwụkwọ Nsọ ahụ bịara ná mmezu, ma na-edobe njikọ ya na ἵνα.
- source_word: Κύριε
  choice: Onyenwe anyị
  rationale: Ọ bụ okwu a na-ejikarị asụ κύριος mgbe a na-akpọ Chineke okwu, ọ dịkwa mma n’ebe e hotara Aịzaya.
- source_word: ἐπίστευσεν
  choice: kweere
  rationale: N’ajụjụ nkwuwa okwu a, ụdị a bụ Igbo doro anya ma na-egosipụta ikwere ozi a kpọsara.
- source_word: τῇ ἀκοῇ ἡμῶν
  choice: ozi anyị
  rationale: ἀκοή nwere ike ịpụta ihe a nụrụ ma ọ bụ ozi a kpọsara. “Ozi anyị” na-egosipụta ihe a kpọsara nke ndị mmadụ kwesịrị ikwere, ebe e debere nhọrọ ndị ọzọ n’ala ala peeji.
- source_word: ὁ βραχίων κυρίου
  choice: ogwe aka Onyenwe anyị
  rationale: Nke a na-edobe ihe atụ Akwụkwọ Nsọ banyere ike na omume Chineke kama ịkọwa ya n’ụzọ ga-ewepụ ihe atụ ahụ.
- source_word: ἀπεκαλύφθη
  choice: e kpugheere
  rationale: Nke a na-edobe olu nnara nke Grik ma gosipụta na e mere ka mmadụ hụ ma ọ bụ mata ogwe aka Onyenwe anyị.
theological_decisions:
- issue: Asụsụ mmezu na nzube ma ọ bụ ihe si na ya pụta
  choice: ka ... wee mezuo
  alternative: nke mere ka ... mezuo
  rationale: ἵνα nwere ike ibu echiche nke nzube, ihe si na ya pụta, ma ọ bụ ha abụọ n’ụzọ Jọn si ede. Nsụgharị a anaghị edozi esemokwu ahụ n’otu akụkụ.
- issue: Ihe ἀκοή pụtara n’okwu e hotara n’Aịzaya
  choice: ozi anyị
  alternative: ihe anyị nụrụ; ozi anyị kwusara
  rationale: Okwu Grik ahụ nwere ike izo aka n’ihe a nụrụ ma ọ bụ n’ozi a kpọsara. Isi ederede jiri “ozi anyị,” ma ihe odide ala peeji na-echekwa nghọta ndị ọzọ ziri ezi.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E debere ajụjụ nkwuwa okwu abụọ ahụ na ihe atụ “ogwe aka Onyenwe anyị,” ma zere ịgbakwunye nkọwa ozizi na-adịghị n’ederede Grik.
