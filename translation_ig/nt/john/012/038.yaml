  to: 'ka okwu Aịzaya onye amụma wee mezuo, dịka o kwuru sị: “Onyenwe anyị, ònye kweere ozi anyị[a]? Ònyekwa ka e kpugheere ogwe aka Onyenwe anyị?”'
  rationale: The revision corrects the quotation-introduction syntax so that Isaiah, rather than “okwu,” is clearly the one who spoke the cited words. All other wording is retained because it faithfully and naturally conveys the Greek, including the unresolved purpose/result nuance of ἵνα and the passive “was/has been revealed.”
