    text: Ma ọ bụ, “ihe anyị nụrụ” ma ọ bụ “ozi anyị kwusara.”
    reason: lexical_alternative
  revision_rationale: The revision corrects the quotation-introduction syntax so that Isaiah, rather than “okwu,” is clearly the one who spoke the cited words. All other wording is retained because it faithfully and naturally conveys the Greek, including the unresolved purpose/result nuance of ἵνα and the passive “was/has been revealed.”
