id: JHN.12.24
reference: John 12:24
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀμὴν ἀμὴν λέγω ὑμῖν, ἐὰν μὴ ὁ κόκκος τοῦ σίτου πεσὼν εἰς τὴν γῆν ἀποθάνῃ, αὐτὸς μόνος μένει· ἐὰν δὲ ἀποθάνῃ, πολὺν καρπὸν φέρει.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/024.yaml
  text: Truly[a], truly, I say to you, unless the grain of wheat falls into the ground and dies, it remains by itself; but if it dies[b], it bears much fruit.
translation:
  language: ig
  text: N’ezie, n’ezie, ana m agwa unu, ọ gwụla ma mkpụrụ ọka wit daa n’ala wee nwụọ, ọ na-anọgide naanị ya[a]; ma ọ nwụọ[b], ọ na-amị ọtụtụ mkpụrụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ọ na-anọ naanị ya.”
    reason: lexical_alternative
  - marker: b
    text: Ihe atụ a bụ banyere mkpụrụ ọka nke ga-anwụ n’ala ka o wee mịa mkpụrụ. N’ihe ndị gbara amaokwu a gburugburu, Jizọs na-etinye ụkpụrụ a n’ọnwụ nke ya nakwa na ndị na-eso ya.
    reason: cross_reference
lexical_decisions:
- source_word: ἀμὴν ἀμὴν
  choice: N’ezie, n’ezie
  rationale: Nke a na-echekwa nkwugharị ahụ na ike okwu nkwenye pụrụ iche Jọn ji eme ihe, ma na-ada ka Igbo a na-aghọta nke ọma.
- source_word: λέγω ὑμῖν
  choice: ana m agwa unu
  rationale: Ọ na-egosipụta okwu a gwara ọtụtụ mmadụ ozugbo ma bụrụkwa ụzọ e si ekwu ya n’Igbo nke oge a.
- source_word: ἐὰν μὴ
  choice: ọ bụrụ na ... adịghị
  rationale: Usoro a na-enye echiche ọnọdụ nke ‘ọ gwụla ma’ n’Igbo eke, ma kwe ka ngwaa ndị na-esochi ya jikọta nke ọma.
- source_word: ὁ κόκκος τοῦ σίτου
  choice: mkpụrụ ọka wiiti
  rationale: κόκκος bụ otu mkpụrụ ọka; ‘mkpụrụ ọka wiiti’ na-echekwa ihe atụ ọrụ ugbo n’enweghị ịkọwa ya karịa ihe odide ahụ kwuru.
- source_word: πεσὼν εἰς τὴν γῆν
  choice: dara n’ala
  rationale: ‘N’ala’ dabara n’ọnọdụ ịkụ mkpụrụ, ebe usoro ngwaa ahụ na-echekwa na mkpụrụ ahụ buru ụzọ daa n’ala tupu ọ nwụọ.
- source_word: ἀποθάνῃ
  choice: nwụọ
  rationale: A sụgharịrị aorist subjunctive dị n’ahịrị ọnọdụ ahụ n’ụzọ ọnọdụ Igbo si arụ ọrụ n’enweghị itinye echiche ọzọ.
- source_word: αὐτὸς μόνος μένει
  choice: ọ na-anọ naanị ya
  rationale: Nke a na-echekwa ma echiche ịnọgide dị (μένει) ma echiche ịnọ naanị ya (μόνος), n’enweghị ime ka okwu ahụ bụrụ banyere mwute nke ịnọ naanị mmadụ.
- source_word: ἐὰν δὲ ἀποθάνῃ
  choice: ma ọ bụrụ na ọ nwụọ
  rationale: ‘Ma’ na-egosipụta ọdịiche δέ mere n’etiti ọnọdụ abụọ ahụ.
- source_word: πολὺν καρπὸν φέρει
  choice: ọ na-amị ọtụtụ mkpụrụ
  rationale: ‘Ịmị mkpụrụ’ bụ okwu Igbo kwekọrọ n’ihe ọkụkụ na-amị; ọ na-echekwa ihe atụ καρπός kama ịgbanwe ya ka ọ bụrụ owuwe ihe ubi.
theological_decisions:
- issue: Ihe atụ ọrụ ugbo nke na-atụ aka n’ọnwụ Jizọs na iso ụzọ ya
  choice: E debere ihe atụ mkpụrụ ọka ahụ kpọmkwem n’ahịrị bụ isi, n’akọwaghị onye ọ na-anọchi anya n’ime ahịrị ahụ.
  alternative: Ịgbasa ahịrị ahụ ka o kwuo hoo haa na Jizọs na-ekwu maka ọnwụ nke ya na ndụ ọ ga-ewetara ọtụtụ mmadụ.
  rationale: Ihe gbara amaokwu ahụ gburugburu na-egosi na Jizọs na-etinye ụkpụrụ a n’ọnwụ nke ya, ma amaokwu ahụ n’onwe ya na-ekwu ya dị ka ihe atụ. Idebe ihe atụ ahụ na-echekwa nghọtahie na omimi nke ihe odide ahụ n’enweghị itinye ozizi n’ahịrị bụ isi.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. E chekwara nkwugharị ‘N’ezie, n’ezie,’ usoro okwu ọnọdụ, na ihe atụ ọrụ ugbo. E doziri akara nkọwa [a] ka ọ dị n’ebe okwu αὐτὸς μόνος μένει nọ, n’ihi na ọ bụ ya ka nkọwa okwu ọzọ ahụ metụtara.
