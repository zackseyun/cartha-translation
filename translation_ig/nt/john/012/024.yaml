review_pass:
  verdict: revise
  source_fidelity: The draft retains the doubled solemn affirmation, conditional agricultural image, contrast, and fruit-bearing result. However, its first condition uses the negative form “adaghị” after “ọ bụrụ na,” which does not faithfully express Greek ἐὰν μὴ (“unless”) in this construction and can produce an unintended sense. “Ọ gwụla ma ... daa n’ala wee nwụọ” clearly preserves the required positive condition and sequence.
  naturalness: The revised wording is idiomatic Standard Igbo. “Ọ gwụla ma” is a natural direct equivalent for “unless,” and “daa n’ala wee nwụọ” naturally presents the falling followed by dying. “Ọ na-anọgide naanị ya” reflects both remaining and being alone.
  terminology: “Mkpụrụ ọka wit” is an understandable modern Standard Igbo expression for a grain of wheat. “Ịmị ọtụtụ mkpụrụ” appropriately retains the agricultural metaphor of bearing much fruit. The footnote is adjusted for smoother phrasing without making the contextual application part of the verse itself.
  issues:
  - severity: medium
    issue: The initial conditional clause says “ọ bụrụ na ... adịghị/adaghị” rather than directly expressing “unless” with the seed falling and dying.
    rationale: 'The Greek condition is ἐὰν μὴ followed by positive actions: unless the grain falls into the ground and dies. The draft’s negative verb form risks changing the conditional relationship. “Ọ gwụla ma ... daa n’ala wee nwụọ” preserves the source sense accurately.'
  - severity: low
    issue: The lexical footnote’s alternative overlaps awkwardly with the draft’s main wording.
    rationale: With “na-anọgide naanị ya” as the main rendering, “na-anọ naanị ya” functions clearly as the lexical alternative for μένει.
  revised_text: N’ezie, n’ezie, ana m agwa unu, ọ gwụla ma mkpụrụ ọka wit daa n’ala wee nwụọ, ọ na-anọgide naanị ya[a]; ma ọ nwụọ[b], ọ na-amị ọtụtụ mkpụrụ.
