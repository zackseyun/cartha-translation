revisions:
- from: N’ezie, n’ezie, ana m agwa unu, ọ bụrụ na mkpụrụ ọka wiiti adaghị n’ala wee nwụọ, ọ na-anọ naanị ya[a]; ma ọ bụrụ na ọ nwụọ[b], ọ na-amị ọtụtụ mkpụrụ.
  to: N’ezie, n’ezie, ana m agwa unu, ọ gwụla ma mkpụrụ ọka wit daa n’ala wee nwụọ, ọ na-anọgide naanị ya[a]; ma ọ nwụọ[b], ọ na-amị ọtụtụ mkpụrụ.
  rationale: The revision corrects the conditional syntax so that it means “unless the grain of wheat falls into the ground and dies,” rather than using a negative conditional verb. It preserves the sequence of falling and dying, the grain’s remaining alone if it does not die, and the unexpanded agricultural metaphor. The footnotes retain their anchors and purposes while using clearer Standard Igbo.
  reviewer_model: gpt-5.6-terra
