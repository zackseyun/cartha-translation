revisions:
- from: Ya mere, ìgwè mmadụ ahụ ha na ya nọ mgbe ọ kpọpụtara Lazarọs n’ili ma kpọlite ya n’ọnwụ nọ na-agba akaebe[a].
  to: Ya mere, ìgwè mmadụ ahụ so ya nọ mgbe ọ kpọrọ Lazarọs ka o si n’ili pụta, ma kpọlite ya n’ọnwụ, nọ na-agba akaebe[a].
  rationale: The revision retains the narrative connection, the ongoing witness-bearing denoted by the imperfect, and the resurrection claim. It corrects the principal source-fidelity issue by rendering Jesus’ action as calling Lazarus and expressing Lazarus’ coming out of the tomb without implying that Jesus physically brought him out.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T06:25:15Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly identifies the crowd as the witnesses and preserves the imperfect sense of ἐμαρτύρει with a progressive construction. However, “ọ kpọpụtara Lazarọs n’ili” can mean that Jesus brought Lazarus out of the tomb, rather than that he called Lazarus to come out. The Greek specifies the act of calling, with Lazarus’ emergence from the tomb expressed as its result/context. The revision makes this distinction explicit.
  naturalness: “Ìgwè mmadụ ahụ so ya nọ” is a natural Standard Igbo way to identify the crowd that was with him. “kpọrọ Lazarọs ka o si n’ili pụta” is clear, idiomatic, and avoids assigning the physical act of bringing Lazarus out to Jesus.
  terminology: “na-agba akaebe” appropriately retains Johannine witness terminology, while the footnote supplies “na-agba ama” as a natural lexical alternative. “kpọlitere ya n’ọnwụ” naturally communicates raising Lazarus from the dead without added doctrinal explanation. “Lazarọs” and “ili” are suitable Standard Igbo forms.
  issues:
  - severity: medium
    issue: The wording “ọ kpọpụtara Lazarọs n’ili” conflates calling Lazarus with bringing him out of the tomb.
    rationale: ἐφώνησεν means “called,” not “brought out.” Although the Greek associates the calling with Lazarus’ being in/out of the tomb, the translation should not obscure the stated action or make Jesus’ action sound like physically fetching Lazarus.
  revised_text: Ya mere, ìgwè mmadụ ahụ so ya nọ mgbe ọ kpọrọ Lazarọs ka o si n’ili pụta, ma kpọlite ya n’ọnwụ, nọ na-agba akaebe[a].
  revised_footnotes:
  - marker: a
    text: A pụkwara ịsị, “nọ na-agba ama”; ngwaa Grik a nwere ike ịpụta inye akaebe ma ọ bụ ịgba ama, bụ isiokwu na-apụta ugboro ugboro n’akwụkwọ Jọn.
    reason: lexical_alternative
  revision_rationale: The revision retains the narrative connection, the ongoing witness-bearing denoted by the imperfect, and the resurrection claim. It corrects the principal source-fidelity issue by rendering Jesus’ action as calling Lazarus and expressing Lazarus’ coming out of the tomb without implying that Jesus physically brought him out.
