  text: ἐμαρτύρει οὖν ὁ ὄχλος ὁ ὢν μετ’ αὐτοῦ ὅτε τὸν Λάζαρον ἐφώνησεν ἐκ τοῦ μνημείου καὶ ἤγειρεν αὐτὸν ἐκ νεκρῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/017.yaml
  text: So the crowd that had been with him when he called Lazarus out of the tomb and raised him from the dead was bearing witness[a].
translation:
  language: ig
  text: Ya mere, ìgwè mmadụ ahụ so ya nọ mgbe ọ kpọrọ Lazarọs ka o si n’ili pụta, ma kpọlite ya n’ọnwụ, nọ na-agba akaebe[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “nọ na-agba ama”; ngwaa Grik a nwere ike ịpụta inye akaebe ma ọ bụ ịgba ama, bụ isiokwu na-apụta ugboro ugboro n’akwụkwọ Jọn.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμαρτύρει
  choice: nọ na-agba akaebe
  rationale: Oge imperfect na-egosi omume na-aga n’ihu ma ọ bụ a na-eme ugboro ugboro; ‘ịgba akaebe’ na-echekwa isiokwu akaebe nke Jọn ji okwu a akọwa.
- source_word: οὖν
  choice: Ya mere
  rationale: Na-egosi njikọ akụkọ na ihe e kwuru tupu ya, n’asụsụ Igbo doro anya ma dị ùgwù.
- source_word: ὁ ὄχλος
  choice: ìgwè mmadụ ahụ
  rationale: Na-akọwa ọtụtụ ndị gbakọtara ọnụ, ma definite article na-egosi ìgwè a kapịrị ọnụ.
- source_word: ὁ ὢν μετ’ αὐτοῦ
  choice: ha na ya nọ
  rationale: Na-eme ka o doo anya na ìgwè ahụ nọnyere Jizọs n’oge ihe ahụ mere, n’usoro okwu Igbo e ji eme ihe ugbu a.
- source_word: ὅτε
  choice: mgbe
  rationale: Njikọ oge nkịtị nke na-ewebata ihe ìgwè mmadụ ahụ hụrụ.
- source_word: ἐφώνησεν ... ἐκ τοῦ μνημείου
  choice: ọ kpọpụtara Lazarọs n’ili
  rationale: ‘Kpọpụtara’ na-ejikọta omume ịkpọ Lazarọs na mmegharị ya isi n’ili pụta, dịka ἐκ si gosi, n’Igbo ekeghị eke.
- source_word: ἤγειρεν αὐτὸν ἐκ νεκρῶν
  choice: kpọlite ya n’ọnwụ
  rationale: Nke a bụ ụzọ Igbo kwụ ọtọ e si kwuo na e mere ka onye nwụrụ anwụ dị ndụ ọzọ; ọ naghị eme ka nkwupụta ọrụ ebube ahụ dị nro.
theological_decisions:
- issue: Otu e si kọwaa mbilite Lazarọs
  choice: kpọlite ya n’ọnwụ
  alternative: mee ka o si n’etiti ndị nwụrụ anwụ bilie
  rationale: Nhọrọ ahụ na-echekwa nkwupụta Grik na Jizọs kpọlitere Lazarọs, n’etinyeghị nkọwa ozizi ọzọ.
translation_notes:
  register: Standard Igbo nke oge a, doro anya ma dị ùgwù. E ji ‘Lazarọs’ dee aha ahụ dịka mkpọpụta Igbo a na-ahụkarị; e zere okwu ụka pụrụ iche. Akara nkọwa ala peeji [a] dị n’ahịrị isi.
