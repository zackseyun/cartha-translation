  text: Τῇ ἐπαύριον ⸀ὁ ὄχλος πολὺς ὁ ἐλθὼν εἰς τὴν ἑορτήν, ἀκούσαντες ὅτι ἔρχεται ⸁ὁ Ἰησοῦς εἰς Ἱεροσόλυμα,
base_translation:
  language: en
  yaml_path: translation/nt/john/012/012.yaml
  text: The next day[a], the large crowd that had come to the feast, when they heard that Jesus was coming to Jerusalem[b],
translation:
  language: ig
  text: N’echi ya, mgbe nnukwu ìgwè mmadụ ndị bịara ememme ahụ[a] nụrụ na Jizọs na-abịa Jerusalem[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “oriri ahụ.”
    reason: lexical_alternative
  - marker: b
    text: 'Grik ji oge ugbu a n’akụkọ: “Jizọs na-abịa Jerusalem.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τῇ ἐπαύριον
  choice: N’echi ya
  rationale: Nke a bụ ụzọ Igbo nkịtị na nke doro anya si egosi ụbọchị sochirinụ n’usoro akụkọ.
- source_word: ὁ ὄχλος πολὺς
  choice: oké ìgwè mmadụ ahụ
  rationale: “Oké ìgwè mmadụ” na-egosi ìgwè buru ibu, ma na-anọgide bụrụ okwu Igbo dị mfe nghọta.
- source_word: ὁ ἐλθὼν εἰς τὴν ἑορτήν
  choice: bịara ememme ahụ
  rationale: Nkebiokwu a na-akọwa ìgwè mmadụ ahụ; “bịara” na-egosi omume ha mere tupu ihe akụkọ a na-akọ ugbu a, ebe “ememme” na-ekpuchi echiche ἑορτή nke ememme okpukpe.
- source_word: ἀκούσαντες
  choice: nụrụ
  rationale: Ọ bụ ezie na aha ìgwè ahụ dị ka otu n’usoro ụtọasụsụ Grik, participle a dị n’ụdị ọtụtụ ma na-ele ndị nọ n’ìgwè ahụ anya; Igbo nwere ike ikwu ya n'ụzọ eke site na “ìgwè mmadụ ahụ ... nụrụ.”
- source_word: ὅτι ἔρχεται
  choice: na Jizọs na-abịa
  rationale: “Na-abịa” na-echekwa historical present nke Grik ma na-enye akụkọ ahụ ịdị ndụ, na-enweghị ịtụgharị ya n’oge gara aga.
- source_word: ὁ Ἰησοῦς
  choice: Jizọs
  rationale: A sụgharịghị aha mmadụ; e dere ya n’usoro mkpụrụokwu Igbo a na-ejikarị eme ihe.
- source_word: εἰς Ἱεροσόλυμα
  choice: Jerusalem
  rationale: N’Igbo, “na-abịa Jerusalem” bụ ụzọ dị nkenke ma bụrụkwa eke isi gosipụta ije na-aga obodo ahụ.
theological_decisions: []
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. A hapụrụ ahịrịokwu ahụ ka ọ kwụsị na rikoma n’ihi na amaokwu a bụ mmalite nke ahịrịokwu na-aga n’ihu n’amaokwu na-esote.
