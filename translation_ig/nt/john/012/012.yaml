    reason: lexical_alternative
  - marker: b
    text: 'Grik ji oge ugbu a n’akụkọ: “Jizọs na-abịa Jerusalem.”'
    reason: lexical_alternative
  revision_rationale: The revision supplies “ndị” to render the Greek attributive participle (“those who had come”) and “mgbe” to make the temporal force of ἀκούσαντες explicit. It retains the historical-present wording “na-abịa,” the festival terminology, and the sentence-final comma because the thought continues in the next verse.
