revisions:
- from: N’echi ya, oké ìgwè mmadụ ahụ bịara ememme ahụ[a] nụrụ na Jizọs na-abịa Jerusalem[b],
  to: N’echi ya, mgbe nnukwu ìgwè mmadụ ndị bịara ememme ahụ[a] nụrụ na Jizọs na-abịa Jerusalem[b],
  rationale: The revision supplies “ndị” to render the Greek attributive participle (“those who had come”) and “mgbe” to make the temporal force of ἀκούσαντες explicit. It retains the historical-present wording “na-abịa,” the festival terminology, and the sentence-final comma because the thought continues in the next verse.
  reviewer_model: gpt-5.6-terra
