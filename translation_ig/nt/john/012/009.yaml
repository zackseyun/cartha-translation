id: JHN.12.9
reference: John 12:9
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἔγνω ⸀οὖν ὄχλος πολὺς ἐκ τῶν Ἰουδαίων ὅτι ἐκεῖ ἐστιν, καὶ ἦλθον οὐ διὰ τὸν Ἰησοῦν μόνον, ἀλλ’ ἵνα καὶ τὸν Λάζαρον ἴδωσιν ὃν ἤγειρεν ἐκ νεκρῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/009.yaml
  text: So a large crowd of the Jews learned that he was there[a], and they came not only because of Jesus, but also so that they might see Lazarus, whom he had raised from the dead.
translation:
  language: ig
  text: Ya mere, nnukwu ìgwè ndị Juu[a] matara na ọ nọ n’ebe ahụ. Ha bịara, ọ bụghị naanị n’ihi Jizọs, kama ka ha hụkwa Lazarọs, onye o mere ka o si n’etiti ndị nwụrụ anwụ bilie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “nnukwu ìgwè si n’etiti ndị Judia.” Okwu Grik a pụrụ izo aka n’ebe a n’ebe ndị Juu n’ozuzu ha nọ, ma n’ọnọdụ ụfọdụ n’Oziọma Jọn, ọ pụrụ izo aka kpọmkwem n’ebe ndị Judia nọ.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἔγνω
  choice: matara
  rationale: Ụdị ngwaa a na-egosi na ìgwè ahụ nwetara ozi ma mata ya, ọ bụghị nanị na ha nwere ihe ọmụma ahụ kemgbe.
- source_word: οὖν
  choice: Ya mere
  rationale: Ọ na-ejikọta ihe a na ihe ndị bu ya ụzọ dịka ihe si na ha pụta, n’ụzọ doro anya n’Igbo.
- source_word: ὄχλος πολὺς
  choice: nnukwu ìgwè
  rationale: Nke a na-edobe echiche nke otu ìgwè mmadụ buru ibu kama ịsụgharị ya naanị dịka ọtụtụ mmadụ.
- source_word: ἐκ τῶν Ἰουδαίων
  choice: ndị Juu
  rationale: N’ebe a, ọ na-akọwa ìgwè sitere n’etiti ndị Juu. A hapụrụ ohere nke ịghọta ya dịka ndị Judia n’ihe odide ala peeji.
- source_word: ὅτι ἐκεῖ ἐστιν
  choice: na ọ nọ n’ebe ahụ
  rationale: Ọ bụ Jizọs ka ‘ọ’ na-ezo aka dịka ihe gbara amaokwu ahụ gburugburu si egosi; okwu a na-ada nke ọma n’akụkọ Igbo.
- source_word: ἦλθον
  choice: Ha bịara
  rationale: Ọ na-edobe mmegharị ha bịarutere n’ebe ahụ site n’echiche onye na-akọ akụkọ.
- source_word: οὐ διὰ τὸν Ἰησοῦν μόνον
  choice: ọ bụghị naanị n’ihi Jizọs
  rationale: ‘N’ihi’ na-egosi ihe kpaliri ha, dịka διά na accusative si arụ ọrụ n’ebe a.
- source_word: ἀλλ’ ἵνα καὶ ... ἴδωσιν
  choice: kama ka ha hụkwa
  rationale: Nke a na-edobe ma ntụnyere ‘ọ bụghị naanị ... kama’ ma ebumnuche nke ἵνα tinyere subjunctive.
- source_word: Λάζαρον
  choice: Lazarọs
  rationale: E dere aha ahụ n’ụdị dabara n’usoro ụda na odide Igbo a na-ahụkarị.
- source_word: ὃν ἤγειρεν ἐκ νεκρῶν
  choice: onye o mere ka o si n’etiti ndị nwụrụ anwụ bilie
  rationale: Nke a na-egosi na Jizọs mere ka Lazarọs dịghachi ndụ, ma na-edobekwa ‘site n’etiti ndị nwụrụ anwụ’ nke okwu Grik ahụ.
theological_decisions:
- issue: Ihe Ἰουδαίων pụtara n’Oziọma Jọn
  choice: ndị Juu
  alternative: ndị Judia
  rationale: N’ọnọdụ ememme na ọha mmadụ a, okwu ahụ nwere ike ịpụta ndị Juu dịka otu agbụrụ na okpukpe; ma n’ebe ụfọdụ na Jọn, ọ pụrụ ịpụta ndị si Judia. E debere isi nsụgharị n’ụdị sara mbara ma gosipụta nke ọzọ n’ihe odide ala peeji, ka a ghara idozi ihe odide ahụ n’otu ụzọ n’enweghị ihe akaebe zuru ezu.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta, dee ya. A haziri ahịrịokwu nke abụọ n’ụzọ Igbo si ekwu ‘ọ bụghị naanị ... kama ... kwa,’ ma e chekwara njikọ, ebumnuche, na mgbagwoju anya dị na Ἰουδαίων.
