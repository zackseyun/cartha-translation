  variant: Standard Igbo
source:
  edition: SBLGNT
  text: λέγει ⸀δὲ ⸂Ἰούδας ὁ Ἰσκαριώτης εἷς τῶν μαθητῶν αὐτοῦ⸃, ὁ μέλλων αὐτὸν παραδιδόναι·
base_translation:
  language: en
  yaml_path: translation/nt/john/012/004.yaml
  text: But Judas Iscariot[a], one of his disciples—the one who was about to betray him—said,
translation:
  language: ig
  text: Ma Judas Iskarịọt, otu n’ime ndị na-eso ụzọ ya—onye nọ na-aga ịrara ya nye[a]—kwuru,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n’ụzọ dabara nnọọ n’okwu Grik, “onye nọ na-aga inyefe ya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: kwuru
  rationale: Ọ bụ ezie na Grik ji oge ugbu a nke akụkọ, Igbo nke oge a na-eji oge gara aga “kwuru” eme ka akụkọ na-aga were were.
- source_word: δὲ
  choice: Ma
  rationale: “Ma” na-egosi obere ntụgharị na ọdịiche dị n’etiti ihe Meri mere na mkpesa Judas na-esochi.
- source_word: Ἰούδας ὁ Ἰσκαριώτης
  choice: Judas Iskarịọt
  rationale: E dere aha ahụ n’ụdị a na-anụkarị ma na-agụkarị ya n’Igbo.
- source_word: εἷς τῶν μαθητῶν αὐτοῦ
  choice: otu n’ime ndị na-eso ụzọ ya
  rationale: Nkebiokwu a bụ Igbo doro anya ma bụrụkwa nke e ji akọwa μαθητής n’ụzọ na-egosi mmekọrịta onye na-amụ ihe na onye nkụzi.
- source_word: ὁ μέλλων
  choice: onye na-achọ
  rationale: N’ebe a, “na-achọ” na-egosi ihe Judas nọ na-aga ime, ma na-asụ Igbo nke ọma n’etinyeghị nkọwa karịrị ihe dị na Grik.
- source_word: παραδιδόναι
  choice: ịrara ya nye
  rationale: N’ihe gbasara Judas na Jizọs, “ịrara ya nye” na-egosi n’ụzọ doro anya na inyefe ahụ bụ aghụghọ, ebe nkọwa ala peeji na-echekwa ntụgharị nkịtị ya.
theological_decisions:
- issue: Otu e si sụgharị παραδιδόναι banyere ihe Judas mere Jizọs
  choice: ịrara ya nye
  alternative: inyefe ya n’aka ndị ọzọ
  rationale: Okwu Grik ahụ nwere ike ịpụta inyefe mmadụ, ma n’ọnọdụ Judas ọ bụ omume aghụghọ. Isi ederede gosiri ihe okwu ahụ pụtara n’ọnọdụ a, ebe nkọwa ala peeji chekwara nghọta ya sara mbara ma bụrụ nke nkịtị.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E ji akara ogologo dọsh kewapụ nkọwa gbasara Judas, ma chekwaa njedebe nke amaokwu ahụ nke na-eduga n’okwu ọ ga-ekwu n’amaokwu na-esonụ.
