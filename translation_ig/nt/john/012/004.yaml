    text: Ma ọ bụ, n’ụzọ dabara nnọọ n’okwu Grik, “onye nọ na-aga inyefe ya.”
    reason: lexical_alternative
  revision_rationale: The revision replaces “na-achọ” with a prospective expression corresponding to μέλλων and removes the unsupported addition “n’aka ndị ọzọ” from the lexical footnote. It preserves the contextual rendering “ịrara ya nye” in the text and the literal “inyefe ya” alternative in the note.
