  to: 'Jizọs wee chọta otu nwa ịnyịnya ibu[a], wee nọdụ n’elu ya, dị nnọọ ka e dere, sị:'
  rationale: The revision corrects the narrative verb construction while retaining the source sequence, the mild forward-moving force of δέ (“wee”), the non-exclusive sense of ὀνάριον, and the restrained Scripture-introduction formula. It does not imply a motive for Jesus beyond what the verse states.
