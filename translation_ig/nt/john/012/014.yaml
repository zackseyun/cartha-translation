id: JHN.12.14
reference: John 12:14
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εὑρὼν δὲ ὁ Ἰησοῦς ὀνάριον ἐκάθισεν ἐπ’ αὐτό, καθώς ἐστιν γεγραμμένον·
base_translation:
  language: en
  yaml_path: translation/nt/john/012/014.yaml
  text: 'Then Jesus[a], having found a young donkey, sat on it, just as it is written:'
translation:
  language: ig
  text: 'Jizọs wee chọta otu nwa ịnyịnya ibu[a], wee nọdụ n’elu ya, dị nnọọ ka e dere, sị:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ịnyịnya ibu.” Okwu Grik ὀνάριον na-ezo aka n’ịnyịnya ibu, ọtụtụ mgbe nke na-eto eto.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὑρὼν
  choice: wee chọta
  rationale: A na-eji usoro ngwaa Igbo a egosi na Jizọs bu ụzọ chọta anụmanụ ahụ tupu ọ nọdụ n’elu ya, ma ọ ka na-eme ka akụkọ ahụ na-aga were were.
- source_word: δὲ
  choice: wee
  rationale: N’ebe a, δέ bụ njikọ dị nro nke na-akwalite akụkọ ahụ; “wee” na-eme nke a n’Igbo n’egosighị esemokwu na-adịghị n’amaokwu ahụ.
- source_word: ὀνάριον
  choice: otu nwa ịnyịnya ibu[a]
  rationale: ὀνάριον bụ okwu na-ezo aka n’ịnyịnya ibu, ọtụtụ mgbe nke na-eto eto. “Nwa ịnyịnya ibu” bụ okwu Igbo doro anya nke na-echekwa echiche ahụ n’etinyeghị nkọwa karịrị nke okwu Grik kwuru.
- source_word: ἐκάθισεν ἐπ’ αὐτό
  choice: nọkwasị n’elu ya
  rationale: Nke a na-asụgharị kpọmkwem omume ịnọdụ n’elu anụmanụ ahụ, kama iji okwu ga-akọwakwu ya dị ka ịrị ya.
- source_word: καθώς ἐστιν γεγραμμένον
  choice: dị nnọọ ka e dere, sị
  rationale: Nke a bụ usoro e ji ewebata ihe e dere n’Akwụkwọ Nsọ. “Dị nnọọ ka” na-echekwa ike ntụnyere dị na καθώς, ebe “e dere” na-egosi na ihe ahụ e dere ka dị irè.
- source_word: ὁ Ἰησοῦς
  choice: Jizọs
  rationale: A hapụrụ mkpụrụokwu Grik ahụ dị n’ihu aha mmadụ n’ihi na Igbo anaghị eji ya n’ụzọ ahụ tupu aha mmadụ.
theological_decisions:
- issue: Mmekọrịta dị n’etiti ihe Jizọs mere na ihe Akwụkwọ Nsọ kwuru
  choice: E gosipụtara na ịchọta nwa ịnyịnya ibu na ịnọdụ n’elu ya kwekọrọ n’ihe e dere, ma a kọwaghị n’amaokwu a ma Jizọs ji ụma mee ya iji mezuo amụma.
  alternative: Ịsụgharị ya n’ụzọ ga-egosi hoo haa na Jizọs ji ụma mee ihe ngosi amụma.
  rationale: Amaokwu ahụ na-akọ ihe Jizọs mere, mesịa webata ihe e dere. Ọ na-egosi nkwekọrịta na amụma, ma ọ naghị ekwu kpọmkwem ebumnobi Jizọs; ya mere, nsụgharị ahụ echekwala oke ihe ederede kwuru.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe ma nwee ugwu, mee ihe. Usoro ngwaa “wee chọta … nọkwasị” na-enye akụkọ ahụ ọganihu nkịtị ma na-echekwa na ịchọta ya buru ụzọ mee.
