  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ οἶδα ὅτι ἡ ἐντολὴ αὐτοῦ ζωὴ αἰώνιός ἐστιν. ἃ οὖν ⸂ἐγὼ λαλῶ⸃, καθὼς εἴρηκέν μοι ὁ πατήρ, οὕτως λαλῶ.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/050.yaml
  text: And I know that his commandment is eternal life. So what I speak[a], I speak just as the Father has told me.
translation:
  language: ig
  text: Ama m na iwu ya bụ ndụ ebighị ebi. Ya mere, ihe m na-ekwu, ana m ekwu ya dịka Nna ahụ gwara m.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἶδα
  choice: Ama m
  rationale: Nke a bụ ntụgharị Igbo doro anya ma bụrụkwa nke e ji ekwu okwu ugbu a maka nkwenye siri ike dị na οἶδα.
- source_word: ἐντολή
  choice: iwu
  rationale: “Iwu” na-egosi ihe onye nwere ikike nyere ka e mee; ọ bụ okwu nkịtị ma dị ùgwù n’Igbo.
- source_word: ζωὴ αἰώνιος
  choice: ndụ ebighị ebi
  rationale: Nke a bụ ụzọ Igbo a na-aghọta nke ọma isi kwuo okwu Jọn a, na-echekwa echiche nke ndụ na-adịgide adịgide na ndụ nke oge na-abịa.
- source_word: ἃ
  choice: ihe
  rationale: “Ihe” na-enye neuter plural relative ἃ n’ụzọ Igbo dị ire, n’enweghị ntụgharị nke ga-ada arọ.
- source_word: λαλῶ
  choice: m na-ekwu / ana m ekwu
  rationale: E ji otu ngwaa “ikwu” mee ihe ugboro abụọ iji chekwaa nkwughachi λαλέω; mgbanwe ọdịdị ya bụ naanị maka ụtọasụsụ Igbo.
- source_word: καθὼς
  choice: kpọmkwem dịka
  rationale: Nke a na-egosi nkwekọ zuru ezu n’etiti ihe Nna kwuru na ihe Jizọs na-ekwu.
- source_word: εἴρηκέν μοι
  choice: gwara m
  rationale: “Gwara m” bụ Igbo ebumpụta ụwa nke na-egosi na Nna enyela ya okwu nke ka na-achịkwa ihe ọ na-ekwu.
- source_word: ὁ πατήρ
  choice: Nna ahụ
  rationale: Nke a na-echekwa article dị n’asụsụ Grik na aha mmekọrịta ahụ, n’etinyeghị “Nna m,” nke na-adịghị n’ederede.
- source_word: οὖν
  choice: Ya mere
  rationale: Nke a na-echekwa njikọ nkwubi okwu nke οὖν n’ụzọ Igbo doro anya.
theological_decisions:
- issue: Ihe okwu “iwu ya bụ ndụ ebighị ebi” pụtara
  choice: 'E debere equative expression ahụ kpọmkwem: “iwu ya bụ ndụ ebighị ebi.”'
  alternative: “Iwu ya na-eduga ná ndụ ebighị ebi” ma ọ bụ “iwu ya gbasara ndụ ebighị ebi.”
  rationale: Asụsụ Grik kwuru kpọmkwem na iwu ahụ “bụ” ndụ ebighị ebi. Idebe ya otu a na-echekwa mgbagwoju anya na ịdị arọ nke okwu ahụ n’enweghị ịkọwa ya n’ụzọ ga-eme ka naanị otu nghọta bụrụ iwu.
translation_notes:
  register: Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E chekwara nkwughachi ngwaa ahụ na nhazi siri ike nke ahịrịokwu Grik, ma e mere ya ka ọ na-ada nke ọma n’Igbo.
