review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders the principal clauses, including the deliberately direct equation, “iwu ya bụ ndụ ebighị ebi.” It also preserves the repeated use of λαλέω through forms of ikwu. However, “kpọmkwem” adds an explicit sense of exactness not required by καθὼς, which means “as/just as.”
  naturalness: The wording is generally clear Standard Igbo. “Ihe m na-ekwu, ana m ekwu ya” is natural enough and effectively retains the source’s repetition. Removing “kpọmkwem” produces a smoother, more idiomatic correspondence clause.
  terminology: “Iwu” appropriately renders ἐντολή in this context, and “ndụ ebighị ebi” is the established and natural rendering of ζωὴ αἰώνιος. “Nna ahụ” appropriately maintains the source’s articular title without adding “my.”
  issues:
  - severity: low
    issue: “kpọmkwem dịka” over-specifies καθὼς.
    rationale: καθὼς expresses correspondence (“as” or “just as”), but does not itself require the stronger adverbial claim “exactly.” “Dịka” preserves the source without interpretive intensification.
  revised_text: Ama m na iwu ya bụ ndụ ebighị ebi. Ya mere, ihe m na-ekwu, ana m ekwu ya dịka Nna ahụ gwara m.
