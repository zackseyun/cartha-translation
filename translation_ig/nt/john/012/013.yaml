  text: ἔλαβον τὰ βαΐα τῶν φοινίκων καὶ ἐξῆλθον εἰς ὑπάντησιν αὐτῷ, καὶ ⸀ἐκραύγαζον· Ὡσαννά, εὐλογημένος ὁ ἐρχόμενος ἐν ὀνόματι κυρίου, ⸂καὶ ὁ⸃ βασιλεὺς τοῦ Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/013.yaml
  text: They took the palm branches and went out to meet him[a], and they were crying out, “Hosanna! Blessed is the one who comes in the name of the Lord[c][b], even the King of Israel!”
translation:
  language: ig
  text: Ha were alaka nkwụ wee pụọ izute ya, na-eti mkpu, sị, “Hosanna![a] Onye na-abịa n’aha Onyenweanyị[b] ka a gọziri agọzi, ya bụ Eze Izrel!”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Hosanna” bụ mkpu sitere n’asụsụ Hibru nke pụtara “zọpụta ugbu a” ma ọ bụ “biko, zọpụta”; n’oge ahụ, a na-ejikwa ya dịka mkpu otuto.
    reason: lexical_alternative
  - marker: b
    text: Okwu a na-emegharị Abụ Ọma 118:26.
    reason: cross_reference
  - marker: c
    text: A pụkwara ịsụgharị ya, “na Eze Izrel.”
    reason: alternative_reading
lexical_decisions:
- source_word: βαΐα τῶν φοινίκων
  choice: alaka nkwụ
  rationale: Nke a na-egosipụta alaka sitere n’osisi nkwụ n'ụzọ Igbo dị mfe ma bụrụ nke ziri ezi.
- source_word: ἐξῆλθον εἰς ὑπάντησιν αὐτῷ
  choice: pụọ izute ya
  rationale: Ọ na-egosipụta n'ụzọ kpọmkwem na ha gara n'èzí iji zute ya, n'etinyeghị echiche ọzọ dịka ịnabata ya.
- source_word: ἐκραύγαζον
  choice: na-etikwa mkpu
  rationale: Ụdị ngwaa imperfect na-egosi mkpu gara n'ihu ma ọ bụ e mere ugboro ugboro.
- source_word: Ὡσαννά
  choice: Hosanna
  rationale: E debere mkpu ofufe a dịka mkpụrụokwu e si n'asụsụ ọzọ webata, ebe nkọwa ya dị n'ala peeji.
- source_word: εὐλογημένος ὁ ἐρχόμενος
  choice: Onye a gọziri agọzi ka onye ahụ bụ nke na-abịa
  rationale: Ọ na-echekwa participle e ji mee aha, ma na-egosipụta nkwupụta ngọzi ahụ n'ụzọ doro anya.
- source_word: ἐν ὀνόματι κυρίου
  choice: n’aha Onyenwe anyị
  rationale: Nke a bụ okwu Akwụkwọ Nsọ a maara nke ọma, na-echekwa njikọ ya na Abụ Ọma 118:26.
- source_word: καὶ ὁ βασιλεὺς τοῦ Ἰσραήλ
  choice: Ọ bụkwa Eze Izrel
  rationale: Nke a na-echekwa καί na aha eze ahụ, ma na-eme ka mkpu ahụ bụrụ Igbo kwụ ọtọ; e debere ohere ntụgharị njikọ ahụ n'ala peeji.
theological_decisions:
- issue: Ntụgharị κύριος n’okwu e hotara n’Abụ Ọma
  choice: Onyenwe anyị
  alternative: Yahweh
  rationale: Ederede Grik nwere κυρίου; ‘Onyenwe anyị’ na-anọchi ya nke ọma ma na-edebe njikọ ya na Abụ Ọma n'etinyeghị aha Hibru nke na-anọghị n'ederede Grik.
- issue: Ike Mesaịa na nke eze dị na mkpu ìgwè mmadụ
  choice: Eze Izrel
  alternative: eze Izrel
  rationale: E debere aha eze ahụ n'emeghị ka ọ dị nro ma ọ bụ tinye nkọwa ozizi na-anọghị n'amaokwu ahụ.
- issue: Mmekọrịta καί na aha ‘Eze Izrel’
  choice: Ọ bụkwa Eze Izrel
  alternative: na Eze Izrel
  rationale: καί nwere ike ịbụ njikọ nkịtị ma ọ bụ mee ka aha eze ahụ bụrụ nkọwa ọzọ siri ike; isi ederede na-eji Igbo eke, ebe ala peeji na-echekwa nhọrọ ntụgharị ọzọ.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji ‘Hosanna’ chekwaa ụdị mkpu ọdịnala ahụ, tinyekwa nkọwa ya n’ala peeji. E ji ‘Onyenwe anyị’ maka κύριος, ma chekwaa aha ‘Eze Izrel’ n’enweghị mgbakwunye ozizi.
