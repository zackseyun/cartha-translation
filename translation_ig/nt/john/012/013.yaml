revisions:
- from: Ha weere alaka nkwụ, pụọ izute ya, na-etikwa mkpu, sị, “Hosanna![a] Onye a gọziri agọzi ka onye ahụ bụ nke na-abịa n’aha Onyenwe anyị![b] Ọ bụkwa Eze Izrel!”[c]
  to: Ha were alaka nkwụ wee pụọ izute ya, na-eti mkpu, sị, “Hosanna![a] Onye na-abịa n’aha Onyenweanyị[b] ka a gọziri agọzi, ya bụ Eze Izrel!”[c]
  rationale: The revision corrects the unidiomatic and repetitive blessing clause, improves the narrative verbs, and retains the final royal title as an appositional climax (“ya bụ Eze Izrel”), corresponding to the contextual force of καί. Footnote c preserves the more formally connective alternative, and footnote b is moved to the wording that actually echoes Psalm 118:26.
  reviewer_model: gpt-5.6-terra
