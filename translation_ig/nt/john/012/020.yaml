  text: Ἦσαν δὲ ⸂Ἕλληνές τινες⸃ ἐκ τῶν ἀναβαινόντων ἵνα προσκυνήσωσιν ἐν τῇ ἑορτῇ·
base_translation:
  language: en
  yaml_path: translation/nt/john/012/020.yaml
  text: There were some Greeks among those going up to worship at the feast[a].
translation:
  language: ig
  text: E nwere ụfọdụ ndị Gris n’etiti ndị na-arịgo ife ofufe n’ememme ahụ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị Gris ụfọdụ”; o nwere ike ịbụ ndị na-abụghị ndị Juu bịara ife ofufe n’ememme ahụ.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἦσαν δὲ
  choice: sokwa ná
  rationale: ἦσαν na-egosi ịdị adị, ebe δέ bụ njikọ dị nro. N'Igbo, “sokwa ná” na-egosi n'ụzọ ebumpụta ụwa na ndị a so n'ìgwè a kpọtụrụ aha, na-agbakwaghị okwu oge dịka “ugbu a” nke na-adịghị n'isi mmalite.
- source_word: Ἕλληνές τινες
  choice: Ndị Gris ụfọdụ
  rationale: Ἕλληνες pụtara ndị Gris n'ụzọ agbụrụ ma ọ bụ omenala; τινες na-egosi na ha bụ ụfọdụ n'ime ha. A hapụrụ ya otú ahụ kama ịsụgharị ya “ndị mba ọzọ,” ka a ghara ikpebi njirimara ha karịa ihe ederede kwuru.
- source_word: ἐκ τῶν ἀναβαινόντων
  choice: ná ndị na-arịgoro
  rationale: ἐκ na-egosi na ndị Gris ahụ so n'etiti ndị na-aga elu. “Na-arịgoro” na-echekwa ụzọ e si ekwu maka njem nrịgo gaa Jerusalem, n'ebughị nkọwa ahụ tinye n'amaokwu.
- source_word: ἵνα προσκυνήσωσιν
  choice: ịga fee ofufe
  rationale: ἵνα na subjunctive na-egosi ebumnuche. “Ịga fee ofufe” bụ Igbo doro anya nke na-egosi ebumnuche njem ahụ; προσκυνέω ebe a bụ ife ofufe okpukpe, ọ bụghị naanị ịkpọ isiala.
- source_word: ἐν τῇ ἑορτῇ
  choice: n'oge Ememme ahụ
  rationale: ἑορτή na-ekwu maka ememme ndị Juu a maara site n'ọnọdụ okwu ahụ. “N'oge Ememme ahụ” na-egosi oge na mmemme a kapịrị ọnụ n'ụzọ Igbo dị mfe.
theological_decisions:
- issue: Njirimara ndị a kpọrọ Ἕλληνες
  choice: E ji “Ndị Gris” mee ihe dịka aha agbụrụ ma ọ bụ omenala.
  alternative: Ndị mba ọzọ
  rationale: Okwu Grik bụ Ἕλληνες, nke pụtara “ndị Gris” kpọmkwem. Ederede ahụ ekwughị ma ha bụ ndị Juu na-asụ Grik, ndị tọghatara n'okpukpe ndị Juu, ka ha bụ ndị na-atụ egwu Chineke; ya mere nsụgharị ahụ ahapụghị esemokwu ahụ ma ọ bụ kpebie ya n'onwe ya.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta mee ihe. “Ememme” nwere mkpụrụedemede ukwu iji gosi ememme a kapịrị ọnụ nke ọnọdụ okwu ahụ na-ezo aka na ya; a zere okwu ụka pụrụ iche na nkọwa na-ekpebi njirimara ndị Gris ahụ.
