id: JHN.12.26
reference: John 12:26
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐὰν ἐμοί ⸂τις διακονῇ⸃ ἐμοὶ ἀκολουθείτω, καὶ ὅπου εἰμὶ ἐγὼ ἐκεῖ καὶ ὁ διάκονος ὁ ἐμὸς ἔσται· ⸀ἐάν τις ἐμοὶ διακονῇ τιμήσει αὐτὸν ὁ πατήρ.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/026.yaml
  text: If anyone serves me[a], let him follow me; and where I am, there my servant will be also. If anyone serves me, the Father will honor him.
translation:
  language: ig
  text: Ọ bụrụ na onye ọ bụla na-ejere m ozi[a], ya soro m; ebe m nọ, ọ bụkwa n’ebe ahụ ka onye na-ejere m ozi ga-anọ. Ọ bụrụ na onye ọ bụla na-ejere m ozi, Nna ahụ ga-asọpụrụ ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Okwu Grik ji usoro otu onye n’ụdị nwoke n’usoro ụtọasụsụ mee ntụaka izugbe: “Ọ bụrụ na onye ọ bụla na-ejere m ozi ... Nna ahụ ga-asọpụrụ ya.” N’Igbo, “onye ọ bụla” na “ya” anaghị egosi ma onye ahụ ọ̀ bụ nwoke ma ọ bụ nwaanyị.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διακονῇ (διακονέω)
  choice: na-ejere m ozi
  rationale: Nke a na-egosi ijere Jizọs ozi n’ụzọ sara mbara ma dịkwa eke n’Igbo; ọ naghị emechi okwu ahụ n’ọrụ ụka pụrụ iche.
- source_word: ἀκολουθείτω
  choice: ya soro m
  rationale: Usoro a na-edobe ike iwu nke present imperative n’Igbo dị mfe ma ghara ịgbakwunye nkọwa aspekt karịrị nke ederede kwuru.
- source_word: διάκονος
  choice: onye na-ejere m ozi
  rationale: Nke a na-ezo aka n’ozuzu onye na-ejere Jizọs ozi, ọ bụghị ọkwa ‘dikin’ ma ọ bụ onye ụkọchukwu.
- source_word: ὅπου εἰμὶ ἐγὼ
  choice: ebe m nọ
  rationale: Nke a bụ ụzọ Igbo si ekwu ya nke ọma; njikọ ahịrịokwu ahụ na-eburu mesiri ike nke ἐγώ n’enweghị okwu agbakwunyere na-adịghị eke.
- source_word: ἐκεῖ καὶ
  choice: ọ bụkwa n’ebe ahụ
  rationale: ‘N’ebe ahụ’ na-edobe ebe a na-ekwu maka ya, ebe ‘-kwa’ na-egosipụta echiche mgbakwunye nke καί.
- source_word: τιμήσει
  choice: ga-asọpụrụ
  rationale: ‘Ịsọpụrụ’ na-egosi inye nsọpụrụ ma na-edobe nkwa nke ọdịnihu dị n’okwu Grik.
- source_word: ὁ πατήρ
  choice: Nna ahụ
  rationale: Ederede Grik kwuru ‘Nna ahụ,’ ọ bụghị ‘Nna m’; ntụgharị a anaghị agbakwunye nnọchiaha nwe.
- source_word: τις
  choice: onye ọ bụla
  rationale: Nke a na-egosipụta ntụaka izugbe nke nnọchiaha Grik ahụ n’Igbo nkịtị, n’enweghị ime ka ọ bụrụ naanị nwoke.
- source_word: αὐτόν
  choice: ya
  rationale: Nnọchiaha Igbo ‘ya’ enweghị akara okike ma na-ezo aka nke ọma n’otu onye ahụ e kwuru na mbụ, n’ụzọ asụsụ Igbo si arụ ọrụ.
theological_decisions:
- issue: Ntụaka izugbe na usoro ọnọdụ
  choice: Jiri ‘onye ọ bụla’ na nnọchiaha ‘ya’ dịka ụtọasụsụ Igbo si dị.
  alternative: Ịgbalị itinye ntụaka nwoke kpọmkwem n’ihi nkwekọrịta masculine singular nke Grik.
  rationale: N’Igbo, nnọchiaha onye nke atọ anaghị egosi nwoke ma ọ bụ nwaanyị. ‘Onye ọ bụla ... ya’ na-eburu ntụaka izugbe nke Grik nke ọma n’enweghị ịmanye ọdịiche okike na-adịghị n’asụsụ Igbo.
- issue: Ụdị nsọpụrụ Nna ga-enye onye na-ejere Jizọs ozi
  choice: Kwuo naanị na Nna ahụ ‘ga-asọpụrụ ya.’
  alternative: Ịkọwa ya kpọmkwem dịka ụgwọ ọrụ n’eluigwe ma ọ bụ otuto nke oge ikpeazụ.
  rationale: Amaokwu ahụ ekwughị kpọmkwem ụdị nsọpụrụ ahụ. Ya mere, ntụgharị ahụ na-ahapụ obosara na esemokwu nkà mmụta okpukpe nke okwu Grik ahụ.
translation_notes:
  register: Igbo ọkọlọtọ, nke oge a, dị ùgwù ma dị mfe nghọta. E ji ‘ijere ... ozi’ mee ka njikọ dị n’etiti διακονέω na διάκονος pụta ìhè, ma zere okwu nwere ike ịpụta ọkwa ụka pụrụ iche.
