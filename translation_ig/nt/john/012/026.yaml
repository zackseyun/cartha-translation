review_pass:
  verdict: revise
  source_fidelity: The main Igbo text accurately conveys the two conditional statements, the imperative to follow Jesus, the promise of being where he is, and the Father's future honoring of the one who serves Jesus. ‘Onye na-ejere m ozi’ appropriately renders both the service verb and ‘my servant’ in idiomatic Igbo without importing the church office of deacon.
  naturalness: The verse is natural, clear Standard Igbo with an appropriately dignified register. ‘Ya soro m’ is a viable concise imperative following the conditional clause, and the locative phrasing clearly expresses ‘there also.’
  terminology: '‘Ijere ... ozi,’ ‘iso,’ and ‘ịsọpụrụ’ are contextually suitable. ‘Nna ahụ’ properly reflects Greek ὁ πατήρ without adding ‘my.’ The footnote’s description of Greek masculine grammar should be made more precise and idiomatic: it should refer to a grammatically masculine singular form, rather than suggesting that the referent is literally a male person.'
  issues:
  - severity: low
    issue: Footnote wording about Greek masculine singular
    rationale: ‘usoro otu onye nwoke n’ụtọasụsụ’ is awkward and can imply an actual male individual. The Greek has generic τις with masculine-singular grammatical agreement, especially αὐτόν; the note should distinguish grammatical masculine form from male reference.
  revised_text: Ọ bụrụ na onye ọ bụla na-ejere m ozi[a], ya soro m; ebe m nọ, ọ bụkwa n’ebe ahụ ka onye na-ejere m ozi ga-anọ. Ọ bụrụ na onye ọ bụla na-ejere m ozi, Nna ahụ ga-asọpụrụ ya.
