  text: ὁ δὲ Ἰησοῦς ⸀ἀποκρίνεται αὐτοῖς λέγων· Ἐλήλυθεν ἡ ὥρα ἵνα δοξασθῇ ὁ υἱὸς τοῦ ἀνθρώπου.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/023.yaml
  text: But Jesus answered them[a], saying[b], “The hour has come for the Son of Man to be glorified.”
translation:
  language: ig
  text: Ma Jizọs zara ha, sị, “Awa ahụ[a] eruola ka e nye Nwa nke Mmadụ[b] otuto.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Oge ahụ eruola.” N'asụsụ Grik, ọ bụ “awa,” okwu Jọn ji ugboro ugboro maka oge e kara aka maka ahụhụ na otuto Jizọs.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, “Nwa mmadụ.” Aha Grik a, “Nwa nke Mmadụ,” na-echetara Daniel 7; a hapụrụ ya otú a iji chekwaa mkpa ya n'ozizi na njikọ ya na akụkụ Akwụkwọ Nsọ ahụ.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποκρίνεται αὐτοῖς λέγων
  choice: zara ha, sị
  rationale: Nke a bụ ụzọ Igbo si ekwu okwu n'ụzọ dị mfe ma doo anya mgbe a na-ebute okwu onye kwuru kpọmkwem. Oge gara aga dabara n'usoro akụkọ Igbo, ọ bụ ezie na Grik ji oge ugbu a nke akụkọ.
- source_word: Ἐλήλυθεν
  choice: eruola
  rationale: Ụdị ngwaa a na-egosi na ihe ahụ abịala ma dị ugbu a; “eruola” na-echekwa echiche ahụ nke ọma.
- source_word: ὥρα
  choice: Awa ahụ
  rationale: “Awa” na-echekwa okwu Jọn ji ugboro ugboro maka oge a kara aka nke ahụhụ na otuto Jizọs, kama ime ya naanị “oge.”
- source_word: ἵνα δοξασθῇ
  choice: ka e nye ... otuto
  rationale: Nke a na-egosipụta passive ahụ n'ụzọ Igbo a na-aghọta nke ọma, na-akpọghị onye na-enye otuto aha, ma na-echekwa ịdị omimi nke δοξάζω n'akwụkwọ Jọn.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Nwa nke Mmadụ
  rationale: A hapụrụ aha a n'ụdị ọdịnala ya iji chekwaa njikọ ya na Daniel 7 na mkpa ya n'ozizi Jọn.
theological_decisions:
- issue: Otú e si tụgharịa ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Nwa nke Mmadụ
  alternative: Onye ahụ bụ mmadụ
  rationale: Okwu ahụ bụ aha Jizọs ji akọwa onwe ya, ọ bụghị naanị okwu izugbe banyere mmadụ. “Nwa nke Mmadụ” na-echekwa njikọ Akwụkwọ Nsọ ya na Daniel 7, na-ahapụghị onye ntụgharị ka ọ kọwaa ihe niile n'otu ụzọ.
- issue: Ike nke Ἐλήλυθεν ἡ ὥρα
  choice: Awa ahụ eruola
  alternative: Oge ahụ eruola
  rationale: Nhọrọ a na-echekwa ma perfect aspect nke “eruola” ma okwu “awa,” bụ́ isiokwu Jọn ji egosi oge a kara Jizọs aka maka ahụhụ na otuto.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. “Awa ahụ” nwere ntakịrị ụda pụrụ iche n'Igbo, ma a họọrọ ya n'ihi na ọ na-echekwa isiokwu pụrụ iche nke Jọn; ihe odide ala peeji na-enye “Oge ahụ” dị ka ụzọ ọzọ.
