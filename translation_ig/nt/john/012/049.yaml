revisions:
- from: N’ihi na ọ bụghị site n’onwe m[a] ka m kwuru okwu, kama Nna ahụ zitere m nyere m iwu n’onwe ya banyere ihe m ga-ekwu na ihe m ga-ekwu okwu.[b]
  to: N’ihi na ọ bụghị site n’onwe m[a] ka m kwuru okwu, kama Nna, onye zitere m, n’onwe ya enyela m iwu banyere ihe m ga-ekwu na ihe m ga-ekwu okwu.[b]
  rationale: The revision repairs the Igbo syntax for “the Father who sent me,” retains the Greek emphasis that the Father himself gave the command, and replaces an imprecise footnote alternative. It does not add any theological conclusion beyond the verse’s stated relation of mission and speech.
