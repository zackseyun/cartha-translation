id: JHN.12.49
reference: John 12:49
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὅτι ἐγὼ ἐξ ἐμαυτοῦ οὐκ ἐλάλησα, ἀλλ’ ὁ πέμψας με πατὴρ αὐτός μοι ἐντολὴν ⸀δέδωκεν τί εἴπω καὶ τί λαλήσω.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/049.yaml
  text: For I have not spoken from myself[b][a], but the Father who sent me has himself given me a command as to what I should say and what I should speak.
translation:
  language: ig
  text: N’ihi na ọ bụghị site n’onwe m[a] ka m kwuru okwu, kama Nna, onye zitere m, n’onwe ya enyela m iwu banyere ihe m ga-ekwu na ihe m ga-ekwu okwu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “n’onwe m” ma ọ bụ “site n’ikike nke m.”
    reason: lexical_alternative
  - marker: b
    text: N’asụsụ Grik, e ji ngwaa abụọ dị iche, nke pụtara “ikwu” na “ikwu okwu.” Nsụgharị a gbalịrị idebe ọdịiche ahụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξ ἐμαυτοῦ
  choice: site n’onwe m
  rationale: Nke a na-edobe echiche nke isi n’aka onye ahụ n’onwe ya pụta, ma ghara ịkọwa ya karịa ihe Grik kwuru. Usoro ahịrịokwu ‘ọ bụghị ... ka’ mere ka ọ daa nke ọma n’Igbo.
- source_word: ἐλάλησα
  choice: ka m kwuru okwu
  rationale: ‘Kwu okwu’ bụ ụzọ Igbo nkịtị si akọ omume ikwu okwu. Oge gara aga dabara n’ụdị aorist Grik ma nwekwara ike ịgụnye ozi Jizọs ruo n’oge ahụ.
- source_word: ὁ πέμψας με πατὴρ
  choice: Nna ahụ zitere m
  rationale: Nke a na-asụgharị participle ahụ dịka nkebiokwu na-akọwa ‘Nna,’ n’ụzọ doro anya ma dị mfe n’Igbo.
- source_word: αὐτός
  choice: n’onwe ya
  rationale: Aha nnọchi emphatic ahụ na-ekwusi ike na ọ bụ Nna ahụ kpọmkwem nyere iwu ahụ.
- source_word: ἐντολήν
  choice: iwu
  rationale: ‘Iwu’ na-egosi ikike na ntụziaka siri ike nke ἐντολή, n’enweghị ịgbakwunye echiche nke usoro iwu zuru ezu.
- source_word: δέδωκεν
  choice: nyere m
  rationale: Igbo anaghị egosikarị perfect n’ụdị ngwaa pụrụ iche; ọnọdụ okwu ahụ na-egosi na iwu e nyere ka dị irè.
- source_word: τί εἴπω
  choice: ihe m ga-ekwu
  rationale: Nke a bụ ụzọ Igbo nkịtị si kwuo ihe e nyere mmadụ iwu ka o kwuo.
- source_word: καὶ τί λαλήσω
  choice: na ihe m ga-ekwu okwu
  rationale: E ji ‘kwuo’ na ‘kwuo okwu’ dobe ntakịrị ọdịiche dị n’etiti λέγω na λαλέω, ọ bụ ezie na ha dị nnọọ nso n’echiche.
theological_decisions:
- issue: Mmekọrịta okwu Ọkpara na iwu Nna
  choice: E debere na Jizọs ekwughị okwu site n’onwe ya, kama ọ na-ekwu dịka iwu Nna zitere ya si dị.
  alternative: Ịkọwa ya na Jizọs bụ naanị onye amụma mmadụ, ma ọ bụ na ọ na-eme ihe n’onwe ya naanị na Nna kwenyere.
  rationale: Amaokwu ahụ n’onwe ya na-ekwusi ike na ozi na okwu ya sitere n’iwu Nna. Nsụgharị ahụ anaghị agbakwunye nkọwa banyere ọdịdị Ọkpara ma ọ bụ dozie esemokwu nkà mmụta okpukpe karịa ihe ederede kwuru.
- issue: Nsụgharị πατήρ
  choice: Nna
  alternative: nna
  rationale: N’ọnọdụ Oziọma Jọn a, okwu ahụ bụ aha e ji akpọ Chineke n’ihe gbasara mmekọrịta ya na Jizọs; mkpụrụedemede ukwu na-egosi ojiji ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. Usoro ‘ọ bụghị ... ka’ na-eme ka ahịrịokwu ahụ bụrụ nke e bu pụta ụwa n’Igbo, ebe ‘site n’onwe m’ na-edobe mgbagwoju anya dị n’isi mmalite banyere isi iyi ma ọ bụ ikike okwu ahụ.
