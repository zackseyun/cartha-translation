  terminology: Key terms are handled well. ‘Ndụ ebighị ebi’ is the established and natural rendering of ζωὴ αἰώνιος. The lexical footnote appropriately records ‘mkpụrụ obi’ and ‘onwe ya’ as possible contextual alternatives for ψυχή without imposing them on the main text. The explanatory note preserves the deliberate force of μισέω and avoids doctrinal overstatement.
