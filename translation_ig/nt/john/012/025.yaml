id: JHN.12.25
reference: John 12:25
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ φιλῶν τὴν ψυχὴν αὐτοῦ ⸀ἀπολλύει αὐτήν, καὶ ὁ μισῶν τὴν ψυχὴν αὐτοῦ ἐν τῷ κόσμῳ τούτῳ εἰς ζωὴν αἰώνιον φυλάξει αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/025.yaml
  text: The one who loves his life loses it[b][a], and the one who hates his life in this world will keep it for eternal life.
translation:
  language: ig
  text: Onye hụrụ ndụ ya[a] n’anya na-efunahụ ya; ma onye kpọrọ ndụ ya asị[b] n’ụwa a ga-echekwa ya maka ndụ ebighị ebi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya ‘mkpụrụ obi’ ma ọ bụ ‘onwe ya’; okwu Grik ψυχή nwere ike ịpụta ndụ, onwe mmadụ, ma ọ bụ mkpụrụ obi, dịka ebe e ji ya mee ihe si dị.
    reason: lexical_alternative
  - marker: b
    text: ‘Ịkpọ ndụ ya asị’ bụ okwu atụ nwere ụma banyere ịjụ ijidesi ndụ mmadụ ike n’usoro ụwa dị ugbu a; tụlee Luk 14:26, ebe e ji ụdị okwu a mee ihe. Ọ naghị akụzi ka mmadụ kpọọ onwe ya asị.
    reason: cross_reference
lexical_decisions:
- source_word: ὁ φιλῶν
  choice: Onye hụrụ … n’anya
  rationale: Nke a na-egosipụta onye ọ bụla n’ozuzu ya ma na-edobe echiche nke ịhụ n’anya dị n’aha-ngwaa Grik ahụ.
- source_word: ψυχὴν
  choice: ndụ ya
  rationale: N’ebe a, ψυχή na-ezo aka ná ndụ mmadụ ma ọ bụ onwe ya, nke a pụrụ ịtụfu ma ọ bụ chekwaa; ‘ndụ’ dabara n’ọdịiche dị n’etiti ἀπολλύει na φυλάξει karịa ‘mkpụrụ obi.’
- source_word: ἀπολλύει
  choice: na-efunahụ ya
  rationale: Oge ugbu a nke ngwaa Grik na-enye okwu a ọdịdị nke eziokwu na-adịgide adịgide; ‘na-efunahụ’ na-egosipụta nsonaazụ ahụ n’Igbo nkịtị.
- source_word: ὁ μισῶν
  choice: onye kpọrọ … asị
  rationale: A hapụrụ ike okwu μισέω n’ụzọ doro anya kama ime ka ọ dị nro; ọ bụ okwu atụ nwere ụma n’amaokwu a.
- source_word: ἐν τῷ κόσμῳ τούτῳ
  choice: n’ụwa a
  rationale: Nke a bụ nsụgharị kwụ ọtọ ma bụrụkwa Igbo nkịtị; ọ na-egosi na okwu ahụ metụtara ndụ n’usoro ụwa dị ugbu a.
- source_word: φυλάξει
  choice: ga-echekwa ya
  rationale: Oge ọdịnihu dị na Grik ka e debere, ‘chekwaa’ na-egosikwa idebe ihe ka ọ ghara ịla n’iyi.
- source_word: εἰς ζωὴν αἰώνιον
  choice: maka ndụ ebighị ebi
  rationale: ‘Maka’ na-egosipụta ebumnuche ma ọ bụ nsonaazụ nke εἰς, n’enweghị mgbagwoju anya nke ‘ruo’ nke pụrụ ịpụta naanị oge ihe ga-akwụsị.
- source_word: αὐτοῦ
  choice: ya
  rationale: Nnọchiaha Igbo ‘ya’ na-edobe onye otu nke okwu Grik, ma ọ naghị etinye nwoke ma ọ bụ nwaanyị ebe asụsụ Igbo na-achọghị ya.
theological_decisions:
- issue: Ihe ‘onye kpọrọ ndụ ya asị’ pụtara
  choice: E debere okwu siri ike ‘kpọrọ ndụ ya asị’ dị ka ọ dị na Grik, dịka ọkpụkpọ òkù ịjụ ijidesi ndụ nke ụwa a ike.
  alternative: ‘onye na-ahụghị ndụ ya n’anya nke ukwuu’ ma ọ bụ ‘onye na-ele ndụ ya anya dị ka ihe na-adịchaghị mkpa’
  rationale: μισέω bụ okwu siri ike, ma Jọn ji ya mee okwu atụ nwere ụma. Akụkụ ‘n’ụwa a’ na-egosi na nke a abụghị iwu ka mmadụ kpọọ onwe ya asị, kama ọ bụ ịjụ itinye ndụ nke ugbu a karịa ndụ ebighị ebi.
- issue: Nsụgharị ψυχή
  choice: ndụ
  alternative: mkpụrụ obi; onwe
  rationale: ‘Ndụ’ dabara n’ihe gbasara ịlafu na ichekwa n’amaokwu a, ma na-ezere itinye echiche na ψυχή ga-abụrịrị akụkụ ime mmụọ e kewapụrụ n’ahụ mmadụ.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. A hapụrụ okwu atụ siri ike nke amaokwu ahụ n’isi ederede, ma kọwaa ya n’ala ala peeji kama ime ka ọ dị nro n’ime nsụgharị.
