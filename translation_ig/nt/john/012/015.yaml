  text: Μὴ φοβοῦ, θυγάτηρ Σιών· ἰδοὺ ὁ βασιλεύς σου ἔρχεται, καθήμενος ἐπὶ πῶλον ὄνου.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/015.yaml
  text: Do not be afraid[a], daughter of Zion. Look, your King is coming[e][d][c][b], seated on a donkey’s colt.
translation:
  language: ig
  text: Atụla egwu[a], ada Zaịọn[b]. Lee[c], Eze gị na-abịa[e], nọ ọdụ n’elu nwa ịnyịnya ibu[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “Atụla ụjọ.”
    reason: lexical_alternative
  - marker: b
    text: “Ada Zaịọn” bụ ụzọ ndị amụma si were Zaịọn, ya bụ Jerusalem, mee ka ọ dị ka nwaanyị a na-agwa okwu.
    reason: cultural_note
  - marker: c
    text: A pụkwara ịsụgharị ya, “Hụ.”
    reason: lexical_alternative
  - marker: d
    text: N’ụzọ nkịtị, “n’elu nwa nke ịnyịnya ibu.”
    reason: lexical_alternative
  - marker: e
    text: Okwu ndị a na-eme ka Zekaraya 9:9 daa ụda, na-egosikwa Jizọs dịka Eze e kwere Zaịọn ná nkwa.
    reason: cross_reference
lexical_decisions:
- source_word: Μὴ φοβοῦ
  choice: Atụla egwu
  rationale: Nke a bụ iwu na-egbochi egwu. “Atụla egwu” bụ ụzọ Igbo nkịtị, doro anya, si kwuo ya n’enweghị asụsụ ochie.
- source_word: θυγάτηρ Σιών
  choice: ada Zaịọn
  rationale: Okwu a na-akpọ Zaịọn okwu dị ka nwaanyị, dịka asụsụ amụma si emekarị. “Ada Zaịọn” na-echekwa ihe atụ ahụ n’ụzọ dị nkenke ma bụrụkwa nke ndị na-agụ Igbo ga-aghọta.
- source_word: ἰδοὺ
  choice: Lee
  rationale: Ọ bụ okwu e ji adọta uche onye na-ege ntị. “Lee” bụ okwu Igbo dị ugbu a nke na-arụ ọrụ ahụ nke ọma.
- source_word: ὁ βασιλεύς σου
  choice: Eze gị
  rationale: Nke a na-echekwa aha eze na nnọchiaha nke onye a na-agwa. E ji mkpụrụedemede ukwu dee “Eze” n’ihi na n’ebe a ọ na-arụ ọrụ dịka aha nsọpụrụ nke Mesaịa, ọ bụ ezie na Grik n’onwe ya anaghị ekpebi mkpụrụedemede ukwu ma ọ bụ nta.
- source_word: ἔρχεται
  choice: na-abịa
  rationale: Ụdị okwu ugbu a na-egosi ọbịbịa dị ndụ ma na-aga n’ihu; “na-abịa” na-egosipụta nke a n’ụzọ Igbo kwesịrị ekwesị.
- source_word: καθήμενος
  choice: nọkwasịrị
  rationale: Okwu a kọwara otú ọ na-abịa—ọ nọ ọdụ n’elu anụmanụ ahụ. “Nọkwasịrị” na-echekwa echiche ịnọ ọdụ n’elu ihe n’etinyeghị nkọwa ọzọ.
- source_word: ἐπὶ πῶλον ὄνου
  choice: n’elu nwa ịnyịnya ibu
  rationale: πῶλος bụ nwa anụmanụ, ebe ὄνου na-akọwa na anụmanụ ahụ bụ ịnyịnya ibu. “Nwa ịnyịnya ibu” bụ ụzọ Igbo eke si chekwaa ihe abụọ ahụ.
theological_decisions:
- issue: Ntụaka amụma banyere Zaịọn na eze e kwere ná nkwa na Zekaraya 9:9
  choice: E debere “ada Zaịọn” na “Eze gị” n’ahịrị isi n’akọwaghị ha karịa.
  alternative: Ịsụgharị “ada Zaịọn” dịka “Jerusalem,” ma ọ bụ ịgbakwunye n’ahịrị isi na nke a bụ Mesaịa.
  rationale: Okwu Jọn na-eme ka amụma ahụ daa ụda ma na-egosi Jizọs dịka Eze Zaịọn; ntụgharị kwesịrị ichekwa okwu na esemokwu amụma ahụ, ebe nkọwa sara mbara ga-adị n’okpuru peeji.
- issue: Iji mkpụrụedemede ukwu dee “Eze”
  choice: Eze
  alternative: eze
  rationale: Ihe odide Grik anaghị edozi okwu a site na mkpụrụedemede ukwu. N’Igbo, mkpụrụedemede ukwu na-egosi na okwu ahụ nwere ụdị aha nsọpụrụ n’ebe a; ọ naghị agbakwunye nkwupụta okpukpe ọhụrụ karịa ọnọdụ amaokwu ahụ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị mfe ma dị ùgwù mee ntụgharị ahụ. Ahịrịokwu ahụ na-echekwa ụdị okwu amụma na ịdị nkenke nke Grik, ma zere ịgbasa nkọwa Mesaịa n’ime isi amaokwu.
