  rationale: 'Only the rendering of καθήμενος is revised: “nọ ọdụ” expresses the present, accompanying posture of the king’s coming without the potentially completed nuance of “nọkwasịrị.” All other wording and footnote anchors are retained because they faithfully convey the Greek and read naturally in Standard Igbo.'
