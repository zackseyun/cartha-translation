id: JHN.12.31
reference: John 12:31
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: νῦν κρίσις ἐστὶν τοῦ κόσμου τούτου, νῦν ὁ ἄρχων τοῦ κόσμου τούτου ἐκβληθήσεται ἔξω·
base_translation:
  language: en
  yaml_path: translation/nt/john/012/031.yaml
  text: Now is the judgment of this world[b][a]; now the ruler of this world will be cast out.
translation:
  language: ig
  text: Ugbu a ka a na-ekpe ụwa a ikpe; ugbu a, a ga-achụpụ onye na-achị ụwa a n'èzí.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A na-aghọtakarị okwu ahụ bụ “onye na-achị ụwa a” dịka ihe na-ezo aka na Setan. A pụkwara ịsụgharị “onye isi nke ụwa a.”
    reason: lexical_alternative_and_alternative_reading
lexical_decisions:
- source_word: νῦν
  choice: Ugbu a
  rationale: E ji otu okwu a mee ihe n’ebe abụọ ahụ iji chekwaa nkwusiri ike banyere oge ahụ na nhazi ahịrịokwu Grik.
- source_word: κρίσις
  choice: ka a na-ekpe ... ikpe
  rationale: Nke a na-egosi ikpe dị mkpa a na-ekpe ụwa a ugbu a, ma na-ada nke ọma n’Igbo karịa iji naanị aha nkịtị maka ‘ikpe.’
- source_word: κόσμου τούτου
  choice: ụwa a
  rationale: Ọ na-echekwa okwu ngosi τούτου na ọdịiche Jọn na-eme banyere ụwa dị ugbu a.
- source_word: ἄρχων
  choice: onye na-achị
  rationale: Ọ bụ okwu Igbo doro anya maka onye nwere ọchịchị; ọ naghị etinye njirimara Setan kpọmkwem n’ahịrị bụ isi.
- source_word: ἐκβληθήσεται ἔξω
  choice: a ga-achụpụ ... n'èzí
  rationale: Ọ na-echekwa ọdịdị nnara nke ngwaa ọdịnihu na ike nke ἔξω, ya bụ ịchụpụ onye ahụ ka ọ pụọ kpamkpam.
theological_decisions:
- issue: Onye bụ ‘onye na-achị ụwa a’
  choice: E hapụrụ aha ahụ dịka ‘onye na-achị ụwa a’ n’ahịrị bụ isi.
  alternative: Setan/Ekwensu; ma ọ bụ usoro ụwa dị ugbu a e mere ka ọ dị ka mmadụ
  rationale: N’Oziọma Jọn, a na-aghọtakarị aha a dịka Setan, ma ihe odide Grik kpọrọ naanị aha ọchịchị ahụ, ọ kpọghị Setan aha. Nsụgharị ahụ na-echekwa mgbagwoju anya a.
translation_notes:
  register: Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E ji ‘onye na-achị’ kama okwu ọdịnala nwere ike ghara ido anya, ma chekwaa myirịta nke ‘ugbu a ... ugbu a.’
