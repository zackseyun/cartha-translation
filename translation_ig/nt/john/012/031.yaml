  verdict: approve
  source_fidelity: The Igbo accurately renders the temporal emphasis and parallelism of νῦν, the judgment of ‘this world,’ the title ὁ ἄρχων τοῦ κόσμου τούτου, and the future passive force of ἐκβληθήσεται ἔξω. ‘A ga-achụpụ ... n’èzí’ appropriately conveys expulsion/casting out.
