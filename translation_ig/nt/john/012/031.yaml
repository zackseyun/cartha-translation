  terminology: ‘Onye na-achị ụwa a’ is a sound, non-interpretive rendering of ἄρχων. The footnote properly retains the title in the main line while noting the common identification with Satan and supplying ‘onye isi nke ụwa a’ as an alternative rendering. ‘Setan’ is standard usage.
