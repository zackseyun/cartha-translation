id: JHN.12.46
reference: John 12:46
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐγὼ φῶς εἰς τὸν κόσμον ἐλήλυθα, ἵνα πᾶς ὁ πιστεύων εἰς ἐμὲ ἐν τῇ σκοτίᾳ μὴ μείνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/046.yaml
  text: I have come into the world as light[b][a], so that everyone who believes in me may not remain in the darkness.
translation:
  language: ig
  text: Abịawo m n’ụwa dị ka ìhè[a], ka onye ọ bụla kwere na m[b] ghara ịnọgide n’ọchịchịrị.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịghọta ya dịka “otu ìhè.” N’asụsụ Grik, φῶς (“ìhè”) enweghị mkpụrụokwu nkọwa “the” n’ebe a; e nwere ike ịsụgharị ya dịka “dị ka ìhè” ma ọ bụ “otu ìhè.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “onye ọbụla kwere na m.”
    reason: lexical_alternative
lexical_decisions:
- source_word: φῶς
  choice: ìhè
  rationale: “Ìhè” bụ okwu Igbo kwụ ọtọ maka ihe atụ Jọn ji kọwaa onye Jizọs bụ na ọrụ ya. Nkebi “dị ka ìhè” na-egosipụta njirimara na ọrụ ya n’etinyeghị nkọwa ozizi ọzọ.
- source_word: εἰς τὸν κόσμον
  choice: n’ụwa
  rationale: N’Igbo, “ịbịa n’ụwa” na-egosipụta ịbanye n’ime ụwa n’ụzọ ebumpụta ụwa ma na-edobe echiche njem nke εἰς.
- source_word: ἐλήλυθα
  choice: Abịawo m
  rationale: Ụdị ngwaa a na-egosipụta omume mezuru nke nsonaazụ ya ka dị ugbu a; “Abịawo m” na-echekwa nghọta ahụ nke perfect.
- source_word: ἵνα
  choice: ka
  rationale: “Ka” na-ewebata ebumnuche n’Igbo n’ụzọ dị mfe ma kwekọọ n’ike ebumnuche nke ἵνα.
- source_word: πᾶς ὁ πιστεύων
  choice: onye ọ bụla nke kwere
  rationale: Nkebi a na-akọwa mmadụ niile nọ n’otu ìgwè ndị kweere. “Onye ọ bụla nke kwere” bụ Igbo doro anya nke na-echekwa obosara okwu ahụ.
- source_word: πιστεύων εἰς ἐμέ
  choice: kwere na m
  rationale: “Ikwere na” bụ ụzọ Igbo a na-ejikarị egosipụta okwukwe a tụkwasịrị n’ebe mmadụ nọ, ya mere ọ dabara n’iji πιστεύω εἰς eme ihe n’Oziọma Jọn.
- source_word: ἐν τῇ σκοτίᾳ
  choice: n’ọchịchịrị
  rationale: “Ọchịchịrị” na-echekwa ihe atụ Jọn nke ọchịchịrị dị ka ọnọdụ ime mmụọ na nke omume, n’enweghị ịgbakwunye nkọwa na-adịghị na amaokwu ahụ.
- source_word: μὴ μείνῃ
  choice: ghara ịnọgide
  rationale: “Ghara ịnọgide” na-egosipụta ebumnuche na-adịghị mma nke μή ya na ἵνα, ma chekwaa echiche nke ịga n’ihu ịnọ n’otu ọnọdụ.
theological_decisions:
- issue: Njirimara Kraịst n’ihe atụ nke ìhè n’Oziọma Jọn
  choice: A sụgharịrị φῶς dịka “ìhè” ma jiri “dị ka ìhè” gosi na Jizọs bịara n’ụwa dịka ìhè na-ekpughe ma na-azọpụta.
  alternative: “Abịawo m n’ụwa, mụ bụ ìhè” ma ọ bụ “Abịara m iweta ìhè n’ụwa.”
  rationale: Nhọrọ a na-echekwa ihe atụ ederede ahụ n’onwe ya ma zere ịgbanwe ya ka ọ bụrụ nkọwa ozizi. Ọ naghị ekpebi karịa ihe Grik kwuru ma ọ bụ belata njirimara Jizọs ka ọ bụrụ nanị onye wetara ìhè.
- issue: Obosara nke πᾶς ὁ πιστεύων
  choice: “onye ọ bụla nke kwere”
  alternative: “onye kwere na m”
  rationale: Nke a na-echekwa ntụaka nye mmadụ niile kweere n’etinyeghị echiche pụrụ iche banyere otú mmadụ si abịa n’okwukwe, nhọpụta, ma ọ bụ nnwere onwe ime nhọrọ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “Abịawo m” na-echekwa mmetụta perfect nke Grik; “ịnọgide n’ọchịchịrị” na-edobe ihe atụ pụrụ iche nke Jọn. E tinyere akara ndetu ozugbo n’ebe okwu ndị ha na-akọwa dị.
