  rationale: 'The verse itself needs only a light stylistic refinement: «onye ọ bụla kwere na m» is more natural than «onye ọ bụla nke kwere na m». The primary corrections clarify the grammatical basis of footnote a and make footnote b preserve the inclusive force of πᾶς ὁ πιστεύων. No theological interpretation has been added.'
