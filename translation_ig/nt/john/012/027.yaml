revisions:
- from: Ugbu a, mkpụrụ obi m nọ ná mwute[a], gịnịkwa ka m ga-ekwu? Nna, zọpụta m n’oge awa a. Ma ọ bụ n’ihi nke a ka m ji bịa ruo n’oge awa a.
  to: Ugbu a, mkpụrụ obi m erughị ala[a], gịnịkwa ka m ga-ekwu? Nna, zọpụta m pụọ n’awa a. Ma n’ihi nke a ka m ji bịaruo awa a.
  rationale: The revision corrects the directional sense of ἐκ, restores the contrast of ἀλλά, and uses the natural repeated term "awa" for the Greek Johannine motif. It preserves the SBLGNT direct-petition punctuation in the text and retains the disputed rhetorical-punctuation reading in the footnote without resolving the ambiguity doctrinally.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T06:25:24Z'
review_pass:
  verdict: revise
  source_fidelity: Draft retains the main sense, but "n’oge awa a" means “in/during this hour,” whereas ἐκ τῆς ὥρας ταύτης asks for deliverance “from/out of this hour.” "Ma ọ bụ" also introduces an unintended alternative (“or”) rather than the adversative ἀλλά (“but”).
  naturalness: '"Oge awa" is redundant and less idiomatic than "awa" in this Johannine expression. "Mkpụrụ obi m erughị ala" is a natural, dignified rendering that retains ψυχή while expressing the present disturbed state.'
  terminology: '"Mkpụrụ obi," "Nna," "zọpụta," and "awa" appropriately preserve the register and key Johannine wording. The revised wording keeps “hour” consistent in both occurrences.'
  issues:
  - severity: high
    issue: The phrase "zọpụta m n’oge awa a" does not render ἐκ adequately.
    rationale: The Igbo locative n’ means “in/at,” while Greek ἐκ denotes deliverance from or out of the hour. "Zọpụta m pụọ n’awa a" preserves the directional force.
  - severity: high
    issue: '"Ma ọ bụ n’ihi nke a" translates as “Or it is because of this.”'
    rationale: ἀλλὰ is adversative here. It should be rendered simply "Ma n’ihi nke a".
  - severity: medium
    issue: '"Oge awa" is redundant and weakens the repeated Johannine motif.'
    rationale: '"Awa" is the normal term for “hour”; using it in both clauses is concise, natural, and preserves the deliberate repetition.'
  - severity: low
    issue: '"nọ ná mwute" is narrower than τετάρακται.'
    rationale: It primarily suggests sadness, while the Greek denotes being inwardly troubled/agitated. "Mkpụrụ obi m erughị ala" more broadly conveys the disturbance.
  revised_text: Ugbu a, mkpụrụ obi m erughị ala[a], gịnịkwa ka m ga-ekwu? Nna, zọpụta m pụọ n’awa a. Ma n’ihi nke a ka m ji bịaruo awa a.
  revised_footnotes:
