id: JHN.12.27
reference: John 12:27
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Νῦν ἡ ψυχή μου τετάρακται, καὶ τί εἴπω; πάτερ, σῶσόν με ἐκ τῆς ὥρας ταύτης. ἀλλὰ διὰ τοῦτο ἦλθον εἰς τὴν ὥραν ταύτην.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/027.yaml
  text: Now my soul is troubled[a], and what should I say? Father, save me from this hour. But for this reason I came to this hour.
translation:
  language: ig
  text: Ugbu a, mkpụrụ obi m erughị ala[a], gịnịkwa ka m ga-ekwu? Nna, zọpụta m pụọ n’awa a. Ma n’ihi nke a ka m ji bịaruo awa a.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ: ‘Gịnị ka m ga-ekwu? “Nna, zọpụta m pụọ n’awa a”?’ A pụkwara ịgụ okwu Grik ahụ dịka ajụjụ nkwupụta kama dịka arịrịọ kpọmkwem.'
    reason: alternative_reading
lexical_decisions:
- source_word: Νῦν
  choice: Ugbu a
  rationale: Ọ na-egosi na nchekasị Jizọs bụ nke oge a kpọmkwem; okwu a bụkwa Igbo nkịtị ma doo anya.
- source_word: ψυχή
  choice: mkpụrụ obi m
  rationale: N’ebe a ọ na-ezo aka n’ime mmadụ Jizọs na ahụhụ ọ na-enwe; ‘mkpụrụ obi’ na-edobe ịdị arọ nke okwu Grik ahụ n’enweghị ịkọwa ya gabiga ókè.
- source_word: τετάρακται
  choice: nọ ná mwute
  rationale: Oge perfect passive na-egosi ọnọdụ dị ugbu a nke ọgba aghara kpatara. Nhọrọ a na-ekwu n’Igbo doro anya na ime Jizọs jupụtara ná nchekasị, n’agbanyeghị na ‘obi erughị ala’ bụkwa ụzọ ọzọ.
- source_word: τί εἴπω
  choice: gịnịkwa ka m ga-ekwu?
  rationale: Ọ na-ebute ajụjụ nke onye na-atụgharị uche n’ihe ọ ga-ekwu; usoro a bụ Igbo e ji ekwu okwu ugbu a.
- source_word: πάτερ
  choice: Nna
  rationale: Ọ bụ oku a na-akpọ Chineke ozugbo; ‘Nna’ bụ nsụgharị dị mfe ma dị ùgwù.
- source_word: σῶσόν με ἐκ τῆς ὥρας ταύτης
  choice: zọpụta m n’oge awa a
  rationale: Imperative ahụ na ἐκ na-arịọ ka a napụta ya pụọ n’ahụhụ nke oge ahụ. ‘Zọpụta m’ na-edobe ike nke σῴζω, ebe ‘n’oge awa a’ na-ezere Igbo siri ike nke ‘site n’awa a’.
- source_word: ὥρα
  choice: oge awa
  rationale: ‘Oge awa’ na-ada n’Igbo nke ọma ma ka na-edobe ihe atụ pụrụ iche Jọn ji ‘awa’ kwuo maka oge e kenyere Jizọs nke ahụhụ, ọnwụ, na otuto.
- source_word: ἀλλὰ διὰ τοῦτο
  choice: Ma ọ bụ n’ihi nke a
  rationale: Ọ na-egosi ntụgharị na ihe kpatara ya; usoro a na-edobe ma ọdịiche ma nkọwa ebumnuche dị n’okwu Grik.
- source_word: ἦλθον εἰς τὴν ὥραν ταύτην
  choice: ka m ji bịa ruo n’oge awa a
  rationale: ‘Bịa ruo’ na-egosi iru n’oge e kenyere ya ma ghara ịgbanwe εἰς ka ọ bụrụ naanị ‘maka’; usoro ‘ka m ji’ na-eme ka njikọ διὰ τοῦτο pụta ìhè.
theological_decisions:
- issue: Ma okwu ‘Nna, zọpụta m n’oge awa a’ bụ arịrịọ Jizọs kpọmkwem, ka ọ bụ ihe ọ jụrụ ma ọ ga-ekwu.
  choice: 'E dere ya dị ka arịrịọ kpọmkwem: ‘Nna, zọpụta m n’oge awa a.’'
  alternative: 'A pụrụ ịgụ ya dị ka ajụjụ nkwupụta: ‘Gịnị ka m ga-ekwu? “Nna, zọpụta m n’oge awa a”?’'
  rationale: Akara edemede adịghị n’ihe odide mbụ, ya mere ụzọ abụọ ahụ kwe omume. Akara SBLGNT na-ewere ya dị ka arịrịọ, nke okwu na-esochi ya ji ‘Ma’ tụgharịa. Ihe odide bụ isi na ndetu ala na-edobe esemokwu dị n’etiti ịla azụ n’ihu ahụhụ na ịnabata ozi ya.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A hapụrụ ‘mkpụrụ obi’ na ‘oge awa’ iji chekwaa ịdị arọ na isiokwu pụrụ iche nke okwu Jọn, ma e tinyere ndetu ala iji gosipụta mgbagwoju anya nke akara edemede Grik.
