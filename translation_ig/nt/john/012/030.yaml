  text: ἀπεκρίθη ⸂Ἰησοῦς καὶ εἶπεν⸃· Οὐ δι’ ἐμὲ ⸂ἡ φωνὴ αὕτη⸃ γέγονεν ἀλλὰ δι’ ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/030.yaml
  text: Jesus answered and said[a], “This voice has not come for my sake, but for yours.”
translation:
  language: ig
  text: Jizọs zara sị, “Ọ bụghị maka ọdịmma m ka olu a bịara, kama ọ bụ maka ọdịmma unu[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ịghọta ya dịka: “Ọ bụghị n’ihi m ka olu a bịara, kama ọ bụ n’ihi unu.” Okwu mmalite Grik a nwekwara ike igosi ihe kpatara ihe ji mee, ma n’ọnọdụ a, nghọta nke “maka” ma ọ bụ “maka ọdịmma” ka dabara adaba.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη … καὶ εἶπεν
  choice: zara sị
  rationale: Nkebi okwu Igbo a na-asụkarị na-ejigide ọrụ ngwaa abụọ ahụ n’akụkọ mkparịta ụka n’enweghị ime ka ahịrịokwu sie ike.
- source_word: φωνή
  choice: olu
  rationale: N’ọnọdụ a, ọ na-ezo aka n’okwu sitere n’eluigwe ndị mmadụ nụrụ, ya mere “olu” dabara karịa “ụda.”
- source_word: γέγονεν
  choice: bịara
  rationale: Perfect nke γίνομαι na-egosi na olu ahụ mere ma nsonaazụ ya ka dị; “bịara” bụ ụzọ Igbo dị mfe isi kwuo na olu ahụ pụtara ma ọ bụ mere.
- source_word: δι’ ἐμέ
  choice: n’ihi m
  rationale: Ọ na-enye ohere ịghọta διά dị ka ihe e mere maka mmadụ, ma ọ ka na-echekwa ohere nghọta nke ihe kpatara ya dịka asụsụ Grik si kwe.
- source_word: δι’ ὑμᾶς
  choice: n’ihi unu
  rationale: Ọ na-edobe myirịta ya na “n’ihi m” ma na-egosi na ndị na-ege ntị bụ ndị olu ahụ metụtara ma ọ bụ baara uru.
- source_word: Οὐ … ἀλλὰ
  choice: Ọ bụghị … kama
  rationale: Nke a na-edobe ọdịiche siri ike dị n’etiti nkebi okwu abụọ ahụ.
theological_decisions:
- issue: Ihe mere olu ahụ ji bịa na ndị ọ bụụrụ
  choice: A sụgharịrị διά + accusative n’ụzọ na-egosi na olu ahụ abụghị maka Jizọs kama ọ bụ maka ndị na-ege ntị.
  alternative: Enwere ike ịghọta ya dị ka na olu ahụ emeghị n’ihi Jizọs kama o mere n’ihi ndị ahụ.
  rationale: Ọnọdụ okwu a na-akwado nghọta nke uru ma ọ bụ ebumnuche, ma “n’ihi” na ihe odide ala peeji na-echekwa nghọta ọzọ nke ihe kpatara ya n’enweghị ịkwụsị esemokwu dị na Grik.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe ma dị ùgwù. “Zara sị” bụ usoro akụkọ a na-asụkarị; “ọ bụghị … kama” na-edobe nkwụrịta okwu Grik ahụ. E zere okwu ụka pụrụ iche ma hapụ ntakịrị nghọta abụọ dị na διά ka ọ dị.
