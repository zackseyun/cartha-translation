  naturalness: The verse is clear and natural in Standard Igbo. “Ya mere” adequately conveys the narrative connection of οὖν, though it is slightly more inferential than the Greek can sometimes be. No change is required for that connective in this context.
  terminology: “Ememme Ngabiga,” “Jizọs,” “Betani,” and “Lazarọs” are suitable Standard Igbo forms. The resurrection terminology is appropriate and does not impose an interpretation beyond the source.
