  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ὁ οὖν Ἰησοῦς πρὸ ἓξ ἡμερῶν τοῦ πάσχα ἦλθεν εἰς Βηθανίαν, ὅπου ἦν ⸀Λάζαρος, ὃν ἤγειρεν ἐκ νεκρῶν ⸀Ἰησοῦς.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/001.yaml
  text: So Jesus came to Bethany six days before the Passover[a], where Lazarus was, whom Jesus had raised from the dead.
translation:
  language: ig
  text: Ya mere, ụbọchị isii tupu Ememme Ngabiga, Jizọs bịara Betani, ebe Lazarọs nọ, onye Jizọs kpọlitere n’ọnwụ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ, n’ụzọ nkịtị karịa: “site n’etiti ndị nwụrụ anwụ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Ya mere
  rationale: Na-ejigide njikọ akụkọ a na ihe ndị bu ya ụzọ, n’asụsụ Igbo doro anya ma dịkwa ugbu a.
- source_word: πρὸ ἓξ ἡμερῶν τοῦ πάσχα
  choice: ụbọchị isii tupu Ememme Ngabiga
  rationale: Nke a na-egosipụta okwu oge Grik ahụ n’ụzọ Igbo sitere n’okike, ma na-akọwa πάσχα dị ka ememme ndị Juu a maara ama.
- source_word: ἦλθεν εἰς Βηθανίαν
  choice: bịara Betani
  rationale: “Bịara” bụ nsụgharị akụkọ kwesịrị ekwesị maka ἦλθεν; “Betani” bụ ide aha ebe ahụ n’usoro Igbo.
- source_word: ὅπου ἦν Λάζαρος
  choice: ebe Lazarọs nọ
  rationale: Na-edobe naanị ihe Grik kwuru banyere ebe Lazarọs nọ, n’etinyeghị echiche na ọ bi ebe ahụ ma ọ bụ na ọ nọ ebe ahụ nwa oge.
- source_word: ἤγειρεν ἐκ νεκρῶν
  choice: kpọlitere n’ọnwụ
  rationale: Okwu Igbo a bụ ụzọ nkịtị isi kwuo na e mere ka onye nwụrụ anwụ bilie; ihe odide ala peeji na-echekwa nkọwa nkịtị karị nke ἐκ νεκρῶν.
- source_word: Ἰησοῦς
  choice: Jizọs
  rationale: E debere aha Jizọs ugboro nke abụọ dịka isi mmalite Grik si mee, kama iji nnọchiaha dochie ya.
theological_decisions:
- issue: Okwu mbilite n’ọnwụ gbasara Lazarọs
  choice: onye Jizọs kpọlitere n’ọnwụ
  alternative: onye ọ kpọlitere n’ọnwụ
  rationale: Grik kpọrọ aha Jizọs ọzọ na ngwụcha nkebiokwu ahụ. Idebe aha ya na-egosi n’ụzọ doro anya na Jizọs bụ onye kpọlitere Lazarọs, n’enweghị ibelata nkwusi ike nke isi mmalite ahụ.
- issue: Nkọwa nke ἐκ νεκρῶν
  choice: n’ọnwụ, tinyere nkọwa nkịtị karị n’ala peeji
  alternative: si n’etiti ndị nwụrụ anwụ
  rationale: Isi okwu ahụ na-eji okwu Igbo dị mfe ma bụrụ nke a na-aghọta ngwa ngwa; nkọwa ala peeji na-echekwa echiche Grik nke isi “n’etiti ndị nwụrụ anwụ” pụta.
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe dị ugbu a, dị nsọ ma dị mfe nghọta. E ji “Ememme Ngabiga” mee ka aha ememme ahụ doo onye na-agụ ya anya, ma e dekwara aha ndị mmadụ na ebe n’usoro Igbo a na-ejikarị.
