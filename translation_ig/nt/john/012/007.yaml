  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἶπεν οὖν ὁ Ἰησοῦς· Ἄφες αὐτήν, ⸀ἵνα εἰς τὴν ἡμέραν τοῦ ἐνταφιασμοῦ μου ⸀τηρήσῃ αὐτό·
base_translation:
  language: en
  yaml_path: translation/nt/john/012/007.yaml
  text: So Jesus said[a], “Leave her alone[b], so that she may keep it for the day of my burial.”
translation:
  language: ig
  text: Ya mere, Jizọs sịrị[a], “Hapụ ya[b], ka o debe ya maka ụbọchị olili m.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Hapụ ya; o debere ya maka ụbọchị olili m.” Ụfọdụ na-aghọta nkebiokwu a dị ka ihe ọ merela, ọ bụghị ihe ọ ka ga-eme.
    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ, “Hapụ ya, ka o debe ya ruo ụbọchị olili m.” A pụkwara ịghọta nhazi okwu Grik ahụ dị ka nke na-egosi oge n'ụzọ doro anya karị.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Ya mere
  rationale: Ọ na-egosi njikọ nke ihe a na ihe e kwuru ma ọ bụ mere tupu ya, ma na-ada nke ọma n'Igbo ugbu a.
- source_word: Ἄφες αὐτήν
  choice: Hapụ ya aka
  rationale: N'ọnọdụ a, iwu ahụ pụtara ka a kwụsị inye nwanyị ahụ nsogbu; okwu a bụ Igbo doro anya ma dịkwa ndụ.
- source_word: ἵνα
  choice: ka
  rationale: Ọ na-ejikọta iwu ahụ na ebumnuche ma ọ bụ ihe a chọrọ ka ọ pụta na ya, n'ụzọ dabara adaba n'Igbo.
- source_word: εἰς τὴν ἡμέραν
  choice: maka ụbọchị
  rationale: Ọ na-atụ aka n'ụbọchị ahụ dị n'ihu dị ka oge e zubere ihe ahụ maka ya, n'ebughị ụzọ kpebie na ọ pụtara kpọmkwem ‘ruo ụbọchị ahụ.’
- source_word: ἐνταφιασμοῦ
  choice: olili
  rationale: Nke a bụ okwu Igbo nkịtị ma doo anya maka ili mmadụ, na-enweghị iji okwu nka siri ike.
- source_word: τηρήσῃ
  choice: o debe
  rationale: Ọ na-enye nghọta nke ichekwa ma ọ bụ idowe ihe maka oge e kwuru, ma na-edobe ya dị ka nkebiokwu ebumnuche.
- source_word: αὐτό
  choice: ya
  rationale: Ọ na-edobe nnọchiaha Grik ahụ, nke na-ezo aka n'ihe otite ahụ, n'etinyeghị aha ọzọ na-adịghị na ahịrịokwu ahụ.
theological_decisions:
- issue: Ihe okwu Jizọs banyere otite ahụ pụtara n'ihe gbasara ọnwụ na olili ya
  choice: A sụgharịrị ya dị ka iwu ka nwanyị ahụ debe ya maka ụbọchị olili Jizọs, si otú ahụ debe ntụaka ahụ na olili ya nke na-abịa.
  alternative: A pụkwara ịghọta ya dị ka, “O debere ya maka ụbọchị olili m,” ma ọ bụ, “Ka o debe ya ruo ụbọchị olili m.”
  rationale: Nhazi ahịrịokwu Grik a siri ike, a pụkwara ịghọta ya n'ụzọ karịrị otu. Isi nsụgharị ahụ na-agbaso ike nkịtị nke Ἄφες… ἵνα… τηρήσῃ, ebe nkọwa ndị dị n'okpuru na-edobe nghọta ndị ọzọ n'emeghị ka esemokwu dị n'okwu ahụ funahụ.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, dị ugwu ma dị mfe nghọta. “Hapụ ya aka” bụ okwu Igbo nkịtị nke na-egosipụta iwu ka a kwụsị inye ya nsogbu. E debere nghọta abụọ nke ahịrịokwu Grik siri ike na nkọwa ala peeji kama idozi mgbagwoju anya ahụ n'otu ụzọ naanị.
