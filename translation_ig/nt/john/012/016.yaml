id: JHN.12.16
reference: John 12:16
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸀ταῦτα οὐκ ἔγνωσαν ⸂αὐτοῦ οἱ μαθηταὶ⸃ τὸ πρῶτον, ἀλλ’ ὅτε ἐδοξάσθη Ἰησοῦς τότε ἐμνήσθησαν ὅτι ταῦτα ἦν ἐπ’ αὐτῷ γεγραμμένα καὶ ταῦτα ἐποίησαν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/016.yaml
  text: His disciples did not understand these things at first[a], but when Jesus was glorified[c][b], then they remembered that these things had been written about him and that they had done these things to him.
translation:
  language: ig
  text: Na mbụ, ndị na-eso ụzọ ya aghọtaghị ihe ndị a,[a] ma mgbe e nyere Jizọs otuto,[b] mgbe ahụ ka ha chetara na e deela ihe ndị a banyere ya,[c] nakwa na ha mere ya ihe ndị a.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị na-eso ụzọ ya amaghị ihe ndị a na mbụ.”
    reason: lexical_alternative
  - marker: b
    text: N'akwụkwọ Jọn, ‘e nyere otuto’ na-ezokarị aka n'inye Jizọs otuto site n'ọnwụ ya, mbilite n'ọnwụ ya, na mbuli ya elu.
    reason: cross_reference
  - marker: c
    text: Ma ọ bụ, “e deela ihe ndị a gbasara ya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔγνωσαν
  choice: aghọtaghị
  rationale: N'ọnọdụ a, okwu ahụ na-egosi na ndị na-eso ụzọ ya aghọtaghị ihe ihe omume ndị ahụ pụtara, ọ bụghị naanị na ha amaghị eziokwu ụfọdụ.
- source_word: αὐτοῦ οἱ μαθηταί
  choice: ndị na-eso ụzọ ya
  rationale: Nke a bụ ụzọ Igbo nkịtị na nke doro anya si egosi mmekọrịta ahụ.
- source_word: τὸ πρῶτον
  choice: Ná mmalite
  rationale: Ọ bụ okwu oge pụtara ‘na mbụ’ ma ọ bụ ‘na mmalite’; nhọpụta a na-agụ nke ọma n'Igbo.
- source_word: ἐδοξάσθη
  choice: e nyere Jizọs otuto
  rationale: Ọ na-edobe echiche nke δοξάζω na Jọn n'ebughị ụzọ kọwaa ya naanị dị ka ịkwanyere ugwu ma ọ bụ ibuli elu.
- source_word: ἐμνήσθησαν
  choice: ha chetara
  rationale: Ọ bụ ntụgharị Igbo nkịtị nke na-egosi na ihe ahụ bịara ha n'uche mgbe e mesịrị.
- source_word: ἐπ’ αὐτῷ γεγραμμένα
  choice: e deela ihe ndị a banyere ya
  rationale: ‘Banyere ya’ na-egosipụta ἐπί na dative ebe a dị ka ihe e dere gbasara Jizọs; ‘e deela’ na-egosi na odide ahụ dị tupu ncheta ha.
- source_word: ταῦτα ἐποίησαν αὐτῷ
  choice: ha mere ya ihe ndị a
  rationale: Nhazi a na-edobe αὐτῷ na nkwughachi nke ‘ihe ndị a,’ na-ahapụghị onye ‘ha’ na-anọchi anya ya ka ntụgharị kọwaa ya karịa isi mmalite.
- source_word: ταῦτα
  choice: ihe ndị a
  rationale: Ọ na-edobe neuter plural na nkwughachi nke jikọtara ihe ndị e mere na ihe e dere.
theological_decisions:
- issue: Ihe ‘e nyere Jizọs otuto’ pụtara n'akwụkwọ Jọn
  choice: E debere okwu otuto n'ekwughị kpọmkwem ma ọ bụ ọnwụ, mbilite n'ọnwụ, mbuli elu, ma ọ bụ ha niile ọnụ.
  alternative: mgbe e buliri Jizọs elu
  rationale: Asụsụ otuto na Jọn nwere ọtụtụ akụkụ; ntụgharị ahụ kwesịrị idobe obosara na esemokwu nkà mmụta okpukpe ahụ kama idozi ya n'otu ụzọ.
translation_notes:
  register: Standard Igbo dị ugbu a, nke kwesịrị ekwesị ma dị mfe nghọta. E ji ‘ndị na-eso ụzọ’ mee disciples, ‘otuto’ mee glory, ma debe nkwughachi ‘ihe ndị a’ dị n'isi mmalite. E debere akara nkọwa ụkwụ niile n'ahịrịokwu n'usoro [a], [b], [c].
