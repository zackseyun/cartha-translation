id: JHN.12.11
reference: John 12:11
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὅτι πολλοὶ δι’ αὐτὸν ὑπῆγον τῶν Ἰουδαίων καὶ ἐπίστευον εἰς τὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/011.yaml
  text: because many of the Jews were going away because of him and were believing in Jesus[a][b][c][d].
translation:
  language: ig
  text: n’ihi na ọtụtụ n’ime ndị Juu[a] nọ na-apụ[b] n’ihi ya,[c] na-ekwerekwa na Jizọs.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “ndị Judia.” N’Oziọma Jọn, okwu a nwere ike ịpụta ndị Juu n’ozuzu ha, ndị Judia, ma ọ bụ mgbe ụfọdụ ndị isi ndị Juu, dabere n’ihe a na-ekwu maka ya.
    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ, “na-ahapụ” ma ọ bụ “na-esi n’ebe ahụ pụọ.” Ngwaa Grik ahụ na-egosi omume na-aga n’ihu ma ọ bụ na-eme ugboro ugboro.
    reason: lexical_alternative
  - marker: c
    text: “Ya” na-ezo aka na Lazarọs.
    reason: referent_clarification
  - marker: d
    text: Ma ọ bụ, “na-atụkwasị Jizọs obi” ma ọ bụ “na-etinye okwukwe ha na Jizọs.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: n’ihi na
  rationale: Introduces the cause of the chief priests’ intention stated in the preceding verse and naturally preserves the Greek causal force.
- source_word: πολλοὶ … τῶν Ἰουδαίων
  choice: ọtụtụ n’ime ndị Juu
  rationale: The partitive expression makes clear that this concerns many from within the Jewish population, not all Jews without exception.
- source_word: δι’ αὐτὸν
  choice: n’ihi ya
  rationale: With διά plus the accusative, the phrase is causal here. The pronoun is retained rather than replaced in the main text, preserving the Greek form and its reference to Lazarus in context.
- source_word: ὑπῆγον
  choice: nọ na-apụ
  rationale: The progressive construction reflects the imperfect’s ongoing or repeated aspect. ‘Na-apụ’ preserves the idea of going away without explicitly supplying an object absent from the Greek.
- source_word: ἐπίστευον εἰς τὸν Ἰησοῦν
  choice: na-ekwerekwa na Jizọs
  rationale: Preserves ongoing belief directed toward Jesus without expanding it into becoming disciples or being saved.
theological_decisions:
- issue: Meaning of Ἰουδαίων in Johannine context
  choice: ndị Juu
  alternative: ndị Judia; ndị isi ndị Juu
  rationale: The main wording retains the broad ethnic designation while ‘ọtụtụ n’ime’ clearly marks a subset. A footnote preserves the possible geographical nuance without narrowing the referent to authorities, which the verse itself does not explicitly do.
- issue: Force of πιστεύω εἰς
  choice: na-ekwere na Jizọs
  alternative: na-atụkwasị Jizọs obi; na-etinye okwukwe ha na Jizọs
  rationale: The wording expresses belief or trust directed toward Jesus while avoiding doctrinal conclusions not explicitly stated in the verse.
- issue: Referent of δι’ αὐτόν
  choice: n’ihi ya
  alternative: n’ihi Lazarọs
  rationale: The pronoun is formally retained in the text, while a note identifies Lazarus as its contextual referent.
translation_notes:
  register: Standard Igbo in a natural, dignified modern register. The progressive ‘nọ na-apụ’ and ‘na-ekwerekwa’ convey the two imperfect verbs without making the sentence cumbersome. The wording avoids collective blame by retaining the explicit partitive sense, ‘ọtụtụ n’ime ndị Juu.’
