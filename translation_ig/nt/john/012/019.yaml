- from: N’ihi ya, ndị Farisii gwara ibe ha, sị, “Unu na-ahụ na ihe unu na-eme adịghị aba uru ọ bụla. Lee—ụwa[a] esorola ya gawa.”
  to: N’ihi ya, ndị Farisii gwara ibe ha, sị, “Unu na-ahụ na ihe unu na-eme adịghị aba uru ọ bụla. Lee—ụwa[a] agbasoola ya.”
  rationale: The revision changes only the final verbal expression to “agbasoola ya,” which conveys going after/following Jesus without importing an added departure or accompaniment sense. The footnote retains the lexical alternative and clarifies the hyperbolic force without narrowing κόσμος in the main text.
  reviewer_model: gpt-5.6-terra
