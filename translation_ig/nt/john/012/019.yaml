  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οἱ οὖν Φαρισαῖοι εἶπαν πρὸς ἑαυτούς· Θεωρεῖτε ὅτι οὐκ ὠφελεῖτε οὐδέν· ἴδε ὁ ⸀κόσμος ὀπίσω αὐτοῦ ἀπῆλθεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/019.yaml
  text: So the Pharisees said to one another[a], “You see that you are accomplishing nothing. Look—the world has gone after him.”
translation:
  language: ig
  text: N’ihi ya, ndị Farisii gwara ibe ha, sị, “Unu na-ahụ na ihe unu na-eme adịghị aba uru ọ bụla. Lee—ụwa[a] agbasoola ya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “mmadụ niile agbasoola ya.” Grik kwuru “ụwa”; o yikarịrị ka nke a bụ ikwubiga okwu ókè.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: N’ihi ya
  rationale: Ọ na-egosi ihe sitere n’ihe mere n’amaokwu ndị bu ya ụzọ pụta; okwu a na-eme ka njikọ ahụ doo anya n’Igbo.
- source_word: πρὸς ἑαυτούς
  choice: gwara ibe ha
  rationale: N’ebe a, okwu Grik ahụ nwere nghọta nke ndị nọ n’otu ahụ ịgwa ibe ha okwu, ọ bụghị onye ọ bụla ịgwa onwe ya.
- source_word: Θεωρεῖτε
  choice: Unu na-ahụ
  rationale: Ọ bụ ngwaa dị n’ụdị na-egosi ihe a na-eme, nke dị n’ọnụọgụ ọtụtụ. Ọ na-egosipụta nkwupụta iwe na nkụda mmụọ ha, kama ịbụ naanị iwu ka ha lee anya.
- source_word: οὐκ ὠφελεῖτε οὐδέν
  choice: ihe unu na-eme adịghị aba uru ọ bụla
  rationale: Nke a na-ekwupụta na mgbalị ha niile enweghị ihe ọ na-arụpụta. Nsụgharị a bụ Igbo ebumpụta ụwa ma na-edebe echiche nke enweghị uru.
- source_word: ἴδε
  choice: Lee
  rationale: Ọ bụ mkpu e ji adọta uche n’ihe a na-ekwu ozugbo; “Lee” na-edebe ike okwu ahụ n’Igbo.
- source_word: κόσμος
  choice: ụwa
  rationale: A hapụrụ ihe okwu Grik ahụ pụtara n’ụzọ nkịtị, ma ihe odide ala na-akọwa na ọ ga-abụ ikwubiga okwu ókè.
- source_word: ὀπίσω αὐτοῦ ἀπῆλθεν
  choice: esorola ya gawa
  rationale: N’Igbo, nke a na-egosi nke ọma na ndị mmadụ agbasowo ya, ma na-edebekwa echiche nke ngagharị na nsonaazụ nke pụtara ìhè ugbu a.
theological_decisions:
- issue: Oke ndị okwu κόσμος (“ụwa”) na-emetụta n’okwu ndị Farisii
  choice: E debere “ụwa” n’ahịrịokwu bụ isi dị ka ikwubiga okwu ókè.
  alternative: “onye ọ bụla” ma ọ bụ “ìgwè mmadụ niile”
  rationale: Ndị Farisii kwuru ya n’ihi iwe na nkụda mmụọ; ha ekwughị na mmadụ niile n’ụwa aghọọla ndị na-eso Jizọs. Idebe “ụwa” na-echekwa okwu Grik na ụda pụrụ iche o nwere n’Oziọma Jọn, n’enweghị ime ya nkwupụta ozizi banyere mmadụ niile.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ugwu ma dị mfe nghọta. “Gwara ibe ha, sị” bụ usoro Igbo ebumpụta ụwa; “esorola ya gawa” na-egosipụta ma iso mmadụ ma nsonaazụ nke ndị Farisii na-ahụ ugbu a.
