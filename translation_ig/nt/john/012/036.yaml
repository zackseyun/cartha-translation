source:
  edition: SBLGNT
  text: ⸀ὡς τὸ φῶς ἔχετε, πιστεύετε εἰς τὸ φῶς, ἵνα υἱοὶ φωτὸς γένησθε. Ταῦτα ⸀ἐλάλησεν Ἰησοῦς, καὶ ἀπελθὼν ἐκρύβη ἀπ’ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/036.yaml
  text: While you have the light[a], believe in the light, so that you may become sons of light. Jesus spoke these things[b], and he departed and hid from them.
translation:
  language: ig
  text: Mgbe unu ka nwere ìhè ahụ, kwere n’ìhè ahụ, ka unu wee ghọọ ụmụ ìhè.[a] Jizọs kwuru ihe ndị a, wee pụọ zoo onwe ya n’ebe ha nọ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’asụsụ Grik, ọ bụ “ụmụ ndị ikom nke ìhè”; ọ bụ akpaalaokwu maka ndị e ji ìhè mara.
    reason: lexical_alternative
  - marker: b
    text: 'A pụkwara ịsụgharị akụkụ ikpeazụ a: “mgbe ọ pụsịrị, o zoro onwe ya n’ebe ha nọ.”'
    reason: previous_rendering
lexical_decisions:
- source_word: ὡς τὸ φῶς ἔχετε
  choice: Mgbe unu ka nwere ìhè ahụ
  rationale: “Mgbe ... ka” na-egosi oge ihe ahụ ka dị, ma na-echekwa ngwa ngwa dị n’ịdọ aka ná ntị ahụ. E debere article dị na τὸ φῶς site n’iji “ìhè ahụ.”
- source_word: πιστεύετε εἰς τὸ φῶς
  choice: kwere n’ìhè ahụ
  rationale: Nke a bụ ụzọ Igbo dị mkpirikpi ma bụrụkwa nke nkịtị isi kwupụta iwu πιστεύετε na njikọ εἰς, n’enweghị ịgbakwunye nkọwa okpukpe na-adịghị n’ederede.
- source_word: ἵνα υἱοὶ φωτὸς γένησθε
  choice: ka unu wee ghọọ ụmụ ìhè
  rationale: “Ka ... wee” na-egosi ebumnuche ma ọ bụ ihe ga-esi na ya pụta; “ghọọ” na-echekwa echiche γίνομαι nke ịghọ ihe. “Ụmụ ìhè” bụ akpaalaokwu Igbo kwere nghọta nke na-anọchi anya ndị ìhè ji mara.
- source_word: Ταῦτα ἐλάλησεν Ἰησοῦς
  choice: Jizọs kwuru ihe ndị a
  rationale: Usoro okwu a bụ Igbo ebumpụta ụwa, ebe “kwuru” na-ekwupụta λαλέω nke ọma n’akụkọ a.
- source_word: ἀπελθὼν ἐκρύβη ἀπ’ αὐτῶν
  choice: wee pụọ zoo onwe ya n’ebe ha nọ
  rationale: Ngwaa ndị so ibe ha na-egosi na ọ pụtara tupu ya ezoo onwe ya. “Zoo onwe ya” na-enye ụdị passive ahụ nghọta middle-like dabara n’omume Jizọs mere.
theological_decisions:
- issue: Akpaalaokwu nwoke dị na υἱοὶ φωτός
  choice: ụmụ ìhè
  alternative: ụmụ ndị ikom nke ìhè
  rationale: Igbo anaghị ekewa “ụmụ” n’ụdị nwoke na nwanyị dịka Greek υἱοί si eme. “Ụmụ ìhè” na-echekwa akpaalaokwu nke ndị ìhè ji mara ma na-ezere okwu Igbo siri ike ma ọ bụ nke nwere ike ịpụta naanị ụmụ nwoke; ihe Greek kwuru n’ụdị nkịtị ka e gosiri na nkọwa ala peeji.
- issue: Okwu Jọn πιστεύω εἰς
  choice: kwere n’ìhè ahụ
  alternative: tụkwasị ìhè ahụ obi
  rationale: “Kwere n’...” na-echekwa okwu Jọn na-eji akpọ mmadụ ka o nwee okwukwe, n’enweghị ịkọwa “ìhè ahụ” n’ụzọ ga-emechi nghọta ya sara mbara n’amaokwu a.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. E debere “ìhè ahụ” ugboro abụọ iji chekwaa isiokwu ìhè pụrụ iche nke dị n’Oziọma Jọn. Usoro “wee pụọ zoo onwe ya” bụ akụkọ Igbo na-aga were were ma ka na-egosi usoro omume abụọ ahụ.
