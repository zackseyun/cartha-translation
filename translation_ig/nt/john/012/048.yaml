  text: ὁ ἀθετῶν ἐμὲ καὶ μὴ λαμβάνων τὰ ῥήματά μου ἔχει τὸν κρίνοντα αὐτόν· ὁ λόγος ὃν ἐλάλησα ἐκεῖνος κρινεῖ αὐτὸν ἐν τῇ ἐσχάτῃ ἡμέρᾳ·
base_translation:
  language: en
  yaml_path: translation/nt/john/012/048.yaml
  text: 'The one who rejects me and does not receive my words has one who judges him: the word that I spoke will judge him on the last day[a][b].'
translation:
  language: ig
  text: 'Onye na-ajụ m ma ọ naghị anabata okwu m[a] nwere onye na-ekpe ya ikpe: okwu ahụ[b] m kwuru ga-ekpe ya ikpe n’ụbọchị ikpeazụ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịtụgharị ya, “ọ naghị anabata okwu m.” Ngwaa Grik ahụ nwere ike ịpụta ịnata, ịnabata, ma ọ bụ ịkpọbata nke ọma.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịtụgharị ya, “ozi ahụ.” Okwu Grik bụ logos nwere ike ịpụta “okwu” ma ọ bụ “ozi,” dịka ọnọdụ okwu si dị.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀθετῶν
  choice: na-ajụ
  rationale: “Na-ajụ” na-egosi ịjụ Jizọs ma ghara ịnakwere ya; ọ dị mfe nghọta ma sie ike karịa nanị ileghara ya anya.
- source_word: μὴ λαμβάνων τὰ ῥήματά μου
  choice: ọ naghị anabata okwu ndị m kwuru
  rationale: “Anabata” nwere ike igosi ịnata, ịnabata, ma ọ bụ ikwere okwu e nyere mmadụ. “Okwu ndị m kwuru” na-eme ka ụbara ῥήματα na ọdịdị okwu e kwuru pụta ìhè.
- source_word: ἔχει τὸν κρίνοντα αὐτόν
  choice: nwere onye na-ekpe ya ikpe
  rationale: Nke a na-edobe usoro ahịrị Grik nke na-ekwu na onye ahụ nwere onye na-ekpe ya ikpe, tupu ahịrịokwu ahụ akọwaa onye ma ọ bụ ihe ahụ.
- source_word: ὁ λόγος
  choice: okwu ahụ
  rationale: “Okwu ahụ” na-edobe λόγος dị ka otu okwu ma na-ezo aka n’ozi Jizọs kwuru; ihe ngosi “ahụ” na-enyekwa ya nkwusi ike.
- source_word: κρινεῖ
  choice: ga-ekpe ya ikpe
  rationale: Nke a na-edobe echiche sara mbara nke ikpe ikpe, n’etinyeghị “ịma ya ikpe” nke ga-akọwapụta nsonaazụ karịa ihe ngwaa Grik kwuru.
- source_word: ἐν τῇ ἐσχάτῃ ἡμέρᾳ
  choice: n’ụbọchị ikpeazụ
  rationale: Nke a bụ ụzọ Igbo doro anya ma dịkwa ebube isi kwuo oge ikpeazụ ahụ, n’etinyeghị nkọwa ozizi ọzọ.
theological_decisions:
- issue: Ihe ma ọ bụ onye na-ekpe ikpe n’amaokwu a
  choice: E debere okwu Jizọs kwuru dị ka nke ga-ekpe onye jụrụ ya ikpe n’ụbọchị ikpeazụ.
  alternative: Ịkọwa okwu ahụ naanị dị ka ụkpụrụ Jizọs n’onwe ya ga-eji kpee ikpe, ma ọ bụ ịkọwa ya dị ka onye e mere ka ọ bụrụ mmadụ n’ụzọ zuru ezu.
  rationale: Usoro okwu Grik buru ụzọ kwuo na onye ahụ “nwere onye na-ekpe ya ikpe,” mesịa kpọọ “okwu ahụ m kwuru” dị ka nke ga-ekpe ya ikpe. Nsụgharị ahụ edozighị esemokwu a site n’ịgwakọta ya na ebe ndị ọzọ Jọn kwuru banyere ọrụ Ọkpara n’ikpe ikpe.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E debere nkwughachi nke “okwu” iji gosipụta njikọ dị n’etiti ῥήματα na λόγος, ebe e jikwa “okwu ndị m kwuru” mee ka ụbara nke mbụ pụta ìhè.
