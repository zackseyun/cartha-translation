  text: ἐποίησαν οὖν αὐτῷ δεῖπνον ἐκεῖ, καὶ ἡ Μάρθα διηκόνει, ὁ δὲ Λάζαρος εἷς ἦν ⸀ἐκ τῶν ἀνακειμένων σὺν αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/john/012/002.yaml
  text: So they made a dinner for him there[a], and Martha was serving, but Lazarus was one of those reclining at the table with him.
translation:
  language: ig
  text: Ya mere, ha kwadebere ya nri anyasị n’ebe ahụ. Mata na-eje ozi, ma Lazarọs bụ otu n’ime ndị soro Jizọs dina n’akụkụ tebụl.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'N’ụzọ kwekọrọ nnọọ n’okwu Grik: “otu n’ime ndị ya na ya dinara.” N’oge ahụ, ndị mmadụ na-edina n’akụkụ tebụl mgbe ha na-eri nri pụrụ iche.'
    reason: cultural_note
lexical_decisions:
- source_word: ἐποίησαν
  choice: ha kwadebere
  rationale: N’ịbụ ya na δεῖπνον, ngwaa a pụtara ịkwadebe nri; “kwadebere” bụ Igbo doro anya ma ọ naghị ekwu kpọmkwem ndị bụ ndị ọbịa.
- source_word: οὖν
  choice: Ya mere
  rationale: Ọ na-ejikọta ihe a na ihe bu ya ụzọ ma na-egosi nsonaazụ ma ọ bụ ịga n’ihu n’akụkọ.
- source_word: αὐτῷ
  choice: ya
  rationale: N’usoro “kwadebere ya nri,” ọ na-egosi na ọ bụ maka Jizọs ka e mere nri ahụ.
- source_word: δεῖπνον
  choice: nri anyasị
  rationale: Ọ na-ezo aka n’isi nri nke ụbọchị, nke a na-erikarị ná mgbede; okwu a bụ nke nkịtị ma dị mfe nghọta.
- source_word: ἐκεῖ
  choice: n’ebe ahụ
  rationale: Ọ bụ okwu ebe nke na-alaghachi Betani n’ihe gbara amaokwu a gburugburu.
- source_word: διηκόνει
  choice: nọkwa na-eje ozi
  rationale: Oge imperfect na-egosi ọrụ na-aga n’ihu; n’ọnọdụ nri a, ọ pụtara ijere ndị nọ ebe ahụ ozi.
- source_word: δὲ
  choice: ma
  rationale: Ọ na-egosi obere ọdịiche dị n’etiti Mata nke na-eje ozi na Lazarọs nke so ndị nọ na-eri nri.
- source_word: εἷς ἦν ἐκ
  choice: bụ otu n’ime
  rationale: Ọ na-akọwa Lazarọs dịka otu onye n’ime ìgwè ndị ha na Jizọs nọ na nri ahụ.
- source_word: ἀνακειμένων
  choice: ndị ... nọ na-eri nri ka ha dina n’akụkụ tebụl
  rationale: Ọ na-echekwa ma ọnọdụ iri nri ahụ ma omenala nke ịdina n’akụkụ tebụl, n’ụzọ onye Igbo nke oge a ga-aghọta.
- source_word: σὺν αὐτῷ
  choice: ha na ya
  rationale: Ọ na-egosi na ndị ahụ so Jizọs rie nri.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke oge a, dị ùgwù ma dị mfe nghọta. E debere ọdịiche dị n’etiti ọrụ Mata na ọnọdụ Lazarọs, ma kọwaa omenala ịdina n’akụkụ tebụl n’ala ala peeji.
