  text: ἔρχεται ⸀ὁ Φίλιππος καὶ λέγει τῷ Ἀνδρέᾳ· ⸀ἔρχεται Ἀνδρέας καὶ Φίλιππος ⸀καὶ λέγουσιν τῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/022.yaml
  text: Philip comes and tells Andrew[a]; Andrew and Philip come and tell Jesus.
translation:
  language: ig
  text: Filip abịakwute Andru ma gwa ya[a]; Andru na Filip abịakwute Jizọs ma gwa ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’asụsụ Grik, ngwaa ndị dị n’amaokwu a niile nọ n’oge dị ugbu a (“abịakwute … gwa … abịakwute … gwa”), ọ bụ ezie na ha na-akọ ihe mere n’oge gara aga. Nke a bụ usoro a na-ahụkarị n’akụkọ, nke na-eme ka ihe a na-akọ dị ka à ga-asị na ọ na-eme ugbu a.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχεται
  choice: abịakwute
  rationale: A họọrọ “abịakwute” iji gosi ngagharị Filip bịakwuru Andru. E jikwaara ya n'oge dị ugbu a iji chekwaa historical present nke akụkọ Grik.
- source_word: λέγει
  choice: gwa ya
  rationale: “Gwa ya” bụ ụzọ Igbo nkịtị si egosipụta ịkọrọ mmadụ ihe; “ya” na-ezo aka n’Andru ma mee ka ahịrịokwu ahụ zuo oke n’Igbo.
- source_word: Ἀνδρέᾳ
  choice: Andru
  rationale: E degharịrị aha mmadụ ahụ n’ụdị a na-ejikarị ede ya n’Igbo.
- source_word: ἔρχεται
  choice: abịakwute
  rationale: N’ahịrịokwu nke abụọ, okwu a ka nọ n'oge dị ugbu a, ebe Andru na Filip bụ ndị na-abịakwute Jizọs.
- source_word: λέγουσιν
  choice: gwa ya
  rationale: Ụdị ngwaa a bụ nke ọtụtụ mmadụ; isiokwu “Andru na Filip” na-egosi ọnụọgụ ahụ, ebe “gwa ya” bụ okwu Igbo dị mfe ma kwekọọ n’ọrụ nkwurịta okwu nke ngwaa Grik.
- source_word: τῷ Ἰησοῦ
  choice: Jizọs
  rationale: E degharịrị aha ahụ n’ụdị Igbo; “ya” sochiri ngwaa na-anọchi Jizọs dị ka onye a gwara okwu.
- source_word: καί
  choice: na; ;
  rationale: Mgbe ọ na-ejikọta aha, a sụgharịrị ya “na.” N’etiti nkebi ahịrịokwu, e ji akara semicolon mee ka usoro akụkọ dị mfe ghara ịgbakwunye echiche oge ma ọ bụ ihe kpatara nke na-adịghị n’akwụkwọ Grik.
- source_word: ὁ Φίλιππος
  choice: Filip
  rationale: E degharịrị aha mmadụ ahụ n’ụdị Igbo. E nyeghị article Grik ahụ okwu pụrụ iche n’Igbo n’ihi na ọ naghị egosi ihe pụrụ iche n’ebe a.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke oge a ma dị ùgwù. E chekwara historical present nke Grik n’amaokwu niile. A họọrọ “abịakwute” kama “bịa” naanị ya iji mee ka onye a na-abịakwuru doo anya ma mee ka okwu ahụ bụrụ nke e ji ọnụ ekwu n’ụzọ ebumpụta ụwa.
