- from: Ya mere, ndị a bịakwutere Filip[a], onye si Betsaida nke Galili, na-arịọ ya, sị, “Onyenwe anyị, anyị chọrọ ịhụ Jizọs.”
  to: Ya mere, ndị a bịakwutere Filip[a], onye si Betsaida dị na Galili, na-arịọ ya, sị, “Nna anyị ukwu, anyị chọrọ ịhụ Jizọs.”
  rationale: The revision keeps the Greek ambiguity without implying that Philip is being confessed as “our Lord.” It uses a natural Standard Igbo respectful address in the narrative context and retains the lexical “Lord” reading in the footnote. The geographical phrase is also made more idiomatic in modern Igbo.
  reviewer_model: gpt-5.6-terra
