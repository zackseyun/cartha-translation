    text: Ma ọ bụ, “Onyenwe anyị.” Okwu Grik κύριε pụrụ ịbụ aha nkwanye ùgwù e ji agwa mmadụ okwu, dịka “Nna anyị ukwu,” ma ọ pụkwara ịpụta “Onyenwe anyị.”
    reason: alternative_reading
