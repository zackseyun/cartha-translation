id: JHN.12.21
reference: John 12:21
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οὗτοι οὖν προσῆλθον Φιλίππῳ τῷ ἀπὸ Βηθσαϊδὰ τῆς Γαλιλαίας, καὶ ἠρώτων αὐτὸν λέγοντες· Κύριε, θέλομεν τὸν Ἰησοῦν ἰδεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/021.yaml
  text: So these came to Philip[a], who was from Bethsaida in Galilee, and were asking him, saying, “Lord, we want to see Jesus.”
translation:
  language: ig
  text: Ya mere, ndị a bịakwutere Filip[a], onye si Betsaida dị na Galili, na-arịọ ya, sị, “Nna anyị ukwu, anyị chọrọ ịhụ Jizọs.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Onyenwe anyị.” Okwu Grik κύριε pụrụ ịbụ aha nkwanye ùgwù e ji agwa mmadụ okwu, dịka “Nna anyị ukwu,” ma ọ pụkwara ịpụta “Onyenwe anyị.”
    reason: alternative_reading
lexical_decisions:
- source_word: οὗτοι
  choice: ndị a
  rationale: Na-ezo aka kpọmkwem n’ụfọdụ ndị Grik a kpọrọ aha n’amaokwu bu ụzọ, ma na-edobe njikọ ahụ n’akụkọ.
- source_word: οὖν
  choice: Ya mere
  rationale: Na-egosi njikọ na-aga n’ihu ma ọ bụ ihe si n’ihe bu ụzọ pụta; ọ bụ okwu Igbo doro anya ma dịkwa mma n’akụkọ.
- source_word: προσῆλθον
  choice: bịakwutere
  rationale: Na-enye echiche nke ịbịakwuru mmadụ ma ọ bụ ịgakwuru ya, n’ụzọ dabara adaba n’Igbo.
- source_word: Φιλίππῳ
  choice: Filip
  rationale: Ụdị aha Φίλιππος a na-asụ n’Igbo.
- source_word: τῷ ἀπὸ Βηθσαϊδὰ τῆς Γαλιλαίας
  choice: onye si Betsaida nke Galili
  rationale: Na-akọwa Filip n’ụzọ eke n’Igbo, ma na-edobe njikọ ala dị n’asụsụ Grik.
- source_word: ἠρώτων
  choice: na-arịọ ya
  rationale: Ụdị na-aga n’ihu na-egosipụta imperfect nke Grik, nke nwere ike ịpụta arịrịọ a na-eme n’oge ahụ.
- source_word: λέγοντες
  choice: sị
  rationale: Ọ bụ ụzọ Igbo dị nkenke ma bụrụkwa eke isi webata ihe ha kwuru.
- source_word: Κύριε
  choice: Onyenwe anyị
  rationale: Na-edobe ntụgharị bụ isi nke κύριος, ebe e nyere nghọta nke nkwanye ùgwù dabara n’ọnọdụ a n’okpuru ala peeji.
- source_word: θέλομεν
  choice: anyị chọrọ
  rationale: Na-egosipụta ọchịchọ ha n’asụsụ Igbo nke oge a, nke doro anya.
- source_word: τὸν Ἰησοῦν
  choice: Jizọs
  rationale: Ụdị aha Jizọs a na-ejikarị eme ihe n’Igbo.
- source_word: ἰδεῖν
  choice: ịhụ
  rationale: Na-edobe isi ihe ὁράω pụtara n’ụzọ nkịtị, na-enweghị ịgbasa ya ka ọ bụrụ izute ma ọ bụ ịgwa okwu.
theological_decisions:
- issue: Otú e si tụgharịa κύριε mgbe a na-agwa Filip okwu
  choice: Onyenwe anyị
  alternative: Nna anyị ukwu
  rationale: A na-edobe ntụgharị ọdịnala nke κύριος n’ahịrị bụ isi. Ma n’ebe a, okwu ahụ nwere ike ịbụ nanị aha nkwanye ùgwù a kpọrọ Filip, ọ bụghị nkwupụta na ọ bụ Onyenwe; ya mere e debere nghọta ahụ n’okpuru ala peeji ka esemokwu dị na okwu Grik ghara ịla n’iyi.
translation_notes:
  register: Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E ji “ndị a” debe njikọ ya na ndị Grik e kwuru okwu ha n’amaokwu bu ụzọ; e jikwa akara [a] gosi nghọta ọzọ nke κύριε.
