    text: A pụkwara ịsụgharị ya, “ụzọ ọ ga-esi nwụọ.” Okwu Grik ahụ nwere ike imesi ụzọ ọnwụ ahụ ike.
    reason: lexical_alternative
  revision_rationale: The revision changes the purpose-like infinitival phrase to an attendant participial construction, preserving the Greek syntax and sense while retaining natural modern Standard Igbo. It keeps the death reference indirect and preserves the prospective nuance without adding theological interpretation.
