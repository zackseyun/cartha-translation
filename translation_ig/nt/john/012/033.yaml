  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τοῦτο δὲ ἔλεγεν σημαίνων ποίῳ θανάτῳ ἤμελλεν ἀποθνῄσκειν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/033.yaml
  text: He was saying this to signify what kind of death he was about to die[a].
translation:
  language: ig
  text: O kwuru nke a, na-egosi ụdị ọnwụ ọ na-aga ịnwụ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ụzọ ọ ga-esi nwụọ.” Okwu Grik ahụ nwere ike imesi ụzọ ọnwụ ahụ ike.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο
  choice: nke a
  rationale: Nnọchiaha ngosi a dị n’otu ma na-ezo aka n’okwu Jizọs kwuru n’amaokwu bu ụzọ.
- source_word: δὲ
  choice: (a hapụrụ ya n’ụdị okwu Igbo)
  rationale: Ọ bụ njikọ dị nro; Igbo anaghị achọ ka e tinye okwu pụrụ iche ebe a, ma ịhapụ ya na-eme ka ahịrịokwu ahụ bụrụ nke eke n’enweghị ime ka ọ bụrụ mmegide.
- source_word: ἔλεγεν
  choice: O kwuru
  rationale: Ọ bụ ezie na ụdị Grik ahụ bụ imperfect, n’Igbo nkịtị “O kwuru” na-akọ omume ahụ n’ụzọ eke; “Ọ nọ na-ekwu” ga-adị arọ ma nwee ike ime ka ihe a na-emesi ike gbanwee.
- source_word: σημαίνων
  choice: iji gosi
  rationale: Na-egosi ebumnuche ma ọ bụ ụzọ okwu ahụ si mee ka ụdị ọnwụ ya pụta ìhè; ọ na-edobe echiche nke igosi site n’akara ma ọ bụ okwu na-apụtaghị ya kpọmkwem.
- source_word: ποίῳ θανάτῳ
  choice: ụdị ọnwụ
  rationale: Na-edobe ihe Grik ahụ na-elekwasị anya na ya—ụdị ma ọ bụ ụzọ ọnwụ—kama ịbụ nanị eziokwu na ọ ga-anwụ.
- source_word: ἤμελλεν
  choice: ọ na-aga
  rationale: Na-egosi ihe dị n’ihu nke a tụrụ anya ya n’enweghị itinye echiche siri ike nke akara aka nke ngwaa ahụ n’onwe ya anaghị achọ.
- source_word: ἀποθνῄσκειν
  choice: ịnwụ
  rationale: Ọ bụ infinitive na-emeju μέλλω; “ịnwụ” bụ ntụgharị Igbo doro anya ma bụrụ nke eke.
theological_decisions:
- issue: Ma a ga-akpọ obe ma ọ bụ mkpọgide n’obe aha kpọmkwem
  choice: 'E debere okwu ahụ n’ụzọ na-apụtaghị ya kpọmkwem: “ụdị ọnwụ ọ na-aga ịnwụ.”'
  alternative: “ụdị ọnwụ ọ ga-anwụ n’obe” ma ọ bụ “otu a ga-esi gbuo ya”
  rationale: Onye dere Oziọma ahụ na-ekwu na okwu Jizọs gosiri ụdị ọnwụ ya, ma ọ kpọghị mkpọgide n’obe aha n’amaokwu a. Ịkpọ ya aha n’ahịrị bụ isi ga-agafe okwu isi mmalite, n’agbanyeghị na ihe gbara ya gburugburu na-egosi ya.
translation_notes:
  register: Igbo Izugbe nke oge a, dị mfe nghọta ma dị ùgwù. E ji “ụdị ọnwụ” chekwaa nkenke na ihe a na-akọwa n’ụzọ na-apụtaghị ya kpọmkwem; ihe odide ala ala na-enye ntụgharị nke na-emesi ụzọ ọnwụ ike.
