revisions:
- from: Ma Jizọs tiri mkpu kwuo, “Onye kwere na m[a] ekweghị na m, kama o kwere n’Onye zitere m.[b]”
  to: Ma Jizọs tiri mkpu sị, “Onye na-ekwere na m[a] anaghị ekwere na m, kama ọ na-ekwere n’Onye zitere m.[b]”
  rationale: The revision retains the source’s repeated and theologically tense wording, without adding “naanị” (“only”) or naming the Father in the main text. It changes the verbal forms to a natural Igbo generic-habitual construction corresponding to the Greek present forms, improves the idiom introducing Jesus’ speech, and aligns the alternative footnote with the same generic sense.
