  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἰησοῦς δὲ ἔκραξεν καὶ εἶπεν· Ὁ πιστεύων εἰς ἐμὲ οὐ πιστεύει εἰς ἐμὲ ἀλλὰ εἰς τὸν πέμψαντά με,
base_translation:
  language: en
  yaml_path: translation/nt/john/012/044.yaml
  text: But Jesus cried out and said[a], “The one who believes in me does not believe in me[b], but in the one who sent me,”
translation:
  language: ig
  text: Ma Jizọs tiri mkpu sị, “Onye na-ekwere na m[a] anaghị ekwere na m, kama ọ na-ekwere n’Onye zitere m.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Onye ọ bụla na-ekwere na m.”
    reason: lexical_alternative
  - marker: b
    text: Nke a anaghị agọnahụ na Jizọs bụ Onye a pụrụ ikwere na ya; ọ na-egosi na ikwere na ya apụghị ikewapụ n’ikwere na Nna zitere ya.
    reason: cross_reference
lexical_decisions:
- source_word: ἔκραξεν
  choice: tiri mkpu
  rationale: Okwu a na-egosi na Jizọs kwuru okwu n’olu dara ụda n’ihu ọha; “tiri mkpu” na-echekwa ike okwu Grik ahụ ma bụrụkwa Igbo a na-aghọta nke ọma.
- source_word: Ὁ πιστεύων
  choice: Onye kwere
  rationale: Nkebi a bụ okwu izugbe gbasara onye ọ bụla na-ekwere; “Onye kwere” bụ ụzọ ebumpụta ụwa e si kwuo ya n’Igbo, ma ọ naghị atụgharị ya ka ọ bụrụ naanị otu onye kpọmkwem.
- source_word: πιστεύων / πιστεύει
  choice: kwere / o kwere
  rationale: “Ikwere na” dabara n’ojiji πιστεύω εἰς n’Oziọma Jọn, ma na-echekwa nkwughachi nke otu ngwaa ahụ n’amaokwu a.
- source_word: εἰς ἐμέ
  choice: na m
  rationale: N’Igbo, “ikwere na m” bụ ụzọ kwesịrị ekwesị isi gosipụta nkwenye na ntụkwasị obi e duziri n’ebe mmadụ nọ; ntụgharị nkịtị nke εἰς agaghị ada ka Igbo ebumpụta ụwa.
- source_word: ἀλλὰ εἰς τὸν πέμψαντά με
  choice: kama o kwere n’Onye zitere m
  rationale: “Kama” na-echekwa ọdịiche ἀλλά, ebe “Onye zitere m” na-edebe otú Grik si zoo aha onye ahụ ntakịrị kama itinye “Nna” ozugbo n’ahịrịokwu.
- source_word: δὲ
  choice: Ma
  rationale: “Ma” na-egosi ntụgharị na obere ọdịiche dị n’etiti okwu a na ihe bu ya ụzọ, dịka δέ si arụ ọrụ n’ebe a.
theological_decisions:
- issue: Okwu ahụ bụ “ekweghị na m, kama o kwere n’Onye zitere m” nwere ike iyi ka ọ na-agọnahụ na okwukwe na-adabere na Jizọs.
  choice: E debere esemokwu okwu ahụ dịka ọ dị, iji gosi na ikwere na Jizọs enweghị ike ikewapụ n’ikwere n’Onye zitere ya.
  alternative: Ịsụgharị ya “ọ bụghị naanị na m ka o kwere,” ma ọ bụ itinye “Nna” n’ahịrịokwu bụ isi.
  rationale: Okwu Grik enweghị “naanị.” Ịtinye ya ga-akọwa esemokwu ahụ kpamkpam kama ichekwa ya. Akwụkwọ Jọn na-ejikọta ikwere na Jizọs na ikwere n’Onye zitere ya, ya mere e kwesịrị idebe okwu ahụ n’enweghị mgbakwunye ozizi.
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. “Tiri mkpu kwuo” na-enye okwu ahụ ike n’enweghị asụsụ ochie; “Onye zitere m” na-echekwa ntakịrị izo aka dị n’akwụkwọ Grik. Akara ndetu ala peeji [a] na [b] pụtara n’ahịrịokwu bụ isi.
