    reason: cross_reference
  revision_rationale: The revision retains the source’s repeated and theologically tense wording, without adding “naanị” (“only”) or naming the Father in the main text. It changes the verbal forms to a natural Igbo generic-habitual construction corresponding to the Greek present forms, improves the idiom introducing Jesus’ speech, and aligns the alternative footnote with the same generic sense.
