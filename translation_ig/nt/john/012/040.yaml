id: JHN.12.40
reference: John 12:40
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Τετύφλωκεν αὐτῶν τοὺς ὀφθαλμοὺς καὶ ⸀ἐπώρωσεν αὐτῶν τὴν καρδίαν, ἵνα μὴ ἴδωσιν τοῖς ὀφθαλμοῖς καὶ νοήσωσιν τῇ καρδίᾳ καὶ ⸀στραφῶσιν, καὶ ⸀ἰάσομαι αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/040.yaml
  text: He has blinded their eyes and hardened their heart[a], so that they may not see with their eyes and understand with their heart and turn[c][b], and I would heal them.
translation:
  language: ig
  text: O meela ka anya ha kpuo ìsì, meekwa ka obi ha sie ike, ka ha ghara iji anya ha hụ, jiri obi ha ghọta, ma ọ bụ tụgharịa[a], m wee gwọọ ha.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ, “ka a tọghata ha,” kama “tụgharịa.”
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụ, “aga m agwọ ha.” Ngwaa Grik ahụ dị n’ụdị ọdịnihu, ma “m wee gwọọ ha” dabara n’usoro ebumnuche ma ọ bụ nsonaazụ nke okwu a hotara.
    reason: lexical_alternative
  - marker: c
    text: Ahịrịokwu a na-ekwughachi echiche dị n’Aịzaya 6:10.
    reason: cross_reference
lexical_decisions:
- source_word: Τετύφλωκεν
  choice: O meela ka anya ha kpuo ìsì
  rationale: Oge perfect n’asụsụ Grik na-egosi ihe e mere nke ọnọdụ ya ka dị ugbu a. “O meela ka” na-egosipụta nke a nke ọma n’Igbo ma na-edowekwa onye mere ya ka ọ pụta ìhè.
- source_word: ἐπώρωσεν
  choice: meekwa ka obi ha kpọọ nkụ
  rationale: Nkebiokwu a na-egosi ime ka obi ghara inwe mmetụta ma ọ bụ ghara ịnabata nghọta. “Obi kpọọ nkụ” bụ okwu Igbo doro anya nke na-echekwa echiche nke ime obi isi ike ma ọ bụ ghara inwe mmetụta.
- source_word: καρδίαν / καρδίᾳ
  choice: obi
  rationale: “Obi” na-echekwa ihe atụ Akwụkwọ Nsọ nke καρδία, ebe nghọta na mkpebi mmadụ si apụta; ngwaa “ghọta” na-eme ka akụkụ echiche uche doo anya.
- source_word: ἵνα μὴ
  choice: ka ha ghara
  rationale: Nke a na-echekwa njikọ ebumnuche ma ọ bụ nsonaazụ dị n’ahịrị amụma ahụ n’Igbo dị mfe ma kwụ ọtọ.
- source_word: ἴδωσιν τοῖς ὀφθαλμοῖς
  choice: iji anya ha hụ ụzọ
  rationale: Nke a na-echekwa ihe atụ anya na ịhụ, tinyekwa usoro yiri nke “iji obi ha ghọta.”
- source_word: νοήσωσιν
  choice: ghọta
  rationale: “Ghọta” na-egosipụta ịmata ma ọ bụ ịghọta ihe n’uche n’ụzọ nkịtị n’Igbo.
- source_word: στραφῶσιν
  choice: ịtụgharị
  rationale: “Ịtụgharị” na-echekwa obosara na mgbagwoju anya nke ngwaa Grik ahụ n’etinyeghị ozizi ụka pụrụ iche; ihe ọzọ a pụrụ ịsụ dị n’okpuru peeji.
- source_word: ἰάσομαι
  choice: m wee gwọọ ha
  rationale: Ụdị a dabara n’usoro “ka ha ghara...” ma na-egosi ihe ga-esochi ma ọ bụrụ na ha atụgharị. Ọ na-echekwa echiche ọgwụgwọ n’etinyeghị ya n’ụdị nkwupụta nke na-ewepụ njikọ ahụ.
- source_word: αὐτῶν τὴν καρδίαν
  choice: obi ha
  rationale: E debere “obi” n’otu mkpụrụ okwu dịka Grik si dị, ebe “ha” na-egosi na ọ bụ mkpokọta mmadụ ka a na-ekwu maka ya.
theological_decisions:
- issue: Ọ bụ Chineke mere ka anya ha kpuo ìsì ma mee ka obi ha kpọọ nkụ
  choice: 'E debere onye na-eme ihe ahụ n’ụzọ doro anya: “O meela... meekwa...”'
  alternative: Iji ahịrịokwu na-enweghị onye mere ihe ahụ, dịka “anya ha kpuuru ìsì, obi ha akpọọ nkụ”
  rationale: Ngwaa Grik abụọ ahụ nwere otu onye nke atọ dị ka onye mere ihe. Nsụgharị ahụ ekwesịghị ime ka okwu siri ike banyere ikpe na ime obi kpọọ nkụ dị nro.
- issue: Ihe στραφῶσιν pụtara n’ihe gbasara nchegharị
  choice: ịtụgharị
  alternative: ka a tọghata ha
  rationale: “Ịtụgharị” na-echekwa okwu amụma ahụ na obosara ngwaa Grik, ebe “ka a tọghata ha” nwere ike ịdị ka okwu ozizi ụka akọwapụtara karịa ihe ederede kwuru.
- issue: Ike ọdịnihu nke ἰάσομαι n’usoro ἵνα μή
  choice: m wee gwọọ ha
  alternative: aga m agwọ ha
  rationale: Isi ederede na-egosipụta ọgwụgwọ dịka ihe ga-esochi ntụgharị n’usoro ebumnuche/nsonaazụ ahụ; nkọwa ala peeji na-edebe nsụgharị nke ọdịnihu kpọmkwem.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta. E chekwara usoro ihe atụ nke anya, obi, ntụgharị, na ọgwụgwọ. “Obi ha” ka dị n’otu mkpụrụ okwu iji gosipụta ụdị mkpokọta dị na Grik; e zere okwu ụka nwere nkọwa ozizi pụrụ iche.
