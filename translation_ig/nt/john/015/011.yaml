    issue: Nonstandard or inappropriate perfect form in “Agwawo m unu ihe ndị a.”
    rationale: For gwa in this sense, Standard Igbo normally uses “Agwala m unu ihe ndị a.” This accurately conveys the Greek perfect λελάληκα (“I have spoken/told”) and is more natural.
