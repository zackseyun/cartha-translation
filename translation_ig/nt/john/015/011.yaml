  rationale: Only the verb form has been corrected from “Agwawo m” to the standard perfect “Agwala m.” The wording otherwise faithfully and naturally represents the Greek, including the contextual ambiguity of ἐν ὑμῖν and the fullness/completion nuance of πληρωθῇ.
