id: JHN.15.11
reference: John 15:11
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ταῦτα λελάληκα ὑμῖν ἵνα ἡ χαρὰ ἡ ἐμὴ ἐν ὑμῖν ⸀ᾖ καὶ ἡ χαρὰ ὑμῶν πληρωθῇ.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/011.yaml
  text: I have spoken these things to you so that my joy may be in you[b][a], and your joy may be made full.
translation:
  language: ig
  text: Agwala m unu ihe ndị a ka ọṅụ m wee dị n’ime unu[b], ka ọṅụ unu wee zue oke.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ka ọṅụ unu wee jupụta n’uju.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ka ọṅụ m wee dị n’etiti unu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα
  choice: ihe ndị a
  rationale: Nnọchiaha a dị n’ụdị ọtụtụ; “ihe ndị a” na-edobe ọtụtụ ahụ ma na-ada nke ọma n’Igbo.
- source_word: λελάληκα
  choice: Agwawo m
  rationale: Ụdị a na-egosi okwu e kwuworo nke mmetụta ya ka dị; n’Igbo nkịtị, “Agwawo m unu ihe ndị a” bụ ụzọ doro anya ma bụrụkwa eke isi kwuo ya.
- source_word: ὑμῖν
  choice: unu
  rationale: “Unu” na-egosi nke ọma na Jizọs na-agwa ihe karịrị otu onye okwu.
- source_word: ἵνα
  choice: ka … wee
  rationale: Usoro “ka … wee” na-egosi ebumnuche ma ọ bụ ihe okwu ahụ chọrọ ịrụpụta n’Igbo dị ugbu a.
- source_word: ἡ χαρὰ ἡ ἐμὴ
  choice: ọṅụ m
  rationale: Nke a na-edobe okwu Grik ahụ n’enweghị ịkọwa ya dịka “ọṅụ m na-enye” ma ọ bụ “ọṅụ banyere m.”
- source_word: ἐν ὑμῖν
  choice: n’ime unu
  rationale: “N’ime unu” na-edobe echiche nke ọṅụ ahụ ịdị n’ime ndị na-eso ụzọ; ebe ἐν nwekwara ike ịpụta “n’etiti,” e tinyere nke ahụ n’ala peeji.
- source_word: ᾖ
  choice: wee dị
  rationale: N’usoro “ka … wee,” nke a na-egosipụta subjunctive nke ebumnuche n’ụzọ Igbo si ada nke ọma.
- source_word: καὶ
  choice: ka
  rationale: Nke abụọ “ka” na-ejikọta akụkụ abụọ nke ebumnuche ahụ n’ụzọ na-agụ were were n’Igbo; njikọ ahụ ka dị n’agbanyeghị na a naghị asụgharị καὶ naanị ya dịka “na.”
- source_word: ἡ χαρὰ ὑμῶν
  choice: ọṅụ unu
  rationale: Nke a bụ ntụgharị kpọmkwem ma bụrụkwa nke eke, ọ na-edobekwa ọdịiche dị n’etiti “ọṅụ m” na “ọṅụ unu.”
- source_word: πληρωθῇ
  choice: wee zuo oke
  rationale: “Zuo oke” na-egosi na ọṅụ ahụ eruola n’uju ma ọ bụ mezue; ọ bụ okwu Igbo kachasị eke n’ebe a, ebe ihe oyiyi nke ijupụta dị n’ala peeji.
theological_decisions:
- issue: Ihe “ọṅụ m” pụtara n’okwu Jọn
  choice: A hapụrụ ya dịka “ọṅụ m.”
  alternative: “ọṅụ m na-enye unu” ma ọ bụ “ọṅụ banyere m”
  rationale: Grik kwuru naanị “ọṅụ m.” Ntughari a anaghị ekpebi ma ọ bụ ọṅụ nke Jizọs n’onwe ya nke ndị kwere ekwe na-eketa, ka ọ bụ ọṅụ sitere na mmekọrịta ha na ya.
- issue: Ma ἐν ὑμῖν ọ pụtara ịdị n’ime mmadụ ka ọ bụ n’etiti otu mmadụ
  choice: “n’ime unu” dị n’ahịrịokwu bụ isi, “n’etiti unu” dị n’ala peeji.
  alternative: Iji naanị “n’etiti unu”
  rationale: Ihe abụọ ahụ kwekọrọ n’iji ἐν eme ihe. Njikọ ya na “ọṅụ unu” na-akwado “n’ime unu,” ma a naghị ezobe ụzọ ọzọ okwu ahụ nwere ike isi pụta.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. “Agwawo m unu” na “ka … wee” bụ usoro okwu ndị mmadụ na-aghọta nke ọma, ebe “ọṅụ,” “n’ime unu,” na “zuo oke” na-edobe isi echiche na esemokwu nke ederede Grik.
