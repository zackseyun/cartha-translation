  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐὰν μείνητε ἐν ἐμοὶ καὶ τὰ ῥήματά μου ἐν ὑμῖν μείνῃ, ὃ ἐὰν θέλητε ⸀αἰτήσασθε καὶ γενήσεται ὑμῖν·
base_translation:
  language: en
  yaml_path: translation/nt/john/015/007.yaml
  text: If you remain in me and my words remain in you[a], ask whatever you want[b], and it will be done for you.
translation:
  language: ig
  text: Ọ bụrụ na unu anọgide n’ime m, okwu m anọgidekwa n’ime unu, rịọnụ ihe ọ bụla unu chọrọ, a ga-emere unu ya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μείνητε / μείνῃ (μένω)
  choice: anọgide / anọgide
  rationale: “Ịnọgide” na-egosi ịnọgide na mmekọrịta ma ọ bụ n’ọnọdụ ahụ, ma na-edobekwa nkwughachi nke okwu Grik n’ebe abụọ ahụ.
- source_word: ἐν ἐμοὶ / ἐν ὑμῖν
  choice: n’ime m / n’ime unu
  rationale: A hapụrụ ihe atụ nke ịbụ “n’ime” onye ọzọ ka e wee chekwaa asụsụ njikọ na mmekọrịta dị n’akwụkwọ Jọn.
- source_word: τὰ ῥήματά μου
  choice: okwu m
  rationale: Nke a bụ ntụgharị doro anya ma dị mfe nke okwu ma ọ bụ ihe Jizọs kwuru, n’enweghị ịgbasa ya karịa ihe dị na Grik.
- source_word: ὃ ἐὰν θέλητε
  choice: ihe ọ bụla unu chọrọ
  rationale: Nkebi a na-egosi ihe ọ bụla ndị a na-agwa okwu chọrọ; ntụgharị a bụ Igbo nkịtị ma na-edobe obosara okwu Grik ahụ.
- source_word: αἰτήσασθε
  choice: rịọnụ
  rationale: N’ọnọdụ a, ngwaa ahụ bụ iwu ka ha rịọ arịrịọ; “rịọnụ” bụ okwu dị ndụ ma kwesị ekwesị maka arịrịọ.
- source_word: γενήσεται ὑμῖν
  choice: a ga-emere unu ya
  rationale: N’ọnọdụ arịrịọ a, ntụgharị a na-egosi na ihe a rịọrọ ga-abịara ha n’ụzọ e mere ya maka ha, ma ọ naghị akpọ onye ga-eme ya aha ebe Grik na-akpọghị ya aha.
theological_decisions:
- issue: Ọnọdụ na nkwa dị n’okwu Jizọs banyere ịrịọ arịrịọ
  choice: 'E debere nkwa ahụ n’okpuru ọnọdụ abụọ ahụ: ndị na-eso ụzọ ịnọgide n’ime Jizọs, na okwu ya ịnọgide n’ime ha.'
  alternative: Ịtụgharị ya n’ụzọ ga-eme ka nkwa banyere ihe ọ bụla ha rịọrọ yie nke na-enweghị ọnọdụ.
  rationale: Usoro ahịrịokwu Grik ji ἐὰν tinye ihe a ga-eme ma ọnọdụ ndị ahụ mezuo. Tụgharị ya otu a na-echekwa njikọ ahụ na esemokwu nkà mmụta okpukpe dị n’amaokwu ahụ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E ji nnọchiaha ọtụtụ “unu” n’ihi na ngwaa na nnọchiaha Grik niile ebe a bụ ọtụtụ. A họọrọ “anọgide” iji chekwaa isi okwu Jọn na nkwughachi ya.
