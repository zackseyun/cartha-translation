  verdict: approve
  source_fidelity: Ntụgharị ahụ na-edobe usoro ọnọdụ abụọ nke ἐὰν, nkwughachi nke μένω, mmekọrịta “n’ime m/n’ime unu,” iwu ọtụtụ mmadụ “rịọnụ,” na nsonaazụ n’ọdịnihu. “A ga-emere unu ya” bụ ụzọ Igbo a na-anabata iji kọwaa γενήσεται ὑμῖν n’ọnọdụ arịrịọ, n’agbanyeghị na ọ na-eji usoro onye-amaghị-eme ihe.
  naturalness: Igbo ahụ bụ Igbo Izugbe doro anya ma dị ùgwù. “Ọ bụrụ na unu anọgide n’ime m, okwu m anọgidekwa n’ime unu” na-eme ka ọnọdụ nke abụọ nọgide n’okpuru “ọ bụrụ na” n’enweghị mgbagwoju anya. “Rịọnụ ihe ọ bụla unu chọrọ” dị mkpirikpi ma bụrụ okwu nkịtị.
  terminology: “Anọgide” na-echekwa isiokwu Jọn banyere μένω ma na-emegharị ya ugboro abụọ. “Okwu m,” “n’ime,” na “ihe ọ bụla unu chọrọ” kwekọrọ nke ọma na ῥήματα, ἐν, na ὃ ἐὰν θέλητε. Enweghị nkọwa okpukpe agbakwunyere.
