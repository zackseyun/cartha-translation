  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀλλὰ ταῦτα πάντα ποιήσουσιν ⸂εἰς ὑμᾶς⸃ διὰ τὸ ὄνομά μου, ὅτι οὐκ οἴδασιν τὸν πέμψαντά με.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/021.yaml
  text: But they will do all these things to you because of my name[a], because they do not know the one who sent me.
translation:
  language: ig
  text: Ma ha ga-eme unu ihe ndị a niile n’ihi aha m,[a] n’ihi na ha amaghị onye zitere m.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “megide unu.” Akpaokwu Grik ahụ pụrụ ịpụta na omume ndị ahụ e lekwasịrị unu anya n’ụzọ iro.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Ma
  rationale: Ọ na-egosi ọdịiche siri ike n’ihe e kwuru tupu ya, ma bụrụkwa okwu Igbo dị mfe ma kwekọọ n’ọnọdụ a.
- source_word: ταῦτα πάντα
  choice: ihe ndị a niile
  rationale: Nke a na-echekwa ma nrụtụ aka dị na ταῦτα ma echiche nke ngụkọta dị na πάντα.
- source_word: ποιήσουσιν
  choice: ha ga-eme
  rationale: Ọ na-asụgharị ngwaa ọdịnihu ahụ n'ụzọ kwụ ọtọ, na-ahapụghị obosara ihe ποιέω nwere.
- source_word: εἰς ὑμᾶς
  choice: unu
  rationale: N’usoro Igbo ‘ha ga-eme unu ihe ndị a’ na-egosi na omume ndị ahụ bụ ihe a na-eme ndị na-eso ụzọ; ọ dịghị mkpa itinye preposition n’ụzọ na-adịghị eke. Ihe odide ala na-echekwa nhọrọ nke nghọta iro, ‘megide unu.’
- source_word: διὰ τὸ ὄνομά μου
  choice: n’ihi aha m
  rationale: διά na accusative na-egosi ihe kpatara ya. ‘Aha m’ na-echekwa ibu echiche nke aha dịka onye Jizọs bụ na ikike ya, kama ime ka ọ bụrụ naanị aha ọma.
- source_word: ὅτι
  choice: n’ihi na
  rationale: Ọ na-egosi ihe kpatara omume ahụ n’Igbo doro anya.
- source_word: οὐκ οἴδασιν
  choice: ha amaghị
  rationale: Ọ na-echekwa ịdị mfe nke okwu ahụ na omimi nke ịmata mmadụ n'ụzọ mmekọrịta, ọ bụghị naanị ịnwe ozi banyere ya.
- source_word: τὸν πέμψαντά με
  choice: onye zitere m
  rationale: Ọ na-asụgharị participle nwere article dịka aha mmadụ n’ụzọ Igbo eke, na-etinyeghị ‘Nna’ nke na-adịghị n’okwu Grik n’onwe ya.
theological_decisions:
- issue: Onye okwu ‘onye zitere m’ na-ezo aka na ya
  choice: E chekwara nrụtụ aka ahụ dịka ‘onye zitere m.’
  alternative: ‘Nna zitere m’ ma ọ bụ ‘Nna nke zitere m.’
  rationale: Ihe gbara amaokwu ahụ gburugburu na Jọn na-egosi na ọ bụ Nna ka ọ na-ekwu maka ya, ma Grik kpọghị aha ‘Nna’ ebe a. Ya mere, nsụgharị ahụ anaghị etinye aha ọhụrụ ma ọ bụ mechie ihe odide ahụ karịa ka isi mmalite mere.
- issue: Uche dị na ‘aha m’
  choice: E debere ‘aha m’ n’ụzọ nkịtị.
  alternative: ‘n’ihi onye m bụ’ ma ọ bụ ‘n’ihi aha ọma m.’
  rationale: ‘Aha’ nwere ike ịnọchi anya onye Jizọs bụ na ikike ya. Ịgbanwe ya ka ọ bụrụ nkọwa kpọmkwem ga-ebelata ma ọ bụ mechie omimi echiche dị n’okwu mbụ.
translation_notes:
  register: Standard Igbo; asụsụ dị ugbu a, dị ùgwù, ma dị mfe nghọta. A họọrọ ‘ha ga-eme unu ihe ndị a niile’ dịka usoro Igbo eke nke na-echekwa obosara na ntuziaka nke okwu Grik. Akara [a] dị n’isi ederede ma kwekọọ n’ihe odide ala.
