  text: εἰ μὴ ἦλθον καὶ ἐλάλησα αὐτοῖς, ἁμαρτίαν οὐκ ⸀εἴχοσαν· νῦν δὲ πρόφασιν οὐκ ἔχουσιν περὶ τῆς ἁμαρτίας αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/022.yaml
  text: If I had not come and spoken to them[a], they would not have sin[c][b]; but now they have no excuse for their sin.
translation:
  language: ig
  text: A sị na m abịaghị gwa ha okwu, ha agaraghị enwe mmehie[a]; ma ugbu a, ha enweghị ngọpụ maka mmehie ha.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ha agaraghị abụ ndị ikpe mara n’ihi mmehie,” ma ọ bụ, “ha agaraghị enwe ikpe ọmụma.” Grik kwuru n’ụzọ nkịtị, “ha agaraghị enwe mmehie.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ha enweghị ihe ha ga-eji kpuchie mmehie ha.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ μὴ ἦλθον
  choice: A sị na abịaghị m
  rationale: Ụdị a na-egosi ọnọdụ megidere ihe mere n’oge gara aga n’Igbo nkịtị ma doo anya.
- source_word: καὶ ἐλάλησα αὐτοῖς
  choice: gwa ha okwu
  rationale: Nke a bụ ụzọ Igbo sitere n’okike isi kwuo na o kwuru okwu nye ha, ma na-edebe αὐτοῖς dị ka ‘ha.’
- source_word: ἁμαρτίαν οὐκ εἴχοσαν
  choice: ha agaraghị enwe mmehie
  rationale: A hapụrụ okwu Jọn bụ ‘inwe mmehie’ n’ụdị kwụ ọtọ, kama ịkọwa ya ozugbo dị ka ịbụ ndị ikpe mara.
- source_word: νῦν δὲ
  choice: ma ugbu a
  rationale: Na-egosi ọdịiche siri ike n’etiti ọnọdụ a tụrụ n’uche na ọnọdụ dị ugbu a.
- source_word: πρόφασιν οὐκ ἔχουσιν
  choice: ha enweghị ihe ngọpụ
  rationale: ‘Ihe ngọpụ’ bụ okwu Igbo doro anya na nke sitere n’okike maka πρόφασις n’ebe a.
- source_word: περὶ τῆς ἁμαρτίας αὐτῶν
  choice: maka mmehie ha
  rationale: ‘Maka’ dabara na njikọ okwu Igbo ‘ihe ngọpụ maka...’ ma na-eburu echiche nke ‘banyere/n’ihe gbasara’ mmehie ha.
theological_decisions:
- issue: Ma ἁμαρτίαν οὐκ εἴχοσαν ọ pụtara na ha agaraghị enwe mmehie ọ bụla, ka ọ bụ na ikpe mmehie a agaraghị ama ha
  choice: ha agaraghị enwe mmehie
  alternative: ikpe mmehie agaraghị ama ha
  rationale: Isi mmalite Grik kwuru n’ụzọ nkịtị ‘ha agaraghị enwe mmehie.’ E debere esemokwu nkà mmụta okpukpe ahụ n’ahịrị bụ isi, ebe ndetu na-egosi echiche ọzọ nke ịbụ ndị ikpe mara n’ihi mmehie.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ ‘A sị na ... agaraghị’ iji gosipụta ọnọdụ gara aga nke na-emeghị eme; e zere ịkọwa ‘mmehie’ naanị dị ka ‘ikpe ọmụma’ n’ahịrị bụ isi.
