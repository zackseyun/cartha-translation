    text: A pụkwara ịsụgharị ya, “ha agaraghị abụ ndị ikpe mara n’ihi mmehie,” ma ọ bụ, “ha agaraghị enwe ikpe ọmụma.” Grik kwuru n’ụzọ nkịtị, “ha agaraghị enwe mmehie.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ha enweghị ihe ha ga-eji kpuchie mmehie ha.”
    reason: lexical_alternative
  revision_rationale: The revision preserves the source’s ambiguity and its literal ‘have sin’ wording in the main text. It makes only safe idiomatic improvements and corrects the footnote’s misleading Igbo expression of the culpability alternative.
