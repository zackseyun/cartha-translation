revisions:
- from: A sị na abịaghị m gwa ha okwu, ha agaraghị enwe mmehie[a]; ma ugbu a, ha enweghị ihe ngọpụ maka mmehie ha.[b]
  to: A sị na m abịaghị gwa ha okwu, ha agaraghị enwe mmehie[a]; ma ugbu a, ha enweghị ngọpụ maka mmehie ha.[b]
  rationale: The revision preserves the source’s ambiguity and its literal ‘have sin’ wording in the main text. It makes only safe idiomatic improvements and corrects the footnote’s misleading Igbo expression of the culpability alternative.
  reviewer_model: gpt-5.6-terra
