  verdict: revise
  source_fidelity: A na-echekwa njikọ "καὶ" na nkwusi okwu/ntakịrị mgbakwunye dị na "ὑμεῖς δέ" nke ọma. Otú ọ dị, "unu na m anọwo" pụtara n’ụzọ nkịtị na unu na Jizọs anọọla (ya bụ, ndị abụọ nọ), ọ bụghị na unu esorola ya/nọnyeere ya. Nke a anaghị akọwa nke ọma "μετ’ ἐμοῦ ἐστε."
  naturalness: '"Unu onwe unu kwa na-agba akaebe" na "unu anọnyere m kemgbe mmalite" bụ Standard Igbo doro anya, nke sitere n’ọnụ ma na-edobe ụda dị ùgwù. Ọ na-ezere nghọta na-ezighị ezi nke "unu na m anọwo."'
  terminology: '"Ịgba akaebe" dabara nke ọma maka μαρτυρεῖτε ma na-echekwa echiche nke ịgba àmà. "Kemgbe mmalite" na-edobe enweghị nkọwa kpọmkwem nke ἀπ’ ἀρχῆς. A ghaghị idozi ala peeji b ka ọ ghara ikwu na Grik sịrị "unu na m nọ," ebe ọ sịrị "unu nọnyere m."'
