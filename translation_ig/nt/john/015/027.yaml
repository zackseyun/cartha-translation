  yaml_path: translation/nt/john/015/027.yaml
  text: And you also testify[b][a], because you have been with me from the beginning.
translation:
  language: ig
  text: Unu onwe unu kwa na-agba akaebe,[a] n’ihi na unu anọnyere m kemgbe mmalite.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “Gbakwaanụ akaebe.” Ụdị okwu Grik ahụ nwere ike ịbụ nkwupụta ma ọ bụ iwu.
    reason: grammatical_alternative
  - marker: b
    text: N’asụsụ Grik, ọ bụ n’ụzọ nkịtị, “unu nọnyere m kemgbe mmalite”; “anọnyere” na-egosi na ịnọnyere ya malitere n’oge ahụ ma ruo ugbu a.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς δὲ
  choice: Unu onwe unu ... kwa
  rationale: “Unu onwe unu” na-egosipụta nkwusi okwu dị n’aha nnọchiaha ahụ, ebe “kwa” na-egosi na ndị na-eso ụzọ sokwa Mmụọ Nkwado a kpọrọ aha n’amaokwu gara aga agba akaebe.
- source_word: μαρτυρεῖτε
  choice: na-agba akaebe
  rationale: Nke a bụ okwu Igbo a na-ejikarị ekwu inye akaebe, ma ọ na-echekwa echiche nke onye hụrụ ihe ma na-agba akaebe banyere ya.
- source_word: ὅτι
  choice: n’ihi na
  rationale: 'N’ebe a, ὅτι na-egosi ihe mere ha ji agba akaebe: ha na Jizọs anọwo kemgbe mmalite.'
- source_word: ἀπ’ ἀρχῆς
  choice: kemgbe mmalite
  rationale: “Kemgbe” na-egosi oge malitere n’oge gara aga ma ruo ugbu a; “mmalite” anaghị akọwapụta kpọmkwem mmalite nke gịnị, dịka okwu Grik ahụ.
- source_word: μετ’ ἐμοῦ ἐστε
  choice: unu na m anọwo
  rationale: Nke a na-egosi ịnọnyere Jizọs nke malitere na mbụ ma na-aga n’ihu ruo n’oge ọ na-ekwu okwu ahụ, n’ụzọ dabara n’asụsụ Igbo.
theological_decisions:
- issue: Ihe “kemgbe mmalite” na-ezo aka na ya
  choice: E debere ya n’enweghị nkọwa ọzọ n’ahịrị amaokwu ahụ.
  alternative: Ịsị kpọmkwem “kemgbe mmalite ozi Jizọs.”
  rationale: Ọnọdụ okwu ahụ na-akwado mmalite oge ndị na-eso ụzọ malitere ịnọnyere Jizọs, ma okwu Grik ahụ n’onwe ya ekwughị “ozi”; ya mere, nsụgharị ahụ anaghị etinye nkọwa ozizi n’ime amaokwu ahụ.
- issue: Ma μαρτυρεῖτε bụ nkwupụta ka ọ bụ iwu
  choice: 'Isi nsụgharị na-ewere ya dị ka nkwupụta: “na-agbakwa akaebe.”'
  alternative: 'A pụkwara ịghọta ya dị ka iwu: “gbakwaanụ akaebe.”'
  rationale: Ụdị okwu Grik a nwere ike ịbụ indicative ma ọ bụ imperative n’onwe ya. Ọnọdụ okwu ahụ na-ekwe ka a gụọ ya dị ka nkwupụta, dịka oyi akwa ntụnyere Bekee si mee, ma e debere nghọta iwu ahụ n’ala peeji ka a ghara ikpochapụ mgbagwoju anya dị n’asụsụ mbụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị mfe ma dị ùgwù. “Ịgba akaebe” bụ okwu a maara nke ọma ma na-echekwa ụda iwu/ụlọikpe nke μαρτυρέω. A naghị akọwapụta “mmalite” n’ụzọ ga-etinye ozizi pụrụ iche n’amaokwu ahụ.
