  text: μείζονα ταύτης ἀγάπην οὐδεὶς ἔχει, ἵνα τις τὴν ψυχὴν αὐτοῦ θῇ ὑπὲρ τῶν φίλων αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/013.yaml
  text: 'No one has greater love than this: that someone lay down his life for his friends[a][b][c][d].'
translation:
  language: ig
  text: 'Ọ dịghị onye nwere ịhụnanya karịrị nke a: ka mmadụ tọgbọ ndụ ya maka ndị enyi ya[a][b][c][d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịtụgharị ya, “ka otu onye tọgbọ ndụ ya maka ndị enyi ya.” Grik ji okwu na-egosi otu onye a na-akọwaghị aha.
    reason: lexical_alternative
  - marker: b
    text: “Ndụ” bụ ntụgharị okwu Grik psychē, nke nwekwara ike ịpụta “mkpụrụ obi” ma ọ bụ “onwe.” N’ebe a, ọ pụtara ndụ mmadụ nke mmadụ na-enye n’ọnwụ.
    reason: lexical_alternative
  - marker: c
    text: “Maka” bụ ntụgharị okwu Grik hyper, nke nwekwara ike ịsụgharị “n’ihi” ma ọ bụ “maka ọdịmma.”
    reason: lexical_alternative
  - marker: d
    text: 'Nsụgharị ọzọ e jirila mee ya bụ: “ka mmadụ tọgbọ ndụ ya maka ndị enyi ya.”'
    reason: previous_rendering
lexical_decisions:
- source_word: μείζονα ταύτης ἀγάπην
  choice: ịhụnanya karịrị nke a
  rationale: Nke a na-edobe ntụnyere Grik nke pụtara ‘ịhụnanya ka nke a ukwuu,’ ma na-ada nke ọma n’Igbo ugbu a.
- source_word: οὐδεὶς ἔχει
  choice: Ọ dịghị onye nwere
  rationale: Ọ bụ ntụgharị kwụ ọtọ, doro anya nke okwu Grik a na-agọnahụ na onye ọ bụla nwere ihe ahụ.
- source_word: ἵνα
  choice: ka
  rationale: N’ebe a, ἵνα na-akọwa ihe ‘nke a’ bụ, ọ bụghị nanị ebumnuche; ‘ka’ na-ewebata nkebiokwu nkọwa ahụ n’ụzọ a na-aghọta nke ọma.
- source_word: τις
  choice: mmadụ
  rationale: Okwu Grik a na-ekwu maka onye ọ bụla n’ozuzu, ọ bụghị nwoke kpọmkwem; ‘mmadụ’ na-echekwa nghọta ahụ n’Igbo.
- source_word: τὴν ψυχὴν αὐτοῦ
  choice: ndụ ya
  rationale: N’ọnọdụ a ψυχή pụtara ndụ mmadụ nke ọ na-ahapụ ruo n’ọnwụ, ọ bụghị nanị mkpụrụ obi dị iche n’ahụ.
- source_word: θῇ
  choice: tọgbọ
  rationale: τίθημι ya na ψυχή bụ okwu e ji akọwa mmadụ iji aka ya nye ndụ ya; ‘tọgbọ ndụ’ na-echekwa ihe oyiyi na ike okwu ahụ.
- source_word: ὑπὲρ
  choice: maka
  rationale: ‘Maka’ na-egosi na a na-enye ndụ ahụ n’ihi ọdịmma ndị enyi ahụ, n’ebughị ụzọ kpebie ma okwu ahụ ọ pụtara nnọchi anya kpọmkwem.
- source_word: τῶν φίλων αὐτοῦ
  choice: ndị enyi ya
  rationale: Nke a bụ ntụgharị nkịtị na nke ziri ezi nke φίλοι na nnọchiaha nwe ya.
theological_decisions:
- issue: Ihe ψυχή pụtara n’okwu gbasara ịchụ onwe onye n’àjà
  choice: ndụ
  alternative: mkpụrụ obi
  rationale: Amaokwu a na-ekwu maka mmadụ ịhapụ ndụ ya ruo n’ọnwụ. ‘Ndụ’ na-egosipụta ihe a na-ekwu ebe a n’etinyeghị nkewa ahụ na mkpụrụ obi n’ime ederede.
- issue: Ike okwu ὑπέρ n’ihe gbasara ịhụnanya nke ịchụ onwe onye n’àjà
  choice: maka
  alternative: n’ihi; n’aha; n’ọnọdụ
  rationale: ὑπέρ nwere ike igosi ime ihe n’ihi ọdịmma mmadụ ma ọ bụ n’aha ya. ‘Maka’ na-echekwa obosara nghọta ahụ n’akọwaghị ya dịka nnọchi anya nke ozizi kpọmkwem.
- issue: Onye a na-ekwu maka ya na τις…αὐτοῦ
  choice: mmadụ…ya
  alternative: otu onye…ya
  rationale: Grik ji onye na-akọwaghị aha n’otu n’otu mee okwu izugbe. ‘Mmadụ…ya’ na-edobe otu onye ahụ ma ghara ime ka okwu ahụ bụrụ naanị maka nwoke.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-echekwa nhazi na ihe oyiyi nke Grik, ma ‘mmadụ…ya’ na-eme ka okwu izugbe nke onye otu n’otu doo anya n’enweghị ịgbakwunye oke nwoke ma ọ bụ nwanyị.
