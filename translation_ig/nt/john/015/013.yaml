  terminology: “ịhụnanya,” “ndụ,” “tọgbọ,” and “ndị enyi” are suitable and consistent. In footnote c, “n’aha” is not a sufficiently close general alternative for ὑπέρ here; “maka ọdịmma” better expresses ‘for the benefit of/on behalf of’ without over-specifying substitution.
