  text: Εἰ ὁ κόσμος ὑμᾶς μισεῖ, γινώσκετε ὅτι ἐμὲ πρῶτον ⸀ὑμῶν μεμίσηκεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/018.yaml
  text: If the world hates you[a], know that it has hated me before you.
translation:
  language: ig
  text: Ọ bụrụ na ụwa akpọọ unu asị,[a] maranụ na ọ kpọrọ m asị tupu ọ kpọọ unu asị.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ọ kpọrọ m asị na mbụ, tupu ọ kpọọ unu asị.” N’asụsụ Grik, okwu pụtara “na mbụ” ya na “unu” na-egosi na ụwa kpọrọ Jizọs asị tupu ọ kpọọ ndị na-eso ụzọ ya asị.
    reason: lexical_alternative
lexical_decisions:
- source_word: κόσμος
  choice: ụwa
  rationale: N'ọnọdụ okwu Jọn, okwu a nwere ike ịpụta ụmụ mmadụ na-emegide Chineke, ma “ụwa” bụ okwu Igbo dị mfe ma saa mbara nke na-adịghị etinye nkọwa karịrị ihe ederede kwuru.
- source_word: μισεῖ
  choice: akpọọ ... asị
  rationale: N'ahịrịokwu ọnọdụ a, “akpọọ unu asị” na-egosipụta ihe nwere ike ime ma na-edobe echiche izugbe nke ngwaa ugbu a n'ụzọ Igbo dị ndụ.
- source_word: γινώσκετε
  choice: maranụ
  rationale: Ụdị a na-enye iwu ma ọ bụ agbamume nye ọtụtụ mmadụ, kwekọọkwa nke ọma na ọnọdụ okwu ahụ, n'agbanyeghị na ụdị Grik nwekwara ike ịdị ka “unu maara.”
- source_word: πρῶτον
  choice: tupu
  rationale: Mgbe πρῶτον sochiri genitive ὑμῶν, ọ na-egosi ịdị mbụ n'oge; “tupu” na-ekwupụta nke a n'ụzọ Igbo ebumpụta ụwa.
- source_word: μεμίσηκεν
  choice: ọ kpọrọ m asị
  rationale: Igbo anaghị egosipụta perfect tense dịka Grik site n'otu ụdị ngwaa pụrụ iche; okwu a na-egosi omume mere tupu nke ọzọ, ebe ọnọdụ ya ka bara uru ugbu a.
- source_word: ἐμὲ ... ὑμῶν
  choice: m ... tupu ọ kpọọ unu asị
  rationale: Ikwughachi ngwaa na-eme ka ntụnyere oge doo anya n'Igbo, ma na-edobe mmesi ike dị n'okwu “m” na Grik.
theological_decisions:
- issue: Ihe κόσμος pụtara n'ozizi Jọn
  choice: Idowe “ụwa” n'ahịrịokwu bụ isi n'enweghị nkọwa agbakwunyere
  alternative: usoro ụwa; ụmụ mmadụ na-enupụrụ Chineke isi
  rationale: N'ebe a, ụwa na-emegide Jizọs na ndị na-eso ụzọ ya, ma ederede ahụ anaghị achọ ka nsụgharị kọwaa kpọmkwem ndị niile okwu ahụ gụnyere. “Ụwa” na-edobe obosara okwu ahụ na esemokwu nke ozizi ya.
- issue: Ma γινώσκετε bụ iwu ka ọ bụ nkwupụta
  choice: “maranụ” dịka iwu ma ọ bụ agbamume
  alternative: “unu maara” dịka nkwupụta
  rationale: 'Ụdị Grik nwere ike ịbụ iwu ma ọ bụ nkwupụta, ma usoro okwu ahụ mgbe ahịrịokwu ọnọdụ gasịrị na-akwado agbamume: “maranụ.”'
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị ùgwù ma dị mfe nghọta. E ji “akpọọ ... asị” kama usoro siri ike ma ọ bụ nke ochie; e kwughachiri ngwaa n'ikpeazụ iji mee ka ntụnyere oge doo anya.
