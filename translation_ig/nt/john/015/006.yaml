    reason: alternative_reading
  revision_rationale: 'The revision retains the source’s branch metaphor, singular-to-plural movement, unspecified gatherers, and unresolved theological force. It makes two necessary Standard Igbo clarity corrections: the branch now naturally ‘then dries up,’ and the final clause explicitly states that the branches burn in the fire. The footnotes are retained with minor idiomatic polishing and their anchors remain correctly placed.'
