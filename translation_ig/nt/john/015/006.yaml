revisions:
- from: Ọ bụrụ na onye ọ bụla anọgideghị n’ime m[a], a na-atụpụ ya n’èzí dị ka alaka vaịn, ọ kpọnwụọ; ndị mmadụ na-achịkọta alaka ndị ahụ tụba ha n’ọkụ[b], ha erekwa.
  to: Ọ bụrụ na onye ọ bụla anọgideghị n’ime m[a], a na-atụpụ ya n’èzí dị ka alaka vaịn, o wee kpọnwụọ; ha na-achịkọta alaka ndị ahụ, tụba ha n’ọkụ[b], ha na-ere ọkụ.
  rationale: 'The revision retains the source’s branch metaphor, singular-to-plural movement, unspecified gatherers, and unresolved theological force. It makes two necessary Standard Igbo clarity corrections: the branch now naturally ‘then dries up,’ and the final clause explicitly states that the branches burn in the fire. The footnotes are retained with minor idiomatic polishing and their anchors remain correctly placed.'
  reviewer_model: gpt-5.6-terra
