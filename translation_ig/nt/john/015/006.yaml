review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the conditional warning, remaining in Jesus, exclusion, the vine-branch image, gathering, fire, and burning. However, “ọ kpọnwụọ” is not well integrated syntactically after the passive general-condition clause, and “ha erekwa” is ambiguous in writing because “ire” can mean ‘sell’; it also lacks the normal explicit fire/burning expression needed here.
  naturalness: The principal sentence is mostly clear Standard Igbo, but “ọ wee kpọnwụọ” supplies the natural sequential connection, and “ha na-ere ọkụ” clearly expresses that the gathered branches are burning. “Ha” better preserves the Greek indefinite plural than the somewhat more explicit “ndị mmadụ.”
  terminology: “ịnọgide n’ime m,” “alaka vaịn,” “n’èzí,” and “ọkụ” are appropriate, modern, and suitably dignified. The notes preserve the lexical and theological ambiguity without forcing a doctrinal conclusion.
  issues:
  - severity: medium
    issue: The clause “ọ kpọnwụọ” is syntactically abrupt after “a na-atụpụ ya n’èzí.”
    rationale: The Greek coordinates the branch’s drying with its being cast out. In Standard Igbo, “o wee kpọnwụọ” naturally marks the resulting next action/state without altering the image or aspectual force.
  - severity: high
    issue: “ha erekwa” is ambiguous and insufficiently explicit for burning.
    rationale: In written Igbo, “ire” can be understood as ‘selling.’ “Ha na-ere ọkụ” unambiguously communicates the final burning in the fire and naturally applies to the plural gathered branches.
  - severity: low
    issue: “ndị mmadụ” makes the indefinite Greek third-person plural more specific than necessary.
    rationale: The source leaves the agents unspecified. Igbo “ha na-achịkọta” is idiomatic and maintains that indefiniteness.
  revised_text: Ọ bụrụ na onye ọ bụla anọgideghị n’ime m[a], a na-atụpụ ya n’èzí dị ka alaka vaịn, o wee kpọnwụọ; ha na-achịkọta alaka ndị ahụ, tụba ha n’ọkụ[b], ha na-ere ọkụ.
  revised_footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “anọgideghị na m.” Ngwaa Grik ahụ pụtara ịnọgide ma ọ bụ ịnọgide na mmekọrịta ma ọ bụ n’ọnọdụ.
    reason: lexical_alternative
