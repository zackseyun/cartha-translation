id: JHN.15.6
reference: John 15:6
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐὰν μή τις ⸀μένῃ ἐν ἐμοί, ἐβλήθη ἔξω ὡς τὸ κλῆμα καὶ ἐξηράνθη, καὶ συνάγουσιν αὐτὰ καὶ εἰς τὸ πῦρ βάλλουσιν καὶ καίεται.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/006.yaml
  text: If anyone does not remain in me[a], he is thrown out like the branch and dries up; and they gather them and throw them into the fire[b], and they are burned.
translation:
  language: ig
  text: Ọ bụrụ na onye ọ bụla anọgideghị n’ime m[a], a na-atụpụ ya n’èzí dị ka alaka vaịn, o wee kpọnwụọ; ha na-achịkọta alaka ndị ahụ, tụba ha n’ọkụ[b], ha na-ere ọkụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “anọgideghị na m.” Ngwaa Grik ahụ pụtara ịnọgide ma ọ bụ ịnọgide na mmekọrịta ma ọ bụ n’ọnọdụ.
    reason: lexical_alternative
  - marker: b
    text: Ihe atụ a na-adọ aka ná ntị banyere ịtụpụ n’èzí na ire ọkụ; ma amaokwu a n’onwe ya akọwaghị ma ọ na-ekwu maka onye bụ ezigbo onye na-eso ụzọ nke dapụrụ, ka ọ̀ bụ onye njikọ ya na Jizọs abụghị nke eziokwu.
    reason: alternative_reading
lexical_decisions:
- source_word: μένῃ
  choice: anọgideghị
  rationale: Ngwaa “ịnọgide” na-egosipụta ịnọgide na mmekọrịta ma ọ bụ n’ọnọdụ ahụ; ọ bụ okwu Igbo nke oge a ma na-edobe isi okwu Jọn a ugboro ugboro.
- source_word: ἐν ἐμοί
  choice: n’ime m
  rationale: E debere ahịrịokwu a nso n’ụdị Grik iji chekwaa ike mmekọrịta na nke nkà mmụta okpukpe dị na ya, kama ịsụgharị ya naanị dịka “nyere m.”
- source_word: ἐβλήθη ἔξω
  choice: a na-atụpụ ya n’èzí
  rationale: Nke a na-edobe olu nnara nke Grik ma jiri oge a nke na-ada nke ọma n’Igbo n’ịkọ ọnọdụ izugbe.
- source_word: ὡς τὸ κλῆμα
  choice: dị ka alaka vaịn
  rationale: κλῆμα bụ alaka ma ọ bụ ome vaịn n’ihe atụ a; ịkpọ vaịn aha na-eme ka ihe atụ ahụ doo onye na-agụ Igbo anya.
- source_word: ἐξηράνθη
  choice: ọ kpọnwụọ
  rationale: “Ịkpọ nkụ/ịkpọnwụ” na-egosi alaka nke mmiri ndụ ya gwụsịrị; “ọ kpọnwụọ” bụ ụzọ dị nkenke ma dị ndụ n’Igbo.
- source_word: συνάγουσιν
  choice: ndị mmadụ na-achịkọta
  rationale: Onye nke atọ ọtụtụ na Grik anaghị akọ ndị na-eme ihe ahụ kpọmkwem. “Ndị mmadụ” na-egosipụta ndị ọrụ a na-akọwaghị n’enweghị ịkpọ ndị mmụọ ozi ma ọ bụ otu ndị ọzọ aha.
- source_word: αὐτὰ
  choice: alaka ndị ahụ ... ha
  rationale: Nnọchiaha Grik bụ ọtụtụ, na-ezo aka n’alaka ụdị ahụ n’ozuzu. Ikwughachi “alaka ndị ahụ” na-eme ka mgbanwe site n’otu alaka gaa n’ọtụtụ doo anya n’Igbo.
- source_word: εἰς τὸ πῦρ βάλλουσιν
  choice: tụba ha n’ọkụ
  rationale: Nke a bụ nsụgharị kwụ ọtọ, nke oge a, nke na-edobe ihe oyiyi siri ike nke ịtụba alaka n’ọkụ.
- source_word: καίεται
  choice: ha erekwa
  rationale: Ọ bụ ezie na ngwaa Grik dị n’otu, ọ na-eso nnọchiaha ọtụtụ αὐτά n’usoro ihe oyiyi ahụ. Igbo na-achọ nkwekọrịta doro anya; “ha erekwa” na-ezo aka n’alaka ndị achịkọtara ma ghara itinye echiche nke “irepịa kpamkpam” nke ederede ekwughị.
- source_word: τις
  choice: onye ọ bụla
  rationale: Nke a na-egosipụta onye ọbụla n’ọnọdụ a ma na-edobe ike nke otu onye dị na Grik.
theological_decisions:
- issue: Ma ịdọ aka ná ntị a ọ na-akọ na ezigbo onye na-eso ụzọ furu efu, ka ọ na-ekpughe onye njikọ ya bụ naanị n’elu ọnụ
  choice: E debere ihe atụ na ịdọ aka ná ntị ahụ n’enweghị nkọwa agbakwunyere
  alternative: Ịkọwa ya kpọmkwem dịka ndapụ nke ezigbo onye kwere ekwe, ma ọ bụ dịka ihe akaebe na onye ahụ ejikọtaghị n’ezie
  rationale: Amaokwu ahụ na-ekwu maka ịtụpụ, ịkpọnwụ, na ire ọkụ, ma ọ naghị edozi kpọmkwem ọnọdụ mbụ nke onye ahụ n’ime arụmụka nkà mmụta okpukpe ndị e mesịrị. Nsụgharị ahụ na-edobe ike na mgbagwoju anya ya.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “Alaka vaịn” na-eme ka κλῆμα doo anya. E zere okwu ụka pụrụ iche na nkọwa ga-edozi arụmụka banyere ndapụ n’okwukwe. Akara ndetu [a] na [b] dị n’ederede isi.
