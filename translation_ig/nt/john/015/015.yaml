id: JHN.15.15
reference: John 15:15
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οὐκέτι ⸂λέγω ὑμᾶς⸃ δούλους, ὅτι ὁ δοῦλος οὐκ οἶδεν τί ποιεῖ αὐτοῦ ὁ κύριος· ὑμᾶς δὲ εἴρηκα φίλους, ὅτι πάντα ἃ ἤκουσα παρὰ τοῦ πατρός μου ἐγνώρισα ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/015.yaml
  text: I no longer call you servants[a], because the servant does not know what his master is doing. But I have called you friends[b], because I have made known to you everything that I heard from my Father.
translation:
  language: ig
  text: Anaghị m akpọ unu ndị ohu ọzọ[a], n’ihi na ohu anaghị ama ihe onye nwe ya[b] na-eme. Ma akpọwo m unu ndị enyi, n’ihi na emeela m ka unu mara ihe niile m nụrụ n’aka Nna m.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Okwu Grik bụ doulos; ọ pụrụ ịpụta “ohu” ma ọ bụ “odibo.” E ji “ohu” mee ihe ebe a n’ihi na ọdịiche ya na “ndị enyi” na-emesi ọnọdụ ịnọ n’okpuru onye nwe ya ike.
    reason: lexical_alternative
  - marker: b
    text: Okwu Grik bụ kyrios, nke pụrụ ịpụta “nna ukwu” ma ọ bụ “onye nwe.” N’ebe a, ọ na-ekwu maka onye nwere ikike n’ebe ohu nọ, ọ bụghị aha nsọ e ji akpọ Chineke ma ọ bụ Kraịst.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκέτι λέγω ὑμᾶς
  choice: Anaghị m akpọkwa unu
  rationale: Nke a na-egosipụta na Jizọs anaghịzi akpọ ha otu aha ahụ, ma na-edobe oge ugbu a nke λέγω na mgbanwe nke οὐκέτι.
- source_word: δούλους / δοῦλος
  choice: ndị ohu / ohu
  rationale: “Ohu” na-egosipụta ọnọdụ onye nọ n’okpuru onye nwe ya nke ọma, nke bụ isi ihe dị n’ọdịiche dị n’etiti ndị ohu na ndị enyi n’amaokwu a.
- source_word: οἶδεν τί ποιεῖ
  choice: adịghị ama ihe ... na-eme
  rationale: Nke a na-edobe echiche nke amaghị ihe na omume na-aga n’ihu, ma bụrụkwa Igbo nkịtị ma doo anya.
- source_word: αὐτοῦ ὁ κύριος
  choice: onye nwe ya
  rationale: N’onyonyo mmekọrịta ohu na onye nwe ya, “onye nwe ya” na-egosipụta onye nwere ikike n’ebe ohu nọ n’enweghị ime κύριος aha nsọ ma ọ bụ aha e ji akpọ Kraịst.
- source_word: εἴρηκα φίλους
  choice: akpọọla m unu ndị enyi
  rationale: Ụdị “-ọla” na-egosipụta omume e mere nke nsonaazụ ya ka dị ugbu a; “ndị enyi” na-edobe ọdịiche doro anya ya na “ndị ohu.”
- source_word: πάντα ἃ ἤκουσα παρὰ τοῦ πατρός μου
  choice: ihe niile m nụrụ n’aka Nna m
  rationale: “Ihe niile” na-egosipụta mkpokọta πάντα ἃ, ebe “n’aka Nna m” na-egosipụta Nna ahụ dịka isi mmalite nke ihe ọ nụrụ.
- source_word: ἐγνώρισα ὑμῖν
  choice: emeela m ka unu mara
  rationale: Nke a bụ ụzọ Igbo sitere n’okike si kwuo “ime ka mmadụ mata,” ma na-egosipụta omume e mezuru nke uru ya ka dị ugbu a.
theological_decisions:
- issue: Otú e si sụgharịta δοῦλος n’ọdịiche dị n’etiti ọnọdụ na ọbụbụenyi
  choice: ohu
  alternative: odibo
  rationale: “Ohu” na-edobe ike nke ọnọdụ ịbụ onye nọ kpamkpam n’okpuru onye nwe ya; “odibo” nwere ike ịpụta naanị onye na-eje ozi n’enweghị echiche ahụ siri ike.
- issue: Otú e si sụgharịta κύριος n’onyonyo ezinụlọ na ọnọdụ mmadụ
  choice: onye nwe ya
  alternative: Onyenwe ya / nna ukwu ya
  rationale: N’ebe a κύριος abụghị aha nsọ ma ọ bụ aha Kraịst, kama ọ bụ onye nwere ikike n’ebe ohu nọ. “Onye nwe ya” na-eme ka mmekọrịta ahụ doo anya ma ghara ibubata echiche ọzọ.
- issue: Ike nke perfect εἴρηκα na aorist ἐγνώρισα nwere uru na-adịgide
  choice: akpọọla m ... emeela m ka unu mara
  alternative: akpọrọ m ... mere m ka unu mara
  rationale: Ụdị ndị a na-eme ka o doo anya na ịkpọ ha ndị enyi na ime ka ha mara ihe bụ omume e mere, nke ọnọdụ na uru ya ka dị ugbu a.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta mee ihe. Ahịrịokwu ahụ na-edobe ọdịiche siri ike dị n’etiti “ndị ohu” na “ndị enyi,” ma na-eji “Nna m” debe mmekọrịta Jizọs na Nna ahụ dịka isi mmalite nke ihe o mere ka ndị na-eso ụzọ ya mara.
