revisions:
- from: Anaghị m akpọkwa unu ndị ohu[a], n’ihi na ohu adịghị ama ihe onye nwe ya[b] na-eme. Ma akpọọla m unu ndị enyi, n’ihi na emeela m ka unu mara ihe niile m nụrụ n’aka Nna m.
  to: Anaghị m akpọ unu ndị ohu ọzọ[a], n’ihi na ohu anaghị ama ihe onye nwe ya[b] na-eme. Ma akpọwo m unu ndị enyi, n’ihi na emeela m ka unu mara ihe niile m nụrụ n’aka Nna m.
  rationale: The revision clarifies the temporal force of οὐκέτι, uses a natural generic construction for the slave’s lack of knowledge, and renders εἴρηκα with an unambiguous Igbo perfect. It also corrects the lexical explanation in footnote b while retaining the contextually appropriate translation “onye nwe ya.”
