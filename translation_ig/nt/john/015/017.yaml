    text: 'Ma ọ bụ, “Ihe ndị a ka m na-enye unu n’iwu: Hụrịta onwe unu n’anya.” Nkebiokwu Grik nke malitere na ἵνα nwere ike igosi ebumnuche, ma ọ bụ fọrọ nke nta ka ọ kọwaa ihe iwu ahụ bụ.'
