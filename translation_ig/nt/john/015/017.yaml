  yaml_path: translation/nt/john/015/017.yaml
  text: These things I command you[b][a], so that you may love one another.
translation:
  language: ig
  text: Ihe ndị a ka m na-enye unu n’iwu, ka unu hụrịta onwe unu n’anya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ, “Ihe ndị a ka m na-enye unu n’iwu: Hụrịta onwe unu n’anya.” Nkebiokwu Grik nke malitere na ἵνα nwere ike igosi ebumnuche, ma ọ bụ fọrọ nke nta ka ọ kọwaa ihe iwu ahụ bụ.'
    reason: alternative_reading
lexical_decisions:
- source_word: ταῦτα
  choice: ihe ndị a
  rationale: Nnọchiaha ngosi a dị n’ụdị ọtụtụ ma na-arụtụ aka n’ihe ndị Jizọs kwuru n’ihu; “ihe ndị a” na-echekwa ọtụtụ ahụ nke Grik.
- source_word: ἐντέλλομαι
  choice: Ana m enye iwu
  rationale: Ngwaa a pụtara inye iwu ma ọ bụ ịtụ mmadụ ihe ọ ga-eme. Ụdị “Ana m” na-egosipụta omume dị ugbu a n’ime okwu a n’ụzọ Igbo nkịtị.
- source_word: ὑμῖν
  choice: unu
  rationale: Nke a bụ nnọchiaha onye nke abụọ n’ụdị ọtụtụ; “unu” na-egosi na a na-agwa ndị na-eso ụzọ dịka otu ìgwè okwu.
- source_word: ἵνα
  choice: ka
  rationale: “Ka” na-ewebata ebumnuche ma ọ bụ ihe a chọrọ ka o si n’iwu ndị ahụ pụta, ma ọ naghị ekpebi kpamkpam ma nkebiokwu ahụ bụ naanị ebumnuche ma ọ bụ na ọ na-akọwa ihe iwu ahụ bụ.
- source_word: ἀγαπᾶτε
  choice: unu hụrịta … n’anya
  rationale: Ụdị a na-egosipụta ịhụnanya n’etiti ndị otu ahụ. Ọ dabara nke ọma mgbe “ἀλλήλους” sonyere ya ma ghara ịgbakwunye echiche nke ugboro ugboro nke na-apụtaghị ìhè n’ụdị ngwaa ahụ.
- source_word: ἀλλήλους
  choice: onwe unu
  rationale: Ya na “hụrịta” jikọtara, okwu a na-egosi omume ịhụnanya nke onye ọ bụla na-emere ibe ya n’ime ìgwè ahụ.
theological_decisions:
- issue: Mmekọrịta dị n’etiti iwu ahụ na nkebiokwu ἵνα
  choice: 'E ji “ka” gosi ebumnuche: Jizọs na-enye ha iwu ihe ndị a ka ha hụrịta onwe ha n’anya.'
  alternative: 'A pụkwara ịghọta ya dịka ịkọwa ihe iwu ahụ bụ: “Ana m enye unu iwu ihe ndị a: hụrịtanụ onwe unu n’anya.”'
  rationale: N’ụdị okwu Grik a, ἵνα na-egosikarị ebumnuche ma ọ bụ ihe a chọrọ ka o pụta, ma n’akwụkwọ Jọn ọ pụkwara ịbịaru nso n’ịkọwa ọdịnaya nke iwu ahụ. Isi nsụgharị na-echekwa ebumnuche ahụ, ebe nkọwa ala na-echekwa nghọta ọzọ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe ma nwee ugwu. “Hụrịta onwe unu n’anya” bụ ụzọ ebumpụta ụwa isi gosipụta ịhụnanya nke ibe na ibe, ebe “Ana m enye unu iwu” na-echekwa ike na akụkụ dị ugbu a nke ngwaa Grik.
