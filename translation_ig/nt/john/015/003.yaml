  text: ἤδη ὑμεῖς καθαροί ἐστε διὰ τὸν λόγον ὃν λελάληκα ὑμῖν·
base_translation:
  language: en
  yaml_path: translation/nt/john/015/003.yaml
  text: Already you are clean because of the word that I have spoken to you[a].
translation:
  language: ig
  text: Unu adịworị ọcha n’ihi okwu ahụ m gwaworo unu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “site n’okwu ahụ m gwaworo unu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤδη
  choice: adịworị
  rationale: Akara ‘-worị’ na-egosi na ọnọdụ a amalitela ịdị ma ka dịkwa ugbu a; ọ na-enye echiche nke ‘already’ n’Igbo dị mfe ma dị ndụ.
- source_word: ὑμεῖς
  choice: unu
  rationale: ‘Unu’ na-egosi nke ọma na Jizọs na-agwa ọtụtụ mmadụ okwu. Ọnọdụ ya n’isi ahịrịokwu na-enyere aka idowe nkwusi okwu dị na nnọchiaha Grik ahụ n’enweghị ịgbakwunye ‘onwe unu,’ nke ga-adị arọ ebe a.
- source_word: καθαροί
  choice: ọcha
  rationale: ‘Ọcha’ na-edobe ihe atụ nke ịdị ọcha na njikọ ya na nhicha/ịkpụcha alaka dị n’okwu gbara amaokwu a gburugburu, kama ịtụgharị ya ka ọ bụrụ naanị ịdị nsọ n’omume.
- source_word: διὰ τὸν λόγον
  choice: n’ihi okwu ahụ
  rationale: διά na accusative nwere ike igosi ihe kpatara ọnọdụ ahụ; ‘n’ihi’ bụ ụzọ Igbo nkịtị si kwuo nke a. E debere ụzọ ọzọ nke nwere echiche ‘site na’ n’ala ala peeji.
- source_word: λόγον
  choice: okwu ahụ
  rationale: ‘Okwu’ bụ ntụgharị kpọmkwem nke λόγος ma na-edobe ụdị okwu Jọn ji. ‘Ahụ’ na-egosi na ọ bụ okwu ahụ Jizọs kwuru ka a na-ekwu maka ya.
- source_word: ὃν λελάληκα ὑμῖν
  choice: m gwara unu
  rationale: N’Igbo, ‘okwu ahụ m gwara unu’ bụ ụzọ eke na nghọta nke ọma isi kọwaa okwu Jizọs kwuru nye ha. Ọnọdụ ha nke dị ọcha ugbu a na ‘adịworị’ na-enyere aka igosi nsonaazụ okwu ahụ ka dị, nke kwekọrọ na perfect λελάληκα.
theological_decisions:
- issue: Ụdị ịdị ọcha nke ndị na-eso ụzọ
  choice: E debere okwu ahụ dị ka nkwupụta na ha dị ọcha ugbu a, n’enweghị ịkpọ ya aha dịka ozizi ụka pụrụ iche.
  alternative: Ịkọwa ya kpọmkwem dịka ịsacha site na sakrament ma ọ bụ dịka ikpe nkwupụta na a gụrụ ha ndị ezi omume.
  rationale: Ihe gbara amaokwu ahụ gburugburu ji osisi vaịn na ịkpụcha/ịsacha alaka mee ihe atụ, Jizọs kwukwara na ịdị ọcha ha metụtara okwu o kwuru. Ya mere, ntụgharị ahụ na-edobe ihe atụ ahụ na ohere nghọta nke ederede mbụ.
- issue: Mmekọrịta nke okwu Jizọs na ịdị ọcha ha
  choice: Isi ederede jiri ‘n’ihi’ gosipụta ihe kpatara ya, ma ihe e dere n’ala ala peeji debere ‘site na’ dịka ụzọ ọzọ.
  alternative: Iji naanị ‘site na’ mee ka okwu ahụ pụta ìhè dịka ngwa e ji mee ka ha dị ọcha.
  rationale: διά na accusative ebe a nwere ike ịpụta ‘n’ihi’ ma ọ bụ bụrụ nke a ga-asụgharị n’ụzọ na-emesi ụzọ/ngwa ike. Idebe nhọrọ ọzọ na-egbochi ịkwụsị nghọta ahụ n’otu ụzọ naanị.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe ma dị ugwu. ‘Adịworị ọcha’ bụ okwu ndị mmadụ na-aghọta ngwa ngwa, ebe ‘okwu ahụ m gwara unu’ na-ada eke karịa ntụgharị siri ike dịka ‘okwu ahụ m kwuru nye unu.’
