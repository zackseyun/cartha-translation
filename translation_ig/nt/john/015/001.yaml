id: JHN.15.1
reference: John 15:1
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἐγώ εἰμι ἡ ἄμπελος ἡ ἀληθινή, καὶ ὁ πατήρ μου ὁ γεωργός ἐστιν·
base_translation:
  language: en
  yaml_path: translation/nt/john/015/001.yaml
  text: I am the true vine[a], and my Father is the vinegrower.
translation:
  language: ig
  text: Mụ onwe m bụ ezi osisi vaịn, Nna m bụkwa onye na-akọ ubi vaịn[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “onye ọrụ ubi” ma ọ bụ “onye na-elekọta ubi vaịn.” Okwu Grik ahụ pụtara onye na-akọ ma na-elekọta ala; n’ihe atụ a, ọ na-ekwu maka onye na-akọ ubi vaịn.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγώ εἰμι
  choice: Mụ onwe m bụ
  rationale: Nke a na-egosipụta nkwusiri ike dị na nnọchiaha Ἐγώ, ma nọgide bụrụ okwu Igbo doro anya na nke e ji eme ihe.
- source_word: ἄμπελος
  choice: osisi vaịn
  rationale: “Osisi vaịn” na-enye ihe oyiyi nke osisi na-amị mkpụrụ vaịn n'ụzọ doro anya, ma ghara ịgbanwe ya ka ọ bụrụ ubi vaịn dum.
- source_word: ἀληθινή
  choice: ezi
  rationale: “Ezi” nwere ike ịpụta ihe bụ nke ziri ezi, nke bụ n’ezie, ma ọ bụ nke zuru oke n’ụdị ya; ya mere ọ na-echekwa obosara echiche Jọn n’enweghị ịkọwa ya gabiga ókè.
- source_word: πατήρ μου
  choice: Nna m
  rationale: “Nna m” bụ ụzọ Igbo dị mfe ma dị nsọ e si egosi mmekọrịta Jizọs na Nna ahụ.
- source_word: γεωργός
  choice: onye na-elekọta osisi vaịn
  rationale: N’ọnọdụ ihe atụ a, okwu a na-egosi onye na-arụ ọrụ ịkụzi, idozi, na ilekọta osisi vaịn. Nsụgharị a bụ nke ndị nkịtị ga-aghọta, ma o mechighị ọrụ ahụ naanị n’otu omume.
theological_decisions:
- issue: Ihe atụ dị n’okwu Jizọs bụ “Mụ onwe m bụ”
  choice: E debere ya kpọmkwem dị ka “Mụ onwe m bụ ezi osisi vaịn.”
  alternative: “Mụ onwe m bụ osisi vaịn ahụ nke bụ n’ezie.”
  rationale: Nke a na-echekwa ihe atụ ahụ na nkwusiri ike ya n’enweghị itinye nkọwa banyere ihe ọ na-anọchi anya.
- issue: Ọrụ Nna dị ka γεωργός
  choice: onye na-elekọta osisi vaịn
  alternative: onye ọrụ ubi; onye na-akọ ubi vaịn
  rationale: Nhọrọ a jikọtara okwu ahụ kpọmkwem na osisi vaịn dị n’ihe atụ ahụ, ma zere ịgbakwunye nkọwa okpukpe na-adịghị n’amaokwu ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “Vaịn” bụ okwu mbite a maara nke ọma maka grapevine; itinye “osisi” na-eme ka o doo anya na a na-ekwu banyere osisi ahụ, ọ bụghị ubi vaịn dum.
