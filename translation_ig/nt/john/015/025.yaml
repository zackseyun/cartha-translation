id: JHN.15.25
reference: John 15:25
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀλλ’ ἵνα πληρωθῇ ὁ λόγος ὁ ⸂ἐν τῷ νόμῳ αὐτῶν γεγραμμένος⸃ ὅτι Ἐμίσησάν με δωρεάν.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/025.yaml
  text: 'But this happened so that the word written in their Law might be fulfilled: ‘They hated me without cause.’[a][b][c]'
translation:
  language: ig
  text: 'Ma nke a mere[a] ka okwu ahụ e dere n’Iwu ha[b] wee mezuo: “Ha kpọrọ m asị n’enweghị ihe kpatara ya.”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n’ụdị na-esochi Grik nso karị, “Ma ka okwu ahụ e dere n’Iwu ha wee mezuo.” Grik ekwughị isi ahịrịokwu ahụ kpọmkwem; a gbakwụnyere “nke a mere” site n’ihe gbara ya gburugburu ka Igbo doo anya.
    reason: lexical_alternative
  - marker: b
    text: “Iwu ha” na-eji “Iwu” n’echiche sara mbara nke Akwụkwọ Nsọ ndị Juu; ihe e hotara sitere n’Abụ Ọma (tụlee Abụ Ọma 35:19; 69:4).
    reason: cross_reference
  - marker: c
    text: Ma ọ bụ, “n’enweghị ihe mere ha ji mee otú ahụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: Ma
  rationale: Njikọ a na-egosi ntụgharị ma ọ bụ mmegide n’ihe Jizọs kwuru tupu nke a; “Ma” bụ ụzọ Igbo dị mfe ma kwekọọ na ya.
- source_word: ἵνα πληρωθῇ
  choice: ka ... wee mezuo
  rationale: Nke a na-egosipụta nzube ma ọ bụ ihe si na ya pụta, ma na-edebe echiche Jọn banyere mmezu nke Akwụkwọ Nsọ n’enweghị ịkọwa ya karịa ka ụtọasụsụ Grik si kwuo.
- source_word: ὁ λόγος
  choice: okwu ahụ
  rationale: N’ebe a, λόγος bụ otu okwu e dere n’Akwụkwọ Nsọ, ọ bụghị aha “Okwu” e ji akọwa Kraịst ná mmalite Oziọma Jọn.
- source_word: ἐν τῷ νόμῳ αὐτῶν γεγραμμένος
  choice: e dere n’Iwu ha
  rationale: “E dere” na-egosipụta ihe ka dị n’akwụkwọ, “Iwu ha” na-edebekwa νόμος na αὐτῶν dịka ha dị n’isi mmalite.
- source_word: νόμῳ
  choice: Iwu
  rationale: Ọ bụ ezie na ihe e hotara sitere n’Abụ Ọma, Jọn nwere ike iji νόμος kpọọ Akwụkwọ Nsọ ndị Juu n’ozuzu ya. “Iwu” na-edebe okwu Grik ahụ, ebe nkọwa ala peeji na-akọwa ojiji ya sara mbara.
- source_word: ὅτι
  choice: ':'
  rationale: Akara ntụpọ abụọ na-ewebata ihe dị n’okwu Akwụkwọ Nsọ ahụ n’ụzọ doro anya ma dịkwa mma n’Igbo.
- source_word: Ἐμίσησάν με
  choice: Ha kpọrọ m asị
  rationale: Nke a na-asụgharị aorist dị ka ihe mere n’oge gara aga ma na-ada ka Igbo nkịtị.
- source_word: δωρεάν
  choice: n’enweghị ihe kpatara ya
  rationale: Nke a na-egosi na ịkpọ ya asị enweghị ihe ziri ezi kpatara ya, ma ọ bụ na e mere ya n’enweghị ihe kpatara ya.
theological_decisions:
- issue: Ihe “Iwu ha” pụtara mgbe ihe e hotara sitere n’Abụ Ọma
  choice: E debere “Iwu” n’ahịrịokwu, ma ghọta ya dịka aha sara mbara maka Akwụkwọ Nsọ ndị Juu, nke gụnyere Abụ Ọma n’ebe a.
  alternative: Ịsụgharị ya “Akwụkwọ Nsọ ha” iji mee ka echiche sara mbara pụta ìhè ozugbo.
  rationale: Ebe Grik ji νόμος, idebe “Iwu” na-asọpụrụ ọdịdị isi mmalite; nkọwa ala peeji na-egbochi ndị na-agụ ya iche na ọ bụ naanị akwụkwọ ise Mosis ka a na-ekwu maka ya.
- issue: Ijuputa isi ahịrịokwu Grik nke a hapụrụ n’ekwughị ya
  choice: E tinyere “nke a mere” ka ahịrịokwu ahụ bụrụ Igbo zuru oke ma doo anya.
  alternative: “Ma ka okwu ahụ e dere n’Iwu ha wee mezuo,” nke na-edebe nghọta ahịrịokwu Grik nke a hapụrụ.
  rationale: Grik na-adabere n’ihe e kwuru tupu ya ma hapụ isi ahịrịokwu ahụ. “Nke a mere” na-eme ka Igbo bụrụ nke eke n’etinyeghị ozizi ọhụrụ; nkọwa ala peeji na-echekwa ọdịdị Grik ahụ.
- issue: Nzube ma ọ bụ ihe si na ya pụta n’okwu ἵνα
  choice: “ka ... wee mezuo,” nke nwere ike ibu echiche nzube ma ọ bụ mmezu sitere n’ihe merenụ.
  alternative: Ịkọwa ya naanị dịka “n’ihi nzube nke imezu,” nke ga-eme ka nzube pụta ìhè karịa.
  rationale: Ụdị a na-echekwa ohere echiche abụọ dị n’ọrụ ἵνα ma ghara ikwusi ike n’otu nkọwa banyere ihe Chineke kpebiri karịa ka ederede si kwuo.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. “Kpọrọ m asị” bụ okwu Igbo nkịtị maka ịkpọ mmadụ asị; “Iwu” malitere na mkpụrụedemede ukwu iji gosi na ọ bụ aha Akwụkwọ Nsọ n’ojiji a. E zere okwu ụka pụrụ iche na nkọwa nke ga-emechi mgbagwoju anya dị n’etiti nzube na ihe si na ya pụta.
