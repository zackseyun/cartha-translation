id: JHN.15.2
reference: John 15:2
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: πᾶν κλῆμα ἐν ἐμοὶ μὴ φέρον καρπὸν αἴρει αὐτό, καὶ πᾶν τὸ καρπὸν φέρον καθαίρει αὐτὸ ἵνα ⸂καρπὸν πλείονα⸃ φέρῃ.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/002.yaml
  text: Every branch in me that does not bear fruit[a], he removes; and every branch that bears fruit[b], he prunes so that it may bear more fruit.
translation:
  language: ig
  text: Alaka ọ bụla dị n’ime m nke na-adịghị amị mkpụrụ[a], ọ na-ewepụ ya; alaka ọ bụla nke na-amị mkpụrụ[b], ọ na-akwacha ya ka o wee mịkwuo mkpụrụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “ọ na-eburu ya pụọ”; ụfọdụ na-aghọta αἴρει n’ebe a dị ka “ọ na-ebuli ya elu.”
    reason: alternative_reading
  - marker: b
    text: Ngwaa a sụgharịrị “na-akwacha” nwekwara ike ịpụta “na-asacha” ma ọ bụ “na-eme ka ọ dị ọcha.” “Na-akwacha” dabara n’ihe atụ ubi vaịn, okwu ahụ na-atụkwa aka n’okwu banyere ịdị “ọcha” n’amaokwu na-esonụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶν κλῆμα
  choice: Alaka ọ bụla
  rationale: πᾶν ya na aha otu ihe nwere echiche nkesa; “alaka ọ bụla” bụ Igbo doro anya nke na-egosi alaka n’otu n’otu.
- source_word: ἐν ἐμοὶ
  choice: dị n’ime m
  rationale: Nsụgharị a na-edobe okwu Jọn banyere ịdị “n’ime” Kraịst n’ebughị ụzọ kọwaa ụdị njikọ ahụ.
- source_word: μὴ φέρον καρπὸν
  choice: nke na-adịghị amị mkpụrụ
  rationale: Nkebi participle ahụ ghọrọ nkebi njikọ dị mfe n’Igbo, ma na-edobe echiche nke ịghara ịmị mkpụrụ.
- source_word: αἴρει
  choice: na-ewepụ
  rationale: N’ihe atụ ubi vaịn a, “na-ewepụ” na-egosipụta ọdịiche dị n’etiti ihe a na-eme alaka na-adịghị amị mkpụrụ na ịkwacha nke na-amị mkpụrụ. A hapụrụ echiche ọzọ, “na-ebuli elu,” n’ala peeji.
- source_word: καρπός
  choice: mkpụrụ
  rationale: “Mkpụrụ” bụ okwu Igbo nkịtị na nke dabara n’ihe atụ osisi na-amị mkpụrụ.
- source_word: καθαίρει
  choice: na-akwacha
  rationale: N’ihe gbasara osisi vaịn, “ịkwacha” na-egosi ọrụ onye ọrụ ubi nke ọma; e deberekwa echiche nke “ịsacha/ime ka ọ dị ọcha” n’ala peeji n’ihi njikọ okwu ya na amaokwu na-esonụ.
- source_word: ἵνα καρπὸν πλείονα φέρῃ
  choice: ka o wee mịkwuo mkpụrụ
  rationale: “Ka o wee” na-egosi nzube nke ἵνα, ebe “mịkwuo mkpụrụ” na-enye echiche ntụnyere nke πλείονα n’Igbo sitere n’okike.
- source_word: αὐτό / αὐτὸ
  choice: ya / o
  rationale: Nnochiaha ndị a na-alaghachi n’alaka ahụ; e ji ụdị nnochiaha Igbo dabara n’ọnọdụ nke ọ bụla.
- source_word: καὶ πᾶν τὸ καρπὸν φέρον
  choice: alaka ọ bụla nke na-amị mkpụrụ
  rationale: E weghachiri “alaka” nke a ghọtara site n’ahịrịokwu mbụ ka ahịrịokwu Igbo doo anya ma debe nhazi yiri ibe ya.
theological_decisions:
- issue: Ihe αἴρει pụtara n’ahịrịokwu mbụ
  choice: ọ na-ewepụ ya
  alternative: ọ na-ebuli ya elu
  rationale: “Na-ewepụ” kacha kwekọọ n’ọdịiche dị n’ihe onye na-elekọta ubi na-eme alaka na-adịghị amị mkpụrụ na nke na-amị mkpụrụ, n’etinyeghị ozizi pụrụ iche banyere ịdapụ n’okwukwe ma ọ bụ ịnọgide na ya. E debere “na-ebuli ya elu” n’ala peeji dịka nghọta ọzọ kwere omume.
- issue: Ihe καθαίρει pụtara n’ihe atụ ahụ
  choice: ọ na-akwacha ya
  alternative: ọ na-asacha ya / na-eme ka ọ dị ọcha
  rationale: “Ịkwacha” dabara kpọmkwem n’ọrụ ubi vaịn, ma okwu Grik nwekwara echiche ịsacha nke jikọtara ya na okwu “dị ọcha” n’amaokwu na-esonụ; ya mere, e chekwara nghọta ahụ n’ala peeji.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E debere ihe atụ alaka na mkpụrụ, asụsụ Jọn nke “dị n’ime m,” na nghọta abụọ dị mkpa nke αἴρει na καθαίρει n’enweghị itinye ozizi otu ụka.
