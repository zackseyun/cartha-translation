  verdict: revise
  source_fidelity: 'The main text faithfully renders the Greek contrast: every unfruitful branch in Jesus is removed, while every fruitful branch is pruned for the purpose of bearing more fruit. “Dị n’ime m,” “na-ewepụ ya,” “na-akwacha ya,” and “ka o wee mịkwuo mkpụrụ” preserve the relevant Johannine and viticultural senses without imposing a doctrinal conclusion.'
  naturalness: The verse is clear, idiomatic Standard Igbo, with appropriate formal-scriptural register. The parallel clauses and pronoun references are natural.
  terminology: “Alaka,” “mkpụrụ,” and “na-akwacha” are apt for the vine metaphor. The current note a, however, presents “ọ na-ewepụ ya” as an alternative even though that is already the main-text rendering; it should instead give a genuinely distinct idiomatic rendering for the ‘takes away’ sense and retain ‘lifts up’ as the interpretive alternative.
  issues:
  - severity: low
    issue: Footnote a duplicates the main-text rendering as its stated alternative.
    rationale: The note currently says that αἴρει may be translated “ọ na-ewepụ ya,” which is precisely the translation used in the verse. Replacing it with “ọ na-eburu ya pụọ” supplies a meaningful alternative for ‘takes away’ while preserving the note’s mention of ‘lifts up.’
  revised_text: Alaka ọ bụla dị n’ime m nke na-adịghị amị mkpụrụ[a], ọ na-ewepụ ya; alaka ọ bụla nke na-amị mkpụrụ[b], ọ na-akwacha ya ka o wee mịkwuo mkpụrụ.
