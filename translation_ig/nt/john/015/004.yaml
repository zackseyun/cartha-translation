id: JHN.15.4
reference: John 15:4
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: μείνατε ἐν ἐμοί, κἀγὼ ἐν ὑμῖν. καθὼς τὸ κλῆμα οὐ δύναται καρπὸν φέρειν ἀφ’ ἑαυτοῦ ἐὰν μὴ ⸀μένῃ ἐν τῇ ἀμπέλῳ, οὕτως οὐδὲ ὑμεῖς ἐὰν μὴ ἐν ἐμοὶ ⸀μένητε.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/004.yaml
  text: Remain in me[a], and I in you. Just as the branch is not able to bear fruit by itself unless it remains in the vine, so neither can you unless you remain in me.
translation:
  language: ig
  text: Nọgidenụ n'ime m[a], mụ kwa n'ime unu. Dị ka alaka enweghị ike ịmị mkpụrụ n'onwe ya ma ọ bụrụ na ọ nọgideghị n'osisi vaịn, otu ahụkwa ka unu enweghị ike ịmị mkpụrụ ma ọ bụrụ na unu anọgideghị n'ime m.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Nọọnụ n'ime m, mụ kwa n'ime unu.” Okwu Grik μένω nwekwara ike ịsụgharị “nọọnụ” ma ọ bụ “biri n'ime,” ma n'ebe a ọ na-egosi ịnọgide na mmekọrịta a.
    reason: lexical_alternative
lexical_decisions:
- source_word: μείνατε / μένῃ / μένητε
  choice: Nọgidenụ / ọ nọgideghị / unu anọgideghị
  rationale: “Ịnọgide” na-egosipụta ịnọgide n'otu ọnọdụ ma ọ bụ mmekọrịta, ma na-edobe otu isi okwu ahụ n'ebe atọ μένω pụtara. Ọ bụ okwu Igbo dị ugbu a ma doo anya.
- source_word: ἐν ἐμοί
  choice: n'ime m
  rationale: “N'ime m” na-edobe ihe atụ nke ἐν ma na-egosi njikọ chiri anya, ọ bụghị naanị ịnọnyere mmadụ.
- source_word: κἀγὼ ἐν ὑμῖν
  choice: mụ onwe m kwa n'ime unu
  rationale: E debere ahịrịokwu ahụ n'enweghị ngwaa dịka Grik si dị, ka a ghara ịgbakwunye nkwa ma ọ bụ nkọwa nke isi mmalite ahụ ekwughị kpọmkwem.
- source_word: τὸ κλῆμα
  choice: alaka
  rationale: “Alaka” bụ okwu Igbo nkịtị maka akụkụ osisi ahụ e ji mee ihe atụ a.
- source_word: οὐ δύναται καρπὸν φέρειν
  choice: na-enweghị ike ịmị mkpụrụ
  rationale: Nke a na-edobe echiche doro anya nke enweghị ikike nakwa ihe atụ ugbo nke ịmị mkpụrụ.
- source_word: ἀφ’ ἑαυτοῦ
  choice: n'onwe ya
  rationale: Ọ bụ ụzọ Igbo ebumpụta ụwa si egosi na alaka apụghị ime nke a site n'ike nke ya.
- source_word: ἐν τῇ ἀμπέλῳ
  choice: n'osisi vaịn
  rationale: “Osisi vaịn” na-akọwa osisi ahụ n'ụzọ ndị na-agụ Igbo ugbu a ga-aghọta, ma na-edobe “n'ime/n'” nke ihe atụ Grik.
- source_word: οὕτως οὐδὲ ὑμεῖς
  choice: otu ahụkwa ka unu na-enweghị ike ịmị mkpụrụ
  rationale: A kpọghachiri “ịmị mkpụrụ” nke dị n'ahịrịokwu bu ụzọ ka ahịrịokwu Igbo zuo oke ma doo anya; ọ bụ echiche ngwaa a hapụrụ n'ahịrịokwu Grik.
theological_decisions:
- issue: Ihe μένω pụtara n'ihe gbasara mmekọrịta ndị na-eso ụzọ na Jizọs
  choice: ịnọgide n'ime
  alternative: ibi n'ime / ịdị n'ime
  rationale: “Ịnọgide n'ime” na-edobe ma echiche nke nnọgidesi ike ma njikọ chiri anya, n'enweghị itinye ozizi otu ụka pụrụ iche.
- issue: Ahịrịokwu na-enweghị ngwaa κἀγὼ ἐν ὑμῖν
  choice: mụ onwe m kwa n'ime unu
  alternative: mụ onwe m kwa ga-anọgide n'ime unu
  rationale: Isi mmalite Grik ekwughị ngwaa ahụ kpọmkwem. Idebe ọdịdị dị mkpụmkpụ na-echekwa mgbagwoju anya ya ma ghara ime ya ka ọ bụrụ nkwa ọdịnihu a kọwara nke ọma karịa ihe e dere.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. A họọrọ “osisi vaịn” iji mee ka ihe atụ ugbo doo anya; e debere nkebi “mụ onwe m kwa n'ime unu” n'ụdị ya dị mkpụmkpụ dịka Grik si dị.
