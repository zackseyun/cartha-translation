revisions:
- from: Nọgidenụ n'ime m[a], mụ onwe m kwa n'ime unu. Dị nnọọ ka alaka na-enweghị ike ịmị mkpụrụ n'onwe ya ma ọ bụrụ na ọ nọgideghị n'osisi vaịn, otu ahụkwa ka unu na-enweghị ike ịmị mkpụrụ ma ọ bụrụ na unu anọgideghị n'ime m.
  to: Nọgidenụ n'ime m[a], mụ kwa n'ime unu. Dị ka alaka enweghị ike ịmị mkpụrụ n'onwe ya ma ọ bụrụ na ọ nọgideghị n'osisi vaịn, otu ahụkwa ka unu enweghị ike ịmị mkpụrụ ma ọ bụrụ na unu anọgideghị n'ime m.
  rationale: The revision removes added reflexive emphasis from the elliptical reciprocal clause, slightly smooths the comparison, and replaces the inaccurate footnote alternative with a valid rendering of μένω. It retains the source’s repeated ‘remain,’ its ἐν (‘in’) imagery, and the implied ability-to-bear-fruit sense in the final comparison.
