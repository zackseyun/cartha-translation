review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the imperative to remember, the slave/master status comparison, the persecution parallel, and the deliberately broad Johannine sense of τηρέω ('keep'). The placement of the final phrase as 'nke unu' correctly represents 'your word.'
  naturalness: A safe idiomatic correction is needed in the proverbial comparison. 'nna ya ukwu' is not the natural ordering for 'his master' in Standard Igbo and can be understood differently; 'nna ukwu ya' is the established and natural form. 'Ohu adịghị akarị ...' is also more idiomatic for the status comparison than 'adịghị ukwuu karịa.'
  terminology: '''Ohu'' appropriately preserves δοῦλος in this social-status saying, and ''nna ukwu ya'' appropriately renders κύριος here without introducing the divine title. ''Idebe okwu'' retains the intentional breadth of τηρέω; the footnote''s alternative should use the natural infinitival form ''irubere ... isi.'''
  issues:
  - severity: medium
    issue: Word order in 'nna ya ukwu'
    rationale: For 'his master,' Standard Igbo naturally uses 'nna ukwu ya.' The draft's order is potentially ambiguous and is not the usual form for the slave's master.
  - severity: low
    issue: Comparative expression in the proverb
    rationale: '''Ohu adịghị akarị nna ukwu ya'' is a more natural Igbo rendering of ''A slave is not greater than his master'' and more clearly expresses comparative status.'
  - severity: low
    issue: Footnote alternative is phrased as an imperative
    rationale: A lexical alternative in the note is clearer as 'irubere okwu m isi' rather than the plural imperative 'ruberenụ okwu m isi.'
