id: JHN.15.20
reference: John 15:20
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: μνημονεύετε τοῦ λόγου οὗ ἐγὼ εἶπον ὑμῖν· Οὐκ ἔστιν δοῦλος μείζων τοῦ κυρίου αὐτοῦ· εἰ ἐμὲ ἐδίωξαν, καὶ ὑμᾶς διώξουσιν· εἰ τὸν λόγον μου ἐτήρησαν, καὶ τὸν ὑμέτερον τηρήσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/020.yaml
  text: 'Remember the word that I said to you: ‘A servant is not greater than his master.’ If they persecuted me[a], they will also persecute you; if they kept my word[b], they will also keep yours.'
translation:
  language: ig
  text: 'Chetanụ okwu ahụ m gwara unu: ‘Ohu adịghị akarị nna ukwu ya.’ Ọ bụrụ na ha kpagburu m, ha ga-akpagbukwa unu; ọ bụrụ na ha debere okwu m[a], ha ga-edebekwa nke unu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “irubere okwu m isi.” N’akwụkwọ Jọn, “idebe okwu” nwere ike ịgụnye ịnabata ozi Jizọs na ibi ndụ n’irubere ya isi.
    reason: lexical_alternative
lexical_decisions:
- source_word: μνημονεύετε
  choice: Chetanụ
  rationale: Na-egosipụta iwu e nyere ọtụtụ mmadụ ka ha nọgide na-echeta ihe Jizọs kwuru.
- source_word: λόγου
  choice: okwu
  rationale: N'ebe a ọ na-ezo aka n'otu okwu Jizọs kwuru; ‘okwu’ na-echekwa njikọ ya na ‘okwu m’ n'ikpeazụ amaokwu ahụ.
- source_word: δοῦλος
  choice: ohu
  rationale: ‘Ohu’ na-egosipụta onye nọ n'okpuru ikike nna ya ukwu, nke bụ isi ihe atụnyere n'ilu a.
- source_word: μείζων
  choice: dị ukwuu karịa
  rationale: Na-echekwa ntụnyere sara mbara gbasara ọkwa ma ghara imechi ya naanị n'ịdị mkpa.
- source_word: κυρίου
  choice: nna ya ukwu
  rationale: N'okwu gbasara ohu, nke a bụ ụzọ Igbo doro anya na nke ebumpụta ụwa isi kwuo onye nwe ya ma ọ bụ onye isi ya; ọ bụghị aha nsọ ‘Onyenweanyị’ ebe a.
- source_word: ἐδίωξαν / διώξουσιν
  choice: kpagburu / ga-akpagbukwa
  rationale: N'ọnọdụ iro megide Jizọs na ndị na-eso ụzọ ya, ‘ịkpagbu’ na-enye echiche nke persecution nke ọma.
- source_word: ἐτήρησαν / τηρήσουσιν
  choice: debere / ga-edebekwa
  rationale: ‘Idebe okwu’ bụ okwu Igbo dị mma nke nwere ike ịgụnye ịnabata okwu ahụ na irubere ya isi, ma na-echekwa njikọ okwu Jọn ji.
- source_word: τὸν λόγον μου ... τὸν ὑμέτερον
  choice: okwu m ... nke unu
  rationale: Na-echekwa ntụnyere dị n'etiti okwu Jizọs na okwu ndị na-eso ụzọ ya ma zere ikwughachi ‘okwu’ n'ụzọ na-adịghị mkpa.
theological_decisions:
- issue: Nsụgharị δοῦλος n'ilu banyere ọkwa
  choice: ohu
  alternative: onye na-eje ozi
  rationale: Ihe atụnyere ya na κύριος na-eme ka ọnọdụ onye nọ n'okpuru ikike onye ọzọ pụta ìhè; ‘ohu’ na-echekwa ike okwu ahụ karịa ‘onye na-eje ozi.’
- issue: Nsụgharị κύριος mgbe ọ bụ onye nọ n'elu δοῦλος
  choice: nna ya ukwu
  alternative: Onyenwe ya
  rationale: N'ebe a okwu ahụ na-egosi onye nwe ohu ma ọ bụ onye nwere ikike n'ahụ ya, ọ bụghị aha nsọ e ji akpọ Chineke ma ọ bụ Kraịst.
- issue: Oke echiche dị na τηρέω
  choice: debere okwu m
  alternative: ruberenụ okwu m isi
  rationale: ‘Idebe okwu’ na-ahapụ nghọta Jọn nwere nke ịnabata ozi ahụ na ibi ndụ n'irubere ya isi, kama imechi ya naanị n'otu akụkụ.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E ji ‘ohu—nna ya ukwu’ chekwaa ike ntụnyere Gris, ma e ji ‘idebe okwu’ chekwaa obosara nghọta τηρέω.
