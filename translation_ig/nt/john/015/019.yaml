    text: A pụkwara ịsụgharị ya, “Ọ bụrụ na unu bụ nke ụwa.” Okwu Grik ἐκ τοῦ κόσμου nwere ike igosi ebe e si pụta ma ọ bụ ịbụ nke ụwa.
    reason: lexical_alternative
