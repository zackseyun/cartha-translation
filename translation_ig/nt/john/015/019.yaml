id: JHN.15.19
reference: John 15:19
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἰ ἐκ τοῦ κόσμου ἦτε, ὁ κόσμος ἂν τὸ ἴδιον ἐφίλει· ὅτι δὲ ἐκ τοῦ κόσμου οὐκ ἐστέ, ἀλλ’ ἐγὼ ἐξελεξάμην ὑμᾶς ἐκ τοῦ κόσμου, διὰ τοῦτο μισεῖ ὑμᾶς ὁ κόσμος.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/019.yaml
  text: If you were from the world[a], the world would love its own. But because you are not from the world, but I chose you out of the world, for this reason the world hates you.
translation:
  language: ig
  text: Ọ bụrụ na unu si n’ụwa[a], ụwa gaara ahụ nke ya n’anya. Ma n’ihi na unu esighị n’ụwa, kama m họpụtara unu site n’ụwa, ọ bụ ya mere ụwa ji kpọọ unu asị.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “Ọ bụrụ na unu bụ nke ụwa.” Okwu Grik ἐκ τοῦ κόσμου nwere ike igosi ebe e si pụta ma ọ bụ ịbụ nke ụwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ τοῦ κόσμου
  choice: si n’ụwa
  rationale: “Si n’ụwa” na-egosipụta isi mmalite ma ọ bụ ịbụ nke ụwa, ma na-emekwa ka nkwughachi nke ἐκ τοῦ κόσμου pụta ìhè n’Igbo.
- source_word: κόσμος
  choice: ụwa
  rationale: “Ụwa” na-edobe obosara ihe okwu Jọn pụtara, na-akọwaghị ya n’ụzọ ga-eme ka ọ bụrụ naanị usoro ụmụ mmadụ na-emegide Chineke.
- source_word: ἂν ... ἐφίλει
  choice: gaara ahụ ... n’anya
  rationale: Ụdị “gaara” na-egosipụta n’Igbo ọnọdụ a na-eche n’echiche nke na-abụghị eziokwu; “ịhụ n’anya” bụ okwu ebumpụta ụwa maka φιλέω n’ebe a.
- source_word: τὸ ἴδιον
  choice: ndị nke ya
  rationale: N’ọnọdụ a, okwu ahụ na-ezo aka n’ụmụ mmadụ ndị ụwa na-ewere dị ka nke ya. “Ndị nke ya” dabara na ndị a na-agwa okwu ma na-adị mma n’Igbo, n’agbanyeghị na Grik ji ụdị neuter singular.
- source_word: ἐξελεξάμην
  choice: m họpụtara
  rationale: “M họpụtara” na-enye echiche ịhọrọ nke ọma n’enweghị itinye ozizi pụrụ iche gbasara nhọpụta.
- source_word: ἐκ τοῦ κόσμου
  choice: site n’ụwa
  rationale: Mgbe ọ so “m họpụtara unu,” “site n’ụwa” na-egosipụta na a họpụtara ha pụọ n’etiti ụwa, ma zere echiche na e wepụrụ ha n’ụwa n’ụzọ anụ ahụ.
- source_word: διὰ τοῦτο
  choice: ọ bụ ya mere
  rationale: Nke a bụ ụzọ Igbo dị ndụ si egosipụta ihe kpatara nsonaazụ ahụ.
- source_word: μισεῖ
  choice: kpọọ ... asị
  rationale: “Ịkpọ asị” na-edobe ike na mmegide doro anya nke μισέω, n’emeghị ka okwu ahụ dị nro.
theological_decisions:
- issue: Ihe “ụwa” pụtara n’akwụkwọ Jọn
  choice: E debere “ụwa” n’ahịrịokwu bụ isi n’enweghị nkọwa agbakwunyere.
  alternative: usoro ụwa; ọha mmadụ na-emegide Chineke
  rationale: Okwu ahụ nwere obosara echiche omume na mmụọ n’akwụkwọ Jọn; ịgbasa ya n’ahịrịokwu ga-emechi ihe Grik hapụrụ sara mbara.
- issue: Ihe nhọpụta Jizọs na ἐξελεξάμην na-egosi
  choice: “M họpụtara unu site n’ụwa.”
  alternative: Nsụgharị nwere okwu siri ike nke jikọtara ya kpọmkwem na otu usoro ozizi banyere nhọpụta ma ọ bụ akara aka
  rationale: Amaokwu ahụ kwuru hoo haa na Jizọs họpụtara ndị na-eso ụzọ ya, ma ọ naghị edozi n’onwe ya arụmụka ozizi ndị ọzọ; nsụgharị ahụ na-edobe nkwupụta ahụ n’enweghị ịgbakwunye nkọwa otu ụka.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E debere nkwughachi “ụwa” na ọdịiche dị n’etiti ịhụ n’anya na ịkpọ asị. Akara nkọwa ala peeji [a] dị n’ahịrịokwu bụ isi.
