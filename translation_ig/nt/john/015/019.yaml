review_pass:
  verdict: revise
  source_fidelity: The conditional force, the threefold κόσμος/ἐκ τοῦ κόσμου wording, Jesus’ choosing, and the causal conclusion are substantially represented. However, “ndị nke ya” specifies people where τὸ ἴδιον is neutrally ‘its own/what belongs to it’; this unnecessary specification should be removed.
  naturalness: The verse is clear and uses natural Standard Igbo. “Ụwa gaara ahụ nke ya n’anya” is also idiomatic enough in context and better preserves the Greek’s open reference. The footnote’s final wording in the draft is unnatural and unclear and needs recasting.
  terminology: “Ụwa,” “ịhụ n’anya,” “họpụtara,” and “ịkpọ asị” appropriately preserve the Johannine register and theological breadth without doctrinal expansion. “Site n’ụwa” appropriately conveys selection from/out of the world in this context.
  issues:
  - severity: medium
    issue: “ndị nke ya” narrows τὸ ἴδιον.
    rationale: The Greek neuter singular is deliberately non-specific (‘its own’ / ‘what is its own’), not explicitly ‘its own people.’ Since the wording can remain natural without that added referent, the Igbo should retain the ambiguity.
  - severity: low
    issue: The footnote explanation of the belonging nuance is unclear Igbo.
    rationale: “onye/ìgwè mmadụ nwere mmadụ” does not naturally explain the lexical alternative. It should state plainly that the expression can indicate source or belonging/association.
  revised_text: Ọ bụrụ na unu si n’ụwa[a], ụwa gaara ahụ nke ya n’anya. Ma n’ihi na unu esighị n’ụwa, kama m họpụtara unu site n’ụwa, ọ bụ ya mere ụwa ji kpọọ unu asị.
  revised_footnotes:
