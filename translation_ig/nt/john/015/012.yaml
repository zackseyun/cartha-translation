    reason: lexical_alternative
  revision_rationale: The revision removes the redundant reciprocal morphology, retains the explicit reciprocal expression “ibe unu,” and uses the simple past for the Greek aorist. The footnote preserves the viable interpretive alternatives of emphatic “dị nnọọ ka” and present-perfect “hụworo.”
