  text: Αὕτη ἐστὶν ἡ ἐντολὴ ἡ ἐμὴ ἵνα ἀγαπᾶτε ἀλλήλους καθὼς ἠγάπησα ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/john/015/012.yaml
  text: 'This is my command: that you love one another just as I have loved you[a].'
translation:
  language: ig
  text: 'Nke a bụ iwu m: ka unu hụ ibe unu n’anya, dịka m hụrụ unu n’anya.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ, “Nke a bụ iwu m: ka unu hụ ibe unu n’anya, dị nnọọ ka m hụworo unu n’anya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Αὕτη
  choice: Nke a
  rationale: Nnọchiaha ngosi a na-akọwapụta iwu Jizọs na-ekwu ugbu a; “Nke a” bụ ụzọ Igbo si ekwu ya nke ọma.
- source_word: ἐντολή
  choice: iwu
  rationale: “Iwu” bụ okwu Igbo doro anya ma na-adị ugbu a nke na-echekwa ikike dị n’ihe Jizọs nyere n’iwu.
- source_word: ἡ ἐμὴ
  choice: m
  rationale: Njikọ “iwu m” na-egosi n'ụzọ Igbo nkịtị na iwu ahụ bụ nke Jizọs ma sitere n’ikike ya.
- source_word: ἵνα
  choice: ka
  rationale: N’ebe a, ἵνα na-ewebata ihe iwu ahụ kwuru; “ka” na-arụ ọrụ a n’Igbo n’enweghị ime ya naanị ahịrịokwu ebumnuche.
- source_word: ἀγαπᾶτε
  choice: hụrịta ... n’anya
  rationale: “Ịhụ n’anya” bụ okwu Igbo nkịtị maka ἀγαπάω; ụdị mmekọrịta “hụrịta” na-adaba na ἀλλήλους ma na-egosi omume na-aga n’etiti ndị ahụ.
- source_word: ἀλλήλους
  choice: ibe unu
  rationale: “Ibe unu” na-echekwa echiche mmeghachi omume nke ịhụrịta onwe ha n’anya.
- source_word: καθὼς
  choice: dị nnọọ ka
  rationale: 'Ọ na-egosi ntụnyere nke ọma: ịhụnanya Jizọs bụ ụkpụrụ nke ịhụnanya ndị na-eso ụzọ ya.'
- source_word: ἠγάπησα
  choice: m hụworo ... n’anya
  rationale: Ụdị “hụworo” na-egosi ịhụnanya Jizọs o gosipụtarala nke ka bara uru ugbu a, ma ihe odide Grik nwekwara ike ịpụta oge gara aga dị mfe.
- source_word: ὑμᾶς
  choice: unu
  rationale: “Unu” na-egosi nke ọma na Jizọs na-agwa ọtụtụ ndị na-eso ụzọ ya okwu.
theological_decisions:
- issue: Nsụgharị okwu ἀγαπάω
  choice: hụ ... n’anya
  alternative: nwee ịhụnanya n’ebe ... nọ
  rationale: “Ịhụ n’anya” bụ okwu Igbo kachasị eke ma na-echekwa njikọ okwu ịhụnanya n’akụkụ Akwụkwọ Nsọ a n’etinyeghị nkọwa ụka pụrụ iche.
- issue: Ike na ụkpụrụ dị n’iwu Jizọs
  choice: 'Nke a bụ iwu m: ka unu hụrịta ibe unu n’anya dị nnọọ ka m hụworo unu n’anya.'
  alternative: Nke a bụ iwu m, ka unu hụrịta ibe unu n’anya ka m hụrụ unu n’anya.
  rationale: Nsụgharị a na-echekwa ma ikike iwu ahụ ma ntụnyere καθὼς, nke na-eme ịhụnanya Jizọs ụkpụrụ nke ịhụnanya ndị na-eso ụzọ ya, n’enweghị itinye nkọwa ozizi ọzọ.
translation_notes:
  register: Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E ji “unu” mee ka ọnụọgụ ọtụtụ dị na Grik pụta ìhè; e tinyere akara ntụaka [a] n’isiokwu ahụ.
