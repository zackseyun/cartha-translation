id: JHN.15.5
reference: John 15:5
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐγώ εἰμι ἡ ἄμπελος, ὑμεῖς τὰ κλήματα. ὁ μένων ἐν ἐμοὶ κἀγὼ ἐν αὐτῷ οὗτος φέρει καρπὸν πολύν, ὅτι χωρὶς ἐμοῦ οὐ δύνασθε ποιεῖν οὐδέν.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/005.yaml
  text: I am the vine[a]; you are the branches. The one who remains in me, and I in him, bears much fruit[b], because apart from me you are not able to do anything.
translation:
  language: ig
  text: Mụ onwe m bụ osisi vaịn ahụ; unu bụ alaka ya. Onye na-anọgide[a] n’ime m, onye mụ onwe m na-anọgidekwa n’ime ya[b], na-amị ọtụtụ mkpụrụ, n’ihi na e wezụga m, unu apụghị ime ihe ọ bụla.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “onye na-ebi n’ime m.” Ngwaa Grik ahụ na-egosi ịnọgide n’otu mmekọrịta, ọkachasị n’akwụkwọ Jọn.
    reason: lexical_alternative
  - marker: b
    text: N’asụsụ Grik, “ya” dị n’ụdị nwoke, otu onye, ma a na-eji ya anọchi anya onye na-eso ụzọ ọ bụla nke na-anọgide n’ime Jizọs.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄμπελος
  choice: osisi vaịn
  rationale: N’Igbo a na-akpọ osisi na-amị mkpụrụ vaịn “osisi vaịn.” Nke a na-eme ka ihe atụ ahụ doo anya n’enweghị nkọwa agbakwunyere.
- source_word: κλήματα
  choice: alaka ya
  rationale: “Alaka” bụ okwu Igbo nkịtị maka akụkụ ndị na-esi n’osisi pụta; “ya” na-egosi njikọ ha na osisi vaịn ahụ dịka ihe atụ Grik si dị.
- source_word: ὁ μένων
  choice: onye na-anọgide
  rationale: “Na-anọgide” na-egosi ịnọgide n’otu ọnọdụ ma ọ bụ mmekọrịta ruo ogologo oge, ma na-ada ka Igbo ugbu a karịa okwu ochie ma ọ bụ nke siri ike.
- source_word: ἐν ἐμοὶ ... ἐν αὐτῷ
  choice: n’ime m ... n’ime ya
  rationale: E debere “n’ime” iji chekwaa okwu siri ike nke Jọn banyere ịdị n’ime ibe ha; ịsụgharị ya ka “nọnyeere” ga-eme ka ike ihe ahụ pụtara belata.
- source_word: κἀγὼ
  choice: mụ onwe m ana-anọgidekwa
  rationale: '“Mụ onwe m” na “-kwa” na-egosipụta nzaghachi nke dị n’usoro Grik: onye ahụ na-anọgide n’ime Jizọs, Jizọs ana-anọgidekwa n’ime onye ahụ.'
- source_word: φέρει
  choice: na-amị
  rationale: N’ihe gbasara osisi na mkpụrụ, “ịmị mkpụrụ” bụ ụzọ Igbo kachasị eke isi kwuo na osisi na-amịpụta mkpụrụ.
- source_word: καρπὸν πολύν
  choice: ọtụtụ mkpụrụ
  rationale: Nke a na-edobe ma ihe oyiyi ọrụ ugbo ma echiche nke mkpụrụ bara ụba n’enweghị ịkọwa ụdị mkpụrụ ahụ.
- source_word: χωρὶς ἐμοῦ
  choice: e wezụga m
  rationale: Nkebiokwu a na-egosi na onye ahụ nọ iche n’ebe Jizọs nọ, ọ bụghị naanị na enyemaka Jizọs adịghị ya.
- source_word: οὐ δύνασθε
  choice: unu apụghị
  rationale: “Apụghị” na-egosi enweghị ike, ọ bụghị iwu machibidoro mmadụ ime ihe.
- source_word: ποιεῖν οὐδέν
  choice: ime ihe ọ bụla
  rationale: Mgbe “apụghị” gachara, “ihe ọ bụla” bụ usoro Igbo doro anya na nke eke maka echiche Grik nke enweghị ihe ọbụla a pụrụ ime.
theological_decisions:
- issue: Okwu Jọn banyere ịdị n’ime ibe ha
  choice: nọgide n’ime m, mụ onwe m ana-anọgidekwa n’ime ya
  alternative: nọnyere m, mụ onwe m ana-anọnyekwa ya
  rationale: “N’ime” na-echekwa omimi na esemokwu dị n’okwu Grik banyere njikọ Jizọs na onye na-eso ụzọ, kama ime ka ọ bụrụ naanị ịnọkọ ọnụ.
- issue: Ụdị nwoke otu onye dị na αὐτῷ
  choice: ya
  alternative: nwoke ahụ
  rationale: Nnọchiaha Igbo “ya” anaghị egosi nwoke ma ọ bụ nwanyị. Itinye “nwoke” ga-eme ka okwu Grik nke na-anọchi anya onye na-eso ụzọ ọ bụla bụrụ okwu gbasara nwoke naanị. Ihe odide ala peeji na-akọwa ụdị asụsụ Grik ahụ n’emeghị ka Igbo ghara ịdị eke.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E debere ihe atụ osisi vaịn na alaka ya, tinyere usoro “n’ime m ... n’ime ya,” n’ihi na ha bụ isi ihe dị n’okwu Grik. E jiri “mụ onwe m” mee ka nkwusi okwu ἐγώ pụta ìhè, ma zere okwu ụka pụrụ iche ma ọ bụ nkọwa ozizi agbakwunyere.
