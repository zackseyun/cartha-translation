    text: Ma ọ bụ, “a garaghị ama ha ikpe n’ihi mmehie.” N’asụsụ Grik, okwu ahụ pụtara n’ụzọ nkịtị, “ha agaraghị enwe mmehie.”
    reason: lexical_alternative
  revision_rationale: The revision corrects the unnatural relative clause and removes added reflexive emphasis, while preserving the conditional force, the literal Johannine expression ‘enwe mmehie,’ the contrast ‘Ma ugbu a,’ and the coordinated hatred of Jesus and his Father. The footnote remains clearly marked as an interpretive alternative rather than replacing the source expression in the text.
