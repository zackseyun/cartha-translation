  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἰ τὰ ἔργα μὴ ἐποίησα ἐν αὐτοῖς ἃ οὐδεὶς ἄλλος ⸀ἐποίησεν, ἁμαρτίαν οὐκ ⸀εἴχοσαν· νῦν δὲ καὶ ἑωράκασιν καὶ μεμισήκασιν καὶ ἐμὲ καὶ τὸν πατέρα μου.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/024.yaml
  text: If I had not done among them the works that no one else did[a], they would not have sin[b]; but now they have both seen and hated both me and my Father.
translation:
  language: ig
  text: A sị na arụghị m n’etiti ha ọrụ ndị ọ dịghị onye ọzọ rụrụ, ha agaraghị enwe mmehie[a]. Ma ugbu a, ha ahụla ma kpọọkwa ma mụ ma Nna m asị.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “a garaghị ama ha ikpe n’ihi mmehie.” N’asụsụ Grik, okwu ahụ pụtara n’ụzọ nkịtị, “ha agaraghị enwe mmehie.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ ἔργα
  choice: ọrụ
  rationale: “Ọrụ” na-echekwa okwu Jọn ji maka ihe Jizọs mere nke na-ekpughe onye ọ bụ na ozi ya.
- source_word: ἐποίησα ἐν αὐτοῖς
  choice: arụghị m n’etiti ha
  rationale: “N’etiti ha” na-egosi na Jizọs rụrụ ọrụ ndị ahụ n’ihu ha na n’etiti ha, ọ bụghị na ọ rụrụ ha n’ime ahụ ha.
- source_word: ἃ οὐδεὶς ἄλλος ἐποίησεν
  choice: ndị onye ọzọ ọ bụla na-emebeghị
  rationale: Nke a na-egosi na ọrụ Jizọs ndị a pụrụ iche, ma na-asụkwa ya n’ụzọ Igbo dị mfe nghọta.
- source_word: ἁμαρτίαν οὐκ εἴχοσαν
  choice: ha agaraghị enwe mmehie
  rationale: Nsụgharị a na-echekwa akpaalaokwu Grik, “inwe mmehie,” kama ịkọwa ya ozugbo dị ka ikpe ọmụma ma ọ bụ ibu ọrụ maka mmehie.
- source_word: νῦν δὲ
  choice: Ma ugbu a
  rationale: Ọ na-egosi ọdịiche dị n’etiti ọnọdụ a tụlere na ihe dị ugbu a.
- source_word: καὶ ἑωράκασιν καὶ μεμισήκασιν
  choice: ha ahụla ma kpọọkwa ... asị
  rationale: Ụdị a na-egosi omume abụọ ahụ—ịhụ na ịkpọ asị—ma na-echekwa mmetụta nke ihe merela nke ka dị mkpa ugbu a.
- source_word: καὶ ἐμὲ καὶ τὸν πατέρα μου
  choice: ma mụ onwe m ma Nna m
  rationale: Ntughari “ma ... ma ...” na-echekwa nkwusi ike nke καὶ ... καὶ n’ebe Jizọs na Nna ya nọ.
theological_decisions:
- issue: Ihe “ha agaraghị enwe mmehie” pụtara banyere ikpe ọmụma ha
  choice: Echekwara akpaalaokwu ahụ, “inwe mmehie.”
  alternative: ha agaraghị ama ikpe maka mmehie
  rationale: Amaokwu ahụ na-ekwu maka ibu ikpe nke na-abawanye n’ihi na ha hụrụ ọrụ pụrụ iche Jizọs ma jụ ya; ma nsụgharị ekwesịghị imechi okwu ahụ n’otu nkọwa nkà mmụta okpukpe naanị.
translation_notes:
  register: E ji Igbo Izugbe dị ugbu a, dị ugwu ma dị mfe nghọta. “A sị na ... ha agaraghị ...” na-egosi ọnọdụ na-emeghị eme nke amaokwu ahụ, ebe “mụ onwe m” na-enye nkwusi ike kwekọrọ na Grik.
