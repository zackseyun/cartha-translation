revisions:
- from: A sị na arụghị m n’etiti ha ọrụ ndị onye ọzọ ọ bụla na-emebeghị, ha agaraghị enwe mmehie[a]. Ma ugbu a, ha ahụla ma kpọọkwa ma mụ onwe m ma Nna m asị.
  to: A sị na arụghị m n’etiti ha ọrụ ndị ọ dịghị onye ọzọ rụrụ, ha agaraghị enwe mmehie[a]. Ma ugbu a, ha ahụla ma kpọọkwa ma mụ ma Nna m asị.
  rationale: The revision corrects the unnatural relative clause and removes added reflexive emphasis, while preserving the conditional force, the literal Johannine expression ‘enwe mmehie,’ the contrast ‘Ma ugbu a,’ and the coordinated hatred of Jesus and his Father. The footnote remains clearly marked as an interpretive alternative rather than replacing the source expression in the text.
