id: JHN.15.23
reference: John 15:23
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ ἐμὲ μισῶν καὶ τὸν πατέρα μου μισεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/023.yaml
  text: The one who hates me also hates my Father.
translation:
  language: ig
  text: Onye kpọrọ m asị kpọrọkwa Nna m asị.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ... μισῶν
  choice: Onye kpọrọ ... asị
  rationale: Artikulu na participle dị ugbu a na-arụ ọrụ dị ka aha, na-ezo aka n’ụdị onye a maara site n’omume ahụ. “Onye kpọrọ ... asị” bụ ụzọ Igbo nkịtị si ekwu ya ma na-edobe echiche izugbe nke onye ahụ.
- source_word: ἐμὲ
  choice: m
  rationale: Ọ bụ nnọchiaha onye nke mbụ nke na-anata omume ahụ; “m” na-enye nkọwa ya kpọmkwem n’Igbo.
- source_word: μισῶν / μισεῖ
  choice: kpọrọ ... asị / kpọkwara ... asị
  rationale: Nkebi abụọ ahụ sitere n’otu ngwaa μισέω, nke pụtara ịkpọ asị. Ikwughachi “kpọrọ ... asị” na-edobe nkwughachi okwu Grik; usoro perfect a na-ejikarị eme ihe n’Igbo na-egosi ọnọdụ ma ọ bụ àgwà na-adịgide adịgide, kwekọrọ na present izugbe ebe a.
- source_word: καὶ
  choice: -kwara
  rationale: 'Mgbakwunye “-kwara” na ngwaa nke abụọ na-egosipụta echiche “ọzọkwa/also” n’ụzọ Igbo dị ụtọ: ịkpọ Jizọs asị gụnyekwara ịkpọ Nna ya asị.'
- source_word: τὸν πατέρα μου
  choice: Nna m
  rationale: Nke a bụ ụzọ Igbo ebumpụta ụwa si sụgharịa “my Father.” E dere “Nna” na mkpụrụedemede ukwu iji gosi na ọ bụ aha mmekọrịta Jizọs ji ezo aka na Chineke.
theological_decisions:
- issue: Mkpụrụedemede ukwu n’aha “Nna” mgbe ọ na-ezo aka na Chineke
  choice: Nna m
  alternative: nna m
  rationale: N’Oziọma Jọn, okwu Jizọs bụ “Nna m” na-ezo aka na Chineke ma na-egosi mmekọrịta pụrụ iche ya na ya. Mkpụrụedemede ukwu na-eme ka onye a na-ekwu maka ya doo anya n’enweghị ịgbakwunye nkọwa ọhụrụ.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị mkpirikpi, dị ùgwù, ma bụrụ nke ndị na-agụ akwụkwọ taa ga-aghọta ngwa ngwa. Ahịrịokwu ahụ na-edobe nkwughachi na njikọ siri ike dị n’ederede Grik.
