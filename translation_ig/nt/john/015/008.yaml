review_pass:
  verdict: revise
  source_fidelity: The draft accurately retains the broad reference of ἐν τούτῳ, the fruit-bearing image of καρπὸν πολὺν φέρητε, and the becoming sense of γένησθε. However, «e mere Nna m otuto» is not the clearest Standard Igbo equivalent for ἐδοξάσθη; the normal idiom is to give someone glory/honor («e nyere ... otuto»).
  naturalness: «E nyere Nna m otuto» is more idiomatic and immediately intelligible than «e mere Nna m otuto». The remaining syntax is natural, and «ghọkwara ndị na-eso ụzọ m» properly preserves the coordinate καί and the change-of-state force of γένησθε.
  terminology: «Nna m», «otuto», «mkpụrụ», and «ndị na-eso ụzọ m» are appropriate Standard Igbo terms. No doctrinally loaded wording has been introduced.
  issues:
  - severity: medium
    issue: Non-idiomatic rendering of ἐδοξάσθη
    rationale: «E mere Nna m otuto» is a literalized construction that can sound like ‘glory was made for my Father.’ «E nyere Nna m otuto» is the normal Igbo expression for giving/glorifying someone and better conveys the passive verb.
  revised_text: 'Nʼime nke a ka e nyere Nna m otuto: ka unu mịa ọtụtụ mkpụrụ, ghọkwara ndị na-eso ụzọ m.'
