base_translation:
  language: en
  yaml_path: translation/nt/john/015/008.yaml
  text: 'In this my Father is glorified: that you bear much fruit and become my disciples.'
translation:
  language: ig
  text: 'Nʼime nke a ka e nyere Nna m otuto: ka unu mịa ọtụtụ mkpụrụ, ghọkwara ndị na-eso ụzọ m.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: Nʼime nke a
  rationale: Na-edobe ntụaka ahụ nʼụzọ sara mbara dịka Grik si kwuo, nʼenweghị ịmanye ya ka ọ bụrụ naanị ‘site na nke a.’
- source_word: ἐδοξάσθη
  choice: ka e mere ... otuto
  rationale: Na-egosipụta aorist passive nke δοξάζω nʼụzọ Igbo dị mfe nghọta; ihe gbara amaokwu ahụ gburugburu na-egosi na ịmị mkpụrụ na-eme ka otuto Nna pụta ìhè.
- source_word: καρπὸν πολὺν φέρητε
  choice: ka unu mịa ọtụtụ mkpụrụ
  rationale: Na-edobe ihe atụ nke osisi vaịn na mkpụrụ, ma jiri okwu Igbo a na-ejikarị ekwu banyere osisi ịmị mkpụrụ.
- source_word: γένησθε ἐμοὶ μαθηταί
  choice: ghọkwara ndị na-eso ụzọ m
  rationale: γένησθε pụtara ‘unu aghọọ’; ‘ndị na-eso ụzọ m’ bụ nsụgharị doro anya ma bụrụ nke nkịtị maka μαθηταί na mmekọrịta ya na ἐμοί.
theological_decisions:
- issue: Mmekọrịta dị nʼetiti otuto Nna, ịmị mkpụrụ, na ịbụ ndị na-eso ụzọ
  choice: 'E debere ya dịka nzube ma ọ bụ nsonaazụ: ‘ka unu mịa ... ghọkwara ...’'
  alternative: ‘site nʼịmị ọtụtụ mkpụrụ ma gosi na unu bụ ndị na-eso ụzọ m’
  rationale: ἵνα nwere ike igosi nzube ma ọ bụ nsonaazụ, ebe γένησθε bụ ‘unu aghọọ,’ ọ bụghị kpọmkwem ‘unu gosi na unu bụ.’ Nsụgharị a anaghị edozi esemokwu ahụ nʼụzọ karịrị ihe Grik kwuru.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E debere ihe atụ ‘mkpụrụ’ nke okwu gbara amaokwu ahụ gburugburu; enweghị akara nkọwa ala peeji nʼihi na ọ dịghị nke dị mkpa.
