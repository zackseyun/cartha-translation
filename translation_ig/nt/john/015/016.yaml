revisions:
- from: Ọ bụghị unu họọrọ m,[a] kama ọ bụ m họọrọ unu, họpụtakwa unu ka unu gaa mịa mkpụrụ, ka mkpụrụ unu wee dịgide,[b] ka ihe ọ bụla unu rịọrọ Nna[c] n’aha m, o nye unu ya.
  to: Ọ bụghị unu họọrọ m,[a] kama ọ bụ m họọrọ unu, edobekwara m unu ka unu gaa mịa mkpụrụ, ka mkpụrụ unu wee dịgide,[b] ka Nna[c] nye unu ihe ọ bụla unu rịọrọ ya n’aha m.
  rationale: The revision distinguishes Jesus’ choosing (ἐξελεξάμην) from his appointing/placing (ἔθηκα), preserving the Greek sequence and the commissioning sense. It also clarifies the final ἵνα clause in idiomatic Standard Igbo without strengthening it into an unconditional future promise or adding doctrinal interpretation.
  reviewer_model: gpt-5.6-terra
