review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the central contrast, going, fruit-bearing, the enduring fruit, and asking the Father in Jesus’ name. However, “họpụtakwa” for ἔθηκα repeats the semantic field of choosing and does not adequately express Jesus’ subsequent placing/appointing of the disciples for their task.
  naturalness: The wording is generally natural Standard Igbo. Recasting the final purpose clause with “Nna ... nye unu ihe ọ bụla unu rịọrọ ya” is clearer and avoids the slightly awkward sequence “ihe ọ bụla ... Nna ... o nye unu ya.”
  terminology: “họrọ,” “mịa mkpụrụ,” “dịgide,” and “n’aha m” are appropriate. “edobekwara m unu” more closely represents τίθημι in this commissioning context without making it ecclesiastical ordination.
  issues:
  - severity: medium
    issue: “họpụtakwa unu” renders ἔθηκα.
    rationale: ἔθηκα means ‘I set/placed/appointed,’ whereas ịhọpụta means choose/select. Since ἐξελεξάμην has already expressed choosing, the draft loses the source’s second, distinct action.
  - severity: low
    issue: The final purpose clause is syntactically less clear than it could be in Igbo.
    rationale: Putting “Nna” as the subject of “nye” and “ihe ọ bụla unu rịọrọ ya” as its object expresses the Greek relation clearly while retaining the purpose construction.
  revised_text: Ọ bụghị unu họọrọ m,[a] kama ọ bụ m họọrọ unu, edobekwara m unu ka unu gaa mịa mkpụrụ, ka mkpụrụ unu wee dịgide,[b] ka Nna[c] nye unu ihe ọ bụla unu rịọrọ ya n’aha m.
  revised_footnotes:
  - marker: a
    text: A pụkwara ịsị, “unu họpụtara m.” Okwu Grik ahụ pụtara ịhọrọ ma ọ bụ ịhọpụta; “họọrọ” dabara nke ọma n’ebe a n’etinyeghị okwu nkà mmụta okpukpe pụrụ iche n’amaokwu ahụ.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsị, “nọrọgide.” Jọn na-ejikarị okwu a ekwu maka ịnọgide na mmekọrịta ma ọ bụ ịdịru; “dịgide” bụ okwu Igbo doro anya n’ebe a.
    reason: lexical_alternative
  - marker: c
    text: Grik ahụ kwuru “Nna,” ọ bụghị “Nna m.”
    reason: lexical_alternative
  revision_rationale: The revision distinguishes Jesus’ choosing (ἐξελεξάμην) from his appointing/placing (ἔθηκα), preserving the Greek sequence and the commissioning sense. It also clarifies the final ἵνα clause in idiomatic Standard Igbo without strengthening it into an unconditional future promise or adding doctrinal interpretation.
