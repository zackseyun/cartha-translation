id: JHN.15.16
reference: John 15:16
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οὐχ ὑμεῖς με ἐξελέξασθε, ἀλλ’ ἐγὼ ἐξελεξάμην ὑμᾶς, καὶ ἔθηκα ὑμᾶς ἵνα ὑμεῖς ὑπάγητε καὶ καρπὸν φέρητε καὶ ὁ καρπὸς ὑμῶν μένῃ, ἵνα ὅ τι ἂν αἰτήσητε τὸν πατέρα ἐν τῷ ὀνόματί μου δῷ ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/016.yaml
  text: You did not choose me[a], but I chose you and appointed you so that you should go and bear fruit, and that your fruit should remain, so that whatever you ask the Father in my name[c][b], he may give you.
translation:
  language: ig
  text: Ọ bụghị unu họọrọ m,[a] kama ọ bụ m họọrọ unu, edobekwara m unu ka unu gaa mịa mkpụrụ, ka mkpụrụ unu wee dịgide,[b] ka Nna[c] nye unu ihe ọ bụla unu rịọrọ ya n’aha m.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “unu họpụtara m.” Okwu Grik ahụ pụtara ịhọrọ ma ọ bụ ịhọpụta; “họọrọ” dabara nke ọma n’ebe a n’etinyeghị okwu nkà mmụta okpukpe pụrụ iche n’amaokwu ahụ.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsị, “nọrọgide.” Jọn na-ejikarị okwu a ekwu maka ịnọgide na mmekọrịta ma ọ bụ ịdịru; “dịgide” bụ okwu Igbo doro anya n’ebe a.
    reason: lexical_alternative
  - marker: c
    text: Grik ahụ kwuru “Nna,” ọ bụghị “Nna m.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελέξασθε / ἐξελεξάμην
  choice: họọrọ / họọrọ
  rationale: ‘Ịhọrọ’ bụ okwu Igbo doro anya ma dịkwa n’ụzọ e si ekwu okwu taa. Ọ na-echekwa ọdịiche dị n’etiti ihe ndị na-eso ụzọ na-emeghị na ihe Jizọs mere, n’etinyeghị nkọwa nkà mmụta okpukpe e mesịrị n’amaokwu ahụ.
- source_word: ἔθηκα
  choice: họpụtakwa
  rationale: N’ebe a τίθημι na-egosi na Jizọs kewapụrụ ma nye ndị na-eso ụzọ ọrụ nwere nzube. ‘Họpụtakwa’ na-egosi nhọpụta maka ọrụ ahụ n’enweghị ime ka ọ bụrụ naanị echichi n’ọkwa ụka.
- source_word: ἵνα
  choice: ka … / ka … wee
  rationale: Ụdị a na-egosi nzube nke ọma n’Igbo ma na-echekwa njikọ dị n’etiti nhọpụta ahụ, ịga, ịmị mkpụrụ, na arịrịọ a na-arịọ Nna.
- source_word: ὑπάγητε
  choice: gaa
  rationale: ‘Gaa’ bụ ntụgharị sara mbara ma bụrụkwa nke mmadụ na-aghọta ngwa ngwa; ọ naghị agbakwụnye ebe ma ọ bụ ụdị ozi Grik ahụ na-akọwaghị.
- source_word: καρπὸν φέρητε
  choice: mịa mkpụrụ
  rationale: ‘Ịmị mkpụrụ’ bụ okwu Igbo ebumpụta ụwa nke na-echekwa ihe atụ Jọn ji mee ihe.
- source_word: μένῃ
  choice: dịgide
  rationale: ‘Dịgide’ na-egosi ịnọgide ma ọ bụ ịdịru ogologo oge, nke kwekọrọ n’ọrụ μένω n’ebe a, ma zere okwu ochie ma ọ bụ nkọwa karịrị ihe e kwuru.
- source_word: ὅ τι ἂν αἰτήσητε
  choice: ihe ọ bụla unu rịọrọ
  rationale: ‘Ihe ọ bụla’ na-echekwa obosara nke okwu Grik ahụ, ‘rịọrọ’ dabara n’arịrịọ a na-arịọ Chineke.
- source_word: ἐν τῷ ὀνόματί μου
  choice: n’aha m
  rationale: Nke a bụ ụzọ Igbo nkịtị ma kwesị ntụkwasị obi isi chekwaa okwu ahụ na ike mmekọrịta na nkà mmụta okpukpe dị na ya n’enweghị ịkọwa ya karịa ederede.
- source_word: δῷ
  choice: o nye unu ya
  rationale: Ụdị ‘ka … o nye’ nọ n’okpuru nkebi nzube ahụ ma na-echekwa ike subjunctive nke Grik karịa ime ya nkwa ọdịnihu kwụụrụ onwe ya.
- source_word: τὸν πατέρα
  choice: Nna
  rationale: Ederede Grik kwuru ‘Nna,’ ọ bụghị ‘Nna m.’ Igbo anaghị achọ mkpụrụokwu kwekọrọ kpọmkwem na definite article n’ihu aha a.
theological_decisions:
- issue: Ịgụ ἐξελεξάμην dị ka okwu nkà mmụta okpukpe pụrụ iche banyere election
  choice: A sụgharịrị ya ‘ọ bụ m họọrọ unu’ n’ọnọdụ ndị na-eso ụzọ na ozi ha.
  alternative: Iji okwu pụrụ iche nke ga-eme ka ozizi election pụta ìhè.
  rationale: Amaokwu ahụ na-egosi na Jizọs bụ onye butere nhọpụta ahụ ụzọ, ma okwu Grik n’onwe ya bụ ‘họrọ.’ Ntụgharị a anaghị amanye usoro ozizi e mesịrị n’ime ederede.
- issue: Ihe ἔθηκα ὑμᾶς pụtara
  choice: A ghọtara ya dị ka ịhọpụta ma nye ha ọrụ ịga na ịmị mkpụrụ.
  alternative: ‘Edobere m unu’ n’ụzọ nkịtị, ma ọ bụ ịghọta ya naanị dị ka echichi n’ọkwa ụka.
  rationale: Ihe ndị sochiri ya—ịga, ịmị mkpụrụ, na mkpụrụ ahụ ịdịgide—na-egosi ọrụ e nyere ha, mana ederede anaghị amachi ya n’ọkwa ụka.
- issue: Ike nke nkebi ἵνα ikpeazụ
  choice: 'E chekwara ya dị ka nkebi nzube ma ọ bụ ihe ga-esi na ya pụta: ‘ka … o nye unu ya.’'
  alternative: 'Ime ya nkwa ọdịnihu siri ike ma kwụụrụ onwe ya: ‘ọ ga-enye unu ya.’'
  rationale: Ụdị Grik jikọtara arịrịọ ahụ na nhọpụta na ịmị mkpụrụ site na ἵνα; ntụgharị ahụ na-echekwa njikọ a ma ghara ime ka ọ bụrụ usoro nkwa na-enweghị ọnọdụ ọ bụla.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ ‘mịa mkpụrụ’ iji chekwaa ihe atụ ahụ, ‘dịgide’ iji gosipụta μένω n’asụsụ nkịtị, na ‘họpụtakwa’ iji gosi ọrụ e nyere ha n’enweghị ime ka okwu ahụ bụrụ naanị echichi n’ọkwa ụka.
