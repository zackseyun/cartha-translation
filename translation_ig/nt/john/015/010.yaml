id: JHN.15.10
reference: John 15:10
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐὰν τὰς ἐντολάς μου τηρήσητε, μενεῖτε ἐν τῇ ἀγάπῃ μου, καθὼς ἐγὼ ⸂τὰς ἐντολὰς τοῦ πατρός μου⸃ τετήρηκα καὶ μένω αὐτοῦ ἐν τῇ ἀγάπῃ.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/010.yaml
  text: If you keep my commandments, you will remain in my love, just as I have kept my Father's commandments and remain in his love.
translation:
  language: ig
  text: Ọ bụrụ na unu edebe iwu m, unu ga-anọgide n'ịhụnanya m, dị nnọọ ka m debeworo iwu Nna m ma na-anọgidekwa n'ịhụnanya ya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐὰν
  choice: Ọ bụrụ na
  rationale: Na-egosi ọnọdụ n'ụzọ doro anya ma ghara itinye echiche nke ime ihe ugboro ugboro na-adịghị na Grik.
- source_word: ἐντολάς
  choice: iwu
  rationale: “Iwu” bụ okwu Igbo dị mfe ma dị ùgwù nke na-egosi ntụziaka nwere ikike; ọ dabara n'iji ἐντολή eme ihe n'akwụkwọ Jọn.
- source_word: τηρήσητε / τετήρηκα
  choice: edebe / debeworo
  rationale: “Idebe” na-echekwa echiche nke ịsọpụrụ na irube isi n'iwu, ma na-ejidekwa njikọ okwu dị n'etiti ụdị ngwaa abụọ ahụ. “Debeworo” na-egosi ihe e mere nke nsonaazụ ya ka dị ugbu a.
- source_word: μενεῖτε / μένω
  choice: ga-anọgide / na-anọgide
  rationale: “Ịnọgide” bụ okwu Igbo eke nke na-echekwa isiokwu Jọn banyere ịnọgide na mmekọrịta, ma na-eme ka njikọ dị n'etiti ngwaa abụọ ahụ pụta ìhè.
- source_word: ἐν τῇ ἀγάπῃ μου
  choice: n'ịhụnanya m
  rationale: Nsụgharị a na-echekwa onyonyo nke ịnọ n'ime mpaghara mmekọrịta nke ịhụnanya, kama ịkọwa ya n'ụzọ ga-emechi nghọta ya.
- source_word: καθὼς
  choice: dị nnọọ ka
  rationale: Na-egosi ntụnyere siri ike n'etiti idebe iwu nke ndị na-eso ụzọ na ihe nlereanya Jizọs.
- source_word: τοῦ πατρός μου
  choice: Nna m
  rationale: Ọ bụ ụzọ Igbo eke isi kwuo njikọ nwe, ebe “Nna” na-arụ ọrụ dị ka aha e ji akpọ Chineke n'ọnọdụ a.
- source_word: αὐτοῦ ἐν τῇ ἀγάπῃ
  choice: n'ịhụnanya ya
  rationale: “Ya” na-ezo aka n'ụzọ doro anya n'ebe Nna nọ ma na-echekwa nhazi yiri “n'ịhụnanya m.”
theological_decisions:
- issue: Mmekọrịta dị n'etiti idebe iwu na ịnọgide n'ịhụnanya Jizọs
  choice: 'E gosipụtara ya dịka ọnọdụ n''ezie: “Ọ bụrụ na ... unu ga-anọgide,” n''enweghị nkọwa agbakwunyere banyere inweta ịhụnanya site n''ọrụ ma ọ bụ ịla n''iyi nzọpụta.'
  alternative: Ịkọwa idebe iwu dị ka ụzọ e si erite ịhụnanya Chineke, ma ọ bụ mee ka ọnọdụ ahụ bụrụ naanị ihe àmà na-enweghị ezigbo ike ọnọdụ.
  rationale: Grik na-enye ọnọdụ doro anya ma jiri nrubeisi Jizọs tụnyere nke ndị na-eso ụzọ, ma amaokwu ahụ anaghị edozi arụmụka sara mbara banyere uru ọrụ, ntachi obi, ma ọ bụ nzọpụta.
- issue: Nkọwa nke ἀγάπη
  choice: ịhụnanya
  alternative: ebere ma ọ bụ okwu ọzọ na-akọwa naanị otu akụkụ ya
  rationale: “Ịhụnanya” bụ okwu Igbo zuru oke ma na-echekwa njikọ okwu ahụ ugboro abụọ n'amaokwu a.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị mfe nghọta ma dị ùgwù. E ji “unu” gosipụta onye nke abụọ n'ụbara nke Grik. E debere mmegharị okwu “edebe/debeworo” na “ga-anọgide/na-anọgide” iji chekwaa nhazi na isiokwu okwu nke ederede Grik.
