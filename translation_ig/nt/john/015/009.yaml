revisions:
- from: Dị nnọọ ka Nna hụrụ m n’anya, otu ahụ ka mụ onwe m hụkwara unu n’anya.[a] Nọgidenụ n’ịhụnanya m.
  to: Dị nnọọ ka Nna hụrụ m n’anya, otu ahụ ka mụ kwa hụrụ unu n’anya.[a] Nọgidenụ n’ịhụnanya m.
  rationale: The revision reduces unnecessary emphatic duplication while preserving the comparison and the ‘and I/also I’ force of κἀγώ. The footnote is adjusted to match the revised wording and to state the aorist/perfect alternative without claiming that the Greek itself demands continuing action.
