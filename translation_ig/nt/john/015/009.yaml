  text: καθὼς ἠγάπησέν με ὁ πατήρ, κἀγὼ ⸂ὑμᾶς ἠγάπησα⸃, μείνατε ἐν τῇ ἀγάπῃ τῇ ἐμῇ.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/009.yaml
  text: Just as the Father has loved me[a], I also have loved you; remain in my love.
translation:
  language: ig
  text: Dị nnọọ ka Nna hụrụ m n’anya, otu ahụ ka mụ kwa hụrụ unu n’anya.[a] Nọgidenụ n’ịhụnanya m.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ: “Dị nnọọ ka Nna hụworo m n’anya, otu ahụ ka mụ kwa hụworo unu n’anya.” Ngwaa Greek abụọ a dị n’ụdị aorist, nke a pụrụ ịsụgharị dị ka ihe mere n’oge gara aga; nsụgharị a ọzọ na-egosi na ihe mere ahụ ka nwere mkpa ugbu a.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς
  choice: Dị nnọọ ka … otu ahụ ka
  rationale: Usoro a na-egosi ntụnyere doro anya n’etiti ịhụnanya Nna nwere n’ebe Jizọs nọ na ịhụnanya Jizọs nwere n’ebe ndị na-eso ụzọ ya nọ.
- source_word: ἠγάπησέν με
  choice: hụrụ m n’anya
  rationale: Nke a bụ ụzọ Igbo nkịtị na nke dị ùgwù si ekwu ngwaa aorist nke ịhụ mmadụ n’anya; ihe gbara amaokwu ahụ gburugburu na-egosikwa na ịhụnanya ahụ ka dị mkpa ugbu a.
- source_word: ὁ πατήρ
  choice: Nna
  rationale: N’Oziọma Jọn, okwu a na-arụ ọrụ dị ka aha e ji akpọ Chineke, bụ́ Nna Jizọs; mkpụrụedemede ukwu na-egosi ojiji aha a.
- source_word: κἀγὼ
  choice: otu ahụ ka mụ onwe m … hụkwara
  rationale: “Mụ onwe m” na-echekwa nkwusi ike dị na ἐγώ, ebe “-kwara” na njikọ “otu ahụ ka” na-egosi ma njikọ ahụ ma ntụnyere ahụ.
- source_word: ὑμᾶς
  choice: unu
  rationale: ὑμᾶς bụ nnọchiaha onye nke abụọ n’ọnụọgụ ọtụtụ; “unu” na-egosi ọtụtụ ahụ kpọmkwem n’Igbo.
- source_word: ἠγάπησα
  choice: hụkwara unu n’anya
  rationale: A sụgharịrị aorist ahụ n’ụzọ nkịtị n’Igbo, ma “-kwara” na-echekwa echiche nke “mụ onwe m kwa” dị na Greek.
- source_word: μείνατε
  choice: Nọgidenụ
  rationale: Ọ bụ iwu e nyere ọtụtụ mmadụ. “Nọgidenụ” na-egosi ịnọgide na ọnọdụ ma na-echekwa isiokwu μένω a na-ahụ ugboro ugboro n’Oziọma Jọn.
- source_word: ἐν τῇ ἀγάπῃ τῇ ἐμῇ
  choice: n’ịhụnanya m
  rationale: Nke a bụ ụzọ Igbo dị mfe ma bụrụkwa nke ziri ezi isi kwuo “n’ime ịhụnanya nke m,” n’enweghị ịgbakwunye nkọwa na-adịghị n’ihe odide ahụ.
theological_decisions:
- issue: Nsụgharị ἀγάπη
  choice: ịhụnanya
  alternative: afọ ọma / ebere
  rationale: “Ịhụnanya” bụ okwu Igbo zuru oke maka ἀγάπη n’ebe a; okwu ndị ọzọ nwere ike ime ka ihe ọ pụtara bụrụ naanị mmetụta ọma ma ọ bụ ebere.
- issue: Ụdị oge/aspekt nke ἠγάπησέν na ἠγάπησα
  choice: hụrụ … n’anya / hụkwara … n’anya
  alternative: hụworo … n’anya / hụwokwa … n’anya
  rationale: Aorist Greek na-ele omume ndị ahụ anya n’ozuzu ya, ya mere oge gara aga dị mfe dabara nke ọma. Ihe gbara amaokwu ahụ gburugburu na-eme ka o doo anya na ịhụnanya ahụ ka nwere mmetụta ugbu a; ihe odide ala peeji na-edebe ohere nke nsụgharị na-emesi nke ahụ ike.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta mee ihe. “Unu” na “nọgidenụ” na-echekwa ọnụọgụ ọtụtụ nke Greek. E kewara iwu ikpeazụ ka ọ bụrụ ahịrịokwu nke ya iji mee ka ọ doo anya ma ghara imebi njikọ echiche ahụ.
