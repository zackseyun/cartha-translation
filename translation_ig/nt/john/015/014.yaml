  text: You are my friends if you do what I command you[a].
translation:
  language: ig
  text: Unu bụ ndị enyi m ma ọ bụrụ na unu emee ihe m na-enye unu n’iwu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ, n’ụzọ ka eso usoro okwu mbụ: “Unu bụ ndị enyi m ma ọ bụrụ na unu emee ihe ndị m na-enye unu n’iwu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς
  choice: Unu
  rationale: Nnọchiaha onye nke abụọ n’ọnụọgụgụ dị ọtụtụ bụ nke e tinyere n’isi ahịrịokwu maka nkwusi ike; “Unu” na-egosi ọnụọgụgụ ahụ n’Igbo n’enweghị ịgbakwụnye okwu na-adịghị mkpa.
- source_word: φίλοι μού
  choice: ndị enyi m
  rationale: Nke a na-egosi mmekọrịta chiri anya na Jizọs; “ndị enyi m” bụ okwu Igbo doro anya ma bụrụkwa nke e ji eme ihe ugbu a.
- source_word: ἐστε
  choice: bụ
  rationale: Ọ bụ ngwaa ịdị adị n’oge dị ugbu a; “bụ” bụ ntụgharị Igbo kwesịrị ekwesị.
- source_word: ἐὰν
  choice: ma ọ bụrụ na
  rationale: Ọ na-ewebata ọnọdụ jikọtara ya na ngwaa subjunctive; “ma ọ bụrụ na” na-echekwa ọnọdụ ahụ kama ime ya naanị ihe metụtara oge.
- source_word: ποιῆτε
  choice: unu emee
  rationale: Ọ na-ekwu maka imezu ihe e nyere n’iwu. “Unu emee” bụ okwu Igbo eke ma ọ naghị amanye echiche nke ime ya mgbe niile karịa ihe dị na Grik.
- source_word: ἃ
  choice: ihe
  rationale: Nnọchiaha njikọ n’ọnụọgụgụ dị ọtụtụ na-ezo aka n’ihe iwu ahụ kwuru; “ihe” na-arụ ọrụ nke ọma n’Igbo ma dị mfe karịa nkọwa toro ogologo.
- source_word: ἐγὼ ἐντέλλομαι ὑμῖν
  choice: m nyere unu n’iwu
  rationale: Nke a na-echekwa ikike dị na ἐντέλλομαι, onye na-enye iwu, na ndị a na-enye ya. Usoro a bụ Igbo eke, ebe “nyere … n’iwu” na-egosi iwu nwere ikike.
theological_decisions:
- issue: Ụdị ọnọdụ e ji jikọta ịbụ enyi Jizọs na nrubeisi
  choice: “Unu bụ ndị enyi m ma ọ bụrụ na unu emee ihe m nyere unu n’iwu.”
  alternative: “Unu bụ ndị enyi m mgbe unu na-eme ihe m nyere unu n’iwu.”
  rationale: ἐὰν tinyere subjunctive na-egosikarị ọnọdụ, ya mere “ma ọ bụrụ na” ka mma karịa “mgbe.” Nke a na-echekwa njikọ ederede ahụ mere n’etiti ọbụbụenyi na nrubeisi, n’enweghị ịkọwa ya site n’ozizi banyere uru ọrụ mmadụ ma ọ bụ ịnọgide n’okwukwe.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke oge a, dị ùgwù ma dị mfe nghọta. E ji “ndị enyi” gosipụta mmekọrịta chiri anya, “ma ọ bụrụ na” chekwaa ọnọdụ ahụ, ma jiri “nyere unu n’iwu” ghara ime ka ikike okwu Jizọs dị nro.
