  naturalness: The revised wording is natural, clear Standard Igbo and preserves the dignified but accessible register. “Ihe m na-enye unu n’iwu” is an idiomatic way to express the content of an authoritative command.
  terminology: “Ndị enyi” appropriately conveys φίλοι, while “na-enye … n’iwu” preserves the authoritative force of ἐντέλλομαι without importing interpretive theology.
