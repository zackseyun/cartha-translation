id: JHN.15.26
reference: John 15:26
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸀Ὅταν ἔλθῃ ὁ παράκλητος ὃν ἐγὼ πέμψω ὑμῖν παρὰ τοῦ πατρός, τὸ πνεῦμα τῆς ἀληθείας ὃ παρὰ τοῦ πατρὸς ἐκπορεύεται, ἐκεῖνος μαρτυρήσει περὶ ἐμοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/john/015/026.yaml
  text: When the Advocate comes[a], whom I will send to you from the Father—the Spirit of truth[c][b], who proceeds from the Father—he will testify about me.
translation:
  language: ig
  text: Mgbe Onye Nkwado[a] ahụ bịara, onye m ga-ezitere unu site n’ebe Nna nọ—Mmụọ nke eziokwu, onye na-esite n’ebe Nna nọ apụta[c]—ọ ga-agba ama banyere m.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “Onye Inyeaka,” “Onye Ndụmọdụ,” “Onye Nkasi Obi,” ma ọ bụ jiri aha Grik ahụ, “Paraklit.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ọ ga-agba akaebe banyere m.”
    reason: lexical_alternative
  - marker: c
    text: Grik kwuru, “onye na-esite n’ebe Nna nọ apụta.” Okwu a mechara bụrụ ihe dị mkpa n’ọmụmụ banyere Atọ n’Ime Otu.
    reason: cross_reference
lexical_decisions:
- source_word: Ὅταν ἔλθῃ
  choice: Mgbe ... bịara
  rationale: Nkebiokwu a na-ezo aka n’ihe a na-atụ anya na ọ ga-eme n’ọdịnihu; n’Igbo, ‘Mgbe ... bịara’ na-ada nke ọma n’ụdị nkebiokwu oge.
- source_word: ὁ παράκλητος
  choice: Onye Nkwado
  rationale: ‘Onye Nkwado’ na-egosi onye na-anọnyere mmadụ iji nyere ya aka, kwado ya, ma ọ bụ kwuchitere ya; ọ na-echekwakwa ọdịdị onye nke okwu Grik ahụ.
- source_word: ὃν ἐγὼ πέμψω ὑμῖν
  choice: onye m ga-ezitere unu
  rationale: Nke a na-egosipụta ngwaa ọdịnihu πέμψω na onye a na-ezitere ya, ὑμῖν, n’Igbo nkịtị.
- source_word: παρὰ τοῦ πατρός
  choice: site n’aka Nna
  rationale: Nhọrọ a na-egosi na onye ahụ si n’ebe Nna nọ ma ọ bụ na Nna bụ isi mmalite nke izite ya, n’ụzọ doro anya n’Igbo.
- source_word: τὸ πνεῦμα τῆς ἀληθείας
  choice: Mmụọ nke eziokwu
  rationale: Ọ na-echekwa usoro genitive Grik na aha e ji mara Mmụọ ahụ n’akwụkwọ Jọn.
- source_word: ὃ παρὰ τοῦ πατρὸς ἐκπορεύεται
  choice: onye si n’aka Nna na-apụta
  rationale: ‘Na-apụta’ na-echekwa echiche nke ἐκπορεύεται nke ọma karịa naanị ‘na-abịa,’ ma ọ naghị etinye nkọwa ozizi e mesịrị n’ime amaokwu ahụ.
- source_word: ἐκεῖνος
  choice: ọ
  rationale: N’Igbo, ‘ọ’ bụ nnọchiaha onye kwesịrị ekwesị ma na-aga nke ọma na Onye Nkwado/Mmụọ dịka onye na-eme omume ịgba ama.
- source_word: μαρτυρήσει περὶ ἐμοῦ
  choice: ọ ga-agba ama banyere m
  rationale: ‘Ịgba ama’ na-echekwa ihe gbasara onye akaebe dị na μαρτυρέω, ebe ‘banyere m’ na-asụgharị περί na genitive n’ụzọ eke.
theological_decisions:
- issue: Nsụgharị παράκλητος n’ebe a na-ekwu banyere Mmụọ
  choice: Onye Nkwado
  alternative: Onye Inyeaka; Onye Ndụmọdụ; Onye Nkasi Obi; Paraklit
  rationale: Okwu Grik ahụ nwere ọtụtụ akụkụ. ‘Onye Nkwado’ na-egosipụta ọrụ onye na-anọnyere, na-enyere, ma na-agba ama, na-enweghị ime ka otu nkọwa ụka bụrụ naanị ihe okwu ahụ pụtara.
- issue: Iji nnọchiaha onye kọwaa Mmụọ
  choice: onye ... ọ ga-agba ama
  alternative: nke ... ọ ga-agba ama
  rationale: Ọ bụ ezie na πνεῦμα bụ neuter n’usoro ụtọ asụsụ Grik, ἐκεῖνος bụ masculine ma na-egosi Mmụọ/Onye Nkwado dịka onye. Igbo ‘onye’ na-echekwa ngosipụta ahụ.
- issue: Nsụgharị ἐκπορεύεται
  choice: si n’aka Nna na-apụta
  alternative: si n’aka Nna na-abịa
  rationale: ‘Na-apụta’ na-echekwu ike na nkọwa pụrụ iche nke ngwaa Grik ahụ, ma hapụkwa esemokwu na mkpa okwu ahụ n’ozizi Atọ n’Ime Otu ka ederede ahụ siri kwuo ya, n’etinyeghị nkọwa e mesịrị.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ ‘Onye Nkwado’ maka παράκλητος, ma tinye nhọrọ ndị ọzọ n’okpuru ala. A hapụrụ ‘si n’aka Nna na-apụta’ n’ụzọ na-adịghị ekpebi esemokwu ozizi e mesịrị. Akara nkọwa [a], [b], na [c] niile dị n’ederede isi.
