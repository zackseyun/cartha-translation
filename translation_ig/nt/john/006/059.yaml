  text: ταῦτα εἶπεν ἐν συναγωγῇ διδάσκων ἐν Καφαρναούμ.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/059.yaml
  text: He said these things while teaching in the synagogue in Capernaum.
translation:
  language: ig
  text: O kwuru ihe ndị a mgbe ọ na-akụzi ihe n'ụlọ nzukọ dị na Kapanaum.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ταῦτα
  choice: ihe ndị a
  rationale: Nnọchiaha ngosi nke ọtụtụ ihe na-arụtụ aka n'okwu na ihe ndị bu ụzọ; “ihe ndị a” na-echekwa ụdị ọtụtụ ahụ.
- source_word: εἶπεν
  choice: O kwuru
  rationale: Aorist nke λέγω pụtara n'ụzọ kwụ ọtọ “kwuru.” Isiokwu ahụ adịghị n'okwu Grik, ma ihe gbara ya gburugburu na-egosi Jizọs; nnọchiaha “O” anaghị atụkwasị aha na-adịghị na ahịrịokwu ahụ.
- source_word: ἐν συναγωγῇ
  choice: n'ụlọ nzukọ ndị Juu
  rationale: “Ụlọ nzukọ ndị Juu” bụ okwu Igbo doro ndị na-agụ akwụkwọ anya maka συναγωγή n'ọnọdụ a. Ọ bụ ezie na Grik enweghị mkpụrụokwu na-egosi kpọmkwem otu ụlọ ahụ, ọnọdụ obodo Kapanaum na-enye ya nghọta a kapịrị ọnụ.
- source_word: διδάσκων
  choice: mgbe ọ na-akụzi ihe
  rationale: Present participle a na-egosi ọrụ na-aga n'otu oge ahụ o kwuru okwu; usoro a bụ Igbo nkịtị ma doo mmekọrịta oge ahụ anya.
- source_word: ἐν Καφαρναούμ
  choice: dị na Kapanaum
  rationale: A sụgharịghị aha obodo ahụ kama e dere ya n'ụdị dabara n'usoro ụda na mkpụrụedemede Igbo; “dị na” na-ejikọta ebe obodo ahụ na ụlọ nzukọ ahụ n'ụzọ eke.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị mfe nghọta ma nwee ugwu. A kọwara συναγωγή dị ka “ụlọ nzukọ ndị Juu” iji gbochie mgbagwoju anya, ebe a chekwara usoro na isi okwu nke Grik.
