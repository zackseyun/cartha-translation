- from: E dere n’Akwụkwọ Ndị Amụma, sị, “Chineke ga-akụziri ha niile ihe.”[a] Onye ọ bụla nke nụrụ ihe n’aka Nna ahụ ma mụta ihe na-abịakwute m.
  to: E dere n’Akwụkwọ Ndị Amụma, sị, “Chineke ga-akụziri ha niile ihe.”[a] Onye ọ bụla nke nụrụ ihe site n’aka Nna ahụ ma mụta ihe na-abịakwute m.
  rationale: The revision makes the Father the explicit source of what is heard in idiomatic Igbo and adjusts the lexical-alternative footnote so that it preserves the quotation’s future sense. It does not add an interpretation of how divine teaching relates to coming to Jesus.
