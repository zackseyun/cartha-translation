review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the citation formula, the prophetic-corpus reference, God as the teacher, and the sequence of hearing, learning, and coming. The phrase “nụrụ ihe n’aka Nna ahụ” is understandable but is less idiomatic for παρά with the genitive; “site n’aka Nna ahụ” expresses source more clearly.
  naturalness: The register is clear, modern Standard Igbo. Replacing “n’aka” with “site n’aka” in the final sentence improves naturalness and avoids suggesting merely physical proximity or receipt.
  terminology: “Akwụkwọ Ndị Amụma,” “Chineke,” and “Nna ahụ” are appropriate. The revised footnote retains the adjectival/passive alternative while preserving the future sense of the Greek quotation.
  issues:
  - severity: low
    issue: Source expression in the final clause is slightly under-rendered idiomatically.
    rationale: παρὰ τοῦ πατρὸς denotes source (“from the Father”). In this context, “site n’aka Nna ahụ” is clearer Standard Igbo than “n’aka Nna ahụ.”
  - severity: low
    issue: Footnote alternative does not explicitly retain the future sense.
    rationale: “Ha niile ga-abụ ndị Chineke kụziiri” can be read with the teaching as already completed. Adding “ga-akụziri ihe” preserves the future passive sense conveyed by ἔσονται ... διδακτοὶ θεοῦ.
  revised_text: E dere n’Akwụkwọ Ndị Amụma, sị, “Chineke ga-akụziri ha niile ihe.”[a] Onye ọ bụla nke nụrụ ihe site n’aka Nna ahụ ma mụta ihe na-abịakwute m.
