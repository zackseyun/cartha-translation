id: JHN.6.45
reference: John 6:45
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἔστιν γεγραμμένον ἐν τοῖς προφήταις· Καὶ ἔσονται πάντες διδακτοὶ θεοῦ· ⸀πᾶς ὁ ⸀ἀκούσας παρὰ τοῦ πατρὸς καὶ μαθὼν ἔρχεται πρὸς ⸀ἐμέ.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/045.yaml
  text: It is written in the Prophets[a], ‘And they will all be taught by God.’ Everyone who has heard from the Father and has learned comes to me.
translation:
  language: ig
  text: E dere n’Akwụkwọ Ndị Amụma, sị, “Chineke ga-akụziri ha niile ihe.”[a] Onye ọ bụla nke nụrụ ihe site n’aka Nna ahụ ma mụta ihe na-abịakwute m.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “Ha niile ga-abụ ndị Chineke ga-akụziri ihe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔστιν γεγραμμένον
  choice: E dere
  rationale: Nke a bụ ụzọ Igbo nkịtị si egosipụta ihe e dere nke ka dị ire, n’enweghị asụsụ ochie ma ọ bụ ịgbakwụnye nkọwa.
- source_word: ἐν τοῖς προφήταις
  choice: n’Akwụkwọ Ndị Amụma
  rationale: Ọ na-egosi na okwu ahụ dị n’akụkụ Akwụkwọ Nsọ a maara dịka Ndị Amụma, kama ịpụta nanị ndị mmadụ bụ́ amụma.
- source_word: ἔσονται πάντες διδακτοὶ θεοῦ
  choice: Chineke ga-akụziri ha niile ihe
  rationale: Ọ na-enye ọdịnihu na echiche na Chineke bụ onye na-akụzi, n’Igbo doro anya ma dị ndụ.
- source_word: πᾶς ὁ
  choice: Onye ọ bụla nke
  rationale: Ọ na-echekwa nghọta nke onye ọbụla n’otu n’otu, ma na-arụ ọrụ dịka okwu gbasara mmadụ niile dabara na ya.
- source_word: ἀκούσας παρὰ τοῦ πατρὸς
  choice: nụrụ ihe n’aka Nna ahụ
  rationale: “N’aka” na-egosi isi mmalite nke ịnụ ihe; “Nna ahụ” na-echekwa aha mmekọrịta Jọn ji akọwa Chineke.
- source_word: καὶ μαθὼν
  choice: ma mụta ihe
  rationale: Ọ na-echekwa omume ịmụ ihe nke sochiri ịnụ ihe ma buru ụzọ tupu ịbịakwute Jizọs.
- source_word: ἔρχεται πρὸς ἐμέ
  choice: na-abịakwute m
  rationale: Ọ na-echekwa oge ugbu a na echiche nke ịbịaru Jizọs nso.
theological_decisions:
- issue: Mmekọrịta dị n’etiti nkuzi Chineke na ịbịakwute Jizọs
  choice: 'E chekwara usoro okwu ahụ: onye nụrụ ihe n’aka Nna ma mụta ihe na-abịakwute Jizọs.'
  alternative: Ịkọwa ya n’ụzọ siri ike dịka mkpebi Chineke naanị ya, ma ọ bụ dịka nzaghachi mmadụ bụ isi.
  rationale: Grik ahụ kwuru njikọ dị n’etiti omume ndị a, ma ọ kọwaghị usoro nkà mmụta okpukpe nke njikọ ahụ; ya mere ntụgharị ahụ anaghị edozi esemokwu ahụ n’otu ụzọ.
- issue: Njirimara Nna ahụ na ikike Jizọs
  choice: E debere “Nna ahụ” na “m” n’otu mmekọrịta kpọmkwem.
  alternative: Ịgbasa okwu ahụ site n’ịkọwa ihe karịrị ihe amaokwu ahụ kwuru.
  rationale: 'Nke a na-echekwa ike okwu Jọn banyere Kraịst: ezigbo ịnụ na ịmụ ihe n’aka Nna na-eduga mmadụ n’ịbịakwute Jizọs, n’enweghị mgbakwunye ozizi.'
translation_notes:
  register: Asụsụ Igbo Izugbe, nke oge a, dị ùgwù ma dị mfe nghọta. E jiri “Akwụkwọ Ndị Amụma” gosi akụkụ Akwụkwọ Nsọ a na-ezo aka na ya. Akara nkọwa ala peeji [a] dị ozugbo n’isiokwu ntụgharị ya.
