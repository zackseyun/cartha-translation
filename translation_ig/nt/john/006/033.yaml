  to: N’ihi na achịcha nke Chineke bụ onye na-esi n’eluigwe arịdata ma na-enye ụwa ndụ.[a]
  rationale: The revision keeps every major lexical and theological feature of the source while changing the descent verb to a present/ongoing Igbo construction that corresponds to the Greek present participle. It also updates the footnote’s alternative wording and explanation for consistency, clarity, and natural Standard Igbo.
