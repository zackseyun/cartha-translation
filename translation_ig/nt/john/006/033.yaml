  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ γὰρ ἄρτος τοῦ θεοῦ ἐστιν ὁ καταβαίνων ἐκ τοῦ οὐρανοῦ καὶ ζωὴν διδοὺς τῷ κόσμῳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/033.yaml
  text: For the bread of God is the one who comes down from heaven and gives life to the world[a].
translation:
  language: ig
  text: N’ihi na achịcha nke Chineke bụ onye na-esi n’eluigwe arịdata ma na-enye ụwa ndụ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ihe na-esi n’eluigwe arịdata ma na-enye ụwa ndụ.” A pụkwara ịghọta nhazi okwu Grik ahụ dịka nke na-ezo aka n’ihe na-abụghị mmadụ, ma participle abụọ ahụ dị n’ụdị nwoke na-akwado ntụaka nye onye.
    reason: alternative_reading
lexical_decisions:
- source_word: ἄρτος
  choice: achịcha
  rationale: Ọ na-edobe ihe oyiyi doro anya nke ‘bread’ nke okwu Jọn a dabere na ya, kama ịgbasa ya ka ọ bụrụ naanị nri.
- source_word: τοῦ θεοῦ
  choice: nke Chineke
  rationale: Ọ na-edobe genitive Grik ahụ n’ụzọ nkịtị ma hapụ ka ihe gbara ya gburugburu kọwaa ma ọ bụ nke Chineke nwe, ma ọ bụ nke sitere n’aka Chineke.
- source_word: ὁ καταβαίνων
  choice: onye ahụ ... rịdata
  rationale: Participial phrase ahụ bụ masculine singular ma nwee article; ‘onye ahụ’ na-egosipụta ntụaka onwe onye, ebe ‘rịdata’ bụ Igbo nkịtị maka isi n’ebe dị elu bịa.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: si n’eluigwe
  rationale: Nke a bụ ụzọ Igbo dị mfe ma bụrụ nke nkịtị isi gosipụta mmalite ma ọ bụ ebe o si bịa.
- source_word: ζωὴν
  choice: ndụ
  rationale: Ọ na-edobe okwu dị nkenke ma dị mkpa n’ozizi Jọn n’enweghị nkọwa agbakwunyere.
- source_word: διδοὺς
  choice: na-enye
  rationale: Ụdị a na-egosipụta omume na-aga n’ihu ma jikọta ya nke ọma na ‘onye ahụ ... rịdata.’
- source_word: τῷ κόσμῳ
  choice: ụwa
  rationale: ‘Ụwa’ na-edobe ịdị obosara nke κόσμος n’akwụkwọ Jọn ma ghara imechi ya ka ọ bụrụ naanị otu ìgwè mmadụ.
- source_word: γὰρ
  choice: N’ihi na
  rationale: Ọ na-egosipụta na amaokwu a na-enye ihe kpatara ma ọ bụ nkọwa maka okwu gara aga.
theological_decisions:
- issue: Ma okwu ahụ na-ezo aka n’onye ma ọ bụ n’ihe na-abụghị mmadụ
  choice: 'Jiri ntụaka onwe onye: ‘onye ahụ si n’eluigwe rịdata ma na-enye ụwa ndụ.’'
  alternative: ‘ihe ahụ si n’eluigwe rịdata ma na-enye ụwa ndụ’
  rationale: Ọ bụ ezie na ‘achịcha’ bụ ihe, participles Grik abụọ ahụ bụ masculine singular ma na-akwado ntụaka nye onye. Nke a na-echekwa asụsụ isi mmalite n’enweghị ịgbakwunye nkọwa ozizi.
- issue: Oke pụtara na κόσμος
  choice: Debe ‘ụwa.’
  alternative: ‘ụmụ mmadụ’ ma ọ bụ ‘mmadụ niile’
  rationale: ‘Ụwa’ na-echekwa obosara na esemokwu ozizi dị n’okwu Jọn ma ghara ikpebi ihe amaokwu ahụ ekwughị kpọmkwem.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji ‘onye ahụ’ mee ka ntụaka onwe onye pụta ìhè, ebe ‘nke Chineke’ na ‘ụwa’ na-echekwa obosara na obere mgbagwoju anya nke okwu Grik.
