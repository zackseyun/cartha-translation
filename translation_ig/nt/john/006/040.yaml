source:
  edition: SBLGNT
  text: τοῦτο ⸀γάρ ἐστιν τὸ θέλημα τοῦ ⸂πατρός μου⸃ ἵνα πᾶς ὁ θεωρῶν τὸν υἱὸν καὶ πιστεύων εἰς αὐτὸν ἔχῃ ζωὴν αἰώνιον, καὶ ἀναστήσω αὐτὸν ⸀ἐγὼ τῇ ἐσχάτῃ ἡμέρᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/040.yaml
  text: 'For this is the will of my Father: that everyone who sees the Son and believes in him may have eternal life[b][a], and I myself will raise him up on the last day.'
translation:
  language: ig
  text: 'N’ihi na nke a bụ uche Nna m: ka onye ọ bụla nke na-ahụ Ọkpara ahụ[a] ma na-ekwere na ya nwee ndụ ebighị ebi; mụ onwe m[b] ga-akpọlitekwa ya n’ụbọchị ikpeazụ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “onye ọ bụla nke na-ele Ọkpara ahụ anya.” Ngwaa Grik a nwere ike ịpụta ile mmadụ anya nke ọma ma ọ bụ ileba anya n’ụzọ pụrụ iche, ọ bụghị naanị iji anya hụ ya.
    reason: lexical_alternative
  - marker: b
    text: 'A pụkwara ịsụgharị ya, “m ga-akpọlitekwa ya.” Ma n’asụsụ Grik, e depụtara “mụ” kpọmkwem iji mesie ike na ọ bụ ya ga-akpọlite ya: “mụ onwe m.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο γάρ ἐστιν
  choice: N’ihi na nke a bụ
  rationale: “N’ihi na” na-egosipụta na okwu a na-akọwa ihe e kwuru n’amaokwu bu ya ụzọ; “nke a bụ” na-anọchi τοῦτο ἐστιν ozugbo n’Igbo e ji eme ihe ugbu a.
- source_word: τὸ θέλημα τοῦ πατρός μου
  choice: uche Nna m
  rationale: “Uche” nwere ike ịpụta ihe mmadụ chọrọ ma ọ bụ kpebiri ime, ya mere ọ dabara na θέλημα. “Nna m” na-echekwa mmekọrịta Nna na Ọkpara dị n’okwu Jizọs.
- source_word: ἵνα
  choice: ka
  rationale: “Ka” na-ebute ọdịnaya na ebumnuche nke uche Nna ma na-ekwe ka ngwaa “nwee” chekwaa ọdịdị ἵνα tinyere subjunctive.
- source_word: πᾶς ὁ θεωρῶν
  choice: onye ọ bụla nke na-ahụ
  rationale: Nkebi a na-ekwu maka onye ọ bụla e ji omume ịhụ ahụ mara. “Na-ahụ” bụ okwu doro anya n’Igbo; ihe θεωρέω pụtara banyere ilebara anya nke ọma ka e debere n’ala ala peeji.
- source_word: τὸν υἱὸν
  choice: Ọkpara ahụ
  rationale: “Ọkpara” na-echekwa aha pụrụ iche e ji akọwa mmekọrịta Jizọs na Nna, ebe “ahụ” na-egosipụta definite article τόν.
- source_word: καὶ πιστεύων εἰς αὐτόν
  choice: ma na-ekwere na ya
  rationale: “Ikwere na ya” bụ ụzọ Igbo si ekwu okwukwe ma ọ bụ ntụkwasị obi e tinyere n’ebe mmadụ nọ; “na-” na-echekwa ọdịdị omume a na-akọwa onye ahụ.
- source_word: ἔχῃ ζωὴν αἰώνιον
  choice: nwee ndụ ebighị ebi
  rationale: “Nwee” na-adaba n’usoro “ka” ma na-echekwa subjunctive ἔχῃ; “ndụ ebighị ebi” na-egosipụta ζωὴ αἰώνιος n’ụzọ kwụ ọtọ ma bụrụkwa Igbo dị mfe nghọta.
- source_word: καὶ ἀναστήσω αὐτὸν ἐγώ
  choice: mụ onwe m ga-akpọlitekwa ya
  rationale: “Ga-akpọlite” na-egosipụta mbilite n’ọnwụ a na-ekwu maka ya. “Mụ onwe m” na-echekwa nkwusi ike nke nnọchiaha ἐγώ, ebe “-kwa” na-anọchi njikọ καί.
- source_word: τῇ ἐσχάτῃ ἡμέρᾳ
  choice: n’ụbọchị ikpeazụ
  rationale: Nke a bụ ụzọ Igbo doro anya si egosipụta oge a ga-eme ihe ahụ, ma na-echekwa echiche nke ụbọchị ikpeazụ.
theological_decisions:
- issue: Ókè na ọnọdụ dị na πᾶς ὁ θεωρῶν ... καὶ πιστεύων
  choice: ka onye ọ bụla nke na-ahụ Ọkpara ahụ ma na-ekwere na ya nwee ndụ ebighị ebi
  alternative: onye ọ bụla nke lere Ọkpara ahụ anya ma kwere na ya nwere ndụ ebighị ebi
  rationale: Nsụgharị ahụ na-echekwa okwu gbasara “onye ọ bụla” nke ịhụ na ikwere na-akọwa, na-etinyeghị nkọwa otu ụka banyere nhọpụta mmadụ ma ọ bụ nnwere onwe ya. “Ka ... nwee” na-echekwa usoro ἵνα na subjunctive kama ime ya ka ọ bụrụ naanị nkwupụta indicative.
- issue: Nkwusi ike nke ἐγώ n’ime καὶ ἀναστήσω αὐτὸν ἐγώ
  choice: mụ onwe m ga-akpọlitekwa ya
  alternative: m ga-akpọlitekwa ya
  rationale: “Mụ onwe m” na-egosipụta nnọchiaha ahụ e depụtara kpọmkwem maka nkwusi ike, n’etinyeghị ozizi ọzọ na-adịghị n’ihe odide ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ugwu ma dịkwa mfe nghọta, dee amaokwu ahụ. Ahịrịokwu ahụ na-agbaso usoro echiche nke Grik, ma e mere njikọ na ngwaa ya ka ha daa nke ọma n’Igbo. E zere okwu pụrụ iche nke otu ụka.
