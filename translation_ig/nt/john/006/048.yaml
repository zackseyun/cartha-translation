  source_fidelity: “Abụ m achịcha nke ndụ.” faithfully renders the predicate statement ἐγώ εἰμι ὁ ἄρτος τῆς ζωῆς. “Abụ m” naturally expresses the explicit first-person self-identification without treating it as an absolute ‘I am’ saying, and “nke ndụ” preserves the compact genitival relation.
