  text: ἐγώ εἰμι ὁ ἄρτος τῆς ζωῆς·
base_translation:
  language: en
  yaml_path: translation/nt/john/006/048.yaml
  text: I am the bread of life.
translation:
  language: ig
  text: Abụ m achịcha nke ndụ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγώ εἰμι
  choice: Abụ m
  rationale: Nke a bụ ụzọ Igbo nkịtị na nke doro anya si ekwu njirimara onye na-ekwu okwu n'oge dị ugbu a. Ọ na-echekwa nkwupụta siri ike Jizọs kwuru n'etinyeghị okwu nkọwa ọzọ.
- source_word: ὁ ἄρτος
  choice: achịcha
  rationale: “Achịcha” bụ okwu Igbo a na-aghọta nke ọma maka ἄρτος. Asụsụ Igbo anaghị enwe mkpụrụokwu kpọmkwem kwekọrọ na Greek definite article ὁ; njirimara ya pụtara ìhè site n'usoro ahịrịokwu ahụ.
- source_word: τῆς ζωῆς
  choice: nke ndụ
  rationale: Nke a na-echekwa njikọ genitive dị n'okwu Greek n'ụzọ dị nkenke, n'agbanyeghị na ọ hapụrụ oghe ma ọ bụ achịcha na-enye ndụ, na-akwado ndụ, ma ọ bụ nke e ji ndụ mara.
theological_decisions:
- issue: Ike nke okwu njirimara “ἐγώ εἰμι” n'ozizi Jọn banyere Kraịst
  choice: Abụ m
  alternative: Ọ bụ m bụ
  rationale: Ebe a, ἐγώ εἰμι nwere predicate, ya bụ “achịcha nke ndụ”; ọ bụghị okwu ἐγώ εἰμι kwụụrụ onwe ya. “Abụ m” na-echekwa njirimara Jizọs kwuru n'ebugharịghị ya gaa n'okwu nkọwa gbasara chi ya nke na-adịghị n'ahịrịokwu ahụ.
- issue: Ihe njikọ “nke ndụ” pụtara
  choice: nke ndụ
  alternative: nke na-enye ndụ
  rationale: “Nke ndụ” na-echekwa mkpụmkpụ na ohere nkọwa dị na τῆς ζωῆς. “Nke na-enye ndụ” ga-ekpebi na genitive ahụ pụtara isi iyi ma ọ bụ onye na-enye ndụ, ebe Greek n'onwe ya hapụrụ njikọ ahụ ka ọ sara mbara.
translation_notes:
  register: Standard Igbo; asụsụ dị mfe, ugwu, ma bụrụ nke ndị na-agụ akwụkwọ taa ga-aghọta. E jighị ntụgharị okpukpe pụrụ iche dochie mkpụmkpụ na ịdị ike nke okwu mbụ.
