  text: ἀμὴν ἀμὴν λέγω ὑμῖν, ὁ ⸀πιστεύων ἔχει ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/047.yaml
  text: Truly[a], truly, I say to you[b], the one who believes has eternal life.
translation:
  language: ig
  text: 'N’ezie, n’ezie, ana m agwa unu: onye na-ekwere[a] nwere ndụ ebighị ebi.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “onye ọ bụla na-ekwere.” N’ụzọ nkịtị, Greek nwere “onye ahụ na-ekwere.” Ụfọdụ ihe odide na-agụ, “onye na-ekwere na m.”
    reason: lexical_and_textual_alternative
  - marker: b
    text: Ma ọ bụ, “ndụ na-adịru mgbe ebighị ebi”; n’ụzọ ka okwu Greek si dị, “ndụ nke oge” ma ọ bụ “ndụ na-adịru oge.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν ἀμὴν
  choice: N’ezie, n’ezie
  rationale: Nkwughachi a na-echekwa nkwusi ike na ụda nkwupụta dị nsọ nke Jọn, ma bụrụkwa Igbo doro anya ma na-ada nke ọma.
- source_word: λέγω ὑμῖν
  choice: ana m agwa unu
  rationale: Nke a na-egosipụta ngwaa oge dị ugbu a na nnọchiaha ọtụtụ mmadụ, ma na-ada n’ụzọ ebumpụta ụwa n’Igbo.
- source_word: ὁ πιστεύων
  choice: onye na-ekwere
  rationale: Nkebi a na-egosipụta onye a na-amata site n’ikwere; “na-ekwere” na-echekwa ọdịdị oge dị ugbu a nke participle ahụ, n’agbanyeghị na Greek ekwughị kpọmkwem onye ma ọ bụ ihe a na-ekwere.
- source_word: ἔχει
  choice: nwere
  rationale: Oge dị ugbu a nke okwu Greek na-ekwu na ndụ ahụ bụ ihe onye ahụ nwere ugbu a, ọ bụghị naanị ihe ọ ga-enweta n’ọdịnihu.
- source_word: ζωὴν αἰώνιον
  choice: ndụ ebighị ebi
  rationale: Nke a bụ okwu Igbo doro anya ma bụrụkwa nke a maara nke ọma maka ndụ na-adịghị agwụ agwụ; ọ kwekọkwara n’iji okwu ahụ eme ihe n’Oziọma Jọn.
theological_decisions:
- issue: Inwe ndụ ebighị ebi ugbu a
  choice: nwere ndụ ebighị ebi
  alternative: ga-enwe ndụ ebighị ebi
  rationale: ἔχει bụ oge dị ugbu a. Ịtụgharị ya ka ọ bụrụ ihe ga-eme n’ọdịnihu ga-agbanwe nkwupụta ederede ahụ ma belata esemokwu Jọn na-ahapụ n’etiti ihe a na-enweta ugbu a na mmezu ọdịnihu.
- issue: Ihe onye ahụ na-ekwere
  choice: onye na-ekwere
  alternative: onye na-ekwere na m
  rationale: Ederede SBLGNT ahọpụtara ahọpụtaghị εἰς ἐμέ (“na m”), ya mere a hapụrụ ihe a na-ekwere n’amaghị kpọmkwem dịka Greek si mee; ọdịiche dị n’ihe odide ụfọdụ ka e debere n’okpuru peeji kama itinye ya n’ahịrị.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. “N’ezie, n’ezie” na-echekwa nkwughachi Jọn; “ana m agwa unu” bụ okwu ebumpụta ụwa n’Igbo; “onye na-ekwere” na-ezere itinye ihe Greek ahọpụtara na-ekwughị kpọmkwem.
