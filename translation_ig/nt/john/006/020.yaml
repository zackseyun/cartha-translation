id: JHN.6.20
reference: John 6:20
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ δὲ λέγει αὐτοῖς· Ἐγώ εἰμι, μὴ φοβεῖσθε.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/020.yaml
  text: But he said to them[a], “It is I; do not be afraid.”
translation:
  language: ig
  text: Ma ọ sịrị ha[a], “Ọ bụ m; unu atụla egwu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n'ụzọ nkịtị karị, “Abụ m.” N'Oziọma Jọn, okwu a pụrụ ịbụ naanị ụzọ mmadụ si eme ka a mata onye ọ bụ, ma o nwekwara ike ime ka a cheta isiokwu nkà mmụta okpukpe ndị sara mbara.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ δὲ
  choice: Ma ọ
  rationale: δέ bụ njikọ dị nro nke na-egosi mgbanwe ma ọ bụ obere ntụgharị n'akụkọ; “Ma” dabara n'ụzọ e si akọ ihe n'Igbo. ὁ nọchiri aha Jizọs, ya mere e ji “ọ” sụgharịa ya.
- source_word: λέγει
  choice: sịrị
  rationale: Ọ bụ ezie na Grik ji oge ugbu a n'akụkọ, oge gara aga bụ ụzọ ebumpụta ụwa e si akọ akụkọ a n'Igbo.
- source_word: αὐτοῖς
  choice: ha
  rationale: Nke a bụ nnọchiaha ọtụtụ; amaokwu gbara ya gburugburu na-egosi ndị ọ na-ekwu okwu banyere ha, n'ekwughị “ndị na-eso ụzọ” ọzọ.
- source_word: Ἐγώ εἰμι
  choice: Ọ bụ m
  rationale: N'ọnọdụ a, okwu ahụ bụ ụzọ Jizọs si eme ka ha mata na ọ bụ ya. “Ọ bụ m” bụ Igbo doro anya ma kwekọọ n'ọrụ okwu ahụ; e debere nsụgharị nkịtị “Abụ m” n'ala peeji n'ihi ụda nkà mmụta okpukpe ọ pụrụ inwe n'Oziọma Jọn.
- source_word: μὴ φοβεῖσθε
  choice: unu atụla egwu
  rationale: Nke a bụ iwu mgbochi a gwara ọtụtụ mmadụ. “Unu atụla egwu” bụ okwu Igbo dị ugbu a, doro anya, ma dabara n'ọnọdụ ụjọ ha.
theological_decisions:
- issue: Ma a ga-asụgharị Ἐγώ εἰμι dịka nanị ụzọ e si eme ka mmadụ mata onye na-ekwu okwu, ka a hapụkwa ụdị nkịtị nke nwere ike ibu ụda nkà mmụta okpukpe.
  choice: 'N''ahịrịokwu: “Ọ bụ m”'
  alternative: “Abụ m”
  rationale: “Ọ bụ m” na-egosipụta ọrụ okwu ahụ n'ọnọdụ a—Jizọs na-eme ka ndị na-eso ụzọ ya mata na ọ bụ ya ma na-emekwa ka obi sie ha ike. Ma ebe okwu ἐγώ εἰμι nwere ike inwe nghọta sara mbara n'Oziọma Jọn, e debere “Abụ m” n'ala peeji ka a ghara ikpochapụ esemokwu ahụ ma ọ bụ kpebie ya karịa ihe amaokwu ahụ kwuru.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe ma dị ùgwù. “Unu” na-egosi na a na-agwa ọtụtụ mmadụ okwu; ahịrịokwu ahụ na-edobe mkpụmkpụ na ịdị ngwa nke Grik.
