  text: Ἔστιν ⸀παιδάριον ὧδε ⸀ὃς ἔχει πέντε ἄρτους κριθίνους καὶ δύο ὀψάρια· ἀλλὰ ταῦτα τί ἐστιν εἰς τοσούτους;
base_translation:
  language: en
  yaml_path: translation/nt/john/006/009.yaml
  text: There is a boy here who has five barley loaves and two fish[a], but what are these for so many?
translation:
  language: ig
  text: “O nwere otu nwata nwoke nọ n’ebe a, onye nwere ogbe achịcha ọka bali ise na azụ abụọ; ma olee otú ihe ndị a ga-esi zuo ọtụtụ mmadụ dị otu a?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παιδάριον
  choice: nwata nwoke
  rationale: Okwu a na-ezo aka n’otu nwata ma ọ bụ nwokorobịa nta; ‘nwata nwoke’ bụ okwu Igbo doro anya ma kwekọọ n’ọnọdụ a.
- source_word: ὧδε
  choice: n’ebe a
  rationale: Nke a na-egosi ebe ihe dị; ‘n’ebe a’ bụ ntụgharị Igbo nkịtị na nke ziri ezi.
- source_word: ὃς ἔχει
  choice: onye nwere
  rationale: Nkebiokwu a na-akọwa nwata ahụ site n’ihe o ji; ‘onye nwere’ na-ada nke ọma n’Igbo.
- source_word: ἄρτους κριθίνους
  choice: ogbe achịcha ọka bali
  rationale: ἄρτους pụtara ogbe achịcha, ebe κριθίνους na-akọwa na e ji ọka bali mee ya; ntụgharị a na-edobe ihe abụọ ahụ n'ụzọ doro anya.
- source_word: ὀψάρια
  choice: azụ
  rationale: N’ọnọdụ a, okwu ahụ na-ezo aka n’azụ a na-eri tinyere achịcha. ‘Azụ’ bụ okwu kacha doo anya, ebe ‘obere azụ’ nwere ike itinye nkọwa karịa ihe ederede kwuru.
- source_word: ἀλλὰ
  choice: ma
  rationale: Ọ na-egosi ọdịiche dị n’etiti nri dị na ọnụ ọgụgụ mmadụ; ‘ma’ na-edobe nkwụpụta okwu ahụ nkenke.
- source_word: ταῦτα τί ἐστιν
  choice: gịnị ka ihe ndị a bụ
  rationale: Nke a na-edobe ajụjụ ihe odide Grik n’ụdị kpọmkwem ma na-ekwe ka echiche nke ezughị ezu pụta site n’ọnọdụ okwu ahụ.
- source_word: εἰς τοσούτους
  choice: nye ọtụtụ mmadụ dị otu a
  rationale: εἰς ebe a na-egosi otú ihe ndị ahụ ga-esi zuo ndị mmadụ buru ibu; ntụgharị a bụ Igbo sitere n’okike ma na-edobe echiche nke ọnụ ọgụgụ dị ukwuu.
