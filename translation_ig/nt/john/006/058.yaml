  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οὗτός ἐστιν ὁ ἄρτος ὁ ⸀ἐξ οὐρανοῦ καταβάς, οὐ καθὼς ἔφαγον οἱ ⸀πατέρες καὶ ἀπέθανον· ὁ τρώγων τοῦτον τὸν ἄρτον ⸀ζήσει εἰς τὸν αἰῶνα.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/058.yaml
  text: This is the bread that came down from heaven[a], not as the fathers ate and died[b]; the one who eats this bread will live forever.
translation:
  language: ig
  text: Nke a bụ achịcha ahụ si n’eluigwe rịdata, ọ bụghị dịka ndị nna nna[a] riri wee nwụọ; onye na-eri achịcha a ga-adị ndụ ruo mgbe ebighị ebi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ndị nna ochie.” Okwu Grik bụ “ndị nna,” ma o yikarịrị ka ọ na-ezo aka n’ndị nna ochie Izrel ndị riri manna n’ọzara.
    reason: lexical_alternative
  - marker: b
    text: N’ụzọ nkịtị, “ga-adị ndụ banye n’oge ahụ”; nke a bụ akpaalaokwu pụtara ịdị ndụ ruo mgbe ebighị ebi.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτός ἐστιν ὁ ἄρτος
  choice: Nke a bụ achịcha ahụ
  rationale: Ọ na-edobe ihe ngosi na njirimara nke okwu Grik, ma jiri usoro okwu Igbo doro anya ma bụrụkwa nke e ji ekwu okwu n’ụzọ ebumpụta ụwa.
- source_word: ὁ ἐξ οὐρανοῦ καταβάς
  choice: nke si n’eluigwe rịdata
  rationale: Nkebiokwu njikọ a na-egosipụta participle aorist ahụ n’Igbo dị mfe, ma chekwaa echiche nke isi n’eluigwe gbadata.
- source_word: οὐ καθὼς
  choice: Ọ bụghị dị ka nke
  rationale: Nke a na-echekwa ntụnyere na-adịghị nhata dị n’akwụkwọ Grik; ‘nke’ na-anọchi anya achịcha ahụ ndị nna nna riri.
- source_word: οἱ πατέρες
  choice: ndị nna nna
  rationale: ‘Ndị nna nna’ bụ okwu Igbo ebumpụta ụwa maka ndị bụbu nna Izrel n’oge gara aga, ma ka na-egosipụta ụdị nwoke dị na okwu Grik.
- source_word: ἔφαγον καὶ ἀπέθανον
  choice: riri wee nwụọ
  rationale: Oge gara aga na usoro ‘wee’ na-egosipụta omume abụọ ahụ n’usoro dị mfe ma doo anya.
- source_word: ὁ τρώγων τοῦτον τὸν ἄρτον
  choice: onye na-eri achịcha a
  rationale: Ọ na-egosipụta participle nke oge ugbu a dịka omume izugbe ma ọ bụ na-aga n’ihu, n’ebughị nkọwa sacrament ma ọ bụ ihe atụ banye n’amaokwu ahụ.
- source_word: ζήσει εἰς τὸν αἰῶνα
  choice: ga-adị ndụ ruo mgbe ebighị ebi
  rationale: Nke a bụ ụzọ Igbo doro anya isi kwuo akpaalaokwu Jọn nke pụtara ndụ na-adịgide adịgide, ma ndetu na-echekwa ọdịdị okwu nkịtị nke Grik.
theological_decisions:
- issue: Ndị οἱ πατέρες na-ezo aka na ha
  choice: ndị nna nna
  alternative: ndị nna ochie; ndị nna
  rationale: O yikarịrị ka okwu a na-ezo aka n’ebe ndị nna Izrel riri manna n’ọzara nọ. ‘Ndị nna nna’ na-ada nke ọma n’Igbo ma ghara ime ka ihe e zoro aka na ya gbasaa karịa ihe ederede kwuru.
- issue: Ike na nkọwa nke τρώγων n’okwu banyere achịcha ndụ
  choice: onye na-eri
  alternative: onye na-ata ata; onye na-eri ya dịka nri
  rationale: ‘Na-eri’ na-echekwa ihe ngwaa ahụ pụtara n’ụzọ nkịtị ma ghara ikpebi ma okwu ahụ bụ nke sacrament naanị ka ọ bụ ihe atụ nke okwukwe.
- issue: Nkọwa nke εἰς τὸν αἰῶνα
  choice: ruo mgbe ebighị ebi
  alternative: banye n’ọgbọ ahụ; ruo n’ọgbọ ahụ
  rationale: Akpaalaokwu a na Jọn na-egosi ịdịgide ruo mgbe ebighị ebi. Nsụgharị ahụ bụ Igbo nkịtị, ebe ndetu na-egosi ọdịdị okwu Grik n’enweghị ịgbanwe isi ihe ọ pụtara.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ ‘rịdata’ maka mmegharị si n’eluigwe gbadata, ‘ndị nna nna’ maka ndị bụbu nna Izrel, na ‘na-eri’ iji hapụ esemokwu nkà mmụta okpukpe dị n’okwu ahụ ka ọ dị. Akara ndetu [a] na [b] dị n’ahịrị isi ma kwekọọ na ndetu ha.
