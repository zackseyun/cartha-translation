  verdict: revise
  source_fidelity: 'Isi nsụgharị ahụ na-ebuga nke ọma echiche Gris: achịcha ahụ si n’eluigwe rịdata, ndị nna riri ma nwụọ, ma onye na-eri achịcha a ga-adị ndụ ebighị ebi. Otú ọ dị, “Ọ bụghị dị ka nke ndị nna nna riri” anaghị egosipụta ntụnyere οὐ καθὼς n’ụzọ doro anya; “nke” na-eme ka ọ dị ka e ji achịcha ọzọ tụnyere achịcha a karịa ka e si atụnyere iri ha na ọnwụ ha.'
  naturalness: “Nke a bụ achịcha ahụ si n’eluigwe rịdata” na “onye na-eri achịcha a ga-adị ndụ ruo mgbe ebighị ebi” bụ Standard Igbo dị mfe ma dị ebumpụta ụwa. Iwepụ nkwụsị ahịrị na “nke” n’akụkụ ntụnyere ahụ na-eme ka amaokwu ahụ na-agụ nke ọma.
  terminology: '“Ndị nna nna” nwere ike ịpụta ndị nna ochie/ndị forefathers ma dabara n’ọtụtụ okwu a. “Onye na-eri” na-edobe τρώγων n’enweghị itinye nkọwa sakramenti. “Ruo mgbe ebighị ebi” na-egosipụta εἰς τὸν αἰῶνα nke ọma. A ga-ebuga akara ndetu ka ha soro okwu ha na-akọwa: [a] n’azụ “ndị nna nna,” na [b] n’azụ nkebiokwu banyere ịdị ndụ ebighị ebi.'
