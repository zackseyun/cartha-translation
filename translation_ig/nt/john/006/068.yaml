source:
  edition: SBLGNT
  text: ⸀ἀπεκρίθη αὐτῷ Σίμων Πέτρος· Κύριε, πρὸς τίνα ἀπελευσόμεθα; ῥήματα ζωῆς αἰωνίου ἔχεις,
base_translation:
  language: en
  yaml_path: translation/nt/john/006/068.yaml
  text: Simon Peter answered him[a], “Lord, to whom will we go? You have words of eternal life,”
translation:
  language: ig
  text: Saịmọn Pita zara ya, “Onyenwe anyị,[a] ònye ka anyị ga-agakwuru? Ị nwere okwu ndụ ebighị ebi,”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Nna ukwu.” Aha Grik a nwere ike ịbụ ụzọ nkwanye ùgwù e si akpọ mmadụ; ma “Onyenwe anyị” dabara nʼotú Jọn si eji ya eme ihe nʼebe a.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθη αὐτῷ
  choice: zara ya
  rationale: Nke a bụ ụzọ Igbo kwụ ọtọ ma bụrụkwa nke a na-ejikarị egosi na mmadụ zara onye ọzọ nʼmkparịta ụka.
- source_word: Σίμων Πέτρος
  choice: Saịmọn Pita
  rationale: E dere aha ndị a nʼụdị a na-amakarị nʼIgbo, nke na-agbaso ụda aha Grik ahụ.
- source_word: Κύριε
  choice: Onyenwe anyị
  rationale: Ọ bụ aha nkwanye ùgwù a na-akpọ Jizọs, ma ọ na-edobekwa ibu okwu κύριος nwere nʼOziọma Jọn.
- source_word: πρὸς τίνα ἀπελευσόμεθα
  choice: ònye ka anyị ga-agakwuru?
  rationale: “Ịgakwuru onye” na-egosipụta ma ngagharị ahụ ma na ajụjụ Pita lekwasịrị anya nʼonye ha pụrụ ịdabere na ya.
- source_word: ῥήματα
  choice: okwu
  rationale: NʼIgbo, “okwu” nwere ike ịpụta okwu e kwuru, ma ọ dịghị mkpa ịmanye ọtụtụ nʼọnụọgụ ebe aha a na-arụ ọrụ dị ka aha mkpokọta.
- source_word: ζωῆς αἰωνίου
  choice: ndụ ebighị ebi
  rationale: Nke a bụ okwu Igbo doro anya nke na-edobe njikọ genitiv ahụ ma kwekọọ nʼisiokwu dị mkpa nʼOziọma Jọn.
- source_word: ἔχεις
  choice: Ị nwere
  rationale: Ọ na-egosipụta ngwaa nwere nʼoge ugbu a nʼụzọ dị mfe ma bụrụkwa Igbo e ji eme ihe kwa ụbọchị.
theological_decisions:
- issue: Ike aha Κύριε mgbe Pita na-agwa Jizọs okwu
  choice: Onyenwe anyị
  alternative: Nna anyị ukwu
  rationale: “Onyenwe anyị” na-edobe ma nkwanye ùgwù ma ụda gbasara onye Jizọs bụ nʼakwụkwọ Jọn, nʼemeghị ka ihe karịrị ihe odide ahụ kwuru bata na ya.
- issue: Njikọ dị nʼokwu ῥήματα ζωῆς αἰωνίου
  choice: okwu ndụ ebighị ebi
  alternative: okwu ndị na-enye ndụ ebighị ebi
  rationale: Nhọrọ bụ isi na-edobe nkenke na ohere nkọwa dị nʼusoro genitiv Grik; ọzọ ahụ ga-akọwa ya kpọmkwem dị ka okwu ndị na-enye ndụ, nke ederede ekwughị nʼụzọ doro nnọọ anya.
translation_notes:
  register: Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E ji “ga-agakwuru” mee ka ajụjụ ahụ bụrụ nke mmadụ na-ekwu nʼụzọ ebumpụta ụwa, ma e debere “okwu ndụ ebighị ebi” nʼụdị nkenke iji ghara idozi nʼike njikọ genitiv Grik.
