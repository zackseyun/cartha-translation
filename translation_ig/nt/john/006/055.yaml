revisions:
- from: N’ihi na anụ ahụ m bụ ezi nri[a], ọbara m bụkwa ezi ihe ọṅụṅụ.
  to: N’ihi na anụ ahụ m bụ nri n’ezie[a], ọbara m bụkwa ihe ọṅụṅụ n’ezie.
  rationale: The revision replaces the potentially evaluative adjective ‘ezi’ in the main text with ‘n’ezie,’ which more clearly conveys the Greek ἀληθής as ‘true/genuine/real.’ The alternative ‘ezi’ is retained in the footnote. All other wording faithfully preserves the Greek syntax, imagery, and ambiguity.
  reviewer_model: gpt-5.6-terra
