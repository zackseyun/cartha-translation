  text: ἡ γὰρ σάρξ μου ⸀ἀληθής ἐστι βρῶσις, καὶ τὸ αἷμά μου ⸁ἀληθής ἐστι πόσις.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/055.yaml
  text: For my flesh is true food[a], and my blood is true drink.
translation:
  language: ig
  text: N’ihi na anụ ahụ m bụ nri n’ezie[a], ọbara m bụkwa ihe ọṅụṅụ n’ezie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ezi nri” na “ezi ihe ọṅụṅụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: N’ihi na
  rationale: Ọ na-egosi na okwu a na-akọwa ihe e kwuru n’amaokwu bu ya ụzọ, ma bụrụkwa ụzọ e si ekwu ya nke ọma n’Igbo.
- source_word: σάρξ
  choice: anụ ahụ
  rationale: Nke a na-edobe okwu ahụ n’ụzọ nkịtị, ma na-echekwa njikọ dị n’etiti anụ ahụ na ọbara n’okwu Jizọs.
- source_word: ἀληθής
  choice: ezi
  rationale: “Ezi” na-egosi ihe bụ nke bụ eziokwu ma ọ bụ nke kwesịrị ntụkwasị obi, n’enweghị ikpebi esemokwu nkà mmụta okpukpe nke okwu a nwere ike ibute.
- source_word: βρῶσις
  choice: nri
  rationale: N’usoro ahịrịokwu a na n’ịdakọrịta ya na πόσις, okwu ahụ pụtara ihe a na-eri karịa omume iri ihe.
- source_word: αἷμα
  choice: ọbara
  rationale: A tụgharịrị ya kpọmkwem iji chekwaa okwu Grik na njikọ anụ ahụ/ọbara.
- source_word: πόσις
  choice: ihe ọṅụṅụ
  rationale: Nke a bụ ụzọ Igbo doro anya si ekwu ihe a na-aṅụ, ọ bụkwa okwu kwekọrọ na “nri” n’ahịrịokwu a.
theological_decisions:
- issue: Ma a ga-atụgharị ἀληθής dị ka “ezi” ka ọ bụ “nke bụ n’ezie” n’okwu nwere njikọ na Oriri Nsọ
  choice: ezi
  alternative: nke bụ n’ezie
  rationale: “Ezi” na-anọ nso n’ike okwu Grik ma ghara iji nsụgharị ahụ kpebie esemokwu gbasara ihe amaokwu ahụ pụtara n’Oriri Nsọ.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị ugbu a ma dị ùgwù. E ji “anụ ahụ” na “ọbara” chekwaa ihe oyiyi na ntụnyere nke ederede mbụ; e jikwa “ihe ọṅụṅụ” mee ka okwu ahụ doo onye Igbo nkịtị anya.
