  text: Jizọs zara ha, sị, “Unu atala ntamu n’etiti onwe unu.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη … καὶ εἶπεν
  choice: zara ha, sị
  rationale: Usoro okwu Igbo a na-egosipụta ma ‘zara’ ma ‘sị’ dị n’asụsụ Grik, ma na-ada nke ọma n’Igbo ugbu a karịa ịsụgharị ha n’ụzọ siri ike.
- source_word: Ἰησοῦς
  choice: Jizọs
  rationale: Nke a bụ nsụgharị aha ahụ a na-ejikarị eme ihe n’Igbo ọkọlọtọ.
- source_word: Μὴ γογγύζετε
  choice: Unu atamu ntamu
  rationale: Ụdị a na-enye iwu ka ha ghara ime ya, n’enweghị ikpebi na iwu ahụ pụtara kpọmkwem ‘kwụsịnụ.’ ‘Ịtamu ntamu’ na-echekwa echiche nke ikwu mkpesa n’olu dị ala nakwa ụda okwu Akwụkwọ Nsọ.
- source_word: μετ’ ἀλλήλων
  choice: n’etiti onwe unu
  rationale: Nke a na-egosi omume na-aga n’etiti ndị otu ahụ, ma bụrụkwa okwu Igbo doro anya ma dị n’usoro.
