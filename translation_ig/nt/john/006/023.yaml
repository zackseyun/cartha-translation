id: JHN.6.23
reference: John 6:23
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸀ἀλλὰ ἦλθεν ⸀πλοιάρια ἐκ Τιβεριάδος ἐγγὺς τοῦ τόπου ὅπου ἔφαγον τὸν ἄρτον εὐχαριστήσαντος τοῦ κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/023.yaml
  text: But boats came from Tiberias near the place where they ate the bread after the Lord had given thanks[a].
translation:
  language: ig
  text: Ma, ụgbọ mmiri nta si Taịbirias bịara nso ebe ha riri achịcha ahụ, mgbe Onyenwe anyị nyechara ekele.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀλλὰ
  choice: Ma
  rationale: Njikọ a na-egosi ọdịiche n’ihe na-esochi ọnọdụ e kwuru n’amaokwu bu ụzọ; “Ma” bụ okwu Igbo dị mfe ma kwekọọ n’ebe a.
- source_word: ἦλθεν
  choice: bịa
  rationale: Aorist nke ἔρχομαι na-akọ ọbịbịa ụgbọ mmiri ndị ahụ; “bịa” na-ekwupụta ya n'ụzọ ebumpụta ụwa.
- source_word: πλοιάρια
  choice: obere ụgbọ mmiri
  rationale: πλοιάρια bụ ụdị diminutive nke πλοῖον, ya mere “obere ụgbọ mmiri” na-edobe nghọta ịdị nta ahụ dị n’okwu Grik.
- source_word: ἐκ Τιβεριάδος
  choice: si Taịbirias
  rationale: Na-egosi ebe ụgbọ mmiri ndị ahụ si malite njem.
- source_word: ἐγγὺς τοῦ τόπου
  choice: nso ebe ahụ
  rationale: Nke a na-egosi na ha bịara n’akụkụ ebe ahụ, n’ụzọ Igbo na-ada nke ọma.
- source_word: ὅπου ἔφαγον τὸν ἄρτον
  choice: ebe ahụ ha nọ rie achịcha ahụ
  rationale: “Ebe ahụ ... nọ rie” bụ usoro Igbo ebumpụta ụwa maka ὅπου; “achịcha ahụ” na-ezo aka n’achịcha a kpọtụrụ aha na mbụ.
- source_word: εὐχαριστήσαντος τοῦ κυρίου
  choice: mgbe Onyenwe anyị kelechara Chineke
  rationale: Genitive absolute a na-egosi ihe Onyenwe anyị mere tupu ha erie. Ịkpọ Chineke aha dị ka onye a kelere na-eme ka okwu Igbo ghara ịpụta nanị na ọ kwuru ekele nye ndị mmadụ, n’agbanyeghị na onye a na-ekele apụtaghị kpọmkwem n’okwu Grik.
- source_word: τοῦ κυρίου
  choice: Onyenwe anyị
  rationale: Aha nsọpụrụ a na-ezo aka na Jizọs ma na-edobe ibu christological nke κύριος karịa “nna ukwu.”
theological_decisions:
- issue: Nsụgharị κύριος mgbe ọ na-ezo aka na Jizọs
  choice: Onyenwe anyị
  alternative: nna ukwu
  rationale: “Onyenwe anyị” na-edobe nsọpụrụ na ụda christological nke aha ahụ n’akwụghị ihe karịrị ihe ederede kwuru.
- issue: Onye Onyenwe anyị kelere
  choice: kelechara Chineke
  alternative: kelechara
  rationale: Okwu Grik hapụrụ onye a kelere n’enweghị aha, ma n’Igbo “kelechara” naanị ya nwere ike ịdị nghọta na-ezughị oke. “Kelechara Chineke” na-eme ka omume ekpere ahụ doo anya dịka ọnọdụ akụkọ ahụ si kwado, ma a na-edobe ihe dị n’okwu Grik na ndetu ala peeji.
translation_notes:
  register: Ejiri Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. A họọrọ “obere ụgbọ mmiri” iji webata diminutive nuance nke πλοιάρια n’ahịrị isi, kama izobe ya naanị na ndetu ala peeji.
