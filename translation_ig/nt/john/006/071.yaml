  text: ἔλεγεν δὲ τὸν Ἰούδαν Σίμωνος ⸀Ἰσκαριώτου· οὗτος γὰρ ἔμελλεν ⸂παραδιδόναι αὐτόν⸃, ⸀εἷς ἐκ τῶν δώδεκα.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/071.yaml
  text: He was speaking about Judas[a], the son of Simon Iscariot, for this one was about to betray him, being one of the Twelve.
translation:
  language: ig
  text: Ọ nọ na-ekwu banyere Judas, nwa Saịmọn Iskarịọt; n’ihi na ọ bụ ya ga-arara ya nye, ebe ọ bụ otu onye n’ime Ndị Iri na Abụọ ahụ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγεν δὲ τὸν Ἰούδαν
  choice: Ọ na-ekwu banyere Judas
  rationale: Ụdị ngwaa gara aga na-aga n’ihu na-enye nkọwa onye Jizọs na-ekwu maka ya. Igbo a na-asụ ugbu a na-ekwupụta nke a nke ọma; a hapụrụ δέ n’enweghị okwu pụrụ iche n’ihi na ọ bụ njikọ dị nro ebe a.
- source_word: Σίμωνος Ἰσκαριώτου
  choice: nwa Saịmọn Iskarịọt
  rationale: Genitive abụọ ahụ na-egosi n’ụzọ kacha kwe omume na Judas bụ nwa Saịmọn, onye a kpọrọ Iskarịọt.
- source_word: οὗτος
  choice: Judas a
  rationale: Ikwughachi aha Judas na mgbakwunye ‘a’ na-echekwa ike demonstrative nke οὗτος ma na-ewepụ mgbagwoju anya nke nnọchiaha Igbo.
- source_word: ἔμελλεν
  choice: na-aga
  rationale: Nke a na-egosi ihe dị n’ihu nke na-achọ ime, n’etinyeghị echiche siri ike banyere akara aka ma ọ bụ ebumnobi Judas.
- source_word: παραδιδόναι αὐτόν
  choice: ịrara ya nye
  rationale: N’akụkọ Jọn banyere Judas, okwu a na-egosi omume nrara nye; ihe ọ pụtara n’ụzọ nkịtị karị bụ inyefe mmadụ n’aka ndị ọzọ, nke e debere n’okpuru peeji.
- source_word: εἷς ἐκ τῶν δώδεκα
  choice: otu onye n’ime Ndị Iri na Abụọ ahụ
  rationale: 'Nke a na-eme ka ihe ijuanya dị n’amaokwu ahụ pụta ìhè: onye ga-arara Jizọs nye so n’òtù ahụ pụrụ iche.'
theological_decisions:
- issue: Otú e si sụgharịa παραδιδόναι gbasara Judas
  choice: ịrara ya nye
  alternative: inyefe ya n’aka ndị ọzọ
  rationale: ‘Ịrara ya nye’ na-egosi ihe okwu ahụ pụtara n’akụkọ a n’enweghị itinye ozizi ọzọ; nkọwa ala peeji na-echekwa ihe okwu Grik ahụ pụtara n’ụzọ nkịtị karị.
- issue: Ike nke ἔμελλεν
  choice: na-aga
  alternative: ga-
  rationale: ‘Na-aga’ na-echekwa echiche nke ihe na-achọ ime, ma ọ naghị ekpebi na ọ bụ akara aka Chineke ma ọ bụ naanị ebumnobi Judas.
translation_notes:
  register: E ji asụsụ Igbo Izugbe nke dị ugbu a, dị ugwu ma dị mfe nghọta mee ya. E kwughachiri ‘Judas’ iji zere mgbagwoju anya nke ọtụtụ ‘ọ/ya,’ ma ‘Judas a’ na-echekwa demonstrative nke Grik. E dere ‘Ndị Iri na Abụọ’ dị ka aha òtù a maara nke ọma.
