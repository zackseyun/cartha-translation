revisions:
- from: Ọ na-ekwu banyere Judas, nwa Saịmọn Iskarịọt; n’ihi na Judas a na-aga ịrara ya nye[a], ebe ọ bụ otu onye n’ime Ndị Iri na Abụọ ahụ.
  to: Ọ nọ na-ekwu banyere Judas, nwa Saịmọn Iskarịọt; n’ihi na ọ bụ ya ga-arara ya nye, ebe ọ bụ otu onye n’ime Ndị Iri na Abụọ ahụ.
  rationale: The revision corrects the main verb to an ongoing past action, retains Judas’s paternal identification, and uses a natural prospective construction for his forthcoming betrayal. It preserves the demonstrative force with “ọ bụ ya,” retains the established rendering for betrayal, and makes the lexical footnote literal without adding a recipient absent from the Greek.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T06:21:29Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly identifies Judas as Simon Iscariot’s son and retains both the betrayal sense of παραδιδόναι and the appositional identification as one of the Twelve. However, “Ọ na-ekwu” is present tense, whereas ἔλεγεν is an imperfect past form. The revised wording marks the past, continuing explanatory action. The prospective force of ἔμελλεν is naturally represented by the future-in-past sense “ga-arara.”
  naturalness: “Ọ nọ na-ekwu banyere ...” is idiomatic Standard Igbo for an ongoing past action. Replacing “Judas a na-aga ịrara ya nye” avoids an awkward construction that can momentarily suggest physical movement (“is going”) and prevents the repeated name from weighing down the sentence. “Ọ bụ ya” adequately carries the demonstrative emphasis in natural narrative Igbo.
  terminology: “ịrara ya nye” is appropriate in this Johannine context. The alternative footnote should not add an unspecified plural recipient (“ndị ọzọ”), since the Greek verb itself does not state one; “inyefe ya” is the suitably literal alternative. “Ndị Iri na Abụọ” appropriately treats the group as its recognized designation.
  issues:
  - severity: medium
    issue: Present tense in “Ọ na-ekwu”
    rationale: The Greek ἔλεγεν is imperfect and refers to Jesus’ prior speech in the narrative. Standard Igbo should use a past-continuing expression such as “Ọ nọ na-ekwu.”
  - severity: low
    issue: The phrase “Judas a na-aga ịrara ya nye” is less natural and can be ambiguous
    rationale: “na-aga” commonly evokes going/movement in Igbo. A simple prospective future form better conveys μέλλω in this context without importing an intention or destiny claim.
  - severity: low
    issue: Footnote adds “n’aka ndị ọzọ”
    rationale: The literal alternative for παραδιδόναι is “hand over,” but the Greek does not specify “to others.” Removing that addition keeps the note lexically precise.
  revised_text: Ọ nọ na-ekwu banyere Judas, nwa Saịmọn Iskarịọt; n’ihi na ọ bụ ya ga-arara ya nye, ebe ọ bụ otu onye n’ime Ndị Iri na Abụọ ahụ.
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, n’ụzọ nkịtị karị, “inyefe ya.”
    reason: lexical_alternative
  revision_rationale: The revision corrects the main verb to an ongoing past action, retains Judas’s paternal identification, and uses a natural prospective construction for his forthcoming betrayal. It preserves the demonstrative force with “ọ bụ ya,” retains the established rendering for betrayal, and makes the lexical footnote literal without adding a recipient absent from the Greek.
