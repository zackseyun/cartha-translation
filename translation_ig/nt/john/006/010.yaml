source:
  edition: SBLGNT
  text: ⸀εἶπεν ὁ Ἰησοῦς· Ποιήσατε τοὺς ἀνθρώπους ἀναπεσεῖν. ἦν δὲ χόρτος πολὺς ἐν τῷ τόπῳ. ἀνέπεσαν οὖν οἱ ἄνδρες τὸν ἀριθμὸν ⸀ὡς πεντακισχίλιοι.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/010.yaml
  text: Jesus said, “Have the people sit down.” Now there was plenty of grass in the place. So the men sat down, about five thousand in number.
translation:
  language: ig
  text: Jizọs sịrị, “Meenụ ka ndị mmadụ[a] nọdụ ala[b].” N’ebe ahụ, e nwere ọtụtụ ahịhịa. Ya mere, ndị ikom ahụ nọdụrụ ala; ọnụ ọgụgụ ha dị ihe dị ka puku ise.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’ebe a, Grik bu ụzọ kwuo “ndị mmadụ” (ἀνθρώπους), ma emesịa kwuo “ndị ikom” (ἄνδρες). Nke a na-egosi na ọnụ ọgụgụ ihe dị ka puku ise ahụ na-ekwu kpọmkwem maka ndị ikom.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya “dina ala.” Ngwaa Grik a pụrụ ịkọwa ọnọdụ mmadụ na-anọ mgbe ọ na-eri nri; ma n’ebe a, “nọdụ ala” bụ okwu Igbo kacha kwekọọ n’ọnọdụ ahụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ποιήσατε
  choice: Meenụ ka
  rationale: Ụdị iwu a, ya na ngwaa na-esochi ya, na-egosi ime ka ndị ọzọ mee ihe. “Meenụ ka” bụ Igbo doro anya nke na-echekwa iwu Jizọs nyere ọtụtụ ndị.
- source_word: τοὺς ἀνθρώπους
  choice: ndị mmadụ
  rationale: ἀνθρώπους na-ezo aka n’ìgwè mmadụ n’ozuzu, ọ bụghị naanị ụmụ nwoke; “ndị mmadụ” na-echekwa nghọta ahụ.
- source_word: ἀναπεσεῖν / ἀνέπεσαν
  choice: nọdụ ala / nọdụrụ ala
  rationale: Ngwaa Grik ahụ nwere ike ịpụta ịdina ma ọ bụ ịdabere azụ mgbe a na-eri nri, ma “ịnọdụ ala” bụ okwu Igbo nkịtị na nke dabara n’ọnọdụ ìgwè mmadụ nọ n’ahịhịa.
- source_word: χόρτος πολὺς
  choice: Ahịhịa dịkwa ukwuu
  rationale: χόρτος bụ ahịhịa n’ebe a, πολὺς na-egosikwa na ọ bara ụba. Nkebiokwu a na-enye ihe ahụ n’ụzọ dị nso ma bụrụkwa Igbo a na-aghọta.
- source_word: ἐν τῷ τόπῳ
  choice: n’ebe ahụ
  rationale: “N’ebe ahụ” bụ ụzọ Igbo dị nkenke ma dị mma isi kwuo ebe akụkọ ahụ na-ekwu maka ya.
- source_word: οἱ ἄνδρες
  choice: ndị ikom ahụ
  rationale: ἀνήρ na-akọwapụta ụmụ nwoke, n’adịghị ka ἄνθρωπος e ji mee ihe tupu ya; “ndị ikom ahụ” na-echekwa ọdịiche a.
- source_word: τὸν ἀριθμὸν ὡς πεντακισχίλιοι
  choice: ọnụ ọgụgụ ha dị ihe dị ka puku ise
  rationale: “Ihe dị ka” na-echekwa amụma dị na ὡς, ebe “ọnụ ọgụgụ ha” na-egosipụta τὸν ἀριθμόν n’Igbo eke.
theological_decisions:
- issue: Ọ bụ ụmụ nwoke ka ọnụ ọgụgụ puku ise ahụ kpọmkwem na-ekwu maka ha
  choice: E kewapụtara “ndị mmadụ” (ἀνθρώπους) na “ndị ikom” (ἄνδρες).
  alternative: Ịsụgharị okwu abụọ ahụ niile dịka “ndị mmadụ.”
  rationale: Grik gbanwere site n’okwu na-agụnye ìgwè mmadụ niile gaa n’okwu kpọmkwem maka ụmụ nwoke. Idebe ọdịiche ahụ anaghị agbakwunye nkọwa ozizi, kama ọ na-echekwa ihe ederede ahụ kwuru.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta, mee ntụgharị a. “Meenụ ka” na-egosi na Jizọs gwara ọtụtụ ndị ka ha hazie ìgwè mmadụ ahụ; e chekwara ọdịiche dị n’etiti ìgwè mmadụ niile na ndị ikom a gụrụ ọnụ.
