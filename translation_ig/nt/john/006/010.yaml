- from: Jizọs sịrị, “Meenụ ka ndị mmadụ[a] nọdụ ala.[b]” Ahịhịa dịkwa ukwuu n’ebe ahụ. Ya mere, ndị ikom ahụ nọdụrụ ala; ọnụ ọgụgụ ha dị ihe dị ka puku ise.
  to: Jizọs sịrị, “Meenụ ka ndị mmadụ[a] nọdụ ala[b].” N’ebe ahụ, e nwere ọtụtụ ahịhịa. Ya mere, ndị ikom ahụ nọdụrụ ala; ọnụ ọgụgụ ha dị ihe dị ka puku ise.
