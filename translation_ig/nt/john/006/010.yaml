    text: N’ebe a, Grik bu ụzọ kwuo “ndị mmadụ” (ἀνθρώπους), ma emesịa kwuo “ndị ikom” (ἄνδρες). Nke a na-egosi na ọnụ ọgụgụ ihe dị ka puku ise ahụ na-ekwu kpọmkwem maka ndị ikom.
    reason: lexical_alternative
