  yaml_path: translation/nt/john/006/018.yaml
  text: And the sea was being stirred up because a strong wind was blowing[a].
translation:
  language: ig
  text: Oké ifufe na-efe, mmiri ahụ na-ama jijiji[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “mmiri ahụ na-akpagharị,” ma ọ bụ “mmiri ahụ na-ebili.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἥ τε θάλασσα
  choice: mmiri ahụ nọkwa
  rationale: N'Igbo, a na-akpọkarị nnukwu ọdọ mmiri Galili 'mmiri' n'okwu nkịtị. 'Ahụ' na-edebe nrụtụ aka a kapịrị ọnụ nke Greek, ebe '-kwa' na-egosipụta njikọ dị nro nke τε.
- source_word: ἀνέμου μεγάλου
  choice: oké ifufe
  rationale: '''Oké ifufe'' bụ ụzọ Igbo dị eke isi kwuo ifufe siri ike; ọ na-egosipụta μέγας n''etinyeghị echiche karịrị ihe okwu Greek kwuru.'
- source_word: πνέοντος
  choice: nọ na-efe
  rationale: Ụdị a na-egosipụta omume ifufe ahụ na-aga n'ihu, dị ka present participle πνέοντος si eme.
- source_word: διεγείρετο
  choice: nọ na-ama jijiji
  rationale: Nke a na-egosipụta ọnọdụ mmiri ahụ nke na-aga n'ihu n'ihi ifufe, ma ghara ịgbakwunye nkọwa ebili mmiri nke na-adịghị kpọmkwem na ngwaa Greek.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo Izugbe dị ugbu a, dị mfe ma nwee ugwu. E haziri ahịrịokwu ahụ ka ihe kpatara ọnọdụ mmiri—oké ifufe na-efe—pụta nke ọma, ebe a ka debere omume abụọ ahụ dịka ihe na-aga n'ihu.
