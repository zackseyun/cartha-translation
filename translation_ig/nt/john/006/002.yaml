- from: Ma oké ìgwè mmadụ nọ na-eso ya, n’ihi na ha nọ na-ahụ ihe ịrịba ama[a] ndị ọ na-eme n’ahụ ndị ọrịa.
  to: Ma nnukwu ìgwè mmadụ nọ na-eso ya, n’ihi na ha na-ahụ ihe ịrịba ama[a] ndị ọ na-eme n’ahụ ndị ọrịa.
  rationale: The revision retains all source-level meanings and the intended progressive setting, while using more idiomatic Standard Igbo for “a large crowd” and clarifying the lexical-alternative footnote. The main text continues to preserve the Johannine term “signs” rather than replacing it with an interpretive theological equivalent.
