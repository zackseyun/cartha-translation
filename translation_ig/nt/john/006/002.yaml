  text: ⸂ἠκολούθει δὲ⸃ αὐτῷ ὄχλος πολύς, ὅτι ⸀ἐθεώρουν τὰ σημεῖα ἃ ἐποίει ἐπὶ τῶν ἀσθενούντων.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/002.yaml
  text: And a large crowd was following him[a], because they were seeing the signs that he was doing on those who were sick.
translation:
  language: ig
  text: Ma nnukwu ìgwè mmadụ nọ na-eso ya, n’ihi na ha na-ahụ ihe ịrịba ama[a] ndị ọ na-eme n’ahụ ndị ọrịa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “ọrụ ebube” ma ọ bụ “ihe ịrịba ama nke ọrụ ebube.” Okwu Jọn ji mee ihe, “ihe ịrịba ama,” na-emesi ihe ọrụ ndị a na-ekpughe banyere Jizọs ike.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠκολούθει
  choice: nọ na-eso
  rationale: Oge imperfect na-egosi omume gara aga nke na-aga n’ihu; “nọ na-eso” na-egosipụta nke a n’Igbo dị eke.
- source_word: δὲ
  choice: Ma
  rationale: N’ebe a δέ bụ njikọ dị nro na-ebuga akụkọ n’ihu; “Ma” bụ njikọ Igbo kwesịrị ekwesị, ọ bụghị ihe na-egosi nnukwu esemokwu.
- source_word: ὄχλος πολύς
  choice: oké ìgwè mmadụ
  rationale: Ọ na-egosi ìgwè mmadụ buru ibu; okwu a doro anya ma dị ùgwù n’Igbo.
- source_word: ἐθεώρουν
  choice: ha nọ na-ahụ
  rationale: Imperfect na-egosi na ịhụ ahụ na-aga n’ihu ma ọ bụ na-eme ugboro ugboro; “nọ na-ahụ” na-echekwa akụkụ a n’asụsụ Igbo.
- source_word: σημεῖα
  choice: ihe ịrịba ama
  rationale: N’Oziọma Jọn, okwu a na-atụ aka n’ihe ọrụ Jizọs na-ekpughe banyere ya, ọ bụghị naanị n’ịdị ebube ha.
- source_word: ἐποίει
  choice: ọ na-eme
  rationale: Imperfect na-egosi ọrụ na-aga n’ihu; “ọ na-eme” bụ ụzọ Igbo dị mfe ma bụrụkwa nke eke.
- source_word: ἐπὶ τῶν ἀσθενούντων
  choice: n’ahụ ndị ọrịa
  rationale: N’usoro okwu a, ἐπί na-ejikọta ọrụ ebube ndị ahụ na ndị ọrịa dịka ndị a na-emere ha; “n’ahụ ndị ọrịa” na-egosipụta mmekọrịta ahụ nke ọma n’Igbo.
- source_word: ἀσθενούντων
  choice: ndị ọrịa
  rationale: N’ọnọdụ a, participle ahụ na-ezo aka n’ahụ mgbu ma ọ bụ ọrịa anụ ahụ; “ndị ọrịa” doro anya ma bụrụ okwu Igbo a na-asụkarị.
theological_decisions:
- issue: Okwu σημεῖα nke Jọn ji akọwa ọrụ Jizọs
  choice: ihe ịrịba ama
  alternative: ọrụ ebube; ihe ịrịba ama dị ebube
  rationale: “Ihe ịrịba ama” na-echekwa echiche Jọn na ọrụ ndị a na-egosi ma na-ekpughe onye Jizọs bụ, n’etinyeghị nkọwa ọzọ n’ime isiokwu.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji usoro “nọ na-/na-” chekwaa omume imperfect na-aga n’ihu, ma zere okwu ụka pụrụ iche nke otu denominashọn.
