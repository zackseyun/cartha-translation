  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τοῦτο δέ ἐστιν τὸ θέλημα τοῦ πέμψαντός ⸀με ἵνα πᾶν ὃ δέδωκέν μοι μὴ ἀπολέσω ἐξ αὐτοῦ ἀλλὰ ἀναστήσω ⸀αὐτὸ τῇ ἐσχάτῃ ἡμέρᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/039.yaml
  text: 'And this is the will of the one who sent me: that I should lose nothing of all that he has given me[a], but should raise it up on the last day.'
translation:
  language: ig
  text: 'Ma nke a bụ uche onye zitere m: ka m ghara ịtụfu ihe ọ bụla n’ime ihe niile o nyeworo m[a], kama ka m kpọlite ya n’ụbọchị ikpeazụ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n’ụzọ na-ekwu maka ndị mmadụ kpọmkwem karị, “ndị niile o nyeworo m ... ka m kpọlite ha.” Grik na-eji okwu nchịkọta n’ụdị otu; n’ụzọ nkịtị, ọ na-ekwu “ihe niile o nyeworo m ... ya.”
    reason: alternative_reading
lexical_decisions:
- source_word: θέλημα
  choice: uche
  rationale: “Uche” bụ okwu Igbo doro anya maka ihe onye chọrọ ma ọ bụ nzube ya; ọ naghị amanye nghọta nke ọchịchọ nkịtị ma ọ bụ mkpebi a kara aka.
- source_word: τοῦ πέμψαντός με
  choice: onye zitere m
  rationale: Nke a na-edobe participle Grik dịka aha onye ma na-ada nke ọma n’Igbo.
- source_word: ἵνα
  choice: ka
  rationale: “Ka” na-egosi ihe uche ahụ bụ ma na-ebukwa echiche nke nzube dị na ἵνα.
- source_word: πᾶν ὃ δέδωκέν μοι
  choice: ihe niile o nyeworo m
  rationale: Nke a na-edobe okwu nchịkọta nke Grik n’ụdị na-abụghị kpọmkwem aha mmadụ, kama ịgbanwe ya ozugbo ka ọ bụrụ “ndị niile.”
- source_word: δέδωκέν
  choice: o nyeworo m
  rationale: Ụdị perfect Igbo a na-egosi ihe e mere nke nsonaazụ ya ka dị ugbu a.
- source_word: μὴ ἀπολέσω ἐξ αὐτοῦ
  choice: ka m ghara ịtụfu ihe ọ bụla n’ime ihe niile ahụ
  rationale: “Ịtụfu” na-egosi ịla ihe n’aka kama ibibi ya; “ihe ọ bụla n’ime” na-ebupụta echiche ἐξ αὐτοῦ n’Igbo doro anya.
- source_word: ἀναστήσω αὐτό
  choice: ka m kpọlite ya
  rationale: “Ịkpọlite” dabara n’okwu banyere mbilite n’ọnwụ, ebe “ya” na-edobe nnọchiaha otu nke na-arụ ọrụ dịka nchịkọta.
- source_word: τῇ ἐσχάτῃ ἡμέρᾳ
  choice: n’ụbọchị ikpeazụ
  rationale: Nke a bụ ntụgharị Igbo nkịtị ma doo anya maka ụbọchị ikpeazụ e kwuru banyere ya.
theological_decisions:
- issue: Ma a ga-asụ ihe e nyere Jizọs dịka ihe nchịkọta (“ihe niile”) ma ọ bụ kpọọ ha ndị mmadụ ozugbo (“ndị niile”).
  choice: ihe niile o nyeworo m ... kpọlite ya
  alternative: ndị niile o nyeworo m ... kpọlite ha
  rationale: Grik ji ụdị neuter singular πᾶν, ὃ, na αὐτό mee ihe. Ịsụ ya dịka nchịkọta na-edobe ọdịdị na mgbagwoju anya ahụ, n’agbanyeghị na ihe gbara amaokwu ahụ gburugburu nwere ike igosi na ndị mmadụ ka a na-ekwu maka ha.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. E debere usoro nchịkọta nke Grik n’ahịrị isi, ma tinye ntụgharị na-egosi ndị mmadụ kpọmkwem n’ala ala peeji.
