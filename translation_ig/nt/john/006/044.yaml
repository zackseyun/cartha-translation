review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the universal inability, coming to Jesus, the Father who sent him, and resurrection on the last day. However, «ma ọ bụrụ na ... adọtaghị ya» is a negative, perfect-style conditional and does not directly render Greek ἐὰν μὴ (“unless”) with its required positive action. «belụsọ ma ... dọta ya» is a clear, idiomatic equivalent that preserves the conditional force and the lexical ambiguity of ἑλκύσῃ.
  naturalness: Most of the wording is modern Standard Igbo and suitably reverent. The revised conditional is more natural and avoids the awkward negative verb form. «Mụ onwe m ga-akpọlitekwa ya» remains an acceptable rendering of the explicit κἀγώ.
  terminology: «Nna», «dọta», «kpọlite», and «ụbọchị ikpeazụ» are appropriate. The lexical-alternative note must use affirmative alternatives, since the source verb and the revised main-text verb are affirmative within an ‘unless’ condition. The gender footnote is accurate but should state that Igbo «ya» is not gender-marked without implying that Greek wording is being altered.
  issues:
  - severity: medium
    issue: The main conditional uses «adọtaghị ya».
    rationale: This is a negative, completed-style form (“has not drawn him”) rather than the direct positive action governed by Greek ἐὰν μὴ. Although a negative conditional can approximate the logical implication, it is less faithful in form and less natural here. «belụsọ ma ... dọta ya» directly expresses “unless ... draws him.”
  - severity: medium
    issue: Footnote a gives negative verb forms as alternatives («akwaghị ya», «akpụtaghị ya n'ike»).
    rationale: These forms do not provide lexical alternatives for the affirmative verb ἑλκύσῃ and are incompatible with a main text that says the Father draws the person. The note should offer affirmative wording such as «dọkpụrụ ya» or «kpụọrọ ya» while preserving the disputed strength of the verb.
  revised_text: Ọ dịghị onye pụrụ ịbịakwute m belụsọ ma Nna nke zitere m dọta ya[a][b]; mụ onwe m ga-akpọlitekwa ya n'ụbọchị ikpeazụ.
  revised_footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “dọkpụrụ ya” ma ọ bụ “kpụọrọ ya.” Ngwaa Greek ahụ nwere ike ịpụta ịdọta ma ọ bụ ịdọkpụ n'ike karịa. E ji “dọta” mee ihe n'ahịrịokwu bụ isi ka e wee ghara ịmanye otu nkọwa kpọmkwem banyere otú Nna si eme ka mmadụ bịakwute Ọkpara ahụ.
    reason: lexical_alternative
  - marker: b
    text: N'asụsụ Greek, e ji nnọchiaha nwoke nke pụtara “ya” mee ihe dị ka nnọchi anya mmadụ n'ozuzu; okwu a metụtara mmadụ niile, ọ bụghị naanị ụmụ nwoke. N'Igbo, “ya” anaghị ekewa nwoke na nwanyị.
    reason: lexical_alternative
  revision_rationale: The revision replaces the negative conditional with the idiomatic Igbo construction «belụsọ ma ... dọta ya», directly corresponding to “unless the Father ... draws him.” It also repairs footnote a so that its alternatives are affirmative lexical alternatives for ἑλκύσῃ. No doctrinal mechanism is added or decided.
