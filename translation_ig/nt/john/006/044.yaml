revisions:
- from: Ọ dịghị onye pụrụ ịbịakwute m ma ọ bụrụ na Nna nke zitere m adọtaghị ya[a][b]; mụ onwe m ga-akpọlitekwa ya n'ụbọchị ikpeazụ.
  to: Ọ dịghị onye pụrụ ịbịakwute m belụsọ ma Nna nke zitere m dọta ya[a][b]; mụ onwe m ga-akpọlitekwa ya n'ụbọchị ikpeazụ.
  rationale: The revision replaces the negative conditional with the idiomatic Igbo construction «belụsọ ma ... dọta ya», directly corresponding to “unless the Father ... draws him.” It also repairs footnote a so that its alternatives are affirmative lexical alternatives for ἑλκύσῃ. No doctrinal mechanism is added or decided.
  reviewer_model: gpt-5.6-terra
