id: JHN.6.44
reference: John 6:44
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οὐδεὶς δύναται ἐλθεῖν πρός ⸀με ἐὰν μὴ ὁ πατὴρ ὁ πέμψας με ἑλκύσῃ αὐτόν, κἀγὼ ἀναστήσω αὐτὸν ἐν τῇ ἐσχάτῃ ἡμέρᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/044.yaml
  text: No one is able to come to me unless the Father who sent me draws him[b][a], and I will raise him up on the last day.
translation:
  language: ig
  text: Ọ dịghị onye pụrụ ịbịakwute m belụsọ ma Nna nke zitere m dọta ya[a][b]; mụ onwe m ga-akpọlitekwa ya n'ụbọchị ikpeazụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “dọkpụrụ ya” ma ọ bụ “kpụọrọ ya.” Ngwaa Greek ahụ nwere ike ịpụta ịdọta ma ọ bụ ịdọkpụ n'ike karịa. E ji “dọta” mee ihe n'ahịrịokwu bụ isi ka e wee ghara ịmanye otu nkọwa kpọmkwem banyere otú Nna si eme ka mmadụ bịakwute Ọkpara ahụ.
    reason: lexical_alternative
  - marker: b
    text: N'asụsụ Greek, e ji nnọchiaha nwoke nke pụtara “ya” mee ihe dị ka nnọchi anya mmadụ n'ozuzu; okwu a metụtara mmadụ niile, ọ bụghị naanị ụmụ nwoke. N'Igbo, “ya” anaghị ekewa nwoke na nwanyị.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδεὶς
  choice: Ọ dịghị onye
  rationale: Nke a bụ ụzọ Igbo nkịtị si egosipụta nkwupụta jụrụ onye ọ bụla, ma na-edobe ike nke ngọnarị zuru ụwa ọnụ.
- source_word: δύναται
  choice: pụrụ
  rationale: “Pụrụ” na-egosipụta ikike ma ọ bụ ike ime ihe, kwekọọ n'echiche doro anya nke δύναται.
- source_word: ἐλθεῖν πρός με
  choice: ịbịakwute m
  rationale: Ọ na-egosipụta ịbịa n'ebe Jizọs nọ ma na-edobe ma mmegharị ahụ ma ịdị-mmekọrịta dị n'okwu Jọn.
- source_word: ἐὰν μὴ
  choice: ma ọ bụrụ na ... adọtaghị
  rationale: Usoro a bụ Igbo doro anya maka ọnọdụ “ọ bụrụ na ọ bụghị,” ya bụ “unless,” n'enweghị ịgbanwe njikọ ezi uche dị n'okwu ahụ.
- source_word: ὁ πατὴρ ὁ πέμψας με
  choice: Nna nke zitere m
  rationale: Akụkụ participle ahụ ghọrọ nkebiokwu njikọ nke na-ada nke ọma n'Igbo ma na-edobe aha onwe onye ahụ, “Nna.”
- source_word: ἑλκύσῃ
  choice: adọtaghị
  rationale: Ngwaa “dọta” na-edobe echiche nke ime ka onye bịaruo nso n'etinyeghị nkọwa ụka banyere otú Nna si eme nke a; a kọwara nhọrọ ndị siri ike karị n'okpuru peeji.
- source_word: αὐτόν
  choice: ya
  rationale: “Ya” bụ nnọchiaha onye nke atọ otu n'Igbo, ọ naghị ekewa nwoke na nwanyị, ya mere ọ na-ebunye ntụaka otu onye nke Greek n'ụzọ ebumpụta ụwa.
- source_word: κἀγὼ
  choice: mụ onwe m ... kwa
  rationale: “Mụ onwe m” na-edobe nkwusike dị na ἐγώ, ebe “kwa” na-ebunye καί nke jikọtara ya.
- source_word: ἀναστήσω
  choice: ga-akpọlite ... ya
  rationale: “Kpọlite” na-edobe ihe oyiyi nke ime ka onye bilie, ma n'ọnọdụ a ọ na-ezo aka n'ịkpọlite onye ahụ n'ọnwụ.
- source_word: ἐν τῇ ἐσχάτῃ ἡμέρᾳ
  choice: n'ụbọchị ikpeazụ
  rationale: Nke a bụ okwu Igbo doro anya ma dị ebumpụta ụwa maka ụbọchị ikpeazụ ahụ a na-ekwu maka ya.
theological_decisions:
- issue: Ihe ἑλκύσῃ pụtara n'ọnọdụ a na-arụrịta ụka banyere nzọpụta
  choice: adọtaghị
  alternative: akwaghị ya / akpụtaghị ya n'ike
  rationale: “Dọta” na-edobe ike nke ime ka onye bịaruo nso, ma ọ naghị ekpebi ma omume ahụ ọ bụ nke a na-apụghị iguzogide ma ọ bụ otú o si arụ ọrụ. Ya mere, a hapụrụ esemokwu nkà mmụta okpukpe dị n'okwu Greek ka ọ dị.
- issue: Nnọchiaha nwoke αὐτόν e ji anọchi anya mmadụ n'ozuzu
  choice: ya
  alternative: onye ahụ
  rationale: Igbo “ya” bụ otu onye ma ọ naghị egosi nwoke ma ọ bụ nwanyị. Ọ na-edobe ntụaka otu onye ahụ nke Greek n'ụzọ ziri ezi, ebe nkọwa n'okpuru peeji na-eme ka o doo anya na okwu ahụ metụtara mmadụ niile, ọ bụghị naanị ụmụ nwoke.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta, mee ihe. A họọrọ “pụrụ” iji mee ka okwu banyere ikike pụta ìhè; “dọta” na-echekwa obosara na esemokwu nke okwu Greek; “mụ onwe m” na-edobe nkwusike dị na κἀγώ.
