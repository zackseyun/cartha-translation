  terminology: “Mmụọ/mmụọ,” “anụ ahụ,” “okwu,” and “ndụ” preserve the source wording and its theological breadth. The capitalization distinction appropriately signals the likely referent in the first clause while retaining the qualitative, non-capitalized predicate in the final clause. The notes avoid importing a sectarian interpretation.
