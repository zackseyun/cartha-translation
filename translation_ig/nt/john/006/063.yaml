  source_fidelity: 'The translation accurately represents all major elements of the Greek: the life-giving function of τὸ πνεῦμα, the absolute lack of benefit expressed by ἡ σὰρξ οὐκ ὠφελεῖ οὐδέν, and the qualitative predicates πνεῦμά ἐστιν καὶ ζωή ἐστιν. “m gwaworo” suitably reflects the Greek perfect λελάληκα without overstating its aspect.'
