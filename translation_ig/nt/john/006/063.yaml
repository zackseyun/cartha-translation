id: JHN.6.63
reference: John 6:63
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τὸ πνεῦμά ἐστιν τὸ ζῳοποιοῦν, ἡ σὰρξ οὐκ ὠφελεῖ οὐδέν· τὰ ῥήματα ἃ ἐγὼ ⸀λελάληκα ὑμῖν πνεῦμά ἐστιν καὶ ζωή ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/063.yaml
  text: It is the Spirit who gives life[a]; the flesh benefits nothing[c][b]. The words that I have spoken to you are spirit and are life.
translation:
  language: ig
  text: Ọ bụ Mmụọ na-enye ndụ[a]; anụ ahụ abaghị uru ọ bụla[b]. Okwu ndị m gwaworo unu bụ mmụọ, bụrụkwa ndụ[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “Ọ bụ mmụọ na-enye ndụ.” Okwu Grik πνεῦμα nwere ike ịpụta “Mmụọ” ma ọ bụ “mmụọ”; n'ebe a, ọnọdụ okwu ahụ na-akwado nghọta nke Mmụọ Nsọ.
    reason: alternative_reading
  - marker: b
    text: “Anụ ahụ” nwere ike ịpụta ihe mmadụ nwere ma ọ bụ na-eme naanị site n'ike mmadụ. Ịsụgharị ya “ọdịdị mmehie” n'ebe a ga-akọwa ya karịa ka okwu Grik ahụ chọrọ.
    reason: lexical_alternative
  - marker: c
    text: A pụkwara ịghọta ya dịka “bụ Mmụọ na ndụ” ma ọ bụ “bụ ihe ime mmụọ ma na-enye ndụ.” Okwu Grik ahụ dị nkenke ma na-akọwa àgwà okwu ndị ahụ.
    reason: alternative_reading
lexical_decisions:
- source_word: πνεῦμα
  choice: Mmụọ / mmụọ
  rationale: N'ahịrịokwu mbụ, e ji mkpụrụedemede ukwu dee “Mmụọ” iji gosi na ihe a kacha yie ka a na-ekwu maka ya bụ Mmụọ Nsọ, ma etinyeghị “Nsọ” n'ahịrịokwu ahụ n'ihi na okwu Grik ahụ n'onwe ya bụ πνεῦμα. N'ahịrịokwu ikpeazụ, e ji “mmụọ” nta mee ka ọdịdị nkọwa ya na enweghị article n'asụsụ Grik pụta ìhè.
- source_word: ζῳοποιοῦν
  choice: na-enye ndụ
  rationale: Nke a na-egosi omume nke ime ka mmadụ dị ndụ ma ọ bụ inye ndụ, ma na-ada nke ọma n'Igbo mgbe isiokwu ya bụ Mmụọ.
- source_word: σὰρξ
  choice: anụ ahụ
  rationale: “Anụ ahụ” bụ okwu Igbo kwụ ọtọ maka σάρξ ma na-echekwa nghọta ya sara mbara. A sụgharịghị ya “ọdịdị mmehie” ma ọ bụ “ahụ mmadụ” naanị, n'ihi na nke ahụ ga-akọwa okwu ahụ karịa ka isi mmalite si mee.
- source_word: ὠφελεῖ οὐδέν
  choice: abaghị uru ọ bụla
  rationale: 'Nke a na-echekwa nkwụsi ike nke ngọnahụ ahụ: ọ dịghị uru ọ bụla ọ bara.'
- source_word: ῥήματα
  choice: Okwu
  rationale: Ọ na-ezo aka n'ihe e kwuru; “okwu” bụ nsụgharị Igbo doro anya ma dị ndụ.
- source_word: λελάληκα
  choice: m gwaworo
  rationale: Ụdị perfect Igbo a na-egosi okwu e kwuru nke ka dị mkpa ugbu a, dịka perfect Grik si arụ ọrụ ebe a.
- source_word: πνεῦμά ἐστιν καὶ ζωή ἐστιν
  choice: bụ mmụọ, bụrụkwa ndụ
  rationale: A hapụrụ ahịrịokwu ahụ ka ọ dị nkenke ma sie ike dịka nke Grik, kama ịkọwa ya dịka “bụ okwu ime mmụọ” ma ọ bụ “na-enye ndụ.”
- source_word: ζωή
  choice: ndụ
  rationale: “Ndụ” bụ okwu Igbo ziri ezi maka ζωή ma na-echekwa omimi okwu a nwere n'Oziọma Jọn.
theological_decisions:
- issue: Ihe πνεῦμα na-ezo aka na nkebi mbụ
  choice: “Mmụọ” na-ezo aka n'ụzọ kachasị yie ka ọ bụrụ Mmụọ Nsọ
  alternative: “mmụọ” dịka ike ime mmụọ n'ozuzu ya ma ọ bụ mmụọ mmadụ
  rationale: Ọnọdụ okwu a n'Oziọma Jọn na ọrụ inye ndụ na-akwado nghọta nke Mmụọ Nsọ. Mkpụrụedemede ukwu na-egosi nke a, ebe nkọwa ala peeji na-echekwa ohere nke nghọta ọzọ.
- issue: Ihe σὰρξ pụtara n'ebe a
  choice: E debere ya dịka “anụ ahụ,” okwu nwere nghọta sara mbara
  alternative: “ọdịdị mmehie,” “ike mmadụ nkịtị,” ma ọ bụ “ahụ mmadụ” naanị
  rationale: Nsụgharị a anaghị eme ka esemokwu dị n'etiti Mmụọ na anụ ahụ ghọọ otu nkọwa okpukpe a họpụtara tupu oge eruo.
- issue: Ike predicate nke πνεῦμά ἐστιν na nkebi ikpeazụ
  choice: “bụ mmụọ, bụrụkwa ndụ,” nke nwere ike nkọwa qualitative
  alternative: “bụ Mmụọ na ndụ” ma ọ bụ “bụ ihe ime mmụọ na ihe na-enye ndụ”
  rationale: Predicate ahụ enweghị article n'asụsụ Grik; ya mere, ọ ka mma ichekwa okwu ahụ dị nkenke na nke nwere nghọta sara mbara karịa ime ka ọ bụrụ njirimara kpọmkwem ma ọ bụ nkọwa agbakwunyere.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A hapụrụ okwu ndị bụ isi—“Mmụọ/mmụọ,” “anụ ahụ,” na “ndụ”—ka ha chekwaa nghọta sara mbara na esemokwu nkà mmụta okpukpe dị n'isi mmalite, n'enweghị ịtinye nkọwa otu ụka.
