reference: John 6:26
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀπεκρίθη αὐτοῖς ὁ Ἰησοῦς καὶ εἶπεν· Ἀμὴν ἀμὴν λέγω ὑμῖν, ζητεῖτέ με οὐχ ὅτι εἴδετε σημεῖα ἀλλ’ ὅτι ἐφάγετε ἐκ τῶν ἄρτων καὶ ἐχορτάσθητε·
base_translation:
  language: en
  yaml_path: translation/nt/john/006/026.yaml
  text: Jesus answered them[a], “Truly, truly, I say to you, you are seeking me not because you saw signs, but because you ate of the loaves and were filled.
translation:
  language: ig
  text: 'Jizọs zara ha, sị, “N’ezie, n’ezie, ana m asị unu: unu na-achọ m, ọ bụghị n’ihi na unu hụrụ ihe ịrịba ama, kama ọ bụ n’ihi na unu riri n’achịcha ndị ahụ, afọ jukwara unu[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “unu riri achịcha ndị ahụ, afọ wee ju unu.” N’asụsụ Grik, n’ụzọ nkịtị, ọ sịrị, “unu riri site n’achịcha ndị ahụ”; ngwaa ikpeazụ ahụ pụkwara ịpụta “afọ juru unu” ma ọ bụ “unu rijuru afọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη αὐτοῖς ὁ Ἰησοῦς καὶ εἶπεν
  choice: Jizọs zara ha, sị
  rationale: Nke a na-egosipụta usoro okwu Grik ahụ, ‘zara ha wee sị,’ n’Igbo dị ire ma zere nkwughachi na-adịghị mkpa.
- source_word: Ἀμὴν ἀμὴν
  choice: N’ezie, n’ezie
  rationale: Nkwughachi ahụ na-echekwa usoro pụrụ iche Jọn ji egosi nkwenye siri ike na ịdị nsọ nke okwu Jizọs.
- source_word: λέγω ὑμῖν
  choice: ana m asị unu
  rationale: Ọ na-egosipụta okwu dị ugbu a ma na-adabara usoro nkwupụta siri ike nke amaokwu ahụ.
- source_word: ζητεῖτέ με
  choice: unu na-achọ m
  rationale: Ọ na-echekwa omume na-aga n’ihu nke ngwaa dị ugbu a nakwa isiokwu Jọn banyere ‘ịchọ’ Jizọs.
- source_word: οὐχ ὅτι ... ἀλλ’ ὅτι
  choice: ọ bụghị n’ihi na ... kama ọ bụ n’ihi na
  rationale: Usoro a na-egosipụta n’ụzọ doro anya ọdịiche dị n’etiti ihe abụọ kpatara ha ji achọ Jizọs.
- source_word: εἴδετε
  choice: unu hụrụ
  rationale: Ọ pụtara ịhụ ihe ndị mere; a naghị etinye echiche nke nghọta ime mmụọ nke okwu Grik ahụ ekwughị kpọmkwem.
- source_word: σημεῖα
  choice: ihe ịrịba ama
  rationale: Nke a na-echekwa okwu Jọn ji akọwa ọrụ Jizọs dị ka ihe na-arụtụ aka n’ihe karịrị ọrụ ebube ahụ n’onwe ya.
- source_word: ἐφάγετε ἐκ τῶν ἄρτων
  choice: unu riri n’ogbe achịcha ndị ahụ
  rationale: Ọ na-echekwa ọtụtụ nke ἄρτων na echiche partitive nke ἐκ, ma na-ezo aka n’ogbe achịcha ndị e nyere ìgwè mmadụ.
- source_word: ἐχορτάσθητε
  choice: rijukwa afọ
  rationale: Ọ na-egosi na ha riri ruo mgbe afọ juru ha, n’Igbo nkịtị ma doo anya.
theological_decisions:
- issue: Ihe σημεῖα pụtara n’Oziọma Jọn
  choice: ihe ịrịba ama
  alternative: ọrụ ebube
  rationale: ‘Ihe ịrịba ama’ na-echekwa echiche na ọrụ Jizọs na-arụtụ aka n’onye ọ bụ, kama ime ka okwu ahụ bụrụ naanị ngosipụta ike.
- issue: Ihe Jizọs kwuru banyere ihe kpatara ìgwè mmadụ ji achọ ya
  choice: E chekwara ọdịiche ahụ dịka ‘ọ bụghị n’ihi na ... kama ọ bụ n’ihi na,’ n’enweghị nkọwa agbakwunyere banyere ọnọdụ ime mmụọ ha.
  alternative: Ịkọwa na ha aghọtaghị ihe ịrịba ama ndị ahụ
  rationale: Amaokwu ahụ kwuru na ha achọghị ya n’ihi na ha hụrụ ihe ịrịba ama, ma o kwughị kpọmkwem ụdị nghọta ma ọ bụ enweghị nghọta ha nwere; ntụgharị ahụ ekwesịghị idozi esemokwu ahụ n’ime ederede.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. A họọrọ ‘ogbe achịcha’ iji gosi plural ἄρτων, ‘ihe ịrịba ama’ iji chekwaa okwu Jọn, na ‘rijukwa afọ’ maka okwu nri zuru ezu. Akara nkọwa [a] dị n’ederede bụ isi.
