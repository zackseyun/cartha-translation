- from: 'Jizọs zara ha, sị, “N’ezie, n’ezie, ana m asị unu: unu na-achọ m, ọ bụghị n’ihi na unu hụrụ ihe ịrịba ama, kama ọ bụ n’ihi na unu riri n’ogbe achịcha ndị ahụ, rijukwa afọ[a].”'
  to: 'Jizọs zara ha, sị, “N’ezie, n’ezie, ana m asị unu: unu na-achọ m, ọ bụghị n’ihi na unu hụrụ ihe ịrịba ama, kama ọ bụ n’ihi na unu riri n’achịcha ndị ahụ, afọ jukwara unu[a].”'
