  to: Unu arụla ọrụ maka nri na-emebi emebi, kama rụọnụ ọrụ maka nri na-adịgide ruo ndụ ebighị ebi, nke Nwa nke Mmadụ ga-enye unu; n’ihi na Nna ahụ, bụ́ Chineke, etinyela akara ya n’ahụ Nwa ahụ[a].
