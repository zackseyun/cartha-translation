id: JHN.6.27
reference: John 6:27
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐργάζεσθε μὴ τὴν βρῶσιν τὴν ἀπολλυμένην ἀλλὰ τὴν βρῶσιν τὴν μένουσαν εἰς ζωὴν αἰώνιον, ἣν ὁ υἱὸς τοῦ ἀνθρώπου ὑμῖν δώσει, τοῦτον γὰρ ὁ πατὴρ ἐσφράγισεν ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/027.yaml
  text: Do not work for the food that perishes[a], but for the food that remains to eternal life, which the Son of Man will give to you[b]; for God the Father has set his seal on him.
translation:
  language: ig
  text: Unu arụla ọrụ maka nri na-emebi emebi, kama rụọnụ ọrụ maka nri na-adịgide ruo ndụ ebighị ebi, nke Nwa nke Mmadụ ga-enye unu; n’ihi na Nna ahụ, bụ́ Chineke, etinyela akara ya n’ahụ Nwa ahụ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’asụsụ Grik, okwu a pụtara n’ụzọ nkịtị, “akaraala ya.” Ihe oyiyi a na-egosi na Chineke kwadoro ya ma gosi na ọ bụ onye o nyere ikike.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐργάζεσθε μὴ ... ἀλλὰ
  choice: Unu arụla ọrụ ... kama rụọnụ ọrụ
  rationale: Ụdị a na-egosipụta iwu a machibidoro n’akụkụ mbụ na iwu e nyere n’akụkụ nke abụọ n’Igbo doro anya ma dịkwa mfe nghọta.
- source_word: βρῶσιν
  choice: nri
  rationale: N’ebe a, okwu ahụ pụtara ihe a na-eri, ọ bụghị omume iri ihe.
- source_word: ἀπολλυμένην
  choice: na-emebi emebi
  rationale: Ọ na-egosi nri nke na-emebi ma na-agafe; ọ naghị ekwe ka ihe ọ pụtara bụrụ naanị ire ure.
- source_word: μένουσαν εἰς ζωὴν αἰώνιον
  choice: na-adịgide ruo ndụ ebighị ebi
  rationale: “Na-adịgide” na-echekwa ọdịiche ya na nri na-emebi emebi, ebe “ruo ndụ ebighị ebi” na-egosipụta ebumnuche ma ọ bụ ihe ọ na-eweta n’enweghị ịkọwa njikọ ahụ karịa ihe Grik kwuru.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Nwa nke Mmadụ
  rationale: Nke a na-echekwa aha ahụ Jizọs ji akọwa onwe ya na njikọ Akwụkwọ Nsọ dị n’azụ ya.
- source_word: ὑμῖν δώσει
  choice: ga-enye unu
  rationale: Ọ na-egosipụta ngwaa ọdịnihu na onye a ga-enye ihe ahụ n’Igbo nkịtị.
- source_word: ἐσφράγισεν
  choice: etinyela akara ya n’ahụ ya
  rationale: Ọ na-echekwa ihe atụ nke itinye akara ma na-ada nke ọma n’Igbo; ihe atụ ahụ nwere echiche nkwado na nkwenye.
- source_word: ὁ πατὴρ ... ὁ θεός
  choice: Nna ahụ, bụ́ Chineke
  rationale: Ọ na-echekwa usoro nkọwa nke Grik nke na-akọwapụta Nna ahụ dị ka Chineke, kama ịgbakwunye usoro nkwenkwe karịrị amaokwu ahụ.
theological_decisions:
- issue: Njikọ nke μένουσαν na εἰς ζωὴν αἰώνιον
  choice: nri na-adịgide ruo ndụ ebighị ebi
  alternative: nri na-eduga ná ndụ ebighị ebi
  rationale: Nhọrọ a na-echekwa ma echiche nke ịdịgide ma nghọta sara mbara nke εἰς, na-ekweghị ka nsụgharị kpebie ma ọ bụ naanị ‘na-adịgide ruo’ ka ọ bụ ‘na-eweta/na-eduga ná’ ndụ ebighị ebi.
- issue: Nkọwa apposition ὁ πατὴρ ... ὁ θεός
  choice: Nna ahụ, bụ́ Chineke
  alternative: Chineke bụ Nna
  rationale: Nhọrọ a na-agbaso nhazi Grik nke na-ekwu banyere Nna ahụ ma kọwaa ya dị ka Chineke, n’enweghị ime ka ahịrịokwu ahụ bụrụ nkwupụta izugbe ọzọ.
- issue: Ihe ἐσφράγισεν pụtara banyere Nwa nke Mmadụ
  choice: etinyela akara ya n’ahụ ya
  alternative: akwadowo ya ma gosi na ọ bụ onye eziokwu
  rationale: E chekwara ihe atụ nke akara dị na Grik; nkọwa ọzọ ga-akọwa nkwado ahụ nke ọma ma tufuo ihe oyiyi mbụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “Unu” na ụdị ngwaa ya na-egosi na okwu ahụ bụ nye ọtụtụ mmadụ. E chekwara aha “Nwa nke Mmadụ” na ihe atụ nke akara kama ịtụgharị ha ka ha bụrụ naanị nkọwa.
