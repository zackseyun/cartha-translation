id: JHN.6.60
reference: John 6:60
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Πολλοὶ οὖν ἀκούσαντες ἐκ τῶν μαθητῶν αὐτοῦ εἶπαν· Σκληρός ἐστιν ⸂ὁ λόγος οὗτος⸃· τίς δύναται αὐτοῦ ἀκούειν;
base_translation:
  language: en
  yaml_path: translation/nt/john/006/060.yaml
  text: Therefore many of his disciples[a], when they heard it, said, “This word is hard[b]; who can listen to it?”
translation:
  language: ig
  text: Ya mere, mgbe ọtụtụ n’ime ndị na-eso ụzọ ya nụrụ ya, ha sịrị, “Okwu a siri ike[a]; ònye pụrụ ige ya ntị[b]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Ihe a e kwuru siri ike,” “Ozi a siri ike,” ma ọ bụ “Nkuzi a siri ike.” Okwu Grik λόγος nwere ike ịpụta okwu, ihe e kwuru, ozi, ma ọ bụ nkuzi.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ònye pụrụ ịnụ ya?” Ngwaa Grik a nwere ike ịpụta ịnụ, ige ntị, ma ọ bụ ịṅa ntị na ya/ịnabata ya, dị ka ihe gbara ya gburugburu si dị.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πολλοὶ
  choice: ọtụtụ
  rationale: Ọ na-egosi ọnụ ọgụgụ buru ibu n’etiti ndị na-eso ụzọ ya, ma ọ naghị ekwu na ọ bụ ha niile.
- source_word: οὖν
  choice: Ya mere
  rationale: Ọ na-ejikọta ihe ha kwuru na okwu Jizọs kwuru tupu nke a, ma na-egosi mmepe ma ọ bụ ihe si na ya pụta.
- source_word: ἀκούσαντες
  choice: mgbe ... nụrụ ya
  rationale: Ụdị ngwaa a nwere nghọta oge n’ebe a; ‘mgbe ... nụrụ ya’ bụ Igbo doro anya ma dịkwa mma. ‘Ya’ na-ezo aka n’ihe Jizọs kwuru.
- source_word: ἐκ τῶν μαθητῶν αὐτοῦ
  choice: ọtụtụ n’ime ndị na-eso ụzọ ya
  rationale: ‘N’ime’ na-egosi nke ọma na ndị kwuru okwu a bụ ọtụtụ ndị sitere n’etiti ìgwè ndị na-eso ụzọ ya.
- source_word: Σκληρός
  choice: siri ike
  rationale: Nkebiokwu a nwere ike ịpụta ihe siri ike nghọta, ihe siri ike ịnabata, ma ọ bụ okwu na-akpasu iwe; ‘siri ike’ na-edobe nghọta ndị a n’emebighị nke ọ bụla.
- source_word: ὁ λόγος οὗτος
  choice: Okwu a
  rationale: λόγος n’ebe a na-ezo aka n’okwu, ihe e kwuru, ozi, ma ọ bụ nkuzi a nụrụ. ‘Okwu a’ dị nso n’usoro Grik ma bụrụkwa Igbo nkịtị.
- source_word: τίς δύναται
  choice: ònye pụrụ
  rationale: Ọ bụ ụzọ dị nkenke, dị ùgwù, ma kwekọọ n’ajụjụ banyere ikike mmadụ nwere ime ihe.
- source_word: αὐτοῦ ἀκούειν
  choice: ige ya ntị
  rationale: ἀκούω nwere ike ịpụta ịnụ, ige ntị, ma ọ bụ ịṅa ntị/ịnabata. ‘Ige ya ntị’ na-edobe njikọ ya na ‘nụrụ’ ma na-egosikwa na okwu ahụ metụtara ịnabata ihe a na-ekwu.
theological_decisions:
- issue: Ihe ndị na-eso ụzọ ahụ bu n’obi mgbe ha kwuru na okwu ahụ siri ike
  choice: Nsụgharị ahụ na-egosi na nkuzi Jizọs siri ike ịnabata ma ọ bụ idi, n’ekwughị kpọmkwem ma nsogbu ahụ ọ bụ nke nghọta, nke omume, ma ọ bụ na ọ kpasuru ha iwe.
  alternative: A pụrụ ịkọwa ya naanị dị ka okwu siri ike nghọta, ma ọ bụ naanị dị ka okwu na-akpasu iwe nke a na-apụghị ịnagide.
  rationale: σκληρός nwere obosara nghọta nke gụnyere ịdị ike, ịdị njọ, na ịbụ ihe siri ike ịnabata. ‘Siri ike’ na-echekwa esemokwu na nghọta sara mbara dị n’akwụkwọ mbụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị mfe nghọta ma dị ùgwù. ‘Ndị na-eso ụzọ’ bụ okwu nkịtị maka μαθηταί. E tinyere akara ụda naanị n’ebe ọ na-enyere ọgụgụ aka, dị ka ‘ònye,’ ka ederede ghara ịdị arọ.
