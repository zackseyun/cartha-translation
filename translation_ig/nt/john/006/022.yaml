id: JHN.6.22
reference: John 6:22
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Τῇ ἐπαύριον ὁ ὄχλος ὁ ἑστηκὼς πέραν τῆς θαλάσσης ⸀εἶδον ὅτι πλοιάριον ἄλλο οὐκ ἦν ἐκεῖ εἰ μὴ ⸀ἕν, καὶ ὅτι οὐ συνεισῆλθεν τοῖς μαθηταῖς αὐτοῦ ὁ Ἰησοῦς εἰς τὸ ⸀πλοῖον ἀλλὰ μόνοι οἱ μαθηταὶ αὐτοῦ ἀπῆλθον·
base_translation:
  language: en
  yaml_path: translation/nt/john/006/022.yaml
  text: On the next day[a], the crowd that had been standing on the other side of the sea saw that no other small boat had been there except one, and that Jesus had not gone with his disciples into the boat[b], but that his disciples had gone away alone.
translation:
  language: ig
  text: N’echi ya, ìgwè mmadụ ahụ guzo n’ofe osimiri ahụ hụrụ na ọ dịghị obere ụgbọ mmiri ọzọ dị n’ebe ahụ ma e wezụga otu[a], nakwa na Jizọs esoghị ndị na-eso ụzọ ya banye n’ụgbọ mmiri ahụ[b], kama ọ bụ naanị ndị na-eso ụzọ ya gara.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “ụgbọ mmiri”; okwu Grik πλοιάριον bụ ụdị okwu na-egosi obere ihe.
    reason: lexical_alternative
  - marker: b
    text: Ụfọdụ akwụkwọ aka ochie na mbipụta dị iche n’etiti “obere ụgbọ mmiri” (πλοιάριον) na “ụgbọ mmiri” (πλοῖον) n’amaokwu a; ntụgharị a gbasoro okwu dị na mbipụta Grik e nyere n’akụkụ nke ọ bụla.
    reason: textual_variant
lexical_decisions:
- source_word: Τῇ ἐπαύριον
  choice: N’echi ya
  rationale: Nke a bụ ụzọ Igbo nkịtị si egosi ụbọchị sochirinụ, ma na-edobe njikọ oge nke okwu Grik.
- source_word: ὁ ὄχλος ὁ ἑστηκὼς
  choice: ìgwè mmadụ ahụ nọgidere
  rationale: Okwu nọgidere na-egosi ọnọdụ na-aga n’ihu nke perfect participle ἑστηκώς, n’enweghị ntụgharị siri ike nke na-agaghị ada ka Igbo eke.
- source_word: πέραν τῆς θαλάσσης
  choice: n’ofe osimiri ahụ
  rationale: N’ofe na-egosi ebe dị n’akụkụ nke ọzọ; “osimiri” bụ okwu Igbo a na-ejikarị maka nnukwu mmiri dị ka Oké Osimiri Galili n’ọnọdụ a.
- source_word: εἶδον
  choice: hụrụ ... Ha hụkwara
  rationale: A kewara ahịrịokwu ahụ n’ụzọ dị mfe nghọta n’Igbo, ma a nọgidekwara na-eji echiche ịhụ/mata nke εἶδον maka ὅτι abụọ ahụ.
- source_word: πλοιάριον
  choice: obere ụgbọ mmiri
  rationale: Nke a na-edobe ọdịdị diminutive nke πλοιάριον n’ụzọ doro anya ma bụrụ Igbo eke.
- source_word: ἄλλο οὐκ ἦν ἐκεῖ εἰ μὴ ἕν
  choice: ọ dịghị obere ụgbọ mmiri ọzọ nọ n’ebe ahụ ma e wezụga otu
  rationale: 'Nke a na-edobe nkwụsi ike nke exclusivity: ọ dịghị nke ọzọ ma e wezụga otu.'
- source_word: οὐ συνεισῆλθεν ... εἰς τὸ πλοῖον
  choice: esoghị ... banye n’ụgbọ mmiri ahụ
  rationale: “Esoghị ... banye” na-egosipụta ma mbanye n’ime ụgbọ ahụ ma echiche iso ndị na-eso ụzọ ọnụ.
- source_word: μόνοι ... ἀπῆλθον
  choice: ọ bụ naanị ndị na-eso ụzọ ya gara
  rationale: “Naanị” na-egosi na Jizọs esoghị ha; “gara” bụ ntụgharị dị mfe ma dabara adaba nke ἀπῆλθον n’ọnọdụ a.
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E kewara ogologo usoro Grik ahụ ka ọ bụrụ ahịrịokwu abụọ maka ido anya, n’enweghị iwepụ njikọ echiche ya. Akara ụda dị na “ìgwè” na-enyere aka igbochi mgbagwoju anya, ma ederede ndị ọzọ na-agbaso mkpụrụedemede Igbo nkịtị.
