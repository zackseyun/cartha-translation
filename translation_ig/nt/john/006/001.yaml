source:
  edition: SBLGNT
  text: Μετὰ ταῦτα ἀπῆλθεν ὁ Ἰησοῦς πέραν τῆς θαλάσσης τῆς Γαλιλαίας τῆς Τιβεριάδος.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/001.yaml
  text: After these things[a], Jesus went away to the other side of the Sea of Galilee[b], which is the Sea of Tiberias.
translation:
  language: ig
  text: Mgbe ihe ndị a gasịrị[a], Jizọs gawara n’ofe Oké Osimiri Galili[b], ya bụ, Oké Osimiri Taịbiriọs.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “Mgbe ihe ndị a mechara.” Okwu Grik ahụ kwuru “ihe ndị a” n’ụdị ọtụtụ.
    reason: lexical_alternative
  - marker: b
    text: A na-akpọkwa “Oké Osimiri Galili” “Oké Osimiri Taịbiriọs.” Jọn ji aha abụọ ahụ kọwaa otu mmiri ahụ.
    reason: cultural_note
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: Mgbe ihe ndị a gasịrị
  rationale: Nke a na-edobe ọtụtụ nke ταῦτα (“ihe ndị a”) ma na-ada ka Igbo e ji akọ akụkọ n’ụzọ ebumpụta ụwa.
- source_word: ἀπῆλθεν
  choice: gawara
  rationale: “Gawara” na-egosi na Jizọs hapụrụ ebe ọ nọ gaa ebe ọzọ, dịka ἀπέρχομαι si pụta, n’enweghị itinye nkọwa na-adịghị na Greek.
- source_word: πέραν
  choice: n’akụkụ nke ọzọ nke
  rationale: N’ọnọdụ a, okwu ahụ na-ezo aka n’ịga n’akụkụ nke ọzọ nke mmiri; nsụgharị a doro onye Igbo anya ma na-edobe echiche nke ebe dị n’ofe.
- source_word: θάλασσης
  choice: Osimiri
  rationale: Ọ bụ ezie na mmiri a bụ ọdọ mmiri n’ihe gbasara ọdịdị ala, “Osimiri Galili” bụ aha Akwụkwọ Nsọ ndị na-agụ Igbo maara, ọ na-ekwekọkwa n’iji θάλασσα kpọọ ya.
- source_word: τῆς Γαλιλαίας
  choice: Galili
  rationale: “Osimiri Galili” bụ usoro aha dị mfe ma bụrụ nke a maara nke ọma n’Igbo.
- source_word: τῆς Τιβεριάδος
  choice: ya bụ, Osimiri Taịbirias
  rationale: Greek tinyere aha nke abụọ n’akụkụ aha mbụ. “Ya bụ” na-eme ka o doo anya na Galili na Taịbirias bụ aha abụọ nke otu mmiri ahụ, na-enweghị ime ka ha bụrụ mmiri abụọ.
