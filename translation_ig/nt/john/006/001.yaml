translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. A họọrọ “gawara n’akụkụ nke ọzọ” ka ọ bụrụ okwu ebumpụta ụwa maka njem ruo n’ofe mmiri, ma debe aha ọdịnala “Osimiri Galili.”
