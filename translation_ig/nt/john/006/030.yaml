- from: Ya mere, ha sịrị ya, “Oleezi ihe ịrịba ama ị na-eme, ka anyị wee hụ ya ma kwere gị[a]? Olee ọrụ ị na-arụ?”
  to: Ya mere, ha sịrị ya, “Oleezi ihe ịrịba ama ị na-eme, ka anyị wee hụ ya ma kwere gị[a]? Olee ọrụ ị na-arụ?”
  rationale: The verse itself requires no change. The footnote is revised to give a natural Igbo explanation of the Greek dative and accurately distinguish it from the common Johannine πιστεύω εἰς construction, without the misleading phrase “ikwere n’ime.”
