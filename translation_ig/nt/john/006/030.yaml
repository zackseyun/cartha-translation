  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἶπον οὖν αὐτῷ· Τί οὖν ποιεῖς σὺ σημεῖον, ἵνα ἴδωμεν καὶ πιστεύσωμέν σοι; τί ἐργάζῃ;
base_translation:
  language: en
  yaml_path: translation/nt/john/006/030.yaml
  text: So they said to him[a], “Then what sign are you doing, so that we may see and believe you? What work are you doing?”
translation:
  language: ig
  text: Ya mere, ha sịrị ya, “Oleezi ihe ịrịba ama ị na-eme, ka anyị wee hụ ya ma kwere gị[a]? Olee ọrụ ị na-arụ?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “kwere na gị” ma ọ bụ “tụkwasị gị obi.” N’ụzọ nkịtị, Grik kwuru, “kwere gị,” ma jiri nnọchiaha dị na ọnọdụ dative, ọ bụghị usoro Jọn na-ejikarị, “kwere na [mmadụ].”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπον οὖν αὐτῷ
  choice: Ya mere, ha sịrị ya
  rationale: “Ya mere” na-egosi njikọ nke οὖν na ihe e kwuru tupu ya, ebe “ha sịrị ya” na-enye okwu Grik ahụ n’ụzọ Igbo doro anya ma dị mfe.
- source_word: Τί οὖν
  choice: Oleezi
  rationale: Mgbakwunye “-zi” na-ajụ ihe ga-esochi ma na-echekwa ike nke οὖν nke ugboro abụọ n’ụzọ Igbo ebumpụta ụwa.
- source_word: ποιεῖς σὺ σημεῖον
  choice: ihe ịrịba ama ị na-eme
  rationale: “Ihe ịrịba ama” na-echekwa okwu Jọn ji maka σημεῖον n’ebughị ụzọ kọwaa ya naanị dị ka ọrụ ebube; “ị na-eme” na-egosipụta ajụjụ ha na-ajụ banyere ihe Jizọs ga-eme.
- source_word: ἵνα ἴδωμεν καὶ πιστεύσωμέν σοι
  choice: ka anyị wee hụ ya ma kwere gị[a]
  rationale: “Ka anyị wee” na-egosi ebumnuche nke ἵνα na ngwaa subjunctive. “Ya” na-ezo aka n’ihe ịrịba ama ahụ ka ahịrịokwu bụrụ Igbo doro anya. “Kwere gị” na-echekwa ụdị πιστεύω tinyere nnọchiaha dative, kama ịgbanwe ya ozugbo ka ọ bụrụ okwu Jọn na-ejikarị akọwa ikwere n’ime mmadụ.
- source_word: τί ἐργάζῃ
  choice: Olee ọrụ ị na-arụ?
  rationale: “Ị na-arụ ọrụ” na-egosipụta echiche ἐργάζομαι nke ịrụ ma ọ bụ ịrụpụta ọrụ, ma na-edobe ntakịrị ọdịiche ya na ποιεῖς (“ị na-eme”) nke dị n’ajụjụ mbụ.
theological_decisions:
- issue: Ihe πιστεύω tinyere dative σοι pụtara
  choice: kwere gị
  alternative: kwere na gị; tụkwasị gị obi
  rationale: Grik ji nnọchiaha dative σοι, ọ bụghị usoro εἰς tinyere accusative nke Jọn na-ejikarị eme ihe maka “ikwere n’ime.” Ya mere, ederede bụ isi na-ahapụ echiche ahụ dịka “kwere gị,” ebe nkọwa ala peeji na-echekwa ụzọ ndị ọzọ a pụrụ isi ghọta ya.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta mee ntụgharị a. “Oleezi” na-enye ajụjụ ahụ ike mkparịta ụka kwesịrị ekwesị, ebe “ihe ịrịba ama” na-echekwa okwu pụrụ iche Jọn ji n’akụkọ ya.
