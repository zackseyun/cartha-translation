review_pass:
  verdict: revise
  source_fidelity: The main text accurately represents the two occurrences of οὖν, the present-tense questions, σημεῖον as “ihe ịrịba ama,” the purpose clause, and the distinct dative construction πιστεύσωμεν σοι. Supplying “ya” after “hụ” makes the implied sign explicit and is a natural, non-substantive clarification in Igbo.
  naturalness: The verse is clear, idiomatic Standard Igbo. “Oleezi” effectively conveys the pressing “what then?” and “ọrụ ị na-arụ” naturally preserves the work-oriented nuance of ἐργάζῃ. The footnote needs smoother wording and should not describe Johannine πιστεύω εἰς as “ikwere n’ime,” which is not the natural Igbo expression.
  terminology: “Ihe ịrịba ama” appropriately retains Johannine sign language without prematurely interpreting it as a miracle. “Kwere gị” preserves the dative force (believe someone/believe what someone says), while the note can give “kwere na gị” and “tụkwasị gị obi” as alternatives.
  issues:
  - severity: medium
    issue: The footnote renders the usual Johannine alternative as “ikwere n’ime.”
    rationale: This is neither a natural Standard Igbo expression for “believe in” nor a suitable description of the Greek εἰς construction. It may mislead readers about both the Igbo and Greek. The contrast should be stated as “kwere na [mmadụ],” without importing “n’ime.”
  - severity: low
    issue: The footnote’s phrase “ihe e kwuru n’ụzọ kacha nso” is awkward.
    rationale: A direct statement such as “N’ụzọ nkịtị, Grik kwuru…” is clearer and more natural in this explanatory register.
  revised_text: Ya mere, ha sịrị ya, “Oleezi ihe ịrịba ama ị na-eme, ka anyị wee hụ ya ma kwere gị[a]? Olee ọrụ ị na-arụ?”
  revised_footnotes:
