source:
  edition: SBLGNT
  text: εἰδὼς δὲ ὁ Ἰησοῦς ἐν ἑαυτῷ ὅτι γογγύζουσιν περὶ τούτου οἱ μαθηταὶ αὐτοῦ εἶπεν αὐτοῖς· Τοῦτο ὑμᾶς σκανδαλίζει;
base_translation:
  language: en
  yaml_path: translation/nt/john/006/061.yaml
  text: But Jesus[a], knowing in himself that his disciples were grumbling about this, said to them, “Does this offend you?"
translation:
  language: ig
  text: Ma Jizọs maara n’ime onwe ya na ndị na-eso ụzọ ya na-atamu ntamu banyere nke a, sị ha, “Nke a ọ na-akpasu unu iwe[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Nke a ọ na-eme ka unu sụọ ngọngọ?”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδὼς
  choice: matara
  rationale: Na Igbo akụkọ, “matara” na-egosi na Jizọs maara ihe ahụ n’oge ahụ, ma na-eme ka ahịrịokwu dị mfe ma bụrụ nke e ji eme ihe ugbu a.
- source_word: ἐν ἑαυτῷ
  choice: n’ime onwe ya
  rationale: Nke a na-echekwa echiche na Jizọs maara ya n’ime onwe ya, ọ bụghị n’ihi na mmadụ gwara ya.
- source_word: γογγύζουσιν
  choice: nọ na-atamu ntamu
  rationale: “Ịtamu ntamu” na-egosi mkpesa a na-ekwu nwayọọ nwayọọ n’enweghị afọ ojuju, dịka okwu Grik ahụ si dị.
- source_word: περὶ τούτου
  choice: banyere nke a
  rationale: Ọ na-ezo aka n’okwu Jizọs kwuru tupu nke a n’etinyeghị nkọwa ọzọ na-adịghị n’ederede.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: ndị na-eso ụzọ ya
  rationale: Nke a bụ ụzọ Igbo doro anya si akọ μαθηταί, ma ọ naghị eme ka ha bụrụ naanị ndịozi iri na abụọ ahụ.
- source_word: Τοῦτο
  choice: Nke a
  rationale: A hapụrụ okwu nrụtụ aka ahụ nkenke dịka ọ dị na Grik, n’etinyeghị “ozizi” ma ọ bụ “okwu” n’ederede.
- source_word: σκανδαλίζει
  choice: na-ewute
  rationale: N’ebe a, okwu ahụ nwere ike ịpụta ime ka iwe ma ọ bụ ịsọ oyi bilie n’obi; okwu nkọwa ala peeji na-echekwa echiche siri ike karị nke ime ka mmadụ sụọ ngọngọ ma dapụ.
theological_decisions:
- issue: Ihe σκανδαλίζει pụtara n’ọnọdụ ebe ndị na-eso ụzọ nwere ike ịjụ okwu Jizọs
  choice: Nke a ọ na-ewute unu?
  alternative: Nke a ọ na-eme ka unu sụọ ngọngọ?
  rationale: Okwu Grik ahụ nwere ma echiche nke iwe ma ọ bụ ịsọ oyi n’obi, ma echiche miri emi nke ihe na-eme ka mmadụ sụọ ngọngọ wee dapụ n’okwukwe. Isi ederede ji okwu Igbo dị mfe, ebe nkọwa ala peeji na-echekwa ihe atụ ahụ na esemokwu nkà mmụta okpukpe dị na ya.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke oge a, dị ugwu ma dị mfe nghọta. “Ịtamu ntamu” na-echekwa ụda mkpesa zoro ezo; “ndị na-eso ụzọ” bụ okwu a na-aghọta nke ọma maka μαθηταί.
