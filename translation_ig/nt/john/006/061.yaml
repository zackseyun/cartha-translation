revisions:
- from: Ma Jizọs matara n’ime onwe ya na ndị na-eso ụzọ ya nọ na-atamu ntamu banyere nke a. Ọ sịrị ha, “Nke a ọ na-ewute unu[a]?”
  to: Ma Jizọs maara n’ime onwe ya na ndị na-eso ụzọ ya na-atamu ntamu banyere nke a, sị ha, “Nke a ọ na-akpasu unu iwe[a]?”
  rationale: The revision replaces a perfective form that can suggest acquisition of knowledge with the stative “maara,” and replaces an overly pain-oriented rendering of σκανδαλίζει with idiomatic Igbo for being offended. The alternative footnote continues to preserve the verb’s stumble/cause-to-fall metaphor and its theological force without resolving the ambiguity.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T06:21:16Z'
review_pass:
  verdict: revise
  source_fidelity: The draft conveys Jesus’ inward awareness, the disciples’ dissatisfied muttering, and the closing question. However, “matara” commonly suggests coming to know or having found out, whereas εἰδὼς here presents Jesus as knowing. “Maara” is the more faithful, unmarked choice. “Na-ewute unu” primarily means hurting or saddening you and is not an adequate main-text equivalent for σκανδαλίζει in this question.
  naturalness: “Ndị na-eso ụzọ ya na-atamu ntamu” and “n’ime onwe ya” are natural Standard Igbo in this context. Keeping the verse as one sentence more closely reflects the Greek participial construction and reads smoothly. “Na-akpasu unu iwe” is a more idiomatic rendering of the main sense ‘offend’ than “na-ewute unu.”
  terminology: “Ndị na-eso ụzọ” appropriately renders μαθηταί without restricting the referent to the Twelve. The footnote’s “mee ka unu sụọ ngọngọ” preserves the σημαντικό metaphor of σκανδαλίζει without forcing the stronger sense into the main text.
  issues:
  - severity: medium
    issue: “matara” renders εἰδὼς
    rationale: “Matara” can imply that Jesus came to know the matter. The Greek describes him as already/inwardly knowing; “maara” better preserves this.
  - severity: medium
    issue: “na-ewute unu” renders σκανδαλίζει
    rationale: This wording normally denotes causing pain or sadness. In this context the verb concerns offense and potentially being caused to stumble; “na-akpasu unu iwe” is a natural main-text rendering of the former, while the footnote retains the latter.
  revised_text: Ma Jizọs maara n’ime onwe ya na ndị na-eso ụzọ ya na-atamu ntamu banyere nke a, sị ha, “Nke a ọ na-akpasu unu iwe[a]?”
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “Nke a ọ na-eme ka unu sụọ ngọngọ?”
    reason: lexical_alternative
  revision_rationale: The revision replaces a perfective form that can suggest acquisition of knowledge with the stative “maara,” and replaces an overly pain-oriented rendering of σκανδαλίζει with idiomatic Igbo for being offended. The alternative footnote continues to preserve the verb’s stumble/cause-to-fall metaphor and its theological force without resolving the ambiguity.
