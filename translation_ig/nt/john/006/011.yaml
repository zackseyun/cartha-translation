  text: ἔλαβεν ⸀οὖν τοὺς ἄρτους ὁ Ἰησοῦς καὶ εὐχαριστήσας ⸀διέδωκεν τοῖς ἀνακειμένοις, ὁμοίως καὶ ἐκ τῶν ὀψαρίων ὅσον ἤθελον.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/011.yaml
  text: So Jesus took the loaves[a], and after giving thanks he distributed them to those who were reclining; likewise also from the fish[b], as much as they wanted.
translation:
  language: ig
  text: Ya mere, Jizọs weere ogbe achịcha ndị ahụ, mgbe o nyechara ekele, o kesara ha ndị ahụ tọgbọ n’akụkụ[a]. N’otu aka ahụ kwa, o kesara ha azụ̀ ndị ahụ[b] ruo ókè ha chọrọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị ahụ nọdụrụ ala.” N’asụsụ Grik, okwu ahụ pụtara n’ụzọ kpọmkwem “ndị ahụ tọgbọ n’akụkụ,” bụ́ ọnọdụ ndị mmadụ na-anọkarị mgbe ha na-eri nri n’oge ahụ.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “azụ̀ nta ndị ahụ.” Okwu Grik a nwere ike izo aka n’azụ̀ a na-eri na achịcha, ikekwe azụ̀ nta.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Ya mere
  rationale: Ọ na-egosi njikọ na ọganihu nke akụkọ ahụ; “Ya mere” bụ okwu Igbo doro anya ma dịkwa mma n’ọnọdụ a.
- source_word: τοὺς ἄρτους
  choice: ogbe achịcha ndị ahụ
  rationale: Ụdị ọtụtụ nke ἄρτος n’akụkọ a na-ezo aka n’ogbe achịcha dị iche iche, ọ bụghị naanị achịcha n’ozuzu.
- source_word: εὐχαριστήσας
  choice: mgbe o nyechara ekele
  rationale: Ọ na-egosi ihe Jizọs buru ụzọ mee tupu o kesaa achịcha ahụ, ma ọ naghị atụkwasị onye ọ kelere n’ebe Grik ekwughị ya kpọmkwem.
- source_word: διέδωκεν
  choice: o kesara ha
  rationale: “Kesara” na-egosipụta ikesa ihe ahụ n’etiti ìgwè mmadụ, dị ka ngwaa Grik si pụta.
- source_word: τοῖς ἀνακειμένοις
  choice: ndị ahụ dabere n’akụkụ na-eri nri
  rationale: Nke a na-edobe echiche nke ọnọdụ mmadụ na-adabere n’akụkụ mgbe ọ na-eri nri, kama ime ya naanị “ịnọdụ ala.”
- source_word: ὁμοίως καὶ
  choice: O sikwa … kesara ha otu ahụ
  rationale: Nhazi a na-egosipụta myirịta siri ike dị n’etiti ikesa achịcha na ikesa azụ, n’ụzọ Igbo na-aga were were.
- source_word: ἐκ τῶν ὀψαρίων
  choice: n’azụ̀ ndị ahụ
  rationale: “Azụ̀” bụ ntụgharị nkịtị nke dabara n’ebe a; a hapụrụ ajụjụ ma ha bụ azụ nta ka nkọwa ala peeji kọwaa ya.
- source_word: ὅσον ἤθελον
  choice: nye ha ihe ha chọrọ
  rationale: Nke a na-egosi na ndị mmadụ natara azụ ruo n’ókè ha chọrọ, n’asụsụ Igbo dị mfe nghọta.
theological_decisions:
- issue: εὐχαριστήσας nwere ike ime ka mmadụ cheta Oriri Nsọ
  choice: “nyechara ekele” n’enweghị nkọwa gbasara sakrament
  alternative: “gọziri” ma ọ bụ ịkọwa njikọ ya na Oriri Nsọ kpọmkwem
  rationale: Ngwaa Grik pụtara inye ekele. Ọ bụ ezie na akụkọ ahụ nwere ike inwe ụda na-echetara Oriri Nsọ, ekwesịghị itinye nkọwa okpukpe ahụ n’ime okwu amaokwu n’onwe ya.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E debere ọnọdụ iri nri nke ụwa oge ochie n’ahịrị bụ isi, ma tinye ụzọ ntụgharị dị mfe karị n’ala peeji. Akara ụda dị mkpa dị na “azụ̀” iji gbochie mgbagwoju anya na okwu “azụ.”
