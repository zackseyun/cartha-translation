  source_fidelity: A chọrọ imezi obere ma dị mkpa n’akụkụ azụ̀. Nkebi ikpeazụ nke draft, “nye ha ihe ha chọrọ,” pụtara na o nyere ha ihe ọ bụla ha chọrọ; ma Grik ὅσον ἤθελον na-ekwu ókè azụ̀ ha chọrọ. “Ruo ókè ha chọrọ” na-edobe nke a. E mekwara ka ntụgharị nke τοῖς ἀνακειμένοις bụrụ nke doro anya karị dịka ọnọdụ iri nri.
  naturalness: “O sikwa n’azụ̀ ndị ahụ kesara ha otu ahụ” adịghị aga were were nke ọma n’Igbo. “N’otu aka ahụ kwa, o kesara ha azụ̀ ndị ahụ ruo ókè ha chọrọ” bụ ahịrị Igbo eke ma na-egosikwa myirịta ahụ nke ọma.
  terminology: “Jizọs,” “ogbe achịcha,” “inye ekele,” na “azụ̀” dabara adaba. “Ndị ahụ tọgbọ n’akụkụ” na-edobe echiche nke iri nri n’ọnọdụ ịdaba azụ karịa “ndị ahụ nọdụrụ ala,” nke a na-enye dịka ụzọ ọzọ n’ala peeji.
