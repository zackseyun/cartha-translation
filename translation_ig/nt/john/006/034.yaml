  text: εἶπον οὖν πρὸς αὐτόν· Κύριε, πάντοτε δὸς ἡμῖν τὸν ἄρτον τοῦτον.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/034.yaml
  text: So they said to him[a], “Lord, always give us this bread.”
translation:
  language: ig
  text: Ya mere, ha sịrị ya, “Onyenweanyị[a], nye anyị achịcha a mgbe niile.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Nna ukwu, nye anyị achịcha a mgbe niile.” N'Grik, aha a pụrụ ịbụ okwu nkwanye ùgwù e ji akpọ mmadụ, ọ pụkwara ịpụta “Onyenweanyị.”
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπον
  choice: ha sịrị
  rationale: Oge aorist nke λέγω na-akọ okwu ha kwuru n'ụzọ nkịtị; “ha sịrị” bụ Igbo doro anya maka mkparịta ụka.
- source_word: οὖν
  choice: Ya mere
  rationale: Ọ na-ejikọta arịrịọ a na mkparịta ụka gara aga ma na-egosi ihe ha kwuru n'ihi ya.
- source_word: πρὸς αὐτόν
  choice: ya
  rationale: N'azụ ngwaa ikwu okwu, πρός na-egosi onye a gwara okwu; n'Igbo, “ha sịrị ya” bụ usoro okwu ebumpụta ụwa.
- source_word: Κύριε
  choice: Onyenwe anyị
  rationale: Ọ na-edobe ohere pụtara ma “Onyenwe anyị” ma okwu nkwanye ùgwù e ji akpọ mmadụ; nkọwa ala peeji na-egosi ụzọ nke abụọ.
- source_word: πάντοτε
  choice: mgbe niile
  rationale: Ọ na-egosi inye na-aga n'ihu ma ọ bụ n'oge niile.
- source_word: δὸς
  choice: na-enye
  rationale: N'agbanyeghị na δὸς bụ iwu aorist, πάντοτε na-eme ka arịrịọ ahụ bụrụ maka inye ihe ugboro ugboro; “na-enye” na-egosipụta nke a n'Igbo nke ọma.
- source_word: ἡμῖν
  choice: anyị
  rationale: Ọ bụ onye nnata ihe a na-arịọ ka e nye.
- source_word: τὸν ἄρτον τοῦτον
  choice: achịcha a
  rationale: “Achịcha” bụ okwu Igbo kwesịrị ekwesị maka ἄρτος, ebe “a” na-edobe ike ngosipụta nke τοῦτον na njikọ ya na achịcha a ka a na-ekwu maka ya.
theological_decisions:
- issue: Nsụgharị κύριος mgbe a na-agwa Jizọs okwu kpọmkwem
  choice: Onyenwe anyị
  alternative: Nna anyị ukwu
  rationale: “Onyenwe anyị” na-edobe ịdị omimi nke aha ahụ nke nwere ike ịbụ nkwanye ùgwù ma ọ bụ nwee nghọta miri emi banyere onye Jizọs bụ. Ebe ìgwè mmadụ nwere ike iji ya naanị dịka okwu nkwanye ùgwù, e debere nke ahụ na nkọwa ala peeji kama idozi ihe mgbagwoju anya ahụ n'ime amaokwu.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. Usoro “ha sịrị ya” bụ nke ebumpụta ụwa; “na-enye ... mgbe niile” na-egosipụta arịrịọ maka inye na-aga n'ihu.
