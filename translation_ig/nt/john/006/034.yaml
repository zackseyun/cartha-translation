- from: Ya mere, ha sịrị ya[a], “Onyenwe anyị, na-enye anyị achịcha a mgbe niile.”
  to: Ya mere, ha sịrị ya, “Onyenweanyị[a], nye anyị achịcha a mgbe niile.”
  rationale: The revision restores the direct imperative force of δὸς with “nye,” retains the ongoing sense of πάντοτε with “mgbe niile,” moves the note marker to the title it explains, and removes the possessive addition from the alternative respectful address. It retains the source’s ambiguity concerning Κύριε without imposing a doctrinal interpretation.
  reviewer_model: gpt-5.6-terra
