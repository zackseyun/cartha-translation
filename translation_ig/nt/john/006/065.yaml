source:
  edition: SBLGNT
  text: καὶ ἔλεγεν· Διὰ τοῦτο εἴρηκα ὑμῖν ὅτι οὐδεὶς δύναται ἐλθεῖν πρός με ἐὰν μὴ ᾖ δεδομένον αὐτῷ ἐκ τοῦ ⸀πατρός.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/065.yaml
  text: And he was saying[b][a], “For this reason I have told you that no one is able to come to me unless it has been given to him from the Father.”
translation:
  language: ig
  text: Ọ nọ na-ekwu, sị, “Ọ bụ n’ihi nke a ka m gwara unu na ọ dịghị onye pụrụ ịbịakwute m ma ọ bụghị na e nyela ya site n’aka Nna.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγεν
  choice: Ọ nọkwa na-asị
  rationale: Oge imperfect na-egosi okwu na-aga n’ihu n’ime mkparịta ụka ahụ; ‘ọ nọ na-asị’ na-echekwa akụkụ a n’Igbo eke.
- source_word: Διὰ τοῦτο
  choice: Ọ bụ n’ihi nke a
  rationale: Nkebiokwu a na-atụ aka n’ihe e kwuru tupu ya ma na-ebute nkọwa ihe mere Jizọs ji kwuo okwu ahụ.
- source_word: εἴρηκα ὑμῖν
  choice: ka m gwara unu
  rationale: Oge perfect na-ezo aka n’ihe e kwurula nke ka dị mkpa ugbu a; usoro Igbo a bụ nke eke ma na-echekwa ntụaka ahụ.
- source_word: οὐδεὶς δύναται
  choice: ọ dịghị onye pụrụ
  rationale: Nke a na-egosi enweghị ike, ọ bụghị naanị enweghị ikike; ‘pụrụ’ na-enye echiche ahụ nke ọma.
- source_word: ἐλθεῖν πρός με
  choice: ịbịakwute m
  rationale: ‘Ịbịakwute m’ bụ okwu Igbo doro anya ma na-echekwa ma ngagharị ma echiche mmekọrịta dị n’okwu Jọn.
- source_word: ἐὰν μὴ ᾖ δεδομένον αὐτῷ
  choice: ma ọ bụrụ na e nyeghị ya nke ahụ
  rationale: A hapụrụ passive ahụ ka ọ dị, ma tinye ‘nke ahụ’ iji mee ka ihe e nyere, ya bụ ikike ịbịakwute Jizọs, doo anya n’usoro Igbo n’enweghị ịkọwa ya karịa isi mmalite.
- source_word: ἐκ τοῦ πατρός
  choice: site n’aka Nna
  rationale: Nke a na-egosi na Nna bụ isi mmalite nke onyinye ahụ, kwekọrọ na ἐκ, ma bụrụkwa okwu Igbo eke.
theological_decisions:
- issue: Ike Chineke na ikike mmadụ ịbịakwute Jizọs
  choice: A sụgharịrị ya dị ka enweghị ike ịbịakwute Jizọs ma e wezụga mgbe ihe ahụ sitere n’aka Nna.
  alternative: Ịkọwa onyinye ahụ kpọmkwem dị ka amara na-arụpụta nzaghachi n’enweghị mgbagha, ma ọ bụ dị ka amara e nyere mmadụ niile tupu okwukwe.
  rationale: Grik na-ekwu hoo haa na ihe Nna nyere bụ ọnọdụ dị mkpa, ma amaokwu a n’onwe ya akọwaghị ụdị, oke, ma ọ bụ otú onyinye ahụ si arụ ọrụ. Ya mere, nsụgharị ahụ anaghị edozi esemokwu okpukpe e mesịrị.
- issue: Masculine singular αὐτῷ nwere nghọta izugbe
  choice: e nyeghị ya
  alternative: e nyeghị onye ahụ
  rationale: ‘Ya’ n’Igbo nwere ike izo aka n’otu onye n’enweghị ịkọ nwoke ma ọ bụ nwaanyị; ọ na-echekwa singular izugbe nke isi mmalite n’enweghị itinye okike nke asụsụ Igbo anaghị amanye.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke ugbu a, dị ùgwù ma dị mfe nghọta. E jighị okwu ụka pụrụ iche nke otu denomination. Enweghị footnote dị mkpa, n’ihi na ‘ya’ bụ singular na-enweghị akara okike, ebe ‘site n’aka Nna’ na-echekwa echiche isi mmalite nke ἐκ.
