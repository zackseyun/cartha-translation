revisions:
- from: Ọ nọkwa na-asị, “Ọ bụ n’ihi nke a ka m gwara unu na ọ dịghị onye pụrụ ịbịakwute m ma ọ bụrụ na e nyeghị ya nke ahụ site n’aka Nna.”
  to: Ọ nọ na-ekwu, sị, “Ọ bụ n’ihi nke a ka m gwara unu na ọ dịghị onye pụrụ ịbịakwute m ma ọ bụghị na e nyela ya site n’aka Nna.”
  rationale: 'The exception clause has been corrected from a negative perfect passive to a positive perfect passive, thereby restoring the source meaning: no one is able to come unless something has been given to that person from the Father. The object remains unstated in Igbo, matching the Greek’s neuter passive construction and avoiding an interpretive specification. The opening has been lightly adjusted for a natural narrative imperfect without a potentially unnecessary additive nuance.'
