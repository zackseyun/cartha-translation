review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents the discourse connective, Jesus' prior statement, human inability, coming to Jesus, and the Father as the source. However, “ma ọ bụrụ na e nyeghị ya nke ahụ” means “if it has not been given to him,” reversing the condition expressed by ἐὰν μὴ ᾖ δεδομένον αὐτῷ (“unless it has been given to him”).
  naturalness: The proposed revision uses standard, clear Igbo. “Ma ọ bụghị na e nyela ya site n’aka Nna” idiomatically expresses the necessary exception while leaving the granted thing implicit, as it is in the Greek.
  terminology: “Nna” appropriately reflects the Johannine title ὁ πατήρ. “Pụrụ” accurately expresses ability. The impersonal passive “e nyela ya” preserves the Greek passive without adding a theological explanation.
  issues:
  - severity: high
    issue: The negative verb form reverses the meaning of the exception clause.
    rationale: “E nyeghị ya” is negative (“has not been given to him”). Following “ma ọ bụrụ na,” it makes the sentence say that coming is possible only if something has not been given, whereas the Greek says it is possible only if it has been given.
  - severity: low
    issue: “Nọkwa” can suggest additive “also,” stronger than the narrative καί requires.
    rationale: Replacing it with “Ọ nọ na-ekwu, sị” retains the imperfective discourse setting without unnecessarily adding an ‘also’ nuance.
  revised_text: Ọ nọ na-ekwu, sị, “Ọ bụ n’ihi nke a ka m gwara unu na ọ dịghị onye pụrụ ịbịakwute m ma ọ bụghị na e nyela ya site n’aka Nna.”
  revised_footnotes: []
  revision_rationale: 'The exception clause has been corrected from a negative perfect passive to a positive perfect passive, thereby restoring the source meaning: no one is able to come unless something has been given to that person from the Father. The object remains unstated in Igbo, matching the Greek’s neuter passive construction and avoiding an interpretive specification. The opening has been lightly adjusted for a natural narrative imperfect without a potentially unnecessary additive nuance.'
