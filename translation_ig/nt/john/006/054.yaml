id: JHN.6.54
reference: John 6:54
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ τρώγων μου τὴν σάρκα καὶ πίνων μου τὸ αἷμα ἔχει ζωὴν αἰώνιον, κἀγὼ ἀναστήσω αὐτὸν τῇ ἐσχάτῃ ἡμέρᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/054.yaml
  text: The one who eats my flesh and drinks my blood has eternal life[b][a], and I will raise him up on the last day.
translation:
  language: ig
  text: Onye na-eri anụ ahụ m[a] ma na-aṅụ ọbara m nwere ndụ ebighị ebi, mụ onwe m ga-akpọlite ya n'ụbọchị ikpeazụ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “onye na-ata anụ ahụ m.” Ngwaa Grik τρώγω siri ike ma doo anya karịa okwu nkịtị maka iri nri; ọ pụrụ ịpụta ịta ma ọ bụ ịna-eri ihe.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụ ya, “m ga-akpọlite ya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ τρώγων
  choice: Onye na-eri
  rationale: Nkebiokwu a na-akọwa otu onye e ji omume a mara; “Onye na-eri” na-edobe onye otu na omume na-aga n'ihu n'ụzọ Igbo si ekwu ya nke ọma.
- source_word: τρώγων
  choice: na-eri
  rationale: Ọ na-edobe okwu iri n'ụzọ doro anya ma ghara ịkọwa ya ozugbo dịka ihe oriri nsọ ma ọ bụ dịka naanị ihe atụ; ihe okwu Grik pụtara nke siri ike karị ka e debere n'okpuru ala.
- source_word: μου τὴν σάρκα
  choice: anụ ahụ m
  rationale: “Anụ ahụ” na-egosi σάρξ n'ụzọ nkịtị n'okwu a, kama ịgbanwe ya ka ọ bụrụ “ahụ m” ma ọ bụ tinye nkọwa okpukpe n'ime ya.
- source_word: καὶ πίνων μου τὸ αἷμα
  choice: ma na-aṅụ ọbara m
  rationale: A na-edobe myiri dị n'etiti omume abụọ na-aga n'ihu, a hapụkwara “ọbara” ka ọ bụrụ okwu nkịtị nke ederede ahụ ji.
- source_word: ἔχει
  choice: nwere
  rationale: Oge ugbu a nke “nwere” na-egosi na onye ahụ nwere ndụ a ugbu a, dịka ngwaa Grik si kwuo.
- source_word: ζωὴν αἰώνιον
  choice: ndụ ebighị ebi
  rationale: Nke a bụ okwu Igbo doro anya ma guzosie ike maka ndụ na-adịru ebighị ebi nke Jọn na-ekwu maka ya.
- source_word: κἀγὼ
  choice: mụ onwe m ... kwa
  rationale: “Mụ onwe m” na-edobe nkwusi ike dị na ἐγώ, ebe “kwa” na-eburu njikọ καί n'ụzọ Igbo na-asụkarị.
- source_word: ἀναστήσω αὐτὸν
  choice: ga-akpọlitekwa ya
  rationale: “Ịkpọlite” na-egosi ime ka onye nwụrụ anwụ bilie n'enweghị ịgbatị okwu ahụ karịa ihe Grik kwuru; “ya” na-ezo aka n'otu onye ahụ a kpọrọ aha na mbido.
- source_word: τῇ ἐσχάτῃ ἡμέρᾳ
  choice: n'ụbọchị ikpeazụ
  rationale: Nke a bụ ụzọ Igbo dị mfe ma kwesị ekwesị isi kwuo okwu Jọn a banyere ụbọchị ikpeazụ.
theological_decisions:
- issue: Ma a ga-akọwa iri anụ ahụ na ịṅụ ọbara dịka Oriri Nsọ ma ọ bụ dịka ihe atụ nke ikwere
  choice: E debere okwu iri, anụ ahụ, ịṅụ, na ọbara n'ụzọ nkịtị
  alternative: Ịkọwa ya kpọmkwem dịka Oriri Nsọ, ma ọ bụ dochie ya na okwu gbasara ikwere
  rationale: Ederede Grik ji okwu ndị a kpọmkwem. Ịhapụ ha otu a na-edobe esemokwu na nghọta dị iche iche dị na nkà mmụta okpukpe n'etinyeghị ozizi otu ụka n'ime ntụgharị.
- issue: Otu e si egosi αὐτόν nke na-ezo aka n'otu onye
  choice: ya
  alternative: onye ahụ
  rationale: “Ya” bụ nnọchiaha Igbo nkịtị nke na-edobe ntụaka nye otu onye ahụ n'ebugharịghị okwu ahụ gaa n'ọtụtụ mmadụ ma ọ bụ tinye okike nwoke ebe usoro nnọchiaha Igbo anaghị egosi ya.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. A hapụrụ asụsụ anụ ahụ na ọbara n'ụzọ pụtara ihe kpọmkwem, a naghịkwa edozi ya dịka ozizi otu ụka. E debere akara ụda olu ebe ọ dị mkpa, dịka “aṅụ.”
