- from: Ya mere, Jizọs sịrị ha, “N’ezie, n’ezie, ana m asị unu, ọ bụrụ na unu erighị anụ ahụ[a] nke Nwa nke Mmadụ ma ṅụọ ọbara ya, unu enweghị ndụ n’ime onwe unu.[b]”
  to: Ya mere, Jizọs sịrị ha, “N’ezie, n’ezie, ana m asị unu, ọ gwụla ma unu rie anụ ahụ[a] nke Nwa nke Mmadụ ma ṅụọ ọbara ya, unu enweghị ndụ[b] n’ime onwe unu.”
  rationale: The revision removes ambiguity in the conditional while retaining the literal, deliberately vivid eating-and-drinking language. It makes no sacramental or metaphorical interpretation and retains “ndụ” without importing “ndụ ebighị ebi.”
