source:
  edition: SBLGNT
  text: εἶπεν οὖν αὐτοῖς ὁ Ἰησοῦς· Ἀμὴν ἀμὴν λέγω ὑμῖν, ἐὰν μὴ φάγητε τὴν σάρκα τοῦ υἱοῦ τοῦ ἀνθρώπου καὶ πίητε αὐτοῦ τὸ αἷμα, οὐκ ἔχετε ζωὴν ἐν ἑαυτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/053.yaml
  text: So Jesus said to them[a], “Truly, truly, I say to you, unless you eat the flesh of the Son of Man and drink his blood[b], you do not have life in yourselves.”
translation:
  language: ig
  text: Ya mere, Jizọs sịrị ha, “N’ezie, n’ezie, ana m asị unu, ọ gwụla ma unu rie anụ ahụ[a] nke Nwa nke Mmadụ ma ṅụọ ọbara ya, unu enweghị ndụ[b] n’ime onwe unu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya ‘ahụ’; ma okwu Grik bụ ‘anụ ahụ’ (σάρξ), nke na-echekwa ịdị kpọmkwem nke okwu a.
    reason: lexical_alternative
  - marker: b
    text: Amaokwu a kwuru naanị ‘ndụ,’ ọ bụghị ‘ndụ ebighị ebi,’ ọ bụ ezie na ọtụtụ ebe n’Oziọma Jọn na-ejikọ ndụ a na ndụ ebighị ebi.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Ya mere
  rationale: Na-egosi njikọ nke ihe Jizọs kwuru na okwu ndị bu ya ụzọ, ma bụrụkwa okwu Igbo doro anya.
- source_word: Ἀμὴν ἀμὴν
  choice: N’ezie, n’ezie
  rationale: Na-echekwa nkwughachi na nkwusi ike dị n’usoro okwu Jọn, n’asụsụ Igbo a na-aghọta ngwa ngwa.
- source_word: ἐὰν μὴ
  choice: ọ bụrụ na ... -ghị
  rationale: Usoro ọnọdụ Igbo a na-eji eme ihe na-enye otu echiche ahụ nke ‘unless’ n'ụzọ eke.
- source_word: φάγητε τὴν σάρκα
  choice: unu erighị anụ ahụ
  rationale: ‘Rie’ na-echekwa omume ahụ kpọmkwem; ‘anụ ahụ’ na-egosipụta σάρξ n'ụzọ doro anya ma ghara ime ka okwu ahụ bụrụ naanị ‘ahụ.’
- source_word: τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: nke Nwa nke Mmadụ
  rationale: Na-echekwa aha pụrụ iche Jizọs ji akpọ onwe ya na njikọ ya na asụsụ Akwụkwọ Nsọ.
- source_word: πίητε αὐτοῦ τὸ αἷμα
  choice: ṅụọ ọbara ya
  rationale: Nsụgharị kpọmkwem na-echekwa oyiyi okwu ahụ siri ike na njikọ ya na iri anụ ahụ.
- source_word: ζωὴν
  choice: ndụ
  rationale: Grik kwuru naanị ‘ndụ’; etinyeghị ‘ebighị ebi’ nke na-adịghị n’amaokwu a.
- source_word: ἐν ἑαυτοῖς
  choice: n’ime onwe unu
  rationale: Na-echekwa echiche nke ịnwe ndụ n’ime onwe ha, dị ka okwu Grik si dị.
theological_decisions:
- issue: Ma a ga-akọwa iri anụ ahụ na ịṅụ ọbara dị ka ihe atụ ma ọ bụ Sakramenti
  choice: 'E debere okwu ahụ kpọmkwem: ‘rie anụ ahụ ... ṅụọ ọbara ya.’'
  alternative: Iji okwu nkọwa dịka ‘sonye na ya’ ma ọ bụ okwu na-akọwa ya kpọmkwem dị ka Oriri Nsọ.
  rationale: Okwu Grik bụ nke a kpachapụrụ anya mee ka ọ sie ike. Nsụgharị ahụ ekwesịghị ikpebi arụmụka ma ọ bụ echiche okpukpe pụrụ iche maka onye na-agụ ya.
- issue: Ma ζωὴν ga-abụ ‘ndụ ebighị ebi’
  choice: ndụ
  alternative: ndụ ebighị ebi
  rationale: Ọ bụ ezie na gburugburu Oziọma Jọn na-ejikọ ndụ a na ndụ ebighị ebi, αἰώνιον adịghị n’amaokwu a.
translation_notes:
  register: Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta. E debere nkwughachi ‘N’ezie, n’ezie’ na oyiyi siri ike nke ‘anụ ahụ’ na ‘ọbara,’ n’enweghị nkọwa okpukpe agbakwunyere.
