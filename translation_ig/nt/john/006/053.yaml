review_pass:
  verdict: revise
  source_fidelity: 'The rendering preserves the key terms faithfully: σάρξ as “anụ ahụ,” αἷμα as “ọbara,” the title “Nwa nke Mmadụ,” and ζωή as “ndụ,” without adding “ebighị ebi.” However, the negative conditional “ọ bụrụ na unu erighị ... ma ṅụọ ...” can grammatically leave the drinking clause outside the negation, unlike the Greek condition, which requires both eating and drinking.'
  naturalness: “Ọ gwụla ma unu rie ... ma ṅụọ ...” is a more natural and unambiguous Standard Igbo way to express “unless you eat ... and drink ... .” Moving footnote b to “ndụ” gives it a clear anchor.
  terminology: “Anụ ahụ” appropriately retains the concrete force of σάρξ and should not be replaced with “ahụ.” “N’ezie, n’ezie,” “Nwa nke Mmadụ,” “ọbara,” and “ndụ” are suitable in a dignified modern biblical register.
  issues:
  - severity: medium
    issue: The conditional negation is potentially ambiguous.
    rationale: In “ọ bụrụ na unu erighị anụ ahụ ... ma ṅụọ ọbara ya,” -ghị explicitly modifies “erighị” but not necessarily “ṅụọ.” The source means that failure to do both—eat and drink—results in not having life. “Ọ gwụla ma” accurately scopes over both coordinated verbs.
  - severity: low
    issue: Footnote b is not anchored directly to the word it explains.
    rationale: The note concerns ζωή (“ndụ”), so placing [b] immediately after “ndụ” makes the reference precise.
  revised_text: Ya mere, Jizọs sịrị ha, “N’ezie, n’ezie, ana m asị unu, ọ gwụla ma unu rie anụ ahụ[a] nke Nwa nke Mmadụ ma ṅụọ ọbara ya, unu enweghị ndụ[b] n’ime onwe unu.”
