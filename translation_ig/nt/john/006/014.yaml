  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οἱ οὖν ἄνθρωποι ἰδόντες ⸂ὃ ἐποίησεν σημεῖον⸃ ⸀ἔλεγον ὅτι Οὗτός ἐστιν ἀληθῶς ὁ προφήτης ὁ ἐρχόμενος εἰς τὸν κόσμον.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/014.yaml
  text: So when the people saw the sign that he had done[a], they were saying[b], “This truly is the Prophet who is coming into the world.”
translation:
  language: ig
  text: Ya mere, mgbe ndị mmadụ hụrụ ihe ịrịba ama ahụ o mere[a], ha na-ekwu[b], “N’ezie, onye a bụ Onye Amụma ahụ nke na-abịa n’ụwa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Enwere ike ịtụgharị ya dịka, “ọrụ ebube ahụ o mere.” Jọn na-ejikarị “ihe ịrịba ama” (σημεῖον) eme ka ihe ọrụ Jizọs na-ekpughe pụta ìhè, ọ bụghị naanị ọdịdị ọrụ ebube ha.
    reason: lexical_alternative
  - marker: b
    text: O yikarịrị ka “Onye Amụma ahụ” na-ezo aka n’onye amụma dịka Mosis nke ndị mmadụ na-atụ anya ya (Diuterọnọmi 18:15–18).
    reason: cross_reference
lexical_decisions:
- source_word: οἱ οὖν ἄνθρωποι
  choice: Ya mere, mgbe ndị mmadụ
  rationale: “Ndị mmadụ” na-ezo aka n’ìgwè mmadụ ahụ n’ozuzu, ọ bụghị naanị ụmụ nwoke; “Ya mere” na-egosipụta njikọ οὖν na ihe mere tupu ya.
- source_word: ἰδόντες
  choice: hụrụ
  rationale: A kọwara participle aorist ahụ n’ụzọ Igbo si ekwu okwu nke ọma site na “mgbe ... hụrụ,” nke na-edobe usoro ihe omume.
- source_word: ὃ ἐποίησεν σημεῖον
  choice: ihe ịrịba ama ahụ ọ rụrụ
  rationale: “Ihe ịrịba ama” na-edobe mkpa σημεῖον nwere n’Oziọma Jọn dịka ọrụ na-ekpughe onye Jizọs bụ, ebe “ọ rụrụ” bụ asụsụ Igbo dị mfe ma kwekọọ na ἐποίησεν.
- source_word: ἔλεγον
  choice: ha nọ na-ekwu
  rationale: Ụdị imperfect na-egosi okwu na-aga n’ihu ma ọ bụ nke ọtụtụ mmadụ na-ekwughachi; “ha nọ na-ekwu” na-edobe akụkụ a.
- source_word: ἀληθῶς
  choice: N’ezie
  rationale: Ọ na-egosi nkwenye siri ike na onye ahụ bụ onye a na-ekwu maka ya n’ezie.
- source_word: ὁ προφήτης
  choice: Onye Amụma ahụ
  rationale: Mkpebi okwu “ahụ” na-egosi na ọ bụ onye amụma a ma ama nke a na-atụ anya ya, na-enweghị ịkọwapụta ya n’ime amaokwu dịka onye dịka Mosis.
- source_word: ὁ ἐρχόμενος εἰς τὸν κόσμον
  choice: nke na-abịa n’ụwa
  rationale: Nke a na-edobe participle nke oge ugbu a na akpaokwu Jọn “ịbịa n’ụwa,” na-enweghị ịgbanwe ya ka ọ bụrụ naanị ihe ga-eme n’ọdịnihu.
theological_decisions:
- issue: Njirimara “Onye Amụma ahụ”
  choice: Onye Amụma ahụ
  alternative: onye amụma dịka Mosis; otu onye amụma
  rationale: Ihe odide Grik nwere aha e ji akọwa onye a na-atụ anya ya, ma ọ kpọghị Mosis aha. Nsụgharị ahụ na-edobe ntụaka ahụ na ihe mgbagwoju anya ya; nkọwa ala peeji na-egosi njikọ o nwere ike inwe na Diuterọnọmi 18:15–18.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta, dee ya. “Ihe ịrịba ama” na-echekwa okwu pụrụ iche Jọn ji akọwa ọrụ Jizọs; “Onye Amụma ahụ” na-enye okwu ahụ ọdịdị aha ọkwá n’enweghị itinye nkọwa okpukpe karịrị ihe Grik kwuru.
