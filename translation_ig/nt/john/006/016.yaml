review_pass:
  verdict: revise
  source_fidelity: The temporal clause, the disciples, and the downward movement are accurately represented. However, “n’akụkụ osimiri ahụ” means “to/at the side or shore of the sea,” whereas ἐπὶ τὴν θάλασσαν with a motion verb expresses movement to the sea, without specifying the shore.
  naturalness: “Mgbe chi jiri” and “ndị na-eso ụzọ ya” are natural Standard Igbo. “Gbadata n’ebe oke osimiri ahụ dị” naturally conveys going down to the sea without adding a claim that they entered the water.
  terminology: “Oke osimiri” is the appropriate explicit term for Greek θάλασσα (“sea”). The footnote’s alternative should be “ọdọ mmiri,” corresponding to “lake,” rather than “n’akụkụ ọdọ mmiri,” which instead adds “shore/side.”
  issues:
  - severity: medium
    issue: The main text specifies the shore/side of the sea.
    rationale: The phrase “n’akụkụ osimiri ahụ” adds “side/shore,” which is not stated by ἐπὶ τὴν θάλασσαν and is not the lexical alternative documented in the audit trail.
  - severity: low
    issue: The footnote does not present the stated lexical alternative precisely.
    rationale: The English audit footnote contrasts “sea” with “lake.” “N’akụkụ ọdọ mmiri ahụ” means “at/to the side of the lake,” not simply “lake.”
  revised_text: Mgbe chi jiri, ndị na-eso ụzọ ya gbadara n’ebe oke osimiri ahụ dị.[a]
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “ọdọ mmiri.” Mmiri a bụ Oké Osimiri Galili, nke bụ ọdọ mmiri n’ezie; ma okwu Grik bụ “oke osimiri” (θάλασσα).
    reason: lexical_alternative
  revision_rationale: The revision removes the unsupported specification of the shore while preserving the directional sense of the Greek motion construction. It also uses “oke osimiri” in the text and footnote for θάλασσα, while presenting “ọdọ mmiri” as the lexical alternative supplied by the English audit trail.
