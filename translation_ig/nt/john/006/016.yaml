  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ὡς δὲ ὀψία ἐγένετο κατέβησαν οἱ μαθηταὶ αὐτοῦ ἐπὶ τὴν θάλασσαν,
base_translation:
  language: en
  yaml_path: translation/nt/john/006/016.yaml
  text: When evening came[a], his disciples went down to the sea,
translation:
  language: ig
  text: Mgbe chi jiri, ndị na-eso ụzọ ya gbadara n’ebe oke osimiri ahụ dị.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ọdọ mmiri.” Mmiri a bụ Oké Osimiri Galili, nke bụ ọdọ mmiri n’ezie; ma okwu Grik bụ “oke osimiri” (θάλασσα).
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὡς δὲ
  choice: Mgbe
  rationale: Ọ na-ebute mgbanwe oge n’akụkọ. “Mgbe” na-egosipụta oge ahụ n’Igbo doro anya; njikọ δέ adịghị mkpa ka a sụgharịa ya iche ebe a.
- source_word: ὀψία ἐγένετο
  choice: chi jiri
  rationale: Nke a bụ akpaalaokwu Igbo nkịtị, nke na-egosi na mgbede eruola, kwekọrọ n’echiche nke akpaalaokwu Grik.
- source_word: κατέβησαν
  choice: gbadara
  rationale: Ọ na-echekwa echiche nke ije ala dị na καταβαίνω ma na-ada nke ọma n’akụkọ Igbo.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: ndị na-eso ụzọ ya
  rationale: Nke a bụ ụzọ Igbo doro anya na nke a na-ejikarị ekwu “ndị na-eso ụzọ ya.”
- source_word: ἐπὶ τὴν θάλασσαν
  choice: n’akụkụ osimiri ahụ
  rationale: ἐπί tinyere accusative mgbe ngwaa ngagharị dị na-egosi ịga n’ebe mmiri ahụ dị. N’Igbo, “n’akụkụ osimiri ahụ” na-egosi na ha gbadara n’ọnụ mmiri ahụ, n’agbanyeghị na θάλασσα n’onwe ya pụtara “oke osimiri.”
