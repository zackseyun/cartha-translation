source:
  edition: SBLGNT
  text: ⸀Εἶπεν αὐτοῖς ὁ Ἰησοῦς· Ἐγώ εἰμι ὁ ἄρτος τῆς ζωῆς· ὁ ἐρχόμενος πρὸς ἐμὲ οὐ μὴ πεινάσῃ, καὶ ὁ πιστεύων εἰς ⸀ἐμὲ οὐ μὴ ⸀διψήσει πώποτε.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/035.yaml
  text: Jesus said to them, “I am the bread of life; the one who comes to me will never hunger, and the one who believes in me will never thirst again.”
translation:
  language: ig
  text: Jizọs sịrị ha, “Abụ m achịcha nke ndụ. Onye na-abịakwute m, agụụ agaghị agụ ya ma ọlị; onye kwere na m, akpịrị agaghị akpọ ya ma ọlị.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’asụsụ Grik, e ji njụ siri ike tinyere okwu pụtara “mgbe ọ bụla” mesie okwu a ike; a pụkwara ịghọta ya dịka, “akpịrị agaghị akpọ ya mgbe ọ bụla.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἶπεν αὐτοῖς
  choice: sịrị ha
  rationale: Nke a bụ ụzọ Igbo dị nkenke ma bụrụkwa nke e ji akọ akụkọ iji gosi okwu Jizọs gwara ha.
- source_word: Ἐγώ εἰμι
  choice: Abụ m
  rationale: Ọ na-echekwa nkwupụta onwe onye ahụ kpọmkwem n'Igbo eke, n'etinyeghị nkọwa mmụta okpukpe ọzọ.
- source_word: ὁ ἄρτος τῆς ζωῆς
  choice: achịcha nke ndụ
  rationale: Ọ na-echekwa usoro genitive na ihe atụ Grik ahụ karịa ịsụgharị ya dị ka ‘achịcha na-enye ndụ,’ nke ga-abụ nkọwa karịa.
- source_word: ὁ ἐρχόμενος πρὸς ἐμέ
  choice: Onye na-abịakwute m
  rationale: Ọ na-egosipụta participle nke na-akọ onye ọ bụla na-eme ihe a n'ụzọ Igbo dị ndụ ma doo anya.
- source_word: οὐ μὴ πεινάσῃ
  choice: agụụ agaghị agụ ya ma ọlị
  rationale: ‘Ma ọlị’ na-egosipụta ike nke njụ Grik οὐ μή n'Igbo eke.
- source_word: ὁ πιστεύων εἰς ἐμέ
  choice: onye kwere na m
  rationale: ‘Kwere na m’ bụ okwu Igbo a na-aghọta nke ọma maka πιστεύω εἰς, ma na-echekwa okwu banyere ikwere n'etinyeghị ‘ịtụkwasị obi’ dị ka nkọwa isi.
- source_word: οὐ μὴ διψήσει πώποτε
  choice: akpịrị agaghị akpọ ya mgbe ọ bụla
  rationale: Nke a na-egosipụta ma njụ siri ike οὐ μή ma πώποτε, ‘mgbe ọ bụla/ever,’ n'etinyeghị echiche ‘ọzọ’ nke adịghị n'okwu Grik.
theological_decisions:
- issue: Ihe πιστεύων εἰς ἐμέ pụtara
  choice: onye kwere na m
  alternative: onye tụkwasịrị m obi
  rationale: Nhọrọ bụ isi na-echekwa okwu Johann banyere ikwere n'ụzọ doro anya; nhọrọ ọzọ na-egosi akụkụ ntụkwasị obi ma nwee ike ime ka ihe okwu ahụ pụtara dị warara.
- issue: Ike nke nkwupụta Ἐγώ εἰμι
  choice: Abụ m
  alternative: Mụ onwe m bụ
  rationale: ‘Abụ m’ bụ nkwupụta onwe onye siri ike ma dị eke n'Igbo; etinyeghị nkọwa ọzọ ga-ekpebi ihe omimi mmụta okpukpe dị n'okwu ahụ.
- issue: πώποτε na njedebe ahịrịokwu
  choice: mgbe ọ bụla
  alternative: ọzọ
  rationale: πώποτε pụtara ‘ever/at any time,’ ọ bụghị ‘again’; ya mere isi ederede echekwaghị echiche nke ịkpọ nkụ ọzọ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Usoro ‘agụụ agụ mmadụ’ na ‘akpịrị kpọọ mmadụ’ bụ akpaalaokwu Igbo eke. E debere ihe atụ ‘achịcha nke ndụ’ n'ụzọ pụtara ìhè, ma zere itinye ‘ọzọ’ ebe πώποτε pụtara ‘mgbe ọ bụla.’
