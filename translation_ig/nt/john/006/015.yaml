revisions:
- from: Ya mere, mgbe Jizọs matara na ha na-achọ ịbịa jide ya n'ike ka ha mee ya eze, ọ laghachiri ọzọ n'ugwu ahụ, naanị ya.
  to: Ya mere, mgbe Jizọs matara na ha na-achọ ịbịa jide ya n'ike ka ha mee ya eze, ọ wepụrụ onwe ya ọzọ gaa n'ugwu ahụ, naanị ya.
  rationale: The sole necessary correction replaces «laghachiri» (‘returned’) with «wepụrụ onwe ya ... gaa» (‘withdrew ... to’), preserving both ἀνεχώρησεν and πάλιν. The coercive force of ἁρπάζειν is already represented directly by «jide ya n'ike», so no footnote is required.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T06:19:37Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the crowd's coercive intent in «jide ya n'ike ka ha mee ya eze» and retains the narrative connection, Jesus' knowledge, the purpose clause, the mountain, and his solitude. However, «ọ laghachiri» means ‘he returned/went back’ and does not accurately render ἀνεχώρησεν, ‘he withdrew.’
  naturalness: The revised wording uses natural, modern Standard Igbo. «wepụrụ onwe ya ... gaa» communicates deliberate withdrawal without implying that Jesus merely returned.
  terminology: «Jizọs», «eze», «ugwu ahụ», and «naanị ya» are appropriate Standard Igbo terms. No theological terminology requires alteration.
  issues:
  - severity: high
    issue: «ọ laghachiri» for ἀνεχώρησεν
    rationale: «Laghachiri» normally means ‘returned,’ whereas the Greek verb means ‘withdrew/departed.’ Although πάλιν supplies ‘again,’ it does not turn ἀνεχώρησεν into ‘returned.’ The rendering should explicitly communicate withdrawal.
  - severity: low
    issue: Potential ambiguity in «na-achọ ịbịa»
    rationale: This can suggest desire or attempt rather than the imminence conveyed by μέλλουσιν. In this context it remains understandable, but the revision retains it only because it is idiomatic and the immediately following action makes the intended future move clear.
  revised_text: Ya mere, mgbe Jizọs matara na ha na-achọ ịbịa jide ya n'ike ka ha mee ya eze, ọ wepụrụ onwe ya ọzọ gaa n'ugwu ahụ, naanị ya.
  revised_footnotes: []
