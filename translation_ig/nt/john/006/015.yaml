source:
  edition: SBLGNT
  text: Ἰησοῦς οὖν γνοὺς ὅτι μέλλουσιν ἔρχεσθαι καὶ ἁρπάζειν αὐτὸν ἵνα ⸀ποιήσωσιν βασιλέα ἀνεχώρησεν ⸀πάλιν εἰς τὸ ὄρος αὐτὸς μόνος.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/015.yaml
  text: So Jesus[a], knowing that they were about to come and seize him in order to make him king, withdrew again to the mountain by himself.
translation:
  language: ig
  text: Ya mere, mgbe Jizọs matara na ha na-achọ ịbịa jide ya n'ike ka ha mee ya eze, ọ wepụrụ onwe ya ọzọ gaa n'ugwu ahụ, naanị ya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὖν
  choice: Ya mere
  rationale: Na-ejikọta ihe Jizọs mere na ihe mere tupu ya, ma na-ada nke ọma n'Igbo.
- source_word: γνοὺς
  choice: mgbe Jizọs matara
  rationale: Na-egosi ọnọdụ mere ka Jizọs mee ihe sochirinụ; “matara” bụ okwu doro anya ma kwekọọ na participle ahụ.
- source_word: μέλλουσιν ἔρχεσθαι
  choice: ha na-achọ ịbịa
  rationale: Na-egosi ihe ha bu n'obi ime nke dị nso imezu; n'ọnọdụ a, ọ na-ada nke ọma karịa nsụgharị siri ike nke okwu n'okwu.
- source_word: ἁρπάζειν
  choice: jide ya n'ike
  rationale: Na-echekwa echiche nke ijide mmadụ n'ike ma ọ bụ megide uche ya, nke dị n'okwu Grik ahụ.
- source_word: ἵνα ποιήσωσιν βασιλέα
  choice: ka ha mee ya eze
  rationale: Na-egosi nzube ha n'ụzọ dị mkpirikpi ma bụrụ Igbo nkịtị.
- source_word: ἀνεχώρησεν
  choice: ọ laghachiri
  rationale: Na-egosi na Jizọs wezugara onwe ya pụọ n'ebe ahụ; njikọ ya na “ọzọ” na-echekwa echiche nke πάλιν.
- source_word: πάλιν
  choice: ọzọ
  rationale: Na-echekwa echiche nke imegharị omume ahụ.
- source_word: εἰς τὸ ὄρος
  choice: n'ugwu ahụ
  rationale: Na-edebe nkọwa kpọmkwem banyere ugwu ahụ e kwuru n'ọnọdụ akụkọ a.
- source_word: αὐτὸς μόνος
  choice: naanị ya
  rationale: Ọ bụ ụzọ Igbo dị eke isi chekwaa nkwusi ike na Jizọs nọ naanị ya.
theological_decisions:
- issue: Ụdị ihe ìgwè mmadụ ahụ chọrọ ime banyere ime Jizọs eze
  choice: jide ya n'ike ka ha mee ya eze
  alternative: kpọrọ ya mee ya eze
  rationale: ἁρπάζειν na-egosi mmanye. Nsụgharị a anaghị eme ka atụmatụ ndọrọ ndọrọ ọchịchị ha dị nro ma ọ bụ gosi na Jizọs kwadoro ya.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji “jide ya n'ike” mee ka mmanye dị na ἁρπάζειν pụta ìhè n'ahịrịokwu ahụ n'onwe ya; ya mere, a chọghị ihe odide ala peeji.
