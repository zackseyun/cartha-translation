  yaml_path: translation/nt/john/006/056.yaml
  text: The one who eats my flesh and drinks my blood remains in me[b][a], and I in him.
translation:
  language: ig
  text: Onye na-eri anụ ahụ m[a] ma na-aṅụ ọbara m na-anọgide n'ime m[b], mụ kwa n'ime ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “na-ata” ma ọ bụ “na-ata ata.” Ngwaa Grik a dị ike karịa okwu nkịtị maka iri ihe.
    reason: lexical_alternative
  - marker: b
    text: 'Ma ọ bụ: “na-ebi n''ime m, mụ kwa n''ime ya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ τρώγων
  choice: Onye na-ata
  rationale: Nkebiokwu a bụ aha e ji participle nọ ugbu a rụọ ọrụ; “Onye na-ata” na-egosi otu onye omume a ji mara ma na-edebekwa echiche nke omume na-aga n’ihu. “Ịta” na-egosikwa ịdị ike nke τρώγω karịa okwu nkịtị maka iri nri.
- source_word: μου τὴν σάρκα
  choice: anụ ahụ m
  rationale: “Anụ ahụ” na-enye σάρξ n’ụzọ doro anya ma na-edebe onyinyo siri ike nke okwu Jizọs n’ebughị ụzọ kọwaa ya dịka ihe atụ ma ọ bụ dịka emume sacrament.
- source_word: καὶ πίνων μου τὸ αἷμα
  choice: ma na-aṅụ ọbara m
  rationale: Nke a na-edebe njikọ na myirịta dị n’etiti participle abụọ ahụ, ma sụgharịa αἷμα dịka “ọbara” n’enweghị nkọwa agbakwunyere.
- source_word: ἐν ἐμοὶ μένει
  choice: na-anọgide n'ime m
  rationale: “Na-anọgide” bụ Igbo dị ugbu a, dịkwa mfe nghọta, nke na-echekwa echiche Jọn banyere mmekọrịta na-adịgide adịgide.
- source_word: κἀγὼ ἐν αὐτῷ
  choice: mụ onwe m kwa n'ime ya
  rationale: κἀγώ nwere ike ịbụ “mụ onwe m kwa”; a hapụrụ ngwaa a na-emeghachi emegharị dịka Grik si hapụ ya, ebe Igbo ka na-eme ka ihe ọ pụtara doo anya.
- source_word: αὐτῷ
  choice: ya
  rationale: Igbo “ya” na-ezo aka n’onye ahụ n’enweghị ịmanye okike nwoke ebe usoro asụsụ Igbo anaghị achọ ya.
theological_decisions:
- issue: Ma iri anụ ahụ na ịṅụ ọbara bụ okwu sacrament ka ọ bụ ihe atụ
  choice: E debere okwu anụ ahụ na ọbara n’ụzọ kpọmkwem, n’enweghị nkọwa na-akwado otu ọdịnala ụka.
  alternative: Ịkọwa ya kpọmkwem dịka Oriri Nsọ, ma ọ bụ ịgbanwe ya ka ọ bụrụ nanị ikwere.
  rationale: Grik na-eji onyinyo ahụ n’onwe ya ma ọ naghị edozi esemokwu nkọwa n’amaokwu a; nsụgharị kwesịrị ichekwa esemokwu ahụ.
- issue: Asụsụ Jọn banyere ibi n’ime ibe ya
  choice: na-anọgide n'ime m
  alternative: na-ebi n'ime m; jikọtara m ọnụ
  rationale: “Na-anọgide” na-echekwa echiche nke μένω banyere ịdịgide n’ime mmekọrịta, n’enweghị ime ya ka ọ bụrụ usoro ozizi e mechara guzobe.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “Na-ata” na-echekwa ịdị ndụ nke τρώγω, ebe ndetu ala na-enye okwu Igbo a na-ejikarị eme ihe, “na-eri.” A naghị etinye nkọwa otu ụka banyere Oriri Nsọ ma ọ bụ ihe atụ n’ime ederede.
