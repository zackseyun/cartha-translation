revisions:
- from: Onye na-ata anụ ahụ m[a] ma na-aṅụ ọbara m na-anọgide n'ime m,[b] mụ onwe m kwa n'ime ya.
  to: Onye na-eri anụ ahụ m[a] ma na-aṅụ ọbara m na-anọgide n'ime m[b], mụ kwa n'ime ya.
  rationale: The revision uses the idiomatic Standard Igbo verb “na-eri” for the main sense of τρώγω while retaining its more graphic nuance in a footnote. It removes unwarranted reflexive emphasis from κἀγώ and corrects the scope of the μένω alternative note. The concrete flesh-and-blood language and the source’s theological ambiguity remain unchanged.
