  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οἱ πατέρες ἡμῶν τὸ μάννα ἔφαγον ἐν τῇ ἐρήμῳ, καθώς ἐστιν γεγραμμένον· Ἄρτον ἐκ τοῦ οὐρανοῦ ἔδωκεν αὐτοῖς φαγεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/031.yaml
  text: 'Our fathers ate the manna in the wilderness[b][a], just as it is written: ‘He gave them bread from heaven to eat.’'
translation:
  language: ig
  text: 'Ndị nna nna anyị riri mana n’ọzara[a], dị ka e dere n’Akwụkwọ Nsọ, sị: “O nyere ha achịcha si n’eluigwe ka ha rie.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị “n’ọzara” ka ọ bụrụ “n’ala ịkpa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ πατέρες ἡμῶν
  choice: Ndị nna nna anyị
  rationale: N'Igbo nkịtị, ‘ndị nna nna anyị’ na-egosi ndị nna ochie nke Izrel n'ụzọ doro anya ma dịkwa ebube; ọ na-eburu echiche nke Greek banyere ndị nna gara aga n’enweghị ịtụgharị ya ka ọ bụrụ naanị ndị nna mụrụ ha.
- source_word: τὸ μάννα
  choice: mana
  rationale: ‘Mana’ bụ aha a na-amakarị n'Igbo maka nri ahụ Chineke nyere Izrel n’ọzara; Igbo anaghị achọ mkpụrụokwu pụrụ iche iji nọchie article Greek ebe a.
- source_word: ἔφαγον
  choice: riri
  rationale: Oge gara aga ‘riri’ na-anọchi aorist Greek n'ụzọ kwụ ọtọ ma bụrụ okwu Igbo ebumpụta ụwa.
- source_word: ἐν τῇ ἐρήμῳ
  choice: n’ọzara
  rationale: ‘Ọzara’ bụ okwu Igbo doro anya maka ebe tọgbọrọ chakoo ma ọ bụ desert/wilderness, ma dabara n'akụkọ ọpụpụ Izrel.
- source_word: καθώς ἐστιν γεγραμμένον
  choice: dị nnọọ ka e dere ya, sị
  rationale: Nkebi a na-echekwa ntụnyere καθώς na ọnọdụ ihe e dere nke ka dị ire; ‘sị’ na-ewebata ihe e hotara n'ụzọ Igbo na-asụkarị.
- source_word: Ἄρτον
  choice: achịcha
  rationale: ‘Achịcha’ bụ ihe kwekọrọ n'ụzọ nkịtị na ἄρτος n'ọnọdụ a, n’enweghị ime ya otu ogbe achịcha kpọmkwem.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: si n’eluigwe
  rationale: ‘Si n’eluigwe’ na-echekwa isi mmalite nke onyinye ahụ na ụda Akwụkwọ Nsọ n'ụzọ ebumpụta ụwa n'Igbo.
- source_word: ἔδωκεν αὐτοῖς φαγεῖν
  choice: O nyere ha ... ka ha rie
  rationale: Usoro a na-echekwa ngwaa ‘nyere,’ onye natara ya, na infinitive ebumnuche/result ‘ka ha rie’ n'ụzọ Igbo doro anya.
theological_decisions:
- issue: Ịtụgharị okwu e hotara banyere mana n’etinyeghị nkọwa Kraịst nke ga-apụta mgbe e mesịrị
  choice: E debere ya dịka okwu akụkọ na Akwụkwọ Nsọ banyere onye nyere ha achịcha si n’eluigwe, n’enweghị isi mkpụrụedemede ma ọ bụ mgbakwunye na-eme ka ‘achịcha’ bụrụ aha Kraịst ebe a.
  alternative: Ịgbakwunye okwu ma ọ bụ ụdị edemede ga-eme ka onye na-agụ ya mata ozugbo na achịcha ahụ bụ Jizọs.
  rationale: Ndị na-ekwu okwu ebe a na-arịọ akaebe sitere n’akụkọ mana. Nkọwa Kraịst kwesịrị ịpụta n’ihu n’okwu Jizọs n’onwe ya, ọ bụghị ka e tinye ya n’amaokwu a.
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe nke oge a, dị mfe nghọta ma nwee ugwu kwesịrị Akwụkwọ Nsọ. A họọrọ ‘ndị nna nna anyị’ karịa ‘ndị nna anyị’ n’ihi na nke ikpeazụ nwere ike ịdị ka ọ na-ekwu naanị banyere ndị nna mụrụ ndị na-ekwu okwu. Naanị akara ndetu [a] ka e ji mee ihe, ọ dịkwa n'ahịrị isi.
