id: JHN.6.41
reference: John 6:41
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἐγόγγυζον οὖν οἱ Ἰουδαῖοι περὶ αὐτοῦ ὅτι εἶπεν· Ἐγώ εἰμι ὁ ἄρτος ὁ καταβὰς ἐκ τοῦ οὐρανοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/john/006/041.yaml
  text: So the Jews were grumbling about him because he said[a], “I am the bread that came down from heaven.”
translation:
  language: ig
  text: Ya mere, ndị Juu[a] nọ na-atamu ntamu banyere ya n’ihi na o kwuru, sị, “Abụ m achịcha ahụ nke si n’eluigwe rịdata.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “ndị Judia” ma ọ bụ, n’ọnọdụ ụfọdụ, “ndị ndú ndị Juu.” N’Oziọma Jọn, okwu a bụ “ndị Juu” nwere ike izo aka n’otu ìgwè kpọmkwem nke na-emegide Jizọs, ọ bụghị na ọ na-ekwu maka ndị Juu niile.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐγόγγυζον
  choice: nọ na-atamu ntamu
  rationale: Oge imperfect na-egosi omume na-aga n’ihu ma ọ bụ na-eme ugboro ugboro n’oge gara aga. “Nọ na-atamu ntamu” na-egosi mkpesa e ji olu nta na-eme ma na-echekwa ndò okwu nke ntamu Izrel n’ọzara.
- source_word: οὖν
  choice: Ya mere
  rationale: Ọ na-ejikọta okwu a na ihe e kwuru tupu ya ma na-egosi ihe kpatara mmeghachi omume ahụ.
- source_word: οἱ Ἰουδαῖοι
  choice: ndị Juu
  rationale: Nke a na-esochi okwu Grik ahụ n’enweghị ime ka ọ bụrụ naanị ndị ndú ma ọ bụ naanị ndị Judia. Ihe odide ala na-akọwa na n’Oziọma Jọn, okwu a nwere ike ịpụta otu ìgwè ndị Juu na-emegide Jizọs n’ọnọdụ ahụ, ọ bụghị ndị Juu niile.
- source_word: περὶ αὐτοῦ
  choice: banyere ya
  rationale: περί ya na genitive pụtara ihe a na-ekwu gbasara mmadụ; “banyere ya” bụ Igbo doro anya nke na-adịghị etinye echiche “megide ya” karịa ihe Grik kwuru.
- source_word: ὅτι
  choice: n’ihi na
  rationale: N’ebe a, ὅτι na-egosi ihe kpatara ha ji na-atamu ntamu.
- source_word: εἶπεν
  choice: o kwuru, sị
  rationale: Aorist a na-akọ otu ihe mere n’oge gara aga; usoro “o kwuru, sị” bụ ụzọ Igbo dị mma isi webata okwu kpọmkwem.
- source_word: Ἐγώ εἰμι
  choice: Abụ m
  rationale: Nke a na-echekwa nkwupụta onye mbụ ahụ na nkwusi ike dị na ἐγώ n’ụzọ Igbo dị nkenke ma bụrụ eke.
- source_word: ὁ ἄρτος
  choice: achịcha ahụ
  rationale: “Achịcha ahụ” na-egosipụta article Grik nke na-akọwapụta Jizọs dị ka achịcha ahụ kpọmkwem.
- source_word: ὁ καταβὰς
  choice: nke ... rịdata
  rationale: Articular aorist participle na-akọwa “achịcha ahụ”; relative clause a bụ Igbo eke ma na-echekwa echiche nke isi n’elu bịa ala.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: si n’eluigwe
  rationale: Nke a na-egosipụta isi mmalite ma ọ bụ ebe o si bịa, dịka ἐκ + genitive si kwuo.
theological_decisions:
- issue: Onye okwu οἱ Ἰουδαῖοι na-ezo aka na ya n’Oziọma Jọn
  choice: ndị Juu
  alternative: ndị Judia; ndị ndú ndị Juu
  rationale: Isi ederede na-esochi okwu Grik ozugbo ma ghara imechi onye ọ na-ezo aka na ya karịa amaokwu ahụ. Ihe odide ala na-echekwa ezi nghọta na okwu Jọn nwere ike ịpụta otu ìgwè ndị Juu na-emegide Jizọs n’ọnọdụ ahụ, ọ bụghị ndị Juu niile n’enweghị iche.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “Nọ na-atamu ntamu” na-enye imperfect ahụ ụda omume na-aga n’ihu; “achịcha ahụ” na-echekwa nkọwapụta article Grik. E tinyere akara [a] ozugbo n’isi ederede, ya na nkọwa ya.
