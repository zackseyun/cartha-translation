id: JHN.6.4
reference: John 6:4
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἦν δὲ ἐγγὺς τὸ πάσχα, ἡ ἑορτὴ τῶν Ἰουδαίων.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/004.yaml
  text: The Passover[a], the feast of the Jews, was near.
translation:
  language: ig
  text: Ememme Ngabiga[a], bụ́ ememme ndị Juu, dị nso.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ememme ndị Judia.” Okwu Grik ahụ nwere ike ịpụta ndị Juu n'ozuzu ha ma ọ bụ ndị Judia kpọmkwem, dabere n'ihe gbara ya gburugburu.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: e gosipụtaghị ya iche n'Igbo
  rationale: δὲ bụ njikọ dị nro nke na-akwalite akụkọ n'ihu. Ịhapụ ya n'enweghị okwu Igbo pụrụ iche na-eme ka ahịrịokwu ahụ bụrụ nke eke, ma zere ime ka ọ yie ihe na-emegide ihe bu ya ụzọ.
- source_word: ἐγγὺς
  choice: dị nso
  rationale: N'ebe a, ἐγγύς na ἦν na-egosi na oge ememme ahụ adịla nso. “Dị nso” bụ okwu Igbo doro anya ma bụrụ nke eke.
- source_word: πάσχα
  choice: Ememme Ngabiga
  rationale: πάσχα bụ ememme ndị Juu na-echeta ngabiga ahụ. “Ememme Ngabiga” na-enye onye na-agụ Igbo ihe ọ pụtara n'ụzọ doro anya ma kwesịkwa ekwesị.
- source_word: ἑορτὴ
  choice: ememme
  rationale: ἑορτή pụtara mmemme okpukpe ma ọ bụ oge a na-eme oriri pụrụ iche. “Ememme” bụ okwu Igbo nke oge a, dị mfe nghọta, ma na-edebe uche nke okwu Grik.
- source_word: τῶν Ἰουδαίων
  choice: ndị Juu
  rationale: Ἰουδαῖοι nwere ike izo aka n'ebe ụfọdụ n'ọrụ Jọn n'ebe ndị Judia nọ, ma n'ebe a ọ na-akọwa Ngabiga dị ka ememme nke ndị Juu n'ozuzu ha. Ya mere, “ndị Juu” dabara n'ọnọdụ a, ebe nkọwa ala ala peeji na-edebe nhọrọ ọzọ.
theological_decisions:
- issue: Otú e si asụgharị Ἰουδαίων n'akụkọ Jọn
  choice: ndị Juu
  alternative: ndị Judia
  rationale: N'ebe a, Ngabiga bụ ememme okpukpe nke ndị Juu n'ozuzu ha, ọ bụghị naanị ememme ndị bi na Judia. Ma ebe okwu Grik ahụ nwere ike inwe nghọta abụọ dabere n'ọnọdụ, e debere “ndị Judia” dị ka nhọrọ ọzọ n'ala ala peeji.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta mee nsụgharị ahụ. Ahịrịokwu ahụ dị nkenke dịka nke Grik, e jighịkwa okwu na-egosi mmegide dochie δὲ ebe ọnọdụ a na-achọghị ya.
