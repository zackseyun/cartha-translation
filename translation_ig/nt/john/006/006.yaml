review_pass:
  verdict: revise
  source_fidelity: The draft correctly identifies πειράζων as testing Philip and preserves the emphatic αὐτὸς in “ya onwe ya.” However, “ihe ọ na-achọ ime” normally suggests what he wanted or sought to do and does not adequately convey the prospective force of ἔμελλεν ποιεῖν (“what he was about to/going to do”). The footnote’s “ịrafu mmadụ” means to deceive or mislead someone and is not a suitable lexical alternative here.
  naturalness: The proposed revision uses ordinary, dignified Standard Igbo narrative phrasing. “O kwuru” is more natural in a past narrative than the present-form “ọ na-ekwu,” while “ihe ọ ga-eme” idiomatically expresses the future action known from the narrative’s past viewpoint.
  terminology: “iji nwalee ya” is an appropriate contextual rendering of πειράζω. The footnote is revised to retain “iji nwaa ya” as an alternative while describing the broader possible sense without using the inaccurate term “ịrafu mmadụ.”
  issues:
  - severity: medium
    issue: The phrase “ihe ọ na-achọ ime” is not an adequate rendering of ἔμελλεν ποιεῖν.
    rationale: In Standard Igbo it commonly denotes intention, desire, or an attempt/endeavour. The Greek expresses what Jesus was going to or about to do. “ihe ọ ga-eme” preserves the prospective reference naturally without over-specifying it.
  - severity: medium
    issue: The footnote gloss “ịrafu mmadụ” is lexically inaccurate for πειράζω.
    rationale: “Ịrafu mmadụ” means to deceive or lead astray. Although πειράζω can in some contexts mean tempt, the note should use wording connected with temptation/testing rather than deception.
  revised_text: Ma o kwuru nke a iji nwalee ya[a], n’ihi na ya onwe ya maara ihe ọ ga-eme.
  revised_footnotes:
  - marker: a
    text: A pụkwara ịsị, “iji nwaa ya.” Okwu Grik a pụkwara ịpụta ịnwale ma ọ bụ ịnwa mmadụ, ma n’ebe a ọ pụtara ịnwale ma ọ bụ igosi ihe dị n’ime ya.
    reason: lexical_alternative
  revision_rationale: The revision corrects the prospective sense of ἔμελλεν ποιεῖν, adopts a natural past-narrative verb form for ἔλεγεν, and replaces an inaccurate footnote alternative. It retains the source’s contextual sense of testing and the emphasis that Jesus himself knew.
