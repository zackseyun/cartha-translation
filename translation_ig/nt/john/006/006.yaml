  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τοῦτο δὲ ἔλεγεν πειράζων αὐτόν, αὐτὸς γὰρ ᾔδει τί ἔμελλεν ποιεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/006.yaml
  text: But he was saying this to test him[a], for he himself knew what he was about to do.
translation:
  language: ig
  text: Ma o kwuru nke a iji nwalee ya[a], n’ihi na ya onwe ya maara ihe ọ ga-eme.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “iji nwaa ya.” Okwu Grik a pụkwara ịpụta ịnwale ma ọ bụ ịnwa mmadụ, ma n’ebe a ọ pụtara ịnwale ma ọ bụ igosi ihe dị n’ime ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο
  choice: nke a
  rationale: Ọ na-arụtụ aka n’ajụjụ Jizọs ka kwuchara n’amaokwu bu ụzọ.
- source_word: δὲ
  choice: Ma
  rationale: Ọ na-egosi obere ntụgharị ma ọ bụ ọdịiche n’etiti ajụjụ ahụ na nkọwa onye odee na-enye.
- source_word: ἔλεγεν
  choice: ọ na-ekwu
  rationale: Ụdị imperfect na-egosi okwu a na-ekwu n’ọnọdụ akụkọ; Igbo present-progressive narrative a na-asụkarị na-eburu akụkụ ahụ nke ọma.
- source_word: πειράζων
  choice: iji nwalee
  rationale: N’ọnọdụ a, ihe ọ pụtara bụ ịnwale ma ọ bụ ịchọpụta ọnọdụ Filip, ọ bụghị ịrafu ya ka o mee ihe ọjọọ. ‘Iji’ na-egosipụta nzube participle ahụ n’Igbo dị ire.
- source_word: αὐτόν
  choice: ya
  rationale: Ọ bụ onye a na-anwale, ya bụ Filip dịka amaokwu ndị gbara ya gburugburu si gosi.
- source_word: αὐτὸς
  choice: ya onwe ya
  rationale: Na-echekwa nkwusiri ike nke nnọchiaha Greek ahụ.
- source_word: γὰρ
  choice: n’ihi na
  rationale: Ọ na-ebute ihe mere Jizọs ji kwuo okwu ahụ n’ụzọ a.
- source_word: ᾔδει
  choice: maara
  rationale: Ọ bụ ọnọdụ ịma ihe n’oge gara aga; ‘maara’ bụ nsụgharị Igbo kwụ ọtọ ma dị ire.
- source_word: τί
  choice: ihe
  rationale: N’okwu ‘ihe ọ na-achọ ime,’ ọ na-ewebata ọdịnaya nke ihe Jizọs maara.
- source_word: ἔμελλεν ποιεῖν
  choice: ọ na-achọ ime
  rationale: Na-egosipụta ihe ọ na-aga ime ma ọ bụ ihe o bu n’obi ime, n’enweghị ịkọwa karịa ihe Greek kwuru.
theological_decisions:
- issue: Ihe πειράζων pụtara n’omume Jizọs n’ebe Filip nọ
  choice: iji nwalee ya
  alternative: iji nwaa ya; iji rafuo ya
  rationale: Ọnọdụ akụkọ a na-egosi nnwale nke nghọta ma ọ bụ okwukwe Filip, ọ bụghị ịrafu ya ime ihe ọjọọ. Ihe e dere n’ala ala peeji na-echekwa obosara mkpụrụokwu ahụ.
- issue: Nkwusiri ike n’ihe Jizọs maara
  choice: ya onwe ya maara
  alternative: ọ maara
  rationale: αὐτὸς pụtara ìhè ma na-ekwusi onye maara ihe ahụ ike; nsụgharị ahụ na-echekwa nkwusiri ike ahụ n’etinyeghị nkọwa ozizi ọzọ.
- issue: Ọdịiche dị n’etiti ịdị nso na ebumnobi n’okwu ἔμελλεν ποιεῖν
  choice: ihe ọ na-achọ ime
  alternative: ihe ọ na-aga ime; ihe ọ na-achọzi ime
  rationale: Nhọrọ a na-ahapụ ohere ma maka ihe o bu n’obi ime ma maka ihe dị nso ime, kama ịmanye naanị otu akụkụ nke μέλλω.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ugwu ma doo ndị nkịtị anya. E ji ‘Jizọs’ dochie nnọchiaha n’ime nkọwa naanị, ma ederede amaokwu ahụ na-edobe nnọchiaha dịka Greek si dị. Akara [a] dị n’ederede ma kwekọọ na nkọwa ala peeji.
