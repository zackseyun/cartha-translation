  to: Ma o kwuru nke a iji nwalee ya[a], n’ihi na ya onwe ya maara ihe ọ ga-eme.
  rationale: The revision corrects the prospective sense of ἔμελλεν ποιεῖν, adopts a natural past-narrative verb form for ἔλεγεν, and replaces an inaccurate footnote alternative. It retains the source’s contextual sense of testing and the emphasis that Jesus himself knew.
