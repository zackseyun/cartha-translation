source:
  edition: SBLGNT
  text: ὡς δὲ ἐνεπλήσθησαν λέγει τοῖς μαθηταῖς αὐτοῦ· Συναγάγετε τὰ περισσεύσαντα κλάσματα, ἵνα μή τι ἀπόληται.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/012.yaml
  text: And when they were filled[a], he says to his disciples, “Gather up the leftover pieces[d][c][b], so that nothing may be lost.”
translation:
  language: ig
  text: Mgbe ha rijuru afọ[a], ọ na-agwa[b] ndị na-eso ụzọ ya, sị, “Chịkọtaanụ iberibe ndị fọdụrụ[c], ka ihe ọ bụla ghara ịla n’iyi[d].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “mgbe afọ juru ha” ma ọ bụ “mgbe ha richara ka afọ ha juru.”
    reason: lexical_alternative
  - marker: b
    text: 'Grik ji ụdị ngwaa dị ugbu a n’akụkọ a: “ọ na-agwa … sị.” Ụfọdụ nsụgharị na-eme ka ọ bụrụ, “ọ gwara.”'
    reason: lexical_alternative
  - marker: c
    text: A pụkwara ịsị, “mpekere ndị fọdụrụ.”
    reason: lexical_alternative
  - marker: d
    text: A pụkwara ịsị, “ka a ghara imefusị ihe ọ bụla.” Ma okwu Grik pụtara n’ụzọ dị nso karị, “ka ihe ọ bụla ghara ịla n’iyi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ
  choice: Mgbe
  rationale: “Mgbe” na-egosipụta oge ihe a mere ma na-eme ka akụkọ ahụ na-aga n’ihu n’ụzọ Igbo nkịtị; ọ dịghị mkpa ịsụgharị δέ iche ebe a.
- source_word: ἐνεπλήσθησαν
  choice: ha rijuru afọ
  rationale: Nke a bụ okwu Igbo doro anya maka iri nri ruo mgbe afọ juru mmadụ, ma na-eburu echiche nke ịbụ ndị ejuputara ma ọ bụ ndị afọ juru.
- source_word: λέγει
  choice: ọ na-agwa
  rationale: E ji ụdị ngwaa dị ugbu a chekwaa historical present nke Grik, kama ịgbanwe ya ozugbo ka ọ bụrụ naanị ihe gara aga.
- source_word: μαθηταῖς
  choice: ndị na-eso ụzọ ya
  rationale: Nke a bụ okwu Igbo a na-ahụkarị ma doo anya maka μαθηταί n’Oziọma.
- source_word: Συναγάγετε
  choice: Chịkọtaanụ
  rationale: Ọ bụ iwu e nyere ọtụtụ mmadụ ka ha chịkọta ihe ndị ahụ n’otu ebe.
- source_word: τὰ περισσεύσαντα κλάσματα
  choice: iberibe ndị fọdụrụ
  rationale: “Iberibe” na-egosi akụkụ achịcha ndị e kewara ekewa, “ndị fọdụrụ” wee gosi na ha bụ ihe rifọrọ n’oriri ahụ.
- source_word: ἵνα μή τι ἀπόληται
  choice: ka ihe ọ bụla ghara ịla n’iyi
  rationale: Nke a na-anọgide nso n’okwu Grik ma na-ezere ime ka ọ bụrụ naanị “imefusị,” nke bụ nkọwa dabere n’ọnọdụ ahụ.
theological_decisions:
- issue: Ma ἀπόληται ò nwere nghọta nzọpụta n’ebe a
  choice: ịla n’iyi
  alternative: imefusị; ịla n’iyi kpamkpam
  rationale: Ihe a na-ekwu kpọmkwem bụ iberibe nri fọdụrụ. “Ịla n’iyi” na-echekwa obosara okwu Grik na ụda okwu Jọn nwere ike inwe, ma ọ dịghị amanye nghọta gbasara nzọpụta n’amaokwu a.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ugwu ma dị mfe nghọta. “Ha rijuru afọ” bụ okwu nkịtị gbasara afọ ojuju mgbe e richara nri; “ọ na-agwa” na-echekwa historical present nke akụkọ Jọn.
