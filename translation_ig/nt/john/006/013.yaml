    text: A pụkwara ịsụgharị ya “iberibe ndị a gbajiri agbaji.”
    reason: lexical_alternative
  - marker: b
    text: N’asụsụ Grik, e kwuru ya n’ụzọ na-egosi ihe karịrị nke e riri; ihe a na-ekwu bụ iberibe ndị fọdụrụ mgbe ndị ahụ risịrị nri.
    reason: lexical_alternative
