  text: συνήγαγον οὖν, καὶ ἐγέμισαν δώδεκα κοφίνους κλασμάτων ἐκ τῶν πέντε ἄρτων τῶν κριθίνων ἃ ⸀ἐπερίσσευσαν τοῖς βεβρωκόσιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/013.yaml
  text: So they gathered them[b][a], and filled twelve baskets with pieces from the five barley loaves left over by those who had eaten.
translation:
  language: ig
  text: Ya mere, ha chịkọtara ha, jupụta n’iberibe[a] achịcha ọka bali ise ahụ fọdụrụ mgbe ndị riri nri[b] richara nri nkata iri na abụọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “iberibe ndị a gbajiri agbaji.”
    reason: lexical_alternative
  - marker: b
    text: N’asụsụ Grik, e kwuru ya n’ụzọ na-egosi ihe karịrị nke e riri; ihe a na-ekwu bụ iberibe ndị fọdụrụ mgbe ndị ahụ risịrị nri.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνήγαγον
  choice: ha chịkọtara ha
  rationale: Ngwaa a na-egosi na ndị na-eso ụzọ chịkọtara iberibe ndị ahụ; ‘ha’ nke abụọ na-eme ka ihe a na-ekwu banyere ya doo anya site n'okwu gbara ya gburugburu.
- source_word: οὖν
  choice: Ya mere
  rationale: Na-egosi ihe si n'iwu Jizọs nyere n'amaokwu gara aga pụta, ma bụrụkwa okwu Igbo doro anya.
- source_word: ἐγέμισαν
  choice: juo
  rationale: Na-egosi na iberibe ahụ mere ka nkata iri na abụọ jupụta.
- source_word: δώδεκα κοφίνους
  choice: nkata iri na abụọ
  rationale: ‘Nkata’ bụ okwu zuru ezu ma doo anya; isi mmalite anaghị achọ ka a kọwaa ụdị nkata ahụ karịa nke a.
- source_word: κλασμάτων
  choice: iberibe
  rationale: Na-ezo aka n'iberibe achịcha ndị fọdụrụ; ọ bụ okwu Igbo nkịtị ma dabara n'ọnọdụ a.
- source_word: ἐκ τῶν πέντε ἄρτων τῶν κριθίνων
  choice: were iberibe achịcha ọka bali ise ahụ
  rationale: Na-echekwa ọnụọgụ achịcha na ụdị ọka e ji mee ha, ma hazie ya n'ụzọ Igbo si ada nke ọma.
- source_word: ἃ ἐπερίσσευσαν
  choice: fọdụrụ
  rationale: Na-egosi ihe karịrị mkpa ma nọgide mgbe e risịrị nri, na-enweghị ịmanye ihe atụ nke ‘ijupụta gabiga ókè’ n'Igbo.
- source_word: τοῖς βεβρωκόσιν
  choice: ndị riri nri
  rationale: Na-anọchi anya ndị ahụ riri nri ma debe njikọ ya na ihe fọdụrụ; nkọwa ala peeji na-egosi usoro okwu Grik nke nwekwara ike ịpụta ‘fọdụrụ nye ndị riri.’
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E debere usoro echiche Grik, ma gbanwee nhazi okwu ka ọ bụrụ Igbo na-ada nke ọma; e jikwa nkọwa ala peeji chekwaa ọdịdị na ntakịrị mgbagwoju anya dị na ἃ ἐπερίσσευσαν τοῖς βεβρωκόσιν.
