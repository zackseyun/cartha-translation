revisions:
- from: Ya mere, ha chịkọtara ha, were iberibe[a] achịcha ọka bali ise ahụ fọdụrụ ndị riri nri[b] juo nkata iri na abụọ.
  to: Ya mere, ha chịkọtara ha, jupụta n’iberibe[a] achịcha ọka bali ise ahụ fọdụrụ mgbe ndị riri nri[b] richara nri nkata iri na abụọ.
  rationale: The revision retains every source element and the intended optimal-equivalence register. It replaces an ambiguous leftover expression with a clear temporal clause, improves the filling construction for natural Standard Igbo, and corrects the explanatory footnote so that it reflects surplus remaining after the eaters had eaten.
