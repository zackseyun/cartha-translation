id: JHN.6.50
reference: John 6:50
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οὗτός ἐστιν ὁ ἄρτος ὁ ἐκ τοῦ οὐρανοῦ καταβαίνων ἵνα τις ἐξ αὐτοῦ φάγῃ καὶ μὴ ἀποθάνῃ·
base_translation:
  language: en
  yaml_path: translation/nt/john/006/050.yaml
  text: This is the bread that comes down from heaven[b][a], so that anyone may eat from it and not die.
translation:
  language: ig
  text: Nke a bụ achịcha ahụ nke si n’eluigwe na-arịdata[a], ka onye ọ bụla wee rie n’ime ya, ghara ịnwụ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “Nke a bụ achịcha ahụ na-arịdata site n’eluigwe.”
    reason: lexical_alternative
  - marker: b
    text: E debere okwu “ghara ịnwụ” ka ọ saa mbara. N’ọnọdụ okwu a, ụfọdụ na-aghọta ya dị ka ịgbanahụ ọnwụ ikpeazụ, ụfọdụ dị ka ọnwụ ime mmụọ, ndị ọzọkwa dị ka mbibi n’ọgwụgwụ oge.
    reason: alternative_reading
lexical_decisions:
- source_word: οὗτός
  choice: Nke a
  rationale: Ngosipụta a na-arụtụ aka n’achịcha Jizọs na-akọwa; “Nke a” bụ ụzọ Igbo nkịtị si egosi ihe ahụ kpọmkwem.
- source_word: ἄρτος
  choice: achịcha
  rationale: Nke a bụ isi ihe okwu Grik pụtara, ma na-edobekwa ma echiche nkịtị ma nke ihe atụ dị n’okwu Jọn 6.
- source_word: ὁ ἐκ τοῦ οὐρανοῦ καταβαίνων
  choice: nke si n’eluigwe na-arịdata
  rationale: Nkebiokwu a na-edobe omume na-aga n’ihu nke participle καταβαίνων, ma bụrụkwa Igbo dị mfe ma kwekọọ n’usoro asụsụ.
- source_word: οὐρανός
  choice: eluigwe
  rationale: N’ebe a, okwu ahụ na-ezo aka n’ebe obibi Chineke, ọ bụghị naanị mbara igwe a na-ahụ anya.
- source_word: ἵνα
  choice: ka … wee
  rationale: Usoro a na-egosi ebumnuche ma ọ bụ ihe ga-esi na ya pụta n’Igbo nkịtị.
- source_word: τις
  choice: onye ọ bụla
  rationale: Ọ na-egosi onye ọbụla n’ozuzu ya, n’enweghị ịkpa ókè ma ọ bụ ịkọwa otu onye kpọmkwem.
- source_word: ἐξ αὐτοῦ
  choice: n’ime ya
  rationale: Ya na ngwaa “rie,” nke a bụ ụzọ Igbo sitere n’okike si kwuo iri ụfọdụ n’achịcha ahụ, n’akọwaghị ya karịa ihe Grik kwuru.
- source_word: φάγῃ
  choice: rie
  rationale: Ụdị ngwaa a dabara n’ahịrịokwu ebumnuche “ka … wee,” ma na-edobe okwu ahụ dị ka ihe onye ọ bụla nwere ike ime.
- source_word: μὴ ἀποθάνῃ
  choice: ghara ịnwụ
  rationale: Nke a na-asụgharị ngwaa ahụ n’ụzọ kwụ ọtọ, n’etinyeghị nkọwa na ọ bụ ọnwụ ime mmụọ ma ọ bụ mbibi ebighị ebi.
theological_decisions:
- issue: Ụdị ọnwụ e kwuru n’okwu “ghara ịnwụ”
  choice: E debere okwu sara mbara “ghara ịnwụ” n’enweghị ịkọwa ụdị ọnwụ ọ bụ.
  alternative: “ghara ịnwụ n’ime mmụọ” ma ọ bụ “ghara ịla n’iyi ruo mgbe ebighị ebi”
  rationale: Ọ bụ ezie na okwu banyere Achịcha Ndụ na-atụnyere achịcha nkịtị na ndụ Jizọs na-enye, amaokwu a n’onwe ya akọwaghị kpọmkwem ụdị ọnwụ ahụ. Nsụgharị sara mbara na-edobe omimi na esemokwu echiche dị n’okwu Jọn.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ “na-arịdata” iji chekwaa echiche omume na-aga n’ihu, ebe a hapụrụ “ghara ịnwụ” n’enweghị ịkọwa nkà mmụta okpukpe karịa ihe ederede kwuru.
