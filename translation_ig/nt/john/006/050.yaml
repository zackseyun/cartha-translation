  source_fidelity: 'The translation accurately represents the Greek: the demonstrative identifies the bread, the present participle retains the sense of bread coming down from heaven, and the purpose/result clause preserves both eating from it and not dying. “Ghara ịnwụ” appropriately leaves the nature of the death unspecified.'
