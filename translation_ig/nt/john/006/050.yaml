  terminology: “Achịcha,” “eluigwe,” and “ọnwụ” are established, comprehensible terms. The rendering does not overinterpret the Johannine metaphor or resolve its theological ambiguity. Footnote a is anchored after the relevant descent expression, and footnote b after “ghara ịnwụ.”
