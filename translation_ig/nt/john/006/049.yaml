  text: οἱ πατέρες ὑμῶν ἔφαγον ⸂ἐν τῇ ἐρήμῳ τὸ μάννα⸃ καὶ ἀπέθανον·
base_translation:
  language: en
  yaml_path: translation/nt/john/006/049.yaml
  text: Your fathers ate the manna in the wilderness[a], and they died.
translation:
  language: ig
  text: Ndị nna unu riri mana ahụ n'ọzara,[a] ha nwụrụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị nna nna unu.” Grik kwuru kpọmkwem, “ndị nna unu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ πατέρες ὑμῶν
  choice: Ndị nna nna unu
  rationale: N'ọnọdụ a, πατέρες na-ezo aka n'ọn ọgbọ ndị Izrel gara aga, karịchaa ndị nọ n'ọzara. “Ndị nna nna unu” bụ okwu Igbo ebumpụta ụwa nke na-egosi ndị nna ochie, ma na-edobe njikọ nke ndị na-ege Jizọs ntị na ọgbọ ahụ.
- source_word: ἔφαγον
  choice: riri
  rationale: Aorist nke ἐσθίω na-akọ ihe mere n'oge gara aga n'ụzọ kwụ ọtọ; “riri” bụ nsụgharị Igbo doro anya ma dị mma.
- source_word: ἐν τῇ ἐρήμῳ
  choice: n'ọzara
  rationale: “Ọzara” bụ okwu Igbo a na-ejikarị maka ἔρημος n'akụkọ ọpụpụ Izrel, ma na-edobe ụda Akwụkwọ Nsọ nke ebe ahụ.
- source_word: τὸ μάννα
  choice: mana ahụ
  rationale: “Mana” bụ aha nri ahụ e kwuru n'akụkọ ọzara. “Ahụ” na-egosipụta article τὸ ma na-atụ aka na mana a maara nke ọma n'akụkọ ahụ.
- source_word: ἀπέθανον
  choice: ha nwụrụ
  rationale: Nke a na-egosi ọnwụ n'ezie. Ikwughachi isiokwu ahụ dịka “ha” na-eme ka ọdịiche dị n'etiti iri mana na ịnwụ doo anya n'Igbo.
theological_decisions:
- issue: Ntụaka nye ọgbọ Izrel nọ n'ọzara
  choice: Ndị nna nna unu
  alternative: Ndị nna unu
  rationale: “Ndị nna nna unu” na-akọwa n'Igbo nkịtị na okwu ahụ bụ maka ndị nna ochie nke ndị na-ege ntị, ọ bụghị naanị ndị mụrụ ha ozugbo. Ọ naghị etinye nkọwa ozizi ọzọ n'amaokwu ahụ, ma na-edobe njikọ akụkọ ihe mere eme ya.
translation_notes:
  register: 'Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-edobe ọdịiche siri ike nke Grik: ha riri mana ahụ, ma n''agbanyeghị nke ahụ ha nwụrụ.'
