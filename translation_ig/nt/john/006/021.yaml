  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἤθελον οὖν λαβεῖν αὐτὸν εἰς τὸ πλοῖον, καὶ εὐθέως ⸂ἐγένετο τὸ πλοῖον⸃ ἐπὶ τῆς γῆς εἰς ἣν ὑπῆγον.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/021.yaml
  text: So they were willing to take him into the boat[a], and immediately the boat was at the land to which they were going.
translation:
  language: ig
  text: Ya mere, ha dị njikere ịkpọbata ya n’ime ụgbọ mmiri ahụ; ozugbo ahụkwa, ụgbọ mmiri ahụ nọ n’ala ahụ ha na-aga.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ozugbo ahụ ụgbọ mmiri ahụ rutere n’ụsọ mmiri ebe ha na-aga.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤθελον
  choice: ha dị njikere
  rationale: N’ebe a, imperfect nke θέλω na-egosi na ha kwetara ma dị njikere ịkpọbata ya, ọ bụghị naanị ọchịchọ mere n’otu ntabi anya.
- source_word: οὖν
  choice: N’ihi ya
  rationale: Ọ na-ejikọta ihe a mere na ihe bu ya ụzọ dịka ihe si na ya pụta.
- source_word: λαβεῖν αὐτὸν εἰς τὸ πλοῖον
  choice: ịkpọbata ya n’ụgbọ mmiri ahụ
  rationale: Nke a bụ okwu Igbo doro anya maka ịnabata ma webata Jizọs n’ime ụgbọ mmiri.
- source_word: πλοῖον
  choice: ụgbọ mmiri
  rationale: Ọ bụ aha Igbo a na-ejikarị eme ihe maka boat, ọ dabakwara n’ọnọdụ a.
- source_word: εὐθέως
  choice: ozugbo ahụ
  rationale: Ọ na-echekwa ịdị ngwa na mberede nke ihe ahụ mere.
- source_word: ἐγένετο τὸ πλοῖον ἐπὶ τῆς γῆς
  choice: ụgbọ mmiri ahụ nọ n’ala ahụ
  rationale: Nke a na-anọ nso n’usoro Grik ma na-ahapụ ịdị ngwa nke akụkọ ahụ n’enweghị ịkọwa ya karịa ihe odide ahụ kwuru.
- source_word: γῆς
  choice: ala
  rationale: γῆ pụtara ala n’ụzọ sara mbara; n’ebe a ọ bụ ala ebe njem ha na-aga, ebe ‘ụsọ mmiri’ bụkwa nkọwa kwe omume.
- source_word: εἰς ἣν ὑπῆγον
  choice: ha na-aga
  rationale: Ọ na-egosipụta njem ha ka na-aga n’ihu ruo ebe ahụ, dịka imperfect Grik si dị.
theological_decisions:
- issue: Ma a ga-akọwa ma ọ bụ belata ihe yiri ọrụ ebube dị n’ọbịbịa ụgbọ mmiri ahụ ozugbo
  choice: E chekwara okwu kwụ ọtọ, ‘ozugbo ahụkwa ụgbọ mmiri ahụ nọ n’ala ahụ,’ n’enweghị nkọwa agbakwunyere.
  alternative: ‘ozugbo ahụ ụgbọ mmiri ahụ rutere n’ụsọ mmiri ebe ha na-aga’ ma ọ bụ ‘n’oge na-adịghị anya ụgbọ mmiri ahụ rutere n’ala ahụ’
  rationale: Grik kwuru ihe ahụ nkenke ma mesie ịdị ngwa ya ike. Nsụgharị ahụ kwesịrị idobe esemokwu na ike akụkọ ahụ kama ịkọwa ọrụ ebube ahụ pụọ ma ọ bụ mee ka ịdị ngwa ya daa mba.
translation_notes:
  register: Standard Igbo dị ugbu a, nke nwere nsọpụrụ ma dị mfe nghọta. E ji ‘ịkpọbata’ mee ka omume ịnabata Jizọs n’ụgbọ mmiri doo anya; e debere ‘n’ala ahụ’ n’ahịrị bụ isi iji nọgide nso na Grik, ma tinye ‘ụsọ mmiri’ dịka nhọrọ n’okpuru.
