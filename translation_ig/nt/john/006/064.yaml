id: JHN.6.64
reference: John 6:64
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀλλὰ εἰσὶν ἐξ ὑμῶν τινες οἳ οὐ πιστεύουσιν. ᾔδει γὰρ ἐξ ἀρχῆς ὁ Ἰησοῦς τίνες εἰσὶν οἱ μὴ πιστεύοντες καὶ τίς ἐστιν ὁ παραδώσων αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/064.yaml
  text: But there are some among you who do not believe[a]. For Jesus knew from the beginning who those were who did not believe[b], and who it was who would betray him.
translation:
  language: ig
  text: Ma ụfọdụ n’ime unu adịghị ekwere. N’ihi na site ná mmalite, Jizọs maara ndị na-ekweghị ekwe, marakwa onye ga-arara ya nye[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n’ụzọ nkịtị karị, “onye ga-enyefe ya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Ma
  rationale: Na-egosi ọdịiche dị n’etiti okwu a na ihe e kwuru tupu ya; “Ma” bụ ụzọ Igbo dị mfe ma kwekọọ na ya.
- source_word: ἐξ ὑμῶν
  choice: n’ime unu
  rationale: Na-egosi na ndị ahụ so n’ìgwè ndị Jizọs na-agwa okwu, n’ụzọ Igbo na-ada nke ọma.
- source_word: τινες
  choice: ụfọdụ
  rationale: Na-ezo aka n’akụkụ ndị a na-akpọghị aha n’ime ìgwè ahụ.
- source_word: οἳ οὐ πιστεύουσιν
  choice: adịghị ekwere
  rationale: Na-echekwa echiche nke ekweghị ekwe nke na-aga n’ihu, ma na-ada nke ọma n’Igbo ugbu a.
- source_word: ᾔδει
  choice: maara
  rationale: Okwu ahụ na-egosi ọnọdụ ihe Jizọs maara n’oge gara aga; “maara” bụ nsụgharị Igbo doro anya.
- source_word: ἐξ ἀρχῆς
  choice: site ná mmalite
  rationale: Na-echekwa nkọwa oge ahụ n’ebughị ụzọ kọwaa kpọmkwem mmalite nke ihe ọ bụ.
- source_word: οἱ μὴ πιστεύοντες
  choice: ndị na-ekweghị ekwe
  rationale: Na-akọwa ìgwè mmadụ e ji ekweghị ekwe mara, ma na-echekwa ọdịdị participle nke okwu Grik ahụ.
- source_word: παραδώσων
  choice: ga-arara ya nye
  rationale: N’akụkọ Jọn, okwu a na-ezo aka n’omume aghụghọ nke inyefe Jizọs; “rara ya nye” na-enye echiche ahụ nke ọma, ebe e debere nsụgharị nkịtị karị n’ala peeji.
- source_word: αὐτόν
  choice: ya
  rationale: Nnọchiaha a na-ezo aka na Jizọs dịka onye a ga-arara nye.
theological_decisions:
- issue: Nsụgharị πιστεύω n’ebe a na-ekwu maka nzaghachi ndị na-eso ụzọ nye Jizọs
  choice: ikwere
  alternative: ịtụkwasị obi
  rationale: “Ikwere” sara mbara nke ọma iji buru ma nghọta uche ma mmekọrịta ntụkwasị obi, n’ebughị ụzọ mee ka otu akụkụ pụta karịa ibe ya.
- issue: Nsụgharị παραδίδωμι mgbe ọ na-ezo aka n’omume Judas
  choice: ịrara nye
  alternative: inyefe
  rationale: Ọ bụ ezie na okwu Grik ahụ nwere ike ịpụta “inyefe,” ihe gbara ya gburugburu na-egosi inyefe e mere n’aghụghọ. E debere nhọrọ nkịtị karị n’ala peeji iji mee ka ọdịiche okwu ahụ pụta ìhè.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. Ahịrịokwu ahụ na-echekwa ọdịiche dị n’etiti ụfọdụ ndị na-ekweghị ekwe na ihe Jizọs maara site ná mmalite, ma ọ kọwaghị ihe “mmalite” ahụ bụ.
