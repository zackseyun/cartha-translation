  text: εἶπον οὖν πρὸς αὐτόν· Τί ποιῶμεν ἵνα ἐργαζώμεθα τὰ ἔργα τοῦ θεοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/john/006/028.yaml
  text: Then they said to him[a], “What must we do so that we may work the works of God?”
translation:
  language: ig
  text: Ha wee sị ya, “Gịnị ka anyị ga-eme ka anyị wee rụọ ọrụ Chineke?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ịsụgharị ya: “Gịnị ka anyị kwesịrị ime ka anyị wee rụọ ọrụ Chineke?” Okwu Grik ahụ nwekwara ike ịpụta, “ọrụ ndị Chineke chọrọ.”'
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπον
  choice: ha sịrị
  rationale: Oge aorist nke λέγω na-akọ okwu e kwuru n’oge gara aga n’ụzọ dị mfe; “ha sịrị” bụkwa okwu Igbo nkịtị dabara adaba.
- source_word: οὖν
  choice: Ya mere
  rationale: οὖν na-ejikọta ajụjụ a na ihe bu ya ụzọ ma nwee ike igosi ntakịrị nkwubi okwu; “Ya mere” na-echekwa njikọ ahụ n’ụzọ doro anya.
- source_word: πρὸς αὐτόν
  choice: ya
  rationale: N’Igbo, “ha sịrị ya” bụ ụzọ ebumpụta ụwa isi kwuo na ha gwara ya okwu; ọ na-egosi onye a gwara okwu n’enweghị ịgbakwụnye nkọwa ọzọ.
- source_word: Τί ποιῶμεν
  choice: Gịnị ka anyị ga-eme
  rationale: Ajụjụ deliberative a na-achọ ihe ha kwesịrị ma ọ bụ ga-eme; “ga-eme” na-egosi mkpa omume ahụ n’Igbo dị ugbu a n’enweghị ime ka iwu ahụ sie ike karịa ihe Grik kwuru.
- source_word: ἵνα
  choice: ka
  rationale: “Ka” na-ewebata ebumnuche n’Igbo, kwekọrọ na ọrụ ἵνα n’ebe a.
- source_word: ἐργαζώμεθα τὰ ἔργα
  choice: anyị wee na-arụ ọrụ
  rationale: “na-arụ ọrụ” na-echekwa njikọ okwu dị n’etiti ngwaa ἐργάζομαι na aha ἔργα dịka o kwere omume n’Igbo, ma zere nkwughachi na-adịghị eke dịka “rụọ ọrụ ndị ahụ.”
- source_word: τοῦ θεοῦ
  choice: Chineke
  rationale: 'Nhazi “ọrụ Chineke” na-ahapụ genitive ahụ ghe oghe: ọ pụrụ izo aka n’ọrụ Chineke chọrọ, ọrụ nke ya, ma ọ bụ ọrụ sitere n’aka ya.'
theological_decisions:
- issue: Ihe genitive pụtara na τὰ ἔργα τοῦ θεοῦ
  choice: ọrụ Chineke
  alternative: ọrụ Chineke chọrọ ka anyị rụọ
  rationale: “Ọrụ Chineke” na-echekwa ihe Grik ahụ na-ekwughị kpọmkwem, ma hapụ amaokwu na-esonụ ka o mee ka echiche ahụ pụta ìhè n’enweghị idozi ya tupu oge eruo.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E debere nkebi ahịrịokwu “ọrụ Chineke” iji chekwaa mgbagwoju anya dị n’asụsụ Grik, ebe e ji “anyị wee na-arụ” mee ka okwu ahụ na-aga nke ọma n’Igbo.
