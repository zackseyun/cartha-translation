  text: λέγει αὐτῷ εἷς ἐκ τῶν μαθητῶν αὐτοῦ, Ἀνδρέας ὁ ἀδελφὸς Σίμωνος Πέτρου·
base_translation:
  language: en
  yaml_path: translation/nt/john/006/008.yaml
  text: One of his disciples, Andrew, Simon Peter’s brother, said to him,
translation:
  language: ig
  text: Otu n’ime ndị na-eso ụzọ ya, Andru, nwanne Saịmọn Pita, sịrị ya,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: sịrị
  rationale: Ọ bụ ezie na Grik ji okwu dị n’oge ugbu a n’akụkọ ihe mere eme, Igbo nkịtị na-eji oge gara aga akọ ụdị ihe a; “sịrị” na-eweta echiche ahụ n'ụzọ doro anya ma dịkwa ụtọ n’ọnụ.
- source_word: αὐτῷ
  choice: ya
  rationale: Nnochiaha a bụ onye a gwara okwu; n’ọnọdụ a, ọ na-ezo aka na Jizọs. “Sịrị ya” bụ ụzọ Igbo si ekwu ya nke ọma.
- source_word: εἷς ἐκ τῶν μαθητῶν αὐτοῦ
  choice: Otu n’ime ndị na-eso ụzọ ya
  rationale: Nke a na-egosipụta nkebi partitive nke Grik n'ụzọ ziri ezi ma bụrụkwa Igbo a na-aghọta ngwa ngwa.
- source_word: μαθητῶν
  choice: ndị na-eso ụzọ
  rationale: Nke a bụ okwu Igbo a na-ejikarị akọwa μαθηταί n’Oziọma, na-egosipụta ndị na-amụta ihe n’aka onye nkụzi ma na-eso ya.
- source_word: Ἀνδρέας
  choice: Andru
  rationale: A sụgharịghị aha onye ahụ; e dere ya n’ụdị a na-asụkarị ma na-ede kwa n’Igbo.
- source_word: ὁ ἀδελφὸς Σίμωνος Πέτρου
  choice: nwanne Saịmọn Pita
  rationale: Nkebi a na-akọwa Andru site n’ezinụlọ ya. “Nwanne” na-edobe ihe Grik kwuru n’enweghị ịgbakwụnye nkọwa gbasara onye tọrọ onye.
- source_word: Σίμωνος Πέτρου
  choice: Saịmọn Pita
  rationale: Aha abụọ a jikọtara ọnụ na-egosi otu onye a maara dị ka Saịmọn Pita; e debere ha ọnụ dị ka ha dị na Grik.
theological_decisions: []
translation_notes:
  register: Asụsụ ahụ bụ Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E ji “ndị na-eso ụzọ” mee ka mmekọrịta nke ndị na-amụta ihe ma na-eso Jizọs pụta ìhè. E debere akara rikoma ikpeazụ n’ihi na amaokwu a na-eduga ozugbo n’okwu Andru ga-ekwu n’amaokwu na-esote.
