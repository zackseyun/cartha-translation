id: JHN.6.51
reference: John 6:51
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐγώ εἰμι ὁ ἄρτος ὁ ζῶν ὁ ἐκ τοῦ οὐρανοῦ καταβάς· ἐάν τις φάγῃ ἐκ τούτου τοῦ ἄρτου ⸀ζήσει εἰς τὸν αἰῶνα, καὶ ὁ ἄρτος δὲ ὃν ἐγὼ δώσω ἡ σάρξ μού ⸀ἐστιν ὑπὲρ τῆς τοῦ κόσμου ζωῆς.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/051.yaml
  text: I am the living bread that came down from heaven[a]. If anyone eats of this bread, he will live forever[c][b]. And the bread that I will give for the life of the world is my flesh.
translation:
  language: ig
  text: Abụ m achịcha dị ndụ nke si n’eluigwe rịdata. Ọ bụrụ na onye ọ bụla erie achịcha a, ọ ga-adị ndụ ruo mgbe ebighị ebi.[a] Achịcha ahụ m ga-enye maka ndụ nke ụwa bụ anụ ahụ m.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'N’ụzọ kpọmkwem: “ọ ga-adị ndụ ruo n’oge ahụ.” Okwu a pụtara ịdị ndụ ruo mgbe ebighị ebi.'
    reason: lexical_alternative
  - marker: b
    text: Grik kwuru “anụ ahụ,” ọ bụghị “ahụ.” Okwu ahụ na-ekwu maka anụ ahụ n’ụzọ kpọmkwem.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἄρτος ὁ ζῶν
  choice: Achịcha dị ndụ
  rationale: Nke a na-asụgharị ζῶν dịka nkọwa kpọmkwem nke achịcha; ọ naghị ebubata okwu dị iche, ‘achịcha nke ndụ,’ site n’amaokwu ndị gbara ya gburugburu.
- source_word: ὁ ἐκ τοῦ οὐρανοῦ καταβάς
  choice: nke si n’eluigwe rịdata
  rationale: Nkebiokwu a na-egosi nrịdata nke mezuru emezu ma na-ada nke ọma n’Igbo dị ugbu a, na-edowe nkwupụta Jizọs na o si n’eluigwe bịa.
- source_word: ἐάν τις φάγῃ ἐκ τούτου τοῦ ἄρτου
  choice: Ọ bụrụ na onye ọ bụla erie n’ime achịcha a
  rationale: ‘Ọ bụrụ na onye ọ bụla’ na-edowe ọnọdụ izugbe nke ἐάν τις; ‘erie n’ime’ na-anọchi ἐκ n’ụzọ doro anya ma kwekọọ n’Igbo.
- source_word: ζήσει εἰς τὸν αἰῶνα
  choice: ọ ga-adị ndụ ruo mgbe ebighị ebi
  rationale: Nke a bụ ụzọ Igbo doro anya isi kwupụta okwu Jọn nke pụtara ndụ na-adịgide adịgide, kama ịsụgharị ya n’ụzọ siri ike dịka ‘banye n’ọgbọ ahụ.’
- source_word: ὁ ἄρτος δὲ ὃν ἐγὼ δώσω
  choice: Achịcha ahụ m ga-enye
  rationale: Ọ na-edowe ọdịnihu nke δώσω na mmepe echiche nke δέ n’enweghị itinye mmegide siri ike na-adịghị na Grik.
- source_word: ἡ σάρξ μού ἐστιν
  choice: bụ anụ ahụ m
  rationale: ‘Anụ ahụ’ bụ okwu Igbo kpọmkwem maka σάρξ n’ebe a; ọ naghị eme ka okwu ahụ dị nro site n’ịgbanwe ya ka ọ bụrụ naanị ‘ahụ.’
- source_word: ὑπὲρ τῆς τοῦ κόσμου ζωῆς
  choice: maka ndụ nke ụwa
  rationale: ‘Maka’ na-egosi ebumnuche/uru nke ὑπέρ, ebe ‘ụwa’ na-edowe obosara κόσμος n’akwụsịghị ya naanị n’ebe otu ìgwè mmadụ nọ.
theological_decisions:
- issue: Ihe σάρξ pụtara n’okwu Jizọs gbasara onwe ya
  choice: anụ ahụ n’ederede bụ isi
  alternative: ahụ
  rationale: Okwu Grik ahụ bụ nke a na-ahụ anya ma sie ike n’ọnọdụ a. ‘Ahụ’ nwere ike ime ka okwu ahụ dị nro ma dozie ajụjụ nkọwa nke ederede ahụ n’onwe ya hapụrụ ka ọ dị.
- issue: Obosara okwu κόσμος
  choice: ụwa
  alternative: ụmụ mmadụ; ndị a họpụtara
  rationale: Nsụgharị ahụ na-edowe okwu sara mbara nke Jọn ma ghara ime ka ọ bụrụ naanị otu ìgwè dịka usoro ozizi pụrụ iche si chọọ.
- issue: Ike nke okwu ‘si n’eluigwe rịdata’ banyere onye Kraịst bụ
  choice: ịsụgharị ya dịka nrịdata sitere n’eluigwe
  alternative: ozi ma ọ bụ ikike Chineke nyere ya naanị
  rationale: Nke a na-edowe nkwupụta nke ederede ahụ kpọmkwem n’emeghị ka ọ bụrụ naanị ihe atụ, ma ọ naghị agbakwunye nkọwa karịa ihe Grik kwuru.
translation_notes:
  register: Standard Igbo dị ugbu a, dị nsọ ma dị mfe nghọta. E ji ‘Abụ m’ mee nkwupụta siri ike nke ἐγώ εἰμι; e zere okwu ụka pụrụ iche. Akara nkọwa ala ala [a] na [b] pụtara n’ederede bụ isi.
