revisions:
- from: Abụ m achịcha dị ndụ nke si n’eluigwe rịdata. Ọ bụrụ na onye ọ bụla erie n’ime achịcha a, ọ ga-adị ndụ ruo mgbe ebighị ebi.[a] Achịcha ahụ m ga-enye maka ndụ nke ụwa bụ anụ ahụ m.[b]
  to: Abụ m achịcha dị ndụ nke si n’eluigwe rịdata. Ọ bụrụ na onye ọ bụla erie achịcha a, ọ ga-adị ndụ ruo mgbe ebighị ebi.[a] Achịcha ahụ m ga-enye maka ndụ nke ụwa bụ anụ ahụ m.[b]
  rationale: A safe correction replaces the spatially misleading “erie n’ime achịcha a” with the natural Standard Igbo “erie achịcha a.” The main text continues to preserve the Greek’s general conditional, enduring-life idiom, future gift, concrete “flesh,” and broad “world.” Footnote a is adjusted so its literal alternative reflects αἰών as ‘age’ rather than ‘generation.’
  reviewer_model: gpt-5.6-terra
