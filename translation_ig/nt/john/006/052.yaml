  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἐμάχοντο οὖν πρὸς ἀλλήλους οἱ Ἰουδαῖοι λέγοντες· Πῶς δύναται οὗτος ἡμῖν δοῦναι τὴν σάρκα ⸀αὐτοῦ φαγεῖν;
base_translation:
  language: en
  yaml_path: translation/nt/john/006/052.yaml
  text: So the Jews were arguing among themselves[a], saying[b], “How can this man give us his flesh to eat?”
translation:
  language: ig
  text: Ya mere, ndị Juu[a] nọ na-arụrịta ụka n’etiti onwe ha, na-asị, “Olee otú nwoke a pụrụ isi nye anyị anụ ahụ ya[b] ka anyị rie?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya ‘ndị Judia’ ma ọ bụ, dịka ọnọdụ okwu si dị, ‘ndị isi Juu.’ N’asụsụ Grik, ọ bụ naanị ‘ndị Juu.’
    reason: alternative_reading
  - marker: b
    text: A pụkwara ịsụgharị ya ‘ahụ ya.’ Okwu Grik bụ σάρξ, ya bụ ‘anụ ahụ’; e debere okwu a iji chekwaa otú okwu ahụ siri doo anya nakwa esemokwu ọ na-akpalite n’ebe a.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐμάχοντο
  choice: nọ na-arụrịta ụka
  rationale: Ụdị ngwaa imperfect na-egosi esemokwu okwu nke nọ na-aga n’ihu; ‘nọ na-arụrịta ụka’ na-egosipụta nke a n’Igbo doro anya n’emeghị ka ọ bụrụ ọgụ aka.
- source_word: οὖν
  choice: N’ihi ya
  rationale: Na-ejikọta mmeghachi omume ha na okwu Jizọs kwuru tupu nke a, ma na-echekwa echiche nke ihe si n’ihe ọzọ pụta.
- source_word: πρὸς ἀλλήλους
  choice: n’etiti onwe ha
  rationale: Nke a bụ ụzọ Igbo si egosi na ndị nọ n’otu ìgwè ahụ na-arụrịta ụka ibe ha.
- source_word: οἱ Ἰουδαῖοι
  choice: ndị Juu
  rationale: Ọ bụ kpọmkwem ihe okwu Grik ahụ kwuru; a naghị eme ka ọ bụrụ naanị ndị isi Juu ma ọ bụ ndị Judia n’amaokwu bụ isi.
- source_word: λέγοντες
  choice: na-asị
  rationale: Na-ewebata okwu ha kwuru, dị ka participle Grik si eme.
- source_word: Πῶς δύναται
  choice: Olee otú ... pụrụ isi
  rationale: Ọ bụ usoro Igbo dị mma maka ajụjụ gbasara otú ihe ga-esi kwe omume.
- source_word: οὗτος
  choice: nwoke a
  rationale: Na-echekwa ụda nke ịrụ aka n’ebe onye ahụ nọ, nke nwere ike igosi ịnọpụ iche ma ọ bụ nlelị.
- source_word: ἡμῖν
  choice: anyị
  rationale: Na-egosi ndị ga-anata ihe ahụ n’ụzọ nkịtị n’usoro okwu Igbo.
- source_word: δοῦναι
  choice: nye
  rationale: Na-enye isi nghọta dị mfe nke δίδωμι n’etinyeghị nkọwa ọzọ.
- source_word: τὴν σάρκα αὐτοῦ
  choice: anụ ahụ ya
  rationale: Na-echekwa okwu ahụ siri ike ma doo anya nke σάρξ, kama ịgbanwe ya ka ọ bụrụ naanị ‘ahụ ya’ ma si otú ahụ belata esemokwu dị n’okwu ahụ.
- source_word: φαγεῖν
  choice: ka anyị rie
  rationale: Na-egosipụta ebumnuche nke inye anụ ahụ ahụ n’Igbo dị mfe ma kwekọọ na infinitive Grik.
theological_decisions:
- issue: Nsụgharị σάρξ n’okwu nwere nnukwu ihe ọ pụtara n’ozizi
  choice: anụ ahụ
  alternative: ahụ
  rationale: ‘Anụ ahụ’ na-echekwa ihe okwu Grik σάρξ kwuru n’ụzọ a pụrụ ịghọta dị ka ihe anụ ahụ n’ezie, n’emeghị mkpebi n’amaokwu ahụ banyere nkọwa Oriri Nsọ.
- issue: Ndị οἱ Ἰουδαῖοι na-ezo aka na ha n’Oziọma Jọn
  choice: ndị Juu
  alternative: ndị Judia; ndị isi Juu
  rationale: Amaokwu ahụ n’onwe ya emeghị ka ndị a bụrụ naanị ndị isi ma ọ bụ ndị si Judia; ya mere, ederede bụ isi na-agbaso okwu Grik, ebe nkọwa ala peeji na-egosi nhọrọ ndị ọzọ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. ‘Nọ na-arụrịta ụka’ na-egosi ihe nọ na-aga n’ihu; ‘anụ ahụ ya’ na-echekwa ịdị kpọmkwem na ihe mgbagwoju anya nke okwu Jizọs n’enweghị itinye nkọwa otu ụka n’ime amaokwu ahụ.
