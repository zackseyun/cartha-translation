  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἶπεν οὖν ὁ Ἰησοῦς τοῖς δώδεκα· Μὴ καὶ ὑμεῖς θέλετε ὑπάγειν;
base_translation:
  language: en
  yaml_path: translation/nt/john/006/067.yaml
  text: So Jesus said to the Twelve[a], “You do not want to go away too, do you?”
translation:
  language: ig
  text: Ya mere, Jizọs sịrị Ndị Iri na Abụọ, “Unu achọghịkwa ịla, ọ̀ bụghị ya?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “Unu onwe unu chọkwara ịla?” Okwu Grik e ji malite ajụjụ a bụ μή, nke na-egosikarị na onye na-ajụ ya na-atụ anya azịza “mba.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Ya mere
  rationale: Ọ na-egosi njikọ na ihe mere tupu nke a, mgbe ọtụtụ ndị na-eso ụzọ Jizọs hapụrụ ya; “Ya mere” na-echekwa echiche ahụ n'Igbo doro anya.
- source_word: τοῖς δώδεκα
  choice: Ndị Iri na Abụọ
  rationale: Okwu a bụ aha a maara nke ọma e ji akọwa ìgwè ndị Jizọs họpụtara nke dị mmadụ iri na abụọ; ọ dịghị mkpa ịgbakwunye “ndị na-eso ụzọ” n'amaokwu a.
- source_word: Μὴ καὶ ὑμεῖς
  choice: Unu onwe unu achọghịkwa …, ọ̀ bụ ya?
  rationale: “Unu onwe unu” na-egosipụta nkwusi ike dị na ὑμεῖς, “-kwa” na-anọchi καί, ebe ụdị ajụjụ na-adịghị mma na-egosipụta na μή na-atụ anya azịza na-adịghị mma n'ebughị ụzọ mee ya ka ọ bụrụ nkwupụta siri ike.
- source_word: θέλετε
  choice: achọghị
  rationale: Ngwaa “ịchọ” bụ ụzọ Igbo nkịtị si egosipụta ọchịchọ ma ọ bụ ịdị njikere n'ọnọdụ a; e tinyere ya n'ụdị na-adịghị mma n'ihi ụdị ajụjụ μή.
- source_word: ὑπάγειν
  choice: ịla
  rationale: “Ịla” na-egosi isi n'ebe Jizọs nọ pụọ, dịka ihe gbara amaokwu a gburugburu si kwado, ma ọ naghị akọwakwu ihe Grik ekwughị kpọmkwem.
theological_decisions:
- issue: Ike ajụjụ Jizọs nke μή malitere
  choice: Ajụjụ na-adịghị mma nke na-atụ anya azịza “mba,” ma ọ bụghị nkwupụta na-ekpebi azịza ha
  alternative: “Unu onwe unu chọkwara ịla?” nke bụ ajụjụ na-anọpụ iche karị
  rationale: N'Ajụjụ Grik, μή na-egosikarị na onye na-ajụ ajụjụ na-atụ anya azịza na-adịghị mma. Nsụgharị ahụ na-echekwa ntụgharị uche a, ma ihe odide ala peeji na-egosikwa ụzọ ọzọ nwere ike isi sụgharịa ya ka e ghara ikpochapụ nghọta ọzọ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta mee ihe. “Ndị Iri na Abụọ” ka e debere dịka aha pụrụ iche nke ìgwè ahụ. Akara ụda dị na “ọ̀” na-enyere onye na-agụ ya aka ịmata na ọ bụ ajụjụ.
