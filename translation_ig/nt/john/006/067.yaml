  to: Ya mere, Jizọs sịrị Ndị Iri na Abụọ, “Unu achọghịkwa ịla, ọ̀ bụghị ya?”[a]
  rationale: The revision changes only the Igbo confirmation tag to its idiomatic negative form and streamlines an unnecessary reflexive emphasis. The sentence continues to express Jesus’ question as expecting, but not demanding, a negative response; the footnote preserves the more neutral positive-question alternative.
