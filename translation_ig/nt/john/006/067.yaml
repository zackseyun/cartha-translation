review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents οὖν ('Ya mere'), the recognized designation τοῖς δώδεκα ('Ndị Iri na Abụọ'), and the movement-away sense of ὑπάγειν ('ịla'). Its negative interrogative appropriately conveys the expectation of a negative answer associated with μή without turning the question into an assertion.
  naturalness: The final tag 'ọ̀ bụ ya?' is less idiomatic for a negative Igbo tag question and can sound like a request for confirmation of a preceding proposition. 'ọ̀ bụghị ya?' is the natural negative tag corresponding to 'do you?' after 'achọghị.' Removing 'onwe unu' also produces smoother idiomatic Igbo while 'unu' and '-kwa' retain the contrastive/additive force adequately.
  terminology: '''Jizọs'' and ''Ndị Iri na Abụọ'' are appropriate Standard Igbo biblical forms. No theological terminology requires adjustment.'
  issues:
  - severity: medium
    issue: The negative-question tag is phrased as 'ọ̀ bụ ya?' rather than 'ọ̀ bụghị ya?'.
    rationale: Because the main clause is negative ('Unu achọghịkwa ...'), Standard Igbo naturally uses the negative confirmation tag 'ọ̀ bụghị ya?' This better reproduces the Greek negative question and avoids an awkward shift in polarity.
  revised_text: Ya mere, Jizọs sịrị Ndị Iri na Abụọ, “Unu achọghịkwa ịla, ọ̀ bụghị ya?”[a]
