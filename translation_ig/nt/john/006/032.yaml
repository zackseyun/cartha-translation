reference: John 6:32
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἶπεν οὖν αὐτοῖς ὁ Ἰησοῦς· Ἀμὴν ἀμὴν λέγω ὑμῖν, οὐ Μωϋσῆς ⸀δέδωκεν ὑμῖν τὸν ἄρτον ἐκ τοῦ οὐρανοῦ, ἀλλ’ ὁ πατήρ μου δίδωσιν ὑμῖν τὸν ἄρτον ἐκ τοῦ οὐρανοῦ τὸν ἀληθινόν·
base_translation:
  language: en
  yaml_path: translation/nt/john/006/032.yaml
  text: So Jesus said to them[a], “Truly, truly, I say to you, Moses has not given you the bread from heaven[b], but my Father gives you the true bread from heaven.”
translation:
  language: ig
  text: Ya mere Jizọs sịrị ha, “N’ezie, n’ezie, ana m asị unu, ọ bụghị Mosis[a] nyere unu achịcha ahụ si n’eluigwe; kama Nna m na-enye unu ezi achịcha ahụ[b] si n’eluigwe.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ọ bụghị Mosis bụ onye nyere unu achịcha ahụ si n’eluigwe.” N’asụsụ Grik, ngọnarị ahụ dị tupu “Mosis,” nke na-eme ka ọdịiche banyere onye nyere achịcha ahụ pụta ìhè.
    reason: lexical_alternative
  - marker: b
    text: “Ezi achịcha” nwekwara ike ịpụta achịcha “nke bụ n’ezie” ma ọ bụ “nke bụ ezigbo ya”—ya bụ, achịcha sitere n’eluigwe n’ezie, ọ bụghị naanị mana ahụ e nyere na mbụ, nke bụ ihe ịrịba ama.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Ya mere
  rationale: Ọ na-ejikọta okwu Jizọs na mkparịta ụka gara aga, ma na-egosi ihe si n’okwu ahụ pụta n’ụzọ Igbo nkịtị.
- source_word: Ἀμὴν ἀμὴν
  choice: N’ezie, n’ezie
  rationale: Ọ na-edebe nkwughachi na nkwusi ike dị n’usoro okwu Jọn, ma bụrụkwa okwu doro ndị na-agụ Igbo nke oge a anya.
- source_word: λέγω ὑμῖν
  choice: ana m asị unu
  rationale: Nke a bụ ntụgharị Igbo doro anya nke usoro okwu Grik ahụ, ma na-egosikwa na Jizọs na-ekwu okwu ahụ ugbu a.
- source_word: οὐ Μωϋσῆς δέδωκεν ὑμῖν
  choice: ọ bụghị Mosis nyere unu
  rationale: Itinye ngọnarị tupu ‘Mosis’ na-eme ka ọdịiche dị n’etiti onye nyere achịcha ahụ pụta ìhè, dị ka usoro okwu Grik si dị.
- source_word: τὸν ἄρτον ἐκ τοῦ οὐρανοῦ
  choice: achịcha ahụ si n’eluigwe
  rationale: Ọ bụ okwu Igbo e ji eme ihe nke ọma, na-edebekwa ihe atụ nke achịcha sitere n’eluigwe.
- source_word: ἀλλ’ ὁ πατήρ μου δίδωσιν ὑμῖν
  choice: kama Nna m na-enye unu
  rationale: ‘Na-enye’ na-egosipụta omume dị ugbu a nke δίδωσιν, ma ‘kama’ na-edobe ọdịiche siri ike dị n’etiti Mosis na Nna.
- source_word: ὁ πατήρ μου
  choice: Nna m
  rationale: Nke a bụ ụzọ Igbo ebumpụta ụwa si egosipụta njikọ ahụ, ma na-edobe okwu pụrụ iche Jizọs kwuru banyere Nna ya.
- source_word: τὸν ἀληθινόν
  choice: ezi
  rationale: N’ebe a, ‘ezi’ nwere ike ịpụta nke bụ eziokwu, nke bụ n’ezie, ma ọ bụ nke zuru oke; ọ na-edobe obosara ihe ἀληθινός pụtara n’Oziọma Jọn.
theological_decisions:
- issue: Ọdịiche dị n’etiti ihe e jikọtara na Mosis n’oge gara aga na ihe Nna na-enye ugbu a
  choice: A sụgharịrị ya ‘ọ bụghị Mosis nyere unu ... kama Nna m na-enye unu,’ ka omume Nna na-eme ugbu a pụta ìhè.
  alternative: ‘Mosis enyeghị unu ... kama Nna m nyere unu.’
  rationale: Nhọrọ a na-edobe ọdịiche dị n’etiti perfect δέδωκεν na present δίδωσιν ruo ókè usoro ngwaa Igbo na-ekwe, n’etinyeghị nkọwa ozizi ọzọ.
- issue: Ihe ‘ezi achịcha’ pụtara
  choice: E debere ‘ezi achịcha’ n’ahịrịokwu bụ isi.
  alternative: ‘achịcha nke bụ n’ezie’ ma ọ bụ ‘achịcha zuru oke.’
  rationale: ‘Ezi achịcha’ na-ahapụ ohere ka ἀληθινός pụta ihe dịka ‘eziokwu,’ ‘nke bụ n’ezie,’ ma ọ bụ ihe ikpeazụ ihe mbụ na-atụ aka na ya, n’emeghị ka ihe ọ pụtara bụrụ naanị otu nkọwa.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. E debere nkwughachi ‘N’ezie, n’ezie,’ ọdịiche dị n’etiti Mosis na Nna, na nghọta sara mbara nke ‘ezi achịcha.’
