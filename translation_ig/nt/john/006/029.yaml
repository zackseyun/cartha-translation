  text: ἀπεκρίθη ⸀ὁ Ἰησοῦς καὶ εἶπεν αὐτοῖς· Τοῦτό ἐστιν τὸ ἔργον τοῦ θεοῦ ἵνα ⸀πιστεύητε εἰς ὃν ἀπέστειλεν ἐκεῖνος.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/029.yaml
  text: 'Jesus answered and said to them[b][a], “This is the work of God: that you believe in the one whom he has sent.”'
translation:
  language: ig
  text: 'Jizọs zara ha sị, “Nke a bụ ọrụ Chineke[a]: ka unu kwere n’Onye ahụ o zitere[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ọrụ Chineke chọrọ” ma ọ bụ “ọrụ Chineke na-arụ.” Akpaokwu Grik ahụ, “ọrụ Chineke,” nwere ike inwe nghọta karịa otu; okwu e ji sụgharịa ya ebe a na-edobe nghọta abụọ ahụ.
    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ, “ka unu tụkwasị Onye ahụ o zitere obi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη ὁ Ἰησοῦς καὶ εἶπεν αὐτοῖς
  choice: Jizọs zara ha sị
  rationale: Nke a bụ ụzọ Igbo si ekwu okwu n’ụzọ ebumpụta ụwa, ma ọ ka na-egosipụta echiche ngwaa abụọ Grik ahụ, ‘zara’ na ‘sị.’
- source_word: Τοῦτό ἐστιν
  choice: Nke a bụ
  rationale: Ọ na-egosipụta okwu nrụtụ aka na ngwaa njikọ ahụ ozugbo, ma na-edobe nkwusi okwu ahụ.
- source_word: τὸ ἔργον τοῦ θεοῦ
  choice: ọrụ Chineke
  rationale: 'Nke a na-esochi njikọ genitive Grik nke ọma ma na-ahapụ ajụjụ ahụ ghe oghe: ọ pụrụ ịbụ ọrụ Chineke chọrọ ka mmadụ rụọ ma ọ bụ ọrụ Chineke n’onwe ya na-arụ.'
- source_word: ἵνα
  choice: ka
  rationale: ‘Ka’ na-ewebata ọdịnaya nke ọrụ ahụ n’Igbo n’ụzọ dị mfe ma kwekọọ n’ọrụ ἵνα n’ebe a.
- source_word: πιστεύητε εἰς ὃν
  choice: unu kwere n’Onye ahụ
  rationale: ‘Kwere na’ bụ ụzọ Igbo a na-ahụkarị maka πιστεύω εἰς; ‘Onye ahụ’ na-edobe na ihe a na-ekwu banyere ya bụ mmadụ kpọmkwem.
- source_word: ἀπέστειλεν ἐκεῖνος
  choice: o zitere
  rationale: Nnọchiaha ‘o’ na-ezo aka na Chineke dịka ἐκεῖνος si eme; oge gara aga ‘zitere’ dabara n’Igbo ma okwu gbara ya gburugburu na-egosi mkpa iziga ahụ ka dị ugbu a.
theological_decisions:
- issue: Ihe ‘ọrụ Chineke’ (τὸ ἔργον τοῦ θεοῦ) pụtara
  choice: E debere ‘ọrụ Chineke’ n’ahịrịokwu bụ isi ka nghọta ya abụọ nọgide.
  alternative: ‘ọrụ Chineke chọrọ’ ma ọ bụ ‘ọrụ Chineke na-arụ’
  rationale: Genitive Grik ahụ pụrụ igosi ọrụ Chineke chọrọ n’aka mmadụ ma ọ bụ ọrụ Chineke n’onwe ya na-eme. E kwesịghị iji ntụgharị kpebie esemokwu nkà mmụta okpukpe ahụ.
- issue: Ntụgharị πιστεύητε εἰς
  choice: ‘unu kwere n’Onye ahụ’
  alternative: ‘unu tụkwasị Onye ahụ obi’
  rationale: ‘Kwere na’ na-anọchi πιστεύω εἰς nke ọma ma bụrụkwa okwu Ndị Kraịst na ndị na-agụ Igbo maara; ‘tụkwasị obi’ na-eme ka akụkụ ntụkwasị obi pụta ìhè ma bụrụ ezigbo ntụgharị ọzọ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe ma dị nsọpụrụ. ‘Jizọs zara ha sị’ bụ usoro okwu ebumpụta ụwa; e zere okwu ụka pụrụ iche nke otu nzukọ. Akara nkọwa ala peeji [a] na [b] dị n’ahịrịokwu bụ isi.
