  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οὐχ ὅτι τὸν πατέρα ⸂ἑώρακέν τις⸃ εἰ μὴ ὁ ὢν παρὰ τοῦ θεοῦ, οὗτος ἑώρακεν τὸν πατέρα.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/046.yaml
  text: Not that anyone has seen the Father[a], except the one who is from God; he has seen the Father.
translation:
  language: ig
  text: Ọ bụghị na onye ọ bụla ahụla Nna, ma e wezụga onye sitere na Chineke[a]; onye ahụ ahụla Nna.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịtụgharị ya, “site n’ebe Chineke nọ,” ma ọ bụ “onye nọ n’akụkụ Chineke.” Okwu Grik ahụ nwere ike igosi ma ebe onye ahụ si ma mmekọrịta nke ịdị Chineke nso.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐχ ὅτι
  choice: Ọ bụghị na
  rationale: Nke a na-ewebata nkọwa na-edozi nghọtahie nwere ike isi n’okwu bu ụzọ pụta; ọ bụghị ahịrịokwu na-enye ihe kpatara ihe.
- source_word: τὸν πατέρα
  choice: Nna
  rationale: Nke a bụ ụzọ Jọn si akpọ Chineke dị ka Nna. Mkpụrụedemede ukwu na-egosi na ọ bụ aha nsọ e ji ekwu banyere Chineke.
- source_word: ἑώρακέν τις
  choice: onye ọ bụla ahụla
  rationale: N’ahịrịokwu a jụrụ ajụ, τις pụtara ‘onye ọ bụla’; ‘ahụla’ na-egosipụta ihe e mere nke ihe ọ pụtara ka dịgide.
- source_word: εἰ μὴ
  choice: ma e wezụga
  rationale: N’ebe a, okwu ahụ na-egosi onye a kpọpụrụ iche, ọ bụghị ọnọdụ a na-etinye.
- source_word: ὁ ὢν
  choice: onye ahụ nke
  rationale: Ọ na-akọwa otu onye a maara site ná mmekọrịta ma ọ bụ ọnọdụ ya; usoro a bụ nke doro anya ma dịkwa mma n’Igbo.
- source_word: παρὰ τοῦ θεοῦ
  choice: si n’ebe Chineke bịa
  rationale: παρά tinyere genitive nwere ike igosi isi mmalite ma nwee echiche nke ịnọ Chineke nso. Nhọrọ a na-ekwu n’ụzọ ebumpụta ụwa na onye ahụ sitere n’ebe Chineke nọ, na-akọwaghị mmekọrịta ahụ karịa ihe Grik kwuru.
- source_word: οὗτος
  choice: onye ahụ
  rationale: Ọ na-atụ aka n’ụzọ siri ike n’onye a ka kpọtụrụ aha; ‘onye ahụ’ na-echekwa nrụgide a nke ọma n’Igbo.
- source_word: ἑώρακεν
  choice: ahụla
  rationale: Ụdị perfect nke Grik na-egosi omume e mezuru nke mkpa ya ka dị ugbu a; ‘ahụla’ na-ebute nke a nke ọma n’Igbo.
theological_decisions:
- issue: Mmekọrịta nke Ọkpara na Chineke n’okwu παρὰ τοῦ θεοῦ
  choice: si n’ebe Chineke bịa
  alternative: sitere n’ihu Chineke; ya na Chineke nọ
  rationale: Isiokwu ahụ na-ekwu banyere isi mmalite pụrụ iche na ịdị Chineke nso, ma okwu bụ isi ekwesịghị ịkọwapụta kpọmkwem ihe gbasara ọdịdị mmekọrịta ahụ karịa ka Grik mere. Ihe odide ala peeji na-echekwa nghọta nke ịnọ n’ihu Chineke ma ọ bụ ịnọnyere ya.
translation_notes:
  register: E ji Igbo Izugbe dị ugbu a, nke dị ùgwù ma dị mfe nghọta. A hapụrụ ‘Ọ bụghị na’ ka ọ debe ike nkọwa mmezi dị na οὐχ ὅτι, ebe ‘si n’ebe Chineke bịa’ na-ejikọta nghọta nke isi mmalite na nke ịdị nso n’enweghị itinye nkọwa ozizi ọzọ.
