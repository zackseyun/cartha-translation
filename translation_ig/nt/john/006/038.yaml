id: JHN.6.38
reference: John 6:38
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὅτι καταβέβηκα ⸀ἀπὸ τοῦ οὐρανοῦ οὐχ ἵνα ποιῶ τὸ θέλημα τὸ ἐμὸν ἀλλὰ τὸ θέλημα τοῦ πέμψαντός με·
base_translation:
  language: en
  yaml_path: translation/nt/john/006/038.yaml
  text: For I have come down from heaven, not to do my own will, but the will of the one who sent me.
translation:
  language: ig
  text: N’ihi na esila m n’eluigwe rịdata, ọ bụghị ka m mee uche nke m, kama ka m mee uche onye zitere m.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι
  choice: N’ihi na
  rationale: N’ebe a, ὅτι na-enye ihe kpatara okwu bu ụzọ; “N’ihi na” na-egosipụta njikọ ahụ n’Igbo nkịtị.
- source_word: καταβέβηκα
  choice: esila m ... rịdata
  rationale: Ụdị perfect a na-egosi omume e mezuru nke ka nwere mkpa ugbu a. “Esila m ... rịdata” na-echekwa ma echiche nke isi n’elu gbadata ma mkpa ya ruo ugbu a.
- source_word: ἀπὸ τοῦ οὐρανοῦ
  choice: n’eluigwe
  rationale: Nke a bụ ụzọ Igbo dị mfe ma kwekọọ n’asụsụ isi kwuo ebe o si bịa, na-echekwakwa onyinyo nke mbido eluigwe.
- source_word: οὐχ ἵνα ποιῶ
  choice: ọ bụghị ka m mee
  rationale: 'Nke a na-egosipụta nzube a jụrụ: ọ bụghị n’ihi nzube ime ihe ahụ.'
- source_word: τὸ θέλημα τὸ ἐμὸν
  choice: uche nke m
  rationale: “Uche” na-egosipụta ọchịchọ ma ọ bụ ebumnuche mmadụ. Nhazi “nke m” na-eme ka ọdịiche dị n’etiti uche Jizọs na uche onye zitere ya pụta ìhè.
- source_word: ἀλλὰ
  choice: kama
  rationale: “Kama” na-egosipụta ntụgharị na ọdịiche siri ike dị n’etiti nzube abụọ ahụ.
- source_word: τὸ θέλημα τοῦ πέμψαντός με
  choice: uche onye zitere m
  rationale: Nke a na-asụgharị articular participle ahụ n’ụzọ Igbo doro anya, n’etinyeghị aha ma ọ bụ nkọwa nke Grik ekwughị kpọmkwem.
theological_decisions:
- issue: Mgbadata Jizọs site n’eluigwe na ihe ọ pụtara banyere onye ọ bụ
  choice: “Esila m n’eluigwe rịdata”
  alternative: Ịkọwa ya naanị dị ka ihe atụ nke izite ya n’ozi Chineke
  rationale: A hapụrụ nkwupụta ahụ dị ka okwu doro anya banyere mbido eluigwe, n’emeghị ka ọ bụrụ naanị okwu atụ banyere ọrụ e nyere ya.
- issue: Mmekọrịta dị n’etiti uche Jizọs na uche onye zitere ya
  choice: E ji “uche” mee ihe ugboro abụọ ma chekwaa ọdịiche ahụ
  alternative: Ịsụgharị ya dị ka “ihe m chọrọ” na “ihe ọ chọrọ,” ma ọ bụ ịkọwa otú uche abụọ ahụ si kwekọọ
  rationale: Nkwughachi otu mkpụrụokwu ahụ na-echekwa nhazi na esemokwu nkà mmụta okpukpe dị n’amaokwu ahụ, n’akọwaghị ya karịa ihe ederede kwuru.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E ji “rịdata” chekwaa ntụaka nke mgbadata site n’elu, ebe “esila m” na-egosipụta omume e mezuru nke ka dị mkpa ugbu a.
