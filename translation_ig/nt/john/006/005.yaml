id: JHN.6.5
reference: John 6:5
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐπάρας οὖν ⸂τοὺς ὀφθαλμοὺς ὁ Ἰησοῦς⸃ καὶ θεασάμενος ὅτι πολὺς ὄχλος ἔρχεται πρὸς αὐτὸν λέγει ⸀πρὸς Φίλιππον· Πόθεν ⸀ἀγοράσωμεν ἄρτους ἵνα φάγωσιν οὗτοι;
base_translation:
  language: en
  yaml_path: translation/nt/john/006/005.yaml
  text: So Jesus[a], lifting up his eyes and seeing that a large crowd was coming toward him, said to Philip[c][b], “Where are we to buy bread so that these may eat?”
translation:
  language: ig
  text: Ya mere, Jizọs weliri anya ya, hụ na nnukwu ìgwè mmadụ na-abịakwute ya, wee sị Filip, “Olee ebe anyị ga-esi zụta achịcha[a] ka ndị a rie?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ogbe achịcha.” Okwu Grik ahụ nwere ike ịpụta achịcha n’ozuzu ya ma ọ bụ ogbe achịcha dị iche iche.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπάρας ... τοὺς ὀφθαλμοὺς
  choice: weliri anya ya
  rationale: Nke a na-edobe akpaalaokwu Grik nke pụtara ‘iweli anya,’ ma na-ada nke ọma n’Igbo.
- source_word: οὖν
  choice: Ya mere
  rationale: Ọ na-egosi njikọ na ihe a kọrọ tupu ya; ‘Ya mere’ na-edobe ike njikọ ahụ n’Igbo doro anya.
- source_word: θεασάμενος
  choice: hụ
  rationale: Okwu a na-egosi ile anya ma ghọta ihe a hụrụ. ‘Hụ’ dị nkenke ma kwekọọ n’usoro akụkọ a.
- source_word: πολὺς ὄχλος
  choice: nnukwu ìgwè mmadụ
  rationale: Nke a na-egosi ìgwè mmadụ dị ọtụtụ, ọ bụghị ịdị ukwuu n’ọkwa ma ọ bụ n’otuto.
- source_word: ἔρχεται πρὸς αὐτόν
  choice: na-abịakwute ya
  rationale: Ọ na-edobe omume na-aga n’ihu na ntụziaka πρός, ya bụ, ịbịa n’ebe ọ nọ.
- source_word: λέγει πρὸς Φίλιππον
  choice: wee sị Filip
  rationale: A tụgharịrị historical present ahụ dịka oge gara aga n’akụkọ Igbo, ebe ‘wee’ na-eme ka usoro omume doo anya.
- source_word: Πόθεν ἀγοράσωμεν
  choice: Olee ebe anyị ga-esi zụta
  rationale: ‘Ebe ... ga-esi’ na-egosipụta echiche nkịtị nke Πόθεν, ‘site ebee,’ ma bụrụkwa Igbo e ji eme ihe taa.
- source_word: ἄρτους
  choice: achịcha
  rationale: Okwu Grik ahụ nwere ike ịpụta achịcha n’ozuzu ma ọ bụ ogbe achịcha dị iche iche; ‘achịcha’ na-ahapụ obosara ihe okwu ahụ pụtara.
- source_word: ἵνα φάγωσιν οὗτοι
  choice: ka ndị a rie
  rationale: ‘Ka’ na-egosipụta ebumnuche nke ἵνα, ebe ‘ndị a’ na-edobe ntụaka kpọmkwem nke οὗτοι.
theological_decisions:
- issue: Usoro participle na historical present n’akụkọ
  choice: E ji ‘weliri ... hụ ... wee sị’ mee ka usoro omume pụta ìhè n’Igbo.
  alternative: 'Ịsụgharị ya n’ụdị dị nso n’usoro Grik: ‘Jizọs, ebe o weliri anya ya ma hụ ..., na-asị Filip.’'
  rationale: Nhọrọ a bụ nke asụsụ na usoro akụkọ, ọ bụghị mkpebi ozizi. Ọ na-eme ka Igbo dị mfe nghọta ma na-edobe usoro omume ndị dị na Grik.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta, mee ihe. A zere okwu ochie na nkọwa na-agbakwụnye ozizi na-adịghị na isi mmalite.
