  rationale: The revision replaces ‘stayed’ with ‘sat down’ to represent ἐκάθητο faithfully and uses a natural comitative construction for ‘with his disciples.’ It retains the narrative progression, the specific but unnamed mountain, and the unembellished register of the Greek.
