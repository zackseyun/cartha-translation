base_translation:
  language: en
  yaml_path: translation/nt/john/006/003.yaml
  text: Then Jesus went up on the mountain, and there he sat with his disciples.
translation:
  language: ig
  text: Mgbe ahụ, Jizọs rịgoro n’ugwu ahụ, ma nọdụ ala n’ebe ahụ ya na ndị na-eso ụzọ ya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνῆλθεν
  choice: rịgoro
  rationale: Okwu a na-egosi ịrịgo n’ebe dị elu; “rịgoro” bụ okwu Igbo dị mfe ma kwekọọ na mmegharị nkịtị a.
- source_word: δὲ
  choice: Mgbe ahụ
  rationale: N’ebe a, δέ na-eme ka akụkọ gaa n’ihu, ọ bụghị igosi nnukwu mmegide; “Mgbe ahụ” na-egosipụta usoro akụkọ ahụ nke ọma.
- source_word: εἰς τὸ ὄρος
  choice: n’elu ugwu ahụ
  rationale: Ya na ngwaa ịrịgo, nkebi a na-egosi ịrịgo ruo n’ugwu ahụ. “Ugwu ahụ” na-echekwa njirimara nke edemede Grik ahụ n’enyeghị ugwu ahụ aha.
- source_word: Ἰησοῦς
  choice: Jizọs
  rationale: Nke a bụ nsụgharị aha ahụ a na-ejikarị eme ihe n’Igbo ọkọlọtọ.
- source_word: ἐκεῖ
  choice: n’ebe ahụ
  rationale: Nke a bụ ụzọ Igbo doro anya ma bụrụkwa nke nkịtị isi kọwaa ọnọdụ ahụ.
- source_word: ἐκάθητο
  choice: nọrọ
  rationale: N’ọnọdụ a, “nọrọ” na-egosi na Jizọs nọdụrụ ma biri n’ebe ahụ n’ụzọ dị mma n’Igbo, na-enweghị ime ka okwu ahụ sie ike ma ọ bụ bụrụ nke emume.
- source_word: μετὰ τῶν μαθητῶν αὐτοῦ
  choice: soro ndị na-eso ụzọ ya
  rationale: “Soro” na-egosi mmekọrịta μετά, ebe “ndị na-eso ụzọ ya” bụ okwu Igbo a maara nke ọma maka ndị na-amụ ihe site n’iso onye nkuzi ha.
