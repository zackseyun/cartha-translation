  text: Καὶ εὑρόντες αὐτὸν πέραν τῆς θαλάσσης εἶπον αὐτῷ· Ῥαββί, πότε ὧδε γέγονας;
base_translation:
  language: en
  yaml_path: translation/nt/john/006/025.yaml
  text: And when they found him on the other side of the sea[a], they said to him, “Rabbi, when did you get here?”
translation:
  language: ig
  text: Mgbe ha chọtara ya n’ofe oke osimiri ahụ, ha sịrị ya, “Rabaị, olee mgbe ị bịarutere ebe a?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ, “Olee mgbe ị bịaworo ebe a?” Ngwaa Grik ahụ dị n’ụdị perfect, nke a pụrụ ịsụgharị n’ụzọ na-esochi ọdịdị ya nso karị otú ahụ; ma n’ebe a, ihe ọ pụtara n’okwu nkịtị bụ mmadụ ịbịarute: “Olee mgbe ị bịarutere ebe a?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ εὑρόντες αὐτόν
  choice: Mgbe ha chọtara ya
  rationale: A sụgharịrị participle aorist ahụ dị ka nkebiokwu na-egosi oge. Nke a na-egosi na ịchọta ya bu ụzọ tupu ha agwa ya okwu, ma na-ada nke ọma n’Igbo.
- source_word: πέραν τῆς θαλάσσης
  choice: n’akụkụ nke ọzọ nke osimiri ahụ
  rationale: πέραν na genitive na-egosi ebe dị n’ofe mmiri ahụ. Nkebiokwu a doro anya n’Igbo ma chekwaa ọdịiche ala dị na akụkọ ahụ.
- source_word: εἶπον αὐτῷ
  choice: ha sịrị ya
  rationale: Nke a na-anọ nso n’ihe λέγω pụtara, bụ́ ‘ịsị’ ma ọ bụ ‘ikwu,’ kama ịtụgharị ya ozugbo ka ‘ha jụrụ ya,’ ọ bụ ezie na okwu so ya bụ ajụjụ.
- source_word: Ῥαββί
  choice: Rabaị
  rationale: E debere aha nsọpụrụ ndị Juu a n’ụdị mkpụrụokwu Igbo kama ịkọwa ya naanị dị ka ‘Onye Ozizi,’ ka ọnọdụ omenala okwu ahụ ghara ifunahụ.
- source_word: πότε ὧδε γέγονας
  choice: olee mgbe ị bịarutere ebe a?
  rationale: N’ọnọdụ a, perfect nke γίνομαι na-ekwu maka mmadụ ịbịa ma nọrọ n’ebe ahụ. ‘Ị bịarutere ebe a’ bụ ụzọ Igbo doro anya ma bụrụkwa nke e ji ekwu okwu kwa ụbọchị.
theological_decisions: []
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. ‘Rabaị’ na-echekwa aha nsọpụrụ na ọnọdụ ndị Juu; ‘ha sịrị ya’ na-echekwa usoro okwu Grik n’enweghị ịgbakwunye nkọwa.
