  yaml_path: translation/nt/john/006/037.yaml
  text: All that the Father gives me will come to me[b][a], and the one who comes to me I will certainly not cast out.
translation:
  language: ig
  text: Ihe niile Nna na-enye m ga-abịakwute m,[a] ma agaghị m achụpụ onye na-abịakwute m ma ọlị.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “Ndị niile Nna na-enye m ga-abịakwute m.” N’asụsụ Grik, owuwu a dị n’ụdị etiti nke otu, ma ọ na-arụ ọrụ dịka mkpokọta.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ọ dịghị mgbe m ga-achụpụ onye na-abịakwute m,” ma ọ bụ, “agaghị m achụpụ onye na-abịakwute m n’ụzọ ọ bụla.” Okwu Grik e ji ebe a bụ nkwenye siri ike.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶν ὃ
  choice: Ihe niile
  rationale: Nkebi okwu Grik a bụ otu okwu nnọchiaha nke ụdị etiti, ma ọ na-arụ ọrụ dịka mkpokọta. “Ihe niile” na-echekwa ọdịdị mkpokọta ahụ kama ịgbanwe ya ozugbo ka ọ bụrụ naanị ndị mmadụ.
- source_word: δίδωσίν μοι
  choice: Nna na-enye m
  rationale: Oge ugbu a nke ngwaa Grik ka e ji “na-enye m” gosi, n’enweghị ịkọwa ya dịka ihe na-aga n’ihu naanị ma ọ bụ ihe e mechaworị.
- source_word: ὁ πατήρ
  choice: Nna
  rationale: “Nna” bụ ụzọ ebumpụta ụwa e si ekwu aha a n’Igbo n’ọnọdụ a. E tinyeghị “m” n’ihi na Grik ekwughị kpọmkwem “Nna m.”
- source_word: πρὸς ἐμὲ ἥξει
  choice: ga-abịakwute m
  rationale: Nke a bụ Igbo doro anya ma bụrụkwa nke ebumpụta ụwa maka ịbịakwute mmadụ; ọ na-echekwa oge ọdịnihu nke ἥξει.
- source_word: τὸν ἐρχόμενον πρός με
  choice: onye ahụ na-abịakwute m
  rationale: Okwu a na-anọchi anya onye na-eme ihe ahụ n’ụzọ izugbe, dị ka participle Grik nwere article si dị.
- source_word: οὐ μὴ ἐκβάλω ἔξω
  choice: agaghị m achụpụ ya ma ọlị
  rationale: “Ma ọlị” na-egosipụta nkwughachi siri ike nke οὐ μή. “Achụpụ” na-eburu echiche nke ịchụpụ n’èzí nke ἐκβάλω ἔξω n’Igbo ebumpụta ụwa.
theological_decisions:
- issue: Mkpokọta nke ụdị etiti πᾶν ὃ n’ihe gbasara ihe Nna na-enye na ndị na-abịakwute Jizọs
  choice: Ihe niile Nna na-enye m
  alternative: Ndị niile Nna na-enye m
  rationale: Isi ntụgharị ahụ na-echekwa ụdị mkpokọta nke Grik, ebe nkọwa ala peeji na-egosi na a pụrụ ịghọta ya gbasara ndị mmadụ. Nke a anaghị ekpebi ma okwu ahụ na-elekwasị anya n’otu ìgwè dịka mkpokọta ma ọ bụ n’otu onye n’otu onye.
- issue: Ike nke nkwa dị na οὐ μὴ ἐκβάλω ἔξω
  choice: agaghị m achụpụ ya ma ọlị
  alternative: ọ dịghị mgbe m ga-achụpụ ya
  rationale: Nke a na-echekwa nkwughachi siri ike nke Grik n’enweghị ịgbasa amaokwu ahụ ka ọ kụzie echiche ụka ndị ọzọ gbasara nnọgidesi ike ma ọ bụ ịdapụ n’okwukwe.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta mee ihe. “Bịakwute m” na “achụpụ ya ma ọlị” bụ okwu ebumpụta ụwa nye ndị na-agụ Igbo taa; a hapụrụ esemokwu dị n’ụdị mkpokọta πᾶν ὃ ka ọ dị, ma kọwaa ya n’ala peeji.
