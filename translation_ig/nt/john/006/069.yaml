- from: Anyị onwe anyị ekwerekwala, marakwa na ọ bụ gị bụ Onye Nsọ nke Chineke[a][b].
  to: anyị onwe anyị ekweela ma matakwa na ị bụ Onye Nsọ nke Chineke[a][b].
  rationale: The revision changes only the verb coordination for clear, natural Standard Igbo. It retains the explicit emphatic subject, the perfect-result sense of both Greek verbs, the direct title «Onye Nsọ nke Chineke», and both footnote anchors and contents.
