id: JHN.6.69
reference: John 6:69
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἡμεῖς πεπιστεύκαμεν καὶ ἐγνώκαμεν ὅτι σὺ εἶ ὁ ⸀ἅγιος τοῦ ⸀θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/069.yaml
  text: And we have believed and have come to know that you are the Holy One of God[a][b].
translation:
  language: ig
  text: anyị onwe anyị ekweela ma matakwa na ị bụ Onye Nsọ nke Chineke[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ụfọdụ akwụkwọ aka ochie gụrụ, “Kraịst ahụ, Ọkpara Chineke dị ndụ.”
    reason: textual_variant
  - marker: b
    text: Ma ọ bụ, “Onye Nsọ si n'aka Chineke.” Genitive Grik nwere ike igosi mmekọrịta ma ọ bụ ebe ihe si.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμεῖς
  choice: Anyị onwe anyị
  rationale: Nnọchiaha ahụ e dere kpọmkwem n'asụsụ Grik na-emesi ‘anyị’ ike; ‘Anyị onwe anyị’ na-echekwa mmesi ike ahụ n'Igbo n'ụzọ doro anya.
- source_word: πεπιστεύκαμεν
  choice: ekwerekwala
  rationale: Oge perfect na-egosi nkwere malitere n'oge gara aga ma ka na-adịgide; ‘ekwerekwala’ na-egosi na ha eruola n'ọnọdụ nkwere ahụ.
- source_word: ἐγνώκαμεν
  choice: marakwa
  rationale: Perfect nke γινώσκω na-egosi ihe ha bịara mata nke ha ka maara ugbu a; n'Igbo, ‘marakwa’ na-arụpụta echiche a n'ụzọ dị mfe ma dị ndụ.
- source_word: ὅτι
  choice: na
  rationale: ‘Na’ na-ebute ọdịnaya nke ihe ha kweere ma mara, dịka ὅτι si arụ ọrụ n'ahịrịokwu a.
- source_word: ὁ ἅγιος
  choice: Onye Nsọ
  rationale: Nke a bụ aha pụrụ iche nke na-egosi onye Chineke kewapụrụ iche; ‘Onye Nsọ’ na-echekwa ịdị arọ na nsọpụrụ nke aha ahụ.
- source_word: τοῦ θεοῦ
  choice: nke Chineke
  rationale: ‘Nke Chineke’ na-echekwa njikọ genitive ahụ ka ọ saa mbara, na-enweghị ịmanye naanị echiche isi n'ebe Chineke bịa.
theological_decisions:
- issue: Aha e nyere Kraịst na Jọn 6:69
  choice: Onye Nsọ nke Chineke
  alternative: Onye Nsọ si n'aka Chineke; Kraịst ahụ, Ọkpara Chineke dị ndụ
  rationale: SBLGNT nwere ὁ ἅγιος τοῦ θεοῦ. A sụgharịrị ya ozugbo dịka aha pụrụ iche, na-ejikọghị ya na Matiu 16:16 ma ọ bụ n'ọgụgụ ndị e mesịrị. ‘Nke Chineke’ na-ahapụ ụdị njikọ genitive ahụ ka ọ nwee nghọta mmekọrịta ma ọ bụ isi mmalite.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe ma nwee ugwu, dee ya. ‘Anyị onwe anyị’ na-echekwa mmesi ike nke ἡμεῖς; ‘ọ bụ gị bụ’ na-emesi σὺ ike n'ụzọ e ji ekwu Igbo. Akara nkọwa ala [a] na [b] dị n'ahịrịokwu ahụ.
