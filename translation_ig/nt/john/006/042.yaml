  text: καὶ ἔλεγον· ⸀Οὐχ οὗτός ἐστιν Ἰησοῦς ὁ υἱὸς Ἰωσήφ, οὗ ἡμεῖς οἴδαμεν τὸν πατέρα καὶ τὴν μητέρα; πῶς ⸀νῦν ⸀λέγει ὅτι Ἐκ τοῦ οὐρανοῦ καταβέβηκα;
base_translation:
  language: en
  yaml_path: translation/nt/john/006/042.yaml
  text: And they were saying, “Is this not Jesus, the son of Joseph, whose father and mother we know? How does he now say, ‘I have come down from heaven’?”
translation:
  language: ig
  text: Ha nọ na-ekwu, sị, “Ọ bụghị Jizọs a bụ nwa Josef, onye anyị maara nna ya na nne ya? Oleezi otú o si na-ekwu ugbu a, sị, ‘Esila m n’eluigwe rịdata’?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγον
  choice: Ha nọkwa na-ekwu
  rationale: Oge imperfect na-egosi okwu na-aga n’ihu ma ọ bụ nke a na-ekwughachi; ‘nọkwa na-ekwu’ na-echekwa akụkụ a n’Igbo dị ndụ.
- source_word: Οὐχ οὗτός ἐστιν
  choice: Ọ bụghị ... a bụ
  rationale: Nke a bụ ụzọ Igbo nkịtị si ajụ ajụjụ na-atụ anya nkwenye, ma na-echekwa ike ajụjụ Grik ahụ.
- source_word: ὁ υἱὸς Ἰωσήφ
  choice: nwa Josef
  rationale: Ọ na-asụgharị njikọ ahụ n'ụzọ doro anya ma na-eme ka isi okwu ndị mmadụ banyere ezinụlọ mmadụ Jizọs pụta ìhè.
- source_word: οὗ ἡμεῖς οἴδαμεν τὸν πατέρα καὶ τὴν μητέρα
  choice: onye anyị maara nna ya na nne ya
  rationale: Nke a bụ Igbo ebumpụta ụwa nke na-echekwa nkebi njikọ ahụ na nkwupụta ha na ha maara nne na nna ya.
- source_word: πῶς νῦν λέγει
  choice: Oleezi otú o si na-ekwu ugbu a
  rationale: ‘Olee otú’ na-echekwa ihe πῶς pụtara n'ụzọ bụ isi; ‘na-ekwu ugbu a’ na-egosipụta present λέγει na νῦν n’etinyeghị echiche mgbakwunye dịka ‘ọ ga-esi nwee ike.’
- source_word: Ἐκ τοῦ οὐρανοῦ
  choice: n’eluigwe
  rationale: N’ime okwu ngagharị ‘Esi m ... rịdata,’ n’eluigwe na-egosi ebe mbido n’ụzọ Igbo dị mma ma kwekọọ na ἐκ τοῦ οὐρανοῦ.
- source_word: καταβέβηκα
  choice: Esi m ... rịdata
  rationale: Ihe owuwu a na-egosi nrịdata e mechaala nke ka metụtara ọnọdụ ugbu a, ma dịkwa mfe nghọta karịa okwu teknịk.
theological_decisions:
- issue: Okwu ndị mmadụ ji jụ nzọrọ Jizọs banyere ebe o si bịa
  choice: ‘Esi m n’eluigwe rịdata’ ka e debere dịka nzọrọ kpọmkwem.
  alternative: ‘Esi m n’eluigwe bịa’ ma ọ bụ nkọwa na-ewere ya naanị dịka ihe atụ.
  rationale: Grik ahụ kwuru nrịdata site n’eluigwe n’enweghị nkọwa na-eme ka ọ bụrụ naanị ihe atụ. Nsụgharị ahụ na-echekwa esemokwu dị n’etiti ihe ndị mmadụ chere na ha maara banyere ezinụlọ Jizọs na ihe ọ kwuru banyere ebe o si bịa, n’enweghị itinye nkọwa ụka pụrụ iche.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji ‘Jizọs’ na ‘Josef’ dịka ụdị aha ndị a na-ahụkarị n’Igbo. ‘Ha nọkwa na-ekwu’ na-enye imperfect ahụ ụda okwu na-aga n’ihu; ‘Oleezi otú’ na-egosipụta mgbagwoju anya na mmegide ndị na-ekwu okwu.
