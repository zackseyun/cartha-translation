revisions:
- from: Ha banyere n’ụgbọ mmiri, na-aga n’ofe osimiri ahụ ruo Kapanọm.[a] Ọchịchịrị abịalarị, ma Jizọs abịakwutebeghị ha.[b]
  to: Ha banyere n’ụgbọ mmiri, na-agafe osimiri ahụ na-aga Kapanọm.[a] Ọchịchịrị abịalarị, Jizọs abịabeghịkwa ebe ha nọ.[b]
  rationale: 'The revision preserves the Greek aorist-participle-plus-imperfect sequence in idiomatic Igbo: they boarded, then were making their way across the sea toward Capernaum. It also keeps the already-established darkness and Jesus’ still-not-arriving at their location. No interpretive or doctrinal expansion has been introduced.'
  reviewer_model: gpt-5.6-terra
