  text: καὶ ἐμβάντες ⸀εἰς πλοῖον ἤρχοντο πέραν τῆς θαλάσσης εἰς Καφαρναούμ. καὶ σκοτία ἤδη ἐγεγόνει καὶ ⸀οὔπω ἐληλύθει πρὸς αὐτοὺς ὁ Ἰησοῦς,
base_translation:
  language: en
  yaml_path: translation/nt/john/006/017.yaml
  text: They got into a boat and were heading across the sea to Capernaum[a]. And it had already become dark[c][b], and Jesus had not yet come to them.
translation:
  language: ig
  text: Ha banyere n’ụgbọ mmiri, na-agafe osimiri ahụ na-aga Kapanọm.[a] Ọchịchịrị abịalarị, Jizọs abịabeghịkwa ebe ha nọ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “gaa n’akụkụ nke ọzọ nke osimiri ahụ, n’ụzọ Kapanọm.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ọ gbalarị ọchịchịrị, Jizọs abịabeghịkwa ebe ha nọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμβάντες εἰς πλοῖον
  choice: Ha banyere n’ụgbọ mmiri
  rationale: A gbanwere participle a ka ọ bụrụ ngwaa zuru ezu n’usoro ahịrịokwu, nke na-ada nke ọma n’Igbo ma na-echekwa na ha bu ụzọ banye n’ụgbọ mmiri.
- source_word: ἤρχοντο
  choice: na-aga
  rationale: Ụdị imperfect a na-egosi njem ka na-aga n’ihu; ‘na-aga’ na-echekwa akụkụ a karịa ‘gara’.
- source_word: πέραν τῆς θαλάσσης
  choice: n’ofe osimiri ahụ
  rationale: ‘N’ofe’ na-egosi ịgafe mmiri ahụ. N’Igbo nkịtị, ‘osimiri’ bụ okwu a na-ejikarị akọwa nnukwu mmiri a kpọrọ θάλασσα, na-enweghị ịkọwa ya dịka obere mmiri.
- source_word: εἰς Καφαρναούμ
  choice: ruo Kapanọm
  rationale: ‘Ruo’ na-egosi ebe njem ahụ na-aga; a sụgharịrị aha obodo ahụ n’ụdị mkpọpụta dabara n’Igbo.
- source_word: σκοτία ἤδη ἐγεγόνει
  choice: Ọchịchịrị abịalarị
  rationale: 'Nke a na-echekwa echiche pluperfect: ọchịchịrị eruola tupu oge a a na-akọ maka ya, ọnọdụ ya ka dịkwa.'
- source_word: οὔπω ἐληλύθει πρὸς αὐτοὺς
  choice: abịakwutebeghị ha
  rationale: Nke a na-egosipụta n’ụzọ kpọmkwem na ruo oge ahụ, ọ bịarutebeghị ebe ha nọ, n’ebughị ụzọ kọwaa ihe karịrị ihe Grik kwuru.
- source_word: ὁ Ἰησοῦς
  choice: Jizọs
  rationale: Ụdị aha a bụ nke a na-amata nke ọma n’Igbo oge a.
theological_decisions:
- issue: Usoro oge na akụkụ akụkọ
  choice: 'E chekwara usoro ahụ: ha banyere n’ụgbọ mmiri, njem ha ka na-aga, ọchịchịrị abịalarị, Jizọs abịakwutebeghịkwa ha.'
  alternative: 'A pụrụ ịsụgharị ngwaa ndị ahụ dịka omume gara aga dị mfe: ‘ha gara’ na ‘ọ gbara ọchịchịrị.’'
  rationale: Nhọrọ ahụ na-echekwa ọdịiche aspect dị na Grik na nrụgide akụkọ ahụ, n’etinyeghị nkọwa okwukwe ọzọ n’ime amaokwu ahụ.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị mfe ma dị ùgwù. E ji ‘ụgbọ mmiri’ maka πλοῖον, ‘osimiri’ maka θάλασσα n’ụzọ a na-anụkarị n’Igbo, ma debe imperfect na pluperfect n’ụzọ doro anya.
