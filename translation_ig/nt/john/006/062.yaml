  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐὰν οὖν θεωρῆτε τὸν υἱὸν τοῦ ἀνθρώπου ἀναβαίνοντα ὅπου ἦν τὸ πρότερον;
base_translation:
  language: en
  yaml_path: translation/nt/john/006/062.yaml
  text: Then what if you were to see the Son of Man ascending to where he was before?[a]
translation:
  language: ig
  text: Ya mere, gịnịkwanụ ma unu hụ Nwa nke Mmadụ ka ọ na-arịgoro n’ebe ọ nọ na mbụ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “Ya mere, ọ bụrụ na unu ahụ Nwa nke Mmadụ ka ọ na-arịgoro n’ebe ọ nọ na mbụ, gịnịkwanụ?” Okwu Grik bụ ajụjụ e tinyere n’ụdị ọnọdụ, nke na-achọghị ka e kwuo azịza ya hoo haa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν οὖν
  choice: Ya mere, gịnịkwanụ ma
  rationale: “Ya mere” na-egosi njikọ nkwubi okwu nke οὖν na ihe e kwuru tupu ya, ebe “gịnịkwanụ ma” na-enye ajụjụ ọnọdụ nke ἐὰν n’ụzọ Igbo dị ndụ ma bụrụkwa nke okwu ọnụ.
- source_word: θεωρῆτε
  choice: unu hụ
  rationale: “Unu hụ” na-egosi ịhụ ihe n’onwe mmadụ ma dabara n’ọnọdụ a na-atụ anya ya; “unu” na-echekwa ụdị ọtụtụ mmadụ dị na Grik.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: Nwa nke Mmadụ
  rationale: A hapụrụ aha a Jizọs ji akpọ onwe ya dịka aha pụrụ iche, n’emeghị ya nkọwa ọzọ, ka njikọ ya na ọdịnala Akwụkwọ Nsọ nọgide.
- source_word: ἀναβαίνοντα
  choice: ka ọ na-arịgoro
  rationale: Nkebi a na-egosi Nwa nke Mmadụ ka ọ nọ n’omume ịrịgo, ma na-echekwa echiche mmegharị elu dị na participle Grik.
- source_word: ὅπου ἦν τὸ πρότερον
  choice: ebe ọ nọ na mbụ
  rationale: Nke a na-echekwa ma ebe ahụ ma ịdị ya n’ebe ahụ tupu mgbe a, n’agbakwụghị ‘eluigwe’ ma ọ bụ ‘Nna’ nke amaokwu ahụ na-akpọghị aha.
theological_decisions:
- issue: Ma a ga-akọwa ịrịgo ahụ kpọmkwem dịka ịlaghachi n’eluigwe ma ọ bụ n’ebe Nna nọ
  choice: ebe ọ nọ na mbụ
  alternative: ebe ọ nọ na mbụ n’eluigwe; ịlaghachikwuru Nna ebe ọ nọ na mbụ
  rationale: Okwu Grik na-egosi na ọ dịbu n’ebe ahụ, ma ọ kpọghị eluigwe ma ọ bụ Nna aha. Nsụgharị ahụ na-ahapụ ike okwu banyere ịdị adị ya tupu mgbe ahụ ka ọ dị, n’etinyeghị nkọwa karịrị ihe e dere.
- issue: Ụdị ajụjụ ahụ dị ka ajụjụ ọnọdụ na-achọghị azịza e kwuru hoo haa
  choice: Ya mere, gịnịkwanụ ma unu hụ…?
  alternative: Ya mere, ọ bụrụ na unu ahụ…
  rationale: A họọrọ usoro ajụjụ Igbo nke na-echekwa ọdịdị rhetorical conditional nke Grik, n’agbanyeghị na ihe ga-eso ọnọdụ ahụ ka a hapụrụ ka onye na-agụ ya tụlee.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe nghọta ma dị nsọpụrụ. “Na-arịgoro” dị elu ntakịrị karịa “na-aga elu,” ma ọ ka bụ okwu ndị nkịtị ga-aghọta ma na-echekwa echiche ịrịgo dị n’akwụkwọ ahụ.
