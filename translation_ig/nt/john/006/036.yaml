- from: Ma agwara m unu na unu ahụla m n’ezie[a], ma unu ekweghị.
  to: Ma agwara m unu na unu ahụla m n’ezie[a], ma unu anaghị ekwere.
  rationale: The revision changes only the final verb phrase to preserve the ongoing present sense of οὐ πιστεύετε in natural modern Standard Igbo. It retains the perfect aspect of “ahụla,” the emphatic reading of the first καί as “n’ezie,” and the coordinated contrast marked by “ma.” The footnote is streamlined to offer the valid concessive alternative without presenting it as the sole meaning.
  reviewer_model: gpt-5.6-terra
