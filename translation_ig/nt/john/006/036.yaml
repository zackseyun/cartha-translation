review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders the adversative ἀλλ’, the prior statement (εἶπον ὑμῖν), the perfect force of ἑωράκατέ (“unu ahụla”), and the emphatic force of the first καί (“n’ezie”). However, “unu ekweghị” normally reads as a completed/past refusal in contemporary Standard Igbo, while οὐ πιστεύετε is present and depicts their continuing unbelief. “Unu anaghị ekwere” better preserves the Greek present without adding an object not expressed in Greek.
  naturalness: “Ma agwara m unu na unu ahụla m n’ezie, ma unu anaghị ekwere” is natural, clear Standard Igbo. The repeated “ma” appropriately retains both the initial adversative and the surprising contrast within the reported statement.
  terminology: “Ikwere” remains the direct, established equivalent for πιστεύω here. “N’ezie” is a suitable idiomatic rendering of the emphatic first καί, without forcing the Greek into an exclusively concessive construction.
  issues:
  - severity: medium
    issue: Present-tense οὐ πιστεύετε is rendered by “unu ekweghị.”
    rationale: In current Standard Igbo, “ekweghị” most naturally denotes a past/completed non-belief or refusal. The Greek present calls for an ongoing sense, best represented by “unu anaghị ekwere.”
  - severity: low
    issue: The footnote wording is unnecessarily explanatory and its quoted alternative is only a fragment.
    rationale: A concise lexical-alternative footnote can state the concessive option directly and cleanly, while the anchor remains attached to “n’ezie.”
  revised_text: Ma agwara m unu na unu ahụla m n’ezie[a], ma unu anaghị ekwere.
  revised_footnotes:
