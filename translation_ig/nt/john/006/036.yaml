  text: ἀλλ’ εἶπον ὑμῖν ὅτι καὶ ἑωράκατέ με καὶ οὐ πιστεύετε.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/036.yaml
  text: But I told you that you have even seen me[a], and yet you do not believe.
translation:
  language: ig
  text: Ma agwara m unu na unu ahụla m n’ezie[a], ma unu anaghị ekwere.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ: “ọ bụ ezie na unu ahụla m.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: Ma
  rationale: Na-egosi ọdịiche dị n’etiti okwu a na ihe bu ya ụzọ; “Ma” bụ ụzọ Igbo dị nkenke ma kwekọọ na ya.
- source_word: εἶπον ὑμῖν
  choice: agwara m unu
  rationale: Okwu a na-ezo aka n’ihe Jizọs kwuru ndị na-ege ya ntị na mbụ; “agwara m unu” bụ okwu Igbo ebumpụta ụwa.
- source_word: ὅτι
  choice: na
  rationale: Na-ewebata ihe dị n’ime okwu Jizọs kwuru.
- source_word: καὶ ἑωράκατέ με
  choice: unu ahụla m n’ezie
  rationale: '“N’ezie” na-egosipụta ike nkwusi okwu nke καί, ebe “ahụla” na-echekwa nghọta nke perfect: ha ahụwo ya, nke ahụ ka dịkwa mkpa ugbu a.'
- source_word: καὶ
  choice: ma
  rationale: N’ebe a njikọ ahụ na-egosi ọdịiche a na-atụghị anya ya n’etiti ịhụ Jizọs na ekweghị ekwe.
- source_word: οὐ πιστεύετε
  choice: unu ekweghị
  rationale: Na-egosipụta ekweghị ekwe ha nke na-aga n’ihu, n’ụzọ Igbo doro anya ma ghara ịgbakwunye ihe okwu Grik na-ekwughị.
theological_decisions:
- issue: Ike καί nke mbụ n’okwu καὶ ἑωράκατέ με
  choice: unu ahụla m n’ezie
  alternative: ọ bụ ezie na unu ahụla m
  rationale: “N’ezie” na-echekwa nkwusi okwu dị na Grik n’enweghị ime ka njikọ ahụ bụrụ naanị concessive; ihe odide bụ isi na-edebekwa ọdịiche nke akụkụ ikpeazụ.
- issue: Nsụgharị πιστεύω
  choice: ikwere
  alternative: ịtụkwasị obi
  rationale: “Ikwere” bụ ihe kwekọrọ kpọmkwem na πιστεύω n’ebe a ma na-echekwa ohere nghọta nke okwu ahụ n’Oziọma Jọn n’enweghị ịmanye nkọwa okpukpe pụrụ iche.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji “unu” mee ka plural nke ὑμῖν na πιστεύετε pụta ìhè; e debere akara ndetu [a] ozugbo n’akụkụ okwu ọ na-akọwa.
