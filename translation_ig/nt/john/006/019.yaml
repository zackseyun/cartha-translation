id: JHN.6.19
reference: John 6:19
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐληλακότες οὖν ὡς σταδίους εἴκοσι πέντε ἢ τριάκοντα θεωροῦσιν τὸν Ἰησοῦν περιπατοῦντα ἐπὶ τῆς θαλάσσης καὶ ἐγγὺς τοῦ πλοίου γινόμενον, καὶ ἐφοβήθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/019.yaml
  text: So when they had rowed about twenty-five or thirty stadia[a], they saw Jesus walking on the sea and coming near the boat[b], and they were afraid.
translation:
  language: ig
  text: Ya mere, mgbe ha kwọsịrị ụgbọ mmiri ahụ ihe dị ka stadia iri abụọ na ise ma ọ bụ iri atọ[a], ha hụrụ Jizọs ka ọ na-eje ije n’elu oké osimiri[b] ma na-abịaru ụgbọ mmiri ahụ nso; egwu wee tụọ ha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Stadion bụ ihe ndị oge ochie ji atụ ogologo. Stadia iri abụọ na ise ma ọ bụ iri atọ dị ihe dịka maịl atọ ruo anọ (ihe dịka kilomita ise ruo isii).
    reason: cultural_note
  - marker: b
    text: A pụkwara ịsị, “n’elu mmiri.” Asụsụ Grik kwuru kpọmkwem, “n’elu oké osimiri.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐληλακότες
  choice: mgbe ha kwọchara ụgbọ ahụ
  rationale: N’ọnọdụ njem ụgbọ mmiri a, ἐλαύνω na-egosi ịkwọ ụgbọ mmiri site n’ịkwọ ya. Usoro ‘mgbe ha kwọchara’ na-egosikwa na nke a mere tupu ha ahụ Jizọs.
- source_word: οὖν
  choice: mgbe ahụ (egosipụtara site n’usoro akụkọ ‘Mgbe…’)
  rationale: οὖν na-aga n’ihu n’akụkọ ahụ. N’Igbo, ịmalite ahịrịokwu a na ‘Mgbe ha…’ na njikọ nke ihe so ya na-eme ka ọ bụrụ nke e ji asụsụ nkịtị kọọ, n’agbanyeghị na a naghị atụgharị njikọ ahụ dịka otu mkpụrụokwu pụrụ iche.
- source_word: ὡς
  choice: ihe dị ka
  rationale: N’ihu ihe e ji atụ anya, ὡς na-egosi na ọnụ ọgụgụ ahụ abụghị kpọmkwem.
- source_word: σταδίους εἴκοσι πέντε ἢ τριάκοντα
  choice: stadia iri abụọ na ise ma ọ bụ iri atọ
  rationale: E debere aha ihe atụ ogologo oge ochie dị n’asụsụ Grik, ebe nkọwa n’okpuru na-enye nha ya n’ụzọ ndị mmadụ ji atụ ugbu a.
- source_word: θεωροῦσιν
  choice: ha hụrụ
  rationale: ‘Ha hụrụ’ bụ ụzọ Igbo doro anya ma dịkwa n’usoro akụkọ si egosi na ha ji anya hụ Jizọs.
- source_word: περιπατοῦντα ἐπὶ τῆς θαλάσσης
  choice: ka ọ na-eje ije n’elu oké osimiri
  rationale: Nke a na-edobe θάλασσα dịka ‘oké osimiri’ ma na-egosi n’ụzọ doro anya na ọ na-eje ije n’elu ya, ọ bụghị n’akụkụ ya.
- source_word: ἐγγὺς τοῦ πλοίου γινόμενον
  choice: na-abịarukwa ụgbọ ahụ nso
  rationale: γινόμενον ya na ἐγγύς na-egosi ịbata nso, ọ bụghị naanị ịnọ nso. ‘Na-abịarukwa… nso’ na-echekwa mmegharị ahụ.
- source_word: πλοίου
  choice: ụgbọ ahụ
  rationale: ‘Ụgbọ’ dabara n’obere ụgbọ ndị a na-eji n’Ọdọ Mmiri Galili karịa okwu ga-egosi nnukwu ụgbọ mmiri.
- source_word: ἐφοβήθησαν
  choice: egwu wee tụọ ha
  rationale: Nke a bụ akpaalaokwu Igbo dị ndụ nke na-egosi mmeghachi omume ha nke ịtụ egwu.
theological_decisions:
- issue: Igosipụta ọrụ ebube ahụ n’emeghị ka ihe ederede kwuru daa mba
  choice: na-eje ije n’elu oké osimiri
  alternative: na-eje ije n’elu mmiri; na-eje ije n’akụkụ oké osimiri
  rationale: ἐπὶ τῆς θαλάσσης n’ọnọdụ akụkọ a pụtara na Jizọs nọ n’elu oké osimiri ahụ. Ịsị ‘n’akụkụ oké osimiri’ adabaghị ebe ndị na-eso ụzọ ya nọ n’ime mmiri, ebe ‘n’elu mmiri’ bụ ụzọ ọzọ e nwere ike isi kwuo ya mana ọ naghị edobe okwu θάλασσα kpọmkwem.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. ‘Kwọchara ụgbọ ahụ’ na ‘egwu wee tụọ ha’ bụ okwu Igbo nkịtị na-aga nke ọma n’akụkọ; e debere ‘stadia’ n’ahịrịokwu ma kọwaa ya n’okpuru.
