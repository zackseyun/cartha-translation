  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀπεκρίθη αὐτοῖς ὁ Ἰησοῦς· Οὐκ ἐγὼ ὑμᾶς τοὺς δώδεκα ἐξελεξάμην; καὶ ἐξ ὑμῶν εἷς διάβολός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/070.yaml
  text: Jesus answered them[a], “Did I not choose you, the Twelve? Yet one of you is a devil.”
translation:
  language: ig
  text: Jizọs zara ha, sị, “Ọ̀ bụghị m họpụtara unu, mmadụ iri na abụọ ahụ? Ma otu onye n’ime unu bụ ekwensu[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “onye nkwutọ.” Okwu Grik ahụ nwere ike ịpụta onye na-ebo ebubo ụgha, ma n’ọtụtụ ebe ọ na-ezo aka n’Ekwensu. N’ebe a, okwu ahụ na-akọwa ụdị onye ọ bụ karịa ịsị kpọmkwem na ọ bụ Setan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: zara
  rationale: Nke a bụ okwu Igbo a na-ejikarị akọ nzaghachi n’ime mkparịta ụka, ọ kwekọkwara na ngwaa Grik ahụ.
- source_word: Οὐκ ἐγὼ ... ἐξελεξάμην;
  choice: Ọ̀ bụ na ọ bụghị m họọrọ
  rationale: Ụdị ajụjụ a na-atụ anya azịza nkwenye ma na-echekwa ike ajụjụ nkwupụta dị na Grik.
- source_word: ὑμᾶς τοὺς δώδεκα
  choice: unu, mmadụ iri na abụọ ahụ
  rationale: Ọ na-egosi unu dị ka òtù a maara nke mmadụ iri na abụọ, ma na-ada nke ọma n’Igbo nke oge a.
- source_word: καὶ
  choice: Ma
  rationale: Ọ bụ ezie na καὶ pụtarakarị ‘na,’ ebe a ọ na-egosi ọdịiche dị n’etiti ịhọrọ mmadụ iri na abụọ ahụ na ọnọdụ otu onye n’ime ha.
- source_word: ἐξ ὑμῶν
  choice: otu onye n’ime unu
  rationale: Nke a na-egosipụta nke ọma echiche partitive nke Grik n’Igbo nkịtị.
- source_word: διάβολός
  choice: ekwensu
  rationale: Okwu a na-echekwa ịdị nkọ na ibu okwu Grik ahụ. N’ebe a, enweghị article na-eme ka okwu ahụ bụrụ nkọwa àgwà karịa ịbụ ịkpọ onye ahụ Setan n’onwe ya; nkọwa ala peeji na-echekwakwa ihe ọzọ okwu ahụ pụrụ ịpụta.
theological_decisions:
- issue: Ma διάβολός ọ̀ na-akpọ otu onye ahụ Setan n’onwe ya, ka ọ̀ na-akọwa àgwà ya
  choice: bụ ekwensu
  alternative: bụ onye nkwutọ
  rationale: διάβολος enweghị article n’ebe a, ya mere okwu ahụ nwere ike ịbụ nkọwa qualitative kama ịbụ njirimara kpọmkwem na Setan. ‘Bụ ekwensu’ na-echekwa ike okwu Jizọs, ebe nkọwa ala peeji na-egosi na ọ pụkwara ịpụta onye nkwutọ.
translation_notes:
  register: Asụsụ Igbo izugbe, nke oge a ma dị ùgwù. E ji ‘Jizọs’ na ‘ekwensu’ bụ okwu ndị ọtụtụ ndị na-agụ Igbo maara; e zere itinye nkọwa nke otu ụka pụrụ iche.
