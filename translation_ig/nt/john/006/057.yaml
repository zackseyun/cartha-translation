revisions:
- from: Dị nnọọ ka Nna ahụ dị ndụ zitere m, m na-adịkwa ndụ n’ihi Nna ahụ, otu ahụkwa, onye na-ata m eri[a] ga-adị ndụ n’ihi m.[b]
  to: Dị nnọọ ka Nna dị ndụ zitere m, m na-adịkwa ndụ n’ihi Nna ahụ[b], otu ahụkwa, onye na-eri m[a] ga-adị ndụ n’ihi m.
  rationale: A safe idiomatic correction replaces the strained serial expression for τρώγω with the normal Igbo verb for eating, while the footnote retains the source verb’s concrete chewing nuance. The remaining changes improve grammatical precision and avoid an unnecessary interpretive expansion in the explanatory note. The causal rendering of both διά phrases is retained consistently, without resolving theological or sacramental questions beyond the text.
