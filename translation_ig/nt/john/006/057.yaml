  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καθὼς ἀπέστειλέν με ὁ ζῶν πατὴρ κἀγὼ ζῶ διὰ τὸν πατέρα, καὶ ὁ τρώγων με κἀκεῖνος ⸀ζήσει δι’ ἐμέ.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/057.yaml
  text: Just as the living Father sent me[a], and I live because of the Father[b], so also the one who feeds on me will live because of me.
translation:
  language: ig
  text: Dị nnọọ ka Nna dị ndụ zitere m, m na-adịkwa ndụ n’ihi Nna ahụ[b], otu ahụkwa, onye na-eri m[a] ga-adị ndụ n’ihi m.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “onye na-ata m ata.” Okwu Grik ahụ doro anya ma sie ike; n’ụzọ nkịtị, ọ na-ekwu banyere iri ma ọ bụ ịta ata.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsị, “site na Nna ahụ” na “site na m.” Nganiihu Grik ahụ nwere ike igosi ihe kpatara ihe ma ọ bụ ụzọ e si mee ya; n’ebe a, e ji “n’ihi” mee ka ntụnyere dị n’etiti Nna na Jizọs, nakwa Jizọs na onye na-eri ya, pụta ìhè.
    reason: alternative_reading
lexical_decisions:
- source_word: καθὼς
  choice: Dị nnọọ ka ... otu ahụkwa
  rationale: Ọ na-ewebata ntụnyere na-achị ahịrịokwu ahụ dum; usoro Igbo a na-eme ka njikọ dị n’etiti akụkụ abụọ ahụ doo anya n'ụzọ ebumpụta ụwa.
- source_word: ὁ ζῶν πατὴρ
  choice: Nna ahụ dị ndụ
  rationale: Nke a na-edobe ζῶν dị ka nkọwa nke Nna, na-agbanweghị ya ka ọ bụrụ ‘Nna na-enye ndụ,’ nke ga-agbakwụnye ihe okwu Grik ahụ ekwughị kpọmkwem.
- source_word: ἀπέστειλέν με
  choice: zitere m
  rationale: Oge gara aga dị mfe na Igbo na-anọchi aorist ahụ nke ọma ma na-edobe echiche nke iziga.
- source_word: κἀγὼ ζῶ
  choice: m na-adịkwa ndụ
  rationale: Ụdị ugbu a na-egosi ndụ na-aga n’ihu ma na-edobe ‘kwa’ nke κἀγώ.
- source_word: διὰ τὸν πατέρα
  choice: n’ihi Nna ahụ
  rationale: διά tinyere accusative na-egosikarị ihe kpatara ihe ma ọ bụ ihe ọ dabeere na ya; ‘n’ihi’ na-edobe nghọta ahụ ma kwekọọ na δι’ ἐμέ.
- source_word: ὁ τρώγων με
  choice: onye na-ata m eri
  rationale: τρώγω bụ okwu doro anya ma sie ike maka ịta/iri. ‘Na-ata m eri’ na-edobe ọdịdị anụ ahụ na ike okwu ahụ, na-amanyeghị nkọwa sacrament ma ọ bụ ihe atụ naanị.
- source_word: κἀκεῖνος
  choice: otu ahụkwa, onye ahụ
  rationale: A na-egosipụta ike nke ‘onye ahụ kwa’ site na ‘otu ahụkwa’ na onye isiokwu ahụ, n’ụzọ dabara n’Igbo.
- source_word: ζήσει
  choice: ga-adị ndụ
  rationale: Ọ na-edobe future ahụ na njikọ okwu ya na ‘m na-adị ndụ.’
- source_word: δι’ ἐμέ
  choice: n’ihi m
  rationale: Ọ na-edobe otu nghọta causal dị na nkebi mbụ, ma mee ka ntụnyere Nna–Ọkpara na Ọkpara–onye na-eri ya pụta ìhè.
theological_decisions:
- issue: Mmekọrịta ndụ Jizọs na Nna n’okwu διὰ τὸν πατέρα
  choice: A sụgharịrị ya ‘m na-adịkwa ndụ n’ihi Nna ahụ.’
  alternative: ‘m na-adịkwa ndụ site na Nna ahụ’
  rationale: Nke a na-edobe ohere causal nke διά + accusative na ntụnyere dị n’amaokwu ahụ, n’enweghị ikwu na Ọkpara dị ala n’ọdịdị ya ma ọ bụ itinye nkọwa ozizi ọzọ n’ime ederede.
- issue: Ma ὁ τρώγων με na-ekwu kpọmkwem banyere Oriri Nsọ ka ọ bụ ihe atụ sara mbara
  choice: E ji okwu doro anya ‘onye na-ata m eri.’
  alternative: ‘onye na-eri m’ ma ọ bụ ‘onye na-anata m dịka nri’
  rationale: Okwu a na-edobe ike anụ ahụ nke τρώγω, ma hapụ nkọwa sacrament na nkọwa nke okwukwe/ịdị n’otu na Kraịst ka ha ghe oghe dịka ederede ahụ si dị.
translation_notes:
  register: Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E ji ‘na-ata m eri’ chekwaa ike okwu Grik ahụ, ebe ‘Dị nnọọ ka ... otu ahụkwa’ na-eme ka ntụnyere ahịrịokwu ahụ doo anya. A zere okwu ụka pụrụ iche nke ga-amanye otu nkọwa denominational.
