source:
  edition: SBLGNT
  text: Ἐκ τούτου πολλοὶ ⸀ἐκ ⸂τῶν μαθητῶν αὐτοῦ ἀπῆλθον⸃ εἰς τὰ ὀπίσω καὶ οὐκέτι μετ’ αὐτοῦ περιεπάτουν.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/066.yaml
  text: From this time many of his disciples went back and no longer walked with him[a].
translation:
  language: ig
  text: Malite n’oge ahụ, ọtụtụ n’ime ndị na-eso ụzọ ya laghachiri azụ, ha na ya anaghịzi eje ije.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịtụgharị mmalite okwu a, “N’ihi nke a.” Okwu Grik e ji malite amaokwu a nwere ike igosi ihe kpatara ya; ma n’ihe gbara ya gburugburu, “Malite n’oge ahụ” na-egosi nke ọma oge mgbanwe.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐκ τούτου
  choice: Site n’oge ahụ gaa n’ihu
  rationale: N’ọnọdụ a, okwu ahụ na-egosi oge mgbanwe malitere—‘site n’oge ahụ gaa n’ihu’—ọ bụ ezie na ọ pụkwara igosi ihe kpatara ya.
- source_word: πολλοὶ ἐκ τῶν μαθητῶν αὐτοῦ
  choice: ọtụtụ n’ime ndị na-eso ụzọ ya
  rationale: ‘N’ime’ na-echekwa echiche partitive nke ἐκ, ebe ‘ndị na-eso ụzọ’ bụ okwu Igbo doro anya maka μαθηταί na-enweghị ịkpọ ha Ndịozi Iri na Abụọ ma ọ bụ ikpebi ọnọdụ okwukwe ha.
- source_word: ἀπῆλθον εἰς τὰ ὀπίσω
  choice: laghachiri azụ
  rationale: Ngwakọta okwu Grik a na-egosi ịlaghachi azụ ma ọ bụ ịkwụsị iso ya, ọ bụghị nanị isi n’otu ebe pụọ.
- source_word: οὐκέτι
  choice: esokwaghị
  rationale: Akara ‘-kwaghị’ na-egosi na omume ha na-emebu akwụsịla malite n’oge ahụ.
- source_word: μετ’ αὐτοῦ περιεπάτουν
  choice: ha esokwaghị ya na-eje ije
  rationale: Nke a na-echekwa onyonyo nke ‘ije ije’ ma mee ka mmekọrịta iso Jizọs na-aga n’ihu pụta ìhè n’Igbo nkịtị.
theological_decisions:
- issue: Ma μαθηταί ọ̀ na-ezo aka n’Ndịozi Iri na Abụọ ma ọ bụ na ọ na-ekpebi na ndị a bụ ezi ndị kwere ekwe
  choice: ndị na-eso ụzọ ya
  alternative: ndị na-eso ya
  rationale: Nsụgharị a na-edobe aha ndị akụkọ ahụ kpọrọ ha, ma ọ naghị eme ka ha bụrụ Ndịozi Iri na Abụọ ma ọ bụ kpebie ma okwukwe ha bụ nke ezigbo ya.
- issue: Ma Ἐκ τούτου bụ nke oge ka ọ bụ nke ihe kpatara ya
  choice: Site n’oge ahụ gaa n’ihu
  alternative: N’ihi nke a
  rationale: Ihe gbara amaokwu ahụ gburugburu na-akwado echiche nke oge mgbanwe, ma ihe odide ala peeji na-echekwa nghọta causal nke Grik nwere ike ịnabata.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ugwu ma dị mfe nghọta. E debere onyonyo ‘ije ije’ nke Grik, ebe e jiri ahịrịokwu Igbo e ji eme ihe kwa ụbọchị kọwaa ịkwụsị iso Jizọs.
