revisions:
- from: Site n’oge ahụ gaa n’ihu, ọtụtụ n’ime ndị na-eso ụzọ ya laghachiri azụ, ha esokwaghị ya na-eje ije.[a]
  to: Malite n’oge ahụ, ọtụtụ n’ime ndị na-eso ụzọ ya laghachiri azụ, ha na ya anaghịzi eje ije.[a]
  rationale: The revision makes the temporal opening more concise and idiomatic and improves the final clause so that it naturally expresses ongoing companionship that ceased. The footnote is narrowed to the disputed opening expression and preserves the possible causal reading without overstating it.
  reviewer_model: gpt-5.6-terra
