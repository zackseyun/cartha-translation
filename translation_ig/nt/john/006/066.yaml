    reason: alternative_reading
  revision_rationale: The revision makes the temporal opening more concise and idiomatic and improves the final clause so that it naturally expresses ongoing companionship that ceased. The footnote is narrowed to the disputed opening expression and preserves the possible causal reading without overstating it.
