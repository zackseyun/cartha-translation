id: JHN.6.24
reference: John 6:24
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὅτε οὖν εἶδεν ὁ ὄχλος ὅτι Ἰησοῦς οὐκ ἔστιν ἐκεῖ οὐδὲ οἱ μαθηταὶ αὐτοῦ, ἐνέβησαν αὐτοὶ εἰς τὰ ⸀πλοιάρια καὶ ἦλθον εἰς Καφαρναοὺμ ζητοῦντες τὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/024.yaml
  text: So when the crowd saw that Jesus was not there[a], nor his disciples, they themselves got into the boats and came to Capernaum, looking for Jesus.
translation:
  language: ig
  text: Ya mere, mgbe ìgwè mmadụ ahụ hụrụ na Jizọs anọghị n’ebe ahụ, ndị na-eso ụzọ ya anọghịkwa, ha onwe ha banyere n’ụgbọ mmiri ndị ahụ[a] wee bịara Kapanọm, na-achọ Jizọs.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “obere ụgbọ mmiri ndị ahụ”; okwu Grik ahụ ji ụdị okwu na-egosi obere ụgbọ mmiri.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε οὖν
  choice: Ya mere, mgbe
  rationale: Na-egosipụta ma usoro oge nke ὅτε ma njikọ/nsonaazụ akụkọ nke οὖν n’ụzọ Igbo dị ndụ.
- source_word: ὁ ὄχλος
  choice: ìgwè mmadụ ahụ
  rationale: Ọ bụ okwu Igbo doro anya maka ọtụtụ mmadụ gbakọtara ọnụ, ebe nrụaka ahụ na-egosikwa ìgwè ahụ e kwuru okwu ya na mbụ.
- source_word: εἶδεν
  choice: hụrụ
  rationale: Na-edobe ihe εἶδεν pụtara kpọmkwem n’etinyeghị echiche siri ike dịka ‘ghọtara.’
- source_word: οὐκ ἔστιν ἐκεῖ
  choice: anọghị n’ebe ahụ
  rationale: Na-asụgharị ọnọdụ enweghị Jizọs n’ebe ahụ n’usoro oge gara aga dabara n’akụkọ Igbo.
- source_word: οὐδὲ οἱ μαθηταὶ αὐτοῦ
  choice: ndị na-eso ụzọ ya anọghịkwa
  rationale: Na-edobe njikọ ọjọọ οὐδέ n’ụzọ Igbo eke ma doo anya na ndị na-eso ụzọ ya anọghịkwa.
- source_word: ἐνέβησαν
  choice: banyere
  rationale: N’ebe ụgbọ mmiri nọ, ‘banyere’ na-enye echiche ịbanye n’ime ma ọ bụ ịrị ụgbọ mmiri n’ụzọ dị mfe.
- source_word: αὐτοὶ
  choice: ha onwe ha
  rationale: Na-echekwa nkwusi ike dị na nnọchiaha Grik ahụ.
- source_word: τὰ πλοιάρια
  choice: ụgbọ mmiri ndị ahụ[a]
  rationale: ‘Ụgbọ mmiri’ bụ okwu Igbo dị mfe ma dị mma n’ahịrịokwu bụ isi; ndetu ala na-echekwa ohere na ụdị diminutive ahụ pụtara obere ụgbọ mmiri.
- source_word: ἦλθον εἰς Καφαρναούμ
  choice: wee bịa Kapanọm
  rationale: Na-agbaso ihe ἔρχομαι pụtara nke bụ ‘bịa,’ ma na-eji aha ebe ahụ n’ụdị Igbo a na-aghọta.
- source_word: ζητοῦντες τὸν Ἰησοῦν
  choice: na-achọ Jizọs
  rationale: Na-egosi na ha na-agbalị ịchọta Jizọs, n’enweghị ibubata echiche ime mmụọ ọzọ n’okwu ζητέω.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke oge a, dị ùgwù ma dị mfe nghọta. E debere nkwusi ike nke αὐτοὶ site na ‘ha onwe ha,’ ma hapụkwara ụdị diminutive nke πλοιάρια ka ndetu ala kọwaa ya n’enweghị ime ka ahịrịokwu bụ isi sie ike.
