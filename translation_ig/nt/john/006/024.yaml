review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the crowd's realization that neither Jesus nor his disciples were present, their boarding of the boats, and their purpose in going to Capernaum. The emphatic αὐτοὶ is reasonably retained by “ha onwe ha,” and the footnote appropriately preserves the diminutive nuance of πλοιάρια.
  naturalness: The wording is generally clear Standard Igbo. However, “wee bịa Kapanọm” does not properly mark the completed past narrative action expressed by ἦλθον. “wee bịara Kapanọm” is the natural past form.
  terminology: “Ìgwè mmadụ,” “ndị na-eso ụzọ,” “ụgbọ mmiri,” “Kapanọm,” and “na-achọ Jizọs” are suitable, natural choices. The footnote is clear and does not overstate the diminutive's force.
  issues:
  - severity: medium
    issue: Verb form in “wee bịa Kapanọm”
    rationale: In this past-tense narrative, ἦλθον is best rendered with the completed past form “bịara,” not the citation/imperative-like form “bịa.”
  revised_text: Ya mere, mgbe ìgwè mmadụ ahụ hụrụ na Jizọs anọghị n’ebe ahụ, ndị na-eso ụzọ ya anọghịkwa, ha onwe ha banyere n’ụgbọ mmiri ndị ahụ[a] wee bịara Kapanọm, na-achọ Jizọs.
