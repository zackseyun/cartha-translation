  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀπεκρίθη ⸀αὐτῷ Φίλιππος· Διακοσίων δηναρίων ἄρτοι οὐκ ἀρκοῦσιν αὐτοῖς ἵνα ⸀ἕκαστος βραχύ ⸀τι λάβῃ.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/007.yaml
  text: Philip answered him, “Two hundred denarii worth of bread is not enough for them, so that each one may receive a little.”
translation:
  language: ig
  text: Filip zara ya, sị, “Achịcha e ji denarị narị abụọ zụta agaghị ezuru ha, ka onye ọ bụla n’ime ha wee nweta ntakịrị.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διακοσίων δηναρίων
  choice: narị mkpụrụ ego denarị abụọ
  rationale: E debere aha ego oge ahụ, ‘denarị,’ ma kọwaa ya dị ka mkpụrụ ego; usoro ‘narị ... abụọ’ bụ Igbo nkịtị maka 200.
- source_word: ἄρτοι
  choice: achịcha
  rationale: ‘Achịcha’ bụ okwu Igbo doro anya ma dị mfe maka nri achịcha ebe a; ihe a na-ekwu bụ ọnụ ahịa achịcha n’ozuzu.
- source_word: οὐκ ἀρκοῦσιν
  choice: agaghị ezuru ha
  rationale: Nke a na-egosipụta nke ọma na achịcha ọnụ ahịa ahụ agaghị ezu maka ìgwè mmadụ ahụ.
- source_word: ἵνα ἕκαστος βραχύ τι λάβῃ
  choice: ka onye ọ bụla n’ime ha wee nweta ntakịrị
  rationale: E chekwara njikọ ἵνα n’enweghị ịkpebi karịa ihe odide ahụ ma ọ bụ ebumnuche kpọmkwem ma ọ bụ nsonaazụ; ‘ntakịrị’ na-anọchi βραχύ τι n'ụzọ eke.
theological_decisions:
- issue: Mmekọrịta nke ἵνα na nkebiokwu bu ya ụzọ
  choice: ka ... wee
  alternative: nke ga-eme ka ...
  rationale: ‘Ka ... wee’ na-echekwa ohere nghọta ebumnuche/nsonaazụ dị na Grik, kama idozi ya n’otu ụzọ naanị.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E zere ịgbanwe denarị ka ọ bụrụ ego nke oge a, n’ihi na nke ahụ nwere ike itinye ọnụ ahịa na-abụghị nke ihe odide mbụ.
