id: JHN.13.18
reference: John 13:18
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οὐ περὶ πάντων ὑμῶν λέγω· ἐγὼ οἶδα ⸀τίνας ἐξελεξάμην· ἀλλ’ ἵνα ἡ γραφὴ πληρωθῇ· Ὁ τρώγων ⸀μου τὸν ἄρτον ἐπῆρεν ἐπ’ ἐμὲ τὴν πτέρναν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/018.yaml
  text: 'I am not speaking about all of you[a]. I know whom I have chosen[c][b]. But this is so that the Scripture may be fulfilled: ‘The one who eats my bread has lifted up his heel against me.’'
translation:
  language: ig
  text: 'Anaghị m ekwu banyere unu niile.[a] Amaara m ndị m họọrọ. Ma nke a bụ ka ihe e dere n’Akwụkwọ Nsọ wee mezuo: ‘Onye na-eri achịcha m eweliela ikiri ụkwụ ya megide m.’[b][c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ịsụgharị ya n’ụzọ kwụ ọtọ karịa: “Anaghị m ekwu maka unu niile.”'
    reason: lexical_alternative
  - marker: b
    text: Nke a bụ okwu e hotara ma ọ bụ ntụaka sitere n’Abụ Ọma 41:9.
    reason: cross_reference
  - marker: c
    text: 'A pụkwara ịsụgharị ya: “eweliri ikiri ụkwụ ya megide m.” Okwu a bụ akpaalaokwu na-egosi iro na nrara nye.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ περὶ πάντων ὑμῶν λέγω
  choice: Anaghị m ekwu banyere unu niile
  rationale: Nke a bụ Igbo dị mfe ma doo anya; ọ na-edobe echiche περὶ nke pụtara ‘banyere’ nakwa oke ngọnarị ahụ—ọ bụghị mmadụ niile ka okwu ahụ gbasara.
- source_word: οἶδα
  choice: Amaara m
  rationale: 'Ọ bụ ezie na οἶδα yiri perfect n’usoro Grik, ihe ọ pụtara n’asụsụ Grik Koine bụ ọnọdụ dị ugbu a: ‘Amaara m.’'
- source_word: τίνας ἐξελεξάμην
  choice: ndị m họọrọ
  rationale: ‘Họrọ’ na-egosipụta ἐκλέγομαι n’enweghị ịgbakwụnye nkọwa banyere ụdị nhọpụta ahụ; usoro Igbo a dịkwa mma ma bụrụ nke a na-aghọta ngwa ngwa.
- source_word: ἀλλ’ ἵνα
  choice: Ma nke a bụ ka
  rationale: Ọ na-ejikọta ahịrịokwu ndị ahụ n’Igbo nkịtị ma na-edobe echiche ebumnuche ma ọ bụ nsonaazụ dị n’ἵνα, n’enweghị ịkọwa ihe karịrị ihe odide ahụ.
- source_word: ἡ γραφὴ πληρωθῇ
  choice: ihe e dere n’Akwụkwọ Nsọ wee mezuo
  rationale: ‘Akwụkwọ Nsọ’ na-egosipụta γραφή dịka ihe odide dị nsọ, ‘wee mezuo’ na-edobekwa okwu mmezu ahụ n’ụzọ Igbo kwesịrị ekwesị.
- source_word: Ὁ τρώγων μου τὸν ἄρτον
  choice: Onye na-eri achịcha m
  rationale: ‘Onye na-eri’ na-egosipụta participle e ji mee aha, ebe ‘achịcha m’ na-edobe njikọ nke μου na τὸν ἄρτον.
- source_word: ἐπῆρεν ἐπ’ ἐμὲ τὴν πτέρναν αὐτοῦ
  choice: eweliela ikiri ụkwụ ya megide m
  rationale: Nke a na-edobe ihe atụ sitere n’Abụ Ọma—iweli ikiri ụkwụ megide mmadụ—kama ịgbanwe ya ka ọ bụrụ naanị nkọwa banyere iro ma ọ bụ nrara nye.
theological_decisions:
- issue: Mmekọrịta dị n’etiti nhọpụta Jizọs na onye ga-arara ya nye
  choice: E sụgharịrị ἐξελεξάμην dịka ‘m họọrọ’ n’enweghị ịkọwa ụdị nhọpụta ahụ.
  alternative: Ịsụgharị ya ka ọ pụta kpọmkwem nhọpụta maka nzọpụta, ma ọ bụ naanị ịhọpụta mmadụ ka ọ bụrụ onyeozi.
  rationale: Amaokwu a anaghị akọwa ụdị nhọpụta ọ bụ. Ya mere, nsụgharị ahụ na-edobe nghọtahie na esemokwu nkà mmụta okpukpe dị na ya kama idozi ya n’ụzọ otu ụka pụrụ iche.
- issue: Ike ἀλλ’ ἵνα n’ihe gbasara nrara nye na mmezu Akwụkwọ Nsọ
  choice: ‘Ma nke a bụ ka ihe e dere n’Akwụkwọ Nsọ wee mezuo.’
  alternative: Ịkọwa ya dịka ihe akaebe na a manyere onye nrara nye ime ihe ahụ ka Akwụkwọ Nsọ mezuo.
  rationale: Grik ahụ kwuru maka mmezu Akwụkwọ Nsọ, ma ọ kọwaghị usoro ihe kpatara omume onye ahụ. Nsụgharị a anaghị etinye nkwubi okwu banyere akara aka nke ihe odide ahụ ekwughị.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta, mee ihe. E debere ihe atụ ‘iweli ikiri ụkwụ megide’ n’ihi na ọ bụ akụkụ dị mkpa nke ntụaka Abụ Ọma, ebe ndetu ala kọwara ihe ọ na-egosi. E degharịrị usoro akara ndetu ka [b] bụrụ ntụaka Abụ Ọma, [c] bụrụ nkọwa akpaalaokwu ahụ.
