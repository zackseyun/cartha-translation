id: JHN.13.33
reference: John 13:33
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τεκνία, ἔτι μικρὸν μεθ’ ὑμῶν εἰμι· ζητήσετέ με, καὶ καθὼς εἶπον τοῖς Ἰουδαίοις ὅτι Ὅπου ⸂ἐγὼ ὑπάγω⸃ ὑμεῖς οὐ δύνασθε ἐλθεῖν, καὶ ὑμῖν λέγω ἄρτι.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/033.yaml
  text: Little children[a], I am with you a little while longer. You will seek me, and just as I said to the Jews, ‘Where I am going[b], you are not able to come,’ so now I also say to you.
translation:
  language: ig
  text: 'Ụmụntakịrị, m ka ga-anọnyere unu obere oge. Unu ga-achọ m, dị nnọọ ka m gwara ndị Juu[a], ‘Ebe m na-aga, unu enweghị ike ịbịa[b],’ otu ahụ ka m na-agwakwa unu ugbu a.


    [a] Ma ọ bụ, “ndị ndú ndị Juu.” N’Oziọma Jọn, okwu a bụ “ndị Juu” nwere ike mgbe ụfọdụ izo aka kpọmkwem n’ebe ndị ndú ndị Juu nọ, dabere n’ọnọdụ okwu ahụ.


    [b] Ma ọ bụ, n’ụzọ dị mfe, “unu apụghị ịbịa.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị ndú ndị Juu.” N’Oziọma Jọn, okwu a bụ “ndị Juu” nwere ike mgbe ụfọdụ izo aka kpọmkwem n’ebe ndị ndú ndị Juu nọ, dabere n’ọnọdụ okwu ahụ.
    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ, n’ụzọ dị mfe, “unu apụghị ịbịa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τεκνία
  choice: Ụmụntakịrị
  rationale: Okwu a bụ mkpọrọ-akpọ ọtụtụ mmadụ nke na-egosi mmekọrịta ezinụlọ na ịhụnanya dị nro. “Ụmụntakịrị” na-echekwa ihe atụ nke ịbụ ụmụ na ntakịrịdị dị n’okwu Grik, ọ bụ ezie na ndị a na-agwa bụ ndị toro eto.
- source_word: ἔτι μικρόν
  choice: m ka ga-anọnyere unu nwa obere oge
  rationale: Ngwakọta okwu a na-egosi obere oge fọdụrụ. Usoro a bụ Igbo nkịtị ma na-eme ka o doo anya na ọnụnọ Jizọs n’etiti ha ga-adị naanị obere oge ọzọ.
- source_word: μεθ’ ὑμῶν εἰμι
  choice: ga-anọnyere unu
  rationale: “Ịnọnyere” na-egosi ọnụnọ ya n’etiti ha n’ụzọ Igbo si ada nke ọma; e jikọtara ya na “m ka” iji chekwaa echiche nke ọnụnọ ka na-aga n’ihu ugbu a.
- source_word: ζητήσετέ με
  choice: Unu ga-achọ m
  rationale: “Ịchọ” na-anọchi ma ịchọ onye a na-achọ ịhụ ma echiche sara mbara nke ζητέω, n’enweghị ịkọwa ihe kpatara ọchịchọ ahụ.
- source_word: καθὼς εἶπον τοῖς Ἰουδαίοις
  choice: Dị nnọọ ka m gwara ndị Juu
  rationale: “Dị nnọọ ka” na-egosipụta ntụnyere καθώς, ebe “ndị Juu” na-echekwa okwu sara mbara dị na Grik kama imechi ya ozugbo ka ọ bụrụ naanị ndị isi.
- source_word: Ὅπου ἐγὼ ὑπάγω
  choice: Ebe m na-aga
  rationale: Nke a bụ ụzọ Igbo dị mfe ma kwekọọ n’echiche nke ịpụ ma ọ bụ ịga ebe ọzọ, n’etinyeghị nkọwa banyere ebe ahụ.
- source_word: οὐ δύνασθε ἐλθεῖν
  choice: unu enweghị ike ịbịa
  rationale: Usoro a na-egosipụta δύνασθε n’ụzọ doro anya dị ka enweghị ike, kama ịkọwa ma ihe mgbochi ahụ ọ̀ bụ nke oge, nke ikike, ma ọ bụ nke ọzọ.
- source_word: καὶ ὑμῖν λέγω ἄρτι
  choice: otu ahụ ka m na-agwakwa unu ugbu a
  rationale: Usoro a na-eme ka njikọ dị n’etiti ihe Jizọs gwara ndị Juu na ihe ọ na-agwa ndị na-eso ụzọ ya ugbu a pụta ìhè. “-kwa” na-egosipụta na ọ na-etinye otu okwu ahụ n’ebe ha nọ ugbu a.
theological_decisions:
- issue: Ihe τοῖς Ἰουδαίοις na-ezo aka na ya n’Oziọma Jọn
  choice: ndị Juu
  alternative: ndị isi ndị Juu
  rationale: Okwu Grik pụtara n’ụzọ nkịtị “ndị Juu.” Ọ bụ ezie na n’ebe ụfọdụ n’akwụkwọ Jọn ọ pụrụ izo aka n’ebe ndị isi Judia nọ karịsịa, amaokwu a n’onwe ya anaghị amanye ka e mee ka ihe ọ na-ezo aka na ya dị warara. Ya mere, e debere okwu sara mbara n’ahịrị bụ isi, tinyekwa nhọrọ nke ọzọ n’ala ala peeji.
- issue: Ụdị enweghị ike dị na οὐ δύνασθε ἐλθεῖν
  choice: unu enweghị ike ịbịa
  alternative: unu apụghị ịbịa
  rationale: Nhọrọ bụ isi na-echekwa okwu banyere ikike ma ọ bụ ike dị na δύνασθε, n’enweghị idozi ihe kpatara na ha agaghị abịa. Nhọrọ dị mkpirikpi ka edebere n’ala ala peeji.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ “Ụmụntakịrị” iji chekwaa olu ịhụnanya na ihe atụ ezinụlọ dị na τεκνία. E tinyere akara ala ala peeji [a] n’akụkụ “ndị Juu” na [b] n’akụkụ ahịrị enweghị ike ịbịa, ebe nhọrọ ndị ahụ metụtara kpọmkwem.
