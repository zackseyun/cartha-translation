id: JHN.13.31
reference: John 13:31
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ὅτε ⸀οὖν ἐξῆλθεν ⸀λέγει Ἰησοῦς· Νῦν ἐδοξάσθη ὁ υἱὸς τοῦ ἀνθρώπου, καὶ ὁ θεὸς ἐδοξάσθη ἐν αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/john/013/031.yaml
  text: So when he had gone out[a], Jesus said, “Now the Son of Man has been glorified, and God has been glorified in him.”
translation:
  language: ig
  text: Ya mere, mgbe ọ pụrụ, Jizọs kwuru, “Ugbu a, e nyela Nwa nke Mmadụ otuto, e nyekwara Chineke otuto n’ime ya[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “site n’aka ya.” Akpaokwu Grik ahụ pụrụ ịpụta na e nyere Chineke otuto n’ime Nwa ahụ ma ọ bụ site n’aka Nwa ahụ.
    reason: alternative_reading
lexical_decisions:
- source_word: Ὅτε οὖν
  choice: Ya mere, mgbe
  rationale: “Mgbe” na-egosi oge, ebe “ya mere” na-egosi njikọ na ọganihu akụkọ ahụ; nhazi a bụ Igbo nkịtị ma na-echekwa ọrụ okwu abụọ ahụ.
- source_word: ἐξῆλθεν
  choice: ọ pụrụ
  rationale: Aorist a na-ezo aka n’ọpụpụ Judas e kwuru n’amaokwu bu ụzọ. “Ọ pụrụ” na-echekwa echiche nke isi n’ebe ahụ pụọ n’enweghị itinye aha Judas n’amaokwu.
- source_word: λέγει
  choice: kwuru
  rationale: Ọ bụ ezie na Grik ji present akụkọ ihe mere eme, oge gara aga bụ ụzọ Igbo si akọ akụkọ a nke ọma.
- source_word: Νῦν
  choice: Ugbu a
  rationale: Nke a na-echekwa ma echiche oge ahụ kpọmkwem ma ntụgharị dị mkpa n’okwu Jizọs.
- source_word: ἐδοξάσθη
  choice: e nyela ... otuto
  rationale: Ụdị a na-echekwa olu nnara nke ngwaa ahụ ma na-egosi na inye otuto ahụ amalitela ma dị mkpa ugbu a, n’enweghị ịkọwapụta onye mere ya n’ebe Grik na-ekwughị ya kpọmkwem.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Nwa nke Mmadụ
  rationale: Nke a bụ aha Jizọs ji akpọ onwe ya, na-echekwakwa njikọ ya na ihe odide dịka Daniel 7.
- source_word: ὁ θεὸς
  choice: Chineke
  rationale: Nke a bụ ntụgharị kwụ ọtọ na nke a na-aghọta nke ọma maka θεός.
- source_word: ἐν αὐτῷ
  choice: n’ime ya
  rationale: Nke a na-echekwa ntụgharị kacha nso nke ἐν αὐτῷ na nghọta mmekọrịta ya; a hapụrụ nghọta ngwá ọrụ “site n’aka ya” n’ala peeji.
theological_decisions:
- issue: Ihe okwu banyere inye Nwa nke Mmadụ otuto pụtara
  choice: E depụtara ngwaa nnara abụọ ahụ dị ka ihe amalitela ugbu a, n’akọwaghị ma ọ bụ obe, mbilite n’ọnwụ, ibuli elu, ma ọ bụ ihe ndị a niile ka a na-ekwu kpọmkwem.
  alternative: Ịkọwa ya naanị dị ka mkpọgide n’obe, ma ọ bụ naanị dị ka mbilite n’ọnwụ na ibuli elu.
  rationale: Okwu Jọn na-ejikọtakarị ọnwụ Jizọs, mbilite n’ọnwụ ya, na ịlaghachikwuru Nna ya n’otuto ya. Ntụgharị ahụ na-ahapụ obosara na esemokwu nkà mmụta okpukpe ahụ dịka ederede si mee.
- issue: Ike ἐν αὐτῷ
  choice: n’ime ya
  alternative: site n’aka ya
  rationale: Akpaokwu ahụ pụrụ igosi na Chineke nwetara otuto n’ime Nwa ahụ, ma ọ bụ na o nwetara ya site n’aka Nwa ahụ. Isi ederede na-echekwa okwu Grik nso, ebe ala peeji na-egosi nghọta nke ọzọ.
translation_notes:
  register: Ejiri Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. “Nwa nke Mmadụ” ka e ji debe aha pụrụ iche ahụ; e zeere okwu ụka nke otu denomination na nkọwa ga-emechi nghọta ederede.
