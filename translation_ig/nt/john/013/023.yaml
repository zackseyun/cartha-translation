  text: ⸀ἦν ἀνακείμενος εἷς ⸀ἐκ τῶν μαθητῶν αὐτοῦ ἐν τῷ κόλπῳ τοῦ Ἰησοῦ, ὃν ἠγάπα ὁ Ἰησοῦς·
base_translation:
  language: en
  yaml_path: translation/nt/john/013/023.yaml
  text: One of his disciples[a], whom Jesus loved, was reclining in Jesus' bosom.
translation:
  language: ig
  text: Otu onye n’ime ndị na-eso ụzọ Jizọs, onye Jizọs hụrụ n’anya, nọ na-adina n’akụkụ Jizọs mgbe ha na-eri nri[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N'ụzọ nkịtị, “n’obi Jizọs,” ya bụ, n’akụkụ obi ya. Nke a bụ okwu e ji akọwa ebe otu onye dina n’akụkụ onye ọzọ mgbe ha na-eri nri.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνακείμενος
  choice: dina ... mgbe ha na-eri nri
  rationale: Okwu a na-egosi otú ndị mmadụ si edina n’akụkụ tebụl eri nri n’oge ahụ. Nsụgharị a na-echekwa ọnọdụ ahụ ma mee ka onye Igbo nke oge a ghọta na ọ bụ n’oge nri.
- source_word: εἷς ἐκ τῶν μαθητῶν αὐτοῦ
  choice: Otu onye n’ime ndị na-eso ụzọ Jizọs
  rationale: Nke a na-asụgharị nkebi nke na-egosi otu onye sitere n’etiti ndị na-eso ụzọ ya n’ụzọ doro anya ma bụrụ Igbo nkịtị.
- source_word: ἐν τῷ κόλπῳ τοῦ Ἰησοῦ
  choice: Jizọs nso
  rationale: N’ọnọdụ iri nri ahụ, okwu a na-akọwa ebe onye ahụ dina, ya bụ, n’akụkụ Jizọs nke ukwuu. ‘Jizọs nso’ na-ezere echiche na-adịghị mma nke na onye ahụ dina n’obi ma ọ bụ n’apata Jizọs; ihe okwu Grik pụtara n’ụzọ nkịtị ka edebere n’ihe odide ala peeji.
- source_word: ὃν ἠγάπα ὁ Ἰησοῦς
  choice: onye Jizọs hụrụ n’anya
  rationale: Nke a na-asụgharị ahịrị njikọ ahụ kpọmkwem ma na-echekwa okwu bụ ‘ịhụ n’anya’ n’enweghị itinye nkọwa ọzọ.
theological_decisions:
- issue: Ọnọdụ onye ahụ Jizọs hụrụ n’anya n’ebe Jizọs nọ
  choice: Jizọs nso mgbe ha na-eri nri
  alternative: n’obi Jizọs
  rationale: Isi ihe nkebi a na-ekwu bụ nhazi ebe ndị dina eri nri, ọ bụghị nkwupụta na onye ahụ na Jizọs jikọrọ n’ụzọ omimi. Nsụgharị isi na-eme ka ọnọdụ ahụ doo anya, ebe ihe odide ala peeji na-echekwa ọdịdị okwu Grik na myirịta ya na Jọn 1:18.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E kwughachiri aha Jizọs kama iji nnọchiaha nwere ike ime ka onye a na-ekwu maka ya ghara ido anya.
