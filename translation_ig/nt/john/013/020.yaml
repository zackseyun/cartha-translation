id: JHN.13.20
reference: John 13:20
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀμὴν ἀμὴν λέγω ὑμῖν, ὁ λαμβάνων ⸀ἄν τινα πέμψω ἐμὲ λαμβάνει, ὁ δὲ ἐμὲ λαμβάνων λαμβάνει τὸν πέμψαντά με.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/020.yaml
  text: Truly[a], truly, I say to you, whoever receives anyone I send receives me[b], and whoever receives me receives the one who sent me.
translation:
  language: ig
  text: '“N’ezie, n’ezie, ana m asị unu: onye ọ bụla na-anabata onye ọ bụla m ga-eziga[a] na-anabata m; onye na-anabata m na-anabatakwa onye zitere m.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “onye na-anabata onye ọ bụla m ga-eziga.”
    reason: lexical_alternative
  - marker: b
    text: N’ebe a, “onye zitere m” na-ezo aka na Nna.
    reason: cross_reference
lexical_decisions:
- source_word: ἀμὴν ἀμὴν
  choice: N’ezie, n’ezie
  rationale: Nke a na-edobe nkwughachi ahụ e ji mesie okwu ike, ma na-eme ka okwu mmeghe ahụ doo onye Igbo nke oge a anya.
- source_word: λέγω ὑμῖν
  choice: ana m asị unu
  rationale: Ọ bụ ntụgharị kwụ ọtọ, dịkwa n’ụdị asụsụ Igbo e ji ekwu okwu n'ụzọ dị ùgwù.
- source_word: ὁ λαμβάνων
  choice: onye ọ bụla nabatara
  rationale: Nkebi participle ahụ na-ekwu maka onye ọ bụla n’ozuzu ya, ọ bụghị naanị nwoke; ‘onye ọ bụla’ na-egosipụta nke a nke ọma.
- source_word: ἄν τινα πέμψω
  choice: onye ọ bụla m zitere
  rationale: Nke a na-edobe echiche nke onye ọ bụla Jizọs pụrụ iziga, n’enweghị igbochi ya n’otu onye kpọmkwem.
- source_word: λαμβάνει
  choice: na-anabata
  rationale: ‘Ịnabata’ nwere ike ịpụta ịnabata ma ọ bụ ịkwanyere onye ahụ na ozi ya ùgwù; idebe otu okwu ugboro ugboro na-echekwa njikọ nnọchiteanya dị n’amaokwu ahụ.
- source_word: ἐμέ
  choice: m
  rationale: Ọ bụ nnọchiaha e ji kpọọ Jizọs n’onwe ya, ya mere a tụgharịrị ya n'ụzọ dị mfe ma kwụ ọtọ.
- source_word: ὁ δὲ ἐμὲ λαμβάνων
  choice: onye ọ bụla nabatara m na-anabatakwa
  rationale: δέ bụ njikọ dị nro ebe a; ‘-kwa’ na Igbo na-egosipụta mgbakwunye na nzọụkwụ na-esochi ya n’enweghị ime ka ọ bụrụ mmegide siri ike.
- source_word: τὸν πέμψαντά με
  choice: Onye zitere m
  rationale: Nke a na-edobe okwu mmekọrịta dị na Grik n’etinyeghị aha ‘Nna’ ozugbo n’ahịrịokwu ahụ. E ji mkpụrụedemede ukwu dee ‘Onye’ iji mee ka ntụaka ahụ doo anya n’ụdị Igbo a na-eji ede Akwụkwọ Nsọ, n’agbanyeghị na Grik n’onwe ya enweghị ọdịiche mkpụrụedemede dị otú ahụ.
theological_decisions:
- issue: Onye okwu ‘Onye zitere m’ na-ezo aka na ya
  choice: Onye zitere m
  alternative: Nna ahụ zitere m
  rationale: N’akụkọ Jọn, okwu a na-ezo aka na Nna, ma amaokwu a akpọghị aha ‘Nna’ kpọmkwem. Ya mere, isi ederede na-edobe okwu mmekọrịta nke Grik, ebe nkọwa ala peeji na-eme ka ntụaka ya pụta ìhè.
- issue: Participles ndị dị n’ụdị nwoke ma bụrụ okwu izugbe
  choice: onye ọ bụla nabatara
  alternative: onye ahụ na-anabata
  rationale: Ụdị nwoke dị na ụtọasụsụ Grik ebe a anaghị egbochi ihe ahụ n’ebe ụmụ nwoke nọ. ‘Onye ọ bụla’ na-egosipụta nghọta izugbe ahụ n’Igbo eke.
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E debere nkwughachi ‘N’ezie, n’ezie’ na nkwughachi ‘na-anabata’ iji chekwaa ike okwu na usoro nnọchiteanya dị na Grik. E tinyere akara ala peeji [a] n’akụkụ nkebi ọ na-akọwa, kama n’akụkụ okwu mmeghe.
