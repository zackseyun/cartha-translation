review_pass:
  verdict: revise
  source_fidelity: The draft correctly identifies the meal as ongoing, the devil as the subject, Judas as Simon's son, and betrayal as the contextual sense of παραδίδωμι. However, “etinyeworị ya n’obi Judas … ka ọ rara Jizọs nye” introduces an unattested pronominal object before the purpose clause. In Igbo this can be read as the devil having put Jesus into Judas’s heart, rather than having planted the intention that Judas should hand Jesus over.
  naturalness: “Mgbe a nọ na-eri nri anyasị” is natural Standard Igbo. Removing the redundant and potentially misleading “ya” after “etinyeworị” makes the clause clear and idiomatic. The footnote marker for this expression should be placed at the expression itself, not after Simon’s name.
  terminology: “ekwensu,” “obi,” “Judas Iskarịọt, nwa Saịmọn,” and “rara Jizọs nye” are appropriate in register and meaning. “Rara ... nye” suitably conveys betrayal here without denying the underlying sense of handing over.
  issues:
  - severity: medium
    issue: The object pronoun “ya” in “ekwensu etinyeworị ya n’obi Judas” is misleading and redundant before the following purpose clause.
    rationale: Greek has the content clause ἵνα παραδοῖ αὐτόν as what the devil put into Judas’s heart; it does not contain a separate object pronoun corresponding to “ya” before that clause. In Igbo, the inserted pronoun may be understood as referring to Jesus.
  - severity: low
    issue: Footnote marker [b] is attached to “Saịmọn” rather than to “etinyeworị n’obi.”
    rationale: The footnote explains the idiom ἤδη βεβληκότος εἰς τὴν καρδίαν, so its anchor should immediately follow its Igbo rendering.
  revised_text: Mgbe a nọ na-eri nri anyasị[a], ekwensu etinyeworị n’obi[b] Judas Iskarịọt, nwa Saịmọn, ka ọ rara Jizọs nye[c],
