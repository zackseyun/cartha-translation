  text: καὶ δείπνου ⸀γινομένου, τοῦ διαβόλου ἤδη βεβληκότος εἰς τὴν καρδίαν ⸂ἵνα παραδοῖ αὐτὸν Ἰούδας Σίμωνος ⸀Ἰσκαριώτου⸃,
base_translation:
  language: en
  yaml_path: translation/nt/john/013/002.yaml
  text: And during supper[a], when the devil had already put it into the heart of Judas Iscariot, Simon's son, to betray him[c][b],
translation:
  language: ig
  text: Mgbe a nọ na-eri nri anyasị[a], ekwensu etinyeworị n’obi[b] Judas Iskarịọt, nwa Saịmọn, ka ọ rara Jizọs nye[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Ka nri anyasị ahụ na-aga n’ihu.” Okwu Grik apụtaghị na nri ahụ agwụlarị.
    reason: lexical_alternative
  - marker: b
    text: N’ụzọ nkịtị, “etinyeworị n’obi.” Ihe ọ pụtara nwekwara ike ịbụ “akpalitelarị ya ime ya.”
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “ka o nyefee Jizọs n’aka ndị ọzọ.” N’ọnọdụ a, “ịrara Jizọs nye” na-egosipụta ihe okwu ahụ pụtara nke ọma.
    reason: alternative_reading
lexical_decisions:
- source_word: δείπνου γινομένου
  choice: Mgbe a nọ na-eri nri anyasị
  rationale: 'Nke a na-egosi ihe na-eme n’otu oge ahụ: a ka nọ na-eri nri. Ọ naghị ekwu na nri ahụ agwụla.'
- source_word: διάβολος
  choice: ekwensu
  rationale: N’akụkọ Jọn, okwu a na-ezo aka n’ajọ onye ahụ n’onwe ya; “ekwensu” bụ aha a maara nke ọma n’Igbo.
- source_word: ἤδη βεβληκότος εἰς τὴν καρδίαν
  choice: etinyeworị ya n’obi
  rationale: Nke a chekwara ihe atụ dị n’asụsụ Grik nke itinye ebumnobi n’obi, ebe “-worị” na-egosi na nke a emeelarị tupu oge a na-akọ.
- source_word: καρδίαν
  choice: obi
  rationale: “Obi” na-echekwa ihe atụ Akwụkwọ Nsọ nke gụnyere echiche, ọchịchọ, na mkpebi, ọ bụghị naanị mmetụta.
- source_word: ἵνα παραδοῖ
  choice: ka ọ rara ... nye
  rationale: N’ọnọdụ Judas, inyefe Jizọs n’aka ndị iro bụ ịrara ya nye; nsụgharị a na-egosipụta ike okwu ahụ n’ọnọdụ a.
- source_word: αὐτόν
  choice: Jizọs
  rationale: E ji aha Jizọs dochie nnọchiaha ahụ iji mee ka onye a na-ekwu maka ya doo anya n’Igbo n’agbanyeghị na Grik kwuru naanị “ya.”
- source_word: Ἰούδας Σίμωνος Ἰσκαριώτου
  choice: Judas Iskarịọt, nwa Saịmọn
  rationale: Nke a na-akọwa Judas dịka Judas Iskarịọt ma kwuo na ọ bụ nwa Saịmọn, n’ụzọ doro anya ma kwekọọ n’usoro aha a na-ahụ n’akụkọ Jọn.
theological_decisions:
- issue: Ọrụ ekwensu na ibu ọrụ Judas n’ịrara Jizọs nye
  choice: Ekwensu etinyeworị ebumnobi ahụ n’obi Judas, ma Judas ka bụ onye ga-arara Jizọs nye.
  alternative: Ekwensu akpalitela Judas; ma ọ bụ ekwensu kpebiri ime ya site n’aka Judas.
  rationale: Grik na-ekwu maka mmetụta ekwensu ma ka na-egosi Judas dịka onye mere omume ahụ. Nsụgharị ahụ ahapụghị ma mmetụta ekwensu ma ibu ọrụ Judas.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. “Nri anyasị” na-egosi supper n’enweghị echiche na nri ahụ agwụla; “rara ... nye” bụ usoro okwu ndị Igbo na-aghọta maka betrayal. Akara nkọwa [a], [b], na [c] niile dị n’ahịrị isi.
