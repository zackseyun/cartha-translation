id: JHN.13.7
reference: John 13:7
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῷ· Ὃ ἐγὼ ποιῶ σὺ οὐκ οἶδας ἄρτι, γνώσῃ δὲ μετὰ ταῦτα.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/007.yaml
  text: Jesus answered and said to him[a], “What I am doing you do not know now[b], but you will understand after these things.”
translation:
  language: ig
  text: Jizọs zara ya sị, “Ihe m na-eme, ị maghị ya ugbu a,[a] ma ị ga-aghọta ya mgbe ihe ndị a gasịrị.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’asụsụ Grik, ngwaa e ji kwuo “ị maghị” dị iche na nke e ji kwuo “ị ga-aghọta”; a pụkwara ịsụgharị ha, “ị ghọtaghị ugbu a … ma ị ga-amata mgbe e mesịrị.”
    reason: lexical_alternative
  - marker: b
    text: “Mgbe ihe ndị a gasịrị” nwere ike izo aka n’ihe ndị ga-esochi n’omume a, ma ọ bụ, n’ụzọ sara mbara, n’ihe ndị ga-eme mgbe e mesịrị nke ga-eme ka ihe Jizọs mere doo anya.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθη … καὶ εἶπεν αὐτῷ
  choice: zara ya sị
  rationale: Nke a na-egosipụta ma nzaghachi ma mmalite okwu ahụ n’ụzọ Igbo dị n’okike, n’enweghị ikwughachi ‘kwuo’ n’ụzọ siri ike.
- source_word: Ὃ ἐγὼ ποιῶ
  choice: Ihe m na-eme
  rationale: Ọ na-egosi ihe Jizọs nọ na-eme n’oge ahụ, ya bụ, omume ka na-aga n’ihu.
- source_word: οὐκ οἶδας ἄρτι
  choice: ị maghị ya ugbu a
  rationale: ‘Maghị’ na-edobe isi echiche οἶδας bụ ịma, ebe ‘ugbu a’ na-anọchi ἄρτι n’ụzọ doro anya.
- source_word: γνώσῃ
  choice: ị ga-aghọta ya
  rationale: ‘Ga-aghọta’ na-egosi na Pita ga-emesị mata ihe omume ahụ pụtara, ma na-edobekwa ọdịiche dị n’etiti οἶδας na γινώσκω.
- source_word: δὲ
  choice: ma
  rationale: Ọ na-egosi ọdịiche dị n’etiti amaghị ugbu a na nghọta ga-abịa.
- source_word: μετὰ ταῦτα
  choice: mgbe ihe ndị a gasịrị
  rationale: Nke a na-agbasochi okwu Grik anya ma hapụ oge a na-ekwu banyere ya ka ọ ghara ịbụ nke a kọwara karịa isi mmalite.
theological_decisions:
- issue: Oge ‘mgbe ihe ndị a gasịrị’ na-ezo aka na ya
  choice: Ahapụrụ okwu ahụ n’ụdị sara mbara, n’ekwughị kpọmkwem ihe ga-eme ka Pita ghọta.
  alternative: Ọ pụrụ izo aka n’oge a sachara ụkwụ ha ma kọwaara ha ya, n’oge obe na mbilite n’ọnwụ gasịrị, ma ọ bụ n’oge Mmụọ Nsọ nyere nghọta zuru ezu.
  rationale: μετὰ ταῦτα akọwaghị otu oge kpọmkwem; nsụgharị ahụ na-echekwa ohere na esemokwu nkà mmụta okpukpe dị n’isi mmalite.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji ‘zara ya sị’ mee ka okwu ahụ bụrụ Igbo nkịtị, ebe e debere ọdịiche dị n’etiti ‘ịma’ na ‘ịghọta’ na mmeghe nke oge ọdịnihu.
