id: JHN.13.3
reference: John 13:3
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸀εἰδὼς ὅτι πάντα ⸀ἔδωκεν αὐτῷ ὁ πατὴρ εἰς τὰς χεῖρας, καὶ ὅτι ἀπὸ θεοῦ ἐξῆλθεν καὶ πρὸς τὸν θεὸν ὑπάγει,
base_translation:
  language: en
  yaml_path: translation/nt/john/013/003.yaml
  text: Jesus[a], knowing that the Father had given all things into his hands, and that he had come from God and was going to God[b],
translation:
  language: ig
  text: Jizọs maara na Nna enyefewo ya ihe niile n’aka, marakwa na o si n’ebe Chineke nọ bịa[a], na ọ na-alakwuru Chineke[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “o si n’ebe Chineke nọ pụta.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ọ na-alaghachikwuru Chineke”; Grik kwuru naanị, “ọ na-alakwuru Chineke.”
    reason: alternative_reading
lexical_decisions:
- source_word: εἰδὼς
  choice: maara
  rationale: Ọ bụ participle nke na-akọ ọnọdụ dị n’azụ ihe Jizọs mere n’amaokwu na-esote. “Maara” bụ Igbo doro anya ma ghara ịgbakwụnye ihe okwu Grik na-ekwughị.
- source_word: πάντα
  choice: ihe niile
  rationale: Nke a na-egosipụta oke zuru ezu nke neuter plural ahụ n’ụzọ ndị na-agụ Igbo ga-aghọta nke ọma.
- source_word: ἔδωκεν
  choice: enyefewo
  rationale: Ụdị perfect nke Igbo na-egosi na Nna emechaala ihe a tupu omume a na-akọ ugbu a; “nyefee” na-adabara okwu banyere itinye ihe n’aka mmadụ.
- source_word: εἰς τὰς χεῖρας
  choice: n’aka ya
  rationale: Akpaalaokwu Igbo a na-echekwa ihe atụ nke “n’aka” ma na-egosikwa ikike na nlekọta n’enweghị ịtụgharị ya ka ọ bụrụ naanị okwu nkọwa.
- source_word: ὁ πατὴρ
  choice: Nna
  rationale: A na-echekwa aha nsọpụrụ ahụ n’enweghị ịgbakwụnye possessive nke na-adịghị n’ederede Grik.
- source_word: ἀπὸ θεοῦ
  choice: si n’ebe Chineke nọ
  rationale: Nke a na-echekwa “site na Chineke,” ọ bụghị “site na Nna,” ma na-ada ka Igbo ebumpụta ụwa.
- source_word: ἐξῆλθεν
  choice: bịa
  rationale: N’ebe a, ngwaa ahụ na-ekwu maka ebe Jizọs si malite ma ọ bụ ozi o si na ya bịa. “Bịa” bụ okwu Igbo dị mfe nke na-ahapụ ịdị arọ nke okwu ahụ n’ọnọdụ ya.
- source_word: πρὸς τὸν θεὸν
  choice: na-alakwuru Chineke
  rationale: “Lakwuuru” na-egosi ngagharị chere ihu n’ebe Chineke nọ ma ghara ịgbakwụnye “laghachi,” nke na-adịghị n’okwu ndị a kpọmkwem.
- source_word: ὑπάγει
  choice: na-ala
  rationale: Present progressive nke Igbo na-egosipụta ọpụpụ ahụ na-abịaru nso n’akụkọ ahụ n’enweghị ịgbakwụnye nkọwa ọzọ.
theological_decisions:
- issue: Okwu banyere ebe Kraịst si bịa na ἀπὸ θεοῦ ἐξῆλθεν
  choice: o si n’ebe Chineke nọ bịa
  alternative: o si n’ebe Chineke nọ pụta
  rationale: Nhọrọ a na-echekwa nkwupụta Jọn banyere ebe Jizọs si bịa na ozi ya, ma ọ naghị ebubata usoro ozizi e mechara kọwaa nke amaokwu ahụ n’onwe ya na-ekwughị.
- issue: Okwu banyere ebe ọ na-aga na πρὸς τὸν θεὸν ὑπάγει
  choice: ọ na-alakwuru Chineke
  alternative: ọ na-alaghachikwuru Chineke
  rationale: Ọnọdụ gbara amaokwu ahụ gburugburu nwere ike ime ka a ghọta ya dị ka ịlaghachi, ma nkebiokwu Grik n’onwe ya kwuru naanị na ọ na-agakwuru Chineke. A hapụrụ esemokwu nkọwa ahụ ka ọ dị.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị ùgwù ma dị mfe nghọta. E debere usoro amaokwu ahụ dị ka nkebiokwu na-eduga n’omume amaokwu na-esote, ya mere e ji rikoma mechie ya. A na-eji “n’aka ya” echekwa ihe atụ Grik nke ikike e nyere ya.
