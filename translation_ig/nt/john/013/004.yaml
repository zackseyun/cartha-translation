review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the sequence of rising, laying aside outer clothing, taking a towel, and girding himself. However, “n’oche nri” means at/from a dining chair rather than from the meal/supper (ἐκ τοῦ δείπνου), and “gburugburu” does not express the specific girding action adequately.
  naturalness: The proposed revision is idiomatic Standard Igbo and uses the customary expression “kee onwe ya n’úkwù” for girding oneself. “Si n’oriri ahụ bilie” naturally states that he rose from the meal.
  terminology: “Oriri” accurately renders the meal without imposing a modern meal-time category. “Uwe elu” appropriately represents outer garments, and “akwa nhicha” is a clear rendering of λέντιον. No theological terminology is at issue.
  issues:
  - severity: high
    issue: “si n’oche nri” renders the setting as a dining chair.
    rationale: ἐκ τοῦ δείπνου means ‘from the supper/meal,’ not ‘from a dining chair.’ The wording must refer to the meal itself.
  - severity: medium
    issue: “kee onwe ya gburugburu” is imprecise for διέζωσεν ἑαυτόν.
    rationale: The Greek means that he girded himself with the towel, conventionally around the waist. “Kee onwe ya n’úkwù” gives this action clearly and naturally.
  revised_text: O si n’oriri ahụ bilie, yipụ uwe elu ya, were akwa nhicha kee onwe ya n’úkwù.
