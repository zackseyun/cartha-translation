base_translation:
  language: en
  yaml_path: translation/nt/john/013/004.yaml
  text: He rises from the supper and lays aside his outer garments[a], and taking a towel[b], tied it around himself.
translation:
  language: ig
  text: O si n’oriri ahụ bilie, yipụ uwe elu ya, were akwa nhicha kee onwe ya n’úkwù.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγείρεται
  choice: O ... bilie
  rationale: Ụdị ugbu a n’akụkọ Grik na-eme ka ihe ahụ dị ndụ; Igbo na-akọkarị usoro omume a nke ọma site n’usoro ngwaa, ‘O si ... bilie.’
- source_word: ἐκ τοῦ δείπνου
  choice: si n’oche nri
  rationale: Nke a na-egosi na o biliri n’ebe a na-eri nri, n’enweghị itinye echiche oge nri nke oge a n’ime δεῖπνον.
- source_word: τίθησιν τὰ ἱμάτια
  choice: yipụ uwe elu ya
  rationale: τίθημι n’ebe a pụtara iwepụ ma ọ bụ idowe uwe n’akụkụ; ἱμάτια na-ezo aka n’uwe elu, ya mere nke a anaghị enye echiche na ọ yipụrụ uwe niile.
- source_word: λαβὼν λέντιον
  choice: were akwa nhicha
  rationale: ‘Akwa nhicha’ bụ okwu Igbo doro anya maka λέντιον, akwa e ji eje ozi ma ọ bụ ehicha ihe.
- source_word: διέζωσεν ἑαυτόν
  choice: kee onwe ya gburugburu
  rationale: Nke a na-egosipụta omume nke iji akwa ahụ kee ahụ ya gburugburu n’asụsụ Igbo dị mfe ma doo anya.
