id: JHN.13.26
reference: John 13:26
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸀ἀποκρίνεται ὁ Ἰησοῦς· Ἐκεῖνός ἐστιν ᾧ ἐγὼ ⸀βάψω τὸ ψωμίον ⸂καὶ δώσω αὐτῷ⸃· ⸂βάψας οὖν⸃ τὸ ⸀ψωμίον δίδωσιν Ἰούδᾳ Σίμωνος ⸀Ἰσκαριώτου.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/026.yaml
  text: Jesus answers[a], “It is he to whom I will dip the piece of bread and give it.” So, having dipped the piece of bread, he gives it to Judas, the son of Simon Iscariot.
translation:
  language: ig
  text: Jizọs zara, sị, “Ọ bụ onye ahụ m ga-emikpu iberibe achịcha n'ime nri ma nye ya.” Ya mere, mgbe o mikpụrụ iberibe achịcha ahụ n'ime nri, o nyere ya Judas, nwa Saịmọn Iskarịọt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Judas Iskarịọt, nwa Saịmọn.” A pụrụ ịghọta usoro okwu Grik ahụ n’ụzọ abụọ.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποκρίνεται
  choice: zara
  rationale: Oge ugbu a nke akụkọ Grik na-arụ ọrụ dị ka historical present; oge gara aga bụ ụzọ Igbo si akọ akụkọ n'ụzọ ebumpụta ụwa.
- source_word: Ἐκεῖνός ἐστιν
  choice: Ọ bụ onye ahụ
  rationale: Nke a na-egosi ma na-akọwapụta onye a na-ekwu maka ya n'ụzọ doro anya ma dịkwa mma n'Igbo.
- source_word: ᾧ ἐγὼ βάψω τὸ ψωμίον καὶ δώσω αὐτῷ
  choice: onye ahụ m ga-enye iberibe achịcha a mgbe m tinyere ya n’ime ihe oriri
  rationale: A haziri nkebiokwu ahụ ka ọ bụrụ Igbo kwụụrụ onwe ya, ebe a ka na-egosi na ntinye achịcha n'ihe oriri ga-ebu ụzọ, inye ya esochie.
- source_word: βάψω / βάψας
  choice: m tinyere ya / o tinyere ... n’ime ihe oriri
  rationale: N'ọnọdụ nri a, βάπτω pụtara itinye achịcha n'ihe e ji eri ya; okwu a na-ezere echiche nke ime baptizim ma na-eme ka ihe a na-eme doo anya.
- source_word: ψωμίον
  choice: iberibe achịcha
  rationale: Ọ na-egosi obere iberibe nri ma ọ bụ achịcha; ntụgharị a bụ nke doro anya ma dị ugbu a n'Igbo.
- source_word: δίδωσιν
  choice: o nyere ya
  rationale: Ọ bụ historical present ọzọ; oge gara aga bụ usoro akụkọ Igbo kacha dị mma, ma 'ya' na-anọchi iberibe achịcha ahụ.
- source_word: Ἰούδᾳ Σίμωνος Ἰσκαριώτου
  choice: Judas, nwa Saịmọn Iskarịọt
  rationale: Nke a na-agbaso njikọ genitive Grik nke kacha nso, nke na-eme ka Iskarịọt kọwaa Saịmọn, ma na-edebe ohere ntụgharị ọzọ n'okpuru peeji.
theological_decisions:
- issue: Onye aha Iskarịọt na-akọwa na nkebiokwu ikpeazụ
  choice: Judas, nwa Saịmọn Iskarịọt
  alternative: Judas Iskarịọt, nwa Saịmọn
  rationale: Usoro okwu Grik Σίμωνος Ἰσκαριώτου nwere ike ịpụta na Iskarịọt na-akọwa Saịmọn, ma omenala aha ahụ nwekwara ike ime ka ọ kọwaa Judas. E debere ihe mbụ n'ahịrị, tinyekwa nke ọzọ n'okpuru peeji ka a ghara idozi mgbagwoju anya ahụ n'amaghị ama.
translation_notes:
  register: Igbo Izugbe dị ugbu a, dị ùgwù ma dị mfe nghọta. A họọrọ usoro akụkọ oge gara aga dịka asụsụ Igbo si dị, ma chekwaa mgbagwoju anya dị n'aha ikpeazụ site n'okpuru peeji.
