revisions:
- from: Jizọs zara, sị, “Ọ bụ onye ahụ m ga-enye iberibe achịcha a mgbe m tinyere ya n’ime ihe oriri.” Ya mere, mgbe o tinyere iberibe achịcha ahụ n’ime ihe oriri, o nyere ya Judas, nwa Saịmọn Iskarịọt.[a]
  to: Jizọs zara, sị, “Ọ bụ onye ahụ m ga-emikpu iberibe achịcha n'ime nri ma nye ya.” Ya mere, mgbe o mikpụrụ iberibe achịcha ahụ n'ime nri, o nyere ya Judas, nwa Saịmọn Iskarịọt.[a]
  rationale: The revision corrects the source-level sequence of dipping and giving, uses idiomatic food-context language for βάπτω, and retains both the historical narrative style and the unresolved syntactic ambiguity in the final personal designation. The footnote anchor is positioned at the phrase under discussion.
