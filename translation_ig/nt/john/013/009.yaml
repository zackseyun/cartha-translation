  text: λέγει αὐτῷ Σίμων Πέτρος· Κύριε, μὴ τοὺς πόδας μου μόνον ἀλλὰ καὶ τὰς χεῖρας καὶ τὴν κεφαλήν.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/009.yaml
  text: Simon Peter says to him[a], “Lord, not only my feet, but also my hands and my head.”
translation:
  language: ig
  text: Saịmọn Pita sịrị ya, “Onyenwe anyị,[a] ọ bụghị naanị ụkwụ m, kama kwa aka m na isi m.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ, “Nna ukwu.” Grik: Kyrios.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: sịrị
  rationale: A sụgharịrị historical present Grik n’oge gara aga, nke bụ ụzọ Igbo nkịtị si akọ akụkọ n’enweghị ịgbanwe ihe ọ pụtara.
- source_word: αὐτῷ
  choice: ya
  rationale: E debere nnọchiaha ahụ dịka Grik si dị; ihe gbara amaokwu a gburugburu na-egosi na ọ bụ Jizọs.
- source_word: Σίμων Πέτρος
  choice: Saịmọn Pita
  rationale: E dere aha ndị a n’ụdị a na-amakarị n’Igbo.
- source_word: Κύριε
  choice: Onyenwe anyị
  rationale: Aha nkwanye ùgwù a na-echekwa ma nkwanye ùgwù Pita nwere n’ebe Jizọs nọ ma ụda nkà mmụta okpukpe dị n’Oziọma Jọn.
- source_word: μὴ ... μόνον ἀλλὰ καὶ
  choice: ọ bụghị naanị ... kama ... kwa
  rationale: Usoro a na-egosi na Pita achọghị ka a sachaa naanị otu akụkụ, kama ka e tinyekwa akụkụ ndị ọzọ.
- source_word: τοὺς πόδας μου
  choice: ụkwụ m
  rationale: Nke a bụ nsụgharị kpọmkwem na nke ebumpụta ụwa nke ihe ahụ a ga-asa na onye nwe ya.
- source_word: τὰς χεῖρας
  choice: aka m
  rationale: Ọ bụ ezie na Grik ekwughachighị nnọchiaha nwe ihe, njikọ ya na ‘ụkwụ m’ na-egosi na aka ahụ bụ nke Pita.
- source_word: τὴν κεφαλήν
  choice: isi m
  rationale: ‘Isi’ bụ ihe okwu ahụ pụtara n’ebe a; e tinyere ‘m’ n’ụzọ Igbo si ekwu njikọ akụkụ ahụ ndị a.
- source_word: elliptical washing command implied by context
  choice: sachakwa
  rationale: Grik hapụrụ ngwaa ahụ n’ihi na okwu Jizọs banyere ịsa ụkwụ dị n’amaokwu bu ụzọ mere ka ọ doo anya. Igbo chọrọ ka e weghachite ya ka ahịrịokwu ahụ zuo oke ma bụrụ nke doro anya.
theological_decisions:
- issue: Nsụgharị κύριος mgbe Pita na-akpọ Jizọs
  choice: Onyenwe anyị
  alternative: Nna ukwu
  rationale: ‘Onyenwe anyị’ bụ aha a na-ejikarị sụgharịa κύριος ma na-echekwa ịdị arọ nke aha ahụ n’Oziọma Jọn; ‘Nna ukwu’ nwekwara ike igosi onye nkuzi ma ọ bụ onyeisi.
translation_notes:
  register: Igbo ọkọlọtọ, dị ugbu a ma kwanyere ugwu. E jiri ‘sịrị’ mee ka akụkọ ahụ daa n’ụzọ ebumpụta ụwa n’Igbo, ma e weghachiri ngwaa ‘sachakwa’ nke Grik hapụrụ n’ihi ihe gbara ya gburugburu.
