    issue: E tinyere “sachakwa” n’ọmụmaokwu ahụ.
    rationale: Ngwaa “ịsa” bụ ihe a na-aghọta site n’amaokwu ndị gbara ya gburugburu, ma ọ nọghị n’ihe odide Grik nke Jọn 13:9. Ịtinye ya na-agbanwekwa njikọ mgbakwunye μὴ ... μόνον ἀλλὰ καὶ ka o yie mgbanwe (“rather”) karịa mgbakwunye (“but also”).
