  to: Saịmọn Pita sịrị ya, “Onyenwe anyị,[a] ọ bụghị naanị ụkwụ m, kama kwa aka m na isi m.”
  rationale: E wepụrụ “sachakwa” iji debe ellipsis nke Grik ma gbochie nghọta na aka na isi nọchiri ụkwụ anya. “Kama kwa” na-egosi n’Igbo na a na-agbakwunye aka na isi n’ihe Pita rịọrọ, dịka ἀλλὰ καί si eme n’asụsụ Grik. A hapụrụ “sịrị” dịka mmegharị akụkọ Igbo nke present λέγει.
