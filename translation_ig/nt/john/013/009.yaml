review_pass:
  verdict: revise
  source_fidelity: 'A na-anọchi anya ihe ndị bụ isi nke Grik nke ọma: Saịmọn Pita, nnọchiaha “ya,” aha nkwanye ùgwù κύριε, na ụkwụ/aka/isi. Otú ọ dị, “sachakwa” na-etinye ngwaa n’amaokwu ebe Grik hapụrụ ya ka a ghọta ya site n’okwu gbara ya gburugburu. Ọzọkwa, nhazi “kama sachakwa aka m na isi m” pụrụ ịpụta na a ga-asa aka na isi *n’ọnọdụ* ụkwụ, kama Grik na-agbakwunye ha na ụkwụ. E kwesịghị itinye ngwaa ahụ n’amaokwu a.'
  naturalness: “Sịrị ya” bụ Igbo ọkọlọtọ na nke na-agụ nke ọma n’akụkọ. Nhazi “ọ bụghị naanị ụkwụ m, kama kwa aka m na isi m” na-edobe ellipsis nke Grik, doo anya n’ihi ihe gbara amaokwu ahụ gburugburu, ma na-asụkwa Igbo n’ụzọ nkịtị.
  terminology: “Onyenwe anyị” bụ nsụgharị kwesịrị ekwesị ma bụrụkwa aha nkwanye ùgwù a na-ahụkarị maka κύριε. Ihe ndetu “Nna ukwu” na-enye nhọrọ okwu kwesịrị ekwesị n’emeghị ka otu nghọta okpukpe bụrụ iwu.
  issues:
