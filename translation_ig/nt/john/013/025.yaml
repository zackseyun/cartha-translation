  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸀ἀναπεσὼν ἐκεῖνος οὕτως ἐπὶ τὸ στῆθος τοῦ Ἰησοῦ λέγει αὐτῷ· Κύριε, τίς ἐστιν;
base_translation:
  language: en
  yaml_path: translation/nt/john/013/025.yaml
  text: So he[a], leaning back in this way against Jesus' chest, says to him, “Lord, who is it?”
translation:
  language: ig
  text: Onye ahụ wee dabere azụ otu a n’akụkụ obi Jizọs[a], sị ya, “Onyenwe anyị, ònye ka ọ bụ?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “dina n’akụkụ obi Jizọs.” Okwu Grik na-egosi otú ndị mmadụ si eri nri mgbe ha dinara n’oche oriri ma dabere azụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναπεσὼν
  choice: dabere azụ
  rationale: N’ebe a, okwu a na-egosi mmegharị onye nọ na-eri nri ka ọ na-ehulata azụ n’ebe Jizọs nọ; “dabere azụ” na-egosi ma mmegharị ahụ ma otú ha si anọdụ iri nri n’oge ahụ.
- source_word: ἐκεῖνος
  choice: Onye ahụ
  rationale: Nke a na-edobe ike okwu ngosi ahụ, “onye ahụ,” n’enweghị ịtinye nkọwa na ọ bụ “onye na-eso ụzọ ahụ,” nke okwu Grik n’onwe ya ekwughị kpọmkwem n’amaokwu a.
- source_word: οὕτως
  choice: otu a
  rationale: “Otu a” jikọtara ihe onye ahụ mere na ọnọdụ ya nke amaokwu bu ụzọ kọwara, ma na-asụkwa Igbo n’ụzọ doro anya.
- source_word: ἐπὶ τὸ στῆθος τοῦ Ἰησοῦ
  choice: n’obi Jizọs
  rationale: N’Igbo, “obi” nwere ike ịpụta ebe obi dị n’ahụ, ya bụ akụkụ ihu nke igbe obi; n’ọnọdụ a ọ na-egosi ebe onye ahụ dabere, ọ bụghị echiche ma ọ bụ mmetụta Jizọs.
- source_word: λέγει αὐτῷ
  choice: sị ya
  rationale: “Sị ya” bụ ụzọ dị nkenke ma dịkwa eke e si akọ okwu kpọmkwem n’Igbo. Ọ na-arụ ọrụ nke ọma n’usoro akụkọ nke “wee” webatara, ọ bụ ezie na Grik ji present akụkọ ihe mere eme.
- source_word: Κύριε
  choice: Onyenwe anyị
  rationale: Nke a bụ nsụgharị Igbo a na-ejikarị maka κύριος mgbe a na-akpọ Jizọs; ọ na-edobe ma nkwanye ùgwù ahụ ma ohere nke ihe aha ahụ pụtara n’ụzọ okpukpe.
- source_word: τίς ἐστιν;
  choice: ònye ka ọ bụ?
  rationale: Ajụjụ a na-achọ ka a mata onye Jizọs kwuru maka ya. Nke a bụ ụzọ e si ajụ ya n’Igbo nkịtị ma ọ naghị ekpebi ihe karịrị ihe Grik kwuru.
theological_decisions:
- issue: Nsụgharị κύριος mgbe a na-akpọ Jizọs okwu
  choice: Onyenwe anyị
  alternative: Nna anyị ukwu; Nna m ukwu
  rationale: “Onyenwe anyị” na-edobe aha nsọpụrụ ahụ na ụda nkà mmụta banyere Kraịst nke Oziọma Jọn nwere ike ibu, n’ebughị ụzọ kpebie na ọ bụ naanị okwu nkwanye ùgwù nkịtị.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. “Onye ahụ” na-edobe okwu ngosi Grik; “wee … sị ya” na-eme ka usoro akụkọ ahụ bụrụ nke eke n’Igbo. Akara nkọwa ala peeji [a] dị n’ederede bụ isi.
