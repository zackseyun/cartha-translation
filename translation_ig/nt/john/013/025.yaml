  to: Onye ahụ wee dabere azụ otu a n’akụkụ obi Jizọs[a], sị ya, “Onyenwe anyị, ònye ka ọ bụ?”
  rationale: The revision retains the draft’s faithful handling of the demonstrative, posture, and question, while clarifying the anatomical sense of “chest” and correcting the historical description of reclining at a meal in the footnote.
