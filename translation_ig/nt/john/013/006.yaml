revisions:
- from: Ya mere, ọ bịakwutere Saịmọn Pita. Pita sịrị ya[a], “Onyenwe anyị, ọ bụ gị ga-asa m ụkwụ?”
  to: Ya mere, ọ bịakwutere Saịmọn Pita. Pita sịrị ya[a], “Onyenwe anyị, ọ bụ gị na-asa m ụkwụ?”
  rationale: The revision preserves the Greek narrative movement, Peter's emphatic question, and the conventional rendering of Κύριε, while correcting the verbal aspect and making the alternative-address footnote accurate and idiomatic.
  reviewer_model: gpt-5.6-terra
