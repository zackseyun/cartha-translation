  text: ἔρχεται οὖν πρὸς Σίμωνα Πέτρον. ⸀λέγει ⸀αὐτῷ· Κύριε, σύ μου νίπτεις τοὺς πόδας;
base_translation:
  language: en
  yaml_path: translation/nt/john/013/006.yaml
  text: So he comes to Simon Peter. He says to him[a], “Lord, are you washing my feet?”
translation:
  language: ig
  text: Ya mere, ọ bịakwutere Saịmọn Pita. Pita sịrị ya[a], “Onyenwe anyị, ọ bụ gị na-asa m ụkwụ?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Nna ukwu, ọ bụ gị na-asa m ụkwụ?” Okwu Grik bụ κύριε pụrụ ịbụ ụzọ nkwanye ùgwù e si akpọ mmadụ; ma e debere “Onyenwe anyị” n’ebe a dịka nsụgharị bụ isi.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔρχεται
  choice: ọ bịakwutere
  rationale: A sụgharịrị historical present ahụ n’oge gara aga, nke bụ ụzọ akụkọ Igbo si ada nke ọma; ‘bịakwutere’ na-egosikwa ije bịakwute mmadụ.
- source_word: οὖν
  choice: Ya mere
  rationale: Na-ejide njikọ na ọganihu akụkọ ahụ n’asụsụ Igbo doro anya.
- source_word: πρὸς Σίμωνα Πέτρον
  choice: Saịmọn Pita
  rationale: E tinyere aha ahụ dịka onye a bịakwutere; ngwaa ‘bịakwutere’ ebunyelarị echiche πρός.
- source_word: λέγει αὐτῷ
  choice: Pita sịrị ya
  rationale: A kpọpụtara Pita aha iji mee ka onye na-ekwu okwu doo anya n’Igbo, ma ‘ya’ na-anọchi αὐτῷ.
- source_word: Κύριε
  choice: Onyenwe anyị
  rationale: Nke a bụ nsụgharị Igbo a na-ejikarị akpọ κύριος dịka ‘Lord’; ọ na-echekwa nkwanye ùgwù na ịdị omimi metụtara onye Kraịst.
- source_word: σύ
  choice: ọ bụ gị
  rationale: Usoro ajụjụ a na-eme ka nkwusi ike dị n’okwu nnọchiaha Greek pụta n’Igbo.
- source_word: μου
  choice: m
  rationale: N’usoro Igbo ‘asa m ụkwụ,’ nnọchiaha ihe ‘m’ na-egosi na ụkwụ ahụ bụ nke onye na-ekwu okwu.
- source_word: νίπτεις
  choice: ga-asa
  rationale: N’ọnọdụ a, ajụjụ Pita na-elekwasị anya n’ihe Jizọs na-achọ ime ya; ọdịnihu dị nso na-ada nke ọma n’Igbo ma ghara ịgbanwe isi ihe omume ahụ.
- source_word: τοὺς πόδας
  choice: ụkwụ
  rationale: ‘Ụkwụ’ bụ okwu Igbo nkịtị maka feet, ebe ‘asa m ụkwụ’ na-egosi akụkụ ahụ a na-asa, ọ bụghị ịsa ahụ dum.
theological_decisions:
- issue: Nsụgharị κύριος mgbe Pita na-akpọ Jizọs okwu
  choice: Onyenwe anyị
  alternative: Nna anyị ukwu
  rationale: ‘Onyenwe anyị’ na-echekwa ma nkwanye ùgwù Pita na-enye Jizọs ma ụda metụtara ịbụ Lord n’Oziọma Jọn, n’enweghị ikwubiga ihe ederede ahụ ókè.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. A họọrọ usoro akụkọ Igbo eke karịa idowe historical present Greek n’ụzọ ga-ada ka nsụgharị siri ike.
