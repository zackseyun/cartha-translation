review_pass:
  verdict: revise
  source_fidelity: The draft correctly identifies Peter as the speaker and conveys Jesus' approach to Simon Peter. However, «ga-asa» makes Peter's question future-oriented ('are you going to wash'), whereas νίπτεις is a present-tense historical-present verb describing the action at hand. The Greek's emphatic σύ is well represented by «ọ bụ gị».
  naturalness: «Ya mere, ọ bịakwutere Saịmọn Pita. Pita sịrị ya» is clear, natural Standard Igbo narrative. Replacing «ga-asa» with «na-asa» gives a natural ongoing-action question in this immediate scene.
  terminology: «Onyenwe anyị» is an established respectful and christologically resonant Igbo rendering for Κύριε in this Gospel context. The proposed alternative «Nna anyị ukwu» is not an appropriate equivalent for Greek κύριε ('Sir/Lord') and should be replaced with «Nna ukwu» as the respectful-address alternative.
  issues:
  - severity: medium
    issue: «ga-asa» renders νίπτεις as prospective/future.
    rationale: νίπτεις is present tense and, in the scene, Peter reacts to Jesus' current act of washing. «na-asa» retains this aspect without importing a future intention.
  - severity: medium
    issue: The footnote's alternative «Nna anyị ukwu» is semantically and pragmatically unsuitable for κύριε.
    rationale: It means roughly 'our great father' and adds familial/plural language absent from the Greek. «Nna ukwu» can serve as a respectful 'Sir' alternative without that addition.
  revised_text: Ya mere, ọ bịakwutere Saịmọn Pita. Pita sịrị ya[a], “Onyenwe anyị, ọ bụ gị na-asa m ụkwụ?”
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “Nna ukwu, ọ bụ gị na-asa m ụkwụ?” Okwu Grik bụ κύριε pụrụ ịbụ ụzọ nkwanye ùgwù e si akpọ mmadụ; ma e debere “Onyenwe anyị” n’ebe a dịka nsụgharị bụ isi.
    reason: alternative_reading
  revision_rationale: The revision preserves the Greek narrative movement, Peter's emphatic question, and the conventional rendering of Κύριε, while correcting the verbal aspect and making the alternative-address footnote accurate and idiomatic.
