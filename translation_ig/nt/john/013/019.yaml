- from: Site ugbu a gaa n’ihu, ana m agwa unu ihe a tupu ya emee, ka mgbe ọ ga-eme, unu wee kwere na Abụ m onye ahụ.[a]
  to: Site ugbu a gaa n’ihu, ana m agwa unu tupu o mee, ka, mgbe o mere, unu kwere na m bụ onye ahụ.[a]
  rationale: 'The revision corrects the Standard Igbo copular order, improves the idiomatic reference to the future event, and refines the footnote’s language about a possible intertextual echo. It preserves the Greek’s ambiguity: the main text uses the intelligible supplied sense “onye ahụ,” while the footnote retains the more literal predicate-less “na m bụ.”'
