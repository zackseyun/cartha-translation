  text: ἀπ’ ἄρτι λέγω ὑμῖν πρὸ τοῦ γενέσθαι, ἵνα ⸂πιστεύσητε ὅταν γένηται⸃ ὅτι ἐγώ εἰμι.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/019.yaml
  text: From now on I am telling you before it happens[a], so that when it does happen, you may believe that I am he.
translation:
  language: ig
  text: Site ugbu a gaa n’ihu, ana m agwa unu tupu o mee, ka, mgbe o mere, unu kwere na m bụ onye ahụ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n’ụzọ kpọmkwem, “na m bụ.” Okwu Grik a nwekwara ike ịbụ ntụrụ aka n’okwu Chineke ji akọwa onwe ya n’Aịzaya na n’ebe ndị ọzọ n’Oziọma Jọn.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπ’ ἄρτι
  choice: Site ugbu a gaa n’ihu
  rationale: Nke a bụ ụzọ Igbo dị mfe ma doo anya isi gosi oge malite ugbu a na-aga n’ihu.
- source_word: λέγω ὑμῖν
  choice: ana m agwa unu
  rationale: Ọ na-egosipụta ngwaa dị n’oge ugbu a na okwu a na-agwa ọtụtụ mmadụ kpọmkwem.
- source_word: πρὸ τοῦ γενέσθαι
  choice: tupu ya emee
  rationale: Ọ na-echekwa echiche nke ihe a na-akọwaghị kpọmkwem nke ga-eme n’ọdịnihu.
- source_word: ἵνα
  choice: ka ... wee
  rationale: Usoro Igbo a na-egosipụta nzube nke okwu ahụ n'ụzọ ebumpụta ụwa.
- source_word: πιστεύσητε
  choice: unu wee kwere
  rationale: ‘Kwere’ na-echekwa njikọ okwu nke πιστεύω ma ghara ịmanye echiche ‘ịtụkwasị obi’ ebe ihe odide ahụ ekwughị ya kpọmkwem.
- source_word: ὅταν γένηται
  choice: mgbe ọ ga-eme
  rationale: Ọ na-egosi ihe a tụrụ anya na ọ ga-eme n’ọdịnihu ma jikọta ya na amụma ahụ.
- source_word: ὅτι ἐγώ εἰμι
  choice: na Abụ m onye ahụ
  rationale: Nke a na-ada nke ọma n’Igbo ma na-egosipụta njirimara onwe onye, ebe ndetu ala na-echekwa nsụgharị nkịtị na omimi nwere ike ịdị n’okwu Grik ahụ.
theological_decisions:
- issue: Otu a ga-esi sụgharịa ἐγώ εἰμι nke na-enweghị ihe e tinyere n’azụ ya, ma nwee ike ịkpọghachi okwu Chineke ji kọwaa onwe ya
  choice: na Abụ m onye ahụ
  alternative: na Abụ m
  rationale: ‘Abụ m onye ahụ’ na-enye onye na-agụ Igbo nghọta zuru oke n’etinyeghị aha ma ọ bụ ọkwa nke na-adịghị n’asụsụ Grik. Ndetu ala na-echekwa ‘Abụ m’ nke dị nso karị n’ụdị Grik ma gosi na okwu ahụ nwere ike ibu ihe karịrị nanị njirimara mmadụ.
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta. E debere ahịrịokwu ahụ n’usoro ebumpụta ụwa nke Igbo, ma e chekwara mgbagwoju anya na ibu nkà mmụta okpukpe dị na ἐγώ εἰμι site na ndetu ala.
