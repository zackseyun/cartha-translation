id: JHN.13.29
reference: John 13:29
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τινὲς γὰρ ἐδόκουν, ἐπεὶ τὸ γλωσσόκομον ⸀εἶχεν Ἰούδας, ὅτι λέγει αὐτῷ ⸀ὁ Ἰησοῦς· Ἀγόρασον ὧν χρείαν ἔχομεν εἰς τὴν ἑορτήν, ἢ τοῖς πτωχοῖς ἵνα τι δῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/029.yaml
  text: For some thought that[a], because Judas had the money box, Jesus was telling him[b], “Buy what we need for the feast,” or that he should give something to the poor.
translation:
  language: ig
  text: Ụfọdụ chere na Jizọs na-agwa Judas, n’ihi na ọ bụ ya ji igbe ego ahụ[a], sị, “Zụta ihe ndị dị anyị mkpa maka ememme ahụ[b],” ma ọ bụ na ọ ga-enye ndị ogbenye ihe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “akpa ego.” Okwu Grik ahụ na-ezo aka n’ihe e ji edowe ego ndị otu ahụ.
    reason: lexical_alternative
  - marker: b
    text: “Ememme ahụ” na-ezo aka n’ememme Ngabiga, nke bụ ọnọdụ a na-akọ n’akụkụ Akwụkwọ Nsọ a.
    reason: cross_reference
lexical_decisions:
- source_word: τινὲς
  choice: ụfọdụ n’ime ha
  rationale: Ọ na-ezo aka n’ụfọdụ ndị nọ ebe ahụ; nkebi a na-eme ka ihe a pụtara doo anya n’Igbo n’etinyeghị onye ọ bụla ọzọ na ya.
- source_word: ἐδόκουν
  choice: chere
  rationale: Nke a bụ ụzọ Igbo dị mfe ma bụrụkwa nke e ji akọ akụkọ iji kwuo echiche ha nwere n’oge ahụ.
- source_word: ἐπεὶ
  choice: ebe ọ bụ
  rationale: 'Ọ na-egosi ihe mere ha ji chee otú ahụ: Judas bụ onye ji igbe ego ahụ.'
- source_word: γλωσσόκομον
  choice: igbe ego
  rationale: Okwu Grik ahụ na-ezo aka n’ihe e ji edowe ego ndị otu ahụ; ‘igbe ego’ na-edobe echiche ahụ n’enweghị ịkọwa ọdịdị ya karịa ihe isi mmalite kwuru.
- source_word: εἶχεν
  choice: ji
  rationale: ‘Ji’ na-egosipụta na Judas nwere igbe ahụ n’aka ma ọ bụ na-elekọta ya, ma ọ naghị agbakwunye nkọwa na-adịghị n’ọrụ ngwaa Grik ahụ.
- source_word: λέγει αὐτῷ ὁ Ἰησοῦς
  choice: Jizọs na-agwa ya
  rationale: Oge ugbu a e ji akọ akụkọ n’asụsụ Grik dabara nke ọma n’ụdị akụkọ Igbo a, ma na-egosikwa ihe ndị ahụ chere na Jizọs pụtara.
- source_word: Ἀγόρασον
  choice: Zụta
  rationale: Ọ bụ iwu dị nkenke ma kwụ ọtọ, nke a na-asụkarị n’Igbo.
- source_word: ὧν χρείαν ἔχομεν
  choice: ihe ndị dị anyị mkpa
  rationale: Nke a bụ ntụgharị Igbo doro anya ma kwekọọ na echiche nke ‘ihe anyị chọrọ’ n’ebe a.
- source_word: εἰς τὴν ἑορτήν
  choice: maka ememme ahụ
  rationale: ‘Ememme’ na-anọchi anya ememme okpukpe a kpọrọ ἑορτή, n’agbakwunyeghị ‘Ngabiga’ n’ahịrị ebe amaokwu ahụ ekwughị ya kpọmkwem.
- source_word: τοῖς πτωχοῖς
  choice: ndị ogbenye
  rationale: Nke a bụ aha Igbo nkịtị maka ndị dara ogbenye, ọ dabara na ngwaa ‘nye.’
- source_word: ἵνα τι δῷ
  choice: na ọ ga-enye ndị ogbenye ihe
  rationale: Nke a na-edobe ihe nke abụọ ndị ahụ chere na Jizọs na-agwa Judas ka o mee, n’ụdị Igbo na-aga were were.
theological_decisions:
- issue: Ịkpọ ememme ahụ aha kpọmkwem dị ka Ngabiga
  choice: E ji ‘ememme ahụ’ mee ihe n’ahịrị bụ isi.
  alternative: ‘ememme Ngabiga ahụ’
  rationale: Ọnọdụ gbara amaokwu a gburugburu bụ nke Ngabiga, ma amaokwu a n’onwe ya ji naanị okwu izugbe ἑορτή; ntụgharị ahụ anaghị etinye aha a na-ekwughị kpọmkwem, ebe nkọwa ala peeji na-enye ọnọdụ ya.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị ugwu ma dị mfe nghọta, mee ihe. Ahịrịokwu ahụ debere usoro ihe kpatara echiche ndị nọ ebe ahụ, ma hapụ ‘ememme’ ka ọ bụrụ okwu izugbe dịka ọ dị n’asụsụ Grik.
