id: JHN.13.34
reference: John 13:34
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐντολὴν καινὴν δίδωμι ὑμῖν ἵνα ἀγαπᾶτε ἀλλήλους, καθὼς ἠγάπησα ὑμᾶς ἵνα καὶ ὑμεῖς ἀγαπᾶτε ἀλλήλους.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/034.yaml
  text: 'A new commandment I give to you: that you love one another[a]. Just as I loved you[b], you also are to love one another.'
translation:
  language: ig
  text: 'Ana m enye unu iwu ọhụrụ: ka unu hụ ibe unu n’anya. Dị nnọọ ka m hụrụ unu n’anya, ka unu hụtakwa ibe unu n’anya[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị nkebi ikpeazụ a, “unu onwe unu kwesịkwara ịhụ ibe unu n’anya.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἐντολὴν
  choice: iwu
  rationale: “Iwu” bụ okwu Igbo doro anya ma dịkwa ùgwù maka ntụziaka nwere ikike; ọ dabara n’ọrụ ἐντολή n’Oziọma Jọn.
- source_word: καινὴν
  choice: ọhụrụ
  rationale: “Ọhụrụ” na-edobe ihe καινός pụtara n’ụzọ sara mbara, n’akọwaghị ma ọ bụ ọhụrụ n’oge, n’ụdị, ma ọ bụ n’otú e si mezuo ya.
- source_word: δίδωμι ὑμῖν
  choice: Ana m enye unu
  rationale: Nke a na-edobe present indicative na onye nnata dative n’asụsụ Igbo e ji ekwu okwu ugbu a.
- source_word: ἵνα ἀγαπᾶτε ἀλλήλους
  choice: ka unu hụrịta onwe unu n’anya
  rationale: “Ka” na-egosi ọdịnaya ma ọ bụ nzube iwu ahụ; “hụrịta onwe unu n’anya” na-edobe mmekọrịta reciprocal nke ἀλλήλους.
- source_word: καθὼς
  choice: Dị nnọọ ka
  rationale: Nke a na-egosi n’ụzọ doro anya na ịhụnanya Jizọs bụ ụkpụrụ e ji atụ ịhụnanya ndị na-eso ụzọ.
- source_word: ἠγάπησα ὑμᾶς
  choice: m si hụ unu n’anya
  rationale: A na-eji “si” mee ka ntụnyere ahụ bụrụ nke Igbo na-asụkarị, ebe past sense dị na njikọ okwu ahụ n’enweghị ịgbakwunye nkọwa ọzọ.
- source_word: ἵνα καὶ ὑμεῖς ἀγαπᾶτε ἀλλήλους
  choice: unu onwe unu kwesịkwara ịhụrịta onwe unu n’anya
  rationale: “Unu onwe unu” na “kwesịkwara” na-eme ka nrụgide dị na καὶ ὑμεῖς na ike ndụmọdụ/iwu nke nkebi ahụ pụta ìhè.
theological_decisions:
- issue: Ụdị ‘iwu ọhụrụ’ ahụ
  choice: A sụgharịrị ya naanị dịka “iwu ọhụrụ,” n’akọwaghị n’ahịrịokwu ahụ ihe mere o ji bụrụ ọhụrụ.
  alternative: Ọhụrụ n’oge; ọhụrụ n’ụdị; ma ọ bụ ọhụrụ n’imezu ya site n’ihe nlereanya Jizọs.
  rationale: Amaokwu Grik ahụ kpọrọ iwu ahụ “ọhụrụ” ma ọ kọwaghị kpọmkwem ụdị ọhụrụ ọ bụ; ịhapụ ya otu a na-echekwa nghọta dị iche iche nwere ike ịdị.
- issue: Ọrụ nke ἵνα nke abụọ
  choice: 'E gosipụtara ya dịka ọrụ dịịrị ndị na-eso ụzọ: “unu onwe unu kwesịkwara…”'
  alternative: “ka unu onwe unu hụrịtakwa onwe unu n’anya,” nke nwere ike igosi nzube ma ọ bụ ihe ga-esi na ya pụta.
  rationale: ἵνα nwere ike ịga n’ihu na ọdịnaya/nzube nke iwu ahụ. Isi ederede na-egosi ike ndụmọdụ ahụ, ebe ndetu na-echekwa ntụgharị ọzọ.
translation_notes:
  register: Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. E ji “hụrịta onwe unu n’anya” chekwaa nkwughachi nke okwu ịhụnanya na mmekọrịta reciprocal; e zere nkọwa ụka pụrụ iche.
