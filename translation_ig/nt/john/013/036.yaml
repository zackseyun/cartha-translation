  to: Saịmọn Pita sịrị ya, “Onyenwe anyị, olee ebe ị na-aga?” Jizọs zara, sị, “Ebe m na-aga, ị pụghị iso m ugbu a,[a] ma ị ga-eso mgbe e mesịrị.”[b]
  rationale: The revision removes the supplied object from the final future verb, preserving the Greek's deliberate lack of an expressed object while retaining clear Igbo. It also aligns footnote b with that corrected wording and improves the idiomatic precision of footnote a. No particular theological referent for Peter's later following is imposed.
