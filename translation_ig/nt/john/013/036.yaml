review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys Peter's question, Jesus' present answer, the inability nuance of δύναμαι, and the now/later contrast. However, the final clause ἀκολουθήσεις δὲ ὕστερον has no expressed object in Greek. Adding “m” (“me”) there makes the target more explicit than the source, even though the referent is contextually clear.
  naturalness: The main text is natural Standard Igbo. “Jizọs zara, sị,” is slightly more direct and source-shaped than “Jizọs zara ya,” since the Greek simply says that Jesus answered. The ability footnote is improved for idiomatic, accurate Igbo.
  terminology: “Onyenwe anyị” is an established respectful Christian rendering for Κύριε in Standard Igbo and is suitable here. “iso” appropriately renders ἀκολουθέω without forcing an interpretation of Peter’s later following.
  issues:
  - severity: medium
    issue: 'The final clause adds an explicit object: “ma ị ga-eso m mgbe e mesịrị.”'
    rationale: Greek reads only “but you will follow later” (ἀκολουθήσεις δὲ ὕστερον); unlike the preceding clause, it does not include μοι (“me”). The Igbo should retain that omission to preserve the source's wording and restraint.
  - severity: low
    issue: Footnote b repeats the added “m” in its quotation.
    rationale: Once the main text is corrected to reflect the objectless Greek final clause, the quotation in the explanatory note must match it.
  - severity: low
    issue: The wording of footnote a is awkward and underspecified.
    rationale: “Ngwaa Grik kwuru ikike mmadụ nwere ime ihe” is not idiomatic scholarly Igbo. “Ngwaa Grik ahụ na-egosi ikike” naturally states that the Greek verb expresses ability.
  revised_text: Saịmọn Pita sịrị ya, “Onyenwe anyị, olee ebe ị na-aga?” Jizọs zara, sị, “Ebe m na-aga, ị pụghị iso m ugbu a,[a] ma ị ga-eso mgbe e mesịrị.”[b]
  revised_footnotes:
