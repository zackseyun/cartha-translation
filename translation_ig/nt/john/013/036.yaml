source:
  edition: SBLGNT
  text: Λέγει αὐτῷ Σίμων Πέτρος· Κύριε, ποῦ ὑπάγεις; ⸀ἀπεκρίθη Ἰησοῦς· Ὅπου ὑπάγω οὐ δύνασαί μοι νῦν ἀκολουθῆσαι, ⸂ἀκολουθήσεις δὲ ὕστερον⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/036.yaml
  text: Simon Peter says to him[a], “Lord, where are you going?” Jesus answered, “Where I am going, you are not able to follow me now[b], but you will follow later.”
translation:
  language: ig
  text: Saịmọn Pita sịrị ya, “Onyenwe anyị, olee ebe ị na-aga?” Jizọs zara, sị, “Ebe m na-aga, ị pụghị iso m ugbu a,[a] ma ị ga-eso mgbe e mesịrị.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ị nweghị ike iso m ugbu a.” Ngwaa Grik ahụ na-egosi ikike.
    reason: lexical_alternative
  - marker: b
    text: Okwu ahụ, “ị ga-eso mgbe e mesịrị,” nwere ike na-atụ aka n’oge Pita ga-eso Jizọs n’ahụhụ ma ọ bụ n’ọnwụ; ma okwu ahụ n’onwe ya akọwaghị kpọmkwem otú ọ ga-esi mee.
    reason: cross_reference
lexical_decisions:
- source_word: Λέγει
  choice: sịrị
  rationale: Ọ bụ ezie na Grik ji historical present, oge gara aga bụ ụzọ kachasị eke e si akọ akụkọ n'Igbo ugbu a; iji “na-asị” ebe a ga-ada ka omume na-aga n'ihu karịa ka ọ ga-enye akụkọ ahụ ndụ.
- source_word: Κύριε
  choice: Onyenwe anyị
  rationale: Ọ bụ aha nkwanye ùgwù a na-ejikarị akọwa κύριος n'Igbo, ma ọ ka na-edobe ịdị arọ nke aha ahụ mgbe a na-akpọ Jizọs.
- source_word: ποῦ ὑπάγεις
  choice: olee ebe ị na-aga?
  rationale: Nke a bụ Igbo doro anya ma bụrụkwa nke nkịtị maka ajụjụ banyere ebe mmadụ na-aga, na-etinyeghị nkọwa ọzọ banyere ebe ahụ.
- source_word: ἀπεκρίθη
  choice: zara ya
  rationale: Nke a bụ ụzọ Igbo nkịtị si akọ nzaghachi n'okwu mkparịta ụka.
- source_word: Ὅπου ὑπάγω
  choice: Ebe m na-aga
  rationale: Ọ na-edobe njikọ okwu dị n'etiti ajụjụ Pita na azịza Jizọs.
- source_word: οὐ δύνασαί μοι νῦν ἀκολουθῆσαι
  choice: ị pụghị iso m ugbu a
  rationale: “Pụghị” na-egosipụta kpọmkwem echiche nke ikike dị na δύναμαι; “iso m” bụkwa ụzọ Igbo eke maka ἀκολουθέω na dative μοι.
- source_word: ἀκολουθήσεις δὲ ὕστερον
  choice: ma ị ga-eso m mgbe e mesịrị
  rationale: Ọ na-edobe ọdịnihu nke ngwaa ahụ na ọdịiche dị n'etiti “ugbu a” na “mgbe e mesịrị.”
theological_decisions:
- issue: Ihe iso Jizọs n’ọdịnihu pụtara nye Pita
  choice: E kwughị kpọmkwem n'ahịrịokwu bụ isi ma ọ bụ ahụhụ, ọnwụ, nlọghachi Pita n'ọrụ ịbụ onye na-eso ụzọ, ma ọ bụ iso Jizọs n'ebube.
  alternative: Ịkọwa ya kpọmkwem dị ka amụma banyere ọnwụ Pita n'ihi okwukwe.
  rationale: Grik kwuru nanị na Pita enweghị ike iso ugbu a, ma ọ ga-eso mgbe e mesịrị; ya mere, nsụgharị ahụ na-ahapụ obosara nkọwa ahụ otú isi mmalite si hapụ ya.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ usoro akụkọ oge gara aga nke na-ada eke n'Igbo, ebe a hapụrụ nghọta nwere ike ịdị iche banyere iso Jizọs n'ọdịnihu n'enweghị itinye ozizi otu ụka.
