    reason: cross_reference
  revision_rationale: The revision removes the supplied object from the final future verb, preserving the Greek's deliberate lack of an expressed object while retaining clear Igbo. It also aligns footnote b with that corrected wording and improves the idiomatic precision of footnote a. No particular theological referent for Peter's later following is imposed.
