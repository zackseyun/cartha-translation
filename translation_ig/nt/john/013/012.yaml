revisions:
- from: Ya mere, mgbe ọ sachara ụkwụ ha, werekwa uwe ya, ma laghachi nọdụ n'akụkụ tebụl ọzọ[a], ọ sịrị ha, “Ùnu ghọtara ihe m meere unu[b]?”
  to: Ya mere, mgbe ọ sachara ụkwụ ha, wee were uwe ya, laghachi nọdụ n’ebe a na-eri nri ọzọ[a], ọ sịrị ha, “Ùnu ghọtara ihe m meere unu[b]?”
  rationale: Adjusted the two sequential-action expressions to avoid an unwarranted adversative sense and to prevent “beside the table” from obscuring the meal-setting meaning of ἀνέπεσεν. The revised footnote preserves the ancient reclining detail and the dative alternative without adding doctrinal interpretation.
  reviewer_model: gpt-5.6-terra
