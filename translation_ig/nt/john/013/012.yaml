  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ὅτε οὖν ἔνιψεν τοὺς πόδας αὐτῶν ⸀καὶ ἔλαβεν τὰ ἱμάτια αὐτοῦ ⸂καὶ ἀνέπεσεν⸃, πάλιν εἶπεν αὐτοῖς· Γινώσκετε τί πεποίηκα ὑμῖν;
base_translation:
  language: en
  yaml_path: translation/nt/john/013/012.yaml
  text: So when he had washed their feet and taken his garments and reclined again[a], he said to them[b], “Do you understand what I have done for you?”
translation:
  language: ig
  text: Ya mere, mgbe ọ sachara ụkwụ ha, wee were uwe ya, laghachi nọdụ n’ebe a na-eri nri ọzọ[a], ọ sịrị ha, “Ùnu ghọtara ihe m meere unu[b]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “laghachi dabere n’ebe a na-eri nri ọzọ.” Ngwaa Grik ahụ na-ekwu maka ịnọdụ ma ọ bụ ịdabere n’ọnọdụ iri nri n’oge ahụ.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ihe m mere unu.” Ụdị dative Grik ahụ nwere ike ịpụta ụzọ abụọ ahụ; “meere unu” dabara nke ọma n’ọnọdụ ozi ọ na-ejere ha.
    reason: alternative_reading
lexical_decisions:
- source_word: Ὅτε οὖν
  choice: Ya mere, mgbe
  rationale: “Mgbe” na-egosi oge, ebe “ya mere” na-ejikọta ihe a na-aga n’ihu n’akụkọ ahụ.
- source_word: ἔνιψεν τοὺς πόδας αὐτῶν
  choice: ọ sachara ụkwụ ha
  rationale: Nke a bụ ntụgharị Igbo doro anya ma dị mma maka omume ahụ e mechara tupu omume ndị sochirinụ.
- source_word: ἔλαβεν τὰ ἱμάτια αὐτοῦ
  choice: werekwa uwe ya
  rationale: ἱμάτια pụtara uwe; “were” na-anọgide nso na ἔλαβεν, na-enweghị ịgbakwunye nkọwa na ọ ‘yikwasịrị’ ya.
- source_word: ἀνέπεσεν πάλιν
  choice: laghachi nọdụ n'akụkụ tebụl ọzọ
  rationale: N’ọnọdụ iri nri, ngwaa ahụ na-ezo aka n’ịlaghachi were ọnọdụ n'akụkụ tebụl; ntụgharị a bụ nke ndị Igbo taa ga-aghọta, ebe nkọwa ala peeji na-echekwa ọnọdụ ịdabere n'akụkụ tebụl nke oge ahụ.
- source_word: Γινώσκετε
  choice: Ùnu ghọtara
  rationale: Ajụjụ ahụ metụtara ịghọta ihe omume ahụ pụtara, ọ bụghị naanị ịma na e mere ya.
- source_word: τί πεποίηκα ὑμῖν
  choice: ihe m meere unu
  rationale: “Meere unu” na-egosi uru ma ọ bụ ozi e meere ha, ma nkọwa ala peeji na-echekwa ohere nke ịsụgharị dative ahụ dịka ‘ihe m mere unu.’
theological_decisions:
- issue: Ọnọdụ Jizọs n'akụkụ tebụl mgbe ọ sachara ụkwụ ndị na-eso ụzọ ya
  choice: laghachi nọdụ n'akụkụ tebụl ọzọ
  alternative: laghachi dabere n'akụkụ tebụl ọzọ
  rationale: Isiokwu ahụ bụ ọnọdụ iri nri nke narị afọ mbụ. Isi ederede na-eji okwu Igbo eke, ebe nkọwa ala peeji na-akọwa na Grik na-egosi ịdabere n'akụkụ tebụl.
- issue: Ike ὑμῖν dị n'ajụjụ Jizọs
  choice: ihe m meere unu
  alternative: ihe m mere unu
  rationale: Dative ahụ nwere ike ịbụ nke uru (‘meere unu’) ma ọ bụ nke onye omume rutere (‘mere unu’). Ihe gbara ya gburugburu na-akwado ọrụ e meere ha, ma a naghị ezobe nhọrọ nke ọzọ.
translation_notes:
  register: Standard Igbo dị ugbu a, dị nsọ ma dị mfe nghọta. E jiri “nọdụ n'akụkụ tebụl” mee ka isi ederede bụrụ nke eke, ma chekwaa nkọwa omenala nke ἀνέπεσεν n'ala peeji. Akara ajụjụ ụda olu dị na “Ùnu” na-enyere ọgụgụ ajụjụ aka.
