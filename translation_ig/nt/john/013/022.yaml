- from: Ndị na-eso ụzọ ya nọ na-ele ibe ha anya, n’ihi na ha amaghị onye ọ na-ekwu banyere ya.[a]
  to: Ndị na-eso ụzọ nọ na-ele ibe ha anya, n’amaghị onye ọ na-ekwu banyere ya.[a]
  rationale: The revision retains the durative sense of ἔβλεπον (‘nọ na-ele’) and the mutual sense of εἰς ἀλλήλους. It replaces the causal explanatory wording with an Igbo participial expression corresponding more closely to ἀπορούμενοι, and it avoids adding a possessive absent from the Greek. The footnote now offers a close alternative that reflects both ongoing looking and perplexity.
