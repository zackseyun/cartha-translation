  text: The disciples were looking at one another, at a loss about whom he was speaking.
translation:
  language: ig
  text: Ndị na-eso ụzọ nọ na-ele ibe ha anya, n’amaghị onye ọ na-ekwu banyere ya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ịsụgharị ya: “Ndị na-eso ụzọ nọgidere na-ele ibe ha anya, n’ọnọdụ mgbagwoju anya banyere onye ọ na-ekwu banyere ya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔβλεπον
  choice: nọ na-ele
  rationale: Oge imperfect n’asụsụ Grik na-egosi omume na-aga n’ihu n’oge ahụ; “nọ na-ele” na-egosipụta nke a n’Igbo dị mfe ma kwekọọ n’akụkọ ahụ.
- source_word: εἰς ἀλλήλους
  choice: ibe ha anya
  rationale: Nkebi a na-egosi na ndị na-eso ụzọ ahụ na-elekọta onwe ha anya; “na-ele ibe ha anya” bụ ụzọ Igbo si ekwu ya n’ụzọ eke.
- source_word: οἱ μαθηταὶ
  choice: Ndị na-eso ụzọ ya
  rationale: Ọ bụ ìgwè ndị na-eso Jizọs a maara n’okwu gbara ya gburugburu. “Ya” na-eme ka onye ha na-eso doo anya n’Igbo, n’agbanyeghị na ọ dịghị dị iche n’aha Grik ahụ.
- source_word: ἀπορούμενοι
  choice: n’ihi na ha amaghị
  rationale: Participial a pụtara ịnọ n’ọnọdụ mgbagwoju anya ma ọ bụ enweghị ike ịmata azịza. Nhọrọ a na-ekwupụta ejighị n’aka ha n’Igbo nkịtị; ihe ọzọ dị nso ka e debere na ndetu ala peeji.
- source_word: περὶ τίνος
  choice: onye ... banyere ya
  rationale: περί tinyere genitive interrogative na-ajụ onye okwu ahụ metụtara. Usoro “onye ọ na-ekwu banyere ya” bụ Igbo doro anya ma na-edebe ntụaka nye mmadụ.
- source_word: λέγει
  choice: ọ na-ekwu
  rationale: Present tense Grik dị n’okwu ajụjụ na-apụtachaghị ìhè; “ọ na-ekwu” na-edebe ụdị present ahụ ma dịkwa eke n’akụkọ Igbo.
