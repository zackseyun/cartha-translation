  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἰ ταῦτα οἴδατε, μακάριοί ἐστε ἐὰν ποιῆτε αὐτά.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/017.yaml
  text: If you know these things[a], you are blessed if you do them.
translation:
  language: ig
  text: Ọ bụrụ na unu maara ihe ndị a, ngọzi na-adịrị unu[a] ma ọ bụrụ na unu emee ha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “unu bụ ndị a gọziri agọzi” ma ọ bụ “unu bụ ndị nwere ihu ọma.” Okwu Grik a na-egosi ịnọ n'ọnọdụ ngọzi na ịdị mma, ọ bụghị naanị inwe mmetụta obi ụtọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ
  choice: Ọ bụrụ na
  rationale: Ọ na-ewebata ahịrịokwu nwere ọnọdụ, kwekọọkwa kpọmkwem n'ụdị okwu Grik.
- source_word: ταῦτα
  choice: ihe ndị a
  rationale: Ọ bụ nnọchiaha ngosi nọ n'ụdị ọtụtụ, na-ezo aka n'ihe nlereanya na nkuzi Jizọs kwuru tupu nke a.
- source_word: οἴδατε
  choice: unu maara
  rationale: Ọ na-egosi ịma ma ọ bụ ịmara ihe; ntụgharị a anaghị agbakwunye echiche 'ịghọta' nke ngwaa ahụ ekwughị hoo haa.
- source_word: μακάριοί ἐστε
  choice: ngọzi na-adịrị unu
  rationale: Akpaokwu Igbo a na-egosi ọnọdụ onye ngọzi dịịrị, ọ bụghị naanị mmetụta obi ụtọ, ma na-anọgide bụrụ okwu dị mfe ma kwanyere ugwu.
- source_word: ἐὰν
  choice: ma ọ bụrụ na
  rationale: Ya na ngwaa subjunctive so na-egosi ọnọdụ nke mmezu ya na-adabere n'omume a kpọrọ aha.
- source_word: ποιῆτε αὐτά
  choice: unu emee ha
  rationale: Ọ na-egosi itinye ihe ndị ahụ n'ọrụ; 'ha' na-ezoghachi n'ụzọ doro anya n'okwu ọtụtụ, 'ihe ndị a.'
theological_decisions:
- issue: Ntụgharị μακάριοι n'ọnọdụ nke iso ụzọ Jizọs
  choice: ngọzi na-adịrị unu
  alternative: unu bụ ndị obi ụtọ / ihe ọma dakwasịrị unu
  rationale: Nhọrọ a na-echekwa echiche nke ịnọ n'ọnọdụ ọma na nke ngọzi, kama ime ka okwu ahụ bụrụ naanị mmetụta obi ụtọ. Ọ naghị akọwapụta kpọmkwem onye na-enye ngọzi ebe Grik n'onwe ya ekwughị ya n'amaokwu a.
translation_notes:
  register: Standard Igbo dị ugbu a, dị mfe nghọta ma dịkwa ùgwù. E ji 'unu' gosipụta ụdị ọtụtụ nke okwu Grik niile. E debere ahịrịokwu ọnọdụ abụọ ahụ n'ụzọ doro anya, tinyekwa akara nkọwa [a] ozugbo n'isiokwu ntụgharị.
