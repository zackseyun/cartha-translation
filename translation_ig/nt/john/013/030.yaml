  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: λαβὼν οὖν τὸ ψωμίον ἐκεῖνος ⸂ἐξῆλθεν εὐθύς⸃. ἦν δὲ νύξ.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/030.yaml
  text: So after taking the piece of bread[a], he went out immediately[c][b]. And it was night.
translation:
  language: ig
  text: Ya mere, mgbe ọ natara iberibe achịcha ahụ[a], onye ahụ[b] pụrụ ozugbo. Ọ bụkwa abalị[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị ‘obere iberibe nri ahụ.’ Okwu Grik ψωμίον pụtara obere iberibe achịcha ma ọ bụ nri e nyere mmadụ n’oge nri.
    reason: lexical_alternative
  - marker: b
    text: N’asụsụ Grik, a sịrị ‘onye ahụ,’ ọ bụghị naanị ‘ọ.’ Okwu ahụ nwere nkwusi ike pụrụ iche, ma eleghị anya iji dọta uche n’ebe Judas nọ.
    reason: lexical_alternative
  - marker: c
    text: Nkwupụta Jọn na ọ bụ abalị na-ekwu kpọmkwem oge ihe a mere; o nwekwara ike ime ka anyị cheta isiokwu ìhè na ọchịchịrị dị n’Oziọma ya.
    reason: cross_reference
lexical_decisions:
- source_word: λαβὼν
  choice: mgbe ọ natara
  rationale: A sụgharịrị aorist participle ahụ dị ka nkebiokwu oge n’Igbo iji gosi na ịnata iberibe achịcha ahụ bu ụzọ tupu ọ pụọ.
- source_word: οὖν
  choice: Ya mere
  rationale: Nke a na-egosi njikọ na ọganihu akụkọ ahụ n'ụzọ doro anya ma bụrụkwa Igbo a na-asụ ugbu a.
- source_word: τὸ ψωμίον
  choice: iberibe achịcha ahụ
  rationale: ψωμίον bụ obere iberibe achịcha ma ọ bụ nri; okwu a doro anya, bụrụkwa nke ndị na-agụ akwụkwọ taa ga-aghọta ngwa ngwa.
- source_word: ἐκεῖνος
  choice: onye ahụ
  rationale: A hapụghị okwu ngosi a ka ọ bụrụ naanị nnọchiaha ‘ọ’; ‘onye ahụ’ na-echekwa nkwusi ike na ntụnye pụrụ iche e mere banyere Judas.
- source_word: ἐξῆλθεν
  choice: pụrụ
  rationale: ‘Pụrụ’ na-enye nghọta nkịtị nke ịpụ n’ebe ahụ n’Igbo na-enweghị ịgbakwunye nkọwa ọzọ.
- source_word: εὐθύς
  choice: ozugbo
  rationale: ‘Ozugbo’ na-egosi na ọ pụghị igbu oge ma kwekọọ kpọmkwem n’echiche εὐθύς.
- source_word: ἦν δὲ νύξ
  choice: Ọ bụkwa abalị
  rationale: Nke a na-echekwa nkwupụta dị mfe banyere oge, yana ike edemede ya, n’ejighị nkọwa ihe atụ dochie ya.
theological_decisions:
- issue: Ma ‘abalị’ ò nwere ihe ọ na-anọchi anya n’Oziọma Jọn
  choice: 'A sụgharịrị ya dịka nkwupụta nkịtị banyere oge: ‘Ọ bụkwa abalị.’'
  alternative: Ịkọwa ya n’ahịrịokwu bụ isi dịka ọchịchịrị ime mmụọ.
  rationale: Ọ bụ ezie na Jọn na-ejikarị ìhè na ọchịchịrị eme ihe atụ, Grik ebe a bụ nkwupụta dị mfe banyere oge. Nsụgharị ahụ na-ahapụ ohere maka ma ihe mere n’ezie ma ụda ihe atụ ya, n’akọwaghị ya gabiga ihe e dere.
- issue: Ike okwu ἐκεῖνος mgbe ọ na-ezo aka na Judas
  choice: E ji ‘onye ahụ’ chekwaa nkwusi ike ya.
  alternative: Iji naanị ‘ọ’.
  rationale: Okwu ngosi ahụ nwere ike ịdị ka nke na-adọta uche n’ebe Judas nọ ma na-eme ka e nwee ntakịrị ọdịiche; ‘onye ahụ’ na-echekwa mmetụta a n’etinyeghị ozizi ọzọ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị mfe ma dị ugwu. Ahịrịokwu ndị ahụ dị mkpirikpi iji chekwaa ịdị mfe na ịdị arọ nke akụkọ Grik; ‘onye ahụ’ na-echekwa nkwusi ike ahụ n’agbanyeghị na ọ dị ntakịrị akara karịa nnọchiaha nkịtị.
