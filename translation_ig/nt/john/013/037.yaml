  text: λέγει αὐτῷ ⸀ὁ Πέτρος· Κύριε, διὰ τί οὐ δύναμαί σοι ⸀ἀκολουθῆσαι ἄρτι; τὴν ψυχήν μου ὑπὲρ σοῦ θήσω.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/037.yaml
  text: Peter said to him[a], “Lord[b], why am I not able to follow you now? I will lay down my life for you.”
translation:
  language: ig
  text: Pita sịrị ya, “Onyenwe anyị, gịnị mere m na-enweghị ike iso gị ugbu a?[a] Aga m atọgbọ ndụ m[b] n’ihi gị.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ịsụ ya n’ụzọ na-esochikwu okwu Grik anya: “Gịnị mere na enweghị m ike iso gị ugbu a kpọmkwem?”'
    reason: lexical_alternative
  - marker: b
    text: N’asụsụ Grik, okwu ya kpọmkwem bụ “mkpụrụ obi m”; n’akpaalaokwu a, ihe ọ pụtara bụ “ndụ m.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: sịrị
  rationale: Ọ bụ ezie na Grik ji oge ugbu a nke akụkọ mee ihe, iji oge gara aga bụ ụzọ Igbo si akọ akụkọ n'ụzọ ebumpụta ụwa.
- source_word: Κύριε
  choice: Onyenwe anyị
  rationale: Nke a bụ okwu nkwanye ùgwù a na-ejikarị akpọ Jizọs n’Igbo; ọ na-echekwa ibu okwu ahụ nwere n’enweghị ịkọwa ya gabiga ókè.
- source_word: διὰ τί οὐ δύναμαί
  choice: gịnị mere m na-enweghị ike
  rationale: Ọ na-egosipụta ajụjụ banyere ihe mere Pita ji ghara inwe ike ime ihe ahụ, ma na-ada nke ọma n’Igbo ugbu a.
- source_word: σοι ἀκολουθῆσαι
  choice: iso gị
  rationale: ‘Iso’ nwere ike ịpụta iso mmadụ gaa nakwa iso ya dịka onye na-eso ụzọ; ya mere, ọ na-echekwa nghọta abụọ ahụ dị n’Oziọma Jọn.
- source_word: ἄρτι
  choice: ugbu a
  rationale: Ọ bụ okwu Igbo dị mfe ma doo anya nke na-egosi oge ahụ Pita na-ekwu maka ya.
- source_word: τὴν ψυχήν μου
  choice: ndụ m
  rationale: N’akpaalaokwu a, ψυχή pụtara ndụ mmadụ ọ ga-ahapụ site n’ọnwụ, ọ bụghị naanị ‘mkpụrụ obi’ dịka echiche metaphysics.
- source_word: ὑπὲρ σοῦ
  choice: n’ihi gị
  rationale: Ọ na-egosi na Pita kwuru na ọ ga-enye ndụ ya maka Jizọs, ma ọ naghị amanye nkọwa kpọmkwem ma ọ bụ n’ọnọdụ ya ma ọ bụ maka ọdịmma ya.
- source_word: θήσω
  choice: Aga m atọgbọ
  rationale: ‘Ịtọgbọ ndụ’ bụ akpaalaokwu Igbo kwesịrị ekwesị maka τίθημι na ψυχή, nke pụtara inye ndụ mmadụ ruo n’ọnwụ.
theological_decisions:
- issue: Ihe ψυχή pụtara n’okwu Pita
  choice: ndụ m
  alternative: mkpụrụ obi m
  rationale: Ihe gbara amaokwu ahụ gburugburu bụ njikere Pita nwere ịnwụ n’ihi Jizọs. ‘Ndụ m’ na-ezipụta akpaalaokwu Grik nke ọma, ebe ‘mkpụrụ obi m’ nwere ike ime ka uche gaa n’echiche banyere akụkụ ime mmụọ mmadụ nke na-abụghị isi okwu ebe a.
- issue: Ụdị nghọta dị na ἀκολουθέω
  choice: iso gị
  alternative: soro gị gaa
  rationale: ‘Iso gị’ na-echekwa ma echiche nke iso Jizọs gaa ebe ọ na-aga ma echiche nke ịbụ onye na-eso ụzọ ya; ‘soro gị gaa’ ga-eme ka ọ bụrụ naanị njem.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ ‘iso gị’ iji chekwaa ma nghọta njem ma nke ịbụ onye na-eso ụzọ. E tinyere akara nkọwa ụkwụ n’ebe okwu ndị ha na-akọwa dị.
