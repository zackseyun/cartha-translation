id: JHN.13.27
reference: John 13:27
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ μετὰ τὸ ψωμίον τότε εἰσῆλθεν εἰς ἐκεῖνον ὁ Σατανᾶς. λέγει οὖν αὐτῷ ⸀ὁ Ἰησοῦς· Ὃ ποιεῖς ποίησον τάχιον.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/027.yaml
  text: And after the piece of bread[a], then Satan entered into him. So Jesus said to him, “What you are doing[b], do more quickly.”
translation:
  language: ig
  text: Mgbe iberibe achịcha ahụ gasịrị[a], mgbe ahụ Setan banyere n’ime ya. Ya mere, Jizọs sịrị ya, “Ihe ị na-eme[b], mee ya ngwa ngwa karịa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “obere iberibe nri ahụ.” Okwu Grik ψωμίον pụtara obere iberibe nri; n’ebe a, o yikarịrị ka ọ bụ iberibe achịcha e tinyere n’ihe e ji eri nri n’oge ahụ.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsị, “mee ya ngwa ngwa.” Okwu Grik τάχιον bụ ụdị ntụnyere, ya bụ, “ngwa ngwa karịa,” ọ bụ ezie na n’Igbo a pụrụ iji “ngwa ngwa” mee ka okwu ahụ daa mfe.
    reason: lexical_alternative
lexical_decisions:
- source_word: ψωμίον
  choice: iberibe achịcha ahụ
  rationale: Okwu a na-ezo aka n’obere iberibe nri, n’ebe a ọ ga-abụ achịcha e tinyere n’ihe e ji eri ya. ‘Iberibe achịcha’ doro ndị na-agụ Igbo anya ma na-edebe ihe okwu Grik ahụ pụtara kpọmkwem.
- source_word: εἰσῆλθεν εἰς ἐκεῖνον
  choice: banyere n’ime ya
  rationale: Nke a na-edebe okwu Grik banyere ịbanye n’ime mmadụ n’ụzọ kwụ ọtọ, na-akọwaghị ya karịa ihe amaokwu ahụ kwuru.
- source_word: ὁ Σατανᾶς
  choice: Setan
  rationale: ‘Setan’ bụ aha a na-ejikarị eme ihe n’Igbo maka aha/utu aha Grik a.
- source_word: λέγει οὖν αὐτῷ ὁ Ἰησοῦς
  choice: Ya mere, Jizọs sịrị ya
  rationale: E jiri oge gara aga mee ka akụkọ ahụ bụrụ Igbo dị n’ụzọ nkịtị; ‘ya mere’ na-egosipụta njikọ οὖν.
- source_word: Ὃ ποιεῖς
  choice: Ihe ị na-eme
  rationale: Nke a na-edebe ụdị omume na-aga n’ihu ma ọ bụ nke dị nso nke present ποιεῖς, kama ịkọwa ya dịka ‘ihe ị na-achọ ime.’
- source_word: ποίησον
  choice: mee ya
  rationale: Iwu dị mkpirikpi ma sie ike nke Grik ka e debere n’okwu Igbo dị mfe.
- source_word: τάχιον
  choice: ọsọ karịa
  rationale: τάχιον bụ comparative; ‘ọsọ karịa’ na-edebe echiche ahụ karịa naanị ‘ọsọ ọsọ.’
theological_decisions:
- issue: Ụdị ihe Setan mere Judas
  choice: Setan banyere n’ime ya
  alternative: Setan weghaara ya; Judas nyefere onwe ya n’aka Setan
  rationale: E debere nkwupụta kpọmkwem nke amaokwu ahụ n’enweghị ime ka ọ bụrụ naanị ihe atụ ma ọ bụ ịgbakwunye nkọwa banyere nchịkwa mmụọ nke ihe odide ahụ ekwughị.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma doo anya. A họọrọ usoro okwu akụkọ nke na-ada nke ọma n’Igbo, ebe e debere okwu banyere Setan na comparative τάχιον n’ụzọ kwekọrọ n’asụsụ isi mmalite.
