review_pass:
  verdict: revise
  source_fidelity: The draft accurately retains Satan's direct entry into Judas and the comparative force of τάχιον. However, “Mgbe ọ natasịrị” introduces an explicit receiving action and subject not stated in this verse; the Greek temporal phrase is more economical, “after the morsel.”
  naturalness: “Mee ya ọsọ karịa” is understandable but is not idiomatic Standard Igbo for a comparative adverbial command. “Mee ya ngwa ngwa karịa” is more natural and preserves the comparative nuance.
  terminology: Setan, Jizọs, and “banyere n’ime ya” are appropriate Standard Igbo renderings. “Iberibe achịcha ahụ” is clear in context for ψωμίον, with the note retaining the broader sense “morsel.”
  issues:
  - severity: medium
    issue: The opening temporal clause adds an explicit action of receiving.
    rationale: “Mgbe ọ natasịrị iberibe achịcha ahụ” means “after he had received the piece of bread.” John 13:27 itself says only “after the morsel”; retaining a nominal temporal expression better avoids adding an action from the preceding context.
  - severity: medium
    issue: The rendering of τάχιον is awkward in the main text.
    rationale: “Mee ya ọsọ karịa” is less idiomatic than “mee ya ngwa ngwa karịa.” The latter naturally expresses “do it more quickly” while retaining the Greek comparative.
  revised_text: Mgbe iberibe achịcha ahụ gasịrị[a], mgbe ahụ Setan banyere n’ime ya. Ya mere, Jizọs sịrị ya, “Ihe ị na-eme[b], mee ya ngwa ngwa karịa.”
  revised_footnotes:
