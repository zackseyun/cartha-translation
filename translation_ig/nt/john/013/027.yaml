revisions:
- from: Mgbe ọ natasịrị iberibe achịcha ahụ[a], mgbe ahụ Setan banyere n’ime ya. Ya mere, Jizọs sịrị ya, “Ihe ị na-eme[b], mee ya ọsọ karịa.”
  to: Mgbe iberibe achịcha ahụ gasịrị[a], mgbe ahụ Setan banyere n’ime ya. Ya mere, Jizọs sịrị ya, “Ihe ị na-eme[b], mee ya ngwa ngwa karịa.”
  rationale: The revision removes the added receiving action from the opening clause, while preserving the verse's terse temporal wording. It also replaces an awkward comparative expression with natural Standard Igbo (“ngwa ngwa karịa”). The direct statement concerning Satan, the narrative connective, and the present-oriented wording of Jesus’ command remain intact.
  reviewer_model: gpt-5.6-terra
