review_pass:
  verdict: revise
  source_fidelity: The draft preserves the conditional-inferential argument, the emphatic contrast between Jesus and the disciples, the completed act of washing, reciprocal obligation, and the concrete reference to feet. A present-result perfect form is preferable for the just-completed action in this context.
  naturalness: The proposed revision uses smoother contemporary Standard Igbo word order and verbal aspect. “Asala” naturally conveys a completed action with present relevance; “unu kwa” clearly carries the corresponding force without the somewhat heavy repetition of “unu onwe unu.”
  terminology: “Onyenwe anyị” and “Onye Nkụzi” appropriately render the titular nouns in this context. The footnote’s alternative is retained but standardized as “Nna-ukwu.”
  issues:
  - severity: low
    issue: The draft uses simple past “sara” for ἔνιψα.
    rationale: Although not wrong, “asala” more naturally reflects the completed washing immediately relevant to the ensuing obligation.
  - severity: low
    issue: The draft overmarks the second-person emphasis with “unu onwe unu.”
    rationale: The Greek explicitly has ὑμεῖς, but “unu kwa” adequately and naturally conveys the contrastive/additive force in this Igbo sentence.
  - severity: low
    issue: The alternative-title footnote lacks a direct identification of the Greek term and writes the alternative without a hyphen.
    rationale: Identifying κύριος makes the scope of the alternative clear, and “Nna-ukwu” is the clearer standardized form.
