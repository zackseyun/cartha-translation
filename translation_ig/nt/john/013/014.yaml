id: JHN.13.14
reference: John 13:14
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἰ οὖν ἐγὼ ἔνιψα ὑμῶν τοὺς πόδας ὁ κύριος καὶ ὁ διδάσκαλος, καὶ ὑμεῖς ὀφείλετε ἀλλήλων νίπτειν τοὺς πόδας·
base_translation:
  language: en
  yaml_path: translation/nt/john/013/014.yaml
  text: If I then[a], the Lord and the Teacher, have washed your feet, you also ought to wash one another’s feet.
translation:
  language: ig
  text: Ọ bụrụ na mụ onwe m, bụ Onyenwe anyị na Onye Nkụzi, asala unu ụkwụ, unu kwa kwesịrị ịsa ibe unu ụkwụ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰ οὖν
  choice: Ya mere, ọ bụrụ na
  rationale: Nke a na-edobe ma ọnọdụ εἰ gosiri ma nkwubi okwu οὖν na-eweta, n’ụzọ Igbo doro anya.
- source_word: ἐγὼ
  choice: mụ onwe m
  rationale: A gbasoro nkwusiri ike dị na nnọchiaha Grik ahụ, nke na-eme ka ihe Jizọs mere dị iche n’ọrụ ndị na-eso ụzọ ya kwesịrị ịrụ.
- source_word: ἔνιψα
  choice: sara
  rationale: Oge gara aga na-egosi ọrụ ịsa ụkwụ ahụ Jizọs rụchara ugbu a n’akụkọ ahụ.
- source_word: ὑμῶν τοὺς πόδας
  choice: unu ụkwụ
  rationale: Nke a bụ usoro Igbo ebumpụta ụwa e si ekwu banyere ịsa akụkụ ahụ mmadụ, ma ọ na-edobe onye nwe ụkwụ ndị ahụ.
- source_word: ὁ κύριος
  choice: Onyenwe anyị
  rationale: A họọrọ aha nsọpụrụ Igbo a na-ejikarị akọwa κύριος mgbe ọ bụ aha e ji akpọ Jizọs; ọ na-edobekwa ọdịiche dị n’etiti ọkwa ya na ọrụ ịdị umeala n’obi o mere.
- source_word: ὁ διδάσκαλος
  choice: Onye Nkụzi
  rationale: Ọ bụ aha nsọpụrụ doro anya, nke ndị Igbo oge a na-aghọta nke ọma, maka onye na-akụzi ihe.
- source_word: καὶ ὑμεῖς
  choice: unu onwe unu kwesịkwara
  rationale: “Unu onwe unu” na-edobe nkwusiri ike nke ὑμεῖς, ebe “-kwa” na-egosi na ha ga-emekwa ihe kwekọrọ n’ihe Jizọs mere.
- source_word: ὀφείλετε
  choice: kwesịrị
  rationale: Ọ na-egosi ibu ọrụ omume nke okwu Grik ahụ n’enweghị ime ka ọ bụrụ iwu siri ike karịa ka ahịrịokwu ahụ kwuru.
- source_word: ἀλλήλων
  choice: ibe unu
  rationale: Nke a bụ ụzọ Igbo nkịtị e si egosi omume ndị otu na-emere ibe ha.
- source_word: νίπτειν τοὺς πόδας
  choice: ịsa ... ụkwụ
  rationale: A hapụrụ omume ịsa ụkwụ ahụ kpọmkwem dịka Grik si kwuo, kama ịgbanwe ya ka ọ bụrụ nanị nkọwa sara mbara banyere ije ozi.
theological_decisions:
- issue: Ịsụgharị κύριος dịka aha e ji akpọ Jizọs
  choice: Onyenwe anyị
  alternative: Nna Ukwu
  rationale: N’ebe a κύριος bụ aha nsọpụrụ Jizọs ji kọwaa onwe ya. “Onyenwe anyị” na-edobe ụda aha ahụ na mkpa ọdịiche dị n’etiti ịdị elu ya na ọrụ dị ala o mere, ebe nkọwa ọzọ ka e depụtara n’ala peeji.
- issue: Ụdị ọrụ ịsa ụkwụ a chọrọ
  choice: A hapụrụ okwu ahụ kpọmkwem dịka “ịsa ibe unu ụkwụ.”
  alternative: Ijere ibe unu ozi n’ịdị umeala n’obi
  rationale: Grik kpọrọ ịsa ụkwụ aha kpọmkwem. Ọ bụ ezie na omume ahụ nwere ihe atụ sara mbara, ịsụgharị ya dịka naanị ije ozi ga-agafe ihe amaokwu a kwuru.
translation_notes:
  register: E ji Igbo Izugbe dị ugbu a, dị ùgwù ma dị mfe nghọta. “Mụ onwe m” na “unu onwe unu” na-eburu nkwusiri ike nke nnọchiaha Grik, ebe usoro ahịrịokwu ahụ na-edobe mgbagha sitere n’ihe Jizọs mere ruo n’ọrụ ndị na-eso ụzọ ya.
