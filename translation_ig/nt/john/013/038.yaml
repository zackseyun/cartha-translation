  to: Jizọs zara ya sị, “Ị ga-atọgbọ ndụ gị[a] n’ihi m? N’ezie, n’ezie, ana m asị gị, oke ọkụkọ agaghị akwa ma ọlị ruo mgbe ị gọnahụrụ m ugboro atọ.”
