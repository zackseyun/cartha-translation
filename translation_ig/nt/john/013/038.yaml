review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders Jesus’ reply, the idiom of laying down one’s life, the doubled ἀμήν, the emphatic οὐ μή, the rooster’s crowing, and the three denials. The future-completed sense of ἕως οὗ ἀρνήσῃ, however, is more clearly represented by using a completed denial form after “ruo mgbe.”
  naturalness: The register is clear Standard Igbo. Adding “sị” after “Jizọs zara ya” makes the introduction to direct speech more idiomatic, and “ị gọnahụrụ m” is smoother and more precise in this future temporal construction than “ị ga-agọnahụ m.”
  terminology: “ndụ” correctly conveys ψυχή in this sacrificial idiom. “mkpụrụ obi” is an appropriate lexical alternative in the footnote. “oke ọkụkọ” and “ịkwa” are natural contemporary terms for rooster and crowing.
  issues:
  - severity: low
    issue: The temporal clause uses “ị ga-agọnahụ m,” which can leave the denial as merely future rather than completed before the rooster crows.
    rationale: The Greek construction states that the rooster will not crow until Peter has denied Jesus three times. “ruo mgbe ị gọnahụrụ m ugboro atọ” better preserves that completed-action relation in natural Igbo.
  - severity: low
    issue: The direct-speech introduction omits “sị.”
    rationale: “Jizọs zara ya sị” is a more idiomatic Standard Igbo narrative introduction to the following quotation; it does not alter the source meaning.
