source:
  edition: SBLGNT
  text: ⸀ἀποκρίνεται Ἰησοῦς· Τὴν ψυχήν σου ὑπὲρ ἐμοῦ θήσεις; ἀμὴν ἀμὴν λέγω σοι, οὐ μὴ ἀλέκτωρ φωνήσῃ ἕως οὗ ⸀ἀρνήσῃ με τρίς.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/038.yaml
  text: Jesus answered[a], “Will you lay down your life for me? Truly, truly, I say to you, the rooster will certainly not crow until you have denied me three times.”
translation:
  language: ig
  text: Jizọs zara ya sị, “Ị ga-atọgbọ ndụ gị[a] n’ihi m? N’ezie, n’ezie, ana m asị gị, oke ọkụkọ agaghị akwa ma ọlị ruo mgbe ị gọnahụrụ m ugboro atọ.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ịsụgharị ya “mkpụrụ obi”: “Ị ga-atọgbọ mkpụrụ obi gị n’ihi m?” Okwu Grik ψυχή nwere ike ịpụta “mkpụrụ obi” ma ọ bụ “ndụ”; n’ebe a, ihe ọ pụtara bụ mmadụ inye ndụ ya.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκρίνεται
  choice: zara ya
  rationale: Ọ bụ okwu a na-ejikarị ewebata azịza n’akụkọ; oge gara aga dabara n’ụzọ Igbo si akọ akụkọ.
- source_word: ψυχήν
  choice: ndụ
  rationale: N’akpaokwu a, ọ pụtara mmadụ inye ndụ ya, ọ bụghị nanị akụkụ ime mmụọ a na-akpọ mkpụrụ obi.
- source_word: ὑπὲρ ἐμοῦ
  choice: n’ihi m
  rationale: Ọ na-egosi ime ihe maka onye ọzọ ma ọ bụ n’ọnọdụ ya; nke a bụ ụzọ Igbo doro anya ma dị mkpirikpi.
- source_word: θήσεις
  choice: ị ga-atọgbọ
  rationale: Ọ na-echekwa ihe oyiyi dị n’akpaokwu Jọn banyere ịtọgbọ ndụ, ma bụrụkwa okwu Igbo a pụrụ ịghọta.
- source_word: ἀμὴν ἀμὴν
  choice: N’ezie, n’ezie
  rationale: Ọ na-echekwa nkwughachi na nkwusi ike pụrụ iche nke okwu Jizọs n’Oziọma Jọn.
- source_word: οὐ μὴ
  choice: agaghị ... ma ọlị
  rationale: Ngwakọta a na-egosipụta ngọnahụ siri ike; “ma ọlị” na-ebunye nkwusi ike ahụ n’Igbo.
- source_word: ἀλέκτωρ
  choice: oke ọkụkọ
  rationale: Nke a bụ okwu Igbo doro anya maka ọkụkọ nwoke.
- source_word: φωνήσῃ
  choice: akwa
  rationale: Mgbe a na-ekwu maka oke ọkụkọ, “ịkwa” bụ okwu Igbo e ji akọ ụda ọ na-eme.
- source_word: ἕως οὗ
  choice: ruo mgbe
  rationale: Ọ na-echekwa njikọ oge nke ihe odide Grik n’enweghị ịgbanwe ya ka ọ bụrụ “tupu.”
- source_word: ἀρνήσῃ με
  choice: ị ga-agọnahụ m
  rationale: “Ịgọnahụ” na-ebunye echiche nke ịjụ na mmadụ maara ma ọ bụ sonyere onye ahụ.
- source_word: τρίς
  choice: ugboro atọ
  rationale: Nke a bụ ụzọ Igbo nkịtị na nke oge a si kwuo ya.
theological_decisions:
- issue: Otú e si sụgharị ψυχή n’okwu gbasara ịchụ onwe onye n’àjà
  choice: ndụ
  alternative: mkpụrụ obi
  rationale: Ihe a na-ekwu ebe a bụ Pita ikwu na ọ dị njikere ịnwụ n’ihi Jizọs. “Ndụ” na-egosi nke ahụ nke ọma ma ghara itinye nkọwa pụrụ iche banyere ọdịdị mmadụ nke okwu Grik ahụ na-adịghị achọ n’ebe a.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta, dee ya. E chekwara nkwughachi “N’ezie, n’ezie,” nkwusi ike nke ngọnahụ, na usoro oge dị n’akwụkwọ Grik.
