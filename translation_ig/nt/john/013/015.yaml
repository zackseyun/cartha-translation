base_translation:
  language: en
  yaml_path: translation/nt/john/013/015.yaml
  text: For I have given you an example[a], so that just as I have done to you[c][b], you also may do.
translation:
  language: ig
  text: N’ihi na enyela m unu ihe nlereanya[a][b], ka unu kwa mee dịka m meere unu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “ihe atụ” ma ọ bụ “ụkpụrụ.”
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya “enyeere m unu ihe nlereanya.” Grik ji ụdị oge gara aga dị mfe; “enyela m unu” na-egosi na ihe ahụ o mere ka bara uru ugbu a.
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ “ihe m mere n’ebe unu nọ.” Okwu Grik ahụ nwere ike izo aka n’ihe o mere n’ebe ha nọ ma ọ bụ n’ihe o mere maka ọdịmma ha.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπόδειγμα
  choice: ihe nlereanya
  rationale: Okwu a na-egosi ihe e mere ka ndị ọzọ were ya ṅomie—ya bụ ihe atụ, ụkpụrụ, ma ọ bụ ihe nlereanya. “Ihe nlereanya” bụ okwu Igbo doro anya nke na-egosi ihe e kwesịrị ịgbaso n’emeghị ka amaokwu ahụ kpebie ma ọ bụ iwu emume pụrụ iche.
- source_word: γὰρ
  choice: N’ihi na
  rationale: γάρ na-akọwa ihe mere Jizọs ji nye ntụziaka dị n’okwu bu ụzọ. “N’ihi na” na-egosipụta njikọ nkọwa ahụ n’Igbo nkịtị.
- source_word: ἔδωκα
  choice: enyela m
  rationale: Ọ bụ ezie na Grik ji aorist, “enyela m” na-egosi omume e mere n’oge gara aga nke uru ya ka dị ugbu a n’ọnọdụ a. A na-edebe “nyere m” dịka ụzọ ọzọ n’ala ala peeji.
- source_word: ἵνα
  choice: ka
  rationale: “Ka” na-egosipụta ebumnuche nke ἵνα n’Igbo n'ụzọ dị mfe ma kwekọọ na ngwaa ndabere “mee.”
- source_word: καθὼς
  choice: dị nnọọ ka
  rationale: Nkebiokwu a na-eme ka ntụnyere dị n’etiti ihe Jizọs mere na ihe ndị na-eso ụzọ kwesịrị ime pụta ìhè.
- source_word: ἐποίησα ὑμῖν
  choice: m mere unu
  rationale: “M mere unu” na-anọgide nso n’usoro Grik ma bụrụkwa okwu Igbo sitere n’okwu gbara ya gburugburu na-ezo aka n’ihe Jizọs mere n’ebe ha nọ. Ọ naghị amanye nkọwa naanị nke ‘mere maka unu’ ma ọ bụ ‘mere unu ihe.’
- source_word: καὶ ὑμεῖς
  choice: unu onwe unu kwa
  rationale: '“Onwe unu kwa” na-echekwa nkwusi ike dị na nnọchiaha ὑμεῖς tinyere καί: ndị na-eso ụzọ n’onwe ha kwesịkwara ime otu ahụ.'
- source_word: ποιῆτε
  choice: mee
  rationale: N’ịgbaso “ka,” ụdị a na-egosipụta ebumnuche na ihe a tụrụ anya ka ha mee, n’ebugharịghị ya ka ọ bụrụ iwu kpọmkwem nke na-ehichapụ usoro ἵνα na subjunctive.
theological_decisions:
- issue: Ike okwu Jizọs nwere banyere ịṅomi ihe o mere
  choice: A sụgharịrị ya dịka Jizọs nyere ihe nlereanya ka ndị na-eso ụzọ mee ihe kwekọrọ na ya, n’akọwaghị ma ọ bụ iwu emume ịsa ụkwụ a ga-eme mgbe niile.
  alternative: Ịsụgharị ya dịka iwu emume ịsa ụkwụ maka ndị kwere ekwe niile, ma ọ bụ dịka naanị ihe nnọchianya na-enweghị omume a ga-eṅomi.
  rationale: Amaokwu ahụ kpọmkwem na-ekwu maka ihe nlereanya na omume kwekọrọ na ya. Nsụgharị ahụ kwesịrị ichekwa ọrụ nlereanya ahụ, ma ghara itinye mkpebi otu ụka banyere ụdị ma ọ bụ ugboro e ji eme ya.
- issue: Uru dative ὑμῖν n’ahịrị ἐποίησα ὑμῖν
  choice: “m mere unu,” nke na-ahapụ njikọ ahụ n’obosara ya dịka Grik siri mee.
  alternative: “m meere unu,” nke ga-emesi uru ha ritere ike, ma ọ bụ “ihe m mere unu,” nke nwere ike ime ka ọ daa ka ihe e mere ha n'ụzọ ọjọọ.
  rationale: N’ọnọdụ ịsa ụkwụ ahụ, omume ahụ bụ nke e mere n’ebe ha nọ ma baara ha uru. Okwu Grik n’onwe ya anaghị achọ ka nsụgharị kpebie naanị otu n’ime nghọta ndị a.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “Ihe nlereanya” bụ okwu a na-anụkarị ma doo anya; “unu onwe unu kwa” na-echekwa nkwusi ike nke Grik. A zere okwu ụka pụrụ iche na nkwubi okwu gbasara ma ịsa ụkwụ ọ̀ bụ emume iwu.
