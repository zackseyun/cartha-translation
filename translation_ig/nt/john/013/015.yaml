revisions:
- from: N’ihi na enyela m unu ihe nlereanya[a][b], ka unu onwe unu kwa mee dị nnọọ ka m mere unu[c].
  to: N’ihi na enyela m unu ihe nlereanya[a][b], ka unu kwa mee dịka m meere unu[c].
  rationale: The revision preserves the source’s explanatory, purposive, and comparative structure while replacing an unclear personal-object construction with natural Standard Igbo. It does not decide whether the modeled action entails a universal ritual practice; it simply retains Jesus' stated call to corresponding action. Footnote b is corrected so that its alternative is a complete, grammatical Igbo clause.
