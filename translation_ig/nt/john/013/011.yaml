id: JHN.13.11
reference: John 13:11
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ᾔδει γὰρ τὸν παραδιδόντα αὐτόν· διὰ τοῦτο εἶπεν ⸀ὅτι Οὐχὶ πάντες καθαροί ἐστε.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/011.yaml
  text: For he knew the one who was betraying him; for this reason he said[a], “Not all of you are clean.”
translation:
  language: ig
  text: N’ihi na ọ maara onye ahụ na-arara ya nye; ọ bụ ya mere o ji sị[a], “Ọ bụghị unu niile dị ọcha.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n’ụzọ dabara okwu Grik ahụ nso karị, “onye ahụ na-enyefe ya.” N’akụkọ a, ọ na-ezo aka n’ịrara Jizọs nye nke Judas.
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾔδει
  choice: ọ maara
  rationale: Ụdị a na-egosi ihe Jizọs maara n’oge ahụ; ọ bụkwa okwu nkịtị ma doo anya n’Igbo.
- source_word: γὰρ
  choice: N’ihi na
  rationale: Ọ na-ewebata nkọwa nke ihe e kwuru n’amaokwu bu ụzọ.
- source_word: τὸν παραδιδόντα αὐτόν
  choice: onye ahụ na-arara ya nye
  rationale: N’ọnọdụ akụkọ a, παραδίδωμι na-ezo aka n’omume aghụghọ Judas; ‘na-arara ya nye’ na-egosi omume ahụ nke ọma, ebe nkọwa ala peeji na-echekwa ihe okwu ahụ pụtara n’ụzọ nkịtị.
- source_word: διὰ τοῦτο
  choice: ọ bụ ya mere
  rationale: Ọ na-egosi njikọ doro anya n’etiti ihe Jizọs maara na ihe o kwuru.
- source_word: εἶπεν ὅτι
  choice: o ji sị
  rationale: Ụdị okwu a na-ewebata okwu e kwuru kpọmkwem n’Igbo n’ụzọ eke.
- source_word: Οὐχὶ πάντες καθαροί ἐστε
  choice: Ọ bụghị unu niile dị ọcha
  rationale: Ọ na-eme ka ‘unu’ nke onye nke abụọ n’ọnụọgụ ọtụtụ pụta ìhè ma na-echekwa okwu ‘dị ọcha’ nke nwere ma echiche ịsa ahụ ma echiche ime mmụọ.
theological_decisions:
- issue: Ihe παραδιδόντα pụtara n’ihe gbasara Judas
  choice: na-arara ya nye
  alternative: na-enyefe ya
  rationale: N’akụkọ a okwu ahụ na-ezo aka n’omume Judas nke ịrara Jizọs nye; a hapụrụ nsụgharị nkịtị ya na nkọwa ala peeji ka oghere ihe okwu Grik ahụ pụtara ghara ịla n’iyi.
- issue: Ihe καθαροί pụtara n’okwu banyere ịsa ụkwụ
  choice: dị ọcha
  alternative: dịrị ọcha n’ime obi
  rationale: ‘Dị ọcha’ na-echekwa njikọ dị n’etiti ịdị ọcha nke ịsa ahụ na ọnọdụ ime mmụọ, kama ịkọwa ya naanị dịka omume ọma ma ọ bụ ịdị ọcha n’ime obi.
translation_notes:
  register: Standard Igbo; asụsụ dị ugbu a, dị ùgwù, ma dị mfe nghọta. E debere nkwughachi ‘N’ihi na ... ọ bụ ya mere’ iji chekwaa njikọ nkọwa na ihe kpatara ya dị na Grik. Akara [a] dị n’ederede bụ isi ma kwekọọ na nkọwa ala peeji.
