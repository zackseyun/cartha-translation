- from: Pita sịrị ya, “Ị gaghị asa ụkwụ m ma ọlị.” Jizọs zara ya, “Ọ bụrụ na m asaghị gị, ị nweghị òkè n’ebe m nọ[a].”
  to: Pita sịrị ya, “Ị gaghị asa ụkwụ m ma ọlị.” Jizọs zara ya, “Ọ bụrụ na m asaghị gị, ị nweghị òkè n’ebe m nọ.”
  rationale: 'The translation text is retained because it is faithful and natural. The unsupported footnote is removed: its future-negative wording does not represent a lexical alternative to the Greek present assertion. This also leaves the broad relational sense of “òkè” uninterpreted, as in the source.'
