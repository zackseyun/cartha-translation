  variant: Standard Igbo
source:
  edition: SBLGNT
  text: λέγει αὐτῷ Πέτρος· Οὐ μὴ νίψῃς ⸂μου τοὺς πόδας⸃ εἰς τὸν αἰῶνα. ἀπεκρίθη ⸂Ἰησοῦς αὐτῷ⸃· Ἐὰν μὴ νίψω σε, οὐκ ἔχεις μέρος μετ’ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/008.yaml
  text: Peter said to him[a], “You will never wash my feet.” Jesus answered him, “If I do not wash you, you have no share with me.”
translation:
  language: ig
  text: Pita sịrị ya, “Ị gaghị asa ụkwụ m ma ọlị.” Jizọs zara ya, “Ọ bụrụ na m asaghị gị, ị nweghị òkè n’ebe m nọ.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οὐ μὴ νίψῃς … εἰς τὸν αἰῶνα
  choice: Ị gaghị asa … ma ọlị
  rationale: “Ma ọlị” na-eme ka ọjụjụ Pita sie ike n’Igbo nke oge a, kwekọọ na οὐ μή tinyere εἰς τὸν αἰῶνα, n’ebughị okwu ahụ n’ụzọ siri ike nghọta dị ka “ruo mgbe ebighị ebi.”
- source_word: μου τοὺς πόδας
  choice: ụkwụ m
  rationale: Nke a bụ ntụgharị kpọmkwem ma bụrụkwa ụzọ nkịtị e si ekwu ya n’Igbo.
- source_word: ἀπεκρίθη Ἰησοῦς αὐτῷ
  choice: Jizọs zara ya
  rationale: Ọ na-edobe usoro akụkọ na nzaghachi doro anya nke Grik.
- source_word: Ἐὰν μὴ νίψω σε
  choice: Ọ bụrụ na m asaghị gị
  rationale: Ọ na-echekwa usoro ọnọdụ nke Grik ma ghara ịgbakwunye nkọwa banyere ụdị ịsa ahụ a.
- source_word: οὐκ ἔχεις μέρος μετ’ ἐμοῦ
  choice: ị nweghị òkè n’ebe m nọ
  rationale: “Òkè” na-echekwa obosara ihe μέρος pụtara—share, part, ma ọ bụ portion—ebe “n’ebe m nọ” na-egosi mmekọrịta nke μετά n’ebughị echiche “n’ime m” na-adịghị na Grik.
theological_decisions:
- issue: Ihe “inwe òkè” n’ebe Jizọs nọ pụtara
  choice: E debere ya dị ka “ị nweghị òkè n’ebe m nọ,” nke na-egosi isonye ma ọ bụ mmekọrịta na Jizọs n’enweghị ịkọwa usoro nkà mmụta okpukpe ya kpọmkwem.
  alternative: Ịkọwa ya kpọmkwem dị ka nzọpụta, emume nsọ, ma ọ bụ naanị ihe atụ nke ije ozi dị umeala n’obi.
  rationale: Amaokwu ahụ na-ekwu na ịsa ahụ Jizọs dị mkpa ka Pita nwee òkè n’ebe ọ nọ, ma Grik akọwaghị kpọmkwem otú nke a si arụ ọrụ n’ụzọ nkà mmụta okpukpe. Ya mere, ntụgharị ahụ na-echekwa esemokwu na obosara okwu ahụ.
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe nke oge a, dị mfe nghọta ma nwee ugwu kwesịrị ekwesị. “Ma ọlị” na-egosipụta ọjụjụ siri ike nke Pita; “òkè” na-echekwa ihe atụ na nghọta sara mbara nke okwu Grik.
