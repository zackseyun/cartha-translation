review_pass:
  verdict: revise
  source_fidelity: The main rendering accurately conveys Peter’s emphatic refusal (οὐ μή … εἰς τὸν αἰῶνα), the foot-washing object, and Jesus’ conditional response. “Ị nweghị òkè n’ebe m nọ” is an established, natural Igbo way to express having no share/portion with someone and suitably retains the broadness of μέρος μετ’ ἐμοῦ.
  naturalness: The wording is clear, idiomatic Standard Igbo, and has an appropriate Gospel narrative register. “Ma ọlị” effectively communicates the emphatic, permanent refusal without wooden literalism.
  terminology: “Òkè” properly preserves the intentionally broad sense of μέρος (“share,” “part,” or “portion”) without imposing a theological explanation. The supplied footnote, however, changes the main clause from the Greek present statement (“you have no share”) into a future negative (“you will not share”), so it is not a valid lexical alternative.
  issues:
  - severity: medium
    issue: The footnote’s proposed alternative changes tense/aspect and construction.
    rationale: The source reads οὐκ ἔχεις μέρος, literally “you do not have [a] share/part.” The footnote “ị gaghị eso m nwee òkè” means “you will not share/have a share with me,” introducing future force not present in Jesus’ statement. Since no necessary alternative requires a note, removing it best preserves fidelity.
  revised_text: Pita sịrị ya, “Ị gaghị asa ụkwụ m ma ọlị.” Jizọs zara ya, “Ọ bụrụ na m asaghị gị, ị nweghị òkè n’ebe m nọ.”
