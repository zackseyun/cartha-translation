revisions:
- from: Ọ bụ site n’ịhụnanya unu nwere n’etiti onwe unu ka mmadụ niile ga-esi mara na unu bụ ndị na-eso ụzọ m.[a]
  to: Ọ bụrụ na unu nwere ịhụnanya n’etiti onwe unu, site na nke a ka mmadụ niile ga-esi mara na unu bụ ndị na-eso ụzọ m.
  rationale: The revision explicitly renders ἐὰν with “Ọ bụrụ na,” while “site na nke a” naturally refers to the mutual love just specified and preserves the instrumental force of ἐν τούτῳ. It retains the broad “mmadụ niile,” the established expression “ndị na-eso ụzọ m,” and the reciprocal sense of “n’etiti onwe unu.” The redundant footnote is removed.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T06:26:03Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the instrumental sense of ἐν τούτῳ, the universal πάντες, and the mutual character of ἐν ἀλλήλοις. However, its main text recasts the conditional ἐὰν ἔχητε as an unqualified assertion and thus does not explicitly preserve the Greek conditional form.
  naturalness: “Ndị na-eso ụzọ m” and “mmadụ niile” are natural, clear Standard Igbo. An explicit conditional introduced by “Ọ bụrụ na” is both natural and needed for fidelity.
  terminology: “Ịhụnanya” appropriately renders ἀγάπη, and “ndị na-eso ụzọ m” is an established, accessible rendering of μαθηταί μου. No doctrinally loaded terminology has been introduced.
  issues:
  - severity: medium
    issue: The main text does not explicitly translate ἐὰν (“if”).
    rationale: '“Ọ bụ site n’ịhụnanya unu nwere … ka …” presents love directly as the means of recognition, but the Greek retains a real conditional clause: “if you have love ….” The condition should be represented in the main text, not only in a footnote.'
  - severity: low
    issue: The sole footnote is an alternative sentence order rather than a genuine lexical or textual alternative.
    rationale: Once the conditional is retained in the main text, this note is unnecessary and its present wording duplicates the required sense rather than documenting a viable source-based alternative.
  revised_text: Ọ bụrụ na unu nwere ịhụnanya n’etiti onwe unu, site na nke a ka mmadụ niile ga-esi mara na unu bụ ndị na-eso ụzọ m.
  revised_footnotes: []
  revision_rationale: The revision explicitly renders ἐὰν with “Ọ bụrụ na,” while “site na nke a” naturally refers to the mutual love just specified and preserves the instrumental force of ἐν τούτῳ. It retains the broad “mmadụ niile,” the established expression “ndị na-eso ụzọ m,” and the reciprocal sense of “n’etiti onwe unu.” The redundant footnote is removed.
