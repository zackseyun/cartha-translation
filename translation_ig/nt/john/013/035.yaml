  text: ἐν τούτῳ γνώσονται πάντες ὅτι ἐμοὶ μαθηταί ἐστε, ἐὰν ἀγάπην ἔχητε ἐν ἀλλήλοις.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/035.yaml
  text: By this everyone will know that you are my disciples[b][a], if you have love for one another.
translation:
  language: ig
  text: Ọ bụrụ na unu nwere ịhụnanya n’etiti onwe unu, site na nke a ka mmadụ niile ga-esi mara na unu bụ ndị na-eso ụzọ m.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: Ọ bụ site n’… ka … ga-esi
  rationale: Ihe owuwu a na-egosi ụzọ ma ọ bụ ihe akaebe e ji amata ihe, ma na-ada nke ọma n’Igbo.
- source_word: γνώσονται πάντες
  choice: mmadụ niile ga-esi mara
  rationale: Nke a na-egosi na mmadụ niile ga-amata eziokwu ahụ; “mmadụ niile” anaghị akọwa naanị ụmụ nwoke.
- source_word: ἐμοὶ μαθηταί ἐστε
  choice: unu bụ ndị na-eso ụzọ m
  rationale: Nke a bụ okwu Igbo doro anya maka ndị na-amụta ihe n’aka onye nkụzi ma na-agbaso ya, ma na-echekwa njikọ nke ha na Jizọs.
- source_word: ἐὰν
  choice: Ọ bụ … ka
  rationale: N’usoro ahịrịokwu Igbo a, ihe e ji amata ha ka e tinyere n’ihu. Ọ na-echekwa ike nke ọnọdụ ahụ n’enweghị ịkọwa ya dị ka ụzọ e si enweta ịbụ onye na-eso ụzọ.
- source_word: ἀγάπην ἔχητε ἐν ἀλλήλοις
  choice: ịhụnanya unu nwere n’etiti onwe unu
  rationale: Nke a na-echekwa okwu bụ “inwe ịhụnanya” na mmekọrịta nke ịhụnanya ahụ n’etiti ndị ahụ, kama ịtụgharị ya naanị ka ọ bụrụ mmetụta nzuzo.
theological_decisions:
- issue: Ụdị ọnọdụ nke ἐὰν
  choice: E gosipụtara ịhụnanya ha nwere n’etiti onwe ha dị ka ihe ndị mmadụ ji amata na ha bụ ndị na-eso ụzọ Jizọs.
  alternative: Mgbe unu hụrụ ibe unu n’anya
  rationale: Nhọrọ a na-echekwa ịhụnanya dị ka akara ma ọ bụ ihe akaebe nke ịbụ ndị na-eso ụzọ, ọ naghị eme ya ụgwọ e ji enweta ọnọdụ ahụ.
- issue: Ndị πάντες na-ezo aka na ha
  choice: mmadụ niile
  alternative: ndị niile
  rationale: Okwu Grik ahụ bụ nke na-ezo aka n’ụmụ mmadụ n’ozuzu, ọ bụghị naanị ụmụ nwoke.
translation_notes:
  register: Standard Igbo dị ugbu a, nke dị ugwu ma dị mfe nghọta. A họọrọ “ndị na-eso ụzọ” karịa okwu mbinye okpukpe ka ihe μαθηταί pụtara doo onye nkịtị anya.
