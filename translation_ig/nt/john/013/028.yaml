    issue: Unclear added pronoun in “ndị ha na ya nọ na-eri nri”
    rationale: The source has only ‘those reclining’; “ha na ya” adds a plural subject and creates an unclear relationship. Removing it is both closer to the Greek and clearer in Igbo.
  - severity: low
    issue: Less idiomatic object expression in “gwa ya okwu a”
    rationale: For this context, “gwa ya nke a” is a more natural Igbo equivalent of εἶπεν αὐτῷ with τοῦτο as its content.
  revised_text: Ma ọ dịghị onye ọ bụla n’ime ndị nọ na-eri nri maara ihe mere o ji gwa ya nke a.[a]
