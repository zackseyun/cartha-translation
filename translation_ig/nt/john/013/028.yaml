  rationale: The revised wording preserves the source’s ambiguity concerning the identities denoted by ‘he’ and ‘him,’ removes an unsupported and unclear pronoun addition, and uses more natural Standard Igbo. The footnote retains the purpose-focused nuance of πρὸς τί without overstating it in the main text.
