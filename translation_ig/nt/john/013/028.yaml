  yaml_path: translation/nt/john/013/028.yaml
  text: But none of those reclining at the table knew why he said this to him[a].
translation:
  language: ig
  text: Ma ọ dịghị onye ọ bụla n’ime ndị nọ na-eri nri maara ihe mere o ji gwa ya nke a.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “nzube o ji gwa ya nke a.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο
  choice: okwu a
  rationale: Ngosipụta a na-ezo aka n’ihe Jizọs kwuru n’amaokwu bu ụzọ; “okwu a” doro anya ma na-echekwa ike ngosipụta ya.
- source_word: δὲ
  choice: Ma
  rationale: Ọ na-egosi obere ọdịiche n’etiti okwu Jizọs na amaghị ama ndị nọ na-eri nri.
- source_word: οὐδεὶς
  choice: ọ dịghị onye ọ bụla
  rationale: 'Nke a na-egosipụta ngọnarị zuru ezu: o nweghị onye n’ime ha maara.'
- source_word: ἔγνω
  choice: maara
  rationale: N’ebe a, γινώσκω pụtara na ha aghọtaghị ihe okwu ahụ bụ maka ya; “maara” bụ okwu Igbo sara mbara ma dị mfe.
- source_word: τῶν ἀνακειμένων
  choice: n’ime ndị ha na ya nọ na-eri nri
  rationale: N’oge ahụ, ndị mmadụ na-edina n’akụkụ tebụl mgbe ha na-eri nri. Nsụgharị a na-eme ka ọnọdụ oriri doo onye Igbo nke oge a anya n’enweghị nkọwa na-adọpụ uche.
- source_word: πρὸς τί
  choice: ihe mere
  rationale: Akpaokwu a na-ajụ ihe e bu n’obi ma ọ bụ ihe kpatara ya. “Ihe mere” bụ ụzọ Igbo dị ndụ isi kwuo “why,” ebe nkọwa ụkwụ na-echekwa echiche ebumnuche kpọmkwem.
- source_word: εἶπεν αὐτῷ
  choice: o ji gwa ya okwu a
  rationale: “Gwa ya” na-egosi onye a gwara okwu, ebe “okwu a” na-ejikọta ya na τοῦτο dị n’isi ahịrịokwu ahụ.
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe ma dị ùgwù. A kọwara ọnọdụ ἀνακειμένων dịka ịnọ na-eri nri kama ịsụgharị ya n’ụzọ siri ike dịka ‘ndị dina n’akụkụ tebụl,’ nke nwere ike ịgbagwoju ndị na-agụ akwụkwọ anya.
