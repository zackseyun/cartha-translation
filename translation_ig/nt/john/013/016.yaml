id: JHN.13.16
reference: John 13:16
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀμὴν ἀμὴν λέγω ὑμῖν, οὐκ ἔστιν δοῦλος μείζων τοῦ κυρίου αὐτοῦ οὐδὲ ἀπόστολος μείζων τοῦ πέμψαντος αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/016.yaml
  text: Truly[a], truly, I say to you, a servant is not greater than his master[c][b], nor is an apostle greater than the one who sent him.
translation:
  language: ig
  text: 'N’ezie, n’ezie, ana m asị unu: ohu[a] adịghị ukwuu karịa nna ya ukwu[b], onyeozi[c] adịghịkwa ukwuu karịa onye zitere ya.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “onye na-eje ozi”; ma okwu Grik a na-egosi onye nọ n’okpuru ikike nna ukwu ya dịka ohu.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya “onyenwe ya”; ebe a, okwu ahụ na-ekwu banyere nna ukwu nke ohu.
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “onye e zipụrụ” ma ọ bụ “onye ozi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν ἀμὴν
  choice: N’ezie, n’ezie
  rationale: Nkwugharị a na-echekwa usoro nkwusi ike Jọn ji ekwu okwu, ma na-ada nke ọma n’Igbo nke oge a.
- source_word: λέγω ὑμῖν
  choice: ana m asị unu
  rationale: Nke a na-egosipụta okwu a na-ekwu ugbu a ma na-echekwa usoro okwu Grik n’Igbo doro anya.
- source_word: δοῦλος
  choice: ohu
  rationale: “Ohu” na-egosipụta onye nọ n’okpuru ikike nna ukwu, ya mere ọ na-echekwa mmekọrịta siri ike nke okwu Grik a pụtara n’ebe a.
- source_word: μείζων
  choice: dị ukwuu karịa
  rationale: Nke a na-echekwa echiche nke ịdị elu n’ọkwa ma ọ bụ n’ike n’ahịrịokwu abụọ ahụ.
- source_word: κύριος
  choice: nna ya ukwu
  rationale: N’ebe a, okwu ahụ na-egosi nna ukwu nke ohu, ọ bụghị aha nsọ “Onyenwe anyị”; nhọrọ a na-eme ka ntụnyere mmekọrịta mmadụ abụọ ahụ doo anya.
- source_word: ἀπόστολος
  choice: onyeozi
  rationale: “Onyeozi” na-echekwa echiche nke onye e nyere ozi ma zipụ ya, ma ọ bụkwa okwu ndị na-agụ Akwụkwọ Nsọ maara.
- source_word: τοῦ πέμψαντος αὐτόν
  choice: onye zitere ya
  rationale: Nke a bụ Igbo dị mfe ma bụrụkwa nke ziri ezi maka onye mere iziga ahụ.
theological_decisions:
- issue: Ma κύριος ebe a ọ bụ aha nsọ ka ọ bụ okwu mmekọrịta mmadụ
  choice: nna ya ukwu
  alternative: Onyenwe ya
  rationale: Ọnọdụ okwu ahụ bụ ntụnyere ohu na nna ukwu ya, ya mere “nna ya ukwu” na-echekwa echiche mmekọrịta a n’etinyeghị aha nsọ n’ebe ihe gbara ya gburugburu na-achọghị ya.
- issue: Ma ἀπόστολος ebe a ọ bụ aha ọkwa ụka ka ọ bụ onye e zipụrụ
  choice: onyeozi
  alternative: onye e zipụrụ
  rationale: “Onyeozi” nwere ike ịpụta onye e zipụrụ n’ozi ma na-echekwakwa njikọ okwu ahụ na ojiji Akwụkwọ Nsọ; nkọwa ala peeji na-egosi ụzọ ntụgharị nke na-eme ka iziga ahụ pụta ìhè.
translation_notes:
  register: E ji Igbo Standard nke oge a, dị ùgwù ma dị mfe nghọta. Nkwugharị “N’ezie, n’ezie” na-echekwa nkwusi ike pụrụ iche n’Oziọma Jọn; “nna ya ukwu” na “onye zitere ya” na-eme ka ahịrịokwu abụọ yiri ibe ha doo anya.
