id: JHN.13.32
reference: John 13:32
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸂εἰ ὁ θεὸς ἐδοξάσθη ἐν αὐτῷ,⸃ καὶ ὁ θεὸς δοξάσει αὐτὸν ἐν ⸀αὑτῷ, καὶ εὐθὺς δοξάσει αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/032.yaml
  text: If God was glorified in him[a], God will also glorify him in himself[b], and will glorify him at once.
translation:
  language: ig
  text: Ọ bụrụ na e nyere Chineke otuto n’ime ya[a], Chineke ga-enyekwa ya otuto n’ime onwe ya[b], Chineke ga-enyekwa ya otuto ozugbo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “Ebe ọ bụ na e nyere Chineke otuto n’ime ya.” Grik ji εἰ, “ọ bụrụ na,” mee ihe, ọ bụ ezie na ihe gbara ya gburugburu yiri ka ọ na-ewere ọnọdụ ahụ dịka eziokwu.
    reason: alternative_reading
  - marker: b
    text: A pụkwara ịghọta “n’ime onwe ya” dịka “ya na onwe ya” ma ọ bụ “n’onwe ya”; okwu Grik ahụ dị mkpụmkpụ ma nwee nghọta miri emi n’ihe gbasara Chineke.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ
  choice: Ọ bụrụ na
  rationale: Nke a na-edobe ọdịdị nkebiokwu ọnọdụ dị na Grik. N’agbanyeghị na ihe gbara ya gburugburu na-egosi na a na-ewere ọnọdụ ahụ dịka eziokwu, ịsụgharị ya ‘ọ bụrụ na’ na-ahapụ esemokwu ahụ n’otu o si dị.
- source_word: ἐδοξάσθη
  choice: e nyere ... otuto
  rationale: Ụdị nnara-omume a na-egosi na Chineke natara otuto; nke a bụ ụzọ Igbo doro anya ma dịkwa ebube isi kwuo ya.
- source_word: ἐν αὐτῷ
  choice: n’ime ya
  rationale: Nke a na-edobe preposition ἐν na okwu Jọn ji eme ihe, kama ịkọwa ya kpọmkwem dịka ‘site n’aka ya.’
- source_word: δοξάσει
  choice: ga-enye ... otuto
  rationale: Nke a na-edobe njikọ okwu ya na ἐδοξάσθη ma na-egosikwa ọdịnihu nke ngwaa ahụ.
- source_word: ἐν αὑτῷ
  choice: n’ime onwe ya
  rationale: Nnọchiaha nlaghachi azụ na-ezo aka na Chineke; nsụgharị a na-edobe mkpụmkpụ okwu Grik na ịdị omimi ya.
- source_word: εὐθύς
  choice: ozugbo
  rationale: ‘Ozugbo’ bụ okwu Igbo nkịtị ma doo anya nke na-egosipụta ime ihe n’egbughị oge.
theological_decisions:
- issue: Ike ọnọdụ nke εἰ ebe ihe gbara ya gburugburu na-egosi na a na-ewere okwu ahụ dịka eziokwu
  choice: Ọ bụrụ na e nyere Chineke otuto n’ime ya
  alternative: Ebe ọ bụ na e nyere Chineke otuto n’ime ya
  rationale: εἰ bụ mkpụrụokwu ọnọdụ n’onwe ya, ya mere e debere ‘ọ bụrụ na’ n’ahịrị isi. Ma ihe gbara ya gburugburu nwere ike ime ka a ghọta ya dịka ọnọdụ a maara na ọ bụ eziokwu; e gosiri nke ahụ n’okpuru peeji.
- issue: Ihe ἐν αὑτῷ pụtara n’ihe gbasara otú Chineke ga-esi nye Ọkpara otuto
  choice: n’ime onwe ya
  alternative: nọnyere onwe ya; site n’ike nke aka ya
  rationale: Okwu Grik dị mkpụmkpụ ma nwee ọtụtụ ụzọ nghọta. A họọrọ nsụgharị kacha nso n’usoro ya ka a ghara ikpebi n’ahịrị isi ma ọ̀ bụ ọnọdụ ịnọnyere Chineke ka ọ̀ bụ Chineke ime ya site n’onwe ya.
translation_notes:
  register: Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E ji ‘inye otuto’ mee ka otu mgbọrọgwụ δοξάζω pụta ìhè n’akụkụ atọ ahụ; e debere ihe mgbagwoju anya nke εἰ na ἐν αὑτῷ site n’ahịrị isi na nkọwa ndị dị n’okpuru peeji.
