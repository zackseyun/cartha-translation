  to: Ya mere, Saịmọn Pita mere onye a ihe ịrịba ama ka ọ jụọ onye ọ pụrụ ịbụ onye Jizọs na-ekwu maka ya.[a]
  rationale: The revision supplies the needed personal relative link, so that the question unmistakably concerns the identity of the person Jesus was speaking about. It retains the source’s demonstrative force in the main text, its nonverbal gesture, and the tentative sense of the optative with ἄν. The footnote preserves a closer, more formally segmented alternative while using natural personal reference.
