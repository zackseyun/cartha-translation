  yaml_path: translation/nt/john/013/024.yaml
  text: So Simon Peter motioned to this one to ask who it might be about whom he was speaking[a].
translation:
  language: ig
  text: Ya mere, Saịmọn Pita mere onye a ihe ịrịba ama ka ọ jụọ onye ọ pụrụ ịbụ onye Jizọs na-ekwu maka ya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ, n’ụzọ na-esochi usoro okwu Grik nso karị: “Ya mere, Saịmọn Pita mere ya ihe ịrịba ama ka ọ jụọ onye ọ pụrụ ịbụ, onye ọ na-ekwu maka ya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: νεύει
  choice: mere ... ihe ịrịba ama
  rationale: Nkebiokwu a na-egosi ime ihe ịrịba ama n'ekwughị okwu; ọ naghị ekpebi na ọ bụ ikwe isi kpọmkwem.
- source_word: οὖν
  choice: Ya mere
  rationale: Ọ na-egosi ihe si n'okwu amaokwu gara aga pụta ma na-aga n'ihu n'akụkọ ahụ.
- source_word: τούτῳ
  choice: onye a
  rationale: Nke a na-echekwa ike okwu ngosi ahụ, na-atụ aka n'eso ụzọ ahụ dị nso nke e kwuru banyere ya.
- source_word: πυθέσθαι
  choice: ka ọ jụọ
  rationale: 'Nke a na-egosi nzube ma ọ bụ ọdịnaya nke ihe ịrịba ama Pita mere: ka onye ahụ jụọ ajụjụ.'
- source_word: τίς ἂν εἴη
  choice: onye ọ pụrụ ịbụ
  rationale: Ọ na-echekwa echiche nke ejighị n'aka dị na ἄν tinyere optative, n'Igbo dị mfe ma kwekọọ n'okwu a.
- source_word: περὶ οὗ λέγει
  choice: Jizọs na-ekwu maka ya
  rationale: Nke a na-enye okwu ahụ n'usoro Igbo eke. A kpọrọ Jizọs aha iji mee ka onye 'ọ' na-anọchi anya ya doo anya n'ihi ọtụtụ ndị nọ n'ahịrịokwu ahụ.
theological_decisions: []
translation_notes:
  register: 'Ejiri Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. Nsụgharị bụ optimal-equivalence: ọ na-echekwa okwu ngosi ahụ, ihe ịrịba ama a na-eme n''ekwughị okwu, na ejighị n''aka dị na τίς ἂν εἴη, ma na-ahazi ahịrịokwu ahụ ka ọ daa nke ọma n''Igbo.'
