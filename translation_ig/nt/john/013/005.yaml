  to: Mgbe ahụ, ọ wụsara mmiri n’efere ịsa ahụ[a], wee malite ịsa ụkwụ ndị na-eso ụzọ ya, na-eji akwa nhicha ahụ o ji kee úkwù ya[b] na-ehicha ha.
