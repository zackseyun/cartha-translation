  text: εἶτα βάλλει ὕδωρ εἰς τὸν νιπτῆρα, καὶ ἤρξατο νίπτειν τοὺς πόδας τῶν μαθητῶν καὶ ἐκμάσσειν τῷ λεντίῳ ᾧ ἦν διεζωσμένος.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/005.yaml
  text: Then he pours water into the washbasin[b][a], and began to wash the disciples’ feet and to wipe them with the towel with which he was girded.
translation:
  language: ig
  text: Mgbe ahụ, ọ wụsara mmiri n’efere ịsa ahụ[a], wee malite ịsa ụkwụ ndị na-eso ụzọ ya, na-eji akwa nhicha ahụ o ji kee úkwù ya[b] na-ehicha ha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “efere.” Okwu Grik ahụ na-ezo aka n’arịa e ji asa ihe.
    reason: lexical_alternative
  - marker: b
    text: N’ụzọ nkịtị, “nke o ji kee onwe ya úkwù.” Nke a na-ezo aka n’akwa nhicha ahụ o ji kee úkwù ya maka ije ozi.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶτα
  choice: Mgbe ahụ
  rationale: Na-egosi ihe omume sochiri nke gara aga n’akụkọ ahụ n’asụsụ Igbo doro anya.
- source_word: βάλλει
  choice: ọ wụsara
  rationale: Ọ bụ ezie na ngwaa Grik ahụ pụtara itinye ma ọ bụ ịtụ ihe n’ozuzu, mgbe mmiri na efere nọ n’okwu, ‘wụsara’ bụ okwu Igbo kwekọrọ n’omume ahụ.
- source_word: νιπτῆρα
  choice: efere ịsa ahụ́
  rationale: Na-akọwa arịa e ji asa ihe ma na-eme ka ọrụ arịa ahụ doo onye na-agụ ya anya.
- source_word: ἤρξατο νίπτειν
  choice: malite ịsa
  rationale: Na-echekwa echiche nke mmalite omume ahụ dị n’ἤρξατο tinyere ngwaa infinitive.
- source_word: τοὺς πόδας τῶν μαθητῶν
  choice: ụkwụ ndị na-eso ụzọ ya
  rationale: Usoro a bụ Igbo e ji eme ihe ma na-echekwa njikọ onye nwe ihe dị na Grik; ‘ya’ na-eme ka onye ha na-eso doo anya n’ebe a.
- source_word: ἐκμάσσειν
  choice: na-ehicha ha
  rationale: Na-egosi ihicha ụkwụ ahụ site n’iji akwa tee ha; ‘ha’ laghachiri n’ụkwụ ndị ahụ.
- source_word: τῷ λεντίῳ
  choice: jiri akwa nhicha ahụ
  rationale: ‘Akwa nhicha’ bụ okwu Igbo doro anya maka akwa e ji ehicha ma ọ bụ mee ka ihe kpọọ nkụ.
- source_word: ᾧ ἦν διεζωσμένος
  choice: o kekwasịrị n’úkwù ya
  rationale: Na-egosipụta akpaala okwu Grik nke iyi ma ọ bụ ike akwa gburugburu úkwù n’ụzọ dị mfe ma kwesị ntụkwasị obi.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị ugbu a ma dị nsọ n’ụzọ kwesịrị ekwesị. E ji usoro ngwaa gara aga mee ka akụkọ ahụ daa nke ọma n’Igbo, ebe Grik ji present akụkọ ihe mere eme n’akụkụ mbụ wee jiri aorist kọwaa mmalite omume sochirinụ. Akara nkọwa ala ala [a] na [b] dị n’ahịrịokwu ahụ n’ebe okwu ha na-akọwa nọ.
