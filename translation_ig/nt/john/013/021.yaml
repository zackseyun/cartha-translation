id: JHN.13.21
reference: John 13:21
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ταῦτα εἰπὼν ⸀ὁ Ἰησοῦς ἐταράχθη τῷ πνεύματι καὶ ἐμαρτύρησεν καὶ εἶπεν· Ἀμὴν ἀμὴν λέγω ὑμῖν ὅτι εἷς ἐξ ὑμῶν παραδώσει με.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/021.yaml
  text: After saying these things[a], Jesus was troubled in spirit, and testified and said, “Truly, truly, I say to you, one of you will betray me.”
translation:
  language: ig
  text: Mgbe Jizọs kwusịrị ihe ndị a, o nwere nsogbu n’ime mmụọ ya, o wee gbaa akaebe, sị, “N’ezie, n’ezie, ana m agwa unu, otu onye n’ime unu ga-arara m nye[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n’ụzọ nkịtị karịa, “ga-enyefe m.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταῦτα εἰπὼν
  choice: Mgbe Jizọs kwusịrị ihe ndị a
  rationale: A tụgharịrị nkebi aorist participle dị ka nkebi oge n’Igbo, nke na-egosi na ihe a mere mgbe okwu ndị bu ya ụzọ gasịrị ma na-ada nke ọma n’asụsụ Igbo.
- source_word: ἐταράχθη τῷ πνεύματι
  choice: o nwere mwute n’ime mmụọ ya
  rationale: Nke a na-egosi nsogbu na mkpali dị n’ime Jizọs, ma na-edobe τῷ πνεύματι dị ka akụkụ ma ọ bụ ebe o metụtara, n’etinyeghị ike okwu na-adịghị n’ahịa Grik.
- source_word: ἐμαρτύρησεν
  choice: O wee gbaa akaebe
  rationale: ‘Gbaa akaebe’ na-edobe ụzọ Jọn si eji μαρτυρέω eme ihe ma na-egosi na Jizọs kwuru okwu a n’ụzọ siri ike na nke doro anya.
- source_word: Ἀμὴν ἀμὴν
  choice: N’ezie, n’ezie
  rationale: Nke a na-ebute nkwusiri ike nke usoro okwu Jizọs n’Akwụkwọ Jọn ma na-edobe nkwughachi dị n’ahịa Grik.
- source_word: λέγω ὑμῖν
  choice: ana m agwa unu
  rationale: Nke a bụ ụzọ doro anya ma bụrụkwa nke ebumpụta ụwa e si asụ λέγω ὑμῖν n’Igbo.
- source_word: εἷς ἐξ ὑμῶν
  choice: otu onye n’ime unu
  rationale: 'Nke a na-edobe okwu partitive nke Grik ma na-eme ka ihe ijuanya dị n’okwu ahụ pụta ìhè: onye ahụ bụ otu n’ime ndị nọ ya nso.'
- source_word: παραδώσει με
  choice: ga-arara m nye
  rationale: N’ọnọdụ a, okwu ahụ na-ekwu maka aghụghọ nke otu onye na-eso ụzọ ga-eme; ‘ga-arara m nye’ na-enye ihe okwu ahụ pụtara n’Igbo. E debere ntụgharị nkịtị karịa, ‘ga-enyefe m,’ n’ala peeji.
theological_decisions:
- issue: Otú e si kọwaa nsogbu dị n’ime Jizọs
  choice: o nwere mwute n’ime mmụọ ya
  alternative: mmụọ ya nọ n'ọgba aghara
  rationale: Nhọrọ a na-ahapụ ezi mmetụta mmadụ Jizọs nwere ka ọ kwụrụ n’onwe ya, n’ebelataghị ya ma ọ bụ tinye nkọwa ozizi okpukpe nke amaokwu ahụ ekwughị.
- issue: Otú e si tụgharịa παραδίδωμι n’amụma banyere ịrara Jizọs nye
  choice: ga-arara m nye
  alternative: ga-enyefe m
  rationale: Ihe gbara amaokwu ahụ gburugburu na-egosi omume aghụghọ nke onye na-eso ụzọ, ya mere ‘ga-arara m nye’ na-ekwupụta ya nke ọma. Ma ebe okwu Grik ahụ nwekwara isi echiche nke inyefe mmadụ n’aka ndị ọzọ, e debere nke ahụ n’ala peeji.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dịkwa mfe nghọta, mee ntụgharị a. E debere usoro nkwusiri ike ‘N’ezie, n’ezie’ na okwu Jọn banyere ịgba akaebe; a zere okwu ụka pụrụ iche ma ọ bụ nkọwa na-edozi esemokwu nkà mmụta okpukpe n’ime amaokwu ahụ.
