revisions:
- from: Mgbe Jizọs kwusịrị ihe ndị a, o nwere mwute n’ime mmụọ ya. O wee gbaa akaebe, sị, “N’ezie, n’ezie, ana m agwa unu, otu onye n’ime unu ga-arara m nye[a].”
  to: Mgbe Jizọs kwusịrị ihe ndị a, o nwere nsogbu n’ime mmụọ ya, o wee gbaa akaebe, sị, “N’ezie, n’ezie, ana m agwa unu, otu onye n’ime unu ga-arara m nye[a].”
  rationale: The revision changes only the rendering of ἐταράχθη τῷ πνεύματι from a specific emotion (‘mwute’) to the broader ‘nsogbu n’ime mmụọ ya,’ preserving the Greek sense of inner disturbance. The footnote wording is smoothed while retaining the lexical alternative for παραδίδωμι.
