source:
  edition: SBLGNT
  text: ὑμεῖς φωνεῖτέ με Ὁ διδάσκαλος καὶ Ὁ κύριος, καὶ καλῶς λέγετε, εἰμὶ γάρ.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/013.yaml
  text: You call me Teacher and Lord, and you speak rightly, for I am.
translation:
  language: ig
  text: Unu na-akpọ m “Onye Ozizi” na “Onyenwe,” unu kwuru eziokwu, n’ihi na m bụ otu a.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Nna-ukwu.” Okwu Grik bụ kyrios pụrụ ịpụta onye nwe ma ọ bụ onye nwere ikike; ebe a, “Onyenwe” na-edobe ya dị ka utu aha.
    reason: lexical_alternative
lexical_decisions:
- source_word: φωνεῖτέ
  choice: na-akpọ
  rationale: N’usoro ahịrịokwu a, ọ pụtara ịkpọ mmadụ aha ma ọ bụ utu aha; “na-akpọ m” bụ ụzọ Igbo doro anya ma kwekọọ n’okwu Grik.
- source_word: Ὁ διδάσκαλος
  choice: Onye Ozizi
  rationale: Ọ bụ utu aha na-egosi onye na-akụzi; “Onye Ozizi” bụ okwu Igbo dị ùgwù ma doo ndị na-agụ akwụkwọ anya.
- source_word: Ὁ κύριος
  choice: Onyenwe anyị
  rationale: Nke a bụ nsụgharị Igbo a na-ejikarị edebe κύριος dị ka utu aha nke ikike na ịbụ Onyenwe; a hapụrụkwa ụzọ ọzọ na nkọwa ala peeji.
- source_word: καλῶς λέγετε
  choice: Ihe unu na-ekwu ziri ezi
  rationale: Nkebiokwu a na-egosi na ihe ha kwuru bụ eziokwu. Nsụgharị a bụ Igbo eke karịa ịsị okwu n’ụzọ ga-ada ka ntụle maka otú ha si kwuo ya.
- source_word: εἰμὶ γάρ
  choice: n’ihi na ọ bụ ihe m bụ
  rationale: Ọ na-edebe nkwenye Jizọs na utu aha ndị ahụ bụ ihe ọ bụ, na-agbakwụnyeghị nkọwa nkà mmụta okpukpe na-adịghị n’ahịrịokwu ahụ.
theological_decisions:
- issue: Nsụgharị κύριος dị ka utu aha Jizọs
  choice: Onyenwe anyị
  alternative: Onye Nwe
  rationale: “Onyenwe anyị” na-echekwa ịdị arọ nke utu aha κύριος n’Agba Ọhụrụ, ma ọ naghị akọwawanye ihe ọ pụtara karịa ihe amaokwu ahụ kwuru. “Onye Nwe” nwere ike ime ka akụkụ nke ịbụ onye isi ma ọ bụ onye nwere ikike pụta ìhè.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E kewara okwu ahụ ụzọ abụọ ka ọ daa nke ọma n’Igbo, ma e chekwara nkwenye siri ike dị na εἰμὶ γάρ.
