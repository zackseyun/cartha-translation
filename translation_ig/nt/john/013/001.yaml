revisions:
- from: Tupu Mmemme Ngabiga, Jizọs maara na oge ya eruola mgbe ọ ga-esi n’ụwa a gakwuru Nna. Ebe ọ hụworo ndị nke ya nọ n’ụwa n’anya, ọ hụrụ ha n’anya ruo ọgwụgwụ[a].
  to: Tupu Ememme Ngabiga, Jizọs maara na oge ya eruola ka ọ si n’ụwa a gakwuru Nna. Ebe ọ hụworo ndị nke ya nọ n’ụwa n’anya, ọ hụrụ ha n’anya ruo ọgwụgwụ[a].
  rationale: The revision uses the established feast term “Ememme Ngabiga” and changes “mgbe ọ ga-esi” to “ka ọ si” so that the Igbo more faithfully expresses that Jesus’ hour had come for his departure. The wording for Jesus’ love and its footnote remain unchanged in meaning, retaining the source phrase’s temporal and qualitative ambiguity.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T06:25:40Z'
review_pass:
  verdict: revise
  source_fidelity: The draft conveys the verse’s principal sense, including Jesus’ awareness, the transition from the world to the Father, and the climactic love for his own. However, “oge ya eruola mgbe ọ ga-esi ...” can suggest that the hour arrived at a particular later time, rather than that it had arrived for his departure. “Ka ọ si ...” more directly represents the Greek purpose construction (ἵνα μεταβῇ).
  naturalness: The Igbo is generally clear and appropriately dignified. “Ememme Ngabiga” is the more established and natural term for the Passover feast in Standard Igbo. The revised sentence also maintains a smoother connection between “oge ya eruola” and the departure clause.
  terminology: “Nna,” “ndị nke ya,” and “hụrụ ha n’anya ruo ọgwụgwụ” appropriately preserve Johannine relational language and the ambiguity of εἰς τέλος. The footnote correctly supplies the qualitative alternative without forcing it into the main text.
  issues:
  - severity: medium
    issue: The purpose relation after “oge ya eruola” is imprecisely expressed.
    rationale: Greek ἦλθεν ... ἡ ὥρα ἵνα μεταβῇ means that his hour had come for him to depart. Replacing “mgbe ọ ga-esi” with “ka ọ si” preserves this relation more accurately.
  - severity: low
    issue: “Mmemme Ngabiga” is less conventional than “Ememme Ngabiga.”
    rationale: “Ememme Ngabiga” is a more idiomatic and broadly recognized Standard Igbo designation for the Passover feast.
  revised_text: Tupu Ememme Ngabiga, Jizọs maara na oge ya eruola ka ọ si n’ụwa a gakwuru Nna. Ebe ọ hụworo ndị nke ya nọ n’ụwa n’anya, ọ hụrụ ha n’anya ruo ọgwụgwụ[a].
  revised_footnotes:
