id: JHN.13.1
reference: John 13:1
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Πρὸ δὲ τῆς ἑορτῆς τοῦ πάσχα εἰδὼς ὁ Ἰησοῦς ὅτι ⸀ἦλθεν αὐτοῦ ἡ ὥρα ἵνα μεταβῇ ἐκ τοῦ κόσμου τούτου πρὸς τὸν πατέρα ἀγαπήσας τοὺς ἰδίους τοὺς ἐν τῷ κόσμῳ εἰς τέλος ἠγάπησεν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/001.yaml
  text: Before the Feast of the Passover[a], Jesus, knowing that his hour had come to depart from this world to the Father, having loved his own who were in the world[b], loved them to the end.
translation:
  language: ig
  text: Tupu Ememme Ngabiga, Jizọs maara na oge ya eruola ka ọ si n’ụwa a gakwuru Nna. Ebe ọ hụworo ndị nke ya nọ n’ụwa n’anya, ọ hụrụ ha n’anya ruo ọgwụgwụ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “n’ụzọ zuru oke” ma ọ bụ “ruo n’ókè kachasị elu.” Nkebiokwu Grik ahụ nwere ike ịpụta ma na ọ hụrụ ha n’anya ruo n’oge ikpeazụ ma na ịhụnanya ya zuru oke.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πρὸ δὲ τῆς ἑορτῆς τοῦ πάσχα
  choice: Tupu Mmemme Ngabiga
  rationale: “Tupu” na-egosi oge bu ụzọ, ebe “Mmemme Ngabiga” na-akọwa emume ahụ n’Igbo doro anya. A hapụrụ δέ dị ka njikọ dị nro nke usoro okwu Igbo na-eburu n’enweghị itinye okwu mgbakwunye.
- source_word: εἰδὼς
  choice: maara
  rationale: Ọ na-egosi na Jizọs maara nke ọma ihe na-abịanụ n’oge omume a na-akọ.
- source_word: ἦλθεν αὐτοῦ ἡ ὥρα
  choice: oge ya eruola
  rationale: Nke a na-echekwa akpaalaokwu Jọn banyere oge dị mkpa e kenyere Jizọs, ma na-ada n’Igbo eke karịa ntụgharị nkịtị nke ‘awa.’
- source_word: ἵνα μεταβῇ ἐκ τοῦ κόσμου τούτου πρὸς τὸν πατέρα
  choice: mgbe ọ ga-esi n’ụwa a gakwuru Nna
  rationale: “Si n’ụwa a gakwuru Nna” na-echekwa mmegharị site n’ụwa gaa n’ebe Nna nọ, n’etinyeghị nkọwa karịrị ihe Grik kwuru.
- source_word: τοὺς ἰδίους τοὺς ἐν τῷ κόσμῳ
  choice: ndị nke ya nọ n’ụwa
  rationale: “Ndị nke ya” na-echekwa obosara na mmekọrịta dị n’okwu Grik, n’emeghị ka ọ bụrụ naanị ndị na-eso ụzọ ya.
- source_word: ἀγαπήσας
  choice: Ebe ọ hụworo … n’anya
  rationale: Ụdị a na-egosi ịhụnanya Jizọs nke dịlarị tupu okwu ikpeazụ ahụ, ma na-eme ka ahịrịokwu ahụ bụrụ Igbo dị mfe nghọta.
- source_word: εἰς τέλος
  choice: ruo ọgwụgwụ
  rationale: Nke a na-echekwa nghọta banyere ịhụnanya ruo n’oge ikpeazụ, ma hapụkwa ohere maka nghọta nke ịhụnanya zuru oke; e depụtara nke ọzọ n’ala peeji.
- source_word: ἠγάπησεν αὐτούς
  choice: ọ hụrụ ha n’anya
  rationale: A tụgharịrị ngwaa ahụ n’ụzọ kwụ ọtọ ma debe nkwughachi ‘ịhụ n’anya’ nke dị na Grik.
theological_decisions:
- issue: Ihe εἰς τέλος pụtara n’okwu banyere ịhụnanya Jizọs
  choice: ruo ọgwụgwụ
  alternative: n’ụzọ zuru oke / ruo n’ókè kachasị elu
  rationale: Nkebiokwu Grik nwere ike ịpụta ma ịhụnanya nke na-adịgide ruo n’oge ikpeazụ ma ịhụnanya zuru oke. Isi ederede na-echekwa nghọta oge ahụ, ebe ala peeji na-egosi nghọta ịdị zuru oke n’emeghị ka otu n’ime ha kpochapụ ibe ya.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. “Nna” na-echekwa aha mmekọrịta pụrụ iche dị n’Oziọma Jọn; a zere itinye ‘Nna ya’ ebe Grik kwuru ‘Nna.’
