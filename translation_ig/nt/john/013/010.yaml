revisions:
- from: Jizọs sịrị ya, “Onye sara ahụ[a] adịghị mkpa ịsa ihe ọ bụla ọzọ ma e wezụga ụkwụ ya; ọ dị ọcha kpamkpam. Unu onwe unu dịkwa ọcha, ma ọ bụghị unu niile.”
  to: Jizọs sịrị ya, “Onye sara ahụ[a] enweghị mkpa ka a saa ya, ma e wezụga ụkwụ ya; ọ dị ọcha kpamkpam. Unu dịkwa ọcha, ma ọ bụghị unu niile.”
  rationale: 'The revision expresses the Greek exception directly: a person who has bathed needs no further washing, except for the feet. It also removes unsupported emphatic wording while retaining the lexical contrast, the totality of “completely clean,” and the unresolved symbolic force of the washing imagery.'
  reviewer_model: gpt-5.6-terra
