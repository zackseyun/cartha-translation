    text: 'N’asụsụ Grik, e ji ngwaa abụọ dị iche iche kwuo maka ịsa: λούω pụtara ịsa ahụ dum, ebe νίπτω na-apụtakarị ịsa akụkụ ahụ, dịka ụkwụ.'
    reason: lexical_alternative
