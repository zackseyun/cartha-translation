review_pass:
  verdict: revise
  source_fidelity: 'The draft correctly distinguishes λούω (whole-body bathing) from νίπτω (washing the feet), retains the completed-state sense of the perfect participle, and preserves the final qualification that not every member of the addressed group is clean. However, “adịghị mkpa ịsa ihe ọ bụla ọzọ ma e wezụga ụkwụ ya” changes the syntax and sense: it says that the person need not wash anything else except his feet, rather than that he has no need to be washed except for his feet.'
  naturalness: The register and most wording are clear, modern Standard Igbo. “Onye sara ahụ,” “dị ọcha kpamkpam,” and “ma ọ bụghị unu niile” are suitable. Recasting the exception with “ka a saa ya, ma e wezụga ụkwụ ya” is both more idiomatic and closer to the Greek sense. “Onwe unu” is unnecessary emphasis not present in the source.
  terminology: “Jizọs,” “sara ahụ,” “ịsa ụkwụ,” and “dị ọcha” appropriately retain the narrative washing imagery and its unstated broader resonance. The footnote accurately explains the lexical distinction and is correctly anchored to “ahụ.”
  issues:
  - severity: medium
    issue: The clause concerning the sole exception is mistranslated.
    rationale: Greek οὐκ ἔχει χρείαν εἰ μὴ τοὺς πόδας νίψασθαι means that the bathed person has no need of washing except the feet. The draft's “adịghị mkpa ịsa ihe ọ bụla ọzọ ma e wezụga ụkwụ ya” instead frames feet as the only thing the person needs to wash, while saying he need not wash anything else; this does not express the source construction accurately.
  - severity: low
    issue: “onwe unu” adds emphasis.
    rationale: καὶ ὑμεῖς καθαροί ἐστε addresses the group plainly; no reflexive or emphatic equivalent of “onwe unu” occurs in the Greek.
  revised_text: Jizọs sịrị ya, “Onye sara ahụ[a] enweghị mkpa ka a saa ya, ma e wezụga ụkwụ ya; ọ dị ọcha kpamkpam. Unu dịkwa ọcha, ma ọ bụghị unu niile.”
  revised_footnotes:
