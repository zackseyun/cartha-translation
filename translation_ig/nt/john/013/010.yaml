  edition: SBLGNT
  text: λέγει αὐτῷ ⸀ὁ Ἰησοῦς· Ὁ λελουμένος ⸂οὐκ ἔχει χρείαν⸃ ⸂εἰ μὴ⸃ τοὺς πόδας νίψασθαι, ἀλλ’ ἔστιν καθαρὸς ὅλος· καὶ ὑμεῖς καθαροί ἐστε, ἀλλ’ οὐχὶ πάντες.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/010.yaml
  text: Jesus said to him[a], “The one who has bathed has no need except to wash his feet, but is completely clean. And you are clean, but not all of you.”
translation:
  language: ig
  text: Jizọs sịrị ya, “Onye sara ahụ[a] enweghị mkpa ka a saa ya, ma e wezụga ụkwụ ya; ọ dị ọcha kpamkpam. Unu dịkwa ọcha, ma ọ bụghị unu niile.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'N’asụsụ Grik, e ji ngwaa abụọ dị iche iche kwuo maka ịsa: λούω pụtara ịsa ahụ dum, ebe νίπτω na-apụtakarị ịsa akụkụ ahụ, dịka ụkwụ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει αὐτῷ ὁ Ἰησοῦς
  choice: Jizọs sịrị ya
  rationale: A sụgharịrị historical present λέγει n’oge gara aga, nke bụ ụzọ e si akọ akụkọ n’Igbo nke ọma, ma debe αὐτῷ dị ka “ya.”
- source_word: Ὁ λελουμένος
  choice: Onye sara ahụ
  rationale: “Ịsa ahụ” n’Igbo na-egosi ịsa mmadụ dum, ya mere ọ na-edebe ihe λούω pụtara na ọnọdụ nke onye sacharala ahụ.
- source_word: οὐκ ἔχει χρείαν εἰ μὴ
  choice: adịghị mkpa … ma e wezụga
  rationale: Nke a na-egosipụta nke ọma na ọ bụ naanị otu ihe ka a hapụrụ dị ka ihe dị mkpa, dịka εἰ μὴ si arụ ọrụ n’ahịrịokwu a.
- source_word: τοὺς πόδας νίψασθαι
  choice: ịsa … ụkwụ ya
  rationale: “Ịsa ụkwụ” bụ okwu Igbo nkịtị ma na-edebe ọdịiche dị n’etiti νίπτω, ịsa akụkụ ahụ, na λούω, ịsa ahụ dum.
- source_word: καθαρὸς ὅλος
  choice: ọ dị ọcha kpamkpam
  rationale: “Kpamkpam” na-egosipụta izu oke nke ὅλος, ebe “dị ọcha” na-edebe ma ihe gbasara ịsa ahụ ma nghọta ime mmụọ nwere ike ịdị na ya.
- source_word: καὶ ὑμεῖς καθαροί ἐστε
  choice: Unu onwe unu dịkwa ọcha
  rationale: “Unu” na-edebe onye nke abụọ n’ọnụọgụ ọtụtụ; “onwe unu” na-enye nkwusi ike dị n’okwu a n’Igbo na-enweghị ịgbanwe ihe ọ pụtara.
- source_word: ἀλλ’ οὐχὶ πάντες
  choice: ma ọ bụghị unu niile
  rationale: Nke a na-eme ka o doo anya na e nwere onye ma ọ bụ ndị nọ n’etiti ndị a kpọrọ “unu” na-adịghị ọcha.
theological_decisions:
- issue: Ihe oyiyi nke ịsa ahụ na ịdị ọcha ime mmụọ
  choice: E debere “sara ahụ,” “ịsa … ụkwụ,” na “dị ọcha” n’enweghị ịkọwa ihe nnọchianya ahụ n’ime amaokwu.
  alternative: Ịgbakwunye “dị ọcha n’ime mmụọ” ma ọ bụ iji otu okwu “ịsa” mee ka λούω na νίπτω bụrụ otu.
  rationale: Okwu ahụ na-arụ ọrụ ma n’ihe a na-ahụ anya ma n’ihe ime mmụọ. Nsụgharị a na-edebe ọdịiche ngwaa ndị Grik na esemokwu nkà mmụta okpukpe n’enweghị ịmanye otu nkọwa ozizi.
- issue: Onye otu nke Ὁ λελουμένος
  choice: Onye sara ahụ
  alternative: Nwoke sara ahụ
  rationale: Participle ahụ bụ masculine singular n’ụtọasụsụ Grik, ma o nwere ọrụ izugbe n’ilu a. “Onye” na-edebe onye otu ahụ n’enweghị ime ka okwu ahụ bụrụ naanị maka nwoke.
translation_notes:
  register: Ejiri Standard Igbo dị ugbu a, nke dị ugwu ma dị mfe nghọta. “Jizọs,” “ịsa ahụ,” “ịsa ụkwụ,” na “dị ọcha kpamkpam” bụ okwu ndị nkịtị ga-aghọta, ma ha ka na-edebe ọdịiche na nghọta sara mbara nke isi mmalite Grik.
