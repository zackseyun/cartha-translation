  text: ταῦτα ἐν Βηθανίᾳ ἐγένετο πέραν τοῦ Ἰορδάνου, ὅπου ἦν ⸀ὁ Ἰωάννης βαπτίζων.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/028.yaml
  text: These things took place in Bethany beyond the Jordan[a], where John was baptizing.
translation:
  language: ig
  text: Ihe ndị a mere na Betani, n’ofe Osimiri Jọdan[a], ebe Jọn nọ na-eme baptizim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ụfọdụ akwụkwọ aka ochie na ọdịnala nsụgharị ndị e mesịrị nwere “Betabara” kama “Betani.”
    reason: textual_variant
lexical_decisions:
- source_word: ταῦτα
  choice: Ihe ndị a
  rationale: Ọ na-edobe ụbara nke okwu Grik ma na-ezo aka n’ihe ndị e kwuru na ihe ndị mere tupu nke a.
- source_word: ἐν Βηθανίᾳ
  choice: na Betani
  rationale: Nke a bụ ụzọ Igbo nkịtị si egosi ebe ihe mere, ya bụ, Betani.
- source_word: ἐγένετο
  choice: mere
  rationale: N’ebe a, okwu ahụ pụtara na ihe ndị ahụ mere; “mere” bụ okwu Igbo doro anya ma kwekọọ n’akụkọ.
- source_word: πέραν τοῦ Ἰορδάνου
  choice: n’ofe Osimiri Jọdan
  rationale: Ọ na-egosi ebe dị n’akụkụ nke ọzọ nke osimiri ahụ ma mee ka o doo anya nye onye na-agụ Igbo na Jọdan bụ osimiri.
- source_word: ὅπου
  choice: ebe
  rationale: Ọ bụ okwu njikọ ebe dị mfe ma bụrụ nke e ji eme ihe n’Igbo ugbu a.
- source_word: ἦν ὁ Ἰωάννης βαπτίζων
  choice: ebe Jọn nọ na-eme baptizim
  rationale: “Nọ na-eme” na-egosi ọrụ gara n’ihu n’oge ahụ, dịka njikọ imperfect na present participle si egosi na Grik.
theological_decisions:
- issue: Aha ebe Βηθανίᾳ (“Betani”) ma ọ bụ ụdị ọzọ Βηθαβαρᾷ (“Betabara”)
  choice: Betani
  alternative: Betabara
  rationale: SBLGNT e nyere nwere Βηθανίᾳ, ya mere ederede bụ isi soro ya. E debere “Betabara” n’okpuru dịka ụdị ọgụgụ dị n’ụfọdụ akwụkwọ aka ochie na ọdịnala nsụgharị ndị e mesịrị.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E ji “na-eme baptizim” debe okwu okpukpe a maara nke ọma, ebe “nọ na-eme” na-egosipụta na ọrụ ahụ na-aga n’ihu.
