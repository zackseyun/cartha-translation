  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἐν τῷ κόσμῳ ἦν, καὶ ὁ κόσμος δι’ αὐτοῦ ἐγένετο, καὶ ὁ κόσμος αὐτὸν οὐκ ἔγνω.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/010.yaml
  text: He was in the world[a], and the world came into being through him[b], and the world did not know him.
translation:
  language: ig
  text: Ọ nọ n’ụwa, ọ bụkwa site na ya ka ụwa malitere ịdị[a], ma ụwa amataghị ya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “E kere ụwa site na ya.” Ngwaa Grik ahụ pụtara “ịmalite ịdị” ma ọ bụ “ịbịa n’ịdị adị.”
    reason: lexical_alternative
  - marker: b
    text: “Amataghị ya” nwekwara ike ịpụta “aghọtaghị onye ọ bụ” ma ọ bụ “anabataghị ya dị ka onye ọ bụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κόσμῳ / κόσμος
  choice: ụwa
  rationale: 'A sụgharịrị κόσμος ugboro atọ dịka “ụwa” iji debe otu okwu ahụ na nghọta ya sara mbara: ihe e kere eke, ụwa mmadụ bi na ya, nakwa ụmụ mmadụ ndị na-amataghị ya.'
- source_word: ἦν
  choice: nọ
  rationale: “Ọ nọ n’ụwa” na-egosi ọnọdụ na-aga n’ihu n’oge gara aga ma na-ada nke ọma n’Igbo; ọ naghị etinye echiche nkà ihe ọmụma na-adịghị n’okwu Grik.
- source_word: δι’ αὐτοῦ
  choice: site na ya
  rationale: διά ya na genitive na-egosi onye ma ọ bụ ụzọ e si mee ihe. “Site na ya” na-egosipụta ọrụ ya dị ka onye e sitere n’aka ya mee ka ụwa malite ịdị.
- source_word: ἐγένετο
  choice: malite ịdị
  rationale: Nhọrọ a na-egosi na ụwa bịara ịdị, ma na-edebekwa ọdịiche Jọn mere n’etiti ἦν (“nọ”) na ἐγένετο (“malite ịdị”).
- source_word: ἔγνω
  choice: amataghị
  rationale: “Amataghị” na-edebe isi ihe γινώσκω pụtara, ma ọ ka nwere ike ịgụnye na ụwa aghọtaghị onye ọ bụ, amataghị ya mgbe ọ bịara, ma ọ bụ anabataghị ya dị ka onye ọ bụ.
- source_word: αὐτόν / αὐτοῦ
  choice: ya
  rationale: Nnọchiaha a na-ezo aka n’Okwu ahụ e kwuru banyere ya n’amaokwu ndị bu ụzọ; “ya” na-edebe ntụaka ahụ n’ụzọ nkịtị n’Igbo.
theological_decisions:
- issue: Onye isiokwu a na-ezo aka na ya
  choice: E jiri “Ọ” na “ya” gosi onye ahụ n’onwe ya, ya bụ Okwu ahụ e kwuru banyere ya n’amaokwu ndị bu ụzọ.
  alternative: Iwere isiokwu ahụ dị ka ihe na-abụghị mmadụ n’ihi na aha ya bụ “Okwu.”
  rationale: Ọ bụ ezie na amaokwu a ekwughị aha isiokwu ahụ ọzọ, ihe gbara ya gburugburu na-egosi na ọ bụ Okwu ahụ e ji nnọchiaha onye kpọọ. Nke a na-edebe ntụaka nke ederede n’enweghị ịgbakwunye nkọwa ozizi ọzọ.
- issue: Ọdịiche dị n’etiti ịdị adị nke Okwu ahụ na mmalite nke ụwa
  choice: “Ọ nọ” maka ἦν, ma “ụwa ... malite ịdị” maka ἐγένετο.
  alternative: Iji otu ụdị okwu, dịka “dị,” n’ebe abụọ ahụ, ma ọ bụ ịsị naanị “e kere ụwa site na ya.”
  rationale: Jọn jiri ngwaa abụọ dị iche gosi na Okwu ahụ nọrịị, ebe ụwa bịara malite ịdị. Nsụgharị ahụ na-edebe ọdịiche a n’enweghị itinye okwu nkà mmụta okpukpe na-adịghị n’amaokwu ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. Ahịrịokwu ahụ na-emegharị “ụwa” ugboro atọ dịka ederede Grik, ma na-edebe ọdịiche dị n’etiti “ọ nọ” na “ụwa ... malite ịdị.” E doziri ọnọdụ akara nkọwa ala peeji ka [a] soro okwu banyere ἐγένετο, ebe [b] soro ἔγνω, dịka ọdịnaya nkọwa ndị ahụ si dị.
