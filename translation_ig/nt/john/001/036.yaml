id: JHN.1.36
reference: John 1:36
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἐμβλέψας τῷ Ἰησοῦ περιπατοῦντι λέγει· Ἴδε ὁ ἀμνὸς τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/036.yaml
  text: And looking at Jesus as he was walking, he says, “Look, the Lamb of God!”
translation:
  language: ig
  text: O legidere Jizọs anya ka Jizọs na-aga ije, sị, “Lee, Nwa Atụrụ Chineke!”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμβλέψας
  choice: legidere ... anya
  rationale: Na-egosi ile mmadụ anya nke ọma ma ọ bụ ilekwasị ya anya, karịa naanị ịhụ ya.
- source_word: περιπατοῦντι
  choice: ka ọ na-aga ije
  rationale: 'Na-enye ihe omume na-aga n’ihu nke participle ahụ: Jizọs nọ na-aga ije.'
- source_word: λέγει
  choice: ọ sịrị
  rationale: Present akụkọ ihe mere eme nke Grik ka e tinyere n’ụdị okwu akụkọ kacha dịrị Igbo mma.
- source_word: Ἴδε
  choice: Lee
  rationale: Okwu ịkpọ uche ndị na-ege ntị ka ha hụ ma lebara ihe a na-egosi anya.
- source_word: ὁ ἀμνὸς τοῦ θεοῦ
  choice: Nwa Atụrụ Chineke
  rationale: Na-edobe ihe atụ bụ isi na njikọ genitive nke okwu Grik n’enweghị ịkọwa ihe ọ pụtara karịa ihe amaokwu ahụ kwuru.
theological_decisions:
- issue: Ihe “τοῦ θεοῦ” pụtara n’ụzọ zuru ezu
  choice: Chineke
  alternative: nke sitere n’aka Chineke / nke Chineke nwere
  rationale: E debere njikọ ahụ n’ụdị mkpirikpi “Nwa Atụrụ Chineke,” ka a ghara ikpebi n’amaghị ama ma ọ bụ njide, mmalite, ma ọ bụ ọrụ Chineke.
translation_notes:
  register: Standard Igbo; okwu dị ebube ma bụrụkwa nke ndị na-agụ Igbo nke oge a ga-aghọta. E ji “Jizọs” mee aha ahụ, “Nwa Atụrụ Chineke” wee debe ihe atụ na nkwupụta nkà mmụta okpukpe nke isi mmalite.
