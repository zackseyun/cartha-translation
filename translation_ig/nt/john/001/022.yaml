- from: Ya mere, ha sịrị ya, “Ị bụ onye? Ka anyị nwee ike ịza ndị zitere anyị. Gịnị ka ị na-ekwu banyere onwe gị?”
  to: Ya mere, ha sịrị ya, “Onye ka ị bụ? Ka anyị nye ndị zitere anyị azịza. Gịnị ka ị na-ekwu banyere onwe gị?”
  rationale: The revision preserves the transitional force of οὖν (“Ya mere”), the direct questions, and the purpose clause. It removes an unwarranted capability nuance, explicitly retains “answer,” and uses idiomatic Standard Igbo for the identity question.
