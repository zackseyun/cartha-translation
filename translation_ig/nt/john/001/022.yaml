  text: εἶπαν οὖν αὐτῷ· Τίς εἶ; ἵνα ἀπόκρισιν δῶμεν τοῖς πέμψασιν ἡμᾶς· τί λέγεις περὶ σεαυτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/john/001/022.yaml
  text: So they said to him, “Who are you, so that we may give an answer to those who sent us? What do you say about yourself?”
translation:
  language: ig
  text: Ya mere, ha sịrị ya, “Onye ka ị bụ? Ka anyị nye ndị zitere anyị azịza. Gịnị ka ị na-ekwu banyere onwe gị?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὖν
  choice: Ya mere
  rationale: Ọ na-egosi njikọ na ihe si n’okwu gara aga pụta; ‘Ya mere’ doro anya ma bụrụkwa Igbo a na-asụ ugbu a.
- source_word: εἶπαν ... αὐτῷ
  choice: ha sịrị ya
  rationale: Nke a bụ ụzọ Igbo kachasị eke isi webata okwu a gwara mmadụ kpọmkwem.
- source_word: Τίς εἶ;
  choice: Ị bụ onye?
  rationale: Ọ na-edobe ajụjụ dị mkpụmkpụ nke Grik banyere onye ọ bụ, n’etinyeghị nkọwa ọzọ.
- source_word: ἵνα ἀπόκρισιν δῶμεν
  choice: Ka anyị nwee ike ịza
  rationale: ‘Ka’ na-egosi nzube, ebe ‘nwee ike ịza’ na-ebuga echiche nke inye azịza n’ụzọ Igbo na-ada nke ọma.
- source_word: τοῖς πέμψασιν ἡμᾶς
  choice: ndị zitere anyị
  rationale: Ọ na-egosipụta participle e ji mee aha dị ka ‘ndị’ ma na-edobe omume ahụ dịka ihe mere eme.
- source_word: τί λέγεις περὶ σεαυτοῦ
  choice: Gịnị ka ị na-ekwu banyere onwe gị?
  rationale: Ọ na-edobe ajụjụ banyere akaebe o ji ọnụ ya na-enye banyere onwe ya, n’ụzọ doro anya ma dị eke n’Igbo.
theological_decisions: []
translation_notes:
  register: Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A hapụrụ ajụjụ abụọ ahụ ka ha bụrụ kpọmkwem dịka n’isi mmalite, n’enweghị itinye nkọwa okpukpe na-adịghị na ederede.
