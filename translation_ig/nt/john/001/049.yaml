revisions:
- from: Nataniel zara ya, sị, “Rabaị, ị bụ Ọkpara Chineke; ị bụ Eze Izrel.”
  to: Nataniel zara ya, sị, “Rabaị, ị bụ Nwa Chineke; ị bụ Eze Izrel.”
  rationale: The revision removes an unintended firstborn specification while preserving the definite christological title, the direct address, the royal-messianic title, and the Greek's repeated confessional structure.
  reviewer_model: gpt-5.6-terra
