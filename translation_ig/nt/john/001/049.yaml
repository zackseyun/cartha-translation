id: JHN.1.49
reference: John 1:49
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀπεκρίθη ⸂αὐτῷ Ναθαναήλ⸃· Ῥαββί, σὺ εἶ ὁ υἱὸς τοῦ θεοῦ, σὺ ⸂βασιλεὺς εἶ⸃ τοῦ Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/049.yaml
  text: Nathanael answered him, “Rabbi, you are the Son of God; you are the King of Israel.”
translation:
  language: ig
  text: Nataniel zara ya, sị, “Rabaị, ị bụ Nwa Chineke; ị bụ Eze Izrel.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: zara
  rationale: “Zara” bụ ụzọ Igbo nkịtị na nke ziri ezi si akọ nzaghachi n’ime mkparịta ụka.
- source_word: Ῥαββί
  choice: Rabaị
  rationale: E debere aha nsọpụrụ ndị Juu n'ụdị a sụgharịrị n'olu Igbo iji chekwaa ọnọdụ omenala narị afọ mbụ; ọ pụtara onye nkuzi.
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: Ọkpara Chineke
  rationale: “Ọkpara Chineke” na-egosipụta aha a kapịrị ọnụ nke dị n'okwu Grik ma na-echekwa ịdị arọ nke nkwupụta banyere Kraịst.
- source_word: βασιλεὺς
  choice: Eze
  rationale: “Eze” bụ okwu Igbo kpọmkwem maka βασιλεύς ma dabara n'aha eze nke Mesaya n'ebe a.
- source_word: τοῦ Ἰσραήλ
  choice: Izrel
  rationale: Njikọ “Eze Izrel” bụ ụzọ Igbo dị nkenke ma dị ebube isi chekwaa usoro aha “King of Israel,” n'enweghị ịgbasa ya ka ọ bụrụ “eze na-achị Izrel.”
- source_word: σὺ εἶ … σὺ … εἶ
  choice: ị bụ … ị bụ
  rationale: E chekwara nkwughachi ahụ iji gosipụta nkwusi ike na nhazi yiri ibe ya dị n'okwu nkwupụta Grik.
- source_word: Ναθαναήλ
  choice: Nataniel
  rationale: E dere aha onye ahụ n'ụdị mkpụrụokwu dabara n'ịkpọ ya n'Igbo.
theological_decisions:
- issue: Ike okwu banyere Kraịst dị na “Ọkpara Chineke”
  choice: E debere aha ahụ dịka “Ọkpara Chineke” n’enweghị ime ka ọ daa mbà ma ọ bụ ịgbasa nkọwa ya.
  alternative: “otu nwa Chineke” ma ọ bụ nkọwa nke na-eme ka aha ahụ ghara ịbụ nke a kapịrị ọnụ
  rationale: Okwu Grik nwere aha a kapịrị ọnụ, nke nwekwara nnukwu ihe ọ pụtara banyere Mesaya na Kraịst n’Oziọma Jọn; nsụgharị ahụ anaghị etinye nkọwa okwukwe e mechara guzobe ma ọ bụ belata ihe ederede kwuru.
- issue: Uche eze na Mesaya dị na “Eze Izrel”
  choice: A sụgharịrị ya dịka aha eze doro anya, “Eze Izrel.”
  alternative: “eze na-achị Izrel” ma ọ bụ “eze nke Izrel”
  rationale: Nhọrọ a na-echekwa aha eze-Mesaya ahụ n'ụdị dị mfe ma ghara ịgbakwunye nkọwa banyere ụdị ọchịchị ya.
translation_notes:
  register: Asụsụ ahụ bụ Standard Igbo nke oge a, dị mfe nghọta ma nwee ugwu. E chekwara nhazi nkwupụta abụọ ahụ na nkwusi ike nke “ị bụ … ị bụ.”
