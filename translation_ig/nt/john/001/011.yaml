  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἰς τὰ ἴδια ἦλθεν, καὶ οἱ ἴδιοι αὐτὸν οὐ παρέλαβον.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/011.yaml
  text: He came to his own[b][a], and his own people did not receive him.
translation:
  language: ig
  text: Ọ bịara n’ihe bụ nke ya[a], ma ndị nke ya anabataghị[b] ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ịsụgharị ya, “Ọ bịara n’ebe bụ nke ya.” N’asụsụ Grik, akụkụ mbụ a dị n’ụdị neuter n’ọtụtụ, ọ dị iche na akụkụ nke na-esote, nke dị n’ụdị masculine n’ọtụtụ: “ndị nke ya.”'
    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ, “ha ekwetaghị ịnabata ya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς τὰ ἴδια
  choice: n’ebe bụ nke ya
  rationale: Ụdị nnọchiaha a bụ neuter plural, ya mere ọ na-ezo aka n’ihe ma ọ bụ n’ebe bụ nke ya, ọ bụghị ozugbo n’ebe ndị mmadụ nọ. “N’ebe bụ nke ya” bụ Igbo dị mfe nke na-egosi ókèala, ebe obibi, ma ọ bụ ihe niile bụ nke ya, na-enweghị ịkọwa ya kpọmkwem karịa ihe Grik kwuru.
- source_word: ἦλθεν
  choice: Ọ bịara
  rationale: Nke a na-asụgharị aorist nke ἔρχομαι n’ụzọ kwụ ọtọ ma bụrụkwa okwu Igbo nkịtị maka mmegharị a.
- source_word: οἱ ἴδιοι
  choice: ndị nke ya
  rationale: Masculine plural ebe a na-ezo aka n’ebe ndị mmadụ nọ. “Ndị nke ya” na-edobe ọdịiche dị n’etiti ha na “ebe bụ nke ya” dị n’ahịrịokwu mbụ.
- source_word: παρέλαβον
  choice: anabataghị
  rationale: “Ịnabata” nwere ike ịgụnye ma ịnakwere mmadụ ma ịnabata ya nke ọma, ya mere ọ na-edobe obosara ihe παραλαμβάνω pụtara n’ebe a.
- source_word: αὐτόν
  choice: ya
  rationale: Nnọchiaha a na-ezo aka n’Okwu ahụ nke a na-ekwu maka ya n’akụkụ amaokwu a; “ya” bụ ntụgharị Igbo kwesịrị ekwesị.
theological_decisions:
- issue: Ihe ojiji abụọ nke ἴδιος na-ezo aka na ya
  choice: Akụkụ mbụ na-ezo aka n’ebe, ókèala, ma ọ bụ ihe bụ nke ya; akụkụ nke abụọ na-ezo aka n’ebe ndị nke ya nọ.
  alternative: A pụrụ ịghọta akụkụ abụọ ahụ dị ka ndị nke ya, ma ọ bụ ghọta nke mbụ kpọmkwem dị ka ụlọ ya.
  rationale: Grik gbanwere site na neuter plural τὰ ἴδια gaa na masculine plural οἱ ἴδιοι. Nsụgharị a na-egosi ọdịiche ahụ ma ghara ikwu kpọmkwem ma nke mbụ ọ bụ ụlọ, ala, ókèala, ma ọ bụ ihe ndị ọzọ bụ nke ya.
translation_notes:
  register: Ejiri Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. “N’ebe bụ nke ya” na “ndị nke ya” na-eme ka ọdịiche dị n’ụdị okwu Grik abụọ ahụ pụta ìhè n’enweghị ịmanye otu nkọwa okpukpe kpọmkwem.
