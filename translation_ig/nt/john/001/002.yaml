- from: Onye a nọ ná mmalite ya na Chineke[a].
  to: Ná mmalite, Onye a nọ ya na Chineke[a].
  rationale: The revision changes only word order. Fronting “Ná mmalite” ensures that “ya na Chineke” is read together as the relational phrase corresponding to πρὸς τὸν θεόν, without adding theological interpretation. The footnote is conformed to the same unambiguous syntax.
