id: JHN.1.2
reference: John 1:2
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οὗτος ἦν ἐν ἀρχῇ πρὸς τὸν θεόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/002.yaml
  text: He was in the beginning with God[a].
translation:
  language: ig
  text: Ná mmalite, Onye a nọ ya na Chineke[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Ná mmalite, ọ nọ ya na Chineke.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτος
  choice: Onye a
  rationale: N’ebe a, οὗτος na-arụtụ aka azụ n’Okwu ahụ e kwuru banyere ya n’amaokwu 1. “Onye a” na-edobe ike ngosipụta nke okwu Grik ahụ ma na-ada nke ọma n’Igbo.
- source_word: ἦν
  choice: nọ
  rationale: ἦν bụ imperfect nke εἰμί ma na-egosi ọnọdụ na-aga n’ihu. “Nọ” bụ ụzọ Igbo si ekwu ọnọdụ nke ịdị na mmadụ ọzọ; o kwekọrọ nke ọma na nkebiokwu “na Chineke.”
- source_word: ἐν ἀρχῇ
  choice: ná mmalite
  rationale: “Ná mmalite” na-edobe nkwughachi doro anya nke Jenesis 1:1 nakwa otu e si jiri nkebiokwu ahụ na Jọn 1:1–2.
- source_word: πρὸς
  choice: ya na
  rationale: N’ọnọdụ a, πρός na-egosi ịdị nso na mmekọrịta, ma na-edobekwa ọdịiche dị n’etiti Okwu ahụ na Chineke. “Ya na” bụ ụzọ Igbo dị ndụ na nke okike si kwuo “with” n’ahịrịokwu a.
- source_word: τὸν θεόν
  choice: Chineke
  rationale: Ọ bụ ezie na Grik nwere article, Igbo anaghị achọ ka a sụgharịa ya iche n’ebe a. “Chineke” na-egosi onye okwu ahụ na-arụtụ aka na ya n'ụzọ doro anya.
theological_decisions:
- issue: Onye οὗτος na-arụtụ aka na ya na Jọn 1:1
  choice: A sụgharịrị ya “Onye a,” nke na-arụtụ aka azụ n’Okwu ahụ.
  alternative: “Ọ”
  rationale: “Onye a” na-echekwa ụdị ngosipụta nke οὗτος ma ghara itinye nkọwa ozizi ọzọ karịa ihe dị n’ederede.
- issue: Ike nke πρὸς τὸν θεόν
  choice: A sụgharịrị ya “ya na Chineke,” nke na-egosi mmekọrịta na ọdịiche.
  alternative: “n’ihu Chineke” ma ọ bụ “chere ihu n’ebe Chineke nọ”
  rationale: “Ya na Chineke” bụ okwu Igbo kachasị eke ma dị nkenke; ọ na-echekwa ịdị nso na mmekọrịta ahụ n’enweghị ịkọwa kpọmkwem ihe banyere ọdịdị ha nke ederede n’onwe ya na-akọwaghị.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị ùgwù ma dị mfe nghọta. E ji “Onye a” chekwaa ntụaka ngosipụta nke οὗτος, ebe “Ọ” dị n’ala peeji dịka nsụgharị ọzọ dị eke.
