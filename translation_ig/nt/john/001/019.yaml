revisions:
- from: Nke a bụkwa akaebe Jọn gbara, mgbe ndị Juu[a] si na Jerusalem ziga ndị nchụàjà na ndị Livaị ka ha jụọ ya, “Ị bụ onye?”
  to: Nke a bụ akaebe Jọn gbara mgbe ndị Juu[a] si na Jerusalem zipụrụ ndị nchụàjà na ndị Livaị ka ha jụọ ya, “Ị bụ onye?”
  rationale: The revision removes an unwarranted additive nuance, uses a natural completed-past verb for the Greek aorist, and refines the explanatory footnote. It otherwise retains the draft’s faithful and natural renderings, including the ambiguity of οἱ Ἰουδαῖοι in the main text.
