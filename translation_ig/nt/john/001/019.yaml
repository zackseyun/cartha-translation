id: JHN.1.19
reference: John 1:19
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Καὶ αὕτη ἐστὶν ἡ μαρτυρία τοῦ Ἰωάννου ὅτε ⸀ἀπέστειλαν οἱ Ἰουδαῖοι ἐξ Ἱεροσολύμων ἱερεῖς καὶ Λευίτας ἵνα ἐρωτήσωσιν αὐτόν· Σὺ τίς εἶ;
base_translation:
  language: en
  yaml_path: translation/nt/john/001/019.yaml
  text: And this is the testimony of John[a], when the Jews sent priests and Levites from Jerusalem to ask him, “Who are you?”
translation:
  language: ig
  text: Nke a bụ akaebe Jọn gbara mgbe ndị Juu[a] si na Jerusalem zipụrụ ndị nchụàjà na ndị Livaị ka ha jụọ ya, “Ị bụ onye?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị ndú ndị Juu,” ma ọ bụ, “ndị Judia.” N’Oziọma Jọn, “ndị Juu” na-ezokarị aka karịsịa n’ebe ndị isi okpukpe nọ na Judia, ọ bụghị n’ebe ndị Juu niile nọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: μαρτυρία
  choice: akaebe Jọn gbara
  rationale: “Ịgba akaebe” bụ ụzọ Igbo si ekwu banyere mmadụ ikwupụta ihe ọ maara ma ọ bụ ihe ọ hụrụ; ọ na-echekwa echiche gbasara onye akaebe nke dị mkpa n’Oziọma Jọn.
- source_word: τοῦ Ἰωάννου
  choice: Jọn gbara
  rationale: E ji usoro a gosi na ọ bụ Jọn nyere akaebe ahụ, ọ bụghị na akaebe ahụ bụ naanị ihe e kwuru banyere Jọn.
- source_word: ὅτε
  choice: mgbe
  rationale: “Mgbe” na-egosi oge ihe a mere n’ụzọ doro anya ma kwekọọ n’usoro ahịrịokwu Grik.
- source_word: ἀπέστειλαν
  choice: ziga
  rationale: “Ziga” bụ okwu Igbo nkịtị na nke ziri ezi maka izipụ mmadụ ka ọ rụọ ọrụ.
- source_word: οἱ Ἰουδαῖοι
  choice: ndị Juu
  rationale: Nke a na-echekwa aha otu ndị ahụ dị n’ederede Grik; ihe e dere n’ala peeji na-akọwa na n’Oziọma Jọn ọ pụrụ ịpụta ndị isi okpukpe nọ na Judia karịsịa.
- source_word: ἐξ Ἱεροσολύμων
  choice: si na Jerusalem
  rationale: Nke a na-egosi ebe e si zipụ ndị nchụàjà na ndị Livaị.
- source_word: ἱερεῖς καὶ Λευίτας
  choice: ndị nchụàjà na ndị Livaị
  rationale: Aha ndị a na-edobe otu abụọ ahụ metụtara ọrụ ụlọ nsọ iche, dị ka ederede Grik si mee.
- source_word: ἵνα ἐρωτήσωσιν αὐτόν
  choice: ka ha jụọ ya
  rationale: Usoro a na-egosi nzube e ji zipụ ha ma na-ada ka Igbo ebumpụta ụwa.
- source_word: Σὺ τίς εἶ;
  choice: Ị bụ onye?
  rationale: Nke a bụ ajụjụ Igbo doro anya na nke ebumpụta ụwa nke na-enye otu ihe ajụjụ Grik ahụ pụtara.
theological_decisions:
- issue: Ndị okwu οἱ Ἰουδαῖοι na-ezo aka na ha n’Oziọma Jọn
  choice: E tinyere “ndị Juu” n’ederede isi, ma kọwaa ókè okwu ahụ nwere ike iru n’ala peeji.
  alternative: “ndị ndú ndị Juu” ma ọ bụ “ndị Judia”
  rationale: Nke a na-edobe okwu Grik n’ederede isi n’enweghị ịmanye otu nkọwa, ma na-egbochikwa nghọta na okwu ahụ ga-abụrịrị ndị Juu niile. N’ebe a, iziga ndị nchụàjà na ndị Livaị si Jerusalem na-egosi na ndị ọchịchị okpukpe nwere ike ịbụ ndị a na-ekwu maka ha.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. “Akaebe Jọn gbara” na-ada ka Igbo ebumpụta ụwa ma na-echekwa echiche iwu na nke onye akaebe dị na μαρτυρία. E tinyere akara ụdaolu ebe ọ na-enyere ọgụgụ aka.
