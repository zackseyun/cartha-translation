id: JHN.1.31
reference: John 1:31
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: κἀγὼ οὐκ ᾔδειν αὐτόν, ἀλλ’ ἵνα φανερωθῇ τῷ Ἰσραὴλ διὰ τοῦτο ἦλθον ἐγὼ ⸀ἐν ὕδατι βαπτίζων.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/031.yaml
  text: 'And I did not know him[a], but for this reason I came baptizing in water: that he might be revealed to Israel.'
translation:
  language: ig
  text: Mụ onwe m amaghịkwa ya[a], ma ihe mere m ji bịa na-eme baptizim n'ime mmiri bụ ka e kpughere ya nye Izrel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “amataghị m onye ọ bụ.” Okwu Grik ahụ nwere ike ịpụta ma amaghị mmadụ ma ọ bụ amataghị onye ọ bụ; isi ederede ji okwu sara mbara mee ihe.
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀγὼ
  choice: Mụ onwe m ... kwa
  rationale: Na-egosipụta njikọ καί na nkwusi ike dị n’ἐγώ n’ụzọ Igbo dị mma.
- source_word: οὐκ ᾔδειν αὐτόν
  choice: amaghị ya
  rationale: Na-echekwa okwu sara mbara banyere amaghị onye ahụ, n’akọwaghị ma ọ bụ enweghị mmekọrịta onwe onye ka ọ bụ enweghị ịmata onye ọ bụ.
- source_word: ἀλλ’
  choice: ma
  rationale: Na-egosipụta ọdịiche dị n’etiti amaghị ya na nzube ozi Jọn.
- source_word: ἵνα φανερωθῇ
  choice: bụ ka e kpughere ya
  rationale: Na-echekwa nzube ἵνα na ụdị nnara-eme nke φανερωθῇ.
- source_word: τῷ Ἰσραὴλ
  choice: nye Izrel
  rationale: Na-enye dative ahụ n’ụzọ Igbo eke ma na-echekwa Izrel dịka aha mkpokọta.
- source_word: διὰ τοῦτο
  choice: ihe mere ... bụ
  rationale: Usoro Igbo eke nke na-egosi ihe kpatara/nzube e kwuru n’ihu.
- source_word: ἦλθον ἐγὼ
  choice: m ji bịa
  rationale: Na-enye aorist ahụ dịka omume gara aga, ebe nnọchiaha dị na κἀγὼ eburula nkwusi ike.
- source_word: ἐν ὕδατι
  choice: n'ime mmiri
  rationale: Na-echekwa nkọwa kpọmkwem nke ἐν ὕδατι ma ghara ime ka ọ bụrụ naanị ngwa e ji eme ihe.
- source_word: βαπτίζων
  choice: na-eme baptizim
  rationale: Na-egosipụta omume na-aga n’ihu nke participle ahụ n’oge ọ bịara, ma ghara ikpebi ụdị baptizim karịa ihe ederede kwuru.
theological_decisions:
- issue: Ihe Jọn bu n’obi mgbe ọ sịrị na ọ maghị Jizọs
  choice: amaghị ya
  alternative: amataghị m onye ọ bụ; amaghị m na ọ bụ Mezaya
  rationale: Okwu Grik ahụ nwere ike izo aka n’enweghị ihe ọmụma ma ọ bụ n’enweghị ịmata onye ahụ nke ọma. Isi ederede na-ahapụ mgbagwoju anya ahụ ka ọ dị, kama ịtinye nkọwa kwekọrọ n’otu ozizi.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị ùgwù ma doo ndị nkịtị anya. E ji “baptizim” mee ihe dịka okwu okpukpe a maara nke ọma; “n'ime mmiri” na-echekwa ụdị okwu Grik.
