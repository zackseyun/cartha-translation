  text: πάντα δι’ αὐτοῦ ἐγένετο, καὶ χωρὶς αὐτοῦ ἐγένετο οὐδὲ ἕν. ὃ γέγονεν
base_translation:
  language: en
  yaml_path: translation/nt/john/001/003.yaml
  text: All things came into being through him[a], and apart from him not even one thing came into being that has come into being.
translation:
  language: ig
  text: Ihe niile sitere na ya malitere ịdị adị; ma e wezụga ya, ọ dịghịkwa ọbụna otu n’ihe niile maliterela ịdị adị.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πάντα
  choice: Ihe niile
  rationale: Ọ na-egosi ihe niile n’uju ma na-echekwa oke echiche ahụ gbasara ihe niile e kere eke.
- source_word: δι’ αὐτοῦ
  choice: sitere n’aka ya
  rationale: N’Igbo nkịtị, nke a na-egosi na ọ bụ site na ya ka ihe niile jiri dịrị, ma ọ naghị eme ka okwu ahụ bụrụ naanị ọrụ aka.
- source_word: ἐγένετο
  choice: dịrị
  rationale: N’ebe a, ngwaa ahụ pụtara ịmalite ịdị adị; “dịrị” na-ekwupụta nke a n’ụzọ dị mfe ma dị ùgwù.
- source_word: χωρὶς αὐτοῦ
  choice: ma e wezụga ya
  rationale: Ọ na-egosi nkewapụ na enweghị ya, ma na-akwado nkwupụta na ọ dịghị ihe malitere ịdị n’onwe ya.
- source_word: οὐδὲ ἕν
  choice: ọ dịghị ọbụna otu ihe
  rationale: Nke a na-echekwa ike nkwusi okwu dị na οὐδὲ ἕν, karịa naanị ịsị “ọ dịghị ihe.”
- source_word: ὃ γέγονεν
  choice: n’ihe niile dịworo
  rationale: E jikọtara nkebiokwu a na amaokwu nke 3 dịka ntụpọ e nyere si dị; “dịworo” na-egosikwa ihe malitere ịdị ma ka so n’ihe dị adị.
theological_decisions:
- issue: Njikọ nkebiokwu ikpeazụ ὃ γέγονεν
  choice: 'E jikọtara ya na amaokwu nke 3: “ọ dịghị ọbụna otu ihe dịrị n’ihe niile dịworo.”'
  alternative: 'A pụrụ iji ya malite amaokwu nke 4: “Ihe dịworo nwere ndụ n’ime ya.”'
  rationale: Ihe odide Grik mbụ enweghị ntụpọ nke na-ekpebi njikọ ahụ kpamkpam. Njikọ ya na amaokwu nke 3 na-emesi ike na ihe niile sitere n’Okwu ahụ dịrị; e debere ụzọ ọzọ n’ala ala peeji ka e wee ghara ikpochapụ nghọtahie ziri ezi dị na isi mmalite.
translation_notes:
  register: Asụsụ Igbo izugbe, nke dị ugbu a ma dị ùgwù. E ji “sitere n’aka ya dịrị” mee ka echiche nke agency na ịmalite ịdị adị doo anya n’enweghị ịtụnye nkọwa ụka pụrụ iche.
