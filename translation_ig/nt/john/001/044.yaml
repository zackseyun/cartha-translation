id: JHN.1.44
reference: John 1:44
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἦν δὲ ὁ Φίλιππος ἀπὸ Βηθσαϊδά, ἐκ τῆς πόλεως Ἀνδρέου καὶ Πέτρου.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/044.yaml
  text: Philip was from Bethsaida[a], from the town of Andrew and Peter.
translation:
  language: ig
  text: Filip si na Betsaida[a], bụ́ obodo Andru na Pita si na ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “site n'obodo Andru na Pita,” ya bụ, obodo ha si.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν
  choice: si
  rationale: Ọ bụ imperfect nke εἰμί nke na-egosi ebe Filip si; n'Igbo, “si” bụ ụzọ kacha pụta ihe ma bụrụkwa nke ebumpụta ụwa isi kọwaa ebe mmadụ si.
- source_word: δὲ
  choice: (ahapụrụ ya n'ekwughị ya kpọmkwem)
  rationale: δέ bụ njikọ dị nro. N'amaokwu a, ịhapụ ya na-eme ka Igbo na-aga nke ọma n'enweghị itinye echiche nke ọdịiche siri ike ma ọ bụ okwu oge na-adịghị na isi mmalite.
- source_word: Φίλιππος
  choice: Filip
  rationale: E depụtara aha mmadụ a n'ụdị a na-ejikarị eme ihe n'Igbo.
- source_word: ἀπὸ Βηθσαϊδά
  choice: si na Betsaida
  rationale: ἀπό na-egosi ebe mmadụ si. “Si na Betsaida” bụ Igbo doro anya ma kwekọọ na isi mmalite.
- source_word: ἐκ τῆς πόλεως
  choice: bụ́ obodo
  rationale: πόλις nwere ike ịbụ obodo ukwu ma ọ bụ obodo nta. “Obodo” na-edobe obosara ihe okwu Grik ahụ nwere ike ịpụta; “bụ́” na-egosi na nkebi nke abụọ na-akọwakwu Betsaida.
- source_word: Ἀνδρέου καὶ Πέτρου
  choice: Andru na Pita si na ya
  rationale: Genitive ndị a na-egosi njikọ nke obodo ahụ na Andru na Pita, ya bụ, ebe ha si. Ịkọwapụta ya otú a bụ Igbo ebumpụta ụwa ma na-ezere ahịrịokwu na-edoghị anya dịka “obodo Andru na Pita.”
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo Standard dị ugbu a, dị ùgwù ma dị mfe nghọta. E debere nkwughachi echiche ebe mmadụ si, ma e mere nkebi nke abụọ ka ọ bụrụ nkọwa Betsaida n'ụzọ Igbo na-ada nke ọma.
