- from: Andru, nwanne Saịmọn Pita, bụ otu n’ime mmadụ abụọ ahụ nụrụ ihe Jọn kwuru ma soro ya.[a]
  to: Andru, nwanne Saịmọn Pita, bụ otu n’ime mmadụ abụọ ahụ nụrụ n’aka Jọn ma soro ya.[a]
  rationale: The revision removes the added object “ihe ... kwuru” and renders παρὰ Ἰωάννου directly as “n’aka Jọn.” It preserves the source sequence, the partitive expression “otu n’ime mmadụ abụọ ahụ,” and the Greek pronoun’s contextual but unstated antecedent.
