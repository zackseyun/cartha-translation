source:
  edition: SBLGNT
  text: ἦν Ἀνδρέας ὁ ἀδελφὸς Σίμωνος Πέτρου εἷς ἐκ τῶν δύο τῶν ἀκουσάντων παρὰ Ἰωάννου καὶ ἀκολουθησάντων αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/john/001/040.yaml
  text: Andrew[a], Simon Peter’s brother, was one of the two who had heard from John and followed him.
translation:
  language: ig
  text: Andru, nwanne Saịmọn Pita, bụ otu n’ime mmadụ abụọ ahụ nụrụ n’aka Jọn ma soro ya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ya” na-ezo aka na Jizọs, dịka ihe gbara amaokwu a gburugburu si gosi.
    reason: pronoun_referent
lexical_decisions:
- source_word: ἦν
  choice: bụ
  rationale: Ọ bụ ngwaa njikọ na-akọwapụta onye Andru bụ n’etiti mmadụ abụọ ahụ; “bụ” bụ ụzọ Igbo nkịtị si egosipụta nke a.
- source_word: Ἀνδρέας
  choice: Andru
  rationale: E degharịrị aha onye ahụ n’ụdị a na-ejikarị akpọ ya n’Igbo.
- source_word: ὁ ἀδελφὸς Σίμωνος Πέτρου
  choice: nwanne Saịmọn Pita
  rationale: “Nwanne” na-egosi mmekọrịta ezinụlọ ahụ, ebe usoro a bụ nke dị mfe ma bụrụkwa Igbo a na-asụ ugbu a.
- source_word: εἷς ἐκ τῶν δύο
  choice: otu n’ime mmadụ abụọ ahụ
  rationale: Nke a na-echekwa echiche nkewa ahụ kpọmkwem ma mee ka o doo anya na a na-ekwu banyere mmadụ abụọ.
- source_word: τῶν ἀκουσάντων
  choice: nụrụ ihe ... kwuru
  rationale: N’Igbo, ịsị na mmadụ “nụrụ ihe Jọn kwuru” na-enye echiche nke ịnụ ozi si n’aka Jọn n’ụzọ eke, na-agbakwụnyeghị ọdịnaya ozi ahụ.
- source_word: παρὰ Ἰωάννου
  choice: ihe Jọn kwuru
  rationale: παρά ya na genitive na-egosi ebe ozi ahụ si; ntụgharị a na-egosi na ihe ha nụrụ sitere n’ọnụ Jọn, n’ejighị aha ọzọ kọwaa Jọn.
- source_word: καὶ ἀκολουθησάντων αὐτῷ
  choice: ma soro ya
  rationale: “Soro” bụ ntụgharị kpọmkwem ma dị eke nke ἀκολουθέω; “ya” na-echekwa nnọchiaha Grik n’agbanyeghị na akụkọ gbara ya gburugburu na-egosi onye a na-ekwu maka ya.
theological_decisions:
- issue: Onye αὐτῷ (“ya”) na-ezo aka na ya
  choice: E debere “ya” n’ahịrịokwu bụ isi; ihe gbara amaokwu ahụ gburugburu na-egosi na ọ bụ Jizọs.
  alternative: Ịkpọ Jizọs aha kpọmkwem, ma ọ bụ ịghọta ya dị ka Jọn.
  rationale: Na Jọn 1:35–39, mmadụ abụọ ahụ nụrụ okwu Jọn, mesịa soro Jizọs. Ide “ya” na-echekwa ụdị okwu Grik ma ghara itinye aha na-adịghị n’ahịrịokwu isi mmalite.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke oge a, dị ùgwù ma dị mfe nghọta. E ji “mmadụ abụọ ahụ” mee ka ntụaka ahụ doo anya, ma e debere nnọchiaha “ya” iji chekwaa usoro na obere oghere ntụaka dị n’asụsụ Grik.
