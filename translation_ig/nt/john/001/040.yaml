review_pass:
  verdict: revise
  source_fidelity: The draft correctly identifies Andrew as Simon Peter’s brother and one of two people who heard from John and followed Jesus. However, “nụrụ ihe Jọn kwuru” explicitly supplies an object (“what John said”) that is not present in the Greek. The source simply says that they heard “from John”; this should be retained without adding content.
  naturalness: The sentence is clear, modern Standard Igbo, and appropriately dignified. “Nụrụ n’aka Jọn” is a natural concise way to retain the source’s unspecified object while expressing that John was the source.
  terminology: “Andru,” “Saịmọn Pita,” “nwanne,” and “soro ya” are suitable. The pronoun “ya” appropriately preserves the Greek wording; its contextual reference to Jesus is correctly clarified in a footnote.
  issues:
  - severity: medium
    issue: The phrase “ihe Jọn kwuru” adds an explicit object to ἀκουσάντων παρὰ Ἰωάννου.
    rationale: Although hearing John’s words is contextually likely, the Greek does not state “what John said.” “Nụrụ n’aka Jọn” preserves the elliptical construction and avoids unnecessary specification.
  revised_text: Andru, nwanne Saịmọn Pita, bụ otu n’ime mmadụ abụọ ahụ nụrụ n’aka Jọn ma soro ya.[a]
