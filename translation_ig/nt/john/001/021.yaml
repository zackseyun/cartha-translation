language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἠρώτησαν αὐτόν· Τί οὖν; ⸂σὺ Ἠλίας εἶ⸃; καὶ λέγει· Οὐκ εἰμί. Ὁ προφήτης εἶ σύ; καὶ ἀπεκρίθη· Οὔ.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/021.yaml
  text: And they asked him[a], “What then? Are you Elijah?” And he says, “I am not.” “Are you the Prophet?” And he answered[b], “No.”
translation:
  language: ig
  text: Ha jụrụ ya, “Gịnịzi? Ị bụ Ịlaịja?” Ọ sịrị[b], “Abụghị m.” Ha jụkwara ya, “Ị bụ Onye Amụma ahụ[a]?” Ọ zara, “Mba.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “Onye Amụma ahụ a na-atụ anya ya.” O yikarịrị ka ọ na-ekwu maka onye amụma dị ka Mosis, onye e kwuru okwu banyere ya na Diuterọnọmi 18:15, 18.
    reason: alternative_reading
  - marker: b
    text: N’asụsụ Grik, e ji oge ugbu a kwuo ya, “ọ na-asị,” dịka ụzọ e si eme ka akụkọ dị ndụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠρώτησαν
  choice: Ha jụrụ ya
  rationale: Nke a bụ okwu Igbo nkịtị ma doo anya maka ịjụ mmadụ ajụjụ; ọ naghị agbakwunye echiche nke ịgba ya ajụjụ ike.
- source_word: Τί οὖν;
  choice: Gịnịzi?
  rationale: “-zi” na-egosi na ajụjụ a na-esochi ihe a ka kwuchara, ma na-echekwa nkenke na ịdị ngwa nke okwu Grik.
- source_word: σὺ Ἠλίας εἶ
  choice: Ị bụ Ịlaịja?
  rationale: Ọ bụ usoro ajụjụ sitere n'okike n'Igbo. E dere aha Ἠλίας dịka Ịlaịja, dịka omenala nsụgharị aha Baịbụl n'Igbo si dị.
- source_word: Οὐκ εἰμί
  choice: Abụghị m
  rationale: Ọ na-echekwa azịza dị mkpirikpi ma sie ike, na-etinyeghị okwu ọzọ Grik na-enweghị.
- source_word: Ὁ προφήτης
  choice: Onye Amụma ahụ
  rationale: “Ahụ” na-egosi otu onye a maara ma ọ bụ onye a na-atụ anya ya, dịka njirimara aha dị na Grik si egosi, kama ime ya onye amụma ọ bụla.
- source_word: λέγει
  choice: Ọ sịrị
  rationale: Ọ bụ ezie na Grik ji oge ugbu a mee akụkọ ahụ ka ọ dị ndụ, “ọ sịrị” bụ ụzọ nkịtị na nke doro anya e si akọ ụdị mkparịta ụka a n'Igbo.
- source_word: ἀπεκρίθη
  choice: Ọ zara
  rationale: Nke a bụ okwu Igbo ziri ezi na nke nkịtị maka inye azịza.
- source_word: Οὔ
  choice: Mba
  rationale: Ọ bụ azịza Igbo kwụụrụ onwe ya nke na-ajụ ihe a jụrụ kpamkpam.
theological_decisions:
- issue: Onye “Onye Amụma ahụ” bụ
  choice: E debere ya dịka “Onye Amụma ahụ” n'akwụkwọ bụ isi.
  alternative: Ịkọwa ya ozugbo dịka onye amụma yiri Mosis nke Diuterọnọmi 18:15, 18, ma ọ bụ dịka onye amụma nkịtị.
  rationale: Njirimara aha Grik na-egosi onye pụrụ iche a na-atụ anya ya, ma amaokwu ahụ akọwaghị ya ọzọ. Nsụgharị ahụ hapụrụ njirimara ya n'enweghị idozi ihe ederede ahụ hapụrụ ghe oghe.
- issue: Ọjụjụ Jọn jụrụ na ọ bụghị Ịlaịja
  choice: A sụgharịrị ya ozugbo dịka “Abụghị m.”
  alternative: Ịgbakwunye na ihe ọ pụtara bụ na ọ bụghị Ịlaịja n'anụ ahụ, ma ọ bụ ime ka okwu a kwekọọ n'ụzọ akọwara ya n'akụkụ Akwụkwọ Nsọ ndị ọzọ.
  rationale: Ihe odide a nyere ọjụjụ Jọn n'ụzọ doro anya. A naghị etinye nkọwa sitere n'akụkụ ndị ọzọ n'ime okwu ya.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe nghọta ma nwee ugwu, dee ya. E chekwara nkenke nke ajụjụ na azịza ndị ahụ. A tinyere akara nkọwa [a] n'akụkụ “Onye Amụma ahụ” na [b] n'akụkụ “Ọ sịrị,” ebe nkọwa nke ọ bụla metụtara kpọmkwem.
