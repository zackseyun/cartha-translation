revisions:
- from: Jizọs hụrụ Nataniel ka ọ na-abịakwute ya, wee kwuo banyere ya, “Lee, onye Izrel n’ezie, onye aghụghọ na-adịghị n’ime ya.”
  to: Jizọs hụrụ Nataniel ka ọ na-abịakwute ya, wee kwuo banyere ya, “Lee, onye Izrel n’ezie, onye na-enweghị aghụghọ n’ime ya.”
  rationale: The revision retains the source’s compact commendation and ambiguity regarding what makes Nathanael a true Israelite, while removing an Igbo grammatical ambiguity in the rendering of “in whom there is no deceit.”
  reviewer_model: gpt-5.6-terra
