  text: εἶδεν ⸀ὁ Ἰησοῦς τὸν Ναθαναὴλ ἐρχόμενον πρὸς αὐτὸν καὶ λέγει περὶ αὐτοῦ· Ἴδε ἀληθῶς Ἰσραηλίτης ἐν ᾧ δόλος οὐκ ἔστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/047.yaml
  text: Jesus saw Nathanael coming toward him and said about him, “Look, truly an Israelite in whom there is no deceit.”
translation:
  language: ig
  text: Jizọs hụrụ Nataniel ka ọ na-abịakwute ya, wee kwuo banyere ya, “Lee, onye Izrel n’ezie, onye na-enweghị aghụghọ n’ime ya.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἴδε
  choice: Lee
  rationale: Ọ bụ okwu a na-eji adọta uche onye na-ege ntị; ‘Lee’ bụ nsụgharị Igbo doro anya ma dị ndụ.
- source_word: ἀληθῶς Ἰσραηλίτης
  choice: onye Izrel n’ezie
  rationale: Nke a na-edobe ike nke ἀληθῶς ma na-asụ ya n’usoro Igbo sitere n’okike.
- source_word: δόλος
  choice: aghụghọ
  rationale: ‘Aghụghọ’ na-egosi echiche nke ụzọ aghụghọ, iduhie mmadụ, ma ọ bụ enweghị ezi obi nke okwu Grik a nwere.
theological_decisions:
- issue: Ihe okwu Jizọs banyere onye Izrel pụtara
  choice: Edobere okwu ahụ kpọmkwem dịka otuto Jizọs nyere Nataniel, n’enweghị nkọwa ọzọ.
  alternative: Ịkọwa ya dị ka onye Izrel ‘n’ezie’ n’ụzọ ime mmụọ ma ọ bụ dị ka ntụaka pụrụ iche nye Jekọb.
  rationale: Amaokwu ahụ n’onwe ya anaghị akọwa ihe ndị ahụ hoo haa; nsụgharị ahụ ekwesịghị idozi ntụpọ nkọwa ahụ site n’itinye ozizi ọzọ.
translation_notes:
  register: Asụsụ Igbo Izugbe dị ugbu a, dị ùgwù ma dị mfe nghọta. E jiri ‘Jizọs’ na ‘Nataniel’ dịka ụdị aha ndị a na-ahụkarị n’Igbo, ma debe usoro okwu ahụ ka ọ daa nke ọma n’ọnụ onye Igbo.
