reference: John 1:15
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: (Ἰωάννης μαρτυρεῖ περὶ αὐτοῦ καὶ κέκραγεν λέγων· Οὗτος ἦν ⸂ὃν εἶπον⸃· Ὁ ὀπίσω μου ἐρχόμενος ἔμπροσθέν μου γέγονεν, ὅτι πρῶτός μου ἦν·)
base_translation:
  language: en
  yaml_path: translation/nt/john/001/015.yaml
  text: John testifies about him and has cried out[a], saying, “This was he of whom I said, ‘The one coming after me has become before me[b], because he was before me.’”
translation:
  language: ig
  text: Jọn na-agba ama banyere ya ma tiela mkpu, sị, “Ọ bụ onye a ka m kwuru banyere ya, sị, ‘Onye na-abịa n’azụ m aghọọla onye bu m ụzọ[a], n’ihi na ọ nọ tupu m[b].’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịtụgharị ya, “eburula m ụzọ” ma ọ bụ “akarịala m.” Okwu Grik ahụ nwere ike igosi ịdị n’ihu n’usoro ma ọ bụ ịdị elu n’ọkwa, ọ bụghị naanị usoro oge.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịtụgharị ya, “ọ dị adị tupu m.” ‘Ọ nọ tupu m’ na-esochi okwu Grik ahụ nso karị, ma ihe gbara amaokwu ahụ gburugburu na-enye ohere ịghọta ya dịka ịdị adị tupu Jọn.
    reason: alternative_reading
lexical_decisions:
- source_word: μαρτυρεῖ
  choice: na-agba ama
  rationale: Oge ugbu a dị n’okwu Grik na-egosi akaebe Jọn dị ka ihe na-aga n’ihu ma ọ bụ dị ndụ n’akụkọ ahụ; ‘na-agba ama’ bụ okwu Igbo doro anya nke na-echekwa echiche onye akaebe.
- source_word: περὶ αὐτοῦ
  choice: banyere ya
  rationale: Nke a bụ ntụgharị Igbo nkịtị ma doo anya maka περί na genitive n’ebe a.
- source_word: κέκραγεν
  choice: o tiela mkpu
  rationale: Ụdị perfect dị na Grik na-egosi mkpu e tiri nke mmetụta ya ka dị; ‘o tiela mkpu’ na-anwa ichekwa nke a n’Igbo n’enweghị ịgbatị okwu.
- source_word: Οὗτος ἦν ὃν εἶπον
  choice: Onye a bụ onye ahụ m kwuru banyere ya
  rationale: Nke a na-ejikọta onye a a na-ekwu maka ya na onye Jọn kwuru maka ya na mbụ, n’ụzọ dị mma n’Igbo. E ji ‘bụ’ mee ka ahịrịokwu ahụ bụrụ Igbo ebumpụta ụwa, ebe ‘onye ahụ’ na-echekwa ntụaka gara aga.
- source_word: Ὁ ὀπίσω μου ἐρχόμενος
  choice: Onye na-abịa n’azụ m
  rationale: Ọ na-echekwa echiche onye na-abịa mgbe Jọn gasịrị, ma ghara ikpebi ma okwu ahụ bụ naanị banyere oge ma ọ bụ usoro ozi.
- source_word: ἔμπροσθέν μου γέγονεν
  choice: abụrụla onye nọ n’ihu m
  rationale: ‘Abụrụla’ na-egosipụta perfect nke γίνομαι, ebe ‘n’ihu m’ na-echekwa asụsụ ntụnyere nke nwere ike ịpụta ibute ụzọ, ịbụ onye ka elu n’ọkwa, ma ọ bụ ịdị n’ihu.
- source_word: ὅτι
  choice: n’ihi na
  rationale: Ọ na-ewebata ihe kpatara nkwupụta bu ya ụzọ n’Igbo doro anya.
- source_word: πρῶτός μου ἦν
  choice: ọ nọ tupu m
  rationale: Nke a na-echekwa okwu Grik n’ụzọ dị nso ma hapụ ka ihe gbara amaokwu ahụ gburugburu gosi echiche ịdị adị tupu Jọn, kama itinye nkọwa ahụ kpọmkwem n’ime isi okwu.
theological_decisions:
- issue: Otu a ga-esi gosipụta πρῶτός μου ἦν n’ihe gbasara ịdị adị Kraịst tupu Jọn
  choice: ọ nọ tupu m
  alternative: ọ dịrị adị tupu m
  rationale: Amaokwu ahụ na-egosi nke ukwuu na Kraịst dịrị adị tupu Jọn nakwa na ọ karịrị ya, ma ‘ọ nọ tupu m’ na-echekwa mkpirikpi na nghọta sara mbara nke okwu Grik. Ọ naghị etinye nkọwa nkà mmụta okpukpe karịa ihe e dere, ma ọ naghị egbochi nghọta nke ịdị adị tupu ụwa.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A zere okwu ụka pụrụ iche. Usoro okwu ahụ na-echekwa ọdịiche dị n’etiti ‘n’azụ m,’ ‘n’ihu m,’ na ‘tupu m,’ nke bụ isi n’echiche na mgbagwoju anya nke okwu Grik.
