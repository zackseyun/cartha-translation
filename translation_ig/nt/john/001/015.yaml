revisions:
- from: Jọn na-agba ama banyere ya; o tiela mkpu sị, “Onye a bụ onye ahụ m kwuru banyere ya, sị, ‘Onye na-abịa n’azụ m abụrụla onye nọ n’ihu m[a], n’ihi na ọ nọ tupu m[b].’”
