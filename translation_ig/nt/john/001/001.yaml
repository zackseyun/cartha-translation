  text: Ἐν ἀρχῇ ἦν ὁ λόγος, καὶ ὁ λόγος ἦν πρὸς τὸν θεόν, καὶ θεὸς ἦν ὁ λόγος.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/001.yaml
  text: In the beginning was the Word[a], and the Word was with God[b], and the Word was God.
translation:
  language: ig
  text: Na mbido[b], Okwu ahụ dị; Okwu ahụ nọkwa na Chineke, Okwu ahụ bụkwa Chineke[a].
  philosophy: optimal-equivalence
  footnotes: &id001
  - marker: a
    text: A pụkwara ịsụgharị ya, “Okwu ahụ nwere agwa Chineke,” ma ọ bụ, “Ihe Chineke bụ, ka Okwu ahụ bụ.” N’usoro okwu Grik, “Chineke” n’akụkụ ikpeazụ na-akọwa agwa Okwu ahụ; ọ na-egosi na Okwu ahụ bụ Chineke, ma na-eme ka Okwu ahụ dị iche na “Chineke” e kwuru banyere ya n’akụkụ gara aga.
    reason: alternative_reading
  - marker: b
    text: Okwu mmalite a na-eme ka a cheta Jenesis 1:1, na-ejikọta Okwu ahụ na mmalite okike.
    reason: cross_reference
lexical_decisions:
- source_word: Ἐν ἀρχῇ
  choice: Na mbido
  rationale: Ọ bụ okwu Igbo doro anya ma dịkwa ugwu nke na-echekwa nkwughachi Jenesis 1:1 na echiche banyere mmalite okike.
- source_word: ἦν
  choice: dị / nọ / bụ
  rationale: 'A sụgharịrị otu ngwaa Grik ahụ n''ụzọ kwekọrọ n''ọrụ ya n''ahịrịokwu Igbo ọ bụla: “dị” maka ịdị adị, “nọ” maka ịnọnyere onye ọzọ, na “bụ” maka ihe a na-ekwu banyere ọdịdị Okwu ahụ. Nke a na-eme ka Igbo bụrụ ihe e ji ọnụ ekwu n''ụzọ nkịtị n''emebighị isi okwu Grik.'
- source_word: ὁ λόγος
  choice: Okwu ahụ
  rationale: “Okwu” na-echekwa echiche nke okwu e kwuru, mkpughe, na aha e ji akọwa onye ahụ n'amaokwu a; “ahụ” na-egosi na ọ bụ onye ma ọ bụ ihe a kapịrị ọnụ.
- source_word: πρὸς τὸν θεόν
  choice: na Chineke nọ
  rationale: N'Igbo, usoro a na-egosi na Okwu ahụ na Chineke nọkọrọ ma bụrụ onye dị iche na ya, n'etinyeghị nkọwa karịrị ihe Grik kwuru.
- source_word: τὸν θεόν
  choice: Chineke
  rationale: “Chineke” bụ aha Igbo zuru ebe niile maka God, ọ dịghịkwa mkpa itinye mkpụrụokwu ọzọ n'ihu ya iji gosi na ọ bụ onye a kapịrị ọnụ.
- source_word: θεὸς ἦν ὁ λόγος
  choice: Okwu ahụ bụkwa Chineke
  rationale: Usoro a na-ekwupụta ọdịdị zuru ezu nke Okwu ahụ dịka Chineke, ma ahịrịokwu gara aga ka na-egosi ọdịiche dị n'etiti Okwu ahụ na Chineke onye ya na ya nọ. “Bụkwa” na-ejikọta nkeji ikpeazụ ahụ nke ọma na nke gara aga.
theological_decisions:
- issue: Otu e si sụgharịa θεός na-enweghị artịkụl n'okwu ikpeazụ
  choice: Okwu ahụ bụkwa Chineke
  alternative: Okwu ahụ nwere ọdịdị Chineke; ma ọ bụ, Ihe Chineke bụ, ka Okwu ahụ bụ
  rationale: θεός dị n'ihu ngwaa ma na-akọwa ụdị ma ọ bụ ọdịdị Okwu ahụ. Nsụgharị bụ isi na-ekwupụta n'ụzọ doro anya na Okwu ahụ bụ Chineke, ebe nkọwa ala peeji na-echekwa nghọta banyere ọdịdị ahụ ma ghara ime ka Okwu ahụ na Chineke onye e kwuru banyere ya n'okwu gara aga bụrụ otu onye.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị mfe nghọta ma nwee ugwu, dee ya. E tinyere akara ụdaolu ebe ha bara uru n'ịgụ ihe nke ọma. Akara [b] dị n'akụkụ “Na mbido,” ebe nkọwa ya metụtara; akara [a] dị n'akụkụ okwu ikpeazụ banyere ọdịdị Okwu ahụ.
