id: JHN.1.13
reference: John 1:13
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οἳ οὐκ ἐξ αἱμάτων οὐδὲ ἐκ θελήματος σαρκὸς οὐδὲ ἐκ θελήματος ἀνδρὸς ἀλλ’ ἐκ θεοῦ ἐγεννήθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/013.yaml
  text: who were born, not from bloods, nor from the will of the flesh, nor from the will of a man, but from God.
translation:
  language: ig
  text: ndị a mụrụ, ọ bụghị site n'ọbara[a], ọ bụghịkwa site n'ọchịchọ nke anụ ahụ, ọ bụghịkwa site n'ọchịchọ nke nwoke, kama site na Chineke.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’asụsụ Grik, “ọbara” dị n’ụdị ọtụtụ. Nke a bụ okwu pụrụ iche nke na-ezo aka n’usoro ọmụmụ ebumpụta ụwa ma ọ bụ n’ịmụ mmadụ site n’aka nne na nna.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἳ
  choice: ndị
  rationale: Nnọchiaha njikọ a na-ezo aka n’ebe ndị a kpọrọ aha n’amaokwu gara aga nọ, ma na-edobe njikọ ahịrịokwu Grik ahụ n’ụzọ Igbo na-anabata.
- source_word: ἐξ αἱμάτων
  choice: site n'ọbara dị iche iche
  rationale: αἱμάτων dị n’ụdị ọtụtụ, nke bụ okwu pụrụ iche na-ezo aka n’agbụrụ mmadụ maọbụ n’ịmụ mmadụ site n’aka nne na nna. Nsụgharị a na-edobe ihe pụrụ iche nke ụdị ọtụtụ ahụ, ebe nkọwa ala peeji na-enye nghọta ya n’ụzọ doro anya.
- source_word: θελήματος
  choice: ọchịchọ
  rationale: “Ọchịchọ” na-egosi ọchịchọ maọbụ uche na-akpali mmadụ ime ihe, ma na-enyekwa ohere idobe usoro okwu ahụ e kwughachiri ugboro abụọ.
- source_word: σαρκὸς
  choice: anụ ahụ
  rationale: “Anụ ahụ” na-edobe ihe σάρξ pụtara n'ụzọ nkịtị ebe a. N’ọnọdụ a, ọ na-ezo aka n’ọchịchọ ebumpụta ụwa nke metụtara ịmụ nwa, ọ bụghị kpọmkwem echiche banyere ọdịdị mmehie.
- source_word: ἀνδρὸς
  choice: nwoke
  rationale: ἀνήρ ebe a na-ezo aka n’otu nwoke toro eto na ọrụ nwoke n’ịmụ nwa; “nwoke” na-edobe otu onye na akụkụ nwoke nke okwu ahụ.
- source_word: ἐκ θεοῦ
  choice: site na Chineke
  rationale: Nke a na-egosi isi mmalite ma na-edobe ọdịiche dị n’etiti ụzọ mmadụ si amụ mmadụ na ọmụmụ nke sitere na Chineke.
- source_word: ἐγεννήθησαν
  choice: a mụrụ
  rationale: Nke a bụ ụzọ Igbo dị ugbu a na nke a na-aghọta ngwa ngwa si kwuo passive γεννάω n’ọnọdụ a, n’enweghị iji okwu ochie maọbụ nke siri ike.
theological_decisions:
- issue: Ọdịiche dị n’etiti mmalite sitere n’aka mmadụ na nke sitere na Chineke
  choice: Amaokwu ahụ na-ekwu na ọmụmụ maọbụ mmalite nke ndị a esiteghị n’agbụrụ mmadụ, n’ọchịchọ anụ ahụ, maọbụ n’ọchịchọ nwoke, kama o sitere na Chineke.
  alternative: A pụrụ ịghọta okwu ahụ naanị dị ka ịjụ na agbụrụ mmadụ maọbụ agbụrụ Izrel bụ ihe na-enye mmadụ ọnọdụ a.
  rationale: Ịjụ ihe ugboro atọ n’usoro ahụ na-eme ka ọmụmụ mmadụ n’ụzọ ebumpụta ụwa dị iche na ọmụmụ sitere na Chineke. Nsụgharị ahụ anaghị agbakwụnye ozizi otu ụka banyere otú ọmụmụ ọhụrụ a si eme.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, dị ugwu ma dị mfe nghọta. E debere usoro nkwughachi nke Grik na ọdịiche dị n’etiti “anụ ahụ,” “nwoke,” na “Chineke,” ma tinye nkọwa ala peeji maka okwu pụrụ iche “ọbara” n’ụdị ọtụtụ.
