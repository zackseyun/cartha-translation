revisions:
- from: ndị a mụrụ, ọ bụghị site n'ọbara dị iche iche[a], maọbụ site n'ọchịchọ nke anụ ahụ, maọbụ site n'ọchịchọ nke nwoke, kama site na Chineke.
  to: ndị a mụrụ, ọ bụghị site n'ọbara[a], ọ bụghịkwa site n'ọchịchọ nke anụ ahụ, ọ bụghịkwa site n'ọchịchọ nke nwoke, kama site na Chineke.
  rationale: The revision removes the added sense ‘different kinds,’ retains the source’s marked plural through a concise footnote, and represents each Greek οὐδέ with an explicit successive negation. It maintains the verse’s ambiguity about the precise force of ‘bloods’ while preserving the contrast between ordinary human generation and origin from God.
  reviewer_model: gpt-5.6-terra
