  edition: SBLGNT
  text: εὑρίσκει οὗτος ⸀πρῶτον τὸν ἀδελφὸν τὸν ἴδιον Σίμωνα καὶ λέγει αὐτῷ· Εὑρήκαμεν τὸν Μεσσίαν (ὅ ἐστιν μεθερμηνευόμενον χριστός).
base_translation:
  language: en
  yaml_path: translation/nt/john/001/041.yaml
  text: He first found his own brother Simon and said to him[a], “We have found the Messiah” (which means Messiah).
translation:
  language: ig
  text: Ọ buru ụzọ chọta nwanne ya nwoke, Saịmọn, ma sị ya, “anyị achọtala Mesaya”[a] (nke a sụgharịrị ịbụ “Kraịst”).
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Mesaya” bụ okwu sitere n’asụsụ Hibru/Arameik; “Kraịst” bụ okwu Grik kwekọrọ na ya. Ha abụọ pụtara “onye e tere mmanụ.”
    reason: Na-akọwa njikọ dị n’etiti taitul Semitik na okwu Grik e ji sụgharịa ya, n’enweghị ihichapụ ọdịiche ahụ n’ahịrịokwu bụ isi.
lexical_decisions:
- source_word: εὑρίσκει
  choice: ịchọta
  rationale: Oge ugbu a e ji akọ akụkọ n’asụsụ Grik ka e gosiri n’ụzọ na-adabara akụkọ Igbo, n’usoro ‘Ihe mbụ ọ mere bụ ịchọta...’
- source_word: οὗτος
  choice: ọ
  rationale: Okwu nrụtụaka a na-ezo aka n’Andru n’amaokwu ndị gbara ya gburugburu; nnọchiaha ‘ọ’ bụ ụzọ Igbo si ekwu ya nke ọma.
- source_word: πρῶτον
  choice: Ihe mbụ ọ mere
  rationale: Nke a na-echekwa echiche nke ihe mere na mbụ ma na-ada nke ọma n’Igbo.
- source_word: ἀδελφὸν τὸν ἴδιον
  choice: nwanne ya nwoke
  rationale: ‘Nwanne ... nwoke’ na-egosi kpọmkwem na ọ bụ nwanne nwoke ya; ‘ya’ na-egosikwa mmekọrịta ahụ nke ἴδιον mesiri ike.
- source_word: Σίμωνα
  choice: Saịmọn
  rationale: A sụgharịghị aha mmadụ; e dere ya n’ụdị mkpụrụokwu na ụda Igbo.
- source_word: λέγει αὐτῷ
  choice: Ọ sịrị ya
  rationale: A gbanwere oge ugbu a e ji akọ akụkọ n’asụsụ Grik ka ọ bụrụ oge gara aga nke na-adabara akụkọ Igbo, na-enweghị ịgbakwunye nkọwa.
- source_word: Εὑρήκαμεν
  choice: Anyị achọtala
  rationale: Ụdị ngwaa zuru oke na-egosi nchọpụta e mere nke nsonaazụ ya ka dị ugbu a; ‘achọtala’ na-ebute echiche ahụ nke ọma.
- source_word: Μεσσίαν
  choice: Mesaya
  rationale: Nke a bụ ide aha/taitul Semitik ahụ n’ụdị ụda Igbo, na-echekwa ọnọdụ ndị Juu nke okwu ahụ.
- source_word: μεθερμηνευόμενον
  choice: nke a sụgharịrị bụ
  rationale: Nke a na-egosi n’ụzọ doro anya na onye dere akwụkwọ na-enye okwu Grik nke kwekọrọ n’okwu Semitik ahụ.
- source_word: χριστός
  choice: Kraịst
  rationale: 'E ji ụdị aha Grik ahụ e dere n’ụda Igbo chekwaa ọrụ nkọwa dị n’ahịrịokwu ahụ: ‘Mesaya’ bụ nke a sụgharịrị n’asụsụ Grik ịbụ ‘Kraịst.’'
theological_decisions:
- issue: Otu e si mee ka ọdịiche dị n’etiti Μεσσίας na χριστός pụta ìhè
  choice: “Mesaya” ... “Kraịst”
  alternative: “Mesaya” ... “Onye E Tere Mmanụ”
  rationale: Ihe odide Grik na-enye χριστός dị ka ntụgharị nke Μεσσίας, ọ bụghị naanị dị ka nkọwa echiche ya. Iji ‘Mesaya’ na ‘Kraịst’ na-echekwa ọdịiche asụsụ ahụ; ihe odide ala peeji na-akọwa ihe ha abụọ pụtara.
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe dị ugbu a, dị mfe nghọta ma dịkwa nsọpụrụ. E kewara ahịrịokwu mbụ ụzọ abụọ ka akụkọ ahụ doo anya n’Igbo, ebe e chekwara usoro ihe mere na mbụ na nkọwa dị n’ime akara nkuchi.
