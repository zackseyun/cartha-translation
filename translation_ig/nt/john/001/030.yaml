id: JHN.1.30
reference: John 1:30
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οὗτός ἐστιν ⸀ὑπὲρ οὗ ἐγὼ εἶπον· Ὀπίσω μου ἔρχεται ἀνὴρ ὃς ἔμπροσθέν μου γέγονεν, ὅτι πρῶτός μου ἦν·
base_translation:
  language: en
  yaml_path: translation/nt/john/001/030.yaml
  text: This is he of whom I said[a], ‘After me comes a man who ranks before me[b], because he was before me.’
translation:
  language: ig
  text: Ọ bụ onye a ka m kwuru banyere ya[a], sị, ‘Otu nwoke na-abịa n’azụ m, onye dị m n’ihu[b], n’ihi na ọ nọ tupu m.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ya bụ, onye a ka okwu m kwuru metụtara.
    reason: clarification
  - marker: b
    text: A pụkwara ịsụgharị ya, ‘onye ka m elu n’ọkwa.’ Okwu Grik ahụ nwere ike igosi onye nọ n’ihu ma ọ bụ onye nwere ọnọdụ ka elu.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτός ἐστιν
  choice: Ọ bụ onye a
  rationale: 'Nke a na-egosipụta njirimara e mesiri ike: Jọn na-akọwapụta onye ọ na-ekwu banyere ya.'
- source_word: ὑπὲρ οὗ ἐγὼ εἶπον
  choice: ka m kwuru banyere ya
  rationale: N’usoro okwu a, ὑπὲρ οὗ pụtara onye okwu ahụ metụtara; ‘banyere ya’ bụ Igbo doro anya ma kwekọọ na isi mmalite.
- source_word: Ὀπίσω μου ἔρχεται
  choice: na-abịa n’azụ m
  rationale: ‘N’azụ m’ na-edobe ihe oyiyi Grik ahụ ma nwee ike igosi usoro oge—onye na-abịa mgbe Jọn gasịrị.
- source_word: ἀνὴρ
  choice: otu nwoke
  rationale: ἀνήρ na-akọwa nwoke kpọmkwem; ‘otu nwoke’ bụ nsụgharị nkịtị na nke doro anya.
- source_word: ἔμπροσθέν μου γέγονεν
  choice: onye dị m n’ihu
  rationale: Perfect γέγονεν na-egosi ọnọdụ ọ nọ na ya ugbu a. ‘Dị m n’ihu’ na-echekwa ohere nghọta nke ịbụ onye bu ụzọ ma ọ bụ onye ka elu, n’ebughị ụzọ kpebie naanị otu n’ime ha.
- source_word: ὅτι
  choice: n’ihi na
  rationale: Ọ na-egosi ihe kpatara okwu bu ya ụzọ.
- source_word: πρῶτός μου ἦν
  choice: ọ dị adị tupu m
  rationale: N’ọnọdụ a, πρῶτός μου ἦν na-egosi na ọ nọworị tupu Jọn. ‘Dị adị tupu m’ na-eme ka ihe gbasara ịdị adị tupu ọmụmụ Jọn doo anya, ebe nkọwa ala peeji na-echekwa nsụgharị dị mkpụmkpụ karị.
theological_decisions:
- issue: Otu a ga-esi gosipụta na Kraịst dị adị tupu Jọn n’ahịrị ikpeazụ
  choice: ọ dị adị tupu m
  alternative: ọ nọ tupu m
  rationale: Ihe gbara amaokwu a gburugburu n’Oziọma Jọn na-akwado ịdị adị Jizọs tupu Jọn. Nhọrọ a na-ekwupụta echiche oge nke ahịrị ikpeazụ n’Igbo nkịtị, ma nkọwa ala peeji na-edebe ụdị okwu dị mkpụmkpụ nke nwere ntakịrị oghere nghọta.
- issue: Ma ahịrị etiti ahụ ọ̀ bụ banyere ọkwa ka ọ bụ banyere ịbụ onye bu ụzọ
  choice: onye dị m n’ihu
  alternative: onye ka m elu n’ọkwa
  rationale: ἔμπροσθέν μου γέγονεν nwere ike ịkọwa ịbụ onye nọ n’ihu ma ọ bụ onye nwere ọnọdụ ka elu. Nsụgharị bụ isi na-echekwa mgbagwoju anya ahụ; nkọwa ala peeji na-enye nghọta nke ọkwa.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. A họọrọ ‘onye dị m n’ihu’ iji chekwaa esemokwu dị n’etiti usoro oge na ịdị elu n’ọkwa; e zere itinye nkọwa ụka pụrụ iche.
