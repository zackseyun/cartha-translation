  to: Ọ bụ onye a ka m kwuru banyere ya[a], sị, ‘Otu nwoke na-abịa n’azụ m, onye dị m n’ihu[b], n’ihi na ọ nọ tupu m.’
  rationale: Only the final clause is revised. “Ọ nọ tupu m” corresponds more closely to the compact wording of πρῶτός μου ἦν (“he was before me”) and avoids making explicit a conclusion that the Greek wording itself leaves compact, while still allowing the temporal-priority sense to be heard in context. The existing footnote anchors and lexical alternative remain correctly placed.
