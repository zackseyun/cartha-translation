  text: ⸀ὁ ὀπίσω μου ⸀ἐρχόμενος, οὗ ⸂οὐκ εἰμὶ⸃ ἄξιος ἵνα λύσω αὐτοῦ τὸν ἱμάντα τοῦ ὑποδήματος.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/027.yaml
  text: the one coming after me[a], whose sandal strap I am not worthy to untie.
translation:
  language: ig
  text: onye ahụ na-abịa n’azụ m, onye m na-erughị eru ịtọpụ eriri akpụkpọ ụkwụ ya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'N’ụzọ ọzọ, nke dị nso n’usoro okwu Grik: “onye m na-erughị eru ka m tọpụ eriri akpụkpọ ụkwụ ya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ὀπίσω μου ἐρχόμενος
  choice: onye ahụ na-abịa n’azụ m
  rationale: Nkebi a na-arụ ọrụ dị ka aha ma na-ezo aka n’otu onye a kapịrị ọnụ. “Na-abịa n’azụ m” na-edobe echiche nke onye na-esochi Jọn n’usoro oge, na-enweghị ịgbakwụnye nkọwa banyere ịdị elu ya nke amaokwu a ekwughị kpọmkwem.
- source_word: οὗ
  choice: onye ... ya
  rationale: N’Igbo, njikọ “onye ... ya” na-egosi mmekọrịta nke nnọchiaha genitive n’ụzọ eke karịa ntụgharị okwu n’otu n’otu.
- source_word: οὐκ εἰμὶ ἄξιος
  choice: m na-erughị eru
  rationale: “Erughị eru” na-egosi na Jọn ahụghị onwe ya dị ka onye kwesịrị ekwesị ịrụ ọrụ ahụ, ma na-edobe ịdị umeala n’obi dị n’okwu Grik.
- source_word: ἵνα λύσω
  choice: ịtọpụ
  rationale: Mgbe okwu banyere iru eru gachara, infinitive Igbo “ịtọpụ” na-enye echiche nke omume a na-atụle n’ụzọ doro anya ma dịkwa eke.
- source_word: ἱμάντα
  choice: eriri
  rationale: “Eriri” bụ okwu Igbo doro anya maka eriri e ji kechie ma ọ bụ jide akpụkpọ ụkwụ.
- source_word: τοῦ ὑποδήματος
  choice: akpụkpọ ụkwụ
  rationale: “Akpụkpọ ụkwụ” bụ okwu ndị Igbo nke oge a na-aghọta nke ọma maka footwear; n’ime njikọ “eriri akpụkpọ ụkwụ,” ọ na-enye ihe oyiyi sandal nke oge ahụ n’enweghị okwu arụrụ arụ.
theological_decisions:
- issue: Mmekọrịta nke “n’azụ m” na onye ahụ na-abịa
  choice: 'A sụgharịrị ya dịka iso n’usoro oge: “na-abịa n’azụ m.”'
  alternative: na-esochi m n’azụ
  rationale: N’okwu Jọn, onye ahụ na-abịa na-esochi ya n’usoro ọrụ. Nsụgharị a anaghị etinye n’amaokwu a echiche zuru ezu banyere ịdị elu onye ahụ nke a kọwara n’amaokwu ndị gbara ya gburugburu.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A hapụrụ ahịrịokwu ahụ dịka nkebi na-aga n’ihu site n’okwu gbara ya gburugburu, dịka ọ dị n’ebe e si nweta ya; e tinyebeghị isiokwu ma ọ bụ nkọwa na-adịghị na Grik.
