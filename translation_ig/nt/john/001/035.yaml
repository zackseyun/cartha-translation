  source_fidelity: The translation accurately represents the temporal expression (Τῇ ἐπαύριον), the repetition signaled by πάλιν, John’s standing posture, and the partitive expression “two of his disciples.” The supplied relational sense in “ya na mmadụ abụọ...” is a natural way to express the Greek’s elliptical coordination without adding material meaning.
