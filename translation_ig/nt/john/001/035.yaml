source:
  edition: SBLGNT
  text: Τῇ ἐπαύριον πάλιν εἱστήκει ⸀ὁ Ἰωάννης καὶ ἐκ τῶν μαθητῶν αὐτοῦ δύο,
base_translation:
  language: en
  yaml_path: translation/nt/john/001/035.yaml
  text: On the next day[a], John was standing there again, and two of his disciples were with him.
translation:
  language: ig
  text: N’echi ya[a], Jọn guzokwa ebe ahụ, ya na mmadụ abụọ n’ime ndị na-eso ụzọ ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ: “N’echi ya, Jọn guzokwa, mmadụ abụọ n’ime ndị na-eso ụzọ ya anọnyekwa ebe ahụ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τῇ ἐπαύριον
  choice: N’echi ya
  rationale: Akpaalaokwu oge a pụtara ‘n’ụbọchị sochirinụ.’ ‘N’echi ya’ bụ ụzọ dị mfe ma bụrụkwa nke a na-eji eme ihe n’Igbo iji jikọta akụkọ a na nke gara aga.
- source_word: πάλιν
  choice: ọzọ
  rationale: Ọ na-egosi na ọnọdụ a mere ọzọ dịka n’akụkọ bu ụzọ; e jikọtara ya na ngwaa dịka ‘guzokwa’ ka ọ daa nke ọma n’Igbo.
- source_word: εἱστήκει
  choice: guzokwa ebe ahụ
  rationale: Ụdị ngwaa a na-akọwa ọnọdụ Jọn nọ na ya n’oge ahụ. ‘Guzokwa ebe ahụ’ na-egosi ọnọdụ na-aga n’ihu, ebe ‘ebe ahụ’ bụ ihe agbakwunyere iji mee ka okwu ahụ zuo oke n’Igbo.
- source_word: ὁ Ἰωάννης
  choice: Jọn
  rationale: Nke a bụ ụdị aha John a na-ejikarị eme ihe n’Igbo. E tinyeghị ‘Onye Na-eme Baptizim’ n’ihi na isiokwu Grik kwuru naanị aha ya.
- source_word: καὶ
  choice: ya na
  rationale: N’ọnọdụ a, ‘ya na’ na-ejikọta Jọn na mmadụ abụọ ahụ n’ụzọ nkịtị n’Igbo, ma na-edebe njikọ dị mfe nke Grik.
- source_word: ἐκ τῶν μαθητῶν αὐτοῦ δύο
  choice: mmadụ abụọ n’ime ndị na-eso ụzọ ya
  rationale: ‘N’ime’ na-edebe echiche partitive nke ἐκ, ebe ‘ndị na-eso ụzọ’ bụ okwu Igbo doro anya maka μαθηταί. Nhazi ‘ya na’ na-egosi na mmadụ abụọ ahụ nọnyere ya n’agbanyeghị na Grik ekwughachighị ngwaa.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo Izugbe dị ugbu a, dị ùgwù ma dị mfe nghọta. A họọrọ nhazi ‘ya na’ ka ahịrịokwu ahụ daa nke ọma n’Igbo, ebe ihe odide Grik hapụrụ ngwaa nke akụkụ nke abụọ ka a ghọta ya site n’ọnọdụ akụkọ.
