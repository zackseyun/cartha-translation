  text: ἐν αὐτῷ ζωὴ ἦν, καὶ ἡ ζωὴ ἦν τὸ φῶς τῶν ἀνθρώπων·
base_translation:
  language: en
  yaml_path: translation/nt/john/001/004.yaml
  text: In him was life[a], and the life was the light of men.
translation:
  language: ig
  text: N’ime ya ka ndụ dị, ndụ ahụ bụkwa ìhè nke mmadụ niile.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ìhè nke ụmụ mmadụ” ma ọ bụ “ìhè nke ndị mmadụ.” Okwu Grik a na-ezo aka n’ụmụ mmadụ niile n’ozuzu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν αὐτῷ
  choice: n’ime ya
  rationale: Nkọwa a na-edobe echiche preposition ἐν nke pụtara ‘n’ime,’ ebe ‘ya’ na-ezo aka n’Okwu ahụ e kwuru banyere ya n’amaokwu ndị bu ụzọ.
- source_word: ζωὴ
  choice: ndụ
  rationale: ‘Ndụ’ bụ ntụgharị kpọmkwem ma dị mfe nke ζωή; ọ na-ahapụkwa ka ihe gbara ya gburugburu gosipụta omimi echiche Jọn n’enweghị ịgbakwunye ‘ndụ ebighị ebi’ n’ebe a.
- source_word: ἦν
  choice: dị / bụ
  rationale: Imperfect nke εἰμί na-egosi ọnọdụ na-adị; n’ahịrịokwu Igbo, ‘dị’ dabara nke ọma na nkebi mbụ, ebe ‘bụ’ na-egosipụta njirimara dị na nkebi nke abụọ.
- source_word: ἡ ζωὴ
  choice: ndụ ahụ
  rationale: ‘Ahụ’ na-egosipụta na ndụ a bụ otu ndụ ahụ a kpọtụrụ aha ozugbo, si otú a na-edobe ike anaphoric nke article Grik.
- source_word: τὸ φῶς
  choice: ìhè
  rationale: ‘Ìhè’ bụ ntụgharị nkịtị nke φῶς ma na-edobe ihe atụ dị mkpa n’okwu mmalite Jọn.
- source_word: τῶν ἀνθρώπων
  choice: nke mmadụ niile
  rationale: ἄνθρωποι ebe a na-ezo aka n’ụmụ mmadụ n’ozuzu, ọ bụghị naanị ndị nwoke. ‘Mmadụ niile’ bụ Igbo eke na nghọta, ma ‘nke’ na-edobe njikọ genitive karịa ịsụgharị ya dịka ‘maka.’
theological_decisions:
- issue: Ihe αὐτῷ na-ezo aka na ụdị onye ọ na-egosi
  choice: A sụgharịrị ya dịka ‘ya,’ na-ezo aka n’Okwu ahụ dị ka onye.
  alternative: Ịghọta ya dịka ihe na-abụghị onye ma ọ bụrụ na e were λόγος naanị dịka echiche nkịtị.
  rationale: Ihe gbara amaokwu a gburugburu na-akọwa Okwu ahụ n’ụzọ onye, ma ntụgharị a anaghị etinye okwu ozizi ọzọ na-adịghị n’amaokwu ahụ.
- issue: Nkọwa zuru mmadụ niile nke ἀνθρώπων
  choice: A sụgharịrị ya ‘mmadụ niile,’ ya bụ ụmụ mmadụ n’ozuzu.
  alternative: ‘Ndị mmadụ’ ma ọ bụ, n’ụzọ na-erughị nghọta ebe a, ‘ndị nwoke.’
  rationale: Masculine plural nke Grik nwere ntụaka generic n’ebe a. Igbo ‘mmadụ niile’ na-eme ka ntụaka ahụ doo anya n’enweghị ikwu na ọ bụ naanị ndị nwoke.
- issue: Njikọ ndụ na ìhè
  choice: E debere okwu njirimara ahụ dịka ‘ndụ ahụ bụkwa ìhè,’ n’enweghị ịkọwa ụdị ndụ ma ọ bụ ìhè ahụ ọzọ.
  alternative: Ịgbasa ya dịka ‘ndụ ebighị ebi’ ma ọ bụ ‘ìhè nke nzọpụta.’
  rationale: Isi mmalite kwuru naanị ζωή na φῶς. Ịhapụ ha dịka ‘ndụ’ na ‘ìhè’ na-echekwa obosara na omimi nkà mmụta okpukpe nke okwu Jọn.
translation_notes:
  register: Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. A họọrọ ‘Ndụ dị n’ime ya’ maka ịdị eke n’Igbo na ikwesị ntụkwasị obi nye ἐν αὐτῷ ζωὴ ἦν; ‘ndụ ahụ’ na-ejikọta nkebi abụọ ahụ nke ọma. E tinyere akara ala n’okwu ‘ìhè’ iji nyere ọgụgụ ziri ezi aka.
