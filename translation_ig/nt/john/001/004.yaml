- from: Ndụ dị n’ime ya, ndụ ahụ bụkwa ìhè nke mmadụ niile.[a]
  to: N’ime ya ka ndụ dị, ndụ ahụ bụkwa ìhè nke mmadụ niile.[a]
  rationale: A small word-order revision improves idiomatic Standard Igbo and more closely represents the Greek clause’s locative opening, while retaining all of the draft’s sound lexical and theological choices. The footnote remains anchored to “mmadụ niile,” the expression corresponding to Greek τῶν ἀνθρώπων.
