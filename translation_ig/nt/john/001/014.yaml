id: JHN.1.14
reference: John 1:14
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Καὶ ὁ λόγος σὰρξ ἐγένετο καὶ ἐσκήνωσεν ἐν ἡμῖν, καὶ ἐθεασάμεθα τὴν δόξαν αὐτοῦ, δόξαν ὡς μονογενοῦς παρὰ πατρός, πλήρης χάριτος καὶ ἀληθείας·
base_translation:
  language: en
  yaml_path: translation/nt/john/001/014.yaml
  text: And the Word became flesh and dwelt among us[a], and we saw his glory, glory as of the one and only Son from the Father[b], full of grace and truth.
translation:
  language: ig
  text: Okwu ahụ ghọrọ anụ ahụ, wee biri n’etiti anyị[a]. Anyị hụrụ ebube ya—ebube dịka nke Ọkpara nanị otu, onye si n’aka Nna bịa[b]—onye jupụtara n’amara na eziokwu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “maa ụlọikwuu ya n’etiti anyị”; ngwaa Grik ahụ na-echetara mmadụ onyinyo ụlọikwuu.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, “Ọkpara e mụrụ nanị ya”; ma ọ bụ, “Ọkpara pụrụ iche.”
    reason: alternative_reading
lexical_decisions:
- source_word: λόγος
  choice: Okwu ahụ
  rationale: Ọ na-edobe aha pụrụ iche Jọn ji akọwa onye ahụ, ma na-ejigide ọtụtụ nghọta dị n’okwu Grik karịa ‘ozi’ ma ọ bụ ‘uche’.
- source_word: σὰρξ
  choice: anụ ahụ
  rationale: Nke a na-egosi na Okwu ahụ ghọrọ mmadụ n’eziokwu, nwee ndụ mmadụ nke a pụrụ imetụ aka; ọ naghị eme ka okwu ahụ bụrụ naanị echiche banyere ‘ịdị mmadụ’.
- source_word: ἐγένετο
  choice: ghọrọ
  rationale: Ọ na-egosipụta mgbanwe e kwuru n’ahịrịokwu ahụ n’ụzọ doro anya ma bụrụkwa Igbo nkịtị.
- source_word: ἐσκήνωσεν ἐν ἡμῖν
  choice: biri n’etiti anyị
  rationale: Nke a bụ Igbo dị mfe ma dị ugbu a. E debere echiche ụlọikwuu nke dị n’okwu Grik n’ala ala peeji.
- source_word: ἐθεασάμεθα
  choice: Anyị hụkwara
  rationale: Ọ na-egosi ịhụ ihe n’onwe ha dị ka ndị akaebe, n’enweghị asụsụ ochie ma ọ bụ nke siri ike.
- source_word: δόξαν
  choice: ebube
  rationale: ‘Ebube’ bụ okwu Igbo a na-aghọta nke ọma, na-ejigide ịdị arọ nke okwu ahụ n’akwụkwọ Jọn.
- source_word: ὡς
  choice: dịka nke
  rationale: Ọ na-edobe ntụnyere dị na Grik, ma ọ naghị ekwu na ebube ahụ bụ naanị ihe yiri nke ahụ n’enweghị njikọ n’eziokwu.
- source_word: μονογενοῦς
  choice: Ọkpara nanị ya
  rationale: N’ọnọdụ a, okwu ahụ na-egosi nwa nke pụrụ iche, onye na-enweghị onye ọzọ dịka ya. ‘Ọkpara’ dabara na mmekọrịta ya na Nna, ebe nkọwa ala peeji na-edobe ụzọ nsụgharị ndị ọzọ.
- source_word: παρὰ πατρός
  choice: onye si n’aka Nna bịa
  rationale: Ọ na-egosi mmalite na mmekọrịta ya na Nna n’Igbo eke, ma na-edobe ‘Nna’ dịka aha a na-akpọ Chineke n’ọnọdụ a.
- source_word: πλήρης χάριτος καὶ ἀληθείας
  choice: onye jupụtara n’amara na eziokwu
  rationale: Ọ na-edobe okwu nkwekọrịta Akwụkwọ Nsọ ‘amara na eziokwu’ ma na-eme ka njikọ nkebiokwu ahụ doo anya n’Igbo.
theological_decisions:
- issue: Otu e si sụgharịa μονογενοῦς n’ebe a na-ekwu banyere Kraịst
  choice: Ọkpara nanị ya
  alternative: Ọkpara a mụrụ naanị ya; Ọkpara pụrụ iche
  rationale: Nhọrọ bụ isi na-egosi na ọ bụ naanị ya ma bụrụ onye pụrụ iche n’ebe Nna nọ, n’enweghị ịmanye okwu Grik ka ọ kọwaa usoro ọmụmụ. E debere nsụgharị ọdịnala na nke ọzọ n’ala ala peeji.
- issue: Ma a ga-etinye onyinyo ụlọikwuu n’ihu na ἐσκήνωσεν
  choice: biri n’etiti anyị
  alternative: maa ụlọikwuu ya n’etiti anyị
  rationale: Isi ederede na-eji Igbo a na-aghọta ngwa ngwa, ebe ala ala peeji na-edobe njikọ okwu ahụ nwere na ụlọikwuu ebe Chineke nọnyere ndị ya.
- issue: Onye πλήρης χάριτος καὶ ἀληθείας na-akọwa
  choice: onye jupụtara n’amara na eziokwu
  alternative: jupụtara n’amara na eziokwu
  rationale: N’asụsụ Grik, ‘jupụtara’ dị n’ụdị na-ezo aka n’onye nwoke ma jikọta ya na Okwu/Ọkpara ahụ. ‘Onye’ na-eme ka Igbo dị ụtọ n’enweghị ịgbanwe onye a na-ekwu maka ya.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. A hapụrụ okwu ndị dị mkpa dịka ‘Okwu,’ ‘anụ ahụ,’ ‘ebube,’ ‘amara,’ na ‘eziokwu’ n’ụdị ha siri ike n’Akwụkwọ Nsọ, ma zere okwu ụka nke otu okpukpe pụrụ iche.
