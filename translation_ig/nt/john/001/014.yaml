    text: Ma ọ bụ, “maa ụlọikwuu ya n’etiti anyị”; ngwaa Grik ahụ na-echetara mmadụ onyinyo ụlọikwuu.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, “Ọkpara e mụrụ nanị ya”; ma ọ bụ, “Ọkpara pụrụ iche.”
    reason: alternative_reading
  revision_rationale: The revision removes the added “also” sense from the witness clause, clarifies the Igbo expression for the unique Son, and refines the traditional alternative in footnote b. It otherwise retains the draft’s accurate terminology, modern register, and the tabernacle allusion in footnote a.
