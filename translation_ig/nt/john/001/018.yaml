id: JHN.1.18
reference: John 1:18
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: θεὸν οὐδεὶς ἑώρακεν πώποτε· ⸂μονογενὴς θεὸς⸃ ὁ ὢν εἰς τὸν κόλπον τοῦ πατρὸς ἐκεῖνος ἐξηγήσατο.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/018.yaml
  text: No one has ever seen God[a]; the one and only God, who is in the bosom of the Father[c][b], has made him known.
translation:
  language: ig
  text: Ọ dịghị onye hụtụrụla Chineke; Chineke ahụ pụrụ iche[a], onye nọ n’obi Nna[b], emeela ka a mata ya[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ụfọdụ ihe odide nwere “Ọkpara ahụ naanị ya” (ma ọ bụ “Ọkpara ahụ a mụrụ naanị ya”) kama “Chineke ahụ pụrụ iche.”
    reason: textual_variant
  - marker: b
    text: Ma ọ bụ, “n’akụkụ Nna.” Grik kwuru kpọmkwem “n’obi Nna,” nke na-egosi mmekọrịta chiri nnọọ anya.
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “akọwaala ya” ma ọ bụ “ekpugheela ya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: θεὸν
  choice: Chineke
  rationale: Ọ bụ ihe nnara nke ἑώρακεν, ọ na-ezo aka n’ebe Chineke nọ n’ụzọ zuru oke.
- source_word: οὐδεὶς ... πώποτε
  choice: Ọ dịghị onye ... hụtụrụla
  rationale: Usoro a bụ Igbo nkịtị nke na-egosipụta nkwụsi ike zuru ụwa ọnụ na echiche nke ‘mgbe ọ bụla ruo ugbu a.’
- source_word: ἑώρακεν
  choice: hụtụrụla
  rationale: Ụdị ngwaa a na-enye nghọta nke ihe a na-ahụbeghị ruo ugbu a; ‘hụtụrụla’ na-ebute nke ahụ n’Igbo dị ndụ.
- source_word: μονογενὴς θεὸς
  choice: Chineke ahụ pụrụ iche
  rationale: μονογενής n’ebe a na-egosi onye pụrụ iche, onye na-enweghị onye ọzọ dịka ya; θεός dị n’ihe odide SBLGNT, ya mere e jiri ‘Chineke’ dee isiokwu, ebe e debere ọdịiche ‘Ọkpara’ n’okpuru peeji.
- source_word: ὁ ὢν
  choice: onye nọ
  rationale: Nkebiokwu njikọ a na-akọwa onye ahụ a kpọrọ aha, ma ọ bụkwa ụzọ Igbo doro anya ma dị mfe.
- source_word: εἰς τὸν κόλπον τοῦ πατρὸς
  choice: n’obi Nna
  rationale: ‘N’obi’ na-echekwa ihe atụ nke κόλπος ma na-egosi mmekọrịta chiri anya; ‘n’akụkụ Nna’ dị n’okpuru peeji dịka ntụgharị ọzọ.
- source_word: πατρὸς
  choice: Nna
  rationale: Ọ bụ aha mmekọrịta a kapịrị ọnụ n’okwu Jọn, na-ezo aka na Chineke dịka Nna.
- source_word: ἐκεῖνος
  choice: onye ahụ (egosipụtara site n’isiokwu ahịrịokwu)
  rationale: Igbo achọghị ka e tinye nnọchiaha ọzọ mgbe isiokwu ahụ doro anya; iwepụ ya na-eme ka ahịrịokwu bụrụ nke okike n’enweghị iwepụ nkwusi ike nke onye a kpọrọ aha.
- source_word: ἐξηγήσατο
  choice: emeela ka a mata ya
  rationale: Nke a na-egosipụta ikpughe ma ọ bụ ime ka onye ọzọ mara Chineke, ọ bụghị naanị ịkọwa okwu banyere ya.
theological_decisions:
- issue: Ọdịiche ihe odide n’etiti μονογενὴς θεὸς na ὁ μονογενὴς υἱός
  choice: E soro SBLGNT dee ‘Chineke ahụ pụrụ iche’ n’isiokwu.
  alternative: ‘Ọkpara ahụ naanị ya’ ma ọ bụ ‘Ọkpara ahụ a mụrụ naanị ya.’
  rationale: Ederede isi mmalite e nyere nwere θεός. N’ihi mkpa ọdịiche a n’ihe gbasara onye Kraịst bụ, e zoochaghị ya; e gosiri ọgụgụ ọzọ n’okpuru peeji.
- issue: Ihe μονογενής pụtara
  choice: pụrụ iche
  alternative: a mụrụ naanị ya
  rationale: Ihe akaebe mkpụrụokwu na-akwado echiche nke onye pụrụ iche ma ọ bụ onye na-enweghị onye ọzọ dịka ya. Nhọrọ ọdịnala ‘a mụrụ naanị ya’ dị n’okpuru peeji ka a ghara ịmanye echiche ahụ n’ime mkpụrụokwu n’onwe ya.
- issue: Onye nnọchiaha dị na ‘ka a mata ya’ na-ezo aka na ya
  choice: E hapụrụ ‘ya’ dịka nnọchiaha na-ezo azụ n’ebe Chineke nọ.
  alternative: ‘emeela ka a mata Chineke’
  rationale: Nke a na-esochi nhazi Grik ma na-echekwa njikọ dị n’etiti Chineke onye a na-ahụbeghị na Onye pụrụ iche nke na-eme ka a mata ya.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. ‘N’obi Nna’ na-echekwa ihe atụ Grik n’enweghị okwu ochie siri ike; usoro ahịrịokwu ahụ na-ezere nnọchiaha ugboro abụọ nke na-adịghị ekwe omume nke ọma n’Igbo.
