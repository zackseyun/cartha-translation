id: JHN.1.12
reference: John 1:12
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὅσοι δὲ ἔλαβον αὐτόν, ἔδωκεν αὐτοῖς ἐξουσίαν τέκνα θεοῦ γενέσθαι, τοῖς πιστεύουσιν εἰς τὸ ὄνομα αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/john/001/012.yaml
  text: But to all who received him[a], he gave them the right to become children of God—to those who believe in his name,
translation:
  language: ig
  text: Ma ndị niile nabatara ya—ndị na-ekwere n’aha ya—ka o nyere ikike ịghọ ụmụ Chineke.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅσοι
  choice: ndị niile
  rationale: Ọ bụ okwu nrụtụ aka nke ọtụtụ mmadụ, nke pụtara mmadụ niile so n’otu a; “ndị niile” bụ Igbo doro anya ma na-echekwa echiche ahụ.
- source_word: δὲ
  choice: Ma
  rationale: Ọ na-egosi ọdịiche dị n’etiti ndị nabatara ya na ọjụjụ a kọwara n’amaokwu bu ụzọ.
- source_word: ἔλαβον αὐτόν
  choice: nabatara ya
  rationale: N’ebe a, λαμβάνω pụtara ịnabata ya, ọ bụghị ijide ya n’aka; “nabatara ya” bụ okwu Igbo sitere n’okwu ahụ ma dịkwa mfe nghọta.
- source_word: ἔδωκεν
  choice: o nyere
  rationale: Nke a bụ nsụgharị kwụ ọtọ nke δίδωμι ma na-egosi na ihe a bụ nke e nyere ha.
- source_word: ἐξουσίαν
  choice: ikike
  rationale: “Ikike” nwere ike igosi ikike e nyere mmadụ ma ọ bụ ikike o nwere ime ihe. Ọ dabara n’ebe a karịa “ike” naanị, nke pụrụ ịdị ka ume ma ọ bụ ike anụ ahụ; ihe odide ala peeji na-echekwa nghọta ndị ọzọ okwu Grik ahụ nwere.
- source_word: τέκνα θεοῦ
  choice: ụmụ Chineke
  rationale: τέκνα bụ okwu gbasara ụmụ n’ozuzu, ọ bụghị naanị ụmụ nwoke; “ụmụ Chineke” na-echekwa obosara ahụ.
- source_word: γενέσθαι
  choice: ịghọ
  rationale: Ọ na-egosi ịbanye n’ọnọdụ ọhụrụ, ọ bụghị naanị ịnọ n’ọnọdụ ahụ.
- source_word: τοῖς πιστεύουσιν
  choice: ndị kwere
  rationale: Ọ na-akọwa ndị ahụ dị ka ndị na-ekwere; “ndị kwere” bụ ụzọ Igbo dị mfe ma kwekọọ na ahịrịokwu a.
- source_word: εἰς τὸ ὄνομα αὐτοῦ
  choice: n’aha ya
  rationale: Nkebiokwu ahụ na-egosi okwukwe a tụkwasịrị n’onye ahụ dịka aha ya si ekpughe onye ọ bụ; “n’aha ya” na-echekwa okwu ὄνομα kama iwepụ ya.
theological_decisions:
- issue: Mmekọrịta dị n’etiti “nabatara ya” na “ndị kwere n’aha ya”
  choice: E debere okwu abụọ ahụ, were “ya bụ” gosi na nkebiokwu nke abụọ na-akọwakwu ndị a kpọrọ aha na nke mbụ.
  alternative: Ijikọ ha ka ha bụrụ naanị otu okwu, dịka “ndị nabatara ya site n’ikwere na ya.”
  rationale: Grik debere ἔλαβον αὐτόν na τοῖς πιστεύουσιν εἰς τὸ ὄνομα αὐτοῦ iche. Nsụgharị a na-echekwa ha abụọ ma ghara ikwu karịa ihe ederede kwuru banyere kpọmkwem mmekọrịta ha.
- issue: Ihe τέκνα θεοῦ pụtara
  choice: ụmụ Chineke
  alternative: ụmụ nwoke Chineke
  rationale: τέκνα gụnyere ụmụ n’agbanyeghị nwoke ma ọ bụ nwaanyị; ọ bụghị υἱοί, ya mere e kwesịghị ime ka okwu ahụ bụrụ nke ụmụ nwoke naanị.
- issue: Ihe ἐξουσίαν pụtara n’ebe a
  choice: ikike e nyere ha ịghọ ụmụ Chineke
  alternative: ike dị n’ime ha nke mere ka ha nwee ike ịghọ ụmụ Chineke
  rationale: Okwu ahụ nwere ike ịpụta ikike, ikike ọchịchị, ma ọ bụ ike ime ihe. Ihe gbara ya gburugburu na-egosi ihe Kraịst nyere ha, ma nsụgharị na ihe odide ala peeji anaghị emechi nghọta okwu ahụ n’otu ụzọ naanị.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe ma dị ùgwù. “Ya bụ” na-eme ka njikọ nkọwa dị n’ahịrịokwu ikpeazụ doo anya n’enweghị iwepụ okwu abụọ dị na Grik; akara ogologo (—) na-enyere onye na-agụ ya aka ịhụ nkọwa ahụ.
