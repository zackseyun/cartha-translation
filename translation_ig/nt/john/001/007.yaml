  naturalness: The final purpose clause is more natural in Standard Igbo as ‘ka mmadụ niile wee kwere site n’aka ya’ rather than placing the prepositional phrase before ‘kwere.’ The revised second footnote also uses more idiomatic Igbo for the alternative referential reading.
