  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οὗτος ἦλθεν εἰς μαρτυρίαν, ἵνα μαρτυρήσῃ περὶ τοῦ φωτός, ἵνα πάντες πιστεύσωσιν δι’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/007.yaml
  text: He came as a witness[a], so that he might testify about the Light[b], so that all might believe through him.
translation:
  language: ig
  text: Onye a bịara dị ka onye akaebe[a], ka o wee gbaa akaebe banyere Ìhè ahụ, ka mmadụ niile wee kwere site n’aka ya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Ọ bịara ka ọ gbaa akaebe banyere Ìhè ahụ.”
    reason: lexical_alternative
  - marker: b
    text: Ya bụ, site n’ịgba akaebe Jọn; ụfọdụ na-aghọta “ya” dịka onye na-ezo aka n’Ìhè ahụ kama.
    reason: alternative_reading
lexical_decisions:
- source_word: οὗτος
  choice: Onye a
  rationale: Nnọchiaha ngosi a na-atụ aka n’ụzọ doro anya n’ebe Jọn a kpọtụrụ aha n’amaokwu bu ụzọ nọ. “Onye a” na-echekwa ike ngosi ahụ ma bụrụkwa okwu Igbo e ji eme ihe n’ụzọ kwụ ọtọ.
- source_word: ἦλθεν
  choice: bịara
  rationale: Nke a bụ nsụgharị nkịtị na nke sitere n’okwu Grik ahụ kpọmkwem, ma na-echekwa mmegharị akụkọ ahụ.
- source_word: εἰς μαρτυρίαν
  choice: dị ka onye akaebe
  rationale: N’ebe a, nkebiokwu ahụ na-egosi ọrụ na nzube Jọn ji bịa. “Dị ka onye akaebe” bụ Igbo dị mfe nghọta ma na-echekwa echiche nke ịgba akaebe.
- source_word: ἵνα μαρτυρήσῃ
  choice: ka o wee gbaa akaebe
  rationale: “Ka o wee” na-egosipụta nzube nke ἵνα, ebe “gbaa akaebe” na-enye echiche nke ikwupụta ihe mmadụ maara dị ka onye akaebe.
- source_word: περὶ τοῦ φωτός
  choice: banyere Ìhè ahụ
  rationale: περί ya na genitive pụtara “banyere.” E dere “Ìhè” na mkpụrụedemede ukwu n’ihi na n’ọnọdụ a ọ na-arụ ọrụ dị ka aha na-atụ aka n’Onye ahụ, ọ bụghị naanị ìhè nkịtị.
- source_word: ἵνα πάντες πιστεύσωσιν
  choice: ka mmadụ niile wee ... kwere
  rationale: Nkebiokwu nzube nke abụọ ka e chekwara. “Mmadụ niile” na-egosipụta πάντες n’ụzọ doro anya na nke eke n’Igbo, ebe “kwere” bụ nsụgharị kwesịrị ekwesị nke πιστεύω n’ebe a.
- source_word: δι’ αὐτοῦ
  choice: site n’aka ya
  rationale: διά ya na genitive na-egosi ụzọ ma ọ bụ onye e ji mee ihe. “Site n’aka ya” bụ okwu Igbo eke nke na-echekwa echiche ahụ n’enweghị ịkọwa ihe karịrị ihe odide ahụ.
theological_decisions:
- issue: Onye okwu “ya” dị na δι’ αὐτοῦ na-ezo aka na ya
  choice: E debere “site n’aka ya” n’ahịrịokwu, ebe isi nghọta bụ na “ya” na-ezo aka na Jọn, onye akaebe ahụ.
  alternative: Ụfọdụ nwere ike ịghọta “ya” dịka nke na-ezo aka n’Ìhè ahụ.
  rationale: Jọn bụ isiokwu nke amaokwu ahụ, ọ bụkwa onye kacha nso okwu nnọchiaha ahụ n’usoro echiche; amaokwu na-esote na-ekewapụkwa Jọn n’Ìhè ahụ. Ma ebe ụdị okwu Grik ahụ n’onwe ya nwere ike ime ka e nwee nghọta ọzọ, e debere nke ahụ n’ala ala peeji kama ikpochapụ ya.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E chekwara nkebiokwu nzube abụọ nke Grik site n’iji “ka ... wee,” tinyere nkwughachi “akaebe” nke dị mkpa n’echiche amaokwu ahụ.
