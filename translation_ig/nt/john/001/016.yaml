  text: ⸀ὅτι ἐκ τοῦ πληρώματος αὐτοῦ ἡμεῖς πάντες ἐλάβομεν, καὶ χάριν ἀντὶ χάριτος·
base_translation:
  language: en
  yaml_path: translation/nt/john/001/016.yaml
  text: For from his fullness we have all received[a], and grace upon grace.
translation:
  language: ig
  text: N’ihi na site n’ụju ya ka anyị niile natara, na amara n’ọnọdụ amara.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “amara na-esochi amara,” ma ọ bụ “otu amara n’elu amara ọzọ.” Nkebi Grik ahụ nwere ike igosi amara ndị na-abịa n’usoro, otu onyinye na-esochi ibe ya, ọ bụ ezie na ἀντί pụtara n’ụzọ nkịtị karị “n’ọnọdụ (nke).”
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: N’ihi na
  rationale: Njikọ a na-enye ihe kpatara ma ọ bụ nkọwa maka okwu ndị bu ya ụzọ; “N’ihi na” na-egosipụta ọrụ ahụ nke ọma n’Igbo.
- source_word: ἐκ τοῦ πληρώματος αὐτοῦ
  choice: site n’uju ya
  rationale: “Uju” na-egosipụta izu oke ma ọ bụ ihe jupụtara eju, ebe “site na” na-egosi na ihe a natara sitere n’ebe ahụ.
- source_word: ἡμεῖς πάντες
  choice: anyị niile
  rationale: 'Nke a na-echekwa nkwusi ike dị n’aha nnọchiaha ahụ na πάντες: ọ metụtara anyị niile.'
- source_word: ἐλάβομεν
  choice: natara
  rationale: Oge gara aga dị mfe bụ ụzọ doro anya ma dịkwa mma n’Igbo isi kwupụta aorist a, n’enweghị ịmanye nkọwa oge ọzọ n’ime ya.
- source_word: καὶ
  choice: na
  rationale: “Na” na-ejikọta nkebi nke abụọ na nke mbụ n’ụzọ kwụ ọtọ, n’enweghị ikpebi ma ọ pụtara mgbakwunye ma ọ bụ nkọwa.
- source_word: χάριν ἀντὶ χάριτος
  choice: amara n’ọnọdụ amara
  rationale: ἀντί pụtara n’ụzọ bụ isi “n’ọnọdụ” ma ọ bụ “dochie.” Nsụgharị a na-echekwa ike okwu ahụ na esemokwu dị n’etiti nnọchi na amara na-esochi amara.
theological_decisions:
- issue: Ihe χάριν ἀντὶ χάριτος pụtara
  choice: amara n’ọnọdụ amara
  alternative: amara na-esochi amara; otu amara n’elu amara ọzọ
  rationale: Nkebi Grik a nwere ike igosi amara dochiri amara, ma ọ bụ amara na-abịa n’usoro, otu na-esochi ibe ya. Isi okwu ahụ na-edobe “n’ọnọdụ,” nke kwekọrọ nke ọma n’ike nkịtị nke ἀντί, ebe nkọwa ala peeji na-egosi nghọta ndị ọzọ n’enweghị idozi esemokwu ahụ n’otu ụzọ.
translation_notes:
  register: Ejiri Standard Igbo nke dị ugbu a, dị ùgwù ma dị mfe nghọta. E debere usoro okwu ahụ nkenke iji kwekọọ n’ụdị ahịrịokwu Grik, ebe nkọwa ala peeji na-eme ka nghọta ndị ọzọ pụta ìhè.
