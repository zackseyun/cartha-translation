  naturalness: 'A small orthographic correction is needed: Standard Igbo writes “ụju” (with underdot), not “uju,” for “fullness/abundance.” The sentence otherwise has a clear, dignified biblical register. The footnote anchor should follow the phrase it explains, not “natara.”'
  terminology: “Amara” is the established and suitable term for χάρις. “N’ọnọdụ amara” is a defensible literal rendering of ἀντί that avoids foreclosing the phrase’s interpretive ambiguity. The footnote should describe ἀντί as “n’ọnọdụ (nke)” rather than give the verbal gloss “dochie,” which is less exact in this construction.
