  text: καὶ ὡμολόγησεν καὶ οὐκ ἠρνήσατο, καὶ ὡμολόγησεν ὅτι ⸂Ἐγὼ οὐκ εἰμὶ⸃ ὁ χριστός.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/020.yaml
  text: And he confessed and did not deny[a], but confessed, “I am not the Messiah.”
translation:
  language: ig
  text: O kwupụtara n’ihu ọha, ọ gọnahụghịkwa; kama o kwupụtara, sị, “Ọ bụghị m bụ Mezaya[a] ahụ.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Kraịst ahụ.” Okwu Grik bụ Χριστός (Khristos). N’ebe a, ọ bụ aha ọkwa Mezaya ahụ ndị mmadụ na-atụ anya ya; ya mere, e ji “Mezaya” sụgharịa ya n’ahịrịokwu a.
    reason: alternative_reading
lexical_decisions:
- source_word: ὡμολόγησεν
  choice: kwupụtara ya hoo haa
  rationale: Nkebi a na-egosi nkwupụta doro anya e mere n’ihu ndị ọzọ. “Hoo haa” na-ebute echiche nke nkwupụta ọha, ebe ikwughachi “kwupụtara” na-echekwa nkwusi ike dị n’asụsụ Grik.
- source_word: οὐκ ἠρνήσατο
  choice: ọ gọnahụghịkwa ya
  rationale: “Gọnahụ” bụ okwu Igbo kwụ ọtọ maka ịjụ eziokwu ma ọ bụ ịsị na ihe abụghị eziokwu; njikọ “-kwa” na-echekwa usoro nkwusi ike nke καὶ.
- source_word: καὶ ... καὶ ... καὶ
  choice: O ...; ...-kwa ...; ...-kwara
  rationale: Njikọ na mgbakwunye “-kwa/-kwara” na-egosipụta καί ugboro ugboro n’ụzọ na-ada nke ọma n’Igbo, ebe akara semikolon na-eme ka nkwupụta ikpeazụ pụta ìhè.
- source_word: Ἐγὼ οὐκ εἰμὶ
  choice: Ọ bụghị m bụ
  rationale: Nhazi a bụ ụzọ Igbo sitere n’okike isi mee ka “m” pụta ìhè, dịka nnọchiaha Ἐγώ e dere kpọmkwem si mee n’asụsụ Grik.
- source_word: ὁ χριστός
  choice: Mezaya ahụ
  rationale: N’ebe a Χριστός bụ aha ọkwá nke onye ndị Juu na-atụ anya ya, ọ bụghị aha mmadụ nkịtị. “Mezaya ahụ” na-echekwa ma echiche ahụ ma mkpụrụokwu njirimara ὁ.
theological_decisions:
- issue: Otú e si asụgharị Χριστός dịka aha ọkwá
  choice: Mezaya ahụ
  alternative: Kraịst ahụ
  rationale: Jọn na-agọnahụ na ya bụ onye ahụ e tere mmanụ nke ndị mmadụ na-atụ anya ya. Ya mere, “Mezaya” na-egosipụta ọrụ okwu ahụ dịka aha ọkwá ma ghara ime ka ọ dị ka aha mmadụ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta mee ihe. “Kwupụtara ya hoo haa” na-eweta ụda nkwupụta ọha na eze, ebe “Ọ bụghị m bụ” na-echekwa nkwusi ike dị na nnọchiaha Grik.
