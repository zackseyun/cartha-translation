id: JHN.1.38
reference: John 1:38
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: στραφεὶς δὲ ὁ Ἰησοῦς καὶ θεασάμενος αὐτοὺς ἀκολουθοῦντας λέγει αὐτοῖς· Τί ζητεῖτε; οἱ δὲ εἶπαν αὐτῷ· Ῥαββί (ὃ λέγεται ⸀μεθερμηνευόμενον Διδάσκαλε), ποῦ μένεις;
base_translation:
  language: en
  yaml_path: translation/nt/john/001/038.yaml
  text: Then Jesus turned and[a], seeing them following, said to them, “What are you seeking?” They said to him, “Rabbi” (which translated means Teacher)[c][b], “where are you staying?”
translation:
  language: ig
  text: Mgbe ahụ, Jizọs tụgharịrị, hụ ha ka ha na-eso ya, wee sị ha, “Gịnị ka unu na-achọ?” Ha sịrị ya, “Rabbi” (nke pụtara “Onye Ozizi”)[a], “olee ebe ị na-anọ?”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Rabbi” bụ aha nsọpụrụ Hibru/Arameik nke pụtara “Onye Ozizi.”
    reason: cultural_note
  - marker: b
    text: A pụkwara ịsụgharị ya, “olee ebe ị na-anọgide?” Okwu ngwaa Grik a bụkwa nke a na-asụgharịkarị “ịnọgide” n’ebe ndị ọzọ n’Oziọma Jọn.
    reason: lexical_alternative
lexical_decisions:
- source_word: στραφεὶς
  choice: tụgharịrị
  rationale: Ọ na-egosi na Jizọs tụgharịrị tupu ya agwa ha okwu, n’ebughị ụzọ kọwaa akụkụ ọ tụgharịrị gaa.
- source_word: θεασάμενος
  choice: hụ
  rationale: Nhọrọ a na-egosi ịhụ ha nke ọma n’usoro omume ahụ, ma ọ naghị etinye nkọwa ọzọ na-adịghị na Grik.
- source_word: ἀκολουθοῦντας
  choice: ka ha na-eso ya
  rationale: Ọ na-echekwa omume na-aga n’ihu, yana ma nghọta nkịtị nke iso mmadụ ma ndò nke ịghọ onye na-eso ụzọ.
- source_word: Τί ζητεῖτε;
  choice: Gịnị ka unu na-achọ?
  rationale: ‘Na-achọ’ bụ Igbo nkịtị nke nwere ike ịpụta ịchọ ihe ma ọ bụ inwe ọchịchọ miri emi, ya mere ọ na-echekwa ohere nke nghọta abụọ dị n’akụkọ Jọn.
- source_word: Ῥαββί
  choice: Rabbi
  rationale: E debere aha nsọpụrụ Semitik ahụ dịka ntụgharị mkpụrụokwu n’ihi na ederede n’onwe ya kọwara ihe ọ pụtara ozugbo.
- source_word: μεθερμηνευόμενον Διδάσκαλε
  choice: nke pụtara “Onye Ozizi”
  rationale: Nke a na-enye nkọwa Jọn n’ụzọ Igbo doro anya ma dị mfe; ‘Onye Ozizi’ na-asụgharị Διδάσκαλε dịka aha a na-akpọ mmadụ.
- source_word: ποῦ μένεις;
  choice: olee ebe ị na-anọ?
  rationale: N’ọnọdụ a, ajụjụ ahụ gbasara ebe Jizọs bi ma ọ bụ nọrọ nwa oge. ‘Na-anọ’ bụ Igbo eke ma ka nwere njikọ okwu na echiche nke ịnọgide.
theological_decisions:
- issue: Ịsụgharị μένω n’ebe mbụ a ọ pụtara na Jọn, ebe ọ na-enwekwu ibu nkà mmụta okpukpe n’ebe ndị ọzọ
  choice: olee ebe ị na-anọ?
  alternative: olee ebe ị na-anọgide?
  rationale: Ọnọdụ okwu a na-egosi ajụjụ banyere ebe Jizọs nọ. ‘Na-anọ’ na-ada nke ọma n’Igbo ma ghara ịmanye echiche nkà mmụta okpukpe nke Jọn ga-emepe emepe n’ebe ndị ọzọ.
- issue: Ịchekwa nghọta abụọ nwere ike ịdị na ζητέω
  choice: Gịnị ka unu na-achọ?
  alternative: Gịnị ka unu na-ele anya ya?
  rationale: ‘Na-achọ’ nwere ike ịkọwa ịchọ ihe nkịtị nakwa ọchịchọ miri emi, ya mere ọ naghị emechi otu n’ime nghọta ndị ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E debere ‘Rabbi’ dịka aha omenala ma kọwaa ya; ahịrịokwu ahụ na-echekwa ma ihe nkịtị pụtara n’ịgbaso na ịchọ, ma ndò ime mmụọ ha nwere ike inwe n’akụkọ Jọn.
