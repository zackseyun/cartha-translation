id: JHN.1.32
reference: John 1:32
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἐμαρτύρησεν Ἰωάννης λέγων ὅτι Τεθέαμαι τὸ πνεῦμα καταβαῖνον ⸀ὡς περιστερὰν ἐξ οὐρανοῦ, καὶ ἔμεινεν ἐπ’ αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/john/001/032.yaml
  text: And John testified[a], saying, “I have seen the Spirit descending like a dove out of heaven[b], and it remained on him.”
translation:
  language: ig
  text: Jọn gbara akaebe, sị, “Ahụla m Mmụọ ahụ ka ọ na-agbadata dị ka nduru site n’eluigwe[b],[a] ọ nọgidere n’elu ya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “n’ụdị nduru.” Okwu Grik ahụ na-egosikarị myirịta.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, “n’eluigwe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμαρτύρησεν
  choice: gbakwara akaebe
  rationale: Nkebi okwu a na-egosi na Jọn nyere akaebe banyere ihe ọ hụrụ; ọ na-edobekwa echiche nke onye akaebe dị n’okwu Grik.
- source_word: λέγων
  choice: sị
  rationale: “Sị” bụ ụzọ Igbo dị mfe ma bụrụkwa eke isi webata ihe Jọn kwuru, n’agbanyeghị na Grik ji participle nke pụtara “na-ekwu.”
- source_word: Τεθέαμαι
  choice: Ahụla m
  rationale: Ụdị perfect nke Grik na-ekwu maka ihe Jọn ji anya ya hụ nke ka bara uru ugbu a; “Ahụla m” na-egosipụta nke a n’Igbo nke oge a.
- source_word: τὸ πνεῦμα
  choice: Mmụọ ahụ
  rationale: “Mmụọ” na mkpụrụedemede ukwu na-egosi Mmụọ Chineke nke amaokwu ndị gbara ya gburugburu na-ekwu maka ya. E tinyebeghị “Nsọ” n’ahịrị isi n’ihi na okwu ahụ adịghị kpọmkwem n’amaokwu a.
- source_word: καταβαῖνον
  choice: ka ọ na-esi … agbadata
  rationale: Nke a na-egosi Mmụọ ahụ ka ọ nọ n’omume ịgbadata, ma na-ada nke ọma n’Igbo.
- source_word: ὡς περιστερὰν
  choice: dị ka nduru
  rationale: ὡς na-egosi myirịta; ntụgharị a anaghị ekwu na Mmụọ ahụ ghọrọ nduru n’ụzọ nkịtị.
- source_word: ἐξ οὐρανοῦ
  choice: na-esi n’ime eluigwe
  rationale: Nke a na-edobe echiche ἐξ nke isi n’ebe dị n’ime pụta, ọ bụghị naanị ịkpọ ebe ihe ahụ si malite.
- source_word: ἔμεινεν
  choice: nọgidekwara
  rationale: “Nọgide” na-echekwa isi echiche μένω nke ịdịgide ma ọ bụ ịnọgide, nke bụ okwu dị mkpa n’Oziọma Jọn.
- source_word: ἐπ’ αὐτόν
  choice: n’elu ya
  rationale: Nke a na-egosipụta ọnọdụ Mmụọ ahụ n’elu onye ahụ n’enweghị ịgbakwụnye nkọwa na-adịghị n’okwu Grik.
theological_decisions:
- issue: Onye τὸ πνεῦμα na-ezo aka na ya
  choice: “Mmụọ ahụ” na-ezo aka na Mmụọ Chineke
  alternative: “mmụọ ahụ” dị ka mmụọ n’ozuzu
  rationale: Ihe gbara amaokwu a gburugburu, karịchaa Jọn 1:33, na-eme ka o doo anya na nke a bụ Mmụọ Nsọ. Ma a hapụrụ okwu ahụ dịka “Mmụọ ahụ” ka a ghara ịgbakwụnye “Nsọ,” nke na-adịghị n’amaokwu a n’onwe ya.
- issue: Ike okwu ὡς περιστερὰν
  choice: 'myirịta: “dị ka nduru”'
  alternative: “n’ụdị nduru”
  rationale: ὡς na-egosikarị myirịta. Nhọrọ a na-echekwa onyinyo ahụ n’enweghị ikpebi na Mmụọ ahụ ghọrọ nduru n’ụdị anụ ahụ.
- issue: Onye nnọchiaha na-ezo aka na Mmụọ ahụ
  choice: “ọ”
  alternative: ikwughachi “Mmụọ ahụ”
  rationale: Igbo anaghị ekewa onye nnọchiaha nke atọ dịka nwoke, nwanyị, ma ọ bụ ihe. Ya mere “ọ” na-ezo aka n’ụzọ eke na Mmụọ ahụ n’enweghị ịmanye ụdị nwoke ma ọ bụ ụdị ihe n’elu okwu Grik.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dịkwa mfe nghọta. “Gbara akaebe,” “Ahụla m,” na “nọgidere” na-echekwa ụda na isi okwu ndị dị mkpa n’Oziọma Jọn. E debere akara ntụaka [a] ozugbo n’akụkụ “dị ka nduru.” E debere [b] na ngwụcha ahịrịokwu n’ihi na ntụaka ahụ metụtara nkebi “na-esi n’ime eluigwe” nke dị tupu ya.
