revisions:
- from: Ọ kpọtaara ya Jizọs. Jizọs legidere ya anya wee sị, “Ị bụ Saịmọn, nwa Jọn[a]; a ga-akpọ gị Kéfas[b]” (nke a sụgharịrị bụ Pita).
  to: O kpọpụtara ya n'ebe Jizọs nọ. Jizọs legidere ya anya wee sị, “Ị bụ Saịmọn, nwa nwoke Jọn[a]; a ga-akpọ gị Kifas[b]” (nke a na-asụgharị dị ka Pita).
  rationale: The revision makes the movement toward Jesus explicit, retains the source’s statement that Simon is John’s son, uses established Igbo biblical forms for the names, and improves the explanatory parenthesis and lexical note. The textual-variant and lexical footnote anchors remain correctly attached to Jọn and Kifas respectively.
