id: JHN.1.42
reference: John 1:42
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸀ἤγαγεν αὐτὸν πρὸς τὸν Ἰησοῦν. ἐμβλέψας αὐτῷ ὁ Ἰησοῦς εἶπεν· Σὺ εἶ Σίμων ὁ υἱὸς ⸀Ἰωάννου, σὺ κληθήσῃ Κηφᾶς (ὃ ἑρμηνεύεται Πέτρος).
base_translation:
  language: en
  yaml_path: translation/nt/john/001/042.yaml
  text: He brought him to Jesus[a]. Looking at him, Jesus said, “You are Simon, the son of John[b]; you will be called Cephas” (which is translated Peter).
translation:
  language: ig
  text: O kpọpụtara ya n'ebe Jizọs nọ. Jizọs legidere ya anya wee sị, “Ị bụ Saịmọn, nwa nwoke Jọn[a]; a ga-akpọ gị Kifas[b]” (nke a na-asụgharị dị ka Pita).
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ụfọdụ ihe odide nwere “Jona” kama “Jọn”; ederede SBLGNT nwere “Jọn.”
    reason: textual_variant
  - marker: b
    text: Kifas bụ aha sitere n'asụsụ ndị Sem nke kwekọrọ na Pita; ọ nwere echiche “nkume” ma ọ bụ “okwute.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤγαγεν
  choice: Ọ kpọtaara ya
  rationale: Ngwaa ‘kpọtaara’ na-egosi na o mere ka onye ahụ bịakwute onye ọzọ, ma dabara n’omume a rụchara nke aorist ἤγαγεν.
- source_word: πρὸς τὸν Ἰησοῦν
  choice: Jizọs
  rationale: N’usoro ‘kpọtaara ya Jizọs,’ asụsụ Igbo na-egosi mmegharị mmadụ bịakwuru Jizọs n’enweghị mkpa itinye preposition ọzọ.
- source_word: ἐμβλέψας αὐτῷ
  choice: legidere ya anya
  rationale: ‘Legidere ya anya’ na-egosipụta ile mmadụ anya nke ọma, nke siri ike karịa ile ya anya nkịtị ma ka bụ okwu Igbo sitere n’ọnụ mmadụ.
- source_word: Σὺ εἶ Σίμων
  choice: Ị bụ Saịmọn
  rationale: Nke a na-edobe okwu a gwara Saịmọn ozugbo ma na-asụgharị aha ahụ dịka aha mmadụ.
- source_word: ὁ υἱὸς Ἰωάννου
  choice: nwa Jọn
  rationale: ‘Nwa Jọn’ bụ ụzọ Igbo dị mfe ma doo anya isi kwuo ‘son of John’; a gbasoro ọgụgụ SBLGNT, Ἰωάννου.
- source_word: κληθήσῃ
  choice: a ga-akpọ gị
  rationale: Nke a na-edobe ma ọdịnihu ma ụdị passive nke κληθήσῃ n’Igbo sitere n’okike.
- source_word: Κηφᾶς
  choice: Kéfas
  rationale: A transliteretere aha Semitic ahụ kama ịsụgharị ihe ọ pụtara, ebe amaokwu ahụ na-ekwu maka aha a ga-akpọ Saịmọn.
- source_word: ὃ ἑρμηνεύεται Πέτρος
  choice: nke a sụgharịrị bụ Pita
  rationale: 'Nke a na-edobe nkọwa nne na nna nke ederede Grik: a na-enye aha Grik Pita dịka ntụgharị nke Kéfas, n’enweghị ịgbanwe aha ahụ ka ọ bụrụ naanị ‘Nkume.’'
theological_decisions:
- issue: Otu e si gosipụta nkọwa Κηφᾶς/Πέτρος
  choice: 'Idobe ha abụọ dịka aha mmadụ: ‘Kéfas’ na ‘Pita,’ ma kọwaa ihe ha pụtara n’ala ala peeji.'
  alternative: Ịsụgharị aha ahụ ozugbo dịka ‘Nkume.’
  rationale: Ederede ahụ na-elekwasị anya n’ịkpọ Saịmọn aha ọhụrụ. Idobe aha abụọ ahụ na-echekwa ọrụ ha dịka aha mmadụ, ebe nkọwa ala ala peeji na-eme ka njikọ ha na ‘nkume’ doo anya n’etinyeghị nkwubi okwu nkà mmụta okpukpe ọzọ n’ahịrị ederede.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị nsọpụrụ ma dị mfe nghọta. ‘Legidere ya anya’ na-echekwa ike dị na ἐμβλέψας, ebe ‘a ga-akpọ gị’ na-edobe ọdịnihu na passive. E tinyere akara ala ala peeji [a] n’ebe ‘Jọn’ dị na [b] n’ebe ‘Kéfas’ dị ka ọdịnaya nke ndetu ha si chọọ, na-edozi ndakọrịta akara na nkọwa.
