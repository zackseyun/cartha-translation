review_pass:
  verdict: revise
  source_fidelity: The draft preserves the verse’s sequence, Jesus’ direct address, the future passive sense of κληθήσῃ, and the parenthetical explanation of Κηφᾶς. However, “Ọ kpọtaara ya Jizọs” does not clearly express movement to Jesus and is not a reliable rendering of ἤγαγεν αὐτὸν πρὸς τὸν Ἰησοῦν.
  naturalness: “O kpọpụtara ya n'ebe Jizọs nọ” is clear, idiomatic Standard Igbo. “Nwa nwoke Jọn” explicitly represents υἱός (‘son’) rather than the broader Igbo word nwa. “Nke a na-asụgharị dị ka Pita” naturally conveys the Greek explanatory gloss without turning the personal name into a common noun in the main text.
  terminology: Kifas and Pita follow established Igbo biblical naming conventions more naturally than the hybrid form “Kéfas.” The lexical note identifies Kifas as a Semitic-language name corresponding to Pita and appropriately notes its sense as ‘rock/stone,’ without imposing theological conclusions.
  issues:
  - severity: medium
    issue: The opening clause lacks a clear destination phrase.
    rationale: In “Ọ kpọtaara ya Jizọs,” Jizọs can be read as an object associated with kpọtaara rather than as the person to whom Simon was brought. The Greek explicitly says that he brought him to Jesus (πρὸς τὸν Ἰησοῦν).
  - severity: low
    issue: “nwa Jọn” does not explicitly represent ‘son.’
    rationale: Nwa may mean child generally. “Nwa nwoke Jọn” retains the male designation in ὁ υἱὸς Ἰωάννου.
  - severity: low
    issue: The parenthetical gloss is grammatically awkward in Igbo.
    rationale: “nke a sụgharịrị bụ Pita” is less natural than a construction explicitly expressing the name-equivalence conveyed by ὃ ἑρμηνεύεται Πέτρος.
  - severity: low
    issue: The note’s phrase “aha Semitic” is unnecessarily English-derived and “nwere echiche” is imprecise.
    rationale: A Standard Igbo explanation can state plainly that Kifas is a name from a Semitic language corresponding to Pita and has the sense ‘rock’ or ‘stone.’
  revised_text: O kpọpụtara ya n'ebe Jizọs nọ. Jizọs legidere ya anya wee sị, “Ị bụ Saịmọn, nwa nwoke Jọn[a]; a ga-akpọ gị Kifas[b]” (nke a na-asụgharị dị ka Pita).
  revised_footnotes:
  - marker: a
    text: Ụfọdụ ihe odide nwere “Jona” kama “Jọn”; ederede SBLGNT nwere “Jọn.”
    reason: textual_variant
  - marker: b
    text: Kifas bụ aha sitere n'asụsụ ndị Sem nke kwekọrọ na Pita; ọ nwere echiche “nkume” ma ọ bụ “okwute.”
    reason: lexical_alternative
  revision_rationale: The revision makes the movement toward Jesus explicit, retains the source’s statement that Simon is John’s son, uses established Igbo biblical forms for the names, and improves the explanatory parenthesis and lexical note. The textual-variant and lexical footnote anchors remain correctly attached to Jọn and Kifas respectively.
