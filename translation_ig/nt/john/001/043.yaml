  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Τῇ ἐπαύριον ἠθέλησεν ἐξελθεῖν εἰς τὴν Γαλιλαίαν. καὶ εὑρίσκει Φίλιππον καὶ λέγει αὐτῷ ὁ Ἰησοῦς· Ἀκολούθει μοι.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/043.yaml
  text: The next day he wanted to go out into Galilee[a], and Jesus finds Philip and says to him[c][b], “Follow me.”
translation:
  language: ig
  text: N’echi ya, ọ chọrọ ịpụ gaa Galili.[a] Jizọs wee chọta Filip, sị ya,[b] “Soro m.”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Enwere ike ịsụgharị nkebiokwu a dịka, “ịpụ gaa banye na Galili.” Okwu ntụaka Grik ahụ nwere ike igosi ịga n’ebe ahụ ma ọ bụ ịbanye n’ógbè ahụ.
    reason: lexical_alternative
  - marker: b
    text: N’asụsụ Grik, ngwaa ndị a sụgharịrị “wee chọta” na “sị” dị n’oge ugbu a, nke e ji eme ka akụkọ dị ndụ. Igbo na-ejikarị usoro a dị ebe a akọ ihe ndị mere n’oge gara aga.
    reason: lexical_alternative
  - marker: c
    text: “Soro m” nwere ike ịpụta iso Jizọs na-aga n’ụzọ nkịtị ma ọ bụ nabata oku ịbụ onye na-eso ụzọ ya.
    reason: alternative_reading
lexical_decisions:
- source_word: Τῇ ἐπαύριον
  choice: N’echi ya
  rationale: Nke a bụ ụzọ Igbo dị mfe ma kwekọọ n’usoro akụkọ iji gosi ụbọchị sochirinụ.
- source_word: ἠθέλησεν
  choice: ọ chọrọ
  rationale: Ọ na-echekwa echiche nke ọchịchọ ma ọ bụ ebumnuche, n’etinyeghị echiche siri ike nke mkpebi e kpebiri nke ọma.
- source_word: ἐξελθεῖν
  choice: ịpụ
  rationale: Ọ na-anọchi anya echiche bụ isi nke isi n’otu ebe pụọ, ma na-aga nke ọma na nkebiokwu ebe a na-aga.
- source_word: εἰς τὴν Γαλιλαίαν
  choice: gaa Galili
  rationale: N’Igbo ugbu a, nke a bụ ụzọ ebumpụta ụwa isi kwuo mmegharị gaa n’ebe ahụ; nkọwa ala na-egosi na Grik nwekwara ike imesi ịbanye n’ógbè ahụ ike.
- source_word: εὑρίσκει
  choice: wee hụ
  rationale: Igbo na-ejikarị “wee” jikọta ihe ndị sochiri ibe ha n’akụkọ. “Hụ” ebe a nwere echiche nke ịchọta onye ahụ, ma ọ bụ izute ya.
- source_word: λέγει
  choice: sị
  rationale: “Sị” bụ ụzọ dị mkpirikpi ma bụrụkwa nke ebumpụta ụwa n’Igbo iji webata okwu mmadụ kwuru n’usoro akụkọ.
- source_word: Ἀκολούθει μοι
  choice: Soro m
  rationale: Ọ na-echekwa ma echiche nke iso Jizọs na-aga ma ọ bụ oku sara mbara nke ịbụ onye na-eso ụzọ ya, n’akọwaghị otu n’ime ha karịa ihe Grik kwuru.
- source_word: Φίλιππον
  choice: Filip
  rationale: E dere aha ahụ n’ụdị a na-amakarị ma dị mfe ịgụ n’Igbo.
- source_word: ὁ Ἰησοῦς
  choice: Jizọs
  rationale: E debere aha doro anya dị na Grik iji mee ka onye na-eme ihe doo anya n’akụkọ ahụ.
theological_decisions:
- issue: Ike na obosara nke iwu Jizọs nyere Filip
  choice: “Soro m” dị ka oku kpọmkwem nke nwere ike ịgụnye iso Jizọs na-aga na ịbụ onye na-eso ụzọ ya.
  alternative: Ịghọta ya naanị dị ka ịkpọ Filip ka ọ soro Jizọs gaa njem n’oge ahụ.
  rationale: Okwu Grik ahụ nwere ike ịpụta iso mmadụ n’ụzọ nkịtị, ma n’akụkọ Oziọma ọ na-ebukwa echiche nke ịbụ onye na-eso ụzọ. Nsụgharị ahụ na-echekwa akụkụ abụọ ahụ n’etinyeghị nkọwa okpukpe ọzọ.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. Usoro “wee hụ Filip, sị ya” na-eme ka akụkọ na-aga were were n’ụzọ Igbo, ebe nkọwa ala na-echekwa historical present nke Grik. E zere ịgbakwunye “na” tupu Galili n’ihi na “gaa Galili” bụ okwu Igbo dị nkenke ma bụrụ nke ebumpụta ụwa.
