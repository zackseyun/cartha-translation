id: JHN.1.51
reference: John 1:51
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτῷ· Ἀμὴν ἀμὴν λέγω ⸀ὑμῖν, ὄψεσθε τὸν οὐρανὸν ἀνεῳγότα καὶ τοὺς ἀγγέλους τοῦ θεοῦ ἀναβαίνοντας καὶ καταβαίνοντας ἐπὶ τὸν υἱὸν τοῦ ἀνθρώπου.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/051.yaml
  text: And he said to him[a], “Truly, truly, I say to you[b], you will see heaven opened and the angels of God ascending and descending on the Son of Man.”
translation:
  language: ig
  text: Ọ sịrị ya, “N’ezie, n’ezie, ana m asị unu[a], unu ga-ahụ eluigwe emegheworo na ndị mmụọ ozi Chineke ka ha na-arịgo ma na-arịdata n’elu Nwa nke Mmadụ[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Unu” dị n’okwu “ana m asị unu” na “unu ga-ahụ” bụ ọtụtụ na Grik. Ọ bụ ezie na Jizọs na-agwa Nataniel okwu, okwu a gbasakwuru ndị ọzọ.
    reason: lexical_alternative
  - marker: b
    text: Ihe oyiyi a na-eme ka a cheta nrọ Jekọb na Jenesis 28:12; n’ebe a, o metụtara Nwa nke Mmadụ.
    reason: cross_reference
lexical_decisions:
- source_word: Ἀμὴν ἀμὴν
  choice: N’ezie, n’ezie
  rationale: Nke a na-edobe nkwughachi ahụ e ji mesie okwu ike, ma na-egosikwa n’Igbo dị mfe na nke dị nsọ na ihe a na-ekwu bụ eziokwu siri ike.
- source_word: ὑμῖν / ὄψεσθε
  choice: unu / unu ga-ahụ
  rationale: Ụdị abụọ a bụ ọtụtụ na Grik. Igbo nwere ike igosi nke a kpọmkwem site n’iji “unu,” nke na-eme ka o doo anya na okwu ahụ agbasawo karịa naanị Nataniel.
- source_word: τὸν οὐρανὸν ἀνεῳγότα
  choice: eluigwe ka e meghere ya
  rationale: Nke a na-egosi eluigwe n’ọnọdụ nke ịbụ nke e meghere, n’enweghị itinye nkọwa ọzọ n’ime ihe oyiyi ahụ.
- source_word: ἀγγέλους
  choice: ndị mmụọ ozi
  rationale: N’ọhụụ a, ebe a kpọrọ ha ndị nke Chineke, okwu ahụ na-ezo aka n’ụmụ mmụọ ozi, ọ bụghị naanị ndị ozi mmadụ.
- source_word: ἀναβαίνοντας καὶ καταβαίνοντας
  choice: ka ha na-arịgo ma na-arịdata
  rationale: Nke a na-edobe ụzọ mmegharị abụọ dị n’akwụkwọ Grik ma na-eme ka myirịta ya na Jenesis 28:12 pụta ìhè n’enweghị ịkọwa ya n’ahịrịokwu ahụ.
- source_word: ἐπὶ
  choice: n’elu
  rationale: “N’elu” na-edobe ihe oyiyi na-edoghị anya kpamkpam banyere mmegharị ndị mmụọ ozi n’ihe metụtara Nwa nke Mmadụ, kama ịgbanwe ya ka ọ bụrụ nkọwa nkà mmụta okpukpe.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Nwa nke Mmadụ
  rationale: Nke a na-edobe aha Jizọs ji akpọ onwe ya na njikọ ya na ihe oyiyi dị n’Akwụkwọ Nsọ, n’enweghị ịkọwaghachi ya n’ụzọ ga-ebelata ịdị omimi ya.
theological_decisions:
- issue: Okwu akụkọ ahụ na-agwa otu onye (“ya”), ma okwu Jizọs ji aza ya bụ ọtụtụ (“unu”).
  choice: E gosipụtara ọtụtụ ahụ kpọmkwem n’ahịrịokwu bụ isi site n’iji “unu,” tinyekwa nkọwa ala peeji.
  alternative: Iji okwu ga-adị ka ọ bụ naanị Nataniel ka a na-agwa.
  rationale: Grik gbanwere n’ụzọ pụtara ìhè site n’otu onye gaa n’ọtụtụ mmadụ. Ebe Igbo na-ekewa otu na ọtụtụ n’okwu nnọchiaha, ọ kacha zie ezi igosi “unu” kpọmkwem.
- issue: Ndị mmụọ ozi na-arịgo ma na-arịdata n’elu Nwa nke Mmadụ na-eme ka a cheta nrọ Jekọb na Jenesis 28:12.
  choice: E debere ihe oyiyi ahụ n’ahịrịokwu bụ isi, ma kọwaa njikọ Akwụkwọ Nsọ ahụ n’ala peeji.
  alternative: Ịgbakwunye n’ahịrịokwu bụ isi na Jizọs bụ ubube ma ọ bụ ebe Chineke na mmadụ na-ezukọ.
  rationale: Ihe oyiyi ahụ nwere njikọ nkà mmụta okpukpe miri emi, ma ihe odide Grik ekwughị nkọwa ndị ahụ kpọmkwem; ya mere, e kwesịghị itinye ha n’ahịrịokwu ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ugwu ma dịkwa mfe nghọta. “N’ezie, n’ezie” na-edobe ịdị nsọ na ike nke usoro okwu ahụ; “ndị mmụọ ozi” na “Nwa nke Mmadụ” bụ okwu Akwụkwọ Nsọ ndị a maara nke ọma. E zere ịkọwa ihe oyiyi ahụ karịa ka Grik si kwuo ya.
