  to: N’ihi na e nyere iwu ahụ site n’aka Mosis; amara na eziokwu sitere n’aka Jizọs bụ Mesaya[a] bịa.
  rationale: The revision corrects the first clause’s passive syntax and makes the parallel second clause more idiomatic. It retains the source’s explanatory relation, passive wording for the law, parallel mediation through Moses and Jesus, the historical-arrival sense of ἐγένετο, and the title translation “Mesaya.”
