reference: John 1:17
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὅτι ὁ νόμος διὰ Μωϋσέως ἐδόθη, ἡ χάρις καὶ ἡ ἀλήθεια διὰ Ἰησοῦ Χριστοῦ ἐγένετο.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/017.yaml
  text: For the law was given through Moses[a]; grace and truth came through Jesus the Messiah.
translation:
  language: ig
  text: N’ihi na e nyere iwu ahụ site n’aka Mosis; amara na eziokwu sitere n’aka Jizọs bụ Mesaya[a] bịa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A na-asụgharị ya n’ọdịnala dịka, “Jizọs Kraịst.”
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: N’ihi na
  rationale: N’ebe a, okwu a na-akọwa ihe kpatara okwu dị n’amaokwu bu ya ụzọ; “N’ihi na” na-edobe njikọ nkọwa ahụ n’Igbo nkịtị.
- source_word: ὁ νόμος
  choice: iwu ahụ
  rationale: Ọ na-ezo aka n’iwu Mosis dị ka usoro ntụziaka a maara ama; “ahụ” na-egosi na ọ bụ iwu ahụ a kapịrị ọnụ.
- source_word: διὰ Μωϋσέως
  choice: site n’aka Mosis
  rationale: διά na genitive na-egosi onye e si n’aka ya mee ihe. Okwu a na-edobekwa myirịta ya na nkebi gbasara Jizọs.
- source_word: ἐδόθη
  choice: e ... nye
  rationale: 'A na-edobe ụdị passive nke Greek: iwu ahụ bụ ihe e nyere, n’agbanyeghị na ekwughị kpọmkwem onye nyere ya.'
- source_word: ἡ χάρις
  choice: amara
  rationale: “Amara” bụ okwu Igbo doro anya ma guzosie ike maka χάρις dịka ihu ọma Chineke na-enye n’efu.
- source_word: ἡ ἀλήθεια
  choice: eziokwu
  rationale: “Eziokwu” na-edobe isi echiche ἀλήθεια n’Oziọma Jọn, tinyere njikọ ya na Jọn 1:14.
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: site n’aka Jizọs bú Mesaya
  rationale: “Site n’aka” na-egosi ụzọ ma ọ bụ onye e si n’aka ya nweta ihe; Χριστός ka a sụgharịrị dịka aha ọkwa “Mesaya,” ebe Jizọs ka bụ aha onye.
- source_word: ἐγένετο
  choice: bịa
  rationale: “Bịa” na-egosi na amara na eziokwu bịara pụta n’akụkọ ihe mere eme site n’aka Jizọs, ma ghara ịsụgharị γίνομαι n’ụzọ ga-egosi na ha gbanwere bụrụ ihe ọzọ.
theological_decisions:
- issue: Nsụgharị Χριστοῦ n’okwu Ἰησοῦ Χριστοῦ
  choice: Jizọs bú Mesaya
  alternative: Jizọs Kraịst
  rationale: Χριστός bụ aha ọkwa nke pụtara Mesaya. Itinye “bú” na-eme ka aha ọkwa ahụ daa nke ọma n’Igbo, ebe nsụgharị ọdịnala dị na nkọwa ala peeji.
- issue: Mmekọrịta dị n’etiti iwu na amara na eziokwu
  choice: E debere nkebi abụọ ahụ n’usoro myiri, na-enweghị ịgbakwunye okwu na-ekwu na iwu ahụ megidere amara ma ọ bụ eziokwu.
  alternative: Ịgbakwunye “ma” ma ọ bụ okwu na-egosi mmegide siri ike
  rationale: Greek na-etinye nkebi abụọ ahụ n’akụkụ ibe ha ma ọ naghị eji njikọ mmegide. Nsụgharị ahụ na-echekwa esemokwu na myirịta dị n’amaokwu ahụ n’enweghị nkọwa okpukpe agbakwunyere.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị mfe ma dị nsọ n’ụda olu. Usoro “e sitere n’aka … nye” na “sikwa n’aka … bịa” na-echekwa myirịta Greek ma na-ada nke ọma n’Igbo. E tinyere akara nkọwa [a] n’ebe okwu ọ na-akọwa dị, ya bụ mgbe “Mesaya” gasịrị.
