id: JHN.1.39
reference: John 1:39
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: λέγει αὐτοῖς· Ἔρχεσθε καὶ ⸂ὄψεσθε. ἦλθαν οὖν⸃ καὶ εἶδαν ποῦ μένει, καὶ παρ’ αὐτῷ ἔμειναν τὴν ἡμέραν ἐκείνην· ὥρα ἦν ὡς δεκάτη.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/039.yaml
  text: He said to them[a], “Come, and you will see.” So they went and saw where he was staying, and they stayed with him that day. It was about the tenth hour.
translation:
  language: ig
  text: Ọ sịrị ha, “Bịanụ, unu ga-ahụ.” Ya mere, ha gara hụ ebe ọ na-anọ, ha wee nọnyere ya ụbọchị ahụ. Ọ bụ ihe dị ka awa nke iri.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, ọ bụrụ na a gụọ oge malite n’oge anyanwụ wara, ihe dị ka elekere anọ nke mgbede; ụfọdụ na-ewere ya dịka usoro oge ndị Rom si dị, ya bụ, ihe dị ka elekere iri nke ụtụtụ.
    reason: alternative_reading
lexical_decisions:
- source_word: λέγει αὐτοῖς
  choice: Ọ sịrị ha
  rationale: A tụgharịrị historical present ahụ dị ka ihe mere n’oge gara aga, dịka asụsụ akụkọ Igbo si adịkarị, na-enweghị ịgbanwe onye ọ na-agwa.
- source_word: Ἔρχεσθε
  choice: Bịanụ
  rationale: Ụdị iwu a dị n’ọnụọgụgụ ọtụtụ ma na-arụ ọrụ dị ka ọkpụkpọ òkù; “Bịanụ” bụ okwu Igbo doro anya ma kwekọọ n’ụdị ahụ.
- source_word: ὄψεσθε
  choice: unu ga-ahụ
  rationale: Nke a na-echekwa ọdịnihu nke ngwaa ahụ na nkwa dị n’ọkpụkpọ òkù Jizọs.
- source_word: ἦλθαν οὖν
  choice: Ya mere, ha gara
  rationale: “Ya mere” na-egosi nsonaazụ nke òkù ahụ, ebe “ha gara” na-akọ ngagharị ahụ n’ụzọ Igbo na-ada nke ọma site n’echiche ndị na-eso ụzọ.
- source_word: εἶδαν
  choice: hụ
  rationale: “Hụ” bụ ntụgharị kwụ ọtọ ma na-echekwa njikọ okwu ya na “unu ga-ahụ.”
- source_word: ποῦ μένει
  choice: ebe ọ na-anọ
  rationale: N’ebe a μένω na-ezo aka n’ebe Jizọs nọ na-anọ n’oge ahụ; okwu a anaghị ekwu na ọ bụ ebe obibi ya na-adịgide adịgide.
- source_word: παρ’ αὐτῷ ἔμειναν
  choice: ha wee nọnyere ya
  rationale: Nke a na-egosi ma ịnọgide n’ebe ahụ ma ịnọ n’ụlọọrụ ya, n’ụzọ Igbo dị mfe ma bụrụ eke.
- source_word: τὴν ἡμέραν ἐκείνην
  choice: ụbọchị ahụ
  rationale: A hapụrụ ya dịka e si kwuo ya n’asụsụ Grik, na-agbakwụnyeghị “ụbọchị ahụ dum” ma ọ bụ “oge fọdụrụ n’ụbọchị ahụ.”
- source_word: ὥρα ἦν ὡς δεκάτη
  choice: Ọ bụ ihe dị ka awa nke iri
  rationale: “Ihe dị ka” na-egosipụta ὡς, ebe “awa nke iri” na-echekwa usoro oge nke ederede mbụ kama ịgbanwe ya ozugbo ka ọ bụrụ oge elekere nke oge a.
theological_decisions:
- issue: Ụzọ e si agụ “awa nke iri”
  choice: E debere “awa nke iri” n’isi ederede.
  alternative: Ọ bụrụ na a gụọ oge malite n’ọwụwa anyanwụ, ọ ga-abụ ihe dị ka elekere anọ nke mgbede; ụfọdụ na-ewere ya dịka ihe dị ka elekere iri nke ụtụtụ site n’usoro oge ndị Rom.
  rationale: Ederede Grik ekwughị usoro ịgụ oge e ji mee ihe. Idebe okwu ahụ n’isi ederede na zere idozi okwu a na-arụrịta ụka n’otu ụzọ, ebe nkọwa ala peeji na-egosi nhọrọ ndị bụ isi.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “Ebe ọ na-anọ” na-ezere ime ka ebe ahụ yie ebe obibi na-adịgide adịgide, “nọnyere ya” na-egosikwa ịnọ n’ụlọọrụ ya. E tinyere akara nkọwa [a] ozugbo n’akụkụ “awa nke iri,” nke bụ okwu nkọwa ahụ metụtara.
