  source_fidelity: 'Nsụgharị ahụ na-ebipụta nke ọma isi okwu Grik: ewebatara otu nwoke, Chineke zitere ya, aha ya bụ Jọn. “Chineke zitere” na-edobe echiche participle passive ἀπεσταλμένος na isi/ọrụ Chineke nke παρὰ θεοῦ, ọbụna ma usoro Igbo ji active kwuo ya.'
