  terminology: “Chineke,” “zitere,” na “Jọn” bụ okwu na aha a na-ahụkarị ma nabata n’Igbo. Ọ dịghị etinye ọkwa amụma ma ọ bụ nkọwa ozizi ọzọ na-adịghị n’amaokwu ahụ.
