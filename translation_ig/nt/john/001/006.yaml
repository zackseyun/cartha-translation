  text: Ἐγένετο ἄνθρωπος ἀπεσταλμένος παρὰ θεοῦ, ὄνομα αὐτῷ Ἰωάννης·
base_translation:
  language: en
  yaml_path: translation/nt/john/001/006.yaml
  text: There was a man sent from God[a], whose name was John.
translation:
  language: ig
  text: E nwere otu nwoke Chineke zitere; aha ya bụ Jọn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “aha nwoke ahụ bụ Jọn,” ma ọ bụ n’ụzọ dị nkenke, “nwoke a na-akpọ Jọn.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο
  choice: E nwere
  rationale: N’ebe a, γίνομαι na-ewebata onye ọhụrụ n’akụkọ ahụ. “E nwere” bụ ụzọ Igbo dị mfe ma kwekọọ n’echiche ịdị adị, n’etinyeghị echiche na e kere ya ma ọ bụ na ọ pụtara nanị n’anya.
- source_word: ἄνθρωπος
  choice: otu nwoke
  rationale: Okwu ahụ na-ekwu maka otu nwoke kpọmkwem, ya bụ Jọn. “Otu nwoke” bụ Igbo nkịtị ma doo anya.
- source_word: ἀπεσταλμένος
  choice: Chineke zitere
  rationale: A gbanwere usoro passive nke Grik ka ọ bụrụ active n’Igbo maka ịdị mfe na ịdị ndụ nke asụsụ, ma a ka debere echiche na e nyere Jọn ozi ma zite ya.
- source_word: παρὰ θεοῦ
  choice: Chineke zitere
  rationale: παρά tinyere genitive na-egosi na ozi ahụ sitere n’aka Chineke. N’Igbo, “Chineke zitere” na-egosipụta nke a n’ụzọ ebumpụta ụwa, n’agbanyeghị na ọ na-eme ka onye mere iziga ahụ pụta ìhè karịa usoro Grik.
- source_word: ὄνομα αὐτῷ Ἰωάννης
  choice: aha ya bụ Jọn
  rationale: Nke a bụ ntụgharị Igbo dị mfe ma kpọmkwem nke akpaalaokwu Grik nke na-akọwa aha onye ahụ.
- source_word: Ἰωάννης
  choice: Jọn
  rationale: E jiri ụdị aha a maara nke ọma n’Igbo dee aha Grik Ἰωάννης.
theological_decisions:
- issue: Ụdị ozi Jọn natara
  choice: E gosiri Jọn dịka onye Chineke zitere.
  alternative: Ịsụgharị ya naanị dịka onye ya na Chineke nwere njikọ, ma ọ bụ iji okwu pụrụ iche kpọọ ya onye amụma.
  rationale: ἀπεσταλμένος παρὰ θεοῦ na-egosi na iziga Jọn sitere n’aka Chineke. Nsụgharị ahụ na-edebe nke a n’etinyeghị nkọwa ọzọ banyere ọkwa ma ọ bụ ọrụ amụma ya nke amaokwu a na-ekwughị.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe ma nwee ugwu. E tinyere akara [a] n’azụ ahịrịokwu aha ahụ nke nkọwa ala peeji metụtara.
