  text: ⸀Καὶ ἀπεσταλμένοι ἦσαν ἐκ τῶν Φαρισαίων.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/024.yaml
  text: And they had been sent from the Pharisees[a].
translation:
  language: ig
  text: Ma ndị ahụ e zitere sitere n’etiti ndị Farisii.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Ndị Farisii zitere ha.” N’asụsụ Grik, okwu ahụ na-egosi n’ụzọ nkịtị karị na ha sitere n’etiti ndị Farisii.
    reason: alternative_reading
lexical_decisions:
- source_word: Καὶ
  choice: Ma
  rationale: Njikọ a na-aga n’ihu n’akụkọ ahụ; “Ma” na-ejikọta amaokwu a na nke bu ya ụzọ n’ụzọ doro anya ma dịkwa eke n’Igbo.
- source_word: ἀπεσταλμένοι ἦσαν
  choice: bụ ndị ... zite
  rationale: Usoro perfect participle tinyere ἦσαν na-egosi na e zitela ha, ọnọdụ ahụ ka bụkwa ihe dị mkpa n’akụkọ ahụ. Nhazi “bụ ndị e ... zite” na-egosipụta nke a n’Igbo nkịtị.
- source_word: ἐκ
  choice: si n’etiti
  rationale: ἐκ na-egosi isi mmalite ma ọ bụ ebe ha si pụta, ọ bụghị kpọmkwem onye mere iziga ahụ. “Si n’etiti” na-echekwa nghọta na ha sitere n’otu ndị Farisii.
- source_word: τῶν Φαρισαίων
  choice: ndị Farisii
  rationale: Nke a bụ aha otu okpukpe ahụ a na-ejikarị eme ihe n’Igbo Standard.
theological_decisions:
- issue: Mmekọrịta ndị ahụ na ndị Farisii
  choice: Ha bụ ndị e si n’etiti ndị Farisii zite, nke na-emesi isi mmalite ha ike.
  alternative: Ndị Farisii zitere ha, nke ga-emesi ndị mere iziga ahụ ike.
  rationale: ἐκ tinyere genitive na-egosi isi mmalite n'ụzọ pụtara ìhè karịa agency. Ya mere, a hapụrụ ohere maka echiche abụọ ahụ n’enweghị ikwu karịa ihe Grik kwuru.
translation_notes:
  register: Asụsụ Igbo Standard dị mfe, dị ugwu, ma dịkwa mma maka ọgụgụ ọha. E debere mgbagwoju anya dị n’etiti isi mmalite na onye mere iziga ahụ site n’iji ihe odide ukwu na nkọwa ala peeji.
