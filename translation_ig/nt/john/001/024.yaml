review_pass:
  verdict: revise
  source_fidelity: The draft rightly distinguishes the completed sending (ἀπεσταλμένοι ἦσαν) from the delegation's source/origin (ἐκ τῶν Φαρισαίων), and its footnote appropriately preserves the possible agency-oriented interpretation. However, the passive verbal form in the main text needs correction for idiomatic and grammatically complete Standard Igbo.
  naturalness: “bụ ndị e si n’etiti ndị Farisii zite” is not a natural completed passive construction in this context; “ndị ahụ e zitere sitere n’etiti ndị Farisii” is clear, idiomatic, and retains both elements of the Greek clause without making the Pharisees explicit agents.
  terminology: “ndị Farisii” is the standard and suitable rendering of Φαρισαῖοι. “Sitere n’etiti” adequately conveys source/origin and does not force the alternative sense “sent by.”
  issues:
  - severity: medium
    issue: The main-text phrase “e si n’etiti ndị Farisii zite” uses an incomplete/non-idiomatic passive form for a completed sending.
    rationale: The Greek perfect participle with ἦσαν refers to persons who had been sent. In Standard Igbo, “e zitere” naturally expresses this; the origin phrase should be stated separately as “sitere n’etiti ndị Farisii.”
  revised_text: Ma ndị ahụ e zitere sitere n’etiti ndị Farisii.[a]
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “Ndị Farisii zitere ha.” N’asụsụ Grik, okwu ahụ na-egosi n’ụzọ nkịtị karị na ha sitere n’etiti ndị Farisii.
    reason: alternative_reading
  revision_rationale: 'The revision corrects the Igbo passive construction while retaining the Greek sequence of ideas: these were sent persons, and they were from the Pharisees. The footnote continues to acknowledge, without imposing it on the main text, the contextually plausible agency sense.'
