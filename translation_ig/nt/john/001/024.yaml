- from: Ma ndị ahụ bụ ndị e si n’etiti ndị Farisii zite.[a]
  to: Ma ndị ahụ e zitere sitere n’etiti ndị Farisii.[a]
  rationale: 'The revision corrects the Igbo passive construction while retaining the Greek sequence of ideas: these were sent persons, and they were from the Pharisees. The footnote continues to acknowledge, without imposing it on the main text, the contextually plausible agency sense.'
  reviewer_model: gpt-5.6-terra
