- from: Mụ onwe m ahụla ya, gbaakwa akaebe na onye a bụ Onye Chineke Họpụtara[a].
  to: Mụ kwa ahụla ya, agbaala m akaebe na onye a bụ Onye Chineke Họpụtara[a].
  rationale: The revision preserves the SBLGNT reading and the significant alternative reading while improving grammatical aspect, accurately representing the two Greek perfect verbs. It also renders κἀγώ with a natural Igbo expression that retains both its connective and inclusive force.
