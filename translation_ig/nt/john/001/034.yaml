  text: κἀγὼ ἑώρακα, καὶ μεμαρτύρηκα ὅτι οὗτός ἐστιν ὁ ⸀ἐκλεκτὸς τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/034.yaml
  text: And I have seen and have testified that this is the Chosen One of God[a].
translation:
  language: ig
  text: Mụ kwa ahụla ya, agbaala m akaebe na onye a bụ Onye Chineke Họpụtara[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ụfọdụ ihe odide nwere, “Nwa Chineke,” kama “Onye Chineke Họpụtara.”
    reason: textual_variant
lexical_decisions:
- source_word: κἀγώ
  choice: Mụ onwe m
  rationale: Nke a na-egosipụta nkwụsi ike dị na ἐγώ ma kwe ka njikọ καί pụta site n’usoro ahịrịokwu ahụ; ọ bụkwa okwu Igbo dị ndụ ma doo anya.
- source_word: ἑώρακα
  choice: ahụla ya
  rationale: Ụdị perfect a na-egosi ihe Jọn hụrụ nke ka bụ ihe akaebe siri ike. Mgbakwunye ‘ya’ na-eme ka okwu ahụ daa nke ọma n’Igbo, ebe onye a na-ekwu maka ya doro anya n’ọnọdụ okwu.
- source_word: μεμαρτύρηκα
  choice: gbaakwa akaebe
  rationale: ‘Ịgba akaebe’ bụ ụzọ Igbo doro anya isi kwuo μαρτυρέω. Akara ‘-kwa’ na-ejikọta omume abụọ ahụ ma na-egosipụta καί nke abụọ.
- source_word: ὅτι
  choice: na
  rationale: N’ebe a, ὅτι na-ewebata ihe akaebe ahụ kwuru, ọ bụghị ihe kpatara ya; ‘na’ bụ njikọ Igbo kwesịrị ekwesị.
- source_word: οὗτός
  choice: onye a
  rationale: ‘Onye a’ na-echekwa ntụaka kpọmkwem nke okwu ngosi Grik ahụ ma na-ada nke ọma mgbe a na-ekwu maka mmadụ.
- source_word: ἐκλεκτός
  choice: Onye ... Họpụtara
  rationale: Adjective ahụ na-arụ ọrụ dịka aha. Usoro a na-egosi onye a họpụtara n'ụzọ doro anya ma ghara iji okwu ụka siri ike nghọta.
- source_word: τοῦ θεοῦ
  choice: Chineke
  rationale: ‘Onye Chineke Họpụtara’ bụ usoro Igbo sitere n’okike nke na-egosipụta na Chineke bụ onye họpụtara ya, ma na-echekwa njikọ dị n’aha nsọpụrụ ahụ.
theological_decisions:
- issue: Aha Kraịst na Jọn 1:34
  choice: Onye Chineke Họpụtara
  alternative: Nwa Chineke
  rationale: SBLGNT e nyere nwere ὁ ἐκλεκτὸς τοῦ θεοῦ, ya mere isiokwu bụ́ isi sụgharịrị ya kpọmkwem. E debere ọgụgụ ọzọ a ma ama, ‘Nwa Chineke,’ n’ala ala peeji ka a ghara ikpuchi ọdịiche dị n’ihe odide.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke dị ugbu a, kwanyere ugwu, ma dị mfe nghọta. A họọrọ ‘ịgba akaebe’ maka okwu Jọn ji eme ihe ugboro ugboro, ebe ‘Onye Chineke Họpụtara’ na-echekwa aha dị n’ihe odide SBLGNT.
