review_pass:
  verdict: revise
  source_fidelity: The draft faithfully conveys Jesus’ reply, the causal rhetorical question, the sighting under the fig tree, and the future promise. The comparative expression is semantically intended correctly but is not idiomatic Igbo in its present form.
  naturalness: “Jizọs zara ya sị” is natural narrative Igbo. “Ihe ndị ka ihe ndị a ukwuu” is awkward and should be recast as “ihe ndị karịrị ihe ndị a,” which is clear, natural, and retains the plural comparison. Standardizing the borrowed plant name as “fig” also avoids the unusual spelling “fiig.”
  terminology: “Jizọs,” “kwere,” and “osisi fig” are suitable Standard Igbo choices. No doctrinal expansion is present. The alternate interrogative arrangement represented in the English audit trail is retained in a footnote.
  issues:
  - severity: medium
    issue: The phrase “ihe ndị ka ihe ndị a ukwuu” is unnatural comparative Igbo.
    rationale: Although understandable, it calques the comparison and sounds cumbersome. “Ihe ndị karịrị ihe ndị a” naturally means “greater things than these” and preserves the Greek neuter-plural comparative μείζω τούτων.
  - severity: low
    issue: “Osisi fiig” uses an uncommon spelling for the borrowed name.
    rationale: “Osisi fig” is a more standard and readily recognizable modern written form; the referent remains the fig tree (συκῆ).
  - severity: low
    issue: The English audit trail preserves an alternative placement/force for the causal question, but the Igbo draft has no corresponding footnote anchor.
    rationale: A brief footnote can preserve this legitimate syntactic alternative without changing the main translation or implying a stronger rebuke.
  revised_text: Jizọs zara ya, sị, “Ì kwere n’ihi na m gwara gị na ahụrụ m gị n’okpuru osisi fig? Ị ga-ahụ ihe ndị karịrị ihe ndị a.”[a]
