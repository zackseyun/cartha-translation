  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῷ· Ὅτι εἶπόν σοι ⸀ὅτι εἶδόν σε ὑποκάτω τῆς συκῆς πιστεύεις; μείζω τούτων ⸀ὄψῃ.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/050.yaml
  text: Jesus answered and said to him[a], “Because I told you that I saw you under the fig tree, do you believe? You will see greater things than these.”
translation:
  language: ig
  text: Jizọs zara ya, sị, “Ì kwere n’ihi na m gwara gị na ahụrụ m gị n’okpuru osisi fig? Ị ga-ahụ ihe ndị karịrị ihe ndị a.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Ọ̀ bụ n’ihi na m gwara gị na ahụrụ m gị n’okpuru osisi fig ka i kwere?”
    reason: Na-echekwa nhazi ọzọ a pụrụ ịghọta nke ajụjụ Grik ahụ, dịka akwụkwọ ntụaka Bekee si gosi.
lexical_decisions:
- source_word: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῷ
  choice: Jizọs zara ya sị
  rationale: Nke a bụ ụzọ Igbo si akọ okwu mkparịta ụka n’ụzọ dị mma ma bụrụ nke ebumpụta ụwa; ọ na-egosipụta ma nzaghachi ahụ ma iwebata okwu ahụ n’enweghị ikwughachi ihe n’ụzọ na-adịghị eke eke.
- source_word: Ὅτι ... πιστεύεις;
  choice: Ì kwere n’ihi na ...?
  rationale: Usoro a na-edobe ajụjụ ahụ na ike ihe kpatara ya, ma na-eme ka ọ bụrụ Igbo doro anya. Ọ na-anabatakwa nhazi okwu Grik nke nwere ike ibute nghọta nke ajụjụ nkwupụta.
- source_word: εἶπόν σοι ὅτι εἶδόν σε
  choice: m gwara gị na ahụrụ m gị
  rationale: “Na” nke abụọ na-ewebata ọdịnaya nke ihe Jizọs kwuru, ebe “ahụrụ m” na-enye aorist ahụ dị ka ihe mere n’oge gara aga n’ụzọ Igbo nkịtị.
- source_word: ὑποκάτω τῆς συκῆς
  choice: n’okpuru osisi fiig
  rationale: Ọ na-edobe onyinyo ahụ kpọmkwem. “Osisi fiig” bụ aha mkpụrụ osisi ahụ nke ndị na-agụ Igbo nke oge a ga-aghọta nke ọma.
- source_word: πιστεύεις
  choice: Ì kwere
  rationale: “Ikwere” bụ okwu Igbo nkịtị maka πιστεύω n’akụkụ a, ma ọ naghị etinye nkọwa okpukpe ọzọ n’ihe odide ahụ.
- source_word: μείζω τούτων
  choice: ihe ndị ka ihe ndị a ukwuu
  rationale: Nke a na-edobe ụdị ọtụtụ nke okwu abụọ ahụ nakwa ntụnyere ahụ, ma bụrụkwa ahịrịokwu Igbo doro anya.
- source_word: ὄψῃ
  choice: Ị ga-ahụ
  rationale: Ọ na-egosipụta ọdịnihu n’ụzọ Igbo nke oge a, na-enweghị ụda ochie ma ọ bụ mgbakwunye.
theological_decisions:
- issue: Ike ajụjụ πιστεύεις;
  choice: 'E debere ya dịka ajụjụ nkwupụta: “Ì kwere ...?”'
  alternative: A pụrụ ịghọta ya dịka nkwupụta, “Ị kwere n’ihi na ...,” ma ọ bụ dịka mba mba dị nro.
  rationale: Nhazi okwu na ntụpọ ajụjụ nke ederede Grik na-akwado ajụjụ. Nsụgharị ahụ anaghị eme ka ọ bụrụ mba mba siri ike, kama ọ na-ahapụ esemokwu dị n’etiti okwukwe Netaniel na nkwa nke mkpughe ndị ka ukwuu.
- issue: Mmekọrịta nke Ὅτι na ajụjụ ahụ
  choice: 'E tinyere ihe kpatara ya n’ime ajụjụ ahụ: “Ì kwere n’ihi na ...?”'
  alternative: “N’ihi na m gwara gị ... ì kwere?”
  rationale: Nhọrọ bụ isi bụ Igbo kachasị eke eke ma na-edobe ihe okwu ahụ pụtara. Nhọrọ ọzọ na-esochi usoro Grik nso karị, ma ọ nwere ike ịdị ntakịrị arọ ma ọ bụ doo anya obere n’Igbo.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E jiri “Jizọs” na “osisi fiig” mee ihe dịka ụdị okwu a na-ahụkarị ma doo anya. Enweghị okwu ochie ma ọ bụ nkọwa ụka e tinyere.
