  variant: Standard Igbo
source:
  edition: SBLGNT
  text: λέγει αὐτῷ Ναθαναήλ· Πόθεν με γινώσκεις; ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῷ· Πρὸ τοῦ σε Φίλιππον φωνῆσαι ὄντα ὑπὸ τὴν συκῆν εἶδόν σε.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/048.yaml
  text: Nathanael said to him[a], “How do you know me?” Jesus answered and said to him, “Before Philip called you, while you were under the fig tree, I saw you.”
translation:
  language: ig
  text: Nataniel sịrị ya, “Olee otú i si mara m[a]?” Jizọs zara ya sị, “Tupu Filip akpọọ gị, mgbe ị nọ n’okpuru osisi fig ahụ, ahụrụ m gị.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n’ụzọ nkịtị karị, “Olee ebe ị si mara m?”
    reason: lexical_alternative
lexical_decisions:
- source_word: Πόθεν με γινώσκεις
  choice: Olee otú i si mara m?
  rationale: This is natural Standard Igbo for asking the basis or manner of Jesus’ knowledge. The more formally literal spatial wording is preserved in footnote [a].
- source_word: ἀπεκρίθη ... καὶ εἶπεν
  choice: zara ya sị
  rationale: This standard Igbo speech formula naturally conveys both ‘answered’ and ‘said’ without sounding needlessly repetitive.
- source_word: Πρὸ τοῦ σε Φίλιππον φωνῆσαι
  choice: Tupu Filip akpọọ gị
  rationale: ‘Tupu’ clearly marks prior time, while ‘akpọọ’ gives the ordinary contextual sense of Philip calling Nathanael.
- source_word: ὄντα ὑπὸ τὴν συκῆν
  choice: mgbe ị nọ n’okpuru osisi fiig ahụ
  rationale: This naturally expresses the circumstantial participle and identifies Nathanael as being under the particular fig tree.
- source_word: εἶδόν σε
  choice: ahụrụ m gị
  rationale: The simple past accurately renders the aorist; the preceding clause already establishes that the seeing occurred before Philip’s call.
theological_decisions:
- issue: Nature of Jesus’ knowledge of Nathanael
  choice: State simply that Jesus saw Nathanael before Philip called him.
  alternative: Explicitly describe the sight as supernatural or reduce it to ordinary prior observation.
  rationale: The Greek reports Jesus’ prior sight but does not explain its mechanism. The translation therefore preserves the narrative’s theological tension.
translation_notes:
  register: Natural, current, and dignified Standard Igbo. Familiar biblical name forms are used, and the sentence remains understandable without resolving how Jesus saw or knew Nathanael.
source_grounding:
  english_pob_role: consult_only
