  to: Ìhè ahụ na-enwu n’ọchịchịrị, ọchịchịrị ahụ emerighịkwa ya.[a]
  rationale: The revision replaces the adversative conjunction with the natural additive suffix “-kwa,” more closely reflecting καί while retaining fluent Igbo. The footnote is retained and lightly clarified to identify the referenced clause and preserve the ambiguity between overcoming, seizing/grasping, and understanding.
