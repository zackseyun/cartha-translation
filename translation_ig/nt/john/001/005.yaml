id: JHN.1.5
reference: John 1:5
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ τὸ φῶς ἐν τῇ σκοτίᾳ φαίνει, καὶ ἡ σκοτία αὐτὸ οὐ κατέλαβεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/005.yaml
  text: And the light shines in the darkness[a], and the darkness has not overcome it.
translation:
  language: ig
  text: Ìhè ahụ na-enwu n’ọchịchịrị, ọchịchịrị ahụ emerighịkwa ya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị akụkụ ikpeazụ a, “ọchịchịrị ahụ aghọtaghị ya” ma ọ bụ “ọchịchịrị ahụ ejideghị ya.” Ngwaa Grik ahụ nwekwara ike ịpụta imeri, ijide, ma ọ bụ ịghọta.
    reason: alternative_reading
lexical_decisions:
- source_word: φῶς
  choice: Ìhè ahụ
  rationale: Aha ngosipụta “ahụ” na-egosipụta na ọ bụ ìhè ahụ a kpọtụrụla aha n’okwu mmalite Jọn, ma na-echekwa ntụaka doro anya nke Greek.
- source_word: σκοτίᾳ / σκοτία
  choice: ọchịchịrị / ọchịchịrị ahụ
  rationale: N’ebe mbụ, usoro Igbo eke anaghị achọ ka e tinye “ahụ” mgbe e ji “n’ọchịchịrị” kwuo ọnọdụ; n’ebe nke abụọ, “ọchịchịrị ahụ” na-eme ka ọdịiche e mere ka ọ dị ka onye n’etiti ìhè na ọchịchịrị pụta ìhè.
- source_word: φαίνει
  choice: na-enwu
  rationale: Nke a na-egosipụta omume na-aga n’ihu nke present indicative n’Igbo eke.
- source_word: κατέλαβεν
  choice: emerighị
  rationale: N’ihe atụ nke ọgụ dị n’etiti ìhè na ọchịchịrị, “emerighị” dabara nke ọma; agbanyeghị, ngwaa Greek nwekwara ike ịpụta ịghọta ma ọ bụ ijide, ya mere e debere nghọta ndị ahụ n’ala ala peeji.
- source_word: αὐτὸ
  choice: ya
  rationale: “Ya” na-ezo aka n’ìhè ahụ n’ụzọ eke n’Igbo, n’enweghị ịmanye nkọwa banyere onye n’ahịrịokwu a.
theological_decisions:
- issue: Ihe κατέλαβεν pụtara n’ọdịiche dị n’etiti ìhè na ọchịchịrị
  choice: emerighị ya
  alternative: aghọtaghị ya ma ọ bụ ejideghị ya
  rationale: Greek nwere ike ibu ma echiche nke imeri n’ọgụ ma nke ijide ma ọ bụ ịghọta. Ihe atụ nke ìhè na ọchịchịrị na-akwado “imeri” n’ahịrịokwu bụ isi, ebe nkọwa ala peeji na-echekwa mgbagwoju anya ahụ.
translation_notes:
  register: Standard Igbo dị ugbu a, nke dị mfe nghọta ma dịkwa ùgwù. E ji usoro “na-enwu” gosipụta omume na-aga n’ihu; e zere okwu ụka pụrụ iche.
