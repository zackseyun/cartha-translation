id: JHN.1.26
reference: John 1:26
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀπεκρίθη αὐτοῖς ὁ Ἰωάννης λέγων· Ἐγὼ βαπτίζω ἐν ὕδατι· ⸀μέσος ὑμῶν ⸀ἕστηκεν ὃν ὑμεῖς οὐκ οἴδατε,
base_translation:
  language: en
  yaml_path: translation/nt/john/001/026.yaml
  text: John answered them[a], saying, “I baptize in water. Among you stands one whom you do not know,”
translation:
  language: ig
  text: 'Jọn zara ha, sị: “Ana m eme baptizim na mmiri. Otu onye guzo n’etiti unu, onye unu na-amaghị.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη αὐτοῖς
  choice: zara ha
  rationale: Nke a bụ ụzọ Igbo nkịtị na nke doro anya si ekwu na mmadụ nyere ndị ọzọ azịza.
- source_word: λέγων
  choice: sị
  rationale: “Sị” na-ewebata ihe Jọn kwuru n'ụzọ ebumpụta ụwa, ma na-edobe ọrụ participle Grik ahụ.
- source_word: βαπτίζω
  choice: eme baptizim
  rationale: “Baptizim” bụ okwu ụka a maara nke ọma, ọ naghịkwa amanye nkọwa kpọmkwem banyere otú e si eji mmiri eme ya.
- source_word: ἐν ὕδατι
  choice: na mmiri
  rationale: “Na mmiri” na-edobe ohere nghọta dị na ἐν—ma dịka ebe ihe ahụ na-eme ma dịka ihe e ji eme ya—na-enweghị ịmanye otu nkọwa.
- source_word: μέσος ὑμῶν
  choice: n’etiti unu
  rationale: Nke a bụ okwu Igbo doro anya maka ịnọ n’ime ìgwè ndị a na-agwa okwu.
- source_word: ἕστηκεν
  choice: guzo
  rationale: Ọ na-egosi ọnọdụ dị ugbu a nke onye ahụ guzo, dịka perfect Grik ahụ si arụ ọrụ n’ebe a.
- source_word: ὃν ὑμεῖς οὐκ οἴδατε
  choice: onye unu na-amaghị
  rationale: Nke a na-edobe okwu sara mbara bụ “ịma” ma ghara ime ka ọ bụrụ naanị na ha amataghị onye ahụ n’ihu.
- source_word: ὁ Ἰωάννης
  choice: Jọn
  rationale: E debere naanị aha onye ahụ dịka ederede Grik si mee, na-agbakwụnyeghị “Onye Na-eme Baptizim.”
theological_decisions:
- issue: Onye bụ onye ahụ a na-akpọghị aha, bụ́ onye guzo n’etiti ha
  choice: “Otu onye” na-enweghị ịkpọ ya Mesaya ma ọ bụ Jizọs
  alternative: “Mesaya” ma ọ bụ “Jizọs”
  rationale: Ọ bụ ezie na amaokwu ndị gbara ya gburugburu na-eme ka a mata onye ọ bụ, amaokwu a akpọghị ya aha. Nsụgharị ahụ na-edobe nchegharị na esemokwu akụkọ ahụ kama idozi ya tupu oge ya.
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ “na mmiri” iji zere ịmanye ọdịiche ụka banyere usoro baptizim, ebe “otu onye” na-edobe onye ahụ n’amaghị aha dịka ederede si mee.
