- from: Ọ sịrị[a], “Abụ m olu onye na-eti mkpu n’ọzara, ‘Meenụ ka ụzọ Onyenwe anyị kwụ ọtọ,’ dị ka Aịzaya onye amụma kwuru.”
  to: Ọ sịrị[a], “Abụ m olu onye na-eti mkpu n’ọzara, ‘Meenụ ka ụzọ Onyenweanyị kwụ ọtọ,’ dị ka Aịzaya onye amụma kwuru.”
  rationale: The revision regularizes the established Standard Igbo biblical form ‘Onyenweanyị’ for ‘the Lord,’ avoiding an unintended explicit possessive reading. It also makes a minor stylistic improvement to the alternative-reading footnote. No change is made to the source meaning, the preserved syntactic ambiguity, or the plural force of the imperative.
