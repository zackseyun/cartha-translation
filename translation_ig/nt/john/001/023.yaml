id: JHN.1.23
reference: John 1:23
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἔφη· Ἐγὼ φωνὴ βοῶντος ἐν τῇ ἐρήμῳ· Εὐθύνατε τὴν ὁδὸν κυρίου, καθὼς εἶπεν Ἠσαΐας ὁ προφήτης.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/023.yaml
  text: He said[a], “I am a voice of one crying out in the wilderness, ‘Make straight the way of the Lord,’ just as Isaiah the prophet said.”
translation:
  language: ig
  text: Ọ sịrị[a], “Abụ m olu onye na-eti mkpu n’ọzara, ‘Meenụ ka ụzọ Onyenweanyị kwụ ọtọ,’ dị ka Aịzaya onye amụma kwuru.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ, n’agbanyeghị na ọ yikarịghị ka ọ bụ ya: Ọ sịrị, “Abụ m olu n’ọzara nke onye na-eti mkpu.” Enwere ike ịhazi nkebiokwu Grik ahụ n’ụzọ ọzọ, ma ihe dị n’ahụ amaokwu bụ ọgụgụ ya kacha ebumpụta ụwa n’ebe a.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἔφη
  choice: Ọ sịrị
  rationale: Nke a bụ ụzọ Igbo nkịtị na nke doro anya e si ewebata okwu mmadụ n’akụkọ; onye okwu ahụ na-ezo aka na ya pụtara ìhè n’ihe gbara amaokwu a gburugburu.
- source_word: Ἐγὼ
  choice: Abụ m
  rationale: Ọ na-egosi njirimara onye na-ekwu okwu n’ụzọ Igbo dị mma. Ọ bụ ezie na nnọchiaha Grik ahụ nwere nkwusi ike, itinye “mụ onwe m” ga-adị arọ n’ebe a ma ọ dịghị mkpa iji mee ka ọdịiche ahụ doo anya.
- source_word: φωνὴ
  choice: olu
  rationale: “Olu” na-echekwa ihe atụ ahụ kpọmkwem ma na-ada nke ọma n’Igbo n’ahịrịokwu “Abụ m olu onye...”
- source_word: βοῶντος
  choice: onye na-eti mkpu
  rationale: Nke a na-echekwa ike na ọdịdị amụma nke ngwaa ahụ karịa okwu dị nro dịka “onye na-akpọ oku.”
- source_word: ἐν τῇ ἐρήμῳ
  choice: n’ọzara
  rationale: “Ọzara” bụ okwu Igbo doro anya maka ebe tọgbọrọ n’efu ma dabara n’ọnọdụ Jọn na n’amaokwu Aịzaya e hotara.
- source_word: Εὐθύνατε
  choice: Meenụ ka ... kwụ ọtọ
  rationale: Ụdị iwu a bụ Igbo ebumpụta ụwa, na-echekwa arịrịọ ka e mee ụzọ ahụ ka ọ kwụ ọtọ.
- source_word: τὴν ὁδὸν
  choice: ụzọ
  rationale: “Ụzọ” na-eburu ma ihe ụzọ pụtara n’ezie ma ihe atụ ime mmụọ ya, n’enweghị ime ka ọ bụrụ naanị okporo ụzọ.
- source_word: κυρίου
  choice: Onyenwe anyị
  rationale: Nke a bụ aha nsọpụrụ Igbo a na-ejikarị emegharị κύριος n’ebe ọ na-ebu ibu nke aha Chineke, karịsịa n’okwu e hotara n’Aịzaya.
- source_word: καθὼς
  choice: dị ka
  rationale: Ọ na-egosi n’ụzọ doro anya na njirimara Jọn kwekọrọ n’ihe Aịzaya kwuru.
- source_word: εἶπεν
  choice: kwuru
  rationale: “Kwuru” bụ okwu Igbo nkịtị na nke ziri ezi maka usoro e ji akpọpụta okwu amụma e hotara.
- source_word: Ἠσαΐας ὁ προφήτης
  choice: Aịzaya onye amụma
  rationale: Ọ na-agbaso usoro okwu Grik nke ọma ma bụrụkwa Igbo dị mfe nghọta na nke dị ùgwù.
theological_decisions:
- issue: Nsụgharị κύριος n’okwu Aịzaya e hotara
  choice: Onyenwe anyị
  alternative: onye nwe
  rationale: “Onyenwe anyị” na-echekwa ibu ọgbụgba ndụ na nsọpụrụ dị n’aha ahụ n’okwu Aịzaya, ghara ime ka ihe ọ pụtara dị nro dịka naanị onye nwe ma ọ bụ nna ukwu.
- issue: Ihe “n’ọzara” na-akọwa
  choice: onye na-eti mkpu n’ọzara
  alternative: olu dị n’ọzara nke onye na-eti mkpu
  rationale: Nhazi Grik ahụ nwere ike ikwe ka e jikọta nkebiokwu ahụ n’ụzọ abụọ, ma ọgụgụ kacha ebumpụta ụwa ebe a bụ na onye ahụ na-eti mkpu n’ọzara. E debere nhọrọ ọzọ n’ala ala peeji kama idozi mgbagwoju anya ahụ kpamkpam.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta mee ihe. E chekwara ihe atụ nke “olu,” “ọzara,” na “ụzọ,” tinyere ụda iwu nke okwu amụma ahụ. Akara [a] dị n’ahụ amaokwu ma kwekọọ na nkọwa ala ala peeji.
