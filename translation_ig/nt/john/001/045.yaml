- from: 'Filip chọtara Nataniel wee sị ya, “Anyị achọtala onye ahụ Mosis dere banyere ya n’Iwu ahụ, onye ndị amụma dekwara banyere ya[a]: Jisọs nwa Josef, onye si Nazaret[b].”'
  to: 'Filip chọtara Nataniel wee sị ya, “Anyị achọtala onye Mosis dere banyere ya n’Iwu ahụ, ndị amụma dekwara banyere ya[a]: Jisọs nwa Josef, onye si Nazaret[b].”'
  rationale: The revision preserves the Greek’s one shared relative referent and its two coordinated scriptural witnesses, while retaining the draft’s natural narrative tense, perfect-result expression, names, and restrained theological register. Footnote a is recast so that it accurately describes the Greek-relative construction and remains anchored at the relevant clause.
