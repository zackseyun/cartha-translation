id: JHN.1.45
reference: John 1:45
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εὑρίσκει Φίλιππος τὸν Ναθαναὴλ καὶ λέγει αὐτῷ· Ὃν ἔγραψεν Μωϋσῆς ἐν τῷ νόμῳ καὶ οἱ προφῆται εὑρήκαμεν, ⸀Ἰησοῦν υἱὸν τοῦ Ἰωσὴφ τὸν ἀπὸ Ναζαρέτ.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/045.yaml
  text: 'Philip found Nathanael and said to him[a], “We have found him of whom Moses in the Law and also the prophets wrote: Jesus son of Joseph[b], from Nazareth.”'
translation:
  language: ig
  text: 'Filip chọtara Nataniel wee sị ya, “Anyị achọtala onye Mosis dere banyere ya n’Iwu ahụ, ndị amụma dekwara banyere ya[a]: Jisọs nwa Josef, onye si Nazaret[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'N''ụzọ dị nso n’usoro okwu Grik: “Onye Mosis dere banyere ya n’Iwu ahụ, ndị amụma dekwara banyere ya.”'
    reason: lexical_alternative
  - marker: b
    text: Grik kwuru kpọmkwem “onye si Nazaret,” ọ bụghị nanị aha ọdịnala yiri “Jisọs onye Nazaret.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εὑρίσκει
  choice: chọtara
  rationale: Ọ bụ ezie na Grik ji historical present, oge gara aga na-enye usoro akụkọ dị ndụ ma dịkwa eke n’Igbo.
- source_word: λέγει
  choice: wee sị ya
  rationale: “Wee sị ya” na-ejikọta omume abụọ ahụ n’usoro akụkọ Igbo n’enweghị ịgbanwe ihe Grik kwuru.
- source_word: Ὃν ... ἔγραψεν
  choice: onye ahụ ... dere banyere ya
  rationale: Nke a na-egosi nke ọma na ihe e dere metụtara otu onye, ma na-adịkwa eke n’Igbo.
- source_word: ἐν τῷ νόμῳ
  choice: n’Iwu ahụ
  rationale: Mkpụrụedemede ukwu na “ahụ” na-egosi Iwu Akwụkwọ Nsọ e jikọtara ya na Mosis, ọ bụghị iwu n’ozuzu.
- source_word: οἱ προφῆται
  choice: ndị amụma
  rationale: Nke a bụ okwu Igbo a na-aghọta nke ọma maka ndị amụma na akaebe amụma dị n’Akwụkwọ Nsọ.
- source_word: εὑρήκαμεν
  choice: anyị achọtala
  rationale: 'Ụdị a na-echekwa ike perfect nke Grik: nchọpụta ahụ emeela, ihe si na ya pụta ka dị ugbu a.'
- source_word: υἱὸν τοῦ Ἰωσὴφ
  choice: nwa Josef
  rationale: Nke a na-edobe njirimara mmadụ Filip kwuru n’ụzọ kwụ ọtọ, n’etinyeghị nkọwa ozizi ọzọ n’amaokwu ahụ.
- source_word: τὸν ἀπὸ Ναζαρέτ
  choice: onye si Nazaret
  rationale: “Si” na-anọchi anya ἀπό nke ọma ma na-egosi ebe o si ma ọ bụ ebe e ji mara ya, karịa nanị ịkpọ ya aha obodo ahụ.
- source_word: Ναθαναὴλ / Φίλιππος / Μωϋσῆς / Ἰησοῦν / Ἰωσὴφ
  choice: Nataniel / Filip / Mosis / Jisọs / Josef
  rationale: A sụgharịrị aha ndị ahụ n’usoro mkpụrụokwu dabara n’Igbo Standard ma dị mfe ndị na-agụ Igbo ịkpọ.
theological_decisions:
- issue: Ihe “nwa Josef” pụtara n’ihe gbasara onye Kraịst bụ
  choice: E debere okwu Filip kpọmkwem dịka “Jisọs nwa Josef.”
  alternative: “Jisọs, onye e chere na ọ bụ nwa Josef” ma ọ bụ “Jisọs, nwa Josef n’usoro iwu/obodo”
  rationale: Amaokwu a na-akọ ụzọ Filip si kọwaa Jisọs n’oge ahụ. Ịgbakwunye “onye e chere” ga-etinye nkọwa na-adịghị n’okwu Grik ma gbanwee olu onye na-ekwu okwu.
- issue: Oke akaebe “Mosis n’Iwu ahụ” na “ndị amụma”
  choice: E gosiri Mosis na ndị amụma dịka ndị dere banyere onye ahụ.
  alternative: Ijikọta ha n’otu ahịrịokwu nke nwere ike ime ka o doo anya na Mosis so ná ndị amụma ma ọ bụ mee ka naanị Mosis bụrụ onye dere
  rationale: Nke a na-echekwa ndị na-eme ihe abụọ dị na Grik—Mosis na ndị amụma—n’enweghị ịkọwa kpọmkwem ụdị amụma ma ọ bụ amaokwu ndị Filip bu n’uche.
translation_notes:
  register: Asụsụ ahụ bụ Igbo Standard nke oge a, dị ugwu ma dị mfe nghọta. “Wee sị ya” na-eme ka akụkọ na-aga nke ọma; “anyị achọtala” na-echekwa mmetụta nke nchọpụta ka dị ugbu a. E tinyere akara ukwu n’“Iwu” iji gosi akụkụ Akwụkwọ Nsọ, ma e zere okwu ụka pụrụ iche.
