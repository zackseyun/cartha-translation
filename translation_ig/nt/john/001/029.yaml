id: JHN.1.29
reference: John 1:29
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Τῇ ἐπαύριον βλέπει τὸν Ἰησοῦν ἐρχόμενον πρὸς αὐτόν, καὶ λέγει· Ἴδε ὁ ἀμνὸς τοῦ θεοῦ ὁ αἴρων τὴν ἁμαρτίαν τοῦ κόσμου.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/029.yaml
  text: The next day he sees Jesus coming toward him and says, “Look, the Lamb of God, who takes away the sin of the world!”
translation:
  language: ig
  text: N’echi ya, ọ hụrụ Jizọs ka ọ na-abịakwute ya, wee sị, “Lee, Nwa Atụrụ Chineke, onye na-ewepụ mmehie nke ụwa!”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τῇ ἐπαύριον
  choice: N’echi ya
  rationale: Ụzọ Igbo nkịtị na nke doro anya isi kwuo ‘n’ụbọchị sochirinụ.’
- source_word: βλέπει
  choice: ọ hụrụ
  rationale: Aorist-style narration is most naturally rendered with the Igbo past form here, although the Greek uses the historical present.
- source_word: ὁ ἀμνὸς τοῦ θεοῦ
  choice: Nwa Atụrụ Chineke
  rationale: Preserves the sacrificial lamb image and the genitive relation without adding an interpretation.
- source_word: ὁ αἴρων
  choice: onye na-ewepụ
  rationale: Conveys removal or taking away while retaining the participial description.
- source_word: τὴν ἁμαρτίαν τοῦ κόσμου
  choice: mmehie nke ụwa
  rationale: Keeps the Greek singular ‘sin’ and the broad scope ‘of the world.’
theological_decisions:
- issue: The force of αἴρων
  choice: onye na-ewepụ
  alternative: onye na-ebu
  rationale: The verb can involve lifting, bearing, or removing. In this context, ‘ewepụ’ naturally expresses taking sin away without specifying the precise mechanism of atonement.
- issue: The singular ἁμαρτίαν
  choice: mmehie
  alternative: mmehie dị iche iche
  rationale: The singular is retained so the text can refer to sin collectively rather than being narrowed to individual sinful acts.
translation_notes:
  register: Standard Igbo; natural, current, and dignified. The vivid Greek historical present is rendered as ordinary Igbo past narration for fluency, while “Lee” preserves the direct attention-command of Ἴδε.
