  text: καὶ ἤκουσαν ⸂οἱ δύο μαθηταὶ αὐτοῦ⸃ λαλοῦντος καὶ ἠκολούθησαν τῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/037.yaml
  text: And the two disciples heard him speaking[a], and they followed Jesus.
translation:
  language: ig
  text: Ndị na-eso ụzọ abụọ ahụ[a] nụrụ ka ọ na-ekwu okwu, ha wee soro Jizọs.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị na-eso ụzọ ya abụọ”; “ya” na-ekwu maka Jọn Onye Na-eme Baptizim.
    reason: alternative_reading
lexical_decisions:
- source_word: ἤκουσαν
  choice: nụrụ
  rationale: Okwu a na-egosi na ha nụrụ ihe a na-ekwu n’otu oge ahụ; “nụrụ” bụ okwu Igbo nkịtị ma doo anya.
- source_word: οἱ δύο μαθηταὶ αὐτοῦ
  choice: ndị na-eso ụzọ abụọ ahụ
  rationale: N’ọnọdụ a, okwu ahụ na-arụtụ aka n’ụmụazụ Jọn abụọ a kpọtụrụ aha n’amaokwu bu ụzọ. Ịsị “ndị na-eso ụzọ abụọ ahụ” na-eme ka njikọ ahụ doo anya n’Igbo ma zere ka “ya” bụrụ ihe a pụrụ iwere na ọ na-arụtụ aka na Jizọs.
- source_word: λαλοῦντος
  choice: ka ọ na-ekwu okwu
  rationale: Usoro a na-egosi omume na-aga n’ihu n’otu oge ahụ ha nụrụ ya, kwekọọkwa n’ọrụ participle nke dị n’asụsụ Grik.
- source_word: ἠκολούθησαν
  choice: ha wee soro
  rationale: “Soro” nwere ike ịpụta iso mmadụ n’ụzọ nkịtị, ma nwee ike iburu echiche nke ịbụ onye na-eso ụzọ ya; ya mere, ọ na-echekwa ọkwa abụọ ahụ dị n’akụkọ a.
- source_word: τῷ Ἰησοῦ
  choice: Jizọs
  rationale: Dative a na-egosi onye ha soro. N’Igbo, a na-etinye aha onye ahụ ozugbo n’azụ ngwaa “soro.”
theological_decisions:
- issue: Onye αὐτοῦ (‘ya’) na-arụtụ aka na ya
  choice: A ghọtara ya dị ka Jọn Onye Na-eme Baptizim; isi ederede kpọrọ ha “ndị na-eso ụzọ abụọ ahụ.”
  alternative: A pụrụ ịsụgharị ya kpọmkwem dị ka “ndị na-eso ụzọ ya abụọ,” nke nwere ike ịhapụ onye “ya” na-arụtụ aka na ya n’amaghị ama.
  rationale: Jọn 1:35–36 kwuru na Jọn na ụmụazụ ya abụọ nọ ebe ahụ mgbe o kwuru okwu banyere Jizọs. N’ihi ya, ụmụazụ abụọ ahụ bụ nke Jọn, ọ bụghị nke Jizọs n’oge ahụ. Nsụgharị a na-eme ka njikọ akụkọ ahụ doo anya n’enweghị itinye nkọwa ụka pụrụ iche.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị mfe nghọta ma nwee ugwu. “Ndị na-eso ụzọ” bụ okwu a na-anụkarị maka μαθηταί, ebe usoro “ha wee soro” na-edebe ịdị mfe na ọsọ nke akụkọ ahụ.
