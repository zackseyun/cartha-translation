  text: καὶ εἶπεν αὐτῷ Ναθαναήλ· Ἐκ Ναζαρὲτ δύναταί τι ἀγαθὸν εἶναι; λέγει αὐτῷ ⸀ὁ Φίλιππος· Ἔρχου καὶ ἴδε.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/046.yaml
  text: And Nathanael said to him[a], “Can anything good come from Nazareth?” Philip said to him, “Come and see.”
translation:
  language: ig
  text: Nataniel sịrị ya, “Ọ̀ nwere ihe ọma ọ bụla pụrụ isi na Nazaret pụta?[a]” Filip sịrị ya, “Bịa hụ.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n'ụzọ nkịtị karịa, “Ọ̀ nwere ihe ọma ọ bụla pụrụ isi na Nazaret ịdị?”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ εἶπεν αὐτῷ Ναθαναήλ
  choice: Nataniel sịrị ya
  rationale: A tụgharịrị njikọ καὶ n'ụzọ kwekọrọ n'ọsọ akụkọ Igbo, ebe ọ dịghị mkpa ịmalite ahịrịokwu a na “Na.” “Sịrị ya” na-egosi nke ọma okwu a gwara onye ahụ.
- source_word: Ἐκ Ναζαρὲτ
  choice: isi na Nazaret pụta
  rationale: ἐκ na-egosi ebe ihe si malite. N'Igbo, “isi na ... pụta” bụ ụzọ doro anya ma bụrụkwa nke e ji asụkarị maka ihe si n'otu ebe bịa.
- source_word: δύναταί τι ἀγαθὸν εἶναι
  choice: Ọ̀ nwere ihe ọma ọ bụla pụrụ ... pụta?
  rationale: Nhazi a na-eweta ajụjụ banyere ma ihe ọma ọ bụla ò nwere ike isi ebe ahụ bịa, n'Igbo dị mfe ma dị ndụ, n'agbanyeghị na εἶναι pụtara n'ụzọ nkịtị “ịdị.”
- source_word: λέγει αὐτῷ ὁ Φίλιππος
  choice: Filip sịrị ya
  rationale: A gbanwere historical present Grik ka ọ bụrụ oge gara aga n'Igbo iji mee ka akụkọ ahụ na-aga nke ọma n'asụsụ a na-asụ ugbu a.
- source_word: Ἔρχου καὶ ἴδε
  choice: Bịa hụ
  rationale: Nke a na-echekwa iwu abụọ ahụ dị n'okwu Grik n'ụzọ dị mkpirikpi ma kwekọọ n'Igbo; “hụ” na-ebukwa echiche nke ịhụ ma mata n'onwe onye.
theological_decisions:
- issue: Ụda ajụjụ Nataniel banyere Nazaret
  choice: E debere ya dị ka ajụjụ na-egosi obi abụọ, n'etinyeghị okwu na-eme ka ọ bụrụ ịkwa emo ma ọ bụ nlelị siri ike.
  alternative: Ịsụgharị ya n'okwu ndị ga-egosi nlelị doro anya megide Nazaret.
  rationale: Okwu Grik na-egosi obi abụọ, ma ọ naghị akọwa kpọmkwem na Nataniel kwuru ya n'ịkwa emo. Nsụgharị ahụ na-ahapụ esemokwu ahụ ka ọ dị.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E dere aha ndị mmadụ na ebe dịka “Nataniel,” “Filip,” na “Nazaret” n'ụdị dabara n'usoro mkpụrụokwu Igbo. Akara [a] dị n'ahịrịokwu ukwu ma kwekọọ na nkọwa ala peeji.
