revisions:
- from: Ha jụkwara ya, sị ya, “Gịnịzi mere i ji eme ndị mmadụ baptizim, ma ọ bụrụ na ị bụghị Mesaịa[a], maọbụ Ịlaịja, maọbụ Onye Amụma ahụ[b]?”
  to: 'Ha jụrụ ya, sị: “Gịnịzi mere i ji eme baptizim, ma ọ bụrụ na ị bụghị Mesaịa[a], ọ bụghịkwa Ịlaịja, ọ bụghịkwa Onye Amụma ahụ[b]?”'
  rationale: Ndozigharị a na-edobe ngwaa abụọ ahụ, “jụrụ” na “sị,” na ajụjụ kpatara omume na-aga n’ihu. Ọ na-ewepụ mgbakwunye na-enweghị isi mmalite (“ndị mmadụ”), na-asụgharị usoro negeshọn ugboro abụọ n’ụzọ dabara adaba n’Igbo, ma na-eme ka nkọwa ala peeji (a) bụrụ nke eke ma doo anya. Akara [a] na [b] ka nọ n’akụkụ okwu ha na-akọwa.
