  naturalness: “Ha jụrụ ya, sị:” na “Gịnịzi mere i ji eme baptizim” bụ Igbo Izugbe dị ire ma na-edobe usoro akụkọ ahụ. E deziekwara nkọwa ala peeji (a), nke okwu ya adịghị eke n’ụdị e nyere.
  terminology: “Mesaịa,” “Ịlaịja,” na “Onye Amụma ahụ” kwesịrị ekwesị. “Onye Amụma ahụ” na-echekwa ọdịdị utu aha nke ὁ προφήτης n’enweghị ikpebi onye ọ bụ kpọmkwem; nkọwa ala peeji na-akọwa njikọ a pụrụ inwe na Diuterọnọmi 18:15.
