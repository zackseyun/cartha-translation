id: JHN.1.25
reference: John 1:25
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἠρώτησαν αὐτὸν καὶ εἶπαν αὐτῷ· Τί οὖν βαπτίζεις εἰ σὺ οὐκ εἶ ὁ χριστὸς ⸂οὐδὲ Ἠλίας οὐδὲ⸃ ὁ προφήτης;
base_translation:
  language: en
  yaml_path: translation/nt/john/001/025.yaml
  text: And they asked him and said to him[a], “Why then are you baptizing, if you are not the Messiah, nor Elijah[b], nor the Prophet?”
translation:
  language: ig
  text: 'Ha jụrụ ya, sị: “Gịnịzi mere i ji eme baptizim, ma ọ bụrụ na ị bụghị Mesaịa[a], ọ bụghịkwa Ịlaịja, ọ bụghịkwa Onye Amụma ahụ[b]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ “Kraịst.” Utu aha Grik bụ Χριστός (Christos); a sụgharịrị ya ebe a dịka “Mesaịa” iji chekwaa ihe ndị Juu tụrụ anya banyere Mesaịa.
    reason: alternative_reading
  - marker: b
    text: “Onye Amụma ahụ” nwere ike ịbụ onye amụma ahụ a na-atụ anya ya, onye ga-adị ka Mosis (lee Diuterọnọmi 18:15).
    reason: cross_reference
lexical_decisions:
- source_word: ἠρώτησαν ... καὶ εἶπαν αὐτῷ
  choice: Ha jụkwara ya, sị ya
  rationale: Nke a na-edebe ngwaa abụọ dị n’asụsụ Grik—‘jụrụ’ na ‘sịrị’—n’ụzọ na-aga were were n’akụkọ Igbo.
- source_word: Τί οὖν
  choice: Gịnịzi mere
  rationale: N’agbanyeghị na τί pụtara ‘gịnị’ n’ụdị ya nkịtị, n’ebe a ọ na-ajụ ihe kpatara omume ahụ; ‘Gịnịzi mere’ na-egosikwa ike nke οὖν.
- source_word: βαπτίζεις
  choice: i ji eme ndị mmadụ baptizim
  rationale: Ụdị ugbu a na-egosi omume Jọn na-aga n’ihu. Ịkpọ ‘ndị mmadụ’ aha na-eme ka ahịrịokwu ahụ doo anya n’Igbo, ebe ndị a na-eme baptizim dị n’ime nghọta ngwaa Grik ahụ.
- source_word: ὁ χριστός
  choice: Mesaịa
  rationale: N’ebe a Χριστός bụ utu aha nke onye ndị Juu na-atụ anya ya, ya mere ‘Mesaịa’ na-echekwa ọnọdụ na echiche ahụ karịa iji ya dịka aha mmadụ.
- source_word: Ἠλίας
  choice: Ịlaịja
  rationale: A sụgharịrị aha ahụ n’ụdị a maara nke ọma n’Igbo.
- source_word: ὁ προφήτης
  choice: Onye Amụma ahụ
  rationale: Mkpụrụokwu ὁ na-egosi otu onye amụma a maara ma na-atụ anya ya; ‘ahụ’ na-egosipụta nkọwa ahụ n’Igbo n’enweghị ịkọwapụta njirimara ya karịa ihe odide Grik kwuru.
- source_word: οὐδὲ ... οὐδὲ
  choice: maọbụ ... maọbụ
  rationale: Mgbe ọ na-esochi ‘ị bụghị,’ usoro a na-ejikọta nhọrọ abụọ ndị ọzọ a na-agọnahụ n’ụzọ ebumpụta ụwa n’Igbo.
theological_decisions:
- issue: Otu e si asụgharị Χριστός n’ajụjụ gbasara onye Jọn bụ
  choice: Mesaịa
  alternative: Kraịst
  rationale: Okwu ahụ bụ utu aha n’ọnọdụ ndị Juu na-atụ anya onye e tere mmanụ; ‘Mesaịa’ na-edebe ọnọdụ ahụ, ebe nkọwa ala peeji na-egosi ntụgharị ọzọ.
- issue: Ma ὁ προφήτης ọ bụ otu onye a kapịrị ọnụ ndị mmadụ na-atụ anya ya
  choice: Onye Amụma ahụ
  alternative: onye amụma
  rationale: Mkpụrụokwu Grik ahụ na-egosi onye a maara nke ọma, ma ntụgharị a anaghị ekpebi n’ahịrịokwu ukwu kpọmkwem onye ọ bụ. Nkọwa ala peeji na-enye njikọ o nwere ike inwe na Diuterọnọmi 18:15.
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E debere mmeghachi omume ‘jụrụ ... sị’ iji gosipụta ngwaa abụọ nke Grik. E tinyere akara nkọwa [a] n’akụkụ ‘Mesaịa’ na [b] n’akụkụ ‘Onye Amụma ahụ,’ ebe ọdịnaya nkọwa ndị ahụ metụtara kpọmkwem.
