id: JHN.1.33
reference: John 1:33
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: κἀγὼ οὐκ ᾔδειν αὐτόν, ἀλλ’ ὁ πέμψας με βαπτίζειν ἐν ὕδατι ἐκεῖνός μοι εἶπεν· Ἐφ’ ὃν ἂν ἴδῃς τὸ πνεῦμα καταβαῖνον καὶ μένον ἐπ’ αὐτόν, οὗτός ἐστιν ὁ βαπτίζων ἐν πνεύματι ἁγίῳ·
base_translation:
  language: en
  yaml_path: translation/nt/john/001/033.yaml
  text: And I did not know him[a], but the one who sent me to baptize in water said to me, ‘The one on whom you see the Spirit descending and remaining on him[c][b], this is he who baptizes in the Holy Spirit.’
translation:
  language: ig
  text: Mụ onwe m amaghị ya[a], ma Onye ahụ zitere m ime baptizim na mmiri gwara m, sị, “Onye ahụ ị ga-ahụ Mmụọ ka ọ na-agbadata ma na-anọgide n'elu ya[b], ọ bụ ya bụ onye na-eme baptizim na Mmụọ Nsọ[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “amataghị m onye ọ bụ.” Okwu Grik nwere ike ịpụta na ọ maghị ya ma ọ bụ na ọ matabeghị njirimara ya n'ọnọdụ a.
    reason: lexical_alternative
  - marker: b
    text: “Na-anọgide” bụ nsụgharị nke otu okwu dị mkpa n'akwụkwọ Jọn, nke nwekwara ike ịpụta “ịnọgide n'ebe” ma ọ bụ “ịdịgide.”
    reason: lexical_alternative
  - marker: c
    text: A pụkwara ịsị, “jiri mmiri mee baptizim” na “jiri Mmụọ Nsọ mee baptizim.” Grik ji otu preposition ahụ mee ihe n'okwu abụọ ahụ; isi ederede chekwara myirịta ahụ site n'iji “na” n'okwu abụọ ahụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀγὼ οὐκ ᾔδειν αὐτόν
  choice: Mụ onwe m amaghị ya
  rationale: “Mụ onwe m” na-egosipụta nkwusi ike dị na κἀγώ, ebe “amaghị ya” na-edobe nkọwa bụ́ isi nke οὐκ ᾔδειν αὐτόν n'Igbo dị mfe ma kwanyere ohere nkọwa nke ‘amataghị onye ọ bụ’ ugwu.
- source_word: ὁ πέμψας με
  choice: Onye ahụ zitere m
  rationale: Nke a na-asụgharị participle e ji article mee aha dị ka onye a kapịrị ọnụ, n'ụzọ dị ụtọ ma doo anya n'Igbo.
- source_word: βαπτίζειν ἐν ὕδατι
  choice: ime baptizim n'ime mmiri
  rationale: “Ime baptizim” bụ okwu a na-aghọta nke ọma n'Igbo; “n'ime mmiri” na-edobe ἐν ma na-echekwa myirịta ya na “n'ime Mmụọ Nsọ.”
- source_word: Ἐφ’ ὃν ἂν ἴδῃς
  choice: Onye ahụ ị ga-ahụ
  rationale: Nke a na-egosipụta akara e nyere Jọn iji mata onye ahụ, ma na-edobe nghọta nke ihe ọ ga-ahụ n'ọdịnihu.
- source_word: τὸ πνεῦμα καταβαῖνον
  choice: Mmụọ ka ọ na-agbadata
  rationale: “Mmụọ” na-ezo aka n'Mmụọ Chineke dịka okwu ikpeazụ n'amaokwu ahụ si mee ka o doo anya; “na-agbadata” na-egosipụta mmegharị ahụ n'ụzọ nkịtị.
- source_word: καὶ μένον ἐπ’ αὐτόν
  choice: na-anọgidekwa n'elu ya
  rationale: “Na-anọgide” na-echekwa isi echiche nke μένω, okwu dị mkpa n'akwụkwọ Jọn, karịa ịsị naanị na Mmụọ ‘nọ’ n'elu ya nwa oge.
- source_word: οὗτός ἐστιν ὁ βαπτίζων ἐν πνεύματι ἁγίῳ
  choice: ọ bụ ya bụ Onye na-eme baptizim n'ime Mmụọ Nsọ
  rationale: “Ọ bụ ya” na-edobe nkwupụta njirimara siri ike nke οὗτός ἐστιν; “n'ime Mmụọ Nsọ” na-echekwa preposition na myirịta ya na baptizim n'ime mmiri.
theological_decisions:
- issue: Njirimara nke πνεῦμα na πνεύματι ἁγίῳ
  choice: Mmụọ ... Mmụọ Nsọ
  alternative: mmụọ ... mmụọ nsọ
  rationale: Akụkụ ikpeazụ nke amaokwu ahụ kọwara na Mmụọ ahụ na-agbadata bụ Mmụọ Nsọ. Iji mkpụrụedemede ukwu egosipụta onye okwu ahụ na-ezo aka n'ebe a, ọ bụghị itinye ozizi ọzọ.
- issue: Ụzọ e si asụgharị ἐν n'okwu baptizim abụọ ahụ
  choice: n'ime mmiri ... n'ime Mmụọ Nsọ
  alternative: jiri mmiri ... jiri Mmụọ Nsọ
  rationale: Nhọrọ ahụ na-echekwa otu preposition Grik n'okwu abụọ ahụ na myirịta Jọn tinyere n'etiti ọrụ baptizim abụọ ahụ, n'agbanyeghị na Igbo nwekwara ike iji “jiri.”
- issue: Ihe οὐκ ᾔδειν pụtara n'ọnọdụ a
  choice: amaghị ya
  alternative: amataghị onye ọ bụ
  rationale: Grik nwere ike ịpụta na Jọn amaghị ya ma ọ bụ na ọ mataghị njirimara ya n'ọrụ a. Isi ederede na-ahọrọ okwu sara mbara ma tinye nkọwa nke ọzọ n'ala peeji.
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E ji “Onye ahụ” na “ọ bụ ya” chekwaa nkwusi ike nke ahịrịokwu Grik n'enweghị usoro okwu ochie ma ọ bụ nke na-adịghị atọ ụtọ n'Igbo. E debere “Mmụọ” na “Mmụọ Nsọ” na mkpụrụedemede ukwu maka onye Chineke okwu ahụ na-ezo aka.
