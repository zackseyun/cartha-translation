revisions:
- from: Mụ onwe m amaghị ya[a], ma Onye ahụ zitere m ime baptizim n'ime mmiri gwara m, sị, “Onye ahụ ị ga-ahụ Mmụọ ka ọ na-agbadata, na-anọgidekwa n'elu ya[b], ọ bụ ya bụ Onye na-eme baptizim n'ime Mmụọ Nsọ[c].”
  to: Mụ onwe m amaghị ya[a], ma Onye ahụ zitere m ime baptizim na mmiri gwara m, sị, “Onye ahụ ị ga-ahụ Mmụọ ka ọ na-agbadata ma na-anọgide n'elu ya[b], ọ bụ ya bụ onye na-eme baptizim na Mmụọ Nsọ[c].”
  rationale: The revision changes only the Igbo prepositional idiom for the two baptismal phrases, keeping the source’s deliberate parallel with “na ... / na ...”. It also makes the final descriptive noun lower-case and adjusts coordination in the Spirit clause for smoother Standard Igbo. The meaning and the existing footnote anchors are retained.
