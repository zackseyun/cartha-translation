  text: οὐκ ἦν ἐκεῖνος τὸ φῶς, ἀλλ’ ἵνα μαρτυρήσῃ περὶ τοῦ φωτός.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/008.yaml
  text: He was not the light[a], but came to bear witness about the light.
translation:
  language: ig
  text: Ọ bụghị ya bụ ìhè ahụ, kama ọ bịara ịgba akaebe banyere ìhè ahụ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ, n’ụzọ soro okwu Grik nso karị: “Ọ bụghị ya bụ ìhè ahụ, kama ka o wee gbaa akaebe banyere ìhè ahụ.” N’asụsụ Grik, e kwughị ngwaa bụ isi n’akụkụ nke abụọ kpọmkwem; a na-aghọta ya site n’ihe gbara ya gburugburu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ἦν ἐκεῖνος
  choice: Ọ bụghị ya bụ
  rationale: Nke a na-asụgharị nkw否 imperfect ahụ na nrụtụaka ἐκεῖνος n’ụzọ Igbo dị n’ụzọ eke, ma na-emesi ike na Jọn n’onwe ya abụghị ìhè ahụ.
- source_word: τὸ φῶς
  choice: ìhè ahụ
  rationale: ‘Ìhè’ bụ ihe kwekọrọ na φῶς; ‘ahụ’ na-egosipụta definite article ma na-arụtụ aka n’ìhè a kpọtụrụ aha n’okwu mmalite ahụ.
- source_word: ἀλλ’ ἵνα
  choice: kama ọ bịara
  rationale: Asụsụ Grik hapụrụ ngwaa nke akụkụ nke abụọ ka a ghọta ya site n’ihe gbara ya gburugburu. ‘Ọ bịara’ na-eme ka ahịrịokwu Igbo zuo oke ma na-egosipụta nzube Jọn nke amaokwu gara aga.
- source_word: μαρτυρήσῃ
  choice: ịgba akaebe
  rationale: Nke a na-echekwa echiche nke ịgba ama ma ọ bụ inye ihe akaebe dị na μαρτυρέω, ma bụrụkwa okwu Igbo doro anya ma dị ùgwù.
- source_word: περὶ τοῦ φωτός
  choice: banyere ìhè ahụ
  rationale: ‘Banyere’ na-asụgharị περί ya na genitive n’ụzọ Igbo nke oge a dị mfe nghọta.
theological_decisions:
- issue: Njirimara na ọrụ Jọn n’ebe ìhè ahụ nọ
  choice: E kwupụtara na Jọn abụghị ìhè ahụ, kama na ọ bịara ịgba akaebe banyere ya.
  alternative: 'A pụrụ ịsụgharị ya n’ụzọ gbasoro ọdịdị Grik nso karị: ‘Ọ bụghị ya bụ ìhè ahụ, kama ka o wee gbaa akaebe banyere ìhè ahụ.’'
  rationale: Nhọrọ a na-edobe ọdịiche dị n’etiti onye akaebe na ìhè ahụ n’enweghị ịgbakwunye nkọwa ozizi. ‘Ọ bịara’ bụ ngwaa e tinyere iji mejupụta ellipsis Grik dịka ihe gbara amaokwu ahụ gburugburu si dị.
translation_notes:
  register: Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E ji ‘ìhè ahụ’ mee ka nrụtụaka a kapịrị ọnụ pụta ìhè, ma jiri ‘ịgba akaebe’ chekwaa ụda nke ịgba ama dị n’okwu Grik.
