id: JHN.1.9
reference: John 1:9
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἦν τὸ φῶς τὸ ἀληθινὸν ὃ φωτίζει πάντα ἄνθρωπον ἐρχόμενον εἰς τὸν κόσμον.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/009.yaml
  text: The true light[a], which enlightens every person, was coming into the world.
translation:
  language: ig
  text: Ezi ìhè ahụ[a], nke na-enye mmadụ niile ìhè, nọ na-abịa n’ụwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ: “Ezi ìhè ahụ, nke na-enye onye ọ bụla na-abịa n’ụwa ìhè.” N’asụsụ Grik, okwu a sụgharịrị “na-abịa” nwere ike ịkọwa “onye ọ bụla” kama ịkọwa “ezi ìhè ahụ.”'
    reason: alternative_reading
lexical_decisions:
- source_word: φῶς
  choice: ìhè
  rationale: Okwu Igbo nkịtị maka ‘ìhè’; edoghị ya mkpụrụedemede ukwu, dị ka aha nkịtị Grik si dị, ọ bụ ezie na ebe a ọ na-arụtụ aka n’ebe Kraịst nọ.
- source_word: ἀληθινόν
  choice: ezi
  rationale: ‘Ezi’ na-egosi ihe bụ nke bụ́ eziokwu n’onwe ya, nke zuru oke ma bụrụ nke a pụrụ ịtụkwasị obi; ọ dabara n’otú Jọn si eji okwu a.
- source_word: φωτίζει
  choice: na-enye … ìhè
  rationale: Nke a bụ okwu Igbo doro anya ma dị ndụ nke na-echekwa ma ihe oyiyi nke ìhè ma echiche nke ime ka mmadụ hụ ma ghọta.
- source_word: πάντα ἄνθρωπον
  choice: mmadụ niile
  rationale: Ọ na-egosi onye ọ bụla n’ime mmadụ n’enweghị ime ka okwu ahụ bụrụ naanị banyere ndị nwoke; ọ bụkwa okwu Igbo nkịtị.
- source_word: ἐρχόμενον εἰς τὸν κόσμον
  choice: nọ na-abịa n’ụwa
  rationale: Isi ederede jikọtara participle a n’echiche ya na ‘ezi ìhè ahụ,’ dịka usoro okwu na isiokwu nke mmalite Jọn si kwado, ma ihe odide ala na-echekwa njikọ ọzọ Grik kwere omume.
- source_word: κόσμον
  choice: ụwa
  rationale: Nke a bụ ntụgharị Igbo kwesịrị ekwesị maka κόσμος n’ebe a, na-enweghị ime ka ihe ọ pụtara dị warara.
- source_word: ἦν
  choice: nọ
  rationale: Ejikọtara imperfect a na ‘na-abịa’ ka ọ bụrụ ‘nọ na-abịa,’ nke na-egosi omume na-aga n’ihu n’oge gara aga ma na-ada nke ọma n’Igbo.
theological_decisions:
- issue: Ihe ἐρχόμενον (‘na-abịa’) na-akọwa
  choice: 'A ghọtara ya n’isi ederede dị ka ihe na-akọwa ‘ezi ìhè ahụ’: ‘nọ na-abịa n’ụwa.’'
  alternative: 'A pụrụ ịghọta ya dị ka ihe na-akọwa ‘mmadụ niile’: ‘na-enye onye ọ bụla na-abịa n’ụwa ìhè.’'
  rationale: Ụdị okwu Grik ahụ nwere ike n’usoro ụtọasụsụ ịkọwa ἄνθρωπον, ma okwu na isiokwu ndị Jọn ji eme ihe n’ebe ndị ọzọ na-akwado ịghọta ya banyere ọbịbịa nke Ìhè ahụ n’ụwa. E debere nghọta nke ọzọ n’ihe odide ala ka a ghara ihichapụ mgbagwoju anya dị n’asụsụ mbụ.
translation_notes:
  register: Standard Igbo; okwu ndị dị mfe, nke oge a ma nwee ugwu. E jiri ‘mmadụ niile’ mee ka πάντα ἄνθρωπον metụta onye ọ bụla, ma e chekwara ihe oyiyi nke ìhè na mgbagwoju anya nke njikọ participle ahụ.
