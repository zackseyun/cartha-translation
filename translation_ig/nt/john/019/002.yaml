id: JHN.19.2
reference: John 19:2
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ οἱ στρατιῶται πλέξαντες στέφανον ἐξ ἀκανθῶν ἐπέθηκαν αὐτοῦ τῇ κεφαλῇ, καὶ ἱμάτιον πορφυροῦν περιέβαλον αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/john/019/002.yaml
  text: And the soldiers, after weaving a crown out of thorns, put it on his head and clothed him in a purple robe,
translation:
  language: ig
  text: Ndị agha kpara okpueze e ji ogwu mee, wee tụkwasị ya n’isi ya ma yikwasị ya uwe na-acha odo odo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στρατιῶται
  choice: ndị agha
  rationale: Nke a bụ okwu Igbo a na-ejikarị akọwa ndị ọrụ agha Rom n’akụkọ a.
- source_word: πλέξαντες
  choice: wee kpaa
  rationale: “Kpaa” na-egosi ịkpa ma ọ bụ ịtụkọta ihe ọnụ; “wee” na-eme ka usoro omume ahụ doo anya n’Igbo n’enweghị ịgbakwunye nkọwa.
- source_word: στέφανον
  choice: okpueze
  rationale: N’ọnọdụ a, okpueze na-egosipụta ihe e ji eme ka à ga-asị na Jizọs bụ eze; ọ dabara karịa okwu ga-apụta nanị ihe ịchọ mma.
- source_word: ἐξ ἀκανθῶν
  choice: n’ogwu
  rationale: Nke a na-egosi ihe e ji kpaa okpueze ahụ n’ụzọ dị nkenke ma bụrụkwa Igbo nkịtị.
- source_word: ἐπέθηκαν αὐτοῦ τῇ κεφαλῇ
  choice: tụkwasị ya n’isi ya
  rationale: Ọ bụ ntụgharị Igbo doro anya nke omume ịtụkwasị okpueze ahụ n’isi ya.
- source_word: ἱμάτιον
  choice: uwe mwụda
  rationale: Okwu ahụ na-ezo aka n’uwe a na-eyikwasị mmadụ n’elu uwe ndị ọzọ; “uwe mwụda” na-egosi nke a n’enweghị ime ka ụdị uwe ahụ sie ike karịa ihe Grik kwuru.
- source_word: πορφυροῦν
  choice: na-acha odo odo
  rationale: N’Igbo a na-asụ ugbu a, “odo odo” bụ aha agba a na-ejikarị maka purple, ma ọ na-ahapụkwa njikọ agba ahụ na ọnọdụ eze ka akụkọ ahụ n’onwe ya gosi ya.
- source_word: περιέβαλον αὐτόν
  choice: yikwasị ya
  rationale: Nke a bụ ụzọ Igbo sitere n’ọdịdị ya ekwu na ha tinyere uwe ahụ n’ahụ ya.
theological_decisions:
- issue: Ihe oyiyi nke ime ya eze n’ụzọ ịkwa emo
  choice: A kọwara okpueze na uwe na-acha odo odo kpọmkwem, n’etinyeghị okwu na-akọwa na ha ji ya na-akwa ya emo.
  alternative: Ịsị, “ha ji okpueze na uwe eze kwaa ya emo.”
  rationale: Amaokwu Grik na-akọ omume ndị ahụ, ma ọ naghị etinye nkọwa ahụ kpọmkwem. Ihe ndị gbara ya gburugburu na-eme ka ịkwa emo ahụ pụta ìhè.
translation_notes:
  register: Ejiri Standard Igbo nke dị ugbu a, dị ùgwù ma dị mfe nghọta. Nhazi “wee … ma …” na-edebe usoro omume ahụ n’ụzọ na-aga were were. Enweghị akara ntụaka ụkwụ n’ihi na ntụgharị Igbo a achọghị lexical alternative dị mkpa iji ghọta amaokwu ahụ.
