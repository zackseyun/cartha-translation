revisions:
- from: Ndị agha wee kpaa okpueze n’ogwu, tụkwasị ya n’isi ya, ma yikwasị ya uwe mwụda na-acha odo odo.
  to: Ndị agha kpara okpueze e ji ogwu mee, wee tụkwasị ya n’isi ya ma yikwasị ya uwe na-acha odo odo.
  rationale: The revision replaces the over-specific and potentially inaccurate “uwe mwụda” with the broad, source-faithful “uwe.” It also makes the thorn material explicit while preserving the concise narrative sequence and avoiding an added explanation of mockery.
  reviewer_model: gpt-5.6-terra
