id: JHN.19.28
reference: John 19:28
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Μετὰ τοῦτο ⸀εἰδὼς ὁ Ἰησοῦς ὅτι ⸂ἤδη πάντα⸃ τετέλεσται ἵνα τελειωθῇ ἡ γραφὴ λέγει· Διψῶ.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/028.yaml
  text: After this[a], Jesus, knowing that all things had already been completed, in order that the Scripture might be fulfilled, said, “I thirst.”
translation:
  language: ig
  text: Mgbe nke a gasịrị, Jizọs, ebe ọ maara na e mechaworị ihe niile, kwuru, “Akpịrị na-akpọ m nkụ,” ka Akwụkwọ Nsọ wee mezuo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μετὰ τοῦτο
  choice: Mgbe nke a gasịrị
  rationale: Nke a bụ ụzọ Igbo dị mfe ma bụrụkwa nke ziri ezi isi gosi mgbanwe oge ahụ, ma debe otu ihe nke τοῦτο na-ezo aka na ya.
- source_word: εἰδὼς
  choice: ebe ọ maara
  rationale: Ọ na-egosi na Jizọs maara ọnọdụ ahụ n’oge o kwuru okwu, n’ụzọ na-aga nke ọma n’akụkọ Igbo.
- source_word: ἤδη πάντα τετέλεσται
  choice: e mechaworị ihe niile
  rationale: “Mechaworị” na-egosi na ihe ahụ eruola n’ọnọdụ mmezu tupu okwu sochirinụ; “ihe niile” na-egosipụta πάντα.
- source_word: ἵνα τελειωθῇ
  choice: ka e wee mezuo
  rationale: Ọ na-echekwa echiche ebumnuche ma ọ bụ nsonaazụ dị na ἵνα, ebe “mezuo” dabara nke ọma mgbe ihe e dere n’Akwụkwọ Nsọ bụ isiokwu.
- source_word: ἡ γραφή
  choice: ihe e dere n’Akwụkwọ Nsọ
  rationale: Nke a na-eme ka o doo ndị na-agụ Igbo anya na γραφή na-ezo aka n’ihe dị nsọ e dere, ọ bụghị naanị ihe odide nkịtị.
- source_word: λέγει
  choice: kwuru
  rationale: A sụgharịrị historical present Grik n’oge gara aga ka akụkọ Igbo wee bụrụ nke eke.
- source_word: Διψῶ
  choice: Akpịrị na-akpọ m nkụ
  rationale: Nke a bụ ụzọ Igbo nkịtị, doro anya, ma dị ùgwù isi kwuo na mmadụ nwere akpịrị ịkpọ nkụ.
theological_decisions:
- issue: Mmekọrịta dị n’etiti ihe Jizọs maara, mmecha nke ihe niile, na mmezu nke Akwụkwọ Nsọ
  choice: Amaokwu ahụ na-ekwu na Jizọs maara na e mechaworị ihe niile, o wee kwuo okwu ka e wee mezuo ihe e dere n’Akwụkwọ Nsọ.
  alternative: A pụkwara ịghọta ἵνα dị ka nke na-egosi nsonaazụ—ya bụ, site n’okwu ya, ihe e dere n’Akwụkwọ Nsọ mezuru—na-enweghị ịkọwa usoro nkà mmụta okpukpe sara mbara.
  rationale: Nsụgharị ahụ na-edebe usoro na nrụgide echiche dị na Grik, ma ọ naghị atụkwasị nkọwa pụrụ iche banyere akara aka ma ọ bụ amụma Chineke. Ọ na-edebekwa ọdịiche dị n’etiti τετέλεσται na τελειωθῇ.
translation_notes:
  register: Igbo Izugbe nke oge a, dị mfe nghọta ma dị ùgwù. E jiri “Akpịrị na-akpọ m nkụ” mee ka okwu Jizọs bụrụ nke eke n’Igbo. E tinyụghị akara nkọwa [a], n’ihi na nkọwa Bekee enyere adabaghị na ebe akara ya dị ma yie ka ọ bụ ntụpọ ndezi; ịbufe ya ga-emegharị ndị na-agụ anya.
