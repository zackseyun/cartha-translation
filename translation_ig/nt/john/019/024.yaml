id: JHN.19.24
reference: John 19:24
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἶπαν οὖν πρὸς ἀλλήλους· Μὴ σχίσωμεν αὐτόν, ἀλλὰ λάχωμεν περὶ αὐτοῦ τίνος ἔσται· ἵνα ἡ γραφὴ πληρωθῇ ⸂ἡ λέγουσα⸃· Διεμερίσαντο τὰ ἱμάτιά μου ἑαυτοῖς καὶ ἐπὶ τὸν ἱματισμόν μου ἔβαλον κλῆρον. Οἱ μὲν οὖν στρατιῶται ταῦτα ἐποίησαν.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/024.yaml
  text: So they said to one another[a], “Let us not tear it, but cast lots for it to decide whose it will be,” so that the Scripture might be fulfilled that says, “They divided my garments among themselves[b], and for my clothing they cast a lot.” So the soldiers did these things.
translation:
  language: ig
  text: Ya mere, ha sịrị ibe ha, “Ka anyị ghara ịdọwa ya; kama ka anyị fee nza maka ya, ka a mara onye ọ ga-abụ nke ya.” Ka ihe e dere n’Akwụkwọ Nsọ wee mezuo, nke na-ekwu, “Ha kewara uwe m n’etiti onwe ha,[a] feekwa nza maka uwe m.” Ya mere, ndị agha ahụ mere ihe ndị a.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: E hotara okwu a n’Abụ Ọma 22:18.
    reason: cross_reference
lexical_decisions:
- source_word: σχίσωμεν
  choice: dọwa
  rationale: Ọ bụ okwu Igbo a na-ejikarị ekwu ịdọwa akwa; ọ dabara kpọmkwem n’ihe gbasara uwe a.
- source_word: αὐτόν
  choice: ya
  rationale: Ọ bụ ezie na nnọchiaha Grik ahụ bụ nke ụdị nwoke, ihe ọ na-ezo aka na ya n’ebe a bụ uwe elu ahụ; ‘ya’ bụ nnọchiaha Igbo kwesịrị ekwesị.
- source_word: λάχωμεν
  choice: fee nza
  rationale: Nkebiokwu a pụtara iji nza kpebie onye ga-enweta ihe ahụ. ‘Fee nza’ bụ okwu Igbo doro anya ma bụrụkwa nke a na-ejikarị eme ihe n’asụsụ Akwụkwọ Nsọ.
- source_word: περὶ αὐτοῦ τίνος ἔσται
  choice: maka ya, ka a mara onye ọ ga-abụ nke ya
  rationale: Nsụgharị a na-eme ka ebumnuche nza ahụ doo anya—ịchọpụta onye ga-enwe uwe ahụ—na-etinyeghị echiche ọzọ na-adịghị na Grik.
- source_word: ἵνα ἡ γραφὴ πληρωθῇ
  choice: Nke a mere ka ihe e dere n’Akwụkwọ Nsọ mezuo
  rationale: Ọ na-echekwa njikọ Jọn mere n’etiti ihe ndị agha mere na mmezu Akwụkwọ Nsọ, ma ọ naghị akọwa n’ụzọ karịrị ederede otú ebumnuche Chineke na omume mmadụ si metụta.
- source_word: ἡ γραφή
  choice: ihe e dere n’Akwụkwọ Nsọ
  rationale: N’ebe a, γραφή na-ezo aka n’Akwụkwọ Nsọ dị nsọ, ọ bụghị naanị ihe ọ bụla e dere.
- source_word: ἡ λέγουσα
  choice: nke na-asị
  rationale: Ọ na-ewebata okwu e hotara ma na-anọgide nso n’usoro Grik n’ụzọ Igbo dị mma.
- source_word: Διεμερίσαντο
  choice: Ha kewara
  rationale: Ngwaa a pụtara ikesa ma ọ bụ ikewa ihe n’etiti ọtụtụ mmadụ; ‘kewara’ dabara n’okwu a hotara.
- source_word: ἱμάτιά
  choice: uwe
  rationale: ‘Uwe’ bụ okwu Igbo nkịtị ma sara mbara maka garments/clothes, dịkwa mfe nghọta.
- source_word: ἑαυτοῖς
  choice: n’etiti onwe ha
  rationale: 'Ọ na-echekwa nghọta nkesa dị na nnọchiaha nloghachi ahụ: ndị ahụ kesara uwe n’etiti onwe ha.'
- source_word: ἱματισμόν
  choice: uwe
  rationale: Igbo nkịtị enweghị mkpa iji okwu ọzọ mee ọdịiche a n’ụzọ ga-adị eke. Ikwugharị ‘uwe’ na-echekwa ihe okwu ahụ pụtara n’enweghị asụsụ siri ike.
- source_word: ἔβαλον κλῆρον
  choice: feekwa nza
  rationale: Ọ na-anọchi anya otu nza e mere maka uwe ahụ n’asụsụ Igbo eke; ọnọdụ ahụ na-eme ka ọnụọgụ ya doo anya.
theological_decisions:
- issue: Mmekọrịta dị n’etiti omume ndị agha na mmezu Akwụkwọ Nsọ n’okwu ἵνα ἡ γραφὴ πληρωθῇ
  choice: 'Ịsụgharị ya dịka nkwupụta mmezu: ‘Nke a mere ka ihe e dere n’Akwụkwọ Nsọ mezuo.’'
  alternative: ‘Ka ihe e dere n’Akwụkwọ Nsọ wee mezuo.’
  rationale: Nhọrọ ahụ na-echekwa nkwupụta Jọn na ihe ahụ mezuru Akwụkwọ Nsọ, ma ọ naghị ekpebi ma ἵνα na-emesi ebumnuche ike ma ọ bụ nsonaazụ, ma ọ bụ kọwaa n’ụzọ pụrụ iche njikọ dị n’etiti ọchịchị Chineke na mkpebi ndị agha.
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E ji ‘fee nza’ mee ihe maka omenala ikpebi onye ga-enweta ihe, ma zere nkọwa ụka pụrụ iche. Akara nkọwa ala peeji [a] pụtara n’ederede ozugbo e hotachara akụkụ nke mbụ nke Abụ Ọma ahụ.
