  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἦν δὲ ἐν τῷ τόπῳ ὅπου ἐσταυρώθη κῆπος, καὶ ἐν τῷ κήπῳ μνημεῖον καινόν, ἐν ᾧ οὐδέπω οὐδεὶς ⸂ἦν τεθειμένος⸃·
base_translation:
  language: en
  yaml_path: translation/nt/john/019/041.yaml
  text: In the place where he was crucified there was a garden, and in the garden a new tomb, in which no one had yet been laid.
translation:
  language: ig
  text: N’ebe a kpọgidere ya n’obe, e nwere otu ogige; n’ime ogige ahụ e nwekwara ili ọhụrụ, nke e litetụbeghị onye ọ bụla n’ime ya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: (ejighị okwu pụrụ iche sụgharịa ya)
  rationale: Ọ bụ njikọ akụkọ dị nro; nhazi ahịrịokwu Igbo na akara nkebiokwu na-egosipụta ntụgharị ahụ n’enweghị itinye okwu oge dịka ‘ugbu a’.
- source_word: τόπῳ
  choice: ebe
  rationale: ‘Ebe’ bụ okwu Igbo doro anya ma bụrụkwa nke a na-ejikarị akọwa τόπος n’ọnọdụ a.
- source_word: ὅπου ἐσταυρώθη
  choice: ebe ahụ a kpọgidere ya n’obe
  rationale: Nke a na-edobe ụda nnara nke Grik ma ghara ịgbakwunye ndị mere ihe ahụ dị ka isiokwu.
- source_word: κῆπος
  choice: ogige
  rationale: ‘Ogige’ bụ okwu sara mbara ma kwekọọ na κῆπος; ọ naghị eme ka ọ bụrụ ubi mkpụrụ osisi kpọmkwem.
- source_word: μνημεῖον
  choice: ili
  rationale: N’Igbo, ‘ili’ na-akọwa ebe a na-eli mmadụ n’ụzọ ebumpụta ụwa, gụnyere ili e ji tinye ozu n’ime ya dịka ọnọdụ akụkọ a si dị.
- source_word: καινόν
  choice: ọhụrụ
  rationale: Ọ na-asụgharị nkọwa ‘ọhụrụ’ kpọmkwem; ahịrịokwu na-esote na-akọwa na e jibeghị ya.
- source_word: ἐν ᾧ
  choice: nke ... n’ime ya
  rationale: Usoro a na-ejikọta nkebiokwu ahụ na ili ahụ n’Igbo doro anya.
- source_word: οὐδέπω οὐδεὶς
  choice: a na-etinyebeghị onye ọ bụla
  rationale: Ngwakọta ‘-beghị’ na ‘onye ọ bụla’ na-echekwa ma echiche ‘rue mgbe ahụ’ ma nkwụsi ike nke nkwughị onye ọbụla.
- source_word: ἦν τεθειμένος
  choice: a na-etinyebeghị
  rationale: N’ọnọdụ olili, ‘itinye ... n’ime ili’ bụ Igbo ebumpụta ụwa; ọdịdị ‘-beghị’ na-egosi na ihe ahụ emebeghị ruo oge ahụ.
theological_decisions:
- issue: Okwu ọnọdụ olili maka μνημεῖον na τεθειμένος
  choice: ili ... a na-etinyebeghị onye ọ bụla n’ime ya
  alternative: ebe ncheta ... onye ọ bụla adịbeghị n’ime ya
  rationale: Nhọrọ a na-egosipụta ebe olili na omume itinye ozu n’ili n’enweghị ịgbakwunye nkọwa ozizi.
- issue: Ụda ἐσταυρώθη
  choice: a kpọgidere ya n’obe
  alternative: ha kpọgidere ya n’obe
  rationale: Ụda nnara ahụ na-edobe ụdị Grik ma ghara ịgbakwunye isiokwu mmadụ nke nkebiokwu ahụ ekwughị.
translation_notes:
  register: Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E ji ‘ogige’ na ‘ili’ mee ka ọnọdụ ahụ doo onye nkịtị anya; e zere okwu ụka pụrụ iche na nkọwa agbakwunyere.
