  source_fidelity: 'Isi ahịrị a na-anọchite anya Grik ahụ nke ọma: ‘ụbọchị nkwadebe maka Ememme Ngabiga’ na-egosi παρασκευὴ τοῦ πάσχα n’Igbo eke; ‘ihe dị ka’ na-echekwa ὡς; ‘elekere nke isii’ na-edobe usoro oge isi mmalite; ‘ndị Juu’ na-asụgharị τοῖς Ἰουδαίοις n’enweghị ịmachi ihe ọ pụtara karịa ka amaokwu ahụ kwuru. ‘Ọ sịrị’ bụ ụzọ akụkọ Igbo dị mma maka historical present λέγει, n’agbanyeghị na ọ naghị edobe present ahụ n’ụdị okwu kpọmkwem.'
