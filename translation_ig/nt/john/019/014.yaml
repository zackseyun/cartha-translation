  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἦν δὲ παρασκευὴ τοῦ πάσχα, ὥρα ⸂ἦν ὡς⸃ ἕκτη. καὶ λέγει τοῖς Ἰουδαίοις· Ἴδε ὁ βασιλεὺς ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/014.yaml
  text: It was the day of preparation of the Passover[a]; it was about the sixth hour. And he says to the Jews, “Behold[b], your king!”
translation:
  language: ig
  text: Ọ bụ ụbọchị nkwadebe maka Ememme Ngabiga; ọ bụ ihe dị ka elekere nke isii[a]. Ọ sịrị ndị Juu[b], “Lee, eze unu!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n’oge anyị, ‘ihe dị ka etiti ehihie,’ dabere n’otú e si gụọ awa ahụ.
    reason: cultural_note
  - marker: b
    text: N’ọnọdụ akụkọ a, ‘ndị Juu’ pụrụ izo aka karịsịa n’ndị ọchịchị Judia ma ọ bụ ndị isi Juu.
    reason: alternative_reading
lexical_decisions:
- source_word: παρασκευὴ
  choice: ụbọchị nkwadebe
  rationale: N’ebe a, okwu ahụ na-ezo aka n’ụbọchị a na-eme nkwadebe tupu ememme ma ọ bụ ụbọchị izu ike. ‘Ụbọchị nkwadebe’ na-eme ka echiche oge ahụ doo anya n’Igbo.
- source_word: τοῦ πάσχα
  choice: maka Ememme Ngabiga
  rationale: A sụgharịrị njikọ genitive ahụ n’ụzọ Igbo dị mfe nghọta, nke na-egosi na nkwadebe ahụ metụtara Ememme Ngabiga, n’agbanyeghị na njikọ okwu Grik n’onwe ya adịghị akọwa ihe niile gbasara ụdị nkwadebe ahụ.
- source_word: ὥρα ἦν ὡς ἕκτη
  choice: ọ bụ ihe dị ka elekere nke isii
  rationale: Nke a chekwara ma usoro ịgụ oge nke ụwa oge ahụ ma okwu ὡς nke na-egosi na oge ahụ bụ nke a tụrụ anya ya, ọ bụghị kpọmkwem.
- source_word: λέγει
  choice: ọ sịrị
  rationale: Ọ bụ ezie na Grik ji present akụkọ ihe mere eme mee ka akụkọ dị ndụ, Igbo akụkọ nkịtị na nke doro anya na-eji ‘ọ sịrị’ ebe a; nke a anaghị agbanwe ihe omume ahụ ma ọ bụ onye kwuru okwu.
- source_word: τοῖς Ἰουδαίοις
  choice: ndị Juu
  rationale: Nke a na-anọgide nso n’okwu Grik. E tinyeghị ‘ndị isi Juu’ n’ahịrị bụ isi n’ihi na amaokwu ahụ ekwughị ya kpọmkwem.
- source_word: Ἴδε
  choice: Lee
  rationale: ‘Lee’ bụ mkpu Igbo dị ugbu a nke na-adọta uche ndị na-ege ntị ma na-edobe ike nke nkwupụta ahụ.
- source_word: ὁ βασιλεὺς ὑμῶν
  choice: eze unu
  rationale: Nke a bụ usoro Igbo eke nke na-edobe njide onwe ‘unu’ na ilu ndọrọ ndọrọ ọchịchị dị n’okwu Paịlet.
theological_decisions:
- issue: Ndị okwu ‘ndị Juu’ na-anọchi anya ha n’Oziọma Jọn
  choice: E debere ‘ndị Juu’ n’ahịrị bụ isi.
  alternative: ndị Judia; ndị isi Juu
  rationale: τοῖς Ἰουδαίοις pụtara ‘ndị Juu’ n’ụzọ kpọmkwem. N’ọnọdụ akụkọ a, ọ pụrụ izo aka karịsịa n’ọchịchị Judia ma ọ bụ ndị isi Juu, ma amaokwu ahụ n’onwe ya emeghị ka ókè ahụ doo anya; ya mere e debere ohere ahụ na nkọwa ala peeji.
- issue: Usoro oge ochie ‘elekere nke isii’
  choice: E chebere usoro oge dị n’isi mmalite n’ahịrị bụ isi.
  alternative: ihe dị ka etiti ehihie
  rationale: Amaokwu ahụ ji usoro oge ochie ma tinye ὡς, ‘ihe dị ka.’ Ide ‘elekere nke isii’ na-ezere idozi esemokwu banyere otu e si gụọ awa ahụ karịa ka isi mmalite kwadoro.
translation_notes:
  register: E ji Igbo Izugbe dị ugbu a, dị ùgwù ma dị mfe nghọta. ‘Ememme Ngabiga’ bụ aha a na-aghọta nke ọma; ‘Lee’ na-edobe ụda nkwupụta ọha n’enweghị okwu ochie na-adịghị eke. E tinyere akara nkọwa [a] kpọmkwem n’akụkụ oge na [b] n’akụkụ ‘ndị Juu’ ka ha kwekọọ n’ihe nkọwa ndị ahụ na-akọwa.
