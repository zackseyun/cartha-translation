id: JHN.19.11
reference: John 19:11
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀπεκρίθη ⸀αὐτῷ Ἰησοῦς· Οὐκ εἶχες ἐξουσίαν ⸂κατ’ ἐμοῦ οὐδεμίαν⸃ εἰ μὴ ἦν ⸂δεδομένον σοι⸃ ἄνωθεν· διὰ τοῦτο ὁ ⸀παραδούς μέ σοι μείζονα ἁμαρτίαν ἔχει.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/011.yaml
  text: Jesus answered him[a], “You would have no authority over me at all unless it had been given to you from above[b]. Therefore the one who handed me over to you has the greater sin.”
translation:
  language: ig
  text: Jizọs zara ya, “Ị garaghị enwe ikike ọ bụla n’ebe m nọ ma a sị na e nyeghị gị ya site n’elu[a]. N’ihi nke a, onye nyefere m n’aka gị[b] nwere mmehie ka ukwuu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “site n’eluigwe.” Okwu Grik ahụ pụtara “site n’elu,” nke n’Oziọma Jọn na-ezokarị aka n’isi iyi sitere n’aka Chineke.
    reason: lexical_alternative
  - marker: b
    text: A kpọghị aha onye nyefere Jizọs n’aka Paịlet n’ebe a. Ụfọdụ na-aghọta ya dịka Judas, ụfọdụ dịka Kaịfas, ebe ndị ọzọ na-aghọta ya dịka ndị ndu ndị Juu n’ozuzu ha.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐξουσίαν
  choice: ikike
  rationale: “Ikike” na-egosi ikike ọchịchị na ikike ikpe e nyere Paịlet, ọ bụghị naanị ike anụ ahụ.
- source_word: κατ’ ἐμοῦ οὐδεμίαν
  choice: ikike ọ bụla n’ebe m nọ
  rationale: Nke a bụ Igbo doro anya nke na-egosi ikike Paịlet nwere n’ebe Jizọs nọ; “ọ bụla” na-echekwa nkwusi ike dị na οὐδεμίαν.
- source_word: δεδομένον σοι
  choice: e ... nye gị ya
  rationale: Usoro okwu a na-egosi na e nyeburu Paịlet ikike ahụ tupu oge ọ na-ekwu okwu ugbu a, ma na-ahapụ onye nyere ya ka ahịrịokwu na-esonụ kọwaa site n’okwu “n’elu.”
- source_word: ἄνωθεν
  choice: site n’elu
  rationale: Nke a na-echekwa ihe okwu Grik pụtara kpọmkwem nakwa ụzọ Jọn si eji ya egosi isi iyi sitere n’aka Chineke, n’agbanyeghị na “site n’eluigwe” bụ nkọwa ọzọ kwe omume.
- source_word: διὰ τοῦτο
  choice: N’ihi nke a
  rationale: Ọ na-echekwa njikọ nke ihe kpatara ya na nkwubi okwu dị n’okwu Grik.
- source_word: ὁ παραδούς
  choice: onye nyefere m n’aka gị
  rationale: “Nyefere ... n’aka” dabara n’ọnọdụ njide na ikpe a ma ghara ikpebi na onye ahụ bụ Judas, Kaịfas, ma ọ bụ ndị ndu ndị Juu.
- source_word: μείζονα ἁμαρτίαν
  choice: mmehie ka ukwuu
  rationale: Nke a na-egosi ntụnyere ogo ikpe ọmụma n’etiti onye nyefere Jizọs na Paịlet, n’enweghị ịsị na Paịlet enweghị mmehie.
theological_decisions:
- issue: Isi iyi nke ikike Paịlet nke ἄνωθεν na-egosi
  choice: E si “n’elu” nye Paịlet ikike ahụ, nke na-ezo aka n’isi iyi Chineke n’okwu Jọn, ma a kọwaghị ozizi sara mbara banyere ọchịchị.
  alternative: “Site n’eluigwe,” ma ọ bụ ịghọta “n’elu” n’ụzọ zuru ezu karịa.
  rationale: Nsụgharị ahụ na-echekwa okwu Jọn na ihe ọ na-atụ aka na ya n’akọwaghị ihe karịrị ihe amaokwu ahụ kwuru.
- issue: Onye ὁ παραδούς μέ σοι bụ
  choice: A hapụrụ ya dịka “onye nyefere m n’aka gị.”
  alternative: Judas, Kaịfas, ma ọ bụ ndị ndu ndị Juu n’ozuzu ha.
  rationale: Okwu Grik akpọghị onye ahụ aha; ya mere, nsụgharị ahụ na-echekwa enweghị ido anya ahụ.
- issue: “Mmehie ka ukwuu” na ibu ọrụ Paịlet
  choice: Onye nyefere Jizọs nwere mmehie ka ukwuu, ma nke a anaghị ekwu na Paịlet enweghị mmehie.
  alternative: Ịghọta okwu ahụ dịka iwepụ ikpe ọmụma Paịlet kpamkpam.
  rationale: Ntụnyere μείζονα na-egosi ogo mmehie dị iche iche, ọ bụghị na otu onye enweghị ikpe ọmụma.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. A haziri akara ala ala peeji ka [a] soro “site n’elu,” ebe [b] soro onye a na-akọwaghị kpọmkwem onye ọ bụ; nke a kwekọrọ n’ihe ndetu nke ọ bụla.
