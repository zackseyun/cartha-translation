    text: A kpọghị aha onye nyefere Jizọs n’aka Paịlet n’ebe a. Ụfọdụ na-aghọta ya dịka Judas, ụfọdụ dịka Kaịfas, ebe ndị ọzọ na-aghọta ya dịka ndị ndu ndị Juu n’ozuzu ha.
    reason: alternative_reading
  revision_rationale: The revision retains the draft’s faithful lexical and theological choices while making the counterfactual passive construction more natural in Standard Igbo. It keeps “site n’elu” in the text, leaves the giver and the person who handed Jesus over unnamed, and retains correctly placed footnote anchors.
