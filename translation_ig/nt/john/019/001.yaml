  text: Τότε οὖν ἔλαβεν ὁ Πιλᾶτος τὸν Ἰησοῦν καὶ ἐμαστίγωσεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/001.yaml
  text: Then Pilate took Jesus and flogged him[a].
translation:
  language: ig
  text: Mgbe ahụ, Paịlet kpọọrọ Jizọs ma were ụtarị pịa ya[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ, n’ụzọ na-akọwa na Paịlet nyere ndị ọzọ iwu: “Mgbe ahụ, Paịlet kpọọrọ Jizọs ma nye iwu ka a pịa ya ụtarị.”'
    reason: alternative_reading
lexical_decisions:
- source_word: Τότε
  choice: Mgbe ahụ
  rationale: Ọ bụ okwu oge na-egosi ihe omume sochirinụ n’akụkọ ahụ; “Mgbe ahụ” bụ ụzọ Igbo doro anya ma bụrụkwa nke e ji ekwu okwu ugbu a.
- source_word: οὖν
  choice: — (ọ pụtara n’usoro okwu Igbo)
  rationale: Ọ na-egosi na akụkọ ma ọ bụ echiche na-aga n’ihu. “Mgbe ahụ” na usoro ahịrịokwu ahụ ebutelarị echiche a, ya mere ịgbakwụnye “ya mere” ga-eme ka okwu sie ike ma ọ bụ gbanwee ụda ya.
- source_word: ἔλαβεν
  choice: kpọọrọ
  rationale: N’ebe a, “kpọọrọ” na-egosi na Paịlet weere Jizọs gaa n’ihu n’ihe a na-eme ya, n’enweghị ịgbakwụnye echiche siri ike nke “jidere n’ike” ma ọ bụ ịkọwa na o nyere iwu ka ndị ọzọ kpọrọ ya.
- source_word: ὁ Πιλᾶτος
  choice: Paịlet
  rationale: Nke a bụ nsụgharị aha ahụ n’ụdị a na-aghọta nke ọma n’Igbo; ọ dịghị mkpa ịgbakwunye “Pọntiọs” ebe onye a ekwuola okwu banyere ya n’akụkọ ahụ.
- source_word: τὸν Ἰησοῦν
  choice: Jizọs
  rationale: Nke a bụ ụdị aha Jizọs a na-ejikarị eme ihe n’Igbo, ọ bụkwa onye omume ahụ metụtara.
- source_word: ἐμαστίγωσεν
  choice: pịa ya ụtarị
  rationale: Nkebi okwu a na-egosi iti mmadụ ihe site n’ụtarị n’ụzọ doro anya ma dịkwa n’Igbo ugbu a. Ọ na-echekwa ịdị njọ nke ihe ahụ karịa okwu sara mbara dịka “tie ya ihe.”
theological_decisions:
- issue: Ma Paịlet ji aka ya pịa Jizọs ụtarị, ka ọ bụ na o nyere ndị agha iwu ime ya
  choice: E debere Paịlet dịka onye na-eme ngwaa abụọ ahụ n’usoro ahịrịokwu, n’akọwaghị ma o ji aka ya mee ya ma ọ bụ na e mere ya n’okpuru ikike ya.
  alternative: “Mgbe ahụ, Paịlet kpọọrọ Jizọs ma nye iwu ka a pịa ya ụtarị.”
  rationale: Grik kpọrọ Paịlet onye na-eme ngwaa abụọ ahụ. Nsụgharị bụ isi na-echekwa usoro a ma hapụkwa ajụjụ gbasara onye ji aka ya pịa ya ghe oghe; ihe odide ala peeji na-egosi ụzọ ọzọ kwesịrị ekwesị nke na-akọwapụta ọrụ e nyere ndị ọzọ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe nghọta ma nwee ugwu dee ya. “Mgbe ahụ” na-eme ka usoro akụkọ gaa were were; “pịa ya ụtarị” bụ okwu nkịtị ma doro anya nke na-egosi ụdị ahụhụ ahụ. Akara ihe odide ala peeji [a] dị n’ederede bụ isi.
