  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ εἰσῆλθεν εἰς τὸ πραιτώριον πάλιν καὶ λέγει τῷ Ἰησοῦ· Πόθεν εἶ σύ; ὁ δὲ Ἰησοῦς ἀπόκρισιν οὐκ ἔδωκεν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/009.yaml
  text: And he entered the governor’s headquarters again and said to Jesus[a], “Where are you from?” But Jesus gave him no answer.
translation:
  language: ig
  text: Ọ banyere ọzọ n’ụlọ ọchịchị gọvanọ[a], wee sị Jizọs, “Olee ebe i si bịa?” Ma Jizọs azaghị ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “praetorium,” ya bụ, ụlọ obibi ma ọ bụ isi ụlọ ọrụ gọvanọ Rom.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσῆλθεν
  choice: Ọ banyere
  rationale: Ngwaa a na-egosi ịbanye n’ime otu ebe; “banyere” bụ okwu Igbo doro anya ma kwekọọ n’omume ahụ.
- source_word: πραιτώριον
  choice: ụlọ ọchịchị gọvanọ[a]
  rationale: N’ebe a, okwu ahụ na-ezo aka n’ụlọ gọvanọ Rom ji arụ ọrụ ọchịchị, nke nwekwara ike ịbụ ebe obibi ya. Nsụgharị a na-eme ka ọrụ ebe ahụ doo onye na-agụ akwụkwọ anya, ebe nkọwa ala peeji na-edobe aha Rom ahụ na nghọta ọzọ o nwere.
- source_word: πάλιν
  choice: ọzọ
  rationale: “Ọzọ” na-egosi na ọ banyere ebe ahụ ọzọ, dịka adverb Grik ahụ si kwuo.
- source_word: λέγει
  choice: wee sị
  rationale: Ọ bụ ezie na Grik ji historical present, oge gara aga bụ ụzọ nkịtị e si akọ akụkọ n’Igbo; “wee” na-ejikọta omume abụọ ahụ n'ụzọ dị mfe.
- source_word: Πόθεν εἶ σύ
  choice: Olee ebe i si bịa?
  rationale: Ajụjụ a na-ajụ ebe Jizọs si ma ọ bụ mmalite ya; okwu Igbo a bụ nke nkịtị ma na-edobe obosara ajụjụ ahụ.
- source_word: ἀπόκρισιν οὐκ ἔδωκεν αὐτῷ
  choice: Jizọs azaghị ya
  rationale: Nke a bụ ụzọ Igbo kacha dị mfe ma bụrụkwa nke ziri ezi isi kwuo na Jizọs enyeghị ya azịza.
- source_word: δὲ
  choice: Ma
  rationale: “Ma” na-egosi ọdịiche dị n’etiti ajụjụ ahụ na ịgbachi nkịtị Jizọs.
theological_decisions:
- issue: Onye isiokwu e zoro ezo na-ezo aka na ya
  choice: E ji nnọchiaha “Ọ” sụgharịa ya, ebe ihe ndị gbara amaokwu a gburugburu na-egosi na ọ bụ Paịlet.
  alternative: Ịkpọ “Paịlet” aha kpọmkwem n’ahịrịokwu ahụ.
  rationale: Grik akpọghị Paịlet aha n’amaokwu a; iji “Ọ” na-agbasochi ụdị isi mmalite ahụ anya ma ghara ịtinye ihe na-adịghị n’ahịrịokwu ahụ.
- issue: Obosara ajụjụ Πόθεν εἶ σύ
  choice: 'E debere ya dịka ajụjụ banyere ebe ma ọ bụ mmalite: “Olee ebe i si bịa?”'
  alternative: Ịkọwa ya kpọmkwem dịka ajụjụ banyere mmalite eluigwe Jizọs.
  rationale: Ajụjụ Grik ahụ n’onwe ya akọwaghị ụdị mmalite a na-ajụ; nsụgharị ahụ na-edobe nghọta sara mbara na esemokwu dị n’akụkọ ahụ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị mfe ma dị ùgwù, dee ya. “Ụlọ ọchịchị gọvanọ” na-akọwa ọrụ praetorium n’enweghị okwu mgbazinye na-agaghị edo ọtụtụ ndị anya; nkọwa ala peeji na-echekwa aha ahụ na nghọta abụọ nwere ike ịdị na ya.
