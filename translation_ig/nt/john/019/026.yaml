  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἰησοῦς οὖν ἰδὼν τὴν μητέρα καὶ τὸν μαθητὴν παρεστῶτα ὃν ἠγάπα λέγει τῇ ⸀μητρί· Γύναι, ⸀ἴδε ὁ υἱός σου·
base_translation:
  language: en
  yaml_path: translation/nt/john/019/026.yaml
  text: So when Jesus saw his mother and the disciple whom he loved standing there[a], he says to his mother, “Woman, behold, your son.”
translation:
  language: ig
  text: Ya mere, mgbe Jizọs hụrụ nne ya na onye na-eso ụzọ ahụ ọ hụrụ n’anya nọ ebe ahụ, ọ sịrị nne ya, “Nwanyị[a], lee nwa gị nwoke.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Okwu Grik a ji akpọ nwanyị bụ okwu nkwanye ùgwù, ọ bụghị okwu mkparị, ọbụna ma “Nwanyị” nwee ike ịdị ka okwu siri ike n’ụzọ ụfọdụ e si asụ Igbo taa.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Ya mere
  rationale: Ọ na-ejikọta ihe a na ihe ndị bu ya ụzọ, ma na-egosikwa ọganihu nke akụkọ ahụ.
- source_word: ἰδὼν
  choice: mgbe ... hụrụ
  rationale: A tụgharịrị participle a dị ka nkebiokwu oge, nke bụ ụzọ Igbo doro anya ma dịkwa ụtọ isi gosipụta usoro ihe mere.
- source_word: τὴν μητέρα
  choice: nne ya
  rationale: Ọ bụ ezie na Grik ji article mee ihe kama possessive, ọnọdụ okwu ahụ na-egosi na ọ bụ nne Jizọs; Igbo nkịtị chọrọ ‘ya’ ebe a.
- source_word: τὸν μαθητὴν
  choice: onye na-eso ụzọ ahụ
  rationale: ‘Ahụ’ na-egosi na ọ bụ otu onye na-eso ụzọ a maara kpọmkwem n’akụkọ Jọn.
- source_word: παρεστῶτα
  choice: ka ọ na-eguzo n’akụkụ
  rationale: Nke a na-egosi na onye na-eso ụzọ ahụ nọ ebe ahụ, guzo nso, dịka okwu Grik si kwuo.
- source_word: ὃν ἠγάπα
  choice: ọ hụrụ n’anya
  rationale: Ọ na-edobe nkọwa e ji amata onye na-eso ụzọ ahụ site n’ịhụnanya Jizọs nwere n’ebe ọ nọ, n’ebughị aha ya.
- source_word: λέγει
  choice: ọ sịrị
  rationale: Ọ bụ ụzọ akụkọ Igbo si adịkarị mma. Iji ‘ọ na-asị’ soro historical present nke Grik nwere ike ime ka okwu ahụ yie omume na-aga n’ihu ma ọ bụ nke a na-eme ugboro ugboro.
- source_word: Γύναι
  choice: Nwanyị
  rationale: Nke a bụ nsụgharị kpọmkwem nke okwu ahụ. N’ebe a, okwu Grik bụ ịkpọ nwanyị okwu n’ụzọ nkwanye ùgwù, ọ bụghị mkparị; ihe odide ala peeji na-akọwa nke a.
- source_word: ἴδε
  choice: lee
  rationale: ‘Lee’ bụ iwu deictic eke n’Igbo nke na-adọta uche ma na-edobe ịdị arọ nke nkwupụta ahụ.
- source_word: ὁ υἱός σου
  choice: nwa gị nwoke
  rationale: Nke a na-edobe kpọmkwem na υἱός bụ nwa nwoke ma na-egosikwa mmekọrịta ọhụrụ a na-ekwupụta.
theological_decisions:
- issue: Ụda okwu Jizọs ji kpọọ Meri na Γύναι
  choice: E debere ‘Nwanyị’ n’ahịrịokwu bụ isi, tinyekwa nkọwa ala peeji na okwu ahụ bụ nke nkwanye ùgwù, ọ bụghị mkparị.
  alternative: ‘Ezigbo nwanyị’ ma ọ bụ okwu ọzọ ga-eme ka ụda ya dị nro karịa
  rationale: Isi Grik adịghị egosi mkparị, ma ọ naghịkwa etinye okwu ịhụnanya dịka ‘ezigbo.’ Nsụgharị kpọmkwem tinyere nkọwa na-echekwa ma ụdị okwu ahụ ma ụda ya.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dịkwa mfe nghọta. A họọrọ usoro okwu akụkọ nke na-ada nke ọma n’Igbo, ebe a na-edobe njikọ, mmekọrịta, na ịdị arọ nke okwu Grik.
