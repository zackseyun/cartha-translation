    text: Okwu Grik a ji akpọ nwanyị bụ okwu nkwanye ùgwù, ọ bụghị okwu mkparị, ọbụna ma “Nwanyị” nwee ike ịdị ka okwu siri ike n’ụzọ ụfọdụ e si asụ Igbo taa.
    reason: lexical_alternative
  revision_rationale: The revision removes the unsupported implication that the disciple stood beside someone, while retaining the source’s sense that he was standing by/present. The footnote keeps the important pragmatic clarification of Γύναι but avoids an alternative that adds affection not explicitly expressed in the Greek.
