revisions:
- from: Ya mere, mgbe Jizọs hụrụ nne ya na onye na-eso ụzọ ahụ ọ hụrụ n’anya ka ọ na-eguzo n’akụkụ, ọ sịrị nne ya, “Nwanyị[a], lee nwa gị nwoke.”
  to: Ya mere, mgbe Jizọs hụrụ nne ya na onye na-eso ụzọ ahụ ọ hụrụ n’anya nọ ebe ahụ, ọ sịrị nne ya, “Nwanyị[a], lee nwa gị nwoke.”
  rationale: The revision removes the unsupported implication that the disciple stood beside someone, while retaining the source’s sense that he was standing by/present. The footnote keeps the important pragmatic clarification of Γύναι but avoids an alternative that adds affection not explicitly expressed in the Greek.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T08:26:16Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the main clause, the temporal force of ἰδών, the identified disciple, the relative clause 'whom he loved,' and the filial declaration. However, rendering παρεστῶτα as 'ka ọ na-eguzo n’akụkụ' can imply that the disciple was standing specifically beside Jesus or Mary. The Greek means that he was standing by/present in the scene, without specifying beside whom. The historical present λέγει may idiomatically be rendered with past narration in Igbo.
  naturalness: The wording is generally clear Standard Igbo. 'nọ ebe ahụ' is more natural and less spatially over-specific than 'na-eguzo n’akụkụ.' The direct address and solemn 'lee' work well.
  terminology: '''Jizọs,'' ''nne ya,'' ''onye na-eso ụzọ ahụ,'' ''Nwanyị,'' and ''nwa gị nwoke'' are suitable. The footnote’s proposed alternative ''Ezigbo nwanyị'' adds an affectionate nuance not present in γύναι. A neutral explanation of respect is preferable without presenting that expression as a lexical alternative.'
  issues:
  - severity: medium
    issue: '''ka ọ na-eguzo n’akụkụ'' over-specifies παρεστῶτα'
    rationale: παρεστῶτα denotes being present/standing by; it does not state that the disciple stood beside a particular person. 'nọ ebe ahụ' preserves the scene without adding a spatial relation.
  - severity: low
    issue: Footnote offers 'Ezigbo nwanyị' as an alternative
    rationale: γύναι is a respectful form of address, but 'Ezigbo' can add warmth or endearment beyond the Greek. The note should explain the respectful tone rather than offer an interpretively softened equivalent.
  revised_text: Ya mere, mgbe Jizọs hụrụ nne ya na onye na-eso ụzọ ahụ ọ hụrụ n’anya nọ ebe ahụ, ọ sịrị nne ya, “Nwanyị[a], lee nwa gị nwoke.”
  revised_footnotes:
