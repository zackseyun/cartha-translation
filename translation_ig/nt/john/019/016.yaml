  text: τότε οὖν παρέδωκεν αὐτὸν αὐτοῖς ἵνα σταυρωθῇ. Παρέλαβον ⸀οὖν τὸν ⸀Ἰησοῦν·
base_translation:
  language: en
  yaml_path: translation/nt/john/019/016.yaml
  text: Then he handed him over to them to be crucified[b][a]. So they took Jesus.
translation:
  language: ig
  text: Mgbe ahụ, ọ nyefere ya n’aka ha ka a kpọgide ya n’obe.[a][b] Ya mere, ha kpọọrọ Jizọs.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Enwekwara ike ịtụgharị ya, “ka e wee kpọgide ya n’obe.” Nke a na-eme ka nzube dị na nkebiokwu Grik pụta ìhè karịa.
    reason: lexical_alternative
  - marker: b
    text: Amaokwu a akpọghị ndị “ha” ahụ aha kpọmkwem; ihe ndị gbara amaokwu a gburugburu na-enyere onye na-agụ ya aka ịghọta ndị a na-ekwu maka ha.
    reason: alternative_reading
lexical_decisions:
- source_word: τότε
  choice: Mgbe ahụ
  rationale: Na-egosi ihe sochiri ozugbo n’akụkọ ahụ n’asụsụ Igbo doro anya.
- source_word: οὖν
  choice: Ya mere
  rationale: Na-egosi njikọ nke ihe mere n’amaokwu a na ihe ndị bu ya ụzọ; etinyere ya n’ahịrịokwu nke abụọ iji mee ka Igbo daa nke ọma.
- source_word: παρέδωκεν
  choice: nyefere ... n’aka
  rationale: Na-egosi inyefe mmadụ n’okpuru ikike ndị ọzọ, ma dabara n’ọnọdụ ikpe a.
- source_word: αὐτὸν / αὐτοῖς
  choice: ya / ha
  rationale: E debere nnọchiaha ndị ahụ n’enweghị ịkpọ ndị ha na-ezo aka na ha aha, dịka Grik si mee.
- source_word: ἵνα σταυρωθῇ
  choice: ka a kpọgide ya n’obe
  rationale: Na-echekwa nzube e gosiri site na ἵνα nakwa olu nnabata nke ngwaa ahụ n’ụzọ Igbo kwụụrụ onwe ya.
- source_word: Παρέλαβον
  choice: ha kpọọrọ
  rationale: N’ọnọdụ a, okwu ahụ pụtara na ha weere Jizọs ka ha duru ya pụọ; ‘kpọọrọ’ bụ Igbo dị mfe ma dị ndụ.
- source_word: Ἰησοῦν
  choice: Jizọs
  rationale: Ụdị aha Jizọs a na-ejikarị eme ihe na Standard Igbo.
theological_decisions:
- issue: Ndị nnọchiaha ‘ha’ na-ezo aka na ha (αὐτοῖς na isiokwu e zoro ezo nke Παρέλαβον)
  choice: E debere ‘ha’ n’amaokwu ahụ n’enweghị ịkọwa ndị ha bụ.
  alternative: Ịkpọ ha ndị isi nchụàjà na ndị nche ha, ma ọ bụ ndị agha Rom.
  rationale: Amaokwu Grik akpọghị otu ndị ahụ aha. Ịkpọpụta ha kpọmkwem ga-ewepụ nghọta abụọ ahụ ihe odide ahụ hapụrụ ka ọnọdụ gbara ya gburugburu kọwaa.
translation_notes:
  register: Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E chekwara enweghị nkọwa kpọmkwem banyere ndị ‘ha’ na-anọchi anya ha, ma zere ịgbakwụnye nkọwa okpukpe na-adịghị n’ihe odide Grik.
