  text: εἶτα λέγει τῷ μαθητῇ· ⸀Ἴδε ἡ μήτηρ σου. καὶ ἀπ’ ἐκείνης τῆς ὥρας ἔλαβεν ὁ μαθητὴς αὐτὴν εἰς τὰ ἴδια.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/027.yaml
  text: Then he said to the disciple, “Look, your mother.” And from that hour the disciple took her into his own home.
translation:
  language: ig
  text: Mgbe ahụ, ọ sịrị onye na-eso ụzọ ahụ, “Lee, nne gị.” Site n’oge ahụ, onye na-eso ụzọ ahụ kpọọrọ ya gaa n’ụlọ nke ya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἴδε
  choice: Lee
  rationale: Ọ bụ okwu a na-eji adọta uche mmadụ n’ihe a na-egosi ya; “Lee” bụ ntụgharị Igbo dị nkenke ma kwekọọ n’ụdị iwu dị na Grik.
- source_word: μαθητῇ / μαθητὴς
  choice: onye ahụ na-eso ụzọ ya
  rationale: Nke a na-egosi otu onye ahụ Jizọs na-ekwu okwu banyere ya, ma na-ejigide echiche nke μαθητής dịka onye na-eso ụzọ.
- source_word: ἀπ’ ἐκείνης τῆς ὥρας
  choice: Sitekwa n’oge ahụ gaa n’ihu
  rationale: Nkebiokwu ahụ nwere ike ịpụta malite n’oge ahụ, tinyere echiche na ihe ahụ gara n’ihu; Igbo a na-egosipụta ha abụọ n’ụzọ eke.
- source_word: ἔλαβεν ... αὐτὴν
  choice: kpọọrọ ya biri
  rationale: λαβάνω pụtara ịnata ma ọ bụ ịkpọrọ; n’ọnọdụ a, ọ na-egosi na onye ahụ nabatara Meri ka ya na ya biri.
- source_word: εἰς τὰ ἴδια
  choice: n’ụlọ nke ya
  rationale: N’ebe a, okwu ahụ na-ezo aka n’ihe ma ọ bụ ebe nke onye ahụ; ihe gbara ya gburugburu na-akwado ‘ụlọ nke ya,’ dịka English POB si gosi.
theological_decisions:
- issue: Ma okwu Jizọs ọ bụ naanị igosi mmekọrịta ezinụlọ ọhụrụ ma ọ bụ guzobe ọrụ ime mmụọ sara mbara
  choice: 'E tinyere okwu ahụ n’ụzọ nkịtị: “Lee, nne gị,” n’enweghị nkọwa ọzọ.'
  alternative: Ịgbakwunye okwu na-egosi na Jizọs guzobere Meri dịka nne ime mmụọ nke ndị kwere ekwe niile.
  rationale: Akwụkwọ Grik ekwughị ozizi sara mbara ahụ kpọmkwem n’amaokwu a; ntụgharị ekwesịghị itinye nkọwa nke otu ụka ma ọ bụ onye nkọwa.
- issue: Ihe εἰς τὰ ἴδια pụtara kpọmkwem
  choice: “n’ụlọ nke ya”
  alternative: “n’ime ihe nke ya” ma ọ bụ “n’etiti ndị nke ya”
  rationale: Okwu Grik dị ntakịrị obosara, ma n’ọnọdụ a ọ na-egosi na onye ahụ kpọọrọ Meri gaa biri n’ebe obibi ya; nke a bụ Igbo eke ma ghara ịgbanwe isi ihe.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ugwu ma dị mfe nghọta. A họọrọ “Lee” kama okwu ochie ma ọ bụ nke dị arọ; ahịrịokwu nke abụọ ka e mere ka ọ daa nke ọma n’Igbo ma chekwaa echiche nke nnabata na nlekọta na-aga n’ihu.
