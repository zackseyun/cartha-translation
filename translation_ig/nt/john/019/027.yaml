revisions:
- from: Mgbe ahụ, ọ sịrị onye ahụ na-eso ụzọ ya, “Lee, nne gị.” Sitekwa n’oge ahụ gaa n’ihu, onye ahụ na-eso ụzọ ya kpọọrọ ya biri n’ụlọ nke ya.
  to: Mgbe ahụ, ọ sịrị onye na-eso ụzọ ahụ, “Lee, nne gị.” Site n’oge ahụ, onye na-eso ụzọ ahụ kpọọrọ ya gaa n’ụlọ nke ya.
  rationale: The revision removes avoidable pronoun ambiguity, avoids adding an explicit durative nuance, and renders the disciple’s action directly as taking her into his own home. It preserves the source’s restrained wording and the English POB audit trail’s “Look” and “own home.”
  reviewer_model: gpt-5.6-terra
