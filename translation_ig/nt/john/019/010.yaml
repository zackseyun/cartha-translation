  to: Ya mere, Paịlet sịrị ya, “Ị gaghị agwa m okwu? Ị maghị na m nwere ikike[a] ịhapụ gị, na m nwekwara ikike ịkpọgide gị n’obe?”
  rationale: The revision makes the repeated claim of authority idiomatic in Standard Igbo by restoring the explicit subject in the second clause, clarifies the lexical footnote, and moves its anchor to the term under discussion. It does not alter the source meaning or resolve Pilate's claim theologically.
