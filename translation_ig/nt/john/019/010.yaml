  text: λέγει οὖν αὐτῷ ὁ Πιλᾶτος· Ἐμοὶ οὐ λαλεῖς; οὐκ οἶδας ὅτι ἐξουσίαν ἔχω ⸂ἀπολῦσαί σε καὶ ἐξουσίαν ἔχω σταυρῶσαί⸃ σε;
base_translation:
  language: en
  yaml_path: translation/nt/john/019/010.yaml
  text: So Pilate said to him[a], “Will you not speak to me? Do you not know that I have authority to release you and authority to crucify you?”
translation:
  language: ig
  text: Ya mere, Paịlet sịrị ya, “Ị gaghị agwa m okwu? Ị maghị na m nwere ikike[a] ịhapụ gị, na m nwekwara ikike ịkpọgide gị n’obe?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị “ikike” ebe a dịka “ike.” Okwu Grik exousia nwere ike ịpụta ikike, ikike iwu, ma ọ bụ ike. A họọrọ “ikike” n’ihi na Paịlet na-ekwu n’ọnọdụ ọchịchị na ikpe.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει οὖν
  choice: Ya mere, ... sịrị
  rationale: οὖν na-ejikọta okwu a na ihe bu ya ụzọ ma na-akwalite akụkọ ahụ; “Ya mere” na-echekwa mmetụta njikọ ahụ n’Igbo doro anya.
- source_word: αὐτῷ
  choice: ya
  rationale: Dative a na-egosi onye Paịlet gwara okwu; Igbo na-egosipụta ya nke ọma site na “sịrị ya.”
- source_word: Πιλᾶτος
  choice: Paịlet
  rationale: A sụgharịghị aha mmadụ; e dere ya dịka usoro mkpọpụta aha a si dị n’Igbo.
- source_word: Ἐμοὶ οὐ λαλεῖς
  choice: Ị gaghị agwa m okwu?
  rationale: Ἐμοὶ dị n’ihu maka nkwusi ike. Ajụjụ a n’Igbo na-echekwa ụda ịba mba na iwe Paịlet n’ihi na Jizọs azaghị ya.
- source_word: οὐκ οἶδας
  choice: Ị maghị
  rationale: Nke a bụ ntụgharị kpọmkwem ma dịkwa eke nke οἶδα n’ajụjụ nkwusi ike.
- source_word: ἐξουσίαν ἔχω
  choice: m nwere ikike
  rationale: “Ikike” nwere ike ịpụta ikike ọchịchị ma ọ bụ ikike ime ihe, nke dabara n’ọnọdụ ikpe na ọchịchị Paịlet karịa naanị ike anụahụ.
- source_word: ἀπολῦσαί σε
  choice: ịhapụ gị
  rationale: N’ọnọdụ ikpe, ἀπολύω pụtara ịtọhapụ onye a na-ejide; “ịhapụ gị” bụ okwu Igbo dị mfe ma ghara ikwu na a mara ya n’onwe ya dị ọcha.
- source_word: καὶ ἐξουσίαν ἔχω σταυρῶσαί σε
  choice: nweekwa ikike ịkpọgide gị n’obe
  rationale: A na-echekwa nkwughachi ἐξουσίαν, ma usoro Igbo “nweekwa” na-eme ka ahịrịokwu ahụ bụrụ nke eke ma nọgide na-emesi ụzọ abụọ Paịlet kwuru ike.
- source_word: σταυρῶσαί σε
  choice: ịkpọgide gị n’obe
  rationale: Nke a na-egosipụta kpọmkwem ụdị ọnwụ Roman ahụ, ọ naghịkwa eme ka ọrụ Paịlet kwuru na ya nwere ikike ime bụrụ ihe na-adịghị ike.
theological_decisions:
- issue: Ụdị ἐξουσία Paịlet kwuru na ya nwere
  choice: A sụgharịrị ya “ikike,” n’emeghị ka okwu Paịlet bụrụ nkwenye onye na-akọ akụkọ na ikike ya zuru oke ma ọ bụ na o ziri ezi.
  alternative: ike; ikike iwu kwadoro
  rationale: Amaokwu a na-akọ ihe Paịlet kwuru; ọ naghị akwado ya dị ka onye nwere ọchịchị nke onwe ya na-enweghị onye nyere ya. “Ikike” na-echekwa ma ọnọdụ ọchịchị na esemokwu nkà mmụta okpukpe nke Jizọs ga-aza n’amaokwu na-esote.
translation_notes:
  register: Igbo ọkọlọtọ, nke oge a, dị ùgwù ma dị mfe nghọta. A nọgidere na-enwe ụda ajụjụ ịba mba Paịlet na nkwusi ike dị n’okwu ya, na-enweghị ịkọwapụta esemokwu nkà mmụta okpukpe nke amaokwu na-esote ga-aza.
