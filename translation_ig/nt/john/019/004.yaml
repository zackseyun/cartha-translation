  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸂καὶ ἐξῆλθεν⸃ πάλιν ἔξω ὁ Πιλᾶτος καὶ λέγει αὐτοῖς· Ἴδε ἄγω ὑμῖν αὐτὸν ἔξω, ἵνα γνῶτε ὅτι ⸂οὐδεμίαν αἰτίαν εὑρίσκω ἐν αὐτῷ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/004.yaml
  text: Then Pilate went outside again and said to them[a], “Look, I am bringing him out to you so that you may know that I find no case against him.”
translation:
  language: ig
  text: Paịlet pụtakwara ọzọ n’èzí, sị ha, “Lee, ana m akpọpụta ya n’ihu unu ka unu mara na anaghị m ahụ ihe ọ bụla e ji ebo ya ebubo[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ịsụgharị ya, “anaghị m ahụ mmejọ ọ bụla n’ime ya.” Okwu Grik ahụ nwere ike ịpụta otú a, ma n’ebe a o yikarịrị ka ọ bụ okwu ikpe: Paịlet anaghị ahụ ebubo ziri ezi ma ọ bụ ihe ndabere e ji gbaa Jizọs akwụkwọ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθεν ... ἔξω
  choice: pụtakwara ... n’èzí
  rationale: Nke a na-egosi mmegharị Paịlet si n’ime pụta n’èzí n’ụzọ Igbo na-ada nke ọma; ‘-kwara’ na-ejikọta omume a na ihe gara ya n’ihu.
- source_word: πάλιν
  choice: ọzọ
  rationale: ‘Ọzọ’ na-egosi na Paịlet mere nke a ugboro ọzọ.
- source_word: λέγει
  choice: sị
  rationale: Ọ bụ ezie na Grik ji ngwaa oge ugbu a n’akụkọ, ‘sị’ bụ ụzọ Igbo nkịtị si akọ okwu e kwuru n’oge gara aga.
- source_word: Ἴδε
  choice: Lee
  rationale: ‘Lee’ bụ okwu Igbo doro anya e ji adọta uche ndị na-ege ntị.
- source_word: ἄγω ... αὐτὸν ἔξω
  choice: ana m akpọpụta ya n’ihu unu
  rationale: Nkebi a na-egosi na Paịlet na-eme ka Jizọs pụta ka ìgwè mmadụ hụ ya; usoro ‘ana m’ na-egosi omume ahụ na-aga n’ihu ugbu a.
- source_word: ἵνα γνῶτε
  choice: ka unu mara
  rationale: Nke a na-echekwa nzube nke ἵνα ma na-ada nke ọma n’Igbo.
- source_word: οὐδεμίαν αἰτίαν εὑρίσκω ἐν αὐτῷ
  choice: ahụghị m ihe ọ bụla e ji ebo ya ebubo
  rationale: N’ọnọdụ ikpe a, αἰτία na-ezo aka n’ihe ndabere ziri ezi maka ebubo. Nsụgharị a na-egosipụta echiche iwu ahụ n’enweghị ịgbasa ya ka ọ bụrụ nkwupụta ozizi sara mbara.
theological_decisions:
- issue: Okwu ikpe Paịlet ji kwupụta na ọ hụghị ihe e ji maa Jizọs ikpe
  choice: ahụghị m ihe ọ bụla e ji ebo ya ebubo
  alternative: ahụghị m mmejọ ọ bụla n’ime ya
  rationale: Nhọrọ a na-edebe okwu ahụ n’ọnọdụ nyocha na ikpe ụlọikpe. Nhọrọ ọzọ kwekwara omume, ma ọ pụrụ ịdị ka nkwupụta sara mbara banyere enweghị mmehie karịa ihe okwu αἰτία pụtara ozugbo n’ebe a.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. A họọrọ okwu na-egosi ọnọdụ ụlọikpe n’enweghị itinye nkọwa ozizi nke amaokwu ahụ ekwughị kpọmkwem.
