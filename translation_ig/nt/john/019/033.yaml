id: JHN.19.33
reference: John 19:33
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐπὶ δὲ τὸν Ἰησοῦν ἐλθόντες, ὡς εἶδον ⸂ἤδη αὐτὸν⸃ τεθνηκότα, οὐ κατέαξαν αὐτοῦ τὰ σκέλη,
base_translation:
  language: en
  yaml_path: translation/nt/john/019/033.yaml
  text: But when they came to Jesus[a], seeing that he was already dead[b], they did not break his legs.
translation:
  language: ig
  text: Ma mgbe ha bịarutere Jizọs[a], mgbe ha hụrụ na ọ nwụọlarị[b], ha agbajighị ụkwụ ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Jọn mechara jikọta omume a na Akwụkwọ Nsọ: “Ọ dịghị otu n’ime ọkpụkpụ ya a ga-agbaji” (Jọn 19:36; tụlee Ọpụ. 12:46; Ọnụ Ọgụgụ 9:12; Abụ Ọma 34:20).'
    reason: cross_reference
  - marker: b
    text: Ma ọ bụ, “mgbe ha hụrụ na ọ nwụlarị anwụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπὶ δὲ τὸν Ἰησοῦν ἐλθόντες
  choice: Ma mgbe ha bịarutere Jizọs
  rationale: A sụgharịrị participle a dị ka nkebiokwu oge ka ọ daa nke ọma n'Igbo; “Ma” na-egosipụta obere ọdịiche δέ nwere n'ihe ndị agha ahụ mere ndị ọzọ.
- source_word: ὡς εἶδον
  choice: ha hụrụ na ... ya mere
  rationale: Nhazi a na-egosipụta ma ịhụ ha hụrụ ọnọdụ ahụ ma na ọ bụ ya mere ihe ha mere sochirinụ ji mee, n'enweghị ịgbatị ihe ederede gabiga ókè.
- source_word: ἤδη
  choice: -larị
  rationale: Ngwụcha “-larị” na-egosipụta na ọnwụ ahụ emeelarị tupu ha erute ya.
- source_word: τεθνηκότα
  choice: ọ nwụọlarị
  rationale: Nke a na-egosipụta ọnwụ merela na ọnọdụ si na ya pụta; e debere ọzọ dị ka “ọ nwụlarị anwụ” na nkọwa ala peeji.
- source_word: οὐ κατέαξαν
  choice: ha agbajighị
  rationale: “Agbajighị” bụ okwu Igbo doro anya ma kwekọọ n'ịgbaji akụkụ ahụ ma ọ bụ ọkpụkpụ.
- source_word: τὰ σκέλη
  choice: ụkwụ ya
  rationale: “Ụkwụ ya” bụ ụzọ Igbo ebumpụta ụwa si ekwu akụkụ ụkwụ ndị a; a naghị etinye “ọkpụkpụ” n'amaokwu n'onwe ya tupu njikọ Akwụkwọ Nsọ dị n'amaokwu 36.
theological_decisions:
- issue: Njikọ omume a nwere na mmezu Akwụkwọ Nsọ banyere ọkpụkpụ Jizọs a na-agaghị agbaji
  choice: E debere amaokwu ahụ dịka akụkọ ihe mere n'ụzọ kwụ ọtọ, ebe nkọwa ala peeji na-egosi njikọ ahụ.
  alternative: Iji “ọkpụkpụ ụkwụ ya” n'amaokwu ahụ mee ka njikọ ya na Jọn 19:36 pụta ìhè ozugbo.
  rationale: Jọn 19:36 n'onwe ya na-akọwa njikọ ya na mmezu Akwụkwọ Nsọ. Ya mere, amaokwu 33 ekwesịghị ibu ụzọ tinye nkọwa nkà mmụta okpukpe nke ederede ga-akọwa ma e mesịa.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke oge a ma dị ùgwù. A họọrọ ahịrịokwu oge doro anya na usoro “ya mere” iji mee ka mmekọrịta dị n'etiti ịhụ na emeghị ihe ahụ pụta n'ụzọ nkịtị nye ndị na-agụ Igbo.
