revisions:
- from: Ya mere, n’ihi na ọ bụ ụbọchị nkwadebe[b], ndị Juu[a] rịọrọ Paịlet ka e gbajie ụkwụ ha, wepụkwa ha[d], ka ozu ndị ahụ ghara ịnọgide n’obe n’ụbọchị izu ike—n’ihi na ụbọchị izu ike ahụ bụ nnukwu ụbọchị[c].
  to: Ya mere, ndị Juu[a], ebe ọ bụ ụbọchị nkwadebe[b], rịọrọ Paịlet ka ozu ndị ahụ ghara ịnọgide n’obe n’ụbọchị izu ike—n’ihi na ụbọchị izu ike ahụ bụ nnukwu ụbọchị[c]—ka e gbajie ụkwụ ha ma wepụ ozu ndị ahụ[d].
  rationale: The revision preserves the Greek clause order, maintains the purpose force of both ἵνα clauses, and resolves the ambiguous Igbo pronoun at the final passive verb without adding interpretive detail. Footnote a is adjusted to give genuine alternatives for Ἰουδαῖοι.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T08:26:24Z'
review_pass:
  verdict: revise
  source_fidelity: The draft conveys the individual clauses, but it rearranges the two purpose clauses so that the request to break and remove is stated before the purpose that the bodies not remain on the cross. The revision follows the Greek sequence and makes the final removal explicitly refer to the bodies, as required by the context.
  naturalness: The revised wording is clear, modern Standard Igbo and retains an appropriately formal biblical register. “Ka e wepụ ozu ndị ahụ” prevents the pronoun in the draft from being read as referring to the legs rather than the bodies.
  terminology: '“Ndị Juu,” “ụbọchị nkwadebe,” “ụbọchị izu ike,” “obe,” and “ozu” are suitable. The note on Ἰουδαῖοι is corrected: “ndị Judia” is a possible geographic/ethnic alternative, whereas “ndị ọchịchị Judia” is not an appropriate equivalent here.'
  issues:
  - severity: medium
    issue: The order and scope of the purpose clauses are obscured.
    rationale: Greek first states the request that the bodies not remain on the cross during the Sabbath, gives the explanatory parenthesis, and then adds the request that the legs be broken and the bodies removed. Restoring this order better represents the source.
  - severity: medium
    issue: “wepụkwa ha” has an unclear antecedent.
    rationale: After “ụkwụ ha,” the pronoun may be read as referring to the legs. The Greek context concerns the removal of the bodies; naming them explicitly is a safe clarification.
  - severity: low
    issue: Footnote a calls one alternative “ndị ọchịchị Judia.”
    rationale: Ἰουδαῖοι may be rendered “ndị Judia” or, contextually, “ndị isi ndị Juu,” but “authorities of Judea” changes the referent and should not be presented as an equivalent.
  revised_text: Ya mere, ndị Juu[a], ebe ọ bụ ụbọchị nkwadebe[b], rịọrọ Paịlet ka ozu ndị ahụ ghara ịnọgide n’obe n’ụbọchị izu ike—n’ihi na ụbọchị izu ike ahụ bụ nnukwu ụbọchị[c]—ka e gbajie ụkwụ ha ma wepụ ozu ndị ahụ[d].
  revised_footnotes:
  - marker: a
    text: N’Oziọma Jọn, “ndị Juu” nwere ike mgbe ụfọdụ ịpụta ndị isi ndị Juu ma ọ bụ ndị Judia.
    reason: alternative_reading
  - marker: b
    text: Ya bụ, ụbọchị a na-akwadebe ihe tupu ụbọchị izu ike; a pụkwara ịkpọ ya “Ụbọchị Nkwadebe.”
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “ụbọchị izu ike ahụ bụ ụbọchị pụrụ iche ma dị mkpa.”
    reason: alternative_reading
  - marker: d
    text: Ma ọ bụ, “budata ozu ndị ahụ” ma ọ bụ “buru ozu ndị ahụ pụọ.”
    reason: lexical_alternative
  revision_rationale: The revision preserves the Greek clause order, maintains the purpose force of both ἵνα clauses, and resolves the ambiguous Igbo pronoun at the final passive verb without adding interpretive detail. Footnote a is adjusted to give genuine alternatives for Ἰουδαῖοι.
