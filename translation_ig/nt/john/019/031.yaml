id: JHN.19.31
reference: John 19:31
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Οἱ οὖν Ἰουδαῖοι, ⸂ἐπεὶ παρασκευὴ ἦν, ἵνα μὴ μείνῃ ἐπὶ τοῦ σταυροῦ τὰ σώματα ἐν τῷ σαββάτῳ⸃, ἦν γὰρ μεγάλη ἡ ἡμέρα ἐκείνου τοῦ σαββάτου, ἠρώτησαν τὸν Πιλᾶτον ἵνα κατεαγῶσιν αὐτῶν τὰ σκέλη καὶ ἀρθῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/031.yaml
  text: Therefore the Jews[a], because it was the day of preparation[d][c][b], asked Pilate that the bodies might not remain on the cross on the Sabbath—for that Sabbath day was a great one—and that their legs might be broken and they might be taken away.
translation:
  language: ig
  text: Ya mere, ndị Juu[a], ebe ọ bụ ụbọchị nkwadebe[b], rịọrọ Paịlet ka ozu ndị ahụ ghara ịnọgide n’obe n’ụbọchị izu ike—n’ihi na ụbọchị izu ike ahụ bụ nnukwu ụbọchị[c]—ka e gbajie ụkwụ ha ma wepụ ozu ndị ahụ[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’Oziọma Jọn, “ndị Juu” nwere ike mgbe ụfọdụ ịpụta ndị isi ndị Juu ma ọ bụ ndị Judia.
    reason: alternative_reading
  - marker: b
    text: Ya bụ, ụbọchị a na-akwadebe ihe tupu ụbọchị izu ike; a pụkwara ịkpọ ya “Ụbọchị Nkwadebe.”
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “ụbọchị izu ike ahụ bụ ụbọchị pụrụ iche ma dị mkpa.”
    reason: alternative_reading
  - marker: d
    text: Ma ọ bụ, “budata ozu ndị ahụ” ma ọ bụ “buru ozu ndị ahụ pụọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἱ οὖν Ἰουδαῖοι
  choice: Ya mere ... ndị Juu
  rationale: “Ya mere” na-egosi njikọ nkwubi okwu ma ọ bụ usoro ihe omume nke οὖν; “ndị Juu” na-ahapụ ohere sara mbara nke Ἰουδαῖοι n’amaokwu a n’emeghị ka ọ bụrụ naanị ndị isi.
- source_word: ἐπεὶ παρασκευὴ ἦν
  choice: n’ihi na ọ bụ ụbọchị nkwadebe
  rationale: παρασκευή bụ ụbọchị a na-akwadebe tupu ụbọchị izu ike; ntụgharị a doro ndị na-agụ Igbo nke oge a anya.
- source_word: ἵνα μὴ μείνῃ ... τὰ σώματα
  choice: ka ozu ndị ahụ ghara ịnọgide
  rationale: “Ka ... ghara” na-egosipụta ebumnuche nke ἵνα na subjunctive, ebe “ịnọgide” na-enye echiche nke μείνῃ.
- source_word: ἐπὶ τοῦ σταυροῦ
  choice: n’obe
  rationale: Nke a bụ ụzọ Igbo dị nkenke ma bụrụkwa nke e ji eme ihe maka ọnọdụ ihe dị n’elu obe.
- source_word: ἐν τῷ σαββάτῳ
  choice: n’ụbọchị izu ike
  rationale: A sụgharịrị σαββάτῳ n’ụzọ nkọwa doro onye Igbo nkịtị anya, ya bụ ụbọchị izu ike ndị Juu.
- source_word: ἦν γὰρ μεγάλη ἡ ἡμέρα ἐκείνου τοῦ σαββάτου
  choice: n’ihi na ụbọchị izu ike ahụ bụ nnukwu ụbọchị
  rationale: “Nnukwu” na-edobe isi echiche nkịtị nke μεγάλη ma ghara ịkọwa kpọmkwem ihe mere ụbọchị ahụ ji pụọ iche.
- source_word: ἠρώτησαν τὸν Πιλᾶτον
  choice: rịọrọ Paịlet
  rationale: N’ọnọdụ a ἐρωτάω pụtara ịrịọ onye ọchịchị ihe; “rịọrọ” dabara adaba karịa “jụrụ.”
- source_word: ἵνα κατεαγῶσιν αὐτῶν τὰ σκέλη
  choice: ka e gbajie ụkwụ ha
  rationale: A hapụrụ ya n’olu nnara dịka passive subjunctive Grik si dị, na-enweghị ịkpọ onye ga-eme ya aha.
- source_word: καὶ ἀρθῶσιν
  choice: wepụkwa ha
  rationale: αἴρω nwere ike ịpụta iwepụ ma ọ bụ iburu pụọ; “wepụ” na-edobe obosara ihe okwu ahụ nwere n’ebe a.
theological_decisions:
- issue: Ihe μεγάλη pụtara gbasara ụbọchị izu ike ahụ
  choice: nnukwu ụbọchị
  alternative: ụbọchị pụrụ iche ma dị mkpa
  rationale: Nhọrọ a na-anọ nso n’okwu Grik ma hapụ ihe kpatara ịdị ukwuu ụbọchị ahụ n’enweghị itinye nkọwa ọdịnala n’ime ederede.
- issue: Ndị Ἰουδαῖοι na-ezo aka na ha n’Oziọma Jọn
  choice: ndị Juu
  alternative: ndị isi ndị Juu; ndị Judia
  rationale: Ederede ahụ ekwughị kpọmkwem na ọ bụ naanị ndị isi. Ya mere, e debere okwu sara mbara n’ederede, ma kọwaa ohere nke nghọta dị warara n’okpuru peeji.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta, dee ya. A họọrọ “ụbọchị izu ike” maka Sabbath, “obe” maka σταυρός, na “ozu” maka σώματα n’ọnọdụ ọnwụ a. Akara ala peeji [a] ruo [d] niile dị n’ederede n’ebe okwu ha na-akọwa nọ.
