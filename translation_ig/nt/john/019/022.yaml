  naturalness: ‘Paịlet zara’ is natural Standard Igbo. For this idiomatic, emphatic response, ‘Ihe m dere, m dere’ is concise and natural; the repeated verb preserves the Greek rhetorical repetition without forcing a non-native aspectual construction.
