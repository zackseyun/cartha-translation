    issue: The repeated Greek form is translated asymmetrically.
    rationale: γέγραφα is repeated exactly. ‘Ihe m dere, edewo m ya’ changes the second occurrence’s aspectual form and supplies ya only there. A matched repeated Igbo verb better reflects the source’s form and force.
