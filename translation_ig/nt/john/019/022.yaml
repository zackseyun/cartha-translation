  yaml_path: translation/nt/john/019/022.yaml
  text: Pilate answered[a], “What I have written, I have written.”
translation:
  language: ig
  text: Paịlet zara[a], “Ihe m dere, m dere.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “Ihe m dere, edewo m ya.” N’asụsụ Grik, e ji ụdị perfect mee otu okwu ahụ ugboro abụọ; nke a pụrụ imesi ike na ihe Paịlet dere ka na-adị irè nakwa na ọ gaghị agbanwe ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: zara
  rationale: Okwu a bụ aorist nke ἀποκρίνομαι, nke pụtara ‘zara’ n'okwu mkparịta ụka; ‘zara’ bụkwa okwu Igbo nkịtị na nke doro anya.
- source_word: ὁ Πιλᾶτος
  choice: Paịlet
  rationale: A hapụrụ edemede njirimara Grik ahụ dịka Igbo si eme n'aha mmadụ, ma jiri ụdị aha a maara nke ọma n'Igbo.
- source_word: Ὃ
  choice: Ihe
  rationale: Nnochiaha neuter a na-arụ ọrụ dịka aha ma pụta ‘ihe ahụ nke’; ‘Ihe’ na-ebute nkebiokwu ‘Ihe m dere’ n'ụzọ ebumpụta ụwa n'Igbo.
- source_word: γέγραφα
  choice: m dere / edewo m ya
  rationale: Perfect active indicative nke γράφω na-egosi ihe e mere nke nsonaazụ ya ka dị. Igbo enweghị usoro tense dabara kpọmkwem na perfect Grik; ‘edewo m ya’ na-egosi mmezu na ọnọdụ ya ka guzosiri ike, ebe nkwughachi echiche ahụ na-echekwa ike okwu Pilate.
theological_decisions:
- issue: Ike nke perfect a kwughachiri, γέγραφα γέγραφα
  choice: “Ihe m dere, edewo m ya.”
  alternative: “Ihe m dere, m dere ya.”
  rationale: Ụdị a na-eme ka nkwubi okwu Pilate na nkwụsi ike ya pụta ìhè, ma ọ naghị atụkwasị nkọwa ozizi n'ihe odide ahụ. Ebe Igbo na-adịghị enwe perfect kwekọrọ kpọmkwem na nke Grik, e tinyere nkọwa ọzọ n'okpuru ala iji chekwaa ezigbo nhọrọ ntụgharị.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. A họọrọ ‘edewo m ya’ iji mee ka nsonaazụ na-adịgide adịgide nke perfect Grik pụta, ma e chekwara ntụgharị dị mfe ‘m dere ya’ n'okpuru ala. Akara [a] dị n'isiokwu dịka achọrọ.
