  text: καὶ βαστάζων ⸂αὑτῷ τὸν σταυρὸν⸃ ἐξῆλθεν εἰς ⸀τὸν λεγόμενον Κρανίου Τόπον, ⸀ὃ λέγεται Ἑβραϊστὶ Γολγοθα,
base_translation:
  language: en
  yaml_path: translation/nt/john/019/017.yaml
  text: And carrying the cross by himself[a], he went out to the place called Skull Place, which in Hebrew is called Golgotha.
translation:
  language: ig
  text: Ka o bu obe ahụ n’onwe ya[a], ọ pụrụ gaa n’ebe a na-akpọ Ebe Okpokoro Isi, nke a na-akpọ Golgota n’asụsụ Hibru.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma eleghị anya, “n’asụsụ Aramaik.” Okwu Jọn ji maka “n’asụsụ Hibru” nwekwara ike izo aka n’asụsụ Semitik ndị mmadụ n’ógbè Judia na-asụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: βαστάζων
  choice: na-ebu
  rationale: Okwu a na-egosi ibu ihe n’ahụ n’ezie; “na-ebu” bụ okwu Igbo doro anya ma kwekọọ n’omume ahụ.
- source_word: αὑτῷ τὸν σταυρόν
  choice: obe ya n’onwe ya
  rationale: 'Nke a na-egosipụta ike okwu nnọchiaha ntụgharị ahụ: ọ bụ ya onwe ya bu obe ahụ, na-enweghị ime ka okwu Grik kwuo karịa ihe o kwuru.'
- source_word: σταυρός
  choice: obe
  rationale: “Obe” bụ okwu Igbo a maara nke ọma maka σταυρός n’akụkọ ahụhụ Jizọs; okwu Grik ebe a anaghị amanye ntụgharị dị warara dịka naanị osisi obe kwụ n’akụkụ.
- source_word: ἐξῆλθεν
  choice: pụọ gaa
  rationale: Nke a na-egosipụta ịpụ n’otu ebe ma gawa ebe ọzọ n’Igbo dị mfe ma bụrụ nke e ji eme ihe ugbu a.
- source_word: τὸν λεγόμενον Κρανίου Τόπον
  choice: ebe a na-akpọ Ebe Okpokoro Isi
  rationale: Nke a na-echekwa ma “ebe” (τόπος) ma “okpokoro isi” (κρανίον), ma mee ya ka ọ bụrụ aha ebe a na-aghọta nke ọma n’Igbo.
- source_word: Ἑβραϊστί
  choice: n’asụsụ Hibru
  rationale: Isi ederede na-agbaso okwu Grik kpọmkwem, “n’asụsụ Hibru”; e debere ohere nke Aramaik n’okpuru peeji.
- source_word: Γολγοθα
  choice: Golgota
  rationale: Aha ebe ahụ ka e dere dịka ụda ya si dabara n’usoro mkpụrụokwu Igbo.
theological_decisions:
- issue: Ihe Ἑβραϊστί na-ezo aka na ya
  choice: n’asụsụ Hibru
  alternative: n’asụsụ Aramaik
  rationale: Ederede Grik kwuru Hibru kpọmkwem, ya mere isi ederede na-echekwa ya. Ma n’oge ahụ, okwu Jọn ji mee ihe nwere ike ịgụnye asụsụ Semitik ndị obodo Judia na-asụ, ya mere a na-edebe Aramaik dịka ihe ọzọ nwere ike ịbụ n’okpuru peeji.
- issue: Ike okwu αὑτῷ n’ihe gbasara ibu obe
  choice: obe ya n’onwe ya
  alternative: obe nke ya
  rationale: Nhọrọ ahụ na-emesi onye na-ebu ya ike—ọ bụ ya onwe ya—ma ghara ime ka nnọchiaha ahụ bụrụ naanị nkwupụta nwe.
translation_notes:
  register: Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta. E ji “Ebe Okpokoro Isi” chekwaa ọdịdị aha ebe ahụ n’asụsụ mbụ, ebe “Golgota” bụ ntụgharị ụda aha ahụ.
