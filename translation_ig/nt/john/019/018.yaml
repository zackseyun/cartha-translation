    reason: lexical_alternative
  revision_rationale: The revision avoids an unintended coordinated-subject reading, preserves the crucifixion of the two others in relation to Jesus, and renders ἐντεῦθεν καὶ ἐντεῦθεν explicitly as one on one side and one on the other. It retains the contextually clear ‘between them’ expression without imposing any theological interpretation. The footnote is moved to the phrase for which it supplies a compact alternative.
