source:
  edition: SBLGNT
  text: ὅπου αὐτὸν ἐσταύρωσαν, καὶ μετ’ αὐτοῦ ἄλλους δύο ἐντεῦθεν καὶ ἐντεῦθεν, μέσον δὲ τὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/018.yaml
  text: where they crucified him[a], and with him two others, one on each side, and Jesus in the middle.
translation:
  language: ig
  text: ebe ha kpọgidere ya n’obe, ha kpọgidekwara mmadụ abụọ ọzọ n’obe n’akụkụ ya, otu n’akụkụ nke a, otu n’akụkụ nke ọzọ[a], Jizọs nọkwa n’etiti ha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ, n’ụzọ dị nkenke: “otu n’akụkụ nke ọ bụla, Jizọs nọ n’etiti ha.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπου
  choice: ebe
  rationale: Ọ bụ adverb na-egosi ebe; “ebe” bụ nsụgharị Igbo dị mfe ma kwekọọ n’ụzọ ahịrịokwu a si gaa.
- source_word: ἐσταύρωσαν
  choice: ha kpọgidere ya n’obe
  rationale: N’akụkọ ahụhụ Jizọs, okwu a pụtara igbu mmadụ site n’ịkpọgide ya n’obe; nsụgharị a ziri ezi ma ọ naghị agbakwụnye nkọwa banyere otú e si kpọgide ya.
- source_word: μετ’ αὐτοῦ
  choice: ha na ya kpọgidekwara
  rationale: Nke a na-egosi na a kpọgidere ndị ọzọ ahụ n’otu ebe na otu oge ahụ ya na Jizọs; nhazi a na-ada ka Igbo nkịtị.
- source_word: ἄλλους δύο
  choice: mmadụ abụọ ọzọ
  rationale: Grik kwuru naanị “abụọ ọzọ,” ma Igbo chọrọ aha a na-agụ ọnụ ebe a. “Mmadụ” bụ okwu sara mbara nke na-adịghị etinye nkọwa ọzọ na-enweghị isi.
- source_word: ἐντεῦθεν καὶ ἐντεῦθεν
  choice: otu n’otu akụkụ
  rationale: Nkebiokwu a na-egosi na onye nke ọ bụla nọ n’akụkụ dị iche; “otu n’otu akụkụ” na-egosipụta nkesa ahụ n’Igbo dị nkenke.
- source_word: μέσον
  choice: n’etiti ha
  rationale: Ọ na-egosi ọnọdụ Jizọs n’etiti mmadụ abụọ ahụ. Ịtinye “ha” na-eme ka mmekọrịta ebe ahụ doo anya n’Igbo, dịka ihe gbara ya gburugburu si gosi.
- source_word: δὲ
  choice: ma
  rationale: δέ bụ njikọ dị nro nke na-atụgharị uche gaa n’ọnọdụ Jizọs; “ma” na-echekwa ntakịrị ọdịiche ahụ n’enweghị ime ka ọ bụrụ esemokwu siri ike.
- source_word: τὸν Ἰησοῦν
  choice: Jizọs
  rationale: Ọ bụ Jizọs ka e debere n’etiti; aha ahụ ka e dere n’ụdị Standard Igbo a na-ejikarị.
theological_decisions:
- issue: Ma a ga-ekwupụta hoo haa na Jizọs nọ n’etiti mmadụ abụọ ahụ
  choice: “otu n’otu akụkụ, ma Jizọs nọ n’etiti ha”
  alternative: “otu n’akụkụ nke a, otu n’akụkụ nke ọzọ, ma Jizọs nọ n’etiti”
  rationale: Grik na-egosi mmadụ abụọ n’akụkụ abụọ dị iche, Jizọs adịkwa n’etiti. Nhọrọ a na-echekwa ihe oyiyi ọnọdụ ahụ ma na-ada nke ọma n’Igbo, n’enweghị itinye nkọwa ozizi ọzọ.
translation_notes:
  register: Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. E ji “kpọgidere ya n’obe” mee ka echiche σταυρόω doo anya; e zere ịkọwapụta usoro ịkpọgide ahụ karịa ihe Grik kwuru.
