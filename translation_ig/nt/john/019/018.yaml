revisions:
- from: ebe ha kpọgidere ya n’obe[a], ha na ya kpọgidekwara mmadụ abụọ ọzọ, otu n’otu akụkụ, ma Jizọs nọ n’etiti ha.
  to: ebe ha kpọgidere ya n’obe, ha kpọgidekwara mmadụ abụọ ọzọ n’obe n’akụkụ ya, otu n’akụkụ nke a, otu n’akụkụ nke ọzọ[a], Jizọs nọkwa n’etiti ha.
  rationale: The revision avoids an unintended coordinated-subject reading, preserves the crucifixion of the two others in relation to Jesus, and renders ἐντεῦθεν καὶ ἐντεῦθεν explicitly as one on one side and one on the other. It retains the contextually clear ‘between them’ expression without imposing any theological interpretation. The footnote is moved to the phrase for which it supplies a compact alternative.
