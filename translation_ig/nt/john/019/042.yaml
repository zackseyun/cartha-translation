    text: 'A pụkwara ịsụ ya: “ụbọchị nkwadebe ndị Juu” ma ọ bụ “Nkwadebe nke ndị Juu.”'
    reason: lexical_alternative
  revision_rationale: The revision replaces a potentially opaque verb with the natural, source-faithful ‘debere’ and uses the clearer genitive construction ‘nke ndị Juu.’ It retains the Greek sequence and causal sense without specifying which preparation day is meant.
