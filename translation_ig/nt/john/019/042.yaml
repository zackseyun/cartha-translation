review_pass:
  verdict: revise
  source_fidelity: The draft preserves the narrative connective, both causal expressions, the tomb’s proximity, and the act of placing Jesus. However, ‘tọgbọrọ’ is not the clearest contemporary Standard Igbo choice here; ‘debere’ naturally renders τίθημι (‘placed/laid’) without adding the fuller act of burial.
  naturalness: ‘Ụbọchị nkwadebe nke ndị Juu’ is more idiomatic and unambiguous Standard Igbo than the juxtaposed genitive ‘ụbọchị nkwadebe ndị Juu.’ The revised sentence remains concise while retaining the two distinct reasons expressed in Greek.
  terminology: ‘Ụbọchị nkwadebe’ appropriately renders παρασκευή without imposing a particular calendar reconstruction. ‘Ili’ suitably renders μνημεῖον in this context, and ‘Jizọs’ is standard. The footnote continues to preserve viable lexical/formal alternatives.
  issues:
  - severity: medium
    issue: The verb ‘tọgbọrọ’ is potentially unclear or less natural in this burial-placement context.
    rationale: ἔθηκαν means ‘they placed/laid.’ ‘Ha debere Jizọs n’ebe ahụ’ is clear, modern Standard Igbo and does not overstate the action as burial.
  - severity: low
    issue: The genitive phrase ‘ụbọchị nkwadebe ndị Juu’ is somewhat compressed.
    rationale: ‘Ụbọchị nkwadebe nke ndị Juu’ expresses the relationship more naturally in Standard Igbo while retaining the source’s ambiguity about the precise force of the genitive.
  revised_text: Ya mere, n’ihi ụbọchị nkwadebe nke ndị Juu[a], nakwa n’ihi na ili ahụ dị nso, ha debere Jizọs n’ebe ahụ.
  revised_footnotes:
