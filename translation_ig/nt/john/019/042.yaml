  to: Ya mere, n’ihi ụbọchị nkwadebe nke ndị Juu[a], nakwa n’ihi na ili ahụ dị nso, ha debere Jizọs n’ebe ahụ.
  rationale: The revision replaces a potentially opaque verb with the natural, source-faithful ‘debere’ and uses the clearer genitive construction ‘nke ndị Juu.’ It retains the Greek sequence and causal sense without specifying which preparation day is meant.
