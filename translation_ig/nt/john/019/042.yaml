id: JHN.19.42
reference: John 19:42
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐκεῖ οὖν διὰ τὴν παρασκευὴν τῶν Ἰουδαίων, ὅτι ἐγγὺς ἦν τὸ μνημεῖον, ἔθηκαν τὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/042.yaml
  text: So there[a], because of the Jews’ day of preparation, since the tomb was nearby, they laid Jesus there.
translation:
  language: ig
  text: Ya mere, n’ihi ụbọchị nkwadebe nke ndị Juu[a], nakwa n’ihi na ili ahụ dị nso, ha debere Jizọs n’ebe ahụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ịsụ ya: “ụbọchị nkwadebe ndị Juu” ma ọ bụ “Nkwadebe nke ndị Juu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκεῖ
  choice: n’ebe ahụ
  rationale: Ọ bụ okwu na-egosi kpọmkwem ebe e liri ya; ‘n’ebe ahụ’ bụ Igbo doro anya ma dịkwa mma n’ọnọdụ a.
- source_word: οὖν
  choice: Ya mere
  rationale: Ọ na-ejikọta ihe a mere na ihe ndị a kọrọ tupu ya, ma gosipụta ihe si na ha pụta.
- source_word: διὰ τὴν παρασκευὴν
  choice: n’ihi ụbọchị nkwadebe
  rationale: διά ya na accusative na-egosi ihe kpatara omume ahụ; ‘ụbọchị nkwadebe’ na-eme ka okwu kalenda a doo onye na-agụ ugbu a anya n’etinyeghị nkọwa karịrị isi mmalite.
- source_word: τῶν Ἰουδαίων
  choice: ndị Juu
  rationale: E debere njikọ genitive ahụ dịka ‘ụbọchị nkwadebe ndị Juu,’ nke nwere ike igosi ụbọchị nkwadebe metụtara omenala ndị Juu n’enweghị ịkọwa ya karịa ihe Grik kwuru.
- source_word: ὅτι
  choice: n’ihi na
  rationale: N’ebe a, ọ na-ewebata ihe ọzọ mere ha ji họrọ ili ahụ.
- source_word: ἐγγὺς
  choice: dị nso
  rationale: Nke a bụ ụzọ Igbo nkịtị na nke doro anya isi kwuo na ili ahụ anọghị ebe dị anya.
- source_word: μνημεῖον
  choice: ili
  rationale: N’ọnọdụ olili a, ‘ili’ bụ okwu Igbo a na-aghọta ngwa ngwa maka ebe a na-edebe onye nwụrụ anwụ.
- source_word: ἔθηκαν
  choice: ha tọgbọrọ
  rationale: ‘Tọgbọrọ’ na-egosi idobe Jizọs n’ili ahụ ma ghara ime ka ngwaa ahụ bụrụ ‘lie,’ nke ga-akọwa ihe karịrị τίθημι.
- source_word: τὸν Ἰησοῦν
  choice: Jizọs
  rationale: A sụgharịrị aha ahụ n’ụdị Standard Igbo a na-eji eme ihe n’oge a.
theological_decisions:
- issue: Ihe παρασκευή pụtara n’akụkọ Ahụhụ Kraịst
  choice: ụbọchị nkwadebe
  alternative: Nkwadebe
  rationale: Okwu Grik ahụ nwere ike ịbụ aha ụbọchị pụrụ iche. ‘Ụbọchị nkwadebe’ na-enyere ndị na-agụ ugbu a aka ịghọta ya, ma ọ naghị ekpebi kpọmkwem ụdị nkwadebe ma ọ bụ usoro kalenda karịa ihe amaokwu ahụ kwuru.
- issue: Njikọ τῶν Ἰουδαίων na παρασκευή
  choice: ụbọchị nkwadebe ndị Juu
  alternative: ụbọchị nkwadebe nke ndị Juu; Nkwadebe ndị Juu
  rationale: 'Nhọrọ a na-edobe usoro na mgbagwoju anya dị na Grik: ọ na-ejikọta ụbọchị ahụ na ndị Juu n’emeghị ka okwu ahụ bụrụ ikpe okpukpe ma ọ bụ ikpe agbụrụ megide ndị Juu.'
translation_notes:
  register: Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E jiri ‘nakwa’ kewaa ihe abụọ kpatara omume ahụ ka ọtụtụ ‘n’ihi’ ghara ime ka ahịrịokwu ahụ sie ike, ma a ka debere njikọ causal abụọ dị na Grik.
