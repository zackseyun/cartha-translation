review_pass:
  verdict: revise
  source_fidelity: The translation accurately conveys taking Jesus’s body, binding it with linen cloths and spices, and the reference to Jewish custom. However, ἐνταφιάζειν is most directly ‘to bury’/‘in burying’; rendering it as ‘preparing a corpse for a grave’ narrows the infinitive to preparatory activity beyond what the wording itself states.
  naturalness: The main clause is clear and idiomatic Standard Igbo. Recasting the final phrase as ‘n'ili ozu’ is both more natural and closer to the Greek construction than ‘n'ịkwadebe ozu maka ili.’
  terminology: ‘ahụ Jizọs,’ ‘ákwà linin,’ ‘ihe ndị na-esi ísì ụtọ,’ and ‘ndị Juu’ are suitable. The alternative geographic sense should be expressed as people living in Judea, rather than the less natural phrasing ‘aha ndị si n'ógbè Judia.’
  issues:
  - severity: medium
    issue: The final infinitive is overly explicated as burial preparation.
    rationale: ἐνταφιάζειν denotes burying/performing burial rites. Although the immediate narrative concerns preparation, ‘n'ịkwadebe ozu maka ili’ restricts the stated custom to preparation rather than rendering the broader burial action.
  - severity: low
    issue: Footnote wording is grammatically and idiomatically awkward.
    rationale: ‘kama dịka aha agbụrụ na okpukpe’ lacks a parallel verbal construction, and ‘aha ndị si n'ógbè Judia’ is less clear than referring directly to people living in Judea.
  revised_text: Ya mere, ha weere ahụ Jizọs, were ákwà linin na ihe ndị na-esi ísì ụtọ kechie ya, dị ka omenala ndị Juu si dị n'ili ozu.[a]
  revised_footnotes:
