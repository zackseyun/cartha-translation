    text: A pụkwara ịsụgharị ya “ndị Judia” ma ọ bụrụ na a ghọta okwu ahụ dịka ndị bi na mpaghara Judia, kama ịbụ aha agbụrụ ma ọ bụ okpukpe. N'ebe a, ihe gbara ya gburugburu na-akwado na ọ bụ omenala olili nke ndị Juu n'ozuzu ka a na-ekwu maka ya.
    reason: alternative_reading
  revision_rationale: The revision preserves the narrative connective, the burial cloths and spices, and the cultural sense of τοῖς Ἰουδαίοις, while rendering ἐνταφιάζειν without limiting it to preparatory acts. The footnote is also made idiomatic and preserves the lexical ambiguity without asserting the geographic reading.
