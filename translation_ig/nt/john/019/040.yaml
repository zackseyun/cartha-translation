  text: ἔλαβον οὖν τὸ σῶμα τοῦ Ἰησοῦ καὶ ἔδησαν ⸀αὐτὸ ὀθονίοις μετὰ τῶν ἀρωμάτων, καθὼς ἔθος ἐστὶν τοῖς Ἰουδαίοις ἐνταφιάζειν.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/040.yaml
  text: So they took Jesus’s body and wrapped it in linen cloths with the spices[a], as is the burial custom of the Jews.
translation:
  language: ig
  text: Ya mere, ha weere ahụ Jizọs, were ákwà linin na ihe ndị na-esi ísì ụtọ kechie ya, dị ka omenala ndị Juu si dị n'ili ozu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “ndị Judia” ma ọ bụrụ na a ghọta okwu ahụ dịka ndị bi na mpaghara Judia, kama ịbụ aha agbụrụ ma ọ bụ okpukpe. N'ebe a, ihe gbara ya gburugburu na-akwado na ọ bụ omenala olili nke ndị Juu n'ozuzu ka a na-ekwu maka ya.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔλαβον οὖν
  choice: Ya mere, ha weere
  rationale: “Ya mere” na-egosi njikọ na ihe mere n'amaokwu bu ụzọ; “ha weere” na-egosi na ha weghaara ahụ ahụ maka nkwadebe ili.
- source_word: τὸ σῶμα τοῦ Ἰησοῦ
  choice: ahụ Jizọs
  rationale: “Ahụ” bụ ntụgharị kwụ ọtọ ma dịkwa nsọpụrụ karịa okwu pụrụ ịpụta ihe ike maka ozu.
- source_word: ἔδησαν αὐτὸ ὀθονίοις
  choice: were ákwà linin ... kechie ya
  rationale: “Kechie” na-ejide echiche δέω nke ikechi ma na-ada nke ọma n'Igbo n'ihe gbasara iji ákwà linin kwadebe ahụ maka ili.
- source_word: μετὰ τῶν ἀρωμάτων
  choice: na ihe ndị na-esi ísì ụtọ
  rationale: Nke a na-egosi ihe ndị na-esi ísì ụtọ e ji akwadebe ozu, n'ụzọ ndị na-agụ Igbo taa ga-aghọta nke ọma.
- source_word: καθὼς ἔθος ἐστὶν
  choice: dị ka omenala ... si dị
  rationale: Nkebiokwu a na-egosi na omume ahụ kwekọrọ n'omenala a maara ama.
- source_word: τοῖς Ἰουδαίοις
  choice: ndị Juu
  rationale: N'ebe a okwu ahụ na-ezo aka n'omenala olili nke ndị Juu n'ozuzu, ọ bụghị naanị ndị bi na Judia ma ọ bụ ndị isi ha.
- source_word: ἐνταφιάζειν
  choice: n'ịkwadebe ozu maka ili
  rationale: Okwu Grik a nwere ike ịgụnye nkwadebe ahụ maka olili, ọ bụghị naanị itinye ya n'ili; ntụgharị a dabara n'omume a kọwara n'amaokwu ahụ.
theological_decisions:
- issue: Ihe τοῖς Ἰουδαίοις pụtara
  choice: ndị Juu
  alternative: ndị Judia
  rationale: Ihe gbara ya gburugburu bụ omenala olili nke ndị Juu n'ozuzu. Agbanyeghị, e debere ohere ntụgharị nke ala/obodo n'ala ala peeji ka a ghara ikpochapụ ịdị mgbagwoju anya nke okwu Grik ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị mfe nghọta ma dịkwa ugwu, sụgharịa ya. “Ákwà linin” na-edobe ụdị ihe e ji kechie ahụ; “ịkwadebe ozu maka ili” na-eme ka ọrụ ἐνταφιάζειν doo anya n'enweghị ime ka ọ bụrụ naanị itinye ozu n'ili.
