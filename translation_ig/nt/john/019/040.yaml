revisions:
- from: Ya mere, ha weere ahụ Jizọs, were ákwà linin na ihe ndị na-esi ísì ụtọ kechie ya, dị ka omenala ndị Juu si dị n'ịkwadebe ozu maka ili.[a]
  to: Ya mere, ha weere ahụ Jizọs, were ákwà linin na ihe ndị na-esi ísì ụtọ kechie ya, dị ka omenala ndị Juu si dị n'ili ozu.[a]
  rationale: The revision preserves the narrative connective, the burial cloths and spices, and the cultural sense of τοῖς Ἰουδαίοις, while rendering ἐνταφιάζειν without limiting it to preparatory acts. The footnote is also made idiomatic and preserves the lexical ambiguity without asserting the geographic reading.
  reviewer_model: gpt-5.6-terra
