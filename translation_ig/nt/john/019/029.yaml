id: JHN.19.29
reference: John 19:29
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸀σκεῦος ἔκειτο ὄξους μεστόν· ⸂σπόγγον οὖν μεστὸν τοῦ⸃ ὄξους ⸀ὑσσώπῳ περιθέντες προσήνεγκαν αὐτοῦ τῷ στόματι.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/029.yaml
  text: A container full of sour wine was lying there[b][a]; so they put a sponge full of the sour wine on hyssop and brought it to his mouth.
translation:
  language: ig
  text: Otu arịa jupụtara na mmanya gbara ụka[a] dina n'ebe ahụ; ya mere, ha tinyere ogbo jupụtara na mmanya gbara ụka n'elu hisọp[b] ma wetara ya n'ọnụ ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya ‘viniga.’ Okwu Grik ahụ nwere ike ịpụta mmanya gbara ụka ma ọ bụ viniga; n'ebe a, o yikarịrị ka ọ na-ekwu maka mmanya gbara ụka ndị agha na-aṅụ.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya ‘n'osisi hisọp’ ma ọ bụ ‘jiri hisọp.’ Grik kwuru naanị ‘n'elu/jiri hisọp,’ ya mere a ka na-arụrịta ụka banyere kpọmkwem otú e si jiri ya mee ihe.
    reason: lexical_alternative
lexical_decisions:
- source_word: σκεῦος
  choice: ihe e ji adọba mmiri
  rationale: Ọ bụ okwu sara mbara maka arịa ma ọ bụ ihe e ji etinye mmiri; nsụgharị a bụ asụsụ Igbo nkịtị ma ọ naghị ekpebi ụdị arịa ahụ.
- source_word: ἔκειτο
  choice: dị n'ebe ahụ
  rationale: Na-egosi ọnọdụ arịa ahụ n'ebe ahụ, n'ụzọ kwekọrọ n'ọrụ stative nke κεῖμαι.
- source_word: ὄξους
  choice: mmanya gbara ụka
  rationale: N'ọnọdụ a, ὄξος nwere ike ịbụ mmanya dị ọnụ ala gbara ụka nke ndị agha na-aṅụ; nke a doro anya karịa ịsị naanị mmanya-vinegar.
- source_word: μεστόν
  choice: jupụtara na
  rationale: Na-egosipụta izu oke nke arịa ahụ na nke ogbo ahụ, ma na-edobe nkwughachi dị na Grik.
- source_word: σπόγγον
  choice: ogbo
  rationale: Ọ bụ aha Igbo a na-ejikarị maka sponge.
- source_word: οὖν
  choice: ya mere
  rationale: Na-egosi ihe mere n'usoro n'ihi ọnọdụ a kọwara tupu ya.
- source_word: ὑσσώπῳ
  choice: n'elu osisi hisọp
  rationale: Na-edobe aha hisọp na ihe ọ pụrụ ịpụta n'akụkọ na n'okpukpe, ma na-eme ka ihe omume ahụ ghọta nke ọma; edeturu ala na-echekwa mgbagwoju anya nke dative ahụ.
- source_word: περιθέντες
  choice: tinyere
  rationale: Na-egosi omume nke iburu ụzọ tinye ogbo ahụ n'osisi tupu e bulie ya.
- source_word: προσήνεγκαν
  choice: buliekwa ya ruo
  rationale: N'ọnọdụ ahụ, okwu a pụtara iweta ma ọ bụ ibuli ihe nso n'ọnụ Jizọs; okwu a na-eme ka omume ahụ bụrụ Igbo eke n'etinyeghị nkọwa ọzọ.
- source_word: αὐτοῦ τῷ στόματι
  choice: n'ọnụ ya
  rationale: Ọ bụ ụzọ Igbo nkịtị isi gosipụta ebe ha wetara ogbo ahụ.
theological_decisions:
- issue: Ihe akụkọ ihe mere eme ma ọ bụ emume okpukpe nke ὑσσώπῳ pụrụ ịpụta
  choice: Idowe ‘hisọp’ n'ahịrịokwu n'enweghị ịkọwa ihe nnọchianya ya.
  alternative: Ịsụgharị ya n'ụzọ nkọwa dị ka ‘alaka hisọp,’ ma ọ bụ dochie ya naanị na ‘okporo osisi.’
  rationale: Okwu Jọn nwere ike ime ka onye na-agụ cheta Ememme Ngabiga ma ọ bụ emume nsacha, ma amaokwu ahụ ekwughị nke ahụ kpọmkwem. Idowe ‘hisọp’ na-echekwa ma okwu mbụ ma ihe ọ pụrụ ịpụta n'enweghị itinye nkọwa otu okpukpe.
translation_notes:
  register: Asụsụ Igbo Standard dị ugbu a, dị ùgwù ma dị mfe nghọta. E debere nkwughachi ‘jupụtara na’ na aha ‘hisọp,’ ma e zere ịkọwapụta ụdị arịa ahụ ma ọ bụ ihe nnọchianya hisọp n'ụzọ karịrị ihe Grik kwuru.
