  to: Otu arịa jupụtara na mmanya gbara ụka[a] dina n'ebe ahụ; ya mere, ha tinyere ogbo jupụtara na mmanya gbara ụka n'elu hisọp[b] ma wetara ya n'ọnụ ya.
  rationale: E degharịrị σκεῦος ka ọ bụrụ ‘arịa,’ a weghachiri echiche ọnọdụ nke ἔκειτο site na ‘dina n'ebe ahụ,’ ma dochie ‘buliekwa ya ruo’ na ‘wetara ya n’ọnụ ya.’ E debeghị ‘alaka’ ma ọ bụ nkọwa ihe nnọchianya banyere hisọp, ka mgbagwoju anya Grik dịgide. Edozikwara akara edeturu ala ka nke ọ bụla soro okwu ọ na-akọwa.
