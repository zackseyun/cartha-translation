    issue: Footnote [a] na-ekwu maka textual variant na-enweghị nkwado n’ọrụ e nyere, ma ọ bụghị footnote ambiguity nke English audit trail chọrọ.
    rationale: SBLGNT source e nyere na-agụ τῶν λόγων τούτων, ọ nweghịkwa apparatus ma ọ bụ evidence e nyere maka “okwu a.” Footnote ahụ kwesịrị kama idekọ nghọta ọzọ nke ἐκάθισεν.
  - severity: medium
    issue: Footnote [b] na-agwakọta ihe abụọ dị iche ma anchor ya anaghị anọ n’ebe ambiguity nke “nọdụ” dị.
    rationale: Nghọta “o mere ka ọ nọdụ” metụtara ἐκάθισεν, ya mere a ga-akara ya n’azụ “nọdụ.” Nkọwa Ἑβραϊστί metụtara “n’asụsụ Hibru,” ya mere ọ chọrọ footnote nke ya.
  - severity: low
    issue: “Okporo Nkume” adịghị akọwa Λιθόστρωτον n’ụzọ kacha kpọmkwem.
    rationale: Λιθόστρωτον bụ ebe/pavement e ji nkume tọọ, ọ bụghị kpọmkwem okporo ụzọ.
