review_pass:
  verdict: revise
  source_fidelity: 'Isi ederede na-esochi Grik nke ọma n’ozuzu ya: Paịlet nụrụ okwu ndị ahụ, kpọpụtara Jizọs, nọdụ n’oche ikpe, n’ebe a kpọrọ Λιθόστρωτον, nke aha Semitic ya bụ Gabbatha. Ma akara ala ala peeji ndị dị na draft agbanwere ebe ha kwesịrị ịdị: [a] dị n’azụ “okwu ndị a” ma footnote ya na-ekwu maka variant ederede na-adịghị na SBLGNT e nyere; [b] dị n’azụ “Hibru” ma footnote ya na-ejikọta ma nghọta ọzọ nke ἐκάθισεν ma nkọwa asụsụ. Nke a anaghị eso audit trail ma na-eme ka anchor nke ambiguity dị mkpa ghara ịdị n’ebe kwesịrị ekwesị.'
  naturalness: “Ọ kpọpụtara Jizọs n’èzí” na “oche ikpe” bụ Igbo Izugbe doro anya. “Okporo Nkume,” n’agbanyeghị na ọ na-aghọta ihe e bu n’obi, na-atụ aro ụzọ/road karịa pavement ma ọ bụ ebe e ji nkume tọọ. “Ebe Nkume A Tọrọ” na-anọchi Λιθόστρωτον n’ụzọ ziri ezi ma na-ada nke ọma dịka aha ebe.
  terminology: Aha ndị “Paịlet,” “Jizọs,” na “Gabbata” dị mma. E kwesịghị ịmepụta variant ederede n’ala ala peeji, n’ihi na SBLGNT e nyere nwere τῶν λόγων τούτων (“okwu ndị a”) n’enweghị variant e depụtara. A ghaghị itinye footnote banyere nghọta transitive/intransitive nke ἐκάθισεν n’akụkụ “nọdụ,” ebe footnote “n’asụsụ Hibru” kwesịrị ịdị naanị n’akụkụ Gabbata/Hibru.
  issues:
