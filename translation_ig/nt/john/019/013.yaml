id: JHN.19.13
reference: John 19:13
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ὁ οὖν Πιλᾶτος ἀκούσας ⸂τῶν λόγων τούτων⸃ ἤγαγεν ἔξω τὸν Ἰησοῦν, καὶ ἐκάθισεν ⸀ἐπὶ βήματος εἰς τόπον λεγόμενον Λιθόστρωτον, Ἑβραϊστὶ δὲ Γαββαθα.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/013.yaml
  text: So when Pilate heard these words[a], he brought Jesus outside and sat down on the judgment seat at a place called the Stone Pavement, and in Hebrew[b], Gabbatha.
translation:
  language: ig
  text: Ya mere, mgbe Paịlet nụrụ okwu ndị a, ọ kpọpụtara Jizọs n’èzí, wee nọdụ[a] n’oche ikpe n’ebe a na-akpọ Ebe Nkume A Tọrọ, nke n’asụsụ Hibru[b] a na-akpọ Gabbata.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “wee mee ka ọ nọdụ n’oche ikpe.” Ngwaa Grik ahụ nwere ike ịpụta na Paịlet mere ka Jizọs nọdụ, ọ bụ ezie na nghọta kachasị yie ka ọ bụ na Paịlet n’onwe ya nọdụrụ n’oche ikpe.
    reason: alternative_reading
  - marker: b
    text: “N’asụsụ Hibru” nwere ike izo aka n’asụsụ ndị Juu bi n’ógbè ahụ na-asụ, nke nwere ike ịbụ Aramaik, dịka n’ebe ndị ọzọ n’Akwụkwọ Jọn.
    reason: cultural_note
lexical_decisions:
- source_word: οὖν
  choice: Ya mere
  rationale: Na-egosi njikọ na ihe mere tupu ya na ihe si na ya pụta, n’ụzọ Igbo doro anya.
- source_word: ἀκούσας τῶν λόγων τούτων
  choice: mgbe Paịlet nụrụ okwu ndị a
  rationale: A tụgharịrị participle aorist ahụ dị ka nkebi oge; “okwu ndị a” na-ezo aka n’ihe e kwuru ozugbo tupu nke a.
- source_word: ἤγαγεν ἔξω τὸν Ἰησοῦν
  choice: ọ kpọpụtara Jizọs n’èzí
  rationale: “Kpọpụta ... n’èzí” na-egosi nke ọma na e mere ka Jizọs si n’ime pụta, na-etinyeghị nkọwa na-enweghị isi.
- source_word: ἐκάθισεν ἐπὶ βήματος
  choice: wee nọdụ n’oche ikpe
  rationale: N’ọnọdụ ikpe a, βῆμα bụ oche ma ọ bụ ebe onye ikpe na-anọ. Ọgụgụ kacha kwekọọ na usoro okwu ahụ bụ na Paịlet n’onwe ya nọdụrụ; e debere nghọta ọzọ n’ala ala peeji.
- source_word: εἰς τόπον λεγόμενον Λιθόστρωτον
  choice: n’ebe a na-akpọ Okporo Nkume
  rationale: N’agbanyeghị na εἰς na-egosikarị ngagharị gaa ebe, ebe a ọ na-akọwa ebe ikpeazụ a nọdụrụ. A sụgharịrị aha Grik ahụ dịka aha ebe pụtara pavement e ji nkume rụọ.
- source_word: Ἑβραϊστὶ δὲ Γαββαθα
  choice: nke a na-akpọkwa Gabbata n’asụsụ Hibru
  rationale: E chebere okwu ederede ahụ bụ “Hibru,” ebe a sụgharịrị δέ dịka njikọ dị nro. Gabbata bụ aha ebe, ya mere e dere ya dịka ụda ya siri dị.
theological_decisions:
- issue: Onye bụ isiokwu nke ἐκάθισεν
  choice: Paịlet nọdụrụ n’oche ikpe
  alternative: Paịlet mere ka Jizọs nọdụ n’oche ikpe
  rationale: Ụdị ngwaa Grik ahụ nwere ike ịbụ nke onye ahụ ji aka ya nọdụ ma ọ bụ nke o mere ka onye ọzọ nọdụ. Ọnọdụ ikpe na usoro ahịrịokwu ahụ na-akwado nke ọma na Paịlet nọdụrụ n’oche ikpe, ma nghọta ọzọ bụ ezi ihe nwere ike ịdị na Grik, ya mere e debere ya n’ala ala peeji.
translation_notes:
  register: E ji Igbo Izugbe dị ugbu a, dị ugwu ma dị mfe nghọta. A họọrọ “oche ikpe” kama okwu ọkachamara na-adịghị ama ama. Akara ala ala peeji niile dị na isi ederede, ma a chịkọtara mgbagwoju anya nke ngwaa na nkọwa asụsụ n’akara [b].
