  text: Ὅτε οὖν ἤκουσεν ὁ Πιλᾶτος τοῦτον τὸν λόγον, μᾶλλον ἐφοβήθη,
base_translation:
  language: en
  yaml_path: translation/nt/john/019/008.yaml
  text: When Pilate heard this statement, he became even more afraid,
translation:
  language: ig
  text: Mgbe Paịlet nụrụ okwu a, egwu tụrụ ya karịa,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὅτε
  choice: Mgbe
  rationale: Njikọ oge a na-egosi ọnọdụ nke mere ka egwu Paịlet mụbaa; “Mgbe” bụ ntụgharị Igbo doro anya ma bụrụkwa nke e ji ekwu okwu taa.
- source_word: οὖν
  choice: —
  rationale: Ọ bụ njikọ akụkọ dị nro ebe a; usoro ahịrịokwu Igbo na ihe ndị gbara ya gburugburu ebuola ọrụ ya, ya mere ịghara ịsụgharị ya kpọmkwem na-eme ka okwu ahụ daa nke ọma n’enweghị ihe ọ pụtara furu efu.
- source_word: ἤκουσεν
  choice: nụrụ
  rationale: N’ebe a, ngwaa ahụ pụtara ịnụ ma nata ihe e kwuru, ọ bụghị ilekwasị anya n’ige ntị.
- source_word: ὁ Πιλᾶτος
  choice: Paịlet
  rationale: E ji ụdị aha a a na-ejikarị eme ihe n’Igbo dochie aha Grik ahụ; edemede Grik adịghị mkpa n’ihu aha mmadụ n’Igbo.
- source_word: τοῦτον τὸν λόγον
  choice: okwu a
  rationale: λόγος na-ezo aka n’ihe e kwuru n’amaokwu bu ụzọ, ọ bụghị naanị otu mkpụrụokwu. “Okwu a” bụ ụzọ Igbo dị ndụ ma saa mbara nke na-ejigide ntụaka ahụ.
- source_word: μᾶλλον
  choice: karịa
  rationale: Ọ na-egosi na egwu Paịlet mụbara ma e jiri ya tụnyere otú ọ dị na mbụ.
- source_word: ἐφοβήθη
  choice: egwu tụkwara ya
  rationale: Akpaalaokwu Igbo a na-egosi mmeghachi omume nke egwu n’ụzọ ebumpụta ụwa; ya na “karịa” na-egosi na egwu ahụ mụbara.
theological_decisions:
- issue: Ụdị egwu Paịlet tụrụ
  choice: E kwuru naanị na egwu Paịlet mụbara, n’akọwaghị ihe kpọmkwem kpatara ya.
  alternative: Ịkọwa ya dị ka egwu ndọrọ ndọrọ ọchịchị ma ọ bụ egwu metụtara echiche na Jizọs nwere ọdịdị Chineke.
  rationale: Grik ahụ ekwughị ma egwu ahụ ọ bụ nke ndọrọ ndọrọ ọchịchị, nkwenkwe banyere chi, ma ọ bụ nke okpukpe. Nsụgharị ahụ na-ahapụ esemokwu akụkọ ahụ otú isi mmalite si hapụ ya.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị mfe nghọta ma nwee ugwu. “Egwu tụkwara ya karịa” bụ akpaalaokwu ebumpụta ụwa nke na-ejigide echiche mmụba dị na μᾶλλον ἐφοβήθη.
