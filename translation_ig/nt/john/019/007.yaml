revisions:
- from: Ndị Juu zara ya, sị, “Anyị nwere iwu, dịkwa ka iwu ahụ si kwuo, o kwesịrị ịnwụ, n’ihi na o mere onwe ya Ọkpara Chineke.”
  to: Ndị Juu zara ya, sị, “Anyị nwere iwu, ọ bụkwa dịka iwu ahụ si dị ka o kwesịrị ịnwụ, n’ihi na o mere onwe ya ka ọ bụrụ Ọkpara Chineke.”
  rationale: The revision retains the direct group designation, the repeated legal term and its referential second occurrence, the juridical force of “o kwesịrị ịnwụ,” and the established titular rendering “Ọkpara Chineke.” It replaces the overly specific “iwu ahụ si kwuo” with a natural expression for “according to that law” and supplies the necessary Igbo linker after “mere onwe ya.” No footnote is required, since the translation has no unresolved ambiguity requiring an explanatory note.
