  text: ἀπεκρίθησαν αὐτῷ οἱ Ἰουδαῖοι· Ἡμεῖς νόμον ἔχομεν, καὶ κατὰ τὸν ⸀νόμον ὀφείλει ἀποθανεῖν, ὅτι ⸂υἱὸν θεοῦ ἑαυτὸν⸃ ἐποίησεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/007.yaml
  text: The Jews answered him[a], “We have a law, and according to that law he ought to die[b], because he made himself the Son of God.”
translation:
  language: ig
  text: Ndị Juu zara ya, sị, “Anyị nwere iwu, ọ bụkwa dịka iwu ahụ si dị ka o kwesịrị ịnwụ, n’ihi na o mere onwe ya ka ọ bụrụ Ọkpara Chineke.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθησαν αὐτῷ
  choice: zara ya
  rationale: Nke a bụ ụzọ Igbo nkịtị na nke ziri ezi si egosipụta nzaghachi n’akụkọ.
- source_word: οἱ Ἰουδαῖοι
  choice: Ndị Juu
  rationale: Ọ bụ nsụgharị kpọmkwem nke aha ìgwè ahụ; amaokwu a n’onwe ya akọwaghị na ọ bụ naanị ndị ndú ndị Juu.
- source_word: νόμον ἔχομεν
  choice: Anyị nwere iwu
  rationale: Ọ na-edobe ịdịghị nkeji okwu n’ihu νόμον nke mbụ ma na-egosipụta ihe iwu ji dị ka ntọala ebubo ha.
- source_word: κατὰ τὸν νόμον
  choice: dịkwa ka iwu ahụ si kwuo
  rationale: “Iwu ahụ” na-ezoghachi n’iwu a kpọtụrụ aha ozugbo, ebe ahịrịokwu Igbo a na-egosipụta ụkpụrụ nke iwu ahụ n’ụzọ ebumpụta ụwa.
- source_word: ὀφείλει ἀποθανεῖν
  choice: o kwesịrị ịnwụ
  rationale: “Kwesịrị” na-egosipụta ọrụ ma ọ bụ ikpe iwu na-amanye n’emeghị ka ọ bụrụ mkpa zuru oke nke a na-apụghị izere ezere.
- source_word: υἱὸν θεοῦ
  choice: Ọkpara Chineke
  rationale: N’Igbo, “Ọkpara Chineke” na-enye echiche nke utu aha na mmekọrịta pụrụ iche nke ebubo ahụ na-ekwu, kama ime ka ọ bụrụ otu nwa n’etiti ọtụtụ ụmụ.
- source_word: ἑαυτὸν ἐποίησεν
  choice: o mere onwe ya
  rationale: Ọ na-edobe usoro okwu ndị na-ebo ya ebubo n’enweghị ịgbasa ya ka ọ bụrụ nkọwa dịka “o kwuru na ya bụ.”
theological_decisions:
- issue: Otu e si asụgharị υἱὸν θεοῦ n’ebubo ndị iro Jizọs
  choice: Ọkpara Chineke
  alternative: nwa Chineke
  rationale: “Ọkpara Chineke” na-echekwa ịdị pụrụ iche na ike utu aha ahụ nwere n’Oziọma Jọn, ma ka na-ahapụ ya dị ka okwu ndị na-ebo Jizọs ebubo, ọ bụghị nkọwa ozizi onye nsụgharị tinyere.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. A họọrọ “dịkwa ka iwu ahụ si kwuo” ka njikọ ahụ daa nke ọma n’Igbo, ma e chekwara ugboro abụọ e kwuru “iwu” na isi mmalite.
