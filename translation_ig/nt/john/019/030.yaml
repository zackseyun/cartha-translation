id: JHN.19.30
reference: John 19:30
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὅτε οὖν ἔλαβεν τὸ ὄξος ὁ Ἰησοῦς εἶπεν· Τετέλεσται, καὶ κλίνας τὴν κεφαλὴν παρέδωκεν τὸ πνεῦμα.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/030.yaml
  text: So when Jesus had received the sour wine[a], he said, “It is finished,” and bowing his head[c][b], he gave up his spirit.
translation:
  language: ig
  text: Ya mere, mgbe Jizọs natara mmanya ahụ gbara ụka[a], ọ sịrị, “Ọ gwụla[b].” O wee hulata isi ya, nyefee mmụọ ya[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “vinega ahụ.” Okwu Grik ὄξος pụtara mmanya gbara ụka.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsị, “E mezuru ya” ma ọ bụ “E mechala ya.”
    reason: lexical_alternative
  - marker: c
    text: A pụkwara ịsị, “o kupụrụ ume ikpeazụ ya.” Ma okwu Grik ahụ, ma a sụgharịa ya n'ụzọ dị nso, bụ “o nyefere mmụọ ya.”
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτε οὖν
  choice: Ya mere, mgbe
  rationale: “Ya mere” na-egosi njikọ na ihe ndị bu ụzọ mee, ebe “mgbe” na-echekwa njikọ oge dị n'okwu Grik.
- source_word: ἔλαβεν
  choice: natara
  rationale: N'ọnọdụ a, Jizọs natara mmanya e nyere ya n'ihe e tinyere n'ọnụ ya; “natara” na-egosi nke a nke ọma n'etinyeghị echiche karịrị ihe ederede kwuru.
- source_word: τὸ ὄξος
  choice: mmanya ahụ gbara ụka
  rationale: ὄξος bụ mmanya gbara ụka; okwu a doro ndị na-agụ Igbo nke oge a anya karịa ịkpọ ya naanị mmanya vinega.
- source_word: Τετέλεσται
  choice: Ọ gwụla
  rationale: Nkebiokwu a dị mkpụmkpụ ma sie ike dịka nke Grik, na-egosikwa na ihe ahụ eruola n'isi njedebe ya n'ekwughị kpọmkwem ihe e mechara.
- source_word: κλίνας τὴν κεφαλήν
  choice: hulata isi ya
  rationale: Nke a bụ ụzọ Igbo si ekwu n'ụzọ ebumpụta ụwa na ọ weturu ma ọ bụ hulata isi ya.
- source_word: παρέδωκεν τὸ πνεῦμα
  choice: nyefee mmụọ ya
  rationale: “Nyefee” na-echekwa echiche bụ isi nke παραδίδωμι, ebe “mmụọ ya” na-echekwa πνεῦμα kama ime ka okwu ahụ bụrụ naanị na ọ nwụrụ.
theological_decisions:
- issue: Ma a ga-asụgharị παρέδωκεν τὸ πνεῦμα dịka naanị akpaalaokwu pụtara ọnwụ, ka a ga-echekwa okwu banyere mmụọ ya.
  choice: nyefee mmụọ ya
  alternative: kubie ume ikpeazụ ya
  rationale: Nhọrọ a na-echekwa ịdị arọ na nkọwa kpọmkwem nke okwu Grik, tinyere echiche na Jizọs nyere onwe ya, ma ọ naghị etinye nkọwa ozizi ọzọ n'ime amaokwu ahụ.
- issue: Ma Τετέλεσται na-ekwu naanị na ihe akwụsịla, ka ọ na-egosikwa na e mezuru ihe.
  choice: Ọ gwụla
  alternative: E mezuru ya
  rationale: “Ọ gwụla” na-echekwa mkpụmkpụ na njedebe siri ike nke okwu ahụ, ebe ndetu ala na-egosi na Grik nwekwara ike ịpụta na e mezuru ma ọ bụ mechaa ihe ahụ.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. E debere ahịrịokwu ahụ n'ụdị dị mkpụmkpụ iji chekwaa ịdị arọ nke akụkọ ahụ, ma e zere okwu ụka pụrụ iche ma ọ bụ nkọwa ozizi na-adịghị kpọmkwem n'ederede Grik.
