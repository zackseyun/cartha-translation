reference: John 19:23
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οἱ οὖν στρατιῶται ὅτε ἐσταύρωσαν τὸν Ἰησοῦν ἔλαβον τὰ ἱμάτια αὐτοῦ καὶ ἐποίησαν τέσσαρα μέρη, ἑκάστῳ στρατιώτῃ μέρος, καὶ τὸν χιτῶνα. ἦν δὲ ὁ χιτὼν ἄραφος, ἐκ τῶν ἄνωθεν ὑφαντὸς δι’ ὅλου·
base_translation:
  language: en
  yaml_path: translation/nt/john/019/023.yaml
  text: So when the soldiers had crucified Jesus[a], they took his outer garments and made four parts, a part for each soldier, and also the tunic. Now the tunic was seamless[c][b], woven from the top throughout.
translation:
  language: ig
  text: Ya mere, mgbe ndị agha kpọgidere Jizọs n’obe, ha weere uwe elu ya[a] wee kee ha akụkụ anọ, onye agha ọ bụla nata otu akụkụ; ha weerekwa uwe ime ahụ. Uwe ime ahụ enweghị nkebi[c]; a kpara ya malite n’elu[b] ruo n’ala.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “uwe ya.” Okwu Grik ahụ nwere ike ịpụta uwe n’ozuzu, ma ebe a o yikarịrị ka ọ bụ uwe elu, ebe ọ bụ na e kwuru uwe ime ahụ iche.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “site n’elu.” N’ebe a, o yikarịrị ka ọ na-ekwu na a malitere ịkpa uwe ahụ n’elu ya.
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “a kpara ya n’otu mpempe ruo n’ogologo ya dum.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ οὖν στρατιῶται
  choice: Ya mere, ... ndị agha
  rationale: οὖν na-aga n’ihu n’akụkọ ahụ ma jikọta ihe a na ihe bu ya ụzọ; “Ya mere” na-eme nke a n’ụzọ Igbo doro anya n’enweghị ịgbakwunye nkwubi okwu siri ike.
- source_word: ὅτε ἐσταύρωσαν τὸν Ἰησοῦν
  choice: mgbe ndị agha kpọgidere Jizọs n’obe
  rationale: Aorist ya na ὅτε na-egosi ihe mere tupu ha ewere uwe ahụ; usoro Igbo a na-egosi usoro ihe ndị ahụ n’enweghị past perfect nke Bekee.
- source_word: ἔλαβον τὰ ἱμάτια αὐτοῦ
  choice: ha weere uwe elu ya
  rationale: ἱμάτια nwere ike ịpụta uwe n’ozuzu, ma ebe a o yikarịrị ka ọ bụ uwe elu, n’ihi na e kwuru χιτών iche.
- source_word: ἐποίησαν τέσσαρα μέρη, ἑκάστῳ στρατιώτῃ μέρος
  choice: kee ha ụzọ anọ, nke onye agha ọ bụla ga-enweta otu ụzọ
  rationale: Nke a na-enye echiche nke ikewa uwe ndị ahụ ụzọ anọ ma mee ka dative nke nkesa doo onye Igbo anya.
- source_word: καὶ τὸν χιτῶνα
  choice: ha werekwa uwe ime ahụ
  rationale: χίτων bụ uwe a na-eyi n’ime, n’akụkụ ahụ; “uwe ime” na-edobe ọdịiche ya na ἱμάτια n’enweghị iji okwu mba ọzọ.
- source_word: ἦν δὲ ὁ χιτὼν ἄραφος
  choice: Uwe ime ahụ enweghị ebe a dụkọtara ya
  rationale: δέ ebe a bụ mgbanwe dị nro n’akụkọ ahụ, nke mmalite ahịrịokwu ọhụrụ na-egosi nke ọma; ἄραφος pụtara na enweghị seam ma ọ bụ ebe a dụkọtara uwe ahụ.
- source_word: ἐκ τῶν ἄνωθεν
  choice: malite n’elu
  rationale: N’ihe gbasara ịkpa uwe a, ἄνωθεν kacha yie ‘site n’elu’; e debere ihe ọzọ ‘site n’eluigwe’ ma ọ bụ ‘site n’ebe dị n’elu’ na ndetu.
- source_word: ὑφαντὸς δι’ ὅλου
  choice: a kpara ya ... ruo na njedebe ya
  rationale: ὑφαντός bụ ihe a kpara akpa, δι’ ὅλου na-egosikwa na ịkpa ahụ gara n’uwe ahụ dum; Igbo a bụ nke eke ma na-edobe echiche nke ihe a kpara n’otu n’otu ruo n’isi ya.
theological_decisions:
- issue: Ịgụ uwe na-enweghị seam ahụ dị ka ihe nnọchianya
  choice: Kọwaa naanị otú e si rụọ uwe ahụ na ihe ndị agha mere.
  alternative: Ịkpọ ya ihe nnọchianya uwe ndị nchụàjà ma ọ bụ ịdị n’otu nke nzukọ Kraịst.
  rationale: Amaokwu ahụ n’onwe ya anaghị akọwa ihe nnọchianya ọ bụla; itinye ya na nsụgharị ga-ebubata nkọwa okwukwe nke ederede ekwughị.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji “uwe elu” na “uwe ime” mee ka ọdịiche dị n’etiti ἱμάτια na χιτών pụta ìhè. E zere ịgbakwunye nkọwa ihe nnọchianya ma ọ bụ ozizi otu chọọchị.
