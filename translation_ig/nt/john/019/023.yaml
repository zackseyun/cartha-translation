review_pass:
  verdict: revise
  source_fidelity: The draft correctly distinguishes the outer garments (ἱμάτια) from the tunic (χιτών), and it accurately conveys that the tunic was woven from the top to its full length. However, “ụzọ anọ” means ‘four ways/methods’ rather than four portions, and “ga-enweta” introduces an unwarranted future sense. The phrase for ‘seamless’ and footnote c also need correction.
  naturalness: 'The revised wording uses idiomatic Standard Igbo: “akụkụ anọ” for portions, “onye agha ọ bụla nata otu akụkụ” for the distributive phrase, and “enweghị nkebi” for a seamless garment. “Ruo n’ala” naturally expresses the garment’s extent from top to bottom in this context.'
  terminology: “Uwe elu” and “uwe ime” appropriately preserve the contextual distinction between the garments and the tunic. “Kpọgidere Jizọs n’obe” is an established, dignified rendering of crucifixion. No symbolic interpretation is added.
  issues:
  - severity: medium
    issue: “kee ha ụzọ anọ ... otu ụzọ”
    rationale: “Ụzọ” ordinarily means ‘way, route, or method,’ not a share or portion. It obscures τέσσαρα μέρη / μέρος. “Akụkụ anọ ... otu akụkụ” accurately conveys the division into four portions.
  - severity: medium
    issue: “ga-enweta” in the distributive clause
    rationale: The Greek states the resulting distribution elliptically (‘a share for each soldier’); it does not introduce a future action. A past distributive formulation better fits the narrative.
  - severity: medium
    issue: The wording for ‘seamless’ and footnote c
    rationale: “Enweghị ebe a dụkọtara ya” is less direct, while the existing footnote phrase “otu n’otu” means ‘one by one’ and does not mean ‘in one piece.’ “Enweghị nkebi” and a corrected footnote express the garment’s lack of seams and its continuous weaving.
  revised_text: Ya mere, mgbe ndị agha kpọgidere Jizọs n’obe, ha weere uwe elu ya[a] wee kee ha akụkụ anọ, onye agha ọ bụla nata otu akụkụ; ha weerekwa uwe ime ahụ. Uwe ime ahụ enweghị nkebi[c]; a kpara ya malite n’elu[b] ruo n’ala.
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “uwe ya.” Okwu Grik ahụ nwere ike ịpụta uwe n’ozuzu, ma ebe a o yikarịrị ka ọ bụ uwe elu, ebe ọ bụ na e kwuru uwe ime ahụ iche.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “site n’elu.” N’ebe a, o yikarịrị ka ọ na-ekwu na a malitere ịkpa uwe ahụ n’elu ya.
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “a kpara ya n’otu mpempe ruo n’ogologo ya dum.”
    reason: lexical_alternative
  revision_rationale: The revision corrects the rendering of the four portions and the distributive allocation, removes an unsupported future nuance, and supplies clearer Standard Igbo for a seamless tunic. It retains the source’s descriptive wording and ambiguity without importing theological symbolism.
