revisions:
- from: Ya mere, mgbe ndị agha kpọgidere Jizọs n’obe, ha weere uwe elu ya[a] kee ha ụzọ anọ, nke onye agha ọ bụla ga-enweta otu ụzọ; ha werekwa uwe ime ahụ. Uwe ime ahụ enweghị ebe a dụkọtara ya[c]; a kpara ya malite n’elu[b] ruo na njedebe ya.
  to: Ya mere, mgbe ndị agha kpọgidere Jizọs n’obe, ha weere uwe elu ya[a] wee kee ha akụkụ anọ, onye agha ọ bụla nata otu akụkụ; ha weerekwa uwe ime ahụ. Uwe ime ahụ enweghị nkebi[c]; a kpara ya malite n’elu[b] ruo n’ala.
  rationale: The revision corrects the rendering of the four portions and the distributive allocation, removes an unsupported future nuance, and supplies clearer Standard Igbo for a seamless tunic. It retains the source’s descriptive wording and ambiguity without importing theological symbolism.
  reviewer_model: gpt-5.6-terra
