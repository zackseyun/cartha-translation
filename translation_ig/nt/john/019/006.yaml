id: JHN.19.6
reference: John 19:6
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὅτε οὖν εἶδον αὐτὸν οἱ ἀρχιερεῖς καὶ οἱ ὑπηρέται ἐκραύγασαν λέγοντες· Σταύρωσον ⸀σταύρωσον. λέγει αὐτοῖς ὁ Πιλᾶτος· Λάβετε αὐτὸν ὑμεῖς καὶ σταυρώσατε, ἐγὼ γὰρ οὐχ εὑρίσκω ἐν αὐτῷ αἰτίαν.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/006.yaml
  text: So when the chief priests and the officers saw him[a], they cried out, saying, “Crucify him! Crucify him!” Pilate said to them, “You take him and crucify him[b], for I find no charge against him.”
translation:
  language: ig
  text: Ya mere, mgbe ndị isi nchụàjà na ndị nche hụrụ ya, ha tiri mkpu sị, “Kpọgide ya n’obe! Kpọgide ya n’obe!” Paịlet gwara ha, “Unu onwe unu, werenụ ya ma kpọgide ya n’obe[a], n’ihi na ahụghị m ebubo ọ bụla megide ya[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “Unu onwe unu, werenụ ya kpọgide n’obe.” Okwu Grik kpọmkwem tinyere “unu,” ya mere ọ na-ekwusi ike na ọ bụ ha ga-eme ya.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụ ya, “ahụghị m mmejọ ọ bụla n’ime ya.” Okwu Grik nwere ike ịpụta ebubo iwu ma ọ bụ ihe ndabere e ji ebo mmadụ ebubo; n’ebe a, nghọta metụtara ikpe bụ nke kacha pụta ìhè.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε οὖν
  choice: Ya mere, mgbe
  rationale: Ọ na-egosipụta ma njikọ nke ihe na-esochi ihe bu ya ụzọ ma oge ihe ahụ mere, n’ụzọ Igbo dị mfe nghọta.
- source_word: ἀρχιερεῖς
  choice: ndị isi nchụàjà
  rationale: Ọ bụ aha ndị ndu nchụàjà nọ na Jeruselem, ọ bụghị naanị otu nnukwu onye nchụàjà.
- source_word: ὑπηρέται
  choice: ndị nche
  rationale: N’ọnọdụ a, okwu ahụ na-ezo aka n’ụmụọrụ ndị ọchịchị ndị Juu na-eji eme iwu; ‘ndị nche’ bụ okwu Igbo dị nkenke ma doo anya n’akụkọ a.
- source_word: ἐκραύγασαν λέγοντες
  choice: ha tiri mkpu sị
  rationale: Nke a na-egosipụta mkpu siri ike ma na-ewebata kpọmkwem ihe ha kwuru n’Igbo ebumpụta ụwa.
- source_word: Σταύρωσον σταύρωσον
  choice: Kpọgide ya n’obe! Kpọgide ya n’obe!
  rationale: A hapụrụ nkwugharị ahụ iji chekwaa ike na ngwa ngwa nke mkpu ha; ‘ya’ doro anya site n’ihe gbara ya gburugburu.
- source_word: Λάβετε αὐτὸν ὑμεῖς
  choice: Unu onwe unu kpọrọ ya
  rationale: ‘Unu onwe unu’ na-echekwa nkwusi ike dị n’aha nnọchiaha Grik ὑμεῖς, na-egosikwa ọdịiche dị n’etiti ha na Paịlet.
- source_word: σταυρώσατε
  choice: kpọgide ya n’obe
  rationale: Nke a bụ okwu Igbo doro anya maka igbu mmadụ site n’ịkpọgide ya n’obe.
- source_word: αἰτίαν
  choice: ebubo ọ bụla
  rationale: N’ọnọdụ ikpe a, αἰτία na-egosi ebubo iwu ma ọ bụ ihe ndabere e ji ebo mmadụ ebubo; ‘ebubo’ na-echekwa nghọta ikpe ahụ.
theological_decisions:
- issue: Nkwupụta Paịlet banyere enweghị ikpe Jizọs
  choice: ahụghị m ebubo ọ bụla megide ya
  alternative: ahụghị m mmejọ ọ bụla n’ime ya
  rationale: Nhọrọ bụ isi na-egosipụta na Paịlet na-ekwu okwu dịka onye ikpe banyere ebubo iwu, n’enweghị itinye nkọwa ozizi sara mbara karịa ihe amaokwu ahụ kwuru.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta, dee amaokwu ahụ. A chekwara nkwugharị mkpu ahụ, nkwusi ike dị na ‘unu onwe unu,’ na ụda okwu ikpe Paịlet. E doziri akara ndetu ala peeji ka [a] soro okwu banyere ‘unu onwe unu,’ ebe [b] soro okwu αἰτία banyere ebubo.
