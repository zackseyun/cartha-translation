  to: Ya mere, mgbe ndị isi nchụàjà na ndị nche hụrụ ya, ha tiri mkpu sị, “Kpọgide ya n’obe! Kpọgide ya n’obe!” Paịlet gwara ha, “Unu onwe unu, werenụ ya ma kpọgide ya n’obe[a], n’ihi na ahụghị m ebubo ọ bụla megide ya[b].”
