revisions:
- from: Ya mere, ndị agha ahụ bịara, gbajie ụkwụ nwoke nke mbụ, gbajiekwa nke nwoke nke ọzọ ahụ a kpọgidere ya na Jizọs n’obe.
  to: Ya mere, ndị agha ahụ bịara gbajie ụkwụ nwoke nke mbụ na ụkwụ nwoke nke ọzọ, onye a kpọgidere n’obe ya na Jizọs.
  rationale: 'The revision supplies the repeated object “ụkwụ” for the second man, resolving the unclear Igbo ellipsis while retaining the Greek sense: the soldiers broke the legs of the first and of the other crucified with Jesus. No footnote is needed because the rendering is clear and no material textual or lexical ambiguity requires annotation here.'
  reviewer_model: gpt-5.6-terra
