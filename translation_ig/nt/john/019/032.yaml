source:
  edition: SBLGNT
  text: ἦλθον οὖν οἱ στρατιῶται, καὶ τοῦ μὲν πρώτου κατέαξαν τὰ σκέλη καὶ τοῦ ἄλλου τοῦ συσταυρωθέντος αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/john/019/032.yaml
  text: So the soldiers came and broke the legs of the first man[b][a], and of the other who had been crucified with him.
translation:
  language: ig
  text: Ya mere, ndị agha ahụ bịara gbajie ụkwụ nwoke nke mbụ na ụkwụ nwoke nke ọzọ, onye a kpọgidere n’obe ya na Jizọs.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὖν
  choice: Ya mere
  rationale: Na-egosi ihe si n’ihe e kwuru n’amaokwu bu ụzọ pụta ma na-aga n’ihu n’akụkọ ahụ.
- source_word: οἱ στρατιῶται
  choice: ndị agha ahụ
  rationale: Okwu doro anya maka ndị agha Rom nọ n’ọnọdụ a; ‘ahụ’ na-ezo aka n’otu ndị agha a kpọtụrụ aha n’amaokwu bu ụzọ.
- source_word: τοῦ μὲν πρώτου
  choice: nwoke nke mbụ
  rationale: Grik kwuru naanị ‘nke mbụ,’ ma Igbo chọrọ ka e tinye ‘nwoke’ iji mee ka onye a na-ekwu maka ya doo anya.
- source_word: κατέαξαν τὰ σκέλη
  choice: gbajie ụkwụ
  rationale: Na-enye kpọmkwem omume nke ịgbaji ụkwụ; n’Igbo, ‘ụkwụ’ nwere ike igosi akụkụ abụọ ahụ dịka ọnọdụ si kọwaa.
- source_word: τοῦ ἄλλου
  choice: nke nwoke nke ọzọ ahụ
  rationale: Na-ezo aka n’ime nwoke abụọ ahụ ọzọ a kpọgidere n’obe n’akụkụ Jizọs.
- source_word: τοῦ συσταυρωθέντος αὐτῷ
  choice: ahụ a kpọgidere ya na Jizọs n’obe
  rationale: Na-akọwa nwoke nke ọzọ dịka onye a kpọgidere n’obe ya na Jizọs; ịkpọ Jizọs aha na-ewepụ mgbagwoju anya nke nnọchiaha n’Igbo.
theological_decisions:
- issue: Onye αὐτῷ na-ezo aka na ya
  choice: Jizọs
  alternative: nwoke nke mbụ
  rationale: N’ọnọdụ akụkọ Jọn, a na-akọwa ndị ikom abụọ ahụ site n’otú ha si dị n’akụkụ Jizọs mgbe a kpọgidere ha n’obe; ya mere, ọ kacha kwekọọ na αὐτῷ na-ezo aka na Jizọs.
translation_notes:
  register: Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E jiri usoro ahịrịokwu eke mee ka ellipsis Grik pụta nke ọma n’Igbo, na-enweghị ịgbakwunye nkọwa ozizi.
