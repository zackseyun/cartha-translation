  yaml_path: translation/nt/john/019/037.yaml
  text: And again another Scripture says[a], “They will look on the one whom they pierced.”
translation:
  language: ig
  text: Ọzọkwa, Akwụkwọ Nsọ ọzọ na-ekwu, “Ha ga-ele onye ahụ ha mapuru anya.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịtụgharị ya, “Ha ga-elekwasị onye ahụ ha mapuru anya.” Usoro okwu Grik a nwere ike igosi ile mmadụ anya ma ọ bụ ilekwasị ya anya; okwu a na-echetakwa Zekaraya 12:10.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν
  choice: Ọzọkwa
  rationale: Ọ na-egosi na e tinyere amaokwu Akwụkwọ Nsọ ọzọ na nke e kwuburu.
- source_word: ἑτέρα γραφή
  choice: Akwụkwọ Nsọ ọzọ
  rationale: γραφή ebe a bụ akụkụ Akwụkwọ Nsọ e dere ede, ebe ἑτέρα na-egosi ihe akaebe ọzọ sitere n’Akwụkwọ Nsọ.
- source_word: λέγει
  choice: na-ekwu
  rationale: Oge ugbu a na-edobe usoro Grik si ewebata okwu Akwụkwọ Nsọ dị ka ihe ka na-ekwu okwu.
- source_word: Ὄψονται
  choice: Ha ga-ele ... anya
  rationale: Nke a na-egosi ile mmadụ anya kpọmkwem, ọ bụghị naanị ịhụ ya na mberede.
- source_word: εἰς ὃν
  choice: onye ahụ ... anya
  rationale: Usoro Igbo ‘ile mmadụ anya’ na-egosi na anya ha ga-eche ihu n’ebe onye ahụ nọ; nkọwa ọzọ nwere ike ịbụ ilekwasị ya anya.
- source_word: ἐξεκέντησαν
  choice: ha mara ube
  rationale: Ọ na-egosi ịkpọpu mmadụ site n’ihe dị nkọ; n’ọnọdụ mkpọgide n’obe a, ‘ịma ube’ bụ okwu doro anya ma dịkwa eke n’Igbo.
theological_decisions:
- issue: Idobe ike okwu Kraịst dị n’ntụaka Zekaraya n’etinyeghị okwu ọzọ sitere n’asụsụ Hibru ma ọ bụ LXX
  choice: Ha ga-ele onye ahụ ha mara ube anya.
  alternative: Ha ga-elekwasị onye ahụ ha mara ube anya.
  rationale: Nsụgharị ahụ na-agbaso okwu Jọn n’onwe ya ma hapụ onye a mara ube ka ọnọdụ amaokwu ahụ kọwaa na ọ bụ Jizọs; ọ naghị ebubata okwu onye mbụ nke Zekaraya 12:10.
translation_notes:
  register: Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta. ‘Akwụkwọ Nsọ ọzọ na-ekwu’ na-edobe usoro e si ewebata amaokwu; ‘mara ube’ dabara n’ọnọdụ Jọn 19 ma na-ezere okwu siri ike ma ọ bụ nke otu ụka pụrụ iche.
