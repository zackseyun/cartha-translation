    text: Otu litra bụ paụnd Rom, ihe dị ka gram 327; otu narị litra dị ihe dị ka kilogram 32–33 (ihe dị ka paụnd 72).
    reason: cultural_note
  revision_rationale: The revision preserves the Greek’s appositional identification of Nicodemus and its earlier-visit nuance without implying a specific “first night.” It also standardizes the personal name and uses a conventional Igbo term for myrrh. The quantity remains explicitly approximate, as marked by ὡς.
