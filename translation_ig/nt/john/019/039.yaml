revisions:
- from: Nikọdimọs bịakwara—onye ahụ nke bịakwutere Jizọs n'abalị na mbụ[a]—wee weta ngwakọta myrrh na aloes, nke ịdị arọ ya dị ihe dị ka otu narị litra.[b]
  to: Nikọdimọs bịakwara—onye bịakwutere ya n'abalị n'oge gara aga[a]—wee weta ngwakọta mọọ na aloes, nke ịdị arọ ya dị ihe dị ka otu narị litra.[b]
  rationale: The revision preserves the Greek’s appositional identification of Nicodemus and its earlier-visit nuance without implying a specific “first night.” It also standardizes the personal name and uses a conventional Igbo term for myrrh. The quantity remains explicitly approximate, as marked by ὡς.
  reviewer_model: gpt-5.6-terra
