  text: ἦλθεν δὲ καὶ Νικόδημος, ὁ ἐλθὼν πρὸς ⸀αὐτὸν νυκτὸς τὸ πρῶτον, φέρων ⸀μίγμα σμύρνης καὶ ἀλόης ὡς λίτρας ἑκατόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/039.yaml
  text: Nicodemus also came—the one who had first come to him at night—bringing a mixture of myrrh and aloes[b][a], about a hundred litras.
translation:
  language: ig
  text: Nikọdimọs bịakwara—onye bịakwutere ya n'abalị n'oge gara aga[a]—wee weta ngwakọta mọọ na aloes, nke ịdị arọ ya dị ihe dị ka otu narị litra.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “onye bu ụzọ bịakwute ya n'abalị.” Nke a na-echetara Jọn 3:1–2.
    reason: cross_reference
  - marker: b
    text: Otu litra bụ paụnd Rom, ihe dị ka gram 327; otu narị litra dị ihe dị ka kilogram 32–33 (ihe dị ka paụnd 72).
    reason: cultural_note
lexical_decisions:
- source_word: ἦλθεν δὲ καὶ Νικόδημος
  choice: Nikọdimọs bịakwara
  rationale: “Bịakwara” na-egosipụta ike mgbakwunye nke καί ma na-ahapụ δέ ka ọ bụrụ njikọ akụkọ dị nro, n'Igbo dị mfe ma bụrụkwa ihe e ji ekwu okwu ugbu a.
- source_word: ὁ ἐλθὼν πρὸς αὐτὸν νυκτὸς τὸ πρῶτον
  choice: onye ahụ nke bịakwutere Jizọs n'abalị na mbụ
  rationale: Nkebi a na-akọwapụta onye Nịkọdimọs bụ ma na-echetara onye na-agụ ya ọbịbịa ya na Jọn 3:1–2. A kpọrọ αὐτόν “Jizọs” iji mee ka ntụaka ahụ doo anya n'Igbo, ebe “na mbụ” na-echekwa echiche nke τὸ πρῶτον.
- source_word: φέρων
  choice: wee weta
  rationale: Participu a na-akọ ihe so ọbịbịa ya mee; “wee weta” bụ ụzọ Igbo ebumpụta ụwa si jikọta omume ahụ na ọbịbịa ya.
- source_word: μίγμα σμύρνης καὶ ἀλόης
  choice: ngwakọta myrrh na aloes
  rationale: “Ngwakọta” na-asụgharị μίγμα nke ọma. E debere aha ihe ndị na-esi ísì ụtọ ahụ n'ụdị transliteration n'ihi na ha abụghị osisi aloe a na-ahụkarị n'ụlọ, kama ha bụ ihe na-esi ísì ụtọ e ji akwadebe ozu.
- source_word: ὡς λίτρας ἑκατόν
  choice: nke ịdị arọ ya dị ihe dị ka otu narị litra
  rationale: ὡς na-egosi na ọnụ ọgụgụ ahụ abụghị kpọmkwem. Ịgbakwunye “nke ịdị arọ ya” na-eme ka o doo onye Igbo na-agụ anya na litra bụ ihe atụ ịdị arọ, ma na-edobe aha nkeji oge Rom ahụ.
theological_decisions:
- issue: Onye αὐτόν na nkebi na-akọwapụta Nịkọdimọs na-ezo aka na ya
  choice: Jizọs
  alternative: ya
  rationale: Akụkọ Jọn na-echetara Jọn 3:1–2 n'ụzọ doro anya. Iji “Jizọs” kama nnọchiaha “ya” na-egbochi mgbagwoju anya n'Igbo, n'agbanyeghị na Grik ji nnọchiaha.
translation_notes:
  register: Asụsụ ahụ bụ Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E ji akara ogologo ahịrị kewaa nkebi nkọwa ahụ, tinyekwa nkọwa ụkwụ ozugbo n'ebe okwu ọ bụla metụtara ya dị. A hapụrụ “litra” dịka nkeji oge ochie ma kọwaa ya na nkọwa ụkwụ.
