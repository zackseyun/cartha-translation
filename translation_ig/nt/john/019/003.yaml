  text: καὶ ⸂ἤρχοντο πρὸς αὐτὸν καὶ⸃ ἔλεγον· Χαῖρε, ὁ βασιλεὺς τῶν Ἰουδαίων· καὶ ἐδίδοσαν αὐτῷ ῥαπίσματα.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/003.yaml
  text: And they came up to him and said[a], “Hail[b], King of the Jews!” And they were slapping him.
translation:
  language: ig
  text: Ha nọ na-abịakwute ya na-ekwu[a], sị, “Ekele, Eze ndị Juu!” Ha na-akụkwa ya ụra[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “Ha nọgidere na-abịakwute ya na-ekwu.” Ụdị ngwaa Grik na-egosi na ha nwere ike ime nke a ugboro ugboro.
    reason: lexical_alternative
  - marker: b
    text: N’asụsụ Grik, okwu a bụ n’ụzọ nkịtị, “ha na-enye ya otiti”; ihe ọ pụtara ebe a bụ na ha na-ama ya ụra ma ọ bụ na-eji aka akụ ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤρχοντο πρὸς αὐτὸν καὶ ἔλεγον
  choice: Ha na-abịakwute ya na-asị
  rationale: Ụdị ngwaa ndị Grik a na-egosi ihe na-aga n’ihu ma ọ bụ nke a na-eme ugboro ugboro. “Na-abịakwute ... na-asị” bụ Igbo nkịtị nke na-egosi na ha nọgidere na-abịakwute ya na-akwa ya emo.
- source_word: Χαῖρε
  choice: Ekele dịrị gị
  rationale: N’ebe a, ọ bụ ekele a na-enye eze, ma ndị agha ji ya eme ihe ịkwa emo. “Ekele dịrị gị” na-edobe ọdịdị ekele ahụ n’enweghị ịtụgharị ya ka ọ bụrụ ekele sitere n’obi.
- source_word: ὁ βασιλεὺς τῶν Ἰουδαίων
  choice: Eze ndị Juu
  rationale: Nke a na-atụgharị aha ahụ ozugbo ma na-edobe mkpa ndọrọ ndọrọ ọchịchị na nke Mesaya dị n’akụkọ ahụ.
- source_word: ἐδίδοσαν αὐτῷ ῥαπίσματα
  choice: Ha na-akụkwa ya ụra
  rationale: ῥαπίσματα pụtara iti mmadụ ụra ma ọ bụ ịkụ ya aka. Okwu Igbo a bụ nke doro anya ma dịkwa n’usoro asụsụ, ebe “na-akụkwa” na-egosi na omume ahụ gara n’ihu ma ọ bụ mere ugboro ugboro.
theological_decisions:
- issue: Ụda ekele ndị agha nyere Jizọs
  choice: E debere ya dị ka ekele eze nke e ji akwa emo, n’etinyeghị okwu nkọwa dịka “n’ịkwa emo” n’ahịrịokwu ahụ.
  alternative: Ịsị “Ndeewo, Eze ndị Juu,” nke nwere ike ịdị ka ekele nkịtị.
  rationale: Ọnọdụ akụkọ ahụ na-egosi ịkwa emo nke ọma. “Ekele dịrị gị” na-echekwa ọdịdị nsọpụrụ eze ha mere ka à ga-asị na ọ bụ eziokwu, ma na-ahapụ onye na-agụ ya ka ọ ghọta mkparị ahụ site n’ọnọdụ akụkọ ahụ.
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, nke dị ugwu ma dị mfe nghọta. “Ekele dịrị gị” na-enye ụda ekele eze, ebe usoro “na-abịakwute ... na-asị” na “na-akụkwa” na-echekwa omume na-aga n’ihu ma ọ bụ nke a na-eme ugboro ugboro dị na ngwaa Grik.
