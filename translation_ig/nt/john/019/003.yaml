  naturalness: “Ha na-abịakwute ya na-asị” is understandable, but “Ha nọ na-abịakwute ya na-ekwu, sị” more naturally represents the ongoing, repeated actions in contemporary Standard Igbo. “Ekele, Eze ndị Juu!” is a natural direct address.
  terminology: “Eze ndị Juu” is correct and should be retained. “Ịkụ mmadụ ụra” is an established, clear rendering for slapping and fits ῥαπίσματα without adding an unwarranted instrument or degree of violence.
