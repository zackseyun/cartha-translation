source:
  edition: SBLGNT
  text: ἐγένετο γὰρ ταῦτα ἵνα ἡ γραφὴ πληρωθῇ· Ὀστοῦν οὐ συντριβήσεται ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/036.yaml
  text: 'For these things happened so that the Scripture might be fulfilled: “Not one of his bones will be broken.”[a]'
translation:
  language: ig
  text: 'N’ihi na ihe ndị a mere ka okwu Akwụkwọ Nsọ wee mezuo: “Ọ dịghị otu ọkpụkpụ ya a ga-agbaji.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'N’asụsụ Grik: “A gaghị agbaji ọkpụkpụ ya.” Okwu Grik a sụgharịrị “ọkpụkpụ” dị n’otu ọgụgụ; n’ebe a, a sụgharịrị ya n’ụzọ dabara n’usoro Igbo dịka “Ọ dịghị otu ọkpụkpụ ya a ga-agbaji.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: mere
  rationale: Okwu a na-akọ na ihe ndị a kpọtụrụ aha n’amaokwu ndị bu ụzọ mere; “mere” bụ okwu Igbo dị mfe ma bụrụkwa nke dabara n’ọnọdụ a.
- source_word: γὰρ
  choice: N’ihi na
  rationale: Ọ na-ejikọta amaokwu a na ihe e kwuru na mbụ site n’inye nkọwa kpatara ya.
- source_word: ταῦτα
  choice: ihe ndị a
  rationale: Ọ na-ezo aka n’ihe ndị mere nke a kọwara n’amaokwu ndị bu ụzọ ma na-edobe ụdị ọtụtụ nke okwu Grik.
- source_word: ἵνα
  choice: ka ... wee
  rationale: Usoro a bụ ụzọ Igbo sitere n’okike e si egosi nzube ma ọ bụ ihe si n’omume pụta, na-ahapụghị esemokwu dị n’etiti echiche abụọ ahụ.
- source_word: ἡ γραφή
  choice: okwu Akwụkwọ Nsọ
  rationale: N’ebe a γραφή pụtara Akwụkwọ Nsọ; itinye “okwu” na-eme ka ahịrịokwu “wee mezuo” bụrụ Igbo sitere n’okike n’enweghị ịgbanwe echiche ya.
- source_word: πληρωθῇ
  choice: wee mezuo
  rationale: Nke a na-egosi mmezu nke okwu Akwụkwọ Nsọ n’ụzọ doro anya ma na-edobe njikọ ya na ἵνα.
- source_word: Ὀστοῦν
  choice: otu ọkpụkpụ
  rationale: Okwu Grik dị n’otu, ma n’ebe a ọ na-arụ ọrụ mkpokọta; “otu ọkpụkpụ” na-eme ka mmachibido ahụ doo anya n’Igbo.
- source_word: οὐ συντριβήσεται
  choice: a ga-agbaji
  rationale: N’ihi “Ọ dịghị” dị n’isi nkebi ahụ, “a ga-agbaji” na-enye echiche zuru ezu nke na ọ dịghị ọkpụkpụ a ga-agbaji; “gbajie” dabara kpọmkwem n’ihe a na-eme ọkpụkpụ n’ọnọdụ a.
- source_word: αὐτοῦ
  choice: ya
  rationale: “Ya” bụ ụzọ Igbo sitere n’okike e si gosipụta nnọchiaha nwe ihe nke Grik.
theological_decisions:
- issue: Ịsụgharị ọkpụkpụ dị n’otu n’okwu e hotara n’Akwụkwọ Nsọ, ma chekwaa njikọ ya na Ọpụpụ 12:46, Ọnụọgụgụ 9:12, na Abụ Ọma 34:20
  choice: Ọ dịghị otu ọkpụkpụ ya a ga-agbaji
  alternative: A gaghị agbaji ọkpụkpụ ya
  rationale: Nhọrọ a na-edobe okwu “ọkpụkpụ” n’otu ma na-egosipụta n’Igbo sitere n’okike na ọ dịghị nke ọ bụla n’ọkpụkpụ ya a ga-agbaji. Ọ naghị ekpebi otu n’ime ebe atọ ahụ dị n’Agba Ochie dị ka naanị ebe Jọn bu n’obi.
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe nke oge a, dị ugwu ma dịkwa mfe nghọta. “Okwu Akwụkwọ Nsọ” na-ezere ahịrịokwu na-adịghị sitere n’okike nke ga-asị na akwụkwọ ahụ n’onwe ya mezuru, ebe ọ ka na-edobe ihe γραφή pụtara n’ebe a.
