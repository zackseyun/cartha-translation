id: JHN.19.35
reference: John 19:35
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ὁ ἑωρακὼς μεμαρτύρηκεν, καὶ ἀληθινὴ ⸂αὐτοῦ ἐστιν⸃ ἡ μαρτυρία, καὶ ἐκεῖνος οἶδεν ὅτι ἀληθῆ λέγει, ἵνα ⸀καὶ ὑμεῖς ⸀πιστεύητε.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/035.yaml
  text: And the one who has seen has testified[a], and his testimony is true, and that one knows that he is telling the truth, so that you also may believe.
translation:
  language: ig
  text: Onye ahụ hụrụla agbaala akaebe, akaebe ya bụkwa eziokwu. Onye ahụ makwa na ihe ọ na-ekwu bụ eziokwu, ka unu kwa wee kwere.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ka unu kwa nọgide na-ekwere.” Ụdị ngwaa Grik a nwere ike igosi omume na-aga n’ihu.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ ἑωρακὼς
  choice: onye ahụ hụworo ya
  rationale: Ụdị ngwaa perfect participle na-egosi onye hụrụ ihe ahụ, ebe ihe ọ hụrụ ka dị mkpa ugbu a. “Hụworo” na-echekwa echiche a, “onye ahụ” na-echekwakwa ụdị okwu nke na-akọwaghị onye ahụ kpọmkwem.
- source_word: μεμαρτύρηκεν
  choice: agbaala akaebe
  rationale: “Agbaala akaebe” bụ okwu Igbo doro anya maka ịgba ama ma na-egosikwa na e nyela akaebe ahụ, uru ya ka dịkwa.
- source_word: ἀληθινὴ ... ἡ μαρτυρία
  choice: akaebe ya bụkwa eziokwu
  rationale: “Akaebe” kwekọrọ n’ụzọ nkịtị na “ịgba akaebe,” ebe “bụ eziokwu” na-egosi na akaebe ahụ kwesiri ntụkwasị obi ma bụrụ nke bụ eziokwu.
- source_word: ἐκεῖνος
  choice: onye ahụ
  rationale: A sụgharịrị nnọchiaha nrụtụ aka a n’ụzọ siri ike karịa nanị “ọ,” ka e wee chekwaa nkwusi ike dị n’asụsụ Grik n’agbanyeghị na akọwaghị onye ọ bụ.
- source_word: οἶδεν
  choice: makwa
  rationale: Ọ bụ ezie na ọdịdị okwu Grik ahụ bụ perfect, ihe ọ pụtara ebe a bụ ọnọdụ dị ugbu a; ya mere “ma” bụ nsụgharị Igbo kwesịrị ekwesị. “Kwa” na-ejikọ ahịrịokwu ahụ n’ụzọ ebumpụta ụwa.
- source_word: ἀληθῆ λέγει
  choice: na ihe ọ na-ekwu bụ eziokwu
  rationale: 'Nke a na-enye echiche akpaalaokwu Grik ahụ n’Igbo doro anya: okwu ọ na-ekwu bụ eziokwu.'
- source_word: ἵνα καὶ ὑμεῖς πιστεύητε
  choice: ka unu onwe unu kwa wee kwere
  rationale: “Ka ... wee” na-egosipụta ebumnuche nke ἵνα; “unu onwe unu kwa” na-echekwa nkwusi ike na echiche nke ịgụnye ndị na-agụ ya. “Kwere” hapụrụ emeghe ma ọ bụ ịmalite ikwere ma ọ bụ ịnọgide n’okwukwe.
theological_decisions:
- issue: Onye nnọchiaha ndị e mesiri ike na-ezo aka na ya
  choice: E ji “onye ahụ” na onye nke atọ dee amaokwu ahụ n’akọwaghị onye akaebe ahụ bụ.
  alternative: Onye na-akọ akụkọ ahụ, ikekwe onye ahụ Jizọs hụrụ n’anya, nwere ike ịdị na-ekwu banyere onwe ya; ma ọ bụ ọ pụrụ ịdị na-ezo aka n’akaebe ọzọ.
  rationale: Asụsụ Grik akpọghị onye akaebe ahụ aha. Nsụgharị ahụ anaghị ekpebi ihe ederede ahụ na-ekpebighị.
- issue: Ike echiche nke πιστεύητε
  choice: wee kwere
  alternative: nọgide na-ekwere
  rationale: Present subjunctive ahụ nwere ike ịpụta ikwere ma ọ bụ ịnọgide na-ekwere. E ji okwu na-anọpụ iche mee isi ederede, debezie echiche nke ịnọgide na-ekwere n’ala ala peeji.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E chekwara usoro okwu onye nke atọ na nkwusi ike nke Grik n’enweghị ịkpọ onye akaebe ahụ aha ma ọ bụ itinye nkọwa nke otu ụka.
