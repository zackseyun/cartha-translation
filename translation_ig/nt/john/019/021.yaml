reference: John 19:21
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἔλεγον οὖν τῷ Πιλάτῳ οἱ ἀρχιερεῖς τῶν Ἰουδαίων· Μὴ γράφε· Ὁ βασιλεὺς τῶν Ἰουδαίων, ἀλλ’ ὅτι ἐκεῖνος εἶπεν Βασιλεὺς ⸂τῶν Ἰουδαίων εἰμί⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/021.yaml
  text: So the chief priests of the Jews were saying to Pilate[a], “Do not write, ‘The King of the Jews,’ but that he said[b], ‘I am King of the Jews.’”
translation:
  language: ig
  text: Ya mere, ndị isi nchụaja ndị Juu nọ na-agwa Paịlet[a] sị, “Edela, ‘Eze ndị Juu,’ kama dee, ‘Onye ahụ kwuru, “Abụ m Eze ndị Juu.”’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị Judia” / “Eze ndị Judia.” Okwu Grik ahụ nwere ike ịpụta ndị Juu n’ozuzu ha ma ọ bụ ndị Judia kpọmkwem, dabere n’ọnọdụ e ji ya.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔλεγον
  choice: nọ na-agwa
  rationale: Oge imperfect na-egosi omume na-aga n’ihu ma ọ bụ nke a na-eme ugboro ugboro; ‘nọ na-agwa’ na-egosipụta nke a n’Igbo dị eke.
- source_word: οὖν
  choice: Ya mere
  rationale: Na-ejikọta ihe a na akụkọ gara aga ma na-egosi nsonaazụ ma ọ bụ nzaghachi.
- source_word: ἀρχιερεῖς
  choice: ndị isi nchụaja
  rationale: Ọ bụ aha ndị ndu nchụaja, ọ bụghị ikwu na e nwere ọtụtụ ndị ji ọkwa otu nnukwu onye nchụaja n’otu oge.
- source_word: τῶν Ἰουδαίων
  choice: ndị Juu
  rationale: N’akụkọ ahụ, nke a bụ aha ndị a kpọrọ na ihe e dere, ‘Eze ndị Juu’; ‘ndị Judia’ ka bụkwa ihe okwu Grik ahụ nwere ike ịpụta n’ọnọdụ ụfọdụ, ya mere e debere ya n’ala peeji.
- source_word: Μὴ γράφε
  choice: Edela
  rationale: Iwu a na-asị ka a ghara ide ihe ahụ; ‘Edela’ bụ Igbo dị mkpirikpi ma doo anya.
- source_word: Ὁ βασιλεὺς τῶν Ἰουδαίων
  choice: Eze ndị Juu
  rationale: Na-edobe kpọmkwem aha e dere nke ndị isi nchụaja na-ajụ.
- source_word: ἀλλ’ ὅτι
  choice: kama dee na
  rationale: Na-egosi okwu ọzọ ha chọrọ ka Paịlet jiri dochie nke mbụ; itinye ‘dee’ na-eme ka Igbo doo anya n’enweghị mgbanwe n’echiche.
- source_word: ἐκεῖνος
  choice: onye ahụ
  rationale: Na-edobe ike demonstrative nke okwu Grik ahụ, nke nwere ike igosi ịdị anya karịa naanị ‘ọ’.
- source_word: εἶπεν
  choice: kwuru
  rationale: Nsụgharị nkịtị nke ngwaa ahụ; anaghị agbakwunye echiche dịka ‘o kwuru na ọ bụ ezie’ ma ọ bụ ‘o kwusara.’
- source_word: Βασιλεὺς τῶν Ἰουδαίων εἰμί
  choice: Abụ m Eze ndị Juu
  rationale: Na-egosipụta predicative title n’Igbo n’enweghị ịgbakwunye okwu ọzọ kwekọrọ na article nke na-adịghị na Grik.
theological_decisions:
- issue: Ihe Ἰουδαίων pụtara n’akụkọ ahụ
  choice: ndị Juu
  alternative: ndị Judia
  rationale: ‘Ndị Juu’ na-edobe aha ndọrọ ndọrọ ọchịchị na okpukpe a maara nke ọma n’akụkọ ahụ. Ma ebe okwu Grik ahụ nwekwara ike ịpụta ndị Judia n’ọnọdụ ụfọdụ, e debere nhọrọ ahụ n’ala peeji iji ghara imechi nghọta ahụ.
- issue: Ike nke ἐκεῖνος
  choice: onye ahụ
  alternative: ọ
  rationale: ‘Onye ahụ’ na-edobe ịdị anya nke demonstrative ahụ, ma ọ naghị ekpebi n’ụzọ siri ike na okwu ahụ bụ mkparị.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, dị nsọpụrụ ma dị mfe nghọta. E debere usoro okwu e hotara nke ọma, tinyekwa akara ala peeji niile [a] na [b] n’ime amaokwu ahụ.
