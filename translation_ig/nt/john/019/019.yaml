  verdict: revise
  source_fidelity: The draft accurately conveys Pilate’s writing of an inscription, its placement on the cross, and its stated wording. Revising “n’elu obe” to “n’obe” more directly avoids suggesting that the notice was above the cross, an inference not expressed by ἐπὶ τοῦ σταυροῦ.
  naturalness: The main text is clear Standard Igbo. The footnote is understandable but contains less natural phrasing (“n’ebe ndị Juu n’ozuzu ha nọ”); it is recast with direct reference to the groups denoted.
  terminology: “Obe,” “Jizọs,” “Paịlet,” “onye Nazaret,” and “Eze ndị Juu” are appropriate established Standard Igbo biblical terms. The alternative “ndị Judia” is retained in the note to preserve the lexical ambiguity of Ἰουδαίων.
  issues:
  - severity: low
    issue: “n’elu obe” can be understood as ‘above the cross.’
    rationale: The Greek says that Pilate placed the inscription ἐπὶ τοῦ σταυροῦ, ‘on the cross’; it does not specify an above-cross location.
  - severity: low
    issue: Footnote phrasing is somewhat unnatural and indirect.
    rationale: The note should state plainly that the Greek term may refer to Jews generally or specifically to Judeans, without changing the scope of the alternative.
