id: JHN.19.19
reference: John 19:19
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἔγραψεν δὲ καὶ τίτλον ὁ Πιλᾶτος καὶ ἔθηκεν ἐπὶ τοῦ σταυροῦ· ἦν δὲ γεγραμμένον· Ἰησοῦς ὁ Ναζωραῖος ὁ βασιλεὺς τῶν Ἰουδαίων.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/019.yaml
  text: 'Pilate also wrote an inscription and put it on the cross. It was written: “Jesus the Nazarene[a], the King of the Jews.”'
translation:
  language: ig
  text: 'Paịlet dekwara otu ederede, tinye ya n’obe. Ihe e dere bụ: “Jizọs onye Nazaret, Eze ndị Juu[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Eze ndị Judia.” Okwu Grik ahụ nwere ike izo aka n’ndị Juu n’ozuzu ha ma ọ bụ kpọmkwem n’ndị Judia, dabere n’ọnọdụ e ji ya mee ihe.
    reason: alternative_reading
lexical_decisions:
- source_word: τίτλον
  choice: otu ederede
  rationale: N’ọnọdụ a, okwu ahụ pụtara ihe e dere ka a kpọgide n’obe iji kọwaa onye a mara ikpe. “Otu ederede” bụ Igbo doro anya ma kwekọọ n’ahịrị na-esote, “Ihe e dere bụ.”
- source_word: ἔθηκεν ἐπὶ τοῦ σταυροῦ
  choice: tinye ya n’elu obe
  rationale: Nke a na-anọchi anya okwu Grik nke pụtara itinye ihe ahụ n’elu obe, n’etinyeghị echiche ọzọ na ọ dị n’elu obe karịa ebe obe ahụ dị.
- source_word: γεγραμμένον
  choice: Ihe e dere bụ
  rationale: Nke a na-egosipụta ọnọdụ nke ihe ahụ dị ka ederede e dechara, ma na-ada nke ọma n’Igbo ugbu a.
- source_word: Ναζωραῖος
  choice: onye Nazaret
  rationale: Ọ bụ aha njirimara na-egosi na Jizọs bụ onye Nazaret. Nke a bụ ụzọ Igbo dị mfe ma bụrụkwa nke ebumpụta ụwa isi kwuo njirimara ahụ.
- source_word: βασιλεὺς τῶν Ἰουδαίων
  choice: Eze ndị Juu
  rationale: N’akụkọ ahụ, nke a bụ aha eze e dere n’ihu ọha dịka ebubo e boro Jizọs. “Ndị Juu” na-egosipụta nghọta kacha kwekọọ n’ọnọdụ a, ebe a na-edebe “ndị Judia” n’ala ala peeji dịka ihe ọzọ okwu Grik ahụ nwere ike ịpụta.
- source_word: δὲ καὶ
  choice: dekwara
  rationale: Mgbakwunye “-kwa” na-egosipụta echiche nke “ọzọkwa/also” n’ụzọ dị mkpirikpi ma dị ebumpụta ụwa n’Igbo.
- source_word: Ἰησοῦς
  choice: Jizọs
  rationale: Nke a bụ ụdị aha a na-ejikarị eme ihe n’Igbo.
- source_word: Πιλᾶτος
  choice: Paịlet
  rationale: Nke a bụ ụdị aha ahụ dabara n’usoro mkpọpụta na odide Igbo.
- source_word: σταυροῦ
  choice: obe
  rationale: “Obe” bụ okwu Igbo a na-ejikarị anọchi anya σταυρός n’akụkọ ọnwụ Jizọs.
theological_decisions:
- issue: Otú e si sụgharịa Ἰουδαίων n’ederede ahụ
  choice: ndị Juu
  alternative: ndị Judia
  rationale: N’ebe a, okwu ahụ bụ aha eze e dere n’ihu ọha n’ihe metụtara ebubo a boro Jizọs; “ndị Juu” kacha egosipụta nghọta ahụ. Ma ebe okwu Grik ahụ nwekwara ike izo aka kpọmkwem n’ebe ndị Judia nọ, a hapụrụ nhọrọ ahụ n’ala ala peeji ka nghọta abụọ ahụ ghara ifu.
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, nke dị mfe nghọta ma nwee ugwu. Ahịrịokwu ahụ na-edebe usoro na nkwụsi ike nke isi mmalite Grik, ma na-eji “-kwa” gosipụta mgbakwunye δὲ καὶ n’ụzọ Igbo dị mma.
