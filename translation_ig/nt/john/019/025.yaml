  text: Εἱστήκεισαν δὲ παρὰ τῷ σταυρῷ τοῦ Ἰησοῦ ἡ μήτηρ αὐτοῦ καὶ ἡ ἀδελφὴ τῆς μητρὸς αὐτοῦ, Μαρία ἡ τοῦ Κλωπᾶ καὶ Μαρία ἡ Μαγδαληνή.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/025.yaml
  text: Standing by the cross of Jesus were his mother[a], and his mother's sister, Mary the wife of Clopas[b], and Mary Magdalene.
translation:
  language: ig
  text: 'Nne ya, nwanne nwanyị nne ya, Meri nke Klopas[a][b], na Meri Magdalin nọ na-eguzo n''akụkụ obe Jizọs.


    [a] A pụkwara ịtụgharị ya, “Meri, nwunye Klopas.” Ma asụsụ Grik ekwughị kpọmkwem ụdị mmekọrịta dị n’etiti Meri na Klopas.


    [b] A pụkwara ịghọta asụsụ Grik a dị ka ọ na-akpọ ụmụ nwanyị atọ aha kama mmadụ anọ, ma ọ bụrụ na “nwanne nwanyị nne ya” na “Meri nke Klopas” bụ otu onye.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịtụgharị ya, “Meri, nwunye Klopas.” Ma asụsụ Grik ekwughị kpọmkwem ụdị mmekọrịta dị n’etiti Meri na Klopas.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịghọta asụsụ Grik a dị ka ọ na-akpọ ụmụ nwanyị atọ aha kama mmadụ anọ, ma ọ bụrụ na “nwanne nwanyị nne ya” na “Meri nke Klopas” bụ otu onye.
    reason: alternative_reading
lexical_decisions:
- source_word: Εἱστήκεισαν
  choice: nọ na-eguzo
  rationale: Na-egosi ọnọdụ na-aga n'ihu nke ụmụ nwanyị ahụ guzo n'ebe ahụ, dabara n'ọrụ imperfective nke ụdị ngwaa Grik a.
- source_word: δὲ
  choice: (a hapụrụ ya n'ekwughị ya iche)
  rationale: N'ebe a δέ bụ njikọ akụkọ dị nro; nhazi ahịrịokwu Igbo na-ebute ebe ahụ n'ihu na-eme ka mgbanwe akụkọ ahụ doo anya n'enweghị ịtinye okwu siri ike dịka “ma.”
- source_word: παρὰ τῷ σταυρῷ
  choice: n'akụkụ obe
  rationale: Na-egosi ịdị nso n'obe n'ụzọ dị nkenke ma bụrụkwa Igbo nkịtị.
- source_word: τοῦ Ἰησοῦ
  choice: obe Jizọs
  rationale: Na-edobe njikọ genitive dị mfe n'etiti obe ahụ na Jizọs.
- source_word: ἡ μήτηρ αὐτοῦ
  choice: nne ya
  rationale: Nsụgharị kwụ ọtọ ma bụrụ nke e ji eme ihe n'Igbo.
- source_word: ἡ ἀδελφὴ τῆς μητρὸς αὐτοῦ
  choice: nwanne nwanyị nne ya
  rationale: Na-egosi nke ọma na ọ bụ nwanne nwanyị nke nne Jizọs.
- source_word: Μαρία ἡ τοῦ Κλωπᾶ
  choice: Meri nwunye Klopas
  rationale: Nghọta a na-ahụkarị bụ na Meri bụ nwunye Klopas; ihe odide ala peeji na-echekwa eziokwu ahụ na Grik akọwaghị ụdị mmekọrịta ahụ kpọmkwem.
- source_word: Μαρία ἡ Μαγδαληνή
  choice: Meri Magdalin
  rationale: Ụdị aha a maara nke ọma n'Igbo maka Meri onye Magdala.
theological_decisions:
- issue: Ịmata ndị inyom nọ n'akụkụ obe na ọnụ ọgụgụ ha
  choice: 'Isiokwu ahụ depụtara ụmụ nwanyị anọ: nne Jizọs, nwanne nwanyị nne ya, Meri nwunye Klopas, na Meri Magdalin.'
  alternative: A pụrụ ịgụ ya dị ka ụmụ nwanyị atọ ma were “nwanne nwanyị nne ya” na “Meri nke Klopas” dị ka otu onye.
  rationale: Nhazi okwu Grik dị mkpụmkpụ ma nwee ohere maka nghọta abụọ ahụ. Isi nsụgharị gbasoro nghọta mmadụ anọ nke na-apụta n'ụzọ kwụ ọtọ, ebe ihe odide ala peeji chekwara nghọta mmadụ atọ n'ebughị ụzọ kpebie ihe Grik na-ekwughị hoo haa.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta mee ihe. Usoro “nọ na-eguzo” na-echekwa omume na ọnọdụ na-aga n'ihu; e zere ịtinye njikọ siri ike ebe δέ bụ naanị mgbanwe akụkọ dị nro. Akara [a] na [b] dị n'akụkụ okwu “Meri nwunye Klopas” n'ihi na nkọwa abụọ ahụ metụtara njirimara ya na nhazi ndepụta ahụ.
