id: JHN.19.34
reference: John 19:34
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀλλ’ εἷς τῶν στρατιωτῶν λόγχῃ αὐτοῦ τὴν πλευρὰν ἔνυξεν, καὶ ⸂ἐξῆλθεν εὐθὺς⸃ αἷμα καὶ ὕδωρ.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/034.yaml
  text: But one of the soldiers pierced his side with a spear[b][a], and immediately blood and water came out.
translation:
  language: ig
  text: Ma otu n’ime ndị agha ahụ ji ube[a] mapuo akụkụ ya, ozugbo ahụ ọbara na mmiri wee pụta[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ji ùbe agha.”
    reason: lexical_alternative
  - marker: b
    text: Ụfọdụ ndị na-akọwa “ọbara na mmiri” dịka ihe nnọchianya ma ọ bụ dịka ihe metụtara sakramenti; ndị ọzọ na-ewere ya dịka nkọwa anụ ahụ. Ederede Grik n’onwe ya anaghị akọwa ihe nke a pụtara n’ebe a.
    reason: cross_reference
lexical_decisions:
- source_word: ἀλλ’
  choice: Ma
  rationale: Na-egosi ọdịiche dị n’etiti nke a na okwu gara aga banyere na agbajighị Jizọs ụkwụ.
- source_word: εἷς τῶν στρατιωτῶν
  choice: otu n’ime ndị agha ahụ
  rationale: Na-echekwa usoro nkebi Grik nke na-ekwu kpọmkwem na ọ bụ otu onye n’ime ọtụtụ ndị agha.
- source_word: λόγχῃ
  choice: ji ube
  rationale: “Ube” bụ okwu Igbo doro anya ma bụrụkwa nke a na-ejikarị akọwa ngwa agha ogologo nwere ọnụ dị nkọ.
- source_word: αὐτοῦ τὴν πλευρὰν
  choice: ya n’akụkụ ahụ
  rationale: Na-edobe nnọchiaha ahụ dịka Grik si dị, ma “akụkụ ahụ” anaghị akọwapụta ebe ahụ karịa ihe πλευρά kwuru.
- source_word: ἔνυξεν
  choice: dụọ
  rationale: Okwu a na-egosi iji ihe nwere ọnụ dị nkọ maa ma mapuo ahụ; ọ dabara n’asụsụ Igbo dị ugwu ma bụrụ nke sitere n’okwu ahụ kpọmkwem.
- source_word: καὶ ἐξῆλθεν εὐθὺς
  choice: ozugbo ahụkwa, ... wee pụta
  rationale: Na-echekwa ma njikọ καί ma echiche oge nke εὐθύς, n’usoro na-ada nke ọma n’Igbo.
- source_word: αἷμα καὶ ὕδωρ
  choice: ọbara na mmiri
  rationale: Nsụgharị kwụ ọtọ na-echekwa okwu ahụ pụrụ iche n’enweghị ịgbakwunye nkọwa ahụike ma ọ bụ nke sakrament.
theological_decisions:
- issue: Ma a ga-akọwa “ọbara na mmiri” dịka ihe atụ, ihe sakrament, ma ọ bụ ihe mere n’ahụ́
  choice: Idowe okwu nkịtị “ọbara na mmiri” n’enweghị nkọwa n’ahịrịokwu ahụ.
  alternative: Ịkọwa ya dịka ntụaka nye sakrament, ma ọ bụ dịka nkọwa kpọmkwem banyere ihe mmerụ ahụ mere n’ahụ́.
  rationale: Amaokwu ahụ kwuru ihe pụtara, ma ọ kọwaghị ihe ọ pụtara n’ụzọ ime mmụọ ma ọ bụ n’ụzọ ahụike. Ya mere, nsụgharị ahụ na-echekwa esemokwu na nghọta dị iche iche dị n’ederede.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ugwu ma dị mfe nghọta. E jiri “ndị agha” mee ihe maka ndị soja Rom, “dụọ” maka omume iji ube mapuo ahụ, ma debeghị nkọwa ụka ọ bụla n’ime isi ederede.
