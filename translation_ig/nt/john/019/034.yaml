    text: Ụfọdụ ndị na-akọwa “ọbara na mmiri” dịka ihe nnọchianya ma ọ bụ dịka ihe metụtara sakramenti; ndị ọzọ na-ewere ya dịka nkọwa anụ ahụ. Ederede Grik n’onwe ya anaghị akọwa ihe nke a pụtara n’ebe a.
    reason: cross_reference
  revision_rationale: The revision improves the precision and naturalness of the piercing clause, explicitly rendering the possessive relationship in 'his side,' and relocates the lexical footnote anchor to the word it annotates. It does not alter the source's ambiguity or impose a symbolic, sacramental, or medical explanation on 'blood and water.'
