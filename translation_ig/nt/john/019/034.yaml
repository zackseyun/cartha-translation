revisions:
- from: Ma otu n’ime ndị agha ahụ ji ube dụọ ya n’akụkụ ahụ[a], ozugbo ahụkwa, ọbara na mmiri wee pụta[b].
  to: Ma otu n’ime ndị agha ahụ ji ube[a] mapuo akụkụ ya, ozugbo ahụ ọbara na mmiri wee pụta[b].
  rationale: The revision improves the precision and naturalness of the piercing clause, explicitly rendering the possessive relationship in 'his side,' and relocates the lexical footnote anchor to the word it annotates. It does not alter the source's ambiguity or impose a symbolic, sacramental, or medical explanation on 'blood and water.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T08:26:28Z'
review_pass:
  verdict: revise
  source_fidelity: The draft retains the adversative force, the explicit partitive ('one of the soldiers'), the spear, the side, immediacy, and the literal 'blood and water.' However, 'dụọ ya n’akụkụ ahụ' is less clear and idiomatic for piercing a person's side, and 'akụkụ ahụ' does not naturally preserve the possessive force of αὐτοῦ as well as 'akụkụ ya.'
  naturalness: A more natural Standard Igbo wording is 'ji ube mapuo akụkụ ya.' The temporal sequence reads smoothly as 'ozugbo ahụ ọbara na mmiri wee pụta.'
  terminology: '''Ube'' is appropriate for λόγχῃ. ''Mapuo'' accurately expresses piercing with a pointed weapon. The interpretive footnote is revised to use natural terminology for symbolic/sacramental and physical readings, while leaving the verse itself uninterpreted.'
  issues:
  - severity: medium
    issue: The main-clause wording 'ji ube dụọ ya n’akụkụ ahụ' is unclear/less idiomatic and uses a demonstrative where the Greek has a possessive pronoun.
    rationale: The Greek specifically says that the soldier pierced Jesus' side (αὐτοῦ τὴν πλευράν). 'Ji ube mapuo akụkụ ya' is a clear, natural rendering that retains this relation without adding anatomical detail.
  - severity: low
    issue: Footnote a is anchored after 'akụkụ ahụ' although it concerns λόγχῃ ('ube').
    rationale: Moving the anchor directly after 'ube' makes the lexical-alternative note correctly identifiable.
  - severity: low
    issue: The wording of footnote b is somewhat unnatural in Standard Igbo.
    rationale: The revision states the same noncommittal interpretive alternatives more fluently and retains the clarification that the Greek text does not explain the phrase's significance.
  revised_text: Ma otu n’ime ndị agha ahụ ji ube[a] mapuo akụkụ ya, ozugbo ahụ ọbara na mmiri wee pụta[b].
  revised_footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ji ùbe agha.”
    reason: lexical_alternative
