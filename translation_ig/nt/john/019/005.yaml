  text: ἐξῆλθεν οὖν ὁ Ἰησοῦς ἔξω, φορῶν τὸν ἀκάνθινον στέφανον καὶ τὸ πορφυροῦν ἱμάτιον. καὶ λέγει αὐτοῖς· ⸀Ἰδοὺ ὁ ἄνθρωπος.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/005.yaml
  text: So Jesus came out[a], wearing the crown of thorns and the purple robe. And he says to them, “Behold, the man.”
translation:
  language: ig
  text: Mgbe ahụ, Jisọs pụtara n’èzí, yi okpueze e ji ogwu mee na uwe na-acha odo odo. O wee sị ha, “Lee[a], nwoke ahụ.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “Hụ nwoke ahụ.” Okwu Grik bụ Ἰδοὺ bụ okwu e ji adọta uche ndị mmadụ; a pụrụ ịsụgharị ya “Lee” ma ọ bụ “Hụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθεν οὖν ... ἔξω
  choice: Ya mere, ... pụtara n’èzí
  rationale: “Ya mere” na-egosi njikọ nsonaazụ ma ọ bụ ọganihu akụkọ nke οὖν, ebe “pụtara n’èzí” na-egosipụta ma ngwaa ἐξῆλθεν ma nkwusi ike nke ἔξω n’Igbo dị mfe.
- source_word: φορῶν
  choice: yi
  rationale: “Yi” bụ ụzọ Igbo nkịtị na nke doro anya si ekwu na mmadụ nwere uwe ma ọ bụ ihe yiri okpueze n’ahụ.
- source_word: τὸν ἀκάνθινον στέφανον
  choice: okpueze e ji ogwu mee
  rationale: Nke a na-akọwa hoo haa na e ji ogwu mee okpueze ahụ, kama ikwu nanị na ọ bụ okpueze nwere ihe jikọrọ ya na ogwu.
- source_word: τὸ πορφυροῦν ἱμάτιον
  choice: uwe mwụda na-acha pọpụl
  rationale: “Uwe mwụda” na-egosi uwe elu sara mbara e yiri n’ọnọdụ a, ebe “pọpụl” bụ aha ụcha a na-aghọta nke ọma n’Igbo ugbu a ma na-ezere mgbagwoju anya nke ụfọdụ aha ụcha ọdịnala.
- source_word: καὶ λέγει αὐτοῖς
  choice: O wee sị ha
  rationale: Okwu a na-eme ka usoro akụkọ ahụ bụrụ nke eke n’Igbo. Ọ bụ ezie na λέγει bụ historical present n’asụsụ Grik, ịsụgharị ya dịka “na-asị” n’ebe a ga-ada ka omume na-aga n’ihu karịa okwu otu ugboro.
- source_word: Ἰδοὺ
  choice: Lee
  rationale: “Lee” bụ okwu Igbo a na-eji adọta uche mmadụ n’ihe a na-egosi ya; ọ na-edobe ike ngosi nke okwu Grik ahụ n’enweghị asụsụ ochie na-adịghị eke.
- source_word: ὁ ἄνθρωπος
  choice: nwoke ahụ
  rationale: N’ọnọdụ a, ἄνθρωπος na-ezo aka n’otu nwoke a na-egosi ìgwè mmadụ, ya bụ Jizọs. “Nwoke ahụ” bụ ntụgharị Igbo kpọmkwem ma ghara itinye nkọwa gbasara ihe nnọchianya mmadụ niile.
theological_decisions:
- issue: Otú e si sụgharị ὁ ἄνθρωπος n’okwu a e kwuru banyere Jizọs
  choice: nwoke ahụ
  alternative: mmadụ ahụ
  rationale: “Nwoke ahụ” na-ejigide ntụaka kpọmkwem nye Jizọs dịka nwoke e guzobere n’ihu ìgwè mmadụ. “Mmadụ ahụ” ga-ekwe omume ma nwee ike ime ka nghọta banyere nnọchianya mmadụ niile pụta ìhè karịa ihe ahịrịokwu ahụ kwuru kpọmkwem; ya mere, a hapụrụ nghọta sara mbara ọ bụla n’enweghị idozi ya n’ime isi okwu.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe ma nwee nsọpụrụ, dee ya. “Pọpụl” bụ okwu mbinye e ji zere mgbagwoju anya n’aha ụcha, ebe usoro ahịrịokwu ahụ ka na-ada ka akụkọ Igbo eke.
