id: JHN.19.38
reference: John 19:38
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Μετὰ ⸀δὲ ταῦτα ἠρώτησεν τὸν Πιλᾶτον Ἰωσὴφ ⸀ἀπὸ Ἁριμαθαίας, ὢν μαθητὴς τοῦ Ἰησοῦ κεκρυμμένος δὲ διὰ τὸν φόβον τῶν Ἰουδαίων, ἵνα ἄρῃ τὸ σῶμα τοῦ Ἰησοῦ· καὶ ἐπέτρεψεν ὁ Πιλᾶτος. ἦλθεν οὖν καὶ ἦρεν τὸ σῶμα ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/038.yaml
  text: After these things[a], Joseph from Arimathea, being a disciple of Jesus but having kept it hidden because of fear of the Jews, asked Pilate that he might take away the body of Jesus. And Pilate gave permission. So he came and took away his body.
translation:
  language: ig
  text: Mgbe ihe ndị a gasịrị, Josef onye si Arimatia, onye bụ onye na-eso ụzọ Jizọs na nzuzo n’ihi egwu ndị Juu[a], rịọrọ Paịlet ka ọ hapụ ya iburu ozu Jizọs pụọ. Paịlet nyere ya ikike. Ya mere, ọ bịara buru ozu ya pụọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, dịka ọnọdụ okwu a si dị kpọmkwem, “ndị ọchịchị na Judia” ma ọ bụ “ndị isi ndị Juu.” Jọn na-ejikarị “ndị Juu” akọwa ndị na-emegide Jizọs, ọ bụghị ndị Juu niile n’enweghị ịkpa ókè.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δὲ ταῦτα
  choice: Mgbe ihe ndị a gasịrị
  rationale: Nke a na-edobe ntụgharị oge ahụ na ọtụtụ nke ταῦτα, ma bụrụkwa Igbo doro anya.
- source_word: Ἰωσὴφ ἀπὸ Ἁριμαθαίας
  choice: Josef onye si Arimatia
  rationale: ἀπό na-egosi ebe onye ahụ si; ‘onye si Arimatia’ bụ ụzọ Igbo si ekwu ya n'ụzọ kwụ ọtọ.
- source_word: ὢν μαθητὴς τοῦ Ἰησοῦ
  choice: onye bụ onye na-eso ụzọ Jizọs
  rationale: ‘Onye na-eso ụzọ’ bụ okwu Igbo nkịtị ma doo anya maka μαθητής.
- source_word: κεκρυμμένος
  choice: ma zoo nke a
  rationale: Ọ na-ezo aka n’ịbụ onye na-eso ụzọ Jizọs nke Josef mere ka ọ ghara ịpụta ìhè; ‘nke a’ na-eme ka ihe e zoro doo anya n’enweghị ịgbasa ihe odide ahụ.
- source_word: διὰ τὸν φόβον τῶν Ἰουδαίων
  choice: n’ihi egwu ndị Juu
  rationale: Nke a na-esochi nhazi na nghọta okwu Grik ahụ, ma na-ahapụ mgbagwoju anya nke ndị Ἰουδαῖοι na-ezo aka na ha ka nkọwa ala peeji kọwaa ya.
- source_word: ἵνα ἄρῃ τὸ σῶμα τοῦ Ἰησοῦ
  choice: ka o kwe ka o buru ozu Jizọs pụọ
  rationale: N’ihi na ihe a rịọrọ Paịlet bụ ikike, ‘ka o kwe ka’ na-eme ka ebumnuche arịrịọ ahụ bụrụ Igbo eke; ‘buru ... pụọ’ na-egosi iwepụ ozu ahụ.
- source_word: ἐπέτρεψεν
  choice: kwekwara
  rationale: N’ebe a, ngwaa ahụ pụtara inye ikike; ‘kwekwara’ dị nkenke ma bụrụ Igbo nkịtị.
- source_word: ἦλθεν οὖν καὶ ἦρεν τὸ σῶμα αὐτοῦ
  choice: Ya mere, ọ bịara buru ozu ya pụọ
  rationale: ‘Ya mere’ na-anọchi οὖν; ‘buru ... pụọ’ na-edobe otu echiche αἴρω ahụ, ebe ‘ya’ na-anọchi αὐτοῦ.
theological_decisions:
- issue: Ihe τῶν Ἰουδαίων na-ezo aka na ya n’Oziọma Jọn
  choice: ndị Juu n’ahịrịokwu bụ isi, tinyere nkọwa ala peeji
  alternative: ndị isi ndị Juu; ndị Judia
  rationale: Ihe odide Grik kwuru ‘ndị Juu’ n’ụzọ sara mbara, ya mere a naghị eme ka ọ bụrụ naanị ndị isi n’ahịrịokwu bụ isi. Nkọwa ala peeji na-egosi na n’ọnọdụ a, okwu ahụ pụrụ ịpụta karịsịa ndị ọchịchị ma ọ bụ ndị na-emegide Jizọs, ka a ghara ịghọta ya dị ka ndị Juu niile n’enweghị ịkpa ókè.
translation_notes:
  register: Asụsụ Igbo Izugbe, nke oge a, dị nsọ ma dị mfe nghọta. E ji ‘ozu’ mee ihe maka σῶμα n’ọnọdụ ọnwụ a, n’ihi na ọ bụ okwu Igbo eke maka ahụ onye nwụrụ anwụ. Akara nkọwa [a] dị ozugbo n’akụkụ okwu ọ na-akọwa.
