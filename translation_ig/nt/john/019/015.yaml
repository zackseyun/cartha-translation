id: JHN.19.15
reference: John 19:15
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸂ἐκραύγασαν οὖν ἐκεῖνοι⸃· Ἆρον ἆρον, σταύρωσον αὐτόν. λέγει αὐτοῖς ὁ Πιλᾶτος· Τὸν βασιλέα ὑμῶν σταυρώσω; ἀπεκρίθησαν οἱ ἀρχιερεῖς· Οὐκ ἔχομεν βασιλέα εἰ μὴ Καίσαρα.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/015.yaml
  text: So they cried out[a], “Away, away! Crucify him!” Pilate said to them, “Shall I crucify your king?” The chief priests answered, “We have no king except Caesar.”
translation:
  language: ig
  text: Ya mere, ha tiri mkpu, sị, “Wepụ ya! Wepụ ya! Kpọgide ya n’obe!” Paịlet jụrụ ha, “M̀ ga-akpọgide eze unu n’obe?” Ndị isi nchụàjà zara, “Anyị enweghị eze ma e wezụga Siza.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “Anyị enweghị eze ma ọ bụghị Siza.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκραύγασαν
  choice: ha tiri mkpu
  rationale: Nkebi a na-egosi iti mkpu n’olu dara ụda; ‘ha tiri mkpu’ na-ebute ike okwu ahụ n’Igbo nkịtị n’agbanyeghị na ọ naghị ekwu kpọmkwem ụdị mmetụta obi ha.
- source_word: οὖν
  choice: Ya mere
  rationale: Ọ na-egosi ihe si n’ihe ndị bu ya ụzọ pụta ma na-akwalikwa akụkọ n’ihu.
- source_word: ἐκεῖνοι
  choice: ha
  rationale: Ọ bụ ezie na okwu Grik ahụ nwere ike imesi ‘ndị ahụ’ ike, ‘ha’ bụ ụzọ Igbo si ekwu ya nke ọma n’akụkọ a.
- source_word: Ἆρον ἆρον
  choice: Wepụ ya! Wepụ ya!
  rationale: Iwu a e kwughachiri bụ mkpu ka e wepụ Jizọs. E tinyere ‘ya’ nke a ghọtara site n’ọnọdụ okwu ka Igbo wee bụrụ nke doro anya ma dị ndụ.
- source_word: σταύρωσον αὐτόν
  choice: Kpọgide ya n’obe
  rationale: N’ọnọdụ ntaramahụhụ ndị Rom, nke a bụ okwu Igbo doro anya maka igbu mmadụ site n’ịkpọgide ya n’obe.
- source_word: λέγει αὐτοῖς ὁ Πιλᾶτος
  choice: Paịlet jụrụ ha
  rationale: Ọ bụ ezie na λέγει pụtara ‘sịrị,’ okwu na-esochi bụ ajụjụ, ya mere ‘jụrụ’ bụ Igbo ebumpụta ụwa ma na-echekwa ọrụ okwu ahụ n’akụkọ.
- source_word: Τὸν βασιλέα ὑμῶν
  choice: eze unu
  rationale: Ọ na-echekwa okwu Paịlet ji kpọọ ya eze ha, tinyere ike ịma aka dị n’ajụjụ ahụ.
- source_word: σταυρώσω
  choice: M̀ ga-akpọgide ... n’obe?
  rationale: Ụdị ajụjụ a na-egosipụta ajụjụ Paịlet banyere ihe ọ ga-eme, ma na-echekwa ike ajụjụ ya.
- source_word: οἱ ἀρχιερεῖς
  choice: Ndị isi nchụàjà
  rationale: Nke a na-ezo aka n’ọchịchị ndị nchụàjà kachasị elu, ọ bụghị n’ọtụtụ ndị isi nchụàjà nọ n’ọrụ n’otu oge.
- source_word: Οὐκ ἔχομεν βασιλέα εἰ μὴ Καίσαρα
  choice: Anyị enweghị eze ma e wezụga Siza
  rationale: ‘Ma e wezụga’ na-egosipụta nkewapụ na naanị Siza ka ha kwuru na ọ bụ eze ha, n’enweghị itinye nkọwa ozizi ọzọ.
theological_decisions:
- issue: Nkwupụta ndị isi nchụàjà banyere onye ha na-ewere dị ka eze
  choice: Anyị enweghị eze ma e wezụga Siza
  alternative: Anyị enweghị eze ma ọ bụghị Siza
  rationale: Nsụgharị a na-echekwa nkwupụta ahụ siri ike na esemokwu dị n’ime akụkọ ahụ—ha jụrụ eze ọ bụla ọzọ n’oge ahụ—ma ọ naghị akọwara onye na-agụ ya ihe ọ ga-ekpebi banyere ihe nke a pụtara n’ozizi.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. Mkpu ndị ahụ dị nkenke ma sie ike; okwu Paịlet na nkwupụta ndị isi nchụàjà ka edobere n’ụzọ na-echekwa esemokwu akụkọ ahụ.
