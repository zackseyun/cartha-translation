id: JHN.19.20
reference: John 19:20
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τοῦτον οὖν τὸν τίτλον πολλοὶ ἀνέγνωσαν τῶν Ἰουδαίων, ὅτι ἐγγὺς ἦν ὁ τόπος τῆς πόλεως ὅπου ἐσταυρώθη ὁ Ἰησοῦς· καὶ ἦν γεγραμμένον Ἑβραϊστί, ⸂Ῥωμαϊστί, Ἑλληνιστί⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/020.yaml
  text: Therefore many of the Jews read this inscription[a], because the place where Jesus was crucified was near the city; and it was written in Hebrew, in Latin, and in Greek.
translation:
  language: ig
  text: N’ihi ya, ọtụtụ n’ime ndị Juu gụrụ ihe odide ahụ, n’ihi na ebe a kpọgidere Jizọs n’obe dị nso n’obodo ahụ. E dere ya n’asụsụ Hibru[a], n’asụsụ Latịn, na n’asụsụ Grik.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma eleghị anya, “Arameik”; Jọn ji “Hibru” kpọọ asụsụ Semitik ndị obodo ahụ na-asụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: τίτλον
  choice: ihe odide ahụ
  rationale: N’ọnọdụ a, okwu ahụ na-ezo aka n’ihe e dere n’elu obe iji kọwaa onye Jizọs bụ. “Ihe odide ahụ” bụ okwu Igbo doro anya ma kwekọọ n’ihe a kpọgidere ka ndị mmadụ gụọ.
- source_word: πολλοὶ ... τῶν Ἰουδαίων
  choice: ọtụtụ n’ime ndị Juu
  rationale: 'Nke a na-echekwa echiche nkewa dị na genitive Grik: ọ bụghị ndị Juu niile, kama ọtụtụ n’ime ha.'
- source_word: ἀνέγνωσαν
  choice: gụrụ
  rationale: Okwu Grik ahụ pụtara nanị omume ịgụ ihe ahụ; ọ naghị ekwu hoo haa na ha gụrụ ya n’olu dara ụda.
- source_word: ἐγγὺς ἦν ὁ τόπος τῆς πόλεως
  choice: ebe ... dị nso n’obodo ahụ
  rationale: Nke a na-enye nghọta nkịtị nke okwu Grik n’etinyeghị echiche ọzọ dịka na ebe ahụ dị nso n’ọnụ ụzọ ámá obodo.
- source_word: ὅπου ἐσταυρώθη ὁ Ἰησοῦς
  choice: ebe a kpọgidere Jizọs n’obe
  rationale: Nke a na-echekwa olu nnara nke okwu Grik ma bụrụkwa ụzọ ebumpụta ụwa e si ekwu ya n’Igbo.
- source_word: γεγραμμένον
  choice: E dekwara ya
  rationale: Perfect participle ahụ na-egosi na ihe ahụ nọ n’ọnọdụ e derela ya. “E dekwara ya” na-egosi nke a nke ọma ma jikọta ahịrịokwu ahụ n'ụzọ dị larịị.
- source_word: Ἑβραϊστί
  choice: n’asụsụ Hibru
  rationale: Isi ederede na-edobe aha asụsụ nke Grik ji mee ihe. E debere “Arameik” dịka ihe ọzọ nwere ike ịbụ n’okpuru peeji.
- source_word: Ῥωμαϊστί
  choice: n’asụsụ Latịn
  rationale: Ọ bụ ezie na okwu ahụ pụtara n’ụzọ nkịtị “n’asụsụ ndị Rom,” asụsụ a na-ekwu maka ya bụ Latịn.
- source_word: Ἑλληνιστί
  choice: n’asụsụ Grik
  rationale: Nke a bụ ntụgharị okwu kpọmkwem ma doo anya nke adverb Grik ahụ.
- source_word: οὖν
  choice: N’ihi ya
  rationale: Nke a na-echekwa njikọ ezi uche na akụkọ dị n’etiti amaokwu a na nke bu ya ụzọ.
theological_decisions:
- issue: Otú e si sụgharịa Ἑβραϊστί n’akwụkwọ Jọn
  choice: Hibru n’isi ederede
  alternative: Arameik
  rationale: Ihe odide Grik kwuru “Hibru,” ya mere isi ederede na-edobe ya. Ma ebe Jọn nwere ike iji okwu a na-ezo aka n’asụsụ Semitik ndị obodo ahụ na-asụ, ikekwe Arameik, e gosiri nke ahụ n’okpuru peeji kama iji ya dochie okwu dị n’isi ederede.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-agbaso usoro echiche nke Grik, ma e kewara ya ụzọ abụọ ka ọ na-agụ nke ọma n’Igbo. A na-eji “Jizọs” na aha asụsụ ndị a maara nke ọma n’Igbo.
