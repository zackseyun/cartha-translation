revisions:
- from: Site n’oge ahụ gaa, Paịlet nọ na-achọ ịhapụ ya[a]. Ma ndị Juu[b] tiri mkpu, sị, “Ọ bụrụ na ị hapụ nwoke a, ị bụghị enyi Siza. Onye ọ bụla nke na-eme onwe ya eze na-emegide Siza[c].”
  to: Site n’oge ahụ, Paịlet nọ na-achọ ịtọhapụ ya[a]. Ma ndị Juu[b] tiri mkpu, sị, “Ọ bụrụ na ị tọhapụ nwoke a, ị bụghị enyi Siza. Onye ọ bụla nke na-eme onwe ya eze na-emegide Siza[c].”
  rationale: The revisions improve Standard Igbo idiom and clarify the judicial force of release while preserving the source text’s wording, aspect, and political accusation. Footnote anchors remain correctly attached to the relevant expressions.
