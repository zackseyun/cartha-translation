id: JHN.19.12
reference: John 19:12
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐκ τούτου ⸂ὁ Πιλᾶτος ἐζήτει⸃ ἀπολῦσαι αὐτόν· οἱ δὲ Ἰουδαῖοι ⸀ἐκραύγασαν λέγοντες· Ἐὰν τοῦτον ἀπολύσῃς, οὐκ εἶ φίλος τοῦ Καίσαρος· πᾶς ὁ βασιλέα ἑαυτὸν ποιῶν ἀντιλέγει τῷ Καίσαρι.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/012.yaml
  text: From then on Pilate was seeking to release him. But the Jews shouted, saying, “If you release this man, you are not Caesar’s friend. Everyone who makes himself a king speaks against Caesar.”
translation:
  language: ig
  text: Site n’oge ahụ, Paịlet nọ na-achọ ịtọhapụ ya[a]. Ma ndị Juu[b] tiri mkpu, sị, “Ọ bụrụ na ị tọhapụ nwoke a, ị bụghị enyi Siza. Onye ọ bụla nke na-eme onwe ya eze na-emegide Siza[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “N’ihi nke a, Paịlet nọgidere na-achọ ịtọhapụ ya.” Nkebiokwu Grik ahụ nwere ike igosi oge (“site n’oge ahụ”) ma ọ bụ ihe kpatara ya (“n’ihi nke a”).
    reason: lexical_alternative
  - marker: b
    text: N’Oziọma Jọn, “ndị Juu” na-ezokarị aka kpọmkwem n’ebe ndị isi ndị Juu na Judia nọ, ma ọ bụ ụfọdụ ndị Juu na-emegide Jizọs n’akụkọ ahụ; ọ pụtaghị ndị Juu niile.
    reason: cultural_note
  - marker: c
    text: Ma ọ bụ, “na-ekwu okwu megide Siza,” ma ọ bụ, “na-eguzogide Siza.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ τούτου
  choice: Site n’oge ahụ gaa
  rationale: Nkebiokwu a na-aga nke ọma dịka akara oge n’akụkọ a, ma ọ ka nwere ike ịpụta ‘n’ihi nke a’; e debere nghọta nke abụọ n’ala peeji.
- source_word: ἐζήτει
  choice: nọ na-achọ
  rationale: Ọdịdị imperfect na-egosi mgbalị na-aga n’ihu ma ọ bụ a na-eme ugboro ugboro.
- source_word: ἀπολῦσαι / ἀπολύσῃς
  choice: ịhapụ / hapụ
  rationale: N’ọnọdụ ikpe a, ‘ịhapụ’ na-egosi ịtọpụ onye nọ n’okpuru njide gọọmenti n’asụsụ Igbo dị mfe.
- source_word: οἱ δὲ Ἰουδαῖοι
  choice: Ma ndị Juu
  rationale: A nọgidere n’okwu sara mbara nke Grik kama ịkọwa ya n’ahịrị dịka naanị ndị isi; ala peeji na-enye nkọwa banyere ndị okwu ahụ nwere ike izo aka na ha n’akụkọ Jọn.
- source_word: ἐκραύγασαν λέγοντες
  choice: tiri mkpu, sị
  rationale: Nke a na-egosi iti mkpu n’olu dara ụda ma na-ebute okwu ha n’ụzọ Igbo sitere n’okike.
- source_word: τοῦτον
  choice: nwoke a
  rationale: ‘Nwoke a’ na-edowe ike nke okwu ngosi ahụ ma dabara n’ụda okwu mmegide.
- source_word: φίλος τοῦ Καίσαρος
  choice: enyi Siza
  rationale: Nke a bụ ntụgharị doro anya nke njikọ genitive ahụ ma na-edowe ebubo banyere iguzosi ike n’ihe nye Siza.
- source_word: πᾶς ὁ βασιλέα ἑαυτὸν ποιῶν
  choice: Onye ọ bụla nke na-eme onwe ya eze
  rationale: Nke a na-anọ nso n’usoro na ike nke Grik, na-enweghị ime ka ọ bụrụ naanị ikwu na mmadụ bụ eze.
- source_word: ἀντιλέγει τῷ Καίσαρι
  choice: na-emegide Siza
  rationale: N’ọnọdụ ndọrọ ndọrọ ọchịchị na ikpe a, ἀντιλέγω na-egosi iguzogide ma ọ bụ imegide Siza; ala peeji na-edowe ntụgharị ọzọ nke na-elekwasị anya n’ikwu okwu megide ya.
theological_decisions:
- issue: Ndị okwu ‘ndị Juu’ na-ezo aka na ha n’Oziọma Jọn
  choice: E debere ‘ndị Juu’ n’ahịrị isi.
  alternative: ndị isi ndị Juu; ndị Judia
  rationale: Grik kwuru οἱ Ἰουδαῖοι n’enweghị nkọwa ọzọ. Ịgbanwe ya n’ahịrị isi ga-eme ka otu nkọwa bụrụ naanị ihe ederede pụtara; ya mere, e nyere nkọwa ọnọdụ ya n’ala peeji.
- issue: Ike nke ἀντιλέγει n’ebubo megide Siza
  choice: na-emegide Siza
  alternative: na-ekwu okwu megide Siza; na-eguzogide Siza
  rationale: N’ọnọdụ a, okwu ahụ karịrị nanị ikwu okwu ma na-egosi mmegide ndọrọ ndọrọ ọchịchị, ma e debere ohere nghọta nke okwu ọnụ n’ala peeji.
translation_notes:
  register: Asụsụ Igbo Standard dị ugbu a, kwụ ọtọ ma dị ùgwù. E jiri ‘Paịlet’ na ‘Siza’ dịka ụdị aha ndị a na-ahụkarị n’Igbo; a zere ịtinye nkọwa otu ụka n’ahịrị isi.
