  text: So they said to him[a], “How were your eyes opened?”
translation:
  language: ig
  text: Ya mere, ha nọ na-asị ya,[a] “Olee otú e si meghee anya gị?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ịsụgharị ya: “Ha sịrị ya.” Ngwaa Grik ahụ nwere ike igosi okwu na-aga n''ihu ma ọ bụ nke a na-ekwu ugboro ugboro.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγον
  choice: ha nọ na-ajụ ya, sị
  rationale: Ngwaa imperfect na-egosi okwu a na-ekwu n'oge ahụ ma ọ bụ ajụjụ a na-ajụ ugboro ugboro. N'ọnọdụ a, ‘ha nọ na-ajụ ya, sị’ bụ Igbo nkịtị ma na-eme ka akụkụ imperfect ahụ pụta ìhè.
- source_word: οὖν
  choice: Ya mere
  rationale: Njikọ a na-egosi ihe si n'okwu ndị bu ụzọ pụta, ma ‘Ya mere’ na-echekwa ike njikọ ahụ n'Igbo doro anya.
- source_word: αὐτῷ
  choice: ya
  rationale: Nnochiaha dative a bụ onye ha na-agwa okwu; n'usoro Igbo, ‘ajụ ya’ na-egosipụta nke a nke ọma.
- source_word: Πῶς
  choice: Olee otú
  rationale: Ọ na-ajụ ụzọ ihe ahụ si mee; ‘Olee otú’ bụ ntụgharị Igbo kwụ ọtọ ma dịkwa eke.
- source_word: ἠνεῴχθησάν
  choice: e si meghee
  rationale: Aorist passive a na-egosi na e mere ihe n'anya ya, ọ bụghị na anya ahụ meghere onwe ya. Ihe nnọchianya ‘e’ na-echekwa passive ahụ n'Igbo eke.
- source_word: σου οἱ ὀφθαλμοί
  choice: anya gị
  rationale: N'agbanyeghị na Grik nwere article, Igbo na-egosipụta njikọ nwe site n'ịsị ‘anya gị’; nke a bụ okwu zuru oke ma dị eke.
theological_decisions: []
translation_notes:
  register: Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E chekwara passive nke Grik site n'okwu ‘e si meghee,’ ma jiri usoro okwu Igbo eke mee ka imperfect nke ἔλεγον pụta ìhè.
