  source_fidelity: The rendering faithfully conveys εἶπεν αὐτῷ, the perfect force of ἑώρακας (“Ị hụla”), the object pronoun, and Jesus’ identification with the previously mentioned referent. “gị na ya na-ekwu okwu” appropriately retains the reciprocal sense of λαλεῖν μετὰ σοῦ rather than narrowing it to merely speaking to the man. “bụkwa ya” expresses the identifying force of ἐκεῖνός ἐστιν without supplying “Nwa nke Mmadụ.”
