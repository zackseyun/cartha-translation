  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸀εἶπεν αὐτῷ ὁ Ἰησοῦς· Καὶ ἑώρακας αὐτὸν καὶ ὁ λαλῶν μετὰ σοῦ ἐκεῖνός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/037.yaml
  text: Jesus said to him[a], “You have seen him, and the one speaking with you is he.”
translation:
  language: ig
  text: Jizọs sịrị ya, “Ị hụla ya, onye ahụ gị na ya na-ekwu okwu bụkwa ya.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶπεν αὐτῷ
  choice: Jizọs sịrị ya
  rationale: “Sịrị ya” bụ ụzọ Igbo nkịtị na nke ziri ezi isi gosipụta okwu a gwara onye ahụ kpọmkwem, n’ebughị ihe ọzọ n’ime ngwaa ahụ.
- source_word: Καὶ ἑώρακας αὐτὸν
  choice: Ị hụla ya
  rationale: Ụdị “hụla” na-egosipụta ihe e mere nke ka nwere mkpa ugbu a; a hapụrụ καί mbụ n’asụsụ Igbo n’ihi na itinye “na” ná mmalite ga-ada arọ ma ọ gaghị agbanwe njikọ echiche ahụ.
- source_word: ὁ λαλῶν μετὰ σοῦ
  choice: onye ahụ gị na ya na-ekwu okwu
  rationale: Nke a na-echekwa μετά σοῦ dịka “gị na ya,” ya bụ, iso mmadụ ekwu okwu, kama ime ya naanị “onye na-agwa gị okwu.”
- source_word: ἐκεῖνός ἐστιν
  choice: bụkwa ya
  rationale: “Bụkwa ya” na-enye njirimara ahụ kpọmkwem ma na-echekwa καί nke abụọ, n’etinyeghị aha “Nwa nke Mmadụ” ọzọ nke adịghị n’amaokwu a.
theological_decisions:
- issue: Jizọs na-eme ka a mata na ya onwe ya bụ onye nwoke ahụ jụrụ banyere ya.
  choice: onye ahụ gị na ya na-ekwu okwu bụkwa ya
  alternative: ọ bụ ya na-agwa gị okwu
  rationale: Nhọrọ a na-echekwa njirimara doro anya nke Grik ma ghara ịgbakwunye utu aha e kwuru n’amaokwu bu ụzọ. Ọ na-echekwakwa echiche “ịgwa ibe ha okwu” dị na μετά σοῦ.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E ji “gị na ya na-ekwu okwu” chekwaa ọdịiche dị n’etiti “speaking with you” na “speaking to you” n’enweghị nkọwa ụkwụ peeji.
