revisions:
- from: Ọ zara ha, sị, “Agwala m unu ya, ma unu egeghị ntị[a]. Gịnị mere unu ji chọọ ịnụ ya ọzọ? Ọ̀ ga-abụ na unu onwe unu chọkwara ịghọ ndị na-eso ụzọ ya[b]?”
  to: Ọ zara ha, sị, “Agwala m unu ya, ma unu egeghị ntị[a]. Gịnị mere unu ji chọọ ịnụ ya ọzọ? Unu onwe unu achọghịkwa ịghọ ndị na-eso ụzọ ya, ọ̀ bụghị ya?[b]”
  rationale: The revision changes only the final rhetorical question and its note. “Unu onwe unu achọghịkwa ... , ọ̀ bụghị ya?” preserves the emphasis on “you yourselves,” the additive force of καί (“-kwa”), and especially μή’s expectation of a negative answer, without adding interpretation beyond the Greek.
