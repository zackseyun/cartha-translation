source:
  edition: SBLGNT
  text: ἀπεκρίθη αὐτοῖς· Εἶπον ὑμῖν ἤδη καὶ οὐκ ἠκούσατε· τί πάλιν θέλετε ἀκούειν; μὴ καὶ ὑμεῖς θέλετε αὐτοῦ μαθηταὶ γενέσθαι;
base_translation:
  language: en
  yaml_path: translation/nt/john/009/027.yaml
  text: He answered them[a], “I already told you, and you did not listen. Why do you want to hear it again? You do not also want to become his disciples[b], do you?”
translation:
  language: ig
  text: Ọ zara ha, sị, “Agwala m unu ya, ma unu egeghị ntị[a]. Gịnị mere unu ji chọọ ịnụ ya ọzọ? Unu onwe unu achọghịkwa ịghọ ndị na-eso ụzọ ya, ọ̀ bụghị ya?[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ma unu anụghị.” Ngwaa Grik ahụ nwere ike ịpụta “ịnụ” ma ọ bụ “ige ntị”; n’ebe a, o yikarịrị ka ọ na-ekwu na ha egeghị ihe e kwuru ntị.
    reason: lexical_alternative
  - marker: b
    text: Ajụjụ Grik a na-atụ anya azịza mba. A pụkwara ịsụgharị ya, “N’ezie, unu onwe unu achọghịkwa ịghọ ndị na-eso ụzọ ya?”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη αὐτοῖς
  choice: Ọ zara ha, sị
  rationale: Nke a bụ ụzọ Igbo nkịtị si ebute azịza e kwuru kpọmkwem, ma na-edobe ihe ἀπεκρίθη pụtara.
- source_word: ἤδη
  choice: Agwala m unu ya
  rationale: Ụdị ngwaa zuru ezu ‘agwala m’ na-egosi na o kwuburu ya; itinye ‘ugbua’ agaghị abụ ihe dị mkpa ma nwee ike ịpụta ‘now’ karịa ‘already’.
- source_word: οὐκ ἠκούσατε
  choice: unu egeghị ntị
  rationale: N’ọnọdụ a, ἀκούω metụtara ọ bụghị naanị ịnụ ụda kama ịṅa ntị na ịnabata ihe e kwuru. ‘Egeghị ntị’ na-egosipụta mba ahụ nke ọma.
- source_word: τί πάλιν θέλετε ἀκούειν;
  choice: Gịnị mere unu ji chọọ ịnụ ya ọzọ?
  rationale: τί na nkebiokwu a na-arụ ọrụ dị ka ajụjụ ‘gịnị mere’; ‘ya’ na-ezo aka n’ihe ọ gwara ha na mbụ ma mee ka Igbo bụrụ nke okike.
- source_word: μὴ καὶ ὑμεῖς
  choice: Ọ̀ ga-abụ na unu onwe unu chọkwara…?
  rationale: Ajụjụ a na-egosi ihe ijuanya na njakịrị ma na-atụ anya azịza mba; ‘unu onwe unu’ na-edobe nkwusi ike nke ὑμεῖς, ‘-kwa’ na-edobe καί.
- source_word: αὐτοῦ μαθηταὶ γενέσθαι
  choice: ịghọ ndị na-eso ụzọ ya
  rationale: ‘Ịghọ’ na-edobe echiche nke ịbanye n’ọnọdụ ọhụrụ dị na γενέσθαι; ‘ndị na-eso ụzọ ya’ bụ Igbo doro anya maka μαθηταὶ αὐτοῦ.
theological_decisions:
- issue: Ike okwu dị n’ajụjụ ikpeazụ
  choice: 'E depụtara ya dị ka ajụjụ njakịrị nke na-atụ anya azịza mba: ‘Ọ̀ ga-abụ na unu onwe unu chọkwara…?’'
  alternative: ‘Unu onwe unu achọghịkwa ịghọ ndị na-eso ụzọ ya, ka unu chọrọ?’
  rationale: μή na-ajụ ajụjụ nke onye na-ekwu okwu na-atụ anya ka a zaa mba. Nsụgharị a na-edobe ụda njakịrị nwoke ahụ a gwọrọ ji zaa ha, n’etinyeghị nkọwa ozizi ọzọ.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. ‘Ndị na-eso ụzọ’ bụ okwu Baịbụl a maara nke ọma ma ka na-edo anya nye ndị na-agụ akwụkwọ taa. Ajụjụ ikpeazụ na-edobe nkwusi ike, ihe ijuanya, na ụda njakịrị dị n’asụsụ Grik.
