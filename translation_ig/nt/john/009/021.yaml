id: JHN.9.21
reference: John 9:21
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: πῶς δὲ νῦν βλέπει οὐκ οἴδαμεν, ἢ τίς ἤνοιξεν αὐτοῦ τοὺς ὀφθαλμοὺς ἡμεῖς οὐκ οἴδαμεν· ⸂αὐτὸν ἐρωτήσατε, ἡλικίαν ἔχει⸃, αὐτὸς περὶ ἑαυτοῦ λαλήσει.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/021.yaml
  text: But how he now sees[a], we do not know; or who opened his eyes, we do not know. Ask him; he is of age. He will speak for himself.
translation:
  language: ig
  text: Ma otú o si ahụ ugbu a, anyị amaghị; ma ọ bụ onye meghere anya ya, anyị amaghị. Jụọnụ ya; o tozuru etozu. Ya onwe ya ga-ekwu maka onwe ya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “O nwere ike ikwuchitere onwe ya.” Okwu ọdịnihu e ji mee ihe n’asụsụ Grik pụrụ ịrụ ọrụ dịka nkwupụta bara uru na ọ pụrụ, ma ọ bụ kwesị, ịza ajụjụ n’onwe ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: πῶς δὲ νῦν βλέπει
  choice: Ma otú o si ahụ ụzọ ugbu a
  rationale: “Otú ... si” na-egosipụta ajụjụ banyere ụzọ ihe si mee; “ma” na-eburu δέ dị ka njikọ nwere obere nghọtahie, “ugbu a” na-anọchi νῦν, ebe “ahụ ụzọ” bụ ụzọ Igbo si ekwu ịhụ ihe nke ọma.
- source_word: οὐκ οἴδαμεν
  choice: anyị amaghị
  rationale: Nke a bụ ntụgharị kwụ ọtọ nke okwu pụtara ‘anyị amaghị.’ E debere nkwughachi ya ugboro abụọ dịka ọ dị n’asụsụ Grik iji chekwaa ike okwu ndị mụrụ ya.
- source_word: ἢ τίς ἤνοιξεν αὐτοῦ τοὺς ὀφθαλμούς
  choice: ma ọ bụ onye meghere anya ya
  rationale: “Ma ọ bụ” na-egosipụta ajụjụ ọzọ, “onye” bụ τίς, ebe “meghere anya ya” na-echekwa akpaalaokwu akụkọ ahụ ji kọwaa ọrụ ebube ahụ.
- source_word: αὐτὸν ἐρωτήσατε
  choice: Jụọnụ ya
  rationale: Ọ bụ iwu e nyere ọtụtụ mmadụ. “Jụọnụ” na-eme ka ọnụọgụ ọtụtụ dị na Grik pụta ìhè ma bụrụkwa okwu Igbo nkịtị.
- source_word: ἡλικίαν ἔχει
  choice: o toruola ịza ajụjụ n’onwe ya
  rationale: N’ebe a, okwu ahụ na-ezo aka n’ịbụ onye toruru ogo ịza ajụjụ n’onwe ya, ọ bụghị n’ogologo ahụ. Ịgbakwunye “ịza ajụjụ n’onwe ya” na-eme ka akpaalaokwu ahụ doo onye Igbo anya n’ọnọdụ ajụjụ ọnụ a.
- source_word: αὐτὸς περὶ ἑαυτοῦ λαλήσει
  choice: Ya onwe ya ga-ekwu maka onwe ya
  rationale: “Ya onwe ya” na-echekwa nkwusi ike nke αὐτός; “maka onwe ya” na-anọchi περί ἑαυτοῦ, ebe “ga-ekwu” na-echekwa ọdịnihu nke λαλήσει n’enweghị ịgbanwe ya ozugbo ka ọ bụrụ naanị okwu ikike.
theological_decisions:
- issue: Ihe ἡλικίαν ἔχει pụtara n’ọnọdụ a
  choice: Ọ toruola ogo ịza ajụjụ n’onwe ya
  alternative: Ọ bụ dimkpa; ma ọ bụ ọ toruola n’ozuzu
  rationale: Ajụjụ ndị ọchịchị na-atụ na ụjọ ndị mụrụ ya na-egosi na okwu a gbasara ikike na ibu ọrụ nke ịza maka onwe ya, ọ bụghị ogologo ahụ ya.
- issue: Ike okwu αὐτὸς περὶ ἑαυτοῦ λαλήσει
  choice: Ya onwe ya ga-ekwu maka onwe ya
  alternative: O nwere ike ikwuchitere onwe ya
  rationale: A họọrọ ọdịnihu “ga-ekwu” iji chekwaa ụdị okwu Grik na nkwusi ike dị na αὐτός, ebe ndetu ala na-egosi na ọdịnihu ahụ nwekwara ike ịbụ nkwupụta bara uru banyere ikike ma ọ bụ ibu ọrụ ya ịza.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta mee ntụgharị ahụ. E chekwara nkwughachi “anyị amaghị” na nkwusi ike “Ya onwe ya,” ma zere okwu iwu siri ike nke nwere ike ime ka ihe ederede kwuru karịa isi mmalite Grik.
