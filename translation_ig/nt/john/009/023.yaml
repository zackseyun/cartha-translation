  text: διὰ τοῦτο οἱ γονεῖς αὐτοῦ εἶπαν ὅτι Ἡλικίαν ἔχει, αὐτὸν ⸀ἐπερωτήσατε.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/023.yaml
  text: For this reason his parents said[a], “He is of age; ask him.”
translation:
  language: ig
  text: Ọ bụ ya mere nne na nna ya ji sị, “O tozuru oke[a]; unu jụọ ya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “O toruola afọ; unu jụọ ya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Ọ bụ ya mere
  rationale: Nkebiokwu a na-ezo azụ n’ihe a kọwara n’amaokwu nke 22 ma na-egosi ihe kpatara nne na nna ya ji kwuo okwu ahụ.
- source_word: οἱ γονεῖς αὐτοῦ
  choice: nne na nna ya
  rationale: Nke a bụ ụzọ Igbo doro anya ma bụrụkwa nke a na-ejikarị ekwu banyere ndị mụrụ mmadụ.
- source_word: εἶπαν
  choice: ji sị
  rationale: Ọ na-enye ihe λέγω pụtara n’ụzọ nkịtị, n’etinyeghị echiche ọzọ dịka ‘zara’ nke okwu Grik ahụ ekwughị kpọmkwem.
- source_word: Ἡλικίαν ἔχει
  choice: O toruola mmadụ ịza ajụjụ
  rationale: Akpaalaokwu Grik a pụtara na nwoke ahụ eruola afọ ma nwee ike ịza ajụjụ n’onwe ya. Nsụgharị a na-eme ka echiche ahụ doo onye Igbo nke oge a anya n’ejighị okwu iwu siri ike.
- source_word: αὐτὸν
  choice: ya
  rationale: Nnọchiaha a na-ezo aka n’ụzọ pụtara ìhè n’ebe nwoke ahụ kpuru ìsì na mbụ nọ dịka onye kwesịrị ịza.
- source_word: ἐπερωτήσατε
  choice: jụọ
  rationale: Ọ bụ iwu ka ndị ahụ tụgharịa ajụjụ ha n’ebe nwoke ahụ nọ; ‘jụọ’ bụ okwu Igbo dị mfe ma kwekọọ n’ọnọdụ a.
theological_decisions: []
translation_notes:
  register: Ejiri Standard Igbo dị ugbu a, dị mfe ma nwee ugwu. E chekwara njikọ kpatara ihe dị na διὰ τοῦτο, ebe a sụgharịrị akpaalaokwu Ἡλικίαν ἔχει n’ụzọ ga-eme ka onye na-agụ ya ghọta na nwoke ahụ eruola ịza n’onwe ya.
