  text: λέγουσιν ⸀οὖν τῷ τυφλῷ πάλιν· ⸂Τί σὺ⸃ λέγεις περὶ αὐτοῦ, ὅτι ἠνέῳξέν σου τοὺς ὀφθαλμούς; ὁ δὲ εἶπεν ὅτι Προφήτης ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/017.yaml
  text: So they said again to the blind man[a], “What do you say about him, since he opened your eyes?” And he said[c][b], “He is a prophet.”
translation:
  language: ig
  text: Ya mere, ha wee jụọ nwoke ahụ kpuru ìsì ọzọ, sị, “Gịnị ka gị onwe gị[a] na-ekwu banyere ya, ebe ọ bụ na[b] o meghere anya gị?” Ọ sịrị, “Ọ bụ onye amụma[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Okwu Grik ahụ kwuru “gị” hoo haa iji mesie ya ike; ya bụ, “Gịnị ka gị onwe gị na-ekwu banyere ya?”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “n’ihi na.”
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “Ọ bụ Onye Amụma.” A pụrụ ịghọta okwu Grik ahụ dị ka aha-ọkwa, ma ihe gbara ya gburugburu kwekwara ka ọ pụta “onye amụma.”
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: Ya mere
  rationale: Ọ na-egosi na ajụjụ a sitere n’ihe ndị mere na mkparịta ụka gara aga, ma na-edobe njikọ echiche nke okwu Grik ahụ.
- source_word: τῷ τυφλῷ
  choice: nwoke ahụ kpuru ìsì
  rationale: Okwu nkọwa Grik a na-arụ ọrụ dị ka aha. Nsụgharị a bụ okwu Igbo doro anya nke na-egosi otú ndị na-ajụ ya si akpọpụta ya n’akụkọ ahụ, n’agbanyeghị na e meghere anya ya.
- source_word: πάλιν
  choice: jụkwara
  rationale: Mgbakwunye ‘-kwa’ na ngwaa ahụ na-egosi na ha jụrụ ya ọzọ, ma na-eme ka ahịrịokwu ahụ daa nke ọma n’Igbo.
- source_word: Τί σὺ λέγεις
  choice: Gịnị ka gị onwe gị na-ekwu
  rationale: ‘Gị onwe gị’ na-ebupụta nkwusi ike dị n’okwu Grik σὺ, na-egosikwa na ha chọrọ echiche nwoke ahụ n’onwe ya.
- source_word: περὶ αὐτοῦ
  choice: banyere ya
  rationale: Nke a bụ ụzọ Igbo dị ugbu a ma doo anya isi kwuo ‘concerning/about him.’
- source_word: ὅτι
  choice: ebe ọ bụ na
  rationale: N’ebe a, ὅτι nwere ike igosi ihe mere ha ji jụọ ajụjụ ahụ. ‘Ebe ọ bụ na’ na-enye echiche a n’ụzọ dị nro ma dị mma n’Igbo.
- source_word: ἠνέῳξέν σου τοὺς ὀφθαλμούς
  choice: o meghere anya gị
  rationale: Nke a na-edobe ihe oyiyi na oge omume nke okwu Grik ahụ n’ụzọ nkịtị ma doo anya.
- source_word: Προφήτης
  choice: onye amụma
  rationale: Okwu a na-akọwa Jizọs dị ka otu onye amụma, n’ebughị ụzọ mee ya aha-ọkwa pụrụ iche nke ederede ahụ na-akọwaghị hoo haa.
theological_decisions:
- issue: Ma Προφήτης ọ̀ bụ aha-ọkwa pụrụ iche ka ọ̀ bụ aha nkịtị
  choice: onye amụma
  alternative: Onye Amụma
  rationale: Ihe gbara amaokwu ahụ gburugburu na-egosi na nwoke ahụ na-amalite ịghọta onye Jizọs bụ. ‘Onye amụma’ na-echekwa ọganihu akụkọ a, ghara itinye nkwupụta banyere Mezaịa karịa ihe okwu Grik chọrọ.
translation_notes:
  register: Ejiri Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. A hapụrụ ajụjụ ahụ n’ụdị okwu ọnụ nke dabara n’ajụjụ ndị ọchịchị okpukpe na-ajụ nwoke ahụ, ma e chekwara nkwusi ike dị na σὺ na mgbagwoju anya dị na ὅτι na Προφήτης site n’ihe odide na nkọwa ala peeji.
