revisions:
- from: Ya mere, ha jụkwara nwoke ahụ kpuru ìsì, sị, “Gịnị ka gị onwe gị[a] na-ekwu banyere ya, ebe ọ bụ na o meghere anya gị[b]?” Ọ zara, sị, “Ọ bụ onye amụma[c].”
  to: Ya mere, ha wee jụọ nwoke ahụ kpuru ìsì ọzọ, sị, “Gịnị ka gị onwe gị[a] na-ekwu banyere ya, ebe ọ bụ na[b] o meghere anya gị?” Ọ sịrị, “Ọ bụ onye amụma[c].”
  rationale: The revision explicitly renders πάλιν with ọzọ, uses the less interpretively specific Ọ sịrị for εἶπεν, and relocates the causal-alternative footnote marker to the phrase it qualifies. It preserves the Greek emphasis on σὺ and preserves the contextual ambiguity of Προφήτης.
