  text: ἦν δὲ σάββατον ⸂ἐν ᾗ ἡμέρᾳ⸃ τὸν πηλὸν ἐποίησεν ὁ Ἰησοῦς καὶ ἀνέῳξεν αὐτοῦ τοὺς ὀφθαλμούς.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/014.yaml
  text: It was a Sabbath on the day when Jesus made the mud and opened his eyes.
translation:
  language: ig
  text: Ụbọchị ahụ Jizọs mere apịtị[a] ma meghee anya ya[b] bụ ụbọchị Sabat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “ụrọ.”
    reason: lexical_alternative
  - marker: b
    text: N’asụsụ Grik, e kwuru kpọmkwem, “meghee anya ya”; okwu a na-akọwa ọgwụgwọ ahụ n’ụzọ kpọmkwem.
    reason: lexical_alternative
lexical_decisions:
- source_word: σάββατον
  choice: ụbọchị Sabat
  rationale: Nke a na-akọwa otu ụbọchị Sabat n'ụzọ doro anya ma na-edebe ihe gbasara kalenda na esemokwu ga-esochi, n'etinyeghị nkọwa banyere iwu Sabat.
- source_word: ἐν ᾗ ἡμέρᾳ
  choice: Ụbọchị ahụ ... bụ
  rationale: Usoro a bụ Igbo nkịtị maka ime ka ụbọchị ihe ahụ mere pụta ìhè, kama ịsụgharị ahịrịokwu Grik ahụ n'ụzọ siri ike.
- source_word: πηλόν
  choice: apịtị
  rationale: N'okwu gbara ya gburugburu, Jizọs gwakọtara asọ na ala; “apịtị” bụ okwu Igbo nkịtị ma doo anya. “Ụrọ” ka bụ ụzọ ọzọ a pụrụ isi ghọta ya.
- source_word: ἐποίησεν
  choice: mere
  rationale: “Mere” na-egosipụta omume ποιέω n'ụzọ dị mfe ma kwekọọ n'otú Igbo si ekwu maka ime apịtị.
- source_word: ἀνέῳξεν αὐτοῦ τοὺς ὀφθαλμούς
  choice: meghee anya ya
  rationale: Nke a na-edebe okwu ahụ kpọmkwem banyere imeghe anya kama ịgbanwe ya ka ọ bụrụ nkọwa dịka “weghachiri ọhụụ ya.”
- source_word: δὲ
  choice: (egosighị ya iche)
  rationale: δὲ bụ njikọ akụkọ dị nro; nhazi ahịrịokwu Igbo na-eburu mgbanwe ahụ nke ọma n'enweghị okwu mgbakwunye dịka “ugbu a” ma ọ bụ njikọ na-egosi mmegide siri ike.
theological_decisions:
- issue: Aha Sabat n'ihe metụtara ọgwụgwọ Jizọs
  choice: 'A sụgharịrị ya dị ka nkọwa oge nkịtị: ụbọchị ahụ bụ ụbọchị Sabat.'
  alternative: Ịgbakwunye nkọwa banyere ma ọgwụgwọ ahụ ò megidere iwu Sabat.
  rationale: Amaokwu a na-enye naanị eziokwu nke na-akwadebe esemokwu ga-esochi; ya mere, a hapụrụ esemokwu nkà mmụta okpukpe ahụ ka akụkọ ahụ n'onwe ya gosipụta ya.
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe nke oge a, dị mfe ma nwee ugwu. E ji “ụbọchị Sabat” mee ka aha ụbọchị okpukpe ahụ doo anya, ma e jighị okwu ụka pụrụ iche ma ọ bụ nkọwa otu okpukpe tinye ya.
