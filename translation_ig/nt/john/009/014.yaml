  verdict: revise
  source_fidelity: The sentence accurately conveys the temporal notice, Jesus' making of the mud, and the concrete expression that he opened the man's eyes. The bare Igbo phrase “ụbọchị Sabat” naturally renders the Greek anarthrous σάββατον without forcing either an indefinite or definite article. The pronoun in “anya ya” appropriately retains the contextual reference and does not add interpretation.
  naturalness: The main text is clear, idiomatic Standard Igbo, and its topical order (“Ụbọchị ahụ ... bụ ụbọchị Sabat”) is natural. Footnote b, however, uses “okwu a na-ahụ anya,” which is an awkward calque for “concrete expression” and can be stated more naturally.
  terminology: “Apịtị” is a suitable modern term for πηλός, with “ụrọ” as a useful lexical alternative. “Ụbọchị Sabat” appropriately preserves the Sabbath reference without commentary. “Meghee anya ya” maintains the source's bodily, concrete wording.
