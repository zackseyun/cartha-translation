source:
  edition: SBLGNT
  text: ⸀ἤκουσαν ἐκ τῶν Φαρισαίων ταῦτα οἱ ⸂μετ’ αὐτοῦ ὄντες⸃, καὶ εἶπον αὐτῷ· Μὴ καὶ ἡμεῖς τυφλοί ἐσμεν;
base_translation:
  language: en
  yaml_path: translation/nt/john/009/040.yaml
  text: Some of the Pharisees who were with him heard these things and said to him[a], “Surely we are not blind too, are we?”
translation:
  language: ig
  text: Ụfọdụ n’ime ndị Farisii ndị nọnyere ya nụrụ ihe ndị a, sị ya, “Anyị onwe anyị abụghịkwa ndị ìsì, ọ̀ bụghị ya?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Ọ̀ bụghịkwa na anyị bụ ndị ìsì?” Ajụjụ Greek ji μή, nke na-atụ anya azịza “mba.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤκουσαν
  choice: nụrụ
  rationale: Aorist ἀκούω n’akụkọ a pụtara na okwu Jizọs rutere ha ntị; “nụrụ” bụ okwu Igbo nkịtị kwesịrị ekwesị.
- source_word: ἐκ τῶν Φαρισαίων
  choice: Ụfọdụ n’ime ndị Farisii
  rationale: ἐκ na genitive na-egosi akụkụ nke ìgwè ahụ, ọ bụghị ndị Farisii niile.
- source_word: ταῦτα
  choice: ihe ndị a
  rationale: Nke a na-edebe plural demonstrative ma na-ezo aka n’ihe Jizọs kwuru tupu mgbe ahụ n’etinyeghị nkọwa karịrị ederede.
- source_word: οἱ μετ’ αὐτοῦ ὄντες
  choice: ha na ya nọ
  rationale: Nkebi a na-akọwa ndị Farisii ahụ dịnyere ya mgbe ahụ; nsụgharị a bụ Igbo dị mfe ma na-edebe echiche nke ịnọnyere ya.
- source_word: εἶπον αὐτῷ
  choice: sị ya
  rationale: Nke a bụ ụzọ Igbo sitere n’okike isi webata okwu kpọmkwem, ebe ọdịdị ajụjụ ahụ pụtara ìhè n’okwu e hotara.
- source_word: Μὴ
  choice: Ọ̀ bụ na ...?
  rationale: Ajụjụ μή na-atụ anya azịza na-adịghị mma. Usoro Igbo “Ọ̀ bụ na...?” n’ọnọdụ a na-egosipụta ihe ijuanya na olileanya ha na azịza ya ga-abụ mba, na-agbakwụnyeghị okwu siri ike karịa Greek.
- source_word: καὶ
  choice: bụkwa
  rationale: '“-kwa” na-ejikọta “anyị” na ndị ìsì a kpọtụrụla aha: anyị kwa.'
- source_word: ἡμεῖς
  choice: anyị onwe anyị
  rationale: Greek tinyere pronoun ahụ n’ụzọ nwere nkwusi ike; “anyị onwe anyị” na-egosipụta nkwusi ike ahụ n’Igbo.
- source_word: τυφλοί
  choice: ndị ìsì
  rationale: A hapụrụ okwu ahụ n’enweghị mgbakwunye “n’ime mmụọ” ka a ghara idozi ihe atụ na ihe ọchị miri emi nke Jọn n’ime nsụgharị.
- source_word: ἐσμεν
  choice: bụ
  rationale: Copula present tense a na-asụkarị n’Igbo bụ “bụ.”
theological_decisions:
- issue: Ma a ga-eme ka ihe atụ dị na τυφλοί pụta ìhè
  choice: Jiri “ndị ìsì” n’etinyeghị “n’ime mmụọ”
  alternative: ndị ìsì n’ime mmụọ
  rationale: Ihe ndị gbara amaokwu ahụ gburugburu na-egosi na ìsì a bụ ihe atụ, ma Greek akọwaghị adjective ahụ. Ịhapụ ya ka ọ bụrụ “ndị ìsì” na-edebe nghọta abụọ na ihe ọchị miri emi nke akụkọ Jọn.
- issue: Ike ajụjụ μή
  choice: Jiri ajụjụ “Ọ̀ bụ na...?” ma kọwaa olileanya azịza na footnote
  alternative: “N’ezie, anyị abụghịkwa ndị ìsì, ka anyị bụ?”
  rationale: Ụdị a na-ada ka Igbo e ji eme ihe ma na-edebe ajụjụ na-atụ anya “mba” n’etinyeghị “n’ezie” nke nwere ike ime ka ụda okwu sie ike karịa isi mmalite.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E jiri “ndị Farisii” mee aha ìgwè ahụ; e debere okwu “ndị ìsì” n’enweghị nkọwa agbakwunyere ka nghọta ihe atụ dịrị n’ọnọdụ ya. Akara footnote [a] dị ozugbo n’azụ ajụjụ ahụ.
