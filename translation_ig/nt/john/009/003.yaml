source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς· Οὔτε οὗτος ἥμαρτεν οὔτε οἱ γονεῖς αὐτοῦ, ἀλλ’ ἵνα φανερωθῇ τὰ ἔργα τοῦ θεοῦ ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/003.yaml
  text: Jesus answered[a], “Neither this man sinned, nor his parents[c][b], but so that the works of God might be revealed in him.”
translation:
  language: ig
  text: Jizọs zara, “Ọ bụghị nwoke a mere mmehie, ọ bụghịkwa ndị mụrụ ya; kama, ọ bụ ka e wee mee ka ọrụ Chineke pụta ìhè n’ime ya.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ akụkụ ikpeazụ ya, “kama ka e wee mee ka ọrụ Chineke pụta ìhè site na ya.” Grik kwuru kpọmkwem “n’ime ya,” nke nwekwara ike igosi onye e ji mee ka ọrụ Chineke pụta ìhè.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: zara
  rationale: Nke a bụ okwu Igbo a na-ejikarị akọ nzaghachi n’ime mkparịta ụka.
- source_word: Οὔτε ... οὔτε
  choice: Ọ bụghị ... ọ bụghịkwa
  rationale: Ọ na-egosipụta ịjụ nhọrọ abụọ ahụ nke ọma ma na-ada ka Igbo eke.
- source_word: οὗτος
  choice: nwoke a
  rationale: Ọ na-eme ka onye a na-ekwu banyere ya doo anya dịka ihe ndị gbara amaokwu ahụ gburugburu si gosi.
- source_word: ἥμαρτεν
  choice: mere mmehie
  rationale: Nke a bụ nsụgharị Igbo doro anya ma dị mfe maka omume ime mmehie.
- source_word: γονεῖς
  choice: ndị mụrụ ya
  rationale: Ọ bụ ụzọ Igbo eke si akọwa nne na nna mmadụ ọnụ.
- source_word: ἀλλ’ ἵνα
  choice: kama, ọ bụ ka e wee
  rationale: Ọ na-edobe nkwụsị na echiche nzube nke ἵνα, ma tinye naanị ntakịrị okwu dị mkpa ka ahịrịokwu ahụ bụrụ Igbo zuru oke.
- source_word: φανερωθῇ
  choice: mee ka ... pụta ìhè
  rationale: Ọ na-echekwa echiche nke ime ka ihe a na-ahụghị anya pụta ìhè, nakwa ụdị okwu nnara nke Grik.
- source_word: τὰ ἔργα τοῦ θεοῦ
  choice: ọrụ Chineke
  rationale: Ọ bụ nsụgharị kwụ ọtọ, eke, nke na-edobe okwu Jọn banyere ọrụ Chineke.
- source_word: ἐν αὐτῷ
  choice: n’ime ya
  rationale: Ọ na-esochi ἐν αὐτῷ nso ma na-ahapụ ohere nghọta dị n’etiti ‘n’ime ya’ na ‘site n’aka ya.’
theological_decisions:
- issue: Ma Jizọs ọ na-ajụ njikọ niile dị n’etiti mmehie na nhụjuanya, ka ọ na-ajụ naanị na mmehie nwoke a ma ọ bụ nke ndị mụrụ ya kpatara ọnọdụ a.
  choice: E depụtara ịjụ ahụ kpọmkwem banyere nwoke a na ndị mụrụ ya.
  alternative: Ịsụgharị ya dịka iwu zuru ụwa ọnụ na nhụjuanya ọ bụla enweghị njikọ na mmehie.
  rationale: Amaokwu ahụ na-aza ajụjụ a kapịrị ọnụ nke ndị na-eso ụzọ, ọ naghị ekwupụta iwu zuru ụwa ọnụ banyere nhụjuanya niile.
- issue: Ma ἵνα na-egosi nzube ka ọ bụ naanị ihe si na ya pụta.
  choice: E ji okwu nzube ‘ọ bụ ka e wee’ sụgharịa ya.
  alternative: ‘nke mere ka’ ma ọ bụ ịgbanwe akara ahịrịokwu iji zere echiche nzube.
  rationale: ἵνα na subjunctive na-egosikarị nzube ebe a; nsụgharị ahụ na-edobe esemokwu nkà mmụta okpukpe dị na ya n’ebughị ụzọ kọwaa ihe odide ahụ karịa ka o kwuru.
- issue: Ma ἐν αὐτῷ pụtara ‘n’ime ya’ ka ọ bụ ‘site n’aka ya.’
  choice: n’ime ya
  alternative: site n’aka ya
  rationale: ‘N’ime ya’ bụ nke kacha nso n’okwu Grik ma na-echekwa nghọta abụọ ahụ n’akọwaghị otu dịka naanị nke ziri ezi.
translation_notes:
  register: Igbo Izugbe dị ugbu a, dị ùgwù ma dị mfe nghọta. A họọrọ ‘ndị mụrụ ya’ kama okwu mbinye ‘nne na nna,’ ma jiri ‘pụta ìhè’ mee ka echiche φανερόω bụrụ nke a na-aghọta ngwa ngwa. Akara nkọwa [a] dị n’isiokwu ahụ ma kwekọọ na nkọwa ala peeji.
