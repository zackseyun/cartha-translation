  yaml_path: translation/nt/john/009/005.yaml
  text: While I am in the world, I am the light of the world.
translation:
  language: ig
  text: Mgbe m nọ n’ụwa, abụ m ìhè nke ụwa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅταν
  choice: Mgbe
  rationale: N’ebe a, ọ na-egosi oge ma ọ bụ ọnọdụ—‘mgbe m nọ n’ụwa’—n’enweghị ịgbakwunye echiche ọzọ.
- source_word: κόσμος
  choice: ụwa
  rationale: ‘Ụwa’ bụ okwu Igbo doro anya ma kwekọọ na κόσμος n’ahịrịokwu abụọ ahụ.
- source_word: φῶς
  choice: ìhè
  rationale: ‘Ìhè’ na-eburu ihe atụ Jọn ji kọwaa Jizọs n’ụzọ eke na Igbo.
- source_word: εἰμι
  choice: abụ m
  rationale: Nke a na-asụgharị nkwupụta ịdị adị ahụ kpọmkwem ma n’ụzọ Igbo na-aga nke ọma.
theological_decisions:
- issue: Ihe ὅταν pụtara n’ihe gbasara oge Jizọs nọ n’ụwa
  choice: Mgbe m nọ n’ụwa
  alternative: Mgbe ọ bụla m nọ n’ụwa
  rationale: ‘Mgbe’ na-echekwa echiche oge ma na-ezere ime ka okwu ahụ bụrụ nkwupụta banyere ọtụtụ oge ọ ga-abịa n’ụwa; ọ kwekọrọ na ọnọdụ okwu ahụ na Jọn 9.
translation_notes:
  register: Asụsụ Igbo Izugbe dị mfe, dị ugwu, ma kwekọọ n’usoro okwu nkịtị. E debere nkwughachi ‘ụwa’ iji chekwaa ike na nhazi nke okwu Grik.
