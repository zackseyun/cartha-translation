  text: Ἄγουσιν αὐτὸν πρὸς τοὺς Φαρισαίους τόν ποτε τυφλόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/013.yaml
  text: They brought the man who had formerly been blind to the Pharisees[a].
translation:
  language: ig
  text: Ha kpọgara nwoke ahụ bụ onye kpuru ìsì na mbụ n’ebe ndị Farisii nọ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ịsụ ya: “Ha kpọgara n’ebe ndị Farisii nọ nwoke ahụ bụ onye kpuru ìsì n’oge gara aga.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄγουσιν
  choice: Ha kpọgara
  rationale: Oge dị ugbu a n’asụsụ Grik bụ historical present n’akụkọ a; oge gara aga dabara n’Igbo ma na-egosi na ha duuru ya gaa n’ebe ndị Farisii nọ.
- source_word: αὐτὸν
  choice: nwoke ahụ
  rationale: Ọ bụ ezie na okwu Grik pụtara ‘ya,’ ịkpọ ya ‘nwoke ahụ’ na-eme ka onye a na-ekwu maka ya doo anya ma kwekọọ na nkebi na-esote.
- source_word: πρὸς τοὺς Φαρισαίους
  choice: n’ebe ndị Farisii nọ
  rationale: πρός tinyere accusative na-egosi ngagharị gaa n’ebe mmadụ nọ; nke a bụ ụzọ Igbo si ekwu ya n’ụzọ ebumpụta ụwa.
- source_word: Φαρισαίους
  choice: ndị Farisii
  rationale: Nke a bụ nsụgharị aha otu ahụ a na-ejikarị eme ihe n’Igbo.
- source_word: τόν ποτε τυφλόν
  choice: nwoke ahụ bú onye kpuru ìsì na mbụ
  rationale: 'Nkebi ahụ na-arụ ọrụ dị ka aha: onye bụbu onye ìsì. Usoro a na-eme ka o doo anya na ikpu ìsì bụ ọnọdụ ya n’oge gara aga, ọ bụghị ọnọdụ ya ugbu a.'
- source_word: ποτε
  choice: na mbụ
  rationale: N’ebe a ọ pụtara ‘n’oge gara aga’ ma na-egosi ọdịiche dị n’etiti ọnọdụ nwoke ahụ gara aga na ọnọdụ ya ugbu a.
- source_word: τυφλόν
  choice: kpuru ìsì
  rationale: Nke a bụ okwu Igbo ebumpụta ụwa maka ọnọdụ enweghị ike ịhụ ụzọ.
theological_decisions: []
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji ‘kpọgara’ mee ka ngagharị ahụ pụta ìhè, ma e debere ọdịiche dị n’etiti ikpu ìsì ya n’oge gara aga na ọnọdụ ya ugbu a.
