review_pass:
  verdict: revise
  source_fidelity: Isi ederede na-ewepụta nke ọma ‘o kwuru,’ ‘Ekwere m,’ na omume προσκυνέω. Ma ‘Onyenwe anyị’ e kewara ekewa nwere ike ịpụta ‘our Lord’ n’ụzọ a na-adịghị eke, ebe aha nsọpụrụ Igbo a na-ahụkarị maka ‘Lord’ bụ ‘Onyenweanyị.’ Nkọwa ala peeji a kpọrọ ‘Nna anyị ukwu’ adịghị anọchi anya ‘Sir’ n’ụzọ ziri ezi.
  naturalness: ‘Ọ sịrị, “Ekwere m, Onyenweanyị.” O wee fee ya ofufe.’ bụ Igbo Izugbe dị mfe, dị ùgwù, ma na-agụ nke ọma. ‘Nna ukwu’ bụ nhọrọ okike karịa maka ụzọ nkwanye ùgwù ‘Sir’ karịa ‘Nna anyị ukwu.’
  terminology: ‘Onyenweanyị’ dabara n’ọrụ a dị ka aha nsọpụrụ dị elu maka κύριε, ma ‘fee ya ofufe’ na-anọchi προσκυνέω n’ụzọ dabara na ọnọdụ ahụ. Nkọwa ala peeji na-echekwa nhọrọ ‘nna ukwu’ na ‘kpọọ isiala n’ihu ya’ n’enweghị ịmanye otu nghọta okpukpe.
  issues:
  - severity: medium
    issue: ‘Onyenwe anyị’ na ‘Nna anyị ukwu’
    rationale: Ide ‘Onyenwe anyị’ iche nwere ike ịda dịka nkebiokwu nwere onye-nwe ọtụtụ (‘our Lord’), ebe ‘Onyenweanyị’ bụ aha nsọpụrụ e guzobere n’Igbo maka ‘Lord.’ Ọzọkwa, ‘Nna anyị ukwu’ abụghị ụzọ nkịtị e si asụgharị adreesị nkwanye ùgwù ‘Sir’; ‘Nna ukwu’ ka dabara.
  - severity: low
    issue: Nhọrọ ‘kpọọrọ ya isiala’ n’ala peeji
    rationale: ‘Kpọọ isiala n’ihu ya’ bụ okwu Igbo doro anya ma dịkwa okike karịa maka omume ịkpọ isi ala/prostration.
  revised_text: Ọ sịrị, “Ekwere m, Onyenweanyị.” O wee fee ya ofufe.
