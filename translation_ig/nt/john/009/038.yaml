translation:
  language: ig
  text: Ọ sịrị, “Ekwere m, Onyenweanyị.” O wee fee ya ofufe.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δὲ
  choice: Ọ
  rationale: Akụkụ okwu a na-arụ ọrụ dị ka nnọchiaha, na-ezo aka n nwoke ahụ a gwọrọ; δέ anaghị achọ okwu na-egosi nnukwu mmegide n'Igbo ebe a.
- source_word: ἔφη
  choice: sịrị
  rationale: Nke a bụ ụzọ nkịtị na nke doro anya e si webata okwu mmadụ kwuru n'akụkọ.
- source_word: Πιστεύω
  choice: Ekwere m
  rationale: Nke a na-echekwa okwu Jọn ji ekwu banyere ikwere, ma bụrụkwa azịza kpọmkwem nye ihe Jizọs mere ka nwoke ahụ mata.
- source_word: κύριε
  choice: Onyenwe anyị
  rationale: N'ọnọdụ a, okwu nkwupụta okwukwe na ofufe sochiri ya mere ka aha nsọpụrụ a nwee ibu karịa naanị ‘Nna anyị ukwu,’ ọ bụ ezie na ihe ahụ ka ga-ekwe omume n'okwu Grik.
- source_word: προσεκύνησεν
  choice: fee ya ofufe
  rationale: Ngwaa Grik ahụ pụrụ ịpụta ịkpọ isiala ma ọ bụ inye nsọpụrụ, ma n'ọnọdụ a—mgbe nwoke ahụ kwupụtachara okwukwe ya n'ebe Jizọs nọ—‘fee ya ofufe’ na-egosipụta ihe o yikarịrị ka ọ pụtara.
- source_word: αὐτῷ
  choice: ya
  rationale: Nnọchiaha a na-ezo aka na Jizọs, bụrụkwa onye nwoke ahụ fere ofufe.
theological_decisions:
- issue: Ma κύριε ọ̀ bụ naanị aha nkwanye ùgwù ka ọ̀ bụ ‘Onyenwe anyị’ nwere ibu nke nkwupụta okwukwe
  choice: Onyenwe anyị
  alternative: Nna anyị ukwu
  rationale: Ọnọdụ gbara amaokwu ahụ gburugburu na-eru n'ókè nke nkwupụta okwukwe na ofufe; ya mere ‘Onyenwe anyị’ dabara nke ọma, ebe nkọwa ala peeji na-echekwa ihe ọzọ okwu Grik ahụ pụrụ ịpụta.
- issue: Ma προσεκύνησεν kwesịrị ịbụ ‘fee ya ofufe’ ka ọ̀ bụ omume ịkpọ isiala/inye nsọpụrụ
  choice: fee ya ofufe
  alternative: kpọọrọ ya isiala / nyere ya nsọpụrụ
  rationale: Onye e mere ihe a bụ Jizọs, omume ahụ sokwa nkwupụta ‘Ekwere m’; nke a na-akwado ‘ofufe,’ ma okwu Grik ahụ ka nwere obosara pụtara ihe e depụtara n'ala peeji.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E jiri ‘O wee’ mee ka usoro omume abụọ ahụ pụta nke ọma, ma zere nkọwa ụka nke otu òtù.
