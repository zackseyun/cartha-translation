revisions:
- from: Ya mere, ụfọdụ n’ime ndị Farisii nọ na-ekwu, “Nwoke a esiteghị n’ebe Chineke nọ, n’ihi na ọ naghị edebe ụbọchị izu ike.” Ma ndị ọzọ nọ na-ekwu, “Olee otú nwoke mmehie[a] ga-esi nwee ike ime ihe ịrịba ama ndị dị otu a[b]?” Nkewa dịkwa n’etiti ha.
  to: Ya mere, ụfọdụ n’ime ndị Farisii nọ na-ekwu, “Nwoke a esiteghị n’ebe Chineke nọ, n’ihi na ọ naghị edebe ụbọchị izu ike.” Ma ndị ọzọ nọ na-ekwu, “Olee otú nwoke bụ onye mmehie[a] ga-esi nwee ike ime ihe ịrịba ama dị otu a[b]?” Nkewa dịkwa n’etiti ha.
