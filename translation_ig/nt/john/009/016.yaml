id: JHN.9.16
reference: John 9:16
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἔλεγον οὖν ἐκ τῶν Φαρισαίων τινές· ⸂Οὐκ ἔστιν οὗτος παρὰ θεοῦ ὁ ἄνθρωπος⸃, ὅτι τὸ σάββατον οὐ τηρεῖ. ⸀ἄλλοι ἔλεγον· Πῶς δύναται ἄνθρωπος ἁμαρτωλὸς τοιαῦτα σημεῖα ποιεῖν; καὶ σχίσμα ἦν ἐν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/016.yaml
  text: So some of the Pharisees were saying[a], “This man is not from God, because he does not keep the Sabbath.” But others were saying[b], “How can a sinful man do such signs?” And there was a division among them.
translation:
  language: ig
  text: Ya mere, ụfọdụ n’ime ndị Farisii nọ na-ekwu, “Nwoke a esiteghị n’ebe Chineke nọ, n’ihi na ọ naghị edebe ụbọchị izu ike.” Ma ndị ọzọ nọ na-ekwu, “Olee otú nwoke bụ onye mmehie[a] ga-esi nwee ike ime ihe ịrịba ama dị otu a[b]?” Nkewa dịkwa n’etiti ha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, ‘onye mmehie.’ N’asụsụ Grik, okwu ahụ bụ adjective na-akọwa ‘nwoke.’
    reason: lexical_alternative
  - marker: b
    text: Jọn na-ejikarị ‘ihe ịrịba ama’ akọwa ọrụ Jizọs iji gosi ihe ọrụ ndị ahụ na-ekpughe; a pụkwara ịsụgharị ya ‘ihe ịrịba ama dị ebube.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγον ... τινές
  choice: ụfọdụ ... nọ na-ekwu
  rationale: Ụdị ngwaa imperfect na-egosi okwu na-aga n’ihu n’oge ahụ; ‘nọ na-ekwu’ na-egosipụta nke a n’Igbo nke ọma.
- source_word: οὖν
  choice: Ya mere
  rationale: Ọ na-ejikọta okwu a na ihe bu ya ụzọ ma na-egosi ihe si na ya pụta.
- source_word: ἐκ τῶν Φαρισαίων
  choice: n’ime ndị Farisii
  rationale: Nke a na-egosi na ọ bụ ụfọdụ sitere n’etiti ìgwè ndị Farisii.
- source_word: οὗτος ... ὁ ἄνθρωπος
  choice: Nwoke a
  rationale: Ọ na-echekwa ntụaka kpọmkwem nye nwoke ahụ na ike demonstrative dị na οὗτος.
- source_word: παρὰ θεοῦ
  choice: esiteghị n’ebe Chineke nọ
  rationale: Ọ na-egosi isi mmalite, ‘site n’ebe Chineke nọ,’ n’etinyeghị echiche ọzọ nke ‘Chineke zitere ya.’
- source_word: τηρεῖ
  choice: edebe
  rationale: ‘Idebe’ bụ okwu Igbo doro anya maka ịgbaso ma ọ bụ ịsọpụrụ iwu gbasara ụbọchị izu ike.
- source_word: τὸ σάββατον
  choice: ụbọchị izu ike
  rationale: Nke a bụ aha Igbo a na-aghọta nke ọma maka Sabbath, ụbọchị ndị Juu ji ez休 ike dịka iwu si dị.
- source_word: ἄλλοι
  choice: ndị ọzọ
  rationale: Ọ na-egosi ìgwè nke ọzọ n’ụzọ dị mfe ma doo anya.
- source_word: Πῶς δύναται
  choice: Olee otú ... ga-esi nwee ike
  rationale: Nke a na-echekwa ajụjụ banyere ikike ma ọ bụ ohere ime ihe ahụ.
- source_word: ἁμαρτωλὸς
  choice: nwoke mmehie
  rationale: Ọ na-echekwa adjective Grik nke na-akọwa ‘nwoke,’ kama ịgbanwe ya ozugbo ka ọ bụrụ naanị aha ‘onye mmehie.’
- source_word: τοιαῦτα σημεῖα
  choice: ihe ịrịba ama ndị dị otu a
  rationale: ‘Ihe ịrịba ama’ na-echekwa okwu Jọn ji egosi ọrụ ndị na-ekpughe ihe karịrị ọrụ ebube ahụ n’onwe ya.
- source_word: σχίσμα
  choice: nkewa
  rationale: Ọ na-egosi nkewa echiche na mgbawa dị n’etiti ha n’asụsụ Igbo dị mfe.
theological_decisions:
- issue: Nsụgharị σημεῖα n’Oziọma Jọn
  choice: ihe ịrịba ama
  alternative: ọrụ ebube; ihe ịrịba ama dị ebube
  rationale: Jọn na-eji okwu a egosi na ọrụ ahụ na-atụ aka n’ihe ọ na-ekpughe banyere Jizọs; ‘ihe ịrịba ama’ na-echekwa ịdị arọ ahụ n’agbakwunyeghị okwu ọzọ.
- issue: Okwu banyere nwoke ahụ ịbụ παρὰ θεοῦ
  choice: esiteghị n’ebe Chineke nọ
  alternative: Chineke eziteghị ya
  rationale: Isi okwu Grik bụ ebe o si ma ọ bụ ikike sitere n’aka Chineke. Nhọrọ a na-echekwa esemokwu ahụ n’emeghị ka ọ bụrụ okwu kpọmkwem banyere izite ya.
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. E debere imperfect abụọ ahụ dịka ‘nọ na-ekwu,’ ma zere ịgbakwunye nkọwa ụka ma ọ bụ ozizi na-adịghị n’ederede Grik.
