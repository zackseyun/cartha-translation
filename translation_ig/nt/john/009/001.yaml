id: JHN.9.1
reference: John 9:1
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Καὶ παράγων εἶδεν ἄνθρωπον τυφλὸν ἐκ γενετῆς.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/001.yaml
  text: And as he was passing by[a], he saw a man blind from birth.
translation:
  language: ig
  text: Ka ọ na-agafe[a], ọ hụrụ otu nwoke kpuru ìsì kemgbe a mụrụ ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “ka ọ na-agabiga”; participle Grik ahụ na-egosi na ọ nọ na-agafe mgbe ọ hụrụ nwoke ahụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: Ka
  rationale: N’Igbo, njikọ a na nkebi participle na-eme ka mmalite ahịrịokwu a bụrụ nke sitere n’okwu bu ya ụzọ, ma na-ekwupụta oge ihe mere n’ụzọ eke.
- source_word: παράγων
  choice: ọ na-agafe
  rationale: Ụdị participle dị ugbu a na-egosi ihe Jizọs nọ na-eme mgbe ọ hụrụ nwoke ahụ; ‘na-agafe’ na-echekwa echiche nke omume na-aga n’ihu.
- source_word: εἶδεν
  choice: ọ hụrụ
  rationale: Nke a bụ ntụgharị kwụ ọtọ na nke eke nke aorist ὁράω, n’etinyeghị echiche ọzọ dị ka ‘ọ chọpụtara.’
- source_word: ἄνθρωπον
  choice: otu nwoke
  rationale: Ọ bụ ezie na ἄνθρωπος nwekwara ike ịpụta mmadụ, ebe a akụkọ ahụ na-ekwu banyere otu nwoke kpọmkwem; ‘otu nwoke’ bụ Igbo eke ma kwekọọ n’ọnọdụ ahụ.
- source_word: τυφλὸν
  choice: kpuru ìsì
  rationale: Nkebi a na-akọwa ọnọdụ nwoke ahụ n’Igbo doro anya, na-enweghị ịgbakwunye nkọwa na-adịghị na Grik.
- source_word: ἐκ γενετῆς
  choice: site n’ọmụmụ
  rationale: Nkebi a na-egosi na ikpu ìsì ya malitere n’oge a mụrụ ya; ntụgharị a dị nkenke ma na-echekwa ihe Grik pụtara.
theological_decisions:
- issue: Mmegharị nke ἄνθρωπον n’ihe gbasara okike nwoke ma ọ bụ nwaanyị
  choice: otu nwoke
  alternative: otu mmadụ
  rationale: Ọ bụ ezie na okwu Grik ahụ nwere ike ịbụ aha izugbe maka mmadụ, onye a kpọtụrụ aha bụ nwoke n’akụkọ a. Ya mere, ‘otu nwoke’ na-echekwa ihe ọnọdụ ederede na-egosi n’enweghị ime ka okwu ahụ bụrụ nke sara mbara karịa mkpa.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Nhazi ‘Ka ọ na-agafe’ na-enye παράγων nghọta nke oge na omume na-aga n’ihu; e tinyere akara ndetu ala ala [a] n’ebe kwesịrị ekwesị.
