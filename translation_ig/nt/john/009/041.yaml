source:
  edition: SBLGNT
  text: εἶπεν αὐτοῖς ὁ Ἰησοῦς· Εἰ τυφλοὶ ἦτε, οὐκ ἂν εἴχετε ἁμαρτίαν· νῦν δὲ λέγετε ὅτι Βλέπομεν· ⸀ἡ ἁμαρτία ὑμῶν μένει.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/041.yaml
  text: Jesus said to them[a], “If you were blind, you would not have sin. But now you say, ‘We see,’ so your sin remains.”
translation:
  language: ig
  text: Jizọs sịrị ha, “A sị na unu bụ ndị ìsì, unu agaraghị enwe mmehie[a]. Ma ugbu a unu na-asị, ‘Anyị na-ahụ’; mmehie unu ka dị.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “unu agaraghị enwe ikpe ọmụma.” Okwu Grik e ji mee ihe bụ “mmehie,” nke n’ebe a pụkwara ịgụnye echiche nke ikpe ọmụma.
    reason: lexical_alternative
lexical_decisions:
- source_word: τυφλοὶ
  choice: kpuru ìsì
  rationale: Nke a bụ ụzọ Igbo si ekwu ‘ịbụ onye ìsì.’ Ọ na-edobe okwu ahụ n’ụdị nkịtị, ka ihe gbara ya gburugburu gosi na ọ na-arụkwa ọrụ dị ka ihe atụ banyere nghọta ime mmụọ.
- source_word: οὐκ ἂν εἴχετε
  choice: unu agaraghị enwe
  rationale: Ụdị a na-egosi ihe gaara esi n’ọnọdụ a na-eche n’echiche pụta, ma ọ bụrụ na ọnọdụ ahụ bụ eziokwu; ọ bụkwa okwu Igbo doro anya ma na-aga were were.
- source_word: ἁμαρτίαν
  choice: mmehie
  rationale: ‘Mmehie’ bụ ihe okwu Grik ahụ pụtara kpọmkwem, ma na-edobekwa ụzọ Jọn si eji okwu ahụ eme ihe. N’ebe a, ọ pụkwara ibu echiche nke ịbụ onye ikpe mara, nke a kọwara n’ala ala peeji kama itinye nkọwa ahụ n’ahịrịokwu.
- source_word: νῦν δὲ
  choice: Ma ugbu a
  rationale: Nke a na-egosi ọdịiche dị n’etiti ọnọdụ ahụ e chere n’echiche na ọnọdụ ha nọ na ya ugbu a.
- source_word: λέγετε ὅτι Βλέπομεν
  choice: unu na-asị, ‘Anyị na-ahụ ụzọ’
  rationale: Nke a na-edobe mgbanwe sitere na onye nke abụọ n’ọnụọgụ ọtụtụ gaa n’okwu kpọmkwem nke onye mbụ n’ọnụọgụ ọtụtụ. ‘Ịhụ ụzọ’ bụ okwu Igbo nkịtị maka ịhụ ihe, ma na-edobekwa njikọ ya na isiokwu ìsì.
- source_word: ἡ ἁμαρτία ὑμῶν μένει
  choice: mmehie unu ka dị
  rationale: ‘Ka dị’ na-egosi na mmehie ahụ na-anọgide, dịka ngwaa Grik dị n’oge ugbu a si egosi, ma ọ bụkwa okwu Igbo dị mfe ma dị ebube.
theological_decisions:
- issue: Ma a ga-akọwa hoo haa na ìsì a bụ ìsì ime mmụọ, nakwa na mmehie a bụ ịbụ onye ikpe mara n’ihu Chineke
  choice: E debere okwu nkịtị ndị bụ ‘kpuru ìsì’ na ‘mmehie’ n’ahịrịokwu ahụ n’enweghị mgbakwunye nkọwa.
  alternative: “A sị na unu kpuru ìsì n’ihe ime mmụọ, ikpe mmehie agaraghị ama unu.”
  rationale: Ihe gbara amaokwu ahụ gburugburu na-egosi na okwu a metụtara nghọta ime mmụọ, ma okwu Jizọs ka na-eji ihe atụ nke ìsì anụ ahụ nke a malitere n’isiakwụkwọ ahụ dum. Ịgbakwunye ‘n’ihe ime mmụọ’ ma ọ bụ dochie ‘mmehie’ na ‘ikpe’ ga-emechi nghọta sara mbara okwu Grik ahụ nwere.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe ma dị ugwu. A họọrọ ‘ịhụ ụzọ’ dịka okwu Igbo nkịtị nke na-ejikọta nke ọma na ‘ikpu ìsì,’ ebe a hapụrụ ihe atụ ahụ ka ọ nọgide n’enweghị nkọwa agbakwunyere.
