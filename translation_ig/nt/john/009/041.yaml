  source_fidelity: 'A na-edobe usoro na isi okwu Grik nke ọma n’ozuzu ya: ọnọdụ a na-eche n’echiche, ‘mmehie,’ na mmehie nke ‘na-adị/na-anọgide’ ka e chebere. Otú ọ dị, ‘Anyị na-ahụ ụzọ’ pụtara ‘we see a way/road’ karịa ‘we see,’ ya mere ọ na-agbakwunye ‘ụzọ’ nke na-adịghị na Grik ma na-agbanwe nkwughachi ìsì na ịhụ ụzọ.'
  naturalness: ‘A sị na unu bụ ndị ìsì’ na ‘Anyị na-ahụ’ bụ Standard Igbo doro anya ma bụrụkwa okwu okike karịa ‘unu kpuru ìsì’ n’ọnọdụ a na ‘Anyị na-ahụ ụzọ.’ ‘Mmehie unu ka dị’ bụ nke okike ma na-egosi μένει nke ọma.
