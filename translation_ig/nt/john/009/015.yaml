source:
  edition: SBLGNT
  text: πάλιν οὖν ἠρώτων αὐτὸν καὶ οἱ Φαρισαῖοι πῶς ἀνέβλεψεν. ὁ δὲ εἶπεν αὐτοῖς· Πηλὸν ἐπέθηκέν μου ἐπὶ τοὺς ὀφθαλμούς, καὶ ἐνιψάμην, καὶ βλέπω.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/015.yaml
  text: So the Pharisees also asked him again how he had received his sight[a]. He said to them, “He put mud on my eyes, and I washed[b], and I see.”
translation:
  language: ig
  text: Ya mere, ndị Farisii jụkwara ya ọzọ otú o si malite ịhụ ụzọ. Ọ sịrị ha, “O tinyere apịtị n’elu anya m, m wee saa, ana m ahụ ụzọ.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πάλιν οὖν
  choice: Ya mere ... ọzọ
  rationale: “Ya mere” na-egosi njikọ akụkọ ahụ na ihe bu ụzọ mee, ebe “ọzọ” na-egosi na a jụrụ ya ajụjụ a ugboro ọzọ.
- source_word: ἠρώτων
  choice: jụkwara
  rationale: Ọ bụ ezie na ngwaa Grik dị n’ụdị imperfect, “jụkwara ... ọzọ” na-enye echiche nke ajụjụ a na-emeghachi n’Igbo dị mfe ma bụrụkwa nke eke.
- source_word: καὶ οἱ Φαρισαῖοι
  choice: ndị Farisii ... kwa
  rationale: Mgbakwunye “kwa” na-echekwa echiche καί nke na-egosi na ndị Farisii sokwa ná ndị jụrụ ya ajụjụ.
- source_word: πῶς ἀνέβλεψεν
  choice: otú o si malite ịhụ ụzọ
  rationale: N’ọnọdụ nwoke kpuru ìsì site n’ọmụmụ, ἀναβλέπω pụtara inweta ikike ịhụ ụzọ, ọ bụghị ile anya elu ma ọ bụ ịhụ ụzọ ‘ọzọ’ n’echiche na ọ hụburu ụzọ.
- source_word: Πηλὸν
  choice: apịtị
  rationale: πηλός nwere ike ịpụta apịtị ma ọ bụ ụrọ; “apịtị” bụ okwu doro anya ma kwekọọ n’ihe e ji mmiri ọnụ na ájá mee n’akụkọ a.
- source_word: ἐπέθηκέν μου ἐπὶ τοὺς ὀφθαλμούς
  choice: O tinyere apịtị n’anya m
  rationale: Nke a bụ ụzọ Igbo dị eke isi kwuo na e debere ihe n’elu anya mmadụ.
- source_word: ἐνιψάμην
  choice: m wee saa onwe m
  rationale: Aorist middle na-enye ohere ịkọwa na nwoke ahụ sachara onwe ya; okwu a na-edobe nuance reflexive n’ụzọ Igbo ghọtara nke ọma.
- source_word: βλέπω
  choice: ugbu a ana m ahụ ụzọ
  rationale: “Ana m ahụ ụzọ” na-echekwa present tense na ọnọdụ ọ nọ ugbu a; “ugbu a” na-eme ka nsonaazụ ọgwụgwọ ahụ pụta ìhè n’enweghị ịgbanwe isi okwu.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E ji “ịhụ ụzọ” mee ihe kama naanị “ịhụ” iji mee ka okwu banyere ikpu ìsì na inweta ọhụụ doo anya. E tinyeghị nkọwa ụka ma ọ bụ ozizi pụrụ iche.
