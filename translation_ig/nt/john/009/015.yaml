revisions:
- from: Ya mere, ndị Farisii jụkwara ya ọzọ otú o si malite ịhụ ụzọ. Ọ sịrị ha, “O tinyere apịtị n’anya m, m wee saa onwe m, ugbu a ana m ahụ ụzọ.”
  to: Ya mere, ndị Farisii jụkwara ya ọzọ otú o si malite ịhụ ụzọ. Ọ sịrị ha, “O tinyere apịtị n’elu anya m, m wee saa, ana m ahụ ụzọ.”
  rationale: The revision preserves the source’s narrative connection, repetition, healing sense of ἀναβλέπω, and present result. It removes the unwarranted explicit object “onwe m,” makes the placement of the mud more exact, and retains natural modern Standard Igbo.
