  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀπεκρίθησαν ⸀οὖν οἱ γονεῖς αὐτοῦ καὶ εἶπαν· Οἴδαμεν ὅτι οὗτός ἐστιν ὁ υἱὸς ἡμῶν καὶ ὅτι τυφλὸς ἐγεννήθη·
base_translation:
  language: en
  yaml_path: translation/nt/john/009/020.yaml
  text: So his parents answered and said[a], “We know that this is our son and that he was born blind.
translation:
  language: ig
  text: Ya mere, nne na nna ya zara sị, “Anyị maara na onye a bụ nwa anyị, marakwa na ọ bụ onye ìsì mgbe a mụrụ ya.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “na ọ bụ onye ìsì kemgbe a mụrụ ya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Ya mere
  rationale: Ọ na-egosi njikọ echiche na ihe a jụrụ nne na nna ya n’amaokwu bu ụzọ, ma na-ada nke ọma n’Igbo ugbu a.
- source_word: γονεῖς
  choice: nne na nna ya
  rationale: Nke a bụ ụzọ Igbo si ekwu n'ụzọ doro anya ma dịkwa mma banyere ndị mụrụ ya abụọ.
- source_word: ἀπεκρίθησαν ... καὶ εἶπαν
  choice: zara sị
  rationale: Akụkụ abụọ a na-egosipụta ma nzaghachi ahụ ma okwu ha kwuru; “zara sị” bụ usoro okwu Igbo e ji eme nke a n’enweghị nkwugharị na-adịghị eke.
- source_word: Οἴδαμεν
  choice: Anyị maara
  rationale: Ọ na-egosipụta ihe ha maara n’ezie, n’enweghị itinyekwu nkwusi ike na-adịghị n’isi mmalite.
- source_word: οὗτός ἐστιν ὁ υἱὸς ἡμῶν
  choice: onye a bụ nwa anyị
  rationale: “Onye a” na-echekwa ike ngosipụta nke οὗτος, ebe “nwa anyị” bụ okwu Igbo nkịtị maka nwa nwoke n’ọnọdụ a.
- source_word: τυφλὸς
  choice: onye ìsì
  rationale: Nke a bụ okwu Igbo doro anya na nke a na-asọpụrụ mmadụ maka onye na-adịghị ahụ ụzọ.
- source_word: ἐγεννήθη
  choice: mgbe a mụrụ ya
  rationale: Ọ na-enye echiche ọmụmụ nke ngwaa a n’ụzọ Igbo na-ada nke ọma.
- source_word: τυφλὸς ἐγεννήθη
  choice: ọ bụ onye ìsì mgbe a mụrụ ya
  rationale: Nke a na-echekwa njikọ dị n’etiti ọnọdụ ya na oge ọmụmụ ya, ma na-ezere ntụgharị okwu siri ike nke na-agaghị ada ka Igbo eke.
theological_decisions: []
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. “Zara sị” bụ usoro okwu eke nke na-anọchi anya ngwaa abụọ Grik, ebe e debere ụzọ ọzọ e si ghọta τυφλὸς ἐγεννήθη n’okpuru amaokwu.
