  verdict: revise
  source_fidelity: Isi ederede na-ejigide nke ọma nzaghachi ha, ebubo mkparị banyere ọmụmụ ya n’ime mmehie, ajụjụ nlelị ahụ, na nchụpụ ya. Otú ọ dị, nkọwa ala peeji a na-ekwu na ntụgharị Igbo na-echekwa ọtụtụ okwu Grik, ebe “mmehie” n’Igbo adịghị egosi ọtụtụ n’ụzọ ahụ. A ga-akọwa nke a kpọmkwem dị ka ọtụtụ dị na Grik.
  naturalness: “Ha zara ya, sị ya” na-emegharị onye a na-agwa okwu n’ụzọ na-adịghị eke; “Ha zara ya sị” dị ire ụtọ karịa. “n'ọgbakọ ụlọ nzukọ” n’ala peeji b adịghị ada ka Igbo ọha; “n’obodo ụlọ nzukọ” doro anya ma na-ahapụ ya dịka ohere, ọ bụghị nkwubi okwu.
  terminology: “n'ime mmehie” bụ ntụgharị Igbo a na-anabata nke ọma maka ebubo ahụ, ma ghara ịmanye nkọwa okpukpe banyere mmehie e ketara eketa ma ọ bụ mmehie ndị mụrụ ya. “chụpụ” dabara nke ọma na ἐξέβαλον ... ἔξω.
