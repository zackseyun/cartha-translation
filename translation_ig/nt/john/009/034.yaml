source:
  edition: SBLGNT
  text: ἀπεκρίθησαν καὶ εἶπαν αὐτῷ· Ἐν ἁμαρτίαις σὺ ἐγεννήθης ὅλος, καὶ σὺ διδάσκεις ἡμᾶς; καὶ ἐξέβαλον αὐτὸν ἔξω.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/034.yaml
  text: They answered and said to him[a], “You were born entirely in sins[c][b], and are you teaching us?” And they cast him out.
translation:
  language: ig
  text: Ha zara ya sị, “A mụrụ gị n'ime mmehie kpamkpam,[a] ma gị onwe gị na-akụziri anyị ihe?” Ha wee chụpụ ya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N'ụzọ nkịtị, “A mụrụ gị kpamkpam n'ime mmehie.” Okwu Grik maka “mmehie” dị n’ọtụtụ, nke na-eme ka mkparị ha sie ike.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “Ha tụpụ ya n'èzí.” Nke a nwere ike ịpụta na ha chụpụrụ ya n’ihu ha; n’ọnọdụ akụkọ a, ọ pụkwara igosi nchụpụ n’obodo ụlọ nzukọ.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθησαν καὶ εἶπαν αὐτῷ
  choice: Ha zara ya, sị ya
  rationale: Na-echekwa usoro ngwaa abụọ nke Jọn n'ụzọ na-ada ka Igbo nkịtị ma na-egosi na ha zaghachiri ya ozugbo.
- source_word: Ἐν ἁμαρτίαις
  choice: n'ime mmehie
  rationale: Na-echekwa ọtụtụ nke ἁμαρτίαις (‘mmehie’) na ike nke okwu mkparị ahụ, n'ebughị ụzọ kọwaa ụdị mmehie ha bu n'obi.
- source_word: ἐγεννήθης ὅλος
  choice: A mụrụ gị ... kpamkpam
  rationale: '‘Kpamkpam’ na-egosi ike ὅλος: ebubo ha metụtara ọnọdụ ya dum site n''ọmụmụ, ọ bụghị nanị omume ọmụmụ ahụ.'
- source_word: καὶ σὺ διδάσκεις ἡμᾶς;
  choice: ma gị onwe gị na-akụziri anyị ihe?
  rationale: ‘Gị onwe gị’ na-egosipụta nkwusi ike dị na σὺ; ajụjụ ahụ na-ebukwa iwe na nlelị ha.
- source_word: ἐξέβαλον αὐτὸν ἔξω
  choice: Ha wee chụpụ ya
  rationale: ‘Chụpụ’ bụ okwu Igbo doro anya nke na-egosi nchụpụ siri ike, ma ọ naghị ekpebi n'ahịrịokwu bụ isi ma ọ bụ naanị n'ebe ahụ ka a chụpụrụ ya ma ọ bụ n'ọgbakọ ụlọ nzukọ.
theological_decisions:
- issue: Ihe ebubo ‘a mụrụ gị n'ime mmehie’ pụtara n'ihe gbasara ikpu ìsì ya kemgbe a mụrụ ya
  choice: E debere ya dịka ebubo mkparị na ọnọdụ ya dum sitere n'ọmụmụ jupụtara na mmehie, n'akọwaghị onye mere mmehie ahụ ma ọ bụ ụdị ikpe ọmụma ọ bụ.
  alternative: A mụrụ gị dịka onye mmehie kpamkpam; ma ọ bụ, a mụrụ gị n'okpuru ikpe mmehie ndị mụrụ gị.
  rationale: Grik na-edekọ ebubo ndị na-ekwu okwu, ma ọ naghị ekpebi ma ha bu mmehie nke nwoke ahụ, mmehie e ketara, ma ọ bụ mmehie ndị mụrụ ya n'obi. Nsụgharị ahụ na-ahapụ esemokwu nkà mmụta okpukpe a ka ọ dị.
- issue: Oke nchụpụ nke ἐξέβαλον αὐτὸν ἔξω
  choice: Ha chụpụrụ ya, na-enweghị ịkọwapụta n'ahịrịokwu bụ isi ma ọ bụ n'ihu ha naanị ma ọ bụ n'obodo ụlọ nzukọ.
  alternative: Ha chụpụrụ ya n'ụlọ nzukọ.
  rationale: Okwu ahụ n'onwe ya pụtara ịchụpụ ya n'èzí; ọnọdụ gbara ya gburugburu nwere ike ịgụnye ịchụpụ ya n'ọgbakọ, ma ekwesịghị ime ka ihe ahụ doro anya karịa isi mmalite.
translation_notes:
  register: Igbo Ọha kwekọrọ n'ụkpụrụ, nke ugbu a, dị ùgwù ma dị mfe nghọta. A họọrọ ‘sị ya’ maka usoro akụkọ Igbo eke, ‘gị onwe gị’ maka nkwusi ike, na ‘chụpụ’ maka nchụpụ siri ike n'etinyeghị nkọwa òtù okpukpe n'ime ederede.
