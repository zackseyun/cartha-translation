  text: ἐκ τοῦ αἰῶνος οὐκ ἠκούσθη ὅτι ἠνέῳξέν τις ὀφθαλμοὺς τυφλοῦ γεγεννημένου·
base_translation:
  language: en
  yaml_path: translation/nt/john/009/032.yaml
  text: From of old it has never been heard that anyone opened the eyes of one born blind[a].
translation:
  language: ig
  text: Kemgbe ụwa, a nụtụbeghị na onye ọ bụla meghere anya onye a mụrụ ìsì[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Malite n'oge e kere ụwa, a nụtụbeghị …”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ τοῦ αἰῶνος
  choice: Kemgbe ụwa
  rationale: Akpaalaokwu a na-egosi oge niile malite n'oge ochie ruo ugbu a. ‘Kemgbe ụwa’ bụ okwu Igbo doro anya ma dịkwa n'okike; ọ naghị amanye echiche nkà mmụta banyere ebighị ebi.
- source_word: οὐκ ἠκούσθη
  choice: a nụtụbeghị
  rationale: Ụdị a na-edobe echiche passive nke Grik ma na-egosi na akụkọ dị otú a enwebeghị ihe atụ ruo ugbu a.
- source_word: ὅτι
  choice: na
  rationale: ‘Na’ na-ebute ọdịnaya nke ihe a na-anụtụbeghị, dịka ὅτι si arụ ọrụ n'ahịrịokwu a.
- source_word: ἠνέῳξέν
  choice: meghere
  rationale: Nke a na-asụgharị ngwaa ahụ kpọmkwem n'okwu ‘imeghe anya,’ kama iji ‘gwọọ’ ma ọ bụ ‘weghachi ịhụ ụzọ,’ nke ga-agbakwụnye nkọwa.
- source_word: τις
  choice: onye ọ bụla
  rationale: N'ime nkwupụta na-adịghị mma, ‘onye ọ bụla’ na-egosipụta onye a na-akọwaghị ma na-echekwa ịdị ukwuu nke nkwupụta ahụ.
- source_word: ὀφθαλμοὺς
  choice: anya
  rationale: ‘Anya’ bụ ụzọ Igbo nkịtị si kwuo akụkụ ahụ abụọ n'okwu a; ịgbakwunye akara ọtụtụ adịghị mkpa.
- source_word: τυφλοῦ γεγεννημένου
  choice: onye a mụrụ n'ìsì
  rationale: Nke a na-egosi n'ụzọ doro anya na onye ahụ kpuru ìsì site n'ọmụmụ, ma ghara ịgbakwunye aha ‘nwoke’ nke na-adịghị mkpa n'Igbo.
theological_decisions:
- issue: Ókè oge nke ἐκ τοῦ αἰῶνος
  choice: ‘Kemgbe ụwa,’ ya bụ, n'ime akụkọ na ncheta mmadụ niile
  alternative: ‘Site na mgbe ebighị ebi’ ma ọ bụ ‘kemgbe e kere ụwa’
  rationale: Onye na-ekwu okwu na-ekwu banyere ihe atụ a nụtụrụla n'akụkọ mmadụ, ọ bụghị na-eme nkwupụta nkà mmụta banyere ebighị ebi. Nsụgharị ahụ na-echekwa ike okwu ahụ ma na-ahapụ obere ohere dị n'akpaalaokwu ahụ ka nkọwa ala peeji kọwaa ya.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji ‘a nụtụbeghị’ debe usoro passive nke isi mmalite, jiri ‘onye a mụrụ n'ìsì’ zere ịgbakwunye ‘nwoke,’ ma debe akara nkọwa [a] n'ime ederede.
