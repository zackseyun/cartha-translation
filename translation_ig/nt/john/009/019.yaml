id: JHN.9.19
reference: John 9:19
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἠρώτησαν αὐτοὺς λέγοντες· Οὗτός ἐστιν ὁ υἱὸς ὑμῶν, ὃν ὑμεῖς λέγετε ὅτι τυφλὸς ἐγεννήθη; πῶς οὖν ⸂βλέπει ἄρτι⸃;
base_translation:
  language: en
  yaml_path: translation/nt/john/009/019.yaml
  text: And they asked them, saying, “Is this your son, whom you say was born blind? How then does he now see?”
translation:
  language: ig
  text: Ha jụrụ ha sị, “Onye a ọ bụ nwa unu, onye unu na-ekwu na a mụrụ ya kpuru ìsì? Oleezi otú o si ahụ ụzọ ugbu a?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἠρώτησαν
  choice: Ha jụrụ ha
  rationale: “Jụrụ” bụ ụzọ Igbo nkịtị na nke doro anya si egosi ịjụ ajụjụ; oge gara aga dị na “ἠρώτησαν” pụtara ìhè n'usoro ahịrịokwu ahụ.
- source_word: λέγοντες
  choice: sị
  rationale: N'Igbo, “sị” bụ ụzọ ebumpụta ụwa isi webata okwu a kpọrọ kpọmkwem, ma ọ na-anọchi anya participle “λέγοντες” nke ọma n'akụkọ a.
- source_word: Οὗτός ἐστιν ὁ υἱὸς ὑμῶν
  choice: Onye a ọ bụ nwa unu
  rationale: Ọ bụ ezie na usoro Grik yiri nkwupụta, ọnọdụ ya na-egosi ajụjụ. “Onye a ọ bụ nwa unu?” bụ ajụjụ Igbo doro anya ma na-edobe “unu” dị ka ọtụtụ mmadụ.
- source_word: ὃν ὑμεῖς λέγετε
  choice: onye unu na-ekwu
  rationale: “Na-ekwu” na-edobe λέγετε n'ụzọ na-anọpụ iche, n'etinyeghị echiche nke obi abụọ nke okwu dịka “na-azọrọ” nwere ike iweta.
- source_word: τυφλὸς ἐγεννήθη
  choice: a mụrụ ya kpuru ìsì
  rationale: Nke a bụ ụzọ Igbo doro anya isi kwuo na mmadụ kpuru ìsì site n'ọmụmụ, ma na-edobe ọdịdị passive nke γεννάω.
- source_word: πῶς οὖν
  choice: Oleezi otú
  rationale: “Olee otú” na-egosi ajụjụ banyere ụzọ ihe si mee, ebe “-zi” na-eburu ike nkwubi okwu ma ọ bụ ihe na-esochi nke οὖν.
- source_word: βλέπει
  choice: o si ahụ ụzọ
  rationale: “Ịhụ ụzọ” bụ okwu Igbo ebumpụta ụwa maka inwe anya na-ahụ; ụdị ugbu a na-egosi ọnọdụ ya dị ugbu a, ọ bụghị naanị ikike nwere ike ịdị.
- source_word: ἄρτι
  choice: ugbu a
  rationale: “Ugbu a” na-egosi ọdịiche dị n'etiti ikpu ìsì ya na mbụ na ịhụ ụzọ ya n'oge ahụ.
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ usoro ajụjụ ebumpụta ụwa n'Igbo ma debe nkwusi ike dị na “unu” na ọdịiche dị n'etiti ikpu ìsì site n'ọmụmụ na ịhụ ụzọ ugbu a.
