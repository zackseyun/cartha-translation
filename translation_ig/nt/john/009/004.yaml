    text: Ụfọdụ ihe odide na-agụ, “M aghaghị ịrụ ọrụ nke onye zitere m.”
    reason: textual_variant
  revision_rationale: The revision preserves the supplied SBLGNT reading “anyị” rather than the manuscript variant “m,” which remains clearly documented in the footnote. It corrects the final negative clause to idiomatic Standard Igbo and makes the relationship between the works and the sender explicit, without adding interpretive or doctrinal content.
