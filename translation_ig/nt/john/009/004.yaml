  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸀ἡμᾶς δεῖ ἐργάζεσθαι τὰ ἔργα τοῦ πέμψαντός με ἕως ἡμέρα ἐστίν· ἔρχεται νὺξ ὅτε οὐδεὶς δύναται ἐργάζεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/004.yaml
  text: We must do the works of the one who sent me while it is day; night is coming[a], when no one can work.
translation:
  language: ig
  text: anyị aghaghị ịrụ ọrụ nke onye zitere m mgbe ọ ka bụ ehihie; abalị na-abịa[a], mgbe ọ dịghị onye pụrụ ịrụ ọrụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ụfọdụ ihe odide na-agụ, “M aghaghị ịrụ ọrụ nke onye zitere m.”
    reason: textual_variant
lexical_decisions:
- source_word: ἡμᾶς
  choice: Anyị
  rationale: Ụdị okwu a bụ nnọchiaha onye mbụ n’ọnụọgụ ọtụtụ; ya na δεῖ na-enye echiche ‘anyị aghaghị.’ Nke a na-agbaso ihe odide SBLGNT kama ụdị ọzọ nke nwere ‘m.’
- source_word: δεῖ
  choice: aghaghị
  rationale: ‘Aghaghị’ na-egosipụta mkpa na iwu dị n’okwu Grik ahụ n’ụzọ doro anya ma bụrụkwa Igbo a na-asụ ugbu a.
- source_word: ἐργάζεσθαι τὰ ἔργα
  choice: ịrụ ọrụ
  rationale: N’Igbo, ‘ịrụ ọrụ’ na-eburu ma ngwaa ahụ ma aha sitere n’otu mgbọrọgwụ n’enweghị ikwughachi okwu n’ụzọ na-adịghị eke. Ọ ka na-echekwa echiche nke ịrụ ọrụ ndị sitere n’aka Onye zitere Jizọs.
- source_word: τοῦ πέμψαντός με
  choice: Onye zitere m
  rationale: Nke a na-asụgharị participle nwere article dị ka aha onye, na-ahapụghị onye ahụ n’amaghị ama ma ọ bụ tinye nkọwa karịrị ihe Grik kwuru.
- source_word: ἕως ἡμέρα ἐστίν
  choice: mgbe ọ ka bụ ehihie
  rationale: Nke a bụ ụzọ Igbo si ekwu oge ọrụ dị tupu abalị abịa, ma na-echekwa ọdịiche dị n’etiti ehihie na abalị.
- source_word: ἔρχεται νὺξ
  choice: abalị na-abịa
  rationale: Ụdị ugbu a na-egosi ihe na-abịaru nso; ‘na-abịa’ na-ebute nke a n’Igbo nke ọma.
- source_word: οὐδεὶς δύναται ἐργάζεσθαι
  choice: ọ na-adịghị onye pụrụ ịrụ ọrụ
  rationale: Nke a na-egosipụta nkwụsi ike nke οὐδεὶς (‘ọ dịghị onye’) na ikike nke δύναται, n’enweghị itinye oke metụtara nwoke ma ọ bụ nwanyị.
theological_decisions:
- issue: 'Ọdịiche ihe odide ná mmalite amaokwu ahụ: ἡμᾶς (‘anyị’) ma ọ bụ ἐμέ (‘m’)'
  choice: Anyị aghaghị ịrụ ọrụ Onye zitere m
  alternative: M aghaghị ịrụ ọrụ Onye zitere m
  rationale: SBLGNT e nyere nwere ἡμᾶς, ya mere isi ederede gbasoro ‘anyị.’ E debere ụdị ‘m’ n’okpuru peeji n’ihi na ọ dị n’ụfọdụ ihe odide ma pụta n’ọtụtụ nsụgharị.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị nsọ ma dị mfe nghọta. E debere oyiyi ehihie na abalị dị n’asụsụ Grik, ma e tinyebeghị nkọwa pụrụ iche banyere ihe oyiyi ahụ n’isi ederede.
