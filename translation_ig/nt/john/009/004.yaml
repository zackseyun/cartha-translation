revisions:
- from: Anyị aghaghị ịrụ ọrụ Onye zitere m mgbe ọ ka bụ ehihie; abalị na-abịa[a], mgbe ọ na-adịghị onye pụrụ ịrụ ọrụ.
  to: anyị aghaghị ịrụ ọrụ nke onye zitere m mgbe ọ ka bụ ehihie; abalị na-abịa[a], mgbe ọ dịghị onye pụrụ ịrụ ọrụ.
  rationale: The revision preserves the supplied SBLGNT reading “anyị” rather than the manuscript variant “m,” which remains clearly documented in the footnote. It corrects the final negative clause to idiomatic Standard Igbo and makes the relationship between the works and the sender explicit, without adding interpretive or doctrinal content.
