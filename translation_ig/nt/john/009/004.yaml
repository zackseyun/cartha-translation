review_pass:
  verdict: revise
  source_fidelity: 'The draft correctly follows the SBLGNT plural reading ἡμᾶς as “anyị,” and it retains the singular “m” in “onye zitere m.” It also correctly represents the temporal contrast of day and coming night. However, the final clause is not idiomatic Igbo: “ọ na-adịghị onye” does not naturally express οὐδείς. The main and footnote renderings should also explicitly retain the possessive relation in τὰ ἔργα τοῦ πέμψαντός με (“the works of the one who sent me”).'
  naturalness: “Mgbe ọ na-adịghị onye pụrụ ịrụ ọrụ” is structurally awkward in Standard Igbo. “Mgbe ọ dịghị onye pụrụ ịrụ ọrụ” is clear, natural, and preserves the sense of inability. “Ịrụ ọrụ nke onye zitere m” is a natural Igbo collective expression for doing the sender’s works.
  terminology: “Aghaghị,” “ehihie,” “abalị na-abịa,” and “pụrụ ịrụ ọrụ” are suitable modern Standard Igbo choices. Lowercase “onye” appropriately reflects the Greek substantive participle without turning it into a title or adding an explicit identification not present in the verse.
  issues:
  - severity: medium
    issue: The negative existential expression in the final clause is unidiomatic.
    rationale: “Ọ na-adịghị onye” is not the normal Standard Igbo way to say “no one.” Use “ọ dịghị onye” to render οὐδείς naturally and accurately.
  - severity: low
    issue: The main text and footnote omit the possessive linker in the phrase corresponding to “the works of the one who sent me.”
    rationale: “Ịrụ ọrụ nke onye zitere m” more clearly represents τὰ ἔργα τοῦ πέμψαντός με while remaining idiomatic; “ọrụ” can function collectively in Igbo without forcing an unnatural plural form.
  revised_text: anyị aghaghị ịrụ ọrụ nke onye zitere m mgbe ọ ka bụ ehihie; abalị na-abịa[a], mgbe ọ dịghị onye pụrụ ịrụ ọrụ.
  revised_footnotes:
