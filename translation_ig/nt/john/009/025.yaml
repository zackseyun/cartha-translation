source:
  edition: SBLGNT
  text: ἀπεκρίθη οὖν ⸀ἐκεῖνος· Εἰ ἁμαρτωλός ἐστιν οὐκ οἶδα· ἓν οἶδα ὅτι τυφλὸς ὢν ἄρτι βλέπω.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/025.yaml
  text: 'So that man answered[a], “Whether he is a sinner, I do not know. One thing I do know: though I was blind, now I see.”'
translation:
  language: ig
  text: Ya mere, nwoke ahụ zara, sị, “Ma ọ̀ bụ onye mmehie, amaghị m.[a] Otu ihe m maara bụ na m bụbu onye ìsì, ma ugbu a ana m ahụ ụzọ.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “Ọ bụrụ na ọ bụ onye mmehie, amaghị m.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: zara
  rationale: Ọ bụ okwu Igbo a na-ejikarị akọ nzaghachi n’ime mkparịta ụka.
- source_word: οὖν
  choice: Ya mere
  rationale: Ọ na-egosi njikọ na ihe ndị e kwuru tupu ya, ma na-adabara asụsụ akụkọ Igbo.
- source_word: ἐκεῖνος
  choice: nwoke ahụ
  rationale: Ọ na-echekwa ike ngosi nke okwu Grik ahụ ma na-ezo aka n'ụzọ doro anya n’ebe nwoke ahụ e mere ka ọ hụ ụzọ nọ.
- source_word: Εἰ ἁμαρτωλός ἐστιν
  choice: Ma ọ̀ bụ onye mmehie
  rationale: N’ebe a, εἰ na-ewebata ihe a na-amaghị; “ma ọ̀ bụ” na-enye echiche ‘whether’ n’Igbo n’enweghị ikpebi ebubo ahụ.
- source_word: ἁμαρτωλός
  choice: onye mmehie
  rationale: Nke a bụ okwu dị nkenke ma doo anya maka onye a na-ebo ebubo na ọ bụ onye mmehie.
- source_word: οὐκ οἶδα
  choice: amaghị m
  rationale: Ọ bụ nsụgharị Igbo nkịtị na kpọmkwem nke ngwaa ahụ nwere nghọta oge dị ugbu a.
- source_word: ἓν οἶδα
  choice: Otu ihe ka m maara
  rationale: “Ka” na-eme ka otu ihe ahụ pụta ìhè, na-echekwa ọdịiche siri ike dị n’etiti ihe ọ na-amaghị na ihe ọ maara.
- source_word: τυφλὸς ὢν
  choice: Abụ m onye ìsì na mbụ
  rationale: Ọ na-akọ ọnọdụ ya gara aga n’ụzọ doro anya ma na-akwadebe ọdịiche ya na ọnọdụ dị ugbu a.
- source_word: ἄρτι
  choice: ugbu a
  rationale: Ọ na-echekwa ọdịiche oge dị n’etiti ìsì mbụ ya na ịhụ ụzọ ya ugbu a.
- source_word: βλέπω
  choice: ana m ahụ ụzọ
  rationale: N’ọnọdụ ọgwụgwọ ìsì, nke a bụ ụzọ Igbo kacha doo anya isi kwuo na mmadụ na-ahụzi ihe anya.
theological_decisions:
- issue: Ikwupụta okwu nwoke ahụ n’etinyeghị mkpebi onye ntụgharị banyere ma Jizọs ọ bụ onye mmehie
  choice: Ma ọ̀ bụ onye mmehie, amaghị m.
  alternative: Ọ bụrụ na ọ bụ onye mmehie, amaghị m.
  rationale: '“Ma ọ̀ bụ” na-echekwa oke ihe nwoke ahụ maara: ọ naghị ekpebi ebubo ahụ, kama ọ na-ekwu na ya amaghị azịza ya. Nke a na-ahapụ esemokwu nkà mmụta okpukpe dị n’okwu ahụ ka ọ dị.'
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe nke oge a, dị mfe nghọta ma nwee ugwu. E ji “nwoke ahụ” chekwaa okwu ngosi Grik; e jikwa “ana m ahụ ụzọ” mee ka ọgwụgwọ ìsì pụta ìhè n’ụzọ ndị Igbo na-asụkarị.
