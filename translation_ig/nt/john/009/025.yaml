  rationale: 'The revision supplies the explicit Igbo content-clause structure corresponding to ἓν οἶδα ὅτι (“one thing I know: that ...”), while retaining the speaker’s limited knowledge and the original’s simple former-condition/present-result contrast. The demonstrative reference, theological restraint, and footnote alternative are preserved.'
