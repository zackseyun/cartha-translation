id: JHN.9.30
reference: John 9:30
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀπεκρίθη ὁ ἄνθρωπος καὶ εἶπεν αὐτοῖς· Ἐν ⸂τούτῳ γὰρ τὸ⸃ θαυμαστόν ἐστιν ὅτι ὑμεῖς οὐκ οἴδατε πόθεν ἐστίν, καὶ ἤνοιξέν μου τοὺς ὀφθαλμούς.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/030.yaml
  text: 'The man answered and said to them[a], “This is the remarkable thing: you do not know where he is from[b], and yet he opened my eyes.”'
translation:
  language: ig
  text: 'Nwoke ahụ zara ha sị, “Nke a bụ ihe dị ịtụnanya[a]: unu amaghị ebe o si bịa[b], ma ọ meghere anya m.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ihe na-eju anya.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ebe o si.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη ὁ ἄνθρωπος καὶ εἶπεν αὐτοῖς
  choice: Nwoke ahụ zara ha sị
  rationale: Nke a bụ ụzọ Igbo si ekwu okwu nzaghachi n’ụzọ ebumpụta ụwa. “Nwoke ahụ” na-ezo kpọmkwem aka n’ nwoke a mụrụ n’ìsì, “zara ha sị” na-echekwa ma nzaghachi ahụ ma okwu ọ gwara ha.
- source_word: Ἐν τούτῳ γὰρ τὸ θαυμαστόν ἐστιν
  choice: Nke a bụ ihe dị ịtụnanya
  rationale: Ọ na-egosi okwu ahụ nwoke ahụ hụrụ dị ka ihe a ga-eju anya. A hapụrụ γάρ ka usoro okwu na akara kọlọn gosi ọrụ nkọwa ya, n’ihi na itinye njikọ pụrụ ime ka Igbo sie ike n’enweghị mkpa.
- source_word: ὑμεῖς οὐκ οἴδατε
  choice: unu amaghị
  rationale: “Unu” na-echekwa nnọchiaha doro anya nke Grik, ya mere ọ na-ebute nrụgide dị n’okwu nwoke ahụ nye ndị ọ na-agwa.
- source_word: πόθεν ἐστίν
  choice: ebe o si bịa
  rationale: Ọ bụ okwu Igbo nkịtị maka ebe mmadụ si ma ọ bụ mmalite ya, n’enweghị ikpebi ụdị mmalite ahụ karịa ihe Grik kwuru.
- source_word: καὶ ἤνοιξέν μου τοὺς ὀφθαλμούς
  choice: ma ọ meghere anya m
  rationale: 'N’ebe a καί nwere ike esemokwu, ya mere “ma” na-egosipụta ihe mgbagwoju anya nwoke ahụ na-akọ: ha amaghị ebe Jizọs si, ma Jizọs gwọrọ ya. “Meghere anya m” na-echekwa okwu anụahụ nke ọgwụgwọ ahụ ma na-ahapụkwa nghọta miri emi banyere ịhụ ụzọ ka ọ pụta site n’akụkọ ahụ.'
theological_decisions:
- issue: Ma “ọ meghere anya m” ò kwesịrị ime ka nghọta ime mmụọ pụta ìhè
  choice: Edebere ya dị ka okwu gbasara ọgwụgwọ anya n’ezie
  alternative: Ịsụgharị ya n’ụzọ ga-ekwu kpọmkwem na o nyere ya nghọta ime mmụọ
  rationale: Ihe a na-ekwu ozugbo bụ na e mere ka nwoke ahụ hụ ụzọ. Isiokwu Jọn banyere ịhụ ụzọ na ìsì ime mmụọ ka dị n’akụkọ ahụ, ma nsụgharị ekwesịghị ịgbakwunye ya n’amaokwu a.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe ma dị ugwu. Usoro “zara ha sị” na “ebe o si bịa” bụ okwu ndị mmadụ na-aghọta ngwa ngwa; a chekwara “unu” iji gosipụta nrụgide dị na Grik.
