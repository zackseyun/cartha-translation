  text: ⸀ἐλοιδόρησαν αὐτὸν καὶ εἶπον· Σὺ ⸂μαθητὴς εἶ⸃ ἐκείνου, ἡμεῖς δὲ τοῦ Μωϋσέως ἐσμὲν μαθηταί·
base_translation:
  language: en
  yaml_path: translation/nt/john/009/028.yaml
  text: They reviled him and said[a], “You are that man's disciple, but we are disciples of Moses.”
translation:
  language: ig
  text: Ha kparịrị ya ma sị, “Gị bụ onye na-eso ụzọ nwoke ahụ[a], ma anyị bụ ndị na-eso ụzọ Mosis.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Ị bụ onye na-eso ụzọ ya.” Okwu Grik ahụ pụtara “onye ahụ” ma ọ bụ “nwoke ahụ,” ọ pụkwara inwe ụda nlelị n’ebe a.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλοιδόρησαν
  choice: Ha kparịrị ya
  rationale: Ngwaa ‘kparịa’ na-egosi iji okwu mkparị mee mmadụ ihere ma ọ bụ wedata ya; ọ dabara n’ọnọdụ esemokwu a ma na-edobe ịdị njọ nke okwu Grik.
- source_word: Σὺ μαθητὴς εἶ
  choice: Ọ bụ gị bụ onye na-eso ụzọ
  rationale: Nhazi ‘Ọ bụ gị bụ’ na-eme ka ‘gị’ pụta ìhè dịka nnọchiaha Σὺ e tinyere n’ihu n’asụsụ Grik si eme.
- source_word: μαθητής / μαθηταί
  choice: onye/ndị na-eso ụzọ
  rationale: Nke a bụ okwu Igbo doro anya maka ndị na-amụta n’aka onye ma na-arara onwe ha nye iso ya; e jikwa otu okwu ahụ mee akụkụ abụọ iji chekwaa ntụnyere ahụ.
- source_word: ἐκείνου
  choice: nwoke ahụ
  rationale: ‘Nwoke ahụ’ na-egosipụta ịdị anya na nlelị dị n’okwu ndị ahụ nke ọma karịa nnọchiaha nkịtị ‘ya,’ n’agbanyeghị na Grik nwekwara ike ịpụta naanị ‘onye ahụ’ ma ọ bụ ‘ya.’
- source_word: ἡμεῖς δὲ τοῦ Μωϋσέως ἐσμὲν μαθηταί
  choice: ma anyị bụ ndị na-eso ụzọ Mosis
  rationale: ‘Ma’ na-edobe ntụnyere δέ, ebe ‘anyị’ na-egosipụta nkwusi ike dị na nnọchiaha Grik; njikọ ya na Mosis ka e gosipụtara n’ụzọ Igbo dị mfe nghọta.
theological_decisions:
- issue: Ụda okwu ἐκείνου mgbe a na-ekwu banyere Jizọs
  choice: nwoke ahụ
  alternative: ya; onye ahụ
  rationale: N’ihi na ndị na-ekwu okwu ahụ na-akparị nwoke a gwọrọ, okwu ngosi a nwere ike ibu ụda nlelị na ịdọpụ onwe ha n’ebe Jizọs nọ. Nsụgharị a na-egosipụta nke ahụ n’etinyeghị ozizi ọzọ.
- issue: Otu esi asụgharị μαθητής n’akụkụ abụọ ahụ
  choice: onye/ndị na-eso ụzọ
  alternative: onye/ndị na-eso ya; nwa akwụkwọ/ụmụ akwụkwọ
  rationale: ‘Onye na-eso ụzọ’ na-ejide ma mmụta ma nrubeisi ma ọ bụ nkwado mmadụ, ma na-echekwa ntụnyere dị n’etiti iso Jizọs na iso Mosis.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta. ‘Kparịrị’ na-egosi okwu mkparị n’enweghị mgbakwunye nkọwa na-adịghị na isi mmalite; ‘Ọ bụ gị bụ’ na-edobe nkwusi ike nke Σὺ n’ụzọ Igbo nkịtị.
