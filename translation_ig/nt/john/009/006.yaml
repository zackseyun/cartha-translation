  text: ταῦτα εἰπὼν ἔπτυσεν χαμαὶ καὶ ἐποίησεν πηλὸν ἐκ τοῦ πτύσματος, καὶ ⸀ἐπέχρισεν ⸀αὐτοῦ τὸν πηλὸν ἐπὶ τοὺς ⸀ὀφθαλμούς,
base_translation:
  language: en
  yaml_path: translation/nt/john/009/006.yaml
  text: After saying these things[a], he spit on the ground and made mud from the saliva, and he spread the mud on his eyes,
translation:
  language: ig
  text: Mgbe o kwuchara ihe ndị a, ọ gbọrọ ọnụ mmiri n’ala, jiri ọnụ mmiri ahụ mee apịtị, gbasara apịtị ahụ n’anya ya[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “o ji apịtị ahụ tee anya ya.” Ngwaa Grik a nwere ike ịpụta “ite” (karịsịa ite mmanụ) ma ọ bụ “ịgbasa ihe n’elu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα εἰπὼν
  choice: Mgbe o kwuchara ihe ndị a
  rationale: Nkebi a na-egosi na okwu ahụ buru ụzọ mee tupu omume ndị ọzọ amalite; ntụgharị a bụ Igbo eke ma na-edobe usoro oge ahụ.
- source_word: ἔπτυσεν χαμαί
  choice: ọ gbụrụ ọnụ mmiri n’ala
  rationale: Nke a na-egosi kpọmkwem omume ịgbụ ọnụ mmiri na ebe o mere ya, ya bụ n’ala.
- source_word: ἐποίησεν πηλὸν ἐκ τοῦ πτύσματος
  choice: jiri ọnụ mmiri ahụ mee apịtị
  rationale: πηλός nwere ike ịbụ ụrọ ma ọ bụ apịtị; ‘apịtị’ dabara n’ihe e ji ọnụ mmiri mee n’ala. ‘Jiri ... mee’ na-egosi na ọnụ mmiri ahụ bụ ihe e si mee ya.
- source_word: ἐπέχρισεν
  choice: gbasaa
  rationale: Ngwaa Grik ahụ nwere ike ịpụta ite ihe n’elu ma ọ bụ ite mmanụ. ‘Gbasaa’ na-egosi omume nkịtị nke ịgbasa apịtị n’anya, n’etinyeghị echiche emume n’amaokwu ahụ.
- source_word: αὐτοῦ τὸν πηλὸν ἐπὶ τοὺς ὀφθαλμούς
  choice: apịtị ahụ n’anya ya
  rationale: ‘Apịtị ahụ’ na-ezo azụ n’apịtị e mere ugbu a, ebe ‘anya ya’ na-ezo aka n’anya nwoke ahụ kpuru ìsì dịka ọnọdụ gbara amaokwu ahụ gburugburu si gosi.
theological_decisions:
- issue: Ma ἐπέχρισεν nwere echiche emume nke ite mmanụ
  choice: E ji ‘gbasaa’ gosipụta omume nkịtị nke itinye apịtị ahụ n’anya.
  alternative: o ji apịtị ahụ tee anya ya
  rationale: Amaokwu ahụ n’onwe ya anaghị ekwu na nke a bụ emume ma ọ bụ ihe metụtara ịbụ Mesaya. Isiokwu na-eji okwu na-anọpụ iche, ebe nkọwa ala peeji na-echekwa ụzọ ọzọ e nwere ike isi ghọta ngwaa Grik ahụ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. A họọrọ ‘ọnụ mmiri’ na ‘apịtị’ dịka okwu ndị nkịtị, a hapụkwara nnọchiaha ‘ya’ ka ọnọdụ amaokwu ahụ kọwaa onye a na-ekwu maka ya.
