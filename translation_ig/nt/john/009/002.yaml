revisions:
- from: Ndị na-eso ụzọ ya wee jụọ ya, sị, “Rabaị, ònye mere mmehie, nwoke a ka ọ bụ nne na nna ya, nke mere na a mụrụ ya kpuru ìsì?[a]”
  to: Ndị na-eso ụzọ ya wee jụọ ya, sị, “Rabaị, ònye mere mmehie, nwoke a ka ọ bụ nne na nna ya, ka a mụọ ya kpuru ìsì?[a]”
  rationale: The revision changes only the rendering of ἵνα in the main text and reverses the note’s alternative accordingly. It more closely represents the Greek subjunctive while preserving the ambiguity of the disciples’ assumed sin-and-blindness relationship and making no doctrinal endorsement.
