id: JHN.9.2
reference: John 9:2
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἠρώτησαν αὐτὸν οἱ μαθηταὶ αὐτοῦ λέγοντες· Ῥαββί, τίς ἥμαρτεν, οὗτος ἢ οἱ γονεῖς αὐτοῦ, ἵνα τυφλὸς γεννηθῇ;
base_translation:
  language: en
  yaml_path: translation/nt/john/009/002.yaml
  text: And his disciples asked him[a], saying, “Rabbi, who sinned, this man or his parents, that he should be born blind?”
translation:
  language: ig
  text: Ndị na-eso ụzọ ya wee jụọ ya, sị, “Rabaị, ònye mere mmehie, nwoke a ka ọ bụ nne na nna ya, ka a mụọ ya kpuru ìsì?[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “nke mere na a mụrụ ya kpuru ìsì.” Nkebiokwu Grik ahụ nwere ike igosi mmekọrịta ebumnuche ma ọ bụ ihe si na ya pụta nke ndị na-eso ụzọ ahụ chere na ọ dị n’ajụjụ ha.
    reason: alternative_reading
lexical_decisions:
- source_word: ἠρώτησαν
  choice: jụọ
  rationale: Ngwaa a na-egosi ajụjụ nkịtị a jụrụ Jizọs; “jụọ” bụ okwu Igbo doro anya ma bụrụkwa nke e ji ekwu okwu kwa ụbọchị.
- source_word: μαθηταὶ
  choice: ndị na-eso ụzọ
  rationale: Nke a na-egosipụta mmekọrịta nke ndị na-amụta ihe n'aka onye nkụzi ma na-eso ya, dị ka okwu ahụ si arụ ọrụ n'Oziọma.
- source_word: λέγοντες
  choice: sị
  rationale: “Sị” bụ ụzọ Igbo sitere n'okike isi webata kpọmkwem ihe ha kwuru, ma na-eburu ọrụ participle Grik ahụ.
- source_word: Ῥαββί
  choice: Rabaị
  rationale: E debere aha ọkpụkpọ ndị Juu a n'ụdị e dere ya n'Igbo iji chekwaa ọnọdụ akụkọ ihe mere eme ya.
- source_word: τίς
  choice: ònye
  rationale: Ajụjụ ahụ na-achọ ịmata onye e chere na ọ bụ ya mere mmehie ahụ.
- source_word: ἥμαρτεν
  choice: mere mmehie
  rationale: Nke a bụ ụzọ Igbo doro anya na nke sitere n'okike isi kwuo na mmadụ mehiere.
- source_word: οὗτος
  choice: nwoke a
  rationale: Ọ na-arụtụ aka n'ahụ nwoke ahụ kpuru ìsì; “nwoke a” na-eme ka onye a na-ekwu maka ya doo anya.
- source_word: γονεῖς
  choice: nne na nna
  rationale: Nke a bụ okwu Igbo a na-ejikarị eme ihe maka nne na nna mmadụ ọnụ.
- source_word: ἵνα
  choice: nke mere na
  rationale: Nhọrọ a na-egosipụta njikọ ebumnuche/ahịaazụ nke ndị na-eso ụzọ ahụ chere na ọ dị n'etiti mmehie na ọmụmụ ya n'ìsì, n'ekwughị na onye na-akọ akụkọ kwadoro echiche ahụ.
- source_word: τυφλὸς
  choice: kpuru ìsì
  rationale: Nke a bụ okwu Igbo nkịtị na nke doro anya maka ọnọdụ enweghị ịhụ ụzọ.
- source_word: γεννηθῇ
  choice: a mụrụ ya
  rationale: Ụdị a na-egosi na ọnọdụ ikpu ìsì ahụ dị ya site n'ọmụmụ, ma na-adaba nke ọma n'usoro ahịrịokwu Igbo.
theological_decisions:
- issue: Nkọwa mmekọrịta ἵνα n'ajụjụ banyere mmehie na ikpu ìsì site n'ọmụmụ
  choice: “nke mere na a mụrụ ya kpuru ìsì”
  alternative: “ka e wee mụọ ya kpuru ìsì”
  rationale: Nsụgharị ahụ na-edebe echiche ndị na-eso ụzọ ahụ banyere njikọ dị n'etiti mmehie na ọnọdụ nwoke ahụ, ma ọ naghị eme ka echiche ahụ bụrụ nkwupụta nkà mmụta okpukpe nke onye na-akọ akụkọ kwadoro. Ihe odide ala ala peeji na-echekwakwa mgbagwoju anya nke ἵνα, nke nwere ike igosi ebumnuche ma ọ bụ ihe si na ya pụta.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “Rabaị” na-echekwa ọnọdụ ndị Juu nke akụkọ ahụ; “ndị na-eso ụzọ” bụ okwu Akwụkwọ Nsọ a maara nke ọma ma doo anya. Akara ụda dị na “ònye” na-enyere aka igosi ajụjụ ahụ nke ọma.
