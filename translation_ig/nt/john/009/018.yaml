id: JHN.9.18
reference: John 9:18
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Οὐκ ἐπίστευσαν οὖν οἱ Ἰουδαῖοι περὶ αὐτοῦ ὅτι ⸂ἦν τυφλὸς⸃ καὶ ἀνέβλεψεν, ἕως ὅτου ἐφώνησαν τοὺς γονεῖς αὐτοῦ ⸂τοῦ ἀναβλέψαντος⸃
base_translation:
  language: en
  yaml_path: translation/nt/john/009/018.yaml
  text: So the Jews did not believe concerning him that he had been blind and had received sight[a], until they called the parents of the one who had received sight.
translation:
  language: ig
  text: N’ihi ya, ndị Juu[a] ekweghị na ọ bụbu onye ìsì ma hụzie ụzọ, ruo mgbe ha kpọrọ nne na nna onye ahụ hụrụ ụzọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’okwu a, “ndị Juu” nwekwara ike ịpụta “ndị isi ndị Juu” ma ọ bụ “ndị Judia,” dabere n’otú e si ghọta ojiji Jọn ji okwu ahụ mee n’ebe a.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπίστευσαν
  choice: ekweghị
  rationale: With the ὅτι content clause, πιστεύω concerns accepting a report as true. Igbo “ekweghị” naturally expresses that they did not believe it, rather than that they lacked personal trust.
- source_word: οἱ Ἰουδαῖοι
  choice: ndị Juu
  rationale: This formally preserves the Greek collective expression without narrowing it in the main text to leaders or Judeans. The contextual possibilities are retained in a footnote.
- source_word: περὶ αὐτοῦ
  choice: na ọ
  rationale: In natural Igbo, the person concerned is carried by the pronoun in the content clause. A literal phrase such as “banyere ya” here would be unnecessarily awkward.
- source_word: ἦν τυφλὸς
  choice: ọ bụbu onye ìsì
  rationale: “Bụbu” clearly locates the blindness before the restored sight, while “onye ìsì” is the ordinary and dignified Igbo expression.
- source_word: ἀνέβλεψεν
  choice: hụzie ụzọ
  rationale: This is a natural Igbo healing-context expression for coming to see. It does not require that the person had sight at some earlier period, unlike a potentially misleading equivalent of “regained.”
- source_word: ἕως ὅτου
  choice: ruo mgbe
  rationale: This is the idiomatic temporal equivalent of “until” and marks the endpoint described by the clause.
- source_word: ἐφώνησαν
  choice: ha kpọrọ
  rationale: “Kpọrọ” covers calling or summoning in this context without adding an unnecessarily official nuance.
- source_word: γονεῖς
  choice: nne na nna
  rationale: Igbo conventionally expresses “parents” with the paired phrase “mother and father,” which is exact and natural.
- source_word: τοῦ ἀναβλέψαντος
  choice: onye ahụ hụrụ ụzọ
  rationale: The articular participle is represented by an identifying relative expression, preserving the description of the person through his receiving sight.
theological_decisions:
- issue: Referent and nuance of οἱ Ἰουδαῖοι in John
  choice: ndị Juu
  alternative: ndị isi ndị Juu; ndị Judia
  rationale: The main text retains the formally broad Greek designation rather than resolving it as specifically the leaders or the Judeans. The footnote alerts readers that Johannine context may give it a narrower reference and guards against reading it as a claim about every Jewish person.
translation_notes:
  register: Standard Igbo; natural, current, and dignified narrative prose. The sentence avoids an awkwardly literal rendering of περὶ αὐτοῦ, while preserving the disputed claim and the ambiguity of οἱ Ἰουδαῖοι. The footnote marker is placed immediately after the expression it explains.
