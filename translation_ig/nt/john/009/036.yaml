  text: ἀπεκρίθη ἐκεῖνος καὶ εἶπεν· Καὶ τίς ἐστιν, κύριε, ἵνα πιστεύσω εἰς αὐτόν;
base_translation:
  language: en
  yaml_path: translation/nt/john/009/036.yaml
  text: He answered and said[a], “And who is he, Lord, that I may believe in him?”
translation:
  language: ig
  text: Ọ zara sị, “Ònye ka ọ bụ, Onyenweanyị[a], ka m wee kwere na ya?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “nna.” Okwu Grik bụ κύριε; e nwere ike iji ya kpọọ mmadụ n’ụzọ nkwanye ùgwù, ọ pụkwara ịpụta “Onyenweanyị.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθη ἐκεῖνος καὶ εἶπεν
  choice: Ọ zara sị
  rationale: Igbo ‘Ọ zara sị’ naturally represents the Greek narrative doublet ‘he answered and said’ without an awkward word-for-word repetition.
- source_word: Καὶ τίς ἐστιν
  choice: Ònye ka ọ bụ
  rationale: This is the natural Standard Igbo interrogative for ‘who is he?’ The initial καί is not separately represented because inserting ‘Na’ here would sound unnatural; the continuing force is conveyed by the direct response.
- source_word: κύριε
  choice: Onyenwe anyị
  rationale: This is the established dignified Igbo rendering of ‘Lord.’ Since κύριε may also be a respectful address in this context, the alternative is retained in a footnote.
- source_word: ἵνα πιστεύσω εἰς αὐτόν
  choice: ka m wee kwere na ya
  rationale: ‘Ka m wee’ conveys the purpose expressed by ἵνα with the subjunctive, while ‘kwere na ya’ transparently renders believing in him.
theological_decisions:
- issue: The force of κύριε before the healed man’s fuller recognition of Jesus
  choice: Onyenwe anyị
  alternative: nna anyị ukwu (a respectful ‘sir’)
  rationale: The main text follows the customary rendering ‘Lord,’ but the Greek can also function as respectful address. The footnote preserves that genuine narrative and theological ambiguity.
translation_notes:
  register: Standard Igbo; natural, current, and dignified. The compact speech formula avoids wooden repetition while preserving the sense, and the footnote retains the ambiguity of κύριε.
