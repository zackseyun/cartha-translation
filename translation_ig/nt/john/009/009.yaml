  text: ἄλλοι ἔλεγον ὅτι Οὗτός ἐστιν· ἄλλοι ⸂ἔλεγον· Οὐχί, ἀλλὰ⸃ ὅμοιος αὐτῷ ἐστιν. ἐκεῖνος ἔλεγεν ὅτι Ἐγώ εἰμι.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/009.yaml
  text: Some were saying[a], “This is he.” Others were saying, “No, but he is like him.” He kept saying, “I am he.”
translation:
  language: ig
  text: Ụfọdụ nọ na-ekwu, “Ọ bụ ya.” Ndị ọzọ nọ na-ekwu, “Mba, kama ọ dị ka ya.” Onye ahụ nọgidere na-ekwu, “Ọ bụ m.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ, n’ụzọ nkịtị karịa n’asụsụ Grik, “Abụ m.” N’ebe a, ihe ọ pụtara bụ njirimara onwe onye nkịtị: nwoke ahụ na-ekwu na ọ bụ onye ha na-ekwu maka ya.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλοι ... ἄλλοι
  choice: Ụfọdụ ... Ndị ọzọ
  rationale: E ji ha kewaa ìgwè ndị na-arụrịta ụka ụzọ abụọ; nsụgharị a bụ Igbo doro anya ma na-echekwa ọdịiche ahụ.
- source_word: ἔλεγον
  choice: nọ na-ekwu
  rationale: Ọdịdị imperfect na-egosi okwu na-aga n'ihu ma ọ bụ nke a na-ekwughachi n'etiti ndị mmadụ.
- source_word: Οὗτός ἐστιν
  choice: Ọ bụ ya
  rationale: Nke a bụ ụzọ Igbo si akọwa onye a na-arụtụ aka n’ụzọ dị mkpụmkpụ ma kwekọọ n’echiche Grik.
- source_word: Οὐχί, ἀλλὰ
  choice: Mba, kama
  rationale: Ọ na-echekwa nkwụsi ike nke ngọnarị na ọdịiche nke ἀλλά.
- source_word: ὅμοιος αὐτῷ ἐστιν
  choice: ọ dị ka ya
  rationale: Ọ na-egosi myirịta, ọ bụghị na ha bụ otu onye.
- source_word: ἐκεῖνος ἔλεγεν
  choice: Ma nwoke ahụ nọgidere na-ekwu
  rationale: A kọwara onye nnọchiaha ahụ n’ụzọ eke n’Igbo, ebe ‘nọgidere na-ekwu’ na-egosi nkwughachi ma ọ bụ nkwusi ike nke imperfect.
- source_word: Ἐγώ εἰμι
  choice: Ọ bụ m
  rationale: 'N’ọnọdụ a, okwu ahụ bụ njirimara onwe onye: nwoke ahụ na-ekwu na ọ bụ onye ha na-ekwu maka ya. Nke a bụ Igbo eke nke na-adịghị etinye nkwupụta nkà mmụta okpukpe n’ebe ọnọdụ ahụ na-achọghị ya.'
theological_decisions:
- issue: Ntụgharị Ἐγώ εἰμι n’Oziọma Jọn
  choice: Ọ bụ m
  alternative: Abụ m
  rationale: Ọ bụ ezie na ἐγώ εἰμι nwere ike inwe nnukwu nghọta n’ebe ndị ọzọ n’akwụkwọ Jọn, ebe a nwoke a gwọrọ na-eme naanị ka a mata na ọ bụ onye a na-arụrịta ụka banyere ya. A na-edebe nsụgharị nkịtị karịa n’ala ala peeji ka ọdịdị okwu Grik pụta ìhè n’enweghị itinye ihe ọ pụtaghị n’ọnọdụ a.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, doro anya ma nwee ugwu. E ji ‘Ọ bụ ya/Ọ bụ m’ mee ka mkparịta ụka ahụ bụrụ nke eke, ebe a na-echekwa nkwughachi nke imperfect site na ‘nọ na-ekwu’ na ‘nọgidere na-ekwu.’
