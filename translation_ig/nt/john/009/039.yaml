id: JHN.9.39
reference: John 9:39
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ εἶπεν ὁ Ἰησοῦς· Εἰς κρίμα ἐγὼ εἰς τὸν κόσμον τοῦτον ἦλθον, ἵνα οἱ μὴ βλέποντες βλέπωσιν καὶ οἱ βλέποντες τυφλοὶ γένωνται.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/039.yaml
  text: And Jesus said[a], “For judgment I came into this world, so that those who do not see may see, and those who see may become blind.”
translation:
  language: ig
  text: Jizọs wee sị, “Ọ bụ maka ikpe[a] ka m bịara n’ụwa a, ka ndị na-adịghị ahụ wee hụ, ndị na-ahụ ewe ghọọ ndị ìsì.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “maka otu ikpe.” Okwu Grik ahụ, εἰς κρίμα, pụrụ imesi mmetụta ikpe nke ọbịbịa Jizọs ike, ọ bụghị naanị amamikpe.
    reason: lexical_alternative
lexical_decisions:
- source_word: κρίμα
  choice: ikpe
  rationale: “Ikpe” na-egosipụta nsonaazụ nke ikpe na nkewa nke ọbịbịa Jizọs na-eweta, n’emeghị ka ọ bụrụ naanị amamikpe.
- source_word: κόσμον
  choice: ụwa
  rationale: “Ụwa” bụ okwu Igbo doro anya ma kwekọọ n’otú Jọn si eji κόσμος akọwa ụwa ụmụ mmadụ.
- source_word: οἱ μὴ βλέποντες / οἱ βλέποντες
  choice: ndị na-adịghị ahụ ụzọ / ndị na-ahụ ụzọ
  rationale: Nhọrọ a na-edobe nhata dị n’ahịrị abụọ ahụ ma na-ahapụ ma ịhụ ụzọ n’anụ ahụ ma nghọta ime mmụọ ka ha dị n’uche.
- source_word: βλέπωσιν
  choice: hụ ụzọ
  rationale: “Hụ ụzọ” bụ okwu Igbo ebumpụta ụwa nke pụrụ ịpụta inweta ọhụụ n’anụ ahụ ma ọ bụ nghọta ime mmụọ.
- source_word: τυφλοὶ γένωνται
  choice: ghọọ ndị ìsì
  rationale: “Ghọọ” na-edobe echiche mgbanwe dị na γένωνται, ebe “ndị ìsì” na-echekwa ntụgharị siri ike nke okwu Jizọs.
- source_word: εἰς τὸν κόσμον τοῦτον ἦλθον
  choice: m ji bịa n’ụwa a
  rationale: N’usoro ahịrịokwu “Ọ bụ ... ka,” okwu a na-egosipụta nke ọma na Jizọs bịara n’ime ụwa a ma na-edobe nkwusi ike dị n’isi mmalite okwu Grik.
theological_decisions:
- issue: Mmekọrịta okwu a na Jọn 3:17, ebe e kwuru na Ọkpara abịaghị ikpe ụwa ikpe
  choice: A sụgharịrị κρίμα dịka “ikpe,” n’emeghị ka esemokwu ahụ dị nro.
  alternative: Ịsụgharị ya dịka “nkewa” ma ọ bụ “amamikpe.”
  rationale: '“Ikpe” na-echekwa echiche na ọbịbịa Jizọs na-ekpughe ọnọdụ mmadụ ma na-eweta ntụgharị: ndị na-adịghị ahụ ụzọ na-ahụ, ebe ndị na-ekwu na ha na-ahụ na-aghọ ndị ìsì. Ọ naghị amanye nkọwa ga-eme ka okwu a kwekọọ n’ụzọ dị mfe na amaokwu ndị ọzọ.'
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. Usoro nkwusi ike “Ọ bụ ... ka” na-eme ka okwu ahụ bụrụ nke ebumpụta ụwa n’Igbo ma na-echekwa ike nke ahịrịokwu Grik. E debere ihe oyiyi nke ịhụ ụzọ na ịbụ ìsì ka nghọta anụ ahụ na nke ime mmụọ wee nọgide na-arụkọ ọrụ.
