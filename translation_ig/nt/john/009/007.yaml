id: JHN.9.7
reference: John 9:7
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτῷ· Ὕπαγε νίψαι εἰς τὴν κολυμβήθραν τοῦ Σιλωάμ (ὃ ἑρμηνεύεται Ἀπεσταλμένος). ἀπῆλθεν οὖν καὶ ἐνίψατο, καὶ ἦλθεν βλέπων.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/007.yaml
  text: And he said to him[a], “Go, wash in the pool of Siloam” (which is translated “Sent”). So he went and washed, and came back seeing.
translation:
  language: ig
  text: 'Ọ sịrị ya, “Gaa saa onwe gị n’ọdọ mmiri Saịloam” (nke a sụgharịrị: “Onye e zitere”)[a]. Ya mere, ọ gara saa onwe ya, wee lọta na-ahụ ụzọ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “nke pụtara ‘Onye e zitere.’”
    reason: Nhọrọ okwu ọzọ maka ἑρμηνεύεται nke na-egosi ihe aha ahụ pụtara kama ikwu na a sụgharịrị ya.
lexical_decisions:
- source_word: Ὕπαγε
  choice: Gaa
  rationale: Ọ bụ iwu dị mfe nke ịga ebe ọzọ; “Gaa” bụ okwu Igbo doro anya ma kwekọọ n’usoro iwu ahụ.
- source_word: νίψαι / ἐνίψατο
  choice: saa onwe gị / saa onwe ya
  rationale: νίπτω na-egosi ịsa ahụ ma ọ bụ akụkụ ahụ, ọ bụghị ịbanye saa ahụ dum n’ụzọ doro anya. Nsụgharị a na-egosipụta ọdịdị nkwụghachi omume nke ngwaa Grik ahụ n’enweghị ịgbakwụnye na ọ bụ anya kpọmkwem ka ọ sara.
- source_word: εἰς τὴν κολυμβήθραν
  choice: n’ọdọ mmiri
  rationale: κολυμβήθρα bụ ọdọ ma ọ bụ ebe e ji echekwa mmiri. N’usoro okwu Igbo, “saa onwe gị n’ọdọ mmiri” na-ada nke ọma karịa nsụgharị nkịtị nke εἰς dị ka ịbanye “n’ime” ọdọ ahụ.
- source_word: Σιλωάμ
  choice: Saịloam
  rationale: E degharịrị aha ebe ahụ n’ụdị na-eme ka onye na-agụ Igbo nwee ike ịkpọ ya, kama ịsụgharị aha ahụ n’onwe ya.
- source_word: ὃ ἑρμηνεύεται Ἀπεσταλμένος
  choice: nke a sụgharịrị bụ “Onye E Zitere”
  rationale: ἑρμηνεύεται na-eweta nkọwa ntụgharị aha ahụ, ebe Ἀπεσταλμένος bụ aha sitere n’ụdị ngwaa e mere onye ahụ ihe. “Onye E Zitere” na-echekwa echiche ahụ n’Igbo eke.
- source_word: οὖν
  choice: Ya mere
  rationale: οὖν na-egosi ihe mere n’ihi iwu ahụ ma na-aga n’ihu n’akụkọ ahụ. “Ya mere” na-eme ka njikọ a doo anya.
- source_word: ἀπῆλθεν
  choice: ọ gara
  rationale: Nke a bụ omume ịpụ ma gaa ebe a gwara ya; “ọ gara” zuru oke ma bụrụ Igbo a na-asụ ugbu a.
- source_word: ἦλθεν βλέπων
  choice: wee lọta na-ahụ ụzọ
  rationale: βλέπων na-egosi ọnọdụ ọhụụ ya mgbe ọ bịara. “Na-ahụ ụzọ” bụ ụzọ Igbo si ekwu na mmadụ enwetala ike ịhụ ụzọ, ebe “lọta” na-eme ka nloghachi ahụ pụta ìhè n’usoro akụkọ.
theological_decisions:
- issue: Otu e si kọwaa aha Saịloam n’enweghị ịgbasa ihe atụ okpukpe Jọn nwere ike ịdị na-atụ aro
  choice: 'Idowe nkọwa ahụ n’ahịrịokwu: “nke a sụgharịrị bụ ‘Onye E Zitere.’”'
  alternative: Ịkọwa ya n’ụzọ ga-ejikọta aha ahụ kpọmkwem na Jizọs dị ka Onye Nna zitere
  rationale: Ihe odide Grik n’onwe ya nyere nkọwa aha ahụ, ya mere a hapụrụ ya n’isi ederede. Ma e tinyeghị nkọwa ọzọ nke ga-ekpebi ihe atụ ahụ karịa ka Jọn si kwuo ya n’amaokwu a.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. A hapụrụ nkọwa aha Saịloam n’ime akara nkekọ dịka ọ dị n’asụsụ mbụ, ma zere ịgbakwụnye na ọ bụ anya kpọmkwem ka nwoke ahụ sara, n’ihi na amaokwu Grik a ekwughị ya kpọmkwem.
