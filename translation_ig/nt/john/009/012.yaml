id: JHN.9.12
reference: John 9:12
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸂καὶ εἶπαν⸃ αὐτῷ· Ποῦ ἐστιν ἐκεῖνος; λέγει· Οὐκ οἶδα.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/012.yaml
  text: And they said to him[a], “Where is that man?” He says, “I do not know.”
translation:
  language: ig
  text: Ha wee sị ya, “Olee ebe onye ahụ[a] nọ?” Ọ sị, “Amaghị m.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Olee ebe ọ nọ?” N’asụsụ Grik, okwu a bụ okwu ngosi, nke a pụrụ ịtụgharị n’ụzọ kpọmkwem dịka “onye ahụ”; n’Igbo, a pụkwara ịsụ ya nanị “ọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: wee
  rationale: Nke a jikọtara ihe ha kwuru na akụkọ bu ya ụzọ n’ụzọ Igbo si akọ akụkọ, n’etinyeghị nkọwa ọzọ.
- source_word: εἶπαν αὐτῷ
  choice: Ha wee sị ya
  rationale: A hapụrụ ngwaa ahụ dị ka ‘sị’ kama ‘jụọ,’ ọ bụ ezie na okwu na-esochi ya bụ ajụjụ; ‘ya’ na-egosikwa onye a gwara okwu.
- source_word: Ποῦ ἐστιν ἐκεῖνος
  choice: Olee ebe onye ahụ nọ?
  rationale: ‘Olee ebe ... nọ?’ bụ ụzọ Igbo doro anya si ajụ maka ebe mmadụ nọ. ‘Onye ahụ’ na-echekwa ike ngosi nke ἐκεῖνος n’ụzọ dị mma n’Igbo.
- source_word: λέγει
  choice: Ọ sị
  rationale: Ọ bụ ezie na Grik ji oge dị ugbu a mee akụkọ ka ọ dị ndụ, ‘Ọ sị’ bụ ụzọ dị nkenke ma dịkwa eke e si ewebata okwu kpọmkwem n’akụkọ Igbo.
- source_word: Οὐκ οἶδα
  choice: Amaghị m
  rationale: Nke a bụ nsụgharị Igbo kpọmkwem, dị mfe ma dị ugwu nke azịza ahụ.
theological_decisions: []
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị mfe ma dị ugwu. A họọrọ ‘onye ahụ’ iji chekwaa okwu ngosi Grik n’enweghị okwu na-adịghị eke n’Igbo; a hapụkwara okwu ahụ nkenke dịka isi mmalite ya.
