base_translation:
  language: en
  yaml_path: translation/nt/john/009/026.yaml
  text: So they said to him, “What did he do to you? How did he open your eyes?”
translation:
  language: ig
  text: Ya mere, ha sịrị ya, “Gịnị ka o mere gị? Olee otú o si meghee anya gị?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶπον
  choice: ha sịrị
  rationale: Oge gara aga nke λέγω na-ewebata okwu ndị otu ahụ gwara nwoke ahụ; “ha sịrị” na-egosipụta ngwaa ahụ n'ụzọ kwụ ọtọ karịa ịsụgharị ya ka “ha jụrụ.”
- source_word: οὖν
  choice: Ya mere
  rationale: Njikọ a na-aga n'ihu n'okwu ma na-egosi ihe si n'ihe bu ụzọ pụta; “Ya mere” na-echekwa ike njikọ ahụ.
- source_word: αὐτῷ
  choice: ya
  rationale: Nnọchiaha n'ụdị dative na-arụ ọrụ dị ka onye a gwara okwu, ya bụ nwoke ahụ a gwọrọ.
- source_word: Τί
  choice: Gịnị
  rationale: Nnọchiaha ajụjụ a na-amalite ajụjụ mbụ n'ụzọ doro anya.
- source_word: ἐποίησέν σοι
  choice: ka o mere gị
  rationale: ποιέω tinyere dative pụtara ihe e mere mmadụ; “mere gị” na-echekwa asụsụ nyocha ahụ n'etinyeghị echiche ọma nke “mere maka gị.”
- source_word: πῶς
  choice: Olee otú
  rationale: Ọ na-ajụ ụzọ ma ọ bụ usoro e si mee ihe.
- source_word: ἤνοιξέν
  choice: o si meghee
  rationale: ἀνοίγω nọ n'olu na-eme ihe; nhazi ajụjụ Igbo “Olee otú o si...” na-enye ya n'ụzọ ebumpụta ụwa.
- source_word: σου τοὺς ὀφθαλμούς
  choice: anya gị
  rationale: N'Igbo, ụzọ nkịtị isi kwuo akụkụ ahụ mmadụ nke onye nwe ya bụ “anya gị.”
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo Izugbe dị ugbu a, dị mfe ma dị ùgwù. E debere ajụjụ abụọ ahụ na ụda nyocha ha, na-enweghị ịgbakwunye nkọwa okpukpe.
