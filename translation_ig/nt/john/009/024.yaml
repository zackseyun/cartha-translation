revisions:
- from: Ya mere, ha kpọrọ nwoke ahụ kpuru ìsì na mbụ oku nke ugboro abụọ, sị ya[a], “Nye Chineke otuto; anyị maara na nwoke a bụ onye mmehie.”
  to: Ya mere, ha kpọrọ nwoke ahụ kpuru ìsì na mbụ nke ugboro abụọ, sị ya[a], “Nye Chineke otuto; anyị maara na nwoke a bụ onye mmehie.”
  rationale: The revision retains the source’s ambiguity and literal formulation while correcting the Igbo syntax for the temporal and iterative modifiers. The note now explains the likely idiomatic force as a solemn call to truthfulness without importing a formal-oath requirement or an unclear pronoun.
