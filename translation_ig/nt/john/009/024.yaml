  text: Ἐφώνησαν οὖν ⸂τὸν ἄνθρωπον ἐκ δευτέρου⸃ ὃς ἦν τυφλὸς καὶ εἶπαν αὐτῷ· Δὸς δόξαν τῷ θεῷ· ἡμεῖς οἴδαμεν ὅτι ⸂οὗτος ὁ ἄνθρωπος⸃ ἁμαρτωλός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/024.yaml
  text: So they called the man who had been blind a second time and said to him[a], “Give glory to God; we know that this man is a sinner.”
translation:
  language: ig
  text: Ya mere, ha kpọrọ nwoke ahụ kpuru ìsì na mbụ nke ugboro abụọ, sị ya[a], “Nye Chineke otuto; anyị maara na nwoke a bụ onye mmehie.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O nwere ike ịbụ na nke a bụ akpaalaokwu e ji sie mmadụ ike ka o kwuo eziokwu: “Nye Chineke otuto,” ya bụ, “Kwuo eziokwu n’ihu Chineke” ma ọ bụ “Kwupụta eziokwu hoo haa n’ihu Chineke.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐφώνησαν
  choice: ha kpọrọ ... oku
  rationale: Nke a na-egosi na ha kpọrọ nwoke ahụ ka ọ bịaghachi n’ihu ha, n’enweghị ịgbakwunye echiche nke iwu ma ọ bụ mmanye nke ngwaa Grik ahụ ekwughị kpọmkwem.
- source_word: οὖν
  choice: Ya mere
  rationale: Ọ na-ejikọta ihe a na mkparịta ụka gara aga ma na-egosi ihe sochiri ya.
- source_word: τὸν ἄνθρωπον
  choice: nwoke ahụ
  rationale: N'ebe a ἄνθρωπος na-ezo aka n'otu nwoke a maara nke ọma n'akụkọ ahụ.
- source_word: ἐκ δευτέρου
  choice: nke ugboro abụọ
  rationale: Ọ na-echekwa kpọmkwem echiche nke ịkpọ ya nke ugboro abụọ, kama naanị ịsị ‘ọzọ.’
- source_word: ὃς ἦν τυφλός
  choice: ahụ kpuru ìsì na mbụ
  rationale: Nke a na-egosi na ikpu ìsì bụ ọnọdụ ya gara aga, ọ bụghị ọnọdụ ya ugbu a mgbe a gwọchara ya.
- source_word: Δὸς δόξαν τῷ θεῷ
  choice: Nye Chineke otuto
  rationale: A na-edobe okwu Grik ahụ n'ụzọ doro anya, ebe e tinyere ike ya dị ka iyi ka mmadụ kwuo eziokwu n’ala ala peeji.
- source_word: ἡμεῖς οἴδαμεν
  choice: anyị maara
  rationale: Ọ na-echekwa nkwusi ike ha ji kwuo na ihe ha na-ekwu doro ha anya.
- source_word: οὗτος ὁ ἄνθρωπος
  choice: nwoke a
  rationale: Ọ bụ ntụgharị nkịtị nke okwu ngosi na aha ahụ, n’etinyeghị ụda nlelị nke Grik ahụ ekwughị kpọmkwem.
- source_word: ἁμαρτωλός
  choice: onye mmehie
  rationale: Ọ na-echekwa ebubo ha kpọmkwem na nwoke ahụ bụ onye mmehie.
theological_decisions:
- issue: Ike akpaalaokwu nke Δὸς δόξαν τῷ θεῷ
  choice: Idobe ‘Nye Chineke otuto’ n’ahịrịokwu bụ isi
  alternative: ‘Kwuo eziokwu n’ihu Chineke’ ma ọ bụ ‘Kwupụta ya n’ihu Chineke’
  rationale: O yikarịrị ka okwu ahụ bụ iwu siri ike ka nwoke ahụ kwuo eziokwu ma ọ bụ kwupụta ihe n’ihu Chineke; ma okwu Grik ahụ n’onwe ya na-ekwu maka inye Chineke otuto. Ya mere, a na-edobe okwu ahụ n’ahịrịokwu bụ isi, a kọwaakwa ike akpaalaokwu ya n’ala ala peeji ka a ghara idozi ihe nwere nghọta abụọ n’enweghị mkpa.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji ‘na mbụ’ mee ka o doo anya na nwoke ahụ adịghịzi kpuru ìsì, ma e debere ọdịdị okwu nke adjuration ahụ n’ahịrịokwu bụ isi.
