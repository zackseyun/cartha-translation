    text: 'O nwere ike ịbụ na nke a bụ akpaalaokwu e ji sie mmadụ ike ka o kwuo eziokwu: “Nye Chineke otuto,” ya bụ, “Kwuo eziokwu n’ihu Chineke” ma ọ bụ “Kwupụta eziokwu hoo haa n’ihu Chineke.”'
    reason: lexical_alternative
  revision_rationale: The revision retains the source’s ambiguity and literal formulation while correcting the Igbo syntax for the temporal and iterative modifiers. The note now explains the likely idiomatic force as a solemn call to truthfulness without importing a formal-oath requirement or an unclear pronoun.
