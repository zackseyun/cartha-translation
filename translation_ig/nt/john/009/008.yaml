revisions:
- from: Ya mere, ndị agbata obi ya na ndị hụburu ya mgbe ọ bụ onye arịrịọ nọ na-ekwu, “Ọ̀ bụghị nwoke a bụ onye ahụ na-anọbu ala na-arịọ arịrịọ[a]?”
  to: Ya mere, ndị agbata obi na ndị na-ahụbu ya dị ka onye arịrịọ na-ekwu sị, “Ọ̀ bụghị nwoke a na-anọdụbu ala na-arịọ arịrịọ[a]?”
  rationale: The revision removes an unsupported possessive, uses a more natural speech introducer, and renders the final substantival participles directly as the customary former activity by which the man was identified. The phrase “dị ka onye arịrịọ” retains the contextual force of ὅτι προσαίτης ἦν without making a disputed causal claim. The footnote has been re-anchored to the phrase it explains and its Igbo has been streamlined.
