  text: οἱ οὖν γείτονες καὶ οἱ θεωροῦντες αὐτὸν τὸ πρότερον ὅτι ⸀προσαίτης ἦν ἔλεγον· Οὐχ οὗτός ἐστιν ὁ καθήμενος καὶ προσαιτῶν;
base_translation:
  language: en
  yaml_path: translation/nt/john/009/008.yaml
  text: So the neighbors[a], and those who had seen him before as a beggar, were saying, “Is this not the man who used to sit and beg?”
translation:
  language: ig
  text: Ya mere, ndị agbata obi na ndị na-ahụbu ya dị ka onye arịrịọ na-ekwu sị, “Ọ̀ bụghị nwoke a na-anọdụbu ala na-arịọ arịrịọ[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n'ụzọ soro okwu Grik nso karị, “Ọ̀ bụghị nwoke a na-anọdụ ala na-arịọ arịrịọ?” Okwu Grik ji participles (“na-anọdụ ala” na “na-arịọ arịrịọ”) mata ya site n’omume ọ na-emebu.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Ya mere
  rationale: Ọ na-ejikọta ihe a na ihe mere tupu ya, ma na-egosikwa na okwu ndị a sitere n'ihe ndị mmadụ hụrụ.
- source_word: γείτονες
  choice: ndị agbata obi ya
  rationale: Nke a bụ okwu Igbo doro anya maka ndị bi ya nso; itinye ‘ya’ na-eme ka njikọ ahụ bụrụ ihe e ji asụsụ Igbo eme nke ọma.
- source_word: θεωροῦντες αὐτὸν τὸ πρότερον
  choice: ndị hụburu ya
  rationale: ‘Hụburu’ na-egosi na ha ahụla ya tupu oge a ma mata ya; ọ na-enye echiche oge gara aga dị na τὸ πρότερον n'ụzọ dị nkenke.
- source_word: ὅτι προσαίτης ἦν
  choice: mgbe ọ bụ onye arịrịọ
  rationale: N'ebe a, ὅτι na-akọ ọnọdụ ha ji mara ya na mbụ. ‘Mgbe ọ bụ’ na-ezere ime ka okwu ahụ bụrụ ihe kpatara ha ji hụ ya, ma na-adịkwa ka Igbo nkịtị.
- source_word: ἔλεγον
  choice: nọ na-ekwu
  rationale: Ọ na-echekwa ọdịdị imperfect nke na-egosi okwu na-aga n'ihu ma ọ bụ nke ọtụtụ mmadụ nọ na-ekwu.
- source_word: Οὐχ οὗτός ἐστιν
  choice: Ọ̀ bụghị nwoke a bụ
  rationale: Ajụjụ a na-atụ anya azịza nkwenye. Usoro a doro anya ma bụrụkwa nke a na-anụ n'Igbo ugbu a.
- source_word: ὁ καθήμενος καὶ προσαιτῶν
  choice: onye ahụ na-anọbu ala na-arịọ arịrịọ
  rationale: Participles abụọ ahụ na-akọ omume ọ na-emebu nke ndị mmadụ ji amata ya. ‘Na-anọbu’ na-egosipụta omume gara aga a na-eme ugboro ugboro.
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe ma dị ùgwù. A họọrọ ‘onye arịrịọ’ na ‘na-arịọ arịrịọ’ ka a ghara iji okwu siri ike ma ọ bụ nke na-akparị mmadụ. Akara ụdaolu dị n'ajụjụ ‘Ọ̀’ na-enyere onye na-agụ aka ịmata ụdị ajụjụ ahụ.
