id: JHN.9.11
reference: John 9:11
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀπεκρίθη ⸀ἐκεῖνος· ⸂Ὁ ἄνθρωπος ὁ⸃ λεγόμενος Ἰησοῦς πηλὸν ἐποίησεν καὶ ἐπέχρισέν μου τοὺς ὀφθαλμοὺς καὶ εἶπέν μοι ⸀ὅτι Ὕπαγε εἰς ⸀τὸν Σιλωὰμ καὶ νίψαι· ἀπελθὼν ⸀οὖν καὶ νιψάμενος ἀνέβλεψα.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/011.yaml
  text: He answered[a], “The man called Jesus made mud and spread it on my eyes, and he told me, ‘Go to Siloam and wash.’ So I went away and washed[c][b], and I received my sight.”
translation:
  language: ig
  text: Ọ zara, sị, “Nwoke ahụ a na-akpọ Jizọs gwakọtara apịtị[a], tee ya n’anya m[b], sị m, ‘Gaa na Siloam saa.’ Ya mere, m gara saa, m wee malite ịhụ ụzọ[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ụrọ.” Okwu Grik πηλός nwere ike ịpụta apịtị ma ọ bụ ụrọ.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, “gbasaa ya n’anya m” ma ọ bụ “tee anya m.” Ngwaa Grik ahụ pụtara ite ma ọ bụ ịgbasa ihe n’elu ihe.
    reason: lexical_alternative
  - marker: c
    text: A pụkwara ịsụgharị ya, “m wee nweta ike ịhụ ụzọ.” N’ọnọdụ a, ngwaa Grik ahụ na-ekwu maka onye kpuru ìsì malitere ịhụ ụzọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη ἐκεῖνος
  choice: Ọ zara, sị
  rationale: Nke a bụ ụzọ Igbo nkịtị si webata azịza e kwuru kpọmkwem; ‘ọ’ na-anọchi ἐκεῖνος n’ụzọ na-adịghị arọ.
- source_word: Ὁ ἄνθρωπος ὁ λεγόμενος Ἰησοῦς
  choice: Nwoke ahụ a na-akpọ Jizọs
  rationale: Ọ na-echekwa otú onye ahụ si kọwaa Jizọs nanị dị ka nwoke e ji aha ahụ mara, na-etinyeghị nkwupụta okwukwe ọzọ n'okwu ya.
- source_word: πηλὸν ἐποίησεν
  choice: gwakọtara apịtị
  rationale: N'ọnọdụ a, πηλός bụ ngwakọta ala na mmiri ọnụ mmiri; ‘gwakọtara apịtị’ bụ Igbo doro anya ma na-egosi na o mere ngwakọta ahụ.
- source_word: ἐπέχρισέν μου τοὺς ὀφθαλμούς
  choice: tee ya n’anya m
  rationale: ἐπιχρίω na-egosi ite ma ọ bụ ịgbasa ihe n'elu ihe ọzọ; ‘tee ya’ na-akọ omume ahụ nke ọma n’enweghị echiche emume nke ‘ite mmanụ’ nwere ike iweta.
- source_word: εἶπέν μοι ὅτι
  choice: sị m
  rationale: Ụzọ Igbo dị nkenke ma bụrụ nke nkịtị iji webata iwu e kwuru kpọmkwem.
- source_word: Ὕπαγε εἰς τὸν Σιλωάμ
  choice: Gaa na Siloam
  rationale: Ọ na-esochi iwu ngagharị na aha ebe ahụ dịka isi mmalite si kwuo, n’etinyeghị ‘ọdọ mmiri’ nke adịghị n’amaokwu a.
- source_word: νίψαι
  choice: saa ahụ
  rationale: N'Igbo, ‘saa ahụ’ nwere ike ịpụta ịsa onwe onye ma ọ bụ akụkụ ahụ dabere n'ọnọdụ; ebe a ihe gbara ya gburugburu na-egosi ịsa ihe dị n’anya.
- source_word: ἀπελθὼν οὖν καὶ νιψάμενος
  choice: Ya mere, agara m saa ahụ
  rationale: ‘Ya mere’ na-egosipụta οὖν, ebe usoro ngwaa ndị ahụ na-egosi na ọ gara wee saa ahụ.
- source_word: ἀνέβλεψα
  choice: m wee hụ ụzọ
  rationale: N'ọnọdụ ọgwụgwọ onye kpuru ìsì, ἀναβλέπω pụtara inweta ike ịhụ ụzọ; okwu Igbo a bụ nke nkịtị ma ghara ikpebi ma ọ bụ inweta ọhụụ nke mbụ ma ọ bụ iweghachite ya.
theological_decisions:
- issue: Otú onye ahụ si kọwaa Jizọs
  choice: Nwoke ahụ a na-akpọ Jizọs
  alternative: Jizọs
  rationale: 'A hapụrụ ogo nghọta onye a gwọrọ n''oge a n''akụkọ ahụ: ọ kpọrọ Jizọs ‘nwoke,’ kama itinye utu aha dị elu n''ọnụ ya.'
- issue: Ma ἀνέβλεψα ọ pụtara inweta ọhụụ ma ọ bụ iweghachite ọhụụ
  choice: m wee hụ ụzọ
  alternative: m wee hụkwa ụzọ ọzọ
  rationale: Akụkọ ahụ kwuru na a mụrụ ya onye kpuru ìsì, ya mere ‘iweghachite’ nwere ike ịkọ ihe karịrị ihe ederede ahụ kwuru. ‘Hụ ụzọ’ na-echekwa ihe bụ isi—o nwetara ike ịhụ ihe.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke oge a, dị ùgwù ma dị mfe nghọta. E ji ‘Jizọs’ na ‘Siloam’ mee aha ndị ahụ. E zere okwu nwere ụda emume ebe ihe odide ahụ na-akọ omume anụ ahụ nkịtị.
