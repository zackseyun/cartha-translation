revisions:
- from: Ọ zara, sị, “Nwoke ahụ a na-akpọ Jizọs gwakọtara apịtị[a], tee ya n’anya m[b], sị m, ‘Gaa na Siloam saa ahụ.’ Ya mere, agara m saa ahụ, m wee hụ ụzọ[c].”
  to: Ọ zara, sị, “Nwoke ahụ a na-akpọ Jizọs gwakọtara apịtị[a], tee ya n’anya m[b], sị m, ‘Gaa na Siloam saa.’ Ya mere, m gara saa, m wee malite ịhụ ụzọ[c].”
  rationale: The revision clarifies the restoration of sight, improves the naturalness of the washing sequence, and corrects the lexical note so that it does not add an unspecified substance. It preserves the Greek narrative order, the unspecified washing object as contextually understood, and the speaker’s limited description of Jesus.
