- from: Anyị maara na Chineke agwawo Mosis okwu; ma nwoke a, anyị amaghị ebe o si bịa.[a]
  to: anyị maara na Chineke agwala Mosis okwu; ma nwoke a, anyị amaghị ebe o si.[a]
  rationale: The revision uses the idiomatic expression “agwala Mosis okwu” for God’s speaking to Moses and renders πόθεν ἐστίν as “ebe o si,” preserving the source text’s ambiguity about Jesus’ origin. The footnote supplies “ebe o si bịa” as an allowable, somewhat more concrete alternative while retaining the Johannine narrative nuance without resolving it theologically.
  reviewer_model: gpt-5.6-terra
