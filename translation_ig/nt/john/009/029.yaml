id: JHN.9.29
reference: John 9:29
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἡμεῖς οἴδαμεν ὅτι Μωϋσεῖ λελάληκεν ὁ θεός, τοῦτον δὲ οὐκ οἴδαμεν πόθεν ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/029.yaml
  text: We know that God has spoken to Moses[a], but as for this man, we do not know where he is from.
translation:
  language: ig
  text: anyị maara na Chineke agwala Mosis okwu; ma nwoke a, anyị amaghị ebe o si.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ebe o si bịa.” N’akwụkwọ Jọn, ajụjụ banyere ebe Jizọs si nwere ike ịpụta ma ebe o si n’ụzọ nkịtị ma ihe miri emi banyere mmalite ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμεῖς
  choice: Anyị
  rationale: Nnọchiaha a pụtara ìhè na Grik ma na-emesi ndị na-ekwu okwu ike n'ụzọ dị iche na nwoke ahụ a gwọrọ; “Anyị” na-eburu nke a n'ụzọ dị mma n'Igbo.
- source_word: οἴδαμεν
  choice: anyị maara / anyị amaghị
  rationale: A sụgharịrị ngwaa ahụ n'otu ụzọ n'okwu abụọ ahụ iji chekwaa nkwughachi na ọdịiche dị n'etiti ihe ha na-ekwu na ha maara na ihe ha na-ekwu na ha amaghị.
- source_word: Μωϋσεῖ
  choice: Mosis
  rationale: A gbasoro ụdị aha Mosis a na-ejikarị eme ihe n'Igbo.
- source_word: λελάληκεν
  choice: agwawo ... okwu
  rationale: Ụdị a na-egosi na Chineke kwuru okwu n'oge gara aga, okwu ahụ ka na-abụkwa eziokwu siri ike nye ndị na-ekwu ya; ọ na-egosipụta uru perfect tense nke Grik n'ụzọ ebumpụta ụwa n'Igbo.
- source_word: ὁ θεός
  choice: Chineke
  rationale: Nke a bụ aha kwesịrị ekwesị a na-ejikarị eme ihe maka Chineke n'Igbo, na-enweghị ịgbakwunye nkọwa na-adịghị na isiokwu.
- source_word: τοῦτον δὲ
  choice: ma nwoke a
  rationale: “Ma” na-egosi ọdịiche ahụ, “nwoke a” na-echekwa ụzọ ha si kewapụ Jizọs ma kwuo banyere ya n'ụzọ na-adịghị enye nsọpụrụ pụrụ iche.
- source_word: πόθεν ἐστίν
  choice: ebe o si bịa
  rationale: Nkebiokwu a bụ nke e ji eme ihe n'Igbo ma na-ahapụ okwu banyere isi mmalite Jizọs oghe, ma ọ̀ bụ ebe mmadụ si ma ọ bụ ihe miri emi gbasara mmalite na ikike ya.
theological_decisions:
- issue: Ihe πόθεν ἐστίν pụtara banyere ebe Jizọs si
  choice: ebe o si bịa
  alternative: ebe o si / mmalite ya
  rationale: Nhọrọ a anaghị ekpebi ma ndị na-ekwu okwu na-ekwu naanị banyere obodo ma ọ bụ agbụrụ Jizọs, ka okwu ahụ ò nwekwara nghọta miri emi banyere mmalite na ikike ya. Ọ na-echekwa nghọta nwere ọkwa abụọ na esemokwu nkà mmụta okpukpe dị n'akwụkwọ Jọn.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị ugbu a ma dị ùgwù. Ahịrịokwu ahụ dị mfe nghọta nye ọtụtụ ndị, na-enweghị itinye nkọwa nke otu ụka ma ọ bụ dozie mgbagwoju anya nke isiokwu ahụ.
