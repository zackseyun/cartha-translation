  text: εἰ μὴ ἦν οὗτος παρὰ θεοῦ, οὐκ ἠδύνατο ποιεῖν οὐδέν.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/033.yaml
  text: If this man were not from God[a], he could do nothing.
translation:
  language: ig
  text: A sị na nwoke a esiteghị na Chineke[a], ọ gaghị enwe ike ime ihe ọ bụla.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Ọ gwụla ma nwoke a sitere na Chineke.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ μὴ
  choice: A sị na ... -ghị
  rationale: N’Igbo, usoro a na-egosi ọnọdụ a na-ewere na ọ bụghị eziokwu ma na-edobe ọdịdị nkwubi okwu ahụ; ọ dị mfe nghọta karịa iji naanị ‘ọ gwụla ma.’
- source_word: ἦν
  choice: esiteghị
  rationale: N’ọnọdụ a, njikọ ya na παρά + genitive na-egosi ịbụ onye sitere n’ebe ụfọdụ; usoro ọnọdụ ‘A sị na ... esiteghị’ na-ebupụta echiche contrary-to-fact nke imperfect ahụ.
- source_word: οὗτος
  choice: nwoke a
  rationale: Ọ na-ezo aka n’ebe Jizọs nọ, nwoke a na-ekwu okwu banyere ya; ‘nwoke a’ bụ okwu Igbo doro anya ma bụrụkwa nke sitere n’okwu ahụ n’onwe ya.
- source_word: παρὰ θεοῦ
  choice: n’ebe Chineke nọ
  rationale: παρά tinyere genitive na-egosi isi iyi ma ọ bụ ebe mmadụ si; ‘esite n’ebe Chineke nọ’ na-echekwa nke a n’ebughị ụzọ kọwaa ya dịka ‘Chineke zitere ya.’
- source_word: οὐκ ἠδύνατο
  choice: ọ gaghị enwe ike
  rationale: N’usoro ọnọdụ a, nke a na-egosi enweghị ike ga-adị ma ọ bụrụ na ọnọdụ mbụ bụ eziokwu; ọ bụ Igbo eke ma doo anya.
- source_word: ποιεῖν
  choice: ime
  rationale: ‘Ime’ bụ okwu sara mbara kwekọrọ na ποιεῖν, na-enweghị itinye nkọwa pụrụ iche dịka ‘ịrụ ọrụ ebube.’
- source_word: οὐδέν
  choice: ihe ọ bụla
  rationale: Mgbe e jikọtara ya na nkwulu ‘ọ gaghị,’ ‘ihe ọ bụla’ na-egosi enweghị ike ime ihe ọbụla kpamkpam n’Igbo eke.
theological_decisions:
- issue: Ihe ‘esite n’ebe Chineke nọ’ pụtara banyere Jizọs
  choice: E debere okwu isi iyi ahụ dịka ‘esite n’ebe Chineke nọ.’
  alternative: ‘Chineke zitere ya’ ma ọ bụ ‘Chineke nyere ya ikike.’
  rationale: Okwu Grik ahụ na-egosi isi iyi ma nwee ike ịgụnye nkwado Chineke, ma ọ kọwaghị kpọmkwem izite ma ọ bụ ụdị ikike. Nsụgharị ahụ anaghị etinye nkọwa ozizi karịrị ihe amaokwu ahụ kwuru.
translation_notes:
  register: Asụsụ Igbo Izugbe dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji ‘A sị na ... ọ gaghị’ gosipụta ọnọdụ a na-ewere na ọ bụghị eziokwu, ebe ‘n’ebe Chineke nọ’ na-echekwa echiche isi iyi dị na παρά + genitive.
