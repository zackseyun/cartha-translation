    issue: The phrase “esiteghị n’ebe Chineke nọ” is excessively locative.
    rationale: παρὰ θεοῦ here denotes source/origin, not physical location beside or where God is. Standard Igbo “sitere na Chineke” expresses the intended source relation more directly and naturally.
