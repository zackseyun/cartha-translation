id: JHN.9.22
reference: John 9:22
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ταῦτα εἶπαν οἱ γονεῖς αὐτοῦ ὅτι ἐφοβοῦντο τοὺς Ἰουδαίους, ἤδη γὰρ συνετέθειντο οἱ Ἰουδαῖοι ἵνα ἐάν τις αὐτὸν ὁμολογήσῃ χριστόν, ἀποσυνάγωγος γένηται.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/022.yaml
  text: His parents said these things because they were afraid of the Jews[a], for the Jews had already agreed that if anyone confessed him as the Messiah[b], he would be put out of the synagogue.
translation:
  language: ig
  text: Ndị mụrụ ya kwuru ihe ndị a n’ihi na ha na-atụ ndị Juu[a] egwu, n’ihi na ndị Juu ekwekọrịtaworị na ọ bụrụ na onye ọ bụla ekwupụta na ọ bụ Mesaịa ahụ[b], a ga-achụpụ ya n’ụlọ nzukọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'N’asụsụ Grik: “ndị Juu.” N’ọnọdụ a, o yikarịrị ka okwu ahụ na-arụtụ aka ná ndị isi Juu, ọ bụghị ná ndị Juu niile n’enweghị iche.'
    reason: cultural_note
  - marker: b
    text: A pụkwara ịsị, “Kraịst ahụ,” ma ọ bụ, “kweta n’ihu ọha na ọ bụ Kraịst ahụ.”
    reason: alternative_reading
lexical_decisions:
- source_word: ταῦτα εἶπαν οἱ γονεῖς αὐτοῦ
  choice: Ndị mụrụ ya kwuru ihe ndị a
  rationale: “Ndị mụrụ ya” bụ ụzọ Igbo nkịtị si ekwu γονεῖς αὐτοῦ, ebe “ihe ndị a” na-edobe ụbara nke ταῦτα.
- source_word: ὅτι ἐφοβοῦντο
  choice: n’ihi na ha na-atụ ... egwu
  rationale: ὅτι na-enye ihe kpatara okwu ha; usoro “na-atụ ... egwu” na-egosikwa egwu ahụ nọgidere na-adị, dịka imperfect ἐφοβοῦντο si gosi.
- source_word: τοὺς Ἰουδαίους / οἱ Ἰουδαῖοι
  choice: ndị Juu
  rationale: Nke a na-edobe okwu Grik n’ahụ amaokwu ahụ, ma ihe e dere n’ala ala na-akọwa na n’ọnọdụ a o yikarịrị ka ọ na-arụtụ aka n’ụfọdụ ndị isi Juu nwere ikike ịchụ mmadụ n’ụlọ nzukọ.
- source_word: ἤδη ... συνετέθειντο
  choice: ekwekọrịtala
  rationale: Okwu a na-egosi nkwekọrịta e mere tupu ajụjụ a amalite. Nsonaazụ “-tala” na-eme ka ihe ahụ mereworị pụta ìhè n’Igbo.
- source_word: ἐάν τις αὐτὸν ὁμολογήσῃ χριστόν
  choice: ọ bụrụ na onye ọ bụla ekwupụta na ọ bụ ya bụ Mesaịa ahụ
  rationale: “Ekwupụta” na-egosi nkwupụta a na-eme n’ihu ọha; usoro “na ọ bụ ya bụ” bụ Igbo doro anya nke na-edobe Jizọs dị ka onye a na-ekwupụta na ọ bụ Mesaịa ahụ.
- source_word: ἀποσυνάγωγος γένηται
  choice: a ga-achụpụ onye ahụ n’ụlọ nzukọ
  rationale: Nke a na-egosi na a ga-ewepụ onye ahụ n’ọgbakọ ụlọ nzukọ, n’enweghị ịgbakwunye nkọwa okpukpe na-adịghị n’ederede.
theological_decisions:
- issue: Nsụgharị χριστός dị ka utu aha
  choice: Mesaịa ahụ
  alternative: Kraịst ahụ
  rationale: N’ebe a χριστός bụ utu aha onye Chineke tere mmanụ, ọ bụghị aha nkịtị. “Mesaịa ahụ” na-edobe ọnọdụ na atụmanya ndị Juu nke okwu ahụ.
- issue: Ndị οἱ Ἰουδαῖοι na-arụtụ aka na ha n’Oziọma Jọn
  choice: ndị Juu, tinyere nkọwa n’ala ala
  alternative: ndị isi Juu
  rationale: Ederede bụ isi na-edobe mkpụrụokwu Grik sara mbara. Nkọwa n’ala ala na-egosi na ndị nwere ikike ịchụ mmadụ n’ụlọ nzukọ—ya bụ, ndị isi Juu n’ọnọdụ a—ka o yikarịrị ka e bu n’obi, n’ihi ya a naghị ata ndị Juu niile ụta n’enweghị iche.
translation_notes:
  register: E ji Igbo Ọha kwụụrụ onwe ya, nke dị ugbu a ma dịkwa ugwu, mee nsụgharị ahụ. A hapụrụ nkwughachi “ndị Juu” dịka ọ dị na Grik, tinyere nkọwa iji gbochie nghọtahie; a họọrọ “ụlọ nzukọ” dị ka okwu ndị nkịtị ga-aghọta maka synagogue.
