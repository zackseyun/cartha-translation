    text: 'N’asụsụ Grik: “ndị Juu.” N’ọnọdụ a, o yikarịrị ka okwu ahụ na-arụtụ aka ná ndị isi Juu, ọ bụghị ná ndị Juu niile n’enweghị iche.'
    reason: cultural_note
  - marker: b
    text: A pụkwara ịsị, “Kraịst ahụ,” ma ọ bụ, “kweta n’ihu ọha na ọ bụ Kraịst ahụ.”
    reason: alternative_reading
  revision_rationale: The revision explicitly conveys 'already' with ekwekọrịtaworị and slightly streamlines the conditional clauses for idiomatic Standard Igbo. It preserves the source's scope, ambiguity concerning οἱ Ἰουδαῖοι in the main text, and the titular sense of χριστόν.
