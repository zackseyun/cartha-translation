id: JHN.9.31
reference: John 9:31
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸀οἴδαμεν ὅτι ⸂ἁμαρτωλῶν ὁ θεὸς⸃ οὐκ ἀκούει, ἀλλ’ ἐάν τις θεοσεβὴς ᾖ καὶ τὸ θέλημα αὐτοῦ ποιῇ τούτου ἀκούει.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/031.yaml
  text: We know that God does not listen to sinners; but if anyone is God-fearing and does his will[a], he listens to him.
translation:
  language: ig
  text: Anyị maara na Chineke anaghị ege ndị mmehie ntị; ma ọ bụrụ na onye ọ bụla na-atụ egwu Chineke[a], na-emekwa uche ya, Chineke na-ege onye ahụ ntị.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “onye na-efe Chineke.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἴδαμεν
  choice: Anyị maara
  rationale: Ụdị perfect οἶδα nwere nghọta nke ugbu a n'asụsụ Grik Koine; “Anyị maara” bụ Igbo doro anya ma bụrụkwa nke e ji ekwu okwu n'ụzọ nkịtị.
- source_word: ἁμαρτωλῶν
  choice: ndị mmehie
  rationale: Genitive plural a na-egosi ìgwè mmadụ okwu ahụ metụtara. “Ndị mmehie” na-echekwa ike okwu ahụ n'ihe gbasara omume na okpukpe.
- source_word: ἀκούει
  choice: na-ege ... ntị
  rationale: N'ebe a, ἀκούω pụtara ọ bụghị naanị ịnụ ụda, kama ige mmadụ ntị n'ụzọ ihu ọma ma ọ bụ ịnabata arịrịọ ya. “Ige ntị” na-egosi nke a n'Igbo n'emeghị ka ọ bụrụ kpọmkwem “ịza ekpere.”
- source_word: θεοσεβὴς
  choice: na-atụ egwu Chineke
  rationale: θεοσεβής na-akọwa onye na-asọpụrụ Chineke ma na-atụ egwu ya n'ụzọ nsọ. Nkebi a na-echekwa aha Chineke na nghọta sara mbara nke nsọpụrụ, kama ime ka okwu ahụ bụrụ naanị ofufe emume.
- source_word: τὸ θέλημα αὐτοῦ ποιῇ
  choice: na-emekwa uche ya
  rationale: Nke a bụ ụzọ Igbo sitere n'okike si kwuo idiom ποιεῖν τὸ θέλημα, ya bụ ime ihe Chineke chọrọ.
- source_word: τούτου ἀκούει
  choice: Chineke na-ege onye ahụ ntị
  rationale: τούτου na-alaghachi n'ụzọ pụtara ìhè n'onye na-atụ egwu Chineke. Ikwughachi “Chineke” na “onye ahụ” na-eme ka ndị okwu na-arụtụ aka na ha doo anya n'Igbo ma na-echekwa otu nghọta nke ἀκούει.
- source_word: ἀλλ’ ἐάν τις
  choice: ma ọ bụrụ na onye ọ bụla
  rationale: Nke a na-echekwa ntụgharị megidere ihe e kwuru na mbụ na onye a na-akọwaghị kpọmkwem.
theological_decisions:
- issue: Ókè nkwupụta ahụ bụ “Chineke anaghị ege ndị mmehie ntị”
  choice: E depụtara nkwupụta ahụ dịka onye na-ekwu okwu siri kwuo ya, n'emeghị ka ike ya belata ma ọ bụ tinye nkọwa ozizi ọzọ.
  alternative: “Chineke anaghị anụ ekpere ndị mmehie” ma ọ bụ “Chineke anaghị anabata ndị mmehie.”
  rationale: Grik kwuru naanị na Chineke anaghị “ege” ndị mmehie ntị, ma were nke ahụ tụnyere ige onye na-atụ egwu Chineke ma na-eme uche ya ntị. Nsụgharị ahụ kwesịrị ịhapụ esemokwu nkà mmụta okpukpe dị n'okwu ahụ kama idozi ya n'ụzọ ederede ahụ na-ekwughị.
- issue: Nsụgharị θεοσεβής
  choice: onye na-atụ egwu Chineke
  alternative: onye na-efe Chineke
  rationale: Okwu ahụ nwere ike ịpụta ha abụọ, ma “onye na-atụ egwu Chineke” na-echekwa nghọta sara mbara nke nsọpụrụ na egwu nsọ. A na-edebe nhọrọ ọzọ n'okpuru ala.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Nhazi ahịrịokwu ahụ nọ nso n'usoro Grik, ma e mere ka ndị nnọchiaha doo anya site n'ikwughachi “Chineke” na “onye ahụ.”
