  text: ⸀Ἤκουσεν Ἰησοῦς ὅτι ἐξέβαλον αὐτὸν ἔξω, καὶ εὑρὼν αὐτὸν ⸀εἶπεν· Σὺ πιστεύεις εἰς τὸν υἱὸν τοῦ ⸀ἀνθρώπου;
base_translation:
  language: en
  yaml_path: translation/nt/john/009/035.yaml
  text: Jesus heard that they had thrown him out[a], and when he found him, he said, “Do you believe in the Son of Man?”
translation:
  language: ig
  text: Jizọs nụrụ na ha achụpụla ya n’èzí; mgbe ọ chọtara ya, ọ sịrị ya, “Ì kwere n’Nwa nke Mmadụ?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξέβαλον ... ἔξω
  choice: ha achụpụla ya
  rationale: Ngwakọta okwu a na-ekwusi ike na e wepụrụ nwoke ahụ n’etiti ha. “Achụpụla ya” bụ Igbo dị ndụ nke na-egosi nchụpụ na mwepụ n’obodo.
- source_word: εὑρὼν
  choice: Mgbe ọ chọtara ya
  rationale: A sụgharịrị participle a dịka nkebiokwu oge iji gosi usoro ihe mere n’Igbo eke.
- source_word: Σὺ πιστεύεις
  choice: Ì kwere
  rationale: “Ikwere” bụ okwu Igbo nkịtị maka πιστεύω n’ajụjụ a; ọdịdị ajụjụ na onye a na-agwa kpọmkwem na-eburu nkwusi ike nke Σὺ.
- source_word: εἰς
  choice: n’
  rationale: Mgbe ọ na-eso “ikwere,” “n’” na-egosi okwukwe ma ọ bụ ntụkwasị obi e tinyere n’ebe mmadụ nọ.
- source_word: υἱὸν τοῦ ἀνθρώπου
  choice: Oke Nwa nke Mmadụ
  rationale: A họọrọ aha a maara nke ọma n’Igbo maka utu aha a, iji chekwaa ọrụ ya dịka utu aha na njikọ ya na Daniel 7 na ojiji Jọn.
theological_decisions:
- issue: Aha Kraịst dị n’ajụjụ ahụ
  choice: Oke Nwa nke Mmadụ
  alternative: Nwa Chineke
  rationale: SBLGNT nwere ἀνθρώπου (“Mmadụ”), ya mere nke ahụ dị n’isi ederede. Ọdịiche “Nwa Chineke” dị mkpa n’akụkọ nnyefe ederede, ya mere e debere ya n’ala peeji kama iji ya dochie isi ederede.
translation_notes:
  register: Igbo Izugbe nke oge a, dị ugwu ma doo onye nkịtị anya. E ji “ọ sịrị ya” mee ka ndị nnọchiaha abụọ ahụ doo anya; e chekwara utu aha ahụ na ọdịiche ederede ya.
