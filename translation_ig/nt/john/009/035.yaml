revisions:
- from: Jizọs nụrụ na ha achụpụla ya[a]. Mgbe ọ chọtara ya, ọ sịrị ya, “Ì kwere n’Oke Nwa nke Mmadụ?”
  to: Jizọs nụrụ na ha achụpụla ya n’èzí; mgbe ọ chọtara ya, ọ sịrị ya, “Ì kwere n’Nwa nke Mmadụ?”
  rationale: The revision corrects the principal christological title to “Nwa nke Mmadụ,” avoiding the added meaning in “Oke Nwa.” It also makes the emphatic expulsion explicit while retaining the SBLGNT reading and the significant “Son of God” variant in a footnote.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T06:23:37Z'
review_pass:
  verdict: revise
  source_fidelity: The draft follows the SBLGNT reading and preserves the temporal sequence. However, “Oke Nwa nke Mmadụ” does not accurately represent the established titular expression υἱὸς τοῦ ἀνθρώπου; “oke nwa” normally means an eldest child or chief/great child and adds meaning absent from the Greek. The emphatic expulsion (ἐξέβαλον ... ἔξω) is more fully represented by adding “n’èzí.”
  naturalness: The revised wording is natural, clear Standard Igbo. “Ha achụpụla ya n’èzí” idiomatically conveys forceful exclusion, and “Ì kwere n’Nwa nke Mmadụ?” is a natural direct question.
  terminology: Replace “Oke Nwa nke Mmadụ” with “Nwa nke Mmadụ” in both text and textual-variant footnote. This preserves the conventional Christological title without importing the unrelated sense “eldest/great son.”
  issues:
  - severity: high
    issue: The title “Oke Nwa nke Mmadụ” is inaccurate.
    rationale: “Oke Nwa” introduces a sense such as eldest or great son, which is not present in υἱὸν τοῦ ἀνθρώπου. “Nwa nke Mmadụ” is the appropriate title and maintains the source expression’s ambiguity and resonance.
  - severity: low
    issue: The emphatic adverb ἔξω is not explicit in the draft.
    rationale: Although “achụpụla ya” already denotes expulsion, adding “n’èzí” better reflects the Greek’s emphatic “threw/cast him out.”
  revised_text: Jizọs nụrụ na ha achụpụla ya n’èzí; mgbe ọ chọtara ya, ọ sịrị ya, “Ì kwere n’Nwa nke Mmadụ?”
  revised_footnotes:
  - marker: a
    text: Ụfọdụ akwụkwọ aka ochie nwere “Nwa Chineke” n’ọnọdụ “Nwa nke Mmadụ.”
    reason: textual_variant
  revision_rationale: The revision corrects the principal christological title to “Nwa nke Mmadụ,” avoiding the added meaning in “Oke Nwa.” It also makes the emphatic expulsion explicit while retaining the SBLGNT reading and the significant “Son of God” variant in a footnote.
