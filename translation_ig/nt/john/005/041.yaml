  text: δόξαν παρὰ ἀνθρώπων οὐ λαμβάνω,
base_translation:
  language: en
  yaml_path: translation/nt/john/005/041.yaml
  text: I do not receive glory from men[b][a],
translation:
  language: ig
  text: Anaghị m anata otuto site n'aka ndị mmadụ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “nsọpụrụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δόξαν
  choice: otuto
  rationale: N'ebe a, δόξα pụtara nsọpụrụ, otuto, ma ọ bụ aha ọma ndị ọzọ na-enye. “Otuto” bụ okwu Igbo doro anya ma kwekọọ na echiche nke mmadụ ito mmadụ; ihe odide ala peeji na-egosi “nsọpụrụ” dị ka ụzọ ọzọ.
- source_word: παρὰ ἀνθρώπων
  choice: site n'aka ndị mmadụ
  rationale: παρά ya na genitive na-egosi ebe ihe si abịa. ἀνθρώπων nwere ike ịgụnye mmadụ niile, ya mere “ndị mmadụ” bụ ntụgharị Igbo nkịtị na nke ziri ezi na-enweghị ime ka okwu ahụ bụrụ naanị ụmụ nwoke.
- source_word: οὐ λαμβάνω
  choice: Anaghị m anata
  rationale: λαμβάνω pụtara ịnata ma ọ bụ ịnabata. “Anata” na-edobe ihe okwu Grik kwuru kpọmkwem, ebe oge ugbu a na-apụta nke ọma n'usoro “Anaghị m...”
theological_decisions:
- issue: Ihe okwu Jizọs banyere otuto mmadụ pụtara
  choice: E debere ya dị ka nkwupụta na ọ naghị anata otuto site n'aka ndị mmadụ, n'enweghị ịgbakwunye na ọ “na-achọghị” ya.
  alternative: Ịkọwa ya hoo haa dị ka na ozi ya ma ọ bụ onye ọ bụ adabereghị n'otuto mmadụ, ma ọ bụ dị ka na ọ dịghị mgbe ọ bụla ọ na-anata nsọpụrụ n'aka mmadụ ọ bụla.
  rationale: Ihe gbara amaokwu ahụ gburugburu na-egosi na Jizọs anaghị adabere n'otuto mmadụ maka nkwado, ma okwu Grik n'onwe ya kwuru “anaghị m anata,” ọ bụghị “anaghị m achọ.” Ya mere, ntụgharị ahụ na-edobe nghọta na esemokwu dị n'okwu ahụ n'enweghị ịkọwafe ya.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji “ndị mmadụ” mee ka ἀνθρώπων bụrụ aha izugbe maka ụmụ mmadụ dịka ọ na-arụ ọrụ n'ọnọdụ a. Akara [a] dị n'ahịrị isi ma kwekọọ na ihe odide ala peeji.
