  text: ἠρώτησαν ⸀οὖν αὐτόν· Τίς ἐστιν ὁ ἄνθρωπος ὁ εἰπών σοι· ⸀Ἆρον καὶ περιπάτει;
base_translation:
  language: en
  yaml_path: translation/nt/john/005/012.yaml
  text: So they asked him[a], “Who is the man who said to you, ‘Pick it up and walk’?”
translation:
  language: ig
  text: Ya mere, ha jụrụ ya, sị, “Ònye bụ nwoke ahụ gwara gị, ‘Bulie ya, jee ije’?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'N’asụsụ Greek: “Bulie, jee ije.” E kwughị ihe a ga-ebuli n’amaokwu a; ihe a na-ekwu bụ ute ma ọ bụ ihe ndina nwoke ahụ dina n’elu ya, dị ka amaokwu ndị bu ụzọ si gosi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠρώτησαν
  choice: ha jụrụ
  rationale: Ọ bụ aorist active indicative, onye nke atọ n’ọnụọgụgụ; ‘ha jụrụ’ bụ okwu Igbo doro anya nke na-adịghị etinye iwe ma ọ bụ iyi egwu na-adịghị n’ihe odide ahụ.
- source_word: οὖν
  choice: Ya mere
  rationale: Ọ na-ejikọta ajụjụ a na ihe mere n’amaokwu bu ya ụzọ ma gosipụta nsonaazụ echiche ahụ.
- source_word: αὐτόν
  choice: ya
  rationale: Nnọchiaha a na-ezo aka n’ nwoke ahụ a gwọrọ.
- source_word: Τίς ἐστιν ὁ ἄνθρωπος
  choice: Ònye bụ nwoke ahụ
  rationale: Nke a na-enye ajụjụ Greek ahụ n’ụzọ ebumpụta ụwa n’Igbo ma doo anya na a na-ajụ maka otu nwoke kpọmkwem.
- source_word: ὁ εἰπών σοι
  choice: gwara gị
  rationale: N’agbanyeghị na εἰπών pụtara ‘kwuru,’ ‘gwara gị’ bụ ụzọ Igbo si ekwu okwu a n’ụzọ nkịtị ma na-echekwa onye natara okwu ahụ.
- source_word: Ἆρον
  choice: Bulie ya
  rationale: Ọ bụ iwu aorist nke αἴρω. Ihe a ga-ebuli apụtaghị kpọmkwem n’amaokwu a, ya mere e jiri nnọchiaha ‘ya’ mee ka okwu ahụ bụrụ Igbo zuru oke, ebe ihe ọ na-ezo aka na ya sitere n’amaokwu ndị bu ụzọ.
- source_word: καὶ περιπάτει
  choice: jegharịa
  rationale: Ọ bụ iwu present nke περιπατέω. ‘Jegharịa’ na-enye echiche nke ịga ije n’ụzọ Igbo dị mfe, n’etinyeghị nkọwa gabigara ihe aspect Greek chọrọ.
