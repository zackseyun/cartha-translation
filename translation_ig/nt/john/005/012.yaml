translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E chekwara usoro ajụjụ ahụ na njikọ ‘Ya mere,’ ma e tinyeghị echiche nke iwe ma ọ bụ ebubo nke Greek ekwughị.
