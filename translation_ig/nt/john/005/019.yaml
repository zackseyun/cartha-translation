  to: Ya mere, Jizọs zara ha, sị, “N’ezie, n’ezie, ana m asị unu, Ọkpara enweghị ike ime ihe ọ bụla site n’onwe ya, ọ gwụla ma ọ hụrụ Nna ka ọ na-eme ihe[a]; n’ihi na ihe ọ bụla Nna ahụ na-eme[b], ihe ndị a ka Ọkpara na-emekwa n’otu ụzọ ahụ.”
