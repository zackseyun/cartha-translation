id: JHN.5.19
reference: John 5:19
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἀπεκρίνατο οὖν ὁ Ἰησοῦς καὶ ⸀ἔλεγεν αὐτοῖς· Ἀμὴν ἀμὴν λέγω ὑμῖν, οὐ δύναται ὁ υἱὸς ποιεῖν ἀφ’ ἑαυτοῦ οὐδὲν ⸀ἐὰν μή τι βλέπῃ τὸν πατέρα ποιοῦντα· ἃ γὰρ ἂν ἐκεῖνος ποιῇ, ταῦτα καὶ ὁ υἱὸς ὁμοίως ποιεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/019.yaml
  text: So Jesus answered and said to them[a], “Truly, truly, I say to you, the Son is not able to do anything from himself unless he sees the Father doing it; for whatever that one does[b], these things the Son also does likewise.”
translation:
  language: ig
  text: Ya mere, Jizọs zara ha, sị, “N’ezie, n’ezie, ana m asị unu, Ọkpara enweghị ike ime ihe ọ bụla site n’onwe ya, ọ gwụla ma ọ hụrụ Nna ka ọ na-eme ihe[a]; n’ihi na ihe ọ bụla Nna ahụ na-eme[b], ihe ndị a ka Ọkpara na-emekwa n’otu ụzọ ahụ.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ikwu ya n’ụzọ Igbo dị mfe karị, “Ọkpara apụghị ime ihe ọ bụla n’onwe ya, ma e wezụga ihe ọ hụrụ Nna ka ọ na-eme.”
    reason: lexical_alternative
  - marker: b
    text: “Nna ahụ” na-egosipụta nkwusi ike dị na okwu Grik ahụ, nke na-ekewa Nna na Ọkpara n’usoro ahịrịokwu a.
    reason: lexical_clarification
lexical_decisions:
- source_word: Ἀπεκρίνατο οὖν ὁ Ἰησοῦς καὶ ἔλεγεν αὐτοῖς
  choice: Ya mere, Jizọs zara ha, sị
  rationale: “Ya mere” na-egosi njikọ οὖν na ihe bu ụzọ; “zara ha, sị” bụ ụzọ Igbo dị ire ụtọ isi gosipụta ἀπεκρίνατο ... καὶ ἔλεγεν n’akọghị okwu ahụ n’ụzọ siri ike ma ọ bụ nke na-adịghị eke.
- source_word: Ἀμὴν ἀμὴν λέγω ὑμῖν
  choice: N’ezie, n’ezie, ana m asị unu
  rationale: E debere nkwugharị ahụ iji chekwaa nkwenye na ịdị arọ nke okwu Jizọs, ebe “ana m asị unu” na-egosipụta okwu ọ na-ekwu ugbu a.
- source_word: οὐ δύναται ὁ υἱὸς ποιεῖν ... οὐδὲν
  choice: Ọkpara enweghị ike ime ihe ọ bụla
  rationale: Nke a na-egosipụta echiche nke δύναται dị ka ikike, ma na-ejikwa usoro okwu Igbo doro anya.
- source_word: ἀφ’ ἑαυτοῦ
  choice: site n’onwe ya
  rationale: Ọ na-echekwa echiche nke isi mmalite ma ọ bụ omume sitere n’onwe ya, n’etinyeghị echiche ọzọ dịka nanị ikike ma ọ bụ ọchịchọ.
- source_word: ἐὰν μή τι βλέπῃ τὸν πατέρα ποιοῦντα
  choice: ọ gwụla ma ọ hụrụ Nna ka ọ na-eme ihe
  rationale: “Ọ gwụla ma” na-echekwa ọnọdụ/nhapụ dị na ἐὰν μή; “na-eme ihe” na-ahapụ τι ka ọ bụrụ ihe a na-akọwaghị kpọmkwem.
- source_word: ἃ γὰρ ἂν ἐκεῖνος ποιῇ
  choice: n’ihi na ihe ọ bụla Nna ahụ na-eme
  rationale: “Ihe ọ bụla” na-egosipụta ịdị n’ozuzu nke ἃ ... ἂν; “Nna ahụ” na-eme ka onye ἐκεῖνος na-ezo aka na ya doo anya ma na-echekwa ntakịrị ike demonstrative ahụ.
- source_word: ταῦτα καὶ ὁ υἱὸς ὁμοίως ποιεῖ
  choice: Ọkpara na-emekwa otu ihe ahụ n’otu aka ahụ
  rationale: Nke a na-echekwa ma καί (“na-emekwa”) ma ὁμοίως (“n’otu aka ahụ”), ya mere o gosipụta nkwekọrịta zuru oke nke omume ndị ahụ.
theological_decisions:
- issue: Otu e si akọwa enweghị ike Ọkpara ime ihe site n’onwe ya n’ebugharị ederede gaa n’echiche nke ịdị ala n’ụdị onye ọ bụ
  choice: Ọkpara enweghị ike ime ihe ọ bụla site n’onwe ya
  alternative: Ọkpara apụghị ime ihe ọ bụla nanị ya
  rationale: Nhọrọ a na-echekwa nkwupụta siri ike nke Grik banyere enweghị omume nọọrọ onwe ya, ma ọ naghị agbakwụnye nkọwa banyere ọdịdị Ọkpara nke amaokwu ahụ n’onwe ya na-akọwaghị.
- issue: Aha mmekọrịta ὁ υἱός na ὁ πατήρ
  choice: Ọkpara / Nna
  alternative: nwa / nna ya
  rationale: N’ebe a, okwu ndị a bụ aha mmekọrịta pụrụ iche nke Jizọs na Nna; ide ha dị ka “Ọkpara” na “Nna” na-enyere onye na-agụ aka ịhụ ọrụ ha n’amaokwu a n’etinyeghị nnọchiaha nke na-adịghị na Grik.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. “N’ezie, n’ezie” na-echekwa ụdị nkwupụta pụrụ iche nke Jọn; “site n’onwe ya” dị ntakịrị formal iji debe echiche ἀφ’ ἑαυτοῦ, ebe nkọwa ala peeji na-enye usoro Igbo dị mfe karị.
