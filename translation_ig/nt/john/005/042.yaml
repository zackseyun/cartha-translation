  text: ἀλλὰ ἔγνωκα ὑμᾶς ὅτι τὴν ἀγάπην τοῦ θεοῦ οὐκ ἔχετε ἐν ἑαυτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/042.yaml
  text: 'But I know you: you do not have the love of God in yourselves.'
translation:
  language: ig
  text: 'Ma, amaara m unu: unu enweghị ịhụnanya Chineke[a] n''ime onwe unu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịghọta ya kpọmkwem dịka, “ịhụ Chineke n’anya n'ime onwe unu.” Okwu Grik ahụ nwekwara ike ịpụta n'ụzọ sara mbara dịka “ịhụnanya sitere na Chineke” ma ọ bụ “ịhụnanya Chineke nwere.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλὰ
  choice: Ma
  rationale: Ọ na-egosi nnukwu ọdịiche n'etiti ihe a na ihe Jizọs kwuru tupu ya; “Ma” bụ ụzọ Igbo dị mkpirikpi ma dịkwa n'okike isi kwuo ya.
- source_word: ἔγνωκα
  choice: amaara m
  rationale: Oge perfect Grik a na-egosi ihe onye ahụ bịara mara nke ka bụ ihe o ji n'aka ugbu a; “amaara m” na-egosipụta ọnọdụ ahụ nke ọma n'Igbo.
- source_word: ὑμᾶς
  choice: unu
  rationale: Ọ bụ ihe ngwaa “amaara m” na-emetụta, bụrụkwa nnọchiaha onye nke abụọ n'ọtụtụ.
- source_word: ὅτι
  choice: ':'
  rationale: Akara kọlọn na-ewebata ọdịnaya nke ihe Jizọs maara banyere ha n'ụzọ Igbo doro anya, na-enweghị ime ka ahịrịokwu ahụ sie ike.
- source_word: τὴν ἀγάπην τοῦ θεοῦ
  choice: ịhụnanya Chineke
  rationale: Nkebiokwu a na-edobe njikọ genitive nke Grik n'ebughị ụzọ kpebie ma ọ bụ ịhụnanya a na-ahụ Chineke, ịhụnanya sitere na Chineke, ma ọ bụ ịhụnanya nke Chineke.
- source_word: οὐκ ἔχετε
  choice: unu enweghị
  rationale: 'Nke a na-egosi ọnọdụ ha nọ na ya ugbu a: ịhụnanya ahụ adịghị ha.'
- source_word: ἐν ἑαυτοῖς
  choice: n'ime onwe unu
  rationale: Ọ na-edobe echiche reflexive nke Grik, na-egosi na ịhụnanya ahụ adịghị n'ime ha.
theological_decisions:
- issue: Ihe genitive pụtara na “τὴν ἀγάπην τοῦ θεοῦ”
  choice: E debere ya dịka “ịhụnanya Chineke” n'isiokwu, n'ekpebighị ma ọ bụ ịhụnanya maka Chineke ka ọ bụ ịhụnanya nke sitere na Chineke ma ọ bụ nke Chineke nwere.
  alternative: “ịhụnanya unu nwere n'ebe Chineke nọ” ma ọ bụ “ịhụnanya sitere na Chineke / ịhụnanya Chineke nwere”
  rationale: τοῦ θεοῦ nwere nghọta karịrị otu. Ihe gbara amaokwu ahụ gburugburu na-akwado nke ukwuu echiche nke ịhụ Chineke n'anya, ma okwu Grik ahụ n'onwe ya anaghị amachibido ya naanị na nghọta ahụ. Ya mere, a hapụrụ esemokwu nkọwa ahụ n'isiokwu ma kọwaa ya n'okpuru.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. “Ịhụnanya Chineke” na-edobe mgbagwoju anya dị n'okwu Grik, ebe “n'ime onwe unu” na-edobe ike reflexive nke isi mmalite ahụ.
