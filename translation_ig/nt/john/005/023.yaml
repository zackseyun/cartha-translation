id: JHN.5.23
reference: John 5:23
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἵνα πάντες τιμῶσι τὸν υἱὸν καθὼς τιμῶσι τὸν πατέρα. ὁ μὴ τιμῶν τὸν υἱὸν οὐ τιμᾷ τὸν πατέρα τὸν πέμψαντα αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/023.yaml
  text: so that all may honor the Son just as they honor the Father. The one who does not honor the Son does not honor the Father who sent him.
translation:
  language: ig
  text: ka mmadụ niile wee sọpụrụ Nwa ahụ dị nnọọ ka ha si sọpụrụ Nna ahụ. Onye na-adịghị asọpụrụ Nwa ahụ anaghị asọpụrụ Nna ahụ, bụ onye zitere ya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἵνα
  choice: ka ... wee
  rationale: Ụdị a na-egosi nzube ma ọ bụ ihe a chọrọ ka o si na ya pụta, ma bụrụkwa okwu Igbo dị ugbu a ma doo anya.
- source_word: πάντες
  choice: mmadụ niile
  rationale: Nke a na-eme ka ‘niile’ bụrụ ndị mmadụ n'ụzọ doro anya, dịka ihe Greek ahụ pụtara n’ebe a.
- source_word: τιμῶσι / τιμῶν / τιμᾷ
  choice: na-asọpụrụ / asọpụrụ
  rationale: ‘Ịsọpụrụ’ na-egosi inye onye nsọpụrụ na ùgwù kwesịrị ya. Iji otu mgbọrọgwụ okwu ugboro niile na-echekwa nkwughachi na ntụnyere dị n’amaokwu ahụ.
- source_word: τὸν υἱὸν
  choice: Ọkpara ahụ
  rationale: ‘Ọkpara’ bụ aha kwesịrị ekwesị maka Ọkpara n’okwu Jọn a; ‘ahụ’ na-anọchi article Greek ma na-egosi onye a kpọtụrụ aha kpọmkwem.
- source_word: καθὼς
  choice: dị nnọọ ka
  rationale: Nke a na-echekwa ntụnyere siri ike nke Greek, ọ bụghị naanị myirịta na-adịghị ike.
- source_word: τὸν πατέρα
  choice: Nna ahụ
  rationale: N’ebe a, ọ bụ aha e ji akpọ Chineke Nna kpọmkwem. Mkpụrụedemede ukwu na-enyere onye na-agụ aka ịhụ nke ahụ.
- source_word: ὁ μὴ τιμῶν
  choice: Onye na-adịghị asọpụrụ
  rationale: Nke a bụ ụzọ Igbo ebumpụta ụwa isi mee participle nwere article ka ọ bụrụ okwu gbasara onye ọ bụla na-emeghị ihe ahụ.
- source_word: τὸν πέμψαντα αὐτόν
  choice: onye zitere ya
  rationale: Nkebi a na-akọwa Nna ahụ dịka onye zitere Ọkpara; relative clause Igbo a dị mfe ma na-echekwa njikọ ahụ.
- source_word: πέμψαντα
  choice: zitere
  rationale: ‘Izipụ’ bụ isi ihe πέμπω pụtara; ọ naghị agbakwụnye echiche pụrụ iche dịka inye ọrụ ikike.
theological_decisions:
- issue: Ike ntụnyere dị n’etiti ịsọpụrụ Ọkpara na ịsọpụrụ Nna
  choice: A sụgharịrị καθὼς dịka ‘dị nnọọ ka,’ nke na-echekwa nha siri ike nke nsọpụrụ ahụ.
  alternative: ‘dị ka’
  rationale: Greek na-eme ntụnyere siri ike. Nsụgharị ahụ ekwesịghị ime ka ọ daa mbà, ma ọ gaghịkwa etinye okwu nkwenkwe e dere mgbe e mesịrị n’ime amaokwu ahụ.
- issue: Iji mkpụrụedemede ukwu dee Ọkpara na Nna
  choice: E dere ‘Ọkpara’ na ‘Nna’ na mkpụrụedemede ukwu dịka aha nsọ na aha mmekọrịta kpọmkwem n’ebe a.
  alternative: ọkpara na nna
  rationale: Greek ochie anaghị ekpebi capitalization a, ma ihe gbara okwu ahụ gburugburu na-egosi na ọ na-ekwu maka Jizọs na Chineke Nna. Usoro Igbo a na-enyere nghọta aka n’etinyeghị ọdịnaya ọhụrụ.
translation_notes:
  register: Asụsụ ahụ bụ Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E chekwara nkwughachi ‘asọpụrụ’ na nhazi yiri ibe ya nke ahịrịokwu Greek. A họọrọ ‘Ọkpara’ kama ‘Nwa’ iji gosipụta aha mmekọrịta pụrụ iche n’okwu a n’enweghị ịgbakwunye nkọwa ụka pụrụ iche.
