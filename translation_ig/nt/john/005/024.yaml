  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἀμὴν ἀμὴν λέγω ὑμῖν ὅτι ὁ τὸν λόγον μου ἀκούων καὶ πιστεύων τῷ πέμψαντί με ἔχει ζωὴν αἰώνιον, καὶ εἰς κρίσιν οὐκ ἔρχεται ἀλλὰ μεταβέβηκεν ἐκ τοῦ θανάτου εἰς τὴν ζωήν.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/024.yaml
  text: Truly[a], truly, I say to you, whoever hears my word and believes him who sent me has eternal life, and does not come into judgment[b], but has passed from death into life.
translation:
  language: ig
  text: 'N’ezie, n’ezie, ana m agwa unu: onye ọ bụla na-anụ okwu m ma kwere Onye zitere m nwere ndụ ebighị ebi. Onye ahụ adịghị abata n’ikpe[a]; kama, o esiwo n’ọnwụ banye ná ndụ[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “Ọ dịghị abata n’ikpe ọmụma.” Okwu Grik κρίσις nwere ike ịpụta “ikpe” n’ozuzu ya ma ọ bụ, dịka ọnọdụ okwu a si dị, ikpe na-adịghị mma megide mmadụ.
    reason: lexical_alternative
  - marker: b
    text: 'Ngwaa Grik e ji mee ihe ebe a na-egosi mgbanwe e mezuru nke nsonaazụ ya ka dịgide: “o esiwo” ma ọ bụ “o agafewo” n’ọnwụ banye ná ndụ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀμὴν ἀμὴν
  choice: N’ezie, n’ezie
  rationale: Nke a na-egosipụta nkwusi ike dị n’okwu mmeghe ahụ e kwuru ugboro abụọ, ma na-ada ka Igbo nkịtị, dị ùgwù.
- source_word: λέγω ὑμῖν
  choice: ana m agwa unu
  rationale: Ọ na-egosipụta okwu Jizọs na-agwa ọtụtụ ndị ozugbo, n’ụzọ Igbo na-ada nke ọma.
- source_word: ὁ ... ἀκούων καὶ πιστεύων
  choice: onye ọ bụla na-anụ ... ma kwere
  rationale: “Onye ọ bụla” na-egosipụta na okwu a metụtara onye ọbụla nwere àgwà nke ịnụ na ikwere, n’enweghị ịgbakwunye echiche gbasara nwoke naanị.
- source_word: τὸν λόγον μου
  choice: okwu m
  rationale: Ọ na-echekwa echiche λόγος dị ka okwu ma ọ bụ ozi Jizọs, nakwa ụda pụrụ iche okwu a nwere n’akwụkwọ Jọn.
- source_word: πιστεύων τῷ πέμψαντί με
  choice: kwere onye zitere m
  rationale: πιστεύω tinyere dative pụtara ikwere ma ọ bụ ịtụkwasị onye ahụ obi. Nhọrọ a na-agbasochi usoro Grik ma bụrụkwa Igbo a na-aghọta.
- source_word: ἔχει ζωὴν αἰώνιον
  choice: nwere ndụ ebighị ebi
  rationale: “Nwere” na-echekwa present tense nke na-egosi ihe onye ahụ nwere ugbu a; “ndụ ebighị ebi” bụ okwu Igbo doro anya maka ζωὴ αἰώνιος.
- source_word: εἰς κρίσιν οὐκ ἔρχεται
  choice: Ọ dịghị abata n’ikpe
  rationale: “Ikpe” na-echekwa obosara nke κρίσις n’enweghị ịkọwapụta ya ozugbo dị ka ikpe ọmụma; “abata n’” na-egosipụta ntụziaka dị na εἰς.
- source_word: μεταβέβηκεν
  choice: o siwo ... gafee banye
  rationale: Ụdị “siwo ... gafee” na-egosipụta mgbanwe e mechara eme nke ihe ọ rụpụtara ka dịgide, dịka perfect tense Grik si dị.
- source_word: ἐκ τοῦ θανάτου εἰς τὴν ζωήν
  choice: n’ọnwụ ... banye ná ndụ
  rationale: Ọ na-echekwa nnukwu ọdịiche dị n’etiti ọnwụ na ndụ, ma gosipụta mmegharị site n’otu ọnọdụ banye n’ọzọ.
theological_decisions:
- issue: Ihe κρίσις pụtara n’ebe a gbasara nzọpụta
  choice: ikpe
  alternative: ikpe ọmụma
  rationale: N’ọnọdụ a, κρίσις nwere ike ịpụta ikpe nke ga-eweta nsonaazụ ọjọọ, ma okwu Grik n’onwe ya sara mbara karịa “ikpe ọmụma.” “Ikpe” na-ahapụ esemokwu a ka ọ dị n’amaokwu ahụ.
- issue: Mmetụta present na perfect tense n’ihe gbasara nzọpụta
  choice: onye ahụ nwere ndụ ebighị ebi ugbu a, o sikwa n’ọnwụ gafee ná ndụ n’ụzọ e mezuru nke nsonaazụ ya ka dị
  alternative: ndụ bụ naanị ihe a ga-enweta n’ọdịnihu, ma ọ bụ na ntọhapụ n’ikpe bụ naanị nke ọdịnihu
  rationale: ἔχει bụ present tense, μεταβέβηκεν bụkwa perfect tense. Ya mere, nsụgharị ahụ na-egosi ihe dị ugbu a na mgbanwe e mezuru nke ka nwere nsonaazụ, n’enweghị itinye ozizi otu ụka pụrụ iche.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị mfe nghọta ma dị ùgwù, dee ya. E debere nkwusi ike dị n’“N’ezie, n’ezie,” ọdịiche dị n’etiti ọnwụ na ndụ, na nghọta abụọ κρίσις nwere ike inwe. E tinyere akara nkọwa ala peeji n’ebe okwu ndị ha na-akọwa dị.
