id: JHN.5.44
reference: John 5:44
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: πῶς δύνασθε ὑμεῖς πιστεῦσαι, δόξαν παρ’ ἀλλήλων λαμβάνοντες, καὶ τὴν δόξαν τὴν παρὰ τοῦ μόνου θεοῦ οὐ ζητεῖτε;
base_translation:
  language: en
  yaml_path: translation/nt/john/005/044.yaml
  text: How are you able to believe[c][b][a], receiving glory from one another and not seeking the glory that is from the only God?
translation:
  language: ig
  text: Olee otú unu pụrụ isi kwere[b], ebe unu na-anata nsọpụrụ[a] n’aka ibe unu, ma unu adịghị achọ nsọpụrụ nke si n’aka naanị Chineke[c]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ịsụgharị okwu a n’ebe abụọ ahụ dịka “ebube” ma ọ bụ “otuto” (Grik: δόξα).'
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “Olee otú unu ga-esi nwee ike ikwere?”
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “Chineke naanị ya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πῶς δύνασθε ... πιστεῦσαι
  choice: Olee otú unu pụrụ isi kwere
  rationale: Nke a na-edobe ajụjụ banyere ikike ma ọ bụ otú ihe ahụ ga-esi kwe omume. “Pụrụ isi” na-egosipụta δύνασθε nke ọma n’Igbo na-enweghị ime ka okwu ahụ bụrụ nkọwa karịrị ihe Grik kwuru.
- source_word: ὑμεῖς
  choice: unu
  rationale: “Unu” na-egosi na a na-agwa ọtụtụ mmadụ okwu. E tinyebeghị “onwe unu,” n’ihi na nke ahụ nwere ike ime ka nkwusi ike dị n’Igbo karịa nke dị na Grik.
- source_word: πιστεῦσαι
  choice: kwere
  rationale: “Kwere” bụ okwu Igbo sara mbara ma kwekọọ na πιστεύω n’ebe a; ọ naghị amanye nkọwa pụrụ iche banyere ụdị okwukwe ahụ.
- source_word: δόξαν
  choice: nsọpụrụ
  rationale: N’ebe a, δόξα na-ezo aka n’otuto, nkwanye ugwu, ma ọ bụ aha ọma mmadụ na-enweta. “Nsọpụrụ” bụ okwu Igbo doro anya ma bụrụkwa nke e nwere ike iji mee ihe n’ahịrịokwu abụọ ahụ, si otú a debe mmegharị okwu na ọdịiche dị n’etiti ihe si n’aka mmadụ na ihe si n’aka Chineke.
- source_word: παρ’ ἀλλήλων
  choice: n’aka ibe unu
  rationale: Nke a na-egosi na ndị ahụ na-enye ibe ha nsọpụrụ, dị ka echiche mmeghachi omume dị na ἀλλήλων si dị.
- source_word: λαμβάνοντες
  choice: ebe unu na-anata
  rationale: “Na-anata” na-egosipụta omume na-aga n’ihu nke participle ahụ. “Ebe” jikọtara ya nke ọma na ajụjụ bụ isi n’Igbo.
- source_word: καὶ ... οὐ ζητεῖτε
  choice: ma unu adịghị achọ
  rationale: Ọ bụ ezie na καί bụ njikọ nkịtị, ọnọdụ a na-egosi ọdịiche n’etiti ịnata nsọpụrụ mmadụ na ịghara ịchọ nke sitere n’aka Chineke; “ma” na-eme ka ọdịiche ahụ pụta n’Igbo nkịtị.
- source_word: τὴν δόξαν τὴν παρὰ τοῦ μόνου θεοῦ
  choice: nsọpụrụ nke si n’aka naanị Chineke
  rationale: Nkebiokwu njikọ “nke si n’aka” na-egosi isi iyi nke nsọpụrụ ahụ nke ọma, ma “naanị Chineke” na-edobe echiche exclusivity nke μόνος n’enweghị mgbakwunye ozizi.
theological_decisions:
- issue: Ihe πιστεῦσαι pụtara n’okwu Jọn
  choice: kwere
  alternative: tụkwasị obi
  rationale: “Kwere” na-edobe obosara nke okwu Grik, nke nwere ike ịgụnye ikwere na ịtụkwasị obi. Ịsụgharị ya naanị dịka “tụkwasị obi” ga-eme ka otu akụkụ pụta ìhè karịa ka amaokwu ahụ n’onwe ya mere.
- issue: Iji otu okwu sụgharịa δόξα n’ebe abụọ ahụ
  choice: nsọpụrụ
  alternative: ebube; otuto
  rationale: Amaokwu ahụ na-atụnyere δόξα nke mmadụ na δόξα sitere n’aka Chineke. Iji “nsọpụrụ” n’ebe abụọ ahụ na-echekwa mmegharị ahụ ma na-ada nke ọma n’Igbo; “ebube” nwere ike ime ka ndị na-agụ ya chee naanị maka ịdị ebube nke Chineke, ebe okwu a n’ọnọdụ a metụtara nsọpụrụ a na-enweta.
- issue: Nkọwa τοῦ μόνου θεοῦ
  choice: naanị Chineke
  alternative: otu Chineke ahụ naanị ya
  rationale: “Naanị Chineke” na-ekwupụta ịdị nanị na pụrụ iche nke Chineke n’ụzọ dị nkenke. E tinyeghị okwu ga-agbasa ahịrịokwu ahụ ma ọ bụ webata nkwupụta banyere Kraịst nke amaokwu a ekwughị kpọmkwem.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dịkwa mfe nghọta. A họọrọ “pụrụ isi” iji debe echiche ikike dị na δύνασθε, “ebe” iji mee ka participle ahụ bụrụ nke eke n’Igbo, na “nsọpụrụ” iji chekwaa otu okwu n’ebe δόξα pụtara ugboro abụọ.
