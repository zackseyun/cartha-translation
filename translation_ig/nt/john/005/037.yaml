  text: καὶ ὁ πέμψας με πατὴρ ⸀ἐκεῖνος μεμαρτύρηκεν περὶ ἐμοῦ. οὔτε φωνὴν αὐτοῦ ⸂πώποτε ἀκηκόατε⸃ οὔτε εἶδος αὐτοῦ ἑωράκατε,
base_translation:
  language: en
  yaml_path: translation/nt/john/005/037.yaml
  text: And the Father who sent me—that one has testified about me[a]. You have neither ever heard his voice nor seen his form[b],
translation:
  language: ig
  text: Nna ahụ nke zitere m—ọ bụ ya agbaala ama banyere m[a]. Unu anụtụbeghị olu ya mgbe ọ bụla, unu ahụbeghịkwa ọdịdị ya[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ya onwe ya agbaala ama banyere m.” Okwu Grik ἐκεῖνος na-etinye nkwusi ike n'ahụ Nna ahụ nke zitere m.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, “ụdị ya” ma ọ bụ “mpụta ya.” Okwu Grik εἶδος nwere ike ịpụta ọdịdị ma ọ bụ ụdị a na-ahụ anya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ πέμψας με πατὴρ
  choice: Nna ahụ nke zitere m
  rationale: Nkebiokwu a na-eji participle akọwa Nna ahụ; relative clause Igbo a na-egosi nke ọma na ọ bụ Nna ahụ zitere Jizọs.
- source_word: ἐκεῖνος
  choice: ọ bụ ya
  rationale: Nke a na-edobe nkwusi ike dị na demonstrative Grik ahụ ma na-ada ka Igbo nkịtị karịa nsụgharị siri ike dịka ‘onye ahụ.’
- source_word: μεμαρτύρηκεν
  choice: agbaala ama
  rationale: Perfect tense ahụ na-egosi ama e gbara nke ka dị irè; ‘agbaala ama’ na-eburu ma ihe ahụ mere ma mkpa ya ka dị ugbu a.
- source_word: περὶ ἐμοῦ
  choice: banyere m
  rationale: Nke a bụ ụzọ Igbo doro anya na nke nkịtị isi kwuo ‘concerning/about me.’
- source_word: οὔτε ... οὔτε
  choice: Ọ dịtụbeghị mgbe ... unu ahụkwala
  rationale: Usoro a na-eburu njikọ nkwugide abụọ ahụ n'Igbo dị mfe ma doo anya, na-enweghị ime ka ahịrịokwu sie ike.
- source_word: φωνὴν αὐτοῦ
  choice: olu ya
  rationale: φωνή n'ọnọdụ a pụtara olu a na-anụ; ‘olu ya’ bụ ezigbo nhata n'Igbo.
- source_word: πώποτε
  choice: dịtụbeghị mgbe
  rationale: N'okpuru nkwugide, πώποτε pụtara ‘ọ dịghị mgbe ọbụla’; okwu a na-egosipụta ike ‘ever’ nke ọma.
- source_word: ἀκηκόατε
  choice: unu nụrụ
  rationale: Igbo anaghị egosikarị perfect tense dịka Grik; tinyere ‘dịtụbeghị mgbe,’ ụdị a na-egosi ahụmahụ ahụ ruo ugbu a.
- source_word: εἶδος αὐτοῦ
  choice: ọdịdị ya
  rationale: ‘Ọdịdị’ nwere ike ịpụta ụdị ma ọ bụ ihe onye dị ka ya, ya mere ọ na-edobe obosara εἶδος n'enweghị ịkọwa ya gabiga ihe ederede kwuru.
- source_word: ἑωράκατε
  choice: unu ahụkwala
  rationale: Ụdị perfect-negative a na-egosi na ha ahụbeghị ya ruo ugbu a ma na-eme ka akụkụ nke abụọ kwekọọ na nke mbụ.
theological_decisions:
- issue: Nkwusi ike nke ἐκεῖνος mgbe a kpọchara Nna ahụ aha
  choice: ọ bụ ya agbaala ama banyere m
  alternative: ọ gbaala ama banyere m; ya onwe ya agbaala ama banyere m
  rationale: ‘Ọ bụ ya’ na-eme ka Nna ahụ pụta ìhè dị ka onye akaebe, ma ọ naghị etinye nkọwa ozizi ọzọ n'okwu ahụ.
- issue: Ihe εἶδος αὐτοῦ pụtara
  choice: ọdịdị ya
  alternative: ụdị ya; ihe ọ dị ka ya
  rationale: ‘Ọdịdị’ na-ahapụ ohere dị n'okwu Grik ahụ—ma ọ bụ ụdị a na-ahụ anya ma ọ bụ mpụta—n'enweghị idozi esemokwu ahụ n'ụzọ nkọwa.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Em dash na ‘ọ bụ ya’ na-edobe nkwusi ike nke Grik; rịkọm ikpeazụ na-egosi na amaokwu ahụ na-aga n'ihu n'amaokwu na-esote.
