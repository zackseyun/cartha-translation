revisions:
- from: Nna ahụ nke zitere m—ọ bụ ya agbaala ama banyere m[a]. Ọ dịtụbeghị mgbe unu nụrụ olu ya, unu ahụkwala ọdịdị ya[b],
  to: Nna ahụ nke zitere m—ọ bụ ya agbaala ama banyere m[a]. Unu anụtụbeghị olu ya mgbe ọ bụla, unu ahụbeghịkwa ọdịdị ya[b],
  rationale: The revision makes the paired negation idiomatic and explicitly preserves “ever/at any time,” while retaining the draft’s sound choices for the emphatic demonstrative, testimony language, and the ambiguity of εἶδος. The footnotes are corrected for standard Igbo and kept lexically focused. The final comma is retained because the Greek sentence continues into the next verse.
