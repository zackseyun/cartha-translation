review_pass:
  verdict: revise
  source_fidelity: Isi nsụgharị ahụ na-edobe njikọ echiche, mmegharị na-aga n’ihu nke ἐζήτουν, mmụba nke μᾶλλον, na nkwupụta banyere ịha nhata na Chineke nke ọma. Otú ọ dị, «iwu» bụ mgbakwunye a na-adịghị n’okwu Grik; a pụrụ ịsụ «na-emebi ụbọchị Sabat» n’enweghị mgbakwunye ahụ.
  naturalness: «Ọ bụ n’ihi nke a kwa ka … ji na-achọsi ike karị» bụ Igbo Izugbe dị ire ma na-egosi ihe omume na-aga n’ihu nke ọma. A gụzigharịrị nkọwa ala peeji a ka o bụrụ Igbo nkịtị ma doo anya karịa.
  terminology: E debere «ndị Juu», «ụbọchị Sabat», «Chineke», «Nna nke ya», na «hara nhata» n’ụzọ dabara n’Igbo Izugbe na n’okwu Grik. Nkọwa b mbụ abụghị n’ezie nhọrọ nsụgharị ọzọ bara uru, n’ihi na ọ na-ekwughachi isi okwu ahụ; e jiri nhọrọ dị iche n’usoro okwu dochie ya.
  issues:
  - severity: low
    issue: «iwu ụbọchị Sabat» na-agbakwunye «iwu»
    rationale: τὸ σάββατον bụ «ụbọchị Sabat», ọ bụghị okwu kpọmkwem maka «iwu». Ọ bụ ezie na «imebi iwu Sabat» nwere ike ịkọwa ihe a na-ekwu, isi nsụgharị kwesịrị izere mgbakwunye a.
  - severity: medium
    issue: Nkọwa ala peeji b anaghị enye nhọrọ nsụgharị dị iche n’ezie
    rationale: «si otú ahụ na-eme onwe ya onye ya na Chineke hara nhata» na-agbakwunye «si otú ahụ» ma na-ekwughachi echiche isi ahịrịokwu. «na-eme onwe ya ka Chineke hà nhata» na-anọchite anya «equal to God» n’ụzọ doro anya.
  - severity: low
    issue: Usoro okwu na nkọwa ala peeji a adịghị eke nke ọma
    rationale: «n’ebe ndị Judia ... nọ» adịghị edo anya ebe a. «n’ụfọdụ ndị Judia na-emegide Jizọs, ma ọ bụ n’ụfọdụ ndị isi Juu» na-ekwu ihe nkọwa ahụ bu n’uche n’Igbo eke.
