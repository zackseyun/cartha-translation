id: JHN.5.18
reference: John 5:18
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: διὰ τοῦτο οὖν μᾶλλον ἐζήτουν αὐτὸν οἱ Ἰουδαῖοι ἀποκτεῖναι ὅτι οὐ μόνον ἔλυε τὸ σάββατον, ἀλλὰ καὶ πατέρα ἴδιον ἔλεγε τὸν θεόν, ἴσον ἑαυτὸν ποιῶν τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/018.yaml
  text: For this reason[a], therefore, the Jews were seeking all the more to kill him, because he was not only breaking the Sabbath, but was also calling God his own Father[b], making himself equal with God.
translation:
  language: ig
  text: Ọ bụ n’ihi nke a kwa ka ndị Juu[a] ji na-achọsi ike karị igbu ya, n’ihi na ọ bụghị naanị na ọ na-emebi ụbọchị Sabat, kama ọ na-akpọkwa Chineke Nna nke ya, na-eme onwe ya ka ya na Chineke hara nhata.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’Oziọma Jọn, okwu a bụ “ndị Juu” na-ezokarị aka kpọmkwem n’ụfọdụ ndị Judia na-emegide Jizọs, ma ọ bụ n’ụfọdụ ndị isi Juu, ọ bụghị n’ebe ndị Juu niile nọ n’enweghị ịkpa ókè.
    reason: cultural_note
  - marker: b
    text: Ma ọ bụ, “na-eme onwe ya ka Chineke hà nhata.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο οὖν
  choice: Ọ bụkwa n’ihi nke a ka ... ji
  rationale: Usoro ndọkpụ uche a bụ Igbo e ji ekwupụta ihe kpatara ihe ọzọ; “kwa” na-enyekwa njikọ nkwubi okwu dị n’οὖν n’enweghị ikwughachi okwu n’ụzọ na-adịghị atọ ụtọ.
- source_word: μᾶλλον ἐζήτουν ... ἀποκτεῖναι
  choice: chọsie ike karị igbu ya
  rationale: “Chọsie ike karị” na-egosi mmụba nke μᾶλλον, ebe usoro ngwaa ahụ na-egosi na ọchịchọ igbu ya nọ na-aga n’ihu.
- source_word: οἱ Ἰουδαῖοι
  choice: ndị Juu
  rationale: Nke a na-edobe okwu Grik n’ụdị sara mbara ya; nkọwa ala peeji na-akọwa na ihe a na-ezo aka na ya nwere ike ịdị warara n’ọnọdụ a.
- source_word: ἔλυε τὸ σάββατον
  choice: na-emebi iwu ụbọchị Sabat
  rationale: λύω n’ebe a pụtara imebi ma ọ bụ ileghara ụkpụrụ Sabat anya. Itinye “iwu ụbọchị” na-eme ka okwu ahụ doo anya n’Igbo, ma na-edobe ya dịka ebubo ndị mmegide ya.
- source_word: πατέρα ἴδιον ἔλεγε τὸν θεόν
  choice: na-akpọkwa Chineke Nna nke ya
  rationale: 'Nke a na-edobe omume nke ἔλεγε na nkwusi ike nke ἴδιον: ọ kpọrọ Chineke Nna nke ya kpọmkwem.'
- source_word: ἴσον ἑαυτὸν ποιῶν τῷ θεῷ
  choice: na-eme onwe ya ka ya na Chineke hara nhata
  rationale: Nke a na-egosipụta ahịrị participle ahụ nke ọma ma na-edobe ike okwu banyere ịha nhata na Chineke.
theological_decisions:
- issue: Ma a ga-eme ka okwu banyere ịha nhata na Chineke dị nro
  choice: E debere “na-eme onwe ya ka ya na Chineke hara nhata” n’isiokwu ahụ.
  alternative: na-ekwu na ya na Chineke hara nhata
  rationale: Okwu Grik kwuru “na-eme onwe ya,” ọ bụghị naanị “na-ekwu.” Nsụgharị ahụ na-edobe ike okwu Kraịst dị n’amaokwu ahụ, ma ọ dịghị etinye okwu nkà mmụta okpukpe e dere n’oge ọzọ.
- issue: Ndị okwu “ndị Juu” na-ezo aka na ha n’Oziọma Jọn
  choice: E debere “ndị Juu” n’isiokwu ahụ, tinyekwa nkọwa ala peeji.
  alternative: ndị isi ndị Juu; ndị Judia
  rationale: οἱ Ἰουδαῖοι pụtara “ndị Juu” n’ụzọ nkịtị, ma ọnọdụ akụkọ ahụ nwere ike igosi ndị ọchịchị ma ọ bụ ndị mmegide Jizọs kpọmkwem. Nkọwa ala peeji na-echekwa ma okwu isi mmalite ma nkọwa ọnọdụ ya.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. Usoro “Ọ bụkwa n’ihi nke a ka ... ji” na-eme ka njikọ na amaokwu gara aga pụta ìhè n’ụzọ Igbo si adị, ebe “Nna nke ya” na “ya na Chineke hara nhata” na-edobe nkwusi ike na esemokwu nkà mmụta okpukpe dị n’isi mmalite.
