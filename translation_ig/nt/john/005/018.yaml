revisions:
- from: Ọ bụkwa n’ihi nke a ka ndị Juu[a] ji chọsie ike karị igbu ya, n’ihi na ọ bụghị naanị na ọ na-emebi iwu ụbọchị Sabat, kama ọ na-akpọkwa Chineke Nna nke ya, na-eme onwe ya ka ya na Chineke hara nhata.[b]
  to: Ọ bụ n’ihi nke a kwa ka ndị Juu[a] ji na-achọsi ike karị igbu ya, n’ihi na ọ bụghị naanị na ọ na-emebi ụbọchị Sabat, kama ọ na-akpọkwa Chineke Nna nke ya, na-eme onwe ya ka ya na Chineke hara nhata.[b]
  rationale: Ndozigharị ndị a na-ewepụ mgbakwunye «iwu» ka isi ahịrịokwu soro τὸ σάββατον nso, na-echekwa imperfect «na-achọsi ike», ma na-eme ka nkọwa ala peeji abụọ bụrụ nke eke ma rụọ ọrụ ha nke ọma. E debere enweghị mgbagha dị n’okwu banyere «ndị Juu» na ọgụgụ Christological nke participle ahụ.
