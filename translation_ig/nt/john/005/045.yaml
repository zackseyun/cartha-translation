review_pass:
  verdict: revise
  source_fidelity: 'Isi ederede ahụ na-atụgharị akụkụ ndị bụ isi nke Grik nke ọma: mmachibido «μὴ δοκεῖτε», okwu ikpe «κατηγορήσω», aha «Nna», Mosis dịka onye na-ebo ebubo, na olileanya etinyere n’ime ya. Otú ọ dị, ihe odide ala b gbanwere onye a na-ekwu maka ya site na «unu» gaa «ha» ma gbanwee oge nke «onye na-ebo ebubo» dị ugbu a ka ọ bụrụ «ga-abụ» n’ọdịnihu.'
  naturalness: Ederede bụ Standard Igbo doro anya ma na-agụ nke ọma. «Ibo ebubo n’ihu Nna» bụ okwu eke nke na-echekwa ụda ụlọikpe. «Tụkwasịrị olileanya unu na ya» bụkwa ihe a ghọtara nke ọma; e debere ya.
  terminology: «Nna», «ebo ebubo», na «Mosis» dabara n’usoro okwu Baịbụl Igbo. E wepụrụ nkọwa «onye ogbugbo na onye akaebe nke Iwu» n’ihe odide ala, n’ihi na ọ na-akọwa karịa ihe amaokwu a kwuru; kama nke ahụ, ihe odide ala na-ezo aka n’amaokwu ndị dị nso banyere Iwu na ihe Mosis dere.
  issues:
  - severity: medium
    issue: Ihe odide ala b ji «ha» kama «unu».
    rationale: Amaokwu ahụ na-agwa ndị na-ege okwu okwu ozugbo («ὑμῶν», «ὑμεῖς»). «Unu» ga-edobe onye a na-agwa okwu.
  - severity: medium
    issue: Ihe odide ala b sịrị na Mosis «ga-abụ» onye na-ebo ebubo.
    rationale: Grik «ἔστιν ὁ κατηγορῶν» na-ekwu maka onye na-ebo ebubo ugbu a, ọ bụghị naanị ọrụ ga-adị n’ọdịnihu.
  - severity: low
    issue: Nkọwa banyere Mosis dịka «onye ogbugbo na onye akaebe nke Iwu» karịrị nkọwa amaokwu ahụ.
    rationale: Ọ bụ nkọwa nwere ike ịdị n’azụ amaokwu ahụ, ma ọ bụghị ihe John 5:45 kwuru n’onwe ya. Ntụaka na Jọn 5:46–47 na-enye nkọwa nke gbadoro n’ederede.
