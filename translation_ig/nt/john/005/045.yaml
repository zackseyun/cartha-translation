  to: Unu echela na ọ bụ m ga-ebo unu ebubo n’ihu Nna[a]. E nwere onye na-ebo unu ebubo—Mosis[b], onye unu tụkwasịrị olileanya unu na ya.
  rationale: 'E debere ederede isi n’ihi na ọ na-eguzosi ike n’ihe Grik kwuru ma na-adịkwa eke n’Standard Igbo. A dezigharịrị naanị ihe odide ala: a weghachiri «unu» dịka onye a na-agwa okwu, a debere oge dị ugbu a nke onye na-ebo ebubo, ma dochie nkọwa sara mbara anya site na ntụaka ederede dị nso.'
