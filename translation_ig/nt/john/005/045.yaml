  variant: Standard Igbo
source:
  edition: SBLGNT
  text: μὴ δοκεῖτε ὅτι ἐγὼ κατηγορήσω ὑμῶν πρὸς τὸν πατέρα· ἔστιν ὁ κατηγορῶν ὑμῶν Μωϋσῆς, εἰς ὃν ὑμεῖς ἠλπίκατε.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/045.yaml
  text: 'Do not think that I will accuse you before the Father[a]; there is one who accuses you: Moses[b], in whom you have put your hope.'
translation:
  language: ig
  text: Unu echela na ọ bụ m ga-ebo unu ebubo n’ihu Nna[a]. E nwere onye na-ebo unu ebubo—Mosis[b], onye unu tụkwasịrị olileanya unu na ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Unu echela na m ga-ewetara Nna ebubo megide unu.”
    reason: lexical_alternative
  - marker: b
    text: Ya bụ, Mosis, onye unu tụkwasịrị olileanya unu na ya, bụ onye na-ebo unu ebubo. Lee Jọn 5:46–47, ebe e jikọtara ya na Iwu na ihe o dere.
    reason: cross_reference
lexical_decisions:
- source_word: μὴ δοκεῖτε
  choice: Unu echela
  rationale: 'Nke a bụ ụzọ Igbo doro anya ma bụrụkwa nke e ji enye mmachibido iwu: ‘unu echela.’ Ọ na-edobe ịdị kpọmkwem nke ịdọ aka ná ntị ahụ.'
- source_word: κατηγορήσω
  choice: ga-ebo unu ebubo
  rationale: ‘Ibo ebubo’ na-egosipụta okwu ikpe ma ọ bụ iweta ebubo megide mmadụ, n’enweghị ịgbatị ya ruo n’ịma mmadụ ikpe.
- source_word: πρὸς τὸν πατέρα
  choice: n’ihu Nna
  rationale: ‘N’ihu Nna’ na-enye echiche nke iweta ebubo n’ihu onye na-ekpe ikpe, ma na-edobekwa aha Jọn ji akpọ Chineke, ‘Nna.’
- source_word: ἔστιν ὁ κατηγορῶν ὑμῶν
  choice: E nwere onye na-ebo unu ebubo
  rationale: 'Nhazi a bụ Igbo eke, ma ọ na-edobe ike nke participle dị ugbu a: onye ahụ na-arụ ọrụ nke onye na-ebo ha ebubo.'
- source_word: Μωϋσῆς
  choice: Mosis
  rationale: ‘Mosis’ bụ ụdị aha a maara nke ọma n’Igbo maka Μωϋσῆς.
- source_word: εἰς ὃν
  choice: onye ... na ya
  rationale: N’ime ahịrịokwu ‘onye unu tụkwasịrị olileanya unu na ya,’ nke a na-edobe onye e tinyere olileanya n’ime ya, n’agbanweghị ya ka ọ bụrụ iwu ma ọ bụ ihe Mosis dere.
- source_word: ἠλπίκατε
  choice: unu tụkwasịrị olileanya unu
  rationale: Oge perfect ahụ na-egosi na ha tinyere olileanya ha na Mosis ma ọnọdụ ahụ ka dị. ‘Tụkwasịrị olileanya unu’ na-egosipụta ntụkwasị obi ahụ na nsonaazụ ya na-adịgide.
theological_decisions:
- issue: Ike okwu ikpe dị n’okwu Jizọs banyere ebubo
  choice: A sụgharịrị κατηγορέω dịka ‘ibo ebubo,’ ọ bụghị ‘ịma ikpe.’
  alternative: ‘M ga-ama unu ikpe n’ihu Nna.’
  rationale: Okwu Grik ahụ pụtara ibo mmadụ ebubo ma ọ bụ iweta ebubo megide ya; ọ pụtaghị n’onwe ya mkpebi ikpe ikpeazụ. Nke a na-edobe ihe atụ ụlọikpe ahụ n’enweghị itinye nkwupụta karịrị ihe ederede kwuru.
- issue: Onye olileanya ahụ dị n’ime ya
  choice: Ederede ahụ kwuru na ha tụkwasịrị olileanya ha na Mosis.
  alternative: ‘n’iwu Mosis’ ma ọ bụ ‘n’ihe Mosis dere.’
  rationale: Ọ bụ ezie na gburugburu amaokwu ahụ jikọtara Mosis na ihe o dere, Grik kpọrọ Mosis n’onwe ya aha. Nsụgharị ahụ hapụrụ nkọwa zuru ezu ahụ ka gburugburu okwu gosipụta ya.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, dị ugwu ma dị mfe nghọta. ‘Ibo ebubo’ na-edobe ụda okwu ụlọikpe; ‘Nna’ na-edobe aha pụrụ iche e ji mara Chineke n’Oziọma Jọn. A họọrọ ‘Mosis’ dịka ụdị aha a na-ahụkarị n’Igbo.
