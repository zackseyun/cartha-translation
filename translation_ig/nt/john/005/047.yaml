id: JHN.5.47
reference: John 5:47
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἰ δὲ τοῖς ἐκείνου γράμμασιν οὐ πιστεύετε, πῶς τοῖς ἐμοῖς ῥήμασιν πιστεύσετε;
base_translation:
  language: en
  yaml_path: translation/nt/john/005/047.yaml
  text: But if you do not believe his writings[a], how will you believe my words?
translation:
  language: ig
  text: Ma ọ bụrụ na unu anaghị ekwere n’ihe ndị o dere[a], olee otu unu ga-esi kwere n’okwu m?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “akwụkwọ ozi ya.” Okwu Grik ahụ nwere ike ịpụta mkpụrụedemede, akwụkwọ ozi, ma ọ bụ ihe e dere; n’ebe a, ọ na-ezo aka n’ihe Mosis dere.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δὲ
  choice: Ma ọ bụrụ na
  rationale: Na-egosipụta ọnọdụ na ntụgharị okwu nke δέ n’ụzọ Igbo doro anya ma bụrụ nke e ji eme ihe ugbu a.
- source_word: τοῖς ἐκείνου γράμμασιν
  choice: n’ihe ndị o dere
  rationale: γράμματα nwere ike ịpụta mkpụrụedemede, akwụkwọ ozi, ma ọ bụ ihe e dere; n’ebe a, ọnọdụ okwu na-ezo aka n’ihe Mosis dere. Nhọrọ a adịghị amanye nkọwa pụrụ iche dịka ‘Akwụkwọ Nsọ.’
- source_word: οὐ πιστεύετε
  choice: unu ekweghị
  rationale: πιστεύω ya na dative ebe a pụtara ikwere na ihe e dere bụ eziokwu ma kwesị ntụkwasị obi; ụdị ugbu a ka e debere.
- source_word: πῶς ... πιστεύσετε
  choice: olee otu unu ga-esi kwere
  rationale: Na-echekwa ajụjụ πῶς na ọdịnihu nke πιστεύσετε, kama ịgbanwe ya ka ọ bụrụ ajụjụ banyere ikike ime ya.
- source_word: τοῖς ἐμοῖς ῥήμασιν
  choice: n’okwu m
  rationale: ῥήματα na-ezo aka n’okwu e kwuru; ‘okwu m’ bụ Igbo eke ma na-echekwa ọdịiche dị n’etiti ihe Mosis dere na okwu Jizọs.
theological_decisions:
- issue: Onye ἐκείνου (‘o’) na-ezo aka na ya
  choice: Ọ na-ezo aka na Mosis dịka ọnọdụ okwu Jọn 5:45–46 si gosi
  alternative: Ịghọta ya dịka onye a na-akọwaghị kpọmkwem
  rationale: Amaokwu ndị bu ụzọ kpọrọ Mosis aha dịka onye dere banyere Jizọs. E debere nnọchiaha ‘o’ n’ahịrị bụ isi iji soro njikọ okwu Grik, ebe nkọwa ala peeji na-eme ka onye a na-ekwu banyere ya doo anya.
- issue: Ihe πιστεύω pụtara n’amaokwu a
  choice: kwere
  alternative: tụkwasị obi
  rationale: N’ebe a, isi okwu bụ ịnakwere ihe Mosis dere na okwu Jizọs dịka eziokwu. ‘Kwere’ dabara n’ahịrị abụọ ahụ ma na-echekwa ntụnyere okwu ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe ma nwee ugwu. ‘Unu’ na-egosipụta onye nke abụọ n’ụbara dị na Grik; ahịrịokwu ahụ na-echekwa ajụjụ nkwupụta siri ike na ọdịiche dị n’etiti ihe Mosis dere na okwu Jizọs.
