review_pass:
  verdict: revise
  source_fidelity: The conditional contrast, plural addressee, future force of πιστεύσετε, and the contextual reference of ἐκείνου to Moses are retained. However, «unu ekweghị» can naturally be read as a completed/past negative (‘you did not believe’), whereas the Greek πιστεύετε is present. «Unu anaghị ekwere» explicitly preserves the present sense.
  naturalness: The revision is idiomatic Standard Igbo. «Olee otu unu ga-esi kwere n’okwu m?» naturally expresses the rhetorical future question and retains the parallel belief language.
  terminology: «Ihe ndị o dere» appropriately renders Moses’ writings without prematurely identifying them as Scripture. «Kwere n’...» is suitable in both clauses for πιστεύω with the dative. The footnote preserves the lexical alternative without making it the main reading.
  issues:
  - severity: medium
    issue: The form «unu ekweghị» is aspectually ambiguous and may be understood as past/completed.
    rationale: The source has present πιστεύετε (‘you do not believe’). Using «unu anaghị ekwere» makes the ongoing present negation explicit while leaving the second, future «ga-esi kwere» intact.
  revised_text: Ma ọ bụrụ na unu anaghị ekwere n’ihe ndị o dere[a], olee otu unu ga-esi kwere n’okwu m?
