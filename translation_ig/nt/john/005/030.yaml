id: JHN.5.30
reference: John 5:30
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Οὐ δύναμαι ἐγὼ ποιεῖν ἀπ’ ἐμαυτοῦ οὐδέν· καθὼς ἀκούω κρίνω, καὶ ἡ κρίσις ἡ ἐμὴ δικαία ἐστίν, ὅτι οὐ ζητῶ τὸ θέλημα τὸ ἐμὸν ἀλλὰ τὸ θέλημα τοῦ πέμψαντός ⸀με.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/030.yaml
  text: I am not able to do anything from myself. Just as I hear[a], I judge, and my judgment is just, because I do not seek my own will, but the will of the one who sent me.
translation:
  language: ig
  text: Enweghị m ike ime ihe ọ bụla site n’onwe m.[a] Dị ka m si anụ, otu ahụ ka m si ekpe ikpe; ikpe m ziri ezi, n’ihi na anaghị m achọ uche nke m, kama uche onye zitere m.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “Apụghị m ime ihe ọ bụla n’onwe m.” Akpaokwu Grik ahụ nwere ike imesi ike na ọ naghị eme ihe n’adabereghị n’onwe ya; “site n’onwe m” na-echekwakwa echiche nke isi mmalite.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐ δύναμαι ἐγὼ
  choice: Enweghị m ike
  rationale: Nke a na-egosipụta n'ụzọ doro anya nkwupụta a jụrụ ajụ banyere ike ime ihe, ma na-edebekwa nkwusi ike dị na ἐγώ site n’iji nnọchiaha onye nke mbụ mee ihe.
- source_word: ποιεῖν ἀπ’ ἐμαυτοῦ οὐδέν
  choice: ime ihe ọ bụla site n’onwe m
  rationale: “Site n’onwe m” na-echekwa echiche nke isi mmalite ma ọ bụ ime ihe n’adabereghị n’Onye zitere ya; “ihe ọ bụla” bụkwa ụzọ Igbo dị mfe si egosipụta οὐδέν n’okwu a jụrụ ajụ.
- source_word: καθὼς ἀκούω
  choice: Dị ka m si anụ, otu ahụ
  rationale: Usoro “dị ka… otu ahụ” na-egosipụta nkwekọrịta dị n’etiti ihe ọ na-anụ na otú o si ekpe ikpe.
- source_word: κρίνω / ἡ κρίσις ἡ ἐμὴ
  choice: m si ekpe ikpe / ikpe m
  rationale: E jiri otu mkpụrụokwu bụ “ikpe” chekwaa njikọ okwu ikpe dị n’etiti ngwaa κρίνω na aha κρίσις.
- source_word: δικαία
  choice: ziri ezi
  rationale: N’ọnọdụ ikpe a, “ziri ezi” na-egosi na ikpe ahụ bụ nke kwụ ọtọ ma kwekọọ n’ezi ihe, n’ebughị nkọwa ọzọ abata.
- source_word: οὐ ζητῶ τὸ θέλημα τὸ ἐμὸν
  choice: anaghị m achọ ime uche nke m
  rationale: “Achọ ime uche nke m” na-egosipụta nzube na ọchịchọ nke ζητῶ, ma na-echekwa nkwusi ike nke “nke m” dị n’asụsụ Grik.
- source_word: ἀλλὰ τὸ θέλημα τοῦ πέμψαντός με
  choice: kama uche onye zitere m
  rationale: Nke a na-asụgharị participle ahụ kpọmkwem dịka nkọwa mmekọrịta, na-etinyeghị “Nna” ebe ederede Grik kwuru “onye zitere m.”
theological_decisions:
- issue: Mmekọrịta dị n’etiti ihe Ọkpara na-eme na Onye zitere ya n’okwu ἀπ’ ἐμαυτοῦ
  choice: site n’onwe m
  alternative: n’ike aka m / n’adabereghị n’onye ọzọ
  rationale: 'Nhọrọ a na-echekwa esemokwu dị n’ederede: Jizọs anaghị eme ihe sitere nanị n’onwe ya ma ọ bụ n’adabereghị n’Onye zitere ya. Ọ naghị akọwa nke a dịka enweghị ike zuru oke, ọ naghịkwa etinye nkọwa banyere ọdịdị ya n’ime amaokwu ahụ.'
- issue: Ihe δικαία pụtara mgbe o jikọrọ ya na κρίσις
  choice: ikpe m ziri ezi
  alternative: ikpe m bụ nke ezi omume
  rationale: “Ziri ezi” bụ okwu Igbo nkịtị ma dabara n’ọnọdụ ikpe, na-egosi izi ezi na ikpe ziri ezi n’ebughị echiche nke ederede agbanwe.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị mfe ma nwee ugwu mee ihe. A họọrọ “ekpe ikpe” na “ikpe m” iji chekwaa njikọ okwu ikpe nke Grik, ebe “onye zitere m” na-ezere itinye aha ma ọ bụ nkọwa na-adịghị n’ederede.
