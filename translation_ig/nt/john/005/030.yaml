- from: Enweghị m ike ime ihe ọ bụla site n’onwe m.[a] Dị ka m si anụ, otu ahụ ka m si ekpe ikpe; ikpe m ziri ezi, n’ihi na anaghị m achọ ime uche nke m, kama uche onye zitere m.
  to: Enweghị m ike ime ihe ọ bụla site n’onwe m.[a] Dị ka m si anụ, otu ahụ ka m si ekpe ikpe; ikpe m ziri ezi, n’ihi na anaghị m achọ uche nke m, kama uche onye zitere m.
