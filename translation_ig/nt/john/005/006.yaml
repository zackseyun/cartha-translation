id: JHN.5.6
reference: John 5:6
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τοῦτον ἰδὼν ὁ Ἰησοῦς κατακείμενον, καὶ γνοὺς ὅτι πολὺν ἤδη χρόνον ἔχει, λέγει αὐτῷ· Θέλεις ὑγιὴς γενέσθαι;
base_translation:
  language: en
  yaml_path: translation/nt/john/005/006.yaml
  text: When Jesus saw this man lying there[a], and knew that he had already been there a long time, he said to him, “Do you want to become well?”
translation:
  language: ig
  text: Mgbe Jizọs hụrụ nwoke a ka ọ dina n'ebe ahụ, marakwa na ọ nọwo otu ahụ ogologo oge,[a] ọ sịrị ya, “Ị chọrọ ka ahụ dị gị mma?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “na ọ nọwo n'ebe ahụ ogologo oge.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτον
  choice: nwoke a
  rationale: Ngosipụta a na-arụtụ aka n'otu nwoke ahụ a kpọtụrụ aha n'ọnọdụ akụkọ ahụ; ‘nwoke a’ doro anya ma bụrụkwa Igbo nkịtị.
- source_word: ἰδὼν
  choice: Mgbe Jizọs hụrụ
  rationale: A tụgharịrị participle aorist ahụ ka ọ bụrụ nkebiokwu oge, iji gosipụta usoro ihe mere n'Igbo dị ire.
- source_word: κατακείμενον
  choice: ka o dina n'ebe ahụ
  rationale: Nke a na-egosi ọnọdụ nwoke ahụ na ebe ọ nọ, n'asụsụ Igbo dị mfe ma kwekọọ n'akụkọ ahụ.
- source_word: γνοὺς
  choice: marakwa
  rationale: Ọ na-egosi na Jizọs maara ihe ahụ, ma ọ naghị ekwu otú o si mata ya.
- source_word: πολὺν ἤδη χρόνον ἔχει
  choice: ọ nọwo otu ahụ ogologo oge
  rationale: Akpaokwu Grik ahụ ezughị oke n'onwe ya banyere ihe kpọmkwem dịtere aka; nsụgharị a jikọtara ya na ọnọdụ nwoke ahụ ma zere ikwu hoo haa na ọ bụ ogologo oge ọ nọ n'ebe ahụ.
- source_word: λέγει αὐτῷ
  choice: ọ sịrị ya
  rationale: Ọ bụ ezie na Grik ji historical present, oge gara aga bụ ụzọ ebumpụta ụwa e si akọ akụkọ a n'Igbo.
- source_word: Θέλεις
  choice: Ị chọrọ
  rationale: Nke a na-egosipụta ọchịchọ ma ọ bụ ịdị njikere n'ụzọ doro anya na nke ndị mmadụ na-eji kwa ụbọchị.
- source_word: ὑγιὴς γενέσθαι
  choice: ka ahụ dị gị mma
  rationale: Akpaokwu Igbo a na-egosipụta ịbanye n'ọnọdụ ahụike ọma, ma na-ada karịa ‘ịghọ onye ahụ dị mma’ n'ọnụ onye Igbo.
theological_decisions:
- issue: Ụdị amamihe Jizọs nwere na γνοὺς
  choice: E kwuru naanị na ọ maara, n'akọwaghị ụzọ o si mata.
  alternative: Ịkọwa na Jizọs matara ya n'ụzọ karịrị nke mmadụ, ma ọ bụ na ọ nụrụ ya n'aka ndị ọzọ.
  rationale: Amaokwu ahụ anaghị akọwa ebe ma ọ bụ ụzọ ihe ọmụma ahụ si bịa; nsụgharị ekwesịghị idozi ihe ederede hapụrụ oghe.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E jiri ‘ahụ dị gị mma’ mee ka ajụjụ ahụ bụrụ nke ebumpụta ụwa n'Igbo, ebe a na-echekwa echiche nke ịbanye n'ọnọdụ ahụike ọma.
