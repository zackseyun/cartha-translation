revisions:
- from: Unu ezigarala ndị ozi ka ha gakwuru Jọn, ọ gbaakwala ama banyere eziokwu ahụ.[a]
  to: Unu ezigala ka a gakwuru Jọn, ọ gbala ama banyere eziokwu ahụ.[a]
  rationale: The revision removes the interpretively specific “ndị ozi” and the supplied plural pronoun while retaining a natural Igbo expression for sending people to John. It also simplifies the second perfect verb to avoid an unnecessary possible additive nuance. The name, witness language, and definite “eziokwu ahụ” are retained.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T05:38:41Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly identifies John and retains the perfect-force idea in both main verbs. However, “ndị ozi” specifically means messengers/envoys and, together with “ka ha,” supplies a plural class of persons not expressed in the Greek. While a delegation is contextually likely, this wording is unnecessarily specific. An impersonal construction permits natural Igbo without specifying the unstated object.
  naturalness: “Unu ezigala ka a gakwuru Jọn” is idiomatic Standard Igbo for this context. “Ọ gbala ama banyere eziokwu ahụ” is clear, maintains the completed-testimony sense, and naturally expresses μαρτυρέω with its dative complement.
  terminology: “Eziokwu ahụ” appropriately preserves the Greek article and Johannine resonance without overinterpreting it. “Ịgba ama” is an appropriate modern Igbo witness/testimony term. The alternative “ịgba akaebe” is also valid.
  issues:
  - severity: medium
    issue: “ndị ozi ... ka ha” specifies envoys/messengers and plural referents absent from the Greek.
    rationale: ἀπεστάλκατε leaves its object unstated. The immediate context can support people being sent, but “ndị ozi” narrows their role beyond the wording of this verse. Use an impersonal construction to preserve the source’s economy.
  - severity: low
    issue: The translation uses “gbaakwala,” whose -kwa can suggest an additional ‘also’ nuance.
    rationale: The Greek has καί joining the clauses, but does not separately emphasize ‘also.’ “Ọ gbala ama” preserves the perfect-result sense without that possible extra nuance.
  revised_text: Unu ezigala ka a gakwuru Jọn, ọ gbala ama banyere eziokwu ahụ.[a]
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “ọ gbara eziokwu ahụ akaebe.”
    reason: lexical_alternative
  revision_rationale: The revision removes the interpretively specific “ndị ozi” and the supplied plural pronoun while retaining a natural Igbo expression for sending people to John. It also simplifies the second perfect verb to avoid an unnecessary possible additive nuance. The name, witness language, and definite “eziokwu ahụ” are retained.
