  text: ὑμεῖς ἀπεστάλκατε πρὸς Ἰωάννην, καὶ μεμαρτύρηκε τῇ ἀληθείᾳ·
base_translation:
  language: en
  yaml_path: translation/nt/john/005/033.yaml
  text: You have sent to John[a], and he has testified to the truth.
translation:
  language: ig
  text: Unu ezigala ka a gakwuru Jọn, ọ gbala ama banyere eziokwu ahụ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ọ gbara eziokwu ahụ akaebe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς
  choice: Unu
  rationale: Nnọchiaha a doro anya n’ebe a na-etinye ntakịrị nkwusi ike n’isiokwu ahụ, ma ‘Unu onwe unu’ ga-eme ka nkwusi ike ahụ sie karịa otú Grik si kwuo ya.
- source_word: ἀπεστάλκατε
  choice: ezigarala ndị ozi
  rationale: Perfect tense ahụ na-egosi iziga nke mere eme ma ka dị mkpa n’okwu a. Ebe Grik hapụrụ ndị e zigara n’ekwughị aha, Igbo chọrọ ka e mee ha ka ha pụta ìhè ka ahịrịokwu ahụ bụrụ nke ebumpụta ụwa.
- source_word: πρὸς Ἰωάννην
  choice: ka ha gakwuru Jọn
  rationale: πρός na-egosi na ndị e zigara gara n’ebe Jọn nọ. A hapụrụ aha ya naanị dị ka ‘Jọn,’ dịka isi mmalite ahụ mere.
- source_word: μεμαρτύρηκε
  choice: ọ gbaakwala ama
  rationale: ‘Ịgba ama’ bụ okwu Igbo doro anya maka ịgba akaebe ma na-edobe ihe oyiyi onye akaebe dị na μαρτυρέω. Akụkụ perfect na-egosi na akaebe o nyere ka bara uru ugbu a.
- source_word: τῇ ἀληθείᾳ
  choice: banyere eziokwu ahụ
  rationale: ‘Banyere’ na-egosi ihe akaebe ahụ metụtara, ebe ‘eziokwu ahụ’ na-edobe definite article nke Grik na ụda pụrụ iche okwu a nwere n’Oziọma Jọn.
theological_decisions:
- issue: Ojiji Jọn ji ‘eziokwu ahụ’
  choice: eziokwu ahụ
  alternative: eziokwu
  rationale: Isiokwu Grik nwere definite article. ‘Eziokwu ahụ’ na-edobe ma usoro asụsụ ahụ ma ibu nkà mmụta okpukpe okwu ahụ nwere ike inwe, n’enweghị ịkọwa ya karịa ihe e dere.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. A kọwara ndị a na-ekwughị aha ha ma ha dị n’omume ‘iziga’ dị ka ‘ndị ozi,’ n’ihi na Igbo agaghị ekwu ya nke ọma ma e wepụ ihe e zigara; nke a anaghị akpọ ụdị ndị ozi ahụ aha karịa ihe ọnọdụ okwu ahụ chọrọ.
