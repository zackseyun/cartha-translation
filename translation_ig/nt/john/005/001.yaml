id: JHN.5.1
reference: John 5:1
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Μετὰ ταῦτα ⸀ἦν ἑορτὴ τῶν Ἰουδαίων, καὶ ⸀ἀνέβη Ἰησοῦς εἰς Ἱεροσόλυμα.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/001.yaml
  text: After these things[a], there was a feast of the Jews[b], and Jesus went up to Jerusalem.
translation:
  language: ig
  text: Mgbe ihe ndị a gasịrị, e nwere otu ememme ndị Juu, Jizọs wee rigoro Jerusalem.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: Mgbe ihe ndị a gasịrị
  rationale: Nke a na-edobe ọtụtụ nke ταῦτα na njikọ akụkọ Jọn n'ụzọ doro anya ma bụrụkwa Igbo ebumpụta ụwa.
- source_word: ἦν
  choice: e nwere
  rationale: Nke a bụ ụzọ Igbo dị mma isi webata ememme ahụ, ma na-egosipụta echiche ịdị adị nke εἰμί.
- source_word: ἑορτὴ
  choice: otu ememme
  rationale: “Ememme” na-egosi oge pụrụ iche nke okpukpe ma ọ bụ nke ọha; “otu” na-egosipụta na aha Grik ahụ enweghị kpọmkwem aha ememme e kwuru.
- source_word: τῶν Ἰουδαίων
  choice: ndị Juu
  rationale: N'ebe a, okwu ahụ na-akọwa ememme ndị Juu na-eme, ọ bụghị naanị ndị bi na Judia.
- source_word: ἀνέβη
  choice: rigoro
  rationale: Nke a na-edobe echiche ‘ịrịgo’ Jerusalem, ma n'ihe banyere elu ala ya ma n'asụsụ njem ofufe a na-ejikarị eme ihe.
- source_word: Ἱεροσόλυμα
  choice: Jerusalem
  rationale: Nke a bụ aha obodo ahụ a na-ejikarị eme ihe n'Igbo.
theological_decisions:
- issue: Ihe Ἰουδαίων na-ezo aka na ya n'okwu Jọn
  choice: ndị Juu
  alternative: ndị Judia
  rationale: Ebe ọ na-akọwa ememme, ihe ọ pụtara ebe a bụ ememme ndị Juu na-eme, ọ bụghị njirimara mpaghara naanị. Nhọrọ a anaghị etinye echiche esemokwu n'amaokwu ahụ.
translation_notes:
  register: Asụsụ Igbo izugbe, nke dị ugbu a ma nwee ugwu; ahịrịokwu ahụ dị mfe nghọta ma na-edobe usoro na njikọ nke Grik.
