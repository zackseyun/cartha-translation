id: JHN.5.34
reference: John 5:34
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐγὼ δὲ οὐ παρὰ ἀνθρώπου τὴν μαρτυρίαν λαμβάνω, ἀλλὰ ταῦτα λέγω ἵνα ὑμεῖς σωθῆτε.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/034.yaml
  text: But I do not receive testimony from man; rather, I say these things so that you may be saved.
translation:
  language: ig
  text: Ma anaghị m anata akaebe sitere n'aka mmadụ; kama, ana m ekwu ihe ndị a ka e wee zọpụta unu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρὰ ἀνθρώπου
  choice: sitere n'aka mmadụ
  rationale: παρά tinyere genitive na-egosi ebe ihe si bịa. “Mmadụ” na-edobe singular ahụ ma na-arụkwa ọrụ n'Igbo dị ka aha na-anọchi mmadụ n'ozuzu ya.
- source_word: μαρτυρίαν
  choice: akaebe
  rationale: “Akaebe” na-egosi ihe e kwuru iji gbaa ama, ma na-edobe ụda nke ikpe na ihe àmà dị n'akụkụ amaokwu a.
- source_word: λαμβάνω
  choice: anata
  rationale: “Anata” bụ ezigbo nhata nke λαμβάνω, ma ọ naghị eme ka okwu ahụ bụrụ naanị ịnakwere na ihe akaebe ahụ bụ eziokwu.
- source_word: ταῦτα
  choice: ihe ndị a
  rationale: Nke a na-edobe demonstrative neuter plural nke Grik n'ụzọ doro anya ma dịkwa eke n'Igbo.
- source_word: λέγω
  choice: ana m ekwu
  rationale: Ụdị a na-asụkarị n'Igbo na-egosi present indicative nke λέγω n'ụzọ dị mma.
- source_word: ἵνα ὑμεῖς σωθῆτε
  choice: ka e wee zọpụta unu
  rationale: “Ka e wee” na-egosi nzube nke ἵνα, ebe “zọpụta unu” na-edobe passive nke σωθῆτε n'ekwughị kpọmkwem onye na-eme nzọpụta n'ahịrịokwu a.
- source_word: δὲ ... ἀλλὰ
  choice: Ma ... kama
  rationale: Nhazi a na-edobe ntụgharị na ọdịiche dị n'etiti ịghara ịnata akaebe mmadụ na nzube Jizọs ji ekwu ihe ndị a.
theological_decisions:
- issue: Ihe “ka e wee zọpụta unu” pụtara n'ọnọdụ a
  choice: E debere okwu nzọpụta ahụ n'obosara ya, n'emeghị ka ọ bụrụ naanị nnapụta anụ ahụ ma ọ bụ otu nkọwa ozizi pụrụ iche.
  alternative: ka a napụta unu; ka unu nweta nzọpụta
  rationale: σωθῆτε nwere ibu okwu nzọpụta, ma amaokwu ahụ akọwaghị usoro ozizi ya kpọmkwem. “Ka e wee zọpụta unu” na-edobe passive na nghọta sara mbara nke ihe odide ahụ.
translation_notes:
  register: Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. E ji “akaebe” mee ka ọdịiche dị n'etiti onye na-agba ama na ihe akaebe ya doo anya; e jighị okwu chọọchị pụrụ iche ma ọ bụ nkọwa otu ụka.
