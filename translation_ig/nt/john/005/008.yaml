  text: λέγει αὐτῷ ὁ Ἰησοῦς· ⸀Ἔγειρε ἆρον τὸν κράβαττόν σου καὶ περιπάτει.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/008.yaml
  text: Jesus says to him[a], “Get up, pick up your mat, and walk.”
translation:
  language: ig
  text: Jizọs sịrị ya, “Bilie, buru ute gị[a], jee ije.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “ihe ndina gị.” Okwu Grik a na-ezo aka n’ute ma ọ bụ ihe ndina dị mfe mmadụ na-edina n’elu ya, ọ bụghịkwa nnukwu ihe ndina.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: sịrị
  rationale: Ọ bụ ezie na Grik ji oge ugbu a nke akụkọ mee ihe, ‘sịrị’ bụ ụzọ Igbo ebumpụta ụwa si akọ ihe mere n’oge gara aga, ma ọ naghị agbanwe ihe okwu ahụ pụtara.
- source_word: αὐτῷ
  choice: ya
  rationale: Nnochiaha a na-egosi onye Jizọs gwara okwu, ya mere ‘ya’ bụ ntụgharị Igbo dị mfe ma zie ezi.
- source_word: Ἔγειρε
  choice: Bilie
  rationale: Iwu a na-agwa nwoke ahụ ka o si n’ọnọdụ ọ nọ bilie ozugbo; ‘Bilie’ bụ okwu Igbo doro anya ma nwee ike iwu ahụ chọrọ.
- source_word: ἆρον
  choice: bulie
  rationale: Okwu a pụtara iweli ma ọ bụ iburu ihe; ‘bulie’ na-egosi omume iweli ute ahụ n’ụzọ doro anya n’enweghị ịgbakwụnye nkọwa ọzọ.
- source_word: κράβαττόν
  choice: ute
  rationale: Okwu Grik a na-ezo aka n’ihe dị mfe mmadụ na-edina n’elu ya, nke a pụrụ iburu, ọ bụghị iwu na ọ bụ nnukwu akwa nwere ihe ndina.
- source_word: περιπάτει
  choice: jegharịa
  rationale: N’ebe a, okwu ahụ pụtara iji ụkwụ na-eje ije n’ezie; ‘jegharịa’ na-enye iwu ahụ n’Igbo dị ugbu a ma ghara ime ka akụkụ ngwaa Grik kwuo ihe karịrị ya.
theological_decisions:
- issue: Ụdị iwu Jizọs nyere n’ọnọdụ ọgwụgwọ a
  choice: 'E debere iwu atọ ahụ dị ka iwu kpọmkwem banyere omume anụ ahụ: bilie, bulie ute, jegharịa.'
  alternative: Ịgbasa ya ka ọ bụrụ, ‘Bilie, a gwọọla gị,’ ma ọ bụ ịgbakwụnye okwu ọzọ banyere ọrụ ebube.
  rationale: Amaokwu Grik ahụ n’onwe ya ekwughị kpọmkwem, ‘a gwọọla gị.’ Ọnọdụ gbara ya gburugburu na-egosi ọgwụgwọ ahụ, ma ntụgharị ekwesịghị ịgbakwụnye ihe na-adịghị n’okwu amaokwu a.
translation_notes:
  register: E ji Igbo Izugbe nke dị mfe, dị ugwu, ma bụrụkwa nke ndị na-agụ akwụkwọ taa ga-aghọta. E tinyere akara nkọwa ala ala peeji [a] ozugbo n’akụkụ ‘ute gị,’ bụ́ okwu nkọwa ahụ metụtara.
