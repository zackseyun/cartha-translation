revisions:
- from: Jizọs sịrị ya, “Bilie, bulie ute gị[a], jegharịa.”
  to: Jizọs sịrị ya, “Bilie, buru ute gị[a], jee ije.”
  rationale: The revision improves precision and contemporary Standard Igbo idiom while preserving the source’s direct commands and the lexical distinction between a portable mat and a substantial bed. No theological interpretation has been added.
