review_pass:
  verdict: revise
  source_fidelity: The three Greek imperatives are retained as direct commands, without adding an explicit statement of healing. ‘Bilie’ accurately renders Ἔγειρε. Replacing ‘bulie’ with ‘buru’ better conveys ἆρον, ‘take up/carry,’ and replacing ‘jegharịa’ with ‘jee ije’ avoids the possible sense ‘walk about’ and gives the simple physical command περιπάτει.
  naturalness: ‘Jizọs sịrị ya’ is idiomatic Standard Igbo narrative speech. ‘Bilie, buru ute gị, jee ije’ is concise, natural, and suitably direct.
  terminology: '‘Ute’ is an appropriate rendering of κράβαττος in this context: a portable mat or simple sleeping pallet. The note preserves ‘ihe ndina’ as a viable broader alternative without implying a substantial bed.'
  issues:
  - severity: medium
    issue: ‘jegharịa’ can suggest walking about, wandering, or moving around.
    rationale: περιπάτει here commands the man simply to walk. ‘Jee ije’ is the ordinary unambiguous Standard Igbo expression for this physical action.
  - severity: low
    issue: ‘bulie’ foregrounds lifting but does not as clearly express taking the mat along.
    rationale: ἆρον means ‘take up’ and, in context, entails carrying the mat. ‘Buru’ naturally expresses this intended action in Igbo.
  revised_text: Jizọs sịrị ya, “Bilie, buru ute gị[a], jee ije.”
