  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ εὐθέως ἐγένετο ὑγιὴς ὁ ἄνθρωπος καὶ ἦρε τὸν κράβαττον αὐτοῦ καὶ περιεπάτει. Ἦν δὲ σάββατον ἐν ἐκείνῃ τῇ ἡμέρᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/009.yaml
  text: And immediately the man became well[a], and he picked up his mat and began to walk[c][b]. Now that day was a Sabbath.
translation:
  language: ig
  text: Ozugbo ahụ, nwoke ahụ gbakere; o wee bulie ute ya[a] ma malite ịga ije[b]. Ma ụbọchị ahụ bụ ụbọchị izu ike[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ihe ndina ya.” Okwu Grik κράβαττον na-ezo aka n’ute, obere ihe ndina, ma ọ bụ ihe a na-agbasa n’ala maka ihi ụra; ọ pụtaghị mgbe niile akwa ukwu dị ka arịa ụlọ.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “na-ejegharị.” Ụdị ngwaa Grik a nwere ike imesi omume na-aga n’ihu ike; n’ebe a, a pụkwara ịghọta ya dị ka mmalite ije ya mgbe ọ gbakere.
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “ụbọchị izu ike ahụ.” Grik ahụ pụtara n’ụzọ nkịtị, “ọ bụ ụbọchị izu ike n’ụbọchị ahụ.”
    reason: alternative_reading
lexical_decisions:
- source_word: εὐθέως
  choice: Ozugbo ahụ
  rationale: Ọ na-egosi na ọgwụgwọ ahụ mere n’otu ntabi anya, ma dabara n’asụsụ Igbo a na-asụ ugbu a.
- source_word: ἐγένετο ὑγιὴς
  choice: gbakere
  rationale: Ọ na-egosi mgbanwe nwoke ahụ si n’ọrịa banye n’ọnọdụ ịdị mma, n’ebughị ụzọ mee ka onye mere ya pụta ìhè karịa ka Grik si kwuo.
- source_word: ὁ ἄνθρωπος
  choice: nwoke ahụ
  rationale: N’akụkọ a, aha nwoke nke otu onye na-ezo aka n’otu nwoke a kpọtụrụla aha.
- source_word: ἦρε
  choice: buliri
  rationale: Ọ na-egosi na o weliri ihe ahụ ka o buru ya; nke a bụ okwu doro anya ma kwekọọ n’ihe a na-eme ute a pụrụ ibugharị.
- source_word: κράβαττον
  choice: ute
  rationale: Okwu Grik ahụ na-ezo aka n’ute ma ọ bụ ihe dị mfe mmadụ na-edina n’elu ya, ọ bụghịcha akwa ukwu dị ka arịa ụlọ.
- source_word: περιεπάτει
  choice: malitekwa ịga ije
  rationale: Imperfect Grik nwere ike igosi omume na-aga n’ihu ma ọ bụ mmalite ya; n’ọnọdụ ọgwụgwọ a, nkebiokwu a na-egosi na ike ije laghachiri, ebe nkọwa ọzọ dị na ndetu ala peeji.
- source_word: Ἦν δὲ
  choice: Ma ... bụ
  rationale: δέ na-ebute nkọwa akụkọ dị mkpa nke ga-akwadebe esemokwu na-esote; “Ma” na-egosi ntụgharị ahụ n’enweghị ime ka ọ bụrụ nnukwu mmegide.
- source_word: σάββατον
  choice: ụbọchị izu ike
  rationale: Nke a bụ ụzọ Igbo doro anya si akọwa ụbọchị izu ike ndị Juu, ma ọ naghị etinye nkọwa ụka pụrụ iche.
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: ụbọchị ahụ
  rationale: Nke a bụ usoro Igbo dị mfe ma kwekọọ n’echiche nke ‘n’ụbọchị ahụ.’
theological_decisions:
- issue: Otu e si sụgharị σάββατον n’akụkọ a
  choice: ụbọchị izu ike
  alternative: ụbọchị izu ike ahụ
  rationale: σάββατον enweghị article n’ebe a, ya mere nsụgharị bụ isi na-akọ ụdị ụbọchị ọ bụ, n’emeghị ka ọ bụrụ aha nwere article. N’agbanyeghị nke ahụ, usoro nwere ‘ahụ’ nwekwara ike ịdị mma n’Igbo n’ihi na ọ bụ ụbọchị a kapịrị ọnụ n’akụkọ ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta, dee ya. A họọrọ “ute” kama okwu nwere ike ime ka ndị na-agụ ya chee maka akwa ukwu a na-apụghị ibugharị. E debere nkọwa gbasara aspect nke περιεπάτει na article nke σάββατον na ndetu ala peeji iji chekwaa nghọta ndị ọzọ Grik nwere ike ibu.
