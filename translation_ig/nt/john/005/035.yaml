  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐκεῖνος ἦν ὁ λύχνος ὁ καιόμενος καὶ φαίνων, ὑμεῖς δὲ ἠθελήσατε ἀγαλλιαθῆναι πρὸς ὥραν ἐν τῷ φωτὶ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/john/005/035.yaml
  text: He was the lamp that was burning and shining[a], and you were willing to rejoice for a time in his light.
translation:
  language: ig
  text: Ọ bụ oriọna ahụ na-ere ọkụ ma na-enwu, ma unu chọrọ ịṅụrị ọṅụ n’ìhè ya ruo nwa oge.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, ‘ruo oge nta.’ Nkebiokwu a na-ekwu maka oge nwere njedebe, ọ bụghị kpọmkwem otu awa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκεῖνος
  choice: Ọ
  rationale: Nnọchiaha a na-arụtụ aka n’ụzọ doro anya n’ebe Jọn nọ n’okwu gbara amaokwu ahụ gburugburu; Igbo nkịtị anaghị achọ ka e tinye ‘nwoke ahụ’ ebe a.
- source_word: λύχνος
  choice: oriọna
  rationale: Ọ pụtara oriọna a na-amụnye, ọ bụghị ìhè n’onwe ya. Nhọrọ a na-edobe ọdịiche dị n’etiti Jọn, bụ́ onye na-agba àmà, na ìhè ahụ.
- source_word: καιόμενος καὶ φαίνων
  choice: na-ere ọkụ ma na-enwu
  rationale: 'Ngwaa abụọ a na-egosi ihe oriọna ahụ nọgidere na-eme: ọ na-ere ọkụ, na-enwukwa. Nsụgharị a dị mfe ma dị ndụ n’Igbo.'
- source_word: ἠθελήσατε
  choice: unu chọrọ
  rationale: ‘Chọrọ’ na-egosi ọchịchọ ma ọ bụ nkwenye obi nke dị na ngwaa Grik, n’emeghị ka ọ bụrụ mkpebi siri ike karịa ihe ederede kwuru.
- source_word: ἀγαλλιαθῆναι
  choice: ịṅụrị ọṅụ
  rationale: Nkebiokwu a na-egosi ọṅụ siri ike, ma ọ bụkwa okwu Igbo doro anya nke ndị mmadụ na-aghọta.
- source_word: πρὸς ὥραν
  choice: ruo nwa oge
  rationale: N’ebe a, nkebiokwu ahụ na-egosi oge dị mkpirikpi, ọ bụghị kpọmkwem nkeji iri isii.
- source_word: ἐν τῷ φωτὶ αὐτοῦ
  choice: n’ìhè ya
  rationale: Nke a na-edobe ihe atụ nke ndị ahụ na-aṅụrị ọṅụ n’ìhè oriọna ahụ, ya bụ, n’ihe Jọn na-agba àmà banyere ya.
theological_decisions:
- issue: Ọdịiche dị n’etiti Jọn na Jizọs n’ihe atụ nke ìhè n’Oziọma Jọn
  choice: A sụgharịrị Jọn dị ka ‘oriọna,’ ọ bụghị ‘ìhè.’
  alternative: ‘Ọ bụ ìhè ahụ.’
  rationale: Ederede Grik ji λύχνος, ‘oriọna,’ kama φῶς, ‘ìhè.’ Nke a na-edobe Jọn dị ka onye na-enye àmà na onye ìhè ya sitere n’ebe ọzọ, n’etinyeghị nkọwa okpukpe ọzọ n’ime amaokwu ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. ‘Oriọna,’ ‘na-ere ọkụ ma na-enwu,’ na ‘ruo nwa oge’ na-eme ka ihe atụ ahụ doo anya n’enweghị ịkọwa ya gabiga ihe ederede kwuru.
