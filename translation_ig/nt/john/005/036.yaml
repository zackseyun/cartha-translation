id: JHN.5.36
reference: John 5:36
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐγὼ δὲ ἔχω τὴν μαρτυρίαν ⸀μείζω τοῦ Ἰωάννου, τὰ γὰρ ἔργα ἃ ⸀δέδωκέν μοι ὁ πατὴρ ἵνα τελειώσω αὐτά, αὐτὰ τὰ ἔργα ⸀ἃ ποιῶ, μαρτυρεῖ περὶ ἐμοῦ ὅτι ὁ πατήρ με ἀπέσταλκεν,
base_translation:
  language: en
  yaml_path: translation/nt/john/005/036.yaml
  text: But I have testimony greater than John's[a], for the works that the Father has given me to complete—these very works that I am doing—testify about me that the Father has sent me.
translation:
  language: ig
  text: Ma enwere m ihe akaebe karịrị nke Jọn; n’ihi na ọrụ ndị Nna nyeworo m ka m rụzuo—ya bụ, ọrụ ndị a m na-arụ—na-agba akaebe banyere m na Nna ezitelawo m.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μαρτυρίαν
  choice: ihe akaebe
  rationale: “Ihe akaebe” na-egosi ihe e ji akwado eziokwu ma dabara nke ọma na ọnọdụ okwu ikpe na ịgba akaebe dị n’amaokwu a.
- source_word: μείζω τοῦ Ἰωάννου
  choice: ka nke Jọn ukwuu
  rationale: Nke a na-edobe ntụnyere ahụ na mkpirisi okwu Grik, ebe “nke Jọn” pụtara ihe akaebe Jọn.
- source_word: ἔργα
  choice: ọrụ
  rationale: “Ọrụ” sara mbara karịa naanị ọrụ ebube, ya mere ọ na-edobe ibu okwu a nwere n’Oziọma Jọn banyere ihe niile Nna nyere Jizọs ka o mee.
- source_word: δέδωκέν μοι ὁ πατήρ
  choice: Nna nyere m
  rationale: Nhazi a bụ Igbo nkịtị ma na-egosi na ọrụ ndị ahụ sitere n’aka Nna; ihe si n’omume gara aga pụta ka dịgide n’ọrụ e nyere ya.
- source_word: ἵνα τελειώσω αὐτά
  choice: ka m rụzuo
  rationale: “Rụzuo” na-egosi iweta ọrụ e nyere ya ruo na mmezu ya, ọ bụghị nanị ịkwụsị ime ya.
- source_word: αὐτὰ τὰ ἔργα ἃ ποιῶ
  choice: ọ bụ ọrụ ndị a m na-arụ ugbu a
  rationale: “Ọ bụ ... ndị a” na-ebupụta nkwusi ike nke αὐτὰ, “na-arụ ugbu a” egosikwa omume na-aga n’ihu.
- source_word: μαρτυρεῖ περὶ ἐμοῦ
  choice: na-agba akaebe banyere m
  rationale: Nke a bụ okwu Igbo doro anya nke na-echekwa echiche iwu na nkwado eziokwu dị na μαρτυρέω.
- source_word: ἀπέσταλκεν
  choice: zitụrụ m
  rationale: Ọ na-egosi izite Jizọs site n’aka Nna; n’amaokwu ahụ, ọrụ ya na-agba akaebe banyere ozi ahụ.
theological_decisions:
- issue: Ụdị ihe akaebe na-akwado Jizọs
  choice: Ọrụ Nna nyere Jizọs ka ọ rụọ bụ ihe akaebe ka nke Jọn ukwuu, na-egosikwa na Nna zitere ya.
  alternative: Ịkọwa ọrụ ndị ahụ dị ka naanị ọrụ ebube.
  rationale: ἔργα nwere ike ịgụnye ọrụ ebube, ma okwu ahụ sara mbara ma nwee ike ịpụta ọrụ niile Nna nyere Jizọs; nsụgharị ahụ anaghị eme ka ọ bụrụ naanị ọrụ ebube.
- issue: Nsụgharị ὁ πατήρ
  choice: Nna
  alternative: Chineke; Nna m
  rationale: Grik kwuru “Nna” dị ka aha pụrụ iche, na-enweghị “m” n’ebe a; nsụgharị ahụ anaghị etinye okwu na-anọghị n’isi mmalite.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E debere nkwughachi nke “ọrụ” iji chekwaa nkwusi ike dị n’isi mmalite, ma zere ịkọwa ἔργα dịka naanị ọrụ ebube.
