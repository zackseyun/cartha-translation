  text: Ἐὰν ἐγὼ μαρτυρῶ περὶ ἐμαυτοῦ, ἡ μαρτυρία μου οὐκ ἔστιν ἀληθής·
base_translation:
  language: en
  yaml_path: translation/nt/john/005/031.yaml
  text: If I testify about myself[a], my testimony is not true.
translation:
  language: ig
  text: Ọ bụrụ na mụ onwe m agba akaebe banyere onwe m, akaebe m abụghị eziokwu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “akaebe m adịghị irè,” nke na-egosi ọnọdụ iwu metụtara akaebe.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐὰν
  choice: Ọ bụrụ na
  rationale: Ọ na-ewebata ahịrịokwu ọnọdụ; nke a bụ ụzọ Igbo doro anya si kwuo ‘if’ n’ebe a.
- source_word: ἐγὼ
  choice: mụ onwe m
  rationale: Nnọchiaha Grik pụtara ìhè ma nwee obere nkwusi ike; ‘mụ onwe m’ na-edobe nkwusi ike ahụ n’Igbo.
- source_word: μαρτυρῶ
  choice: na-agba akaebe
  rationale: Nke a bụ okwu Igbo e ji eme ihe maka ịgba akaebe, ma na-edobe echiche nke onye akaebe na ọnọdụ ikpe.
- source_word: περὶ ἐμαυτοῦ
  choice: banyere onwe m
  rationale: Ọ na-asụgharị echiche ‘about/concerning myself’ ozugbo, n’etinyeghị echiche ọzọ nke ịgbachitere onwe ya.
- source_word: ἡ μαρτυρία μου
  choice: akaebe m
  rationale: Ọ na-ejikọta n'ụzọ eke na ngwaa ‘na-agba akaebe’ ma na-edobe echiche nke ihe akaebe onye na-enye.
- source_word: οὐκ ἔστιν ἀληθής
  choice: abụghị eziokwu
  rationale: Nke a na-edobe isi ihe ἀληθής pụtara na esemokwu dị n’okwu ahụ, kama ịkọwa ya naanị dị ka iwu kwadoro ya.
theological_decisions:
- issue: Ihe Jizọs pụtara mgbe ọ sịrị na akaebe ya ‘abụghị eziokwu’
  choice: abụghị eziokwu
  alternative: enweghị ike ịkwado onwe ya n’usoro ikpe
  rationale: ἀληθής pụtara ‘eziokwu’; nsụgharị bụ isi kwesịrị idobe okwu ahụ na esemokwu nkọwa ya. Ọnọdụ a metụtara usoro ndị akaebe, ya mere echiche nke ịdị irè n’usoro ikpe kwesịrị ịdị na nkọwa ala peeji, ọ bụghị dochie okwu bụ isi.
translation_notes:
  register: Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E ji ‘ịgba akaebe’ debe ma okwu akaebe nkịtị ma ụda metụtara usoro ikpe; e debeghịkwa esemokwu dị n’okwu ‘abụghị eziokwu’ n’ụzọ ga-eme ka otu nkọwa okpukpe bụrụ naanị ya.
