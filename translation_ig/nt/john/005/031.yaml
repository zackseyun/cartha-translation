  source_fidelity: 'The draft accurately represents all major Greek elements: the conditional Ἐὰν, the emphatic explicit subject ἐγώ, the witness/testimony word group, περί ἐμαυτοῦ (‘about myself’), and the unsoftened predicate ‘is not true.’ The principal text properly preserves the lexical and interpretive tension of ἀληθής rather than making a legal-validity interpretation the main rendering.'
  naturalness: ‘Ọ bụrụ na mụ onwe m na-agba akaebe’ can be understood, but the progressive form na-agba is less apt for the general/hypothetical conditional expressed by the Greek present subjunctive. ‘Ọ bụrụ na mụ onwe m agba akaebe’ is more natural and direct in this conditional construction. The remainder is clear Standard Igbo.
  terminology: ‘Ịgba akaebe’ and ‘akaebe’ are suitable, consistent contemporary Igbo legal/evidentiary terms. The main-text expression ‘akaebe m abụghị eziokwu’ appropriately retains the source wording. The footnote’s current wording (‘enweghị ike ịkwado onwe ya’) introduces the different idea of self-corroboration; it should instead express the lexical alternative of legal validity directly.
