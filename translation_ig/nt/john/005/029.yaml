revisions:
- from: ha ga-apụtakwa—ndị mere ihe ọma ga-abanye ná mbilite n’ọnwụ nke ndụ, ma ndị mere ihe ọjọọ ga-abanye ná mbilite n’ọnwụ nke ikpe.[a]
  to: ha ga-apụta—ndị mere ihe ọma ga-enwe mbilite n’ọnwụ nke ndụ, ma ndị mere ihe ọjọọ ga-enwe mbilite n’ọnwụ nke ikpe.[a]
  rationale: The revision corrects the unnatural and potentially misleading “enter into resurrection” construction, while preserving the Greek contrast, the formal genitive parallelism, and the deliberate breadth of κρίσις. It also removes an unnecessary additive enclitic from the opening verb. The footnote remains properly anchored to «ikpe» and does not impose the narrower alternative on the main text.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T05:38:41Z'
review_pass:
  verdict: revise
  source_fidelity: 'The principal terms are represented accurately: «ihe ọma» / «ihe ọjọọ» conveys τὰ ἀγαθὰ / τὰ φαῦλα, and «mbilite n’ọnwụ nke ndụ» / «mbilite n’ọnwụ nke ikpe» preserves the deliberate parallelism and the breadth of ἀνάστασις ζωῆς / ἀνάστασις κρίσεως. However, «ga-abanye ná mbilite n’ọnwụ» (“will enter into resurrection”) is not a natural or precise rendering of εἰς ἀνάστασιν in this context. It can imply entering a place or state, rather than the respective resurrection experienced by each group. «Ga-enwe mbilite n’ọnwụ» expresses the result without adding an interpretive destination such as “to life” or “for condemnation.”'
  naturalness: The revised wording is clear, modern Standard Igbo, and retains the balanced two-part construction. Removing the enclitic «-kwa» avoids adding an unrepresented “also,” while «ga-enwe mbilite n’ọnwụ» avoids the semantically awkward notion of entering a resurrection.
  terminology: «Ikpe» is the appropriate primary rendering for κρίσις; it should not be narrowed in the main text to condemnation. The alternative «ikpe ọmụma» is retained only in the footnote and explicitly identified as narrower. «Mbilite n’ọnwụ» is established, comprehensible theological terminology in Standard Igbo.
  issues:
  - severity: medium
    issue: «ga-abanye ná mbilite n’ọnwụ» renders the two εἰς ἀνάστασιν phrases awkwardly.
    rationale: The expression literally means “will enter into resurrection” and may portray resurrection as a place entered. The Greek describes emergence resulting in/leading to a resurrection, not entry into one. «Ga-enwe mbilite n’ọnwụ» is a safe, idiomatic Igbo formulation that preserves the parallel categories.
  - severity: low
    issue: «apụtakwa» adds «-kwa» (“also”).
    rationale: The Greek has καί, but it simply continues the preceding statement; the added Igbo enclitic is unnecessary in this verse and can introduce emphasis not explicit in the source.
  revised_text: ha ga-apụta—ndị mere ihe ọma ga-enwe mbilite n’ọnwụ nke ndụ, ma ndị mere ihe ọjọọ ga-enwe mbilite n’ọnwụ nke ikpe.[a]
