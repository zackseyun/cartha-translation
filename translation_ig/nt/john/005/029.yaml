  text: καὶ ἐκπορεύσονται οἱ τὰ ἀγαθὰ ποιήσαντες εἰς ἀνάστασιν ζωῆς, οἱ ⸀δὲ τὰ φαῦλα πράξαντες εἰς ἀνάστασιν κρίσεως.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/029.yaml
  text: and will come out—those who have done good to the resurrection of life[a], but those who have done evil to the resurrection of judgment.
translation:
  language: ig
  text: ha ga-apụta—ndị mere ihe ọma ga-enwe mbilite n’ọnwụ nke ndụ, ma ndị mere ihe ọjọọ ga-enwe mbilite n’ọnwụ nke ikpe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “mbilite n’ọnwụ nke ikpe ọmụma.” Okwu Grik pụtara “ikpe,” nke sara mbara karịa; “ikpe ọmụma” na-enye nkọwa dị warara nke ụfọdụ nsụgharị na-eji.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκπορεύσονται
  choice: ha ga-apụta
  rationale: N’ọnọdụ a, ndị nwụrụ anwụ na-apụta n’ili ha; “ga-apụta” bụ okwu Igbo doro anya ma dịkwa n’usoro asụsụ nke oge a.
- source_word: τὰ ἀγαθὰ ποιήσαντες
  choice: ndị mere ihe ọma
  rationale: Nke a na-egosipụta adjective e ji dị ka aha ihe na participle aorist n’ụzọ dị mkpirikpi ma kwekọọ n’Igbo.
- source_word: ἀνάστασιν ζωῆς
  choice: mbilite n’ọnwụ nke ndụ
  rationale: Ọ na-edobe njikọ genitive na myiri ahịrịokwu abụọ ahụ, n’agbanyeghị na a pụkwara ịghọta ya dị ka mbilite n’ọnwụ na-eduga ná ndụ.
- source_word: τὰ φαῦλα πράξαντες
  choice: ndị mere ihe ọjọọ
  rationale: N’ọnọdụ ikpe a, φαῦλα na-egosi omume rụrụ arụ; “ihe ọjọọ” na-ebute echiche omume ọma na omume ọjọọ nke ọma. “Mere” bụkwa Igbo eke karịa ịmanye ọdịiche dị n’etiti ποιέω na πράσσω.
- source_word: ἀνάστασιν κρίσεως
  choice: mbilite n’ọnwụ nke ikpe
  rationale: “Ikpe” na-edobe obosara κρίσις ma ghara ime ka ọ bụrụ naanị ikpe ọmụma ma ọ bụ amamikpe.
- source_word: δὲ
  choice: ma
  rationale: “Ma” na-egosi ọdịiche doro anya n’etiti ìgwè abụọ ahụ na ihe na-echere ha.
theological_decisions:
- issue: Ma a ga-asụgharị κρίσεως dị ka “ikpe” ka ọ bụ mee ka ọ dị warara dị ka “ikpe ọmụma.”
  choice: ikpe
  alternative: ikpe ọmụma
  rationale: κρίσις n’onwe ya pụtara ikpe n’ụzọ sara mbara. Nhọrọ a na-edobe esemokwu na ịdị arọ nke okwu Grik n’ebughị ụzọ kpebie na ọ bụ naanị amamikpe ka okwu ahụ kpọmkwem pụtara.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị nsọ ma dị mfe nghọta. E debere myiri dị n’etiti “mbilite n’ọnwụ nke ndụ” na “mbilite n’ọnwụ nke ikpe,” ma e zere ịgbakwunye “n’ili” n’ahịrịokwu a n’agbanyeghị na amaokwu bu ụzọ na-enye ọnọdụ ahụ.
