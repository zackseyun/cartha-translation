id: JHN.5.25
reference: John 5:25
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἀμὴν ἀμὴν λέγω ὑμῖν ὅτι ἔρχεται ὥρα καὶ νῦν ἐστιν ὅτε οἱ νεκροὶ ⸀ἀκούσουσιν τῆς φωνῆς τοῦ υἱοῦ τοῦ θεοῦ καὶ οἱ ἀκούσαντες ⸀ζήσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/025.yaml
  text: Truly[a], truly, I say to you that an hour is coming, and now is, when the dead will hear the voice of the Son of God[d][c][b], and those who hear will live.
translation:
  language: ig
  text: N’ezie[a], n’ezie, ana m asị unu na awa na-abịa, ọ dịkwa ugbu a,[b] mgbe ndị nwụrụ anwụ[c] ga-anụ olu Ọkpara Chineke, ndị nụrụ olu ahụ[d] ga-adịkwa ndụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n’ụdị na-agbasochi mkpụrụokwu anya karị, “Amen, amen, ana m asị unu.”
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịghọta “awa” n’ụzọ sara mbara dị ka “oge,” ma okwu Grik e ji mee ihe bụ kpọmkwem “awa.”
    reason: lexical_alternative
  - marker: c
    text: N’ebe a, “ndị nwụrụ anwụ” nwere ike ịgụnye ndị nwụrụ anwụ n’ime mmụọ ugbu a—dị ka okwu “ọ dịkwa ugbu a” na-egosi—ma na-atụkwa aka ná mbilite n’ọnwụ nke anụ ahụ n’ihe gbara amaokwu a gburugburu.
    reason: cross_reference
  - marker: d
    text: Ma ọ bụ, “ndị nụrụ olu ahụ ga-adị ndụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀμὴν ἀμὴν
  choice: N’ezie, n’ezie
  rationale: Ọ na-edobe nkwughachi ahụ e ji mesie okwu ike, ma na-ada nke ọma ma doo ndị na-agụ Igbo nke oge a anya. A pụrụ idekwa ya n’ụdị mkpụrụokwu ya dị ka ‘Amen, amen.’
- source_word: λέγω ὑμῖν
  choice: ana m asị unu
  rationale: Ọ na-egosi okwu a na-agwa ọtụtụ mmadụ ozugbo ma na-edobe ụda nkwupụta ahụ.
- source_word: ἔρχεται ὥρα
  choice: oge awa na-abịa
  rationale: ‘Oge awa’ na-edobe okwu Grik ὥρα, nke nwere mkpa pụrụ iche n’Oziọma Jọn, kama ịsụgharị ya naanị dị ka ‘oge.’
- source_word: καὶ νῦν ἐστιν
  choice: ọ dịkwa ugbu a
  rationale: Ọ na-edobe esemokwu dị n’etiti ihe ka na-abịa na ihe dịlarị ugbu a, n’agbanyeghị na okwu Grik ahụ dị mkpirikpi nke ukwuu.
- source_word: οἱ νεκροὶ
  choice: ndị nwụrụ anwụ
  rationale: Nke a bụ ntụgharị Igbo doro anya nke na-adịghị ekpebi ma okwu ahụ ọ na-ekwu banyere ọnwụ ime mmụọ naanị ya, ka ọ na-atụkwa aka ná mbilite n’ọnwụ nke anụ ahụ.
- source_word: ἀκούσουσιν τῆς φωνῆς
  choice: ga-anụ olu
  rationale: N’ebe a φωνή bụ olu onye, ἀκούω na-egosikwa ịnụ ya, ọ bụghị naanị ige ntị n’ụzọ na-etinye nzaghachi n’ime ntụgharị ahụ.
- source_word: τοῦ υἱοῦ τοῦ θεοῦ
  choice: Ọkpara Chineke
  rationale: Nke a na-edobe aha zuru ezu nke Kraịst n’ụzọ e ji ya eme ihe n’Igbo, n’etinyeghị nkọwa ọzọ.
- source_word: οἱ ἀκούσαντες
  choice: ndị nụrụ ya
  rationale: Partisịpụ a dị n’ụdị aorist, ya mere ‘ndị nụrụ ya’ na-egosi na ịnụ olu ahụ bu ụzọ tupu ịdị ndụ. Ihe okwu ahụ pụtara n’okwu a nwekwara ike ịbụ ‘ndị na-anụ ya.’
- source_word: ζήσουσιν
  choice: ga-adịkwa ndụ
  rationale: Ọ na-edobe ihe ζάω pụtara kpọmkwem, ‘ịdị ndụ,’ na-enweghị ime ka ọ bụrụ naanị mbilite n’ọnwụ nke anụ ahụ site n’ịsị ‘ga-alọghachi ndụ.’
theological_decisions:
- issue: Ndị okwu ahụ kpọrọ ‘ndị nwụrụ anwụ’ bụ ndị dị aṅaa?
  choice: E debere ya dị ka ‘ndị nwụrụ anwụ’ n’enweghị nkọwa agbakwunyere.
  alternative: ‘ndị nwụrụ anwụ n’ime mmụọ’ ma ọ bụ ‘ndị nwụrụ anwụ n’anụ ahụ’
  rationale: ‘Ọ dịkwa ugbu a’ na-egosi akụkụ nke na-eme ugbu a, ebe ihe gbara amaokwu a gburugburu na Jọn 5 na-ekwu kwa banyere mbilite n’ọnwụ nke anụ ahụ. Ntụgharị ahụ ekwesịghị iwepụ esemokwu ahụ.
- issue: Aha Kraịst bụ τοῦ υἱοῦ τοῦ θεοῦ
  choice: Ọkpara Chineke
  alternative: Nwa Chineke
  rationale: ‘Ọkpara Chineke’ na-egosipụta aha ahụ n’ụzọ doro anya ma dị nsọ n’Igbo, n’etinyeghị ozizi ọzọ na-adịghị n’okwu Grik.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị nsọ ma dị mfe nghọta, dee ya. E debere nkwughachi dị n’okwu mmeghe na esemokwu dị n’etiti ‘na-abịa’ na ‘ugbu a.’ E zere ịkọwa ‘ndị nwụrụ anwụ’ n’otu ụzọ ozizi naanị.
