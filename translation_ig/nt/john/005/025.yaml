  to: N’ezie[a], n’ezie, ana m asị unu na awa na-abịa, ọ dịkwa ugbu a,[b] mgbe ndị nwụrụ anwụ[c] ga-anụ olu Ọkpara Chineke, ndị nụrụ olu ahụ[d] ga-adịkwa ndụ.
