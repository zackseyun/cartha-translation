  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὥσπερ γὰρ ὁ πατὴρ ἔχει ζωὴν ἐν ἑαυτῷ, οὕτως ⸂καὶ τῷ υἱῷ ἔδωκεν⸃ ζωὴν ἔχειν ἐν ἑαυτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/john/005/026.yaml
  text: For just as the Father has life in himself[b][a], so he also granted the Son to have life in himself.
translation:
  language: ig
  text: N’ihi na, dị ka Nna nwere ndụ n’ime onwe ya[b], otu a ka Ọ nyekwara Ọkpara ka o nwee ndụ n’ime onwe ya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “nyere Ọkpara inwe ndụ n’ime onwe ya.” Ngwaa Grik ahụ bụ okwu nkịtị pụtara “nyere.”
    reason: lexical_alternative
  - marker: b
    text: “Ndụ n’ime onwe ya” nwere ike igosi ndụ dị n’ime onye ahụ n’onwe ya. Ntụgharị a na-edobe okwu Grik ahụ kama iji okwu nkà mmụta okpukpe dịka “ndụ nke sitere n’onwe ya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥσπερ γὰρ
  choice: N’ihi na, dị nnọọ ka
  rationale: “N’ihi na” na-egosipụta njikọ nkọwa nke γάρ, ebe “dị nnọọ ka” na-edobe ntụnyere ὥσπερ n’ụzọ Igbo doro anya.
- source_word: ὁ πατὴρ
  choice: Nna ahụ
  rationale: Aha e ji akọwa Chineke dị ka Nna n’okwu Jọn; “ahụ” na-egosipụta definite article nke Grik n’ụzọ dabara n’Igbo.
- source_word: ἔχει ζωὴν
  choice: nwere ndụ
  rationale: Ntụgharị kwụ ọtọ nke ngwaa dị n’oge ugbu a na ihe ọ na-achị, n’enweghị ịgbakwunye nkọwa.
- source_word: ζωὴν ἐν ἑαυτῷ
  choice: ndụ n’ime onwe ya
  rationale: Na-edobe prepositional phrase ahụ ma ghara iji okwu nkà mmụta okpukpe dị ka “ndụ nke sitere n’onwe ya” dochie ya.
- source_word: οὕτως καὶ
  choice: otu ahụkwa ka
  rationale: Na-edobe usoro ntụnyere ὥσπερ…οὕτως na kwa echiche nke καί, “kwa.”
- source_word: τῷ υἱῷ
  choice: Ọkpara ahụ
  rationale: Ọ bụ indirect object nke ἔδωκεν; “Ọkpara” bụ aha nsọpụrụ Kraịst a na-aghọta nke ọma n’Igbo.
- source_word: ἔδωκεν
  choice: nyere
  rationale: Nke a bụ ntụgharị nkịtị na nke ziri ezi nke ngwaa Grik ahụ; ọ na-edobe asụsụ inye n’emeghị ka ihe e nyere pụta ihe ọzọ karịa ihe ederede kwuru.
- source_word: ζωὴν ἔχειν
  choice: ka o nwee ndụ
  rationale: Na-egosipụta infinitive construction ahụ n’usoro Igbo dị mfe ma dị ndụ.
- source_word: ἐν ἑαυτῷ
  choice: n’ime onwe ya
  rationale: E jiri otu ahịrịokwu ahụ mee ihe ugboro abụọ iji chekwaa myirịta dị n’etiti Nna na Ọkpara.
theological_decisions:
- issue: Ma a ga-eme ka amaokwu ahụ kwuo kpọmkwem “ndụ nke sitere n’onwe ya” ma ọ bụ aseity
  choice: E debere “ndụ n’ime onwe ya” n’ahịrịokwu bụ isi.
  alternative: “ndụ nke sitere n’onwe ya”
  rationale: ἐν ἑαυτῷ pụtara n'ụzọ nkịtị “n’ime onwe ya.” Ntụgharị ahụ na-edobe ibu nkà mmụta okpukpe dị n’okwu ahụ ma ghara iji okwu e mepụtara mgbe e mesịrị kpebie nkọwa ya.
- issue: Otu a ga-esi ghọta ἔδωκεν n’ihe gbasara mmekọrịta Nna na Ọkpara
  choice: A sụgharịrị ya “nyere,” na-edobe okwu inye nke ederede ahụ.
  alternative: “nyere ikike” ma ọ bụ “mere ka”
  rationale: Ederede ahụ kwuru na Nna nyere Ọkpara ka o nwee ndụ n’ime onwe ya. Ịgbakwunye “ikike” ma ọ bụ ịgbanwe ya ka ọ bụrụ “mere ka” nwere ike idozi esemokwu nkà mmụta okpukpe nke Grik n’onwe ya hapụrụ ka ọ dị.
translation_notes:
  register: Standard Igbo dị ugbu a, dị nsọpụrụ ma dị mfe nghọta. E debere myirịta nke Nna na Ọkpara, ma jiri “nyere” mee ka okwu Grik nkịtị pụta ìhè. Akara nkọwa ala ala [a] na [b] abụọ dị n’ahịrịokwu bụ isi.
