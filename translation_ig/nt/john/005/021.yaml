id: JHN.5.21
reference: John 5:21
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὥσπερ γὰρ ὁ πατὴρ ἐγείρει τοὺς νεκροὺς καὶ ζῳοποιεῖ, οὕτως καὶ ὁ υἱὸς οὓς θέλει ζῳοποιεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/021.yaml
  text: For just as the Father raises the dead and gives life[b][a], so also the Son gives life to whom he wishes.
translation:
  language: ig
  text: N’ihi na, dị nnọọ ka Nna si akpọlite ndị nwụrụ anwụ ma na-eme ka ha dị ndụ[a], otu ahụkwa ka Ọkpara na-eme ka ndị ọ chọrọ[b] dị ndụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “na-enye ha ndụ” n’ebe a, na “na-enye … ndụ” n’ebe e kwuru ya nke ugboro abụọ.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ndị ọ masịrị ya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥσπερ γὰρ
  choice: N’ihi na, dị nnọọ ka
  rationale: “N’ihi na” na-egosipụta ọrụ nkọwa nke γάρ, ebe “dị nnọọ ka” na-amalite ntụnyere nke ὥσπερ n’ụzọ doro anya ma bụrụ Igbo e ji eme ihe ugbu a.
- source_word: ὁ πατὴρ
  choice: Nna
  rationale: N’ọnọdụ a, ọ bụ aha nsọ e ji akọwa Chineke dịka Nna; mkpụrụedemede ukwu na-egosipụta nke ahụ.
- source_word: ἐγείρει
  choice: na-akpọlite
  rationale: “Ịkpọlite” bụ okwu Igbo kwesịrị ekwesị maka ime ka ndị nwụrụ anwụ bilie, ma na-echekwa echiche mbilite n’ọnwụ dị n’ọnọdụ a.
- source_word: τοὺς νεκρούς
  choice: ndị nwụrụ anwụ
  rationale: Nke a bụ ụzọ Igbo dị mfe ma doo anya isi kwuo aha nchịkọta ahụ bụ́ “ndị nwụrụ anwụ.”
- source_word: ζῳοποιεῖ
  choice: na-eme ka ha dị ndụ / na-eme ka … dị ndụ
  rationale: Nke a na-egosipụta ime ka onye dị ndụ, ma na-echekwa otu ngwaa ahụ n’akụkụ abụọ nke ntụnyere ahụ. “Ha” n’ebe mbụ na-ezo aka n’ụzọ doro anya nye ndị nwụrụ anwụ.
- source_word: οὕτως καὶ
  choice: otu ahụkwa ka
  rationale: Ọ na-aga n’ihu na ntụnyere kwekọrọ ekwekọ ma na-emesi myirịta dị n’omume Nna na nke Ọkpara ike.
- source_word: ὁ υἱὸς
  choice: Ọkpara
  rationale: “Ọkpara” na-arụ ọrụ dịka aha nsọ Kraịst n’ebe a ma kwekọọ na njikọ Nna–Ọkpara dị n’okwu ahụ.
- source_word: οὓς θέλει
  choice: ndị ọ chọrọ
  rationale: Nke a bụ Igbo nkịtị na nke dị ùgwù nke na-egosipụta nhọrọ na ọchịchọ Ọkpara, n’etinyeghị nkọwa okpukpe ọzọ n’ime ya.
theological_decisions:
- issue: Myirịta dị n’etiti Nna na Ọkpara n’inye ndụ
  choice: E chekwara usoro ntụnyere ahụ nke na-ekwu na, dịka Nna si eme ka ndị nwụrụ anwụ dị ndụ, otu ahụkwa ka Ọkpara si eme ka ndị ọ chọrọ dị ndụ.
  alternative: Ịsụgharị ya n’ụzọ dị nro nke ga-ebelata ike myirịta ahụ.
  rationale: Asụsụ Grik na-etinye omume Nna na nke Ọkpara n’akụkụ ibe ha n’ụzọ doro anya. Nsụgharị ahụ na-echekwa nkwupụta Kraịst a n’agbakwụnyeghị nkọwa banyere ọdịdị ha.
- issue: Ihe θέλει pụtara banyere ọchịchọ Ọkpara
  choice: ndị ọ chọrọ
  alternative: ndị ọ masịrị ya
  rationale: “Ndị ọ chọrọ” na-egosipụta ezi ọchịchọ na nhọrọ n’asụsụ Igbo nke oge a, ebe “ndị ọ masịrị ya” nwekwara ike igosi echiche nke ihe na-atọ ya ụtọ. E debere nke abụọ dịka ụzọ ọzọ a pụrụ isi ghọta okwu ahụ.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị mfe ma dị ùgwù. Ahịrịokwu ahụ na-echekwa nhazi ntụnyere nke Grik na nkwughachi nke ζῳοποιεῖ, ma zere okwu ochie ma ọ bụ okwu nke otu ụka pụrụ iche.
