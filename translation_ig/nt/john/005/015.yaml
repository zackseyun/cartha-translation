id: JHN.5.15
reference: John 5:15
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀπῆλθεν ὁ ἄνθρωπος καὶ ⸀ἀνήγγειλεν τοῖς Ἰουδαίοις ὅτι Ἰησοῦς ἐστιν ὁ ποιήσας αὐτὸν ὑγιῆ.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/015.yaml
  text: The man went away and reported to the Jews that Jesus was the one who had made him well[a].
translation:
  language: ig
  text: Nwoke ahụ wee pụọ gaa kọọrọ ndị Juu na ọ bụ Jizọs mere ka ahụ nwoke ahụ dị mma[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị isi Juu,” ma ọ bụ, “ndị Judia,” dabere n’otú e si aghọta ojiji Jọn ji okwu ahụ bụ “ndị Juu” n’ebe a.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπῆλθεν
  choice: wee pụọ
  rationale: Aorist a na-egosi na nwoke ahụ hapụrụ ebe ahụ; “wee pụọ” bụ okwu Igbo doro anya ma kwekọọ n’usoro akụkọ.
- source_word: ὁ ἄνθρωπος
  choice: Nwoke ahụ
  rationale: N’ebe a, aha ahụ na-arụtụ aka n’otu nwoke ahụ e mere ka ahụ dị ya mma; “nwoke ahụ” na-eme ka njikọ akụkọ ahụ doo anya.
- source_word: ἀνήγγειλεν
  choice: gaa kọọrọ
  rationale: ἀναγγέλλω pụtara ime ka mmadụ mara ma ọ bụ ịkọrọ ya ihe. “Gaa kọọrọ” dabara n’ọnọdụ a n’enweghị ime ka ọ dị ka nkwusa n’ihu ọha.
- source_word: τοῖς Ἰουδαίοις
  choice: ndị Juu
  rationale: Isi ederede na-edobe okwu Grik n’enweghị ikewapụ ya ozugbo dịka ndị isi Juu ma ọ bụ ndị Judia; a na-edebe nghọta ndị ahụ n’okpuru peeji.
- source_word: ὅτι
  choice: na
  rationale: “Na” bụ njikọ Igbo nkịtị nke na-ebute ihe nwoke ahụ kọọrọ ha.
- source_word: Ἰησοῦς
  choice: Jizọs
  rationale: Nke a bụ ụdị aha a na-ejikarị ede Jesus n’Igbo ugbu a.
- source_word: ἐστιν
  choice: ọ bụ
  rationale: “Ọ bụ” na-edobe present Greek n'ụzọ dị mma n’Igbo, ebe ọ na-akọwapụta onye mere ihe ahụ.
- source_word: ὁ ποιήσας
  choice: mere ka
  rationale: Articular aorist participle na-akọwa Jizọs dịka onye rụrụ ihe ahụ tupu nwoke ahụ akọọrọ ha; “mere ka” na-edobe usoro ποιέω na adjective so ya.
- source_word: αὐτὸν ὑγιῆ
  choice: ahụ dị ya mma
  rationale: Akpaalaokwu Igbo “ime ka ahụ dị mmadụ mma” na-egosi na mmadụ enwetaghachila ahụ ike, ma ọ naghị etinye echiche sara mbara nke okwu Grik ahụ ekwughị kpọmkwem.
theological_decisions:
- issue: Onye okwu “ndị Juu” na-arụtụ aka na ya n’Oziọma Jọn
  choice: E debere “ndị Juu” n’isi ederede, tinyekwa nkọwa banyere “ndị isi Juu” ma ọ bụ “ndị Judia” n’okpuru peeji.
  alternative: Ịsụgharị ya ozugbo dịka “ndị isi Juu” ma ọ bụ “ndị Judia.”
  rationale: τοῖς Ἰουδαίοις n’onwe ya pụtara “ndị Juu,” ma n’ọnọdụ ụfọdụ n’akwụkwọ Jọn ọ pụrụ ịpụta ndị ọchịchị okpukpe Juu ma ọ bụ ndị Judia. Idebe okwu sara mbara n’isi ederede na-echekwa ihe ederede kwuru n’enweghị idozi mgbagwoju anya ahụ n’ụzọ otu akụkụ.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị ugbu a ma dị ùgwù. E jiri usoro akụkọ “wee pụọ gaa kọọrọ” mee ka amaokwu ahụ na-aga were were; e zere okwu chọọchị pụrụ iche na nkọwa ga-amachibido ihe τοῖς Ἰουδαίοις nwere ike ịpụta.
