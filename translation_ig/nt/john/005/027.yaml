revisions:
- from: O nyekwaara ya ikike ime ikpe[a], n’ihi na ọ bụ Nwa nke Mmadụ.
  to: O nyekwara ya ikike ikpe ikpe[a], n’ihi na ọ bụ Nwa nke Mmadụ.
  rationale: The revision improves Standard Igbo idiom for the judicial action and normalizes the verb form. It retains “Nwa nke Mmadụ” as the likely Johannine title while the footnote preserves the grammatically possible generic-human sense without doctrinal expansion.
  reviewer_model: gpt-5.6-terra
