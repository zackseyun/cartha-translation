id: JHN.5.27
reference: John 5:27
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἐξουσίαν ἔδωκεν ⸀αὐτῷ κρίσιν ποιεῖν, ὅτι υἱὸς ἀνθρώπου ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/027.yaml
  text: And he gave him authority to execute judgment[a], because he is the Son of Man.
translation:
  language: ig
  text: O nyekwara ya ikike ikpe ikpe[a], n’ihi na ọ bụ Nwa nke Mmadụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’ihi na ọ bụ nwa mmadụ,” ya bụ, n’ihi na ọ bụ mmadụ. Ihe e dere n’elu na-edobe nghọta a na-ahụkarị n’Oziọma Jọn na okwu a bụ aha pụrụ iche.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐξουσίαν
  choice: ikike
  rationale: “Ikike” na-egosi ikike e nyere mmadụ na ikike o nwere ime ihe n'ụzọ ziri ezi, ọ bụghị naanị ume ma ọ bụ ike nkịtị; nke a dabara n'ikike ikpe Nna nyere Ọkpara.
- source_word: ἔδωκεν
  choice: nyere
  rationale: Nke a na-asụgharị δίδωμι n'ụzọ kwụ ọtọ ma dịkwa mma n'Igbo.
- source_word: αὐτῷ
  choice: ya
  rationale: Nnọchiaha a na-ezo aka n'Ọkpara dịka onye natara ikike ahụ.
- source_word: κρίσιν ποιεῖν
  choice: ime ikpe
  rationale: Nkebiokwu a pụtara ịrụ ma ọ bụ imezu ọrụ ikpe; “ime ikpe” bụ okwu Igbo doro anya nke na-edobe echiche ikpe ikpe ziri ezi.
- source_word: ὅτι
  choice: n’ihi na
  rationale: N'ebe a, ὅτι na-enye ihe kpatara e ji nye ya ikike ahụ.
- source_word: υἱὸς ἀνθρώπου
  choice: Nwa nke Mmadụ
  rationale: N'okwu Jọn, nke a bụ aha a maara nke Jizọs ji akọwa onwe ya, nke nwekwara njikọ na Daniel 7. E ji mkpụrụedemede ukwu gosi na ọ bụ aha pụrụ iche, ma nkọwa ọzọ nke nwere ike ịbụ mmadụ nkịtị ka e debere n'okpuru peeji.
- source_word: ἐστίν
  choice: ọ bụ
  rationale: Nke a bụ ntụgharị Igbo dị mfe ma kwekọọ na ngwaa njikọ dị n'asụsụ Grik.
theological_decisions:
- issue: Ma υἱὸς ἀνθρώπου ọ bụ aha Kraịst pụrụ iche, ka ọ bụ naanị okwu na-egosi na ọ bụ mmadụ
  choice: A sụgharịrị ya dịka aha pụrụ iche, “Nwa nke Mmadụ.”
  alternative: “otu nwa mmadụ,” ya bụ, n’ihi na o nwere ọdịdị mmadụ
  rationale: N’Oziọma Jọn, okwu a na-arụkarị ọrụ dịka aha Jizọs, ma nwee ụda nke Daniel 7 na ikike ikpe. Otú ọ dị, ebe asụsụ Grik enweghị mkpụrụokwu na-akọwapụta aha ahụ n'ebe a, a hapụrụ nkọwa nke mmadụ nkịtị n'okpuru peeji iji chekwaa nghọta abụọ ahụ.
translation_notes:
  register: Asụsụ Igbo Izugbe dị ugbu a, dị ùgwù ma dị mfe nghọta. A họọrọ “ime ikpe” kama okwu mgbagwoju anya karịa, ma debe “Nwa nke Mmadụ” dịka aha Jizọs a maara nke ọma.
