  text: ἐγὼ ἐλήλυθα ἐν τῷ ὀνόματι τοῦ πατρός μου καὶ οὐ λαμβάνετέ με· ἐὰν ἄλλος ἔλθῃ ἐν τῷ ὀνόματι τῷ ἰδίῳ, ἐκεῖνον λήμψεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/043.yaml
  text: I have come in my Father's name[a], and you do not receive me. If another comes in his own name[b], you will receive him.
translation:
  language: ig
  text: Abịala m n’aha Nna m[a], ma unu anaghị anabata m. Ọ bụrụ na onye ọzọ abịa n’aha nke onwe ya[b], unu ga-anabata ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “site n’ikike Nna m.” Akpaala okwu Grik ahụ, “n’aha,” nwekwara ike ịpụta ịnọchite anya mmadụ ma ọ bụ iji ikike ya mee ihe.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “site n’ikike nke onwe ya.” Okwu ahụ, “n’aha nke onwe ya,” dị nnọọ iche na ọbịbịa Jizọs “n’aha Nna m.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλήλυθα
  choice: Abịawo m
  rationale: Oge perfect nke ngwaa ahụ na-egosi ọbịbịa mere eme nke nsonaazụ ya ka dị ugbu a; “Abịawo m” na-egosipụta nke a n’Igbo nkịtị.
- source_word: ἐν τῷ ὀνόματι τοῦ πατρός μου
  choice: n’aha Nna m
  rationale: Nke a na-echekwa akpaala okwu Grik na ihe ọ pụrụ ịpụta banyere ịnọchite anya na ikike, n’etinyeghị nkọwa dị warara n’ahịrịokwu bụ isi.
- source_word: λαμβάνετέ με
  choice: unu anabataghị m
  rationale: N’ebe a, λαμβάνω pụtara ịnabata Jizọs ma ọ bụ ikwere na ya, ọ bụghị ijide ya n’ahụ; “anabata” na-echekwa obosara echiche ahụ.
- source_word: ἄλλος
  choice: onye ọzọ
  rationale: Nsụgharị a bụ nke kwụ ọtọ, na-echekwa ntụnyere dị n’etiti Jizọs na onye ọzọ n’etinyeghị onye a kapịrị ọnụ.
- source_word: ἐν τῷ ὀνόματι τῷ ἰδίῳ
  choice: n’aha nke aka ya
  rationale: Nke a na-echekwa nhazi yiri ibe ya na “n’aha Nna m,” ma hapụ echiche nke onye ji aka ya nye onwe ya ikike ka ọ ghara ịghọ nkọwa etinyere n’ahịrịokwu.
- source_word: ἐκεῖνον λήμψεσθε
  choice: unu ga-anabata ya
  rationale: Ikwughachi “anabata” na-echekwa ọdịiche okwu ahụ ji arụ ọrụ n’etiti etu ha si emeso Jizọs na etu ha ga-esi emeso onye ọzọ.
- source_word: πατρός μου
  choice: Nna m
  rationale: N’ọnọdụ okwu Jọn a, ọ na-ezo aka na Chineke bụ Nna Jizọs; mkpụrụedemede ukwu na-enyere onye na-agụ aka ịmata onye a na-ekwu banyere ya n’etinyeghị okwu ọzọ.
theological_decisions:
- issue: Ma a ga-akọwa kpọmkwem na “Nna m” bụ Chineke bụ Nna
  choice: E dere “Nna” na mkpụrụedemede ukwu, ma etinyeghị “Chineke” n’ahịrịokwu.
  alternative: Ide “nna” na mkpụrụedemede nta ma ọ bụ ịsị “Chineke Nna m.”
  rationale: Ọnọdụ okwu ahụ na Jọn na-eme ka onye a na-ezo aka na ya doo anya. Mkpụrụedemede ukwu na-egosi nke ahụ n’agbakwụnyeghị ihe na-adịghị na Grik.
- issue: Ma a ga-asụgharị “n’aha” ozugbo dịka okwu banyere ikike
  choice: E debere “n’aha” n’akụkụ abụọ nke amaokwu ahụ.
  alternative: “site n’ikike Nna m” na “site n’ikike nke aka ya.”
  rationale: Akpaala okwu Grik ahụ pụrụ igosi aha, nnọchite anya, na ikike. Ide “n’aha” na-echekwa obosara echiche na ntụnyere siri ike dị n’etiti akụkụ abụọ ahụ.
translation_notes:
  register: Standard Igbo dị ugbu a, nke kwesịrị ekwesị ma dị mfe nghọta. E ji “unu” mee ka onye nke abụọ plural dị na Grik pụta ìhè. E debere usoro yiri ibe ya na nkwughachi “anabata” iji chekwaa ike okwu amaokwu ahụ.
