  rationale: The revision corrects the main source-fidelity issue by rendering the Greek present-tense refusal with Igbo habitual present (‘anaghị anabata’). It also adopts idiomatic Standard Igbo for the perfect (‘Abịala m’) and for self-reference (‘nke onwe ya’), without narrowing the meaning of the Greek name idiom or adding doctrinal interpretation.
