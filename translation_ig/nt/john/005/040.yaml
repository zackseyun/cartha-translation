  source_fidelity: “Ma unu achọghị ịbịakwute m ka unu wee nwee ndụ” faithfully represents the Greek. “Ma” appropriately conveys the contextual adversative force of καὶ; “unu achọghị” retains the volitional sense of οὐ θέλετε without intensifying it; “ịbịakwute m” preserves the concrete Johannine expression ἐλθεῖν πρός με; and “ka unu wee nwee ndụ” naturally expresses the ἵνα purpose clause. No unwarranted addition of “eternal” occurs in the main text.
