  yaml_path: translation/nt/john/005/040.yaml
  text: Yet you are not willing to come to me so that you may have life[a][b].
translation:
  language: ig
  text: Ma unu achọghị ịbịakwute m ka unu wee nwee ndụ[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, ‘Unu achọghị ịbịakwute m ka unu wee nwee ndụ.’ Okwu njikọ Grik a pụkwara ịpụta nanị ‘na,’ ebe θέλετε pụtara ‘ịchọ’ ma ọ bụ ‘ịdị njikere.’
    reason: lexical_alternative
  - marker: b
    text: N’Oziọma Jọn, ‘ndụ’ na-enwekarị nghọta sara mbara nke ndụ sitere n’aka Chineke, ya bụ, ndụ ebighị ebi, ọ bụ ezie na e kwughị okwu ‘ebighị ebi’ n’ebe a.
    reason: cross_reference
lexical_decisions:
- source_word: καὶ
  choice: Ma
  rationale: Ọ bụ ezie na καί na-apụtakarị ‘na,’ ebe a ọ na-egosi ọdịiche dị n’etiti ihe Jizọs kwuru tupu nke a na enweghị ọchịchọ nke ndị na-ege ya ntị. ‘Ma’ na-egosipụta ọdịiche ahụ n’Igbo nkịtị.
- source_word: οὐ θέλετε
  choice: unu achọghị
  rationale: θέλω nwere ike ịpụta ịchọ, inwe ọchịchọ, ma ọ bụ ịdị njikere. ‘Unu achọghị’ bụ okwu Igbo doro anya nke na-echekwa echiche nke ọchịchọ mmadụ, n’emeghị ka ọ sie ike dịka ‘unu jụrụ kpamkpam.’
- source_word: ἐλθεῖν πρός με
  choice: ịbịakwute m
  rationale: Okwu a pụtara ịbịakwute mmadụ. A hapụrụ ihe oyiyi ahụ dịka ọ dị n’asụsụ Grik kama ịkọwa ya ozugbo dịka ‘ikwere na m.’
- source_word: ἵνα
  choice: ka ... wee
  rationale: Usoro ‘ka ... wee’ na-egosi nzube n’Igbo eke ma na-anọchite anya ọrụ ἵνα nke ọma.
- source_word: ζωὴν
  choice: ndụ
  rationale: ζωή pụtara ‘ndụ.’ N’Oziọma Jọn, ọ na-enwekarị nghọta sara mbara nke ndụ sitere n’aka Chineke, ma okwu ahụ etinyeghị ‘ebighị ebi’ n’amaokwu a.
- source_word: ἔχητε
  choice: unu nwee
  rationale: Ụdị a na-esochi ‘ka ... wee’ na-egosipụta nzube nke ἔχητε n’Igbo nke ọma, n’etinyeghị echiche nke ejighị n’aka nke okwu Grik na-ekwughị.
theological_decisions:
- issue: Ma a ga-asụgharị ζωὴν dịka ‘ndụ’ ka ọ bụ ‘ndụ ebighị ebi’
  choice: ndụ
  alternative: ndụ ebighị ebi
  rationale: Jọn na-ejikarị ζωή ekwu maka ndụ nzọpụta sitere n’aka Chineke, ma αἰώνιος (‘ebighị ebi’) adịghị n’amaokwu a. Ya mere, isi ederede anaghị agbakwunye okwu na-adịghị n’asụsụ mmalite.
- issue: Ma a ga-akọwa ‘ịbịakwute m’ n’isi ederede dịka ‘ikwere na m’
  choice: ịbịakwute m
  alternative: ikwere na m
  rationale: N’Oziọma Jọn, ịbịakwute Jizọs nwere njikọ chiri anya na ikwere na ya, ma ederede Grik ji ngwaa pụtara ‘ịbịa.’ Idebe ya na-echekwa ihe oyiyi Jọn ma ghara ime ka nkọwa dochie okwu ederede.
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, dị mfe ma nwee ugwu. ‘Ịbịakwute m’ bụ okwu eke nke na-echekwa ihe oyiyi dị n’asụsụ Grik; ‘ka unu wee nwee’ na-egosi nzube nke ọma. Akara nkọwa ala ala [a] na [b] pụtara n’isi ederede.
