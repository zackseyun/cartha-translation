id: JHN.5.4
reference: John 5:4
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: robinson-pierpont-2005-byzantine
  text: Ἄγγελος γὰρ κατὰ καιρὸν κατέβαινεν ἐν τῇ κολυμβήθρᾳ, καὶ ἐτάρασσεν τὸ ὕδωρ· ὁ οὖν πρῶτος ἐμβὰς μετὰ τὴν ταραχὴν τοῦ ὕδατος, ὑγιὴς ἐγίνετο, ᾧ δήποτε κατείχετο νοσήματι.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/john/005/004.yaml
  text: For an angel would go down into the pool from time to time and stir up the water. Therefore, the first one to step in after the stirring of the water would become well from whatever disease afflicted him.
translation:
  language: ig
  text: N’ihi na, n’oge ụfọdụ, mmụọ ozi na-agbadakarị n’ọdọ mmiri ahụ ma na-akpali mmiri ahụ. Ya mere, onye mbụ batara n’ime ya mgbe a kpalịchara mmiri ahụ na-adịkarị mma n’ọrịa ọ bụla jidere ya.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Amaokwu a (tinyere ọkara ikpeazụ nke amaokwu nke 3) adịghị n’ime papịrọs Grik ndị kacha ochie, dị ka Papịrọs 66 na Papịrọs 75 nke narị afọ nke atọ, nakwa n’ime akwụkwọ odide ukwu abụọ bụ isi nke narị afọ nke anọ, Saịnaịtịkụs na Vatikanọs. Ọ dị n’ọtụtụ ihe odide nke ọdịnala Baịzantịn, nakwa ná nsụgharị Latin na Siriak oge mbụ. Ọtụtụ ndị ọkà mmụta na-ewere ya dị ka ihe odeakwụkwọ gbakwụnyere n’oge mbụ iji kọwaa ihe mere ndị nwere nkwarụ ji ezukọ n’ọdọ mmiri ahụ.
    reason: textual_critical
  - marker: b
    text: Ma ọ bụ, “na-aghọ onye ahụ ike.”
    reason: previous_rendering
lexical_decisions:
- source_word: καταβαίνω (κατέβαινεν)
  choice: na-agbadaba
  rationale: Ụdị imperfect na-egosi omume a na-eme ugboro ugboro n’oge gara aga; ya na ‘site n’oge ruo n’oge’ na-egosipụta omume a na-emebu n’ụzọ doro anya n’Igbo.
- source_word: κατὰ καιρόν
  choice: site n’oge ruo n’oge
  rationale: Nkebiokwu a na-egosi ihe na-eme mgbe ụfọdụ ma ọ bụ ugboro ugboro, ọ bụghị oge a kara kpọmkwem.
- source_word: ταράσσω (ἐτάρασσεν)
  choice: na-akpali
  rationale: N’ọnọdụ mmiri, ‘ịkpali mmiri’ bụ okwu Igbo dị mma nke na-egosi ime ka mmiri maa jijiji ma ọ bụ megharia.
- source_word: ὑγιὴς ἐγίνετο
  choice: na-agbake
  rationale: Imperfect na-egosi ihe na-emekarị onye ọ bụla bụ onye mbụ banyere; ‘na-agbake’ na-enye echiche nke ịghọ onye ahụ siri ike ọzọ.
- source_word: κατέχω (κατείχετο νοσήματι)
  choice: ọrịa ... jidere ya
  rationale: Nke a na-edobe ihe oyiyi okwu Grik nke ọrịa ‘jidere’ mmadụ, ma ọ bụkwa ụzọ Igbo a na-aghọta nke ọma isi kwuo na ọrịa na-arịa mmadụ.
theological_decisions:
- issue: Ọnọdụ amaokwu a n’ihe odide Grik
  choice: E tinyere amaokwu ahụ n’ederede n’ihi na isi mmalite a họpụtara bụ Robinson–Pierpont Byzantine 2005, ma tinye nkọwa banyere ọdịiche ihe odide na ndetu [a].
  alternative: Ịhapụ amaokwu ahụ n’ederede ma ọ bụ itinye ya naanị na ndetu.
  rationale: Ịsụgharị isi mmalite a nyere chọrọ ka e debe amaokwu ahụ, ma eziokwu banyere ihe àmà nke ihe odide oge mbụ kwesịkwara ịpụta ìhè n’enweghị ikpebi esemokwu ahụ n’ezoghị ọnụ.
translation_notes:
  register: Ejiri Igbo ọkọlọtọ nke oge a, nke dị ùgwù ma dị mfe nghọta. A họọrọ ‘ọdọ mmiri’ maka κολυμβήθρα, ‘mmụọ ozi’ maka ἄγγελος, ma jiri ụdị ngwaa ‘na-’ tinyere nkọwa oge gosipụta omume ndị a na-emebu n’oge gara aga.
