  yaml_path: translation/nt/john/005/017.yaml
  text: But he answered them[a], “My Father is working until now, and I also am working.”
translation:
  language: ig
  text: Ma ọ zara ha, sị, “Nna m na-arụ ọrụ ruo ugbu a, mụ kwa na-arụ ọrụ.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: Ma
  rationale: Ọ na-egosi obere ọdịiche na nzaghachi Jizọs nye ihe ndị bu ụzọ mee; “Ma” bụ ụzọ Igbo si kwuo ya nke ọma.
- source_word: ἀπεκρίνατο αὐτοῖς
  choice: ọ zara ha, sị
  rationale: Nke a bụ okwu Igbo nkịtị na nke doro anya maka ngwaa nzaghachi ahụ na ndị a na-aza; “sị” na-ebute okwu e kwuru kpọmkwem n'ụzọ ebumpụta ụwa.
- source_word: Ὁ πατήρ μου
  choice: Nna m
  rationale: Ọ na-echekwa mmekọrịta onwe onye na ịdị arọ nke aha Jizọs kpọrọ Chineke, n’enweghị ịgbakwụnye nkọwa na-adịghị n’amaokwu ahụ.
- source_word: ἕως ἄρτι
  choice: ruo ugbu a
  rationale: Ọ na-egosi na ọrụ ahụ gara n’ihu ruo n’oge a, dị ka okwu Grik si dị.
- source_word: ἐργάζεται
  choice: ka na-arụ ọrụ
  rationale: “Ka na-” na-egosipụta omume na-aga n’ihu nke present tense ahụ na nkọwa nke ἕως ἄρτι.
- source_word: κἀγὼ
  choice: mụ onwe m kwa
  rationale: Ọ na-echekwa nkwusi ike dị na κἀγώ na itinye Jizọs n’akụkụ ọrụ Nna ya.
- source_word: ἐργάζομαι
  choice: na-arụkwa ọrụ
  rationale: Ọ na-echekwa myirịta ya na ọrụ Nna ahụ ma gosipụta omume na-aga n’ihu; “kwa” na-egosipụta ihe mgbakwunye dị na κἀγώ.
theological_decisions:
- issue: Mmekọrịta dị n’etiti ọrụ Jizọs na ọrụ Nna ya n’ụbọchị izu ike
  choice: 'E debere nkwupụta abụọ ahụ n’otu ahịrị: “Nna m ka na-arụ ọrụ ... mụ onwe m kwa na-arụkwa ọrụ.”'
  alternative: Ịkọwa ya dị ka naanị ọrụ a na-eme mgbe niile, ma ọ bụ ịgbakwụnye nkọwa banyere ụbọchị izu ike, ikike Chineke, ma ọ bụ nhata Jizọs na Chineke.
  rationale: Grik ahụ kpachaara anya mee ka ọrụ Nna na nke Jizọs bụrụ ihe yiri ibe ha. Nsụgharị ahụ na-echekwa ike na esemokwu nkà mmụta okpukpe ahụ n’enweghị idozi ya site na nkọwa agbakwunyere.
translation_notes:
  register: Standard Igbo; asụsụ dị ugbu a, dị ùgwù, ma dị mfe nghọta. E ji “ka na-arụ ọrụ” gosipụta omume na-aga n’ihu; ọdịiche nke simple na progressive dị n’English adịghị achọ ihe odide ala peeji n’Igbo ebe a.
