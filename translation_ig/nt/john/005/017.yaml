- from: Ma ọ zara ha, sị, “Nna m ka na-arụ ọrụ ruo ugbu a, mụ onwe m kwa na-arụkwa ọrụ.”
  to: Ma ọ zara ha, sị, “Nna m na-arụ ọrụ ruo ugbu a, mụ kwa na-arụ ọrụ.”
  rationale: The revision retains the Greek contrastive response, the ongoing activity expressed by the present verbs in conjunction with “ruo ugbu a,” and the deliberate Father–Jesus parallel. It removes added reflexive emphasis and avoids repeating the one additive nuance encoded by κἀγώ.
