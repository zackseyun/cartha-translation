  text: ὁ δὲ ἰαθεὶς οὐκ ᾔδει τίς ἐστιν, ὁ γὰρ Ἰησοῦς ἐξένευσεν ὄχλου ὄντος ἐν τῷ τόπῳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/013.yaml
  text: But the man who had been healed did not know who he was[a], for Jesus had withdrawn, since there was a crowd in the place.
translation:
  language: ig
  text: Ma nwoke ahụ a gwọrọ amaghị onye ọ bụ, n’ihi na Jizọs apụọla n’ebe ahụ nwayọ, ebe ọ bụ na ìgwè mmadụ nọ n’ebe ahụ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “Jizọs wepụwo onwe ya” ma ọ bụ “Jizọs amịpụwo n’ebe ahụ.” Ngwaa Grik ahụ na-egosi na Jizọs si n’ebe ahụ pụọ nwayọ, n’enweghị mmasị pụrụ iche.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰαθεὶς
  choice: nwoke ahụ a gwọrọ
  rationale: Partisịpụ a dị n’ụdị nnara ma na-arụ ọrụ dị ka aha; ntụgharị a na-echekwa echiche na ọ bụ onye e mere ka ahụ dị ya mma, ma jiri ‘nwoke’ mee ka Igbo daa nke ọma.
- source_word: οὐκ ᾔδει
  choice: amaghị
  rationale: Nke a bụ ụzọ Igbo nkịtị na nke doro anya si ekwu na onye ahụ enweghị ihe ọmụma banyere onye ahụ.
- source_word: τίς ἐστιν
  choice: onye ọ bụ
  rationale: Ọ na-ezo aka n’ịmata Jizọs n’onwe ya, ma na-echekwa usoro ajụjụ dị n’okwu a kọrọ n’ụzọ na-apụtaghị kpọmkwem.
- source_word: ἐξένευσεν
  choice: esiwo n’ebe ahụ pụọ n’amaghị ama
  rationale: Ngwaa ahụ na-egosi na Jizọs hapụrụ ebe ahụ n’ụzọ ndị mmadụ na-ahụghị ma ọ bụ na-elebaghị anya; ‘esiwo’ na-egosikwa na ọpụpụ ahụ eburula amaghị onye ọ bụ ụzọ.
- source_word: ὄχλου ὄντος
  choice: ebe ọ bụ na ìgwè mmadụ nọ
  rationale: Nke a na-enye genitive absolute ahụ ike nke ihe kpatara ya, ma ka na-ekwe ka a ghọta ya dị ka ọnọdụ so ya.
- source_word: ἐν τῷ τόπῳ
  choice: n’ebe ahụ
  rationale: Ọ bụ ntụgharị locative doro anya ma bụrụkwa Igbo e ji eme ihe kwa ụbọchị karịa ntụgharị siri ike dịka ‘n’ime ebe ahụ.’
