translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-echekwa njikọ ihe kpatara ya n’ihi ìgwè mmadụ ahụ, ma ihe odide ala ala peeji na-echekwa obosara ihe ἐξένευσεν pụrụ ịpụta.
