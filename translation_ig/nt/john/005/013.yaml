  to: Ma nwoke ahụ a gwọrọ amaghị onye ọ bụ, n’ihi na Jizọs apụọla n’ebe ahụ nwayọ, ebe ọ bụ na ìgwè mmadụ nọ n’ebe ahụ.[a]
  rationale: E dochiela «n’amaghị ama» anya na «nwayọ» iji mee ka ἐξένευσεν doo anya dịka ịpụ nwayọ/ịwezuga onwe ya, n’enweghị ịgbakwunye echiche na Jizọs amaghị ihe ọ na-eme ma ọ bụ na ọ pụtara na mberede. E meziekwara ihe odide ala peeji ka ọ ghara ikwu ihe karịrị ihe Grik ahụ kwuru.
