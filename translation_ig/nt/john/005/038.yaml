source:
  edition: SBLGNT
  text: καὶ τὸν λόγον αὐτοῦ οὐκ ἔχετε ⸂ἐν ὑμῖν μένοντα⸃, ὅτι ὃν ἀπέστειλεν ἐκεῖνος τούτῳ ὑμεῖς οὐ πιστεύετε.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/038.yaml
  text: And you do not have his word abiding in you[a], because you do not believe the one whom he sent.
translation:
  language: ig
  text: Unu enweghịkwa okwu ya nke na-anọgide n’ime unu[a], n’ihi na unu ekweghị onye ahụ o zitere.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “nke bi n’ime unu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λόγον
  choice: okwu
  rationale: “Okwu” bụ ntụgharị kwụ ọtọ ma dịkwa eke maka λόγος; ọ na-egosi okwu Chineke kpughere ma na-echekwa ụda okwu Jọn.
- source_word: ἔχετε ... ἐν ὑμῖν μένοντα
  choice: adịghịkwa anọgide n’ime unu
  rationale: Nhazi a na-egosi na okwu Chineke anaghị enwe ọnụnọ na-aga n’ihu n’ime ha, ma ọ naghị eme ka Igbo sie ike site n’ịsụgharị ἔχετε n’ụzọ mkpụrụokwu n’otu n’otu.
- source_word: ὅτι
  choice: n’ihi na
  rationale: N’ebe a, ὅτι na-ewebata ihe kpatara okwu ya anaghị anọgide n’ime ha.
- source_word: ὃν ἀπέστειλεν ἐκεῖνος
  choice: onye ahụ o zitere
  rationale: Nke a na-asụ Igbo nke ọma ma na-echekwa echiche nke onye ahụ Nna zitere, n’agbanyeghị na aha Nna na Jizọs apụtaghị kpọmkwem n’ahịrịokwu Grik.
- source_word: τούτῳ ... οὐ πιστεύετε
  choice: unu ekweghị na onye ahụ
  rationale: “Ikwere na onye” bụ ụzọ Igbo doro anya isi gosipụta πιστεύω banyere mmadụ, ma na-echekwa ma nkwenye ma ntụkwasị obi dị n’okwu ahụ.
theological_decisions:
- issue: Mmekọrịta dị n’etiti okwu Chineke ịnọgide n’ime ha na ekweghị ha n’onye Chineke zitere
  choice: E debere ekweghị ha n’onye ahụ Chineke zitere dịka ihe kpatara okwu Chineke anaghị anọgide n’ime ha.
  alternative: A pụrụ ịghọta ya karịsịa dịka enweghị idebe ma ọ bụ irube isi n’Akwụkwọ Nsọ n’obi.
  rationale: Nsụgharị ahụ na-echekwa usoro ihe kpatara ihe nke Grik, n’etinyeghị ozizi pụrụ iche banyere ọmụmụ ọzọ, mmụọ ibi n’ime mmadụ, ma ọ bụ ịnọgide n’okwukwe.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. “Na-anọgide” na-echekwa ike na-aga n’ihu nke μένω; “na-ebi” dị na nkọwa ala peeji dịka ụzọ ọzọ e si kwuo ya.
