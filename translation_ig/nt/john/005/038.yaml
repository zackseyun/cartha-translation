revisions:
- from: Okwu ya adịghịkwa anọgide n’ime unu[a], n’ihi na unu ekweghị na onye ahụ o zitere.
  to: Unu enweghịkwa okwu ya nke na-anọgide n’ime unu[a], n’ihi na unu ekweghị onye ahụ o zitere.
  rationale: The revision retains the explicit Greek negated possession (“you do not have”), represents καί naturally in Igbo, and preserves μένοντα as a participle modifying “Okwu.” It also renders πιστεύω with its personal dative object directly, without making a denominationally loaded distinction between belief and trust.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T06:31:31Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly identifies λόγος as “Okwu,” preserves the causal force of ὅτι with “n’ihi na,” and accurately identifies the sent one without adding names absent from the verse. However, “Okwu ya adịghịkwa anọgide n’ime unu” shifts the Greek construction from “you do not have his word remaining in you” to a direct assertion that the word itself does not remain. This is close in sense, but the Greek explicitly uses ἔχετε (“have”). “-kwa” is also not a clear equivalent for initial καί here; “Unu enweghịkwa …” more naturally carries the continuing discourse connection while retaining the possessive construction.
  naturalness: The revised wording is idiomatic, modern Standard Igbo and keeps a dignified biblical register. “Okwu ya nke na-anọgide n’ime unu” clearly expresses the participial phrase modifying “word.” “Unu ekweghị onye ahụ o zitere” naturally renders πιστεύω with a personal dative as believing the person, without requiring an added preposition.
  terminology: “Okwu” is appropriate for λόγος and preserves Johannine diction. “Na-anọgide” suitably conveys the continuing sense of μένων/μένοντα. No doctrinal conclusion beyond the verse’s causal statement is introduced. The footnote is adjusted so that it is a genuine lexical alternative to the revised main rendering.
  issues:
  - severity: medium
    issue: The main clause does not retain the explicit “have” construction.
    rationale: 'ἔχετε is present and negated in Greek: “you do not have his word remaining in you.” Recasting it as “his word does not remain” is a permissible sense-based paraphrase but is less source-transparent than necessary.'
  - severity: low
    issue: “adịghịkwa” is not the clearest rendering of καί in this discourse context.
    rationale: With the negative existential construction, “enweghịkwa” naturally expresses “and/also do not have” without suggesting an unintended temporal sense such as “no longer.”
  - severity: low
    issue: The existing footnote’s alternative is not syntactically aligned with the revised participial construction.
    rationale: A footnote alternative should offer another rendering of μένοντα while retaining its relation to “word.”
  revised_text: Unu enweghịkwa okwu ya nke na-anọgide n’ime unu[a], n’ihi na unu ekweghị onye ahụ o zitere.
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “nke bi n’ime unu.”
    reason: lexical_alternative
