  naturalness: Ahịrịokwu ahụ dị ọcha, dị mfe nghọta, ma dabara na Standard Igbo na ndekọ Akwụkwọ Nsọ. “Unu atụla nke a n’anya” bụ ụzọ Igbo a nabatara maka ịgwa ndị na-ege ntị ka ha ghara iju ihe a anya. “Olu ya” bụ ngwakọta sitere n’okike.
  terminology: A sụgharịrị μνημεῖα site na “ili,” nke dabara nke ọma n’ọnọdụ ebe a ma nwee ike ịpụta ili ma ọ bụ ebe olili. Ihe odide ala peeji ahụ na-enye nhọrọ nkọwa sara mbara n’enweghị ịgbanwe ihe amaokwu ahụ pụtara. “Oge” bụ nhọrọ kwesịrị ekwesị maka ὥρα n’usoro okwu Jọn.
