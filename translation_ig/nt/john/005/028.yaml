  variant: Standard Igbo
source:
  edition: SBLGNT
  text: μὴ θαυμάζετε τοῦτο, ὅτι ἔρχεται ὥρα ἐν ᾗ πάντες οἱ ἐν τοῖς μνημείοις ⸀ἀκούσουσιν τῆς φωνῆς αὐτοῦ
base_translation:
  language: en
  yaml_path: translation/nt/john/005/028.yaml
  text: Do not marvel at this[a], because an hour is coming in which all who are in the tombs will hear his voice
translation:
  language: ig
  text: Unu atụla nke a n’anya, n’ihi na oge na-abịa mgbe ndị niile nọ n’ili[a] ga-anụ olu ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’ebe e liri ndị nwụrụ anwụ.” Okwu Grik μνημεῖα nwere ike izo aka n’ebe olili n’ozuzu ya; a họọrọ “ili” n’ihi na ọ bụ okwu Igbo dị mfe ma na-edobe ihe oyiyi nke ebe e liri ozu.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ θαυμάζετε
  choice: Unu atụla ... n’anya
  rationale: Iwu nkwụsị a nke μή na ngwaa nọ n’oge ugbu a ka e ji asụsụ Igbo nkịtị ma dị ùgwù sụgharịa; ọ na-egosi ka ha ghara iju anya.
- source_word: τοῦτο
  choice: nke a
  rationale: Ọ bụ okwu nrụtụaka na-ezo aka n’ihe Jizọs kwuru tupu nke a.
- source_word: ὅτι
  choice: n’ihi na
  rationale: N’ebe a, ọ na-ewebata ihe kpatara iwu ahụ.
- source_word: ἔρχεται ὥρα
  choice: oge na-abịa
  rationale: Ọ bụ ezie na ὥρα nwere ike ịpụta ‘awa,’ n’ahịrịokwu a ọ pụtara oge a kara aka; ‘oge na-abịa’ bụ Igbo sitere n’okike ma na-edobe ibu okwu ahụ n’Oziọma Jọn.
- source_word: ἐν ᾗ
  choice: mgbe
  rationale: ‘Mgbe’ na-egosipụta njikọ oge ahụ nke ọma n’Igbo, kama ịgbaso usoro Grik n’ụzọ ga-ada arọ.
- source_word: πάντες οἱ ἐν τοῖς μνημείοις
  choice: ndị niile nọ n’ili
  rationale: Ọ na-edobe echiche nke mmadụ niile nọ n’ebe e liri ozu, n’etinyeghị nkọwa nkuzi ọzọ n’amaokwu ahụ.
- source_word: ἀκούσουσιν
  choice: ga-anụ
  rationale: Nke a na-egosipụta ngwaa ọdịnihu ahụ n’ụzọ kpọmkwem ma bụrụkwa okwu Igbo kwesịrị ekwesị.
- source_word: τῆς φωνῆς αὐτοῦ
  choice: olu ya
  rationale: φωνή pụtara olu mmadụ n’ebe a; ọdịdị genitive nke Grik anaghị achọ mgbasawanye n’Igbo.
theological_decisions:
- issue: Asụsụ mbilite n’ọnwụ nke ndị nọ n’ili ga-anụ olu ya na-egosi
  choice: E debere ihe oyiyi doro anya nke ili, n’etinyeghị nkọwa nkuzi banyere mbilite n’ọnwụ n’amaokwu ahụ.
  alternative: Ịgbakwunye okwu ga-akọwa n’ụzọ doro anya na nke a bụ mbilite n’ọnwụ nke anụ ahụ.
  rationale: Amaokwu ahụ n’onwe ya na-atụ aka ná mbilite n’ọnwụ, ma nsụgharị kwesịrị idebe okwu ya na esemokwu nkà mmụta okpukpe dị na ya kama ịkọwa karịa ihe e dere.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji ‘unu’ gosi na iwu ahụ bụ ọtụtụ mmadụ. Ahịrịokwu ahụ na-asọ nke ọma n’Igbo ma na-edobe ihe SBLGNT kwuru n’enweghị mgbakwunye nkwenkwe otu ụka.
