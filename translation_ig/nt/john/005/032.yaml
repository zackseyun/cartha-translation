id: JHN.5.32
reference: John 5:32
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἄλλος ἐστὶν ὁ μαρτυρῶν περὶ ἐμοῦ, καὶ οἶδα ὅτι ἀληθής ἐστιν ἡ μαρτυρία ἣν μαρτυρεῖ περὶ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/032.yaml
  text: There is another who testifies about me[a], and I know that the testimony which he testifies about me is true.
translation:
  language: ig
  text: E nwere onye ọzọ na-agba akaebe banyere m,[a] ma amaara m na akaebe ahụ ọ na-agba banyere m bụ eziokwu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “onye ọzọ na-agba àmà banyere m.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλος
  choice: onye ọzọ
  rationale: Nke a na-egosi onye ọzọ dị iche na Jizọs, ma ọ naghị akọwa kpọmkwem onye ahụ bụ.
- source_word: ὁ μαρτυρῶν
  choice: na-agba akaebe
  rationale: Nkebi a bụ participle nke na-arụ ọrụ dịka aha ma na-egosi omume na-aga n'ihu; okwu Igbo a bụkwa ụzọ doro anya e si ekwu ịgba àmà.
- source_word: περὶ ἐμοῦ
  choice: banyere m
  rationale: περί tinyere genitive na-egosi isiokwu akaebe ahụ metụtara; “banyere m” bụ Igbo nkịtị ma zie ezi.
- source_word: οἶδα
  choice: amakwaara m
  rationale: Nke a na-asụgharị ngwaa ịma kpọmkwem, ma njikọ -kwa- na-egosipụta njikọ nke καί n'ụzọ dị mma n'Igbo.
- source_word: ἀληθής
  choice: bụ eziokwu
  rationale: N'ebe a okwu ahụ na-akọwa akaebe ahụ dịka nke bụ eziokwu, na-enweghị itinye nkọwa ọzọ dịka ịdị irè ma ọ bụ ntụkwasị obi.
- source_word: ἡ μαρτυρία
  choice: akaebe ahụ
  rationale: “Akaebe” dabara n'ụdị okwu ikpe dị n'akụkụ amaokwu a, ebe “ahụ” na-anọchi article Grik ma na-arụtụ aka n'akaebe onye ahụ.
- source_word: ἣν μαρτυρεῖ
  choice: ọ na-agba
  rationale: E debere njikọ okwu dị n'etiti μαρτυρία na μαρτυρεῖ site n'iji “akaebe ... na-agba,” ma mee ka ahịrịokwu ahụ bụrụ Igbo dị mma.
theological_decisions:
- issue: Onye “onye ọzọ” (ἄλλος) bụ
  choice: E hapụrụ ya dịka “onye ọzọ” n'akọwaghị onye ọ bụ.
  alternative: Jọn Onye Na-eme Baptizim; Nna; ma ọ bụ onye akaebe ọzọ n'echiche ikpe.
  rationale: Amaokwu a n'onwe ya ekwughị kpọmkwem onye ahụ bụ. Ịghara ịkpọ onye ọ bụ na-echekwa nghọta sara mbara na esemokwu nkọwa dị na isi mmalite.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke oge a, dị nsọ ma dị mfe nghọta. “Ịgba akaebe” bụ isi okwu n'ihi ụtọ okwu ikpe dị n'amaokwu a; “ịgba àmà” dị na nkọwa ala peeji dịka okwu ọzọ ziri ezi.
