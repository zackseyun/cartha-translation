base_translation:
  language: en
  yaml_path: translation/nt/john/005/016.yaml
  text: And because of this the Jews were persecuting Jesus[a], because he was doing these things on the Sabbath.
translation:
  language: ig
  text: Ọ bụkwa n’ihi nke a ka ndị Juu ji na-akpagbu Jizọs[a], n’ihi na ọ nọ na-eme ihe ndị a n’ụbọchị Sabat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ndị Judia,” ma ọ bụ, dịka ọnọdụ a si dị, “ndị isi ndị Juu.” N’Oziọma Jọn, okwu a na-ezokarị aka n’otu ìgwè kpọmkwem na-emegide Jizọs, ọ bụghị ndị Juu niile n’enweghị ọdịiche.
    reason: alternative_reading
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: n’ihi nke a
  rationale: Nkebiokwu a na-arụtụ aka n’ihe mere tupu amaokwu a dịka ihe kpatara mmegide ahụ; ‘n’ihi nke a’ na-egosipụta njikọ ihe kpatara ya nke ọma.
- source_word: ἐδίωκον
  choice: na-akpagbu
  rationale: Oge imperfect na-egosi omume na-aga n’ihu ma ọ bụ nke a na-eme ugboro ugboro; ‘na-akpagbu’ na-egosi mmegide siri ike na-adịgide adịgide n’etinyeghị ebumnuche igbu ya nke a ga-ekwu kpọmkwem n’amaokwu 18.
- source_word: οἱ Ἰουδαῖοι
  choice: ndị Juu
  rationale: Nke a bụ ntụgharị kpọmkwem nke aha ọtụtụ mmadụ ahụ. E tinyebeghị ‘ndị isi’ n’ahịrị bụ isi n’ihi na okwu Grik ahụ n’onwe ya ekwughị ya kpọmkwem; ndetu ala peeji na-akọwa na n’ọnọdụ a ọ pụrụ izo aka n’otu ìgwè kpọmkwem.
- source_word: ταῦτα
  choice: ihe ndị a
  rationale: Nke a na-edobe ụdị ọtụtụ nke okwu ngosi ahụ ma na-arụtụ aka n’omume ndị a kọrọ tupu ya.
- source_word: ἐποίει
  choice: ọ nọ na-eme
  rationale: Ụdị imperfect na-elekwasị anya n’omume ahụ dịka nke na-aga n’ihu; ‘ọ nọ na-eme’ na-egosipụta akụkụ a n’Igbo nkịtị.
- source_word: ἐν σαββάτῳ
  choice: n’ụbọchị izu ike
  rationale: Nke a bụ ụzọ doro anya ma bụrụkwa nke ndị Igbo na-aghọta nke ọma maka ụbọchị Sabat n’ọnọdụ akụkọ a.
theological_decisions:
- issue: Onye okwu οἱ Ἰουδαῖοι na-ezo aka na ya n’Oziọma Jọn
  choice: ndị Juu
  alternative: ndị Judia; ma ọ bụ, dịka ọnọdụ a si dị, ndị isi ndị Juu
  rationale: Ahịrị bụ isi na-edobe nkọwa sara mbara nke okwu Grik ahụ kama ikpebi na ọ bụ naanị ndị isi. Ndetu ala peeji na-echekwa nghọta nke ọnọdụ ahụ ma gbochie ka e were ya dị ka ebubo megide onye Juu ọ bụla n’enweghị ọdịiche.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E chekwara mmegharị nke imperfect site na ‘na-akpagbu’ na ‘ọ nọ na-eme,’ tinyekwa nkọwa maka ‘ndị Juu’ n’ala peeji ka ahịrị bụ isi ghara ịkọwa karịa ihe Grik kwuru.
