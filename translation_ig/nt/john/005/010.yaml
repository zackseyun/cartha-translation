id: JHN.5.10
reference: John 5:10
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἔλεγον οὖν οἱ Ἰουδαῖοι τῷ τεθεραπευμένῳ· Σάββατόν ἐστιν, ⸀καὶ οὐκ ἔξεστίν σοι ἆραι τὸν ⸀κράβαττον.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/010.yaml
  text: So the Jews were saying to the man who had been healed[a], “It is the Sabbath[c][b], and it is not lawful for you to carry your mat.”
translation:
  language: ig
  text: Ya mere, ndị Juu[a] nọ na-agwa nwoke ahụ a gwọrọ ọrịa, sị, “Ọ bụ ụbọchị Sabat; iwu ekweghị ka i buru[b] ute gị[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma eleghị anya, “ndị ndú ndị Juu” ma ọ bụ “ndị bi na Judia,” dabere n’otú Jọn si eji okwu a n’ebe a.
    reason: alternative_reading
  - marker: b
    text: A pụkwara ịsị, “bulie” ma ọ bụ “were ute gị.”
    reason: lexical_alternative
  - marker: c
    text: Okwu a sụgharịrị “ute” na-ezo aka n’ihe ndina dị mfe a pụrụ iburu, ọ bụghị n’ihe ndina buru ibu nke oge a.
    reason: cultural_note
lexical_decisions:
- source_word: ἔλεγον
  choice: nọ na-agwa
  rationale: Oge ngwaa imperfect na-egosi okwu na-aga n’ihu ma ọ bụ nke a na-ekwu ugboro ugboro n’oge gara aga; ‘nọ na-agwa’ na-echekwa echiche ahụ n’Igbo dị mfe.
- source_word: οὖν
  choice: Ya mere
  rationale: Ọ na-ejikọta ihe a na ihe mere tupu ya ma na-egosi ihe sochiri ya; ‘Ya mere’ bụ njikọ doro anya ma kwesị ekwesị n’Igbo.
- source_word: οἱ Ἰουδαῖοι
  choice: ndị Juu
  rationale: Nke a bụ ntụgharị okwu Grik ahụ kpọmkwem. Ebe amaokwu a n’onwe ya ekwughị na ha bụ ndị ndú, e meghị ka ihe okwu ahụ na-ezo aka na ya dị warara karịa ka isi mmalite siri dị.
- source_word: τῷ τεθεραπευμένῳ
  choice: nwoke ahụ a gwọrọ ọrịa
  rationale: Participul perfect passive na-egosi na a gwọọla ya, ọnọdụ ahụ ka dịkwa. ‘Nwoke ahụ’ dabara n’ihe gbara amaokwu a gburugburu, ‘a gwọrọ ọrịa’ bụkwa Igbo nkịtị ma doo anya.
- source_word: Σάββατόν ἐστιν
  choice: Taa bụ ụbọchị izu ike
  rationale: Nke a na-ekwupụta na ụbọchị ahụ bụ Sabat. ‘Taa bụ ụbọchị izu ike’ na-enye echiche oge ahụ n’Igbo eke ma ghara ime ka ọ bụrụ naanị izu ike nkịtị.
- source_word: οὐκ ἔξεστίν σοι
  choice: iwu ekweghị ka i
  rationale: ἔξεστιν na-ekwu banyere ihe iwu kwadoro ma ọ bụ ihe e kwere ime. Nhọrọ a na-echekwa ọdịdị esemokwu gbasara iwu ụbọchị izu ike ma na-ada nke ọma n’Igbo.
- source_word: ἆραι
  choice: buru
  rationale: αἴρω nwere ike ịpụta ibuli ma ọ bụ iwere, ma n’ebe a ihe a na-emegide bụ ibu ute ahụ gaa; ‘buru’ na-egosipụta isi ebubo ahụ nke ọma.
- source_word: κράβαττον
  choice: ute
  rationale: Okwu ahụ na-ezo aka n’ihe dị mfe mmadụ na-edina n’elu ya nke a pụrụ iburu, ọ bụghị ihe ndina buru ibu nwere okpokoro. ‘Ute’ bụ okwu Igbo doro anya nke na-echekwa echiche ahụ.
theological_decisions:
- issue: Ndị οἱ Ἰουδαῖοι na-ezo aka na ha n’Oziọma Jọn
  choice: ndị Juu
  alternative: ndị ndú ndị Juu; ma ọ bụ ndị Judia
  rationale: A hapụrụ okwu ahụ n’ụdị sara mbara nke isi mmalite nyere, n’ihi na amaokwu a akọwaghị kpọmkwem na ndị na-ekwu okwu bụ ndị ndú ma ọ bụ ndị si Judia. Ihe odide ala peeji na-edebe ohere nkọwa ndị ọzọ n’emebighị mgbagwoju anya dị n’isi mmalite.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ ‘ụbọchị izu ike’ maka Sabat n’ụzọ ndị na-agụ Igbo ga-aghọta, ebe ‘iwu ekweghị’ na-echekwa ụda iwu na okpukpe nke esemokwu ahụ. E debere akara odide ala peeji n’ebe okwu nke ọ bụla ha na-akọwa dị.
