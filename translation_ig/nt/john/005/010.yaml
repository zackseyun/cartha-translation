- from: Ya mere, ndị Juu[a] nọ na-agwa nwoke ahụ a gwọrọ ọrịa, “Taa bụ ụbọchị izu ike, iwu ekweghị ka i buru[b] ute gị[c].”
  to: Ya mere, ndị Juu[a] nọ na-agwa nwoke ahụ a gwọrọ ọrịa, sị, “Ọ bụ ụbọchị Sabat; iwu ekweghị ka i buru[b] ute gị[c].”
  rationale: The revision removes the unexpressed ‘today’ and restores ‘Sabat’ as the direct, standard biblical equivalent of Σάββατον. It preserves the imperfect sense (‘nọ na-agwa’), the legal force of οὐκ ἔξεστιν, and the portable-mat sense of κράβαττον. Footnote a is adjusted so the geographic alternative is idiomatic Igbo rather than potentially suggesting a distinct ethnic label.
