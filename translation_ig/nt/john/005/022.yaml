  text: οὐδὲ γὰρ ὁ πατὴρ κρίνει οὐδένα, ἀλλὰ τὴν κρίσιν πᾶσαν δέδωκεν τῷ υἱῷ,
base_translation:
  language: en
  yaml_path: translation/nt/john/005/022.yaml
  text: For the Father judges no one, but has given all judgment to the Son,
translation:
  language: ig
  text: N’ihi na Nna anaghị ekpe onye ọ bụla ikpe, kama o enyela Ọkpara ikpe niile.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐδὲ γὰρ
  choice: N’ihi na
  rationale: Ọ na-ewebata nkọwa na-aga n’ihu site n’ihe e kwuru tupu ya; ‘N’ihi na’ na-egosipụta ọrụ nkọwa nke γάρ n’Igbo eke.
- source_word: ὁ πατὴρ
  choice: Nna
  rationale: N’ọnọdụ a, ọ bụ aha nsọpụrụ e ji akọwa Chineke n’ihe metụtara Ọkpara; ‘Nna’ bụ ụzọ Igbo doro anya ma dị ebube si kwuo ya.
- source_word: κρίνει οὐδένα
  choice: anaghị ekpe onye ọ bụla ikpe
  rationale: Okwu a na-egosi eziokwu zuru oke na-aga n’ihu. ‘Ikpe ikpe’ na-edobe echiche ikpe ziri ezi n’enweghị ime ka ọ bụrụ nanị ịma mmadụ ikpe ọmụma.
- source_word: ἀλλὰ
  choice: kama
  rationale: ‘Kama’ na-egosipụta ọdịiche siri ike n’etiti Nna ịghara ikpe onye ọ bụla na inyefe Ọkpara ikpe niile.
- source_word: τὴν κρίσιν πᾶσαν
  choice: ikpe niile
  rationale: Nhọrọ a na-edobe aha κρίσις na oke zuru ezu nke πᾶσαν, n’etinyeghị nkọwa agbakwunyere dịka ‘ikike ikpe.’
- source_word: δέδωκεν
  choice: o nyefeela
  rationale: Ụdị Igbo a na-egosi ihe e mere nke nsonaazụ ya ka dị ugbu a, ma gosikwa na e nyere Ọkpara ọrụ ikpe ahụ.
- source_word: τῷ υἱῷ
  choice: Ọkpara
  rationale: ‘Ọkpara’ na-edobe ya dịka aha pụrụ iche nke Ọkpara n’ọdịnala okwu Jọn, na-agbakwụghị nnọchiaha nwe nke Grik na-enweghị.
theological_decisions:
- issue: Mmekọrịta dị n’etiti ikpe Nna na ikpe Ọkpara
  choice: 'E kwuru ya ozugbo: Nna anaghị ekpe onye ọ bụla ikpe, kama o nyefeela Ọkpara ikpe niile.'
  alternative: Ịsụgharị ya dịka ‘Nna anaghị ekpe onye ọ bụla ikpe n’onwe ya’ ma ọ bụ ime ‘ikpe niile’ ka ọ bụrụ naanị ikpe ikpeazụ.
  rationale: Nke a na-echekwa okwu ahụ na esemokwu nkà mmụta okpukpe dị na ya, n’etinyeghị nkọwa ime ka ihe kwekọọ nke adịghị n’ederede Grik.
- issue: Aha Kraịst ‘Ọkpara’
  choice: Jiri ‘Ọkpara’ dịka aha pụrụ iche.
  alternative: ‘nwa ya nwoke’
  rationale: N’ọnọdụ a, υἱός bụ aha dị mkpa nke na-egosi mmekọrịta Nna na Ọkpara; ‘Ọkpara’ na-echekwa ịdị arọ nke aha ahụ n’asụsụ Igbo.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke oge a, dị mfe nghọta ma nwee ugwu. A họọrọ ‘ikpe onye ikpe’ iji chekwaa njikọ okwu dị n’etiti κρίνει na κρίσιν; e zere ịgbakwunye ‘ikike’ n’ihi na ọ bụ nkọwa karịrị ụdị okwu kpọmkwem.
