id: JHN.5.2
reference: John 5:2
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἔστιν δὲ ἐν τοῖς Ἱεροσολύμοις ἐπὶ τῇ προβατικῇ κολυμβήθρα ἡ ἐπιλεγομένη Ἑβραϊστὶ ⸀Βηθεσδά, πέντε στοὰς ἔχουσα·
base_translation:
  language: en
  yaml_path: translation/nt/john/005/002.yaml
  text: There is in Jerusalem[a], by the Sheep Gate, a pool called Bethesda in Hebrew[c][b], having five porticoes.
translation:
  language: ig
  text: Na Jerusalem, n'akụkụ Ọnụ Ụzọ Atụrụ[a], e nwere otu ọdọ mmiri a na-akpọ Betesda[c] n'asụsụ Hibru[b], nke nwere ogidi ụzọ ise e ji ogidi wuo ma kpuchie elu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Okwu Grik pụtara n'ụzọ nkịtị “n'akụkụ ebe atụrụ.” O yikarịrị ka ọ na-ezo aka n'ógbè Ọnụ Ụzọ Atụrụ (tulee Nehemaya 3:1; 12:39), ọ bụ ezie na okwu “Ọnụ Ụzọ” apụtaghị kpọmkwem n'amaokwu a.
    reason: cross_reference
  - marker: b
    text: Ma ọ bụ, “n'asụsụ Arameik.” Mgbe Jọn kwuru “Hibru,” ọ na-ezokarị aka n'asụsụ Semitik ndị Juu na-asụ n'ógbè ahụ, ọ bụghị naanị Hibru oge ochie.
    reason: lexical_alternative
  - marker: c
    text: Ụfọdụ akwụkwọ aka ochie nwere “Betzata” ma ọ bụ “Betsaida” kama “Betesda.”
    reason: textual_variant
lexical_decisions:
- source_word: ἔστιν δὲ
  choice: E nwere
  rationale: A nọgidere n'oge ugbu a nke ἔστιν. A hapụrụ δέ ka njikọ dị nro nke usoro okwu gosipụta, kama ịgbakwunye okwu oge dịka “ugbu a” nke na-adịghị n'okwu Grik.
- source_word: ἐν τοῖς Ἱεροσολύμοις
  choice: na Jerusalem
  rationale: Nke a bụ ụzọ Igbo kwụ ọtọ ma dịrị mmadụ niile mfe isi kwuo ebe ihe dị; ọtụtụ n'ụdị aha Grik anaghị agbanwe aha obodo ahụ n'Igbo.
- source_word: ἐπὶ τῇ προβατικῇ
  choice: n'akụkụ Ọnụ Ụzọ Atụrụ[a]
  rationale: Okwu Grik ahụ dị mkpirikpi, noun a na-akọwa adịghịkwa pụta ìhè. Ebe ọ bụ na κολυμβήθρα bụ ọdọ mmiri e kwuru ozugbo, ihe a kacha kwekọọ na ọnọdụ Jerusalem bụ mpaghara Ọnụ Ụzọ Atụrụ. E tinyere nkọwa a n'ala peeji iji ghara izochi na “Ọnụ Ụzọ” bụ okwu e nyere aka ghọta ahịrịokwu ahụ.
- source_word: κολυμβήθρα
  choice: otu ọdọ mmiri
  rationale: “Ọdọ mmiri” bụ okwu Igbo doro anya maka pool ma ọ bụ reservoir n'ebe a; “otu” na-eme ka ntinye ihe ọhụrụ ahụ bụrụ nke eke n'Igbo.
- source_word: ἡ ἐπιλεγομένη
  choice: a na-akpọ ya
  rationale: Nke a na-egosipụta participle ahụ n'ụzọ Igbo nke ugbu a ma mee ka ihe aha ahụ na-ezo aka na ya doo anya.
- source_word: Ἑβραϊστὶ
  choice: N'asụsụ Hibru[b]
  rationale: Isi ederede na-agbaso okwu Grik kpọmkwem, “n'asụsụ Hibru,” ebe nkọwa ala peeji na-edebe ohere na Jọn nwere ike ịbụ na ọ na-ekwu maka asụsụ Semitik a na-asụ n'ógbè ahụ, ya bụ Arameik.
- source_word: Βηθεσδά
  choice: Betesda[c]
  rationale: A sụgharịrị ụdị aha dị na SBLGNT n'ụzọ dabara na ụda na mkpụrụedemede Igbo; ụdị aha ndị ọzọ dị n'ụfọdụ akwụkwọ aka ochie ka e debere n'ala peeji.
- source_word: πέντε στοὰς ἔχουσα
  choice: o nwekwara paseeji ise nwere elu ụlọ na ogidi
  rationale: στοά bụ ụzọ ma ọ bụ paseeji e kpuchiri ekpuchi nke ogidi na-akwado. Nkebiokwu a na-akọwa ihe ahụ n'Igbo nkịtị karịa iji okwu mba ọzọ dịka “portico,” ma na-edebe ọnụ ọgụgụ ise na echiche nke ἔχουσα.
theological_decisions: []
translation_notes:
  register: Ejiri Igbo Izugbe nke ugbu a, dị ùgwù ma dị mfe nghọta. E kewara usoro Grik ahụ n'ahịrịokwu abụọ dị mkpirikpi ka ọ na-asọ nke ọma n'Igbo, ma e debere oge ugbu a, aha ebe ahụ, na nkọwa banyere paseeji ise. Okwu nkọwa niile [a], [b], na [c] dị n'isi ederede n'akụkụ okwu ha na-akọwa.
