    issue: “paseeji ise nwere elu ụlọ na ogidi” is imprecise for πέντε στοὰς ἔχουσα.
    rationale: A στοά is a covered colonnade or portico, not merely a passage. The revised wording identifies five roofed, pillar-built walkways while avoiding an unnecessary foreign architectural term.
