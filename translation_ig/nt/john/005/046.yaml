base_translation:
  language: en
  yaml_path: translation/nt/john/005/046.yaml
  text: For if you believed Moses[a], you would believe me[b], for he wrote about me.
translation:
  language: ig
  text: N’ihi na ọ bụrụ na unu kwere Mosis, unu gaara ekwere m,[a] n’ihi na onye ahụ dere banyere m.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “unu gaara atụkwasị m obi.” Otu ngwaa Grik ka e ji mee ihe n’ahịrịokwu abụọ ahụ.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “n’ihi na onye ahụ dere banyere m.” Okwu Grik ahụ na-ekwusi ike n’ebe Mosis nọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ γὰρ
  choice: N’ihi na ọ bụrụ na
  rationale: A nọgidere na-ejide njikọ nkọwa nke γάρ site na ‘N’ihi na,’ ebe ‘ọ bụrụ na’ na-egosi ọnọdụ nke εἰ.
- source_word: ἐπιστεύετε Μωϋσεῖ
  choice: unu kwere ihe Mosis kwuru
  rationale: πιστεύω na dative nke onye pụtara ikwere onye ahụ ma ọ bụ ihe ọ na-ekwu. N’Igbo, ‘kwere ihe Mosis kwuru’ doro anya ma zere nghọta na-adịghị eburu n’obi dị ka ‘kwere na Mosis dị.’
- source_word: ἐπιστεύετε ἂν ἐμοί
  choice: unu gaara ekwere ihe m kwuru
  rationale: Imperfect tinyere ἄν na-egosi ihe gaara eme ma ọnọdụ na-abụghị eziokwu mezuru; ‘gaara’ na-egosipụta nke a. Otu ngwaa ‘kwere’ dị n’ahịrịokwu abụọ ahụ, dịka n’asụsụ Grik.
- source_word: περὶ γὰρ ἐμοῦ
  choice: n’ihi na ọ bụ banyere m ka
  rationale: ‘Banyere m’ na-enye isi περί na genitive n'ụzọ Igbo nkịtị; usoro ‘ọ bụ ... ka’ na-ebute ihe a na-ekwusi ike n’ihu.
- source_word: ἐκεῖνος
  choice: onye ahụ
  rationale: ‘Onye ahụ’ na-egosipụta ike demonstrative nke ἐκεῖνος ma na-ezo aka azụ n’ebe Mosis nọ.
- source_word: ἔγραψεν
  choice: dere
  rationale: Oge gara aga dị mfe na-anọchi aorist nke ọma n’ọnọdụ a.
theological_decisions:
- issue: Ụdị akaebe Mosis nyere banyere Jizọs
  choice: ọ bụ banyere m ka onye ahụ dere
  alternative: ọ bụ maka m ka onye ahụ dere
  rationale: ‘Banyere m’ na-edobe nkwupụta ahụ n’ogo sara mbara nke Grik, n’akọwaghị otu akụkụ Akwụkwọ Nsọ kpọmkwem ma ọ bụ tinye nkọwa ozizi karịrị ihe ederede kwuru.
- issue: Ihe πιστεύω na dative pụtara n’ebe a
  choice: kwere ihe ... kwuru
  alternative: tụkwasị ... obi
  rationale: Nhọrọ ahụ na-edobe njikọ otu ngwaa dị n’etiti Mosis na Jizọs, ma na-egosi na ihe a na-ekwu bụ ịnakwere akaebe ha; ọ naghị etinye ‘kwere na’ nke gaara adị ka εἰς.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ ‘ihe ... kwuru’ iji mee ka πιστεύω na dative bụrụ okwu Igbo eke; e debere ‘onye ahụ’ iji gosipụta nkwusi ike nke ἐκεῖνος.
