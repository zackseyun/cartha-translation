revisions:
- from: Onye ahụ na-arịa ọrịa zara ya, sị, “Onyenwe anyị, enweghị m onye ga-etinye m n’ọdọ mmiri ahụ mgbe a kpaliri mmiri ya. Ma mgbe m na-agbalị ịbanye, onye ọzọ na-eburu m ụzọ rịdata.”
  to: Onye ahụ na-arịa ọrịa zara ya, sị, “Nna m ukwu, enweghị m onye ga-etinye m n’ọdọ mmiri ahụ mgbe a kpaliri mmiri ahụ. Ma ka m na-abịa, onye ọzọ na-arịdata tupu m.”
  rationale: The revision removes the unsupported plural possessive in the address and uses a respectful, semantically open Igbo vocative. It also restores the simple ongoing sense of “I am coming,” retains the unnamed agent who stirs the water, and preserves the statement that another person descends before the sick man.
  reviewer_model: gpt-5.6-terra
