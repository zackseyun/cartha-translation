id: JHN.5.7
reference: John 5:7
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀπεκρίθη αὐτῷ ὁ ἀσθενῶν· Κύριε, ἄνθρωπον οὐκ ἔχω ἵνα ὅταν ταραχθῇ τὸ ὕδωρ βάλῃ με εἰς τὴν κολυμβήθραν· ἐν ᾧ δὲ ἔρχομαι ἐγὼ ἄλλος πρὸ ἐμοῦ καταβαίνει.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/007.yaml
  text: The sick man answered him, “Lord, I have no one to put me into the pool when the water is stirred up; but while I am coming, another goes down before me.”
translation:
  language: ig
  text: Onye ahụ na-arịa ọrịa zara ya, sị, “Nna m ukwu, enweghị m onye ga-etinye m n’ọdọ mmiri ahụ mgbe a kpaliri mmiri ahụ. Ma ka m na-abịa, onye ọzọ na-arịdata tupu m.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ἀσθενῶν
  choice: onye ahụ na-arịa ọrịa
  rationale: Na-egosi onye ahụ dị ka onye na-arịa ọrịa, n’asụsụ Igbo doro anya ma dịkwa ebumpụta ụwa.
- source_word: Κύριε
  choice: Onyenwe anyị
  rationale: Na-echekwa okwu nkwanye ùgwù ahụ nke nwere ike ịpụta ‘Nna m ukwu’ ma ọ bụ ‘Onyenwe anyị’; ebe nyocha Bekee họọrọ ‘Lord,’ a hapụrụ ịdị arọ nke aha a n’Igbo.
- source_word: κολυμβήθραν
  choice: ọdọ mmiri ahụ
  rationale: Ọ bụ ebe mmiri e wuru ma ọ bụ ọdọ a na-abanye n’ime ya; ‘ọdọ mmiri’ bụ okwu ndị nkịtị ga-aghọta n’ọnọdụ a.
- source_word: ταραχθῇ τὸ ὕδωρ
  choice: a kpaliri mmiri ya
  rationale: Na-ejigide olu nnara na enweghị onye kpọmkwem e kwuru na ọ kpaliri mmiri ahụ.
- source_word: βάλῃ με
  choice: ga-etinye m
  rationale: Na-enye echiche nke inyere onye ọrịa ahụ banye n’ọdọ ahụ n’enweghị ịgbakwunye nkọwa na-adịghị na Grik.
- source_word: ἄλλος πρὸ ἐμοῦ καταβαίνει
  choice: onye ọzọ na-eburu m ụzọ rịdata
  rationale: Na-egosi na onye ọzọ na-arịdata tupu ya erute, dịka usoro okwu Grik si kwuo.
theological_decisions:
- issue: Ihe Κύριε pụtara n’okwu onye ọrịa ahụ
  choice: Onyenwe anyị
  alternative: Nna m ukwu
  rationale: Κύριε nwere ike ịbụ okwu nkwanye ùgwù ma ọ bụ aha dị elu. A họọrọ ‘Onyenwe anyị’ iji soro mkpebi ederede a nyochara ma ghara iwepụ ohere nghọta Kraịst dị elu, n’agbanyeghị na ọnọdụ a n’onwe ya anaghị egosi kpọmkwem ihe onye ahụ ghọtara banyere Jizọs.
- issue: Onye ma ọ bụ ihe kpaliri mmiri ahụ
  choice: a kpaliri mmiri ya
  alternative: mmiri ya kpaliri
  rationale: A naghị akpọ onye mere ya aha na amaokwu Grik a; nsụgharị ahụ anaghị etinye mmụọ ozi ma ọ bụ nkọwa sitere n’ọdịiche ederede.
translation_notes:
  register: Standard Igbo dị ugbu a, dị nsọ ma dị mfe nghọta. E ji ahịrịokwu mkparịta ụka ebumpụta ụwa mee ya, ma e chekwara enweghị onye kpọmkwem kpaliri mmiri ahụ na mgbagwoju anya nke Κύριε.
