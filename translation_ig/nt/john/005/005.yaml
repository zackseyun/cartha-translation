  yaml_path: translation/nt/john/005/005.yaml
  text: There was a man there who had been in his sickness for thirty-eight years[a].
translation:
  language: ig
  text: E nwere otu nwoke nọ n’ebe ahụ, onye nọworo n’ọrịa ya ruo afọ iri atọ na asatọ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “n’adịghị ike ya” ma ọ bụ “n’arịa ya.” Okwu Grik ἀσθένεια nwere ike izo aka n’adịghị ike nke anụ ahụ ma ọ bụ ọrịa n’ozuzu ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν δέ
  choice: Otu nwoke nọ
  rationale: δέ bụ njikọ dị nro nke na-aga n’ihu n’akụkọ ahụ; Igbo ekwesịghị ịgbakwunye okwu na-egosi oge ma ọ bụ nnukwu mgbagha ebe Grik na-emeghị otú ahụ.
- source_word: τις ἄνθρωπος
  choice: otu nwoke
  rationale: Nkebiokwu a na-ewebata nwoke a na-akọwabeghị aha ya. “Otu nwoke” bụ ụzọ Igbo dị mfe ma kwekọọ na ntụaka nwoke otu onye.
- source_word: ἐκεῖ
  choice: n’ebe ahụ
  rationale: Ọ na-egosi ebe ahụ a kọwara n’amaokwu ndị bu ụzọ.
- source_word: τριάκοντα ὀκτὼ ἔτη
  choice: afọ iri atọ na asatọ
  rationale: Nke a bụ ụzọ Igbo nkịtị si kwuo ọnụ ọgụgụ afọ ahụ.
- source_word: ἔχων
  choice: onye nọworo
  rationale: N’ọnọdụ a, participle ahụ na-egosi ọnọdụ malitere n’oge gara aga wee ruo n’oge a na-akọ; “nọworo” na-egosipụta ịdịgide ahụ n’Igbo.
- source_word: ἐν τῇ ἀσθενείᾳ αὐτοῦ
  choice: n’ọrịa ya
  rationale: ἀσθένεια nwere ike ịpụta adịghị ike, ọrịa, ma ọ bụ ahụ mgbu. “N’ọrịa ya” na-edobe usoro okwu Grik ma ghara ịkọwa ụdị ọrịa ahụ karịa ihe amaokwu ahụ kwuru.
