id: JHN.5.11
reference: John 5:11
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸂ὃς δὲ⸃ ἀπεκρίθη αὐτοῖς· Ὁ ποιήσας με ὑγιῆ ἐκεῖνός μοι εἶπεν Ἆρον τὸν κράβαττόν σου καὶ περιπάτει.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/011.yaml
  text: But he answered them[a], “The one who made me well—that one said to me[b], ‘Pick up your mat and walk.’”
translation:
  language: ig
  text: 'Ma ọ zara ha, sị: “Onye mere ka ahụ dị m mma, ọ bụ ya gwara m, sị, ‘Bulie ute gị, jee ije.’”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: zara
  rationale: ‘Zara’ bụ okwu Igbo a na-ejikarị akọ nzaghachi n’ụka ma ọ bụ n’akụkọ.
- source_word: Ὁ ποιήσας με ὑγιῆ
  choice: Onye ahụ mere ka ahụ dị m mma
  rationale: Nke a na-egosipụta onye mere ka nwoke ahụ gbakee n’ọrịa, n’asụsụ Igbo doro anya ma bụrụkwa nke mmadụ nkịtị ga-aghọta.
- source_word: ὑγιῆ
  choice: ahụ dị m mma
  rationale: N’ọnọdụ akụkọ ọgwụgwọ a, okwu a na-ezo aka n’ịdị mma n’ahụ; ọ naghị etinye echiche ime mmụọ nke okwu Grik ahụ ekwughị kpọmkwem.
- source_word: ἐκεῖνός
  choice: ọ bụ ya
  rationale: 'Nke a na-echekwa nkwusi ike dị na nnọchiaha Grik ahụ: onye gwọrọ ya bụ kpọmkwem onye nyere ya iwu ahụ.'
- source_word: Ἆρον
  choice: Bulie
  rationale: ‘Bulie’ bụ iwu kpọmkwem ma dị mfe nghọta maka ibuli ihe dị n’ala ma ọ bụ ebe e debere ya.
- source_word: κράβαττόν
  choice: ute
  rationale: Okwu Grik ahụ na-ezo aka n’ute ma ọ bụ ihe ndina dị mfe, ọ bụghị ihe ndina buru ibu; ‘ute’ dabara nke ọma n’ebe a.
- source_word: περιπάτει
  choice: jegharịa
  rationale: ‘Jegharịa’ na-egosipụta ije n’ụkwụ n’asụsụ Igbo ebumpụta ụwa ma dabara n’iwu e nyere onye a gwọrọ.
- source_word: δὲ
  choice: Ma
  rationale: ‘Ma’ na-egosipụta ntakịrị mmegide dị n’etiti ajụjụ/ebo ebubo ha na nzaghachi nwoke ahụ.
theological_decisions:
- issue: Nkọwa ọgwụgwọ ahụ nwere ike ibu echiche sara mbara karịa ahụ ike
  choice: mere ka ahụ dị m mma
  alternative: mere ka m zuo oke
  rationale: Ihe gbara amaokwu ahụ gburugburu bụ ọgwụgwọ anụ ahụ. ‘Mere ka m zuo oke’ nwere ike itinye echiche ime mmụọ ma ọ bụ nkà mmụta okpukpe nke okwu Grik ahụ anaghị achọ n’ebe a.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị nsọ ma dị mfe nghọta. E chekwara nkwusi ike nke ἐκεῖνός site n’okwu ‘ọ bụ ya,’ ma zere okwu ndị nwere ike ime ka ọgwụgwọ anụ ahụ ghọọ nkwupụta nkà mmụta okpukpe sara mbara.
