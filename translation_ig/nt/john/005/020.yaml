    text: A pụkwara ịsụgharị ya, “nke ga-eme ka unu ju anya.” Okwu Grik ἵνα na ngwaa dị n’ọnọdụ subjunctive nwere ike igosi ebumnuche; n’ebe a, ọ pụkwara ịgụnye ihe ga-esi na ya pụta, ya bụ, na ndị na-ege Jizọs ntị ga-eju anya.
    reason: alternative_reading
  revision_rationale: The revision replaces the non-idiomatic comparative with a natural Standard Igbo equivalent, retains the Greek’s coordinated structure, and moves the footnote anchor to the clause it documents. No interpretive or doctrinal change is introduced.
