review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders the Father’s love for the Son, the comprehensive scope of what the Father is doing, the future showing of greater works, and the plural addressees’ amazement. However, “ọrụ ndị ka ndị a ukwuu” is not a natural or well-formed Standard Igbo comparative for μείζονα τούτων ἔργα.
  naturalness: “Ọrụ ndị karịrị ndị a” is the natural, concise Standard Igbo expression for “greater works than these.” The principal clauses are also better retained as one connected sentence, reflecting the Greek coordination.
  terminology: “Nna,” “Ọkpara,” “hụrụ ... n’anya,” “na-egosi/ga-egosi,” and “ọrụ” are appropriate and theologically non-overdetermined. The footnote marker must be attached to the ἵνα clause, since its note concerns that clause rather than “greater works.”
  issues:
  - severity: medium
    issue: Unnatural comparative construction
    rationale: “ọrụ ndị ka ndị a ukwuu” is not idiomatic Standard Igbo. “ọrụ ndị karịrị ndị a” clearly and naturally conveys “works greater than these.”
  - severity: medium
    issue: Footnote anchor is attached to the wrong phrase
    rationale: The note explains the force of ἵνα ὑμεῖς θαυμάζητε (“so that you may marvel”), but marker [a] currently follows “ndị a” (“these”). It should follow “ju anya.”
  revised_text: N’ihi na Nna hụrụ Ọkpara ya n’anya, na-egosikwa ya ihe niile ya onwe ya na-eme; ọ ga-egosikwa ya ọrụ ndị karịrị ndị a, ka unu wee ju anya[a].
  revised_footnotes:
