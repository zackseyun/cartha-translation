id: JHN.5.20
reference: John 5:20
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ γὰρ πατὴρ φιλεῖ τὸν υἱὸν καὶ πάντα δείκνυσιν αὐτῷ ἃ αὐτὸς ποιεῖ, καὶ μείζονα τούτων δείξει αὐτῷ ἔργα, ἵνα ὑμεῖς θαυμάζητε.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/020.yaml
  text: For the Father loves the Son and shows him all that he himself is doing; and he will show him greater works than these[a], so that you may marvel.
translation:
  language: ig
  text: N’ihi na Nna hụrụ Ọkpara ya n’anya, na-egosikwa ya ihe niile ya onwe ya na-eme; ọ ga-egosikwa ya ọrụ ndị karịrị ndị a, ka unu wee ju anya[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “nke ga-eme ka unu ju anya.” Okwu Grik ἵνα na ngwaa dị n’ọnọdụ subjunctive nwere ike igosi ebumnuche; n’ebe a, ọ pụkwara ịgụnye ihe ga-esi na ya pụta, ya bụ, na ndị na-ege Jizọs ntị ga-eju anya.
    reason: alternative_reading
lexical_decisions:
- source_word: φιλεῖ
  choice: hụrụ ... n’anya
  rationale: Nke a bụ ụzọ Igbo nkịtị na nke doro anya si ekwu ịhụnanya. Ọ naghị ebelata φιλέω ka ọ bụrụ nanị mmetụta ịhụnanya mmadụ, ebe okwu a na ἀγαπάω nwere ike ịdakọta n’Oziọma Jọn.
- source_word: δείκνυσιν / δείξει
  choice: na-egosi / ga-egosi
  rationale: A họọrọ otu mgbọrọgwụ okwu n’ebe abụọ ahụ iji chekwaa njikọ dị n’etiti ihe Nna na-egosi ugbu a na ihe ọ ga-egosi n’ọdịnihu.
- source_word: πάντα ἃ αὐτὸς ποιεῖ
  choice: ihe niile ya onwe ya na-eme
  rationale: “Ihe niile” na-egosipụta oke zuru ezu nke πάντα, ebe “ya onwe ya” na-echekwa nkwusi ike nke αὐτός na-ezo aka n’ebe Nna nọ.
- source_word: μείζονα τούτων ... ἔργα
  choice: ọrụ ndị ka ndị a ukwuu
  rationale: “Ọrụ” dabara na ojiji ἔργον n’Oziọma Jọn ma na-echekwa ntụnyere ahụ n’enweghị ịkọwa ihe ọrụ ndị ahụ bụ.
- source_word: ἵνα ὑμεῖς θαυμάζητε
  choice: ka unu wee ju anya
  rationale: “Unu” na-egosipụta mmadụ nke abụọ ọtụtụ; ahịrịokwu a na-ahapụkwa ἵνα ka ọ nwee ike igosi ebumnuche ma ọ bụ ihe ga-esi na ya pụta.
theological_decisions:
- issue: Ụdị ịhụnanya Nna nwere n’ebe Ọkpara nọ nke φιλεῖ na-egosi
  choice: A sụgharịrị ya n’ụzọ dị mfe dịka “hụrụ Ọkpara ya n’anya.”
  alternative: “nwere mmetụta ịhụnanya n’ebe Ọkpara nọ”
  rationale: Nke a na-echekwa mmekọrịta chiri anya nke Nna na Ọkpara n’ebughị n’ime ederede ọdịiche nkà mmụta okpukpe nke okwu Grik ahụ n’onwe ya anaghị achọ.
- issue: Ike na ọrụ nke ἵνα ὑμεῖς θαυμάζητε
  choice: “ka unu wee ju anya”
  alternative: “nke ga-eme ka unu ju anya”
  rationale: Nhọrọ a na-echekwa ohere nke ebumnuche na nke ihe ga-esi na ya pụta, ma doo anya na ndị a na-agwa okwu bụ ọtụtụ mmadụ, ọ bụghị Ọkpara.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E jiri “Ọkpara” chekwaa aha mmekọrịta ahụ, jiri “Nna” dịka aha Chineke n’ọnọdụ a, ma jiri “ọrụ” mee ka okwu Jọn gbasara ἔργα ghara ịla n’iyi.
