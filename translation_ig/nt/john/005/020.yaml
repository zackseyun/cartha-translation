  to: N’ihi na Nna hụrụ Ọkpara ya n’anya, na-egosikwa ya ihe niile ya onwe ya na-eme; ọ ga-egosikwa ya ọrụ ndị karịrị ndị a, ka unu wee ju anya[a].
  rationale: The revision replaces the non-idiomatic comparative with a natural Standard Igbo equivalent, retains the Greek’s coordinated structure, and moves the footnote anchor to the clause it documents. No interpretive or doctrinal change is introduced.
