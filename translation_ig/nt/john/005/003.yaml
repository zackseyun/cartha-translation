  text: ἐν ταύταις κατέκειτο ⸀πλῆθος τῶν ἀσθενούντων, τυφλῶν, χωλῶν, ⸀ξηρῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/003.yaml
  text: In these lay a multitude of the sick[a], blind, lame, and paralyzed.
translation:
  language: ig
  text: 'N’ime ha ka ọtụtụ ndị ọrịa dina: ndị ìsì, ndị ngwụrọ, na ndị akpọnwụwo.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’ụzọ nkịtị, “ndị akọrọ” ma ọ bụ “ndị akpọnwụwo.” N’ebe a, o yikarịrị ka ọ na-ekwu maka ndị aka ma ọ bụ ụkwụ ha akpọnwụwo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ταύταις
  choice: N’ime ha
  rationale: Nnọchiaha ngosi nke nwanyị n’ọnụọgụ dị ukwuu na-ezo aka n’ihe owuwu ndị a kpọrọ aha n’amaokwu bu ụzọ; ntụgharị a na-edobe njikọ ahụ n’enweghị ịgbakwụnye aha na-adịghị n’amaokwu a.
- source_word: κατέκειτο
  choice: dina
  rationale: Okwu a na-egosi ọnọdụ nke ịdina ala na-aga n’ihu n’oge gara aga; ‘dina’ bụ ụzọ Igbo dị mfe ma kwekọọ n’akụkọ a.
- source_word: πλῆθος
  choice: ọtụtụ
  rationale: Ọ na-egosi nnukwu ọnụ ọgụgụ mmadụ; ‘ọtụtụ’ bụ okwu Igbo nkịtị, doro anya, nke na-edobe echiche ahụ.
- source_word: τῶν ἀσθενούντων
  choice: ndị ọrịa
  rationale: N’ebe a ọ na-ezo aka ná ndị na-arịa ọrịa ma ọ bụ ndị ahụ na-adịghị ike n’ahụ, ọ bụghị adịghị ike n’ozuzu ya.
- source_word: τυφλῶν
  choice: ndị ìsì
  rationale: Nke a bụ okwu Igbo kpọmkwem ma dị ùgwù maka ndị na-adịghị ahụ ụzọ.
- source_word: χωλῶν
  choice: ndị ngwụrọ
  rationale: Ọ na-akọwa ndị nwere nkwarụ nke ije ije; ‘ndị ngwụrọ’ bụ nhata Igbo a na-aghọta nke ọma.
- source_word: ξηρῶν
  choice: ndị akụkụ ahụ ha kpọnwụrụ akpọnwụ
  rationale: ξηρός pụtara n’ụzọ nkịtị ‘akọrọ’ ma ọ bụ ‘kpọnwụrụ akpọnwụ’; n’ọnọdụ ahụ mmadụ, ọ na-egosi akụkụ ahụ kpọnwụrụ ma ghara ịrụ ọrụ nke ọma. Nhọrọ a na-edobe ihe atụ okwu Grik ahụ kama ịkọwa ya nanị dị ka mkpọnwụ.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị mfe ma dị ùgwù. E jiri ‘N’ime ha’ mee ka ntụaka gaa n’ihe owuwu ndị a kpọrọ aha n’amaokwu gara aga nọgide bụrụ nke a na-ekwughị kpọmkwem, dịka ọ dị na Grik. Akara nkọwa ala peeji [a] dị n’isiokwu ahụ.
