id: JHN.5.14
reference: John 5:14
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: μετὰ ταῦτα εὑρίσκει αὐτὸν ὁ Ἰησοῦς ἐν τῷ ἱερῷ καὶ εἶπεν αὐτῷ· Ἴδε ὑγιὴς γέγονας· μηκέτι ἁμάρτανε, ἵνα μὴ χεῖρόν ⸂σοί τι⸃ γένηται.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/014.yaml
  text: After these things Jesus found him in the temple and said to him[a], “See, you have become well. Sin no more[c][b], so that something worse may not happen to you.”
translation:
  language: ig
  text: Mgbe ihe ndị a gasịrị, Jizọs chọtara ya n'ụlọ nsọ wee sị ya, “Lee, ahụ adịla gị mma.[a] Emehiela ọzọ, ka ihe ka njọ ghara ime gị.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'N''ụzọ dị nso n''usoro okwu Grik: “ị ghọọla onye dị mma n''ahụ”; nke a na-emesi ọnọdụ ahụike ya ugbu a ike dịka ihe si n''ihe merela pụta.'
    reason: lexical_alternative
  - marker: b
    text: Ịdọ aka ná ntị a ekwughị kpọmkwem ma otu mmehie kpatara ọrịa ya na mbụ, ma ọ bụ ma “ihe ka njọ” ọ̀ bụ ahụhụ n'ụwa, ikpe ikpeazụ, ma ọ bụ ha abụọ.
    reason: alternative_reading
lexical_decisions:
- source_word: μετὰ ταῦτα
  choice: Mgbe ihe ndị a gasịrị
  rationale: Nke a na-edobe ọtụtụ ihe dị na ταῦτα ma na-egosikwa usoro akụkọ ahụ n'Igbo dị mma.
- source_word: εὑρίσκει
  choice: hụrụ
  rationale: Ọ bụ ezie na Grik ji historical present, oge gara aga dabara n'usoro akụkọ Igbo ma na-ebute otu ihe ahụ n'ụzọ doro anya.
- source_word: ἐν τῷ ἱερῷ
  choice: n'ụlọ nsọ
  rationale: ἱερόν na-ezo aka n'ogige na akụkụ niile nke ụlọ nsọ, ọ bụghị naanị ebe nsọ dị n'ime; “ụlọ nsọ” bụ okwu Igbo dị mkpirikpi ma bụrụkwa nke a na-aghọta nke ọma.
- source_word: Ἴδε
  choice: Lee
  rationale: “Lee” na-eme ka onye a na-agwa ṅaa ntị, n'ejighị okwu ochie ma ọ bụ nke siri ike.
- source_word: ὑγιὴς γέγονας
  choice: ahụ adịla gị mma
  rationale: Ụdị a na-egosi ma mgbanwe ahụ mere eme ma ọnọdụ ịdị mma nke ka dị ugbu a, dịka perfect γέγονας si kwusi ike.
- source_word: μηκέτι ἁμάρτανε
  choice: Emehiela ọzọ
  rationale: Nke a bụ iwu ka ọ kwụsị mmehie site ugbu a gaa n'ihu, ma ọ naghị ekpebi n'ụzọ gabigara ihe odide ahụ ma ọ bụ omume na-aga n'ihu ka Grik present imperative na-egosi.
- source_word: ἵνα μὴ
  choice: ka ... ghara
  rationale: Nke a na-egosipụta ebumnuche ma ọ bụ ihe a chọrọ izere n'Igbo eke.
- source_word: χεῖρόν σοί τι γένηται
  choice: ihe ka njọ ghara ime gị
  rationale: “Ihe ka njọ” na-ebute indefinite τι na comparative χεῖρον, ebe “ime gị” na-ebute echiche dative σοί na ngwaa γένηται n'Igbo eke.
theological_decisions:
- issue: Mmekọrịta dị n'etiti mmehie na ahụhụ n'ịdọ aka ná ntị Jizọs
  choice: E depụtara ịdọ aka ná ntị ahụ ozugbo, na-ekwughị na otu mmehie kpọmkwem kpatara ọrịa nwoke ahụ na mbụ, ma na-edobe njikọ Jizọs kwuru n'etiti mmehie ọzọ na ihe ka njọ nwere ike ime.
  alternative: A pụrụ ịkọwa ya na ọrịa mbụ ahụ bụ ntaramahụhụ kpọmkwem maka otu mmehie, ma ọ bụ na “ihe ka njọ” pụtara naanị ahụhụ n'ụwa, ma ọ bụ ikpe ikpeazụ.
  rationale: Grik akọwaghị kpọmkwem ihe kpatara ọrịa mbụ ahụ, ọ kọwaghịkwa ma “ihe ka njọ” ọ bụ ahụhụ n'oge a, ikpe ikpeazụ, ma ọ bụ ha abụọ. Ya mere, ntụgharị ahụ na-edobe nghọtahie a kama idozi ya.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “Emehiela ọzọ” bụ iwu dị nkenke ma sie ike dịka Grik, ebe “ahụ adịla gị mma” na-edobe mmetụta nke ọnọdụ e weghachiri nke ka dị ugbu a.
