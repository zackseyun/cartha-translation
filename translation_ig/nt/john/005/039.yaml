review_pass:
  verdict: revise
  source_fidelity: The main indicative rendering of Ἐραυνᾶτε is defensible, and the footnote appropriately preserves the viable imperative reading. The causal n’ihi na, ‘ndụ ebighị ebi,’ and ‘na-agba akaebe banyere m’ accurately convey the Greek. However, ἐν αὐταῖς and ἐκεῖναί are feminine plural, referring to the Scriptures. The draft changes the latter to singular ‘ọ bụkwa ya,’ obscuring the plural demonstrative and the plural participle.
  naturalness: The revision uses normal, contemporary Standard Igbo. ‘Ọ bụkwa ha na-agba akaebe banyere m’ is an idiomatic focused clause and makes the plural reference to the Scriptures clear.
  terminology: ‘Akwụkwọ Nsọ,’ ‘ndụ ebighị ebi,’ and ‘ịta/ịgba akaebe’ terminology are suitable in Standard Igbo and retain the Johannine witness motif without imposing doctrinal interpretation.
  issues:
  - severity: medium
    issue: The second clause renders the plural ἐκεῖναί with singular ‘ọ bụkwa ya,’ and ‘n’ime ya’ similarly treats αὐταῖς as singular.
    rationale: 'Although ‘Akwụkwọ Nsọ’ may function collectively in Igbo, the Greek explicitly resumes it with feminine plural forms: ‘these [Scriptures] are the ones testifying.’ Using plural ‘ha’ retains this source feature and avoids the singular statement ‘it is it that testifies.’'
  revised_text: Unu na-enyocha Akwụkwọ Nsọ, n’ihi na unu chere na unu nwere ndụ ebighị ebi n’ime ha[a]; ọ bụkwa ha na-agba akaebe banyere m.
