- from: Unu na-enyocha Akwụkwọ Nsọ, n’ihi na unu chere na unu nwere ndụ ebighị ebi n’ime ya[a]; ọ bụkwa ya na-agba akaebe banyere m.
  to: Unu na-enyocha Akwụkwọ Nsọ, n’ihi na unu chere na unu nwere ndụ ebighị ebi n’ime ha[a]; ọ bụkwa ha na-agba akaebe banyere m.
  rationale: The text is revised only to represent consistently the plural Greek pronouns αὐταῖς (‘them’) and ἐκεῖναί (‘these [ones]’), both referring to the Scriptures. The indicative/imperative ambiguity of Ἐραυνᾶτε remains preserved by the existing footnote.
  reviewer_model: gpt-5.6-terra
