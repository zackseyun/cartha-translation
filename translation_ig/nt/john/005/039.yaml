  text: Ἐραυνᾶτε τὰς γραφάς, ὅτι ὑμεῖς δοκεῖτε ἐν αὐταῖς ζωὴν αἰώνιον ἔχειν· καὶ ἐκεῖναί εἰσιν αἱ μαρτυροῦσαι περὶ ἐμοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/john/005/039.yaml
  text: You search the Scriptures because you think that in them you have eternal life[a]; and these are the ones that testify about me.
translation:
  language: ig
  text: Unu na-enyocha Akwụkwọ Nsọ, n’ihi na unu chere na unu nwere ndụ ebighị ebi n’ime ha[a]; ọ bụkwa ha na-agba akaebe banyere m.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Nyochaanụ Akwụkwọ Nsọ,” ma ọ bụrụ na ewere Ἐραυνᾶτε dị ka iwu kama ịbụ nkwupụta.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐραυνᾶτε
  choice: Unu na-enyocha
  rationale: Ụdị Grik a nwere ike ịbụ nkwupụta (‘unu na-enyocha’) ma ọ bụ iwu (‘nyochaanụ’). Ihe gbara amaokwu ahụ gburugburu na-akwado nkwupụta banyere omume ha ugbu a; e debere nghọta nke iwu n’ala peeji.
- source_word: τὰς γραφάς
  choice: Akwụkwọ Nsọ
  rationale: N’Oziọma Jọn, okwu a na-ezo aka n’ihe odide nsọ nke Izrel; ‘Akwụkwọ Nsọ’ bụ okwu Igbo doro anya ma bụrụkwa nke a na-eji eme ihe.
- source_word: ὅτι
  choice: n’ihi na
  rationale: A ghọtara ὅτι dị ka ihe na-egosi ihe kpatara ha ji enyocha Akwụkwọ Nsọ.
- source_word: δοκεῖτε
  choice: unu chere
  rationale: Nke a na-egosi nkwenye ma ọ bụ echiche ha, ma na-edobe ntakịrị ụda nkatọ dị n’okwu ahụ.
- source_word: ἐν αὐταῖς
  choice: n’ime ya
  rationale: A sụgharịrị ἐν n’ụzọ kwụ ọtọ dị ka ‘n’ime’; nnọchiaha otu a kwekọrọ n’otú Igbo si ewere ‘Akwụkwọ Nsọ’ dị ka otu mkpokọta.
- source_word: ζωὴν αἰώνιον
  choice: ndụ ebighị ebi
  rationale: Nke a bụ okwu Igbo a na-ahụkarị ma doo anya maka okwu Jọn banyere ndụ nke na-adịru mgbe ebighị ebi.
- source_word: ἐκεῖναί
  choice: ọ bụkwa ya
  rationale: Ọ na-alaghachi n’Akwụkwọ Nsọ ma na-enye ya nkwusi ike; usoro Igbo a bụ nke eke ma na-edobe nkwusi ike ahụ.
- source_word: αἱ μαρτυροῦσαι
  choice: na-agba akaebe
  rationale: ‘Ịgba akaebe’ na-edobe echiche nke onye àmà, nke dị mkpa n’Oziọma Jọn, ma bụrụ okwu Igbo a na-aghọta nke ọma.
- source_word: περὶ ἐμοῦ
  choice: banyere m
  rationale: Nke a na-enye ihe περί na genitive pụtara n’ụzọ dị mfe ma bụrụ nke eke n’Igbo.
theological_decisions:
- issue: 'Ụdị Ἐραυνᾶτε: nkwupụta ka ọ bụ iwu'
  choice: 'Nkwupụta: ‘Unu na-enyocha Akwụkwọ Nsọ’'
  alternative: 'Iwu: ‘Nyochaanụ Akwụkwọ Nsọ’'
  rationale: Ụdị Grik ahụ nwere ike ịpụta nke ọ bụla. Ihe na-esote na-egosi na Jizọs na-akọwa omume ndị na-ege ya ntị ma na-ekpughe na ha anaghị abịakwute onye Akwụkwọ Nsọ na-agba akaebe banyere ya. E debere nghọta nke iwu n’ala peeji ka a ghara ihichapụ mgbagwoju anya dị n’asụsụ mbụ.
translation_notes:
  register: Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta. E ji ‘unu’ kwupụta onye nke abụọ n’ụbara. A họọrọ usoro ahịrịokwu eke n’Igbo, ebe a na-edobe mgbagwoju anya nke ụdị ngwaa Grik n’ala peeji.
