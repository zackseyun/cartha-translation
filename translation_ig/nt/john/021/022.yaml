  text: λέγει αὐτῷ ὁ Ἰησοῦς· Ἐὰν αὐτὸν θέλω μένειν ἕως ἔρχομαι, τί πρὸς σέ; σύ ⸂μοι ἀκολούθει⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/022.yaml
  text: Jesus said to him[a], “If I want him to remain until I come[b], what is that to you? You follow me.”
translation:
  language: ig
  text: Jizọs sịrị ya, “Ọ bụrụ na m chọrọ ka ọ nọrọ ruo mgbe m ga-abịa,[a] gịnị ka nke ahụ gbasara gị? Gị onwe gị, soro m.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: E kpachaara anya hapụ “ruo mgbe m ga-abịa” emeghe; ụfọdụ na-ewere ya dịka ọbịbịa Jizọs n’otu ihe mere n’akụkọ ihe mere eme, ebe ndị ọzọ na-ewere ya dịka ọbịbịa ikpeazụ ya.
    reason: alternative_reading
lexical_decisions:
- source_word: λέγει αὐτῷ ὁ Ἰησοῦς
  choice: Jizọs sịrị ya
  rationale: A sụgharịrị historical present λέγει n’ụdị oge gara aga dịka Igbo akụkọ si adịkarị, ebe αὐτῷ bụ ‘ya.’
- source_word: Ἐὰν
  choice: Ọ bụrụ na
  rationale: Nke a na-egosi ọnọdụ a na-atụ aro ma na-echekwa ike conditional nke okwu Grik ahụ.
- source_word: θέλω
  choice: m chọrọ
  rationale: θέλω nwere ike igosi ọchịchọ ma ọ bụ uche mmadụ; ‘m chọrọ’ bụ okwu Igbo doro anya nke na-adịghị eme ka ihe ahụ bụrụ iwu e kpebiri ekpebi.
- source_word: μένειν
  choice: ka ọ nọrọ
  rationale: ‘Nọrọ’ na-echekwa echiche nke ịnọgide ma ọ bụ ịnọ, na-akọwaghị ya kpọmkwem dị ka ‘ịdị ndụ ruo mgbe ahụ.’
- source_word: ἕως ἔρχομαι
  choice: ruo mgbe m ga-abịa
  rationale: Nsụgharị a bụ nke e ji eme ihe n’Igbo ma hapụ ụdị ọbịbịa ahụ ka ọ ghara ịkọwa karịa ihe ederede kwuru.
- source_word: τί πρὸς σέ;
  choice: gịnị ka nke ahụ gbasara gị?
  rationale: Nke a na-egosipụta ajụjụ siri ike nke na-agwa Pita ka ọ ghara ilekwasị anya n’ihe ga-eme onye ọzọ.
- source_word: σύ μοι ἀκολούθει
  choice: Gị onwe gị, soro m
  rationale: ‘Gị onwe gị’ na-echekwa nkwusiri ike dị na σύ na ọdịiche dị n’etiti ‘ya’ na ‘gị’; ‘soro m’ bụ iwu eke na Igbo.
theological_decisions:
- issue: Ihe ‘ruo mgbe m ga-abịa’ pụtara
  choice: E hapụrụ ya n’ozuzu ya dịka ‘ruo mgbe m ga-abịa.’
  alternative: A pụrụ ịghọta ya dịka ọbịbịa Jizọs n’otu ihe mere n’akụkọ ihe mere eme, ma ọ bụ ọbịbịa ikpeazụ ya.
  rationale: Amaokwu ahụ akọwaghị ụdị ọbịbịa ahụ; ya mere nsụgharị ahụ anaghị ekpebi okwu nkà mmụta okpukpe nke ederede hapụrụ emeghe.
- issue: Ike nke θέλω
  choice: m chọrọ
  alternative: ọ bụrụ na ọ bụ uche m / ọ bụrụ na m kpebie
  rationale: ‘M chọrọ’ na-egosipụta ọchịchọ ma ọ bụ uche Jizọs n’enweghị ịtụgharị okwu ahụ ka ọ bụrụ mkpebi a na-apụghị ịgbanwe agbanwe.
translation_notes:
  register: Standard Igbo dị ugbu a, dị nsọ ma dị mfe nghọta. E ji ‘Gị onwe gị’ mee ka nkwusiri ike nke σύ pụta ìhè. Akara ntụaka [a] dị n’isiokwu ahụ ozugbo e kwuchara ahịrịokwu o metụtara.
