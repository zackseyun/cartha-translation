  register: E ji Standard Igbo nke oge a, dị mfe ma nwee nsọpụrụ, dee amaokwu ahụ. E debere nkwusi ike nke καὶ ἡμεῖς site n’okwu ‘Anyị onwe anyị,’ ma zere okwu ụka pụrụ iche ma ọ bụ nkọwa okpukpe a gbakwụnyere.
