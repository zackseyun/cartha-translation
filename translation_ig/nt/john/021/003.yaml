source:
  edition: SBLGNT
  text: λέγει αὐτοῖς Σίμων Πέτρος· Ὑπάγω ἁλιεύειν· λέγουσιν αὐτῷ· Ἐρχόμεθα καὶ ἡμεῖς σὺν σοί. ἐξῆλθον καὶ ἐνέβησαν εἰς τὸ ⸀πλοῖον, καὶ ἐν ἐκείνῃ τῇ νυκτὶ ἐπίασαν οὐδέν.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/003.yaml
  text: Simon Peter said to them[a], “I am going to fish.” They said to him, “We are also coming with you.” They went out and got into the boat, and that night they caught nothing.
translation:
  language: ig
  text: Saịmọn Pita sịrị ha[a], “Aga m ịkụ azụ.” Ha sịrị ya, “Anyị kwa ga-eso gị.” Ha wee pụọ banye n’ụgbọ ahụ, ma n’abalị ahụ ha ejideghị ihe ọ bụla.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'N’asụsụ Grik, e ji oge ugbu a nke akụkọ kwuo ya: “Saịmọn Pita na-asị ha ... ha na-asị ya.” Nke a bụ otu ụzọ a na-ejikarị akọ akụkọ n’asụsụ Grik, ma a na-atụgharịkarị ya n’Igbo n’oge gara aga.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει αὐτοῖς
  choice: sịrị ha
  rationale: A tụgharịrị historical present Grik ka ọ bụrụ oge gara aga, nke dabara n’ụzọ Igbo si akọ akụkọ, ebe nkọwa ala na-egosi ọdịdị okwu Grik.
- source_word: Ὑπάγω ἁλιεύειν
  choice: Ana m aga igbu azụ
  rationale: Nke a na-egosi ma ije Pita na ebumnuche ya n’Igbo a na-asụkarị, n’etinyeghị nkọwa ọzọ na-adịghị n’isi mmalite.
- source_word: Ἐρχόμεθα καὶ ἡμεῖς σὺν σοί
  choice: Anyị onwe anyị ga-esokwa gị
  rationale: ‘Anyị onwe anyị’ na-echekwa nkwusi ike dị na καὶ ἡμεῖς, ebe ‘ga-esokwa gị’ na-egosi na ha kpebiri iso Pita.
- source_word: ἐξῆλθον
  choice: Ha wee pụọ
  rationale: ‘Pụọ’ na-echekwa echiche nke ịpụ, ebe ‘wee’ na-eme ka usoro akụkọ ahụ gaa were were n’Igbo.
- source_word: ἐνέβησαν εἰς τὸ πλοῖον
  choice: banye n’ụgbọ ahụ
  rationale: Nke a bụ ụzọ Igbo doro anya si kwuo ịbanye n’ụgbọ mmiri; ‘ụgbọ ahụ’ na-echekwa article nke Grik n’enweghị ime ka ụgbọ ahụ bụrụ nnukwu ship.
- source_word: ἐν ἐκείνῃ τῇ νυκτί
  choice: n’abalị ahụ
  rationale: Nke a bụ ntụgharị oge dị mfe ma bụrụ nke e ji eme ihe n’Igbo.
- source_word: ἐπίασαν οὐδέν
  choice: ha ejideghị ihe ọ bụla
  rationale: N’ọnọdụ ịkụ azụ, ‘jide’ na-egosi catch, ebe ‘ihe ọ bụla’ na-echekwa na ha enwetaghị azụ ọbụla ma ọ bụ ihe ọbụla.
