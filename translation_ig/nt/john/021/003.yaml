review_pass:
  verdict: revise
  source_fidelity: The draft accurately follows the narrative sequence, the historical-present note, the definite boat, and the total lack of a catch. However, “igbu azụ” literally means “to kill fish” and is not the standard idiom for fishing; Greek ἁλιεύειν requires “ịkụ azụ.” The emphatic καὶ ἡμεῖς means “we too/also,” not reflexive “we ourselves.”
  naturalness: 'The revised wording uses idiomatic modern Standard Igbo: “aga m ịkụ azụ” for going fishing and “Anyị kwa ga-eso gị” for joining Peter. Removing “ma” avoids introducing an unwarranted adversative contrast before the final clause.'
  terminology: “Ịkụ azụ” is the standard fishing expression. “Anyị kwa” preserves the additive emphasis of καὶ ἡμεῖς without overstating it. “Ha ejideghị ihe ọ bụla” remains a natural contextual rendering of “they caught nothing.”
  issues:
  - severity: medium
    issue: “Ana m aga igbu azụ” uses “igbu azụ.”
    rationale: In Standard Igbo, “igbu azụ” means killing fish. For fishing, the normal idiom is “ịkụ azụ.”
  - severity: medium
    issue: “Anyị onwe anyị” renders καὶ ἡμεῖς.
    rationale: The Greek is additive and mildly emphatic (“we too/also”), whereas “anyị onwe anyị” is reflexive/intensifying (“we ourselves”) and changes the nuance.
  - severity: low
    issue: “ma n’abalị ahụ” adds an adversative connective.
    rationale: The Greek simply continues the narrative with “and in that night”; no explicit contrast needs to be represented.
  revised_text: Saịmọn Pita sịrị ha[a], “Aga m ịkụ azụ.” Ha sịrị ya, “Anyị kwa ga-eso gị.” Ha wee pụọ banye n’ụgbọ ahụ, ma n’abalị ahụ ha ejideghị ihe ọ bụla.
  revised_footnotes:
  - marker: a
    text: 'N’asụsụ Grik, e ji oge ugbu a nke akụkọ kwuo ya: “Saịmọn Pita na-asị ha ... ha na-asị ya.” Nke a bụ otu ụzọ a na-ejikarị akọ akụkọ n’asụsụ Grik, ma a na-atụgharịkarị ya n’Igbo n’oge gara aga.'
    reason: lexical_alternative
  revision_rationale: The revision corrects the fishing idiom and preserves the additive force of the disciples’ response. The historical-present footnote remains accurate. The final “ma” is retained only as an ordinary narrative linker before “n’abalị ahụ,” not as a strong contrast; the sentence otherwise retains the source’s sequence and sense.
