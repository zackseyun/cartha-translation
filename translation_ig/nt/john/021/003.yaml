revisions:
- from: Saịmọn Pita sịrị ha[a], “Ana m aga igbu azụ.” Ha sịrị ya, “Anyị onwe anyị ga-esokwa gị.” Ha wee pụọ, banye n’ụgbọ ahụ; ma n’abalị ahụ, ha ejideghị ihe ọ bụla.
  to: Saịmọn Pita sịrị ha[a], “Aga m ịkụ azụ.” Ha sịrị ya, “Anyị kwa ga-eso gị.” Ha wee pụọ banye n’ụgbọ ahụ, ma n’abalị ahụ ha ejideghị ihe ọ bụla.
  rationale: The revision corrects the fishing idiom and preserves the additive force of the disciples’ response. The historical-present footnote remains accurate. The final “ma” is retained only as an ordinary narrative linker before “n’abalị ahụ,” not as a strong contrast; the sentence otherwise retains the source’s sequence and sense.
