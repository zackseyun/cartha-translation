  variant: Standard Igbo
source:
  edition: SBLGNT
  text: λέγει οὖν αὐτοῖς ⸀ὁ Ἰησοῦς· Παιδία, μή τι προσφάγιον ἔχετε; ἀπεκρίθησαν αὐτῷ· Οὔ.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/005.yaml
  text: So Jesus said to them[a], “Children, you do not have any fish, do you?” They answered him, “No.”
translation:
  language: ig
  text: Mgbe ahụ, Jizọs sịrị ha, “Ụmụntakịrị, unu enweghị azụ ọ bụla[a], ọ̀ bụghị ya?” Ha zara ya, “Mba.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ihe ọ bụla a ga-eri.” Okwu Grik ahụ bụ προσφάγιον, nke na-ekwu kpọmkwem banyere nri a na-eri tinyere achịcha; n’ọnọdụ a, ebe ha na-akụ azụ, o yikarịrị ka ọ na-ekwu maka azụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Ya mere
  rationale: Ọ na-ejikọta ajụjụ Jizọs na ihe akụkọ ahụ kwuru tupu ya, n'ụzọ doro anya ma bụrụkwa Igbo nkịtị.
- source_word: Παιδία
  choice: Ụmụntakịrị
  rationale: Ọ bụ okwu ịkpọ ọtụtụ mmadụ nke na-egosi mmekọrịta ịhụnanya; nsụgharị a na-edobe ọdịdị okwu ahụ n'agbanyeghị na ndị a ọ na-agwa bụ ndị na-eso ụzọ ya toro eto.
- source_word: μή τι
  choice: unu enweghị ... ka unu nwere?
  rationale: Ụdị ajụjụ a na-egosi na onye na-ajụ ya na-atụ anya azịza na-adịghị mma, dịka μή si arụ ọrụ n'okwu Grik.
- source_word: προσφάγιον
  choice: azụ ọ bụla
  rationale: Okwu ahụ pụtara nri a na-eri tinyere achịcha, ma n'ọnọdụ ndị ọkụ azụ a, o yikarịrị ka ọ na-ekwu maka azụ; ihe ọzọ nwere ike ịpụta ka edere n'ala peeji.
- source_word: ἔχετε
  choice: unu ... nwere
  rationale: A sụgharịrị ya dịka inwe ihe n'usoro ajụjụ Igbo dị mma.
- source_word: ἀπεκρίθησαν αὐτῷ
  choice: Ha zara ya
  rationale: Nke a bụ ụzọ Igbo dị nkenke ma kwekọọ n'ụdị akụkọ e si kwuo azịza ha.
- source_word: Οὔ
  choice: Mba
  rationale: Ọ na-edobe azịza Grik ahụ dị mkpirikpi ma doo anya.
theological_decisions: []
