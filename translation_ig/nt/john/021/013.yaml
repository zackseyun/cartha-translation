id: JHN.21.13
reference: John 21:13
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸀ἔρχεται ⸀ὁ Ἰησοῦς καὶ λαμβάνει τὸν ἄρτον καὶ δίδωσιν αὐτοῖς, καὶ τὸ ὀψάριον ὁμοίως.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/013.yaml
  text: Jesus comes and takes the bread and gives it to them[b][a], and the fish likewise.
translation:
  language: ig
  text: Jizọs abịa, were achịcha ahụ nye ha, nyekwa ha azụ ahụ otu ahụ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịtụgharị ya sị, ‘Jizọs bịara, were achịcha ahụ nye ha, nyekwa ha azụ ahụ otu ahụ.’ Grik ji ngwaa oge ugbu a akọ ihe mere n’oge gara aga.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχεται
  choice: abịa
  rationale: A na-edobe ngwaa n’oge ugbu a dị ka historical present iji gosipụta ụdị akụkọ Jọn, kama ịgbanwe ya ozugbo gaa n’oge gara aga.
- source_word: λαμβάνει
  choice: were
  rationale: N’ọnọdụ a, ọ pụtara iwere achịcha ahụ tupu inye ya ndị na-eso ụzọ; okwu a adịghị etinye nkọwa ọzọ dịka ‘ije ozi nri.’
- source_word: τὸν ἄρτον
  choice: achịcha ahụ
  rationale: ‘Ahụ’ na-anọchi artikel Grik ma na-ezo aka n’achịcha a kpọtụrụ aha n’ebe ahụ.
- source_word: δίδωσιν αὐτοῖς
  choice: nye ha
  rationale: Igbo anaghị achọ ka a tinye nnọchiaha ihe n’etiti ebe ihe e nyere pụtara ìhè site na ‘achịcha ahụ.’
- source_word: τὸ ὀψάριον
  choice: azụ ahụ
  rationale: N’ọnọdụ Jọn a, okwu ahụ bụ azụ e ji eri nri; ‘azụ ahụ’ doro anya ma ghara ịgbakwunye na e siri ya esi.
- source_word: ὁμοίως
  choice: otu ahụ
  rationale: Ọ na-egosi na Jizọs mere azụ ahụ ihe ahụ o mere achịcha ahụ, ma na-edobe nkenke nke ahịrịokwu Grik.
theological_decisions:
- issue: Ngwaa oge ugbu a n’akụkọ banyere ngosipụta Jizọs mgbe o bilitesịrị n’ọnwụ
  choice: 'Idobe historical present: ‘abịa, were ... nye’'
  alternative: 'Iji oge gara aga: ‘bịara, were ... nye’'
  rationale: Nke a na-edobe ọdịdị akụkọ Grik n’enweghị ịgbanwe ihe ọ pụtara ma ọ bụ itinye nkọwa ozizi.
translation_notes:
  register: Standard Igbo dị ugbu a, dị mfe ma dị ùgwù. E jiri ‘meekwa azụ ahụ otu ahụ’ mee ka ngwaa a hapụrụ n’ahịrị ikpeazụ nke Grik pụta nke ọma n’Igbo, n’enweghị ịgbakwunye nkọwa.
