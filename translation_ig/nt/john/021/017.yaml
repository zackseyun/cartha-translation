review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the third question, Peter’s grief, his confession that Jesus knows all things, and the command to feed the sheep. However, the opening ‘Ọ gwara ya nke ugboro atọ’ is not the most natural or precise Igbo rendering of a question being posed for the third time. ‘Ọ jụrụ ya nke ugboro atọ’ directly expresses the action in context and preserves the repeated-question motif.
  naturalness: Most of the verse is clear, dignified Standard Igbo. ‘Ọ jụrụ ya nke ugboro atọ’ is more idiomatic than ‘Ọ gwara ya nke ugboro atọ.’ The footnote marker for the two Greek verbs meaning ‘know’ should be placed in Peter’s reply, where those verbs occur, rather than after Jesus’ final statement.
  terminology: ‘Ịhụ n’anya,’ ‘atụrụ,’ and ‘nye ... nri’ are appropriate and preserve the lexical sense of φιλέω, πρόβατα, and βόσκε. ‘Onyenwe anyị’ is retained as a reverent conventional address for Κύριε, without expanding the main text doctrinally.
  issues:
  - severity: medium
    issue: The initial rendering ‘Ọ gwara ya nke ugboro atọ’ is awkward for a repeated question.
    rationale: Although λέγει can be rendered broadly as ‘said,’ the immediately following direct question makes ‘Ọ jụrụ ya nke ugboro atọ’ the natural Igbo expression and clearly communicates the narrative action.
  - severity: low
    issue: Footnote b is anchored after Jesus’ final speech rather than at Peter’s two uses of ‘know.’
    rationale: The note concerns οἶδας and γινώσκεις in Peter’s reply. Moving the marker to that clause gives readers an accurate anchor without changing meaning.
