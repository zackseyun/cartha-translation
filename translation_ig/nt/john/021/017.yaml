id: JHN.21.17
reference: John 21:17
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: λέγει αὐτῷ τὸ τρίτον· Σίμων ⸀Ἰωάννου, φιλεῖς με; ἐλυπήθη ὁ Πέτρος ὅτι εἶπεν αὐτῷ τὸ τρίτον· Φιλεῖς με; καὶ ⸀εἶπεν αὐτῷ· Κύριε, ⸂πάντα σὺ⸃ οἶδας, σὺ γινώσκεις ὅτι φιλῶ σε. λέγει αὐτῷ ⸀ὁ Ἰησοῦς· Βόσκε τὰ ⸀πρόβατά μου.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/017.yaml
  text: He said to him the third time[a], “Simon, son of John, do you love me?” Peter was grieved because he said to him the third time, “Do you love me?” And he said to him, “Lord, you know all things; you know that I love you.” Jesus said to him[b], “Feed my sheep.”
translation:
  language: ig
  text: Ọ jụrụ ya nke ugboro atọ[a], “Saịmọn, nwa Jọn, ị̀ hụrụ m n’anya?” O wutere Pita n’obi n’ihi na ọ jụrụ ya nke ugboro atọ, “Ị̀ hụrụ m n’anya?” Ọ sịrị ya, “Onyenwe anyị, ị maara ihe niile; ị makwa na m hụrụ gị n’anya.”[b] Jizọs gwara ya, “Nye atụrụ m nri.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’ebe a, Grik ji φιλέω (“ịhụ n’anya; inwe mmetụta ịhụnanya”), ebe n’ajụjụ abụọ mbụ Jizọs ji ἀγαπάω. Ụfọdụ na-ahụ ọdịiche dị mkpa n’etiti ha; ndị ọzọ na-ewere ha dị ka okwu ihe ha pụtara na-agafe ibe ha n’ebe a. Ya mere, ntụgharị a ji “ịhụ n’anya” mee ha, ka ọ ghara ịmanye ọdịiche siri ike karịa nke Grik gosiri nke ọma.
    reason: lexical_alternative
  - marker: b
    text: 'N’azịza Pita, Grik ji ngwaa abụọ pụtara “ịma”: οἶδα na γινώσκω. N’Igbo, “ịma” bụ ntụgharị sitere n’okike maka ha abụọ n’ebe a. Nkwughachi ahụ nwere ike inwe obere ọdịiche echiche, ma ịmanye okwu abụọ dị iche ga-abụ ịkọwa karịa ihe ederede kwuru.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ τρίτον
  choice: nke ugboro atọ
  rationale: Nke a bụ ụzọ Igbo dị mfe ma doo anya isi kwuo na ihe ahụ mere nke ugboro atọ, ma na-echekwa isiokwu nke ajụjụ ahụ e jụrụ ugboro ugboro.
- source_word: Σίμων Ἰωάννου
  choice: Saịmọn, nwa Jọn
  rationale: Genitive Ἰωάννου bụ aha nna; “nwa Jọn” na-egosipụta ya n’ụzọ Igbo sitere n’okike, n’enweghị ịgbaso ọdịnala “nwa Jona” nke na-esite n’ọgụgụ ọzọ.
- source_word: φιλεῖς / φιλῶ
  choice: ị̀ hụrụ m n’anya / m hụrụ gị n’anya
  rationale: “Ịhụ n’anya” na-echekwa ịdị arọ nke mmekọrịta ahụ ma ghara ịmanye ọdịiche siri ike n’etiti φιλέω na ἀγαπάω nke asụsụ Grik n’ebe a na-emeghị ka o doo anya nke ọma.
- source_word: ἐλυπήθη
  choice: O wutere Pita n’obi
  rationale: Nkebiokwu a na-egosipụta mwute na ihe mgbu Pita nwere n’ime obi, ma bụrụ Igbo nke oge a dị ndụ ma dị ùgwù.
- source_word: Κύριε
  choice: Onyenwe anyị
  rationale: N’ọnọdụ a, Pita na-agwa Jizọs ahụ bilitere okwu; “Onyenwe anyị” na-enye κύριε ịdị arọ karịrị nanị okwu nkwanye ùgwù.
- source_word: πάντα σὺ οἶδας
  choice: ị maara ihe niile
  rationale: Ọ na-echekwa oke okwu πάντα n’enweghị ịgbakwunye nkọwa ozizi n’ime ederede.
- source_word: οἶδας ... γινώσκεις
  choice: ị maara ... ị makwa
  rationale: Igbo na-ejikarị “ịma” sụgharịa ngwaa abụọ a n’ebe a. “-kwa” na-echekwa nkwughachi na njikọ nke okwu Pita n’enweghị ịmepụta ọdịiche a na-ejighị n’aka.
- source_word: Βόσκε
  choice: Nye ... nri
  rationale: βόσκω pụtara inye nri ma ọ bụ ime ka anụ rie; “nye atụrụ m nri” na-echekwa nkọwa ahụ ma dị mfe nghọta karịa okwu nwere ike ịpụta ilekọta n’ozuzu ya.
- source_word: πρόβατά
  choice: atụrụ
  rationale: πρόβατα bụ atụrụ, ọ bụghị ụmụ atụrụ kpọmkwem; nhọrọ a na-echekwa ọdịiche ya na ἀρνία dị n’amaokwu 15.
theological_decisions:
- issue: Ma a ga-egosi ọdịiche siri ike n’etiti φιλέω na ἀγαπάω n’ajụjụ Jizọs na azịza Pita
  choice: Jiri “ịhụ n’anya” mee ha n’ederede bụ isi, ma kọwaa mgbanwe ngwaa ahụ n’okpuru peeji.
  alternative: Jiri okwu Igbo abụọ dị iche, dịka “ịhụ n’anya” na “inwe mmasị n’ebe mmadụ nọ,” iji mee ka ọdịiche ahụ pụta ìhè.
  rationale: N’Asụsụ Grik Koine, mkpụrụokwu abụọ ahụ nwere ike ịgafe ibe ha n’ihe ha pụtara, ọdịiche ha n’ebe a adịghịkwa nke doro anya nke ga-eme ka ntụgharị kpebie esemokwu nkọwa ahụ.
- issue: Ike nkwupụta Pita, πάντα σὺ οἶδας
  choice: “ị maara ihe niile”
  alternative: Mee ka ọ dị nro dịka “ị maara ihe niile banyere nke a,” ma ọ bụ gbasaa ya ka ọ bụrụ nkọwa ozizi banyere ịma ihe niile.
  rationale: Asụsụ Grik kwuru “ihe niile” n’enweghị mmachi. A ga-echekwa ike okwu ahụ ma ghara itinye nkọwa ozizi ọzọ n’ọnụ Pita.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe ma dị ùgwù. “O wutere Pita n’obi” na-enye mmetụta ἐλυπήθη n’Igbo sitere n’okike; “Nye atụrụ m nri” na-edobe nkọwa kpọmkwem nke βόσκω. Akara ụda dị mkpa n’ajụjụ “ị̀” ka etinyere iji mee ka ọgụgụ doo anya.
