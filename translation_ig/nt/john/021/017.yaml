  to: Ọ jụrụ ya nke ugboro atọ[a], “Saịmọn, nwa Jọn, ị̀ hụrụ m n’anya?” O wutere Pita n’obi n’ihi na ọ jụrụ ya nke ugboro atọ, “Ị̀ hụrụ m n’anya?” Ọ sịrị ya, “Onyenwe anyị, ị maara ihe niile; ị makwa na m hụrụ gị n’anya.”[b] Jizọs gwara ya, “Nye atụrụ m nri.”
