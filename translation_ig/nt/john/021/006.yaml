review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the command to cast the net on the boat’s right side and the ensuing inability to pull it because of the multitude of fish. However, “dị n’ime ya” (“in it”) adds a locative detail not stated in the Greek, and “ma” after the semicolon can sound unnecessarily adversative for the Greek’s simple συνέχεια (“and”).
  naturalness: 'The revision uses standard, idiomatic Igbo: “ụgbọ mmiri” is clearer than the unqualified “ụgbọ” in this setting, and “ịdọpụta” naturally expresses hauling/pulling a net. The sentence flow is also smoother without the semicolon and added locative phrase.'
  terminology: “Ụgbụ,” “aka nri,” “ụgbọ mmiri,” and “azụ” are appropriate standard Igbo terms. The supplied object “azụ” remains properly qualified by a footnote, since εὑρήσετε has no expressed object.
  issues:
  - severity: medium
    issue: The phrase “dị n’ime ya” adds information absent from the Greek.
    rationale: ἀπὸ τοῦ πλήθους τῶν ἰχθύων means “because of/from the multitude of fish”; it does not explicitly say that the fish were “in it” (the net). The context supports the inference, but optimal-equivalence translation should not make it part of the main text.
  - severity: low
    issue: “Ụgbọ” by itself is potentially broad in modern Igbo.
    rationale: “Ụgbọ mmiri” more clearly identifies the πλοῖον as a watercraft while retaining the ordinary, nontechnical sense of “boat.”
  - severity: low
    issue: The connective “ma” is better placed as a normal clause coordinator rather than following a semicolon.
    rationale: Greek has καί, not a strongly adversative conjunction. Igbo “ma” can connect these clauses naturally, but the semicolon makes the contrast more marked than needed.
  revised_text: Ma ọ sịrị ha, “Tụọnụ ụgbụ ahụ n’akụkụ aka nri nke ụgbọ mmiri ahụ, unu ga-ahụkwa azụ[a].” Ya mere, ha tụbara ya, ma n’ihi ọtụtụ azụ, ha enweghịzi ike ịdọpụta ya.
  revised_footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya naanị, “unu ga-ahụkwa”; Grik ekwughị “azụ” kpọmkwem, kama ọnọdụ ịkụ azụ na-eme ka a ghọta ya.
    reason: lexical_alternative
  revision_rationale: The revision removes the unstated phrase “dị n’ime ya,” clarifies πλοῖον as “ụgbọ mmiri,” and uses a more natural, source-faithful clause connection. It preserves the contextual supply of “azụ” and retains the footnote that transparently notes the Greek ambiguity.
