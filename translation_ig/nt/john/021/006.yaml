  register: Asụsụ Igbo ọkọlọtọ, nke ugbu a, dị ùgwù ma dị mfe nghọta. E ji usoro okwu eke zere nsụgharị siri ike nke na-esochi Grik mkpụrụokwu n’ụzọ na-adịghị ada ụtọ n’Igbo.
