  text: ὁ δὲ εἶπεν αὐτοῖς· Βάλετε εἰς τὰ δεξιὰ μέρη τοῦ πλοίου τὸ δίκτυον, καὶ εὑρήσετε. ἔβαλον οὖν, καὶ οὐκέτι αὐτὸ ἑλκύσαι ⸀ἴσχυον ἀπὸ τοῦ πλήθους τῶν ἰχθύων.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/006.yaml
  text: But he said to them[a], “Cast the net on the right side of the boat, and you will find some.” So they cast it, and they were no longer able to haul it in because of the multitude of fish.
translation:
  language: ig
  text: Ma ọ sịrị ha, “Tụọnụ ụgbụ ahụ n’akụkụ aka nri nke ụgbọ mmiri ahụ, unu ga-ahụkwa azụ[a].” Ya mere, ha tụbara ya, ma n’ihi ọtụtụ azụ, ha enweghịzi ike ịdọpụta ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya naanị, “unu ga-ahụkwa”; Grik ekwughị “azụ” kpọmkwem, kama ọnọdụ ịkụ azụ na-eme ka a ghọta ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: Βάλετε
  choice: Tụọnụ
  rationale: Iwu a pụtara ịtụ ụgbụ n’ime mmiri; ‘Tụọnụ’ bụ okwu Igbo dị mfe ma kwekọọ n’ọrụ ịkụ azụ.
- source_word: τὰ δεξιὰ μέρη τοῦ πλοίου
  choice: n’akụkụ aka nri nke ụgbọ ahụ
  rationale: Nke a na-enye ntụziaka ebe a ga-atụ ụgbụ ahụ n’enweghị iji okwu ndị ọrụ ụgbọ mmiri pụrụ iche.
- source_word: πλοίου
  choice: ụgbọ
  rationale: N’ọnọdụ ịkụ azụ n’Oké Osimiri Galili, ‘ụgbọ’ bụ okwu nkịtị na nke dabara adaba.
- source_word: τὸ δίκτυον
  choice: ụgbụ ahụ
  rationale: Nke a bụ okwu Igbo nkịtị maka ụgbụ e ji akụ azụ; ihe ngosi ‘ahụ’ na-egosi ụgbụ a kpọtụrụla aha n’akụkọ ahụ.
- source_word: εὑρήσετε
  choice: unu ga-ahụkwa azụ
  rationale: Grik ekwughị ihe a ga-ahụ kpọmkwem, ma ọnọdụ ịkụ azụ na-eme ka o doo anya na ọ bụ azụ; e tinyere ‘azụ’ ka Igbo bụrụ nke eke, ma e debere ihe a n’akwụkwọ nkọwa.
- source_word: οὐκέτι
  choice: ha enwekwaghị ike
  rationale: '‘Enwekwaghị’ na-egosi mgbanwe ọnọdụ nke οὐκέτι: mgbe azụ banyere, ha enweghịzi ike ime ya.'
- source_word: ἑλκύσαι
  choice: ịdọlite ya
  rationale: Ọ na-egosi ịdọrọ ụgbụ ahụ elu ma ọ bụ n’ime ụgbọ; ‘ịdọlite’ bụ okwu doro anya n’ọnọdụ a.
- source_word: ἴσχυον
  choice: ha enwekwaghị ike
  rationale: A sụgharịrị echiche nke ike ma ọ bụ ikike ime ihe n’ụzọ Igbo dị mma, kama ịsụgharị ya dịka ‘ha adịghị ike.’
- source_word: ἀπὸ τοῦ πλήθους τῶν ἰχθύων
  choice: n’ihi ọtụtụ azụ dị n’ime ya
  rationale: ‘N’ihi’ na-egosipụta ihe kpatara na Grik, ebe ‘ọtụtụ azụ’ na-ebute echiche πλήθος n’asụsụ Igbo nkịtị; ‘dị n’ime ya’ na-eme ka njikọ ya na ụgbụ ahụ doo anya.
- source_word: ἰχθύων
  choice: azụ
  rationale: ‘Azụ’ bụ okwu Igbo nkịtị ma na-arụ ọrụ maka otu azụ na ọtụtụ azụ dịka ọnọdụ siri dị.
