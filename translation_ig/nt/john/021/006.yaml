revisions:
- from: Ma ọ sịrị ha, “Tụọnụ ụgbụ ahụ n’akụkụ aka nri nke ụgbọ ahụ, unu ga-ahụkwa azụ.[a]” Ya mere, ha tụbara ya; ma ha enwekwaghị ike ịdọlite ya n’ihi ọtụtụ azụ dị n’ime ya.
  to: Ma ọ sịrị ha, “Tụọnụ ụgbụ ahụ n’akụkụ aka nri nke ụgbọ mmiri ahụ, unu ga-ahụkwa azụ[a].” Ya mere, ha tụbara ya, ma n’ihi ọtụtụ azụ, ha enweghịzi ike ịdọpụta ya.
  rationale: The revision removes the unstated phrase “dị n’ime ya,” clarifies πλοῖον as “ụgbọ mmiri,” and uses a more natural, source-faithful clause connection. It preserves the contextual supply of “azụ” and retains the footnote that transparently notes the Greek ambiguity.
