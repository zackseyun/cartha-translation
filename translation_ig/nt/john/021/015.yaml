review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the meal, the patronymic ‘Simon, son of John,’ the question, Peter’s reply, and the command to feed Jesus’ lambs. ‘Karịa ndị a’ retains the deliberately elliptical comparison in a natural traditional Igbo form; its potentially broader referent remains appropriately documented in the footnote. The imperative ‘Na-enye ... nri,’ however, is more progressive/continuative in force than the direct imperative Βόσκε. ‘Zụọ ụmụ atụrụ m’ is the more direct and idiomatic rendering of ‘Feed my lambs.’
  naturalness: 'The narrative is fluent Standard Igbo. The interrogative pronoun at the beginning of direct speech should be capitalized and written consistently as ‘Ị̀’ (dotted i with low-tone marking): ‘Ị̀ hụrụ m n’anya ...?’'
  terminology: ‘Jizọs,’ ‘Saịmọn Pita,’ ‘Jọn,’ and ‘Onyenwe anyị’ are suitable established Christian terminology in Standard Igbo. Rendering both ἀγαπάω and φιλέω as ‘ịhụ n’anya’ in the text, with a non-dogmatic lexical footnote, is sound. ‘Ụmụ atụrụ’ correctly renders ἀρνία.
  issues:
  - severity: low
    issue: The question begins with lowercase ‘ị̀’.
    rationale: It begins a new sentence within direct speech and should be capitalized as ‘Ị̀’; this also makes the dotted-I orthography and tone marking clear.
  - severity: medium
    issue: ‘Na-enye ụmụ atụrụ m nri’ is not the most direct form for Βόσκε.
    rationale: The Greek is a present imperative commanding Peter to feed the lambs. In this context ‘Zụọ ụmụ atụrụ m’ is a natural direct Igbo imperative and avoids making the command primarily progressive/ongoing in grammatical form.
  revised_text: Mgbe ha risịrị nri ụtụtụ, Jizọs sịrị Saịmọn Pita, “Saịmọn, nwa Jọn, Ị̀ hụrụ m n’anya karịa ndị a[b]?” Ọ zara ya, “Ee, Onyenwe anyị; ị maara na m hụrụ gị n’anya.[a]” Jizọs sịrị ya, “Zụọ ụmụ atụrụ m.”
