id: JHN.21.15
reference: John 21:15
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ὅτε οὖν ἠρίστησαν λέγει τῷ Σίμωνι Πέτρῳ ὁ Ἰησοῦς· Σίμων ⸀Ἰωάννου, ἀγαπᾷς με πλέον τούτων; λέγει αὐτῷ· Ναί, κύριε, σὺ οἶδας ὅτι φιλῶ σε. λέγει αὐτῷ· Βόσκε τὰ ἀρνία μου.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/015.yaml
  text: So when they had eaten breakfast[a], Jesus said to Simon Peter, “Simon, son of John, do you love me more than these?” He said to him, “Yes, Lord; you know that I love you.” He said to him[b], “Feed my lambs.”
translation:
  language: ig
  text: Mgbe ha risịrị nri ụtụtụ, Jizọs sịrị Saịmọn Pita, “Saịmọn, nwa Jọn, Ị̀ hụrụ m n’anya karịa ndị a[b]?” Ọ zara ya, “Ee, Onyenwe anyị; ị maara na m hụrụ gị n’anya.[a]” Jizọs sịrị ya, “Zụọ ụmụ atụrụ m.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’asụsụ Grik, Jizọs ji ἀγαπάω jụọ ajụjụ ahụ, ma Pita ji φιλέω zaa ya. Ụfọdụ na-ahụ ọdịiche n’etiti ngwaa abụọ ahụ; ndị ọzọ na-ewere mgbanwe ahụ dị ka ụzọ e si agbanwe okwu. E ji ‘ịhụ n’anya’ sụgharịa ha abụọ n’ahịrị bụ́ isi ka a ghara ime ka ọdịiche ahụ sie ike karịa ka ihe gbara ya gburugburu gosiri.
    reason: lexical_alternative
  - marker: b
    text: ‘Karịa ndị a’ nwere ike ịpụta ‘karịa ka ndị a si hụ m n’anya,’ ma ọ bụ ‘karịa ka ị hụrụ ndị a n’anya’; o nwekwara ike izo aka n’ihe ndị dị ebe ahụ. Grik ekwughị akụkụ ntụnyere ahụ kpọmkwem.
    reason: alternative_reading
lexical_decisions:
- source_word: ἠρίστησαν
  choice: ha risịrị nri ụtụtụ
  rationale: ἀριστάω na-ezo aka kpọmkwem n’iri nri ụtụtụ; okwu a na-egosikwa na ha bu ụzọ rie ya tupu mkparịta ụka ahụ amalite.
- source_word: Σίμων Ἰωάννου
  choice: Saịmọn, nwa Jọn
  rationale: Genitive Ἰωάννου bụ aha nna n’ebe a, ya mere ‘nwa Jọn’ na-agbaso ihe odide Grik kpọmkwem, ọ bụghị ọdịnala ‘nwa Jona.’
- source_word: ἀγαπᾷς / φιλῶ
  choice: ị hụrụ m n’anya / m hụrụ gị n’anya
  rationale: ‘Ịhụ n’anya’ bụ okwu Igbo ebumpụta ụwa maka ngwaa abụọ a. Ịmepụta ụdị ịhụnanya abụọ n’ahịrị bụ́ isi nwere ike ime ka ọdịiche a na-arụrịta ụka yie ihe doro anya karịa ka Grik si kwuo; nkọwa ala peeji na-edebe mgbanwe okwu ahụ.
- source_word: πλέον τούτων
  choice: karịa ndị a
  rationale: Okwu Grik ahụ ahapụghị ihe e ji atụnyere ya n’ụzọ doro anya. ‘Karịa ndị a’ na-edebe ma ọ dịkarịa ala ajụjụ ma a na-atụ ịhụnanya Pita na nke ndị ọzọ, ma ọ bụ ịhụnanya ya n’ebe Jizọs nọ na ịhụnanya ya n’ebe ndị nọ ya gburugburu nọ; nkọwa ala peeji na-akọwakwa na ihe ndị dị ebe ahụ nwekwara ike ịbụ ihe e zoro aka na ya.
- source_word: κύριε
  choice: Onyenwe anyị
  rationale: N’ọnọdụ a Pita ji nkwanye ùgwù kpọọ Jizọs κύριος; ‘Onyenwe anyị’ na-egosipụta aha ahụ karịa naanị okwu e ji asọpụrụ mmadụ.
- source_word: Βόσκε τὰ ἀρνία μου
  choice: Na-enye ụmụ atụrụ m nri
  rationale: βόσκω pụtara inye anụ ụlọ nri, ebe ἀρνία bụ ụmụ atụrụ. Nsụgharị a na-edebe iwu ahụ, ihe oyiyi onye ọzụzụ atụrụ, na nkwupụta Jizọs na ha bụ nke ya.
theological_decisions:
- issue: Ma a ga-eme ka ἀγαπάω na φιλέω bụrụ ụdị ịhụnanya abụọ dị iche n’ahịrị bụ́ isi
  choice: E ji ‘ịhụ n’anya’ sụgharịa ha abụọ, ma kọwaa mgbanwe ngwaa Grik na nkọwa ala peeji.
  alternative: Ịsụgharị ἀγαπάω dị ka ịhụnanya dị elu, ma φιλέω dị ka inwe mmasị ma ọ bụ ịhụnanya enyi.
  rationale: Jọn jiri ngwaa abụọ dị iche, ma ihe odide ahụ ekwughị hoo haa na otu bụ ịhụnanya dị elu karịa ibe ya. Nhọrọ a ezere itinye nkọwa nkà mmụta okpukpe nke ihe odide ahụ n’onwe ya na-akwadoghị n’ụzọ doro anya.
- issue: Ihe πλέον τούτων na-atụnyere
  choice: E debere okwu ahụ dị ka ‘karịa ndị a,’ tinyere nkọwa ala peeji banyere ụzọ dị iche iche e nwere ike isi ghọta ya.
  alternative: ‘Karịa ka ndị ikom a si hụ m n’anya’ ma ọ bụ ‘karịa ka ị hụrụ ihe ndị a n’anya.’
  rationale: Grik ekwughị kpọmkwem onye ma ọ bụ ihe ‘ndị a’ bụ, ma ọ bụ akụkụ nke ntụnyere e hapụrụ. Ya mere, a naghị ahọrọ otu nkọwa dịka naanị ihe o nwere ike ịpụta.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke a na-aghọta ngwa ngwa ma nwee ugwu, dee amaokwu ahụ. E debere akụkọ ahụ n’oge gara aga dịka Igbo si akọ akụkọ n’ụzọ ebumpụta ụwa. A na-eji ‘Jizọs,’ ‘Saịmọn Pita,’ na ‘Onyenwe anyị’ dịka ụdị aha na utu aha ndị a na-ahụkarị n’Igbo.
