revisions:
- from: Ma ndị ọzọ na-eso ụzọ bịara n’obere ụgbọ mmiri ahụ, n’ihi na ha anọghị n’ebe dị anya site n’ala, kama ha dị ihe dị ka narị kubit abụọ[a] site n’ebe ahụ, na-adọ ụgbụ azụ ahụ[b].
  to: Ma ndị na-eso ụzọ ndị ọzọ bịara n’obere ụgbọ mmiri ahụ, n’ihi na ha anọghị anya site n’ala, kama ha nọ ihe dị ka kubit narị abụọ[a] site n’ala, na-adọkpụ ụgbụ azụ ahụ[b].
  rationale: The revision corrects the Igbo expression for the measurement, uses idiomatic noun order, makes the distance reference explicit, and renders the dragging action more accurately. It retains the source’s approximate distance and does not add the unstated claim that the net was full of fish.
