    text: Kubit narị abụọ dị ihe dị ka mita iri itoolu.
    reason: cultural_note
  - marker: b
    text: 'N’ụzọ e si dee ya kpọmkwem: “ụgbụ nke azụ ndị ahụ”; o yikarịrị ka ihe ọ pụtara bụ ụgbụ nke azụ dị n’ime ya.'
    reason: lexical_alternative
  revision_rationale: The revision corrects the Igbo expression for the measurement, uses idiomatic noun order, makes the distance reference explicit, and renders the dragging action more accurately. It retains the source’s approximate distance and does not add the unstated claim that the net was full of fish.
