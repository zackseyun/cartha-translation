  text: οἱ δὲ ἄλλοι μαθηταὶ τῷ πλοιαρίῳ ἦλθον, οὐ γὰρ ἦσαν μακρὰν ἀπὸ τῆς γῆς ἀλλὰ ὡς ἀπὸ πηχῶν διακοσίων, σύροντες τὸ δίκτυον τῶν ἰχθύων.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/008.yaml
  text: But the other disciples came in the small boat[a], for they were not far from the land, but about two hundred cubits away[c][b], dragging the net of fish.
translation:
  language: ig
  text: Ma ndị na-eso ụzọ ndị ọzọ bịara n’obere ụgbọ mmiri ahụ, n’ihi na ha anọghị anya site n’ala, kama ha nọ ihe dị ka kubit narị abụọ[a] site n’ala, na-adọkpụ ụgbụ azụ ahụ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kubit narị abụọ dị ihe dị ka mita iri itoolu.
    reason: cultural_note
  - marker: b
    text: 'N’ụzọ e si dee ya kpọmkwem: “ụgbụ nke azụ ndị ahụ”; o yikarịrị ka ihe ọ pụtara bụ ụgbụ nke azụ dị n’ime ya.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ ἄλλοι μαθηταὶ
  choice: Ma ndị ọzọ na-eso ụzọ
  rationale: “Ma” na-egosi ọdịiche dị n’etiti ihe Pita mere n’amaokwu gara aga na ihe ndị ọzọ na-eso ụzọ mere; “ndị ọzọ na-eso ụzọ” na-asụgharị okwu Grik ahụ n’ụzọ doro anya.
- source_word: τῷ πλοιαρίῳ
  choice: n’obere ụgbọ mmiri ahụ
  rationale: πλοιάριον bụ ụdị okwu na-egosi obere ụgbọ; “obere ụgbọ mmiri” na-echekwa nkọwa ahụ ma bụrụkwa Igbo nkịtị.
- source_word: ἦλθον
  choice: bịara
  rationale: Okwu a na-akọ ihe mere n’usoro akụkọ, ya mere “bịara” dabara nke ọma.
- source_word: οὐ γὰρ ἦσαν μακρὰν ἀπὸ τῆς γῆς
  choice: n’ihi na ha anọghị n’ebe dị anya site n’ala
  rationale: γάρ na-enye ihe kpatara ya; γῆ bụ “ala,” nke n’ọnọdụ a pụkwara ịpụta ụsọ mmiri.
- source_word: ἀλλὰ ὡς ἀπὸ πηχῶν διακοσίων
  choice: kama ha dị ihe dị ka narị kubit abụọ site n’ebe ahụ
  rationale: ὡς na-egosi na ọnụọgụ ahụ bụ nke a tụrụ anya ya, ya mere “ihe dị ka”; e debere “kubit” iji chekwaa usoro nha nke omenala isi mmalite.
- source_word: σύροντες
  choice: na-adọ
  rationale: Okwu a na-egosi omume ha na-eme n’otu oge ha na-abịa; “na-adọ” na-egosipụta ịdọ ụgbụ n’azụ ụgbọ mmiri.
- source_word: τὸ δίκτυον τῶν ἰχθύων
  choice: ụgbụ azụ ahụ
  rationale: Njikọ genitiv ahụ nwere ike ịpụta ụgbụ nke nwere azụ n’ime ya, ma asụsụ Grik ekwughị kpọmkwem na ọ “jupụtara”; “ụgbụ azụ ahụ” na-echekwa mkpirikpi na ntakịrị mgbagwoju anya nke isi mmalite.
theological_decisions: []
translation_notes:
  register: Ejiri Standard Igbo nke dị ugbu a, dị ùgwù ma dị mfe nghọta. E debere “kubit” n’ahịrị isi ma kọwaa ya na nkọwa ala peeji; a họọrọ “ala” kama “ụkụ mmiri” iji soro γῆ nso, ebe ihe gbara ya gburugburu na-eme ka echiche ụsọ mmiri doo anya.
