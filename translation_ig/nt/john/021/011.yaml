reference: John 21:11
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀνέβη ⸀οὖν Σίμων Πέτρος καὶ εἵλκυσεν τὸ δίκτυον ⸂εἰς τὴν γῆν⸃ μεστὸν ἰχθύων μεγάλων ἑκατὸν πεντήκοντα τριῶν· καὶ τοσούτων ὄντων οὐκ ἐσχίσθη τὸ δίκτυον.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/011.yaml
  text: So Simon Peter went aboard and pulled the net onto the shore[a], full of large fish, one hundred fifty-three; and though there were so many[b], the net was not torn.
translation:
  language: ig
  text: Ya mere, Saịmọn Pita rịgoro n'ụgbọ mmiri[a] wee dọkpụrụ ụgbụ ahụ ruo n'ikpere mmiri[b]. Ụgbụ ahụ jupụtara n'azụ buru ibu, otu narị na iri ise na atọ. Ma n'agbanyeghị na azụ ndị ahụ dị ọtụtụ otu a, ụgbụ ahụ adọwaghị.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N'ụzọ nkịtị, ‘rịgoro’ ma ọ bụ ‘gbagoro.’ Grik ahụ ekwughị ‘ụgbọ mmiri’ kpọmkwem, ma n'ọnọdụ a, o yikarịrị ka Pita rigoro n'ụgbọ mmiri iji dọta ụgbụ ahụ.
    reason: lexical_alternative
  - marker: b
    text: N'ụzọ nkịtị, ‘ruo n'ala.’ N'ebe a, ‘ikpere mmiri’ na-egosi ala dị n'akụkụ mmiri nke ọma.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέβη
  choice: rịgoro n'ụgbọ mmiri
  rationale: Ngwaa Grik ahụ pụtara n'ụzọ nkịtị ‘rịgoro’ ma ọ bụ ‘gbagoro.’ N'ọnọdụ akụkọ a, ọ kacha yie ka ọ na-ekwu na Pita banyere ma ọ bụ rigoro n'ụgbọ mmiri iji dọta ụgbụ ahụ. Nsụgharị a na-eme ka ihe omume ahụ doo anya n'Igbo, ebe ndetu ala na-echekwa nkọwa nkịtị.
- source_word: οὖν
  choice: Ya mere
  rationale: Ọ na-ejikọta ihe Pita mere na iwu Jizọs nyere na ihe mere tupu amaokwu a; ‘Ya mere’ bụ njikọ akụkọ doro anya n'Igbo.
- source_word: εἵλκυσεν
  choice: dọkpụrụ
  rationale: Okwu a na-egosi ịdọta ihe dị arọ; ‘dọkpụrụ’ dabara n'ịdọta ụgbụ jupụtara n'azụ ruo n'ala.
- source_word: τὸ δίκτυον
  choice: ụgbụ ahụ
  rationale: Nke a bụ aha Igbo a na-ejikarị eme ihe maka ụgbụ e ji egbu azụ; ‘ahụ’ na-egosi ụgbụ ahụ e kwuburu okwu ya.
- source_word: εἰς τὴν γῆν
  choice: ruo n'ikpere mmiri
  rationale: γῆ pụtara ‘ala,’ ma n'akụkọ ịkụ azụ a, ọ na-ezo aka n'ala dị n'akụkụ mmiri. ‘Ikpere mmiri’ na-enye nghọta ahụ n'Igbo nkịtị.
- source_word: μεστὸν ἰχθύων μεγάλων
  choice: Ọ jupụtara na nnukwu azụ
  rationale: Nsụgharị a na-egosipụta kpọmkwem na ụgbụ ahụ juputara n'azụ ndị buru ibu, n'asụsụ Igbo dị mfe ma dị ugwu.
- source_word: ἑκατὸν πεντήκοντα τριῶν
  choice: otu narị na iri ise na atọ
  rationale: E chekwara ọnụ ọgụgụ ahụ kpọmkwem dịka ọ dị n'isi mmalite.
- source_word: τοσούτων ὄντων
  choice: n'agbanyeghị na azụ ndị ahụ dị ọtụtụ otu a
  rationale: 'Nkebiokwu a nwere echiche nkwenye megidere atụmanya: n''agbanyeghị oke azụ ahụ, ụgbụ ahụ adọwaghị.'
- source_word: οὐκ ἐσχίσθη τὸ δίκτυον
  choice: ụgbụ ahụ adọwaghị
  rationale: Grik ji usoro nnara mee ihe; Igbo na-ekwupụta ọnọdụ ụgbụ ahụ n'ụzọ eke site n'ịsị na ọ ‘adọwaghị,’ na-echekwa isi echiche na ụgbụ ahụ emebighị.
theological_decisions: []
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị mfe nghọta ma dịkwa ugwu. E kewara ogologo ahịrịokwu Grik ahụ ka akụkọ ahụ na-aga nke ọma n'Igbo, ma e chekwara njikọ nkwenye dị na nkebi ikpeazụ. Akara ndetu [a] na [b] dị n'ahịrị isi n'akụkụ okwu ha na-akọwa.
