source:
  edition: SBLGNT
  text: ἦσαν ὁμοῦ Σίμων Πέτρος καὶ Θωμᾶς ὁ λεγόμενος Δίδυμος καὶ Ναθαναὴλ ὁ ἀπὸ Κανὰ τῆς Γαλιλαίας καὶ οἱ τοῦ Ζεβεδαίου καὶ ἄλλοι ἐκ τῶν μαθητῶν αὐτοῦ δύο.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/002.yaml
  text: Simon Peter[a], Thomas called Didymus, Nathanael from Cana of Galilee, the sons of Zebedee, and two others of his disciples were together.
translation:
  language: ig
  text: Saịmọn Pita, Tọmọs onye a na-akpọ Ejima[a], Nataniel onye si Kena nke Galili, ụmụ Zebedi, na ndị ọzọ abụọ n’ime ndị na-eso ụzọ ya nọkọrọ ọnụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’asụsụ Grik, “Didymos” pụtara “Ejima.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦσαν ὁμοῦ
  choice: nọkọrọ ọnụ
  rationale: Ngwakọta a na-egosi na ha nọ n’otu ebe; “nọkọrọ ọnụ” bụ okwu Igbo doro anya ma kwekọọ n’ọnọdụ akụkọ ahụ.
- source_word: Σίμων Πέτρος
  choice: Saịmọn Pita
  rationale: E depụtara aha onye ahụ n’ụdị a na-aghọta nke ọma n’Igbo.
- source_word: Θωμᾶς ὁ λεγόμενος Δίδυμος
  choice: Tọmọs onye a na-akpọ Ejima
  rationale: λεγόμενος pụtara “onye a na-akpọ,” ebe Δίδυμος pụtara “Ejima”; ịtụgharị aha nkọwa ahụ na-echekwa ihe ọ pụtara.
- source_word: Ναθαναὴλ ὁ ἀπὸ Κανὰ τῆς Γαλιλαίας
  choice: Nataniel onye si Kena nke Galili
  rationale: ἀπό na-egosi ebe o si; usoro a bụ Igbo ebumpụta ụwa ma na-echekwa njikọ Kena na Galili.
- source_word: οἱ τοῦ Ζεβεδαίου
  choice: ụmụ Zebedi
  rationale: Nkebi Grik a na-ezo aka n’ụmụ ndị nwoke Zebedi; n’ọnọdụ a, “ụmụ Zebedi” bụ ụzọ Igbo dị nkenke ma doo anya.
- source_word: ἄλλοι ἐκ τῶν μαθητῶν αὐτοῦ δύο
  choice: mmadụ abụọ ọzọ n’ime ndị na-eso ụzọ ya
  rationale: “n’ime” na-echekwa echiche partitive nke ἐκ, ya bụ, mmadụ abụọ sitere n’etiti ndị na-eso ụzọ ya.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị ugwu ma dị mfe nghọta. E tinyere “mmadụ” iji mee ka “abụọ ọzọ” daa nke ọma n’Igbo, ma echekwara usoro ndepụta na ihe okwu Grik pụtara.
