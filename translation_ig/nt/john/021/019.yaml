id: JHN.21.19
reference: John 21:19
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τοῦτο δὲ εἶπεν σημαίνων ποίῳ θανάτῳ δοξάσει τὸν θεόν. καὶ τοῦτο εἰπὼν λέγει αὐτῷ· Ἀκολούθει μοι.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/019.yaml
  text: He said this to indicate by what kind of death he would glorify God[a]. And after saying this, he says to him[b], “Follow me.”
translation:
  language: ig
  text: O kwuru nke a iji gosi ụdị ọnwụ ọ ga-eji nye Chineke otuto.[a] Mgbe o kwuchara nke a, ọ sịrị ya,[b] “Soro m.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ụzọ ọnwụ ọ ga-anwụ.”
    reason: lexical_alternative
  - marker: b
    text: 'Grik ji oge ugbu a n''ịkọ akụkọ: “ọ na-asị ya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: σημαίνων
  choice: iji gosi
  rationale: Nke a na-egosi na okwu Jizọs mere ka a mara ihe ọ na-ekwu n'ụzọ na-abụghị ikwu ya kpọmkwem; “iji gosi” bụ Igbo doro anya ma kwekọọ n'ọrụ participle a.
- source_word: ποίῳ θανάτῳ
  choice: ụdị ọnwụ
  rationale: “Ụdị” na-echekwa nuance qualitative nke ποίῳ, ya bụ ụdị ma ọ bụ ụzọ ọnwụ Pita ga-anwụ.
- source_word: δοξάσει τὸν θεόν
  choice: ọ ga-eji nye Chineke otuto
  rationale: Nhazi a bụ Igbo ebumpụta ụwa, na-echekwa echiche ọdịnihu na nkwupụta ahụ na ọnwụ ya ga-enye Chineke otuto, n'enweghị ịkọwa otú o si eme ya.
- source_word: καὶ τοῦτο εἰπὼν
  choice: Mgbe o kwuchara nke a
  rationale: Temporal clause a na-asụ nke ọma n'Igbo ma na-egosi na okwu na-esonụ bịara mgbe o kwuchara nke mbụ.
- source_word: λέγει αὐτῷ
  choice: ọ sịrị ya
  rationale: Ọ bụ ezie na Grik ji historical present, oge gara aga bụ ụzọ ebumpụta ụwa isi kọọ akụkọ a n'Igbo; ihe odide ala peeji na-eme ka onye na-agụ mara ụdị Grik ahụ.
- source_word: Ἀκολούθει μοι
  choice: Soro m
  rationale: Nke a bụ iwu dị nkenke ma dị ebumpụta ụwa n'Igbo, nke nwere ike ịgụnye ịmalite iso ya ozugbo nakwa ịnọgide na-eso ya.
theological_decisions:
- issue: Ihe “inye Chineke otuto” pụtara n'ihe gbasara ọnwụ Pita
  choice: E debere ya dịka “ọ ga-eji nye Chineke otuto” n'enweghị nkọwa ọzọ.
  alternative: Ịkọwa ya kpọmkwem dịka ọnwụ n'ihi okwukwe ma ọ bụ ịgba akaebe kwesịrị ntụkwasị obi.
  rationale: Amaokwu ahụ kwuru na ụdị ọnwụ ahụ ga-enye Chineke otuto, ma ọ kọwaghị kpọmkwem otú nke ahụ ga-esi mee; nsụgharị ahụ na-echekwa ibu okpukpe na nghọta sara mbara nke okwu ahụ.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. A họọrọ “Soro m” dịka iwu ebumpụta ụwa; a zere ịgbakwunye nkọwa ụka ma ọ bụ nkọwa kpọmkwem banyere ọnwụ Pita.
