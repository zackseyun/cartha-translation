id: JHN.21.24
reference: John 21:24
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Οὗτός ἐστιν ὁ μαθητὴς ὁ μαρτυρῶν περὶ τούτων καὶ ⸀ὁ γράψας ταῦτα, καὶ οἴδαμεν ὅτι ἀληθὴς ⸂αὐτοῦ ἡ μαρτυρία ἐστίν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/024.yaml
  text: This is the disciple who testifies about these things and who wrote these things[a], and we know that his testimony is true.
translation:
  language: ig
  text: Nke a bụ onye na-eso ụzọ ahụ na-agba akaebe banyere ihe ndị a, onye dekwara ihe ndị a; anyị makwa na akaebe ya bụ eziokwu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οὗτός
  choice: Onye a
  rationale: Nnọchiaha ngosi a na-arụtụ aka n’onye ahụ na-eso ụzọ a kpọtụrụ aha tupu amaokwu a; “Onye a” na-eme ka o doo anya na ọ bụ mmadụ.
- source_word: ὁ μαθητὴς
  choice: onye ahụ na-eso ụzọ
  rationale: Nke a bụ okwu Igbo a na-ejikarị akọwa μαθητής dị ka onye na-eso Jizọs ma na-amụta ihe n’aka ya.
- source_word: ὁ μαρτυρῶν περὶ τούτων
  choice: nke na-agba akaebe banyere ihe ndị a
  rationale: Ọdịdị nke ngwaa a na-egosi ọrụ akaebe na-aga n’ihu ma ọ bụ ihe e ji onye ahụ mara. “Na-agba akaebe” bụ okwu Igbo doro anya ma na-echekwa njikọ ya na aha bụ μαρτυρία.
- source_word: ὁ γράψας ταῦτα
  choice: onye dere ihe ndị a
  rationale: Okwu a na-egosi na ide ihe ndị a bụ ọrụ e mechara; nkebiokwu a dị mfe ma bụrụkwa Igbo eke.
- source_word: οἴδαμεν
  choice: anyị makwa
  rationale: A sụgharịrị onye mbụ n’ọnụọgụ dị ọtụtụ dịka o si dị n’asụsụ Grik, n’akọwaghị ndị okwu ahụ “anyị” na-anọchi anya ha.
- source_word: ἀληθὴς
  choice: eziokwu
  rationale: N’usoro “akaebe ya bụ eziokwu,” okwu a na-egosi na akaebe ahụ bụ nke bụ eziokwu, n’etinyeghị nkọwa ọzọ dịka ‘a pụrụ ịtụkwasị obi.’
- source_word: αὐτοῦ ἡ μαρτυρία
  choice: akaebe ya
  rationale: “Akaebe” na-enye ezi nkọwa nke μαρτυρία ma na-echekwa otu mgbọrọgwụ okwu ya na “na-agba akaebe” n’Igbo.
theological_decisions:
- issue: Ndị okwu ahụ “anyị makwa” na-anọchi anya ha
  choice: E debere ya dịka “anyị makwa” n’akọwaghị ndị na-ekwu okwu.
  alternative: Ịkọwa ya dịka onye dere Oziọma ahụ ji olu nchịkọta kwuo, ma ọ bụ dịka otu ndị na-akwado akaebe onye ahụ na-eso ụzọ.
  rationale: Ihe odide Grik ji onye mbụ n’ọnụọgụ dị ọtụtụ mee ihe, ma ọ kọwaghị kpọmkwem ndị ọ bụ. Nsụgharị ekwesịghị ikpebi okwu gbasara onye dere akwụkwọ ahụ ma ọ bụ otu ndị na-akwado ya.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E ji “na-agba akaebe” na “akaebe” chekwaa njikọ okwu dị n’etiti μαρτυρῶν na μαρτυρία, ya mere ọ dịghị mkpa itinye nkọwa ala peeji maka njikọ ahụ.
