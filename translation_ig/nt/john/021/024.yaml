revisions:
- from: Onye a bụ onye ahụ na-eso ụzọ nke na-agba akaebe banyere ihe ndị a, bụrụkwa onye dere ihe ndị a; anyị makwa na akaebe ya bụ eziokwu.
  to: Nke a bụ onye na-eso ụzọ ahụ na-agba akaebe banyere ihe ndị a, onye dekwara ihe ndị a; anyị makwa na akaebe ya bụ eziokwu.
  rationale: The revision removes redundant wording and makes the two descriptions of the disciple parallel and idiomatic. It retains the Greek present sense in ‘na-agba akaebe,’ the completed writing in ‘dekwara,’ the unidentified plural in ‘anyị makwa,’ and the cognate terminology ‘na-agba akaebe’/‘akaebe.’ No footnote is needed because the cognate witness language is explicit in the translation.
