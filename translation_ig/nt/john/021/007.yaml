id: JHN.21.7
reference: John 21:7
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: λέγει οὖν ὁ μαθητὴς ἐκεῖνος ὃν ἠγάπα ὁ Ἰησοῦς τῷ Πέτρῳ· Ὁ κύριός ἐστιν. Σίμων οὖν Πέτρος, ἀκούσας ὅτι ὁ κύριός ἐστιν, τὸν ἐπενδύτην διεζώσατο, ἦν γὰρ γυμνός, καὶ ἔβαλεν ἑαυτὸν εἰς τὴν θάλασσαν·
base_translation:
  language: en
  yaml_path: translation/nt/john/021/007.yaml
  text: So that disciple whom Jesus loved said to Peter[a], “It is the Lord.” Therefore, when Simon Peter heard that it was the Lord, he tied his outer garment around himself (for he was lightly clothed) and threw himself into the sea.
translation:
  language: ig
  text: Ya mere, onye ahụ na-eso ụzọ Jizọs hụrụ n’anya gwara Pita, “Ọ bụ Onyenwe anyị.” Ya mere, mgbe Saịmọn Pita nụrụ na ọ bụ Onyenwe anyị, o kekọtara uwe elu ya n’úkwù—n’ihi na ọ yighị uwe zuru ezu[a]—wee tụba onwe ya n’ime oke osimiri ahụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ọ gba ọtọ.” Okwu Grik bụ γυμνός nwere ike ịpụta onye gba ọtọ kpamkpam ma ọ bụ onye na-eyighị uwe zuru ezu, dabere n’ọnọdụ e ji ya mee ihe.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει οὖν
  choice: Ya mere, ... gwara
  rationale: “Ya mere” na-egosi njikọ na ihe mere tupu ya, ebe “gwara” bụ ụzọ Igbo si ekwu okwu a n'ụzọ ebumpụta ụwa.
- source_word: ὁ μαθητὴς ἐκεῖνος ὃν ἠγάπα ὁ Ἰησοῦς
  choice: onye ahụ na-eso ụzọ Jizọs hụrụ n’anya
  rationale: E debere ike ngosi nke ἐκεῖνος site na “onye ahụ,” ma chekwaa aha pụrụ iche Jọn ji akọwa onye na-eso ụzọ a.
- source_word: Ὁ κύριός ἐστιν
  choice: Ọ bụ Onyenwe anyị
  rationale: “Onyenwe anyị” bụ nsụgharị Igbo a na-aghọta nke ọma maka κύριος, ma na-echekwa ịdị arọ nke aha ahụ n’oge a ha matara Jizọs.
- source_word: ἀκούσας
  choice: Mgbe ... nụrụ
  rationale: A sụgharịrị participle a dị ka nkebiokwu oge, nke bụ Igbo ebumpụta ụwa ma na-echekwa usoro ihe omume.
- source_word: τὸν ἐπενδύτην
  choice: uwe elu ya
  rationale: Nke a na-egosi uwe a na-eyi n’elu uwe ọzọ n’enweghị ịkọwapụta ụdị uwe ahụ karịa ihe Grik kwuru.
- source_word: διεζώσατο
  choice: o kere ... n’úkwù
  rationale: Nke a na-egosi na Pita kegidere uwe ahụ n’ahụ ya, ọ bụghị naanị na o yiri ya.
- source_word: ἦν γὰρ γυμνός
  choice: n’ihi na o yichaghị uwe zuru ezu
  rationale: γυμνός nwere ike ịpụta onye gba ọtọ ma ọ bụ onye na-eyighị uwe zuru ezu. Nsụgharị a na-echekwa ihe yiri ka ọnọdụ ndị na-arụ ọrụ n’ụgbọ mmiri pụtara, ebe e debere ihe ọzọ ọ pụrụ ịpụta na ndetu ala.
- source_word: ἔβαλεν ἑαυτὸν εἰς τὴν θάλασσαν
  choice: wee tụba onwe ya n’ime osimiri ahụ
  rationale: “Tụba onwe ya” na-echekwa ike nke βάλλω na ihe onye ahụ mere n’onwe ya; “osimiri” bụ okwu Igbo nkịtị maka nnukwu mmiri a kpọrọ θάλασσα n’ebe a.
theological_decisions:
- issue: Nsụgharị κύριος mgbe onye na-eso ụzọ matara Jizọs
  choice: Onyenwe anyị
  alternative: Nna ukwu
  rationale: “Onyenwe anyị” na-echekwa ma aha nkwanye ùgwù ahụ ma ịdị arọ metụtara onye Jizọs bụ, n’agbanyeghị na “Nna ukwu” nwekwara ike ịbụ ihe κύριος pụtara n’ọnọdụ ụfọdụ.
- issue: Ihe γυμνός pụtara banyere otú Pita si yi uwe
  choice: o yichaghị uwe zuru ezu
  alternative: ọ gba ọtọ
  rationale: Okwu Grik ahụ nwere ụzọ abụọ a pụrụ isi ghọta ya. Isi ederede họọrọ nke dabara n’ọnọdụ ọrụ n’ụgbọ mmiri, ebe ndetu ala chekwara nkọwa kpọmkwem nke ọzọ ka e ghara ikpochapụ mgbagwoju anya dị n’isi mmalite.
translation_notes:
  register: Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E ji “Jizọs,” “Pita,” na “Saịmọn” mee nsụgharị aha ndị a n’ụdị Igbo a na-ejikarị. E chekwara njikọ akụkọ nke οὖν na ihe abụọ mere n’usoro n’enweghị ịme ka ahịrịokwu ahụ sie ike.
