- from: Ya mere, okwu a[a] gbasara n’etiti ụmụnna[b] na onye ahụ na-eso ụzọ agaghị anwụ. Ma Jizọs asịghị ya na ọ gaghị anwụ; kama ọ sịrị, “Ọ bụrụ na m chọrọ ka ọ nọgide ruo mgbe m ga-abịa, gịnị ka nke ahụ gbasara gị?”[c]
  to: Ya mere, okwu a[a] wee gbasaa n’etiti ụmụnna[b], na onye na-eso ụzọ ahụ agaghị anwụ. Ma Jizọs asịghị ya na ọ gaghị anwụ; kama ọ sịrị, “Ọ bụrụ na m chọrọ ka ọ nọgide ruo mgbe m ga-abịa, gịnị ka nke ahụ gbasara gị?”[c]
