id: JHN.21.23
reference: John 21:23
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐξῆλθεν οὖν ⸂οὗτος ὁ λόγος⸃ εἰς τοὺς ἀδελφοὺς ὅτι ὁ μαθητὴς ἐκεῖνος οὐκ ἀποθνῄσκει. ⸂οὐκ εἶπεν δὲ⸃ αὐτῷ ὁ Ἰησοῦς ὅτι οὐκ ἀποθνῄσκει ἀλλ’· Ἐὰν αὐτὸν θέλω μένειν ἕως ἔρχομαι, τί πρὸς σέ;
base_translation:
  language: en
  yaml_path: translation/nt/john/021/023.yaml
  text: So this report spread among the brothers that that disciple would not die. Yet Jesus did not say to him that he would not die, but, “If I want him to remain until I come, what is that to you?”
translation:
  language: ig
  text: Ya mere, okwu a[a] wee gbasaa n’etiti ụmụnna[b], na onye na-eso ụzọ ahụ agaghị anwụ. Ma Jizọs asịghị ya na ọ gaghị anwụ; kama ọ sịrị, “Ọ bụrụ na m chọrọ ka ọ nọgide ruo mgbe m ga-abịa, gịnị ka nke ahụ gbasara gị?”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “akụkọ a.” Okwu Grik λόγος nwere ike ịpụta “okwu,” “ihe e kwuru,” ma ọ bụ “akụkọ.”
    reason: lexical_alternative
  - marker: b
    text: “Ụmụnna” n’ebe a na-ekwu maka òtù ndị na-eso ụzọ; okwu Grik ahụ dị n’ụdị ọtụtụ nke nwoke.
    reason: cultural_note
  - marker: c
    text: 'Ya bụ, Jizọs ekweghị nkwa na onye a na-eso ụzọ agaghị anwụ ma ọlị; o kwuru okwu nwere ọnọdụ: “Ọ bụrụ na m chọrọ ka ọ nọgide ruo mgbe m ga-abịa …”'
    reason: cross_reference
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: gbasara
  rationale: N’ọnọdụ a, ngwaa ahụ na-ekwu na ozi gara ebe niile n’etiti otu ndị mmadụ; “gbasara” bụ ụzọ Igbo dị mfe ma kwekọọ n’echiche ahụ.
- source_word: οὗτος ὁ λόγος
  choice: okwu a
  rationale: “Okwu a” na-edobe obosara ihe λόγος pụtara—okwu, ihe e kwuru, ma ọ bụ akụkọ a na-akọ—n’etinyeghị nkọwa na ọ bụ naanị asịrị.
- source_word: εἰς τοὺς ἀδελφοὺς
  choice: n’etiti ụmụnna
  rationale: N’ihi ngwaa nke ịgbasa ozi, “n’etiti” na-egosi na okwu ahụ gbasara n’ime obodo ndị na-eso ụzọ; “ụmụnna” bụ okwu Igbo a na-eji maka ndị otu okwukwe.
- source_word: ὁ μαθητὴς ἐκεῖνος
  choice: onye ahụ na-eso ụzọ
  rationale: “Onye ahụ” na-edobe nrụtụ aka doro anya nke ἐκεῖνος, ebe “na-eso ụzọ” na-enye μαθητής n’Igbo dị ugbu a ma doo anya.
- source_word: οὐκ ἀποθνῄσκει
  choice: agaghị anwụ
  rationale: Ọ bụ ọdịnaya nke okwu a gbasara banyere ihe ga-eme onye ahụ; ọdịnihu “agaghị anwụ” bụ ụzọ Igbo eke si kwuo ya.
- source_word: οὐκ εἶπεν δὲ
  choice: Ma Jizọs asịghị ya
  rationale: “Ma” na-egosi mmezi dị n’ihe onye ode akwụkwọ kwuru, “asịghị” na-agọnahụ hoo haa na Jizọs kwuru nkwupụta ahụ.
- source_word: Ἐὰν αὐτὸν θέλω μένειν
  choice: Ọ bụrụ na m chọrọ ka ọ nọgide
  rationale: Nsụgharị a na-edobe ọnọdụ e tinyere n’okwu ahụ nakwa uche nke θέλω, ebe “nọgide” na-egosipụta μένειν n’enweghị ịkọwa ihe karịrị ihe odide ahụ.
- source_word: ἕως ἔρχομαι
  choice: ruo mgbe m ga-abịa
  rationale: Nke a bụ Igbo eke maka oge a na-atụ anya ya, ma ọ naghị etinye okwu nkọwa dịka “lọghachi” nke na-adịghị kpọmkwem n’asụsụ Grik.
- source_word: τί πρὸς σέ
  choice: gịnị ka nke ahụ gbasara gị?
  rationale: Nke a na-ebufe ajụjụ mkpụmkpụ na nke siri ike nke na-agwa Pita ka ọ ghara itinye uche n’ihe ga-eme onye ọzọ.
theological_decisions:
- issue: Ụdị okwu gbasara onye ahụ na-eso ụzọ
  choice: E jiri “okwu a” kwuo ihe gbasara n’etiti ụmụnna, ma ahịrịokwu na-esote kọwaa na ọ bụghị nkwa Jizọs kwere.
  alternative: Ịsụgharị ya dịka “akụkọ a” ma ọ bụ “asịrị a.”
  rationale: λόγος nwere ike ịbụ okwu, ihe e kwuru, ma ọ bụ akụkọ. “Okwu a” na-echekwa obosara ahụ, ebe mmezi onye ode akwụkwọ mere na-egbochi onye na-agụ ya iche na Jizọs kwere nkwa na onye ahụ agaghị anwụ.
- issue: Ọnọdụ e tinyere n’okwu Jizọs
  choice: E debere “Ọ bụrụ na” dịka ọnọdụ, ọ bụghị dịka amụma ma ọ bụ nkwa.
  alternative: Ịkọwa okwu ahụ dịka nkwupụta na onye ahụ ga-adị ndụ ruo n’ọbịbịa Jizọs.
  rationale: Ἐὰν na-egosi ọnọdụ a na-atụ aro. Ihe odide ahụ n’onwe ya na-eme ka o doo anya na Jizọs ekwughị na onye ahụ agaghị anwụ.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-edobe mmezi siri ike onye ode akwụkwọ mere, ma ọ naghị akọwa ọnọdụ Jizọs kwuru dịka nkwa ma ọ bụ amụma.
