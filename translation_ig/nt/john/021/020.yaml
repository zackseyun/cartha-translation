id: JHN.21.20
reference: John 21:20
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸀Ἐπιστραφεὶς ὁ Πέτρος βλέπει τὸν μαθητὴν ὃν ἠγάπα ὁ Ἰησοῦς ἀκολουθοῦντα, ὃς καὶ ἀνέπεσεν ἐν τῷ δείπνῳ ἐπὶ τὸ στῆθος αὐτοῦ καὶ εἶπεν· Κύριε, τίς ἐστιν ὁ παραδιδούς σε;
base_translation:
  language: en
  yaml_path: translation/nt/john/021/020.yaml
  text: Peter turned and saw the disciple whom Jesus loved following[a], who had also leaned back against his chest at the supper and said, “Lord[b], who is the one betraying you?”
translation:
  language: ig
  text: Pita tụgharịrị wee hụ onye na-eso ụzọ ahụ Jizọs hụrụ n’anya ka ọ na-eso[a], onye bụkwa onye dabeere n’obi Jizọs[b] mgbe ha na-eri nri ma sị, “Onyenwe anyị, ònye bụ onye na-arara gị nye?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ka ọ na-eso ya.” Okwu Grik ahụ ekwughị kpọmkwem onye ọ na-eso.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “onye dinara n’akụkụ obi Jizọs.” Okwu Grik ahụ na-ekwu maka ọnọdụ ịdina ma ọ bụ ịdabere mgbe a na-eri nri.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐπιστραφεὶς
  choice: tụgharịrị
  rationale: Ọ na-egosi ihe Pita mere tupu ọ hụ onye ahụ; okwu a bụ Igbo nkịtị ma na-edobe usoro omume ahụ.
- source_word: βλέπει
  choice: hụkwa
  rationale: Ọ bụ historical present na Grik, ma oge gara aga dabara nke ọma n’akụkọ Igbo; ‘-kwa’ jikọtara omume ahụ na ntụgharị Pita.
- source_word: μαθητὴν
  choice: onye ahụ na-eso ụzọ
  rationale: Nke a bụ okwu Igbo a na-ejikarị akọwa μαθητής ma na-edobe echiche nke ịbụ onye na-amụta ihe n’aka Jizọs ma na-eso ya.
- source_word: ὃν ἠγάπα ὁ Ἰησοῦς
  choice: Jizọs hụrụ n’anya
  rationale: Nsụgharị kpọmkwem ma dịkwa eke nke nkebiokwu ahụ.
- source_word: ἀκολουθοῦντα
  choice: ka ọ na-eso ha
  rationale: N’ọnọdụ akụkọ a, onye ahụ na-eso Jizọs na Pita. E tinyere ‘ha’ ka Igbo wee doo anya, ma e ji ihe odide ala peeji chekwaa na Grik ekwughị ihe a na-eso kpọmkwem.
- source_word: ἀνέπεσεν
  choice: dabeere azụ
  rationale: Na ọnọdụ iri nri n’oge ahụ, okwu a na-egosi ịdabere azụ mgbe mmadụ dina n’akụkụ tebụl.
- source_word: ἐν τῷ δείπνῳ
  choice: mgbe ha na-eri nri
  rationale: Ọ na-enye ọnọdụ nri ahụ n’ụzọ onye Igbo nke oge a ga-aghọta nke ọma, n’etinyeghị echiche emume pụrụ iche.
- source_word: ἐπὶ τὸ στῆθος αὐτοῦ
  choice: n’obi Jizọs
  rationale: ‘Obi’ bụ ụzọ Igbo dị ugbu a si akọwa akụkụ ahụ bụ chest/breast n’ọnọdụ ịdabere mmadụ nso; aha Jizọs na-eme ka onye nnọchiaha Grik doo anya.
- source_word: Κύριε
  choice: Onyenwe anyị
  rationale: Ọ bụ nsụgharị Igbo a na-anabata nke κύριος mgbe a na-akpọ Jizọs, ma na-edobe nkwanye ùgwù na ịdị arọ nke okwu ahụ.
- source_word: ὁ παραδιδούς σε
  choice: onye ga-arara gị nye
  rationale: N’ọnọdụ ahụ, παραδίδωμι pụtara ịrara mmadụ nye. Oge ọdịnihu na Igbo na-egosipụta omume aghụghọ ahụ na-abịanụ n’ụzọ eke.
theological_decisions:
- issue: Historical present βλέπει
  choice: 'E jiri oge gara aga: ‘hụkwa’'
  alternative: ‘na-ahụkwa’
  rationale: Nke a bụ mkpebi banyere ụdị akụkọ, ọ bụghị mkpebi ozizi. Oge gara aga na-agụ nke ọma n’akụkọ Igbo ma ọ naghị agbanwe ihe ọ pụtara.
- issue: Ihe a na-eso na ἀκολουθοῦντα
  choice: ‘na-eso ha,’ ya bụ Jizọs na Pita
  alternative: ‘na-eso’ ma ọ bụ ‘na-eso ya’
  rationale: Grik ekwughị ihe a na-eso kpọmkwem. Ihe gbara amaokwu ahụ gburugburu na-egosi Jizọs na Pita, ya mere ‘ha’ na-eme ka ọnọdụ ahụ doo anya; ihe odide ala peeji na-echekwa enweghị nkọwa ahụ dị na Grik.
- issue: Onye nwe nnọchiaha αὐτοῦ na ‘obi ya’
  choice: E mere ya ‘obi Jizọs’
  alternative: ‘obi ya’
  rationale: Ihe e kwuru na Jọn 13:25 na-egosi na onye ahụ dabeere n’obi Jizọs. Ikwughachi aha Jizọs na-ewepụ mgbagwoju anya nke nnọchiaha n’Igbo n’etinyeghị ozizi ọzọ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ ‘dabeere azụ n’obi Jizọs’ iji gosipụta otú ndị mmadụ si dina n’akụkụ tebụl rie nri n’oge ahụ, n’agbanyeghị na omume a abụghị omenala iri nri ndị Igbo taa.
