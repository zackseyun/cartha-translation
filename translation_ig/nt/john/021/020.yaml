revisions:
- from: Pita tụgharịrị, hụkwa onye ahụ na-eso ụzọ Jizọs hụrụ n’anya ka ọ na-eso ha[a]. Ọ bụkwa onye ahụ dabeere azụ n’obi Jizọs mgbe ha na-eri nri, wee sị, “Onyenwe anyị, ònye bụ onye ga-arara gị nye?”
  to: Pita tụgharịrị wee hụ onye na-eso ụzọ ahụ Jizọs hụrụ n’anya ka ọ na-eso[a], onye bụkwa onye dabeere n’obi Jizọs[b] mgbe ha na-eri nri ma sị, “Onyenwe anyị, ònye bụ onye na-arara gị nye?”
  rationale: The revision retains the source’s historical sequence, identifies the beloved disciple naturally, does not make explicit the unstated object of “following,” preserves the present-force description of the betrayer, and clarifies the ancient meal posture through a footnote without adding interpretation.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T08:27:00Z'
review_pass:
  verdict: revise
  source_fidelity: The draft generally conveys the scene, but it unnecessarily supplies “ha” (“them”) for the unexpressed object of ἀκολουθοῦντα, and its future “ga-arara” weakens the Greek present participle ὁ παραδιδούς. The meal posture needs a less ambiguous bodily rendering than “dabeere azụ n’obi.”
  naturalness: “Pita tụgharịrị, hụkwa” and “onye ahụ na-eso ụzọ Jizọs hụrụ n’anya” are awkward or temporarily ambiguous in Standard Igbo. A relative-clause construction with “wee hụ” reads naturally and clearly.
  terminology: “Onyenwe anyị” is an appropriate respectful rendering of Κύριε. “Onye na-eso ụzọ” is retained for μαθητής. “n’obi Jizọs” is acceptable in this close physical context when paired with a footnote clarifying reclining posture.
  issues:
  - severity: medium
    issue: The object “ha” is supplied after “na-eso.”
    rationale: ἀκολουθοῦντα has no stated object. Context may suggest Jesus and Peter, but the translation should preserve the source’s syntactic openness; the footnote can state the alternatives.
  - severity: medium
    issue: “onye ga-arara gị nye” renders the Greek present participle as future.
    rationale: ὁ παραδιδούς means “the one betraying/handing you over.” The present-form rendering avoids adding a future temporal viewpoint not expressed by the Greek.
  - severity: medium
    issue: The beloved-disciple phrase is awkwardly ordered and potentially ambiguous.
    rationale: “onye ahụ na-eso ụzọ Jizọs hụrụ n’anya” can initially sound as if Jesus loved a way of following. “onye na-eso ụzọ ahụ Jizọs hụrụ n’anya” clearly makes “the disciple” the object of Jesus’ love.
  - severity: low
    issue: “dabeere azụ n’obi Jizọs” is unnatural and may suggest leaning backward into Jesus’ heart.
    rationale: The source recalls reclining at a meal with physical closeness to Jesus’ chest. “dabeere n’obi Jizọs,” with an explanatory footnote, is idiomatic and sufficiently faithful.
  revised_text: Pita tụgharịrị wee hụ onye na-eso ụzọ ahụ Jizọs hụrụ n’anya ka ọ na-eso[a], onye bụkwa onye dabeere n’obi Jizọs[b] mgbe ha na-eri nri ma sị, “Onyenwe anyị, ònye bụ onye na-arara gị nye?”
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “ka ọ na-eso ya.” Okwu Grik ahụ ekwughị kpọmkwem onye ọ na-eso.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “onye dinara n’akụkụ obi Jizọs.” Okwu Grik ahụ na-ekwu maka ọnọdụ ịdina ma ọ bụ ịdabere mgbe a na-eri nri.
    reason: lexical_alternative
  revision_rationale: The revision retains the source’s historical sequence, identifies the beloved disciple naturally, does not make explicit the unstated object of “following,” preserves the present-force description of the betrayer, and clarifies the ancient meal posture through a footnote without adding interpretation.
