review_pass:
  verdict: revise
  source_fidelity: 'The main rendering accurately conveys Jesus’ speech, the plural imperative, the partitive sense of ἀπὸ τῶν ὀψαρίων, and the completed, immediate catch denoted by ὧν ἐπιάσατε νῦν. However, “ndị unu ka jidere ugbu a” is not a sound way to express the relative clause in Standard Igbo: ka in that position can be read as a focus marker (“it is you who caught”), rather than as “just.”'
  naturalness: “Wetanụ ụfọdụ n’ime azụ ndị unu jidere ugbu a” is clear, natural Standard Igbo. It avoids an unnecessary and potentially misleading ka while retaining the source’s νῦν (“now”).
  terminology: “Jizọs,” “Wetanụ,” and “azụ” are appropriate and consistent. No theological terminology is at issue.
  issues:
  - severity: medium
    issue: The phrase “ndị unu ka jidere ugbu a” is grammatically and semantically awkward.
    rationale: For the relative clause ὧν ἐπιάσατε νῦν, Standard Igbo naturally uses “ndị unu jidere ugbu a.” Inserting ka between the subject and verb risks a focus-clause reading and does not reliably mean “just.”
  - severity: low
    issue: 'The footnote’s formal alternative is itself awkward: “site n’azụ.”'
    rationale: “Site n’ime azụ” is the intelligible literal/formal approximation of the partitive expression in Igbo. The note should remain clearly marked as a more formal alternative, not as the preferred idiom.
  - severity: low
    issue: The footnote marker is better placed after “ha,” matching the audit-trail anchor.
    rationale: The English audit trail places the marker after “them.” Moving the Igbo marker to the corresponding location preserves anchoring without affecting meaning.
  revised_text: Jizọs sịrị ha[a], “Wetanụ ụfọdụ n’ime azụ ndị unu jidere ugbu a.”
