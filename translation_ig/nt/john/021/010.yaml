  to: Jizọs sịrị ha[a], “Wetanụ ụfọdụ n’ime azụ ndị unu jidere ugbu a.”
  rationale: The revision corrects the relative clause to idiomatic Standard Igbo, preserves νῦν as “ugbu a” rather than imposing “just,” retains the partitive sense with “ụfọdụ n’ime,” and makes the formal lexical-alternative footnote comprehensible while retaining its more source-shaped wording. The marker is aligned with the English audit trail.
