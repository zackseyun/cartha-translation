  yaml_path: translation/nt/john/021/010.yaml
  text: Jesus said to them[a], “Bring some of the fish that you have now caught.”
translation:
  language: ig
  text: Jizọs sịrị ha[a], “Wetanụ ụfọdụ n’ime azụ ndị unu jidere ugbu a.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ịsụ ya n’ụzọ na-agbaso usoro okwu Grik anya: “Wetanụ site n’ime azụ ndị unu jidere ugbu a.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: sịrị
  rationale: Ọ bụ historical present n’asụsụ Grik; iji oge gara aga ‘sịrị’ mee ya na-eme ka akụkọ ahụ daa nke ọma n’Igbo ma ghara ịgbanwe ọrụ ya n’akụkọ.
- source_word: Ἐνέγκατε
  choice: Wetanụ
  rationale: Ọ bụ iwu e nyere ọtụtụ mmadụ ka ha bute ihe bịakwute onye na-ekwu okwu; ‘Wetanụ’ bụ okwu Igbo doro anya ma kwekọọ n’ọnọdụ ahụ.
- source_word: ἀπὸ τῶν ὀψαρίων
  choice: ụfọdụ n’ime azụ
  rationale: ἀπό ya na genitive ebe a na-egosi iwere akụkụ n’ime azụ niile ha jidere; ‘ụfọdụ n’ime’ na-egosipụta echiche partitive ahụ n’Igbo nkịtị.
- source_word: ὀψαρίων
  choice: azụ
  rationale: Ọ bụ ezie na okwu ahụ pụrụ ịpụta obere azụ ma ọ bụ azụ e ji eri nri, ọnọdụ a na-ekwu maka azụ a ka jidere n’ime mmiri; ‘azụ’ anaghị etinye nkọwa na-adịghị mkpa.
- source_word: ὧν ἐπιάσατε νῦν
  choice: ndị unu ka jidere ugbu a
  rationale: Nkebi ahịrịokwu a na-akọwa azụ ndị a kpọrọ aha, ebe ‘ka jidere ugbu a’ na-egosi na njide ahụ mere nnọọ nso n’oge okwu ahụ.
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ugwu ma dị mfe nghọta. ‘Wetanụ’ na-egosi na a gwara ọtụtụ mmadụ okwu; ‘ụfọdụ n’ime azụ’ na-eme ka echiche nke iwere akụkụ n’ime azụ niile pụta ìhè n’ụzọ ebumpụta ụwa.
