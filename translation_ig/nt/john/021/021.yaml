  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τοῦτον ⸀οὖν ἰδὼν ὁ Πέτρος λέγει τῷ Ἰησοῦ· Κύριε, οὗτος δὲ τί;
base_translation:
  language: en
  yaml_path: translation/nt/john/021/021.yaml
  text: So when Peter saw him, he says to Jesus, “Lord, what about this man?”
translation:
  language: ig
  text: Ya mere, mgbe Pita hụrụ ya, ọ sịrị Jizọs, “Onyenwe anyị, gịnịkwanụ banyere nwoke a?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῦτον ... ἰδών
  choice: mgbe Pita hụrụ ya
  rationale: Ọ na-egosipụta ihe participle a pụtara n'ụzọ doro anya na nke e ji asụ Igbo ugbu a; ‘ya’ na-arụtụ aka n’ebe onye ahụ a kpọtụrụ aha n’amaokwu gara aga nọ.
- source_word: λέγει
  choice: ọ sịrị
  rationale: Present akụkọ Grik na-arụ ọrụ dị ka historic present; n’Igbo, oge gara aga na-ada nke ọma ma na-edobe usoro akụkọ ahụ.
- source_word: Κύριε
  choice: Onyenwe anyị
  rationale: Nke a bụ okwu nsọpụrụ a na-ejikarị eme ihe maka κύριος mgbe a na-agwa Jizọs okwu.
- source_word: οὗτος δὲ τί;
  choice: gịnịkwanụ banyere nwoke a?
  rationale: Ajụjụ Grik ahụ dị mkpụmkpụ ma hapụ ngwaa n’ime nghọta. Nsụgharị a na-edobe ịdị mkpụmkpụ ya ma mee ka ntụnyere onye ọzọ pụta ìhè n’Igbo.
theological_decisions:
- issue: Ihe ajụjụ οὗτος δὲ τί pụtara kpọmkwem
  choice: gịnịkwanụ banyere nwoke a?
  alternative: gịnị ga-eme nwoke a?
  rationale: Ebe ọ bụ na Grik ahụ ahaghị ngwaa, e kwesịghị ịkọwa ya kpọmkwem dịka ajụjụ banyere ọdịnihu ya. ‘Gịnịkwanụ banyere nwoke a?’ na-echekwa obosara na ntakịrị mgbagwoju anya dị n’isi mmalite.
translation_notes:
  register: Standard Igbo dị mfe, nke ugwu, ma bụrụkwa asụsụ ndị mmadụ na-aghọta. E ji ‘nwoke a’ mee ka onye Pita na-arụtụ aka na ya doo anya, ebe ‘gịnịkwanụ banyere’ na-egosipụta δέ dị ka ntụnyere.
