id: JHN.21.1
reference: John 21:1
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Μετὰ ταῦτα ἐφανέρωσεν ἑαυτὸν πάλιν ⸀ὁ Ἰησοῦς τοῖς μαθηταῖς ἐπὶ τῆς θαλάσσης τῆς Τιβεριάδος· ἐφανέρωσεν δὲ οὕτως.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/001.yaml
  text: After these things[a], Jesus revealed himself again to the disciples by the Sea of Tiberias, and he revealed himself in this way.
translation:
  language: ig
  text: Mgbe ihe ndị a gasịrị, Jizọs gosiri onwe ya ọzọ[a] ndị na-eso ụzọ n’akụkụ Oké Osimiri Taịbirias. O gosikwara onwe ya otu a.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “pụtara.” Ngwaa Grik a pụrụ ịpụta ime ka mmadụ pụta ìhè ma ọ bụ mata ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: Mgbe ihe ndị a gasịrị
  rationale: Nke a na-echekwa ọtụtụ ihe dị na ταῦτα ma na-arụ ọrụ dị ka njikọ oge n’Igbo nkịtị.
- source_word: ἐφανέρωσεν ἑαυτὸν
  choice: gosiri ... onwe ya
  rationale: Nke a na-echekwa ike nnọchiaha ntụgharị ἑαυτόν na echiche nke Jizọs ime ka ndị na-eso ụzọ hụ ya ma mata ya.
- source_word: πάλιν
  choice: ọzọ
  rationale: Ọ na-egosi na nke a bụ ngosipụta ọzọ sochiri ngosipụta ndị mere tupu ya.
- source_word: τοῖς μαθηταῖς
  choice: ndị na-eso ụzọ
  rationale: A naghị etinye okwu nwe ihe dịka ‘ya’ n’ihi na ọ dịghị n’ihe odide Grik, ebe ọnọdụ akụkọ ahụ na-eme ka ndị a bụ doo anya.
- source_word: ἐπὶ τῆς θαλάσσης τῆς Τιβεριάδος
  choice: n’akụkụ Oké Osimiri Taịbirias
  rationale: ‘N’akụkụ’ na-egosi ọnọdụ dị n’akụkụ mmiri ahụ nke ọma; aha Taịbirias na-esokwa aha e ji mara ya n’ihe odide Grik.
- source_word: ἐφανέρωσεν δὲ οὕτως
  choice: Ọ bụkwa otu a ka o si gosi onwe ya
  rationale: A na-ekwughachi ngwaa ahụ dịka Grik si mee, ebe ‘otu a’ na-akpọbata ụzọ ihe omume sochirinụ si mee.
theological_decisions:
- issue: Asụsụ e ji kọwaa ngosipụta Jizọs mgbe o si n’ọnwụ bilie
  choice: gosiri onwe ya
  alternative: pụtara; mere ka a mata ya
  rationale: ‘Gosiri onwe ya’ na-echekwa ma ezi ngosipụta anya ma echiche nke Jizọs ji aka ya mee ka ndị na-eso ụzọ mata ya, na-enweghị ime ka okwu ahụ bụrụ naanị ịhụ ya anya.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị mfe ma dịkwa nsọpụrụ, dee ya. A hapụrụ usoro akụkọ Jọn na nkwughachi ‘gosi onwe ya,’ ma hazie usoro okwu ka ọ daa nke ọma n’Igbo.
