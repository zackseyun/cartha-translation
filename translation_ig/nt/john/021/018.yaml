  to: '“N’ezie, n’ezie, ana m asị gị: Mgbe ị ka bụ nwata, ị na-eyiri onwe gị uwe[a], na-aga ebe ịchọrọ. Ma mgbe ị mere agadi, ị ga-esetịpụ aka gị[b], onye ọzọ ga-eyikwa gị uwe, burukwa gị gaa[c] ebe ị na-achọghị ịga.”'
  rationale: The revision retains the draft’s faithful literal imagery and formal register while removing slight additions to the source, rendering the movement clause more idiomatically, and making the lexical footnotes grammatically precise. The possible allusion to crucifixion remains confined to the footnote, in keeping with the following verse’s explanation.
