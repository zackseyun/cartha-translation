review_pass:
  verdict: revise
  source_fidelity: 'The draft preserves the doubled solemn affirmation, the contrast between Peter''s former self-direction and later dependence, and the non-explicit imagery of the predicted death. Two small expressions are less exact: “ebe ọ bụla” adds an unrestricted ‘wherever’ nuance to ὅπου, and “aka gị abụọ” explicitly supplies ‘two,’ which the Greek leaves implicit in the plural.'
  naturalness: The main text is generally clear Standard Igbo. “na-aga ebe ịchọrọ” is smoother and more direct than “na-ejekwa ebe ọ bụla ị chọrọ.” The lexical-alternative footnotes should use finite future forms when presenting alternatives to the future clause.
  terminology: “N’ezie, n’ezie,” “ana m asị gị,” “eyiri onwe gị uwe,” and “setịpụ aka gị” are suitable. Retaining the same clothing/girding semantic field in both halves, with a footnote for the literal sense, appropriately reflects ζώννυμι without forcing a crucifixion interpretation.
  issues:
  - severity: low
    issue: “ebe ọ bụla ị chọrọ” is broader than ὅπου ἤθελες.
    rationale: The Greek means ‘where you wanted,’ not necessarily an emphatic ‘wherever.’ “ebe ịchọrọ” preserves the intended freedom without adding emphasis.
  - severity: low
    issue: “aka gị abụọ” explicitly adds a number not stated in Greek.
    rationale: The plural τὰς χεῖράς σου naturally implies hands, but ‘two’ is not expressed and is unnecessary in Igbo.
  - severity: low
    issue: Footnotes a and c have imprecise or non-future alternative forms.
    rationale: The alternatives should clearly correspond to both the habitual past and future uses of ζώννυμι, and to the future οἴσει.
