id: JHN.21.18
reference: John 21:18
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀμὴν ἀμὴν λέγω σοι, ὅτε ἦς νεώτερος, ἐζώννυες σεαυτὸν καὶ περιεπάτεις ὅπου ἤθελες· ὅταν δὲ γηράσῃς, ἐκτενεῖς τὰς χεῖράς σου, καὶ ἄλλος ⸂σε ζώσει⸃ καὶ οἴσει ὅπου οὐ θέλεις.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/018.yaml
  text: Truly[a], truly, I say to you, when you were younger, you used to dress yourself and walk where you wanted; but when you grow old, you will stretch out your hands[c][b], and another will dress you and carry you where you do not want to go.
translation:
  language: ig
  text: '“N’ezie, n’ezie, ana m asị gị: Mgbe ị ka bụ nwata, ị na-eyiri onwe gị uwe[a], na-aga ebe ịchọrọ. Ma mgbe ị mere agadi, ị ga-esetịpụ aka gị[b], onye ọzọ ga-eyikwa gị uwe, burukwa gị gaa[c] ebe ị na-achọghị ịga.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ị na-ekechi uwe n’úkwù gị”; n’akụkụ nke abụọ, “onye ọzọ ga-ekechi uwe n’úkwù gị.” Okwu Grik ahụ pụtara n’ụzọ nkịtị ikekọta ma ọ bụ ikebe uwe n’ahụ. N’ebe a, ọ na-egosi ọdịiche dị n’etiti nnwere onwe Pita nwere na mbụ na ịdabere n’aka onye ọzọ mgbe e mesịrị.
    reason: lexical_alternative
  - marker: b
    text: A na-aghọtakarị “ị ga-esetịpụ aka gị” dị ka ihe na-ezo aka n’ọnwụ Pita site n’ịkpọgide ya n’obe. Amaokwu na-esote kọwara na Jizọs kwuru nke a iji gosi ụdị ọnwụ Pita ga-eji nye Chineke otuto.
    reason: cross_reference
  - marker: c
    text: Ma ọ bụ, “ga-eduru gị” ma ọ bụ “ga-eburu gị gaa.” Okwu Grik ahụ nwere ike ịpụta iburu mmadụ ma ọ bụ ịkpọrọ ya gaa ebe ọ na-achọghị ịga.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν ἀμὴν
  choice: N’ezie, n’ezie
  rationale: Ọ na-edobe nkwughachi ahụ e ji mesie okwu ike, ma bụrụkwa okwu Igbo doro anya na nke dị ugwu.
- source_word: λέγω σοι
  choice: ana m asị gị
  rationale: Ọ na-edobe okwu Jizọs gwara Pita kpọmkwem, ma daa n'ụzọ ebumpụta ụwa n'Igbo.
- source_word: ὅτε ἦς νεώτερος
  choice: Mgbe ị ka bụ nwata
  rationale: Ọ na-egosipụta oge Pita dị obere ma na-eme ka ọdịiche dị n'etiti oge ahụ na mgbe ọ ga-eme agadi doo anya.
- source_word: ἐζώννυες σεαυτόν
  choice: ị na-eyiri onwe gị uwe
  rationale: Ọ na-enye echiche ζώννυμι n'Igbo nke oge a ma na-edobe ọdịiche dị n'etiti Pita ime nke a n'onwe ya na onye ọzọ ime ya mgbe e mesịrị.
- source_word: περιεπάτεις ὅπου ἤθελες
  choice: na-ejekwa ebe ọ bụla ị chọrọ
  rationale: N'ebe a, περιπατέω bụ ịgagharị nkịtị, ọ bụghị ihe atụ gbasara omume; ntụgharị a na-egosipụta nnwere onwe Pita.
- source_word: ὅταν δὲ γηράσῃς
  choice: Ma mgbe ị mere agadi
  rationale: Ọ na-egosipụta ọdịnihu nke okwu ahụ na ọdịiche dị nro nke δέ.
- source_word: ἐκτενεῖς τὰς χεῖράς σου
  choice: ị ga-esetịpụ aka gị abụọ
  rationale: Ọ na-edobe ihe oyiyi Grik ahụ n'ebughị ụzọ kọwaa ya dị ka ịkpọgide n'obe.
- source_word: ἄλλος σε ζώσει
  choice: onye ọzọ ga-eyikwa gị uwe
  rationale: E ji otu echiche ahụ sụgharịa ζώννυμι ugboro abụọ, ka ọdịiche dị n'etiti nnwere onwe mbụ na ịdabere n'aka onye ọzọ mgbe e mesịrị wee pụta.
- source_word: οἴσει
  choice: kpọrọkwa gị gaa
  rationale: φέρω nwere ike ịpụta iburu, ịkpọrọ, ma ọ bụ iduga; n'ebe a, 'kpọrọ gị gaa' bụ Igbo ebumpụta ụwa ma na-edobe echiche nke ịbụ onye a na-akpọrọ ebe mmadụ achọghị.
- source_word: ὅπου οὐ θέλεις
  choice: ebe ị na-achọghị ịga
  rationale: E tinyere 'ịga' nke ahịrịokwu Grik na-egosi n'ụzọ zoro ezo, ka okwu ahụ wee zuo oke ma doo anya n'Igbo.
theological_decisions:
- issue: Ma a ga-akọwa okwu ahụ kpọmkwem dị ka ịkpọgide Pita n’obe n’ahịrịokwu bụ isi
  choice: Idobe ihe oyiyi ahụ otú ọ dị n’ahịrịokwu bụ isi
  alternative: Ịsụgharị ya n'ụzọ ga-ekwu kpọmkwem na a ga-akpọgide Pita n’obe
  rationale: Amaokwu na-esote bụ ya kọwara na okwu Jizọs na-egosi ụdị ọnwụ Pita ga-anwụ. Ya mere, idobe okwu a n'ụzọ ihe oyiyi na-echekwa usoro akụkọ ahụ na esemokwu nkọwa ya.
translation_notes:
  register: E ji Standard Igbo nke oge a, doro anya ma dị ugwu mee ntụgharị ahụ. E debere nkwughachi “N’ezie, n’ezie” na ihe oyiyi nke isetịpụ aka, ma zere ịkọwa n’ahịrịokwu bụ isi ihe amaokwu na-esote ga-akọwa.
