review_pass:
  verdict: revise
  source_fidelity: 'The draft preserves the principal referents and sequence, including the charcoal fire, fish on it, and bread. However, “rịdata n’elu ala” is an awkward and slightly misleading way to express ἀπέβησαν εἰς τὴν γῆν: the action is getting out of the boat/coming onto land, not simply descending ‘on top of land.’'
  naturalness: “Ọkụ icheku a kwanyere n’ebe ahụ” is not idiomatic Standard Igbo for a fire already set/lying there. “Ọkụ icheku dị n’ebe ahụ” is natural and retains the stative sense. The revised sentence also avoids the somewhat redundant sequencing created by “ha hụrụ … hụkwa …”.
  terminology: “Ọkụ icheku,” “azụ,” and “achịcha” are appropriate. The cross-reference note correctly identifies the same Greek term in John 18:18 and should be retained with smoother Igbo wording.
  issues:
  - severity: medium
    issue: Awkward rendering of ἀπέβησαν εἰς τὴν γῆν
    rationale: “Ha si n’ụgbọ ahụ rịdata n’elu ala” makes the movement sound like a descent onto the surface of land. “Ha si n’ụgbọ ahụ pụta n’ala” naturally conveys getting out of the boat onto land without over-specifying ‘shore.’
  - severity: medium
    issue: Unnatural expression for κειμένην
    rationale: “A kwanyere n’ebe ahụ” is not a natural description of a charcoal fire in Standard Igbo. “Dị n’ebe ahụ” expresses its being set/present there and reads naturally.
  revised_text: Ya mere, mgbe ha si n’ụgbọ ahụ pụta n’ala[a], ha hụrụ ọkụ icheku dị n’ebe ahụ, tinyere azụ dị n’elu ya[b] na achịcha.
