revisions:
- from: Ya mere, mgbe ha si n’ụgbọ ahụ rịdata n’elu ala[a], ha hụrụ ọkụ icheku a kwanyere n’ebe ahụ, hụkwa azụ dị n’elu ya[b], na achịcha.
  to: Ya mere, mgbe ha si n’ụgbọ ahụ pụta n’ala[a], ha hụrụ ọkụ icheku dị n’ebe ahụ, tinyere azụ dị n’elu ya[b] na achịcha.
  rationale: The revision replaces two unnatural expressions while maintaining the source’s ambiguity and narrative flow. “Si n’ụgbọ ahụ pụta n’ala” closely conveys disembarking onto land, and “ọkụ icheku dị n’ebe ahụ” naturally renders the stative participle κειμένην. The fish remains explicitly located on the fire, and both original footnote anchors and purposes are retained.
