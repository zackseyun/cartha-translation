  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ὡς οὖν ἀπέβησαν εἰς τὴν γῆν βλέπουσιν ἀνθρακιὰν κειμένην καὶ ὀψάριον ἐπικείμενον καὶ ἄρτον.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/009.yaml
  text: So when they got out onto the land[a], they saw a charcoal fire laid there, and fish lying on it[b], and bread.
translation:
  language: ig
  text: Ya mere, mgbe ha si n’ụgbọ ahụ pụta n’ala[a], ha hụrụ ọkụ icheku dị n’ebe ahụ, tinyere azụ dị n’elu ya[b] na achịcha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “mgbe ha rutere n’ikpere mmiri.” N’asụsụ Grik, ihe e kwuru n’ụzọ nkịtị karị bụ na ha si n’ụgbọ ahụ pụta n’ala.
    reason: lexical_alternative
  - marker: b
    text: Okwu a sụgharịrị “ọkụ icheku” bụkwa okwu e ji mee ihe na Jọn 18:18; nke a na-ejikọta ebe a n’ụzọ okwu na ebe Pita gọnahụrụ Jizọs na mbụ.
    reason: cross_reference
lexical_decisions:
- source_word: Ὡς οὖν
  choice: Ya mere, mgbe
  rationale: Nke a jikọtara ọrụ oge nke ὡς na njikọ akụkọ nke οὖν n’Igbo dị mfe ma na-aga nke ọma.
- source_word: ἀπέβησαν εἰς τὴν γῆν
  choice: ha si n’ụgbọ ahụ rịdata n’elu ala
  rationale: Ọ na-egosi n'ụzọ doro anya na ha si n'ụgbọ pụta rute n'ala, ma na-edebe oyiyi dị n'asụsụ Grik karịa naanị ịsị na ha rutere n'ikpere mmiri.
- source_word: βλέπουσιν
  choice: ha hụrụ
  rationale: Ọ bụ ugbu a nke akụkọ ihe mere eme n’asụsụ Grik; oge gara aga bụ ụzọ ebumpụta ụwa e si akọ ya n’Igbo.
- source_word: ἀνθρακιὰν
  choice: ọkụ icheku
  rationale: Nke a bụ okwu Igbo doro anya maka ọkụ e ji icheku mee, ọ na-echekwakwa njikọ okwu ahụ na Jọn 18:18.
- source_word: κειμένην
  choice: a kwanyere n’ebe ahụ
  rationale: Ọ na-egosi na ọkụ ahụ dị njikere n'ebe ahụ n'ejighị okwu na-ada ka ọkụ ahụ bụ ihe dina n'ala.
- source_word: ὀψάριον
  choice: azụ
  rationale: N’akwụkwọ Jọn, okwu a na-ezo aka n’azụ dị ka nri; 'azụ' anaghị amanye ma ọ bụ otu azụ kpọmkwem ma ọ bụ ọtụtụ.
- source_word: ἐπικείμενον
  choice: dị n’elu ya
  rationale: Ọ na-echekwa echiche na azụ ahụ dị n’elu ọkụ icheku ahụ, ma na-ada nke ọma n’Igbo.
- source_word: ἄρτον
  choice: achịcha
  rationale: Nke a bụ nsụgharị nkịtị nke ἄρτος n'ebe a, na-enweghị ịkọwapụta ọdịdị ma ọ bụ ọnụ ọgụgụ ya karịa ihe Grik kwuru.
theological_decisions:
- issue: Oge ugbu a e ji akọ akụkọ
  choice: 'A sụgharịrị βλέπουσιν n’oge gara aga: “ha hụrụ.”'
  alternative: 'Idowe oge ugbu a: “ha na-ahụ.”'
  rationale: Nke a bụ usoro e ji eme ka akụkọ dị ndụ n’asụsụ Grik, ọ bụghị nkwupụta nkà mmụta okpukpe; oge gara aga na-eme ka Igbo bụrụ nke ebumpụta ụwa ma na-echekwa usoro ihe mere.
translation_notes:
  register: Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E ji “rịdata n’elu ala” chekwaa ihe oyiyi Grik, ebe “ọkụ icheku” bụ okwu nkịtị ma na-echekwa njikọ ya na Jọn 18:18.
