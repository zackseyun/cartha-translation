id: JHN.21.4
reference: John 21:4
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Πρωΐας δὲ ἤδη ⸀γενομένης ⸀ἔστη Ἰησοῦς εἰς τὸν αἰγιαλόν· οὐ μέντοι ᾔδεισαν οἱ μαθηταὶ ὅτι Ἰησοῦς ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/004.yaml
  text: When daybreak had already come[a], Jesus stood on the shore; yet the disciples did not know that it was Jesus.
translation:
  language: ig
  text: Mgbe chi bọrọla, Jizọs guzoro n'ikpere mmiri; ma ndị na-eso ụzọ ya amataghị na ọ bụ Jizọs.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “aghọtaghị na ọ bụ Jizọs.” N'ụzọ nkịtị karị, Grik kwuru, “amataghị na ọ bụ Jizọs.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Πρωΐας δὲ ἤδη γενομένης
  choice: Mgbe chi bọrọla
  rationale: Nkebiokwu genitive absolute a na-egosi oge. “Mgbe chi bọrọla” bụ Igbo nkịtị nke na-egosi na chi abọọla n'oge ahụ; -la na-egosipụta echiche ἤδη na γενομένης.
- source_word: δὲ
  choice: (etinyeghị okwu pụrụ iche)
  rationale: δὲ bụ njikọ akụkọ dị nro. Usoro ahịrịokwu Igbo na-ebuga akụkọ ahụ nke ọma n'enweghị ịgbakwụnye “ugbu a” ma ọ bụ ime ka ọdịiche sie ike karịa isi mmalite.
- source_word: ἔστη
  choice: guzoro
  rationale: Nke a na-asụgharị aorist nke ἵστημι n'ụzọ dị mfe dịka ihe mere n'akụkọ, n'ebughị echiche ọzọ banyere ogologo oge o jiri guzoro.
- source_word: εἰς τὸν αἰγιαλόν
  choice: n'ikpere mmiri
  rationale: N'ọnọdụ a, εἰς na αἰγιαλός na-ezo aka n'ebe Jizọs guzoro, ya bụ n'ikpere mmiri. Nke a bụ okwu Igbo doro anya ma kwekọọ n'ọnọdụ akụkọ ahụ.
- source_word: οὐ μέντοι
  choice: ma ... amataghị
  rationale: “Ma” na mmegide dị n'ahịrịokwu ahụ na-egosi ọdịiche dị n'etiti Jizọs ịnọ ebe ahụ na ndị na-eso ụzọ amaghị onye ọ bụ.
- source_word: ᾔδεισαν
  choice: amataghị
  rationale: “Amataghị” na-edobe echiche bụ́ isi nke οἶδα, ‘ịma,’ ma n'ọnọdụ a ọ pụkwara ịpụta na ha aghọtaghị onye ahụ bụ. Nkọwa ala peeji na-egosi ntụgharị ọzọ doro anya karịa.
- source_word: οἱ μαθηταὶ
  choice: ndị na-eso ụzọ ya
  rationale: “Ndị na-eso ụzọ” bụ ntụgharị Igbo a na-aghọta nke μαθηταί. “Ya” na-eme ka ntụaka nye òtù a maara n'akụkọ doo anya n'Igbo, n'agbanyeghị na Grik ji naanị definite article.
- source_word: ὅτι Ἰησοῦς ἐστιν
  choice: na ọ bụ Jizọs
  rationale: Nke a bụ usoro njirimara sitere n'okike n'Igbo ma na-echekwa ihe Grik kwuru n'enweghị ịgbakwụnye na Jizọs ‘nọ ebe ahụ.’
theological_decisions:
- issue: Ịmata Jizọs mgbe o si n'ọnwụ bilie
  choice: “amataghị na ọ bụ Jizọs”
  alternative: “aghọtaghị na ọ bụ Jizọs” ma ọ bụ “amataghị Jizọs”
  rationale: Amaokwu ahụ kwuru naanị na ndị na-eso ụzọ amaghị na onye ahụ bụ Jizọs; ọ kọwaghị ihe kpatara ya. Ya mere, ntụgharị ahụ anaghị etinye nkọwa banyere ọdịdị Jizọs ma ọ bụ ikike nghọta ha.
translation_notes:
  register: Asụsụ Igbo Izugbe dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji “chi bọrọla” mee ka okwu banyere isi ụtụtụ bụrụ nke sitere n'okike; e jikwa “n'ikpere mmiri” zere okwu mpaghara ma ọ bụ nke siri ike. Ihe nrịba ama [a] dị n'isi ederede ma kwekọọ na nkọwa ala peeji.
