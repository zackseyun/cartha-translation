review_pass:
  verdict: revise
  source_fidelity: The draft correctly identifies the narrated appearance as the third occurrence and retains the resurrection-before-appearance relationship. However, “e mere ka o si ná ndị nwụrụ anwụ bilie” is an awkward and overly periphrastic rendering of ἐγερθεὶς ἐκ νεκρῶν. “E kpọlitere ya site n’ọnwụ” is idiomatic Standard Igbo and clearly preserves the Greek passive. “Kpughere onwe ya” is a viable contextual rendering of ἐφανερώθη; the alternative “pụtara n’ihu” appropriately records the ordinary contextual rendering ‘appeared.’
  naturalness: “Nke a bụzi nke ugboro atọ” is not the most natural ordinal construction in contemporary Standard Igbo. “Nke a bụzi oge nke atọ” is clear and idiomatic. The revised resurrection phrase also avoids the cumbersome sequence “e mere ka ... bilie.”
  terminology: “Jizọs,” “ndị na-eso ụzọ ya,” and “n’ọnwụ” are appropriate Standard Igbo biblical terminology. The possessive “ya” makes explicit a referent implicit in the Greek and is natural in Igbo without changing the sense.
  issues:
  - severity: medium
    issue: Awkward rendering of the passive resurrection participle
    rationale: “Mgbe e mere ka o si ná ndị nwụrụ anwụ bilie” is grammatically understandable but unnatural and needlessly indirect. “Mgbe e kpọlitere ya site n’ọnwụ” naturally expresses that Jesus was raised and preserves the passive sense.
  - severity: low
    issue: Unidiomatic ordinal phrase
    rationale: “Bụzi nke ugboro atọ” should be recast as “bụzi oge nke atọ” for natural Standard Igbo.
  revised_text: Nke a bụzi oge nke atọ Jizọs kpughere onwe ya n’ihu ndị na-eso ụzọ ya, mgbe e kpọlitere ya site n’ọnwụ.[a]
  revised_footnotes:
