- from: Nke a bụzi nke ugboro atọ Jizọs kpughere onwe ya nye ndị na-eso ụzọ ya mgbe e mere ka o si ná ndị nwụrụ anwụ bilie.[a]
  to: Nke a bụzi oge nke atọ Jizọs kpughere onwe ya n’ihu ndị na-eso ụzọ ya, mgbe e kpọlitere ya site n’ọnwụ.[a]
  rationale: The revision improves idiomatic Standard Igbo while maintaining the source’s ordinal count, manifestation/appearance sense, and passive resurrection wording. The footnote preserves “appeared” as a legitimate contextual alternative for ἐφανερώθη.
  reviewer_model: gpt-5.6-terra
