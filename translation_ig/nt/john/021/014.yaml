  yaml_path: translation/nt/john/021/014.yaml
  text: This was now the third time Jesus was revealed to the disciples after he had been raised from the dead[a].
translation:
  language: ig
  text: Nke a bụzi oge nke atọ Jizọs kpughere onwe ya n’ihu ndị na-eso ụzọ ya, mgbe e kpọlitere ya site n’ọnwụ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Nke a bụzi oge nke atọ Jizọs pụtara n’ihu ndị na-eso ụzọ ya, mgbe e kpọlitere ya site n’ọnwụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο
  choice: Nke a
  rationale: Ọ na-arụtụ aka n’ihe ngosi ahụ a ka kọwara; “Nke a” bụ ụzọ Igbo si ekwu ya nke ọma.
- source_word: ἤδη τρίτον
  choice: bụzi nke ugboro atọ
  rationale: “Bụzi” na-egosi na ọnụ ọgụgụ ahụ eruola ebe a n’akụkọ, ebe “nke ugboro atọ” na-ebute ordinal ahụ n’Igbo doro anya.
- source_word: ἐφανερώθη
  choice: kpughere onwe ya
  rationale: Ọ na-echekwa echiche nke ime ka a mata ma ọ bụ hụ onye ahụ, ma bụrụkwa okwu Igbo dị eke n’ọnọdụ a; ntụgharị “pụtara” ka edobere n’ala peeji dịka nhọrọ.
- source_word: τοῖς μαθηταῖς
  choice: nye ndị na-eso ụzọ ya
  rationale: “Ndị na-eso ụzọ” bụ okwu Igbo doro anya maka μαθηταί; “ya” na-eme ka njikọ ahụ doo anya n’Igbo, ọ bụ ezie na ọ pụtaghị iche n’asụsụ Gris.
- source_word: ἐγερθεὶς ἐκ νεκρῶν
  choice: mgbe e mere ka o si ná ndị nwụrụ anwụ bilie
  rationale: Nke a na-edebe olu nnara nke participle Gris ma na-egosi na mbilite n’ọnwụ ahụ bu ụzọ tupu mkpughe ahụ.
theological_decisions:
- issue: Olu okwu mbilite n’ọnwụ na ἐγερθεὶς ἐκ νεκρῶν
  choice: mgbe e mere ka o si ná ndị nwụrụ anwụ bilie
  alternative: mgbe o si ná ndị nwụrụ anwụ bilie
  rationale: Isi ederede na-edebe olu nnara dị n’asụsụ Gris kama ịgbanwe ya ka ọ bụrụ naanị na Jizọs biliri n’onwe ya.
- issue: Ihe ἐφανερώθη pụtara n’ebe a
  choice: kpughere onwe ya
  alternative: pụtara
  rationale: “Kpughere onwe ya” na-edobe echiche Johannine nke ime ka a mata ya, ebe “pụtara” bụ ntụgharị ọnọdụ a kwere omume nke e tinyere n’ala peeji.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ugwu ma dị mfe nghọta. A họọrọ “ndị na-eso ụzọ” kama okwu ụka siri ike karị; a hapụrụ esemokwu dị n’etiti “kpughere onwe ya” na “pụtara” site n’ala peeji.
