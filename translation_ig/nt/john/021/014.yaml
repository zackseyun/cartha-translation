    text: Ma ọ bụ, “Nke a bụzi oge nke atọ Jizọs pụtara n’ihu ndị na-eso ụzọ ya, mgbe e kpọlitere ya site n’ọnwụ.”
    reason: lexical_alternative
  revision_rationale: The revision improves idiomatic Standard Igbo while maintaining the source’s ordinal count, manifestation/appearance sense, and passive resurrection wording. The footnote preserves “appeared” as a legitimate contextual alternative for ἐφανερώθη.
