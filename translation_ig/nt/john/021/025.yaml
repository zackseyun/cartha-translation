id: JHN.21.25
reference: John 21:25
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἔστιν δὲ καὶ ἄλλα πολλὰ ⸀ἃ ἐποίησεν ὁ Ἰησοῦς, ἅτινα ἐὰν γράφηται καθ’ ἕν, οὐδ’ αὐτὸν οἶμαι τὸν κόσμον ⸀χωρήσειν τὰ γραφόμενα ⸀βιβλία.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/025.yaml
  text: There are also many other things that Jesus did[a], which, if they were written down one by one, I suppose that not even the world itself would have room for the books being written.
translation:
  language: ig
  text: E nwekwara ọtụtụ ihe ndị ọzọ Jizọs mere; ọ bụrụ na e dee ha n’otu n’otu, echere m na ọbụna ụwa n’onwe ya agaghị enwe ohere ịnabata akwụkwọ ndị a ga-ede.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ọbụna ụwa n’onwe ya agaghị enwe ike ịgụnye akwụkwọ ndị a ga-ede.” Okwu Grik ahụ pụrụ ịpụta “inwe ohere ịnabata” ma ọ bụ “ịgụnye.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ καὶ ἄλλα πολλὰ
  choice: E nwekwara ọtụtụ ihe ndị ọzọ
  rationale: Na-egosi njikọ dị nro na ihe ndị ọzọ e kwuru, ma na-echekwa echiche nke ọtụtụ omume ndị ọzọ.
- source_word: ἃ ἐποίησεν ὁ Ἰησοῦς
  choice: Jizọs mere
  rationale: “Mere” bụ ụzọ Igbo dị mfe ma sara mbara isi kwuo omume Jizọs.
- source_word: ἐὰν γράφηται καθ’ ἕν
  choice: ọ bụrụ na e dee ha n’otu n’otu
  rationale: Na-echekwa ọnọdụ a na-atụ n’uche na nkesa nke καθ’ ἕν, ya bụ, ide nke ọ bụla iche.
- source_word: οὐδ’ αὐτὸν ... τὸν κόσμον
  choice: ọbụna ụwa n’onwe ya agaghị
  rationale: “Ụwa n’onwe ya” na-echekwa nkwusi ike nke αὐτόν, ebe “ọbụna” na-egosipụta οὐδέ.
- source_word: οἶμαι
  choice: echere m
  rationale: Na-echekwa okwu onye ode akwụkwọ banyere echiche nke ya na ụda nkwupụta dị umeala.
- source_word: χωρήσειν
  choice: enwe ohere ịnabata
  rationale: Na-echekwa ma oyiyi nke inwe ohere ma echiche nke ịgụnye ma ọ bụ ịnabata ihe.
- source_word: τὰ γραφόμενα βιβλία
  choice: akwụkwọ ndị a ga-ede
  rationale: N’ọnọdụ ahịrịokwu a, nke a bụ Igbo nkịtị maka akwụkwọ ndị ga-esi n’ide ihe ndị ahụ pụta; ọ na-ezere ntụgharị siri ike nke participle nke na-agaghị ada nke ọma n’Igbo.
theological_decisions:
- issue: Nkwubiga okwu ókè banyere ikike ụwa ịnabata akwụkwọ
  choice: E chekwara oyiyi ahụ dịka nkwubiga okwu ókè siri ike
  alternative: Ịsụgharị ya naanị dịka “a ga-ede ọtụtụ akwụkwọ a na-apụghị ịgụta ọnụ”
  rationale: Ihe odide Grik ji ụwa n’onwe ya na akwụkwọ ndị ahụ mee oyiyi doro anya; ịhapụ oyiyi ahụ ga-eme ka ike mmechi Oziọma ahụ belata.
translation_notes:
  register: Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta. E ji “bụ́ ndị” jikọta nkebiokwu ahụ n’ụzọ doro anya, ma e chekwara nkwubiga okwu ókè na okwu onye ode akwụkwọ, “echere m.”
