id: JHN.21.16
reference: John 21:16
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: λέγει αὐτῷ πάλιν δεύτερον· Σίμων ⸀Ἰωάννου, ἀγαπᾷς με; λέγει αὐτῷ· Ναί, κύριε, σὺ οἶδας ὅτι φιλῶ σε. λέγει αὐτῷ· Ποίμαινε τὰ πρόβατά μου.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/016.yaml
  text: He said to him again a second time[a], “Simon, son of John, do you love me?” He said to him, “Yes, Lord; you know that I love you.” He said to him[b], “Shepherd my sheep.”
translation:
  language: ig
  text: Ọ sịrị ya ọzọ, ugboro nke abụọ, “Saịmọn, nwa Jọn, ị̀ hụrụ m n’anya?” Ọ sịrị ya, “Ee, Onyenweanyị; ị maara na ahụrụ m gị n’anya.” Ọ sịrị ya, “Lekọta atụrụ m dịka onye ọzụzụ atụrụ.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'N’asụsụ Grik, Jizọs na Pita ji ngwaa abụọ dị iche maka “ịhụ n’anya”: Jizọs ji agapaō jụọ ajụjụ, Pita ji phileō zaa. Ụfọdụ ndị na-ahụ ọdịiche n’etiti ha; ndị ọzọ na-ewere ya dị ka mgbanwe n’ụzọ e si ekwu otu echiche. E ji “ịhụ n’anya” sụgharịa ha abụọ n’ahịrịokwu bụ isi ka a ghara ime ka ọdịiche ahụ sie ike karịa ka ihe odide ahụ gosiri.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν δεύτερον
  choice: ọzọ, nke ugboro abụọ
  rationale: Nke a na-edobe ma echiche nkwughachi dị na πάλιν ma ọnụ ọgụgụ doro anya dị na δεύτερον, n’ụzọ Igbo a pụrụ ịghọta.
- source_word: Σίμων Ἰωάννου
  choice: Saịmọn, nwa Jọn
  rationale: Genitive Ἰωάννου na-arụ ọrụ dị ka aha nna; ya mere ‘nwa Jọn’ dabara na ihe odide Grik a karịa ‘nwa Jona.’
- source_word: ἀγαπᾷς με
  choice: ị̀ hụrụ m n’anya?
  rationale: ‘Ịhụ n’anya’ bụ okwu Igbo nkịtị na nke sara mbara maka ἀγαπάω n’ebe a.
- source_word: Ναί, κύριε
  choice: Ee, Onyenwe anyị
  rationale: ‘Ee’ na-enye nkwenye dị mfe; ‘Onyenwe anyị’ na-egosipụta nkwanye ùgwù Pita ji akpọ Jizọs.
- source_word: σὺ οἶδας
  choice: ị maara
  rationale: Nke a na-enye ihe okwu ahụ pụtara n’ụzọ Igbo dị ndụ; nnọchiaha dị n’usoro ngwaa Igbo.
- source_word: ὅτι φιλῶ σε
  choice: na ahụrụ m gị n’anya
  rationale: A sụgharịrị φιλέωkwa dị ka ‘ịhụ n’anya’ ka a ghara ịmanye nnukwu ọdịiche nke ihe odide ahụ na-adịghị akọwapụta nke ọma; e kọwara mgbanwe ngwaa ahụ n’ala peeji.
- source_word: Ποίμαινε
  choice: Na-azụ ... dị ka onye ọzụzụ atụrụ
  rationale: Nke a na-egosipụta ọrụ zuru ezu nke onye ọzụzụ atụrụ—ịzụ, idu, na ilekọta—ọ bụghị nanị inye nri.
- source_word: τὰ πρόβατά μου
  choice: atụrụ m
  rationale: Nke a na-edobe ihe atụ doro anya nke atụrụ nakwa na ha bụ nke Jizọs.
theological_decisions:
- issue: Ma a ga-eji okwu Igbo abụọ dị iche sụgharịa ἀγαπάω na φιλέω
  choice: Jiri ‘ịhụ n’anya’ sụgharịa ha abụọ n’ahịrịokwu bụ isi, ma kọwaa mgbanwe okwu Grik n’ala peeji.
  alternative: Jiri ‘ịhụ n’anya’ maka ἀγαπάω, jiri ‘inwe mmasị n’ebe mmadụ nọ’ ma ọ bụ okwu yiri ya maka φιλέω.
  rationale: Ngwaa abụọ ahụ nwere ike inwe ọdịiche, ma ojiji ha n’Oziọma Jọn na-agafe ibe ha. Iji okwu dị iche n’ahịrịokwu bụ isi nwere ike ịmanye nkọwa nke amaokwu ahụ na-ekwughị hoo haa; ala peeji na-echekwa mgbagwoju anya ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. ‘Na-azụ atụrụ m dị ka onye ọzụzụ atụrụ’ na-eme ka ihe atụ ποιμαίνω pụta ìhè, ebe ‘ọzọ, nke ugboro abụọ’ na-echekwa nkwughachi Grik.
