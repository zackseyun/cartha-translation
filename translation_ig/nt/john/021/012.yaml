  variant: Standard Igbo
source:
  edition: SBLGNT
  text: λέγει αὐτοῖς ὁ Ἰησοῦς· Δεῦτε ἀριστήσατε. οὐδεὶς ⸀δὲ ἐτόλμα τῶν μαθητῶν ἐξετάσαι αὐτόν· Σὺ τίς εἶ; εἰδότες ὅτι ὁ κύριός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/012.yaml
  text: Jesus said to them[a], “Come, eat breakfast.” But none of the disciples dared to ask him[b], “Who are you?” knowing that it was the Lord.
translation:
  language: ig
  text: Jizọs sịrị ha, “Bịanụ rie nri ụtụtụ.”[a] Ma ọ dịghị onye n’ime ndị na-eso ụzọ ya nwara anwa ịjụ ya, “Ị bụ onye?”[b] ebe ha maara na ọ bụ Onyenwe anyị.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “Bịanụ, werenụ nri ụtụtụ.” Ngwaa Grik ahụ na-ekwu kpọmkwem maka nri ụtụtụ.
    reason: lexical_alternative
  - marker: b
    text: Ngwaa a sụgharịrị “ịjụ” nwekwara ike ịpụta “ịjụ ajụjụ” ma ọ bụ “inyocha nke ọma.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Δεῦτε
  choice: Bịanụ
  rationale: Ọ bụ ọkpụkpọ òkù nye ọtụtụ mmadụ ka ha bịa; ụdị a bụ Igbo nkịtị ma na-egosipụta iwu-òkù ahụ.
- source_word: ἀριστήσατε
  choice: rie nri ụtụtụ
  rationale: Ngwaa Grik a na-ekwu kpọmkwem maka iri nri nke ụtụtụ, ya mere a naghị eme ka ọ bụrụ naanị ‘rie nri.’
- source_word: οὐδεὶς δὲ
  choice: Ma ọ dịghị onye
  rationale: ‘Ma’ na-egosipụta obere mgbanwe ma ọ bụ ntụgharị dị na δέ, ebe ‘ọ dịghị onye’ na-egosipụta οὐδείς.
- source_word: ἐτόλμα
  choice: nwara anwa
  rationale: Akpaalaokwu Igbo a na-egosipụta enweghị obi ike ime ihe, nke dabara na τολμάω n’usoro a.
- source_word: ἐξετάσαι
  choice: ịjụ
  rationale: N’okwu a, ọ pụtara ịjụ ya ajụjụ ahụ kpọmkwem; nkọwa siri ike nke inyocha ma ọ bụ ịjụ ajụjụ nke ọma ka e debere n’ala peeji.
- source_word: Σὺ τίς εἶ;
  choice: Ị bụ onye?
  rationale: Nke a bụ ụzọ Igbo doro anya na nke ebumpụta ụwa isi jụọ onye mmadụ bụ, ma na-edebe ajụjụ njirimara ahụ.
- source_word: εἰδότες ὅτι
  choice: ebe ha maara na
  rationale: Nke a na-edebe participle ahụ n’enweghị ịmanye naanị nkọwa kpatara ihe (‘n’ihi na’), ma na-egosipụta ọnọdụ ọmụma ha.
- source_word: ὁ κύριός
  choice: Onyenwe anyị
  rationale: Nke a bụ nsụgharị Igbo a na-ejikarị eme κύριος mgbe ọ na-ezo aka na Jizọs, ma na-edebe ịdị arọ nke aha ahụ.
theological_decisions:
- issue: Nsụgharị κύριος mgbe ọ na-ezo aka na Jizọs
  choice: Onyenwe anyị
  alternative: onye nwe ha / Nna ukwu
  rationale: ‘Onyenwe anyị’ na-edebe aha nsọpụrụ na mkpa Kraịst dị n’okwu mbilite n’ọnwụ a, n’etinyeghị nkọwa ụka pụrụ iche.
- issue: Mmekọrịta εἰδότες na enweghị ajụjụ ndị na-eso ụzọ
  choice: ebe ha maara na
  alternative: n’ihi na ha maara na
  rationale: A hapụrụ participle ahụ ka ọ nwee ohere igosi ọnọdụ ma ọ bụ ihe kpatara ya, kama imechi nghọta ahụ n’ụzọ causal naanị.
translation_notes:
  register: Ejiri Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. ‘Bịanụ’ kwekọrọ na ọtụtụ ndị a na-agwa okwu; ‘nwara anwa’ bụ akpaalaokwu nkịtị maka enweghị obi ike. E debere akara ala peeji niile n’ahịrị isi.
