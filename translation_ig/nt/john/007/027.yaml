  text: ἀλλὰ τοῦτον οἴδαμεν πόθεν ἐστίν· ὁ δὲ χριστὸς ὅταν ἔρχηται οὐδεὶς γινώσκει πόθεν ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/027.yaml
  text: But we know where this man is from; but when the Messiah comes[a], no one knows where he is from.
translation:
  language: ig
  text: Ma anyị maara ebe nwoke a si; ma mgbe Mesaịa ahụ ga-abịa[a], ọ dịghị onye maara ebe o si.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ịsụgharị ya: “Ma anyị maara ebe onye a si; ma mgbe Kraịst ahụ ga-abịa, ọ dịghị onye maara ebe o si.”'
    reason: Na-egosi ụzọ ọzọ e si sụgharị τοῦτον na Χριστός, ma na-edobe echiche πόθεν ἐστίν banyere ebe ma ọ bụ mmalite mmadụ si.
lexical_decisions:
- source_word: ἀλλὰ
  choice: Ma
  rationale: Ọ na-egosi ọdịiche dị n’etiti okwu a na ihe e kwuru tupu ya, ma ọ bụkwa okwu Igbo doro anya ma dị mfe.
- source_word: τοῦτον
  choice: nwoke a
  rationale: Ọ na-arụtụ aka n’ebe Jizọs nọ n’ụzọ pụtara ìhè; ‘nwoke a’ na-egosipụta ntụaka ahụ nke ọma n’Igbo.
- source_word: οἴδαμεν
  choice: anyị maara
  rationale: Nke a na-egosi ihe ndị na-ekwu okwu chere na ha maara n’ezie.
- source_word: πόθεν ἐστίν
  choice: ebe ... si
  rationale: Nke a bụ ụzọ Igbo dị nkenke ma bụrụkwa nke e ji ekwu ebe mmadụ si ma ọ bụ mmalite ya; e jikwa otu usoro ahụ mee ihe n’ahịrịokwu abụọ ahụ.
- source_word: ὁ δὲ χριστός
  choice: ma ... Mesaịa ahụ
  rationale: ‘Mesaịa’ na-edobe Χριστός dịka aha ọkwa nke onye ahụ ndị Juu na-atụ anya ya, ọ bụghị dịka aha mmadụ nkịtị; ‘ma’ na-eburu ọdịiche δέ.
- source_word: ὅταν ἔρχηται
  choice: mgbe ... ga-abịa
  rationale: Ọ na-egosi ọbịbịa a na-atụ anya ya n’ọdịnihu n’Igbo nkịtị, n’agbanyeghị na oge ya edoghị anya.
- source_word: οὐδεὶς γινώσκει
  choice: ọ dịghị onye maara
  rationale: Nke a bụ nsụgharị Igbo doro anya nke nkwupụta na onye ọ bụla amaghị ya.
theological_decisions:
- issue: Nsụgharị Χριστός dịka aha ọkwa
  choice: Mesaịa
  alternative: Kraịst
  rationale: N’ebe a, okwu ahụ bụ aha ọkwa nke onye ahụ ndị mmadụ na-atụ anya ya. ‘Mesaịa’ na-eme ka ọnọdụ ndị Juu na atụmanya ha pụta ìhè.
- issue: Ihe ìgwè mmadụ kwuru banyere ebe Mesaịa si
  choice: E debere okwu ha dịka ha kwuru ya, n’enweghị nkọwa agbakwunyere
  alternative: Ịgbasa ya ka ọ bụrụ ‘ọ dịghị onye maara ebe Mesaịa ga-esi pụta’
  rationale: Amaokwu ahụ na-akọ nkwenkwe ma ọ bụ nghọtahie ndị mmadụ; ọ naghị ekwenye na nkwupụta ahụ bụ ozizi onye na-akọ akụkọ. Ya mere, nsụgharị ahụ anaghị edozi esemokwu ahụ n’aha onye na-agụ ya.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta mee ihe. E debere nkwughachi ‘ebe ... si’ n’akụkụ abụọ ahụ iji chekwaa nhazi na esemokwu dị n’asụsụ Grik.
