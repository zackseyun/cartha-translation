translation:
  language: ig
  text: Onye ọ bụla wee laa n’ụlọ nke ya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Amaokwu a malitere akụkọ banyere nwanyị e jidere n’ịkwa iko (Jọn 7:53–8:11). Akụkụ a dum adịghị n’ihe odide Grik ndị kacha ochie, gụnyere papayrọs nke narị afọ nke atọ na Codex Sinaiticus na Codex Vaticanus nke narị afọ nke anọ; ọ dịghịkwa na nsụgharị Coptic na Syriac oge ochie. Ma ọ dị na Codex Bezae nke narị afọ nke ise, n’ọdịnala Latin, nakwa n’ọdịnala ọtụtụ ihe odide Byzantine ndị e dere n’oge ndị sochirinụ. N’ihe odide ụfọdụ, akụkọ a dị n’ebe ndị ọzọ, dịka mgbe Jọn 21:25 gasịrị ma ọ bụ mgbe Luk 21:38 gasịrị. Ọtụtụ ndị ọkà mmụta na-ahụ nke a dịka ihe na-egosi na akụkọ ahụ bụbu ọdịnala a na-akọ n’ọnụ nke guzoro iche, nke e mechara tinye n’ọdịnala ihe odide. E debere ya n’ebe a n’ihi na Ndị Kraịst ejirila ya kpọrọ ihe n’ozizi okwukwe na nlekọta ụka ruo ihe dị ka otu puku afọ na narị afọ ise.
    reason: textual_critical
lexical_decisions:
- source_word: πορεύομαι (ἐπορεύθη)
  choice: laa
  rationale: N’ọnọdụ a, ngwaa a na-egosi na onye ọ bụla hapụrụ ebe ahụ gaa n’ụlọ; “laa” bụ ụzọ Igbo kacha ebi ndụ si kwuo ịga n’ụlọ.
- source_word: ἕκαστος
  choice: onye ọ bụla
  rationale: Ọ na-egosi mmadụ n’otu n’otu, ma na-eme ka o doo anya na ha niile gbasara.
- source_word: οἶκος
  choice: ụlọ
  rationale: N’okwu a, εἰς τὸν οἶκον αὐτοῦ bụ akpaalaokwu pụtara ịla n’ụlọ onye ahụ, ọ bụghị ezinụlọ ya dịka otu ndị mmadụ.
- source_word: Καί
  choice: wee
  rationale: “Wee” na-ejikọta amaokwu a na akụkọ bu ya ụzọ ma na-egosi ihe sochiri ya n’ụzọ Igbo na-aga were were.
theological_decisions: []
translation_notes:
  register: Standard Igbo dị mfe, nke ugwu ya dịkwa mma. A họọrọ “laa n’ụlọ” kama nsụgharị mkpụrụokwu siri ike, n’ihi na ọ bụ ụzọ ebumpụta ụwa ndị Igbo si ekwu okwu a. Akara nkọwa [a] dị n’isiokwu amaokwu ahụ dịka a chọrọ.
