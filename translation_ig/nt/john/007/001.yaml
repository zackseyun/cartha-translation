id: JHN.7.1
reference: John 7:1
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Καὶ ⸂μετὰ ταῦτα περιεπάτει ὁ Ἰησοῦς⸃ ἐν τῇ Γαλιλαίᾳ, οὐ γὰρ ἤθελεν ἐν τῇ Ἰουδαίᾳ περιπατεῖν, ὅτι ἐζήτουν αὐτὸν οἱ Ἰουδαῖοι ἀποκτεῖναι.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/001.yaml
  text: And after these things Jesus was walking in Galilee[a], for he did not want to walk in Judea, because the Jews were seeking to kill him.
translation:
  language: ig
  text: Mgbe ihe ndị a gasịrị, Jizọs nọ na-ejegharị na Galili; ọ chọghị ijegharị na Judia, n’ihi na ndị Juu[a] nọ na-achọ igbu ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “ndị Judia” ma ọ bụ “ndị isi Juu.” N’Oziọma Jọn, “ndị Juu” na-ezokarị aka kpọmkwem na ndị isi Juu na Judia ma ọ bụ ndị na-emegide Jizọs n’ọnọdụ akụkọ ahụ, ọ bụghị ndị Juu niile.
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ ταῦτα
  choice: Mgbe ihe ndị a gasịrị
  rationale: Ọ na-edobe ọtụtụ ihe dị na ταῦτα ma na-arụ ọrụ dị ka njikọ oge n’akụkọ ahụ n’Igbo dị ugbu a.
- source_word: περιεπάτει
  choice: nọ na-ejegharị
  rationale: Ụdị a na-egosi omume na-aga n’ihu, dịka imperfect Grik si eme, ma gosipụta ịgagharị n’otu mpaghara.
- source_word: ἐν τῇ Γαλιλαίᾳ
  choice: na Galili
  rationale: Ntụgharị ebe dị mfe nke na-adịghị agbakwunye echiche na ọ gara ebe niile na Galili.
- source_word: οὐ γὰρ ἤθελεν
  choice: ọ chọghị
  rationale: Ọ na-egosi na nke a bụ ihe Jizọs na-achọghị ime, ọ bụghị na ọ pụghị ime ya; njikọ nkọwa γάρ pụtara site n’usoro ahịrịokwu na semicolon.
- source_word: ἐν τῇ Ἰουδαίᾳ περιπατεῖν
  choice: ịga na-ejegharị na Judia
  rationale: Ọ na-edobe nkwughachi nke περιπατέω ma bụrụkwa okwu Igbo doro anya maka ịgagharị n’otu mpaghara.
- source_word: ὅτι
  choice: n’ihi na
  rationale: Ọ na-ewebata ihe kpatara Jizọs ji achọghị ịgagharị na Judia.
- source_word: ἐζήτουν
  choice: nọ na-achọ
  rationale: Ọ na-egosi ebumnuche iro nke na-aga n’ihu, dịka imperfect Grik si dị.
- source_word: οἱ Ἰουδαῖοι
  choice: ndị Juu
  rationale: Ọ na-edobe okwu Grik n’isi ederede; nkọwa ala peeji na-egosi na n’akụkọ Jọn okwu a nwere ike ịpụta ndị Judia ma ọ bụ ndị isi Juu na-emegide Jizọs, ọ bụghị ndị Juu niile.
- source_word: ἀποκτεῖναι
  choice: igbu ya
  rationale: Ntụgharị kpọmkwem, eke, ma doo anya nke infinitive na onye ọ na-emetụta.
theological_decisions:
- issue: Ndị οἱ Ἰουδαῖοι na-ezo aka na ha n’Oziọma Jọn
  choice: E debere “ndị Juu” n’isi ederede ma tinye nkọwa ala peeji.
  alternative: “ndị Judia” ma ọ bụ “ndị isi Juu”
  rationale: Nke a na-edobe obosara okwu mbụ na mgbagwoju anya ya, ma na-egbochi ka a ghọta ya dịka ikpe megide agbụrụ ndị Juu niile; n’ebe a, ọnọdụ akụkọ ahụ na-atụ aka karịsịa n’ebe ndị Juu nọ na Judia, ọkachasị ndị ọchịchị ma ọ bụ ndị mmegide, nọ.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E ji “nọ na-ejegharị” na “nọ na-achọ” gosipụta omume na-aga n’ihu; e debere nkwughachi ngwaa περιπατέω dịka o kwere mee n’Igbo.
