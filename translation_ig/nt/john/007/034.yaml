id: JHN.7.34
reference: John 7:34
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ζητήσετέ με καὶ οὐχ ⸀εὑρήσετε, καὶ ὅπου εἰμὶ ἐγὼ ὑμεῖς οὐ δύνασθε ἐλθεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/034.yaml
  text: You will seek me and will not find me[a], and where I am[b], you are not able to come.
translation:
  language: ig
  text: Unu ga-achọ m ma unu agaghị achọta m[a], ebe m nọ, unu enweghị ike ịbịa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ, kwụsị okwu ahụ ebe a: “Unu ga-achọ m.”'
    reason: lexical_alternative
  - marker: b
    text: 'Ma ọ bụ: “unu apụghị ịbịa.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ζητήσετέ
  choice: unu ga-achọ
  rationale: Okwu a bụ ngwaa ọdịnihu nke na-agwa ọtụtụ mmadụ okwu. “Ga-achọ” bụ Igbo nkịtị ma na-egosi mgbalị ịchọta Jizọs n’ọnọdụ a.
- source_word: με
  choice: m
  rationale: Ọ bụ nnọchiaha onye a na-eme ihe, na-ezo aka na Jizọs.
- source_word: οὐχ εὑρήσετε
  choice: unu agaghị achọta m
  rationale: Nke a na-egosipụta ngwaa ọdịnihu e mere ka ọ bụrụ ihe na-agaghị eme, n’etinyeghị ike nkwusi okwu na-adịghị na Grik.
- source_word: ὅπου
  choice: ebe
  rationale: “Ebe” na-ebute nkebiokwu na-akọ ọnọdụ ma bụrụ okwu Igbo doro anya na nke e ji eme ihe kwa ụbọchị.
- source_word: εἰμὶ ἐγώ
  choice: m nọ
  rationale: “M nọ” na-egosipụta ịdị n’otu ebe nke ọma n’Igbo; usoro nkebiokwu ahụ na-echekwa ọdịiche dị n’etiti “m” na “unu” n’agbanyeghị na a naghị atụkwasị okwu ọzọ maka nkwusi ike.
- source_word: ὑμεῖς
  choice: unu
  rationale: Ọ bụ nnọchiaha onye nke abụọ n’ụdị ọtụtụ, ya mere “unu” na-egosipụta ọnụọgụ ahụ kpọmkwem.
- source_word: οὐ δύνασθε ἐλθεῖν
  choice: unu enweghị ike ịbịa
  rationale: Nsụgharị a na-eme ka echiche nke enweghị ikike ma ọ bụ ike dị na δύνασθε pụta ìhè, kama ime ka ọ dị ka naanị mmachibido iwu.
theological_decisions:
- issue: Ụdị enweghị ike dị n’okwu ahụ, “ebe m nọ, unu enweghị ike ịbịa”
  choice: E gosipụtara ya dịka enweghị ike, n’akọwaghị ma ihe kpatara ya ọ̀ bụ nke omume, nke mmụọ, nke ikpe, ma ọ bụ nke ga-adị nwa oge.
  alternative: “Unu apụghị ịbịa,” nke dị nkenke ma na-eme ka echiche “ike” ghara ịpụta ìhè otú ahụ.
  rationale: δύνασθε na-ekwu banyere ikike ma ọ bụ ike. Amaokwu a n’onwe ya akọwaghị ihe kpatara enweghị ike ahụ, ya mere nsụgharị ahụ anaghị ekpebi ihe ederede ahụ na-ekwughị.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. “Unu” na-echekwa ụdị ọtụtụ nke okwu Grik, ebe “enweghị ike ịbịa” na-eme ka echiche nke enweghị ikike pụta ìhè n’enweghị nkọwa nkà mmụta okpukpe a gbakwụnyere.
