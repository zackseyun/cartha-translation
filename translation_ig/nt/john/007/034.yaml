  source_fidelity: The draft accurately renders the future plural ‘you will seek,’ the negated future ‘you will not find,’ the locative clause, and the statement of inability (not prohibition). ‘Ebe m nọ’ is a faithful idiomatic rendering of ὅπου εἰμὶ ἐγώ, and ‘unu enweghị ike ịbịa’ preserves δύνασθε ἐλθεῖν without defining the reason for the inability.
  naturalness: The main wording is clear, modern Standard Igbo. A comma rather than a semicolon better reflects the continuous Greek coordination and reads more naturally in this short saying. Footnote a as drafted is not idiomatic and does not clearly explain the alternative punctuation.
  terminology: ‘Chọọ/achọta,’ ‘ebe m nọ,’ and ‘enweghị ike ịbịa’ are suitable Standard Igbo choices. The plural ‘unu’ correctly preserves the Greek plural address. No doctrinally loaded terminology has been introduced.
