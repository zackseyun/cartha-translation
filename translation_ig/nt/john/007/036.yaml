  text: τίς ἐστιν ⸂ὁ λόγος οὗτος⸃ ὃν εἶπε· Ζητήσετέ με καὶ οὐχ ⸀εὑρήσετε, καὶ ὅπου εἰμὶ ἐγὼ ὑμεῖς οὐ δύνασθε ἐλθεῖν;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/036.yaml
  text: What is this statement that he said[a], ‘You will seek me and will not find me, and where I am[c][b], you are not able to come’?”
translation:
  language: ig
  text: Gịnị bụ okwu a nke o kwuru[a], ‘Unu ga-achọ m ma unu agaghị achọta m, ma n'ebe m nọ, unu enweghị ike ịbịa’?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Gịnị bụ okwu/okwu ọnụ a nke o kwuru?” N'ọnọdụ a, okwu Grik λόγος nwere ike ịpụta okwu, ihe e kwuru, ozi, ma ọ bụ okwu ọnụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: λόγος
  choice: okwu
  rationale: N'ebe a, “okwu” na-ezo aka n'ihe Jizọs kwuru n'ozuzu ya, ọ bụghị naanị otu mkpụrụokwu. Ọ bụkwa okwu Igbo dị mfe ma kwekọọ n'ụdị ajụjụ ahụ.
- source_word: τίς ἐστιν ὁ λόγος οὗτος
  choice: Gịnị bụ okwu a
  rationale: Nke a na-edobe usoro ajụjụ Grik n'ụzọ doro anya ma bụrụkwa Igbo a na-aghọta nke ọma, kama ịkọwa ya ozugbo dị ka “Gịnị ka okwu a pụtara?”
- source_word: Ζητήσετέ με
  choice: Unu ga-achọ m
  rationale: “Ịchọ” na-egosipụta ζητέω nke ọma ma na-edobe ịdị arọ nke okwu ahụ n'akwụkwọ Jọn.
- source_word: οὐχ εὑρήσετε
  choice: ma unu agaghị achọta m
  rationale: Nke a na-egosipụta ngọnarị ọdịnihu n'ụzọ kwụ ọtọ; e tinyere “m” ọzọ ka okwu ahụ doo anya n'Igbo.
- source_word: ὅπου εἰμὶ ἐγὼ
  choice: ebe m nọkwa
  rationale: 'A na-edobe oge ugbu a nke εἰμί: “ebe m nọ,” ọ bụghị “ebe m na-aga.” Mgbakwunye “-kwa” na-ejikọta nkebiokwu abụọ ahụ dịka καί si eme.'
- source_word: οὐ δύνασθε ἐλθεῖν
  choice: unu enweghị ike ịbịa
  rationale: Nke a bụ ụzọ Igbo dị ndụ ma doo anya isi kwuo na ha enweghị ikike ma ọ bụ ike ịbịa, dịka δύνασθε si gosi.
- source_word: εἶπε
  choice: o kwuru
  rationale: “O kwuru” bụ ntụgharị Igbo kwesịrị ekwesị ma dị mfe maka aorist εἶπε.
theological_decisions:
- issue: Oge ugbu a n'okwu Jizọs (“ebe m nọ”)
  choice: Ebe m nọ
  alternative: Ebe m na-aga
  rationale: Grik ji εἰμί n'oge ugbu a, ya bụ “m nọ.” Idebe ya otú ahụ na-echekwa nghọtahie ma ọ bụ omimi Jọn kpachaara anya hapụ, nke nwere ike imetụta ebe Jizọs si, onye ọ bụ, na mmekọrịta ya na Nna, kama ịgbanwe ya ka ọ bụrụ naanị ebe ọ ga-aga n'ọdịnihu.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. E ji “unu” mee ka ọnụọgụ ọtụtụ nke ngwaa Grik pụta ìhè. E debere okwu Jizọs dịka otu okwu na-aga n'ihu, a na-ejikọta akụkụ ya abụọ site na “-kwa,” dịka καί dị na Grik.
