  yaml_path: translation/nt/john/007/005.yaml
  text: For not even his brothers believed in him[a].
translation:
  language: ig
  text: N’ihi na ọbụna ụmụnne ya ndị nwoke ekweghị na ya[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “N’ihi na ọbụna ụmụnne ya ndị nwoke anọghị na-ekwere na ya.” Ngwaa Grik a dị n’ụdị imperfect; a pụrụ ịsụgharị ya dị ka ihe mere n’oge gara aga (“ekweghị”) ma ọ bụ dị ka ọnọdụ na-aga n’ihu n’oge gara aga (“anọghị na-ekwere”).
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδὲ
  choice: ọbụna … ekweghị
  rationale: Ndị a jikọtara ọnụ na-egosi nkwusi ike nke οὐδὲ, ya bụ, ‘not even,’ n’Igbo dị mfe ma doo anya.
- source_word: γὰρ
  choice: N’ihi na
  rationale: Ọ na-egosi na okwu a na-akọwa ihe mere okwu ndị bu ya ụzọ ji dị otú ahụ.
- source_word: ἀδελφοὶ αὐτοῦ
  choice: ụmụnne ya
  rationale: ‘Ụmụnne ya’ bụ ụzọ Igbo nkịtị si ekwu ndị nwanne mmadụ; n’akụkọ a okwu Grik ahụ bụ ụdị ọtụtụ nke nwoke ma na-ezo aka n’ụmụnne Jizọs ndị nwoke, na-enweghị itinye nkọwa ọzọ n’ahịrịokwu.
- source_word: ἐπίστευον
  choice: ekweghị
  rationale: Ụdị a bụ Igbo ebumpụta ụwa maka nkwenye na-adịghị n’oge gara aga. Ihe imperfect nwere ike igosi omume na-aga n’ihu ka edekọtara n’ala peeji.
- source_word: εἰς αὐτόν
  choice: na ya
  rationale: Mgbe e jikọtara ya na ‘ikwere,’ nke a na-egosi nkwenye ma ọ bụ ntụkwasị obi e tinyere n’ebe ọ nọ; ‘ikwere na ya’ bụ okwu Igbo doro anya ma dịkwa ebumpụta ụwa.
theological_decisions:
- issue: Ihe πιστεύω εἰς αὐτόν pụtara n’akwụkwọ Jọn
  choice: ikwere na Jizọs, ya bụ, inwe nkwenye ma ọ bụ ntụkwasị obi n’ebe ọ nọ
  alternative: ịtụkwasị ya obi
  rationale: Nsụgharị ahụ na-echekwa ụzọ Jọn si ekwu maka nkwenye e tinyere n’ebe Jizọs nọ, ma ọ naghị agbakwụnye ihe kpatara enweghị nkwenye ha ma ọ bụ nkwubi okwu ozizi ọzọ.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị mfe ma nwee ugwu. Ahịrịokwu ahụ na-edobe njikọ nkọwa nke γὰρ, nkwusi ike nke οὐδὲ, na nghọta abụọ enwere ike inwe banyere imperfect.
