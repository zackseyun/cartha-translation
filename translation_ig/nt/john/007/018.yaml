  - marker: c
    text: Ma ọ bụ, “ajọ omume” ma ọ bụ “ikpe na-ezighị ezi.”
    reason: lexical_alternative
  revision_rationale: The revision retains the source’s syntax and ambiguity while using a broader, more natural Igbo expression for ἀδικία and correcting the first lexical alternative so that it remains within the semantic range of speaking from oneself/on one’s own authority.
