id: JHN.7.18
reference: John 7:18
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ ἀφ’ ἑαυτοῦ λαλῶν τὴν δόξαν τὴν ἰδίαν ζητεῖ· ὁ δὲ ζητῶν τὴν δόξαν τοῦ πέμψαντος αὐτὸν οὗτος ἀληθής ἐστιν καὶ ἀδικία ἐν αὐτῷ οὐκ ἔστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/018.yaml
  text: The one who speaks from himself seeks his own glory[a]; but the one who seeks the glory of the one who sent him, this one is true[c][b], and there is no unrighteousness in him.
translation:
  language: ig
  text: Onye na-ekwu okwu site n’onwe ya[a] na-achọ otuto nke aka ya; ma onye na-achọ otuto nke Onye zitere ya, onye ahụ bụ onye eziokwu[b], ọ dịghịkwa ihe na-ezighị ezi[c] n’ime ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “n’onwe ya” ma ọ bụ “site n’ikike nke aka ya.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “onye na-ekwu eziokwu” ma ọ bụ “onye a pụrụ ịtụkwasị obi.”
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “ajọ omume” ma ọ bụ “ikpe na-ezighị ezi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφ’ ἑαυτοῦ
  choice: site n’onwe ya
  rationale: Nke a na-edobe oyiyi okwu Grik, ‘site n’onwe ya,’ ma na-ahapụkwa ihe ọ pụrụ ịpụta—ikwu okwu n’uche onwe onye ma ọ bụ n’ike aka ya—n’enweghị ịkọwa ya karịa ihe ederede kwuru.
- source_word: λαλῶν
  choice: na-ekwu okwu
  rationale: Ọ na-egosi omume onye ahụ n’ozuzu ya ma dabara nke ọma n’Igbo dịka nkebiokwu na-akọwa ụdị onye a na-ekwu maka ya.
- source_word: δόξαν
  choice: otuto
  rationale: ‘Otuto’ na-egosi nsọpụrụ ma ọ bụ ebube mmadụ na-achọ ka e nye ya, ma dabara n’ebe abụọ ahụ iji chekwaa myiri okwu dị na Grik.
- source_word: τὴν ἰδίαν
  choice: nke aka ya
  rationale: Nkebiokwu a bụ ụzọ Igbo si ekwu ihe bụ nke mmadụ n’onwe ya, ma na-eme ka ọdịiche ya na otuto nke Onye zitere ya pụta ìhè.
- source_word: ζητεῖ
  choice: na-achọ
  rationale: ‘Na-achọ’ bụ ntụgharị kpọmkwem ma bụrụkwa okwu Igbo dị ndụ; e ji otu okwu ahụ mee ihe ugboro abụọ iji chekwaa nhazi yiri ibe ya nke amaokwu ahụ.
- source_word: τοῦ πέμψαντος αὐτόν
  choice: nke Onye zitere ya
  rationale: Nke a na-edobe onye mere iziga ahụ dịka mmadụ a kapịrị ọnụ, dịka participle nwere article dị na Grik si eme.
- source_word: οὗτος
  choice: onye ahụ
  rationale: ‘Onye ahụ’ na-echekwa nkwusi ike nke demonstrative Grik karịa iji naanị nnọchiaha ‘ọ.’
- source_word: ἀληθής
  choice: onye eziokwu
  rationale: N’Igbo, ‘onye eziokwu’ na-ekwupụta na onye ahụ bụ ezigbo onye a pụrụ ịtụkwasị obi ma na-ekwu eziokwu, na-enweghị ime ka okwu ahụ bụrụ naanị eziokwu nke otu nkwupụta.
- source_word: ἀδικία
  choice: ajọ omume
  rationale: ‘Ajọ omume’ na-eburu echiche sara mbara nke ihe na-ezighị ezi n’omume; ọ naghị eme ka okwu ahụ bụrụ naanị ikpe na-ezighị ezi n’etiti mmadụ na ibe ya.
- source_word: ἐν αὐτῷ οὐκ ἔστιν
  choice: adịghịkwa n’ime ya
  rationale: Nke a na-echekwa usoro ịdị adị na ọnọdụ dị n’ime onye ahụ nke Grik kwuru, ma bụrụ Igbo doro anya.
theological_decisions:
- issue: Ọdịiche dị n’etiti ikwu okwu ‘site n’onwe ya’ na ịchọ otuto nke onye zitere mmadụ
  choice: E debere okwu ahụ dịka ọdịiche dị n’etiti okwu sitere n’onwe mmadụ nke na-achọ otuto onwe ya na omume onye na-achọ otuto nke onye zitere ya.
  alternative: Ịkọwa ‘site n’onwe ya’ kpọmkwem dịka ‘n’ike nke aka ya,’ ma ọ bụ ime ka okwu ahụ bụrụ naanị nkwupụta banyere ndị nkuzi ụgha na Jizọs.
  rationale: Ihe gbara amaokwu ahụ gburugburu metụtara ebe nkuzi si bịa na ebumnuche onye na-akụzi. Ntụgharị a na-echekwa echiche iziga na otuto n’etinyeghị nkọwa ozizi karịrị ihe Grik kwuru.
- issue: Uzo e si ghọta ἀληθής
  choice: onye eziokwu
  alternative: onye na-ekwu eziokwu; onye kwesiri ntukwasi obi
  rationale: Okwu Grik nwere ike igosi ịbụ eziokwu, ikwu eziokwu, na ịbụ onye a pụrụ ịtụkwasị obi. ‘Onye eziokwu’ na-ahapụ obosara echiche ahụ ka ọ dị.
- issue: Uzo e si ghọta ἀδικία
  choice: ajọ omume
  alternative: ikpe na-ezighi ezi; ihe na-ezighi ezi
  rationale: N’ebe a, okwu ahụ na-ekwu banyere ịdị ọcha na izi ezi nke onye ahụ n’omume. ‘Ajọ omume’ na-echekwa ịdị sara mbara nke echiche ahụ karịa ịgbachi ya naanị n’ikpe na-ezighị ezi.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta, dee ya. E debere myiri ahịrịokwu abụọ ahụ site n’iji ‘na-achọ otuto’ ugboro abụọ. E dere ‘Onye’ n’isi mkpụrụedemede n’ebe ọ na-arụtụ aka n’Onye zitere ya, dịka nsọpụrụ ederede Igbo a na-ahụkarị, n’agbanyeghị na Grik n’onwe ya enweghị ọdịiche mkpụrụedemede ukwu na nta n’ụzọ a.
