revisions:
- from: Onye na-ekwu okwu site n’onwe ya[a] na-achọ otuto nke aka ya; ma onye na-achọ otuto nke Onye zitere ya, onye ahụ bụ onye eziokwu[b], ajọ omume[c] adịghịkwa n’ime ya.
  to: Onye na-ekwu okwu site n’onwe ya[a] na-achọ otuto nke aka ya; ma onye na-achọ otuto nke Onye zitere ya, onye ahụ bụ onye eziokwu[b], ọ dịghịkwa ihe na-ezighị ezi[c] n’ime ya.
  rationale: The revision retains the source’s syntax and ambiguity while using a broader, more natural Igbo expression for ἀδικία and correcting the first lexical alternative so that it remains within the semantic range of speaking from oneself/on one’s own authority.
  reviewer_model: gpt-5.6-terra
