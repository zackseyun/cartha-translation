- from: Unu ekpela ikpe dị ka ihe anya na-ahụ si dị,[a] kama kpeenụ ikpe ziri ezi.
  to: Unu ekpela ikpe n’ile anya,[a] kama kpeenụ ikpe ziri ezi.
  rationale: The revision replaces the expanded expression for “according to appearance” with the idiomatic Standard Igbo phrase “n’ile anya,” while retaining the source’s contrast and the morally and judicially broad sense of “righteous judgment.” The footnote supplies a clear alternative that makes the outward/surface sense explicit.
