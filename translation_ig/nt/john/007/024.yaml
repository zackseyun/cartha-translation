  text: μὴ κρίνετε κατ’ ὄψιν, ἀλλὰ τὴν δικαίαν κρίσιν ⸀κρίνετε.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/024.yaml
  text: Do not judge according to appearance[a], but judge with righteous judgment.
translation:
  language: ig
  text: Unu ekpela ikpe n’ile anya,[a] kama kpeenụ ikpe ziri ezi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ: “Unu ekpela ikpe n’ihi ihe pụtara n’èzí, kama kpeenụ ikpe ziri ezi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ κρίνετε
  choice: Unu ekpela ikpe
  rationale: Iwu a na-egbochi ime ihe; ntụgharị a dị nkenke ma doo anya, na-enweghị ịmanye echiche bụ́ ‘kwụsịnụ’ n'ụdị ngwaa ahụ.
- source_word: κατ’ ὄψιν
  choice: dị ka ihe anya na-ahụ si dị
  rationale: Nkebiokwu a na-ekwu maka ikpe e mere site n'ihe a na-ahụ n'elu ma ọ bụ echiche mbụ mmadụ nwetara; Igbo a bụ nke eke ma na-edobe echiche ahụ.
- source_word: ἀλλὰ
  choice: kama
  rationale: Ọ na-egosi ọdịiche siri ike n'etiti ụzọ ikpe a machibidoro na ụzọ ikpe e nyere n'iwu.
- source_word: τὴν δικαίαν κρίσιν
  choice: ikpe ziri ezi
  rationale: Nke a na-edobe ma echiche nke ikpe ma àgwà ya nke ịdị ezi, n'Igbo dị mfe ma dị ugwu.
- source_word: κρίνετε
  choice: kpeenụ ikpe
  rationale: 'Ikwughachi okwu metụtara ikpe na-edobe ndakọrịta okwu dị n''asụsụ Grik: e buru ụzọ machibido otu ụdị ikpe, mesịa nye iwu ka e kpee n''ụzọ ziri ezi.'
theological_decisions:
- issue: Ịsụgharị δικαίαν n'ọnọdụ metụtara omume ọma na ikpe
  choice: ziri ezi
  alternative: kwesịrị ekwesị
  rationale: ‘Ziri ezi’ na-eburu echiche nke ihe kwụ ọtọ n'omume na n'ikpe, na-enweghị ime ka okwu ahụ bụrụ naanị usoro iwu ụlọikpe.
translation_notes:
  register: 'Standard Igbo dị ugbu a, dị mfe nghọta ma dị ugwu. E ji ‘unu’ gosipụta na iwu abụọ ahụ bụ nke ọtụtụ mmadụ. A hapụrụ esemokwu dị n''amaokwu ahụ n''ụzọ doro anya: ọ bụghị ikpe niile ka a machibidoro, kama ọ bụ ikpe dabere nanị n''ihe anya na-ahụ; a na-enye iwu ka ikpe bụrụ nke ziri ezi.'
