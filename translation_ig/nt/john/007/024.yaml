review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys both imperatives and the contrast between prohibited superficial judgment and required righteous/just judgment. However, “dị ka ihe anya na-ahụ si dị” is an overly expanded and less idiomatic rendering of κατ’ ὄψιν.
  naturalness: “N’ile anya” is concise, standard, and natural Igbo for judging by what is seen/appearance. The imperative pair “Unu ekpela ikpe … kama kpeenụ ikpe ziri ezi” is clear and suitably formal.
  terminology: “Ikpe ziri ezi” faithfully renders δικαίαν κρίσιν without forcing either a narrowly legal or a denominational sense. Repetition of “ikpe” appropriately reflects the Greek rhetorical parallelism.
  issues:
  - severity: medium
    issue: The main rendering of κατ’ ὄψιν is cumbersome.
    rationale: “Dị ka ihe anya na-ahụ si dị” is intelligible but sounds paraphrastic and syntactically heavy in Standard Igbo. “N’ile anya” more directly and idiomatically expresses judgment based on appearance.
  - severity: low
    issue: The footnote alternative uses an unnatural phrase.
    rationale: “Ọdịdị elu” is not the clearest natural Standard Igbo expression for outward appearance in this context; “ihe pụtara n’èzí” is clearer.
  revised_text: Unu ekpela ikpe n’ile anya,[a] kama kpeenụ ikpe ziri ezi.
