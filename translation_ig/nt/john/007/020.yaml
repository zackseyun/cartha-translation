id: JHN.7.20
reference: John 7:20
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀπεκρίθη ὁ ⸀ὄχλος· Δαιμόνιον ἔχεις· τίς σε ζητεῖ ἀποκτεῖναι;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/020.yaml
  text: The crowd answered[a], “You have a demon. Who is seeking to kill you?”
translation:
  language: ig
  text: Ìgwè mmadụ ahụ zara, sị, “Ị nwere mmụọ ọjọọ.[a] Ònye na-achọ igbu gị?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Mmụọ ọjọọ ji gị.” N’ụzọ nkịtị, “Ị nwere mmụọ ọjọọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: zara ya, sị
  rationale: Nke a bụ ụzọ Igbo nkịtị si webata nzaghachi n’akụkọ mkparịta ụka; ‘ya’ na-eme ka onye a zara doo anya n’asụsụ Igbo.
- source_word: ὄχλος
  choice: ìgwè mmadụ ahụ
  rationale: Ọ na-egosi ìgwè ndị mmadụ nọ n’ebe ahụ, ma na-ezere okwu ochie ma ọ bụ nke na-adịghị adị mfe nghọta.
- source_word: Δαιμόνιον ἔχεις
  choice: Ị nwere mmụọ ọjọọ
  rationale: Nke a na-edobe usoro okwu Grik ahụ, ‘ị nwere mmụọ ọjọọ,’ kama ịtụgharị ya ozugbo ka ọnọdụ nke mmụọ ọjọọ ji mmadụ.
- source_word: τίς
  choice: Ònye
  rationale: A hapụrụ ya dịka ajụjụ kpọmkwem, dịka ihe odide Grik si dị, n’agbanyeghị na ọ nwere ike ịbụ ajụjụ e ji agọnahụ ebubo ahụ.
- source_word: ζητεῖ
  choice: na-achọ
  rationale: Ọ na-egosipụta omume na-aga n’ihu ma na-ada nke ọma n’Igbo ugbu a.
- source_word: ἀποκτεῖναι
  choice: igbu
  rationale: Ọ bụ ntụgharị doro anya na nke nkịtị nke ngwaa ahụ, na-enweghị ịgbakwunye echiche gbasara iwu ma ọ bụ ikpe ọmụma.
theological_decisions:
- issue: Otú e si sụgharị δαιμόνιον n’ebubo a boro Jizọs
  choice: Ị nwere mmụọ ọjọọ
  alternative: Mmụọ ọjọọ ji gị
  rationale: Nhọrọ a na-edobe okwu ebubo nke ìgwè mmadụ ahụ dịka Grik si kwuo ya, n’enweghị ime ka onye na-agụ ya chee na onye dere akụkọ ahụ kwadoro ebubo ahụ, ma ọ bụ ịkọwa kpọmkwem ụdị ikike mmụọ ahụ nwere n’ahụ mmadụ.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji ‘ìgwè mmadụ’ mee ka ὄχλος doo anya, ebe ‘Ị nwere mmụọ ọjọọ’ na-edobe ọdịdị okwu Grik na mgbagwoju echiche dị na ebubo ahụ.
