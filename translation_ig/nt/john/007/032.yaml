  text: Ἤκουσαν οἱ Φαρισαῖοι τοῦ ὄχλου γογγύζοντος περὶ αὐτοῦ ταῦτα, καὶ ἀπέστειλαν ⸂οἱ ἀρχιερεῖς καὶ οἱ Φαρισαῖοι ὑπηρέτας⸃ ἵνα πιάσωσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/032.yaml
  text: The Pharisees heard the crowd muttering these things about him[c][b][a], and the chief priests and the Pharisees sent officers to seize him.
translation:
  language: ig
  text: Ndị Farisii nụrụ ka ìgwè mmadụ ahụ nọ na-atamu ntamu, na-ekwu ihe ndị a banyere ya[a]; ndị isi nchụàjà na ndị Farisii wee ziga ndị nche[b] ka ha jide ya[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “na-eme mkpesa nwayọ nwayọ” ma ọ bụ “na-ekwu okwu n’olu dị ala.” Okwu Grik ahụ na-egosi okwu e ji olu dị ala ekwu, nke nwere ike igosi enweghị afọ ojuju.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ndị nche ụlọ nsọ” ma ọ bụ “ndị ọrụ.” Okwu Grik ahụ na-ekwu banyere ndị nlekọta ma ọ bụ ndị ọrụ e nyere ọrụ ọchịchị.
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “ka ha nwụchie ya.” N’ụzọ nkịtị karị, okwu Grik ahụ pụtara “ka ha jide ya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἤκουσαν
  choice: nụrụ
  rationale: Okwu a na-egosi na ndị Farisii nụrụ ihe ìgwè mmadụ ahụ na-ekwu; “nụrụ” bụ okwu Igbo doro anya ma kwekọọ n’aorist a.
- source_word: τοῦ ὄχλου
  choice: ìgwè mmadụ ahụ
  rationale: Nke a na-ezo aka n’ìgwè ndị mmadụ gbakọtara ebe ahụ; ọ bụ okwu Igbo nkịtị ma doo anya.
- source_word: γογγύζοντος
  choice: na-atamu ntamu
  rationale: Ọ na-egosi okwu e ji olu dị ala ekwu n’etiti onwe ha, nke pụrụ inwe afọ ojuju na-adịghị; “na-atamu ntamu” na-edobe ndò pụtara ahụ.
- source_word: περὶ αὐτοῦ ταῦτα
  choice: banyere ya n’ihe ndị a
  rationale: Nhazi a na-edobe ma ‘banyere ya’ ma ọtụtụ nke ταῦτα, ya bụ ihe ndị a na-ekwu.
- source_word: οἱ ἀρχιερεῖς
  choice: ndị isi nchụàjà
  rationale: Ọ na-ezo aka n’òtù ndị ndu nchụàjà, ọ bụghị ọtụtụ ndị isi nchụàjà kacha elu n’otu oge.
- source_word: ὑπηρέτας
  choice: ndị nche
  rationale: N’ọnọdụ a, ndị a bụ ndị ọrụ ọchịchị ndị ndu Juu zigara ijide Jizọs; “ndị nche” bụ Igbo eke ma ghara ịkọwa ụlọ ọrụ ha karịa ihe Grik kwuru.
- source_word: ἵνα πιάσωσιν αὐτόν
  choice: ka ha jide ya
  rationale: “Ka” na-egosi ebumnuche, ebe “jide ya” na-edobe echiche nke ijide mmadụ n’ike n’enweghị ịmanye nkọwa iwu nke ‘ịkpọchie ya.’
theological_decisions:
- issue: Ụdị ọrụ ndị a kpọrọ ὑπηρέτας
  choice: ndị nche nọ n’okpuru ikike ndị isi nchụàjà na ndị Farisii
  alternative: ndị ọrụ; ndị uwe ojii ụlọ nsọ
  rationale: “Ndị nche” na-egosi ọrụ ha n’ịga ijide Jizọs, ma ọ naghị etinye nkọwa doro nnọọ anya banyere nhazi ụlọ nsọ nke okwu Grik n’onwe ya na-ekwughị kpọmkwem.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta mee ntụgharị ahụ. A họọrọ “na-atamu ntamu” iji gosipụta okwu e ji olu dị ala ekwu, “ndị nche” iji gosipụta ọrụ gọọmenti ha n’enweghị nkọwa gabigara isi iyi, na “jide ya” iji debe ọdịdị kpọmkwem nke πιάζω. Akara nkọwa ala peeji [a], [b], na [c] niile dị n’ederede.
