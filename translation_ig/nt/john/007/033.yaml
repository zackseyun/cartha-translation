  to: Ya mere, Jizọs sịrị, “M ka nọnyere unu obere oge[a], ma ana m alakwuru onye zitere m[b].”
  rationale: Replaced the additive -kwa with explicit non-additive coordination (“ma”) and the progressive form “ana m alakwuru.” This preserves the Greek present-form expression of imminent departure without introducing “also” or making the sender explicit. Footnote anchors and their content remain appropriate.
