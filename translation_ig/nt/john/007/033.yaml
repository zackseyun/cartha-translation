  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἶπεν οὖν ὁ Ἰησοῦς· Ἔτι ⸂χρόνον μικρὸν⸃ μεθ’ ὑμῶν εἰμι καὶ ὑπάγω πρὸς τὸν πέμψαντά με.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/033.yaml
  text: So Jesus said[a], “I am with you a little while longer[b], and I am going to the one who sent me.”
translation:
  language: ig
  text: Ya mere, Jizọs sịrị, “M ka nọnyere unu obere oge[a], ma ana m alakwuru onye zitere m[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “Mụ na unu ka ga-anọ nwa obere oge.”
    reason: lexical_alternative
  - marker: b
    text: N’ọnọdụ sara mbara nke Oziọma Jọn, “onye zitere m” na-ezo aka na Nna.
    reason: cross_reference
lexical_decisions:
- source_word: οὖν
  choice: Ya mere
  rationale: Ọ na-egosi njikọ nke okwu a na ihe ndị bu ya ụzọ, ma na-edobe nghọta nke ‘ya mere/ọ bụ ya mere’ n’asụsụ Igbo dị ugbu a.
- source_word: Ἔτι χρόνον μικρόν
  choice: obere oge
  rationale: ‘Ka’ dị n’ahịrịokwu ahụ na-egosi ἔτι, ya bụ na oge fọdụrụ ka dị; ‘obere oge’ na-egosikwa χρόνον μικρόν n’ụzọ Igbo na-asụkarị.
- source_word: μεθ’ ὑμῶν εἰμι
  choice: M ka nọnyere unu
  rationale: Nke a na-edobe echiche nke ịnọnyere ndị na-ege ya ntị ugbu a, tinyere ịdịgide obere oge ọzọ, n’enweghị ịgbanwe ya ka ọ bụrụ naanị okwu gbasara ọdịnihu.
- source_word: καὶ ὑπάγω
  choice: m na-alakwurukwa
  rationale: ‘Na-ala’ na-egosipụta ọpụpụ ahụ dịka ihe na-eru nso, ebe ‘-kwa’ na-ejikọta ya na nkebi okwu bu ya ụzọ dịka καί si eme.
- source_word: πρὸς τὸν πέμψαντά με
  choice: onye zitere m
  rationale: Nke a na-edobe participle ahụ dịka aha—‘onye zitere m’—n’agbakwụnyeghị ‘Nna’ n’ahịrịokwu bụ isi.
theological_decisions:
- issue: Onye a na-akpọ ‘onye zitere m’
  choice: Edobere ya dịka ‘onye zitere m.’
  alternative: ‘Nna zitere m’ ma ọ bụ ‘Nna ahụ zitere m.’
  rationale: N’ozuzu Oziọma Jọn, onye ahụ bụ Nna; ma n’amaokwu a Grik ekwughị ‘Nna’ kpọmkwem. Ya mere, ntụgharị ahụ na-edobe ụzọ Jizọs si kwuo ya, ebe nkọwa ala peeji na-akọwa onye ọ bụ n’ọnọdụ sara mbara.
translation_notes:
  register: E ji Standard Igbo nke dị mfe, dị ugwu, ma bụrụkwa nke ndị mmadụ na-asụ ugbu a. ‘Nọnyere’ na ‘alakwuru’ na-eme ka mmekọrịta na ebe a na-aga doo anya, ebe a na-edobe nhụsianya dị n’okwu Grik banyere oge ọpụpụ ahụ.
