id: JHN.7.6
reference: John 7:6
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: λέγει οὖν αὐτοῖς ὁ Ἰησοῦς· Ὁ καιρὸς ὁ ἐμὸς οὔπω πάρεστιν, ὁ δὲ καιρὸς ὁ ὑμέτερος πάντοτέ ἐστιν ἕτοιμος.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/006.yaml
  text: So Jesus said to them[a], “My time has not yet come, but your time is always ready.”
translation:
  language: ig
  text: Ya mere, Jizọs sịrị ha[a], “Oge m erubeghị, ma oge unu dị njikere mgbe niile.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Oge e kara m aka erubeghị.” Okwu Grik e ji mee ihe nwere ike ịpụta oge kwesịrị ekwesị ma ọ bụ oge a kara aka, ọ bụghị naanị oge n'ozuzu ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Ya mere
  rationale: Na-egosi njikọ nkwubi okwu ma ọ bụ ihe akụkọ ahụ gara n'ihu; ọ bụ okwu Igbo doro anya ma kwekọọ n'ọnọdụ a.
- source_word: λέγει ... ὁ Ἰησοῦς
  choice: Jizọs sịrị
  rationale: Ọ bụ ezie na Grik ji oge ugbu a n'akụkọ, oge gara aga bụ ụzọ Igbo sitere n'okike si akọ ihe mere.
- source_word: αὐτοῖς
  choice: ha
  rationale: Na-edobe onye nnata okwu dị ka nnọchiaha n'enweghị ịkọwapụta ndị ọ bụ karịa ka amaokwu ahụ mere.
- source_word: καιρός
  choice: oge
  rationale: ‘Oge’ bụ okwu Igbo dị mfe ma saa mbara nke nwere ike ịpụta oge kwesịrị ekwesị ma ọ bụ oge a kara aka; nkọwa ala peeji na-echekwa nghọta ahụ.
- source_word: ὁ καιρὸς ὁ ἐμός
  choice: Oge m
  rationale: Na-echekwa ọdịiche siri ike dị n'etiti oge Jizọs na oge ndị ọ na-agwa okwu, n'Igbo sitere n'okike.
- source_word: οὔπω πάρεστιν
  choice: erubeghị
  rationale: Na-egosi n'ụzọ dị mkpirikpi na oge ahụ abịabeghị ruo ugbu a.
- source_word: δὲ
  choice: ma
  rationale: Na-egosipụta ọdịiche dị n'etiti oge Jizọs na nke ha.
- source_word: ὁ καιρὸς ὁ ὑμέτερος
  choice: oge unu
  rationale: Na-eme ka nhazi na ọdịiche nke nkebiokwu mbụ nọgide.
- source_word: πάντοτέ
  choice: mgbe niile
  rationale: Ọ bụ ụzọ Igbo nkịtị si kwuo ‘n'oge niile’ ma ọ bụ ‘mgbe nile.’
- source_word: ἕτοιμος
  choice: dị njikere
  rationale: Na-asụgharị echiche nke ịdị njikere n'ụzọ doro anya, na-ahapụghị ihe ederede ahụ kwuru.
theological_decisions:
- issue: Ihe ‘oge m’ nke Jizọs pụtara n'ọnọdụ Oziọma Jọn
  choice: Oge m
  alternative: Oge a kara m aka; Oge awa m
  rationale: E ji καιρός mee ihe ebe a, ọ bụghị ὥρα. Ya mere, a naghị etinye ‘oge awa’ ma ọ bụ kọwaa kpọmkwem ọrụ na ebube Jizọs n'ime isi ederede; a na-echekwa mgbagwoju na mkpa nkà mmụta okpukpe nke okwu ahụ.
translation_notes:
  register: Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E debere ahịrịokwu ahụ n'ụdị mkpirikpi, a na-ejikwa ‘unu’ gosipụta na Jizọs na-agwa ihe karịrị otu onye okwu.
