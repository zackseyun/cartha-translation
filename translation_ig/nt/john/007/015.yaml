id: JHN.7.15
reference: John 7:15
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸂ἐθαύμαζον οὖν⸃ οἱ Ἰουδαῖοι λέγοντες· Πῶς οὗτος γράμματα οἶδεν μὴ μεμαθηκώς;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/015.yaml
  text: So the Jews were marveling[a], saying[b], “How does this man know letters without having studied?”
translation:
  language: ig
  text: Ya mere, ndị Juu[a] nọ na-eju anya, na-asị, “Olee otú nwoke a si mara akwụkwọ[b], ebe ọ na-amụtabeghị?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’ọnọdụ a, “ndị Juu” na-ezo aka n’ndị Juu nọ na Jerusalem bụ́ ndị na-agwa Jizọs okwu ma ọ bụ na-emegide ya, ma eleghị anya tinyere ndị ọchịchị Judia; ọ naghị ezo aka ná ndị Juu niile.
    reason: cultural_note
  - marker: b
    text: 'Ma ọ bụ, “Olee otú nwoke a si nwee ụdị ihe ọmụma a?” N’asụsụ Grik, n’ụzọ nkịtị: “mara mkpụrụedemede.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐθαύμαζον
  choice: nọ na-atụ n’anya
  rationale: Ọdịdị imperfect na-egosi mmeghachi omume na-aga n’ihu; okwu a bụ Igbo nkịtị ma na-egosipụta ihe ijuanya ha.
- source_word: οὖν
  choice: Ya mere
  rationale: Na-ejikọta mmeghachi omume a na ihe mere n’amaokwu ndị bu ya ụzọ, n’ụzọ doro anya ma dị ebube.
- source_word: οἱ Ἰουδαῖοι
  choice: ndị Juu
  rationale: Nke a na-edobe okwu Grik n’enweghị ime ka ndị e zoro aka na ha bụrụ naanị ndị isi; ihe odide ala peeji na-akọwa onye okwu a na-ezo aka na ya n’ọnọdụ a.
- source_word: λέγοντες
  choice: na-asị
  rationale: Na-egosipụta participle nke na-ewebata okwu ha kwuru ma kwekọọ na omume na-aga n’ihu.
- source_word: Πῶς
  choice: Olee otú
  rationale: Ọ bụ ụzọ Igbo sitere n’okike isi jụọ ajụjụ gbasara ụzọ ihe si kwe omume.
- source_word: οὗτος
  choice: nwoke a
  rationale: Na-enye echiche nke ‘onye a’ n’ụzọ dabara adaba n’Igbo, ma na-edobe obere ịdị anya dị n’okwu ahụ.
- source_word: γράμματα
  choice: ihe odide
  rationale: Na-edobe ihe oyiyi bụ isi nke γράμματα, ma nwekwaa ike ịpụta ọmụmụ na ihe ọmụma e ji akwụkwọ enweta; ihe odide ala peeji na-enye nkọwa ọzọ.
- source_word: οἶδεν
  choice: mara
  rationale: Na-egosipụta ọnọdụ nke inwe ihe ọmụma n’ụzọ dị mkpirikpi ma bụrụ Igbo nkịtị.
- source_word: μὴ μεμαθηκώς
  choice: ebe ọ na-agụghị akwụkwọ
  rationale: Na-egosipụta na ọ nataghị ọmụmụ a na-anabata dị ka nke iwu, n’enweghị ịkpọ kpọmkwem ụlọ akwụkwọ ma ọ bụ usoro ndị rabaị.
theological_decisions:
- issue: Onye okwu οἱ Ἰουδαῖοι na-ezo aka na ya n’Oziọma Jọn
  choice: ndị Juu
  alternative: ndị isi ndị Juu; ndị Judia
  rationale: E debere okwu sara mbara nke Grik n’isi amaokwu ka a ghara itinye nkọwa dị warara n’ime ntụgharị; ihe odide ala peeji na-egbochi nghọta na-ezighị ezi nke ga-eme ka okwu ahụ gbasaa ruo ndị Juu niile.
- issue: Ihe γράμματα pụtara n’ajụjụ a
  choice: ihe odide
  alternative: ọmụmụ; ihe ọmụma; Akwụkwọ Nsọ
  rationale: Okwu Grik nwere ike ịpụta mkpụrụedemede ma ọ bụ, n’ụzọ sara mbara, ọmụmụ e ji akwụkwọ enweta. ‘Ihe odide’ na-edobe okwu ahụ ka ọ ghara ịkọwapụta ya gabiga ókè, ebe ihe odide ala peeji na-eme ka echiche ya doo anya.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta, dee ya. A họọrọ usoro na-aga n’ihu ‘nọ na-atụ n’anya, na-asị’ iji chekwaa mmetụta imperfect na participle Grik. E debere ‘ndị Juu’ n’isi amaokwu ma kọwaa oke onye ọ na-ezo aka na ya n’ihe odide ala peeji.
