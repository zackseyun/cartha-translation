id: JHN.7.26
reference: John 7:26
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἴδε παρρησίᾳ λαλεῖ καὶ οὐδὲν αὐτῷ λέγουσιν· μήποτε ἀληθῶς ἔγνωσαν οἱ ἄρχοντες ὅτι οὗτός ⸀ἐστιν ὁ χριστός;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/026.yaml
  text: And look[a], he is speaking openly, and they say nothing to him. Can it be that the rulers truly know that this is the Messiah?
translation:
  language: ig
  text: Lee, ọ na-ekwu okwu n’ihu ọha, ma ha anaghị agwa ya ihe ọ bụla. Ọ̀ ga-abụ na ndị ọchịchị amatala n’ezie na onye a bụ Mesaịa ahụ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Ndị ọchịchị hà maara n’ezie na onye a bụ Mesaịa ahụ?”
    reason: Ụzọ ọzọ e si ekwupụta ajụjụ μήποτε n’Igbo; ọ na-edobe obi abụọ ahụ, ma ọ naghị eme ka echiche nke ihe ijuanya pụta ìhè dịka “Ọ̀ ga-abụ na.”
lexical_decisions:
- source_word: ἴδε
  choice: Lee
  rationale: E ji “Lee” mee ka ndị na-ege ntị tụgharịa uche ha n’ihe na-eme; ọ bụ okwu Igbo dị ndụ ma kwekọọ n’ọrụ interjection a.
- source_word: παρρησίᾳ
  choice: n’ihu ọha
  rationale: N’ebe a, okwu ahụ na-egosi ikwu okwu n’ụzọ ghe oghe n’ihu mmadụ niile. Nke a na-ezere ịgbakwunye echiche nke obi ike nke okwu Grik ahụ na-adịghị amanye n’amaokwu a.
- source_word: λαλεῖ
  choice: ọ na-ekwu okwu
  rationale: Ụdị a na-egosi na Jizọs nọ na-ekwu okwu n’oge ahụ, dịka present tense nke Grik si gosi.
- source_word: οὐδὲν αὐτῷ λέγουσιν
  choice: ha anaghị agwa ya ihe ọ bụla
  rationale: Nke a na-edobe dative αὐτῷ dịka “ya” ma ghara ịgbakwunye “megide ya,” nke bụ nkọwa a pụrụ ịghọta site n’ọnọdụ ahụ ma ọ bụghị ihe e kwuru kpọmkwem.
- source_word: μήποτε
  choice: Ọ̀ ga-abụ na
  rationale: Ajụjụ a na-egosi echiche a na-atụ n’anya ma na-enyo enyo, ọ bụghị nkwupụta doro anya ma ọ bụ naanị ịjụ ihe ahụ kpamkpam.
- source_word: ἀληθῶς
  choice: n’ezie
  rationale: “N’ezie” na-ebute ike adverb ahụ n’Igbo nkịtị ma dị ùgwù.
- source_word: ἔγνωσαν
  choice: amatala
  rationale: Perfect Igbo a na-egosi na ndị ọchịchị nwere ike ịbụ ndị bịarutere n’ịmata ma ọ bụ n’ịghọta onye ọ bụ, ma ọ naghị eme ka okwu ahụ bụrụ naanị ‘ịmata ihu.’
- source_word: οἱ ἄρχοντες
  choice: ndị ọchịchị
  rationale: Nke a na-ezo aka n’ebe a n’ebe ndị isi nwere ikike nọ, ma na-anọgide nso n’echiche lexical nke okwu Grik ahụ.
- source_word: ὅτι οὗτός ἐστιν ὁ χριστός
  choice: na onye a bụ Mesaịa ahụ
  rationale: Χριστός bụ aha ọkwa e tere mmanụ n’ọnọdụ a; “Mesaịa” na-echekwa ntọala ndị Juu na ajụjụ ìgwè mmadụ ahụ.
theological_decisions:
- issue: Ntụgharị ὁ χριστός dịka aha ọkwa
  choice: Mesaịa ahụ
  alternative: Kraịst ahụ
  rationale: N’amaokwu a, ìgwè mmadụ na-ajụ ma onye a ọ̀ bụ Mesaịa ahụ a na-atụ anya ya; ya mere a sụgharịrị ya dịka aha ọkwa, ọ bụghị dịka akụkụ aha mmadụ.
- issue: Ike ajụjụ μήποτε
  choice: Ọ̀ ga-abụ na ...?
  alternative: Ndị ọchịchị hà amatala ...?
  rationale: Nhọrọ a na-echekwa ngwakọta nke ihe ijuanya, obi abụọ, na echiche a na-atụ n’ime ajụjụ Grik ahụ, n’enweghị ịkọwa ya dịka ajụjụ na-atụ anya naanị azịza mba.
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe nke oge a, dị mfe nghọta ma dị ùgwù. E ji “n’ihu ọha” gosipụta ọnọdụ ikwu okwu ghe oghe, e jighị “n’atụghị egwu” mee ka echiche obi ike karịrị ihe isi mmalite kwuru. Akara nkọwa ala [a] dị n’ebe ajụjụ ọzọ ahụ metụtara.
