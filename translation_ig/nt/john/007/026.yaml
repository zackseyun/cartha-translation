  source_fidelity: 'The translation faithfully represents the Greek sequence and force: ἴδε is conveyed by “Lee”; παρρησίᾳ by “n’ihu ọha”; the present λαλεῖ by “ọ na-ekwu okwu”; and οὐδὲν αὐτῷ λέγουσιν without adding the interpretive “against him.” “Ọ̀ ga-abụ na” suitably conveys the tentative, surprised inference of μήποτε, while “amatala n’ezie” appropriately expresses ἔγνωσαν ἀληθῶς. “Mesaịa ahụ” correctly preserves ὁ χριστός as a title in this Jewish-context question.'
  naturalness: The Standard Igbo is clear, current, and appropriately formal. “Ha anaghị agwa ya ihe ọ bụla” is idiomatic for saying nothing to him, and the question is naturally phrased.
  terminology: “Ndị ọchịchị” is suitable for οἱ ἄρχοντες in context. “Mesaịa ahụ” is the preferred title rendering here and does not impose a doctrinal interpretation beyond the source. The footnote’s alternative is linguistically viable and retains the interrogative uncertainty.
