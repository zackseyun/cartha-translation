revisions:
- from: Ma ụfọdụ n’ime ha[a] chọrọ ijide ya[b], ma ọ dịghị onye ọ bụla bikwasịrị ya aka.
  to: Ma ụfọdụ n’ime ha[a] chọrọ ijide ya[b], ma ọ dịghị onye ọ bụla setịrị ya aka.
  rationale: The revision retains the source’s ambiguity between physical seizure and arrest while replacing the final clause with a natural Standard Igbo idiom for the Greek expression “laid hands on him.” It also clarifies the arrest alternative in footnote b.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T06:22:25Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the indefinite subset (τινὲς ἐξ αὐτῶν), their intention to seize Jesus, and the contrast that nobody acted against him. However, “bikwasịrị ya aka” is less idiomatic for the Greek plural expression “laid hands on him” and uses singular “aka.”
  naturalness: “Ọ dịghị onye ọ bụla setịrị ya aka” is a more natural Standard Igbo idiom for making a move to lay hold of someone. The repeated contrastive “ma” appropriately reflects δέ and ἀλλά in this short verse.
  terminology: “Ijide ya” is an appropriately broad rendering of πιάσαι and does not prematurely specify a formal arrest. The alternative footnote should use clear contemporary wording, “ijide ya dịka onye mkpọrọ,” rather than “ịkpụrụ ya,” which is not a reliable Standard Igbo expression here.
  issues:
  - severity: medium
    issue: The final idiom is awkward and has singular “aka.”
    rationale: ἐπέβαλεν ... τὰς χεῖρας is an idiom for laying hands on or taking hold of someone. “Setịrị ya aka” is a more idiomatic Igbo expression in this context and avoids the misleading singular construction.
  - severity: medium
    issue: Footnote b uses “ịkpụrụ ya.”
    rationale: This wording is not a clear or dependable modern Standard Igbo equivalent for arresting someone. A transparent alternative preserves the arrest nuance without altering the main translation.
  revised_text: Ma ụfọdụ n’ime ha[a] chọrọ ijide ya[b], ma ọ dịghị onye ọ bụla setịrị ya aka.
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “ụfọdụ ndị si n’etiti ha.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ijide ya dịka onye mkpọrọ.”
    reason: lexical_alternative
  revision_rationale: The revision retains the source’s ambiguity between physical seizure and arrest while replacing the final clause with a natural Standard Igbo idiom for the Greek expression “laid hands on him.” It also clarifies the arrest alternative in footnote b.
