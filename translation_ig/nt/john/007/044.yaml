  text: τινὲς δὲ ἤθελον ἐξ αὐτῶν πιάσαι αὐτόν, ἀλλ’ οὐδεὶς ⸀ἐπέβαλεν ἐπ’ αὐτὸν τὰς χεῖρας.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/044.yaml
  text: But some of them wanted to seize him[b][a], yet no one laid hands on him.
translation:
  language: ig
  text: Ma ụfọdụ n’ime ha[a] chọrọ ijide ya[b], ma ọ dịghị onye ọ bụla setịrị ya aka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ụfọdụ ndị si n’etiti ha.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ijide ya dịka onye mkpọrọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τινὲς
  choice: ụfọdụ
  rationale: Ọ na-ezo aka n’ọnụ ọgụgụ ndị a na-akọwaghị kpọmkwem n’etiti ìgwè mmadụ ahụ; “ụfọdụ” bụ okwu Igbo doro anya ma bụrụkwa nke a na-ejikarị eme ihe.
- source_word: δὲ
  choice: Ma
  rationale: Ọ na-egosi ọdịiche dị n’etiti mmeghachi omume ndị a na nke ndị e kwuru banyere ha tupu nke a.
- source_word: ἤθελον
  choice: chọrọ
  rationale: Ọ na-egosi ọchịchọ ma ọ bụ ebumnuche ha nwere n’oge gara aga, n’enweghị ịgbakwụnye na ha mere ya n’ezie.
- source_word: ἐξ αὐτῶν
  choice: n’ime ha
  rationale: Ọ na-egosi na ndị ahụ bụ akụkụ nke ìgwè ahụ. Nke a bụ ụzọ Igbo dị mfe ma bụrụkwa eke isi kwuo ya.
- source_word: πιάσαι
  choice: ijide
  rationale: “Ijide” na-enye echiche bụ isi nke ijide mmadụ n’aka, ma ọ ka na-ekwe ka ọnọdụ ahụ gosi na ebumnuche ha bụ ịkpụrụ ya ma ọ bụ ijide ya dị ka onye mkpọrọ.
- source_word: ἀλλ’
  choice: ma
  rationale: Ọ na-egosi ọdịiche siri ike n’etiti ihe ha chọrọ ime na ihe mechara mee.
- source_word: οὐδεὶς
  choice: ọ dịghị onye ọ bụla
  rationale: Nke a na-egosipụta nkwupụta mmegide zuru ezu nke okwu Grik ahụ n’Igbo doro anya.
- source_word: ἐπέβαλεν ἐπ’ αὐτὸν τὰς χεῖρας
  choice: bikwasịrị ya aka
  rationale: Nke a na-echekwa akpaalaokwu nke isi iyi ahụ banyere imetụ mmadụ aka n’ụzọ iji jide ya, kama ịkọwa ya kpọmkwem dị ka njide ndị uwe ojii.
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta mee ihe. A hapụrụ ọdịiche dị n’etiti “ijide” na echiche pụrụ iche nke ịkpụrụ mmadụ ka ọ bụrụ onye mkpọrọ n’ihe odide na nkọwa ala peeji, kama ime ka otu nkọwa mechie nke ọzọ.
