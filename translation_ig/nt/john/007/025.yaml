  text: Ἔλεγον οὖν τινες ἐκ τῶν Ἱεροσολυμιτῶν· Οὐχ οὗτός ἐστιν ὃν ζητοῦσιν ἀποκτεῖναι;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/025.yaml
  text: So some of the people of Jerusalem were saying[a], “Is this not the man they are seeking to kill?”
translation:
  language: ig
  text: Ya mere, ụfọdụ ndị bi na Jerusalem nọ na-ekwu, “Ọ́ bụghị onye a ka ha na-achọ igbu?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔλεγον
  choice: nọ na-ekwu
  rationale: Oge imperfect na-egosi okwu ha nọgidere ma ọ bụ ugboro ugboro na-ekwu n'oge ahụ; ‘nọ na-ekwu’ na-egosipụta akụkụ a nke ngwaa ahụ.
- source_word: οὖν
  choice: Ya mere
  rationale: Na-ejikọta ihe a na ihe ndị bu ya ụzọ n'ụzọ doro anya ma kwekọọ na Standard Igbo.
- source_word: τινες
  choice: ụfọdụ
  rationale: Na-ezo aka n’otu akụkụ ndị a na-akọwaghị aha ha kpọmkwem.
- source_word: ἐκ τῶν Ἱεροσολυμιτῶν
  choice: ụfọdụ ndị bi na Jerusalem
  rationale: ἐκ na-egosi na ndị ahụ sitere n’etiti ndị Jerusalem, ebe Ἱεροσολυμίτης pụtara onye bi na Jerusalem. Njikọ a bụ asụsụ Igbo ebumpụta ụwa.
- source_word: Οὐχ οὗτός ἐστιν
  choice: Ọ́ bụghị onye a
  rationale: Ajụjụ ahụ na-atụ anya azịza nkwenye; usoro a na-echekwa ike ajụjụ ahụ n’Igbo.
- source_word: ζητοῦσιν
  choice: ha na-achọ
  rationale: Present tense na-egosi na ebumnobi ahụ ka na-aga n’ihu; ‘na-achọ’ na-echekwa nke a.
- source_word: ἀποκτεῖναι
  choice: igbu
  rationale: Nke a bụ ihe ngwaa ahụ pụtara kpọmkwem, n’enweghị ịgbakwunye echiche ikpe ụlọikpe.
theological_decisions: []
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E tinyere echiche ἐκ kpọmkwem n’isiokwu ahụ (‘ụfọdụ ndị bi na Jerusalem’), ya mere nkọwa ọzọ n’ala peeji adịghị mkpa.
