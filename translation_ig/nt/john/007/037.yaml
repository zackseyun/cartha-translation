  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἐν δὲ τῇ ἐσχάτῃ ἡμέρᾳ τῇ μεγάλῃ τῆς ἑορτῆς εἱστήκει ὁ Ἰησοῦς, καὶ ἔκραξεν λέγων· Ἐάν τις διψᾷ ἐρχέσθω πρός με καὶ πινέτω.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/037.yaml
  text: On the last day[a], the great day of the feast, Jesus stood and cried out, saying, “If anyone is thirsty, let him come to me and drink.”
translation:
  language: ig
  text: N’ụbọchị ikpeazụ, bụ́ nnukwu ụbọchị nke emume ahụ, Jizọs guzoro, were oke olu kwuo, sị, “Ọ bụrụ na akpịrị na-akpọ onye ọ bụla nkụ, ya bịakwute m ṅụọ.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐν δὲ τῇ ἐσχάτῃ ἡμέρᾳ
  choice: N’ụbọchị ikpeazụ
  rationale: N’ marks the temporal setting naturally in Igbo, while ụbọchị ikpeazụ straightforwardly renders ‘the last day.’ The mild connective δέ need not be made explicit where Igbo discourse flows naturally without it.
- source_word: τῇ μεγάλῃ τῆς ἑορτῆς
  choice: bụ́ nnukwu ụbọchị nke mmemme ahụ
  rationale: This preserves the appositional emphasis ‘the great day of the feast/festival.’ Mmemme is clear, current Igbo for the religious festival in this context.
- source_word: εἱστήκει ὁ Ἰησοῦς
  choice: Jizọs guzoro
  rationale: Guzoro naturally expresses Jesus’ standing posture and public stance without adding interpretation.
- source_word: ἔκραξεν λέγων
  choice: were oke olu kwuo, sị
  rationale: The phrase communicates a loud public utterance in natural Igbo. It preserves the emphatic force of κράζω without the possible alarm or panic associations of tie mkpu.
- source_word: Ἐάν τις διψᾷ
  choice: Ọ bụrụ na akpịrị na-akpọ onye ọ bụla nkụ
  rationale: This uses the ordinary Igbo idiom for being thirsty and retains the open, generic force of τις, ‘anyone.’
- source_word: ἐρχέσθω πρός με καὶ πινέτω
  choice: ya bịakwute m ṅụọ
  rationale: The jussive ya naturally carries the singular generic invitation-command in Igbo, and the coordinated verbs retain both imperatives without unnecessary repetition.
theological_decisions:
- issue: Metaphorical force of thirst and drinking
  choice: Retain the imagery as akpịrị na-akpọ…nkụ (‘is thirsty’) and ṅụọ (‘drink’) without explaining it.
  alternative: An interpretive rendering that explicitly speaks of believing, receiving life, or receiving the Spirit.
  rationale: The verse itself presents an open metaphor whose theological development belongs to the surrounding context. Keeping the imagery avoids resolving that tension inside the translation.
- issue: Generic singular τις and the following imperatives
  choice: Use onye ọ bụla with the singular generic jussive ya.
  alternative: Restructure as a plural invitation or add an explicitly gendered pronoun.
  rationale: Igbo ya is naturally singular and does not mark grammatical gender, so it accurately preserves the generic singular construction without introducing a gender distinction absent from ordinary Igbo pronouns.
translation_notes:
  register: Standard Igbo; natural, current, and dignified. The wording is suitable for public reading. No footnote is needed for the Greek generic singular because Igbo ya preserves singular reference without forcing a masculine or feminine distinction.
