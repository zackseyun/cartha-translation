- from: Jizọs zara ha sị, “Ọ bụ otu ọrụ ka m rụrụ, ma o juru unu niile anya.[a]”[b]
  to: Jizọs zara ha sị, “Otu ọrụ ka m rụrụ, ọ juru unu niile anya.”[a]
  rationale: The revision removes the adversative conjunction and the unnecessary lexical footnote. It retains the natural Igbo idiom for the audience's marveling, preserves the emphasis on one work, and retains the cautious cross-reference note without placing the identification in the biblical text.
