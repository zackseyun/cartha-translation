  text: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτοῖς· Ἓν ἔργον ἐποίησα καὶ πάντες θαυμάζετε.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/021.yaml
  text: Jesus answered and said to them[a], “I did one work[b], and you all marvel.”
translation:
  language: ig
  text: Jizọs zara ha sị, “Otu ọrụ ka m rụrụ, ọ juru unu niile anya.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Otu ọrụ” a nwere ike ịbụ ọgwụgwọ Jizọs gwọrọ nwoke ahụ na-enweghị ike ịga ije n'ụbọchị izu ike; lee Jọn 5:1–18.
    reason: cross_reference
lexical_decisions:
- source_word: ἀπεκρίθη ... καὶ εἶπεν
  choice: zara ha sị
  rationale: Nke a bụ ụzọ Igbo si ekwu usoro akụkọ ahụ n'ụzọ ebumpụta ụwa, ebe ọ ka na-egosi ma nzaghachi ahụ ma okwu sochiri ya.
- source_word: Ἓν ἔργον
  choice: otu ọrụ
  rationale: “Otu” na-edobe nkwusiri ike nke ọnụọgụ ahụ; “ọrụ” na-echekwa ojiji Jọn na-eji ἔργον eme ihe banyere ihe Jizọs na-arụ, karịa ịkọwa ya naanị dị ka omume.
- source_word: ἐποίησα
  choice: ka m rụrụ
  rationale: “Rụrụ” bụ okwu Igbo dabara nke ọma na “ọrụ” ma na-egosi ihe e mere n'oge gara aga n'enweghị mgbakwunye nkọwa.
- source_word: πάντες
  choice: unu niile
  rationale: Nke a na-eme ka ọtụtụ mmadụ a na-agwa okwu pụta ìhè ma na-edobe echiche nke “niile.”
- source_word: θαυμάζετε
  choice: o juru unu ... anya
  rationale: Akpaokwu a bụ Igbo ebumpụta ụwa maka ịtụnanya ma ọ bụ mgbagwoju anya, n'ekpebighị na mmeghachi omume ahụ bụ naanị nke ọma.
theological_decisions:
- issue: Ihe ἔργον pụtara n'akwụkwọ Jọn
  choice: ọrụ
  alternative: omume
  rationale: “Ọrụ” na-echekwa ụda okwu Jọn na-eji maka ihe Jizọs na-eme, nke nwere ike ibu ibu n'ihe gbasara onye ọ bụ na ozi ya, ma ọ naghị etinye nkọwa ahụ kpọmkwem n'amaokwu.
- issue: Ihe “otu ọrụ” ahụ na-ezo aka na ya
  choice: Edoghị ya anya n'amaokwu bụ isi; kọwara njikọ nwere ike ịdị na nkọwa ala peeji
  alternative: Ịkpọ ọgwụgwọ ahụ aha kpọmkwem n'amaokwu
  rationale: Amaokwu Grik ekwughị ọgwụgwọ ahụ kpọmkwem, ya mere idebe ya na nkọwa ala peeji na-ezere itinye nkọwa n'ime ederede.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “Zara ha sị” bụ usoro Igbo ebumpụta ụwa; “otu ọrụ” na-echekwa isi okwu na nkwusiri ike nke Grik. E debere akara nkọwa ala peeji [a] na [b] n'ederede bụ isi.
