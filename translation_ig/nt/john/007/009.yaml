  text: ταῦτα ⸀δὲ εἰπὼν ⸀αὐτὸς ἔμεινεν ἐν τῇ Γαλιλαίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/009.yaml
  text: After saying these things, he himself remained in Galilee.
translation:
  language: ig
  text: Mgbe o kwusịrị ihe ndị a, ya onwe ya nọgidere na Galili.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ταῦτα
  choice: ihe ndị a
  rationale: Nkebi a na-ezo aka n'okwu Jizọs kwuru tupu amaokwu a, ma na-echekwa ụdị ọtụtụ nke okwu Grik ahụ.
- source_word: δὲ ... εἰπὼν
  choice: Mgbe o kwusịrị
  rationale: A tụgharịrị njikọ ahụ na participle aorist dị ka nkebi oge, nke na-egosi na ikwu okwu ahụ buru ụzọ tupu omume dị n'isi ahịrịokwu ahụ.
- source_word: αὐτὸς
  choice: ya onwe ya
  rationale: Okwu a na-enye onye na-eme ihe ahụ nkwusi ike; nsụgharị a na-echekwa nkwusi ike ahụ na ọdịiche dị n'etiti ihe Jizọs mere na ihe ụmụnne ya mere n'akụkụ akụkọ a.
- source_word: ἔμεινεν
  choice: nọgidere
  rationale: Nke a na-egosi na ọ hapụghị ebe ahụ kama ọ gara n'ihu ịnọ ebe ọ nọ; ọ dabara nke ọma na μένω n'ọnọdụ akụkọ a.
- source_word: ἐν τῇ Γαλιλαίᾳ
  choice: na Galili
  rationale: Nke a bụ ụzọ Igbo nkịtị si egosi ebe, ma na-echekwa aha mpaghara ahụ n'enweghị mgbakwunye nkọwa.
theological_decisions: []
translation_notes:
  register: E ji Igbo Izugbe nke dị mfe, nke oge a, ma dịkwa ùgwù. A hapụrụ nkwusi ike nke αὐτός n'okwu “ya onwe ya,” n'agbanyeghị na a pụrụ ikwu ya n'ụzọ dị mkpụmkpụ dịka “ọ nọgidere.”
