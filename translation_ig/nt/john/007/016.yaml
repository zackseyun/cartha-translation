id: JHN.7.16
reference: John 7:16
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀπεκρίθη οὖν αὐτοῖς ⸀ὁ Ἰησοῦς καὶ εἶπεν· Ἡ ἐμὴ διδαχὴ οὐκ ἔστιν ἐμὴ ἀλλὰ τοῦ πέμψαντός με·
base_translation:
  language: en
  yaml_path: translation/nt/john/007/016.yaml
  text: So Jesus answered them[a], “My teaching is not mine, but his who sent me.”
translation:
  language: ig
  text: Ya mere, Jizọs zara ha sị, “Ozizi m abụghị nke m, kama ọ bụ nke onye zitere m.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “kama o si n’aka onye zitere m,” iji mee ka isi ebe ozizi ahụ si bịa pụta ìhè.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη οὖν αὐτοῖς καὶ εἶπεν
  choice: Ya mere, Jizọs zara ha sị
  rationale: “Ya mere” na-egosi njikọ οὖν na okwu ndị bu ụzọ; “zara ha sị” bụ ụzọ Igbo si ekwu okwu nke ọma ma na-anọchi anya ma ἀπεκρίθη ma καὶ εἶπεν n’enweghị nkwughachi na-adịghị eke.
- source_word: Ἡ ἐμὴ διδαχὴ
  choice: Ozizi m
  rationale: “Ozizi” bụ okwu Igbo doro anya maka διδαχή, ebe “m” na-edobe nkwusi ike nke ἐμὴ n'ụzọ e ji ekwu Igbo ugbu a.
- source_word: οὐκ ἔστιν ἐμὴ
  choice: abụghị nke m
  rationale: Nke a na-edobe n'ụzọ dị mkpirikpi ọdịiche nke Grik gbasara ịbụ nke mmadụ ma ọ bụ isi ebe ihe si malite.
- source_word: ἀλλὰ τοῦ πέμψαντός με
  choice: kama ọ bụ nke onye zitere m
  rationale: “Nke onye zitere m” na-edobe genitive Grik nke nwere ike igosi ma onye nwe ozizi ahụ ma isi ebe o si bịa, n’ebughị ụzọ kpebie naanị otu n’ime ha.
- source_word: πέμψαντός
  choice: zitere
  rationale: “Zitere” bụ ntụgharị nkịtị na nke ziri ezi nke πέμπω; ọ naghị atụkwasị echiche ọzọ dịka inye ọkwa ma ọ bụ ọrụ pụrụ iche.
theological_decisions:
- issue: Mmekọrịta dị n’etiti ozizi Jizọs na Onye zitere ya
  choice: E debere okwu ahụ dịka “abụghị nke m, kama ọ bụ nke onye zitere m,” ka ọdịiche nke ndị ahụ na ịdị n’otu nke ozi na isi ya pụta ìhè.
  alternative: Ịsụgharị ya ka ọ bụrụ naanị na Jizọs bụ onye nkụzi mmadụ nke na-enweghị ikike nke ya, ma ọ bụ ikwu ya n’ụzọ ga-eme ka nkewa n’etiti ya na Onye zitere ya gabiga ihe amaokwu ahụ kwuru.
  rationale: Grik na-ekwu kpọmkwem na ozizi ahụ abụghị “nke m” kama ọ bụ “nke onye zitere m.” Nsụgharị ahụ na-echekwa esemokwu a n’ebughị nkọwa banyere ọdịdị Jizọs ma ọ bụ mmekọrịta ya na Nna tinye n’ime amaokwu ahụ.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. “Ozizi” dabara n’okwu okpukpe na nke nkụzi n’enweghị ụda nka pụrụ iche; “zara ha sị” bụ usoro akụkọ nkịtị n’Igbo.
