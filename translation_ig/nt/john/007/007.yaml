id: JHN.7.7
reference: John 7:7
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οὐ δύναται ὁ κόσμος μισεῖν ὑμᾶς, ἐμὲ δὲ μισεῖ, ὅτι ἐγὼ μαρτυρῶ περὶ αὐτοῦ ὅτι τὰ ἔργα αὐτοῦ πονηρά ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/007.yaml
  text: The world is not able to hate you[a], but it hates me[d][c][b], because I testify about it that its works are evil.
translation:
  language: ig
  text: Ụwa enweghị ike ịkpọ unu asị[a], ma ọ na-akpọ m asị, n’ihi na ana m agba akaebe banyere ya[c] na ọrụ ya dị njọ[d].[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Ụwa apụghị ịkpọ unu asị.”
    reason: lexical_alternative
  - marker: b
    text: N’akwụkwọ Jọn, “ụwa” na-ezokarị aka n’usoro ndụ mmadụ nke na-emegide Chineke, ọ bụghị eluigwe na ụwa Chineke kere n’onwe ha.
    reason: cultural_note
  - marker: c
    text: Ma ọ bụ, “ana m enye akaebe banyere ya.”
    reason: lexical_alternative
  - marker: d
    text: Ma ọ bụ, “omume ya jọrọ njọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ δύναται
  choice: enweghị ike
  rationale: Nke a na-echekwa echiche doro anya nke ike ma ọ bụ enweghị ike dị na δύναμαι, ma bụrụkwa okwu Igbo a na-asụkarị.
- source_word: ὁ κόσμος
  choice: ụwa
  rationale: “Ụwa” bụ nsụgharị kpọmkwem nke κόσμος ma na-ahapụ obosara na mgbagwoju ihe okwu ahụ pụtara n’akwụkwọ Jọn n’enweghị ịkọwa ya gabiga ókè.
- source_word: μισεῖν / μισεῖ
  choice: ịkpọ … asị / kpọrọ … asị
  rationale: E ji otu akpaokwu siri ike mee ngwaa ahụ ugboro abụọ iji chekwaa nkwughachi na ọdịiche dị n’etiti “unu” na “m.”
- source_word: ἐμὲ δὲ
  choice: ma ọ kpọrọ m asị
  rationale: “Ma” na-egosi ọdịiche nke δέ; nhazi okwu a bụ nke Igbo dị mfe ma na-eme ka “m” pụta ìhè.
- source_word: μαρτυρῶ
  choice: ana m agba akaebe
  rationale: Akpaokwu a na-echekwa echiche nke ịgba akaebe dị na μαρτυρέω, ma bụrụkwa Igbo kwụ ọtọ na nke kwesịrị nsọpụrụ.
- source_word: περὶ αὐτοῦ
  choice: banyere ya
  rationale: “Ya” na-alaghachi n’“ụwa” n’ụzọ Igbo si eji nnọchiaha; a hapụrụ ntụaka ahụ dịka nke ederede Grik.
- source_word: τὰ ἔργα αὐτοῦ
  choice: ọrụ ya
  rationale: “Ọrụ” dị nso na ἔργα ma na-echekwa ụda omume na ikpe omume nke okwu ahụ n’akwụkwọ Jọn.
- source_word: πονηρά
  choice: dị njọ
  rationale: N’ebe a, “dị njọ” na-egosi ajọ ọnọdụ omume, ọ bụghị naanị ịdị ala n’ogo; ọ bụkwa okwu Igbo eke ma doo anya.
theological_decisions:
- issue: Ihe “ụwa” na-ezo aka na ya na ike nkà mmụta okpukpe ya n’akwụkwọ Jọn
  choice: Idowe “ụwa” n’ahịrị bụ isi n’enweghị nkọwa agbakwunyere
  alternative: usoro mmadụ na-emegide Chineke; ụmụ mmadụ nọ ná nnupụisi megide Chineke
  rationale: κόσμος nwere ike ibu ọtụtụ echiche n’akwụkwọ Jọn. Amaokwu a na-egosi ụwa dịka nke na-emegide Jizọs n’ihi na ọ na-ekpughe ajọ ọrụ ya, ma nsụgharị ahụ ekwesịghị imechi ihe okwu ahụ pụtara n’otu nkọwa naanị.
translation_notes:
  register: Standard Igbo nke oge a, dị mfe nghọta ma nwee ugwu. E chekwara nkwughachi nke “ịkpọ asị,” ọdịiche dị n’etiti “unu” na “m,” na obosara echiche nke “ụwa.” Akara nkọwa ala peeji niile pụtara n’ederede bụ isi.
