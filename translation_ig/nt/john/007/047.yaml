id: JHN.7.47
reference: John 7:47
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀπεκρίθησαν οὖν αὐτοῖς οἱ Φαρισαῖοι· Μὴ καὶ ὑμεῖς πεπλάνησθε;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/047.yaml
  text: So the Pharisees answered them[a], “Have you also been led astray?”
translation:
  language: ig
  text: Ya mere, ndị Farisii zara ha, sị, “È duhiela unu kwa?[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “È ghọgburu unu kwa?” Okwu Grik ahụ nwere ike ịpụta iduhie mmadụ ka o kwenye n'ihe na-ezighị ezi ma ọ bụ ịghọgbu ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθησαν
  choice: zara
  rationale: “Zara” bụ ụzọ Igbo nkịtị si akọ na mmadụ nyere nzaghachi n'okwu a gwara ya.
- source_word: οὖν
  choice: Ya mere
  rationale: Ọ na-egosi na nzaghachi ndị Farisii sitere n'ihe e kwuru tupu ya pụta, ma na-eme ka njikọ okwu ahụ doo anya n'Igbo.
- source_word: αὐτοῖς
  choice: ha
  rationale: “Ha” na-anọchi ndị nche ụlọ nsọ ndị Farisii na-agwa okwu, dịka ihe gbara amaokwu ahụ gburugburu si gosi.
- source_word: οἱ Φαρισαῖοι
  choice: ndị Farisii
  rationale: Nke a bụ aha otu ndị Juu ahụ a na-ejikarị eme ihe n'Igbo.
- source_word: Μὴ καὶ ὑμεῖς
  choice: unu kwa
  rationale: “Kwa” na-echekwa echiche nke καί, ya bụ “unu onwe unu kwa,” ebe usoro ajụjụ ahụ na-egosi na ndị Farisii tụrụ anya azịza na-adịghị mma n'etinyeghị nkọwa ọzọ n'ime amaokwu ahụ.
- source_word: πεπλάνησθε
  choice: duhiela unu
  rationale: “Duhie” nwere ike ịpụta iduga mmadụ n'echiche na-ezighị ezi ma ọ bụ ịghọgbu ya. Usoro “e ... unu” na-echekwa echiche na ọ bụ ndị ọzọ mere ka ha hie ụzọ, ebe “-la” na-egosi ọnọdụ nke sitere n'ihe emeworo.
theological_decisions:
- issue: Ike ajụjụ nke μή nke na-atụ anya azịza na-adịghị mma
  choice: Jiri ajụjụ “È duhiela unu kwa?” na-enweghị itinye okwu ọzọ dịka “n'ezie.”
  alternative: “N'ezie, e duhieghịkwa unu, ka è mere?”
  rationale: Ajụjụ Grik ahụ na-egosi na ndị Farisii tụrụ anya ka ha sị mba ma na-ekwu okwu n'ụzọ nlelị. Usoro ajụjụ Igbo na ọnọdụ okwu ahụ na-enye ike a n'ebugharịghị nkọwa karịrị ihe odide ahụ kwuru.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. “Ya mere” na-ejikọta amaokwu ahụ na mkparịta ụka gara aga; “sị” na-eme ka mbata n'okwu kpọmkwem daa nke ọma n'Igbo.
