id: JHN.7.49
reference: John 7:49
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀλλὰ ὁ ὄχλος οὗτος ὁ μὴ γινώσκων τὸν νόμον ⸀ἐπάρατοί εἰσιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/049.yaml
  text: But this crowd[a], which does not know the law[b], is accursed.
translation:
  language: ig
  text: Ma igwe mmadụ a, ndị na-amaghị Iwu ahụ[b], bụ ndị a bụrụ ọnụ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị nọ n’okpuru ọbụbụ ọnụ.”
    reason: lexical_alternative
  - marker: b
    text: “Iwu ahụ” na-ezo aka n’Iwu ndị Juu, ya bụ Torah.
    reason: cultural_note
lexical_decisions:
- source_word: ἀλλὰ
  choice: Ma
  rationale: Ọ na-egosi ọdịiche dị n’etiti okwu a na ihe ndị ọchịchị kwuru tupu ya; “Ma” bụ ụzọ Igbo doro anya ma dịkwa eke isi kwuo ya.
- source_word: ὁ ὄχλος οὗτος
  choice: igwe mmadụ a
  rationale: “Igwe mmadụ” na-egosi ọtụtụ ndị gbakọrọ ọnụ n’ebughị ụzọ tinye echiche ọjọọ nke okwu dịka “ìgwè ọgbaaghara” ga-etinye.
- source_word: ὁ μὴ γινώσκων
  choice: ndị na-amaghị
  rationale: Ụdị a na-akọwa igwe mmadụ ahụ dị ka ndị nọ n’ọnọdụ amaghị Iwu ahụ; ọtụtụ “ndị” dabara n’Igbo n’ihi na igwe mmadụ mejupụtara ọtụtụ mmadụ.
- source_word: τὸν νόμον
  choice: Iwu ahụ
  rationale: N’ọnọdụ a, ọ na-ezo aka n’Iwu ndị Juu, ya bụ Torah. Mkpụrụedemede ukwu na-enyere aka igosi na ọ bụghị iwu nkịtị ka a na-ekwu maka ya.
- source_word: ἐπάρατοί
  choice: ndị a bụrụ ọnụ
  rationale: Nke a na-echekwa ike na ụda ikpe ọmụma dị n’okwu Grik ahụ, ma bụrụkwa okwu Igbo ndị mmadụ na-aghọta nke ọma.
- source_word: εἰσιν
  choice: bụ ndị
  rationale: Ọ bụ ezie na “igwe mmadụ” bụ aha nchịkọta, “bụ ndị” na-eme ka ọtụtụ mmadụ dị n’ime igwe ahụ pụta ìhè ma kwekọọ n'ụdị ọtụtụ dị na Grik.
theological_decisions:
- issue: Ma a ga-egosi ikpe ọjọọ ndị Farisii kwuru dị ka nkwupụta onye na-akọ akụkọ kwadoro
  choice: A tụgharịrị okwu ahụ ozugbo dị ka ikpe siri ike nke ndị na-ekwu okwu ahụ kwuru, n’etinyeghị okwu ga-eme ka ọ dị nro ma ọ bụ kwado ya.
  alternative: Ịgbakwunye okwu dịka, “ha na-ekwu na igwe mmadụ a bụ ndị a bụrụ ọnụ,” iji kewapụ onye na-akọ akụkọ n’okwu ahụ.
  rationale: Grik bụ okwu ọnụ ndị na-emegide Jizọs kwuru ozugbo. Nsụgharị kwesịrị idebe ikpe ha siri ike na esemokwu nkà mmụta okpukpe dị na ya, n’agbakwunyeghị nkọwa na-adịghị n’ederede.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta mee ihe. A họọrọ “igwe mmadụ” kama okwu nwere ụda mkparị karịa, ebe “ndị a bụrụ ọnụ” chekwara ike nke nkwupụta ndị na-ekwu okwu ahụ.
