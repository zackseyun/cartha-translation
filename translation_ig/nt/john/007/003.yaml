source:
  edition: SBLGNT
  text: εἶπον οὖν πρὸς αὐτὸν οἱ ἀδελφοὶ αὐτοῦ· Μετάβηθι ἐντεῦθεν καὶ ὕπαγε εἰς τὴν Ἰουδαίαν, ἵνα καὶ οἱ μαθηταί σου ⸀θεωρήσουσιν ⸂σοῦ τὰ ἔργα⸃ ἃ ποιεῖς·
base_translation:
  language: en
  yaml_path: translation/nt/john/007/003.yaml
  text: So his brothers said to him[a], “Leave here and go to Judea, so that your disciples also may see the works you are doing.”
translation:
  language: ig
  text: Ya mere, ụmụnne ya nwoke sịrị ya, “Si ebe a pụọ gaa Judia, ka ndị na-eso ụzọ gị hụkwa[a] ọrụ ndị ị na-arụ.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ga-ahụkwa,” ma ọ bụ, “ga-elekwa anya.” Ngwaa Grik a nwere ike imesi ile ihe anya ma ọ bụ ikiri ya ike; ebe ọ bụ ụdị ọdịnihu n’ahịrịokwu na-egosi nzube, e nwere ụzọ dị iche iche a pụrụ isi sụgharịa ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Ya mere
  rationale: Ọ na-ejikọta okwu a na ihe ndị bu ya ụzọ ma na-egosi ihe si na ha pụta; ọ bụkwa ụzọ Igbo doro anya ma dị nsọ si eme njikọ a.
- source_word: ἀδελφοὶ αὐτοῦ
  choice: ụmụnne ya ndị nwoke
  rationale: ἀδελφοί bụ ọtụtụ nke nwoke, ọnọdụ akụkọ a na-egosikwa ndị nwoke n’ezinụlọ Jizọs. Mgbakwunye ‘ndị nwoke’ na-egbochi ka a ghọta ya dịka ụmụnne nwoke na nwanyị niile.
- source_word: Μετάβηθι ἐντεῦθεν
  choice: Si ebe a pụọ
  rationale: Nke a na-egosipụta iwu ozugbo ka ọ hapụ ebe ọ nọ, n’Igbo nkịtị ma dị ike.
- source_word: ὕπαγε εἰς τὴν Ἰουδαίαν
  choice: gaa Judia
  rationale: Ọ na-egosipụta ngagharị gaa n’ógbè ahụ n'ụzọ dị mfe ma kpọmkwem.
- source_word: ἵνα καὶ
  choice: ka ... hụkwa
  rationale: ‘Ka’ na-egosi nzube, ebe ‘-kwa’ na-echekwa echiche καί nke pụtara ‘ọzọkwa.’
- source_word: οἱ μαθηταί σου
  choice: ndị na-eso ụzọ gị
  rationale: Nke a bụ okwu Igbo a na-aghọta nke ọma maka ndị na-amụta ihe n’aka onye nkuzi ma na-eso ya.
- source_word: θεωρήσουσιν
  choice: hụkwa
  rationale: N’ahịrịokwu nzube nke ἵνα webatara, ọdịnihu a nwere ike igosi ihe e bu n’obi ka o mee. ‘Hụkwa’ bụ Igbo ebumpụta ụwa, ebe nkọwa ala peeji na-echekwa ọdịdị ọdịnihu na echiche nke ilekwasị anya.
- source_word: σοῦ τὰ ἔργα ἃ ποιεῖς
  choice: ọrụ ndị ị na-arụ
  rationale: Nke a na-echekwa okwu Jọn ji eme ihe banyere ‘ọrụ’ Jizọs, ma na-asụ ya n’usoro Igbo dị mma.
theological_decisions:
- issue: Ndị okwu ahụ bụ ndị a kpọrọ ‘ụmụnne ya’
  choice: E gosipụtara ha dịka ụmụnne Jizọs ndị nwoke n’ezinụlọ ya.
  alternative: Ndị ikwu ya n’ụzọ sara mbara.
  rationale: Ụdị okwu Grik na ọnọdụ Jọn 7:3–5 kwadoro ndị nwoke n’ezinụlọ ya. Nsụgharị ahụ ekwughị ihe ọzọ gbasara kpọmkwem ụdị mmekọrịta ezinụlọ ha karịa ihe ederede ahụ kwuru.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị mfe nghọta ma nwee ugwu, mee ihe. E debere usoro iwu abụọ ahụ n’ụdị okwu dị kpọmkwem, ma zere okwu chọọchị pụrụ iche nke otu ụka.
