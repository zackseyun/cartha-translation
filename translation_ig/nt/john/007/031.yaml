    text: Ma ọ bụ, “Kraịst.” E ji “Mesaịa” sụgharịa utu aha Grik bụ Χριστός n’ebe a n’ihi na okwu a metụtara atụmanya ndị Juu banyere Mesaịa ahụ.
    reason: alternative_reading
  revision_rationale: A gbanwere ajụjụ ahụ ka ọ bụrụ ajụjụ na-adịghị mma (“ọ̀ gaghị eme ...?”) iji chekwaa μή Grik na ike nkwupụta ajụjụ ahụ. E debere “Mesaịa,” ihe odide ala peeji, na akụkụ ndị ọzọ n’enweghị mgbanwe.
