review_pass:
  verdict: revise
  source_fidelity: The partitive expression, belief directed to Jesus, imperfect ongoing speech, messianic title, and comparative reference to Jesus' signs are all substantially represented. However, the Greek μή introduces a negative rhetorical question, whereas the draft's positive question ("ọ̀ ga-eme ...?") loses that marked negative formulation and its expected negative answer.
  naturalness: The verse is clear and uses natural Standard Igbo overall. A negative interrogative is both natural here and closer to the rhetorical force of the Greek.
  terminology: “Mesaịa” appropriately conveys Χριστός as a Jewish messianic title in this context, and the alternative “Kraịst” footnote is suitable. “Ihe ịrịba ama” appropriately retains Johannine ‘signs.’
  issues:
  - severity: medium
    issue: The rhetorical negative μή is omitted from the main-text question.
    rationale: The source asks, literally in force, whether the Messiah will not perform more signs than Jesus has performed. The present positive Igbo question is more neutral. Changing it to a negative interrogative preserves the source’s rhetorical orientation without turning the question into a doctrinal assertion.
  revised_text: Ma ọtụtụ ndị n’ime igwe mmadụ ahụ kwere na ya, ha nọkwa na-ekwu, “Mgbe Mesaịa[a] ahụ ga-abịa, ọ̀ gaghị eme ihe ịrịba ama karịa ndị nwoke a merela?”
  revised_footnotes:
