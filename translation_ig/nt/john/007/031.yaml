id: JHN.7.31
reference: John 7:31
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸂ἐκ τοῦ ὄχλου δὲ πολλοὶ⸃ ἐπίστευσαν εἰς αὐτόν, καὶ ⸀ἔλεγον· Ὁ χριστὸς ὅταν ἔλθῃ ⸀μὴ πλείονα ⸀σημεῖα ποιήσει ὧν οὗτος ἐποίησεν;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/031.yaml
  text: But many from the crowd believed in him[a], and they were saying, “When the Messiah comes, he will not do more signs than this man has done, will he?”
translation:
  language: ig
  text: Ma ọtụtụ ndị n’ime igwe mmadụ ahụ kwere na ya, ha nọkwa na-ekwu, “Mgbe Mesaịa[a] ahụ ga-abịa, ọ̀ gaghị eme ihe ịrịba ama karịa ndị nwoke a merela?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Kraịst.” E ji “Mesaịa” sụgharịa utu aha Grik bụ Χριστός n’ebe a n’ihi na okwu a metụtara atụmanya ndị Juu banyere Mesaịa ahụ.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκ τοῦ ὄχλου δὲ πολλοὶ
  choice: Ma ọtụtụ ndị n’ime igwe mmadụ ahụ
  rationale: “N’ime igwe mmadụ ahụ” na-egosi na ndị a bụ otu akụkụ sitere n’ìgwè ahụ; “Ma” na-egosikwa obere ọdịiche dị n’etiti okwukwe ha na ekweghị ekwe na esemokwu gbara ha gburugburu.
- source_word: ἐπίστευσαν εἰς αὐτόν
  choice: kwere na ya
  rationale: Nke a bụ ụzọ Igbo doro anya ma bụrụ nke a na-ejikarị ekwu maka okwukwe e tinyere n’ebe mmadụ nọ, n’agbakwụnyeghị nkọwa ọzọ na-adịghị n’asụsụ Grik.
- source_word: ἔλεγον
  choice: ha nọkwa na-ekwu
  rationale: Ụdị ngwaa imperfect na-egosi okwu na-aga n’ihu ma ọ bụ nke a na-ekwu ugboro ugboro; “nọ na-ekwu” na-echekwa echiche ahụ n’Igbo dị mfe.
- source_word: Ὁ χριστός
  choice: Mesaịa ahụ
  rationale: N’ebe a Χριστός bụ utu aha onye ndị Juu na-atụ anya ya, ọ bụghị aha onwe; “Mesaịa” na-echekwa ọnọdụ ahụ, ebe “ahụ” na-anọchi article Grik n’ụzọ dabara n’Igbo.
- source_word: ὅταν ἔλθῃ
  choice: Mgbe Mesaịa ahụ ga-abịa
  rationale: Nkebi a na-ezo aka n’ọdịnihu a na-atụ anya ya. “Mgbe ... ga-abịa” bụ ụzọ Igbo e si ekwu ya n’enweghị ime ya ka ọ bụrụ ọnọdụ a na-ejighị n’aka.
- source_word: μὴ ... ποιήσει
  choice: ọ̀ ga-eme ...?
  rationale: Ajụjụ a na-atụ anya azịza na-adịghị mma. Ụda ajụjụ Igbo na gburugburu okwu ahụ na-edobe ike ajụjụ nkwupụta a n’enweghị itinye okwu siri ike karịa ihe Grik kwuru.
- source_word: πλείονα σημεῖα
  choice: ihe ịrịba ama karịa
  rationale: πλείονα na-ekwu maka ọnụọgụ ka ukwuu, ọ bụghị na ihe ndị ahụ dị ukwuu n’ogo; “karịa” na-echekwa ntụnyere ahụ, ebe “ihe ịrịba ama” na-edobe okwu Jọn ji eme ihe.
- source_word: οὗτος ἐποίησεν
  choice: nke nwoke a merela
  rationale: “Nwoke a” bụ okwu nkịtị ndị nọ n’ìgwè mmadụ nwere ike iji zoo aka na Jizọs; “merela” na-eme ka ihe ndị o mewororị, ndị ka dị ha n’uche, pụta ìhè.
theological_decisions:
- issue: Nsụgharị Χριστός dị ka utu aha
  choice: Mesaịa
  alternative: Kraịst
  rationale: Okwu a bụ utu aha n’ọnọdụ atụmanya Mesaịa ndị Juu (“mgbe ... ga-abịa”). Isi ederede ji “Mesaịa,” ma ihe odide ala peeji na-edobe “Kraịst” dị ka nsụgharị ọzọ kwere omume.
- issue: Ike ajụjụ nwere μή
  choice: Ajụjụ na-atụ anya azịza “mba”
  alternative: Ajụjụ ọdịnihu na-anọpụ iche
  rationale: μή n’ajụjụ Grik a na-egosi na ndị na-ekwu okwu chere na Mesaịa agaghị eme ihe ịrịba ama karịa nke Jizọs merela. A hapụrụ ya dị ka ajụjụ ka esemokwu na nghọta ha ghara ịghọ nkwupụta siri ike karịa isi mmalite.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta, dee ya. A họọrọ “igwe mmadụ” maka ìgwè buru ibu, “kwere na ya” maka okwukwe a tụkwasịrị mmadụ, na “ihe ịrịba ama” iji chekwaa okwu pụrụ iche Jọn ji akọ ọrụ ebube ndị na-arụkwa ọrụ dị ka ihe ngosi.
