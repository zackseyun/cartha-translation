base_translation:
  language: en
  yaml_path: translation/nt/john/007/046.yaml
  text: The officers answered[a], “Never has a man spoken like this.”
translation:
  language: ig
  text: Ndị nche ahụ zara, sị, “Ọ dịtụbeghị mgbe mmadụ[a] kwuru okwu otu a.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “Ọ dịtụbeghị mgbe onye ọ bụla kwuru okwu otu a.” N'asụsụ Grik, e dere “mmadụ” n'ụdị otu onye nke na-anọchite anya mmadụ n'ozuzu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθησαν
  choice: zara, sị
  rationale: Nke a bụ ụzọ Igbo doro anya ma bụrụkwa nke a na-ejikarị egosi azịza na-esochi okwu e kwuru kpọmkwem.
- source_word: οἱ ὑπηρέται
  choice: ndị nche ahụ
  rationale: N'ọnọdụ a, ha bụ ndị e zigara ijide Jizọs; ‘ndị nche’ na-egosi ọrụ ha nke ọma n'enweghị ịkọwa ha kpọmkwem dị ka ndị uwe ojii ụlọ nsọ.
- source_word: Οὐδέποτε
  choice: ọ dịtụbeghị
  rationale: Okwu a na-egosi na ihe ahụ emetụbeghị n'oge ọ bụla ruo mgbe ahụ.
- source_word: ἐλάλησεν
  choice: kwuru okwu
  rationale: Nke a bụ ntụgharị Igbo dị mfe ma kwekọọ n'omume ikwu okwu nke ngwaa Grik ahụ.
- source_word: οὕτως
  choice: otu a
  rationale: Ọ na-egosi ụzọ ma ọ bụ ụdị Jizọs si kwuo okwu.
- source_word: ἄνθρωπος
  choice: mmadụ
  rationale: ‘Mmadụ’ bụ ezigbo nkọwa Igbo maka ἄνθρωπος; n'Igbo ọ naghị amanye ịkọ nwoke kpọmkwem, ma ọ na-echekwa echiche nke otu onye nnọchianya dị na Grik.
theological_decisions:
- issue: Ike nnọchianya nke ἄνθρωπος n'ụdị otu onye nwoke na ụtọasụsụ Grik
  choice: mmadụ
  alternative: nwoke / onye ọ bụla
  rationale: N'Igbo, ‘mmadụ’ bụ aha nkịtị maka onye mmadụ ma dabara n'okwu a karịa ‘nwoke,’ nke nwere ike ime ka a ghọta na a na-ekwusi ike banyere okike nwoke. Ọ ka na-echekwa ọdịdị otu onye nke isi mmalite karịa ‘onye ọ bụla.’
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị mfe, dị ugwu, ma kwekọọ n'okwu akụkọ. E tinyere akara nkọwa ala peeji [a] ozugbo n'akụkụ ngwaa mmeghe dịka o si dị na ederede ntụaka.
