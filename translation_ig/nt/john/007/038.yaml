  to: Onye ahụ nke kwere na m—dị nnọọ ka Akwụkwọ Nsọ kwuru—osimiri nke mmiri ndụ ga-esi n'ime ime ya asọpụta.[a]
  rationale: 'E mezigharịrị naanị akụkụ omume nke ngwaa: e wepụrụ “na-” n''“na-asọpụta” ka ọdịnihu nkịtị nke ῥεύσουσιν pụta ìhè. A hapụrụ usoro okwu, ihe atụ “n''ime ime ya,” na ndetu ala ahụ ka ha nọ, n''ihi na ha na-edobe ma nghọta bụ isi ma mgbagwoju anya e nwere banyere αὐτοῦ.'
