  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ πιστεύων εἰς ἐμέ, καθὼς εἶπεν ἡ γραφή, ποταμοὶ ἐκ τῆς κοιλίας αὐτοῦ ῥεύσουσιν ὕδατος ζῶντος.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/038.yaml
  text: The one who believes in me[a], just as the Scripture has said[b], rivers of living water will flow from his belly.
translation:
  language: ig
  text: Onye ahụ nke kwere na m—dị nnọọ ka Akwụkwọ Nsọ kwuru—osimiri nke mmiri ndụ ga-esi n'ime ime ya asọpụta.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N'ụzọ nkịtị, “n'afọ ya” ma ọ bụ “n'akpa nwa ya”; n'ebe a, okwu ahụ yikarịrị ka ọ bụ ihe atụ maka ime mmadụ. Ụfọdụ na-aghọta “ya” ka ọ na-ezo aka na Mesaya kama ịbụ onye kwere ekwe.
    reason: lexical_alternative_and_alternative_reading
lexical_decisions:
- source_word: ὁ πιστεύων εἰς ἐμέ
  choice: Onye ahụ nke kwere na m
  rationale: Nkebiokwu a na-ezo aka n'otu onye e ji ikwere mara; “kwere na m” bụ ụzọ Igbo si ekwu ntụkwasị obi e tinyere n'ime mmadụ.
- source_word: καθὼς εἶπεν ἡ γραφή
  choice: dị nnọọ ka Akwụkwọ Nsọ kwuru
  rationale: Nke a na-edobe ntụaka ahụ n'ihe Akwụkwọ Nsọ kwuru, ma na-asụgharị aorist εἶπεν n'ụzọ doro anya ma dị mma n'Igbo.
- source_word: ποταμοὶ
  choice: osimiri
  rationale: ποταμοί pụtara ọtụtụ osimiri, ọ bụghị naanị iyi nta; okwu a na-echekwa onyinyo nke ụbara mmiri.
- source_word: ἐκ τῆς κοιλίας αὐτοῦ
  choice: n'ime ime ya
  rationale: κοιλία nwere ike ịpụta afọ ma ọ bụ akpa nwa, ma n'ebe a ọ na-anọchi anya ebe dị omimi n'ime mmadụ. “N'ime ime ya” na-ezere nghọtahie anụahụ ma na-echekwa ihe atụ ahụ.
- source_word: ῥεύσουσιν
  choice: ga-asọpụta
  rationale: Nke a na-egosipụta future active indicative ahụ n'ụzọ nkịtị, n'etinyeghị ike ọzọ na-adịghị na ngwaa Grik.
- source_word: ὕδατος ζῶντος
  choice: mmiri ndụ
  rationale: “Mmiri ndụ” na-echekwa ma ihe atụ ahụ ma ịdị omimi nke okwu a n'Oziọma Jọn.
theological_decisions:
- issue: Onye αὐτοῦ (“ya”) na-ezo aka na ya
  choice: A sụgharịrị ya ka ọ na-ezo aka n'onye ahụ kwere.
  alternative: Ụfọdụ na-ewere ya ka ọ na-ezo aka na Mesaya/Jizọs.
  rationale: N'usoro ahịrịokwu Grik, “onye ahụ nke kwere” bụ onye nọ ya nso nke ukwuu ma bụrụkwa onye αὐτοῦ yikarịrị ka ọ na-ezo aka na ya; Jọn 7:39 sokwa na-akwado njikọ ahụ na ndị kwere ekwe. Ma ebe nghọta nke na-ezo ya na Mesaya dị, e debere ya n'okpuru ala kama idozi esemokwu ahụ n'ime ederede.
- issue: Ihe κοιλία pụtara n'ebe a
  choice: n'ime ime ya
  alternative: afọ ya; akpa nwa ya
  rationale: Ọ bụ ezie na okwu ahụ nwere ihe ọ pụtara n'anụahụ, n'ebe a o yikarịrị ka ọ bụ ihe atụ maka ime mmadụ. Nsụgharị a na-eme ka Igbo dị mma ma na-ahapụ nkọwa nkịtị n'okpuru ala.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. A họọrọ “n'ime ime ya” ka okwu ahụ ghara ịdị ka ọ na-ekwu naanị banyere akụkụ anụahụ; a hapụrụ nghọta ọzọ n'okpuru ala. Akara nkewa ogologo na-enyere aka igosi na “dị nnọọ ka Akwụkwọ Nsọ kwuru” nwere ike ịrụ ọrụ dị ka nkebiokwu ntinye n'agbanyeghị mgbagwoju anya dị n'usoro ahịrịokwu Grik.
