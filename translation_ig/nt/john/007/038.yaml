  source_fidelity: 'N''ụzọ zuru ezu, nsụgharị ahụ na-anọchi anya akụkụ ndị bụ isi nke Grik: onye na-ekwere n''ime Jizọs, ntụaka n''Akwụkwọ Nsọ, ọtụtụ osimiri, mmiri ndụ, na ebe mmiri ahụ si apụta n''ime onye ahụ. “N''ime ime ya” bụ nsụgharị Igbo dị mma maka κοιλία n''echiche ihe atụ, ebe ihe ndetu ala na-echekwa ihe ọ pụtara n''ụzọ nkịtị na nghọta ọzọ banyere onye αὐτοῦ na-ezo aka na ya.'
