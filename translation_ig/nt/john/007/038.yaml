  terminology: “Akwụkwọ Nsọ,” “mmiri ndụ,” na “Mesaya” dabara n'okwu nsọ Igbo nke oge a. “N'ime ime ya” na-edobe ihe atụ ahụ n'enweghị ime ka ọ bụrụ naanị akụkụ ahụ mmadụ. Ihe ndetu ala na-ekwupụta “afọ” na “akpa nwa” n'ụzọ kwesịrị ekwesị dịka nhọrọ nkịtị nke κοιλία.
