id: JHN.7.12
reference: John 7:12
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ γογγυσμὸς ⸂περὶ αὐτοῦ ἦν πολὺς⸃ ἐν τοῖς ὄχλοις· οἱ μὲν ἔλεγον ὅτι Ἀγαθός ἐστιν, ἄλλοι ⸀δὲ ἔλεγον· Οὔ, ἀλλὰ πλανᾷ τὸν ὄχλον.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/012.yaml
  text: And there was much murmuring about him among the crowds[a]. Some were saying, “He is good.” Others were saying, “No, on the contrary[b], he is misleading the crowd.”
translation:
  language: ig
  text: E nwekwara ọtụtụ ntamu banyere ya n’etiti ìgwè mmadụ[a]. Ụfọdụ na-asị, “Ọ bụ onye ọma.” Ndị ọzọ na-asị, “Mba, kama ọ na-eduhie ìgwè mmadụ[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “mkpesa” ma ọ bụ “okwu nzuzo a na-ekwu n’olu dị ala” banyere ya.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ “ọ na-aghọgbu ìgwè mmadụ,” ma ọ bụ “ọ na-eduru ìgwè mmadụ pụọ n’ụzọ ziri ezi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: γογγυσμός
  choice: ntamu
  rationale: “Ntamu” na-egosi okwu a na-ekwu n’olu dị ala, nke nwere ike ịbụ mkpesa ma ọ bụ nkwurịta okwu nzuzo; ọ naghị eme ka okwu ahụ bụrụ arụmụka ọha n’ihu mmadụ niile.
- source_word: περὶ αὐτοῦ
  choice: banyere ya
  rationale: Nke a bụ ụzọ Igbo dị mfe ma bụrụkwa nke e ji eme ihe mgbe a na-ekwu na mmadụ bụ isiokwu okwu.
- source_word: πολύς
  choice: ọtụtụ
  rationale: Ọ na-egosi na ntamu ahụ bara ụba ma gbasaa n’etiti ìgwè mmadụ.
- source_word: ἐν τοῖς ὄχλοις
  choice: n’etiti ìgwè mmadụ
  rationale: Ọ na-egosi na okwu ahụ na-aga n’etiti ndị mmadụ gbakọrọ, ma ghara ime ka ha bụrụ otu ndị nwere otu echiche.
- source_word: οἱ μὲν ... ἄλλοι δὲ
  choice: Ụfọdụ ... Ndị ọzọ ...
  rationale: Nke a na-egosi nke ọma ìgwè abụọ nwere echiche na-emegide ibe ha.
- source_word: Ἀγαθός ἐστιν
  choice: Ọ bụ onye ọma
  rationale: Okwu Grik ahụ na-ekwu banyere ịdị mma nke onye ahụ. “Ọ bụ onye ọma” bụ Igbo doro anya ma dịkwa mma karịa “Ọ dị mma,” nke nwekwara ike ịpụta na ahụ́ dị ya mma.
- source_word: Οὔ, ἀλλὰ
  choice: Mba, kama
  rationale: Ọ na-echekwa nkwụsi ike nke ịjụ okwu mbụ ma tinye echiche megidere ya.
- source_word: πλανᾷ
  choice: ọ na-eduhie
  rationale: '“Na-eduhie” na-echekwa ohere abụọ dị n’okwu Grik ahụ: ime ka mmadụ ghọta ihe na-abụghị eziokwu, ma ọ bụ iduru ya pụọ n’ụzọ ziri ezi, n’enweghị mkpebi na aghụghọ ahụ bụ ụma.'
- source_word: τὸν ὄχλον
  choice: ìgwè mmadụ
  rationale: Nke a na-egosi ọtụtụ mmadụ dịka otu ìgwè, dịka otu aha Grik dị n’akụkụ ikpeazụ nke amaokwu ahụ si dị.
theological_decisions:
- issue: Echiche dị iche iche ndị mmadụ nwere banyere Jizọs
  choice: E debere okwu ọma na okwu ọjọọ ahụ dịka ihe ìgwè abụọ kwuru, n’enweghị nkwado nke onye na-akọ akụkọ ahụ.
  alternative: Ịkọwa otu n’ime echiche ndị ahụ dịka mkpebi onye na-akọ akụkọ ahụ.
  rationale: Amaokwu ahụ na-akọ esemokwu dị n’etiti ndị mmadụ banyere Jizọs; ọ naghị ekpebi n’ebe a na otu okwu bụ nke onye na-akọ akụkọ ahụ kwadoro.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe ma nwee ugwu dee ya. “Ọ bụ onye ọma” na-ezere nghọtahie nke “Ọ dị mma,” ebe “ntamu” na “na-eduhie” na-echekwa obosara ihe okwu Grik ndị ahụ pụrụ ịpụta.
