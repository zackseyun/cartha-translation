  to: Ya mere, mgbe Jizọs nọ n'ụlọ nsọ na-akụzi ihe, o tiri mkpu sị, “Unu maara m, marakwa ebe m si bịa.[a] Esighị m n'onwe m bịa,[b] kama onye zitere m bụ onye eziokwu,[c] onye unu na-amaghị.”
