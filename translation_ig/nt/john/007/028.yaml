id: JHN.7.28
reference: John 7:28
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἔκραξεν οὖν ἐν τῷ ἱερῷ διδάσκων ὁ Ἰησοῦς καὶ λέγων· Κἀμὲ οἴδατε καὶ οἴδατε πόθεν εἰμί· καὶ ἀπ’ ἐμαυτοῦ οὐκ ἐλήλυθα, ἀλλ’ ἔστιν ἀληθινὸς ὁ πέμψας με, ὃν ὑμεῖς οὐκ οἴδατε·
base_translation:
  language: en
  yaml_path: translation/nt/john/007/028.yaml
  text: So Jesus cried out in the temple[a], teaching and saying, “You know me, and you know where I am from. And I have not come from myself, but the one who sent me is true[c][b], whom you do not know.”
translation:
  language: ig
  text: Ya mere, mgbe Jizọs nọ n'ụlọ nsọ na-akụzi ihe, o tiri mkpu sị, “Unu maara m, marakwa ebe m si bịa.[a] Esighị m n'onwe m bịa,[b] kama onye zitere m bụ onye eziokwu,[c] onye unu na-amaghị.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ịnụ okwu a dịka ajụjụ ma ọ bụ okwu ịma aka: “Unu maara m, marakwa ebe m si bịa?” Ma n''asụsụ Grik, e dere ya dịka nkwupụta.'
    reason: alternative_reading
  - marker: b
    text: “Esighị m n'onwe m bịa” nwekwara ike ịpụta, “Abịaghị m n'atụmatụ nke aka m,” ya bụ, Jizọs abịaghị site n'uche ma ọ bụ n'ikike nke aka ya.
    reason: lexical_alternative
  - marker: c
    text: “Onye eziokwu” nwekwara ike ịpụta onye bụ ezigbo ya n'ezie ma ọ bụ onye a pụrụ ịtụkwasị obi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔκραξεν
  choice: o tiri mkpu
  rationale: Nke a na-egosi na Jizọs kwuru okwu n'olu dara ụda n'ihu ọha, n'ebughị echiche na ọ nọ ná mwute.
- source_word: ἐν τῷ ἱερῷ
  choice: n'ụlọ nsọ
  rationale: N'Igbo a bụ ụzọ nkịtị e si ekwu maka mpaghara ụlọ nsọ; okwu Grik ahụ na-ezo aka n'ogige na akụkụ dị iche iche nke ụlọ nsọ, ọ bụghị naanị ebe nsọ dị n'ime.
- source_word: διδάσκων ... καὶ λέγων
  choice: mgbe ... nọ na-akụzi ihe ... sị
  rationale: Nhazi a bụ Igbo dị ndụ ma na-egosikwa na mkpu ahụ mere n'oge ọ na-akụzi ihe.
- source_word: Κἀμὲ οἴδατε καὶ οἴδατε
  choice: Unu maara m, marakwa
  rationale: E debere nkwughachi nke ngwaa ‘ịma’ n'ụzọ dabara n'Igbo, ebe ‘m’ na-anọgide bụrụ ihe e mesiri ike.
- source_word: πόθεν εἰμί
  choice: ebe m si bịa
  rationale: Nke a bụ okwu Igbo doro anya nke na-ahapụ ‘mmalite’ Jizọs ka ọ nwee ma nghọta gbasara ebe mmadụ si ma nghọta miri emi nke dị n'Oziọma Jọn.
- source_word: ἀπ’ ἐμαυτοῦ
  choice: n'onwe m
  rationale: Nke a nwere ike ịpụta na ọ bụghị n'ike ma ọ bụ n'atụmatụ nke aka ya ka ọ bịara, ma ọ naghị etinye nkọwa karịa ihe Grik kwuru.
- source_word: οὐκ ἐλήλυθα
  choice: Abịaghị m
  rationale: Ụdị a bụ Igbo nkịtị ma na-ekwupụta ọbịbịa Jizọs nke metụtara ozi ọ ka na-arụ.
- source_word: ἀληθινὸς
  choice: onye eziokwu
  rationale: Nhọrọ a na-eburu echiche nke ịbụ onye bụ eziokwu, onye a pụrụ ịtụkwasị obi, ma ọ bụ onye bụ ezigbo ya; ihe odide ala peeji na-echekwa obosara ahụ.
- source_word: ὁ πέμψας με
  choice: onye zitere m
  rationale: Nke a na-edobe onye mere ihe ahụ dịka onye ma ghara ịgbakwunye aha ‘Nna’ nke na-adịghị n'ahịrịokwu Grik a.
- source_word: ὃν ὑμεῖς οὐκ οἴδατε
  choice: onye unu na-amaghị
  rationale: Nke a na-echekwa ebubo Jizọs kwuru kpọmkwem nakwa echiche nke ịmara mmadụ, ọ bụghị naanị ịma ihe banyere ya.
theological_decisions:
- issue: Ma okwu ‘Unu maara m, marakwa ebe m si bịa’ bụ nkwupụta nkịtị, okwu ịma aka, ka ọ bụ okwu mkparị zoro ezo
  choice: E debere ya dịka nkwupụta kpọmkwem
  alternative: 'A pụrụ ịgụ ya dịka ajụjụ: ‘Unu maara m, marakwa ebe m si bịa?’ ma ọ bụ dịka okwu ịma aka nwere ntakịrị mkparị.'
  rationale: Ụdị Grik bụ nkwupụta, n'agbanyeghị na ọnọdụ ya nwere ike ime ka a nụ ya dịka okwu ịma aka ma ọ bụ ihe e kwuru n'ụzọ mgbagwoju anya. Nsụgharị ahụ anaghị ekpebi nke ahụ n'aha onye na-agụ ya.
- issue: Ihe ‘ebe m si bịa’ na ‘Abịaghị m n'onwe m’ pụtara gbasara mmalite na ozi Jizọs
  choice: E hapụrụ okwu ndị ahụ ka ha nwee ma nghọta gbasara ebe a maara mmadụ si ma nghọta miri emi gbasara onye zitere Jizọs
  alternative: Ịkọwa ya naanị dịka ebe ala Jizọs si, ma ọ bụ itinye kpọmkwem na ọ si n'eluigwe bịa.
  rationale: Oziọma Jọn na-ejikọkarị nghọta abụọ a ọnụ. Grik nke amaokwu a akọwaghị ‘eluigwe’ kpọmkwem, ya mere nsụgharị ahụ echekwaghị otu nghọta naanị.
- issue: Onye ‘onye zitere m’ na-ezo aka na ya
  choice: E debere ‘onye zitere m’
  alternative: ‘Nna zitere m.’
  rationale: N'agbanyeghị na ọnọdụ Oziọma ahụ na-egosi Nna, amaokwu Grik a ejighị aha ‘Nna’; ya mere, a naghị agbakwunye ya n'ime isi okwu.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị nsọ ma dị mfe nghọta. Nhazi ahịrịokwu ahụ bụ nke Igbo nkịtị, ma e chekwara olu dara ụda, nkwughachi ‘ịma,’ na mgbagwoju anya gbasara mmalite Jizọs. Akara nkọwa ala peeji [a], [b], na [c] niile pụtara n'isi okwu.
