revisions:
- from: Ya mere, ndị nche ahụ laghachikwutere ndịisi nchụaja na ndị Farisii, ndị ahụ wee jụọ ha, “Gịnị mere unu akpọtaghị ya?”
  to: Ya mere, ndị nche ahụ bịakwutere ndị isi nchụaja na ndị Farisii, ndị ahụ wee sị ha, “Gịnị mere unu ewetaghị ya?”
  rationale: 'The revision follows the Greek wording more closely without sacrificing natural Igbo: it avoids adding ‘returned,’ renders the explicit demonstrative with “ndị ahụ,” and uses “ewetaghị” for the officers’ failure to bring Jesus. No footnote is needed because the wording is unambiguous enough in context.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T06:22:25Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly identifies the officers, chief priests, Pharisees, marked demonstrative subject, and the question. However, “laghachikwutere” (“returned”) adds a return nuance not stated by ἦλθον πρὸς, even if the wider context makes it likely. “Bịakwutere” directly represents “came to.” “Akpọtaghị” can suggest “did not summon/call,” whereas ἠγάγετε here calls for the more direct “did not bring [him].”
  naturalness: The revised wording is natural, clear Standard Igbo. Separating “ndị isi nchụaja” corrects the compound spacing, and “ndị ahụ wee sị ha” naturally retains the explicitly marked Greek subject before the direct question.
  terminology: “Ndị nche,” “ndị isi nchụaja,” and “ndị Farisii” are suitable modern Standard Igbo terms in this context. No theological terminology is at issue.
  issues:
  - severity: medium
    issue: “laghachikwutere” adds ‘returned.’
    rationale: The Greek says only that the officers came to the chief priests and Pharisees. The preceding narrative may imply return, but the verse itself does not express it; the translation should not make that inference obligatory.
  - severity: medium
    issue: “akpọtaghị ya” is less exact for ἠγάγετε.
    rationale: In this arrest context, “ewetaghị ya” directly communicates that they failed to bring Jesus, while “kpọta” may be heard as calling or summoning someone.
  - severity: low
    issue: “ndịisi nchụaja” lacks standard word separation.
    rationale: The ordinary Standard Igbo form is “ndị isi nchụaja.”
  revised_text: Ya mere, ndị nche ahụ bịakwutere ndị isi nchụaja na ndị Farisii, ndị ahụ wee sị ha, “Gịnị mere unu ewetaghị ya?”
  revised_footnotes: []
  revision_rationale: 'The revision follows the Greek wording more closely without sacrificing natural Igbo: it avoids adding ‘returned,’ renders the explicit demonstrative with “ndị ahụ,” and uses “ewetaghị” for the officers’ failure to bring Jesus. No footnote is needed because the wording is unambiguous enough in context.'
