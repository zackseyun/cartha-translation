  text: Ἦλθον οὖν οἱ ὑπηρέται πρὸς τοὺς ἀρχιερεῖς καὶ Φαρισαίους, καὶ εἶπον αὐτοῖς ἐκεῖνοι· Διὰ τί οὐκ ἠγάγετε αὐτόν;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/045.yaml
  text: So the officers came to the chief priests and Pharisees[a], and they said to them[b], “Why did you not bring him?”
translation:
  language: ig
  text: Ya mere, ndị nche ahụ bịakwutere ndị isi nchụaja na ndị Farisii, ndị ahụ wee sị ha, “Gịnị mere unu ewetaghị ya?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὖν
  choice: Ya mere
  rationale: Na-egosi ihe si n’ihe ndị mere tupu nke a pụta, ma na-adabara asụsụ akụkọ Igbo.
- source_word: ὑπηρέται
  choice: ndị nche ahụ
  rationale: N’ọnọdụ a, okwu ahụ na-ezo aka ná ndị ọrụ ndị ọchịchị zipụrụ ka ha jide Jizọs; ‘ndị nche’ doro anya karịa ‘ndị ohu’ ma ọ bụ ‘ndị ọrụ’.
- source_word: ἀρχιερεῖς
  choice: ndịisi nchụaja
  rationale: Nke a bụ aha kwesịrị ekwesị maka ìgwè ndị ndu nchụaja, ọ bụghị nanị otu nnukwu onye nchụaja.
- source_word: Φαρισαίους
  choice: ndị Farisii
  rationale: Nsụgharị aha ìgwè ndị Juu a nke a na-aghọta nke ọma n’Igbo.
- source_word: ἦλθον ... πρὸς
  choice: laghachikwutere
  rationale: Ihe gbara amaokwu ahụ gburugburu na-egosi na ndị e zipụrụ laghachiri n’ebe ndị zipụrụ ha nọ; nke a na-enye Igbo dị mfe ma na-edebe ihe okwu Grik pụtara n’ọnọdụ a.
- source_word: ἐκεῖνοι
  choice: ndị ahụ
  rationale: Na-edebe nnọchiaha ngosi e kwusiri ike na Grik, nke na-ezo aka ná ndịisi nchụaja na ndị Farisii.
- source_word: Διὰ τί
  choice: Gịnị mere
  rationale: Ụzọ Igbo nkịtị na nke doro anya isi jụọ ihe kpatara ihe.
- source_word: ἠγάγετε
  choice: akpọtaghị
  rationale: Ọ bụ ezie na ngwaa ahụ nwere ike ịbụ ‘dupụta’ ma ọ bụ ‘kpọta,’ ‘kpọta’ kacha dabara n’ọrụ e nyere ndị nche ka ha jide Jizọs kpọta ya.
- source_word: αὐτόν
  choice: ya
  rationale: Nnọchiaha ihe a na-eme ihe na-ezo aka na Jizọs.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo Izugbe dị ugbu a, dị ùgwù ma dị mfe nghọta. E debere ‘ndị ahụ’ iji gosi ike nnọchiaha ngosi ἐκεῖνοι, n’agbanyeghị na ‘ha’ ga-adị ntakịrị mfe karịa n’Igbo.
