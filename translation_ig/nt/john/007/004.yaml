source:
  edition: SBLGNT
  text: οὐδεὶς γάρ ⸂τι ἐν κρυπτῷ⸃ ποιεῖ καὶ ζητεῖ αὐτὸς ἐν παρρησίᾳ εἶναι· εἰ ταῦτα ποιεῖς, φανέρωσον σεαυτὸν τῷ κόσμῳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/004.yaml
  text: For no one does anything in secret while seeking to be in public view. If you do these things, show yourself to the world.
translation:
  language: ig
  text: N’ihi na ọ dịghị onye na-eme ihe ọ bụla na nzuzo ma ya onwe ya na-achọ ka a hụ ya n’ihu ọha.[a] Ọ bụrụ na ị na-eme ihe ndị a, gosi onwe gị nye ụwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “ka a mara ya n’ihu ọha” ma ọ bụ “ka ọ pụta ìhè n’ihu ọha.” Okwu Grik a na-emesi ịpụta ìhè ma ọ bụ ịbụ onye a na-ahụ n’ihu ọha ike.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδεὶς γάρ
  choice: N’ihi na ọ dịghị onye
  rationale: “N’ihi na” na-egosipụta na okwu a na-akọwa ihe e kwuru na amaokwu bu ya ụzọ; “ọ dịghị onye” na-enye οὐδεὶς n’ụzọ doro anya ma kwekọọ n’Igbo nkịtị.
- source_word: τι ἐν κρυπτῷ ποιεῖ
  choice: na-eme ihe ọ bụla na nzuzo
  rationale: “Ihe ọ bụla” na-anọchite anya τι n’okwu nkwụghachi a, ebe “na nzuzo” na-enye echiche nke ihe zoro ezo dị na ἐν κρυπτῷ.
- source_word: καὶ ζητεῖ αὐτὸς
  choice: ma ya onwe ya na-achọ
  rationale: “Ma” na-eme ka ọdịiche dị n’etiti ime ihe na nzuzo na ịchọ ọhaneze hụ mmadụ pụta ìhè; “ya onwe ya” na-echekwa nkwusi ike nke αὐτός.
- source_word: ἐν παρρησίᾳ εἶναι
  choice: ka a hụ ya n’ihu ọha
  rationale: N’ebe a, παρρησία na-ezo aka n’ịpụta ìhè n’ihu ọha, ọ bụghị n’ikwu okwu n’atụghị egwu. Nsụgharị a bụ nke mmadụ nkịtị ga-aghọta ma na-echekwa echiche nke ọhaneze ịhụ onye ahụ.
- source_word: εἰ ταῦτα ποιεῖς
  choice: Ọ bụrụ na ị na-eme ihe ndị a
  rationale: Ọ na-echekwa ọnọdụ nke εἰ na omume na-aga n’ihu nke ngwaa dị ugbu a n’ụzọ Igbo na-ada nke ọma.
- source_word: φανέρωσον σεαυτὸν
  choice: gosi onwe gị
  rationale: Ọ na-enye iwu ahụ kpọmkwem ma na-echekwa echiche nke ime ka onye ahụ pụta ìhè.
- source_word: τῷ κόσμῳ
  choice: nye ụwa
  rationale: “Ụwa” na-echekwa okwu Jọn ji eme ihe ugboro ugboro na mgbagwoju echiche κόσμος nwere, kama ibelata ya naanị ka ọ bụrụ “ọha mmadụ.”
theological_decisions:
- issue: Ihe κόσμος pụtara n’akwụkwọ Jọn
  choice: ụwa
  alternative: ọha mmadụ
  rationale: Ọ bụ ezie na ọnọdụ a na-ekwu maka ịpụta n’ihu ọha, “ụwa” na-echekwa ma ihe okwu ahụ pụtara ozugbo ma ụda pụrụ iche κόσμος nwere n’akwụkwọ Jọn, n’etinyeghị nkọwa okpukpe ọzọ n’amaokwu ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị mfe nghọta ma dịkwa ugwu, dee ya. A hapụrụ ọdịiche dị n’etiti “na nzuzo” na “n’ihu ọha” ka ọ pụta ìhè, ma chekwaa nkwusi ike nke αὐτός site n’okwu “ya onwe ya.”
