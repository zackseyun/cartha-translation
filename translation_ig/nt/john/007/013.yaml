  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οὐδεὶς μέντοι παρρησίᾳ ἐλάλει περὶ αὐτοῦ διὰ τὸν φόβον τῶν Ἰουδαίων.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/013.yaml
  text: Yet no one was speaking openly about him for fear of the Jews[a].
translation:
  language: ig
  text: Ma, ọ dịghị onye na-ekwu okwu n’ihu ọha banyere ya, n’ihi ịtụ ndị Juu egwu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n’ọnọdụ a kpọmkwem, “ndị isi Juu” ma ọ bụ “ndị ọchịchị Judia.” N’akwụkwọ Jọn, “ndị Juu” nwere ike ịpụta ndị Juu n’ozuzu ha ma ọ bụ, n’ebe ụfọdụ, ọ na-ezo aka n’ndị ọchịchị nọ na Jerusalem bụ́ ndị megidere Jizọs.
    reason: alternative_reading
lexical_decisions:
- source_word: οὐδεὶς
  choice: ọ dịghị onye
  rationale: Nke a bụ ụzọ Igbo nkịtị na nke doro anya si egosipụta nnọchiaha na-adịghị akọwapụta onye ma na-ajụ mmadụ niile n’ìgwè ahụ.
- source_word: μέντοι
  choice: Ma
  rationale: Ọ na-egosi obere ntụgharị megide mkparịta ụka na echiche dị iche iche e kwuru n’amaokwu bu ụzọ.
- source_word: παρρησίᾳ
  choice: n’ihu ọha
  rationale: N’ebe a, okwu ahụ pụtara ikwu okwu n’ezoghị ọnụ ma ọ bụ n’enweghị izochi ya n’ebe mmadụ niile nọ; ‘n’ihu ọha’ na-egosipụta echiche a n’Igbo dị mfe.
- source_word: ἐλάλει
  choice: na-ekwu okwu
  rationale: Ụdị imperfect na-egosi omume na-aga n’ihu ma ọ bụ nke a na-eme n’oge ahụ; ‘na-ekwu okwu’ na-edobe akụkụ a.
- source_word: περὶ αὐτοῦ
  choice: banyere ya
  rationale: Nke a bụ nsụgharị Igbo kwụ ọtọ ma dịkwa mma maka περί ya na genitive.
- source_word: διὰ τὸν φόβον
  choice: n’ihi egwu
  rationale: διά ya na accusative na-egosi ihe kpatara ya; ‘n’ihi egwu’ na-edobe usoro aha ahụ n’enweghị ịgbasa ihe ederede.
- source_word: τῶν Ἰουδαίων
  choice: ndị Juu
  rationale: Ἰουδαῖοι nwere ike ịpụta ndị Juu n’ozuzu, ndị Judia, ma ọ bụ ndị ọchịchị Juu dabere n’ọnọdụ. E debere okwu sara mbara n’ahịrị isi, ebe nkọwa ala peeji na-egosi ihe ọ pụrụ ịpụta kpọmkwem n’ebe a.
theological_decisions:
- issue: Ndị okwu τῶν Ἰουδαίων na-ezo aka na ha n’akụkọ Jọn
  choice: ndị Juu n’ahịrị isi, tinyere nkọwa ala peeji
  alternative: ndị isi Juu; ndị ọchịchị Judia
  rationale: Nhọrọ a na-edobe mbara okwu Grik na mgbagwoju anya ya, ma nkọwa ala peeji na-eme ka o doo anya na n’ọnọdụ a ọ pụrụ izo aka karịsịa n’ebe ndị isi ma ọ bụ ndị ọchịchị nọ, ka a ghara ịghọta ya dị ka ebubo megide ndị Juu niile.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke oge a, dị ùgwù ma dị mfe nghọta. E jiri ‘n’ihu ọha’ mee ka echiche ikwu okwu n’ezoghị ọnụ n’ebe mmadụ niile nọ pụta ìhè, ma e chekwara ịdịgasị nke okwu ‘ndị Juu’ site na nkọwa ala peeji.
