  to: Ma, ọ dịghị onye na-ekwu okwu n’ihu ọha banyere ya, n’ihi ịtụ ndị Juu egwu[a].
  rationale: The revision retains the source’s ambiguity about τῶν Ἰουδαίων in the main text and retains the imperfective sense of ἐλάλει. It improves the Igbo expression of fear and corrects the footnote’s reference to the relevant authorities without adding historical or theological claims beyond the audit trail.
