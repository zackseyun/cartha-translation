- from: Ọ bụ n’ihi nke a ka Mosis nyere unu iwu ibi úgwù—ọ bụghị na ibi úgwù si n’aka Mosis[a], kama o si n’aka ndị nna nna—ma unu na-ebi nwoke úgwù n’ụbọchị izu ike.
  to: Ọ bụ n’ihi nke a ka Mosis enyela unu ibi úgwù—ọ bụghị na ibi úgwù sitere na Mosis, kama o sitere n’aka ndị nna ochie—unu na-ebi nwoke úgwù n’ụbọchị Sabat.
  rationale: Removed the added «iwu», used «enyela» to represent the perfect δέδωκεν, and replaced the generic-sounding «ụbọchị izu ike» with the specific biblical term «ụbọchị Sabat». The parenthesis retains the source’s clarification that circumcision derives from the fathers/patriarchal ancestors rather than Moses, without naming or expanding that referent.
