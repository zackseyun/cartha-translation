  text: διὰ τοῦτο Μωϋσῆς δέδωκεν ὑμῖν τὴν περιτομήν— οὐχ ὅτι ἐκ τοῦ Μωϋσέως ἐστὶν ἀλλ’ ἐκ τῶν πατέρων— καὶ ἐν σαββάτῳ περιτέμνετε ἄνθρωπον.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/022.yaml
  text: For this reason Moses has given you circumcision—not that it is from Moses[a], but from the fathers—and on the Sabbath you circumcise a man.
translation:
  language: ig
  text: Ọ bụ n’ihi nke a ka Mosis enyela unu ibi úgwù—ọ bụghị na ibi úgwù sitere na Mosis, kama o sitere n’aka ndị nna ochie—unu na-ebi nwoke úgwù n’ụbọchị Sabat.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Ọ bụ n’ihi nke a
  rationale: Nke a na-edobe njikọ nke na-egosi ihe kpatara okwu ahụ, ma na-ada nke ọma n’Igbo ugbu a.
- source_word: Μωϋσῆς
  choice: Mosis
  rationale: Nke a bụ ọdịdị aha ahụ a na-ejikarị eme ihe n’Igbo.
- source_word: δέδωκεν ὑμῖν τὴν περιτομήν
  choice: nyere unu iwu ibi úgwù
  rationale: N’Igbo, ‘ibi úgwù’ bụ ụzọ nkịtị e si akọwa περιτομή; itinye ‘iwu’ na-eme ka o doo anya na ihe Mosis nyere ha bụ usoro e nyere ka a na-eme, ọ bụghị ihe a na-ahụ anya.
- source_word: οὐχ ὅτι ἐκ τοῦ Μωϋσέως ἐστὶν ἀλλ’ ἐκ τῶν πατέρων
  choice: ọ bụghị na ibi úgwù si n’aka Mosis, kama o si n’aka ndị nna nna
  rationale: ‘Si n’aka’ na-egosi isi mmalite; ‘ndị nna nna’ na-edobe ntụaka ahụ n’ebe ndị nna ochie nke Izrel nọ, n’akọwaghị ya karịa ihe odide ahụ kwuru.
- source_word: ἐν σαββάτῳ
  choice: n’ụbọchị izu ike
  rationale: Nke a bụ okwu Igbo doro anya maka ụbọchị Sabat ma na-egosi oge omume ahụ na-eme.
- source_word: περιτέμνετε ἄνθρωπον
  choice: unu na-ebi nwoke úgwù
  rationale: Oge ngwaa ahụ na-egosi omume ha na-emekarị; ‘nwoke’ na-edobe na onye a na-ebi úgwù bụ nwoke.
theological_decisions:
- issue: Ndị a kpọrọ ‘ndị nna nna’ bụ ndị ole?
  choice: A hapụrụ ya dị ka ‘ndị nna nna,’ ya bụ ndị nna ochie ndị ibi úgwù malitere n’oge ha tupu Mosis.
  alternative: Ịsụgharị ya n’ụzọ sara mbara dị ka ‘ndị nna ochie Izrel.’
  rationale: Ihe Jizọs kwuru na-egosi na ibi úgwù esiteghị na Mosis malite, ma ederede ahụ akpọghị otu nna ochie aha; ya mere nsụgharị ahụ ekwesịghị ịgbakwụnye nkọwa n’ahụ isiokwu ahụ.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. Akara ogologo okwu dị n’etiti na-egosi na nkebi gbasara isi mmalite ibi úgwù bụ nkọwa e tinyere n’etiti okwu.
