revisions:
- from: Oge emume ndị Juu, ya bụ Emume Ụlọikwuu[a], eruola nso.
  to: Emume ndị Juu, ya bụ, Emume Ụlọikwuu[a], dị nso.
  rationale: The revision restores the source’s past stative sense (“was near”) by replacing the completive expression “eruola nso” with “dị nso,” and removes the added noun “Oge.” The conventional festival name and its literal lexical alternative are retained.
  reviewer_model: gpt-5.6-terra
