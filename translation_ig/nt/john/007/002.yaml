  text: ἦν δὲ ἐγγὺς ἡ ἑορτὴ τῶν Ἰουδαίων ἡ σκηνοπηγία.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/002.yaml
  text: The Jewish feast[a], the Feast of Tabernacles, was near.
translation:
  language: ig
  text: Emume ndị Juu, ya bụ, Emume Ụlọikwuu[a], dị nso.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n'ụzọ nkịtị karị, “Emume Ụlọ Nta.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: (ekwughị ya iche)
  rationale: Ọ bụ njikọ okwu dị nro nke na-ebuga akụkọ gaa n'ihu. N'Igbo, itinye “ma” ebe a nwere ike igosi mmegide siri ike karịa nke dị n'okwu Grik, ya mere usoro ahịrịokwu na ọnọdụ gbara ya gburugburu na-eburu ọrụ njikọ ahụ.
- source_word: ἐγγὺς
  choice: eruola nso
  rationale: N'ebe a okwu ahụ na-ekwu na oge emume ahụ na-abịa ngwa ngwa; “eruola nso” bụ Igbo doro anya ma dị ndụ maka ịdị nso n'oge.
- source_word: ἑορτή
  choice: emume
  rationale: “Emume” na-egosi mmemme okpukpe a na-eme n'oge a kara aka, ma bụrụ okwu ndị na-agụ Igbo taa ga-aghọta nke ọma.
- source_word: τῶν Ἰουδαίων
  choice: ndị Juu
  rationale: N'usoro “emume ndị Juu,” njikọ nwe na-akọwa na nke a bụ emume nke ndị Juu; ọ naghị enye okwu ahụ ụda esemokwu.
- source_word: σκηνοπηγία
  choice: Emume Ụlọikwuu
  rationale: Nke a bụ aha Igbo a ga-amata nke ọma maka emume ahụ, nke metụtara ibi n'ụlọ nwa oge. Ihe okwu Grik ahụ pụtara n'ụzọ nkịtị ka akọwara n'ala peeji.
theological_decisions:
- issue: Ụzọ e si kọwaa τῶν Ἰουδαίων n'aha emume
  choice: emume ndị Juu
  alternative: emume Juu
  rationale: Nhọrọ a na-edobe njikọ nwe nke okwu Grik ma na-egosi nanị ndị nwe emume ahụ, n'enweghị itinye echiche esemokwu na-adịghị n'amaokwu a.
- issue: Aha σκηνοπηγία
  choice: Emume Ụlọikwuu
  alternative: Emume Ụlọ Nta
  rationale: Aha a họọrọ na-eme ka ndị na-agụ ya mata emume ahụ ngwa ngwa, ebe nkọwa ala peeji na-echekwa ihe aha Grik ahụ pụtara n'ụzọ nkịtị.
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe nke oge a, dị mfe ma dị ùgwù. E tinyere “oge” iji mee ka ịdị nso n'oge doo anya n'Igbo, ma “ya bụ” na-egosi na “Emume Ụlọikwuu” bụ nkọwa aha emume ndị Juu ahụ.
