  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οἱ οὖν Ἰουδαῖοι ἐζήτουν αὐτὸν ἐν τῇ ἑορτῇ καὶ ἔλεγον· Ποῦ ἐστιν ἐκεῖνος;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/011.yaml
  text: So the Jews were looking for him at the feast and were saying[a], “Where is that one?”
translation:
  language: ig
  text: Ya mere, ndị Juu nọ na-achọ ya n’ememme ahụ ma na-ekwu, sị, “Olee ebe onye ahụ nọ?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὖν
  choice: Ya mere
  rationale: Na-egosi njikọ na ihe gara n’ihu; ọ na-eburu echiche nke ‘ya mere/wee’ n’Igbo doro anya.
- source_word: Ἰουδαῖοι
  choice: ndị Juu
  rationale: Ọ bụ nsụgharị kpọmkwem nke na-adịghị amachi ndị a ka ha bụrụ naanị ndị isi; a debere nghọta ọzọ dabere n’ọnọdụ akụkọ n’okpuru peeji.
- source_word: ἐζήτουν
  choice: nọ na-achọ
  rationale: Na-egosipụta omume na-aga n’ihu nke imperfect ahụ, ya bụ na ha nọgidere na-achọ ya n’oge ahụ.
- source_word: ἐν τῇ ἑορτῇ
  choice: n’oge Ememme ahụ
  rationale: Na-egosi na omume ahụ mere n’ime oge ememme ahụ e kwuburu okwu ya.
- source_word: ἔλεγον
  choice: na-ajụkwa sị
  rationale: Ajụjụ sochiri ngwaa ahụ mere ka ‘na-ajụkwa sị’ bụrụ Igbo ebumpụta ụwa, ma ọ ka na-egosi okwu a na-ekwu ugboro ugboro ma ọ bụ na-aga n’ihu.
- source_word: ἐκεῖνος
  choice: onye ahụ
  rationale: Na-echekwa ike demonstrative ahụ karịa iji naanị ‘ọ,’ n’etinyeghị okwu ‘nwoke’ nke Grik ekwughị kpọmkwem.
theological_decisions:
- issue: Ndị οἱ Ἰουδαῖοι na-ezo aka na ha n’Akụkọ Ọma Jọn
  choice: ndị Juu
  alternative: ndị Judia; ma eleghị anya, ndị ọchịchị ndị Juu nọ na Judia
  rationale: Amaokwu a n’onwe ya akọwaghị ha dịka naanị ndị isi. Ya mere, isi ederede anaghị eme ka ihe okwu Grik ahụ pụtara dị warara, ebe nkọwa ala peeji na-echekwa nghọta ọzọ nke ọnọdụ akụkọ nwere ike ịkwado.
translation_notes:
  register: Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E ji ‘Ememme ahụ’ gosi ememme a kpọtụrụ aha na gburugburu amaokwu ahụ; ‘onye ahụ’ na-echekwa ntakịrị mmetụta nke ịdị anya dị na ἐκεῖνος.
