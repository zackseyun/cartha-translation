  text: λέγει Νικόδημος πρὸς αὐτούς, ὁ ⸀ἐλθὼν πρὸς αὐτὸν ⸀πρότερον, εἷς ὢν ἐξ αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/john/007/050.yaml
  text: Nicodemus[a], the one who had come to him earlier, being one of them, said to them,
translation:
  language: ig
  text: Nikọdimọs, onye ahụ bịakwutere ya na mbụ, onye bụ otu n’ime ha, sịrị ha,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: sịrị
  rationale: Ọ bụ historical present n’asụsụ Grik, ma oge gara aga dabara nke ọma n’akụkọ Igbo ma na-edebe ọrụ okwu ahụ n’akụkọ.
- source_word: Νικόδημος
  choice: Nikọdimọs
  rationale: E degharịrị aha onye ahụ n’ụdị a na-eji n’Igbo.
- source_word: πρὸς αὐτούς
  choice: ha
  rationale: Mgbe e jikọtara ya na ngwaa ‘sịrị,’ ‘sịrị ha’ bụ ụzọ Igbo ebumpụta ụwa si egosi ndị a gwara okwu.
- source_word: ὁ ἐλθὼν πρὸς αὐτὸν πρότερον
  choice: onye ahụ bịakwutere ya na mbụ
  rationale: Nkebi a na-akọwapụta Nikọdimọs; ‘bịakwutere’ na-egosi ịbịakwute mmadụ, ebe ‘na mbụ’ na-edebe temporal priority nke πρότερον.
- source_word: εἷς ὢν ἐξ αὐτῶν
  choice: ebe ọ bụ otu onye n’ime ha
  rationale: Nke a na-edebe nkebi participle ahụ dịka ozi ndabere gbasara ịbụ onye otu ha, na-enweghị ime ka ọ bụrụ ihe kpatara okwu ya.
theological_decisions:
- issue: Onye αὐτόν na-ezo aka na ya n’okwu ‘onye ahụ bịakwutere ya na mbụ’
  choice: E debere nnọchiaha ahụ dịka ‘ya’; ihe gbara amaokwu ahụ gburugburu na-egosi na ọ na-ezo aka na Jizọs.
  alternative: Ịkpọ Jizọs aha kpọmkwem n’ahịrị amaokwu ahụ.
  rationale: Jọn 3:1–2 na-eme ka onye nnọchiaha ahụ na-ezo aka na ya doo anya, ma ide ‘ya’ na-echekwa ụdị na ntakịrị ambiguity nke Grik kama itinye aha na-adịghị n’amaokwu ahụ.
translation_notes:
  register: Asụsụ Igbo Izugbe dị ugbu a, dị ùgwù ma dị mfe nghọta. E debere usoro apposition nke Grik n’ụzọ Igbo na-aga were were; a gbakwụnyeghị akara nkọwa n’ihi na ‘ya’ na-echekwa okwu isi mmalite, ebe ihe gbara ya gburugburu na-akọwa onye ọ bụ.
