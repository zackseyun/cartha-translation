  text: σχίσμα οὖν ⸂ἐγένετο ἐν τῷ ὄχλῳ⸃ δι’ αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/043.yaml
  text: So there was a division in the crowd because of him.
translation:
  language: ig
  text: Ya mere, nkewa mere n’etiti ìgwè mmadụ ahụ n’ihi ya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σχίσμα
  choice: nkewa
  rationale: Okwu a na-egosi ikewa echiche ma ọ bụ nkewa n’etiti ndị mmadụ; “nkewa” bụ okwu Igbo doro anya ma kwekọọ n’ọnọdụ a.
- source_word: οὖν
  choice: Ya mere
  rationale: Ọ na-ejikọta amaokwu a na mkparịta ụka gara aga dị ka ihe si na ya pụta, n’enweghị ime ka njikọ ahụ bụrụ arụmụka iwu siri ike.
- source_word: ἐγένετο
  choice: dapụtara
  rationale: N’ebe a γίνομαι na-egosi na nkewa malitere ma pụta ìhè; “dapụtara” bụ ụzọ Igbo dị ndụ isi kwuo ya.
- source_word: ἐν τῷ ὄχλῳ
  choice: n’etiti ìgwè mmadụ ahụ
  rationale: ὄχλος na-ezo aka n’ìgwè mmadụ gbakọtara ebe ahụ; “n’etiti ìgwè mmadụ ahụ” na-egosi na nkewa ahụ dị n’ime ha.
- source_word: δι’ αὐτόν
  choice: n’ihi ya
  rationale: διά na ebubo na-egosi ihe kpatara ya. “N’ihi ya” na-echekwa nnọchiaha ahụ ma na-egosi na ọ bụ ya kpatara esemokwu ahụ.
theological_decisions:
- issue: Onye αὐτόν na-ezo aka na ya
  choice: E debere ya dị ka “ya,” nke na-ezo aka na Jizọs site n’ọnọdụ okwu ahụ.
  alternative: “n’ihi Jizọs”
  rationale: Asụsụ mbụ ji nnọchiaha mee ihe, asụsụ Igbo nwekwara ike idobe ya n’ụzọ eke. Ọnọdụ amaokwu ndị gbara ya gburugburu na-eme ka onye ọ na-ezo aka na ya doo anya, ya mere ọ dịghị mkpa ịkọwa karịa ihe odide ahụ kwuru.
translation_notes:
  register: Asụsụ Igbo Izugbe dị ugbu a, dị ùgwù ma dị mfe nghọta. Ahọrọla “ìgwè mmadụ” karịa okwu nwere ike ịpụta naanị ọtụtụ mmadụ n’ozuzu, ka a chekwaa echiche nke ndị gbakọtara n’ebe ahụ.
