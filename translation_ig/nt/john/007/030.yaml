revisions:
- from: Ya mere, ha nọ na-achọ ijide ya[a], ma ọ dịghị onye metụrụ ya aka iji jide ya, n’ihi na oge awa ya erubeghị.
  to: Ya mere, ha nọ na-achọ ijide ya[a], ma ọ dịghị onye ọ bụla tụkwasịrị ya aka, n’ihi na oge ya[b] erubeghị.
  rationale: The revision replaces a weakened and expanded rendering of the Greek hand idiom with a natural Igbo equivalent, removes the redundant “oge awa,” and adds a contextual footnote for the Johannine expression while leaving its full significance open in the main text.
  reviewer_model: gpt-5.6-terra
