  edition: SBLGNT
  text: ἐζήτουν οὖν αὐτὸν πιάσαι, καὶ οὐδεὶς ἐπέβαλεν ἐπ’ αὐτὸν τὴν χεῖρα, ὅτι οὔπω ἐληλύθει ἡ ὥρα αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/030.yaml
  text: So they were seeking to seize him[a], yet no one laid a hand on him[b], because his hour had not yet come.
translation:
  language: ig
  text: Ya mere, ha nọ na-achọ ijide ya[a], ma ọ dịghị onye ọ bụla tụkwasịrị ya aka, n’ihi na oge ya[b] erubeghị.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ha nọ na-achọ ijide ya dịka onye a na-ejide n’iwu.” Ngwaa Grik ahụ pụtara “ijide”; n’ọnọdụ a, ọ pụrụ ịpụta ijide mmadụ n’iwu.
    reason: lexical_alternative
  - marker: b
    text: “Oge ya” bụ okwu Jọn ji ugboro ugboro maka oge Chineke kara aka n’ọrụ Jizọs; n’akụkụ ndị ọzọ, ọ metụtara ahụhụ ya, ọnwụ ya, mbilite n’ọnwụ, na otuto ya.
    reason: cross_reference
lexical_decisions:
- source_word: ἐζήτουν
  choice: ha nọ na-achọ
  rationale: Na-egosipụta omume gara n’ihu ma ọ bụ mgbalị ha nọgidere na-eme, dịka imperfect Grik si dị.
- source_word: οὖν
  choice: Ya mere
  rationale: Na-ejikọta ihe a na okwu ndị bu ya ụzọ ma na-egosipụta ihe si na ha pụta.
- source_word: πιάσαι
  choice: ijide
  rationale: “Ijide” nọ nso na isi ihe ngwaa Grik pụtara; n’ọnọdụ a ọ pụrụ ịpụta ijide ya dịka onye a na-ejide n’iwu, ma e tinyeghị nkọwa iwu ahụ kpọmkwem n’ahịrị bụ isi.
- source_word: οὐδεὶς
  choice: ọ dịghị onye
  rationale: Ọ bụ ntụgharị doro anya na nke e ji eme ihe n’Igbo maka nnọchiaha njụ zuru ezu.
- source_word: ἐπέβαλεν ἐπ’ αὐτὸν τὴν χεῖρα
  choice: metụrụ ya aka iji jide ya
  rationale: Na-eburu echiche nke ịtụkwasị mmadụ aka iji jide ya, n’Igbo nkịtị nke na-eme ka ebumnuche okwu ahụ doo anya.
- source_word: ὅτι
  choice: n’ihi na
  rationale: Na-ewebata ihe kpatara na ọ dịghị onye jidere ya.
- source_word: οὔπω
  choice: erubeghị
  rationale: Na-egosipụta na oge ahụ abịabeghị ruo mgbe ahụ.
- source_word: ἐληλύθει
  choice: erubeghị
  rationale: Ụdị a na-egosipụta na oge ahụ erubeghị n’oge akụkọ a; ngwaa “iru” dabara nke ọma na oge awa n’Igbo.
- source_word: ἡ ὥρα αὐτοῦ
  choice: oge awa ya
  rationale: Na-echekwa okwu “awa” nke Jọn ji ugboro ugboro, ma “oge awa” na-eme ka ọ bụrụ Igbo kwụ ọtọ ma ghara imechi ihe okwu ahụ pụtara naanị n’ọnwụ Jizọs.
theological_decisions:
- issue: Ihe “oge awa ya” pụtara n’Oziọma Jọn
  choice: Idowe “oge awa ya” n’ahịrị bụ isi na-enweghị ịkọwa ya naanị dịka oge ọnwụ ya.
  alternative: oge ya; oge a kara aka maka ọnwụ ya
  rationale: N’Oziọma Jọn, okwu ahụ nwere omimi gbasara oge Chineke kara maka ọrụ Jizọs, karịsịa ahụhụ, ọnwụ, mbilite n’ọnwụ na otuto ya. Amaokwu a n’onwe ya akọwaghị ya dịka naanị ọnwụ, ya mere ntụgharị ahụ na-echekwa obosara na esemokwu nkà mmụta okpukpe dị na ya.
translation_notes:
  register: Igbo ọkọlọtọ, nke oge a, dị ùgwù ma dị mfe nghọta. E ji “oge awa ya” chekwaa okwu pụrụ iche Jọn ji, ebe “metụrụ ya aka iji jide ya” na-enye akpaalaokwu Grik n’Igbo doro anya. Akara ndetu ala ala [a] pụtara n’ahịrị bụ isi.
