review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the ongoing attempt in ἐζήτουν, the intended apprehension in πιάσαι, the negation, and the causal clause. However, “metụrụ ya aka iji jide ya” weakens the Greek idiom by making it merely a touch and adds an explicit purpose clause. “oge awa ya” is unnecessarily redundant in standard modern Igbo; “oge ya” is the established natural equivalent and retains the Johannine expression without narrowing it.
  naturalness: “Ha nọ na-achọ ijide ya” is natural and suitably conveys an ongoing attempt. “Ọ dịghị onye ọ bụla tụkwasịrị ya aka” is a more idiomatic rendering of laying a hand on someone. “Oge ya erubeghị” is clearer and more idiomatic than “oge awa ya erubeghị.”
  terminology: Retain “ijide” for πιάσαι, with an arrest-related alternative in a footnote. Render ἡ ὥρα αὐτοῦ as “oge ya,” preserving the recurring Johannine term and its deliberate breadth. The explanatory note identifies its narrative usage without defining it according to a particular doctrinal scheme.
  issues:
  - severity: medium
    issue: The phrase “metụrụ ya aka iji jide ya” does not adequately render ἐπέβαλεν ἐπ’ αὐτὸν τὴν χεῖρα.
    rationale: “Metụ aka” primarily means touch, whereas the Greek idiom means to lay a hand on someone in order to take hold of them. The added “iji jide ya” is explanatory and redundant. “Tụkwasịrị ya aka” better conveys the idiom in Igbo.
  - severity: medium
    issue: “oge awa ya” is redundant and less natural in Standard Igbo.
    rationale: Both oge and awa convey time/hour, so their combination is unnecessarily repetitive here. “Oge ya” is natural and preserves the Johannine expression without over-specifying its meaning.
  - severity: low
    issue: The draft lacks an anchor and note for the recurring Johannine expression “his hour.”
    rationale: A brief note is useful to preserve the English audit trail’s contextual information, while keeping the main text unexpanded.
  revised_text: Ya mere, ha nọ na-achọ ijide ya[a], ma ọ dịghị onye ọ bụla tụkwasịrị ya aka, n’ihi na oge ya[b] erubeghị.
  revised_footnotes:
  - marker: a
