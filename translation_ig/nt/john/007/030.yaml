    reason: cross_reference
  revision_rationale: The revision replaces a weakened and expanded rendering of the Greek hand idiom with a natural Igbo equivalent, removes the redundant “oge awa,” and adds a contextual footnote for the Johannine expression while leaving its full significance open in the main text.
