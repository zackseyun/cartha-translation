id: JHN.7.23
reference: John 7:23
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἰ περιτομὴν ⸀λαμβάνει ἄνθρωπος ἐν σαββάτῳ ἵνα μὴ λυθῇ ὁ νόμος Μωϋσέως, ἐμοὶ χολᾶτε ὅτι ὅλον ἄνθρωπον ὑγιῆ ἐποίησα ἐν σαββάτῳ;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/023.yaml
  text: If a man receives circumcision on the Sabbath so that the law of Moses may not be broken[c][b][a], are you angry with me because I made a whole man well on the Sabbath?
translation:
  language: ig
  text: Ọ bụrụ na a na-ebi nwoke úgwù n’ụbọchị izu ike ka a ghara imebi Iwu Mosis[b], unu na-eweso m iwe n’ihi na mere m ka nwoke dum dị mma n’ụbọchị izu ike?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Okwu ahụ bụ “nwoke dum dị mma” na-eme ka ọdịiche Jizọs gosiri pụta ìhè: a na-ebi úgwù n’otu akụkụ ahụ, ma o mere ka nwoke ahụ dum dị mma.'
    reason: cross_reference
  - marker: b
    text: A pụkwara ịsụgharị ya, “ka a ghara iwepụ Iwu Mosis” ma ọ bụ “ka a ghara ịkagbu Iwu Mosis.”
    reason: lexical_alternative
lexical_decisions:
- source_word: περιτομὴν λαμβάνει
  choice: a na-ebi nwoke úgwù
  rationale: Nke a bụ ụzọ Igbo dị mfe ma doo anya isi kwuo na nwoke na-anata ibi úgwù; ọ na-egosikwa na ọ bụ onye ọzọ na-eme ya ihe ahụ.
- source_word: ἄνθρωπος
  choice: nwoke
  rationale: N'ebe a okwu ahụ na-ezo aka kpọmkwem n' nwoke, ebe ọ bụ na ibi úgwù bụ isiokwu a na-ekwu maka ya.
- source_word: ἐν σαββάτῳ
  choice: n’ụbọchị izu ike
  rationale: Nke a bụ okwu Igbo a na-aghọta nke ọma maka ụbọchị Sabbath, ma na-egosipụta oge e mere ihe ahụ.
- source_word: ἵνα μὴ λυθῇ ὁ νόμος Μωϋσέως
  choice: ka a ghara imebi Iwu Mosis
  rationale: ‘Imebi iwu’ bụ ụzọ Igbo ebumpụta ụwa si egosipụta λύω n’ọnọdụ iwu a, ma ọ hapụghịkwa echiche nke iwepụ ma ọ bụ ịkagbu iwu kpamkpam.
- source_word: χολᾶτε
  choice: unu na-eweso m iwe
  rationale: Ọ na-egosipụta iwe ma ọ bụ oke mkpasu iwe ahụ n'ụzọ kwụ ọtọ, na-enweghị ime ka ike okwu Grik ahụ karịa ihe ọ bụ.
- source_word: ὅλον ἄνθρωπον
  choice: ahụ́ nwoke dum
  rationale: Nhọrọ a na-eme ka ọdịiche dị n’etiti otu akụkụ ahụ a na-ebi úgwù na ahụ́ mmadụ dum e mere ka ọ dị mma pụta ìhè.
- source_word: ὑγιῆ ἐποίησα
  choice: emere m ka ... dị mma
  rationale: Ọ na-esochi usoro okwu Grik nke pụtara ‘mere ka ọ dị mma/gbakee,’ ma chekwaa njikọ ya na ‘ahụ́ nwoke dum’ karịa iji naanị ‘gwọọ.’
theological_decisions:
- issue: Ihe atụ Jizọs ji ibi úgwù na ọgwụgwọ n’ụbọchị izu ike mee
  choice: Jizọs ji ibi úgwù a nabatara ime n’ụbọchị izu ike gosi na ime ka nwoke dum dị mma n’ụbọchị ahụ kwesịkwara ekwesị karịa.
  alternative: Jizọs na-eme naanị ọdịiche sara mbara n’etiti emume iwu na omume ebere.
  rationale: Arụmụka amaokwu ahụ si n’ihe a nabatara—ibi úgwù iji ghara imebi Iwu Mosis—gaa n’ihe ka ukwuu, ime ka mmadụ dum dị mma. Nsụgharị ahụ chekwara arụmụka a n’etinyeghị ozizi e mesịrị megide iwu.
translation_notes:
  register: Asụsụ Igbo Izugbe dị ugbu a, kwụ ọtọ ma dị nsọ n’ụzọ kwesịrị Akwụkwọ Nsọ. E ji “ụbọchị izu ike” mee Sabbath ka ndị nkịtị ghọta ya; e jikwa “ahụ́ nwoke dum” chekwaa ọdịiche okwu Grik dị n’etiti otu akụkụ ahụ na mmadụ dum.
