id: JHN.7.42
reference: John 7:42
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸀οὐχ ἡ γραφὴ εἶπεν ὅτι ἐκ τοῦ σπέρματος Δαυίδ, καὶ ἀπὸ Βηθλέεμ τῆς κώμης ὅπου ἦν Δαυίδ, ⸂ἔρχεται ὁ χριστός⸃;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/042.yaml
  text: Has not the Scripture said that the Messiah comes from the offspring of David and from Bethlehem[a], the village where David was?
translation:
  language: ig
  text: Akwụkwọ Nsọ ò kwughị na Mesaịa ahụ[a] ga-esi n’usoro ọmụmụ Devid, sikwa na Betlehem, obodo nta ahụ Devid nọ na ya, bịa?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Kraịst.” Aha-ọkwa Grik e ji mee ihe ebe a bụ ὁ χριστός.
    reason: alternative_reading
lexical_decisions:
- source_word: ἡ γραφή
  choice: Akwụkwọ Nsọ
  rationale: N’Oziọma Jọn, okwu a na-ezo aka n’ihe odide dị nsọ nke nwere ikike; “Akwụkwọ Nsọ” bụ ụzọ Igbo doro anya ma bụrụkwa nke a na-ejikarị ekwu ya.
- source_word: εἶπεν
  choice: ò kwughị
  rationale: Ajụjụ nkwughachi ahụ na-atụ anya azịza ee. Ụdị a na-ada nke ọma n’Igbo ma na-egosi na ihe Akwụkwọ Nsọ kwuru ka nwere ikike.
- source_word: ἐκ τοῦ σπέρματος Δαυίδ
  choice: ga-esi n’agbụrụ Devid
  rationale: σπέρμα na-ekwu maka usoro ọmụmụ ma ọ bụ ụmụ ụmụ ebe a, ọ bụghị mkpụrụ nkịtị; “agbụrụ Devid” na-enye nghọta ahụ n’Igbo nkịtị.
- source_word: ἀπὸ Βηθλέεμ
  choice: sikwa na Betlehem ... bịa
  rationale: ἀπό na-egosi ebe o si; usoro “isi ... bịa” bụ ụzọ Igbo dị mma isi kọwaa mmalite ma ọ bụ ebe onye si.
- source_word: τῆς κώμης
  choice: obodo nta ahụ
  rationale: κώμη bụ obodo nta, ọ bụghị nnukwu obodo; ntụgharị a na-echekwa ọdịiche ahụ.
- source_word: ὅπου ἦν Δαυίδ
  choice: Devid nọ na ya
  rationale: Nke a na-edobe ịdị mfe na nghọta sara mbara nke Grik, n’agbakwụnyeghị ma ọ bụ na Devid biri ebe ahụ ka ọ bụ na o si ebe ahụ.
- source_word: ἔρχεται
  choice: ga-esi ... bịa
  rationale: Ọ bụ ezie na Grik ji oge ugbu a, ebe a ọ na-akọ olileanya banyere ọbịbịa Mesaịa; ọdịdị ọdịnihu a bụ Igbo ebumpụta ụwa ma na-echekwa echiche ahụ.
- source_word: ὁ χριστός
  choice: Mesaịa ahụ
  rationale: N’ebe a, Χριστός bụ aha-ọkwa nke eze na onye nzọpụta ndị Juu na-atụ anya ya; “Mesaịa” na-ebupụta ọrụ aha-ọkwa ahụ kama ime ya ka ọ bụrụ aha mmadụ nkịtị.
theological_decisions:
- issue: Otú e si tụgharị Χριστός dị ka aha-ọkwa
  choice: Mesaịa ahụ
  alternative: Kraịst ahụ
  rationale: Mkparịta ụka a metụtara onye ndị Juu na-atụ anya ya dị ka eze na onye nzọpụta. “Mesaịa” na-eme ka ọrụ aha-ọkwa ahụ pụta ìhè, ebe e debere “Kraịst” dị ka nhọrọ ọzọ na nkọwa ala peeji.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. Ajụjụ nkwughachi “ò kwughị” na usoro “ga-esi ... bịa” na-eme ka ahịrịokwu ahụ bụrụ nke ebumpụta ụwa n’Igbo, ebe “Devid nọ na ya” na-ezere ịkọwa Grik karịa ihe o kwuru.
