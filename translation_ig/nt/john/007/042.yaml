    text: Ma ọ bụ, “Kraịst.” Aha-ọkwa Grik e ji mee ihe ebe a bụ ὁ χριστός.
    reason: alternative_reading
  revision_rationale: The sole revision replaces the potentially ambiguous “agbụrụ Devid” with “usoro ọmụmụ Devid,” accurately expressing descent from David. The wording otherwise retains the source’s rhetorical form, its village designation, and its non-expansive reference to where David was.
