revisions:
- from: O kwuru nke a banyere Mmụọ[a], onye ndị kweere na ya ga-anata; n’ihi na Mmụọ ahụ adịbeghị[b], ebe ọ bụ na e nyebeghị Jizọs otuto.
  to: O kwuru nke a banyere Mmụọ[a], onye ndị kweere na ya ga-anata; n’ihi na Mmụọ ahụ adịbeghị[b], ebe ọ bụ na Jizọs enwetabeghị otuto.
  rationale: The revision corrects the rendering of Jesus' not-yet-glorified state and preserves the temporal force in the explanatory alternative. It otherwise retains the draft's close, non-doctrinal handling of the terse Greek statement concerning the Spirit.
