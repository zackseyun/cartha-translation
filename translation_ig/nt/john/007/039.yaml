id: JHN.7.39
reference: John 7:39
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τοῦτο δὲ εἶπεν περὶ τοῦ πνεύματος ⸀οὗ ἔμελλον λαμβάνειν οἱ ⸀πιστεύσαντες εἰς αὐτόν· οὔπω γὰρ ἦν ⸀πνεῦμα, ὅτι Ἰησοῦς ⸀οὐδέπω ἐδοξάσθη.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/039.yaml
  text: He said this about the Spirit[a], whom those who believed in him were about to receive; for the Spirit was not yet[b], because Jesus had not yet been glorified.
translation:
  language: ig
  text: O kwuru nke a banyere Mmụọ[a], onye ndị kweere na ya ga-anata; n’ihi na Mmụọ ahụ adịbeghị[b], ebe ọ bụ na Jizọs enwetabeghị otuto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ya bụ, Mmụọ nke Chineke; Grik ekwughị kpọmkwem “Mmụọ Nsọ” n’ebe a.
    reason: lexical_clarification
  - marker: b
    text: Ma ọ bụ, n’ụzọ na-akọwa ihe ọ pụtara nke ọma, “n’ihi na enyerabeghị Mmụọ ahụ.” Grik kwuru naanị, “Mmụọ ahụ adịbeghị,” ma jikọta nke a na eziokwu ahụ bụ na Jizọs enwetabeghị otuto.
    reason: alternative_reading
lexical_decisions:
- source_word: πνεύματος / πνεῦμα
  choice: Mmụọ / Mmụọ ahụ
  rationale: N’ebe a, okwu ahụ na-ezo aka na Mmụọ nke Chineke ndị kwere ekwe ga-anata. E tinyeghị “Nsọ” n’ihi na ἅγιον adịghị n’amaokwu Grik.
- source_word: οὗ
  choice: onye
  rationale: Nnọchiaha njikọ ahụ na-alaghachi na Mmụọ; “onye” bụ ụzọ Igbo si ekwu maka onye nwere onwe na omume, kama iji okwu e ji akọwa ihe nkịtị.
- source_word: ἔμελλον λαμβάνειν
  choice: ga-anata
  rationale: N’Igbo nkịtị, “ga-anata” na-egosi ihe a ka na-atụ anya ya n’oge akụkọ ahụ; nsụgharị okwu n’otu n’otu dịka “dị nso ịnata” ga-adị arọ ma nwee ike ime ka ọ pụta na ihe ahụ ga-eme ozugbo.
- source_word: πιστεύσαντες εἰς αὐτόν
  choice: ndị kweere na ya
  rationale: Nke a bụ ụzọ Igbo doro anya ma bụrụkwa nke a na-ahụkarị isi kwuo πιστεύω εἰς; ọ naghị amanye ọdịiche oge nke participle ahụ na-adịghị mkpa n’Igbo.
- source_word: οὔπω γὰρ ἦν πνεῦμα
  choice: n’ihi na Mmụọ ahụ adịbeghị
  rationale: A hapụrụ mkpụmkpụ okwu Grik na esemokwu nkà mmụta okpukpe ya kama ịgbakwunye “e nyebeghị,” nke na-adịghị na isiokwu Grik.
- source_word: ἐδοξάσθη
  choice: e nyebeghị Jizọs otuto
  rationale: Nke a na-egosipụta passive δοξάζω n’Igbo dị mfe ma na-edobe isiokwu Jọn banyere inye Jizọs otuto, n’enweghị imechi ya nanị n’ọnwụ, mbilite n’ọnwụ, ma ọ bụ nrịgo ya.
theological_decisions:
- issue: Otu e si atụgharị οὔπω γὰρ ἦν πνεῦμα n’enweghị ime ka ọ bụrụ na Mmụọ ahụ adịghị ndụ tupu e nye Jizọs otuto.
  choice: Debe okwu ahụ kpọmkwem dịka “Mmụọ ahụ adịbeghị,” ma kọwaa nghọta ọzọ n’okpuru peeji.
  alternative: “e nyebeghị Mmụọ ahụ” ma ọ bụ “Mmụọ ahụ abịabeghị”
  rationale: Grik ekwughị “e nyere” ma ọ bụ “ọ bịara.” Nsụgharị bụ isi na-edobe ihe isiokwu ahụ kwuru n'ụzọ siri ike, ebe nkọwa n’okpuru peeji na-enye nghọta a na-ahụkarị n’enweghị itinye ya n’amaokwu ahụ.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. A họọrọ “Mmụọ” maka divine Spirit, “ndị kweere na ya” maka okwu Jọn a na-ahụkarị, ma debe mkpụmkpụ na mgbagwoju anya nke οὔπω γὰρ ἦν πνεῦμα. Akara nkọwa [a] na [b] abụọ pụtara n’ederede bụ isi.
