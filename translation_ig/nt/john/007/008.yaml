id: JHN.7.8
reference: John 7:8
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὑμεῖς ἀνάβητε εἰς τὴν ⸀ἑορτήν· ἐγὼ ⸀οὐκ ἀναβαίνω εἰς τὴν ἑορτὴν ταύτην, ὅτι ὁ ⸂ἐμὸς καιρὸς⸃ οὔπω πεπλήρωται.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/008.yaml
  text: You go up to the feast[a]. I am not going up to this feast[b], because my time has not yet come to fulfillment.
translation:
  language: ig
  text: Unu rigoo gaa n'emume ahụ. Mụ onwe m agaghị arịgo n'emume a[a], n'ihi na oge m erubeghị n'uju.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ụfọdụ akwụkwọ aka ochie na-agụ, “Akabeghị m arịgo n'emume a.”
    reason: textual_variant
  - marker: b
    text: Ma ọ bụ, “oge a kara m aka erubeghị n'uju.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνάβητε
  choice: rigoo gaa
  rationale: Na-egosipụta ntụziaka nke ịrịgo, dị ka njem a na-aga Jeruselem, ma bụrụkwa Igbo nkịtị.
- source_word: ἑορτή
  choice: emume
  rationale: Na-egosipụta emume okpukpe a na-ekwu maka ya n'ọnọdụ a; ọ bụ okwu doro ndị na-agụ Igbo anya.
- source_word: οὐκ ἀναβαίνω
  choice: agaghị
  rationale: Na-enye ihe a na-ekwu banyere njem ahụ n'ọnọdụ dị nso; e tinyeghị ‘ka’ n'amaokwu bụ isi n'ihi na SBLGNT nwere οὐκ, ọ bụghị οὔπω.
- source_word: ταύτην
  choice: a
  rationale: Na-arụ ọrụ dị ka okwu nrụtụ aka nye kpọmkwem emume a na-ekwu maka ya.
- source_word: καιρός
  choice: oge
  rationale: Ọ bụ nsụgharị dị mkpirikpi ma dị eke, nke ka nwere ike ibu echiche oge a kara aka n'ọnọdụ Jọn.
- source_word: πεπλήρωται
  choice: erubeghị na mmezu ya
  rationale: Na-echekwa echiche nke iru n'uju ma ọ bụ na mmezu dị na perfect passive πεπλήρωται, kama ịsụgharị ya nanị dị ka ‘abịabeghị.’
theological_decisions:
- issue: Ọdịiche ederede n'okwu Jizọs banyere ịga emume ahụ
  choice: A gbasoro οὐκ (‘agaghị’) nke SBLGNT n'amaokwu bụ isi.
  alternative: Ụfọdụ akwụkwọ aka ochie nwere οὔπω (‘agaghị aga ugbu a’ ma ọ bụ ‘akabeghị m aga’).
  rationale: Ịgbaso isi mmalite e nyere na-echekwa mgbagwoju anya na esemokwu nkọwa dị n'amaokwu ahụ; e debere ọgụgụ ọzọ n'ala peeji kama idozi esemokwu ahụ n'ime amaokwu bụ isi.
- issue: Ma καιρός ọ pụtara nanị oge ka ọ bụ oge a kara aka
  choice: oge m
  alternative: oge a kara m aka
  rationale: ‘Oge m’ na-echekwa mkpụmkpụ na ohere nghọta nke Grik; nkọwa banyere oge a kara aka dị n'ala peeji.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji ‘unu’ gosipụta plural ὑμεῖς, ‘rigoo gaa’ chekwaa ntụziaka njem ahụ, ma zere okwu ụka nke otu denominashọn.
