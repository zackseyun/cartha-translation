    text: Ụfọdụ akwụkwọ aka ochie na-agụ, “Akabeghị m arịgo n'emume a.”
    reason: textual_variant
  - marker: b
    text: Ma ọ bụ, “oge a kara m aka erubeghị n'uju.”
    reason: lexical_alternative
  revision_rationale: The revision supplies arịgo, the necessary rendering of ἀναβαίνω, while retaining the base-text reading “not” in the main text. It keeps the directional sense in both commands and Jesus’ response, renders πεπλήρωται with the idiomatic fullness expression “erubeghị n'uju,” and moves the variant footnote to the disputed clause. The alternative reading accurately represents οὔπω (“not yet”) without resolving the textual or interpretive tension.
