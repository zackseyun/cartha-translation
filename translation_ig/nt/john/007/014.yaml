  yaml_path: translation/nt/john/007/014.yaml
  text: When the feast was already half over[c][b][a], Jesus went up into the temple and was teaching.
translation:
  language: ig
  text: Mgbe ememme ahụ nọrịị n’etiti ya[a], Jizọs rigoro banye n’ogige ụlọ nsọ[b], wee na-akụzi ihe[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “Mgbe ememme ahụ ruru etiti ya.”
    reason: lexical_alternative
  - marker: b
    text: Okwu Grik e ji mee ihe ebe a, ἱερόν, na-ezo aka n’mpaghara ma ọ bụ n’ogige ụlọ nsọ dum, ọ bụghị kpọmkwem n’ime ebe nsọ ahụ.
    reason: cultural_note
  - marker: c
    text: Ụdị ngwaa Grik na-egosi na ọ nọ na-akụzi ihe, ya bụ, omume ahụ na-aga n’ihu.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἤδη δὲ τῆς ἑορτῆς μεσούσης
  choice: Mgbe ememme ahụ ruru ihe dị ka ọkara ya
  rationale: A sụgharịrị genitive absolute ahụ dị ka nkebiokwu oge. ‘Ruru ihe dị ka ọkara ya’ na-egosi na ememme ahụ nọ n’etiti ya, ma ọ naghị eme ka nkọwa ahụ sie ike karịa Grik.
- source_word: ἀνέβη
  choice: rigoro
  rationale: ‘Rigoro’ na-echekwa echiche ịrịgo nke ἀναβαίνω, nke dabara n’ịrịgo Jerusalem na ebe ụlọ nsọ dị.
- source_word: εἰς τὸ ἱερὸν
  choice: banye n’ogige ụlọ nsọ
  rationale: ἱερόν na-ezo aka n’ebe ụlọ nsọ dum, karịsịa ogige ya, ọ bụghị naanị ime ụlọ nsọ dị nsọ; ‘ogige ụlọ nsọ’ na-eme ka ọdịiche ahụ doo onye Igbo anya.
- source_word: ἐδίδασκεν
  choice: na-akụzikwa ihe
  rationale: Ụdị imperfect na-egosi omume gara n’ihu n’oge gara aga; usoro ‘na-akụzikwa’ na-echekwa nke a n’Igbo ma na-ejikọta ya n’usoro akụkọ ahụ.
theological_decisions:
- issue: Ihe ἱερόν na-ezo aka na ya
  choice: ogige ụlọ nsọ, ya bụ akụkụ nke ebe ụlọ nsọ dum
  alternative: ụlọ nsọ, nke nwere ike ịdịghị kpọmkwem n’Igbo
  rationale: Nke a na-egbochi onye na-agụ ya iche na Jizọs banyere n’ime ebe nsọ nke naanị ndị nchụàjà nwere ike ịbanye, ma na-edebe ihe okwu Grik pụtara.
- issue: Ụdị omume nke ἐδίδασκεν
  choice: omume nkuzi na-aga n’ihu
  alternative: ọ malitere ịkụzi ihe
  rationale: Grik imperfect na-akwado omume na-aga n’ihu, ma ọ naghị ekwu hoo haa na nke a bụ mmalite omume ahụ; ya mere e tinyereghị echiche inceptive n’amaokwu bụ isi.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta mee ihe. ‘Ememme’ na-anọchi ἑορτή n’enweghị itinye aha ememme ahụ, ebe amaokwu a n’onwe ya ekwughị ya. E mere ka akara nkọwa ala peeji [a], [b], na [c] pụta kpọmkwem n’ebe okwu ha metụtara.
