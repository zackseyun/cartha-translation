  text: ἐάν τις θέλῃ τὸ θέλημα αὐτοῦ ποιεῖν, γνώσεται περὶ τῆς διδαχῆς πότερον ἐκ τοῦ θεοῦ ἐστιν ἢ ἐγὼ ἀπ’ ἐμαυτοῦ λαλῶ.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/017.yaml
  text: If anyone wants to do his will[a], he will know about the teaching, whether it is from God or whether I am speaking from myself.
translation:
  language: ig
  text: Ọ bụrụ na onye ọ bụla chọrọ ime uche ya, ọ ga-amata ma ozizi ahụ ò sitere na Chineke ma ọ bụ na m na-ekwu okwu site n’onwe m.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’aka nke m” ma ọ bụ “site n’ikike nke m.” N’asụsụ Grik, okwu ahụ pụtara kpọmkwem “site n’onwe m.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐάν τις θέλῃ
  choice: Ọ bụrụ na onye ọ bụla chọrọ
  rationale: Nkebiokwu a na-egosi ọnọdụ metụtara onye ọ bụla; “chọrọ” na-ebute echiche nke ọchịchọ ma ọ bụ ịdị njikere n’Igbo dị ugbu a.
- source_word: τὸ θέλημα αὐτοῦ ποιεῖν
  choice: ime uche ya
  rationale: Nke a na-edobe nnọchiaha dị n’asụsụ Grik ma na-eji akpaalaokwu Igbo doro anya maka ime ihe onye ọzọ chọrọ.
- source_word: γνώσεται
  choice: ọ ga-amata
  rationale: Oge ọdịnihu a na-egosi ihe ọmụma ma ọ bụ nghọta onye ahụ ga-enweta; “ọ ga-amata” dị nkenke ma bụrụkwa Igbo nkịtị.
- source_word: περὶ τῆς διδαχῆς
  choice: banyere ozizi ahụ
  rationale: “Banyere” na-egosi ihe a na-atụle, ebe “ozizi ahụ” na-ezo aka n’ozizi Jizọs a na-ekwu maka ya n’ọnọdụ okwu a.
- source_word: πότερον ... ἢ
  choice: ma ... ka
  rationale: Usoro “ma ... ka” na-egosi nhọrọ abụọ a na-enyocha n’Igbo n'ụzọ dị mfe ma doo anya.
- source_word: ἐκ τοῦ θεοῦ
  choice: sitere na Chineke
  rationale: ἐκ na-egosi ebe ihe si malite; “sitere na Chineke” na-ebute echiche ahụ n’Igbo nke ọma.
- source_word: ἀπ’ ἐμαυτοῦ
  choice: site n’onwe m
  rationale: Nke a na-edobe ihe oyiyi nke ebe okwu si pụta dị n’asụsụ Grik, n’etinyeghị nkọwa sara mbara banyere ikike n’ahịrị bụ isi.
- source_word: λαλῶ
  choice: m̀ na-ekwu okwu
  rationale: Nke a na-egosipụta omume na-aga n’ihu n’ọnọdụ mkparịta ụka ahụ ma kwekọọ na present tense Grik.
theological_decisions:
- issue: Onye αὐτοῦ dị na “uche ya” na-ezo aka na ya
  choice: E debere ya dịka “ya,” ọ bụ ezie na ọnọdụ okwu na-egosi na ọ na-ezo aka na Chineke.
  alternative: “uche Chineke”
  rationale: Ikwughachi nnọchiaha ahụ na-asọpụrụ ụdị okwu Grik ma na-ahapụ ọnọdụ gbara ya gburugburu ka o mee ka onye a na-ekwu maka ya doo anya.
- issue: Ihe ἀπ’ ἐμαυτοῦ pụtara
  choice: “site n’onwe m”
  alternative: “n’isi aka m” ma ọ bụ “site n’ikike nke aka m”
  rationale: Grik na-ekwu kpọmkwem banyere ebe okwu si malite. Nsụgharị bụ isi na-edobe nghọta ahụ, ebe ndetu ala peeji na-egosi nkọwa ndị ọzọ o nwere ike ịgụnye.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị mfe ma dị ùgwù mee nsụgharị ahụ. E debere nnọchiaha na asụsụ nke isi mmalite, ma tinye akara ụda olu ole na ole ebe ha na-enyere aka izere mgbagwoju anya.
