revisions:
- from: Ọ bụrụ na onye ọ bụla chọrọ ime uche ya, ọ ga-amata banyere ozizi ahụ ma ọ̀ sitere na Chineke, ka m̀ na-ekwu okwu site n’onwe m.[a]
  to: Ọ bụrụ na onye ọ bụla chọrọ ime uche ya, ọ ga-amata ma ozizi ahụ ò sitere na Chineke ma ọ bụ na m na-ekwu okwu site n’onwe m.[a]
  rationale: The revision retains the draft's faithful lexical choices while correcting the Igbo syntax for the Greek whether/or construction. It also revises the lexical-alternative note into idiomatic Standard Igbo. The pronoun in “uche ya” remains untranslated as an explicit divine name, preserving the Greek form while context supplies its referent.
  reviewer_model: gpt-5.6-terra
