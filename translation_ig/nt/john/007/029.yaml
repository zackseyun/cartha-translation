id: JHN.7.29
reference: John 7:29
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐγὼ οἶδα αὐτόν, ὅτι παρ’ αὐτοῦ εἰμι κἀκεῖνός με ἀπέστειλεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/029.yaml
  text: I know him[a], because I am from him[b], and he sent me.
translation:
  language: ig
  text: Ama m ya[a], n’ihi na m sitere na ya[b], ọ bụkwa ya zitere m.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Ama m ya, na m sitere na ya.” Njikọ okwu Grik ahụ nwere ike ibute ihe a na-ekwu (“na”) ma ọ bụ ihe kpatara ya (“n’ihi na”); ihe ndị gbara amaokwu ahụ gburugburu na-akwado nghọta nke ihe kpatara ya.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “m sitere n’ebe ọ nọ” ma ọ bụ “m si n’akụkụ ya.” Akpaokwu Grik ahụ nwere ike igosi isi mmalite ma ọ bụ ebe onye si, n’ụzọ pụrụ iche karịa naanị “site na ya.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγὼ
  choice: M
  rationale: A na-egosipụta onye mbụ nke ọma n’Igbo; n’ọnọdụ a, nkwupụta ahụ na-emesi ọdịiche dị n’etiti Jizọs na ndị na-amaghị Onye zitere ya ike.
- source_word: οἶδα
  choice: Ama m
  rationale: Okwu a na-egosi ọnọdụ nke ịma onye ugbu a; ‘Ama m’ bụ ụzọ Igbo doro anya ma dịkwa mma isi kwuo ya.
- source_word: αὐτόν
  choice: ya
  rationale: Nnọchiaha a na-ezo aka n’ebe Nna nọ n’akụkọ a, ma a hapụrụ nkọwa ahụ n’èzí isi okwu ka a ghara ịgbakwunye ihe Grik ekwughị kpọmkwem.
- source_word: ὅτι
  choice: n’ihi na
  rationale: N’ebe a, njikọ ahụ nwere ike igosi ihe kpatara Jizọs ji mara ya; ihe ndị gbara amaokwu ahụ gburugburu na-akwado nghọta a, ebe e debere ụzọ ọzọ na nkọwa ala peeji.
- source_word: παρ’ αὐτοῦ
  choice: site n’aka ya
  rationale: Παρά tinyere genitive na-egosi isi mmalite ma ọ bụ ebe mmadụ si. ‘Site n’aka ya’ bụ okwu Igbo dị mma nke na-echekwa echiche nke isi mmalite n’akọwaghị ya karịa ihe odide ahụ kwuru.
- source_word: εἰμι
  choice: sitere m
  rationale: N’Igbo, ‘sitere m n’aka ya’ na-ekwupụta isi mmalite nke onye ahụ n’ụzọ dị ndụ ma ghara ime ka okwu ahụ bụrụ naanị njem ma ọ bụ ebe obibi.
- source_word: κἀκεῖνός
  choice: ọ bụkwa ya
  rationale: Nke a na-egosipụta καί + ἐκεῖνος n’Igbo eke, ma na-edobe ntakịrị nkwusi ike dị n’‘onye ahụ.’
- source_word: με
  choice: m
  rationale: Nnọchiaha a bụ ihe nnara nke ngwaa ‘zitere,’ ya mere ‘m’ bụ ntụgharị kwụ ọtọ.
- source_word: ἀπέστειλεν
  choice: zitere
  rationale: Oge aorist na-akọ ihe e mere; ‘zitere’ na-echekwa echiche Jọn banyere ozi Jizọs n’etinyeghị nkọwa oge ọzọ.
theological_decisions:
- issue: Ihe παρ’ αὐτοῦ εἰμι pụtara banyere mmekọrịta Jizọs na Nna
  choice: sitere m n’aka ya
  alternative: esite m n’ebe ọ nọ bịa; m si n’ebe ọ nọ
  rationale: Nhọrọ a na-egosipụta na Jizọs sitere n’ebe Nna nọ ma na-echekwa omimi na esemokwu nkà mmụta okpukpe dị n’okwu ahụ. Ọ naghị eme ka ọ bụrụ naanị okwu banyere njem, ebe obibi, ma ọ bụ ọrụ e nyere ya.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta, dee ya. ‘Sitere n’aka ya’ na ‘ọ bụkwa ya zitere m’ bụ ahịrịokwu ndị na-ada nke ọma n’Igbo ma na-echekwa nkwusi ike, isi mmalite, na isiokwu nke iziga ozi dị na Grik.
