source:
  edition: SBLGNT
  text: Οὐ Μωϋσῆς ⸀δέδωκεν ὑμῖν τὸν νόμον; καὶ οὐδεὶς ἐξ ὑμῶν ποιεῖ τὸν νόμον. τί με ζητεῖτε ἀποκτεῖναι;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/019.yaml
  text: Did not Moses give you the law? Yet none of you keeps the law[b][a]. Why are you seeking to kill me?
translation:
  language: ig
  text: Ọ̀ bụghị Mosis nyere unu iwu ahụ?[a] Ma ọ dịghị onye n’ime unu na-edebe iwu ahụ.[b] Gịnị mere unu ji achọ igbu m?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Ọ̀ bụghị Mosis enyela unu iwu ahụ?” Ngwaa Grik ahụ dị n’ụdị zuruoke (perfect), ya mere a pụkwara ịsụgharị ya otú a.
    reason: lexical_alternative
  - marker: b
    text: 'N’ụzọ nkịtị: “na-eme iwu ahụ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐ ... δέδωκεν
  choice: Ọ̀ bụghị ... nyere
  rationale: Ajụjụ a e ji okwu nkwụghachi malite na-atụ anya azịza nkwenye. “Nyere” bụ ụzọ Igbo dị mfe ma dị mma isi kwuo ihe Mosis mere n’oge gara aga; e debere ụzọ ọzọ nke na-egosipụta perfect nke ọma n’okpuru ala peeji.
- source_word: Μωϋσῆς
  choice: Mosis
  rationale: Nke a bụ nsụgharị aha ahụ a na-ejikarị eme ihe n’Igbo Izugbe.
- source_word: τὸν νόμον
  choice: iwu ahụ
  rationale: Mkpọaha a kapịrị ọnụ na Mosis e kwuru aha ya na-egosi iwu ahụ e nyere Izrel site n’aka Mosis, ọ bụghị iwu n’ozuzu ya.
- source_word: καὶ
  choice: Ma
  rationale: N’ebe a καί na-egosi ọdịiche dị n’etiti inweta iwu ahụ na ịghara idebe ya; “Ma” na-egosipụta ọdịiche ahụ n’Igbo nkịtị.
- source_word: οὐδεὶς ἐξ ὑμῶν
  choice: ọ dịghị onye n’ime unu
  rationale: Nke a na-edobe nkwupụta zuru ezu na ọ dịghị ọbụna otu onye n’etiti ha.
- source_word: ποιεῖ τὸν νόμον
  choice: na-edebe iwu ahụ
  rationale: Ọ bụ ezie na ποιέω pụtara n’ụzọ nkịtị “ime,” “idebe iwu” bụ okwu Igbo doro anya maka irubere iwu isi ma mee ihe ọ chọrọ.
- source_word: τί
  choice: Gịnị mere
  rationale: N’usoro okwu a, τί na-ajụ ihe kpatara omume ahụ; “Gịnị mere” bụ ajụjụ Igbo e ji ajụ ihe kpatara ihe.
- source_word: ζητεῖτε ἀποκτεῖναι
  choice: unu ji achọ igbu
  rationale: “Ịchọ igbu” na-edobe echiche nke ebumnobi ma ọ bụ mbọ na-aga n’ihu n’enweghị ịgbakwụnye nkọwa na-adịghị n’ederede.
- source_word: ἀποκτεῖναι
  choice: igbu
  rationale: “Igbu” bụ okwu Igbo kwụ ọtọ ma dị mfe maka ime ka mmadụ nwụọ.
theological_decisions:
- issue: Ihe “iwu ahụ” na-ezo aka na ya
  choice: Iwu Mosis e nyere Izrel
  alternative: Iwu omume ọma n’ozuzu ya
  rationale: Ebe ọ bụ na Jizọs kpọrọ Mosis aha dịka onye nyere iwu ahụ, νόμος ebe a na-ezo aka n’Iwu Mosis/Tora. Nsụgharị ahụ egosighị nkọwa okpukpe ọzọ karịrị nke ederede kwuru.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta, dee ya. Ajụjụ mbụ ka bụ ajụjụ nkwupụta na-atụ anya nkwenye; ahịrị nke abụọ jikwa “Ma” gosipụta ọdịiche ahụ, ebe ahịrị ikpeazụ na-edobe ebubo ahụ n’ụzọ kwụ ọtọ.
