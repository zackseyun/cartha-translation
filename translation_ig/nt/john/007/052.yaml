  text: ἀπεκρίθησαν καὶ εἶπαν αὐτῷ· Μὴ καὶ σὺ ἐκ τῆς Γαλιλαίας εἶ; ἐραύνησον καὶ ἴδε ὅτι ⸂ἐκ τῆς Γαλιλαίας προφήτης⸃ οὐκ ⸀ἐγείρεται.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/052.yaml
  text: They answered and said to him[b][a], “Are you also from Galilee? Search and see that no prophet arises from Galilee.”
translation:
  language: ig
  text: Ha zara ya sị, “Ọ̀ bụ na gị kwa si na Galili? Nyochaa, hụ na ọ dịghị onye amụma si na Galili apụta.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị akụkụ ikpeazụ ya, “ọ dịghị onye amụma a na-akpọlite site na Galili.” Okwu Grik ahụ pụrụ inwe ndò na Chineke na-akpọlite ndị amụma.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθησαν καὶ εἶπαν αὐτῷ
  choice: Ha zara ya sị ya
  rationale: Nke a na-edobe usoro ngwaa abụọ ahụ e ji akọ akụkọ n'akwụkwọ Jọn, ma ọ ka na-ada nke ọma n'Igbo.
- source_word: Μὴ καὶ σὺ ἐκ τῆς Γαλιλαίας εἶ;
  choice: Gị onwe gị kwa ò si na Galili?
  rationale: Ajụjụ a na-egosi ịkwa emo ma na-atụ anya azịza na-adịghị mma; ‘gị onwe gị kwa’ na-eme ka nrụgide ahụ pụta n'Igbo n'enweghị ịgbakwunye nkọwa karịrị ihe Grik kwuru.
- source_word: ἐραύνησον καὶ ἴδε
  choice: Nyochaa Akwụkwọ Nsọ, ị ga-ahụ
  rationale: ‘Nyochaa’ na-egosi nyocha siri ike. Ihe a ga-enyocha bụ Akwụkwọ Nsọ dịka ọnọdụ okwu si gosi, ya mere e mere ihe ahụ doro anya n'Igbo; ‘ị ga-ahụ’ bụ ụzọ ebumpụta ụwa isi kwuo nsonaazụ nke iwu abụọ ahụ.
- source_word: ἐκ τῆς Γαλιλαίας
  choice: si na Galili
  rationale: Nke a bụ ụzọ Igbo a na-ejikarị egosi ebe mmadụ ma ọ bụ ihe si pụta.
- source_word: προφήτης
  choice: onye amụma
  rationale: Aha ahụ enweghị mkpụrụokwu na-akọwapụta otu onye pụrụ iche; ya mere ọ na-ekwu maka onye amụma ọ bụla, ọ bụghị ‘Onye Amụma ahụ.’
- source_word: οὐκ ἐγείρεται
  choice: ọ dịghị ... apụta
  rationale: ‘Apụta’ na-egosi mpụta ma ọ bụ bilite nke onye amụma n'ụzọ dị mma n'Igbo, ma na-ahapụkwa ohere nghọta na Chineke bụ onye na-eme ka onye amụma bilie.
theological_decisions:
- issue: Ike ajụjụ e ji μή malite
  choice: Gị onwe gị kwa ò si na Galili?
  alternative: Ọ bụghị na gị onwe gị kwa si na Galili, ka ọ bụ?
  rationale: μή na-egosi na ndị na-ekwu okwu na-atụ anya azịza ‘mba.’ Isi ederede na-eji ajụjụ Igbo dị nkenke nke ọnọdụ ya na-egosi nlelị ahụ, kama ime ka okwu ahụ sie ike n'ụzọ na-adịghị ebumpụta ụwa.
- issue: Ma ἐγείρεται pụtara nanị ‘apụta’ ka ọ bụ ‘Chineke na-eme ka o bilie’
  choice: apụta
  alternative: a na-eme ka o bilie
  rationale: Ụdị Grik nwere ike ịkọwa mpụta onye amụma ma ọ bụ nwee ndò nke Chineke ime ka onye amụma bilie. ‘Apụta’ na-echekwa ebumnuche bụ isi n'emeghị ka onye na-eme ihe ahụ bụrụ nke a kpọpụtara n'ụzọ doro anya.
- issue: Ihe e nyere iwu ka a nyochaa
  choice: Akwụkwọ Nsọ
  alternative: Nyochaa
  rationale: Grik ekwughị ihe a ga-enyocha kpọmkwem, ọ bụ ezie na ọnọdụ okwu na-egosi nyocha Akwụkwọ Nsọ. E tinyere ‘Akwụkwọ Nsọ’ ka okwu Igbo doo anya; nke a bụ nkọwa dabere n'ọnọdụ, ọ bụghị nkwupụta ozizi pụrụ iche.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke dị ugbu a ma dị ùgwù. A họọrọ ‘nyochaa’ kama okwu ochie ma ọ bụ nke teknụzụ, ‘onye amụma’ bụ okwu a na-aghọta n'ọtụtụ ebe, e jikwa ‘gị onwe gị kwa’ gosipụta ụda ịkwa emo nke ajụjụ ahụ.
