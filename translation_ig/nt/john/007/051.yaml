  text: Μὴ ὁ νόμος ἡμῶν κρίνει τὸν ἄνθρωπον ἐὰν μὴ ἀκούσῃ ⸂πρῶτον παρ’ αὐτοῦ⸃ καὶ γνῷ τί ποιεῖ;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/051.yaml
  text: Our law does not judge a man unless it first hears from him and knows what he is doing[b][a], does it?
translation:
  language: ig
  text: “Iwu anyị ọ̀ na-ekpe mmadụ ikpe ma ọ bụrụ na ọ nụbeghị okwu ya mbụ ma ọ matabeghị ihe ọ na-eme?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μὴ
  choice: ọ̀ na-…?
  rationale: Ajụjụ e ji μή malite na-atụ anya azịza na-adịghị mma. Ụdị ajụjụ Igbo a na-egosipụta ike ajụjụ arụmụka ahụ n'ụzọ ebumpụta ụwa.
- source_word: ὁ νόμος ἡμῶν
  choice: Iwu anyị
  rationale: Nke a na-ezo aka n’iwu nke obodo ndị Juu nke Nikọdimọs kpọrọ ihe; mkpụrụedemede ukwu na-egosi Iwu ahụ n’ọnọdụ a n’enweghị ịkọwapụta ya karịa ihe Grik kwuru.
- source_word: κρίνει
  choice: na-ekpe … ikpe
  rationale: Nke a na-echekwa ọnọdụ ikpe na nghọta sara mbara nke κρίνω, kama iji okwu siri ike nke pụtara ịma onye ikpe.
- source_word: τὸν ἄνθρωπον
  choice: mmadụ
  rationale: ἄνθρωπος bụ otu onye nnọchianya n’ebe a. “Mmadụ” bụ ụzọ Igbo nkịtị si akọwa onye ọ bụla, ma ọ naghị etinye okike nwoke ebe okwu Igbo adịghị achọ ya.
- source_word: ἐὰν μὴ
  choice: tupu
  rationale: N’usoro ajụjụ a, “tupu” tinyere usoro omume ndị na-esochi ya na-egosi na iwu agaghị ekpe ikpe ma ọ bụrụ na e mezughị ọnọdụ ndị ahụ ụzọ.
- source_word: ἀκούσῃ πρῶτον παρ’ αὐτοῦ
  choice: o buru ụzọ nụ ihe n’ọnụ ya
  rationale: 'Nke a na-echekwa πρῶτον na παρά + genitive: ịnụ ihe sitere n’aka onye ahụ n’onwe ya, ya bụ ịnata okwu ya ozugbo.'
- source_word: γνῷ
  choice: marakwa
  rationale: γινώσκω n’ebe a bụ ịmata eziokwu gbasara ikpe ahụ; “marakwa” na-ejikọta ya nke ọma na usoro nchọpụta ahụ.
- source_word: τί ποιεῖ
  choice: ihe ọ na-eme
  rationale: Nke a na-echekwa oge ugbu a nke ποιεῖ n’ụzọ Igbo doro anya ma kwekọọ n’asụsụ nkịtị.
