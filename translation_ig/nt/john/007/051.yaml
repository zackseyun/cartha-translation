  to: “Iwu anyị ọ̀ na-ekpe mmadụ ikpe ma ọ bụrụ na ọ nụbeghị okwu ya mbụ ma ọ matabeghị ihe ọ na-eme?”
  rationale: The revision preserves the negative-answer rhetorical question and the generic reference to a person, while making the required negative condition explicit. It uses idiomatic Igbo for hearing directly from the person and retains the present sense of “what he is doing.”
