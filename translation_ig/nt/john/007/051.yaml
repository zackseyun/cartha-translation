  register: Asụsụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E chekwara ajụjụ arụmụka na ọnọdụ iwu nke amaokwu ahụ; e tinyebeghị nkọwa ụka ọ bụla.
