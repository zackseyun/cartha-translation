review_pass:
  verdict: revise
  source_fidelity: The draft preserves the legal setting, the generic singular “person,” the rhetorical question, and the sequence of hearing and knowing. However, “tupu” makes the relation chiefly temporal (“before”) rather than expressing the source’s negative necessary condition (“unless/if it has not first…”). “Nụ ihe n’ọnụ ya” is understandable but is less idiomatic and slightly over-literal for hearing testimony from someone.
  naturalness: “Iwu anyị ọ̀” and “na-ekpe mmadụ ikpe” are natural Standard Igbo. Recasting the conditional with “ma ọ bụrụ na …beghị” is clearer and more natural in a legal rhetorical question. “Nụ okwu ya” naturally conveys hearing the person’s own account.
  terminology: “Iwu anyị,” “ekpe mmadụ ikpe,” “okwu ya,” and “mata ihe ọ na-eme” retain the source’s legal and evidentiary register without imposing an interpretive or denominational sense.
  issues:
  - severity: medium
    issue: The conditional force of ἐὰν μὴ is not fully represented.
    rationale: “Tupu” primarily means “before,” whereas the Greek asks whether the law judges a person if it has not first heard from him and learned what he is doing. The revision states that negative condition explicitly.
  - severity: low
    issue: “Nụ ihe n’ọnụ ya” is an awkward rendering of ἀκούσῃ πρῶτον παρ’ αὐτοῦ.
    rationale: The Greek means to hear from the person. “Nụ okwu ya” is more idiomatic Igbo while retaining the sense of hearing that person’s own testimony.
  revised_text: “Iwu anyị ọ̀ na-ekpe mmadụ ikpe ma ọ bụrụ na ọ nụbeghị okwu ya mbụ ma ọ matabeghị ihe ọ na-eme?”
