  variant: Standard Igbo
source:
  edition: SBLGNT
  text: μή τις ἐκ τῶν ἀρχόντων ἐπίστευσεν εἰς αὐτὸν ἢ ἐκ τῶν Φαρισαίων;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/048.yaml
  text: Has any one of the rulers or of the Pharisees believed in him?[a]
translation:
  language: ig
  text: Ọ̀ dị onye ọ bụla n’ime ndị ọchịchị ma ọ bụ n’ime ndị Farisii nke kweere na ya?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’asụsụ Grik, e ji μή τις malite ajụjụ a, nke na-atụ anya azịza ‘mba.’
    reason: lexical_alternative
lexical_decisions:
- source_word: μή τις
  choice: Ọ̀ dị onye ọ bụla
  rationale: Nke a na-edobe ya dị ka ajụjụ n’Igbo, ma ghara ime ka azịza a tụrụ anya ya, bụ́ ‘mba,’ bụrụ nkwupụta doro anya.
- source_word: ἐκ τῶν ἀρχόντων
  choice: n’ime ndị ọchịchị
  rationale: Ọ na-egosi otu onye sitere n’etiti ndị ọchịchị ndị Juu a ma ama; ‘n’ime’ na-egosipụta ịbụ onye otu ahụ n’ụzọ Igbo na-ada nke ọma.
- source_word: ἐπίστευσεν
  choice: kweere
  rationale: Okwu a bụ ụdị oge gara aga, ‘kweere,’ nke dabara n’ajụjụ ahụ ma na-edobe okwu Jọn ji maka ikwere.
- source_word: εἰς αὐτόν
  choice: na ya
  rationale: ‘Kwere na ya’ bụ ụzọ Igbo si ekwu πιστεύω εἰς n’ụzọ ebumpụta ụwa.
- source_word: ἢ
  choice: ma ọ bụ
  rationale: Njikọ a na-edobe nhọrọ abụọ ahụ n’enweghị itinye nkwusi ike ọzọ.
- source_word: ἐκ τῶν Φαρισαίων
  choice: n’ime ndị Farisii
  rationale: Nke a na-edobe nhazi yiri nke ‘n’ime ndị ọchịchị’ ma na-eji aha otu okpukpe ahụ a na-amakarị.
theological_decisions:
- issue: Ike ajụjụ jụrụ n’ụzọ na-atụ anya azịza na-adịghị mma
  choice: E debere ya dị ka ajụjụ nke na-atụ anya azịza ‘mba.’
  alternative: Ọ dịghị onye n’ime ndị ọchịchị ma ọ bụ ndị Farisii kweere na ya.
  rationale: μή τις na-egosi na ndị na-ekwu okwu tụrụ anya azịza ‘mba,’ ma Grik ka ji usoro ajụjụ. Idebe ya otu a na-echekwa ụda nlelị ha n’ebughị ihe ederede ekwughị kpọmkwem bata.
translation_notes:
  register: Asụsụ Igbo Izugbe dị ugbu a, dị ùgwù ma doo onye nkịtị anya. E ji ‘ndị ọchịchị’ gosipụta ndị ọchịchị ndị Juu a ma ama, ebe e debere usoro ajụjụ nke amaokwu mbụ.
