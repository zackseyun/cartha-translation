  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ὡς δὲ ἀνέβησαν οἱ ἀδελφοὶ αὐτοῦ ⸂εἰς τὴν ἑορτήν, τότε καὶ αὐτὸς ἀνέβη⸃, οὐ φανερῶς ἀλλὰ ὡς ἐν κρυπτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/010.yaml
  text: But when his brothers had gone up to the feast[a], then he also went up, not openly but as if in secret.
translation:
  language: ig
  text: Ma mgbe ụmụnne ya ndị nwoke rigoro gaa ememme ahụ, mgbe ahụ kwa ka ya onwe ya rigoro, ọ bụghị n’ihu ọha kama dị ka a ga-asị na ọ nọ na nzuzo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “kama na nzuzo.” Okwu Grik ahụ pụtara n’ụzọ nkịtị, “kama dị ka a ga-asị na ọ nọ na nzuzo,” nke nwere ike ime ka nkwupụta ahụ dịtụ nro.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὡς δὲ
  choice: Ma mgbe
  rationale: “Mgbe” na-egosi oge ihe mere, ebe “ma” na-egosi ntakịrị mgbanwe ma ọ bụ ọdịiche n’ihe a na-akọ.
- source_word: ἀνέβησαν ... ἀνέβη
  choice: rigoro ... rigokwara
  rationale: Nke a na-edobe echiche ἀναβαίνω nke ‘ịrịgo,’ nke dabara n’ije Jerusalem nakwa n’ije ememme ndị Juu; usoro ahịrịokwu Igbo na-eme ka o doo anya na ụmụnne ya buru ụzọ gaa.
- source_word: οἱ ἀδελφοὶ αὐτοῦ
  choice: ụmụnne ya ndị nwoke
  rationale: N’ebe a, ἀδελφοί na-ekwu kpọmkwem banyere ụmụnne Jizọs ndị nwoke, ọ bụghị ụmụnne nwoke na nwanyị n’ozuzu.
- source_word: εἰς τὴν ἑορτήν
  choice: ememme ahụ
  rationale: “Ememme” bụ okwu Igbo doro anya ma dị ugbu a maka ἑορτή; “ahụ” na-edobe aha nrụtụ aka Grik ma na-ezo aka n’Ememme Ụlọikwuu a kpọtụrụ aha n’akụkụ okwu a.
- source_word: τότε καὶ αὐτὸς
  choice: ya onwe ya rigokwara mgbe ahụ
  rationale: “Ya onwe ya” na-edobe nkwusi ike dị na αὐτός, “-kwara” na-edobe echiche mgbakwunye dị na καί, ebe “mgbe ahụ” na-egosi usoro oge dị na τότε.
- source_word: οὐ φανερῶς
  choice: ọ bụghị n’ihu ọha
  rationale: Nke a bụ ụzọ Igbo sitere n’okike isi kwuo na ọ gaghị n’ụzọ ndị mmadụ ga-ahụ ya n’ihu ọha.
- source_word: ἀλλὰ ὡς ἐν κρυπτῷ
  choice: kama dị ka à ga-asị na ọ gara na nzuzo
  rationale: Nke a na-edobe okwu ntụnyere ὡς, nke na-eme ka nkwupụta ahụ dịtụ nro, kama ịsụgharị ya nanị dị ka ‘na nzuzo.’
theological_decisions:
- issue: Mmekọrịta dị n’etiti ihe Jizọs mere ebe a na okwu o kwuru na mbụ banyere ịghara ịrịgo ememme ahụ
  choice: 'A sụgharịrị amaokwu ahụ dịka ọ dị: Jizọs rigoro mgbe ụmụnne ya rigoro, ma ọ garaghị n’ihu ọha.'
  alternative: Ịkọwa ya n’ụzọ ga-egosi na ọ gbanwere obi ya, ma ọ bụ tinye nkọwa ga-eme ka esemokwu dị n’etiti amaokwu a na Jọn 7:8 kwụsị.
  rationale: Okwu Grik ahụ kọwara nanị ihe mere ma ọ kọwaghị ihe kpatara ọdịiche ahụ. Ya mere, nsụgharị ahụ na-ahapụ esemokwu akụkọ na nkà mmụta okpukpe ahụ dịka isi mmalite si hapụ ya.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. “Ụmụnne ya ndị nwoke” na-ezere mgbagwoju anya gbasara ụdị nwoke, ebe “n’ihu ọha” na “na nzuzo” bụ okwu ndị mmadụ na-aghọta nke ọma. E tinyere akara nkọwa ụkwụ [a] ozugbo n’akụkụ okwu ọ na-akọwa.
