revisions:
- from: Ma mgbe ụmụnne ya ndị nwoke rigoro ememme ahụ, ya onwe ya rigokwara mgbe ahụ, ọ bụghị n’ihu ọha, kama dị ka à ga-asị na ọ gara na nzuzo.[a]
  to: Ma mgbe ụmụnne ya ndị nwoke rigoro gaa ememme ahụ, mgbe ahụ kwa ka ya onwe ya rigoro, ọ bụghị n’ihu ọha kama dị ka a ga-asị na ọ nọ na nzuzo.[a]
  rationale: The revision supplies the directional sense of εἰς with ‘gaa ememme ahụ,’ retains the ascent imagery of ἀναβαίνω, and preserves the sequence and additive emphasis in ‘mgbe ahụ kwa ka ya onwe ya rigoro.’ It also renders ἀλλὰ ὡς ἐν κρυπτῷ as a qualified contrast rather than an unqualified claim, without resolving the narrative tension in the surrounding passage.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T06:21:44Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately reflects the temporal sequence, the brothers' ascent, Jesus' subsequent ascent, the public/private contrast, and the qualifying force of ὡς ('as if'). However, 'rigoro ememme ahụ' omits the destination relation εἰς ('to'), and the final wording adds a finite 'gara' in a way that is less tightly aligned with the Greek manner phrase.
  naturalness: Standard Igbo is generally clear, but 'rigoro gaa ememme ahụ' is more idiomatic and complete than 'rigoro ememme ahụ.' Reordering the middle clause gives a smoother narrative flow. The revised final phrase retains the qualification while reading naturally.
  terminology: ‘Ụmụnne ya ndị nwoke,’ ‘ememme ahụ,’ ‘n’ihu ọha,’ and ‘na nzuzo’ are suitable modern Standard Igbo renderings. No doctrinal interpretation is introduced.
  issues:
  - severity: medium
    issue: The destination phrase is incomplete in the first clause.
    rationale: εἰς τὴν ἑορτήν means ‘to the feast.’ In Igbo, ‘rigoro ememme ahụ’ is less natural and can obscure the directional relation; ‘rigoro gaa ememme ahụ’ expresses both ascent and destination.
  - severity: low
    issue: The lexical footnote's purported literal rendering does not match the main wording closely.
    rationale: The Greek phrase is a qualified manner expression, ‘as if in secret.’ Revising it to ‘dị ka a ga-asị na ọ nọ na nzuzo’ more directly represents the expression without unnecessarily adding a second completed journey verb.
  revised_text: Ma mgbe ụmụnne ya ndị nwoke rigoro gaa ememme ahụ, mgbe ahụ kwa ka ya onwe ya rigoro, ọ bụghị n’ihu ọha kama dị ka a ga-asị na ọ nọ na nzuzo.[a]
  revised_footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “kama na nzuzo.” Okwu Grik ahụ pụtara n’ụzọ nkịtị, “kama dị ka a ga-asị na ọ nọ na nzuzo,” nke nwere ike ime ka nkwupụta ahụ dịtụ nro.
    reason: lexical_alternative
  revision_rationale: The revision supplies the directional sense of εἰς with ‘gaa ememme ahụ,’ retains the ascent imagery of ἀναβαίνω, and preserves the sequence and additive emphasis in ‘mgbe ahụ kwa ka ya onwe ya rigoro.’ It also renders ἀλλὰ ὡς ἐν κρυπτῷ as a qualified contrast rather than an unqualified claim, without resolving the narrative tension in the surrounding passage.
