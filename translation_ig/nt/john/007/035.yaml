id: JHN.7.35
reference: John 7:35
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἶπον οὖν οἱ Ἰουδαῖοι πρὸς ἑαυτούς· Ποῦ οὗτος μέλλει πορεύεσθαι ὅτι ἡμεῖς οὐχ εὑρήσομεν αὐτόν; μὴ εἰς τὴν διασπορὰν τῶν Ἑλλήνων μέλλει πορεύεσθαι καὶ διδάσκειν τοὺς Ἕλληνας;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/035.yaml
  text: So the Jews said to one another, “Where is this man about to go, that we will not find him? He is not about to go to the dispersion among the Greeks and teach the Greeks, is he?”
translation:
  language: ig
  text: Ya mere, ndị Juu[a] sịrị ibe ha, “Olee ebe nwoke a bu n’obi ịga, nke anyị na-agaghị ahụ ya? Ọ̀ ga-abụ na ọ bu n’obi ịga n’ebe ndị Juu gbasasịrị n’etiti ndị Grik nọ[b], ma kuziere ndị Grik ihe?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ndị Judia.” Okwu Grik ahụ nwere ike ịpụta ndị Juu n’ozuzu ha ma ọ bụ, n’ọnọdụ ụfọdụ, ndị si Judia.
    reason: lexical_alternative
  - marker: b
    text: Nke a na-ezo aka n’ebe ma ọ bụ n’ọgbakọ ndị Juu bi gbasasịa n’etiti ndị Grik; ọ pụtaghị na ọ bụ ndị Grik ka a gbasasịrị.
    reason: cultural_note
lexical_decisions:
- source_word: οἱ Ἰουδαῖοι
  choice: ndị Juu
  rationale: Nke a bụ okwu Igbo doro anya maka ndị Juu, ọ naghịkwa etinye echiche ‘ndị isi ndị Juu’ nke Grik ekwughị.
- source_word: πρὸς ἑαυτούς
  choice: sịrị ibe ha
  rationale: Ọ na-egosi n'ụzọ Igbo nkịtị na ha na-agwa ibe ha okwu n'ime otu ha.
- source_word: Ποῦ οὗτος
  choice: Olee ebe nwoke a
  rationale: ‘Nwoke a’ na-echekwa ụda nke ịkpọtụrụ Jizọs n'ụzọ dịtụ anya nke οὗτος nwere ike ibu.
- source_word: μέλλει πορεύεσθαι
  choice: na-achọ ịga
  rationale: N'ọnọdụ a, okwu ahụ na-egosi ihe ọ na-ezube ma ọ bụ na-achọ ime; ntụgharị a bụ nke Igbo dị ndụ ma ghara ikpebi karịa ihe Grik kwuru.
- source_word: ὅτι ἡμεῖς οὐχ εὑρήσομεν αὐτόν
  choice: nke mere na anyị agaghị ahụ ya
  rationale: Ọ na-egosi nsonaazụ ha na-eche, na-enweghị ịgbakwunye echiche nke enweghị ike.
- source_word: μὴ
  choice: Ọ̀ na-achọ ...?
  rationale: Ụdị ajụjụ a na Igbo nwere ike iburu atụmanya na azịza ya ga-abụ mba, dịka μή si arụ ọrụ n'ebe a.
- source_word: διασπορὰν τῶν Ἑλλήνων
  choice: ndị Juu gbasasịrị n’etiti ndị Grik
  rationale: 'Nke a na-eme ka ihe a na-ekwu doo onye Igbo taa anya: ọ bụ ndị Juu bi gbasasịa n''etiti ndị Grik, ọ bụghị ndị Grik gbasasịrị.'
- source_word: τοὺς Ἕλληνας
  choice: ndị Grik
  rationale: Ọ na-echekwa ihe okwu Grik pụtara kpọmkwem kama ịgbasa ya ka ọ bụrụ ndị mba ọzọ niile.
- source_word: καὶ διδάσκειν
  choice: ma kuziere ... ihe
  rationale: Nke a bụ usoro Igbo dị mfe ma kwekọọ n'infinitive nke abụọ jikọrọ ịga na izi ihe.
theological_decisions:
- issue: Uzo e si asụgharị Ἰουδαῖοι n’akụkọ Jọn
  choice: ndị Juu
  alternative: ndị Judia
  rationale: Ebe a anaghị achọ ka e mee okwu ahụ naanị nke mpaghara Judia; ‘ndị Juu’ na-echekwa obosara okwu Grik, ebe nkọwa ala peeji na-egosi nhọrọ ọzọ.
- issue: Ndị διασπορά bụ ndị ònye
  choice: ndị Juu gbasasịrị n’etiti ndị Grik
  alternative: mgbasa nke ndị Grik
  rationale: N'ojiji ndị Juu, διασπορά na-ezo aka n'ebe ndị Juu gbasasịrị n'etiti mba dị iche iche. Nke a na-egbochi nghọtahie na ndị gbasasịrị bụ ndị Grik.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. A kọwara ‘dispersion’ n’ahịrị isi n’ụzọ doro anya kama iji okwu teknụzụ nwere ike igbochi ndị na-agụ akwụkwọ; e debere ọdịiche dị n’etiti ndị Juu bi n’etiti ndị Grik na ndị Grik n’onwe ha.
