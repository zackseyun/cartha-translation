review_pass:
  verdict: revise
  source_fidelity: The draft correctly identifies οἱ Ἰουδαῖοι as “ndị Juu,” preserves the distancing force of οὗτος with “nwoke a,” and rightly understands διασπορά as the Jewish Dispersion among Greeks. However, “na-achọ ịga” can suggest trying or seeking to go rather than the prospective/intended force of μέλλει. Rendering the Dispersion simply as scattered people also obscures the destination expressed by εἰς.
  naturalness: The draft is generally fluent Standard Igbo. “Bu n’obi ịga” is a natural, modern expression for intended/prospective movement. “N’ebe ndị Juu gbasasịrị n’etiti ndị Grik nọ” more naturally expresses going to the Diaspora as a place/community.
  terminology: “ndị Juu,” “ndị Judia,” and “ndị Grik” are appropriate. The footnote should describe the Dispersion as Jewish communities/people living scattered among Greeks, without implying that every member of the surrounding populations was Greek-speaking.
  issues:
  - severity: medium
    issue: “na-achọ ịga” for μέλλει πορεύεσθαι
    rationale: This wording may mean “is trying/seeking to go.” The Greek conveys prospective or intended going; “bu n’obi ịga” more closely preserves that force in idiomatic Igbo.
  - severity: medium
    issue: The destination sense of εἰς τὴν διασποράν is underexpressed
    rationale: “ịgakwuru ndị Juu gbasasịrị” means going to scattered Jews, whereas the Greek names the Diaspora as the destination. Referring to the place/communities where scattered Jews live retains both the destination and the culturally specific term.
  - severity: low
    issue: Footnote b unnecessarily narrows the surrounding setting to Greek speakers
    rationale: The Greek says “among the Greeks”; the explanatory note should not add “Greek-speaking” as a necessary qualifier.
  revised_text: Ya mere, ndị Juu[a] sịrị ibe ha, “Olee ebe nwoke a bu n’obi ịga, nke anyị na-agaghị ahụ ya? Ọ̀ ga-abụ na ọ bu n’obi ịga n’ebe ndị Juu gbasasịrị n’etiti ndị Grik nọ[b], ma kuziere ndị Grik ihe?”
  revised_footnotes:
