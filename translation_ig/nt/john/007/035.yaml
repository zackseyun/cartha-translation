    text: A pụkwara ịsụgharị ya, “ndị Judia.” Okwu Grik ahụ nwere ike ịpụta ndị Juu n’ozuzu ha ma ọ bụ, n’ọnọdụ ụfọdụ, ndị si Judia.
    reason: lexical_alternative
