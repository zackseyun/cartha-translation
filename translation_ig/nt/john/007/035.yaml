- from: Ya mere, ndị Juu[a] sịrị ibe ha, “Olee ebe nwoke a na-achọ ịga nke mere na anyị agaghị ahụ ya? Ọ̀ na-achọ ịgakwuru ndị Juu gbasasịrị n’etiti ndị Grik[b], ma kuziere ndị Grik ihe?”
  to: Ya mere, ndị Juu[a] sịrị ibe ha, “Olee ebe nwoke a bu n’obi ịga, nke anyị na-agaghị ahụ ya? Ọ̀ ga-abụ na ọ bu n’obi ịga n’ebe ndị Juu gbasasịrị n’etiti ndị Grik nọ[b], ma kuziere ndị Grik ihe?”
