  text: ἄλλοι ἔλεγον· Οὗτός ἐστιν ὁ χριστός· ⸂οἱ δὲ⸃ ἔλεγον· Μὴ γὰρ ἐκ τῆς Γαλιλαίας ὁ χριστὸς ἔρχεται;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/041.yaml
  text: Others were saying[a], “This is the Messiah.” But some were saying, “Surely the Messiah does not come from Galilee[b], does he?”
translation:
  language: ig
  text: Ndị ọzọ nọ na-ekwu, “Onye a bụ Mezaya[a].” Ma ndị ọzọ nọ na-ekwu, “Mezaya anaghị esi na Galili abịa, ọ̀ bụghị ya?[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Kraịst.”
    reason: alternative_reading
  - marker: b
    text: Ya bụ, ajụjụ nkwuwa okwu nke na-atụ anya azịza “mba.”
    reason: alternative_rendering
lexical_decisions:
- source_word: ἄλλοι
  choice: Ndị ọzọ
  rationale: Ọ bụ adjective e ji dị ka noun n’ụdị plural, na-egosi ìgwè ọzọ n’etiti igwe mmadụ; ‘Ndị ọzọ’ bụ okwu Igbo doro anya ma na-edobe ntụnyere dị n’amaokwu ahụ.
- source_word: ἔλεγον
  choice: nọ na-ekwu
  rationale: Imperfect na-egosi okwu na-aga n’ihu ma ọ bụ nke a na-ekwughachi; ‘nọ na-ekwu’ na-ebupụta nke a n’Igbo karịa naanị ‘kwuru’.
- source_word: Οὗτός ἐστιν
  choice: Onye a bụ
  rationale: Nke a bụ ụzọ Igbo si akọwapụta mmadụ a na-atụ aka n’ụzọ ebumpụta ụwa.
- source_word: ὁ χριστός
  choice: Mezaya
  rationale: N’ebe a Χριστός bụ utu aha nke onye e tere mmanụ a na-atụ anya ya, ọ bụghị aha mmadụ nkịtị; ‘Mezaya’ na-edobe echiche Hibru ahụ.
- source_word: οἱ δὲ
  choice: Ma ndị ọzọ
  rationale: δέ na-ewebata ìgwè ọzọ na-emegide ihe ìgwè mbụ kwuru; ‘Ma ndị ọzọ’ na-eme ka ọdịiche ahụ doo anya.
- source_word: Μὴ γὰρ
  choice: Ọ bụghị ... ka ọ̀ bụ?
  rationale: μή na-amalite ajụjụ a na-atụ anya azịza na-adịghị mma, ebe γάρ na-enye ya ike nkwubi okwu; usoro ajụjụ Igbo a na-egosipụta obi abụọ ahụ n’ụzọ ebumpụta ụwa.
- source_word: ἐκ τῆς Γαλιλαίας
  choice: na Galili ... ga-esi
  rationale: ἐκ na-egosi ebe mmadụ si malite ma ọ bụ ebe o si pụta; usoro ‘na Galili ka ... ga-esi’ bụ Igbo ebumpụta ụwa maka isi ebe ahụ bịa.
- source_word: ἔρχεται
  choice: ga-esi bịa
  rationale: Present a na-ekwu ihe a na-atụ anya n’ozuzu ya; n’Igbo, ‘ga-esi bịa’ dabara n’ajụjụ gbasara ebe Mezaya a na-atụ anya ya ga-esi pụta.
theological_decisions:
- issue: Otú e si sụgharịa Χριστός dị ka utu aha
  choice: Mezaya
  alternative: Kraịst
  rationale: N’amaokwu a, igwe mmadụ na-arụrịta ụka ma onye ahụ ọ bụ onye e tere mmanụ a na-atụ anya ya. ‘Mezaya’ na-eme ka ọrụ Χριστός dị ka utu aha pụta ìhè, ebe e debere ‘Kraịst’ n’ala ala peeji dị ka ntụgharị ọzọ.
- issue: Ike ajụjụ Μὴ γὰρ
  choice: 'Ajụjụ na-atụ anya azịza ‘mba’: “Ọ bụghị ... ka ọ̀ bụ?”'
  alternative: 'Ajụjụ nkịtị: “Mezaya ọ̀ ga-esi na Galili bịa?”'
  rationale: Ụdị Greek ahụ abụghị naanị ajụjụ na-anọpụ iche; ọ na-egosi na ndị na-ekwu ya chere na azịza ya ga-abụ mba. E debere ike ahụ n’Igbo n’enweghị ịkọwa esemokwu ahụ n’onwe ya.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. ‘Nọ na-ekwu’ na-egosipụta omume na-aga n’ihu; usoro ‘Ọ bụghị ... ka ọ̀ bụ?’ na-edobe ajụjụ nkwuwa okwu nke na-atụ anya azịza na-adịghị mma.
