revisions:
- from: Ndị ọzọ nọ na-ekwu, “Onye a bụ Mezaya[a].” Ma ndị ọzọ nọ na-ekwu, “Ọ bụghị na Galili ka Mezaya ga-esi bịa, ka ọ̀ bụ?[b]”
  to: Ndị ọzọ nọ na-ekwu, “Onye a bụ Mezaya[a].” Ma ndị ọzọ nọ na-ekwu, “Mezaya anaghị esi na Galili abịa, ọ̀ bụghị ya?[b]”
  rationale: The revision preserves the two groups’ ongoing speech, the messianic title, and especially the negative-answer expectation of Μὴ γάρ. It replaces a potentially affirmative Igbo cleft question with an unambiguously negative rhetorical question and uses a generic present construction appropriate to ἔρχεται.
