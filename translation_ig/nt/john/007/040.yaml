source:
  edition: SBLGNT
  text: ⸂Ἐκ τοῦ ὄχλου οὖν⸃ ἀκούσαντες ⸂τῶν λόγων τούτων⸃ ⸀ἔλεγον· Οὗτός ἐστιν ἀληθῶς ὁ προφήτης·
base_translation:
  language: en
  yaml_path: translation/nt/john/007/040.yaml
  text: Therefore[a], some from the crowd, when they heard these words, were saying, “This truly is the Prophet.”
translation:
  language: ig
  text: Ya mere, ụfọdụ ndị n’ìgwè mmadụ ahụ, mgbe ha nụrụ okwu ndị a, nọ na-ekwu, sị, “N’ezie, onye a bụ Onye Amụma ahụ.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O yikarịrị ka “Onye Amụma ahụ” na-ezo aka n’Onye Amụma a tụrụ anya ya, onye yiri Mosis (lee Diuterọnọmi 18:15); ma ụfọdụ ndị nkọwa na-aghọta ya n’ụzọ sara mbara dị ka “onye amụma ahụ.”
    reason: cross_reference
lexical_decisions:
- source_word: Ἐκ τοῦ ὄχλου
  choice: ụfọdụ ndị nọ n’ìgwè mmadụ ahụ
  rationale: Nke a na-eme ka o doo anya na ọ bụ ụfọdụ n’ime ìgwè mmadụ ahụ, ọ bụghị ìgwè ahụ niile, kwuru okwu.
- source_word: οὖν
  choice: Ya mere
  rationale: Ọ na-egosi na mmeghachi omume a sitere n’ihe Jizọs kwuru tupu mgbe ahụ, ma ọ bụkwa njikọ okwu Igbo na-ada nke ọma.
- source_word: ἀκούσαντες
  choice: mgbe ... nụrụ
  rationale: Ọ na-egosi na ịnụ okwu ndị ahụ buru ụzọ mee tupu ha amalite ikwu, n’ụzọ Igbo dị mfe ma bụrụ eke.
- source_word: τῶν λόγων τούτων
  choice: okwu ndị a
  rationale: Ọ na-ezo aka kpọmkwem n’okwu Jizọs kwuru ozugbo tupu amaokwu a.
- source_word: ἔλεγον
  choice: ha nọ na-asị
  rationale: Ụdị a na-echekwa echiche nke imperfect Grik, ya bụ okwu na-aga n’ihu ma ọ bụ nke ọtụtụ n’ime ha na-ekwughachi.
- source_word: Οὗτός ἐστιν
  choice: onye a bụ
  rationale: Ọ na-edebe ike ngosipụta nke Οὗτός, nke na-atụ aka n’ebe Jizọs nọ ozugbo, ma na-ada nke ọma n’Igbo.
- source_word: ἀληθῶς
  choice: N’ezie
  rationale: Ọ na-egosipụta nkwenye siri ike na ụda okwu dị ùgwù nke okwu Grik ahụ.
- source_word: ὁ προφήτης
  choice: Onye Amụma ahụ
  rationale: Mkpụrụedemede ukwu na okwu ngosi “ahụ” na-enye ya ọdịdị aha ọkwá pụrụ iche, ma ha anaghị ekpebi n’ime ederede onye ọ bụ kpọmkwem.
theological_decisions:
- issue: Onye okwu ahụ bụ “ὁ προφήτης” na-egosi
  choice: Onye Amụma ahụ
  alternative: onye amụma ahụ n’echiche sara mbara; ma ọ bụ ịkọwa ya ozugbo dị ka Mesaịa ahụ
  rationale: N’ọnọdụ Oziọma Jọn, okwu ahụ nwere ike izo aka n’Onye Amụma a tụrụ anya ya nke yiri Mosis, ma amaokwu a akọwaghị ya ozugbo dị ka Mesaịa. Nsụgharị ahụ na-edebe nghọta na esemokwu ahụ dịka ha dị.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị mfe nghọta ma nwee ugwu, dee ya. “Ha nọ na-asị” na-echekwa omume okwu na-aga n’ihu, ebe “Onye Amụma ahụ” na-edebe ọdịdị aha ọkwá na-enweghị itinye nkọwa ụka pụrụ iche.
