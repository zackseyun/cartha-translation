  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ δὲ δοῦλος οὐ μένει ἐν τῇ οἰκίᾳ εἰς τὸν αἰῶνα· ⸀ὁ υἱὸς μένει εἰς τὸν αἰῶνα.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/035.yaml
  text: The servant does not remain in the household forever[b][a]; the son remains forever.
translation:
  language: ig
  text: Ma ohu[a] anaghị anọgide n’ezinụlọ ruo mgbe ebighị ebi; nwa nwoke[b] na-anọgide ruo mgbe ebighị ebi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị okwu Grik doulos dịka “onye na-eje ozi”; ma “ohu” na-egosipụta nke ọma ọdịiche dị n’etiti ọnọdụ ya na nke nwa nwoke n’ezinụlọ ebe a.
    reason: lexical_alternative
  - marker: b
    text: N’agbanyeghị na “nwa nwoke” na-arụ ọrụ dịka akụkụ nke ilu banyere ezinụlọ, okwu a nwekwara ike ịdị na-atụ aka n’ụzọ na-apụtaghị ìhè n’ebe Jizọs nọ n’ihe ndị gbara amaokwu a gburugburu.
    reason: alternative_reading
lexical_decisions:
- source_word: δοῦλος
  choice: ohu
  rationale: A họọrọ “ohu” iji gosipụta ọnọdụ onye e kere agbụ nke na-emegide ọnọdụ nwa nwoke n’ezinụlọ. Nke a na-echekwa isi okwu banyere ọnọdụ na-adịgideghị adịgide, kama iji naanị okwu sara mbara maka onye na-eje ozi.
- source_word: μένει
  choice: na-anọgide
  rationale: E ji “na-anọgide” mee ihe ugboro abụọ iji chekwaa nkwughachi dị na Grik ma gosipụta ịnọgide n’otu ọnọdụ.
- source_word: οἰκία
  choice: ezinụlọ
  rationale: N’ebe a, okwu ahụ na-ezo karịa n’ụlọ dịka ụlọ e wuru; ihe a na-atụnyere bụ ọnọdụ mmadụ na òtù ezinụlọ. Ya mere “ezinụlọ” na-ebute echiche ahụ nke ọma n’Igbo.
- source_word: εἰς τὸν αἰῶνα
  choice: ruo mgbe ebighị ebi
  rationale: Nke a bụ ụzọ doro anya ma bụrụkwa nke a na-anụkarị n’Igbo iji kwuo ịdịgide na-enweghị njedebe; e chekwara ya otu ihe n’ahịrịokwu abụọ ahụ.
- source_word: υἱός
  choice: nwa nwoke
  rationale: A họọrọ “nwa nwoke” n’ihi na υἱός bụ nwoke kpọmkwem, ọ bụkwa ọnọdụ ya ka e ji atụnyere nke ohu n’ezinụlọ.
- source_word: δέ
  choice: Ma
  rationale: “Ma” na-egosi mgbanwe na ntakịrị mmegide nke δέ n’ụzọ dị mfe, na-agbakwụnyeghị echiche oge nke na-adịghị n’isi mmalite.
theological_decisions:
- issue: Okwu “nwa nwoke” nwere ike izo aka n’ebe Jizọs nọ n’ime okwu ndị gbara amaokwu a gburugburu.
  choice: E debere “nwa nwoke” n’mkpụrụedemede nta, dịka okwu izugbe ma dịkwa omimi.
  alternative: “Nwa” dịka aha pụrụ iche na-ezo aka n’ebe Jizọs nọ.
  rationale: Ahịrịokwu ahụ yiri ilu banyere ọnọdụ onye nọ n’ezinụlọ, ma ọ na-akwadebekwa ihe Jizọs kwuru n’amaokwu na-esote. Nsụgharị a anaghị ekpebi n’ike na ọ bụ naanị otu n’ime nghọta abụọ ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A chekwara nhazi yiri ilu, nkwughachi nke “na-anọgide” na “ruo mgbe ebighị ebi,” nakwa esemokwu dị n’etiti ọnọdụ ohu na nke nwa nwoke.
