  text: Ἐν δὲ τῷ νόμῳ ἡμῶν Μωσῆς ἐνετείλατο τὰς τοιαύτας λιθοβολεῖσθαι· σὺ οὖν τί λέγεις;
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/john/008/005.yaml
  text: '[A] in our law, Moses commanded that such women be stoned. So what do you say?'
translation:
  language: ig
  text: '[a] N’ime Iwu anyị, Mosis nyere iwu ka a tụọ ụmụ nwanyị dị otu a nkume. Gịnịzi ka ị na-ekwu?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nke a bụ ihe na-aga n’ihu n’akụkọ banyere nwanyị ahụ e jidere mgbe ọ na-akwa iko (Jọn 7:53–8:11). Lee nkọwa dị na Jọn 7:53.
    reason: textual_critical
lexical_decisions:
- source_word: τοιαύτας
  choice: ụmụ nwanyị dị otu a
  rationale: Ụdị okwu Grik a bụ feminine plural accusative, ya mere ọ na-arụtụ aka n’ụmụ nwanyị yiri nwanyị a n’ọnọdụ a, ya bụ ndị e jidere n’ịkwa iko.
- source_word: λιθοβολεῖσθαι
  choice: ka e jiri nkume tụgbuo
  rationale: Nke a na-egosi ntaramahụhụ ọnwụ site n’ịtụ mmadụ nkume; nsụgharị a na-ekwu ụzọ ahụ kpọmkwem n’Igbo n’enweghị ịgbakwunye okwu na-adịghị n’ahịrịokwu ahụ.
- source_word: ἐνετείλατο
  choice: nyere iwu
  rationale: Nke a bụ okwu Igbo doro anya ma bụrụkwa nke kwesịrị ekwesị maka iwu nwere ikike nke Mosis nyere.
- source_word: νόμῳ ἡμῶν
  choice: Iwu anyị
  rationale: Ọ na-echekwa nnọchiaha ‘anyị’ na ntụaka ahụ kpọmkwem nye Iwu Mosis.
- source_word: σὺ οὖν τί λέγεις
  choice: Gịnịzi ka ị na-ekwu?
  rationale: ‘Gịnịzi’ na-ebuga ike nkwubi okwu nke οὖν, ebe ‘ị’ dị n’usoro ngwaa Igbo ma na-echekwa ajụjụ a jụrụ Jizọs kpọmkwem.
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E tinyeghị okwu mmalite dịka ‘Ugbu a,’ n’ihi na isi mmalite Grik enweghị okwu oge kwekọrọ na ya; δὲ na-arụ ọrụ dị ka njikọ okwu dị nro, nke ọnọdụ okwu Igbo anaghị achọ ka a sụgharịa ya iche.
