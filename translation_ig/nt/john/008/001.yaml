source:
  edition: robinson-pierpont-2005-byzantine
  text: Ἰησοῦς δὲ ἐπορεύθη εἰς τὸ ὄρος τῶν Ἐλαιῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/john/008/001.yaml
  text: But Jesus[a] went to the Mount of Olives.
translation:
  language: ig
  text: Ma Jizọs[a] gara n’Ugwu Oliv.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Amaokwu a bụ ihe na-aga n’ihu n’akụkọ banyere nwanyị e jidere ka ọ na-akwa iko (Jọn 7:53–8:11). Lee nkọwa dị na Jọn 7:53 banyere ihe akaebe nke ederede ochie.
    reason: textual_critical
lexical_decisions:
- source_word: ἐπορεύθη (πορεύομαι)
  choice: gara
  rationale: Ngwaa a dị n’ụdị aorist ma nwee nghọta nke ime njem gaa ebe a kpọrọ aha; “gara” bụ okwu Igbo nkịtị, doro anya, nke na-egosi mmegharị ahụ n’enweghị nkọwa agbakwunyere.
- source_word: ὄρος
  choice: Ugwu
  rationale: “Ugwu” bụ okwu Igbo kwesịrị ekwesị maka ugwu, ma n’aha ebe a ọ na-arụkwa ọrụ dị ka akụkụ aha ala ahụ.
- source_word: τῶν Ἐλαιῶν (ἐλαία)
  choice: Oliv
  rationale: Genitiv plural a na-ezo aka n’osisi oliv ndị dị n’ugwu ahụ; “Ugwu Oliv” bụ nsụgharị aha ebe ahụ dị nkenke ma dị mfe nghọta.
- source_word: δὲ
  choice: Ma
  rationale: “Ma” na-egosi njikọ na ọdịiche dị nro n’etiti ihe e kwuru tupu ya na ihe Jizọs mere, dịka δέ si arụ ọrụ n’ahịrịokwu ahụ.
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe ma nwee ugwu, mee nsụgharị ahụ. E debere njikọ “Ma” nke δέ, ma jiri aha ebe a na-amata nke ọma, “Ugwu Oliv.”
