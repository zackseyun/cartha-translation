    issue: The verb “edebekwa” includes -kwa (‘also’).
    rationale: The Greek has simple καὶ connecting ‘I know him’ and ‘I keep his word’; it does not specifically add an ‘also’ emphasis. “Ana m edebe” is closer and equally natural.
