id: JHN.8.55
reference: John 8:55
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ οὐκ ἐγνώκατε αὐτόν, ἐγὼ δὲ οἶδα αὐτόν· κἂν εἴπω ὅτι οὐκ οἶδα αὐτόν, ἔσομαι ὅμοιος ⸀ὑμῖν ψεύστης· ἀλλὰ οἶδα αὐτὸν καὶ τὸν λόγον αὐτοῦ τηρῶ.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/055.yaml
  text: Yet you have not known him[a], but I know him. If I were to say that I do not know him, I would be a liar like you. But I do know him[c][b], and I keep his word.
translation:
  language: ig
  text: Ma unu amatabeghị ya[a], ma mụ onwe m maara ya. Ọ bụrụ na m asị[b] na amaghị m ya, m ga-abụ onye ụgha dịka unu. Ma amaara m ya, ana m edebe okwu ya[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “unu amaghị ya.” Ngwaa Grik ahụ nwere ike imesi ike na ha abịabeghị n'ịmata ya n'eziokwu, nakwa na ọnọdụ ahụ ka dị.
    reason: lexical_alternative
  - marker: b
    text: N'ụzọ nkịtị, “Ọ bụrụ na m asị.” Nke a bụ ọnọdụ e chere n'echiche.
    reason: lexical_alternative
  - marker: c
    text: A pụkwara ịsụgharị “edebe” dịka “na-erubere isi” ma ọ bụ “na-elekọta.” N'akwụkwọ Jọn, okwu ahụ na-egosikarị iji ikwesị ntụkwasị obi jidesie okwu Chineke ike.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγνώκατε
  choice: amatabeghị
  rationale: Ụdị perfect a na-egosi na ha abịabeghị n'ịmata ya, ọnọdụ ahụ ka dịkwa ruo ugbu a; “amatabeghị” na-egosipụta nke a n'Igbo nkịtị.
- source_word: οἶδα
  choice: maara / amaara m
  rationale: Ọ bụ ezie na okwu Grik a yiri perfect n'ụdị, ọ na-arụ ọrụ dị ka ngwaa ọnọdụ nke pụtara ịma; a sụgharịrị ya n'oge ugbu a n'Igbo.
- source_word: κἂν εἴπω
  choice: Ọ bụrụ na m asị
  rationale: Nke a na-edobe ọnọdụ e chere n'echiche n'ụzọ doro anya ma bụrụkwa okwu Igbo eke, n'enweghị ime ka ọ bụrụ nkwupụta mere eme.
- source_word: ἔσομαι
  choice: m ga-abụ
  rationale: Future Grik dị na nsonaazụ ahịrị ọnọdụ; “ga-abụ” bụ ụzọ Igbo kwesịrị ekwesị isi gosi nsonaazụ ahụ.
- source_word: ὅμοιος ὑμῖν
  choice: dịka unu
  rationale: Na-echekwa ntụnyere kpọmkwem na plural nke ὑμῖν.
- source_word: ψεύστης
  choice: onye ụgha
  rationale: Na-egosi aha onye na-ekwu ụgha, ọ bụghị naanị onye mehiere.
- source_word: τὸν λόγον αὐτοῦ
  choice: okwu ya
  rationale: Na-echekwa obosara λόγος dịka okwu ma ọ bụ ozi e kpughere, tinyere ụdị okwu Jọn ji eme ihe.
- source_word: τηρῶ
  choice: ana m edebe
  rationale: “Idebe” nwere ike ịgụnye irube isi, ilekọta, na ịnọgide na-eme ihe okwu ahụ kwuru; ọ naghị eme ka ihe ọ pụtara bụrụ naanị nrubeisi n'iwu.
- source_word: καὶ ... δὲ ... ἀλλὰ
  choice: Ma ... ma ... Ma
  rationale: Njikọ ndị a na-egosi ọdịiche siri ike; “ma” na-arụ ọrụ a n'ụzọ eke n'Igbo.
theological_decisions:
- issue: Nkwupụta Jizọs na ọ maara Chineke n'ụzọ bụ eziokwu, n'adịghị ka ndị na-emegide ya
  choice: E debere ọdịiche ahụ kpọmkwem dịka ịma ya na idebe okwu ya.
  alternative: Ịgbakwunye nkọwa banyere ịbụ Ọkpara Chineke n'ụzọ pụrụ iche, ma ọ bụ ime ka “ịma” bụrụ naanị ịmata onye ahụ n'elu elu.
  rationale: Amaokwu ahụ na-ekwusi ike n'ịma Chineke na idebe okwu ya, ma ọ naghị akọwa ozizi ahụ n'ụzọ sara mbara ebe a; nsụgharị ekwesịghị ịgbakwunye ma ọ bụ belata nkwupụta ahụ.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji “mụ onwe m” mee ka ἐγώ pụta ìhè n'ahịrị mbụ; e zere okwu ụka nke otu ọgbakọ pụrụ iche. Akara nkọwa [a], [b], na [c] niile dị n'ederede n'ebe okwu ha na-akọwa nọ.
