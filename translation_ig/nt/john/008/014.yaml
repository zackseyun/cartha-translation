id: JHN.8.14
reference: John 8:14
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτοῖς· Κἂν ἐγὼ μαρτυρῶ περὶ ἐμαυτοῦ, ἀληθής ἐστιν ἡ μαρτυρία μου, ὅτι οἶδα πόθεν ἦλθον καὶ ποῦ ὑπάγω· ὑμεῖς δὲ οὐκ οἴδατε πόθεν ἔρχομαι ⸀ἢ ποῦ ὑπάγω.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/014.yaml
  text: Jesus answered and said to them[a], “Even if I testify about myself, my testimony is true, because I know where I came from and where I am going[b]; but you do not know where I come from or where I am going.”
translation:
  language: ig
  text: Jizọs zara ha, sị, “Ọ bụrụgodị na m na-agba akaebe banyere onwe m, akaebe m bụ eziokwu, n’ihi na amaara m ebe m si bịa na ebe m na-aga; ma unu amaghị ebe m si abịa ma ọ bụ ebe m na-aga.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ụfọdụ akwụkwọ aka ochie nwere “na ebe m na-aga” kama “ma ọ bụ ebe m na-aga.”
    reason: textual_variant
lexical_decisions:
- source_word: ἀπεκρίθη ... καὶ εἶπεν
  choice: zara ha, sị
  rationale: Nke a na-egosipụta ngwaa abụọ ahụ n’ụzọ Igbo dị mma ma dịkwa mfe nghọta, na-enweghị ikwughachi okwu n’ụzọ na-adịghị eke.
- source_word: Κἂν
  choice: Ọ bụrụgodị na
  rationale: Ọ na-egosipụta ọnọdụ nkwenye a na-enye maka arụmụka, ya bụ ‘even if,’ n’enweghị ịgbanwe ya ka ọ bụrụ nkwenye doro anya.
- source_word: μαρτυρῶ / μαρτυρία
  choice: na-agba akaebe / akaebe
  rationale: ‘Ịgba akaebe’ bụ okwu Igbo a na-aghọta nke ọma ma na-echekwa echiche nke onye akaebe na nke ụlọikpe dị n’okwu Grik.
- source_word: περὶ ἐμαυτοῦ
  choice: banyere onwe m
  rationale: Ọ na-asụgharị περί + genitive ozugbo, n’etinyeghị echiche ọzọ nke ịgbachitere onwe ya.
- source_word: ἀληθής
  choice: bụ eziokwu
  rationale: Nke a na-echekwa isi echiche nke ịbụ eziokwu, ọ bụghị naanị ịbụ ihe ụlọikpe kwadoro.
- source_word: ὅτι
  choice: n’ihi na
  rationale: Ọ na-egosi ihe kpatara Jizọs ji kwuo na akaebe ya bụ eziokwu.
- source_word: πόθεν ἦλθον
  choice: ebe m si bịa
  rationale: Ụdị a bụ Igbo eke maka ebe mmalite ma na-egosipụta aorist ἦλθον nke ọma.
- source_word: ποῦ ὑπάγω
  choice: ebe m na-aga
  rationale: Ọ bụ ụzọ Igbo dị ugbu a si egosipụta njem ma ọ bụ ebe a na-aga.
- source_word: ὑμεῖς δὲ οὐκ οἴδατε
  choice: ma unu amaghị
  rationale: ‘Ma’ na-echekwa ọdịiche ahụ, ebe ‘unu’ na-egosipụta nkwusiri ike nke nnọchiaha Grik.
theological_decisions:
- issue: Ụdị akaebe Jizọs na-agba banyere onwe ya
  choice: E kwuru na akaebe ya bụ eziokwu n’ihi na ọ maara ebe o si bịa na ebe ọ na-aga.
  alternative: Ịsụgharị ya n’ụzọ na-elekwasị naanị n’ịdị irè n’iwu, ma ọ bụ itinye ozizi banyere mmalite ya n’eluigwe kpọmkwem n’amaokwu a.
  rationale: Amaokwu ahụ n’onwe ya jikọtara eziokwu nke akaebe Jizọs na ihe ọmụma pụrụ iche o nwere banyere mmalite na ebe ọ na-aga. Nsụgharị ahụ hapụrụ nkọwa sara mbara nke Jọn ka o pụta site n’ihe gbara ya gburugburu.
- issue: Ọdịiche ederede n’etiti ἢ na καί
  choice: ma ọ bụ ebe m na-aga
  alternative: na ebe m na-aga
  rationale: SBLGNT họọrọ ἢ (‘ma ọ bụ’) n’ahịrị ikpeazụ; e debere ụdị ọzọ dị mkpa n’akwụkwọ nkọwa kama ịgwakọta ha.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị nsọpụrụ ma dị mfe nghọta. A họọrọ ‘Jizọs’ na ‘ịgba akaebe’ dịka okwu ndị a na-ahụkarị n’asụsụ Baịbụl Igbo. E tinyere akara [a] ozugbo n’isiokwu metụtara ọdịiche ederede.
