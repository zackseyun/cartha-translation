  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἶπον οὖν οἱ Ἰουδαῖοι πρὸς αὐτόν· Πεντήκοντα ἔτη οὔπω ἔχεις καὶ Ἀβραὰμ ἑώρακας;
base_translation:
  language: en
  yaml_path: translation/nt/john/008/057.yaml
  text: So the Jews said to him, “You are not yet fifty years old, and you have seen Abraham?”
translation:
  language: ig
  text: Ya mere, ndị Juu[a] sịrị ya, “Ị kabeghị afọ iri ise, ma ị hụla Ebreham?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ “ndị Judia,” ma ọ bụ “ndị isi ndị Juu,” dabere n’otú Jọn si chọọ ka a ghọta οἱ Ἰουδαῖοι n’ebe a.
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ Ἰουδαῖοι
  choice: ndị Juu
  rationale: Nke a bụ nsụgharị kpọmkwem na nke ndị na-agụ Igbo ga-aghọta nke ọma. Ebe a, ihe odide Grik akọwaghị na ọ bụ naanị ndị isi, ya mere e debeghị nkọwa ahụ n’amaokwu n’onwe ya.
- source_word: οὖν
  choice: Ya mere
  rationale: Ọ na-egosi na okwu ha bụ nzaghachi sitere n’ihe Jizọs kwuru tupu nke a; ‘Ya mere’ na-egosipụta njikọ ahụ n’Igbo doro anya.
- source_word: Πεντήκοντα ἔτη οὔπω ἔχεις
  choice: Ị kabeghị afọ iri ise
  rationale: Nke a bụ ụzọ Igbo si ekwu afọ mmadụ n'ụzọ ebumpụta ụwa, kama ịsụgharị akpaalaokwu Grik ahụ dịka ‘i nwebeghị afọ iri ise.’
- source_word: καὶ
  choice: ma
  rationale: N’ajụjụ a jupụtara n’ịtụnanya na enweghị nkwenye, ‘ma’ na-ejikọta afọ Jizọs na nkwupụta banyere Ebreham n’Igbo n'ụzọ ebumpụta ụwa, na-agbanweghị esemokwu dị n’etiti akụkụ abụọ ahụ.
- source_word: ἑώρακας
  choice: ị hụla
  rationale: Ụdị ‘ị hụla’ na-egosipụta omume ịhụ nke a na-ewere na ọ ka nwere mkpa ugbu a, kwekọọkwa n’ụdị perfect dị na Grik.
- source_word: Ἀβραὰμ
  choice: Ebreham
  rationale: Nke a bụ ụdị aha Abraham a na-ejikarị na nsụgharị Baịbụl Igbo.
theological_decisions:
- issue: Ihe οἱ Ἰουδαῖοι na-ezo aka na ya n’Oziọma Jọn
  choice: ndị Juu
  alternative: ndị Judia; ndị isi ndị Juu
  rationale: Ihe odide ahụ jiri aha sara mbara mee ihe, ọ kọwaghị na ọ bụ naanị ndị ọchịchị ma ọ bụ ndị isi. Ya mere, a hapụrụ aha sara mbara n’amaokwu ma tinye nhọrọ ndị ọzọ n’ala peeji iji ghara idozi ihe okwu Grik ahụ hapụrụ ka ọ dabere n’ọnọdụ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta mee ihe. Ajụjụ ahụ na-edobe ụda ịtụnanya na enweghị nkwenye nke ndị na-ekwu okwu.
