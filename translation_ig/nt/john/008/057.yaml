  source_fidelity: 'Nsụgharị ahụ na-edobe ihe Grik ahụ kwuru nke ọma: οὖν dịka njikọ nsonaazụ (“Ya mere”), οἱ Ἰουδαῖοι dịka “ndị Juu,” akpaalaokwu afọ (“Ị kabeghị afọ iri ise”), na perfect ἑώρακας (“ị hụla”). Ajụjụ nkwenkwe-adịghị na ya na Ebreham ka dị, n’enweghị itinye nkọwa okpukpe ọzọ.'
