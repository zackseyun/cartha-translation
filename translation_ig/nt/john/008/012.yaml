id: JHN.8.12
reference: John 8:12
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Πάλιν οὖν αὐτοῖς ⸂ἐλάλησεν ὁ Ἰησοῦς⸃ λέγων· Ἐγώ εἰμι τὸ φῶς τοῦ κόσμου· ὁ ἀκολουθῶν ⸀ἐμοὶ οὐ μὴ περιπατήσῃ ἐν τῇ σκοτίᾳ, ἀλλ’ ἕξει τὸ φῶς τῆς ζωῆς.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/012.yaml
  text: So Jesus spoke to them again[a], saying, “I am the light of the world. The one who follows me will certainly not walk in the darkness[b], but will have the light of life.”
translation:
  language: ig
  text: Ya mere, Jizọs gwakwara ha okwu ọzọ, sị, “Abụ m ìhè nke ụwa. Onye na-eso m agaghị ejegharị n'ọchịchịrị ma ọlị[a], kama ọ ga-enwe ìhè nke ndụ[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ọ dịghị mgbe ọ ga-ejegharị n'ọchịchịrị.” N'asụsụ Grik, e ji ụdị njụ siri ike (οὐ μὴ) kwuo nke a.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịghọta “ìhè nke ndụ” dị ka “ìhè nke na-enye ndụ.”
    reason: alternative_reading
lexical_decisions:
- source_word: Πάλιν οὖν
  choice: Ya mere, ... ọzọ
  rationale: “Ya mere” na-ejikọta okwu a na ihe bu ya ụzọ n’ebughị ike nkwubi okwu ókè; “ọzọ” na-egosi na Jizọs kwughachiri ịgwa ha okwu.
- source_word: ἐλάλησεν ... λέγων
  choice: gwakwara ha okwu ... sị
  rationale: Nke a bụ ụzọ Igbo dị ugbu a si egosipụta omume ikwu okwu na mmeghe nke okwu e hotara, na-enweghị ikwughachi okwu n’ụzọ na-adịghị eke.
- source_word: Ἐγώ εἰμι
  choice: Abụ m
  rationale: Nke a na-egosipụta nkwupụta onye mbụ nke ọma ma na-edebe ya n’ahịrịokwu nwere aha nkọwa, “ìhè nke ụwa,” n’etinyeghị nkọwa ozizi ọzọ.
- source_word: τὸ φῶς τοῦ κόσμου
  choice: ìhè nke ụwa
  rationale: Nsụgharị a ziri ezi ma doo anya, na-edebekwa ihe oyiyi nke ìhè na ụwa dị n’asụsụ Grik.
- source_word: ὁ ἀκολουθῶν ἐμοὶ
  choice: Onye na-eso m
  rationale: Ọ na-edebe ụdị onye otu nọchiri anya ndị niile na-eso Jizọs, ma bụrụkwa okwu Igbo a na-aghọta ngwa ngwa.
- source_word: οὐ μὴ περιπατήσῃ
  choice: agaghị ejegharị ... ma ọlị
  rationale: “Ma ọlị” na-egosipụta nkwusi ike dị n’ụdị njụ siri ike οὐ μὴ; “ejegharị” na-edebe ma echiche ije ma ihe atụ nke ụzọ mmadụ si ebi ndụ.
- source_word: ἐν τῇ σκοτίᾳ
  choice: n'ọchịchịrị
  rationale: Ọ na-egosipụta ọchịchịrị dị ka ọnọdụ ma ọ bụ mpaghara mmadụ pụrụ ịnọ na ya, dịka ihe oyiyi Jọn si arụ ọrụ.
- source_word: ἕξει
  choice: ọ ga-enwe
  rationale: Nke a bụ ụzọ Igbo nkịtị na nke ziri ezi si egosipụta ọdịnihu nke ἔχω.
- source_word: τὸ φῶς τῆς ζωῆς
  choice: ìhè nke ndụ
  rationale: A hapụrụ njikọ genitive ahụ n’ụdị ya dị mkpirikpi ka ọ ghara imechi ma ọ̀ bụ ìhè sitere ná ndụ, ìhè metụtara ndụ, ma ọ bụ ìhè na-enye ndụ.
theological_decisions:
- issue: Ike nkwupụta Jizọs n’okwu Ἐγώ εἰμι
  choice: A sụgharịrị ya “Abụ m” n’ime nkwupụta “Abụ m ìhè nke ụwa.”
  alternative: Ime ka okwu ahụ sie ike karịa iji gosi na ọ pụrụ ịdị ka aha Chineke.
  rationale: N’amaokwu a, Ἐγώ εἰμι jikọtara kpọmkwem na “ìhè nke ụwa.” Ya mere, nsụgharị ahụ na-edebe usoro asụsụ ahụ ma hapụkwa ka onye na-agụ ya hụ njikọ nkà mmụta okpukpe ọ bụla n’onwe ya.
- issue: Ihe “ìhè nke ndụ” pụtara
  choice: E debere okwu ahụ dịka “ìhè nke ndụ.”
  alternative: “ìhè nke na-enye ndụ” ma ọ bụ “ìhè na-eweta ndụ.”
  rationale: Njikọ “nke ndụ” nwere ike ibu ihe karịrị otu echiche. Idebe ya otú a na-echekwa omimi na nghọtahie kwe omume nke okwu Grik kama ịmanye naanị otu nkọwa.
translation_notes:
  register: E ji Standard Igbo nke dị ugbu a, dị ùgwù, ma dị mfe nghọta mee nsụgharị ahụ. “Gwakwara ha okwu ... sị” bụ usoro Igbo eke maka mmeghe okwu e hotara; “ma ọlị” na-eburu nkwusi ike nke njụ Grik. E tinyere akara nkọwa ala peeji [a] na [b] kpọmkwem n’ebe nkọwa nke ọ bụla metụtara.
