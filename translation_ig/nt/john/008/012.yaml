  source_fidelity: 'Nsụgharị ahụ na-anọchite anya akụkụ niile dị na Grik n’ụzọ ziri ezi: Πάλιν/οὖν dịka “Ya mere ... ọzọ,” ἐλάλησεν ... λέγων dịka “gwakwara ha okwu ... sị,” na nkwupụta “Abụ m ìhè nke ụwa.” “Onye na-eso m” na-edebe participle ahụ dị ka onye otu na-anọchite anya mmadụ ọ bụla. “Agaghị ejegharị n''ọchịchịrị ma ọlị” na-egosipụta njụ siri ike οὐ μὴ nke ọma, ebe “ìhè nke ndụ” na-echekwa oghere nkọwa dị na genitive Grik.'
  naturalness: Igbo ahụ bụ Standard Igbo dị mma, nke oge a, ma nwee ụda Akwụkwọ Nsọ kwesịrị ekwesị n’enweghị okwu ochie na-adịghị mkpa. “Jizọs gwakwara ha okwu ọzọ, sị” na “kama ọ ga-enwe” bụ usoro doro anya ma eke. “N'ọchịchịrị” bụkwa okwu nkịtị kwesịrị ekwesị maka ihe oyiyi Jọn.
  terminology: Aha “Jizọs,” na okwu ndị dị mkpa “ìhè,” “ụwa,” “ọchịchịrị,” na “ndụ” ka eji n’ụzọ kwụ ọtọ ma kwekọọ na usoro Bible Igbo. E tinyebeghị nkọwa ozizi karịrị ihe Grik kwuru. Akara [a] dị n’akụkụ njụ siri ike, akara [b] dị n’akụkụ “ìhè nke ndụ”; nkọwa ala peeji ha kwekọrọ na ebe ha dị.
