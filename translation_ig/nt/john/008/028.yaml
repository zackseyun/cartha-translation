  source_fidelity: 'Isi ederede na-esochi Greek nke ọma: οὖν bụ njikọ (‘Ya mere’), Ὅταν + subjunctive na-atụ aka n’ọrụ ga-eme n’ọdịnihu, ‘Nwa nke Mmadụ’ ziri ezi, a chekwara mgbagwoju anya nke ἐγώ εἰμι site na ‘Abụ m onye ahụ’ na ala peeji, ma ‘site n’onwe m’ na ‘dị nnọọ ka Nna kụziiri m’ na-egosi nke ọma ọdịiche na ntụnyere dị na ederede. Akara ala peeji dị n’ebe okwu ha na-akọwa dị, nke ka mma karịa nhazi a pụrụ ịghọta na audit trail Bekee.'
