id: JHN.8.28
reference: John 8:28
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἶπεν ⸀οὖν ὁ Ἰησοῦς· Ὅταν ὑψώσητε τὸν υἱὸν τοῦ ἀνθρώπου, τότε γνώσεσθε ὅτι ἐγώ εἰμι, καὶ ἀπ’ ἐμαυτοῦ ποιῶ οὐδέν, ἀλλὰ καθὼς ἐδίδαξέν με ὁ ⸀πατὴρ ταῦτα λαλῶ.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/028.yaml
  text: So Jesus said[a], “When you lift up the Son of Man, then you will know that I am he, and that I do nothing from myself, but just as the Father taught me[b], I speak these things.”
translation:
  language: ig
  text: Ya mere Jizọs sịrị, “Mgbe unu weliri Nwa nke Mmadụ elu[a], mgbe ahụ ka unu ga-amata na Abụ m onye ahụ[b], nakwa na ọ dịghị ihe m na-eme site n’onwe m; kama, ana m ekwu ihe ndị a dị nnọọ ka Nna kụziiri m.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Weliri ... elu” nwere ike ịpụta ma ibuli ya elu n’obe ma ibuli ya elu n’otuto, dịka Jọn si eji okwu a eme ihe.
    reason: lexical_alternative
  - marker: b
    text: 'A pụkwara ịsụgharị ya: “Abụ m.” N’asụsụ Greek, ihe e dere bụ naanị “Abụ m” (ἐγώ εἰμι), n’enweghị okwu ọzọ e kwuru kpọmkwem na-esochi ya.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: Ya mere
  rationale: Ọ na-egosi njikọ na ihe e kwuru tupu ya, ma na-enyekwa okwu a ụda nkwubi okwu n’ụzọ Igbo doro anya.
- source_word: Ὅταν
  choice: Mgbe
  rationale: Ọ na-ezo aka n’otu ihe a ga-eme n’ọdịnihu, ọ bụghị n’ihe a na-eme ugboro ugboro.
- source_word: ὑψώσητε
  choice: weliri ... elu
  rationale: 'Nhọrọ a na-echekwa nghọta abụọ dị n’okwu Jọn: ibuli Jizọs n’elu n’obe na ibuli ya elu n’otuto.'
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: Nwa nke Mmadụ
  rationale: Nke a bụ nsụgharị a na-amata nke ọma nke aha Jizọs ji akpọ onwe ya, ma na-echekwa njikọ ya na Akwụkwọ Nsọ ndị ọzọ.
- source_word: γνώσεσθε
  choice: unu ga-amata
  rationale: Ọ na-egosi nghọta ma ọ bụ ịmata ihe nke ga-abịa mgbe ihe ahụ mezuru.
- source_word: ἐγώ εἰμι
  choice: Abụ m onye ahụ
  rationale: Nke a na-agụ nke ọma n’Igbo ma na-egosi ahịrịokwu Greek nke na-enweghị ihe e kwuru kpọmkwem na-esochi ‘Abụ m.’ A kọwara ụdị okwu ahụ kpọmkwem n’ala peeji.
- source_word: ἀπ’ ἐμαυτοῦ
  choice: site n’onwe m
  rationale: Ọ na-echekwa echiche nke isi mmalite na nke ime ihe n’onwe onye n’enweghị onye ọzọ.
- source_word: ποιῶ οὐδέν
  choice: ọ dịghị ihe m na-eme
  rationale: Ọ na-egosi nkwupụta zuru ezu banyere omume Jizọs na-adabere na Nna.
- source_word: καθὼς ἐδίδαξέν με ὁ πατήρ
  choice: dị nnọọ ka Nna kụziiri m
  rationale: ‘Dị nnọọ ka’ na-echekwa ike ntụnyere nke καθώς, ebe ‘Nna’ dabara n’otú Jọn si eji aha a eme ihe.
- source_word: ταῦτα λαλῶ
  choice: ana m ekwu ihe ndị a
  rationale: Ọ bụ okwu Igbo dị ndụ ma doo anya nke na-echekwa ihe ταῦτα na-ezo aka na ya.
theological_decisions:
- issue: Otú e si sụgharịa ἐγώ εἰμι nke na-enweghị predicate doro anya
  choice: Abụ m onye ahụ
  alternative: Abụ m
  rationale: Isi okwu ahụ na-eme ka ahịrịokwu ahụ bụrụ Igbo a na-aghọta ngwa ngwa, ma ala peeji na-echekwa ụdị Greek ahụ kpọmkwem na ịdị omimi ya n’Oziọma Jọn n’enweghị ịmanye otu nkọwa ozizi.
- issue: Ihe ὑψώσητε pụtara n’ebe a n’Oziọma Jọn
  choice: weliri ... elu
  alternative: kpọgidere ... n’obe; buliri ... elu n’otuto
  rationale: Okwu a nwere ike ịgụnye ma ibuli Jizọs n’elu n’obe ma ibuli ya elu n’otuto. Nsụgharị bụ isi anaghị emechi otu n’ime nghọta abụọ ahụ.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. A họọrọ usoro ahịrịokwu na-ada ka ezigbo Igbo, ebe e chekwara mgbagwoju anya nke okwu abụọ dị mkpa—‘weliri ... elu’ na ‘Abụ m.’ E doziri akara ala peeji ka ha dị kpọmkwem n’ebe okwu nke ọ bụla dị na isi ederede.
