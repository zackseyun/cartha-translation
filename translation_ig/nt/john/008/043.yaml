source:
  edition: SBLGNT
  text: διὰ τί τὴν λαλιὰν τὴν ἐμὴν οὐ γινώσκετε; ὅτι οὐ δύνασθε ἀκούειν τὸν λόγον τὸν ἐμόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/043.yaml
  text: Why do you not understand my way of speaking? Because you are not able to hear my word[a][b].
translation:
  language: ig
  text: Gịnị mere unu anaghị aghọta ụzọ m si ekwu okwu? N’ihi na unu enweghị ike ịnụ okwu m.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, ‘okwu ọnụ m’ ma ọ bụ ‘asụsụ m.’ Okwu Grik a na-ezo aka n’ụzọ Jizọs si ekwu okwu; ọ dị iche n’‘okwu m’ n’ahịrịokwu na-esote.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, ‘unu apụghị ịnụ okwu m.’
    reason: lexical_alternative
lexical_decisions:
- source_word: λαλιὰν
  choice: otú m si ekwu okwu
  rationale: Nke a na-egosi ụzọ ma ọ bụ ụdị Jizọs si ekwu okwu, ma na-edobe ọdịiche dị n’etiti λαλιά na λόγος nke dị n’ahịrịokwu na-esote.
- source_word: γινώσκετε
  choice: aghọta
  rationale: N’ebe a, okwu ahụ pụtara ịghọta ihe Jizọs na-ekwu, ọ bụghị nanị ịma ma ọ bụ ịmata ya.
- source_word: ἀκούειν
  choice: ịnụ
  rationale: A họọrọ ihe okwu Grik ahụ pụtara kpọmkwem, bụ ‘ịnụ,’ ka a ghara itinye echiche nke ịnabata ma ọ bụ irube isi n’ime nsụgharị n’onwe ya.
- source_word: λόγον
  choice: okwu
  rationale: ‘Okwu’ bụ nsụgharị ebumpụta ụwa nke na-ezo aka n’ozi ma ọ bụ ihe Jizọs kwuru, ma na-edobekwa ọdịiche ya na λαλιά.
- source_word: οὐ δύνασθε
  choice: unu enweghị ike
  rationale: Nke a na-egosi enweghị ike n'ụzọ doro anya, n’etinyeghị nkọwa banyere ihe kpatara enweghị ike ahụ.
- source_word: ὅτι
  choice: Ọ bụ n’ihi na
  rationale: Ọ na-ewebata ihe kpatara ajụjụ dị n’ahịrịokwu mbụ n’ụzọ doro anya ma bụrụkwa Igbo nkịtị.
- source_word: τὴν ἐμὴν / τὸν ἐμόν
  choice: m / okwu m
  rationale: Ụdị nwe a na-asụ n’Igbo na-eme ka njikọ dị n’etiti ‘otú m si ekwu okwu’ na ‘okwu m’ pụta nke ọma.
theological_decisions:
- issue: Ụdị enweghị ike dị na ‘unu enweghị ike ịnụ okwu m’
  choice: Igosipụta ya kpọmkwem dị ka enweghị ike, n’enweghị ịkọwa ihe kpatara ya n’ụzọ ozizi okpukpe.
  alternative: Ịkọwa ya dị ka ekweghị ekwe nke omume, ime ka obi sie ike dịka ikpe, ma ọ bụ enweghị ike ime mmụọ.
  rationale: Amaokwu ahụ kwuru na ha enweghị ike, ma ọ kọwaghị kpọmkwem usoro ma ọ bụ ihe kpatara ya. Nsụgharị ahụ na-ahapụ esemokwu echiche a ka ọ dị.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ugwu ma dị mfe nghọta, mee nsụgharị ahụ. ‘Unu’ na-egosi na Jizọs na-agwa ọtụtụ mmadụ okwu. E debeghị nkọwa ozizi ọ bụla banyere ihe kpatara enweghị ike ha n’ime isi amaokwu.
