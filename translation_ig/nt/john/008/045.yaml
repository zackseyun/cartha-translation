  yaml_path: translation/nt/john/008/045.yaml
  text: But because I tell the truth[a], you do not believe me.
translation:
  language: ig
  text: Ma mụ onwe m, n'ihi na m na-ekwu eziokwu[a], unu ekweghị m.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ, n''ụzọ na-agbaso usoro Grik anya karị: “Ma mụ onwe m, n''ihi na m na-ekwu eziokwu, unu ekweghị m,” ma ọ bụ “Ma n''ihi na m na-ekwu eziokwu, unu ekweghị m.” Okwu njikọ Grik ahụ nwekwara ike ịpụta “na,” ma n''ebe a, nghọta kachasị mma bụ nke na-egosi ihe kpatara ya: “n''ihi na.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγὼ
  choice: m
  rationale: A na-egosipụta onye mbụ n'okwu ngwaa na nnọchiaha “m”; ọnọdụ ya n'ahịrịokwu ahụ na njikọ “ma” na-echekwa ntụnyere siri ike dị n'etiti Jizọs na ndị ọ na-agwa okwu.
- source_word: δὲ
  choice: Ma
  rationale: N'ebe a, δέ na-egosi ọdịiche na ihe e kwuru tupu ya; “Ma” bụ okwu Igbo dị mfe ma dabara adaba maka ike mmegide ahụ.
- source_word: ὅτι
  choice: ebe ... na-
  rationale: A ghọtara ὅτι n'ụzọ na-egosi ihe kpatara ya. Usoro “ebe m na-agwa unu...” na Igbo na-eme ka o doo anya na ikwu eziokwu bụ ihe jikọrọ ya na ekweghị ha ekwe, ma na-echekwa ihe ịtụnanya siri ike dị n'okwu ahụ.
- source_word: τὴν ἀλήθειαν
  choice: eziokwu
  rationale: “Eziokwu” bụ ntụgharị Igbo a na-ahụkarị ma kwekọọ nke ọma na ἀλήθεια; Igbo anaghị achọ isiokwu ntụaka pụrụ iche ebe a.
- source_word: λέγω
  choice: na-agwa unu
  rationale: Ụdị na-aga n'ihu “na-agwa” na-egosipụta ngwaa ugbu a, ebe “unu” na-eme ka usoro okwu ahụ bụrụ nke e ji asụsụ Igbo eme ihe n'ụzọ ebumpụta ụwa mgbe a na-agwa mmadụ eziokwu.
- source_word: οὐ πιστεύετέ μοι
  choice: unu ekweghị m
  rationale: “Ekweghị m” na-echekwa πιστεύω ya na onye ihe ahụ metụtara n'ụzọ dị nkenke ma bụrụkwa okwu Igbo nkịtị, na-enweghị ịgbasa ya ka ọ bụrụ nanị ekweghị ihe e kwuru.
theological_decisions:
- issue: Ihe ὅτι pụtara n'ihe metụtara eziokwu Jizọs na-ekwu na ekweghị ndị na-ege ya ntị ekwe
  choice: 'Ihe kpatara ya: “ebe m na-agwa unu eziokwu”'
  alternative: 'Nkwupụta n''ụzọ nkịtị: “na m na-ekwu eziokwu”'
  rationale: 'Ihe gbara amaokwu ahụ gburugburu na-akwado nghọta nke ihe kpatara ya: Jizọs na-ekwu eziokwu, ma nke ahụ jikọtara kpọmkwem na ajụjụ ha jụrụ ịkwere ya. Nke a na-echekwa mgbagwoju anya na ihe ịtụnanya dị n''okwu ahụ n''enweghị ịtinye ozizi ọzọ.'
translation_notes:
  register: Standard Igbo; asụsụ dị ugbu a, dị ùgwù, ma dị mfe nghọta. E ji “unu” chekwaa onye nke abụọ ọtụtụ, ma zere okwu ụka pụrụ iche nke otu denominashọn.
