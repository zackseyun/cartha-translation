review_pass:
  verdict: revise
  source_fidelity: The draft correctly takes ὅτι causally and renders οὐ πιστεύετέ μοι as “unu ekweghị m.” However, “ebe m na-agwa unu eziokwu” is less precise for the causal conjunction and introduces an explicit “unu” as the indirect object of λέγω, which the Greek does not state. “Mụ onwe m” appropriately represents the explicit, emphatic ἐγώ.
  naturalness: “N'ihi na m na-ekwu eziokwu” is clear, idiomatic Standard Igbo for the causal relation. “Unu ekweghị m” is natural and preserves the personal dative sense of πιστεύω μοι.
  terminology: “eziokwu” accurately renders τὴν ἀλήθειαν. No theological terminology requires alteration.
  issues:
  - severity: medium
    issue: The causal expression “ebe m na-agwa unu eziokwu” is not the most direct rendering of ὅτι and supplies “unu” with the verb “na-agwa.”
    rationale: In this context ὅτι is best rendered explicitly as “n'ihi na.” The Greek says that Jesus speaks/tells the truth, without explicitly naming the audience as the indirect object of λέγω. A direct wording also preserves the concise contrast in the source.
  revised_text: Ma mụ onwe m, n'ihi na m na-ekwu eziokwu[a], unu ekweghị m.
