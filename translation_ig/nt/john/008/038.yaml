source:
  edition: SBLGNT
  text: ⸂ἃ ἐγὼ⸃ ἑώρακα παρὰ τῷ ⸀πατρὶ λαλῶ· καὶ ὑμεῖς οὖν ⸂ἃ ἠκούσατε⸃ παρὰ ⸂τοῦ πατρὸς⸃ ποιεῖτε.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/038.yaml
  text: I speak what I have seen with the Father[a], and you, then, do what you have heard from your father.
translation:
  language: ig
  text: Ana m ekwu ihe m hụrụ n’ebe Nna nọ[a]; ma unu, ya mere, na-eme ihe unu nụrụ n’aka nna unu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'N’usoro okwu Grik nso karị: “Ana m ekwu ihe ndị m hụrụ n’ebe Nna nọ; ma unu, ya mere, na-eme ihe ndị unu nụrụ n’aka nna ahụ.” N’ebe nke abụọ, Grik kwuru naanị “nna ahụ”; “nna unu” na-eme ka echiche dị n’okwu gbara ya gburugburu doo anya, ma amaokwu 44 ga-akọwa onye ahụ bụ. Okwu Grik a sụgharịrị “na-eme” nwekwara ike ịpụta iwu: “meenụ.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ἃ
  choice: ihe
  rationale: Nnọchiaha njikọ a na-arụ ọrụ dị ka ihe e ji mezue ngwaa; “ihe” bụ ụzọ Igbo si kwuo ya n'ụzọ doro anya ma dịkwa mfe.
- source_word: ἑώρακα
  choice: m hụrụ
  rationale: Oge perfect Grik na-egosi ihe a hụrụ n’oge gara aga nke ka dị mkpa ugbu a; n’Igbo, “m hụrụ” na ọnọdụ okwu a na-eburu echiche ahụ nke ọma.
- source_word: παρὰ τῷ πατρὶ
  choice: n’ebe Nna nọ
  rationale: παρά ya na dative na-egosi ịnọ nso ma ọ bụ ịnọ n’ihu onye; okwu a na-egosipụta na Jizọs hụrụ ihe ahụ mgbe ọ nọ n’ebe Nna nọ, ọ bụghị nanị na ozi ahụ si n’aka Nna bịa.
- source_word: λαλῶ
  choice: Ana m ekwu
  rationale: Present tense na-egosi okwu Jizọs na-ekwu ugbu a ma ọ bụ ihe ọ na-ekwu mgbe niile; “Ana m ekwu” bụ Igbo nkịtị ma na-edobe ihe ahụ dị ka ihe ngwaa na-achị kpọmkwem.
- source_word: οὖν
  choice: —
  rationale: E tinyghị ya dịka otu okwu pụrụ iche, n’ihi na njikọ ya na nkwubi okwu ahụ pụtara nke ọma site na usoro ahịrịokwu na “unu onwe unu”; nke a na-ezere Igbo siri ike ma ọ bụ nke a manyere amanye.
- source_word: ἃ ἠκούσατε
  choice: ihe unu nụrụ
  rationale: Aorist na-ezo aka n’ihe ha nụrụ nke na-akpụ omume ha ugbu a; “ihe unu nụrụ” bụ ntụgharị Igbo ziri ezi ma dị ndụ.
- source_word: παρὰ τοῦ πατρὸς
  choice: n’aka nna unu
  rationale: παρά ya na genitive na-egosi isi iyi, ya bụ, “site n’aka.” Ọ bụ ezie na “unu” adịghị n’ahịrị Grik kpọmkwem, esemokwu dị n’etiti Nna Jizọs na nna ndị na-emegide ya na-eme ka “nna unu” doo anya n’Igbo n’etinyeghị onye nna ahụ bụ tupu amaokwu 44.
- source_word: ποιεῖτε
  choice: na-emekwa
  rationale: Ụdị present a nwere ike ịbụ nkwupụta ma ọ bụ iwu n’ụdị Grik; n’ọnọdụ a, a họọrọ nkwupụta nke omume ha na-eme, nke kwekọrọ na usoro esemokwu ahụ. “-kwa” na-egosipụta ntụnyere dị n’etiti ihe Jizọs na-ekwu na ihe ha na-eme.
- source_word: πατήρ / πατρὸς
  choice: Nna / nna
  rationale: Mkpụrụedemede ukwu na nke mbụ na-egosi Chineke dị ka Nna; mkpụrụedemede nta na nke abụọ na-edobe ọdịiche okwu ahụ ma ghara ịkpọ onye nna ahụ bụ tupu ederede ahụ emee ya.
theological_decisions:
- issue: Ma a ga-akpọ nna nke abụọ ekwensu kpọmkwem n’amaokwu a
  choice: E debere “nna unu” n’ahịrị bụ isi.
  alternative: “n’aka ekwensu” ma ọ bụ “n’aka nna unu bụ́ ekwensu”
  rationale: Amaokwu 44 ga-akọwa onye ahụ kpọmkwem, ma amaokwu 38 n’onwe ya ahapụghị aha ya. “Nna unu” na-echekwa usoro mkpughe na esemokwu nke akụkọ ahụ.
- issue: Ma ποιεῖτε bụ nkwupụta ka ọ bụ iwu
  choice: 'A tụgharịrị ya dịka nkwupụta: “na-emekwa.”'
  alternative: 'Iwu: “meenụ”'
  rationale: Ụdị Grik nwere ike ịrụ ọrụ abụọ ahụ, ma ọnọdụ okwu na omume ndị a na-ebo ha ebubo na-akwado nkwupụta. A naghị eji ntụgharị a kpochapụ ohere asụsụ Grik nwere kpamkpam.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “N’ebe Nna nọ” na-echekwa echiche nke ịnọ n’ihu ma ọ bụ n’akụkụ Nna; “n’aka nna unu” na-egosi isi iyi. Ahịrịokwu ahụ zere ịkpọ nna nke abụọ ekwensu tupu ederede Jọn n’onwe ya akọwaa ya.
