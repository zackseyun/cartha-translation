  variant: Standard Igbo
source:
  edition: SBLGNT
  text: νῦν δὲ ζητεῖτέ με ἀποκτεῖναι, ἄνθρωπον ὃς τὴν ἀλήθειαν ὑμῖν λελάληκα ἣν ἤκουσα παρὰ τοῦ θεοῦ· τοῦτο Ἀβραὰμ οὐκ ἐποίησεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/040.yaml
  text: But now you are seeking to kill me, a man who has told you the truth that I heard from God. Abraham did not do this.
translation:
  language: ig
  text: Ma ugbu a, unu na-achọ igbu m, bụ nwoke gwara unu eziokwu ahụ m nụrụ n’aka Chineke. Ebreham emeghị nke a.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νῦν δὲ
  choice: Ma ugbu a
  rationale: “Ma” na-egosi ntụgharị echiche nke δέ, ebe “ugbu a” na-echekwa oge νῦν n’Igbo dị mfe ma doo anya.
- source_word: ζητεῖτέ με ἀποκτεῖναι
  choice: unu na-achọ igbu m
  rationale: Nke a na-echekwa omume na-aga n’ihu na ebumnuche dị na ζητεῖτε tinyere infinitive, na-enweghị ịgbakwunye nkọwa iwu ma ọ bụ omume ọjọọ karịa ihe Grik kwuru.
- source_word: ἀποκτεῖναι
  choice: igbu
  rationale: “Igbu” bụ okwu Igbo kwụ ọtọ; ọ dịghị agbakwunye echiche pụrụ iche nke igbu ọchụ ma ọ bụ ikpe ọnwụ.
- source_word: ἄνθρωπον
  choice: nwoke
  rationale: N’ebe a Jizọs na-ekwu banyere onwe ya dịka nwoke; “nwoke” na-echekwa otu nwoke ahụ doro anya na ederede ahụ.
- source_word: τὴν ἀλήθειαν
  choice: eziokwu ahụ
  rationale: “Eziokwu ahụ” na-echekwa njirimara doro anya nke article Grik ma na-ada nke ọma n’Igbo.
- source_word: ὑμῖν λελάληκα
  choice: gwara unu
  rationale: “Gwara unu” bụ ụzọ Igbo si ekwu nke a n'ụzọ eke; n’usoro ahịrịokwu a, njikọ ya na “nwoke” na-ewepụta echiche nke “nwoke nke gwara unu.”
- source_word: ἣν ἤκουσα παρὰ τοῦ θεοῦ
  choice: ahụ m nụrụ n’aka Chineke
  rationale: “N’aka Chineke” na-egosi Chineke dịka isi mmalite nke ihe Jizọs nụrụ, ma ọ naghị eme ka παρά pụta ihe karịrị “site n’aka/from.”
- source_word: τοῦτο Ἀβραὰμ οὐκ ἐποίησεν
  choice: Ebreham emeghị nke a
  rationale: 'Usoro a bụ Igbo eke ma na-echekwa ntụnyere siri ike: omume ha chọrọ ime abụghị ihe Ebreham mere.'
theological_decisions:
- issue: Ịsụgharị ἄνθρωπον mgbe Jizọs na-akọwa onwe ya
  choice: nwoke
  alternative: mmadụ
  rationale: “Nwoke” na-echekwa na Jizọs bụ otu nwoke a na-ekwu maka ya, na-enweghị ibelata ma ọ bụ ịgbakwunye ihe banyere ọdịdị ya dị nsọ.
- issue: Isi mmalite nke ozi Jizọs na παρὰ τοῦ θεοῦ
  choice: n’aka Chineke
  alternative: n’aka Nna
  rationale: Ederede Grik kwuru “Chineke,” ọ bụghị “Nna”; ya mere nsụgharị ahụ anaghị etinye aha nkà mmụta okpukpe nke amaokwu a n’onwe ya na-ekwughị.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. A họọrọ “na-achọ igbu m” iji chekwaa omume na ebumnuche na-aga n’ihu. Em dash na-ekewa “nwoke” dịka nkọwa ọzọ banyere “m,” nke na-eme ka usoro ahụ doo anya n’Igbo.
