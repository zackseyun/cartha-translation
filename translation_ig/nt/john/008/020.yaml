  text: ταῦτα τὰ ῥήματα ⸀ἐλάλησεν ἐν τῷ γαζοφυλακίῳ διδάσκων ἐν τῷ ἱερῷ· καὶ οὐδεὶς ἐπίασεν αὐτόν, ὅτι οὔπω ἐληλύθει ἡ ὥρα αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/020.yaml
  text: He spoke these words in the treasury while teaching in the temple[a], and no one seized him[b], because his hour had not yet come.
translation:
  language: ig
  text: O kwuru okwu ndị a n’ebe a na-etinye onyinye, mgbe ọ na-akụzi ihe n’ogige ụlọ nsọ[a]; ma ọ dịghị onye jidere ya, n’ihi na awa ya erubeghị[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Okwu Grik a sụgharịrị “ụlọ nsọ” na-ezo aka n’ogige na mpaghara ụlọ nsọ dum, ọ bụghị naanị ebe nsọ dị n’ime ya.
    reason: lexical_alternative
  - marker: b
    text: N’akwụkwọ Jọn, “awa ya” na-ezo aka n’oge a kara aka nke ahụhụ na otuto Jizọs ga-eru n’isi. A pụkwara ịsụgharị ya, “oge ya a kara aka.”
    reason: cross_reference
lexical_decisions:
- source_word: ταῦτα τὰ ῥήματα ἐλάλησεν
  choice: O kwuru okwu ndị a
  rationale: Nke a na-egosipụta nke ọma okwu ndị Jizọs kwuru tupu ebe a, ma na-ada ka Igbo nkịtị.
- source_word: ἐν τῷ γαζοφυλακίῳ
  choice: n’ebe a na-edebe onyinye
  rationale: γαζοφυλάκιον na-ezo aka n’ebe a na-edebe akụ ma ọ bụ onyinye ụlọnsọ ukwu, ọ bụghị naanị otu igbe; ntụgharị a doro onye Igbo nke oge a anya.
- source_word: διδάσκων
  choice: mgbe ọ nọ na-akụzi ihe
  rationale: Ọ na-egosi na ịkụzi ihe ahụ na ikwu okwu ahụ mere n’otu oge.
- source_word: ἐν τῷ ἱερῷ
  choice: dị n’ogige ụlọnsọ ukwu
  rationale: ἱερόν na-ezo aka n’ogige na mpaghara ụlọnsọ ukwu dum, ọ bụghị naanị ebe nsọ dị n’ime ya.
- source_word: οὐδεὶς ἐπίασεν αὐτόν
  choice: Ọ dịghịkwa onye ọ bụla jidere ya
  rationale: ‘Jidere’ na-echekwa echiche nke iji ike jide mmadụ, na-etinyeghị kpọmkwem usoro iwu nke ijide onye dịka onye omempụ.
- source_word: ὅτι οὔπω ἐληλύθει ἡ ὥρα αὐτοῦ
  choice: n’ihi na oge awa ya erubeghị
  rationale: ‘Erubeghị’ na-egosi na oge ahụ abịabeghị ruo n’oge akụkọ a; ‘oge awa ya’ na-echekwa akpaokwu pụrụ iche Jọn ji mee ihe.
theological_decisions:
- issue: Ojiji Jọn ji ‘ἡ ὥρα αὐτοῦ’ mee ihe
  choice: oge awa ya
  alternative: oge a kara aka nye ya; oge ya
  rationale: Ịhapụ ‘oge awa ya’ n’ụdị ihe atụ na-echekwa isiokwu Jọn banyere oge a kara aka maka ahụhụ na inweta otuto nke Jizọs, kama ịkọwa ya kpamkpam n’ahịrịokwu bụ isi.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe ma dị ùgwù mee ihe. ‘Ụlọnsọ ukwu’ na ‘ebe a na-edebe onyinye’ na-eme ka ọnọdụ ahụ doo anya n’enweghị itinye nkọwa karịrị ihe Grik kwuru; ihe odide ala peeji na-echekwa ohere nhazi ahịrịokwu Grik nwere.
