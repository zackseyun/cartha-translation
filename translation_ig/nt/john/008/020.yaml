revisions:
- from: O kwuru okwu ndị a mgbe ọ nọ na-akụzi ihe n’ebe a na-edebe onyinye dị n’ogige ụlọnsọ ukwu[a]. Ọ dịghịkwa onye ọ bụla jidere ya, n’ihi na oge awa ya erubeghị[b].
  to: O kwuru okwu ndị a n’ebe a na-etinye onyinye, mgbe ọ na-akụzi ihe n’ogige ụlọ nsọ[a]; ma ọ dịghị onye jidere ya, n’ihi na awa ya erubeghị[b].
  rationale: The revision retains all relationships in the Greek text while improving Standard Igbo idiom and precision. It renders the treasury as an offering area, places the teaching in the temple precincts, preserves the non-legal sense of “seized,” and retains the Johannine “hour” motif as “awa ya.” The notes are rewritten to be accurate, clear, and non-speculative.
