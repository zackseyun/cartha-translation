id: JHN.8.44
reference: John 8:44
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὑμεῖς ἐκ τοῦ πατρὸς τοῦ διαβόλου ἐστὲ καὶ τὰς ἐπιθυμίας τοῦ πατρὸς ὑμῶν θέλετε ποιεῖν. ἐκεῖνος ἀνθρωποκτόνος ἦν ἀπ’ ἀρχῆς, καὶ ἐν τῇ ἀληθείᾳ ⸂οὐκ ἔστηκεν⸃, ὅτι οὐκ ἔστιν ἀλήθεια ἐν αὐτῷ. ὅταν λαλῇ τὸ ψεῦδος, ἐκ τῶν ἰδίων λαλεῖ, ὅτι ψεύστης ἐστὶν καὶ ὁ πατὴρ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/044.yaml
  text: You are from your father[a], the devil, and you want to do your father's desires. He was a murderer from the beginning, and he has not stood in the truth, because there is no truth in him. Whenever he speaks the lie, he speaks from his own nature[c][b], because he is a liar and the father of it.
translation:
  language: ig
  text: Unu sitere n’aka nna unu, bụ́ ekwensu, unu na-achọkwa ime ihe ndị nna unu na-achọ. Ọ bụ ogbu mmadụ site ná mmalite, o guzosighịkwa n’eziokwu, n’ihi na eziokwu adịghị n’ime ya. Mgbe ọ bụla ọ na-ekwu ụgha[a], ọ na-ekwu site n’ihe bụ nke ya[b], n’ihi na ọ bụ onye ụgha na nna nke ụgha ahụ[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’ụzọ nkịtị, “Mgbe ọ bụla ọ na-ekwu ụgha ahụ.” A pụkwara ịsị, “Mgbe ọ bụla ọ na-ekwu okwu ụgha.”
    reason: lexical_alternative
  - marker: b
    text: N’ụzọ nkịtị, “ọ na-ekwu site n’ihe bụ nke ya”—ya bụ, site n’ihe dị n’ime ọdịdị ma ọ bụ omume nke ya.
    reason: lexical_alternative
  - marker: c
    text: 'N’ụzọ nkịtị, “na nna ya.” N’ebe a, a ghọtara “ya” dịka ọ na-ezo aka n’ụgha ahụ: ekwensu bụ isi mmalite ya. Ụfọdụ na-atụgharị ya n’ozuzu dịka “nna ụgha niile,” ebe ụfọdụ na-ahụ ya dịka “nna ya.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκ τοῦ πατρὸς τοῦ διαβόλου
  choice: Unu sitere n’aka nna unu, bụ́ ekwensu
  rationale: “Sitere n’aka” na-egosi isi mmalite ma ọ bụ njikọ nke ἐκ na-enye; nkọwa “bụ́ ekwensu” na-eme ka onye nna ahụ bụ doo anya.
- source_word: ἐπιθυμίας ... θέλετε ποιεῖν
  choice: unu na-achọkwa ime ihe ndị nna unu na-achọ
  rationale: Nke a na-egosi ọchịchọ na mkpebi ime ihe, na-enweghị ime ka ἐπιθυμίαι bụrụ naanị agụụ mmekọahụ.
- source_word: ἀνθρωποκτόνος
  choice: ogbu mmadụ
  rationale: Ọ bụ okwu Igbo doro anya maka onye na-egbu mmadụ ma kwekọọ n’ụdị ikpe omume dị n’ebe a.
- source_word: ἀπ’ ἀρχῆς
  choice: site ná mmalite
  rationale: Ọ na-echekwa okwu oge ahụ ozugbo na ụda Jọn.
- source_word: ἐν τῇ ἀληθείᾳ οὐκ ἔστηκεν
  choice: o guzosighịkwa n’eziokwu
  rationale: “Guzosighị” na-echekwa ihe oyiyi nke ἵστημι ma zere ịsị hoo haa na ọ nọbu n’eziokwu ma mesịa pụọ.
- source_word: ὅταν λαλῇ τὸ ψεῦδος
  choice: Mgbe ọ bụla ọ na-ekwu ụgha
  rationale: Nke a bụ Igbo eke na nghọta; ihe ederede Grik pụtara n’ụzọ nkịtị ka e debere n’okpuru peeji.
- source_word: ἐκ τῶν ἰδίων λαλεῖ
  choice: ọ na-ekwu ihe sitere n’ihe bụ nke ya
  rationale: Ọ na-anọ nso n’usoro Grik ma hapụ ohere maka nghọta na ọ bụ ihe sitere n’omume ma ọ bụ ọdịdị nke ya.
- source_word: ψεύστης
  choice: onye ụgha
  rationale: Ọ bụ ntụgharị Igbo kwụ ọtọ ma bụrụ nke a na-aghọta nke ọma.
- source_word: ὁ πατὴρ αὐτοῦ
  choice: nna ya
  rationale: N’usoro Igbo, “ya” na-ezo azụ n’ụgha ahụ, na-egosi na ekwensu bụ isi mmalite ya; nkọwa n’okpuru peeji na-echekwa nghọta ndị ọzọ.
theological_decisions:
- issue: Ihe ὁ πατὴρ αὐτοῦ na-ezo aka na ya
  choice: 'A tụgharịrị ya ka ọ na-ezo aka n’ụgha ahụ: “nna ya.”'
  alternative: “nna ụgha” ma ọ bụ, dịka nghọta ọzọ siri dị, “nna ya” nke na-ezo aka n’ekwensu.
  rationale: Ihe kacha nso αὐτοῦ n’ahịrịokwu ahụ bụ τὸ ψεῦδος. Nke a na-enye echiche na ekwensu bụ onye ụgha na isi mmalite ụgha, ma nkọwa n’okpuru peeji na-echekwa mgbagwoju anya dị n’usoro okwu ahụ.
- issue: Ma a ga-egosi na ekwensu nọbu n’eziokwu tupu ọ daa
  choice: “o guzosighịkwa n’eziokwu”
  alternative: “ọ nọgideghị n’eziokwu”
  rationale: Nhọrọ a na-echekwa ihe oyiyi Grik ma ọ naghị ekpebi na ekwensu nọbu n’eziokwu, ihe amaokwu ahụ n’onwe ya na-ekwughị hoo haa.
translation_notes:
  register: Standard Igbo; asụsụ dị ugbu a, dị nsọ ma dị mfe nghọta. E ji “unu” chekwaa plural ὑμεῖς. E zere okwu ụka pụrụ iche na nkọwa na-ekpebi ihe Grik hapụrụ ka ọ dị mgbagwoju anya.
