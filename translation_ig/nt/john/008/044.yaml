revisions:
- from: Unu sitere n’aka nna unu, bụ́ ekwensu, unu na-achọkwa ime ihe ndị nna unu na-achọ. Ọ bụ ogbu mmadụ site ná mmalite, o guzosighịkwa n’eziokwu, n’ihi na eziokwu adịghị n’ime ya. Mgbe ọ bụla ọ na-ekwu ụgha[a], ọ na-ekwu ihe sitere n’ihe bụ nke ya[b], n’ihi na ọ bụ onye ụgha na nna ya[c].
  to: Unu sitere n’aka nna unu, bụ́ ekwensu, unu na-achọkwa ime ihe ndị nna unu na-achọ. Ọ bụ ogbu mmadụ site ná mmalite, o guzosighịkwa n’eziokwu, n’ihi na eziokwu adịghị n’ime ya. Mgbe ọ bụla ọ na-ekwu ụgha[a], ọ na-ekwu site n’ihe bụ nke ya[b], n’ihi na ọ bụ onye ụgha na nna nke ụgha ahụ[c].
  rationale: The revision clarifies the final Greek pronoun’s most coherent contextual referent as ‘the lie’ without concealing the compact Greek wording or its disputed interpretation in the footnote. It also removes an added object in the preceding clause, yielding a closer and more natural Igbo expression. No doctrinal inference about a prior state in the truth has been added.
