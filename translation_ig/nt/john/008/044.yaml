    text: N’ụzọ nkịtị, “Mgbe ọ bụla ọ na-ekwu ụgha ahụ.” A pụkwara ịsị, “Mgbe ọ bụla ọ na-ekwu okwu ụgha.”
    reason: lexical_alternative
