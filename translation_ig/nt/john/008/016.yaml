source:
  edition: SBLGNT
  text: καὶ ἐὰν κρίνω δὲ ἐγώ, ἡ κρίσις ἡ ἐμὴ ⸀ἀληθινή ἐστιν, ὅτι μόνος οὐκ εἰμί, ἀλλ’ ἐγὼ καὶ ὁ πέμψας με πατήρ.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/016.yaml
  text: But even if I do judge[a], my judgment is true, because I am not alone, but I and the Father who sent me.
translation:
  language: ig
  text: Ma ọ bụrụgodị na m ekpee ikpe[a], ikpe m bụ eziokwu, n’ihi na anọghị m naanị m; kama mụ na Nna nke zitere m nọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ, “ọ bụrụ na m ekpee ikpe,” ma ọ bụ “ọ bụrụ na m ga-ekpe ikpe.” Okwu ọnọdụ Grik ahụ nwere ike ịsụgharị n’ụzọ ndị a, ma n’ebe a o yiri ka ọ nwere echiche “ọ bụrụgodị”: “Ma ọ bụrụgodị na m ekpee ikpe.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν κρίνω
  choice: ọ bụrụgodị na m ekpee ikpe
  rationale: Njikọ ἐὰν na ngwaa κρίνω dị na subjunctive na-egosi ọnọdụ nwere ike ime; n’ebe a, “ọ bụrụgodị” na-egosipụta ike nkwenye ahụ n’ime okwu gbara ya gburugburu, n’enweghị iwepụ ọdịdị ọnọdụ dị na Grik.
- source_word: δὲ
  choice: Ma
  rationale: δὲ na-egosi ntụgharị nwere ọdịiche n’ihe e kwuru tupu ya; “Ma” bụ ụzọ Igbo kwụụrụ onwe ya ma dị mfe isi gosipụta ya.
- source_word: ἡ κρίσις ἡ ἐμὴ
  choice: ikpe m
  rationale: Nke a bụ nsụgharị Igbo sitere n’okike maka aha ahụ na okwu nwe ya, ma ọ na-edobekwa echiche ikpe ma ọ bụ mkpebi ikpe dị na κρίσις.
- source_word: ἀληθινή
  choice: bụ eziokwu
  rationale: “Bụ eziokwu” na-echekwa obosara ἀληθινή—ihe bụ eziokwu, nke a pụrụ ịtụkwasị obi, ma dịkwa irè—n’ebughị ụzọ họrọ naanị otu n’ime nghọta ndị ahụ.
- source_word: μόνος οὐκ εἰμί
  choice: ọ bụghị naanị m nọ
  rationale: Nkebi a na-egosi na Jizọs anọghị naanị ya. Iji “nọ” mee ihe na-eme ka okwu Igbo ahụ bụrụ nke nkịtị ma doo anya.
- source_word: ἀλλ’ ἐγὼ καὶ ὁ πέμψας με πατήρ
  choice: kama ọ bụ mụ na Nna ahụ zitere m
  rationale: 'Nsụgharị a jikọtara Jizọs na Nna dịka ndị nọkọtara n’ihe gbasara ikpe ahụ, ma na-edobe participle πέμψας dịka nkebi na-akọwa Nna: “ahụ zitere m.”'
theological_decisions:
- issue: Mmekọrịta dị n’etiti ikpe Jizọs na Nna ahụ zitere ya
  choice: E gosipụtara ikpe Jizọs dịka eziokwu n’ihi na ọ naghị ekpe ya n’onwe ya, n’enweghị Nna ahụ zitere ya.
  alternative: A pụrụ ịghọta okwu ahụ naanị dịka arụmụka gbasara iwu nke chọrọ ihe akaebe nke mmadụ abụọ.
  rationale: Amaokwu ahụ n’onwe ya kwadoro eziokwu nke ikpe Jizọs n’eziokwu ahụ na ọ bụghị naanị ya nọ, kama ya na Nna nọ. Nsụgharị ahụ na-echekwa njikọ a n’etinyeghị nkọwa ozizi e mechara wulite n’elu ya.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta mee ihe. “Ikpe m bụ eziokwu” na-echekwa ụda Jọn na nghọta ma nke eziokwu ma nke ịdị irè; “Nna ahụ zitere m” na-egosipụta participle Grik n’ụzọ Igbo sitere n’okike.
