revisions:
- from: Ma ọ bụrụgodị na m ekpee ikpe[a], ikpe m bụ eziokwu, n’ihi na ọ bụghị naanị m nọ; kama ọ bụ mụ na Nna ahụ zitere m.
  to: Ma ọ bụrụgodị na m ekpee ikpe[a], ikpe m bụ eziokwu, n’ihi na anọghị m naanị m; kama mụ na Nna nke zitere m nọ.
  rationale: The revision retains the draft’s faithful concessive conditional and established legal/theological terminology. It corrects the final Igbo clause by explicitly expressing the joint presence of Jesus and the Father and by unambiguously identifying the Father as the one who sent Jesus. The footnote is also adjusted for clearer modern Igbo.
  reviewer_model: gpt-5.6-terra
