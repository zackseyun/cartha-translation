source:
  edition: robinson-pierpont-2005-byzantine
  text: Ἀνακύψας δὲ ὁ Ἰησοῦς, καὶ μηδένα θεασάμενος πλὴν τῆς γυναικός, εἶπεν αὐτῇ, Ἡ γυνή, ποῦ εἰσιν ἐκεῖνοι οἱ κατήγοροί σου; Οὐδείς σε κατέκρινεν;
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/john/008/010.yaml
  text: Then Jesus[a] straightened up, and seeing no one except the woman, said to her, "Woman, where are those accusers of yours? Has no one condemned you?"
translation:
  language: ig
  text: Jizọs[a] leliri anya, ma mgbe ọ hụghị onye ọ bụla ma e wezụga nwanyị ahụ, ọ sịrị ya, “Nwanyị, olee ebe ndị ahụ na-ebo gị ebubo nọ? Ọ̀ dịghị onye mara gị ikpe?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Amaokwu a so n'akụkọ banyere nwanyị e jidere n'ịkwa iko (Jọn 7:53–8:11), nke na-adịghị n'ihe odide Grik ndị kacha ochie. Lee nkọwa dị na Jọn 7:53.
    reason: textual_critical
lexical_decisions:
- source_word: ἀνακύψας
  choice: biliri kwụ ọtọ
  rationale: Na-akọwa Jizọs ka o si n'ọnọdụ o hulatara dee ihe n'ala kwụzie ọtọ; ọ bụghị nanị ileli anya elu.
- source_word: θεασάμενος
  choice: mgbe ọ hụrụ
  rationale: Na-egosipụta nghọta site n'anya n'ụzọ doro anya ma dịkwa ebumpụta ụwa n'Igbo.
- source_word: πλὴν τῆς γυναικός
  choice: ma e wezụga nwanyị ahụ
  rationale: Na-echekwa nkwupụta isi mmalite ahụ na ọ dịghị onye ọzọ ọ hụrụ ma e wezụga nwanyị ahụ.
- source_word: οἱ κατήγοροί σου
  choice: ndị ahụ na-ebo gị ebubo
  rationale: Na-egosipụta ọrụ ndị ahụ dị ka ndị na-eweta ebubo megide nwanyị ahụ n'ọnọdụ metụtara ikpe.
- source_word: κατέκρινεν
  choice: mara gị ikpe
  rationale: Nkebiokwu Igbo a na-ekwupụta ikpe ọmụma ma ọ bụ ikpe a mara mmadụ, dabara n'ọnọdụ iwu ebe a karịa okwu sara mbara dịka 'kpee gị ikpe'.
theological_decisions:
- issue: Ọnọdụ ederede nke Jọn 7:53–8:11
  choice: Etinyere amaokwu ahụ n'ahụ ederede ma tinye akara nkọwa [a] n'akụkụ aha Jizọs.
  alternative: Iwepụ amaokwu ahụ n'ahụ ederede ma ọ bụ itinye ya naanị n'ime nkuku.
  rationale: Isi mmalite enyere bụ ederede Byzantine nke nwere amaokwu ahụ, ma ihe akaebe ihe odide oge ochie chọrọ ka e mee ka ndị na-agụ ya mara na akụkọ a adịghị n'ihe odide Grik ndị kacha ochie, n'ebughị ụzọ kpebie ajụjụ ahụ n'ụzọ otu ozizi.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta. E ji “Nwanyị” chekwaa ụzọ nkwanye ùgwù nke okwu Grik Ἡ γυνή, ọ bụghị dị ka okwu nlelị. Ajụjụ ikpeazụ ka bụ ajụjụ kpọmkwem, n'enweghị ịgbakwunye nkọwa ozizi.
