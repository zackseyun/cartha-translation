review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents ἀνακύψας as Jesus raising himself from a bent posture, preserves the limitation “no one except the woman,” and renders the legal force of κατέκρινεν well. However, “Mgbe ahụ” adds a temporal transition not expressed by δέ, and “ọ dịghị onye ọzọ fọdụrụ” shifts the source from Jesus’ visual observation (μηδένα θεασάμενος) toward the state of people remaining.
  naturalness: The wording is generally clear Standard Igbo. “Mgbe o leliri anya ma hụ na ọ hụghị onye ọ bụla ma e wezụga nwanyị ahụ” is more natural and more directly reflects the Greek participial construction than the current repeated “mgbe.”
  terminology: “Nwanyị” is appropriate for Ἡ γυνή in this respectful direct address. “Ndị na-ebo gị ebubo” appropriately renders οἱ κατήγοροί σου. “Mara gị ikpe” is suitable for κατακρίνω in this juridical context. The textual-critical footnote is accurate and its anchor is structurally sound.
  issues:
  - severity: low
    issue: Added temporal wording
    rationale: “Mgbe ahụ” is not required by δέ, which here functions primarily as a connective; omitting it is closer to the source without reducing naturalness.
  - severity: medium
    issue: Visual observation is recast as people having remained
    rationale: “Mgbe ọ hụrụ na ọ dịghị onye ọzọ fọdụrụ” adds the idea of ‘remaining’ and makes the observation indirect. Greek says that Jesus, having seen no one except the woman, spoke to her.
  revised_text: Jizọs[a] leliri anya, ma mgbe ọ hụghị onye ọ bụla ma e wezụga nwanyị ahụ, ọ sịrị ya, “Nwanyị, olee ebe ndị ahụ na-ebo gị ebubo nọ? Ọ̀ dịghị onye mara gị ikpe?”
  revised_footnotes:
  - marker: a
    text: Amaokwu a so n'akụkọ banyere nwanyị e jidere n'ịkwa iko (Jọn 7:53–8:11), nke na-adịghị n'ihe odide Grik ndị kacha ochie. Lee nkọwa dị na Jọn 7:53.
    reason: textual_critical
  revision_rationale: The revision removes an unwarranted temporal addition and restores the direct visual sense of θεασάμενος while retaining the contextually clear sense that Jesus raised/turned his posture upward through “leliri anya.” It preserves the source’s legal language, respectful address, and textual-critical note without resolving the disputed passage’s status doctrinally.
