revisions:
- from: Mgbe ahụ, Jizọs[a] biliri kwụ ọtọ, ma mgbe ọ hụrụ na ọ dịghị onye ọzọ fọdụrụ ma e wezụga nwanyị ahụ, ọ sịrị ya, “Nwanyị, olee ebe ndị ahụ na-ebo gị ebubo nọ? Ọ̀ dịghị onye mara gị ikpe?”
  to: Jizọs[a] leliri anya, ma mgbe ọ hụghị onye ọ bụla ma e wezụga nwanyị ahụ, ọ sịrị ya, “Nwanyị, olee ebe ndị ahụ na-ebo gị ebubo nọ? Ọ̀ dịghị onye mara gị ikpe?”
  rationale: The revision removes an unwarranted temporal addition and restores the direct visual sense of θεασάμενος while retaining the contextually clear sense that Jesus raised/turned his posture upward through “leliri anya.” It preserves the source’s legal language, respectful address, and textual-critical note without resolving the disputed passage’s status doctrinally.
  reviewer_model: gpt-5.6-terra
