id: JHN.8.24
reference: John 8:24
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἶπον οὖν ὑμῖν ὅτι ἀποθανεῖσθε ἐν ταῖς ἁμαρτίαις ὑμῶν· ἐὰν γὰρ μὴ πιστεύσητε ὅτι ἐγώ εἰμι, ἀποθανεῖσθε ἐν ταῖς ἁμαρτίαις ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/024.yaml
  text: So I told you that you will die in your sins. For unless you believe that I am[a], you will die in your sins.
translation:
  language: ig
  text: N’ihi ya, agwara m unu na unu ga-anwụ n’ime mmehie unu. N’ihi na ọ bụrụ na unu ekweghị na ọ bụ m[a], unu ga-anwụ n’ime mmehie unu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya n’ụzọ dabara kpọmkwem n’okwu Grik, “na m bụ.” N’asụsụ Grik, ọ dịghị okwu e kwuru kpọmkwem nke na-akọwa onye ọ bụ mgbe “m bụ” gasịrị; okwu a nwekwara ike inwe ụda miri emi n’Oziọma Jọn.
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπον οὖν ὑμῖν
  choice: N’ihi ya, agwara m unu
  rationale: “N’ihi ya” na-egosi njikọ nkwubi okwu nke οὖν; “agwara m unu” na-asụgharị εἶπον na ὑμῖν n’Igbo dị mfe ma bụrụkwa nke e ji eme ihe ugbu a.
- source_word: ἀποθανεῖσθε
  choice: unu ga-anwụ
  rationale: Nke a na-egosipụta ngwaa ọdịnihu ahụ kpọmkwem, na-etinyeghị echiche ọzọ dịka ‘ịla n’iyi’ nke okwu Grik ahụ ekwughị hoo haa.
- source_word: ἐν ταῖς ἁμαρτίαις ὑμῶν
  choice: n’ime mmehie unu
  rationale: E debere ἁμαρτίαις n’ụdị ọtụtụ dịka “mmehie,” ebe “n’ime” na-egosi ọnọdụ mmadụ ka nọ na mmehie ya mgbe ọ na-anwụ.
- source_word: ἐὰν γὰρ μὴ
  choice: N’ihi na ọ bụrụ na ... ekweghị
  rationale: “N’ihi na” na-enye ihe kpatara okwu bu ụzọ dịka γάρ si eme, ebe “ọ bụrụ na ... ekweghị” na-egosipụta ọnọdụ na-adịghị mma nke ἐὰν μή n’Igbo nkịtị.
- source_word: πιστεύσητε
  choice: unu ekweghị
  rationale: N’usoro ọnọdụ na-adịghị mma, “unu ekweghị” bụ ụzọ Igbo doro anya isi kwuo ‘ọ bụrụ na unu ekweghị’; πιστεύω nwere echiche ikwere na ịtụkwasị obi, ma “ikwere” anaghị agbakwunye nkọwa na-adịghị n’amaokwu ahụ.
- source_word: ὅτι ἐγώ εἰμι
  choice: na abụ m onye ahụ[a]
  rationale: “Abụ m onye ahụ” bụ nkwupụta njirimara zuru oke ma dị mma n’Igbo. E tinyere akara nkọwa iji chekwaa eziokwu na Grik enweghị okwu njupụta e kwuru kpọmkwem mgbe ἐγώ εἰμι gasịrị.
theological_decisions:
- issue: Otu e si asụgharị ἐγώ εἰμι mgbe okwu njupụta na-esoghị ya
  choice: abụ m onye ahụ[a]
  alternative: abụ m
  rationale: Isi amaokwu jiri nkwupụta njirimara nke na-ada nke ọma n’Igbo, ma nkọwa ala peeji chekwara nsụgharị okwu n’usoro ya, “abụ m.” Nke a anaghị ekpebi ma okwu ahụ bụ naanị njirimara onwe onye ka ọ̀ nwekwara ụda miri emi gbasara mkpughe Chineke n’Oziọma Jọn.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E chekwara mmeghachi nke “unu ga-anwụ n’ime mmehie unu” dịka ọ dị n’isi mmalite, ma e tinyeghị nkọwa ụka ma ọ bụ nke otu okpukpe n’ime amaokwu ahụ.
