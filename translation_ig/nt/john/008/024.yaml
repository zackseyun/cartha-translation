    issue: The main text adds “onye ahụ” to ὅτι ἐγώ εἰμι.
    rationale: The Greek offers no explicit predicate after ἐγώ εἰμι. Although an idiomatic identifying sense is possible, “onye ahụ” more specifically resolves the expression than the source does. “Na ọ bụ m” reads naturally in Igbo and leaves the expression less over-specified.
  - severity: low
    issue: The footnote’s wording for an unstated predicate is unclear.
    rationale: “Okwu njupụta” is not the clearest modern Igbo description here. Explaining that Greek does not explicitly add words identifying who Jesus is is clearer and preserves the textual point.
