  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸀εἶπον αὐτῷ οἱ Ἰουδαῖοι· Νῦν ἐγνώκαμεν ὅτι δαιμόνιον ἔχεις. Ἀβραὰμ ἀπέθανεν καὶ οἱ προφῆται, καὶ σὺ λέγεις· Ἐάν τις τὸν λόγον μου τηρήσῃ, οὐ μὴ γεύσηται θανάτου εἰς τὸν αἰῶνα·
base_translation:
  language: en
  yaml_path: translation/nt/john/008/052.yaml
  text: The Jews said to him[a], “Now we know that you have a demon. Abraham died, and the prophets also, yet you say, ‘If anyone keeps my word[c][b], he will certainly never taste death forever.’”
translation:
  language: ig
  text: Ndị Juu sịrị ya, “Ugbu a ka anyị matara na i nwere mmụọ ọjọọ.[a] Ebreham nwụrụ, ndị amụma nwụkwara, ma ị na-asị, ‘Ọ bụrụ na onye ọ bụla edebe okwu m, ọ gaghị edetụ ọnwụ ire ma ọlị ruo mgbe ebighị ebi.’”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “mmụọ ọjọọ ji gị.” Okwu Grik ahụ pụtara n’ụzọ nkịtị, “i nwere mmụọ ọjọọ.”
    reason: lexical_alternative
  - marker: b
    text: 'Okwu Grik a kwusiri ike nke ukwuu: ọ pụtara na onye ahụ agaghị edetụ ọnwụ ire mgbe ọ bụla ma ọlị.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ Ἰουδαῖοι
  choice: Ndị Juu
  rationale: Nke a bụ nsụgharị kpọmkwem nke aha otu ahụ n’amaokwu a; ‘ndị ndu ndị Juu’ ga-agbakwụnye nkọwa nke okwu Grik ahụ ekwughị kpọmkwem.
- source_word: Νῦν ἐγνώκαμεν
  choice: Ugbu a ka anyị matara
  rationale: Ọ na-egosi na ha eruola n’ihe ha chere na ha maara ugbu a, ma ọ bụ nkwubi okwu ha mere ugbu a.
- source_word: δαιμόνιον ἔχεις
  choice: i nwere mmụọ ọjọọ
  rationale: Ọ na-agbasochi okwu Grik ahụ, nke pụtara n’ụzọ nkịtị ‘i nwere mmụọ ọjọọ,’ kama ịkọwa ya ozugbo dị ka ịbụ onye mmụọ ọjọọ ji.
- source_word: Ἀβραὰμ ἀπέθανεν καὶ οἱ προφῆται
  choice: Ebraham nwụrụ, ndị amụma nwụkwara
  rationale: ‘Nwụkwara’ na-egosipụta καί ma na-eme ka njikọ ahụ daa nke ọma n’Igbo.
- source_word: καὶ σὺ λέγεις
  choice: ma ị na-asị
  rationale: N’ebe a καί nwere ike igosi ọdịiche dị n’etiti ọnwụ Ebraham na ndị amụma na ihe Jizọs kwuru.
- source_word: Ἐάν τις
  choice: Ọ bụrụ na onye ọ bụla
  rationale: Ọ na-echekwa ọnọdụ ahụ na oke ya nke metụtara onye ọ bụla.
- source_word: τὸν λόγον μου τηρήσῃ
  choice: edebe okwu m
  rationale: ‘Edebe’ na-echekwa echiche τηρέω nke idebe, ichekwa, ma ọ bụ irube isi, n’akọwaghị ya nanị dị ka nrubeisi; ‘okwu m’ na-egosipụta λόγος.
- source_word: οὐ μὴ γεύσηται θανάτου
  choice: ọ gaghị edetụ ọnwụ ire ma ọlị
  rationale: ‘Edetụ ọnwụ ire’ na-echekwa ihe atụ dị na Grik, ebe ‘ma ọlị’ na-egosipụta nkwụsi ike nke οὐ μή.
- source_word: εἰς τὸν αἰῶνα
  choice: ruo mgbe ebighị ebi
  rationale: Nke a na-egosipụta na ọ dịghị mgbe ọ bụla n’ọdịnihu ka onye ahụ ga-edetụ ọnwụ ire, kama ịpụta na ọnwụ ahụ n’onwe ya ga-adịru ebighị ebi.
theological_decisions:
- issue: Ihe nkwa banyere ‘idetụ ọnwụ ire’ pụtara
  choice: E debere okwu ihe atụ ahụ, ‘edetụ ọnwụ ire,’ n’ederede bụ isi.
  alternative: Ịkọwa ya kpọmkwem dị ka ọnwụ anụ ahụ, ọnwụ ime mmụọ, ma ọ bụ ọnwụ ikpeazụ.
  rationale: Ndị na-emegide Jizọs ghọtara okwu ya n’ụzọ metụtara ọnwụ anụ ahụ, ma Oziọma Jọn na-ejikarị okwu nwere nghọta karịrị otu. Nsụgharị ahụ ekwesịghị idozi esemokwu nkà mmụta okpukpe nke ederede ahụ hapụrụ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke kwanyere ugwu ma dị mfe nghọta. A họọrọ ‘i nwere mmụọ ọjọọ’ iji nọrọ nso n’usoro okwu Grik, ebe ‘mmụọ ọjọọ ji gị’ dị n’ala ala peeji dịka nkọwa ọzọ. Akara [a] na [b] pụtara n’ederede bụ isi ma kwekọọ na nkọwa ha.
