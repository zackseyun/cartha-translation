  terminology: “Ndị Juu,” “mmụọ ọjọọ,” “ndị amụma,” “okwu m,” and “edetụ ọnwụ ire” are suitable, source-sensitive choices. The alternate rendering in footnote a is idiomatic without replacing the literal main-text wording.
