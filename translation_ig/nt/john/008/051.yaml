id: JHN.8.51
reference: John 8:51
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀμὴν ἀμὴν λέγω ὑμῖν, ἐάν τις τὸν ⸂ἐμὸν λόγον⸃ τηρήσῃ, θάνατον οὐ μὴ θεωρήσῃ εἰς τὸν αἰῶνα.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/051.yaml
  text: Truly, truly, I say to you, if anyone keeps my word, he will certainly never see death forever.
translation:
  language: ig
  text: N’ezie, n’ezie, ana m asị unu, ọ bụrụ na onye ọ bụla edebe okwu m, ọ gaghị ahụ ọnwụ ruo mgbe ebighị ebi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀμὴν ἀμὴν
  choice: N’ezie, n’ezie
  rationale: Na-edobe nkwughachi ahụ Jizọs ji mesie nkwupụta ya ike, n’ụdị Igbo doro anya ma dịkwa nsọpụrụ.
- source_word: τηρήσῃ
  choice: edebe
  rationale: “Idebe” nwere ike ịgụnye ịrapara n’okwu ahụ, irubere ya isi, na ime ya; nke a kwekọrọ n’obosara ihe okwu Grik ahụ pụtara.
- source_word: τὸν ἐμὸν λόγον
  choice: okwu m
  rationale: Ọ bụ ntụgharị nkịtị ma doo anya nke na-egosi ozi ma ọ bụ nkuzi Jizọs n’enweghị ịgbakwunye nkọwa okpukpe pụrụ iche.
- source_word: θάνατον ... θεωρήσῃ
  choice: ahụ ọnwụ
  rationale: Na-echekwa ihe atụ okwu Grik ahụ kpọmkwem, kama ịkọwa ya nanị dị ka “ịnwụ,” si otú a na-ahapụ ike na mgbagwoju anya nke okwu ahụ.
- source_word: οὐ μὴ ... εἰς τὸν αἰῶνα
  choice: ọ gaghị ... ma ọlị ruo mgbe ebighị ebi
  rationale: “Ọ gaghị ... ma ọlị” na-egosipụta nkwusie ike nke οὐ μή, ebe “ruo mgbe ebighị ebi” na-edobe nkebi εἰς τὸν αἰῶνα nke dị na isi mmalite.
theological_decisions:
- issue: Mmekọrịta nkwa a na ọnwụ anụahụ́
  choice: E debere okwu atụ ahụ dịka “ọ gaghị ahụ ọnwụ,” n’enweghị ịkọwa ụdị ọnwụ a na-ekwu maka ya.
  alternative: Ịsụgharị ya dịka “ọ gaghị anwụ anwụ” ma ọ bụ “ọ gaghị ahụ ọnwụ ime mmụọ.”
  rationale: Isi mmalite ji “ịhụ ọnwụ” kwuo okwu ma hapụ esemokwu dị n’etiti nkwa ahụ na ahụmahụ ọnwụ anụahụ́; ntụgharị ekwesịghị idozi esemokwu ahụ n’aha onye na-agụ ya.
translation_notes:
  register: Standard Igbo dị ugbu a, dị nsọpụrụ ma dị mfe nghọta. E ji “ana m asị unu” mee ka okwu ahụ bụrụ nke eke n’Igbo, ebe e chekwara nkwughachi na nkwusie ike dị n’asụsụ Grik.
