translation_notes:
  register: E ji Standard Igbo nke oge a, doro anya ma dị ùgwù. E debere okwu ebubo ahụ n’ụzọ kwụ ọtọ, n’agbanyeghị na amaokwu a ekwughị ihe gbasara nwoke so mee omume ahụ.
