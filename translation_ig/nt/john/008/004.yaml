  yaml_path: translation/nt/john/008/004.yaml
  text: They[a] said to him, "Teacher, this woman has been caught in the very act of committing adultery."
translation:
  language: ig
  text: Ha[a] sịrị ya, “Onye Nkụzi, e jidere nwanyị a kpọmkwem ka ọ na-akwa iko.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Akụkụ a na-aga n'ihu n'akụkọ banyere nwanyị e jidere ka ọ na-akwa iko (Jọn 7:53–8:11). Lee nkọwa dị na Jọn 7:53.
    reason: textual_critical
lexical_decisions:
- source_word: λέγουσιν
  choice: Ha sịrị
  rationale: Okwu Grik a dị n’ụdị ugbu a nke a na-ejikarị akọ akụkọ gara aga; ‘Ha sịrị’ na-eme ka akụkọ ahụ daa nke ọma n’Igbo.
- source_word: Διδάσκαλε
  choice: Onye Nkụzi
  rationale: Nke a bụ ụzọ doro anya, dị ùgwù, nke a na-eji akpọ onye na-akụzi ihe.
- source_word: κατείληπται
  choice: e jidere
  rationale: Ọ bụ ngwaa zuru oke n’ụdị nnara; ọ na-egosi na njide ahụ emeela, ma ọnọdụ ya ka metụtara ihe a na-ekwu ugbu a.
- source_word: ἐπαυτοφώρῳ
  choice: kpọmkwem mgbe
  rationale: N’ebe a, akpaalaokwu Grik ahụ pụtara na e jidere mmadụ mgbe ọ nọ na-eme mmehie ahụ n’onwe ya; okwu a na-ejikọta ya na nkebi na-esochi ka ọ bụrụ Igbo eke.
- source_word: μοιχευομένη
  choice: ọ na-akwa iko
  rationale: Mkpụrụokwu nọ n’oge na-aga n’ihu na-egosi ihe nwanyị ahụ nọ na-eme mgbe e jidere ya; ‘ịkwa iko’ bụ okwu Igbo a na-aghọta maka mmebi alụmdi na nwunye n’ebe a.
