  text: ἐγὼ δὲ οὐ ζητῶ τὴν δόξαν μου· ἔστιν ὁ ζητῶν καὶ κρίνων.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/050.yaml
  text: But I do not seek my own glory[b][a]; there is One who seeks it and judges.
translation:
  language: ig
  text: Ma mụ onwe m anaghị achọ ebube m; e nwere onye na-achọ ya ma na-ekpe ikpe.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n’ụzọ kpọmkwem karị, “e nwere onye ahụ na-achọ ma na-ekpe ikpe.” Ihe e zoro aka na ya n’okwu “na-achọ” bụ ebube m e kwuru n’ahịrịokwu mbụ.
    reason: lexical_alternative
  - marker: b
    text: Site n’ihe ndị gbara amaokwu a gburugburu, a na-aghọtakarị “onye” a dịka Nna, ọ bụ ezie na Grik akpọghị ya aha kpọmkwem n’ebe a.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγὼ δὲ
  choice: Ma mụ onwe m
  rationale: “Ma” na-egosi ọdịiche nke δέ, ebe “mụ onwe m” na-edobe nkwusi ike dị n’ịkpọpụta ἐγώ.
- source_word: οὐ ζητῶ
  choice: adịghị achọ
  rationale: Ọ bụ ntụgharị nkịtị nke present indicative na-adịghị mma; “achọ” na-edobekwa njikọ okwu ya na ζητῶν n’ahịrịokwu nke abụọ.
- source_word: τὴν δόξαν μου
  choice: otuto nke m
  rationale: “Otuto” na-egosi nsọpụrụ ma ọ bụ ebube a na-enye mmadụ; “nke m” na-edobe nnọchiaha nwe ihe n’ụzọ doro anya na Igbo.
- source_word: ἔστιν ὁ ζητῶν
  choice: e nwere Onye na-achọ ya
  rationale: “E nwere” na-edobe usoro existential nke Grik, na-ahapụghị aha onye ahụ. E tinyere “ya” ka Igbo bụrụ ihe sitere n’okike; ọ na-ezo aka n’otuto Jizọs e kwuru na mbụ.
- source_word: καὶ κρίνων
  choice: na-ekpekwa ikpe
  rationale: “Na-ekpe ikpe” na-egosi ọrụ ikpe nke κρίνων; “-kwa” na-egosipụta καί ma jikọta ya na ọrụ ịchọ ahụ.
theological_decisions:
- issue: Onye bụ isiokwu a na-akpọghị aha nke na-achọ ma na-ekpe ikpe
  choice: E debere ya dịka “Onye” n’ahịrịokwu bụ isi, n’akpọghị ya Nna.
  alternative: “E nwere Nna ahụ na-achọ ya, na-ekpekwa ikpe.”
  rationale: Ọnọdụ gbara amaokwu ahụ gburugburu na-eme ka ọtụtụ ndị ghọta na ọ bụ Nna, ma Grik n’onwe ya ekwughị aha ahụ kpọmkwem. Ya mere, ntụgharị ahụ na-edobe njide na nghọta abụọ dị n’isi mmalite.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị nsọpụrụ ma dị mfe nghọta. E ji mkpụrụedemede ukwu dee “Onye” dịka ụzọ nkịtị isi gosi onye Chineke bụ n’Igbo, ma nkọwa ala peeji na-eme ka o doo anya na isi mmalite Grik akpọghị ya “Nna” kpọmkwem.
