    reason: lexical_alternative
  - marker: b
    text: Site n’ihe ndị gbara amaokwu a gburugburu, a na-aghọtakarị “onye” a dịka Nna, ọ bụ ezie na Grik akpọghị ya aha kpọmkwem n’ebe a.
    reason: alternative_reading
  revision_rationale: The revision retains the Greek syntax and ambiguity while using idiomatic Standard Igbo. It changes “otuto” to “ebube” for δόξα and removes main-text capitalization that could over-specify the unnamed subject. Both footnotes preserve the lexical explanation and the contextual, but unstated, identification with the Father.
