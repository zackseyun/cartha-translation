revisions:
- from: Ma mụ onwe m adịghị achọ otuto nke m; e nwere Onye na-achọ ya, na-ekpekwa ikpe.[a][b]
  to: Ma mụ onwe m anaghị achọ ebube m; e nwere onye na-achọ ya ma na-ekpe ikpe.[a][b]
  rationale: The revision retains the Greek syntax and ambiguity while using idiomatic Standard Igbo. It changes “otuto” to “ebube” for δόξα and removes main-text capitalization that could over-specify the unnamed subject. Both footnotes preserve the lexical explanation and the contextual, but unstated, identification with the Father.
  reviewer_model: gpt-5.6-terra
