review_pass:
  verdict: revise
  source_fidelity: A chọrọ ndozi nta. «Ọ bụghị n’onwe m ka m ji bịa» na-akọwa nnwere onwe n’ime ihe nke ọma, ma «ἀπ’ ἐμαυτοῦ» na-akọwapụta n'ụzọ doro anya na ọ bụghị n’ebe onwe ya ka ọ bịara. Nsụgharị bụ isi kwesịrị idobe ntụaka isi iyi a, ebe nkọwa ala peeji nwere ike igosi echiche nke ime ihe n’onwe ya.
  naturalness: Usoro ọnọdụ «Ọ bụrụ na ... unu gaara ...» dị eke ma na-egosi ọnọdụ megidere eziokwu nke ọma. «M sitere n’ebe Chineke nọ pụta, abịawokwa m» na-adịkarị mma ma na-echekwa ma ọbịbịa sitere n’ebe ahụ ma ọnọdụ ọbịbịa e mezuru. Nkọwa ala peeji b ugbu a nwere «abịaghị m n’uche aka m», nke na-adịghị eke ma na-adịghị doo anya na Standard Igbo.
  terminology: «Chineke», «Nna», «ịhụ ... n’anya», na «zitere» dabara n’ọrụ na Standard Igbo. «Ọ bụ ya» na-edobe nkwusi ike nke ἐκεῖνος n’enweghị itinye nkọwa okpukpe ọzọ.
  issues:
  - severity: medium
    issue: Nsụgharị nke ἀπ’ ἐμαυτοῦ n’ahịrịokwu isi
    rationale: «Ọ bụghị n’onwe m ka m ji bịa» na-elekwasị anya n’otú o si bịa/nnwere onwe ya, ma ọ naghị edobe kpọmkwem «from myself». «Esiteghị m n’onwe m bịa» na-echekwa ambiguity nke isi iyi na nke enweghị onye zitere ya.
  - severity: medium
    issue: Okwu ọzọ dị na nkọwa ala peeji b anaghị adị eke
    rationale: «Abịaghị m n’uche aka m» abụghị ụzọ Standard Igbo doro anya e si akọwa ‘on my own’ ma nwee ike gbagwojuru onye na-agụ anya. «Abịaghị m n’onwe m» bụ nhọrọ dị mfe na nke a ghọtara.
  revised_text: Jizọs sịrị ha, “Ọ bụrụ na Chineke bụ Nna unu, unu gaara ahụ m n’anya, n’ihi na m sitere n’ebe Chineke nọ pụta, abịawokwa m.[a] N’ihi na esiteghị m n’onwe m bịa,[b] kama ọ bụ ya zitere m.”
