revisions:
- from: Jizọs sịrị ha, “Ọ bụrụ na Chineke bụ Nna unu, unu gaara ahụ m n’anya, n’ihi na esitere m n’ebe Chineke nọ pụta, anọkwa m ebe a.[a] N’ihi na ọ bụghị n’onwe m ka m ji bịa,[b] kama ọ bụ ya zitere m.”
  to: Jizọs sịrị ha, “Ọ bụrụ na Chineke bụ Nna unu, unu gaara ahụ m n’anya, n’ihi na m sitere n’ebe Chineke nọ pụta, abịawokwa m.[a] N’ihi na esiteghị m n’onwe m bịa,[b] kama ọ bụ ya zitere m.”
  rationale: E degharịrị ahịrịokwu banyere ἀπ’ ἐμαυτοῦ ka ọ debe echiche «site n’onwe m» nke Grik, ma hapụ nghọta banyere ime ihe n’enweghị onye zitere ya ka ọ dị na nkọwa ala peeji. E wepụrụ okwu nkọwa ala peeji na-adịghị eke. E debere ọnọdụ megidere eziokwu, asụsụ nke mmalite Jizọs, ọnọdụ ọbịbịa e mezuru, na nkwusi ike na Chineke bụ onye zitere ya.
