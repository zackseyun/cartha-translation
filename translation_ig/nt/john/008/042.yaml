id: JHN.8.42
reference: John 8:42
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸀εἶπεν αὐτοῖς ὁ Ἰησοῦς· Εἰ ὁ θεὸς πατὴρ ὑμῶν ἦν ἠγαπᾶτε ἂν ἐμέ, ἐγὼ γὰρ ἐκ τοῦ θεοῦ ἐξῆλθον καὶ ἥκω· οὐδὲ γὰρ ἀπ’ ἐμαυτοῦ ἐλήλυθα, ἀλλ’ ἐκεῖνός με ἀπέστειλεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/042.yaml
  text: Jesus said to them[a], “If God were your Father, you would love me, because I came from God and am here. For I have not come from myself[b], but he sent me.”
translation:
  language: ig
  text: Jizọs sịrị ha, “Ọ bụrụ na Chineke bụ Nna unu, unu gaara ahụ m n’anya, n’ihi na m sitere n’ebe Chineke nọ pụta, abịawokwa m.[a] N’ihi na esiteghị m n’onwe m bịa,[b] kama ọ bụ ya zitere m.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n’ụzọ dabara okwu Grik nso karị, “M sitere n’ebe Chineke nọ pụta, abịawokwa m.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “abịaghị m n’onwe m.” Okwu Grik ahụ pụrụ imesi ma ebe o si bịa ma ime ihe n’enweghị onye zitere ya ike.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰ ... ἦν ... ἠγαπᾶτε ἂν
  choice: Ọ bụrụ na Chineke bụ Nna unu, unu gaara ahụ m n’anya
  rationale: Usoro ‘ọ bụrụ na ... gaara’ na-egosi ọnọdụ na-abụghị eziokwu dịka njikọ imperfect na ἄν si eme n’asụsụ Grik.
- source_word: θεὸς πατὴρ ὑμῶν
  choice: Chineke bụ Nna unu
  rationale: Nke a na-egosi mmekọrịta Chineke dịka Nna ha, ma na-eji ‘Nna’ dịka aha mmekọrịta nke Chineke.
- source_word: ἠγαπᾶτε
  choice: unu gaara ahụ m n’anya
  rationale: ‘Ịhụ mmadụ n’anya’ bụ ụzọ Igbo nkịtị na nke doro anya si akọwa ἀγαπάω n’ebe a.
- source_word: ἐγὼ γὰρ
  choice: n’ihi na
  rationale: γάρ na-enye ihe mere ha ga-eji hụ Jizọs n’anya ma ọ bụrụ na Chineke bụ Nna ha.
- source_word: ἐκ τοῦ θεοῦ ἐξῆλθον
  choice: esitere m n’ebe Chineke nọ pụta
  rationale: Nke a na-echekwa echiche nke mmalite ma ọ bụ ebe o si bịa, nke ἐκ na ἐξῆλθον na-egosi, n’etinyeghị okwu nkà mmụta okpukpe e mechara guzobe.
- source_word: καὶ ἥκω
  choice: anọkwa m ebe a
  rationale: ἥκω na-egosi ọbịbịa nke ruru n’ọnọdụ ịdị ugbu a; okwu Igbo a na-egosi nke ahụ n’ụzọ eke.
- source_word: οὐδὲ γὰρ ἀπ’ ἐμαυτοῦ ἐλήλυθα
  choice: N’ihi na ọ bụghị n’onwe m ka m ji bịa
  rationale: 'Nke a na-echekwa mgbagwoju ezi uche dị na ἀπ’ ἐμαυτοῦ: ọ pụrụ izo aka n’ebe o si bịa ma ọ bụ n’ime ihe n’onwe ya n’enweghị onye zitere ya.'
- source_word: ἀλλ’ ἐκεῖνός με ἀπέστειλεν
  choice: kama ọ bụ ya zitere m
  rationale: ‘Ọ bụ ya’ na-egosipụta ike e tinyere na ἐκεῖνος, ebe ‘zitere’ na-echekwa echiche ozi nke ἀποστέλλω.
theological_decisions:
- issue: Ikwupụta ebe Jizọs si bịa n’etinyeghị nkọwa okwukwe ndị e mechara hazie
  choice: esitere m n’ebe Chineke nọ pụta, anọkwa m ebe a
  alternative: esitewo m n’ebe Chineke nọ bịa
  rationale: Isi okwu na-ekwusi ike na Jizọs sitere n’ebe Chineke nọ nakwa na Chineke zitere ya; nsụgharị ahụ anaghị etinye okwu nkà mmụta okpukpe karịrị ihe okwu Grik kwuru.
- issue: Ihe ἀπ’ ἐμαυτοῦ pụtara
  choice: ọ bụghị n’onwe m ka m ji bịa
  alternative: esiteghị m n’onwe m bịa; abịaghị m n’uche aka m
  rationale: Nhọrọ bụ isi na-ahapụ ma echiche nke isi iyi ma nke ime ihe n’enweghị onye nyere ikike ka ha dị, ebe nkọwa ala peeji na-eme ka ụzọ abụọ ahụ pụta ìhè.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. ‘Gaara’ na-egosi ọnọdụ na-abụghị eziokwu; ‘ọ bụ ya’ na-echekwa nkwusi ike dị na ἐκεῖνος. Akara nkọwa [a] na [b] dị n’ahịrịokwu isi.
