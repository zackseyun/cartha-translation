- from: Mgbe chi bọrọ, ọ bịakwara ọzọ n'ụlọ nsọ, mmadụ niile na-abịakwutekwa ya. Ọ nọdụrụ ala wee malite ịkụziri ha ihe.[a]
  to: Mgbe chi bọrọ, ọ bịara ọzọ n'ụlọ nsọ, ndị mmadụ niile na-abịakwute ya; ọ nọdụ ala wee malite ịkụziri ha ihe.[a]
  rationale: The revision preserves the source’s imperfect sense (“na-abịakwute”), its allowable inceptive reading of ἐδίδασκεν (“malite ịkụziri”), and the existing textual-critical note. It removes an unsupported recurrence/additive implication from the crowd’s action and renders Jesus’ return without redundancy.
