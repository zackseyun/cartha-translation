source:
  edition: robinson-pierpont-2005-byzantine
  text: Ὄρθρου δὲ πάλιν παρεγένετο εἰς τὸ ἱερόν, καὶ πᾶς ὁ λαὸς ἤρχετο πρὸς αὐτόν· καὶ καθίσας ἐδίδασκεν αὐτούς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/john/008/002.yaml
  text: At dawn he came again to the temple, and all the people were coming to him; and he sat down and began to teach them.
translation:
  language: ig
  text: Mgbe chi bọrọ, ọ bịara ọzọ n'ụlọ nsọ, ndị mmadụ niile na-abịakwute ya; ọ nọdụ ala wee malite ịkụziri ha ihe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Amaokwu a na-aga n'ihu n'akụkọ banyere nwanyị ahụ e jidere ka ọ na-akwa iko (Jọn 7:53–8:11). Akụkọ a adịghị n'ihe odide Grik ndị kacha ochie. Lee nkọwa dị na Jọn 7:53.
    reason: textual_critical
lexical_decisions:
- source_word: Ὄρθρου
  choice: Mgbe chi bọrọ
  rationale: Ọ na-egosi oge chi na-abọ ma ọ bụ mgbe anyanwụ na-achọ ịwa; nke a bụ ụzọ Igbo dị ndụ ma doo anya isi kwuo “n'isi ụtụtụ.”
- source_word: παρεγένετο
  choice: ọ bịakwara
  rationale: Ọ na-egosi na ọ bịarutere n'ebe ahụ; “bịakwara” na-egosikwa πάλιν (“ọzọ”) n'ụzọ dabara n'usoro okwu Igbo.
- source_word: ἱερόν
  choice: ụlọ nsọ
  rationale: N'ebe a, okwu ahụ pụtara ogige ụlọ nsọ dum ebe a pụrụ izi ọha mmadụ ihe, ọ bụghị naanị ime ụlọ nsọ ahụ kachasị nsọ; “ụlọ nsọ” bụ okwu Igbo a na-aghọta nke ọma na gburugburu a.
- source_word: καθίσας
  choice: Ọ nọdụrụ ala
  rationale: Nke a na-egosi ihe o mere tupu ọ malite izi ha ihe, ma na-ada nke ọma n'Igbo.
- source_word: ἐδίδασκεν
  choice: wee malite ịkụziri ha ihe
  rationale: Oge ngwaa imperfect nwere ike ịpụta na izi ihe ahụ malitere ma ọ bụ na ọ nọ na-aga n'ihu. Nhọrọ a na-enye echiche mmalite ahụ nke dabara na καθίσας, ma nkọwa gbasara ọdịiche ahụ ekwesịghị ibu ederede amaokwu ahụ arọ.
theological_decisions:
- issue: Ọnọdụ ederede nke Jọn 7:53–8:11
  choice: E debere amaokwu ahụ n'ederede, tinyekwa akara nkọwa [a].
  alternative: Ịhapụ akụkụ ahụ n'ederede bụ isi ma ọ bụ itinye ya naanị na nkọwa ala peeji.
  rationale: Ederede Grik e nyere nwere amaokwu ahụ, ma ihe akaebe ederede oge mbụ na-egosi na akụkọ a adịghị n'ọtụtụ ihe odide Grik kacha ochie. Nkọwa ala peeji na-eme ka onye na-agụ mara okwu a n'ebughị ụzọ kpebie esemokwu ahụ n'aha ya.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji “mmadụ niile” sụgharịa πᾶς ὁ λαός n'ụzọ nkịtị nye ndị na-agụ Igbo, ebe imperfect “na-abịakwutekwa” na-egosi omume na-aga n'ihu. E tinyere akara nkọwa n'ọgwụgwụ amaokwu ka ọ ghara ịdị ka ọ na-akọwa naanị otu okwu.
