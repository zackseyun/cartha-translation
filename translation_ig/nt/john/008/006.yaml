translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. E debere njikọ ebumnuche dị n’ahịrịokwu mbụ, tinyekwa ihe odide aka ochie Byzantine nwere bụ ‘μὴ προσποιούμενος’ n’ahịrịokwu ikpeazụ.
