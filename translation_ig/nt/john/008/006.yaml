  to: Ha[a] na-ekwu nke a iji nwalee ya, ka ha wee nwee ebubo megide ya. Ma Jizọs, mgbe ọ hulatara ala, ji mkpịsị aka ya na-ede n’ala, na-eleghara ha anya.
  rationale: The revision preserves the Byzantine Greek’s ongoing imperfect actions (“na-ekwu,” “na-ede”), retains the purpose clause and legal accusation, and replaces a visually restricted final phrase with an idiomatic expression for deliberate non-attention. The textual-critical footnote is retained unchanged.
