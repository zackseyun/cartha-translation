id: JHN.8.6
reference: John 8:6
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: robinson-pierpont-2005-byzantine
  text: Τοῦτο δὲ ἔλεγον πειράζοντες αὐτόν, ἵνα ἔχωσιν κατηγορίαν κατ' αὐτοῦ. Ὁ δὲ Ἰησοῦς κάτω κύψας, τῷ δακτύλῳ ἔγραφεν εἰς τὴν γῆν, μὴ προσποιούμενος.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/john/008/006.yaml
  text: They[a] were saying this to test him, so that they might have an accusation against him. But Jesus, bending down, wrote on the ground with his finger, paying no attention.
translation:
  language: ig
  text: Ha[a] na-ekwu nke a iji nwalee ya, ka ha wee nwee ebubo megide ya. Ma Jizọs, mgbe ọ hulatara ala, ji mkpịsị aka ya na-ede n’ala, na-eleghara ha anya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nke a bụ ihe na-aga n’ihu n’akụkọ banyere nwanyị e jidere ka ọ na-akwa iko (Jọn 7:53–8:11). Lee nkọwa dị na Jọn 7:53.
    reason: textual_critical
lexical_decisions:
- source_word: πειράζοντες
  choice: iji nwalee ya
  rationale: N’ebe a, okwu ahụ na-egosi na ha ji ajụjụ ahụ na-anwale Jizọs iji nweta ihe ha ga-eji bo ya ebubo; ‘nwalee’ na-edobe isi echiche Grik ahụ n’etinyeghị nkọwa karịrị ya.
- source_word: κατηγορίαν
  choice: ihe ha ga-eji bo ya ebubo
  rationale: Nke a na-egosipụta ebubo e nwere ike iweta megide mmadụ, ma na-asụkwa nke ọma n’Igbo nke oge a.
- source_word: κάτω κύψας
  choice: hulatara ala
  rationale: Ọ na-egosi omume Jizọs nke ihulata ahụ ya n’ala tupu ma ọ bụ mgbe ọ na-ede ihe.
- source_word: τῷ δακτύλῳ ἔγραφεν εἰς τὴν γῆν
  choice: jiri mkpịsị aka ya na-ede ihe n’ala
  rationale: Ụdị ‘na-ede’ na-egosipụta omume na-aga n’ihu nke imperfect ἔγραφεν; ‘n’ala’ bụ nsụgharị dị ndụ nke εἰς τὴν γῆν n’ọnọdụ a.
- source_word: μὴ προσποιούμενος
  choice: n’eleghị ha anya
  rationale: Nkebi a pụtara ime ka à ga-asị na mmadụ ahụghị ma ọ bụ anụghị ihe a na-eme; okwu Igbo a na-enye echiche nke ịghara itinye uche n’ihe ha na-ekwu n’enweghị ịgbakwunye ‘ịnụghị’ nke adịghị kpọmkwem n’ederede.
