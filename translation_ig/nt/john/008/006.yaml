    reason: textual_critical
  revision_rationale: The revision preserves the Byzantine Greek’s ongoing imperfect actions (“na-ekwu,” “na-ede”), retains the purpose clause and legal accusation, and replaces a visually restricted final phrase with an idiomatic expression for deliberate non-attention. The textual-critical footnote is retained unchanged.
