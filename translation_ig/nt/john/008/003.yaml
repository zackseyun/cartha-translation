  text: Ἄγουσιν δὲ οἱ γραμματεῖς καὶ οἱ Φαρισαῖοι πρὸς αὐτὸν γυναῖκα ἐν μοιχείᾳ κατειλημμένην· καὶ στήσαντες αὐτὴν ἐν μέσῳ,
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/john/008/003.yaml
  text: Then[a] the scribes and the Pharisees brought to him a woman caught in adultery, and having set her in the midst,
translation:
  language: ig
  text: Ma[a] ndị odeakwụkwọ na ndị Farisii kpọtaara ya otu nwaanyị e jidere ka ọ na-akwa iko; ha wee mee ka o guzoro n’etiti ha,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nke a bụ ihe na-aga n’ihu n’akụkọ banyere nwaanyị e jidere ka ọ na-akwa iko (Jọn 7:53–8:11). Lee nkọwa dị na Jọn 7:53.
    reason: textual_critical
lexical_decisions:
- source_word: Ἄγουσιν (ἄγω)
  choice: kpọtaara
  rationale: Okwu Grik dị n’ụdị ugbu a nke a na-eji akọ akụkọ, ma Igbo nkịtị chọrọ ụdị gara aga n’ebe a. “Kpọtaara” na-egosi na ha kpọrọ nwaanyị ahụ bịa n’ebe Jizọs nọ.
- source_word: κατειλημμένην (καταλαμβάνω)
  choice: e jidere ka ọ na-akwa iko
  rationale: Partisipi zuru oke nke a na-eme onye ihe na-egosi na e jidere ya n’omume ahụ; ahịrịokwu Igbo a na-akọwa nke ahụ n’ụzọ doro anya ma dịkwa eke.
- source_word: στήσαντες (ἵστημι)
  choice: ha wee mee ka o guzoro
  rationale: Partisipi a na-egosi na ha kpachapụrụ anya dobe ya ka ọ kwụrụ n’ihu ndị nọ ebe ahụ. “Mee ka o guzoro” na-echekwa echiche nke ime ka onye ọzọ guzo.
- source_word: ἐν μέσῳ (μέσος)
  choice: n’etiti ha
  rationale: N’Igbo, “n’etiti ha” na-egosi n’ụzọ eke na e mere ka nwaanyị ahụ guzo n’etiti ndị gbakọrọ ebe ahụ.
- source_word: γραμματεῖς
  choice: ndị odeakwụkwọ
  rationale: Nke a na-anọchi ndị ọkachamara n’iwu na ndị na-edegharị Akwụkwọ Nsọ; “ndị odeakwụkwọ” bụ aha Baịbụl Igbo a na-aghọta, n’agbanyeghị na ọrụ ha karịrị ide ihe nkịtị.
