  text: ὑμεῖς ποιεῖτε τὰ ἔργα τοῦ πατρὸς ὑμῶν. ⸀εἶπαν αὐτῷ· Ἡμεῖς ἐκ πορνείας ⸂οὐ γεγεννήμεθα⸃· ἕνα πατέρα ἔχομεν τὸν θεόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/041.yaml
  text: You are doing the works of your father.” They said to him[a], “We were not born of sexual immorality; we have one Father—God.”
translation:
  language: ig
  text: Unu na-arụ ọrụ nna unu.” Ha sịrị ya[a], “A mụghị anyị site na mmekọahụ rụrụ arụ; anyị nwere otu Nna—Chineke.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Anyị abụghị ụmụ a mụrụ n'èzí alụmdi na nwunye.” N'okwu Grik kpọmkwem, ọ bụ, “A mụghị anyị site na mmekọahụ rụrụ arụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιεῖτε
  choice: na-arụ
  rationale: Ụdị ngwaa dị ugbu a na-egosi omume na-aga n'ihu; ‘na-arụ’ bụ ụzọ Igbo si kwuo ya n'ụzọ doro anya.
- source_word: τὰ ἔργα
  choice: ọrụ
  rationale: ‘Ọrụ’ na-echekwa njikọ ya na ngwaa ‘na-arụ’ ma kwekọọ n'ojiji Jọn.
- source_word: τοῦ πατρὸς ὑμῶν
  choice: nna unu
  rationale: ‘Nna’ na-echekwa okwu ihe atụ banyere onye ha si n'aka ya nweta àgwà ma hapụkwa esemokwu mmụta okpukpe dị n'amaokwu ahụ.
- source_word: ἐκ πορνείας
  choice: site n'omume rụrụ arụ nke mmekọahụ
  rationale: Nke a na-anọgide nso n'okwu Grik banyere isi n'omume mmekọahụ na-ekwesịghị ekwesị pụta, kama ịkọwa ya ozugbo dịka ịbụ ụmụ a mụrụ n'alụghị di na nwunye.
- source_word: οὐ γεγεννήμεθα
  choice: A mụghị anyị
  rationale: Nke a bụ ntụgharị Igbo dị ndụ ma kwekọọ n'ụdị perfect passive e ji ekwu banyere ọmụmụ.
- source_word: ἕνα πατέρα ἔχομεν
  choice: anyị nwere otu Nna
  rationale: ‘Otu’ na-egosipụta ịdị naanị otu; e dere ‘Nna’ n'isi mkpụrụedemede n'ihi na okwu na-esote na-akọwa ya dịka Chineke.
- source_word: τὸν θεόν
  choice: Chineke
  rationale: Ọ bụ okwu nkọwa na-egosi onye ‘otu Nna’ ahụ bụ; akara ogologo na-egosipụta njikọ ahụ nke ọma.
theological_decisions:
- issue: Ma a ga-akọwa ἐκ πορνείας ozugbo dịka nkwupụta na ha abụghị ụmụ a mụrụ n'alụghị di na nwunye
  choice: Debe okwu ahụ n'ụdị ‘A mụghị anyị site n'omume rụrụ arụ nke mmekọahụ’ n'isi ederede.
  alternative: Anyị abụghị ụmụ a mụrụ n'alụghị di na nwunye.
  rationale: Okwu Grik nwere ike ịpụta ịgọnahụ ọmụmụ iwu na-akwadoghị, ma ọdịdị ya kpọmkwem kwuru banyere ịbụ ndị a mụrụ ‘site na πορνεία.’ Ntụgharị a na-echekwa nghọta abụọ ahụ na esemokwu dị n'okwu ahụ.
translation_notes:
  register: Igbo Izugbe dị ugbu a, nke kwanyere ùgwù ma dị mfe nghọta. E ji ‘omume rụrụ arụ nke mmekọahụ’ mee ka πορνεία doo anya n'enweghị okwu ochie ma ọ bụ nkọwa ụka pụrụ iche.
