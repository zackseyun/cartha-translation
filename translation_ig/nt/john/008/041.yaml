review_pass:
  verdict: revise
  source_fidelity: The draft correctly retains the contrast between Jesus' reference to “your father” and the speakers’ claim that God is their one Father. Its rendering of ἐκ πορνείας is broadly literal, but “omume rụrụ arụ nke mmekọahụ” is an overly expanded and awkward expression that can obscure the birth idiom.
  naturalness: “A mụghị anyị site n'omume rụrụ arụ nke mmekọahụ” is not idiomatic, natural Standard Igbo. “Mmekọahụ rụrụ arụ” is direct, clear, and retains the source’s deliberately noncommittal wording. The footnote’s “n'alụghị di na nwunye” is less precise and can be read as merely unmarried rather than born outside marriage.
  terminology: Use “mmekọahụ rụrụ arụ” for πορνεία in this context without importing a specific explanation into the main text. “Nna—Chineke” appropriately preserves the apposition and its theological force without resolving the dialogue’s polemic.
  issues:
  - severity: medium
    issue: Awkward expansion of πορνεία
    rationale: “omume rụrụ arụ nke mmekọahụ” is a cumbersome paraphrase rather than a natural rendering of “sexual immorality.” “mmekọahụ rụrụ arụ” is more idiomatic and source-close.
  - severity: low
    issue: Footnote alternative is imprecise
    rationale: “ụmụ a mụrụ n'alụghị di na nwunye” is not the clearest Standard Igbo expression for illegitimate/out-of-wedlock birth. “ụmụ a mụrụ n'èzí alụmdi na nwunye” conveys the interpretive alternative accurately.
  revised_text: Unu na-arụ ọrụ nna unu.” Ha sịrị ya[a], “A mụghị anyị site na mmekọahụ rụrụ arụ; anyị nwere otu Nna—Chineke.”
