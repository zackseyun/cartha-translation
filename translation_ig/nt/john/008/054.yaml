  source_fidelity: 'The translation accurately reflects the SBLGNT: the conditional self-glorification clause, the assertion that such glory is nothing, the Father as the one glorifying Jesus, and the relative clause identifying him as the one whom the hearers call “our God.” The main text correctly follows ἡμῶν (“our”), while the footnote preserves the ὑμῶν (“your”) variant.'
