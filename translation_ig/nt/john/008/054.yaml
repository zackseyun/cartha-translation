id: JHN.8.54
reference: John 8:54
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς· Ἐὰν ἐγὼ ⸀δοξάσω ἐμαυτόν, ἡ δόξα μου οὐδέν ἐστιν· ἔστιν ὁ πατήρ μου ὁ δοξάζων με, ὃν ὑμεῖς λέγετε ὅτι θεὸς ⸀ἡμῶν ἐστιν,
base_translation:
  language: en
  yaml_path: translation/nt/john/008/054.yaml
  text: Jesus answered[a], “If I glorify myself, my glory is nothing. My Father is the one who glorifies me, he whom you say is our God,”
translation:
  language: ig
  text: Jizọs zara[a], “Ọ bụrụ na m enye onwe m otuto, otuto m abụghị ihe ọ bụla. Nna m bụ onye na-enye m otuto, onye unu na-ekwu na ọ bụ Chineke anyị,”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ụfọdụ akwụkwọ aka ochie na-agụ “Chineke unu” kama “Chineke anyị.”
    reason: textual_variant
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: zara
  rationale: Ọ bụ okwu Igbo a na-ejikarị akọ nzaghachi n'ime mkparịta ụka, ma kwekọọ na ἀποκρίνομαι.
- source_word: δοξάσω / ὁ δοξάζων με
  choice: enye ... otuto / na-enye m otuto
  rationale: “Inye otuto” na-edobe echiche δοξάζω nke inye ebube ma ọ bụ otuto, ma bụrụkwa okwu doro ndị Igbo nke oge a anya.
- source_word: ἡ δόξα μου οὐδέν ἐστιν
  choice: otuto m abụghị ihe ọ bụla
  rationale: Nsụgharị a na-esochi usoro na ike okwu Grik ahụ nke ọma, n'enweghị ịgbakwunye nkọwa dịka ‘ọ baghị uru.’
- source_word: ὁ πατήρ μου
  choice: Nna m
  rationale: Ọ bụ nsụgharị kwụ ọtọ na nke ebumpụta ụwa maka aha mmekọrịta Jizọs ji kpọọ Chineke n'ebe a.
- source_word: ὃν ὑμεῖς λέγετε ὅτι θεὸς ἡμῶν ἐστιν
  choice: onye unu na-ekwu na ọ bụ Chineke anyị
  rationale: Ọ na-edobe nkebi ahịrịokwu nke nnọchiaha ὃν, okwu Jizọs gwara ndị na-emegide ya ozugbo, na ọgụgụ SBLGNT ἡμῶν.
- source_word: θεὸς
  choice: Chineke
  rationale: N'ebe a, okwu ahụ na-ezo aka n'ebe Chineke Izrel nọ; “Chineke” bụ aha Igbo a nabatara nke ọma.
- source_word: ἡμῶν
  choice: anyị
  rationale: A gbasoro ọgụgụ isi ederede SBLGNT, ἡμῶν (‘anyị’), ebe e debere ọgụgụ ọzọ n'okpuru amaokwu.
theological_decisions:
- issue: Nnọchiaha dị na θεὸς ἡμῶν/ὑμῶν ἐστιν
  choice: Chineke anyị
  alternative: Chineke unu
  rationale: Isi ederede gbasoro SBLGNT nke nwere ἡμῶν (‘anyị’). Ebe ụfọdụ akwụkwọ aka ochie nwere ὑμῶν (‘unu’), e tinyere nke ahụ n'ala peeji kama ikpebi esemokwu ederede ahụ n'ime nsụgharị.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ugwu ma dị mfe nghọta. E debere nkwughachi “otuto” iji mee ka isiokwu δοξάζω/δόξα pụta ìhè, ma zere okwu ga-akọwa ihe karịrị ihe Grik kwuru.
