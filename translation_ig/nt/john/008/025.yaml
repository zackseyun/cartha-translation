  text: ἔλεγον οὖν αὐτῷ· Σὺ τίς εἶ; ⸀εἶπεν αὐτοῖς ὁ Ἰησοῦς· Τὴν ἀρχὴν ⸂ὅ τι⸃ καὶ λαλῶ ὑμῖν;
base_translation:
  language: en
  yaml_path: translation/nt/john/008/025.yaml
  text: So they were saying to him, “Who are you?” Jesus said to them, “Just what I have been telling you from the beginning.”
translation:
  language: ig
  text: Ya mere, ha nọ na-ajụ ya, sị, “Ònye ka ị bụ?” Jizọs sịrị ha, “Ọ bụ kpọmkwem ihe m na-agwa unu site ná mmalite.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ: “Gịnị mere m ji na-agwa unu okwu ma ọlị?” Nhazi okwu Grik ebe a edochaghị anya.'
    reason: Iji chekwaa mgbagwoju anya dị n’ezi ihe odide Grik, nke nwere ike inwe nghọta ọzọ dị nnọọ iche.
lexical_decisions:
- source_word: ἔλεγον
  choice: ha jụrụ ya
  rationale: Ọ bụ ezie na okwu ahụ pụtara n'ụzọ nkịtị ‘ha nọ na-asị,’ n’ebe a ihe ha kwuru bụ ajụjụ; ‘ha jụrụ ya’ bụ Igbo eke ma na-edobe omume na-aga n’ihu n’akụkọ ahụ n’enweghị ibu okwu na-adịghị mkpa.
- source_word: Σὺ τίς εἶ;
  choice: Ị bụ onye?
  rationale: Nke a na-ebufe nkwusi ike dị na Σὺ n’ụzọ Igbo dị mfe ma doo anya.
- source_word: Τὴν ἀρχὴν
  choice: site ná mmalite
  rationale: Ahịrịokwu Grik a nwere ike igosi oge—‘site ná mmalite’—ma nke ahụ dabara n’otú Jizọs si ekwu na Jọn 8; e debere nkọwa ọzọ n’ala peeji.
- source_word: ὅ τι καὶ λαλῶ ὑμῖν
  choice: kpọmkwem ihe m nọ na-agwa unu
  rationale: ‘Kpọmkwem’ na-egosipụta ike καὶ n’usoro ahịrịokwu a, ebe ‘m nọ na-agwa unu’ na-egosipụta λαλῶ dị ka okwu ọ ka na-ekwu ha.
theological_decisions:
- issue: Ihe Jizọs kwuru banyere onye ọ bụ
  choice: Ọ bụ kpọmkwem ihe m nọ na-agwa unu site ná mmalite.
  alternative: Gịnị mere m ji na-agwa unu okwu ma ọlị?
  rationale: Nhazi okwu Grik siri ike ma nwee ọtụtụ ụzọ e si ghọta ya. Isi nsụgharị na-agbaso nghọta a na-ahụkarị nke na-ejikọta azịza Jizọs na ihe ọ nọ na-agwa ha kemgbe mmalite, ma ala peeji na-echekwa ezigbo nghọta ọzọ n’enweghị idozi esemokwu ahụ n’ụzọ ozizi.
translation_notes:
  register: Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ ‘Jizọs’ dịka nsụpe a na-ahụkarị n’Igbo. Akara ala peeji [a] dị n’isi ederede dịka achọrọ.
