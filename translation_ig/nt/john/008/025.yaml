  verdict: revise
  source_fidelity: The main rendering follows a well-attested temporal reading of Τὴν ἀρχὴν ὅ τι καὶ λαλῶ ὑμῖν and appropriately retains the substantially different alternative in a footnote. However, the imperfect ἔλεγον is better represented by an ongoing/repeated question than by the simple perfective past “ha jụrụ.”
