    text: Ma ọ bụ, “mkpụrụ Ebreham,” ya bụ, ndị sitere n’agbụrụ Ebreham.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “okwu m ahụghị ohere n’ime unu.”
    reason: lexical_alternative
  revision_rationale: The revision replaces the unnatural “ọnọdụ” with “ohere” to express the Greek image of the word having no room or reception in the hearers. It also regularizes Abraham’s name to the conventional Igbo biblical spelling, without affecting the genealogical sense. The alternative footnote is retained because it reflects the verbal nuance of χωρεῖ.
