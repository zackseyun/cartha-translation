  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οἶδα ὅτι σπέρμα Ἀβραάμ ἐστε· ἀλλὰ ζητεῖτέ με ἀποκτεῖναι, ὅτι ὁ λόγος ὁ ἐμὸς οὐ χωρεῖ ἐν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/037.yaml
  text: I know that you are Abraham’s offspring[a]; but you are seeking to kill me[b], because my word has no place in you.
translation:
  language: ig
  text: Ama m na unu bụ ụmụ Ebreham[a]; ma unu na-achọ igbu m, n’ihi na okwu m enweghị ohere n’ime unu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “mkpụrụ Ebreham,” ya bụ, ndị sitere n’agbụrụ Ebreham.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “okwu m ahụghị ohere n’ime unu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: σπέρμα Ἀβραάμ
  choice: ụmụ Abraham
  rationale: N’Igbo, “ụmụ Abraham” bụ ụzọ ebumpụta ụwa isi kọwaa ụmụ sitere n’agbụrụ Abraham; ọ na-edobe echiche mkpokọta nke σπέρμα n’enweghị itinye echiche nke ịbụ ụmụ ya n’ụzọ ime mmụọ n’amaokwu a.
- source_word: ζητεῖτέ με ἀποκτεῖναι
  choice: unu na-achọ igbu m
  rationale: “Na-achọ igbu m” na-egosipụta omume na-aga n’ihu ma na-edobe ike nke ζητέω tinyere infinitive n’enweghị ịkọwa ebumnobi ha karịa ihe Grik kwuru.
- source_word: ὁ λόγος ὁ ἐμὸς
  choice: okwu m
  rationale: “Okwu m” bụ nsụgharị kwụ ọtọ ma dịkwa ebumpụta ụwa nke λόγος; ọ na-echekwa ụzọ pụrụ iche Jọn si eji okwu a eme ihe karịa “ozi m.”
- source_word: οὐ χωρεῖ ἐν ὑμῖν
  choice: enweghị ọnọdụ n’ime unu
  rationale: Nhọrọ a na-echekwa ihe atụ nke okwu ahụ enweghị ohere ma ọ bụ nnabata n’ime ha, n’emebighị ọtụtụ echiche χωρέω nwere ike ibu.
- source_word: ἀλλὰ
  choice: ma
  rationale: “Ma” na-egosi ọdịiche siri ike dị n’etiti ịbụ ndị sitere n’agbụrụ Abraham na ịchọ igbu Jizọs.
- source_word: οἶδα ὅτι
  choice: Ama m na
  rationale: Nke a bụ ụzọ doro anya ma dịkwa ebumpụta ụwa n’Igbo isi webata nkebiokwu na-akọ ihe onye ahụ maara.
theological_decisions:
- issue: Mmekọrịta dị n’etiti ịbụ ndị sitere n’agbụrụ Abraham na ịdị ka Abraham n’ezie
  choice: A sụgharịrị σπέρμα Ἀβραάμ dị ka “ụmụ Abraham” n’echiche nke agbụrụ anụ ahụ.
  alternative: “mkpụrụ Abraham” ma ọ bụ ịkọwa ya dị ka ụmụ Abraham n’ụzọ ime mmụọ
  rationale: N’ọnọdụ okwu a, Jizọs kwetara na ha sitere n’agbụrụ Abraham, ma ọ katọrọ omume ha. Nsụgharị ahụ na-ahapụ esemokwu nkà mmụta okpukpe a ka amaokwu ndị gbara ya gburugburu kọwaa ya.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta mee ihe. “Unu” na-egosipụta na Jizọs na-agwa ọtụtụ mmadụ okwu. E debere “okwu m” iji chekwaa okwu Jọn ji eme ihe, ebe “enweghị ọnọdụ n’ime unu” na-echekwa ihe atụ nke χωρέω.
