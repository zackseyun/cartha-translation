  text: Ọzọkwa[a], ọ hulatara ala, na-ede ihe n’ala.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nke a na-aga n’ihu n’akụkọ banyere nwanyị e jidere ka ọ na-akwa iko (Jọn 7:53–8:11). Lee nkọwa dị na Jọn 7:53.
    reason: textual_critical
lexical_decisions:
- source_word: πάλιν
  choice: Ọzọkwa
  rationale: Ọ na-egosi na Jizọs mere otu ihe ahụ ọzọ; okwu a na-aga nke ọma n’akụkọ Igbo.
- source_word: κάτω κύψας
  choice: ọ hulatara ala
  rationale: Ngwakọta κάτω na κύψας na-akọwa ihulata ahụ gaa n’ala. ‘Hulatara ala’ bụ okwu Igbo doro anya ma dịkwa eke.
- source_word: ἔγραφεν
  choice: na-ede ihe
  rationale: Ụdị imperfect nke γράφω nwere ike igosi omume na-aga n’ihu. ‘Na-ede ihe’ na-echekwa akụkụ ahụ n’Igbo n’enweghị ịkọwa ihe a na-ede, ebe Grik ekwughị ya.
- source_word: εἰς τὴν γῆν
  choice: n’ala
  rationale: N’ọnọdụ a, γῆ bụ elu ala dị n’ihu ya; ‘n’ala’ bụ nsụgharị Igbo dị mfe ma kwekọọ n’ihe a na-ekwu.
