source:
  edition: SBLGNT
  text: καὶ ὁ πέμψας με μετ’ ἐμοῦ ἐστιν· οὐκ ἀφῆκέν με ⸀μόνον, ὅτι ἐγὼ τὰ ἀρεστὰ αὐτῷ ποιῶ πάντοτε.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/029.yaml
  text: And the one who sent me is with me[a]. He has not left me alone[b], because I always do what is pleasing to him.
translation:
  language: ig
  text: Onye ahụ zitere m nọnyere m. Ọ hapụghị m naanị m, n’ihi na ana m eme ihe ndị na-amasị ya mgbe niile.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ πέμψας με
  choice: Onye ahụ zitere m
  rationale: Nkebiokwu a bụ participle e ji mee aha onye; nsụgharị a na-edobe ụzọ Jọn si kpọọ Nna ahụ ‘onye zitere m’ n’etinyeghị ‘Nna’ n’amaokwu ahụ.
- source_word: μετ’ ἐμοῦ ἐστιν
  choice: nọnyekwaara m
  rationale: μετά ya na genitive na-egosi ịnọnyere mmadụ. ‘Nọnyekwaara m’ bụ okwu Igbo dị ndụ nke na-egosi na onye ahụ nọnyere Jizọs, ebe ‘kwa’ na-egosikwa καί.
- source_word: οὐκ ἀφῆκέν με μόνον
  choice: Ọ hapụghị m naanị m
  rationale: ἀφίημι n’ebe a pụtara ịhapụ mmadụ, μόνον na-akọwakwa ọnọdụ onye ahụ dị ka ịnọ naanị ya. Oge ngwaa Igbo a na-ekwupụta ihe a na-emeghị ma na-ekwe ka ihe ọ pụtara ugbu a nọgide.
- source_word: ὅτι
  choice: n’ihi na
  rationale: N’ebe a ὅτι na-eweta ihe kpatara o ji bụrụ na onye zitere Jizọs ahapụghị ya naanị ya.
- source_word: τὰ ἀρεστὰ αὐτῷ
  choice: ihe ndị na-atọ ya ụtọ
  rationale: Nke a na-edobe ọdịdị plural nke okwu Grik ahụ—‘ihe ndị na-amasị ya’—ma bụrụkwa Igbo nkịtị na nke doro anya.
- source_word: ποιῶ πάντοτε
  choice: ana m eme ... mgbe niile
  rationale: ‘Ana m eme’ na-egosi omume na-aga n’ihu ma ọ bụ nke a na-eme mgbe nile; ‘mgbe niile’ na-ebute ike πάντοτε nke ọma.
theological_decisions:
- issue: Onye ὁ πέμψας με na-ezo aka na ya
  choice: E debere ya dịka ‘Onye ahụ zitere m,’ n’agbanyeghị na ihe gbara amaokwu ahụ gburugburu na-egosi na ọ bụ Nna.
  alternative: Ịsụgharị ya ‘Nna ahụ zitere m.’
  rationale: Okwu Grik akpọghị ‘Nna’ kpọmkwem n’amaokwu a. Idebe okwu mmekọrịta a na-echekwa ụdị okwu Jọn ma zere itinye nkọwa n’ime ederede.
- issue: Mmekọrịta dị n’etiti ὅτι na okwu bu ya ụzọ
  choice: A sụgharịrị ὅτι ‘n’ihi na,’ ya bụ na ọ na-enye ihe kpatara onye zitere Jizọs ji ghara ịhapụ ya naanị ya.
  alternative: Ịsụgharị ya dịka ‘na’ ma were ya dị ka okwu na-akọwa ọdịnaya.
  rationale: N’usoro ahịrịokwu a, nghọta nke ihe kpatara ya bụ nke kacha kwekọọ na syntax na arụmụka okwu ahụ, ma e kwesịghị ime ka ọ bụrụ nkwupụta ozizi karịrị ihe ederede kwuru.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ ‘nọnyekwaara m’ iji gosi ọnụnọ na-aga n’ihu na ‘ihe ndị na-atọ ya ụtọ’ iji chekwaa plural nke τὰ ἀρεστά n’enweghị asụsụ siri ike.
