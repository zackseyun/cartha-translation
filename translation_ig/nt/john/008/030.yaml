  text: As he was saying these things[b][a], many believed in him.
translation:
  language: ig
  text: Ka ọ na-ekwu ihe ndị a[a], ọtụtụ ndị kweere na ya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Mgbe ọ na-ekwu ihe ndị a.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ọtụtụ ndị tụkwasịrị ya obi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα
  choice: ihe ndị a
  rationale: Nke a na-edobe ụdị ọtụtụ nke okwu Grik ma na-ezo aka n’ihe Jizọs kwuru tupu amaokwu a.
- source_word: αὐτοῦ λαλοῦντος
  choice: Mgbe ọ ka na-ekwu
  rationale: Genitive absolute nwere participle nke oge ugbu a na-egosi na nkwere ha mere n’otu oge ahụ ọ nọ na-ekwu okwu; ‘ka na-ekwu’ na-egosikwa na okwu ahụ ka na-aga n’ihu.
- source_word: πολλοὶ
  choice: ọtụtụ ndị
  rationale: Adjective a na-arụ ọrụ dị ka aha, ya bụ ọtụtụ mmadụ; ‘ọtụtụ ndị’ bụ ụzọ Igbo nkịtị si kwuo ya n’enweghị ịkọwa ndị ahụ karịa isi mmalite.
- source_word: ἐπίστευσαν
  choice: kweere
  rationale: Aorist indicative na-egosi ihe omume ahụ n’ozuzu ya; ‘kweere’ na-edobe okwu okwukwe/nkwere n’enweghị itinye nkọwa banyere usoro ha si malite ikwere.
- source_word: εἰς αὐτόν
  choice: na ya
  rationale: N’Igbo, ‘ikwere na ya’ bụ okwu ebumpụta ụwa maka ntụkwasị obi e tinyere n’ime mmadụ, ọ bụghị naanị ikwere na ihe onye ahụ kwuru bụ eziokwu.
theological_decisions:
- issue: Nsụgharị πιστεύω εἰς αὐτόν n’ụzọ Jọn si eji ya
  choice: kweere na ya
  alternative: tụkwasịrị ya obi
  rationale: ‘Kweere na ya’ na-echekwa ma asụsụ nkwere/okwukwe ma ntụziaka nke ntụkwasị obi ahụ n’ebe Jizọs nọ. ‘Tụkwasịrị ya obi’ na-eme ka akụkụ ntụkwasị obi pụta ìhè, ma ọ nwere ike ime ka okwu ahụ bụrụ nkọwa karịa ka isi mmalite si dị.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. ‘Mgbe ọ ka na-ekwu’ na-egosipụta omume na-aga n’ihu, ebe ‘kweere na ya’ na-edobe ike mmekọrịta na nke okwukwe dị na πιστεύω εἰς.
