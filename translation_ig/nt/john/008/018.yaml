  text: ἐγώ εἰμι ὁ μαρτυρῶν περὶ ἐμαυτοῦ καὶ μαρτυρεῖ περὶ ἐμοῦ ὁ πέμψας με πατήρ.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/018.yaml
  text: I am the one who testifies about myself[a], and the Father who sent me testifies about me.
translation:
  language: ig
  text: Abụ m onye na-agba akaebe banyere onwe m[a]; Nna ahụ nke zitere m na-agba akaebe banyere m.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, ‘na-agba ama banyere onwe m ... na-agba ama banyere m.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγώ εἰμι ὁ μαρτυρῶν
  choice: Abụ m onye na-agba akaebe
  rationale: 'Nkebi a na-egosi onye ahụ n''ụzọ doro anya: ‘Abụ m onye na-agba akaebe.’ Ọ na-edobe ọrụ participle nwere article ma jiri okwu Igbo a na-eji eme ihe n''ọnọdụ akaebe.'
- source_word: περὶ ἐμαυτοῦ
  choice: banyere onwe m
  rationale: ‘Banyere’ na-enye echiche περί ya na genitive, ‘gbasara/concerning,’ ebe ‘onwe m’ na-edobe reflexive ahụ n’enweghị itinyekwu echiche ‘n’ihi onwe m.’
- source_word: μαρτυρεῖ
  choice: na-agbakwa akaebe
  rationale: E jikwa otu okwu ahụ e ji sụgharịa μαρτυρῶν ka njikọ okwu akaebe dị n’amaokwu ahụ ghara ifu; ‘-kwa’ na-egosi njikọ καί.
- source_word: περὶ ἐμοῦ
  choice: banyere m
  rationale: Nke a bụ ụzọ Igbo dị mfe ma kwekọọ n’isiokwu ahụ iji kwuo ‘about me/concerning me.’
- source_word: ὁ πέμψας με πατήρ
  choice: Nna ahụ zitere m
  rationale: Nkebi relative a na-edobe ‘Nna’ na onye zitere Jizọs dịka Grik si kwuo ya, n’etinyeghị ‘Nna m’ ma ọ bụ ‘Chineke Nna,’ ndị na-adịghị kpọmkwem n’ederede.
theological_decisions:
- issue: Onye ‘Nna’ na-ezo aka n’ebe a
  choice: Nna ahụ zitere m
  alternative: Nna m zitere m; Chineke bụ Nna zitere m
  rationale: Grik kwuru ‘Nna ahụ zitere m.’ Nsụgharị a na-edobe mmekọrịta na nkwupụta nkà mmụta okpukpe dị n’amaokwu ahụ ma ghara ịgbakwunye okwu nkọwa na-adịghị na ya.
- issue: Ike okwu akaebe dịka nke ụlọikpe
  choice: na-agba akaebe ... na-agbakwa akaebe
  alternative: na-agba ama ... na-agbakwa ama
  rationale: ‘Ịgba akaebe’ bụ okwu Igbo doro anya nke na-echekwa echiche ịgba ama n’ọnọdụ iwu ma na-edobe nkwughachi μαρτυρέω ugboro abụọ.
translation_notes:
  register: Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ ‘ịgba akaebe’ maka okwu akaebe nke yiri asụsụ ụlọikpe; e debere ntụgharị okwu ọzọ ‘ịgba ama’ n’ala ala peeji.
