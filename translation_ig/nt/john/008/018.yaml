    issue: The relative relationship in “ὁ πέμψας με πατήρ” is not explicitly marked.
    rationale: The current wording, “Nna ahụ zitere m na-agbakwa akaebe,” lacks the relative marker needed in natural Standard Igbo. “Nna ahụ nke zitere m” clearly means “the Father who sent me” and avoids a misleading coordinate reading.
  revised_text: Abụ m onye na-agba akaebe banyere onwe m[a]; Nna ahụ nke zitere m na-agba akaebe banyere m.
