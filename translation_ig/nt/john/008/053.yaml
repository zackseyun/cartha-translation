id: JHN.8.53
reference: John 8:53
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: μὴ σὺ μείζων εἶ τοῦ πατρὸς ἡμῶν Ἀβραάμ, ὅστις ἀπέθανεν; καὶ οἱ προφῆται ἀπέθανον· τίνα ⸀σεαυτὸν ποιεῖς;
base_translation:
  language: en
  yaml_path: translation/nt/john/008/053.yaml
  text: Surely you are not greater than our father Abraham[a], who died? The prophets also died[b]. Who do you make yourself out to be?
translation:
  language: ig
  text: Ị̀ bụghị onye ka nna anyị Ebreham, bụ́ onye nwụrụ, ukwuu?[a] Ndị amụma nwụkwara. Ònye ka ị na-eme onwe gị ka ị bụrụ?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ajụjụ Grik a ji okwu na-atụ anya azịza “mba”; ya bụ, “N’ezie, ị bụghị onye ka nna anyị Ebreham ukwuu, bụ́ onye nwụrụ, ọ̀ bụ ya?”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “Ònye ka ị na-azọrọ na ị bụ?”
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ σὺ
  choice: N'ezie, ị ka ...?
  rationale: Ajụjụ a ji μή malite na-atụ anya azịza na-adịghị mma. “N'ezie” na ajụjụ ahụ na-egosipụta nkwulu na olileanya ha na Jizọs agaghị ekwu na ọ ka Ebreham ukwuu.
- source_word: μείζων
  choice: ka ... ukwuu
  rationale: Nke a na-edobe echiche sara mbara nke ịdị ukwuu n'ọkwa na mkpa, n'ebughị ụzọ kpebie kpọmkwem ụdị ịdị ukwuu a na-ekwu maka ya.
- source_word: τοῦ πατρὸς ἡμῶν Ἀβραάμ
  choice: nna anyị Ebreham
  rationale: “Nna anyị” na-egosipụta ma njikọ agbụrụ ndị Juu na Ebreham ma nsọpụrụ ha na-enye ya.
- source_word: ὅστις ἀπέθανεν
  choice: Ọ nwụrụ
  rationale: 'Oge aorist na-ezo aka n''eziokwu mere n''akụkọ ihe mere eme: Ebreham nwụrụ.'
- source_word: καὶ οἱ προφῆται ἀπέθανον
  choice: Ndị amụma nwụkwara
  rationale: “-kwara” na-egosipụta ka καί si tinye ọnwụ ndị amụma dịka ihe atụ ọzọ yiri nke Ebreham.
- source_word: τίνα σεαυτὸν ποιεῖς
  choice: Ònye ka ị na-eme onwe gị ka ị bụrụ?
  rationale: 'Nke a na-edobe ọdịdị okwu Grik ahụ ma na-enye nghọta ebubo ya: ònye ka onye ahụ na-ekwu na ya bụ?'
theological_decisions:
- issue: Ajụjụ ịma aka banyere ma Jizọs ọ̀ ka Ebreham na ndị amụma ukwuu
  choice: E depụtara ya dịka ajụjụ mmegide nke na-atụ anya azịza “mba.”
  alternative: Ị̀ ka nna anyị Ebreham ukwuu?
  rationale: μή na-egosi na ndị na-ekwu okwu chere na azịza ya kwesịrị ịbụ nke na-adịghị mma. Nsụgharị ahụ na-edobe esemokwu banyere onye Jizọs bụ n'ekpebighị ya n'okwu a.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. “Nwụkwara” bụ usoro ebumpụta ụwa iji jikọta ọnwụ ndị amụma na nke Ebreham; akara ajụjụ na “N'ezie” na-eburu ụda mmegide nke μή.
