- from: N'ezie, ị ka nna anyị Ebreham ukwuu? Ọ nwụrụ[a]. Ndị amụma nwụkwara. Ònye ka ị na-eme onwe gị ka ị bụrụ?[b]
  to: Ị̀ bụghị onye ka nna anyị Ebreham, bụ́ onye nwụrụ, ukwuu?[a] Ndị amụma nwụkwara. Ònye ka ị na-eme onwe gị ka ị bụrụ?[b]
  rationale: The main correction restores the negative rhetorical orientation of μή while keeping the comparative deliberately broad. The wording continues to state simply that Abraham died and that the prophets also died, and it preserves the accusatory force of τίνα σεαυτὸν ποιεῖς without adding a theological answer.
