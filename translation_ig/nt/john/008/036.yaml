id: JHN.8.36
reference: John 8:36
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐὰν οὖν ὁ υἱὸς ὑμᾶς ἐλευθερώσῃ, ὄντως ἐλεύθεροι ἔσεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/036.yaml
  text: So if the Son sets you free[a], you will be truly free.
translation:
  language: ig
  text: Ya mere, ọ bụrụ na Ọkpara ahụ emee ka unu nwee onwe unu, unu ga-enwe onwe unu n’ezie.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “unu ga-abụ ndị nwere onwe unu n’ezie.” Okwu Grik ahụ na-emesi ike na nnwere onwe a bụ nke bụ eziokwu ma zuo oke.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν οὖν
  choice: Ya mere, ọ bụrụ na
  rationale: “Ọ bụrụ na” na-egosi ọnọdụ ahụ, ebe “Ya mere” na-egosi na okwu a bụ nkwubi okwu sitere n’ihe e kwuru tupu ya.
- source_word: ὁ υἱὸς
  choice: Ọkpara ahụ
  rationale: N’ọnọdụ okwu Jọn a, okwu ahụ bụ aha nsọpụrụ e ji akọwa Jizọs kpọmkwem, ọ bụghị naanị otu nwa nwoke.
- source_word: ὑμᾶς
  choice: unu
  rationale: Nnọchiaha Grik a bụ nke onye nke abụọ n’ụbara; “unu” na-egosipụta nke a kpọmkwem n’Igbo.
- source_word: ἐλευθερώσῃ
  choice: emee ka unu nwere onwe unu
  rationale: Nke a bụ ụzọ Igbo doro anya ma bụrụkwa nke e ji eme ihe ugbu a iji kwuo omume nke ịtọ mmadụ n’ọnọdụ nnwere onwe.
- source_word: ὄντως
  choice: n’ezie
  rationale: “N’ezie” na-emesi ike na nnwere onwe a bụ nke bụ eziokwu n'ezie, dịka adverb Grik ahụ si eme.
- source_word: ἐλεύθεροι
  choice: nwere onwe unu
  rationale: Nke a na-akọwa ọnọdụ ga-esi n’omume ahụ pụta, ọ bụghị nanị omume nke ịtọhapụ.
- source_word: ἔσεσθε
  choice: unu ga-enwe
  rationale: “Ga-” na-echekwa ihe ọdịnihu nke ngwaa Grik ahụ n’asụsụ Igbo nke oge a.
theological_decisions:
- issue: Onye a kpọrọ “Ọkpara ahụ”
  choice: Aha nsọpụrụ na-ezo aka na Jizọs dịka Ọkpara ahụ pụrụ iche
  alternative: Nwa nwoke nkịtị ma ọ bụ otu ọkpara n’ozuzu
  rationale: N’ọnọdụ okwu Oziọma Jọn, “Ọkpara ahụ” bụ akụkụ nke okwu Jizọs banyere ọnọdụ ya na ikike ya; nsụgharị ahụ echekwala aha nsọpụrụ a n’enweghị ịgbakwunye nkọwa ozizi ọzọ.
- issue: Ụdị nnwere onwe a na-ekwu maka ya
  choice: Nnwere onwe nke bụ eziokwu n’ụzọ zuru ezu, n’enweghị ime ka ihe ọ pụtara bụrụ naanị otu ụdị nnwere onwe
  alternative: Naanị nnwere onwe ime mmụọ ma ọ bụ naanị nnwere onwe ọha na eze
  rationale: Ọnọdụ okwu dị nso na-ekwu maka ịbụ ohu mmehie, ma amaokwu a n’onwe ya kwuru n’ụzọ sara mbara. “N’ezie” na-echekwa ịdị arọ nke okwu ahụ n’enweghị ikpebi ihe niile ọ gụnyere.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “Unu” na-echekwa ụbara nke nnọchiaha Grik, ebe “Ọkpara ahụ” na-egosipụta aha nsọpụrụ dị n’ọnọdụ okwu Jọn.
