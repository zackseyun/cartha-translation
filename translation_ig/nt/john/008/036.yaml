    issue: Unidiomatic verb form after «emee ka»
    rationale: The text says «emee ka unu nwere onwe unu». Following «mee ka», the form should be «nwee» in this Standard Igbo construction. Without this correction, the clause is grammatically awkward.
  revised_text: Ya mere, ọ bụrụ na Ọkpara ahụ emee ka unu nwee onwe unu, unu ga-enwe onwe unu n’ezie.[a]
