review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the response, Abrahamic lineage claim, perfect negated δουλεύω, and the future change-of-state sense in γενήσεσθε. However, “ụmụ ụmụ Ebraham” normally suggests grandchildren and is less precise here than a general collective lineage expression. The clause “ọ dịghịkwa onye ọ bụla anyị bụtụrụ ohu” is also syntactically awkward for the Greek claim that they have never been enslaved to anyone.
  naturalness: 'The revised wording uses idiomatic Standard Igbo: “anyị abụtụbeghị ohu onye ọ bụla” naturally expresses never having been anyone’s slave, while “ụmụ Ebreham” communicates claimed descent without the misleading specificity of “grandchildren.”'
  terminology: “ohu” appropriately retains the bondage/slavery contrast in the immediate context. “ndị nweere onwe ha” and “ga-aghọ” accurately retain freedom and the prospective transition. The conventional Standard Igbo biblical form “Ebreham” is used consistently.
  issues:
  - severity: medium
    issue: “ụmụ ụmụ Ebraham” is over-specific.
    rationale: This expression ordinarily means “Abraham’s grandchildren,” whereas σπέρμα is a collective designation for Abraham’s offspring/descendants.
  - severity: medium
    issue: The slavery clause is awkwardly formed.
    rationale: “ọ dịghịkwa onye ọ bụla anyị bụtụrụ ohu” does not express the relation to “anyone” as naturally as “anyị abụtụbeghị ohu onye ọ bụla.”
  - severity: low
    issue: Name spelling should be standardized as “Ebreham.”
    rationale: “Ebreham” is the conventional Standard Igbo biblical rendering of Abraham and should be used in the text and note.
  revised_text: Ha zara ya, sị, “Anyị bụ ụmụ Ebreham[a], anyị abụtụbeghịkwa ohu onye ọ bụla[b]. Olee otú i si asị, ‘Unu ga-aghọ ndị nweere onwe ha’[c]?”
