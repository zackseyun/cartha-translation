revisions:
- from: Ha zara ya, sị, “Anyị bụ ụmụ ụmụ Ebraham[a], ọ dịghịkwa onye ọ bụla anyị bụtụrụ ohu[b]. Olee otú i si asị, ‘Unu ga-aghọ ndị nweere onwe ha’[c]?”
  to: Ha zara ya, sị, “Anyị bụ ụmụ Ebreham[a], anyị abụtụbeghịkwa ohu onye ọ bụla[b]. Olee otú i si asị, ‘Unu ga-aghọ ndị nweere onwe ha’[c]?”
  rationale: The revision replaces a term liable to mean “grandchildren” with a natural collective expression for Abrahamic descent, recasts the negated perfect slavery claim into idiomatic Igbo, and standardizes the proper name. It preserves the source’s rhetorical question, its slavery/free contrast, and the “become free” force of γενήσεσθε. Footnote markers remain attached to their relevant expressions.
