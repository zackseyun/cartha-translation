id: JHN.8.33
reference: John 8:33
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀπεκρίθησαν ⸂πρὸς αὐτόν⸃· Σπέρμα Ἀβραάμ ἐσμεν καὶ οὐδενὶ δεδουλεύκαμεν πώποτε· πῶς σὺ λέγεις ὅτι Ἐλεύθεροι γενήσεσθε;
base_translation:
  language: en
  yaml_path: translation/nt/john/008/033.yaml
  text: They answered him[a], “We are Abraham’s offspring and have never been enslaved to anyone. How can you say[c][b], ‘You will become free’?”
translation:
  language: ig
  text: Ha zara ya, sị, “Anyị bụ ụmụ Ebreham[a], anyị abụtụbeghịkwa ohu onye ọ bụla[b]. Olee otú i si asị, ‘Unu ga-aghọ ndị nweere onwe ha’[c]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “mkpụrụ Ebreham.” Okwu Grik ahụ bụ otu mkpụrụokwu nchịkọta maka ụmụ sitere n’Ebreham n’anụ ahụ.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “anyị ejebeghị onye ọ bụla ozi.” Ngwaa Grik ahụ pụrụ ịpụta ijere mmadụ ozi, ma n’ọnọdụ a echiche nke ịbụ ohu ma ọ bụ ịnọ n’agbụ ka pụta ìhè.
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “Unu ga-enwe onwe unu.” N’ụzọ kpọmkwem, okwu Grik ahụ sịrị, “Unu ga-aghọ ndị nweere onwe ha.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθησαν πρὸς αὐτόν
  choice: Ha zara ya, sị
  rationale: Nke a bụ ụzọ Igbo nkịtị si egosi na ha zara Jizọs okwu ozugbo; “sị” na-ebute okwu ha kwuru nke ọma.
- source_word: Σπέρμα Ἀβραάμ
  choice: ụmụ ụmụ Ebraham
  rationale: N'Igbo, okwu a na-egosi ụmụ sitere n'ezinụlọ mmadụ ma ọ bụ ụmụ ya mụtara n'ọgbọ dị iche iche. Ọ na-enye echiche nke agbụrụ anụ ahụ, ọ bụ ezie na ọ naghị echekwa kpọmkwem ụdị otu mkpụrụokwu nchịkọta dị na Grik.
- source_word: οὐδενὶ
  choice: ọ dịghịkwa onye ọ bụla
  rationale: Ọ na-echekwa echiche dative nke na-ekwu na ọ dịghị onye ha nọ n'okpuru ya, n'ụzọ doro anya ma dị mfe n'Igbo.
- source_word: δεδουλεύκαμεν
  choice: anyị bụtụrụ ohu
  rationale: “Bụrụ ohu” na-egosi ọnọdụ ịgba ohu nke okwu a pụtara n'ọnọdụ ebe a na-atụnyere ohu na nnwere onwe. “Bụtụrụ” na-egosi na ha kwuru na ọnọdụ ahụ emetụbeghị ha ruo ugbu a.
- source_word: πώποτε
  choice: -tụrụ
  rationale: Mgbakwunye a n'ime “bụtụrụ” na-ebute echiche nke “mgbe ọ bụla” n'okpuru nkwusị ike “ọ dịghị,” ya bụ, “ọ dịghị mgbe ọ bụla.”
- source_word: πῶς σὺ λέγεις
  choice: Olee otú i si asị
  rationale: Ọ bụ ajụjụ Igbo dị ndụ nke na-echekwa mgbagwoju anya na ngọnarị dị n'okwu ha; nnọchiaha “i” na-egosikwa σὺ.
- source_word: Ἐλεύθεροι γενήσεσθε
  choice: Unu ga-aghọ ndị nweere onwe ha
  rationale: “Ga-aghọ” na-echekwa mgbanwe ọnọdụ dị na γενήσεσθε, ebe “ndị nweere onwe ha” bụ okwu Igbo doro anya maka ἐλεύθεροι.
theological_decisions:
- issue: Ịsụgharị δουλεύω n'ọnọdụ a na-atụnyere ịgba ohu na nnwere onwe
  choice: anyị bụtụrụ ohu
  alternative: anyị ejebeghị onye ọ bụla ozi
  rationale: Ọnọdụ gbara amaokwu a gburugburu na-ekwu kpọmkwem banyere ohu na nnwere onwe. Ya mere, “bụrụ ohu” na-echekwa ịdị arọ nke nkekọ ahụ karịa “ije ozi,” ma ihe ọzọ nwere ike ịbụ ihe ngwaa ahụ pụtara n'ebe ọzọ.
- issue: Ịsụgharị Σπέρμα Ἀβραάμ
  choice: ụmụ ụmụ Ebraham
  alternative: mkpụrụ Ebraham
  rationale: N'ebe a, ha na-ekwu na ha sitere n'anụ ahụ n'agbụrụ Ebraham. “Ụmụ ụmụ Ebraham” bụ okwu a na-aghọta ngwa ngwa n'Igbo, ebe “mkpụrụ Ebraham” na-esochi ihe oyiyi Grik nke ọma karị ma nwee ike ịdị ntakịrị ka okwu ntụgharị.
- issue: Ichekwa mgbanwe dị na γενήσεσθε
  choice: ga-aghọ ndị nweere onwe ha
  alternative: ga-enwere onwe unu
  rationale: “Ga-aghọ” na-echekwa echiche nke isi n'otu ọnọdụ banye n'ọzọ, n'etinyeghị nkọwa ọzọ banyere ụdị nnwere onwe ahụ.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E debere nkwuwa okwu ha na ajụjụ ngọnarị ha, tinyere ọdịiche dị n'etiti ịbụ ohu na ịghọ onye nweere onwe ya. A haziri akara nkọwa ala peeji ka ha soro okwu ha na-akọwa ozugbo.
