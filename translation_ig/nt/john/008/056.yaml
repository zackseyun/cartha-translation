source:
  edition: SBLGNT
  text: Ἀβραὰμ ὁ πατὴρ ὑμῶν ἠγαλλιάσατο ἵνα ἴδῃ τὴν ἡμέραν τὴν ἐμήν, καὶ εἶδεν καὶ ἐχάρη.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/056.yaml
  text: Abraham your father rejoiced to see my day[b][a]; he saw it and was glad.
translation:
  language: ig
  text: Ebreham, nna unu, ṅụrịrị ọṅụ ịhụ ụbọchị m[a][b]; ọ hụkwara ya, wee nwee ọṅụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịtụgharị ya dịka, “ṅụrịrị ọṅụ na ọ ga-ahụ ụbọchị m,” ma ọ bụ, “ṅụrịrị ọṅụ ka o wee hụ ụbọchị m.” Ahịrịokwu Grik ahụ nwere ike ịpụta n’ụzọ ndị a yiri ibe ha.
    reason: lexical_alternative
  - marker: b
    text: “Ụbọchị m” nwere ike izo aka n’ụzọ sara mbara n’oge Mesaịa Jizọs ma ọ bụ na mmezu ọrụ ya; amaokwu a n’onwe ya akọwaghị kpọmkwem ihe omume ma ọ bụ oge e bu n’uche.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀβραὰμ
  choice: Ebreham
  rationale: Ụdị aha nna ochie a a na-ejikarị n'Igbo Baịbụl na n'okwu Ndị Kraịst.
- source_word: ὁ πατὴρ ὑμῶν
  choice: nna unu
  rationale: Ntụgharị Igbo doro anya nke na-edobe mmekọrịta Jizọs kwuru banyere ya.
- source_word: ἠγαλλιάσατο
  choice: ṅụrịrị ọṅụ
  rationale: Na-egosi ọṅụ siri ike nke ἀγαλλιάω, ma bụrụkwa okwu Igbo nkịtị na nkwanye ùgwù.
- source_word: ἵνα ἴδῃ
  choice: ịhụ
  rationale: Infinitive Igbo a na-asụ nke ọma mgbe ngwaa ọṅụ sochiri ya; ọ na-ahapụ ohere maka nghọta ebumnuche ma ọ bụ atụmanya dị n'ἵνα-clause.
- source_word: τὴν ἡμέραν τὴν ἐμήν
  choice: ụbọchị m
  rationale: Na-edobe okwu Grik n'ụzọ kpọmkwem na nghọta Mesaịa ya, n'emeghị ka ọ bụrụ otu ihe omume kpọmkwem.
- source_word: καὶ εἶδεν
  choice: ọ hụkwara ya
  rationale: ‘Ya’ na-ezo aka n'ụbọchị ahụ ma mee ka Igbo bụrụ nke doro anya na nke e bu pụta ụwa.
- source_word: καὶ ἐχάρη
  choice: wee ṅụrịa ọṅụ
  rationale: Na-enye mmechi ahụ n'Igbo dị mfe; ọ bụ ezie na okwu ọṅụ pụtara ugboro abụọ, mgbanwe oge na nhazi ahịrịokwu na-eme ka ọ dị n'okike.
theological_decisions:
- issue: Ihe ‘ụbọchị m’ pụtara
  choice: Edobere ‘ụbọchị m’ n'akwụghị ma ọ bụ ọbịbịa Jizọs, ọrụ ya n'ụwa, ọnwụ na mbilite n'ọnwụ ya, mmezu Mesaịa, ma ọ bụ ụbọchị ikpeazụ.
  alternative: Ịkọwa ya kpọmkwem dịka ụbọchị ọmụmụ Jizọs, ụbọchị ọnwụ na mbilite n'ọnwụ ya, ma ọ bụ ụbọchị nlọghachi ya.
  rationale: Amaokwu Grik ahụ akọwaghị kpọmkwem ihe omume ma ọ bụ oge e bu n'uche; ya mere, ntụgharị ahụ na-echekwa obosara na esemokwu nkà mmụta okpukpe dị na ya.
- issue: Ike ἵνα n'okwu ọṅụ Ebreham
  choice: ‘ịhụ,’ nke nwere ike igosi ihe ọ tụrụ anya ya ma ọ bụ ihe ọ ṅụrịrị ọṅụ banyere ya.
  alternative: ‘ka o wee hụ’ ma ọ bụ ‘na ọ ga-ahụ.’
  rationale: ἵνα-clause nwere ike ibu echiche ebumnuche ma ọ bụ ọdịnaya/atụmanya. Ntụgharị isi ahụ dị n'okike n'Igbo, ebe nkọwa ala peeji na-echekwa ụzọ ndị ọzọ.
translation_notes:
  register: Standard Igbo dị ugbu a, dị mfe nghọta ma nwee ugwu. E ji ‘unu’ debe adreesị ọtụtụ mmadụ. E debere okwu ihe atụ ‘ụbọchị m’ kama ịkọwa ya n'ụzọ otu ozizi pụrụ iche.
