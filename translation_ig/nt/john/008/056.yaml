revisions:
- from: Ebreham, nna unu, ṅụrịrị ọṅụ ịhụ ụbọchị m[a][b]; ọ hụkwara ya, wee ṅụrịa ọṅụ.
  to: Ebreham, nna unu, ṅụrịrị ọṅụ ịhụ ụbọchị m[a][b]; ọ hụkwara ya, wee nwee ọṅụ.
  rationale: The revision retains the source’s ambiguity concerning Abraham’s seeing Jesus’ “day” and the nuanced force of the ἵνα-clause. It makes only safe Igbo stylistic and footnote-language improvements, while distinguishing the final, simpler joy verb from the preceding stronger exultation.
