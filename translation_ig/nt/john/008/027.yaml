  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οὐκ ἔγνωσαν ὅτι τὸν πατέρα αὐτοῖς ἔλεγεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/027.yaml
  text: They did not understand that he was speaking to them about the Father[a].
translation:
  language: ig
  text: Ha aghọtaghị na ọ na-agwa ha okwu banyere Nna[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Ha amataghị na ọ na-agwa ha okwu banyere Nna.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ἔγνωσαν
  choice: Ha aghọtaghị
  rationale: N’ọnọdụ a, γινώσκω na-egosi na ha aghọtaghị ihe Jizọs na-ekwu. “Aghọtaghị” na-enye echiche ahụ n’Igbo dị ugbu a, ebe “amataghị” ka bụkwa ntụgharị kwe omume.
- source_word: ὅτι
  choice: na
  rationale: “Na” na-ewebata ihe ha na-aghọtaghị, dịka ὅτι si arụ ọrụ n’ahịrịokwu Grik.
- source_word: τὸν πατέρα
  choice: Nna
  rationale: N’ọnọdụ Oziọma Jọn a, okwu ahụ na-ezo aka n’ebe Chineke, Nna Jizọs, nọ. Mkpụrụedemede ukwu na-egosi na ọ bụ aha nsọpụrụ a kapịrị ọnụ, n’etinyeghị nkọwa ọzọ.
- source_word: αὐτοῖς
  choice: ha
  rationale: N’usoro “na-agwa ha okwu,” “ha” na-egosipụta onye a na-agwa okwu dịka dative αὐτοῖς si mee.
- source_word: ἔλεγεν
  choice: ọ na-agwa ha okwu
  rationale: Ụdị imperfect Grik na-egosi omume na-aga n’ihu; “na-agwa … okwu” na-egosipụta nke a n’Igbo eke.
theological_decisions:
- issue: Onye “Nna” na-ezo aka na ya
  choice: Jizọs na-ekwu banyere Chineke, Nna ya.
  alternative: Nna mmadụ nkịtị.
  rationale: Ọnọdụ dị nso n’Oziọma Jọn na-eji “Nna” eme ihe ugboro ugboro maka Chineke dịka Nna Jizọs. Nke a sitere n’ọnọdụ ederede ahụ, ọ bụghị n’itinye ozizi ọzọ.
- issue: Ntụgharị γινώσκω n’ọnọdụ a
  choice: aghọtaghị
  alternative: amataghị; achọpụtaghị onye ọ bụ
  rationale: Isi okwu bụ na ndị na-ege ntị aghọtaghị onye Jizọs na-ekwu banyere ya. “Aghọtaghị” na-edobe echiche ahụ nke ọma, ma ihe γινώσκω pụtara n’ụzọ nkịtị bụ “ịma,” ya mere e debere ya n’okpuru peeji dịka ụzọ ọzọ.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị mfe ma nwee ugwu. Ahịrịokwu ahụ na-edobe usoro okwu eke n’Igbo ma na-egosipụta omume na-aga n’ihu nke imperfect ἔλεγεν.
