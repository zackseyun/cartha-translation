id: JHN.8.21
reference: John 8:21
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Εἶπεν οὖν πάλιν ⸀αὐτοῖς· Ἐγὼ ὑπάγω καὶ ζητήσετέ με, καὶ ἐν τῇ ἁμαρτίᾳ ὑμῶν ἀποθανεῖσθε· ὅπου ἐγὼ ὑπάγω ὑμεῖς οὐ δύνασθε ἐλθεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/021.yaml
  text: So he said to them again[a], “I am going away, and you will seek me, and you will die in your sin. Where I am going[c][b], you are not able to come.”
translation:
  language: ig
  text: Ya mere, ọ gwakwara ha ọzọ, sị, “Ana m apụ, unu ga-achọ m[a], unu ga-anwụkwa n'ime mmehie unu[b]. Ebe m na-aga, unu enweghị ike ịbịa[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Okwu Grik ahụ pụkwara ịpụta ilegharị anya ịchọta mmadụ. N'akwụkwọ Jọn, ọ pụkwara inwe echiche ime mmụọ miri emi.
    reason: lexical_alternative
  - marker: b
    text: N'asụsụ Grik, “mmehie” dị n'otu ọnụ ọgụgụ. Ụfọdụ ntụgharị na-atụgharị ya dịka “mmehie dị iche iche unu,” ma otu ọnụ ọgụgụ ahụ nwere ike ịrụtụ aka n'ọnọdụ mmehie ha nọgidere n'ime ya, ọ bụghị naanị n'omume ọjọọ dị iche iche.
    reason: lexical_alternative
  - marker: c
    text: A pụkwara ịsị, “unu apụghị ịbịa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Ya mere
  rationale: Ọ na-ejikọta okwu a na mkparịta ụka gara aga ma na-egosi ihe si na ya pụta; nke a bụ njikọ doro anya ma bụrụkwa Igbo a na-asụ ugbu a.
- source_word: πάλιν
  choice: ọzọ
  rationale: Ọ na-egosi na Jizọs kwuru okwu a ọzọ, dịka adverb Grik ahụ si dị.
- source_word: Ἐγὼ ὑπάγω
  choice: Ana m apụ
  rationale: ‘Ịpụ’ na-egosi na ọ na-ahapụ ndị na-ege ya ntị, ma ọ naghị akọwapụta ebe ọ na-aga ma ọ bụ ụzọ ọ ga-esi gaa karịa ihe Grik kwuru.
- source_word: ζητήσετέ με
  choice: unu ga-achọ m
  rationale: ‘Ịchọ’ nwere ike ịpụta ilegharị anya ka a chọta mmadụ, ma ọ pụkwara ibu echiche ime mmụọ miri emi n'akwụkwọ Jọn; ya mere, ọ na-echekwa nghọta abụọ ahụ.
- source_word: ἐν τῇ ἁμαρτίᾳ ὑμῶν
  choice: n'ime mmehie unu
  rationale: A hapụrụ ‘mmehie’ dịka otu ọnọdụ zuru ezu, kwekọọ na aha otu ọnụ ọgụgụ dị na Grik, kama ịgbanwe ya ka ọ bụrụ ndepụta omume ọjọọ dị iche iche.
- source_word: ἀποθανεῖσθε
  choice: unu ga-anwụ
  rationale: Nke a na-enye ọdịnihu Grik ahụ n'Igbo dị mfe ma kwụ ọtọ.
- source_word: ὅπου ἐγὼ ὑπάγω
  choice: Ebe m na-aga
  rationale: Ọ na-echekwa oge ugbu a na echiche ebe Jizọs na-aga, n'Igbo na-ada nke ọma.
- source_word: οὐ δύνασθε ἐλθεῖν
  choice: unu enweghị ike ịbịa
  rationale: Nke a na-echekwa okwu δύνασθε nke na-ekwu maka enweghị ikike ma ọ bụ ike ịbịa, kama ime ka ọ bụrụ naanị iwu machibidoro ha ịbịa.
theological_decisions:
- issue: Aha otu ọnụ ọgụgụ ἁμαρτίᾳ ma e jiri ya tụnyere ntụgharị ọtụtụ ọnụ ọgụgụ
  choice: n'ime mmehie unu
  alternative: n'ime mmehie niile unu
  rationale: Grik ji aha otu ọnụ ọgụgụ mee ihe. ‘Mmehie unu’ n'Igbo nwere ike ịkọwa ọnọdụ mmehie ha nọ n'ime ya n'agbanyeghị na ‘unu’ bụ ọtụtụ mmadụ; ntụgharị ahụ anaghị amanye nkọwa na ọ bụ naanị omume mmehie dị iche iche.
- issue: Ihe ὑπάγω pụtara banyere ọpụpụ Jizọs
  choice: Ana m apụ
  alternative: Ana m aga
  rationale: N'akwụkwọ Jọn, okwu a nwere ike ịrụtụ aka n'ọpụpụ Jizọs nke metụtara ọnwụ ya, mbilite n'ọnwụ ya, na ịlaghachikwuru Nna. ‘Ana m apụ’ na-echekwa echiche ọpụpụ ahụ n'ekwughị ebe ọ na-aga n'ụzọ doro anya karịa isi mmalite.
- issue: Ụdị enweghị ike dị na οὐ δύνασθε ἐλθεῖν
  choice: unu enweghị ike ịbịa
  alternative: unu agaghị abịali
  rationale: Nhọrọ e ji mee ihe na-echekwa okwu banyere ikike ma ọ bụ ike; ọ naghị ekpebi n'isi amaokwu a ma ihe kpatara ya ọ̀ bụ ihe mgbochi ime mmụọ, ikpe, ma ọ bụ ihe ọzọ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta mee ihe. A haziri ahịrịokwu ahụ ka ọ daa ka okwu mmadụ na-ekwu, ebe a na-echekwa njikọ okwu Grik, otu ọnụ ọgụgụ ‘mmehie,’ na mgbagwoju echiche dị n'ọpụpụ Jizọs. E tinyere akara nkọwa ala peeji [a], [b], na [c] n'akụkụ okwu nke ọ bụla ha na-akọwa.
