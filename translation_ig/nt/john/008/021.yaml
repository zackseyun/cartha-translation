review_pass:
  verdict: revise
  source_fidelity: The main text accurately represents the Greek discourse connective, repetition, departure, future seeking and dying, the singular noun ἁμαρτίᾳ, and the incapacity expressed by οὐ δύνασθε. “Ana m apụ” suitably conveys ὑπάγω without specifying Jesus’ destination.
  naturalness: The sentence is clear, idiomatic Standard Igbo, and its sober register fits direct public teaching. “Ya mere, ọ gwakwara ha ọzọ” is acceptable and natural.
  terminology: 'Key terms are handled consistently: “mmehie” retains the Greek singular, while “enweghị ike ịbịa” preserves inability rather than merely prohibition. Footnote a’s proposed alternative, however, uses “chọgharị,” which means to seek again rather than to look/search for someone, and footnote b unnecessarily introduces “niile” (‘all’), absent from both Greek and English audit trail.'
  issues:
  - severity: medium
    issue: Footnote a gives “unu ga-achọgharị m” as an alternative for ζητήσετέ με.
    rationale: “Chọgharị” adds the sense of repetition (‘seek again’), whereas ζητήσετέ means ‘you will seek/look for.’ The alternative therefore changes the lexical sense.
  - severity: medium
    issue: Footnote b says some render the phrase “n'ime mmehie niile unu.”
    rationale: “Niile” (‘all’) is not present in ἐν τῇ ἁμαρτίᾳ ὑμῶν and is not the relevant alternative. The contrast is Greek singular ‘sin’ versus a plural rendering such as ‘sins,’ not ‘all your sins.’
  revised_text: Ya mere, ọ gwakwara ha ọzọ, sị, “Ana m apụ, unu ga-achọ m[a], unu ga-anwụkwa n'ime mmehie unu[b]. Ebe m na-aga, unu enweghị ike ịbịa[c].”
