id: JHN.8.17
reference: John 8:17
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἐν τῷ νόμῳ δὲ τῷ ὑμετέρῳ γέγραπται ὅτι δύο ἀνθρώπων ἡ μαρτυρία ἀληθής ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/017.yaml
  text: And even in your law it is written that the testimony of two men is true[a].
translation:
  language: ig
  text: Ọ bụkwa n’iwu unu ka e dere na akaebe mmadụ abụọ bụ eziokwu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “akaebe ụmụ nwoke abụọ bụ eziokwu.” Okwu Grik ahụ na-ekwu banyere mmadụ abụọ, ma a na-ejikarị ya eme okwu iwu gbasara ndị akaebe.
    reason: lexical_alternative
lexical_decisions:
- source_word: νόμῳ
  choice: iwu
  rationale: N'ebe a, νόμος na-ezo aka n'iwu ma ọ bụ Akwụkwọ Nsọ ndị Juu Jizọs kpọrọ ihe àmà; “iwu” na-echekwa echiche iwu ahụ n'emeghị ka ọ bụrụ naanị aha pụrụ iche nke akwụkwọ ise mbụ.
- source_word: ὑμετέρῳ
  choice: unu
  rationale: “Unu” na-edobe nnọchiaha onye nke abụọ nke ọtụtụ ma na-echekwa ntakịrị ndọpụ uche dị n'okwu Jizọs, n'ebughị ụzọ mee ka ụda ya sie ike karịa Grik.
- source_word: γέγραπται
  choice: ka e dere
  rationale: Nke a bụ ụzọ Igbo si ekwu usoro e ji ewebata ihe e dere n'Akwụkwọ Nsọ, ma na-egosi na ihe ahụ e dere ka dị irè.
- source_word: δύο ἀνθρώπων
  choice: mmadụ abụọ
  rationale: ἀνθρώπων nwere ike ịpụta ụmụ mmadụ n'ozuzu; “mmadụ abụọ” bụ okwu Igbo ebumpụta ụwa nke na-adịghị amanye nghọta na ọ bụ naanị ụmụ nwoke, ebe ndetu ala na-egosi ọdịdị okwu iwu Grik ahụ.
- source_word: μαρτυρία
  choice: akaebe
  rationale: “Akaebe” dabara n'ọnọdụ ikpe na iwu, ma na-ekwupụta ihe μαρτυρία pụtara nke ọma.
- source_word: ἀληθής
  choice: eziokwu
  rationale: “Bụ eziokwu” na-edobe ihe ἀληθής kwuru kpọmkwem, ebe echiche nke ịbụ ihe iwu nabatara ka na-apụta site n'ọnọdụ ahụ.
- source_word: καὶ ... δὲ
  choice: Ọ bụkwa
  rationale: “Ọ bụkwa” na-ejikọta amaokwu a na nke gara aga ma na-enye ntakịrị nkwusi ike nke ngwakọta καὶ ... δὲ nwere n'okwu a.
theological_decisions:
- issue: Ike okwu “iwu unu”
  choice: E debere “iwu unu” dị ka okwu Jizọs gwara ndị na-emegide ya.
  alternative: iwu ahụ; iwu nke unu onwe unu
  rationale: Grik nwere nnọchiaha nke onye nke abụọ n'ụzọ doro anya. Nke a na-echekwa esemokwu okwu ahụ n'emeghị ka ọ pụta na Jizọs jụrụ iwu ahụ, ma ọ bụ mee ka ụda okwu ya sie ike karịa ederede.
- issue: Ntụgharị ἀνθρώπων n'okwu iwu
  choice: mmadụ abụọ
  alternative: ụmụ nwoke abụọ
  rationale: N'Igbo, “mmadụ abụọ” na-enye echiche mmadụ abụọ bụ ndị akaebe n'ụzọ ebumpụta ụwa. Ndetu ala na-echekwa eziokwu na okwu Grik ahụ nwere ike ịsụgharịkwa dịka “ụmụ nwoke abụọ,” karịchaa dịka usoro okwu iwu ọdịnala.
translation_notes:
  register: Asụsụ Igbo Izugbe, dị ùgwù ma dị mfe nghọta. A họọrọ “akaebe” maka ọnọdụ iwu ahụ, ma debe “iwu unu” iji chekwaa ike okwu na esemokwu dị n'ederede mbụ.
