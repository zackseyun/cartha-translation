  naturalness: The revised wording is natural, modern Standard Igbo. “Gị onwe gị” appropriately conveys the marked explicit pronoun Σὺ without changing the sense.
  terminology: “Na-agba ama” and “akaebe” form a clear and consistent testimony/witness vocabulary. The footnote should describe legal validity without introducing the distinct, stronger notion of insufficient supporting evidence.
  issues:
