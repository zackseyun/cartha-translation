  text: εἶπον οὖν αὐτῷ οἱ Φαρισαῖοι· Σὺ περὶ σεαυτοῦ μαρτυρεῖς· ἡ μαρτυρία σου οὐκ ἔστιν ἀληθής.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/013.yaml
  text: So the Pharisees said to him, “You are testifying about yourself; your testimony is not true.”
translation:
  language: ig
  text: Ya mere, ndị Farisii sịrị ya, “Gị onwe gị na-agba ama banyere onwe gị; akaebe gị abụghị eziokwu.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “akaebe gị abaghị uru n’iwu.” N’asụsụ Grik, e dere “abụghị eziokwu,” ma n’ọnọdụ a okwu ahụ nwekwara ike igosi na akaebe ahụ enweghị ịdị irè n’iwu.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: N’ihi ya
  rationale: Na-egosi na okwu ndị Farisii sitere n’ihe Jizọs kwuru tupu nke a; ọ na-echekwa njikọ echiche ahụ n’Igbo doro anya.
- source_word: εἶπον ... οἱ Φαρισαῖοι
  choice: ndị Farisii sịrị
  rationale: Nke a bụ ụzọ Igbo nkịtị si akọ ihe mmadụ kwuru n’oge gara aga, ma ọ na-echekwa onye kwuru okwu ahụ.
- source_word: αὐτῷ
  choice: ya
  rationale: E dere nnọchiaha n’asụsụ Grik, ya mere a hapụrụ ya dịka nnọchiaha kama ịgbakwunye aha Jizọs.
- source_word: Σὺ
  choice: Gị onwe gị
  rationale: Nnọchiaha ahụ pụtara ìhè ma mesie onye a na-ekwu okwu ike; ‘Gị onwe gị’ na-egosipụta nkwusi ike ahụ n’Igbo.
- source_word: περὶ σεαυτοῦ
  choice: banyere onwe gị
  rationale: Ọ na-egosi na onye ahụ n’onwe ya bụ isiokwu akaebe ahụ, n’enweghị ịtụgharị ya ka ọ bụrụ naanị okwu gbasara ịkwado onwe ya.
- source_word: μαρτυρεῖς
  choice: na-agba ama
  rationale: Ọ na-echekwa omume dị ugbu a na echiche nke ịgba akaebe, nke nwekwara ụda okwu ikpe n’ọnọdụ a.
- source_word: ἡ μαρτυρία σου
  choice: akaebe gị
  rationale: ‘Akaebe’ bụ okwu Igbo doro anya maka ihe onye na-agba ama kwuru, ma na-ejikọta ya nke ọma na ‘na-agba ama.’
- source_word: οὐκ ἔστιν ἀληθής
  choice: abụghị eziokwu
  rationale: Nke a bụ ntụgharị kpọmkwem nke ἀληθής ma na-ahapụ ma echiche nke ịbụ eziokwu ma echiche nke ịdị irè n’okwu ikpe ka ha dị, n’emeghị ka otu naanị bụrụ ihe a họọrọ.
theological_decisions:
- issue: Ihe ndị Farisii bu n’obi mgbe ha jụrụ akaebe mmadụ na-agba banyere onwe ya
  choice: akaebe gị abụghị eziokwu
  alternative: akaebe gị abụghị nke a pụrụ ịnakwere dịka ihe ziri ezi
  rationale: Ọnọdụ okwu ahụ nwere ụda iwu na ikpe, ma ἀληθής karịrị naanị okwu iwu banyere nnabata akaebe. ‘Abụghị eziokwu’ na-echekwa esemokwu dị n’etiti eziokwu nke akaebe ahụ na ịdị irè ya n’okwu ikpe.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. ‘Ịgba ama’ na ‘akaebe’ na-echekwa usoro okwu gbasara ịgba akaebe, ebe ‘Gị onwe gị’ na-egosipụta nkwusi ike dị na Σὺ.
