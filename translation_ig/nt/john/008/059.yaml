review_pass:
  verdict: revise
  source_fidelity: 'The draft preserves the sequence and content of the Greek: the people take up stones with the purpose of throwing them at Jesus; Jesus hides himself and exits the ἱερόν. It appropriately avoids importing later expansion or a miraculous mechanism. However, “ka ha tụọrọ ya” is not a sufficiently clear or idiomatic rendering of throwing stones at him.'
  naturalness: The sentence is generally clear Standard Igbo. Recasting the purpose clause with “were tụba ya nkume” gives a more natural and unmistakable expression for pelting/throwing stones at someone. The revised footnote also uses more idiomatic and lexically restrained wording.
  terminology: “Jizọs,” “ụlọ nsọ,” and “zoro onwe ya” are suitable. The footnote’s “ogige na ụlọ niile” overstates ἱερόν by specifying all the buildings; “mpaghara (ma ọ bụ ogige) ụlọ nsọ” more accurately represents the temple precincts/complex in contrast to the inner sanctuary.
  issues:
  - severity: medium
    issue: The phrase “ka ha tụọrọ ya” is unclear and not the most natural Igbo way to state that they intended to throw stones at Jesus.
    rationale: The Greek ἵνα βάλωσιν ἐπ’ αὐτόν expresses the purpose of throwing the stones at him. “Ka ha were tụba ya nkume” clearly conveys this hostile intended action without adding that they succeeded or killed him.
  - severity: low
    issue: The footnote says “ogige na ụlọ niile nke ụlọ nsọ ahụ.”
    rationale: Ἱερόν denotes the temple precincts/complex, but “ụlọ niile” (“all the buildings”) is more specific than the Greek requires. “Mpaghara ma ọ bụ ogige ụlọ nsọ” preserves the intended lexical distinction without overdefining it.
  revised_text: Ya mere, ha bulitere nkume ka ha were tụba ya nkume; ma Jizọs zoro onwe ya, wee si n'ụlọ nsọ ahụ[a] pụọ.
  revised_footnotes:
