    text: N'ụzọ kapịrị ọnụ karị, “mpaghara ma ọ bụ ogige ụlọ nsọ ahụ.” Okwu Grik bụ ἱερόν, nke na-ezo aka n’ogige ụlọ nsọ dum, ọ bụghị naanị ebe nsọ dị n’ime ya.
    reason: lexical_alternative
  revision_rationale: The revision clarifies the purpose clause’s violent action in natural Standard Igbo and narrows the lexical note to the distinction actually indicated by ἱερόν. It retains the source’s limited description that Jesus hid himself and went out, without adding any explanation of how he escaped.
