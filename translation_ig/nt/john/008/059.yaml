  text: ἦραν οὖν λίθους ἵνα βάλωσιν ἐπ’ αὐτόν· Ἰησοῦς δὲ ἐκρύβη καὶ ἐξῆλθεν ἐκ τοῦ ⸀ἱεροῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/059.yaml
  text: So they picked up stones to throw at him[a], but Jesus hid himself and went out of the temple.
translation:
  language: ig
  text: Ya mere, ha bulitere nkume ka ha were tụba ya nkume; ma Jizọs zoro onwe ya, wee si n'ụlọ nsọ ahụ[a] pụọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N'ụzọ kapịrị ọnụ karị, “mpaghara ma ọ bụ ogige ụlọ nsọ ahụ.” Okwu Grik bụ ἱερόν, nke na-ezo aka n’ogige ụlọ nsọ dum, ọ bụghị naanị ebe nsọ dị n’ime ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦραν
  choice: bulitere
  rationale: N'ọnọdụ a, αἴρω pụtara iwere nkume n'aka maka ịtụ ya. “Bulitere” bụ okwu Igbo doro anya ma kwekọọ n'omume iro ahụ.
- source_word: οὖν
  choice: Ya mere
  rationale: Ọ na-egosi ihe si n'okwu Jizọs kwuru tupu nke a pụta; “Ya mere” na-echekwa njikọ ahụ.
- source_word: λίθους
  choice: nkume
  rationale: Nke a bụ okwu Igbo a na-ejikarị akọwa λίθος, ọ dịkwa mma n'ọnọdụ a nke ha chọrọ iji nkume tụgbuo mmadụ.
- source_word: ἵνα βάλωσιν ἐπ’ αὐτόν
  choice: ka ha tụọrọ ya
  rationale: “Ka” na-egosi nzube dị na ἵνα na subjunctive, ebe “tụọrọ ya” na-egosi na ọ bụ ya ka ha chọrọ ịtụ nkume ahụ.
- source_word: ἐκρύβη
  choice: zoro onwe ya
  rationale: Ọ bụ ezie na ọdịdị okwu Grik ahụ bụ passive, n'ebe a ọ nwere nghọta yiri middle; nsụgharị a anaghị atụ aro na onye ọzọ zoro Jizọs.
- source_word: ἐξῆλθεν
  choice: wee ... pụọ
  rationale: Nke a na-egosi mmegharị ahụ nke ịpụ n'ebe ahụ n'Igbo dị mfe ma bụrụ nke nkịtị.
- source_word: ἐκ τοῦ ἱεροῦ
  choice: si n'ụlọ nsọ ahụ pụọ
  rationale: “Ụlọ nsọ” na-agụ nke ọma n'Igbo, ebe nkọwa ala peeji na-eme ka o doo anya na ἱερόν bụ ogige na ụlọ niile metụtara ụlọ nsọ ahụ, ọ bụghị naanị ebe nsọ dị n'ime.
theological_decisions:
- issue: Ụdị ụzọ Jizọs si gbapụ
  choice: Ikwu naanị na Jizọs zoro onwe ya wee pụọ.
  alternative: Ịgbakwụnye na ọ gafere n'etiti ha n'ụzọ ọrụ ebube, ma ọ bụ na anya anaghị ahụ ya.
  rationale: Ihe odide SBLGNT kwuru naanị na Jizọs zoro onwe ya wee si n'ụlọ nsọ pụọ. A naghị ebubata nkọwa ndị dị n'ụfọdụ ihe odide e dere mgbe e mesịrị.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-echekwa njikọ nke “Ya mere,” nzube nke ndị ahụ, na nghọta na Jizọs zoro onwe ya n'enweghị ịgbakwụnye nkọwa ọrụ ebube na-adịghị n'ihe odide Grik e nyere.
