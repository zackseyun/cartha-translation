revisions:
- from: Ya mere, ha bulitere nkume ka ha tụọrọ ya; ma Jizọs zoro onwe ya, wee si n'ụlọ nsọ ahụ[a] pụọ.
  to: Ya mere, ha bulitere nkume ka ha were tụba ya nkume; ma Jizọs zoro onwe ya, wee si n'ụlọ nsọ ahụ[a] pụọ.
  rationale: The revision clarifies the purpose clause’s violent action in natural Standard Igbo and narrows the lexical note to the distinction actually indicated by ἱερόν. It retains the source’s limited description that Jesus hid himself and went out, without adding any explanation of how he escaped.
  reviewer_model: gpt-5.6-terra
