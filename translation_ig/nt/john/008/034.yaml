source:
  edition: SBLGNT
  text: Ἀπεκρίθη αὐτοῖς ὁ Ἰησοῦς· Ἀμὴν ἀμὴν λέγω ὑμῖν ὅτι πᾶς ὁ ποιῶν τὴν ἁμαρτίαν δοῦλός ἐστιν τῆς ἁμαρτίας·
base_translation:
  language: en
  yaml_path: translation/nt/john/008/034.yaml
  text: Jesus answered them[a], “Truly, truly, I say to you[b], everyone who practices sin is a servant of sin.”
translation:
  language: ig
  text: 'Jizọs zara ha, sị, “N’ezie, n’ezie, ana m asị unu: onye ọ bụla na-eme mmehie[a] bụ ohu mmehie[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “onye ọ bụla nke na-eme mmehie.” Usoro Grik ahụ na-egosi onye na-eme mmehie; n’ebe a, ọ pụrụ izo aka n’omume na-aga n’ihu ma ọ bụ nke a na-emekarị.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “onye na-ejere mmehie ozi.” Okwu Grik δοῦλος nwere ike ịpụta “ohu” ma ọ bụ “onye na-eje ozi”; a họọrọ “ohu” ebe a n’ihi na ike mmehie nke na-ekekọ mmadụ n’agbụ bụ isi ihe Jizọs na-ekwu.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀπεκρίθη
  choice: zara ha, sị
  rationale: Nke a bụ ụzọ Igbo si ekwu okwu n’akụkọ mkparịta ụka n’enweghị ịgbakwunye ihe ọhụrụ; ọ na-echekwa echiche nke ịza okwu.
- source_word: Ἀμὴν ἀμὴν
  choice: N’ezie, n’ezie
  rationale: Ọ na-eme ka nkwenye siri ike nke usoro okwu Jọn pụta ìhè ma na-echekwa nkwughachi dị na Grik.
- source_word: λέγω ὑμῖν
  choice: ana m asị unu
  rationale: Nke a bụ nsụgharị dị nso na nke ebumpụta ụwa, ma na-echekwa ụda okwu nkwupụta dị nsọ.
- source_word: πᾶς ὁ ποιῶν τὴν ἁμαρτίαν
  choice: onye ọ bụla na-eme mmehie
  rationale: Usoro ‘na-eme’ n’Igbo nwere ike igosi omume na-aga n’ihu ma ọ bụ nke a na-emekarị, ya mere ọ na-echekwa obosara ihe participle nke ugbu a pụtara n’asụsụ Grik n’enweghị ime ka ọ pụta na ọ bụ naanị otu omume.
- source_word: δοῦλος
  choice: ohu
  rationale: ‘Ohu’ na-egosi onye nọ n’okpuru ikike onye ọzọ, ma kwekọọ n’isi okwu Jizọs banyere ịbụ onye mmehie kekọtara.
- source_word: τῆς ἁμαρτίας
  choice: mmehie
  rationale: Njikọ ‘ohu mmehie’ na-egosi ịbụ nke mmehie na ịnọ n’okpuru ọchịchị ya, n’ụzọ dị mkpirikpi ma bụrụkwa Igbo ebumpụta ụwa.
theological_decisions:
- issue: Ma okwu a ọ na-ekwu maka otu mmehie e mere naanị otu ugboro ka ọ bụ omume mmehie na-aga n’ihu
  choice: onye ọ bụla na-eme mmehie
  alternative: onye ọ bụla ime mmehie ghọrọ omume ya
  rationale: Participle ποιῶν nke ugbu a nwere ike igosi omume a na-eme ma ọ bụ nke e ji mmadụ mara. Usoro Igbo ‘na-eme’ na-ahapụ obosara a ka ọ dị, kama ime ka nkọwa ‘àgwà na-adịgide adịgide’ sie ike karịa ihe Grik kwuru.
- issue: Ike ihe atụ δοῦλος pụtara
  choice: ohu mmehie
  alternative: onye na-ejere mmehie ozi
  rationale: ‘Ohu’ na-echekwa echiche nke ịbụ onye a chịkwara ma kekọta, nke bụ isi n’arụmụka amaokwu a; ‘onye na-ejere ozi’ nwere ike ime ka ọnọdụ ahụ yie ọrụ mmadụ ji aka ya họrọ.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị mfe ma nwee ugwu, dee ya. A debere nkwughachi “N’ezie, n’ezie” iji chekwaa usoro nkwupụta pụrụ iche nke Oziọma Jọn. E debere akara nkọwa [a] na [b] n’ebe okwu ndị ha na-akọwa dị, kama ịgbaso ebe akara ndị ahụ si gbagọọ na consultation layer Bekee.
