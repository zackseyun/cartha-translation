  to: N’ihi ya, ndị Juu[a] nọ na-ekwu, “Ọ gaghị egbu onwe ya, ọ̀ ga-eme, ebe ọ na-ekwu, ‘Ebe m na-aga, unu enweghị ike ịbịa’?”
  rationale: The revision replaces the unnatural and incomplete repetition in the rhetorical question with the idiomatic Standard Igbo tag “ọ̀ ga-eme?”, which preserves μήτι’s expectation of a negative answer. “N’ihi ya” naturally conveys the inferential narrative connection of οὖν. All other wording and the ambiguity-preserving footnote remain substantively unchanged.
