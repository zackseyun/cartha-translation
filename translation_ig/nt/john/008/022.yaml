    rationale: The draft says, “Ọ gaghị egbu onwe ya, ka ọ̀ ga-egbu?” The second clause repeats the killing verb without “onwe ya” and does not function naturally as an Igbo tag question. It should be replaced with a conventional negative-expectation tag while retaining the rhetorical force.
