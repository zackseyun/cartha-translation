id: JHN.8.22
reference: John 8:22
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἔλεγον οὖν οἱ Ἰουδαῖοι· Μήτι ἀποκτενεῖ ἑαυτὸν ὅτι λέγει· Ὅπου ἐγὼ ὑπάγω ὑμεῖς οὐ δύνασθε ἐλθεῖν;
base_translation:
  language: en
  yaml_path: translation/nt/john/008/022.yaml
  text: So the Jews were saying[a], “Surely he will not kill himself, since he says, ‘Where I am going, you cannot come’?”
translation:
  language: ig
  text: N’ihi ya, ndị Juu[a] nọ na-ekwu, “Ọ gaghị egbu onwe ya, ọ̀ ga-eme, ebe ọ na-ekwu, ‘Ebe m na-aga, unu enweghị ike ịbịa’?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma eleghị anya, dịka ọnọdụ okwu dị n’Oziọma Jọn si dị, ọ pụrụ ịbụ “ndị Judia” ma ọ bụ “ndị ndu ndị Juu,” dabere n’otú Jọn si chọọ ka e ghọta ndị ọ na-ekwu maka ha n’ebe a.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγον
  choice: nọ na-ekwu
  rationale: Oge imperfect na-egosi okwu ha nọgidere na-ekwu ma ọ bụ na-ekwu ugboro ugboro; ‘nọ na-ekwu’ na-egosipụta nke a n’Igbo nkịtị.
- source_word: οὖν
  choice: Ya mere
  rationale: Na-ejikọta ihe ha kwuru na okwu Jizọs kwuru tupu nke a, ma na-egosi nkwubi okwu ha si na ya nweta.
- source_word: οἱ Ἰουδαῖοι
  choice: ndị Juu
  rationale: Nke a bụ ntụgharị kpọmkwem nke okwu Grik ahụ. Ebe ọ bụ na amaokwu a n’onwe ya akọwaghị ma ọ bụ naanị ndị ndu ka ọ na-ekwu maka ha, a hapụrụ obosara okwu ahụ n’isi ederede.
- source_word: Μήτι
  choice: Ọ gaghị …, ka ọ̀ ga-…?
  rationale: Ụdị ajụjụ a na-atụ anya azịza na-adịghị ekweta; usoro ajụjụ Igbo a na-egosipụta obi abụọ ahụ nke ọma.
- source_word: ἀποκτενεῖ ἑαυτόν
  choice: egbu onwe ya
  rationale: Ọ bụ ntụgharị doro anya, nke oge a, nke ngwaa na nnọchiaha na-alaghachi n’onye ahụ.
- source_word: ὅτι
  choice: ebe
  rationale: N’ebe a okwu ahụ na-enye ihe mere ha ji chee otú ahụ; ‘ebe’ na-ejikọta ihe ha chere na okwu ọ na-ekwu n’ụzọ dị mma n’Igbo.
- source_word: λέγει
  choice: ọ na-ekwu
  rationale: Na-echekwa present tense nke Grik ma na-adabara okwu a na-akọ n’oge ahụ.
- source_word: Ὅπου ἐγὼ ὑπάγω
  choice: Ebe m na-aga
  rationale: Na-egosipụta ngagharị ahụ n’enweghị ịgbakwụnye nkọwa na ọ bụ ịla kpamkpam.
- source_word: οὐ δύνασθε ἐλθεῖν
  choice: unu enweghị ike ịbịa
  rationale: Na-echekwa echiche nke enweghị ike ime ihe ahụ n’ụzọ doro anya ma dị mfe nghọta.
theological_decisions:
- issue: Ndị οἱ Ἰουδαῖοι na-ezo aka na ha n’Oziọma Jọn
  choice: E ji ‘ndị Juu’ mee ihe n’isi ederede.
  alternative: ‘ndị Judia’ ma ọ bụ ‘ndị ndu ndị Juu’
  rationale: Okwu Grik ahụ pụtara ‘ndị Juu’ n’ụzọ nkịtị, ma n’Oziọma Jọn ọ pụrụ, dịka ọnọdụ si dị, izo aka n’ebe ndị Judia nọ ma ọ bụ n’ebe ụfọdụ ndị ọchịchị na ndị mmegide nọ. Ịkpachibido ya n’otu ìgwè n’isi ederede ga-ekpebi ihe amaokwu a n’onwe ya na-ekwughị kpọmkwem; ihe odide ala peeji na-echekwa ụzọ nghọta ndị ọzọ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta mee ihe. Usoro ‘Ọ gaghị …, ka ọ̀ ga-…?’ na-eburu ajụjụ na-atụ anya azịza na-adịghị ekweta, ebe akara ala peeji na-echekwa obosara na mgbagwoju anya nke οἱ Ἰουδαῖοι.
