review_pass:
  verdict: revise
  source_fidelity: The verse’s sequence and core sense are retained, but «Onyenwe anyị» adds a first-person plural possessive (‘our Lord’) not present in κύριε and tends to resolve a vocative that can function as a respectful ‘sir’ more strongly than the Greek requires. The final prohibition is better rendered with an idiomatic negative imperative that directly expresses μηκέτι ἁμάρτανε.
  naturalness: «Gaa, emekwala mmehie ọzọ» is clear, idiomatic Standard Igbo, and naturally conveys ‘go, and sin no more.’ Moving the textual-critical marker to «Ọ» aligns its anchor with the English audit trail and the woman/story to which the note pertains.
  terminology: «Onyenwe m» preserves a respectful direct address without adding the plural possessive in the draft. «Ama ... ikpe» appropriately conveys the judicial force of κατακρίνω. «Mmehie» is the standard term for ἁμαρτάνω.
  issues:
  - severity: medium
    issue: «Onyenwe anyị» introduces a possessive not expressed in Greek.
    rationale: κύριε is vocative singular, ‘Lord’ or ‘sir’; ‘anyị’ (‘our’) adds participant identification and can over-specify the woman’s recognition of Jesus.
  - severity: medium
    issue: The rendering of μηκέτι ἁμάρτανε is less idiomatic than necessary.
    rationale: «sitekwa ugbu a akwụsịla ime mmehie» is understandable, but «emekwala mmehie ọzọ» is the natural Standard Igbo negative command and directly communicates that sin must not continue/recur.
  - severity: low
    issue: Footnote marker placement does not match the audit-trail anchor.
    rationale: The English note is attached to ‘She’; placing [a] after «Ọ» more clearly identifies the textual unit under discussion.
