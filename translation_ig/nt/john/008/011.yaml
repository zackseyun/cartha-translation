- from: Ọ sịrị, “Ọ dịghị onye, Onyenwe anyị.” Jizọs wee sị, “Mụ onwe m adịghịkwa ama gị ikpe. Gaa, sitekwa ugbu a akwụsịla ime mmehie.”[a]
