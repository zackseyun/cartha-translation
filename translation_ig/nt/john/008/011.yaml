  text: Ἡ δὲ εἶπεν, Οὐδείς, κύριε. Εἶπεν δὲ ὁ Ἰησοῦς, Οὐδὲ ἐγώ σε κατακρίνω· πορεύου, καὶ μηκέτι ἁμάρτανε.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/john/008/011.yaml
  text: She[a] said, "No one, Lord." And Jesus said, "Neither do I condemn you; go, and sin no more."
translation:
  language: ig
  text: Ọ[a] sịrị, “Ọ dịghị onye, Onyenwe m.” Jizọs wee sị, “Mụ onwe m anaghịkwa ama gị ikpe. Gaa, emekwala mmehie ọzọ.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nke a bụ amaokwu ikpeazụ n’akụkọ banyere nwanyị e jidere ka ọ na-akwa iko (Jọn 7:53–8:11). Lee nkọwa dị na Jọn 7:53.
    reason: textual_critical
lexical_decisions:
- source_word: κύριε
  choice: Onyenwe anyị
  rationale: Ọ bụ okwu nkwanye ùgwù nke nwekwara ike ịpụta ‘nna anyị ukwu’; n’ebe a, ‘Onyenwe anyị’ na-edobe nkwanye ùgwù ahụ na nnabata ikike Jizọs n’enweghị ịkọwa karịa ihe Grik kwuru.
- source_word: κατακρίνω
  choice: ama ... ikpe
  rationale: Nkebi okwu Igbo a na-egosipụta echiche ikpe ụlọikpe—ikpe mmadụ ikpe ma maa ya ikpe—n’ụzọ ndị na-agụ Igbo taa ga-aghọta nke ọma.
- source_word: μηκέτι ἁμάρτανε
  choice: sitekwa ugbu a akwụsịla ime mmehie
  rationale: ‘Site ugbu a’ na-ebupụta ike oge dị na μηκέτι, ebe ‘akwụsịla ime mmehie’ na-enye iwu ka omume mmehie ghara ịga n’ihu.
- source_word: πορεύου
  choice: Gaa
  rationale: Ntughari kpọmkwem ma bụrụkwa nke ebumpụta ụwa maka iwu Grik a.
theological_decisions:
- issue: Ụdị okwu nwanyị ahụ ji kpọọ Jizọs, κύριε
  choice: Onyenwe anyị
  alternative: Nna anyị ukwu
  rationale: A họọrọ ụdị ọdịnala nke na-egosipụta ikike Jizọs, ma ekwughị n’amaokwu ahụ kpọmkwem ókè nghọta nwanyị ahụ banyere onye Jizọs bụ ruru.
- issue: Mmekọrịta dị n’etiti enweghị ịma ya ikpe na iwu ịkwụsị mmehie
  choice: E debere ahịrịokwu abụọ ahụ n’akụkụ ibe ha n’enweghị ịkọwa otu site n’aka nke ọzọ.
  alternative: Ịgbakwunye nkọwa na mgbaghara ma ọ bụ nchegharị
  rationale: Grik ahụ na-edobe ma enweghị ịma ikpe ma iwu omume ọma ọnụ; ntughari kwesịrị ichekwa esemokwu na ibu mmụta okpukpe ahụ.
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe nke oge a, dị mfe ma nwee ugwu. E jiri ‘Ọ sịrị’ zere ikwughachi ‘nwanyị ahụ’ ebe ihe gbara amaokwu ahụ gburugburu na-eme ka onye a na-ekwu maka ya doo anya. E tinyere akara ntụaka [a] n’isiokwu amaokwu ahụ dị ka achọrọ.
