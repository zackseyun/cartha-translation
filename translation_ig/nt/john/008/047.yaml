id: JHN.8.47
reference: John 8:47
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ ὢν ἐκ τοῦ θεοῦ τὰ ῥήματα τοῦ θεοῦ ἀκούει· διὰ τοῦτο ὑμεῖς οὐκ ἀκούετε ὅτι ἐκ τοῦ θεοῦ οὐκ ἐστέ.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/047.yaml
  text: The one who is from God hears the words of God[a]. For this reason you do not hear[b], because you are not from God.
translation:
  language: ig
  text: Onye sitere na Chineke[a] na-anụ okwu Chineke. Ọ bụ ya mere unu anaghị anụ, n’ihi na[b] unu esiteghị na Chineke.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị “sitere na Chineke” dịka “bụ nke Chineke.” Okwu Grik ahụ na-elekwasị anya n’isi iyi ma ọ bụ ebe e si pụta.
    reason: lexical_alternative
  - marker: b
    text: 'Ma ọ bụ: “Ọ bụ ya mere unu anaghị anụ na unu esiteghị na Chineke.” Njikọ Grik ὅτι nwekwara ike ịpụta “na,” ma nghọta “n’ihi na” dabara nke ọma n’ọnọdụ okwu a.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ ὢν
  choice: Onye sitere
  rationale: A na-eji “onye” mee ka participle ahụ nke na-arụ ọrụ dịka aha zoo aka n’otu onye nnọchiteanya, ma okwu ahụ metụtara ụdị mmadụ niile dị otu a.
- source_word: ἐκ τοῦ θεοῦ
  choice: sitere na Chineke
  rationale: “Sitere na” na-egosipụta isi iyi ma ọ bụ ebe mmadụ si pụta, dịka ἐκ si mee ebe a; ọ naghị eme ka okwu ahụ bụrụ naanị inwe ma ọ bụ ịbụ nke onye ọzọ.
- source_word: τὰ ῥήματα τοῦ θεοῦ
  choice: okwu Chineke
  rationale: “Okwu” bụ ụzọ Igbo si ekwu okwu ma ọ bụ ihe e kwuru n’ụzọ ebumpụta ụwa, ọ pụkwara ibu echiche nke ọtụtụ okwu n’enweghị ịgbakwunye nkọwa na-adịghị na Grik.
- source_word: ἀκούει / ἀκούετε
  choice: na-anụ / anaghị anụ
  rationale: Nhọrọ a chekwara nkwughachi nke otu ngwaa ahụ. N’ebe a ịnụ nwere ike ịgụnye ịnabata ihe a nụrụ, ma ịsụgharị ya dịka “irube isi” ga-akọwazu ihe Grik hapụrụ n’ụzọ sara mbara.
- source_word: διὰ τοῦτο
  choice: Ọ bụ ya mere
  rationale: Nke a bụ okwu Igbo dị ugbu a ma bụrụkwa nke doro anya maka igosi ihe kpatara nsonaazụ a.
- source_word: ὑμεῖς
  choice: unu
  rationale: “Unu” gosiri nke ọma na onye a na-agwa okwu karịrị otu, ma ekwesịghị ịgbakwunye okwu ọzọ ga-eme ka ike e tinyere na pronoun ahụ gabiga nke Grik.
- source_word: ὅτι
  choice: n’ihi na
  rationale: A ghọtara njikọ a dịka nke na-enye ihe kpatara ha anaghị anụ; nke a dabara n’usoro echiche nke amaokwu ahụ, ebe a ka na-edebe ọgụgụ ọzọ na nkọwa ala peeji.
- source_word: ἐκ τοῦ θεοῦ οὐκ ἐστέ
  choice: unu esiteghị na Chineke
  rationale: A nọgidere na-asụgharị ἐκ dịka isi iyi ma ọ bụ ebe e si pụta, ma a kọwaghị ya site n’itinye otu usoro ozizi pụrụ iche n’ime amaokwu ahụ.
theological_decisions:
- issue: Ihe “isite na Chineke” pụtara n’ọnọdụ echiche Jọn
  choice: E debere okwu isi iyi ahụ dịka “sitere na Chineke.”
  alternative: “bụ nke Chineke” ma ọ bụ ịkọwa ya kpọmkwem dịka ọmụmụ ọhụrụ, nhọpụta, ma ọ bụ ịbụ onye ọgbụgba ndụ
  rationale: Okwu Jọn na-egosi isi iyi ma na-emekwa ka a ghọta mmekọrịta ma ọ bụ nkwado, ma amaokwu a akọwaghị ya site n’otu usoro ozizi e mesịrị. Nsụgharị ahụ na-ahapụ obosara na esemokwu echiche ahụ ka ha dị.
- issue: Ike echiche nke ἀκούω
  choice: “na-anụ / anaghị anụ”
  alternative: “na-ege ntị,” “na-anabata,” ma ọ bụ “na-erube isi”
  rationale: N’ezie, ịnụ n’ọnọdụ a nwere ike ịpụta ịnụ nke na-eweta nnabata, ma “irube isi” ga-eme ka ihe amaokwu ahụ na-atụ aro ghọọ nkọwa kpọmkwem n’ime nsụgharị.
- issue: Ọrụ ὅτι n’ahịrịokwu ikpeazụ
  choice: 'A ghọtara ya dịka ihe na-akpata: “n’ihi na.”'
  alternative: 'A pụrụ ịghọta ya dịka njikọ na-ewebata ihe a na-anụ: “na unu esiteghị na Chineke.”'
  rationale: 'Ọgụgụ nke na-egosi ihe kpatara ya na-eme ka ntụgharị uche amaokwu ahụ doo anya: ha anaghị anụ n’ihi na ha esiteghị na Chineke. Agbanyeghị, ebe ὅτι nwekwara ike ịpụta “na,” e debere ohere ahụ na nkọwa ala peeji.'
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “Ọ bụ ya mere” na-eme ka njikọ echiche ahụ bụrụ nke ebumpụta ụwa n’Igbo, ebe nkwughachi “na-anụ / anaghị anụ” na-echekwa usoro Grik. E zere okwu ụka pụrụ iche na nkọwa ozizi nke ederede ahụ ekwughị kpọmkwem.
