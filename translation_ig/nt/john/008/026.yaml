  to: Enwere m ọtụtụ ihe m ga-ekwu ma kpee ikpe banyere unu[a]. Ma Onye zitere m bụ onye eziokwu; ihe ndị m nụrụ n’aka ya, ọ bụ ihe ndị ahụ ka m na-agwa ụwa.[b]
