  text: πολλὰ ἔχω περὶ ὑμῶν λαλεῖν καὶ κρίνειν· ἀλλ’ ὁ πέμψας με ἀληθής ἐστιν, κἀγὼ ἃ ἤκουσα παρ’ αὐτοῦ ταῦτα ⸀λαλῶ εἰς τὸν κόσμον.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/026.yaml
  text: I have many things to say and to judge concerning you[a]. But the one who sent me is true, and what I heard from him[b], these things I speak to the world.
translation:
  language: ig
  text: Enwere m ọtụtụ ihe m ga-ekwu ma kpee ikpe banyere unu[a]. Ma Onye zitere m bụ onye eziokwu; ihe ndị m nụrụ n’aka ya, ọ bụ ihe ndị ahụ ka m na-agwa ụwa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “ihe gbasara unu.”
    reason: lexical_alternative
  - marker: b
    text: 'N’ụzọ dị nso n’usoro Greek: “ihe ndị m nụrụ n’aka ya, ọ bụ ihe ndị ahụ ka m na-agwa ụwa.” Greek kwughachiri “ihe ndị ahụ” iji mesie ya ike.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλὰ
  choice: ọtụtụ ihe
  rationale: Ọ bụ adjective neuter plural e ji mee noun; “ọtụtụ ihe” na-egosipụta ọtụtụ ihe dị iche iche n’ụzọ Igbo doro anya.
- source_word: περὶ ὑμῶν
  choice: banyere unu
  rationale: περί ya na genitive na-egosi isiokwu ma ọ bụ onye okwu metụtara; “banyere unu” bụ asụsụ Igbo nkịtị ma na-edobe nghọta ahụ.
- source_word: λαλεῖν
  choice: m ga-ekwu
  rationale: Infinitive ahụ jikọtara na ἔχω na-egosi na Jizọs nwere ọtụtụ ihe ọ ga-ekwu; usoro a bụ Igbo eke.
- source_word: κρίνειν
  choice: m ga-ekpe unu ikpe banyere ha
  rationale: “Ikpe ikpe” na-edobe obosara κρίνω karịa “ịma ikpe,” nke nwere ike ime ka ọ pụta naanị ikpe ọmụma. A tinyere “banyere ha” iji mee ka njikọ ya na ọtụtụ ihe doo anya n’Igbo.
- source_word: ὁ πέμψας με
  choice: Onye zitere m
  rationale: Articular participle ahụ ghọrọ aha onye n’ụzọ kwesịrị ekwesị; e meghị ka “Nna” pụta ìhè ebe Greek akpọghị ya aha.
- source_word: ἀληθής
  choice: onye eziokwu
  rationale: Nke a na-egosi na onye ahụ bụ eziokwu ma bụrụ onye a pụrụ ịtụkwasị obi, na-enweghị ịkpa ókè n’etiti nghọta abụọ ahụ.
- source_word: ἃ ἤκουσα παρ’ αὐτοῦ
  choice: ihe ndị m nụrụ n’aka ya
  rationale: Ọ na-anọchi anya ọdịnaya ọ natara site n’aka Onye zitere ya; “n’aka ya” bụ usoro Igbo eke maka isi mmalite.
- source_word: ταῦτα
  choice: ọ bụ ihe ndị ahụ ka
  rationale: Usoro emphatic “ọ bụ … ka” na-edobe demonstrative Greek nke na-emeghachi ihe ndị a kpọtụrụla ma na-emesi ha ike.
- source_word: λαλῶ
  choice: m na-agwa
  rationale: Present tense ahụ na-egosi omume ọ na-eme ugbu a; “agwa ụwa” na-egosipụta okwu a na-eziga n’ebe ndị na-anụ ya nọ.
- source_word: εἰς τὸν κόσμον
  choice: ụwa
  rationale: Mgbe ọ gbasoro ngwaa ikwu okwu, εἰς na-egosi ndị a na-agwa okwu; “agwa ụwa” bụ ntụgharị Igbo eke nke “speak to the world.”
theological_decisions:
- issue: Onye okwu ahụ bụ “Onye zitere m” na-ezo aka na ya
  choice: E debere “Onye zitere m” n’enweghị itinye “Nna.”
  alternative: “Nna nke zitere m”
  rationale: Ọnọdụ okwu Jọn na-eme ka onye ahụ doo anya, ma Greek n’onwe ya akpọghị “Nna” aha n’amaokwu a; idebe okwu ahụ otú a na-ezere ịgbakwunye ihe na-adịghị n’ederede.
- issue: Ike nghọta κρίνειν
  choice: “ikpe … ikpe”
  alternative: “ịma … ikpe”
  rationale: κρίνω nwere ike ịpụta ikpebi, ikpe ikpe, ma ọ bụ ịma ikpe. N’ebe a, okwu sara mbara “ikpe ikpe” na-edobe ambiguity ahụ kama ime ka ọ bụrụ naanị ịkatọ ma ọ bụ ikpe ọmụma.
- issue: Nkwughachi emphatic nke ταῦτα
  choice: “ọ bụ ihe ndị ahụ ka”
  alternative: “ihe ahụ ka m na-agwa ụwa”
  rationale: Greek na-emeghachi demonstrative plural n’ụzọ pụtara ìhè. Usoro Igbo emphatic na-edobe nkwughachi na nrụgide ahụ.
translation_notes:
  register: Asụsụ ahụ bụ Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E jiri “unu” debe plural nke ὑμῶν. Usoro “ọ bụ … ka” na-enye nkwusi ike dị n’Igbo ma na-echekwa nkwughachi demonstrative nke Greek.
