  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς· Ἐγὼ δαιμόνιον οὐκ ἔχω, ἀλλὰ τιμῶ τὸν πατέρα μου, καὶ ὑμεῖς ἀτιμάζετέ με.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/049.yaml
  text: Jesus answered[a], “I do not have a demon, but I honor my Father, and you dishonor me.”
translation:
  language: ig
  text: Jizọs zara[a], sị, “Enweghị m mmụọ ọjọọ, kama ana m asọpụrụ Nna m, ma unu na-anapụ m nsọpụrụ.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n’ụzọ na-akọwakwu ihe, “Mmụọ ọjọọ ejighị m.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: zara
  rationale: Nke a bụ okwu Igbo a na-ejikarị akọ nzaghachi n’ụdị mkparịta ụka.
- source_word: Ἐγὼ
  choice: Mụ onwe m
  rationale: Aha nnọchiaha ahụ pụtara ìhè na Grik ma na-enye nkwusi ike; “Mụ onwe m” na-egosipụta nke a n’Igbo eke.
- source_word: δαιμόνιον οὐκ ἔχω
  choice: enweghị mmụọ ọjọọ
  rationale: Ọ na-edobe usoro okwu Grik nke pụtara n’ụzọ nkịtị ‘enweghị mmụọ ọjọọ,’ kama ịkọwa ya ozugbo dị ka ịbụ onye mmụọ ọjọọ ji.
- source_word: τιμῶ
  choice: ana m asọpụrụ
  rationale: “Ịsọpụrụ” na-egosi inye ugwu ma na-echekwa ọdịiche ya na ἀτιμάζω.
- source_word: τὸν πατέρα μου
  choice: Nna m
  rationale: N’ọnọdụ Oziọma Jọn, Jizọs na-ekwu banyere Chineke dị ka Nna ya; mkpụrụedemede ukwu na-egosi aha nsọ a n’enweghị ịgbakwunye nkọwa.
- source_word: ἀτιμάζετέ
  choice: na-akparị
  rationale: “Ịkparị” bụ ụzọ Igbo doro anya e si kwuo ime mmadụ ihere ma ọ bụ ịnapụ ya nsọpụrụ, ma na-emegide “ịsọpụrụ.”
- source_word: με
  choice: m
  rationale: E debere aha nnọchiaha ihe a na-eme ozugbo n’ụzọ Igbo nkịtị.
theological_decisions:
- issue: Ihe “Nna m” na-ezo aka na ya
  choice: E jiri “Nna” nwere mkpụrụedemede ukwu gosi na Jizọs na-ezo aka na Chineke.
  alternative: “nna m” dị ka nna mmadụ nkịtị
  rationale: Ọnọdụ dị na Jọn na-egosi na “Nna m” bụ aha Jizọs ji ezo aka na Chineke; nsụgharị ahụ anaghị etinye nkọwa karịrị ihe ọnọdụ ahụ na-egosi.
- issue: Ihe okwu “enweghị mmụọ ọjọọ” pụtara
  choice: 'E debere akpaala okwu ahụ n’ahịrị bụ isi: “enweghị mmụọ ọjọọ.”'
  alternative: “mmụọ ọjọọ ejighị m”
  rationale: Nhọrọ bụ isi na-anọ Grik nso ma na-echekwa ọdịiche dị n’etiti okwu e dere kpọmkwem na nkọwa ya gbasara ịbụ onye mmụọ ọjọọ ji.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke ugbu a, dị ùgwù ma dị mfe nghọta. E jiri “mmụọ ọjọọ” mee δαιμόνιον n’ụzọ ndị na-agụ Igbo ga-aghọta; e chekwara usoro okwu bụ ‘inwe/enweghị’ kama ịkọwa ya dị ka njide mmụọ.
