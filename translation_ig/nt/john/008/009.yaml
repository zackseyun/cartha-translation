id: JHN.8.9
reference: John 8:9
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: robinson-pierpont-2005-byzantine
  text: Οἱ δὲ ἀκούσαντες, καὶ ὑπὸ τῆς συνειδήσεως ἐλεγχόμενοι, ἐξήρχοντο εἷς καθ' εἷς, ἀρξάμενοι ἀπὸ τῶν πρεσβυτέρων ἕως τῶν ἐσχάτων· καὶ κατελείφθη μόνος ὁ Ἰησοῦς, καὶ ἡ γυνὴ ἐν μέσῳ ἑστῶσα.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/john/008/009.yaml
  text: But those[a] who heard it, being convicted by their conscience, went out one by one, beginning with the older ones down to the last. And Jesus was left alone, with the woman standing in the midst.
translation:
  language: ig
  text: Ma ndị nụrụ ya,[a] ebe akọnuche ha mara ha ikpe, pụọ n’otu n’otu, malite n’aka ndị torogoro afọ ruo ndị ikpeazụ.[b] A hapụrụ naanị Jizọs, nwanyị ahụ ka guzo n’etiti.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Amaokwu a bụ ihe na-aga n’ihu n’akụkọ banyere nwanyị e jidere n’ịkwa iko (Jọn 7:53–8:11). Lee nkọwa dị na Jọn 7:53.
    reason: textual_critical
  - marker: b
    text: Ma ọ bụ, “ruo n’ọgwụgwụ.”
    reason: translation_alternative
lexical_decisions:
- source_word: συνείδησις
  choice: akọnuche
  rationale: Nke a bụ okwu Igbo a na-ejikarị akọwa ikike dị n’ime mmadụ nke na-amata ihe ziri ezi na ihe ọjọọ.
- source_word: ἐλέγχω
  choice: mara ha ikpe
  rationale: N’ebe a, ọ na-egosi na akọnuche ha mere ka ha mata na ikpe dịkwa ha n’ahụ; ntụgharị a na-egosipụta ikpe ime mmụọ ahụ n’asụsụ Igbo dị mfe.
- source_word: πρεσβύτερος
  choice: ndị kacha okenye
  rationale: N’ebe a, okwu ahụ na-egosi ndị toro karịa n’afọ, ọ bụghị aha ọkwá ndị okenye obodo ma ọ bụ chọọchị.
- source_word: ἐξήρχοντο εἷς καθ' εἷς
  choice: ha wee pụọ n’otu n’otu
  rationale: Nke a na-edobe omume na-aga n’ihu na usoro onye otu otu nke Greek.
- source_word: ἐν μέσῳ ἑστῶσα
  choice: onye guzo n’etiti ha
  rationale: Ọ na-egosi ọnọdụ nwanyị ahụ ka o guzo n’etiti ebe ahụ; ‘ha’ na-eme ka okwu ahụ bụrụ Igbo eke, ma ntụaka ya nwere ike ịbụ ndị nọ ebe ahụ.
theological_decisions:
- issue: Mmetụta akọnuche na ikpe ọmụma
  choice: akọnuche ha mara ha ikpe
  alternative: ihe ha nụrụ mere ka ha mata mmehie ha
  rationale: E debere συνειδήσεως na ἐλεγχόμενοι n'ụzọ doro anya, n’enweghị ịkọwapụta kpọmkwem mmehie ha ma ọ bụ onye kpatara ikpe ahụ karịa ihe Greek kwuru.
- issue: Njirimara πρεσβύτεροι
  choice: ndị kacha okenye
  alternative: ndị okenye
  rationale: Nkọrịta ya na ‘ndị ikpeazụ’ na-akwado afọ ndụ karịa ọkwá okpukpe ma ọ bụ ọchịchị.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị ugwu ma doo ndị mmadụ taa anya. E ji ‘Jizọs’ dịka nsụgharị aha a na-ahụkarị. Akara ndetu ukwu [a] na [b] dị n’ederede isi, a hapụghịkwa mgbagwoju anya nke ‘ndị ikpeazụ’ kpamkpam.
