revisions:
- from: Ma mgbe ha nụrụ ya,[a] akọnuche ha mara ha ikpe, ha wee pụọ n’otu n’otu, malite n’aka ndị kacha okenye ruo n’aka ndị ikpeazụ.[b] A hapụrụ naanị Jizọs na nwanyị ahụ, onye guzo n’etiti ha.
  to: Ma ndị nụrụ ya,[a] ebe akọnuche ha mara ha ikpe, pụọ n’otu n’otu, malite n’aka ndị torogoro afọ ruo ndị ikpeazụ.[b] A hapụrụ naanị Jizọs, nwanyị ahụ ka guzo n’etiti.
  rationale: The revision restores the Greek contrastive subject (‘But those who heard’), retains the passive moral force of conscience-based conviction, distinguishes age/seniority from an official title, and translates ‘standing in the midst’ without adding ‘among them.’ Footnote b is adjusted to avoid changing the Greek plural into a singular person while preserving the possible sense of ἕως.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T06:22:35Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the conscience-driven conviction and the successive departure. However, “mgbe” (‘when’) weakens the Greek’s connective “but those who heard,” and “n’etiti ha” adds a referent (‘among them’) not stated by ἐν μέσῳ; those people have just departed. The age-related sense of πρεσβυτέρων is better expressed without the potentially office-like “ndị okenye” or the superlative force of “kacha okenye.”
  naturalness: The revised wording is idiomatic Standard Igbo while retaining the source’s compact narrative progression.
  terminology: “Akọnuche ha mara ha ikpe” is an apt and natural rendering of ὑπὸ τῆς συνειδήσεως ἐλεγχόμενοι. “Ndị torogoro afọ” clearly indicates age/seniority rather than an ecclesial or civic office. “Jizọs” is standard.
  issues:
  - severity: medium
    issue: “mgbe ha nụrụ ya” renders the opening as a temporal clause.
    rationale: Οἱ δὲ ἀκούσαντες means ‘but those who heard [it]’; the temporal rendering obscures the contrastive subject construction.
  - severity: medium
    issue: “n’etiti ha” supplies an unsupported referent.
    rationale: ἐν μέσῳ means ‘in the midst’; it does not say ‘among them,’ and the preceding clause says the others went out.
  - severity: low
    issue: “ndị kacha okenye” is overly superlative.
    rationale: πρεσβυτέρων denotes older/senior people in this context, not necessarily the absolutely oldest persons. The alternative wording also makes the intended age sense explicit.
  - severity: low
    issue: Footnote b’s singular “onye ikpeazụ” does not match the plural Greek expression.
    rationale: τῶν ἐσχάτων is plural; an alternative should preserve that number or be omitted.
  revised_text: Ma ndị nụrụ ya,[a] ebe akọnuche ha mara ha ikpe, pụọ n’otu n’otu, malite n’aka ndị torogoro afọ ruo ndị ikpeazụ.[b] A hapụrụ naanị Jizọs, nwanyị ahụ ka guzo n’etiti.
  revised_footnotes:
  - marker: a
    text: Amaokwu a bụ ihe na-aga n’ihu n’akụkọ banyere nwanyị e jidere n’ịkwa iko (Jọn 7:53–8:11). Lee nkọwa dị na Jọn 7:53.
    reason: textual_critical
  - marker: b
    text: Ma ọ bụ, “ruo n’ọgwụgwụ.”
    reason: translation_alternative
  revision_rationale: The revision restores the Greek contrastive subject (‘But those who heard’), retains the passive moral force of conscience-based conviction, distinguishes age/seniority from an official title, and translates ‘standing in the midst’ without adding ‘among them.’ Footnote b is adjusted to avoid changing the Greek plural into a singular person while preserving the possible sense of ἕως.
