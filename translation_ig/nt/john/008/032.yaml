    rationale: With the future form ga-amata, the enclitic should be written as ‘ga-amatakwa.’ This also makes the relation to the first καί clearer.
  - severity: low
    issue: Footnote a does not offer a meaningfully distinct lexical alternative to the corrected main wording, and footnote b shifts from the addressed plural ‘unu’ to third-person ‘ha.’
    rationale: The first note can be omitted rather than retain a weak alternative. In the contextual note, ‘unu’ should agree with the verse’s direct address.
