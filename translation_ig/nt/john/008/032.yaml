  text: καὶ γνώσεσθε τὴν ἀλήθειαν, καὶ ἡ ἀλήθεια ἐλευθερώσει ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/032.yaml
  text: and you will know the truth[b][a], and the truth will set you free.
translation:
  language: ig
  text: Unu ga-amatakwa eziokwu ahụ, eziokwu ahụ ga-emekwa ka unu nwee onwe unu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Amaokwu a n’onwe ya ekwughị kpọmkwem ihe a na-eme ka unu nwee onwe unu na ya; okwu ndị gbara ya gburugburu jikọtara nnwere onwe ahụ na nnwere onwe pụọ ná mmehie.
    reason: cross_reference
lexical_decisions:
- source_word: γνώσεσθε
  choice: unu ga-amakwa
  rationale: Ọ bụ ngwaa na-egosi ihe ga-eme n’ọdịnihu. “Unu ga-amakwa” na-asụgharị ya n’ụzọ kwụ ọtọ ma dịkwa mfe nghọta; “-kwa” na-ejigide καὶ nke mbụ ma jikọta okwu a na amaokwu bu ya ụzọ.
- source_word: ἀλήθειαν / ἀλήθεια
  choice: eziokwu ahụ
  rationale: E tinyere mkpụrụokwu na-akọwapụta aha n’ebe abụọ ahụ n’asụsụ Grik. “Eziokwu ahụ” na-egosi na ọ bụ eziokwu a kapịrị ọnụ ma na-ejigide nkwughachi dị n’isi mmalite.
- source_word: ἐλευθερώσει
  choice: ga-emekwa ka unu nwere onwe unu
  rationale: Nkebiokwu a na-egosi ime ka mmadụ bụrụ onye nweere onwe ya, n’enweghị ịtinye kpọmkwem ihe a tọhapụrụ ya na ya. Ọ na-ejigidekwa καὶ nke abụọ site na “-kwa.”
- source_word: ὑμᾶς
  choice: unu
  rationale: Nnochiaha Grik a na-ekwu maka ọtụtụ mmadụ; “unu” na-egosi nke ahụ nke ọma n’Igbo.
- source_word: καὶ ... καὶ
  choice: -kwa ... -kwa
  rationale: Iji “-kwa” ugboro abụọ na-ejigide njikọ na usoro ahịrịokwu Grik n’ụzọ na-ada ka Igbo ebumpụta ụwa.
theological_decisions:
- issue: Ụdị nnwere onwe dị n’okwu ahụ bụ “eziokwu ahụ ga-eme ka unu nwere onwe unu”
  choice: A kọwaghị n’isi okwu ma nnwere onwe ahụ ọ̀ bụ nke ndọrọ ndọrọ ọchịchị, nke uche, ma ọ bụ nke mmụọ.
  alternative: “Eziokwu ahụ ga-atọhapụ unu ná mmehie.”
  rationale: Ọ bụ ezie na amaokwu ndị na-esote jikọtara nnwere onwe a na mmehie, amaokwu a n’onwe ya ekwughị ihe a na-atọhapụ mmadụ na ya. Nsụgharị ahụ na-ahapụ ihe a n’ụdị sara mbara dịka isi mmalite si mee.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. “Unu” mere ka ọnụọgụ ọtụtụ dị n’asụsụ Grik pụta ìhè; e jighị okwu ụka pụrụ iche ma ọ bụ nkọwa nke otu òtù okpukpe.
