  text: τίς ἐξ ὑμῶν ἐλέγχει με περὶ ἁμαρτίας; ⸀εἰ ἀλήθειαν λέγω, διὰ τί ὑμεῖς οὐ πιστεύετέ μοι;
base_translation:
  language: en
  yaml_path: translation/nt/john/008/046.yaml
  text: Which one of you convicts me of sin? If I speak the truth[c][b][a], why do you not believe me?
translation:
  language: ig
  text: Ònye n’ime unu pụrụ igosi na mmehie mara m?[a] Ọ bụrụ na m na-ekwu eziokwu, gịnị mere unu ekweghị m?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ịsụgharị ya: “Ònye n’ime unu pụrụ igosi na m mere mmehie?”'
    reason: lexical_alternative
  - marker: b
    text: 'Ma ọ bụ: “gịnị mere unu atụkwasịghị m obi?” Okwu Grik ahụ nwere ike ịpụta ma ikwere ihe mmadụ kwuru ma ịtụkwasị onye ahụ obi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τίς ἐξ ὑμῶν
  choice: Ònye n’ime unu
  rationale: Nke a bụ ụzọ Igbo nkịtị si jụọ ‘onye n’etiti unu,’ ma na-edobe aka mgba Jizọs na-agba ndị na-ege ya ntị.
- source_word: ἐλέγχει
  choice: pụrụ igosi na ikpe ... mara
  rationale: Ngwaa Grik a nwere ike ịpụta ikpughe, ịbara mba, ma ọ bụ igosi na onye ikpe mara. N’ebe a, okwu ikpe dabara n’ụdị ajụjụ a ma doo ndị Igbo anya.
- source_word: περὶ ἁμαρτίας
  choice: ikpe mmehie
  rationale: Nkebiokwu a na-ezo aka na mmehie n’ozuzu ya. N’Igbo, ijikọ ya na ‘ikpe ... mara’ na-eme ka ahịrịokwu ahụ bụrụ nke e ji asụ asụ ma ghara ịkpọpụta otu mmehie pụrụ iche.
- source_word: εἰ ἀλήθειαν λέγω
  choice: Ọ bụrụ na m na-ekwu eziokwu
  rationale: A hapụrụ ọnọdụ ‘ọ bụrụ’ dị ka ọ dị na Grik, n’agbanyeghị na ajụjụ ahụ na-egosi na Jizọs na-ekwu eziokwu.
- source_word: διὰ τί
  choice: gịnị mere
  rationale: Nke a bụ ụzọ Igbo doro anya na nke a na-ejikarị ajụ ihe kpatara ihe.
- source_word: πιστεύετέ μοι
  choice: unu ekweghị m
  rationale: ‘Ikwere mmadụ’ nwere ike ibu echiche nke ikwere ihe ọ na-ekwu na ịtụkwasị ya obi; ya mere, ọ na-edobe obosara echiche nke Grik.
theological_decisions:
- issue: Ike ajụjụ Jizọs banyere enweghị mmehie ya na eziokwu okwu ya
  choice: A sụgharịrị ajụjụ abụọ ahụ ozugbo, n’etinyeghị nkọwa ga-eme ka ihe ha na-egosi bụrụ okwu a kwupụtara hoo haa.
  alternative: ‘Ònye n’ime unu pụrụ igosi na ikpe mmehie ọ bụla mara m?’ ma ọ bụ ịsụgharị εἰ dị ka ‘ebe ọ bụ na.’
  rationale: Ụdị a na-edobe nkwupụta Kraịst nke dị n’ajụjụ ahụ na esemokwu dị n’etiti ‘ọ bụrụ’ nke ụtọasụsụ Grik na nkwenye okwu ahụ na-egosi, na-enweghị itinye nkọwa okpukpe ọzọ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta. ‘Ikpe mmehie mara m’ na-enye ajụjụ ahụ ụda ikpe o nwere, ebe ‘unu ekweghị m’ na-edobe ma akụkụ ịnakwere okwu Jizọs ma akụkụ ịtụkwasị ya obi.
