review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the two Greek rhetorical questions, the conditional εἰ ('Ọ bụrụ na'), and πιστεύειν with a personal dative ('unu ekweghị m'). However, 'ikpe mmehie mara m' does not naturally express ἐλέγχει με περὶ ἁμαρτίας and introduces an awkward, potentially different sense involving a judgment or sentence.
  naturalness: Removing 'ikpe' yields the idiomatic Igbo judicial expression 'igosi na mmehie mara m' ('show that I am guilty of sin'). The remainder is clear, modern Standard Igbo and appropriately direct.
  terminology: ‘Mmehie’ correctly renders ἁμαρτία. ‘Eziokwu’ and ‘kwere m’ are suitable, established terms and preserve the Greek’s breadth without doctrinal expansion.
  issues:
  - severity: medium
    issue: ‘ikpe mmehie mara m’ is unnatural and semantically imprecise.
    rationale: The Greek asks who can establish/prove Jesus guilty with respect to sin. In Igbo, ‘ikpe ... mara m’ can suggest that a judgment or sentence has come upon him, rather than that guilt of sin is demonstrably his. ‘Mmehie mara m’ directly states the intended guilt idiom.
  revised_text: Ònye n’ime unu pụrụ igosi na mmehie mara m?[a] Ọ bụrụ na m na-ekwu eziokwu, gịnị mere unu ekweghị m?[b]
