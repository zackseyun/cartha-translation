revisions:
- from: Ọ nọkwa na-agwa ha, sị, “Unu si n’ala[a]; mụ onwe m si n’elu. Unu si n’ụwa a[b]; mụ onwe m esighị n’ụwa a.”
  to: Ọ nọ na-agwa ha sị, “Unu sitere n’okpuru[a]; mụ onwe m sitere n’elu. Unu sitere n’ụwa a[b]; mụ onwe m esiteghị n’ụwa a.”
  rationale: The revision preserves the Greek imperfect, emphatic contrast, source terminology, and Johannine vertical imagery, while using more natural Standard Igbo. It makes no claim beyond the ambiguity of the source regarding the precise theological force of ‘below,’ ‘above,’ and ‘world.’
  reviewer_model: gpt-5.6-terra
