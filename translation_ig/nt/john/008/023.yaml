source:
  edition: SBLGNT
  text: καὶ ⸀ἔλεγεν αὐτοῖς· Ὑμεῖς ἐκ τῶν κάτω ἐστέ, ἐγὼ ἐκ τῶν ἄνω εἰμί· ὑμεῖς ἐκ ⸂τούτου τοῦ κόσμου⸃ ἐστέ, ἐγὼ οὐκ εἰμὶ ἐκ τοῦ κόσμου τούτου.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/023.yaml
  text: And he was saying to them[a], “You are from below; I am from above. You are from this world[b]; I am not from this world.”
translation:
  language: ig
  text: Ọ nọ na-agwa ha sị, “Unu sitere n’okpuru[a]; mụ onwe m sitere n’elu. Unu sitere n’ụwa a[b]; mụ onwe m esiteghị n’ụwa a.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Unu bụ ndị si n’okpuru … mụ onwe m bụ onye si n’elu.”
    reason: lexical_alternative
  - marker: b
    text: N’akwụkwọ Jọn, “ụwa” anaghị abụkarị naanị ala anyị bi na ya; ọ na-ezokwa aka n’usoro ndụ ụmụ mmadụ nke kewapụrụ onwe ya n’ebe Chineke nọ.
    reason: cultural_note
lexical_decisions:
- source_word: ἔλεγεν
  choice: Ọ nọkwa na-agwa
  rationale: Ọdịdị imperfect na-egosi okwu na-aga n’ihu n’ọnọdụ a; ‘nọkwa na-agwa’ na-edobe akụkụ ahụ nke ngwaa ma na-ejikọta καί n'ụzọ Igbo kwụ ọtọ.
- source_word: Ὑμεῖς / ἐγὼ
  choice: Unu / mụ onwe m
  rationale: A na-edobe nnọchiaha ndị Greek kwusiri ike iji mee ka ọdịiche dị n’etiti ndị na-ege Jizọs ntị na ya onwe ya pụta ìhè.
- source_word: ἐκ τῶν κάτω
  choice: si n’ala
  rationale: Nke a na-edobe echiche isi mmalite na ihe atụ nke ala megide elu, n’ebughị ụzọ kọwaa ya dị ka ikpe omume ma ọ bụ mpaghara mmụọ kpọmkwem.
- source_word: ἐκ τῶν ἄνω
  choice: si n’elu
  rationale: Ọ dabara n’ụzọ doro anya na ‘si n’ala’ ma na-echekwa ihe atụ kwụ ọtọ nke akwụkwọ Jọn.
- source_word: κόσμος
  choice: ụwa
  rationale: ‘Ụwa’ bụ okwu Igbo sara mbara nke nwere ike ịpụta ụwa e kere eke ma ọ bụ usoro mmadụ nke kewapụrụ onwe ya n’ebe Chineke nọ, dị ka ọnọdụ okwu Jọn si achọ.
- source_word: τούτου τοῦ κόσμου / τοῦ κόσμου τούτου
  choice: ụwa a
  rationale: A na-edobe okwu ngosi τούτου n’ụdị Igbo nkịtị ma doo anya.
- source_word: οὐκ εἰμὶ ἐκ τοῦ κόσμου τούτου
  choice: mụ onwe m esighị n’ụwa a
  rationale: ‘Esighị’ na-edobe ἐκ dị ka isi mmalite, kama ịgbanwe ya naanị ka ọ bụrụ ịbụ onye otu ma ọ bụ ịkwado usoro ụwa.
theological_decisions:
- issue: Ihe ọdịiche ‘si n’ala/si n’elu’ na ‘si n’ụwa a’ pụtara
  choice: E debere asụsụ nke isi mmalite na mpaghara n’enweghị ịgbasa ya ka ọ bụrụ nkọwa ozizi zuru ezu.
  alternative: A pụrụ ịsụgharị ya n’ụzọ na-akọwapụta ya ozugbo dị ka ọdịiche omume, ma ọ bụ dị ka ‘nke mpaghara eluigwe’ megide ‘nke mpaghara ụwa.’
  rationale: Greek na-enye ọdịiche siri ike nke akwụkwọ Jọn, ma ọ naghị akọwa ihe atụ ahụ n’amaokwu a ruo n’ókè nke ịkpọ ya naanị ọdịiche omume ma ọ bụ ebe. Nsụgharị ahụ na-echekwa esemokwu nkà mmụta okpukpe na ọdịiche gbasara onye Kraịst bụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. ‘Mụ onwe m’ na-enye ἐγώ nkwusi ike, ebe ‘si n’ala/si n’elu’ na-echekwa nha anya na ihe atụ nke Greek.
