id: JHN.8.31
reference: John 8:31
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἔλεγεν οὖν ὁ Ἰησοῦς πρὸς τοὺς πεπιστευκότας αὐτῷ Ἰουδαίους· Ἐὰν ὑμεῖς μείνητε ἐν τῷ λόγῳ τῷ ἐμῷ, ἀληθῶς μαθηταί μού ἐστε,
base_translation:
  language: en
  yaml_path: translation/nt/john/008/031.yaml
  text: So Jesus was saying to the Jews who had believed him[a], “If you remain in my word, you are truly my disciples,”
translation:
  language: ig
  text: Ya mere, Jizọs nọ na-agwa ndị Juu ahụ kweere ya[a] sị, “Ọ bụrụ na unu anọgide n'okwu m, unu bụ ndị na-eso ụzọ m n'ezie.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị Juu ahụ kwere na ya.” N'ụzọ nkịtị, Grik kwuru, “ndị Juu ahụ kweere ya.”
    reason: alternative_reading
lexical_decisions:
- source_word: Ἔλεγεν
  choice: nọ na-agwa
  rationale: Ụdị ngwaa imperfect na-egosi okwu a nọ na-aga n'oge gara aga; “nọ na-agwa” na-echekwa ọdịdị ahụ karịa naanị “gwara.”
- source_word: οὖν
  choice: Ya mere
  rationale: Ọ na-ejikọta okwu a na ihe bu ya ụzọ ma na-egosi nsonaazụ ma ọ bụ nzaghachi, n'Igbo doro anya.
- source_word: πρὸς τοὺς πεπιστευκότας αὐτῷ Ἰουδαίους
  choice: ndị Juu ahụ kweere ya
  rationale: “Kweere ya” na-edobe dative αὐτῷ n'ụzọ kpọmkwem, n'etinyeghị echiche sara mbara nke “kwere na ya” n'ime isi ederede. “H ahụ” na-egosi ìgwè ndị a kpọtụrụ aha kpọmkwem.
- source_word: Ἐὰν
  choice: Ọ bụrụ na
  rationale: Nke a bụ ụzọ Igbo nkịtị na doro anya isi webata ọnọdụ.
- source_word: ὑμεῖς
  choice: unu
  rationale: Nnọchiaha ahụ pụtara ìhè na Grik, ya mere e debere ya; “unu” gosikwara na a na-agwa ọtụtụ mmadụ okwu.
- source_word: μείνητε
  choice: anọgide
  rationale: Ọ na-egosi ịnọgide ma ọ bụ ịga n'ihu, ma na-edobe echiche Jọn nke ịrapara n'ihe n'enweghị okwu ochie ma ọ bụ nke siri ike.
- source_word: ἐν τῷ λόγῳ τῷ ἐμῷ
  choice: n'okwu m
  rationale: “Okwu” na-echekwa λόγος na ụda okwu pụrụ iche nke Jọn, ebe ọ ka nwere ike ịpụta ozi ma ọ bụ nkuzi Jizọs.
- source_word: ἀληθῶς
  choice: n'ezie
  rationale: Ọ na-egosi eziokwu na ịbụ ezigbo ndị na-eso ụzọ n'ụzọ dị mkpirikpi ma kwekọọ n'Igbo ugbu a.
- source_word: μαθηταί μού ἐστε
  choice: unu bụ ndị na-eso ụzọ m
  rationale: “Ndị na-eso ụzọ” bụ okwu Igbo doro anya na nke a na-aghọta nke ọma maka μαθηταί n'ọnọdụ Oziọma.
theological_decisions:
- issue: Ntughari πιστεύω ya na dative αὐτῷ
  choice: ndị Juu ahụ kweere ya
  alternative: ndị Juu ahụ kwere na ya
  rationale: Grik ji dative αὐτῷ mee ihe, ọ bụghị εἰς. Isi ederede na-edobe echiche kpọmkwem nke ikwere ihe ọ kwuru, ebe ihe ọzọ nwere ike igosi ntụkwasị obi n'ime ya n'ụzọ sara mbara. E tinyere nke ọzọ n'ala peeji ka a ghara ikpochapụ mgbagwoju anya ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “Nọ na-agwa” na-echekwa ọdịdị imperfect; “n'okwu m” na-edobe okwu Jọn; a hapụrụ ọdịiche dị n'etiti “kweere ya” na “kwere na ya” ka ọ pụta ìhè site n'ala peeji.
