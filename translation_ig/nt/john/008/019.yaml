id: JHN.8.19
reference: John 8:19
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἔλεγον οὖν αὐτῷ· Ποῦ ἐστιν ὁ πατήρ σου; ἀπεκρίθη Ἰησοῦς· Οὔτε ἐμὲ οἴδατε οὔτε τὸν πατέρα μου· εἰ ἐμὲ ᾔδειτε, καὶ τὸν πατέρα μου ⸂ἂν ᾔδειτε⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/019.yaml
  text: So they were saying to him[a], “Where is your Father?” Jesus answered, “You know neither me nor my Father. If you knew me, you would know my Father also.”
translation:
  language: ig
  text: Ya mere, ha nọ na-ajụ ya, “Olee ebe Nna gị nọ?” Jizọs zara, “Unu amaghị m, unu amaghịkwa Nna m. A sị na unu maara m, unu ga-amarakwa Nna m.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ịsụgharị ya n’ụzọ na-eme ka ọnọdụ megidere eziokwu pụta ìhè karịa: “A sị na unu amarala m, unu gaara amarala Nna m.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγον
  choice: ha nọ na-ajụ ya
  rationale: Ụdị ngwaa imperfect na-egosi okwu na-aga n’ihu ma ọ bụ nke a na-ekwu ugboro ugboro. Ebe okwu e hotara bụ ajụjụ, ‘ha nọ na-ajụ ya’ na-egosipụta ma akụkụ ngwaa ahụ ma ụdị okwu ahụ n’Igbo nkịtị.
- source_word: οὖν
  choice: Ya mere
  rationale: Nke a na-ejikọta ajụjụ ahụ na ihe bu ya ụzọ ma na-egosipụta nsonaazụ ma ọ bụ n’ịga n’ihu nke arụmụka ahụ.
- source_word: Ποῦ ἐστιν ὁ πατήρ σου;
  choice: Olee ebe Nna gị nọ?
  rationale: ‘Olee ebe … nọ?’ bụ ụzọ Igbo sitere n’okike ajụ ebe mmadụ nọ. E ji mkpụrụedemede ukwu dee ‘Nna’ n’ihi na ihe a na-ekwu n’akụkọ Jọn bụ Chineke.
- source_word: Οὔτε ἐμὲ οἴδατε οὔτε τὸν πατέρα μου
  choice: Unu amaghị m, unu amaghịkwa Nna m
  rationale: Ntughari a na-echekwa ngọnarị abụọ nke οὔτε…οὔτε n’Igbo doro anya, n’enweghị itinye nkọwa ọzọ banyere ụdị ‘ịma’ a na-ekwu.
- source_word: οἶδατε / ᾔδειτε
  choice: amaghị / maara
  rationale: Ngwaa ‘ịma’ sara mbara nke ọma iji chekwaa njikọ okwu ahụ n’etiti ịma Jizọs na ịma Nna, n’ebughị ụzọ kpebie ma ọ bụ naanị nghọta, nnabata, ka ọ bụ mmekọrịta.
- source_word: εἰ ἐμὲ ᾔδειτε, καὶ τὸν πατέρα μου ἂν ᾔδειτε
  choice: A sị na unu maara m, unu ga-amarakwa Nna m
  rationale: ‘A sị na… ga-…’ na-egosi ọnọdụ na-abụghị eziokwu ugbu a n’Igbo dị ndụ. ‘-kwa’ na ngwaa nke abụọ na-anọchi καί (‘ọzọkwa’/‘kwa’).
- source_word: πατήρ / πατέρα μου
  choice: Nna / Nna m
  rationale: ‘Nna’ bụ okwu Igbo kwụ ọtọ; ide ya na mkpụrụedemede ukwu na-egosi na ebe a ọ na-ezo aka na Chineke n’enweghị ịgbakwunye aha ọhụrụ.
theological_decisions:
- issue: Ma a ga-eji mkpụrụedemede ukwu dee ‘Nna’ mgbe ọ na-ezo aka na Chineke
  choice: E dere ‘Nna’ na mkpụrụedemede ukwu n’ebe abụọ ahụ.
  alternative: nna / nna m
  rationale: Ọnọdụ okwu n’Oziọma Jọn na-egosi na Nna Jizọs bụ Chineke. Mkpụrụedemede ukwu na-enyere onye na-agụ aka ịhụ onye okwu ahụ na-ezo aka na ya, ma ọ naghị agbanwe ihe okwu Grik pụtara.
- issue: Ihe ‘ịma’ Jizọs na Nna pụtara
  choice: E ji okwu sara mbara bụ ‘ịma’.
  alternative: ịghọta; ịmata onye ọ bụ; inwe mmekọrịta na
  rationale: Okwu ahụ nwere ike ibu echiche nke ịmata, ịghọta, na mmekọrịta. ‘Ịma’ na-echekwa obosara na esemokwu nkà mmụta okpukpe nke okwu Jọn kama ịkọwa ya n’otu ụzọ naanị.
- issue: Ụdị ọnọdụ dị n’ahịrịokwu ikpeazụ
  choice: 'E gosipụtara ya dị ka ọnọdụ na-abụghị eziokwu ugbu a: ‘A sị na unu maara m, unu ga-amarakwa…’'
  alternative: A sị na unu amarala m, unu gaara amarala Nna m
  rationale: Imperfect na ἄν nwere ike igosi ọnọdụ megidere eziokwu, ma ihe a na-elekwasị anya bụ enweghị ihe ọmụma ha ugbu a. Isi ederede na-echekwa nke a; ihe odide ala peeji na-egosi ntụgharị nwere ụda oge gara aga.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. ‘Ha nọ na-ajụ ya’ na-echekwa akụkụ imperfect n’ụzọ sitere n’okike; ‘A sị na… ga-…’ na-egosi ọnọdụ megidere eziokwu ugbu a. E debere akara odide ala peeji [a] ozugbo n’azụ ahịrịokwu ọ na-akọwa.
