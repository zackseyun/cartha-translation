revisions:
- from: Ndị Juu zara ya sị ya, “Ọ̀ bụ na anyị ekwughị eziokwu mgbe anyị kwuru na ị bụ onye Sameria, na i nwere mmụọ ọjọọ?[a][b]”
  to: Ndị Juu[a] zara ya, sị, “Ànyị ò kwughị nke ọma[b] mgbe anyị sịrị na ị bụ onye Sameria nakwa na i nwere mmụọ ọjọọ[c]?”
  rationale: The revision replaces an overly broad truth-telling expression with a standard Igbo rendering of “speak rightly,” smooths the paired speech verbs, and restores distinct anchors for the contextual note on οἱ Ἰουδαῖοι, the alternative wording of καλῶς λέγομεν, and the literal wording of δαιμόνιον ἔχεις. It does not resolve the accusation into a doctrinal claim or narrow the referent of “Ndị Juu” in the main text.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T06:23:04Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly retains the two speech verbs, the rhetorical question, “a Samaritan,” and the literal predicate “you have a demon.” However, “anyị ekwughị eziokwu” means “did we not tell the truth,” whereas καλῶς λέγομεν asks whether they speak rightly/correctly. The main text should preserve that narrower sense.
  naturalness: “Ndị Juu zara ya sị ya” is understandable, but “Ndị Juu zara ya, sị” is smoother standard Igbo narrative style. “Ànyị ò kwughị nke ọma mgbe anyị sịrị...” naturally conveys the Greek rhetorical question without adding interpretive content.
  terminology: “Ndị Juu,” “onye Sameria,” and “mmụọ ọjọọ” are appropriate. The note on Ndị Juu should retain the contextual qualification without redefining the main text. Footnotes should distinguish the alternative for καλῶς from the lexical note on δαιμόνιον ἔχεις.
  issues:
  - severity: medium
    issue: “ekwughị eziokwu” overtranslates καλῶς λέγομεν.
    rationale: The expression concerns speaking correctly/rightly, not specifically truth-telling. “Kwughị nke ọma” or “kwuo okwu n’ụzọ ziri ezi” more closely represents the Greek.
  - severity: low
    issue: The draft lacks a footnote for the alternative rendering of the rhetorical phrase and assigns [b] only to the demon expression.
    rationale: The English audit trail identifies both a lexical alternative for Οὐ καλῶς λέγομεν and one for δαιμόνιον ἔχεις. Separate, locally anchored notes preserve these distinctions.
  revised_text: Ndị Juu[a] zara ya, sị, “Ànyị ò kwughị nke ọma[b] mgbe anyị sịrị na ị bụ onye Sameria nakwa na i nwere mmụọ ọjọọ[c]?”
