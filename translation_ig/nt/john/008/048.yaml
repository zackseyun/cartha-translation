  text: ⸀Ἀπεκρίθησαν οἱ Ἰουδαῖοι καὶ εἶπαν αὐτῷ· Οὐ καλῶς λέγομεν ἡμεῖς ὅτι Σαμαρίτης εἶ σὺ καὶ δαιμόνιον ἔχεις;
base_translation:
  language: en
  yaml_path: translation/nt/john/008/048.yaml
  text: The Jews answered and said to him[c][b][a], “Are we not right in saying that you are a Samaritan and have a demon?”
translation:
  language: ig
  text: Ndị Juu[a] zara ya, sị, “Ànyị ò kwughị nke ọma[b] mgbe anyị sịrị na ị bụ onye Sameria nakwa na i nwere mmụọ ọjọọ[c]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’ọnọdụ ụfọdụ, a pụkwara ịsụgharị ya “ndị Judia” ma ọ bụ “ndị isi Juu.” N’Oziọma Jọn, “Ndị Juu” na-ezokarị aka n’otu ndị kpọmkwem na-emegide Jizọs, ọ bụghị ndị Juu niile n’enweghị oke.
    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ, “Ànyị ò na-ekwu okwu n’ụzọ ziri ezi...?”
    reason: lexical_alternative
  - marker: c
    text: N’ụzọ nkịtị, “i nwere mmụọ ọjọọ”; ụfọdụ nsụgharị na-akọwa ya karịa dịka “mmụọ ọjọọ ji gị.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπεκρίθησαν
  choice: zara
  rationale: Ngwaa a bụ ụdị deponent nke pụtara ‘zara’; ọ dabara n’akụkọ a n’ụzọ nkịtị.
- source_word: οἱ Ἰουδαῖοι
  choice: Ndị Juu
  rationale: Nke a na-esochi okwu Grik kpọmkwem, na-agaghị akpọchi ya naanị n’ebe ndị isi Juu ma ọ bụ ndị Judia nọ.
- source_word: εἶπαν αὐτῷ
  choice: sị ya
  rationale: Ọ na-edobe ngwaa okwu nke abụọ dị na Grik, ọ bụkwa ụzọ Igbo si akọ okwu n’ụzọ nkịtị mgbe e kwuchara ‘zara ya.’
- source_word: Οὐ καλῶς λέγομεν ἡμεῖς
  choice: Ọ̀ bụ na anyị ekwughị eziokwu mgbe anyị kwuru
  rationale: Nke a na-egosipụta ajụjụ nkwupụta nke na-atụ anya azịza nkwenye, ma na-enye καλῶς echiche nke ikwu ihe n’ụzọ ziri ezi.
- source_word: Σαμαρίτης
  choice: onye Sameria
  rationale: Ọ bụ aha agbụrụ na okpukpe e ji mee mkparị n’ebe a; ‘onye Sameria’ bụ okwu Igbo doro anya.
- source_word: δαιμόνιον ἔχεις
  choice: i nwere mmụọ ọjọọ
  rationale: Ọ na-edobe usoro Grik nke pụtara ‘i nwere mmụọ ọjọọ,’ kama ịkọwa ya karịa ka ‘mmụọ ọjọọ ji gị.’
theological_decisions:
- issue: Onye okwu οἱ Ἰουδαῖοι na-ezo aka na ya n’Oziọma Jọn
  choice: Ndị Juu
  alternative: Ndị Judia; ndị isi Juu
  rationale: Isi ederede na-edobe okwu Grik n’enweghị ibubata nkọwa dị warara. Ihe odide ala na-akọwa na n’akụkọ Jọn okwu a na-ezokarị aka n’otu ndị na-emegide Jizọs, ọ bụghị ndị Juu niile.
- issue: Uzo e si sụgharị δαιμόνιον ἔχεις
  choice: i nwere mmụọ ọjọọ
  alternative: mmụọ ọjọọ ji gị
  rationale: Nhọrọ a na-esochi okwu Grik nso ma na-ezere ịkọwapụta ogo ma ọ bụ ụdị njide ahụ karịa ihe isi mmalite kwuru.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke oge a, dị ùgwù ma dị mfe nghọta. E debere ụdị akụkọ ‘zara ya sị ya’ iji gosipụta ngwaa abụọ nke Grik n’ụzọ Igbo kwekọrọ ekwekọ. Akara [a] na [b] dị n’isi ederede.
