  text: ὑμεῖς κατὰ τὴν σάρκα κρίνετε, ἐγὼ οὐ κρίνω οὐδένα.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/015.yaml
  text: You judge according to the flesh[a]; I judge no one.
translation:
  language: ig
  text: Unu na-ekpe ikpe n’anụ ahụ[a]; ma mụ onwe m anaghị ekpe onye ọ bụla ikpe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “site n’ụkpụrụ mmadụ” ma ọ bụ “site n’ihe a na-ahụ anya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς
  choice: Unu
  rationale: Nnọchiaha onye nke abụọ n’ọnụọgụ dị ọtụtụ pụtara ìhè na Grik ma na-emegide ἐγώ; “Unu” bụ nsụgharị doro anya ma kwekọọ na Igbo nkịtị.
- source_word: κατὰ τὴν σάρκα
  choice: dị ka anụ ahụ si dị
  rationale: Nke a na-edobe okwu σάρξ (“anụ ahụ”) na ihe mgbagwoju anya dị n’okwu Jọn, kama ịkọwa ya naanị dị ka ọdịdị elu ma ọ bụ ụkpụrụ mmadụ; e tinyere nkọwa ndị ahụ n’ala peeji.
- source_word: κρίνετε
  choice: na-ekpe ikpe
  rationale: Ọ na-egosi omume dị ugbu a nke onye nke abụọ n’ọnụọgụ dị ọtụtụ; “na-ekpe ikpe” bụ ụzọ Igbo si kwuo ya n’ụzọ eke na nke ziri ezi.
- source_word: ἐγὼ
  choice: mụ onwe m
  rationale: Nnọchiaha a pụtara ìhè iji mesie ọdịiche dị n’etiti “unu” na “mụ” ike; “mụ onwe m” na-egosipụta ntụnyere ahụ nke ọma.
- source_word: οὐ κρίνω οὐδένα
  choice: adịghị ekpe onye ọ bụla ikpe
  rationale: Nke a na-ebute ngọnarị ahụ n’Igbo nkịtị ma debe obosara nke οὐδένα, ya bụ, “onye ọ bụla.”
theological_decisions:
- issue: Ihe σάρξ pụtara na κατὰ τὴν σάρκα
  choice: E debere ya dị ka “dị ka anụ ahụ si dị” n’ahịrịokwu bụ isi.
  alternative: “dị ka ụkpụrụ mmadụ si dị” ma ọ bụ “dị ka ihe anya na-ahụ si dị”
  rationale: N’ebe a, okwu ahụ nwere ike izo aka n’ikpe ikpe nke mmadụ, nke ụwa, ma ọ bụ nke dabere n’ọdịdị elu. Idebe “anụ ahụ” na-echekwa okwu Jọn na esemokwu nkà mmụta okpukpe dị na ya, kama idozi ya n’otu nkọwa naanị.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. Nhazi ahịrịokwu ahụ na-eme ka ọdịiche dị n’etiti “Unu” na “mụ onwe m” pụta ìhè, ebe okwu “anụ ahụ” na-edobe ambiguiti nke isi Grik.
