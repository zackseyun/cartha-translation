revisions:
- from: Unu na-ekpe ikpe dị ka anụ ahụ si dị[a]; mụ onwe m adịghị ekpe onye ọ bụla ikpe.
  to: Unu na-ekpe ikpe n’anụ ahụ[a]; ma mụ onwe m anaghị ekpe onye ọ bụla ikpe.
  rationale: The revision replaces an unnatural literal construction with 'n’anụ ahụ,' retaining the lexical and theological openness of σάρξ while accurately representing the Greek idiom. It also improves the contextual alternatives in the footnote without placing either interpretation in the main text.
  reviewer_model: gpt-5.6-terra
