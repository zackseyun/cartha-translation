  yaml_path: translation/nt/john/008/007.yaml
  text: But when[a] they continued questioning him, he straightened up and said to them, "Let the one among you who is without sin be the first to throw a stone at her."
translation:
  language: ig
  text: Ma mgbe[a] ha nọgidere na-ajụ ya ajụjụ, o biliri ọtọ gwa ha, “Ka onye n’ime unu nke na-enweghị mmehie bụrụ onye mbụ ga-atụ ya nkume.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Amaokwu a so n’akụkọ banyere nwanyị ahụ e jidere ka ọ na-akwa iko (Jọn 7:53–8:11), nke na-adịghị n’akwụkwọ odide Grik ndị kacha ochie. Lee nkọwa ala peeji na Jọn 7:53.
    reason: textual_critical
lexical_decisions:
- source_word: ἐπέμενον ἐρωτῶντες
  choice: ha nọgidere na-ajụ ya ajụjụ
  rationale: Ngwakọta ngwaa ἐπέμενον na participle ἐρωτῶντες na-egosi na ha akwụsịghị ịjụ ya ajụjụ; ntụgharị a na-egosipụta omume ahụ na-aga n’ihu n’Igbo nkịtị.
- source_word: ἀνακύψας
  choice: o kwụziri onwe ya
  rationale: N’okwu gbara amaokwu a gburugburu, Jizọs hulatara ala; okwu a na-egosi na o si n’ọnọdụ ahụ kwụzie onwe ya, n’enweghị ịgbakwunye na o biliri ọtọ kpamkpam.
- source_word: ἀναμάρτητος
  choice: nke na-enweghị mmehie
  rationale: Nke a na-echekwa ịdị arọ nke okwu Grik ahụ n’ụzọ doro anya ma kwe nghọta, na-ekwughị kpọmkwem ma ihe a na-ekwu bụ mmehie niile ma ọ bụ ikpe ọmụma n’okwu a.
- source_word: πρῶτος ... τὸν λίθον βαλέτω
  choice: ya buru ụzọ tụọrọ ya nkume
  rationale: Nke a na-egosipụta iwu onye nke na-enweghị mmehie ga-abụ onye mbụ ga-atụ nkume, ma na-edebe nkume n’otu dịka ederede Grik si kwuo.
theological_decisions:
- issue: Ihe ‘onye na-enweghị mmehie’ pụtara n’ọnọdụ a
  choice: E debere ya dịka ‘nke na-enweghị mmehie.’
  alternative: ‘onye ikpe na-amaghị n’okwu a’ ma ọ bụ ‘onye na-emeghị ụdị mmehie a’
  rationale: Ederede Grik ekwughị kpọmkwem ụdị mmehie ma ọ bụ oke okwu ahụ; ya mere, ntụgharị ahụ anaghị akọwa esemokwu ahụ n’ụzọ ederede n’onwe ya na-ekwughị.
translation_notes:
  register: Ejiri Standard Igbo nke dị ugbu a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-edebe usoro arụmụka na ihe edoghị anya dị n’asụsụ Grik, ebe ‘tụọrọ ya nkume’ bụ ụzọ Igbo si ekwu ihe omume ahụ n’ụzọ ebumpụta ụwa.
