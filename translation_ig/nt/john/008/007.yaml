review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders the continued questioning, Jesus’ action of straightening up, and the unrestricted sense of ἀναμάρτητος (“without sin”). The final clause, however, is more clearly faithful to the Greek permissive imperative when expressed explicitly as “let ... be the first to throw a stone at her.”
  naturalness: Most of the verse is natural Standard Igbo. Recasting the final imperative avoids the potentially compressed and pronoun-heavy “ya buru ụzọ tụọrọ ya nkume.” “O biliri ọtọ” is a natural contextual rendering of ἀνακύψας.
  terminology: “Mmehie” properly represents ἁμαρτία without narrowing it to the alleged offense. “Ka ọ na-akwa iko” is appropriate for the textual-critical footnote. The footnote wording is adjusted slightly for idiomatic clarity.
  issues:
  - severity: medium
    issue: The final imperative is insufficiently explicit in Igbo.
    rationale: Greek βαλέτω is a third-person imperative (“let him throw”). “Ya buru ụzọ tụọrọ ya nkume” can be read less clearly than an explicit construction with “ka ... bụrụ onye mbụ ga-atụ ...” and has closely repeated pronouns.
  - severity: low
    issue: The textual-critical footnote uses a somewhat awkward expression for manuscripts and cross-reference wording.
    rationale: “Akwụkwọ odide Grik ndị kacha ochie” and “Lee nkọwa ala peeji...” are more idiomatic and precise than “ihe odide Grik...” and “ihe e dere n’ala peeji.”
  revised_text: Ma mgbe[a] ha nọgidere na-ajụ ya ajụjụ, o biliri ọtọ gwa ha, “Ka onye n’ime unu nke na-enweghị mmehie bụrụ onye mbụ ga-atụ ya nkume.”
