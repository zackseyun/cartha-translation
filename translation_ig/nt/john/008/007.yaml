    reason: textual_critical
  revision_rationale: The revision retains the source’s ongoing action and its broad, unqualified reference to sin. It makes the third-person imperative and priority of the first stone explicit in natural Standard Igbo, while retaining the singular “nkume.” The footnote preserves the English audit trail’s textual-critical information with more idiomatic manuscript terminology.
