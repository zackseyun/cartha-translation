revisions:
- from: Ma mgbe[a] ha nọgidere na-ajụ ya ajụjụ, o kwụziri onwe ya gwa ha, “Onye n’ime unu nke na-enweghị mmehie, ya buru ụzọ tụọrọ ya nkume.”
  to: Ma mgbe[a] ha nọgidere na-ajụ ya ajụjụ, o biliri ọtọ gwa ha, “Ka onye n’ime unu nke na-enweghị mmehie bụrụ onye mbụ ga-atụ ya nkume.”
  rationale: The revision retains the source’s ongoing action and its broad, unqualified reference to sin. It makes the third-person imperative and priority of the first stone explicit in natural Standard Igbo, while retaining the singular “nkume.” The footnote preserves the English audit trail’s textual-critical information with more idiomatic manuscript terminology.
  reviewer_model: gpt-5.6-terra
