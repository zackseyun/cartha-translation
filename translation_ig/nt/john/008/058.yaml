id: JHN.8.58
reference: John 8:58
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἶπεν ⸀αὐτοῖς Ἰησοῦς· Ἀμὴν ἀμὴν λέγω ὑμῖν, πρὶν Ἀβραὰμ γενέσθαι ἐγὼ εἰμί.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/058.yaml
  text: Jesus said to them[a], “Truly, truly, I say to you, before Abraham came to be[b], I am.”
translation:
  language: ig
  text: 'Jizọs sịrị ha, “N’ezie, n’ezie, ana m asị unu: tupu Ebraham amalite ịdị adị[a], Mụ onwe m dị[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “tupu a mụọ Ebraham.” Ngwaa Grik ahụ sara mbara karịa ọmụmụ mmadụ naanị; ọ pụkwara ịpụta “tupu Ebraham abịa ịdị” ma ọ bụ “tupu Ebraham amalite ịdị adị.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “Anọwo m.” Grik kwuru n’ụdị oge ugbu a, “Mụ onwe m dị,” nke na-edobe ụdị okwu ahụ na njikọ miri emi o nwere ike inwe gbasara onye Jizọs bụ.
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπεν αὐτοῖς Ἰησοῦς
  choice: Jizọs sịrị ha
  rationale: Nke a bụ ntụgharị kwụ ọtọ ma bụrụkwa ụzọ e si ekwu okwu n’Igbo ugbu a.
- source_word: Ἀμὴν ἀμὴν
  choice: N’ezie, n’ezie
  rationale: Ọ na-edobe nkwughachi ahụ na ike nkwenye dị n’okwu Grik, ma na-ada ka Igbo doro anya nye ndị na-agụ akwụkwọ taa.
- source_word: λέγω ὑμῖν
  choice: ana m asị unu
  rationale: Ọ na-edobe usoro okwu Jọn nke dị nsọ ma kwụ ọtọ, tinyere ịgwa ọtụtụ mmadụ okwu.
- source_word: πρὶν
  choice: tupu
  rationale: Ọ bụ njikọ oge dị mfe ma kwekọọ kpọmkwem na okwu Grik.
- source_word: γενέσθαι
  choice: amalite ịdị adị
  rationale: Ọ na-egosi ‘ịbịa ịdị’ ma ọ bụ ‘ịmalite ịdị adị,’ nke sara mbara karịa naanị ịmụ mmadụ; ọ na-enyekwa aka idobe ọdịiche dị n’etiti γενέσθαι na εἰμί.
- source_word: ἐγὼ εἰμί
  choice: Mụ onwe m dị
  rationale: ‘Dị’ bụ ụzọ Igbo si egosipụta ịdị adị n’enweghị ihe ọzọ a ga-etinye n’azụ ya. ‘Mụ onwe m’ na-edobe nkwusi ike dị n’ἐγώ, ebe ụdị okwu nke oge ugbu a na-edobe ike na mgbagwoju anya nke okwu Grik.
- source_word: Ἀβραὰμ
  choice: Ebraham
  rationale: Nke a bụ ụdị aha ahụ a na-ejikarị eme ihe n’Igbo.
theological_decisions:
- issue: Otú e si tụgharị ἐγὼ εἰμί n’ebe a okwu ahụ nwere nnukwu mkpa gbasara onye Kraịst bụ
  choice: Mụ onwe m dị
  alternative: Anọwo m
  rationale: Okwu Grik bụ nke oge ugbu a, ọ dịkwa n’ụdị siri ike nke na-enweghị ihe e tinyere n’azụ ya. ‘Mụ onwe m dị’ na-edobe ụdị ahụ na njikọ o nwere ike inwe na nkwupụta banyere Chineke, n’ebughị ụzọ kpebie ma kọwaa njikọ ahụ n’ime amaokwu ahụ. ‘Anọwo m’ ga-adị nro karịa n’Igbo, ma ọ ga-eme ka ihe ahụ bụrụ naanị ịdị adị tupu oge Abraham.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-edobe nkwughachi dị nsọ nke Jizọs, ọdịiche dị n’etiti Ebraham ‘ịmalite ịdị adị’ na Jizọs ‘ịdị,’ yana mgbagwoju anya nke okwu Grik n’akọwaghị ya gabiga ókè.
