revisions:
- from: Ha zara ya, sị, “Ebreham bụ nna anyị.” Jizọs sịrị ha, “Ọ bụrụ na unu bụ ụmụ Ebreham, unu gaara na-arụ ọrụ ndị Ebreham rụrụ.[a]”
  to: Ha zara ya sị, “Ebreham bụ nna anyị.” Jizọs sịrị ha, “A sị na unu bụ ụmụ Ebreham, unu gaara na-arụ ọrụ Ebreham.[a]”
  rationale: The revision uses an idiomatic counterfactual conditional in Standard Igbo and renders τὰ ἔργα τοῦ Ἀβραάμ directly as “ọrụ Ebreham,” avoiding the added assertion that these are merely acts Abraham completed. The footnote retains the possible non-counterfactual present-condition sense without imposing a single grammatical resolution beyond the main translation’s chosen reading.
