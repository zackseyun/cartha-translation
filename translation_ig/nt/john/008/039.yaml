source:
  edition: SBLGNT
  text: Ἀπεκρίθησαν καὶ εἶπαν αὐτῷ· Ὁ πατὴρ ἡμῶν Ἀβραάμ ἐστιν. λέγει αὐτοῖς ὁ Ἰησοῦς· Εἰ τέκνα τοῦ Ἀβραάμ ⸀ἐστε, τὰ ἔργα τοῦ Ἀβραὰμ ⸀ἐποιεῖτε·
base_translation:
  language: en
  yaml_path: translation/nt/john/008/039.yaml
  text: They answered and said to him[a], “Abraham is our father.” Jesus says to them, “If you are Abraham’s children, you would be doing Abraham’s works.”
translation:
  language: ig
  text: Ha zara ya sị, “Ebreham bụ nna anyị.” Jizọs sịrị ha, “A sị na unu bụ ụmụ Ebreham, unu gaara na-arụ ọrụ Ebreham.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “Ọ bụrụ na unu bụ ụmụ Ebreham, unu na-arụ ọrụ Ebreham.” Ngwaa Grik e ji mee ihe ebe a nwere ike igosi ọnọdụ na-abụghị eziokwu n’ezie.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπεκρίθησαν καὶ εἶπαν αὐτῷ
  choice: Ha zara ya, sị
  rationale: Nke a na-egosipụta ma nzaghachi ahụ ma okwu ha kwuru, dị ka ngwaa abụọ ahụ dị n’asụsụ Grik, ma na-ada nke ọma n’Igbo ugbu a.
- source_word: Ὁ πατὴρ ἡμῶν Ἀβραάμ ἐστιν
  choice: Ebreham bụ nna anyị
  rationale: Usoro okwu a bụ nke e ji ekwu okwu n’Igbo n’ụzọ doro anya, ma ọ na-echekwa nkwupụta ha banyere ịbụ ụmụ Ebreham.
- source_word: λέγει αὐτοῖς ὁ Ἰησοῦς
  choice: Jizọs sịrị ha
  rationale: Ọ bụ ezie na Grik ji present tense akụkọ, past tense a bụ ụzọ ebumpụta ụwa e si akọ akụkọ n’Igbo, n’enweghị mgbanwe n’ihe okwu ahụ pụtara.
- source_word: τέκνα τοῦ Ἀβραάμ
  choice: ụmụ Ebreham
  rationale: “Ụmụ” gụnyere nwoke na nwanyị, ma na-echekwa echiche nke mmekọrịta nwa na nna, ọ bụghị nanị usoro ọmụmụ.
- source_word: τὰ ἔργα τοῦ Ἀβραὰμ
  choice: ọrụ ndị Ebreham rụrụ
  rationale: Nke a na-egosi omume Ebreham ndị a na-atụ anya ka ha ṅomie, ma na-anọgide nso n’echiche ἔργα dị ka ọrụ ma ọ bụ ihe mmadụ mere.
- source_word: ἐποιεῖτε
  choice: unu gaara na-arụ
  rationale: Ụdị a na-egosipụta omume a tụrụ anya na ọ ga na-aga n’ihu ma ọ bụrụ na nkwupụta ha bụ eziokwu, ma na-echekwa ike nke imperfect n’ọnọdụ a.
theological_decisions:
- issue: Ụdị ịbụ ụmụ Ebreham Jizọs na-ekwu maka ya
  choice: E debere okwu mmekọrịta ahụ dịka “ụmụ Ebreham,” ma mee ka ọdịiche dị n’etiti nkwupụta ha na omume ha pụta ìhè.
  alternative: Ịkọwa ya kpọmkwem dịka ịbụ ụmụ n’anụ ahụ naanị ma ọ bụ ịbụ ụmụ n’ime mmụọ naanị.
  rationale: Amaokwu a n’onwe ya na-atụnyere nkwupụta ha na ọrụ Ebreham. Nsụgharị ahụ ekpebighị esemokwu ahụ site n’itinye ozizi ọzọ amaokwu ahụ na-ekwughị kpọmkwem.
- issue: Ike nke ọnọdụ εἰ ... ἐστε ... ἐποιεῖτε
  choice: “Ọ bụrụ na unu bụ ... unu gaara na-arụ”
  alternative: “A sị na unu bụ ... unu gaara arụ” ma ọ bụ ntụgharị dị ka nkwupụta ọnọdụ nkịtị.
  rationale: Nke a na-echekwa esemokwu dị n’etiti ụdị present nke ἐστε na imperfect ἐποιεῖτε, ma hapụ nkọwa ọzọ n’ala ala peeji kama idozi ya n’otu ụzọ naanị.
translation_notes:
  register: E ji Igbo Izugbe nke dị ugbu a, dị ùgwù ma dị mfe nghọta. “Ha zara ya, sị” bụ usoro Igbo ebumpụta ụwa nke na-echekwa nkwughachi ngwaa nke Grik n’enweghị okwu arọ; “gaara na-arụ” na-egosipụta ma ọnọdụ na-aga megide ihe a na-ahụ anya ma omume na-aga n’ihu.
