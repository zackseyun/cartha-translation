id: JHN.14.5
reference: John 14:5
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: λέγει αὐτῷ Θωμᾶς· Κύριε, οὐκ οἴδαμεν ποῦ ὑπάγεις· ⸀πῶς ⸂δυνάμεθα τὴν ὁδὸν εἰδέναι⸃;
base_translation:
  language: en
  yaml_path: translation/nt/john/014/005.yaml
  text: Thomas said to him[a], “Lord, we do not know where you are going[b]. How can we know the way?”
translation:
  language: ig
  text: Tọmọs sịrị ya, “Onyenwe anyị, anyị amaghị ebe ị na-aga. Olee otu anyị ga-esi mara ụzọ ahụ?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει αὐτῷ Θωμᾶς
  choice: Tọmọs sịrị ya
  rationale: A sụgharịrị historical present λέγει n'oge gara aga ka akụkọ ahụ daa nke ọma n'Igbo; αὐτῷ bụ “ya,” ebe Θωμᾶς bụ aha Tọmọs.
- source_word: Κύριε
  choice: Onyenwe anyị
  rationale: Nke a bụ ụzọ Igbo a na-ejikarị asụgharị κύριος mgbe onye na-eso ụzọ na-akpọ Jizọs; ọ na-echekwa ma nkwanye ùgwù ma ịdị elu nke aha ahụ.
- source_word: οὐκ οἴδαμεν
  choice: anyị amaghị
  rationale: οἶδα na-egosi ịma ihe, ọ bụghị nanị ịghọta ya; “anyị amaghị” bụ ntụgharị kpọmkwem ma bụrụkwa Igbo nkịtị.
- source_word: ποῦ ὑπάγεις
  choice: ebe ị na-aga
  rationale: Nke a na-echekwa ihe ὑπάγω pụtara n'ụzọ eke, na-akọwaghị tupu oge eruo ihe omimi nke ebe Jizọs na-aga.
- source_word: πῶς δυνάμεθα
  choice: Olee otu anyị ga-esi
  rationale: Ụdị ajụjụ a bụ Igbo eke nke na-egosi otú ihe ga-esi kwe omume, ya bụ ike e kwuru na δύναμαι.
- source_word: τὴν ὁδὸν
  choice: ụzọ ahụ
  rationale: “Ụzọ” nwere ike ịpụta ụzọ njem ma ọ bụ ụzọ e si eru ebe; “ahụ” na-egosipụta definite article τὴν ma na-echekwa njikọ ya na amaokwu na-esote.
- source_word: εἰδέναι
  choice: mara
  rationale: '“Mara” kwekọrọ na εἰδέναι ma na-eme ka nkwughachi οἴδαμεν / εἰδέναι dịgide n''Igbo: “anyị amaghị ... mara.”'
theological_decisions:
- issue: Ihe ὑπάγεις nwere ike ịpụta n'ihe gbasara ebe Jizọs na-aga n'Oziọma Jọn
  choice: ebe ị na-aga
  alternative: ebe ị na-apụ aga
  rationale: Amaokwu a na-egosi na Tọmọs amaghị ebe ahụ; ya mere, ntụgharị ahụ ekwesịghị ịkọwa ya ozugbo dị ka ịlaghachikwuru Nna ma ọ bụ nrịgo n'eluigwe. Okwu na-anọpụ iche na-echekwa esemokwu akụkọ na omimi nkà mmụta okpukpe ahụ.
- issue: Njikọ “ụzọ ahụ” na nkwupụta Jizọs n'amaokwu na-esote
  choice: ụzọ ahụ
  alternative: okporo ụzọ ahụ
  rationale: “Ụzọ” na-echekwa ohere nke nghọta nkịtị na nghọta miri emi, n'etinyeghị nkọwa nke amaokwu 6 n'ọnụ Tọmọs tupu Jizọs azaa.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị ugwu ma dị mfe nghọta. E debere nkwughachi nke mgbọrọgwụ “ịma” dị na Grik site na “anyị amaghị ... mara.” Enweghị akara nkọwa ala peeji n'ihi na ederede Igbo ahụ anaghị achọ lexical alternative iji doo ya anya; ozi banyere nkwughachi ahụ dị na mkpebi lexical.
