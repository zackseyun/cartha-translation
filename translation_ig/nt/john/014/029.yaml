id: JHN.14.29
reference: John 14:29
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ νῦν εἴρηκα ὑμῖν πρὶν γενέσθαι, ἵνα ὅταν γένηται πιστεύσητε.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/029.yaml
  text: And now I have told you before it happens[c][b][a], so that when it happens you may believe.
translation:
  language: ig
  text: Ugbu a, agwala m unu ya tupu o mee, ka unu wee kwere mgbe o mere.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “tupu o ruo, ka unu wee kwere mgbe o ruru.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ νῦν
  choice: Ma ugbu a
  rationale: Ọ na-ejigide njikọ καί na oge νῦν; “Ma ugbu a” na-aga nke ọma n'okwu Igbo ma jikọta amaokwu a na ihe bu ya ụzọ.
- source_word: εἴρηκα ὑμῖν
  choice: agwala m unu
  rationale: Ụdị perfect εἴρηκα na-egosi okwu e kwuworo nke ka dị mkpa ugbu a. “Agwala m unu” bụ ụzọ Igbo si ekwu ya nke ọma ma tinye ὑμῖν dị ka ndị a gwara okwu.
- source_word: πρὶν γενέσθαι
  choice: tupu o mee
  rationale: πρίν na infinitive γενέσθαι pụtara tupu ihe ahụ emee. “O” na-anọchi ihe omume a na-aghọta site n'ọnọdụ okwu.
- source_word: ἵνα
  choice: ka ... wee
  rationale: Usoro Igbo “ka ... wee” na-egosi nzube nke ἵνα n'ụzọ doro anya ma bụrụkwa nke e ji eme ihe n'Igbo ugbu a.
- source_word: ὅταν γένηται
  choice: mgbe o mere
  rationale: ὅταν tinyere subjunctive na-atụ aka n'ihe ga-eme n'ọdịnihu. Iji “mee” ọzọ na-echekwa nkwughachi nke γίνομαι dị n'asụsụ Grik.
- source_word: πιστεύσητε
  choice: unu kwere
  rationale: “Kwere” bụ ntụgharị Igbo dị mfe ma bụrụ nke a na-ejikarị eme ihe maka πιστεύω n'akwụkwọ Jọn; ọ naghị ekpebi ma nke a bụ mmalite nkwenye ma ọ bụ nkwenye a na-ewusi ike.
theological_decisions:
- issue: Ike na obosara ihe πιστεύσητε pụtara n'ọnọdụ a
  choice: ka unu wee kwere
  alternative: ka ntụkwasị obi unu wee sie ike
  rationale: Okwu Grik n'onwe ya akọwaghị hoo haa ma ọ bụ nkwenye mbụ ka ọ bụ nkwenye a na-ewusi ike. Ya mere, “kwere” na-echekwa obosara na esemokwu ahụ kama idozi ya n'ụzọ otu nkọwa okpukpe.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta, dee ya. E debere nkwughachi nke γίνομαι site n'iji “mee” ugboro abụọ, ma e zere ịgbakwunye nkọwa okpukpe nke okwu Grik na-ekwughị hoo haa.
