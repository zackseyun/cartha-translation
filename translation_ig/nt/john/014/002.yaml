id: JHN.14.2
reference: John 14:2
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐν τῇ οἰκίᾳ τοῦ πατρός μου μοναὶ πολλαί εἰσιν· εἰ δὲ μή, εἶπον ἂν ὑμῖν ⸀ὅτι πορεύομαι ἑτοιμάσαι τόπον ὑμῖν·
base_translation:
  language: en
  yaml_path: translation/nt/john/014/002.yaml
  text: In my Father's house there are many dwelling places[a]. If it were not so[b], would I have told you that I am going to prepare a place for you?
translation:
  language: ig
  text: N’ụlọ Nna m, e nwere ọtụtụ ebe obibi[a]. A sị na ọ bụghị otu ahụ[b], m̀ gaara agwa unu na m na-aga ịkwadebere unu ebe?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ọtụtụ ọnụ ụlọ.” Okwu Grik ahụ nwere ike ịpụta ebe mmadụ na-anọ ma ọ bụ na-ebi. “Ebe obibi” sara mbara karị, ọ na-echekwakwa njikọ ya na isiokwu nke ibi ma ọ bụ ịnọgide n’isiakwụkwọ a.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “A sị na ọ bụghị otu ahụ, m gaara agwa unu; n’ihi na m na-aga ịkwadebere unu ebe.” A pụkwara ịghọta nkebiokwu Grik ahụ dị ka okwu nkwupụta kama ajụjụ na-achọghị azịza.
    reason: alternative_reading
lexical_decisions:
- source_word: οἰκίᾳ
  choice: ụlọ
  rationale: “Ụlọ” na-echekwa ihe atụ doro anya nke ụlọ ma na-adaba n’okwu Jọn a, “ụlọ Nna m,” n’enweghị ịgbanwe ya ka ọ bụrụ ezinụlọ ma ọ bụ ndị bi n’ụlọ.
- source_word: πατρός μου
  choice: Nna m
  rationale: Nke a bụ ụzọ Igbo si ekwu “my Father” n’ụzọ ebumpụta ụwa. E ji mkpụrụedemede ukwu dee “Nna” n’ihi na ọ na-ezo aka na Chineke n’okwu Jizọs.
- source_word: μοναὶ πολλαί
  choice: ọtụtụ ebe obibi
  rationale: “Ebe obibi” sara mbara, ọ pụkwara ịpụta ebe mmadụ na-anọ ma ọ bụ na-ebi. Ọ naghị eme ka okwu Grik ahụ dị warara ka “ọnụ ụlọ,” ma ọ na-echekwa njikọ ya na echiche nke ibi ma ọ bụ ịnọgide n’isiakwụkwọ a.
- source_word: εἰ δὲ μή
  choice: A sị na ọ bụghị otu ahụ
  rationale: Nke a na-egosipụta ọnọdụ e chere eche n’ụzọ Igbo doro anya ma dị mma.
- source_word: εἶπον ἂν ὑμῖν
  choice: m̀ gaara agwa unu
  rationale: “Gaara agwa” na-egosipụta ihe a gaara eme n’ọnọdụ e chere eche; akara ụda dị na “m̀” na-eme ka ajụjụ ahụ pụta ìhè.
- source_word: ὅτι
  choice: na
  rationale: “Na” na-ebute ọdịnaya nke ihe Jizọs gaara agwa ha, kwekọrọ n’ịgụ nkebiokwu ahụ dị ka ajụjụ.
- source_word: πορεύομαι
  choice: m na-aga
  rationale: Ọ na-echekwa mmetụta nke omume na-aga ime ma ọ bụ nke malitere ịdị nso n’okwu Jizọs.
- source_word: ἑτοιμάσαι
  choice: ịkwadebere
  rationale: Ọ na-egosipụta ebumnuche njem ahụ ma tinyekwa echiche na nkwadebe ahụ bụ maka ndị a na-agwa okwu.
- source_word: τόπον
  choice: ebe
  rationale: “Ebe” sara mbara dịka okwu Grik ahụ; ọ naghị amanye echiche nke otu ọnụ ụlọ.
- source_word: ὑμῖν
  choice: unu
  rationale: “Unu” na-egosipụta nke ọma na onye nnọchiaha Grik ahụ bụ ọtụtụ mmadụ; njikọ dị na “ịkwadebere unu” na-egosipụta na ọ bụ maka ọdịmma ha.
theological_decisions:
- issue: Nkọwa μονή n’ihe atụ banyere ebe obibi nke ọdịnihu
  choice: ọtụtụ ebe obibi
  alternative: ọtụtụ ọnụ ụlọ; ọtụtụ nnukwu ụlọ
  rationale: “Ebe obibi” anaghị ebubata echiche nke nnukwu ụlọ okomoko, ọ naghịkwa eme ka ihe okwu ahụ pụtara dị warara dịka “ọnụ ụlọ.” Ọ na-echekwa ihe atụ ahụ na njikọ ya na ibi ma ọ bụ ịnọgide.
- issue: Ntụpọokwu na ike nke nkebiokwu nke abụọ
  choice: 'Ajụjụ na-achọghị azịza: “A sị na ọ bụghị otu ahụ, m̀ gaara agwa unu na m na-aga ịkwadebere unu ebe?”'
  alternative: 'Okwu nkwupụta: “A sị na ọ bụghị otu ahụ, m gaara agwa unu; n’ihi na m na-aga ịkwadebere unu ebe.”'
  rationale: Ederede Grik mbụ enweghị ntụpọokwu e tinyere mgbe e mesịrị, ya mere a pụrụ ịghọta nhazi nkebiokwu a n’ụzọ abụọ. Ajụjụ ahụ dabara nke ọma n’usoro okwu, ma a na-echekwa ọgụgụ ọzọ n’okpuru peeji kama ikpochapụ mgbagwoju anya dị n’isi mmalite.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, kwanyere ugwu ma dị mfe nghọta. “N’ụlọ Nna m” na-echekwa ihe atụ mbụ; “ebe obibi” bụ okwu sara mbara ma dị ebumpụta ụwa. E ji “unu” mee ka ọtụtụ mmadụ dị na Grik pụta ìhè. E zere okwu ochie ma ọ bụ nke nwere njikọ pụrụ iche na otu ụka.
