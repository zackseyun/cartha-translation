id: JHN.14.21
reference: John 14:21
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ ἔχων τὰς ἐντολάς μου καὶ τηρῶν αὐτὰς ἐκεῖνός ἐστιν ὁ ἀγαπῶν με· ὁ δὲ ἀγαπῶν με ἀγαπηθήσεται ὑπὸ τοῦ πατρός μου, κἀγὼ ἀγαπήσω αὐτὸν καὶ ἐμφανίσω αὐτῷ ἐμαυτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/021.yaml
  text: The one who has my commandments and keeps them is the one who loves me[a]. And the one who loves me will be loved by my Father[c][b], and I will love him and reveal myself to him.
translation:
  language: ig
  text: Onye nwere iwu m ma na-edebe ha, ọ bụ ya bụ onye hụrụ m n’anya.[a] Nna m ga-ahụ onye hụrụ m n’anya n’anya; mụ onwe m ga-ahụkwa ya n’anya, ga-ekpughere ya onwe m.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’asụsụ Grik, e ji ụdị okwu nwoke n’otu onye mee ihe, ma ọ na-anọchite anya onye ọ bụla nwere iwu Jizọs ma na-edebe ha.
    reason: lexical_alternative
  - marker: b
    text: 'Ma ọ bụ: “ga-egosi ya onwe m.” Ngwaa Grik a nwere ike ịpụta ime ka mmadụ mata onye ọzọ ma ọ bụ ime ka ọ hụ ya; n’ebe a, ọ pụrụ imesi mkpughe onwe nke Jizọs ike.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ ἔχων τὰς ἐντολάς μου
  choice: Onye nwere iwu m
  rationale: “Onye” na-eme ka participle ahụ ghọọ aha onye dịka ọ dị na Grik, “iwu m” na-echekwa ikike dị na ἐντολάς n’asụsụ Igbo doro anya.
- source_word: τηρῶν αὐτὰς
  choice: ma na-edebe ha
  rationale: “Na-edebe” na-eburu echiche nke irube isi, ilekọta, na ịnọgide na-eme ihe e nyere n’iwu, n’emeghị ka ihe ọ pụtara bụrụ naanị otu akụkụ.
- source_word: ἐκεῖνός ἐστιν ὁ ἀγαπῶν με
  choice: ọ bụ ya bụ onye hụrụ m n’anya
  rationale: 'Nkebi a na-echekwa nkwusi ike nke ἐκεῖνος: onye nwere iwu ahụ ma na-edebe ha bụ kpọmkwem onye hụrụ Jizọs n’anya.'
- source_word: ἀγαπῶν / ἀγαπηθήσεται / ἀγαπήσω
  choice: hụrụ … n’anya / ga-ahụ … n’anya / ga-ahụkwa … n’anya
  rationale: E ji otu usoro okwu “ịhụ n’anya” mee ugboro niile iji chekwaa nkwughachi nke ἀγαπάω n’amaokwu ahụ.
- source_word: ἀγαπηθήσεται ὑπὸ τοῦ πατρός μου
  choice: Nna m ga-ahụ onye hụrụ m n’anya n’anya
  rationale: Igbo na-ekwukarị nke a nke ọma n’olu na-eme ihe kama n’olu a na-eme ihe; a ka debere Nna dịka onye na-ahụ ya n’anya na onye ahụ dịka onye a hụrụ n’anya.
- source_word: κἀγὼ
  choice: mụ onwe m … kwa
  rationale: “Mụ onwe m” na “kwa” na-egosipụta mgbakwunye na nkwusi ike dị na καὶ ἐγώ.
- source_word: ἐμφανίσω αὐτῷ ἐμαυτόν
  choice: kpugheere ya onwe m
  rationale: “Kpughere” na-egosi ngosi onwe nke mmadụ, ma ọ naghị amanye nghọta na ọ bụ naanị iji anya hụ ya; “onwe m” na-echekwa reflexive ἐμαυτόν.
theological_decisions:
- issue: Mmekọrịta dị n’etiti ịhụ Jizọs n’anya na idebe iwu ya
  choice: E gosipụtara idebe iwu Jizọs dịka ihe e ji amata onye hụrụ ya n’anya.
  alternative: Ịsị na nrubeisi na-akpata ịhụnanya Chineke ma ọ bụ na mmadụ ji ya enweta ịhụnanya ahụ.
  rationale: Grik na-eme ka onye na-edebe iwu na onye hụrụ Jizọs n’anya bụrụ otu onye; ọ naghị akọwa ịhụnanya Nna dịka ụgwọ ọrụ mmadụ rụtara.
- issue: Ụdị mkpughe Jizọs kwuru maka ya
  choice: kpugheere ya onwe m
  alternative: egosi ya onwe m
  rationale: ἐμφανίζω nwere ike ịpụta ime ka a mara ma ọ bụ ime ka a hụ. “Kpughere” na-echekwa obosara ahụ ma ghara ikwu kpọmkwem na ọ bụ ngosipụta anya.
- issue: Masculine singular nke na-anọchite anya mmadụ n’ozuzu ya
  choice: E ji “onye” na “ya,” bụ́ okwu Igbo na-adịghị akọwa nwoke ma ọ bụ nwaanyị.
  alternative: Ịgbakwunye “nwoke” iji soro ụdị ụtọasụsụ Grik.
  rationale: Ụdị nwoke otu onye dị na Grik nwere ọrụ nnọchite anya; “onye/ya” na-ebupụta ọrụ ahụ n’Igbo n’enweghị itinye nwoke ebe ihe amaokwu ahụ na-ekwu gbasara mmadụ ọ bụla.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta mee ihe. Usoro “ọ bụ ya bụ” na-echekwa nkwusi ike Grik, ebe “onye/ya” na-arụ ọrụ nnọchite anya n’ụzọ ebumpụta ụwa n’Igbo. E wepụrụ ihe odide ala peeji Bekee [c] n’ihi na ọ na-akọ naanị banyere nhazi okwu Bekee gara aga, ọ bụghị ọdịiche dị n’ihe odide Grik ma ọ bụ ihe dị mkpa n’Igbo.
