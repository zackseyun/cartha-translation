  text: Μὴ ταρασσέσθω ὑμῶν ἡ καρδία· πιστεύετε εἰς τὸν θεόν, καὶ εἰς ἐμὲ πιστεύετε.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/001.yaml
  text: Do not let your heart be troubled[a]. Believe in God[b]; believe also in me.
translation:
  language: ig
  text: Unu ekwela ka obi unu maa jijiji. Kwerenụ[a] na Chineke; kwekwanụ na m.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Unu kwere na Chineke; kwekwanụ na m.” Ụdị okwu Grik πιστεύετε nwere ike ịpụta ma “unu kwere” ma “kwerenụ.”
    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ, “Tụkwasịnụ Chineke obi; tụkwasịkwanụ m obi.” Okwu Grik ahụ nwere ike ịpụta ntụkwasị obi nakwa nkwenye.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ ταρασσέσθω
  choice: Unu ekwela ka ... maa jijiji
  rationale: 'Nke a na-egosipụta iwu mgbochi dị n''ụdị onye nke atọ: ka obi ha ghara ịma jijiji. Okwu a bụ ụzọ Igbo dị mfe ma dị nsọ isi kọwaa obi a kpasuru ọgba aghara n''etinyeghị naanị egwu ma ọ bụ nchegbu n''ime ya.'
- source_word: ὑμῶν ἡ καρδία
  choice: obi unu
  rationale: Ọ bụ ezie na καρδία dị n'ọnụọgụ otu, ὑμῶν bụ ọtụtụ; ‘obi unu’ bụkwa okwu Igbo sitere n'okike nke nwere ike ịrụ ọrụ dị ka mkpokọta ma chekwaa ọdịdị ahụ.
- source_word: πιστεύετε
  choice: Kwerekwanụ
  rationale: ‘Ikwere na’ na-egosipụta ma nkwenye ma ntụkwasị obi n'ebe onye ahụ nọ. E tinyere ‘-nụ’ iji gosi na a na-agwa ọtụtụ mmadụ okwu, ma ‘kwa’ na-egosipụta njikọ na mgbakwunye dị n'ahịrịokwu ahụ.
- source_word: εἰς τὸν θεόν
  choice: na Chineke
  rationale: Mgbe ‘ikwere’ sochiri ya, ‘na Chineke’ bụ ụzọ Igbo sitere n'okike isi gosi okwukwe ma ọ bụ ntụkwasị obi a tụkwasịrị n'ebe Chineke nọ.
- source_word: καὶ εἰς ἐμὲ πιστεύετε
  choice: kwekwanụ na mụ onwe m
  rationale: ‘Kwa’ na-echekwa ike mgbakwunye nke καί, ebe ‘mụ onwe m’ na-egosipụta nkwusi ike nke ἐμέ ma chekwaa ntụnyere dị n'etiti Chineke na Jizọs.
theological_decisions:
- issue: Ma πιστεύετε abụọ ahụ bụ nkwupụta ka ha bụ iwu
  choice: 'A sụgharịrị ha abụọ dị ka iwu: ‘Kwerekwanụ na Chineke; kwekwanụ na mụ onwe m.’'
  alternative: ‘Unu kwere na Chineke; kwekwanụ na mụ onwe m.’
  rationale: Ụdị Grik πιστεύετε nwere ike ịbụ nkwupụta ma ọ bụ iwu n'ihi na ụdị abụọ ahụ yiri ibe ha. N'ọnọdụ a, iwu mgbochi nke mbụ na nkwado Jizọs na-enye ndị na-eso ụzọ ya na-akwado ịgụ ha abụọ dị ka iwu. Ma ebe mgbagwoju anya ahụ bụ nke ezigbo asụsụ Grik, e debere ọgụgụ nke nkwupụta n'okpuru peeji.
translation_notes:
  register: Standard Igbo dị ugbu a, dị mfe nghọta ma nwee ugwu. E ji ‘unu/-nụ’ doo anya na Jizọs na-agwa ọtụtụ ndị okwu. ‘Obi unu maa jijiji’ na-enye echiche nke obi a kpasuru ọgba aghara n'ụzọ ndị Igbo na-asụ kwa ụbọchị ga-aghọta, n'etinyeghị nkọwa ụka pụrụ iche.
