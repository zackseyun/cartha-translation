    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ, “Tụkwasịnụ Chineke obi; tụkwasịkwanụ m obi.” Okwu Grik ahụ nwere ike ịpụta ntụkwasị obi nakwa nkwenye.
    reason: lexical_alternative
