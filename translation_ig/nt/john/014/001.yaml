- from: Unu ekwela ka obi unu maa jijiji. Kwerekwanụ na Chineke; kwekwanụ na mụ onwe m.[a][b]
  to: Unu ekwela ka obi unu maa jijiji. Kwerenụ[a] na Chineke; kwekwanụ na m.[b]
  rationale: The revision retains the source-faithful imperative reading and the draft’s effective rendering of the troubled heart. It removes added reflexive emphasis, represents the single Greek additive conjunction naturally, and relocates footnote anchors to the belief wording that they explain. The indicative/imperative ambiguity remains explicitly preserved in footnote a.
