revisions:
- from: Unu nụrụ na m gwara unu, “Ana m apụ, ana m abịakwutekwa unu.” Ọ bụrụ na unu hụrụ m n’anya, unu gaara aṅụrị ọṅụ[a] na m na-agakwuru Nna, n’ihi na Nna ka m ukwuu.[b]
  to: Unu nụrụ na m gwara unu, “Ana m apụ, ana m abịakwute unu.” Ọ bụrụ na unu hụrụ m n’anya, unu gaara aṅụrị ọṅụ[a] na m na-agakwuru Nna, n’ihi na Nna dị ukwuu karịa m.[b]
  rationale: The revision removes an added ‘also/again’ nuance from the coming statement and replaces an elliptical comparative with a clear, idiomatic Standard Igbo comparative. It retains the source text’s aspectual and conditional force, the title “Nna,” and the deliberately unqualified statement that the Father is greater than Jesus.
