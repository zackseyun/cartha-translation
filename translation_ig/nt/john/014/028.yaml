  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἠκούσατε ὅτι ἐγὼ εἶπον ὑμῖν· Ὑπάγω καὶ ἔρχομαι πρὸς ὑμᾶς. εἰ ἠγαπᾶτέ με ἐχάρητε ἄν, ⸀ὅτι πορεύομαι πρὸς τὸν πατέρα, ὅτι ὁ ⸀πατὴρ μείζων μού ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/028.yaml
  text: You heard that I said to you[a], ‘I am going away, and I am coming to you.’ If you loved me, you would have rejoiced that I am going to the Father[b], because the Father is greater than I.
translation:
  language: ig
  text: Unu nụrụ na m gwara unu, “Ana m apụ, ana m abịakwute unu.” Ọ bụrụ na unu hụrụ m n’anya, unu gaara aṅụrị ọṅụ[a] na m na-agakwuru Nna, n’ihi na Nna dị ukwuu karịa m.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “unu ga-aṅụrị ọṅụ na m na-agakwuru Nna.” Ụdị Grik ahụ nwere ike ibu echiche sara mbara karị, ma “unu gaara aṅụrị ọṅụ” dabara nke ọma n’ọnọdụ na-abụghị eziokwu dị n’okwu a.
    reason: lexical_alternative
  - marker: b
    text: A sụgharịrị “Nna dị ukwuu karịa m” dịka e dere ya, n’etinyeghị nkọwa dịka “n’ọrụ” ma ọ bụ “n’ọkwa.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἠκούσατε
  choice: Unu nụrụ
  rationale: Oge aorist na-egosi na ha anụlarị okwu Jizọs kwuru na mbụ; ụdị gara aga a bụ nke doro anya ma dịkwa n’Igbo nkịtị.
- source_word: Ὑπάγω
  choice: Ana m apụ
  rationale: Ọ na-egosi ịpụ n’ebe ndị na-eso ụzọ nọ, ebe present tense Grik nwere echiche nke ihe na-aga ime n’oge na-adịghị anya.
- source_word: ἔρχομαι πρὸς ὑμᾶς
  choice: ana m abịakwutekwa unu
  rationale: Nke a na-echekwa ihe odide Grik kwuru banyere ịbịakwute ha, n’etinyeghị ‘ịlọghachi,’ nke okwu Grik n’onwe ya ekwughị kpọmkwem.
- source_word: εἰ ἠγαπᾶτέ με
  choice: Ọ bụrụ na unu hụrụ m n’anya
  rationale: Ụdị a na-enye ọnọdụ na-abụghị eziokwu dịka usoro okwu ahụ si dị, ma na-ada nke ọma n’Igbo.
- source_word: ἐχάρητε ἄν
  choice: unu gaara aṅụrị ọṅụ
  rationale: ‘Gaara’ na-egosi ihe gaara eme ma ọnọdụ ahụ mezuru, kwekọrọ n’usoro ọnọdụ na-abụghị eziokwu dị na Grik.
- source_word: πορεύομαι πρὸς τὸν πατέρα
  choice: m na-agakwuru Nna
  rationale: ‘Na-agakwuru’ na-echekwa echiche nke ije n’ebe onye ahụ nọ; ‘Nna’ ka edobere dịka aha nsọpụrụ dịka ọ dị na Jọn.
- source_word: πατέρα / πατὴρ
  choice: Nna
  rationale: Grik enweghị okwu nnọchiaha nke pụtara ‘Nna m’; ya mere ‘Nna’ na-echekwa aha ahụ n’etinyeghị ihe ọzọ.
- source_word: μείζων μού
  choice: ka m ukwuu
  rationale: Nke a bụ ụzọ Igbo si ekwu ntụnyere ahụ n’ụzọ kpọmkwem, n’etinyeghị nkọwa dịka ‘n’ọkwa’ ma ọ bụ ‘n’ọrụ.’
theological_decisions:
- issue: Ihe okwu ‘Nna ka m ukwuu’ pụtara n’ihe gbasara mmekọrịta Nna na Ọkpara
  choice: E debere ntụnyere ahụ kpọmkwem dịka ‘Nna ka m ukwuu.’
  alternative: Nna ka m ukwuu n’ọkwa, n’ọrụ, ma ọ bụ n’ọnọdụ m dịka mmadụ
  rationale: Ihe odide Grik kwuru ntụnyere ahụ n’enweghị nkọwa na-amachi ihe ọ pụtara. Nsụgharị ekwesịghị idozi esemokwu nkà mmụta okpukpe site n’ịgbakwunye nkọwa na-adịghị n’ihe odide.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke nwere ugwu ma dị mfe nghọta. A họọrọ “ana m abịakwutekwa unu” kama “aga m alọghachikwute unu” iji ghara itinye echiche ‘ịlọghachi’ nke okwu Grik na-ekwughị kpọmkwem. E debere mgbagwoju anya na esemokwu dị n’ahịrị ikpeazụ n’enweghị nkọwa otu ụka pụrụ iche.
