source:
  edition: SBLGNT
  text: ἔτι μικρὸν καὶ ὁ κόσμος με οὐκέτι θεωρεῖ, ὑμεῖς δὲ θεωρεῖτέ με, ὅτι ἐγὼ ζῶ καὶ ὑμεῖς ⸀ζήσετε.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/019.yaml
  text: A little while longer[a], and the world will no longer see me, but you will see me. Because I live[b], you also will live.
translation:
  language: ig
  text: Ọ fọdụrụ obere oge[a], ụwa agaghị ahụ m ọzọ, ma unu ga-ahụ m. N’ihi na m dị ndụ, unu ga-adịkwa ndụ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Naanị obere oge ọzọ.”
    reason: lexical_alternative
  - marker: b
    text: “Unu ga-adịkwa ndụ” pụrụ izo aka n’ịketa ndụ mbilite n’ọnwụ nke Jizọs, ná ndụ ime mmụọ ha n’ịdị n’otu na ya, ma ọ bụ ná ha abụọ.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔτι μικρὸν
  choice: Ọ fọdụrụ obere oge
  rationale: Nke a bụ okwu Igbo dị mfe ma bụrụkwa nke e ji egosi na ọ bụ nanị obere oge ka fọdụrụ tupu mgbanwe ahụ abịa.
- source_word: κόσμος
  choice: ụwa
  rationale: “Ụwa” na-edobe okwu Jọn n’ozuzu ya, n’akọwaghị ya kpọmkwem dị ka ndị mmadụ na-emegide Chineke ma ọ bụ usoro ụwa.
- source_word: θεωρεῖ / θεωρεῖτέ
  choice: agaghị ahụkwa / ga-ahụ
  rationale: “Ịhụ” bụ okwu Igbo kacha kwekọọ n’ebe a ma na-ahapụ ohere ma ọ̀ bụ ịhụ anya, ịmata nke ọma, ma ọ bụ nghọta ime mmụọ.
- source_word: οὐκέτι
  choice: agaghị ahụkwa m ọzọ
  rationale: Ngwakọta “-kwa ... ọzọ” na-egosi n'ụzọ doro anya na ịhụ ahụ ga-akwụsị.
- source_word: δὲ
  choice: ma
  rationale: “Ma” na-egosi ọdịiche dị n’etiti ụwa na ndị na-eso ụzọ.
- source_word: ὅτι
  choice: N’ihi na
  rationale: Nke a na-egosi ihe kpatara ndụ ndị na-eso ụzọ ji dabere na ndụ Jizọs, n’enweghị ịgbasa nkọwa ya.
- source_word: ἐγὼ ζῶ
  choice: m dị ndụ
  rationale: “M dị ndụ” bụ ụzọ Igbo eke si kwuo na mmadụ na-adị ndụ, ma na-edobe oge dị ugbu a na ịdị arọ nke okwu ahụ.
- source_word: καὶ ὑμεῖς ζήσετε
  choice: unu onwe unu ga-adịkwa ndụ
  rationale: “Ga-adịkwa ndụ” na-edobe oge ọdịnihu na καί (“kwa”); “unu onwe unu” na-eme ka ọdịiche nke ὑμεῖς pụta ìhè n’ụzọ Igbo.
theological_decisions:
- issue: Ihe ‘unu ga-ahụ m’ pụtara
  choice: E ji okwu sara mbara bụ “unu ga-ahụ m,” n’akọwaghị ụdị ịhụ ahụ.
  alternative: Ọ pụrụ ịpụta ịhụ Jizọs mgbe o bilitesịrị n’ọnwụ, ịmata ya n’ime mmụọ, ma ọ bụ ha abụọ.
  rationale: Ihe Grik ahụ ekpebighị otu n’ime nghọta ndị a naanị; nsụgharị kwesịrị ịhapụ nghọta ndị ahụ ka ha dị.
- issue: Ihe ‘unu ga-adịkwa ndụ’ pụtara
  choice: E debere ya n’ụzọ sara mbara dị ka “unu onwe unu ga-adịkwa ndụ.”
  alternative: Ọ pụrụ izo aka ná ndụ mbilite n’ọnwụ, ndụ ime mmụọ n’ịdị n’otu na Jizọs, ma ọ bụ ha abụọ.
  rationale: ζήσετε nwere nghọta okpukpe sara mbara; nsụgharị adịghị eme ka ọ bụrụ naanị otu ụdị ndụ.
translation_notes:
  register: Standard Igbo; asụsụ dị ugbu a, dị ugwu, ma dị mfe nghọta. E ji “Jizọs” naanị na nkọwa ala peeji, ebe onye na-ekwu okwu n’amaokwu ahụ ji nnọchiaha “m.”
