  naturalness: “Filip sịrị ya” and “gosi anyị Nna ahụ” are clear, natural Standard Igbo. “Ma nke ahụ ezuru anyị” is a concise and natural rendering of the final clause.
  terminology: “Onyenwe anyị” is an established respectful/Lordly address for Jesus in Standard Igbo. The footnoted “Nna ukwu” appropriately preserves the less theologically specified respectful alternative without presenting it as the main reading.
