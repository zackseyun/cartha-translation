source:
  edition: SBLGNT
  text: Λέγει αὐτῷ Φίλιππος· Κύριε, δεῖξον ἡμῖν τὸν πατέρα, καὶ ἀρκεῖ ἡμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/008.yaml
  text: Philip said to him[a], “Lord, show us the Father, and that is enough for us.”
translation:
  language: ig
  text: Filip sịrị ya, “Onyenwe anyị[a], gosi anyị Nna ahụ, ma nke ahụ ezuru anyị.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Nna ukwu, gosi anyị Nna ahụ, ma nke ahụ ezuru anyị.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Λέγει
  choice: sịrị
  rationale: Ọ bụ ezie na Grik ji ngwaa dị n’oge ugbu a mee akụkọ ihe mere eme, ‘sịrị’ bụ ụzọ Igbo nkịtị si ewebata okwu mmadụ kwuru n’akụkọ gara aga.
- source_word: αὐτῷ
  choice: ya
  rationale: Nnọchiaha dative a na-egosi onye Filip gwara okwu; ‘sịrị ya’ bụ usoro Igbo doro anya ma dịkwa eke.
- source_word: Φίλιππος
  choice: Filip
  rationale: E degharịrị aha onye ahụ n’ụdị a na-ejikarị ede ya n’Igbo.
- source_word: Κύριε
  choice: Onyenwe anyị
  rationale: Ọ bụ okwu a na-akpọ mmadụ kpọmkwem, nke sitere na κύριος. ‘Onyenwe anyị’ na-echekwa nsọpụrụ na ịdị arọ nke aha ahụ mgbe Filip na-agwa Jizọs okwu; ‘Nna ukwu’ ka bụkwa ihe okwu Grik ahụ nwere ike ịpụta n’ụdị nkwanye ùgwù.
- source_word: δεῖξον
  choice: gosi
  rationale: Ngwaa iwu a na-arịọ ka e mee ka mmadụ hụ ma ọ bụ mata onye a na-ekwu banyere ya; ‘gosi’ na-enye ihe ahụ n’ụzọ kpọmkwem.
- source_word: ἡμῖν
  choice: anyị
  rationale: N’usoro ‘gosi anyị,’ ‘anyị’ bụ ndị a ga-egosi Nna ahụ.
- source_word: τὸν πατέρα
  choice: Nna ahụ
  rationale: N’okwu Jọn a, ọ na-ezo aka kpọmkwem n’ebe Chineke, Nna Jizọs, nọ. ‘Ahụ’ na-anọchi article Grik ahụ, ebe mkpụrụedemede ukwu na-egosi na ọ bụ aha e ji ekwu banyere Chineke.
- source_word: καὶ
  choice: nke ahụ
  rationale: N’ebe a, njikọ ahụ na-ebute nsonaazụ arịrịọ Filip; Igbo eke na-eji ‘nke ahụ’ laghachi n’ihe a rịọrọ ma jikọta ya na nkebi na-esote.
- source_word: ἀρκεῖ
  choice: ga-ezuru
  rationale: ἀρκέω pụtara ịbụ ihe zuru ezu. Oge ọdịnihu n’Igbo na-egosipụta nsonaazụ Filip tụrụ anya ya n’enweghị ịgbanwe isi ihe okwu ahụ pụtara.
- source_word: ἡμῖν
  choice: anyị
  rationale: ‘Ga-ezuru anyị’ bụ ụzọ Igbo doro anya si egosi ndị ihe ahụ ga-ezuru.
theological_decisions:
- issue: Otu e si sụgharị κύριος mgbe a na-akpọ Jizọs
  choice: Onyenwe anyị
  alternative: Nna ukwu
  rationale: ‘Onyenwe anyị’ na-echekwa ma nkwanye ùgwù Filip nwere n’ebe Jizọs nọ ma ibu okwu κύριος nwere n’Oziọma Jọn. Ma ebe κύριε nwekwara ike ịbụ okwu nkwanye ùgwù dịka ‘Nna ukwu,’ e debere nke ahụ n’ala ala peeji ka a ghara ikpochapụ nghọta okwu Grik ahụ nwere ike inwe.
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe nke oge a, dị mfe nghọta ma nwee ugwu kwesịrị ekwesị. E ji ‘sịrị’ mee ka akụkọ ahụ daa nke ọma n’Igbo, ma debe arịrịọ Filip n’ụdị kpọmkwem.
