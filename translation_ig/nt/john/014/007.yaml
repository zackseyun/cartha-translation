    issue: The opening conditional is not clearly past counterfactual.
    rationale: The Greek pluperfect/protasis and ἄν + aorist indicative apodosis refer to an unreal past condition and result. The draft can be read as an open present condition.
  - severity: medium
    issue: The final verb does not convey the Greek perfect.
    rationale: ἑωράκατε means “you have seen”; “hụkwa ya anya” lacks the completed/perfect sense. “Hụla ya” supplies it naturally.
