id: JHN.14.7
reference: John 14:7
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἰ ⸀ἐγνώκειτέ με, καὶ τὸν πατέρα μου ⸂ἂν ᾔδειτε⸃· ⸀ἀπ’ ἄρτι γινώσκετε αὐτὸν καὶ ἑωράκατε ⸀αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/007.yaml
  text: If you had known me, you would have known my Father also. From now on you do know him and have seen him.
translation:
  language: ig
  text: A sị na unu marala m, unu gaara amakwa Nna m. Site ugbu a gaa n’ihu, unu maara ya ma hụla ya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγνώκειτέ / ᾔδειτε / γινώσκετε
  choice: maara / ga-amarakwa / maara
  rationale: A họọrọ ‘ịma’ iji gosipụta echiche nke ịmata onye, ọ bụghị nanị ịmata ihe banyere ya. Oge na ọnọdụ ngwaa ndị ahụ ka e gosipụtara site na ‘Ọ bụrụ na,’ ‘ga-…kwa,’ na ‘Site ugbu a gaa n’ihu.’
- source_word: ἑωράκατε
  choice: hụkwa ya anya
  rationale: ‘Ịhụ anya’ na-egosipụta ịhụ mmadụ n’ezie ma na-edobe ike okwu Jizọs n’Igbo nkịtị.
- source_word: τὸν πατέρα μου
  choice: Nna m
  rationale: Nke a bụ ụzọ Igbo doro anya ma dịkwa ùgwù isi kwuo ‘my Father’; mkpụrụedemede ukwu na-egosi na ọ na-ekwu banyere Chineke.
- source_word: ἀπ’ ἄρτι
  choice: Site ugbu a gaa n’ihu
  rationale: Ọ na-egosipụta mmalite site n’oge a, dị ka okwu Grik si kwuo.
theological_decisions:
- issue: Mmekọrịta dị n’etiti ịmata Jizọs na ịmata Nna ya
  choice: E debere okwu abụọ ahụ n’ụzọ jikọrọ ha ọnụ n’enweghị nkọwa agbakwunyere.
  alternative: Ịkọwa ya dịka ‘ịmata onye Jizọs bụ n’ezie’ ma ọ bụ ịgbakwunye nkọwa banyere ịdị n’otu ha.
  rationale: Ihe odide ahụ na-ekwupụta njikọ siri ike ma ọ naghị akọwa ya n’amaokwu a; nsụgharị ekwesịghị itinye nkọwa ozizi n’ime ya.
- issue: Nkwupụta ‘unu maara ya, hụkwa ya anya’
  choice: E sụgharịrị ya dịka nkwupụta kpọmkwem n’oge dị ugbu a.
  alternative: Ime ka ọ bụrụ naanị ihe ga-eme n’ọdịnihu ma ọ bụ mee ka ‘ịhụ’ bụrụ ‘ịghọta.’
  rationale: γινώσκετε bụ ugbu a, ἑωράκατε bụ perfect, ya mere okwu ahụ na-ekwusi ike na ọnọdụ a amalitela ma na-adịgide.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. A na-eji ‘unu’ n’ihi na ngwaa Grik niile nọ n’ọnụọgụ ọtụtụ. E debere nkwughachi nke ‘ịma’ iji chekwaa njikọ okwu dị na Grik.
