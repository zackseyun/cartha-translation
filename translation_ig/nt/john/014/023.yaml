reference: John 14:23
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῷ· Ἐάν τις ἀγαπᾷ με τὸν λόγον μου τηρήσει, καὶ ὁ πατήρ μου ἀγαπήσει αὐτόν, καὶ πρὸς αὐτὸν ἐλευσόμεθα καὶ μονὴν παρ’ αὐτῷ ⸀ποιησόμεθα.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/023.yaml
  text: Jesus answered and said to him[a], “If anyone loves me, he will keep my word, and my Father will love him[b], and we will come to him and make our dwelling with him.”
translation:
  language: ig
  text: Jizọs zara ya, sị, “Ọ bụrụ na onye ọ bụla hụrụ m n’anya, ọ ga-edebe okwu m[a]. Nna m ga-ahụ ya n’anya, anyị ga-abịakwute ya, anyị ga-emekwa ebe obibi n’ebe ọ nọ[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị “okwu m” ka ọ bụrụ “ozizi m” ma ọ bụ “ihe m na-ekwu.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “anyị ga-eme ebe obibi anyị n’ebe ọ nọ,” ma ọ bụ “anyị ga-ebi n’ebe ọ nọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῷ
  choice: Jizọs zara ya sị
  rationale: Nke a bụ ụzọ Igbo si ekwu okwu n’ụzọ ebumpụta ụwa ma dị ùgwù, na-ejikọkwa echiche nke ‘zara’ na ‘sị ya’ dị n’asụsụ Grik n’enweghị nkwughachi na-adịghị eke.
- source_word: Ἐάν τις
  choice: Ọ bụrụ na onye ọ bụla
  rationale: Ọ na-egosi ọnọdụ metụtara onye ọ bụla n’enweghị ịkpa ókè, dịka usoro okwu Grik si dị.
- source_word: ἀγαπᾷ με
  choice: hụrụ m n’anya
  rationale: Nke a bụ ụzọ Igbo nkịtị na nke doro anya si akọ ịhụ mmadụ n’anya.
- source_word: τὸν λόγον μου
  choice: okwu m
  rationale: ‘Okwu m’ na-edobe obosara λόγος na ụda pụrụ iche nke Jọn; ọ pụrụ ịpụta ozi, ozizi, ma ọ bụ ihe Jizọs kwuru, ya mere e tinyere ihe ndị ọzọ a pụrụ ịsụgharị ya na nkọwa ala peeji.
- source_word: τηρήσει
  choice: ọ ga-edebe
  rationale: ‘I debe’ na-ejide echiche τηρέω nke ichekwa na irube isi n’okwu ahụ, n’emeghị ka ọ bụrụ naanị iwu a na-erubere isi.
- source_word: ὁ πατήρ μου ἀγαπήσει αὐτόν
  choice: Nna m ga-ahụkwa ya n’anya
  rationale: Ọ na-edobe aha mmekọrịta ‘Nna m,’ ngwaa ọdịnihu, na njikọ ‘kwa’ dị na Grik.
- source_word: πρὸς αὐτὸν ἐλευσόμεθα
  choice: anyị ga-abịakwute ya
  rationale: ‘Ịbịakwute’ na-egosi mmegharị n’ebe mmadụ nọ na mmekọrịta onwe onye nke πρός na-egosi ebe a.
- source_word: μονὴν παρ’ αὐτῷ ποιησόμεθα
  choice: meekwara ebe obibi anyị n’ebe ọ nọ
  rationale: Nke a na-edobe ihe atụ Grik nke ‘ime ebe obibi’ nakwa ọnụnọ na-adịgide adịgide n’ebe onye ahụ nọ, ma mee ka onye nwe ebe obibi ahụ pụta ìhè site na ‘anyị.’
theological_decisions:
- issue: Onye ọtụtụ dị na ‘anyị ga-abịakwute ... meekwara ebe obibi anyị’
  choice: E debere ‘anyị’ dịka okwu Jizọs banyere onwe ya na Nna ya, ndị na-abịakọta ma biri n’ebe onye hụrụ ya n’anya nọ.
  alternative: Ịgbanwe ya ka ọ bụrụ okwu onye otu ma ọ bụ ikpuchi onye ọtụtụ iji mee ka ọdịiche ahụ ghara ịpụta.
  rationale: Ngwaa Grik ἐλευσόμεθα na ποιησόμεθα bụ onye mbụ ọtụtụ. Nsụgharị ahụ na-edobe omume jikọrọ ọnụ nke Jizọs na Nna ya n’etinyeghị nkọwa ozizi ọzọ n’ihe odide ahụ.
- issue: Ntụaka onye ọ bụla n’enweghị ịkọ nwoke ma ọ bụ nwaanyị
  choice: E ji ‘onye ọ bụla’ na ‘ya,’ nke na-emetụta nwoke ma nwaanyị n’Igbo.
  alternative: Ịtinye ‘nwoke’ ma ọ bụ okwu ọzọ ga-eme ka ntụaka ahụ bụrụ naanị otu okike.
  rationale: τις bụ onye ọbụla n’ozuzu ya. Nnọchiaha Igbo ‘ya’ na-edobe onye otu ma ghara ịgbakwunye okike nke Grik na-achọghị ịkọwa ebe a.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe nghọta ma dị ùgwù. ‘Jizọs zara ya sị’ bụ usoro akụkọ ebumpụta ụwa n’Igbo; ‘ebe obibi anyị n’ebe ọ nọ’ na-edobe ihe atụ na ịdịgide nke okwu Grik μονή. Akara nkọwa ala peeji [a] na [b] dị kpọmkwem n’akụkụ okwu ha na-akọwa.
