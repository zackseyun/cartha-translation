  variant: Standard Igbo
source:
  edition: SBLGNT
  text: λέγει αὐτῷ Ἰούδας, οὐχ ὁ Ἰσκαριώτης· Κύριε, ⸀τί γέγονεν ὅτι ἡμῖν μέλλεις ἐμφανίζειν σεαυτὸν καὶ οὐχὶ τῷ κόσμῳ;
base_translation:
  language: en
  yaml_path: translation/nt/john/014/022.yaml
  text: Judas (not Iscariot) said to him[a], “Lord[b], what has happened that you are going to reveal yourself to us and not to the world?”
translation:
  language: ig
  text: Judas (ọ bụghị Iskarịọt) sịrị ya, “Onyenwe anyị, gịnị meworo, nke mere na ị na-ezube igosipụta onwe gị nye anyị[a], ma ọ bụghị nye ụwa?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “ime ka anyị mara gị,” ma ọ bụ “igosi anyị onwe gị.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: sịrị
  rationale: Ọ bụ ezie na Grik ji oge ugbu a kọọ akụkọ, oge gara aga bụ ụzọ Igbo nke oge a si akọ ihe mere n’ụzọ dị ire ma doo anya.
- source_word: Ἰούδας, οὐχ ὁ Ἰσκαριώτης
  choice: Judas (ọ bụghị Iskarịọt)
  rationale: Nkọwa dị na nkวงaka na-eme ka Judas a dị iche na Judas Iskarịọt, n’etinyeghị aha ọzọ na-adịghị na isi mmalite.
- source_word: Κύριε
  choice: Onyenwe anyị
  rationale: Nke a bụ aha nkwanye ùgwù a na-ejikarị asụ κύριος mgbe a na-akpọ Jizọs okwu, ma ọ na-edobekwa ịdị arọ nke aha ahụ n’ihe gbasara okwukwe.
- source_word: τί γέγονεν
  choice: gịnị meworo
  rationale: Ụdị perfect nke γίνομαι na-ajụ ihe mere nke wetara ọnọdụ dị ugbu a; “gịnị meworo” na-edobe echiche ahụ kama ịtụgharị ya nanị ka ọ bụrụ “n’ihi gịnị.”
- source_word: ὅτι
  choice: nke mere na
  rationale: Nkebiokwu a na-ejikọta ihe a na-ajụ na ọnọdụ sitere na ya n’ụzọ dị mma n’Igbo.
- source_word: ἡμῖν
  choice: anyị
  rationale: E tinyere nnọchiaha ahụ dịka ndị a ga-ekpughere ihe, n’agbakwụghị “ndị na-eso ụzọ,” ebe isi mmalite etinyeghị ya.
- source_word: μέλλεις
  choice: ị na-ezube
  rationale: Nhọrọ a na-egosi ebumnuche na ihe dị n’ihu, ma ọ naghị ekwusi ike na ọ ga-eme ozugbo.
- source_word: ἐμφανίζειν σεαυτόν
  choice: ikpughere anyị onwe gị
  rationale: Nke a na-edobe ma echiche nke ime ka a hụ ma ọ bụ mara onye ọ bụ, ma na-edobekwa ụdị reflexive nke okwu Grik.
- source_word: κόσμῳ
  choice: ụwa
  rationale: “Ụwa” na-edobe okwu pụrụ iche Jọn ji eme ihe, na-akọwaghị ya gabiga ókè dịka naanị mmadụ niile ma ọ bụ naanị ndị na-ekweghị ekwe.
theological_decisions:
- issue: Ihe κόσμος (“ụwa”) pụtara n’Oziọma Jọn
  choice: ụwa
  alternative: ụmụ mmadụ niile; usoro ụwa nke na-emegide Chineke
  rationale: Amaokwu a anaghị edozi akụkụ niile nke okwu ahụ pụtara. Idebe “ụwa” na-ahapụ omimi na esemokwu dị n’okwu Jọn ka ọnọdụ gbara ya gburugburu kọwaa ya.
- issue: Ụdị mkpughe e kwuru na ἐμφανίζειν σεαυτόν
  choice: ikpughere anyị onwe gị
  alternative: ime ka anyị mara onye ị bụ; ime ka anyị hụ gị
  rationale: Ngwaa Grik nwere ike ịgụnye ime ka a hụ ma ọ bụ ime ka a mara. Isi ntụgharị ahụ na-edobe obosara ihe ọ pụtara, ebe nkọwa ala peeji na-egosi ụzọ ọzọ a pụrụ isi ghọta ya.
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ “gịnị meworo nke mere na” iji chekwaa echiche nke ọnọdụ gbanwere dị na perfect Grik, ọbụna ma nkebiokwu ahụ dị ntakịrị arọ karịa “gịnị mere i ji.”
