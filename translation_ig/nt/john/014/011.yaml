  text: πιστεύετέ μοι ὅτι ἐγὼ ἐν τῷ πατρὶ καὶ ὁ πατὴρ ἐν ἐμοί· εἰ δὲ μή, διὰ τὰ ἔργα αὐτὰ ⸀πιστεύετε.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/011.yaml
  text: Believe me that I am in the Father and the Father is in me; but if not[a], believe because of the works themselves.
translation:
  language: ig
  text: Kwerenụ m na m nọ n’ime Nna, Nna ahụ nọkwa n’ime m; ma ọ bụrụ na ọ bụghị, kwerenụ n’ihi ọrụ ndị ahụ n’onwe ha.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ịsụgharị ya: “Ma ọ bụrụ na ọ bụghị, kwerenụ n’ihi ọrụ ndị ahụ n’onwe ha.” Okwu Grik ikpeazụ a sụgharịrị “kwerenụ” enweghị onye ma ọ bụ ihe e kwuru kpọmkwem a ga-ekwere; echiche ya bụ na ọrụ ndị ahụ n’onwe ha bụ ihe akaebe zuru ezu e ji kwere.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πιστεύετέ μοι
  choice: Kwerenụ m
  rationale: Ngwaa πιστεύω ya na μοι na-enye iwu bụ́ ‘kwerenụ m’ ma ọ bụ ‘kwerenụ ihe m na-ekwu.’ ‘Kwerenụ m’ na-edobe arịrịọ ahụ n’ụzọ kwụ ọtọ ma dịkwa mfe n’Igbo.
- source_word: ὅτι
  choice: na
  rationale: Ọ na-ewebata ihe a chọrọ ka ha kwere, ọ bụghị ihe kpatara nkwenye ahụ.
- source_word: ἐγὼ ἐν τῷ πατρὶ καὶ ὁ πατὴρ ἐν ἐμοί
  choice: m nọ n’ime Nna, Nna ahụ nọkwa n’ime m
  rationale: E debere okwu ἐν ugboro abụọ iji chekwaa okwu Jọn banyere ịdị n’ime ibe ha, n’etinyeghị nkọwa dịka ‘ịbụ otu’ n’ime nsụgharị ahụ.
- source_word: εἰ δὲ μή
  choice: ma ọ bụrụ na unu ekweghị nke a
  rationale: N’Igbo, ikwupụta ihe a na-agọnahụ na-eme ka ọnọdụ ahụ doo anya; ‘nke a’ na-ezo aka n’okwu Jizọs kwuru ozugbo tupu ya.
- source_word: διὰ τὰ ἔργα αὐτὰ
  choice: werenụ ọrụ ndị ahụ n’onwe ha
  rationale: διά na accusative na-egosi ihe ndabere ma ọ bụ ihe kpatara nkwenye; usoro ‘werenụ ... kwere’ bụ Igbo ebumpụta ụwa maka ikwere n’ihi ihe akaebe, ebe ‘n’onwe ha’ na-edobe nkwusi ike nke αὐτά.
- source_word: τὰ ἔργα
  choice: ọrụ ndị ahụ
  rationale: ‘Ọrụ’ bụ okwu sara mbara nke na-adabara ọrụ na ihe ịrịba ama Jizọs n’Oziọma Jọn.
- source_word: πιστεύετε
  choice: kwere
  rationale: E debere iwu ahụ n’enweghị ihe nnara a kpọrọ aha, dịka Grik si dị; a naghị atụkwasị ‘m’ ma ọ bụ ‘n’ime m’.
theological_decisions:
- issue: Ịdị Ọkpara na Nna n’ime ibe ha
  choice: E debere ya dịka ‘m nọ n’ime Nna, Nna ahụ nọkwa n’ime m.’
  alternative: ‘Mụ na Nna bụ otu’ ma ọ bụ ‘Mụ na Nna dị n’otu.’
  rationale: Nke a na-echekwa okwu Jọn kpọmkwem na omimi mmekọrịta ahụ n’ebugharịghị ya gaa n’okwu nkọwa ozizi.
- issue: Ọrụ ndị ahụ dịka ihe ndabere nkwenye
  choice: E mere ka ọrụ ndị ahụ n’onwe ha bụrụ ihe akaebe e ji kwere, ma hapụ ihe nnara nke ‘kwere’ n’ekwughị ya.
  alternative: ‘Kwerenụ m n’ihi ọrụ ndị ahụ’ ma ọ bụ ‘kwerenụ n’ime m n’ihi ọrụ ndị ahụ.’
  rationale: πιστεύετε nke ikpeazụ enweghị ihe nnara doro anya na Grik. Ịghara itinye otu na-echekwa mkpụmkpụ na nghọta abụọ nwere ike ịdị n’ederede ahụ.
translation_notes:
  register: Asụsụ Igbo Izugbe dị ugwu ma dị mfe nghọta. E ji ‘unu’ n’iwu ahụ n’ihi na ụdị ngwaa Grik bụ nke ọtụtụ mmadụ. ‘Nna’ na-ejigide aha mmekọrịta ahụ; ‘Nna ahụ’ na nkebi nke abụọ na-enyere Igbo aka ịmata otu Nna ahụ a kpọtụrụ aha.
