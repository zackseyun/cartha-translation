id: JHN.14.14
reference: John 14:14
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐάν τι αἰτήσητέ ⸀με ἐν τῷ ὀνόματί μου ⸀ἐγὼ ποιήσω.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/014.yaml
  text: If you ask me anything in my name[a], I will do it.
translation:
  language: ig
  text: Ọ bụrụ na unu arịọ m ihe ọ bụla n'aha m,[a] m ga-eme ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ụfọdụ akwụkwọ aka ochie sịrị, “Ọ bụrụ na unu arịọ ihe ọ bụla n'aha m, m ga-eme ya,” ma ha etinyeghị “m.”
    reason: textual_variant
lexical_decisions:
- source_word: ἐάν
  choice: Ọ bụrụ na
  rationale: Na-ewebata ahịrịokwu ọnọdụ; nke a bụ ụzọ Igbo doro anya ma kwekọọ n'ọnọdụ a.
- source_word: τι
  choice: ihe ọ bụla
  rationale: Na-egosi ihe a na-akọwaghị kpọmkwem ma na-ahapụ ohere sara mbara, dịka okwu Grik si dị.
- source_word: αἰτήσητέ
  choice: unu arịọ
  rationale: Ọ bụ ngwaa onye nke abụọ n'ụbara; “arịọ” na-echekwa echiche nke ịrịọ arịrịọ ma ọ bụ ikpe ekpere n'enweghị ịgbakwụnye nkọwa na-adịghị na isiokwu.
- source_word: με
  choice: m
  rationale: SBLGNT nwere nnọchiaha a dịka onye a na-arịọ, ya mere e gosipụtara ya kpọmkwem n'Igbo.
- source_word: ἐν τῷ ὀνόματί μου
  choice: n'aha m
  rationale: Ọ bụ ntụgharị Igbo dị mma ma bụrụkwa nke na-echekwa okwu Jọn gbasara aha, ikike, na onye Jizọs n'enweghị ịkọwa ya karịa ihe e dere.
- source_word: ἐγὼ
  choice: m
  rationale: Nnọchiaha Grik ahụ pụtara ìhè ntakịrị. Ịmalite nkebi nke abụọ na “m” na-echekwa isiokwu ahụ n'ụzọ ebumpụta ụwa n'Igbo.
- source_word: ποιήσω
  choice: ga-eme ya
  rationale: Na-egosi omume ga-eme n'ọdịnihu; “ya” na-ezo aka n'ihe a rịọrọ ma na-eme ka Igbo ahụ zuo oke ma dị mfe nghọta.
theological_decisions:
- issue: Ọnụnọ nke με (“m”) na Jọn 14:14, nke na-egosi na ọ bụ Jizọs ka a na-arịọ kpọmkwem
  choice: E tinyere “arịọ m” n'ahịrịokwu bụ isi.
  alternative: Ọ bụrụ na unu arịọ ihe ọ bụla n'aha m, m ga-eme ya.
  rationale: Isiokwu Grik e nyere, SBLGNT, nwere με. A gbasoro ya n'ahịrịokwu bụ isi, ebe e debere ọdịiche nke akwụkwọ aka ochie ụfọdụ n'okpuru peeji ka e wee ghara izochi esemokwu ederede ahụ ma ọ bụ kpebie ihe ọ pụtara n'ụzọ nkwenkwe.
translation_notes:
  register: Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E ji “unu” gosipụta onye nke abụọ n'ụbara dị na Grik. E debere akpaalaokwu “n'aha m” n'ihi na ọ bụ okwu dị mkpirikpi, amaara ama, nke na-adịghị akatọ nkọwa ya n'otu ụzọ.
