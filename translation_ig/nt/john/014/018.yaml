  text: Οὐκ ἀφήσω ὑμᾶς ὀρφανούς, ἔρχομαι πρὸς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/018.yaml
  text: I will not leave you as orphans[b][a]; I am coming to you.
translation:
  language: ig
  text: Agaghị m ahapụ unu dị ka ụmụ mgbei[a]; ana m abịakwute unu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Agaghị m ahapụ unu n’ọnọdụ ụmụ mgbei.” Okwu Grik ahụ na-eji onyinyo ụmụ ndị nlekọta nne na nna ha na-adịghịzi elekọta atụ ọnọdụ a.
    reason: lexical_alternative
  - marker: b
    text: “Ana m abịakwute unu” nwere ike izo aka n'ọbịbịa Jizọs mgbe o si n'ọnwụ bilie, n'ọbịbịa ya site na Mmụọ Nsọ, ma ọ bụ nlọghachi ya n'ọdịnihu. Okwu Grik ahụ n'onwe ya anaghị amanye naanị otu nghọta.
    reason: alternative_reading
lexical_decisions:
- source_word: Οὐκ ἀφήσω
  choice: Agaghị m ahapụ
  rationale: Okwu ọdịnihu a na-egosi na Jizọs agaghị ahapụ ndị na-eso ụzọ ya n'azụ; “ahapụ” bụ okwu Igbo doro anya nke na-adịghị etinye echiche ọzọ dị ka ịgbaghara mmehie.
- source_word: ὑμᾶς ὀρφανούς
  choice: unu ka unu bụrụ ụmụ na-enweghị nne na nna
  rationale: 'Nke a na-echekwa ihe atụ ezinụlọ dị n''okwu Grik ὀρφανός: ụmụ a hapụrụ n''enweghị nlekọta nne na nna. Ọ na-ezere ime ka okwu ahụ bụrụ naanị mmetụta nke ịnọ naanị ya.'
- source_word: ἔρχομαι
  choice: ana m abịakwute
  rationale: Ụdị ugbu a nke ngwaa Grik nwere ike igosi ọbịbịa dị nso ma ọ bụ kwusie ike na ọbịbịa ahụ. “Ana m abịakwute” na-echekwa ịdị-ugbu a ahụ n'Igbo eke.
- source_word: πρὸς ὑμᾶς
  choice: unu
  rationale: Mgbe e jikọtara ya na “abịakwute,” nnọchiaha “unu” na-egosi ngagharị bịakwuru ndị a na-agwa okwu n'ụzọ Igbo si ekwu ya nke ọma.
theological_decisions:
- issue: Ihe na oge okwu ahụ bụ “ana m abịakwute unu” na-ezo aka na ya
  choice: E depụtara okwu ahụ n'ebughị ụzọ kpebie ma ọ na-ezo aka n'ọbịbịa Jizọs mgbe o si n'ọnwụ bilie, n'ọbịbịa ya site na Mmụọ Nsọ, ma ọ bụ n'ọbịbịa ya n'ọdịnihu.
  alternative: Ịkọwa ya kpọmkwem dị ka ọhụhụ ya mgbe mbilite n'ọnwụ gasịrị, ọbịbịa ya site na Mmụọ Nsọ, ma ọ bụ nlọghachi ikpeazụ ya.
  rationale: Ọnọdụ amaokwu ndị gbara ya gburugburu na-ekwu maka Mmụọ Nsọ, ma okwu Grik ahụ n'onwe ya anaghị amanye naanị otu n'ime nghọta ndị a. Nsụgharị ahụ na-echekwa obosara na esemokwu nkà mmụta okpukpe dị na ya.
translation_notes:
  register: Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta. A họọrọ nkebiokwu zuru ezu “ụmụ na-enweghị nne na nna” iji mee ka ihe atụ nke ὀρφανός doo ndị nkịtị anya; e debere “ana m abịakwute” iji chekwaa ụdị ugbu a na ịdị nso nke ἔρχομαι.
