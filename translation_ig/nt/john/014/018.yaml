revisions:
- from: Agaghị m ahapụ unu ka unu bụrụ ụmụ na-enweghị nne na nna[a]; ana m abịakwute unu.[b]
  to: Agaghị m ahapụ unu dị ka ụmụ mgbei[a]; ana m abịakwute unu.[b]
  rationale: 'The revision replaces an over-explicit result clause with a direct Standard Igbo rendering of the Greek predicate image: Jesus will not leave the disciples “as orphans.” The footnote retains the image’s parental-care background without claiming more than the Greek requires. The second clause and its ambiguity footnote are retained, with “nloghachi ya n''ọdịnihu” making the future-return option explicit without selecting it as the verse’s required meaning.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T06:26:17Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders the future negation (Οὐκ ἀφήσω), the disciples as the object (ὑμᾶς), and the vivid present-form coming (ἔρχομαι πρὸς ὑμᾶς). However, “ka unu bụrụ ụmụ na-enweghị nne na nna” unnecessarily recasts the predicate image as a result clause and explicitly identifies the addressed disciples as children without both parents. “dị ka ụmụ mgbei” more directly preserves the Greek predicate comparison and its figurative bereavement image.
  naturalness: “Agaghị m ahapụ unu dị ka ụmụ mgbei” is concise, idiomatic Standard Igbo, and appropriately solemn. “Ana m abịakwute unu” is natural and retains the Greek present’s immediacy.
  terminology: “ụmụ mgbei” is an established, readily understood expression for orphans and preserves the familial image without making an unwarranted claim that both parents are absent. The Spirit reference remains “Mmụọ Nsọ,” and the footnote does not settle the disputed referent of Jesus’ coming.
  issues:
  - severity: medium
    issue: The main clause renders ὀρφανούς as “ka unu bụrụ ụmụ na-enweghị nne na nna.”
    rationale: This adds a result construction (“so that you become”) not expressed by the Greek predicate accusative and over-specifies orphanhood as lacking both mother and father. A direct comparative predicate better reflects the source.
  - severity: low
    issue: Footnote a’s proposed alternative is wordy and weakens the lexical correspondence to “orphans.”
    rationale: A concise alternative using “ụmụ mgbei” / “n’ọnọdụ ụmụ mgbei” better explains the figurative image while avoiding unnecessary elaboration.
  revised_text: Agaghị m ahapụ unu dị ka ụmụ mgbei[a]; ana m abịakwute unu.[b]
