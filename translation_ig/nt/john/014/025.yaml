  text: Ταῦτα λελάληκα ὑμῖν παρ’ ὑμῖν μένων·
base_translation:
  language: en
  yaml_path: translation/nt/john/014/025.yaml
  text: I have spoken these things to you while staying with you[a].
translation:
  language: ig
  text: Agwala m unu ihe ndị a mgbe m ka nọnyere unu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “mgbe m nọnyere unu,” ma ọ bụ “mgbe mụ na unu ka nọ.” Okwu Grik e ji mee ihe bụ ụdị ngwaa pụtara “ịnọgide” ma ọ bụ “ịnọ,” bụ́ okwu na-apụta ugboro ugboro n’Oziọma Jọn.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταῦτα
  choice: ihe ndị a
  rationale: Na-egosi ọtụtụ ihe Jizọs kuziri tupu amaokwu a ma na-edobe ụdị ọtụtụ nke okwu Grik.
- source_word: λελάληκα
  choice: Agwala m
  rationale: Oge perfect n’asụsụ Grik na-egosi okwu e kwuwororị nke ka dị mkpa; ụdị Igbo a bụ nke eke ma na-eburu echiche ahụ.
- source_word: ὑμῖν
  choice: unu
  rationale: Nnọchiaha a dị n’ụdị ọtụtụ, ebe Jizọs na-agwa ndị na-eso ụzọ ya okwu.
- source_word: παρ’ ὑμῖν
  choice: nọnye unu
  rationale: παρά tinyere dative na-egosi ịnọ mmadụ nso ma ọ bụ ịnọ ya na ya; ‘nọnye unu’ bụ okwu Igbo doro anya ma dị eke.
- source_word: μένων
  choice: mgbe m ka nọnyere
  rationale: Present participle nke μένω na-egosi na ọ ka nọ ha na ha n’oge o kwuru okwu ndị a. ‘Ka nọnyere’ na-edobe echiche ịnọgide/nọgide na-adị ma ghara ịdị arọ n’Igbo.
theological_decisions:
- issue: Idobe njikọ okwu μένω nke na-apụta ugboro ugboro n’Oziọma Jọn
  choice: mgbe m ka nọnyere unu
  alternative: mgbe mụ na unu ka nọ
  rationale: Nhọrọ a na-egosi ịnọgide Jizọs nọ n’etiti ndị na-eso ụzọ ya, ma ọ naghị etinye nkọwa okpukpe ọzọ n’ihe odide ahụ.
translation_notes:
  register: Igbo Izugbe nke oge a, dị mfe nghọta ma dị ùgwù. ‘Agwala m unu’ bụ usoro okwu eke n’Igbo maka perfect, ebe ‘mgbe m ka nọnyere unu’ na-egosipụta participle ahụ n’enweghị okwu siri ike ma ọ bụ nkọwa agbakwunyere.
