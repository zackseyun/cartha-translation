revisions:
- from: Ana m ahapụrụ unu udo; ana m enye unu udo nke m. Ọ bụghị dị ka ụwa si enye ka m si enye unu. Unu ekwela ka obi unu maa jijiji, ya adịkwala ụjọ.[a]
  to: Ana m ahapụ unu udo; ana m enye unu udo nke m. Ọ bụghị dị ka ụwa si enye ka m si enye unu. Unu ekwela ka obi unu maa jijiji, obi unu atụkwala ụjọ.[a]
  rationale: The revision corrects the verbal aspect of ‘leave’ and replaces an unclear final phrase with idiomatic Standard Igbo. It retains the singular collective expression “obi unu,” the broad theological sense of “udo,” and the source’s distinction between inward disturbance and fear/loss of courage.
