id: JHN.14.27
reference: John 14:27
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἰρήνην ἀφίημι ὑμῖν, εἰρήνην τὴν ἐμὴν δίδωμι ὑμῖν· οὐ καθὼς ὁ κόσμος δίδωσιν ἐγὼ δίδωμι ὑμῖν. μὴ ταρασσέσθω ὑμῶν ἡ καρδία μηδὲ δειλιάτω.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/027.yaml
  text: Peace I leave with you; my peace I give to you. I do not give to you as the world gives. Do not let your heart be troubled[a], nor let it be fearful.
translation:
  language: ig
  text: Ana m ahapụ unu udo; ana m enye unu udo nke m. Ọ bụghị dị ka ụwa si enye ka m si enye unu. Unu ekwela ka obi unu maa jijiji, obi unu atụkwala ụjọ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “obi unu atụla egwu” ma ọ bụ “obi unu adala mba.” Ngwaa Grik ahụ na-ekwu maka ịtụ egwu ma ọ bụ ịkwụsị inwe obi ike.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰρήνην
  choice: udo
  rationale: “Udo” bụ okwu Igbo a na-ejikarị sụgharị εἰρήνη, ma ọ ka na-enye ohere maka nghọta ya sara mbara karịa nanị enweghị ọgụ.
- source_word: ἀφίημι
  choice: ana m ahapụrụ
  rationale: Nke a na-egosipụta ihe Jizọs na-ahapụrụ ndị na-eso ụzọ ya, n’enweghị ịgbakwunye echiche nketa nke okwu Grik nwere ike ịkpata.
- source_word: εἰρήνην τὴν ἐμὴν
  choice: udo nke m
  rationale: Nhazi a na-eme ka nkwusi ike dị n’aha nnọchi nke Grik pụta ìhè ma kewapụ udo Jizọs n’udo ụwa.
- source_word: δίδωμι
  choice: ana m enye
  rationale: Ọ na-echekwa nkwughachi nke ngwaa “inye” na ọdịiche dị n’etiti otú Jizọs si enye na otú ụwa si enye.
- source_word: οὐ καθὼς ὁ κόσμος δίδωσιν
  choice: Ọ bụghị dị ka ụwa si enye ka m si enye unu
  rationale: Nke a bụ usoro Igbo sitere n’okike nke na-edobe ntụnyere na nkwusi ike dị n’odịiche ahụ.
- source_word: κόσμος
  choice: ụwa
  rationale: “Ụwa” na-echekwa obosara na ụda pụrụ iche κόσμος nwere n’Oziọma Jọn, n’enweghị imechi ya n’otu nkọwa.
- source_word: μὴ ταρασσέσθω
  choice: Unu ekwela ka obi unu maa jijiji
  rationale: Akpaalaokwu a na-egosi obi ịda mba ma ọ bụ ịma jijiji n’ime, ma na-edobe ụdị iwu nke na-asị ka ha ghara ikwe ka nke ahụ mee.
- source_word: ὑμῶν ἡ καρδία
  choice: obi unu
  rationale: “Obi unu” bụ akpaalaokwu Igbo sitere n’okike nke nwere ike ịnọgide na-anọchi otu “obi” jikọrọ ọtụtụ ndị, dịka Grik si dị.
- source_word: μηδὲ δειλιάτω
  choice: ya adịkwala ụjọ
  rationale: Nke a na-egosipụta egwu ma ọ bụ ịda mba nke δειλιάω, ma na-ezere okwu siri ike nke ga-apụta dịka ebubo ịbụ onye ụjọ.
theological_decisions:
- issue: Ụdị udo Jizọs na-enye
  choice: A hapụrụ ya dịka “udo” na “udo nke m,” n’enweghị nkọwa mgbakwunye.
  alternative: Ịkọwa ya kpọmkwem dịka udo nke obi, ịdị n’otu na Chineke, ma ọ bụ izu oke nke oge nzọpụta.
  rationale: Amaokwu ahụ akọwaghị udo ahụ n’otu ụzọ kpọmkwem; okwu sara mbara na-echekwa omimi na esemokwu nkà mmụta okpukpe dị na ya.
- issue: Otu obi na nnọchiaha ọtụtụ
  choice: “obi unu”
  alternative: “obi dị unu niile” ma ọ bụ ịgbanwe ya ka ọ bụrụ ọtụtụ obi n'ụzọ doro anya.
  rationale: Nke a na-echekwa otu aha “obi” na nnọchiaha ọtụtụ dị na Grik, ma bụrụkwa Igbo nkịtị.
translation_notes:
  register: Asụsụ Igbo Izugbe, nke dị ugwu ma dị mfe nghọta. E ji usoro ahịrịokwu sitere n’okike mee ihe, ma e chekwara nkwughachi “udo” na “inye,” nkwusi ike nke “udo nke m,” nakwa ọdịiche dị n’etiti nsogbu obi na ụjọ.
