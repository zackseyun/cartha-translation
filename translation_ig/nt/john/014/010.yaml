id: JHN.14.10
reference: John 14:10
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οὐ πιστεύεις ὅτι ἐγὼ ἐν τῷ πατρὶ καὶ ὁ πατὴρ ἐν ἐμοί ἐστιν; τὰ ῥήματα ἃ ἐγὼ ⸀λέγω ὑμῖν ἀπ’ ἐμαυτοῦ οὐ λαλῶ, ὁ δὲ ⸀πατὴρ ἐν ἐμοὶ ⸀μένων ποιεῖ τὰ ἔργα ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/010.yaml
  text: Do you not believe that I am in the Father and the Father is in me? The words that I say to you I do not speak from myself[b][a], but the Father who remains in me does his works.
translation:
  language: ig
  text: Ì kweghị na m nọ n’ime Nna, na Nna nọkwa n’ime m? Okwu ndị m na-agwa unu, anaghị m ekwu ha site n’onwe m[a]; kama Nna nke na-anọgide n’ime m[b] na-arụ ọrụ ndị ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “site n’ike aka m.” Okwu ahụ nwere ike ịpụta ikwu okwu n’ihi ikike ma ọ bụ ebumnuche nke onwe.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “nke na-adịgide n’ime m.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πιστεύεις
  choice: Ì kweghị
  rationale: A họọrọ ngwaa ‘ikwere’ iji chekwaa isiokwu πιστεύω nke na-apụta ugboro ugboro n’Oziọma Jọn. Ụdị a bụ ajụjụ a jụrụ otu onye.
- source_word: ἐν τῷ πατρὶ ... ἐν ἐμοί
  choice: n’ime Nna ... n’ime m
  rationale: Nsụgharị a na-edobe okwu ‘n’ime’ ugboro abụọ, ka asụsụ banyere ịdị n’ime ibe ha ghara ịghọ nkọwa dịka ‘ịbụ otu.’
- source_word: ῥήματα
  choice: Okwu
  rationale: ‘Okwu’ bụ ụzọ doro anya ma bụrụkwa nke ndị Igbo na-eji kwa ụbọchị maka ihe ndị e kwuru.
- source_word: λέγω ὑμῖν
  choice: m na-agwa unu
  rationale: ‘Na-agwa unu’ na-egosi na okwu ahụ bụ nke a na-agwa ndị mmadụ, ma na-edobekwa ‘unu’ dị ka ọtụtụ mmadụ n’asụsụ Greek.
- source_word: ἀπ’ ἐμαυτοῦ
  choice: site n’onwe m
  rationale: Nke a na-echekwa echiche nke isi mmalite ma ọ bụ ime ihe n’uche na ikike nke onwe, na-enweghị imechi nghọta ahụ n’otu nkọwa.
- source_word: λαλῶ
  choice: anaghị m ekwu ha
  rationale: ‘Ikwu’ bụ okwu nkịtị na nke eke maka omume ikwu okwu; nnọchiaha ‘ha’ na-ezo aka n’okwu ndị ahụ ma mee ka ahịrịokwu ahụ doo anya n’Igbo.
- source_word: μένων
  choice: nke na-anọgide
  rationale: ‘Na-anọgide’ na-egosi ịdịgide adịgide nke μένω ma zere okwu ochie ma ọ bụ okwu siri ike nghọta.
- source_word: ποιεῖ τὰ ἔργα αὐτοῦ
  choice: na-arụ ọrụ ya
  rationale: ‘Na-arụ ọrụ ya’ bụ Igbo eke nke na-edobe ma omume Nna na njirimara ọrụ ahụ dịka nke ya.
theological_decisions:
- issue: Ịdị Nna na Ọkpara n’ime ibe ha
  choice: m nọ n’ime Nna, na Nna nọkwa n’ime m
  alternative: mụ na Nna bụ otu
  rationale: A hapụrụ asụsụ mmekọrịta ahụ dịka ọ dị na Greek, kama ịgbanwe ya ka ọ bụrụ okwu sitere n’ebe ọzọ ma ọ bụ nkọwa ozizi.
- issue: Isi mmalite okwu Jizọs na onye na-arụ ọrụ ndị ahụ
  choice: anaghị m ekwu ha site n’onwe m; kama Nna ... na-arụ ọrụ ya
  alternative: anaghị m ekwu ha n’ike aka m; Nna ... bụ onye na-eme ọrụ ndị ahụ
  rationale: Nhọrọ a na-edobe njikọ chiri anya na ọdịiche dị n’etiti Nna na Ọkpara, na-enweghị ịkọwa karịa ihe amaokwu ahụ kwuru ma ọ bụ ime ka Ọkpara yie naanị ihe e kere eke.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E debere ‘Nna’ na mkpụrụedemede ukwu n’ihi na ọ bụ aha e ji akọwa Chineke n’ebe a. A na-agwa otu onye n’ajụjụ mbụ, ma ‘unu’ na-egosi ọtụtụ ndị n’akụkụ nke abụọ, dịka Greek si dị.
