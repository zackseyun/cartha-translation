review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the singular addressee in πιστεύεις, the reciprocal 'in' language, the contrast between λέγω and λαλῶ, and the Father's continuing presence. However, 'na-arụ ọrụ ya' renders the plural τὰ ἔργα as a singular/general 'work'; the source explicitly has 'his works.'
  naturalness: The revised wording is clear, modern Standard Igbo, and retains a suitably dignified Gospel register. 'Nna nke na-anọgide n’ime m' is natural and directly modifies the Father as in the Greek.
  terminology: ‘Kwere,’ ‘n’ime,’ ‘okwu,’ ‘na-anọgide,’ and ‘ọrụ’ appropriately retain Johannine vocabulary and do not add doctrinal interpretation. The alternative in footnote b should express continued remaining rather than merely living/dwelling.
  issues:
  - severity: medium
    issue: Plural τὰ ἔργα αὐτοῦ is not fully represented.
    rationale: ‘ọrụ ya’ normally denotes his work (singular or collective), whereas the Greek says ‘his works.’ ‘ọrụ ndị ya’ explicitly preserves the plural.
  - severity: low
    issue: Footnote b gives ‘nke bi n’ime m’ as the alternative for μένων.
    rationale: ‘Bi’ can convey dwelling, but it does not adequately retain the continuing/remain sense of the present participle. ‘Nke na-adịgide n’ime m’ is a closer lexical alternative.
  - severity: low
    issue: Footnote a’s proposed alternative is overly expansive.
    rationale: ‘n’uche na ikike nke aka m’ introduces ‘thought/mind,’ which is not expressed by ἀπ’ ἐμαυτοῦ. A concise alternative based on personal authority better preserves the source ambiguity.
  revised_text: Ì kweghị na m nọ n’ime Nna, na Nna nọkwa n’ime m? Okwu ndị m na-agwa unu, anaghị m ekwu ha site n’onwe m[a]; kama Nna nke na-anọgide n’ime m[b] na-arụ ọrụ ndị ya.
  revised_footnotes:
