- from: 'N’ezie[a], n’ezie, ana m asị unu: onye kwere na m ga-arụkwa ọrụ ndị m na-arụ; ọ ga-arụkwa ọrụ ndị ka ndị a ukwuu[b], n’ihi na ana m alakwuru Nna m.'
  to: 'N’ezie[a], n’ezie, ana m asị unu: onye kwere na m ga-arụkwa ọrụ ndị m na-arụ; ọ ga-arụkwa ọrụ ndị ka ndị a ukwuu[b], n’ihi na ana m agakwuru Nna.'
  rationale: Removed the added possessive from the final designation of the Father, while using idiomatic Igbo ‘Nna’ to preserve the Greek definite reference. Corrected footnote b so that its explanatory quotation includes the comparison ‘than these’ and accurately identifies the implied noun.
