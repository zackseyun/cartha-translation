    text: Ma ọ bụ, “Amen, amen.”
    reason: lexical_alternative
  - marker: b
    text: N’asụsụ Grik, “ọ ga-arụkwa ihe ndị ka ndị a ukwuu”; a na-aghọta “ọrụ” site n’okwu bu ụzọ.
    reason: lexical_alternative
  revision_rationale: Removed the added possessive from the final designation of the Father, while using idiomatic Igbo ‘Nna’ to preserve the Greek definite reference. Corrected footnote b so that its explanatory quotation includes the comparison ‘than these’ and accurately identifies the implied noun.
