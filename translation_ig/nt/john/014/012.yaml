id: JHN.14.12
reference: John 14:12
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀμὴν ἀμὴν λέγω ὑμῖν, ὁ πιστεύων εἰς ἐμὲ τὰ ἔργα ἃ ἐγὼ ποιῶ κἀκεῖνος ποιήσει, καὶ μείζονα τούτων ποιήσει, ὅτι ἐγὼ πρὸς τὸν ⸀πατέρα πορεύομαι·
base_translation:
  language: en
  yaml_path: translation/nt/john/014/012.yaml
  text: Truly[a], truly, I say to you, the one who believes in me will also do the works that I do; and he will do greater works than these[b], because I am going to the Father.
translation:
  language: ig
  text: 'N’ezie[a], n’ezie, ana m asị unu: onye kwere na m ga-arụkwa ọrụ ndị m na-arụ; ọ ga-arụkwa ọrụ ndị ka ndị a ukwuu[b], n’ihi na ana m agakwuru Nna.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Amen, amen.”
    reason: lexical_alternative
  - marker: b
    text: N’asụsụ Grik, “ọ ga-arụkwa ihe ndị ka ndị a ukwuu”; a na-aghọta “ọrụ” site n’okwu bu ụzọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν ἀμὴν
  choice: N’ezie, n’ezie
  rationale: Na-egosipụta nkwusi ike nke usoro okwu ahụ e kwughachiri ugboro abụọ n’Igbo doro anya ma dịkwa nsọpụrụ.
- source_word: ὁ πιστεύων εἰς ἐμέ
  choice: onye kwere na m
  rationale: Na-enye participle ahụ dị ka onye ọ bụla kweere, ma na-edobe ụzọ Jọn si ekwu maka ikwere na Jizọs.
- source_word: τὰ ἔργα ἃ ἐγὼ ποιῶ
  choice: ọrụ ndị m na-arụ
  rationale: “Ọrụ” na-edobe okwu Jọn ji akọwa ihe ịrịba ama na omume Jizọs; present tense bụ “na-arụ” n’Igbo.
- source_word: κἀκεῖνος ποιήσει
  choice: ga-arụkwa
  rationale: Nganiihu “-kwa” na-eburu echiche nke “onye ahụ kwa,” ebe ọdịnihu “ga-arụ” kwekọrọ na ποιήσει.
- source_word: καὶ μείζονα τούτων ποιήσει
  choice: ọ ga-arụkwa ọrụ ndị ka ndị a ukwuu
  rationale: E tinyere “ọrụ,” nke a na-aghọta site n’ahịrịokwu bu ụzọ, ka Igbo wee zuo oke ma bụrụ ihe a na-aghọta nke ọma; a hapụrụ ụdị ịdị ukwuu ahụ n’enweghị nkọwa agbakwunyere.
- source_word: ὅτι
  choice: n’ihi na
  rationale: Na-egosi ihe kpatara okwu banyere ọrụ ndị ka ukwuu.
- source_word: πρὸς τὸν πατέρα πορεύομαι
  choice: ana m alakwuru Nna m
  rationale: “Ana m alakwuru” na-egosi njem na-eru nso dịka present tense nke Greek si arụ ọrụ n’ebe a; “Nna m” bụ ụzọ Igbo ebumpụta ụwa si kọwaa onye Jizọs na-alakwuru, ọ bụ ezie na Greek nwere “Nna ahụ.”
theological_decisions:
- issue: Ihe “ọrụ ndị ka ndị a ukwuu” pụtara
  choice: 'A hapụrụ okwu ahụ ka ọ saa mbara: onye kwere ga-arụ ọrụ ndị ka ọrụ ndị Jizọs na-arụ ukwuu n’ụzọ ụfọdụ, nke jikọrọ ya na ịlakwuru Nna ya.'
  alternative: Ọ pụrụ ịpụta ịdị ukwuu n’ogo mgbasa oziọma, n’ọnọdụ ọhụrụ nke nzọpụta, ma ọ bụ n’ozi nke Mmụọ Nsọ na-eme ka o kwe omume.
  rationale: Amaokwu ahụ akọwaghị kpọmkwem ụzọ ọrụ ndị ahụ ga-esi ka ukwuu; ya mere, nsụgharị ahụ etinyeghị otu nkọwa okpukpe kpọmkwem.
- issue: Nkọwa izugbe nke ὁ πιστεύων ... κἀκεῖνος
  choice: “onye kwere ... ọ” na-ezo aka n’onye ọ bụla kwere na Jizọs.
  alternative: Iji usoro kpọmkwem nke nwoke mee ka ọdịdị grammatical Greek pụta ìhè.
  rationale: “Onye ... ọ” n’Igbo bụ usoro izugbe nke na-adịghị egbochi nwoke ma ọ bụ nwanyị, ma na-edobe singular representative force.
translation_notes:
  register: Igbo ọkọlọtọ nke oge a, doro anya ma dị nsọpụrụ. E ji “unu” debe plural nke ὑμῖν; e jikwa “onye ... ọ” gosipụta onye kwere ọ bụla n’enweghị ịkpa oke nwoke na nwanyị.
