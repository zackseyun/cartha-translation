revisions:
- from: Jizọs sịrị ya, “Anọwo mụ na unu ogologo oge a niile[a], ma ị ka matabeghị m, Filip? Onye hụrụla m ahụla Nna ahụ. Olee otú ị ga-esi sị, ‘Gosi anyị Nna ahụ’?”
  to: Jizọs sịrị ya, “Ọ̀ dịla ogologo oge a ka m nọnyere unu[a], ma ị ka matabeghị m, Filip? Onye hụrụla m ahụla Nna. Olee otú ị ga-esi sị, ‘Gosi anyị Nna’?”
  rationale: The revision makes the duration question more idiomatic in Standard Igbo, removes an unsupported emphatic pronoun, and renders ‘the Father’ as the natural Igbo divine title ‘Nna.’ It retains the singular/plural contrast, the perfect-result sense of knowing and seeing, the rhetorical force, and the source text’s strong but unexpanded Christological claim.
