reference: John 14:9
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: λέγει αὐτῷ ὁ Ἰησοῦς· ⸂Τοσούτῳ χρόνῳ⸃ μεθ’ ὑμῶν εἰμι καὶ οὐκ ἔγνωκάς με, Φίλιππε; ὁ ἑωρακὼς ἐμὲ ἑώρακεν τὸν πατέρα· ⸀πῶς σὺ λέγεις· Δεῖξον ἡμῖν τὸν πατέρα;
base_translation:
  language: en
  yaml_path: translation/nt/john/014/009.yaml
  text: Jesus said to him[a], “Have I been with you for so long, and you still have not known me, Philip? The one who has seen me has seen the Father. How can you say, ‘Show us the Father’?”
translation:
  language: ig
  text: Jizọs sịrị ya, “Ọ̀ dịla ogologo oge a ka m nọnyere unu[a], ma ị ka matabeghị m, Filip? Onye hụrụla m ahụla Nna. Olee otú ị ga-esi sị, ‘Gosi anyị Nna’?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ogologo oge dị otu a.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοσούτῳ χρόνῳ
  choice: ogologo oge a niile
  rationale: Nkebiokwu a na-egosi ogologo oge gara n’ihu ruo ugbu a. ‘Ogologo oge a niile’ bụ Igbo nkịtị nke na-echekwa ike ajụjụ Jizọs jụrụ; e tinyere ụzọ ọzọ n’ala ala peeji.
- source_word: μεθ’ ὑμῶν εἰμι
  choice: Anọwo mụ na unu
  rationale: Ọ bụ ezie na εἰμι dị n’ụdị ugbu a, ọnọdụ ya na nkebiokwu oge na-egosi ịnọnyere ha malite n’oge gara aga ruo mgbe ahụ. ‘Anọwo mụ na unu’ na-egosipụta nke a nke ọma, ma ‘unu’ na-echekwa ụbara nke ὑμῶν.
- source_word: οὐκ ἔγνωκάς με
  choice: ị ka matabeghị m
  rationale: Ụdị zuru oke nke γινώσκω na-egosi na Filip enweela ohere ịmata Jizọs ma ọ ka erubeghị n’ịmata ya. ‘Ka ... matabeghị’ na-ebupụta nkatọ dị n’ajụjụ ahụ n’Igbo eke.
- source_word: Φίλιππε
  choice: Filip
  rationale: Nke a bụ nsụgharị aha Φίλιππος n’ụdị a na-aghọta ngwa ngwa n’Igbo.
- source_word: ὁ ἑωρακὼς ἐμὲ
  choice: Onye hụrụla m
  rationale: Articular perfect participle na-arụ ọrụ dị ka aha onye; ‘Onye hụrụla m’ bụ okwu doro anya ma na-echekwa echiche nke ịhụ nke rụpụtara ọnọdụ dị ugbu a.
- source_word: ἑώρακεν τὸν πατέρα
  choice: ahụla Nna ahụ
  rationale: A hapụrụ okwu ahụ n’ụzọ kwụ ọtọ, tinyekwa ‘ahụ’ iji gosipụta article Greek dị na τὸν πατέρα, n’enweghị ime ka nkwupụta Kraịst a ghọọ naanị myirịta ma ọ bụ ịgbakwụnye nkọwa ozizi.
- source_word: πῶς σὺ λέγεις
  choice: Olee otú ị ga-esi sị
  rationale: πῶς bụ ajụjụ nkwugide na-egosi ihe ijuanya ma ọ bụ enweghị nghọta; ụdị Igbo a na-echekwa ike ahụ nke ọma.
- source_word: Δεῖξον ἡμῖν τὸν πατέρα
  choice: Gosi anyị Nna ahụ
  rationale: ‘Gosi’ na-anọchi aorist imperative δείκνυμι n’ụzọ kpọmkwem, ‘anyị’ na-echekwa ụbara ἡμῖν, ‘Nna ahụ’ na-echekwakwa article nke Greek.
theological_decisions:
- issue: Mmekọrịta dị n’etiti ịhụ Jizọs na ịhụ Nna ahụ
  choice: “Onye hụrụla m ahụla Nna ahụ”
  alternative: “Onye hụrụla m ahụla ụdị onye Nna ahụ bụ” ma ọ bụ nkọwa sara mbara nke na-etinye okwu nkwupụta okwukwe ndị e mechara dee
  rationale: A hapụrụ nkwupụta ahụ n’ike na nkenke o nwere na Greek. E meghị ka ọ bụrụ naanị na Jizọs yiri Nna ahụ, e tinyekwaraghị okwu ozizi ndị na-adịghị n’amaokwu a; nke a na-echekwa ma nkwupụta Kraịst siri ike ma esemokwu omimi dị n’okwu ahụ.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke nwere ugwu ma dị mfe nghọta. A kpachapụrụ anya ichekwa ‘unu’ nke ụbara na ‘ị’ nke otu onye, n’ihi na Jizọs anọwo n’etiti ndị na-eso ụzọ ya niile ma na-agwa Filip okwu kpọmkwem.
