id: JHN.14.30
reference: John 14:30
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οὐκέτι πολλὰ λαλήσω μεθ’ ὑμῶν, ἔρχεται γὰρ ὁ τοῦ κόσμου ἄρχων· καὶ ἐν ἐμοὶ οὐκ ἔχει οὐδέν,
base_translation:
  language: en
  yaml_path: translation/nt/john/014/030.yaml
  text: I will no longer speak much with you[a], for the ruler of the world is coming[b]. And he has nothing in me.
translation:
  language: ig
  text: Agaghị m agwa unu ọtụtụ okwu ọzọ, n’ihi na onye na-achị ụwa[a] na-abịa. O nweghịkwa ihe ọ bụla n’ime m[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, ‘onye na-achị ụwa a.’ Ụfọdụ nsụgharị na-etinye ‘a’ n’ihi okwu ndị yiri nke a n’ebe ndị ọzọ n’Oziọma Jọn, ma Grik ebe a kwuru naanị ‘ụwa.’
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, ‘o nweghị ihe ọ bụla ọ ga-eji maa m ikpe,’ ma ọ bụ, ‘o nweghị ike ijide m.’ N’okwu nkịtị, Grik sịrị, ‘o nweghị ihe ọ bụla n’ime m.’
    reason: alternative_reading
lexical_decisions:
- source_word: οὐκέτι πολλὰ λαλήσω μεθ’ ὑμῶν
  choice: Agaghị m agwa unu ọtụtụ okwu ọzọ
  rationale: Nke a na-egosipụta na site ugbu a gaa n’ihu, Jizọs agaghịzi agwa ndị na-eso ụzọ ya ọtụtụ okwu. ‘Agwa unu ọtụtụ okwu’ bụ Igbo doro anya ma kwekọọ n’echiche nke πολλὰ e ji mee ka λαλήσω doo anya.
- source_word: ἔρχεται
  choice: na-abịa
  rationale: Oge ugbu a nke Grik nwere echiche nke ihe na-eru nso; ‘na-abịa’ na-egosipụta mbata ahụ dị nso n’ụzọ ebumpụta ụwa n’Igbo.
- source_word: ὁ τοῦ κόσμου ἄρχων
  choice: onye na-achị ụwa
  rationale: ‘Onye na-achị’ na-enye nghọta doro anya nke ἄρχων. E tinyeghị ‘a’ n’azụ ‘ụwa,’ n’ihi na okwu Grik kwuru naanị ‘ụwa.’
- source_word: ἐν ἐμοὶ
  choice: n’ime m
  rationale: Nke a na-edobe okwu Grik dị mkpirikpi ma ghara ịkọwapụta ya karịa ka isi mmalite si kwuo.
- source_word: οὐκ ἔχει οὐδέν
  choice: O nweghịkwa ihe ọ bụla
  rationale: 'Nsụgharị a na-edobe okwu ahụ n’ụzọ nkịtị: ‘o nweghị ihe ọ bụla,’ kama ịmachi ihe ọ pụtara naanị n’ikwu na o nweghị ikike, njide, ma ọ bụ ihe ọ ga-eji bo ya ebubo.'
theological_decisions:
- issue: Onye ‘onye na-achị ụwa’ bụ
  choice: E debere aha ahụ dịka ‘onye na-achị ụwa’ n’isiokwu ahụ n’enweghị itinye ‘Setan.’
  alternative: Ịsụgharị ya ozugbo dịka ‘Setan,’ ma ọ bụ were ya dịka ihe nnọchianya nke ike ọjọọ nke ụwa.
  rationale: N’ọnọdụ Oziọma Jọn, aha a na-ezo aka n’aka onye ọchịchị ime mmụọ ọjọọ nke na-emegide Jizọs, nke a na-aghọtakarị dịka Setan. Ma nsụgharị ahụ na-edobe aha Grik kpọmkwem ka ọ ghara idozi ihe e hapụrụ ka onye na-agụ ghọta site n’ọnọdụ okwu.
- issue: Ihe ‘o nweghị ihe ọ bụla n’ime m’ pụtara
  choice: E debere okwu nkịtị ahụ, ‘O nweghịkwa ihe ọ bụla n’ime m.’
  alternative: ‘O nweghị ihe ọ bụla ọ ga-eji maa m ikpe,’ ‘o nweghị ikike n’ebe m nọ,’ ma ọ bụ ‘o nweghị ike ijide m.’
  rationale: 'Okwu Grik dị mkpirikpi ma nwee ọtụtụ echiche nwere ike ịdị n’ime ya: enweghị ihe ọ ga-eji kwuo na ọ bụ nke ya, enweghị ebe ọ ga-ejide, ma ọ bụ enweghị ihe jikọrọ ya na Jizọs. Idebe ya n’ụzọ nkịtị na-echekwa nghọtahie ahụ n’emebighị esemokwu nkà mmụta okpukpe dị na ya.'
translation_notes:
  register: E ji Standard Igbo nke oge a, dị nsọ ma dị mfe nghọta, dee ya. ‘Agwa unu ọtụtụ okwu’ bụ okwu nkịtị nke ndị na-agụ taa ga-aghọta; a hapụrụ ‘n’ime m’ ka ọ chekwaa ịdị mkpirikpi na ọtụtụ nghọta dị n’okwu Grik.
