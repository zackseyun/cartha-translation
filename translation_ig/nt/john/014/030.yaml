  naturalness: “Agaghị m agwa unu ọtụtụ okwu ọzọ” is understandable Standard Igbo and suitably formal. The final sentence is natural enough while retaining the source’s compact ambiguity.
  terminology: “Onye na-achị ụwa” is an appropriate modern rendering of ἄρχων, and “n’ime m” preserves the source wording without prematurely selecting ‘claim,’ ‘hold,’ or ‘power’ as its single sense.
