id: JHN.14.4
reference: John 14:4
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ὅπου ἐγὼ ὑπάγω οἴδατε ⸂τὴν ὁδόν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/004.yaml
  text: And you know the way where I am going[a].
translation:
  language: ig
  text: Unu makwa ụzọ e si aga ebe m na-aga[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ụfọdụ ihe odide na-agụ, “Unu makwa ebe m na-aga, marakwa ụzọ ahụ.”
    reason: textual_variant
lexical_decisions:
- source_word: καὶ
  choice: -kwa
  rationale: E jikọtara ‘kwa’ na ngwaa ‘ma’ iji gosipụta njikọ dị mfe nke καὶ n’Igbo nkịtị, n’enweghị itinye nkwusi ike ọzọ.
- source_word: ὅπου
  choice: ebe
  rationale: ‘Ebe’ bụ okwu Igbo nkịtị maka adverb ebe ihe na-eme ma ọ bụ ebe a na-aga.
- source_word: ἐγὼ
  choice: m
  rationale: Nnọchiaha onye mbụ pụtara ìhè dịka isiokwu nke ‘na-aga.’
- source_word: ὑπάγω
  choice: na-aga
  rationale: Ọdịdị a na-egosi omume dị ugbu a ma ọ bụ njem na-eru nso; ọ naghị agbakwụnye nkọwa siri ike dịka ‘na-apụ.’
- source_word: οἴδατε
  choice: Unu ma
  rationale: ‘Unu ma’ na-enye ihe οἴδατε pụtara ugbu a ma gosipụta na a na-agwa ọtụtụ mmadụ okwu.
- source_word: τὴν ὁδόν
  choice: ụzọ
  rationale: ‘Ụzọ’ nwere ike ịpụta ụzọ a na-aga ma ọ bụ ụzọ e si eme ihe, ya mere ọ na-edobe obosara ihe ὁδός pụtara na amaokwu a.
theological_decisions:
- issue: Usoro nkebiokwu na njikọ dị n’etiti ebe Jizọs na-aga na ụzọ ahụ
  choice: Unu makwa ụzọ e si aga ebe m na-aga.
  alternative: Ebe m na-aga, unu makwa ụzọ ya.
  rationale: Nhọrọ a na-ekwu n’Igbo doro anya na ndị na-eso ụzọ maara ụzọ nke metụtara ebe Jizọs na-aga, ma ọ naghị akọwa ụzọ ahụ site n’ihe e kwuru n’amaokwu na-esote. Nhọrọ ọzọ na-esochikwu usoro Grik, ma ọ naghị ada ka Igbo nkịtị nke ọma.
- issue: Ọdịiche dị n’ihe odide aka ochie
  choice: E tinyere ọgụgụ SBLGNT n’isiokwu bụ́ nke kwuru na ha maara ụzọ ahụ.
  alternative: Unu makwa ebe m na-aga, marakwa ụzọ ahụ.
  rationale: Ọgụgụ ọzọ na-ekwu ihe abụọ—ịma ebe ọ na-aga na ịma ụzọ ahụ—ma ọ bụ ọdịiche ederede, ya mere e debere ya n’okpuru ala kama itinye ya n’isiokwu.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. ‘Ụzọ e si aga ebe m na-aga’ bụ usoro okwu Igbo nkịtị nke na-egosipụta njikọ dị n’etiti ụzọ ahụ na ebe a na-aga, n’enweghị ịkọwapụta ihe ‘ụzọ’ ahụ bụ tupu amaokwu na-esote.
