id: JHN.14.17
reference: John 14:17
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τὸ πνεῦμα τῆς ἀληθείας, ὃ ὁ κόσμος οὐ δύναται λαβεῖν, ὅτι οὐ θεωρεῖ αὐτὸ οὐδὲ ⸀γινώσκει· ⸀ὑμεῖς γινώσκετε αὐτό, ὅτι παρ’ ὑμῖν μένει καὶ ἐν ὑμῖν ⸀ἔσται.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/017.yaml
  text: the Spirit of truth[a], whom the world is not able to receive, because it neither sees him nor knows him. You know him[b], because he remains with you and will be in you.
translation:
  language: ig
  text: Mmụọ nke eziokwu[a], onye ụwa na-enweghị ike ịnata, n’ihi na ọ naghị ahụ ya, ọ maghịkwa ya. Unu maara ya, n’ihi na ọ na-anọnyere unu, ọ ga-anọkwa n’ime unu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’okwu Grik, “Mmụọ” bụ neuter n’usoro ụtọasụsụ, ma ebe a ihe a na-ekwu maka ya bụ onye. Nnọchiaha Igbo “ya” nwere ike izo aka ma n’onye ma n’ihe.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ọ ga-anọkwa n’etiti unu.” Ebe “unu” bụ ọtụtụ mmadụ, okwu Grik ahụ nwere ike ịpụta ịnọ n’etiti ha dịka otu ìgwè; ma “n’ime unu” na-edobe ọdịiche ya na “na-anọnyere unu” nke ọma.
    reason: alternative_reading
lexical_decisions:
- source_word: τὸ πνεῦμα τῆς ἀληθείας
  choice: Mmụọ nke eziokwu
  rationale: Nke a na-edobe njikọ okwu Grik ahụ n’enweghị ịkọwa ya gabiga ókè; mkpụrụedemede ukwu na-egosi na ebe a a na-ekwu maka Mmụọ Nsọ.
- source_word: ὃ
  choice: onye
  rationale: Ọ bụ ezie na πνεῦμα bụ okwu neuter n’asụsụ Grik, ihe a na-ekwu maka ya bụ onye; “onye” dabara n’ụzọ Igbo si ekwu maka onye nwere omume na uche.
- source_word: ὁ κόσμος
  choice: ụwa
  rationale: “Ụwa” na-edobe obosara okwu Jọn ji eme ihe, n’akọwaghị ya nanị dị ka mmadụ niile ma ọ bụ usoro ụwa na-enupụ isi.
- source_word: οὐ δύναται λαβεῖν
  choice: na-enweghị ike ịnabata
  rationale: Nke a na-edobe ma echiche enweghị ike dị na δύναται ma echiche ịnata dị na λαβεῖν, n’Igbo dị ugbu a ma doo anya.
- source_word: θεωρεῖ
  choice: ahụ
  rationale: “Ịhụ” bụ okwu Igbo nkịtị nke na-edobe echiche Grik ahụ n’enweghị ịgbakwụnye nkọwa dịka “ịghọta” ma ọ bụ “ịmata.”
- source_word: γινώσκει / γινώσκετε
  choice: maghị / maara
  rationale: A na-eji otu mgbọrọgwụ okwu “ma” mee ka ọdịiche dị n’etiti amaghị nke ụwa na ịma nke ndị na-eso ụzọ pụta ìhè.
- source_word: παρ’ ὑμῖν μένει
  choice: ọ na-anọnyere unu
  rationale: “Na-anọnyere” na-egosipụta omume na-aga n’ihu nke μένει ma na-edobe echiche παρά, ya bụ ịnọnyere ha.
- source_word: ἐν ὑμῖν ἔσται
  choice: ọ ga-anọkwa n’ime unu
  rationale: “N’ime unu” bụ nsụgharị kpọmkwem na nke sitere n’okwu ἐν; “ga-anọ” na-edobe ọdịnihu nke ἔσται.
theological_decisions:
- issue: Ịkpọ Mmụọ ahụ onye n’agbanyeghị na πνεῦμα bụ neuter n’usoro asụsụ Grik
  choice: E ji “onye” kọwaa Mmụọ ahụ.
  alternative: Iji “nke” kọwaa ya dịka ihe.
  rationale: Ihe ndị a na-ekwu na gburugburu amaokwu a na-egosi onye na-eme ihe, ọ bụghị ike na-enweghị uche. Otú ọ dị, nnọchiaha Igbo “ya” anaghị ekewa nwoke, nwaanyị, na ihe, ya mere nsụgharị ahụ anaghị amanye ọdịiche ụtọasụsụ Bekee n’ime Igbo.
- issue: Ọdịiche dị n’etiti παρά na ἐν
  choice: “na-anọnyere unu” na “n’ime unu”
  alternative: Ịsụ ha abụọ “n’etiti unu” ma ọ bụ “nọnyere unu.”
  rationale: A na-edobe ụzọ abụọ Grik si kwuo mmekọrịta Mmụọ ahụ na ndị kwere ekwe, n’emeghị ka ha bụrụ otu echiche.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. “Na-enweghị ike ịnabata” na “na-anọnyere unu” bụ okwu nkịtị na nke doro anya; a zere okwu ụka nke otu òtù pụrụ iche.
