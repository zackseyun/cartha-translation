  text: Ἐὰν ἀγαπᾶτέ με, τὰς ἐντολὰς τὰς ἐμὰς ⸀τηρήσετε·
base_translation:
  language: en
  yaml_path: translation/nt/john/014/015.yaml
  text: If you love me[a], you will keep my commandments.
translation:
  language: ig
  text: Ọ bụrụ na unu hụrụ m n’anya, unu ga-edebe iwu m.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, ‘unu ga-erubere iwu m isi.’ Ngwaa Grik ahụ nwere ike ịpụta idebe, ịgbaso, ichekwa, ma ọ bụ irube isi; ‘ga-edebe’ na-echekwa nghọta ya sara mbara.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐὰν
  choice: Ọ bụrụ na
  rationale: Nke a na-egosi ọnọdụ ma na-edobe ihe okwu Grik pụtara n’enweghị ime ka ọ bụrụ ihe na-eme mgbe niile.
- source_word: ἀγαπᾶτέ
  choice: unu hụrụ … n’anya
  rationale: Nke a bụ ụzọ Igbo nkịtị na nke doro anya si ekwu ‘ịhụ n’anya’; ‘unu’ na-egosikwa na onye a na-agwa karịrị otu.
- source_word: με
  choice: m
  rationale: Ọ bụ nnọchiaha onye nke mbụ, na-ezo aka na Jizọs dịka onye a hụrụ n’anya.
- source_word: τὰς ἐντολὰς τὰς ἐμὰς
  choice: iwu m
  rationale: ‘Iwu m’ bụ ụzọ Igbo dị mfe ma dị ebube isi kwuo iwu ndị Jizọs nyere, na-edobekwa nkwusiri ike nke nnọchiaha nwe ihe ahụ n’ụzọ nkịtị.
- source_word: τηρήσετε
  choice: unu ga-edebe
  rationale: Ụdị ọdịnihu dị na Grik ka e debere site na ‘ga-’. ‘Idekebe’ nwere ike ịgụnye idebe, ichekwa, ịgbaso, na irube isi, ya mere ọ sara mbara karịa nanị ‘irube isi.’
theological_decisions:
- issue: Ma a ga-asụgharị τηρήσετε dịka iwu e nyere ozugbo ka ha debe ya, ka ọ bụ dịka nkwupụta banyere ihe ha ga-eme
  choice: 'nkwupụta ọdịnihu: ‘unu ga-edebe’'
  alternative: 'usoro iwu: ‘debenụ iwu m’'
  rationale: 'Okwu Grik bụ ngwaa na-egosi ọdịnihu, ọ bụghị ngwaa iwu. Nsụgharị a na-edobe esemokwu echiche dị n’amaokwu ahụ: ịhụ Jizọs n’anya na-apụta n’idebe iwu ya, ma a naghị agbanwe okwu ahụ ka ọ bụrụ naanị iwu e nyere ozugbo.'
translation_notes:
  register: E ji Standard Igbo dị ugbu a, dị mfe nghọta ma dịkwa ebube. ‘Unu’ na-egosipụta nke ọma na nnọchiaha ndị Grik bụ nke ọtụtụ mmadụ; e debeghị ọdịnihu ahụ dịka iwu ozugbo.
