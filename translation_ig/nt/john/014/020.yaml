source:
  edition: SBLGNT
  text: ἐν ἐκείνῃ τῇ ἡμέρᾳ ⸂γνώσεσθε ὑμεῖς⸃ ὅτι ἐγὼ ἐν τῷ πατρί μου καὶ ὑμεῖς ἐν ἐμοὶ κἀγὼ ἐν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/020.yaml
  text: On that day you will know that I am in my Father[a], and you are in me[b], and I am in you.
translation:
  language: ig
  text: N’ụbọchị ahụ, unu ga-amara na m nọ n’ime Nna m, unu nọkwa n’ime m, m nọkwa n’ime unu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: E debere “n’ime” ugboro atọ iji chekwaa nkwughachi otu okwu ahụ n’asụsụ Grik. Enwere ike ịkọwa ya n’ụzọ nkọwa karịa dịka mmekọrịta ịdị n’otu, ma nke ahụ abụghị ntụgharị okwu kpọmkwem.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: N’ụbọchị ahụ
  rationale: Nke a bụ ụzọ Igbo nkịtị si egosi oge a kapịrị ọnụ; ọ na-edobe ihe ngosi ἐκείνῃ nke pụtara ‘ahụ.’
- source_word: γνώσεσθε ὑμεῖς
  choice: unu ga-amara
  rationale: Ọdịnihu nke γινώσκω na-egosi ihe ndị na-eso ụzọ ga-amata ma ghọta n’oge ahụ. ‘Unu’ na-egosikwa na okwu ahụ bụ maka ọtụtụ mmadụ.
- source_word: ὅτι
  choice: na
  rationale: N’ebe a, ὅτι na-ewebata ihe ha ga-amara, ọ bụghị ihe kpatara ya.
- source_word: ἐγὼ ἐν τῷ πατρί μου
  choice: m nọ n’ime Nna m
  rationale: ‘N’ime’ na-edobe ihe atụ na nkwughachi nke ἐν n’Oziọma Jọn, kama ịkọwa ya ozugbo dị ka ịdị n’otu.
- source_word: καὶ ὑμεῖς ἐν ἐμοὶ
  choice: unu nọkwa n’ime m
  rationale: E tinyere ‘nọ’ ka ahịrịokwu bụrụ Igbo zuru oke, ma debe otu okwu ahụ bụ ‘n’ime.’
- source_word: κἀγὼ ἐν ὑμῖν
  choice: mụ onwe m nọkwa n’ime unu
  rationale: ‘Mụ onwe m’ na-egosipụta nkwusi ike dị na κἀγώ ma na-edobe mmekọrịta nke ịnọ n’ime ibe ya.
theological_decisions:
- issue: Okwu Jọn banyere ịnọ n’ime ibe ya (ἐν ... ἐν ... ἐν)
  choice: 'E debe ‘n’ime’ ugboro atọ: ‘m nọ n’ime Nna m, unu nọkwa n’ime m, mụ onwe m nọkwa n’ime unu.’'
  alternative: ‘Mụ na Nna m dị n’otu, unu na m dịkwa n’otu, mụ na unu dịkwa n’otu.’
  rationale: ‘N’ime’ na-echekwa omimi na ọtụtụ nghọta ihe atụ ahụ nwere; ‘dị n’otu’ ga-akọwa ya karịa ihe ederede Grik kwuru kpọmkwem.
- issue: Mmekọrịta Jizọs na Nna ya
  choice: ‘m nọ n’ime Nna m’
  alternative: ‘Mụ na Nna m bụ otu n’ọdịdị’ ma ọ bụ ‘m na Nna m nọ.’
  rationale: Nhọrọ a anaghị ebelata ike okwu ahụ, ma ọ naghịkwa etinye nkọwa ozizi nke oge ọzọ n’ime amaokwu ahụ.
translation_notes:
  register: Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ ‘Nna m’ maka πατρί μου, ‘nọ n’ime’ ka ọ bụrụ asụsụ Igbo eke ma chekwaa isiokwu Jọn banyere ịnọ n’ime ibe ya. Akara nkọwa ala ala [a] dị n’isi ederede.
