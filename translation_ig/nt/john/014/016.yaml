id: JHN.14.16
reference: John 14:16
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: κἀγὼ ἐρωτήσω τὸν πατέρα καὶ ἄλλον παράκλητον δώσει ὑμῖν ἵνα ⸀ᾖ μεθ’ ὑμῶν εἰς τὸν ⸀αἰῶνα,
base_translation:
  language: en
  yaml_path: translation/nt/john/014/016.yaml
  text: And I will ask the Father[a], and he will give you another Advocate, so that he may be with you forever,
translation:
  language: ig
  text: M ga-arịọ Nna ahụ, ọ ga-enyekwa unu Onye Nkwado ọzọ[a], ka ọ nọnyere unu ruo mgbe ebighị ebi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị παράκλητος, okwu Greek a, dịka “Onye Inyeaka,” “Onye Ndụmọdụ,” ma ọ bụ, dịka ntụgharị ọdịnala si dị, “Onye Nkasi Obi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀγὼ
  choice: Mụ onwe m
  rationale: Ngwakọta καί na ἐγώ na-ejikọta okwu a na nke bu ya ụzọ ma na-emesi onye na-ekwu okwu ike ntakịrị. “Mụ onwe m” na-egosi nkwusiri ike ahụ n’Igbo n’enweghị ịgbakwunye echiche ọhụrụ.
- source_word: ἐρωτήσω
  choice: ga-arịọ
  rationale: Okwu a pụtara ịrịọ ma ọ bụ ịtụ arịrịọ. “Ga-arịọ” bụ Igbo doro anya nke na-adịghị ebubata asụsụ okpukpe ọzọ na-adịghị n’ụ Greek.
- source_word: τὸν πατέρα
  choice: Nna ahụ
  rationale: Greek nwere njirimara okwu ahụ ma o nweghị nnọchiaha nwe. “Nna ahụ” na-edobe nke a ma ghara ịgbakwunye “Nna m.”
- source_word: ἄλλον
  choice: ọzọ
  rationale: ἄλλος na-egosi onye ọzọ dị iche n’Onye Nkwado e kwuru ma ọ bụ ghọta na ọ dịlarị. “Ọzọ” na-edobe ihe okwu ahụ kwuru n’enweghị ịkọwakwu ụdị myirịta ya.
- source_word: παράκλητον
  choice: Onye Nkwado
  rationale: παράκλητος bụ aha sara mbara nke nwere echiche onye na-anọnyere mmadụ, na-enyere ya aka ma na-ekwuchitere ya. “Onye Nkwado” na-edobe ịdị-onye na ọrụ nnọchiteanya ahụ; e debere nhọrọ ndị ọzọ n’ala peeji n’ihi na otu okwu Igbo enweghị ike ibu akụkụ niile nke ihe Greek pụtara.
- source_word: δώσει ὑμῖν
  choice: ọ ga-enyekwa unu
  rationale: Nke a na-asụgharị ngwaa ọdịnihu na onye a na-enye ihe n’usoro Igbo nkịtị; “-kwa” na-ejikwa njikọ καί nke dị na nkebi ahịrịokwu ahụ.
- source_word: ἵνα ᾖ
  choice: ka ọ na-anọnyere
  rationale: ἵνα tinyere subjunctive na-egosi ebumnuche ma ọ bụ ihe ga-esi na ya pụta. “Ka” na-edobe nke ahụ, ebe “na-anọnyere” na-egosi ịdịgide nke present tense.
- source_word: μεθ’ ὑμῶν
  choice: unu
  rationale: N’ime ngwaa “na-anọnyere unu,” echiche μετά na genitive, ya bụ ịnọ ‘na unu,’ pụtara n’ụzọ Igbo si ekwu ya nke ọma.
- source_word: εἰς τὸν αἰῶνα
  choice: ruo mgbe ebighị ebi
  rationale: Nke a bụ akpaalaokwu na-egosi ịdịgide na-enweghị njedebe. “Ruo mgbe ebighị ebi” na-enye ihe ọ pụtara n’Igbo doro anya karịa ntụgharị mkpụrụokwu dịka “ruo n’ọgbọ ahụ.”
theological_decisions:
- issue: Otú e si asụgharị παράκλητος n’ebe a na-ekwu maka Mmụọ Nsọ
  choice: Onye Nkwado
  alternative: Onye Inyeaka; Onye Ndụmọdụ; Onye Nkasi Obi
  rationale: “Onye Nkwado” na-edobe ya dịka onye nwere ọrụ ịnọnyere na ịkwuchitere mmadụ, ọ naghịkwa eme ka ọrụ ya bụrụ naanị inye aka ma ọ bụ ịkasi obi. E depụtara nhọrọ ndị ọzọ n’ala peeji iji chekwaa obosara na esemokwu ntụgharị nke okwu Greek ahụ.
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe nke oge a, dị mfe nghọta ma nwee ugwu kwesịrị Akwụkwọ Nsọ. A họọrọ “na-anọnyere” iji gosi mmekọrịta na ịdịgide, ma zere okwu ochie ma ọ bụ okwu nke otu ụka pụrụ iche.
