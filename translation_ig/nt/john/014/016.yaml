- from: Mụ onwe m ga-arịọ Nna ahụ, ọ ga-enyekwa unu Onye Nkwado ọzọ[a], ka ọ na-anọnyere unu ruo mgbe ebighị ebi.
  to: M ga-arịọ Nna ahụ, ọ ga-enyekwa unu Onye Nkwado ọzọ[a], ka ọ nọnyere unu ruo mgbe ebighị ebi.
  rationale: The revision reduces an overstatement of the subject emphasis, preserves the Greek coordination through idiomatic Igbo sequencing, and renders the ἵνα purpose clause more directly. “Onye Nkwado” and the lexical-alternative footnote are retained because they preserve the personal and semantically broad force of παράκλητος without resolving interpretive questions beyond the verse.
