  to: Ma Onye Nkwuchitere[a] ahụ, bụ Mmụọ Nsọ, onye Nna ga-ezite n’aha m, ya onwe ya ga-akụziri unu ihe niile, meekwa ka unu cheta ihe niile m gwara unu.
