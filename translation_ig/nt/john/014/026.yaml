id: JHN.14.26
reference: John 14:26
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ δὲ παράκλητος, τὸ πνεῦμα τὸ ἅγιον ὃ πέμψει ὁ πατὴρ ἐν τῷ ὀνόματί μου, ἐκεῖνος ὑμᾶς διδάξει πάντα καὶ ὑπομνήσει ὑμᾶς πάντα ἃ εἶπον ⸀ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/026.yaml
  text: But the Advocate[a], the Holy Spirit, whom the Father will send in my name, he will teach you all things and remind you of all that I said to you.
translation:
  language: ig
  text: Ma Onye Nkwuchitere[a] ahụ, bụ Mmụọ Nsọ, onye Nna ga-ezite n’aha m, ya onwe ya ga-akụziri unu ihe niile, meekwa ka unu cheta ihe niile m gwara unu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ịsụgharị ya “Onye Nkwado,” “Onye Inyeaka,” “Onye Ndụmọdụ,” ma ọ bụ “Onye Nkasi Obi” (Grik: paraklētos).'
    reason: lexical_alternative
lexical_decisions:
- source_word: παράκλητος
  choice: Onye Nkwado
  rationale: Aha a na-egosi onye na-anọnyere mmadụ, na-ekwuchitere ya ma na-enyere ya aka. “Onye Nkwado” na-echekwa ọrụ onye ahụ n’ụzọ sara mbara; e debere nghọta ndị ọzọ n’ala peeji n’ihi na otu okwu Igbo enweghị ike ibu ihe okwu Grik a pụtara niile.
- source_word: πνεῦμα τὸ ἅγιον
  choice: Mmụọ Nsọ
  rationale: Nke a bụ aha a na-ejikarị eme ihe n’Igbo taa, ọ na-asụgharịkwa πνεῦμα na ἅγιον n’ụzọ doro anya.
- source_word: ὃ πέμψει
  choice: onye ... ga-ezite
  rationale: “Onye” na-egosi na Mmụọ Nsọ bụ onye na-arụ ọrụ n’onwe ya, ọ bụghị naanị ike na-enweghị ụdị onye.
- source_word: ἐν τῷ ὀνόματί μου
  choice: n’aha m
  rationale: Nke a na-echekwa akpaalaokwu Grik ahụ na ohere ọ nwere ịpụta nnọchiteanya, ikike, na ime ihe n’aha onye ọzọ.
- source_word: ἐκεῖνος
  choice: ya onwe ya
  rationale: Nkebi a na-echekwa nkwusi ike nke okwu ngosi Grik ahụ ma na-adọrọ uche laghachi n’Onye Nkwado.
- source_word: διδάξει
  choice: ga-akụziri
  rationale: Nke a bụ ụzọ Igbo nkịtị na nke ziri ezi isi kwuo ọrụ izi ndị a kpọrọ aha ihe.
- source_word: πάντα
  choice: ihe niile
  rationale: Nke a na-echekwa ịdị obosara nke nkwa ahụ n’asụsụ Igbo dị mfe nghọta.
- source_word: ὑπομνήσει
  choice: meekwa ka unu cheta
  rationale: 'Nke a na-egosipụta nke ọma ihe causative nke ngwaa Grik ahụ: ime ka mmadụ cheta.'
- source_word: πάντα ἃ εἶπον ὑμῖν
  choice: ihe niile m gwara unu
  rationale: Nke a bụ Igbo sitere n’ọnụ mmadụ ma na-echekwa ntụaka ahụ nye ihe niile Jizọs kwuru nye ha.
theological_decisions:
- issue: Iji asụsụ na-egosi ụdị onye mgbe a na-ekwu maka Mmụọ Nsọ
  choice: Jiri “onye” na “ya onwe ya”
  alternative: Iji okwu na-egosi ihe na-enweghị ụdị onye
  rationale: Ọ bụ ezie na πνεῦμα bụ okwu neuter n’usoro asụsụ Grik, παράκλητος na ἐκεῖνος na-egosi ọrụ na nkwusi ike nke onye. Nsụgharị a na-echekwa ihe amaokwu ahụ n’onwe ya na-egosi n’etinyeghị nkọwa ozizi ọzọ.
- issue: Nsụgharị παράκλητος
  choice: Onye Nkwado
  alternative: Onye Inyeaka; Onye Ndụmọdụ; Onye Nkasi Obi; Onye Nkwuchitere
  rationale: Okwu Grik ahụ nwere nghọta nke nkwado, enyemaka, nkasi obi, ndụmọdụ, na ikwuchitere mmadụ. “Onye Nkwado” dị obosara ma bụrụkwa okwu a na-aghọta n’Igbo ugbu a; e tinyere nhọrọ ndị ọzọ n’ala peeji ka a ghara ime ka nghọta ya dị warara.
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E ji “unu” chekwaa na ndị Jizọs na-agwa okwu karịrị otu onye; e jikwa “ya onwe ya” chekwaa nkwusi ike dị na ἐκεῖνος.
