  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ὅ τι ἂν αἰτήσητε ἐν τῷ ὀνόματί μου τοῦτο ποιήσω, ἵνα δοξασθῇ ὁ πατὴρ ἐν τῷ υἱῷ·
base_translation:
  language: en
  yaml_path: translation/nt/john/014/013.yaml
  text: And whatever you ask in my name[a], this I will do, so that the Father may be glorified in the Son.
translation:
  language: ig
  text: Ihe ọ bụla unu ga-arịọ n’aha m, nke ahụ ka m ga-eme, ka e wee nye Nna otuto n’ime Ọkpara ahụ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “site na Ọkpara ahụ.” Grik kwuru, “n’ime Ọkpara ahụ,” nke nwere ike igosi ebe ma ọ bụ ụzọ e si enye Nna otuto.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅ τι ἂν
  choice: Ihe ọ bụla
  rationale: Nkebi okwu a na-egosi ihe a na-akọwaghị kpọmkwem na obosara nke ihe ọ bụla; “Ihe ọ bụla” bụ Igbo doro anya ma dịkwa mma n’okwu a.
- source_word: αἰτήσητε
  choice: unu ga-arịọ
  rationale: Ngwaa a pụtara ịrịọ ma ọ bụ ịrịọ arịrịọ. “Unu ga-arịọ” na-egosipụta onye nke abụọ n’ọnụọgụ ọtụtụ ma dabara n’ụdị ahịrịokwu a.
- source_word: ἐν τῷ ὀνόματί μου
  choice: n’aha m
  rationale: Nke a na-edobe okwu Jọn dịka ọ dị, tinyere echiche nke nnọchite anya, ikike, na mmekọrịta ya na Jizọs, n’enweghị imechi ya n’otu nkọwa naanị.
- source_word: τοῦτο
  choice: nke ahụ
  rationale: A hapụrụ okwu ngosipụta ahụ ka o doo anya, dịkwa ka e siri mesie ya ike n’asụsụ Grik.
- source_word: ποιήσω
  choice: ka m ga-eme
  rationale: “Ime” bụ okwu sara mbara ma kwụ ọtọ nke kwekọrọ na ποιέω; usoro “nke ahụ ka m ga-eme” na-edobe nkwusi ike dị n’ahịrịokwu Grik.
- source_word: ἵνα
  choice: ka e wee
  rationale: Ọ na-egosi ebumnuche nke ihe Jizọs ga-eme, ma “ka e wee” na-ekwupụta ebumnuche ahụ n’Igbo nkịtị.
- source_word: δοξασθῇ
  choice: nye … otuto
  rationale: Usoro “ka e wee nye Nna otuto” na-egosipụta ụdị nnara-omume nke ngwaa Grik ma na-edobe echiche nke inye Chineke otuto.
- source_word: ὁ πατὴρ
  choice: Nna
  rationale: A sụgharịghị ya “Nna m,” n’ihi na Grik kwuru “Nna” dịka aha nsọ pụrụ iche n’okwu Jọn.
- source_word: ἐν τῷ υἱῷ
  choice: n’ime Nwa ahụ
  rationale: “N’ime” na-edobe ἐν n’enweghị ikpebi ma ọ na-egosi ọnọdụ, njikọ, ma ọ bụ ụzọ e si enye Nna otuto.
theological_decisions:
- issue: Ihe “ịrịọ n’aha m” pụtara
  choice: E debere ya dịka “n’aha m” n’enweghị ịgbasa ya n’ime ederede bụ isi.
  alternative: site n’ikike m; n’ịdị n’otu na m; dịka uche na agwa m si dị
  rationale: Okwu ahụ nwere ọtụtụ akụkụ n’Oziọma Jọn. Ịhapụ ya otu a na-echekwa omimi ya ma ghara ịmanye otu nkọwa ozizi.
- issue: Ike okwu ἐν τῷ υἱῷ
  choice: A sụgharịrị ya “n’ime Nwa ahụ.”
  alternative: site n’aka Nwa ahụ
  rationale: ἐν nwere ike igosi ebe ma ọ bụ ọnọdụ ihe na-eme, ma ọ bụ ụzọ e si eme ya. Ederede bụ isi na-edobe nghọta sara mbara ahụ, ebe ndetu ala peeji na-egosi ntụgharị ọzọ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “Unu” na-edobe ọnụọgụ ọtụtụ dị na Grik. E tinyere akara ndetu [a] ozugbo n’ebe “n’ime Nwa ahụ” dị, n’ihi na ọ bụ okwu ndetu ahụ na-akọwa.
