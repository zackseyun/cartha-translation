review_pass:
  verdict: revise
  source_fidelity: 'Ederede ahụ na-anọchi anya nkebi ahịrịokwu Grik niile nke ọma: ihe a na-arịọ enweghị oke, plural «unu», «n’aha m», nkọwa e mesiri ike «nke ahụ», ebumnuche «ka», na inye Nna otuto «n’ime» Ọkpara ahụ. Otú ọ dị, «Nwa ahụ» nwere ike ịpụta nwa n’ozuzu ya n’Igbo; «Ọkpara ahụ» bụ aha nsọ doro anya ma dabara nke ọma maka ὁ υἱός n’ebe a.'
  naturalness: Ahịrịokwu ahụ bụ Standard Igbo dị mfe nghọta. «Ihe ọ bụla unu ga-arịọ» na «nke ahụ ka m ga-eme» na-ada n’ụzọ nkịtị ma na-echekwa nkwusi ike nke τοῦτο.
  terminology: A ga-eji «Ọkpara ahụ» maka «the Son» iji debe aha Kraịst a na-ahụkarị n’Igbo na ọdịiche ya na nwa ọ bụla. A hapụrụ «n’ime» ka ọ ghara ikpebi n’otu ụzọ naanị ihe ἐν pụtara.
  issues:
  - severity: medium
    issue: «Nwa ahụ» maka ὁ υἱός
    rationale: N’agbanyeghị na «Nwa» nwere ike ịbụ ntụgharị nkịtị, ọ naghị akọwa aha Kristological ahụ nke ọma dịka «Ọkpara ahụ», ma nwee ike ịdị ka nwa a na-akpọghị aha. «Ọkpara ahụ» na-arụ ọrụ dị ka aha nsọ a na-ahụkarị n’Standard Igbo.
  - severity: low
    issue: Ndetu ala ji «ọnọdụ» akọwa ἐν
    rationale: «Ọnọdụ» adịghị akọwa echiche ‘sphere’ nke ọma n’Igbo n’ebe a. «Ebe/usoro» ma ọ bụ «ụzọ» na-ekwu ya n’ụzọ doro anya karịa, n’enweghị imechi nghọta okwu Grik ahụ.
  revised_text: Ihe ọ bụla unu ga-arịọ n’aha m, nke ahụ ka m ga-eme, ka e wee nye Nna otuto n’ime Ọkpara ahụ.[a]
