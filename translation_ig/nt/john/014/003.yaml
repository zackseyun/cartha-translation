id: JHN.14.3
reference: John 14:3
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἐὰν πορευθῶ ⸀καὶ ἑτοιμάσω ⸂τόπον ὑμῖν⸃, πάλιν ἔρχομαι καὶ παραλήμψομαι ὑμᾶς πρὸς ἐμαυτόν, ἵνα ὅπου εἰμὶ ἐγὼ καὶ ὑμεῖς ἦτε.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/003.yaml
  text: And if I go and prepare a place for you[a], I am coming again and will take you to myself, so that where I am[b], you also may be.
translation:
  language: ig
  text: Ọ bụrụkwa na m agaa ma kwadebere unu ebe, ana m abịa ọzọ[a][b], aga m akpọrọ unu bịa n’ebe m nọ, ka unu kwa wee nọrọ ebe m nọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “aga m abịa ọzọ.” N’asụsụ Grik, e ji ụdị ngwaa nke oge ugbu a (“ana m abịa”) kwuo ihe nwere nghọta nke ọdịnihu.
    reason: lexical_alternative
  - marker: b
    text: Ndị na-akọwa Akwụkwọ Nsọ nwere echiche dị iche iche ma “ana m abịa ọzọ” ọ̀ na-ezo kpọmkwem n’ọbịbịa ikpeazụ Jizọs, n’ọbịbịa ya n’ihu ndị na-eso ụzọ ya mgbe o si n’ọnwụ bilie, n’ọbịbịa Mmụọ Nsọ, ka ọ̀ bụ nkwa nwere ihe karịrị otu n’ime mmezu ndị a.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐὰν πορευθῶ
  choice: Ọ bụrụkwa na m agaa
  rationale: “Ọ bụrụ ... na” na-egosi ọnọdụ a na-atụ anya ya n’ọdịnihu, ebe “m agaa” na-edobe ihe πορεύομαι pụtara n’ụzọ kwụ ọtọ n’enweghị ịkọwa ụdị ọpụpụ ahụ.
- source_word: ἑτοιμάσω τόπον ὑμῖν
  choice: kwadebere unu ebe
  rationale: “Kwadebe” bụ okwu Igbo doro anya maka ἑτοιμάζω, “ebe” bụkwa ntụgharị nkịtị nke τόπος; e tinyebeghị nkọwa ọzọ banyere ụdị ebe ahụ.
- source_word: πάλιν ἔρχομαι
  choice: ana m abịa ọzọ
  rationale: Ụdị ugbu a “ana m abịa” na-egosipụta ọdịdị ngwaa Grik ahụ ma ka na-arụ ọrụ dị ka nkwa gbasara ọdịnihu n’ọnọdụ a. Ihe odide ala peeji na-enye ntụgharị ọdịnihu nke doro anya karị.
- source_word: παραλήμψομαι ὑμᾶς πρὸς ἐμαυτόν
  choice: aga m akpọrọ unu bịakwute m
  rationale: Nkebi a na-egosi na Jizọs ga-akpọrọ ndị na-eso ụzọ ya bịa n’ebe ya onwe ya nọ. “Bịakwute m” na-echekwa ike mmekọrịta dị na πρὸς ἐμαυτόν n’Igbo a na-asụ ugbu a.
- source_word: ἵνα
  choice: ka ... wee
  rationale: Usoro “ka ... wee” bụ ụzọ Igbo ebumpụta ụwa si egosi ebumnuche nke ἵνα.
- source_word: ὅπου εἰμὶ ἐγὼ
  choice: ebe m nọ
  rationale: N’Igbo, “m” enyelarị onye na-ekwu okwu nghọta zuru ezu; ịgbakwunye “m onwe m” ga-adị arọ ma nwee ike itinye nkwusi ike karịrị nke dị mkpa.
- source_word: καὶ ὑμεῖς ἦτε
  choice: unu onwe unu wee nọrọkwa
  rationale: “Wee nọrọ” na-edobe echiche ebumnuche nke subjunctive ἦτε, “-kwa” na-anọchi καί, ebe “unu onwe unu” na-egosipụta nkwusi ike dị na nnọchiaha ὑμεῖς.
theological_decisions:
- issue: Ihe “πάλιν ἔρχομαι” na-ezo aka na ya
  choice: A tụgharịrị ya dị ka nkwa Jizọs na ọ na-abịa ọzọ, n’enweghị ịkọwa kpọmkwem oge ma ọ bụ ụzọ ọbịbịa ahụ.
  alternative: A pụrụ ịghọta ya dị ka ọpụpụ Jizọs pụtara mgbe o si n’ọnwụ bilie, ọbịbịa Mmụọ Nsọ, ọbịbịa ikpeazụ Jizọs, ma ọ bụ nkwa nwere ihe karịrị otu mmezu.
  rationale: Amaokwu ahụ kwere nkwa na Jizọs ga-abịaghachi ma kpọrọ ndị na-eso ụzọ ya bịakwute ya, ma okwu Grik n’onwe ya anaghị ekpebi otu n’ime nkọwa ndị a naanị. Ya mere, ntụgharị ahụ na-edobe esemokwu nkọwa ahụ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta, dee ya. A họọrọ “ana m abịa ọzọ” iji chekwaa ụdị oge ugbu a nke Grik, ebe ihe odide ala peeji na-akọwa nghọta ọdịnihu ya. E zere okwu ụka pụrụ iche na nkọwa ga-ekpebi ụdị ọbịbịa ahụ.
