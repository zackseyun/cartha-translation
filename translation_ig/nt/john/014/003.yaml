    reason: alternative_reading
  revision_rationale: The revision improves the idiomatic rendering of Jesus' receiving the disciples into his own presence, removes an unnecessarily strong reflexive expression, and corrects the substantive error in footnote b. It retains the conditional sequence, the Greek present-form “I am coming again,” the purpose clause, and the deliberate ambiguity concerning the promised coming.
