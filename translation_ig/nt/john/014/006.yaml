id: JHN.14.6
reference: John 14:6
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: λέγει αὐτῷ ⸀ὁ Ἰησοῦς· Ἐγώ εἰμι ἡ ὁδὸς καὶ ἡ ἀλήθεια καὶ ἡ ζωή· οὐδεὶς ἔρχεται πρὸς τὸν πατέρα εἰ μὴ δι’ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/006.yaml
  text: Jesus said to him[a], “I am the way, and the truth, and the life[b]. No one comes to the Father except through me.”
translation:
  language: ig
  text: Jizọs sịrị ya[a], “Abụ m ụzọ, eziokwu, na ndụ. Ọ dịghị onye na-abịakwute Nna ma ọ bụghị site n’aka m.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n’ụzọ dabara kpọmkwem n’usoro Grik, “Jizọs na-asị ya.” Grik ji oge ugbu a kọọ ihe mere n’akụkọ ebe a.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “Ọ dịghị onye na-abịakwute Nna ma e wezụga site n’aka m.”
    reason: alternative_reading
lexical_decisions:
- source_word: λέγει
  choice: sịrị
  rationale: Asụsụ Grik ji oge ugbu a nke akụkọ mee ihe, ma n’Igbo nkịtị, oge gara aga ‘sịrị’ na-akọ ihe mere n’akụkọ n'ụzọ doro anya ma dị ụtọ.
- source_word: αὐτῷ
  choice: ya
  rationale: Nnọchiaha dative a na-egosi onye Jizọs gwara okwu; ‘ya’ bụ ntụgharị Igbo kwụ ọtọ.
- source_word: Ἐγώ εἰμι
  choice: Mụ onwe m bụ
  rationale: Nnọchiaha Ἐγώ e kwuru kpọmkwem na-enye nkwusi ike; ‘Mụ onwe m’ na-eburu nkwusi ike ahụ n’Igbo n’emeghị ka okwu ahụ sie ike nghọta.
- source_word: ἡ ὁδός
  choice: ụzọ ahụ
  rationale: ‘Ụzọ’ na-echekwa ma echiche nke ụzọ nkịtị ma nke ụzọ e si erute Nna; ‘ahụ’ na-anọchi article Grik n'ụzọ Igbo dị mma n’usoro predicate a.
- source_word: ἡ ἀλήθεια
  choice: eziokwu ahụ
  rationale: ‘Eziokwu’ bụ okwu Igbo kachasị dabara na ἀλήθεια ma na-ahapụ obosara echiche ya n’akwụkwọ Jọn.
- source_word: ἡ ζωή
  choice: ndụ ahụ
  rationale: ‘Ndụ’ na-echekwa ịdị mfe na ịdị omimi nke ζωή, n’etinyeghị nkọwa dị ka ‘ndụ ebighị ebi’ nke amaokwu ahụ ekwughị kpọmkwem.
- source_word: οὐδεὶς
  choice: Ọ dịghị onye
  rationale: Nke a bụ ụzọ Igbo dị ugbu a, doro anya, e si kwuo ‘no one.’
- source_word: ἔρχεται
  choice: na-abịakwute
  rationale: Present tense a na-egosi eziokwu zuru ụwa ọnụ; habitual present Igbo ‘na-abịakwute’ dabara na ya. ‘-kwute’ na-egosi ịbịaru onye nso.
- source_word: πρὸς τὸν πατέρα
  choice: Nna
  rationale: πρός na-egosi mmegharị n’ebe Nna nọ; ngwaa ‘abịakwute’ eburu echiche ahụ. ‘Nna’ bụ aha e ji akpọ Chineke n’ebe a.
- source_word: εἰ μὴ
  choice: ma ọ bụghị
  rationale: Nke a na-echekwa usoro exceptive nke Grik n'ụzọ Igbo nkịtị, na-enweghị ime ka nkwupụta ahụ dị nro.
- source_word: δι’ ἐμοῦ
  choice: site n’aka m
  rationale: διά na genitive na-egosi ụzọ ma ọ bụ onye e si n’aka ya mee ihe. ‘Site n’aka m’ bụ akpaalaokwu Igbo ebumpụta ụwa nke na-echekwa echiche nke ‘through me.’
theological_decisions:
- issue: Nanị site n’aka Jizọs ka a na-abịakwute Nna
  choice: 'E debere nkwupụta ahụ n’ụzọ kpọmkwem: ‘Ọ dịghị onye na-abịakwute Nna ma ọ bụghị site n’aka m.’'
  alternative: Ọ dịghị onye na-abịakwute Nna ma e wezụga site n’aka m.
  rationale: Okwu Grik na-egosi mwepu doro anya. A naghị eme ya ka ọ dị nro, a naghịkwa agbakwunye ihe karịrị ihe amaokwu ahụ kwuru.
- issue: Usoro predicate atọ nke Jọn
  choice: ‘ụzọ ahụ, na eziokwu ahụ, na ndụ ahụ’
  alternative: ‘ụzọ, eziokwu na ndụ’
  rationale: E tinyere ‘ahụ’ na nke ọ bụla ma kwughachi ‘na’ iji chekwaa article a kwughachiri na ịdị arọ nke akụkụ atọ ahụ, n’Igbo a pụrụ ịghọta nke ọma.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji ‘Jizọs’ na ‘Nna’ dịka ụdị ederede a na-ahụkarị; e zere okwu ụka pụrụ iche na nkọwa agbakwunyere.
