id: JHN.14.31
reference: John 14:31
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀλλ’ ἵνα γνῷ ὁ κόσμος ὅτι ἀγαπῶ τὸν πατέρα, καὶ καθὼς ⸀ἐνετείλατο μοι ὁ πατὴρ οὕτως ποιῶ. Ἐγείρεσθε, ἄγωμεν ἐντεῦθεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/031.yaml
  text: But so that the world may know that I love the Father[a], I do just as the Father has commanded me. Rise, let us go from here.
translation:
  language: ig
  text: Ma ka ụwa wee mara na m hụrụ Nna ahụ n’anya, nakwa na, dịka Nna ahụ nyere m n’iwu, otú ahụ ka m na-eme. Bilienụ, ka anyị si ebe a pụọ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ana m eme kpọmkwem ihe Nna ahụ nyere m n’iwu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: Ma
  rationale: Na-egosipụta ntụgharị ma ọ bụ mmegide dị n’etiti okwu a na ihe Jizọs kwuru tupu ya, n’enweghị ịgbakwụnye nkọwa ọzọ.
- source_word: ἵνα γνῷ
  choice: ka ... wee mara
  rationale: Usoro a bụ ụzọ Igbo si egosipụta nzube nke ἵνα na ngwaa subjunctive n’ụzọ doro anya ma bụrụkwa nke e ji asụ Igbo ugbu a.
- source_word: ὁ κόσμος
  choice: ụwa
  rationale: Na-edobe okwu Jọn ji eme ihe, nke pụrụ ịpụta ụmụ mmadụ n’ozuzu ha dị ka otu ìgwè, n’aghọghị ya naanị ‘ndị mmadụ nọ n’ụwa.’
- source_word: ἀγαπῶ
  choice: m hụrụ ... n’anya
  rationale: Nke a bụ ụzọ Igbo nkịtị na nke kwesịrị nsọpụrụ si kwuo ịhụ mmadụ n’anya; n’ebe a ọ na-egosi ọnọdụ ịhụnanya na-aga n’ihu.
- source_word: τὸν πατέρα
  choice: Nna ahụ
  rationale: Na-edobe aha mmekọrịta ahụ na article Grik, n’etinyeghị ‘Nna m,’ ebe nnọchiaha nwe adịghị na isi mmalite.
- source_word: καθὼς ἐνετείλατο μοι ὁ πατὴρ οὕτως ποιῶ
  choice: ana m eme kpọmkwem ihe Nna ahụ nyere m n’iwu
  rationale: Na-ekwupụta nnabata zuru ezu dị na καθὼς ... οὕτως n’Igbo dị mfe, ma na-edobe ike ἐντέλλομαι dịka inye iwu. E tinyere usoro okwu nke dị nso na Grik na nkọwa ala peeji.
- source_word: Ἐγείρεσθε
  choice: Bilienụ
  rationale: Ọ bụ iwu e nyere ọtụtụ mmadụ ka ha bilie; ngwụcha -nụ na-eme ka ọtụtụ mmadụ pụta ìhè.
- source_word: ἄγωμεν
  choice: ka anyị ... pụọ
  rationale: ‘Ka anyị’ na-egosipụta hortatory subjunctive, ya bụ ịkpọ ndị ọzọ ka ha soro onye na-ekwu okwu mee ihe.
- source_word: ἐντεῦθεν
  choice: si ebe a
  rationale: Na-egosipụta ebe a na-amalite ịpụ kpọmkwem, n’ụzọ Igbo na-ada nke ọma.
theological_decisions:
- issue: Aha mmekọrịta πατήρ n’ozizi Jọn banyere Kraịst
  choice: Nna ahụ
  alternative: Nna m
  rationale: Isi mmalite kwuru πατήρ na article ma o tinyeghị nnọchiaha nwe. Nhọrọ a na-edobe okwu ahụ ma ghara ịgbakwunye ihe iji kọwaa mmekọrịta Nna na Ọkpara karịa ka amaokwu ahụ si kwuo.
- issue: Ike okwu ἐντέλλομαι n’ihe gbasara mmekọrịta Nna na Ọkpara
  choice: nyere m n’iwu
  alternative: gwara m ka m mee
  rationale: ‘Nye iwu’ na-edobe ike okwu Grik nke pụtara inye iwu ma ọ bụ ibu ọrụ. A naghị eme ka okwu ahụ dị nro n’ihi echiche nkà mmụta okpukpe.
- issue: Njikọ καθὼς ... οὕτως
  choice: ana m eme kpọmkwem ihe ... nyere m n’iwu
  alternative: dị nnọọ ka ... nyere m n’iwu, otú ahụ ka m na-eme
  rationale: Isi ederede ji usoro Igbo kacha mfe nghọta gosipụta nkwekọrịta zuru ezu; nkọwa ala peeji na-edobe usoro abụọ ahụ nke Grik n’ụzọ pụtara ìhè.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. ‘Bilienụ’ na ‘ka anyị ... pụọ’ na-edobe okwu a gwara ọtụtụ ndị na mkpali ka ha niile gaa. A hapụrụ ‘ụwa’ dịka okwu Jọn ji eme ihe kama ịkọwa ya n’ụzọ ga-emechi obosara ihe ọ pụrụ ịpụta.
