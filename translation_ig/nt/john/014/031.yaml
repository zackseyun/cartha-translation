revisions:
- from: Ma, ka ụwa wee mara na m hụrụ Nna ahụ n’anya, ana m eme kpọmkwem ihe Nna ahụ nyere m n’iwu.[a] Bilienụ, ka anyị si ebe a pụọ.
  to: Ma ka ụwa wee mara na m hụrụ Nna ahụ n’anya, nakwa na, dịka Nna ahụ nyere m n’iwu, otú ahụ ka m na-eme. Bilienụ, ka anyị si ebe a pụọ.[a]
  rationale: The revision preserves the source’s purpose and coordination while rendering καθώς … οὕτως transparently as ‘dịka … otú ahụ.’ The alternate, more compact Igbo rendering is retained as a footnote, with an idiomatic footnote label. The footnote anchor is placed at the end of the verse because it concerns the preceding clause rather than the final departure command.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T06:26:27Z'
review_pass:
  verdict: revise
  source_fidelity: The main translation conveys the adversative, purpose clause, Johannine ‘world,’ Jesus’ love for the Father, the Father’s command, and the plural call to depart. However, the Greek explicitly uses the corresponding construction καθώς … οὕτως (‘just as … so’). The draft’s ‘ana m eme kpọmkwem ihe …’ communicates obedience but compresses that formal correspondence. Restoring it in the main text is both more exact and fully natural in Standard Igbo.
  naturalness: The running text is generally idiomatic. The footnote introduction ‘A pụkwara ịsụ ya’ is not the natural Standard Igbo way to introduce an alternative translation; ‘Ma ọ bụ’ is concise and conventional. The revised sentence also makes the coordination with the purpose clause clearer.
  terminology: ‘ụwa,’ ‘Nna ahụ,’ ‘hụrụ … n’anya,’ and ‘nyere m n’iwu’ are appropriate, dignified, and faithful renderings. ‘Bilienụ’ and ‘ka anyị si ebe a pụọ’ correctly retain the plural imperative and hortatory invitation.
  issues:
  - severity: low
    issue: The main text compresses καθώς … οὕτως into ‘eme kpọmkwem ihe …,’ rather than retaining the explicit ‘just as … so’ correspondence.
    rationale: The compressed wording is not wrong, but ‘dịka … otú ahụ’ more closely represents the Greek structure without sacrificing naturalness.
  - severity: low
    issue: The footnote’s introductory wording is unnatural.
    rationale: ‘A pụkwara ịsụ ya’ is not an idiomatic label for a translation alternative. ‘Ma ọ bụ’ supplies the intended lexical alternative naturally.
  revised_text: Ma ka ụwa wee mara na m hụrụ Nna ahụ n’anya, nakwa na, dịka Nna ahụ nyere m n’iwu, otú ahụ ka m na-eme. Bilienụ, ka anyị si ebe a pụọ.[a]
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “ana m eme kpọmkwem ihe Nna ahụ nyere m n’iwu.”
    reason: lexical_alternative
  revision_rationale: The revision preserves the source’s purpose and coordination while rendering καθώς … οὕτως transparently as ‘dịka … otú ahụ.’ The alternate, more compact Igbo rendering is retained as a footnote, with an idiomatic footnote label. The footnote anchor is placed at the end of the verse because it concerns the preceding clause rather than the final departure command.
