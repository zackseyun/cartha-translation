  text: ὁ μὴ ἀγαπῶν με τοὺς λόγους μου οὐ τηρεῖ· καὶ ὁ λόγος ὃν ἀκούετε οὐκ ἔστιν ἐμὸς ἀλλὰ τοῦ πέμψαντός με πατρός.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/024.yaml
  text: The one who does not love me does not keep my words[a]. And the word that you hear is not mine[b], but belongs to the Father who sent me.
translation:
  language: ig
  text: Onye na-adịghị ahụ m n’anya anaghị edebe okwu m. Okwu ahụ unu na-anụ abụghị nke m, kama ọ bụ nke Nna ahụ zitere m.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “kama o sitere n’aka Nna ahụ zitere m.”
    reason: Genitive τοῦ … πατρός nwere ike imesi ma ịbụ nke Nna ma ọ bụ isi n’aka Nna ike.
lexical_decisions:
- source_word: ὁ μὴ ἀγαπῶν με
  choice: Onye na-adịghị ahụ m n’anya
  rationale: Nkebi a na-ekwu n’ozuzu banyere onye a maara site n’ịghara ịhụ Jizọs n’anya. Ụdị a bụ Igbo ebumpụta ụwa ma na-edobe echiche nke omume na-adịgide adịgide.
- source_word: τοὺς λόγους μου
  choice: okwu m
  rationale: “Okwu” bụ ụzọ Igbo kwesịrị ekwesị isi sụgharịa λόγοι; n’Igbo, otu ụdị ahụ nwere ike ịpụta otu okwu ma ọ bụ ọtụtụ okwu, ebe ọnọdụ ahịrịokwu na-egosi na ọ bụ ihe Jizọs na-akụzi.
- source_word: τηρεῖ
  choice: edebe
  rationale: “Idebe” na-ejide ma irube isi ma ichekwa ihe a kụziri, n’emeghị ka ihe okwu Grik pụtara bụrụ naanị irube iwu isi.
- source_word: ὁ λόγος ὃν ἀκούετε
  choice: Okwu unu na-anụ
  rationale: A hapụrụ λόγος dị ka “okwu,” ma a sụgharịrị ἀκούετε n’ụdị oge ugbu a nke na-ada nke ọma n’Igbo. A tinyeghị “n’ọnụ m” n’ihi na ọ dịghị n’ederede Grik.
- source_word: οὐκ ἔστιν ἐμὸς
  choice: abụghị nke m
  rationale: Nke a na-edobe okwu Grik kpọmkwem banyere ihe bụ nke onye, na-ahapụghị esemokwu dị n’etiti okwu Jizọs na isi mmalite ya.
- source_word: ἀλλὰ τοῦ πέμψαντός με πατρός
  choice: kama ọ bụ nke Nna ahụ zitere m
  rationale: Genitive Grik na-egosi na okwu ahụ bụ nke Nna ahụ zitere Jizọs. Ụdị a bụ Igbo doro anya, ma ọ naghị agbanwe ya ozugbo ka ọ bụrụ naanị okwu banyere isi mmalite.
theological_decisions:
- issue: Mmekọrịta dị n’etiti okwu Jizọs na okwu Nna
  choice: “abụghị nke m, kama ọ bụ nke Nna ahụ zitere m”
  alternative: “esiteghị n’aka m, kama o sitere n’aka Nna ahụ zitere m”
  rationale: A họọrọ ụdị nke na-edobe nkwupụta Jizọs banyere na okwu ahụ abụghị nke ya kama ọ bụ nke Nna, n’enweghị ịkọwa n’ime ntụgharị ihe karịrị ederede banyere ụdị mmekọrịta dị n’etiti Nna na Ọkpara. Nke a na-echekwa ma ọdịiche ha ma ịdị n’otu nke ozi ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “Ịhụ mmadụ n’anya,” “idebe okwu,” na “Nna ahụ zitere m” bụ usoro okwu nkịtị ma dabara n’akwụkwọ nsọ. E dere “Nna” na mkpụrụedemede ukwu n’ihi na ọ na-ezo aka n’ebe Chineke Nna nọ.
