  rationale: A gbanwere naanị “Okwu unu na-anụ” ka ọ bụrụ “Okwu ahụ unu na-anụ” iji gosipụta ὁ λόγος (“okwu ahụ”), n’enweghị mgbanwe n’ihe amaokwu a pụtara. A hapụrụ ntụgharị nke genitive na nkọwa ala dịka ha dị, n’ihi na ha na-echekwa nghọtahie kwesịrị ịdị n’etiti ịbụ nke Nna na isi n’aka Nna.
