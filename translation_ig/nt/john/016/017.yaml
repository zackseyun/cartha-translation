reference: John 16:17
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἶπαν οὖν ἐκ τῶν μαθητῶν αὐτοῦ πρὸς ἀλλήλους· Τί ἐστιν τοῦτο ὃ λέγει ἡμῖν· Μικρὸν καὶ οὐ θεωρεῖτέ με, καὶ πάλιν μικρὸν καὶ ὄψεσθέ με; καί· ⸀Ὅτι ὑπάγω πρὸς τὸν πατέρα;
base_translation:
  language: en
  yaml_path: translation/nt/john/016/017.yaml
  text: 'So some of his disciples said to one another[a], “What is this that he is saying to us: ‘A little while, and you will not see me, and again a little while, and you will see me’? And, ‘Because I am going to the Father’?”'
translation:
  language: ig
  text: 'Ya mere, ụfọdụ n’ime ndị na-eso ụzọ ya gwara ibe ha, “Gịnị bụ ihe a ọ na-agwa anyị: ‘Obere oge, unu agaghị ahụ m; ọzọkwa, obere oge, unu ga-ahụ m’? Ọzọkwa, ‘N’ihi na ana m agakwuru Nna ahụ’[a]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Na ana m agakwuru Nna ahụ.” Njikọ okwu Grik ahụ nwere ike ịbụ nke na-ewebata ihe e kwuru, ma ọ bụ nke pụtara “n’ihi na.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Ya mere
  rationale: Na-egosi njikọ na nkwubi okwu sitere n’okwu Jizọs kwuru tupu nke a, ma bụrụkwa okwu Igbo doro anya.
- source_word: ἐκ τῶν μαθητῶν αὐτοῦ
  choice: ụfọdụ n’ime ndị na-eso ụzọ ya
  rationale: 'Na-echekwa echiche nke partitive ἐκ: ọ bụ ụfọdụ n’ime ha, ọ bụghị ha niile.'
- source_word: πρὸς ἀλλήλους
  choice: gwara ibe ha
  rationale: Na-egosi na ha na-agwa ibe ha okwu n’ụzọ okike n’Igbo.
- source_word: Τί ἐστιν τοῦτο ὃ λέγει ἡμῖν
  choice: Gịnị bụ ihe a ọ na-agwa anyị
  rationale: Na-anọ nso n’usoro Grik ma na-egosikwa mgbagwoju anya ndị na-eso ụzọ ahụ.
- source_word: Μικρὸν
  choice: Obere oge
  rationale: Ọ bụ ezie na okwu ahụ pụtara ‘obere,’ ebe a ọ na-ekwu banyere oge; itinye ‘oge’ na-eme ka Igbo doo anya.
- source_word: θεωρεῖτέ με
  choice: unu agaghị ahụ m
  rationale: ‘Ịhụ’ bụ okwu Igbo kachasị mfe na nke dabara n’echiche ịhụ ma ọ bụ ile mmadụ anya.
- source_word: πάλιν
  choice: ọzọkwa
  rationale: Na-echekwa echiche nke ime ihe ọzọ ma jikọta ahịrịokwu ahụ nke ọma.
- source_word: ὄψεσθέ με
  choice: unu ga-ahụ m
  rationale: A sụgharịrị ya dịka ‘ịhụ’ iji chekwaa nkwughachi na ndakọrịta dị n’okwu Jizọs, n’agbanyeghị na Grik ji ngwaa abụọ dị iche.
- source_word: Ὅτι ὑπάγω πρὸς τὸν πατέρα
  choice: N’ihi na ana m agakwuru Nna ahụ
  rationale: ‘N’ihi na’ na-echekwa nghọta causal nke ὅτι, ebe ‘agakwuru’ na-egosi ntụziaka πρὸς; e debere nghọta ọzọ na nkọwa ala peeji.
- source_word: τὸν πατέρα
  choice: Nna ahụ
  rationale: Na-echekwa definite article nke Grik ma ghara ịgbakwunye ‘Nna m,’ nke adịghị n’ederede a.
theological_decisions:
- issue: Ihe ọpụpụ Jizọs na ịhụ ya ọzọ na-ezo aka na ya
  choice: E hapụrụ okwu ahụ n’enweghị ịkọwapụta kpọmkwem ihe ọ na-ezo aka na ya.
  alternative: Ọnwụ na mbilite n’ọnwụ ya; nrịgo ya na ọnụnọ ime mmụọ; ma ọ bụ ọhụhụ ya mgbe mbilite n’ọnwụ gasịrị.
  rationale: Amaokwu a na-egosi mgbagwoju anya ndị na-eso ụzọ ahụ, ọ naghịkwa edozi ihe Jizọs bu n’obi; ya mere nsụgharị ekwesịghị itinye nkọwa okpukpe n’ime isi ederede.
- issue: Ọrụ ὅτι n’ahịrịokwu ikpeazụ
  choice: 'A sụgharịrị ya n’echiche ihe kpatara ya: ‘N’ihi na.’'
  alternative: 'A pụrụ ịghọta ya dịka okwu na-ewebata ihe e kwuru: ‘Na ana m agakwuru Nna ahụ.’'
  rationale: Ụdị abụọ ahụ kwe omume na Grik. Isi ederede na-ahọrọ nghọta causal nke kwekọrọ n’okwu dị n’amaokwu bu ụzọ, ebe nkọwa ala peeji na-echekwa nghọta ọzọ.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E jiri ‘ndị na-eso ụzọ’ maka μαθηταί na ‘Nna ahụ’ maka τὸν πατέρα. Akara nkọwa [a] dị n’isi ederede n’ebe ọ metụtara nghọta abụọ nke ὅτι.
