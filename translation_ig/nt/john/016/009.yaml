  text: concerning sin[a], because they do not believe in me;
translation:
  language: ig
  text: banyere mmehie, n’ihi na ha anaghị ekwere na m;[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “banyere mmehie, na ha anaghị ekwere na m.” Okwu njikọ Grik a pụrụ ịsụgharị ya n’ụzọ abụọ ahụ, ma “n’ihi na” na-egosipụta nke ọma ọrụ nkọwa ya n’ebe a.
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ
  choice: banyere
  rationale: Ọ na-ewebata isiokwu Mụọ Nsọ ga-eme ka a mata ikpe ya, ma na-edobekwa usoro yiri nke amaokwu ndị na-esochi.
- source_word: ἁμαρτίας
  choice: mmehie
  rationale: Aha a nọ n’otu ma na-egosi mmehie dịka otu ụdị ihe, ọ bụghị ndepụta mmehie dị iche iche.
- source_word: μέν
  choice: —
  rationale: Ọ na-akara ihe mbụ n’usoro amaokwu 9–11; Igbo adịghị achọ ka a sụgharịa ya iche ebe a, n’ihi na usoro ahịrịokwu na-egosipụta ọrụ ya.
- source_word: ὅτι
  choice: n’ihi na
  rationale: N’ebe a ọ na-enye ihe kpatara okwu ahụ bụ ‘banyere mmehie,’ ma na-ejikọta mmehie ahụ na ekweghị na Jizọs.
- source_word: οὐ πιστεύουσιν
  choice: ha ekweghị
  rationale: Ọ na-ekwupụta ọnọdụ ha nke enweghị okwukwe; ‘ekweghị’ bụ ụzọ Igbo kwụ ọtọ ma dịkwa eke isi kwuo ya.
- source_word: εἰς ἐμέ
  choice: na m
  rationale: N’usoro ‘ikw 믿ere mmadụ,’ Igbo na-eji ‘kwere na’; nke a na-echekwa echiche nke ntụkwasị obi a na-etinye n’ebe Jizọs nọ.
theological_decisions:
- issue: Ụdị mmehie a kọwara n’amaokwu a
  choice: Amaokwu ahụ na-egosi ekweghị na Jizọs dịka mmehie bụ isi a na-ekwu maka ya n’ebe a.
  alternative: Ọ na-ekwu maka mmehie mmadụ n’ozuzu ya, ebe ekweghị na Jizọs bụ naanị otu ihe atụ.
  rationale: Nkebi ὅτι na-akọwa ma na-enye ihe ndabere nke ‘banyere mmehie’ site n’okwu bụ ‘ha ekweghị na m.’ Nsụgharị ahụ ekwesịghị ịgbasa nke a ghọọ ozizi sara mbara karịa ihe ederede kwuru.
translation_notes:
  register: Asụsụ Igbo Izugbe dị ugbu a, dị ùgwù ma doo ndị nkịtị anya. E debere usoro nkenke nke ederede Grik na njikọ dị n’etiti ‘mmehie’ na ‘ekweghị na m.’ Akara nkọwa ala peeji [a] pụtara n’ederede isi.
