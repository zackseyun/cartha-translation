revisions:
- from: Ma mgbe onye ahụ, bụ Mmụọ nke eziokwu, bịara, ọ ga-edu unu n’eziokwu niile.[a] N’ihi na ọ gaghị ekwu okwu site n’onwe ya,[b] kama ihe ọ bụla ọ ga-anụ ka ọ ga-ekwu; ọ ga-emekwa ka unu mara ihe ndị na-abịa.[c]
  to: Ma mgbe Mmụọ nke eziokwu ahụ bịara, ọ ga-edu unu n’eziokwu niile.[a] N’ihi na ọ gaghị ekwu okwu site n’onwe ya,[b] kama ihe ọ bụla ọ ga-anụ ka ọ ga-ekwu; ọ ga-ekwupụtakwa unu ihe ndị na-abịa.[c]
  rationale: 'The revision makes two limited idiomatic improvements: it streamlines the opening apposition and uses a more direct Igbo verb for the Spirit’s declaring the coming things. It retains all substantive source-language choices, the existing footnote anchors, and the non-doctrinal handling of potentially nuanced expressions.'
  reviewer_model: gpt-5.6-terra
