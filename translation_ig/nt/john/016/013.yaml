id: JHN.16.13
reference: John 16:13
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὅταν δὲ ἔλθῃ ἐκεῖνος, τὸ πνεῦμα τῆς ἀληθείας, ὁδηγήσει ὑμᾶς ⸂ἐν τῇ ἀληθείᾳ πάσῃ⸃, οὐ γὰρ λαλήσει ἀφ’ ἑαυτοῦ, ἀλλ’ ὅσα ⸀ἀκούσει λαλήσει, καὶ τὰ ἐρχόμενα ἀναγγελεῖ ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/013.yaml
  text: But when he[a], the Spirit of truth, comes, he will guide you into all the truth. For he will not speak from himself, but whatever he hears he will speak[d][c][b], and he will declare to you the things that are coming.
translation:
  language: ig
  text: Ma mgbe Mmụọ nke eziokwu ahụ bịara, ọ ga-edu unu n’eziokwu niile.[a] N’ihi na ọ gaghị ekwu okwu site n’onwe ya,[b] kama ihe ọ bụla ọ ga-anụ ka ọ ga-ekwu; ọ ga-ekwupụtakwa unu ihe ndị na-abịa.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ọ ga-edu unu banye n’eziokwu niile.” N’ụzọ nkịtị, Grik kwuru “n’eziokwu niile.”
    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ, “ọ gaghị ekwu okwu n’ike aka ya.” N’ụzọ nkịtị, “site n’onwe ya.”
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “ihe ndị ga-abịa” ma ọ bụ “ihe ga-eme n’ọdịnihu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν δὲ
  choice: Ma mgbe
  rationale: “Mgbe” na-egosi oge ọ ga-eme, ebe “Ma” na-eburu njikọ na obere ntụgharị dị n’okwu ndị bu ya ụzọ.
- source_word: ἔλθῃ ἐκεῖνος
  choice: mgbe onye ahụ ... bịara
  rationale: “Onye ahụ” na-egosipụta ike e nyere ἐκεῖνος ma na-eme ka ntụaka ahụ bụrụ nke onye, dịka Grik si mee, n’agbanyeghị na asụsụ Igbo enweghị nnọchiaha nwoke na nwanyị.
- source_word: τὸ πνεῦμα τῆς ἀληθείας
  choice: Mmụọ nke eziokwu
  rationale: E debere usoro njikọ ahụ n’ụzọ doro anya, a kpọkwara “Mmụọ” aha ukwu n’ihi na n’ebe a ọ bụ aha a na-akpọ Mmụọ Nsọ.
- source_word: ὁδηγήσει ὑμᾶς ἐν τῇ ἀληθείᾳ πάσῃ
  choice: ọ ga-edu unu n’eziokwu niile
  rationale: “Idu” na-eburu ihe atụ nke onye na-edu ndị ọzọ n’ụzọ. “N’eziokwu niile” na-edobe ἐν (“n’ime/n’”) nke Grik, ma ọ ka bụkwa okwu Igbo a na-aghọta nke ọma.
- source_word: οὐ γὰρ λαλήσει ἀφ’ ἑαυτοῦ
  choice: N’ihi na ọ gaghị ekwu okwu site n’onwe ya
  rationale: Nke a na-edobe “site n’onwe ya” nke ἀφ’ ἑαυτοῦ, n’emeghị ka ọ pụta kpọmkwem na okwu ahụ bụ naanị banyere ikike ma ọ bụ ọchịchọ nke aka ya.
- source_word: ἀλλ’ ὅσα ἀκούσει λαλήσει
  choice: kama ihe ọ bụla ọ ga-anụ ka ọ ga-ekwu
  rationale: E debere ọdịnihu dị na ἀκούσει na λαλήσει, tinyekwa ntụkwasị-uche nke usoro Grik n’ihe ọ bụla ọ ga-anụ.
- source_word: τὰ ἐρχόμενα
  choice: ihe ndị na-abịa
  rationale: Nke a na-egosipụta participle nke ugbu a n’enweghị ịkọwa ma ihe ndị ahụ bụ naanị amụma, ihe omume, ma ọ bụ ihe ndị ọzọ ga-eme n’ọdịnihu.
- source_word: ἀναγγελεῖ ὑμῖν
  choice: ọ ga-emekwa ka unu mara
  rationale: Nkebiokwu a bụ ụzọ Igbo dị ugbu a ma dị ùgwù isi kwuo na ọ ga-akọọrọ ha ma mee ka ha mata ihe ahụ.
theological_decisions:
- issue: Ntūaka onwe onye nye Mmụọ
  choice: “onye ahụ” na “ọ”
  alternative: Ikwughachi “Mmụọ” n’ebe niile ma ọ bụ iji okwu nwere ike ime ka ọ bụrụ naanị ike na-enweghị ụdị onye
  rationale: ἐκεῖνος bụ okwu ntụaka nke nwoke e ji kpọọ τὸ πνεῦμα; “onye ahụ” na-echekwa ntụaka onwe onye ahụ n’Igbo, ebe “ọ” n’onwe ya anaghị egosi nwoke ma ọ bụ nwanyị.
- issue: ἐν τῇ ἀληθείᾳ πάσῃ
  choice: “n’eziokwu niile”
  alternative: “banye n’eziokwu niile” ma ọ bụ “n’ime eziokwu niile”
  rationale: A họọrọ ụdị nke na-edobe ἐν ma na-ada nke ọma n’Igbo. Ihe ọzọ nwere echiche ngagharị ka e debere n’ala peeji ka a ghara idozi nghọta abụọ ahụ n’enweghị ihe kpatara ya.
- issue: Ndabere dị na ἀφ’ ἑαυτοῦ
  choice: “site n’onwe ya”
  alternative: “n’ike aka ya” ma ọ bụ “n’uche aka ya”
  rationale: Nsụgharị nkịtị na-echekwa esemokwu na mmekọrịta nke amaokwu ahụ n’ebughị ụzọ kpebie ma isi okwu ya bụ ikike, mmalite ozi, ma ọ bụ nnwere onwe ime ihe.
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E ji “onye ahụ, bụ Mmụọ nke eziokwu” mee ka apposition ahụ doo anya n’enweghị usoro okwu siri ike. E jighị okwu ụka nke otu denomination ma ọ bụ nkọwa ozizi a na-amanye n’amaokwu ahụ.
