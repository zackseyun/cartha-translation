    text: Ma ọ bụ, “mwute unu ga-agbanwe bụrụ ọṅụ.”
    reason: lexical_alternative
  revision_rationale: The revision replaces an awkward phrase with the idiomatic pair ‘kwaa ákwá’ and ‘kwaa arịrị,’ faithfully reflecting the two Greek grief verbs. It also regularizes the footnote alternative without changing the verse’s meaning or resolving its theological ambiguity.
