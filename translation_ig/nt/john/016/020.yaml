  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀμὴν ἀμὴν λέγω ὑμῖν ὅτι κλαύσετε καὶ θρηνήσετε ὑμεῖς, ὁ δὲ κόσμος χαρήσεται· ⸀ὑμεῖς λυπηθήσεσθε, ἀλλ’ ἡ λύπη ὑμῶν εἰς χαρὰν γενήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/020.yaml
  text: Truly[a], truly, I say to you, you will weep and mourn, but the world will rejoice; you will be grieved, but your grief will become joy.
translation:
  language: ig
  text: 'N’ezie, n’ezie, ana m asị unu: unu ga-akwa ákwá ma kwaa arịrị, ma ụwa ga-aṅụrị ọṅụ; unu ga-enwe mwute, ma mwute unu ga-aghọ ọṅụ.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “mwute unu ga-agbanwe bụrụ ọṅụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν ἀμὴν
  choice: N’ezie, n’ezie
  rationale: Ọ na-edobe nkwughachi ahụ Jizọs ji emesi okwu ike, ma bụrụkwa okwu Igbo doro anya ma kwekọọ n’ụdị okwu dị nsọ.
- source_word: λέγω ὑμῖν
  choice: ana m asị unu
  rationale: Nke a na-esochi okwu Grik ahụ anya ma na-edobe ụzọ Jizọs si agwa ndị na-eso ụzọ ya okwu kpọmkwem.
- source_word: κλαύσετε
  choice: unu ga-akwa ákwá
  rationale: ‘Ịkwa ákwá’ na-egosi iru újú nke na-apụta ìhè ma na-ada n’Igbo nkịtị.
- source_word: θρηνήσετε
  choice: ruokwa uju
  rationale: ‘Iru uju’ na-egosi ịkwa arịrị maka ihe mberede ma mee ka okwu a ghara ịbụ otu ihe kpọmkwem na κλαύσετε.
- source_word: ὁ δὲ κόσμος
  choice: ma ụwa
  rationale: A hapụrụ κόσμος dịka ‘ụwa’ n’enweghị nkọwa agbakwunyere, ma ‘ma’ na-edobe ọdịiche dị n’etiti ụwa na ndị na-eso ụzọ.
- source_word: χαρήσεται
  choice: ga-aṅụrị ọṅụ
  rationale: Ọ na-egosi ọṅụ siri ike ma na-ejikọta nke ọma na χαρά, ‘ọṅụ,’ dị na ngwụcha amaokwu ahụ.
- source_word: λυπηθήσεσθε
  choice: unu ga-enwe mwute
  rationale: Nke a bụ ụzọ Igbo dị n’ụzọ okike isi gosi na mwute ga-erute ha, na-enweghị ime ka okwu ahụ sie ike karịa ihe Grik kwuru.
- source_word: ἡ λύπη ὑμῶν
  choice: mwute unu
  rationale: Ọ na-edobe njikọ okwu dị n’etiti λυπηθήσεσθε na λύπη ma doo ndị na-agụ ya anya.
- source_word: εἰς χαρὰν γενήσεται
  choice: ga-aghọ ọṅụ
  rationale: Ọ na-egosi mgbanwe nke εἰς na γενήσεται na-ekwu maka ya n’ụzọ dị mkpirikpi ma dị nso n’usoro Grik.
theological_decisions:
- issue: Ihe κόσμος pụtara n’akwụkwọ Jọn
  choice: ụwa
  alternative: ụwa na-ekweghị ekwe; usoro ụwa
  rationale: N’agbanyeghị na ‘ụwa’ na-enwekarị echiche na-adịghị mma n’akwụkwọ Jọn, amaokwu a akọwaghị ya kpọmkwem karịa ịbụ ndị nọ n’akụkụ nke ọzọ, ndị ga-aṅụrị ọṅụ mgbe ndị na-eso ụzọ nọ na mwute. Ya mere, a hapụrụ okwu ahụ sara mbara ka e ghara itinye nkọwa okpukpe n’ime amaokwu ahụ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. A na-edobe nkwughachi na ọdịiche mmetụta uche dị n’amaokwu ahụ, ma a naghị agbakwunye nkọwa otu ụka ma ọ bụ nke onye nkọwa ọ bụla.
