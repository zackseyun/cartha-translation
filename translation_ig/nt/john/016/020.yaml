review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the emphatic assurance, the disciples’ future grief, the contrasting rejoicing of the world, and the transformation of their grief into joy. ‘Ụwa’ appropriately preserves the breadth of κόσμος without doctrinal expansion.
  naturalness: The principal naturalness issue is ‘ruokwa uju.’ Although understandable, it is less idiomatic as a paired future action after ‘ga-akwa ákwá’ and overlaps semantically with the later ‘mwute.’ ‘Kwaa arịrị’ is a natural, elevated Standard Igbo expression for lamenting and preserves the distinction between κλαύσετε and θρηνήσετε.
  terminology: ‘N’ezie, n’ezie,’ ‘ana m asị unu,’ ‘ụwa,’ ‘mwute,’ and ‘ọṅụ’ are suitable Standard Igbo choices and maintain the verse’s solemn register and lexical links. The footnote alternative is adjusted to a more natural expression.
  issues:
  - severity: medium
    issue: ‘ruokwa uju’ is an awkward rendering of θρηνήσετε in this coordinated future clause.
    rationale: θρηνήσετε denotes lamenting/mourning as an expressed act. ‘Unu ga-akwa ákwá ma kwaa arịrị’ is idiomatic and retains the paired expressions of grief without prematurely repeating the idea later rendered ‘mwute.’
  - severity: low
    issue: The footnote wording ‘ga-atụgharị ghọọ ọṅụ’ is less natural than an explicit change-of-state construction.
    rationale: ‘Ga-agbanwe bụrụ ọṅụ’ clearly provides the intended lexical alternative, ‘will turn into joy,’ while remaining distinct from the main rendering ‘ga-aghọ ọṅụ.’
  revised_text: 'N’ezie, n’ezie, ana m asị unu: unu ga-akwa ákwá ma kwaa arịrị, ma ụwa ga-aṅụrị ọṅụ; unu ga-enwe mwute, ma mwute unu ga-aghọ ọṅụ.[a]'
  revised_footnotes:
