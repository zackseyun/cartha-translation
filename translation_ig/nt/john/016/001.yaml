    rationale: σκανδαλισθῆτε can refer to stumbling, being caused to stumble, or taking offense; in this context it may include falling away, but “n’okwukwe” makes that contextual implication explicit in the text rather than preserving the source’s lexical breadth.
  - severity: low
    issue: The footnote’s final alternative, “iwe iwe ma jụ okwu ahụ,” is interpretively expanded and less natural.
    rationale: The Greek verb can include taking offense, but it does not specify rejecting “the word.” A simpler offense-related alternative better preserves ambiguity.
