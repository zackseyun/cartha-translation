  text: I have spoken these things to you so that you may not fall away.
translation:
  language: ig
  text: Agwala m unu ihe ndị a ka unu ghara ịsụ ngọngọ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ka a ghara ime ka unu sụọ ngọngọ,” ma ọ bụ “ka unu ghara iwe iwe.” Ngwaa Grik ahụ pụrụ ịpụta ịsụ ngọngọ, ime ka mmadụ sụọ ngọngọ, ma ọ bụ iwe iwe; n’ọnọdụ a, ọ pụrụ ịgụnyekwa ịdaba n’ekweghị ekwe ma ọ bụ ịhapụ okwukwe.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταῦτα
  choice: ihe ndị a
  rationale: Na-ezo aka n'okwu Jizọs kwuru tupu nke a ma na-edobe ọtụtụ nke okwu Grik ahụ.
- source_word: λελάληκα
  choice: Agwala m
  rationale: Ụdị ngwaa zuru oke na-egosi okwu e kwuworo nke ka dị mkpa ugbu a; ‘Agwala m unu’ bụ Igbo nkịtị ma doo anya.
- source_word: ὑμῖν
  choice: unu
  rationale: Na-edobe onye nke abụọ ọtụtụ nke dative Grik n'ụzọ Igbo si ekwu ya.
- source_word: ἵνα μὴ
  choice: ka unu ghara
  rationale: Na-egosipụta nzube na mmegide ya n'Igbo dị mfe ma kwekọọ n'usoro Grik.
- source_word: σκανδαλισθῆτε
  choice: ịdapụ n’okwukwe
  rationale: N'ọnọdụ mkpagbu a na-abịa, okwu ahụ na-adọ aka ná ntị banyere ịsụ ngọngọ nke pụrụ iduga n'ịhapụ okwukwe; ntụgharị a na-eme ka ịdị arọ ya doo anya, ebe nkọwa ala na-edobe ihe oyiyi na nhọrọ ndị ọzọ.
theological_decisions:
- issue: Ihe σκανδαλισθῆτε pụtara n'ọnọdụ mkpagbu na ịbụ onye na-eso ụzọ
  choice: ịdapụ n’okwukwe
  alternative: ịsụ ngọngọ; ime ka unu sụọ ngọngọ; iwe iwe ma jụ okwu ahụ
  rationale: Amaokwu na-esote na-ekwu banyere ịchụpụ ndị na-eso ụzọ na mkpagbu. Ya mere, ihe ize ndụ ahụ karịrị iwe n'obi naanị, ma ntụgharị ahụ ekwesịghị izochi na okwu Grik ji ihe oyiyi ịsụ ngọngọ mee ihe; e debere nke ahụ na nkọwa ala.
translation_notes:
  register: Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ ‘Agwala m unu’ kama ụdị siri ike karị iji mee ka okwu ahụ bụrụ nke nkịtị n'ọnụ, ma ‘ịdapụ n’okwukwe’ na-ebupụta ịdị arọ nke ịdọ aka ná ntị ahụ.
