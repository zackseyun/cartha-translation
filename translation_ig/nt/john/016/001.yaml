  verdict: revise
  source_fidelity: The draft accurately renders the demonstrative, perfect verb, plural addressee, and purpose clause. However, “ịdapụ n’okwukwe” specifies apostasy and explicitly adds “faith,” neither of which is stated in σκανδαλισθῆτε. The immediate context can support that outcome, but the Greek verb retains the broader stumble/offense imagery.
  naturalness: “Agwala m unu ihe ndị a ka unu ghara ịsụ ngọngọ” is natural, clear Standard Igbo with an appropriately dignified discourse register. The revised note is also more idiomatic and avoids the awkward, overly expanded “iwe iwe ma jụ okwu ahụ.”
  terminology: “ịsụ ngọngọ” preserves the central metaphor of σκανδαλίζω without foreclosing the contextual possibility of defection. The footnote retains the passive/causative and offense-related senses as alternatives.
