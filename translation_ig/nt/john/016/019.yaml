revisions:
- from: Jizọs matara na ha chọrọ ịjụ ya ajụjụ, ya mere ọ sịrị ha, “Ọ bụ banyere okwu a ka unu na-ajụrịta onwe unu ihe, na m kwuru,[a] ‘Nwa oge nta, unu agaghịzi ahụ m; nwa oge nta ọzọkwa, unu ga-ahụ m’?[b]”
  to: Jizọs matara na ha chọrọ ịjụ ya ajụjụ, ọ sịrị ha, “Unu na-atụlerịta nke a n’etiti onwe unu, na m kwuru, ‘Obere oge, unu agaghị ahụ m ọzọ; ma obere oge ọzọ, unu ga-ahụ m’?”
  rationale: The revision removes an unrepresented causal link, uses idiomatic Standard Igbo for the two temporal phrases, and retains the source’s open question and its ambiguity in ὅτι. The footnotes preserve the alternative construal and the lexical distinction without imposing a theological distinction.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T06:26:54Z'
review_pass:
  verdict: revise
  source_fidelity: The draft conveys the disciples’ intended question, Jesus’ awareness, the question about their mutual discussion, and the two short intervals. However, “ya mere” introduces a consequential relation not expressed by Greek καί, and “nwa oge nta” is not the most natural Standard Igbo expression for the idiomatic temporal μικρόν.
  naturalness: “Nwa oge nta” and “nwa oge nta ọzọkwa” are awkward and somewhat redundant. “Obere oge” and “obere oge ọzọ” are natural contemporary Standard Igbo. Recasting the question as “Unu na-atụlerịta ... n’etiti onwe unu” clearly expresses the reciprocal discussion without the overly marked “Ọ bụ ... ka” construction.
  terminology: “Jizọs,” “matara,” and “ịhụ” are appropriate. The Greek distinction between θεωρέω and ὁράω should remain a footnote-level lexical observation rather than being overstated in the main line.
  issues:
  - severity: medium
    issue: Added causal connective
    rationale: '“ya mere” means “therefore/so” and supplies a causal inference where the Greek simply coordinates: “and he said to them.”'
  - severity: medium
    issue: Unnatural temporal phrase
    rationale: “nwa oge nta” is not idiomatic Standard Igbo here; “obere oge” is the ordinary expression for a short while.
  - severity: low
    issue: Footnote wording for θεωρέω
    rationale: “ile anya ma ọ bụ ịhụ ihe anya” is awkward and can imply a stronger distinction than the context requires. A concise note that the first verb can carry the nuance “observe/behold” is clearer.
  revised_text: Jizọs matara na ha chọrọ ịjụ ya ajụjụ, ọ sịrị ha, “Unu na-atụlerịta nke a n’etiti onwe unu, na m kwuru, ‘Obere oge, unu agaghị ahụ m ọzọ; ma obere oge ọzọ, unu ga-ahụ m’?”
  revised_footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “n’ihi na m kwuru.” Njikọ Grik ahụ nwere ike iwebata ihe ha na-atụle ma ọ bụ ihe kpatara ha ji atụle ya.
    reason: alternative_reading
  - marker: b
    text: 'Grik ji ngwaa abụọ dị iche maka “ịhụ” n’ebe a: nke mbụ (θεωρέω) nwekwara ike ịpụta “ikiri” ma ọ bụ “ile anya nke ọma,” ebe nke abụọ bụ ὁράω. E ji “ịhụ” sụgharịa ha abụọ n’ahịrị bụ isi iji chekwaa ntụnyere ahụ ma mee ka okwu ahụ doo anya.'
    reason: lexical_alternative
  revision_rationale: The revision removes an unrepresented causal link, uses idiomatic Standard Igbo for the two temporal phrases, and retains the source’s open question and its ambiguity in ὅτι. The footnotes preserve the alternative construal and the lexical distinction without imposing a theological distinction.
