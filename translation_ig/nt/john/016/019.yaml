id: JHN.16.19
reference: John 16:19
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸀ἔγνω Ἰησοῦς ὅτι ἤθελον αὐτὸν ἐρωτᾶν, καὶ εἶπεν αὐτοῖς· Περὶ τούτου ζητεῖτε μετ’ ἀλλήλων ὅτι εἶπον· Μικρὸν καὶ οὐ θεωρεῖτέ με, καὶ πάλιν μικρὸν καὶ ὄψεσθέ με;
base_translation:
  language: en
  yaml_path: translation/nt/john/016/019.yaml
  text: Jesus knew that they wanted to ask him[a], and he said to them, “Are you discussing this with one another, that I said, ‘A little while, and you no longer see me, and again a little while[c][b], and you will see me’?”
translation:
  language: ig
  text: Jizọs matara na ha chọrọ ịjụ ya ajụjụ, ọ sịrị ha, “Unu na-atụlerịta nke a n’etiti onwe unu, na m kwuru, ‘Obere oge, unu agaghị ahụ m ọzọ; ma obere oge ọzọ, unu ga-ahụ m’?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔγνω
  choice: matara
  rationale: Okwu a na-egosi na Jizọs ghọtara ihe ndị na-eso ụzọ ya bu n’obi; “matara” bụ ụzọ Igbo doro anya ma dị mfe isi kwuo ya.
- source_word: ἤθελον αὐτὸν ἐρωτᾶν
  choice: ha chọrọ ịjụ ya ajụjụ
  rationale: Nke a na-egosipụta ọchịchọ ha ịjụ Jizọs ihe n’asụsụ Igbo nkịtị, n’emeghị ka ajụjụ ahụ yie esemokwu.
- source_word: Περὶ τούτου ζητεῖτε μετ’ ἀλλήλων
  choice: Ọ bụ banyere okwu a ka unu na-ajụrịta onwe unu ihe
  rationale: Nhazi a na-egosipụta isiokwu ha na-achọ ịghọta n’etiti onwe ha ma na-edobe ya dị ka ajụjụ Jizọs jụrụ ha.
- source_word: ὅτι εἶπον
  choice: na m kwuru
  rationale: “Na” na-ewebata ihe Jizọs kwuru nke ha na-atụle; ihe odide ala na-edekwa na ὅτι nwekwara ike igosi ihe kpatara mkparịta ụka ahụ.
- source_word: Μικρὸν
  choice: Nwa oge nta
  rationale: Neuter Μικρόν na-arụ ọrụ dị ka okwu oge ebe a; “nwa oge nta” bụ okwu Igbo doro anya maka obere nkeji oge.
- source_word: οὐ θεωρεῖτέ με
  choice: unu agaghịzi ahụ m
  rationale: N’ọnọdụ okwu a, present Grik ahụ na-ele anya n’oge dị nso mgbe ha na-agaghịzi ahụ Jizọs; “agaghịzi” na-egosipụta nkwụsị ahụ n’Igbo nkịtị.
- source_word: πάλιν μικρὸν καὶ ὄψεσθέ με
  choice: nwa oge nta ọzọkwa, unu ga-ahụ m
  rationale: Nke a na-edobe usoro nke obere oge nke abụọ na nkwa na ha ga-ahụ ya ọzọ.
theological_decisions:
- issue: Ọdịiche dị n’etiti θεωρέω na ὁράω
  choice: Jiri “ịhụ” maka ngwaa abụọ ahụ n’ahịrị bụ isi
  alternative: Kewaa ha dịka “ile anya/ikiri” na “ịhụ”
  rationale: N’agbanyeghị na Grik ji ngwaa abụọ dị iche, isi okwu ebe a bụ na ha agaghị ahụ Jizọs nwa oge ma mesịa hụ ya ọzọ. Iji otu ngwaa na-eme ka ntụnyere ahụ doo anya, ebe ihe odide ala na-echekwa ọdịiche okwu Grik ahụ.
- issue: Ọrụ ὅτι n’ahịrị ajụjụ ahụ
  choice: 'Gụọ ya dị ka onye na-ewebata ọdịnaya okwu a na-atụle: “na m kwuru”'
  alternative: 'Gụọ ya dị ka ihe kpatara ya: “n’ihi na m kwuru”'
  rationale: Ụdị a na-ejikọta mkparịta ụka ndị na-eso ụzọ ahụ na kpọmkwem ihe Jizọs kwuru, ma ihe odide ala na-echekwa ohere nke ọgụgụ nke na-egosi ihe kpatara ya.
- issue: Ụdị ajụjụ Jizọs jụrụ
  choice: Debe ya dị ka ezigbo ajụjụ
  alternative: Kwuo ya dị ka nkwupụta na Jizọs amarala ihe ha na-ekwu
  rationale: Ụdị ζητεῖτε? n’ebe a dabara n’ajụjụ nke na-ekpughe ihe ha na-atụle n’etiti onwe ha, n’etinyeghị nkọwa ozizi ọzọ.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji “unu” gwa ọtụtụ ndị, jiri “ajụrịta onwe unu ihe” gosipụta mkparịta ụka ha n’etiti onwe ha, ma zere okwu ụka nke otu nzukọ pụrụ iche.
