revisions:
- from: N’ụbọchị ahụ, unu ga-arịọ n’aha m, anaghịkwa m agwa unu na m ga-arịọ Nna banyere unu.[a][b]
  to: N’ụbọchị ahụ, unu ga-arịọ n’aha m, ma anaghị m agwa unu na m ga-arịọ Nna banyere unu.[a][b]
  rationale: The revision removes an unwarranted additive nuance, retains the present-tense wording that does not settle the question of Jesus’ intercession beyond this statement, and corrects the alternative wording in the footnote. It preserves the source’s ambiguity and the draft’s intended register.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T08:26:02Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders the temporal phrase, asking in Jesus’ name, the future plural request, and the content clause introduced by ὅτι. However, anaghịkwa m agwa adds the sense ‘nor/also I am not telling,’ which is not expressed by Greek καί and can imply an unintended additional negation. Ma anaghị m agwa preserves the simple connective and present-tense statement.
  naturalness: N’ụbọchị ahụ ... ma anaghị m agwa unu ... is natural, clear Standard Igbo and maintains a dignified biblical register. The proposed adjustment also avoids the slightly marked additive force of -kwa.
  terminology: Nna, n’aha m, rịọ, and banyere unu are suitable. The lexical note should state only that Greek uses two distinct verbs; it should not overstate a semantic distinction that the verse itself does not explicitly define. The alternative n’ihi unu is unsuitable here because it readily means ‘because of you,’ rather than περί ὑμῶν (‘concerning/for you’).
  issues:
  - severity: medium
    issue: The connective-negative expression anaghịkwa m agwa unu introduces an additive/continuative nuance.
    rationale: καὶ οὐ λέγω ὑμῖν simply coordinates ‘and I do not say to you.’ In Igbo, -kwa naturally suggests ‘also’ or ‘nor’ in this setting. Ma anaghị m agwa unu conveys the source relation without adding that nuance.
  - severity: medium
    issue: Footnote a gives n’ihi unu as an alternative for banyere unu.
    rationale: n’ihi unu normally means ‘because of you’ and is not a safe equivalent for περί ὑμῶν in this context. Maka unu is a defensible contextual alternative (‘for/on behalf of you’).
  - severity: low
    issue: Footnote b’s wording about the two Greek verbs is somewhat awkward and implies more lexical contrast than necessary.
    rationale: A concise statement that two different Greek verbs occur is accurate and lets readers observe the distinction without assigning a theological or fixed semantic hierarchy.
  revised_text: N’ụbọchị ahụ, unu ga-arịọ n’aha m, ma anaghị m agwa unu na m ga-arịọ Nna banyere unu.[a][b]
  revised_footnotes:
