  text: ἐν ἐκείνῃ τῇ ἡμέρᾳ ἐν τῷ ὀνόματί μου αἰτήσεσθε, καὶ οὐ λέγω ὑμῖν ὅτι ἐγὼ ἐρωτήσω τὸν πατέρα περὶ ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/john/016/026.yaml
  text: On that day you will ask in my name[a], and I do not say to you that I will ask the Father concerning you[c][b];
translation:
  language: ig
  text: N’ụbọchị ahụ, unu ga-arịọ n’aha m, ma anaghị m agwa unu na m ga-arịọ Nna banyere unu.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị “banyere unu” dịka “maka unu.”
    reason: lexical_alternative
  - marker: b
    text: 'N’asụsụ Grik, e ji ngwaa abụọ dị iche maka “rịọ” n’amaokwu a: αἰτέω mgbe ndị na-eso ụzọ na-arịọ, na ἐρωτάω mgbe Jizọs na-arịọ Nna.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: N’ụbọchị ahụ
  rationale: Nke a bụ ụzọ Igbo nkịtị ma doo anya isi gosi oge a kapịrị ọnụ, ma na-edobe nrụgide dị na ἐκείνῃ, ‘ahụ.’
- source_word: ἐν τῷ ὀνόματί μου
  choice: n’aha m
  rationale: Ọ na-edobe akpaokwu Jọn ji eme ihe, nke na-ejikọta arịrịọ ahụ na onye Jizọs bụ na ikike ya, n’agbanyeghị na a naghị akọwachasị ihe niile ọ pụtara.
- source_word: αἰτήσεσθε
  choice: unu ga-arịọ
  rationale: Ọ bụ ngwaa ọdịnihu nke onye nke abụọ n’ọnụọgụ ọtụtụ. ‘Ịrịọ’ bụ okwu Igbo ebumpụta ụwa maka ịrịọ ihe, karịchaa n’ekpere.
- source_word: οὐ λέγω ὑμῖν
  choice: anaghịkwa m agwa unu
  rationale: Ọ na-edobe ngwaa ahụ n’oge ugbu a ma na-ada ka Igbo nke oge a. ‘-kwa’ na-egosi njikọ ya na nkebiokwu bu ụzọ.
- source_word: ὅτι
  choice: na
  rationale: N’ebe a, ὅτι na-ewebata ihe Jizọs na-adịghị agwa ha; ọ pụtaghị ‘n’ihi na.’
- source_word: ἐρωτήσω
  choice: m ga-arịọ
  rationale: ‘Ịrịọ’ bụkwa nsụgharị Igbo kachasị mma n’ebe a. A kọwara ọdịiche dị n’etiti ngwaa Grik abụọ ahụ n’ihe e dere n’ala peeji kama iji okwu Igbo na-adịghị mma manye ọdịiche ahụ.
- source_word: τὸν πατέρα
  choice: Nna
  rationale: Ihe odide Grik kwuru ‘Nna,’ ọ bụghị ‘Nna m.’ Ide ya dịka aha nsọpụrụ na-edobe usoro okwu Jọn ma bụrụkwa Igbo doro anya.
- source_word: περὶ ὑμῶν
  choice: banyere unu
  rationale: Nke a na-anọ nso n’ihe περί tinyere genitive pụtara ma na-ahapụkwa ohere na ọ pụrụ ịpụta ịrịọchitere ha arịrịọ.
theological_decisions:
- issue: Ma Jizọs ọ na-agọnahụ ọrụ ịrịọchitere ndị na-eso ụzọ ya arịrịọ n’ọdịnihu, ka ọ̀ bụ naanị na ọ naghị akọwa ụzọ ha si abịakwute Nna dịka ihe dabere n’ịrịọ ya n’ebe a.
  choice: 'A sụgharịrị ya dịka ihe Jizọs na-adịghị agwa ha n’ebe a: ‘anaghịkwa m agwa unu na m ga-arịọ Nna.’'
  alternative: ‘Agaghị m arịọ Nna maka unu,’ nke ga-eme ka ọ bụrụ nkwupụta siri ike na Jizọs agaghị arịọchitere ha arịrịọ.
  rationale: Usoro okwu Grik bụ ‘anaghị m agwa unu na…,’ ọ bụghị ‘agaghị m….’ Nsụgharị a na-edobe esemokwu nkà mmụta okpukpe ahụ ma ghara ikpebi ya n’ime nsụgharị.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. A họọrọ ‘Nna’ dịka aha nsọpụrụ Jọn ji eme ihe; e zere ‘Nna m’ n’ihi na okwu nnọchi nke nwe adịghị n’ihe odide Grik. A hapụrụ ‘n’aha m’ n’ụdị ya iji chekwaa omimi na njikọ okwu ahụ n’Oziọma Jọn.
