id: JHN.16.30
reference: John 16:30
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: νῦν οἴδαμεν ὅτι οἶδας πάντα καὶ οὐ χρείαν ἔχεις ἵνα τίς σε ἐρωτᾷ· ἐν τούτῳ πιστεύομεν ὅτι ἀπὸ θεοῦ ἐξῆλθες.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/030.yaml
  text: Now we know that you know all things and have no need that anyone should question you[a]. By this we believe that you came from God.
translation:
  language: ig
  text: Ugbu a, anyị maara na ị maara ihe niile, ọ dịghịkwa gị mkpa ka onye ọ bụla jụọ gị ajụjụ.[a] Site na nke a, anyị kwere na i si n’ebe Chineke nọ bịa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ka onye ọ bụla jụọ gị ihe.” Ngwaa Grik ahụ nwere ike ịpụta ịjụ ihe ma ọ bụ ịgba ajụjụ; ebe a, okwu ndị gbara ya gburugburu na-elekwasị anya n’ihe Jizọs maara na ajụjụ ndị na-eso ụzọ ya bu n’obi.
    reason: lexical_alternative
lexical_decisions:
- source_word: νῦν
  choice: Ugbu a
  rationale: Ọ na-egosi na ndị na-eso ụzọ Jizọs na-ekwu banyere nghọta ha nwere n’oge ahụ; nke a bụkwa ụzọ Igbo si ekwu ya n'ụzọ dị mfe.
- source_word: οἴδαμεν
  choice: anyị maara
  rationale: Ọ bụ ezie na ọdịdị okwu Grik ahụ yiri nke zuru ezu, ihe ọ pụtara ebe a bụ ihe ha maara ugbu a; ‘anyị maara’ bụ Igbo doro anya.
- source_word: οἶδας πάντα
  choice: ị maara ihe niile
  rationale: Nke a na-edobe obosara πάντα n’enweghị ịgbakwunye nkọwa banyere ụdị ọmụma ahụ.
- source_word: οὐ χρείαν ἔχεις
  choice: ọ dịghịkwa gị mkpa
  rationale: Nke a bụ usoro okwu Igbo dị ndụ nke na-egosipụta na Jizọs enweghị mkpa ahụ.
- source_word: ἵνα τίς σε ἐρωτᾷ
  choice: ka onye ọ bụla jụọ gị ajụjụ
  rationale: ἐρωτάω nwere ike ịpụta ịjụ mmadụ ihe ma ọ bụ ịgba ya ajụjụ. Usoro a dabara n’ihe gbasara ihe Jizọs maara, ma ndetu ala na-echekwa ụzọ ọzọ e nwere ike isi ghọta ya.
- source_word: ἐν τούτῳ
  choice: Site na nke a
  rationale: Ọ na-egosi ihe ndị na-eso ụzọ Jizọs ji ruo na nkwenye ha.
- source_word: πιστεύομεν
  choice: anyị kwere
  rationale: Nke a na-egosipụta nkwenye ha n’okwu ha na-ekwupụta, ma ọ naghị agbakwunye echiche ọzọ na-abụghị nke dị n’amaokwu ahụ.
- source_word: ἀπὸ θεοῦ
  choice: n’ebe Chineke nọ
  rationale: N’ime ahịrịokwu ‘i si n’ebe Chineke nọ bịa,’ ọ na-egosipụta isi ebe ọ bịara ma na-edobe ‘Chineke’ dịka Grik si kwuo, kama iji ‘Nna’ dochie ya.
- source_word: ἐξῆλθες
  choice: i si … bịa
  rationale: N’ebe a, ngwaa ahụ na-ekwu banyere ebe Jizọs si na ozi ya; ‘si … bịa’ bụ okwu Igbo ebumpụta ụwa ma doo anya.
theological_decisions:
- issue: Ike okwu ‘ị maara ihe niile’ nwere n’ihe gbasara onye Kraịst bụ
  choice: E debere nkwupụta ndị na-eso ụzọ Jizọs kpọmkwem dịka ‘ị maara ihe niile.’
  alternative: Ịgbasa ya ka ọ kọwaa n’ụzọ doro anya ozizi banyere ịma ihe niile.
  rationale: Amaokwu ahụ nwere nnukwu ihe ọ na-ekwu banyere Kraịst, ma ntụgharị ekwesịghị itinye nkọwa ozizi nke okwu Grik ekwughị kpọmkwem.
- issue: Ihe ἀπὸ θεοῦ ἐξῆλθες pụtara
  choice: i si n’ebe Chineke nọ bịa
  alternative: i si n’ebe Nna nọ bịa; i sitere na Chineke pụta
  rationale: Nhọrọ a na-edobe isi ebe na ozi si n’aka Chineke, ma ọ naghị eji ‘Nna’ dochie ‘Chineke’ ma ọ bụ kpebie karịa ihe ederede ahụ kwuru banyere ụdị ‘ịpụta’ ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. ‘I si n’ebe Chineke nọ bịa’ bụ okwu ebumpụta ụwa nke na-echekwa isi ebe Jizọs si bịa n’enweghị ịgbakwunye ‘Nna.’
