revisions:
- from: Ya mere, ha nọ na-asị[a], “Gịnị bụ ihe a ọ na-ekwu, ‘Nwa oge nta’? Anyị amaghị ihe ọ na-ekwu.”
  to: Ya mere, ha nọ na-ekwu[a], “Gịnị bụ ‘obere oge’ a ọ na-ekwu? Anyị amaghị ihe ọ na-ekwu.”
  rationale: The revision replaces the non-idiomatic temporal expression with “obere oge” and reshapes the first question into fluent Standard Igbo. It retains the imperfect sense in “ha nọ na-ekwu,” the connective “Ya mere,” the quoted phrase under discussion, and the second statement’s unelaborated “ihe ọ na-ekwu.”
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T06:26:52Z'
review_pass:
  verdict: revise
  source_fidelity: The draft conveys the ongoing/repeated speech of ἔλεγον, the discourse connection of οὖν, and the disciples’ repeated lack of understanding. However, “Nwa oge nta” is not the natural Standard Igbo expression for μικρόν in this temporal sense; “obere oge” is clearer and idiomatic. The wording of the first question can also be made natural without changing its deliberately puzzled, non-interpretive form.
  naturalness: “Gịnị bụ ihe a ọ na-ekwu, ‘Nwa oge nta’?” is structurally awkward in Standard Igbo. “Gịnị bụ ‘obere oge’ a ọ na-ekwu?” naturally asks about the expression Jesus used, while retaining the source’s question rather than replacing it with “What does it mean?”
  terminology: Use “obere oge” for “a little while.” It is standard contemporary Igbo and appropriately denotes a short period. The repeated “ihe ọ na-ekwu” preserves the restraint and repetition of τί λαλεῖ without adding an interpretation such as “what he means.”
  issues:
  - severity: medium
    issue: “Nwa oge nta” is an unnatural/redundant rendering of μικρόν.
    rationale: For a short span of time, Standard Igbo normally uses “obere oge.” “Nwa oge nta” combines near-overlapping diminutive/shortness expressions and is less idiomatic.
  - severity: low
    issue: The first quoted question follows the Greek/English structure too closely for natural Igbo.
    rationale: Recasting it as “Gịnị bụ ‘obere oge’ a ọ na-ekwu?” preserves the object of the disciples’ puzzlement and avoids an awkward clause sequence.
  revised_text: Ya mere, ha nọ na-ekwu[a], “Gịnị bụ ‘obere oge’ a ọ na-ekwu? Anyị amaghị ihe ọ na-ekwu.”
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “ha nọ na-asị.”
    reason: lexical_alternative
  revision_rationale: The revision replaces the non-idiomatic temporal expression with “obere oge” and reshapes the first question into fluent Standard Igbo. It retains the imperfect sense in “ha nọ na-ekwu,” the connective “Ya mere,” the quoted phrase under discussion, and the second statement’s unelaborated “ihe ọ na-ekwu.”
