  text: ἔλεγον οὖν· ⸂Τί ἐστιν τοῦτο⸃ ὃ ⸀λέγει μικρόν; οὐκ οἴδαμεν τί λαλεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/018.yaml
  text: So they were saying[a], “What is this that he says, ‘A little while’? We do not know what he is saying.”
translation:
  language: ig
  text: Ya mere, ha nọ na-ekwu[a], “Gịnị bụ ‘obere oge’ a ọ na-ekwu? Anyị amaghị ihe ọ na-ekwu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ha nọ na-asị.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγον
  choice: ha nọ na-asị
  rationale: Oge imperfect na-egosi okwu na-aga n’ihu ma ọ bụ nke a na-ekwughachi; ‘ha nọ na-asị’ na-egosipụta nke a n’Igbo dị mfe.
- source_word: οὖν
  choice: Ya mere
  rationale: Na-ejikọta ajụjụ ndị a na okwu bu ya ụzọ, ma na-egosi ihe si na ya pụta.
- source_word: Τί ἐστιν τοῦτο
  choice: Gịnị bụ ihe a
  rationale: Na-edobe ụdị ajụjụ Grik kpọmkwem na mgbagwoju anya ha, kama ịkọwa ya ozugbo dị ka ‘Gịnị ka nke a pụtara?’
- source_word: ὃ λέγει μικρόν
  choice: ọ na-ekwu, ‘Nwa oge nta’
  rationale: Na-edobe μικρόν dịka okwu Jizọs kpọrọ aha nke ndị na-eso ụzọ na-ajụ banyere ya.
- source_word: μικρόν
  choice: Nwa oge nta
  rationale: N’ebe a, okwu ahụ na-ezo aka n’oge dị mkpirikpi; nsụgharị a bụ okwu Igbo a na-aghọta nke ọma.
- source_word: οὐκ οἴδαμεν
  choice: Anyị amaghị
  rationale: Na-egosipụta nghọta dị ugbu a nke οἶδα e tinyere n’ụdị ịjụ.
- source_word: τί λαλεῖ
  choice: ihe ọ na-ekwu
  rationale: Na-asụgharị λαλεῖ n’ụzọ kwụ ọtọ ma ghara ịgbakwunye nkọwa dịka ‘ihe ọ pụtara.’
theological_decisions: []
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E debere ajụjụ ahụ n’ụdị ya kpọmkwem na mgbagwoju anya dị n’isi mmalite. Akara ndetu [a] pụtara n’ahịrị isi.
