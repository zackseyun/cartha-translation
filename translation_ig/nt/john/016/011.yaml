  text: and concerning judgment[c][b][a], because the ruler of this world has been judged.
translation:
  language: ig
  text: nakwa banyere ikpe, n’ihi na e kpeela onye na-achị ụwa a[a][b] ikpe[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “onyeisi nke ụwa a.”
    reason: lexical_alternative
  - marker: b
    text: O yikarịrị ka nke a na-ekwu maka Setan; tulee Jọn 12:31 na 14:30.
    reason: cross_reference
  - marker: c
    text: Ma ọ bụ, “ọ nọworị n’okpuru ikpe.” Ụdị ngwaa Grik a na-emesi ike na e kpeela ikpe ahụ, ihe si na ya pụta ka dịkwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ δὲ κρίσεως
  choice: nakwa banyere ikpe
  rationale: “Banyere” na-egosi isiokwu a na-ekwu maka ya; “nakwa” na-eburu njikọ δέ n’usoro okwu gbasara mmehie, ezi omume, na ikpe. “Ikpe” bụ okwu Igbo dabara kpọmkwem n’ebe a.
- source_word: ὅτι
  choice: n’ihi na
  rationale: N’ebe a, ὅτι na-enye ihe mere Mmụọ ahụ ji eme ka ụwa mata ihe banyere ikpe, ya mere nsụgharị na-egosi mmekọrịta ihe kpatara ihe.
- source_word: ὁ ἄρχων
  choice: onye na-achị
  rationale: Nkebi a na-akọwa onye nwere ọchịchị ma ọ bụ ikike. “Onye na-achị” bụ Igbo doro anya nke na-adịghị atụnye echiche banyere ịbụ nwa eze.
- source_word: τοῦ κόσμου τούτου
  choice: ụwa a
  rationale: N’Oziọma Jọn, κόσμος na-abụkarị “ụwa,” karịsịa usoro ụwa nke na-emegide Chineke. “Ụwa a” na-edobe okwu ahụ n’ụzọ dị mfe ma kwụ ọtọ.
- source_word: κέκριται
  choice: e kpeela ... ikpe
  rationale: 'Ụdị ngwaa Grik a bụ perfect passive: e meela ikpe ahụ, ihe si na ya pụta ka dịkwa. “E kpeela ... ikpe” na-edobe olu nnara-eme na isi echiche ahụ n’enweghị ime ka ọ bụrụ naanị “a mara ya ikpe.”'
theological_decisions:
- issue: Onye a kpọrọ “onye na-achị ụwa a” bụ onye?
  choice: E debere aha nkọwa ahụ n’ahịrịokwu ahụ n’enweghị ịkpọ ya Setan kpọmkwem.
  alternative: “Setan, onye na-achị ụwa a”
  rationale: Ihe ndị ọzọ dị na Jọn 12:31 na 14:30 na-egosi na okwu a nwere ike izo aka na Setan, ma amaokwu a n’onwe ya ji aha nkọwa, ọ bụghị aha “Setan.” Ya mere, isi ederede na-edobe otú Grik si kwuo ya.
- issue: Ike na nghọta nke κέκριται
  choice: “e kpeela ... ikpe”
  alternative: “a mara ... ikpe” ma ọ bụ “ọ nọ n’okpuru ikpe”
  rationale: Nhọrọ a na-edobe ohere okwu κρίνω pụtara, ma na-egosikwa na ikpe ahụ emezuola ma mmetụta ya ka dị. Ọ naghị eme ka okwu ahụ dị warara ruo naanị ikpe ọmụma.
translation_notes:
  register: E ji Igbo Izugbe dị ugbu a, dị mfe nghọta ma nwee ugwu. E kweghị ka izere mmegharị okwu “ikpe ... kpeela ... ikpe” mee ka nkọwa Grik gbanwee; mmegharị ahụ bụkwa usoro Igbo sitere n’okike.
