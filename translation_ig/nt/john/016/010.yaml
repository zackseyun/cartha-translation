  text: περὶ δικαιοσύνης δέ, ὅτι πρὸς τὸν ⸀πατέρα ὑπάγω καὶ οὐκέτι θεωρεῖτέ με·
base_translation:
  language: en
  yaml_path: translation/nt/john/016/010.yaml
  text: and concerning righteousness[a], because I am going to the Father and you no longer see me.
translation:
  language: ig
  text: Banyere ezi omume kwa, n’ihi na ana m alakwuru Nna, unu agaghịkwa ahụ m ọzọ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: περὶ
  choice: banyere
  rationale: “Banyere” na-egosi isiokwu a na-ekwu maka ya ma na-edokwa usoro nkebiokwu ndị a na-emegharị n’amaokwu 9–11.
- source_word: δικαιοσύνης
  choice: ezi omume
  rationale: “Ezi omume” bụ okwu Igbo doro anya maka ọnọdụ ma ọ bụ àgwà nke ihe ziri ezi; ọ dabara n’ebe a na nlọghachi Jizọs n’ebe Nna nọ na-egosi na ọ bụ onye ziri ezi.
- source_word: δέ
  choice: ma
  rationale: N’ebe a, “ma” na-ebuga okwu ahụ n’isiokwu nke ọzọ n’usoro ahụ, n’enweghị ime ka ọ bụrụ nnukwu mmegide.
- source_word: ὅτι
  choice: n’ihi na
  rationale: Ọ na-egosi ihe kpatara okwu ahụ gbasara ezi omume.
- source_word: πρὸς τὸν πατέρα
  choice: alakwuru Nna
  rationale: “Alakwuru” na-egosi ije ruo n’ebe onye nọ; “Nna” na-edobe aha mmekọrịta ahụ n’emeghị ka ọ bụrụ “Nna m,” nke adịghị n’ihe odide Grik.
- source_word: ὑπάγω
  choice: ana m alakwuru
  rationale: Nke a na-egosipụta omume dị nso nke ịla ma na-ada ka Igbo nkịtị n’ọnụ Jizọs.
- source_word: οὐκέτι
  choice: agaghịkwa … ọzọ
  rationale: Njikọ a na-egosi na ịhụ ya ga-akwụsị site n’oge ahụ gaa n’ihu.
- source_word: θεωρεῖτέ
  choice: ahụ
  rationale: N’ọnọdụ a, okwu ahụ pụtara ịhụ Jizọs anya; “ahụ” bụ okwu Igbo dị mfe ma zie ezi.
theological_decisions:
- issue: Ntụgharị δικαιοσύνη n’ebe nwere ibu n’ihe gbasara okwukwe
  choice: ezi omume
  alternative: ikpe ziri ezi
  rationale: “Ezi omume” na-egosi ịdị ma ọ bụ ịbụ onye ziri ezi, nke dabara na nkwado Jizọs a na-ahụ n’ịlakwuru Nna. Ihe odide ala na-edobe “ikpe ziri ezi” iji ghara imechi ohere sara mbara nke okwu Grik ahụ.
translation_notes:
  register: E ji asụsụ Igbo izugbe nke oge a, dị ùgwù ma dị mfe nghọta. Usoro ahịrịokwu ahụ na-edobe njikọ ya na ndepụta dị n’amaokwu ndị gbara ya gburugburu.
