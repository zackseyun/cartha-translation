id: JHN.16.21
reference: John 16:21
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἡ γυνὴ ὅταν τίκτῃ λύπην ἔχει, ὅτι ἦλθεν ἡ ὥρα αὐτῆς· ὅταν δὲ γεννήσῃ τὸ παιδίον, οὐκέτι μνημονεύει τῆς θλίψεως διὰ τὴν χαρὰν ὅτι ἐγεννήθη ἄνθρωπος εἰς τὸν κόσμον.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/021.yaml
  text: When a woman is giving birth[a], she has sorrow because her hour has come; but when she has given birth to the child, she no longer remembers the distress because of the joy that a child has been born into the world.
translation:
  language: ig
  text: Mgbe nwaanyị na-amụ nwa, ọ na-enwe mwute n’ihi na oge ya eruola; ma mgbe ọ mụsịrị nwa ahụ, ọ naghị echeta nhụjuanya ahụ ọzọ n’ihi ọṅụ o nwere na a mụọla mmadụ[a] n’ụwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “a mụọla nwoke n’ụwa.” Okwu Grik ahụ bụ ἄνθρωπος; ọ pụrụ ịpụta “nwoke” ma ọ bụ “mmadụ” n’ozuzu. N’ebe a, ọ naghị egosi kpọmkwem na nwa ahụ bụ nwoke.
    reason: lexical_alternative
lexical_decisions:
- source_word: γυνή
  choice: nwaanyị
  rationale: N’ihe atụ a gbasara ịmụ nwa, ọ pụtara nwaanyị n’ozuzu, ọ bụghị kpọmkwem nwunye.
- source_word: ὅταν τίκτῃ
  choice: mgbe nwaanyị na-amụ nwa
  rationale: Ụdị ngwaa dị ugbu a na-egosi usoro ịmụ nwa ka ọ na-aga n’ihu.
- source_word: λύπην ἔχει
  choice: ọ na-enwe mwute
  rationale: λύπη gụnyere mwute na nchekasị, ọ bụghị naanị ihe mgbu nke ahụ; nke a kwekọrọ na mwute nke ga-aghọ ọṅụ n’okwu gbara ya gburugburu.
- source_word: ἡ ὥρα αὐτῆς
  choice: oge awa ya
  rationale: A hapụrụ echiche ‘awa’ nke ὥρα iji chekwaa ụda pụrụ iche okwu a na-enwe n’Oziọma Jọn, ebe ọ ka na-ezo aka n’oge ịmụ nwa bịarutere.
- source_word: γεννήσῃ τὸ παιδίον
  choice: mgbe ọ mụsịrị nwa ahụ
  rationale: Ụdị ngwaa a na-ele ịmụ nwa anya dị ka ihe e mechara; ‘mụsịrị’ na-egosi mmezu ahụ n’Igbo eke.
- source_word: οὐκέτι μνημονεύει
  choice: ọ naghị echeta ... ọzọ
  rationale: Nke a bụ ntụgharị doro anya ma bụrụkwa okwu Igbo a na-asụkarị maka ịkwụsị icheta ihe.
- source_word: τῆς θλίψεως
  choice: ahụhụ ahụ
  rationale: N’ọnọdụ ịmụ nwa, θλῖψις bụ oke ahụhụ na nsogbu nke oge ahụ; ‘ahụhụ’ na-ezere itinye nkọwa amụma banyere mkpagbu.
- source_word: διὰ τὴν χαράν
  choice: n’ihi ọṅụ o nwere
  rationale: διά na accusative na-egosi ihe kpatara ya; mgbakwunye ‘o nwere’ na-eme ka Igbo doo anya n’enweghị mgbanwe ihe okwu ahụ pụtara.
- source_word: ὅτι ἐγεννήθη
  choice: na a mụọla
  rationale: Nke a na-egosi ihe mere o ji ṅụrịa ọṅụ ma na-echekwa echiche na ọmụmụ ahụ emechaala.
- source_word: ἄνθρωπος
  choice: mmadụ
  rationale: ἄνθρωπος bụ mmadụ n’ozuzu ebe a, ọ bụghị nwoke kpọmkwem; ‘mmadụ’ na-echekwa ma okwu a gbasara mmadụ ma obosara ya.
- source_word: εἰς τὸν κόσμον
  choice: n’ụwa
  rationale: N’Igbo eke, ‘a mụọla mmadụ n’ụwa’ na-egosi na mmadụ abatala n’ụwa, nke kwekọrọ na ihe εἰς τὸν κόσμον pụtara ebe a.
theological_decisions:
- issue: Ịsụgharị ἄνθρωπος nke e ji mee okwu gbasara mmadụ n’ozuzu
  choice: mmadụ
  alternative: nwoke; nwa
  rationale: Ọ bụ ezie na aha Grik ahụ bụ nke ụdị nwoke n’usoro asụsụ, ebe a ọ na-ekwu maka ndụ mmadụ ọhụrụ, ọ bụghị nwa nwoke kpọmkwem. ‘Mmadụ’ na-echekwa njupụta okwu ahụ; e nyere ‘nwoke’ dị ka ụzọ ọzọ n’ala peeji n’ihi obosara okwu Grik ahụ.
translation_notes:
  register: Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. E ji ‘oge awa ya’ chekwaa ụda Jọn n’agbanyeghị na ‘oge ya’ ga-adị ntakịrị mfe karịa; e ji ‘mmadụ’ chekwaa okwu ἄνθρωπος n’ozuzu.
