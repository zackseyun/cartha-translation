- from: Mgbe nwaanyị na-amụ nwa, ọ na-enwe mwute n’ihi na oge awa ya eruola; ma mgbe ọ mụsịrị nwa ahụ, ọ naghị echeta ahụhụ ahụ ọzọ n’ihi ọṅụ o nwere na a mụọla mmadụ[a] n’ụwa.
  to: Mgbe nwaanyị na-amụ nwa, ọ na-enwe mwute n’ihi na oge ya eruola; ma mgbe ọ mụsịrị nwa ahụ, ọ naghị echeta nhụjuanya ahụ ọzọ n’ihi ọṅụ o nwere na a mụọla mmadụ[a] n’ụwa.
  rationale: The revision replaces the unnatural calque ‘oge awa ya’ with the idiomatic ‘oge ya’ and refines ‘ahụhụ’ to ‘nhụjuanya’ for the childbirth distress denoted by θλῖψις. It preserves the source’s generic ἄνθρωπος as ‘mmadụ,’ retains the footnote anchor at that word, and does not resolve the lexical alternative as though it required a male child.
