  text: Μικρὸν καὶ ⸀οὐκέτι θεωρεῖτέ με, καὶ πάλιν μικρὸν καὶ ὄψεσθέ ⸀με.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/016.yaml
  text: A little while[a], and you no longer see me; and again a little while, and you will see me.
translation:
  language: ig
  text: “Obere oge, unu agaghị ahụ m ọzọ; ma obere oge ọzọ, unu ga-ahụ m.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'N’asụsụ Grik, e ji ngwaa abụọ dị iche iche pụtara ‘ịhụ’ mee ihe n’ebe a: θεωρέω n’akụkụ nke mbụ na ὁράω n’akụkụ nke abụọ. Ọdịiche ahụ nwere ike inwe obere nghọta pụrụ iche, ma a sụgharịrị ha abụọ ‘hụ’ n’ihi na isi ọdịiche dị n’amaokwu a bụ nke oge.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μικρὸν
  choice: Nwa oge nta
  rationale: A na-eji okwu a eme ihe n’ụzọ na-egosi obere oge. ‘Nwa oge nta’ bụ okwu Igbo doro anya nke na-echekwa mkpụmkpụ oge ahụ n’enweghị ịkọwa ya gabiga ókè.
- source_word: οὐκέτι
  choice: agaghịzi
  rationale: N’ebe a, ọ na-egosi na ọnọdụ ahụ agaghị aga n’ihu ọzọ; ‘agaghịzi’ na-ejikọta echiche ahụ nke ọma na ngwaa ọdịnihu dị n’Igbo.
- source_word: θεωρεῖτέ
  choice: ahụ
  rationale: Ọ bụ ezie na θεωρέω pụrụ ịpụta ilekwasị anya ma ọ bụ ikiri, ‘ahụ’ bụ okwu Igbo nkịtị ma kwekọọ n’ọnọdụ a.
- source_word: πάλιν
  choice: ọzọkwa
  rationale: ‘Ọzọkwa’ na-echekwa echiche nke mgbanwe na nlọghachi n’usoro oge, ma na-edebekwa njikọ ahịrịokwu Grik.
- source_word: ὄψεσθέ
  choice: ga-ahụ
  rationale: Ọdịnihu nke ὁράω n’ebe a pụtara ịhụ n’oge na-abịa. Iji ‘hụ’ maka ngwaa abụọ ahụ na-echekwa ndakọrịta ha n’enweghị ịmanye ọdịiche nke ederede ekwughị hoo haa.
- source_word: με
  choice: m
  rationale: Nnọchiaha a bụ ihe ngwaa na-emetụta ma na-ezo aka na Jizọs; ‘m’ bụ ntụgharị Igbo ziri ezi.
- source_word: καὶ
  choice: ; / ọzọkwa
  rationale: Καὶ ndị a na-ahazi okwu ahụ dịka akụkụ abụọ yiri ibe ha. Akara nkewa na ‘ọzọkwa’ na-enye usoro na ụda okwu ahụ n’Igbo n'ụzọ eke.
theological_decisions:
- issue: Ma a ga-eji okwu Igbo abụọ dị iche iche kọwaa θεωρέω na ὁράω iji gosi ụzọ ịhụ ihe dị iche iche
  choice: Jiri ‘hụ’ maka ha abụọ n’isi ederede
  alternative: ‘unu agaghịzi ekiri m ... unu ga-ahụ m’ ma ọ bụ ‘unu agaghịzi ahụ m ... unu ga-ele m anya’
  rationale: 'Ngwaa Grik abụọ ahụ nwere ike inwe ọdịiche nta, ma ihe ha pụtara na-adịkarị nso n’akwụkwọ Jọn. Iji okwu Igbo dị iche iche nwere ike ịmepụta nkọwa nkà mmụta okpukpe karịrị ihe amaokwu ahụ kwuru. Isi ọdịiche a na-ahụ anya bụ nke oge: obere oge, ahụghị ya; obere oge ọzọ, ahụ ya.'
translation_notes:
  register: Asụsụ Igbo zuru ọkọlọtọ, dị ugbu a ma dị ùgwù. Ahịrịokwu ahụ na-echekwa nhazi akụkụ abụọ na nlọghachi nke ‘nwa oge nta’; e zere okwu ochie ma ọ bụ nkọwa nke otu ụka pụrụ iche.
