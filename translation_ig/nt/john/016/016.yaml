revisions:
- from: “Nwa oge nta, unu agaghịzi ahụ m; ọzọkwa, nwa oge nta, unu ga-ahụ m.”[a]
  to: “Obere oge, unu agaghị ahụ m ọzọ; ma obere oge ọzọ, unu ga-ahụ m.”[a]
  rationale: The revision replaces an unnatural, redundant time expression with idiomatic Standard Igbo and makes the second temporal clause more directly reflect πάλιν (‘again’). It retains the source’s compact parallelism, both occurrences of ‘see,’ and the interpretively restrained footnote.
