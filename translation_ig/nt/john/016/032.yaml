id: JHN.16.32
reference: John 16:32
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἰδοὺ ἔρχεται ὥρα ⸀καὶ ἐλήλυθεν ἵνα σκορπισθῆτε ἕκαστος εἰς τὰ ἴδια κἀμὲ μόνον ἀφῆτε· καὶ οὐκ εἰμὶ μόνος, ὅτι ὁ πατὴρ μετ’ ἐμοῦ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/032.yaml
  text: Behold[a], an hour is coming, and has come, when you will be scattered, each to his own, and will leave me alone. Yet I am not alone, because the Father is with me.
translation:
  language: ig
  text: Lee, oge na-abịa, ọ bịarukwaala, mgbe a ga-achụsasị unu, onye ọ bụla alaa nke ya[a], unu ahapụkwa m naanị m. Ma anọghị m naanị m, n’ihi na Nna nọnyere m.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “onye ọ bụla alaa n’ụlọ ya,” “n’ebe nke ya,” ma ọ bụ “n’ihe ndị nke ya.” Okwu Grik ahụ sara mbara karịa otu ebe kpọmkwem; ọ pụkwara izo aka n’ụlọ, ebe, ihe, ma ọ bụ ọnọdụ nke onye ọ bụla.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: Lee
  rationale: Na-adọta uche ndị na-ege ntị ma na-edobe ịdị arọ nke ọkwa Jizọs n’Igbo dị ugbu a.
- source_word: ἔρχεται ὥρα καὶ ἐλήλυθεν
  choice: oge na-abịa, ọ bịarukwaala
  rationale: Na-echekwa esemokwu dị n’etiti ihe na-abịanụ na ihe bịarurula nke dị na present na perfect Grik; “oge” ebe a bụ oge dị mkpa, ọ bụghị naanị otu awa.
- source_word: ἵνα
  choice: mgbe
  rationale: N’usoro okwu a, ọ na-ewebata ihe ga-eme n’oge ahụ; “mgbe” bụ Igbo sitere n’okike nke na-edobe echiche oge ahụ.
- source_word: σκορπισθῆτε
  choice: a ga-achụsasị unu
  rationale: Na-echekwa olu nnabata nke ngwaa Grik na echiche na a ga-eme ka ndị na-eso ụzọ gbasaa n’ebe dị iche iche.
- source_word: ἕκαστος εἰς τὰ ἴδια
  choice: onye ọ bụla alaa n’ihe nke ya
  rationale: “Ihe nke ya” na-ahapụ τὰ ἴδια ka ọ gbasaa karịa naanị ụlọ ma ọ bụ ebe, ebe “alaa” na-egosi mmegharị ahụ a chọrọ n’ahịrịokwu ahụ.
- source_word: κἀμὲ μόνον ἀφῆτε
  choice: unu ahapụkwa m naanị m
  rationale: Na-egosi na ha ga-ahapụ Jizọs, na-enweghị ime ka okwu ahụ sie ike karịa isi Grik site n’ịsị na ha jụrụ ya kpamkpam.
- source_word: καὶ οὐκ εἰμὶ μόνος
  choice: Ma anọghị m naanị m
  rationale: “Ma” na-eme ka ọdịiche dị n’etiti ndị na-eso ụzọ ịhapụ ya na ọnụnọ Nna pụta ìhè.
- source_word: ὅτι ὁ πατὴρ μετ’ ἐμοῦ ἐστιν
  choice: n’ihi na Nna mụ na ya nọ
  rationale: Na-enye ihe kpatara Jizọs ji sị na ọ nọghị naanị ya, ma na-edobe aha mmekọrịta ahụ bụ “Nna.”
theological_decisions:
- issue: Ogologo ihe ἕκαστος εἰς τὰ ἴδια pụtara
  choice: onye ọ bụla alaa n’ihe nke ya
  alternative: onye ọ bụla alaa n’ụlọ ya / n’ebe nke ya
  rationale: A naghị ekpebi na τὰ ἴδια bụ naanị ụlọ; ntụgharị ahụ na-edobe obosara na mgbagwoju anya nke okwu Grik.
- issue: Mmekọrịta dị n’etiti ndị na-eso ụzọ ịhapụ Jizọs na ọnụnọ Nna
  choice: Ma anọghị m naanị m, n’ihi na Nna mụ na ya nọ
  alternative: Anọghịkwa m naanị m, n’ihi na Nna mụ na ya nọ
  rationale: 'Na-edobe esemokwu nkà mmụta okpukpe dị n’amaokwu ahụ: ndị na-eso ụzọ ga-ahapụ Jizọs, ma ọnụnọ Nna pụtara na ọ bụghị naanị ya kpamkpam; a naghị etinye nkwubi okwu ọzọ na-adịghị n’amaokwu ahụ.'
translation_notes:
  register: Standard Igbo dị ugbu a, nke ugwu ya kwesịrị okwu Jizọs ma dịkwa mfe nghọta nye ndị nkịtị. E jiri “Lee” mee ihe dị ka akara ịdọta uche, ma zere okwu ochie ma ọ bụ asụsụ otu ụka pụrụ iche.
