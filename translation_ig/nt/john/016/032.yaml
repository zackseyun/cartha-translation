review_pass:
  verdict: revise
  source_fidelity: The draft preserves the verse’s temporal tension, dispersal of the disciples, distributive force, and contrast between their departure and the Father’s presence. However, the final clause does not correctly express μετ’ ἐμοῦ ('with me').
  naturalness: Most of the rendering is clear, modern Standard Igbo. The expression “Nna mụ na ya nọ” is not a natural or grammatically sound way to say that the Father is with Jesus.
  terminology: “Nna” appropriately retains the relational divine title. “Lee” and “naanị m” fit the solemn but accessible register.
  issues:
  - severity: high
    issue: The clause “n’ihi na Nna mụ na ya nọ” is malformed and reverses/obscures the intended relationship.
    rationale: Greek ὁ πατὴρ μετ’ ἐμοῦ ἐστιν means “the Father is with me.” Standard Igbo naturally expresses this as “Nna nọnyere m.” The draft wording cannot reliably communicate that meaning.
  - severity: low
    issue: “n’ihe nke ya” narrows τὰ ἴδια toward things or affairs.
    rationale: The Greek remains broad, potentially including one’s own place, home, possessions, or sphere. “nke ya” better preserves this compact ambiguity; the footnote can retain the explicit alternatives.
  revised_text: Lee, oge na-abịa, ọ bịarukwaala, mgbe a ga-achụsasị unu, onye ọ bụla alaa nke ya[a], unu ahapụkwa m naanị m. Ma anọghị m naanị m, n’ihi na Nna nọnyere m.
  revised_footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “onye ọ bụla alaa n’ụlọ ya,” “n’ebe nke ya,” ma ọ bụ “n’ihe ndị nke ya.” Okwu Grik ahụ sara mbara karịa otu ebe kpọmkwem; ọ pụkwara izo aka n’ụlọ, ebe, ihe, ma ọ bụ ọnọdụ nke onye ọ bụla.
    reason: lexical_alternative
  revision_rationale: The final clause is corrected to “Nna nọnyere m,” the natural Standard Igbo equivalent of “the Father is with me.” “alaa nke ya” replaces “alaa n’ihe nke ya” to avoid making the Greek expression refer specifically to possessions or affairs, while the footnote preserves its lexical range.
