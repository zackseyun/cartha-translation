  to: Lee, oge na-abịa, ọ bịarukwaala, mgbe a ga-achụsasị unu, onye ọ bụla alaa nke ya[a], unu ahapụkwa m naanị m. Ma anọghị m naanị m, n’ihi na Nna nọnyere m.
