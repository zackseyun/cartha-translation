- from: Ma ugbu a, ana m alakwuru onye zitere m, ma ọ dịghị onye n’ime unu na-ajụ m, “Olee ebe ị na-aga?”
  to: Ma ugbu a, ana m agakwuru onye zitere m, ọ dịghịkwa onye n’ime unu na-ajụ m, “Olee ebe ị na-aga?”
  rationale: The revision corrects the progressive motion expression to idiomatic Standard Igbo and removes the extra contrast introduced before the negative clause. It otherwise retains the draft’s faithful, natural choices and preserves the source’s generic wording for the sender.
