id: JHN.16.5
reference: John 16:5
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: νῦν δὲ ὑπάγω πρὸς τὸν πέμψαντά με καὶ οὐδεὶς ἐξ ὑμῶν ἐρωτᾷ με· Ποῦ ὑπάγεις;
base_translation:
  language: en
  yaml_path: translation/nt/john/016/005.yaml
  text: But now I am going to the one who sent me, and none of you asks me, ‘Where are you going?’
translation:
  language: ig
  text: Ma ugbu a, ana m agakwuru onye zitere m, ọ dịghịkwa onye n’ime unu na-ajụ m, “Olee ebe ị na-aga?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νῦν δὲ
  choice: Ma ugbu a
  rationale: Nke a na-edobe ntụgharị okwu na ọdịiche δέ na-egosi, ma na-ada nke ọma n’Igbo ugbu a.
- source_word: ὑπάγω
  choice: ana m alakwuru
  rationale: N’ebe a, okwu ahụ na-egosi ịga n’ebe mmadụ nọ. ‘Ana m alakwuru’ na-egosipụta ma omume na-aga ime ugbu a ma ebe Jizọs na-aga, n’enweghị ịkọwa ya naanị dị ka ịpụ.
- source_word: πρὸς τὸν πέμψαντά με
  choice: onye zitere m
  rationale: Nke a na-asụgharị articular participle ahụ n’ụzọ Igbo doro anya, na-agbakwụnyeghị ‘Nna’ nke na-adịghị n’ahịrịokwu Grik a.
- source_word: πέμψαντά
  choice: zitere
  rationale: ‘Zitere’ bụ okwu Igbo kwụ ọtọ maka πέμπω ma na-echekwa echiche iziga mmadụ n’ozi nke pụtara ìhè n’Oziọma Jọn.
- source_word: οὐδεὶς ἐξ ὑμῶν
  choice: ọ dịghị onye n’ime unu
  rationale: Nke a na-echekwa nkwụsi ike nke ngọnarị ahụ na echiche nke onye ọ bụla sitere n’etiti ndị a na-agwa okwu.
- source_word: ἐρωτᾷ με
  choice: na-ajụ m
  rationale: N’ọnọdụ a, ἐρωτάω pụtara ịjụ ajụjụ; okwu a bụ nke nkịtị ma doo anya n’Igbo.
- source_word: Ποῦ ὑπάγεις;
  choice: Olee ebe ị na-aga?
  rationale: Nke a bụ ụzọ Igbo nkịtị si ajụ ebe mmadụ na-aga, ma ọ na-echekwa echiche mmegharị dị na ὑπάγω.
theological_decisions:
- issue: Onye okwu ahụ bụ ‘onye zitere m’ na-ezo aka na ya
  choice: E dere ya dịka ‘onye zitere m’ n’akpọghị ya ‘Nna.’
  alternative: ‘Nna nke zitere m’
  rationale: Ọ bụ ezie na ihe gbara okwu ahụ gburugburu n’Oziọma Jọn na-eme ka onye ahụ doo anya, Grik n’amaokwu a ekwughị ‘Nna’ kpọmkwem. Nsụgharị ahụ na-edobe ihe e dere n’isi mmalite kama ịgbakwunye nkọwa nkà mmụta okpukpe n’ahịrịokwu ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. A họọrọ ‘alakwuru’ n’ahịrịokwu mbụ iji gosipụta na ọ na-aga n’ebe onye zitere ya nọ, ebe ‘na-aga’ n’ajụjụ ahụ bụ ụzọ okwu kacha eke n’Igbo.
