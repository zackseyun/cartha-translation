id: JHN.16.29
reference: John 16:29
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸀Λέγουσιν οἱ μαθηταὶ αὐτοῦ· Ἴδε νῦν ⸀ἐν παρρησίᾳ λαλεῖς, καὶ παροιμίαν οὐδεμίαν λέγεις.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/029.yaml
  text: His disciples said[a], “Look[b], now you are speaking openly and are not speaking in any figure of speech.”
translation:
  language: ig
  text: Ndị na-eso ụzọ ya kwuru, “Lee, ugbu a ị na-ekwu okwu n’ụzọ doro anya[a], ị naghịkwa ekwu ilu ọ bụla[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “n’ụzọ ghe oghe” ma ọ bụ “n’ezoghị ọnụ.” Okwu Grik ahụ pụrụ ịpụta ikwu okwu n’ụzọ doro anya, ghe oghe, ma ọ bụ n’atụghị egwu.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, “okwu ihe atụ,” “akụkọ ihe atụ,” ma ọ bụ “okwu ezoro ezo.” N’ebe a, ọ na-ezo aka n’okwu a na-ekwughị kpọmkwem.
    reason: lexical_alternative
lexical_decisions:
- source_word: Λέγουσιν
  choice: kwuru
  rationale: A sụgharịrị historical present Grik dị ka oge gara aga iji mee ka akụkọ ahụ daa nke ọma n’Igbo ugbu a.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: Ndị na-eso ụzọ ya
  rationale: Nke a bụ ụzọ Igbo nkịtị si akọwa ndị bụ ndị na-amụ n’aka ya ma na-eso ya.
- source_word: Ἴδε
  choice: Lee
  rationale: Ọ bụ okwu e ji adọta uche; “Lee” bụ okwu Igbo doro anya ma kwesịkwa ekwesị n’ebe a.
- source_word: νῦν
  choice: ugbu a
  rationale: Ọ na-egosi na ndị na-eso ụzọ ahụ chere na ụzọ Jizọs si ekwu okwu agbanweela n’oge ahụ.
- source_word: ἐν παρρησίᾳ
  choice: n’ụzọ doro anya
  rationale: N’ọnọdụ a, okwu ahụ na-emegide okwu ilu ma ọ bụ okwu ezoro ezo; ya mere ọ pụtara ikwu okwu n’ụzọ ghe oghe ma doo anya.
- source_word: λαλεῖς
  choice: ị na-ekwu okwu
  rationale: Ụdị oge ugbu a na-egosi ihe Jizọs na-eme kpọmkwem mgbe ndị na-eso ụzọ ya kwuru nke a.
- source_word: παροιμίαν
  choice: ilu
  rationale: “Ilu” bụ okwu Igbo dị ndụ nke pụrụ ịgụnye okwu ihe atụ ma ọ bụ okwu a na-ekwughị kpọmkwem, ma nkọwa ala peeji na-echekwa obosara ihe okwu Grik ahụ pụrụ ịpụta.
- source_word: οὐδεμίαν
  choice: ọ bụla
  rationale: Mgbe e jikọtara ya na njụ “ị naghị,” ọ na-egosipụta njụ zuru ezu nke okwu Grik ahụ.
- source_word: λέγεις
  choice: ị naghịkwa ekwu okwu
  rationale: A nọgidere na-eji ngwaa “ikwu” mee ka ahịrịokwu ahụ dị nso na Grik, n’agbanyeghị na Igbo nwekwara ike ịsị “iji ilu.”
theological_decisions:
- issue: Ihe ἐν παρρησίᾳ pụtara mgbe e jiri ya tụnyere παροιμία
  choice: Ndị na-eso ụzọ na-ekwu na Jizọs na-ekwu okwu n’ụzọ doro anya, ọ bụghị n’okwu ihe atụ ma ọ bụ okwu ezoro ezo.
  alternative: Ọ na-ekwu okwu n’atụghị egwu ma ọ bụ n’ezoghị ọnụ.
  rationale: Ihe e ji tụnyere ya ozugbo bụ παροιμίαν οὐδεμίαν; nke a na-akwado nghọta nke okwu doro anya karịa isi echiche nke obi ike. Nkọwa ala peeji na-echekwa nkọwa ọzọ okwu ahụ pụrụ inwe.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “Ndị na-eso ụzọ” na “Lee” bụ okwu ndị mmadụ na-aghọta ngwa ngwa; “ilu” na-eme ka ahịrịokwu ahụ bụrụ nke Igbo n’ezie, ebe nkọwa ala peeji na-echekwa obosara na mgbagwoju anya nke παροιμία.
