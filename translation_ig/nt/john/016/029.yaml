  terminology: “Ndị na-eso ụzọ ya,” “Lee,” “n’ụzọ doro anya,” and “ilu” are appropriate. The footnotes responsibly retain the semantic breadth of παρρησία and παροιμία without forcing a doctrinal interpretation.
