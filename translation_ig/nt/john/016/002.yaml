revisions:
- from: Ha ga-achụpụ unu n’ụlọ nzukọ ndị Juu[a]. N’ezie, oge na-abịa mgbe onye ọ bụla gburu unu ga-eche na ọ na-ejere Chineke ozi[b].
  to: Ha ga-achụpụ unu n’ụlọ nzukọ ndị Juu[a]. Ma oge na-abịa mgbe onye ọ bụla gburu unu ga-eche na ọ na-ejere Chineke ozi[b].
  rationale: The revision changes the connective to preserve the adversative force of ἀλλά and replaces footnote alternatives that either broaden the meaning beyond expulsion from synagogue community or are less idiomatic. It retains the draft’s faithful rendering of exclusion, the coming time, the generic singular perpetrator, and the irony of supposed service to God.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T06:26:43Z'
review_pass:
  verdict: revise
  source_fidelity: The main clause accurately conveys the causative exclusion expressed by ἀποσυναγώγους ποιήσουσιν ὑμᾶς, and the latter clause preserves the persecutors’ mistaken belief that killing the disciples is religious service rendered to God. However, ἀλλά is more explicitly adversative/escalatory than “N’ezie” alone normally conveys in this context.
  naturalness: The text is clear Standard Igbo and maintains an appropriate biblical register. “Ma” gives a more natural and explicit transition here. The second existing alternative in footnote a is both awkward and broader than the lexical sense of expulsion/exclusion.
  terminology: “ụlọ nzukọ ndị Juu” is an understandable rendering of “synagogues,” and “ijere Chineke ozi” suitably renders the cultic sense of λατρεία without implying divine approval of the killing. The revised footnote alternatives keep within the semantic range of synagogue exclusion and religious service.
  issues:
  - severity: low
    issue: The transition “N’ezie” does not explicitly express ἀλλά.
    rationale: 'While it can add emphasis, “Ma” more directly preserves the Greek’s contrast and escalation: exclusion will occur, but an even more severe time is coming.'
  - severity: medium
    issue: Footnote a’s second alternative is not a close lexical alternative and is awkwardly phrased.
    rationale: “Ha ga-egbochi unu iso ndị ụlọ nzukọ ndị Juu na-emekọrịta ihe” describes preventing association rather than being expelled or excluded from synagogues. It should be replaced by a direct exclusion alternative.
  - severity: low
    issue: Footnote b’s second alternative is less idiomatic and imprecise.
    rationale: “ọ na-enye Chineke ọrụ okpukpe” is understandable but not the most natural way to express cultic service in Standard Igbo. “ọ na-arụ Chineke ọrụ nsọ” is clearer while retaining the religious-service sense.
  revised_text: Ha ga-achụpụ unu n’ụlọ nzukọ ndị Juu[a]. Ma oge na-abịa mgbe onye ọ bụla gburu unu ga-eche na ọ na-ejere Chineke ozi[b].
  revised_footnotes:
