id: JHN.16.2
reference: John 16:2
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀποσυναγώγους ποιήσουσιν ὑμᾶς· ἀλλ’ ἔρχεται ὥρα ἵνα πᾶς ὁ ἀποκτείνας ὑμᾶς δόξῃ λατρείαν προσφέρειν τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/002.yaml
  text: They will make you outcasts from the synagogues[a]; indeed[b], an hour is coming when everyone who kills you will think he is offering service to God.
translation:
  language: ig
  text: Ha ga-achụpụ unu n’ụlọ nzukọ ndị Juu[a]. Ma oge na-abịa mgbe onye ọ bụla gburu unu ga-eche na ọ na-ejere Chineke ozi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Ha ga-ewepụ unu n’ụlọ nzukọ ndị Juu,” ma ọ bụ, “Ha ga-achụ unu n’ụlọ nzukọ ndị Juu.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ọ na-efe Chineke ofufe,” ma ọ bụ, “ọ na-arụ Chineke ọrụ nsọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποσυναγώγους ποιήσουσιν ὑμᾶς
  choice: Ha ga-achụpụ unu n’ụlọ nzukọ ndị Juu
  rationale: Nkebiokwu a pụtara ime ka ndị a na-agwa okwu bụrụ ndị a chụpụrụ ma ọ bụ ndị a kewapụrụ n’obodo ofufe ndị Juu. “Ịchụpụ ... n’ụlọ nzukọ” bụ okwu Igbo doro anya ma dị ndụ, na-egosikwa omume ahụ kpatara ọnọdụ nkewapụ ahụ.
- source_word: ἀλλ’
  choice: N’ezie
  rationale: N’ebe a, okwu ahụ na-eme ka mkpagbu a kọwara bawanye njọ, ọ bụghị naanị igosi mmegide dị mfe. “N’ezie” na-eweta nkwusi ike ahụ n’Igbo nkịtị.
- source_word: ἔρχεται ὥρα
  choice: oge na-abịa
  rationale: Ọ bụ ezie na ὥρα nwere ike ịbụ “awa,” n’ebe a ọ na-ezo aka n’oge ihe ga-eme. “Oge na-abịa” bụ Igbo eke ma na-edobe echiche nke oge dị n’ihu.
- source_word: ἵνα
  choice: mgbe
  rationale: Mgbe okwu banyere oge na-abịa gasịrị, ἵνα na-akọwa ihe ga-eji mara oge ahụ. “Mgbe” na-enye njikọ oge ahụ n’ụzọ Igbo dị mfe nghọta.
- source_word: πᾶς ὁ ἀποκτείνας ὑμᾶς
  choice: onye ọ bụla gburu unu
  rationale: Nke a na-edobe ike zuru ụwa ọnụ nke πᾶς ma na-asụgharị participle ahụ dịka onye na-eme omume ahụ. Igbo anaghị achọ ka e tinye nnọchiaha nwoke ebe a.
- source_word: δόξῃ
  choice: ga-eche
  rationale: Okwu ahụ na-egosi echiche ma ọ bụ nkwenye dị n’uche onye ahụ, ọ bụghị eziokwu. “Ga-eche” bụ ụzọ Igbo nkịtị si kwuo nke a.
- source_word: λατρείαν προσφέρειν τῷ θεῷ
  choice: ọ na-ejere Chineke ozi
  rationale: Nkebiokwu a na-egosi ọrụ okpukpe a na-enye Chineke. “Ijere Chineke ozi” bụ okwu Igbo eke nke na-edobe echiche nke ọrụ nsọ, ebe nkọwa ala peeji na-egosi nhọrọ nke “ofufe.”
theological_decisions:
- issue: Echiche ndị na-akpagbu na ha na-eme Chineke ọrụ nsọ
  choice: ọ na-ejere Chineke ozi
  alternative: ọ na-efe Chineke ofufe; ọ na-enye Chineke ọrụ okpukpe
  rationale: 'Nsụgharị ahụ na-edobe ihe ịtụnanya na mwute dị n’okwu ahụ: ndị na-egbu ndị na-eso ụzọ ga-ewere igbu mmadụ dịka ọrụ e nyere Chineke. Ọ naghị egosi na Chineke kwadoro omume ha.'
- issue: Okike nwoke na πᾶς ὁ ἀποκτείνας
  choice: onye ọ bụla ... ọ
  alternative: nwoke ọ bụla ... ya
  rationale: Ụdị nwoke otu n’asụsụ Grik nwere ọrụ nnọchiteanya n’ebe a. Igbo “onye ọ bụla ... ọ” na-edobe otu onye na mkpokọta mmadụ niile n’enweghị ịgbakwunye na ọ bụ naanị ụmụ nwoke ka okwu ahụ gbasara.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị mfe nghọta ma nwee ugwu. “Ụlọ nzukọ ndị Juu” na-eme ka ihe synagogue pụtara doo onye Igbo nkịtị anya; e zere okwu agbaziri nke nwere ike ghara ịghọta. E debere ọtụtụ “unu” dị n’asụsụ isi mmalite.
