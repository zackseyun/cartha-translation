  yaml_path: translation/nt/john/016/003.yaml
  text: And they will do these things because they have not known the Father or me[a].
translation:
  language: ig
  text: Ha ga-eme ihe ndị a n’ihi na ha amaghị Nna ahụ ma ọ bụ m.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “ha amataghị Nna ahụ ma ọ bụ m,” ma ọ bụ, “ha abatabeghị ịmara Nna ahụ ma ọ bụ m.” Ngwaa Grik ahụ nwere ike ịpụta n’ụzọ ndị a dabere n’otú e si aghọta oge ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Ha ga-emekwa
  rationale: E tinyere njikọ ahụ n’ụdị mgbakwunye “-kwa” n’ime ngwaa, nke na-ejikọta okwu a n’ihe ndị bu ya ụzọ n’ụzọ Igbo si ada nke ọma.
- source_word: ταῦτα
  choice: ihe ndị a
  rationale: Nke a na-echekwa ọtụtụ ihe demonstrative ahụ ma na-atụ aka n’omume mmegide ndị a kpọtụrụ aha tupu amaokwu a.
- source_word: ποιήσουσιν
  choice: ga-eme
  rationale: Ọdịnihu “ga-eme” bụ ntụgharị Igbo doro anya nke future active indicative ma kwekọọ na “ihe ndị a.”
- source_word: ὅτι
  choice: n’ihi na
  rationale: Njikọ a na-egosi ihe kpatara ha ga-eji mee omume ndị ahụ.
- source_word: οὐκ ἔγνωσαν
  choice: ha amaghị
  rationale: “Amaghị” bụ ụzọ Igbo nkịtị si ekwu na ha enwebeghị, ma ọ bụ na ha abatabeghị, n’ọmụma mmekọrịta a; ọ naghị amanye nkọwa oge Grik ahụ karịa ka ọnọdụ okwu chọrọ.
- source_word: τὸν πατέρα
  choice: Nna m
  rationale: N’ọnọdụ Jọn a, “Nna” bụ aha nsọpụrụ nke Chineke. E tinyere “m” dị ka njikọ nwe mmadụ nke Igbo chọrọ iji mee ka aha ahụ bụrụ ihe eke ma gosipụta mmekọrịta Nna ahụ na Jizọs.
- source_word: οὐδὲ ἐμέ
  choice: ma ọ bụ mụ onwe m
  rationale: “Ma ọ bụ” na-arụ ọrụ nke οὐδέ n’okpuru nkwupụta njụ; “mụ onwe m” na-enye ἐμέ ike e mesiri ike n’Igbo.
theological_decisions:
- issue: Asụsụ Jọn banyere ịmara Chineke na Jizọs
  choice: ha amaghị Nna m ma ọ bụ mụ onwe m
  alternative: ha abịaghị mara Nna m ma ọ bụ mụ onwe m
  rationale: Nhọrọ ahụ na-echekwa nkwupụta na mkpagbu ha sitere n’amaghị Nna na Jizọs, ma ọ naghị akọwa “ịmara” dị ka nanị ịnụ banyere ha. Ihe ọzọ nwere ike ime ka akụkụ mmalite nke γινώσκω pụta ìhè, ma nke a ahọrọla dị nkenke ma dị eke.
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe nke oge a, dị mfe ma nwee ugwu. E ji “-kwa” mee njikọ nke καὶ n’ụzọ eke. Akara ndetu [a] dị n’ederede isi. “Nna” nwere mkpụrụedemede ukwu n’ihi na ọ bụ aha nsọpụrụ Chineke n’ọnọdụ a.
