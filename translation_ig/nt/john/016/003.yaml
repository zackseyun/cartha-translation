    text: A pụkwara ịsụ ya, “ha amataghị Nna ahụ ma ọ bụ m,” ma ọ bụ, “ha abatabeghị ịmara Nna ahụ ma ọ bụ m.” Ngwaa Grik ahụ nwere ike ịpụta n’ụzọ ndị a dabere n’otú e si aghọta oge ya.
    reason: lexical_alternative
  revision_rationale: The revision removes the unsupported possessive “m” from “Nna m” and the added reflexive force of “onwe m.” It preserves the source’s future action, causal clause, plural “these things,” and the relational-knowledge sense of γινώσκω. The footnote is correspondingly corrected and offers alternatives that reflect the aorist’s possible rendering without imposing a disputed nuance.
