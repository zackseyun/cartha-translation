- from: Ha ga-emekwa ihe ndị a n’ihi na ha amaghị Nna m ma ọ bụ mụ onwe m.[a]
  to: Ha ga-eme ihe ndị a n’ihi na ha amaghị Nna ahụ ma ọ bụ m.[a]
  rationale: The revision removes the unsupported possessive “m” from “Nna m” and the added reflexive force of “onwe m.” It preserves the source’s future action, causal clause, plural “these things,” and the relational-knowledge sense of γινώσκω. The footnote is correspondingly corrected and offers alternatives that reflect the aorist’s possible rendering without imposing a disputed nuance.
