id: JHN.16.28
reference: John 16:28
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐξῆλθον ⸀ἐκ τοῦ πατρὸς καὶ ἐλήλυθα εἰς τὸν κόσμον· πάλιν ἀφίημι τὸν κόσμον καὶ πορεύομαι πρὸς τὸν πατέρα.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/028.yaml
  text: I came from the Father and have come into the world. Again[a], I am leaving the world and going to the Father.
translation:
  language: ig
  text: Esi m n'ebe Nna nọ bịa[a], abịala m n'ime ụwa. Ọzọkwa, ana m ahapụ ụwa, na-alakwuru Nna.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Esi m n'ebe Nna nọ pụta.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθον ἐκ τοῦ πατρὸς
  choice: Esi m n'ebe Nna nọ bịa
  rationale: Nke a na-egosi na Nna bụ ebe Jizọs siri bịa, ma na-ada nke ọma n'Igbo ugbu a. Ihe ọzọ e dere n'okpuru na-echekwa ike okwu ἐξῆλθον nke nwere ike ịpụta ‘pụta.’
- source_word: ἐλήλυθα εἰς τὸν κόσμον
  choice: abịala m n'ime ụwa
  rationale: Ngwaa ‘abịala m’ na-egosi omume e mezuru nke ihe ọ pụtara ka dị ugbu a; ‘n'ime ụwa’ na-echekwa echiche mmegharị ịbanye n'ụwa nke εἰς na-egosi.
- source_word: πάλιν
  choice: Ọzọkwa
  rationale: 'Ọ na-egosi mmegharị ọzọ nke na-esochi nke mbụ: ịhapụ ụwa ma laghachikwuru Nna.'
- source_word: ἀφίημι τὸν κόσμον
  choice: ana m ahapụ ụwa
  rationale: Ụdị a na-egosi ihe na-eme ugbu a ma ọ bụ nke dị nso ime, dị ka ngwaa oge ugbu a n'asụsụ Grik si dị.
- source_word: πορεύομαι πρὸς τὸν πατέρα
  choice: na-alakwuru Nna
  rationale: ‘Alakwuru’ na-egosi mmegharị e chere ihu n'ebe Nna nọ, n'ebughị nkọwa ọzọ na-adịghị n'ihe odide ahụ.
theological_decisions:
- issue: Mmekọrịta Jizọs na Nna n'okwu ἐξῆλθον ἐκ τοῦ πατρὸς
  choice: Kọwaa ya dịka isi n'ebe Nna nọ bịa, n'ebughị ụzọ gbasaa ya ka ọ bụrụ nkọwa ozizi.
  alternative: Ịsụgharị ya ‘Esi m n'ebe Nna nọ pụta,’ nke na-esochikwu ihe oyiyi mmegharị dị na ἐξῆλθον.
  rationale: Amaokwu ahụ na-ekwu hoo haa na Jizọs sitere n'ebe Nna nọ bịa nakwa na ọ na-alakwuru Nna. Nsụgharị ahụ na-echekwa okwu a dị elu banyere Kraịst, ma ọ naghị etinye nkọwa ozizi karịrị okwu Grik.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ugwu ma dị mfe nghọta, dee ya. A hapụrụ ‘Nna’ dịka aha nsọ na-egosi onye a maara kpọmkwem; e jighị okwu nke otu ụka pụrụ iche.
