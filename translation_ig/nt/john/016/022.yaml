source:
  edition: SBLGNT
  text: καὶ ὑμεῖς οὖν ⸂νῦν μὲν λύπην⸃ ἔχετε· πάλιν δὲ ὄψομαι ὑμᾶς, καὶ χαρήσεται ὑμῶν ἡ καρδία, καὶ τὴν χαρὰν ὑμῶν οὐδεὶς ⸀αἴρει ἀφ’ ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/022.yaml
  text: So you also now have sorrow; but I will see you again[a], and your heart will rejoice, and no one will take your joy from you.
translation:
  language: ig
  text: Ya mere, unu kwa nwere mwute ugbu a; ma aga m ahụ unu ọzọ, obi unu ga-aṅụrị ọṅụ, ọ dịghịkwa onye ga-anapụ unu ọṅụ unu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὖν
  choice: Ya mere
  rationale: Na-egosi nkwubi okwu sitere n’ihe atụ banyere nwanyị na-amụ nwa n’amaokwu bu ụzọ, ma na-ejikọta okwu ahụ n'ụzọ doro anya.
- source_word: νῦν μὲν λύπην ἔχετε
  choice: unu onwe unu na-enwekwa mwute ugbu a
  rationale: “Mwute” na-egosipụta λύπη dịka iru újú ma ọ bụ nhụjuanya nke obi; usoro mmegide nke na-esote na-anọchi anya μέν n'ụzọ Igbo sitere n'okike.
- source_word: πάλιν δὲ
  choice: ma ... ọzọ
  rationale: “Ma” na-egosipụta mmegide dị n’etiti mwute dị ugbu a na nzute ga-abịa, ebe “ọzọ” na-egosipụta πάλιν.
- source_word: ὄψομαι ὑμᾶς
  choice: aga m ahụ unu
  rationale: Na-edobe Jizọs dịka onye na-eme ihe, dịka Grik si kwuo n'ụzọ doro anya, kama ịgbanwe ya ka ọ bụrụ “unu ga-ahụ m.”
- source_word: χαρήσεται ὑμῶν ἡ καρδία
  choice: obi unu ga-aṅụrịkwa ọṅụ
  rationale: Ọ bụ okwu Igbo sitere n'okike nke na-edobe “obi” dịka isiokwu ma na-egosipụta omume ịṅụrị ọṅụ.
- source_word: τὴν χαρὰν ὑμῶν
  choice: ọṅụ unu
  rationale: Na-edobe njikọ okwu dị n’etiti χαρήσεται na χαρά site n’iji “ṅụrị ọṅụ” na “ọṅụ.”
- source_word: οὐδεὶς αἴρει ἀφ’ ὑμῶν
  choice: ọ dịghịkwa onye ga-anapụ unu
  rationale: “Ịnapụ” dabara n’echiche iwepụ ihe n’aka mmadụ; ọdịnihu “ga-anapụ” dabara n’usoro ọdịnihu na ọnọdụ okwu ahụ.
theological_decisions:
- issue: Onye na-eme ihe na nzute nke ga-abịa
  choice: aga m ahụ unu ọzọ
  alternative: unu ga-ahụ m ọzọ
  rationale: Grik nwere Jizọs dịka onye na-ekwu ma na-eme ihe, ebe “unu” bụ ndị ọ ga-ahụ. Idebe usoro a na-egbochi ime ka amaokwu a yie okwu dị nso ma na-echekwa nkwusi ike na mbido Jizọs.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji “mwute” na “ọṅụ” mee ka mmegide mmetụta uche pụta ìhè, ma debe usoro isiokwu nke Grik n’ahịrị “aga m ahụ unu.”
