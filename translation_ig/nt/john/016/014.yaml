revisions:
- from: Ọ ga-enye m otuto, n’ihi na ọ ga-ewere ihe bụ nke m[a] kwusara unu ya.
  to: Ọ ga-enye m otuto, n’ihi na ọ ga-ewere site n’ihe bụ nke m ma kwusaa ya nye unu.[a]
  rationale: The revision restores the ‘from’ sense of ἐκ with “site n’ihe bụ nke m,” supplies a natural coordination of λήμψεται and ἀναγγελεῖ, and renders the implicit object and plural recipient clearly as “kwusaa ya nye unu.” The footnote likewise retains the full phrase while offering ‘receive’ as the lexical alternative.
