review_pass:
  verdict: revise
  source_fidelity: The draft omits the source sense of ἐκ ('from') in ἐκ τοῦ ἐμοῦ, making it sound as though the Spirit will simply take what belongs to Jesus. It also lacks a clear connective between the two future actions.
  naturalness: The sequence “ọ ga-ewere ihe bụ nke m kwusara unu ya” is not well formed in natural Standard Igbo. A coordinating construction and the dative recipient phrase yield clear, modern Igbo.
  terminology: “inye m otuto” is an appropriate dignified rendering of δοξάσει in this Johannine setting. “ihe bụ nke m” appropriately retains the breadth of τοῦ ἐμοῦ without doctrinal narrowing.
  issues:
  - severity: high
    issue: The prepositional sense of ἐκ is absent.
    rationale: “Ga-ewere ihe bụ nke m” means ‘will take what is mine,’ whereas the Greek says he will take/receive from what is Jesus’.
  - severity: medium
    issue: The two verbs are improperly joined.
    rationale: The draft needs an Igbo coordinator, and the declaration should be clearly directed to the plural addressees.
  revised_text: Ọ ga-enye m otuto, n’ihi na ọ ga-ewere site n’ihe bụ nke m ma kwusaa ya nye unu.[a]
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “ọ ga-anata site n’ihe bụ nke m.”
    reason: lexical_alternative
