  text: ἐκεῖνος ἐμὲ δοξάσει, ὅτι ἐκ τοῦ ἐμοῦ λήμψεται καὶ ἀναγγελεῖ ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/014.yaml
  text: He will glorify me[a], because he will take from what is mine and declare it to you.
translation:
  language: ig
  text: Ọ ga-enye m otuto, n’ihi na ọ ga-ewere site n’ihe bụ nke m ma kwusaa ya nye unu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ọ ga-anata site n’ihe bụ nke m.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκεῖνος
  choice: Ọ
  rationale: Ọ na-ezo aka n’Onye Inyeaka, bụ Mmụọ ahụ, n’okwu ndị gbara amaokwu a gburugburu. N’asụsụ Igbo, nnọchiaha ‘Ọ’ bụ ụzọ nkịtị na nke doro anya isi kwuo ya; ‘Onye ahụ’ ga-eme ka ike ngosi nke okwu Grik ahụ pụta karịa ka ọnọdụ a chọrọ.
- source_word: ἐμὲ
  choice: m
  rationale: Nnọchiaha onye mbụ nke bụ ihe omume ‘inye otuto’ dakwasịrị.
- source_word: δοξάσει
  choice: ga-enye m otuto
  rationale: Nkebiokwu a bụ asụsụ Igbo dị ugwu ma dị mfe nghọta maka δοξάζω; ọ na-echekwa echiche Jọn banyere ime ka ịdị ebube na mkpa Jizọs pụta ìhè, ọ bụghị naanị ịkwanyere mmadụ ùgwù.
- source_word: ὅτι
  choice: n’ihi na
  rationale: Ọ na-egosi ihe kpatara Mmụọ ahụ ga-eji nye Jizọs otuto.
- source_word: ἐκ τοῦ ἐμοῦ
  choice: ihe bụ nke m
  rationale: Ọ na-echekwa obosara nke okwu Grik ahụ—ihe dịịrị Jizọs—na-akọwaghị ya kpọmkwem dị ka ozizi, ikike, ma ọ bụ mkpughe.
- source_word: λήμψεται
  choice: ga-ewere
  rationale: λαμβάνω nwere ike ịpụta ‘were’ ma ọ bụ ‘nata.’ ‘Ga-ewere’ dabara nke ọma na ‘ihe bụ nke m,’ ebe nkọwa ala peeji na-echekwa nhọrọ ‘ga-anata.’
- source_word: ἀναγγελεῖ
  choice: kwusara unu ya
  rationale: ἀναγγέλλω pụtara ikwusa, ịkọ, ma ọ bụ ime ka a mara. ‘Kwusara unu ya’ bụ okwu Igbo doro anya ma dị ugwu; ‘ya’ na-anọchi ihe e kwuru n’ihu.
- source_word: ὑμῖν
  choice: unu
  rationale: Ọ bụ nnọchiaha onye nke abụọ n’ọnụọgụ ọtụtụ, ya mere ‘unu’ na-egosipụta ọtụtụ ndị a na-agwa okwu nke ọma.
theological_decisions:
- issue: Mmekọrịta Mmụọ ahụ na Jizọs n’okwu ἐκ τοῦ ἐμοῦ λήμψεται
  choice: ọ ga-ewere ihe bụ nke m
  alternative: ọ ga-anata ihe bụ nke m
  rationale: 'Nsụgharị a na-ahapụ okwu ahụ ka ọ gbasaa dịka o si dị na Grik: Mmụọ ahụ na-ekwusara ndị na-eso ụzọ ihe dịịrị Ọkpara. Ọ naghị eme ya ka ọ bụrụ nkwupụta nkà mmụta okpukpe pụrụ iche nke karịrị ihe amaokwu ahụ kwuru.'
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta, dee ya. A họọrọ ‘inye otuto’ iji chekwaa ibu okwu δοξάζω n’akwụkwọ Jọn, ebe ‘unu’ gosipụtara nke ọma na ndị a na-agwa okwu karịrị otu onye.
