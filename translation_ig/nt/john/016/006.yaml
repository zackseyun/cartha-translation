revisions:
- from: Ma ebe m gwara unu ihe ndị a, mwute ejupụtala obi unu.[a]
  to: Ma n’ihi na m gwala unu ihe ndị a, mwute ejupụtala obi unu.[a]
  rationale: The revision replaces an ambiguous or less idiomatic causal connector with the direct Standard Igbo equivalent “n’ihi na.” It also corrects the footnote alternative so that it genuinely represents the possible distributive-plural sense while preserving the Greek text’s singular “heart” and its possible collective nuance.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T06:26:42Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the adversative, the causal relationship, the plural referent of “you,” the perfect-result sense of the sorrow filling the heart, and the Greek singular καρδίαν. However, “ebe” in this construction is less direct and less idiomatic than the unambiguous causal expression “n’ihi na.”
  naturalness: “Ma n’ihi na m gwala unu ihe ndị a, mwute ejupụtala obi unu” is natural, modern Standard Igbo and retains the solemn, restrained register. The original wording with “Ma ebe” is understandable but stylistically weaker as a causal clause.
  terminology: “Mwute,” “obi,” and “ejupụtala” are appropriate and preserve both the emotional and metaphorical force without importing interpretation. The footnote’s proposed “obi unu niile” does not clearly express the intended distributive plural alternative and can instead suggest each person’s whole heart.
  issues:
  - severity: medium
    issue: The causal connector “ebe” is not the clearest natural equivalent for ὅτι in this context.
    rationale: Here ὅτι gives the reason for the disciples’ sorrow. “N’ihi na” directly and idiomatically marks that causal relation in Standard Igbo.
  - severity: medium
    issue: The footnote alternative “obi unu niile” is semantically imprecise.
    rationale: It may be understood as “all your heart(s)” rather than as the alternative plural/distributive rendering of Greek singular “heart” with plural possessive. “Obi onye ọ bụla n’ime unu” clearly represents the distributive alternative.
  revised_text: Ma n’ihi na m gwala unu ihe ndị a, mwute ejupụtala obi unu.[a]
  revised_footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “obi onye ọ bụla n’ime unu.” N’asụsụ Grik, “unu” bụ ọtụtụ ma “obi” bụ otu; usoro a nwere ike igosi mwute dị n’ime nke ha niile nwekọrọ ọnụ.
    reason: lexical_alternative
  revision_rationale: The revision replaces an ambiguous or less idiomatic causal connector with the direct Standard Igbo equivalent “n’ihi na.” It also corrects the footnote alternative so that it genuinely represents the possible distributive-plural sense while preserving the Greek text’s singular “heart” and its possible collective nuance.
