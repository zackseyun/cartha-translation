id: JHN.16.6
reference: John 16:6
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀλλ’ ὅτι ταῦτα λελάληκα ὑμῖν ἡ λύπη πεπλήρωκεν ὑμῶν τὴν καρδίαν.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/006.yaml
  text: But because I have spoken these things to you[a], sorrow has filled your heart.
translation:
  language: ig
  text: Ma n’ihi na m gwala unu ihe ndị a, mwute ejupụtala obi unu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “obi onye ọ bụla n’ime unu.” N’asụsụ Grik, “unu” bụ ọtụtụ ma “obi” bụ otu; usoro a nwere ike igosi mwute dị n’ime nke ha niile nwekọrọ ọnụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: Ma
  rationale: Njikọ a na-egosi ọdịiche n’ihe Jizọs kwuru tupu nke a; “Ma” bụ ụzọ Igbo nkịtị na nke doro anya isi gosipụta ya.
- source_word: ὅτι
  choice: ebe
  rationale: N’ebe a, ὅτι na-egosi ihe kpatara mwute ndị na-eso ụzọ; usoro “ebe ...” na-enye nghọta causal ahụ n’Igbo nke ọma.
- source_word: ταῦτα
  choice: ihe ndị a
  rationale: Nke a na-edobe ọtụtụ nke okwu Grik ahụ ma na-ezo aka n’ihe dị iche iche Jizọs kwuru ugbu a.
- source_word: λελάληκα
  choice: m gwara
  rationale: Perfect ahụ na-ezo aka n’okwu e kwuchara nke ka na-emetụta ha ugbu a. N’Igbo, “m gwara unu” bụ okwu ebumpụta ụwa; mmetụta na-aga n’ihu pụtara ìhè site n’ahịrịokwu dum.
- source_word: ὑμῖν
  choice: unu
  rationale: Nnọchiaha a bụ ọtụtụ, ya mere “unu” na-egosipụta nke ahụ kpọmkwem.
- source_word: ἡ λύπη
  choice: mwute
  rationale: “Mwute” na-egosi obi mgbawa na iru újú dị omimi n’asụsụ Igbo dị ugbu a, ma kwekọọ n’ụda dị arọ nke amaokwu ahụ.
- source_word: πεπλήρωκεν
  choice: ejupụtala
  rationale: Okwu a na-edobe echiche nkịtị nke ‘ijuputa’ nakwa ọnọdụ si n’ihe e mere pụta nke ka dị ugbu a.
- source_word: ὑμῶν τὴν καρδίαν
  choice: obi unu
  rationale: “Unu” na-egosi ọtụtụ ndị a na-agwa okwu, ebe “obi” na-edobe aha otu dị na Grik ma nwee ike igosi ọnọdụ ime mmụọ ha niile jikọrọ ọnụ.
theological_decisions:
- issue: “Obi” otu ma ọ bụ “obi” ọtụtụ n’usoro ὑμῶν τὴν καρδίαν
  choice: obi unu
  alternative: obi unu niile / obi ndị unu
  rationale: Grik ji nnọchiaha ọtụtụ na aha otu, nke nwere ike igosi otu mwute jikọrọ ndị otu ahụ ọnụ. “Obi unu” bụkwa usoro Igbo ebumpụta ụwa ma na-edobe mgbagwoju anya ahụ n’enweghị ịkọwa ya gabiga ókè.
translation_notes:
  register: Asụsụ ahụ bụ Standard Igbo dị ugbu a, dị mfe nghọta ma nwee ugwu. E debere ihe oyiyi nke mwute ‘ijuputa obi,’ nke bụkwa okwu kwụ ọtọ ma dị ndụ n’Igbo.
