  text: Ἔτι πολλὰ ἔχω ⸂ὑμῖν λέγειν⸃, ἀλλ’ οὐ δύνασθε βαστάζειν ἄρτι·
base_translation:
  language: en
  yaml_path: translation/nt/john/016/012.yaml
  text: I still have many things to say to you[a], but you are not able to bear them now.
translation:
  language: ig
  text: M ka nwere ọtụtụ ihe m ga-agwa unu, ma unu enweghị ike iburu ha ugbu a.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ma unu enweghị ike ịnagide ha ugbu a.” Ngwaa Grik a pụrụ ịpụta ibu, iburu ibu, ma ọ bụ ịnagide ihe.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔτι
  choice: M ka
  rationale: “Ka” na-egosi na Jizọs ka nwere ihe ndị fọdụrụ ọ ga-ekwu; njikọ ya na “m nwere” bụ ụzọ Igbo nkịtị si egosipụta echiche a.
- source_word: πολλὰ
  choice: ọtụtụ ihe
  rationale: Adjective neuter plural a na-arụ ọrụ dị ka aha; “ọtụtụ ihe” na-eme ka ihe a na-ezo aka na ya doo anya n’Igbo.
- source_word: ἔχω ὑμῖν λέγειν
  choice: m nwere ọtụtụ ihe m ga-agwa unu
  rationale: Nke a na-egosipụta ihe Jizọs ka nwere fọdụrụ ikwu, ebe “agwa unu” bụ ụzọ Igbo dị mma isi sụgharịa λέγειν ya na dative ὑμῖν.
- source_word: ἀλλ’
  choice: ma
  rationale: “Ma” bụ njikọ mmegide kwụ ọtọ ma bụrụkwa nke a na-eji eme ihe n’Igbo ugbu a.
- source_word: οὐ δύνασθε
  choice: unu enweghị ike
  rationale: Nke a na-echekwa echiche doro anya nke enweghị ikike ma ọ bụ ike dị na δύνασθε.
- source_word: βαστάζειν
  choice: iburu ha
  rationale: “Ibu” na-echekwa ihe atụ nke iburu ibu, ma ọ pụkwara ịgụnye ịnagide ihe; ọ naghị eme ka ihe okwu ahụ pụtara bụrụ naanị ịghọta.
- source_word: ἄρτι
  choice: ugbu a
  rationale: Ọ na-egosi oge ha nọ na ya, n’adịghị ka oge ga-abịa nke amaokwu ndị na-esote na-ekwu maka ya.
theological_decisions:
- issue: Ihe βαστάζειν pụtara banyere enweghị ike ndị na-eso ụzọ n’oge ahụ
  choice: Ndị na-eso ụzọ enweghị ike iburu ibu nke ihe ndị ọzọ Jizọs ga-agwa ha ugbu a.
  alternative: Ha enweghị ike ịghọta ihe ndị ahụ nke ọma ugbu a, ma ọ bụ ha enweghị ike ịnagide ịnụ ha ugbu a.
  rationale: βαστάζω nwere ike ịpụta ibu, iburu, ma ọ bụ ịnagide. “Ibu ha” na-echekwa ma echiche nke ibu ime mmụọ ma nke ikike nghọta, n’emeghị ka ọ bụrụ naanị otu n’ime ha.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị mfe nghọta ma nwee ugwu. A họọrọ “iburu ha” iji chekwaa ihe atụ na mgbagwoju echiche dị n’okwu Grik.
