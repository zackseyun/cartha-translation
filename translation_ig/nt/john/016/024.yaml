  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἕως ἄρτι οὐκ ᾐτήσατε οὐδὲν ἐν τῷ ὀνόματί μου· αἰτεῖτε καὶ λήμψεσθε, ἵνα ἡ χαρὰ ὑμῶν ᾖ πεπληρωμένη.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/024.yaml
  text: Until now you have asked for nothing in my name[a]. Ask, and you will receive[c][b], so that your joy may be full.
translation:
  language: ig
  text: Ruo ugbu a, unu arịọbeghị ihe ọ bụla n’aha m. Rịọnụ[a], unu ga-anata, ka ọṅụ unu wee zuo oke.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Na-arịọnụ.” Ụdị iwu αἰτεῖτε nwere ike, n’ọnọdụ a, ịpụta omume a na-eme ugboro ugboro ma ọ bụ nke a na-aga n’ihu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕως ἄρτι
  choice: Ruo ugbu a
  rationale: Akpaokwu a na-egosi oge niile ruo n’oge a; nke a bụ ụzọ Igbo doro anya ma dịkwa eke si kwuo ya.
- source_word: οὐκ ᾐτήσατε οὐδὲν
  choice: unu arịọbeghị ihe ọ bụla
  rationale: Ngwakọta ngọnarị na οὐδὲν pụtara na ha arịọbeghị ihe ọbụla; ụdị ngwaa Igbo a dabara n’usoro oge nke ‘ruo ugbu a.’
- source_word: ἐν τῷ ὀνόματί μου
  choice: n’aha m
  rationale: A hapụrụ akpaokwu ahụ n’ụdị ya sara mbara, n’ihi na ọ pụrụ ịgụnye onye Jizọs bụ, ikike ya, na ozi ya, n’enweghị imechi ya n’otu nkọwa.
- source_word: αἰτεῖτε
  choice: Rịọnụ
  rationale: Iwu a dị n’ọnụọgụ ọtụtụ ma na-agwa ndị na-ege ntị ka ha rịọ; Igbo anaghị egosi ọdịiche aspect nke present imperative n’otu ụzọ ahụ Grik si egosi ya.
- source_word: λήμψεσθε
  choice: unu ga-anatakwa
  rationale: ‘Ịnata’ dabara n’ihe a na-enweta n’ihi arịrịọ; -kwa na-ejikọta n'ụzọ eke omume ịrịọ na nsonaazụ ịnata.
- source_word: ἵνα ἡ χαρὰ ὑμῶν ᾖ πεπληρωμένη
  choice: ka ọṅụ unu wee zuo oke
  rationale: Nke a na-egosi nzube ma ọ bụ nsonaazụ, ebe ‘zuo oke’ na-egosipụta ọnọdụ ọṅụ zuru ezu nke perfect participle ahụ na-ekwu.
theological_decisions:
- issue: Ihe ‘n’aha m’ pụtara n’arịrịọ
  choice: E debere ‘n’aha m’ n’ahịrịokwu bụ isi.
  alternative: n’ihi m; n’okpuru ikike m; n’ịdị n’otu mụ na m
  rationale: Akpaokwu Grik ahụ bara ụba karịa otu nkọwa. Idebe ya otú ahụ na-echekwa obosara na esemokwu nkà mmụta okpukpe ya n’etinyeghị nkọwa otu ụka.
- issue: Izu oke nke ọṅụ
  choice: ka ọṅụ unu wee zuo oke
  alternative: ka ọṅụ unu wee jupụta
  rationale: ‘Zuo oke’ bụ Igbo eke nke na-egosi ọnọdụ zuru ezu; ‘jupụta’ na-echekwakwu ihe oyiyi nke πλήρης, ma ọ nwere ike ịdị ntakịrị ihe siri ike mgbe ọṅụ bụ isiokwu.
translation_notes:
  register: Standard Igbo; asụsụ dị ugbu a, dị ùgwù, ma dị mfe nghọta. E debere ‘n’aha m’ n’enweghị mgbasawanye nkọwa. A haziri akara nkọwa ala peeji ozugbo e mesịrị akpaokwu ọ na-akọwa.
