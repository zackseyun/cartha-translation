review_pass:
  verdict: revise
  source_fidelity: The main rendering accurately conveys the temporal expression, the negated request, the literal and theologically open phrase “n’aha m,” the plural imperative and future promise, and the purpose that the disciples’ joy be brought to fullness. “Ka ọṅụ unu wee zuo oke” is an established, natural Igbo way to express the intended fullness/completion without imposing an interpretation.
  naturalness: The sentence is clear, modern Standard Igbo, and retains an appropriate elevated biblical register. Removing -kwa from “unu ga-anatakwa” more closely reflects the unmarked future promise and avoids a possible added sense of “also.”
  terminology: “n’aha m” correctly retains the Greek expression ἐν τῷ ὀνόματί μου without narrowing its theological scope. “Rịọnụ” and “nata” are suitable prayer-context terms. The footnote must be anchored to the imperative it discusses, not to “n’aha m.”
  issues:
  - severity: medium
    issue: The sole footnote marker is attached to “n’aha m,” but its content discusses the present imperative αἰτεῖτε (“Rịọnụ”).
    rationale: A footnote anchor must identify the expression to which its alternative applies. The current placement falsely suggests that the note explains “in my name.”
  - severity: low
    issue: The footnote’s proposed alternative unnecessarily includes “unu ga-anatakwa.”
    rationale: The aspectual alternative concerns αἰτεῖτε alone. Limiting the alternative to “Na-arịọnụ” makes its scope precise and prevents the note from implying an alternative translation of λήμψεσθε.
  - severity: low
    issue: “ga-anatakwa” adds the connective/emphatic particle -kwa, which is not required by the Greek future λήμψεσθε.
    rationale: “Unu ga-anata” gives the direct promise naturally and more neutrally.
  revised_text: Ruo ugbu a, unu arịọbeghị ihe ọ bụla n’aha m. Rịọnụ[a], unu ga-anata, ka ọṅụ unu wee zuo oke.
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “Na-arịọnụ.” Ụdị iwu αἰτεῖτε nwere ike, n’ọnọdụ a, ịpụta omume a na-eme ugboro ugboro ma ọ bụ nke a na-aga n’ihu.
    reason: lexical_alternative
  revision_rationale: The revision corrects the misplaced footnote anchor and narrows its wording to the Greek form it actually explains. It also removes an unneeded Igbo particle from the future promise. No theological expansion has been introduced, and the source’s purpose/result clause remains intact.
