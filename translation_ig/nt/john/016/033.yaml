id: JHN.16.33
reference: John 16:33
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ταῦτα λελάληκα ὑμῖν ἵνα ἐν ἐμοὶ εἰρήνην ἔχητε· ἐν τῷ κόσμῳ θλῖψιν ἔχετε, ἀλλὰ θαρσεῖτε, ἐγὼ νενίκηκα τὸν κόσμον.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/033.yaml
  text: I have spoken these things to you so that in me you may have peace[a]. In the world you have tribulation, but take courage[b]; I have overcome the world.
translation:
  language: ig
  text: Ekwuwo m ihe ndị a nye unu ka unu wee nwee udo n’ime m. N’ụwa, unu nwere mkpagbu[a], ma nweenụ obi ike[b]; emeriela m ụwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị “mkpagbu” dịka “nsogbu,” “ahụhụ,” ma ọ bụ “nhụjuanya.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ka obi sie unu ike.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα
  choice: ihe ndị a
  rationale: Ọ bụ nrụaka ọtụtụ nke na-ezo aka n’ihe Jizọs kwuru tupu nke a.
- source_word: λελάληκα ὑμῖν
  choice: Ekwuwo m ... nye unu
  rationale: Ụdị ngwaa a na-egosi okwu e kwuchara nke uru ya ka dị ugbu a; “Ekwuwo m” na-edobe nke ahụ n’Igbo.
- source_word: ἵνα
  choice: ka ... wee
  rationale: Ọ na-egosi ebumnuche okwu Jizọs kwuru n’ụzọ Igbo sitere n’obi.
- source_word: ἐν ἐμοὶ
  choice: n’ime m
  rationale: E debere okwu ahụ n’ụzọ dị nso n’asụsụ Grik ka echiche pụrụ iche Jọn banyere ịdị “n’ime” Jizọs ghara ịghọ nkọwa e tinyere na ya.
- source_word: εἰρήνην ἔχητε
  choice: unu wee nwee udo
  rationale: “Udo” na-eburu echiche nke ịdị jụụ na ọdịmma zuru ezu; usoro ahụ na-egosikwa ebumnuche nke ịnọgide na-enwe ya.
- source_word: ἐν τῷ κόσμῳ
  choice: N’ụwa
  rationale: “Ụwa” na-edobe obosara na mgbagwoju anya nke κόσμος n’akwụkwọ Jọn n’enweghị ịkọwa ya karịa ihe ederede kwuru.
- source_word: θλῖψιν
  choice: mkpagbu
  rationale: “Mkpagbu” na-egosi nrụgide, ahụhụ, na nhụjuanya siri ike nke okwu Grik ahụ pụtara.
- source_word: ἔχετε
  choice: unu nwere
  rationale: Nke a na-asụgharị ngwaa dị n’oge ugbu a n’ụzọ kwụ ọtọ.
- source_word: θαρσεῖτε
  choice: nweenụ obi ike
  rationale: Ọ bụ iwu na-akpọ ndị na-ege ntị ka obi sie ha ike n’agbanyeghị mkpagbu.
- source_word: νενίκηκα
  choice: emeriela m
  rationale: Ngwụcha -la na-egosi mmeri e mezuru nke nsonaazụ ya ka dị ugbu a.
- source_word: τὸν κόσμον
  choice: ụwa
  rationale: E ji otu okwu ahụ mee ihe n’ebe abụọ ahụ iji chekwaa njikọ na ọdịiche dị n’etiti ịnọ n’ụwa na mmeri Jizọs meriri ụwa.
theological_decisions:
- issue: Ihe κόσμος pụtara n’akwụkwọ Jọn
  choice: ụwa
  alternative: usoro ụwa / ụwa a dara ada
  rationale: “Ụwa” na-ahapụ ka ọnọdụ okwu gosi akụkụ ụwa nke na-emegide Chineke, ma ọ naghị emechi okwu Jọn n’otu nkọwa naanị.
- issue: Ike nke ngwaa abụọ dị n’ụdị perfect
  choice: Ekwuwo m / emeriela m
  alternative: Ekwuru m / meriri m
  rationale: Ụdị ndị a na-egosi omume e mezuru nke mkpa na nsonaazụ ya ka dị ugbu a, karịsịa nkwupụta mmeri Jizọs tupu obe emee n’usoro akụkọ ahụ.
- issue: Udo “n’ime m” megide mkpagbu “n’ụwa”
  choice: E debere n’ime m na n’ụwa dịka ha dị
  alternative: udo site n’aka m / mkpagbu n’usoro ụwa ọjọọ
  rationale: Nke a na-echekwa ọdịiche na esemokwu nke okwu Jizọs n’enweghị ịgbakwunye nkọwa otu ụka ma ọ bụ ozizi pụrụ iche.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta mee ihe. A manyere akara nkọwa ala peeji n’akụkụ okwu ha na-akọwa, ebe ihe ọmụma Bekee e nyere tinyere ha n’ọnọdụ na-ekwekọghị na ọdịnaya nkọwa ndị ahụ.
