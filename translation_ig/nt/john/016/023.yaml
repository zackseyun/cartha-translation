reference: John 16:23
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἐν ἐκείνῃ τῇ ἡμέρᾳ ἐμὲ οὐκ ἐρωτήσετε οὐδέν· ἀμὴν ἀμὴν λέγω ὑμῖν, ⸂ἄν τι⸃ αἰτήσητε τὸν πατέρα ⸂δώσει ὑμῖν ἐν τῷ ὀνόματί μου⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/023.yaml
  text: And in that day you will ask me nothing[a]. Truly, truly, I say to you, whatever you ask the Father in my name[b], he will give to you.
translation:
  language: ig
  text: N’ụbọchị ahụ, unu agaghị ajụ m ihe ọ bụla.[a] N’ezie, n’ezie, ana m asị unu, ihe ọ bụla unu rịọrọ Nna, ọ ga-enye unu ya n’aha m.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'N’asụsụ Grik, e ji ngwaa abụọ dị iche iche mee ihe maka “ịjụ/ịrịọ” n’amaokwu a: nke mbụ bụ ἐρωτάω, nke nwere ike ịpụta ịjụ mmadụ ajụjụ ma ọ bụ ịrịọ ya; nke abụọ bụ αἰτέω, nke na-egosikarị ịrịọ ihe.'
    reason: lexical_alternative
  - marker: b
    text: Ụfọdụ ihe odide Grik anaghị agụnye okwu “n’aha m.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: N’ụbọchị ahụ
  rationale: Ọ bụ ụzọ Igbo doro anya ma bụrụkwa nke e ji asụkarị maka okwu oge a; ọ na-edobekwa ụda pụrụ iche nke okwu ahụ n’Oziọma Jọn.
- source_word: ἐρωτήσετε
  choice: unu agaghị ajụ m ihe ọ bụla
  rationale: “Jụọ” nwere ike ịpụta ịjụ mmadụ ajụjụ ma ọ bụ ịrịọ ya ihe. N’ebe a, nhazi okwu ahụ na-eme ka “m” pụta ìhè ma ghara ikpebi n’ime isiokwu isi ihe ngwaa ahụ pụtara karịa ihe Grik kwuru.
- source_word: ἀμὴν ἀμὴν
  choice: N’ezie, n’ezie
  rationale: Nke a bụ Igbo dị ugbu a, doro anya, ma na-echekwa nkwughachi e ji mesie okwu ike nke a na-ahụkarị n’Oziọma Jọn.
- source_word: ἄν τι αἰτήσητε
  choice: ihe ọ bụla unu rịọrọ
  rationale: “Ihe ọ bụla” na-egosipụta ohere sara mbara nke τι na ἄν, ebe “rịọ” na-egosi arịrịọ a na-arịọ Nna nke ọma karịa “jụọ.”
- source_word: τὸν πατέρα
  choice: Nna
  rationale: Grik kwuru “Nna,” ọ bụghị “Nna m.” Mkpụrụedemede ukwu na-egosi na ọ bụ Chineke Nna ka a na-ekwu maka ya, n’enweghị ịgbakwunye okwu nke na-adịghị na isi mmalite.
- source_word: δώσει ὑμῖν
  choice: ọ ga-enye unu ya
  rationale: “Ya” bụ nnọchiaha Igbo kwesịrị ekwesị nke na-alaghachi n’ihe a rịọrọ; ọ na-eme ka ahịrịokwu ahụ zuo oke n’asụsụ Igbo n’agbanyeghị na Grik ekwughị ihe nnọchiaha ahụ kpọmkwem.
- source_word: ἐν τῷ ὀνόματί μου
  choice: n’aha m
  rationale: Nke a bụ ntụgharị Igbo nkịtị nke na-echekwa okwu Jọn dị mkpa na nghọta ya gbasara nnọchite anya, n’enweghị ịkọwa ụzọ o si arụ ọrụ karịa isi mmalite.
theological_decisions:
- issue: Ọdịiche dị n’etiti ἐρωτάω nke metụtara Jizọs na αἰτέω nke metụtara Nna
  choice: A sụgharịrị nke mbụ “jụọ” ma sụgharịa nke abụọ “rịọ,” ma kọwaa ọdịiche ahụ n’ala ala peeji.
  alternative: Iji “rịọ” mee ha abụọ, ma ọ bụ ịsụgharị nke mbụ “jụọ ajụjụ.”
  rationale: Igbo nwere ike igosipụta ọdịiche ngwaa abụọ ahụ n’ụzọ dị mma. Ma ịgbakwunye “ajụjụ” n’isiokwu nwere ike imechi nghọta ἐρωτάω karịa ka Grik mere, ya mere e debere nkọwa zuru ezu n’ala ala peeji.
- issue: Oke nkwa banyere arịrịọ a na-arịọ “n’aha m”
  choice: E debere nkwa ahụ kpọmkwem dịka amaokwu ahụ si kwuo ya, n’etinyeghị ihe mgbochi nkọwa okpukpe n’isiokwu.
  alternative: Ịkọwakwu ya dịka naanị arịrịọ kwekọrọ n’uche Jizọs.
  rationale: Ọ bụ ezie na amaokwu ndị ọzọ nwere ike inye aka n’ịkọwa ya, amaokwu a n’onwe ya ekwughị ihe mgbochi ahụ. Ntụgharị ekwesịghị idozi esemokwu nkà mmụta okpukpe ahụ n’ime isiokwu.
- issue: Njikọ “n’aha m” na ọdịiche ederede
  choice: E jikọtara “n’aha m” na arịrịọ a na-arịọ Nna n’isiokwu, ma tinye nhọrọ ọzọ n’ala ala peeji.
  alternative: 'Ijikọta “n’aha m” na okwu na-eso ya: “ọ ga-enye unu ya n’aha m.”'
  rationale: Ndị akaebe ederede nwere nhazi okwu dị iche iche, nke na-enye ohere maka njikọ abụọ ahụ. Nhọrọ isiokwu ahụ bụ nke a na-aghọta nke ọma ma bụrụ nke ọtụtụ ndị na-ahọrọ, ma e chekwara ezigbo mgbagwoju anya ahụ n’ala ala peeji.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta mee ihe. “Unu” na-egosi na okwu ahụ bụ ọtụtụ mmadụ. E ji “jụọ” na “rịọ” mee ka ọdịiche ngwaa Grik abụọ ahụ pụta ìhè n’ụzọ na-adịghị akpaghasị ịdị mfe nke amaokwu ahụ.
