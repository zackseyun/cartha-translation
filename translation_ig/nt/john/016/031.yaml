  text: ἀπεκρίθη ⸀αὐτοῖς Ἰησοῦς· Ἄρτι πιστεύετε;
base_translation:
  language: en
  yaml_path: translation/nt/john/016/031.yaml
  text: Jesus answered them[a], “Do you now believe?”
translation:
  language: ig
  text: Jizọs zara ha, sị, “Ugbu a, unu ekwere?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Ugbu a, unu ekwere.” Enwere ike ịgụ okwu Grik ahụ dịka nkwupụta, ma ihe ndị gbara ya gburugburu na-akwado ịgụ ya dịka ajụjụ.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: zara
  rationale: Nke a bụ ụzọ Igbo a na-ejikarị akọwa nzaghachi n’ụka, ma ọ naghị etinye echiche ọzọ na okwu Grik.
- source_word: αὐτοῖς
  choice: ha
  rationale: Nnọchiaha a na-egosi ndị Jizọs zara; ‘zara ha’ bụ usoro okwu Igbo dị mfe ma bụrụkwa nke e ji eme ihe.
- source_word: Ἰησοῦς
  choice: Jizọs
  rationale: E dere aha ahụ n’ụdị a na-ejikarị ede ya n’Igbo ọkọlọtọ.
- source_word: Ἄρτι
  choice: Ugbu a
  rationale: Ọ na-echekwa echiche nke oge dị ugbu a nke okwu Grik ἄρτι nwere.
- source_word: πιστεύετε
  choice: ùnu ekwere
  rationale: ‘Kwere’ bụ okwu Igbo doro anya maka πιστεύω. Ụdị a na-agwa ọtụtụ mmadụ okwu ma na-ahapụ ajụjụ ahụ ka ọ dị mfe, n’etinyeghị nkọwa karịrị nke dị na Grik.
theological_decisions:
- issue: Ma Ἄρτι πιστεύετε bụ ajụjụ ka ọ bụ nkwupụta
  choice: 'E dere ya dị ka ajụjụ: “Ugbu a, ùnu ekwere?”'
  alternative: “Ugbu a, unu ekwere.”
  rationale: E nwere ike ịgụ okwu Grik ahụ dị ka ajụjụ ma ọ bụ nkwupụta n’ihi na ihe odide mbụ enweghị akara ajụjụ na-ekpebi ya. Ihe na-esochi n’amaokwu 32 na-akwado ajụjụ njakịrị, ma nkọwa ala peeji na-echekwa ụzọ ọzọ a pụrụ isi gụọ ya.
translation_notes:
  register: Igbo ọkọlọtọ, nke oge a, dị ùgwù ma dị mfe nghọta. E ji ‘sị’ mee ka okwu e hotara soro ‘zara ha’ na-aga nke ọma n’Igbo; ọ naghị agbakwunye ihe ọhụrụ n’ihe Jizọs kwuru.
