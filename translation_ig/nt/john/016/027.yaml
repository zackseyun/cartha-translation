  text: αὐτὸς γὰρ ὁ πατὴρ φιλεῖ ὑμᾶς, ὅτι ὑμεῖς ἐμὲ πεφιλήκατε καὶ πεπιστεύκατε ὅτι ἐγὼ παρὰ τοῦ ⸀θεοῦ ἐξῆλθον.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/027.yaml
  text: For the Father himself loves you[a], because you have loved me and have believed that I came from God.
translation:
  language: ig
  text: N’ihi na Nna n’onwe ya hụrụ unu n’anya, n’ihi na unu ahụwo m n’anya ma ekwerela na m si n’ebe Chineke nọ bịa[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “m si na Chineke pụta”; okwu Grik ahụ nwekwara ike igosi na m si n’ihu Chineke bịa.
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτὸς
  choice: n’onwe ya
  rationale: Ọ na-emesi ὁ πατήρ ike, na-egosi na ọ bụ Nna ahụ n’onwe ya hụrụ ndị na-eso ụzọ ya n’anya.
- source_word: γὰρ
  choice: N’ihi na
  rationale: Ọ na-ewebata nkọwa ma ọ bụ ihe kpatara okwu bu ya ụzọ; “N’ihi na” na-ejikọta echiche ahụ n’ụzọ doro anya n’Igbo.
- source_word: ὁ πατὴρ
  choice: Nna
  rationale: N’Oziọma Jọn, nke a bụ aha e ji ekwu banyere Chineke n’ihe gbasara mmekọrịta ya na Ọkpara ya na ndị kwere ekwe.
- source_word: φιλεῖ
  choice: hụrụ unu n’anya
  rationale: Akpaalaokwu Igbo “ịhụ mmadụ n’anya” na-egosipụta ịhụnanya na mmetụta onwe onye nke φιλέω pụtara n’ebe a.
- source_word: ὅτι
  choice: n’ihi na
  rationale: ὅτι nke mbụ na-egosi ihe kpatara Nna ji hụ ha n’anya.
- source_word: πεφιλήκατε
  choice: unu ahụwo m n’anya
  rationale: Ụdị a na-egosipụta ịhụnanya malitere na mbụ ma ka dị mkpa ugbu a, kwekọrọ n’ike perfect tense Grik.
- source_word: καὶ πεπιστεύκατε
  choice: kwerekwa
  rationale: “Kwerekwa” jikọtara ịhụ Jizọs n’anya na ikwere ihe banyere ebe o si bịa; ọnọdụ okwu ahụ na-egosi na nkw 믿 ahụ ka dị ugbu a.
- source_word: ὅτι ἐγὼ παρὰ τοῦ θεοῦ ἐξῆλθον
  choice: na m si n’ebe Chineke nọ bịa
  rationale: Nke a na-edobe echiche nke mmalite na ozi Jizọs sitere n’aka Chineke, ma na-adịghị agbakwụnye nkọwa ozizi karịrị okwu Grik.
theological_decisions:
- issue: Ike okwu gbasara Kraịst dị na “m si n’ebe Chineke nọ bịa”
  choice: na m si n’ebe Chineke nọ bịa
  alternative: na m si na Chineke pụta
  rationale: Nsụgharị a na-egosi ma ebe Jizọs si bịa ma njikọ ozi ya na Chineke, ma hapụkwara ihe okwu ahụ pụtara n’uju ka ihe ndị gbara ya gburugburu kọwaa ya, kama itinye usoro ozizi ọzọ n’ime amaokwu ahụ.
translation_notes:
  register: E ji Igbo Izugbe dị ugbu a, nke dị ugwu ma dị mfe nghọta. “Nna n’onwe ya” na-edobe nkwusi ike nke Grik, ebe “si n’ebe Chineke nọ bịa” na-echekwa ohere nghọta dị n’okwu mmalite na ozi Jizọs.
