  to: N’ihi na Nna n’onwe ya hụrụ unu n’anya, n’ihi na unu ahụwo m n’anya ma ekwerela na m si n’ebe Chineke nọ bịa[a].
  rationale: The revision retains the draft’s faithful, natural rendering of Jesus’ origin in relation to God, while replacing “kwerekwa” with “ekwerela” to represent the source perfect more clearly. The note is recast in smoother Standard Igbo and preserves the alternative sense of coming from God’s presence without adding doctrinal explanation.
