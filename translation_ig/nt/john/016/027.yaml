    issue: Aspect of πεπιστεύκατε is underrepresented by “kwerekwa.”
    rationale: The Greek perfect denotes belief already held with present relevance. “Ekwerela” more clearly preserves this than the unmarked “kwerekwa.”
  - severity: low
    issue: Footnote wording is slightly awkward.
    rationale: “Okwu Grik ahụ ... igosi isi n’ebe Chineke nọ bịa” is understandable but less idiomatic than stating that it can indicate coming from God’s presence.
