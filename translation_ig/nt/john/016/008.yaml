  text: καὶ ἐλθὼν ἐκεῖνος ἐλέγξει τὸν κόσμον περὶ ἁμαρτίας καὶ περὶ δικαιοσύνης καὶ περὶ κρίσεως·
base_translation:
  language: en
  yaml_path: translation/nt/john/016/008.yaml
  text: And when that one comes[c][b][a], he will convict the world concerning sin and concerning righteousness and concerning judgment.
translation:
  language: ig
  text: Mgbe onye ahụ[a] bịara[c], ọ ga-egosi ụwa na o nwere ikpe ọmụma n’ihe banyere mmehie, n’ihe banyere ezi omume[b], nakwa n’ihe banyere ikpe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “ọ.” N’asụsụ Grik, e ji demonstrative nwere nkwusiri ike, “onye ahụ,” mee ihe; ọ na-ezo aka n’Onye Nkasi Obi ahụ na-abịa.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ “ikpe ziri ezi.”
    reason: alternative_reading
  - marker: c
    text: A pụkwara ịhazi okwu ahụ, “Mgbe ọ bịara, onye ahụ ga-egosi ụwa na o nwere ikpe ọmụma ...”
    reason: previous_rendering
lexical_decisions:
- source_word: ἐλθὼν
  choice: mgbe ... bịara
  rationale: Aorist participle ahụ nwere ike temporal; ‘mgbe ... bịara’ na-egosipụta nke a n’Igbo dị ugbu a ma ghara ịdị arọ dịka ntụgharị mkpụrụokwu n’otu n’otu.
- source_word: ἐκεῖνος
  choice: onye ahụ
  rationale: Demonstrative a nwere nkwusiri ike ma na-ezo aka n’Onye Nkasi Obi e kwuru okwu ya n’amaokwu ndị bu ụzọ. ‘Onye ahụ’ na-echekwa nkwusiri ike ahụ karịa naanị ‘ọ’.
- source_word: ἐλέγξει
  choice: ọ ga-egosi na ikpe mara
  rationale: ἐλέγχω n’ebe a pụtara igosipụta mmejọ ma ọ bụ ime ka o doo anya na onye ahụ mara ikpe. Nhọrọ a na-echekwa ike okwu metụtara omume na ikpe, ma ọ naghị agwakọta ya na ‘ikpe’ nke κρίσις.
- source_word: κόσμον
  choice: ụwa
  rationale: ‘Ụwa’ na-echekwa obosara na ụda nkà mmụta okpukpe nke κόσμος n’akwụkwọ Jọn, n’enweghị ịkọwa ya karịa ihe ederede kwuru.
- source_word: περὶ
  choice: n’ihe banyere
  rationale: E kwughachiri ya ugboro atọ iji chekwaa nhazi na ụda atọ kwekọrọ n’ederede Grik.
- source_word: ἁμαρτίας
  choice: mmehie
  rationale: Nke a bụ okwu Igbo a na-ejikarị eme ihe maka ἁμαρτία; e chekwara singular nke Grik.
- source_word: δικαιοσύνης
  choice: ezi omume
  rationale: ‘Ezi omume’ bụ ntụgharị Igbo doro anya maka δικαιοσύνη n’ebe a ma dabara n’okwu a ga-akọwa n’amaokwu nke 10. E debere ‘ikpe ziri ezi’ dịka ihe ọzọ a pụrụ ịsụgharị ya.
- source_word: κρίσεως
  choice: ikpe
  rationale: ‘Ikpe’ na-echekwa echiche iwu na nke ikpeazụ dị na κρίσις, n’enweghị ime ka ọ bụrụ naanị ‘ikpe ọmụma’ ma ọ bụ ‘ntaramahụhụ’.
theological_decisions:
- issue: Onye ἐκεῖνος na-ezo aka na ya na nkwusiri ike ya
  choice: A sụgharịrị ya ‘onye ahụ,’ nke na-ezo aka na Mmụọ/Onye Nkasi Obi ma na-echekwa nkwusiri ike demonstrative ahụ.
  alternative: A pụrụ iji naanị ‘ọ,’ hapụ nkwusiri ike ya ka a ghọta ya site n’okwu gbara ya gburugburu.
  rationale: Ihe e kwuru ozugbo tupu amaokwu a na-eme ka onye ọ na-ezo aka na ya doo anya; ntụgharị a anaghị etinye ozizi ọzọ na-abụghị ihe mkparịta ụka ahụ kwuru.
- issue: Ntụgharị δικαιοσύνη
  choice: ezi omume
  alternative: ikpe ziri ezi
  rationale: N’ebe a, ‘ezi omume’ kwekọrọ nke ọma na nkọwa gbasara Jizọs ịgakwuru Nna n’amaokwu nke 10, ebe ndetu na-echekwa echiche ọzọ nke ‘ikpe ziri ezi.’
- issue: Ike na obosara nke ἐλέγξει
  choice: ọ ga-egosi na ikpe mara ụwa
  alternative: ọ ga-ekpughe mmejọ ụwa; ọ ga-eme ka ụwa mata ikpe ọmụma ya
  rationale: Nhọrọ bụ isi na-egosipụta akụkụ nke ikpughe mmejọ na nke igosi ikpe ọmụma, ma ọ naghị ekwu kpọmkwem ma ụwa ọ ga-ekweta na ya.
translation_notes:
  register: E ji Standard Igbo nke dị ugwu ma dị mfe nghọta mee ihe. A nọgidere na nkwughachi ‘n’ihe banyere’ ugboro atọ iji chekwaa usoro okwu Grik, ma jiri ‘nakwa’ jikọta akụkụ ikpeazụ n’ụzọ na-ada nke ọma n’Igbo.
