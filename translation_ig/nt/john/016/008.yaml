revisions:
- from: Mgbe onye ahụ[a] bịara[c], ọ ga-egosi na ikpe mara ụwa n’ihe banyere mmehie, n’ihe banyere ezi omume[b], nakwa n’ihe banyere ikpe.
  to: Mgbe onye ahụ[a] bịara[c], ọ ga-egosi ụwa na o nwere ikpe ọmụma n’ihe banyere mmehie, n’ihe banyere ezi omume[b], nakwa n’ihe banyere ikpe.
  rationale: The revision replaces an unclear predicate with a natural Standard Igbo expression that communicates the evidentiary and forensic force of ἐλέγξει (“will convict/expose as guilty”). It retains the emphatic “onye ahụ,” the temporal clause, and the repeated prepositional parallelism, without resolving beyond the Greek the precise manner in which the world is convicted concerning each of the three terms.
