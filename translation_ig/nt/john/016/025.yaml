id: JHN.16.25
reference: John 16:25
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ταῦτα ἐν παροιμίαις λελάληκα ὑμῖν· ⸀ἔρχεται ὥρα ὅτε οὐκέτι ἐν παροιμίαις λαλήσω ὑμῖν ἀλλὰ παρρησίᾳ περὶ τοῦ πατρὸς ⸀ἀπαγγελῶ ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/025.yaml
  text: I have spoken these things to you in figures of speech[a]. An hour is coming when I will no longer speak to you in figures of speech[c][b], but will tell you plainly about the Father.
translation:
  language: ig
  text: Ekwuwo m ihe ndị a nye unu n’okwu atụ[a]. Oge na-abịa[b] mgbe m na-agaghịzi agwa unu okwu n’okwu atụ, kama m ga-agwa unu okwu banyere Nna n’ụzọ doro anya[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “n’ilu,” “na parabụl,” ma ọ bụ “n’okwu ezoro ezo.” Okwu Grik a na-ekwu maka okwu atụ ma ọ bụ okwu a na-ekwu n’ụzọ na-apụtachaghị ìhè.
    reason: lexical_alternative
  - marker: b
    text: N’okwu nkịtị, “Awa na-abịa.” Jọn na-ejikarị “awa” akọwa oge a kara aka nke nwere mkpa pụrụ iche.
    reason: lexical_alternative
  - marker: c
    text: A pụkwara ịsị, “n’ụzọ ghe oghe” ma ọ bụ “n’ezoghị ọnụ.” N’ebe a, ọ pụtara okwu kpọmkwem nke na-abụghị okwu atụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: παροιμίαις
  choice: n’okwu atụ
  rationale: N’ọnọdụ a dị na Jọn, okwu Grik a pụtara okwu e ji atụ ihe ma ọ bụ okwu a na-ekwu n’ụzọ na-apụtachaghị ìhè, ọ bụghị naanị ilu ma ọ bụ parabụl dịka ụdị akụkọ pụrụ iche.
- source_word: λελάληκα
  choice: Ekwuwo m
  rationale: Ụdị ngwaa zuru ezu na Grik na-egosi ihe Jizọs kwuworo nke ka metụtara ndị na-ege ya ntị ugbu a.
- source_word: ἔρχεται ὥρα
  choice: Oge na-abịa
  rationale: Nke a bụ ụzọ Igbo si ekwu echiche ahụ n’ụzọ ebumpụta ụwa; ihe e dere n’okpuru na-edebe okwu nkịtị ‘awa’ na uru pụrụ iche ọ na-enwe n’akwụkwọ Jọn.
- source_word: οὐκέτι
  choice: na-agaghịzi
  rationale: Nke a na-egosi nke ọma na ụzọ ahụ o si agwa ha okwu ga-akwụsị.
- source_word: λαλήσω
  choice: m ga-agwa unu okwu
  rationale: Nke a na-edebe echiche nke ikwu okwu ma jikọta ya na ngwaa e ji malite amaokwu ahụ.
- source_word: παρρησίᾳ
  choice: n’ụzọ doro anya
  rationale: N’ebe a, okwu ahụ na-emegide okwu atụ; ya mere isi ihe bụ ikwu okwu n’ụzọ ghe oghe ma doo anya, ọ bụghị obi ike n’ikwu okwu.
- source_word: ἀπαγγελῶ
  choice: m ga-agwa unu okwu
  rationale: N’ọnọdụ a ọ pụtara ime ka ha mara ihe banyere Nna n’ụzọ kpọmkwem; ntụgharị a dị mfe ma kwekọọ na Igbo nke oge a.
- source_word: περὶ τοῦ πατρὸς
  choice: banyere Nna
  rationale: Nke a na-egosipụta isiokwu nke okwu Jizọs ma na-edebe aha mmekọrịta ahụ e ji akọwa Chineke n’akwụkwọ Jọn.
theological_decisions:
- issue: Ntụgharị ὥρα n’akwụkwọ Jọn
  choice: Oge na-abịa
  alternative: Oge awa na-abịa; otu awa na-abịa
  rationale: ‘Oge na-abịa’ bụ Igbo doro anya ma kwekọọ n’ọrụ ὥρα dịka oge a kara aka. Ihe e dere n’okpuru na-echekwa eziokwu ahụ na okwu Grik bụ ‘awa,’ nke na-enwekarị mkpa pụrụ iche n’akwụkwọ Jọn.
- issue: Ihe παρρησίᾳ pụtara mgbe e jiri ya megide ἐν παροιμίαις
  choice: n’ụzọ doro anya
  alternative: n’ụzọ ghe oghe; n’atụghị egwu
  rationale: Ihe amaokwu a na-emesi ike bụ mgbanwe site n’okwu atụ gaa n’okwu kpọmkwem. Ọ naghị achọ ka a tụgharịa ya dịka obi ike n’ihu mmegide.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. ‘Okwu atụ’ na-echekwa ọdịiche dị n’etiti okwu na-apụtachaghị ìhè na okwu doro anya; a zere ‘parabụl’ n’ahịrị bụ isi ka a ghara ime ka ụdị okwu ahụ bụrụ naanị akụkọ parabụl. A họọrọ ‘Oge na-abịa’ maka ịdị ebumpụta ụwa n’Igbo, ebe ihe e dere n’okpuru na-echekwa okwu ‘awa’ na ụda pụrụ iche ya n’akwụkwọ Jọn.
