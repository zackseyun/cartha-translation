id: JHN.16.15
reference: John 16:15
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: πάντα ὅσα ἔχει ὁ πατὴρ ἐμά ἐστιν· διὰ τοῦτο εἶπον ὅτι ἐκ τοῦ ἐμοῦ λαμβάνει καὶ ἀναγγελεῖ ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/015.yaml
  text: Everything that the Father has is mine[a]. That is why I said that he takes from what is mine and will declare it to you.
translation:
  language: ig
  text: Ihe niile Nna nwere bụ nke m. Ọ bụ ya mere m ji kwuo na ọ na-anata[a] ihe sitere n’ihe bụ nke m, ma mee ka unu mara ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “na-ewere.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα ὅσα
  choice: Ihe niile
  rationale: Nkebiokwu a na-egosi ihe niile n’enweghị nke fọdụrụ; “Ihe niile” bụ Igbo dị mfe ma na-echekwa ike zuru ezu nke okwu Grik ahụ.
- source_word: ἔχει
  choice: nwere
  rationale: “Nwere” bụ ntụgharị kpọmkwem na nke a na-ejikarị eme ihe maka ἔχω n’ebe a.
- source_word: ὁ πατήρ
  choice: Nna
  rationale: N’ọnọdụ a, “Nna” bụ aha e ji kpọọ Chineke, ya mere e ji mkpụrụedemede ukwu malite ya.
- source_word: ἐμά ἐστιν
  choice: bụ nke m
  rationale: Nke a na-egosipụta inwe ihe n’ụzọ doro anya ma na-echekwa nkwupụta siri ike na ihe niile Nna nwere bụ nke Ọkpara.
- source_word: διὰ τοῦτο
  choice: Ọ bụ ya mere
  rationale: Ọ bụ njikọ Igbo e ji egosi ihe mere okwu so ya ji bụrụ eziokwu, kwekọrọ n’ọrụ nkebiokwu Grik a.
- source_word: εἶπον
  choice: m ji kwuo
  rationale: Oge gara aga dabara na aorist εἶπον, ebe usoro “mere ... ji” chọrọ ụdị “kwuo” n’Igbo.
- source_word: ἐκ τοῦ ἐμοῦ
  choice: ihe sitere n’ihe bụ nke m
  rationale: Nke a na-eme ka echiche isi mmalite dị na ἐκ pụta ìhè ma na-edobe okwu Grik ahụ na-akọwaghị kpọmkwem ihe ahụ ọ bụ.
- source_word: λαμβάνει
  choice: na-ewere
  rationale: “Na-ewere” na-echekwa otu isi nghọta λαμβάνω, ebe “na-anata” ka edobere na nkọwa ala peeji iji chekwaa nghọta ọzọ okwu Grik ahụ nwere.
- source_word: ἀναγγελεῖ
  choice: ọ ga-emekwa ka unu mara ya
  rationale: Nke a na-echekwa ọdịnihu nke ngwaa ahụ ma na-egosipụta ime ka ndị na-ege ntị mata ihe e kpughere, n’Igbo nkịtị ma dị ùgwù.
- source_word: ὑμῖν
  choice: unu
  rationale: “Unu” bụ nnọchiaha Igbo nke ọtụtụ mmadụ, dabara na ndị na-eso ụzọ Jizọs a na-agwa okwu.
theological_decisions:
- issue: Mmekọrịta dị n’etiti ihe Nna nwere na Ọkpara
  choice: Ihe niile Nna nwere bụ nke m
  alternative: Ihe niile Nna nwere nwekwara m
  rationale: Nhọrọ a na-echekwa nkwupụta siri ike nke amaokwu ahụ banyere ihe niile Nna nwere ịbụ nke Ọkpara, n’etinyeghị okwu nkà mmụta okpukpe ndị na-adịghị n’ederede.
- issue: Mmụọ na-ewere ma ọ bụ na-anata ihe sitere n’ihe bụ nke Ọkpara
  choice: na-ewere
  alternative: na-anata
  rationale: λαμβάνει nwere ike ịpụta “were” ma ọ bụ “nata.” E debere “na-ewere” n’ederede isi ma tinye “na-anata” na nkọwa ala peeji ka a ghara ikpebi ihe okwu Grik ahụ hapụrụ ka ọ nwee nghọta abụọ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe ma dị ùgwù, mee ntụgharị a. E zere okwu ụka pụrụ iche, ma chekwaa usoro arụmụka na ihe na-edoghị anya nke ederede Grik.
