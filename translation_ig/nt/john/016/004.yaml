id: JHN.16.4
reference: John 16:4
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀλλὰ ταῦτα λελάληκα ὑμῖν ἵνα ὅταν ἔλθῃ ἡ ὥρα ⸀αὐτῶν μνημονεύητε ⸁αὐτῶν ὅτι ἐγὼ εἶπον ὑμῖν. Ταῦτα δὲ ὑμῖν ἐξ ἀρχῆς οὐκ εἶπον, ὅτι μεθ’ ὑμῶν ἤμην.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/004.yaml
  text: But I have spoken these things to you so that when their hour comes[a], you may remember that I told you. But I did not tell you these things from the beginning, because I was with you.
translation:
  language: ig
  text: Ma agwala m unu ihe ndị a ka, mgbe oge ha ruru[a], unu cheta na m gwara unu. Ma agwaghị m unu ihe ndị a site ná mmalite, n’ihi na anọ m na unu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ, n’ụzọ na-esochi Grik nso karị: “mgbe oge ha ruru, unu cheta ha—na m gwara unu.” N’asụsụ Grik, αὐτῶν, nke nwere ike ịpụta “ha” ma ọ bụ “nke ha,” pụtara ugboro abụọ. Ọ na-esiri ike igosipụta ha abụọ n’Igbo n’enweghị ime ka ahịrịokwu sie ike.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λελάληκα
  choice: agwala m
  rationale: Ụdị perfect na-egosi okwu e kwuworo nke ka dị mkpa ugbu a; ‘agwala m’ na-egosipụta nke a n’Igbo nkịtị.
- source_word: ταῦτα
  choice: ihe ndị a
  rationale: Ọ bụ demonstrative plural na-ezo aka n’ịdọ aka ná ntị ndị Jizọs kwuru tupu nke a.
- source_word: ἵνα
  choice: ka ... wee
  rationale: Usoro a na-egosi ebumnuche n’Igbo n'ụzọ doro anya ma dịkwa eke.
- source_word: ὅταν ἔλθῃ ἡ ὥρα αὐτῶν
  choice: mgbe oge ha ruru
  rationale: ‘Oge ha’ na-echekwa genitive αὐτῶν na-enweghị ịkọwa kpọmkwem ihe ma ọ bụ ndị ọ na-ezo aka na ha; ‘ruru’ na-egosi oge a kara aka nke na-abịa.
- source_word: μνημονεύητε
  choice: unu wee cheta
  rationale: ‘Cheta’ bụ okwu Igbo kachasị doo anya maka icheta ihe e kwuru.
- source_word: ὅτι ἐγὼ εἶπον ὑμῖν
  choice: na m gwara unu
  rationale: ‘Gwara unu’ bụ ụzọ Igbo dị eke isi kwuo na onye ahụ kwuru ihe nye ha.
- source_word: ἐξ ἀρχῆς
  choice: site ná mmalite
  rationale: Nke a na-echekwa echiche nke ‘from the beginning,’ ọ bụghị naanị ‘na mbụ.’
- source_word: μεθ’ ὑμῶν ἤμην
  choice: mụ na unu nọ
  rationale: Ọ bụ nsụgharị kwụ ọtọ ma dị eke nke mmekọrịta na ọnụnọ ahụ.
theological_decisions:
- issue: Ihe αὐτῶν nke mbụ na nke abụọ na-ezo aka na ya
  choice: E debere nke mbụ dịka ‘oge ha,’ ebe a kọwara nke abụọ n’ala ala peeji kama ịtinye nnọchiaha ọzọ ga-eme ka ahịrịokwu Igbo sie ike.
  alternative: ‘Mgbe oge ha ruru, unu wee cheta ha, na m gwara unu.’
  rationale: SBLGNT nwere αὐτῶν ugboro abụọ, ma onye ma ọ bụ ihe ha na-ezo aka na ya edoghị anya kpamkpam. Isi ederede na-adị eke n’Igbo, ebe nkọwa ala ala peeji na-echekwa nhazi na mgbagwoju anya nke Grik.
translation_notes:
  register: Asụsụ Igbo Izugbe dị ugbu a, dị ùgwù ma dị mfe nghọta. E jiri ‘oge’ kama okwu nkịtị maka elekere, n’ihi na ὥρα n’ebe a na-ekwu maka oge a kara aka. Akara ala ala peeji [a] dị n’isi ederede.
