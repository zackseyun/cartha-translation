id: JHN.16.7
reference: John 16:7
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀλλ’ ἐγὼ τὴν ἀλήθειαν λέγω ὑμῖν, συμφέρει ὑμῖν ἵνα ἐγὼ ἀπέλθω. ἐὰν ⸀γὰρ μὴ ἀπέλθω, ὁ παράκλητος ⸂οὐ μὴ ἔλθῃ⸃ πρὸς ὑμᾶς· ἐὰν δὲ πορευθῶ, πέμψω αὐτὸν πρὸς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/007.yaml
  text: 'But I am telling you the truth: it is better for you that I go away. For if I do not go away[a], the Advocate will certainly not come to you; but if I go, I will send him to you.'
translation:
  language: ig
  text: 'Ma ana m agwa unu eziokwu: ọ kaara unu mma ka m laa. N’ihi na ọ bụrụ na m alaghị, Onye Nkwado[a] agaghị abịakwute unu ma ọlị; ma ọ bụrụ na m gaa, m ga-ezitere unu ya.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ “Onye Enyemaka,” “Onye Ndụmọdụ,” ma ọ bụ “Onye Nkasi Obi”; okwu Grik bụ Paraklitos.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: Ma
  rationale: Ọ na-egosi ọdịiche dị n’etiti mwute ndị na-eso ụzọ ahụ na eziokwu Jizọs na-agwa ha; “Ma” bụ okwu Igbo dị mfe ma kwekọọ n’ebe a.
- source_word: τὴν ἀλήθειαν λέγω ὑμῖν
  choice: ana m agwa unu eziokwu
  rationale: Nke a na-edobe nkwupụta siri ike na ihe ọ na-ekwu bụ eziokwu, n’Igbo nkịtị nke oge a.
- source_word: συμφέρει ὑμῖν
  choice: ọ kaara unu mma
  rationale: Ọ na-egosi ihe ga-abara ha uru ma ọ bụ ka mma nye ha; okwu a bụ nke a na-aghọta ngwa ngwa n’Igbo.
- source_word: ἵνα ἐγὼ ἀπέλθω
  choice: ka m laa
  rationale: Ọ na-egosi ihe bụ uru ahụ—ọpụpụ Jizọs—ma na-edobe ụzọ okwu dị nkenke ma bụrụ nke eke n’Igbo.
- source_word: ἐὰν γὰρ μὴ ἀπέλθω
  choice: N’ihi na ọ bụrụ na m alaghị
  rationale: “N’ihi na” na-egosipụta nkọwa γάρ, ebe “ọ bụrụ na … alaghị” na-edobe ọnọdụ na nkwughachi nke ngwaa ἀπέρχομαι.
- source_word: ὁ παράκλητος
  choice: Onye Nkwado
  rationale: Aha a na-egosi onye na-anọchite anya, na-akwado, ma na-enyere onye ọzọ aka. “Onye Nkwado” na-edobe akụkụ ahụ nke ihe okwu Grik pụtara, ebe e debere nkọwa ndị ọzọ n’ala peeji.
- source_word: οὐ μὴ ἔλθῃ
  choice: agaghị abịakwute unu ma ọlị
  rationale: “Ma ọlị” na-egosipụta nkwusiri ike nke njụ emphatic οὐ μή n’Igbo doro anya.
- source_word: πρὸς ὑμᾶς
  choice: abịakwute unu
  rationale: Ọ na-egosipụta ije bịaruo ndị na-eso ụzọ ahụ nso, dịka πρός ya na ebumnobi ya si dị.
- source_word: ἐὰν δὲ πορευθῶ
  choice: ma ọ bụrụ na m gaa
  rationale: Ọ na-edobe ọnọdụ nke abụọ na ọdịiche δέ na-egosi, n’asụsụ Igbo eke.
- source_word: πέμψω αὐτὸν πρὸς ὑμᾶς
  choice: m ga-ezitere unu ya
  rationale: Nke a na-egosipụta iziga Onye Nkwado ahụ ka ọ bịakwute ha. “Ya” bụ nnọchiaha Igbo maka onye a kpọtụrụ aha, ọ dịghịkwa eme ka ọ bụrụ ike na-enweghị ụdị onye.
theological_decisions:
- issue: Nsụgharị παράκλητος n’okwu Jọn
  choice: Onye Nkwado
  alternative: Onye Enyemaka; Onye Ndụmọdụ; Onye Nkasi Obi; Paraklitos
  rationale: Ọ dịghị otu okwu Igbo nke na-ekpuchi akụkụ niile nke παράκλητος. “Onye Nkwado” na-egosipụta ọrụ onye na-anọchite anya ma na-akwado, ebe nkọwa ala peeji na-echekwa obosara ihe okwu ahụ nwere ike ịpụta.
- issue: Ịkpọ Onye Nkwado ahụ dịka onye
  choice: ya, nke na-alaghachi na “Onye Nkwado”
  alternative: nsụgharị ga-eme ka ọ dị ka ihe ma ọ bụ ike na-enweghị ụdị onye
  rationale: Akụkụ Akwụkwọ Nsọ a na-egosi Onye Nkwado ahụ dịka onye a na-eziga na onye na-abịa. Ọ bụ ezie na nnọchiaha Igbo “ya” enweghị okike nwoke ma ọ bụ nwanyị, okwu “Onye Nkwado” na usoro ahịrịokwu ahụ na-echekwa nkwupụta a banyere onye.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta mee nsụgharị ahụ. E debere nkwughachi nke “ịla/ịga,” ọnọdụ abụọ ahụ, na nkwusiri ike dị na οὐ μή. E tinyere akara ala peeji ozugbo n’azụ “Onye Nkwado,” bụ okwu ọ na-akọwa.
