  text: ἐγώ σε ἐδόξασα ἐπὶ τῆς γῆς, τὸ ἔργον ⸀τελειώσας ὃ δέδωκάς μοι ἵνα ποιήσω·
base_translation:
  language: en
  yaml_path: translation/nt/john/017/004.yaml
  text: I glorified you on the earth by completing the work that you have given me to do[a].
translation:
  language: ig
  text: M nyere gị otuto n’elu ụwa site n’ịrụcha ọrụ ahụ i nyere m ka m rụọ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Mgbe m rụchara ọrụ ahụ i nyere m ka m rụọ, enyere m gị otuto n’elu ụwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδόξασα
  choice: nyere ... otuto
  rationale: Nke a na-egosipụta echiche Jọn banyere ime ka otuto nke onye ọzọ pụta ìhè, ma bụrụkwa okwu Igbo doro anya ma dị ùgwù.
- source_word: ἐπὶ τῆς γῆς
  choice: n’elu ụwa
  rationale: Ọ na-echekwa nghọta ebe nke ἐπί na γῆ ma na-ada ka Igbo nkịtị.
- source_word: τελειώσας
  choice: site n’ịrụcha
  rationale: Ọ na-egosi participle ahụ dị ka ụzọ Jizọs si nye Nna ya otuto, dịka usoro okwu Grik si kwekọọ nke ọma.
- source_word: τὸ ἔργον
  choice: ọrụ ahụ
  rationale: ‘Ọrụ’ bụ ntụgharị sara mbara ma dabara n’ozi Nna nyere Jizọs; ‘ahụ’ na-egosipụta article Grik.
- source_word: δέδωκάς μοι
  choice: i nyere m
  rationale: Igbo anaghị egosipụta perfect aspect n’ụzọ Bekee si eme ya; ọdịdị a na-ekwupụta omume e mere nke ka dị mkpa n’ọnọdụ a.
- source_word: ἵνα ποιήσω
  choice: ka m rụọ
  rationale: Nke a na-egosipụta nzube ma ọ bụ ọrụ e nyere ya ka o mee n’Igbo dị mfe ma bụrụ ihe mmadụ na-ekwu ugbu a.
- source_word: ἐγώ σε
  choice: M ... gị
  rationale: Isiokwu ahụ pụtara ìhè n’aha nnọchiaha Igbo; itinye okwu dịka ‘mụ onwe m’ ga-emesi ya ike karịa ihe ederede chọrọ.
theological_decisions:
- issue: Mmekọrịta dị n’etiti inye Nna otuto na participle τελειώσας
  choice: 'A sụgharịrị participle ahụ dị ka ụzọ: Jizọs nyere Nna otuto site n’ịrụcha ọrụ ahụ.'
  alternative: 'A pụkwara ịghọta ya dịka ‘mgbe m rụchara ọrụ ahụ’ ma ọ bụ ‘anyị jikọta okwu abụọ ahụ: M nyere gị otuto...; arụchakwara m ọrụ ahụ.’'
  rationale: Usoro okwu Grik na-akwado nghọta nke ụzọ, ma nkọwa ọzọ ka kwe omume; ya mere e tinyere ya na nkọwa ala peeji kama ikpochapụ nghọta ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. ‘Site n’ịrụcha’ na-eme ka njikọ syntax pụta ìhè, ebe nkọwa ala peeji na-echekwa nghọta participle ọzọ.
