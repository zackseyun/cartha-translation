id: JHN.17.21
reference: John 17:21
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἵνα πάντες ἓν ὦσιν, καθὼς σύ, ⸀πάτερ, ἐν ἐμοὶ κἀγὼ ἐν σοί, ἵνα καὶ αὐτοὶ ἐν ⸀ἡμῖν ὦσιν, ἵνα ὁ κόσμος ⸀πιστεύῃ ὅτι σύ με ἀπέστειλας.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/021.yaml
  text: that they may all be one[a], just as you, Father, are in me and I am in you; that they also may be in us[c][b], so that the world may believe that you sent me.
translation:
  language: ig
  text: ka ha niile bụrụ otu[a], dị ka gị, Nna, nọ n’ime m, na m nọ n’ime gị; ka ha kwa nọ n’ime anyị[b], ka ụwa wee kwere[c] na ọ bụ gị zitere m.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ka ha niile dịrị n’otu.” Grik kwuru n’ụzọ ka kpọmkwem, “ka ha niile bụrụ otu,” nke na-echekwa echiche zuru ezu banyere ịbụ otu n’emeghị ka ọ bụrụ naanị otu akụkụ ya.
    reason: lexical_alternative
  - marker: b
    text: Okwu “n’ime” a na-ekwughachi—“n’ime m,” “n’ime gị,” na “n’ime anyị”—na-egosipụta asụsụ Jọn banyere ịdị n’ime ibe na isonye; ọ karịrị nanị ịnọkọ ma ọ bụ iso ibe nwee mmekọrịta.
    reason: cross_reference
  - marker: c
    text: Ma ọ bụ, “ka ụwa wee malite ikwere.” Grik nwere ike izo aka n’ụwa ikwere, ma ọ naghị ekwu hoo haa ma ihe e mesiri ike bụ ịmalite ikwere ka ọ bụ ịnọgide na-ekwere.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: ka / ka ... wee
  rationale: Amaokwu ahụ ji ἵνα ugboro atọ. “Ka” na-echekwa usoro arịrịọ na ebumnuche ahụ, ebe “ka ... wee” n’ahịrị ikpeazụ na-egosi n’Igbo dị ire ụtọ ihe ga-esi na ya pụta n’emeghị ka njikọ ahụ ghọọ naanị nsonaazụ.
- source_word: πάντες
  choice: ha niile
  rationale: Nke a na-egosi n'ụzọ doro anya na ekpere ahụ gbasara ha niile, ma bụrụkwa okwu Igbo nkịtị ma dị nkenke.
- source_word: ἓν
  choice: otu
  rationale: “Otu” na-echekwa okwu Grik ahụ n’ụzọ sara mbara, kama ịkọwa ya naanị dị ka ịdị n’otu n’ebumnuche, n’usoro, ma ọ bụ n’echiche.
- source_word: καθὼς
  choice: dị nnọọ ka
  rationale: Nke a na-eme ka ntụnyere dị n’etiti ịbụ otu nke ndị kwere ekwe na mmekọrịta Nna na Ọkpara pụta ìhè.
- source_word: πάτερ
  choice: Nna
  rationale: A hapụrụ okwu ịkpọku Nna ozugbo dịka ọ dị n’isi mmalite, n’ihi uru mmekọrịta na nke nkà mmụta okpukpe dị na ya.
- source_word: ἐν ἐμοὶ ... ἐν σοί
  choice: n’ime m ... n’ime gị
  rationale: E ji “n’ime” sụgharịa ἐν ugboro abụọ iji chekwaa asụsụ Jọn banyere ịdị n’ime ibe, kama ime ka ọ bụrụ naanị ịnọnyere ibe.
- source_word: κἀγώ
  choice: mụ onwe m anọkwa
  rationale: “Mụ onwe m” kwekọrọ na nrụgide dị n’aha nnọchiaha ahụ, ebe “-kwa” na-echekwa njikọ na nnọkọ reciprocity nke κἀγώ.
- source_word: καὶ αὐτοὶ
  choice: ha onwe ha ... kwa
  rationale: Nke a na-echekwa ma nrụgide dị na αὐτοί ma ike mgbakwunye nke καί, na-ejikọta ndị na-eso ụzọ na mmekọrịta a kpọtụrụ aha.
- source_word: ἐν ἡμῖν
  choice: n’ime anyị
  rationale: “N’ime anyị” na-agbaso Grik kpọmkwem ma na-echekwa echiche Jọn banyere isonye na ịdị n’ime, nke “n’etiti anyị” ga-eme ka ọ daa mba.
- source_word: κόσμος
  choice: ụwa
  rationale: “Ụwa” bụ okwu Igbo dị nkenke nke na-echekwa oke na ịdị omimi nke κόσμος n’akwụkwọ Jọn, kama ịkọwara ya naanị dị ka ndị mmadụ bi n’ụwa.
- source_word: πιστεύῃ
  choice: wee kwere
  rationale: Nke a na-egosipụta subjunctive dị n’okpuru ἵνα n’enweghị ịgbakwunye n’isi okwu ma ọ bụ nkwenye ahụ na-amalite ugbu a ma ọ bụ na-aga n’ihu.
- source_word: ἀπέστειλας
  choice: zitere
  rationale: Oge gara aga dị mfe bụ ụzọ Igbo ebumpụta ụwa si kwuo aorist a ma na-ezuru echiche iziga ahụ n’ahịrịokwu a.
theological_decisions:
- issue: Ụdị ịbụ otu nke ndị kwere ekwe ma e jiri ya tụnyere Nna na Ọkpara
  choice: E ji “bụrụ otu” mee ἓν, ma hapụkwa “n’ime anyị” n’enweghị nkọwa agbakwunyere.
  alternative: “dịrị n’otu” ma ọ bụ “bụrụ otu n’ebumnuche”
  rationale: Akwụkwọ nsọ na-atụnyere ịbụ otu nke ndị kwere ekwe na mmekọrịta Nna na Ọkpara, ma ọ kọwaghị ya naanị dị ka ịdị n’otu n’usoro, n’omume, n’ebumnuche, ma ọ bụ n’ụdị ịdị adị. Nsụgharị a na-echekwa ịdị omimi na esemokwu nkà mmụta okpukpe ahụ n’enweghị itinye nkọwa otu òtù okpukpe.
- issue: Asụsụ Jọn banyere ịdị n’ime ibe
  choice: Jiri “n’ime m,” “n’ime gị,” na “n’ime anyị.”
  alternative: “nyere m / gị / anyị” ma ọ bụ “dịrị n’otu na anyị”
  rationale: Ntughari ἐν ugboro ugboro bụ akụkụ dị mkpa nke okwu Jọn banyere ịdị n’ime ibe na isonye. Ịgbanwe ya ka ọ bụrụ naanị ịnọnyere ga-ebelata ike ya ma dozie ihe isi mmalite ahụ hapụrụ ka ọ sara mbara.
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. “Nọ n’ime” na “anọkwa n’ime” bụ okwu ebumpụta ụwa nke na-echekwa ike nke asụsụ ịdị n’ime ibe; “gị onwe gị,” “mụ onwe m,” na “ha onwe ha” na-egosipụta nrụgide dị n’aha nnọchiaha Grik n’enweghị ime ka ahịrịokwu ghara ịdị ire ụtọ. E debere akara nkọwa [a], [b], na [c] kpọmkwem n’ebe okwu ha na-akọwa dị.
