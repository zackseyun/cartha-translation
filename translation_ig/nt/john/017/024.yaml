id: JHN.17.24
reference: John 17:24
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸀πάτερ, ⸀ὃ δέδωκάς μοι, θέλω ἵνα ὅπου εἰμὶ ἐγὼ κἀκεῖνοι ὦσιν μετ’ ἐμοῦ, ἵνα θεωρῶσιν τὴν δόξαν τὴν ἐμὴν ἣν ⸀δέδωκάς μοι, ὅτι ἠγάπησάς με πρὸ καταβολῆς κόσμου.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/024.yaml
  text: Father[a], I desire that those whom you have given me also may be with me where I am, so that they may see my glory that you have given me, because you loved me before the foundation of the world.
translation:
  language: ig
  text: Nna,[a] achọrọ m ka ndị i nyere m sokwa m nọrọ ebe m nọ, ka ha wee hụ ebube m nke i nyere m, n’ihi na ị hụrụ m n’anya tupu a tọọ ntọala ụwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’asụsụ Grik, okwu ahụ pụtara kpọmkwem, “ihe ahụ i nyere m.” A na-eji ya eme mkpokọta maka ndị Nna nyere Ọkpara; ya mere e ji sụgharịa ya, “ndị i nyere m.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πάτερ
  choice: Nna
  rationale: Ọ bụ okwu a na-akpọ Chineke ozugbo; “Nna” bụ nsụgharị Igbo doro anya ma dị ùgwù, na-etinyeghị “nke m” nke na-adịghị na Grik.
- source_word: ὃ δέδωκάς μοι
  choice: ndị i nyere m
  rationale: Ọ bụ ezie na ὃ bụ nnọchiaha otu nke ụdị na-adịghị egosi nwoke ma ọ bụ nwaanyị, e ji ya mee mkpokọta maka ndị Nna nyere Ọkpara; nnọchiaha na ngwaa ọtụtụ sochirinụ na-egosi na ọ na-ekwu banyere ndị mmadụ.
- source_word: δέδωκάς
  choice: i nyere
  rationale: Igbo anaghị egosipụta perfect tense dịka Grik; “i nyere” na-egosi omume e mere, ebe ihe ndị gbara ya gburugburu na-egosi na nsonaazụ ya ka dị.
- source_word: θέλω
  choice: achọrọ m
  rationale: N’ọnọdụ ekpere a, “achọrọ m” na-egosipụta ọchịchọ siri ike na-enweghị ịgbanwe ya ka ọ bụrụ naanị iwu ma ọ bụ okwu banyere ọdịnihu.
- source_word: ἵνα
  choice: ka / ka ... wee
  rationale: Nke mbụ na-ewebata ihe Jizọs chọrọ; nke abụọ na-egosi ebumnuche ya. Ụdị abụọ a bụ Igbo nkịtị ma na-echekwa njikọ ahịrịokwu Grik.
- source_word: ὅπου εἰμὶ ἐγὼ
  choice: ebe m nọ
  rationale: Nke a bụ ụzọ Igbo dị mfe ma kwụ ọtọ isi kwuo ọnọdụ ahụ; mkpụrụokwu gbara ya gburugburu na-eme ka onye “m” pụta ìhè.
- source_word: κἀκεῖνοι ὦσιν μετ’ ἐμοῦ
  choice: ndị i nyere m nọnyekwaara m
  rationale: “Nọnyekwaara m” na-echekwa echiche nke ịnọnyere ya yana ike mgbakwunye dị na κἀκεῖνοι, ‘ha onwe ha kwa.’
- source_word: θεωρῶσιν
  choice: hụ
  rationale: “Hụ” bụ okwu Igbo a na-aghọta nke ọma ma kwekọọ na echiche ịhụ ma ọ bụ ile ebube ahụ anya.
- source_word: τὴν δόξαν τὴν ἐμὴν
  choice: ebube m
  rationale: Nke a bụ usoro Igbo ebumpụta ụwa nke na-echekwa na ebube ahụ bụ nke Ọkpara.
- source_word: ἣν δέδωκάς μοι
  choice: nke i nyere m
  rationale: Nkebi ahịrịokwu a na-akọwa ebube ahụ kpọmkwem, na-ejigide omume Nna nke inye ya Ọkpara.
- source_word: ὅτι
  choice: n’ihi na
  rationale: 'N’ebe a, ọ na-ewebata ihe kpatara inye ebube ahụ: ịhụnanya Nna nwere n’ebe Ọkpara nọ tupu e kee ụwa.'
- source_word: ἠγάπησάς με
  choice: ị hụrụ m n’anya
  rationale: Oge gara aga dabara na aorist Grik ma jikọta nke ọma na nkebi oge na-esochi ya.
- source_word: πρὸ καταβολῆς κόσμου
  choice: tupu a tọọ ntọala ụwa
  rationale: Nsụgharị a na-echekwa ihe oyiyi Grik nke ‘ịtọ ntọala ụwa’ na nkwupụta oge tupu okike.
theological_decisions:
- issue: Ịdị adị Ọkpara tupu okike, nke ịhụnanya Nna tupu ịtọ ntọala ụwa na-egosi
  choice: 'E chekwara nkwupụta oge ahụ n''ụzọ kwụ ọtọ: “ị hụrụ m n’anya tupu a tọọ ntọala ụwa.”'
  alternative: Ịkọwa ya n'ụzọ ihe atụ ma ọ bụ ime ka ntụaka ahụ banyere oge tupu okike ghara ịdị ike.
  rationale: Grik na-ekwu okwu oge n'ụzọ doro anya. Nsụgharị ahụ ekwesịghị ime ka nkwupụta a dị nro ma ọ bụ tinye nkọwa ozizi ọzọ.
- issue: Ike θέλω n’ekpere Jizọs
  choice: “achọrọ m”
  alternative: “ana m ekpebi” ma ọ bụ okwu iwu siri ike karị
  rationale: “Achọrọ m” na-echekwa ọchịchọ na uche Jizọs, ma ghara idozi esemokwu dị n’etiti ọchịchọ siri ike na ụdị ekpere ka ọ bụrụ iwu.
- issue: Ihe kpatara e ji nye Ọkpara ebube
  choice: E sụgharịrị ὅτι dịka “n’ihi na,” na-ejigide njikọ kpatara ya na ịhụnanya Nna.
  alternative: Ịsụgharị ya dịka “na” ma hapụ njikọ kpatara ya ka ọ ghara ido anya.
  rationale: N’ọnọdụ a, ὅτι kacha kwekọọ na nkọwa ihe kpatara ya, ma nsụgharị ahụ anaghị agbakwunye nkọwa banyere ụdị ma ọ bụ oge inye ebube ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “Tọọ ntọala ụwa” na-echekwa ihe oyiyi mbụ n’asụsụ Grik, ebe “nọnyekwaara m” na-eme ka ike ‘kwa’ dị na κἀκεῖνοι pụta n’Igbo nkịtị.
