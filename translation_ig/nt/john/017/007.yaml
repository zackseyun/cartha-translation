  text: νῦν ἔγνωκαν ὅτι πάντα ὅσα ⸀δέδωκάς μοι παρὰ σοῦ ⸀εἰσιν·
base_translation:
  language: en
  yaml_path: translation/nt/john/017/007.yaml
  text: Now they have come to know that everything you have given me is from you[a].
translation:
  language: ig
  text: Ugbu a, ha amatala na ihe niile i nyeworo m sitere n’aka gị.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ihe niile i nyeworo m si n’aka gị.”
    reason: lexical_alternative
lexical_decisions:
- source_word: νῦν
  choice: Ugbu a
  rationale: Na-egosi oge na ọnọdụ nghọta ndị na-eso ụzọ ruru ugbu a.
- source_word: ἔγνωκαν
  choice: ha amatala
  rationale: Ụdị perfect nke γινώσκω na-egosi na ha bịara mata ya, ihe ahụ ha matara ka dịkwa n’uche ha ugbu a.
- source_word: ὅτι
  choice: na
  rationale: Njikọ a na-ewebata ọdịnaya nke ihe ha matara.
- source_word: πάντα ὅσα
  choice: ihe niile
  rationale: Na-egosipụta mkpokọta ihe nile n'ụzọ Igbo dị mfe ma kwekọọ n’echiche okwu Grik.
- source_word: δέδωκάς μοι
  choice: i nyere m
  rationale: Igbo na-eji ụdị a ekwu ihe e nyere nke ka nwere mkpa ugbu a; ‘m’ bụ onye natara ya.
- source_word: παρὰ σοῦ εἰσιν
  choice: si n’aka gị bịa
  rationale: Παρά na genitive na-egosi isi mmalite; okwu Igbo a na-akọwa na ihe ndị ahụ sitere n’aka Nna.
theological_decisions:
- issue: Mmekọrịta dị n’etiti ihe Nna nyere Ọkpara na ebe ha si
  choice: ihe niile i nyere m si n’aka gị bịa
  alternative: ihe niile i nyere m bụ nke si n’aka gị
  rationale: Ntụgharị a na-edobe nkwupụta banyere Nna ịbụ isi mmalite nke ihe Ọkpara natara, n’etinyeghị nkọwa ozizi ọzọ na-adịghị n’amaokwu ahụ.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị ugbu a ma nwee nsọpụrụ; ‘amatala’ na-eburu nsonaazụ dị ugbu a nke perfect, ebe ‘si n’aka gị bịa’ na-ekwupụta isi mmalite n'ụzọ ndị mmadụ na-aghọta ngwa ngwa.
