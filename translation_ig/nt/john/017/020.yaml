  text: Οὐ περὶ τούτων δὲ ἐρωτῶ μόνον, ἀλλὰ καὶ περὶ τῶν πιστευόντων διὰ τοῦ λόγου αὐτῶν εἰς ἐμέ,
base_translation:
  language: en
  yaml_path: translation/nt/john/017/020.yaml
  text: I do not ask concerning these only[a], but also concerning those who believe in me through their word[b],
translation:
  language: ig
  text: Ọ bụghị naanị banyere ndị a ka m na-arịọ, kama kwa banyere ndị na-ekwere na m site n'okwu ha[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “site n'ozi ha.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐρωτῶ
  choice: m na-arịọ
  rationale: N'ọnọdụ a, ἐρωτάω pụtara Jizọs ịrịọ Nna ya arịrịọ. “Na-arịọ” doro anya, ọ naghịkwa etinye nkọwa ofufe karịrị ihe ngwaa ahụ pụtara.
- source_word: περὶ τούτων
  choice: banyere ndị a
  rationale: περί na genitive na-egosi ihe arịrịọ ahụ metụtara. E jiri “ndị a” mee ka o doo anya na τούτων na-ezo aka n'ebe ndị mmadụ nọ, ma a kpọghị ha kpọmkwem ndị na-eso ụzọ n'amaokwu ahụ.
- source_word: Οὐ ... μόνον
  choice: Ọ bụghị naanị ... ka
  rationale: Usoro Igbo a na-egosipụta nke ọma mmachi dị na negation na μόνον ma na-edobe mesiri okwu ike nke Grik.
- source_word: ἀλλὰ καὶ
  choice: kama ... kwa
  rationale: Nke a na-edobe ma ọdịiche ma mgbakwunye dị n'okwu Grik.
- source_word: τῶν πιστευόντων
  choice: ndị ga-ekwere
  rationale: Participial present a bụ aha na-arụ ọrụ, oge ya daberekwa n'ọnọdụ okwu. “Ndị ga-ekwere” bụ Igbo eke n'arịrịọ nke gbatịrị ruo ná ndị ga-esi n'ozi ndị na-eso ụzọ kwere, n'agbanyeghị na Grik ejighị future tense kpọmkwem.
- source_word: διὰ τοῦ λόγου αὐτῶν
  choice: site n'okwu ha
  rationale: “Okwu ha” nọ nso na λόγος ma na-echekwa nghọta Jọn ji “okwu” eme ihe; n'ebe a ọ pụtara okwu ma ọ bụ ozi akaebe ha.
- source_word: εἰς ἐμέ
  choice: na m
  rationale: Mgbe πιστεύω so εἰς na Jọn, “kwere na m” bụ ụzọ Igbo kwesịrị ekwesị isi kwuo ntụkwasị obi nke onye ahụ lekwasịrị anya na Jizọs.
theological_decisions:
- issue: Oke arịrịọ Jizọs gafere ndị na-eso ụzọ nọ ya nso
  choice: Okwu ahụ gụnyere ndị ga-ekwere na Jizọs site n'okwu akaebe ndị na-eso ụzọ.
  alternative: Ọ pụrụ izo aka n'otu ìgwè dị warara nke maliterela ikwere site n'okwu ndị na-eso ụzọ.
  rationale: Ọdịiche dị n'etiti “ndị a” na “ndị ... site n'okwu ha” na-agbatị arịrịọ ahụ ruo ná ndị ọzọ. E tinyere “ga-” ka usoro ahụ bụrụ Igbo eke ma kwekọọ n'ọnọdụ arịrịọ ahụ, ma nkọwa ahụ etinyeghị nkọwa ọzọ banyere oge ma ọ bụ otu chọọchị kpọmkwem.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị nsọ ma dị mfe nghọta. Usoro “Ọ bụghị naanị ... ka ... kama ... kwa” na-ada nke ọma n'Igbo ma na-edobe ọdịiche nke ahịrịokwu Grik. E debere λόγος dịka “okwu,” tinyere “ozi” n'ala ala peeji dịka nhọrọ nkọwa.
