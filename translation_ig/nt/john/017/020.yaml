revisions:
- from: Ọ bụghị naanị banyere ndị a ka m na-arịọ, kama m na-arịọkwa banyere ndị ga-ekwere na m site n'okwu ha.[a]
  to: Ọ bụghị naanị banyere ndị a ka m na-arịọ, kama kwa banyere ndị na-ekwere na m site n'okwu ha[a].
  rationale: The revision replaces the explicit future “ga-ekwere” with “na-ekwere,” which reflects the Greek present participle without excluding the contextual possibility of future believers. It also places the footnote marker directly after “okwu ha,” the expression to which the lexical alternative applies. The remaining wording is retained because it faithfully and naturally conveys the Greek structure.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T08:24:45Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys Jesus’ request, its extension beyond “these,” and faith in him through their word. However, “ndị ga-ekwere” explicitly makes the participle future, whereas the Greek has a present substantival participle (τῶν πιστευόντων). Although a future implication is possible from the context, it should not be made explicit in the translation.
  naturalness: The revised correlative construction is natural Standard Igbo and avoids unnecessarily repeating “m na-arịọ,” while retaining the Greek contrast and addition.
  terminology: “na-arịọ,” “banyere,” “ndị na-ekwere na m,” and “okwu ha” are suitable modern, appropriately reverent Standard Igbo renderings. “Ozi ha” remains a legitimate lexical alternative for λόγος in the footnote.
  issues:
  - severity: medium
    issue: The translation uses “ndị ga-ekwere” for τῶν πιστευόντων.
    rationale: “Ga-ekwere” specifies future time. The Greek present participle can include later believers in context but does not grammatically state “will believe”; “ndị na-ekwere” better preserves the source wording and its temporal openness.
  - severity: low
    issue: The lexical-alternative footnote is anchored at the end of the sentence rather than directly after “okwu ha.”
    rationale: The alternative concerns λόγου αὐτῶν (‘their word/message’), so its marker should follow the corresponding Igbo words.
  revised_text: Ọ bụghị naanị banyere ndị a ka m na-arịọ, kama kwa banyere ndị na-ekwere na m site n'okwu ha[a].
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “site n'ozi ha.”
    reason: lexical_alternative
  revision_rationale: The revision replaces the explicit future “ga-ekwere” with “na-ekwere,” which reflects the Greek present participle without excluding the contextual possibility of future believers. It also places the footnote marker directly after “okwu ha,” the expression to which the lexical alternative applies. The remaining wording is retained because it faithfully and naturally conveys the Greek structure.
