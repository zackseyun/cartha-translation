  text: κἀγὼ τὴν δόξαν ἣν δέδωκάς μοι δέδωκα αὐτοῖς, ἵνα ὦσιν ἓν καθὼς ἡμεῖς ⸀ἕν,
base_translation:
  language: en
  yaml_path: translation/nt/john/017/022.yaml
  text: And I have given them the glory that you have given me[a], so that they may be one, just as we are one.
translation:
  language: ig
  text: Mụ onwe m enyewo ha ebube ahụ i nyere m,[a] ka ha wee bụrụ otu, dị nnọọ ka anyị bụ otu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Mụ kwa enyewo ha ebube ahụ i nyere m.” Okwu Grik κἀγώ (καί + ἐγώ) nwere ike igosi mgbakwunye, ya bụ, “mụ kwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀγὼ
  choice: Mụ onwe m enyewokwa
  rationale: κἀγώ bụ njikọta καί na ἐγώ ma nwee ike igosi njikọ na mgbakwunye ma ọ bụ imesi onye na-ekwu okwu ike. “Mụ onwe m ... -kwa” na-egosipụta isiokwu ahụ nke ọma ma na-echekwa ike mgbakwunye ahụ n’Igbo.
- source_word: δόξαν
  choice: ebube
  rationale: “Ebube” bụ okwu Igbo doro anya ma dị ùgwù nke na-echekwa ịdị arọ nke δόξα n’Oziọma Jọn karịa okwu ga-apụta naanị nsọpụrụ mmadụ.
- source_word: ἣν δέδωκάς μοι
  choice: ahụ i nyere m
  rationale: Nkebi a na-akọwa ebube ahụ. Igbo anaghị egosipụta perfect Greek n’otu usoro pụrụ iche dịka Bekee; “i nyere m” na-egosi omume e mezuru nke ihe ọ rụpụtara ka dị.
- source_word: δέδωκα αὐτοῖς
  choice: enyewokwa ha
  rationale: “Enyewo ... ha” na-egosi na inye ahụ emezuola, ebe “-kwa” na-echekwa nghọta mgbakwunye nke κἀγώ n'ụzọ e ji asụ Igbo ugbu a.
- source_word: ἵνα
  choice: ka ... wee
  rationale: Usoro “ka ... wee” na-egosipụta ebumnuche ma ọ bụ ihe a chọrọ ka o si na ya pụta n’Igbo n'ụzọ doro anya.
- source_word: ὦσιν
  choice: ha wee bụrụ
  rationale: Nke a na-egosipụta ebumnuche dị na subjunctive Greek n’enweghị ime ka ọ bụrụ nkwupụta na ihe ahụ emezuola.
- source_word: ἓν
  choice: otu
  rationale: “Otu” na-echekwa neuter singular Greek na echiche ịdị n’otu, kama ịkọwa ụdị ịdị n’otu ahụ dịka nke nzukọ, ọrụ, ma ọ bụ ọdịdị.
- source_word: καθὼς
  choice: dị nnọọ ka
  rationale: “Dị nnọọ ka” na-eme ka ntụnyere ahụ doo anya ma na-ada ka Igbo ebumpụta ụwa.
- source_word: ἡμεῖς ἕν
  choice: anyị bụ otu
  rationale: A gbakwụnyere “bụ,” nke a ghọtara na Greek, n’ihi na ọ dị mkpa n’usoro Igbo. Okwu ahụ anaghị akọwa ụdị ịdị n’otu nke Nna na Ọkpara.
theological_decisions:
- issue: Ụdị ịdị n’otu nke ndị kwere ekwe ma e jiri ya tụnyere ịdị n’otu nke Nna na Ọkpara
  choice: “ka ha wee bụrụ otu, dị nnọọ ka anyị bụ otu”
  alternative: Ịkọwa ya kpọmkwem dịka ịdị n’otu nke mmekọrịta, ikere òkè na ndụ Chineke, ma ọ bụ ịdị n’otu nke nzukọ ụka
  rationale: Amaokwu ahụ na-eme ezigbo ntụnyere, ma ọ kọwaghị kpọmkwem ụdị ma ọ bụ oke ntụnyere ahụ. Nsụgharị ahụ na-echekwa nghọtahie na esemokwu nkà mmụta okpukpe dị na ederede n’etinyeghị nkọwa otu ụka ma ọ bụ onye nkọwa.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. A họọrọ “ebube” maka ịdị arọ nke δόξα n’Oziọma Jọn, ma chekwaa okwu dị mkpirikpi “otu” n’ebe abụọ ahụ. Akara ndetu [a] dị n’isi ederede dịka achọrọ.
