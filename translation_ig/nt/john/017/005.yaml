id: JHN.17.5
reference: John 17:5
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ νῦν δόξασόν με σύ, πάτερ, παρὰ σεαυτῷ τῇ δόξῃ ᾗ εἶχον πρὸ τοῦ τὸν κόσμον εἶναι παρὰ σοί.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/005.yaml
  text: And now[a], Father[b], glorify me in your presence with the glory that I had with you before the world existed.
translation:
  language: ig
  text: Ugbu a, Nna, were ebube ahụ m nwere n’ebe gị nọ tupu ụwa adị[b] mee ka m dị ebube n’ebe gị onwe gị nọ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “n’ebe gị nọ” ma ọ bụ “n’akụkụ gị.” Okwu Grik ahụ na-egosi ịnọ nso, n’ebe Nna nọ.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, “tupu ụwa adịrị” ma ọ bụ “tupu ụwa abịa ịdị adị.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δόξασόν
  choice: mee ka m nwee ebube
  rationale: Nke a na-egosipụta arịrịọ ka Nna mee Jizọs ka o nwee ebube, ma na-edobe otu okwu ebube nke Jọn ji jikọta δοξάζω na δόξα. Ọ bụkwa Igbo doro anya karịa ntụgharị mkpụrụokwu nke ga-ada arọ.
- source_word: παρὰ σεαυτῷ
  choice: n’ihu gị
  rationale: παρά na dative nwere ike igosi ịnọ nso ma ọ bụ ịnọ n’ebe mmadụ nọ. “N’ihu gị” na-enye nghọta nke ịnọ n’ebe Nna nọ n’Igbo dị mfe ma dị nsọpụrụ.
- source_word: τῇ δόξῃ
  choice: ebube ahụ
  rationale: E jiri ahịrịokwu nkọwa sochiri ya kọwaa ụdị ebube a na-arịọ; akara ogologo na-ejikọta ya n’arịrịọ ahụ n’ụzọ Igbo na-aga nke ọma.
- source_word: ᾗ εἶχον
  choice: m nwere
  rationale: Oge gara aga nke εἶχον na-egosi na ebube ahụ bụ nke Jizọs nwere tupu oge e kwuru okwu ya; “m nwere” bụ ụzọ Igbo nkịtị si kwuo ya.
- source_word: πρὸ τοῦ τὸν κόσμον εἶναι
  choice: tupu ụwa adị
  rationale: Articular infinitive a na-egosi oge bu ụzọ. “Tupu ụwa adị” doro anya ma na-edobe echiche nke ịdị adị n’enweghị ịgbasa nkọwa ya.
- source_word: παρὰ σοί
  choice: n’ebe gị nọ
  rationale: Nke a na-edobe echiche nke ịnọnyere Nna ma na-ada nke ọma n’ahịrịokwu Igbo.
- source_word: σύ, πάτερ
  choice: Nna
  rationale: Ọ bụ ezie na σύ na-enye nkwusi ike n’asụsụ Grik, ịkpọku “Nna” n’ebe a na-ekwupụta onye a na-arịọ arịrịọ n’Igbo n’enweghị ahịrịokwu siri ike ma ọ bụ nke na-adịghị eke.
- source_word: κόσμον
  choice: ụwa
  rationale: “Ụwa” bụ okwu Igbo a na-ejikarị sụgharị κόσμος n’akwụkwọ Jọn, ọ dabara na ihe e kere eke a na-ekwu maka ya ebe a.
theological_decisions:
- issue: Ịdị adị nke Ọkpara tupu ụwa adị
  choice: A sụgharịrị ahịrịokwu oge ahụ n’ụzọ kwụ ọtọ dị ka ebube Jizọs nwere n’ebe Nna nọ tupu ụwa adị.
  alternative: Ịkọwa ya naanị dị ka ebube e bu ụzọ kpebie inye ya.
  rationale: Asụsụ Grik kwuru na Jizọs nwere ebube ahụ n’ebe Nna nọ tupu ụwa adị. Nsụgharị ahụ ekwesịghị ime ka okwu a daa mbà ma ọ bụ tinye nkọwa karịrị ihe amaokwu ahụ kwuru.
- issue: Ụdị ebube Jizọs nwere n’ebe Nna nọ
  choice: E debere “ebube” n’enweghị nkọwa mgbakwunye.
  alternative: Ịsụgharị ya dị ka nsọpụrụ ma ọ bụ ịma mma naanị.
  rationale: Amaokwu ahụ na-ekwu maka ebube ahụ ma ọ kọwaghị ọdịdị ya n’ụzọ zuru ezu. Idebe “ebube” na-echekwa okwu okpukpe Jọn na mgbagwoju anya ziri ezi nke amaokwu ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị nsọpụrụ ma dị mfe nghọta. “Ebube” na-edobe okwu bụ isi nke Jọn, ebe ahịrịokwu “mee ka m nwee ebube” na-eme ka arịrịọ ahụ bụrụ Igbo na-aga nke ọma. E tinyere akara nkọwa ụkwụ ozugbo n’akụkụ okwu ha na-akọwa.
