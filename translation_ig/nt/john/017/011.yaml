id: JHN.17.11
reference: John 17:11
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ οὐκέτι εἰμὶ ἐν τῷ κόσμῳ, καὶ ⸀αὐτοὶ ἐν τῷ κόσμῳ εἰσίν, κἀγὼ πρὸς σὲ ἔρχομαι. πάτερ ἅγιε, τήρησον αὐτοὺς ἐν τῷ ὀνόματί σου ᾧ δέδωκάς μοι, ἵνα ὦσιν ἓν ⸀καθὼς ἡμεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/011.yaml
  text: And I am no longer in the world[a], but they are in the world, and I am coming to you. Holy Father, keep them in your name, which you have given to me, so that they may be one[b], just as we are.
translation:
  language: ig
  text: Anọkwaghị m n’ụwa, ma ha nọ n’ụwa; ana m abịakwute gị. Nna dị nsọ, debe ha n’aha gị[a] nke i nyere m[b], ka ha wee bụrụ otu, dị ka anyị bụ otu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “jiri aha gị debe ha” ma ọ bụ “site n’aha gị chebe ha.” Akpaokwu Grik a nwere ike igosi ọnọdụ ha nọ na ya, ụzọ e si eme ya, ma ọ bụ ikike e ji eme ya.
    reason: lexical_alternative
  - marker: b
    text: Ọgụgụ ụfọdụ na-eme ka a ghọta ya dịka, “debe ndị i nyere m n’aha gị.” Nsụgharị a gbasoro ọgụgụ SBLGNT, nke “nke” na-ezo aka n’“aha.”
    reason: textual_variant
lexical_decisions:
- source_word: οὐκέτι εἰμὶ ἐν τῷ κόσμῳ
  choice: Anọghịkwa m n’ụwa ọzọ
  rationale: “Ọzọ” na-egosipụta οὐκέτι, ya bụ na ọnọdụ a akwụsịla site n’echiche onye na-ekwu; “ụwa” na-edobe okwu Jọn ji maka ebe ndụ ụmụ mmadụ dị.
- source_word: κἀγὼ πρὸς σὲ ἔρχομαι
  choice: mụ onwe m na-abịakwutekwa gị
  rationale: “Na-abịakwute” na-edobe echiche ἔρχομαι site n’ebe Nna nọ, ebe ọdịdị ngwaa ugbu a na-egosi ihe na-eru nso ime.
- source_word: πάτερ ἅγιε
  choice: Nna dị nsọ
  rationale: Nke a bụ ịkpọku Nna ozugbo; “dị nsọ” na-enye ἅγιε n’Igbo nkịtị ma dị ùgwù.
- source_word: τήρησον
  choice: debe
  rationale: “Debe” nwere ike ibu echiche nke ichekwa, ilekọta, na ime ka ha nọgide; ọ naghị eme ka ihe okwu Grik pụtara bụrụ naanị nchebe anụ ahụ.
- source_word: ἐν τῷ ὀνόματί σου
  choice: n’aha gị
  rationale: A hapụrụ ἐν dịka “n’” iji chekwaa nghọta nwere ike ịbụ ọnọdụ ha nọ na ya, ụzọ e si echebe ha, ma ọ bụ ikike aha ahụ.
- source_word: ᾧ δέδωκάς μοι
  choice: nke i nyere m
  rationale: N’ọgụgụ SBLGNT, nnọchiaha njikọ ᾧ na-ezo aka n’ὀνόματι (“aha”), ya mere ntụgharị ahụ na-ekwu na ọ bụ aha ahụ ka Nna nyere Ọkpara.
- source_word: ἵνα ὦσιν ἓν
  choice: ka ha wee bụrụ otu
  rationale: “Ka…wee” na-egosipụta ebumnuche ἵνα; “bụrụ otu” na-echekwa ịdị n’otu n’enweghị ịkọwa ụdị ịdị n’otu ahụ karịa ihe ederede kwuru.
- source_word: καθὼς ἡμεῖς
  choice: dị nnọọ ka anyị bụ otu
  rationale: “Dị nnọọ ka” na-egosipụta ntụnyere καθώς. E tinyere “otu” ọzọ n’Igbo ka ahịrịokwu zuo oke ma doo anya, n’enweghị itinye nkọwa gbasara ụdị ịdị n’otu ahụ.
theological_decisions:
- issue: Ihe “debe ha n’aha gị” pụtara
  choice: E debere ya dịka “debe ha n’aha gị.”
  alternative: “jiri aha gị debe ha” ma ọ bụ “site n’aha gị chebe ha”
  rationale: ἐν nwere ike igosi ọnọdụ, ụzọ, ma ọ bụ ikike. Nsụgharị bụ isi anaghị ahọrọ naanị otu n’ime nghọta ndị a, ka ọ ghara idozi ihe ederede hapụrụ ghe oghe.
- issue: Mmekọrịta dị na “ka ha wee bụrụ otu, dị nnọọ ka anyị bụ otu”
  choice: E chekwara ntụnyere zuru oke nke dị n’etiti ịdị n’otu nke ndị na-eso ụzọ na nke Nna na Ọkpara.
  alternative: Ịkọwa ya naanị dịka imekọ ihe ọnụ, ma ọ bụ ịsị na ịdị n’otu ha bụ otu ihe kpọmkwem n’ụdị ịdị adị
  rationale: Ederede na-eme ezigbo ntụnyere, ma ọ kọwaghị ebe niile ntụnyere ahụ ruru. Nsụgharị ahụ anaghị eme ka ike okwu ahụ daa, ọ naghịkwa ebubata nkọwa nkà mmụta okpukpe nke amaokwu ahụ ekwughị kpọmkwem.
- issue: Ihe nnọchiaha dị na “nke i nyere m” na-ezo aka na ya
  choice: “Nke” na-ezo aka n’“aha gị.”
  alternative: Ịghọta nkebi ahụ dịka “ndị i nyere m”
  rationale: Nke a na-agbaso ọgụgụ SBLGNT, ebe ᾧ kwekọrọ na ὀνόματι (“aha”), ma na-edobe okwu siri ike ahụ n’enweghị ịgbanwe ya ka ọ bụrụ ndị mmadụ.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. “Nna dị nsọ” na “debe ha” na-ezere asụsụ ụka pụrụ iche; usoro ahịrịokwu ahụ ka na-edobe ịdị arọ na ụda ekpere Jizọs. E debere akara nkọwa [a] na [b] n’ebe okwu ha na-akọwa dị.
