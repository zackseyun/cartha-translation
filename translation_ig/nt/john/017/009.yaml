id: JHN.17.9
reference: John 17:9
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐγὼ περὶ αὐτῶν ἐρωτῶ· οὐ περὶ τοῦ κόσμου ἐρωτῶ ἀλλὰ περὶ ὧν δέδωκάς μοι, ὅτι σοί εἰσιν,
base_translation:
  language: en
  yaml_path: translation/nt/john/017/009.yaml
  text: I am asking on their behalf[a]. I am not asking on behalf of the world, but on behalf of those whom you have given me[b], because they are yours.
translation:
  language: ig
  text: Mụ onwe m na-arịọ[a] maka ha[b]. Anaghị m arịọ maka ụwa, kama ana m arịọ maka ndị ahụ i nyeworo m, n’ihi na ha bụ nke gị.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “na-ekpe ekpere.” Ngwaa Grik ahụ pụtara n’ụzọ nkịtị “na-arịọ” ma ọ bụ “na-arịọ arịrịọ.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “banyere ha.” N’ebe a, okwu Grik ahụ nwere ike ịpụta ma “maka ha” ma “banyere ha.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐρωτῶ
  choice: na-arịọ
  rationale: Ọ pụtara “na-arịọ” ma ọ bụ “na-arịọ arịrịọ.” Nhọrọ a na-edobe isi ihe okwu Grik pụtara n’etinyeghị okwu pụrụ iche nke okpukpe, ọ bụ ezie na ebe a Jizọs na-agwa Nna ya okwu n’ekpere.
- source_word: περὶ αὐτῶν
  choice: maka ha
  rationale: N’ọnọdụ ekpere a, “maka ha” na-egosi na ọ na-arịọ n’ihi ha ma ọ bụ n’aha ha. Ihe odide ala peeji na-edobekwa ohere nke ịghọta ya dị ka “banyere ha.”
- source_word: κόσμου
  choice: ụwa
  rationale: E debere okwu sara mbara bụ “ụwa” n’emeghị ka ọ bụrụ naanị mmadụ niile ma ọ bụ usoro ụwa na-ekweghị ekwe, ka esemokwu dị n’ụzọ Jọn si eji okwu a nọgide.
- source_word: ὧν δέδωκάς μοι
  choice: ndị ahụ i nyeworo m
  rationale: “Ndị ahụ” na-egosi ìgwè mmadụ a na-ekwu maka ha; “i nyeworo” na-egosipụta omume e mere nke nsonaazụ ya ka dị ugbu a.
- source_word: ὅτι σοί εἰσιν
  choice: n’ihi na ha bụ nke gị
  rationale: “N’ihi na” na-egosi ihe kpatara arịrịọ ahụ, ebe “ha bụ nke gị” na-edobe okwu nke inwe ha na mmekọrịta dị na ya.
- source_word: ἐγὼ
  choice: Mụ onwe m
  rationale: A kọwapụtara nnọchiaha ahụ iji chekwaa nkwusi okwu dị na Grik na ọdịiche dị n’ahịrịokwu ahụ.
- source_word: ἀλλὰ
  choice: kama
  rationale: “Kama” na-egosi ọdịiche siri ike n’etiti ụwa na ndị Nna nyere Ọkpara ahụ.
theological_decisions:
- issue: Ma a ga-eji okwu ekpere pụrụ iche sụgharịa ἐρωτῶ
  choice: na-arịọ
  alternative: na-ekpe ekpere maka
  rationale: Ọnọdụ ahụ bụ ekpere, ma ngwaa Grik n’onwe ya pụtara ịrịọ. “Na-arịọ” na-echekwa nghọta ahụ n’etinyeghị ihe karịrị ihe isi mmalite kwuru.
- issue: Ihe “ụwa” pụtara n’ebe a
  choice: E debere ya dịka “ụwa” n’enweghị nkọwa na-eme ka ókè ya dị warara
  alternative: ụmụ mmadụ niile; usoro ụwa na-ekweghị ekwe
  rationale: κόσμος nwere ọtụtụ ndò nghọta n’Oziọma Jọn. Nsụgharị ahụ anaghị ekpebi otu nkọwa okpukpe pụrụ iche ebe okwu Grik hapụrụ esemokwu ahụ.
translation_notes:
  register: Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. E jiri “na-arịọ” kama okwu ụka pụrụ iche, ma debegharịa “maka” n’ahịrịokwu ahụ iji chekwaa usoro nkwughachi na ọdịiche nke isi mmalite.
