id: JHN.17.13
reference: John 17:13
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: νῦν δὲ πρὸς σὲ ἔρχομαι, καὶ ταῦτα λαλῶ ἐν τῷ κόσμῳ ἵνα ἔχωσιν τὴν χαρὰν τὴν ἐμὴν πεπληρωμένην ἐν ⸀ἑαυτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/013.yaml
  text: But now I am coming to you[b][a], and I am speaking these things in the world so that they may have my joy fulfilled in themselves.
translation:
  language: ig
  text: Ma ugbu a, ana m abịakwute gị, ana m ekwu ihe ndị a n’ụwa, ka ha wee nwee ọṅụ m n’uju n’ime ha[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “ka ọṅụ m wee zuo oke n’ime ha” ma ọ bụ “n’ime onwe ha.”
    reason: lexical_alternative
lexical_decisions:
- source_word: νῦν δὲ
  choice: Ma ugbu a
  rationale: “Ugbu a” na-egosi oge dị ugbu a, ebe “ma” na-egosi obere mgbanwe ma ọ bụ ọdịiche n’ihe Jizọs na-ekwu.
- source_word: πρὸς σὲ ἔρχομαι
  choice: ana m abịakwute gị
  rationale: Nke a na-egosi ngagharị Jizọs na-abịakwute Nna ya ma na-echekwa ọdịdị ngwaa nke ihe na-aga ime ugbu a.
- source_word: ταῦτα λαλῶ
  choice: ana m ekwu ihe ndị a
  rationale: Ọ bụ ụzọ Igbo dị mfe ma bụrụkwa nke e ji asụ asụsụ ugbu a iji kwupụta na Jizọs na-ekwu okwu ndị a.
- source_word: ἐν τῷ κόσμῳ
  choice: n’ụwa
  rationale: Nsụgharị a na-echekwa okwu Jọn ji mee ihe ma ghara ịgbasa ya ka ọ bụrụ “mgbe m ka nọ n’ụwa,” nke ga-akọwakwu ihe karịa ihe Grik kwuru kpọmkwem.
- source_word: ἵνα ἔχωσιν
  choice: ka ha wee nwee
  rationale: “Ka … wee” na-egosi nzube ma ọ bụ ihe a chọrọ ka o si n’okwu Jizọs pụta.
- source_word: τὴν χαρὰν τὴν ἐμὴν
  choice: ọṅụ m
  rationale: Nke a na-egosi n’ụzọ doro anya na ọ bụ ọṅụ nke Jizọs n’onwe ya.
- source_word: πεπληρωμένην
  choice: zuru oke
  rationale: Okwu a na-egosi ọṅụ e mere ka o ruo n’uju, ya bụ, ọṅụ nọ n’ọnọdụ zuru oke.
- source_word: ἐν ἑαυτοῖς
  choice: n’ime ha
  rationale: Nke a na-echekwa echiche nke ọṅụ ahụ ịdị n’ime ndị na-eso ụzọ, na-enweghị ịkọwa ya karịa ihe ederede kwuru.
theological_decisions:
- issue: Ihe “ọṅụ m” pụtara
  choice: Ọṅụ ahụ bụ nke Jizọs, ọ ga-adịkwa n’uju n’ime ndị na-eso ụzọ ya.
  alternative: Ịghọta ya dị ka ọṅụ ha nwere n’ihi Jizọs.
  rationale: Nnochiaha ἐμὴν na-egosi n’ụzọ kacha kwe omume na ọ bụ ọṅụ nke Jizọs. Nsụgharị ahụ ekwughị ụzọ ndị na-eso ụzọ si eketa ọṅụ ahụ, n’ihi na amaokwu ahụ akọwaghị nke ahụ.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, dị ugwu ma dị mfe nghọta. Ahịrịokwu ahụ na-agbaso usoro echiche Grik, ma ọ naghị eji nhazi okwu ga-ada arọ ma ọ bụ bụrụ nke na-adịghị ekwekọ n’Igbo.
