source:
  edition: SBLGNT
  text: καθὼς ἔδωκας αὐτῷ ἐξουσίαν πάσης σαρκός, ἵνα πᾶν ὃ δέδωκας αὐτῷ ⸀δώσῃ αὐτοῖς ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/002.yaml
  text: just as you gave him authority over all flesh[a], so that to all whom you have given him[b], he may give eternal life.
translation:
  language: ig
  text: dị nnọọ ka i nyere ya ikike n’ebe ụmụ mmadụ niile nọ[a], ka o wee nye ndị niile i nyere ya[b] ndụ ebighị ebi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’elu anụ ahụ niile.” Grik kwuru n’ụzọ nkịtị, “n’elu anụ ahụ niile”; nke a bụ akpaalaokwu Akwụkwọ Nsọ maka ụmụ mmadụ niile.
    reason: lexical_alternative
  - marker: b
    text: N’ụzọ nkịtị, “ihe niile i nyere ya.” Grik ji okwu na-anọpụ iche dị n’otu ọgụgụ mee ihe n’ụzọ mkpokọta maka ndị Nna nyere Ọkpara.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς
  choice: dị nnọọ ka
  rationale: Nke a na-egosipụta ntụnyere na njikọ ya na arịrịọ dị n’amaokwu nke mbụ, n’ụzọ doro anya ma bụrụkwa Igbo ebumpụta ụwa.
- source_word: ἔδωκας
  choice: i nyere
  rationale: Oge aorist na-arụtụ aka n’omume Nna mere—inye Ọkpara ikike.
- source_word: ἐξουσίαν
  choice: ikike
  rationale: “Ikike” na-egosipụta ikike e nyere mmadụ ịchị ma ọ bụ ime ihe, ọ bụghị naanị ike anụ ahụ.
- source_word: πάσης σαρκός
  choice: n’ebe ụmụ mmadụ niile nọ
  rationale: N’ebe a, okwu Grik ahụ bụ akpaalaokwu Akwụkwọ Nsọ nke na-ezo aka n’ụmụ mmadụ niile. Nsụgharị a na-eme ka ihe ọ pụtara doo onye Igbo anya, ebe nkọwa ala peeji na-echekwa ọdịdị okwu ahụ kpọmkwem.
- source_word: ἵνα
  choice: ka o wee
  rationale: Nke a na-egosipụta nzube ma ọ bụ ihe e bu n’obi nweta.
- source_word: πᾶν ὃ
  choice: ndị niile
  rationale: Ọ bụ ezie na Grik ji otu okwu na-anọpụ iche mee ihe n’ụzọ mkpokọta, ndị ọ na-ezo aka na ha bụ mmadụ; “ndị niile” bụ Igbo doro anya ma dị mma.
- source_word: δέδωκας
  choice: i nyere
  rationale: N’Igbo, ụdị a nwere ike ịkọwa omume e mezuru nke ihe ọ rụpụtara ka dịgide, na-enweghị ịgbakwunye nkọwa na-adịghị n’ederede.
- source_word: δώσῃ αὐτοῖς
  choice: o wee nye ndị niile
  rationale: Nhazi a na-egosipụta nzube nke ἵνα ma mee ka ndị na-anata onyinye ahụ doo anya.
- source_word: ζωὴν αἰώνιον
  choice: ndụ ebighị ebi
  rationale: Nke a bụ okwu Igbo a maara nke ọma maka ndụ na-adịru mgbe ebighị ebi, ma kwekọọ n’ojiji Jọn.
theological_decisions:
- issue: Oke ikike Ọkpara na ndị na-anata ndụ ebighị ebi
  choice: E kewapụrụ “ụmụ mmadụ niile” ndị Ọkpara nwere ikike n’ebe ha nọ na “ndị niile i nyere ya” ndị ọ na-enye ndụ ebighị ebi.
  alternative: Ịsụgharị ahịrịokwu ahụ n’ụzọ ga-eme ka ìgwè abụọ ahụ bụrụ otu, ma ọ bụ ịkọwa ya site n’usoro ozizi otu ụka.
  rationale: Ederede Grik na-edobe ikike n’ebe mmadụ niile nọ na onyinye ndụ nye ndị Nna nyere Ọkpara n’akụkụ ibe ha. Nsụgharị ahụ na-echekwa esemokwu nkà mmụta okpukpe a n’emeghị mkpebi karịrị ihe ederede kwuru.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta mee ihe. “N’ebe ụmụ mmadụ niile nọ” na-ada nke ọma karịa “n’elu ụmụ mmadụ niile” ma na-egosipụta oke ikike ahụ. E debere akara nkọwa ala peeji [a] na [b] kpọmkwem n’ederede.
