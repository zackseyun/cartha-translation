- from: Emekwara m ka ha mata aha gị[a], m ga-emekwa ka ha mata ya, ka ịhụnanya ahụ i ji hụ m n’anya dịrị n’ime ha[c], ka mụ onwe m dịrịkwa n’ime ha.[b]
  to: Emeela m ka ha mata aha gị[b][a], m ga-emekwa ka ha mata ya, ka ịhụnanya ahụ i ji hụ m n’anya dịrị n’ime ha[c], mụ kwa dịrị n’ime ha.
  rationale: “Emeela m” naturally presents the completed force of the Greek aorist in this context. The final clause is revised from “ka mụ onwe m dịrịkwa” to “mụ kwa dịrị” to retain the Greek’s compact coordination, with an understood verb appropriately supplied for Igbo, while avoiding an added emphatic “myself.” The note concerning “aha gị” is moved to its referent. All lexical alternatives and their anchors are retained.
