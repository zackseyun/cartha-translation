id: JHN.17.26
reference: John 17:26
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἐγνώρισα αὐτοῖς τὸ ὄνομά σου καὶ γνωρίσω, ἵνα ἡ ἀγάπη ἣν ἠγάπησάς με ἐν αὐτοῖς ᾖ κἀγὼ ἐν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/026.yaml
  text: And I made your name known to them[a], and I will make it known, so that the love with which you loved me may be in them[c][b], and I in them.
translation:
  language: ig
  text: Emeela m ka ha mata aha gị[b][a], m ga-emekwa ka ha mata ya, ka ịhụnanya ahụ i ji hụ m n’anya dịrị n’ime ha[c], mụ kwa dịrị n’ime ha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Ekpughere m ha aha gị, m ga-ekpughekwa ya.”
    reason: lexical_alternative
  - marker: b
    text: “Aha gị” na-ezo aka na njirimara na agwa Chineke dịka o mere ka a mata ha, ọ bụghị naanị aha a na-akpọ ya.
    reason: cultural_note
  - marker: c
    text: Ma ọ bụ, “n’etiti ha”; “n’ime ha” na-echekwa nke ọma isiokwu Jọn banyere Chineke na Kraịst ibi n’ime ndị kwere ekwe.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγνώρισα
  choice: Emekwara m ka ha mata
  rationale: 'Ọ na-egosipụta ihe gara aga na nghọta causative nke γνωρίζω: Jizọs mere ka ha mata ya; ọ na-adakwa n’usoro kwekọrọ na γνωρίσω.'
- source_word: τὸ ὄνομά σου
  choice: aha gị
  rationale: E debere okwu a kpọmkwem dịka Grik si kwuo, n’ebughị ụzọ kọwaa ya dịka ‘onye ị bụ’ ma ọ bụ ‘agwa gị.’
- source_word: γνωρίσω
  choice: m ga-emekwa ka ha mata ya
  rationale: Ọdịnihu nke ngwaa ahụ ka e gosipụtara, ebe ‘ya’ na-ezo aka n’aha ahụ a kpọtụrụla.
- source_word: ἵνα
  choice: ka
  rationale: ‘Ka’ na-egosipụta nzube ma ọ bụ ihe a chọrọ ka o mee n’ụzọ Igbo dị mfe ma kwesị ekwesị.
- source_word: ἡ ἀγάπη
  choice: ịhụnanya ahụ
  rationale: Nke a bụ ntụgharị nkịtị nke ἀγάπη, ebe ‘ahụ’ na-egosipụta ịhụnanya a kọwara n’ahịrịokwu na-esote.
- source_word: ἣν ἠγάπησάς με
  choice: i ji hụ m n’anya
  rationale: Ụdị Igbo a na-egosipụta ịhụnanya Nna ji hụ Ọkpara n’anya n'ụzọ eke ma na-echekwa njikọ nke relative clause ahụ.
- source_word: ἐν αὐτοῖς
  choice: n’ime ha
  rationale: Ọ bụ ntụgharị kpọmkwem nke ἐν αὐτοῖς, ma ọ na-echekwakwa isiokwu Jọn banyere ịdị n’ime mmadụ.
- source_word: κἀγὼ ἐν αὐτοῖς
  choice: ka mụ onwe m dịrịkwa n’ime ha
  rationale: E mejupụtara ngwaa ahụ Grik hapụrụ n’ihi na Igbo chọrọ ya maka ido anya; ‘mụ onwe m’ na-egosipụta ike nke κἀγώ.
theological_decisions:
- issue: Ihe ‘aha gị’ pụtara n’ozizi Jọn
  choice: E debere ‘aha gị’ n’isi ederede.
  alternative: ‘onye ị bụ’ ma ọ bụ ‘agwa gị’
  rationale: ‘Aha’ gụnyere njirimara na agwa Chineke dịka o kpughere onwe ya, ma ịgbasa ya n’isi ederede ga-akọwa karịa ihe Grik kwuru.
- issue: Njikọ dị n’etiti ịhụnanya Chineke na ịdị Kraịst n’ime ndị na-eso ụzọ
  choice: 'E debere ha dịka nzube abụọ jikọrọ ọnụ: ka ịhụnanya dịrị n’ime ha, ka Kraịst dịrịkwa n’ime ha.'
  alternative: Ime otu ka ọ bụrụ ihe kpatara nke ọzọ
  rationale: Grik jikọtara ihe abụọ a ọnụ n’akọwaghị na otu bụ ihe kpatara nke ọzọ; ntụgharị ahụ anaghị edozi esemokwu nkà mmụta okpukpe ahụ n’onwe ya.
translation_notes:
  register: Standard Igbo dị ugbu a, dị nsọ ma dị mfe nghọta. E ji ‘ime ka ... mata’ chekwaa causative sense nke γνωρίζω; e zere ịgbasa ‘aha’ n’isi ederede. Akara ntụaka niile pụtara n’isi ederede, n’agbanyeghị na [b] dị n’ọgwụgwụ iji ghara ime ka nkọwa banyere ‘aha gị’ gbochie ọgụgụ ahịrịokwu ahụ.
