reference: John 17:6
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἐφανέρωσά σου τὸ ὄνομα τοῖς ἀνθρώποις οὓς ⸀ἔδωκάς μοι ἐκ τοῦ κόσμου. σοὶ ἦσαν κἀμοὶ αὐτοὺς ⸁ἔδωκας, καὶ τὸν λόγον σου τετήρηκαν.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/006.yaml
  text: I have made your name known to the men whom you gave me out of the world. They were yours, and you gave them to me, and they have kept your word.
translation:
  language: ig
  text: Emewo m ka ndị mmadụ ahụ i nyere m, ndị si n’ụwa pụta, mara aha gị.[a][b][c][d] Ha bụ nke gị, i wee nye ha m; ha edebewokwa okwu gị.[e]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ịsụgharị ya: “Ekpughere m ha aha gị.”'
    reason: lexical_alternative
  - marker: b
    text: “Aha gị” ebe a na-ezo aka n’otú Chineke si kpughee onye ọ bụ na àgwà ya, ọ bụghị naanị aha a na-akpọ ya.
    reason: cultural_note
  - marker: c
    text: N’asụsụ mbụ, okwu a nwere ike ịpụta “ndị mmadụ”; n’ebe a, ọ na-ezo aka ozugbo n’ndị na-eso ụzọ Jizọs.
    reason: lexical_alternative
  - marker: d
    text: 'Ma ọ bụ: “site n’ụwa.”'
    reason: lexical_alternative
  - marker: e
    text: 'Ma ọ bụ: “ha erubewokwa isi n’okwu gị”; Grik kwuru n’ụzọ kpọmkwem karị, “ha edebewokwa okwu gị.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐφανέρωσά
  choice: Emewo m ka ... mara
  rationale: Nke a na-egosipụta echiche φανερόω nke ime ka ihe pụta ìhè ma ọ bụ bụrụ ihe a maara, n’Igbo dị ugbu a nke na-ada nke ọma.
- source_word: τὸ ὄνομα
  choice: aha gị
  rationale: E debere okwu doro anya nke Grik, “aha,” ka omimi ya banyere onye Chineke bụ na àgwà ya ghara ịla n’iyi n’ịkọwa ya n’ụzọ warawara.
- source_word: τοῖς ἀνθρώποις
  choice: ndị ahụ
  rationale: N’Igbo, “ndị ahụ” na-ezo aka n’ụzọ ebumpụta ụwa n’ìgwè ndị Jizọs na-ekwu maka ha; ọ naghị amanye nkọwa nwoke ebe aha Grik nwere ike ịpụta ndị mmadụ n’ozuzu.
- source_word: οὓς ἔδωκάς μοι
  choice: ndị ahụ i nyere m
  rationale: Ọ na-edebe okwu banyere Nna inye ndị a Jizọs n’enweghị ịgbakwunye usoro ozizi ọ bụla.
- source_word: ἐκ τοῦ κόσμου
  choice: site n’ụwa
  rationale: “Site n’ụwa” bụ Igbo ebumpụta ụwa nke na-egosipụta isi mmalite ma ọ bụ ịhọrọ ha n’etiti ụwa; ndetu ala na-egosi ụzọ siri ike karị, “n’ime ụwa.”
- source_word: σοὶ ἦσαν
  choice: Ha bụ nke gị
  rationale: Ọ na-edebe nkenke na echiche nke ịbụ ihe onye nwe ya dị n’ahịrị Grik.
- source_word: κἀμοὶ αὐτοὺς ἔδωκας
  choice: i wee nye ha m
  rationale: Usoro okwu a bụ Igbo doro anya ma na-edebe echiche na Nna nyere ha Ọkpara ahụ.
- source_word: τὸν λόγον σου
  choice: okwu gị
  rationale: “Okwu” na-echekwa ịdị n’otu nke λόγος na mkpa ya n’Oziọma Jọn, n’enweghị imechi ya naanị n’“ozi” ma ọ bụ “nkuzi.”
- source_word: τετήρηκαν
  choice: ha edebewokwa
  rationale: 'Ụdị a na-egosipụta omume e mere nke nsonaazụ ya ka dị, ma na-echekwa obosara nke τηρέω: idebe, irube isi, na ichekwa.'
theological_decisions:
- issue: Ihe “aha gị” pụtara n’echiche Jọn
  choice: Idobe “aha gị” n’ahịrị isi
  alternative: Ịsụgharị ya dịka “onye ị bụ” ma ọ bụ “àgwà gị”
  rationale: Aha ahụ metụtara onye Nna bụ, àgwà ya, na otú o si kpughee onwe ya; ma Grik kwuru “aha,” ya mere e chekwara ihe oyiyi ahụ na omimi ya.
- issue: Onye τοῖς ἀνθρώποις na-ezo aka na okike asụsụ ya
  choice: ndị ahụ
  alternative: ụmụ nwoke ahụ / ndị mmadụ ahụ
  rationale: Ihe gbara amaokwu ahụ gburugburu na-ezo aka n’ụmụazụ Jizọs, ma ἄνθρωποι n’onwe ya nwere ike ịbụ mkpokọta. “Ndị ahụ” bụ Igbo ebumpụta ụwa nke na-echekwa ntụaka ahụ n’enweghị ime ka otu nkọwa sie ike karịa ederede.
- issue: Nna inye ndị mmadụ Ọkpara ahụ
  choice: Ikwughachi okwu ederede n’enweghị itinye usoro ozizi otu ụka
  alternative: Ịkọwa ya kpọmkwem dịka nhọrọ na-enweghị ọnọdụ ma ọ bụ dịka nzaghachi e buru ụzọ mara
  rationale: Amaokwu ahụ kwuru n’ezie na Nna nyere ha Jizọs, ma ọ kọwaghị ebe a usoro zuru ezu nke inye ahụ. Nsụgharị ahụ na-echekwa esemokwu nkà mmụta okpukpe ahụ.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji “Emewo m ka ... mara” mee ka ahịrịokwu ahụ bụrụ nke ebumpụta ụwa, ebe e chekwara “aha gị,” “okwu gị,” na okwu banyere Nna inye ha Ọkpara ahụ.
