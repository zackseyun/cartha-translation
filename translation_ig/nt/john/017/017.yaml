id: JHN.17.17
reference: John 17:17
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἁγίασον αὐτοὺς ἐν τῇ ⸀ἀληθείᾳ· ὁ λόγος ὁ σὸς ἀλήθειά ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/017.yaml
  text: Sanctify them in the truth[a]; your word is truth.
translation:
  language: ig
  text: Do ha nsọ n’eziokwu[a]; okwu gị bụ eziokwu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “okwu gị bụ eziokwu ahụ.” N’asụsụ Grik, aha-okwu a sụgharịrị “eziokwu” enweghị article; nke a nwere ike imesi àgwà ya ike—“bụ eziokwu”—karịa ịkọwa naanị na ọ bụ “eziokwu ahụ.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἁγίασον
  choice: Do ha nsọ
  rationale: Aorist imperative nke ἁγιάζω na-arịọ ka Chineke mee ha nsọ ma doo ha iche nye onwe ya. “Do ha nsọ” bụ okwu Igbo doro anya, dị ebube, ma na-echekwa ma echiche ịdị nsọ ma nke ido mmadụ iche maka Chineke.
- source_word: αὐτοὺς
  choice: ha
  rationale: Nnochiaha ebumnara nke ọtụtụ mmadụ, na-ezo aka n’ebe ndị na-eso ụzọ nọ.
- source_word: ἐν τῇ ἀληθείᾳ
  choice: n’eziokwu
  rationale: 'Na-echekwa obosara nke ἐν: ọ pụrụ igosi ọnọdụ ha ga-anọ n’ime ya ma ọ bụ ụzọ Chineke si eme ha nsọ, n’ebughị ụzọ kpebie naanị otu n’ime ha.'
- source_word: λόγος
  choice: okwu
  rationale: “Okwu” bụ nsụgharị nkịtị na nke dabara adaba maka λόγος n’ebe a, na-egosi ihe Chineke kwupụtara ma na-echekwa njikọ ya na asụsụ Jọn.
- source_word: ὁ σὸς
  choice: gị
  rationale: Aha njikọta nwe na-akọwa λόγος; “okwu gị” bụ usoro Igbo eke maka “okwu nke bụ nke gị.”
- source_word: ἀλήθειά ἐστιν
  choice: bụ eziokwu
  rationale: Na-echekwa ἀλήθεια dị ka aha ma ghara ime ya naanị “bụ ezi.” Ọ na-enye ohere maka nghọta àgwà (“bụ eziokwu”) n’agbanyeghị na nghọta njirimara (“bụ eziokwu ahụ”) ka nwere ike ịdị.
theological_decisions:
- issue: Ma a ga-asụgharị ἀλήθεια nke ahịrịokwu nke abụọ dị ka àgwà ma ọ bụ dị ka njirimara kpọmkwem
  choice: okwu gị bụ eziokwu
  alternative: okwu gị bụ eziokwu ahụ
  rationale: ἀλήθεια bụ aha-okwu predicate na-enweghị article n’asụsụ Grik. “Bụ eziokwu” na-echekwa ike ya dị ka àgwà na ọdịdị nke okwu Chineke, n’emeghị ka njirimara pụrụ iche ghọọ ihe Grik kwuru hoo haa. Agbanyeghị, “bụ eziokwu ahụ” ka bụ nghọta ụtọasụsụ nwere ike ịdị, ya mere e debere ya n’ala peeji.
- issue: Ike nke ἐν n’okwu ἐν τῇ ἀληθείᾳ
  choice: n’eziokwu
  alternative: site n’eziokwu
  rationale: “N’eziokwu” anaghị ekpebi ma eziokwu bụ naanị ọnọdụ/ógbè ha nọ n’ime ya ka ọ bụkwa ihe e ji eme ka ha dị nsọ; nke a na-echekwa obosara na nghọta nwere ike ịdị n’asụsụ Grik.
translation_notes:
  register: Standard Igbo nke oge a, dị mfe nghọta ma dịkwa ebube. E ji “Do ha nsọ” zere okwu mbinye “sanktifaa,” ma chekwaa echiche nke ime ka ha dị nsọ na ido ha iche nye Chineke. Akara nkọwa [a] dị n’isiokwu ahụ kpọmkwem.
