source:
  edition: SBLGNT
  text: αὕτη δέ ἐστιν ἡ αἰώνιος ζωὴ ἵνα γινώσκωσι σὲ τὸν μόνον ἀληθινὸν θεὸν καὶ ὃν ἀπέστειλας Ἰησοῦν Χριστόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/003.yaml
  text: 'And this is eternal life: that they may know you[a], the only true God, and Jesus the Messiah whom you sent.'
translation:
  language: ig
  text: 'Nke a bụ ndụ ebighị ebi: ka ha mara gị, naanị gị bụ ezi Chineke, marakwa Jizọs bụ́ Mesaya ahụ[a], onye i zitere.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, dịka a na-asụgharịkarị ya, “Jizọs Kraịst.” Okwu Grik bụ Χριστός nwere ike ịbụ utu aha (“Mesaya”) ma ọ bụ, n’ọnọdụ ụfọdụ, aha e ji akpọ mmadụ (“Kraịst”).
    reason: alternative_reading
lexical_decisions:
- source_word: αὕτη δέ ἐστιν
  choice: Nke a bụkwa
  rationale: Ọ na-edobe ntụaka ‘nke a bụ’ ma jiri ‘-kwa’ gosipụta njikọ dị nro nke δέ n’Igbo nkịtị.
- source_word: ἡ αἰώνιος ζωὴ
  choice: ndụ ebighị ebi
  rationale: Nke a bụ okwu Igbo doro anya ma guzosie ike maka ndụ na-adịgide adịgide nke oge na-abịa.
- source_word: ἵνα γινώσκωσι
  choice: ka ha mara
  rationale: ‘Ka’ na-ewebata ihe ndụ ebighị ebi pụtara n’ebe a; ‘mara’ na-ekwe ka nghọta nke ịmata mmadụ n’ụzọ mmekọrịta nọgide, n’enweghị nkọwa agbakwunyere.
- source_word: σὲ τὸν μόνον ἀληθινὸν θεὸν
  choice: gị, onye naanị ya bụ ezi Chineke
  rationale: Ọ na-agwa Nna okwu kpọmkwem ma debe nkwupụta ahụ na ọ bụ naanị ya bụ ezi Chineke, n’enweghị ịgbakwunye nkọwa banyere arụmụka okpukpe e mesịrị.
- source_word: καὶ ὃν ἀπέστειλας
  choice: marakwa … onye i zitere
  rationale: ‘-kwa’ na-ejikọta ihe nke abụọ ha ga-amara, ebe ‘onye i zitere’ na-egosipụta Jizọs dịka onye Nna zitere.
- source_word: Ἰησοῦν Χριστόν
  choice: Jizọs bụ́ Mesaya ahụ
  rationale: Χριστός ka nwere ike ịbụ utu aha n’ebe a; ‘Mesaya ahụ’ na-eme ka utu aha ahụ doo anya n’Igbo, ebe ihe odide ala na-echekwa nsụgharị ọdịnala ‘Jizọs Kraịst.’
theological_decisions:
- issue: Mmekọrịta okwu ‘naanị ezi Chineke’ na Jizọs
  choice: E debere Nna dịka onye a na-akpọ ‘onye naanị ya bụ ezi Chineke,’ ma kewapụ Jizọs dịka onye Nna zitere.
  alternative: Ịgbakwunye okwu ga-eme ka ozizi Atọ n’Ime Otu pụta ìhè, ma ọ bụ ịgbanwe ahịrịokwu ahụ ka ọdịiche dị n’etiti Nna na Jizọs belata.
  rationale: Amaokwu ahụ kwesịrị ikwu kpọmkwem ihe Grik kwuru ma hapụ esemokwu nkà mmụta okpukpe ya ka ọ dị, n’enweghị ịgọnahụ ma ọ bụ ịgbakwunye ihe Oziọma Jọn na-akụzi n’ebe ndị ọzọ.
- issue: Nsụgharị Χριστόν
  choice: Mesaya
  alternative: Kraịst
  rationale: N’ahịrịokwu nkwupụta a, ihe Χριστός pụtara dịka utu aha ka na-anụ nke ọma; n’ihi ya, isi ederede ji ‘Mesaya,’ ebe ihe odide ala nyere ụdị ọdịnala ‘Kraịst.’
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-esochi usoro echiche Grik, ma njikọ ‘marakwa’ na-eme ka ọ bụrụ Igbo sitere n’ọnụ mmadụ. E tinyere akara [a] ozugbo n’akụkụ ‘Mesaya ahụ,’ ebe nkọwa ya metụtara.
