  yaml_path: translation/nt/john/017/018.yaml
  text: Just as you sent me into the world, I also sent them into the world.
translation:
  language: ig
  text: Dịka i zitere m n’ụwa, mụ onwe m kwa zitere ha n’ụwa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθὼς
  choice: Dị nnọọ ka
  rationale: Ọ na-egosipụta ntụnyere doro anya n’etiti iziga Jizọs na iziga ndị na-eso ụzọ ya, ma bụrụkwa okwu Igbo sitere n’ọnụ ma dị ugwu.
- source_word: ἐμὲ
  choice: m
  rationale: Ọ bụ ihe nnara nke ngwaa ahụ; ‘m’ bụ ntụgharị Igbo kwụ ọtọ ma dabara n’usoro ahịrịokwu a.
- source_word: ἀπέστειλας
  choice: i zitere
  rationale: A họọrọ ngwaa ‘zite’ kama ịkọwa ya dịka ‘nye ọrụ,’ ka e chekwaa ma echiche iziga mmadụ ma asụsụ ozi e ji mara Jọn.
- source_word: εἰς τὸν κόσμον
  choice: n’ime ụwa
  rationale: Ọ na-echekwa echiche ngagharị ịbanye n’ụwa nakwa ụda nkà mmụta okpukpe nke κόσμος n’Oziọma Jọn, n’enweghị ịkọwa okwu ahụ gabiga ihe odide ahụ.
- source_word: κἀγὼ
  choice: ezitekwara m
  rationale: Mgbakwunye ‘-kwa-’ na-egosipụta καί nke pụtara ‘mụ onwe m kwa,’ ma na-eme ka Igbo ahụ na-aga nke ọma.
- source_word: ἀπέστειλα
  choice: ezitere
  rationale: E ji otu mgbọrọgwụ ngwaa ahụ, ‘zite,’ mee ihe ọzọ iji chekwaa ntụnyere a kpachapụrụ anya n’etiti omume Nna na nke Ọkpara.
- source_word: αὐτοὺς
  choice: ha
  rationale: Ọ na-ezo aka n’ebe ndị na-eso ụzọ nọ dịka ihe nnara ngwaa; ‘ha’ bụ nnọchiaha Igbo kwesịrị ekwesị.
- source_word: κόσμον
  choice: ụwa
  rationale: ‘Ụwa’ bụ ntụgharị nkịtị nke κόσμος ma na-ahapụ nghọta Jọn sara mbara—ụwa mmadụ nke ozi ahụ na-abanye, nke nwekwara ike iguzogide Chineke—ka ọ dị n’enweghị imechi ya n’otu nkọwa.
theological_decisions:
- issue: Ntụnyere dị n’etiti Nna iziga Ọkpara na Ọkpara iziga ndị na-eso ụzọ ya
  choice: 'E chekwara otu ngwaa ahụ: ‘zitere ... ezitekwara.’'
  alternative: ‘zitere ... nyere ọrụ’ ma ọ bụ ‘zitere ... zipụrụ’
  rationale: Iji otu mgbọrọgwụ ngwaa chekwaa nhazi na ntụnyere nke Grik. Ọ na-egosi myirịta nke ozi abụọ ahụ, ma ọ naghị ekwu na ọnọdụ ma ọ bụ ụdị ozi ndị na-eso ụzọ ahụ bụ otu ihe kpọmkwem na ozi pụrụ iche nke Ọkpara.
translation_notes:
  register: Igbo Izugbe nke oge a, dị mfe nghọta ma dị ugwu. E chekwara nhazi ahịrịokwu abụọ na nkwughachi nke ngwaa ‘zite.’ ‘N’ime ụwa’ na-egosipụta εἰς nke ọma karịa ‘n’ụwa’ ma na-ahapụ ịdị omimi nke okwu Jọn ‘ụwa’ ka ọ dị.
