  to: Ihe niile nke m bụ nke gị, ihe niile nke gị bụ nke m, e nyeworo m otuto n’ime ha.[a]
  rationale: The revision removes additions not present in the Greek, makes the two reciprocal clauses fully parallel, and retains the Greek perfect passive with natural Igbo wording. The footnote continues to mark the contextual range of ἐν αὐτοῖς while leaving the main text direct and noninterpretive.
