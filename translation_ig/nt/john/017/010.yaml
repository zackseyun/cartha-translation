id: JHN.17.10
reference: John 17:10
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ τὰ ἐμὰ πάντα σά ἐστιν καὶ τὰ σὰ ἐμά, καὶ δεδόξασμαι ἐν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/010.yaml
  text: And all that is mine is yours[a], and what is yours is mine, and I have been glorified in them.
translation:
  language: ig
  text: Ihe niile nke m bụ nke gị, ihe niile nke gị bụ nke m, e nyeworo m otuto n’ime ha.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “site na ha” ma ọ bụ “n’etiti ha.” Grik kwuru, “n’ime ha,” nke nwere ike igosi ọnọdụ, ụzọ, ma ọ bụ ngosipụta n’ọnọdụ a.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ ἐμὰ πάντα
  choice: Ihe niile bụ nke m
  rationale: Nkebi a na-egosi n’ozuzu ihe niile bụ nke Jizọs. Nsụgharị a bụ Igbo doro anya ma ghara ime ka okwu ahụ yie ka ọ na-ekwu naanị banyere ngwongwo.
- source_word: σά
  choice: bụ nke gị
  rationale: Nke a na-egosipụta nnwe n'ụzọ dị nkenke ma kwekọọ n’usoro ahịrịokwu Igbo.
- source_word: τὰ σὰ ἐμά
  choice: ihe ndị bụkwa nke gị bụ nke m
  rationale: Nke a na-echekwa nkwughachi nke nnwe dị n’etiti Nna na Ọkpara ma na-ada nke ọma n’Igbo.
- source_word: δεδόξασμαι
  choice: e nyewokwa m otuto
  rationale: Perfect passive a na-egosi na e nyela Jizọs otuto, ihe si na ya pụta ka na-adịkwa. Usoro a na-echekwa olu nnara ahụ n’Igbo eke.
- source_word: ἐν αὐτοῖς
  choice: n’ime ha
  rationale: Nke a bụ nsụgharị kacha nso nye ἐν αὐτοῖς, ma ọ naghị ekpebi ma echiche ya bụ ọnọdụ, ụzọ e si mee ihe, ma ọ bụ ngosipụta.
theological_decisions:
- issue: Nnwe jikọrọ Ọkpara na Nna
  choice: 'E kwuru ya hoo haa dị ka nnwe na-aga n’akụkụ abụọ: ihe niile bụ nke m bụ nke gị, ihe ndị bụkwa nke gị bụ nke m.'
  alternative: Ime ka okwu ahụ bụrụ naanị na ha na-arụkọ ọrụ ọnụ, kama ịbụ nnwe jikọrọ ha.
  rationale: Grik kwuru nnwe na-aga n’akụkụ abụọ n’enweghị ime ka ọ dị nro. Nsụgharị ahụ echekwaghị okwu ahụ ma ghara itinye okwu nkwenkwe e dere mgbe e mesịrị.
- issue: Ihe ἐν αὐτοῖς pụtara
  choice: Idowe “n’ime ha” n’ahịrịokwu bụ isi.
  alternative: “site n’aka ha” dị ka ụzọ e si nye otuto, ma ọ bụ “n’etiti ha” dị ka ebe ma ọ bụ mmekọrịta.
  rationale: ἐν nwere ike ibu ọtụtụ echiche ndị a n’ọnọdụ a; ya mere, ọ ka mma ichekwa mgbagwoju anya ahụ n’ahịrịokwu bụ isi ma tinye ụzọ ndị ọzọ na nkọwa ala peeji.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji “e nyewokwa m otuto” zere okwu arọ ma chekwaa passive perfect; e debere “n’ime ha” iji ghara idozi mgbagwoju anya nke Grik n’amaghị ama.
