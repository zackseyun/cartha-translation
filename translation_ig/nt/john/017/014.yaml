  text: ἐγὼ δέδωκα αὐτοῖς τὸν λόγον σου, καὶ ὁ κόσμος ἐμίσησεν αὐτούς, ὅτι οὐκ εἰσὶν ἐκ τοῦ κόσμου καθὼς ἐγὼ οὐκ εἰμὶ ἐκ τοῦ κόσμου.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/014.yaml
  text: I have given them your word[a], and the world has hated them because they are not of the world, just as I am not of the world.
translation:
  language: ig
  text: Enyewo m ha okwu gị, ụwa kpọrọ ha asị, n’ihi na ha esighị n’ụwa[a], dị nnọọ ka mụ onwe m esighị n’ụwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ha abụghị ndị nke ụwa.” Okwu Grik ahụ na-ekwu n’ụzọ nkịtị, “site na”; ọ pụkwara igosi ebe ihe si malite ma ọ bụ ihe mmadụ bụ nke ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: δέδωκα
  choice: Enyewo m
  rationale: Ụdị a na-egosi na inye ahụ emezuola ma ihe si na ya pụta ka dịkwa ugbu a, dịka perfect tense Grik si dị.
- source_word: λόγον
  choice: okwu
  rationale: “Okwu” na-echekwa ụdị okwu Jọn ji na obosara ihe ọ pụtara karịa ịkọwa ya naanị dịka “ozi.”
- source_word: κόσμος
  choice: ụwa
  rationale: “Ụwa” bụ okwu Igbo sara mbara nke na-echekwa ụzọ Jọn si eji κόσμος; ọnọdụ amaokwu ahụ na-egosi mmegide ya n’ebe ndị na-eso ụzọ nọ n’enweghị mgbakwunye nkọwa n’ime ederede.
- source_word: ἐμίσησεν
  choice: ụwa kpọkwara ha asị
  rationale: Nke a na-asụgharị aorist ahụ n’ụzọ Igbo doro anya ma na-ejikọta omume ahụ na inye ha okwu ahụ.
- source_word: ὅτι
  choice: n’ihi na
  rationale: N’ebe a, ὅτι na-egosi ihe kpatara ụwa ji kpọọ ha asị.
- source_word: ἐκ τοῦ κόσμου
  choice: esiteghị n’ụwa
  rationale: “Isite n’ụwa” na-echekwa echiche ἐκ banyere isi mmalite ma ọ bụ ịbụ nke otu ebe, n’etinyeghị nkọwa karịrị ihe Grik kwuru.
- source_word: καθὼς
  choice: dị nnọọ ka
  rationale: Nke a na-eme ka ntụnyere dị n’etiti ndị na-eso ụzọ na Jizọs pụta ìhè.
theological_decisions:
- issue: Mmekọrịta ndị na-eso ụzọ na “ụwa” ma e jiri ya tụnyere nke Jizọs
  choice: “ha esiteghị n’ụwa, dị nnọọ ka mụ onwe m na-esiteghị n’ụwa”
  alternative: “ha abụghị ndị ụwa, dị nnọọ ka mụ onwe m na-abụghị onye ụwa”
  rationale: Nhọrọ a na-echekwa ntụnyere ahụ n’ụzọ kwụ ọtọ nakwa mgbagwoju anya ἐκ nwere banyere isi mmalite ma ọ bụ ịbụ nke otu ihe, n’emeghị ka ọ bụrụ naanị okwu gbasara otu mmadụ sonyere ma ọ bụ nkwupụta metaphysical karịrị ederede.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “Mụ onwe m” na-eme ka ἐγώ pụta ìhè n’ime ntụnyere ahụ; “na-esiteghị” dabara n’okwu njirimara na-adịgide adịgide n’akụkụ nke abụọ.
