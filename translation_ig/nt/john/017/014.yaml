revisions:
- from: Enyewo m ha okwu gị, ụwa kpọkwara ha asị, n’ihi na ha esiteghị n’ụwa[a], dị nnọọ ka mụ onwe m na-esiteghị n’ụwa.
  to: Enyewo m ha okwu gị, ụwa kpọrọ ha asị, n’ihi na ha esighị n’ụwa[a], dị nnọọ ka mụ onwe m esighị n’ụwa.
  rationale: The revision removes an added additive nuance, improves the idiomatic parallelism of the final comparison, and refines the footnote’s alternative wording. It retains the Greek ἐκ sense of source/origin or belonging and does not resolve that breadth into a narrower doctrinal claim.
