source:
  edition: SBLGNT
  text: οὐκ ἐρωτῶ ἵνα ἄρῃς αὐτοὺς ἐκ τοῦ κόσμου ἀλλ’ ἵνα τηρήσῃς αὐτοὺς ἐκ τοῦ πονηροῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/015.yaml
  text: I am not asking that you take them out of the world[a], but that you keep them from the evil one.
translation:
  language: ig
  text: Ọ bụghị ka i wepụ ha n’ụwa ka m na-arịọ, kama ka i chebe ha pụọ n’aka ajọ onye ahụ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ka i chebe ha pụọ n’ihe ọjọọ.” Okwu Grik τοῦ πονηροῦ nwere ike ịpụta ma “ajọ onye ahụ” ma “ihe ọjọọ.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἐρωτῶ
  choice: Anaghị m arịọ
  rationale: “Arịọ” na-egosipụta ịrịọ Nna arịrịọ n’ụzọ nkịtị ma dị ugbu a, n’enweghị itinye okwu ụka pụrụ iche.
- source_word: ἄρῃς
  choice: i wepụ
  rationale: N’ebe a αἴρω pụtara iwepụ ma ọ bụ ịkpọpụ; “wepụ ha n’ụwa” bụ Igbo doro anya ma kwekọọ na ἐκ τοῦ κόσμου.
- source_word: κόσμου
  choice: ụwa
  rationale: “Ụwa” bụ okwu Igbo sara mbara nke na-edobe ọtụtụ nghọta κόσμος nwere n’ihe odide Jọn n’emeghị ka ọ bụrụ naanị ọha mmadụ ma ọ bụ usoro ụwa.
- source_word: τηρήσῃς
  choice: i chebe
  rationale: τηρέω nwere ike ịpụta idebe, ichekwa, ma ọ bụ ichebe. “Chebe” na-ekwupụta echiche nke nchekwa n’Igbo dị ugbu a ma dabara na njikọ ya na ἐκ.
- source_word: ἐκ
  choice: pụọ n’aka
  rationale: N’ahịrịokwu τηρήσῃς ... ἐκ, “chebe ... pụọ n’aka” bụ ụzọ Igbo e si ekwu nchekwa megide onye na-eme ihe ọjọọ; ọ dị iche n’ụzọ kwesịrị ekwesị na “wepụ ... n’ụwa.”
- source_word: τοῦ πονηροῦ
  choice: ajọ onye ahụ
  rationale: Ụdị Grik ahụ nwere ike ịbụ nwoke, “ajọ onye ahụ,” ma ọ bụ ihe na-abụghị onye, “ihe ọjọọ.” Ojiji Jọn na-akwado nghọta nke onye, ma a na-edobe nghọta ọzọ n’ala peeji.
theological_decisions:
- issue: Ma τοῦ πονηροῦ ọ̀ bụ ihe ọjọọ n’ozuzu ya ka ọ̀ bụ ajọ onye ahụ
  choice: ajọ onye ahụ
  alternative: ihe ọjọọ
  rationale: Ụdị Grik ahụ nwere ezi nghọta abụọ. Ọnọdụ okwu na ojiji Jọn na-eme ka nghọta nke onye bụrụ nke a họọrọ, ma ala peeji na-edobe nghọta nke “ihe ọjọọ” ka a ghara idozi esemokwu dị n’asụsụ mbụ n’enweghị ihe akaebe zuru ezu.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị ugbu a ma dị ùgwù. Ahịrịokwu ahụ na-eji usoro dị mfe nke ndị na-agụ akwụkwọ taa ga-aghọta, ma na-edobe ọdịiche dị n’etiti ịnọ n’ụwa na ịbụ onye a na-echebe pụọ n’aka ajọ onye ahụ.
