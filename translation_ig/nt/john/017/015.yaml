- from: Anaghị m arịọ ka i wepụ ha n’ụwa, kama ka i chebe ha pụọ n’aka ajọ onye ahụ.[a]
  to: Ọ bụghị ka i wepụ ha n’ụwa ka m na-arịọ, kama ka i chebe ha pụọ n’aka ajọ onye ahụ.[a]
  rationale: The revision improves the Igbo expression of the source’s explicit negative-versus-positive contrast without changing its meaning. It retains the draft’s sound lexical choices and keeps the disputed personal/impersonal sense of τοῦ πονηροῦ available in the footnote.
