    text: Ma ọ bụ, “ka i chebe ha pụọ n’ihe ọjọọ.” Okwu Grik τοῦ πονηροῦ nwere ike ịpụta ma “ajọ onye ahụ” ma “ihe ọjọọ.”
    reason: alternative_reading
  revision_rationale: The revision improves the Igbo expression of the source’s explicit negative-versus-positive contrast without changing its meaning. It retains the draft’s sound lexical choices and keeps the disputed personal/impersonal sense of τοῦ πονηροῦ available in the footnote.
