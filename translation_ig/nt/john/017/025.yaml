id: JHN.17.25
reference: John 17:25
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸀Πάτερ δίκαιε, καὶ ὁ κόσμος σε οὐκ ἔγνω, ἐγὼ δέ σε ἔγνων, καὶ οὗτοι ἔγνωσαν ὅτι σύ με ἀπέστειλας,
base_translation:
  language: en
  yaml_path: translation/nt/john/017/025.yaml
  text: Righteous Father[a], though the world has not known you, I have known you[b], and these have known that you sent me.
translation:
  language: ig
  text: Nna, onye ezi omume, ọ bụ ezie na ụwa[a] amaghị gị, ma mụ onwe m maara gị, ndị a makwaara na ọ bụ gị zitere m.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’Oziọma Jọn, “ụwa” na-apụtakarị ọ bụghị naanị ihe niile e kere eke, kama ụmụ mmadụ n’ọnọdụ nkewapụ ha n’ebe Chineke nọ.
    reason: cross_reference
  - marker: b
    text: Grik ji ụdị aorist mee okwu ndị a banyere ịma. N’Igbo, “amaghị,” “maara,” na “makwaara” na-ahapụ ihe gbara amaokwu ahụ gburugburu igosi ma a ga-aghọta ha dịka ihe mere n’oge gara aga ma ọ bụ dịka ihe ka dị mkpa ugbu a.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάτερ δίκαιε
  choice: Nna onye ezi omume
  rationale: Ọ bụ okwu a na-akpọ Nna ozugbo. “Onye ezi omume” na-edobe ịdị mma na izi ezi dị n’okwu δίκαιος, n’emeghị ka ọ bụrụ naanị ikpe ikpe ziri ezi.
- source_word: καὶ
  choice: ọ bụ ezie na
  rationale: 'καὶ nke mbụ na-arụ ọrụ nkwenye megidere ihe na-esote: ụwa amaghị Nna, ma Jizọs maara ya. Nsụgharị a na-eme ka njikọ ahụ doo anya n’Igbo nkịtị.'
- source_word: ὁ κόσμος
  choice: ụwa
  rationale: “Ụwa” na-edobe obosara na nghọta pụrụ iche okwu κόσμος nwere n’Oziọma Jọn, kama ịkọwa ya naanị dịka “ndị mmadụ nọ n’ụwa.”
- source_word: ἔγνω / ἔγνων / ἔγνωσαν
  choice: amaghị / maara / makwaara
  rationale: Ụdị ndị a bụ ụzọ Igbo dị nkenke ma bụrụkwa nke ebumpụta ụwa isi kwuo ịma mmadụ n’echiche nke nghọta na mmekọrịta. Ha anaghị amanye nkọwa oge nke Grik karịa ka ihe gbara amaokwu ahụ gburugburu kwadoro.
- source_word: ἐγὼ δέ
  choice: ma mụ onwe m
  rationale: “Ma” na-egosipụta ọdịiche doro anya, ebe “mụ onwe m” na-eburu nkwusi ike dị na ἐγώ.
- source_word: οὗτοι
  choice: ndị a
  rationale: Ọ na-edobe okwu ngosi Grik n’ebughị ụzọ tinye “ndị na-eso ụzọ,” ọ bụ ezie na ihe gbara amaokwu ahụ gburugburu na-egosi ndị ọ na-ekwu maka ha.
- source_word: ὅτι σύ με ἀπέστειλας
  choice: na ọ bụ gị zitere m
  rationale: “Na” na-ewebata ihe ha maara; “ọ bụ gị” na-egosipụta nkwusi ike dị na σύ, “zitere m” na-asụgharị aorist ἀπέστειλας n’ụzọ Igbo doro anya.
theological_decisions:
- issue: Àgwà Nna nke δίκαιε na-egosi
  choice: Nna onye ezi omume
  alternative: Nna onye ikpe ziri ezi
  rationale: “Onye ezi omume” na-edobe ịdị nsọ na izi ezi n’obosara ya, ebe “onye ikpe ziri ezi” nwere ike ime ka okwu ahụ bụrụ naanị gbasara ikpe.
- issue: Ihe κόσμος pụtara n’akwụkwọ Jọn
  choice: ụwa
  alternative: ndị mmadụ nke ụwa
  rationale: “Ụwa” na-ahapụ nghọta okwu ahụ sara mbara—ụmụ mmadụ n’ọnọdụ nkewapụ ha n’ebe Chineke nọ—na-enweghị idozi ya n’otu nkọwa naanị.
- issue: Oge na ọdịdị omume nke aorist γινώσκω
  choice: amaghị / maara / makwaara
  alternative: amatabeghị / amatala / amatakwala
  rationale: Ụdị isiokwu họọrọ bụ Igbo ebumpụta ụwa maka ịma mmadụ ma na-ahapụ njikọ dị n’etiti ihe mere na mkpa ọ ka nwere ugbu a. Ụdị “amatala” ga-eme ka echiche ‘ịbịarute n’ịma’ sie ike karịa ihe ederede chọrọ.
translation_notes:
  register: E ji Standard Igbo nke dị ugwu ma dị mfe nghọta mee ya. Ahịrịokwu ahụ na-edobe ọdịiche dị n’etiti ụwa na Jizọs, nkwusi ike dị na “mụ onwe m” na “ọ bụ gị,” na nghọta mmekọrịta dị n’okwu “ịma.”
