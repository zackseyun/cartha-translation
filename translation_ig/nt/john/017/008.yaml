id: JHN.17.8
reference: John 17:8
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὅτι τὰ ῥήματα ἃ ⸀ἔδωκάς μοι δέδωκα αὐτοῖς, καὶ αὐτοὶ ἔλαβον καὶ ἔγνωσαν ἀληθῶς ὅτι παρὰ σοῦ ἐξῆλθον, καὶ ἐπίστευσαν ὅτι σύ με ἀπέστειλας.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/008.yaml
  text: For the words that you gave me I have given to them[a], and they received them and truly came to know that I came from you[b], and they believed that you sent me.
translation:
  language: ig
  text: N’ihi na okwu ndị i nyere m ka m nyeworo ha[a]; ha natara ha, matara n’ezie na m sitere n’aka gị bịa[b], ma kwere na ọ bụ gị zitere m.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “okwu e kwuru.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “m sitere n’aka gị pụta.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ῥήματα
  choice: okwu
  rationale: “Okwu” bụ ụzọ Igbo nkịtị si akọwa okwu e kwuru ma na-echekwakwa ụdị ọtụtụ ihe dị na Grik; a naghị agbanwe ya ka ọ bụrụ otu “ozi,” nke ga-abụ nkọwa sara mbara karịa ederede ahụ.
- source_word: ἔδωκάς ... δέδωκα
  choice: i nyere ... enyewo m
  rationale: “I nyere” na-egosi ihe e mere, ebe “enyewo m” na-echekwa ọdịiche nke perfect Grik—ihe e mezuru nke nsonaazụ ya ka dị ugbu a.
- source_word: αὐτοῖς
  choice: ha
  rationale: N’usoro “enyewo m ha okwu,” “ha” bụ ndị e nyere okwu ahụ, dịka dative Grik si arụ ọrụ.
- source_word: ἔλαβον
  choice: nata
  rationale: “Nata” dabara n’ihe mmadụ na-enweta mgbe e nyere ya ya, ma ọ naghị etinye nkọwa ọzọ dịka “nabata” nwere ike ime.
- source_word: ἔγνωσαν ἀληθῶς
  choice: matakwa n’ezie
  rationale: “Mata” na-egosi na ha bịara ghọta ma mara ya, “n’ezie” na-echekwakwa ἀληθῶς n’enweghị ịgbakwunye echiche ọzọ.
- source_word: παρὰ σοῦ ἐξῆλθον
  choice: m si n’ebe ị nọ bịa
  rationale: Nkebi a na-egosi ebe Jizọs si malite njem ya ma ọ bụ ebe o si bịa. Okwu Igbo a bụ nke doro anya ma hapụkwa ịdị arọ nke okwu ahụ dịka ederede si dị.
- source_word: ἐπίστευσαν
  choice: ha wee kwere
  rationale: Ebe πιστεύω sochiri nkebi “na...,” “kwere na” na-egosi nkwenye na okwu ahụ bụ eziokwu, dịka nhazi Grik si dị.
- source_word: ἀπέστειλας
  choice: zitere
  rationale: “Zitere” bụ okwu Igbo kwụ ọtọ maka iziga mmadụ, na-enweghị ịgbakwunye echiche pụrụ iche nke inye ya ọkwa ma ọ bụ ọrụ.
- source_word: ὅτι
  choice: N’ihi na
  rationale: ὅτι nke mbụ na-ejikọta amaokwu a na nke bu ya ụzọ dịka ihe kpatara ya ma ọ bụ nkọwa ya; “N’ihi na” na-egosi njikọ ahụ n’Igbo doro anya.
theological_decisions:
- issue: Mmekọrịta Jizọs na Nna n’okwu παρὰ σοῦ ἐξῆλθον
  choice: m si n’ebe ị nọ bịa
  alternative: m si n’ebe ị nọ pụta
  rationale: Nhọrọ a na-echekwa nkwupụta banyere ebe Jizọs si bịa n’enweghị itinye okwu nkà mmụta okpukpe ndị mechara pụta. Ihe ọzọ a pụrụ ịsụ bụ “pụta,” nke na-egosipụta ἐξῆλθον n’ụzọ kpọmkwem karị.
- issue: Ụzọ e si sụgharị πιστεύω mgbe ὅτι-clause so ya
  choice: kwere na
  alternative: tụkwasịrị obi na
  rationale: Ihe ha kweere bụ nkwupụta ahụ—na Nna zitere Jizọs. “Kwere na” na-echekwa nhazi na ike okwu Grik karịa “tụkwasịrị obi,” nke nwere ike ime ka ọ bụrụ naanị mmekọrịta mmadụ na ibe ya.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta, dee ya. A họọrọ “enyewo m” iji chekwaa nsonaazụ ka dị ugbu a nke perfect Grik, ma jiri “wee” mee ka usoro omume ndị dị n’amaokwu ahụ na-aga nke ọma n’Igbo.
