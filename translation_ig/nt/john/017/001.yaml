id: JHN.17.1
reference: John 17:1
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ταῦτα ⸀ἐλάλησεν Ἰησοῦς, καὶ ⸂ἐπάρας τοὺς ὀφθαλμοὺς αὐτοῦ εἰς τὸν οὐρανὸν εἶπεν⸃· Πάτερ, ἐλήλυθεν ἡ ὥρα· δόξασόν σου τὸν υἱόν, ⸀ἵνα ὁ ⸀υἱὸς δοξάσῃ σέ,
base_translation:
  language: en
  yaml_path: translation/nt/john/017/001.yaml
  text: 'Jesus said these things, and lifting up his eyes to heaven, he said: “Father, the hour has come. Glorify your Son, so that the Son may glorify you,”'
translation:
  language: ig
  text: 'Mgbe Jizọs kwusịrị ihe ndị a, o weliri anya ya lee eluigwe wee sị: “Nna, awa ahụ eruola. Nye Ọkpara gị otuto, ka Ọkpara ahụ wee nye gị otuto.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ταῦτα
  choice: ihe ndị a
  rationale: Ọ bụ nrụtụaka n'ụdị ọtụtụ nke na-ezo aka n'okwu ndị Jizọs kwuru tupu nke a; ‘ihe ndị a’ na-edobe ụdị ọtụtụ ahụ n'Igbo dị mfe.
- source_word: ἐλάλησεν
  choice: kwusịrị
  rationale: N'ọnọdụ a, λαλέω na-ezo aka n'okwu ndị e kwuburu; ‘kwusịrị’ na-egosi na mgbe o kwuchara ha ka ihe na-esote mere.
- source_word: ἐπάρας τοὺς ὀφθαλμοὺς αὐτοῦ εἰς τὸν οὐρανόν
  choice: o weliri anya ya lee eluigwe
  rationale: Nke a na-edobe mmegharị ahụ na ntụziaka ya, ma bụrụkwa ụzọ Igbo sitere n'okike si akọ mmadụ weliri anya ya n'ebe eluigwe dị.
- source_word: Πάτερ
  choice: Nna
  rationale: Ọ bụ okwu ịkpọku kpọmkwem na-enweghị ‘nke m’; ‘Nna’ na-edobe nke ahụ n'etinyeghị okwu ọzọ.
- source_word: ἐλήλυθεν ἡ ὥρα
  choice: oge awa ahụ eruola
  rationale: ‘Oge awa’ na-echekwa okwu ὥρα na isiokwu pụrụ iche ọ nwere n'Oziọma Jọn, ebe ‘eruola’ na-egosi na oge a kara aka abịala ugbu a.
- source_word: δόξασόν
  choice: Nye ... otuto
  rationale: N'Igbo nke oge a, ‘inye otuto’ bụ ụzọ doro anya ma dị nsọ e si kwupụta δοξάζω, na-echekwa echiche nsọpụrụ na mkpughe ebube.
- source_word: σου τὸν υἱόν
  choice: Ọkpara gị
  rationale: Nke a na-edobe njikọ nwe nke σου na υἱόν; ‘Ọkpara’ dabara n'aha nsọ nke Jizọs dị ka Ọkpara Nna.
- source_word: ἵνα
  choice: ka ... wee
  rationale: Usoro ‘ka ... wee’ na-egosi ebumnuche ma ọ bụ ihe ga-esi na ya pụta, na-enweghị ikpebi naanị otu n'ime nghọta abụọ ahụ.
- source_word: ὁ υἱὸς
  choice: Ọkpara ahụ
  rationale: ‘Ahụ’ na-egosipụta edemede Greek ahụ ma na-echekwa mgbanwe site na ‘Ọkpara gị’ gaa n'isiokwu a kpọrọ aha, ‘Ọkpara ahụ.’
- source_word: δοξάσῃ σέ
  choice: wee nye gị otuto
  rationale: Nke a na-edobe otu okwu ahụ e ji sụgharịa δοξάζω na akụkụ mbụ, si otú ahụ chekwaa nhata na nzaghachi dị n'etiti Nna na Ọkpara.
theological_decisions:
- issue: Otuto nke Nna na Ọkpara na-enye ibe ha
  choice: “Nye Ọkpara gị otuto, ka Ọkpara ahụ wee nye gị otuto”
  alternative: “Mee ka ebube Ọkpara gị pụta ìhè, ka o wee mee ka ebube gị pụta ìhè”
  rationale: Nhọrọ ahụ na-echekwa otu ngwaa δοξάζω n'akụkụ abụọ ahụ na njikọ dị n'etiti Nna na Ọkpara, na-enweghị ịgbasa ya site n'ịkọwa kpọmkwem otú otuto ahụ ga-esi pụta.
- issue: Iji ‘Ọkpara’ dịka aha nsọ
  choice: E ji mkpụrụedemede ukwu dee ‘Ọkpara’ mgbe ọ na-ezo aka na Jizọs.
  alternative: ọkpara
  rationale: N'ebe a, υἱός na-arụ ọrụ dịka aha e ji amata Jizọs n'ime mmekọrịta ya na Nna; mkpụrụedemede ukwu na-enyere onye na-agụ aka ịhụ nke a n'etinyeghị ozizi ọzọ n'okwu ahụ.
translation_notes:
  register: Asụsụ ahụ bụ Standard Igbo nke oge a, dị nsọ ma dị mfe nghọta. E ji ‘oge awa ahụ’ chekwaa okwu pụrụ iche Jọn ji akọ oge a kara aka, ma zere ịtụgharị ya naanị ka ọ bụrụ ‘oge ahụ.’
