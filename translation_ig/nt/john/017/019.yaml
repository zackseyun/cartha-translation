    text: A pụkwara ịtụgharị ya, “ana m enyefe onwe m maka ọrụ dị nsọ.” Otu mgbọrọgwụ ngwaa Grik ahụ ka e jikwa mee okwu a sụgharịrị “ndị e doro nsọ” n’akụkụ ikpeazụ nke amaokwu a.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “n’ime eziokwu ahụ”; tulee Jọn 17:17.
    reason: alternative_reading
  revision_rationale: The revision clarifies the scope of the Greek additive καί while retaining its effect in “ha kwa,” makes the emphatic self-reference explicit with “mụ onwe m,” and lightly improves footnote idiom and precision. It preserves the source’s lexical repetition, purpose clause, passive perfect-result sense, and ambiguity in ἐν ἀληθείᾳ.
