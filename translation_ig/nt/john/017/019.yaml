revisions:
- from: Maka ha kwa, ana m edo onwe m nsọ[a], ka ha onwe ha kwa bụrụ ndị e doro nsọ n’eziokwu[b].
  to: N’ihi ha, mụ onwe m na-edo onwe m nsọ[a], ka ha kwa bụrụ ndị e doro nsọ n’eziokwu[b].
  rationale: The revision clarifies the scope of the Greek additive καί while retaining its effect in “ha kwa,” makes the emphatic self-reference explicit with “mụ onwe m,” and lightly improves footnote idiom and precision. It preserves the source’s lexical repetition, purpose clause, passive perfect-result sense, and ambiguity in ἐν ἀληθείᾳ.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T08:24:45Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the purpose relation, the reflexive self-consecration, the passive/resultative sense of ἡγιασμένοι, and the deliberately non-articular ἐν ἀληθείᾳ. However, “Maka ha kwa” can suggest that the disciples themselves are additionally included (“for them also”), whereas καί most naturally continues the preceding discourse and αὐτῶν has no additive force. Moving kwa to the disciples in the purpose clause more clearly represents καὶ αὐτοί.
  naturalness: “N’ihi ha, mụ onwe m na-edo onwe m nsọ” is more idiomatic Standard Igbo and gives appropriate emphasis to ἐγώ/ἐμαυτόν. “Ka ha kwa bụrụ ndị e doro nsọ n’eziokwu” is clear, formal, and natural in a biblical register.
  terminology: “Ido ... nsọ” and “ndị e doro nsọ” appropriately preserve the repeated ἁγιάζω root without implying that Jesus was previously morally impure. “N’eziokwu” retains the Greek’s ambiguity; the footnote supplies the viable contextual alternative without forcing it.
  issues:
  - severity: low
    issue: Placement and scope of “kwa” in the opening phrase
    rationale: In “Maka ha kwa,” kwa may be read as modifying “ha” (‘for them also’). The Greek καί is better represented by kwa with “ha” in the purpose clause, where it corresponds directly to καὶ αὐτοί; the opening connective need not be separately translated.
  - severity: low
    issue: Footnote a wording
    rationale: “A pụkwara ịtụgharị ya” is a more natural way to introduce a translation alternative than “A pụkwara ịsụ ya,” and “otu mgbọrọgwụ ngwaa” states the lexical relationship more precisely.
  revised_text: N’ihi ha, mụ onwe m na-edo onwe m nsọ[a], ka ha kwa bụrụ ndị e doro nsọ n’eziokwu[b].
  revised_footnotes:
