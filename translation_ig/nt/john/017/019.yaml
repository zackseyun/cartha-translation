  text: καὶ ὑπὲρ αὐτῶν ἐγὼ ἁγιάζω ἐμαυτόν, ἵνα ⸂ὦσιν καὶ αὐτοὶ⸃ ἡγιασμένοι ἐν ἀληθείᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/019.yaml
  text: And for their sake I sanctify myself[b][a], so that they also may be sanctified in truth.
translation:
  language: ig
  text: N’ihi ha, mụ onwe m na-edo onwe m nsọ[a], ka ha kwa bụrụ ndị e doro nsọ n’eziokwu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịtụgharị ya, “ana m enyefe onwe m maka ọrụ dị nsọ.” Otu mgbọrọgwụ ngwaa Grik ahụ ka e jikwa mee okwu a sụgharịrị “ndị e doro nsọ” n’akụkụ ikpeazụ nke amaokwu a.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “n’ime eziokwu ahụ”; tulee Jọn 17:17.
    reason: alternative_reading
lexical_decisions:
- source_word: ὑπὲρ αὐτῶν
  choice: Maka ha
  rationale: Ọ na-egosi na Jizọs na-eme ihe a maka ọdịmma ha, n’ebughị echiche nnọchi anya karịa ihe okwu Grik kwuru.
- source_word: ἁγιάζω ἐμαυτόν
  choice: ana m edo onwe m nsọ
  rationale: “Ido ... nsọ” na-egosi ikewapụ ma ọ bụ inyefe onwe nye Chineke maka ọrụ dị nsọ; ọ naghị egosi na Jizọs si n’adịghị ọcha ghọọ onye dị ọcha. Ọ na-emekwa ka otu mgbọrọgwụ echiche ahụ pụta ìhè n’ahịrịokwu abụọ ahụ.
- source_word: ἵνα
  choice: ka
  rationale: “Ka” bụ ụzọ Igbo si egosi ebumnuche ma ọ bụ ihe a chọrọ ka ọ pụta.
- source_word: καὶ αὐτοὶ
  choice: ha onwe ha kwa
  rationale: Nke a na-echekwa ma nkwusi ike dị na αὐτοὶ ma echiche mgbakwunye dị na καί.
- source_word: ὦσιν ... ἡγιασμένοι
  choice: bụrụ ndị e doro nsọ
  rationale: Ụdị a na-echekwa ọnọdụ sitere n’omume e mere, nke participle perfect passive Grik na-egosi, ma mee ka passive ahụ doo anya.
- source_word: ἐν ἀληθείᾳ
  choice: n’eziokwu
  rationale: Ọ na-echekwa ohere nke ịghọta eziokwu dịka ọnọdụ ma ọ bụ mpaghara ido nsọ ahụ, na-enweghị ịgbakwunye article nke na-adịghị na Grik.
theological_decisions:
- issue: Ihe “ana m edo onwe m nsọ” pụtara banyere Jizọs
  choice: Jizọs na-ekwu na ọ na-ekewapụ ma na-enyefe onwe ya maka ọrụ ya n’ihi ndị na-eso ụzọ ya.
  alternative: Jizọs na-eme onwe ya ka ọ dị ọcha n’omume.
  rationale: N’ebe a, ἁγιάζω dabara n’echiche nke inyefe onwe maka ọrụ dị nsọ, ọ bụghị isi n’adịghị ọcha banye n’ịdị ọcha. Nsụgharị ahụ na-echekwa okwu ahụ n’enweghị ibubata nkọwa ozizi ọzọ.
- issue: Ike ἐν ἀληθείᾳ
  choice: n’eziokwu
  alternative: n’ime eziokwu ahụ; site n’eziokwu
  rationale: Grik enweghị article, ya mere isi nsụgharị anaghị eme ka “eziokwu” bụrụ nke a kọwara kpọmkwem karịa isi mmalite. Ọ ka na-ahapụ njikọ ya na Jọn 17:17 ka a nụ ya.
translation_notes:
  register: E ji Igbo Izugbe nke dị ugbu a, dị ùgwù ma dị mfe nghọta. E debere nkwughachi “ido nsọ” n’akụkụ abụọ ahụ iji gosipụta nkwughachi mgbọrọgwụ okwu Grik; “ha onwe ha kwa” na-echekwa nkwusi ike na mgbakwunye dị na καὶ αὐτοὶ.
