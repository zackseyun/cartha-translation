id: JHN.17.23
reference: John 17:23
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐγὼ ἐν αὐτοῖς καὶ σὺ ἐν ἐμοί, ἵνα ὦσιν τετελειωμένοι εἰς ἕν, ⸀ἵνα γινώσκῃ ὁ κόσμος ὅτι σύ με ἀπέστειλας καὶ ἠγάπησας αὐτοὺς καθὼς ἐμὲ ἠγάπησας.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/023.yaml
  text: I in them and you in me[a], so that they may be perfected into one, so that the world may know that you sent me and loved them just as you loved me.
translation:
  language: ig
  text: Mụ onwe m nọ n’ime ha, gị onwe gị nọkwa n’ime m, ka e wee mee ka ha zuo oke bụrụ otu,[a] ka ụwa wee mara na ọ bụ gị zitere m, nakwa na ị hụrụ ha n’anya dị nnọọ ka ị hụrụ m n’anya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “ka e mee ka ha zuo oke n’ịdị n’otu,” ma ọ bụ, “ka e weta ha n’izu oke n’ịdị n’otu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγὼ ἐν αὐτοῖς καὶ σὺ ἐν ἐμοί
  choice: Mụ onwe m nọ n’ime ha, gị onwe gị anọkwa n’ime m
  rationale: E jigidere ‘n’ime’ iji chekwaa okwu Jọn banyere ịdị n’ime ibe, ebe ‘onwe m/onwe gị’ na-egosipụta nkwusi ike dị na nnọchiaha Grik ndị ahụ.
- source_word: τετελειωμένοι
  choice: mee ka ha zuo oke
  rationale: Nke a na-egosi ọnọdụ zuru ezu nke sitere n’omume e mere, ma ọ naghị amanye nghọta nke izu oke n’enweghị mmehie.
- source_word: εἰς ἕν
  choice: bụrụ otu
  rationale: N’Igbo nkịtị, ‘bụrụ otu’ na-egosi nsonaazụ na ije ruo n’ịdị n’otu nke εἰς ἕν na-egosi.
- source_word: γινώσκῃ
  choice: wee mara
  rationale: Ọ bụ nsụgharị doro anya na nke ebumpụta ụwa maka ngwaa dị n’ahịrịokwu ebumnuche nke ἵνα.
- source_word: ὁ κόσμος
  choice: ụwa
  rationale: E chekwara okwu Jọn n’ụdị sara mbara n’akọwaghị ya n’ime ederede dị ka ‘ndị ụwa.’
- source_word: ἀπέστειλας
  choice: zitere
  rationale: ‘Zitere’ bụ okwu Igbo kwụ ọtọ nke na-echekwa echiche nke Nna izite Ọkpara.
- source_word: ἠγάπησας
  choice: hụrụ ... n’anya
  rationale: E megharịrị otu okwu ahụ ugboro abụọ dịka Grik si mee, iji chekwaa njikọ na ike okwu ahụ.
- source_word: καθὼς
  choice: dị nnọọ ka
  rationale: Nke a na-egosipụta ntụnyere ahụ n’ụzọ doro anya n’emeghị ka ike ya daa.
theological_decisions:
- issue: Ike ntụnyere dị na ‘ị hụrụ ha n’anya dị nnọọ ka ị hụrụ m n’anya’
  choice: E depụtara ntụnyere ahụ ozugbo dịka ‘dị nnọọ ka ị hụrụ m n’anya.’
  alternative: ‘dị ka ị hụrụ m n’anya,’ ma ọ bụ ịkọwa ya dịka ụdị ịhụnanya yiri nke ọzọ
  rationale: καθὼς na-enye ntụnyere siri ike; ekwesịghị ime ka ịdị arọ nke okwu ahụ belata ma ọ bụ kọwaa ya karịa ihe ederede kwuru.
- issue: Ihe τετελειωμένοι pụtara n’ebe a
  choice: ‘mee ka ha zuo oke bụrụ otu’—ime ka ha ruo mmezu n’ịdị n’otu
  alternative: ‘mee ka ha bụrụ ndị zuru oke n’otu’ ma ọ bụ ‘mezuo ha n’ịdị n’otu’
  rationale: Nhọrọ a na-echekwa echiche nke imezu ma ọ bụ iweta n’ókè zuru ezu, na-enweghị ikwu na ndị kwere ekwe eruola izu oke nke enweghị mmehie.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta. E jigidere usoro okwu banyere ịdị ‘n’ime’ na ntụnyere ịhụnanya ahụ, ebe e mere ka εἰς ἕν daa nke ọma n’Igbo dịka ‘bụrụ otu.’
