revisions:
- from: Mụ onwe m nọ n’ime ha, gị onwe gị anọkwa n’ime m, ka e wee mee ka ha zuo oke bụrụ otu,[a] ka ụwa wee mara na ọ bụ gị zitere m, nakwa na ị hụrụ ha n’anya dị nnọọ ka ị hụrụ m n’anya.
  to: Mụ onwe m nọ n’ime ha, gị onwe gị nọkwa n’ime m, ka e wee mee ka ha zuo oke bụrụ otu,[a] ka ụwa wee mara na ọ bụ gị zitere m, nakwa na ị hụrụ ha n’anya dị nnọọ ka ị hụrụ m n’anya.
