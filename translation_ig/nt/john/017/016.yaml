  text: ἐκ τοῦ κόσμου οὐκ εἰσὶν καθὼς ἐγὼ ⸂οὐκ εἰμὶ ἐκ τοῦ κόσμου⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/016.yaml
  text: They are not from the world[a], just as I am not from the world.
translation:
  language: ig
  text: Ha abụghị ndị nke ụwa[a], dị nnọọ ka mụ onwe m na-abụghị onye nke ụwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “Ha abụghị ndị sitere n’ụwa.” Okwu Grik ἐκ, nke e ji “site n’” sụgharịa, nwere ike igosi isi mmalite, ebe mmadụ si, ma ọ bụ ịbụ nke ihe ahụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ
  choice: esiteghị na
  rationale: N’usoro nkwụkwọ a, ‘isite na’ na-egosipụta isi mmalite ma ọ bụ ebe mmadụ si nweta njirimara ya; ọ na-edobekwa echiche nke ἐκ n’Igbo doro anya.
- source_word: κόσμου
  choice: ụwa
  rationale: ‘Ụwa’ bụ okwu Igbo nkịtị kwekọrọ na κόσμος. A hapụrụ ya n’enweghị mgbasawanye dịka ‘usoro ụwa’ ka e wee chekwaa omimi na esemokwu echiche dị n’iji okwu a eme ihe n’Oziọma Jọn.
- source_word: οὐκ εἰσὶν
  choice: Ha esiteghị
  rationale: N’agbanyeghị na ọdịdị okwu Grik bụ ‘ha abụghị,’ njikọ ya na ἐκ τοῦ κόσμου na-adịkarị mma ma doo anya n’Igbo dịka ‘ha esiteghị n’ụwa,’ nke na-echekwa echiche isi mmalite.
- source_word: καθὼς
  choice: dị nnọọ ka
  rationale: Nke a na-egosi ntụnyere siri ike ma doo anya n’etiti ndị na-eso ụzọ na Jizọs.
- source_word: ἐγὼ
  choice: mụ onwe m
  rationale: ‘Mụ onwe m’ na-echekwa nkwusi ike nke nnọchiaha Grik a kpọpụtara ìhè.
- source_word: οὐκ εἰμὶ ἐκ τοῦ κόσμου
  choice: na-esiteghị n’ụwa
  rationale: E ji otu ntụgharị ahụ mee ihe n’ahịrịokwu abụọ ahụ iji chekwaa nkwughachi nke Grik na ntụnyere dị n’etiti ha.
theological_decisions:
- issue: Ihe ‘ụwa’ pụtara n’echiche okpukpe nke Jọn
  choice: Idobe naanị ‘ụwa’ n’ahịrịokwu bụ isi
  alternative: ‘usoro ụwa’ ma ọ bụ ‘usoro ụwa nke kewapụrụ onwe ya n’ebe Chineke nọ’
  rationale: κόσμος nwere ọtụtụ omimi n’Oziọma Jọn. Ịghara ịgbasa ya n’ahịrịokwu bụ isi na-echekwa mgbagwoju na esemokwu echiche nke ederede ahụ, ma na-ezere itinye nkọwa ozizi nke dị warara karịa ihe amaokwu ahụ kwuru.
- issue: Ma ἐκ ọ na-egosi isi mmalite ka ọ bụ ịbụ nke otu akụkụ
  choice: Isi ederede jiri ‘isite na,’ ma nkọwa ala peeji kwupụta echiche ọzọ nke ịbụ nke ụwa
  alternative: ‘Ha abụghị nke ụwa’
  rationale: ‘Isite na’ na-anọkwu nso na ἐκ, ebe ‘ịbụ nke’ na-egosipụta echiche nke njikọ ma ọ bụ ịbụ onye so n’ụwa. Ebe okwu Grik nwere ike ibu echiche abụọ ahụ, a naghị ekpebi otu naanị ya n’enweghị nkọwa.
translation_notes:
  register: Asụsụ Igbo Izugbe dị ugbu a, dị ugwu ma dị mfe nghọta. E jiri ‘esiteghị n’ụwa’ mee ihe maka ịdị mma n’Igbo na ikwesị ntụkwasị obi nye ἐκ; e debere nhọrọ ‘abụghị nke ụwa’ na nkọwa ala peeji. Akara nkọwa [a] dị n’ederede bụ isi.
