review_pass:
  verdict: revise
  source_fidelity: The draft correctly retains the repeated κόσμοῦ as ụwa and the comparative force of καθώς. However, esiteghị is a completed-event negative ('did not come from') and does not appropriately render the present existential assertion οὐκ εἰσίν / οὐκ εἰμί. A stative construction is needed.
  naturalness: Ha esiteghị n’ụwa is understandable, but it is less natural for the intended continuing identity/belonging claim. Abụghị ndị nke ụwa is idiomatic Standard Igbo in this context and preserves the Johannine sense without overexplaining it.
  terminology: Ụwa is the appropriate equivalent for κόσμος. Ndị nke ụwa / onye nke ụwa conveys belonging or identification; the footnote preserves the source/origin nuance of ἐκ and its possible more literal rendering. Mụ onwe m appropriately represents the emphatic explicit ἐγώ.
  issues:
  - severity: medium
    issue: The main verb esiteghị is perfective rather than present-stative.
    rationale: Greek οὐκ εἰσίν and οὐκ εἰμί state a current condition. In Igbo, esiteghị ordinarily says that someone did not come from somewhere, whereas the verse asserts that they are not identified with or derived from the world.
  - severity: low
    issue: The footnote’s alternative repeats the same aspectual problem.
    rationale: “Ha esiteghị n’ụwa” likewise can be read as a completed past event. A relative construction such as “Ha abụghị ndị sitere n’ụwa” better expresses the source/origin alternative without altering verbal aspect.
  revised_text: Ha abụghị ndị nke ụwa[a], dị nnọọ ka mụ onwe m na-abụghị onye nke ụwa.
