- from: Ha esiteghị n’ụwa[a], dị nnọọ ka mụ onwe m na-esiteghị n’ụwa.
  to: Ha abụghị ndị nke ụwa[a], dị nnọọ ka mụ onwe m na-abụghị onye nke ụwa.
  rationale: The revision replaces the completed-event wording with an idiomatic stative expression that corresponds to the Greek present assertion and its context of belonging or identity. It keeps the repeated expression in both clauses, retains the emphatic “mụ onwe m,” and leaves the source/origin sense of ἐκ available in the footnote without imposing a narrower interpretation of κόσμος.
