id: JHN.17.12
reference: John 17:12
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὅτε ἤμην μετ’ ⸀αὐτῶν ἐγὼ ἐτήρουν αὐτοὺς ἐν τῷ ὀνόματί σου ⸀ᾧ δέδωκάς μοι, ⸀καὶ ἐφύλαξα, καὶ οὐδεὶς ἐξ αὐτῶν ἀπώλετο εἰ μὴ ὁ υἱὸς τῆς ἀπωλείας, ἵνα ἡ γραφὴ πληρωθῇ.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/012.yaml
  text: While I was with them[a], I kept them in your name, which you have given me, and I guarded them, and not one of them perished except the son of destruction[b], so that the Scripture might be fulfilled.
translation:
  language: ig
  text: Mgbe mụ na ha nọ, anọ m na-echekwa ha n’aha gị, bụ́ aha ahụ i nyere m, ma chebekwara m ha. Ọ dịghị onye n’ime ha lara n’iyi[a], ma e wezụga nwa nke mbibi[b], ka e wee mezuo ihe e dere n’Akwụkwọ Nsọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ịsụgharị ya: “Ọ dịghị onye n’ime ha furu efu.”'
    reason: lexical_alternative
  - marker: b
    text: “Nwa nke mbibi” bụ akpaalaokwu yiri nke Hibru; a pụkwara ịsụgharị ya “onye a kara aka maka mbibi,” ma ọ bụ, n’ụzọ ọdịnala, “nwa nke ịla n’iyi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε ἤμην μετ’ αὐτῶν
  choice: Mgbe mụ na ha nọ
  rationale: Ọ na-egosi oge Jizọs nọnyere ndị na-eso ụzọ ya; nhazi a bụ Igbo nkịtị ma na-eburu echiche nke ọnọdụ gara n’ihu.
- source_word: ἐγὼ ἐτήρουν αὐτοὺς
  choice: anọgidere m na-echekwa ha
  rationale: “Anọgidere m na-” na-egosipụta omume na-aga n’ihu nke imperfect ἐτήρουν, ebe “ichekwa” na-egosi ilekọta ma debe ha.
- source_word: ἐν τῷ ὀνόματί σου
  choice: n’aha gị
  rationale: Nsụgharị a dị nso n’ụdị Grik ma na-ahapụ obosara echiche nke aha dịka njirimara na ikike Chineke n’enweghị ịkọwa ya karịa ihe e kwuru.
- source_word: ᾧ δέδωκάς μοι
  choice: bụ́ aha ahụ i nyere m
  rationale: Nnọchiaha Grik bụ neuter singular, ya mere ọ na-ezo aka n’“aha,” ọ bụghị n’“ha.” Ikwughachi “aha ahụ” na-eme ka njikọ a doo anya n’Igbo.
- source_word: καὶ ἐφύλαξα
  choice: echekwakwara m ha nke ọma
  rationale: A na-eji “nke ọma” mee ka ọrụ nche siri ike nke φυλάσσω pụta ìhè, ma kewapụ ya ntakịrị na τηρέω n’agbanyeghị na Igbo na-ejikarị otu mgbọrọgwụ ekpuchi ha abụọ.
- source_word: οὐδεὶς ἐξ αὐτῶν ἀπώλετο
  choice: Ọ dịghịkwa onye ọ bụla n’ime ha lara n’iyi
  rationale: “Lara n’iyi” na-egosi ịla n’iyi ma ọ bụ mbibi, ma na-echekwa ịdị omimi nke ἀπώλετο karịa echiche nke nanị ihe furu efu.
- source_word: ὁ υἱὸς τῆς ἀπωλείας
  choice: nwa nke mbibi
  rationale: Ọ na-echekwa okwu yiri nke Hibru n’ụdị ya, n’ebughị n’ime isiokwu ahụ nkọwa ozizi zuru ezu banyere akara aka ya.
- source_word: ἵνα ἡ γραφὴ πληρωθῇ
  choice: ka ihe e dere n’Akwụkwọ Nsọ wee mezuo
  rationale: Ọ bụ Igbo doro anya nke na-echekwa echiche ebumnuche ma ọ bụ ihe si na ya pụta dị na ἵνα, yana passive “mezuo.”
theological_decisions:
- issue: Ihe ᾧ δέδωκάς μοι na-ezo aka na ya
  choice: 'Ọ na-akọwa “aha gị”: “bụ́ aha ahụ i nyere m.”'
  alternative: 'Ịghọta ya dịka ndị na-eso ụzọ ahụ: “ndị i nyere m.”'
  rationale: N’ihe odide SBLGNT a, nnọchiaha ahụ bụ neuter singular, nke kwekọrọ n’ụzọ kacha mma na ὀνόματι (“aha”), ọ bụghị αὐτούς (“ha”), nke bụ masculine plural.
- issue: Ihe ὁ υἱὸς τῆς ἀπωλείας pụtara
  choice: “nwa nke mbibi”
  alternative: “onye a kara aka maka mbibi” ma ọ bụ okwu ọdịnala kwekọrọ na “nwa nke ịla n’iyi”
  rationale: Nsụgharị nkịtị a na-echekwa akpaalaokwu Semitic na esemokwu nkà mmụta okpukpe dị na ya, n’emeghị ka ọ bụrụ nkwupụta sara mbara banyere akara aka e kpebiri tupu oge eruo.
- issue: Nuance nke ἵνα
  choice: “ka ... wee mezuo”
  alternative: 'Ịsụgharị ya nanị dịka nsonaazụ: “ya mere ... mezuru”'
  rationale: Ụdị a na-ahapụ ma echiche ebumnuche ma nke nsonaazụ ka ha dị, n’edoziwaghị esemokwu ahụ n’otu akụkụ.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị nsọ ma dị mfe nghọta. “Anọgidere m na-echekwa” na-eburu omume na-aga n’ihu; “echekwakwara m ha nke ọma” na-achọ igosi mgbanwe ngwaa Grik. E tinyere akara ndetu [a] na [b] kpọmkwem n’isiokwu.
