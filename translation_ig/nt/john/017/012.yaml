revisions:
- from: Mgbe mụ na ha nọ, anọgidere m na-echekwa ha n’aha gị, bụ́ aha ahụ i nyere m; echekwakwara m ha nke ọma. Ọ dịghịkwa onye ọ bụla n’ime ha lara n’iyi[a], ma e wezụga nwa nke mbibi[b], ka ihe e dere n’Akwụkwọ Nsọ wee mezuo.
  to: Mgbe mụ na ha nọ, anọ m na-echekwa ha n’aha gị, bụ́ aha ahụ i nyere m, ma chebekwara m ha. Ọ dịghị onye n’ime ha lara n’iyi[a], ma e wezụga nwa nke mbibi[b], ka e wee mezuo ihe e dere n’Akwụkwọ Nsọ.
  rationale: The revision removes the unsupported intensifier, uses a clearer imperfect-progressive construction, and distinguishes the two Greek verbs without altering the verse’s meaning. It retains the name referent, the formal Hebraic expression, and the purpose/result ambiguity of ἵνα.
