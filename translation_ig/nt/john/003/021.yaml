id: JHN.3.21
reference: John 3:21
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ δὲ ποιῶν τὴν ἀλήθειαν ἔρχεται πρὸς τὸ φῶς, ἵνα φανερωθῇ αὐτοῦ τὰ ἔργα ὅτι ἐν θεῷ ἐστιν εἰργασμένα.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/021.yaml
  text: But the one who does the truth comes to the light[a], so that his works may be revealed[d][c][b], because they have been done in God.
translation:
  language: ig
  text: Ma onye na-eme eziokwu[a] na-abịakwute ìhè, ka ọrụ ya wee pụta ìhè[b][d], n’ihi na e mewo ha n’ime Chineke.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “onye na-eme ihe bụ eziokwu” ma ọ bụ “onye na-ebi ndụ kwekọrọ n’eziokwu.” Okwu Grik ahụ, ma a sụgharịa ya otu okwu n’otu okwu, bụ “onye na-eme eziokwu.”
    reason: lexical_alternative
  - marker: b
    text: 'A pụkwara ịghọta njikọ okwu a dị ka nke na-ewebata ihe a na-ekpughe: “ka e wee kpughee na e mewo ọrụ ya n’ime Chineke.”'
    reason: alternative_reading
  - marker: c
    text: “N’ime Chineke” nwekwara ike ịpụta “site n’aka Chineke” ma ọ bụ “site na Chineke”; okwu Grik ahụ hapụrụ kpọmkwem mmekọrịta a oghe.
    reason: lexical_alternative
  - marker: d
    text: 'Nsụgharị ọzọ bụ: “ka e wee gosi na e mewo ha n’ime Chineke.”'
    reason: previous_rendering
lexical_decisions:
- source_word: ὁ δὲ ποιῶν τὴν ἀλήθειαν
  choice: Ma onye na-eme eziokwu
  rationale: “Ma” na-egosi obere ntụnyere dị n’etiti amaokwu a na nke bu ya ụzọ. “Onye na-eme eziokwu” na-edobe ihe atụ Grik nke na-ekwu banyere onye eziokwu bụ omume ya mgbe niile, ọ bụghị naanị ihe ọ maara ma ọ bụ kweta.
- source_word: ἔρχεται πρὸς τὸ φῶς
  choice: na-abịakwute ìhè
  rationale: “Na-abịakwute” na-egosi ngagharị n’ebe ìhè nọ, dịka πρὸς si kwuo, ma na-edobekwa ìhè dịka ihe atụ nke mkpughe Chineke.
- source_word: ἵνα φανερωθῇ αὐτοῦ τὰ ἔργα
  choice: ka ọrụ ya wee pụta ìhè
  rationale: Nkebiokwu a na-egosi nzube site na “ka ... wee”; “pụta ìhè” bụ ụzọ Igbo dị mma isi gosi na a na-eme ka ọrụ ahụ bụrụ ihe a hụrụ ma mara.
- source_word: ὅτι
  choice: n’ihi na
  rationale: A họọrọ nghọta nke njikọ a dịka ihe kpatara ọrụ ahụ ji pụta ìhè. E debere nghọta ọzọ—na ọ na-ewebata ihe a na-ekpughe—n’ihe odide ala peeji.
- source_word: ἐν θεῷ
  choice: n’ime Chineke
  rationale: Nsụgharị a na-edobe okwu Grik oghe, n’ebughị ụzọ kpebie ma ọ pụtara site n’aka Chineke, site na Chineke, ma ọ bụ n’ịdị n’otu na Chineke.
- source_word: ἐστιν εἰργασμένα
  choice: e mewo ha
  rationale: Ụdị a na-egosi na arụchaala ọrụ ndị ahụ, ma ihe si na ha pụta ka dịkwa; ọ na-edobekwa echiche nke passive dị na Grik n’ụzọ Igbo ga-aghọta.
theological_decisions:
- issue: Ihe ποιῶν τὴν ἀλήθειαν pụtara
  choice: onye na-eme eziokwu
  alternative: onye na-eme ihe bụ eziokwu; onye na-ebi ndụ kwekọrọ n’eziokwu
  rationale: A hapụrụ okwu ahụ n’ụdị ya sara mbara ka “eziokwu” ghara ịbụ naanị ezi omume ma ọ bụ naanị nkwenkwe; n’Oziọma Jọn, eziokwu bụkwa ihe mmadụ na-eme.
- issue: Mmekọrịta ὅτι na nkebiokwu bu ya ụzọ
  choice: n’ihi na e mewo ha n’ime Chineke
  alternative: ka e wee kpughee na e mewo ha n’ime Chineke
  rationale: ὅτι nwere ike igosi ihe kpatara mkpughe ahụ ma ọ bụ ihe mkpughe ahụ na-ekwu. Isi ederede họọrọ nghọta nke ihe kpatara ya, ebe ihe odide ala peeji na-echekwa nghọta nke ọzọ.
- issue: Nkọwa ἐν θεῷ
  choice: n’ime Chineke
  alternative: site n’aka Chineke; site na Chineke; n’ịdị n’otu na Chineke
  rationale: Okwu Grik ahụ anaghị amanye naanị otu n’ime nkọwa ndị a. “N’ime Chineke” na-echekwa ịdị oghe nke okwu ahụ ma zere itinye nkọwa otu òtù okpukpe.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. A hapụrụ “na-eme eziokwu” n’ụdị pụrụ iche ya iji chekwaa omimi okwu Jọn, ma kọwaa ya n’ihe odide ala peeji. “Na-abịakwute ìhè” na “ọrụ ya wee pụta ìhè” bụ okwu Igbo sitere n’okike ma na-edobe ihe atụ nke ìhè na mkpughe.
