  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ὁ ἄνωθεν ἐρχόμενος ἐπάνω πάντων ἐστίν. ὁ ὢν ἐκ τῆς γῆς ἐκ τῆς γῆς ἐστιν καὶ ἐκ τῆς γῆς λαλεῖ· ὁ ἐκ τοῦ οὐρανοῦ ἐρχόμενος ἐπάνω πάντων ἐστίν·
base_translation:
  language: en
  yaml_path: translation/nt/john/003/031.yaml
  text: The one who comes from above is above all[a]. The one who is from the earth is from the earth and speaks from the earth[b]. The one who comes from heaven is above all.
translation:
  language: ig
  text: Onye ahụ si n’elu na-abịa dị elu karịa ihe niile[a]. Onye si n’ụwa bụ onye si n’ụwa, ọ na-esikwa n’ụwa ekwu okwu[b]. Onye ahụ si n’eluigwe na-abịa dị elu karịa ihe niile.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “dị elu karịa niile.” Grik enweghị aha e kwuru nke ga-amachi “niile” n’ebe mmadụ nọ. A pụkwara ịsụgharị “si n’elu” dịka “si n’eluigwe”; okwu ikpeazụ n’amaokwu a na-eme ka echiche ahụ doo anya.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “na-ekwu okwu banyere ụwa.” Grik kwughachiri “si n’ụwa”; nke a nwere ike igosi ebe okwu ya si, ọnọdụ ọ nọ na ya, ma ọ bụ ihe ọ na-ekwu banyere ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄνωθεν
  choice: si n’elu
  rationale: Ọ na-egosi ebe onye ahụ si bịa, ọ bụghị na ọ na-abịa ọzọ. Nhọrọ a na-echekwa ọdịiche dị n’etiti elu na ụwa, ebe okwu ‘si n’eluigwe’ nke na-esote na-eme ka ihe ọ pụtara doo anya.
- source_word: ἐρχόμενος
  choice: nke ... na-abịa
  rationale: Nke a na-asụgharị participle ahụ dịka nkọwa onye ahụ n’Igbo dị mfe ma na-echekwa ọdịdị omume na-aga n’ihu.
- source_word: ἐπάνω πάντων
  choice: dị elu karịa mmadụ niile
  rationale: N’ebe a πάντων nwere ike izo aka n’ụmụ mmadụ n’usoro ntụnyere dị n’amaokwu ahụ. Okwu a na-egosi ịdị ukwuu na ọchịchị onye ahụ, ma ka na-edebe ihe oyiyi nke ịdị elu.
- source_word: ὁ ὢν ἐκ τῆς γῆς
  choice: onye si n’ụwa
  rationale: Nke a na-edebe isi echiche nke ebe o si malite ma kwekọọ na ugboro ugboro nke ἐκ τῆς γῆς.
- source_word: γῆ
  choice: ụwa
  rationale: γῆ na-emegide eluigwe n’amaokwu a, ya mere ‘ụwa’ dabara karịa ‘ala’.
- source_word: ἐκ τῆς γῆς ἐστιν
  choice: bụ onye ụwa
  rationale: Usoro a bụ Igbo e ji okwu nsọpụrụ dee ma na-echekwa nkwughachi nke njirimara ụwa, n’agbanyeghị na ọ naghị emegharị ‘si n’ụwa’ n’ụzọ nkịtị.
- source_word: ἐκ τῆς γῆς λαλεῖ
  choice: na-esikwa n’ụwa ekwu okwu
  rationale: Nke a na-echekwa ἐκ, na-ahapụkwa ya ka ọ nwee ike ịpụta isi mmalite, ọnọdụ, ma ọ bụ isiokwu okwu ahụ.
- source_word: οὐρανός
  choice: eluigwe
  rationale: N’ọnọdụ a ọ na-ezo aka n’ebe Chineke nọ, ọ bụghị naanị mbara igwe a na-ahụ anya.
theological_decisions:
- issue: Mmekọrịta dị n’etiti ‘si n’elu’ na ‘si n’eluigwe’
  choice: A sụgharịrị ἄνωθεν dịka ‘si n’elu,’ ma sụgharịa ἐκ τοῦ οὐρανοῦ dịka ‘si n’eluigwe.’
  alternative: Ịsụgharị ha abụọ dịka ‘si n’eluigwe.’
  rationale: Asụsụ Grik jiri okwu abụọ yiri onwe ha ma dị iche. Idebe ọdịiche ahụ na-eme ka okwu nke abụọ kọwaa nke mbụ, na-enweghị ihichapụ usoro okwu Jọn.
- issue: Ike nkwughachi okwu banyere ụwa
  choice: E debere ‘si n’ụwa ... onye ụwa ... si n’ụwa’ ka nkwughachi ahụ wee pụta ìhè.
  alternative: Ịchịkọta ya dịka ‘onye ụwa na-ekwu okwu dịka onye ụwa.’
  rationale: Nkwughachi ahụ na-eme ka ọdịiche dị n’etiti ebe ụwa na ebe eluigwe sie ike, ma na-ahapụ nghọta nke ‘si n’ụwa ekwu okwu’ ka ọ ghara ịbụ nke a kpebiri n’ụzọ otu.
- issue: Ihe πάντων na-ezo aka na ya
  choice: A sụgharịrị ya ‘mmadụ niile.’
  alternative: ‘Ihe niile’ ma ọ bụ ‘niile.’
  rationale: Ndị a na-atụnyere n’amaokwu ahụ bụ ndị na-abịa ma na-ekwu okwu, ya mere ndị mmadụ bụ nghọta ebumpụta ụwa. Ma Grik n’onwe ya nwere ike ịgụnye echiche sara mbara karị; e gosipụtara nke a n’okpuru ala.
translation_notes:
  register: Standard Igbo; asụsụ dị ugbu a, dị nsọpụrụ, ma dị mfe nghọta. E ji ‘onye ahụ nke’ n’ahịrịokwu nke eluigwe mee ka ndị na-emegiderịta onwe ha pụta ìhè, ebe e debere nkwughachi nke ụwa ka ike okwu Grik ghara ịla n’iyi.
