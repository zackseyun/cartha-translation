revisions:
- from: Onye ahụ nke si n’elu na-abịa dị elu karịa mmadụ niile[a]. Onye si n’ụwa bụ onye ụwa, ọ na-esikwa n’ụwa ekwu okwu[b]. Onye ahụ nke si n’eluigwe na-abịa dị elu karịa mmadụ niile.
  to: Onye ahụ si n’elu na-abịa dị elu karịa ihe niile[a]. Onye si n’ụwa bụ onye si n’ụwa, ọ na-esikwa n’ụwa ekwu okwu[b]. Onye ahụ si n’eluigwe na-abịa dị elu karịa ihe niile.
  rationale: 'E degharịrị ntụgharị ahụ naanị n’ebe achọrọ iji debe nkọwa na nkwughachi nke Grik: ἐπάνω πάντων aghọwo “dị elu karịa ihe niile,” a weghachikwara “si n’ụwa” n’ahịrịokwu etiti. E debere ọdịiche dị n’etiti “si n’elu” (ἄνωθεν) na “si n’eluigwe” (ἐκ τοῦ οὐρανοῦ), nakwa ambiguity nke “si n’ụwa ekwu okwu.”'
