id: JHN.3.14
reference: John 3:14
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ καθὼς Μωϋσῆς ὕψωσεν τὸν ὄφιν ἐν τῇ ἐρήμῳ, οὕτως ὑψωθῆναι δεῖ τὸν υἱὸν τοῦ ἀνθρώπου,
base_translation:
  language: en
  yaml_path: translation/nt/john/003/014.yaml
  text: And just as Moses lifted up the serpent in the wilderness[a], so the Son of Man must be lifted up[b],
translation:
  language: ig
  text: Dị nnọọ ka Mosis weliri agwọ elu n’ọzara[a], otu ahụ ka a ghaghị iweli Nwa nke Mmadụ elu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Lee Ọnụ Ọgụgụ 21:8–9 maka akụkọ banyere Mosis weliri agwọ ahụ elu n’ọzara.
    reason: cross_reference
  - marker: b
    text: A pụkwara ịghọta «iweli elu» dịka ibuli elu n’ebube. Okwu Grik ahụ pụrụ ịpụta ma iweli elu n’ụzọ anụ ahụ ma ibuli elu n’ebube; o yiri ka Jọn bu nghọta abụọ ahụ n’obi ebe a.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς
  choice: Dị nnọọ ka
  rationale: Na-egosi ntụnyere doro anya n’etiti ihe Mosis mere na ihe ga-eme Nwa nke Mmadụ.
- source_word: ὕψωσεν
  choice: weliri ... elu
  rationale: Na-egosi n’ụzọ nkịtị na Mosis buliri agwọ ahụ, ma na-edobekwa njikọ okwu ya na ὑψωθῆναι.
- source_word: ὄφιν
  choice: agwọ
  rationale: Ọ bụ okwu Igbo nkịtị ma doo anya maka anụmanụ ahụ e kwuru banyere ya n’Ọnụ Ọgụgụ 21.
- source_word: ἐν τῇ ἐρήμῳ
  choice: n’ọzara
  rationale: Na-akọwa ebe ndị Izrel nọ n’akụkọ a kpọrọ aha.
- source_word: οὕτως
  choice: otu ahụkwa
  rationale: Na-eme ka akụkụ nke abụọ nke ntụnyere ‘dị nnọọ ka ... otu ahụkwa’ pụta ìhè n’Igbo eke.
- source_word: ὑψωθῆναι
  choice: ka a ga-eweli ... elu
  rationale: Na-egosipụta olu nnara na mkpa nke ihe ahụ ime, ma na-echekwa nghọta abụọ nke ibuli n’elu n’ụzọ anụ ahụ na ibuli elu n’ọkwa.
- source_word: δεῖ
  choice: ga-
  rationale: N’usoro ‘ka a ga-eweli,’ ọ na-egosi na ihe a aghaghị ime, ọ bụghị naanị ihe nwere ike ime.
- source_word: υἱὸν τοῦ ἀνθρώπου
  choice: Nwa nke Mmadụ
  rationale: Na-echekwa aha pụrụ iche Jizọs ji akpọ onwe ya na njikọ ya na asụsụ Akwụkwọ Nsọ.
theological_decisions:
- issue: Nghọta abụọ nke ὑψόω n’Oziọma Jọn
  choice: Jiri ‘weliri/eweli ... elu’ n’ebe abụọ ahụ n’amaokwu bụ isi.
  alternative: ‘buliri/buli ... elu’ ma ọ bụ ‘mee ka e bulie ya n’ọkwa’
  rationale: Nhọrọ a na-echekwa ma ibuli agwọ ahụ n’elu n’ụzọ anụ ahụ ma ihe Jọn nwere ike ịpụta banyere ọnwụ Jizọs n’obe na ibuli ya elu n’ebube, n’ebughị ụzọ kpebie naanị otu nghọta.
translation_notes:
  register: Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ usoro ‘Dị nnọọ ka ... otu ahụkwa’ iji mee ka ntụnyere ahụ doo anya. E debere ‘Nwa nke Mmadụ’ dị ka aha Akwụkwọ Nsọ. E tinyere akara ukwu ala [a] na [b] n’ederede bụ isi; a haziri ọdịnaya ha ka [a] soro ‘ọzara’ dịka ntụaka obe, [b] soro iweli Nwa nke Mmadụ elu dịka nkọwa nghọta abụọ.
