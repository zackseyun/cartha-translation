  verdict: revise
  source_fidelity: The comparison, Moses/serpent allusion, title «Nwa nke Mmadụ», and the matching renderings of ὑψόω are well represented. However, «a ga-eweli» ordinarily marks futurity ('will be lifted up') and does not adequately convey δεῖ, the necessity expressed by 'must.'
  naturalness: The draft is generally clear Standard Igbo. Replacing the future auxiliary with «a ghaghị iweli» gives a natural impersonal construction that explicitly expresses necessity.
  terminology: «Mosis», «agwọ», «ọzara», and «Nwa nke Mmadụ» are suitable biblical-register terms. Keeping «weliri/iweli ... elu» in both clauses retains the lexical connection and leaves room for the Johannine physical/exaltation resonance.
  issues:
  - severity: medium
    issue: The rendering of δεῖ as «ga-» is insufficient.
    rationale: δεῖ conveys necessity, not simply a future event. «A ghaghị iweli» renders the required force while retaining the Greek passive sense through an impersonal construction.
  revised_text: Dị nnọọ ka Mosis weliri agwọ elu n’ọzara[a], otu ahụ ka a ghaghị iweli Nwa nke Mmadụ elu[b].
