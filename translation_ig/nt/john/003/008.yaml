id: JHN.3.8
reference: John 3:8
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τὸ πνεῦμα ὅπου θέλει πνεῖ, καὶ τὴν φωνὴν αὐτοῦ ἀκούεις, ἀλλ’ οὐκ οἶδας πόθεν ἔρχεται καὶ ποῦ ὑπάγει· οὕτως ἐστὶν πᾶς ὁ γεγεννημένος ἐκ τοῦ πνεύματος.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/008.yaml
  text: The wind blows where it wishes[a], and you hear its sound, but you do not know where it comes from and where it goes[b]. So it is with everyone who has been born of the Spirit.
translation:
  language: ig
  text: Ifufe na-efe ebe ọ chọrọ[a]. Ị na-anụ ụda ya, ma ị maghị ebe o si abịa na ebe ọ na-aga[b]. Otú ahụ ka ọ dị onye ọ bụla a mụrụ site na Mmụọ Nsọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Okwu Grik pneuma nwere ike ịpụta “ifufe” ma ọ bụ “mmụọ.” Jizọs ji otu okwu ahụ mee ihe n'akụkụ abụọ nke amaokwu a, ma Igbo enweghị ike igosipụta egwuregwu okwu ahụ n'ụzọ zuru ezu.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya dịka “olu”; okwu Grik ahụ nwere ike ịpụta nke ọ bụla, ma n'ebe a ọ na-ezo aka n'ihe mmadụ na-anụ mgbe ifufe na-efe.
    reason: lexical_alternative
lexical_decisions:
- source_word: πνεῦμα (v. 8a)
  choice: ifufe
  rationale: N'ahịrịokwu mbụ, ngwaa πνεῖ (‘na-efe’) na ịnụ φωνή ya na-egosi na ihe a na-ekwu bụ ifufe. Nke a na-eme ka ihe atụ ahụ doo anya n'Igbo, ebe e ji ‘Mmụọ’ sụgharịa πνεῦμα nke ikpeazụ.
- source_word: ὅπου θέλει
  choice: ebe ọ chọrọ
  rationale: Nke a na-echekwa echiche nke ọchịchọ ma na-ada ka Igbo nkịtị, na-enyekwa ifufe ọdịdị onye e ji mee ihe atụ dị na Grik.
- source_word: πνεῖ
  choice: na-efe
  rationale: ‘Na-efe’ bụ ngwaa Igbo kwesịrị ekwesị maka ifufe, ya na πνεῦμα n'echiche nke ifufe.
- source_word: φωνήν
  choice: ụda
  rationale: φωνή nwere ike ịbụ ‘ụda’ ma ọ bụ ‘olu’; ebe ihe a na-ekwu bụ ifufe, ‘ụda’ bụ okwu Igbo kacha doo anya ma dịkwa mma.
- source_word: οὐκ οἶδας πόθεν ἔρχεται καὶ ποῦ ὑπάγει
  choice: ị maghị ebe o si abịa na ebe ọ na-aga
  rationale: Nke a na-asụgharị njikọ πόθεν/ποῦ n'ụzọ doro anya ma dị ndụ n'Igbo.
- source_word: οὕτως ἐστίν
  choice: otú ahụ ka ọ dịkwa
  rationale: Nkebiokwu a na-egosipụta ntụnyere nke Grik n'Igbo nkịtị.
- source_word: πᾶς ὁ γεγεννημένος
  choice: onye ọ bụla a mụrụ
  rationale: Nke a na-egosipụta mmadụ niile nke okwu ahụ metụtara ma na-ezere ịgbakwụnye okike nwoke na-adịghị mkpa.
- source_word: ἐκ τοῦ πνεύματος (v. 8b)
  choice: site na Mmụọ Nsọ
  rationale: ἐκ na-egosi isi mmalite; ‘site na’ na-echekwa echiche ahụ. N'ọnọdụ ọmụmụ ọhụrụ nke Jọn 3, πνεῦμα na-ezo aka na Mmụọ Nsọ.
theological_decisions:
- issue: Okwu abụọ dị na πνεῦμα nke e ji mee egwuregwu okwu
  choice: Sụgharịa nke mbụ dịka ‘ifufe,’ nke ikpeazụ dịka ‘Mmụọ Nsọ.’
  alternative: Ịsụgharị ha abụọ dịka ‘Mmụọ’ ma ọ bụ ha abụọ dịka ‘ifufe.’
  rationale: Grik ji otu okwu πνεῦμα mee ihe n'echiche abụọ. Na mbido, ihe ndị gbara ya gburugburu—ịfụ na ịnụ ụda—na-akwado ‘ifufe’; na ngwụcha, ọnọdụ ọmụmụ ọhụrụ na-akwado ‘Mmụọ Nsọ.’ Ebe Igbo enweghị otu okwu nkịtị ga-echekwa nghọta abụọ ahụ nke ọma, ihe odide bụ isi kewara ha, ebe nkọwa ala peeji na-echekwa egwuregwu okwu ahụ.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke dị ugbu a ma dị ùgwù. A họọrọ ahịrịokwu dị mfe nghọta nye ndị nkịtị, ma e chekwara ntụnyere ifufe na ọrụ Mmụọ, tinyere mgbagwoju anya okwu Grik site na nkọwa ala peeji.
