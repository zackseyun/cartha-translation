- from: Ya ejula gị anya na m gwara gị, “A ghaghị ịmụ unu site n’elu[a].”
  to: Ejula gị anya na m gwara gị, “A ghaghị ịmụ unu site n’elu[a].”
  rationale: The revision removes an untranslated-added opening element and narrows the footnote to the two relevant senses of ἄνωθεν. It preserves the Greek contrast between singular σοι (“gị”) and plural ὑμᾶς (“unu”) in the main text, so no additional number footnote is required.
  reviewer_model: gpt-5.6-terra
