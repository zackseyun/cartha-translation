    text: Ma ọ bụ, “A ghaghị ịmụ unu ọzọ.” Okwu Grik ἄνωθεν nwere ike ịpụta “site n’elu” ma ọ bụ “ọzọ.”
    reason: alternative_reading
  revision_rationale: The revision removes an untranslated-added opening element and narrows the footnote to the two relevant senses of ἄνωθεν. It preserves the Greek contrast between singular σοι (“gị”) and plural ὑμᾶς (“unu”) in the main text, so no additional number footnote is required.
