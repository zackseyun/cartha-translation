  text: μὴ θαυμάσῃς ὅτι εἶπόν σοι Δεῖ ὑμᾶς γεννηθῆναι ἄνωθεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/007.yaml
  text: Do not be amazed that I told you[b][a], ‘You must be born from above.’
translation:
  language: ig
  text: Ejula gị anya na m gwara gị, “A ghaghị ịmụ unu site n’elu[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “A ghaghị ịmụ unu ọzọ.” Okwu Grik ἄνωθεν nwere ike ịpụta “site n’elu” ma ọ bụ “ọzọ.”
    reason: alternative_reading
lexical_decisions:
- source_word: μὴ θαυμάσῃς
  choice: Ya ejula gị anya
  rationale: Μή na aorist subjunctive bụ mmachibido iwu; okwu Igbo a bụ nke e ji ekwu okwu n’ụzọ ebumpụta ụwa ma na-egosikwa ‘atụla n’anya’ nke ọma.
- source_word: ὅτι
  choice: na
  rationale: N’ebe a, ὅτι na-ewebata ihe Jizọs kwuru, ọ bụghị ihe kpatara iju anya.
- source_word: εἶπόν σοι
  choice: m gwara gị
  rationale: Nke a na-egosipụta okwu a gwara Nikọdimọs kpọmkwem; ‘gị’ dokwara anya na ọ bụ otu onye ka a na-agwa.
- source_word: Δεῖ
  choice: A ghaghị
  rationale: Okwu a na-egosipụta mkpa siri ike ma ọ bụ ihe a na-apụghị izere ezere, dịka Δεῖ si eme.
- source_word: ὑμᾶς
  choice: unu
  rationale: Ὑμᾶς bụ ọtụtụ mmadụ. Igbo nwere ike igosipụta nke a kpọmkwem site n’iji ‘unu,’ n’ụzọ na-echekwa ọdịiche dị n’etiti σοι (‘gị’) na ὑμᾶς (‘unu’).
- source_word: γεννηθῆναι
  choice: ịmụ unu
  rationale: Ụdị a na-echekwa olu nnara nke okwu Grik ahụ ma na-enye echiche nke ịbụ ndị a mụrụ, ọ bụghị nanị ịgbanwe omume.
- source_word: ἄνωθεν
  choice: site n’elu
  rationale: Ἄνωθεν nwere ike ịpụta ‘site n’elu’ ma ọ bụ ‘ọzọ/site ná mmalite ọhụrụ.’ ‘Site n’elu’ na-echekwa echiche Jọn banyere mmalite nke sitere n’ebe Chineke nọ, ebe e debere echiche ọzọ n’okpuru amaokwu.
theological_decisions:
- issue: Ihe ἄνωθεν pụtara n’okwu banyere ọmụmụ ọhụrụ
  choice: site n’elu
  alternative: ọzọ; site ná mmalite ọhụrụ
  rationale: Okwu Grik ahụ nwere nghọta abụọ n’akụkọ Nikọdimọs. Ojiji ya n’Akwụkwọ Jọn na isiokwu nke ọmụmụ sitere n’ebe Chineke nọ kwadoro ‘site n’elu’ n’ahịrị bụ isi, ma ihe ọzọ ọ pụrụ ịpụta ka edebere n’okpuru amaokwu ka a ghara iwepụ mgbagwoju anya ahụ nke dị n’akwụkwọ mbụ.
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. ‘Gị’ na ‘unu’ na-egosipụta ọdịiche dị n’etiti onye otu na ọtụtụ mmadụ kpọmkwem, ya mere ọ dịghị mkpa itinye nkọwa ọzọ banyere nke ahụ n’okpuru amaokwu.
