  terminology: “Ìhè,” “ọchịchịrị,” “ụwa,” “ikpe,” and “ọrụ” preserve the established conceptual vocabulary without adding interpretation. The rendering does not convert “the light” into an explicit title or name, and “ụmụ mmadụ” avoids an unwarranted male-only reading.
