  source_fidelity: 'The rendering accurately represents the Greek sequence and sense: κρίσις as “ikpe,” the perfect ἐλήλυθεν as “abatala,” the Johannine metaphors “ìhè” and “ọchịchịrị,” the comparative preference expressed by μᾶλλον ... ἢ, and the causal statement that their works were evil. “Ụmụ mmadụ” correctly conveys the generic referent of οἱ ἄνθρωποι.'
