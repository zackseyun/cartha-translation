id: JHN.3.19
reference: John 3:19
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: αὕτη δέ ἐστιν ἡ κρίσις ὅτι τὸ φῶς ἐλήλυθεν εἰς τὸν κόσμον καὶ ἠγάπησαν οἱ ἄνθρωποι μᾶλλον τὸ σκότος ἢ τὸ φῶς, ἦν γὰρ ⸂αὐτῶν πονηρὰ⸃ τὰ ἔργα.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/019.yaml
  text: 'And this is the judgment: that the light has come into the world[a], and people loved the darkness rather than the light, because their works were evil.'
translation:
  language: ig
  text: 'Ma nke a bụ ikpe ahụ: ìhè abatala n’ụwa, ma ụmụ mmadụ hụrụ ọchịchịrị n’anya karịa ìhè, n’ihi na ọrụ ha bụ ihe ọjọọ.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κρίσις
  choice: ikpe
  rationale: “Ikpe” na-edobe echiche sara mbara nke nyocha na mkpebi ikpe, n’enweghị ime ka ọ bụrụ naanị ikpe ọmụma.
- source_word: τὸ φῶς
  choice: ìhè
  rationale: E debere ihe atụ Jọn ji mee ihe, n’akọwaghị ya ozugbo dị ka Jizọs.
- source_word: ἐλήλυθεν
  choice: abatala
  rationale: Ụdị a na-egosi na ìhè bịara, nakwa na nsonaazụ ọbịbịa ya ka dị ugbu a.
- source_word: κόσμον
  choice: ụwa
  rationale: “Ụwa” bụ okwu Igbo a na-ejikarị eme ihe, ma na-edobe obosara echiche okwu Grik ahụ.
- source_word: ἠγάπησαν
  choice: hụrụ ... n’anya
  rationale: Nke a na-edobe ike okwu ịhụ n’anya, kama ịsụgharị ya naanị dị ka ịhọrọ.
- source_word: οἱ ἄνθρωποι
  choice: ụmụ mmadụ
  rationale: Ọ pụtara mmadụ niile n’ozuzu, ọ bụghị naanị ndị nwoke; “ụmụ mmadụ” bụ okwu Igbo doro anya ma bụrụkwa nke ebumpụta ụwa.
- source_word: μᾶλλον ... ἢ
  choice: karịa
  rationale: “Karịa” na-egosi ntụnyere na mmasị ha nwere n’ọchịchịrị karịa ìhè.
- source_word: τὸ σκότος
  choice: ọchịchịrị
  rationale: E debere ihe atụ ahụ na ọdịiche ya na ìhè.
- source_word: πονηρὰ
  choice: ihe ọjọọ
  rationale: Nke a na-egosi àgwà omume ọjọọ nke ọrụ ndị ahụ n’Igbo a na-aghọta ngwa ngwa.
- source_word: τὰ ἔργα
  choice: ọrụ
  rationale: “Ọrụ” na-edobe njikọ okwu ahụ na ojiji Jọn ji ἔργα eme ihe, ma dịkwa nkenke.
theological_decisions:
- issue: Onye “ìhè” na-anọchi anya ya
  choice: E debere ihe atụ ahụ dịka “ìhè” n’ime amaokwu ahụ.
  alternative: Ịsụgharị ya dịka “Jizọs” ma ọ bụ “Ìhè” dịka aha pụrụ iche.
  rationale: Ihe gbara amaokwu ahụ gburugburu na-egosi Ọkpara, ma ihe odide Grik ji ihe atụ “ìhè”; idobe ya na-echekwa ụzọ Jọn si kwuo ya.
- issue: Ndị οἱ ἄνθρωποι na-ezo aka na ha
  choice: “ụmụ mmadụ,” nke gụnyere mmadụ niile n’ozuzu
  alternative: “ndị nwoke”
  rationale: N’ebe a, okwu Grik ahụ anaghị ekwu naanị banyere nwoke; ọ na-ezo aka n’ụmụ mmadụ n’ozuzu.
- issue: Ụdị κρίσις pụtara n’ebe a
  choice: “ikpe”
  alternative: “ikpe ọmụma” ma ọ bụ “mkpebi ikpe”
  rationale: “Ikpe” na-ahapụ obosara na esemokwu nke okwu ahụ—ma usoro ikpe ma nsonaazụ na-adịghị mma—n’enweghị imechi ihe ọ pụtara ngwa ngwa.
translation_notes:
  register: Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. E ji “ụmụ mmadụ” mee ka ihe οἱ ἄνθρωποι pụtara doo anya n’enweghị mkpa nkọwa ala peeji. E debere ihe atụ ndị bụ ìhè na ọchịchịrị.
