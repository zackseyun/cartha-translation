  text: ἀπεκρίθη Νικόδημος καὶ εἶπεν αὐτῷ· Πῶς δύναται ταῦτα γενέσθαι;
base_translation:
  language: en
  yaml_path: translation/nt/john/003/009.yaml
  text: Nicodemus answered and said to him[a], “How can these things happen?”
translation:
  language: ig
  text: Nikọdimọs zara ya sị, “Olee otú ihe ndị a pụrụ isi mee?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: zara
  rationale: Ngwaa a na-arụkarị ọrụ dị ka ‘zara’ n’akụkọ mkparịta ụka; ọ bụkwa okwu Igbo doro anya ma kwekọọ n’usoro a.
- source_word: Νικόδημος
  choice: Nikọdimọs
  rationale: A sụgharịghị aha onye ahụ; e dere ya n’ụdị mkpụrụokwu kwekọrọ n’ịkpọ ya n’Igbo.
- source_word: εἶπεν αὐτῷ
  choice: ya sị
  rationale: Nke a na-edobe nnọchiaha ‘ya’ dị n’asụsụ Grik, kama itinye aha Jizọs nke na-adịghị n’amaokwu a. Usoro ‘zara ya sị’ bụ Igbo eke n’akụkọ mkparịta ụka.
- source_word: Πῶς
  choice: Olee otú
  rationale: Nke a bụ ụzọ Igbo doro anya na nke eke isi jụọ ajụjụ banyere ụzọ ma ọ bụ ohere ihe si eme.
- source_word: δύναται
  choice: pụrụ
  rationale: ‘Pụrụ’ na-egosi ike ma ọ bụ ohere dị n’okwu Grik δύναται n’ụzọ dị nkenke ma bụrụ Igbo ugbu a.
- source_word: ταῦτα
  choice: ihe ndị a
  rationale: Nke a na-edobe ụdị ọtụtụ nke okwu Grik ma na-atụ aka n’ihe Jizọs kọwara tupu mgbe ahụ.
- source_word: γενέσθαι
  choice: imee
  rationale: N’usoro ‘pụrụ isi mee,’ okwu a na-egosi imezu, ịpụta, ma ọ bụ ịdị adị nke ihe ndị ahụ n’ụzọ Igbo dị eke, n’enweghị idozi ihe omimi dị n’ajụjụ ahụ.
theological_decisions:
- issue: Otú e si kọwaa ajụjụ Nikọdimọs banyere ihe Jizọs kwuru tupu mgbe ahụ
  choice: Olee otú ihe ndị a pụrụ isi mee?
  alternative: Olee otú ihe ndị a pụrụ isi dịrị? / Olee otú ihe ndị a pụrụ isi pụta?
  rationale: ‘Pụrụ isi mee’ na-egosi ohere ma ọ bụ otú ihe ndị ahụ ga-esi mezuo, ma ọ naghị akọwa ihe omimi ahụ karịa ihe ederede Grik kwuru. Ụdị ndị ọzọ nwere ike ime ka okwu ahụ bụrụ naanị banyere ọnọdụ ịdị adị ma ọ bụ mmalite.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji usoro mkparịta ụka eke ‘zara ya sị’ mee ihe, ma debe ụdị ọtụtụ nke ταῦτα dịka ‘ihe ndị a.’
