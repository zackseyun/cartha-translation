id: JHN.3.28
reference: John 3:28
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: αὐτοὶ ὑμεῖς ⸀μοι μαρτυρεῖτε ὅτι ⸀εἶπον· Οὐκ εἰμὶ ἐγὼ ὁ χριστός, ἀλλ’ ὅτι Ἀπεσταλμένος εἰμὶ ἔμπροσθεν ἐκείνου.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/028.yaml
  text: You yourselves bear me witness that I said[a], ‘I am not the Messiah[b], but I have been sent ahead of him.’
translation:
  language: ig
  text: Unu onwe unu na-agbara m akaebe na m kwuru, “Ọ bụghị m bụ Mezaya[a], kama e zitela m ka m buru ya ụzọ[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Kraịst.”
    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ, “abụ m onye e zitere n’ihu ya,” ma ọ bụ, “e zitere m n’ihu ya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτοὶ ὑμεῖς
  choice: Unu onwe unu
  rationale: Nkwughachi a na-emesi ike na ọ bụ ndị ahụ n’onwe ha bụ ndị akaebe; ọ bụkwa ụzọ Igbo doro anya na nke e ji ekwu okwu taa.
- source_word: μοι μαρτυρεῖτε
  choice: na-agbara m akaebe
  rationale: Nke a na-egosipụta asụsụ ịgba akaebe nke dị n’okwu Grik, ma na-ada nke ọma n’Igbo.
- source_word: εἶπον
  choice: m kwuru
  rationale: Oge gara aga dị mfe dabara n’aorist a, ebe Jọn na-ezo aka n’ihe o kwuburu.
- source_word: ὁ χριστός
  choice: Mezaya
  rationale: N’ebe a okwu ahụ bụ utu aha nke onye e tere mmanụ a na-atụ anya ya, ọ bụghị aha mmadụ nkịtị.
- source_word: Ἀπεσταλμένος εἰμὶ
  choice: e zitela m
  rationale: Ụdị a na-egosi iziga e mezuru nke nsonaazụ ya ka dị ugbu a; “e zitela m” na-edobe ma passive ahụ ma ịdịgide ọrụ ahụ.
- source_word: ἔμπροσθεν ἐκείνου
  choice: ka m buru ya ụzọ
  rationale: Nke a na-egosi na e zigara Jọn tupu onye ahụ, ka ọ kwadebe ụzọ, n’enweghị itinye echiche ọzọ na-adịghị n’okwu Grik.
theological_decisions:
- issue: Ịsụgharị Χριστός dị ka utu aha
  choice: Mezaya
  alternative: Kraịst
  rationale: Jọn na-agọnahụ na ya bụ onye ahụ e tere mmanụ nke ndị mmadụ na-atụ anya ya. “Mezaya” na-eme ka ọrụ okwu ahụ dị ka utu aha pụta ìhè, ebe e debere “Kraịst” n’ala ala peeji dịka ụzọ ọzọ.
- issue: Ike nke ọrụ e nyere Jọn n’okwu Ἀπεσταλμένος εἰμί
  choice: e zitela m ka m buru ya ụzọ
  alternative: abụ m onye e zitere n’ihu ya; e zitere m n’ihu ya
  rationale: Nhọrọ bụ isi na-egosi na iziga ahụ emezuworị ma ọrụ ya ka dị ire, ma na-edobe ọrụ Jọn dịka onye bu ụzọ n’enweghị ịgbakwunye nkọwa ozizi ọzọ.
translation_notes:
  register: E ji Igbo Izugbe dị ugbu a, nke dị ugwu ma dị mfe nghọta. “Unu onwe unu” na-echekwa nkwusi ike nke Grik; “na-agbara m akaebe” na-echekwa ụda iwu na ịgba akaebe nke Jọn; “ka m buru ya ụzọ” na-eme ka ọrụ ịga n’ihu onye ahụ doo anya.
