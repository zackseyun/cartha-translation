id: JHN.3.26
reference: John 3:26
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἦλθον πρὸς τὸν Ἰωάννην καὶ εἶπαν αὐτῷ· Ῥαββί, ὃς ἦν μετὰ σοῦ πέραν τοῦ Ἰορδάνου, ᾧ σὺ μεμαρτύρηκας, ἴδε οὗτος βαπτίζει καὶ πάντες ἔρχονται πρὸς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/026.yaml
  text: And they came to John and said to him[a], “Rabbi, the one who was with you beyond the Jordan, to whom you have borne witness—look, he is baptizing[b], and everyone is going to him.”
translation:
  language: ig
  text: Ha bịakwutere Jọn wee sị ya, “Rabaị, onye ahụ gị na ya nọ n’ofe Jọdan, onye ị gbaworo ama banyere ya[a]—lee, onye a na-eme baptizim, ma mmadụ niile na-agakwuru ya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “onye ị gbaworo ama nye ya.” Nhazi dative dị n’asụsụ Grik nwere ike ịpụta ma onye Jọn gbara ama banyere ya ma onye ọ gbara ama nye ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθον πρὸς τὸν Ἰωάννην
  choice: Ha bịakwutere Jọn
  rationale: ‘Bịakwutere’ na-egosi na ha bịara ruo ebe Jọn nọ, ma bụrụkwa okwu Igbo sitere n’ọnọdụ akụkọ a.
- source_word: εἶπαν αὐτῷ
  choice: wee sị ya
  rationale: Nke a bụ ụzọ Igbo dị mfe ma kwụ ọtọ isi webata okwu ha gwara Jọn.
- source_word: Ῥαββί
  choice: Rabaị
  rationale: E debere aha ọkwa ndị Juu a site n’ịsụgharị ụda ya kama ịgbanwe ya ka ọ bụrụ naanị ‘Onye Ozizi,’ ka ọnọdụ ndị Juu dị n’akụkọ ahụ ghara ifu.
- source_word: ὃς ἦν μετὰ σοῦ πέραν τοῦ Ἰορδάνου
  choice: nwoke ahụ gị na ya nọ n’ofe Jọdan
  rationale: ‘Nwoke ahụ’ na-arụ ọrụ nke ὃς n’Igbo nkịtị; ‘n’ofe Jọdan’ na-edebe nkọwa ebe ahụ n’enweghị ịgbatị ya.
- source_word: ᾧ σὺ μεμαρτύρηκας
  choice: onye ị gbara ama banyere ya
  rationale: ‘Ịgba ama banyere’ na-edebe isiokwu àmà dị mkpa n’Oziọma Jọn. A kọwara n’ala peeji na dative Grik ahụ nwekwara ike ịpụta na Jọn gbara ama nye ya.
- source_word: ἴδε
  choice: lee
  rationale: ‘Lee’ bụ mkpu a na-eji dọta uche onye ọzọ, ma na-eburu ike nke ἴδε n’asụsụ Igbo dị ugbu a.
- source_word: οὗτος
  choice: onye a
  rationale: ‘Onye a’ na-edebe nrụtụ aka doro anya na nke nwere ike igosi iwe ma ọ bụ asọmpi nke dị na οὗτος, karịa iji naanị ‘ọ.’
- source_word: βαπτίζει
  choice: na-eme baptizim
  rationale: Ụdị ngwaa na-aga n’ihu na-egosi ọrụ ọ na-eme n’oge ahụ; ‘ime baptizim’ bụ okwu nghọta zuru oke n’Igbo ụka na nke ọha.
- source_word: πάντες
  choice: mmadụ niile
  rationale: Nke a na-eburu nkwubiga okwu ókè dị n’arịrịọ ndị na-ekwu okwu ahụ, n’ebughị ụzọ mee ka ọ bụrụ ọnụ ọgụgụ zuru oke n’echiche mgbakọ.
- source_word: ἔρχονται πρὸς αὐτόν
  choice: na-agakwurukwa ya
  rationale: ‘Na-agakwuru ya’ na-egosi mmegharị ndị mmadụ n’ebe onye ahụ nọ; ‘-kwa’ jikọtara mkpesa nke abụọ na nke mbụ n’ụzọ Igbo sitere n’okike.
theological_decisions:
- issue: Okwu àmà n’Oziọma Jọn
  choice: ị gbara ama banyere ya
  alternative: ị gbara ama nye ya
  rationale: ‘Ịgba ama’ na-echekwa usoro okwu μαρτυρέω nke Jọn na-eji ugboro ugboro. Isi ederede họọrọ ihe àmà banyere onye ahụ, ma ala peeji na-echekwa ohere dative nke nwere ike igosi onye e nyere àmà ahụ.
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe dị ugbu a, dị ùgwù ma dị mfe nghọta. E debere ‘Rabaị’ na ‘baptizim’ dịka okwu ndị a maara nke ọma, a zerekwa okwu ochie ma ọ bụ nkọwa nke otu ụka kpọmkwem.
