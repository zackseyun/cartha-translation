id: JHN.3.11
reference: John 3:11
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀμὴν ἀμὴν λέγω σοι ὅτι ὃ οἴδαμεν λαλοῦμεν καὶ ὃ ἑωράκαμεν μαρτυροῦμεν, καὶ τὴν μαρτυρίαν ἡμῶν οὐ λαμβάνετε.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/011.yaml
  text: Truly[a], truly, I tell you, we speak what we know and testify to what we have seen[c][b], and you do not receive our testimony.
translation:
  language: ig
  text: N’ezie[a], n’ezie, ana m asị gị, anyị[b] na-ekwu ihe anyị maara, na-agbakwa ama banyere ihe anyị hụworo, unu anaghịkwa anabata[c] akaebe anyị.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Amen, amen, ana m asị gị.”
    reason: lexical_alternative
  - marker: b
    text: A naghị akọwa kpọmkwem ndị Jizọs tinyere n’okwu “anyị”; ndị ọ na-ezo aka na ha ka bụ ihe a na-arụrịta ụka.
    reason: alternative_reading
  - marker: c
    text: Ma ọ bụ, “unu anaghị ekweta n’akaebe anyị.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν ἀμὴν
  choice: N’ezie, n’ezie
  rationale: Ọ na-egosipụta nkwusi ike nke okwu ahụ e kwughachiri ugboro abụọ n’Igbo doro anya ma kwekọọ n’asụsụ mmadụ na-asụ ugbu a.
- source_word: λέγω σοι
  choice: ana m asị gị
  rationale: Ọ na-edobe onye nke mbụ na onye a na-agwa okwu n’otu onye, dịka asụsụ Grik si dị.
- source_word: ὃ οἴδαμεν λαλοῦμεν
  choice: anyị na-ekwu ihe anyị maara
  rationale: Ọ na-edobe usoro na ihe okwu Grik pụtara n’Igbo dị mfe ma bụrụ nke e ji eme ihe kwa ụbọchị.
- source_word: ὃ ἑωράκαμεν μαρτυροῦμεν
  choice: na-agbakwa ama banyere ihe anyị hụworo
  rationale: ‘Hụworo’ na-egosipụta ịhụ nke mere n’oge gara aga ma ka dị mkpa ugbu a; ‘ịgba ama banyere’ na-ebute echiche nke μαρτυρέω n’Igbo eke.
- source_word: τὴν μαρτυρίαν ἡμῶν
  choice: akaebe anyị
  rationale: ‘Akaebe’ bụ okwu Igbo doro anya maka ihe onye akaebe na-agba, ma na-ejikọkwa ya na ‘ịgba ama.’
- source_word: οὐ λαμβάνετε
  choice: unu anaghị anabata
  rationale: ‘Ịnabata’ na-egosipụta ịnata ma kweta n’akaebe ahụ; ‘unu’ na-echekwa onye nke abụọ n’ụbara nke ngwaa Grik.
- source_word: καὶ ... καὶ
  choice: na-...kwa ... anaghịkwa
  rationale: Mgbakwunye ‘kwa’ na-edobe njikọ καί ugboro abụọ n’enweghị itinye ntụgharị nke esemokwu dịka ‘ma.’
theological_decisions:
- issue: 'Nnochiaha onye nke mbụ n’ụbara: ‘anyị’ na ‘anyị’'
  choice: E debere ha dịka ‘anyị’ na ‘akaebe anyị,’ n’akọwaghị ndị niile Jizọs tinyere n’otu a.
  alternative: Ịkọwa ‘anyị’ dịka Jizọs na ndị na-eso ụzọ ya, dịka ọtụtụ okwu e ji dochie otu onye, ma ọ bụ dịka ndị akaebe nke eluigwe.
  rationale: Asụsụ Grik ji onye nke mbụ n’ụbara mee ihe n’ụzọ doro anya, ma kpọmkwem ndị ọ na-ezo aka na ha ka bụ ihe a na-arụrịta ụka. Nsụgharị ahụ anaghị ekpebi ihe ederede ahụ na-ekpebighị.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta, mee ihe. E debere ọdịiche dị n’etiti ‘gị’ nke otu onye na ‘unu’ nke ọtụtụ mmadụ, tinyere ọtụtụ ‘anyị’ nke ederede Grik, n’enweghị nkọwa okwukwe agbakwunyere.
