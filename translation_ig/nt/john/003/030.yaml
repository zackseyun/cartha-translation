  yaml_path: translation/nt/john/003/030.yaml
  text: He must increase[a], but I must decrease.
translation:
  language: ig
  text: Ọ ghaghị ịbawanye[a], ma mụ aghaghị ibelata.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ, n''ụzọ dabara okwu Grik nso karị: “Onye ahụ aghaghị ịbawanye, ma mụ aghaghị ibelata.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκεῖνον
  choice: Ọ
  rationale: N'okwu ndị gbara amaokwu a gburugburu, nnọchiaha a na-ezo aka n'ebe Jizọs nọ. “Ọ” bụ ụzọ Igbo si ekwu ya n'ụzọ doro anya ma dịkwa mfe; Grik n'onwe ya enweghị mkpụrụedemede ukwu pụrụ iche n'ebe a.
- source_word: δεῖ
  choice: ghaghị
  rationale: “Ghaghị” na-egosi na ihe a dị mkpa ma kwesị ime, na-akọwaghị kpọmkwem ụdị mkpa ahụ.
- source_word: αὐξάνειν
  choice: ịdị na-abawanye
  rationale: Nke a na-echekwa echiche nke mmụba na-aga n'ihu, nke nwere ike ịgụnye ịdị ukwuu, ịbụ onye a ma ama, ma ọ bụ inwe mmetụta karịa, n'etinyeghị naanị mmụba n'ọnụọgụ.
- source_word: ἐμὲ
  choice: mụ onwe m
  rationale: “Mụ onwe m” na-eme ka ọdịiche dị n'etiti Jizọs na Jọn pụta ìhè, dịka nhazi ahịrịokwu Grik si mee.
- source_word: δὲ
  choice: ma
  rationale: “Ma” na-egosi ọdịiche dị n'etiti mmụba nke onye ahụ na mbelata nke Jọn.
- source_word: ἐλαττοῦσθαι
  choice: ịdị na-ebelata
  rationale: Nhọrọ a na-echekwa myirịta okwu dị n'etiti “ịdị na-abawanye” na “ịdị na-ebelata,” ma na-egosikwa usoro na-aga n'ihu.
theological_decisions:
- issue: Ụdị mkpa δεῖ na-egosi
  choice: E ji “ghaghị” gosi usoro dị mkpa ma kwesị ime, n'ebughị ụzọ kọwaa ma ọ bụ kpebie kpọmkwem otú mkpa ahụ si bụrụ nke Chineke.
  alternative: Ịsụgharị ya dị ka naanị ihe ọnọdụ chọrọ, ma ọ bụ ịkpọ ya iwu Chineke kpọmkwem.
  rationale: δεῖ nwere ike ibu echiche nke mkpa sitere n'usoro nzọpụta Chineke, ma amaokwu ahụ akọwaghị kpọmkwem isi iyi ma ọ bụ ụzọ mkpa ahụ si arụ ọrụ. “Ghaghị” na-echekwa ịdị arọ nke okwu ahụ na-enweghị itinye nkọwa ozizi ọzọ.
translation_notes:
  register: Asụsụ Igbo Izugbe, nke oge a, dị ùgwù ma dị mfe nghọta. E debere mkpirikpi na myirịta okwu nke ahịrịokwu Grik, ebe “mụ onwe m” na-eme ka ọdịiche ahụ doo anya.
