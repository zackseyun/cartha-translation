- from: Ọ ghaghị ịdị na-abawanye[a], ma mụ onwe m aghaghị ịdị na-ebelata.
  to: Ọ ghaghị ịbawanye[a], ma mụ aghaghị ibelata.
  rationale: The revision preserves the Greek’s necessity, contrast, and parallel infinitive structure in more natural modern Standard Igbo. The footnote retains the demonstrative nuance of ἐκεῖνον without introducing the misleading idea of physical smallness.
