  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ πατὴρ ἀγαπᾷ τὸν υἱόν, καὶ πάντα δέδωκεν ἐν τῇ χειρὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/035.yaml
  text: The Father loves the Son and has given all things into his hand[a].
translation:
  language: ig
  text: Nna ahụ hụrụ Ọkpara ahụ n’anya, nyela ya ihe niile n’aka ya[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’asụsụ Grik, okwu a bụ kpọmkwem “n’aka ya.” Ọ bụ akpaalaokwu na-egosi inyefe mmadụ ikike, ihe onwunwe, ma ọ bụ nlekọta.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ πατὴρ
  choice: Nna ahụ
  rationale: Aha a na-ezo aka n’ebe Chineke bụ Nna nọ n’ihe gbasara mmekọrịta ya na Ọkpara ahụ; ‘ahụ’ na-egosi onye a kapịrị ọnụ n’ụzọ Igbo si ekwu ya.
- source_word: ἀγαπᾷ
  choice: hụrụ ... n’anya
  rationale: Nke a bụ ụzọ Igbo dị ugbu a na nke ebumpụta ụwa si ekwu ịhụnanya na-adịgide adịgide; ọ dabara n’ọnọdụ ngwaa Grik nke na-egosi eziokwu dị ugbu a.
- source_word: τὸν υἱόν
  choice: Ọkpara ahụ
  rationale: E ji ya mee aha nsọpụrụ na-ezo aka kpọmkwem na Jizọs n’ime mmekọrịta ya na Nna; mkpụrụedemede ukwu na-egosi ojiji aha nsọpụrụ a.
- source_word: πάντα
  choice: ihe niile
  rationale: Ọ na-echekwa oke sara mbara nke neuter plural Grik, ya bụ, ihe niile, n’enweghị ibelata ihe okwu ahụ pụtara.
- source_word: δέδωκεν
  choice: nyewokwa
  rationale: Ụdị perfect Grik na-egosi ihe e mere nke nsonaazụ ya ka dị. Akara ‘-wo-’ n’Igbo na-enyere aka igosi mmezu nwere ọnọdụ na-aga n’ihu, ebe ‘kwa’ jikọtara nkebiokwu abụọ ahụ.
- source_word: ἐν τῇ χειρὶ αὐτοῦ
  choice: n’aka ya
  rationale: Nke a na-echekwa oyiyi okwu Grik ma bụrụkwa akpaalaokwu Igbo ebumpụta ụwa maka inyefe mmadụ ihe, ikike, ma ọ bụ nlekọta.
theological_decisions:
- issue: Mmekọrịta Nna na Ọkpara
  choice: E debere aha mmekọrịta ndị ahụ dịka ‘Nna ahụ’ na ‘Ọkpara ahụ.’
  alternative: Ịsụgharị ha dịka nna na nwa nwoke n’ozuzu, n’enweghị igosi na ha bụ aha ndị a kapịrị ọnụ.
  rationale: Ihe odide ahụ na-ekwu banyere mmekọrịta pụrụ iche nke Nna na Ọkpara. Nsụgharị a na-echekwa ya n’etinyeghị nkọwa ozizi ọzọ na-adịghị n’amaokwu ahụ.
- issue: Oke na ịdịgide nke ihe e nyere Ọkpara ahụ
  choice: ‘nyewokwa ihe niile’
  alternative: ‘nyere ya ihe niile’
  rationale: ‘Nyewokwa’ na-echekwa echiche nke ihe e mezuru nke nsonaazụ ya ka dị, ebe ‘ihe niile’ na-echekwa oke zuru ezu nke πάντα.
translation_notes:
  register: E ji Standard Igbo dị mfe, dị ugwu, ma bụrụ nke ndị na-agụ akwụkwọ taa ga-aghọta. ‘N’aka ya’ bụ ma nsụgharị dị nso n’okwu Grik ma akpaalaokwu Igbo ebumpụta ụwa. E debere akara nkọwa ala peeji [a] n’ahịrị amaokwu ahụ.
