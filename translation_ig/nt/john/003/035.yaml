    text: N’asụsụ Grik, okwu a bụ kpọmkwem “n’aka ya.” Ọ bụ akpaalaokwu na-egosi inyefe mmadụ ikike, ihe onwunwe, ma ọ bụ nlekọta.
    reason: lexical_alternative
