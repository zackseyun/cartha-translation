  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Μετὰ ταῦτα ἦλθεν ὁ Ἰησοῦς καὶ οἱ μαθηταὶ αὐτοῦ εἰς τὴν Ἰουδαίαν γῆν, καὶ ἐκεῖ διέτριβεν μετ’ αὐτῶν καὶ ἐβάπτιζεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/022.yaml
  text: After these things[a], Jesus and his disciples went into the land of Judea[c][b], and there he was spending time with them and baptizing.
translation:
  language: ig
  text: Mgbe ihe ndị a gasịrị, Jizọs na ndị na-eso ụzọ ya gara n’ala Judia.[b] Ọ nọ n’ebe ahụ na ha ruo oge ụfọdụ,[c] na-eme baptizim.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jọn 4:2 mechara kọwaa na ọ bụghị Jizọs n’onwe ya na-eme baptizim, kama ọ bụ ndị na-eso ụzọ ya na-eme ya.
    reason: cross_reference
  - marker: b
    text: A pụkwara ịsụ ya, “n’ógbè Judia,” ma ọ bụ naanị, “na Judia.”
    reason: lexical_alternative
  - marker: c
    text: A pụkwara ịsụ ya, “ọ nọ n’ebe ahụ na ha.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: Mgbe ihe ndị a gasịrị
  rationale: Nke a na-egosipụta usoro akụkọ ahụ ma na-echekwa ụdị ọtụtụ nke ταῦτα n’Igbo doro anya.
- source_word: ἦλθεν
  choice: gara
  rationale: Ọ bụ okwu ngagharị kwekọrọ n’ebe ha si pụọ na ebe a kpọrọ aha dịka ebe ha na-aga; ọ na-ada nke ọma n’akụkọ Igbo.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: ndị na-eso ụzọ ya
  rationale: Nke a bụ ụzọ Igbo a na-ejikarị akọwa ndị na-amụ ihe n’aka onye nkuzi ma na-eso ya.
- source_word: εἰς τὴν Ἰουδαίαν γῆν
  choice: n’ala Judia
  rationale: “Ala Judia” na-egosipụta γῆ n’ụzọ kpọmkwem ma ka na-ada n’Igbo nke oge a.
- source_word: διέτριβεν
  choice: ọ nọnyere ha ruo oge ụfọdụ
  rationale: Nke a na-egosipụta omume na-aga n’ihu nke imperfect ahụ na echiche nke ịnọ ma ọ bụ iwepụta oge n’otu ebe.
- source_word: μετ’ αὐτῶν
  choice: nyere ha
  rationale: Ọ na-ezo aka n’ịkpọkọ Jizọs na ndị na-eso ụzọ ya n’ebe ahụ.
- source_word: ἐβάπτιζεν
  choice: na-emekwa baptizim
  rationale: Ụdị a na-echekwa omume na-aga n’ihu na Jizọs dịka isiokwu ụtọasụsụ, ma “baptizim” anaghị ebubata otu ụzọ ụka pụrụ iche si eme ya.
theological_decisions:
- issue: Onye bụ isiokwu nke “na-eme baptizim” ma e jiri ya tụnyere Jọn 4:2
  choice: E debere Jizọs dịka isiokwu ụtọasụsụ nke omume ahụ n’amaokwu a.
  alternative: Ịgbanwe ahịrịokwu ahụ ka o kwuo ozugbo na ọ bụ ndị na-eso ụzọ ya na-eme baptizim.
  rationale: Ngwaa otu onye dị na Grik na-ezo n’ụzọ nkịtị n’ebe Jizọs nọ. Jọn 4:2 mechara kọwaa na ọ bụghị Jizọs n’onwe ya na-eme ya; ya mere, ndetu ala peeji na-enye nkọwa ahụ n’ebughị ụzọ gbanwee esemokwu akụkọ dị n’amaokwu a.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. “Ndị na-eso ụzọ” na “baptizim” bụ okwu Ndị Kraịst na-aghọta n’ozuzu; a zere ịkọwa ụdị e si eme baptizim ka a ghara ibubata echiche otu ụka pụrụ iche.
