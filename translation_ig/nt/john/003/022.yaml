revisions:
- from: Mgbe ihe ndị a gasịrị, Jizọs na ndị na-eso ụzọ ya gara n’ala Judia.[b] N’ebe ahụ, ọ nọnyere ha ruo oge ụfọdụ,[c] na-emekwa baptizim.[a]
  to: Mgbe ihe ndị a gasịrị, Jizọs na ndị na-eso ụzọ ya gara n’ala Judia.[b] Ọ nọ n’ebe ahụ na ha ruo oge ụfọdụ,[c] na-eme baptizim.[a]
  rationale: The revision removes the unwarranted additive force of -kwa from the baptizing clause and replaces the less natural alternative footnote wording. It otherwise preserves the source sequence, the ongoing sense of the two imperfect verbs as naturally as Igbo permits, and the deliberately unresolved relationship between this verse and John 4:2.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T05:37:57Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the temporal transition, the journey into Judea, Jesus' presence with his disciples, and the continued baptizing. However, “na-emekwa baptizim” contains the additive sense of “also” (-kwa), which is not expressed by the Greek conjunction καί in this context. The wording for διατρίβω can also be made more idiomatic while retaining its durative sense.
  naturalness: “Ọ nọ n’ebe ahụ na ha ruo oge ụfọdụ” is clear, natural Standard Igbo for remaining/staying there with them. “Na-eme baptizim” is natural church-register Igbo and avoids the unwarranted additive nuance of “na-emekwa.”
  terminology: “Jizọs,” “ndị na-eso ụzọ ya,” “Judia,” and “baptizim” are appropriate Standard Igbo biblical terminology. The cross-reference footnote appropriately preserves the grammatical wording of this verse without prematurely harmonizing it with John 4:2.
  issues:
  - severity: medium
    issue: The verb phrase “na-emekwa baptizim” adds an unexpressed additive nuance.
    rationale: The suffix -kwa means “also/as well.” Although καί can mean “and,” it does not require the added sense that Jesus was additionally baptizing. “na-eme baptizim” faithfully retains the ongoing action without that implication.
  - severity: low
    issue: The lexical-alternative footnote for staying is not idiomatic as drafted.
    rationale: “ọ nọgidere n’ebe ahụ ha na ya” lacks the normal Igbo construction for “with them.” “ọ nọ n’ebe ahụ na ha” is clear and accurately expresses the alternative.
  revised_text: Mgbe ihe ndị a gasịrị, Jizọs na ndị na-eso ụzọ ya gara n’ala Judia.[b] Ọ nọ n’ebe ahụ na ha ruo oge ụfọdụ,[c] na-eme baptizim.[a]
  revised_footnotes:
