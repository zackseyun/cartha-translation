    text: Jọn 4:2 mechara kọwaa na ọ bụghị Jizọs n’onwe ya na-eme baptizim, kama ọ bụ ndị na-eso ụzọ ya na-eme ya.
    reason: cross_reference
  - marker: b
    text: A pụkwara ịsụ ya, “n’ógbè Judia,” ma ọ bụ naanị, “na Judia.”
    reason: lexical_alternative
  - marker: c
    text: A pụkwara ịsụ ya, “ọ nọ n’ebe ahụ na ha.”
    reason: lexical_alternative
  revision_rationale: The revision removes the unwarranted additive force of -kwa from the baptizing clause and replaces the less natural alternative footnote wording. It otherwise preserves the source sequence, the ongoing sense of the two imperfect verbs as naturally as Igbo permits, and the deliberately unresolved relationship between this verse and John 4:2.
