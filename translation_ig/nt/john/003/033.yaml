  yaml_path: translation/nt/john/003/033.yaml
  text: Whoever has received his testimony has certified that God is true[a].
translation:
  language: ig
  text: Onye ọ bụla nabatara akaebe ya akwadola na Chineke bụ eziokwu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n’ụzọ dabara nnọọ n’okwu Grik, “etinyela akara nkwado ya n’ịkwado na Chineke bụ eziokwu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ λαβὼν
  choice: Onye ọ bụla nabatara
  rationale: Nkebiokwu a na-arụ ọrụ dị ka aha ma na-ezo aka n’ozuzu nye onye ọ bụla nabatara akaebe ahụ; “nabatara” na-egosikwa omume e mezuru.
- source_word: αὐτοῦ τὴν μαρτυρίαν
  choice: akaebe ya
  rationale: “Ya” na-ezo aka n’onye ahụ si n’eluigwe, ya bụ Ọkpara ahụ a na-ekwu maka akaebe ya n’okwu gbara amaokwu a gburugburu; “akaebe” dabara n’usoro echiche Jọn banyere ịgba akaebe.
- source_word: ἐσφράγισεν
  choice: ejirila nke ahụ kwado
  rationale: Ngwaa ahụ pụtara n’ụzọ nkịtị itinye akara, ma n’ebe a ọ bụ ihe atụ nke igosi ma ọ bụ ikwenye n’ụzọ siri ike na ihe bụ eziokwu. Nsụgharị a na-eme ka ihe ọ pụtara doo anya n’Igbo, ebe a na-edebe ihe atụ nke akara n’okpuru peeji.
- source_word: ὅτι
  choice: na
  rationale: Ọ na-ewebata ọdịnaya nke ihe onye ahụ kwadoro, ọ bụghị ihe kpatara ya.
- source_word: ὁ θεὸς ἀληθής ἐστιν
  choice: Chineke bụ onye eziokwu
  rationale: Nke a na-egosi na Chineke bụ eziokwu, bụrụkwa onye a pụrụ ịtụkwasị obi, n’enweghị ime ka okwu ahụ bụrụ naanị na ọ na-ekwu eziokwu.
theological_decisions:
- issue: Ihe atụ dị n’okwu banyere itinye akara
  choice: Jiri “ejirila nke ahụ kwado” n’ahịrịokwu bụ isi
  alternative: “etinyela akara ya na nke a”
  rationale: Ịnabata akaebe Ọkpara ahụ bụ ikwenye n’ụzọ siri ike na Chineke bụ onye eziokwu. Nsụgharị bụ isi na-akọwa ike ihe atụ ahụ n’Igbo nke oge a, ebe nkọwa ala peeji na-echekwa okwu nkịtị banyere akara.
- issue: Ihe ἀληθής pụtara mgbe e ji ya kọwaa Chineke
  choice: “Chineke bụ onye eziokwu”
  alternative: “Chineke na-ekwu eziokwu”
  rationale: Nhọrọ a na-echekwa obosara nke okwu Grik ahụ—ịbụ eziokwu na ịbụ onye a pụrụ ịtụkwasị obi—kama imechi ya naanị n’ikwu eziokwu.
translation_notes:
  register: E ji asụsụ Igbo izugbe, dị mfe ma dị ùgwù mee ihe. “Akaebe” na “onye eziokwu” bụ okwu ndị mmadụ na-aghọta nke ọma ma na-echekwa ụda iwu na isiokwu eziokwu dị n’Oziọma Jọn.
