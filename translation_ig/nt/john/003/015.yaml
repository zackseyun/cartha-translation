id: JHN.3.15
reference: John 3:15
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἵνα πᾶς ὁ πιστεύων ⸂ἐν αὐτῷ⸃ ἔχῃ ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/015.yaml
  text: so that everyone who believes in him may have eternal life[a][b].
translation:
  language: ig
  text: ka onye ọ bụla kwere na ya nwee ndụ ebighị ebi.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “onye ọbụla kwere.”
    reason: lexical_alternative
  - marker: b
    text: Ụfọdụ nsụgharị na-asụgharị nkebiokwu a “n’ime ya,” ma okwu Grik e dere ebe a bụ “na ya” (ἐν αὐτῷ).
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: ka
  rationale: “Ka” na-ewebata nzube ma ọ bụ ihe ga-esi n'okwu bu ya ụzọ pụta, ma ọ bụkwa ụzọ Igbo dị mfe ma kwekọọ n'ahịrịokwu a.
- source_word: πᾶς ὁ πιστεύων
  choice: onye ọ bụla nke kwere
  rationale: Nkebiokwu a na-emetụta onye ọ bụla n'enweghị ịkpa ókè. Nsụgharị a na-egosipụta obosara ya ma na-anọgide n'ụdị otu onye nke participle Grik.
- source_word: πιστεύων
  choice: nke kwere
  rationale: “Kwere” bụ okwu Igbo doro anya ma bụrụ nke a na-ejikarị asụgharị πιστεύω; ebe a ọ na-egosi ikwere na onye ahụ.
- source_word: ἐν αὐτῷ
  choice: na ya
  rationale: Ederede Grik nwere ἐν, ya mere “na ya” na-esochi okwu isi mmalite kama ibubata εἰς, nke a na-ahụkarị n'ebe ndị ọzọ n'akwụkwọ Jọn.
- source_word: ἔχῃ
  choice: nwee
  rationale: Ụdị “nwee” mgbe “ka” gasịrị na-egosipụta subjunctive nke ἵνα nke ọma n'Igbo, n'enweghị itinye echiche nke ejighị n'aka n'okwu ahụ.
- source_word: ζωὴν αἰώνιον
  choice: ndụ ebighị ebi
  rationale: Nke a bụ okwu Igbo e guzobeworo nke na-egosi ndụ na-adịghị agwụ agwụ nakwa ụdị ndụ nke oge nzọpụta Chineke.
theological_decisions:
- issue: Otu e si asụgharị okwu okwukwe Jọn nke nwere ἐν αὐτῷ
  choice: na ya
  alternative: banye n'ime ya
  rationale: Ederede a kwuru ἐν αὐτῷ, ọ bụghị εἰς αὐτόν. Ya mere, a chekwara ọdịiche ahụ kama ime ka ọ kwekọọ n'okwu Jọn ndị ọzọ a na-ahụkarị.
- issue: Oke ndị πᾶς ὁ πιστεύων na-agụnye
  choice: onye ọ bụla nke kwere
  alternative: onye ọbụla kwere
  rationale: Okwu Grik ahụ bụ nke metụtara mmadụ niile n'ozuzu, ọ bụghị naanị ụmụ nwoke ma ọ bụ otu ìgwè pụrụ iche. Nsụgharị a na-eme ka obosara ahụ doo anya.
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. “Ka ... nwee” na-eme ka njikọ nzube ahụ bụrụ nke e bu pụta ụwa n'Igbo, ebe “ndụ ebighị ebi” na-echekwa okwu Baịbụl a maara nke ọma.
