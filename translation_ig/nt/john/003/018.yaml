  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ πιστεύων εἰς αὐτὸν οὐ κρίνεται· ὁ ⸀δὲ μὴ πιστεύων ἤδη κέκριται, ὅτι μὴ πεπίστευκεν εἰς τὸ ὄνομα τοῦ μονογενοῦς υἱοῦ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/018.yaml
  text: The one who believes in him is not judged[a]; but the one who does not believe has already been judged[b], because he has not believed in the name of the one and only Son of God.
translation:
  language: ig
  text: Onye kweere na ya, a naghị ekpe ya ikpe[a]; ma onye na-ekweghị ekwe, a kpeelarị ya ikpe, n’ihi na o kwebeghị n’aha Ọkpara Chineke naanị ya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị “a naghị ama ya ikpe” na ugboro mbụ, na “a maalarị ya ikpe” na ugboro nke abụọ. Ngwaa Grik κρίνω nwere ike ịpụta “ikpe ikpe” ma ọ bụ, n’ọnọdụ a, “ịta mmadụ ikpe.”
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsị “Ọkpara Chineke pụrụ iche” ma ọ bụ “Ọkpara Chineke naanị ya”; ntụgharị ọdịnala bụ “Ọkpara Chineke a mụrụ naanị ya.”
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ πιστεύων εἰς αὐτόν
  choice: Onye kweere na ya
  rationale: Nkebi a na-egosi onye ọ bụla nke ntụkwasịrị ya obi. “Kweere na ya” bụ ụzọ Igbo nkịtị si egosi okwukwe e tinyere n’ime mmadụ, ọ bụghị naanị ikweta na ihe o kwuru bụ eziokwu.
- source_word: οὐ κρίνεται
  choice: a naghị ama ya ikpe
  rationale: “Ịma mmadụ ikpe” na-egosi mkpebi ikpe megide mmadụ ma kwekọọ n’ike okwu a nwere n’ọnọdụ Jọn 3:17–19. Oge ugbu a dị na “a naghị” na-echekwa ọdịdị ngwaa Grik ahụ.
- source_word: ὁ δὲ μὴ πιστεύων
  choice: ma onye na-ekweghị ekwe
  rationale: “Ma” na-echekwa ọdịiche δέ, ebe “onye na-ekweghị ekwe” na-enye participle ahụ ọrụ aha mmadụ ma na-egosi ọnọdụ ekweghị ekwe na-aga n’ihu.
- source_word: ἤδη κέκριται
  choice: a maalarị ya ikpe
  rationale: “Maalarị” na-egosi ma ihe e mecharala ma ọnọdụ si na ya pụta nke ka dị ugbu a, dị ka perfect tense Grik si eme.
- source_word: ὅτι μὴ πεπίστευκεν
  choice: n’ihi na o kwebeghị
  rationale: “N’ihi na” na-ewebata ihe kpatara ikpe ahụ; “o kwebeghị” na-echekwa ọnọdụ ekweghị ekwe nke perfect tense na-egosi.
- source_word: εἰς τὸ ὄνομα
  choice: n’aha
  rationale: A hapụrụ okwu “aha” dịka ihe odide ahụ siri kwuo. N’ebe a, ọ na-anọchi onye ahụ dịka a maara ya na ikike ya, ma etinyeghị nkọwa ndị ahụ n’ahịrị bụ isi.
- source_word: τοῦ μονογενοῦς υἱοῦ τοῦ θεοῦ
  choice: Ọkpara Chineke, onye pụrụ iche, onye naanị ya bụ Ọkpara ya
  rationale: “Ọkpara Chineke” na-echekwa aha υἱός dịka aha e ji mara Ọkpara ahụ. Nkebi abụọ so ya na-egosi na μονογενής pụtara ịdị naanị otu na ịdị pụrụ iche, na-enweghị itinye echiche ọmụmụ anụ ahụ n’okwu ahụ.
theological_decisions:
- issue: Otu e si tụgharị κρίνω n’amaokwu a
  choice: ịma ikpe
  alternative: ikpe ikpe
  rationale: Ọnọdụ dị nso na-ekwu maka nzọpụta na mkpebi ikpe megide onye na-ekweghị ekwe, ya mere “ịma ikpe” na-ebute mmetụta ikpe mara mmadụ. Ihe odide ala na-echekwa “ikpe ikpe,” nke bụ ntụgharị sara mbara karị, ka e wee ghara izochi obosara okwu Grik ahụ.
- issue: Otu e si tụgharị μονογενής
  choice: onye pụrụ iche, onye naanị ya bụ Ọkpara ya
  alternative: Ọkpara naanị ya; Ọkpara a mụrụ naanị ya
  rationale: Nhọrọ a na-egosi ịdị iche na ịdị naanị otu nke Ọkpara ahụ, ma ọ naghị amanye okwu Grik ahụ ikwu kpọmkwem banyere ịmụ nwa. Ihe odide ala na-echekwa ntụgharị ọdịnala n’ihi mkpa akụkọ ihe mere eme ya.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta dee ya. A họọrọ “onye” iji mee ka ahịrị abụọ ahụ kwekọọ, “maalarị” iji gosi perfect tense, ma zere okwu ndị ga-eme ka μονογενής yie ka ọ na-ekwu kpọmkwem banyere ọmụmụ anụ ahụ.
