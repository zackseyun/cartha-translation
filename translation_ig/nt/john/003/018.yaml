revisions:
- from: Onye kweere na ya, a naghị ama ya ikpe[a]; ma onye na-ekweghị ekwe, a maalarị ya ikpe, n’ihi na o kwebeghị n’aha Ọkpara Chineke, onye pụrụ iche, onye naanị ya bụ Ọkpara ya[b].
  to: Onye kweere na ya, a naghị ekpe ya ikpe[a]; ma onye na-ekweghị ekwe, a kpeelarị ya ikpe, n’ihi na o kwebeghị n’aha Ọkpara Chineke naanị ya[b].
  rationale: The revision removes the duplicated, awkward explanation of μονογενής and replaces it with the clear Standard Igbo expression “Ọkpara Chineke naanị ya.” It also uses the more idiomatic passive perfect “a kpeelarị ya ikpe.” The alternative lexical possibilities for κρίνω and μονογενής remain available in footnotes without imposing a doctrinal interpretation.
