  text: Ἐγένετο οὖν ζήτησις ἐκ τῶν μαθητῶν Ἰωάννου μετὰ Ἰουδαίου περὶ καθαρισμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/025.yaml
  text: Then a dispute arose between John's disciples and a Jew about purification[a].
translation:
  language: ig
  text: Mgbe ahụ, esemokwu bilitere n’etiti ndị na-eso ụzọ Jọn na otu onye Juu banyere ịdị ọcha[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “banyere ime ka ihe dị ọcha” ma ọ bụ “banyere ịdị ọcha n’usoro emume okpukpe.” Okwu Grik ahụ nwere ike ịpụta ime ka ihe dị ọcha n’ozuzu ya, ma n’ọnọdụ a o yiri ka ọ na-ezo aka n’ịdị ọcha metụtara emume okpukpe.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο
  choice: bilitere
  rationale: N’ebe a, okwu ahụ na-egosi na esemokwu malitere. “Bilitere” bụ ụzọ Igbo si ekwu nke a n’ụzọ doro anya ma kwekọọ n’akụkọ ahụ.
- source_word: οὖν
  choice: Mgbe ahụ
  rationale: Ọ na-ejikọta ihe a na ihe gara aga ma na-akwalite akụkọ ahụ n’ihu, na-enweghị ime ka njikọ ahụ bụrụ nkwubi okwu siri ike.
- source_word: ζήτησις
  choice: esemokwu
  rationale: Okwu Grik ahụ nwere ike ịpụta mkparịta ụka ma ọ bụ arụmụka; ọnọdụ a na-egosi na e nwere nghọtahie ma ọ bụ mgbagha, ya mere “esemokwu” dabara adaba.
- source_word: ἐκ τῶν μαθητῶν Ἰωάννου ... μετὰ Ἰουδαίου
  choice: n’etiti ndị na-eso ụzọ Jọn na otu onye Juu
  rationale: Ọ bụ ezie na usoro Grik ahụ malitere n’echiche “site n’etiti ndị na-eso ụzọ Jọn,” njikọ ya na μετά na-egosi ndị sonyere n’esemokwu ahụ. “N’etiti ... na ...” bụ Igbo nkịtị ma na-echekwa na Ἰουδαίου bụ otu onye.
- source_word: περὶ καθαρισμοῦ
  choice: banyere ịdị ọcha
  rationale: “Ịdị ọcha” na-ekpuchi echiche nke ime ka ihe dị ọcha ma ọ bụ ọnọdụ ịdị ọcha, ma na-ahapụ ohere maka ọdịdị emume okpukpe nke okwu ahụ nwere n’ọnọdụ a.
theological_decisions:
- issue: Ma a ga-akọwa καθαρισμός kpọmkwem dị ka ime ka mmadụ dị ọcha n’usoro emume okpukpe
  choice: ịdị ọcha
  alternative: ịsachasị onwe / ịdị ọcha n’usoro emume okpukpe
  rationale: Ọnọdụ dị n’Oziọma Jọn na-atụ aro na ịdị ọcha metụtara usoro okpukpe ndị Juu, ma amaokwu a akọwaghị kpọmkwem ụdị ya. Isi okwu ahụ na-edebe ohere ahụ n’emeghị ka nkọwa ahụ karịa ihe ederede kwuru; ndetu ala peeji na-eme ka nghọta ahụ pụta ìhè.
translation_notes:
  register: Standard Igbo; asụsụ dị ugbu a, dị ùgwù, ma dị mfe nghọta. E ji “ndị na-eso ụzọ” mee μαθηταί, jiri “otu onye Juu” chekwaa ọnụọgụ otu, ma zere ịkọwapụta ọdịdị emume ahụ karịa ihe amaokwu ahụ kwuru.
