id: JHN.3.16
reference: John 3:16
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Οὕτως γὰρ ἠγάπησεν ὁ θεὸς τὸν κόσμον ὥστε τὸν ⸀υἱὸν τὸν μονογενῆ ἔδωκεν, ἵνα πᾶς ὁ πιστεύων εἰς αὐτὸν μὴ ἀπόληται ἀλλὰ ἔχῃ ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/016.yaml
  text: 'For God loved the world in this way: he gave his only Son[b][a], so that everyone who believes in him should not perish but have eternal life.'
translation:
  language: ig
  text: N’ihi na Chineke hụrụ ụwa n’anya n’ụzọ dị otu a:[a] o nyere Ọkpara ya naanị otu,[b] ka onye ọ bụla nke kwere na ya ghara ịla n’iyi, kama ka o nwee ndụ ebighị ebi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ịsụgharị ya n’ụzọ ọdịnala: “N’ihi na Chineke hụrụ ụwa n’anya nke ukwuu.” Ma okwu Grik ahụ nwere ike imesi ụzọ Chineke si hụ ụwa n’anya ike: “N’ihi na Chineke hụrụ ụwa n’anya n’ụzọ dị otu a.”'
    reason: lexical_alternative
  - marker: b
    text: 'A pụkwara ịsụgharị ya: “Ọkpara ya a mụrụ naanị ya”; ma ọ bụ, “Ọkpara ya pụrụ iche.”'
    reason: alternative_reading
lexical_decisions:
- source_word: Οὕτως
  choice: n’ụzọ dị otu a
  rationale: Ọ na-egosikarị ụzọ Chineke si hụ ụwa n’anya, nke inye Ọkpara ya kọwara, karịa nanị ịdị ukwuu nke ịhụnanya ahụ.
- source_word: γὰρ
  choice: N’ihi na
  rationale: Na-ejigide ọrụ okwu ahụ nke ịkọwa ma ọ bụ ịkwado ihe e kwuru n’amaokwu ndị bu ya ụzọ.
- source_word: ἠγάπησεν
  choice: hụrụ ... n’anya
  rationale: Nke a bụ ụzọ Igbo nkịtị na nke doro anya si ekwu ‘loved,’ ma na-egosipụta omume ahụ dịka ihe mere.
- source_word: τὸν κόσμον
  choice: ụwa
  rationale: Na-echekwa obosara κόσμος n’Oziọma Jọn kama ime ka ọ bụrụ naanị ‘ụmụ mmadụ.’
- source_word: ὥστε ... ἔδωκεν
  choice: o nyere
  rationale: Akara kọlọ́n na-ewebata ihe Chineke mere nke gosiri ụzọ ịhụnanya ya si pụta ìhè; ‘nyere’ na-ahapụ obosara nke ngwaa Grik ahụ n’enweghị ịkọwapụta naanị ọmụmụ mmadụ ma ọ bụ ọnwụ n’obe.
- source_word: τὸν υἱὸν τὸν μονογενῆ
  choice: Ọkpara ya naanị ya
  rationale: ‘Ọkpara’ na-egosi mmekọrịta Nna na Ọkpara, ebe ‘naanị ya’ na-egosi na ọ bụ otu onye pụrụ iche n’ụdị ya; ntụgharị ọdịnala dị na nkọwa ala peeji.
- source_word: ἵνα
  choice: ka
  rationale: Ụzọ Igbo sitere n’okike e si webata nzube ma ọ bụ ihe a tụrụ anya ya.
- source_word: πᾶς ὁ πιστεύων εἰς αὐτὸν
  choice: onye ọ bụla nke kwere na ya
  rationale: Na-echekwa nghọta zuru ụwa ọnụ na nke izugbe nke ahịrịokwu Grik ahụ n’enweghị itinye echiche ụka pụrụ iche.
- source_word: μὴ ἀπόληται
  choice: ghara ịla n’iyi
  rationale: Na-echekwa ịdị arọ na obosara nke ἀπόλλυμι n’ebughị ụzọ kọwaa kpọmkwem ụdị mbibi ahụ.
- source_word: ἀλλὰ ἔχῃ ζωὴν αἰώνιον
  choice: kama ka o nwee ndụ ebighị ebi
  rationale: Na-egosipụta ọdịiche ahụ nke ọma ma jiri okwu Igbo a na-aghọta nke ọma maka ndụ na-adịru mgbe ebighị ebi.
theological_decisions:
- issue: Ihe Οὕτως pụtara
  choice: ụzọ e si hụ n’anya (‘n’ụzọ dị otu a’)
  alternative: ogo ma ọ bụ ịdị ukwuu (‘hụrụ ụwa n’anya nke ukwuu’)
  rationale: Usoro okwu ahụ na inye Ọkpara na-esochi ya na-akọwa ụzọ ịhụnanya Chineke si pụta ìhè; nkọwa ọzọ ka edobere n’ala peeji iji chekwaa nghọta ọdịnala.
- issue: Nsụgharị μονογενής gbasara Ọkpara
  choice: ‘Ọkpara ya naanị ya’
  alternative: ‘Ọkpara ya a mụrụ naanị ya’ ma ọ bụ ‘Ọkpara ya pụrụ iche’
  rationale: Isi okwu ahụ bụ ịdị naanị otu na ịdị pụrụ iche nke Ọkpara n’ime mmekọrịta ya na Nna; a naghị eme ka isi ederede kpebie esemokwu gbasara etu ‘ịmụ’ si daba na okwu ahụ.
- issue: Obosara πᾶς ὁ πιστεύων
  choice: ‘onye ọ bụla nke kwere’
  alternative: ‘onye ọbụla na-ekwere’
  rationale: Na-echekwa oku zuru mmadụ niile nke amaokwu ahụ n’enweghị idozi arụmụka gbasara nhọpụta, nzaghachi mmadụ, ma ọ bụ oke mgbapụta.
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. ‘Ọkpara’ dabara n’aha njirimara Jọn ji maka Son ma na-egosi mmekọrịta ya na Nna; ahịrịokwu ahụ ezere okwu ụka pụrụ iche ma chekwaa mgbagwoju anya dị na Οὕτως na μονογενής.
