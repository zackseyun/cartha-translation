source:
  edition: SBLGNT
  text: πᾶς γὰρ ὁ φαῦλα πράσσων μισεῖ τὸ φῶς καὶ οὐκ ἔρχεται πρὸς τὸ φῶς, ἵνα μὴ ἐλεγχθῇ τὰ ἔργα αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/john/003/020.yaml
  text: For everyone who practices evil hates the light and does not come to the light[b][a], lest his works be exposed.
translation:
  language: ig
  text: N’ihi na onye ọ bụla na-eme ihe ọjọọ na-akpọ ìhè asị, ọ dịghịkwa abịakwute ìhè, ka e wee ghara ikpughe ọrụ ya.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, ‘ka a ghara ịbara ọrụ ya mba’ ma ọ bụ ‘ka e ghara igosi na ọrụ ya bụ ihe ọjọọ’; ngwaa Grik ahụ nwere ike ịpụta ikpughe mmejọ, igosi ikpe ọmụma, ma ọ bụ ime ka ihe pụta ìhè.
    reason: lexical_alternative
  - marker: b
    text: N’asụsụ Grik, nnọchiaha e sụgharịrị ‘ya’ dị n’ụdị nwoke, n’ọnụọgụ otu, ma e ji ya ekwu maka onye ọ bụla na-eme ihe ọjọọ; nnọchiaha Igbo ‘ya’ dị n’ọnụọgụ otu ma ọ naghị egosi ma onye ahụ ọ bụ nwoke ma ọ bụ nwaanyị.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς γὰρ ὁ
  choice: N’ihi na onye ọ bụla
  rationale: Nke a na-edobe γάρ dịka njikọ na-akọwa okwu bu ya ụzọ, ma na-egosikwa articular participle dị ka okwu gbasara onye ọ bụla nwere omume a.
- source_word: φαῦλα πράσσων
  choice: na-eme ihe ọjọọ
  rationale: φαῦλα nwere nghọta omume rụrụ arụ n’ebe a; present participle πράσσων na-egosi omume e ji onye ahụ mara, nke Igbo natural na-egosipụta site na ‘na-eme.’
- source_word: μισεῖ τὸ φῶς
  choice: kpọrọ ìhè asị
  rationale: Akpaalaokwu ‘kpọrọ ... asị’ na-ebupụta ike μισεῖ n’ụzọ doro anya ma debe ihe atụ Jọn nke ‘ìhè.’
- source_word: οὐκ ἔρχεται πρὸς τὸ φῶς
  choice: ọ dịghịkwa abịakwute ìhè
  rationale: ‘Abịakwute’ na-edobe echiche nke ịbịa nso n’ebe ìhè nọ, na-enweghị ịkọwa ihe atụ ahụ n’ụzọ ga-emechi ọtụtụ nghọta ya.
- source_word: ἵνα μὴ
  choice: ka a ghara
  rationale: Nke a na-egosipụta ebumnuche na-adịghị mma, ya bụ izere ihe ga-eme.
- source_word: ἐλεγχθῇ
  choice: ikpughe
  rationale: N’ihe atụ nke ìhè, ‘ikpughe’ na-egosi ime ka omume zoro ezo pụta ìhè, ma na-ahapụkwa ohere maka echiche nke igosi mmejọ ma ọ bụ ịbara mba.
- source_word: τὰ ἔργα αὐτοῦ
  choice: ọrụ ya
  rationale: ‘Ọrụ’ na-edobe njikọ okwu ἔργα n’akwụkwọ Jọn; ‘ya’ bụ nnọchiaha onye nke atọ na Igbo nke na-adịghị akọwapụta nwoke ma ọ bụ nwaanyị, ma ọ ka na-edobe singular Greek.
theological_decisions:
- issue: Nnọchiaha nwoke singular e ji anọchi anya mmadụ niile
  choice: ọrụ ya
  alternative: ọrụ ha
  rationale: Igbo ‘ya’ bụ singular ma ọ naghị egosi gender; ya mere ọ na-edobe ọnụọgụ singular nke Greek n’enweghị itinye nwoke ebe asụsụ Igbo na-adịghị achọ ya.
- issue: Nghọta ἐλεγχθῇ n’ihe gbasara ìhè
  choice: ikpughe
  alternative: ịbara mba; igosi na ha bụ ihe ọjọọ
  rationale: ‘Ikpughe’ dabara na ihe atụ nke ìhè na-eme ka ihe pụta ìhè, ma ọ naghị eme ka okwu ahụ bụrụ naanị ikpe ụlọikpe ma ọ bụ naanị ịdọ aka ná ntị.
translation_notes:
  register: Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. E debeghị ihe atụ ‘ìhè’ dịka nkọwa ọzọ. Akara nkọwa ụkwụ abụọ dị n’isiokwu ahụ; [a] so ‘ikpughe,’ [b] na-akọwa ‘ya.’
