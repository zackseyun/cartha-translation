revisions:
- from: Jọn zara, sị, “Ọ dịghị ihe ọbụla mmadụ pụrụ ịnara, ma ọ bụrụ na e sighị n’eluigwe nye ya ya.”
  to: Jọn zara, sị, “Mmadụ apụghị ịnara ọbụna otu ihe, ma ọ bụrụ na e sighị n’eluigwe nye ya.”
  rationale: The revision preserves the Greek’s narrative introduction, generic singular “person,” emphatic “not even one thing,” conditional perfect-passive gift logic, and literal “from heaven.” It also removes a redundant pronoun and uses clear contemporary Standard Igbo.
  reviewer_model: gpt-5.6-terra
