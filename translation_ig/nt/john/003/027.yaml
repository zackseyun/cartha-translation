review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the generic scope of ἄνθρωπος, the inability expressed by οὐ δύναται, the heavenly source, and the conditional passive sense. However, “ọ dịghị ihe ọbụla” does not as directly represent the emphatic οὐδὲ ἓν (“not even one thing”), and the final duplicated “ya” is ungrammatical/redundant.
  naturalness: The proposed revision is natural Standard Igbo. “Mmadụ apụghị ịnara ọbụna otu ihe” clearly and idiomatically expresses inability to receive even a single thing. “E sighị n’eluigwe nye ya” is a fitting impersonal passive construction for “unless it has been given to him from heaven.”
  terminology: “Jọn,” “mmadụ,” “ịnara,” and “eluigwe” are appropriate Standard Igbo renderings. “Eluigwe” correctly retains the source expression without replacing it interpretively with Chineke.
  issues:
  - severity: medium
    issue: The emphatic phrase οὐδὲ ἓν is not represented as explicitly as it can be.
    rationale: “Ọ dịghị ihe ọbụla” communicates a broad negation, but “ọbụna otu ihe” directly preserves the source’s emphasis that not even one thing can be received.
  - severity: medium
    issue: The phrase “nye ya ya” duplicates the indirect-object pronoun.
    rationale: The first “ya” already means “to him”; the second is unnecessary and makes the clause malformed. Removing it retains the meaning exactly.
  revised_text: Jọn zara, sị, “Mmadụ apụghị ịnara ọbụna otu ihe, ma ọ bụrụ na e sighị n’eluigwe nye ya.”
  revised_footnotes: []
