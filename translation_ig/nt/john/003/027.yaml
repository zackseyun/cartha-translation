  text: ἀπεκρίθη Ἰωάννης καὶ εἶπεν· Οὐ δύναται ἄνθρωπος λαμβάνειν ⸂οὐδὲ ἓν⸃ ἐὰν μὴ ᾖ δεδομένον αὐτῷ ἐκ τοῦ οὐρανοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/027.yaml
  text: John answered and said[a], “A man is not able to receive even one thing unless it has been given to him from heaven.”
translation:
  language: ig
  text: Jọn zara, sị, “Mmadụ apụghị ịnara ọbụna otu ihe, ma ọ bụrụ na e sighị n’eluigwe nye ya.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη Ἰωάννης καὶ εἶπεν
  choice: Jọn zara, sị
  rationale: Nke a na-edobe usoro nzaghachi na ikwu okwu dị n’asụsụ Grik, ma na-ada nke ọma n’Igbo ugbu a.
- source_word: Οὐ δύναται ἄνθρωπος λαμβάνειν οὐδὲ ἓν
  choice: Ọ dịghị ihe ọbụla mmadụ pụrụ ịnara
  rationale: “Pụrụ” na-egosipụta ikike dị na δύναται; “ọ dịghị ihe ọbụla” na-eburu nkwusi ike nke οὐδὲ ἓν. “Ịnara” ebe a pụtara ịnata ihe e nyere, ọ bụghị iji aka ike were ya.
- source_word: ἐὰν μὴ ᾖ δεδομένον αὐτῷ
  choice: ma ọ bụrụ na e sighị ... nye ya ya
  rationale: 'Usoro a na-egosipụta ọnọdụ e wezụga ya, nakwa olu nnara nke δεδομένον: onye ahụ agaghị enweta ihe ahụ ma e nyeghị ya ya.'
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: n’eluigwe
  rationale: A hapụrụ “eluigwe” dịka isi mmalite ahụ si kwuo, kama ịkọwa ya ozugbo dịka “n’aka Chineke,” ka obosara okwu Jọn wee dịgide.
theological_decisions:
- issue: Ókè okwu ahụ banyere ihe e si n’eluigwe nye mmadụ ruru
  choice: E debere okwu ahụ dịka ụkpụrụ sara mbara nke na-ekwu na mmadụ agaghị enweta ihe ọbụla ma e sighị n’eluigwe nye ya ya.
  alternative: Ịkọwa ya naanị banyere ọrụ ozi na ikike ime mmụọ, ma ọ bụ ime ka ọ bụrụ nkwupụta zuru ezu nke na-agọnahụ ọrụ mmadụ.
  rationale: Ihe gbara amaokwu ahụ gburugburu metụtara ọrụ Jọn na ịdị ukwuu Jizọs, ma okwu Grik ahụ sara mbara. Nsụgharị ahụ anaghị emechi obosara ahụ ma ọ bụ tinye ozizi otu ụka n’ime ya.
translation_notes:
  register: Standard Igbo dị ugbu a, dị nsọ ma dị mfe nghọta. A họọrọ “mmadụ” maka ἄνθρωπος n’ihi na ọ bụ okwu Igbo nkịtị na-anọchi mmadụ n’ozuzu, nwoke ma ọ bụ nwanyị; ya mere, a chọghị nkọwa ala peeji gbasara okike.
