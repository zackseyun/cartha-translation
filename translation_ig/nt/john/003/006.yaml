base_translation:
  language: en
  yaml_path: translation/nt/john/003/006.yaml
  text: What is born of the flesh is flesh[b][a], and what is born of the Spirit is spirit.
translation:
  language: ig
  text: Ihe a mụrụ site n’anụ ahụ bụ anụ ahụ[a], ihe a mụrụ site na Mmụọ bụkwa mmụọ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “Ihe a mụrụ site n’anụ ahụ bụ ọdịdị mmadụ.” Okwu Grik a sụgharịrị “anụ ahụ” nwere ike, n’ọnọdụ ụfọdụ, ịpụta ọdịdị mmadụ dara ada ma ọ bụ nke mmehie; ma n’ebe a, ntụnyere bụ isi dị n’etiti ihe a mụrụ site n’anụ ahụ na ihe a mụrụ site na Mmụọ.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, “ihe a mụrụ site na Mmụọ bụ nke mmụọ.” N’asụsụ Grik, okwu ahụ bụ “bụ mmụọ,” nke na-echekwa ọdịiche n’àgwà dị n’etiti “anụ ahụ” na “mmụọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ γεγεννημένον
  choice: Ihe a mụrụ
  rationale: Nkebi a na-ekwu n’ozuzu banyere ihe ọ bụla a mụrụ, ọ bụghị banyere otu onye kpọmkwem. “Ihe a mụrụ” bụ Igbo doro anya nke na-echekwa ụdị okwu izugbe ahụ.
- source_word: ἐκ
  choice: site na
  rationale: N’ebe a, okwu ahụ na-egosi ebe ọmụmụ si malite; “site na” na-egosipụta isi mmalite ahụ nke ọma n’Igbo.
- source_word: σάρξ / σαρκὸς
  choice: anụ ahụ
  rationale: “Anụ ahụ” na-echekwa ihe oyiyi okwu Grik ma na-egosi ọmụmụ mmadụ nke okike. A zere “ọdịdị mmehie” n’ahịrị bụ isi ka a ghara itinye nkọwa gbasara mmehie nke okwu gbara ya gburugburu na-adịghị ekwu hoo haa.
- source_word: πνεύματος / πνεῦμά
  choice: Mmụọ / mmụọ
  rationale: “Mmụọ” nke mbụ na-ezo aka na Mmụọ Chineke dị ka isi iyi ọmụmụ ahụ, ebe “mmụọ” nke abụọ na-akọwa ụdị ma ọ bụ ọdịdị nke ihe a mụrụ. Mgbanwe mkpụrụedemede ukwu na nke nta na-echekwa ọdịiche ahụ.
- source_word: ἐστιν
  choice: bụ
  rationale: E debere ngwaa njikọ dị mfe iji chekwaa usoro okwu dị nkenke na nke na-akọwa ihe ihe bụ.
theological_decisions:
- issue: Ihe σάρξ pụtara n’ahịrị nke mbụ
  choice: “anụ ahụ” dị ka ndụ mmadụ sitere n’ọmụmụ nkịtị
  alternative: “ọdịdị mmadụ” ma ọ bụ “ọdịdị mmehie”
  rationale: Isi ntụnyere ebe a bụ ọmụmụ sitere n’anụ ahụ na ọmụmụ sitere na Mmụọ. “Anụ ahụ” na-echekwa esemokwu okwu ahụ n’etinyeghị echiche na ọ pụtara kpọmkwem ọdịdị mmehie.
- issue: Ihe πνεῦμα nke abụọ na-ezo aka na ya
  choice: “mmụọ” n’ime “bụkwa mmụọ”
  alternative: “bụ Mmụọ” ma ọ bụ “bụ nke mmụọ”
  rationale: Aha ahụ na-enweghị njirimara n’ọnọdụ a nwere ike ịkọwa àgwà ma ọ bụ ọdịdị nke ihe a mụrụ. “Mmụọ” nke mkpụrụedemede nta na-echekwa usoro aha Grik na ọdịiche dị n’etiti Mmụọ dị ka isi iyi na mmụọ dị ka ihe e ji mara ihe a mụrụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu abụọ ahụ yiri ibe ha n’usoro iji gosipụta ntụnyere siri ike dị na Grik. E jighị “Mmụọ Nsọ” n’ahịrị bụ isi n’ihi na isi mmalite kwuru naanị πνεῦμα, ọ bụ ezie na mkpụrụedemede ukwu na-egosi na nke mbụ na-ezo aka na Mmụọ Chineke.
