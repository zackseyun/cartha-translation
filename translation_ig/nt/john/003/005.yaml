id: JHN.3.5
reference: John 3:5
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸀ἀπεκρίθη Ἰησοῦς· Ἀμὴν ἀμὴν λέγω σοι, ἐὰν μή τις γεννηθῇ ἐξ ὕδατος καὶ πνεύματος, οὐ δύναται εἰσελθεῖν εἰς τὴν βασιλείαν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/005.yaml
  text: Jesus answered[a], “Truly, truly, I say to you, unless someone is born of water and the Spirit[b], he is not able to enter the kingdom of God.”
translation:
  language: ig
  text: 'Jizọs zara, “N’ezie, n’ezie, ana m agwa gị: ọ bụrụ na a mụghị mmadụ site na mmiri na Mmụọ[a][b], ọ pụghị ịbanye n’alaeze Chineke.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “mmiri na mmụọ.” E nwere ike ịghọta okwu Grik a dị ka “mmụọ,” ọ bụ ezie na “Mmụọ,” ya bụ Mmụọ Nsọ, yiri ka ọ bụ ya ka a na-ekwu n’ebe a.
    reason: alternative_reading
  - marker: b
    text: 'A kọwawo “mmiri na Mmụọ” n’ụzọ dị iche iche: dị ka ihe oyiyi nke ịsacha na ime ka mmadụ dị ọhụrụ; dị ka ọmụmụ anụ ahụ na ọmụmụ ime mmụọ; ma ọ bụ dị ka ihe na-ezo aka na baptizim. Nsụgharị a debere usoro okwu Grik ahụ n’enweghị ikpebi ajụjụ nkọwa a n’ahịrị isi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: zara
  rationale: Ọ bụ okwu Igbo a na-ejikarị egosi na mmadụ nyere nzaghachi n’ime mkparịta ụka.
- source_word: Ἀμὴν ἀμὴν
  choice: N’ezie, n’ezie
  rationale: Ọ na-edobe nkwughachi ahụ nke na-emesi okwu Jizọs ike, ma bụrụkwa Igbo doro anya nke ndị mmadụ na-asụ ugbu a.
- source_word: λέγω σοι
  choice: ana m agwa gị
  rationale: Ọ na-egosipụta okwu a na-ekwu ozugbo nye otu onye ma na-edobe ịdị arọ nke nkwupụta ahụ.
- source_word: ἐὰν μή τις
  choice: ọ bụrụ na a mụghị mmadụ
  rationale: Usoro a na-egosipụta ọnọdụ na-adịghị ekwe omume ma jiri “mmadụ” chekwaa nghọta izugbe nke τις n’enweghị ịkpọ naanị nwoke aha.
- source_word: γεννηθῇ
  choice: a mụghị
  rationale: Ọ na-edobe ụdị nnara-eme nke okwu Grik ahụ; e tinyeghị “ọzọ” ma ọ bụ “site n’elu” n’ihi na ἄνωθεν adịghị n’amaokwu a.
- source_word: ἐξ ὕδατος
  choice: site na mmiri
  rationale: “Site na” na-egosipụta isi mmalite nke ἐξ n’ụzọ na-ada nke ọma n’Igbo.
- source_word: καὶ πνεύματος
  choice: na Mmụọ
  rationale: Mkpụrụedemede ukwu na-egosi na o yikarịrị ka ihe a na-ekwu bụ Mmụọ Nsọ, ebe ederede Grik n’onwe ya enweghị ọdịiche mkpụrụedemede ukwu na nta; nkọwa ala na-echekwa ụzọ ọgụgụ ọzọ.
- source_word: οὐ δύναται
  choice: ọ pụghị
  rationale: Ọ bụ Igbo dị nkenke ma kwekọọ kpọmkwem n’echiche enweghị ike nke δύναμαι.
- source_word: εἰσελθεῖν
  choice: ịbanye
  rationale: Ọ bụ okwu Igbo nkịtị na nke ziri ezi maka ịbanye n’ime ihe.
- source_word: βασιλείαν τοῦ θεοῦ
  choice: alaeze Chineke
  rationale: Ọ bụ nsụgharị Igbo a maara nke ọma, nke na-ahapụ ma echiche ọchịchị Chineke ma echiche ebe ọchịchị ya dị n’enweghị ịkpa ókè n’etiti ha.
theological_decisions:
- issue: Ihe πνεύματος pụtara n’okwu ἐξ ὕδατος καὶ πνεύματος
  choice: Mmụọ, ya bụ Mmụọ Nsọ
  alternative: mmụọ, nke pụrụ izo aka n’ụkpụrụ ime mmụọ ma ọ bụ mmụọ mmadụ
  rationale: Ọnọdụ okwu n’akwụkwọ Jọn na ndabere Akwụkwọ Nsọ na-akwado Mmụọ Nsọ dị ka ihe a na-ekwu; ma n’ihi na Grik enweghị mkpụrụokwu njirimara n’ebe a, e debere ụzọ ọgụgụ ọzọ na nkọwa ala.
- issue: Ihe “mmiri na Mmụọ” na-ezo aka na ya
  choice: E debere okwu Grik ahụ n’enweghị ịkọwa otu nkọwa kpọmkwem n’ahịrị isi
  alternative: Ihe oyiyi nke ịsacha na ime ka mmadụ dị ọhụrụ; ọmụmụ anụ ahụ na ọmụmụ ime mmụọ; ma ọ bụ baptizim
  rationale: Ederede ahụ n’onwe ya anaghị akọwa okwu a n’ụzọ ga-eme ka otu n’ime nkọwa ndị a bụrụ naanị nke a ga-ekwe; ya mere nsụgharị ahụ anaghị ebubata nkwenkwe pụrụ iche nke otu ụka.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma doo ndị nkịtị anya. “N’ezie, n’ezie” na-edobe nkwughachi siri ike; “ana m agwa gị” na-edobe okwu Jizọs nke a gwara otu onye. E zere okwu ụka pụrụ iche n’ahịrị isi.
