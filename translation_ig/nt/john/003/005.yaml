  source_fidelity: 'Nsụgharị ahụ na-esochi SBLGNT nke ọma: «zara» na-anọchi ἀπεκρίθη; «N’ezie, n’ezie» na-edobe nkwughachi Ἀμὴν ἀμὴν; «ọ bụrụ na a mụghị mmadụ» na-egosipụta ọnọdụ ἐὰν μή na ụdị nnara-eme nke γεννηθῇ; «site na mmiri na Mmụọ» na-echekwa njikọta ἐξ ... καὶ ...; «ọ pụghị ịbanye» na-anọchi οὐ δύναται εἰσελθεῖν. E tinyeghị «ọzọ» ma ọ bụ «site n’elu,» nke na-adịghị n’amaokwu a.'
  naturalness: Standard Igbo ahụ dị ire ụtọ, doo anya, ma dabara n’usoro okwu Akwụkwọ Nsọ nke oge a. «Ana m agwa gị» na «alaeze Chineke» bụ okwu nkịtị ma dị ùgwù. «A mụghị mmadụ» na-arụ ọrụ nke ọma dịka nkwupụta izugbe na-enweghị ikwu naanị nwoke.
  terminology: «Mmụọ» bụ nhọrọ nwere ezi ihe ndabere n’ọnọdụ Jọn, ebe nkọwa ala a na-edobe ohere nke ọgụgụ «mmụọ.» «Mmiri na Mmụọ» anaghị ekpebi ma ọ bụ baptism, ọmụmụ anụ ahụ na nke ime mmụọ, ma ọ bụ onyinyo nke ịsacha na ime ka mmadụ dị ọhụrụ. «Alaeze Chineke» bụ okwu Igbo e guzobere nke na-ekwekọ na βασιλείαν τοῦ θεοῦ.
