source:
  edition: SBLGNT
  text: ἦν δὲ καὶ ⸀ὁ Ἰωάννης βαπτίζων ἐν Αἰνὼν ἐγγὺς τοῦ Σαλείμ, ὅτι ὕδατα πολλὰ ἦν ἐκεῖ, καὶ παρεγίνοντο καὶ ἐβαπτίζοντο·
base_translation:
  language: en
  yaml_path: translation/nt/john/003/023.yaml
  text: John also was baptizing at Aenon near Salim[a], because there were many waters there[b], and people were coming and being baptized.
translation:
  language: ig
  text: Jọn nọkwa na-eme baptizim n’Aịnọn, nke dị nso na Salim, n’ihi na mmiri dị ukwuu n’ebe ahụ.[a] Ndị mmadụ na-abịakwa, a na-emekwa ha baptizim.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’ụzọ nkịtị, “ọtụtụ mmiri dị n’ebe ahụ.”
    reason: lexical_alternative
  - marker: b
    text: Okwu Grik a sụgharịrị “ime baptizim” pụkwara ịpụta “imikpu n’ime mmiri.” A hapụrụ “baptizim” dịka okwu a maara nke ọma; okwu ahụ n’onwe ya anaghị ekpebi usoro e si eme baptizim.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν δὲ καὶ ὁ Ἰωάννης βαπτίζων
  choice: Jọn nọkwa na-eme baptizim
  rationale: Ngwakọta ἦν na participle βαπτίζων na-egosi omume na-aga n’ihu n’oge gara aga; “nọkwa na-eme” na-egosikwa καί nke pụtara na Jọn sokwa na-eme ya. A hapụrụ δέ dị ka njikọ dị nro nke usoro okwu Igbo adịghị achọ ka e kwuo iche n’ebe a.
- source_word: ἐν Αἰνὼν ἐγγὺς τοῦ Σαλείμ
  choice: n’Aịnọn, nke dị nso na Salim
  rationale: E depụtara aha ebe ndị ahụ dịka ụda ha si dị, ma jiri usoro okwu Igbo doro anya gosi na Aịnọn dị nso na Salim.
- source_word: ὅτι ὕδατα πολλὰ ἦν ἐκεῖ
  choice: n’ihi na mmiri dị ukwuu n’ebe ahụ
  rationale: ὅτι bụ ihe na-egosi ihe kpatara ya. Ọ bụ ezie na Grik kwuru n’ụzọ nkịtị “mmiri ọtụtụ,” “mmiri dị ukwuu” bụ Igbo ebumpụta ụwa nke na-edebe echiche nke mmiri bara ụba n’ebe ahụ.
- source_word: παρεγίνοντο
  choice: Ndị mmadụ na-abịakwa
  rationale: Imperfect a na-egosi na ndị mmadụ nọgidere na-abịa. E tinyere “ndị mmadụ” dịka isiokwu pụtara ìhè nke Igbo chọrọ n’ahịrịokwu a.
- source_word: ἐβαπτίζοντο
  choice: a na-emekwa ha baptizim
  rationale: Imperfect passive na-egosi na a nọgidere na-eme ndị bịara baptizim; nhazi a na-edebe onye na-anata omume ahụ n’enweghị ịkpọ onye na-eme ya aha.
theological_decisions:
- issue: Nsụgharị βαπτίζω
  choice: ime baptizim
  alternative: imikpu n’ime mmiri
  rationale: “Baptizim” bụ okwu okpukpe a maara nke ọma n’Igbo, ọ naghịkwa ekpebi n’onwe ya kpọmkwem usoro e si eme ya. E debere “imikpu n’ime mmiri” n’okpuru peeji dịka ihe okwu Grik ahụ nwekwara ike ịpụta, ka nsụgharị ghara ịkwado ozizi otu ụka n’ụzọ na-enweghị isi.
- issue: Ọtụtụ ὕδατα
  choice: mmiri dị ukwuu
  alternative: ọtụtụ mmiri
  rationale: A họọrọ okwu Igbo na-asụkarị nke na-egosi mmiri bara ụba, ebe nkọwa n’okpuru peeji na-echekwa ụdị ọtụtụ nke okwu Grik.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji “nọkwa na-eme” gosipụta omume gara aga nke na-aga n’ihu, ma zere okwu ma ọ bụ nkọwa nke otu ụka pụrụ iche.
