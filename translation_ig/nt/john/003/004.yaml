revisions:
- from: Nikọdimọs sịrị ya, “Olee otú mmadụ pụrụ isi mụọ mgbe o meela agadi? Ọ pụghị ịbanye n’afọ nne ya nke ugboro abụọ ka a mụọ ya, ọ̀ pụrụ?”
  to: Nikọdimọs sịrị ya, “Olee otú a pụrụ isi mụọ mmadụ mgbe o meela agadi? Ọ pụghị ịbanye n’afọ nne ya ugboro nke abụọ ma a mụọ ya, ọ̀ pụrụ?”
  rationale: The revision is limited to clarifying the passive force of γεννηθῆναι and to making the final paired infinitives more closely coordinated. It preserves the generic reference of ἄνθρωπος, the literal “second time,” and the incredulous negative question.
