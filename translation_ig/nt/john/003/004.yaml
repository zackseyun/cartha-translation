reference: John 3:4
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: λέγει πρὸς αὐτὸν ⸀ὁ Νικόδημος· Πῶς δύναται ἄνθρωπος γεννηθῆναι γέρων ὤν; μὴ δύναται εἰς τὴν κοιλίαν τῆς μητρὸς αὐτοῦ δεύτερον εἰσελθεῖν καὶ γεννηθῆναι;
base_translation:
  language: en
  yaml_path: translation/nt/john/003/004.yaml
  text: Nicodemus said to him[a], “How can a man be born when he is old? He cannot enter his mother’s womb a second time and be born[b], can he?”
translation:
  language: ig
  text: Nikọdimọs sịrị ya, “Olee otú a pụrụ isi mụọ mmadụ mgbe o meela agadi? Ọ pụghị ịbanye n’afọ nne ya ugboro nke abụọ ma a mụọ ya, ọ̀ pụrụ?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει πρὸς αὐτὸν
  choice: sịrị ya
  rationale: Ọ bụ ezie na λέγει dị n’oge ugbu a, Jọn na-ejikarị oge ugbu a akọ ihe gara aga. “Sịrị ya” bụ ụzọ Igbo si akọ akụkọ n’ụzọ eke.
- source_word: Νικόδημος
  choice: Nikọdimọs
  rationale: E degharịrị aha Grik ahụ n’ụdị dabara n’usoro mkpọpụta na odide Igbo.
- source_word: Πῶς δύναται
  choice: Olee otú ... pụrụ isi
  rationale: Nke a bụ ajụjụ banyere ma ihe ọ̀ ga-ekwe omume; okwu Igbo a na-enye echiche δύναται n’ụzọ doro anya ma dịkwa eke.
- source_word: ἄνθρωπος
  choice: mmadụ
  rationale: N’ebe a, ἄνθρωπος bụ otu onye e ji anọchi anya mmadụ n’ozuzu. “Mmadụ” na-echekwa nghọta izugbe ahụ n’Igbo, ebe ịsị “nwoke” pụrụ ime ka a ghọta ya dị ka naanị nwoke.
- source_word: γεννηθῆναι
  choice: mụọ / a mụọ ya
  rationale: N’ebe a γεννάω na-ekwu maka ịmụ nwa. Nhazi Igbo na-eji “mụọ” n’ajụjụ mbụ, ma jiri “a mụọ ya” mee ka ihe onye ahụ na-anata pụta ìhè na nkebi ikpeazụ.
- source_word: γέρων ὤν
  choice: mgbe o meela agadi
  rationale: A sụgharịrị participle ahụ dị ka nkebi oge, nke na-ada eke ma na-egosi na onye ahụ abụrụla agadi.
- source_word: μὴ δύναται
  choice: Ọ pụghị ... ọ̀ pụrụ?
  rationale: μή na-egosi ajụjụ a na-atụ anya azịza mba. Ajụjụ nkwado Igbo a na-echekwa ekweghị-ekwe Nikọdimọs gosipụtara.
- source_word: κοιλίαν
  choice: afọ nne ya
  rationale: Mgbe okwu a jikọrọ ya na “nne,” ọ na-ezo aka n’ebe nwa nọ n’afọ nne. “Afọ nne” bụ okwu Igbo nkịtị ma doo anya n’ọnọdụ a.
- source_word: δεύτερον
  choice: nke ugboro abụọ
  rationale: Okwu a pụtara kpọmkwem “ugboro abụọ,” ma na-eme ka nghọta nkịtị Nikọdimọs nwere pụta ìhè karịa naanị “ọzọ.”
- source_word: εἰσελθεῖν καὶ γεννηθῆναι
  choice: ịbanye ... ka a mụọ ya
  rationale: E debere omume abụọ ahụ iche—ịbanye na ịmụ—iji chekwaa usoro na nkọwa doro anya nke ajụjụ Nikọdimọs.
theological_decisions:
- issue: Otu esi sụgharịa ἄνθρωπος nke bụ masculine singular ma nwee nghọta izugbe
  choice: mmadụ
  alternative: nwoke
  rationale: Asụsụ Igbo anaghị achọ ka a jiri okwu nwoke mee ihe mgbe a na-ekwu maka mmadụ n’ozuzu. “Mmadụ” na-echekwa force izugbe nke Grik ahụ, ọ naghịkwa eme ka okwu ahụ bụrụ naanị maka ndị nwoke.
- issue: Ma a ga-etinye echiche “ịmụ ọzọ” sitere na Jọn 3:3 n’ime γεννηθῆναι ebe a
  choice: mụọ ... nke ugboro abụọ
  alternative: mụọ ọzọ
  rationale: Amaokwu a nwere δεύτερον, “nke ugboro abụọ,” nke na-egosi nghọta nkịtị Nikọdimọs nyere okwu Jizọs. Nhọrọ a anaghị ebubata ma ọ bụ kpebie nghọta ἄνωθεν dị n’amaokwu bu ụzọ.
translation_notes:
  register: Asụsụ ahụ bụ Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E ji “pụrụ isi” na ajụjụ nkwado “ọ̀ pụrụ?” mee ka okwu ahụ daa eke, ebe e chekwara ajụjụ na-atụ anya azịza mba na nghọta nkịtị Nikọdimọs.
