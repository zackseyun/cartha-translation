    text: A pụkwara ịghọta ya dịka, “n’ihi na onye Chineke zitere na-enye Mmụọ Nsọ n’enweghị oke.”
    reason: alternative_reading
  revision_rationale: The revision changes only the rendering of τὸ πνεῦμα from “Mmụọ ahụ” to the established Standard Igbo term “Mmụọ Nsọ,” preserving the contextual reference intended by the source and the English audit trail. It retains the explicit-God reading for the implicit subject of “na-enye” and preserves the alternative reading in the anchored footnote.
