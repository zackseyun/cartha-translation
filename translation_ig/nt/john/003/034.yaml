  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὃν γὰρ ἀπέστειλεν ὁ θεὸς τὰ ῥήματα τοῦ θεοῦ λαλεῖ, οὐ γὰρ ἐκ μέτρου ⸀δίδωσιν τὸ πνεῦμα.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/034.yaml
  text: For the one whom God sent speaks the words of God[a], for he gives the Spirit without measure.
translation:
  language: ig
  text: N’ihi na onye Chineke zitere na-ekwu okwu Chineke, n’ihi na Chineke na-enye Mmụọ Nsọ n’enweghị oke.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịghọta ya dịka, “n’ihi na onye Chineke zitere na-enye Mmụọ Nsọ n’enweghị oke.”
    reason: alternative_reading
lexical_decisions:
- source_word: ὃν
  choice: onye
  rationale: “Onye” na-arụ ọrụ dị ka nnọchiaha e ji akọwa mmadụ a na-ekwu banyere ya, ma na-ejikọta ya nke ọma na nkebiokwu “Chineke zitere.”
- source_word: ἀπέστειλεν
  choice: zitere
  rationale: Okwu a na-egosi iziga mmadụ; oge gara aga dị mfe dabara n’ụdị aorist na asụsụ Jọn banyere iziga Onye ahụ.
- source_word: τὰ ῥήματα τοῦ θεοῦ
  choice: okwu Chineke
  rationale: “Okwu Chineke” bụ ụzọ Igbo e ji ekwu okwu ma ọ bụ ihe Chineke kwuru; ọ na-edobe njikọ onye nwe okwu ahụ n’enweghị ime ka ahịrịokwu sie ike.
- source_word: λαλεῖ
  choice: na-ekwu
  rationale: Ụdị “na-ekwu” na-egosi omume ikwu okwu na-aga n’ihu, dịka present λαλεῖ si arụ ọrụ n’ebe a.
- source_word: ἐκ μέτρου
  choice: n’enweghị oke
  rationale: N’okpuru ngọnarị, akpaalaokwu a pụtara na enyeghị ihe n’ụzọ a tụrụ ma ọ bụ kpachiri ókè. “N’enweghị oke” bụ Igbo doro anya ma na-edobe echiche nke enweghị mmachi.
- source_word: δίδωσιν
  choice: na-enye
  rationale: “Na-enye” bụ ntụgharị kwụ ọtọ nke present δίδωσιν ma dabara n’okwu na-akọ eziokwu na-adịgide.
- source_word: τὸ πνεῦμα
  choice: Mmụọ ahụ
  rationale: N’ọnọdụ okwu Jọn a, ọ na-ezo aka na Mmụọ Nsọ. “Mmụọ ahụ” na-edobe definite article ahụ ma na-egosi onye a maara nke a na-ekwu banyere ya.
theological_decisions:
- issue: Onye bụ isiokwu zoro ezo nke δίδωσιν (“na-enye”)
  choice: 'E mere ka Chineke bụrụ onye na-enye Mmụọ ahụ: “Chineke na-enye Mmụọ ahụ n’enweghị oke.”'
  alternative: Onye Chineke zitere, ya bụ Ọkpara ahụ, bụ onye na-enye Mmụọ ahụ n’enweghị oke.
  rationale: N’agbanyeghị na isiokwu nke δίδωσιν apụtaghị kpọmkwem n’asụsụ Grik, “Chineke” bụ isiokwu a kpọrọ aha n’usoro okwu ahụ, nghọta a na-akọwakwa ihe mere Onye ahụ e zitere ji ekwu okwu Chineke. Ma ebe Grik kwekwara ka a ghọta Onye ahụ e zitere dị ka onye na-enye Mmụọ ahụ, e debere nghọta nke ọzọ n’ala ala peeji.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ugwu ma dị mfe nghọta. Ahịrịokwu ahụ na-edobe usoro ihe kpatara ihe ugboro abụọ nke γάρ site n’iji “n’ihi na,” ma zere okwu ụka pụrụ iche na-adịghị na isi mmalite.
