  text: καὶ οὐδεὶς ἀναβέβηκεν εἰς τὸν οὐρανὸν εἰ μὴ ὁ ἐκ τοῦ οὐρανοῦ καταβάς, ὁ υἱὸς τοῦ ⸀ἀνθρώπου.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/013.yaml
  text: And no one has ascended into heaven except the one who descended from heaven—the Son of Man[a][b].
translation:
  language: ig
  text: Ọ dịghịkwa onye rịgorola n’eluigwe ma e wezụga onye ahụ rịdatara site n’eluigwe—Nwa nke Mmadụ.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “onye ahụ si n’eluigwe bịa.”
    reason: lexical_alternative
  - marker: b
    text: “Nwa nke Mmadụ” bụ aha Jizọs na-ejikarị akpọ onwe ya n’Oziọma; ọ na-echetakwa Daniel 7:13–14.
    reason: cross_reference
lexical_decisions:
- source_word: οὐδεὶς
  choice: ọ dịghị onye ọ bụla
  rationale: Nke a bụ ụzọ Igbo doro anya ma bụrụkwa nke e ji emesi ike ikwu ‘ọ dịghị onye,’ n’enweghị ime ka ọ bụrụ naanị nwoke.
- source_word: ἀναβέβηκεν
  choice: rigooro
  rationale: Ụdị ngwaa a na-egosi omume mezuru nke ka nwere mkpa ugbu a; ‘rigooro’ na-egosipụta nke ahụ ma debe ntụnyere dị n’etiti ịrịgo na ịrịdata.
- source_word: εἰς τὸν οὐρανόν
  choice: n’eluigwe
  rationale: N’Igbo nkịtị, ‘ịrịgo n’eluigwe’ na-egosi ije banye n’eluigwe n’ụzọ eke karịa ntụgharị siri ike nke preposition Grik.
- source_word: εἰ μὴ
  choice: ma e wezụga
  rationale: Nke a na-egosi n'ụzọ doro anya na e nwere naanị otu onye a napụrụ n’okwu ahụ gara aga.
- source_word: ὁ ἐκ τοῦ οὐρανοῦ καταβάς
  choice: onye ahụ si n’eluigwe rịdata
  rationale: Nke a na-edebe ahịrịokwu participle ahụ dịka aha onye, na-echekwa ma mmalite ya n’eluigwe ma ntụnyere ‘rịgo/rịdata.’
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Nwa nke Mmadụ
  rationale: Nke a na-echekwa aha Jizọs ji akpọ onwe ya na njikọ ya na Daniel 7, kama ịkọwa ya naanị dịka mmadụ nkịtị.
theological_decisions:
- issue: Ihe aha ‘Nwa nke Mmadụ’ pụtara banyere Kraịst
  choice: E debere ya dịka aha pụrụ iche ‘Nwa nke Mmadụ.’
  alternative: Onye ahụ bụ mmadụ
  rationale: Nke a na-echekwa ma ọdịdị akpaalaokwu ahụ ma ụda amụma/apọkaliptik ya, n’enweghị idozi esemokwu ihe ọ pụtara site n’ịkọwa ya karịa ihe odide Grik.
- issue: Mmetụta oge na aspect dị n’okwu ịrịgo na ịrịdata
  choice: ‘rigooro ... rịdata’
  alternative: ‘gara n’elu ... si n’eluigwe bịa’
  rationale: Nhọrọ a na-echekwa nkwupụta banyere mmalite ya n’eluigwe na ohere pụrụ iche o nwere, ma na-ezere itinye nkọwa ozizi na-adịghị n’ihe odide ahụ.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji ‘rịgo/rịdata’ chekwaa ntụnyere dị n’asụsụ Grik; e jighị okwu ụka pụrụ iche ma ọ bụ nkọwa nke otu ụka.
