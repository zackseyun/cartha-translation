revisions:
- from: Ọ dịghịkwa onye ọ bụla rigooro n’eluigwe ma e wezụga onye ahụ si n’eluigwe rịdata—Nwa nke Mmadụ.[a][b]
  to: Ọ dịghịkwa onye rịgorola n’eluigwe ma e wezụga onye ahụ rịdatara site n’eluigwe—Nwa nke Mmadụ.[a][b]
  rationale: Ndezigharị a na-eme ka aspect nke ngwaa abụọ ahụ doo anya, na-eme ka ahịrịokwu ahụ bụrụ Standard Igbo eke, ma na-edobe usoro, mwepu, na nkwupụta Kraịstoloji nke Grik n’enweghị mgbakwunye nkọwa ozizi. E jighị ọdịiche ederede ọzọ «onye nọ n’eluigwe» n’ihi na ọ nọghị na SBLGNT e nyere.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T05:37:55Z'
review_pass:
  verdict: revise
  source_fidelity: A na-echekwa nkwupụta mwepu ahụ, ntụnyere ịrịgo na ịrịdata, na aha pụrụ iche «Nwa nke Mmadụ». Otú ọ dị, «rigooro» anaghị egosi nke ọma perfect ἀναβέβηκεν, ebe «rịdata» dị ka ọ dị n’ederede ahụ enweghị akara omume mezuru maka καταβάς. «rịgorola» na «rịdatara» na-egosi ihe Grik ahụ nke ọma karịa.
  naturalness: «Ọ dịghịkwa onye ọ bụla» nwere nkwughachi na-adịghị mkpa na Standard Igbo. «Ọ dịghịkwa onye rịgorola n’eluigwe» dị nkenke, dị eke, ma na-edobe emfasis nke negeshọn ahụ.
  terminology: «Nwa nke Mmadụ» kwesịrị ịdịgide, ebe ọ bụ aha a ma ama n’Oziọma ma na-edobe njikọ Daniel. E degharịrị nkọwa ala peeji ka ọ ghara ikwu n’ụzọ siri ike na aha ahụ bụ naanị aha Jizọs, kama ka ọ kọwaa ojiji ya n’Oziọma.
  issues:
  - severity: medium
    issue: Ngwaa «rigooro» anaghị edobe perfect ἀναβέβηκεν nke ọma.
    rationale: «rịgorola» na-egosi omume mezuru nke nwere mmetụta ruo ugbu a karịa.
  - severity: medium
    issue: «onye ahụ si n’eluigwe rịdata» adịghị akara participle aorist καταβάς dịka omume mezuru.
    rationale: «onye ahụ rịdatara site n’eluigwe» na-enye omume ịrịdata mezuru ma na-edobe «from heaven».
  - severity: low
    issue: «onye ọ bụla» sochiri «Ọ dịghị» bụ nkwughachi na-adịghị mkpa.
    rationale: «Ọ dịghị onye» bụ ụzọ Standard Igbo eke ma zuru ezu iji sụgharịa οὐδείς.
  revised_text: Ọ dịghịkwa onye rịgorola n’eluigwe ma e wezụga onye ahụ rịdatara site n’eluigwe—Nwa nke Mmadụ.[a][b]
