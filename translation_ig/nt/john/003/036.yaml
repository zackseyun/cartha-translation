id: JHN.3.36
reference: John 3:36
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ πιστεύων εἰς τὸν υἱὸν ἔχει ζωὴν αἰώνιον· ὁ δὲ ἀπειθῶν τῷ υἱῷ οὐκ ὄψεται ζωήν, ἀλλ’ ἡ ὀργὴ τοῦ θεοῦ μένει ἐπ’ αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/036.yaml
  text: The one who believes in the Son has eternal life; but the one who disobeys the Son will not see life, but the wrath of God remains on him.
translation:
  language: ig
  text: Onye kwere n’Ọkpara ahụ nwere ndụ ebighị ebi; ma onye na-enupụrụ Ọkpara ahụ isi[a] agaghị ahụ ndụ, kama iwe Chineke na-adịgide n’ahụ ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “onye na-ajụ ikwere n’Ọkpara ahụ.” Ngwaa Grik a nwere ike ịpụta ịjụ ikwere nakwa inupụ isi.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ πιστεύων εἰς τὸν υἱόν
  choice: Onye kwere n’Ọkpara ahụ
  rationale: A sụgharịrị nkebi participle a dị ka okwu na-ezo aka n’onye ọ bụla; “kwere n’Ọkpara” na-egosi ntụkwasị obi a tụkwasịrị Ọkpara ahụ.
- source_word: ἔχει ζωὴν αἰώνιον
  choice: nwere ndụ ebighị ebi
  rationale: “Nwere” na-echekwa present indicative, ya bụ na ndụ ahụ bụ ihe onye ahụ nwere ugbu a, ọ bụghị naanị olileanya ọdịnihu.
- source_word: ὁ δὲ ἀπειθῶν τῷ υἱῷ
  choice: ma onye na-enupụrụ Ọkpara ahụ isi
  rationale: “Na-enupụrụ ... isi” na-echekwa echiche nke nnupụisi dị na ἀπειθέω; ebe okwu ahụ nwekwara ike ịpụta ịjụ ikwere, e debere nke ahụ n’ala peeji.
- source_word: οὐκ ὄψεται ζωήν
  choice: agaghị ahụ ndụ
  rationale: Nke a na-echekwa ihe oyiyi Jọn ji kwuo okwu, “ịhụ ndụ,” kama ime ka ọ bụrụ naanị “inwe ndụ.”
- source_word: ἡ ὀργὴ τοῦ θεοῦ
  choice: iwe Chineke
  rationale: “Iwe Chineke” bụ ntụgharị doro anya nke genitive ahụ, na-enweghị ime ka okwu ikpe Chineke dị nro.
- source_word: μένει ἐπ’ αὐτόν
  choice: na-adịgide n’ahụ ya
  rationale: “Na-adịgide” na-egosipụta ọnọdụ na-aga n’ihu nke μένει; “n’ahụ ya” bụ ụzọ Igbo si egosi ihe dịkwasịrị mmadụ.
theological_decisions:
- issue: Ihe ἀπειθῶν pụtara mgbe e jiri ya tụnyere πιστεύων
  choice: onye na-enupụrụ Ọkpara ahụ isi
  alternative: onye na-ajụ ikwere n’Ọkpara ahụ
  rationale: Isiokwu ahụ na-emegide ikwere na ἀπειθέω. A hapụrụ echiche sara mbara nke nnupụisi n’ahịrị bụ isi, ma chekwaa echiche nke ịjụ ikwere n’ala peeji, ka a ghara iwepụ mgbagwoju okwu ahụ n’ike.
- issue: Oge ndụ ebighị ebi na iwe Chineke metụtara
  choice: “nwere” na “na-adịgide” na-egosi ọnọdụ dị ugbu a
  alternative: ịkọwa ha abụọ dị ka ihe ga-eme naanị n’ọdịnihu
  rationale: ἔχει na μένει bụ present indicatives, ebe “agaghị ahụ” na-elekwa anya n’ọdịnihu. Nsụgharị ahụ chekwara njikọ na esemokwu oge abụọ ahụ.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị ugwu ma doo ndị nkịtị anya. E jigidere aha “Ọkpara ahụ” dịka utu aha Jọn ji eme ihe, na-enweghị ịgbakwunye “nke Chineke” ebe Grik etinyeghị ya.
