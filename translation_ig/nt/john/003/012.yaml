  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἰ τὰ ἐπίγεια εἶπον ὑμῖν καὶ οὐ πιστεύετε, πῶς ἐὰν εἴπω ὑμῖν τὰ ἐπουράνια πιστεύσετε;
base_translation:
  language: en
  yaml_path: translation/nt/john/003/012.yaml
  text: If I told you about earthly things and you do not believe[b][a], how will you believe if I tell you about heavenly things?
translation:
  language: ig
  text: Ọ bụrụ na m gwara unu banyere ihe ndị nke ụwa, ma unu anaghị ekwere, olee otú unu ga-esi kwere ma ọ bụrụ na m agwa unu banyere ihe ndị nke eluigwe?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὰ ἐπίγεια
  choice: ihe ndị nke ụwa
  rationale: Ọ bụ adjective neuter plural e ji mee aha. Nhọrọ a na-edobe ọdịiche ya na “ihe ndị nke eluigwe” ma ghara ịkọwa kpọmkwem ma ọ̀ bụ ihe dị n'ụwa ka ọ bụ ihe metụtara ụwa.
- source_word: εἶπον
  choice: m gwara unu
  rationale: Aorist nke λέγω tinyere ὑμῖν na-ezo aka n'ihe Jizọs gwaburu ha; “m gwara unu” bụ ụzọ Igbo si kwuo ya n'ụzọ eke.
- source_word: οὐ πιστεύετε
  choice: unu ekweghị
  rationale: Present indicative a na-egosi na ha anaghị ekwere ihe a gwara ha; n'usoro ahịrịokwu ọnọdụ Igbo, “unu ekweghị” na-ekwupụta nzaghachi ha n'ụzọ doro anya.
- source_word: πῶς ... πιστεύσετε
  choice: olee otu unu ga-esi kwere
  rationale: Nke a na-edobe ajụjụ rhetorical na future nke Grik, kama ịgbanwe ya ka ọ bụrụ ajụjụ banyere ikike ha nwere ikwere.
- source_word: ἐὰν εἴπω
  choice: ma ọ bụrụ na m agwa unu
  rationale: ἐὰν na aorist subjunctive na-egosi ọnọdụ ga-ekwe omume n'ọdịnihu; okwu Igbo a bụ nke eke ma na-edobe ọnọdụ ahụ.
- source_word: τὰ ἐπουράνια
  choice: ihe ndị nke eluigwe
  rationale: Ọ bụ adjective neuter plural e ji mee aha, ma nhọrọ a na-echekwa ọdịiche ya na “ihe ndị nke ụwa” n'enweghị ịkọwa ihe omimi ndị ahụ karịa ka ederede si kwuo.
theological_decisions:
- issue: Ihe ọdịiche dị n'etiti τὰ ἐπίγεια na τὰ ἐπουράνια pụtara
  choice: ihe ndị nke ụwa / ihe ndị nke eluigwe
  alternative: ihe ndị dị n'ụwa / ihe ndị dị n'eluigwe; ma ọ bụ ihe atụ sitere n'ụwa / ihe omimi Chineke ndị miri emi
  rationale: Ederede ahụ na-egosi ụdị mkpughe abụọ dị iche, ma ọ naghị akọwa n'ụzọ doro anya ma “ihe ndị nke ụwa” ọ̀ bụ ihe atụ nke ụwa ma ọ bụ ihe na-eme n'ụwa. Nsụgharị sara mbara na-edobe mgbagwoju anya na esemokwu nkà mmụta okpukpe dị n'okwu ahụ.
translation_notes:
  register: Asụsụ Igbo Izugbe, nke dị ugbu a, kwanyere ugwu, ma dị mfe nghọta. A họọrọ usoro “ihe ndị nke ụwa / ihe ndị nke eluigwe” iji chekwaa ntụnyere abụọ ahụ n'ụzọ kwekọrọ ekwekọ. Enweghị akara nkọwa ala peeji n'ihi na ụdị Igbo ndị ọzọ adịghị mkpa iji ghọta amaokwu ahụ.
