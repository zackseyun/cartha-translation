  to: Ọ bụrụ na m gwara unu banyere ihe ndị nke ụwa, ma unu anaghị ekwere, olee otú unu ga-esi kwere ma ọ bụrụ na m agwa unu banyere ihe ndị nke eluigwe?
  rationale: The revision changes only the negative belief clause to represent the source present tense more clearly and regularizes the idiom for “how.” It preserves the source’s deliberately broad contrast between earthly and heavenly things, its rhetorical force, and its future conditional construction.
