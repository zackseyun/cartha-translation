review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately preserves the past reference of εἶπον (“m gwara unu”), the future-oriented conditional clause, and the rhetorical future question. However, “unu ekweghị” normally reads as a completed/past negative (“you did not believe”), whereas οὐ πιστεύετε is present: “you do not believe/are not believing.”'
  naturalness: The proposed revision is natural, clear Standard Igbo. “Olee otú” is a more regular idiom for the manner-question introduced by πῶς.
  terminology: “Ihe ndị nke ụwa” and “ihe ndị nke eluigwe” faithfully retain the broad, parallel contrast of τὰ ἐπίγεια and τὰ ἐπουράνια without imposing an interpretation. No footnote is required, since the ambiguity is retained directly in the wording.
  issues:
  - severity: medium
    issue: The negative verb form “unu ekweghị” does not clearly represent the Greek present πιστεύετε.
    rationale: In this context it is most readily understood as ‘you did not believe,’ while the source contrasts Jesus’ prior speaking with their present ongoing refusal or failure to believe. “Unu anaghị ekwere” makes the present sense explicit.
  revised_text: Ọ bụrụ na m gwara unu banyere ihe ndị nke ụwa, ma unu anaghị ekwere, olee otú unu ga-esi kwere ma ọ bụrụ na m agwa unu banyere ihe ndị nke eluigwe?
