id: JHN.3.3
reference: John 3:3
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸀ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῷ· Ἀμὴν ἀμὴν λέγω σοι, ἐὰν μή τις γεννηθῇ ἄνωθεν, οὐ δύναται ἰδεῖν τὴν βασιλείαν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/003.yaml
  text: Jesus answered and said to him, “Truly, truly, I say to you, unless someone is born from above,[a] he is not able to see the kingdom of God.”
translation:
  language: ig
  text: Jizọs zara ya sị, “N’ezie, n’ezie, ana m agwa gị, ọ bụrụ na a mụghị mmadụ site n’elu,[a] ọ pụghị ịhụ alaeze Chineke.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ọzọ.” Okwu Grik a nwere ike ịpụta ma “site n’elu” ma “ọzọ”; mkparịta ụka dị n’amaokwu na-esonụ dabere na nghọta abụọ okwu ahụ nwere ike inwe.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθη ... καὶ εἶπεν αὐτῷ
  choice: zara ya sị
  rationale: Nke a bụ ụzọ Igbo si ekwu okwu n'ụzọ ebumpụta ụwa ma dịkwa nso n'usoro Grik nke pụtara na Jizọs zara ya wee gwa ya okwu.
- source_word: Ἀμὴν ἀμὴν
  choice: N’ezie, n’ezie
  rationale: Ọ na-edowe nkwughachi ahụ e ji mesie okwu ike, ma na-eme ka ihe ọ pụtara doo onye Igbo nke oge a anya.
- source_word: ἐὰν μή τις
  choice: ọ bụrụ na a mụghị mmadụ
  rationale: A haziri nkebi ahịrịokwu ahụ n'ụzọ kwekọrọ n'ụdị okwu Igbo; “mmadụ” na-egosi onye ọ bụla n'ozuzu ya n'enweghị ịkọwapụta nwoke ma ọ bụ nwanyị.
- source_word: γεννηθῇ
  choice: a mụghị
  rationale: Ụdị nnara a na-asụ n'Igbo n'ụzọ ebumpụta ụwa ma ọ naghị etinye echiche “ọzọ” n'ime ngwaa ahụ.
- source_word: ἄνωθεν
  choice: site n’elu
  rationale: Ọ na-ebute isi echiche nke ịbụ onye a mụrụ site n'elu, ebe a na-edowe ihe ọzọ okwu Grik ahụ nwekwara ike ịpụta, ya bụ “ọzọ,” n'ala peeji.
- source_word: οὐ δύναται
  choice: ọ pụghị
  rationale: Nke a na-egosi enweghị ike ahụ n'ụzọ doro anya ma bụrụkwa okwu Igbo a na-asụ nke ọma.
- source_word: ἰδεῖν
  choice: ịhụ
  rationale: Ọ bụ okwu kacha nso n'okwu Grik ahụ, na-ahapụkwa ohere maka ịhụ anya ma ọ bụ ịghọta na iketa òkè.
- source_word: βασιλείαν τοῦ θεοῦ
  choice: alaeze Chineke
  rationale: Ọ bụ okwu Igbo a maara nke ọma nke na-edowe echiche banyere ọchịchị Chineke nakwa ógbè ọchịchị ya.
theological_decisions:
- issue: Ihe ἄνωθεν pụtara n'okwu Jizọs
  choice: site n’elu
  alternative: ọzọ
  rationale: Okwu Grik ahụ nwere ike ịpụta “site n’elu” ma ọ bụ “ọzọ.” Isiokwu Jọn banyere ihe si n’elu kwadoro “site n’elu,” ebe nghọta Nikọdimọs n'amaokwu na-esonụ dabere n'echiche “ọzọ.” Ya mere, a hapụrụ nghọta abụọ ahụ ka ha dị site n'itinye nke ọzọ n'ala peeji.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta. E ji “zara ya sị” mee ka usoro okwu ahụ bụrụ nke Igbo ebumpụta ụwa, ma e chekwara nkwughachi “N’ezie, n’ezie” na mgbagwoju pụtara nke ἄνωθεν.
