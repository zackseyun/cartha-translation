id: JHN.3.17
reference: John 3:17
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οὐ γὰρ ἀπέστειλεν ὁ θεὸς τὸν ⸀υἱὸν εἰς τὸν κόσμον ἵνα κρίνῃ τὸν κόσμον, ἀλλ’ ἵνα σωθῇ ὁ κόσμος δι’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/017.yaml
  text: For God did not send the Son into the world so that he might judge the world[a], but so that the world might be saved through him.
translation:
  language: ig
  text: N’ihi na Chineke eziteghị Ọkpara ahụ n’ụwa ka o kpee ụwa ikpe[a], kama ka e wee site n’aka ya zọpụta ụwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ka o maa ụwa ikpe.” N’ọnọdụ a, a pụrụ ịtụgharị ngwaa Grik ahụ n’ụzọ a dị warara karị, ma ihe ọ pụtara n’ụzọ bụ isi bụ “ikpe ikpe.”
    reason: alternative_reading
lexical_decisions:
- source_word: οὐ γὰρ
  choice: N’ihi na ...ghị
  rationale: “N’ihi na” na-egosipụta na amaokwu a na-akọwa ihe e kwuru n’amaokwu bu ya ụzọ; njụ “-ghị” na-agọnahụ ngwaa ahụ n’ụzọ Igbo nkịtị.
- source_word: ἀπέστειλεν
  choice: eziteghị
  rationale: “Izipụ/izite” bụ ihe ἀποστέλλω pụtara n’ụzọ bụ isi; “eziteghị” bụ asụsụ Igbo doro anya ma na-edobe isiokwu Jọn banyere Chineke izite Ọkpara ahụ.
- source_word: ὁ θεὸς
  choice: Chineke
  rationale: Nke a bụ ntụgharị Igbo nkịtị nke θεός mgbe ọ na-ezo aka n’ebe Chineke nọ.
- source_word: τὸν υἱὸν
  choice: Ọkpara ahụ
  rationale: Asụsụ Grik kwuru “Ọkpara ahụ,” ọ bụghị kpọmkwem “Ọkpara ya.” “Ọkpara ahụ” na-edobe aha-ọkwa na njikọ ya na Chineke nke gbara amaokwu a gburugburu.
- source_word: εἰς τὸν κόσμον
  choice: n’ụwa
  rationale: N’Igbo, “izite mmadụ n’ụwa” na-egosipụta mmegharị ịbanye n’ime ụwa n’ụzọ ebumpụta ụwa, n’agbanyeghị na a naghị etinye okwu ọzọ pụtara “ime.”
- source_word: ἵνα κρίνῃ τὸν κόσμον
  choice: ka o kpee ụwa ikpe
  rationale: “Ikpe ... ikpe” na-edobe nghọta sara mbara nke κρίνω, ya bụ ikpe ikpe, kama ime ka ọ pụta naanị ịma ikpe; “ka” na-egosipụta ebumnuche nke ἵνα na subjunctive.
- source_word: ἀλλ’ ἵνα
  choice: kama ka
  rationale: “Kama ka” na-egosipụta ọdịiche siri ike n’etiti ebumnuche abụọ ahụ ma na-edobe usoro ahịrịokwu ndị yiri ibe ha.
- source_word: σωθῇ
  choice: zọpụta
  rationale: 'Ihe e ji “ka e ... zọpụta” mee na-egosipụta passive subjunctive: ụwa bụ ihe a na-azọpụta. “Zọpụta” na-edobe echiche sara mbara nke nzọpụta na nnapụta.'
- source_word: ὁ κόσμος
  choice: ụwa
  rationale: E ji otu okwu ahụ, “ụwa,” mee ihe ugboro abụọ iji chekwaa nkwughachi κόσμος ma ghara imechi ihe ọ pụtara ka ọ bụrụ naanị otu ìgwè mmadụ.
- source_word: δι’ αὐτοῦ
  choice: site n’aka ya
  rationale: “Site n’aka ya” bụ ụzọ Igbo ebumpụta ụwa isi gosipụta onye e ji mee ihe ma ọ bụ ụzọ e si rụọ ọrụ, dịka διά na genitive si dị.
theological_decisions:
- issue: Ihe κρίνῃ pụtara mgbe e jiri ya tụnyere σωθῇ
  choice: kpee ... ikpe
  alternative: maa ụwa ikpe
  rationale: κρίνω nwere nghọta sara mbara nke ikpe ikpe, ọ bụghị naanị ịma mmadụ ikpe. Isiokwu a na-egosi na ebumnuche izite Ọkpara ahụ abụghị ikpe ụwa ikpe kama ọ bụ nzọpụta ya; ntụgharị bụ isi anaghị eme ka okwu ahụ dị warara. E debere “ịma ikpe” n’ala ala peeji dịka nhọrọ dabara n’ọnọdụ a.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ugwu ma dị mfe nghọta. A họọrọ “Ọkpara ahụ” iji chekwaa titular force nke τὸν υἱόν; “ka e site n’aka ya zọpụta ụwa” na-edobe passive na agency n’asụsụ Igbo ebumpụta ụwa.
