review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the explanatory negation, God as sender, the Son, the repeated κόσμος ('ụwa'), the contrasting purpose clauses, the broader sense of κρίνῃ as 'judge,' and salvation through the Son. 'Ọkpara ahụ' is an established reverential Igbo Christological title and suitably conveys the definite titular expression here. The impersonal passive construction correctly represents σωθῇ, though it benefits from the purposive particle 'wee.'
  naturalness: The sentence is clear and in an appropriate modern Standard Igbo biblical register. Adding 'wee' in the second purpose clause makes the 'kama ka ...' construction more idiomatic and explicitly connects the passive salvation clause to its stated purpose.
  terminology: '''Kpee ụwa ikpe'' properly retains the broad judicial sense of κρίνῃ; the footnote appropriately supplies ''maa ụwa ikpe'' as the contextually narrower alternative. ''Zọpụta'' retains the salvation sense of σωθῇ, and ''site n’aka ya'' naturally expresses δι’ αὐτοῦ.'
  issues:
  - severity: low
    issue: The second purpose clause omits 'wee.'
    rationale: Although understandable, 'kama ka e wee site n’aka ya zọpụta ụwa' is the more natural and clearly purposive Standard Igbo construction.
  revised_text: N’ihi na Chineke eziteghị Ọkpara ahụ n’ụwa ka o kpee ụwa ikpe[a], kama ka e wee site n’aka ya zọpụta ụwa.
  revised_footnotes:
