revisions:
- from: N’ihi na Chineke eziteghị Ọkpara ahụ n’ụwa ka o kpee ụwa ikpe[a], kama ka e site n’aka ya zọpụta ụwa.
  to: N’ihi na Chineke eziteghị Ọkpara ahụ n’ụwa ka o kpee ụwa ikpe[a], kama ka e wee site n’aka ya zọpụta ụwa.
  rationale: A single idiomatic adjustment, 'wee,' has been added to the second purpose clause. It changes neither the meaning nor the passive/mediatorial structure, while improving the flow and explicit purposive force of the Igbo sentence.
  reviewer_model: gpt-5.6-terra
