id: JHN.3.1
reference: John 3:1
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἦν δὲ ἄνθρωπος ἐκ τῶν Φαρισαίων, Νικόδημος ὄνομα αὐτῷ, ἄρχων τῶν Ἰουδαίων·
base_translation:
  language: en
  yaml_path: translation/nt/john/003/001.yaml
  text: There was a man from the Pharisees named Nicodemus[a], a ruler of the Jews.
translation:
  language: ig
  text: E nwere otu nwoke so ná ndị Farisii, aha ya bụ Nikọdimọs, onyeisi ndị Juu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “onyeisi ndị Judia.” Okwu Grik a nwere ike ịpụta ndị Juu n’ozuzu ha ma ọ bụ, n’ọnọdụ ụfọdụ, ndị Judia ma ọ bụ ndị isi Juu kpọmkwem.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἦν δὲ
  choice: E nwere
  rationale: Nke a na-ewebata onye ọhụrụ n’akụkọ ahụ n’Igbo dị mfe ma bụrụkwa nke e ji ugwu dee. A hapụrụ δέ ka usoro okwu gbara ya gburugburu gosipụta njikọ akụkọ ya, kama ịgbakwụnye okwu oge na-adịghị n’isi mmalite Grik.
- source_word: ἄνθρωπος
  choice: otu nwoke
  rationale: N’ebe a, okwu ahụ na-ekwu kpọmkwem banyere otu nwoke, ya mere ‘otu nwoke’ dabara n’ihe gbasara nwoke na ọnọdụ akụkọ ahụ.
- source_word: ἐκ τῶν Φαρισαίων
  choice: so ná ndị Farisii
  rationale: ἐκ na-egosi na Nikọdimọs bụ onye otu ahụ. ‘So ná’ bụ ụzọ Igbo nkịtị si akọwa ịbụ onye so n’otu ìgwè.
- source_word: Νικόδημος ὄνομα αὐτῷ
  choice: aha ya bụ Nikọdimọs
  rationale: Nke a bụ nsụgharị Igbo doro anya ma bụrụkwa nke e ji ekwu aha mmadụ n’ụzọ nkịtị.
- source_word: ἄρχων
  choice: otu onyeisi
  rationale: Okwu a na-egosi onye nwere ọkwa na ikike. ‘Onyeisi’ na-egosipụta ọchịchị ma ọ bụ ndu n’enweghị ịkọwa kpọmkwem ụdị ọkwa ahụ karịa ihe Grik kwuru.
- source_word: τῶν Ἰουδαίων
  choice: ndị Juu
  rationale: N’ọnọdụ a, okwu ahụ yikarịrị ka ọ na-ezo aka n’ọchịchị na ndụ obodo ndị Juu n’ozuzu ya. Ihe ọzọ ọ pụrụ ịpụta dị ka ‘ndị Judia’ ka e debere n’ala peeji.
theological_decisions:
- issue: Ihe Ἰουδαίων pụtara n’Oziọma Jọn
  choice: ndị Juu
  alternative: ndị Judia
  rationale: Okwu Grik ahụ nwere ike ịpụta ndị Juu n’ozuzu ha, ndị bi na Judia, ma ọ bụ ndị isi Juu dabere n’ọnọdụ ya. Ebe a, ịbụ onye Farisii na onyeisi na-akwado nghọta metụtara ọchịchị ndị Juu, ma nsụgharị bụ isi anaghị eme ka okwu ahụ dị warara karịa ka ọ dị na Grik. E gosipụtara nhọrọ mpaghara n’ala peeji.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị mfe ma nwee ugwu. E kewara okwu Grik ahụ ụzọ abụọ ka ọ bụrụ Igbo na-aga were were, ma e chekwara njikọ echiche ya na ihe niile ọ pụtara.
