- from: E nwere otu nwoke so ná ndị Farisii, aha ya bụ Nikọdimọs. Ọ bụ otu onyeisi ndị Juu.[a]
  to: E nwere otu nwoke so ná ndị Farisii, aha ya bụ Nikọdimọs, onyeisi ndị Juu.[a]
  rationale: 'The revision retains every source element while restoring the Greek’s one-sentence, appositional presentation: Nicodemus is introduced as a man associated with the Pharisees and identified as a ruler of the Jews. The footnote is adjusted from “otu onyeisi” to “onyeisi” so that its alternative wording corresponds exactly to the revised main clause.'
