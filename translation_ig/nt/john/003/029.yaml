id: JHN.3.29
reference: John 3:29
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ ἔχων τὴν νύμφην νυμφίος ἐστίν· ὁ δὲ φίλος τοῦ νυμφίου ὁ ἑστηκὼς καὶ ἀκούων αὐτοῦ, χαρᾷ χαίρει διὰ τὴν φωνὴν τοῦ νυμφίου. αὕτη οὖν ἡ χαρὰ ἡ ἐμὴ πεπλήρωται.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/029.yaml
  text: The one who has the bride is the bridegroom[a]. But the friend of the bridegroom, who stands and hears him, rejoices greatly because of the bridegroom’s voice[c][b]. Therefore this joy of mine has been made complete.
translation:
  language: ig
  text: Onye nwere nwanyị a na-alụ ọhụrụ bụ nwoke na-alụ ya. Ma enyi nke nwoke ahụ na-alụ ya[a], onye guzo na-ege ya ntị, na-aṅụrị ọṅụ nke ukwuu[b] n’ihi olu nwoke ahụ na-alụ ya. Ya mere, ọṅụ m a ezuola oke[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N'ụzọ nkịtị, ‘enyi nke nwoke na-alụ nwanyị ọhụrụ.’ Ọrụ ya nwere ike ịdị ka nke onye a na-akpọ “best man” n’omenala ụfọdụ, ma okwu Grik kpọrọ ya enyi.
    reason: cultural_note
  - marker: b
    text: Ma ọ bụ, ‘na-aṅụrị ọṅụ n’ọṅụ’; nke a na-egosipụta n'ụzọ nkịtị nkwusi ike dị n’okwu Grik.
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, ‘emezuola’ ma ọ bụ ‘eruwola n’uju.’ Okwu Grik nwere ike ịpụta ime ka ihe zuo oke ma ọ bụ ruo n’uju.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἔχων τὴν νύμφην
  choice: Onye nwere nwaanyị a na-alụ ọhụrụ
  rationale: Ọ na-edobe usoro okwu Grik nke na-ekwu ‘onye nwere’ nakwa ihe atụ agbamakwụkwọ ahụ; ‘nwaanyị a na-alụ ọhụrụ’ bụ okwu Igbo doro anya maka bride n’ebe a.
- source_word: νυμφίος
  choice: nwoke na-alụ nwaanyị ọhụrụ
  rationale: Nhọrọ a na-egosipụta bridegroom n'ụzọ ndị Igbo nke oge a ga-aghọta, ma na-edobe ihe atụ agbamakwụkwọ ahụ n’oge ọ bụla okwu ahụ pụtara.
- source_word: φίλος τοῦ νυμφίου
  choice: enyi nwoke ahụ na-alụ nwaanyị ọhụrụ
  rationale: Nke a na-asụgharị ‘friend of the bridegroom’ kpọmkwem, na-etinyeghị ọrụ omenala dị ka ‘best man’ n’ime isiokwu.
- source_word: ὁ ἑστηκὼς καὶ ἀκούων αὐτοῦ
  choice: onye guzo na-ege ya ntị
  rationale: ‘Guzo’ na-egosipụta ọnọdụ onye ahụ, ebe ‘na-ege ya ntị’ bụ Igbo dị ndụ maka ịnụ onye ahụ n’ọnọdụ a.
- source_word: χαρᾷ χαίρει
  choice: na-aṅụrị ọṅụ nke ukwuu
  rationale: Aha na ngwaa sitere n’otu mgbọrọgwụ n’asụsụ Grik na-eme ka okwu ahụ sie ike; ‘nke ukwuu’ na-ebufe nkwusi ike ahụ n’Igbo eke.
- source_word: διὰ τὴν φωνὴν τοῦ νυμφίου
  choice: n’ihi olu nwoke ahụ na-alụ nwaanyị ọhụrụ
  rationale: Ọ na-edobe echiche ihe kpatara ọṅụ ahụ, ya bụ olu nwoke na-alụ nwaanyị ọhụrụ.
- source_word: αὕτη οὖν ἡ χαρὰ ἡ ἐμὴ
  choice: Ya mere, ọṅụ m a
  rationale: ‘Ya mere’ na-egosipụta nkwubi okwu οὖν, ebe ‘ọṅụ m a’ na-edobe ihe ngosi na nkwusi ike nke okwu Grik.
- source_word: πεπλήρωται
  choice: ezuola oke
  rationale: Ụdị a na-egosipụta ọnọdụ nke ruru n’uju ma ọ bụ zuo oke, kwekọrọ n’ike perfect passive n’ebe a.
theological_decisions:
- issue: Ihe atụ agbamakwụkwọ na ọnọdụ Jọn
  choice: E debere nwoke na-alụ nwaanyị ọhụrụ, nwaanyị a na-alụ ọhụrụ, na enyi nwoke ahụ dị ka ihe atụ, n’enweghị ịkọwa onye nwaanyị ahụ nọchiri anya ya.
  alternative: Ịkpọ enyi ahụ ‘onye ndu agbamakwụkwọ’ ma ọ bụ ịkọwa nwaanyị ahụ ozugbo dị ka nzukọ Kraịst.
  rationale: Amaokwu ahụ n’onwe ya akọwaghị onye nwaanyị a na-alụ ọhụrụ bụ, ọ kpọghịkwa enyi ahụ aha ọrụ omenala kpọmkwem; ya mere nsụgharị ahụ anaghị etinye nkwubi okwu nkà mmụta okpukpe n’ime ederede.
- issue: Ihe πεπλήρωται pụtara banyere ọṅụ Jọn
  choice: ‘ezuola oke,’ nke na-egosi ọṅụ ruru n’uju.
  alternative: ‘emezuola,’ nke nwekwara ike ime ka onye na-agụ ya chee banyere mmezu amụma.
  rationale: N’ọnọdụ a, isi echiche bụ izu oke ma ọ bụ iru n’uju nke ọṅụ, ọ bụghị ịkọwa mmezu amụma kpọmkwem.
translation_notes:
  register: Standard Igbo dị ugbu a, dị nsọ ma dị mfe nghọta. E jiri usoro okwu agbamakwụkwọ a na-aghọta n’Igbo mee ihe, ma zere okwu ụka pụrụ iche na nkọwa agbakwunyere. E tinyere akara nkọwa ụkwụ niile [a], [b], [c] n’isi ederede n’ebe okwu ha na-akọwa dị.
