  to: Onye nwere nwanyị a na-alụ ọhụrụ bụ nwoke na-alụ ya. Ma enyi nke nwoke ahụ na-alụ ya[a], onye guzo na-ege ya ntị, na-aṅụrị ọṅụ nke ukwuu[b] n’ihi olu nwoke ahụ na-alụ ya. Ya mere, ọṅụ m a ezuola oke[c].
