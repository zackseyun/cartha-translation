id: JHN.3.10
reference: John 3:10
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῷ· Σὺ εἶ ὁ διδάσκαλος τοῦ Ἰσραὴλ καὶ ταῦτα οὐ γινώσκεις;
base_translation:
  language: en
  yaml_path: translation/nt/john/003/010.yaml
  text: Jesus answered and said to him[a], “You are the teacher of Israel, and you do not know these things?”
translation:
  language: ig
  text: Jizọs zara ya sị, “Gị bụ onye nkụzi Izrel[a], ma ị maghị ihe ndị a?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịtụgharị ya, “otu onye nkụzi Izrel.” N’asụsụ Grik, ọ bụ “onye nkụzi ahụ,” nke nwere ike ime ka ajụjụ Jizọs bụrụ nke na-atụ Nikọdimọs aka kpọmkwem.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη ... καὶ εἶπεν αὐτῷ
  choice: zara ya sị
  rationale: Nke a bụ ụzọ Igbo si ekwu usoro okwu Grik ahụ n'ụzọ ebumpụta ụwa, ma na-echekwa echiche nke ịza mmadụ na ịgwa ya okwu.
- source_word: Σὺ
  choice: Ị bụ
  rationale: Ịkpọ nnọchiaha ahụ n'ihu na-echekwa nkwusi ike dị na Grik.
- source_word: ὁ διδάσκαλος
  choice: onye ozizi ahụ
  rationale: “Onye ozizi ahụ” na-echekwa article doro anya nke Grik ma na-enye okwu Jizọs ike ajụjụ na nkọcha dị nro.
- source_word: τοῦ Ἰσραὴλ
  choice: nke Izrel
  rationale: Ọ na-egosi ọnọdụ ya dị ka onye ozizi nke ndị Izrel, ọ bụghị naanị onye na-akụzi n’ala Izrel.
- source_word: ταῦτα
  choice: ihe ndị a
  rationale: Nke a na-ezo n'ụzọ sara mbara n’ihe Jizọs kuziri n’okwu ndị bu ụzọ.
- source_word: οὐ γινώσκεις
  choice: ị maghị
  rationale: “Ị maghị” na-anọ nso n'okwu Grik, ebe ọnọdụ okwu ahụ na-egosikwa na ọ bụ enweghị nghọta ka a na-ekwu.
theological_decisions:
- issue: Ike okwu ὁ διδάσκαλος τοῦ Ἰσραήλ mgbe Jizọs na-agwa Nikọdimọs okwu
  choice: onye ozizi ahụ nke Izrel
  alternative: otu onye ozizi nke Izrel
  rationale: Article ὁ na-akwado ntụgharị doro anya, “onye ozizi ahụ,” nke na-echekwa ike ajụjụ Jizọs na nkọcha ya, n’etinyeghị ozizi ọzọ na-adịghị n’ederede.
translation_notes:
  register: Igbo Izugbe nke oge a, dị ùgwù ma doo ndị nkịtị anya. A họọrọ “zara ya sị” kama ịmegharị ngwaa abụọ n'ụzọ na-adịghị ebumpụta ụwa n'Igbo; e chekwara nkwusi ike na definiteness nke Grik site na “Ị bụ onye ozizi ahụ.”
