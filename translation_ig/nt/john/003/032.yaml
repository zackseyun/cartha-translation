- from: Ihe ọ hụworo ma nụ, ọ bụ nke a ka ọ na-agba akaebe banyere ya; ma ọ dịghị onye na-anabata akaebe ya.[a]
  to: Ihe ọ hụworo ma nụrụ, ọ bụ nke a ka ọ na-agba akaebe banyere ya; ma ọ dịghị onye na-anabata akaebe ya.[a]
  rationale: 'Only a minimal idiomatic correction is needed: “nụrụ” more naturally expresses the completed hearing denoted by ἤκουσεν. The wording otherwise faithfully preserves the Greek’s content focus, witness terminology, and deliberately stark “no one” statement. The footnote correctly preserves, rather than resolves, the tension with the following verse.'
