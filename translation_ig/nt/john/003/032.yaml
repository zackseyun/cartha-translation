  text: ⸀ὃ ἑώρακεν καὶ ἤκουσεν τοῦτο μαρτυρεῖ, καὶ τὴν μαρτυρίαν αὐτοῦ οὐδεὶς λαμβάνει.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/032.yaml
  text: What he has seen and heard[a], this he testifies to[b], and no one receives his testimony.
translation:
  language: ig
  text: Ihe ọ hụworo ma nụrụ, ọ bụ nke a ka ọ na-agba akaebe banyere ya; ma ọ dịghị onye na-anabata akaebe ya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Okwu ahụ bụ́ “ọ dịghị onye na-anabata akaebe ya” bụ nkwupụta siri ike nke na-ekwu n’ozuzu; amaokwu na-esote na-ekwu banyere onye nabatara ya.
    reason: cross_reference
lexical_decisions:
- source_word: ὃ
  choice: Ihe
  rationale: Nnọchiaha njikọ a na-ezo aka n’ihe ahụ ọ hụrụ ma nụ, ọ bụghị n’onye mmadụ; “Ihe” na-egosipụta nke a n’Igbo nkịtị.
- source_word: ἑώρακεν
  choice: ọ hụworo
  rationale: Ụdị perfect Grik na-egosi ihe e mere nke ka nwere mkpa ugbu a; “hụworo” na-echekwa echiche ahụ.
- source_word: ἤκουσεν
  choice: nụ
  rationale: Aorist a jikọrọ ya na perfect dị n’ihu; “nụ” bụ Igbo dị mfe ma na-ahapụ ntakịrị ọdịiche aspect ahụ ka ọ dị.
- source_word: τοῦτο
  choice: ọ bụ nke a
  rationale: Ihe ngosi a na-alaghachi kpọmkwem n’ihe e kwuru na mbụ ma na-echekwa usoro resumptive nke Grik.
- source_word: μαρτυρεῖ
  choice: ọ na-agba akaebe banyere ya
  rationale: “Ịgba akaebe” na-echekwa echiche iwu na nkwupụta nke okwu Jọn; “banyere ya” na-eme ka ihe akaebe ahụ na-ezo aka na ya doo anya n’Igbo.
- source_word: μαρτυρίαν
  choice: akaebe
  rationale: Otu okwu a na-ejikarị maka nkwupụta onye akaebe ma na-ejikọta ya nke ọma na ngwaa “ịgba akaebe.”
- source_word: οὐδεὶς
  choice: ọ dịghị onye
  rationale: Nke a bụ ntụgharị Igbo doro anya nke ngọnarị zuru ụwa ọnụ, na-enweghị ime ka nkwupụta ahụ dị nro.
- source_word: λαμβάνει
  choice: na-anabata
  rationale: N’ebe a, λαμβάνω pụtara ịnabata akaebe dị ka nke kwesịrị ntụkwasị obi; “na-anabata” bụ Igbo nkịtị ma ka na-echekwa echiche nke receiving/accepting.
theological_decisions:
- issue: Oke nke okwu ngọnarị zuru ụwa ọnụ, “ọ dịghị onye na-anabata akaebe ya”
  choice: 'E debere nkwupụta siri ike ahụ kpọmkwem: “ọ dịghị onye.”'
  alternative: “Ọ bụ mmadụ ole na ole na-anabata akaebe ya,” ma ọ bụ ịkọwa ya dị ka ngọnarị zuru oke na-enweghị esemokwu ọ bụla.
  rationale: Grik kwuru ya n’ụzọ zuru ụwa ọnụ ma sie ike. Amaokwu na-esote na-ekwu maka onye nabatara akaebe ahụ; ya mere, ntụgharị ahụ kwesịrị ịhapụ esemokwu okwu Jọn a ka ọ dị, kama idozi ya site n’ịkọwapụta.
translation_notes:
  register: Igbo Ọha dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji “ịgba akaebe/akaebe” chekwaa njikọ okwu μαρτυρεῖ/μαρτυρίαν. E debere usoro “Ihe… ọ bụ nke a…” iji gosipụta nkwughachi nke Grik n’enweghị ime ka Igbo bụrụ nke na-adịghị eke.
