    issue: Use of bare “nụ” for ἤκουσεν
    rationale: Changing it to “nụrụ” gives a more natural completed-action form alongside “hụworo,” while retaining the source distinction that the first verb is perfect and the second is aorist as far as idiomatic Igbo permits.
