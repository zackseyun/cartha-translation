  text: οὔπω γὰρ ἦν βεβλημένος εἰς τὴν φυλακὴν ⸀ὁ Ἰωάννης.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/024.yaml
  text: For John had not yet been thrown into prison[a].
translation:
  language: ig
  text: N’ihi na a tụbabeghị Jọn n’ụlọ mkpọrọ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ya bụ, Jọn Onye Na-eme Baptizim.
    reason: cross_reference
lexical_decisions:
- source_word: οὔπω
  choice: a tụnyebeghị
  rationale: Ụdị ngwaa a na-egosi na, ruo n’oge ahụ n’akụkọ ahụ, ihe ahụ emebeghị.
- source_word: γὰρ
  choice: N’ihi na
  rationale: Ọ na-enye nkọwa ndabere maka ihe gbara amaokwu a gburugburu.
- source_word: ἦν βεβλημένος
  choice: a tụnyebeghị
  rationale: Ngwakọta ya na οὔπω na-egosi omume a na-emeghị tupu oge a na-ekwu maka ya; ụdị a bụ ụzọ Igbo si akọwa ya nke ọma, ebe “tụnye” ka na-egosipụta ike dị na βάλλω.
- source_word: εἰς τὴν φυλακήν
  choice: n’ụlọ mkpọrọ
  rationale: φυλακή ebe a bụ ụlọ mkpọrọ, ọ bụghị naanị nche; “n’ụlọ mkpọrọ” bụ okwu Igbo e ji ekwu itinye mmadụ mkpọrọ n’ụzọ ebumpụta ụwa.
- source_word: ὁ Ἰωάννης
  choice: Jọn
  rationale: Grik kpọrọ ya naanị Jọn; ihe gbara amaokwu ahụ gburugburu na-eme ka a mata onye ọ bụ.
theological_decisions:
- issue: Onye Ἰωάννης bụ
  choice: Jọn
  alternative: Jọn Onye Na-eme Baptizim
  rationale: Ọ bụ Jọn Onye Na-eme Baptizim ka a na-ekwu maka ya, ma ederede Grik n’amaokwu a kpọrọ ya naanị Jọn. Ya mere, a hapụrụ nkọwa ahụ n’ihe odide ala peeji kama ịgbakwunye ya n’ahịrị bụ isi.
translation_notes:
  register: Asụsụ Igbo Izugbe dị ugbu a, kwụ ọtọ ma dị ùgwù. E jiri ahịrịokwu a na-anụkarị n’Igbo mee ka nkọwa ndabere γὰρ na oge οὔπω doo anya.
