id: JHN.3.2
reference: John 3:2
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οὗτος ἦλθεν πρὸς αὐτὸν νυκτὸς καὶ εἶπεν αὐτῷ· Ῥαββί, οἴδαμεν ὅτι ἀπὸ θεοῦ ἐλήλυθας διδάσκαλος· οὐδεὶς γὰρ ⸂δύναται ταῦτα τὰ σημεῖα⸃ ποιεῖν ἃ σὺ ποιεῖς, ἐὰν μὴ ᾖ ὁ θεὸς μετ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/002.yaml
  text: This man came to him by night and said to him[a], “Rabbi, we know that you have come from God as a teacher[c][b], for no one is able to do these signs that you do unless God is with him.”
translation:
  language: ig
  text: Nwoke a bịakwutere ya n'abalị[a] wee sị ya, “Rabaị, anyị maara na i si n'ebe Chineke nọ bịa dị ka onye ozizi, n'ihi na ọ dịghị onye pụrụ ime ihe ịrịba ama ndị a[b] ị na-eme, ọ gwụla ma Chineke nọnyere ya[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “n'oge abalị.” N'akwụkwọ Jọn, abalị na ọchịchịrị nwekwara ike ibu echiche ihe atụ.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsị, “ọrụ ebube ndị a.” E ji “ihe ịrịba ama” tụgharịa okwu Grik σημεῖα iji gosi na ọrụ ndị a na-arụtụ aka n'ihe karịrị ha onwe ha.
    reason: lexical_alternative
  - marker: c
    text: 'N''asụsụ Grik: “ọ gwụla ma Chineke nọnyere ya.” Nikọdimọs gbanwere site n''ịgwa Jizọs “ị/gị” gaa n''iji onye nke atọ, “ya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτος
  choice: Nwoke a
  rationale: Ọ na-ezo aka na Nikọdimọs, nwoke a kpọtụrụ aha n'amaokwu gara aga; ntụgharị a na-edobe ike ngosi nke οὗτος karịa iji naanị “ọ.”
- source_word: ἦλθεν πρὸς αὐτὸν
  choice: bịakwutere ya
  rationale: Nke a bụ ụzọ Igbo nkịtị si akọ na mmadụ bịara n'ebe onye ọzọ nọ.
- source_word: νυκτός
  choice: n'abalị
  rationale: Ọ na-egosi oge ihe ahụ mere, ma ọ naghị egbochi abalị inwekwa ụda ihe atụ n'akwụkwọ Jọn.
- source_word: Ῥαββί
  choice: Rabaị
  rationale: E debere aha nkwanye ùgwù ndị Juu ahụ n'ụdị mkpụrụokwu Igbo kama ịtụgharị ya ozugbo ka ọ bụrụ “Onye ozizi,” ka ọnọdụ akụkọ ihe mere eme ghara ịla n'iyi.
- source_word: οἴδαμεν
  choice: anyị maara
  rationale: E debere onye mbụ n'ụbara dị n'asụsụ Grik; ederede ahụ ekwughị “amaara m.”
- source_word: ἀπὸ θεοῦ ἐλήλυθας
  choice: i si n'ebe Chineke nọ bịa
  rationale: Nke a na-edobe echiche nke isi n'ebe Chineke nọ bịa na mmetụta nke perfect, na-etinyeghị okwu siri ike karịa ya dịka “Chineke zitere gị.”
- source_word: διδάσκαλος
  choice: dị ka onye ozizi
  rationale: Ọ na-egosi ọrụ ma ọ bụ ọnọdụ Jizọs dịka onye ozizi n'okwu Nikọdimọs.
- source_word: οὐδεὶς γὰρ δύναται
  choice: n'ihi na ọ dịghị onye pụrụ
  rationale: “Pụrụ” na-enye δύναται n'ụzọ doro anya ma dịkwa mma n'Igbo dị ùgwù.
- source_word: ταῦτα τὰ σημεῖα
  choice: ihe ịrịba ama ndị a
  rationale: “Ihe ịrịba ama” na-edobe ụzọ Jọn si eji σημεῖα maka ọrụ dị ebube ndị na-arụtụ aka n'ihe karịrị ọrụ ahụ n'onwe ya.
- source_word: ποιεῖν ἃ σὺ ποιεῖς
  choice: ime ihe ịrịba ama ndị a ị na-eme
  rationale: E debere nkwughachi nke ποιέω site n'iji “ime/ị na-eme.”
- source_word: ἐὰν μὴ ᾖ ὁ θεὸς μετ’ αὐτοῦ
  choice: ọ gwụla ma Chineke nọnyere ya
  rationale: Nke a na-edobe ọnọdụ “unless” nakwa onye nke atọ “ya,” kama ịgbanwe ya ka ọ bụrụ “gị.”
theological_decisions:
- issue: Otú e si atụgharị σημεῖα n'akwụkwọ Jọn
  choice: ihe ịrịba ama
  alternative: ọrụ ebube
  rationale: '“Ihe ịrịba ama” na-echekwa ibu echiche Jọn: ọrụ ndị a dị ebube ma na-arụtụkwa aka n''ọnọdụ na ozi Jizọs.'
- issue: Mgbanwe site n'ịgwa Jizọs okwu dịka onye nke abụọ gaa n'ịkpọ ya dịka onye nke atọ
  choice: ọ gwụla ma Chineke nọnyere ya
  alternative: ọ gwụla ma Chineke nọnyere gị
  rationale: Asụsụ Grik ji αὐτοῦ, “ya.” Idebe ya na-echekwa ụdị okwu Nikọdimọs na nkwanye ùgwù ma ọ bụ ịdị anya dị n'okwu ya, n'agbanyeghị na “gị” ga-adị ire ụtọ karị.
- issue: Ma ἀπὸ θεοῦ ἐλήλυθας ọ̀ pụtara iziga mmadụ n'ozi n'ụzọ doro anya
  choice: i si n'ebe Chineke nọ bịa
  alternative: Chineke zitere gị
  rationale: Amaokwu ahụ kwuru ebe o si bịa, ma o jighị ngwaa pụtara “iziga.” Ya mere, a naghị etinye nkọwa nkuzi karịrị ihe ederede kwuru.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe ma dị ùgwù. A họọrọ okwu ndị mmadụ na-aghọta nke ọma, ma e debere ụdị okwu na nghọtahie ziri ezi dị n'asụsụ Grik, karịchaa “ihe ịrịba ama” na mgbanwe gaa n'okwu onye nke atọ.
