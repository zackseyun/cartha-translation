id: JHN.10.6
reference: John 10:6
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ταύτην τὴν παροιμίαν εἶπεν αὐτοῖς ὁ Ἰησοῦς· ἐκεῖνοι δὲ οὐκ ἔγνωσαν τίνα ⸀ἦν ἃ ἐλάλει αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/006.yaml
  text: Jesus spoke this figure of speech to them[a], but they did not understand what he was saying to them.
translation:
  language: ig
  text: Jizọs gwara ha okwu ilu a[a], ma ha aghọtaghị ihe ọ na-agwa ha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “okwu e ji ihe atụ kwuo,” “ihe atụ,” ma ọ bụ “ilu.” Okwu Grik ahụ nwere ike ịpụta okwu ihe atụ n’ụzọ sara mbara; n’ebe a, ọ na-ezo aka n’okwu Jizọs banyere onye ọzụzụ atụrụ, nke ọ na-ekwughị n’ụzọ nkịtị.
    reason: lexical_alternative
lexical_decisions:
- source_word: παροιμίαν
  choice: okwu ilu
  rationale: Okwu Grik a nwere ike ịpụta okwu e ji ihe atụ kwuo, ilu, ma ọ bụ nkọwa e kpuchiri ekpuchi. “Okwu ilu” bụ okwu Igbo dị mfe ma saa mbara nke na-egosi na a ghaghị ịghọta okwu ahụ n'ụzọ na-abụghị nanị ihe ọ pụtara n’elu.
- source_word: εἶπεν
  choice: gwara
  rationale: N’Igbo, “gwara ha okwu” na-egosi n’ụzọ ebumpụta ụwa na Jizọs kwuru okwu ahụ nye ha.
- source_word: ἐκεῖνοι δὲ
  choice: ma ha
  rationale: “Ma” na-echekwa ọdịiche δέ gosiri n’etiti Jizọs kwuru okwu na enweghị nghọta nke ndị gere ya.
- source_word: οὐκ ἔγνωσαν
  choice: ha aghọtaghị
  rationale: N’ọnọdụ a, γινώσκω na-ekwu banyere ịghọta ihe okwu ahụ pụtara, ọ bụghị nanị ịma ihe.
- source_word: τίνα ἦν ἃ ἐλάλει αὐτοῖς
  choice: ihe ọ na-agwa ha
  rationale: 'Nke a na-enye Igbo doro anya ma dị ire, na-echekwa isi echiche nke ahịrịokwu Grik ahụ: ha aghọtaghị ọdịnaya ma ọ bụ ihe okwu Jizọs pụtara.'
- source_word: αὐτοῖς
  choice: ha
  rationale: N’usoro “ọ na-agwa ha,” “ha” bụ ndị a na-agwa okwu ma na-egosipụta dative αὐτοῖς nke ọma.
theological_decisions: []
translation_notes:
  register: Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E ji “okwu ilu” mee ka ọdịdị ihe atụ nke παροιμία pụta ìhè n’ebughị ụzọ kpebie na ọ bụ ụdị ilu ma ọ bụ parabụl kpọmkwem.
