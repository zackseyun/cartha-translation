revisions:
- from: dị nnọọ ka Nna si mara m, mụ onwe m makwa Nna. Ana m atọgbọkwa ndụ m[a] maka atụrụ ndị ahụ.[b]
  to: Dị nnọọ ka Nna si mara m, m makwa Nna; ana m atọgbọ ndụ m[a] maka atụrụ ndị ahụ.[b]
  rationale: The revision preserves the source’s reciprocal relationship and deliberate laying down of life, while removing an unnecessary additive nuance. The second note is revised so that its alternative and explanation accurately reflect the semantic range of ὑπέρ without making “in the name of the sheep” appear to be a translation equivalent.
