  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καθὼς γινώσκει με ὁ πατὴρ κἀγὼ γινώσκω τὸν πατέρα, καὶ τὴν ψυχήν μου τίθημι ὑπὲρ τῶν προβάτων.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/015.yaml
  text: just as the Father knows me and I know the Father[b][a], and I lay down my life for the sheep.
translation:
  language: ig
  text: Dị nnọọ ka Nna si mara m, m makwa Nna; ana m atọgbọ ndụ m[a] maka atụrụ ndị ahụ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “mkpụrụobi m.” N’ebe a, ihe ọ pụtara bụ “ndụ m,” n’ihi na ọ na-ekwu banyere iji onwe ya chụọ àjà.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “n’ihi atụrụ ndị ahụ.” Okwu Grik ahụ nwere ike igosi ime ihe maka ọdịmma ha, nakwa ụda nnọchite anya ma ọ bụ ịchụ àjà n’ihi ha.
    reason: alternative_reading
lexical_decisions:
- source_word: καθὼς
  choice: dị nnọọ ka ... si
  rationale: Ọ bụ ụzọ Igbo dị ndụ nke na-egosi ntụnyere siri ike, ma na-ejikọ amaokwu a na okwu bu ya ụzọ.
- source_word: γινώσκει / γινώσκω
  choice: mara / makwa
  rationale: “Ịma” na-edobe otu mgbọrọgwụ okwu ahụ ugboro abụọ ma nwee ike ịgụnye mmekọrịta miri emi, n’ebughị ụzọ kọwaa ya karịa ihe Grik kwuru.
- source_word: ὁ πατὴρ / τὸν πατέρα
  choice: Nna
  rationale: Aha nsọpụrụ “Nna” dabara n’ojiji Jọn ma na-edobe nhazi yiri ibe ya n’ahịrịokwu ahụ; Igbo anaghị achọ mkpụrụokwu ọzọ ga-anọchi edemede Grik ebe a.
- source_word: κἀγὼ
  choice: mụ onwe m makwa
  rationale: “Mụ onwe m” na-eme ka nzaghachi dị n’etiti Nna na Ọkpara pụta ìhè, ebe “-kwa” na-eburu ike καί dị na κἀγώ.
- source_word: τὴν ψυχήν μου
  choice: ndụ m
  rationale: N’ọnọdụ a, ψυχή bụ ndụ Jizọs nke ọ na-enye n’ọnwụ, ọ bụghị nanị akụkụ ime mmụọ a na-akpọ mkpụrụobi.
- source_word: τίθημι
  choice: atọgbọ
  rationale: “Ịtọgbọ ndụ” na-egosipụta omume mmadụ ji aka ya hapụ ndụ ya, ma na-edobe ihe oyiyi nke τίθημι karịa ntụgharị sara mbara dịka “inye.”
- source_word: ὑπὲρ
  choice: maka
  rationale: “Maka” bụ okwu Igbo nkịtị nke na-egosi uru na nnọchite anya, ma ọ naghị emechi ihe Grik ahụ n’otu nkọwa ozizi pụrụ iche.
- source_word: τῶν προβάτων
  choice: atụrụ ndị ahụ
  rationale: Nke a na-edobe atụrụ n’onwe ha kama iji “ìgwè atụrụ,” ya mere ihe atụ onye ọzụzụ atụrụ ka dị kpọmkwem.
theological_decisions:
- issue: Ike ὑπὲρ nwere n’ịtọgbọ ndụ Jizọs
  choice: A sụgharịrị ya “maka” ka echiche nke ime ihe ga-abara atụrụ uru na nke ịnọchite anya ha abụọ nwee ohere.
  alternative: n’ihi; n’ọnọdụ atụrụ ndị ahụ
  rationale: Ὑπέρ nwere ike ibu echiche nke uru, nnọchite anya, na ịchụ àjà. “Maka” na-edobe obosara ahụ n’etinyeghị ozizi nkọwa pụrụ iche n’ime ederede.
- issue: Ihe ψυχή pụtara n’ebe a
  choice: ndụ
  alternative: mkpụrụobi
  rationale: Ihe gbara amaokwu a gburugburu bụ ọnwụ Onye Ọzụzụ Atụrụ Ọma n’ihi atụrụ ya; ya mere “ndụ” na-egosi ihe a na-enye n’ụzọ doro anya ma zere nghọta na-ekwu naanị banyere akụkụ ime mmụọ mmadụ.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. Nhazi yiri ibe ya nke “Nna si mara m / mụ onwe m makwa Nna” na-edobe nguzozi dị na Grik. E tinyere akara nkọwa [a] ozugbo n’azụ “ndụ m,” na [b] n’azụ ahịrịokwu metụtara “maka,” ka ihe nkọwa nke ọ bụla doo anya.
