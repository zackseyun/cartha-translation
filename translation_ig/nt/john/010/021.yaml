- from: Ndị ọzọ nọ na-ekwu, “Okwu ndị a abụghị okwu onye mmụọ ọjọọ ji. Mmụọ ọjọọ ọ̀ pụrụ imeghe anya ndị ìsì?”
  to: Ndị ọzọ nọ na-ekwu, “Okwu ndị a esighị n’ọnụ onye mmụọ ọjọọ ji. Mmụọ ọjọọ ọ̀ pụrụ imeghe anya ndị ìsì?”
  rationale: The revision changes only the first statement’s idiom, making explicit in natural Standard Igbo that the words do not come from a demon-possessed person. It retains the imperfect “nọ na-ekwu,” the established demon terminology, and the rhetorical question’s expected negative answer without turning it into an explicit assertion.
