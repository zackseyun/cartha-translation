id: JHN.10.21
reference: John 10:21
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸀ἄλλοι ἔλεγον· Ταῦτα τὰ ῥήματα οὐκ ἔστιν δαιμονιζομένου· μὴ δαιμόνιον δύναται τυφλῶν ὀφθαλμοὺς ⸀ἀνοῖξαι;
base_translation:
  language: en
  yaml_path: translation/nt/john/010/021.yaml
  text: Others were saying[a], “These words are not those of a demon-possessed man. A demon cannot open the eyes of the blind, can it?”
translation:
  language: ig
  text: Ndị ọzọ nọ na-ekwu, “Okwu ndị a esighị n’ọnụ onye mmụọ ọjọọ ji. Mmụọ ọjọọ ọ̀ pụrụ imeghe anya ndị ìsì?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄλλοι
  choice: Ndị ọzọ
  rationale: Ọ na-egosi ìgwè ọzọ dị iche na ndị kwuru okwu n'amaokwu bu ụzọ; nke a bụkwa ụzọ Igbo doro anya si kwuo ya.
- source_word: ἔλεγον
  choice: nọ na-ekwu
  rationale: Oge imperfect na-egosi okwu na-aga n'ihu ma ọ bụ nke a na-ekwu ugboro ugboro; ‘nọ na-ekwu’ na-egosipụta nke ahụ n'Igbo nkịtị.
- source_word: Ταῦτα τὰ ῥήματα
  choice: Okwu ndị a
  rationale: ῥήματα na-ezo aka n'okwu Jizọs kwuru; ‘okwu ndị a’ bụ nsụgharị kwụ ọtọ ma dị mfe nghọta.
- source_word: οὐκ ἔστιν δαιμονιζομένου
  choice: abụghị okwu onye mmụọ ọjọọ ji
  rationale: Nkebiokwu genitive a na-akọwa ụdị onye okwu ndị a pụrụ isi n'ọnụ ya pụta. ‘Onye mmụọ ọjọọ ji’ bụ okwu Igbo a na-aghọta nke ọma ma ọ naghị etinye nkọwa ozizi karịrị ihe Grik kwuru.
- source_word: μὴ
  choice: ọ̀ ...?
  rationale: μή na-ebute ajụjụ a tụrụ anya na azịza ya ga-abụ mba. Ụdị ajụjụ a na ụda okwu ya na-egosipụta atụmanya ahụ n'Igbo.
- source_word: δαιμόνιον
  choice: Mmụọ ọjọọ
  rationale: Nke a bụ okwu Igbo doro anya maka δαιμόνιον ma na-ezere ịgbakwunye nkọwa ọzọ na-adịghị n'okwu Grik.
- source_word: δύναται
  choice: pụrụ
  rationale: ‘Pụrụ’ na-egosipụta ike ime ihe; mgbe e tinyere ya n'ajụjụ nkwupụta a, ọ na-echekwa echiche na azịza a tụrụ anya ya bụ mba.
- source_word: τυφλῶν ὀφθαλμοὺς
  choice: anya ndị ìsì
  rationale: Ọ na-echekwa ihe oyiyi nkịtị nke ‘anya’ na njikọ ya na ọgwụgwọ nwoke ahụ kpuru ìsì n'isiakwụkwọ gara aga.
- source_word: ἀνοῖξαι
  choice: imeghe
  rationale: Ọ bụ nsụgharị kpọmkwem nke infinitive ahụ ma na-echekwa ihe oyiyi nke imeghe anya kama ịkọwa ya naanị dị ka iweghachi ịhụ ụzọ.
theological_decisions:
- issue: Nsụgharị okwu δαιμονίζομαι na δαιμόνιον
  choice: onye mmụọ ọjọọ ji / Mmụọ ọjọọ
  alternative: onye mmụọ ọjọọ nọ n'ime ya / mmụọ ọjọọ
  rationale: Nhọrọ a na-egosi na onye ahụ nọ n'okpuru ọchịchị mmụọ ọjọọ, ma ọ naghị eme okwu Grik ahụ ka ọ bụrụ ozizi teknụzụ zuru ezu banyere otú ọnọdụ ahụ si arụ ọrụ.
- issue: Ike ajụjụ nkwupụta nke μή webatara
  choice: Mmụọ ọjọọ ọ̀ pụrụ imeghe anya ndị ìsì?
  alternative: Mmụọ ọjọọ apụghị imeghe anya ndị ìsì, ọ̀ pụrụ ime ya?
  rationale: Ụda ajụjụ ahụ n'Igbo na gburugburu okwu ya na-eme ka o doo anya na ndị na-ekwu ya tụrụ anya azịza ‘mba,’ ma na-echekwa ụdị ajụjụ nke Grik.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ ‘nọ na-ekwu’ iji gosi imperfect, ma e chekwara ihe oyiyi ‘imeghe anya.’ Enweghị akara nkọwa ala peeji n'ihi na nsụgharị Igbo bụ isi na-enye echiche idiomatic nke οὐκ ἔστιν δαιμονιζομένου n'ụzọ doro anya.
