  text: ἀπεκρίθη αὐτοῖς ὁ Ἰησοῦς· Εἶπον ὑμῖν καὶ οὐ πιστεύετε· τὰ ἔργα ἃ ἐγὼ ποιῶ ἐν τῷ ὀνόματι τοῦ πατρός μου ταῦτα μαρτυρεῖ περὶ ἐμοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/john/010/025.yaml
  text: Jesus answered them[a], “I told you, and you do not believe[b]. The works that I do in the name of my Father—these testify about me.”
translation:
  language: ig
  text: Jizọs zara ha, “Agwara m unu, ma unu ekweghị. Ọrụ ndị m na-arụ n’aha[a] Nna m—ọ bụ ha na-agba akaebe banyere m[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “site n’ikike Nna m.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ha na-agba akaebe gbasara m.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: zara
  rationale: ‘Zara’ bụ ụzọ Igbo nkịtị na nke doro anya si akọ nzaghachi mmadụ n’ime mkparịta ụka.
- source_word: Εἶπον ὑμῖν
  choice: Agwara m unu
  rationale: Nke a na-egosi na Jizọs agwalarị ha okwu ahụ na mbụ, ma na-ada nke ọma n’Igbo karịa nsụgharị siri ike dịka ‘Ekwuru m unu.’
- source_word: οὐ πιστεύετε
  choice: unu ekweghị
  rationale: ‘Ekweghị’ na-echekwa isi echiche πιστεύω banyere ikwere ihe Jizọs kwuru, ma kwekọọkwa n’otú e si eji okwu a n’Oziọma Jọn.
- source_word: τὰ ἔργα
  choice: Ọrụ ndị
  rationale: ‘Ọrụ’ na-echekwa okwu Jọn ji akọ ihe Jizọs na-eme, gụnyere ihe ịrịba ama ya, kama iji okwu ga-eme ka ihe ọ pụtara dị warara.
- source_word: ἐν τῷ ὀνόματι
  choice: n’aha
  rationale: ‘N’aha’ na-echekwa akpaalaokwu Grik na ohere ọ nwere ịpụta nnọchiteanya na ikike, n’agbanyeghị na e nyere nkọwa ọzọ n’ala ala peeji.
- source_word: πατρός μου
  choice: Nna m
  rationale: ‘Nna m’ gosiri mmekọrịta Jizọs na Chineke n’ebe a; mkpụrụedemede ukwu na-egosi na ọ bụ aha mmekọrịta Chineke.
- source_word: ταῦτα μαρτυρεῖ περὶ ἐμοῦ
  choice: ọ bụ ha na-agbara m akaebe
  rationale: ‘Ọ bụ ha’ na-echekwa nkwusi ike dị na ταῦτα, ebe ‘na-agbara m akaebe’ na-eburu echiche ịgba akaebe banyere onye n’Igbo dị ugbu a.
theological_decisions:
- issue: Mmekọrịta dị n’etiti ọrụ Jizọs na ikike Nna ya
  choice: n’aha Nna m
  alternative: site n’ikike Nna m
  rationale: Nhọrọ a na-echekwa obosara na nrụgide nkà mmụta okpukpe dị n’akpaalaokwu Grik ahụ, n’akọwaghị ya naanị dịka okwu banyere ikike.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Ahịrị ogologo ahụ na akara ogologo na-enyere aka ime ka nkwusi ike dị n’okwu ‘ọ bụ ha’ pụta ìhè. E debere akara ala ala peeji [a] na [b] n’ebe okwu ha na-akọwa dị, kama ịgbaso ọnọdụ akara ndị yiri ka ha gbanwere n’English POB.
