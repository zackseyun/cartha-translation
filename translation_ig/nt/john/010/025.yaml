    text: Ma ọ bụ, “site n’ikike Nna m.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ha na-agba akaebe gbasara m.”
    reason: lexical_alternative
  revision_rationale: The revision makes the Greek preposition περὶ (‘concerning/about’) explicit in the main text, without reducing the legal-witness nuance of μαρτυρεῖ or changing the emphasis supplied by ταῦτα. Footnote a is anchored directly to ‘n’aha,’ the expression it explains.
