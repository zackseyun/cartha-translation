id: JHN.10.13
reference: John 10:13
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸀ὅτι μισθωτός ἐστιν καὶ οὐ μέλει αὐτῷ περὶ τῶν προβάτων.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/013.yaml
  text: because he is a hired hand and does not care about the sheep.
translation:
  language: ig
  text: n’ihi na ọ bụ onye e goro ọrụ, ọ dịghịkwa eche banyere atụrụ ndị ahụ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι
  choice: n’ihi na
  rationale: N’ebe a, okwu ahụ na-enye ihe mere onye e goro ọrụ ji gbapụ dịka e kwuru n’ahịrịokwu bu ụzọ; “n’ihi na” na-egosipụta njikọ ihe kpatara ihe nke ọma n’Igbo.
- source_word: μισθωτός
  choice: onye e goro ọrụ
  rationale: Okwu a pụtara onye na-arụ ọrụ maka ụgwọ, ọ bụghị onye nwe atụrụ. Nhọrọ a bụ Igbo nkịtị ma doo anya, na-enweghị itinye nkọwa ọzọ na-adịghị n’ederede.
- source_word: οὐ μέλει αὐτῷ περὶ
  choice: ọ dịghịkwa eche banyere
  rationale: Nkebi okwu Grik a na-egosi enweghị nlekọta ma ọ bụ nchegbu. “Ọ dịghị eche banyere” bụ okwu Igbo e ji eme ihe nke na-edobe ịdị arọ nke ikpe omume ahụ.
- source_word: τῶν προβάτων
  choice: atụrụ ndị ahụ
  rationale: Nke a na-asụgharị aha Grik ahụ kpọmkwem dịka “atụrụ,” ma na-edobe onyinyo ọrụ onye ọzụzụ atụrụ dị n’okwu ahụ.
theological_decisions:
- issue: Otu e si kọwaa onye e goro ọrụ n’iche ya na ezigbo onye ọzụzụ atụrụ
  choice: E gosipụtara ya naanị dịka onye e goro ọrụ nke na-adịghị eche banyere atụrụ, dịka ederede si kwuo.
  alternative: Ịkọwa onye e goro ọrụ ahụ dịka otu ndị ndu ụgha kpọmkwem, ma ọ bụ ime ka enweghị nchegbu ya yie naanị ịdị anya n’ọrụ.
  rationale: Amaokwu ahụ n’onwe ya na-ekwu ihe kpatara omume ya, ma ọ naghị akpọ onye ahụ otu ndị mmadụ kpọmkwem. Nsụgharị ahụ na-edobe esemokwu ya na ezigbo onye ọzụzụ atụrụ n’etinyeghị ozizi ọzọ.
translation_notes:
  register: Igbo Izugbe nke oge a, dị mfe nghọta ma nwee ugwu. E ji “onye e goro ọrụ” mee ka echiche ịrụ ọrụ maka ụgwọ doo anya; e debere “atụrụ” iji chekwaa onyinyo pastoral nke okwu ahụ.
