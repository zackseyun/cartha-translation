  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἐγένετο ⸀τότε τὰ ἐγκαίνια ἐν ⸀τοῖς Ἱεροσολύμοις· ⸀χειμὼν ἦν,
base_translation:
  language: en
  yaml_path: translation/nt/john/010/022.yaml
  text: At that time the Feast of Dedication took place in Jerusalem[a]. It was winter,
translation:
  language: ig
  text: N’oge ahụ, Ememme Nraranye mere na Jerusalem.[a] Ọ bụ oge oyi,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịkpọ ya “Hanukkah,” bụ́ ememme ndị Juu ji echeta nraranye Ụlọ Nsọ ahụ ọzọ.
    reason: cultural_note
lexical_decisions:
- source_word: Ἐγένετο
  choice: e mere
  rationale: N'ebe a, ngwaa ahụ na-egosi na ememme ahụ mere n'oge a kpọrọ aha; ‘e mere’ bụ Igbo nkịtị ma na-edobe echiche nke ihe omume.
- source_word: τότε
  choice: N’oge ahụ
  rationale: Nke a na-egosi mgbanwe oge n'akụkọ ahụ n'ụzọ doro anya ma dịkwa mfe n'Igbo.
- source_word: τὰ ἐγκαίνια
  choice: Ememme Nraranye Ụlọ Nsọ
  rationale: Okwu Grik a na-ezo aka n'ememme e ji echeta nraranye Ụlọ Nsọ ahụ ọzọ. Nsụgharị a na-akọwa ihe ememme ahụ bụ nye ndị na-amaghị aha Hanukkah.
- source_word: ἐν τοῖς Ἱεροσολύμοις
  choice: na Jerusalem
  rationale: Nke a bụ ụzọ Igbo dị mfe ma kwekọọ n'okwu ebe nke Grik.
- source_word: χειμὼν ἦν
  choice: Ọ bụ oge oyi
  rationale: Nke a na-edobe nkọwa oge dị n'ahịrịokwu Grik n'ụzọ ebumpụta ụwa n'Igbo.
theological_decisions:
- issue: Ihe τὰ ἐγκαίνια pụtara
  choice: Ememme Nraranye Ụlọ Nsọ
  alternative: Hanukkah; Ememme Nraranye
  rationale: E tinyere nkọwa okwu Grik n'ahịrịokwu bụ isi kama iji naanị aha Hanukkah, ka ihe ọ pụtara doo ndị na-agụ ya anya. A debere aha a maara nke ọma n'okpuru peeji.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. ‘Ụlọ Nsọ’ na-eme ka o doo anya na nraranye a metụtara temple dị na Jerusalem; akara [a] dị n'ahịrịokwu bụ isi dịka achọrọ.
