  text: εἰ οὐ ποιῶ τὰ ἔργα τοῦ πατρός μου, μὴ πιστεύετέ μοι·
base_translation:
  language: en
  yaml_path: translation/nt/john/010/037.yaml
  text: If I am not doing the works of my Father[a], do not believe me;
translation:
  language: ig
  text: Ọ bụrụ na anaghị m arụ ọrụ nke Nna m, unu ekwela m[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “unu ekwela ihe m na-ekwu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ οὐ ποιῶ
  choice: Ọ bụrụ na anaghị m arụ
  rationale: “Ọ bụrụ na” na-ewebata ọnọdụ, ebe “anaghị m arụ” na-egosi omume a na-agọnahụ n’oge a ma na-edobe onye mbụ otu.
- source_word: τὰ ἔργα
  choice: ọrụ
  rationale: “Ọrụ” bụ okwu Igbo sara mbara maka omume ma ọ bụ ọrụ ndị a na-ekwu banyere ha; n’Igbo, otu ụdị okwu a nwere ike ịrụ ọrụ dịka otu ma ọ bụ ọtụtụ dịka ihe gbara ya gburugburu si dị.
- source_word: τοῦ πατρός μου
  choice: Nna m
  rationale: Nke a na-edobe njikọ nke genitive n’ụzọ dị nkenke ma dịkwa eke n’Igbo. E ji mkpụrụedemede ukwu dee “Nna” n’ihi na ọ bụ aha e ji akpọ Chineke n’ọnọdụ a.
- source_word: μὴ πιστεύετέ μοι
  choice: unu ekwela na m
  rationale: “Unu ekwela” na-enye iwu mgbochi e nyere ọtụtụ ndị, ebe “na m” na-edobe onye a na-atụkwasị nkwenye ahụ n’ebe ọ nọ. Ọ nwekwara ike ịgụnye echiche nke ikwere ihe onye ahụ na-ekwu.
theological_decisions:
- issue: Ihe πιστεύω tinyere dative μοι pụtara
  choice: “unu ekwela na m” — nkwenye ma ọ bụ ntụkwasị obi a na-atụkwasị Jizọs
  alternative: “unu ekwela ihe m na-ekwu”
  rationale: Ihe owuwu Grik ahụ nwere ike ịpụta ikwere mmadụ, ma n’ọnọdụ a ọ pụkwara ịgụnye ikwere ihe onye ahụ kwuru. Isi ederede na-edobe okwu ahụ n’ebe onye ahụ nọ, ebe nkọwa ala peeji na-egosi nghọta nke gbasara okwu ya.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ dị mfe, dị ugwu, ma bụrụ nke ndị na-agụ akwụkwọ taa ga-aghọta. E tinyere akara [a] ozugbo n’akụkụ okwu ọ na-akọwa.
