    text: Ma ọ bụ, “unu ekwela ihe m na-ekwu.”
    reason: lexical_alternative
  revision_rationale: The revision replaces “ekwela na m” with “ekwela m” to preserve the Greek dative's direct sense, “do not believe me,” without importing a more specific theological construal. It also uses the explicit possessive construction “ọrụ nke Nna m” and places the existing lexical-alternative footnote at its proper anchor. No change is made to the conditional, ongoing-action sense, or the collective rendering of the Greek plural “works.”
