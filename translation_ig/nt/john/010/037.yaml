review_pass:
  verdict: revise
  source_fidelity: The conditional clause and present-tense sense are conveyed well. However, "ekwela na m" ordinarily expresses believing in/trusting in Jesus and can therefore overstate the personal-faith sense. πιστεύω with the dative μοι here is most directly "believe me," with the testimonial/propositional nuance appropriately retained in a footnote.
  naturalness: '"Ọ bụrụ na anaghị m arụ ọrụ nke Nna m" is clear, natural Standard Igbo. "Unu ekwela m" is the more idiomatic and source-correspondent way to express the prohibition with Jesus as the person believed.'
  terminology: '"Nna" is appropriately capitalized as the Johannine divine title. "ọrụ" can function collectively in Igbo for the Greek plural ἔργα without an artificial plural marker. The footnote is a valid lexical alternative, but its anchor should immediately follow "m," the expression it clarifies.'
  issues:
  - severity: medium
    issue: The main text uses “unu ekwela na m.”
    rationale: The added preposition na shifts the construction toward “do not believe in me / put faith in me,” whereas Greek πιστεύετε μοι uses a dative and most directly means “do not believe me.” The latter retains the overlap between believing Jesus and accepting his testimony without selecting the stronger interpretive sense.
  - severity: low
    issue: Footnote anchor is placed after the final punctuation rather than beside the expression μοι it explains.
    rationale: Moving [a] directly after “m” makes the lexical relationship transparent.
  revised_text: Ọ bụrụ na anaghị m arụ ọrụ nke Nna m, unu ekwela m[a].
