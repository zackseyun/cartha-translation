- from: Ọ bụrụ na anaghị m arụ ọrụ Nna m, unu ekwela na m.[a]
  to: Ọ bụrụ na anaghị m arụ ọrụ nke Nna m, unu ekwela m[a].
  rationale: The revision replaces “ekwela na m” with “ekwela m” to preserve the Greek dative's direct sense, “do not believe me,” without importing a more specific theological construal. It also uses the explicit possessive construction “ọrụ nke Nna m” and places the existing lexical-alternative footnote at its proper anchor. No change is made to the conditional, ongoing-action sense, or the collective rendering of the Greek plural “works.”
