id: JHN.10.27
reference: John 10:27
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τὰ πρόβατα τὰ ἐμὰ τῆς φωνῆς μου ⸀ἀκούουσιν, κἀγὼ γινώσκω αὐτά, καὶ ἀκολουθοῦσίν μοι,
base_translation:
  language: en
  yaml_path: translation/nt/john/010/027.yaml
  text: My sheep hear my voice, and I know them, and they follow me.
translation:
  language: ig
  text: Atụrụ m na-anụ olu m, amakwa m ha; ha na-esokwa m.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὰ πρόβατα τὰ ἐμὰ
  choice: Atụrụ m
  rationale: Nke a bụ ụzọ Igbo nkịtị na nkenke si egosi atụrụ ndị bụ nke onye na-ekwu okwu, ma na-edobe ihe atụ onye ọzụzụ atụrụ ahụ.
- source_word: τῆς φωνῆς μου
  choice: olu m
  rationale: “Olu” dabara n’ọnọdụ a ebe atụrụ na-amata olu onye ọzụzụ ha; ọ ka “ụda” kọwaa ihe Grik ahụ pụtara.
- source_word: ἀκούουσιν
  choice: na-anụ
  rationale: Ụdị a na-egosi omume a na-eme mgbe niile, ma ọ naghị atụkwasị echiche nke ilekwasị anya nke “na-ege ntị” pụrụ iweta.
- source_word: κἀγὼ γινώσκω αὐτά
  choice: ama m ha
  rationale: “Ama m ha” bụ Igbo e ji asụ okwu n'ụzọ eke maka “M maara ha,” ma na-ahapụ ịdị omimi nke mmekọrịta dị na γινώσκω n’enweghị nkọwa agbakwunyere.
- source_word: καὶ ἀκολουθοῦσίν μοι
  choice: ha na-esokwa m
  rationale: “Na-esokwa” na-egosi omume na-aga n’ihu ma ọ bụ àgwà ha na-eme mgbe niile; mkpụrụokwu “kwa” na-egosipụta καί nke abụọ n'ụzọ Igbo dị eke.
theological_decisions:
- issue: Ike mmekọrịta dị na γινώσκω n’ihe atụ onye ọzụzụ atụrụ na atụrụ
  choice: ama m ha
  alternative: amaara m ha nke ọma / amatara m ha
  rationale: A hapụrụ ya dịka “ama m ha” ka e chekwaa obosara na ịdị omimi nke okwu Grik ahụ, n’enweghị ịkọwa ya dịka naanị ịmata onye ma ọ bụ itinye nkọwa ozizi pụrụ iche.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. A họọrọ “Atụrụ m” kama ụdị dị arọ dịka “atụrụ ndị bụ nke m”; usoro ahịrịokwu ahụ na-adị nkenke ma na-eso njikọ atọ dị na isi mmalite.
