  yaml_path: translation/nt/john/010/002.yaml
  text: But the one who enters through the door is the shepherd of the sheep[a].
translation:
  language: ig
  text: Ma onye na-esi n’ọnụ ụzọ abata bụ onye na-azụ atụrụ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “bụ otu onye na-azụ atụrụ.” N’asụsụ Grik, aha prediket ahụ, ποιμήν (“onye na-azụ atụrụ”), enweghị article, ma ọnọdụ okwu ahụ na-akwado nghọta na ọ bụ onye na-azụ atụrụ ziri ezi, nke dị iche n’ebe ndị na-abata n’ụzọ na-ezighị ezi nọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ εἰσερχόμενος
  choice: Ma onye na-esi ... abata
  rationale: Nkebi ahịrị a nke nwere participle na article na-arụ ọrụ dị ka aha, na-ezo aka n’onye e ji omume ịbanye mara. “Ma” na-egosi ọdịiche dị n’etiti onye a na onye ohi na onye na-apụnara mmadụ ihe e kwuru n’amaokwu bu ya ụzọ.
- source_word: διὰ τῆς θύρας
  choice: n’ọnụ ụzọ
  rationale: διά ya na genitive na-egosi ụzọ e si agafe ma banye. N’Igbo, “isi n’ọnụ ụzọ abata” na-enye echiche a n’ụzọ doro anya ma bụrụkwa okwu e ji eme ihe kwa ụbọchị.
- source_word: ποιμήν
  choice: onye na-azụ atụrụ ndị ahụ
  rationale: Nke a bụ ụzọ Igbo nkịtị si akọwa onye ọrụ ya bụ ilekọta na ịzụ atụrụ. Mmeju “ndị ahụ” na-egosi n’ụzọ kwekọrọ n’ọnọdụ okwu ahụ na ọ bụ onye na-azụ atụrụ ziri ezi, ma e debere nhọrọ nke “otu onye na-azụ atụrụ” n’ala peeji n’ihi na aha predicate Grik ahụ enweghị article.
- source_word: τῶν προβάτων
  choice: atụrụ ndị ahụ
  rationale: πρόβατα pụtara atụrụ n’onwe ya; e jighị “ìgwè atụrụ” dochie ya, ka ihe oyiyi okwu Grik ahụ ghara ịgbanwe.
theological_decisions:
- issue: Ma ποιμήν bụ aha a kapịrị ọnụ ka ọ bụ otu onye n’ime ọtụtụ
  choice: onye na-azụ atụrụ ndị ahụ
  alternative: otu onye na-azụ atụrụ ndị ahụ
  rationale: Ọnọdụ okwu ahụ na-eme ka onye na-abata n’ụzọ ziri ezi dị iche n’ebe ndị ohi na ndị na-apụnara mmadụ ihe nọ, ya mere ọ na-akwado echiche nke onye na-azụ atụrụ ziri ezi a maara. Otú ọ dị, ebe ποιμήν na-enweghị article, e debere ohere nke ịghọta ya dị ka “otu onye na-azụ atụrụ” n’ala peeji, n’etinyeghị nkwupụta Kraịst ọzọ karịrị ihe atụ dị n’amaokwu a.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta mee ntụgharị a. “Onye na-azụ atụrụ” bụ okwu eke karịa otu aha teknụzụ, “isi n’ọnụ ụzọ abata” na-egosikwa mmegharị διά na-achị genitive.
