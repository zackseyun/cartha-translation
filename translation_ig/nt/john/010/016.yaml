id: JHN.10.16
reference: John 10:16
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἄλλα πρόβατα ἔχω ἃ οὐκ ἔστιν ἐκ τῆς αὐλῆς ταύτης· κἀκεῖνα ⸂δεῖ με⸃ ἀγαγεῖν, καὶ τῆς φωνῆς μου ἀκούσουσιν, καὶ ⸀γενήσονται μία ποίμνη, εἷς ποιμήν.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/016.yaml
  text: And I have other sheep that are not from this sheepfold[a]. I must bring them also, and they will listen to my voice. Then there will be one flock[b], one shepherd.
translation:
  language: ig
  text: Enwekwara m atụrụ ndị ọzọ na-esighị n'ogige atụrụ a. Aghaghị m idutekwa ha bịa, ha ga-ege olu m ntị[a]. A ga-enwe otu ìgwè atụrụ na otu onye ọzụzụ atụrụ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “ha ga-anụ olu m.” Ngwaa Grik ahụ pụrụ ịpụta “ịnụ” ma ọ bụ “ige ntị”; n'ebe a, o yiri ka ọ gụnyere ịnụ nke na-anabata ma na-eso.
    reason: lexical_alternative
  - marker: b
    text: 'Grik ji okwu abụọ dị iche: “ogige atụrụ” (αὐλή), ya bụ ebe e mechiri atụrụ, na “ìgwè atụrụ” (ποίμνη), ya bụ atụrụ ndị ahụ n''onwe ha. Ya mere, nkebi ikpeazụ bụ “otu ìgwè atụrụ,” ọ bụghị “otu ogige atụrụ.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ἄλλα πρόβατα
  choice: atụrụ ndị ọzọ
  rationale: “Atụrụ” bụ okwu Igbo a na-ejikarị ekwu sheep; “ndị ọzọ” na-egosi na ha dị iche ma gbakwunyere ndị e kwuru okwu ha.
- source_word: αὐλή
  choice: ogige atụrụ
  rationale: N'ihe atụ gbasara onye ọzụzụ atụrụ, okwu a pụtara ogige e ji echekwa atụrụ, ọ bụghị naanị mbara ezi n'ozuzu.
- source_word: κἀκεῖνα
  choice: ha ... kwa
  rationale: Ọ na-alaghachi n'“atụrụ ndị ọzọ”; itinye “kwa” na ngwaa bụ ụzọ Igbo dị n'okike isi gosipụta echiche nke ‘ha onwe ha kwa.’
- source_word: δεῖ με ἀγαγεῖν
  choice: Aga m akpọtakwa ha
  rationale: “Aga m” n'usoro a na-egosipụta ihe dịịrị Jizọs ime, ebe “kpọta” na-egosipụta iduru ha bịa. A naghị eji nkọwa ogologo nke ga-eme ka ahịrịokwu ahụ sie ike.
- source_word: τῆς φωνῆς μου ἀκούσουσιν
  choice: ha ga-egekwa olu m ntị
  rationale: “Ige olu ntị” na-egosipụta ịnụ nke na-anabata ma na-eso, ọ bụghị naanị ụda rutere ntị; ihe ọzọ a pụrụ ịsụ bụ ‘ha ga-anụ olu m.’
- source_word: γενήσονται
  choice: Ha ga-abụkwa
  rationale: Nke a na-edobe echiche ọdịnihu nke ịbụ ma ọ bụ ịghọ otu ìgwè.
- source_word: μία ποίμνη
  choice: otu ìgwè atụrụ
  rationale: ποίημνη bụ ìgwè atụrụ n'onwe ha, ọ bụghị ogige a na-etinye ha; ntụgharị a na-edobe ọdịiche ya na αὐλή.
- source_word: εἷς ποιμήν
  choice: otu onye ọzụzụ atụrụ
  rationale: Nke a bụ okwu Igbo doro anya ma kwụ ọtọ maka onye na-azụ atụrụ.
theological_decisions:
- issue: Idobe ọdịiche dị n'etiti αὐλή na ποίμνη
  choice: ogige atụrụ a ... otu ìgwè atụrụ
  alternative: otu ogige atụrụ ... otu ogige atụrụ
  rationale: 'Grik ji aha abụọ dị iche: αὐλή bụ ogige, ποίμνη abụrụ ìgwè atụrụ. Iji otu okwu sụgharịa ha abụọ ga-ekpuchi ọdịiche ahụ ma nwee ike itinye echiche nke otu usoro ma ọ bụ ụlọ ọrụ n''amaokwu ahụ.'
- issue: Ike nke δεῖ
  choice: Aga m akpọtakwa ha
  alternative: Ọ dị mkpa ka m kpọtakwa ha
  rationale: Nke a na-egosi ihe Jizọs ga-emerịrị n'ụzọ Igbo na-aga were were, na-enweghị ịkọwa ihe kpatara mkpa ahụ n'ụzọ ozizi pụrụ iche.
- issue: Njikọ nke nkebi ikpeazụ
  choice: Ha ga-abụkwa otu ìgwè atụrụ, nwee otu onye ọzụzụ atụrụ
  alternative: Mgbe ahụ, a ga-enwe otu ìgwè atụrụ na otu onye ọzụzụ atụrụ
  rationale: 'Nke a na-anọ nso n''usoro Grik: ‘ha ga-abụ otu ìgwè atụrụ, otu onye ọzụzụ atụrụ,’ ma ghara itinye ‘mgbe ahụ’ nke na-adịghị n''ederede.'
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji “ogige atụrụ” na “ìgwè atụrụ” mee ka ọdịiche okwu Grik pụta ìhè. Akara nkọwa ala [a] na [b] dị n'ederede isi.
