    reason: alternative_reading
  revision_rationale: The revision restores the force of δεῖ with 'Aghaghị m,' uses 'idutekwa ha bịa' for the bring/lead sense of ἀγαγεῖν, and recasts the final clause as a natural impersonal future that clearly represents μία ποίμνη, εἷς ποιμήν. It retains the source's lexical distinction between the enclosure and the flock and relocates footnote [a] to its precise anchor.
