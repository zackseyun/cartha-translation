id: JHN.10.17
reference: John 10:17
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: διὰ τοῦτό ⸂με ὁ πατὴρ⸃ ἀγαπᾷ ὅτι ἐγὼ τίθημι τὴν ψυχήν μου, ἵνα πάλιν λάβω αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/017.yaml
  text: For this reason the Father loves me[a], because I lay down my life so that I may take it up again.
translation:
  language: ig
  text: Ọ bụ nke a mere Nna ji hụ m n’anya[a], n’ihi na ana m atọgbọ ndụ m ka m wee nara ya ọzọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “mkpụrụ obi m.” N’ebe a, ψυχή yiri ka ọ pụtara “ndụ,” ya bụ ndụ Jizọs na-atọgbọ n’ọnwụ ma na-anara ọzọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Ọ bụ nke a mere
  rationale: Nke a na-egosipụta njikọ nke ihe kpatara ya n'ụzọ doro anya ma bụrụkwa okwu Igbo a na-asụkarị.
- source_word: με ὁ πατὴρ ἀγαπᾷ
  choice: Nna ji hụ m n’anya
  rationale: E debere ‘Nna’ dịka aha nwere njirimara, na-etinyeghị ‘Nna m’ nke Grik na-ekwughị kpọmkwem.
- source_word: ὅτι
  choice: n’ihi na
  rationale: Ọ na-ebute ihe kpatara ịhụnanya Nna ahụ, ya mere okwu na-egosi ihe kpatara ya dabara n’ebe a.
- source_word: τίθημι
  choice: ana m atọgbọ
  rationale: ‘Ịtọgbọ ndụ’ na-egosi na Jizọs ji aka ya nye ndụ ya n’ọnwụ, ma na-edobe ihe oyiyi dị na okwu Grik.
- source_word: τὴν ψυχήν μου
  choice: ndụ m
  rationale: N’ebe a ψυχή pụtara ndụ mmadụ nke a na-enye n’ọnwụ, ọ bụghị ikwusi ike banyere mkpụrụ obi dịka ihe dị iche n’ahụ.
- source_word: ἵνα
  choice: ka m wee
  rationale: Nke a na-edobe echiche ebumnuche dị na ἵνα n’Igbo dị mfe ma dị ndụ.
- source_word: πάλιν
  choice: ọzọ
  rationale: Ọ na-egosi na a ga-enwetaghachi ndụ ahụ mgbe a tọgbọsịrị ya.
- source_word: λάβω αὐτήν
  choice: nara ya ọzọ
  rationale: λαμβάνω nwere ike ịpụta ‘ịnara’ ma ọ bụ ‘ịnata’; ‘nara ya ọzọ’ na-edobe ịdị obosara nke okwu Grik ma kwekọọ n’ihe gbasara iweghachi ndụ.
theological_decisions:
- issue: Ihe ψυχή pụtara n’okwu gbasara onyinye onwe Kraịst
  choice: A sụgharịrị ya ‘ndụ’
  alternative: mkpụrụ obi m
  rationale: Amaokwu a na-ekwu maka ọnwụ Jizọs nke o ji aka ya họrọ na iweghachi ndụ ya; ‘mkpụrụ obi’ nwere ike ibute nkọwa gbasara nkewa ahụ na mkpụrụ obi nke amaokwu ahụ anaghị ekwusi ike.
- issue: Ike ἵνα ya na λάβω nwere
  choice: A sụgharịrị ya ‘ka m wee nara ya ọzọ’
  alternative: ka m ga-anara ya ọzọ
  rationale: ‘Ka m wee’ na-echekwa echiche ebumnuche ma ọ naghị eme ka subjunctive Grik bụrụ naanị amụma banyere ọdịnihu.
- issue: Ma λάβω pụtara ịnara n’ike ma ọ bụ ịnata
  choice: A họọrọ ‘nara’
  alternative: nata
  rationale: ‘Nara’ dabara n’ọnọdụ Jọn 10:17–18, ma okwu Grik n’onwe ya nwere ike ịgụnye echiche ịnata; a zere ịgbakwunye okwu nkọwa na-adịghị na amaokwu a.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-edobe usoro ihe kpatara ya na ebumnuche ya, ma zere itinye nkọwa ụka pụrụ iche.
