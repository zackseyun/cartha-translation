id: JHN.10.28
reference: John 10:28
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: κἀγὼ ⸂δίδωμι αὐτοῖς ζωὴν αἰώνιον⸃, καὶ οὐ μὴ ἀπόλωνται εἰς τὸν αἰῶνα, καὶ οὐχ ἁρπάσει τις αὐτὰ ἐκ τῆς χειρός μου.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/028.yaml
  text: And I give them eternal life, and they will certainly never perish forever, and no one will snatch them out of my hand.
translation:
  language: ig
  text: M na-enye ha ndụ ebighị ebi, ha agaghịkwa ala n’iyi ma ọlị ruo mgbe ebighị ebi; ọ dịghịkwa onye ọ bụla ga-anapụ ha n’aka m.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ζωὴν αἰώνιον
  choice: ndụ ebighị ebi
  rationale: Nke a bụ ụzọ Igbo doro anya ma guzosie ike isi kwuo ndụ nke oge na-adịghị agwụ agwụ.
- source_word: οὐ μὴ ἀπόλωνται εἰς τὸν αἰῶνα
  choice: ha agaghịkwa ala n’iyi ma ọlị ruo mgbe ebighị ebi
  rationale: “Ma ọlị” na-egosipụta nkwusiri ike nke οὐ μή, ebe “ruo mgbe ebighị ebi” na-edobe εἰς τὸν αἰῶνα n’ụzọ pụtara ìhè, ọbụna ma okwu abụọ ahụ na-emesi otu echiche ike.
- source_word: ἁρπάσει
  choice: ga-anapụ
  rationale: “Ịnapụ” na-egosi iwepụ mmadụ n’ike n’aka onye ọzọ, nke kwekọrọ na ihe ngwaa Grik a pụtara n’ebe a.
- source_word: ἐκ τῆς χειρός μου
  choice: n’aka m
  rationale: Akpaalaokwu Igbo a na-edobe onyinyo nke aka dịka ebe nchekwa na ikike, n’enweghị ịgbasa nkọwa ya.
theological_decisions:
- issue: Ike nke nkwupụta na oge ọ na-eru
  choice: ha agaghịkwa ala n’iyi ma ọlị ruo mgbe ebighị ebi
  alternative: ha agaghị ala n’iyi ma ọlị
  rationale: Edobere ma nkwusiri ike nke οὐ μή ma ahịrịokwu εἰς τὸν αἰῶνα; a zere iwepụ “ruo mgbe ebighị ebi” ma ọ bụ ịkọwa kpọmkwem ihe nke a pụtara n’usoro ozizi nzọpụta.
- issue: Onye nwere ike ịnapụ ha
  choice: ọ dịghịkwa onye ọ bụla
  alternative: ọ dịghịkwa onye
  rationale: “Onye ọ bụla” na-egosipụta obosara nke τις n’okwu a ma ghara ikpebi esemokwu ozizi ndị karịrị ihe amaokwu ahụ kwuru.
translation_notes:
  register: Asụsụ bụ Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. E debere usoro ahịrịokwu ahụ nso na Grik, ma a haziri ya ka ọ na-ada nke ọma n’Igbo.
