  text: ἔλεγον δὲ πολλοὶ ἐξ αὐτῶν· Δαιμόνιον ἔχει καὶ μαίνεται· τί αὐτοῦ ἀκούετε;
base_translation:
  language: en
  yaml_path: translation/nt/john/010/020.yaml
  text: But many of them were saying[a], “He has a demon and is insane. Why do you listen to him?”
translation:
  language: ig
  text: Ma ọtụtụ n’ime ha nọ na-ekwu, “O nwere mmụọ ọjọọ[a], ara na-agbakwa ya. Gịnị mere unu ji ege ya ntị?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Mmụọ ọjọọ ji ya, ara na-agbakwa ya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγον
  choice: nọ na-ekwu
  rationale: Oge imperfect na-egosi okwu ha nọgidere ma ọ bụ na-eme ugboro ugboro n’ọnọdụ ahụ.
- source_word: δὲ
  choice: Ma
  rationale: Ọ na-egosi ọdịiche dị n’etiti okwu ndị a na mmeghachi omume dị mma e kwuru tupu ya.
- source_word: πολλοὶ ἐξ αὐτῶν
  choice: ọtụtụ n’ime ha
  rationale: Nke a bụ ụzọ Igbo si ekwu n'ụzọ ebumpụta ụwa na ọ bụ ọtụtụ ndị sitere n’ìgwè ahụ, ọ bụghị ha niile.
- source_word: Δαιμόνιον ἔχει
  choice: Mmụọ ọjọọ bi n’ime ya
  rationale: N’Igbo nke oge a, nke a na-egosipụta ebubo na mmụọ ọjọọ nọ n’ime mmadụ, ma na-edebe ihe okwu Grik ahụ pụtara n'ụzọ doro anya.
- source_word: μαίνεται
  choice: isi adịghịkwa ya mma
  rationale: Akpaalaokwu Igbo a na-egosi na ndị ahụ boro ya ebubo na uche adịghị ya mma, n’enweghị ịtụgharị ya ka ọ bụrụ nchọpụta ahụike.
- source_word: τί αὐτοῦ ἀκούετε;
  choice: Gịnị mere unu ji ege ya ntị?
  rationale: τί na-arụ ọrụ dịka ajụjụ ‘gịnị mere,’ ebe ἀκούω ya na genitive pụtara ige mmadụ ntị; ụdị a na-ebute ụda nkwutọ nke ajụjụ ahụ.
theological_decisions:
- issue: Otú e si sụgharịa ebubo ọjọọ ndị mmadụ boro Jizọs
  choice: Mmụọ ọjọọ bi n’ime ya, isi adịghịkwa ya mma
  alternative: Mmụọ ọjọọ ji ya, ara na-agbakwa ya
  rationale: Nhọrọ a na-edebe ebubo abụọ ahụ iche dịka Grik si mee, ghara ime ka ha dị nro ma ọ bụ tinye nkọwa ozizi ma ọ bụ nke ahụike na-adịghị n’ederede.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke oge a, dị ugwu ma dị mfe nghọta. E ji ‘nọ na-ekwu’ chekwaa omume na-aga n’ihu nke imperfect; e zere okwu ahụike pụrụ ime ka ebubo μαίνεται bụrụ nchọpụta ọrịa kpọmkwem.
