source:
  edition: SBLGNT
  text: εἰ ἐκείνους εἶπεν θεοὺς πρὸς οὓς ὁ λόγος τοῦ θεοῦ ἐγένετο, καὶ οὐ δύναται λυθῆναι ἡ γραφή,
base_translation:
  language: en
  yaml_path: translation/nt/john/010/035.yaml
  text: If he called those to whom the word of God came ‘gods’—and the Scripture cannot be broken—[a][b]
translation:
  language: ig
  text: Ọ bụrụ na ọ kpọrọ ndị ahụ okwu Chineke bịara n’ebe ha nọ “chi”[a]—ma Akwụkwọ Nsọ enweghị ike imebi[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị nwere ọdịdị chi.” Grik kwuru “chi,” na-ekwughachi Abụ Ọma 82:6; ụfọdụ ndị na-akọwa ya na-ekwu na ndị a a kpọrọ aha bụ ndị ikpe mmadụ.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “a pụghị ịkagbu Akwụkwọ Nsọ” ma ọ bụ “a pụghị ileghara Akwụkwọ Nsọ anya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ
  choice: Ọ bụrụ na
  rationale: Na-edobe usoro arụmụka nke ọnọdụ dị na Grik n'ụzọ Igbo nkịtị.
- source_word: ἐκείνους
  choice: ndị ahụ
  rationale: Na-ezo aka n’ụfọdụ ndị Akwụkwọ Nsọ kwuru okwu banyere ha, n’etinyeghị ‘ndị ikom’ nke na-adịghị n’ihe odide Grik.
- source_word: εἶπεν
  choice: ọ kpọrọ
  rationale: N’usoro a, ngwaa ahụ pụtara ịkpọ ma ọ bụ ịkọwa ha dị ka ‘chi’; ‘ọ kpọrọ’ bụ Igbo doro anya karịa nsụgharị nkịtị ‘ọ sịrị ha chi.’
- source_word: θεοὺς
  choice: chi
  rationale: Na-edobe kpọmkwem okwu e hotara na Abụ Ọma 82:6, na-akọwaghị ya ozugbo dị ka ndị ikpe ma ọ bụ ndị mmụọ.
- source_word: πρὸς οὓς
  choice: ndị ... bịakwutere
  rationale: Na-egosi ntụziaka nke okwu Chineke bịara n’ebe ndị ahụ nọ.
- source_word: ὁ λόγος τοῦ θεοῦ
  choice: okwu Chineke
  rationale: Ọ bụ okwu ma ọ bụ nkwupụta sitere n’aka Chineke n’ebe a, ọ bụghị aha Logos nke Jọn 1.
- source_word: ἐγένετο
  choice: bịakwutere
  rationale: Na-enye okwu Igbo ebumpụta ụwa maka echiche na okwu Chineke bịara ruo ndị ahụ.
- source_word: οὐ δύναται λυθῆναι
  choice: a pụghị imebi
  rationale: Na-edobe ihe oyiyi nke Grik ma na-egosi na a pụghị ịkagbu ma ọ bụ iwepụ ikike Akwụkwọ Nsọ.
- source_word: ἡ γραφή
  choice: ihe e dere n’Akwụkwọ Nsọ
  rationale: Na-egosi ederede Akwụkwọ Nsọ nwere ikike, ma na-ada nke ọma n’Igbo n’usoro okwu a.
theological_decisions:
- issue: Ihe ‘chi’ pụtara n’okwu Jizọs hotara
  choice: Edobere ‘chi’ n’isiokwu ahụ n’enweghị nkọwa na ọ bụ ‘ndị ikpe’ ma ọ bụ ‘ndị mmụọ.’
  alternative: ndị ikpe; ndị nwere ọdịdị chi
  rationale: Arụmụka Jizọs dabere n’okwu Abụ Ọma 82:6 kpọmkwem. Ịgbanwe ya gaa ‘ndị ikpe’ ga-ekpebi ihe ederede ahụ kpachapụrụ anya hapụ ka ọ nwee esemokwu nkọwa.
- issue: Ike okwu ahụ bụ ‘a pụghị imebi ihe e dere n’Akwụkwọ Nsọ’
  choice: a pụghị imebi ihe e dere n’Akwụkwọ Nsọ
  alternative: a pụghị ịkagbu ya; a pụghị iwepụ ya n’ụzọ
  rationale: Nsụgharị a na-echekwa ihe oyiyi nke λυθῆναι ma na-egosikwa na a pụghị ime ka Akwụkwọ Nsọ ghara ịdị irè, n’etinyeghị nkwupụta okpukpe pụrụ iche karịa ihe amaokwu ahụ kwuru.
translation_notes:
  register: Igbo ọkọlọtọ, nke oge a ma dị ùgwù. A họọrọ usoro okwu dị mfe nghọta nye ndị nkịtị, ebe e chekwara nrụgide nkọwa dị n’okwu ‘chi’ na ike Akwụkwọ Nsọ. Akara nkọwa ala peeji [a] na [b] dị n’isiokwu ahụ.
