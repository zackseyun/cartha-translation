  yaml_path: translation/nt/john/010/023.yaml
  text: And Jesus was walking in the temple courts[b][a], in Solomon’s Portico.
translation:
  language: ig
  text: Jizọs nọ na-ejegharị n’ogige ụlọ nsọ[a], n’ime mbara ogidi Solomọn[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Okwu Grik bụ ἱερόν, nke na-ezo aka n’ogige na mpaghara ụlọ nsọ dum, ọ bụghị naanị ebe nsọ dị n’ime ya.
    reason: cultural_note
  - marker: b
    text: A pụkwara ịsụgharị ya “n’ụlọ ụkwụ-ogidi Solomọn.” Okwu Grik στοά na-ezo aka n’ụzọ ije e kpuchiri ekpuchi nke ogidi kwụ n’ahịrị n’akụkụ ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: nọkwa
  rationale: Na-ejikọta amaokwu a na ihe bu ya ụzọ n'ụzọ Igbo dị mma, n’etinyeghị echiche oge ọzọ na-adịghị na Grik.
- source_word: περιεπάτει
  choice: nọ na-ejegharị
  rationale: Ụdị imperfect na-egosi omume nọ na-aga n’ihu n’oge gara aga; ‘nọ na-ejegharị’ na-echekwa echiche ahụ.
- source_word: ἱερῷ
  choice: ogige ụlọ nsọ
  rationale: ἱερόν na-ezo aka n’ebe niile gbara ụlọ nsọ gburugburu, ọ bụghị naanị ime ụlọ nsọ ahụ kpọmkwem.
- source_word: στοᾷ
  choice: ụzọ e ji ogidi kpuchie
  rationale: Nkọwa a na-egosi ebe e kpuchiri elu ya nke ogidi kwụ n’ahịrị, ma dị mfe nghọta nye ndị na-agụ Igbo taa.
- source_word: τοῦ Σολομῶνος
  choice: nke a na-akpọ nke Solomọn
  rationale: Na-egosi nke ọma na okwu ahụ bụ aha ebe a maara dị ka ụzọ ogidi Solomọn, n’enweghị ikwu na ọ bụ Solomọn nwe ya n’oge ahụ.
