- from: Jizọs nọkwa na-ejegharị n’ogige ụlọ nsọ[a], n’ụzọ e ji ogidi kpuchie nke a na-akpọ nke Solomọn[b].
  to: Jizọs nọ na-ejegharị n’ogige ụlọ nsọ[a], n’ime mbara ogidi Solomọn[b].
  rationale: The revision retains the progressive action, the temple-complex sense, and Solomon’s named portico. It replaces the misleading architectural paraphrase with the clearer Standard Igbo expression “mbara ogidi,” while the footnote gives a fuller explanation of the Greek term.
