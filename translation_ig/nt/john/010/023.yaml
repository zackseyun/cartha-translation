  register: Asụsụ Igbo Izugbe dị ugbu a, dị nsọ ma doo anya. E ji nkọwa ụlọ ahụ a pụrụ ịghọta ngwa ngwa dochie okwu nka na ụkpụrụ ụlọ nke nwere ike ghara ido ọtụtụ ndị anya.
