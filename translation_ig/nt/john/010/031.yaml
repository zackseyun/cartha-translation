  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἐβάστασαν ⸀οὖν πάλιν λίθους οἱ Ἰουδαῖοι ἵνα λιθάσωσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/031.yaml
  text: So the Jews picked up stones again to stone him[a].
translation:
  language: ig
  text: Ya mere, ndị Juu welitere nkume ọzọ ka ha were nkume tụgbuo ya[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’ọnọdụ a, ọ pụkwara ịpụta “ndị ndu Juu” ma ọ bụ “ndị Judia.” Okwu ahụ Jọn ji, “ndị Juu,” na-ezokarị aka n’ụfọdụ ndị Juu na-emegide Jizọs, ọ bụghị n’ebe ndị Juu niile nọ n’ozuzu ha.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐβάστασαν
  choice: tụtụkwara
  rationale: N'ọnọdụ a, βαστάζω pụtara iburu ma ọ bụ iweli nkume n'aka maka iji ya ozugbo; “tụtụkwara” na-egosi omume ahụ n'Igbo nkịtị.
- source_word: οὖν
  choice: Ya mere
  rationale: Ọ na-ejikọta omume a na okwu Jizọs kwuru tupu ya ma na-egosi ihe sochiri ya.
- source_word: πάλιν
  choice: ọzọ
  rationale: Ọ na-egosi na mmeghachi omume dị otú a emeela mbụ.
- source_word: λίθους
  choice: nkume
  rationale: Nke a bụ okwu Igbo kwụ ọtọ maka λίθος, n'enweghị itinye nkọwa ọzọ n'ime aha ahụ.
- source_word: οἱ Ἰουδαῖοι
  choice: ndị Juu
  rationale: Nke a na-edobe okwu Grik ahụ n'ozuzu ya. Ebe ọ bụ na ojiji Jọn nwere ike na-ezo aka n'otu ìgwè ndị mmegide kpọmkwem, e tinyere nkọwa n'ala peeji kama ịkpa ókè n'amaokwu ahụ.
- source_word: ἵνα
  choice: ka ha jiri
  rationale: Ọ na-egosi ebumnuche ha ji tụtụ nkume ndị ahụ n'ụzọ na-ada nke ọma n'Igbo.
- source_word: λιθάσωσιν
  choice: nkume tụgbuo
  rationale: Nkebiokwu a na-enye echiche kpọmkwem nke λιθάζω—iji nkume tụgbuo mmadụ—n'Igbo doro anya.
- source_word: αὐτόν
  choice: ya
  rationale: Nnọchiaha ihe a na-eme ihe, nke na-ezo aka na Jizọs.
theological_decisions:
- issue: Onye ma ọ bụ ndị οἱ Ἰουδαῖοι na-ezo aka na ha n'Oziọma Jọn
  choice: ndị Juu
  alternative: ndị ndu Juu; ndị Judia
  rationale: Amaokwu Grik ahụ kwuru “ndị Juu” n'ụzọ doro anya, ya mere e debere ya n'ahụ amaokwu. Ma n'Oziọma Jọn, okwu ahụ na-ezokarị aka n'ụfọdụ ndị Juu na-emegide Jizọs, ọ bụghị ndị Juu niile; nkọwa ala peeji na-echekwa ohere nghọta ahụ n'enweghị ịgbanwe okwu amaokwu.
translation_notes:
  register: Igbo Izugbe nke oge a, dị ùgwù ma doo ndị nkịtị anya. E jidere usoro na echiche Grik, ma jiri nkebiokwu Igbo ebumpụta ụwa maka iburu nkume na iji nkume tụgbuo mmadụ.
