revisions:
- from: Ya mere, ndị Juu tụtụkwara nkume ọzọ ka ha jiri nkume tụgbuo ya[a].
  to: Ya mere, ndị Juu welitere nkume ọzọ ka ha were nkume tụgbuo ya[a].
  rationale: 'The revision replaces an unclear verb with a natural Igbo expression for taking stones up, while retaining every source-text element: “Ya mere” for οὖν, “ọzọ” for πάλιν, “ndị Juu” for οἱ Ἰουδαῖοι, and the purpose of stoning him. The footnote continues to preserve the contextual ambiguity of John’s designation without narrowing the main text.'
