id: JHN.10.30
reference: John 10:30
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐγὼ καὶ ὁ πατὴρ ἕν ἐσμεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/030.yaml
  text: I and the Father are one[a].
translation:
  language: ig
  text: Mụ na Nna bụ otu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Okwu Grik a sụgharịrị “otu” dị n'ụdị neuter. Nke a na-emesi ịdị n'otu ike n'emeghị ka Jizọs na Nna bụrụ otu onye.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγὼ
  choice: Mụ
  rationale: Nnọchiaha onye mbụ otu; e debere ya n'ụzọ pụtara ìhè dịka ọ dị na Grik iji gosipụta isiokwu ahụ nke ọma.
- source_word: καὶ
  choice: na
  rationale: Njikọ dị mfe nke jikọtara “Mụ” na “Nna” n'enweghị ịgbakwunye echiche ọzọ.
- source_word: ὁ πατὴρ
  choice: Nna
  rationale: N'okwu Jọn a, ọ bụ aha e ji akọwa Nna Jizọs; mkpụrụedemede ukwu na-egosi na ọ bụ aha nsọpụrụ, ọ bụghị naanị nna mmadụ n'ozuzu.
- source_word: ἕν
  choice: otu
  rationale: Ọ bụ ụdị otu nke neuter na Grik. “Otu” bụ nsụgharị Igbo kacha kwụ ọtọ ma na-edobe nkwupụta ịdị n'otu ahụ n'ebughị ụzọ kọwaa ya dịka naanị nkwekọrịta ma ọ bụ otu onye.
- source_word: ἐσμεν
  choice: bụ
  rationale: Ngwaa Grik bụ onye mbụ n'ụbara. Ọ bụ ezie na Igbo anaghị egosi ọnụọgụ n'ụdị ngwaa “bụ,” isiokwu abụọ “Mụ na Nna” na-edobe ọdịiche dị n'etiti ha mgbe “otu” na-ekwupụta ịdị n'otu ha.
theological_decisions:
- issue: Ihe ἕν nke dị na neuter, ya na ἐσμεν nke dị n'ụbara, pụtara n'okwu a dị mkpa banyere Kraịst
  choice: “Mụ na Nna bụ otu.” Nke a na-ekwupụta ịdị n'otu n'ezie n'etiti Jizọs na Nna, ma ọ naghị eme ka ha bụrụ otu onye.
  alternative: “Mụ na Nna bụ otu ihe” ma ọ bụ “Mụ na Nna dị n'otu.”
  rationale: “Otu ihe” na-ada ka a na-akpọ ha ihe na-abụghị mmadụ, ebe “dị n'otu” nwere ike ime ka nkwupụta ahụ daa mbà bụrụ naanị nkwekọrịta. “Bụ otu” na-edobe ike na esemokwu nkà mmụta okpukpe dị n'okwu Grik ahụ, n'etinyeghị okwu nkwenkwe e mepụtara n'oge ọzọ.
translation_notes:
  register: Standard Igbo dị mfe, dị ugwu, ma bụrụ nke ndị na-agụ akwụkwọ taa ga-aghọta. E ji “Nna” dịka aha nsọpụrụ; a hapụrụ okwu ahụ nkenke dịka nke Grik.
