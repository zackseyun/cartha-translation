revisions:
- from: Ọ dịghị onye na-anapụ m ya, kama ọ bụ mụ onwe m ji aka m tọgbọ ya.[a] Enwere m ikike ịtọgbọ ya, enweekwa m ikike iwere ya ọzọ.[b][c] Ọ bụ iwu a ka m natara n’aka Nna m.
  to: Ọ dịghị onye na-anapụ ya n’aka m; kama m na-atọgbọ ya site n’onwe m.[a] Enwere m ikike ịtọgbọ ya, enwekwara m ikike iwere ya ọzọ.[b][c] Ọ bụ iwu a ka m natara n’aka Nna m.
  rationale: The revision corrects the Igbo construction for ‘takes it from me,’ removes added hand imagery and excessive emphasis from the voluntary-agency clause, and improves the related notes. It does not alter the verse’s meaning, preserves the source’s repeated terms, and retains interpretive openness concerning the pronoun’s antecedent while explaining it in a note.
