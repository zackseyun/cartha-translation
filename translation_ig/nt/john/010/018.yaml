    text: Ma ọ bụ, “n’onwe m” ma ọ bụ “n’afọ ofufo.” Akpaokwu ahụ na-ekwusi ike na Jizọs ji ọchịchọ ya nye ndụ ya.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ike” ma ọ bụ “ikike ziri ezi.” Okwu Grik ahụ nwere ike ịgụnye ma ike ime ihe ma ikike ime ya.
    reason: lexical_alternative
  - marker: c
    text: Ya bụ, ndụ ya; tulee Jọn 10:17.
    reason: cross_reference
  revision_rationale: The revision corrects the Igbo construction for ‘takes it from me,’ removes added hand imagery and excessive emphasis from the voluntary-agency clause, and improves the related notes. It does not alter the verse’s meaning, preserves the source’s repeated terms, and retains interpretive openness concerning the pronoun’s antecedent while explaining it in a note.
