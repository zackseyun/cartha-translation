id: JHN.10.18
reference: John 10:18
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οὐδεὶς ⸀αἴρει αὐτὴν ἀπ’ ἐμοῦ, ἀλλ’ ἐγὼ τίθημι αὐτὴν ἀπ’ ἐμαυτοῦ. ἐξουσίαν ἔχω θεῖναι αὐτήν, καὶ ἐξουσίαν ἔχω πάλιν λαβεῖν αὐτήν· ταύτην τὴν ἐντολὴν ἔλαβον παρὰ τοῦ πατρός μου.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/018.yaml
  text: No one takes it from me[a], but I lay it down of myself. I have authority to lay it down, and I have authority to take it up again[c][b]. This command I received from my Father.
translation:
  language: ig
  text: Ọ dịghị onye na-anapụ ya n’aka m; kama m na-atọgbọ ya site n’onwe m.[a] Enwere m ikike ịtọgbọ ya, enwekwara m ikike iwere ya ọzọ.[b][c] Ọ bụ iwu a ka m natara n’aka Nna m.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’onwe m” ma ọ bụ “n’afọ ofufo.” Akpaokwu ahụ na-ekwusi ike na Jizọs ji ọchịchọ ya nye ndụ ya.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ike” ma ọ bụ “ikike ziri ezi.” Okwu Grik ahụ nwere ike ịgụnye ma ike ime ihe ma ikike ime ya.
    reason: lexical_alternative
  - marker: c
    text: Ya bụ, ndụ ya; tulee Jọn 10:17.
    reason: cross_reference
lexical_decisions:
- source_word: αἴρει
  choice: na-anapụ
  rationale: N’ebe a, okwu ahụ pụtara ịnara Jizọs ndụ ya n’ike. “Na-anapụ” na-egosipụta nke ọma ihe dị iche n’etiti ihe onye ọzọ ga-amanye ya na ịtọgbọ ndụ ya n’afọ ofufo.
- source_word: τίθημι αὐτὴν / θεῖναι αὐτήν
  choice: ji aka m tọgbọ ya / ịtọgbọ ya
  rationale: “Ịtọgbọ” na-edobe ihe atụ Grik nke ịtọgbọ ndụ ma na-egosi na Jizọs na-enye ndụ ya n’afọ ofufo. A gbanwere usoro nke mbụ ntakịrị ka Igbo wee daa nke ọma, ebe e debere otu ngwaa ahụ n’amaokwu ahụ dum.
- source_word: ἀπ’ ἐμαυτοῦ
  choice: ọ bụ mụ onwe m ji aka m
  rationale: Nke a na-ekwusi ike na Jizọs mere ya n’afọ ofufo, ma ọ naghị akọwa ya dị ka onye na-eme ihe n’enweghị mmekọrịta ya na Nna ya.
- source_word: ἐξουσίαν
  choice: ikike
  rationale: “Ikike” nwere ike ịgụnye ma ikike ziri ezi ma ike ime ihe; nke a dabara na njikọ dị n’etiti ọchịchọ Jizọs na iwu Nna nyere ya.
- source_word: πάλιν λαβεῖν αὐτήν
  choice: iwere ya ọzọ
  rationale: Nke a na-edobe ngwaa Grik λαμβάνω n’ụzọ kwụ ọtọ ma na-ahapụ nghọta ya n’ebe a—iwere ndụ ya ọzọ—ka ihe gbara ya gburugburu kọwaa ya.
- source_word: ἐντολήν
  choice: iwu
  rationale: “Iwu” bụ okwu Igbo doro anya nke na-egosipụta ike nkịtị nke ἐντολή, n’emeghị ka ọ bụrụ naanị ndụmọdụ ma ọ bụ ọrụ e kenyere.
- source_word: παρὰ τοῦ πατρός μου
  choice: n’aka Nna m
  rationale: Akpaokwu Igbo a na-egosi na Nna bụ isi iyi nke iwu ahụ, ma na-edobekwa okwu mmekọrịta nke “Nna m.”
theological_decisions:
- issue: Ihe ἐξουσία pụtara n’ihe gbasara ọnwụ na mbilite n’ọnwụ Jizọs
  choice: ikike
  alternative: ike; ikike ziri ezi
  rationale: “Ikike” na-ejide ma ikike ime ihe ma ikike e nyere n’ụzọ ziri ezi. Ọ na-edobe ọnụ ma nnwere onwe Jizọs n’inyefe ndụ ya ma mmekọrịta ya na iwu Nna.
- issue: Ike okwu ἀπ’ ἐμαυτοῦ
  choice: ọ bụ mụ onwe m ji aka m
  alternative: site n’onwe m; n’uche nke aka m
  rationale: Nhọrọ a na-egosi n'ụzọ eke na Jizọs nyere ndụ ya n’afọ ofufo, n’emeghị ka a sị na ọ rụrụ ya n’adabereghị na Nna, ebe ngwụcha amaokwu ahụ kwuru banyere iwu Nna.
- issue: Ihe nnọchiaha αὐτήν na-anọchi anya ya
  choice: ya
  alternative: ndụ m
  rationale: “Ya” na-edobe nnọchiaha dị n’asụsụ Grik ma na-ahapụ amaokwu 17, ebe e kwuru “ndụ m,” ka ọ bụrụ ihe ọ na-ezo aka na ya.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. “Na-anapụ” gosiri omume onye ọzọ n’ike, ebe “ịtọgbọ” debere ihe atụ nke inye ndụ. Akpaokwu “ọ bụ mụ onwe m ji aka m” mere ka echiche nke ime ihe n’afọ ofufo daa nke ọma n’Igbo, na-enweghị ikwu na Ọkpara nọọrọ onwe ya pụọ n’aka Nna.
