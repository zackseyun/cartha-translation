source:
  edition: SBLGNT
  text: ἀπεκρίθησαν αὐτῷ οἱ ⸀Ἰουδαῖοι· Περὶ καλοῦ ἔργου οὐ λιθάζομέν σε ἀλλὰ περὶ βλασφημίας, καὶ ὅτι σὺ ἄνθρωπος ὢν ποιεῖς σεαυτὸν θεόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/033.yaml
  text: The Jews answered him[a], “We are not stoning you for a good work, but for blasphemy, and because you, being a man, make yourself God.”
translation:
  language: ig
  text: Ndị Juu zara ya sị, “Ọ bụghị n’ihi ọrụ ọma ka anyị ji atụ gị nkume, kama ọ bụ n’ihi nkwulu, nakwa n’ihi na gị onwe gị, ebe ị bụ mmadụ, na-eme ka onwe gị bụrụ Chineke.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “na-eme ka onwe gị bụrụ chi.” Okwu Grik θεόν enweghị edemede nkọwa, ma n’ọnọdụ a, ebe a na-ebo ya ebubo nkwulu, ihe o yikarịrị ka ọ pụtara bụ “Chineke.”
    reason: alternative_reading
lexical_decisions:
- source_word: Ἰουδαῖοι
  choice: Ndị Juu
  rationale: Nke a bụ ntụgharị kpọmkwem nke okwu Grik ahụ ma na-ahapụ ka ndị na-agụ ya ghọta ndị kpọmkwem a na-ekwu maka ha site n’ihe gbara amaokwu ahụ gburugburu, kama ịkọwa ya naanị dị ka ndị isi okpukpe ma ọ bụ ndị Judia.
- source_word: Περὶ καλοῦ ἔργου
  choice: n’ihi ezi ọrụ
  rationale: Ọ na-egosi ihe kpatara omume ahụ, na-edebekwa ἔργου dị ka otu ọrụ na καλοῦ dị ka ihe ọma.
- source_word: λιθάζομέν
  choice: anyị ji atụ gị nkume
  rationale: Ụdị ngwaa dị ugbu a na-egosi ihe ha na-eme ma ọ bụ ihe ha nọ na-achọ ime n’oge esemokwu ahụ; okwu Igbo a na-egosipụta ịtụ mmadụ nkume n’ụzọ doro anya.
- source_word: βλασφημίας
  choice: nkwulu
  rationale: “Nkwulu” bụ okwu Igbo dị nkenke ma dị ùgwù maka okwu ma ọ bụ omume na-eweda Chineke ala; ọnọdụ amaokwu ahụ na-eme ka ihe ọ na-ezo aka na ya doo anya.
- source_word: ἄνθρωπος ὢν
  choice: ebe ị bụ mmadụ
  rationale: Nke a na-edobe ọnọdụ nke participle ahụ ma na-egosipụta ọdịiche ndị na-ebo Jizọs ebubo chọrọ ime n’etiti ịbụ mmadụ na ime onwe ya Chineke.
- source_word: ποιεῖς σεαυτὸν θεόν
  choice: na-eme onwe gị Chineke
  rationale: Usoro ποιέω tinyere nnọchiaha onwe na aha e ji kọwaa ya pụtara ime onwe onye ma ọ bụ igosi onwe onye dị ka ihe ahụ. N’ọnọdụ ebubo nkwulu a, “Chineke” kacha egosipụta ebubo ha, ebe e debere nhọrọ ọzọ n’okpuru amaokwu.
theological_decisions:
- issue: Otu e si tụgharịa θεόν na ebubo ποιεῖς σεαυτὸν θεόν
  choice: Chineke
  alternative: otu chi
  rationale: θεόν enweghị article n’asụsụ Grik, ya mere n’ụzọ ụtọasụsụ naanị, e nwere ike ịghọta ya dịka “Chineke” ma ọ bụ “otu chi.” Ma ebubo nkwulu na ọnọdụ ozi Jọn na-egosi na ha ghọtara na Jizọs na-eme onwe ya onye nwere ọnọdụ nke bụ naanị nke Chineke. E debere nhọrọ nke ọzọ n’okpuru amaokwu iji ghara izochi mgbagwoju anya dị n’asụsụ mbụ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị mfe nghọta ma dị ùgwù. A hapụrụ “Ndị Juu” ka ọ bụrụ okwu sara mbara dịka nke Grik, na-enweghị ime ka ọ bụrụ naanị ndị isi ndị Juu. Akara nkọwa [a] dị ozugbo n’ebe okwu ọ na-akọwa dị.
