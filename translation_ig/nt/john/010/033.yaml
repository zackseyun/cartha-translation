- from: Ndị Juu zara ya, sị, “Ọ bụghị n’ihi ezi ọrụ ka anyị ji atụ gị nkume, kama ọ bụ n’ihi nkwulu, nakwa n’ihi na gị onwe gị, ebe ị bụ mmadụ, na-eme onwe gị Chineke.[a]”
  to: Ndị Juu zara ya sị, “Ọ bụghị n’ihi ọrụ ọma ka anyị ji atụ gị nkume, kama ọ bụ n’ihi nkwulu, nakwa n’ihi na gị onwe gị, ebe ị bụ mmadụ, na-eme ka onwe gị bụrụ Chineke.[a]”
  rationale: The revision preserves the Greek syntax and ambiguity while improving Standard Igbo idiom. It retains “Ndị Juu” without narrowing the referent and preserves the English audit trail’s alternative “a god” in a non-numerical Igbo form.
