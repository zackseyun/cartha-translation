id: JHN.10.5
reference: John 10:5
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀλλοτρίῳ δὲ οὐ μὴ ⸀ἀκολουθήσουσιν ἀλλὰ φεύξονται ἀπ’ αὐτοῦ, ὅτι οὐκ οἴδασι τῶν ἀλλοτρίων τὴν φωνήν.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/005.yaml
  text: But they will certainly not follow a stranger[a]; instead, they will flee from him[b], because they do not know the voice of strangers.
translation:
  language: ig
  text: Ma ha agaghị eso onye ọbịa ma ọlị[a]; kama ha ga-agbapụ n’ebe ọ nọ, n’ihi na ha amaghị olu ndị ọbịa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “Ha agaghị eso onye ọbịa mgbe ọ bụla.” Okwu Grik ji nkwugide siri ike (οὐ μή).
    reason: lexical_alternative
  - marker: b
    text: “Ịma olu” nwekwara ike ịpụta “ịmata olu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλοτρίῳ
  choice: onye ha na-amaghị
  rationale: N’ihe atụ banyere atụrụ na onye ọzụzụ atụrụ, okwu a pụtara onye na-abụghị onye nke atụrụ ahụ maara ma ọ bụ nke ha so. Nhọrọ a na-egosi ‘onye ọbịa’ n’enweghị echiche agbụrụ ma ọ bụ mba ọzọ.
- source_word: οὐ μὴ ἀκολουθήσουσιν
  choice: ha agaghị eso ... ma ọlị
  rationale: οὐ μή tinyere ngwaa ọdịnihu bụ nkwugide siri ike. ‘Agaghị ... ma ọlị’ na-egosipụta nkwusi ike ahụ n’Igbo doro anya ma dị ugbu a.
- source_word: ἀκολουθήσουσιν
  choice: eso
  rationale: ‘Iso’ bụ okwu Igbo kachasị mfe ma kwesị ekwesị maka atụrụ na-eso onye na-edu ha.
- source_word: φεύξονται ἀπ’ αὐτοῦ
  choice: ha ga-agbara ya ọsọ
  rationale: Nkebiokwu a na-egosi ịgbapụ ma ọ bụ ịla n’ebe onye ahụ nọ; ‘ịgbara ya ọsọ’ na-edobe ike nke omume ahụ n’Igbo eke.
- source_word: οἴδασι
  choice: ha amaghị
  rationale: οἶδα nwere ike ịpụta ịma ma ọ bụ ịmata ihe a nụrụ. ‘Amaghị’ na-edobe obosara okwu Grik, ebe nkọwa ala peeji na-egosi na ‘ịmata olu’ kwekwara omume.
- source_word: τῶν ἀλλοτρίων τὴν φωνήν
  choice: olu ndị ha na-amaghị
  rationale: Nke a na-edobe ọtụtụ mmadụ dị na τῶν ἀλλοτρίων ma na-egosi na olu ahụ bụ nke ndị na-abụghị ndị atụrụ maara.
- source_word: δὲ ... ἀλλὰ
  choice: Ma ... kama
  rationale: 'Ụzọ a na-egosi ọdịiche doro anya: ha agaghị eme nke mbụ; kama ha ga-eme ihe megidere ya.'
theological_decisions:
- issue: Ike ihe atụ nke atụrụ na onye ọzụzụ atụrụ
  choice: Idobe ihe atụ ahụ n’enweghị ịkọwa onye ndị ahụ na-anọchi anya ya
  alternative: Ịkpọ ‘onye ha na-amaghị’ onye ozizi ụgha ma ọ bụ onye ndu na-ekwesịghị ekwesị
  rationale: Amaokwu ahụ n’onwe ya ka na-ekwu okwu n’ime ihe atụ ahụ, ọ kọwaghịkwa kpọmkwem onye ‘onye ọzọ’ ahụ na-anọchi anya ya. Ịgbakwunye nkọwa ahụ ga-edozi ihe ederede hapụrụ ghe oghe.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. ‘Onye ha na-amaghị’ na-ezere nghọtahie nke ‘onye mba ọzọ’ ma kwekọọ n’ihe atụ banyere atụrụ ndị maara olu onye na-azụ ha. E tinyere akara ala peeji [a] na [b] n’ebe kwesịrị ekwesị n’isi ederede.
