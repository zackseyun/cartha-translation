id: JHN.10.8
reference: John 10:8
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: πάντες ὅσοι ἦλθον ⸂πρὸ ἐμοῦ⸃ κλέπται εἰσὶν καὶ λῃσταί· ἀλλ’ οὐκ ἤκουσαν αὐτῶν τὰ πρόβατα.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/008.yaml
  text: All who came before me are thieves and robbers[a], but the sheep did not listen to them.
translation:
  language: ig
  text: Ndị niile bịara tupu m bụ ndị ohi na ndị na-apụnara mmadụ ihe[a]; ma atụrụ ahụ egeghị ha ntị.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “bịara n'ihu m.” Okwu a nwere ike ịpụta ndị bịara tupu Jizọs n'oge, ma ọ bụ ndị buru ụzọ bịa na-ekwu na ha nwere ikike n'enweghị Jizọs. Ihe gbara ya gburugburu na-atụ aka ná ndị ọzụzụ atụrụ ụgha, ọ bụghị ná ndị ozi Chineke niile biri tupu Jizọs.
    reason: alternative_reading
lexical_decisions:
- source_word: πάντες ὅσοι
  choice: Ndị niile
  rationale: Nke a na-egosi ndị niile so n'òtù a a na-ekwu maka ha, ma bụrụkwa ụzọ Igbo dị mfe ma doo anya.
- source_word: ἦλθον
  choice: bịara
  rationale: Oge gara aga dị mfe dabara n'ụdị aorist nke Grik ma ghara itinye echiche ọzọ na-adịghị n'okwu ahụ.
- source_word: πρὸ ἐμοῦ
  choice: tupu m
  rationale: Nke a na-echekwa nghọta oge nke okwu Grik, ya bụ ‘tupu m,’ n'Igbo nkịtị; ihe ọzọ ọ pụrụ ịpụta ka e debere n'ala ala peeji.
- source_word: κλέπται
  choice: ndị ohi
  rationale: Ọ bụ okwu Igbo a na-ejikarị akọwa ndị na-ezu ohi, nke dabara n'ihe atụ banyere ndị batara n'ụzọ na-ezighị ezi.
- source_word: λῃσταί
  choice: ndị na-apụnara mmadụ ihe
  rationale: Nke a na-egosi izu ohi n'ike ma ọ bụ n'ụzọ mmegbu, si otú ahụ chekwaa ọdịiche ya na ‘ndị ohi.’
- source_word: ἀλλ’
  choice: ma
  rationale: Njikọ a na-egosi ntụgharị megide ihe e kwuru na mbụ n'ụzọ Igbo dị nkenke ma bụrụ ihe a na-anụkarị.
- source_word: οὐκ ἤκουσαν αὐτῶν
  choice: egeghị ha ntị
  rationale: N'ọnọdụ onye ọzụzụ atụrụ na atụrụ, okwu a pụtara ọ bụghị naanị ịnụ olu kamakwa ige ya ntị ma nabata ya.
- source_word: τὰ πρόβατα
  choice: atụrụ ahụ
  rationale: Ọ na-echekwa aha a kapịrị ọnụ n'okwu Grik ma dabara n'ihe atụ Jọn ji akọwa ndị na-amata olu onye ọzụzụ atụrụ.
theological_decisions:
- issue: Oke na nghọta nke ‘ndị niile bịara tupu m’
  choice: E debere ya n'ahịrị isi dịka ‘Ndị niile bịara tupu m’ n'enweghị itinye nkọwa ga-eme ka ọ kpọọ naanị otu ụdị ndị.
  alternative: Ndị niile bịara n'ihu m; ma ọ bụ ndị bịara tupu m na-azọrọ ikike onye ọzụzụ atụrụ n'enweghị Jizọs.
  rationale: Okwu Grik sara mbara, ma ihe gbara ya gburugburu na-atụ aka ná ndị ọzụzụ atụrụ ụgha, ọ bụghị n'ịkatọ ndị ozi Chineke niile bịara n'oge gara aga. Ya mere, e chekwara esemokwu ahụ n'ahịrị isi, tinye nkọwa n'ala ala peeji.
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ ‘ndị na-apụnara mmadụ ihe’ iji gosi ọdịiche dị n'etiti κλέπται na λῃσταί, ma zere okwu ochie ma ọ bụ nke ụka pụrụ iche.
