    text: A pụkwara ịsị, “ọ chụpụtala” ma ọ bụ “ọ dupụtala”; ngwaa Grik ahụ pụrụ ịpụta ịchụpụ, idupu, ma ọ bụ ịkpọpụta atụrụ n’ogige.
    reason: lexical_alternative
  revision_rationale: The revision removes the potentially personal reference created by “ndị,” explicitly identifies the contextually implied sheep, and places the lexical note at the verb it explains. It preserves the Greek shepherding image and the ambiguity of ἐκβάλῃ through the footnote, without importing a coercive or doctrinal sense.
