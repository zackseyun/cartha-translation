revisions:
- from: Mgbe ọ kpọpụtasịrị ndị niile bụ nke ya[a], ọ na-aga n’ihu ha, atụrụ ahụ na-esokwa ya, n’ihi na ha maara olu ya.
  to: Mgbe ọ kpọpụtala[a] atụrụ ya niile, ọ na-aga n’ihu ha, atụrụ ahụ na-eso ya, n’ihi na ha maara olu ya.
  rationale: The revision removes the potentially personal reference created by “ndị,” explicitly identifies the contextually implied sheep, and places the lexical note at the verb it explains. It preserves the Greek shepherding image and the ambiguity of ἐκβάλῃ through the footnote, without importing a coercive or doctrinal sense.
  reviewer_model: gpt-5.6-terra
