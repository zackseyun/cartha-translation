review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the temporal sequence, the shepherd’s leading position, the sheep’s following, and their knowledge of his voice. However, “ndị niile bụ nke ya” normally denotes people and does not adequately represent the neuter plural expression in its immediate sheep context. Rendering the referent explicitly as “atụrụ ya niile” is clearer and source-faithful in Igbo. The lexical-alternative footnote should be anchored to the verb ἐκβάλῃ, not to “ya.”
  naturalness: “Mgbe ọ kpọpụtasịrị ndị niile bụ nke ya” is somewhat unnatural and potentially misleading in Standard Igbo because “ndị” suggests human beings. “Mgbe ọ kpọpụtala atụrụ ya niile” is idiomatic and maintains the pastoral image. “Atụrụ ahụ na-eso ya” is natural as a collective reference to the sheep.
  terminology: “onye ọzụzụ atụrụ,” “atụrụ,” and “olu ya” are appropriate Standard Igbo terminology. “kpọpụtala” suitably renders the outward movement without forcing the harsher sense of expulsion; the footnote retains the relevant alternatives.
  issues:
  - severity: medium
    issue: “ndị niile bụ nke ya” uses the personal plural noun ndị for τὰ ἴδια πάντα.
    rationale: Although the Greek phrase is neuter and can be left somewhat general, its immediate referent is the shepherd’s sheep. In Igbo, ndị ordinarily identifies persons, creating an unwarranted human reference. “atụrụ ya niile” accurately supplies the contextual referent and is natural.
  - severity: low
    issue: Footnote marker [a] is placed after “ya” rather than the verb translated from ἐκβάλῃ.
    rationale: The note explains lexical alternatives for the action of bringing/driving/leading out. It should therefore be attached to “kpọpụtala.”
  - severity: low
    issue: The footnote’s phrase “ịkpọpụta ihe” is overly general.
    rationale: The source-context is shepherding and animals being brought out of an enclosure. Referring to “atụrụ” makes the note clear without changing its lexical purpose.
  revised_text: Mgbe ọ kpọpụtala[a] atụrụ ya niile, ọ na-aga n’ihu ha, atụrụ ahụ na-eso ya, n’ihi na ha maara olu ya.
  revised_footnotes:
