source:
  edition: SBLGNT
  text: ⸀ὅταν τὰ ἴδια ⸀πάντα ἐκβάλῃ, ἔμπροσθεν αὐτῶν πορεύεται, καὶ τὰ πρόβατα αὐτῷ ἀκολουθεῖ, ὅτι οἴδασιν τὴν φωνὴν αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/john/010/004.yaml
  text: When he has brought out all his own[a], he goes before them, and the sheep follow him, because they know his voice.
translation:
  language: ig
  text: Mgbe ọ kpọpụtala[a] atụrụ ya niile, ọ na-aga n’ihu ha, atụrụ ahụ na-eso ya, n’ihi na ha maara olu ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “ọ chụpụtala” ma ọ bụ “ọ dupụtala”; ngwaa Grik ahụ pụrụ ịpụta ịchụpụ, idupu, ma ọ bụ ịkpọpụta atụrụ n’ogige.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν
  choice: Mgbe
  rationale: Ọ na-ewebata nkebiokwu oge na-enweghị oge a kapịrị ọnụ; “Mgbe” bụ okwu Igbo dị mfe ma dabara n’omume a na-akọ n’ozuzu ya.
- source_word: τὰ ἴδια πάντα
  choice: ndị niile bụ nke ya
  rationale: Ọ bụ ezie na okwu Grik ahụ dị n’ụdị etiti ọtụtụ, n’ebe a ọ na-ezo aka n’atụrụ niile nke onye ọzụzụ atụrụ. Nhọrọ a na-echekwa echiche nke ịbụ nke ya n’etinyeghị “atụrụ” tupu okwu ahụ apụta kpọmkwem.
- source_word: ἐκβάλῃ
  choice: ọ kpọpụtasịrị
  rationale: Ngwaa a nwere ike ịpụta ịchụpụ ma ọ bụ ịkpọpụta. N’ọnọdụ onye ọzụzụ atụrụ na-akpọpụta atụrụ n’ogige, “kpọpụtasịrị” na-egosi mmegharị isi n’ime pụta n’èzí n’enweghị itinye echiche obi ọjọọ na-adịghị mkpa.
- source_word: ἔμπροσθεν αὐτῶν πορεύεται
  choice: ọ na-aga n’ihu ha
  rationale: Nke a na-echekwa ihe osise onye ọzụzụ atụrụ na-ebute ụzọ, ma bụrụkwa Igbo nkịtị na nke doro anya.
- source_word: τὰ πρόβατα αὐτῷ ἀκολουθεῖ
  choice: atụrụ ahụ na-esokwa ya
  rationale: “Atụrụ” bụ ntụgharị kwesịrị ekwesị nke πρόβατα, ebe “na-esokwa ya” na-egosipụta omume iso onye na-ebute ụzọ.
- source_word: ὅτι οἴδασιν τὴν φωνὴν αὐτοῦ
  choice: n’ihi na ha maara olu ya
  rationale: “N’ihi na” na-egosi ihe kpatara ha ji eso ya; “maara olu ya” na-echekwa okwu nkịtị nke οἶδα ma na-ekwe ka echiche ịmata olu ahụ pụta site n’ọnọdụ ya.
theological_decisions:
- issue: Ihe osise onye ọzụzụ atụrụ na ike okwu ἐκβάλῃ
  choice: ọ kpọpụtasịrị
  alternative: ọ chụpụtasịrị; ọ dupụtasịrị
  rationale: Ọnọdụ a bụ nke onye ọzụzụ atụrụ na atụrụ nke ya, ọ bụghị ịchụpụ ha n’ụzọ iro. “Kpọpụtasịrị” na-echekwa mmegharị isi n’ogige pụta ma ghara ịmanye echiche banyere mmanye ma ọ bụ banyere ịdị nro nke okwu Grik n’onwe ya.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta mee ntụgharị ahụ. “Ndị niile bụ nke ya” na-ezo aka n’atụrụ ya ma na-echekwa usoro okwu Grik; akara nkọwa ala peeji [a] dị n’akụkụ okwu metụtara ya.
