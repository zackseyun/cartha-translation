  text: καὶ ⸂πολλοὶ ἐπίστευσαν εἰς αὐτὸν ἐκεῖ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/042.yaml
  text: And many believed in him there.
translation:
  language: ig
  text: Ọtụtụ mmadụ kweere na ya n’ebe ahụ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: -kwara
  rationale: E ji mgbakwunye “-kwara” jikọta amaokwu a na akụkọ bu ya ụzọ n'ụzọ dị ụtọ n’Igbo, n’enweghị ịgbakwunye nkọwa ọzọ.
- source_word: πολλοὶ
  choice: ọtụtụ mmadụ
  rationale: Adjective a na-arụ ọrụ dị ka aha ma na-ezo aka n’ọtụtụ ndị; “ọtụtụ mmadụ” doro anya ma bụrụkwa okwu Igbo a na-asụ ugbu a.
- source_word: ἐπίστευσαν
  choice: kweere
  rationale: Okwu a na-egosi omume ikwere; “kweere” bụ nsụgharị kwụ ọtọ nke na-adịghị amanye echiche mmalite nke okwukwe n’ụdị ngwaa aorist ahụ.
- source_word: εἰς αὐτόν
  choice: na ya
  rationale: Mgbe “ikwere” na-ezo aka n’ịtụkwasị mmadụ obi, “ikwere na ya” bụ ụzọ Igbo sitere n’okike si kwuo ya, ma na-edobe ntụziaka okwukwe ahụ n’ebe Jizọs nọ.
- source_word: ἐκεῖ
  choice: n’ebe ahụ
  rationale: Nke a bụ okwu ebe na-egosi ebe omume ahụ mere; “n’ebe ahụ” bụ nsụgharị Igbo doro anya ma dị mma.
theological_decisions:
- issue: Nsụgharị πιστεύω εἰς αὐτόν n’ọnọdụ okwukwe n’ime Jizọs
  choice: kweere na ya
  alternative: tụkwasịrị ya obi
  rationale: “Kweere na ya” na-edobe okwu Grik gbasara ikwere na onye ahụ n’enweghị ịgbasa ya ka ọ bụrụ nkọwa. “Tụkwasịrị ya obi” ga-ekwusi akụkụ ntụkwasị obi ike karịa ihe ederede ahụ kwuru kpọmkwem.
translation_notes:
  register: Standard Igbo; asụsụ dị ugbu a, dị ùgwù, dịkwa mfe nghọta. E tinyere njikọ καὶ n’ime ngwaa dịka “-kwara,” nke bụ usoro Igbo sitere n’okike.
