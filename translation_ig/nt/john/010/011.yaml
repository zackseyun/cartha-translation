source:
  edition: SBLGNT
  text: Ἐγώ εἰμι ὁ ποιμὴν ὁ καλός· ὁ ποιμὴν ὁ καλὸς τὴν ψυχὴν αὐτοῦ τίθησιν ὑπὲρ τῶν προβάτων·
base_translation:
  language: en
  yaml_path: translation/nt/john/010/011.yaml
  text: I am the good shepherd[c][b][a]. The good shepherd lays down his life for the sheep.
translation:
  language: ig
  text: “Abụ m ezi onye ọzụzụ atụrụ[a]. Ezi onye ọzụzụ atụrụ na-atọgbọ ndụ ya[b] n’ihi atụrụ[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “onye ọzụzụ atụrụ magburu onwe ya” ma ọ bụ “onye ọzụzụ atụrụ ezi ihe nlereanya.” Okwu Grik καλός nwere ike ịpụta ihe dị mma, magburu onwe ya, ma ọ bụ ihe nlereanya.
    reason: lexical_alternative
  - marker: b
    text: N'ụzọ nkịtị, “na-atọgbọ mkpụrụ obi ya”; n’akpaalaokwu Grik a, ọ pụtara “na-atọgbọ ndụ ya.”
    reason: lexical_alternative
  - marker: c
    text: A pụkwara ịsụgharị ya, “maka atụrụ” ma ọ bụ “maka ọdịmma atụrụ.”
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐγώ εἰμι
  choice: Abụ m
  rationale: Nke a bụ ụzọ Igbo si ekwu njirimara onwe onye n'ụzọ doro anya ma dị mma. Ọ naghị agbakwụnye nkọwa pụrụ iche banyere aha Chineke nke ahịrịokwu a n'onwe ya na-amanyeghị.
- source_word: ποιμήν
  choice: onye ọzụzụ atụrụ
  rationale: Nke a na-ezipụta kpọmkwem onye na-elekọta ma na-azụ atụrụ, na-enweghị ibubata echiche ọkwá ụka nke okwu dịka “pasta” nwere ike iweta.
- source_word: καλός
  choice: ezi
  rationale: “Ezi” bụ okwu Igbo dị mfe ma dị ebube nke na-agụnye ịdị mma na ịbụ ihe nlereanya; ihe ọ pụtara dịka “dị mma nke ukwuu” ma ọ bụ “kwesịrị nsọpụrụ” ka e debere na ndetu.
- source_word: ψυχήν
  choice: ndụ
  rationale: N'ime akpaalaokwu a, ψυχή pụtara ndụ mmadụ, ọ bụghị naanị mkpụrụ obi a na-ewere dị iche n'ahụ. “Ndụ” na-ezipụta ebumnuche okwu ahụ n'Igbo nke ọma.
- source_word: τίθησιν
  choice: na-atọgbọ
  rationale: Ya na “ndụ ya,” okwu a na-egosipụta inyefe ndụ onwe onye n'afọ ofufo ma na-edobe ihe oyiyi dị n'okwu Grik.
- source_word: ὑπὲρ
  choice: n’ihi
  rationale: “N’ihi” na-egosipụta na ihe a mere maka ọdịmma atụrụ, ma ọ naghị amanye otu nkọwa pụrụ iche banyere otú ọnwụ ahụ si arụ ọrụ.
- source_word: προβάτων
  choice: atụrụ
  rationale: E tinyụghị “ya” n'ihi na ederede Grik nwere akara aha mana o nweghị nnọchiaha nwe; nke a na-ezere ịgbakwunye ihe na-adịghị na isi mmalite.
theological_decisions:
- issue: Ike dị na njirimara onwe Jizọs, Ἐγώ εἰμι
  choice: Abụ m
  alternative: Mụ onwe m bụ
  rationale: “Abụ m” bụ njirimara predicate nkịtị ma o kwekọrọ n'usoro Igbo. Ọ na-ahapụ ohere maka ụda sara mbara dị n'Oziọma Jọn n'etinyeghị ya n'ụzọ ga-akọwa okwu ahụ karịa ihe amaokwu a chọrọ.
- issue: Ihe καλός pụtara n'aha onye ọzụzụ atụrụ
  choice: ezi onye ọzụzụ atụrụ
  alternative: onye ọzụzụ atụrụ dị ebube; onye ọzụzụ atụrụ bụ ihe nlereanya
  rationale: “Ezi” na-edobe ma ịdị mma n'omume ma ịdị mma dịka ihe nlereanya, n'enweghị imechi okwu ahụ n'otu nkọwa naanị.
- issue: Ike nke ὑπὲρ τῶν προβάτων n'ihe gbasara ọnwụ Jizọs
  choice: n’ihi atụrụ
  alternative: maka ọdịmma atụrụ; n’ọnọdụ atụrụ
  rationale: Nhọrọ a na-edobe echiche ime ihe maka ọdịmma ha ma ọ bụ n'aha ha, na-enweghị ime ka amaokwu ahụ kụzie otu ozizi pụrụ iche banyere mkpuchi mmehie.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe ma dị ùgwù mee ntụgharị a. “Onye ọzụzụ atụrụ” na “na-atọgbọ ndụ ya” na-edobe ihe oyiyi nke isi mmalite ma ka na-ada nke ọma nye ndị na-agụ Igbo taa. E tinyere akara ndetu niile [a], [b], na [c] n'ederede bụ isi.
