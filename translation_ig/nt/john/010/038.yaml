reference: John 10:38
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἰ δὲ ποιῶ, κἂν ἐμοὶ μὴ πιστεύητε τοῖς ἔργοις ⸀πιστεύετε, ἵνα γνῶτε καὶ ⸀γινώσκητε ὅτι ἐν ἐμοὶ ὁ πατὴρ κἀγὼ ἐν ⸂τῷ πατρί⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/038.yaml
  text: But if I do them[a], even if you do not believe me, believe the works, so that you may know and continue to know that the Father is in me[c][b], and I am in the Father.
translation:
  language: ig
  text: Ma ọ bụrụ na m na-arụ ọrụ ndị ahụ, ọ bụrụgodị na unu ekweghị m[a], nabanụ akaebe ọrụ ndị ahụ, ka unu wee mata ma nọgide na-amata[b] na Nna nọ n'ime m, m nọkwa n'ime Nna.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ọ bụrụgodị na unu ekweghị na m.” N'asụsụ Grik, okwu a pụrụ ịpụta “ekweghị m” ma ọ bụ “ekweghị na m.”
    reason: lexical_alternative
  - marker: b
    text: Okwu Grik abụọ e ji mee ihe ebe a nwere ụdị dị iche iche; nke a pụrụ igosi ịmata ihe, ma nọgidekwa na-amata ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιῶ
  choice: m na-arụ ha
  rationale: Okwu a dị n'ụdị present active indicative, ihe a na-ekwu maka ya bụkwa ọrụ Jizọs ndị e kwuru banyere ha n'amaokwu ndị dị ya nso; e tinyere ‘ha’ iji mee ka Igbo doo anya.
- source_word: κἂν ἐμοὶ μὴ πιστεύητε
  choice: ọ bụrụgodị na unu ekweghị ihe m na-ekwu
  rationale: πιστεύω na dative ἐμοί nwere ike ịpụta ikwere onye ahụ ma ọ bụ ikwere n'onye ahụ. N'ebe a, ‘ikwere ihe m na-ekwu’ na-eme ka ọdịiche dị n'etiti ịnabata okwu Jizọs na ịnabata akaebe ọrụ ya doo anya.
- source_word: τοῖς ἔργοις πιστεύετε
  choice: kwere ihe ọrụ ndị ahụ na-agba akaebe
  rationale: Nsụgharị a na-ezere echiche na a ga-etinye okwukwe n'ime ọrụ ndị ahụ n'onwe ha; ọ na-egosi na ọrụ ndị ahụ bụ akaebe a ga-anabata.
- source_word: ἔργοις
  choice: ọrụ
  rationale: ‘Ọrụ’ na-edobe okwu Jọn ji akọwa omume Jizọs ndị na-ekpughe onye ọ bụ, n'etinyeghị ‘ihe ịrịba ama’ ebe Grik na-ejighị σημεῖα.
- source_word: ἵνα γνῶτε καὶ γινώσκητε
  choice: ka unu wee mata ma nọgide na-amata
  rationale: ‘Mata’ na ‘nọgide na-amata’ na-egosipụta ọdịiche aspect dị n'etiti aorist subjunctive γνῶτε na present subjunctive γινώσκητε n'ụzọ Igbo nke na-aghọta nghọta mbụ na nke na-aga n'ihu.
- source_word: ἐν ἐμοὶ ὁ πατὴρ κἀγὼ ἐν τῷ πατρί
  choice: Nna ahụ nọ n'ime m, mụ onwe m nọkwa n'ime Nna ahụ
  rationale: E debere ‘n'ime’ ugboro abụọ iji chekwaa asụsụ nke ịdị n'ime ibe ha, na-akọwaghị ya site n'okwu nkà mmụta okpukpe e mechara mepụta.
- source_word: πατήρ
  choice: Nna ahụ
  rationale: Grik nwere aha nwere article, ‘Nna ahụ,’ ọ bụghị ‘Nna m.’
theological_decisions:
- issue: Ịdị n'ime ibe ha nke Nna na Ọkpara
  choice: Nna ahụ nọ n'ime m, mụ onwe m nọkwa n'ime Nna ahụ
  alternative: Nna ahụ dị n'otu na m, mụ na Nna ahụ dịkwa n'otu
  rationale: Nsụgharị nkịtị a na-edobe okwu Jọn siri ike na mgbagwoju ya n'enweghị ịgbanwe ya ka ọ bụrụ nkọwa banyere ịdị n'otu ma ọ bụ tinye okwu nkwenkwe ụka pụrụ iche.
- issue: Ihe πιστεύω na ἐμοί pụtara
  choice: unu ekweghị ihe m na-ekwu
  alternative: unu ekweghị na m
  rationale: Ụdị Grik ahụ nwere ezi mgbagwoju pụtara ‘kwere m’ ma ọ bụ ‘kwere na m.’ Isi ederede họọrọ ịnabataghị ihe Jizọs na-ekwu n'ihi ọdịiche ya na akaebe ọrụ, ebe e debere ụzọ nke ọzọ na ndetu ala peeji.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. ‘Ihe ọrụ ndị ahụ na-agba akaebe’ bụ obere nkọwa dị mkpa iji zere Igbo na-adịghị eke, ‘kwere ọrụ,’ ma chekwaa ọrụ ndị ahụ dị ka akaebe. E debere ‘Nna ahụ’ na ‘n'ime’ iji nọgide nso n'ụdị na ike nke ederede Grik.
