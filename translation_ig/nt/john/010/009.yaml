  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐγώ εἰμι ἡ θύρα· δι’ ἐμοῦ ἐάν τις εἰσέλθῃ σωθήσεται καὶ εἰσελεύσεται καὶ ἐξελεύσεται καὶ νομὴν εὑρήσει.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/009.yaml
  text: I am the door. If anyone enters through me[a], he will be saved, and will go in and go out and find pasture.
translation:
  language: ig
  text: Abụ m ọnụ ụzọ[a]. Ọ bụrụ na onye ọ bụla site na m banye, a ga-azọpụta ya; ọ ga-abanye, ọ ga-apụ, chọtakwa ebe ịta nri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “ọnụ ụzọ ámá.” Okwu Grik ahụ nwere ike ịpụta ọnụ ụzọ ma ọ bụ ọnụ ụzọ ámá; e debere “ọnụ ụzọ” n’isi ederede n’ihi na ọ bụ ntụgharị mkpụrụokwu kacha nso.
    reason: lexical_alternative
lexical_decisions:
- source_word: θύρα
  choice: ọnụ ụzọ
  rationale: “Ọnụ ụzọ” bụ ntụgharị Igbo doro anya ma bụrụkwa nke sitere nso n’okwu Grik; ọ na-echekwa ihe atụ Jizọs kwuru banyere onwe ya, n’agbanyeghị na n’ọnọdụ atụrụ okwu ahụ nwekwara ike ịpụta ọnụ ụzọ ámá.
- source_word: δι’ ἐμοῦ
  choice: esite n’aka m
  rationale: Nkebiokwu a na-egosi na ọ bụ site na Jizọs ka onye ahụ si abanye. “Esite n’aka m” bụ ụzọ Igbo dị mma isi kwupụta ụzọ ma ọ bụ onye e si n’aka ya mee ihe.
- source_word: ἐάν τις εἰσέλθῃ
  choice: Ọ bụrụ na onye ọ bụla ... banye
  rationale: Nke a na-echekwa ọnọdụ izugbe nke ἐάν na obosara nke τις, na-egosi na ọ metụtara onye ọ bụla.
- source_word: σωθήσεται
  choice: a ga-azọpụta ya
  rationale: “Azọpụta” na-echekwa ma echiche nzọpụta nke Oziọma Jọn ma onyinyo nchebe dị n’ihe atụ onye ọzụzụ atụrụ, n’agbanyeghị na ọ naghị amachibido okwu ahụ n’otu nkọwa naanị.
- source_word: εἰσελεύσεται καὶ ἐξελεύσεται
  choice: ọ ga-abanye, ọ ga-apụtakwa
  rationale: Nke a na-echekwa mmegharị abụọ okwu Grik jikọtara ọnụ, n’asụsụ Igbo dị mfe ma kwekọọ n’usoro ọdịnihu.
- source_word: νομὴν
  choice: ebe ịta nri
  rationale: “Ebe ịta nri” bụ okwu Igbo doro anya maka ebe anụ ụlọ, karịchaa atụrụ, na-ata nri, ma dabara n’ihe atụ gbara amaokwu a gburugburu.
- source_word: εὑρήσει
  choice: ọ ga-achọtakwa
  rationale: “Chọta” na-enye ihe εὑρίσκω pụtara n’ụzọ kwụ ọtọ; e tinyere ya n’usoro ọdịnihu dịka ọ dị n’isi mmalite.
theological_decisions:
- issue: Ihe θύρα pụtara n’ihe atụ banyere atụrụ
  choice: ọnụ ụzọ
  alternative: ọnụ ụzọ ámá
  rationale: “Ọnụ ụzọ” bụ ntụgharị mkpụrụokwu kacha nso ma na-echekwa nkwupụta “Abụ m” nke Jọn. Ma ebe onyinyo ahụ bụ nke ogige atụrụ, “ọnụ ụzọ ámá” ka bụ nkọwa kwe omume, ya mere e debere ya n’ala peeji kama ime ka isi ederede kpebie okwu ahụ kpamkpam.
- issue: Obosara ihe σωθήσεται pụtara
  choice: a ga-azọpụta ya
  alternative: a ga-anapụta ya
  rationale: “A ga-azọpụta ya” anaghị eme ka okwu ahụ bụrụ naanị nzọpụta pụọ n’ihe ize ndụ anụ ahụ, ọ naghịkwa ebubata usoro nkụzi sara mbara karịa ihe amaokwu ahụ kwuru. Ọ na-ahapụ ma echiche nzọpụta ime mmụọ ma onyinyo nchekwa nke atụrụ ka ha dị.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta, mee ntụgharị a. A họọrọ ahịrịokwu dị nkenke iji chekwaa ike na ịdị mfe nke okwu Grik, ma e zere ịkọwafe ihe atụ ahụ.
