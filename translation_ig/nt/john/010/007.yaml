id: JHN.10.7
reference: John 10:7
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Εἶπεν οὖν πάλιν ⸀αὐτοῖς ὁ Ἰησοῦς· Ἀμὴν ἀμὴν λέγω ὑμῖν ⸀ὅτι ἐγώ εἰμι ἡ θύρα τῶν προβάτων.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/007.yaml
  text: So Jesus said to them again[a], “Truly, truly, I say to you, I am the door for the sheep.”
translation:
  language: ig
  text: Ya mere, Jizọs gwakwara ha ọzọ, “N’ezie, n’ezie, ana m asị unu, Abụ m ọnụ ụzọ nke atụrụ.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ọnụ ụzọ maka atụrụ.” Okwu Grik ahụ nwere ike ịpụta ọnụ ụzọ ụlọ ma ọ bụ ọnụ ụzọ ogige, karịsịa n’ihe atụ banyere ịzụ atụrụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Ya mere
  rationale: Na-egosi njikọ echiche na ihe mere tupu amaokwu a, ma na-ada nke ọma n'Igbo ugbu a.
- source_word: πάλιν
  choice: ọzọ
  rationale: Na-egosi na Jizọs kwuru okwu ọzọ ma ọ bụ kwughachiri nkọwa ya.
- source_word: Ἀμὴν ἀμὴν
  choice: N’ezie, n’ezie
  rationale: Na-echekwa nkwughachi na ịdị arọ nke usoro okwu pụrụ iche Jizọs ji amalite nkwupụta siri ike.
- source_word: λέγω ὑμῖν
  choice: ana m asị unu
  rationale: Ọ bụ nsụgharị Igbo doro anya ma dị nso n'ụdị okwu Grik nke dị ugbu a.
- source_word: ἐγώ εἰμι
  choice: Abụ m
  rationale: Na-enye njirimara onwe onye ahụ kpọmkwem n'Igbo n'enweghị ịgbakwunye nkọwa ozizi.
- source_word: θύρα
  choice: ọnụ ụzọ
  rationale: Pụtara ụzọ e si abanye; ọ dabara ma n'ọnụ ụzọ ụlọ ma n'ọnụ ụzọ ogige, ya mere ọ na-echekwa obosara ihe okwu Grik nwere ike ịpụta.
- source_word: τῶν προβάτων
  choice: atụrụ
  rationale: E ji nhazi 'ọnụ ụzọ atụrụ' chekwaa njikọ genitive ahụ n'ụzọ Igbo dị nkenke, n'agbanyeghị na ihe ọ pụtara nwere ike ịbụ ọnụ ụzọ metụtara atụrụ ma ọ bụ nke a na-eji abịakwute ha.
theological_decisions:
- issue: Njirimara ihe atụ dị n'okwu “Abụ m”
  choice: Abụ m ọnụ ụzọ atụrụ
  alternative: Abụ m ọnụ ụzọ maka atụrụ
  rationale: Nhọrọ a na-edebe ihe atụ ahụ na njikọ dị n'etiti ọnụ ụzọ na atụrụ n'enweghị ịkọwa ya karịa ka Grik si kwuo. Nhọrọ ọzọ na-eme ka uru ọnụ ụzọ ahụ bara atụrụ pụta ìhè, ma ọ na-akọwa ụdị njikọ genitive ahụ karịa.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke dị ùgwù ma dị mfe nghọta. E chekwara nkwughachi “N’ezie, n’ezie” na ihe atụ “ọnụ ụzọ” n’enweghị itinye nkọwa otu ụka ọ bụla.
