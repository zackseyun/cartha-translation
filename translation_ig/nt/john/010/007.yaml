    text: A pụkwara ịsụgharị ya, “ọnụ ụzọ maka atụrụ.” Okwu Grik ahụ nwere ike ịpụta ọnụ ụzọ ụlọ ma ọ bụ ọnụ ụzọ ogige, karịsịa n’ihe atụ banyere ịzụ atụrụ.
    reason: lexical_alternative
  revision_rationale: Revised only the Igbo rendering of the Greek genitive τῶν προβάτων by adding “nke.” This makes the relation explicit grammatically but does not interpret its precise force. The alternative “maka atụrụ” is retained in the footnote, consistent with the contextual sheepfold image and the English audit trail.
