review_pass:
  verdict: revise
  source_fidelity: A chọrọ obere mmezi. «Mụ onwe m kwuru» na-agbakwunye nkwusi ike ('myself') nke ἐγώ na-adịghị eme n'ụzọ doro anya n'amaokwu a; «M kwuru» na-edobe isiokwu onye mbụ nke Igbo chọrọ n'enweghị mgbakwunye. «Ọ̀ bụghị na e dere ya» na-anọchi anya οὐκ ἔστιν γεγραμμένον nke ọma karịa «e deghị ya», n'ihi na ọ na-ekwu maka ihe Akwụkwọ Nsọ e dere ka dị ugbu a.
  naturalness: «Jizọs zara ha, sị:» na «Ọ̀ bụghị na e dere ya n’Iwu unu» bụ Igbo Izugbe dị eke ma dị ugwu. Iwepu «onwe m» na ime ka mkpụrụokwu dị n'ime ihe e hotara bụrụ obere akwụkwọ na-eme ka ahịrịokwu ahụ dịkwuo nkịtị.
  terminology: «Iwu» (nke e jiri mkpụrụedemede ukwu dee) kwesịrị ekwesị maka νόμος n'ọrụ ya sara mbara ebe a. «chi» na-echekwa ọtụtụ Θεοί na mgbagwoju anya nke nrụtụ aka na Abụ Ọma 82:6. Ihe odide ala peeji kwesịrị inye naanị ohere ntụgharị okwu, ọ bụghị ịkọwa mkpebi nkọwa; «ndị dị ka chi» bụ nhọrọ Igbo a na-agụ nke ọma maka 'divine beings' n'ọnọdụ a.
  issues:
  - severity: medium
    issue: «Mụ onwe m kwuru»
    rationale: «onwe m» na-egosi nkwusi ike pụrụ iche ('I myself') nke ederede Grik anaghị achọ n'ebe a. «M kwuru» ka na-asụgharị Ἐγώ n'ụzọ zuru ezu n'ihi na Igbo chọrọ isiokwu onye mbụ.
  - severity: medium
    issue: «Ọ̀ bụ na e deghị ya»
    rationale: Nke a nwere ike ịpụta na e dereghị ihe ahụ. Perfect passive γεγραμμένον n'usoro mkpụrụokwu Akwụkwọ Nsọ a na-ekwu, 'ọ bụghị na e dere ya,' ya bụ, 'is it not written?'
