source:
  edition: SBLGNT
  text: ἀπεκρίθη αὐτοῖς ὁ Ἰησοῦς· Οὐκ ἔστιν γεγραμμένον ἐν τῷ νόμῳ ὑμῶν ⸀ὅτι Ἐγὼ εἶπα· Θεοί ἐστε;
base_translation:
  language: en
  yaml_path: translation/nt/john/010/034.yaml
  text: Jesus answered them[a], “Is it not written in your Law, ‘I said, you are gods’?”
translation:
  language: ig
  text: 'Jizọs zara ha, sị: “Ọ̀ bụghị na e dere ya n’Iwu unu, ‘M kwuru, unu bụ chi’?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị dị ka chi.” Jizọs na-ehota Abụ Ọma 82:6; a ka na-arụrịta ụka banyere ihe okwu ahụ pụtara n’ebe ahụ. Ihe e dere n’elu na-edobe okwu e hotara kpọmkwem.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη αὐτοῖς
  choice: zara ha
  rationale: Nke a bụ ụzọ Igbo kwụ ọtọ ma dịkwa eke isi kwuo na Jizọs nyere ha azịza.
- source_word: Οὐκ ἔστιν γεγραμμένον
  choice: Ọ̀ bụ na e deghị ya
  rationale: Ajụjụ a na-atụ anya nkwenye na-egosipụta ụdị ajụjụ Grik ahụ, ebe ‘e deghị ya’ na-edobe echiche nke ihe e dere nke ka dị ire.
- source_word: ἐν τῷ νόμῳ ὑμῶν
  choice: n’Iwu unu
  rationale: ‘Iwu’ n’ebe a bụ aha sara mbara maka Akwụkwọ Nsọ ndị Juu, ebe okwu e hotara sitere n’Abụ Ọma 82:6; mkpụrụedemede ukwu na-egosi ojiji pụrụ iche a.
- source_word: Ἐγὼ εἶπα
  choice: Mụ onwe m kwuru
  rationale: ‘Mụ onwe m’ na-egosipụta nnọchiaha doro anya Ἐγώ dị n’ihe e hotara, n’ụzọ Igbo na-ada nke ọma.
- source_word: Θεοί
  choice: chi
  rationale: ‘Chi’ bụ ntụgharị kpọmkwem nke ọtụtụ θεοί n’okwu a; ụdị ya adịghị agbanwe n’ọnụọgụ n’Igbo, ebe ‘unu bụ’ na-eme ka ọtụtụ pụta ìhè.
- source_word: ἐστε
  choice: Unu bụ
  rationale: A tụgharịrị ngwaa njikọ ahụ ozugbo, n’etinyeghị echiche ọzọ dịka ‘a kpọrọ unu.’
theological_decisions:
- issue: Otu e si tụgharị θεοί n’ihe Jizọs hotara n’Abụ Ọma 82:6
  choice: chi
  alternative: ndị mmụọ dị nsọ / ndị nwere ọdịdị chi
  rationale: ‘Chi’ na-edobe okwu ahụ kpọmkwem na ike arụmụka Jizọs, kama ịkọwa ozugbo ndị okwu ahụ na-ezo aka na ha. Ihe odide ala peeji na-echekwa ntụgharị ọzọ n’ihi na a ka na-arụrịta ụka banyere nkọwa okwu ahụ.
translation_notes:
  register: Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta. E ji ‘Iwu’ mee aha sara mbara nke Akwụkwọ Nsọ ndị Juu n’okwu a, ma hapụkwara ‘chi’ ka ọ chekwaa mgbagwoju anya na esemokwu nkọwa dị na isi mmalite.
