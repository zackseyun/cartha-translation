review_pass:
  verdict: revise
  source_fidelity: 'The draft preserves the Greek sequence and core contrasts: the wage-worker is not the shepherd, the sheep are not his own, he sees the wolf coming, leaves the sheep, flees, and the wolf seizes and scatters them. However, the finite present verbs ἀφίησιν and φεύγει need explicit present-tense Igbo forms rather than bare forms that can read as imperatives or disrupt the sequence.'
  naturalness: The relative clause concerning ownership is understandable but stiff. Recasting it as “onye atụrụ ndị ahụ na-abụghị nke ya” is retained only with a clearer relative connector; the principal necessary improvement is to use “na-ahapụ” and “na-agbapụ.” The resulting sentence is natural, modern Standard Igbo and retains the vivid present narration.
  terminology: “Onye e goro ọrụ” suitably renders μισθωτός; “onye ọzụzụ atụrụ,” “atụrụ,” and “anụ ọhịa wolf” preserve the pastoral imagery without interpretation. “Na-ejide ha n’ike” adequately conveys the violent force of ἁρπάζει, while “chụsaa ha” conveys scattering.
  issues:
  - severity: medium
    issue: The forms “hapụ” and “gbapụ” occur after “na-ahụ” without present/aspect marking.
    rationale: In this context, the Greek uses present-tense verbs (“leaves” and “flees”). Bare Igbo forms may be read as imperative forms and make the verbal sequence less clear. “Na-ahapụ ... ma na-agbapụ” accurately and naturally represents the ongoing/vivid present actions.
  - severity: low
    issue: The ownership relative clause is syntactically heavy.
    rationale: Adding the relative connector “nke” before “atụrụ ndị ahụ na-abụghị nke ya” makes the appositional description easier to process while preserving the source’s statement that the sheep are not his own.
  revised_text: Onye e goro ọrụ, onye na-abụghị onye ọzụzụ atụrụ, nke atụrụ ndị ahụ na-abụghị nke ya, na-ahụ anụ ọhịa wolf ka ọ na-abịa, na-ahapụ atụrụ ndị ahụ ma na-agbapụ—anụ ọhịa wolf ahụ na-ejide ha n’ike ma chụsaa ha.
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “gbahapụ atụrụ ndị ahụ.” Ngwaa a sụgharịrị “na-ahapụ” nwekwara ike ịpụta ịgbahapụ ha mgbe ha nọ n’ihe ize ndụ.
    reason: lexical_alternative
  revision_rationale: The revision corrects verbal aspect and clause flow without adding interpretation. It retains the source’s deliberate contrast between the hired worker and the shepherd, the ownership statement, and the wolf’s two actions. The footnote remains anchored to “na-ahapụ” and accurately presents the stronger contextual sense of ἀφίησιν.
