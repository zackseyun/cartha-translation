revisions:
- from: Onye e goro ọrụ, onye na-abụghị onye ọzụzụ atụrụ, onye atụrụ ndị ahụ na-abụghị nke ya, na-ahụ anụ ọhịa wolf ka ọ na-abịa, hapụ[a] atụrụ ndị ahụ gbapụ—anụ ọhịa wolf ahụ wee jide ha n’ike ma chụsaa ha.
  to: Onye e goro ọrụ, onye na-abụghị onye ọzụzụ atụrụ, nke atụrụ ndị ahụ na-abụghị nke ya, na-ahụ anụ ọhịa wolf ka ọ na-abịa, na-ahapụ atụrụ ndị ahụ ma na-agbapụ—anụ ọhịa wolf ahụ na-ejide ha n’ike ma chụsaa ha.
  rationale: The revision corrects verbal aspect and clause flow without adding interpretation. It retains the source’s deliberate contrast between the hired worker and the shepherd, the ownership statement, and the wolf’s two actions. The footnote remains anchored to “na-ahapụ” and accurately presents the stronger contextual sense of ἀφίησιν.
