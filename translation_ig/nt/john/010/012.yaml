id: JHN.10.12
reference: John 10:12
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ ⸀μισθωτὸς καὶ οὐκ ὢν ποιμήν, οὗ οὐκ ⸀ἔστιν τὰ πρόβατα ἴδια, θεωρεῖ τὸν λύκον ἐρχόμενον καὶ ἀφίησιν τὰ πρόβατα καὶ φεύγει— καὶ ὁ λύκος ἁρπάζει αὐτὰ καὶ ⸀σκορπίζει—
base_translation:
  language: en
  yaml_path: translation/nt/john/010/012.yaml
  text: The hired hand[a], who is not a shepherd and whose sheep are not his own, sees the wolf coming and leaves the sheep and flees—and the wolf snatches them and scatters them.
translation:
  language: ig
  text: Onye e goro ọrụ, onye na-abụghị onye ọzụzụ atụrụ, nke atụrụ ndị ahụ na-abụghị nke ya, na-ahụ anụ ọhịa wolf ka ọ na-abịa, na-ahapụ atụrụ ndị ahụ ma na-agbapụ—anụ ọhịa wolf ahụ na-ejide ha n’ike ma chụsaa ha.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μισθωτός
  choice: onye e goro ọrụ
  rationale: Nke a na-egosi onye na-arụ ọrụ maka ụgwọ, n’asụsụ Igbo dị mfe ma dị ugbu a, ma na-edobe ọdịiche dị n’etiti ya na ezi onye ọzụzụ atụrụ.
- source_word: οὐκ ὢν ποιμήν
  choice: onye na-abụghị onye ọzụzụ atụrụ
  rationale: E jiri nkebiokwu nkọwa mee participle Grik ahụ ka ọ bụrụ Igbo doro anya, ma chekwaa nkwupụta na onye ahụ abụghị onye ọzụzụ atụrụ.
- source_word: οὗ οὐκ ἔστιν τὰ πρόβατα ἴδια
  choice: onye atụrụ ndị ahụ na-abụghị nke ya
  rationale: Nke a na-egosi na atụrụ ndị ahụ abụghị ihe nke ya ma ọ bụ ndị nwere mmekọrịta pụrụ iche n’ebe ọ nọ.
- source_word: θεωρεῖ
  choice: na-ahụ
  rationale: N’ebe a, okwu ahụ na-egosi ịhụ ihe ize ndụ na-abịa; ‘na-ahụ’ bụ okwu Igbo nkịtị ma zuru ezu.
- source_word: τὸν λύκον ἐρχόμενον
  choice: anụ ọhịa wolf ka ọ na-abịa
  rationale: Nke a na-edobe mmegharị dị ndụ nke participle dị ugbu a. E tinyere ‘anụ ọhịa’ iji nyere onye na-agụ Igbo aka ịghọta aha anụmanụ a gbazitere.
- source_word: ἀφίησιν
  choice: hapụ
  rationale: ‘Hapụ’ bụ nhata okwu sara mbara nke nwere ike ịpụta ịhapụ naanị ya ma ọ bụ ịgbahapụ n’ihe ize ndụ; ihe gbara ya gburugburu na-egosi ụta dị n’omume ahụ.
- source_word: φεύγει
  choice: gbapụ
  rationale: Okwu a dị mkpụmkpụ ma doo anya, na-egosikwa ịgba ọsọ pụọ n’ihi ihe ize ndụ.
- source_word: ἁρπάζει
  choice: jide ha n’ike
  rationale: Nke a na-egosi njide ike nke anụ na-eri anụ, n’etinyeghị nkọwa karịrị ihe Grik kwuru.
- source_word: σκορπίζει
  choice: chụsaa ha
  rationale: Nke a na-egosi na atụrụ ndị ahụ gbasara ebe dị iche iche; e kwuru ‘ha’ n’Igbo maka ido anya.
- source_word: πρόβατα
  choice: atụrụ ndị ahụ
  rationale: Aha ọtụtụ a na-edobe ihe atụ atụrụ n’onwe ya kama iji okwu mkpokọta ga-eme ka onyinyo ahụ daa mba.
theological_decisions:
- issue: Ike ihe atụ nke onye ọzụzụ atụrụ
  choice: E debere ‘onye ọzụzụ atụrụ,’ ‘onye e goro ọrụ,’ ‘atụrụ,’ na ‘wolf’ dị ka okwu ọrụ ịzụ anụ n’ime ihe atụ ahụ.
  alternative: Ịsụgharị ha n’ụzọ nkọwa dịka ‘onye ndu’ ma ọ bụ ‘onye nlekọta.’
  rationale: Jọn 10 ji ihe atụ onye ọzụzụ atụrụ na-aga n’ihu. Ịgbanwe okwu ndị a ka ha bụrụ nkọwa ozizi ga-ebelata ihe atụ ahụ ma webata nkọwa Grik ahụ ekwughị.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-edobe usoro omume nke Grik na ihe atụ pastoral ya; akara ogologo na-ejikọta nsonaazụ omume onye e goro ọrụ na mwakpo wolf.
