id: JHN.10.29
reference: John 10:29
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ πατήρ μου ⸀ὃ δέδωκέν ⸀μοι ⸂πάντων μεῖζων⸃ ἐστίν, καὶ οὐδεὶς δύναται ἁρπάζειν ἐκ τῆς χειρὸς τοῦ ⸀πατρός.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/029.yaml
  text: My Father[a], who has given them to me, is greater than all, and no one is able to snatch them out of the Father's hand.
translation:
  language: ig
  text: Nna m[a], onye nyere m ha, karịrị ihe niile; ọ dịghịkwa onye ọ bụla pụrụ ịnapụ ha n’aka Nna.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ, n’ụzọ kwekọrọ nnọọ n’okwu Grik: “Nna m, ihe o nyere m, dị ukwuu karịa ihe niile.” Usoro okwu Grik dị n’ebe a siri ike, ụfọdụ na-aghọtakwa na ọ bụ onyinye ahụ n’onwe ya, ọ bụghị ndị e nyere, bụ isiokwu ntụnyere ahụ.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ πατήρ μου
  choice: Nna m
  rationale: Nke a bụ ụzọ Igbo si ekwu okwu a n'ụzọ ebumpụta ụwa, ma na-echekwa mmekọrịta Jizọs dị ka Ọkpara na Chineke.
- source_word: ὃ δέδωκέν μοι
  choice: onye nyere m ha
  rationale: Ọ bụ ezie na nnọchiaha Grik ahụ bụ nke na-anọpụ iche ma nwee ihe isi ike n'usoro okwu, ihe gbara amaokwu ahụ gburugburu na-ekwu banyere atụrụ ahụ. Ya mere, e jiri ụdị na-ezo aka n’ebe Nna nọ, tinyekwa “ha” iji mee ka ndị e nyere Jizọs doo anya, ebe ndetu ala na-echekwa ntụgharị nkịtị ọzọ.
- source_word: πάντων μεῖζων
  choice: dị ukwuu karịa ihe niile
  rationale: Nke a na-echekwa ịdị obosara nke ntụnyere ahụ n’ebughị ụzọ kpebie ma ọ bụ mmadụ niile ka ọ bụ ihe niile ka a na-ekwu kpọmkwem.
- source_word: οὐδεὶς δύναται
  choice: ọ dịghịkwa onye ọ bụla pụrụ
  rationale: “Pụrụ” na-egosipụta ike ma ọ bụ enweghị ike dị na δύναται, ma bụrụkwa okwu Igbo doro anya.
- source_word: ἁρπάζειν
  choice: ịnapụ
  rationale: N’ebe a, “ịnapụ” na-egosi iwepụ mmadụ n’ike n’aka onye na-eche ya, kwekọrọ n’onyonyo dị n’amaokwu 28–29.
- source_word: ἐκ τῆς χειρὸς τοῦ πατρός
  choice: n’aka Nna ahụ
  rationale: Nke a na-echekwa ihe atụ nke aka dịka nchebe, ikike, na inwe; “Nna ahụ” na-ezo aka n’ebe Nna Jizọs nọ n'ụzọ doro anya.
theological_decisions:
- issue: Ihe isi ike nke ederede na usoro okwu n’ebe ὃ δέδωκέν μοι dị
  choice: A sụgharịrị ya dịka “Nna m, onye nyere m ha,” dabere n’atụrụ ndị e kwuru okwu ha n’amaokwu ndị bu ụzọ.
  alternative: “Nna m, ihe o nyere m, dị ukwuu karịa ihe niile.”
  rationale: Ederede Grik e bipụtara siri ike n’usoro okwu, ihe odide ochie dị iche iche nwekwara ọdịiche. Ihe gbara ya gburugburu na-akwado ịghọta ndị e nyere Ọkpara dịka atụrụ ahụ, ma ntụgharị nke na-eme “ihe e nyere” isiokwu ntụnyere ahụ ka bụ ihe ga-ekwe omume; ya mere, e debere ya na ndetu ala.
- issue: Oke ntụnyere dị na πάντων μεῖζων
  choice: “dị ukwuu karịa ihe niile”
  alternative: “dị ukwuu karịa mmadụ niile”
  rationale: πάντων nwere ike ịdị obosara, ya mere ntụgharị a anaghị amanye nghọta na ọ bụ naanị mmadụ ma ọ bụ naanị ihe ka a na-atụnyere.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. Ahịrịokwu ahụ na-agbaso okwu ndị mmadụ na-eji eme ihe, ebe ndetu ala na-echekwa mgbagwoju anya dị n’asụsụ Grik.
