  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐκύκλωσαν οὖν αὐτὸν οἱ Ἰουδαῖοι καὶ ἔλεγον αὐτῷ· Ἕως πότε τὴν ψυχὴν ἡμῶν αἴρεις; εἰ σὺ εἶ ὁ χριστός, εἰπὲ ἡμῖν παρρησίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/024.yaml
  text: So the Jews surrounded him and were saying to him[a], “How long will you keep us in suspense? If you are the Messiah[b], tell us plainly.”
translation:
  language: ig
  text: Ya mere, ndị Juu[a] gbara ya gburugburu ma na-asị ya, “Ruo ole mgbe ka ị ga-eme ka anyị nọgide n'amaghị ihe? Ọ bụrụ na ị bụ Mesaya, gwa anyị ya hoo haa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N'akwụkwọ Jọn, “ndị Juu” pụrụ, dịka ihe gbara okwu ahụ gburugburu si dị, izo aka kpọmkwem n’ndị isi ọchịchị ndị Juu ma ọ bụ n’ndị na-emegide Jizọs, ọ bụghị n’ụmụ Juu niile.
    reason: cultural_note
lexical_decisions:
- source_word: ἐκύκλωσαν
  choice: gbara ya gburugburu
  rationale: Nke a na-egosipụta kpọmkwem na ha nọchiri ya gburugburu, ma na-echekwa mmetụta nke nrụgide dị n'ọnọdụ ahụ.
- source_word: οὖν
  choice: Ya mere
  rationale: Ọ na-ejikọta ihe a na ihe bu ya ụzọ ma na-egosi nzọụkwụ akụkọ na-esote.
- source_word: οἱ Ἰουδαῖοι
  choice: ndị Juu
  rationale: Nke a na-edobe okwu Grik ahụ n'ozuzu ya, n'ebughị ụzọ kpebie na ọ bụ naanị ndị isi; nkọwa ala peeji na-akọwa na ebe ụfọdụ n'akwụkwọ Jọn okwu a nwere ike izo aka n'otu ìgwè pụrụ iche.
- source_word: ἔλεγον
  choice: na-asị ya
  rationale: Ụdị a na-egosipụta omume na-aga n'ihu nke imperfect Grik ahụ n'Igbo dị mfe.
- source_word: Ἕως πότε
  choice: Ruo ole mgbe
  rationale: Nke a bụ ụzọ Igbo doro anya na nke nkịtị e si ajụ oge ihe ga-akwụsị.
- source_word: τὴν ψυχὴν ἡμῶν αἴρεις
  choice: ị ga-edebe anyị n’ọnọdụ amaghị ihe anyị ga-ekwere
  rationale: Akpaalaokwu Grik ahụ pụtara ime ka mmadụ nọgide na-ejighị n'aka. Nsụgharị a na-enye nghọta ahụ n'Igbo nkịtị, ebe nkọwa ala peeji na-echekwa onyinyo okwu mbụ ahụ.
- source_word: ὁ χριστός
  choice: Mesaya
  rationale: N'ebe a Χριστός bụ utu aha onye e tere mmanụ ahụ ndị Juu na-atụ anya ya, ya mere “Mesaya” na-echekwa ọnọdụ ajụjụ ahụ.
- source_word: εἰπὲ ἡμῖν
  choice: gwa anyị ya
  rationale: Nke a bụ iwu kpọmkwem ma bụrụkwa okwu Igbo e ji ekwu ihe n'ụzọ nkịtị.
- source_word: παρρησίᾳ
  choice: hoo haa
  rationale: Akpaalaokwu Igbo a na-egosi ikwu ihe n'ụzọ doro anya, n'enweghị mgbagwoju anya ma ọ bụ izochi ya.
theological_decisions:
- issue: Nsụgharị Χριστός
  choice: Mesaya
  alternative: Kraịst
  rationale: Okwu ahụ na-arụ ọrụ dị ka utu aha onye nzọpụta-eze ndị Juu na-atụ anya ya, ọ bụghị dị ka aha nkịtị.
- issue: Ndị οἱ Ἰουδαῖοι na-ezo aka na ha n'akwụkwọ Jọn
  choice: ndị Juu
  alternative: ndị isi ndị Juu; ndị Judia
  rationale: Amaokwu ahụ n'onwe ya akọwaghị na ha bụ naanị ndị isi ma ọ bụ ndị Judia. Isi ederede na-edobe obosara okwu Grik ahụ, ebe nkọwa ala peeji na-echekwa ohere na ihe gbara ya gburugburu nwere ike ime ka ọ dị warara.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “Hoo haa” na-enye ike nke παρρησίᾳ n'ụzọ eke. E debere “ndị Juu” n'isi ederede iji ghara imechi ihe okwu Grik ahụ nwere ike ịpụta; a kọwara nghọta dị warara n'ala peeji.
