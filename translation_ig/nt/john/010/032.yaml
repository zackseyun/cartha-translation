  text: ἀπεκρίθη αὐτοῖς ὁ Ἰησοῦς· Πολλὰ ⸂ἔργα καλὰ ἔδειξα ὑμῖν⸃ ἐκ τοῦ ⸀πατρός· διὰ ποῖον αὐτῶν ἔργον ⸂ἐμὲ λιθάζετε⸃;
base_translation:
  language: en
  yaml_path: translation/nt/john/010/032.yaml
  text: Jesus answered them[a], “I showed you many good works from the Father[b]; for which of them are you stoning me?”
translation:
  language: ig
  text: Jizọs zara ha, “Egosiri m unu ọtụtụ ezi ọrụ ndị sitere n’aka Nna; n’ihi ọrụ olee n’ime ha ka unu na-atụ m nkume?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: zara
  rationale: Nke a bụ okwu Igbo a na-ejikarị akọ nzaghachi n’akụkọ, ọ na-enyekwa echiche nke ịza okwu n’enweghị mgbakwunye.
- source_word: Πολλὰ ἔργα καλὰ
  choice: ọtụtụ ezi ọrụ
  rationale: “Ọrụ” na-echekwa ἔργα n’ụzọ kwekọrọ n’iji okwu ahụ eme ihe n’Oziọma Jọn, ebe “ezi” na-egosi na ọrụ ndị ahụ dị mma ma baa uru.
- source_word: ἔδειξα
  choice: Egosiri m unu
  rationale: Oge gara aga dị mfe na Igbo na-egosipụta aorist ahụ nke ọma; “igosi” na-echekwa echiche nke ime ka ọrụ ndị ahụ pụta ìhè n’anya ha.
- source_word: ἐκ τοῦ πατρός
  choice: ndị sitere n’aka Nna
  rationale: Nke a na-egosi mmalite ma ọ bụ isi iyi nke ọrụ ndị ahụ, ma na-ezere ịgbakwunye “m” ebe Grik na-ekwughị “Nna m.”
- source_word: διὰ ποῖον αὐτῶν ἔργον
  choice: ọ̀ bụ n’ihi ọrụ nke dị n’ime ha
  rationale: “N’ihi” na-egosipụta ihe kpatara ya dịka διά na accusative si mee; “ọrụ nke dị n’ime ha” na-echekwa otu ọrụ n’etiti ọtụtụ ọrụ e kwuru banyere ha.
- source_word: λιθάζετε
  choice: ka unu ji atụ m nkume
  rationale: Nkebiokwu Igbo a na-egosi ihe ha na-eme ma ọ bụ na-achọ ime n’ọnọdụ ahụ, n’agbanyeghị na ọ naghị agbakwunye okwu pụtara kpọmkwem “na-anwa.”
theological_decisions:
- issue: Aha “Nna” n’okwu Jizọs
  choice: ndị sitere n’aka Nna
  alternative: ndị sitere n’aka Nna m
  rationale: Ihe odide Grik enweghị nnọchiaha μου (“m”). Ya mere, a hapụrụ ya “Nna” ka a ghara ime ka nkwupụta mmekọrịta Jizọs na Nna sie ike karịa okwu dị na isi mmalite, ebe ọnọdụ gbara ya gburugburu ka na-eme ka mmekọrịta ahụ doo anya.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke ugwu dị na ya ma dị mfe nghọta. A họọrọ “Jizọs,” “Nna,” na “ịtụ nkume” dịka okwu Akwụkwọ Nsọ a maara nke ọma. Enweghị akara nkọwa ala peeji n’ihi na nkọwa Bekee [a] yiri ka e jikọtara ya na ebe na-ekwesịghị ekwesị, ebe nke [b] bụ ihe e chekwara kpọmkwem n’ahịrịokwu Igbo n’enweghị mkpa nkọwa ọzọ.
