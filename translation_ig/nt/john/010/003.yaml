  text: τούτῳ ὁ θυρωρὸς ἀνοίγει, καὶ τὰ πρόβατα τῆς φωνῆς αὐτοῦ ἀκούει καὶ τὰ ἴδια πρόβατα ⸀φωνεῖ κατ’ ὄνομα καὶ ἐξάγει αὐτά.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/003.yaml
  text: To him the gatekeeper opens[a], and the sheep hear his voice, and he calls his own sheep by name and leads them out.
translation:
  language: ig
  text: Onye nche ọnụ ụzọ na-emeghere ya ụzọ, atụrụ ndị ahụ na-anụkwa olu ya. Ọ na-akpọ atụrụ nke ya, nke ọ bụla n’aha ya, na-edupụkwa ha apụ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “na-ebupụkwa ha apụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τούτῳ
  choice: ya
  rationale: Nnọchiaha a na-arụtụ aka n’onye ọzụzụ atụrụ a kpọrọ aha n’amaokwu bu ụzọ; “ya” bụ ụzọ Igbo si ekwu ya n'ụzọ doro anya ma dịkwa mfe.
- source_word: ὁ θυρωρός
  choice: Onye nche ọnụ ụzọ
  rationale: Ọ na-egosi onye na-eche ma na-emeghe ụzọ mbata n’ogige atụrụ; okwu a dabara n’ihe atụ ahụ ma ghara ịdị ochie.
- source_word: ἀνοίγει
  choice: na-emeghere
  rationale: Ụdị a na-egosi na onye nche meghere ụzọ maka onye ahụ; ọ na-ejikọta nke ọma na “ya.”
- source_word: τὰ πρόβατα
  choice: atụrụ ndị ahụ
  rationale: Nke a bụ ntụgharị nkịtị nke πρόβατα ma na-edebe ihe atụ banyere ìgwè atụrụ.
- source_word: τῆς φωνῆς αὐτοῦ ἀκούει
  choice: na-anụkwa olu ya
  rationale: Ọ na-edebe echiche nke ịnụ na ịmata olu onye ọzụzụ atụrụ, n’etinyeghị nkọwa ọzọ n’ihe odide ahụ.
- source_word: τὰ ἴδια πρόβατα
  choice: atụrụ nke ya
  rationale: “Nke ya” na-egosipụta ma nwe ha na mmekọrịta pụrụ iche e ji ἴδια mesie ike.
- source_word: φωνεῖ
  choice: na-akpọ
  rationale: “Na-akpọ” bụ okwu Igbo dị mfe nke dabara n’ịkpọ anụmanụ ma ọ bụ mmadụ ka ọ bịakwute onye na-akpọ ya.
- source_word: κατ’ ὄνομα
  choice: nke ọ bụla n’aha
  rationale: Nke a na-eme ka o doo anya n’Igbo na ọ na-akpọ ha n’otu n’otu, onye ọ bụla n’aha ya, dịka akpaalaokwu Grik ahụ si pụta.
- source_word: ἐξάγει αὐτά
  choice: na-edupụkwa ha
  rationale: ἐξάγω nwere ike ịpụta idupụ ma ọ bụ ịkpọpụta; “na-edupụkwa ha” dabara n’ọrụ onye ọzụzụ atụrụ ma na-edebe echiche nke nduzi.
theological_decisions:
- issue: Ihe atụ onye ọzụzụ atụrụ na onye na-eme ihe
  choice: 'E debere omume niile dịka nke onye ọzụzụ atụrụ ahụ: onye nche ọnụ ụzọ na-emeghere ya, atụrụ na-anụ olu ya, ọ na-akpọ nke ya n’aha ma na-edupụ ha.'
  alternative: Ịkpọ onye ọzụzụ atụrụ ahụ Jizọs kpọmkwem n’amaokwu a.
  rationale: Ọ bụ ezie na okwu gbara amaokwu a gburugburu na-akọwa ihe atụ ahụ, amaokwu a n’onwe ya anaghị akpọ aha Jizọs; ya mere ntụgharị ahụ anaghị etinye nkọwa Kraịst n’ime okwu ahụ n’onwe ya.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke oge a ma dị nsọ n’ụzọ kwesịrị ekwesị. Ahịrịokwu abụọ na-eme ka usoro omume ahụ doo anya nye ndị na-agụ akwụkwọ nkịtị. E tinyere akara ndetu [a] ozugbo e kwuchara okwu ọ na-akọwa.
