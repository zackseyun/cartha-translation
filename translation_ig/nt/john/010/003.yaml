revisions:
- from: Onye nche ọnụ ụzọ na-emeghere ya, atụrụ ndị ahụ na-anụkwa olu ya. Ọ na-akpọ atụrụ nke ya nke ọ bụla n’aha, na-edupụkwa ha.[a]
  to: Onye nche ọnụ ụzọ na-emeghere ya ụzọ, atụrụ ndị ahụ na-anụkwa olu ya. Ọ na-akpọ atụrụ nke ya, nke ọ bụla n’aha ya, na-edupụkwa ha apụ.[a]
  rationale: The revision makes the implied opened entrance explicit for idiomatic Igbo, clarifies that the shepherd calls each of his own sheep by its name, and renders the directional force of ἐξάγει. The corrected footnote gives the valid alternative ‘bring out’ rather than changing the verb to ‘call out.’
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T06:25:54Z'
review_pass:
  verdict: revise
  source_fidelity: 'The draft preserves the sequence and agents of the Greek well: the gatekeeper opens for the shepherd, the sheep hear his voice, and he calls and leads out his own sheep. However, «na-edupụkwa ha» does not explicitly convey the outward movement of ἐξάγει, and the supplied alternative «na-akpọpụkwa ha» changes the action from leading/bringing out to calling out.'
  naturalness: «Onye nche ọnụ ụzọ» and «na-emeghere ya» are understandable Standard Igbo. Adding «ụzọ» makes the first action fully natural and explicit in Igbo. «atụrụ nke ya, nke ọ bụla n’aha ya» clearly and idiomatically expresses the distributive force of κατ’ ὄνομα.
  terminology: The pastoral terms «onye nche ọnụ ụzọ», «atụrụ», «olu», and «na-edupụ» are appropriate, modern, and retain the metaphor without importing an interpretation. The revision retains the shepherd's personal guidance while making the 'out' component explicit.
  issues:
  - severity: medium
    issue: The phrase «na-edupụkwa ha» omits the explicit outward direction in ἐξάγει αὐτά.
    rationale: ἐξάγω means lead/bring out. «na-edupụkwa ha apụ» preserves both guidance and movement out of the enclosure.
  - severity: medium
    issue: Footnote [a], «Ma ọ bụ, ‘na-akpọpụkwa ha,’» is not a lexical alternative for ἐξάγει.
    rationale: «kpọpụta» means call out, whereas ἐξάγει denotes lead or bring out. The footnote should offer an alternative that retains the movement and object of the verb.
  - severity: low
    issue: «nke ọ bụla n’aha» is somewhat elliptical and leaves the possessive relation of each sheep's name unstated.
    rationale: «nke ọ bụla n’aha ya» is clearer Standard Igbo and accurately represents the distributive expression «κατ’ ὄνομα».
  revised_text: Onye nche ọnụ ụzọ na-emeghere ya ụzọ, atụrụ ndị ahụ na-anụkwa olu ya. Ọ na-akpọ atụrụ nke ya, nke ọ bụla n’aha ya, na-edupụkwa ha apụ.[a]
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “na-ebupụkwa ha apụ.”
    reason: lexical_alternative
  revision_rationale: The revision makes the implied opened entrance explicit for idiomatic Igbo, clarifies that the shepherd calls each of his own sheep by its name, and renders the directional force of ἐξάγει. The corrected footnote gives the valid alternative ‘bring out’ rather than changing the verb to ‘call out.’
