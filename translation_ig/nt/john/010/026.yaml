  text: ἀλλὰ ὑμεῖς οὐ πιστεύετε, ⸂ὅτι οὐκ⸃ ἐστὲ ἐκ τῶν προβάτων τῶν ⸀ἐμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/026.yaml
  text: But you do not believe[a], because you are not among my sheep.
translation:
  language: ig
  text: Ma unu anaghị ekwere,[a] n’ihi na unu abụghị ndị nọ n’ìgwè atụrụ m.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Ma unu anaghị ekwere na unu abụghị ndị nọ n’ìgwè atụrụ m.” Njikọ okwu Grik ahụ nwekwara ike iwebata ihe unu na-ekweghị.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλὰ
  choice: Ma
  rationale: Na-egosi ọdịiche dị n’etiti ndị Jizọs na-agwa okwu na atụrụ ya ndị na-anụ olu ya.
- source_word: ὑμεῖς
  choice: unu
  rationale: Nnochiaha ahụ pụtara ìhè na Grik ma na-emesi ndị a na-agwa okwu ike; ‘unu’ dabara n’Igbo nkịtị.
- source_word: οὐ πιστεύετε
  choice: unu ekweghị ekwe
  rationale: Na-egosipụta omume dị ugbu a nke ekweghị ihe Jizọs kwuru; okwu a kwekọrọ n’ụzọ Jọn si eji ‘ikwere’ eme ihe.
- source_word: ὅτι
  choice: n’ihi na
  rationale: A ghọtara ya dị ka njikọ na-egosi ihe kpatara ya, dịka usoro okwu gbara amaokwu a gburugburu si kwado; e debere nghọta ọzọ n’ala peeji.
- source_word: οὐκ ἐστὲ ἐκ τῶν προβάτων
  choice: unu esoghị n’atụrụ
  rationale: ἐκ na-egosi ịbụ onye so n’otu; ‘esoghị n’atụrụ’ na-egosipụta na ha abụghị ndị so n’ìgwè atụrụ ahụ n’Igbo dị mfe ma bụrụkwa nke okike.
- source_word: τῶν ἐμῶν
  choice: m
  rationale: Ejikọtara nnọchiaha nwe na ‘atụrụ’ dịka ‘atụrụ m,’ nke bụ usoro Igbo doro anya.
theological_decisions:
- issue: Ihe ὅτι pụtara n’ihe gbasara ekweghị ekwe na ịbụ otu n’ime atụrụ Jizọs
  choice: 'Ihe kpatara ya: “n’ihi na unu esoghị n’atụrụ m”'
  alternative: 'Ihe a na-ekwere: “Ma unu ekweghị na unu esoghị n’atụrụ m”'
  rationale: Usoro okwu dị nso na-egosi ọdịiche n’etiti atụrụ Jizọs, ndị na-anụ olu ya ma na-eso ya, na ndị iro a. Ma ὅτι nwekwara ike ibute ihe ekwere; ya mere, a hapụrụ esemokwu ahụ ka ọ dị site n’ala peeji, n’etinyeghị ozizi pụrụ iche banyere nhọpụta Chineke ma ọ bụ ekweghị ekwe mmadụ.
translation_notes:
  register: Igbo Izugbe nke oge a, dị mfe ma dị ùgwù. A họọrọ ‘esoghị n’atụrụ m’ iji kwupụta ịbụ onye so n’ìgwè ahụ n’enweghị nkọwa ozizi agbakwunyere; akara ala peeji [a] dị n’ederede isi.
