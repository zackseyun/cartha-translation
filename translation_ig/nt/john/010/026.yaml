revisions:
- from: Ma unu ekweghị ekwe,[a] n’ihi na unu esoghị n’atụrụ m.
  to: Ma unu anaghị ekwere,[a] n’ihi na unu abụghị ndị nọ n’ìgwè atụrụ m.
  rationale: The revision preserves the Greek adversative and likely causal reading while using idiomatic Standard Igbo for the present negative of ‘believe.’ It also makes ἐκ τῶν προβάτων τῶν ἐμῶν explicit as belonging to Jesus’ flock, without turning the expression into a theological explanation. The footnote retains the disputed/content use of ὅτι.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T06:24:04Z'
review_pass:
  verdict: revise
  source_fidelity: The causal main reading correctly represents the likely force of ὅτι, and the footnote appropriately retains the possible content reading. However, the present wording “unu ekweghị ekwe” is not a natural, unambiguous Standard Igbo rendering of the Greek present οὐ πιστεύετε. Further, “unu esoghị n’atụrụ m” can be heard as ‘you did not follow my sheep’ and does not clearly express membership/origin from Jesus’ flock.
  naturalness: Use “unu anaghị ekwere” for a natural present negative. “Unu abụghị ndị nọ n’ìgwè atụrụ m” clearly expresses that the hearers do not belong to Jesus’ flock and avoids ambiguity with -eso (‘follow’).
  terminology: “ekwere” is appropriate Johannine belief language. “ìgwè atụrụ m” naturally identifies the flock while retaining the sheep metaphor. No doctrinal conclusion beyond the verse’s wording is added.
  issues:
  - severity: medium
    issue: “unu ekweghị ekwe” is awkward and aspectually unclear.
    rationale: It can sound reduplicative or nonstandard in this context and may suggest completed refusal rather than the Greek present statement, ‘you do not believe.’
  - severity: medium
    issue: “unu esoghị n’atụrụ m” is ambiguous.
    rationale: The verb -eso commonly means ‘follow,’ so the phrase may be understood as not following Jesus’ sheep rather than not belonging to his flock.
  - severity: low
    issue: The alternative-reading footnote does not state the content-reading function as clearly as it could.
    rationale: It should explicitly say that the conjunction may introduce what they do not believe.
  revised_text: Ma unu anaghị ekwere,[a] n’ihi na unu abụghị ndị nọ n’ìgwè atụrụ m.
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “Ma unu anaghị ekwere na unu abụghị ndị nọ n’ìgwè atụrụ m.” Njikọ okwu Grik ahụ nwekwara ike iwebata ihe unu na-ekweghị.
    reason: alternative_reading
  revision_rationale: The revision preserves the Greek adversative and likely causal reading while using idiomatic Standard Igbo for the present negative of ‘believe.’ It also makes ἐκ τῶν προβάτων τῶν ἐμῶν explicit as belonging to Jesus’ flock, without turning the expression into a theological explanation. The footnote retains the disputed/content use of ὅτι.
