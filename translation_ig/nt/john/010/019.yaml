  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸀Σχίσμα πάλιν ἐγένετο ἐν τοῖς Ἰουδαίοις διὰ τοὺς λόγους τούτους.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/019.yaml
  text: Because of these words[a], a division arose again among the Jews.
translation:
  language: ig
  text: N'ihi okwu ndị a[a], nkewa bilitere ọzọ n’etiti ndị Juu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị Ἰουδαῖοι dịka “ndị bi na Judia” ma ọ bụ, n’ọnọdụ ụfọdụ n’Oziọma Jọn, “ndị ndu Juu.” “Ndị Juu” n’ebe a na-egosipụta okwu Grik ahụ; ma n’Oziọma Jọn, ọ na-ezokarị aka n’otu ìgwè ọnọdụ okwu ahụ na-akọwa, ọ bụghị ndị Juu niile.
    reason: lexical_alternative
lexical_decisions:
- source_word: Σχίσμα
  choice: nkewa
  rationale: Okwu a pụtara ndọwa ma ọ bụ nkewa; n’ebe a, ọ na-egosi na ndị nụrụ okwu Jizọs kewara n’echiche ha.
- source_word: πάλιν
  choice: mekwara
  rationale: Ụdị ‘mekwara’ na-egosi na nkewa dị otú a emeworị na mbụ, ma na-eme ka ahịrịokwu ahụ daa nke ọma n’Igbo.
- source_word: ἐγένετο
  choice: bilie
  rationale: N’ebe a γίνομαι na-egosi na ọnọdụ ahụ malitere ịdị; ‘bilie’ bụ ụzọ Igbo si ekwu na nkewa malitere.
- source_word: ἐν τοῖς Ἰουδαίοις
  choice: n’etiti ndị Juu
  rationale: Nke a na-agbaso okwu Grik kpọmkwem, ma ihe odide ala peeji na-echekwa ohere na n’Oziọma Jọn okwu ahụ nwere ike izo aka n’otu ndị Juu kpọmkwem dabere n’ọnọdụ.
- source_word: διὰ
  choice: mere ka
  rationale: διά ya na ebubo na-egosi ihe kpatara ihe; ‘mere ka’ na-egosipụta njikọ ihe kpatara ya n’Igbo nkịtị.
- source_word: τοὺς λόγους τούτους
  choice: Okwu ndị a
  rationale: Nke a na-ezo aka n’ihe Jizọs kwuru tupu amaokwu a; ‘okwu ndị a’ doro anya ma bụrụkwa asụsụ Igbo e ji eme ihe ugbu a.
theological_decisions:
- issue: Ihe Ἰουδαῖοι na-ezo aka na ya n’Oziọma Jọn
  choice: E tinyere ‘ndị Juu’ n’ahịrịokwu, tinyekwa ihe odide ala peeji iji kọwaa na okwu ahụ nwere ike ịpụta ndị Judia ma ọ bụ otu ndị ndu Juu n’ọnọdụ ụfọdụ.
  alternative: ndị Judia; ndị ndu Juu
  rationale: Nke a na-echekwa okwu Grik na mgbagwoju anya ya, ma na-egbochi ka a ghọta ya dịka ebubo a na-ebo ndị Juu niile n’enweghị oke.
translation_notes:
  register: Asụsụ Igbo Izugbe dị ugbu a, dị mfe nghọta ma nwee ugwu. Nhazi ahịrịokwu ahụ na-ebute ihe kpatara nkewa ahụ ụzọ, dịka isi iyi Grik si eme.
