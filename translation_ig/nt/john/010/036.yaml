id: JHN.10.36
reference: John 10:36
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὃν ὁ πατὴρ ἡγίασεν καὶ ἀπέστειλεν εἰς τὸν κόσμον ὑμεῖς λέγετε ὅτι Βλασφημεῖς, ὅτι εἶπον· Υἱὸς τοῦ θεοῦ εἰμι;
base_translation:
  language: en
  yaml_path: translation/nt/john/010/036.yaml
  text: do you say of the one whom the Father sanctified and sent into the world[a], ‘You are blaspheming,’ because I said, ‘I am the Son of God’?”
translation:
  language: ig
  text: Ọ̀ bụ banyere onye Nna ahụ doro nsọ ma zite ya n’ụwa[a] ka unu na-ekwu sị, ‘Ị na-ekwulu Chineke,’ n’ihi na m kwuru sị, ‘Abụ m Ọkpara Chineke’?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ “rara nye” ma ọ bụ “kewapụrụ iche” maka ἡγίασεν.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡγίασεν
  choice: doro nsọ
  rationale: “Ido nsọ” na-edobe njikọ okwu ahụ na ịdị nsọ, ma n’ebe a ọ pụtakwara ịrara onye ahụ nye ma ọ bụ ikewapụ ya maka ozi pụrụ iche; nkọwa ala peeji na-egosi nghọta ndị ahụ n’enweghị ịkọwa ihe karịrị ederede.
- source_word: ἀπέστειλεν
  choice: zite
  rationale: “Zite” bụ okwu Igbo doro anya nke na-edobe asụsụ ozi nke Jọn, na-enweghị ịgbakwunye echiche nkọwa nke inye ọrụ.
- source_word: κόσμον
  choice: ụwa
  rationale: “Ụwa” bụ nsụgharị Igbo kwesịrị ekwesị nke κόσμος ma na-edobe nnukwu nghọta okwu a nwere n’Oziọma Jọn.
- source_word: Βλασφημεῖς
  choice: Ị na-ekwulu Chineke
  rationale: N’Igbo, “ikwulu Chineke” na-egosipụta ebubo nkwulu n’ụzọ mmadụ nkịtị ga-aghọta, ebe usoro “Ị na-” na-egosipụta ebubo a na-ekwu ugbu a.
- source_word: Υἱὸς τοῦ θεοῦ
  choice: Ọkpara Chineke
  rationale: “Ọkpara Chineke” bụ aha nsọpụrụ Kraịst a na-aghọta nke ọma n’Igbo ma na-edobe ike nke aha ahụ n’ọnọdụ esemokwu a.
- source_word: ὃν ὁ πατὴρ
  choice: onye ahụ Nna ahụ
  rationale: Usoro a na-edobe onye a na-ekwu banyere ya na ọrụ Nna ahụ n’ụzọ doro anya ma dịrị Igbo mfe.
- source_word: ὅτι ... ὅτι
  choice: unu na-ekwu ... sị ... n’ihi na m kwuru
  rationale: “Sị” na-ewebata kpọmkwem ihe ha na-ekwu, ebe “n’ihi na” na-egosipụta na okwu Jizọs kwuru bụ ihe ha ji bo ya ebubo.
theological_decisions:
- issue: Nsụgharị ἡγίασεν n’ihe gbasara Ọkpara ahụ
  choice: doro nsọ
  alternative: rara nye; kewapụrụ iche
  rationale: “Doro nsọ” na-edobe okwu na esemokwu nkà mmụta okpukpe dị na Grik. Ọ naghị ekwu na Ọkpara ahụ bụbu onye na-adịghị nsọ; ọnọdụ ahụ na-akwado nghọta nke ịrara ya nye ma ọ bụ ikewapụ ya maka ozi.
- issue: Ike Kraịst dị n’aha Υἱὸς τοῦ θεοῦ
  choice: Ọkpara Chineke
  alternative: Nwa Chineke
  rationale: “Ọkpara Chineke” na-arụ ọrụ dị ka aha nsọpụrụ pụrụ iche n’ọnọdụ ebubo nkwulu a, ma ọ naghị ebubata nkọwa ozizi ndị na-adịghị n’amaokwu ahụ.
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta. E jiri “unu” mee ka ọnụọgụ ọtụtụ nke ὑμεῖς pụta ìhè, ebe okwu e hotara jiri “Ị” n’ihi na ebubo ahụ na-ekwu banyere Jizọs n’onwe ya.
