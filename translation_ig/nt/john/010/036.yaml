    text: Ma ọ bụ “rara nye” ma ọ bụ “kewapụrụ iche” maka ἡγίασεν.
    reason: lexical_alternative
  revision_rationale: The revision corrects the verbal form for the Father's past act of sending and recasts the sentence as the explicit rhetorical question found in the Greek. It otherwise preserves the draft's sound lexical choices and its footnote anchor and content.
