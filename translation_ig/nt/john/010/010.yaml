  text: ὁ κλέπτης οὐκ ἔρχεται εἰ μὴ ἵνα κλέψῃ καὶ θύσῃ καὶ ἀπολέσῃ· ἐγὼ ἦλθον ἵνα ζωὴν ἔχωσιν καὶ περισσὸν ἔχωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/010.yaml
  text: The thief comes only to steal and slaughter and destroy[a]; I came so that they may have life[b], and have it abundantly.
translation:
  language: ig
  text: Onye ohi anaghị abịa ma e wezụga ka o zuo ohi, gbuo, ma bibie[a]; ma mụ onwe m bịara ka ha nwee ndụ, ma nwee ya n'ụba[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “gbutuo.” Okwu Grik a (θύσῃ) na-ezokarị aka n'igbu anụ, nke dabara n'onyonyo atụrụ dị n'akụkụ amaokwu a.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “nwee ndụ n'ụba” ma ọ bụ “nwee ya n'ụzọ zuru ezu.”
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ κλέπτης
  choice: Onye ohi
  rationale: N'Igbo, aha a na-enweghị okwu nrịba pụrụ ịrụ ọrụ dị ka onye a kapịrị ọnụ ma ọ bụ onye nnọchiteanya n'ozuzu ya. Nke a dabara n'onyonyo onye ohi dị n'okwu Jizọs banyere onye ọzụzụ atụrụ.
- source_word: οὐκ ἔρχεται εἰ μὴ
  choice: adịghị abịa ma ọ bụghị naanị
  rationale: Nke a na-egosipụta na ihe ndị na-esochi bụ naanị ebumnuche ọbịbịa onye ohi, ma na-asụkwa ya n'Igbo doro anya.
- source_word: ἵνα κλέψῃ
  choice: ka o zuru ohi
  rationale: A hapụrụ ya dị ka nkebiokwu na-egosi ebumnuche, dịka ἵνα si arụ ọrụ n'asụsụ Grik.
- source_word: θύσῃ
  choice: gbuchapụ
  rationale: θύω na-ezokarị aka n'igbu anụ; “gbuchapụ” na-eweta ịdị ike nke okwu ahụ ma dabara n'onyonyo atụrụ nke gbara amaokwu a gburugburu.
- source_word: ἀπολέσῃ
  choice: bibie
  rationale: “Bibie” na-egosi mbibi zuru ezu n'etinyeghị nkọwa ọzọ gbasara ụzọ e si bibie ma ọ bụ onye a na-ebibi.
- source_word: ἐγὼ ἦλθον
  choice: ma mụ onwe m bịara
  rationale: “Mụ onwe m” na-echekwa nkwusi ike dị na ἐγώ, ebe “bịara” na-egosipụta aorist ahụ n'ụzọ nkịtị ma na-emekwa ka ọdịiche dị n'etiti Jizọs na onye ohi pụta ìhè.
- source_word: ἵνα ζωὴν ἔχωσιν
  choice: ka ha nwee ndụ
  rationale: Nke a na-echekwa nkebiokwu ebumnuche na okwu Jọn bụ ζωὴ dị ka “ndụ,” n'agbasaghị ya ka ọ bụrụ “ndụ ebighị ebi,” nke na-adịghị kpọmkwem n'amaokwu a.
- source_word: περισσὸν ἔχωσιν
  choice: nweekwa ya n'ụba
  rationale: “Ya” na-ezo aka ná ndụ, “n'ụba” na-egosikwa oke na izu oke nke inwe ndụ ahụ n'etinyeghị echiche nke akụnụba ihe onwunwe.
theological_decisions:
- issue: Oke nghọta ζωὴ n'akwụkwọ Jọn
  choice: ndụ
  alternative: ndụ ebighị ebi; ezi ndụ
  rationale: Ebe amaokwu a na-ekwu naanị ζωὴ na-enweghị “ebighị ebi,” “ndụ” na-echekwa obosara na omimi okwu ahụ ma ghara ịtinye nkọwa ozizi karịrị ihe e dere.
- issue: Ike na ihe περισσὸν pụtara
  choice: n'ụba
  alternative: n'ụzọ zuru ezu; nke ukwuu
  rationale: “N'ụba” na-egosipụta ndụ bara ụba ma zuo oke nke Jizọs na-enye, ma ọ naghị eme ka okwu ahụ bụrụ nkwa akụnụba ma ọ bụ ngọzi ihe onwunwe.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta, dee ya. Ahịrịokwu ahụ na-echekwa usoro ọdịiche dị n'etiti ebumnuche onye ohi na ebumnuche Jizọs, tinyere nkwusi ike dị na “mụ onwe m.”
