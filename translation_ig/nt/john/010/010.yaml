revisions:
- from: Onye ohi adịghị abịa ma ọ bụghị naanị ka o zuru ohi, gbuchapụ, ma bibie[a]; ma mụ onwe m bịara ka ha nwee ndụ, nweekwa ya n'ụba[b].
  to: Onye ohi anaghị abịa ma e wezụga ka o zuo ohi, gbuo, ma bibie[a]; ma mụ onwe m bịara ka ha nwee ndụ, ma nwee ya n'ụba[b].
  rationale: The revision corrects the exclusive-purpose idiom and replaces an overly intensive verb with “gbuo,” which preserves the lexical range and sheep-context resonance of θύσῃ. It retains the source's contrast, Johannine “ndụ,” and the abundance qualified by περισσόν.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T06:23:51Z'
review_pass:
  verdict: revise
  source_fidelity: The threefold purpose sequence and the contrast with Jesus' purpose are retained. However, “gbuchapụ” commonly conveys killing off/wholesale extermination and is stronger than θύσῃ (“slaughter/kill”); “gbuo” is the closer, suitably broad rendering in this sheep-context. The construction “adịghị abịa ma ọ bụghị naanị ka” is not idiomatic Standard Igbo for οὐκ ἔρχεται εἰ μὴ.
  naturalness: The revised wording uses the natural negative habitual form “anaghị abịa” and the idiomatic exclusive construction “ma e wezụga ka.” “Ma nwee ya n'ụba” clearly coordinates the second purpose/result with having life.
  terminology: “Onye ohi,” “zuo ohi,” “ndụ,” and “n'ụba” are appropriate Standard Igbo terms. “N'ụba” conveys περισσόν without importing a material-prosperity interpretation. The explicit “mụ onwe m” appropriately reflects the contrastive force of ἐγώ without adding theological content.
  issues:
  - severity: medium
    issue: The phrase “adịghị abịa ma ọ bụghị naanị ka” is structurally awkward and not idiomatic in Standard Igbo.
    rationale: οὐκ ... εἰ μὴ expresses an exclusive purpose. “Anaghị abịa ma e wezụga ka ...” expresses this naturally and accurately.
  - severity: medium
    issue: “Gbuchapụ” overstates θύσῃ.
    rationale: “Gbuchapụ” normally suggests killing off or exterminating comprehensively. θύσῃ denotes slaughtering/killing, with animal-slaughter resonance in context, but does not itself require the distributive/completive sense.
  revised_text: Onye ohi anaghị abịa ma e wezụga ka o zuo ohi, gbuo, ma bibie[a]; ma mụ onwe m bịara ka ha nwee ndụ, ma nwee ya n'ụba[b].
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “gbutuo.” Okwu Grik a (θύσῃ) na-ezokarị aka n'igbu anụ, nke dabara n'onyonyo atụrụ dị n'akụkụ amaokwu a.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “nwee ndụ n'ụba” ma ọ bụ “nwee ya n'ụzọ zuru ezu.”
    reason: alternative_reading
  revision_rationale: The revision corrects the exclusive-purpose idiom and replaces an overly intensive verb with “gbuo,” which preserves the lexical range and sheep-context resonance of θύσῃ. It retains the source's contrast, Johannine “ndụ,” and the abundance qualified by περισσόν.
