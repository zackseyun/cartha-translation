source:
  edition: SBLGNT
  text: ἐγώ εἰμι ὁ ποιμὴν ὁ καλός, καὶ γινώσκω τὰ ἐμὰ καὶ ⸂γινώσκουσί με τὰ ἐμά⸃,
base_translation:
  language: en
  yaml_path: translation/nt/john/010/014.yaml
  text: I am the good shepherd[a], and I know my own, and my own know me,
translation:
  language: ig
  text: Abụ m ezigbo onye ọzụzụ atụrụ[a]; amakwa m ndị nke m, ndị nke m makwa m.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịtụgharị ya, “atụrụ m.” N'asụsụ Grik, okwu ahụ n'akụkụ abụọ ahụ bụ kpọmkwem “nke m.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγώ εἰμι
  choice: Abụ m
  rationale: Nke a bụ ụzọ Igbo dị nkenke ma bụrụkwa nke ebumpụta ụwa isi kwuo njirimara dị n'okwu Grik ahụ, ‘Mụ onwe m bụ.’
- source_word: ποιμήν
  choice: onye ọzụzụ atụrụ
  rationale: Nke a na-edobe ihe atụ nkịtị nke onye na-azụ atụrụ; ‘pasta’ ga-ebubata echiche banyere ọkwa n'ọgbakọ nke na-apụtaghị kpọmkwem n'okwu a.
- source_word: καλός
  choice: ezigbo
  rationale: ‘Ezigbo’ na-egosi ịdị mma, ịdị kwesị ekwesị, na àgwà ọma nke καλός na-ebu n'ebe a, ma bụrụkwa okwu Igbo ndị mmadụ na-aghọta ngwa ngwa.
- source_word: γινώσκω / γινώσκουσί
  choice: amakwa m / makwa m
  rationale: Ngwaa ‘ịma’ na-edobe nghọta nke ịmara mmadụ n'ụzọ mmekọrịta, ọ bụghị naanị ịmata onye ahụ mgbe a hụrụ ya.
- source_word: τὰ ἐμὰ / τὰ ἐμά
  choice: ndị nke m
  rationale: ‘Ndị nke m’ na-edobe echiche nke ndị bụ nke Jizọs ma ghara itinye ‘atụrụ’ kpọmkwem n'ahịrịokwu ebe Grik ji naanị njirimara nwe ihe.
- source_word: καί
  choice: -kwa / ma
  rationale: Ngwakọta ‘-kwa’ na ‘ma’ na-eme ka njikọ ahịrịokwu ahụ daa nke ọma n'Igbo ma na-edobe nhazi mmekọrịta dị n'etiti ịmara ndị nke ya na ha ịmara ya.
theological_decisions:
- issue: Otu e si gosipụta mmekọrịta imekọrịta ihe n'etiti Jizọs na ndị bụ nke ya n'etinyeghị nkọwa ozizi e mechara guzobe
  choice: ndị nke m
  alternative: atụrụ m; ndị bụ nke m
  rationale: Nhọrọ a na-edobe echiche nke ịbụ nke Jizọs na ịmarịta onwe ha, ma ghara ịkọwapụta karịa ihe okwu Grik kwuru kpọmkwem. Ihe gbara amaokwu ahụ gburugburu na-egosi na ndị a bụ atụrụ ya, ya mere e tinyere nke ahụ dị ka nhọrọ na nkọwa ala peeji.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. ‘Onye ọzụzụ atụrụ’ na-edobe ihe atụ ahụ n'ụzọ doro anya, ebe ‘ndị nke m’ na-echekwa nkenke na ntakịrị nghọta ghere oghe nke okwu Grik.
