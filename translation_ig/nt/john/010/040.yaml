  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Καὶ ἀπῆλθεν πάλιν πέραν τοῦ Ἰορδάνου εἰς τὸν τόπον ὅπου ἦν Ἰωάννης τὸ πρῶτον βαπτίζων, καὶ ἔμεινεν ἐκεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/040.yaml
  text: And he went away again across the Jordan to the place where John had first been baptizing[a], and he stayed there.
translation:
  language: ig
  text: Ọ pụkwara ọzọ gaa n’ofe Osimiri Jọdan, ruo ebe Jọn nọbu na-eme baptizim na mbụ, wee nọrọ ebe ahụ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπῆλθεν
  choice: Ọ hapụkwara ebe ahụ gaa
  rationale: Okwu a na-egosi na ọ siri n’ebe ọ nọ pụọ; ntụgharị a na-eme ka echiche ịhapụ ebe ahụ pụta ìhè n’Igbo nkịtị.
- source_word: πάλιν
  choice: ọzọ
  rationale: Nke a na-egosi na njem ahụ mere ọzọ.
- source_word: πέραν τοῦ Ἰορδάνου
  choice: n’ofe osimiri Jọdan
  rationale: πέραν na genitive na-egosi akụkụ nke ọzọ nke osimiri ahụ; ‘n’ofe osimiri Jọdan’ bụ okwu doro anya ma kwekọọ n’Igbo ugbu a.
- source_word: εἰς τὸν τόπον
  choice: ruo ebe
  rationale: εἰς na-egosi ebe njem ahụ na-aga; ‘ruo ebe’ na-egosipụta ebe ọ gara n'ụzọ dị mma n’Igbo.
- source_word: ὅπου ἦν Ἰωάννης
  choice: ebe Jọn nọ
  rationale: ἦν bụ imperfect nke ‘ịdị’; ‘nọ’ na-echekwa okwu isi mmalite n’enweghị ịgbakwunye nkọwa oge na-adịghị mkpa.
- source_word: τὸ πρῶτον
  choice: na mbụ
  rationale: Nke a na-egosi oge mbụ ma ọ bụ oge gara aga nke ọrụ Jọn n’ebe ahụ.
- source_word: βαπτίζων
  choice: na-eme baptizim
  rationale: Present participle na-egosi ọrụ Jọn nọ na-eme n’oge ahụ; usoro ‘na-eme’ na-echekwa akụkụ ọrụ na-aga n’ihu.
- source_word: ἔμεινεν
  choice: wee nọrọ
  rationale: Aorist nke μένω pụtara ịnọgide ma ọ bụ ịnọ; ‘nọrọ’ bụ okwu Igbo dị mfe ma kwekọọ n’ebe a.
- source_word: ἐκεῖ
  choice: n’ebe ahụ
  rationale: Nke a bụ ntụgharị locative doro anya nke ‘ebe ahụ.’
theological_decisions: []
translation_notes:
  register: Standard Igbo; asụsụ dị ugbu a, dị ugwu ma dị mfe nghọta. E tinyere ‘osimiri’ n’aha Jọdan iji mee ka ebe a na-ekwu maka ya doo onye na-agụ anya. Enweghị akara nkọwa ala peeji n’ihi na ọdịiche ‘across/beyond’ nke Bekee abụọ na-abanye nke ọma n’otu okwu Igbo ‘n’ofe.’
