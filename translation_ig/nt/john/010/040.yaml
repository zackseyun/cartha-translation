revisions:
- from: Ọ hapụkwara ebe ahụ gaa ọzọ n’ofe osimiri Jọdan, ruo ebe Jọn nọ na mbụ na-eme baptizim, wee nọrọ n’ebe ahụ.
  to: Ọ pụkwara ọzọ gaa n’ofe Osimiri Jọdan, ruo ebe Jọn nọbu na-eme baptizim na mbụ, wee nọrọ ebe ahụ.
  rationale: 'The revision removes the unsupported explicit departure point while retaining the sense of departure. It also improves the word order for John''s former ongoing baptizing activity. No footnote is needed: n’ofe adequately covers the contextual sense of πέραν τοῦ Ἰορδάνου in Standard Igbo.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T06:24:17Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the repeated departure, the destination across the Jordan, John's earlier baptizing activity, and Jesus' staying there. However, "ebe ahụ" after "hapụkwara" introduces an explicit departure point not stated in the Greek, and the placement of "na mbụ" is somewhat awkward for the temporal qualification of John's activity.
  naturalness: The sentence is generally clear Standard Igbo. Recasting the opening as "Ọ pụkwara ọzọ gaa" is more concise and avoids the added location; "nọbu na-eme baptizim na mbụ" naturally expresses the earlier, ongoing activity in this narrative context.
  terminology: '"Osimiri Jọdan," "baptizim," and "nọrọ" are appropriate, comprehensible Standard Igbo renderings. No theological terminology issue is present.'
  issues:
  - severity: low
    issue: Explicit departure location added
    rationale: '"Ọ hapụkwara ebe ahụ" supplies "that place/there" as the place left. ἀπῆλθεν means he departed/went away but does not itself name a departure location in this verse.'
  - severity: low
    issue: Temporal phrase placement
    rationale: In "ebe Jọn nọ na mbụ na-eme baptizim," "na mbụ" interrupts the progressive expression. Placing it after the activity gives a smoother and clearer Igbo expression of τὸ πρῶτον βαπτίζων.
  revised_text: Ọ pụkwara ọzọ gaa n’ofe Osimiri Jọdan, ruo ebe Jọn nọbu na-eme baptizim na mbụ, wee nọrọ ebe ahụ.
  revised_footnotes: []
