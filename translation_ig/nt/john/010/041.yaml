  text: καὶ πολλοὶ ἦλθον πρὸς αὐτὸν καὶ ἔλεγον ὅτι Ἰωάννης μὲν σημεῖον ἐποίησεν οὐδέν, πάντα δὲ ὅσα εἶπεν Ἰωάννης περὶ τούτου ἀληθῆ ἦν.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/041.yaml
  text: And many came to him and were saying, “John did no sign, but everything that John said about this man was true.”
translation:
  language: ig
  text: Ọtụtụ mmadụ bịakwutere ya, ha nọkwa na-ekwu, “Jọn emeghị ihe ịrịba ama ọ bụla[a], ma ihe niile Jọn kwuru banyere nwoke a[b] bụ eziokwu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “Jọn arụghị ihe ịrịba ama ọ bụla.”
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsị, “banyere ya.” N’asụsụ Grik, e dere “banyere onye a/nwoke a.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ
  choice: Ọtụtụ mmadụ
  rationale: Okwu nkọwa a na-arụ ọrụ dị ka aha n’asụsụ Grik; ịtinye “mmadụ” na-eme ka ọ doo anya ma na-ada nke ọma n’Igbo.
- source_word: ἦλθον πρὸς αὐτόν
  choice: bịakwutere ya
  rationale: Nke a na-egosi na ha bịara nso n’ebe ọ nọ; “bịakwutere ya” bụ okwu Igbo kwụ ọtọ ma dị ndụ.
- source_word: ἔλεγον
  choice: ha nọkwa na-ekwu
  rationale: Ụdị ngwaa na Grik na-egosi okwu na-aga n’ihu ma ọ bụ nke a na-ekwughachi; “nọ na-ekwu” na-echekwa echiche ahụ n’enweghị ịgbakwụnye ugboro ole.
- source_word: σημεῖον
  choice: ihe ịrịba ama
  rationale: N’Oziọma Jọn, okwu a na-ezo aka n’ọrụ pụrụ iche nke na-atụ aka n’ihe karịrị ọrụ ahụ n’onwe ya; “ihe ịrịba ama” na-echekwa nghọta ahụ karịa “ọrụ ebube.”
- source_word: ἐποίησεν οὐδέν
  choice: emeghị ihe ịrịba ama ọ bụla
  rationale: Nke a na-egosipụta n'ụzọ doro anya na Jọn emeghị ọbụna otu ihe ịrịba ama, ma na-anọgide nso n’usoro okwu Grik.
- source_word: πάντα δὲ ὅσα
  choice: ma ihe niile
  rationale: “Ihe niile” na-echekwa ike okwu ahụ nke gụnyere okwu Jọn niile banyere Jizọs.
- source_word: περὶ τούτου
  choice: banyere nwoke a
  rationale: τούτου bụ okwu ngosi na-ezo aka na Jizọs; “nwoke a” na-echekwa ike ngosi ahụ ma na-ada nke ọma n’okwu ndị mmadụ kwuru.
- source_word: ἀληθῆ ἦν
  choice: bụ eziokwu
  rationale: Nke a bụ ntụgharị kwụ ọtọ na nke e ji eme ihe n’Igbo maka ikwu na ihe niile e kwuru bụ eziokwu.
theological_decisions:
- issue: Ojiji σημεῖον pụrụ iche n’Oziọma Jọn
  choice: ihe ịrịba ama
  alternative: ọrụ ebube
  rationale: “Ihe ịrịba ama” na-echekwa isiokwu Jọn nke na ọrụ ahụ na-atụ aka n’eziokwu banyere Jizọs; “ọrụ ebube” nwere ike ilekwasị anya naanị n’ike dị ịtụnanya.
- issue: Onye περὶ τούτου na-ezo aka na ya
  choice: banyere nwoke a
  alternative: banyere ya
  rationale: A họọrọ “nwoke a” iji chekwaa okwu ngosi τούτου n’enweghị ịgbanwe onye ọ na-ezo aka na ya; ndetu ala peeji na-enye ụdị dị mfe “banyere ya.”
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. A họọrọ “ihe ịrịba ama” ka e wee chekwaa okwu isiokwu Jọn, ebe “ha nọkwa na-ekwu” na-egosipụta omume okwu na-aga n’ihu n’ụdị ngwaa Grik.
