revisions:
- from: Ya mere, ha gbalịrị ọzọ ijide ya, ma o si n'aka ha[a] pụọ.
  to: Ya mere, ha nọ na-achọ ijide ya ọzọ, ma o si n’aka ha[a] pụọ.
  rationale: Only the verb phrase for ἐζήτουν has been revised, from the simple completed past “ha gbalịrị” to the progressive “ha nọ na-achọ,” in order to preserve the Greek imperfect’s ongoing/attempted action. The literal-but-idiomatic rendering of Jesus’ departure from their hand is retained, as is the lexical-alternative footnote.
  reviewer_model: gpt-5.6-terra
