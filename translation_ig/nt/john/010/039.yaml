  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐζήτουν οὖν ⸂πάλιν αὐτὸν⸃ πιάσαι· καὶ ἐξῆλθεν ἐκ τῆς χειρὸς αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/039.yaml
  text: So they were seeking again to seize him[a], but he escaped from their hand.
translation:
  language: ig
  text: Ya mere, ha nọ na-achọ ijide ya ọzọ, ma o si n’aka ha[a] pụọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “o si na njide ha pụọ” ma ọ bụ “ọ gbanahụrụ ha.” N’ụzọ nkịtị, okwu Grik sịrị, “o si n’aka ha pụọ”; “aka” ebe a na-anọchi anya ike ma ọ bụ njide.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐζήτουν
  choice: ha gbalịrị
  rationale: Ọdịdị imperfect na-egosi mgbalị gara n’ihu ma ọ bụ nke a nwara ime n’oge gara aga. “Ha gbalịrị” na-ekwupụta nke a n’Igbo dị mfe ma kwekọọ n’ihe ndị a chọrọ ime n’ebe a.
- source_word: οὖν
  choice: Ya mere
  rationale: Ọ na-ejikọta ihe a mere na mkparịta ụka bu ya ụzọ, na-egosi ihe sochiri ya n’ihi okwu Jizọs kwuru.
- source_word: πάλιν
  choice: ọzọ
  rationale: Ọ na-egosi na nke a bụ mgbalị ọzọ, dịka ha nwara ime na mbụ.
- source_word: πιάσαι
  choice: ijide
  rationale: “Ijide” na-echekwa echiche nke iji aka ma ọ bụ ike jide mmadụ, n’etinyeghị kpọmkwem echiche iwu nke “ijide dịka onye uwe ojii.”
- source_word: ἐξῆλθεν
  choice: pụọ
  rationale: Okwu Grik pụtara n’ụzọ bụ isi “pụrụ” ma ọ bụ “gara n’èzí.” “Pụọ” na-echekwa okwu akụkọ ahụ n’agbanyeghị na ọnọdụ ya na-egosi na ọ gbanahụrụ ha.
- source_word: ἐκ τῆς χειρὸς αὐτῶν
  choice: si n'aka ha
  rationale: N’Igbo, “isi n’aka ha pụọ” bụ okwu ebumpụta ụwa nke na-echekwa ihe atụ Grik gbasara ịpụ n’ike, ọchịchị, ma ọ bụ njide mmadụ.
theological_decisions:
- issue: Ma a ga-ekwu kpọmkwem na Jizọs “gbapụrụ,” ka a ga-edebe okwu akụkọ Grik nke ịpụ n’aka ha
  choice: o si n'aka ha pụọ
  alternative: ọ gbanahụrụ ha; ọ gbapụrụ n'aka ha
  rationale: Grik ejighị ngwaa pụtara “ịgbapụ” kpọmkwem, kama ọ sịrị na ọ “pụrụ n’aka ha.” Nhọrọ a na-echekwa okwu ahụ na ihe ọ na-atụ aka na ya, na-agbakwụghị nkọwa ọzọ n’ime ederede.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke oge a, dị ùgwù ma dị mfe nghọta. E debere akpaalaokwu “si n’aka ha pụọ” n’ihi na ọ bụkwa okwu ebumpụta ụwa n’Igbo ma na-esochi ihe atụ dị n’asụsụ Grik.
