review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders πιάσαι as “ijide” and preserves the deliberately non-explicit wording of ἐξῆλθεν ἐκ τῆς χειρὸς αὐτῶν with “o si n’aka ha pụọ.” However, “ha gbalịrị” is a completed/simple past (“they tried”) and does not adequately represent the imperfect ἐζήτουν, which portrays an ongoing effort or attempt.
  naturalness: “O si n’aka ha pụọ” is idiomatic, clear Standard Igbo. “Ha nọ na-achọ ijide ya ọzọ” is a natural modern way to express the ongoing past action and locates “ọzọ” naturally with the repeated attempt.
  terminology: “Ijide” appropriately conveys hostile seizure without unnecessarily specifying a legal arrest. The retained hand/grasp idiom is suitable and the footnote explains it without imposing an interpretation.
  issues:
  - severity: medium
    issue: The rendering “ha gbalịrị” loses the imperfect aspect of ἐζήτουν.
    rationale: The Greek imperfect depicts them as being engaged in seeking/trying to seize him. Replacing it with a progressive construction better preserves the source wording’s aspect while remaining idiomatic Igbo.
  revised_text: Ya mere, ha nọ na-achọ ijide ya ọzọ, ma o si n’aka ha[a] pụọ.
  revised_footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “o si na njide ha pụọ” ma ọ bụ “ọ gbanahụrụ ha.” N’ụzọ nkịtị, okwu Grik sịrị, “o si n’aka ha pụọ”; “aka” ebe a na-anọchi anya ike ma ọ bụ njide.
    reason: lexical_alternative
  revision_rationale: Only the verb phrase for ἐζήτουν has been revised, from the simple completed past “ha gbalịrị” to the progressive “ha nọ na-achọ,” in order to preserve the Greek imperfect’s ongoing/attempted action. The literal-but-idiomatic rendering of Jesus’ departure from their hand is retained, as is the lexical-alternative footnote.
