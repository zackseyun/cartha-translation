id: JHN.10.1
reference: John 10:1
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἀμὴν ἀμὴν λέγω ὑμῖν, ὁ μὴ εἰσερχόμενος διὰ τῆς θύρας εἰς τὴν αὐλὴν τῶν προβάτων ἀλλὰ ἀναβαίνων ἀλλαχόθεν ἐκεῖνος κλέπτης ἐστὶν καὶ λῃστής·
base_translation:
  language: en
  yaml_path: translation/nt/john/010/001.yaml
  text: Truly[a], truly, I say to you, the one who does not enter through the door into the sheepfold[c][b], but climbs up from somewhere else—that man is a thief and a robber.
translation:
  language: ig
  text: 'N’ezie, n’ezie, ana m asị unu: onye na-adịghị esi n’ọnụ ụzọ[a] abanye n’ogige atụrụ[b], kama na-arịgo site n’ebe ọzọ, onye ahụ bụ onye ohi na onye na-apụnara mmadụ ihe[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “ọnụ ụzọ ámá.” Okwu Grik bụ θύρα nwere ike ịpụta ọnụ ụzọ ụlọ ma ọ bụ ọnụ ụzọ ámá, dịka ọnọdụ okwu si dị.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsị, “ebe a na-edebe atụrụ” ma ọ bụ “ogige e mechiri emechi nke atụrụ.” Okwu Grik bụ αὐλή na-ezo aka n’ogige ma ọ bụ ebe e mechiri emechi.
    reason: lexical_alternative
  - marker: c
    text: Grik na-ekewa “onye ohi” (κλέπτης), onye na-ezu ohi n’ime nzuzo, na “onye na-apụnara mmadụ ihe” (λῃστής), nke na-egosikarị ịpụnara mmadụ ihe n’ike.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀμὴν ἀμὴν
  choice: N’ezie, n’ezie
  rationale: Na-egosipụta nkwughachi ahụ siri ike na nke dị nsọ n’Igbo doro anya, kama ịhapụ ‘Amen’ n’enweghị ntụgharị.
- source_word: λέγω ὑμῖν
  choice: ana m asị unu
  rationale: Ọ bụ ụzọ Igbo dị ugbu a ma dị ùgwù isi chekwaa okwu Jizọs na-agwa ọtụtụ mmadụ kpọmkwem.
- source_word: ὁ μὴ εἰσερχόμενος
  choice: onye na-esighị ... abanye
  rationale: Na-echekwa onye otu a na-ekwu maka ya n’ụzọ izugbe ma na-ada nke ọma n’Igbo.
- source_word: διὰ τῆς θύρας
  choice: n’ọnụ ụzọ
  rationale: ‘Ọnụ ụzọ’ nwere ike ịpụta ụzọ mbata ma ọ bụ ọnụ ụzọ ámá n’ọnọdụ a, ma kwekọọ n’onyonyo ahụ.
- source_word: εἰς τὴν αὐλὴν τῶν προβάτων
  choice: banye n’ogige atụrụ
  rationale: ‘Ogige atụrụ’ na-egosi ebe e mechiri emechi a na-edebe atụrụ, n’Igbo nkịtị ma doo anya.
- source_word: ἀλλὰ ἀναβαίνων ἀλλαχόθεν
  choice: kama ọ na-arịgoro n’ebe ọzọ
  rationale: Na-echekwa ma echiche ịrịgo/ịgafe ihe mgbochi ma echiche isite n’ebe ọzọ.
- source_word: ἐκεῖνος
  choice: onye ahụ
  rationale: Na-egosipụta ike demonstrative ahụ n’enweghị ịgbakwunye nkọwa na-adịghị na Grik.
- source_word: κλέπτης
  choice: onye ohi
  rationale: Ọ bụ okwu Igbo a na-ejikarị maka onye na-ezu ihe.
- source_word: λῃστής
  choice: onye na-apụnara mmadụ ihe
  rationale: Na-ekewapụ ya na ‘onye ohi’ ma na-egosi izu ohi a na-eme n’ike ma ọ bụ n’ime ihe ike.
theological_decisions:
- issue: Ihe atụ nke θύρα na αὐλή
  choice: Tụgharịa ya n’ụzọ pụtara ìhè dịka ‘ọnụ ụzọ’ na ‘ogige atụrụ,’ n’enweghị ịkọwa ihe atụ ahụ karịa amaokwu a.
  alternative: Iji ‘ọnụ ụzọ ámá’ na ‘ebe a na-edebe atụrụ.’
  rationale: Amaokwu a na-amalite ihe atụ nke a ga-akọwa n’amaokwu ndị na-esote; ntụgharị ekwesịghị ibubata nkọwa gbasara onye ọnụ ụzọ ahụ ma ọ bụ ndị ohi ahụ nọchiri anya ha.
- issue: Ọdịiche dị n’etiti κλέπτης na λῃστής
  choice: Chekwaa okwu abụọ ahụ dịka ‘onye ohi’ na ‘onye na-apụnara mmadụ ihe.’
  alternative: Iji otu okwu ‘onye ohi’ maka ha abụọ.
  rationale: Grik ji okwu abụọ dị iche, nke nke abụọ na-atụkarị aka n’ịnapụ ihe n’ike; ọdịiche ahụ kwesịrị ịdị na ntụgharị.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E debere nkwughachi ‘N’ezie, n’ezie,’ onyonyo ebe atụrụ nọ, na ọdịiche okwu ohi abụọ ahụ. A haziri akara nkọwa ala peeji ka ha soro okwu nke ọ bụla ha na-akọwa ozugbo.
