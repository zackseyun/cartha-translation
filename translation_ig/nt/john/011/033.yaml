revisions:
- from: Ya mere, mgbe Jizọs hụrụ ya ka ọ na-akwa ákwá, hụkwa ndị Juu[a] ndị ha na ya bịara ka ha na-akwa ákwá, o nwere nnọọ mkpali siri ike n'ime mmụọ ya[b], meekwa ka obi ghara iru ya ala.
  to: Ya mere, mgbe Jizọs hụrụ ya ka ọ na-akwa ákwá, na ndị Juu[a] soro ya bịa ka ha na-akwa ákwá, mmụọ ya kpaliri ya nke ukwuu[b], ọ wee nwee ọgba aghara n'ime onwe ya.
  rationale: The revision corrects the referent of συνελθόντας αὐτῇ, replaces an unnatural nominal expression with an idiomatic verbal one for ἐνεβριμήσατο, and renders ἐτάραξεν ἑαυτόν as inner disturbance with explicit self-reference. It does not specify whether Jesus’ agitation was grief, indignation, or anger.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T06:24:53Z'
review_pass:
  verdict: revise
  source_fidelity: 'The draft conveys the temporal connective, the two groups'' weeping, and the strong but disputed emotional force of ἐνεβριμήσατο. However, “ndị ha na ya bịara” reverses the relationship: it says people who came with her together with unspecified “they,” rather than the Jews who came with Mary. “O nwere ... mkpali” is also less idiomatic and weakly represents the verbal action. The revision preserves the ambiguity of the Greek and expresses the reflexive disturbance without making it deliberate anger.'
  naturalness: 'The revised wording uses natural Standard Igbo constructions: “ndị Juu soro ya bịa,” “mmụọ ya kpaliri ya nke ukwuu,” and “nwee ọgba aghara n''ime onwe ya.”'
  terminology: “Ndị Juu” is retained, with a contextual note that it denotes the mourners with Mary rather than Jewish people universally. “Mmụọ” appropriately represents πνεῦμα. The note on the strong agitation retains “iwe were ya” only as an alternative and does not decide the disputed object or quality of Jesus’ emotion.
  issues:
  - severity: medium
    issue: The phrase “ndị ha na ya bịara” is grammatically and referentially inaccurate.
    rationale: The Greek τοὺς συνελθόντας αὐτῇ Ἰουδαίους identifies “the Jews who had come with her.” In Igbo, “ndị ha na ya bịara” introduces an unspecified plural subject (“they”) and does not clearly say that the Jews accompanied Mary.
  - severity: medium
    issue: “O nwere nnọọ mkpali siri ike” is not an idiomatic or sufficiently verbal rendering of ἐνεβριμήσατο.
    rationale: The Greek describes Jesus’ strong inner agitation. “Mmụọ ya kpaliri ya nke ukwuu” is more natural Igbo while retaining the emotional ambiguity; the footnote preserves the possible sense of indignation.
  - severity: low
    issue: The existing footnote a’s phrase “bịara soro Meri ruo újú” is awkward and adds an imprecise purpose nuance.
    rationale: The source says the Jews came with Mary; the immediate context identifies them as mourners, but the note can state this plainly without the awkward expression.
  revised_text: Ya mere, mgbe Jizọs hụrụ ya ka ọ na-akwa ákwá, na ndị Juu[a] soro ya bịa ka ha na-akwa ákwá, mmụọ ya kpaliri ya nke ukwuu[b], ọ wee nwee ọgba aghara n'ime onwe ya.
  revised_footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “ndị Judia.” N'ebe a, okwu ahụ na-ekwu maka ndị Juu soro Meri bịa, bụ ndị na-eru újú, ọ bụghị ndị Juu niile.
    reason: lexical_alternative
  - marker: b
    text: Okwu Grik a nwekwara ike ịpụta “iwe were ya” ma ọ bụ “ihe ahụ kpaliri ya nke ukwuu”; ọ na-egosi mkpali dị ike n'ime mmadụ.
    reason: alternative_reading
  revision_rationale: The revision corrects the referent of συνελθόντας αὐτῇ, replaces an unnatural nominal expression with an idiomatic verbal one for ἐνεβριμήσατο, and renders ἐτάραξεν ἑαυτόν as inner disturbance with explicit self-reference. It does not specify whether Jesus’ agitation was grief, indignation, or anger.
