id: JHN.11.33
reference: John 11:33
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἰησοῦς οὖν ὡς εἶδεν αὐτὴν κλαίουσαν καὶ τοὺς συνελθόντας αὐτῇ Ἰουδαίους κλαίοντας ἐνεβριμήσατο τῷ πνεύματι καὶ ἐτάραξεν ἑαυτόν,
base_translation:
  language: en
  yaml_path: translation/nt/john/011/033.yaml
  text: Therefore[a], when Jesus saw her weeping, and the Jews who had come with her weeping[b], he was deeply moved in his spirit and troubled himself.
translation:
  language: ig
  text: Ya mere, mgbe Jizọs hụrụ ya ka ọ na-akwa ákwá, na ndị Juu[a] soro ya bịa ka ha na-akwa ákwá, mmụọ ya kpaliri ya nke ukwuu[b], ọ wee nwee ọgba aghara n'ime onwe ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “ndị Judia.” N'ebe a, okwu ahụ na-ekwu maka ndị Juu soro Meri bịa, bụ ndị na-eru újú, ọ bụghị ndị Juu niile.
    reason: lexical_alternative
  - marker: b
    text: Okwu Grik a nwekwara ike ịpụta “iwe were ya” ma ọ bụ “ihe ahụ kpaliri ya nke ukwuu”; ọ na-egosi mkpali dị ike n'ime mmadụ.
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: Ya mere
  rationale: Na-egosi njikọ na ihe si n'ọnọdụ e kwuru tupu ya pụta, ma na-ada nke ọma n'Igbo.
- source_word: ὡς εἶδεν
  choice: mgbe ... hụrụ
  rationale: ὡς na aorist ebe a na-egosi oge; okwu a na-edobe usoro ihe mere n'ụzọ Igbo nkịtị.
- source_word: κλαίουσαν / κλαίοντας
  choice: na-akwa ákwá
  rationale: Na-egosi ịkwa ákwá a na-anụ, ma ọ naghị amanye nghọta na ọ bụ iru újú n'emume kpọmkwem.
- source_word: συνελθόντας αὐτῇ
  choice: ndị ha na ya bịara
  rationale: Na-egosi ndị bịakọrọ Meri ma soro ya bịa, n'asụsụ Igbo doro anya.
- source_word: Ἰουδαίους
  choice: ndị Juu
  rationale: Ọ bụ ntụgharị kpọmkwem nke okwu ahụ; ihe odide gbara ya gburugburu na-egosi na ọ bụ ndị Juu bịara ịkasi Meri obi, ọ bụghị ndị Juu niile.
- source_word: ἐνεβριμήσατο
  choice: o nwere nnọọ mkpali siri ike
  rationale: Na-echekwa ịdị ike nke mmetụta ahụ n'ebughị ụzọ kpebie ma ọ bụ iwe, ọnụma, ma ọ bụ mwute.
- source_word: τῷ πνεύματι
  choice: n'ime mmụọ ya
  rationale: Na-egosi ebe mkpali ahụ dị n'ime ya, ma na-edobe echiche nke πνεῦμα.
- source_word: ἐτάραξεν ἑαυτόν
  choice: meekwa ka obi ghara iru ya ala
  rationale: Na-anọchi reflexive Greek n'ụzọ Igbo a na-aghọta, na-egosi na ọ kpaliri onwe ya ma ọ bụ kwere ka ọgba aghara ahụ metụta ya, kama ime ya naanị ka ihe mere ya n'amaghị ama.
theological_decisions:
- issue: Ụdị mmetụta Jizọs nke ἐνεβριμήσατο na-egosi
  choice: A sụgharịrị ya ka ọ bụrụ mkpali siri ike n'ekpebighị kpọmkwem ma ọ bụ iwe, ọnụma, ma ọ bụ mwute.
  alternative: “iwe were ya,” “ọnụma jidere ya,” ma ọ bụ “ihe ahụ kpaliri ya nke ukwuu.”
  rationale: Okwu Grik ahụ nwere ike ịpụta mkpali dị ike nke nwere ọnụma ma ọ bụ iwe n'ime ya, ma amaokwu ahụ ekwughị kpọmkwem ihe mkpali ahụ bụ ma ọ bụ onye/ihe ọ gbadoro ụkwụ na ya. Ya mere, e chekwara esemokwu nkọwa ahụ.
- issue: Reflexive force nke ἐτάραξεν ἑαυτόν
  choice: “meekwa ka obi ghara iru ya ala”
  alternative: “obi adịghị ya mma” ma ọ bụ “obi gbawara ya.”
  rationale: Nhọrọ a na-anwa idebe ἑαυτόν, nke na-egosi na ihe ahụ abụghị naanị ọnọdụ mmetụta rutere ya n'enweghị ọrụ nke ya; ọ bụ ya mere ma ọ bụ kpalie onwe ya.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke ugwu ma dị mfe nghọta. E ji “mkpali siri ike” chekwaa ike na mgbagwoju anya nke ἐνεβριμήσατο, ebe “meekwa ka obi ghara iru ya ala” na-anwa igosipụta reflexive ἑαυτόν n'Igbo eke.
