  text: ἐδάκρυσεν ὁ Ἰησοῦς.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/035.yaml
  text: Jesus wept[a].
translation:
  language: ig
  text: Jizọs bere ákwá.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Anya mmiri gbara Jizọs.” Ngwaa Grik a na-ekwu kpọmkwem banyere ịwụ anya mmiri; ọ dị iche n’okwu e ji akọwa ịkwa ákwá n’olu dara ụda n’ebe ndị ọzọ n’akụkọ a.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδάκρυσεν
  choice: bere ákwá
  rationale: Ngwaa Grik a pụtara na anya mmiri gbara mmadụ ma ọ bụ na ọ bere ákwá. “Bere ákwá” bụ okwu Igbo nkịtị, dị nkenke, nke na-egosi mwute Jizọs n’etinyeghị echiche na ọ malitere ibe ákwá ma ọ bụ na ọ kwara ákwá n’olu dara ụda.
- source_word: ὁ Ἰησοῦς
  choice: Jizọs
  rationale: Nke a bụ aha onye bụ isiokwu ahịrịokwu ahụ. “Jizọs” bụ nsụgharị aha ahụ a na-ejikarị eme ihe n’Igbo Standard.
theological_decisions:
- issue: Ngosipụta mmetụta Jizọs
  choice: Jizọs bere ákwá.
  alternative: Anya mmiri gbara Jizọs.
  rationale: A họọrọ okwu dị mfe nke na-egosi mmetụta mmadụ Jizọs n’ezie, ma a naghị eme ka ákwá ahụ sie ike karịa ka ngwaa Grik si kwuo. Nhọrọ ọzọ na-egosikwa ịwụ anya mmiri nke ọma.
translation_notes:
  register: Igbo Standard nke oge a, dị mfe ma nwee ugwu. E debere ahịrịokwu ahụ nkenke dịka isi mmalite Grik si dị; akara ụda dị na “ákwá” na-enyere aka ịmata na ọ bụ ibe ákwá.
