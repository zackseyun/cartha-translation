review_pass:
  verdict: revise
  source_fidelity: The narrative sequence, Mary’s falling at Jesus’ feet, and the contrary-to-fact past result are conveyed accurately. However, “Onyenwe anyị” contains the first-person plural possessive “anyị” (“our”), which is not present in the Greek vocative Κύριε. The alternative footnote “Nna anyị ukwu” likewise adds “our” and shifts the address away from the stated respectful-address alternative.
  naturalness: The verse is generally fluent Standard Igbo. “Ya mere,” “mgbe … bịarutere,” “ọ dara n’ụkwụ ya,” and “agaraghị anwụ” read naturally. “Onyenwe” is a natural respectful vocative and avoids adding a possessive pronoun.
  terminology: Use “Onyenwe” for Κύριε in the text. The footnote may give “Nna ukwu” as a respectful form of address (“Sir”), without importing a plural possessive or an unsupported theological claim.
  issues:
  - severity: medium
    issue: “Onyenwe anyị” adds the possessive “anyị” (“our”).
    rationale: Κύριε is a singular vocative with no possessive pronoun. The added “anyị” changes the address from “Lord/Sir” to “our Lord.”
  - severity: medium
    issue: The footnote alternative “Nna anyị ukwu” is not an accurate equivalent of the Greek’s possible respectful address.
    rationale: It adds “anyị” (“our”) and means approximately “our great/master father,” whereas the relevant alternative is a respectful “Sir,” naturally represented here by “Nna ukwu.”
  revised_text: Ya mere, mgbe Meri bịarutere ebe Jizọs nọ ma hụ ya, ọ dara n’ụkwụ ya, sị ya, “Onyenwe,[a] a sị na ị nọ ebe a, nwanne m nwoke agaraghị anwụ.”
  revised_footnotes:
