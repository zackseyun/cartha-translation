  to: Ya mere, mgbe Meri bịarutere ebe Jizọs nọ ma hụ ya, ọ dara n’ụkwụ ya, sị ya, “Onyenwe,[a] a sị na ị nọ ebe a, nwanne m nwoke agaraghị anwụ.”
