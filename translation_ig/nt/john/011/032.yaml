id: JHN.11.32
reference: John 11:32
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἡ οὖν ⸀Μαριὰμ ὡς ἦλθεν ὅπου ⸀ἦν Ἰησοῦς ἰδοῦσα αὐτὸν ἔπεσεν αὐτοῦ ⸀πρὸς τοὺς πόδας, λέγουσα αὐτῷ· Κύριε, εἰ ἦς ὧδε οὐκ ἄν ⸂μου ἀπέθανεν⸃ ὁ ἀδελφός.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/032.yaml
  text: So when Mary came where Jesus was and saw him[a], she fell at his feet, saying to him, “Lord, if you had been here, my brother would not have died.”
translation:
  language: ig
  text: Ya mere, mgbe Meri bịarutere ebe Jizọs nọ ma hụ ya, ọ dara n’ụkwụ ya, sị ya, “Onyenwe,[a] a sị na ị nọ ebe a, nwanne m nwoke agaraghị anwụ.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Nna ukwu.” Okwu Grik κύριε nwere ike ịbụ ụzọ nkwanye ùgwù e si akpọ mmadụ; ebe a, a sụgharịrị ya “Onyenwe” n’ihi otú Oziọma Jọn si egosi Jizọs.
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: Ya mere
  rationale: Ọ na-ejikọta ihe a na akụkọ gara aga ma na-egosi ihe sochiri ya; ‘Ya mere’ bụ ụzọ Igbo doro anya si egosipụta njikọ ahụ.
- source_word: ὡς ἦλθεν
  choice: mgbe ... bịarutere
  rationale: ὡς na nke a na-egosi oge ihe mere; ‘mgbe ... bịarutere’ bụ Igbo ebumpụta ụwa maka usoro a.
- source_word: ὅπου ἦν Ἰησοῦς
  choice: ebe Jizọs nọ
  rationale: Nke a na-edobe nkọwa ebe ahụ n'ụzọ dị mkpirikpi ma kwekọọ kpọmkwem n’echiche Grik.
- source_word: ἰδοῦσα αὐτόν
  choice: ma hụ ya
  rationale: Participle ahụ na-akọ ihe mere n’otu usoro ahụ; iji ‘ma’ jikọta ya na ngwaa zuru ezu na-eme ka Igbo maa mma.
- source_word: ἔπεσεν αὐτοῦ πρὸς τοὺς πόδας
  choice: ọ dara n’ụkwụ ya
  rationale: Nke a bụ okwu Igbo a na-ejikarị akọ mmadụ ịda ma ọ bụ ịkpọ isiala n’ụkwụ onye ọzọ, n’enweghị ịmanye otu ihe kpatara ya.
- source_word: λέγουσα αὐτῷ
  choice: sị ya
  rationale: ‘Sị ya’ bụ ụzọ Igbo dị nkenke ma dị ndụ isi webata okwu Meri gwara Jizọs.
- source_word: Κύριε
  choice: Onyenwe anyị
  rationale: Ọ na-edobe ịdị arọ nke κύριε dị ka aha nsọpụrụ e ji kpọọ Jizọs, ma e tinyere ihe odide ala peeji iji chekwaa ohere na ọ pụkwara ịbụ okwu nkwanye ùgwù.
- source_word: εἰ ἦς ὧδε
  choice: a sị na ị nọ ebe a
  rationale: Usoro ‘a sị na’ na-egosipụta ọnọdụ gara aga nke na-emeghị eme n’Igbo n'ụzọ ebumpụta ụwa.
- source_word: οὐκ ἄν ... ἀπέθανεν
  choice: agaraghị anwụ
  rationale: Ụdị ngwaa a na-egosipụta nsonaazụ gara aga nke agaraghị eme ma ọ bụrụ na ọnọdụ ahụ mezuru.
- source_word: μου ὁ ἀδελφός
  choice: nwanne m nwoke
  rationale: Ọ na-egosipụta njikọ onye nwe ya n'ụzọ Igbo doro anya ma kọwaa na onye ahụ bụ nwoke.
theological_decisions:
- issue: Nsụgharị κύριε mgbe Meri na-akpọ Jizọs
  choice: Onyenwe anyị
  alternative: Nna anyị ukwu
  rationale: ‘Onyenwe anyị’ na-echekwa ma nsọpụrụ okwu ahụ nwere ma ịdị arọ ya n’akụkọ Jọn; ihe odide ala peeji na-egbochi nsụgharị ahụ ịkagbu ohere na ọ bụkwa okwu nkwanye ùgwù.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ usoro okwu ebumpụta ụwa, ma e chekwara njikọ akụkọ, ọnọdụ na-emeghị eme, na nghọta abụọ nwere ike ịdị na κύριε.
