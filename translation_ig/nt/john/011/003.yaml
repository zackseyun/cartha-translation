id: JHN.11.3
reference: John 11:3
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀπέστειλαν οὖν αἱ ἀδελφαὶ πρὸς αὐτὸν λέγουσαι· Κύριε, ἴδε ὃν φιλεῖς ἀσθενεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/003.yaml
  text: So the sisters sent word to him, saying, “Lord, look, the one you love is sick.”
translation:
  language: ig
  text: Ya mere, ụmụnne nwanyị ahụ zigara ya ozi, sị, “Onyenwe anyị, lee, onye ahụ ị hụrụ n’anya na-arịa ọrịa.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπέστειλαν ... πρὸς αὐτόν
  choice: zigara ya ozi
  rationale: Nke a na-egosipụta na ha zigaara Jizọs ozi, ọ bụghị na ha n’onwe ha gara; ọ bụkwa Igbo doro anya ma kwekọọ n’usoro okwu Grik.
- source_word: αἱ ἀδελφαί
  choice: ụmụnne nwanyị ahụ
  rationale: Ọ na-akọwa Meri na Mata dị ka ụmụnne nwanyị n’ụzọ doro anya nye onye na-agụ Igbo.
- source_word: Κύριε
  choice: Onyenwe anyị
  rationale: Ọ bụ okwu nkwanye ùgwù a na-eji akpọ onye bụ κύριος; a hapụrụ ịdị omimi nke aha a n’akụkọ Jọn n’enweghị ịgbakwunye nkọwa ozizi.
- source_word: ἴδε
  choice: lee
  rationale: Ọ na-echekwa ike nke okwu ịkpọ uche ‘lee’ n’ebe a, ọ bụ ezie na Jizọs anọghị n’ebe onye ọrịa ahụ nọ.
- source_word: ὃν φιλεῖς
  choice: onye ahụ ị hụrụ n’anya
  rationale: Ọ na-enye echiche ịhụnanya nke φιλέω n’Igbo nkịtị n’enweghị ịmanye ọdịiche pụrụ iche n’etiti φιλέω na ἀγαπάω.
- source_word: ἀσθενεῖ
  choice: na-arịa ọrịa
  rationale: N’ọnọdụ a, okwu ahụ pụtara na onye ahụ na-arịa ọrịa, ọ bụghị naanị na ọ na-adịghị ike.
theological_decisions:
- issue: Ihe aha Κύριε pụtara n’ọnọdụ a
  choice: Onyenwe anyị
  alternative: Nna anyị ukwu
  rationale: A họọrọ okwu nke na-edobe ma nkwanye ùgwù e ji akpọ Jizọs ma ohere nke nghọta miri emi nke aha ahụ n’Oziọma Jọn; a naghị ekpebi n’amaokwu a naanị ma ụmụnne nwanyị ahụ ji ya kwupụta ozizi zuru ezu banyere onye Jizọs bụ.
translation_notes:
  register: Asụsụ Igbo Izugbe dị ugbu a, dị mfe ma dị ùgwù. E jighị okwu ụka pụrụ iche nke otu denominashọn; ahịrịokwu ahụ na-agụ nke ọma n’olu.
