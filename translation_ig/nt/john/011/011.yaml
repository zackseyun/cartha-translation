  text: ταῦτα εἶπεν, καὶ μετὰ τοῦτο λέγει αὐτοῖς· Λάζαρος ὁ φίλος ἡμῶν κεκοίμηται, ἀλλὰ πορεύομαι ἵνα ἐξυπνίσω αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/011.yaml
  text: After saying these things[a], he said to them, “Lazarus our friend has fallen asleep, but I am going so that I may wake him up.”
translation:
  language: ig
  text: Mgbe o kwusịrị ihe ndị a, ọ gwara ha, “Lazarọs, enyi anyị, arahụla ụra[a], ma ana m aga ịkpọte ya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ya bụ, ọ nwụọla. Jizọs ji ụra mee ihe atụ maka ọnwụ ebe a; ndị na-eso ụzọ ya aghọtaghị ya na mbụ n’amaokwu ndị na-esote.
    reason: alternative_reading
lexical_decisions:
- source_word: ταῦτα εἶπεν, καὶ μετὰ τοῦτο
  choice: Mgbe o kwusịrị ihe ndị a
  rationale: Nke a na-egosi na okwu ndị ahụ eburu ụzọ kwụsị tupu okwu ọhụrụ a amalite, ma na-echekwa ụdị ọtụtụ nke ταῦτα n'Igbo dị mfe.
- source_word: λέγει αὐτοῖς
  choice: ọ gwara ha
  rationale: Ọ bụ ezie na Grik ji historical present, oge gara aga bụ ụzọ nkịtị e si akọ akụkọ n'Igbo; “gwara” dabara adaba karịa “sịrị” ebe a.
- source_word: Λάζαρος
  choice: Lazarọs
  rationale: A sụgharịrị aha ahụ n'ụdị mkpụrụokwu a na-ejikarị ede ya n'Igbo.
- source_word: ὁ φίλος ἡμῶν
  choice: Enyi anyị
  rationale: Nke a bụ ụzọ doro anya ma bụrụkwa nke e ji asụ Igbo ugbu a, na-echekwa mmekọrịta ahụ Greek kwuru.
- source_word: κεκοίμηται
  choice: arahụla ụra
  rationale: Ụdị a na-echekwa ihe atụ nke ihi ụra maka ọnwụ, tinyekwara echiche perfect na ọnọdụ ahụ amalitela ma ka dị ugbu a.
- source_word: ἀλλὰ πορεύομαι
  choice: ma ana m aga
  rationale: “Ma” na-egosi ọdịiche ahụ, “ana m aga” na-echekwakwa omume dị ugbu a nke nwere ebumnuche.
- source_word: ἵνα ἐξυπνίσω αὐτόν
  choice: ịkpọte ya
  rationale: Infinitive ebumnuche bụ ụzọ Igbo sitere n'okike isi gosipụta nzube ἵνα na subjunctive; ọ na-echekwakwa ihe atụ banyere ụra.
theological_decisions:
- issue: Ma a ga-akọwa κεκοίμηται ozugbo dị ka ọnwụ, ka a ga-echekwa ihe atụ nke ụra
  choice: 'E chekwara ihe atụ ahụ: “arahụla ụra”'
  alternative: “anwụọla”
  rationale: Jizọs ji ụra mee ihe atụ maka ọnwụ, ndị na-eso ụzọ ya aghọtahiekwa okwu ahụ n'amaokwu ndị na-esote. Ịsị “anwụọla” ebe a ga-ewepụ mgbagwoju anya na esemokwu akụkọ ahụ kpachapụrụ anya debe.
translation_notes:
  register: Standard Igbo nke oge a, dị mfe ma dị ugwu. E ji “Mgbe o kwusịrị ihe ndị a” zere ntụgharị siri ike nke usoro Grik, ebe “arahụla ụra” na “ịkpọte ya” na-echekwa otu ihe atụ ahụ n'akụkụ abụọ nke ahịrịokwu ahụ.
