  source_fidelity: 'Ihe odide ahụ na-echekwa usoro na isi okwu Grik nke ọma: ταῦτα ka e mere ọtụtụ (“ihe ndị a”), κεκοίμηται ka e debere n’ihe atụ ụra (“arahụla ụra”), ma nzube ἵνα ἐξυπνίσω αὐτόν ka e gosiri nke ọma site n’“ịkpọte ya.” Otú ọ dị, itinye akara nkọwa n’ebe ihe atụ ụra dị ga-eme ka o soro ụzọ nyocha POB Bekee ma nyere onye na-agụ ya aka n’ebughị ụzọ wepụ ihe mgbagwoju anya n’ederede.'
