id: JHN.11.9
reference: John 11:9
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς· Οὐχὶ δώδεκα ⸂ὧραί εἰσιν⸃ τῆς ἡμέρας; ἐάν τις περιπατῇ ἐν τῇ ἡμέρᾳ, οὐ προσκόπτει, ὅτι τὸ φῶς τοῦ κόσμου τούτου βλέπει·
base_translation:
  language: en
  yaml_path: translation/nt/john/011/009.yaml
  text: Jesus answered[a], “Are there not twelve hours in the day? If anyone walks in the day, he does not stumble[c][b], because he sees the light of this world.”
translation:
  language: ig
  text: Jizọs zara, “Ehihie ò nweghị awa iri na abụọ?[a] Ọ bụrụ na onye ọ bụla na-eje ije n’ehihie, ọ naghị asụ ngọngọ,[b] n’ihi na ọ na-ahụ ìhè nke ụwa a.[c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “awa iri na abụọ nke ehihie.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ọ naghị akpọ ụkwụ n’ihe.” Grik ji “onye ọ bụla … ọ” n’ọnụọgụ otu mee ihe maka onye nọchiri anya mmadụ n’ozuzu.
    reason: lexical_alternative
  - marker: c
    text: Okwu ahụ bụ “ìhè nke ụwa a.” N’Oziọma Jọn, “ìhè” nwekwara ike ime ka a cheta ìhè ime mmụọ sitere n’aka Chineke, ma a kọwaghị ya otú ahụ kpọmkwem n’ahịrị amaokwu a.
    reason: cross_reference
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: zara
  rationale: Ọ bụ okwu Igbo a na-ejikarị akọ na mmadụ nyere nzaghachi; ọ naghị etinye echiche ọzọ na-adịghị na Grik.
- source_word: Οὐχὶ
  choice: ò nweghị
  rationale: Ụdị ajụjụ a na-atụ anya azịza nkwenye, ya bụ na ehihie nwere awa iri na abụọ.
- source_word: δώδεκα ὧραί εἰσιν τῆς ἡμέρας
  choice: Ehihie ò nweghị awa iri na abụọ?
  rationale: “Ehihie” na-egosi oge ìhè nke ụbọchị, ọ bụghị ụbọchị awa iri abụọ na anọ; usoro ajụjụ ahụ bụkwa Igbo dị ndụ ma na-edobe ike ajụjụ Grik.
- source_word: ἐάν τις περιπατῇ
  choice: Ọ bụrụ na onye ọ bụla na-eje ije
  rationale: “Onye ọ bụla” na-egosipụta onye a na-ekwughị kpọmkwem, ebe “na-eje ije” na-edobe ihe atụ nkịtị nke ịga ije.
- source_word: ἐν τῇ ἡμέρᾳ
  choice: n’ehihie
  rationale: Nke a na-ezo aka n’oge ìhè n’ụbọchị ma na-edobe njikọ ya na nkebi mbụ.
- source_word: προσκόπτει
  choice: ọ naghị asụ ngọngọ
  rationale: “Ịsụ ngọngọ” na-edobe ma ihe ọ pụtara n’ezie banyere ịga ije ma ohere o nwere ibu ihe atụ.
- source_word: τὸ φῶς
  choice: ìhè
  rationale: Nke a bụ ihe okwu Grik pụtara kpọmkwem ma ọ naghị akọwapụta n’ime amaokwu ahụ onye ma ọ bụ ihe ìhè ahụ nọchiri anya ya.
- source_word: τοῦ κόσμου τούτου
  choice: nke ụwa a
  rationale: Ọ na-edobe ma njikọ genitiv ahụ ma ike okwu ngosi “a.”
- source_word: βλέπει
  choice: ọ na-ahụ
  rationale: Ọ na-asụgharị ngwaa ugbu a kpọmkwem n’etinyeghị echiche mgbakwunye dịka “ọ pụrụ ịhụ.”
theological_decisions:
- issue: Ike “ìhè” nwere dị ka ihe nnọchianya n’Oziọma Jọn
  choice: Edobere okwu nkịtị ahụ, “ìhè nke ụwa a,” n’ahịrị amaokwu ahụ n’akọwaghị ya dịka Jizọs ma ọ bụ nduzi Chineke.
  alternative: Ịsụgharị ya n’ụzọ ga-akọwa ìhè ahụ kpọmkwem dịka Jizọs ma ọ bụ ìhè sitere n’aka Chineke.
  rationale: N’agbanyeghị na “ìhè” nwere nghọta ime mmụọ sara mbara n’Oziọma Jọn, okwu amaokwu a nwekwara nghọta nkịtị zuru oke. Nsụgharị ahụ na-ahapụ nghọta abụọ ahụ ka ha dị.
- issue: Onye a na-anọchi anya mmadụ niile n’ụdị otu onye
  choice: E ji “onye ọ bụla … ọ” mee ihe.
  alternative: Ịgbanwe ya gaa n’ụdị ọtụtụ mmadụ.
  rationale: Grik ji onye a na-ekwughị kpọmkwem n’ọnụọgụ otu. Igbo na-edobe ọnụọgụ otu site na “onye ọ bụla … ọ,” ọ bụ ezie na nnọchiaha Igbo “ọ” anaghị egosi nwoke ma ọ bụ nwanyị.
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji “ehihie” zere echiche na “ụbọchị” ebe a bụ awa iri abụọ na anọ. E debere usoro ajụjụ a na-atụ anya nkwenye, ihe atụ nke ịga ije na ịsụ ngọngọ, nakwa nghọta sara mbara nke “ìhè” n’enweghị ịmanye otu nkọwa okpukpe.
