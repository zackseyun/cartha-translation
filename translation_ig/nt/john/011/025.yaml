  source_fidelity: 'The principal translation faithfully renders the Greek: Jesus addresses a woman, makes the direct identification as resurrection and life, and promises life to the person believing in him despite death. “Mụ onwe m” appropriately conveys the emphasis of Ἐγώ without adding a doctrinal interpretation.'
  naturalness: The verse is clear and idiomatic Standard Igbo. “Mbilite n’ọnwụ” and “ga-adị ndụ” are established, readily understood expressions in this register.
  terminology: 'Key terms are well chosen: “mbilite n’ọnwụ” for ἀνάστασις, “ndụ” for ζωή, and “na-ekwere na m” for πιστεύων εἰς ἐμέ. The footnote, however, imprecisely calls the whole expression masculine, although the relevant masculine form is specifically the substantival participle ὁ πιστεύων; Igbo itself does not mark this gender distinction.'
  issues:
