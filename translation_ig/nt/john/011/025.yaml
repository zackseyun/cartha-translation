id: JHN.11.25
reference: John 11:25
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἶπεν αὐτῇ ὁ Ἰησοῦς· Ἐγώ εἰμι ἡ ἀνάστασις καὶ ἡ ζωή· ὁ πιστεύων εἰς ἐμὲ κἂν ἀποθάνῃ ζήσεται,
base_translation:
  language: en
  yaml_path: translation/nt/john/011/025.yaml
  text: Jesus said to her[a], “I am the resurrection and the life. The one who believes in me, even if he dies, will live,”
translation:
  language: ig
  text: Jizọs sịrị ya, “Mụ onwe m bụ mbilite n’ọnwụ na ndụ. Onye na-ekwere[a] na m, ọ bụrụgodị na ọ nwụọ, ga-adị ndụ.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’asụsụ Grik, okwu a sụgharịrị “Onye na-ekwere” dị n’otu onye n’ụdị nwoke, ma e ji ya anọchi anya mmadụ n’ozuzu ya. N’Igbo, “onye” na “ọ” gụnyere nwoke na nwanyị.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν αὐτῇ
  choice: sịrị ya
  rationale: Nke a bụ ụzọ Igbo dị mfe ma bụrụkwa nke e ji akọ akụkọ iji gosi na Jizọs gwara Mata okwu; “ya” na-ezo aka n’ebe nwanyị nọ, dịka αὐτῇ si dị n’ebe a.
- source_word: Ἐγώ εἰμι
  choice: Mụ onwe m bụ
  rationale: “Mụ onwe m” na-echekwa nkwusi ike dị na nnọchiaha Ἐγώ, ebe “bụ” na-enye njirimara ahụ kpọmkwem n’Igbo.
- source_word: ἡ ἀνάστασις
  choice: mbilite n’ọnwụ
  rationale: N’ebe a, ἀνάστασις pụtara mbilite ndị nwụrụ anwụ, ọ bụghị naanị ibili ọtọ. Asụsụ Igbo anaghị achọ mkpụrụokwu pụrụ iche ga-anọchi isiokwu Grik ahụ.
- source_word: ἡ ζωή
  choice: ndụ
  rationale: “Ndụ” bụ okwu Igbo kpọmkwem maka ζωή. A hapụghị nkwupụta ahụ ka ọ bụrụ naanị na Jizọs “na-enye ndụ”; e chekwara njirimara kpọmkwem dị n’isi mmalite.
- source_word: ὁ πιστεύων
  choice: Onye na-ekwere
  rationale: Ụdị “onye na-” na-egosi otu onye a na-akọwa site n’ikwere, ma na-echekwakwa ọdịdị omume na-aga n’ihu nke participle ahụ n’ụzọ Igbo na-ada nke ọma.
- source_word: εἰς ἐμέ
  choice: na m
  rationale: Mgbe e jikọtara ya na “ikwere,” “na m” bụ ụzọ Igbo a na-eji ekwu ntụkwasị obi e tinyere n’ime mmadụ, na-enweghị ịsụgharị εἰς n’ụzọ ga-ada ka okwu mba ọzọ.
- source_word: κἂν ἀποθάνῃ
  choice: ọ bụrụgodị na ọ nwụọ
  rationale: “Ọ bụrụgodị” na-egosipụta ọnọdụ nkwenye dị na κἄν, ebe “nwụọ” na-enye ihe omume ahụ n’ụzọ dabara n’ọnọdụ a.
- source_word: ζήσεται
  choice: ga-adị ndụ
  rationale: Nke a na-echekwa nkwa ọdịnihu nke ζήσεται n’ebughị ụzọ kpebie ma ọ pụtara naanị ‘ịlọghachi ndụ’ ma ọ bụ ndụ na-adịgide adịgide.
theological_decisions:
- issue: Nnọchiaha nwoke e ji anọchi anya mmadụ niile na ὁ πιστεύων na ngwaa ndị na-eso ya
  choice: Onye na-ekwere na m, ọ bụrụgodị na ọ nwụọ, ga-adị ndụ
  alternative: Onye ọ bụla na-ekwere na m, ọ bụrụgodị na ha anwụọ, ga-adị ndụ
  rationale: E chekwara otu onye dị na Grik. N’Igbo, “onye” na “ọ” anaghị egosi nwoke ma ọ bụ nwanyị, ya mere nsụgharị ahụ na-agụnye nwoke na nwanyị n’enweghị ịgbanwe ya gaa n’ọtụtụ mmadụ. Ihe odide ala peeji kọwara ụdị Grik ahụ.
- issue: Oke njirimara Jizọs na Ἐγώ εἰμι ἡ ἀνάστασις καὶ ἡ ζωή
  choice: Mụ onwe m bụ mbilite n’ọnwụ na ndụ
  alternative: Mụ onwe m na-enye mbilite n’ọnwụ na ndụ
  rationale: E chekwara nkwupụta njirimara ahụ kpọmkwem, kama ịgbanwe ya ka ọ bụrụ naanị ihe Jizọs na-eme. Nke a na-edobe ịdị arọ nke okwu Grik n’etinyeghị nkọwa ọzọ na ya.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “Mụ onwe m” na-enye nkwusi ike n’enweghị asụsụ ochie; “mbilite n’ọnwụ” bụ okwu ndị mmadụ maara nke ọma maka resurrection. E ji akara [a] tinye ihe odide ala peeji n’isiokwu ahụ.
