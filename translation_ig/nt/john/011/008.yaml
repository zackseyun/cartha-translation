- from: Ndị na-eso ụzọ ya sịrị ya[a], “Rabaị, obere oge gara aga ndị Juu nọ na-achọ ịtụ gị nkume, ị̀ na-alaghachikwa ebe ahụ ọzọ?”
  to: Ndị na-eso ụzọ ya sịrị ya[a], “Rabaị, obere oge gara aga ndị Juu nọ na-achọ ịtụ gị nkume, ị̀ na-aga ebe ahụ ọzọ?”
  rationale: Only the final verb phrase is revised. “Na-aga ... ọzọ” directly represents ὑπάγεις ... πάλιν (‘going there again’), while retaining the disciples’ alarm and the reference to the previously mentioned dangerous location. The footnote anchor and content remain appropriate.
