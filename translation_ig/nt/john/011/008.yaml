id: JHN.11.8
reference: John 11:8
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: λέγουσιν αὐτῷ οἱ μαθηταί· Ῥαββί, νῦν ἐζήτουν σε λιθάσαι οἱ Ἰουδαῖοι, καὶ πάλιν ὑπάγεις ἐκεῖ;
base_translation:
  language: en
  yaml_path: translation/nt/john/011/008.yaml
  text: The disciples said to him[a], “Rabbi, just now the Jews were seeking to stone you, and are you going there again?”
translation:
  language: ig
  text: Ndị na-eso ụzọ ya sịrị ya[a], “Rabaị, obere oge gara aga ndị Juu nọ na-achọ ịtụ gị nkume, ị̀ na-aga ebe ahụ ọzọ?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “ndị Judia” ma ọ bụ, dị ka ọnọdụ okwu si dị, “ndị ndú Juu.” Jọn na-ejikarị “ndị Juu” akọwa ndị na-emegide Jizọs na Judia, ọ bụghị ndị Juu niile.
    reason: alternative_reading
lexical_decisions:
- source_word: λέγουσιν
  choice: sịrị
  rationale: Oge ugbu a e ji akọ akụkọ n’asụsụ Grik na-ada nke ọma dị ka oge gara aga n’akụkọ Igbo.
- source_word: Ῥαββί
  choice: Rabaị
  rationale: E debere aha nsọpụrụ Semitic ahụ n'ụdị Igbo kama ịgbanwe ya ka ọ bụrụ naanị “Onye Ozizi,” iji chekwaa ụzọ ndị na-eso ụzọ si kpọọ Jizọs.
- source_word: νῦν
  choice: obere oge gara aga
  rationale: N'ebe a, okwu ahụ na-egosi na ihe ize ndụ ahụ mere n'oge na-adịbeghị anya, ọ bụghị nanị “ugbu a.”
- source_word: ἐζήτουν
  choice: nọ na-achọ
  rationale: Ọ na-egosipụta omume gara aga nke na-aga n’ihu ma ọ bụ mgbalị a na-eme, n’enweghị ịkọwa karịa ihe Grik kwuru.
- source_word: λιθάσαι
  choice: ịtụ gị nkume
  rationale: Nke a bụ ụzọ Igbo doro anya isi kwuo igbu ma ọ bụ imerụ mmadụ site n’ịtụ ya nkume; etinyeghị “ka ị nwụọ” n’ihi na okwu ahụ apụtaghị kpọmkwem na Grik.
- source_word: οἱ Ἰουδαῖοι
  choice: ndị Juu
  rationale: Nke a bụ ihe okwu Grik ahụ na-apụtakarị. E tinyere nkọwa ụkwụ iji chekwaa ohere na n’ebe a ọ pụrụ izo aka karịsịa n’ebe ndị Judia ma ọ bụ ndị ndú Juu nọ.
- source_word: πάλιν
  choice: ọzọ
  rationale: Ọ bụ ntụgharị Igbo nkịtị na nke kpọmkwem maka ime ihe ọzọ.
- source_word: ὑπάγεις
  choice: ị̀ na-alaghachi
  rationale: Ebe ọ na-ekwu maka ịga ọzọ n’ebe ahụ, “ị̀ na-alaghachi” na-egosi mmegharị ahụ n'ụzọ Igbo sitere n'okike.
- source_word: ἐκεῖ
  choice: ebe ahụ
  rationale: Ọ na-ezo aka n'ebe a kpọtụrụla aha, ya bụ Judia, bụ́ ebe ihe ize ndụ dị.
theological_decisions:
- issue: Ihe οἱ Ἰουδαῖοι na-ezo aka na ya n’Oziọma Jọn
  choice: ndị Juu
  alternative: ndị Judia; ma ọ bụ, dị ka ọnọdụ okwu si dị, ndị ndú Juu
  rationale: E debere ihe okwu ahụ na-apụtakarị n'ahịrịokwu bụ isi, ma akọwara n'okpuru na Jọn na-ejikarị ya akọwa ndị iro Jizọs nọ na Judia, ọ bụghị ndị Juu niile.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke oge a, dị ugwu ma dị mfe nghọta. E ji “Rabaị” chekwaa aha nsọpụrụ dị na isi mmalite; ajụjụ ikpeazụ na-ebu mmetụta nke ihe ijuanya na nchegbu ndị na-eso ụzọ nwere.
