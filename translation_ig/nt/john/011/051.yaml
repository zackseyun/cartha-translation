  text: τοῦτο δὲ ἀφ’ ἑαυτοῦ οὐκ εἶπεν, ἀλλὰ ἀρχιερεὺς ὢν τοῦ ἐνιαυτοῦ ἐκείνου ἐπροφήτευσεν ὅτι ἔμελλεν Ἰησοῦς ἀποθνῄσκειν ὑπὲρ τοῦ ἔθνους,
base_translation:
  language: en
  yaml_path: translation/nt/john/011/051.yaml
  text: He did not say this from himself[a], but being high priest that year, he prophesied that Jesus was going to die for the nation[c][b],
translation:
  language: ig
  text: O kwughị nke a site n’onwe ya[a]; kama, ebe ọ bụ nnukwu onye nchụàjà n’afọ ahụ, o buru amụma na Jizọs ga-anwụ maka mba ahụ[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’onwe ya” ma ọ bụ “site n’uche nke aka ya.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “n’aha mba ahụ” ma ọ bụ “n’ihi ọdịmma mba ahụ.”
    reason: alternative_reading
  - marker: c
    text: Ma ọ bụ, “Jizọs na-aga ịnwụ” ma ọ bụ “e kpebiri na Jizọs ga-anwụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο δὲ
  choice: nke a; kama
  rationale: A hapụrụ δέ ka usoro ahịrịokwu Igbo na njikọ ‘kama’ nke ἀλλά gosipụta ntụgharị okwu ahụ n'ụzọ dị nro, na-enweghị itinye okwu oge na-adịghị na Grik.
- source_word: ἀφ’ ἑαυτοῦ
  choice: site n’uche nke aka ya
  rationale: Nke a na-egosi na okwu ahụ esighị nanị n’echiche ma ọ bụ n’imepụta okwu nke Kayafas onwe ya pụta; ọ bụkwa Igbo doro anya karịa ntụgharị mkpụrụokwu nkịtị.
- source_word: ἀρχιερεὺς ὢν τοῦ ἐνιαυτοῦ ἐκείνου
  choice: ebe ọ bụ nnukwu onye nchụàjà n’afọ ahụ
  rationale: ‘Ebe ọ bụ’ na-echekwa ọrụ ndabere, nke nwekwara ike igosi ihe kpatara ya, n’enweghị ịkọwa ya karịa ihe ederede kwuru.
- source_word: ἐπροφήτευσεν
  choice: o buru amụma
  rationale: Nke a bụ okwu Igbo a na-ejikarị akọwa ikwu okwu amụma, ma na-echekwa ike amụma nke ngwaa Grik ahụ.
- source_word: ἔμελλεν ... ἀποθνῄσκειν
  choice: ga-anwụ
  rationale: Ọdịnihu ‘ga-anwụ’ na-enye echiche nke ihe a na-atụ anya na ọ ga-eme, n’enweghị ịmanye echiche nke na ọ ga-eme ozugbo ma ọ bụ na akara aka amanyere ya.
- source_word: ὑπὲρ τοῦ ἔθνους
  choice: n’ihi mba ahụ
  rationale: ‘N’ihi’ na-egosipụta uru ma ọ bụ ihe e mere maka mba ahụ n’ụzọ sara mbara, na-ahapụghị ihe ederede ka ọ bụrụ naanị otu nkọwa mgbapụta.
theological_decisions:
- issue: Ihe okwu Kayafas pụtara dị ka amụma
  choice: E kwuru hoo haa na o buru amụma n’ihi ọnọdụ ya dị ka nnukwu onye nchụàjà, ma a kọwaghị ma ọ maara ihe Chineke bu n’obi.
  alternative: Ịsị na Kayafas maara nke ọma na Mmụọ Nsọ na-akpali ya, ma ọ bụ na Jọn ji okwu ahụ eme ihe naanị n’ụzọ ịkwa emo.
  rationale: Grik kwuru kpọmkwem ἐπροφήτευσεν, ya bụ ‘o buru amụma,’ ma o kwughị ihe Kayafas maara n’obi ma ọ bụ kwado omume ya.
- issue: Ike ὑπὲρ n’ihe gbasara ọnwụ Jizọs
  choice: n’ihi mba ahụ
  alternative: n’aha mba ahụ; maka ọdịmma mba ahụ; n’ọnọdụ mba ahụ
  rationale: A họọrọ okwu sara mbara nke na-echekwa echiche uru na nnọchite anya, n’enweghị itinye naanị otu usoro nkà mmụta okpukpe n’amaokwu a.
translation_notes:
  register: Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E ji ‘nnukwu onye nchụàjà’ mee ἀρχιερεύς, e jikwa ‘mba ahụ’ chekwaa otu ọnụọgụ na ntụaka ya nye mba ndị Juu. Akara ndetu ala ala [a], [b], na [c] niile dị n’ederede isi.
