revisions:
- from: O kwughị nke a site n’uche nke aka ya[a]; kama, ebe ọ bụ nnukwu onye nchụàjà n’afọ ahụ, o buru amụma na Jizọs ga-anwụ n’ihi mba ahụ[b][c].
  to: O kwughị nke a site n’onwe ya[a]; kama, ebe ọ bụ nnukwu onye nchụàjà n’afọ ahụ, o buru amụma na Jizọs ga-anwụ maka mba ahụ[b][c].
  rationale: The revision removes an unwarranted narrowing of “from himself” and clarifies the benefactive/representative force of “for the nation.” It retains the draft’s natural Standard Igbo syntax, its restrained handling of Caiaphas’s prophecy, and all existing footnote anchors.
