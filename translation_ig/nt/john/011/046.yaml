  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τινὲς δὲ ἐξ αὐτῶν ἀπῆλθον πρὸς τοὺς Φαρισαίους καὶ εἶπαν αὐτοῖς ἃ ⸀ἐποίησεν Ἰησοῦς.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/046.yaml
  text: But some of them went to the Pharisees and told them what Jesus had done[a].
translation:
  language: ig
  text: Ma ụfọdụ n’ime ha gakwuuru ndị Farisii ma gwa ha ihe Jizọs mere.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “kọọrọ ha ihe Jizọs mere.” Okwu Grik ekwughị kpọmkwem ihe mere ndị ahụ ji gaa n’ebe ndị Farisii nọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: τινὲς δὲ ἐξ αὐτῶν
  choice: Ma ụfọdụ n’ime ha
  rationale: “Ụfọdụ n’ime ha” na-egosi otu akụkụ nke ìgwè ahụ a kpọtụrụ aha n’amaokwu bu ụzọ; “Ma” na-egosikwa ọdịiche dị n’etiti omume ha na nzaghachi ndị kweere.
- source_word: ἀπῆλθον πρὸς τοὺς Φαρισαίους
  choice: gara na ndị Farisii
  rationale: Nke a bụ okwu Igbo dị mfe ma bụrụ nke e ji eme ihe maka ịga ebe ndị mmadụ nọ; ọ na-egosi na ha hapụrụ ebe ahụ gaa n’ebe ndị Farisii nọ n’etinyeghị ebumnobi ọzọ.
- source_word: εἶπαν αὐτοῖς
  choice: gwa ha
  rationale: N’ọnọdụ akụkọ a, “gwa ha” na-enye echiche nke ịkọrọ ha ihe mere n’ụzọ Igbo na-ada nke ọma, na-enweghị ime ka akụkọ ahụ bụrụ ebubo.
- source_word: ἃ ἐποίησεν Ἰησοῦς
  choice: ihe Jizọs mere
  rationale: Ọ na-esochi okwu Grik nke pụtara ihe ndị Jizọs mere, ma na-ada nke ọma n’Igbo; oge gara aga zuru ezu na-egosi na omume ahụ mere tupu ha agwa ndị Farisii.
theological_decisions:
- issue: Ebumnobi ndị gara kọọrọ ndị Farisii ihe ahụ
  choice: E ji okwu na-anọpụ iche, “gwa ha,” kọwaa ihe ha mere.
  alternative: “gara gbaa Jizọs ama” ma ọ bụ “gara kọọrọ ha ihe ọjọọ banyere Jizọs”
  rationale: Okwu Grik kwuru naanị na ha gara gwa ndị Farisii ihe Jizọs mere; ọ kọwaghị ebumnobi ha kpọmkwem. Ya mere, ntụgharị a anaghị atụkwasị iro ma ọ bụ aghụghọ n’ihe amaokwu ahụ kwuru.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe ma nwee ugwu, mee ntụgharị ahụ. A họọrọ “ndị Farisii” dị ka aha ìgwè ahụ a maara nke ọma, ma zere okwu ọ bụla ga-akọwa ebumnobi ndị ahụ karịa ka isi mmalite Grik kwuru.
