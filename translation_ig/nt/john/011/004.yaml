  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀκούσας δὲ ὁ Ἰησοῦς εἶπεν· Αὕτη ἡ ἀσθένεια οὐκ ἔστιν πρὸς θάνατον ἀλλ’ ὑπὲρ τῆς δόξης τοῦ θεοῦ ἵνα δοξασθῇ ὁ υἱὸς τοῦ θεοῦ δι’ αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/004.yaml
  text: But when Jesus heard it[a], he said, “This sickness is not unto death, but for the glory of God, so that the Son of God may be glorified through it.”
translation:
  language: ig
  text: Ma mgbe Jizọs nụrụ ya, ọ sịrị, “Ọrịa a abụghị nke ga-ejedebe n’ọnwụ,[a] kama ọ bụ maka otuto Chineke, ka e wee nye Ọkpara Chineke otuto site n’ọrịa a.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ọ bụghị maka ọnwụ.” Okwu Grik a nwere ike ịpụta na ọnwụ abụghị ihe ikpeazụ ga-esi n’ọrịa ahụ pụta ma ọ bụ nzube ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσας δὲ ὁ Ἰησοῦς
  choice: Ma mgbe Jizọs nụrụ ya
  rationale: A sụgharịrị aorist participle dị ka ahịrịokwu na-egosi oge n’Igbo. “Ya” sitere n’ihe gbara amaokwu ahụ gburugburu, ya bụ ozi banyere ọrịa Lazarọs; δέ bụ “Ma,” nke na-egosi ntakịrị mgbanwe n’akụkọ ahụ.
- source_word: ἀσθένεια
  choice: ọrịa
  rationale: “Ọrịa” bụ okwu Igbo doro anya, sara mbara, ma kwekọọ n’ọnọdụ Lazarọs n’enweghị ụda okwu ahụike pụrụ iche.
- source_word: οὐκ ἔστιν πρὸς θάνατον
  choice: abụghị nke ga-ejedebe n’ọnwụ
  rationale: πρός na accusative nwere ike igosi njedebe ma ọ bụ ihe ga-esi na ya pụta. Nsụgharị a bụ Igbo nkịtị ma na-echekwa echiche na ọnwụ abụghị njedebe ikpeazụ nke ọrịa ahụ.
- source_word: ὑπὲρ τῆς δόξης τοῦ θεοῦ
  choice: maka otuto Chineke
  rationale: ὑπέρ ebe a na-egosi nzube ma ọ bụ uru; “maka otuto Chineke” bụ okwu Igbo dị mfe ma na-echekwa ịdị arọ nke δόξα.
- source_word: ἵνα δοξασθῇ ὁ υἱὸς τοῦ θεοῦ
  choice: ka e wee ... nye Ọkpara Chineke otuto
  rationale: “Ka e wee” na-egosi nzube nke ἵνα. Nhazi “nye ... otuto” na-egosipụta passive δοξασθῇ n’ụzọ Igbo na-aga were were, n’agbanyeghị na a na-eji impersonal passive.
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: Ọkpara Chineke
  rationale: Nke a bụ nsụgharị doro anya na nke kwesịrị ekwesị maka aha Kraịst a; “Ọkpara” na-egosi Ọkpara ahụ pụrụ iche n’ebe a.
- source_word: δι’ αὐτῆς
  choice: site na ya
  rationale: διά na genitive na-egosi ụzọ ma ọ bụ ihe e ji mee ihe. “Ya” na-alaghachi n’ọrịa ahụ.
theological_decisions:
- issue: Ihe “ọ bụghị nke ga-ejedebe n’ọnwụ” pụtara ebe Lazarọs mechara nwụọ
  choice: E gosipụtara na ọnwụ abụghị njedebe ikpeazụ nke ọrịa ahụ.
  alternative: Ịsụgharị ya dị ka nkwa doro anya na Lazarọs agaghị anwụ ma ọlị, ma ọ bụ naanị dị ka “ọrịa a agaghị egbu ya.”
  rationale: Akụkọ na-esochi na-ekwu na Lazarọs nwụrụ. Nsụgharị a na-echekwa ike nke πρὸς na esemokwu dị n’akụkọ ahụ n’ebughị ụzọ kọwaa ihe niile.
- issue: Mmekọrịta dị n’etiti otuto Chineke na inye Ọkpara Chineke otuto
  choice: 'E debere okwu abụọ ahụ iche: ọrịa ahụ bụ maka otuto Chineke, ka e wee site na ya nye Ọkpara Chineke otuto.'
  alternative: Ijikọta ha ka ha bụrụ naanị otu nkwupụta sara mbara banyere otuto Chineke.
  rationale: Grik ahụ kpọrọ ma otuto Chineke ma otuto Ọkpara aha n’ụzọ doro anya. Idebe ha abụọ na-echekwa ihe amaokwu ahụ kwuru banyere Ọkpara n’etinyeghị nkọwa ozizi ọzọ.
translation_notes:
  register: Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. E ji “ga-ejedebe n’ọnwụ” mee ka echiche nke njedebe pụta nke ọma n’Igbo, ebe nkọwa ala peeji na-echekwa nsụgharị dị nso n’usoro okwu Grik.
