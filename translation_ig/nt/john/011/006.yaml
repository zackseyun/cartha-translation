  text: ὡς οὖν ἤκουσεν ὅτι ἀσθενεῖ, τότε μὲν ἔμεινεν ἐν ᾧ ἦν τόπῳ δύο ἡμέρας·
base_translation:
  language: en
  yaml_path: translation/nt/john/011/006.yaml
  text: So when he heard that he was sick[a], he then stayed two days in the place where he was.
translation:
  language: ig
  text: Ya mere, mgbe ọ nụrụ na Lazarọs na-arịa ọrịa, mgbe ahụ ọ nọrọ ụbọchị abụọ n’ebe ọ nọ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡς οὖν
  choice: Ya mere, mgbe
  rationale: Njikọ a na-egosi ma ọganihu akụkọ ma njikọ ya na ihe e kwuru tupu ya; Igbo a bụ nke okike ma doo anya.
- source_word: ἤκουσεν
  choice: ọ nụrụ
  rationale: Nke a na-edobe ihe ἀκούω pụtara n'ụzọ kwụ ọtọ, n’etinyeghị echiche ọzọ dịka na a kọọrọ ya.
- source_word: ὅτι ἀσθενεῖ
  choice: na Lazarọs na-arịa ọrịa
  rationale: N’akụkọ a, ἀσθενέω na-ekwu maka ọrịa anụ ahụ. Itinye aha Lazarọs na-eme ka onye nnọchiaha Grik doo anya n’Igbo site n’ihe gbara amaokwu ahụ gburugburu, ebe oge ugbu a nke ‘na-arịa’ na-echekwa ụdị ngwaa Grik.
- source_word: τότε μὲν
  choice: ọ nọrọkwa
  rationale: Mgbakwunye ‘-kwa’ na-ejikọta omume a na ihe ọ nụrụ ma na-enye ntakịrị nkwusi ike nke μέν n’enweghị okwu Igbo siri ike ma ọ bụ nke na-adịghị ekwe ntị.
- source_word: ἔμεινεν
  choice: ọ nọrọ
  rationale: N’ebe a μένω pụtara ịnọgide n’otu ebe; ‘nọrọ’ bụ okwu Igbo nkịtị ma ziri ezi.
- source_word: ἐν ᾧ ἦν τόπῳ
  choice: n’ebe ahụ ọ nọ
  rationale: Nke a na-echekwa nkwusi ike Grik banyere ebe ahụ, ma na-ada ka Igbo ebumpụta ụwa.
- source_word: δύο ἡμέρας
  choice: ụbọchị abụọ
  rationale: Ntụgharị a na-egosi oge o jiri nọrọ n’ebe ahụ n'ụzọ doro anya.
theological_decisions:
- issue: Ihe akụkọ ahụ na-egosi banyere Jizọs ịnọ ọdụ mgbe ọ nụrụ ọrịa Lazarọs
  choice: E kwuru n'ụzọ doro anya na mgbe ọ nụrụ akụkọ ahụ, ọ nọrọkwa ụbọchị abụọ n’ebe ọ nọ.
  alternative: Ịkọwa n’ime amaokwu ahụ na ọ kpachapụrụ anya mee nke a n’ihi ọmịiko ma ọ bụ atụmatụ Chineke.
  rationale: Isi mmalite ahụ anaghị akọwa ihe kpatara igbu oge ahụ n’amaokwu a. Ntụgharị ahụ na-ahapụ esemokwu akụkọ na nkà mmụta okpukpe ahụ ka ọ dị, n’agbalịghị idozi ya.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. A họọrọ usoro okwu nke na-ada ka akụkọ Igbo ebumpụta ụwa, ma e chekwara njikọ, oge ngwaa, ebe, na ogologo oge dị na Grik.
