  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἷς δέ τις ἐξ αὐτῶν Καϊάφας, ἀρχιερεὺς ὢν τοῦ ἐνιαυτοῦ ἐκείνου, εἶπεν αὐτοῖς· Ὑμεῖς οὐκ οἴδατε οὐδέν,
base_translation:
  language: en
  yaml_path: translation/nt/john/011/049.yaml
  text: But one of them[a], Caiaphas, who was high priest that year, said to them, “You know nothing at all.”
translation:
  language: ig
  text: Ma otu onye n’ime ha, bụ́ Kayafas, onye bụ onyeisi nchụàjà n’afọ ahụ, sịrị ha, “Ọ dịghị ihe unu maara ma ọlị.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἷς δέ τις ἐξ αὐτῶν
  choice: Ma otu onye n’ime ha
  rationale: Nkebi okwu εἷς ... τις na-egosi otu onye sitere n’ìgwè ahụ; ‘otu onye n’ime ha’ bụ ụzọ Igbo doro anya ma kwekọọ n’echiche ahụ. ‘Ma’ na-egosipụta ntakịrị mgbanwe ma ọ bụ ọdịiche nke δέ.
- source_word: Καϊάφας
  choice: Kayafas
  rationale: A sụgharịghị aha mmadụ; e dere ya n’ụdị mkpụrụokwu dabara n’usoro mkpọpụta Igbo.
- source_word: ἀρχιερεὺς
  choice: nnukwu onye nchụàjà
  rationale: Nke a na-egosi onye nọ n’ọkwa kachasị elu n’etiti ndị nchụàjà, ghara ịgwakọta ya na ọtụtụ ndị isi nchụàjà.
- source_word: ὢν τοῦ ἐνιαυτοῦ ἐκείνου
  choice: onye bụ nnukwu onye nchụàjà n’afọ ahụ
  rationale: Ụdị a bụ Igbo nkịtị ma na-edobe nkọwa oge ahụ n’enweghị ịgbakwunye nkọwa banyere ọrụ ahụ.
- source_word: εἶπεν αὐτοῖς
  choice: sịrị ha
  rationale: Nke a bụ nsụgharị Igbo kpọmkwem ma dịkwa eke nke ‘ọ gwara ha/ọ sịrị ha.’
- source_word: Ὑμεῖς οὐκ οἴδατε οὐδέν
  choice: Ọ dịghị ihe unu maara ma ọlị
  rationale: ‘Ma ọlị’ na-ebupụta nkwusi ike nke nnọpụ abụọ n’asụsụ Grik ma mee ka okwu ahụ bụrụ mba siri ike n’Igbo.
theological_decisions:
- issue: Nkọwa oge Jọn nyere banyere ọkwa Kayafas
  choice: onye bụ nnukwu onye nchụàjà n’afọ ahụ
  alternative: onye nọ dịka nnukwu onye nchụàjà nke afọ ahụ
  rationale: A sụgharịrị ya dịka nkọwa akụkọ ihe mere eme n’enweghị ịkọwa ihe mere e ji kwuo ‘n’afọ ahụ’ ma ọ bụ tinye nkọwa nkà mmụta okpukpe n’okwu ahụ.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị ùgwù ma dị mfe nghọta. E ji ‘nnukwu onye nchụàjà’ kewapụ otu onye ji ọkwa ahụ n’aka ìgwè ndị isi nchụàjà; okwu ikpeazụ ahụ na-ada dịka mba siri ike, dịka Grik si dị.
