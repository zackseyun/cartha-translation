source:
  edition: SBLGNT
  text: οὐδὲ ⸀λογίζεσθε ὅτι συμφέρει ⸀ὑμῖν ἵνα εἷς ἄνθρωπος ἀποθάνῃ ὑπὲρ τοῦ λαοῦ καὶ μὴ ὅλον τὸ ἔθνος ἀπόληται.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/050.yaml
  text: Nor do you consider that it is better for you that one man die for the people[a], and not that the whole nation perish.
translation:
  language: ig
  text: Unu anaghị atụlekwa na ọ kaara unu mma ka otu nwoke nwụọ maka ndị mmadụ[a], kama ka mba ahụ dum laa n’iyi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịtụgharị ya, “maka ọdịmma ndị mmadụ”; okwu a nwekwara ike ịpụta, “n’ọnọdụ ndị mmadụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδὲ λογίζεσθε
  choice: Unu adịghịkwa eche
  rationale: Nke a na-egosipụta mgbakwunye nke mba na nkọcha dị n’okwu ahụ, ebe ‘eche’ na-enye echiche nke ịtụle ma ọ bụ ịgbakọ ihe n’uche n’Igbo nkịtị.
- source_word: συμφέρει ὑμῖν
  choice: ọ kaara unu mma
  rationale: Nkebiokwu a na-egosipụta uru dịịrị ndị a na-agwa okwu ma na-ada nke ọma n’Igbo ugbu a.
- source_word: ἵνα εἷς ἄνθρωπος ἀποθάνῃ
  choice: ka otu nwoke nwụọ
  rationale: Ọ na-edobe otu onye, ụdị nwoke nke okwu Grik, na usoro ebumnuche/ọdịnaya nke ἵνα n'ụzọ doro anya.
- source_word: ὑπὲρ τοῦ λαοῦ
  choice: n’ihi ndị mmadụ
  rationale: ‘N’ihi’ sara mbara nke ọma iji gosi ọnwụ maka ab منفite/ọdịmma ndị mmadụ, ma ghara ikpebi ma ọ bụ naanị nnọchite anya ka ọ bụ ịnọ n’ọnọdụ ha; e debere nkọwa ndị ahụ n’ala peeji.
- source_word: ὅλον τὸ ἔθνος
  choice: mba ahụ dum
  rationale: N’ebe a ἔθνος bụ mba ahụ dịka otu agbụrụ na ndọrọ ndọrọ ọchịchị, ọ bụghị ndị mba ọzọ.
- source_word: ἀπόληται
  choice: laa n’iyi
  rationale: Akpaalaokwu Igbo a na-egosipụta mbibi ma ọ bụ ịla n’iyi siri ike n’enweghị ịkọ kpọmkwem ụzọ mbibi ahụ.
theological_decisions:
- issue: Uche ὑπὲρ gbasara ọnwụ Jizọs
  choice: E ji ‘n’ihi ndị mmadụ’ mee ihe n’ahịrịokwu bụ isi.
  alternative: ‘maka ọdịmma ndị mmadụ’ ma ọ bụ ‘n’ọnọdụ ndị mmadụ’
  rationale: Kayafas na-ekwu maka uru ndọrọ ndọrọ ọchịchị, ma onye dere Oziọma ahụ ga-akọwa okwu ya dịka amụma ọ na-amaghị na ọ na-ekwu. Nsụgharị sara mbara na-edobe ma echiche mbụ ahụ ma ụda àjà/nnọchi anya n’enweghị ịmanye otu nkọwa.
- issue: Mmekọrịta καὶ μὴ na nkebi ikpeazụ
  choice: kama ikwe ka mba ahụ dum laa n’iyi
  alternative: ọ bụghịkwa ka mba ahụ dum laa n’iyi
  rationale: ‘Kama’ na-eme ka ọdịiche dị n’etiti ọnwụ otu nwoke na mbibi mba dum doo anya n’Igbo; ‘ikwe ka’ bụ mmeju asụsụ ebumnuche iji mee ka njikọ ahụ bụrụ nke eke, ọ bụghị nkwupụta na ha bụ ndị kpatara mbibi ahụ.
translation_notes:
  register: Standard Igbo dị ugbu a, dị nsọ ma dị mfe nghọta. E jiri ‘unu’ gosi na onye na-ekwu okwu na-agwa ọtụtụ mmadụ okwu. Akara ala peeji [a] dị n’ahịrịokwu bụ isi.
