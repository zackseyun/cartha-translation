    reason: lexical_alternative
  - marker: b
    text: Ya bụ, ka ha mee nsachapụ emume okpukpe iji kwadebe onwe ha maka Ememme Ngabiga.
    reason: cultural_note
  revision_rationale: The revision relocates footnote [a] to its proper lexical referent, makes the purpose clause idiomatic while preserving the reflexive ritual-purification meaning, and adds a mild Igbo coordinator corresponding to the narrative linkage. No doctrinal interpretation is added.
