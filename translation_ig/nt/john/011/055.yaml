review_pass:
  verdict: revise
  source_fidelity: The draft conveys the temporal setting, Jewish Passover designation, movement up to Jerusalem from the countryside, prior timing, and purpose of ritual purification. However, the main rendering of ἁγνίσωσιν ἑαυτούς is somewhat cumbersome in Igbo; a more idiomatic reflexive expression better communicates the ritual-cleansing sense without adding theological interpretation.
  naturalness: “Mee onwe ha ka ha dị ọcha” is understandable but is a relatively literal and less natural construction. “Sachapụ onwe ha” is smoother Standard Igbo in this ritual-preparation context. The sentence also reads more naturally with an explicit mild coordinator before “ọtụtụ mmadụ.”
  terminology: “Ememme Ngabiga nke ndị Juu” appropriately represents τὸ πάσχα τῶν Ἰουδαίων, and “rịgoro Jerusalem” retains the conventional/upward-travel nuance. The lexical-alternative footnote must be anchored to the Passover expression itself, rather than to “dị nso.”
  issues:
  - severity: medium
    issue: Footnote [a] is attached after “dị nso” rather than after “Ememme Ngabiga nke ndị Juu.”
    rationale: The note discusses the wording of τὸ πάσχα τῶν Ἰουδαίων, not the adjective ἐγγύς. Its anchor should immediately follow the phrase it explains.
  - severity: low
    issue: “Mee onwe ha ka ha dị ọcha” is stylistically awkward for ἁγνίσωσιν ἑαυτούς.
    rationale: “Sachapụ onwe ha” is a more idiomatic Standard Igbo expression of self-purification and, with the cultural note, retains the historically ritual sense without over-specification.
  - severity: low
    issue: The connection of the second clause is underrepresented.
    rationale: Greek δέ is mild, but “ma” supplies a natural, non-contrastive coordination in Igbo without overstating the connective.
  revised_text: Ememme Ngabiga nke ndị Juu[a] dị nso, ma ọtụtụ mmadụ si n’ime ime obodo rịgoro Jerusalem tupu Ememme Ngabiga, ka ha wee sachapụ onwe ha[b].
  revised_footnotes:
