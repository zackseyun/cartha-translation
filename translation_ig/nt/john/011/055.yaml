  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἦν δὲ ἐγγὺς τὸ πάσχα τῶν Ἰουδαίων, καὶ ἀνέβησαν πολλοὶ εἰς Ἱεροσόλυμα ἐκ τῆς χώρας πρὸ τοῦ πάσχα ἵνα ἁγνίσωσιν ἑαυτούς.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/055.yaml
  text: The Passover of the Jews was near[b][a], and many went up to Jerusalem from the countryside before the Passover to purify themselves.
translation:
  language: ig
  text: Ememme Ngabiga nke ndị Juu[a] dị nso, ma ọtụtụ mmadụ si n’ime ime obodo rịgoro Jerusalem tupu Ememme Ngabiga, ka ha wee sachapụ onwe ha[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “Ememme Ngabiga ndị Juu.” N’asụsụ Grik, ọ bụ kpọmkwem “Ememme Ngabiga nke ndị Juu,” okwu Jọn na-eji ugboro ugboro.
    reason: lexical_alternative
  - marker: b
    text: Ya bụ, ka ha mee nsachapụ emume okpukpe iji kwadebe onwe ha maka Ememme Ngabiga.
    reason: cultural_note
lexical_decisions:
- source_word: Ἦν δὲ
  choice: dị
  rationale: A hapụrụ δέ ka usoro ahịrịokwu na-egosi njikọ dị nro ya; itinye “Ma” nwere ike ime ka ọdịiche ahụ sie ike karịa otú Grik si kwuo ya.
- source_word: ἐγγὺς
  choice: dị nso
  rationale: Nke a na-egosi na oge ememme ahụ eruola nso n’asụsụ Igbo dị mfe ma doo anya.
- source_word: τὸ πάσχα τῶν Ἰουδαίων
  choice: Ememme Ngabiga nke ndị Juu
  rationale: Nke a na-edobe usoro genitive nke Grik ma na-eji aha a maara nke ọma maka πάσχα.
- source_word: ἀνέβησαν
  choice: rịgoro
  rationale: Ọ na-edobe echiche nke ịrịgo Jerusalem, ma n’ọnọdụ ala ya ma n’omenala njem ofufe.
- source_word: πολλοὶ
  choice: ọtụtụ mmadụ
  rationale: Ọ bụ adjective e ji dochie aha mmadụ; ịgbakwunye “mmadụ” na-eme ka Igbo bụrụ nke eke ma doo anya.
- source_word: εἰς Ἱεροσόλυμα
  choice: Jerusalem
  rationale: Ya na “rịgoro,” aha obodo ahụ na-egosi ebe ha na-aga n’ụzọ Igbo si ekwu ya nke ọma.
- source_word: ἐκ τῆς χώρας
  choice: si n’ime ime obodo
  rationale: Nke a na-egosi ógbè ndị na-abụghị obodo ukwu, dị iche na Jerusalem.
- source_word: πρὸ τοῦ πάσχα
  choice: tupu Ememme Ngabiga
  rationale: Nke a na-edobe mmekọrịta oge ahụ n'ụzọ kwụ ọtọ.
- source_word: ἵνα ἁγνίσωσιν ἑαυτούς
  choice: ka ha wee mee onwe ha ka ha dị ọcha
  rationale: “Ka ha wee” na-egosi nzube, ebe “mee onwe ha ka ha dị ọcha” na-edobe reflexive na echiche nke ime ka mmadụ dị ọcha n’emeghị ka nkọwa okpukpe gafee ihe ederede kwuru.
theological_decisions:
- issue: Ụdị ịdị ọcha a chọrọ tupu Ememme Ngabiga
  choice: mee onwe ha ka ha dị ọcha
  alternative: sachapụ onwe ha dịka usoro okpukpe si dị
  rationale: Ihe gbara amaokwu ahụ gburugburu na-ezo aka n’usoro ndị Juu ji akwadebe maka Ememme Ngabiga. E debere okwu bụ isi n’ụzọ sara mbara, ebe ihe odide ala peeji na-akọwa ọnọdụ omenala ahụ, ka a ghara ibubata echiche sakrament ma ọ bụ naanị ịdị ọcha nke obi.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “Ememme Ngabiga” na-enye πάσχα aha doro anya; “ime ime obodo” na-egosi mpaghara ndị dị n’èzí obodo ukwu. E tinyere akara [a] n’akụkụ okwu gbasara aha ememme, na [b] n’akụkụ okwu gbasara ime ka onwe ha dị ọcha, ka akara nke ọ bụla daba na nkọwa ya.
