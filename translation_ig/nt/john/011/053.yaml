  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀπ’ ἐκείνης οὖν τῆς ἡμέρας ⸀ἐβουλεύσαντο ἵνα ἀποκτείνωσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/053.yaml
  text: So from that day on they planned to kill him.
translation:
  language: ig
  text: Ya mere, site n’ụbọchị ahụ gaa n’ihu, ha gbara izu igbu ya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπ’ ἐκείνης ... τῆς ἡμέρας
  choice: site n’ụbọchị ahụ gaa n’ihu
  rationale: Nke a na-egosi na atụmatụ ahụ malitere n’ụbọchị ahụ wee na-aga n’ihu; ọ bụkwa ụzọ Igbo doro anya si kwuo echiche oge a.
- source_word: οὖν
  choice: Ya mere
  rationale: Ọ na-egosi ihe si ná nzukọ na mkpebi ndị e kwuru n’amaokwu ndị bu ụzọ pụta.
- source_word: ἐβουλεύσαντο
  choice: ha gbara izu
  rationale: N’ebe a, ngwaa ahụ na-egosi na ha kparịtara ma guzobe atụmatụ nzuzo; “gbara izu” na-egosipụta echiche nke nkata nke ọma n’Igbo.
- source_word: ἵνα ἀποκτείνωσιν
  choice: igbu
  rationale: Infinitive a na-egosipụta ebumnuche nke izu ahụ n’ụzọ dị nkenke ma bụrụkwa Igbo eke; ọ naghị etinye echiche ikpe ụlọikpe na-adịghị na Grik.
- source_word: αὐτόν
  choice: ya
  rationale: Nnọchiaha a na-ezo aka na Jizọs dịka ihe gbara amaokwu ahụ gburugburu si gosi; ọ dịghị mkpa itinye aha ya n’ọnọdụ nnọchiaha ahụ.
theological_decisions:
- issue: Ụdị ebumnuche ndị isi ahụ nwere megide Jizọs
  choice: Ikwupụta ya dịka atụmatụ siri ike ha gbara iji gbuo ya.
  alternative: Ikwupụta na naanị ha tụlere ma ọ bụ kwurịtara okwu igbu ya.
  rationale: Grik ahụ na-egosi na ha esila ná mkparịta ụka banye n’atụmatụ doro anya. “Ha gbara izu igbu ya” na-edobe ịdị arọ nke ebumnuche ahụ n’etinyeghị nkọwa iwu ma ọ bụ ozizi ọzọ.
translation_notes:
  register: Asụsụ Igbo Izugbe dị ugbu a, kwụ ọtọ ma nwee ugwu. “Gbara izu” bụ okwu ndị mmadụ na-aghọta nke na-echekwa echiche nke deliberation na nkata dị na ἐβουλεύσαντο.
