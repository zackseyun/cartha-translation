    reason: alternative_reading
  revision_rationale: Revised the final prepositional phrase from causal “n'ihi” to topical “banyere,” matching περί + genitive. Also used “esịalarị bịakwute” to make the prior-completed sense of the pluperfect explicit. The footnote was conformed to the revised verbal wording and retains the genuine ambiguity of Ἰουδαίων.
