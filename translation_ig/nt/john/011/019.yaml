  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸂πολλοὶ δὲ⸃ ἐκ τῶν Ἰουδαίων ἐληλύθεισαν πρὸς ⸀τὴν Μάρθαν καὶ ⸀Μαριὰμ ἵνα παραμυθήσωνται αὐτὰς περὶ τοῦ ⸀ἀδελφοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/019.yaml
  text: Many of the Jews had come to Martha and Mary to comfort them about their brother[a].
translation:
  language: ig
  text: Ọtụtụ ndị Juu esịalarị bịakwute Mata na Meri ka ha kasie ha obi banyere nwanne ha nwoke[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Ọtụtụ ndị sitere n’etiti ndị Judia esịalarị bịakwute Mata na Meri.” Okwu Grik ahụ nwere ike ịpụta ndị Juu n’ozuzu ha, ma ọ bụ, n’akụkụ ụfọdụ nke Jọn, ndị Judia kpọmkwem.
    reason: alternative_reading
lexical_decisions:
- source_word: πολλοὶ δὲ
  choice: Ọtụtụ
  rationale: πολλοί pụtara “ọtụtụ.” δέ bụ njikọ dị nro; n'Igbo, ahapụrụ ya n'ekwughị ya kpọmkwem ka ahịrịokwu wee daa nke ọma, n'ebughị echiche nke mmegide ma ọ bụ oge na-adịghị na isi mmalite.
- source_word: ἐκ τῶν Ἰουδαίων
  choice: ndị Juu
  rationale: Nkebi a pụtara ọtụtụ ndị sitere n'etiti ndị Juu. “Ndị Juu” dabara n'ọnọdụ a nke ndị bịara ịkasi ụmụnne nwanyị ahụ obi; enwere ike ịghọta okwu Grik ahụ dị ka “ndị Judia” n'ọnọdụ ụfọdụ, ya mere e debere nke ahụ n'ala ala peeji.
- source_word: ἐληλύθεισαν
  choice: abịakwutela
  rationale: Oge pluperfect na-egosi na ha abịalarị tupu oge akụkọ a na-ekwu maka ya; “abịakwutela” na-egosipụta nke a n'ụzọ nkịtị n'Igbo.
- source_word: πρὸς τὴν Μάρθαν καὶ Μαριὰμ
  choice: Mata na Meri
  rationale: πρός na accusative na-egosi ịbịakwute mmadụ. “Mata” na “Meri” bụ ụdị aha ndị a a na-aghọta nke ọma n'Igbo.
- source_word: ἵνα παραμυθήσωνται αὐτὰς
  choice: ka ha kasie ha obi
  rationale: ἵνα na subjunctive na-egosi ebumnuche, ebe παραμυθέομαι pụtara ịkasi onye na-eru uju obi. Nkebi Igbo a bụ nke e ji eme ihe n'ụzọ nkịtị.
- source_word: περὶ τοῦ ἀδελφοῦ
  choice: n'ihi nwanne ha nwoke
  rationale: περί na genitive ebe a metụtara ihe kpatara nkasi obi ahụ, ya bụ ọnwụ nwanne ha. “Nwanne ha nwoke” na-eme ka o doo anya na onye ahụ bụ nwoke na nwanne ụmụ nwanyị abụọ ahụ.
theological_decisions:
- issue: Ntụgharị Ἰουδαίων n'ọnọdụ akụkọ Jọn
  choice: ndị Juu
  alternative: ndị Judia
  rationale: Amaokwu a anaghị ekwu okwu mmegide kama ọ na-akọ maka ndị bịara ịkasi Mata na Meri obi. N'ihi ya, nghọta sara mbara nke “ndị Juu” kacha daba n'ọnọdụ a, ma e debere “ndị Judia” dịka ụzọ ọzọ n'ihi na okwu ahụ nwere ike ịpụta otu ahụ n'akụkụ ụfọdụ nke Jọn.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E ji “kasie ha obi” mee ka ọnọdụ iru uju pụta n'ụzọ nkịtị; e zere ịgbakwunye njikọ siri ike nke δέ na-adịghị achọ ebe a.
