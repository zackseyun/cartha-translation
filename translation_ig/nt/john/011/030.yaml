id: JHN.11.30
reference: John 11:30
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οὔπω δὲ ἐληλύθει ὁ Ἰησοῦς εἰς τὴν κώμην, ἀλλ’ ἦν ⸀ἔτι ἐν τῷ τόπῳ ὅπου ὑπήντησεν αὐτῷ ἡ Μάρθα.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/030.yaml
  text: Jesus had not yet come into the village[a], but was still in the place where Martha had met him.
translation:
  language: ig
  text: Jizọs abatabeghị n’obodo nta ahụ, kama ọ ka nọ n’ebe ahụ Mata zutere ya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n’ụzọ doro anya karị, “ebe Mata gara izute ya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὔπω
  choice: abatabeghị
  rationale: Ngwakọta ‘-beghị’ na-egosi n’ụzọ ebumpụta ụwa na Igbo na ọ batabeghị ruo n’oge ahụ.
- source_word: δὲ
  choice: (ekwughị ya iche)
  rationale: N’ebe a, δέ bụ njikọ akụkọ dị nro; usoro ahịrịokwu Igbo na-ebuga akụkọ ahụ nke ọma n’enweghị itinye okwu dịka ‘ugbu a’ nke na-adịghị n’isi mmalite Grik.
- source_word: ἐληλύθει
  choice: abata
  rationale: Okwu a na-egosi na Jizọs erubeghị ma ọ bụ abatabeghị n’obodo ahụ tupu ihe a na-akọ; ‘abata’ dabara nke ọma na εἰς.
- source_word: κώμην
  choice: obodo nta
  rationale: κώμη na-ezo aka n’obodo pere mpe; ‘obodo nta’ bụ okwu Igbo doro anya ma bụrụkwa nke a na-aghọta ngwa ngwa.
- source_word: ἀλλ’
  choice: kama
  rationale: ‘Kama’ na-egosipụta ọdịiche dị n’etiti na ọ batabeghị n’obodo ahụ na na ọ ka nọ n’ebe ọzọ.
- source_word: ἔτι
  choice: ka
  rationale: ‘Ka nọ’ na-egosi na ịnọ ya n’ebe ahụ gara n’ihu.
- source_word: τόπῳ
  choice: ebe ahụ
  rationale: τόπος bụ okwu izugbe maka ebe; ‘ebe ahụ’ bụ nsụgharị Igbo dị mfe ma kwekọọ n’ọnọdụ a.
- source_word: ὅπου
  choice: n’ebe ahụ
  rationale: Ọ na-ebute nkebiokwu na-akọwa ebe ihe ahụ mere.
- source_word: ὑπήντησεν
  choice: zutere
  rationale: ‘Zutere’ na-edobe isi nghọta nke izute mmadụ n’ebughị ụzọ kpebie ma okwu Grik ahụ ga-akọwapụta ịpụ gaa izute ya; nkọwa ka sara mbara dị n’ala peeji.
- source_word: αὐτῷ
  choice: ya
  rationale: ‘Ya’ bụ nnọchiaha Igbo ebumpụta ụwa mgbe ọ bụ onye a zutere.
- source_word: Μάρθα
  choice: Mata
  rationale: ‘Mata’ bụ ụdị aha a na-ejikarị ede Μάρθα n’Igbo.
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta, dee ya. E debere ọdịiche dị n’etiti ‘abatabeghị’ na ‘ọ ka nọ,’ ma hapụkwa obosara nghọta nke ὑπήντησεν n’ahịrị bụ isi; e nyere nkọwa ọzọ n’ala peeji.
