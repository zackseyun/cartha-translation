  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸀ἐξῆλθεν ὁ τεθνηκὼς δεδεμένος τοὺς πόδας καὶ τὰς χεῖρας κειρίαις, καὶ ἡ ὄψις αὐτοῦ σουδαρίῳ περιεδέδετο. λέγει ⸂αὐτοῖς ὁ Ἰησοῦς⸃· Λύσατε αὐτὸν καὶ ἄφετε ⸀αὐτὸν ὑπάγειν.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/044.yaml
  text: The man who had died came out, his feet and hands bound with burial cloths, and his face wrapped with a cloth. Jesus says to them, “Unbind him and let him go.”
translation:
  language: ig
  text: Nwoke ahụ nwụrụ anwụ wee pụta; e ji iberibe ákwà e ji eli ozu kee ụkwụ ya na aka ya, e jikwa ákwà kechie ihu ya. Jizọs sịrị ha, “Tọpụnụ ya, hapụnụ ya ka ọ laa.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ τεθνηκώς
  choice: nwoke ahụ nwụrụ anwụ
  rationale: Na-egosipụta onye ahụ dị ka onye nwụrụ anwụ, n’ụzọ doro anya ma kwekọọ n’ọnọdụ akụkọ ahụ.
- source_word: κειρίαις
  choice: ákwà e ji eli ozu
  rationale: Okwu ahụ na-ezo aka n’iberibe ákwà e ji eke ozu; nsụgharị a bụ nke ndị na-agụ Igbo taa ga-aghọta ngwa ngwa.
- source_word: ἡ ὄψις αὐτοῦ
  choice: ya n’ihu
  rationale: Ọ bụ ezie na ὄψις nwere ike ịbụ ọdịdị ihu ma ọ bụ ihu, ebe a ihe a na-ekwu bụ akụkụ ihu nke ákwà kpuchiri.
- source_word: σουδαρίῳ
  choice: ákwà
  rationale: Ọ bụ ákwà nta ma ọ bụ ákwà ihu; ‘ákwà’ na-echekwa isi okwu ahụ n’enweghị ịkọwapụta ihe ihe odide ahụ ekwughị kpọmkwem.
- source_word: Λύσατε αὐτόν
  choice: Tọpụnụ ya
  rationale: Na-enye iwu ka a tọpụ ihe ndị e ji kee ya.
- source_word: ἄφετε αὐτὸν ὑπάγειν
  choice: hapụnụ ya ka ọ laa
  rationale: Na-echekwa ma echiche nke ịhapụ ya ma nke ikwe ka ọ gaa.
theological_decisions:
- issue: Oge ngwaa λέγει (‘ọ na-asị’) n’akụkọ
  choice: Jizọs sịrị ha
  alternative: Jizọs na-asị ha
  rationale: Igbo na-ejikarị oge gara aga kọọ usoro ihe mere eme n’ụzọ eke. Nke a anaghị agbanwe ihe okwu Grik nke oge ugbu a ji eme n’akụkọ pụtara.
- issue: Ụdị onye nwụrụ anwụ mgbe ọ pụtara
  choice: nwoke ahụ nwụrụ anwụ wee pụta
  alternative: onye ahụ nwụrụ anwụ wee pụta
  rationale: Akwụkwọ gbara ya gburugburu na-akọwa Lazarọs dị ka nwoke; nsụgharị a adịghị etinye nkọwa ozizi ọzọ banyere ọnọdụ ya.
translation_notes:
  register: Standard Igbo; asụsụ dị ugwu ma dị mfe nghọta. E jiri ‘Jizọs’ dịka nsụpe aha a na-ahụkarị n’Igbo, ma zere okwu ochie ma ọ bụ nke otu ụka pụrụ iche.
