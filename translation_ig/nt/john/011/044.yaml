revisions:
- from: Nwoke ahụ nwụrụ anwụ wee pụta, e ji ákwà e ji eli ozu kee ya n’ụkwụ na n’aka, e jikwa ákwà kechie ya n’ihu. Jizọs sịrị ha, “Tọpụnụ ya, hapụnụ ya ka ọ laa.”
  to: Nwoke ahụ nwụrụ anwụ wee pụta; e ji iberibe ákwà e ji eli ozu kee ụkwụ ya na aka ya, e jikwa ákwà kechie ihu ya. Jizọs sịrị ha, “Tọpụnụ ya, hapụnụ ya ka ọ laa.”
  rationale: The revision retains the draft’s faithful narrative rendering and its natural use of past tense for the Greek historical present, while explicitly attaching the burial strips to Lazarus’s feet and hands and the separate cloth to his face. It also reflects the plural κειρίαις without over-specifying the precise material or style of the σουδάριον.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T06:24:56Z'
review_pass:
  verdict: revise
  source_fidelity: 'The draft conveys the sequence and commands accurately. However, the placement of the possessive/pronominal complements makes the body-part relations less explicit than Greek: δεδεμένος qualifies his feet and hands, while the face—not the man generally—is wrapped in the σουδάριον. The historical present λέγει may idiomatically be rendered with past-tense “sịrị” in Igbo narrative.'
  naturalness: The draft is broadly natural Standard Igbo, but “kee ya n’ụkwụ na n’aka” and especially “kechie ya n’ihu” are less idiomatic and can momentarily suggest binding him at those locations rather than binding his feet/hands and wrapping his face. Naming the body parts directly produces clearer, more natural prose.
  terminology: “Iberibe ákwà e ji eli ozu” preserves the plural burial strips (κειρίαις) and distinguishes them from the single face cloth (σουδαρίῳ), rendered non-specifically as “ákwà.” “Tọpụnụ” and “hapụnụ ya ka ọ laa” accurately convey the two imperatives.
  issues:
  - severity: medium
    issue: Ambiguous attachment of the burial bindings
    rationale: The draft says “e ji ákwà e ji eli ozu kee ya n’ụkwụ na n’aka,” whereas the Greek explicitly states that his feet and hands were bound. “kee ụkwụ ya na aka ya” makes this relation unambiguous.
  - severity: medium
    issue: Face-cloth clause does not directly identify the face as the wrapped item
    rationale: “e jikwa ákwà kechie ya n’ihu” can be read as wrapping him around/on his face. Greek has “his face was wrapped with a cloth”; “kechie ihu ya” is clearer and more idiomatic.
  revised_text: Nwoke ahụ nwụrụ anwụ wee pụta; e ji iberibe ákwà e ji eli ozu kee ụkwụ ya na aka ya, e jikwa ákwà kechie ihu ya. Jizọs sịrị ha, “Tọpụnụ ya, hapụnụ ya ka ọ laa.”
  revised_footnotes: []
  revision_rationale: The revision retains the draft’s faithful narrative rendering and its natural use of past tense for the Greek historical present, while explicitly attaching the burial strips to Lazarus’s feet and hands and the separate cloth to his face. It also reflects the plural κειρίαις without over-specifying the precise material or style of the σουδάριον.
