revisions:
- from: Jizọs sịrị, “Wepụnụ nkume ahụ.” Mata, nwanne nwanyị nwoke ahụ nwụrụ anwụ[a], sịrị ya, “Onyenwe anyị, ka ọ dị ugbu a, ọ na-esi ísì ọjọọ[b], n’ihi na ọ nwụọla ụbọchị anọ[c].”
  to: Jizọs sịrị, “Wepụnụ nkume ahụ.” Mata, nwanne nwanyị nke nwoke ahụ nwụrụ anwụ[a], sịrị ya, “Onyenwe anyị, ugbu a ọ na-esi ísì ọjọọ[b], n’ihi na ọ nọọla ụbọchị anọ kemgbe ọ nwụrụ[c].”
  rationale: The revision preserves the source’s wording and ambiguity while using more natural modern Standard Igbo. It clarifies the four-day state denoted by τεταρταῖος, streamlines the expression of ἤδη, improves the relationship construction, and revises the explanatory footnote without introducing doctrinal interpretation.
  reviewer_model: gpt-5.6-terra
