  text: λέγει ὁ Ἰησοῦς· Ἄρατε τὸν λίθον. λέγει αὐτῷ ἡ ἀδελφὴ τοῦ ⸀τετελευτηκότος Μάρθα· Κύριε, ἤδη ὄζει, τεταρταῖος γάρ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/039.yaml
  text: Jesus said[a], “Take away the stone.” Martha, the sister of the dead man, said to him, “Lord, by now he smells[c][b], for he has been dead four days.”
translation:
  language: ig
  text: Jizọs sịrị, “Wepụnụ nkume ahụ.” Mata, nwanne nwanyị nke nwoke ahụ nwụrụ anwụ[a], sịrị ya, “Onyenwe anyị, ugbu a ọ na-esi ísì ọjọọ[b], n’ihi na ọ nọọla ụbọchị anọ kemgbe ọ nwụrụ[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “onye ahụ nwụrụ.”
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsị, “o reela ísì”; ngwaa Grik ahụ pụtara “ịwepụta ísì.”
    reason: lexical_alternative
  - marker: c
    text: N’ụzọ nkịtị, “n’ihi na ọ bụ nke ụbọchị nke anọ,” ya bụ, ọ nọọla ụbọchị anọ kemgbe ọ nwụrụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄρατε
  choice: Wepụnụ
  rationale: Ngwaa a bụ iwu a na-enye ọtụtụ ndị ka ha wepụ nkume ahụ; “Wepụnụ” bụ okwu Igbo doro anya ma na-egosikwa ọtụtụ ndị a na-agwa okwu.
- source_word: τὸν λίθον
  choice: nkume ahụ
  rationale: N’ọnọdụ ili a, λίθος bụ nkume e ji mechie ọnụ ili; “nkume ahụ” bụ ntụgharị nkịtị ma doo anya.
- source_word: τοῦ τετελευτηκότος
  choice: nwoke ahụ nwụrụ anwụ
  rationale: Perfect participle a na-ekwu banyere onye nwụrụ ma ka nọ n’ọnọdụ ọnwụ. Okwu a bụ Igbo sitere n’ọnọdụ ahụ ma na-egosi na onye ahụ bụ nwoke.
- source_word: Κύριε
  choice: Onyenwe anyị
  rationale: Ọ na-echekwa ịdị arọ nke κύριος dị ka okwu nsọpụrụ Marta ji kpọọ Jizọs, n’emeghị ka ọ bụrụ naanị ekele nkịtị.
- source_word: ἤδη
  choice: ka ọ dị ugbu a
  rationale: Ọ na-egosi na ọnọdụ ahụ erutela ma dị ugbu a, nke bụ ike oge ἤδη nwere n’ebe a.
- source_word: ὄζει
  choice: ọ na-esi ísì ọjọọ
  rationale: Ngwaa ahụ pụtara iwepụta ísì; n’ọnọdụ onye nwụrụ anwụ, ísì ahụ bụ nke ọjọọ. Nhọrọ a na-edobe onye ahụ dị ka isiokwu ngwaa ahụ.
- source_word: τεταρταῖος
  choice: ọ nwụọla ụbọchị anọ
  rationale: Adjective ahụ pụtara na nke a bụ ụbọchị nke anọ kemgbe ọ nwụrụ. A gbasapụrụ ya ntakịrị ka ọ bụrụ Igbo doro anya ma dịkwa mma.
- source_word: γάρ
  choice: n’ihi na
  rationale: Ọ na-ewebata ihe mere Marta ji kwuo na o sila ísì, ya mere “n’ihi na” na-egosipụta njikọ ahụ nke ọma.
theological_decisions:
- issue: Ụzọ e si tụgharị κύριος n’okwu Marta gwara Jizọs
  choice: Onyenwe anyị
  alternative: Nna anyị ukwu
  rationale: “Onyenwe anyị” na-echekwa ịdị arọ okpukpe κύριος nwere ike ibu n’Oziọma Jọn, ma ọ naghị amanye ka amaokwu a naanị ya kwuo nkwupụta okwukwe zuru ezu.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. “Wepụnụ” na-egosipụta plural imperative nke Grik; ahịrịokwu Marta ka dị ka okwu mmadụ na-ekwu n’ọnọdụ ili, na-enweghị okwu siri ike ma ọ bụ nke otu ụka pụrụ iche.
