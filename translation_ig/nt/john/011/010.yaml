  rationale: 'No change is needed to the verse itself. The footnote is corrected for Standard Igbo grammar and naturalness, while retaining the crucial distinction: the Greek explicitly has “in him,” whereas the alternative construes the statement as lack of surrounding illumination. The alternative is presented as interpretive rather than as an equal literal rendering.'
