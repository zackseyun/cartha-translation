id: JHN.11.10
reference: John 11:10
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐὰν δέ τις περιπατῇ ἐν τῇ νυκτί, προσκόπτει, ὅτι τὸ φῶς οὐκ ἔστιν ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/010.yaml
  text: But if anyone walks in the night[a], he stumbles, because the light is not in him.
translation:
  language: ig
  text: Ma ọ bụrụ na onye ọ bụla ejegharị n'abalị, ọ na-asụ ngọngọ, n'ihi na ìhè ahụ adịghị n'ime ya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ìhè ahụ adịghị ya nso.” N'asụsụ Grik, okwu ahụ n'ụzọ nkịtị bụ, “ìhè ahụ adịghị n'ime ya,” nke nwere ike igosi ihe karịrị naanị enweghị ìhè dị n'èzí.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐὰν δέ
  choice: Ma ọ bụrụ na
  rationale: Na-egosipụta ma ọdịiche δέ nwere n'amaokwu bu ụzọ ma ọnọdụ ἐὰν na-ewebata, n'Igbo doro anya.
- source_word: τις
  choice: onye ọ bụla
  rationale: 'Na-echekwa nghọta izugbe nke nnọchiaha a: onye ọbụla metụtara ọnọdụ ahụ.'
- source_word: περιπατῇ
  choice: ejegharị
  rationale: Na-echekwa ihe oyiyi nkịtị nke ije, ma hapụkwa ohere maka nghọta ime mmụọ dị n'okwu Jọn.
- source_word: ἐν τῇ νυκτί
  choice: n'abalị
  rationale: Ọ bụ ụzọ Igbo eke si ekwu ije n'oge abalị; ọ naghị akọwa νύξ ozugbo dị ka ọchịchịrị ime mmụọ.
- source_word: προσκόπτει
  choice: ọ na-asụ ngọngọ
  rationale: Na-egosipụta ịsụ ngọngọ mgbe mmadụ na-eje ije, ma na-echekwa ike ihe oyiyi ahụ nwere n'ụzọ ihe atụ.
- source_word: ὅτι
  choice: n'ihi na
  rationale: Na-egosipụta ihe kpatara ịsụ ngọngọ ahụ n'ụzọ doro anya.
- source_word: τὸ φῶς
  choice: ìhè ahụ
  rationale: Mkpọaha ngosi ahụ na-egosipụta ìhè a kapịrị ọnụ a na-ekwu banyere ya n'okwu gbara amaokwu ahụ gburugburu.
- source_word: οὐκ ἔστιν ἐν αὐτῷ
  choice: adịghị n'ime ya
  rationale: Na-agbasochi ἐν, ‘n'ime,’ anya ma na-echekwa esemokwu dị n'etiti ihe oyiyi ìhè nkịtị na nghọta ime mmụọ nwere ike ịdị na ya.
theological_decisions:
- issue: Ihe ‘ìhè ahụ adịghị n'ime ya’ na-ezo aka na ya na ike okwu ahụ nwere
  choice: E debere okwu ime ahụ, ‘adịghị n'ime ya,’ n'amaokwu bụ isi.
  alternative: ‘Ìhè ahụ adịghịnyere ya,’ nke nwere ike ịbụ naanị enweghị ìhè mpụga.
  rationale: ἐν αὐτῷ pụtara n'ụzọ nkịtị ‘n'ime ya.’ Asụsụ ìhè na ọchịchịrị n'akwụkwọ Jọn nwekwara omimi ime mmụọ; ya mere nsụgharị ahụ ekwesịghị imechi okwu a n'otu nghọta naanị.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji ‘ejegharị’ na ‘asụ ngọngọ’ chekwaa ihe oyiyi ije ahụ, ebe ‘n'ime ya’ na-ahapụ nghọta nkịtị na nke ime mmụọ ka ha abụọ dị.
