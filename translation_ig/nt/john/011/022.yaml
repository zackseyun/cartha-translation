  yaml_path: translation/nt/john/011/022.yaml
  text: But even now I know that whatever you ask from God, God will give you.
translation:
  language: ig
  text: Ma ọbụna ugbu a[a], ama m na ihe ọ bụla ị rịọ Chineke[b], Chineke ga-enye gị ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “Ugbu a kwa.” Njikọ okwu Grik ahụ pụrụ ịpụta naanị “na/kwa,” ma n'ebe a ọ nwekwara ike igosi ntụgharị site n'ihe Mata kwuru banyere ọnwụ Lazarọs.
    reason: lexical_alternative
  - marker: b
    text: N'ụzọ nkịtị n'asụsụ Grik, “ihe ọ bụla ị rịọ Chineke.” Okwu Igbo “ịrịọ Chineke” na-edobe usoro a; ihe a na-arịọ bụ “ihe ọ bụla” e kwuru ná mmalite nkebiokwu ahụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ νῦν
  choice: Ma ọbụna ugbu a
  rationale: “Ma” na-egosipụta ntụgharị megidere ọnọdụ ọnwụ Lazarọs e kwuru okwu ya, ebe “ọbụna ugbu a” na-edobe ike oge dị na νῦν.
- source_word: οἶδα
  choice: ama m
  rationale: Ọ bụ ụzọ Igbo nkịtị na nke doro anya isi kwuo ihe onye maara ugbu a.
- source_word: ὅσα ἂν
  choice: ihe ọ bụla
  rationale: Ọ na-edobe echiche nke ihe a na-akọwaghị kpọmkwem na obosara nke okwu Grik ahụ.
- source_word: αἰτήσῃ τὸν θεὸν
  choice: ị ga-arịọ Chineke
  rationale: N'Igbo, a pụrụ iji “rịọ” tinye onye a na-arịọ ozugbo dịka ihe nnara ya; “ga-” na-eme ka njikọ ya na nkwa ọdịnihu nke ahịrịokwu a doo anya.
- source_word: δώσει σοι ὁ θεός
  choice: Chineke ga-enye gị ya
  rationale: “Ga-enye” na-egosipụta ọdịnihu nke δώσει. “Ya” na-ezoghachi n'ụzọ Igbo si adị ire ụtọ n'ihe ọ bụla a rịọrọ, na-enweghị ịgbakwunye ihe ọhụrụ n'ihe okwu ahụ pụtara.
theological_decisions:
- issue: Okwu Mata banyere Jizọs ịrịọ Chineke nwere ike ịbụ nke a ga-akọwa karịa ihe ederede kwuru banyere njirimara Jizọs.
  choice: 'E debere okwu Mata dịka ọ dị: Jizọs na-arịọ Chineke, Chineke wee nye ya.'
  alternative: Ịgbanwe “Chineke” ka ọ bụrụ “Nna” ma ọ bụ ịkọwakwu okwu ahụ iji mee ka echiche banyere mmekọrịta Jizọs na Chineke dị larịị.
  rationale: Amaokwu a na-akọ okwu Mata, ya mere ntụgharị kwesịrị idobe esemokwu na-aga n'ihu n'akụkọ Jọn n'ebughị ozizi ọzọ abanye na ya.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị nsọ ma dị mfe nghọta. A họọrọ “ama m” kama okwu siri ike ma ọ bụ nke ochie; usoro “ihe ọ bụla… Chineke ga-enye gị ya” na-ada nke ọma n'ọnụ onye Igbo ma na-edobe nhazi na ike okwu Grik.
