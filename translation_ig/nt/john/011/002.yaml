  text: ἦν δὲ ⸀Μαριὰμ ἡ ἀλείψασα τὸν κύριον μύρῳ καὶ ἐκμάξασα τοὺς πόδας αὐτοῦ ταῖς θριξὶν αὐτῆς, ἧς ὁ ἀδελφὸς Λάζαρος ἠσθένει.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/002.yaml
  text: It was Mary who had anointed the Lord with perfume and wiped his feet with her hair[a], whose brother Lazarus was sick.
translation:
  language: ig
  text: Ọ bụ Meri, onye ji mmanụ na-esi ísì ụtọ[a] tee Onyenwe anyị ma jiri ntutu isi ya hichaa ụkwụ ya. Lazarọs, nwanne ya nwoke, na-arịa ọrịa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ude na-esi ísì ụtọ.” Okwu Grik ahụ na-ezo aka na mmanụ ma ọ bụ ude e tinyere ihe na-esi ísì ụtọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν δὲ Μαριὰμ
  choice: Meri a bụ onye
  rationale: Nke a na-egosi na onye a na-akọwa bụ Meri, ma na-ejikọkwa amaokwu ahụ n'ụzọ Igbo dị mma n’etinyeghị okwu oge na-adịghị n’asụsụ Grik.
- source_word: ἡ ἀλείψασα
  choice: onye ji ... tee
  rationale: Nkebiokwu onye na ngwaa gara aga na-asụgharị participle aorist ahụ n’ụzọ Igbo doro anya, na-akọwa Meri site n’ihe o mere.
- source_word: τὸν κύριον
  choice: Onyenwe anyị
  rationale: Nke a bụ aha nsọpụrụ Igbo a na-ejikarị asụgharị κύριος mgbe ọ na-ezo aka na Jizọs; ọ na-echekwa ibu okwu ahụ n’akụkọ a.
- source_word: μύρῳ
  choice: mmanụ na-esi ísì ụtọ
  rationale: μύρον bụ mmanụ ma ọ bụ ude e tinyere ihe na-esi ísì ụtọ. Nhọrọ a bụ okwu Igbo nkịtị, doro anya, nke dabara n’omume ite mmadụ mmanụ.
- source_word: καὶ ἐκμάξασα τοὺς πόδας αὐτοῦ
  choice: jirikwa ... hichaa ụkwụ ya
  rationale: ἐκμάσσω pụtara ihicha ma ọ bụ ihichapụ. ‘Hichaa’ na-egosi omume ahụ nke ọma n’Igbo, ebe ‘-kwa’ na-echekwa njikọ καί.
- source_word: ταῖς θριξὶν αὐτῆς
  choice: ntutu isi ya
  rationale: Dative ahụ na-egosi ihe e ji mee omume ahụ; usoro ‘jiri ntutu isi ya’ bụ Igbo ebumpụta ụwa.
- source_word: ἧς ὁ ἀδελφὸς Λάζαρος ἠσθένει
  choice: Lazarọs ahụ na-arịa ọrịa bụ nwanne ya nwoke
  rationale: A haziri relative clause ahụ dịka ahịrịokwu Igbo dị mfe ma doo anya, na-echekwa mmekọrịta Meri na Lazarọs nakwa ọrịa ya.
theological_decisions:
- issue: Nsụgharị κύριος mgbe ọ na-ezo aka na Jizọs
  choice: Onyenwe anyị
  alternative: Onye nwe ya / Nna ukwu
  rationale: ‘Onyenwe anyị’ na-echekwa ma nsọpụrụ ma ibu mmụọ nke aha a n’Oziọma Jọn, kama ime ka ọ bụrụ naanị aha onyeisi mmadụ.
translation_notes:
  register: Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. E kewara usoro Grik ahụ ụzọ ahịrịokwu abụọ ka mmekọrịta dị n’etiti Meri na Lazarọs doo anya n’Igbo, n’agbanweghị ihe amaokwu ahụ kwuru.
