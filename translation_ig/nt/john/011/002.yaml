review_pass:
  verdict: revise
  source_fidelity: Isi nsụgharị ahụ na-ebuga omume abụọ Meri mere, aha Onyenwe anyị, na ezi mmekọrịta Lazarọs na Meri. Otú ọ dị, «Meri a» na «Lazarọs ahụ» na-agbakwụnye nrụtụ aka ngosipụta (‘a/ahụ’) nke Grik enweghị. «Ọ bụ Meri» ka ọ na-egosipụta nke ọma nrụpụta njirimara ἦν δὲ ... ἡ.
  naturalness: «Meri a bụ onye ...» adịghị ada n’ụzọ Igbo nke oge a nke ọma n’ọnọdụ a; «Ọ bụ Meri, onye ...» bụ usoro dị mma ma doo anya. Ịtọ Lazarọs n’ọrụ apposition dịka «Lazarọs, nwanne ya nwoke» na-ezere ngosipụta a na-etinyeghị n’isi okwu ma na-eme ka njikọ ahụ doo anya.
  terminology: «Onyenwe anyị» bụ nsụgharị a nabatara n’Igbo maka κύριος mgbe ọ na-ezo aka na Jizọs. «Mmanụ na-esi ísì ụtọ» na «ude na-esi ísì ụtọ» n’ala ala nkọwa na-echekwa obosara μύρον, nke nwere ike ịbụ mmanụ ma ọ bụ ude a gwakọtara ihe na-esi ísì ụtọ.
  issues:
  - severity: medium
    issue: Ngosipụta a na-etinyeghị n’isi okwu
    rationale: «Meri a» na «Lazarọs ahụ» na-egosi ‘this/that,’ ebe Grik na-eji naanị aha Meri na Lazarọs na nkebiokwu ikwu okwu. Ekwesịrị iwepụ ha ka a ghara itinye nkọwa ọhụrụ.
  - severity: medium
    issue: Usoro mmalite ahịrịokwu adịghị eke nke ọma
    rationale: «Meri a bụ onye ...» nwere ike ịda ka nkọwa gbasara ‘Meri a,’ karịa ịkọwa njirimara a na-ebute n’amaokwu ahụ. «Ọ bụ Meri, onye ...» na-atụgharị ἦν δὲ ... ἡ n’ụzọ Igbo ka eke.
