  text: ἠγάπα δὲ ὁ Ἰησοῦς τὴν Μάρθαν καὶ τὴν ἀδελφὴν αὐτῆς καὶ τὸν Λάζαρον.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/005.yaml
  text: Jesus loved Martha and her sister and Lazarus.
translation:
  language: ig
  text: Jizọs hụrụ Mata na nwanne ya nwanyị na Lazarọs n'anya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἠγάπα
  choice: hụrụ ... n'anya
  rationale: Nke a bụ ụzọ Igbo nkịtị na nke kwesịrị ekwesị si ekwu ἀγαπάω. Ọdịdị ngwaa imperfect ebe a na-egosi ịhụnanya Jizọs nke na-aga n'ihu; n'Igbo, ahịrịokwu a na-egosipụta ya nke ọma n'enweghị okwu na-adịghị eke.
- source_word: δὲ
  choice: (a hapụrụ ya n'asụsụ a sụgharịrị)
  rationale: δὲ bụ njikọ dị nro nke na-edu akụkọ. Ịgbakwunye “Ma” nwere ike ime ka esemokwu ya sie ike karịa nke Grik, ebe “Ugbu a” ga-adị ka ihe ngosi oge; usoro Igbo ebe a na-ahapụ njikọ ahụ ka ọnọdụ gbara ya gburugburu gosipụta ntụgharị akụkọ.
- source_word: ἀδελφὴν αὐτῆς
  choice: nwanne ya nwanyị
  rationale: Nke a na-egosi na ọ bụ nwanne nwanyị Mata ma ghara ịkpọ Meri aha, dịka ederede Grik si mee.
- source_word: Μάρθαν
  choice: Mata
  rationale: E dere aha onye a n'ụdị a maara nke ọma n'Igbo.
- source_word: Λάζαρον
  choice: Lazarọs
  rationale: E dere aha onye a n'ụdị a maara nke ọma n'Igbo.
- source_word: καὶ ... καὶ ... καὶ
  choice: na ... na ... na
  rationale: A nọgidere na-ejikọta mmadụ atọ ahụ n'ụzọ doro anya dịka nhazi Grik si dị, ọ bụ ezie na “na” nke mbụ jikọtara ngwaa ịhụnanya na ndị a hụrụ n'anya n'usoro Igbo.
theological_decisions:
- issue: Ike imperfect ἠγάπα n'ihe gbasara ịhụnanya Jizọs
  choice: Nkwupụta dị mfe banyere ịhụnanya Jizọs na-aga n'ihu n'ebe Mata, nwanne ya nwanyị, na Lazarọs nọ
  alternative: Ịmalite ịhụ ha n'anya, ma ọ bụ imesi omume na-aga n'ihu ike site n'okwu yiri “ọ nọ na-ahụ ha n'anya”
  rationale: Imperfect a na-egosikarị ọnọdụ na-aga n'ihu n'oge gara aga. Nsụgharị ahụ na-ekwupụta ịhụnanya Jizọs n'etinyeghị nkọwa ozizi ma ọ bụ mmetụta nke ederede ahụ n'onwe ya na-ekwughị.
translation_notes:
  register: Asụsụ Igbo Izugbe, dị mfe, dị ùgwù, ma bụrụ nke ndị na-agụ akwụkwọ taa ga-aghọta. Ejighị njikọ siri ike dochie δὲ, ejighịkwa aha Meri dochie okwu Grik bụ “nwanne ya nwanyị.”
