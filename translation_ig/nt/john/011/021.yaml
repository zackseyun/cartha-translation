  text: εἶπεν οὖν ⸀ἡ Μάρθα πρὸς ⸀τὸν Ἰησοῦν· Κύριε, εἰ ἦς ὧδε ⸂οὐκ ἂν ἀπέθανεν ὁ ἀδελφός μου⸃·
base_translation:
  language: en
  yaml_path: translation/nt/john/011/021.yaml
  text: So Martha said to Jesus[a], “Lord, if you had been here, my brother would not have died.”
translation:
  language: ig
  text: Ya mere Mata sịrị Jizọs, “Onyenweanyị[a], a sị na ị nọ ebe a, nwanne m nwoke agaraghị anwụ.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Nna ukwu”; okwu Grik bụ κύριε nwere ike ịbụ ụzọ nkwanye ùgwù e si akpọ mmadụ, ma “Onyenweanyị” na-echekwakwa ibu echiche gbasara onye Jizọs bụ nke okwu ahụ pụrụ inwe n’Oziọma Jọn.
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: Ya mere
  rationale: Ọ na-egosi njikọ na ihe akụkọ ahụ kwuru tupu nke a; “Ya mere” na-edobe ike njikọ ahụ n’Igbo nkịtị.
- source_word: εἶπεν
  choice: sịrị
  rationale: N’ọnọdụ okwu a, “sịrị” bụ ụzọ Igbo kacha dị mfe ma bụrụkwa nke ziri ezi isi kọwaa ngwaa okwu ahụ.
- source_word: πρὸς τὸν Ἰησοῦν
  choice: Jizọs
  rationale: Mgbe “sịrị” sochiri onye a na-agwa okwu, Igbo anaghị achọkarị itinye “nye”; usoro a na-egosi nke ọma na Jizọs bụ onye Mata gwara okwu.
- source_word: Κύριε
  choice: Onyenwe anyị
  rationale: Nke a bụ ntụgharị Igbo a na-ejikarị maka κύριος, ọ na-echekwa ma nkwanye ùgwù dị n’ọkpụkpọ ahụ ma ibu echiche gbasara onye Jizọs bụ nke okwu ahụ pụrụ inwe n’Oziọma Jọn.
- source_word: εἰ ἦς ὧδε
  choice: a sị na ị nọ ebe a
  rationale: Usoro “a sị na” na-egosi ọnọdụ megidere ihe mere n’oge gara aga, ebe “ị nọ ebe a” na-asụgharị ἦς ὧδε n’Igbo eke.
- source_word: οὐκ ἂν ἀπέθανεν
  choice: agaraghị anwụ
  rationale: Ụdị ngwaa a na-egosi ihe na-agaraghị eme n’ọnọdụ gara aga, kwekọrọ na οὐκ + ἄν + aorist indicative.
- source_word: ὁ ἀδελφός μου
  choice: nwanne m nwoke
  rationale: N’ebe a ἀδελφός bụ Lazarọs, nwanne Mata bụ nwoke; ịgbakwunye “nwoke” na-ewepụ mgbagwoju anya nke okwu Igbo “nwanne” nwere ike inwe.
theological_decisions:
- issue: Otú e si asụgharị κύριος mgbe Mata na-akpọ Jizọs
  choice: Onyenwe anyị
  alternative: Nna anyị ukwu; Nwe m
  rationale: “Onyenwe anyị” na-edobe nkwanye ùgwù dị n’okwu ahụ nakwa ihe ọ pụrụ ịpụta banyere Jizọs n’Oziọma Jọn, n’ebughị ụzọ kpebie na Mata ji ya kwupụta nghọta nkà mmụta okpukpe zuru ezu.
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe nke oge a, dị mfe nghọta ma nwee ugwu. E ji usoro ọnọdụ “a sị na … agaraghị …” chekwaa echiche nke ihe megidere eziokwu n’oge gara aga.
