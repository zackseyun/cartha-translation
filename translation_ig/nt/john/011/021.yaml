  terminology: The draft’s footnote alternative “Nna anyị ukwu” is not an appropriate equivalent for the respectful-address sense “Sir.” “Nna ukwu” is the suitable non-theological/respectful alternative. Moving the anchor to the title also makes the note’s referent unambiguous.
