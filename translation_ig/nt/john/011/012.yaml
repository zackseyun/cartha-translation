  naturalness: The wording is fluent Standard Igbo. 'Ọ dara n’ụra' and 'ahụ ga-adị ya mma' are natural expressions in the illness-and-sleep context. The footnote alternative 'ọ rahụla ụra' is also natural, but should not be introduced as a more literal rendering, since the main wording already closely represents the Greek perfect expression.
  terminology: '''Onyenwe anyị'' is an established respectful Christian Igbo address for κύριε and is retained. The recovery sense of σωθήσεται is appropriately represented without importing a soteriological meaning into the main text.'
