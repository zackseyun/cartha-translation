id: JHN.11.12
reference: John 11:12
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἶπαν οὖν οἱ μαθηταὶ ⸀αὐτῷ· Κύριε, εἰ κεκοίμηται σωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/012.yaml
  text: So the disciples said to him[a], “Lord, if he has fallen asleep[b], he will recover.”
translation:
  language: ig
  text: Ya mere, ndị na-eso ụzọ sịrị ya, “Onyenwe anyị, ọ bụrụ na ọ dara n’ụra[a], ahụ ga-adị ya mma[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “ọ rahụla ụra.” Jizọs ji ụra mee ihe atụ maka ọnwụ Lazarọs, ma ndị na-eso ụzọ chere na ọ na-ekwu banyere ụra nkịtị.
    reason: lexical_alternative
  - marker: b
    text: 'A pụkwara ịsụ ngwaa Grik a, “a ga-azọpụta ya.” Ma n’ebe a, ọ na-ekwu maka ịgbake n’ọrịa: “ahụ ga-adị ya mma” ma ọ bụ “ọ ga-agbake.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Ya mere
  rationale: Na-egosi nkwubi okwu ndị na-eso ụzọ wepụtara n’okwu Jizọs kwuru tupu nke a, ma bụrụkwa okwu Igbo doro anya ma dị mfe.
- source_word: οἱ μαθηταὶ
  choice: ndị na-eso ụzọ ya
  rationale: Ọ bụ ezie na Grik nwere naanị aha ahụ na njirimara ya, itinye ‘ya’ na-eme ka onye a na-ekwu banyere ya doo anya n’Igbo n’enweghị mgbanwe n’ihe okwu ahụ pụtara.
- source_word: αὐτῷ
  choice: sịrị ya
  rationale: Aha nnọchi a na-ezo aka na Jizọs; Igbo na-egosipụta ya n’ụzọ ebumpụta ụwa site n’okwu ‘sịrị ya.’
- source_word: Κύριε
  choice: Onyenwe anyị
  rationale: Nke a bụ ụzọ Igbo a na-ejikarị asụ κύριος mgbe a na-akpọ Jizọs; ọ na-echekwa ma nkwanye ùgwù ahụ ma ịdị omimi nke aha ahụ.
- source_word: εἰ
  choice: ọ bụrụ na
  rationale: Na-echekwa ọnọdụ a na-atụ anya ya kpọmkwem, kama ịgbanwe ya ka ọ bụrụ ihe e ji n’aka.
- source_word: κεκοίμηται
  choice: ọ dara n’ụra
  rationale: Na-egosi ụra nkịtị dị ka ndị na-eso ụzọ ghọtara ya, ma okwu ahụ ka nwekwara ike ịbụ ihe atụ maka ọnwụ n’okwu gbara ya gburugburu.
- source_word: σωθήσεται
  choice: ahụ ga-adị ya mma
  rationale: N’ọnọdụ ọrịa a, σῴζω pụtara ịgbake ma ọ bụ ịlọghachi n’ahụ ike; okwu Igbo a bụ nke nkịtị ma ghara ibubata echiche nzọpụta ime mmụọ n’ebe a.
theological_decisions:
- issue: Nsụgharị κύριος mgbe ndị na-eso ụzọ na-akpọ Jizọs
  choice: Onyenwe anyị
  alternative: Nna anyị ukwu
  rationale: ‘Onyenwe anyị’ na-echekwa nkwanye ùgwù e ji akpọ Jizọs na ohere nke nghọta miri emi banyere onye ọ bụ, n’ebughị ụzọ kpebie ókè ndị na-eso ụzọ ghọtara ya n’oge ahụ.
- issue: Ma a ga-echekwa nghọta abụọ dị na κεκοίμηται
  choice: Jiri okwu ụra nkịtị n’ahịrịokwu bụ isi
  alternative: ọ gara izu ike
  rationale: Isi ihe n’akụkọ a bụ na Jizọs ji ụra tụnyere ọnwụ Lazarọs, ma ndị na-eso ụzọ ghọtara ya dị ka ụra nkịtị. Nsụgharị a na-echekwa nghọtahie ahụ, ebe nkọwa ala peeji na-akọwa nghọta nke ọzọ.
- issue: Ma σωθήσεται ọ pụtara nzọpụta ka ọ bụ mgbake
  choice: ahụ ga-adị ya mma
  alternative: a ga-azọpụta ya
  rationale: Ọnọdụ ahụ bụ mkparịta ụka banyere ọrịa na ụra; ya mere mgbake n’ahụ ike bụ nghọta kacha kwekọọ n’ebe a, ma nkọwa ala peeji na-echekwa obosara okwu Grik ahụ.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị mfe ma dị ùgwù. ‘Onyenwe anyị’ bụ okwu ụka a maara nke ọma ma na-echekwa ịdị omimi nke Κύριε. E tinyere akara nkọwa [a] na [b] kpọmkwem n’ebe okwu ndị metụtara ha dị n’ahịrịokwu.
