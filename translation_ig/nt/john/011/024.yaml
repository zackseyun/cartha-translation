  terminology: '“Mata,” “mbilite n’ọnwụ,” and “ụbọchị ikpeazụ” are established, appropriate Igbo biblical terms. The existing footnote, however, is not a natural alternative rendering: “mgbe mbilite n’ọnwụ ga-adị” introduces an unnecessary assertion that the resurrection ‘will occur/be’ and does not cleanly represent the syntactic alternative.'
  issues:
