  variant: Standard Igbo
source:
  edition: SBLGNT
  text: λέγει αὐτῷ ⸀ἡ Μάρθα· Οἶδα ὅτι ἀναστήσεται ἐν τῇ ἀναστάσει ἐν τῇ ἐσχάτῃ ἡμέρᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/024.yaml
  text: Martha said to him[a], “I know that he will rise again in the resurrection on the last day.”
translation:
  language: ig
  text: Mata sịrị ya, “Ama m na ọ ga-ebili ọzọ n’oge mbilite n’ọnwụ n’ụbọchị ikpeazụ.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: sịrị
  rationale: Ọ bụ ezie na Grik ji historical present, ụdị akụkọ Igbo na-eji oge gara aga n'ụzọ ebumpụta ụwa mgbe a na-akọ mkparịta ụka.
- source_word: αὐτῷ
  choice: ya
  rationale: Nnochiaha dative a na-egosi onye Mata gwara okwu; ‘ya’ bụ ntụgharị Igbo dị nkenke ma doo anya n’ebe a.
- source_word: ἡ Μάρθα
  choice: Mata
  rationale: E dere aha onye ahụ dịka ọdịnala nsụgharị Baịbụl Igbo si ede Martha.
- source_word: Οἶδα
  choice: Ama m
  rationale: Nke a na-egosi na Mata maara ma kwenyesie ike; ‘Ama m’ na-ekwupụta ya ozugbo n’Igbo nkịtị.
- source_word: ἀναστήσεται
  choice: ọ ga-ebili ọzọ
  rationale: N’ọnọdụ a, ngwaa ahụ na-ekwu maka isi n’ọnwụ bilie; ‘ebili ọzọ’ na-echekwa ọdịdị ngwaa Grik ma na-ada nke ọma n’Igbo.
- source_word: ἐν τῇ ἀναστάσει
  choice: n’oge mbilite n’ọnwụ
  rationale: ἐν nwere ike igosi oge ma ọ bụ ọnọdụ. ‘N’oge’ na-eme ka okwu ahụ bụrụ Igbo doro anya, ebe ‘mbilite n’ọnwụ’ na-echekwa aha ἀνάστασις.
- source_word: ἐν τῇ ἐσχάτῃ ἡμέρᾳ
  choice: n’ụbọchị ikpeazụ
  rationale: Nke a bụ ụzọ Igbo dị nkenke ma kwekọọ n’okwu oge nke Grik.
- source_word: ἐσχάτῃ
  choice: ikpeazụ
  rationale: ‘Ikpeazụ’ bụ okwu Igbo nkịtị nke na-echekwa ntụaka banyere ụbọchị ikpeazụ n’enweghị nkọwa agbakwunyere.
theological_decisions:
- issue: Ntụaka banyere mbilite n’ọnwụ n’ọgwụgwụ oge
  choice: E chekwara okwu Mata dịka olileanya maka mbilite n’ọnwụ ga-eme n’ụbọchị ikpeazụ.
  alternative: Ịsụgharị ya naanị dịka olileanya izugbe banyere ịdị ndụ mgbe mmadụ nwụsịrị.
  rationale: ἀναστήσεται, ἀνάστασις, na ‘ụbọchị ikpeazụ’ jikọtara ọnụ na-arụtụ aka kpọmkwem n’mbilite n’ọnwụ nke ọdịnihu, ma amaokwu ahụ akọwaghị nkọwa ozizi ndị ọzọ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ ‘mbilite n’ọnwụ’ n’ihi na ọ bụ okwu a maara nke ọma ma na-ekwupụta resurrection n’ụzọ ziri ezi.
