id: JHN.11.13
reference: John 11:13
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἰρήκει δὲ ὁ Ἰησοῦς περὶ τοῦ θανάτου αὐτοῦ. ἐκεῖνοι δὲ ἔδοξαν ὅτι περὶ τῆς κοιμήσεως τοῦ ὕπνου λέγει.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/013.yaml
  text: Jesus had spoken about his death[a], but they thought that he was speaking about the sleep of rest.
translation:
  language: ig
  text: Jizọs ekwuola banyere ọnwụ ya, ma ha chere na ọ na-ekwu banyere ụra nkịtị[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’ụzọ okwu Grik si dị kpọmkwem, “ụra nke ụra”; ya bụ, ụra nkịtị n’ezie, ọ bụghị ọnwụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰρήκει
  choice: ekwuworị
  rationale: Okwu a dị n’ụdị pluperfect, na-egosi na Jizọs kwuru ya tupu nghọtahie ndị na-eso ụzọ ya. N’ahịrịokwu a, “ekwuworị” na-egosipụta oge ahụ n’Igbo n'ụzọ doro anya.
- source_word: δὲ … δὲ
  choice: — … ma
  rationale: δὲ nke mbụ bụ njikọ dị nro nke a na-ekwesịghị ịgbakwunye “ugbu a” maka ya; nke abụọ na-egosi ọdịiche, ya mere “ma” dabara adaba.
- source_word: περὶ τοῦ θανάτου αὐτοῦ
  choice: banyere ọnwụ ya
  rationale: Nke a na-asụgharị περί na genitive dịka “banyere,” ma na-ahapụ αὐτοῦ dịka nnọchiaha “ya,” dị ka isi mmalite si mee.
- source_word: ἐκεῖνοι
  choice: ha
  rationale: Ọ na-ezo aka n’ebe ndị na-eso ụzọ ahụ nọ; “ha” bụ okwu Igbo nkịtị ma doo anya n’ọnọdụ a.
- source_word: ἔδοξαν
  choice: ha chere
  rationale: δοκέω ebe a na-egosi echiche ha hiere ụzọ; “chere” na-enye nghọta ahụ n’Igbo dị ugbu a.
- source_word: κοιμήσεως τοῦ ὕπνου
  choice: ụra nkịtị
  rationale: Nchịkọta mkpụrụokwu a na-akọwa ụra n’ezie, ọ bụghị ọnwụ e ji ụra mee ihe atụ. “Ụra nkịtị” na-eme ka nghọtahie ndị na-eso ụzọ doo anya, ebe nkọwa ala peeji na-echekwa ọdịdị okwu Grik ahụ.
- source_word: λέγει
  choice: ọ na-ekwu
  rationale: Ọ bụ present tense e ji kọọ ihe gara aga; “ọ na-ekwu” na-adaba nke ọma mgbe “ha chere na” gasịrị ma na-echekwa ọdịdị okwu ahụ.
theological_decisions:
- issue: Ma okwu ‘ụra’ a ga-akọwa ozizi banyere ọnọdụ ndị nwụrụ anwụ
  choice: Kpọọ ihe Jizọs bu n’obi ‘ọnwụ,’ ma kọwaa nghọta ndị na-eso ụzọ dịka ụra nkịtị.
  alternative: Ịsụgharị ya n’ụzọ ga-egosi ozizi pụrụ iche banyere ọnọdụ mkpụrụ obi mgbe mmadụ nwụrụ.
  rationale: Amaokwu ahụ na-akọwa ọdịiche dị n’etiti ojiji Jizọs ji ụra mee ihe atụ maka ọnwụ na nghọta ndị na-eso ụzọ chere na ọ bụ ụra nkịtị. E kwesịghị ịgbakwunye ozizi na-adịghị n’ederede.
- issue: Onye nnọchiaha αὐτοῦ (‘ya’) na-ezo aka na ya
  choice: Debe ya dịka ‘ya,’ dịka isi mmalite si kwuo, ebe ọnọdụ gbara ya gburugburu na-egosi Lazarọs.
  alternative: Kọwaa ya n’ahịrịokwu dịka ‘ọnwụ Lazarọs.’
  rationale: Ide “ya” na-echekwa ụdị na obere ohere nnọchiaha nke Grik, na-enweghị ime ka onye ahụ bụrụ Jizọs site n’ịgbakwunye nkọwa ozizi.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, dị mfe ma nwee ugwu. A zere “ugbu a” n’isi amaokwu n’ihi na isi mmalite enweghị mkpụrụokwu oge kwekọrọ na ya. “Ụra nkịtị” bụ ntụgharị kwụ ọtọ n’echiche, ebe nkọwa ala peeji na-echekwa usoro mkpụrụokwu Grik pụrụ iche.
