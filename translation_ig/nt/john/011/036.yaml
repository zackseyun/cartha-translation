  text: ἔλεγον οὖν οἱ Ἰουδαῖοι· Ἴδε πῶς ἐφίλει αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/036.yaml
  text: So the Jews were saying[a], “See how he loved him!”
translation:
  language: ig
  text: Ya mere, ndị Juu nọ na-asị[a], “Lee otú ọ hụrụ ya n’anya!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị Judia,” ma ọ bụrụ na a ghọta ya dị ka okwu na-ezo kpọmkwem karị n’ebe ndị Juu si, bú ndị nọ ebe ahụ na-ekiri ihe na-eme.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔλεγον
  choice: nọ na-asị
  rationale: Oge imperfect na-egosi okwu ha nọgidere ma ọ bụ ugboro ugboro na-ekwu; “nọ na-asị” na-egosipụta akụkụ a nke ọma.
- source_word: οὖν
  choice: Ya mere
  rationale: Na-ejikọta okwu a na akwa Jizọs bere n’amaokwu bu ụzọ, ma na-egosi ihe ndị hụrụ ya kpebiri site na ya.
- source_word: οἱ Ἰουδαῖοι
  choice: ndị Juu
  rationale: Nke a bụ nsụgharị kwụ ọtọ nke okwu Grik; n’ebe a, ọ na-ezo aka n’ebe ndị Juu bịara iru uju nọ, ọ bụghị ndị Juu niile.
- source_word: Ἴδε
  choice: Lee
  rationale: Ọ bụ iwu a na-eji adọta uche mmadụ; “Lee” bụ okwu Igbo dabara adaba n’okwu ọnụ.
- source_word: πῶς
  choice: otú
  rationale: “Otú” na-echekwa ohere okwu ahụ nwere igosi ma ụzọ e si hụ ya n’anya ma ọ bụ ịdị ukwuu nke ịhụnanya ahụ.
- source_word: ἐφίλει
  choice: hụrụ ... n’anya
  rationale: φιλέω n’ebe a na-egosi ịhụnanya na mmetụta ịhụnanya onwe onye; nkebi a bụ ụzọ Igbo ebumpụta ụwa si kwuo ya.
- source_word: αὐτόν
  choice: ya
  rationale: Nnọchiaha a na-ezo aka na Lazarọs.
theological_decisions:
- issue: Nsụgharị οἱ Ἰουδαῖοι n’Oziọma Jọn
  choice: ndị Juu
  alternative: ndị Judia
  rationale: Isiokwu ahụ jiri okwu nkịtị Grik maka “ndị Juu.” N’ọnọdụ a, ndị a bụ ndị Juu nọ ebe ahụ na-eru uju; ihe a ekwesịghị ịghọta dị ka ikpe megide agbụrụ ndị Juu niile. E debere “ndị Juu” n’ahịrị isi maka izi ezi, ebe e nyere nhọrọ mpaghara n’ala ala peeji.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. “Nọ na-asị” na-echekwa imperfect Grik; okwu e hotara na-ada ka okwu ọnụ nkịtị.
