revisions:
- from: Mgbe o kwuchara nke a, ọ pụrụ gaa kpọọ Meri, nwanne ya nwanyị, na nzuzo[a], sị ya, “Onye Ozizi[b] nọ ebe a, ọ na-akpọkwa gị[c].”
  to: Mgbe o kwuchara nke a, ọ gara kpọọ Meri, bụ nwanne ya nwanyị, na nzuzo[a], sị ya, “Onye Ozizi[b] nọ ebe a; ọ na-akpọ gị[c].”
  rationale: The revision replaces the modal-sounding «pụrụ» with the completed narrative verb «gara», removes the unsupported additive «-kwa», and clarifies the privacy footnote so it does not assert that the sisters were physically alone. It retains the Greek narrative sequence, the discreet manner of speech, «Onye Ozizi» for διδάσκαλος, and the present-tense sense of φωνεῖ.
