review_pass:
  verdict: revise
  source_fidelity: The draft conveys the sequence, private summons, title, presence, and present-tense call well. However, «ọ pụrụ gaa» normally suggests ability ('she could go') rather than actual departure, and «-kwa» in «ọ na-akpọkwa gị» adds 'also/again,' which is absent from the Greek.
  naturalness: «Ọ gara kpọọ Meri, bụ nwanne ya nwanyị, na nzuzo» is clear, idiomatic Standard Igbo and avoids a potentially ability-based reading. «Ọ na-akpọ gị» is natural direct speech.
  terminology: «Onye Ozizi» is an accurate and suitably respectful rendering of Ὁ διδάσκαλος. «na nzuzo» appropriately communicates a private, out-of-hearing communication without assigning a motive.
  issues:
  - severity: medium
    issue: «ọ pụrụ gaa» does not plainly render the completed departure.
    rationale: The Greek ἀπῆλθεν is an aorist narrative verb, 'she went away/departed.' In Standard Igbo, «pụrụ» commonly carries a modal sense ('was able to/could'), so «ọ gara» is safer.
  - severity: medium
    issue: «ọ na-akpọkwa gị» introduces «-kwa».
    rationale: «-kwa» means 'also' or sometimes 'again'; neither sense is represented by φωνεῖ σε. «Ọ na-akpọ gị» preserves the present call without addition.
  - severity: low
    issue: Footnote a's alternative «n’ebe naanị ha nọ» can imply that Martha and Mary were physically alone.
    rationale: λάθρᾳ specifies that the speech was private or not publicly heard; it does not require that no one else was nearby. The alternative should describe manner of speaking rather than physical isolation.
  revised_text: Mgbe o kwuchara nke a, ọ gara kpọọ Meri, bụ nwanne ya nwanyị, na nzuzo[a], sị ya, “Onye Ozizi[b] nọ ebe a; ọ na-akpọ gị[c].”
