  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Καὶ ⸀τοῦτο εἰποῦσα ἀπῆλθεν καὶ ἐφώνησεν ⸀Μαριὰμ τὴν ἀδελφὴν αὐτῆς λάθρᾳ εἰποῦσα· Ὁ διδάσκαλος πάρεστιν καὶ φωνεῖ σε.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/028.yaml
  text: And after saying this[a], she went away and called Mary her sister privately, saying[c][b], “The Teacher is here and is calling for you.”
translation:
  language: ig
  text: Mgbe o kwuchara nke a, ọ gara kpọọ Meri, bụ nwanne ya nwanyị, na nzuzo[a], sị ya, “Onye Ozizi[b] nọ ebe a; ọ na-akpọ gị[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “na nzuzo” ma ọ bụ “n’ụzọ ndị ọzọ na-anụghị.” Okwu Grik ahụ na-egosi na ọ gwara ya na-enweghị ka ndị ọzọ nụ.
    reason: lexical_alternative
  - marker: b
    text: 'A pụkwara ịsụgharị ya, “Nna Ukwu.” N’asụsụ Grik: “Onye Ozizi.”'
    reason: lexical_alternative
  - marker: c
    text: A pụkwara ịsụgharị ya, “ọ kpọrọ gị” ma ọ bụ “ọ na-achọ ka ị bịa.” Oge ugbu a nke ngwaa Grik bụ “ọ na-akpọ gị”; n’ebe a, o yiri ka ihe ọ pụtara bụ na ọ na-akpọ Meri ka ọ bịa.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο εἰποῦσα
  choice: Mgbe o kwuchara nke a
  rationale: A sụgharịrị aorist participle ahụ dị ka nkebi oge n’Igbo, iji gosi na ọ buru ụzọ kwuo ihe ahụ tupu ọ pụọ.
- source_word: ἀπῆλθεν
  choice: ọ pụrụ gaa
  rationale: Nke a na-egosi na ọ hapụrụ ebe ọ nọ, ma ọ bụkwa ụzọ e si ekwu ya n’Igbo nkịtị.
- source_word: ἐφώνησεν Μαριὰμ
  choice: kpọọ Meri
  rationale: φωνέω n’ebe a pụtara ịkpọ mmadụ ka ọ bịa, ọ bụghị naanị iti mkpu kpọpụta aha ya.
- source_word: τὴν ἀδελφὴν αὐτῆς
  choice: nwanne ya nwanyị
  rationale: Nke a na-akọwa Meri dị ka nwanne nwanyị nke onye ahụ kwuru okwu.
- source_word: λάθρᾳ
  choice: na nzuzo
  rationale: Ọ na-egosi na ọ kpọrọ ya n’ụzọ ndị ọzọ na-anụghị; ihe odide ahụ ekwughị ihe kpatara ya.
- source_word: εἰποῦσα
  choice: sị ya
  rationale: Nke a bụ ụzọ Igbo dị ire ụtọ isi webata okwu Martha gwara Meri kpọmkwem.
- source_word: Ὁ διδάσκαλος
  choice: Onye Ozizi
  rationale: διδάσκαλος pụtara onye na-akụzi ihe; aha nsọpụrụ a anaghị agbakwụnye echiche ọzọ na-adịghị n’okwu Grik.
- source_word: πάρεστιν
  choice: nọ ebe a
  rationale: Nke a na-egosipụta echiche nke ịnọ ya ugbu a n’ebe ahụ n’ụzọ Igbo doro anya.
- source_word: φωνεῖ σε
  choice: ọ na-akpọkwa gị
  rationale: Oge ugbu a nke ngwaa Grik na-egosi ịkpọ ya ugbu a; n’ọnọdụ a, ọ pụtara na ọ chọrọ ka Meri bịa.
theological_decisions:
- issue: Aha nsọpụrụ διδάσκαλος e ji kpọọ Jizọs
  choice: Onye Ozizi
  alternative: Nna Ukwu
  rationale: “Onye Ozizi” na-echekwa isi okwu Grik kpọmkwem, ebe “Nna Ukwu” nwere ike itinye echiche banyere ọchịchị ma ọ bụ ọnọdụ nke okwu a n’onwe ya ekwughị.
- issue: Ihe λάθρᾳ pụtara
  choice: na nzuzo
  alternative: n’ebe naanị ha nọ / iche
  rationale: Nhọrọ a na-egosi na a kpọrọ Meri n’ụzọ ndị ọzọ na-anụghị, ma a naghị ekwu na e nwere aghụghọ ma ọ bụ egwu kpatara ya.
- issue: Ike nke φωνεῖ σε
  choice: ọ na-akpọkwa gị
  alternative: ọ chọrọ ka ị bịa
  rationale: A hapụrụ okwu ahụ n’ụdị “ịkpọ” iji debe okwu Grik, ebe ihe ọ pụtara n’ọnọdụ a—ịchọ ka Meri bịa—kọwara na ndetu ala peeji kama itinye ya n’ahịrị.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta, dee ya. A hapụrụ usoro akụkọ ahụ ka ọ na-aga were were, ma debe ọdịiche dị n’etiti “Onye Ozizi” na aha ndị nwere ike ibubata nkọwa banyere ọchịchị. Akara ndetu [a], [b], na [c] dị n’ebe okwu ndị ha na-akọwa nọ.
