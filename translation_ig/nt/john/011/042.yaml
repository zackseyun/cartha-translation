  text: ἐγὼ δὲ ᾔδειν ὅτι πάντοτέ μου ἀκούεις· ἀλλὰ διὰ τὸν ὄχλον τὸν περιεστῶτα εἶπον, ἵνα πιστεύσωσιν ὅτι σύ με ἀπέστειλας.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/042.yaml
  text: But I knew that you always hear me[a]. Yet I said this because of the crowd standing around[b], so that they may believe that you sent me.
translation:
  language: ig
  text: Ma amaara m na ị na-anụ m mgbe niile; ma ọ bụ n’ihi igwe mmadụ ahụ guzo gburugburu ka m kwuru nke a, ka ha wee kwere na ọ bụ gị zitere m.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'N’asụsụ Grik, e tinyere nkwusi ike n’okwu “gị”: “na ọ bụ gị zitere m.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾔδειν
  choice: ama m
  rationale: Οἶδα dị n’ụdị gara aga n’asụsụ Grik, ma n’Igbo okwu “ama m” na-ekwupụta ihe Jizọs maara n’oge o kwuru okwu ahụ n’ụzọ eke; ịsị “amarala m” nwere ike ime ka ọ dị ka ihe ọ maara naanị n’oge gara aga.
- source_word: πάντοτέ μου ἀκούεις
  choice: ị na-anụ olu m mgbe niile
  rationale: “Mgbe niile” na-edobe πάντοτε, ebe “ị na-anụ olu m” na-egosi ịnụ ekpere ya n’ụzọ dị mfe ma ghara ịgbakwụnye nkọwa banyere otú e si aza ya.
- source_word: ἀλλὰ διὰ τὸν ὄχλον
  choice: Ma ... n’ihi igwe mmadụ
  rationale: “Ma” na-edobe ntụgharị echiche nke ἀλλά. Διά na accusative na-egosi ihe kpatara o ji kwuo ya; “n’ihi” bụ okwu Igbo doro anya ma kwekwa ka nkebi ebumnuche so ya kọwaa uru ọ bara nye igwe mmadụ ahụ.
- source_word: τὸν περιεστῶτα
  choice: ndị guzo gburugburu ebe a
  rationale: Nke a na-edobe ọnọdụ igwe mmadụ ahụ guzo Jizọs gburugburu; “ebe a” na-eme ka okwu ahụ daa nke ọma n’Igbo n’enweghị ịgbakwunye na ha gbara ya gburugburu kpọmkwem.
- source_word: εἶπον
  choice: ekwuru m nke a
  rationale: Aorist nke λέγω na-ezo aka n’okwu ekpere ọ ka kwuru. “Nke a” bụ mmeju dị nta nke na-eme ka ihe ọ na-ezo aka na ya doo anya n’Igbo.
- source_word: ἵνα πιστεύσωσιν
  choice: ka ha wee kwere
  rationale: “Ka ... wee” na-egosipụta ebumnuche nke ἵνα na subjunctive n’ụzọ Igbo nke oge a.
- source_word: ὅτι σύ με ἀπέστειλας
  choice: na ọ bụ gị zitere m
  rationale: Usoro “ọ bụ gị” na-edobe nkwusi ike nke nnọchiaha Grik σύ, ebe “zitere m” na-edobe aorist na isiokwu ozi Jizọs.
theological_decisions:
- issue: Ihe okwu Jizọs banyere Nna ịnụ olu ya pụtara
  choice: E kwuru na Nna na-anụ olu Jizọs mgbe niile, nakwa na Jizọs kwuru ekpere ahụ n’olu maka ndị nọ ya gburugburu.
  alternative: A pụrụ ịghọta ya dịka nkwupụta gbasara ịza ekpere n’ozuzu, kama mmekọrịta pụrụ iche dị n’etiti Nna na Ọkpara.
  rationale: Nsụgharị ahụ na-edobe nkwupụta nke amaokwu ahụ na ebumnuche o kwuru kpọmkwem, ma ọ naghị akọwapụta ụzọ Nna si “anụ” ya ma ọ bụ tinye usoro ozizi ọzọ n’ime ya.
- issue: Ebumnuche ekpere a Jizọs kwuru n’ihu ọha
  choice: O kwuru ya ka igwe mmadụ ahụ kwere na Nna zitere ya.
  alternative: A pụrụ ime ka ebumnuche ya bụrụ naanị iji kwado ọrụ ebube a kpọmkwem.
  rationale: Nkebi ἵνα na-ekwu kpọmkwem banyere ikwere na Nna zitere Jizọs; nsụgharị ahụ anaghị eme ka ihe ahụ dị warara ma ọ bụ gbasaa karịa ihe Grik kwuru.
translation_notes:
  register: Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. E ji “igwe mmadụ” maka ὄχλος, “anụ olu m” maka ịnụ ekpere, na usoro “ọ bụ gị” iji gosipụta nkwusi ike nke σύ. Akara ndetu ala peeji [a] dị n’isi ederede.
