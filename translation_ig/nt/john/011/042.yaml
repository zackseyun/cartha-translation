revisions:
- from: Ma ama m na ị na-anụ olu m mgbe niile. Ma ekwuru m nke a n’ihi igwe mmadụ ndị guzo gburugburu ebe a, ka ha wee kwere na ọ bụ gị zitere m.[a]
  to: Ma amaara m na ị na-anụ m mgbe niile; ma ọ bụ n’ihi igwe mmadụ ahụ guzo gburugburu ka m kwuru nke a, ka ha wee kwere na ọ bụ gị zitere m.[a]
  rationale: The revision restores the past reference of ᾔδειν, removes source-unspecified additions (“voice,” “here”), and retains both the purpose clause and the emphasis on the Father as the one who sent Jesus. The footnote remains correctly anchored to the emphatic wording.
