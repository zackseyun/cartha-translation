  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἡ οὖν Μάρθα ὡς ἤκουσεν ὅτι Ἰησοῦς ἔρχεται ὑπήντησεν αὐτῷ· ⸀Μαρία δὲ ἐν τῷ οἴκῳ ἐκαθέζετο.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/020.yaml
  text: So when Martha heard that Jesus was coming[a], she went to meet him; but Mary was sitting in the house.
translation:
  language: ig
  text: Ya mere, mgbe Mata nụrụ na Jizọs na-abịa[a], ọ gara izute ya; ma Meri nọ ọdụ n’ụlọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’asụsụ Grik, ngwaa ahụ dị n’oge ugbu a n’okwu a kọrọ. A pụrụ ịtụgharị ya n’ụzọ kpọmkwem dịka, “Jizọs na-abịa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Ya mere
  rationale: Ọ na-ejikọta ihe a na akụkọ bu ya ụzọ ma na-egosi ihe si na ya pụta; ‘Ya mere’ bụ okwu Igbo doro anya ma kwekọọ n’ụzọ akụkọ si aga.
- source_word: ὡς
  choice: mgbe
  rationale: N’ebe a, ọ na-ewebata nkebiokwu oge. ‘Mgbe’ bụ ntụgharị Igbo dị mfe ma ghara ịgbakwunye echiche nke na ihe ahụ mere ozugbo.
- source_word: ἤκουσεν
  choice: nụrụ
  rationale: Ọ na-egosipụta kpọmkwem na Mata nụrụ ozi ahụ, n’enweghị ịgbasa ya ka ọ bụrụ naanị ‘ọ matara.’
- source_word: ἔρχεται
  choice: na-abịa
  rationale: Oge ugbu a nke Grik na-egosi omume na-aga n’ihu ma nwee ike ịdị ndụ n’okwu a kọrọ; ‘na-abịa’ na-echekwa nke a nke ọma n’Igbo.
- source_word: ὑπήντησεν
  choice: gara izute
  rationale: Ọ na-echekwa echiche mmegharị nke ịga izute mmadụ, kama nanị ikwu na ọ zutere ya.
- source_word: δὲ
  choice: ma
  rationale: Ọ na-egosi ọdịiche dị n’etiti ihe Mata mere na ọnọdụ Meri.
- source_word: ἐν τῷ οἴκῳ
  choice: n’ụlọ
  rationale: Nke a bụ ntụgharị eke na nke kpọmkwem nke ebe Meri nọ.
- source_word: ἐκαθέζετο
  choice: nọ ọdụ
  rationale: Ọ na-egosi ọnọdụ gara n’ihu n’oge gara aga, n’etinyeghị echiche ọzọ na Meri kpachara anya nọgide ebe ahụ.
- source_word: Μάρθα / Μαρία / Ἰησοῦς
  choice: Mata / Meri / Jizọs
  rationale: A sụgharịrị aha ndị a dịka usoro mkpụrụokwu aha Baịbụl a na-ejikarị eme ihe n’Igbo Ọkọlọtọ.
theological_decisions: []
translation_notes:
  register: Igbo Ọkọlọtọ nke oge a, dị mfe nghọta ma nwee ugwu. E chekwara ọdịiche dị n’etiti Mata gara izute Jizọs na Meri nọ ọdụ n’ụlọ; e tinyeghị echiche na Meri ‘nọgidere’ ebe ahụ karịa ihe Grik kwuru.
