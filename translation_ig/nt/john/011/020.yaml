  terminology: The established Standard Igbo biblical forms Mata, Meri, and Jizọs are appropriate. No theological terminology is at issue. The existing footnote is misleading because its proposed alternative repeats the wording of the main text and its explanation incorrectly suggests that the event is occurring at the reader’s present time.
