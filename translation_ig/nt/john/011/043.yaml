  text: καὶ ταῦτα εἰπὼν φωνῇ μεγάλῃ ἐκραύγασεν· Λάζαρε, δεῦρο ἔξω.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/043.yaml
  text: And after saying these things[a], he cried out with a loud voice, “Lazarus, come out!”
translation:
  language: ig
  text: Mgbe o kwusịrị ihe ndị a[a], o jiri oké olu tie mkpu, sị, “Lazarọs, pụta n’èzí!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n’ụzọ ọdịnala, “Lazarọs, pụta bịa!”
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα
  choice: ihe ndị a
  rationale: Nnọchiaha ngosi a dị n'ụdị ọtụtụ; ‘ihe ndị a’ na-edobe ọtụtụ ahụ ma bụrụkwa Igbo nkịtị.
- source_word: εἰπὼν
  choice: Mgbe o kwuchara
  rationale: Aorist participle a na-egosi na ikwu okwu ahụ buru ụzọ mee tupu iti mkpu; ‘mgbe o kwuchara’ na-egosi usoro oge ahụ nke ọma.
- source_word: φωνῇ μεγάλῃ
  choice: ji olu dara ụda
  rationale: Dative a na-akọ ụzọ e si mee ihe; okwu a na-egosi olu siri ike ma na-ada ụda nke ukwuu.
- source_word: ἐκραύγασεν
  choice: tie mkpu
  rationale: Ngwaa a pụtara iti mkpu ma ọ bụ ịkpọpụta okwu n'olu siri ike; ‘tie mkpu’ na-edobe ike okwu ahụ n'Igbo dị ndụ.
- source_word: Λάζαρε
  choice: Lazọs
  rationale: A sụgharịrị aha onye ahụ dịka nsụgharị aha a na-ahụkarị ma dị mfe ịgụ n'Igbo.
- source_word: δεῦρο ἔξω
  choice: pụta n'èzí
  rationale: δεῦρο na-arụ ọrụ dịka iwu ịbịa, ebe ἔξω pụtara n'èzí; n'ọnọdụ ili a, ‘pụta n'èzí’ bụ iwu doro anya, dị ike, ma bụrụ Igbo eke.
theological_decisions:
- issue: Otu e si sụgharịa iwu ọrụ ebube ahụ n'enweghị okwu ochie
  choice: pụta n'èzí
  alternative: bịa n'èzí
  rationale: ‘Pụta n'èzí’ na-enye ihe δεῦρο ἔξω pụtara n'ọnọdụ a n'ụzọ doro anya ma dị ugbu a, na-enweghị itinye nkọwa ụka pụrụ iche ma ọ bụ okwu ochie.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị ugbu a, dị ùgwù, ma dị mfe nghọta. Ahịrịokwu ahụ na-edobe usoro omume nke Grik na ike nke mkpu Jizọs.
