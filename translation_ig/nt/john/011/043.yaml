  rationale: The revision improves idiomatic Standard Igbo, uses the established biblical form of the personal name, and retains the source’s sequence, emphatic loud cry, and command to emerge. The footnote preserves the audit-trail alternative corresponding to the more traditional “come forth” phrasing without imposing archaic wording in the main text.
