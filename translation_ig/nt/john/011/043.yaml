review_pass:
  verdict: revise
  source_fidelity: The draft correctly reflects the temporal aorist participle, the loud cry, and the command for Lazarus to emerge. However, δεῦρο contributes the summons-to-the-speaker nuance; retaining “pụta n’èzí” is acceptable in the tomb context, while the traditional alternative can preserve this nuance as “pụta bịa.”
  naturalness: “Ji olu dara ụda tie mkpu” is understandable but is less idiomatic and somewhat repetitive, since “tie mkpu” already entails a loud cry. “Jiri oké olu tie mkpu” is a natural, dignified Standard Igbo rendering of φωνῇ μεγάλῃ ἐκραύγασεν.
  terminology: “Lazarọs” is the more established Standard Igbo biblical form of Λάζαρος than “Lazọs.” “Oké olu” accurately conveys a loud/great voice without adding interpretation.
  issues:
  - severity: medium
    issue: The expression “ji olu dara ụda tie mkpu” is stylistically awkward and redundantly intensifies the cry.
    rationale: The Greek has both “with a loud voice” and “cried out,” but Standard Igbo naturally expresses this as “jiri oké olu tie mkpu.”
  - severity: low
    issue: The name is given as “Lazọs.”
    rationale: “Lazarọs” is the conventional Standard Igbo biblical rendering and more transparently corresponds to Λάζαρος.
  revised_text: Mgbe o kwusịrị ihe ndị a[a], o jiri oké olu tie mkpu, sị, “Lazarọs, pụta n’èzí!”
