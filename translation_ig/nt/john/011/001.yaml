revisions:
- from: Otu nwoke aha ya bụ Lazarọs dara ọrịa[a]. O si na Betani, obodo nta Meri na nwanne ya nwanyị Mata.
  to: E nwere otu nwoke na-arịa ọrịa[a], bụ́ Lazarọs, onye si Betani, obodo nta nke Meri na Mata, bụ́ nwanne nwanyị Meri.
  rationale: A gbanwere okwu ahụ ka ọ gosipụta ọnọdụ ọrịa na-aga n’ihu, ka e jikọta Betani n’ụzọ doro anya na obodo nta ahụ, ma ka Mata bụrụ nwanne nwanyị Meri n’enweghị mgbagwoju anya. Nhọrọ ọzọ nọgidere na-enye usoro ahịrịokwu Grik dị nso.
