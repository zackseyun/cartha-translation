review_pass:
  verdict: revise
  source_fidelity: The draft correctly identifies Lazarus, Bethany, and the village associated with Mary and Martha. However, the main rendering divides the Greek into two sentences and its final phrase, “Meri na nwanne ya nwanyị Mata,” can grammatically leave “ya” with an unclear antecedent, potentially making Martha Lazarus’s sister rather than Mary’s. The revised wording retains the existential/narrative presentation of Ἦν δέ τις ἀσθενῶν and makes Martha’s relationship to Mary explicit.
  naturalness: “Dara ọrịa” is idiomatic, but it can suggest becoming ill and is slightly less aligned with the source’s depicted ongoing condition. “Na-arịa ọrịa” naturally expresses that he was ill. “Obodo nta nke …” supplies the possessive/associative linkage that the draft’s bare noun sequence lacks.
  terminology: Lazarọs, Betani, Meri, Mata, and obodo nta are suitable Standard Igbo forms and register. No theological terminology is at issue.
  issues:
  - severity: medium
    issue: The pronoun in “Meri na nwanne ya nwanyị Mata” is potentially ambiguous.
    rationale: The Greek αὐτῆς refers to Mary, identifying Martha as Mary’s sister. In the Igbo sentence as divided, “ya” may be read with Lazarọs as antecedent. Naming Meri explicitly resolves this without adding interpretation.
  - severity: low
    issue: “Dara ọrịa” can emphasize onset rather than the ongoing state expressed by ἀσθενῶν.
    rationale: “Na-arịa ọrịa” more directly conveys that Lazarus was sick/ill at the point in the narrative.
  - severity: low
    issue: The relationship of Bethany to Mary and Martha is underlinked in the main text.
    rationale: “Obodo nta nke Meri na Mata” clearly renders the genitives dependent on κώμης.
  revised_text: E nwere otu nwoke na-arịa ọrịa[a], bụ́ Lazarọs, onye si Betani, obodo nta nke Meri na Mata, bụ́ nwanne nwanyị Meri.
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “Otu nwoke na-arịa ọrịa nọ, Lazarọs onye Betani, onye si n’obodo nta Meri na Mata, nwanne nwanyị Meri.”
    reason: Nhọrọ ọzọ na-edobe usoro Grik ἦν … ἀσθενῶν na nkọwa Lazarọs/Betani n’ụzọ dị nso karịa.
  revision_rationale: A gbanwere okwu ahụ ka ọ gosipụta ọnọdụ ọrịa na-aga n’ihu, ka e jikọta Betani n’ụzọ doro anya na obodo nta ahụ, ma ka Mata bụrụ nwanne nwanyị Meri n’enweghị mgbagwoju anya. Nhọrọ ọzọ nọgidere na-enye usoro ahịrịokwu Grik dị nso.
