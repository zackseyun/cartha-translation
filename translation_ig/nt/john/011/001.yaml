  text: Ἦν δέ τις ἀσθενῶν, Λάζαρος ἀπὸ Βηθανίας ἐκ τῆς κώμης Μαρίας καὶ Μάρθας τῆς ἀδελφῆς αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/001.yaml
  text: A certain man was sick[a], Lazarus from Bethany, from the village of Mary and her sister Martha.
translation:
  language: ig
  text: E nwere otu nwoke na-arịa ọrịa[a], bụ́ Lazarọs, onye si Betani, obodo nta nke Meri na Mata, bụ́ nwanne nwanyị Meri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Otu nwoke na-arịa ọrịa nọ, Lazarọs onye Betani, onye si n’obodo nta Meri na Mata, nwanne nwanyị Meri.”
    reason: Nhọrọ ọzọ na-edobe usoro Grik ἦν … ἀσθενῶν na nkọwa Lazarọs/Betani n’ụzọ dị nso karịa.
lexical_decisions:
- source_word: Ἦν δέ
  choice: dara
  rationale: A haziri okwu ahụ dịka mmalite akụkọ n’Igbo na-enweghị ịgbakwunye okwu oge dịka “ugbu a”; ngwaa “dara” na ἀσθενῶν jikọtara ọnụ na-egosi ọnọdụ ọrịa ahụ n'ụzọ e ji ekwu Igbo nke ọma.
- source_word: τις
  choice: otu nwoke
  rationale: τις na-ewebata mmadụ a kapịrị ọnụ ma a ka na-amaghị ya; “otu nwoke” bụ okwu Igbo dị mfe ma kwekọọ na nwoke ahụ bụ Lazarọs.
- source_word: ἀσθενῶν
  choice: dara ọrịa
  rationale: N’ebe a, participle a pụtara ịrịa ọrịa, ọ bụghị naanị ịdị adịghị ike; “dara ọrịa” bụ okwu Igbo ebumpụta ụwa.
- source_word: Λάζαρος
  choice: Lazarọs
  rationale: E dere aha Grik ahụ n’ụdị a na-ahụkarị ma dị mfe ịgụ n’Igbo.
- source_word: ἀπὸ Βηθανίας
  choice: O si na Betani
  rationale: ἀπό na-egosi ebe onye ahụ si; nkebi ahịrịokwu Igbo a na-egosipụta mmalite ya nke ọma.
- source_word: ἐκ τῆς κώμης
  choice: obodo nta
  rationale: κώμη bụ obere obodo, ya mere “obodo nta” ziri ezi karịa okwu nwere ike ịpụta nnukwu obodo.
- source_word: Μαρίας καὶ Μάρθας τῆς ἀδελφῆς αὐτῆς
  choice: Meri na nwanne ya nwanyị Mata
  rationale: A na-ahụta αὐτῆς dịka ihe na-ezo aka na Meri, ya mere Mata bụ nwanne nwanyị Meri. Nhazi a bụ nke doro anya ma dị mma n’Igbo.
