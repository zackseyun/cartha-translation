id: JHN.11.40
reference: John 11:40
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: λέγει αὐτῇ ὁ Ἰησοῦς· Οὐκ εἶπόν σοι ὅτι ἐὰν πιστεύσῃς ⸀ὄψῃ τὴν δόξαν τοῦ θεοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/john/011/040.yaml
  text: Jesus said to her, “Did I not tell you that if you believe, you will see the glory of God?”
translation:
  language: ig
  text: Jizọs sịrị ya, “Ọ̀ bụ na agwaghị m gị na ọ bụrụ na i kwere, ị ga-ahụ ebube Chineke?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: sịrị
  rationale: Ọ bụ ezie na Grik ji historical present, ‘sịrị’ bụ ụzọ Igbo nkịtị si akọ ihe mere eme n’ụzọ doro anya.
- source_word: αὐτῇ
  choice: ya
  rationale: Dative a na-arụtụ aka n’ebe Mata nọ n’ihe gbara amaokwu ahụ gburugburu; ‘ya’ bụ ntụgharị Igbo eke.
- source_word: Οὐκ εἶπόν σοι
  choice: Ọ̀ bụ na agwaghị m gị
  rationale: Nke a na-echekwa ajụjụ nkwughachi nke na-atụ anya nkwenye, ma na-ada nke ọma n’Igbo ugbu a.
- source_word: ἐὰν πιστεύσῃς
  choice: ọ bụrụ na i kwere
  rationale: ‘I kwere’ na-echekwa ihe πιστεύω pụtara n’ebe a n’enweghị ịgbakwụnye nkọwa ozizi pụrụ iche.
- source_word: ὄψῃ
  choice: ị ga-ahụ
  rationale: Nke a na-egosipụta ọdịnihu nke ngwaa ahụ n’Igbo dị mfe ma doo anya.
- source_word: δόξαν
  choice: ebube
  rationale: ‘Ebube’ bụ okwu Igbo kwesịrị ekwesị maka δόξα, ma na-echekwa echiche banyere ngosipụta ịdị ukwuu na ịdị ebube Chineke.
- source_word: τοῦ θεοῦ
  choice: Chineke
  rationale: ‘Ebube Chineke’ bụ genitive eke n’Igbo ma na-echekwa njikọ ebube ahụ na Chineke.
theological_decisions:
- issue: Njikọ dị n’etiti ikwere na ịhụ ebube Chineke
  choice: 'E gosipụtara ya dịka nkwa nwere ọnọdụ: ‘ọ bụrụ na i kwere, ị ga-ahụ.’'
  alternative: Ịkọwa ya dịka ụkpụrụ gbasara okwukwe na ọrụ ebube niile, ma ọ bụ dịka nkwa metụtara naanị ịkpọlite Lazarọs.
  rationale: Amaokwu ahụ n’onwe ya bụ okwu Jizọs gwara Mata kpọmkwem. Ntụgharị ahụ na-echekwa ọnọdụ ahụ na nkwa ahụ n’ebughị ụzọ kpebie oke nkọwa nkà mmụta okpukpe ya.
translation_notes:
  register: Standard Igbo; asụsụ dị ugbu a, dị ùgwù, ma dị mfe nghọta. E ji ‘Jizọs’ na ‘Chineke’ dịka ụdị aha ndị a na-ahụkarị na Standard Igbo. Enweghị ihe odide ala ala peeji dị mkpa.
