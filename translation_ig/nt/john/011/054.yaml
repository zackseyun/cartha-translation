id: JHN.11.54
reference: John 11:54
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸂Ὁ οὖν Ἰησοῦς⸃ οὐκέτι παρρησίᾳ περιεπάτει ἐν τοῖς Ἰουδαίοις, ἀλλὰ ἀπῆλθεν ἐκεῖθεν εἰς τὴν χώραν ἐγγὺς τῆς ἐρήμου, εἰς Ἐφραὶμ λεγομένην πόλιν, κἀκεῖ ⸀ἔμεινεν μετὰ τῶν ⸀μαθητῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/054.yaml
  text: So Jesus no longer walked openly among the Jews[a], but departed from there to the region near the wilderness, to a city called Ephraim, and stayed there with the disciples.
translation:
  language: ig
  text: Ya mere, Jizọs akwụsịkwaghị ịgagharị n’ihu ọha n’etiti ndị Juu[a]. Kama, o si n’ebe ahụ pụọ gaa n’ógbè dị nso n’ọzara, gaa n’obodo a na-akpọ Efraim; ya na ndị na-eso ụzọ ahụ wee nọrọ ebe ahụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’etiti ndị Judia.” N’Oziọma Jọn, “ndị Juu” nwere ike mgbe ụfọdụ izo aka kpọmkwem n’ebe ndị bi na Judia nọ ma ọ bụ n’ebe ndị ọchịchị ndị Juu nọ, dịka ọnọdụ okwu siri dị.
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: Ya mere
  rationale: Na-egosi ihe si ná nkata ndị e kwuru okwu ha n’amaokwu bu ụzọ pụta, ma bụrụkwa ụzọ Igbo dị mma isi jikọta akụkọ ahụ.
- source_word: οὐκέτι παρρησίᾳ περιεπάτει
  choice: akwụsịkwaghị ịgagharị n’ihu ọha
  rationale: ‘Akwụsịkwaghị’ na-egosi na omume mbụ kwụsịrị; ‘ịgagharị n’ihu ọha’ na-eweta echiche nke mmegharị a na-ahụ anya n’ihu mmadụ, ọ bụghị nanị inwe obi ike.
- source_word: ἐν τοῖς Ἰουδαίοις
  choice: n’etiti ndị Juu
  rationale: Na-echekwa okwu sara mbara nke Grik, ebe ihe ọ pụtara kpọmkwem n’Oziọma Jọn nwere ike ịdabere n’ọnọdụ; ndetu ala na-echekwa ohere nke ‘ndị Judia.’
- source_word: ἀπῆλθεν ἐκεῖθεν
  choice: o si n’ebe ahụ pụọ
  rationale: Ọ bụ Igbo eke na-egosi mmegharị site n’ebe ọ nọbu.
- source_word: χώραν ἐγγὺς τῆς ἐρήμου
  choice: ógbè dị nso n’ọzara
  rationale: ‘Ógbè’ na-egosi mpaghara, ọ bụghị mba nke oge a; ‘ọzara’ na-egosi ebe kpọrọ nkụ ma ọ bụ ebe mmadụ na-ebighị ọtụtụ.
- source_word: εἰς Ἐφραὶμ λεγομένην πόλιν
  choice: ruo n’obodo a na-akpọ Ifrem
  rationale: ‘Obodo’ nwere ike ịgụnye obodo nta ma ọ bụ ukwu dịka πόλις si nwee ike ime; ‘Ifrem’ bụ nsụgharị aha a dabara n’ụda Igbo.
- source_word: κἀκεῖ ἔμεινεν μετὰ τῶν μαθητῶν
  choice: ya na ndị na-eso ụzọ ya wee nọrọ ebe ahụ
  rationale: ‘Nọrọ ebe ahụ’ bụ ụzọ Igbo eke maka ịnọgide n’otu ebe n’akụkọ njem. A gbakwụnyere ‘ya’ n’ahịrịokwu ahụ iji mee ka mmekọrịta ahụ doo anya n’Igbo, n’agbanyeghị na Grik kwuru naanị ‘ndị na-eso ụzọ ahụ.’
theological_decisions:
- issue: Ihe Ἰουδαῖοι na-ezo aka na ya n’Oziọma Jọn
  choice: ndị Juu
  alternative: ndị Judia
  rationale: Okwu ahụ nwere ike ịpụta ndị Juu n’ozuzu, ndị bi na Judia, ma ọ bụ ndị isi ndị Juu dịka ọnọdụ siri dị. N’ebe a, isiokwu bụ ebe Jizọs na-agagharị n’ihu ọha, ya mere a hapụrụ okwu sara mbara n’ahịrị bụ isi, kwuo ụzọ mpaghara ahụ na ndetu ala.
translation_notes:
  register: Standard Igbo dị ugbu a, nke a na-aghọta ngwa ngwa ma dịkwa ugwu. A họọrọ ‘ịgagharị n’ihu ọha’ karịa nsụgharị mkpụrụokwu nke nwere ike iyi ihe na-adịghị eke n’Igbo; e chekwara mgbagwoju anya nke Ἰουδαῖοι site na ndetu ala.
