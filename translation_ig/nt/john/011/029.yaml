revisions:
- from: Mgbe ọ nụrụ nke a[a], o biliri ngwa ngwa wee gawa n'ebe ọ nọ.
  to: Mgbe ọ nụrụ nke a[a], o biliri ngwa ngwa wee gakwuuru ya.
  rationale: The revision replaces the locative expression with “gakwuru ya,” which naturally renders movement directly to Jesus and better corresponds to πρὸς αὐτόν. The footnote is revised correspondingly and retains the literal demonstrative (‘onye ahụ’), the mild connective (‘Ma’), and the progressive sense of the imperfect (‘na-agakwuru’).
  reviewer_model: gpt-5.6-terra
