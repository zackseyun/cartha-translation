  yaml_path: translation/nt/john/011/029.yaml
  text: And when she heard it[a], she got up quickly and went to him.
translation:
  language: ig
  text: Mgbe ọ nụrụ nke a[a], o biliri ngwa ngwa wee gakwuuru ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya n'ụzọ nkịtị karị, “Ma onye ahụ, mgbe ọ nụrụ, biliri ngwa ngwa ma na-agakwuru ya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκείνη
  choice: ọ
  rationale: N'amaokwu ndị gbara ya gburugburu, okwu a na-arụtụ aka na Meri. N'Igbo, nnọchiaha ‘ọ’ bụ ụzọ e si ekwu ya nke ọma n'enweghị ikwughachi aha ya ma ọ bụ jiri okwu siri ike dịka ‘onye ahụ.’
- source_word: δὲ
  choice: (egosighị ya iche)
  rationale: N'ebe a, δέ bụ naanị njikọ dị nro nke na-aga n'ihu n'akụkọ ahụ. Usoro ahịrịokwu Igbo na-egosi njikọ ahụ nke ọma n'enweghị itinye ‘ma’ nke nwere ike igosi ọdịiche siri ike na-adịghị ebe a.
- source_word: ὡς
  choice: mgbe
  rationale: ‘Mgbe’ na-egosi oge ihe ahụ mere n'ụzọ doro anya, ma ọ naghị eme ka ọ bụrụ ‘ozugbo’ karịa ka Grik ahụ kwuru.
- source_word: ἤκουσεν
  choice: nụrụ nke a
  rationale: Ngwaa ahụ pụtara ‘nụrụ.’ A gbakwụnyere ‘nke a’ dịka ihe ọ nụrụ, ya bụ ozi e kwuru n'amaokwu bu ụzọ, iji mee ka Igbo bụrụ nke eke na nke doro anya.
- source_word: ἠγέρθη
  choice: biliri
  rationale: Ọ bụ ezie na ọdịdị ngwaa Grik ahụ bụ nke nwere ike ịdị ka passive, n'ebe a ọ pụtara na mmadụ biliri. ‘Biliri’ bụ okwu Igbo ziri ezi ma dị mfe, ọ dịghịkwa egosi na onye ọzọ weliri ya.
- source_word: ταχὺ
  choice: ngwa ngwa
  rationale: ‘Ngwa ngwa’ na-egosi ọsọ na ịdị njikere nke omume ahụ n'ụzọ nkịtị.
- source_word: ἤρχετο
  choice: wee gawa
  rationale: Imperfect Grik ahụ na-egosi njem na-aga n'ihu. ‘Gawa’ na-egosi na ọ malitere ịga ma na-aga ebe ahụ, ma ọ naghị ekwusi ike na ọ rutere ozugbo.
- source_word: πρὸς αὐτόν
  choice: n'ebe ọ nọ
  rationale: Nkebiokwu a na-egosi ngagharị n'ebe Jizọs nọ. ‘N'ebe ọ nọ’ na-echekwa echiche nke ịgakwuru ya n'ụzọ Igbo na-ada nke ọma.
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị mfe ma nwee ugwu, sụgharịa amaokwu a. A họọrọ usoro okwu na-aga nke ọma n'akụkọ, ebe e debere ọdịiche dị n'etiti ịnụ ozi, ibili ngwa ngwa, na ịmalite ịga n'ebe Jizọs nọ.
