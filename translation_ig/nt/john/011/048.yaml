source:
  edition: SBLGNT
  text: ἐὰν ἀφῶμεν αὐτὸν οὕτως, πάντες πιστεύσουσιν εἰς αὐτόν, καὶ ἐλεύσονται οἱ Ῥωμαῖοι καὶ ἀροῦσιν ἡμῶν καὶ τὸν τόπον καὶ τὸ ἔθνος.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/048.yaml
  text: If we let him go on like this[a], everyone will believe in him[b], and the Romans will come and take away both our place and our nation.
translation:
  language: ig
  text: Ọ bụrụ na anyị ahapụ ya ka ọ nọgide na-eme otu a, mmadụ niile ga-ekwere na ya, ndị Rom ga-abịa were napụ anyị ma ebe anyị[a] ma mba anyị[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ụlọ nsọ anyị.” Okwu Grik bụ “ebe anyị”; ọ pụrụ izo aka kpọmkwem n’ụlọ nsọ ahụ, ma ọ bụ n’ebe ha ma ọ bụ n’ọnọdụ ha n’ụzọ sara mbara.
    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ, “ndị anyị.” Okwu a sụgharịrị “mba” nwekwara ike ịpụta otu ndị.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφῶμεν αὐτὸν οὕτως
  choice: anyị ahapụ ya ka ọ nọgide na-eme otu a
  rationale: Nkebi a na-egosi ikwe ka ọ gaa n’ihu n’ụzọ ọ na-eme ugbu a. Ịgbakwụnye “ka ọ nọgide na-eme” na-eme ka echiche ahụ doo anya n’Igbo nkịtị n’etinyeghị ihe ọhụrụ.
- source_word: πάντες
  choice: mmadụ niile
  rationale: Nke a na-egosi mmadụ nile n’ozuzu ya ma na-ada nke ọma n’Igbo ugbu a.
- source_word: πιστεύσουσιν εἰς αὐτόν
  choice: ga-ekwere na ya
  rationale: Nke a na-edobe usoro okwu Jọn ji ekwu banyere ikwere n’ime mmadụ ma ọ bụ ịtụkwasị ya obi.
- source_word: ἐλεύσονται οἱ Ῥωμαῖοι
  choice: ndị Rom ga-abịa
  rationale: Nke a bụ ntụgharị kwụ ọtọ ma dịkwa n’usoro okwu Igbo ebumpụta ụwa.
- source_word: ἀροῦσιν
  choice: napụ anyị
  rationale: Ngwaa a pụtara iwepụ ma ọ bụ ịnara ihe. “Napụ anyị” na-egosi na ndị Rom ga-anara ha ihe ndị ahụ n’agbanyeghị na ọ naghị eme ka ihe ahụ bụrụ ‘ibibi’ kpọmkwem.
- source_word: τόπον
  choice: ebe anyị
  rationale: τόπος pụtara “ebe.” Okwu a nwere ike izo aka n’ụlọ nsọ ma ọ bụ n’ebe na ọnọdụ ha n’ụzọ sara mbara; “ebe anyị” na-edobe nghọta abụọ ahụ.
- source_word: ἔθνος
  choice: mba anyị
  rationale: ἔθνος nwere ike ịpụta mba ma ọ bụ otu ndị. “Mba anyị” dabara n’egwu ndọrọ ndọrọ ọchịchị dị n’okwu a, ebe e debere “ndị anyị” dị ka nhọrọ ọzọ n’ala ala peeji.
- source_word: ἡμῶν ... καὶ τὸν τόπον καὶ τὸ ἔθνος
  choice: napụ anyị ma ebe anyị ma mba anyị
  rationale: Usoro “ma ... ma ...” na-egosi nke ọma na ihe abụọ ahụ—ebe ha na mba ha—so n’ihe ndị Rom ga-anapụ ha.
theological_decisions:
- issue: Ihe “ebe anyị” (τόπον) na-ezo aka na ya
  choice: E debere “ebe anyị” n’isiokwu ahụ n’akọwaghị ya dịka ụlọ nsọ naanị.
  alternative: ụlọ nsọ anyị; ọnọdụ ma ọ bụ ikike anyị
  rationale: Ndị na-ekwu okwu nwere ike na-atụ egwu na ndị Rom ga-emegide ụlọ nsọ, ọnọdụ ọchịchị ha, ma ọ bụ ha abụọ. Ebe okwu Grik sara mbara, ntụgharị ahụ ekwesịghị ikpebi naanị otu nghọta.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-asọ nke ọma n’okwu Igbo, ma e debeghị nghọta pụrụ iche nke otu ụka gbasara “ebe anyị” ma ọ bụ “mba anyị.”
