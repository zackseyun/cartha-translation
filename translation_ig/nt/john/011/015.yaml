id: JHN.11.15
reference: John 11:15
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ χαίρω δι’ ὑμᾶς, ἵνα πιστεύσητε, ὅτι οὐκ ἤμην ἐκεῖ· ἀλλὰ ἄγωμεν πρὸς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/015.yaml
  text: And I am glad for your sake that I was not there[a], so that you may believe. But let us go to him.
translation:
  language: ig
  text: Obi dị m ụtọ n’ihi unu na anọghị m ebe ahụ, ka unu wee kwere[a]. Ma ka anyị gakwuru ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ka unu wee malite ikwere.”
    reason: lexical_alternative
lexical_decisions:
- source_word: χαίρω
  choice: Obi dị m ụtọ
  rationale: Nke a bụ ụzọ Igbo nkịtị si akọwa ọṅụ ma ọ bụ afọ ojuju dị mma n’ọnọdụ a, n’enweghị ịdị arọ nke okwu.
- source_word: δι’ ὑμᾶς
  choice: n’ihi unu
  rationale: N’ọnọdụ a, okwu ahụ na-egosi na ihe ahụ bụ maka uru ndị na-eso ụzọ; “n’ihi unu” bụ ụzọ Igbo dị nkenke ma kwekọọ n’echiche ahụ.
- source_word: ἵνα πιστεύσητε
  choice: ka unu wee kwere
  rationale: Ọ na-egosi nzube. “Kwere” na-echekwa okwu Jọn ji ekwu maka ikwere, ma ọ naghị ekpebi ma ọ bụ mmalite ikwere ma ọ bụ ito n’okwukwe.
- source_word: ὅτι οὐκ ἤμην ἐκεῖ
  choice: na anọghị m ebe ahụ
  rationale: “Na” na-ewebata ihe kpatara ọṅụ Jizọs kwuru; “anọghị m ebe ahụ” na-asụgharị imperfect nke εἰμί n’ụzọ Igbo doro anya.
- source_word: ἀλλὰ
  choice: Ma
  rationale: Ọ na-egosi mgbanwe site n’ịkọwa ihe gaa n’omume ha ga-eme.
- source_word: ἄγωμεν
  choice: ka anyị gaa
  rationale: Ọ bụ hortatory subjunctive, ya bụ òkù ka onye na-ekwu okwu na ndị ọzọ mee ihe ọnụ.
- source_word: πρὸς αὐτόν
  choice: gakwuru ya
  rationale: “Gakwuru ya” na-egosi ịga n’ebe onye ahụ nọ n’ụzọ Igbo sitere n’okike.
theological_decisions:
- issue: Ike πιστεύσητε n’akwụkwọ Jọn
  choice: ka unu wee kwere
  alternative: ka unu wee malite ikwere
  rationale: Aorist subjunctive nwere ike igosi ịmalite ikwere, ma ọ bụghị iwu na ọ ga-apụta na ndị na-eso ụzọ ekwetabeghị ma ọlị. Isi nsụgharị ahụ na-echekwa nghọta sara mbara na esemokwu dị n’okwu ahụ.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji “Obi dị m ụtọ” mee ka χαίρω bụrụ okwu Igbo sitere n’okike; e jikwara “gakwuru ya” mee ka mmegharị πρὸς αὐτόν doo anya.
