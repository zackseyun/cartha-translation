revisions:
- from: ọ bụghịkwa naanị n’ihi mba ahụ[a][b], kama ka ọ kpọkọtakwa ụmụ Chineke gbasasịrị agbasasị ka ha bụrụ otu.
  to: Ọ bụghịkwa naanị maka mba ahụ[b], kama ka ọ kpọkọtakwa ụmụ Chineke ndị gbasasịrị agbasasị ka ha bụrụ otu.
  rationale: Replaced n’ihi with maka to express the contextual force of ὑπέρ (“for/on behalf of”), added ndị for a natural Igbo rendering of “the scattered children,” and removed the duplicate alternative footnote. The wording continues the thought of the preceding verse without supplying an explicit subject or defining the scope of “the children of God” beyond the Greek text.
  reviewer_model: gpt-5.6-terra
