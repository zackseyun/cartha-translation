id: JHN.11.52
reference: John 11:52
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ οὐχ ὑπὲρ τοῦ ἔθνους μόνον, ἀλλ’ ἵνα καὶ τὰ τέκνα τοῦ θεοῦ τὰ διεσκορπισμένα συναγάγῃ εἰς ἕν.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/052.yaml
  text: and not for the nation only[b][a], but also so that he might gather into one the scattered children of God.
translation:
  language: ig
  text: Ọ bụghịkwa naanị maka mba ahụ[b], kama ka ọ kpọkọtakwa ụmụ Chineke ndị gbasasịrị agbasasị ka ha bụrụ otu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: “Mba ahụ” na-ezo aka n’ebe a n’ebe mba ndị Juu nọ.
    reason: cultural_note
lexical_decisions:
- source_word: ἔθνους
  choice: mba ahụ
  rationale: N’ebe a, okwu ahụ na-ezo aka kpọmkwem n’ebe mba ndị Juu nọ; ‘mba ahụ’ na-edobe echiche nke otu mba dịka Greek si kwuo.
- source_word: ἵνα
  choice: ka
  rationale: ‘Ka’ na-egosi ebumnuche ma ọ bụ ihe ga-esi na ya pụta n’ụzọ Igbo dị mfe ma bụrụkwa nke sitere n’ike ἵνα.
- source_word: τέκνα τοῦ θεοῦ
  choice: ụmụ Chineke
  rationale: τέκνα gụnyere nwoke na nwanyị; ‘ụmụ Chineke’ bụ okwu Igbo nkịtị nke na-edobe obosara ahụ.
- source_word: διεσκορπισμένα
  choice: gbasasịrị agbasasị
  rationale: Ọ na-egosi ndị nọ n’ọnọdụ nke ịgbasa n’ebe dị iche iche; nkebiokwu a na-ada nke ọma n’Igbo ma na-eburu echiche participle perfect passive ahụ.
- source_word: συναγάγῃ
  choice: ọ kpọkọta
  rationale: ‘Kpọkọta’ na-egosipụta ime ka ndị nọ iche iche zukọta; njikọ ya na ‘ka’ na-eburu ike subjunctive dị n’ahịrịokwu ebumnuche ahụ.
- source_word: εἰς ἕν
  choice: ka ha bụrụ otu
  rationale: Nke a na-edobe ịdị nkenke na obosara nke Greek, n’etinyeghị ‘otu ahụ’ ma ọ bụ ‘otu nzukọ’ nke adịghị n’ihe odide ahụ.
- source_word: καὶ οὐχ ὑπὲρ τοῦ ἔθνους μόνον, ἀλλ’
  choice: ọ bụghịkwa naanị n’ihi mba ahụ, kama
  rationale: Nke a na-aga n’ihu n’echiche amaokwu gara aga banyere ọnwụ Jizọs n’ihi ndị ọzọ, ma na-edobe usoro ntụnyere ‘ọ bụghị naanị … kama.’
theological_decisions:
- issue: Ndị bụ ‘ụmụ Chineke’
  choice: A hapụrụ okwu ahụ ka ọ gbasaa ruo n’ebe ndị Chineke gbasasịrị nọ, ndị ọnwụ Jizọs ga-eme ka ha bụrụ otu, n’akọwaghị ha dịka otu òtù okpukpe kpọmkwem.
  alternative: Ha nwere ike ịpụta naanị ndị Juu nọ ná mba ọzọ, ma ọ bụ ndị kwere ekwe Chineke họpụtara n’etiti ndị Juu na ndị mba ọzọ.
  rationale: Ihe odide ahụ na-atụnyere ‘mba ahụ’ na ìgwè ka ukwuu nke ụmụ Chineke gbasasịrị, ma ọ kọwaghị kpọmkwem oke ìgwè nke abụọ ahụ.
translation_notes:
  register: Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. ‘Kpọkọta’ na ‘ka ha bụrụ otu’ na-enye ahịrịokwu ahụ ọdịdị Igbo ebumpụta ụwa ma ghara ịgbakwunye nkọwa okpukpe na-adịghị na Greek.
