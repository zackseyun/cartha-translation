  to: Ya mere, ha na-achọ Jizọs, na-asịkwa ibe ha, mgbe ha guzo n’ogige ụlọ nsọ[a], sị, “Gịnị ka unu chere? Ọ̀ bụ na ọ gaghị abịa n’ememme ahụ ma ọlị[b]?”
