  text: ἐζήτουν οὖν τὸν Ἰησοῦν καὶ ἔλεγον μετ’ ἀλλήλων ἐν τῷ ἱερῷ ἑστηκότες· Τί δοκεῖ ὑμῖν; ὅτι οὐ μὴ ἔλθῃ εἰς τὴν ἑορτήν;
base_translation:
  language: en
  yaml_path: translation/nt/john/011/056.yaml
  text: So they were looking for Jesus and saying to one another as they stood in the temple courts[b][a], “What do you think? That he certainly will not come to the feast?”
translation:
  language: ig
  text: Ya mere, ha na-achọ Jizọs, na-asịkwa ibe ha, mgbe ha guzo n’ogige ụlọ nsọ[a], sị, “Gịnị ka unu chere? Ọ̀ bụ na ọ gaghị abịa n’ememme ahụ ma ọlị[b]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Okwu Grik ἱερόν na-ezo aka n’mpaghara ụlọ nsọ na ogige ya niile, ọ bụghị kpọmkwem n’ime ebe nsọ ahụ.
    reason: cultural_note
  - marker: b
    text: A pụkwara ịsụgharị ya, “Ọ gaghị abịa n’ememme ahụ n’ụzọ ọ bụla.” Okwu Grik ji ngọnahụ mesiri ike (οὐ μή).
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐζήτουν
  choice: ha nọ na-achọ
  rationale: Oge imperfect na-egosi omume na-aga n’ihu; okwu a bụ asụsụ Igbo dị mfe ma na-egosi na ha nọgidere na-achọ Jizọs.
- source_word: οὖν
  choice: Ya mere
  rationale: Na-ejikọta ihe a na ihe ndị bu ya ụzọ dịka nsonaazụ ma ọ bụ n'ihu akụkọ.
- source_word: ἔλεγον μετ’ ἀλλήλων
  choice: na-agwakwa ibe ha okwu
  rationale: Na-echekwa omume na-aga n’ihu nke imperfect nakwa mkparịta ụka ha na ibe ha.
- source_word: ἐν τῷ ἱερῷ
  choice: n’ogige ụlọ nsọ
  rationale: ἱερόν na-ezo aka n’ebe niile gbara ụlọ nsọ gburugburu, ọ bụghị naanị ime ebe nsọ ahụ.
- source_word: ἑστηκότες
  choice: ka ha guzo
  rationale: Na-egosi ọnọdụ ha nọ na ya mgbe ha na-ekwu okwu.
- source_word: Τί δοκεῖ ὑμῖν;
  choice: Gịnị ka unu chere?
  rationale: Nke a bụ ụzọ Igbo nkịtị si ajụ mmadụ echiche ya.
- source_word: ὅτι οὐ μὴ ἔλθῃ
  choice: Ọ̀ bụ na ọ gaghị abịa ... ma ọlị?
  rationale: Ajụjụ ahụ na-edobe ὅτι dịka ihe ha chere, ebe ‘ma ọlị’ na-ebuga ike nke nkwụsi ike dị na οὐ μή n’Igbo sitere n’okike.
- source_word: εἰς τὴν ἑορτήν
  choice: n’ememme ahụ
  rationale: ἑορτή bụ ememme okpukpe ndị Juu; ‘ememme’ bụ okwu Igbo nke oge a ma kwekọọ n’ọnọdụ Ememme Ngabiga.
