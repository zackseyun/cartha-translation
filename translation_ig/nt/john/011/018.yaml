  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἦν δὲ ⸀ἡ Βηθανία ἐγγὺς τῶν Ἱεροσολύμων ὡς ἀπὸ σταδίων δεκαπέντε.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/018.yaml
  text: Bethany was near Jerusalem[a], about fifteen stadia away.
translation:
  language: ig
  text: Betani dị Jerusalem nso, ihe dị ka stadia iri na ise.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: (a tụgharịghị ya iche)
  rationale: δέ bụ njikọ dị nro nke na-aga n’ihu n’akụkọ a; usoro ahịrịokwu Igbo na gburugburu ya ezuru iburu ọrụ ahụ n’etinyeghị “ma” nke pụrụ igosi nnukwu ọdịiche.
- source_word: Βηθανία
  choice: Betani
  rationale: A sụgharịghị aha ebe ahụ; e dere ya dịka mkpọpụta ya si kwekọọ n’usoro ide aha n’Igbo.
- source_word: ἐγγὺς
  choice: dị nso na
  rationale: Okwu a na-egosi ịdị nso n’ebe; “dị nso na” bụ okwu Igbo doro anya ma bụrụkwa nke nkịtị.
- source_word: Ἱεροσολύμων
  choice: Jerusalem
  rationale: Nke a bụ aha ebe a maara nke ọma n’Igbo.
- source_word: ὡς
  choice: ihe dị ka
  rationale: N’ihu okwu atụ, ὡς na-egosi na ọnụ ọgụgụ ahụ bụ nke e mere atụmatụ, ọ bụghị nke a tụrụ kpọmkwem.
- source_word: ἀπὸ σταδίων δεκαπέντε
  choice: stadia iri na ise site n’ebe ahụ
  rationale: E debere otu atụ oge ochie nke ihe odide ahụ, ebe “site n’ebe ahụ” na-eme ka echiche ἀπό banyere anya site na Jerusalem doo anya. A kọwara ya n’otu atụ nke oge a n’ala ala peeji.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị mfe nghọta ma nwee ugwu. E debere “stadia” n’ahịrịokwu isi iji chekwaa otu atụ nke ọdịnala oge ahụ, ma nye nkọwa nke oge a n’ala ala peeji.
