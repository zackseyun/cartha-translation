    text: A pụkwara ịsụgharị ya, “ọtụtụ ndị si n’etiti ndị Juu.” N’ebe ụfọdụ n’Oziọma Jọn, ụfọdụ na-ekwu na a pụkwara ịsụgharị Ἰουδαῖοι dịka “ndị bi na Judia.”
    reason: lexical_alternative
  revision_rationale: The revision removes an added purposive nuance, clarifies that Jesus—not Mary—is the one whose action was seen and the one believed in, and retains the original’s logical connection, partitive expression, and lexical-alternative footnote.
