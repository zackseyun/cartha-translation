  text: Πολλοὶ οὖν ἐκ τῶν Ἰουδαίων, οἱ ἐλθόντες πρὸς τὴν ⸀Μαριὰμ καὶ θεασάμενοι ⸀ἃ ⸀ἐποίησεν, ἐπίστευσαν εἰς αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/john/011/045.yaml
  text: Therefore many of the Jews who had come to Mary and had seen what he had done believed in him[a].
translation:
  language: ig
  text: N’ihi ya, ọtụtụ n’ime ndị Juu, bụ ndị bịakwutere Meri ma hụ ihe Jizọs mere, kweere na Jizọs.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ọtụtụ ndị si n’etiti ndị Juu.” N’ebe ụfọdụ n’Oziọma Jọn, ụfọdụ na-ekwu na a pụkwara ịsụgharị Ἰουδαῖοι dịka “ndị bi na Judia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Πολλοὶ
  choice: ọtụtụ
  rationale: Ọ na-egosi ọnụ ọgụgụ buru ibu ma a kọwaghị kpọmkwem ole ha dị; “ọtụtụ” bụ okwu Igbo dị mfe ma kwekọọ na nke ahụ.
- source_word: οὖν
  choice: N’ihi ya
  rationale: Ọ na-ejikọta amaokwu a na ihe mere tupu ya, karịchaa mbilite Lazarọs n’ọnwụ, dị ka ihe si na ya pụta.
- source_word: ἐκ τῶν Ἰουδαίων
  choice: n’ime ndị Juu
  rationale: Nke a na-edobe echiche partitive nke Grik, ya bụ, ọtụtụ ndị sitere n’etiti ìgwè ndị Juu.
- source_word: οἱ ἐλθόντες πρὸς τὴν Μαριὰμ
  choice: bịara ịhụ Meri
  rationale: N’Igbo, “ịbịara ịhụ mmadụ” na-egosi n'ụzọ ebumpụta ụwa na ha bịakwutere Meri; ọ na-akọwapụta ndị Juu a na-ekwu banyere ha.
- source_word: θεασάμενοι
  choice: ma hụ
  rationale: Ọ na-enye echiche na ha ji anya ha hụ ma mata ihe Jizọs mere, n’asụsụ Igbo dị larịị.
- source_word: ἃ ἐποίησεν
  choice: ihe o mere
  rationale: Nke a bụ ntụgharị Igbo kpọmkwem ma dị n’okike maka neuter plural relative na ποιέω.
- source_word: ἐπίστευσαν εἰς αὐτόν
  choice: kweere na ya
  rationale: Nke a na-edobe okwu Jọn ji egosi nkwenye a tụkwasịrị n’ebe Jizọs nọ, n’enweghị ịgbakwunye nkọwa ozizi ọzọ.
theological_decisions:
- issue: Ntụgharị πιστεύω εἰς αὐτόν n’ebe Jọn na-ekwu banyere ikwere na Jizọs
  choice: kweere na ya
  alternative: tụkwasịrị ya obi
  rationale: “Kweere na ya” na-esochi usoro okwu Grik ma bụrụkwa ụzọ a na-aghọta nke ọma n’Igbo; “tụkwasịrị ya obi” nwere ike ime ka otu akụkụ nke ihe okwu ahụ pụtara pụta ìhè karịa ihe ederede kwuru kpọmkwem.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E debere njikọ ihe si na ya pụta, echiche “n’ime” nke ἐκ, na okwu okwukwe nke Jọn n’enweghị itinye nkọwa otu ụka.
