revisions:
- from: N’ihi ya, ọtụtụ n’ime ndị Juu bịara ịhụ Meri ma hụ ihe o mere kweere na ya.[a]
  to: N’ihi ya, ọtụtụ n’ime ndị Juu, bụ ndị bịakwutere Meri ma hụ ihe Jizọs mere, kweere na Jizọs.[a]
  rationale: The revision removes an added purposive nuance, clarifies that Jesus—not Mary—is the one whose action was seen and the one believed in, and retains the original’s logical connection, partitive expression, and lexical-alternative footnote.
