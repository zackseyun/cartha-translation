id: JHN.11.57
reference: John 11:57
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: δεδώκεισαν ⸀δὲ οἱ ἀρχιερεῖς καὶ οἱ Φαρισαῖοι ⸀ἐντολὰς ἵνα ἐάν τις γνῷ ποῦ ἐστιν μηνύσῃ, ὅπως πιάσωσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/057.yaml
  text: The chief priests and the Pharisees had given orders that if anyone knew where he was[a], he should report it[b], so that they might seize him.
translation:
  language: ig
  text: Ndị isi nchụaja na ndị Farisii enyeworị iwu na ọ bụrụ na onye ọ bụla amata ebe ọ nọ, onye ahụ ga-akọọrọ ha, ka ha wee jide ya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị “jide ya” dị ka “nwụchie ya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δεδώκεισαν
  choice: enyeworị
  rationale: Ụdị ngwaa a na-egosi na ha enyela iwu ahụ tupu oge ihe a na-akọ ugbu a; “enyeworị” na-egosipụta nke a n’ụzọ Igbo si ada nke ọma.
- source_word: δὲ
  choice: e tinyeghị ya iche n'okwu Igbo
  rationale: N'ebe a, δέ bụ njikọ dị nro nke na-eme ka akụkọ gaa n'ihu, ọ bụghị nkwugide siri ike. Ọsọ na nhazi ahịrịokwu Igbo na-eburu ọrụ ya n'enweghị itinye “ma” nke nwere ike ime ka ọdịiche ahụ sie ike karịa nke Grik.
- source_word: οἱ ἀρχιερεῖς
  choice: Ndị isi nchụaja
  rationale: Ọtụtụ aha a na-ezo aka ná ndị ọchịchị kachasị elu n'etiti ndị nchụaja, ọ bụghị ọtụtụ ndị isi nchụaja na-arụ otu ọkwa ahụ n'otu oge.
- source_word: οἱ Φαρισαῖοι
  choice: ndị Farisii
  rationale: E ji aha otu ndị Juu a emegharị ụda ya n’Igbo n’ụdị a na-aghọta nke ọma.
- source_word: ἐντολὰς
  choice: iwu
  rationale: N'ọnọdụ a, okwu ahụ bụ ntụziaka ndị ọchịchị nyere nke a ga-erubere isi; “iwu” na-egosipụta ikike ahụ nke ọma.
- source_word: ἵνα ἐάν τις γνῷ
  choice: na ọ bụrụ na onye ọ bụla amata
  rationale: Nke a na-echekwa ma ọdịnaya iwu ahụ ma ọnọdụ nke na-adabere n'onye ga-amata ozi ahụ.
- source_word: ποῦ ἐστιν
  choice: ebe ọ nọ
  rationale: N'Igbo, “ebe ọ nọ” na-egosi ọnọdụ ya n'ụzọ eke, na-enweghị mkpa ịmanye ọdịiche oge dị n'etiti “is” na “was” nke Bekee.
- source_word: μηνύσῃ
  choice: onye ahụ ga-akọọrọ ha
  rationale: Ngwaa ahụ pụtara ime ka ndị ọchịchị mara ihe. “Akọọrọ ha” na-eme ka ndị a ga-agwa doo anya site n'okirikiri ahịrịokwu ahụ, na-enweghị ịgbakwunye nkọwa ọzọ.
- source_word: ὅπως
  choice: ka ... wee
  rationale: Usoro Igbo a na-egosi nzube nke ihe e nyere n'iwu.
- source_word: πιάσωσιν
  choice: jide ya
  rationale: “Jide” na-echekwa nghọta sara mbara nke ijide ma ọ bụ nwụchie mmadụ, na-etinyeghị naanị nkọwa iwu pụrụ iche nke “nwụchie.”
theological_decisions: []
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe dị ugbu a, dị ugwu ma dị mfe nghọta. E chekwara usoro ọnọdụ na nzube nke Grik, ma zere okwu ndị ụka pụrụ iche na nkọwa a gbakwụnyere na-adịghị na isi mmalite.
