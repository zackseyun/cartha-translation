id: JHN.11.31
reference: John 11:31
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οἱ οὖν Ἰουδαῖοι οἱ ὄντες μετ’ αὐτῆς ἐν τῇ οἰκίᾳ καὶ παραμυθούμενοι αὐτήν, ἰδόντες τὴν ⸀Μαριὰμ ὅτι ταχέως ἀνέστη καὶ ἐξῆλθεν, ἠκολούθησαν αὐτῇ ⸀δόξαντες ὅτι ὑπάγει εἰς τὸ μνημεῖον ἵνα κλαύσῃ ἐκεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/031.yaml
  text: So the Jews who were with her in the house and comforting her[a], when they saw that Mary got up quickly and went out, followed her, thinking that she was going to the tomb to weep there.
translation:
  language: ig
  text: Ya mere, ndị Juu[a] ndị ahụ nọnyere ya n’ụlọ, na-akasi ya obi, mgbe ha hụrụ na Meri biliri ngwa ngwa ma pụọ, ha soro ya, na-eche na ọ na-aga n’ili ahụ ịkwa ákwá n’ebe ahụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị Judia.” N’akwụkwọ Jọn, Ἰουδαῖοι nwere ike mgbe ụfọdụ izo aka kpọmkwem n’ndị si Judia ma ọ bụ n’ndị isi Judia; ma n’ebe a, ọ na-ezo aka n’ìgwè ndị ya na Meri nọ n’ụlọ, na-akasi ya obi.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ οὖν Ἰουδαῖοι
  choice: Ya mere, ndị Juu[a]
  rationale: “Ya mere” na-egosi njikọ na ọganihu akụkọ nke οὖν. “Ndị Juu” bụ ntụgharị kpọmkwem na nke mmadụ nkịtị ga-aghọta, ebe ndetu ala peeji na-echekwa ohere nke “ndị Judia.”
- source_word: οἱ ὄντες μετ’ αὐτῆς ἐν τῇ οἰκίᾳ
  choice: ahụ ha na ya nọ n’ụlọ
  rationale: Nkebi a na-akọwapụta kpọmkwem ndị Juu a na-ekwu banyere ha, ma na-edebe echiche nke ịnọnyere Meri n’ime ụlọ.
- source_word: παραμυθούμενοι αὐτήν
  choice: na-akasi ya obi
  rationale: Nke a bụ ụzọ Igbo dị ndụ ma kwesị ekwesị isi kwuo inye onye nọ n’iru uju nkasi obi.
- source_word: ταχέως ἀνέστη καὶ ἐξῆλθεν
  choice: biliri ngwa ngwa pụọ
  rationale: “Biliri” ebe a pụtara isi n’oche ma ọ bụ n’ọnọdụ ịnọ ọdụ bilie, ọ bụghị mbilite n’ọnwụ; “pụọ” na-enye ἐξῆλθεν n’ụzọ Igbo dị nkenke.
- source_word: ἠκολούθησαν αὐτῇ
  choice: ha soro ya
  rationale: Ọ na-egosi iso Meri n’ụzọ anụ ahụ, na-enweghị itinye echiche pụrụ iche nke ịbụ onye na-eso ụzọ.
- source_word: δόξαντες
  choice: na-eche
  rationale: Ọ na-egosi ihe ha chere ma ọ bụ kwenyere na Meri na-eme, ọ bụghị ihe ha maara n’ezie.
- source_word: εἰς τὸ μνημεῖον
  choice: n’ili ahụ
  rationale: N’ọnọdụ olili ozu a, “ili” bụ okwu Igbo nkịtị na nke doro anya maka μνημεῖον.
- source_word: ἵνα κλαύσῃ ἐκεῖ
  choice: ịkwa ákwá n’ebe ahụ
  rationale: Ụdị infinitive a na-egosi ebumnuche njem ahụ n’Igbo dị mfe ma dị ndụ.
theological_decisions:
- issue: Ihe Ἰουδαῖοι pụtara n’akụkọ Jọn
  choice: ndị Juu
  alternative: ndị Judia
  rationale: N’ebe a okwu ahụ na-ezo aka n’ìgwè ndị na-eru uju nọnyere Meri, ọ bụghị ndị Juu niile ma ọ bụ naanị ndị isi ha. A na-edebe ntụgharị kpọmkwem n’ahụ ederede, ebe ndetu na-egosi nghọta mpaghara ala nke nwekwara ike ịdị.
translation_notes:
  register: Igbo izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E ji “na-akasi ya obi” gosipụta ọnọdụ iru uju n’ụzọ Igbo nkịtị; e zere okwu ụka pụrụ iche na nkọwa ga-eme ka Ἰουδαῖοι pụta dị ka ndị Juu niile.
