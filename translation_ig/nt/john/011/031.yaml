review_pass:
  verdict: revise
  source_fidelity: The draft conveys the verse’s participants, sequence, inference, destination, and purpose accurately. However, the rendering of the two coordinated actions by Mary needs an explicit coordinator, and the footnote’s explanation of the geographic sense of Ἰουδαῖοι is not idiomatic or precise in Igbo.
  naturalness: “ndị Juu ahụ ha na ya nọ n’ụlọ na-akasi ya obi” is understandable but syntactically crowded. A relative construction with a comma before the supplementary participial idea is clearer. “Meri biliri ngwa ngwa pụọ” should be “Meri biliri ngwa ngwa ma pụọ” for natural coordination.
  terminology: “ndị Juu” appropriately renders Ἰουδαῖοι here, with the alternative preserved in a footnote. “ili” is an acceptable natural rendering of μνημεῖον in this burial context; the demonstrative “ahụ” retains the definite reference.
  issues:
  - severity: medium
    issue: Mary’s actions are not explicitly coordinated.
    rationale: 'The Greek has ἀνέστη καὶ ἐξῆλθεν, ‘got up and went out.’ Igbo needs “ma” here: “biliri ngwa ngwa ma pụọ.”'
  - severity: medium
    issue: The footnote explains “ndị Judia” imprecisely and awkwardly.
    rationale: “n’ebe ndị Judia nọ” means ‘where the Judeans are,’ rather than identifying Judeans as people from Judea. The note should say “ndị si Judia” and identify the alternative referent naturally.
  - severity: low
    issue: The identifying phrase for the mourners is syntactically heavy.
    rationale: Recasting it as “ndị Juu ndị ahụ nọnyere ya n’ụlọ, na-akasi ya obi” is idiomatic Standard Igbo and preserves the Greek participial functions.
  revised_text: Ya mere, ndị Juu[a] ndị ahụ nọnyere ya n’ụlọ, na-akasi ya obi, mgbe ha hụrụ na Meri biliri ngwa ngwa ma pụọ, ha soro ya, na-eche na ọ na-aga n’ili ahụ ịkwa ákwá n’ebe ahụ.
