  to: Ya mere, ndị Juu[a] ndị ahụ nọnyere ya n’ụlọ, na-akasi ya obi, mgbe ha hụrụ na Meri biliri ngwa ngwa ma pụọ, ha soro ya, na-eche na ọ na-aga n’ili ahụ ịkwa ákwá n’ebe ahụ.
  rationale: The revision preserves the source’s narrative connective, identification of the Jewish mourners, their comforting activity, Mary’s rapid rising and departure, their following her based on an inference, and her presumed purpose of weeping at the tomb. It improves Standard Igbo syntax and corrects the lexical-alternative footnote without resolving the contextual ambiguity of Ἰουδαῖοι beyond what the verse supports.
