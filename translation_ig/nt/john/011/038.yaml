revisions:
- from: Ya mere, Jizọs bịara n’ili ahụ, obi ya nọkwa na-akpali ya nke ukwuu ọzọ[a]. Ili ahụ bụ ọgba, e jikwa nkume mechie ọnụ ya.
  to: Ya mere, Jizọs, ebe ọ nọkwa ọzọ n’oké ọgba aghara n’ime ya, bịaruru ili ahụ[a]. Ili ahụ bụ ọgba, nkume dịkwa n’ọnụ ya.
  rationale: A dochiri okwu nke nwere ike ịpụta na obi Jizọs na-akpali ya ka o mee ihe, jiri okwu na-egosi oké mkpali ma ọ bụ ọgba aghara dị n’ime ya. E mekwara nkọwa nkume ahụ ka ọ ghara ikwu karịa ihe Grik kwuru banyere ọnọdụ ya. Nkọwa ala peeji na-echekwa ambiguity gbasara ma ἐμβριμώμενος na-egosi iwe, ọgba aghara, ma ọ bụ mmetụta siri ike ọzọ.
