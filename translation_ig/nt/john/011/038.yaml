  text: Ἰησοῦς οὖν πάλιν ἐμβριμώμενος ἐν ἑαυτῷ ἔρχεται εἰς τὸ μνημεῖον· ἦν δὲ σπήλαιον, καὶ λίθος ἐπέκειτο ἐπ’ αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/038.yaml
  text: Jesus[a], then, again deeply moved within himself, came to the tomb. Now it was a cave, and a stone was lying against it.
translation:
  language: ig
  text: Ya mere, Jizọs, ebe ọ nọkwa ọzọ n’oké ọgba aghara n’ime ya, bịaruru ili ahụ[a]. Ili ahụ bụ ọgba, nkume dịkwa n’ọnụ ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “iwe were ya n’ime ya,” ma ọ bụ “oke nsogbu dị n’ime ya.” Ngwaa Grik a siri ike nke ukwuu, o nwekwara ike ịpụta ihe karịrị mwute naanị.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Ya mere
  rationale: Na-egosi njikọ na ihe mere tupu nke a, ma na-aga n’ihu n’akụkọ ahụ n’asụsụ Igbo dị mfe.
- source_word: πάλιν
  choice: ọzọ
  rationale: Na-egosi na mmetụta siri ike a ebilitela ọzọ, dịka ọ dị na ihe e kwuru tupu amaokwu a.
- source_word: ἐμβριμώμενος ἐν ἑαυτῷ
  choice: obi ya nọkwa na-akpali ya nke ukwuu
  rationale: Na-echekwa ịdị ike nke mmetụta ahụ n’enweghị ikpebi na ọ bụ naanị mwute ma ọ bụ naanị iwe; okwu ahụ na-ekwukwa na mmetụta ahụ dị n’ime ya.
- source_word: ἔρχεται
  choice: bịara
  rationale: Ọ bụ ezie na Grik ji historical present, oge gara aga bụ ụzọ nkịtị e si akọ ihe a n’Igbo.
- source_word: μνημεῖον
  choice: ili
  rationale: N’ebe a, ọ pụtara ebe e liri mmadụ; nkọwa na-esochi ya gosiri na ọ bụ ili dị n’ọgba.
- source_word: σπήλαιον
  choice: ọgba
  rationale: Nke a bụ okwu Igbo doro anya ma bụrụkwa ihe σπήλαιον pụtara kpọmkwem.
- source_word: λίθος
  choice: nkume
  rationale: Ọ bụ okwu Igbo nkịtị maka λίθος, ebe ọ na-ekwu maka nkume e ji gbochie ọnụ ili.
- source_word: ἐπέκειτο ἐπ’ αὐτῷ
  choice: e jikwa nkume mechie ọnụ ya
  rationale: N’ihi na ili ahụ bụ ọgba, ntụgharị a na-egosi ọnọdụ nkume ahụ n’ọnụ ụzọ ya n’ụzọ ndị Igbo ga-aghọta ozugbo, n’agbanyeghị na Grik kwuru n’ụzọ sara mbara na nkume ahụ dị n’elu/megide ya.
theological_decisions:
- issue: Ike na ụdị mmetụta ἐμβριμώμενος na-ekwu banyere Jizọs
  choice: E gosiri na obi Jizọs kpaliri nke ukwuu, ma e kpebighị kpọmkwem ma mmetụta ahụ bụ mwute, iwe, ma ọ bụ ọgba aghara n’obi.
  alternative: “iwe were ya n’ime obi ya” ma ọ bụ “obi ya nọ na-enye ya nnukwu nsogbu”
  rationale: Ngwaa Grik ahụ siri ike, ọ pụkwara ịgụnye iwe ma ọ bụ oké ọgba aghara n’obi. Isi ederede na-echekwa nghọta sara mbara ahụ, ebe nkọwa ala peeji na-egosi ụzọ ndị ọzọ e nwere ike isi ghọta ya.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ “obi ya nọkwa na-akpali ya nke ukwuu” iji zere ime ka mmetụta Jizọs bụrụ naanị mwute ma ọ bụ naanị iwe. A kọwara ọnọdụ nkume ahụ n’ụzọ eke dịka nkume e ji mechie ọnụ ọgba ahụ.
