review_pass:
  verdict: revise
  source_fidelity: The draft correctly identifies the tomb as a cave and preserves the repeated, intense inward emotion. However, “obi ya nọkwa na-akpali ya” can suggest that his heart was urging or prompting him, rather than that he himself was strongly stirred. “E jikwa nkume mechie ọnụ ya” also states explicitly that the stone closed the entrance, whereas the Greek more conservatively describes the stone’s position upon/against the tomb.
  naturalness: The revised wording uses natural Standard Igbo while retaining a sober biblical register. “N’oké ọgba aghara n’ime ya” communicates strong inward disturbance without making a decision for sorrow or indignation.
  terminology: “Ili,” “ọgba,” and “nkume” are appropriate. The footnote retains the possible nuance of indignation and avoids treating it as the only meaning.
  issues:
  - severity: medium
    issue: The expression “obi ya nọkwa na-akpali ya nke ukwuu” is semantically imprecise.
    rationale: In ordinary Igbo it may mean that his heart was impelling him or making him act. It does not clearly render the Greek participle’s inward, intense emotional agitation.
  - severity: low
    issue: “E jikwa nkume mechie ọnụ ya” is stronger and more specific than the source description.
    rationale: The Greek says that a stone was lying upon/against it. Describing the stone as being at the entrance preserves the likely physical sense without asserting the action of closing.
  revised_text: Ya mere, Jizọs, ebe ọ nọkwa ọzọ n’oké ọgba aghara n’ime ya, bịaruru ili ahụ[a]. Ili ahụ bụ ọgba, nkume dịkwa n’ọnụ ya.
  revised_footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “iwe were ya n’ime ya,” ma ọ bụ “oke nsogbu dị n’ime ya.” Ngwaa Grik a siri ike nke ukwuu, o nwekwara ike ịpụta ihe karịrị mwute naanị.
    reason: lexical_alternative
  revision_rationale: A dochiri okwu nke nwere ike ịpụta na obi Jizọs na-akpali ya ka o mee ihe, jiri okwu na-egosi oké mkpali ma ọ bụ ọgba aghara dị n’ime ya. E mekwara nkọwa nkume ahụ ka ọ ghara ikwu karịa ihe Grik kwuru banyere ọnọdụ ya. Nkọwa ala peeji na-echekwa ambiguity gbasara ma ἐμβριμώμενος na-egosi iwe, ọgba aghara, ma ọ bụ mmetụta siri ike ọzọ.
