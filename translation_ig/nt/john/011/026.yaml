  text: καὶ πᾶς ὁ ζῶν καὶ πιστεύων εἰς ἐμὲ οὐ μὴ ἀποθάνῃ εἰς τὸν αἰῶνα· πιστεύεις τοῦτο;
base_translation:
  language: en
  yaml_path: translation/nt/john/011/026.yaml
  text: And everyone who lives and believes in me will certainly never die forever. Do you believe this?
translation:
  language: ig
  text: Onye ọ bụla dị ndụ ma na-ekwere na m, agaghị anwụ ruo mgbe ebighị ebi. Ì kwere nke a?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πᾶς ὁ ζῶν
  choice: Onye ọ bụla dị ndụ
  rationale: 'Na-egosipụta nkebi aha ahụ n''ụzọ doro anya ma bụrụkwa Igbo nkịtị: onye ọ bụla nke dị ndụ.'
- source_word: πιστεύων εἰς ἐμέ
  choice: kwere na m
  rationale: N'Igbo, ‘ikwere na’ bụ ụzọ ebumpụta ụwa isi gosipụta ntụkwasị obi e tinyere n'ime onye, dịka εἰς ἐμέ si kwuo.
- source_word: οὐ μὴ ἀποθάνῃ
  choice: agaghị anwụ
  rationale: οὐ μή bụ nkwusioru siri ike; ‘agaghị’ na-egosipụta nkwenye ahụ n'ụzọ doro anya n'Igbo.
- source_word: εἰς τὸν αἰῶνα
  choice: ruo mgbe ebighị ebi
  rationale: Na-echekwa nkebi oge ahụ kpọmkwem kama ịhapụ ya; ọ pụtara na ọnwụ ahụ agaghị adị ruo mgbe ebighị ebi.
- source_word: πιστεύεις τοῦτο;
  choice: Ì kwere nke a?
  rationale: Ajụjụ kpọmkwem, dị mfe, nke na-echekwa ike nke okwu Jizọs.
theological_decisions:
- issue: Mmekọrịta ‘dị ndụ’ na ‘agaghị anwụ ruo mgbe ebighị ebi’ n'agbanyeghị ọnwụ anụ ahụ
  choice: E debere okwu abụọ ahụ n'enweghị nkọwa agbakwunyere.
  alternative: Ịkọwa ya dịka ‘ọ gaghị anwụ n'ụzọ ime mmụọ’ ma ọ bụ ‘ọ ga-adị ndụ ọzọ.’
  rationale: Amaokwu ahụ n'onwe ya nwere esemokwu pụtara ìhè n'etiti ịdị ndụ, okwukwe, na ọnwụ; ịkọwa ụdị ọnwụ ọ bụ n'ime ntụgharị ga-emechi nghọta Akwụkwọ Nsọ hapụrụ oghe.
translation_notes:
  register: Standard Igbo dị ugbu a, dị mfe ma nwee ugwu. E ji ‘ruo mgbe ebighị ebi’ chekwaa εἰς τὸν αἰῶνα n'ụzọ doro anya, ma a zere okwu ụka pụrụ iche ma ọ bụ nkọwa agbakwunyere.
