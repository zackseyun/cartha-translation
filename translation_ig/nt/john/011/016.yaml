id: JHN.11.16
reference: John 11:16
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἶπεν οὖν Θωμᾶς ὁ λεγόμενος Δίδυμος τοῖς συμμαθηταῖς· Ἄγωμεν καὶ ἡμεῖς ἵνα ἀποθάνωμεν μετ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/016.yaml
  text: So Thomas[a], called Didymus, said to his fellow disciples, “Let us also go, so that we may die with him.”
translation:
  language: ig
  text: Ya mere, Tọmọs[a], onye a na-akpọ Didimọs, sịrị ndị ibe ya bụ ndị na-eso ụzọ, “Ka anyị kwa gaa, ka anyị na ya nwụọ.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Didimọs bụ okwu Grik nke pụtara “Ejima.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Ya mere
  rationale: Ọ na-egosi njikọ nke echiche na ihe ndị bu ụzọ mee; ‘Ya mere’ bụ okwu Igbo doro anya ma kwekọọ n'ụzọ akụkọ ahụ si aga.
- source_word: Θωμᾶς
  choice: Tọmọs
  rationale: E depụtara aha onye ahụ n'ụdị a na-asụkarị n'Igbo.
- source_word: ὁ λεγόμενος Δίδυμος
  choice: onye a na-akpọ Didimọs
  rationale: E debere aha Grik Didimọs n'ahịrịokwu ahụ, ebe nkọwa ala peeji na-akọwa na ọ pụtara ‘Ejima,’ si otú ahụ chekwaa ma ọdịdị aha ahụ ma ihe ọ pụtara.
- source_word: τοῖς συμμαθηταῖς
  choice: ndị na-eso ụzọ ibe ya
  rationale: Nke a na-egosi ndị ha na Tọmọs bụ ndị na-eso ụzọ ọnụ, n'Igbo dị mfe nghọta.
- source_word: Ἄγωμεν
  choice: Ka anyị ... gaa
  rationale: Ọ bụ agbamume onye mbụ ọtụtụ; ‘Ka anyị gaa’ na-egosipụta ya nke ọma n'Igbo.
- source_word: καὶ ἡμεῖς
  choice: anyị onwe anyị sokwa
  rationale: ‘Onwe anyị’ na ‘sokwa’ na-echekwa nkwusi ike nke καὶ ἡμεῖς, na-egosi na Tọmọs na ndị ibe ya ga-esokwa Jizọs.
- source_word: ἵνα ἀποθάνωμεν
  choice: ka anyị ... nwụọ
  rationale: Ọ na-echekwa njikọ ebumnuche ma ọ bụ ihe a tụrụ anya ya, n'ekwughị ma okwu ahụ bụ obi ike, enweghị olileanya, ma ọ bụ ịkwa emo.
- source_word: μετ’ αὐτοῦ
  choice: na ya
  rationale: Ọ na-egosi iso onye ahụ—Jizọs n'ọnọdụ a—nwụọ, n'ụzọ dị mkpirikpi ma bụrụkwa Igbo nkịtị.
theological_decisions:
- issue: Ụda olu na ebumnuche okwu Tọmọs
  choice: E depụtara okwu ahụ n'ụzọ kwụ ọtọ, n'enweghị ịkọwa ọnọdụ obi Tọmọs.
  alternative: Ịkọwa ya dịka nkwụsi ike nke onye nwere obi ike, nkụda mmụọ, ma ọ bụ okwu ịkwa emo.
  rationale: Grik anaghị ekpebi kpọmkwem ụdị ụda olu Tọmọs ji kwuo ya; nsụgharị ahụ na-ahapụ mgbagwoju anya a dịka ọ dị.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. A hapụrụ okwu Tọmọs ka ọ nwee otu mgbagwoju anya nke dị na Grik, n'etinyeghị nkọwa banyere ọnọdụ obi ya.
