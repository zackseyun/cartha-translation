revisions:
- from: Ya mere, Tọmọs[a], onye a na-akpọ Didimọs, sịrị ndị na-eso ụzọ ibe ya, “Ka anyị onwe anyị sokwa gaa, ka anyị na ya nwụọ.”
  to: Ya mere, Tọmọs[a], onye a na-akpọ Didimọs, sịrị ndị ibe ya bụ ndị na-eso ụzọ, “Ka anyị kwa gaa, ka anyị na ya nwụọ.”
  rationale: The revision retains the Greek sequence and ambiguity, including the possible range of Thomas’s tone, while using more idiomatic Standard Igbo for “fellow disciples” and for the inclusive emphasis of καὶ ἡμεῖς. The name and explanatory footnote remain intact.
  reviewer_model: gpt-5.6-terra
