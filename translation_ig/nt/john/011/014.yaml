id: JHN.11.14
reference: John 11:14
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τότε οὖν εἶπεν αὐτοῖς ὁ Ἰησοῦς παρρησίᾳ· Λάζαρος ἀπέθανεν,
base_translation:
  language: en
  yaml_path: translation/nt/john/011/014.yaml
  text: So then Jesus told them plainly[a], “Lazarus has died.”
translation:
  language: ig
  text: Ya mere, Jizọs gwara ha hoo haa[a], “Lazarọs anwụọla.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Mgbe ahụ, Jizọs gwara ha n'ụzọ ghe oghe, ‘Lazarọs nwụrụ.’”
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε οὖν
  choice: Ya mere
  rationale: Ngwakọta okwu abụọ a na-egosi ntụgharị nke akụkọ na ihe si n'okwu gara aga pụta. “Ya mere” na-egosipụta njikọ ahụ n'Igbo nkịtị n'enweghị ikwughachi okwu n'ụzọ siri ike.
- source_word: εἶπεν αὐτοῖς
  choice: gwara ha
  rationale: “Gwara ha” bụ ụzọ Igbo dị mma isi kwuo na Jizọs kpọọrọ ha ozi ahụ kpọmkwem.
- source_word: παρρησίᾳ
  choice: hoo haa
  rationale: N'ọnọdụ a, okwu ahụ na-egosi ikwu ihe n'ụzọ doro anya, n'enweghị ihe atụ ma ọ bụ okwu nwere ike ịgbagwoju anya; “hoo haa” bụ okwu Igbo e ji egosi nke a.
- source_word: Λάζαρος
  choice: Lazarọs
  rationale: E dere aha onye ahụ n'ụdị ntụgharị mkpụrụokwu kwekọrọ n'usoro na ụda Igbo.
- source_word: ἀπέθανεν
  choice: anwụọla
  rationale: Aorist ahụ na-ekwu maka ọnwụ mere eme. “Anwụọla” na-egosi ihe ahụ emechaala ma ọnọdụ ya ka dị mkpa ugbu a.
theological_decisions:
- issue: Ihe okwu Jizọs kwuru pụtara banyere ọnọdụ Lazarọs
  choice: O kwuru kpọmkwem na Lazarọs anwụọla n'anụ ahụ.
  alternative: Iji okwu “ụra” nke amaokwu ndị bu ụzọ mee ihe ọzọ.
  rationale: N'ebe a, isi mmalite ahụ ji ἀπέθανεν kọwaa okwu ihe atụ banyere ụra nke dị na mbụ. Ya mere, nsụgharị ahụ ekwesịghị ime ka ihe a ka bụrụ ihe mgbagwoju anya.
translation_notes:
  register: Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. “Hoo haa” bụ akpaalaokwu a maara nke ọma maka ikwu ihe n'ụzọ doro anya; ndetu ala peeji na-enye nsụgharị dị ntakịrị ka nke nkịtị.
