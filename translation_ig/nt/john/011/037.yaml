id: JHN.11.37
reference: John 11:37
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τινὲς δὲ ἐξ αὐτῶν εἶπαν· Οὐκ ἐδύνατο οὗτος ὁ ἀνοίξας τοὺς ὀφθαλμοὺς τοῦ τυφλοῦ ποιῆσαι ἵνα καὶ οὗτος μὴ ἀποθάνῃ;
base_translation:
  language: en
  yaml_path: translation/nt/john/011/037.yaml
  text: But some of them said[a], “Could not this man, who opened the eyes of the blind man, also have made it so that this man would not die?”
translation:
  language: ig
  text: Ma ụfọdụ n’ime ha kwuru[a], “Nwoke a, onye meghere anya nwoke ahụ kpuru ìsì, ọ̀ pụghịkwa ime ka nwoke a ghara ịnwụ?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Ọ̀ pụghị igbochi nwoke a ịnwụ?”
    reason: lexical_alternative
lexical_decisions:
- source_word: τινὲς δὲ ἐξ αὐτῶν
  choice: Ma ụfọdụ n’ime ha
  rationale: ‘Ụfọdụ n’ime ha’ na-egosipụta τινὲς ἐξ αὐτῶν nke ọma; ‘Ma’ na-ebuga ọdịiche δέ dị n’etiti okwu a na nzaghachi ndị bu ya ụzọ.
- source_word: εἶπαν
  choice: kwuru
  rationale: Aorist indicative bụ omume akụkọ gara aga, ya mere ‘kwuru’ bụ nsụgharị Igbo dị mfe ma kwekọọ.
- source_word: Οὐκ ἐδύνατο
  choice: ọ̀ pụghịkwa
  rationale: Ajụjụ a bụ nke na-atụ anya na o nwere ike ime ya; ‘ọ̀ pụghị’ na-edobe ikike n’oge gara aga site n’ọnọdụ akụkọ ahụ, ebe ‘-kwa’ jikọtara καί.
- source_word: οὗτος
  choice: Nwoke a
  rationale: Ngosipụta a na-arụtụ aka n’ebe Jizọs nọ n’ụzọ doro anya ma dịtụ nkọ karịa iji naanị nnọchiaha.
- source_word: ὁ ἀνοίξας τοὺς ὀφθαλμοὺς τοῦ τυφλοῦ
  choice: onye meghere anya nwoke ahụ kpuru ìsì
  rationale: Nkebiokwu ‘onye meghere’ na-egosipụta participle ahụ n’ụzọ Igbo ebumpụta ụwa; ‘nwoke ahụ kpuru ìsì’ na-arụtụ aka n’otu nwoke a maara site n’akụkọ Jọn 9.
- source_word: ποιῆσαι ἵνα
  choice: ime ka
  rationale: ‘Ime ka’ bụ ụzọ Igbo dị nkenke ma kwekọọ iji gosipụta echiche causative nke ποιῆσαι ἵνα.
- source_word: καὶ
  choice: -kwa
  rationale: Mgbakwunye ‘-kwa’ na-egosi na onye gwọrọ ikpu ìsì gaara enwekwa ike igbochi ọnwụ.
- source_word: οὗτος μὴ ἀποθάνῃ
  choice: nwoke a ghara ịnwụ
  rationale: ‘Nwoke a’ na-arụtụ aka na Lazarọs ma na-edobe demonstrative Grik; ‘ghara ịnwụ’ bụ ụzọ Igbo ebumpụta ụwa isi gosipụta ἵνα na negation.
theological_decisions:
- issue: Ụda ajụjụ ndị na-ekwu okwu
  choice: E depụtara ya dị ka ajụjụ rhetorical nwere obi abụọ ma na-atụ aro na Jizọs gaara egbochi Lazarọs ịnwụ.
  alternative: Ịsụgharị ya dị ka ajụjụ nkịtị na-enweghị ụda nkatọ.
  rationale: Ụdị Οὐκ ἐδύνατο na-atụ anya azịza nkwenye ma nwee nkatọ zoro ezo. Nsụgharị ahụ na-edobe esemokwu a n’agbakwụnyeghị ebubo nke ederede ekwughị.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. ‘Nwoke a’ ugboro abụọ na-edobe nrụtụ aka abụọ nke οὗτος—nke mbụ bụ Jizọs, nke abụọ bụ Lazarọs—ebe ‘ime ka ... ghara ịnwụ’ na-enye Igbo ebumpụta ụwa n’enweghị iwepụ echiche causative nke Grik.
