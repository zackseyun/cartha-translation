id: JHN.11.34
reference: John 11:34
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ εἶπεν· Ποῦ τεθείκατε αὐτόν; λέγουσιν αὐτῷ· Κύριε, ἔρχου καὶ ἴδε.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/034.yaml
  text: And he said[a], “Where have you laid him?” They said to him, “Lord, come and see.”
translation:
  language: ig
  text: O wee sị, “Olee ebe unu tọgbọrọ ya?” Ha sịrị ya, “Onyenwe anyị[a], bịa hụ.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Nna ukwu, bịa hụ.” Okwu Grik bụ κύριε nwekwara ike ịbụ ụzọ nkwanye ùgwù e si agwa mmadụ okwu; ma e debere “Onyenwe anyị” n’ahịrị bụ isi.
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπεν
  choice: O wee sị
  rationale: A nọgidere na ngwaa nkịtị pụtara ikwu okwu, kama ịgbanwe ya ka ọ bụrụ ‘jụọ,’ ọ bụ ezie na ihe o kwuru bụ ajụjụ.
- source_word: Ποῦ
  choice: Olee ebe
  rationale: Nke a bụ ụzọ Igbo dị ndụ na nke doro anya e si ajụ maka ebe ihe dị.
- source_word: τεθείκατε
  choice: unu tọgbọrọ
  rationale: Okwu a na-egosi na ha eburu ụzọ dọba ozu Lazarọs n’otu ebe. ‘Tọgbọrọ’ dabara n’ọnọdụ ozu ma ghara ịkọwa ya kpọmkwem dị ka ili ya.
- source_word: αὐτόν
  choice: ya
  rationale: Nnọchiaha a na-arụtụ aka n’ebe Lazarọs nọ.
- source_word: λέγουσιν
  choice: Ha sịrị
  rationale: Ọ bụ ezie na Grik ji oge ugbu a n’akụkọ, oge gara aga bụ usoro ebumpụta ụwa n’akụkọ Igbo.
- source_word: Κύριε
  choice: Onyenwe anyị
  rationale: Ọ na-echekwa ma nkwanye ùgwù e ji akpọ Jizọs ma ohere okwu ahụ nwere ibu nghọta metụtara onye ọ bụ.
- source_word: ἔρχου
  choice: bịa
  rationale: Ọ bụ oku ma ọ bụ iwu dị mfe ka onye ahụ bịakwute ha.
- source_word: ἴδε
  choice: hụ
  rationale: '‘Hụ’ bụ ụzọ Igbo ebumpụta ụwa e si jikọta okwu abụọ a: ‘bịa hụ.’'
theological_decisions:
- issue: Otu e si sụgharị κύριε mgbe a na-agwa Jizọs okwu
  choice: Onyenwe anyị
  alternative: Nna anyị ukwu
  rationale: ‘Onyenwe anyị’ na-echekwa ohere nke okwu ahụ ịbụ ihe karịrị naanị aha nkwanye ùgwù, ma ihe odide n’onwe ya anaghị amanye ka a kpebie na ndị kwuru ya ghọtara ihe niile okwu ahụ nwere ike ịpụta. E debere ihe ọzọ ọ pụrụ ịpụta n’ala ala peeji.
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe nke oge a, dị mfe ma nwee ugwu. A họọrọ ‘Olee ebe’ na ‘bịa hụ’ maka ịdị n’ọnụ, ebe ‘tọgbọrọ’ na-echekwa echiche nke idọba ozu n’ebe a na-eli mmadụ n’agbanyeghị na ọ naghị agbakwunye ngwaa ‘ili’ nke na-adịghị na Grik.
