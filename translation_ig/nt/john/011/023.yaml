  text: λέγει αὐτῇ ὁ Ἰησοῦς· Ἀναστήσεται ὁ ἀδελφός σου.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/023.yaml
  text: Jesus says to her[a], “Your brother will rise again.”
translation:
  language: ig
  text: Jizọs sịrị ya, “Nwanne gị nwoke ga-ebili ọzọ[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Nwanne gị nwoke ga-ebili.” Ngwaa Grik ahụ nwere ike ịpụta naanị “ga-ebili”; “ọzọ” na-eme ka echiche mbilite n’ọnwụ pụta ìhè n’Igbo.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: sịrị
  rationale: Ọ bụ ezie na Grik ji oge ugbu a n’akụkọ ihe mere eme, Igbo nkịtị na nke dị ùgwù na-eji oge gara aga, “sịrị,” mee ka akụkọ ahụ bụrụ ihe a na-aghọta nke ọma.
- source_word: αὐτῇ
  choice: ya
  rationale: “Ya” na-egosi onye nwanyị ahụ Jizọs gwara okwu n’ụzọ Igbo si ekwu ya nke ọma.
- source_word: Ἀναστήσεται
  choice: ga-esi n’ọnwụ bilie
  rationale: N’ebe a, ngwaa ahụ pụtara ibili n’ọnwụ. Nke a na-eme ka echiche mbilite n’ọnwụ doo anya n’Igbo, ma ọ naghị agbanwe ya ka ọ bụrụ okwu nnabata nke na-akọwapụta onye mere ka o bilie.
- source_word: ὁ ἀδελφός σου
  choice: nwanne gị nwoke
  rationale: “Nwanne” naanị ya anaghị akọwa nwoke ma ọ bụ nwanyị n’Igbo; ịgbakwunye “nwoke” na-echekwa kpọmkwem na onye a bụ nwanne nwoke Mata.
- source_word: ὁ Ἰησοῦς
  choice: Jizọs
  rationale: A sụgharịghị aha ahụ kama e dere ya n’ụdị mkpụrụokwu dabara n’Igbo ọkọlọtọ.
theological_decisions:
- issue: Okwu gbasara mbilite n’ọnwụ
  choice: ga-esi n’ọnwụ bilie
  alternative: ga-ebili; a ga-eme ka o bilie
  rationale: Nhọrọ a na-egosi na okwu ahụ metụtara mbilite n’ọnwụ, ma ọ naghị ekpebi n’amaokwu a ma Jizọs na-ekwu maka nlọghachi Lazarọs ozugbo ma ọ bụ mbilite n’ọnwụ ikpeazụ. Ọ naghịkwa eme ka onye na-eme ka o bilie pụta ìhè karịa ka ụdị ngwaa Grik si mee.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ nke oge a, dị mfe ma dị ùgwù. A họọrọ “sịrị” karịa oge ugbu a n’ihi na nke ahụ bụ ụzọ akụkọ Igbo si ada nke ọma; a họọrọ “nwanne gị nwoke” iji zere mgbagwoju anya nke “nwanne”.
