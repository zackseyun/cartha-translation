  rationale: The revision removes the added phrase “site n’ọnwụ” from the main text and uses the natural Igbo resurrection expression “ga-ebili ọzọ.” The footnote preserves the more formally minimal sense of the Greek verb without deciding more than the verse itself states about the timing or manner of the rising.
