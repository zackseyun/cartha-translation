review_pass:
  verdict: revise
  source_fidelity: The future middle ἀναστήσεται is well conveyed by a future form of “bilie.” However, “ga-esi n’ọnwụ bilie” explicitly adds “from death,” whereas the Greek verb itself simply says “will rise,” with the resurrection sense supplied by context. “Ọzọ” reflects the contextual resurrection sense while allowing a footnote to retain the less explicit alternative, as in the English audit trail.
  naturalness: “Jizọs sịrị ya” and “nwanne gị nwoke” are natural, clear Standard Igbo. “Ga-ebili ọzọ” is idiomatic in a resurrection context and is more concise than “ga-esi n’ọnwụ bilie.”
  terminology: “Jizọs” is the established Igbo form. “Nwanne gị nwoke” appropriately preserves the explicitly masculine ἀδελφός. “Bilie” retains the active/intransitive nuance of the Greek rather than introducing an agent with a passive expression.
  issues:
  - severity: low
    issue: The draft makes “from death” explicit in the main text.
    rationale: Although Lazarus’s death makes resurrection the contextual sense, ἀναστήσεται does not explicitly contain “from death.” A closer rendering should retain “will rise,” while a note can explain the resurrection sense and the optional “again.”
