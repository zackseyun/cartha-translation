review_pass:
  verdict: revise
  source_fidelity: The draft accurately identifies Lazarus, the tomb, and the elapsed four-day duration. However, εὗρεν is more directly rendered by “ọ hụrụ” in this construction; “ọ chọpụtara” shifts toward ‘discovered/realized’ rather than Jesus’ finding the established situation on arrival. The narrative connective οὖν is suitably retained as “Ya mere.”
  naturalness: “Mgbe Jizọs bịarutere, ọ hụrụ na ...” is natural Standard Igbo narrative. “Anọworị ụbọchị anọ n’ili” clearly and idiomatically expresses that Lazarus had already been in the tomb for four days.
  terminology: “Jizọs,” “Lazarọs,” and “ili” are appropriate Standard Igbo biblical terms. No theological terminology or textual ambiguity requires a note.
  issues:
  - severity: medium
    issue: “ọ chọpụtara” for εὗρεν
    rationale: Although intelligible, “chọpụta” commonly emphasizes discovering or realizing. In this verse εὗρεν introduces what Jesus found upon arriving, for which “ọ hụrụ na” is a closer and more idiomatic rendering.
  revised_text: Ya mere, mgbe Jizọs bịarutere, ọ hụrụ na Lazarọs anọworị ụbọchị anọ n’ili.
