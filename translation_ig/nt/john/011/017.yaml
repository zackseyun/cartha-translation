id: JHN.11.17
reference: John 11:17
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἐλθὼν οὖν ὁ Ἰησοῦς εὗρεν αὐτὸν τέσσαρας ⸂ἤδη ἡμέρας⸃ ἔχοντα ἐν τῷ μνημείῳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/017.yaml
  text: So when Jesus arrived, he found that Lazarus had already been in the tomb four days.
translation:
  language: ig
  text: Ya mere, mgbe Jizọs bịarutere, ọ hụrụ na Lazarọs anọworị ụbọchị anọ n’ili.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐλθὼν
  choice: mgbe Jizọs bịarutere
  rationale: Aorist participle a na-egosi ihe mere tupu ngwaa bụ isi; nkebiokwu a na-asụ Igbo nke ọma ma na-egosi oge Jizọs rutere.
- source_word: οὖν
  choice: Ya mere
  rationale: Ọ bụ njikọ akụkọ na-ejikọta ihe a na ihe ndị bu ya ụzọ; “Ya mere” na-edobe usoro echiche na akụkọ.
- source_word: εὗρεν
  choice: ọ chọpụtara
  rationale: N’ebe a, εὑρίσκω pụtara ịmata ọnọdụ mmadụ hụrụ mgbe ọ bịarutere, ọ bụghị nanị ịchọta onye furu efu.
- source_word: αὐτὸν
  choice: Lazarọs
  rationale: Ọ bụ Lazarọs ka nnọchiaha ahụ na-arụtụ aka. Ịkpọ aha ya na-eme ka Igbo doo anya n’etinyeghị ozi ọhụrụ.
- source_word: τέσσαρας ἤδη ἡμέρας ἔχοντα
  choice: anọọlarị ụbọchị anọ
  rationale: Nke a bụ ụzọ Igbo si egosi oge gafere ruo ụbọchị anọ; “-larị” na-eburu echiche ἤδη, ya bụ “already.”
- source_word: μνημείῳ
  choice: n’ili
  rationale: μνημεῖον bụ ebe e liri mmadụ; “ili” bụ okwu Igbo nkịtị, ziri ezi ma kwekọọ n’ọnọdụ a.
theological_decisions:
- issue: Ime ka onye αὐτόν na-arụtụ aka pụta ìhè
  choice: Ịkpọ Lazarọs aha kpọmkwem
  alternative: Iji nnọchiaha “ya”
  rationale: Ihe odide Grik ji nnọchiaha nke onye ọ na-arụtụ aka doro anya site n’ihe gbara ya gburugburu. Ịkpọ Lazarọs aha na-ewepụ mgbagwoju anya n’Igbo n’agbanweghi ihe amaokwu ahụ pụtara.
- issue: Ihe ụbọchị anọ ahụ na-akọwa
  choice: Oge Lazarọs nọrọla n’ili
  alternative: Ịsụ ya n’ụzọ nkịtị dịka “o nwere ụbọchị anọ n’ili”
  rationale: Usoro okwu Grik na-egosi ogologo oge o jirila n’ili. A sụgharịrị ya n’Igbo eke n’etinyeghị nkọwa ọzọ banyere mgbe ọ nwụrụ ma ọ bụ mgbe e liri ya.
translation_notes:
  register: Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E jiri “Jizọs,” “Lazarọs,” na “ili,” bụ ụdị okwu ndị a na-aghọta nke ọma n’Igbo. Enweghị akara nkọwa ala peeji n’amaokwu a.
