- from: Ya mere, mgbe Jizọs bịarutere, ọ chọpụtara na Lazarọs anọọlarị ụbọchị anọ n’ili.
  to: Ya mere, mgbe Jizọs bịarutere, ọ hụrụ na Lazarọs anọworị ụbọchị anọ n’ili.
  rationale: The revision replaces “ọ chọpụtara” with “ọ hụrụ na” to represent εὗρεν more faithfully in context, while retaining the explicit referent Lazarọs, the narrative connection, the completed four-day duration, and the tomb setting.
