  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἔπειτα μετὰ τοῦτο λέγει τοῖς μαθηταῖς· Ἄγωμεν εἰς τὴν Ἰουδαίαν πάλιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/007.yaml
  text: Then after this he says to the disciples[a], “Let us go into Judea again.”
translation:
  language: ig
  text: Mgbe nke a gasịrị, ọ gwara ndị na-eso ụzọ, “Ka anyị gaa Judia[a] ọzọ.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “banye na Judia ọzọ.” Okwu Grik ahụ pụrụ ịpụta ịga Judia ma ọ bụ ịbanye n’ógbè Judia.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔπειτα μετὰ τοῦτο
  choice: Mgbe nke a gasịrị
  rationale: Nke a na-egosi usoro oge n’ụzọ Igbo doro anya ma dịkwa eke, n’agbanyeghị na okwu Grik abụọ ahụ jikọtara echiche ‘mgbe e mesịrị’ na ‘mgbe nke a gasịrị.’
- source_word: λέγει
  choice: ọ gwara
  rationale: Ọ bụ ezie na Grik ji ngwaa oge ugbu a mee ka akụkọ dị ndụ, oge gara aga bụ ụzọ Igbo si akọ akụkọ a nke ọma n’enweghị echiche na omume ahụ ka na-aga n’ihu.
- source_word: τοῖς μαθηταῖς
  choice: ndị na-eso ụzọ ya
  rationale: ‘Ndị na-eso ụzọ’ bụ okwu Igbo a na-aghọta nke ọma; ‘ya’ na-eme ka onye ha na-eso doo anya dịka ọnọdụ akụkọ ahụ si gosi, ọ bụ ezie na Grik ekwughị ya iche.
- source_word: Ἄγωμεν
  choice: Ka anyị gaa
  rationale: Nke a na-egosipụta ngwaa Grik nke na-akpọ ndị ọzọ ka ha soro onye na-ekwu okwu mee njem ahụ.
- source_word: εἰς τὴν Ἰουδαίαν
  choice: gaa Judia
  rationale: N’Igbo, ‘gaa Judia’ bụ ụzọ eke isi kwuo njem a na-aga n’ebe ahụ; ọ nwere ike ikpuchi echiche nke ịga ruo ma ọ bụ ịbanye n’ógbè ahụ.
- source_word: πάλιν
  choice: ọzọ
  rationale: ‘Ọzọ’ na-egosi n'ụzọ dị mfe na ha ga-alaghachi n’ógbè ha gara na mbụ.
theological_decisions:
- issue: Oge ugbu a e ji akọ akụkọ na Jọn
  choice: Jiri oge gara aga, ‘ọ gwara,’ nke bụ usoro akụkọ Igbo dị eke.
  alternative: ‘ọ na-agwa,’ iji mee ka oge ugbu a nke Grik pụta ìhè.
  rationale: ‘Ọ na-agwa’ nwere ike ime ka onye na-agụ Igbo chee na okwu ahụ bụ omume na-aga n’ihu. ‘Ọ gwara’ na-ebufe ihe mere n’akụkọ ahụ nke ọma, ebe ọ naghị agbanwe ihe ọ pụtara ma ọ bụ tinye nkọwa okpukpe.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-agbaso usoro akụkọ Igbo eke, ma na-edobe ọkpụkpọ òkù dị na ‘Ka anyị gaa.’
