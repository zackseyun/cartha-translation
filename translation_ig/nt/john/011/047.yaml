id: JHN.11.47
reference: John 11:47
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: συνήγαγον οὖν οἱ ἀρχιερεῖς καὶ οἱ Φαρισαῖοι συνέδριον, καὶ ἔλεγον· Τί ποιοῦμεν ὅτι οὗτος ὁ ἄνθρωπος πολλὰ ⸂ποιεῖ σημεῖα⸃;
base_translation:
  language: en
  yaml_path: translation/nt/john/011/047.yaml
  text: So the chief priests and the Pharisees gathered a council and were saying[a], “What are we doing? For this man is doing many signs.”
translation:
  language: ig
  text: Ya mere, ndị isi nchụàjà na ndị Farisii kpọkọtara otu kansụl[a], na-ekwu, “Gịnị ka anyị na-eme? N’ihi na nwoke a na-eme ọtụtụ ihe ịrịba ama.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Sanhedrin,” ya bụ kansụl ọchịchị ndị Juu.
    reason: alternative_reading
lexical_decisions:
- source_word: συνήγαγον
  choice: kpọkọtara
  rationale: Okwu a na-egosi na ha kpọrọ ndị otu ahụ ka ha zukọta; ‘kpọkọtara’ bụ Igbo nkịtị ma na-echekwa ọrụ ngwaa ahụ.
- source_word: οὖν
  choice: Ya mere
  rationale: Na-egosi ihe si n’ihe ndị mere tupu amaokwu a pụta, n’enweghị ime ka njikọ ahụ sie ike karịa ka Grik si kwuo.
- source_word: ἀρχιερεῖς
  choice: ndị isi nchụàjà
  rationale: Nke a na-ezo aka n’ụfọdụ ndị ọchịchị kachasị elu n’etiti ndị nchụàjà, ọ bụghị ọtụtụ ndị ji ọkwa nnukwu onye nchụàjà n’otu oge.
- source_word: Φαρισαῖοι
  choice: ndị Farisii
  rationale: Ụdị aha a bụ nke a maara nke ọma n’Igbo maka òtù ndị Juu ahụ.
- source_word: συνέδριον
  choice: ndị kansụl
  rationale: N’usoro ahịrịokwu Grik, ọ bụ ihe e kpọkọtara. Igbo na-ekwu nke ọma site n’ịkpọ ndị mejupụtara kansụl ahụ, ebe nkọwa ala peeji na-echekwa ohere na ọ bụ Sanhedrin.
- source_word: ἔλεγον
  choice: na-asị
  rationale: Na-echekwa ọdịdị imperfect nke na-egosi okwu na-aga n’ihu ma ọ bụ nke ọtụtụ mmadụ na-ekwughachi.
- source_word: Τί ποιοῦμεν
  choice: Gịnị ka anyị na-eme?
  rationale: Na-echekwa present indicative Grik na ụda nchegbu ya, kama ịtụgharị ya ozugbo ka ọ bụrụ ‘Gịnị ka anyị kwesịrị ime?’
- source_word: ὅτι
  choice: N’ihi na
  rationale: Na-ewebata ihe kpatara ajụjụ ha.
- source_word: οὗτος ὁ ἄνθρωπος
  choice: nwoke a
  rationale: Na-echekwa njirimara nwoke na ụda ha ji na-ekwu maka Jizọs.
- source_word: πολλὰ ποιεῖ σημεῖα
  choice: na-eme ọtụtụ ihe ịrịba ama
  rationale: ‘Ihe ịrịba ama’ na-echekwa mkpa σημεῖα nwere n’Oziọma Jọn dịka ọrụ na-egosi onye Jizọs bụ, kama ịkọwa ya naanị dịka ọrụ ebube.
theological_decisions:
- issue: Ntughari σημεῖα n’Oziọma Jọn
  choice: ihe ịrịba ama
  alternative: ọrụ ebube; ihe ịrịba ama dị ebube
  rationale: Jọn na-eji okwu a maka ọrụ Jizọs ndị na-egosi ihe karịrị ọrụ ahụ n’onwe ya. ‘Ihe ịrịba ama’ na-echekwa ịdị arọ nke echiche ahụ n’etinyeghị nkọwa ọzọ.
- issue: Ntughari συνέδριον
  choice: ndị kansụl
  alternative: Sanhedrin; otu kansụl
  rationale: Nke a na-eme ka ahịrịokwu bụrụ Igbo eke ma ghara ikpebi n’isi ederede ma okwu ahụ bụ aha ụlọikpe ọchịchị a kapịrị ọnụ; nkọwa ala peeji na-enye njirimara Sanhedrin dịka ohere.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji ‘chụàjà’ dee okwu ahụ dịka otu mkpụrụokwu. E debere ajụjụ ahụ n’ụdị present indicative ma chekwaa ‘ihe ịrịba ama’ dịka okwu dị mkpa n’Oziọma Jọn.
