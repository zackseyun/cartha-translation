revisions:
- from: Ya mere, ndị isi nchụàjà na ndị Farisii kpọkọtara ndị kansụl[a], na-asị, “Gịnị ka anyị na-eme? N’ihi na nwoke a na-eme ọtụtụ ihe ịrịba ama.”
  to: Ya mere, ndị isi nchụàjà na ndị Farisii kpọkọtara otu kansụl[a], na-ekwu, “Gịnị ka anyị na-eme? N’ihi na nwoke a na-eme ọtụtụ ihe ịrịba ama.”
  rationale: The revision corrects the number and semantic referent of συνέδριον while retaining the draft’s natural rendering of all other source elements. The footnote continues to offer the traditional institutional identification without making it mandatory in the main text.
