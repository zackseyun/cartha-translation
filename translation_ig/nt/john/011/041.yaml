id: JHN.11.41
reference: John 11:41
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἦραν οὖν τὸν ⸀λίθον. ὁ δὲ Ἰησοῦς ἦρεν τοὺς ὀφθαλμοὺς ἄνω καὶ εἶπεν· Πάτερ, εὐχαριστῶ σοι ὅτι ἤκουσάς μου,
base_translation:
  language: en
  yaml_path: translation/nt/john/011/041.yaml
  text: So they took away the stone[a]. And Jesus lifted his eyes upward and said, “Father[b], I thank you that you have heard me,”
translation:
  language: ig
  text: Ya mere, ha wepụrụ nkume ahụ. Jizọs weliri anya ya elu wee sị, “Nna, ana m ekele gị n’ihi na ị nụrụ m[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ị nụla m.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦραν
  choice: ha wepụrụ
  rationale: N’ọnọdụ a, αἴρω na-ekwu maka iwepụ nkume ahụ n’ọnụ ili; “wepụrụ” bụ okwu Igbo doro anya ma dịrị ndị na-agụ ya mfe karịa nsụgharị nkịtị nke nwere ike ịpụta nanị iweli ya elu.
- source_word: οὖν
  choice: Ya mere
  rationale: Ọ na-egosi na ihe a mere bụ ihe sochiri iwu Jizọs nyere tupu amaokwu a; “Ya mere” na-echekwa njikọ ahụ nke ọma.
- source_word: λίθον
  choice: nkume ahụ
  rationale: “Nkume” bụ okwu Igbo kwesịrị ekwesị maka λίθος n’ọnọdụ ili a, ebe nsonaazụ aha “ahụ” na-egosi nkume a maralarị n’akụkọ ahụ.
- source_word: ἦρεν τοὺς ὀφθαλμοὺς ἄνω
  choice: weliri anya ya elu
  rationale: Nke a na-echekwa ihe oyiyi okwu Grik nke iweli anya elu, ma bụrụkwa okwu e ji ekwu okwu n’ụzọ ebumpụta ụwa n’Igbo.
- source_word: δὲ
  choice: Jizọs
  rationale: A naghị enye δέ njikọ okwu pụrụ iche ebe a, n’ihi na mgbanwe onye na-eme ihe, nke malitere site n’aha Jizọs, na-arụ ọrụ mgbanwe akụkọ ahụ n’Igbo n’enweghị “ma” nke nwere ike ime ka esemokwu sie ike karịa nke Grik.
- source_word: Πάτερ
  choice: Nna
  rationale: Ọ bụ oku kpọmkwem Jizọs kpọrọ Chineke n’ekpere. “Nna” bụ okwu dị mfe, dị nsọpụrụ, ma na-echekwaghị mgbakwunye okpukpe na-adịghị n’ihe odide ahụ.
- source_word: εὐχαριστῶ σοι
  choice: ana m ekele gị
  rationale: Ọ na-enye ihe εὐχαριστῶ σοι pụtara n’ụzọ Igbo dị ugbu a ma dị mfe nghọta.
- source_word: ὅτι ἤκουσάς μου
  choice: n’ihi na ị nụrụ olu m
  rationale: “Ị nụrụ olu m” bụ akpaalaokwu Igbo nke na-egosi na Nna nụrụ Jizọs, n’ọnọdụ ekpere a, ọ bụghị naanị ịnụ ụda. Oge gara aga na-echekwa aorist Grik n’enweghị ịgbakwunye nkọwa banyere mgbe kpọmkwem e gere ekpere ahụ.
theological_decisions:
- issue: Otu e si sụgharịa okwu Jizọs ji kpọọ Chineke n’ekpere
  choice: Nna
  alternative: Nna m; Nna anyị
  rationale: Ihe odide Grik nwere naanị Πάτερ. “Nna” na-echekwa mmekọrịta na nsọpụrụ dị n’okwu ahụ n’etinyeghị nnọchiaha nke na-adịghị na isi mmalite.
- issue: Ihe ἤκουσάς μου pụtara n’ọnọdụ ekpere
  choice: ị nụrụ olu m
  alternative: ị geere m ntị; ị zara m
  rationale: Nhọrọ a na-egosi na Nna nụrụ Jizọs ma ọ naghị agbanwe okwu ahụ ka ọ bụrụ “ị zara m,” nke ga-akọwa n’ụzọ doro anya karịa ihe Grik kwuru. Ọ na-echekwa mgbagwoju anya dị n’etiti ịnụ na ịnabata ekpere.
- issue: Oge nke ngwaa ἤκουσάς
  choice: ị nụrụ
  alternative: ị nụla
  rationale: Aorist Grik na-egosi ihe e mere dịka ihe zuru ezu, ma ọ bụghị ya n’onwe ya na-akọwa ụdị perfect Igbo. “Ị nụrụ” bụ nsụgharị nkịtị ma dịkwa mma n’ọnọdụ a; “ị nụla” ka nwere ike igosi ihe gara aga nwere mkpa ugbu a.
translation_notes:
  register: E jiri Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. “Wepụrụ nkume ahụ” na “weliri anya ya elu” na-echekwa mmegharị na ihe oyiyi nke Grik, ebe “ị nụrụ olu m” na-ada ka Igbo ebumpụta ụwa n’ekpere. Akara nkọwa ụkwụ [a] pụtara n’isi ederede ozugbo okwu ọ na-akọwa gasịrị.
