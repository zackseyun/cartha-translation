id: JHN.11.27
reference: John 11:27
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: λέγει αὐτῷ· Ναί, κύριε· ἐγὼ πεπίστευκα ὅτι σὺ εἶ ὁ χριστὸς ὁ υἱὸς τοῦ θεοῦ ὁ εἰς τὸν κόσμον ἐρχόμενος.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/027.yaml
  text: She said to him[a], “Yes, Lord; I have believed that you are the Messiah, the Son of God[b], the one coming into the world.”
translation:
  language: ig
  text: Ọ sịrị ya, “Ee, Onyenweanyị; ekwenyela m na ị bụ Mesaịa[a], Ọkpara Chineke, onye ahụ na-abịa n’ụwa[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Kraịst.” Okwu Grik bụ Χριστός (Christos), aha ọkwa pụtara Onye E Tere Mmanụ.
    reason: alternative_reading
  - marker: b
    text: A pụkwara ikwu, “onye ahụ nke na-abịa n’ụwa.” Okwu Grik ahụ ji participle kọwaa onye ahụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει αὐτῷ
  choice: Ọ sịrị ya
  rationale: Ọ bụ ezie na Grik ji ngwaa oge ugbu a mee akụkọ ihe mere eme, oge gara aga bụ ụzọ Igbo si akọ akụkọ a n'ụzọ ebumpụta ụwa. Ihe gbara amaokwu a gburugburu na-egosi na onye na-ekwu bụ Mata.
- source_word: Ναί
  choice: Ee
  rationale: Nke a bụ nkwenye doro anya ma kwekọọ n’azịza Mata.
- source_word: κύριε
  choice: Onyenwe anyị
  rationale: Ọ na-edobe nkwanye ùgwù na ịdị arọ nke aha a n’ọnọdụ ebe Mata na-ekwupụta onye Jizọs bụ; ‘nna ukwu’ pụrụ ime ka ọ bụrụ naanị okwu nkwanye ùgwù.
- source_word: πεπίστευκα
  choice: ekwenyela m
  rationale: Ụdị perfect nke Grik na-egosi nkwenye malitere na mbụ ma ka guzosie ike ugbu a. ‘Ekwenyela m’ na-eburu echiche ahụ nke nkwenye e mere ma nọgide.
- source_word: ὅτι
  choice: na
  rationale: N’ebe a, ọ na-ewebata ihe Mata kwenyere, ọ bụghị ihe kpatara o ji kwere.
- source_word: ὁ χριστός
  choice: Mesaịa
  rationale: A sụgharịrị aha ọkwa ahụ dịka ‘Mesaịa’ iji chekwaa echiche nke Onye E Tere Mmanụ na olileanya ndị Juu, kama ime ya ka ọ bụrụ naanị aha mmadụ.
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: Ọkpara Chineke
  rationale: Nke a bụ ụzọ Igbo doro anya ma dịkwa arọ isi chekwaa aha nkwupụta banyere mmekọrịta ya na Chineke.
- source_word: ὁ εἰς τὸν κόσμον ἐρχόμενος
  choice: onye ahụ na-abịa n’ụwa
  rationale: Nkebi okwu a na-egosi onye a na-atụ anya ya nke na-abịa n’ụwa. Ụdị nkebi ahịrịokwu mmekọrịta a bụ nke ebumpụta ụwa n’Igbo ma na-edobe present participle nke Grik.
- source_word: κόσμον
  choice: ụwa
  rationale: ‘Ụwa’ bụ okwu Igbo nkịtị maka κόσμος n’ebe a, ya bụ, ebe ndụ ụmụ mmadụ nke Ọkpara ahụ na-abata na ya.
theological_decisions:
- issue: Ịsụgharị Χριστός dịka aha nkwupụta
  choice: Mesaịa
  alternative: Kraịst
  rationale: N’amaokwu a, okwu ahụ bụ aha ọkwa nke na-akọwa onye Jizọs bụ. ‘Mesaịa’ na-eme ka echiche nke Onye E Tere Mmanụ pụta ìhè ma ghara imechi ihe okwu Grik ahụ pụtara.
- issue: Ike okwu κύριε n’okwu Mata
  choice: Onyenwe anyị
  alternative: nna ukwu
  rationale: Nkwupụta sochiri ya—Mesaịa na Ọkpara Chineke—na-akwado ịchekwa nkwanye ùgwù na ịdị arọ okpukpe dị n’okwu ahụ, n’agbanyeghị na κύριε nwekwara ike ịbụ okwu nkwanye ùgwù n’ọnọdụ ndị ọzọ.
- issue: Ike aspect nke πεπίστευκα
  choice: ekwenyela m
  alternative: ekwere m
  rationale: Nhọrọ a na-egosi nkwenye e nwere kemgbe ma ka dị ugbu a, na-enweghị ịtụgharị ya ka ọ bụrụ naanị ọnọdụ ugbu a ma ọ bụ naanị ihe mere n’oge gara aga.
- issue: Oge na ọrụ nke ὁ ἐρχόμενος
  choice: onye ahụ na-abịa n’ụwa
  alternative: onye ahụ nke na-abịa n’ụwa
  rationale: A hapụrụ okwu ahụ n’ụdị na-aga n’ihu nke present participle, kama ịgbanwe ya n’enweghị ihe akaebe ka ọ bụrụ naanị ọdịnihu. Nhọrọ ọzọ bụ ụdị zuru ezu nke otu nkebi ahịrịokwu mmekọrịta ahụ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị mfe nghọta ma dị ùgwù. ‘Ọ sịrị ya’ na-agbaso ụzọ Igbo si akọ akụkọ kama iṅomi historical present nke Grik. ‘Onyenwe anyị,’ ‘Mesaịa,’ na ‘Ọkpara Chineke’ na-edobe ịdị arọ nke nkwupụta ahụ n’enweghị itinye ozizi otu ụka pụrụ iche.
