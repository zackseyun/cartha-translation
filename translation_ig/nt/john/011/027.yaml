  to: Ọ sịrị ya, “Ee, Onyenweanyị; ekwenyela m na ị bụ Mesaịa[a], Ọkpara Chineke, onye ahụ na-abịa n’ụwa[b].”
  rationale: The revision removes an unintended possessive implication in the address to Jesus by using the conventional Standard Igbo form Onyenweanyị. It also makes footnote b strictly lexical/grammatical, preserving the source expression's ambiguity rather than describing an inferred expectation.
  reviewer_model: gpt-5.6-terra
