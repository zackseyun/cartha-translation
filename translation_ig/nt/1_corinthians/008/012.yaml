  text: οὕτως δὲ ἁμαρτάνοντες εἰς τοὺς ἀδελφοὺς καὶ τύπτοντες αὐτῶν τὴν συνείδησιν ἀσθενοῦσαν εἰς Χριστὸν ἁμαρτάνετε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/012.yaml
  text: And so[a], by sinning against the brothers in this way and wounding their weak conscience[c][b], you are sinning against Messiah.
translation:
  language: ig
  text: Ya mere, site n’imehie megide ụmụnna n’ụzọ dị otu a na imerụ akọ na uche ha na-adịghị ike, unu na-emehie megide Mesaịa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Ma ọ bụ, “Kraịst.” Okwu Grik bụ Χριστός.
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως δὲ
  choice: Ya mere, ... si otu a
  rationale: “Ya mere” na-ejikọta okwu a n’ihe Pọl kwuru tupu ya, ebe “si otu a” na-egosi kpọmkwem ụzọ e si eme mmehie ahụ. Nke a na-edobe ma njikọ δὲ ma ntụaka azụ nke οὕτως n’Igbo dị mfe nghọta.
- source_word: ἁμαρτάνοντες εἰς τοὺς ἀδελφοὺς
  choice: mgbe unu ... na-eme mmehie megide ụmụnna
  rationale: “Mgbe unu ... na-eme” na-egosi omume na-eso ma kọwaa isi ngwaa; “megide” na-egosipụta ntụgharị εἰς megide mmadụ. “Ụmụnna” bụ okwu Igbo nkịtị maka ndị otu okwukwe, ma ọ pụkwara ịgụnye nwoke na nwanyị.
- source_word: τύπτοντες
  choice: na-emerụkwa
  rationale: τύπτω pụtara iti ma ọ bụ ịkụ ihe; n’ebe a, e ji ya mee ihe atụ banyere akọ na uche. “Na-emerụkwa” na-eburu echiche nke imerụ ahụ n’ụzọ dị ndụ ma na-ada nke ọma n’Igbo.
- source_word: αὐτῶν τὴν συνείδησιν ἀσθενοῦσαν
  choice: akọ na uche ha na-adịghị ike ahụ
  rationale: Nke a na-edobe “akọ na uche” n’otu mkpụrụ dịka Grik, ebe “ha” nwere nghọta nkesa nye ndị ahụ n’otu n’otu. “Na-adịghị ike” na-egosipụta participle ἀσθενοῦσαν n’ụzọ nkịtị n’Igbo.
- source_word: εἰς Χριστὸν ἁμαρτάνετε
  choice: unu na-eme mmehie megide Mesaịa
  rationale: “Megide” na-edobe ike ntụgharị εἰς, “unu na-eme mmehie” na-egosi omume na-aga n’ihu, “Mesaịa” na-egosikwa Χριστός dịka aha ọkwa nke Onye E Tere Mmanụ.
theological_decisions:
- issue: Ihe ụmụnna (ἀδελφοὺς) na-agụnye
  choice: ụmụnna
  alternative: ụmụnna nwoke na ụmụnna nwanyị; ndị kwere ekwe ibe unu
  rationale: Ụdị Grik bụ oke, ma n’akwụkwọ ozi a ọ na-ezo aka n’ebe ndị otu okwukwe nọ, nke nwere ike ịgụnye nwoke na nwanyị. Okwu “ụmụnna” n’Igbo nwere ike ibu nghọta ezinụlọ ime mmụọ a n’enweghị ịgbakwunye okwu na-adịghị n’ahịrị.
- issue: Nsụgharị Χριστόν
  choice: Mesaịa
  alternative: Kraịst
  rationale: Χριστός bụ aha ọkwa pụtara Onye E Tere Mmanụ. “Mesaịa” na-eme ka aha ọkwa ahụ pụta ìhè, ebe a na-edebe “Kraịst” dịka nsụgharị ọzọ a maara nke ọma.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-edobe nkwughachi “na-eme mmehie ... na-eme mmehie” nke dị na Grik, n’ihi na nkwughachi ahụ na-eme ka njikọ dị n’etiti imerụ onye kwere ekwe ibe ha na ime mmehie megide Mesaịa sie ike.
