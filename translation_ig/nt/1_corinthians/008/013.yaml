id: 1CO.8.13
reference: 1 Corinthians 8:13
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: διόπερ εἰ βρῶμα σκανδαλίζει τὸν ἀδελφόν μου, οὐ μὴ φάγω κρέα εἰς τὸν αἰῶνα, ἵνα μὴ τὸν ἀδελφόν μου σκανδαλίσω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/013.yaml
  text: Therefore, if food causes my brother to stumble, I will certainly never eat meat forever, so that I may not cause my brother to stumble.
translation:
  language: ig
  text: N’ihi ya, ọ bụrụ na ihe oriri na-eme ka nwanne m sụọ ngọngọ, agaghị m eri anụ ma ọlị ruo mgbe ebighị ebi, ka m ghara ime ka nwanne m sụọ ngọngọ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διόπερ
  choice: N’ihi ya
  rationale: Na-egosi nkwubi okwu siri ike nke sitere n’ihe Pọl kwuru tupu amaokwu a.
- source_word: βρῶμα
  choice: ihe oriri
  rationale: Okwu a pụtara nri n’ozuzu ya, ọ bụghị naanị anụ.
- source_word: σκανδαλίζει / σκανδαλίσω
  choice: na-eme ka ... sụọ ngọngọ / ime ka ... sụọ ngọngọ
  rationale: E debere ihe atụ nke ịsụ ngọngọ dị n’asụsụ Grik, ebe ọ na-egosi ime ka onye ọzọ daba ma ọ bụ mebie n’okwukwe.
- source_word: κρέα
  choice: anụ
  rationale: N’ebe a okwu ahụ na-ezo aka n’anụ a na-eri, n’ụzọ kwekọrọ n’arụmụka banyere nri.
- source_word: οὐ μὴ ... εἰς τὸν αἰῶνα
  choice: agaghị m ... ọzọ ruo mgbe ebighị ebi
  rationale: Ngwakọta οὐ μή na-egosi ịjụ nke siri ike, ebe εἰς τὸν αἰῶνα na-egosi oge na-adịghị agwụ agwụ; nsụgharị a na-edebe ike okwu abụọ ahụ.
theological_decisions:
- issue: Ihe ‘ịsụ ngọngọ’ pụtara
  choice: E debere ihe atụ ahụ n’ederede kama ịsụgharị ya kpọmkwem dịka ‘ime mmehie’ ma ọ bụ ‘ịhapụ okwukwe.’
  alternative: ime ka nwanne m daba na mmehie
  rationale: σκανδαλίζω nwere ike ịgụnye ịdaba na mmehie, imebi akọ na uche, ma ọ bụ ịda n’okwukwe; idebe ihe atụ ahụ anaghị emechi nghọta ya n’otu ụzọ naanị.
- issue: Ogologo oge Pọl kwuru na ya agaghị eri anụ
  choice: ruo mgbe ebighị ebi
  alternative: ọzọ ma ọlị
  rationale: A họọrọ okwu na-anọ nso n’εἰς τὸν αἰῶνα ma na-edebe nkwupụta Pọl siri ike, kama ime ka ọ bụrụ naanị mkpebi maka oge ahụ.
translation_notes:
  register: E ji Standard Igbo nke dị mfe, dị ùgwù, ma bụrụkwa nke ndị na-agụ akwụkwọ taa ga-aghọta. A họọrọ ‘nwanne m’ dịka okwu gụnyere onye otu okwukwe n’enweghị itinye nkọwa ụka pụrụ iche.
