- from: N’ihi ya, ọ bụrụ na ihe oriri na-eme ka nwanne m sụọ ngọngọ, agaghị m eri anụ ọzọ ruo mgbe ebighị ebi, ka m ghara ime ka nwanne m sụọ ngọngọ.
  to: N’ihi ya, ọ bụrụ na ihe oriri na-eme ka nwanne m sụọ ngọngọ, agaghị m eri anụ ma ọlị ruo mgbe ebighị ebi, ka m ghara ime ka nwanne m sụọ ngọngọ.
  rationale: Removed the unsupported ‘ọzọ’ and supplied ‘ma ọlị’ to convey the force of οὐ μή. The remainder faithfully and naturally preserves the Greek wording and its ambiguity.
