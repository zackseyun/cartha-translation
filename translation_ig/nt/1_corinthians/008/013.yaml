review_pass:
  verdict: revise
  source_fidelity: The draft accurately distinguishes βρῶμα (‘food’) from κρέα (‘meat’) and retains the repeated, deliberately broad σκανδαλίζω imagery as ‘ime ka ... sụọ ngọngọ.’ However, ‘ọzọ’ (‘again’) introduces a temporal element not present in the Greek. The emphatic οὐ μὴ ... εἰς τὸν αἰῶνα is more directly represented with ‘ma ọlị ... ruo mgbe ebighị ebi.’
  naturalness: The sentence is clear, idiomatic Standard Igbo, and retains an appropriate formal biblical register. ‘Na-eme ka nwanne m sụọ ngọngọ’ is a natural way to preserve the metaphor without prematurely interpreting it.
  terminology: ‘Ihe oriri,’ ‘anụ,’ and ‘nwanne m’ are appropriate. Retaining ‘sụọ ngọngọ’ preserves the source’s semantic breadth, which can concern moral or religious harm without specifying one particular outcome.
  issues:
  - severity: low
    issue: The word ‘ọzọ’ adds ‘again.’
    rationale: κρέα has no corresponding ‘again’ modifier. Removing it avoids adding a detail while retaining Paul’s emphatic lifelong/everlasting renunciation.
  revised_text: N’ihi ya, ọ bụrụ na ihe oriri na-eme ka nwanne m sụọ ngọngọ, agaghị m eri anụ ma ọlị ruo mgbe ebighị ebi, ka m ghara ime ka nwanne m sụọ ngọngọ.
