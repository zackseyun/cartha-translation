id: 1CO.8.8
reference: 1 Corinthians 8:8
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: βρῶμα δὲ ἡμᾶς οὐ ⸀παραστήσει τῷ θεῷ· οὔτε ⸂γὰρ ἐὰν φάγωμεν, περισσεύομεν, οὔτε ἐὰν μὴ φάγωμεν, ὑστερούμεθα⸃.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/008.yaml
  text: But food will not commend us to God[a]; for neither if we eat do we abound[b], nor if we do not eat do we lack.
translation:
  language: ig
  text: Ma nri agaghị eme ka anyị bịaruo Chineke nso[a]; n’ihi na, ọ bụrụ na anyị erie, anyị anaghị enweta uru karịa[b], ọ bụrụkwa na anyị erighị, anyị anaghị enwe ụkọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “nri agaghị eweta anyị n’ihu Chineke.”
    reason: lexical_alternative
  - marker: b
    text: N’ụzọ nkịtị, “ọ bụrụ na anyị erie, anyị anaghị aba ụba; ọ bụrụkwa na anyị erighị, anyị anaghị enwe ụkọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: βρῶμα
  choice: nri
  rationale: Ọ bụ okwu sara mbara maka ihe oriri, ọ bụghị kpọmkwem anụ ma ọ bụ otu ụdị nri.
- source_word: παραστήσει τῷ θεῷ
  choice: agaghị eme ka anyị bịaruo Chineke nso
  rationale: Nke a na-egosi na nri anaghị eme ka ọnọdụ mmadụ n’ebe Chineke nọ ka mma. Ihe odide Grik nwekwara ike ịpụta ‘igosi’ ma ọ bụ ‘iche mmadụ n’ihu Chineke,’ ya mere e debere nkọwa ọzọ n’ala peeji.
- source_word: οὔτε γὰρ ἐὰν φάγωμεν, περισσεύομεν
  choice: n’ihi na ọ bụrụ na anyị erie, ọ dịghị uru ọzọ anyị na-enweta
  rationale: N’ebe a, περισσεύομεν na-ekwu maka inwe ihe karịrị ma ọ bụ inwe uru karịa, ọ bụghị naanị ịba ụba n’ihe onwunwe.
- source_word: οὔτε ἐὰν μὴ φάγωμεν, ὑστερούμεθα
  choice: ọ bụrụkwa na anyị erighị, ọ dịghị ihe na-akọ anyị
  rationale: Nke a na-edobe echiche nke ὑστερούμεθα, ya bụ, ịnọ n’ụkọ ma ọ bụ ịbụ onye ihe na-akọ, ma na-eme ka ahịrịokwu ahụ bụrụ Igbo a na-aghọta nke ọma.
- source_word: δὲ … γὰρ
  choice: Ma … n’ihi na
  rationale: ‘Ma’ na-egosi obere ọdịiche n’ihe e kwuru tupu ya, ebe ‘n’ihi na’ na-eweta nkọwa na-akwado okwu mbụ.
theological_decisions:
- issue: Ma okwu a ọ na-ekwu maka nnabata n’ihu Chineke ka ọ bụ uru ime mmụọ n’ozuzu ya
  choice: Nri n’onwe ya anaghị eme ka mmadụ bịaruo Chineke nso, iri ya ma ọ bụ ịghara iri ya adịghịkwa enye mmadụ uru ma ọ bụ mee ka ihe kọọ ya.
  alternative: 'A pụrụ ịghọta ya dị ka: nri agaghị egosi ma ọ bụ chee anyị n’ihu Chineke.'
  rationale: Nsụgharị ahụ na-edobe isi okwu Pọl na iri nri ma ọ bụ ịghara iri ya anaghị agbanwe ọnọdụ mmadụ n’ebe Chineke nọ, ma ihe e dere n’ala peeji na-echekwa obosara ihe παραστήσει pụrụ ịpụta.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị ùgwù ma doo ndị nkịtị anya. E zere okwu ụka pụrụ iche, ma debe nhazi ahịrịokwu abụọ ahụ n’ụzọ na-egosi ọdịiche dị n’etiti iri nri na ịghara iri ya.
