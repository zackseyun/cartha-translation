  to: Ma nri agaghị eme ka anyị bịaruo Chineke nso[a]; n’ihi na, ọ bụrụ na anyị erie, anyị anaghị enweta uru karịa[b], ọ bụrụkwa na anyị erighị, anyị anaghị enwe ụkọ.
  rationale: The revision retains the source’s future assertion, explanatory connector, and paired conditional structure. It replaces an unclear expression for deficiency with idiomatic Standard Igbo and corrects the lexical alternative in footnote a, without narrowing the semantic range of παραστήσει or imposing a theological interpretation.
