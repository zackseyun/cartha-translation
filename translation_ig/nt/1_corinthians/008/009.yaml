revisions:
- from: Ma lezienụ anya ka ikike unu a ghara n'ụzọ ọ bụla ịghọrọ ndị na-adịghị ike ihe ịsọ ngọngọ.[a][b]
  to: Ma lezienụ anya ka ikike unu a ghara ịghọ ihe ịsụ ngọngọ nye ndị na-adịghị ike.[a][b]
  rationale: 'The revision makes only a safe linguistic correction: it replaces the awkward construction with an idiomatic Standard Igbo expression for ‘become a stumbling block to.’ It preserves the source’s caution, ambiguity concerning the precise range of ἐξουσία, and the contextual but non-expanded designation ‘the weak.’ Footnote a is adjusted slightly for smoother grammar (“n’iri nri”).'
