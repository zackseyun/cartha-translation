source:
  edition: SBLGNT
  text: βλέπετε δὲ μή πως ἡ ἐξουσία ὑμῶν αὕτη πρόσκομμα γένηται τοῖς ⸀ἀσθενέσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/009.yaml
  text: But take care that this right of yours does not somehow become a stumbling block to the weak[a][b].
translation:
  language: ig
  text: Ma lezienụ anya ka ikike unu a ghara ịghọ ihe ịsụ ngọngọ nye ndị na-adịghị ike.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “nnwere onwe unu a.” Okwu Grik ahụ nwere ike ịpụta “ikike,” “ihe mmadụ nwere ikike ime,” ma ọ bụ “nnwere onwe”; n’ebe a, ọ na-ezo aka ná nnwere onwe ụfọdụ ndị kwere ekwe kwuru na ha nwere n’iri nri e jikọtara ya na arụsị.
    reason: lexical_alternative
  - marker: b
    text: “Ndị na-adịghị ike” n’ebe a bụ ndị akọ na uche ha na-adịghị ike n’okwu a.
    reason: cultural_note
lexical_decisions:
- source_word: βλέπετε
  choice: lezienụ anya
  rationale: Ọ bụ iwu na-akpọ ndị na-agụ akwụkwọ ka ha mụrụ anya; okwu a bụ Igbo ebumpụta ụwa ma debe ike ịdọ aka ná ntị dị na Grik.
- source_word: δὲ
  choice: Ma
  rationale: Ọ na-egosi obere ntụgharị ma ọ bụ ihe na-emegide ihe e kwuru tupu ya; “Ma” dabara n’ịdọ aka ná ntị nke amaokwu a.
- source_word: μή πως
  choice: ka ... ghara n'ụzọ ọ bụla
  rationale: Ọ na-ewebata ihe ọjọọ a na-akpachara anya ka ọ ghara ime, ma na-edebe echiche nke ohere dị na μή πως.
- source_word: ἡ ἐξουσία ὑμῶν αὕτη
  choice: ikike unu a
  rationale: ἐξουσία nwere ike ịpụta ikike, ihe mmadụ nwere ikike ime, ma ọ bụ nnwere onwe. “Ikike unu a” na-egosi ihe ha na-azọrọ na ha nwere ikike ime n’ihe banyere nri e ji chụọrọ arụsị àjà, na-enweghị imechi ụzọ maka nghọta ndị ọzọ.
- source_word: πρόσκομμα
  choice: ihe ịsọ ngọngọ
  rationale: Nke a na-edebe ihe atụ Grik nke ihe na-eme ka mmadụ sụọ ngọngọ, ma na-arụ ọrụ n’echiche omume na nke mmụọ.
- source_word: γένηται
  choice: ịghọrọ
  rationale: “Ịghọrọ” na-egosipụta mgbanwe gaa n’ịbụ ihe ga-eme ka onye ọzọ sụọ ngọngọ.
- source_word: τοῖς ἀσθενέσιν
  choice: ndị na-adịghị ike
  rationale: Nke a bụ nsụgharị dị nkenke nke okwu Grik; ihe gbara ya gburugburu na-egosi na adịghị ike ahụ metụtara akọ na uche ha n’okwu a.
theological_decisions:
- issue: Ihe ἐξουσία pụtara n’ebe a
  choice: Ikike ndị Kọrịnt na-azọrọ na ha nwere n’ihe banyere iri nri e jikọtara ya na arụsị.
  alternative: Ike ma ọ bụ ọchịchị n’ozuzu ya; ma ọ bụ nnwere onwe.
  rationale: Isi nke 8 na-ekwu banyere iri nri e ji chụọrọ arụsị àjà. “Ikike” na-edebe echiche nke ihe mmadụ kwenyere na o ruuru ya ime, ma ihe odide ala peeji na-egosi obosara okwu Grik ahụ.
- issue: Ndị τοῖς ἀσθενέσιν bụ
  choice: Ndị kwere ekwe ndị akọ na uche ha na-adịghị ike n’okwu a.
  alternative: Ndị na-adịghị ike n’ozuzu ha ma ọ bụ n’anụ ahụ.
  rationale: N’isiakwụkwọ a, Pọl na-eji “adịghị ike” akọwa ọnọdụ akọ na uche. A hapụrụ okwu ahụ nkenke n’ahịrị bụ isi, ebe ihe odide ala peeji na-eme ka ihe ọ na-ezo aka na ya doo anya.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-edebe ịdọ aka ná ntị, ohere ihe ahụ nwere ike ime, na ihe atụ nke ịsọ ngọngọ; ihe odide ala peeji na-echekwa obosara ἐξουσία na nkọwa nke “ndị na-adịghị ike.”
