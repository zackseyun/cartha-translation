review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the warning (βλέπετε), the precautionary force of μή πως, the contextual sense of ἐξουσία as a claimed right/freedom, and the referent of ‘the weak.’ However, the main clause requires a small idiomatic correction in its rendering of γένηται and πρόσκομμα.
  naturalness: “Ịghọrọ ndị na-adịghị ike ihe ịsọ ngọngọ” is not the most natural Standard Igbo construction. “Ịghọ ihe ịsụ ngọngọ nye ndị na-adịghị ike” clearly and idiomatically expresses ‘become a stumbling block to the weak.’
  terminology: “Ikike unu a” suitably preserves the contextual sense of ἐξουσία without excluding its semantic range; the lexical footnote appropriately notes “nnwere onwe.” “Ndị na-adịghị ike” is retained, with the footnote correctly identifying the contextual reference as weakness of conscience. The customary verb in the stumbling metaphor is “ịsụ ngọngọ,” not “ịsọ ngọngọ.”
  issues:
  - severity: medium
    issue: The phrase “ịghọrọ ndị na-adịghị ike ihe ịsọ ngọngọ” is awkward and uses a less suitable verbal expression in the stumbling metaphor.
    rationale: γένηται πρόσκομμα τοῖς ἀσθενέσιν is best rendered in natural Igbo as ‘ghara ịghọ ihe ịsụ ngọngọ nye ndị na-adịghị ike.’ This retains both the becoming sense and the dative relation (‘to/for the weak’).
