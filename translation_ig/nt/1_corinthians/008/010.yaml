revisions:
- from: N’ihi na ọ bụrụ na mmadụ ahụ gị, gị onye nwere ihe ọmụma, ka ị na-eri nri n’ụlọ arụsị, ọ̀ bụ na a gaghị ewulite akọ na uche onye ahụ, ebe ọ bụ onye na-adịghị ike, ka o rie nri a chụrụ n’àjà nye arụsị?[a]
  to: N’ihi na ọ bụrụ na mmadụ ahụ gị, onye nwere ihe ọmụma, ka ị na-anọdụ ala na-eri nri n’ụlọ arụsị, akọ na uche onye ahụ, ebe ọ na-adịghị ike, ọ̀ gaghị ewulite[a] ya ka o rie nri a chụrụ n’àjà nye arụsị?
  rationale: The revision restores the conscience as the subject of the rhetorical question, gives an idiomatic representation of the meal posture expressed by κατακείμενον, and moves the lexical-alternative footnote marker to “ewulite.” It retains the source’s rhetorical force, the likely irony of the building metaphor, and the existing theological neutrality.
  reviewer_model: gpt-5.6-terra
