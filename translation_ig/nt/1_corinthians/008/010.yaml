id: 1CO.8.10
reference: 1 Corinthians 8:10
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐὰν γάρ τις ἴδῃ σὲ τὸν ἔχοντα γνῶσιν ἐν εἰδωλείῳ κατακείμενον, οὐχὶ ἡ συνείδησις αὐτοῦ ἀσθενοῦς ὄντος οἰκοδομηθήσεται εἰς τὸ τὰ εἰδωλόθυτα ἐσθίειν;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/010.yaml
  text: For if someone sees you[a], who have knowledge, reclining in an idol’s temple, will not his conscience, being weak, be built up to eat food sacrificed to idols?
translation:
  language: ig
  text: N’ihi na ọ bụrụ na mmadụ ahụ gị, onye nwere ihe ọmụma, ka ị na-anọdụ ala na-eri nri n’ụlọ arụsị, akọ na uche onye ahụ, ebe ọ na-adịghị ike, ọ̀ gaghị ewulite[a] ya ka o rie nri a chụrụ n’àjà nye arụsị?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “mee ka o nwee obi ike.” Okwu Grik ahụ pụtara n’ụzọ nkịtị “ewulite,” bụ okwu Pọl na-ejikarị ekwu maka iwulite mmadụ elu; o yiri ka o ji ya mee ihe ọchị dị ilu n’ebe a.
    reason: lexical_alternative
lexical_decisions:
- source_word: γάρ
  choice: N’ihi na
  rationale: Na-ejikọta amaokwu a na ịdọ aka ná ntị dị n’ihu ya site n’inye ihe kpatara ya.
- source_word: τις
  choice: mmadụ
  rationale: Na-egosi onye ọ bụla a na-akọghị aha n’ọnọdụ atụ a.
- source_word: ἴδῃ
  choice: ahụ
  rationale: Ya na ‘ọ bụrụ na’ na-enye ọnọdụ nwere ike ime n’ọdịnihu n’ụzọ Igbo dị mma.
- source_word: σὲ τὸν ἔχοντα γνῶσιν
  choice: gị, gị onye nwere ihe ọmụma
  rationale: Na-edobe nrụgide e tinyere onye a na-agwa okwu, onye e ji inwe ihe ọmụma mara.
- source_word: γνῶσιν
  choice: ihe ọmụma
  rationale: Na-echekwa okwu isiokwu Pọl ji mee ihe n’isi nke asatọ.
- source_word: ἐν εἰδωλείῳ
  choice: n’ụlọ arụsị
  rationale: Na-egosi ụlọ nsọ ma ọ bụ ebe ofufe e jikọtara ya na arụsị, n’asụsụ Igbo doro anya.
- source_word: κατακείμενον
  choice: ka ị na-eri nri
  rationale: Ọ bụ ezie na okwu Grik na-egosi ịdabere ala n’oge nri, isi ihe oyiyi ya n’Igbo bụ ịnọ na-eri nri; nsụgharị nkịtị banyere ọnọdụ ahụ mmadụ ga-adị ihe ọhụrụ ma ghara ịdị mfe nghọta.
- source_word: οὐχὶ
  choice: ọ̀ bụ na a gaghị
  rationale: Na-edobe ajụjụ nkwupụta nke na-atụ anya azịza nkwenye.
- source_word: ἡ συνείδησις αὐτοῦ
  choice: akọ na uche onye ahụ
  rationale: Na-ezo kpọmkwem n’ikike onye na-ahụ ya nwere ịmata ezi ihe na ihe ọjọọ.
- source_word: ἀσθενοῦς ὄντος
  choice: ebe ọ bụ onye na-adịghị ike
  rationale: Na-akọwa ọnọdụ onye ahụ n’ụzọ Igbo dị mfe ma na-edobe njikọ ya na isiokwu ‘onye na-adịghị ike.’
- source_word: οἰκοδομηθήσεται
  choice: ewulite
  rationale: Na-edobe ihe oyiyi nkịtị nke ‘iwulite’ na ihe ọchị dị ilu n’iji okwu Pọl na-ejikarị maka iwulite mmadụ mee ihe maka ihe ga-emerụ ya.
- source_word: εἰς τὸ τὰ εἰδωλόθυτα ἐσθίειν
  choice: ka o rie nri a chụrụ n’àjà nye arụsị
  rationale: Na-egosi nsonaazụ ma ọ bụ ihe omume akọ na uche ya ga-eduga ya ime.
theological_decisions:
- issue: Otu e si sụgharịa οἰκοδομηθήσεται n’ọnọdụ ebe ihe a na-akpali mmadụ ime ga-emerụ ya
  choice: ewulite
  alternative: mee ka o nwee obi ike; gbaa ya ume
  rationale: A họọrọ ihe oyiyi nkịtị nke ‘iwulite’ iji chekwaa njikọ ya na okwu Pọl banyere iwulite ndị ọzọ nakwa esemokwu dị ilu n’amaokwu a. Ihe ọ pụtara n’ụzọ nkịtị n’ọnọdụ a ka akọwara n’ala peeji.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E jiri ‘ụlọ arụsị’ mee ka ebe ofufe ahụ doo anya, ma e jiri ‘ka ị na-eri nri’ dochie ihe oyiyi ọdịnala Grik nke ịdabere ala n’oge nri. Akara ala peeji [a] dị na ngwụcha ahịrịokwu ma na-akọwa ‘ewulite.’
