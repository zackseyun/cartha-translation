source:
  edition: SBLGNT
  text: Περὶ δὲ τῶν εἰδωλοθύτων, οἴδαμεν ὅτι πάντες γνῶσιν ἔχομεν. ἡ γνῶσις φυσιοῖ, ἡ δὲ ἀγάπη οἰκοδομεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/001.yaml
  text: 'Concerning food sacrificed to idols: we know that we all have knowledge[a]. Knowledge puffs up[b], but love builds up.'
translation:
  language: ig
  text: 'Banyere nri e ji chụọrọ arụsị àjà: anyị maara na anyị niile nwere ihe ọmụma[a]. Ihe ọmụma na-eme ka mmadụ fụlie onwe ya elu[b], ma ịhụnanya na-ewuli mmadụ elu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “anụ e ji chụọrọ arụsị àjà” ma ọ bụ “ihe ndị e ji chụọrọ arụsị àjà.”
    reason: lexical_alternative
  - marker: b
    text: O nwere ike ịbụ na Pọl na-ekwughachi otu okwu ndị Kọrịnt mgbe ọ sịrị, “anyị niile nwere ihe ọmụma.”
    reason: alternative_reading
lexical_decisions:
- source_word: Περὶ δὲ
  choice: Banyere
  rationale: Ọ na-ewebata isiokwu ọhụrụ n’akwụkwọ ozi n'ụzọ doro anya, na-etinyeghị okwu oge nke na-adịghị na Grik.
- source_word: τῶν εἰδωλοθύτων
  choice: nri e ji chụọrọ arụsị àjà
  rationale: Nke a na-egosi ihe oriri e nyere n’ofufe arụsị, ma ọ naghị eme ka ihe ahụ bụrụ naanị anụ.
- source_word: οἴδαμεν ὅτι πάντες γνῶσιν ἔχομεν
  choice: anyị maara na anyị niile nwere ihe ọmụma
  rationale: Ọ na-edobe nkwupụta Grik ahụ na-enweghị ịkọwa ma Pọl ò kwenyere na ya kpamkpam ka ò na-ekwughachi okwu ndị Kọrịnt.
- source_word: ἡ γνῶσις
  choice: Ihe ọmụma
  rationale: Ọ na-edobe njikọ okwu ya na ‘ihe ọmụma’ dị n’ahịrịokwu bu ya ụzọ.
- source_word: φυσιοῖ
  choice: na-eme ka mmadụ fụlie onwe ya elu
  rationale: Ọ bụ okwu Igbo a na-aghọta nke na-egosi mpako, ma ka na-ejigide onyinyo nke ịfụli elu dị n’okwu Grik.
- source_word: ἡ δὲ ἀγάπη
  choice: ma ịhụnanya
  rationale: Ọ na-egosi ọdịiche dị n’etiti ihe ọmụma na ịhụnanya n’asụsụ Igbo dị mfe ma dị ùgwù.
- source_word: οἰκοδομεῖ
  choice: na-ewuli mmadụ elu
  rationale: Ọ na-edobe onyinyo iwu ụlọ dị n’okwu Grik, ma na-eme ka okwu ahụ bụrụ nke ndị na-agụ Igbo taa ga-aghọta nke ọma.
theological_decisions:
- issue: Ma πάντες (‘anyị niile’) bụ nkwupụta zuru ụwa ọnụ ka ọ bụ okwu ndị Kọrịnt Pọl na-ekwughachi
  choice: anyị niile nwere ihe ọmụma
  alternative: onye ọ bụla nwere ihe ọmụma; anyị niile nwere ihe ọmụma a
  rationale: Grik ahụ egosighị n’ụzọ doro anya na Pọl na-anọpụ onwe ya n’okwu ahụ. Ya mere, e debere okwu ya otú ọ dị, hapụkwa ihe gbara ya gburugburu ka o gosi ike okwu ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe ma dị ùgwù. A hapụrụ esemokwu okwu Pọl n’etiti ihe ọmụma na ịhụnanya, ma e dozighị n’ime ntụgharị ahụ ma ‘anyị niile nwere ihe ọmụma’ ò bụ nkwupụta Pọl n’onwe ya ka ọ bụ okwu ndị Kọrịnt.
