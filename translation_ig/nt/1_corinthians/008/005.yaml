reference: 1 Corinthians 8:5
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ γὰρ εἴπερ εἰσὶν λεγόμενοι θεοὶ εἴτε ἐν οὐρανῷ εἴτε ἐπὶ γῆς, ὥσπερ εἰσὶν θεοὶ πολλοὶ καὶ κύριοι πολλοί,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/005.yaml
  text: For even if there are so-called gods[b][a], whether in heaven or on earth—as indeed there are many gods and many lords—
translation:
  language: ig
  text: N’ihi na, ọbụna ọ bụrụgodị na e nwere ndị a na-akpọ chi[a], ma hà nọ n’eluigwe ma ọ bụ n’elu ụwa—dịka e nwere n’ezie ọtụtụ chi na ọtụtụ ndị nwe[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “ndị a na-ekwu na ha bụ chi.” Okwu Grik ahụ pụrụ ịpụta “ndị a na-akpọ chi” ma ọ bụ, n’ọnọdụ a, “ndị a na-ekwu na ha bụ chi,” nke na-egosi na Pọl anaghị anabata na ha bụ ezi chi.
    reason: lexical_alternative
  - marker: b
    text: “Ndị nwe” sụgharịrị ụdị ọtụtụ nke otu okwu Grik a na-asụkarị “Onyenwe.” N’ebe a, ọ na-ezo aka n’ọtụtụ ndị ma ọ bụ ike ndị mmadụ na-akpọ aha ahụ, ọ bụghị otu ezi Onyenwe e kwuru okwu ya n’amaokwu 6.
    reason: cross_reference
lexical_decisions:
- source_word: καὶ γὰρ
  choice: N’ihi na
  rationale: Ọ na-ejikọta amaokwu a na ihe e kwuru tupu ya ma na-enye nkọwa; Igbo a bụ nke sitere n’okike ma doo anya.
- source_word: εἴπερ
  choice: ọ bụrụgodị na
  rationale: Ọ na-egosi nkwenye e nyere maka arụmụka n’enweghị nkwenye zuru ezu na ihe ahụ bụ eziokwu.
- source_word: λεγόμενοι θεοὶ
  choice: ndị a na-akpọ chi
  rationale: Ọ na-echekwa ihe participle Grik pụtara, ya bụ aha ndị mmadụ na-enye ha, n’etinyeghị nkwubi okwu karịrị asụsụ mbụ.
- source_word: εἴτε ἐν οὐρανῷ εἴτε ἐπὶ γῆς
  choice: ma hà nọ n’eluigwe ma ọ bụ n’elu ụwa
  rationale: Ọ na-echekwa ụzọ abụọ ahụ na oke gbasara eluigwe na ụwa n’Igbo doro anya.
- source_word: ὥσπερ
  choice: dị ka
  rationale: Ọ na-ebute nkwenye dị n’etiti ahịrịokwu na e nwere n’ezie ọtụtụ ndị a na-ewere dị ka chi na ndị nwe mmadụ.
- source_word: θεοὶ πολλοὶ
  choice: ọtụtụ chi
  rationale: Ntụgharị kpọmkwem ma dị mfe nke na-ezo aka n’ihe ndị mmadụ na-ewere dị ka chi.
- source_word: κύριοι πολλοί
  choice: ọtụtụ ndị nwe anyị
  rationale: ‘Ndị nwe anyị’ na-egosipụta ọtụtụ ndị ma ọ bụ ike ndị mmadụ na-akpọ κύριοι, ma na-eme ka okwu ahụ bụrụ Igbo sitere n’okike karịa iji naanị ‘ndị nwe.’
theological_decisions:
- issue: Ụzọ Pọl si kewapụ onwe ya n’echiche na chi ndị ọgọ mmụọ bụ ezi chi
  choice: Jiri ‘ndị a na-akpọ chi’ ma tinye nkọwa ụkwụ na ‘ndị a sị na ha bụ chi.’
  alternative: ndị a sị na ha bụ chi
  rationale: Asụsụ Grik pụrụ ịpụta naanị ndị a na-akpọ chi ma ọ bụ nwee ụda ịjụ nkwupụta ahụ. Isi ederede na-echekwa nghọtahie ahụ; nkọwa ụkwụ na-egosi ụzọ nke abụọ kwekọrọ n’okwu gbara ya gburugburu.
- issue: κύριοι n’ụdị ọtụtụ, n’iche ya na otu Onyenwe anyị nke amaokwu 6
  choice: ọtụtụ ndị nwe anyị
  alternative: ọtụtụ ndị nwe; ọtụtụ ndị ọchịchị
  rationale: Nhọrọ a na-echekwa echiche nke ịbụ onye nwe ma ọ bụ onye a na-erubere isi, ebe nkọwa ụkwụ na-egbochi ịghọta ya dị ka otu Onyenwe anyị nke amaokwu 6.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-ejigide ọdịdị nkebi nke Grik na akara ogologo n’ihi na echiche ahụ na-aga n’ihu n’amaokwu 6. E debere ‘chi’ n’obere mkpụrụedemede iji gosi na ọ bụghị otu Chineke.
