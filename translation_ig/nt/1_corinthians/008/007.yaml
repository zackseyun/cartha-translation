revisions:
- from: Ma ọ bụghị mmadụ niile nwere ihe ọmụma a. Ụfọdụ, n’ihi na ha ka maara arụsị ahụ ahụ́ ruo ugbu a,[a] na-eri ya dị ka nri a chụrụ n’àjà nye arụsị; akọ na uche ha, ebe ọ bụ nke na-adịghị ike,[b] na-emerụkwa.
  to: Ma ọ bụghị mmadụ niile nwere ihe ọmụma a. Ụfọdụ, n’ihi mmekọrịta ha na arụsị ruo ugbu a,[a] na-eri nri ahụ dị ka nri e ji chụọ àjà nye arụsị; akọ na uche ha, ebe ọ na-adịghị ike,[b] na-adị emerụ.
  rationale: The revision replaces a verb of knowing with “mmekọrịta,” which can convey the source phrase’s habitual or continuing association without resolving its disputed syntax more narrowly than the Greek permits. It makes the food referent explicit and revises the final clause to express the weak conscience’s ongoing defilement. Footnote anchors and the supplied textual-variant note are retained.
  reviewer_model: gpt-5.6-terra
