review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the knowledge, idol-sacrificed food, weak conscience, and defilement. However, “ha ka maara arụsị ahụ ahụ́” means that they still know the idol, rather than expressing συνήθεια, their ingrained association or habitual involvement connected with the idol. “na-emerụkwa” is also less precise for the passive moral sense of μολύνεται and adds an unneeded ‘also.’
  naturalness: The revised wording uses idiomatic Standard Igbo while retaining the source’s difficult and somewhat open connection between συνήθεια and ἕως ἄρτι τοῦ εἰδώλου. “Nri ahụ” gives the pronoun a clear referent in Igbo.
  terminology: “Ihe ọmụma,” “arụsị,” “nri e ji chụọ àjà nye arụsị,” and “akọ na uche” are suitable. “Na-adị emerụ” represents the ongoing passive result, ‘is defiled,’ without supplying an external agent.
  issues:
  - severity: medium
    issue: The rendering of συνήθεια is semantically inaccurate.
    rationale: “Ha ka maara arụsị ahụ ahụ́” expresses continuing knowledge of an idol. The Greek denotes habit, customary association, or an ingrained connection with the idol; it does not use a verb of knowing.
  - severity: medium
    issue: The final verb does not clearly render μολύνεται.
    rationale: “Na-emerụkwa” can suggest that the conscience is being harmed and includes an unwarranted additive nuance. The Greek is passive and denotes moral defilement or contamination.
  - severity: low
    issue: The pronoun “ya” has no explicit antecedent within the verse in Igbo.
    rationale: Although the wider context supplies food, “nri ahụ” is clearer and remains faithful to the implied object of ἐσθίουσιν.
  revised_text: Ma ọ bụghị mmadụ niile nwere ihe ọmụma a. Ụfọdụ, n’ihi mmekọrịta ha na arụsị ruo ugbu a,[a] na-eri nri ahụ dị ka nri e ji chụọ àjà nye arụsị; akọ na uche ha, ebe ọ na-adịghị ike,[b] na-adị emerụ.
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, n’ụzọ dị nso n’okwu Grik, “n’ihi omume ma ọ bụ mmekọrịta ha na arụsị ruo ugbu a.” Nkebi okwu Grik a siri ike; ihe ọ pụtara bụ na ụfọdụ ka nọ n’okpuru mmetụta nke mmekọrịta ha na ofufe arụsị n’oge gara aga.
    reason: lexical_alternative
  - marker: b
    text: Ụfọdụ ihe odide nwere okwu a pụrụ ịsụgharị “akọ na uche nke arụsị,” ma ọ bụ mgbanwe yiri nke ahụ n’ebe a; ihe e dere n’amaokwu a gbasoro SBLGNT.
    reason: textual_variant
  revision_rationale: The revision replaces a verb of knowing with “mmekọrịta,” which can convey the source phrase’s habitual or continuing association without resolving its disputed syntax more narrowly than the Greek permits. It makes the food referent explicit and revises the final clause to express the weak conscience’s ongoing defilement. Footnote anchors and the supplied textual-variant note are retained.
