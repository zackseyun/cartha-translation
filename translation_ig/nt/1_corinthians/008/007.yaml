reference: 1 Corinthians 8:7
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἀλλ’ οὐκ ἐν πᾶσιν ἡ γνῶσις· τινὲς δὲ τῇ ⸀συνηθείᾳ ⸂ἕως ἄρτι τοῦ εἰδώλου⸃ ὡς εἰδωλόθυτον ἐσθίουσιν, καὶ ἡ συνείδησις αὐτῶν ἀσθενὴς οὖσα μολύνεται.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/007.yaml
  text: But not everyone has this knowledge[a]. Some, through familiarity with the idol until now, eat it as food sacrificed to an idol, and their conscience, being weak[b], is defiled.
translation:
  language: ig
  text: Ma ọ bụghị mmadụ niile nwere ihe ọmụma a. Ụfọdụ, n’ihi mmekọrịta ha na arụsị ruo ugbu a,[a] na-eri nri ahụ dị ka nri e ji chụọ àjà nye arụsị; akọ na uche ha, ebe ọ na-adịghị ike,[b] na-adị emerụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n’ụzọ dị nso n’okwu Grik, “n’ihi omume ma ọ bụ mmekọrịta ha na arụsị ruo ugbu a.” Nkebi okwu Grik a siri ike; ihe ọ pụtara bụ na ụfọdụ ka nọ n’okpuru mmetụta nke mmekọrịta ha na ofufe arụsị n’oge gara aga.
    reason: lexical_alternative
  - marker: b
    text: Ụfọdụ ihe odide nwere okwu a pụrụ ịsụgharị “akọ na uche nke arụsị,” ma ọ bụ mgbanwe yiri nke ahụ n’ebe a; ihe e dere n’amaokwu a gbasoro SBLGNT.
    reason: textual_variant
lexical_decisions:
- source_word: γνῶσις
  choice: ihe ọmụma
  rationale: Ọ bụ okwu Pọl ji maka ịma na ịghọta ihe; ọ na-ejikọkwa amaokwu a na okwu banyere ihe ndị ụfọdụ ‘maara’ n’amaokwu ndị bu ya ụzọ.
- source_word: συνήθεια
  choice: ha ka maara arụsị ahụ ahụ́
  rationale: Nke a na-egosi mmata na mmekọrịta ha na ofufe arụsị kemgbe ogologo oge, ọ bụghị naanị omume nkịtị.
- source_word: ἕως ἄρτι τοῦ εἰδώλου
  choice: ruo ugbu a
  rationale: E tinyere echiche oge dị na ἕως ἄρτι n’amaokwu ahụ, ma hapụkwa njikọ okwu Grik ahụ siri ike ka nkọwa ala peeji kọwaa ya.
- source_word: εἰδωλόθυτον
  choice: nri a chụrụ n’àjà nye arụsị
  rationale: Nke a na-egosi n'ụzọ doro anya na ọ bụ nri e jikọtara na àjà a chụrụ nye arụsị, n’ebughị ụzọ kwuo na arụsị bụ chi n’ezie.
- source_word: συνείδησις
  choice: akọ na uche
  rationale: Nke a bụ okwu Igbo a na-ejikarị akọwa ikike ime mmụọ nke mmadụ ji amata ihe ziri ezi na ihe na-ezighị ezi.
- source_word: ἀσθενής
  choice: na-adịghị ike
  rationale: Ọ na-echekwa okwu Pọl ji n’isiakwụkwọ a maka akọ na uche na-enweghị ike ma ọ bụ nkwụsi ike n’okwu a.
- source_word: μολύνεται
  choice: na-emerụkwa
  rationale: Ọ na-egosi na akọ na uche ha na-enweta mmetọ ma ọ bụ mmerụ n’ụzọ omume; ụdị na-egosi nnata omume dabara n’asụsụ Igbo eke.
theological_decisions:
- issue: Otu e si kwuo ọnọdụ nri a chụrụ nye arụsị n’emeghị ka ọ pụta na arụsị bụ chi n’ezie
  choice: na-eri ya dị ka nri a chụrụ n’àjà nye arụsị
  alternative: na-eri nri e ji chụọrọ arụsị àjà
  rationale: ‘Dị ka’ na-echekwa otú ndị na-eri ya si aghọta uru ofufe dị na nri ahụ, n’emeghị ka Pọl kwado na arụsị bụ chi n’ezie. Ọ na-ahapụkwa esemokwu echiche dị n’isiakwụkwọ ahụ ka ọ dị.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-agbaso usoro echiche Grik ma na-eji okwu Igbo eke; e tinyere akara ala peeji [a] na [b] kpọmkwem n’ebe ha metụtara.
