base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/002.yaml
  text: If anyone thinks he knows something[a], he does not yet know as he ought to know.
translation:
  language: ig
  text: Ọ bụrụ na onye ọ bụla chere na ya maara ihe[a], ọ kabeghị ama otú o kwesịrị isi mara.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Ọ bụrụ na onye ọ bụla chere na ya abịala ịmata ihe, ọ kabeghị ama otú o kwesịrị isi mara.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴ τις
  choice: Ọ bụrụ na onye ọ bụla
  rationale: Na-egosipụta ọnọdụ nwere ntụaka zuru ụwa ọnụ, n’ebughị n’obi naanị nwoke ma ọ bụ otu onye kpọmkwem.
- source_word: δοκεῖ
  choice: echee
  rationale: Na-egosi echiche onye ahụ nwere banyere onwe ya, nke dabara n’ịdọ aka ná ntị Pọl megide ịtụkwasị obi n’ihe mmadụ chere na ọ maara.
- source_word: ἐγνωκέναι τι
  choice: ọ maara ihe ọ bụla
  rationale: Oge perfect na-egosi ọnọdụ onye na-azọrọ na ya enwetala ihe ọmụma; okwu Igbo a bụ nke ebumpụta ụwa ma debe echiche ahụ. Ihe ọzọ ga-ekwe omume dị na nkọwa ala peeji.
- source_word: οὔπω ἔγνω
  choice: ọ mụtabeghị ịma ya
  rationale: Na-echekwa echiche ‘ọ bụghị ruo ugbu a’ na nke iru n’ịma ihe, ma na-eme ka ahịrịokwu ahụ bụrụ Igbo doro anya.
- source_word: καθὼς δεῖ γνῶναι
  choice: n’ụzọ o kwesịrị isi mara ya
  rationale: Na-echekwa ma echiche nke ụzọ e si amata ihe (καθὼς) ma ụkpụrụ kwesịrị ekwesị ma ọ bụ mkpa dị na δεῖ.
theological_decisions:
- issue: Ntụaka onye ọ bụla na-abụghị naanị nwoke
  choice: onye ọ bụla ... ọ
  alternative: nwoke ọ bụla ... ọ
  rationale: τις bụ nnọchiaha onye na-akọwaghị kpọmkwem ma na-emetụta onye ọ bụla; ‘onye ọ bụla’ anaghị egbochi ụmụ nwanyị.
- issue: Ụdị nkatọ Pọl
  choice: onye ahụ amụtabeghị ịma ihe n’ụzọ o kwesịrị
  alternative: onye ahụ amaghị ihe ọ bụla ma ọlị
  rationale: Amaokwu ahụ na-akatọ mpako na ezughị oke n’otú mmadụ si mara ihe, ọ bụghị ikwu na mmadụ enweghị ihe ọmụma ọ bụla. Nsụgharị a na-edebe esemokwu ahụ n’emeghị ka ọ bụrụ nkwupụta zuru oke megide ihe ọmụma.
- issue: Mmekọrịta dị n’etiti ἔγνω na γνῶναι
  choice: ịma ya ... mara ya
  alternative: ịmata ... mata
  rationale: A na-edebe otu mgbọrọgwụ okwu ahụ n’ebe abụọ ka njikọ okwu Grik doo anya, ebe ‘ya’ na-ezo aka n’ihe onye ahụ chere na ọ maara.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji ‘onye ọ bụla’ gosipụta generic τις, ma zere itinye ọdịiche okpukpe na-adịghị n’ihe odide Grik.
