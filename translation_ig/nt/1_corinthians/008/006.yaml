id: 1CO.8.6
reference: 1 Corinthians 8:6
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀλλ’ ἡμῖν εἷς θεὸς ὁ πατήρ, ἐξ οὗ τὰ πάντα καὶ ἡμεῖς εἰς αὐτόν, καὶ εἷς κύριος Ἰησοῦς Χριστός, δι’ οὗ τὰ πάντα καὶ ἡμεῖς δι’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/006.yaml
  text: yet for us there is one God[a], the Father, from whom are all things and we for him, and one Lord, Jesus the Messiah[c][b], through whom are all things and we through him.
translation:
  language: ig
  text: Ma maka anyị, e nwere otu Chineke, bụ Nna, onye ihe niile sitere n’aka ya, anyị dịkwa maka ya[a]; e nwekwara otu Onyenweanyị, Jizọs Mezaya[b], onye ihe niile sitere n’aka ya dị, anyị dịkwa site n’aka ya.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Okwu ahụ nwere ike igosi ntụziaka, njedebe, ma ọ bụ ebumnuche. “Maka ya” na-egosi na Chineke bụ onye anyị dịrị maka ya.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, “Jizọs Kraịst.” Okwu Grik bụ Χριστός nwere ike ịbụ aha nsọpụrụ, “Mezaya,” ma n’ọnọdụ ụfọdụ ọ na-adị ka akụkụ aha mmadụ, “Kraịst.”
    reason: alternative_reading
  - marker: c
    text: Ahịrịokwu abụọ ahụ—“ihe niile sitere n’aka ya” na “ihe niile sitere n’aka ya dị”—na-echekwa ọdịiche dị n’etiti Nna dịka isi mmalite na Jizọs Mezaya dịka onye ihe niile si n’aka ya dị.
    reason: cross_reference
lexical_decisions:
- source_word: ἀλλ’
  choice: Ma
  rationale: Ọ na-egosi ọdịiche dị n’etiti nkwupụta a na okwu banyere ndị a na-akpọ chi na ndị nwe n’amaokwu ndị bu ụzọ.
- source_word: ἡμῖν
  choice: n’ebe anyị nọ
  rationale: Dative a na-egosi ndị okwu a gbasara; nsụgharị a bụ Igbo nkịtị nke na-echekwa echiche nke ‘maka anyị’ n’enweghị mgbagwoju anya na nkebi ‘anyị dị maka ya.’
- source_word: εἷς θεὸς ὁ πατήρ
  choice: naanị otu Chineke, ya bụ Nna
  rationale: ‘Naanị otu’ na-eme ka nkwupụta ọnụọgụgụ ahụ doo anya, ebe ‘ya bụ Nna’ na-egosi na ὁ πατήρ na-akọwa onye otu Chineke ahụ bụ.
- source_word: ἐξ οὗ τὰ πάντα
  choice: onye ihe niile si na ya pụta
  rationale: ‘Si na ya pụta’ na-egosi isi mmalite ma na-echekwa ọrụ ἐξ n’enweghị ịgbakwụnye kpọmkwem na ihe niile bụ ihe e kere eke.
- source_word: καὶ ἡμεῖς εἰς αὐτόν
  choice: anyị dịkwa maka ya
  rationale: εἰς nwere ike igosi ebe a na-aga, ebumnuche, ma ọ bụ ihe mmadụ dịrị maka ya. ‘Maka ya’ na-egosi Chineke dịka njedebe na ebumnuche anyị, ma ekwughị ihe karịrị ihe Grik kwuru.
- source_word: εἷς κύριος
  choice: naanị otu Onyenweanyị
  rationale: ‘Onyenweanyị’ bụ aha nsọpụrụ Igbo a na-ejikarị asụgharị κύριος; e chekwara nhazi ya na ‘naanị otu Chineke.’
- source_word: Ἰησοῦς Χριστός
  choice: Jizọs bụ Mezaya
  rationale: N’usoro nkwupụta a, Χριστός na-arụ ọrụ dịka aha nsọpụrụ, ya mere ‘Mezaya’ na-eme ka ọrụ ahụ pụta ìhè karịa iji ya dịka akụkụ aha nkịtị.
- source_word: δι’ οὗ τὰ πάντα
  choice: onye ihe niile dị site na ya
  rationale: διά ya na genitive na-egosi ụzọ ma ọ bụ onye e ji mee ihe. ‘Site na ya’ na-echekwa ọdịiche ya na ‘si na ya pụta’ nke e ji kọwaa Nna.
- source_word: καὶ ἡμεῖς δι’ αὐτοῦ
  choice: anyị dịkwa site na ya
  rationale: E chekwara mkpụmkpụ na oghere nkọwa dị na Grik; nsụgharị ahụ anaghị amanye ya ka ọ bụrụ naanị ịdị ndụ, okike, ma ọ bụ nzọpụta.
theological_decisions:
- issue: Mmekọrịta dị n’etiti ‘otu Chineke’ na ‘otu Onyenweanyị’
  choice: 'E debere okwu abụọ ahụ n’usoro yiri ibe ha: ‘naanị otu Chineke, ya bụ Nna ... naanị otu Onyenweanyị, Jizọs bụ Mezaya.’'
  alternative: Ịsụgharị ‘Onyenweanyị’ n’ụzọ ga-ebelata ịdị arọ ya, ma ọ bụ ịgbakwụnye nkọwa Atọ n’Ime Otu nke amaokwu ahụ ekwughị kpọmkwem.
  rationale: Okwu Pọl na-ejikọta nkwupụta banyere otu Chineke na nkwupụta dị elu banyere Jizọs, ma ọ ka na-ekewa Nna na Jizọs site n’okwu ‘si na’ na ‘site na.’ Nsụgharị ahụ na-ahapụ esemokwu nkà mmụta okpukpe ahụ ka ọ dị.
- issue: Ọrụ preposition ndị e ji kọwaa Nna na Ọkpara
  choice: A sụgharịrị ἐξ dịka ‘si na ... pụta,’ εἰς dịka ‘maka,’ na διά dịka ‘site na.’
  alternative: Iji otu ahịrịokwu ahụ maka ἐξ na διά, ma ọ bụ ịsụgharị εἰς naanị dịka ntụziaka ‘gaa n’ebe ọ nọ.’
  rationale: 'Ọdịiche ndị a bụ akụkụ dị mkpa nke amaokwu ahụ: Nna bụ isi mmalite na ebumnuche, ebe Jizọs Mezaya bụ onye ihe niile dị site na ya. E chekwara ọdịiche ahụ n’enweghị ịkọwa ya gabiga ókè.'
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. ‘Onyenweanyị’ ka e ji dịka aha nsọpụrụ ọdịnala maka κύριος. E zere okwu ochie na nkọwa okpukpe agbakwunyere; e chekwara nhazi nkwupụta na ọdịiche preposition ndị dị na Grik.
