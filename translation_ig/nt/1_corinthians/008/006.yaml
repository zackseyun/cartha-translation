revisions:
- from: Ma n’ebe anyị nọ, e nwere naanị otu Chineke, ya bụ Nna, onye ihe niile si na ya pụta, anyị dịkwa maka ya[a]; e nwekwara naanị otu Onyenweanyị, Jizọs bụ Mezaya[b], onye ihe niile dị site na ya, anyị dịkwa site na ya.[c]
  to: Ma maka anyị, e nwere otu Chineke, bụ Nna, onye ihe niile sitere n’aka ya, anyị dịkwa maka ya[a]; e nwekwara otu Onyenweanyị, Jizọs Mezaya[b], onye ihe niile sitere n’aka ya dị, anyị dịkwa site n’aka ya.[c]
  rationale: The revision makes ἡμῖν explicit as “maka anyị,” restores the balanced elliptical form of the Greek clauses, and retains a lexical distinction between the Father as source and Jesus Messiah as the one through whom all things are. Footnote a no longer adds the unexpressed idea of physical movement.
  reviewer_model: gpt-5.6-terra
