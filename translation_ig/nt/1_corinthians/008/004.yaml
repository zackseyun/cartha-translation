id: 1CO.8.4
reference: 1 Corinthians 8:4
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Περὶ τῆς βρώσεως οὖν τῶν εἰδωλοθύτων οἴδαμεν ὅτι οὐδὲν εἴδωλον ἐν κόσμῳ, καὶ ὅτι οὐδεὶς ⸀θεὸς εἰ μὴ εἷς.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/004.yaml
  text: Therefore[a], concerning the eating of food sacrificed to idols, we know that an idol is nothing in the world[b], and that there is no God except one.
translation:
  language: ig
  text: Ya mere, gbasara iri nri e ji chụọrọ arụsị àjà, anyị maara na arụsị[a] abụghị ihe ọ bụla n’ụwa, nakwa na ọ dịghị chi ọbụla ma e wezụga otu Chineke.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “arụsị adịghị adị n’ezie n’ụwa.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ọ dịghị chi ma e wezụga otu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: βρώσεως
  choice: iri
  rationale: Aha a na-ezo aka n’omume iri ihe, ọ bụghị naanị nri ahụ; “iri” na-edobe echiche omume ahụ n’Igbo dị mfe.
- source_word: εἰδωλοθύτων
  choice: nri e ji chụọrọ arụsị àjà
  rationale: Nke a na-egosi nri metụtara àjà a chụụrụ arụsị, ma ọ naghị eme ka ihe a na-ekwu bụrụ naanị anụ.
- source_word: οἴδαμεν
  choice: anyị maara
  rationale: Nke a na-edobe ihe Pọl kwuru dị ka ihe ya na ndị Kọrịnt maara ọnụ.
- source_word: οὐδὲν εἴδωλον
  choice: arụsị abụghị ihe ọ bụla
  rationale: Ọ na-edobe okwu Grik ahụ nkenke ma na-egosi na arụsị enweghị ezi ọnọdụ n’eziokwu, ọ bụghị naanị na ọ baghị uru.
- source_word: ἐν κόσμῳ
  choice: n’ụwa
  rationale: “Ụwa” bụ okwu Igbo nkịtị dabara n’ebe a maka κόσμος.
- source_word: οὐδεὶς θεὸς εἰ μὴ εἷς
  choice: ọ dịghị Chineke ọzọ ma e wezụga otu Chineke
  rationale: Nke a bụ ụzọ Igbo doro anya isi kwuo na naanị otu Chineke dị, ebe ndetu ala na-edobekwa ohere iji “chi” dị ka aha izugbe.
- source_word: οὖν
  choice: Ya mere
  rationale: Ọ na-egosi nkwubi okwu ma ọ bụ njikọ echiche a na ihe ndị e kwuru n’ihu.
theological_decisions:
- issue: Ihe Pọl kwuru banyere arụsị na ịdị otu nke Chineke
  choice: E gosipụtara na arụsị abụghị ihe ọ bụla n’eziokwu, nakwa na naanị otu Chineke dị.
  alternative: A pụrụ ịsụgharị nke abụọ n’aha izugbe sị, “ọ dịghị chi ọ bụla ma e wezụga otu.”
  rationale: Nke a na-edobe nkwupụta siri ike nke amaokwu ahụ banyere otu Chineke n’enweghị ịgbakwunye nkọwa ozizi e mesịrị; ndetu ala na-echekwa ọdịiche enwere ike ịdị n’iji θεός dị ka aha izugbe.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “Ya mere” na-egosi njikọ echiche; “nri e ji chụọrọ arụsị àjà” na-ezere ime ka ihe ahụ bụrụ naanị anụ. E debere akara ndetu ala ozugbo n’akụkụ okwu ha na-akọwa.
