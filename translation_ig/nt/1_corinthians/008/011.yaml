    issue: “Kraịst Mesaya” translates Χριστός twice.
    rationale: The Greek has one term, Χριστός. The doublet introduces an unnecessary extra designation and is less natural than “Mesaya,” while also conflicting with the supplied policy of rendering the title as Messiah.
  - severity: low
    issue: Footnote a lists the main-text wording as an alternative.
    rationale: The main text already reads “na-ala n’iyi,” so presenting that same wording as an alternative is internally inconsistent. The footnote should give genuinely alternate renderings while preserving the ambiguity of the Greek.
  - severity: low
    issue: Footnote c describes both “Kraịst” and “Mesaya” although the revised main text uses only the latter.
    rationale: The note should directly explain the actual rendering and its titular sense.
