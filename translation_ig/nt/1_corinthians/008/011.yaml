id: 1CO.8.11
reference: 1 Corinthians 8:11
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸂ἀπόλλυται γὰρ⸃ ὁ ἀσθενῶν ⸀ἐν τῇ σῇ γνώσει, ⸂ὁ ἀδελφὸς⸃ δι’ ὃν Χριστὸς ἀπέθανεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/011.yaml
  text: For the weak one is destroyed by your knowledge—the brother for whom Messiah died[a][b][c].
translation:
  language: ig
  text: N’ihi na site n’ihe ọmụma gị, onye ahụ na-adịghị ike na-ala n’iyi[a]—nwanne ahụ[b] Mesaya nwụrụ n’ihi ya[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “a na-ebibi ya” ma ọ bụ “ọ na-emebi emebi.” Okwu Grik ahụ nwere ike ịpụta mbibi dị ukwuu; amaokwu a anaghị ekpebi kpọmkwem ma Pọl ọ na-ekwu maka mmebi ime mmụọ n’oge a, mbibi ikpeazụ, ma ọ bụ ha abụọ.
    reason: alternative_reading
  - marker: b
    text: “Nwanne” n’ebe a pụtara onye otu okwukwe; n’ihe gbasara itinye okwu a n’ọrụ, ọ pụrụ ịbụ nwoke ma ọ bụ nwanyị kwere ekwe.
    reason: lexical_alternative
  - marker: c
    text: Okwu Grik bụ Χριστός, nke pụtara “Mesaya”; a sụgharịwo ya “Mesaya” n’ebe a n’ihi na ọ na-arụ ọrụ dịka aha ọkwá.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπόλλυται
  choice: na-ala n’iyi
  rationale: Okwu a na-egosi mbibi ma ọ bụ ịla n’iyi siri ike. Nsụgharị a na-edobe ịdị arọ ya ma hapụkwa ihe Pọl bu n’obi—ma ọ bụ mmebi ime mmụọ ugbu a, mbibi ikpeazụ, ma ọ bụ ha abụọ—ka ọ ghara idozi ya n’amaghị ama.
- source_word: γάρ
  choice: N’ihi na
  rationale: Ọ na-ejikọta amaokwu a na ịdọ aka ná ntị bu ya ụzọ dịka nkọwa ma ọ bụ ihe kpatara ya.
- source_word: ὁ ἀσθενῶν
  choice: onye ahụ na-adịghị ike
  rationale: Nke a na-egosipụta participle e ji dịka aha, na-etinye uche n’otu onye ahụ na-adịghị ike n’etinyeghị ‘nwanne’ ebe a tupu okwu ahụ apụta n’akụkụ nke ọzọ.
- source_word: ἐν τῇ σῇ γνώσει
  choice: site n’ihe ọmụma gị
  rationale: 'ἐν n’ebe a na-egosi ụzọ ma ọ bụ ọnọdụ na-akpata ihe: iji ‘ihe ọmụma’ onye ahụ eme ihe bụ ụzọ e si ebibi onye na-adịghị ike.'
- source_word: γνῶσις
  choice: ihe ọmụma
  rationale: 'Ọ na-edobe okwu Pọl ji ugboro ugboro n’akụkụ a nakwa ihe ịtụnanya dị na ya: ihe a na-akpọ ihe ọmụma na-emebi onye kwere ekwe ibe mmadụ.'
- source_word: ὁ ἀδελφός
  choice: nwanne ahụ
  rationale: Igbo ‘nwanne’ na-egosi onye otu ezinụlọ ma na-arụkwa ọrụ nke ọma maka onye otu okwukwe. Ọ naghị amanye nwoke ma ọ bụ nwanyị ebe usoro okwu Igbo anaghị achọ ime otú ahụ.
- source_word: δι’ ὃν
  choice: n’ihi ya
  rationale: Nke a na-egosi onye Kraịst Mesaya nwụrụ maka ya, n’ụzọ dị mfe ma bụrụ nke Igbo nkịtị.
- source_word: Χριστός
  choice: Kraịst Mesaya
  rationale: Χριστός bụ aha ọkwá nke pụtara Mesaya. ‘Kraịst Mesaya’ na-eme ka okwu a bụrụ nke ndị na-agụ Bible n’Igbo maara ma na-eme ka ihe aha ọkwá ahụ pụtara doo anya.
- source_word: ἀπέθανεν
  choice: nwụrụ
  rationale: Aorist indicative a na-ekwu kpọmkwem banyere ọnwụ Kraịst Mesaya dịka ihe mere eme gara aga.
theological_decisions:
- issue: Ma ἀπόλλυται ọ na-ekwu kpọmkwem maka ikpe ọmụma ebighị ebi nke ezi onye kwere ekwe
  choice: na-ala n’iyi
  alternative: a na-ebibi ya; ọ na-ala n’iyi ruo mbibi ikpeazụ
  rationale: E debere okwu siri ike nke mbibi, ma a naghị ekpebi ma ọ bụ mmebi ime mmụọ ugbu a, mbibi ikpeazụ, ma ọ bụ ha abụọ. Nke a na-echekwa mgbagwoju anya na esemokwu nkà mmụta okpukpe dị n’amaokwu ahụ.
- issue: Ma ὁ ἀδελφός kwesịrị ịpụta naanị dị ka nwoke
  choice: nwanne ahụ
  alternative: nwanna nwoke ahụ; onye otu okwukwe ahụ
  rationale: Okwu Grik bụ masculine singular, ma ‘nwanne’ n’Igbo bụ okwu ebumpụta ụwa nke nwere ike izo aka n’otu onye otu okwukwe n’enweghị ịgbakwunye nkọwa nwoke nke asụsụ Igbo na-adịghị amanye. Ihe odide ala ala peeji na-akọwa ọrụ ya n’ebe a.
- issue: Otu e si akọwa Χριστός dịka aha ọkwá
  choice: Kraịst Mesaya
  alternative: Kraịst; Mesaya
  rationale: Nsụgharị a na-edobe ụdị a maara nke ọma ‘Kraịst’ ma na-ekwupụta na Χριστός n’ebe a bụ aha ọkwá ‘Mesaya,’ ọ bụghị naanị aha mmadụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ usoro ‘site n’ihe ọmụma gị’ iji gosi ụzọ omume onye nwere ihe ọmụma si emerụ onye na-adịghị ike, ebe akara ogologo na-eme ka ‘nwanne ahụ’ kọwaa onye ahụ e kwuru okwu ya. Akara ala ala peeji niile [a], [b], [c] dị n’ederede isi.
