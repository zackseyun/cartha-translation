  yaml_path: translation/nt/1_corinthians/008/003.yaml
  text: But if anyone loves God[a], this one is known by him.
translation:
  language: ig
  text: Ma ọ bụrụ na onye ọ bụla hụrụ Chineke n’anya, Chineke amatala onye ahụ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “Chineke maara onye ahụ,” ma ọ bụ, “Chineke amarala onye ahụ.” Ụdị perfect passive nke ngwaa Grik nwere ike igosi ọnọdụ na-adịgide adịgide nke sitere n’ịbụ onye Chineke marala.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δέ
  choice: Ma ọ bụrụ na
  rationale: Ọ na-egosi ọnọdụ ma na-ewetakwa obere ntụgharị megide okwu bu ya ụzọ; nkebiokwu a bụ ụzọ Igbo dị n’usoro si kwuo ya.
- source_word: τις
  choice: onye ọ bụla
  rationale: Ọ na-edobe ntụaka izugbe nke nnọchiaha ahụ n’enweghị ime ka ọ bụrụ naanị nwoke.
- source_word: ἀγαπᾷ
  choice: hụrụ ... n’anya
  rationale: Nke a bụ ụzọ Igbo nkịtị na nke doro anya si kwuo ịhụ mmadụ n’anya, ma ọ dabara n’ụdị ihe omume na-aga n’ihu nke ngwaa Grik.
- source_word: τὸν θεόν
  choice: Chineke
  rationale: Nke a bụ ntụgharị Igbo kwesịrị ekwesị nke aha a mgbe ọ na-ezo aka n’ebe Chineke nọ.
- source_word: οὗτος
  choice: onye ahụ
  rationale: Ọ na-edobe ike ntụaka nke nnọchiaha ngosi Grik ma na-ezo anya n’onye a kọwara n’ahịrịokwu ọnọdụ ahụ.
- source_word: ἔγνωσται
  choice: maara
  rationale: Ngwaa Igbo a na-ekwupụta ịbụ onye Chineke maara n’ụzọ eke. N’ihi na Grik bụ perfect passive, nkọwa ala na-egosi na ọ pụrụ ịgụnye ọnọdụ na-adịgide adịgide nke sitere n’ịbụ onye a marala.
- source_word: ὑπ’ αὐτοῦ
  choice: Chineke
  rationale: Ikwughachi ‘Chineke’ na-eme ka onye na-eme omume ahụ doo anya n’Igbo ma zere nnọchiaha nwere ike ịda ka ọ na-ezo n’onye ahụ.
theological_decisions:
- issue: Ihe ‘ịbụ onye Chineke maara’ pụtara
  choice: Chineke maara onye ahụ
  alternative: Chineke nabatara onye ahụ; Chineke amatala onye ahụ
  rationale: γινώσκω nwere ike ịpụta ihe karịrị nanị inwe ihe ọmụma, gụnyere mmekọrịta, nnabata, ma ọ bụ ịmata onye ahụ dịka nke ya. E debere okwu sara mbara ka a ghara ịmanye otu nkọwa ozizi pụrụ iche.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ ‘onye ahụ’ iji chekwaa ntakịrị ike dị na οὗτος; a kpọghachiri ‘Chineke’ kama ‘ya’ maka ido anya n’Igbo.
