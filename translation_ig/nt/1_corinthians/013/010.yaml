  text: But when the perfect comes[b][a], the partial will be set aside.
translation:
  language: ig
  text: Ma mgbe ihe zuru oke[a] bịara, a ga-ewepụ ihe ezughị ezu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “ihe zuru ezu” ma ọ bụ “ihe tozuru oke.” Ihe “to teleion” n’asụsụ Grik na-ezo aka na ya abụghị ihe doro anya; ọ pụrụ igosi izu ezu, ntozu oke, ma ọ bụ mmezu ikpeazụ, n’adịghị ka ọnọdụ a na-ahụ naanị n’akụkụ ugbu a.
    reason: alternative_reading
  - marker: b
    text: A pụkwara ịsụgharị ya “a ga-eme ka ọ kwụsị,” “ọ ga-agabiga,” ma ọ bụ “a ga-akwụsị ya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν
  choice: mgbe
  rationale: Ọ na-ewebata oge ihe a na-atụ anya ya ga-eme; “mgbe” bụ okwu Igbo kachasị kwekọọ n’ebe a.
- source_word: δὲ
  choice: Ma
  rationale: Ọ na-egosi obere ọdịiche n’etiti ihe zuru oke na ihe Pọl kwuru tupu ya banyere ihe dị naanị n’akụkụ.
- source_word: ἔλθῃ
  choice: bịara
  rationale: N’ahịrịokwu oge nke Igbo, “mgbe ... bịara” na-egosi ihe a na-atụ anya ya n’ọdịnihu n’ụzọ eke.
- source_word: τὸ τέλειον
  choice: ihe zuru oke
  rationale: Nhọrọ a na-edobe obosara τέλειον, nke pụrụ ịpụta ihe zuru ezu, ihe zuru oke, ma ọ bụ ihe tozuru oke, n’akọwaghị kpọmkwem ihe ọ na-ezo aka na ya.
- source_word: τὸ ἐκ μέρους
  choice: ihe dị naanị n’akụkụ
  rationale: Nkebiokwu Grik a na-arụ ọrụ dịka aha ma na-egosi ihe e nwere n’ụzọ na-ezughị ezu; nsụgharị a na-echekwa ọdịiche ya na “ihe zuru oke.”
- source_word: καταργηθήσεται
  choice: a ga-ewepụ
  rationale: Ọdịdị ọdịnihu nke nnara a na-egosi na a ga-eme ka ihe dị n’akụkụ kwụsị ịrụ ọrụ ma ọ bụ kwụsị ịdị mkpa, n’enweghị ikwu na a ga-ebibi ya kpamkpam.
theological_decisions:
- issue: Ihe τὸ τέλειον na-ezo aka na ya
  choice: A sụgharịrị ya n’ozuzu dịka “ihe zuru oke,” n’akọwaghị kpọmkwem ihe ọ bụ.
  alternative: “Ihe zuru ezu,” “ihe tozuru oke,” ma ọ bụ mmezu ikpeazụ nke oge a mgbe Kraịst ga-abịa na mgbe a ga-amata ihe ihu na ihu.
  rationale: Grik nke amaokwu a akọwaghị kpọmkwem ihe okwu ahụ na-ezo aka na ya. Ya mere, nsụgharị ahụ na-edobe nghọta dị iche iche o nwere kama idozi esemokwu ahụ dịka otu ozizi pụrụ iche.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta mee ihe. “Ihe zuru oke” na “ihe dị naanị n’akụkụ” na-eme ka ọdịiche dị n’amaokwu ahụ pụta ìhè ma na-edobe mgbagwoju anya nke isiokwu ahụ.
