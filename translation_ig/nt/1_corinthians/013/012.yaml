id: 1CO.13.12
reference: 1 Corinthians 13:12
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: βλέπομεν γὰρ ἄρτι δι’ ἐσόπτρου ἐν αἰνίγματι, τότε δὲ πρόσωπον πρὸς πρόσωπον· ἄρτι γινώσκω ἐκ μέρους, τότε δὲ ἐπιγνώσομαι καθὼς καὶ ἐπεγνώσθην.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/012.yaml
  text: For now we see in a mirror[a], dimly, but then face to face. Now I know in part, but then I will know fully, just as I also have been fully known.
translation:
  language: ig
  text: N’ihi na ugbu a, anyị na-ahụ site n’enyo, n’ilu[a]; ma mgbe ahụ, anyị ga-ahụ ihu na ihu. Ugbu a, ama m naanị akụkụ ụfọdụ; ma mgbe ahụ, m ga-amata nke ọma, dị nnọọ ka a matakwara m nke ọma.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’ụzọ na-edoghị anya.” N’asụsụ Grik, okwu ahụ pụtara n’ụzọ nkịtị karị, “n’ilu” ma ọ bụ “n’okwu mgbagwoju anya,” na-egosi ịhụ na nghọta nke na-adịghị apụta ìhè kpọmkwem.
    reason: lexical_alternative
lexical_decisions:
- source_word: βλέπομεν
  choice: anyị na-ahụ
  rationale: Ọ na-echekwa ihe atụ nke ịhụ anya, ma kwekọọkwa n’echiche nke ịghọta ihe.
- source_word: ἄρτι
  choice: ugbu a
  rationale: Ọ na-egosipụta ọnọdụ nke ugbu a n’ụzọ doro anya, n’adịghị ka τότε, ‘mgbe ahụ.’
- source_word: δι’ ἐσόπτρου
  choice: site n’enyo
  rationale: ‘Site n’enyo’ na-echekwa διά na genitive, ya bụ ịhụ ihe site n’ihe na-eme ka ọhụụ ghara ịbụ nke ihu na ihu.
- source_word: ἐν αἰνίγματι
  choice: dị ka n’ilu
  rationale: αἴνιγμα bụ ilu ma ọ bụ okwu mgbagwoju anya; nsụgharị a na-echekwa echiche nke nghọta na-apụtachaghị ìhè kama ịsụgharị ya naanị dị ka ‘n’ụzọ na-edoghị anya.’
- source_word: πρόσωπον πρὸς πρόσωπον
  choice: ihu na ihu
  rationale: Nke a bụ akpaala okwu Igbo kwekọrọ n’ahịrị Grik, na-egosi nzute ma ọ bụ ịhụ ihe n’enweghị ihe dị n’etiti.
- source_word: γινώσκω ἐκ μέρους
  choice: ama m nanị otu akụkụ
  rationale: Ọ na-egosipụta na ihe ọmụma nke ugbu a ezughị ezu ma na-echekwa okwu ‘akụkụ.’
- source_word: ἐπιγνώσομαι
  choice: m ga-amata nke ọma
  rationale: Ọ na-egosipụta ọmụma zuru ezu karịa nke ugbu a n’enweghị ikwu na mmadụ ga-amata ihe niile dịka Chineke.
- source_word: καθὼς καὶ ἐπεγνώσθην
  choice: dị nnọọ ka a matakwara m nke ọma
  rationale: Ọ na-echekwa njikọ okwu ya na ἐπιγνώσομαι, tinyere passive nke na-ahapụghị onye maara ya aha, dịka Grik si mee.
theological_decisions:
- issue: Oke ihe ọmụma a ga-enwe n’ọdịnihu
  choice: m ga-amata nke ọma
  alternative: m ga-amata ihe niile
  rationale: Akụkụ Akwụkwọ Nsọ a na-emegide ihe ọmụma nke akụkụ na ihe ọmụma zuru ezu karị, ma ọ naghị ekwu hoo haa na ndị kwere ekwe ga-enwe ihe ọmụma na-enweghị oke dịka Chineke.
- issue: Onye ‘matara m nke ọma’
  choice: A hapụrụ onye ahụ n’aha site n’iji ‘a matakwara m’
  alternative: Chineke matara m nke ọma
  rationale: Grik ji passive eme ihe ma ọ kpọghị onye maara ya aha; idebe nke ahụ na-ezere ịgbakwunye ihe ederede ekwughị kpọmkwem.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E debere ihe atụ enyo, ilu, na ọdịiche dị n’etiti ‘ugbu a’ na ‘mgbe ahụ.’
