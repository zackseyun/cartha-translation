id: 1CO.13.4
reference: 1 Corinthians 13:4
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἡ ἀγάπη μακροθυμεῖ, χρηστεύεται ἡ ἀγάπη, οὐ ζηλοῖ ⸂ἡ ἀγάπη⸃, οὐ περπερεύεται, οὐ φυσιοῦται,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/004.yaml
  text: Love is patient[a], love is kind. It does not envy, it does not boast[b], it is not puffed up.
translation:
  language: ig
  text: Ịhụnanya na-enwe ndidi, ịhụnanya na-egosi obiọma. Ọ naghị enwe anyaụfụ[a], ọ naghị atụ ọnụ, ọ naghị afụli onwe ya elu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ọ naghị ekwo ekworo.” Ngwaa Grik ahụ nwekwara ike ịpụta ịnụ ọkụ n’obi, ma ihe gbara ya gburugburu ebe a na-akwado echiche na-adịghị mma nke anyaụfụ ma ọ bụ ekworo.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ọ naghị enwe mpako.” Pọl ji ihe atụ nke onye fụrụ elu n’ihi mpako mee ihe.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγάπη
  choice: ịhụnanya
  rationale: “Ịhụnanya” bụ okwu Igbo nkịtị, sara mbara, nke dabara n’ịhụnanya a Pọl na-akọwa; ọ naghị eme ka ihe ọ pụtara bụrụ naanị inye ndị nọ ná mkpa ihe.
- source_word: μακροθυμεῖ
  choice: na-enwe ndidi
  rationale: Nke a na-egosi inwe ndidi ruo ogologo oge, karịchaa n’ebe ndị ọzọ nọ, n’asụsụ Igbo doro anya ma dị ugbu a.
- source_word: χρηστεύεται
  choice: na-egosi obiọma
  rationale: Ngwaa Grik a na-ekwu maka ime ihe n’obiọma; “na-egosi obiọma” na-echekwa echiche nke omume, ọ bụghị naanị àgwà mmadụ nwere.
- source_word: ζηλοῖ
  choice: ekwo ekworo
  rationale: Ọnọdụ okwu na-adịghị mma ebe a na-akwado echiche nke anyaụfụ ma ọ bụ ekworo, ọ bụghị ịnụ ọkụ n’obi dị mma.
- source_word: περπερεύεται
  choice: etu ọnụ
  rationale: “Itu ọnụ” bụ ụzọ Igbo doro anya na nke kwesịrị ekwesị isi kwuo igosi onwe onye ma ọ bụ ịnya isi n’okwu.
- source_word: φυσιοῦται
  choice: afụli onwe ya elu
  rationale: Nhọrọ a na-echekwa ihe atụ Pọl ji banyere mmadụ ‘ịfụli’ onwe ya n’ihi mpako, kama ime ka ọ bụrụ naanị nkọwa efu nke mpako.
- source_word: ἡ ἀγάπη ... ἡ ἀγάπη ... ⸂ἡ ἀγάπη⸃
  choice: Ịhụnanya ... ịhụnanya ... Ọ
  rationale: E kwughachiri “ịhụnanya” na nkebi abụọ mbụ iji debe nkwusi ike nke Grik; “Ọ” na nkebi ndị na-esote na-eme ka Igbo bụrụ nke na-aga were were n’enweghị ikwughachi okwu ahụ gabiga ókè.
- source_word: οὐ
  choice: ọ dịghị
  rationale: “Ọ dịghị” na-enye nkwụsi ike nke mmegide ndị a n’ụzọ dị nkenke ma dịkwa ugwu n’Igbo.
theological_decisions:
- issue: Nsụgharị ἀγάπη n’akụkụ Akwụkwọ Nsọ a na-akụzi banyere omume na okwukwe
  choice: ịhụnanya
  alternative: ọrụ ebere
  rationale: “Ịhụnanya” na-echekwa obosara echiche Grik ahụ. “Ọrụ ebere” ga-eme ka ọ dị ka naanị inyere ndị nọ ná mkpa aka, nke dị warara karịa ihe akụkụ a na-ekwu.
- issue: Ma ζηλοῖ ọ̀ pụtara ịnụ ọkụ n’obi ma ọ bụ ekworo/anyaụfụ
  choice: ekwo ekworo
  alternative: nwee ịnụ ọkụ n’obi
  rationale: N’usoro àgwà ọjọọ ịhụnanya na-adịghị eme, echiche na-adịghị mma nke ekworo ma ọ bụ anyaụfụ ka dabara; e debere obosara okwu Grik ahụ na nkọwa ala peeji.
- issue: Otu e si debe ihe atụ dị na φυσιοῦται
  choice: afụli onwe ya elu
  alternative: dị mpako
  rationale: Nhọrọ bụ isi na-echekwa ihe atụ nke ịbụ onye fụrụ elu n’ihi mpako, ebe “dị mpako” bụ nkọwa ziri ezi ma na-ewepụ ihe atụ ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe nghọta ma nwee ugwu. Ahịrịokwu ndị ahụ dị nkenke iji debe usoro okwu na nkwusi ike nke Grik. E tinyere akara nkọwa [a] kpọmkwem n’ebe ζηλοῖ dị na [b] n’ebe φυσιοῦται dị, ka nkọwa nke ọ bụla kwekọọ n’okwu ọ na-akọwa.
