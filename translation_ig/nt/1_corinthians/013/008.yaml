  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἡ ἀγάπη οὐδέποτε ⸀πίπτει. εἴτε δὲ προφητεῖαι, καταργηθήσονται· εἴτε γλῶσσαι, παύσονται· εἴτε γνῶσις, καταργηθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/008.yaml
  text: Love never fails[a]. But whether there are prophecies, they will be set aside; whether tongues, they will cease; whether knowledge[c][b], it will be set aside.
translation:
  language: ig
  text: Ịhụnanya anaghị ada ada[a]. Ma okwu amụma, a ga-eme ka ha ghara ịrụ ọrụ ọzọ; asụsụ[b], ha ga-akwụsị; ihe ọmụma, a ga-eme ka ọ ghara ịrụ ọrụ ọzọ[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “Ịhụnanya anaghị ada,” ma ọ bụ, “Ịhụnanya anaghị agwụ agwụ.”
    reason: lexical_alternative
  - marker: b
    text: N'ụzọ nkịtị, “ire”; a pụkwara ịsụgharị ya “ire dị iche iche.”
    reason: lexical_alternative
  - marker: c
    text: Otu ngwaa Greek ahụ ka a sụgharịrị “a ga-eme ka … ghara ịrụ ọrụ ọzọ” ma n’ebe e kwuru okwu amụma ma n’ebe e kwuru ihe ọmụma.
    reason: cross_reference
lexical_decisions:
- source_word: ἀγάπη
  choice: ịhụnanya
  rationale: Ọ bụ okwu Igbo a na-ejikarị akọwa ịhụnanya sara mbara Pọl na-ekwu maka ya, ọ bụghị naanị ebere ma ọ bụ enyemaka ebere.
- source_word: οὐδέποτε πίπτει
  choice: adịghị ada ada
  rationale: Nkebiokwu Igbo a na-egosi na ịhụnanya anaghị emezughị ihe a tụrụ anya ya ma ọ bụ daa kpamkpam, ma ọ ka na-echekwa oyiyi nke ngwaa Greek bụ ‘ịda.’
- source_word: προφητεῖαι
  choice: okwu amụma
  rationale: Ụdị a na-egosi ozi ma ọ bụ okwu e kwuru site n’ibu amụma, ma na-anọgide n’ụdị ọtụtụ dịka Greek si dị.
- source_word: καταργηθήσονται / καταργηθήσεται
  choice: a ga-eme ka ha/ọ ghara ịrụ ọrụ ọzọ
  rationale: Nke a na-egosi na ihe ndị ahụ agaghịzi arụ ọrụ, n’enweghị ikwu na a ga-ebibi ha kpamkpam; otu ntụgharị ahụ ka e ji mee ebe abụọ ngwaa ahụ pụtara.
- source_word: γλῶσσαι
  choice: asụsụ dị iche iche
  rationale: N’ọnọdụ 1 Ndị Kọrịnt 12–14, nke a na-egosi ihe a na-akpọ ịsụ asụsụ dị iche iche, ma ntụgharị ahụ anaghị ekpebi ụdị asụsụ ndị ahụ kpọmkwem.
- source_word: παύσονται
  choice: ha ga-akwụsị
  rationale: Nke a bụ ụzọ Igbo doro anya isi gosipụta nkwụsị, ma ọ dị iche na okwu e ji sụgharịa καταργέω n’akụkụ abụọ ndị ọzọ.
- source_word: γνῶσις
  choice: ihe ọmụma
  rationale: Ọ bụ ntụgharị Igbo nkịtị nke γνῶσις, kwekọrọ na okwu banyere ịmata ihe n’akụkụ amaokwu ndị na-esote.
theological_decisions:
- issue: Ihe πίπτει pụtara n’okwu banyere ịhụnanya
  choice: Ịhụnanya adịghị ada ada
  alternative: Ịhụnanya anaghị agwụ agwụ
  rationale: Nhọrọ a na-egosi ntụkwasị obi na ịdịgide nke ịhụnanya, ma ọ naghị eme ka πίπτει bụrụ otu ihe kpọmkwem na ngwaa ndị na-ekwu na onyinye ndị ọzọ ga-akwụsị.
- issue: Ihe γλῶσσαι pụtara n’isiakwụkwọ a
  choice: asụsụ dị iche iche
  alternative: ire dị iche iche
  rationale: ‘Asụsụ dị iche iche’ bụ okwu ndị na-agụ Igbo taa ga-aghọta nke ọma. Ọ naghị ekpebi ma ihe a bụ asụsụ mmadụ a maara ama ka ọ bụ ụdị okwu ebube ọzọ.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E debere usoro ihe atọ dị na Greek na ọdịiche dị n’etiti καταργέω na παύω; e zerekwa ikpebi arụmụka banyere ụdị ‘asụsụ dị iche iche’ a na-ekwu maka ya.
