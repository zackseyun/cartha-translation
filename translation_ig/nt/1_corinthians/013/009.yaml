  yaml_path: translation/nt/1_corinthians/013/009.yaml
  text: For we know in part[a], and we prophesy in part.
translation:
  language: ig
  text: N’ihi na anyị maara n’akụkụ ụfọdụ[a], anyị na-ebukwa amụma n’akụkụ ụfọdụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “n’ụzọ na-ezughị ezu.” Okwu Grik ahụ pụtara “n’akụkụ ụfọdụ,” e kwughachikwara ya n’ahịrịokwu abụọ ahụ iji mesie ya ike.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ μέρους
  choice: naanị otu akụkụ
  rationale: Nkebiokwu a pụtara na ihe ọmụma na ibu amụma ha ezughị ezu. Ikwughachi ya n’ahịrịokwu abụọ ahụ na-echekwa nhazi na nkwusi ike nke Grik, ma kwadebekwa ọdịiche ya na ihe zuru oke nke a kpọrọ aha n’amaokwu na-esonụ.
- source_word: γὰρ
  choice: N’ihi na
  rationale: Ọ na-egosi na okwu a na-akọwa ihe e kwuru tupu ya; “N’ihi na” bụ njikọ nkọwa doro anya ma bụrụkwa Igbo a na-asụkarị.
- source_word: γινώσκομεν
  choice: anyị maara
  rationale: Nke a na-enye kpọmkwem echiche nke ịma ihe, n’etinyeghị nkọwa ọzọ dịka nghọta miri emi.
- source_word: καὶ
  choice: anyị na-ebukwa
  rationale: Mgbakwunye “-kwa” na-ejikọta ahịrịokwu abụọ yiri ibe ha n’ụzọ dị mma n’Igbo, kwekọọkwa na καὶ.
- source_word: προφητεύομεν
  choice: anyị na-ebu amụma
  rationale: “Ibu amụma” bụ okwu Igbo a maara nke ọma maka ọrụ onye amụma, ma ọ naghị akpọchi ihe ọ pụtara n’ịkọ nanị ihe ga-eme n’ọdịnihu ma ọ bụ n’ikwusa ozi.
theological_decisions:
- issue: Ihe ọrụ ibu amụma n’ọgbakọ pụtara
  choice: anyị na-ebu amụma
  alternative: anyị na-ekwu ihe Chineke nyere n’ike mmụọ; anyị na-ekwusa ozi
  rationale: Ihe gbara amaokwu a gburugburu bụ onyinye nke Mmụọ. Nsụgharị a na-echekwa obosara nke προφητεύω, n’emeghị ka ọ bụrụ naanị ịkọ ọdịnihu ma ọ bụ naanị ikwusa ozi.
- issue: Oke ihe ọmụma na amụma
  choice: naanị otu akụkụ
  alternative: n’ụzọ na-ezughị ezu
  rationale: “Naanị otu akụkụ” na-echekwa ihe atụ dị na akpaalaokwu Grik na nkwughachi ya, ma ọ naghị ekpebi kpọmkwem ụdị ma ọ bụ ihe kpatara ezughị-ezu ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta mee ihe. E chekwara nhazi yiri ibe ya nke ahịrịokwu Grik abụọ ahụ. Akara ndetu [a] dị n’ebe nkebiokwu mbụ pụtara, ebe ndetu ahụ kọwara na okwu ahụ metụtakwara nkwughachi nke abụọ.
