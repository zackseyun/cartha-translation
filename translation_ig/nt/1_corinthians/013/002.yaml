id: 1CO.13.2
reference: 1 Corinthians 13:2
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸂καὶ ἐὰν⸃ ἔχω προφητείαν καὶ εἰδῶ τὰ μυστήρια πάντα καὶ πᾶσαν τὴν γνῶσιν, ⸄καὶ ἐὰν⸅ ἔχω πᾶσαν τὴν πίστιν ὥστε ὄρη ⸀μεθιστάναι, ἀγάπην δὲ μὴ ἔχω, οὐθέν εἰμι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/002.yaml
  text: And if I have prophecy and understand all mysteries and all knowledge[a], and if I have all faith so as to move mountains, but do not have love, I am nothing.
translation:
  language: ig
  text: Ọ bụrụkwa na m nwere amụma, marakwa ihe omimi niile na ihe ọmụma niile, ọ bụrụkwa na m nwere okwukwe niile[a], nke ga-eme ka m kwaga ugwu, ma enweghị m ịhụnanya, abụghị m ihe ọ bụla.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ntụkwasị obi niile.” Okwu Grik ahụ nwere ike inwe ihe ndị ọzọ ọ pụtara, ma n’ebe a ọ yikarịrị ka ọ na-ekwu maka okwukwe pụrụ iche nke pụrụ ime ihe dị ịtụnanya.
    reason: lexical_alternative
lexical_decisions:
- source_word: προφητείαν
  choice: amụma
  rationale: Ọ na-edobe aha ahụ n'ozuzu ya n'ihe gbasara onyinye ime mmụọ, n'ebughị ụzọ kọwaa ya dị ka ọrụ, ọkwa, ma ọ bụ ikike.
- source_word: εἰδῶ
  choice: marakwa
  rationale: Ngwaa 'ịma' dabara n'ụzọ ebumpụta ụwa na 'ihe omimi,' ma na-ahapụ γνῶσις ka a sụgharịa ya 'ihe ọmụma.'
- source_word: μυστήρια
  choice: ihe omimi
  rationale: Ọ na-echekwa echiche Pọl banyere ihe nzuzo ma ọ bụ eziokwu ndị zoro ezo, n'emeghị ka ihe ọ pụtara dị warara.
- source_word: πᾶσαν τὴν γνῶσιν
  choice: ihe ọmụma niile
  rationale: Nsụgharị a na-echekwa ịdị iche n'etiti ngwaa εἰδῶ na aha γνῶσις, tinyere ikwubiga okwu ókè nke πᾶσαν.
- source_word: πᾶσαν τὴν πίστιν
  choice: okwukwe zuru ezu
  rationale: N'Igbo, nke a na-egosi oke okwukwe e kwuru maka ya n'ọnọdụ a n'ụzọ doro anya, kama okwu nwere ike ịdị arọ ma ọ bụrụ na a sụgharịa ya kpọmkwem dịka 'okwukwe niile.'
- source_word: ὥστε ὄρη μεθιστάναι
  choice: nke na m pụrụ ịkwaga ugwu
  rationale: Ọ na-egosipụta nsonaazụ ma na-echekwa ihe atụ siri ike nke ịkwaga ugwu.
- source_word: ἀγάπην
  choice: ịhụnanya
  rationale: Nke a bụ okwu Igbo nkịtị ma dị ùgwù maka ἀγάπη, n'emeghị ka ọ bụrụ naanị ọrụ ebere.
- source_word: οὐθέν εἰμι
  choice: abụghị m ihe ọ bụla
  rationale: Ọ na-echekwa okwu Pọl siri ike banyere onwe ya n'ụzọ doro anya ma kwụ ọtọ.
theological_decisions:
- issue: Ihe πίστις pụtara n'ọnọdụ ikike pụrụ iche nke ịkwaga ugwu
  choice: okwukwe zuru ezu
  alternative: ntụkwasị obi zuru ezu; ikwesị ntụkwasị obi zuru ezu
  rationale: Ihe gbara okwu ahụ gburugburu na-egosi okwukwe pụrụ iche nke nwere ike ime ihe dị ịtụnanya. 'Ntụkwasị obi' ka nwere ike ịbụ ihe ọzọ, ebe 'ikwesị ntụkwasị obi' adịghị ka ihe a na-ekwu ebe a.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A hapụrụ usoro ikwubiga okwu ókè nke amaokwu ahụ na nkwubi okwu ya siri ike; e tinyebeghị nkọwa ụka ọ bụla.
