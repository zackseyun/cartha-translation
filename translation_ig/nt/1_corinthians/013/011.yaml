id: 1CO.13.11
reference: 1 Corinthians 13:11
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὅτε ἤμην νήπιος, ⸂ἐλάλουν ὡς νήπιος, ἐφρόνουν ὡς νήπιος, ἐλογιζόμην ὡς νήπιος⸃· ⸀ὅτε γέγονα ἀνήρ, κατήργηκα τὰ τοῦ νηπίου.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/011.yaml
  text: When I was a child[a], I spoke like a child, I thought like a child, I reasoned like a child. When I became a man, I put away the things of the child.
translation:
  language: ig
  text: Mgbe m ka bụ nwata, m na-ekwu okwu dị ka nwata, na-eche echiche dị ka nwata, na-atụgharị uche dị ka nwata. Mgbe m ghọrọ nwoke toro eto, ahapụla m ihe ndị nke nwata[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’ụzọ kpọmkwem, “ihe ndị nke nwata”; a pụkwara ịsụgharị ya “omume nwata” ma ọ bụ “ụzọ nwata.”
    reason: lexical_alternative
lexical_decisions:
- source_word: νήπιος
  choice: nwata
  rationale: “Nwata” bụ okwu Igbo sara mbara maka obere mmadụ, ma na-enye ohere ka echiche nke etozughị eto dịrị n’ihe atụ ahụ n’enweghị ime ka ọ bụrụ naanị nwa ọhụrụ.
- source_word: ἐλάλουν
  choice: m na-ekwu okwu
  rationale: Ụdị a na-egosi omume a na-emekarị n’oge gara aga, kwekọrọ n’imperfect Greek, ma na-edobe usoro okwu atọ ahụ.
- source_word: ἐφρόνουν
  choice: na-eche echiche
  rationale: Ọ na-egosi echiche ma ọ bụ ụzọ mmadụ si eche, n’asụsụ Igbo dị mfe ma doo anya.
- source_word: ἐλογιζόμην
  choice: na-atụgharị uche
  rationale: Nhọrọ a na-ekewapụ λογίζομαι na φρονέω site n’imesi ịtụle ihe nke ọma ike, ma na-edobe njikọ dị n’etiti okwu, echiche, na ntụgharị uche.
- source_word: γέγονα
  choice: m ghọrọ
  rationale: Ọ na-egosi mgbanwe ịbanye n’ọnọdụ ọhụrụ; n’ahịrịokwu “mgbe” a, ụdị gara aga bụ nke kasị adabara Igbo nkịtị.
- source_word: ἀνήρ
  choice: nwoke toro eto
  rationale: “Nwoke” na-edobe nwoke nke Greek kpọrọ kpọmkwem, ebe “toro eto” na-eme ka ọdịiche ya na nwata pụta ìhè.
- source_word: κατήργηκα
  choice: ahapụla m
  rationale: Perfect Igbo a na-egosi na onye ahụ ahapụla ihe ndị ahụ, ọnọdụ ahụ ka dịkwa; ọ dabara n’ihe atụ banyere ito eto karịa okwu siri ike dịka ikpochapụ.
- source_word: τὰ τοῦ νηπίου
  choice: ihe ndị e ji mara nwata
  rationale: Nkebi Greek ahụ sara mbara, pụtara n’ụzọ nkịtị “ihe ndị nke nwata.” Nsụgharị a bụ Igbo eke ma na-ahapụ ya ka ọ gụnye omume, ụzọ, ma ọ bụ ihe metụtara nwata.
theological_decisions:
- issue: Ọdịiche nwoke dị na ἀνήρ
  choice: nwoke toro eto
  alternative: onye toro eto
  rationale: Greek ji aha nwoke kpọmkwem mee ka nwata na nwoke toro eto dị iche. A hapụghị njirimara nwoke ahụ, ma a gbakwụnyere “toro eto” iji mee ka isi ihe banyere ntozu okè doo anya. Ihe atụ Pọl ji onwe ya mee abụghị nkwupụta na nwoke ka nwanyị elu.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe ma dị ugwu. Nkwughachi “dị ka nwata” na-edobe ụda na usoro okwu Greek. E tinyere akara [a] n’ebe nkebi Greek τὰ τοῦ νηπίου dị, bụ́ ebe nkọwa ala peeji metụtara kpọmkwem.
