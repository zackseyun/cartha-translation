- from: Mgbe m bụ nwata, m na-ekwu okwu dị ka nwata, na-eche echiche dị ka nwata, na-atụgharịkwa uche dị ka nwata. Mgbe m ghọrọ nwoke toro eto, ahapụla m ihe ndị e ji mara nwata[a].
  to: Mgbe m ka bụ nwata, m na-ekwu okwu dị ka nwata, na-eche echiche dị ka nwata, na-atụgharị uche dị ka nwata. Mgbe m ghọrọ nwoke toro eto, ahapụla m ihe ndị nke nwata[a].
  rationale: The revision replaces the interpretive “ihe ndị e ji mara nwata” with a close, broad rendering of τὰ τοῦ νηπίου and aligns the footnote with it. Minor stylistic adjustments improve natural Igbo cadence while retaining the Greek’s repeated structure and the completed-state force of κατήργηκα in “ahapụla m.”
