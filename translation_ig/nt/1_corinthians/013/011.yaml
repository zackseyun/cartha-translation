    text: N’ụzọ kpọmkwem, “ihe ndị nke nwata”; a pụkwara ịsụgharị ya “omume nwata” ma ọ bụ “ụzọ nwata.”
    reason: lexical_alternative
  revision_rationale: The revision replaces the interpretive “ihe ndị e ji mara nwata” with a close, broad rendering of τὰ τοῦ νηπίου and aligns the footnote with it. Minor stylistic adjustments improve natural Igbo cadence while retaining the Greek’s repeated structure and the completed-state force of κατήργηκα in “ahapụla m.”
