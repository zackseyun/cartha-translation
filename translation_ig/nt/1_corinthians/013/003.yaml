id: 1CO.13.3
reference: 1 Corinthians 13:3
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸂καὶ ἐὰν⸃ ψωμίσω πάντα τὰ ὑπάρχοντά μου, ⸄καὶ ἐὰν⸃ παραδῶ τὸ σῶμά μου, ἵνα ⸀καυθήσομαι, ἀγάπην δὲ μὴ ἔχω, οὐδὲν ὠφελοῦμαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/003.yaml
  text: And if I give away all my possessions[a], and if I hand over my body so that I may be burned, but do not have love, I gain nothing.
translation:
  language: ig
  text: Ọ bụrụkwa na m ekesaa ihe niile m nwere nye ndị ọzọ, ọ bụrụkwa na m enyefee ahụ m ka a kpọọ m ọkụ[a], ma enweghị m ịhụnanya, ọ dịghị uru ọ bụla ọ na-abara m.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ụfọdụ ihe odide ochie nwere, “ka m wee nya isi,” kama, “ka a kpọọ m ọkụ.”
    reason: textual_variant
lexical_decisions:
- source_word: ψωμίσω
  choice: m ekesa ... nye ndị ọzọ
  rationale: Okwu a pụtara ikesa ihe n’ụzọ e ji enye ndị ọzọ òkè; n’ebe a, ọ na-ekwu banyere inyefe ihe mmadụ nwere. Nsụgharị a bụ Igbo a na-aghọta nke ọma ma na-echekwa echiche nke ikesa ihe niile.
- source_word: πάντα τὰ ὑπάρχοντά μου
  choice: ihe niile m nwere
  rationale: Nkebi a na-ezo aka n’ihe onwunwe mmadụ niile. Nke a bụ okwu Igbo dị mfe ma bụrụkwa nke sara mbara dịka isi mmalite ahụ.
- source_word: παραδῶ
  choice: m enyefe
  rationale: “Enyefe” na-echekwa echiche nke itinye ahụ mmadụ n’aka ndị ọzọ, n’enweghị ịgbakwunye nkọwa dịka ịchụ onwe ya n’àjà.
- source_word: τὸ σῶμά μου
  choice: ahụ m
  rationale: Nke a bụ nsụgharị kpọmkwem na nke sitere n’okwu nkịtị ahụ.
- source_word: ἵνα
  choice: ka e wee
  rationale: Ọ na-egosi ebumnuche ma ọ bụ ihe a chọrọ ka o si na ya pụta, ma bụrụ okwu Igbo dị n’usoro.
- source_word: καυθήσομαι
  choice: kpọọ ya ọkụ
  rationale: SBLGNT nwere ụdị ngwaa passive sitere na καίω, ya bụ ịkpọ ọkụ. E tinyere nnọchiaha “ya” iji mee ka onye a na-akpọ ọkụ—ahụ m—doo anya n’Igbo.
- source_word: ἀγάπην
  choice: ịhụnanya
  rationale: “Ịhụnanya” bụ okwu Igbo zuru oke maka ἀγάπη, n’enweghị ime ka ihe ọ pụtara dị warara n’ụzọ okpukpe pụrụ iche.
- source_word: οὐδὲν ὠφελοῦμαι
  choice: ọ dịghị uru ọ bụla m na-erite
  rationale: Nke a na-echekwa echiche passive nke na ọ dịghị uru ma ọ bụ ihe ọma na-abịara onye ahụ.
- source_word: καὶ ἐὰν ... καὶ ἐὰν
  choice: Ọ bụrụkwa na ... ọ bụrụkwa na
  rationale: E chekwara nkwughachi ọnọdụ abụọ ahụ iji nọgide na-enwe usoro okwu Pọl ji arịgo n’ike.
theological_decisions:
- issue: Ọdịiche ederede n’ahịrịokwu na-egosi ebumnuche
  choice: A sụgharịrị καυθήσομαι nke SBLGNT dịka “kpọọ ya ọkụ” n’isi ederede.
  alternative: καυχήσωμαι — “ka m wee nwee ihe m ga-eji anya isi”
  rationale: 'E soro isi ederede Grik enyere. E debere ọgụgụ ọzọ n’ala peeji n’ihi na ọ na-agbanwe nkọwa nke ukwuu: ịkpọ mmadụ ọkụ megide inwe ihe e ji anya isi.'
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E chekwara nkwughachi na ịdị arọ nke ọnọdụ atụ abụọ ahụ, ma zere okwu ga-etinye nkọwa otu ụka ma ọ bụ nkwenkwe pụrụ iche.
