translation:
  language: ig
  text: Ịhụnanya anaghị akpa àgwà na-ekwesịghị ekwesị[a]; ọ naghị achọ ihe nke ya[b]; ọ naghị ewe iwe[c]; ọ naghị agụkọ ihe ọjọọ[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ọ naghị eme omume na-ekwesịghị ekwesị,” ma ọ bụ “ọ naghị akpa àgwà mkparị.”
    reason: lexical_alternative
  - marker: b
    text: N'ụzọ nkịtị, “ọ naghị achọ ihe nke onwe ya”; ya bụ, ọ naghị achọ ọdịmma onwe ya.
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “a naghị akpali ya iwe.” Okwu Grik ekwughị “ngwa ngwa.”
    reason: alternative_reading
  - marker: d
    text: Ma ọ bụ, “ọ naghị edebe ndekọ mmejọ.” N'ụzọ dị nso n'okwu Grik, “ọ naghị agụ ihe ọjọọ.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἀσχημονεῖ
  choice: adịghị akpa àgwà na-adịghị mma
  rationale: Nkebi a na-egosi omume na-ekwesịghị ekwesị, nke ihere, ma ọ bụ nke na-adịghị mma n'anya ọha; ntụgharị a sara mbara karịa naanị enweghị nsọpụrụ.
- source_word: ζητεῖ τὰ ἑαυτῆς
  choice: ọ naghị achọ naanị ihe ga-abara ya uru
  rationale: Nke a na-akọwa okwu Grik ahụ, ‘ịchọ ihe nke onwe ya,’ n'Igbo doro anya, ma ‘naanị’ na-egosi ịchọ ọdịmma onwe onye n'ọnọdụ a.
- source_word: παροξύνεται
  choice: ọ naghị ewe iwe ọkụ
  rationale: Nke a na-egosi ịkpali mmadụ ruo n'iwe ma ọ bụ mgbakasị ahụ, na-etinyeghị echiche ‘ngwa ngwa’ nke na-adịghị n'okwu Grik.
- source_word: λογίζεται
  choice: ọ naghị agụkọ
  rationale: ‘Agụkọ’ na-edobe ihe atụ nke ịgụ ma ọ bụ ide ihe n'akwụkwọ ndekọ, dịka ngwaa Grik si pụta.
- source_word: τὸ κακόν
  choice: ihe ọjọọ e mere ya
  rationale: N'ọnọdụ mmekọrịta mmadụ na ibe ya, ọ pụtara ihe ọjọọ e mere mmadụ; okwu a na-eme ka njikọ ahụ doo anya, ọ bụ ezie na Grik kwuru naanị ‘ihe ọjọọ.’
- source_word: ἀγάπη (implicit subject from context)
  choice: Ịhụnanya
  rationale: E weghachiri isiokwu sitere n'amaokwu ndị bu ụzọ ka ahịrịokwu Igbo nwee onwe ya ma doo anya.
theological_decisions:
- issue: Ma a ga-etinye echiche ‘ngwa ngwa’ n'ịsụgharị παροξύνεται
  choice: ọ naghị ewe iwe ọkụ
  alternative: iwe anaghị ewe ya ngwa ngwa
  rationale: Okwu Grik enweghị adverb pụtara ‘ngwa ngwa’ ma ọ bụ ‘n'ụzọ dị mfe’; ya mere, a hapụrụ mgbakwunye ahụ.
- issue: Ma λογίζεται τὸ κακόν bụ ịgụ ihe ọjọọ ma ọ bụ idebe ndekọ mmejọ
  choice: ọ naghị agụkọ ihe ọjọọ e mere ya
  alternative: ọ naghị edebe ndekọ mmejọ
  rationale: Nhọrọ a na-edobe ihe atụ nke ịgụkọ ihe ma na-egosi ihe gbasara mmekọrịta mmadụ; ihe ọzọ bụ nkọwa sara mbara karị.
- issue: Ma ζητεῖ τὰ ἑαυτῆς ga-anọgide n'ụdị okwu nkịtị
  choice: ọ naghị achọ naanị ihe ga-abara ya uru
  alternative: ọ naghị achọ ihe nke onwe ya
  rationale: Ụdị a bụ Igbo a na-aghọta ngwa ngwa ma na-echekwa echiche nke ịchọ ọdịmma onwe onye, n'agbanyeghị na ụdị nke ọzọ dị nso n'usoro okwu Grik.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ ahịrịokwu dị ndụ karịa ịrapara kpamkpam n'usoro okwu Grik, ebe ndetu ala na-echekwa ntụgharị ndị dị nso n'ụzọ nkịtị na ezigbo nghọtahie okwu ahụ.
