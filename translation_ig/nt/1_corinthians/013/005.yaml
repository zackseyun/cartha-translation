- from: Ịhụnanya adịghị akpa àgwà na-adịghị mma[a]; ọ naghị achọ naanị ihe ga-abara ya uru[b]; ọ naghị ewe iwe ọkụ[c]; ọ naghị agụkọ ihe ọjọọ e mere ya[d].
