id: 1CO.13.13
reference: 1 Corinthians 13:13
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: νυνὶ δὲ μένει πίστις, ἐλπίς, ἀγάπη· τὰ τρία ταῦτα, μείζων δὲ τούτων ἡ ἀγάπη.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/013.yaml
  text: 'And now these three remain: faith[a], hope, and love[c][b]. But the greatest of these is love.'
translation:
  language: ig
  text: 'Ma ugbu a[a], ihe atọ ndị a ka na-adịgide[b]: okwukwe[c], olileanya na ịhụnanya. Ma nke kachasị ukwuu n’ime ha bụ ịhụnanya.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “Ugbu a kwa”; njikọ Grik ahụ pụrụ igosi ma ịga n’ihu n’okwu ma mgbanwe dị nro n’ihe a na-ekwu.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ “na-anọgide”; ngwaa Grik ahụ pụrụ ịpụta ịnọgide, ịga n’ihu, ma ọ bụ ịtachi obi.
    reason: lexical_alternative
  - marker: c
    text: A pụkwara ịghọta “okwukwe” n’ụzọ sara mbara dịka “ntụkwasị obi,” ọ bụ ezie na “okwukwe” dabara nke ọma n’ebe a.
    reason: alternative_reading
lexical_decisions:
- source_word: νυνὶ δὲ
  choice: Ma ugbu a
  rationale: “Ugbu a” na-egosipụta ọnọdụ a na-ekwu maka ya ugbu a ma ọ bụ nkwubi okwu ahụ, ebe “ma” na-echekwa njikọ δέ nke pụrụ igosi mgbanwe dị nro ma ọ bụ ihe dị iche n’ihe bu ụzọ.
- source_word: μένει
  choice: ka na-adịgide
  rationale: Nhọrọ a na-egosi ịnọgide ma ọ bụ ịga n’ihu ịdị adị, n’ụzọ dabara na ọdịiche dị n’etiti ihe ndị na-agafe agafe na ihe atọ ndị a na-adịgide.
- source_word: πίστις
  choice: okwukwe
  rationale: N’usoro okwu atọ a—okwukwe, olileanya na ịhụnanya—“okwukwe” bụ okwu Igbo a na-ejikarị eme ihe ma na-anọchi πίστις nke ọma, n’agbanyeghị na echiche ntụkwasị obi dịkwa n’okwu Grik ahụ.
- source_word: ἐλπίς
  choice: olileanya
  rationale: “Olileanya” bụ okwu Igbo doro anya ma bụrụkwa nke a na-ejikarị asụgharị ἐλπίς n’ebe Pọl kwuru banyere atụmanya nwere ntụkwasị obi.
- source_word: ἀγάπη
  choice: ịhụnanya
  rationale: “Ịhụnanya” bụ okwu Igbo nkịtị, dị ùgwù, nke na-egosi ἀγάπη nke ọma n’enweghị ịtinye nkọwa otu ụka pụrụ iche.
- source_word: τὰ τρία ταῦτα
  choice: ihe atọ ndị a
  rationale: Nkebi a na-atụ aka kpọmkwem n’okwukwe, olileanya na ịhụnanya ndị a kpọrọ aha, ma okwu Igbo a na-eme ka ntụaka ahụ doo anya.
- source_word: μείζων ... τούτων
  choice: nke kachasị ukwuu n’ime ha
  rationale: Ọ bụ ezie na μείζων bụ ụdị ntụnyere, mgbe a na-atụnyere ihe atọ a, Igbo nkịtị na-eji ụdị kachasị elu akọwa nke karịrị ndị ọzọ niile.
theological_decisions:
- issue: Ihe πίστις pụtara n’usoro okwu atọ a
  choice: okwukwe
  alternative: ntụkwasị obi; ikwesị ntụkwasị obi
  rationale: Ọnọdụ okwu a na-akwado “okwukwe” karịa “ikwesị ntụkwasị obi.” Ihe okwu ahụ pụtara dịka ntụkwasị obi ka e debere na nkọwa ala peeji kama imechi ohere ahụ kpamkpam.
- issue: Ike ntụnyere dị na μείζων
  choice: nke kachasị ukwuu n’ime ha bụ ịhụnanya
  alternative: ịhụnanya ka ha ukwuu
  rationale: Ebe e nwere ihe atọ a na-atụnyere, ụdị a na-asụ n’Igbo na-egosi n'ụzọ doro anya na ịhụnanya kacha ha niile, ma ọ naghị agbakwunye nkọwa banyere ihe mere o ji kacha ukwuu.
translation_notes:
  register: Ejiri Standard Igbo dị ugbu a, nke dị mfe nghọta ma dịkwa ùgwù. E chekwara mkpụmkpụ na ụda nkwubi okwu nke amaokwu Grik ahụ; e zere okwu ochie na nkọwa nke otu ụka pụrụ iche.
