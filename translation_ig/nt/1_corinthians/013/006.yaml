translation:
  language: ig
  text: Ịhụnanya anaghị aṅụrị ọṅụ n’ihe na-ezighị ezi[a], kama ọ na-aṅụkọ ọṅụ n’eziokwu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’ajọ omume” ma ọ bụ “n’ikpe na-ezighị ezi.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ọ na-aṅụrị ọṅụ n’eziokwu.” Ngwaa Grik a nwere ike igosi ịṅụkọ ọṅụ, ma ọ bụ ịṅụrị ọṅụ n’ihi eziokwu.
    reason: lexical_alternative
lexical_decisions:
- source_word: χαίρει
  choice: na-aṅụrị ọṅụ
  rationale: Nkebi okwu a bụ ụzọ Igbo nkịtị ma dịkwa ùgwù si ekwu mmadụ inwe ọṅụ ma ọ bụ ime ihe obi ụtọ; ọ na-edebekwa myirịta ya na συγχαίρει.
- source_word: ἐπὶ τῇ ἀδικίᾳ
  choice: n’ihe na-ezighị ezi
  rationale: ἐπί ya na χαίρω na-egosi ihe kpatara ọṅụ ma ọ bụ ihe a na-aṅụrị ọṅụ na ya. ‘Ihe na-ezighị ezi’ na-ekpuchi ajọ omume, ikpe na-ezighị ezi, na mmebi ezi omume n’enweghị ime ka ihe ọ pụtara dị warara.
- source_word: συγχαίρει
  choice: na-esoro ... aṅụrị ọṅụ
  rationale: ‘Na-esoro ... aṅụrị ọṅụ’ na-egosipụta echiche συν- nke iso onye ma ọ bụ ihe ọzọ kerịta ọṅụ, ma ọ ka na-ada nke ọma n’Igbo.
- source_word: δὲ
  choice: kama
  rationale: ‘Kama’ na-egosi ngbanwe doro anya n’etiti ihe ịhụnanya na-adịghị eme na ihe ọ na-eme.
- source_word: τῇ ἀληθείᾳ
  choice: eziokwu
  rationale: ‘Eziokwu’ na-edobe ọdịiche echiche dị n’etiti ἀλήθεια na ἀδικία, ma ọ naghị ekpebi na ọ bụ naanị ezi okwu, ezi omume, ma ọ bụ ozi ọma ka a na-ekwu maka ya.
theological_decisions:
- issue: Otú e si sụgharịa ἀδικία n’ọdịiche ụkpụrụ omume Pọl gosiri
  choice: ihe na-ezighị ezi
  alternative: ajọ omume; ikpe na-ezighị ezi; enweghị ezi omume
  rationale: Nhọrọ a na-edobe obosara okwu Grik ahụ—mmebi ezi omume, imejọ mmadụ, na ikpe na-ezighị ezi—ma zere itinye ya naanị n’ihe gbasara iwu ma ọ bụ otu nkọwa okpukpe pụrụ iche.
- issue: Ihe mmekọrịta dị na συγχαίρει τῇ ἀληθείᾳ pụtara
  choice: na-esoro eziokwu aṅụrị ọṅụ
  alternative: na-aṅụrị ọṅụ n’eziokwu
  rationale: Isi ederede na-egosipụta συν- nke συγχαίρει, ya bụ iso kerịta ọṅụ; nkọwa ọzọ dị n’ala peeji na-edobe ohere na okwu ahụ pụtara ịṅụrị ọṅụ n’ihi eziokwu.
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, nke doro anya ma dị ùgwù. E kwughachiri ‘Ịhụnanya’ dị ka isiokwu n’ihi na amaokwu ndị bu ya ụzọ gosiri na ọ bụ ya ka nnọchiaha zoro ezo nke Grik na-ezo aka; nke a na-emekwa ka amaokwu ahụ doo anya mgbe a gụrụ ya naanị ya.
