id: 1CO.13.1
reference: 1 Corinthians 13:1
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἐὰν ταῖς γλώσσαις τῶν ἀνθρώπων λαλῶ καὶ τῶν ἀγγέλων, ἀγάπην δὲ μὴ ἔχω, γέγονα χαλκὸς ἠχῶν ἢ κύμβαλον ἀλαλάζον.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/001.yaml
  text: If I speak in the tongues of men and of angels[a], but do not have love[c][b], I have become sounding bronze or a clashing cymbal.
translation:
  language: ig
  text: Ọ bụrụ na m asụọ asụsụ ụmụ mmadụ na nke ndị mmụọ ozi[a], ma enweghị m ịhụnanya, aghọwo m ọla na-ada ụda[b] ma ọ bụ ájà na-ada ụda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ire.” Okwu Grik ahụ nwere ike ịpụta ire ma ọ bụ asụsụ; ebe a, “asụsụ” na-echekwa njikọ ya na mkparịta ụka ndị Kọrịnt banyere ikwu okwu sitere n’ike mmụọ.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, “ọla na-ada ụda” ma ọ bụ “gong na-ada ụda.” Okwu Grik ahụ na-ekwu maka ọla na-ada ụda, ọ bụghị otu ngwa egwu a kapịrị ọnụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐὰν
  choice: Ọ bụrụ na
  rationale: Ọ na-ewebata ọnọdụ a na-atụ n'uche; nke a bụ ụzọ Igbo doro anya na nke ebumpụta ụwa si kwuo ya.
- source_word: ταῖς γλώσσαις
  choice: na-asụ asụsụ dị iche iche
  rationale: γλῶσσα nwere ike ịpụta ire ma ọ bụ asụsụ. N'ọnọdụ a, okwu a na-ejikọta amaokwu ahụ na mkparịta ụka banyere ụdị okwu sitere n'ike mmụọ, ma ọ naghị ekpebi na ha bụ naanị asụsụ mmadụ a maara.
- source_word: τῶν ἀνθρώπων
  choice: nke mmadụ
  rationale: Ọ na-ezo aka n'ụmụ mmadụ n'ozuzu ha, n'ụzọ dị iche na ndị mmụọ ozi; ‘mmadụ’ na-egosipụta nke a n'Igbo n'enweghị nghọtahie gbasara okike nwoke.
- source_word: λαλῶ
  choice: m na-asụ
  rationale: N'ebe a, ‘ịsụ asụsụ’ bụ ụzọ Igbo kachasị ebumpụta ụwa isi kọwaa ikwu okwu n'asụsụ.
- source_word: καὶ τῶν ἀγγέλων
  choice: na nke ndị mmụọ ozi
  rationale: Ntụnyere ya na ụmụ mmadụ na-akwado nghọta nke ἄγγελοι dị ka ndị mmụọ ozi, ọ bụghị naanị ndị ozi mmadụ.
- source_word: ἀγάπην
  choice: ịhụnanya
  rationale: Nke a bụ okwu Igbo a na-ejikarị eme ihe maka ἀγάπη; ọ dị ugbu a, doo anya, ma ghara ibubata nkọwa otu ụka pụrụ iche.
- source_word: δὲ μὴ ἔχω
  choice: ma enweghị m
  rationale: Ọ na-echekwa ọdịiche δέ na echiche nke enweghị ịhụnanya n'ụzọ dị nkenke ma dị mma n'Igbo.
- source_word: γέγονα
  choice: aghọọla m
  rationale: 'Ụdị a na-echekwa ike perfect tense: mgbanwe emeela, ọnọdụ si na ya pụta ka dịkwa.'
- source_word: χαλκὸς ἠχῶν
  choice: ọla kọpa na-ada ụda
  rationale: χαλκός na-akpọ ihe e ji ọla kọpa ma ọ bụ bronze mee, ọ naghị akpọ otu ngwa egwu kpọmkwem. Nsụgharị a na-edebe ihe oyiyi ahụ n'ozuzu ya.
- source_word: ἢ κύμβαλον ἀλαλάζον
  choice: ma ọ bụ ájà na-eme mkpọtụ
  rationale: κύμβαλον bụ cymbal, nke a na-akpọkarị ájà n'Igbo; ἀλαλάζον na-egosi ụda dara oke ma na-akụda ntị, ya mere ‘na-eme mkpọtụ’ dabara nke ọma.
theological_decisions:
- issue: Ihe ‘asụsụ dị iche iche nke mmadụ na nke ndị mmụọ ozi’ pụtara
  choice: E debere ya dị ka ntụnyere n'etiti asụsụ ụmụ mmadụ na nke ndị mmụọ ozi, n'ekpebighị ma nke ndị mmụọ ozi ọ bụ asụsụ eluigwe n'ezie ka ọ bụ ikwubiga okwu ókè.
  alternative: Ịkọwa ya kpọmkwem dị ka asụsụ eluigwe n'ezie, ma ọ bụ naanị dị ka ikwubiga okwu ókè banyere okwu kachasị elu mmadụ pụrụ iche n'echiche.
  rationale: Ihe odide Grik n'onwe ya anaghị edozi ajụjụ a; ịhapụ ya n'ụzọ mepere emepe na-echekwa mgbagwoju anya na ike okwu Pọl.
- issue: Ntụnyere ἀνθρώπων na ἀγγέλων
  choice: ‘mmadụ’ na ‘ndị mmụọ ozi’
  alternative: ‘ndị nwoke’ na ‘ndị mmụọ ozi’
  rationale: ἀνθρώπων ebe a pụtara ụmụ mmadụ niile, ọ bụghị naanị ndị nwoke; Standard Igbo ‘mmadụ’ na-echekwa ntụnyere a n'ụzọ ziri ezi.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-echekwa usoro ọnọdụ, ọdịiche ‘ma,’ na ihe oyiyi ụda abụọ dị n'odide Grik. E tinyere akara amaokwu ụkwụ niile [a] na [b] n'isi ederede.
