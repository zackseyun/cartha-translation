revisions:
- from: Ọ bụrụ na m na-asụ asụsụ dị iche iche nke mmadụ na nke ndị mmụọ ozi[a], ma enweghị m ịhụnanya, aghọọla m ọla kọpa na-ada ụda[b] ma ọ bụ ájà na-eme mkpọtụ.
  to: Ọ bụrụ na m asụọ asụsụ ụmụ mmadụ na nke ndị mmụọ ozi[a], ma enweghị m ịhụnanya, aghọwo m ọla na-ada ụda[b] ma ọ bụ ájà na-ada ụda.
  rationale: The revision removes unsupported “dị iche iche,” clarifies that ἀνθρώπων means human beings collectively, and improves Standard Igbo idiom while retaining the conditional rhetoric, the ambiguity of human and angelic tongues, and the two sound images. No doctrinal conclusion is imposed about the nature of angelic tongues.
