    reason: lexical_alternative
  revision_rationale: The revision removes unsupported “dị iche iche,” clarifies that ἀνθρώπων means human beings collectively, and improves Standard Igbo idiom while retaining the conditional rhetoric, the ambiguity of human and angelic tongues, and the two sound images. No doctrinal conclusion is imposed about the nature of angelic tongues.
