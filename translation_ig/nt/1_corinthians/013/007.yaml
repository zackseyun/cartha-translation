id: 1CO.13.7
reference: 1 Corinthians 13:7
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: πάντα στέγει, πάντα πιστεύει, πάντα ἐλπίζει, πάντα ὑπομένει.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/007.yaml
  text: It bears all things[a], believes all things, hopes all things[b], endures all things.
translation:
  language: ig
  text: Ọ na-anagide ihe niile[a], na-ekwere ihe niile[b], na-atụ anya ihe niile, na-atachi obi n'ihe niile.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Ọ na-ekpuchi ihe niile.” Okwu Grik ahụ nwere ike ịpụta ikpuchi ma ọ bụ ichebe, nakwa ịnagide.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ọ na-atụkwasị obi n'ihe niile.” Ihe a apụtaghị na ịhụnanya na-ekwere ihe ọ bụla n'enweghị uche, kama na ọ na-achọkarị ịtụkwasị obi.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα
  choice: ihe niile
  rationale: Nkebiokwu a pụtara ihe niile n'ụzọ sara mbara; ikwughachi ya ugboro anọ na-echekwa usoro na ike okwu Pọl.
- source_word: στέγει
  choice: na-anagide
  rationale: Okwu Grik a nwere ike ịpụta ikpuchi ma ọ bụ ịnagide. N'usoro a nke na-akọwa otú ịhụnanya si eguzosi ike, “na-anagide” bụ okwu Igbo doro anya, ebe a na-echekwa echiche nke “ikpuchi” n'okpuru peeji.
- source_word: πιστεύει
  choice: na-ekwere
  rationale: Nke a na-egosipụta ihe πιστεύω pụtara n'ụzọ kwụ ọtọ ma na-echekwa nkenke na nhazi ahịrịokwu ahụ. O nwekwara ike ịpụta ịtụkwasị obi, nke e debere n'okpuru peeji ka a ghara ịkọwa ịhụnanya dị ka nzuzu na-ekwere ihe ọ bụla.
- source_word: ἐλπίζει
  choice: na-atụ anya
  rationale: Nke a bụ ụzọ Igbo nkịtị si ekwu inwe olileanya ma ọ bụ ịnọgide na-ele anya n'olileanya; ọ dabara n'omume ịhụnanya na-eme mgbe niile.
- source_word: ὑπομένει
  choice: na-atachi obi n'ihe niile
  rationale: Okwu a na-egosi ịnọgide guzosie ike n'okpuru nsogbu. “Na-atachi obi” bụ okwu Igbo dị mkpirikpi, nke mmadụ niile na-aghọta, ma dabara n'ọnọdụ ikpeazụ siri ike n'usoro ahụ.
theological_decisions:
- issue: Ihe okwu πάντα e kwughachiri ugboro anọ na-ekwu banyere ịhụnanya
  choice: E chekwara “ihe niile” ugboro anọ dị ka okwu sara mbara nke na-akọwa iguzosi ike nke ịhụnanya.
  alternative: Ịghọta ya dị ka iwu zuru oke na ịhụnanya ga-anabata ma ọ bụ kwere ihe ọ bụla n'enweghị ịtụgharị uche.
  rationale: Ọnọdụ a bụ nkọwa uri banyere agwa ịhụnanya. Nsụgharị ahụ na-echekwa ịdị sara mbara na esemokwu dị n'okwu Pọl, ma ọ naghị etinye echiche na ịhụnanya adịghị ama ikpebi ezi ihe ma ọ bụ na ọ na-ekwere aghụghọ niile.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji usoro “na-” na nkwughachi “ihe niile” chekwaa ahịrịokwu anọ yiri ibe ha. E tinyere akara [a] na [b] kpọmkwem n'isiokwu, dịka ihe ndị e dere n'okpuru peeji si chọọ.
