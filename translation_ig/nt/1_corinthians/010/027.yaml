  source_fidelity: 'Ederede Igbo na-esochi SBLGNT nke ọma: ‘otu onye n’ime ndị na-ekweghị ekwe’ na-anọchi τις τῶν ἀπίστων; ‘kpọọ unu òkù’ dabara n’ọnọdụ oriri; ‘unu achọọkwa ịga’ na-edobe ọnọdụ na ọchịchọ dị na θέλετε πορεύεσθαι; ‘ihe ọ bụla e debere n’ihu unu’ na-enye πᾶν τὸ παρατιθέμενον ὑμῖν n’enweghị mmachi ọzọ. ‘Unu ajụkwala ajụjụ ọ bụla n’ihi akọnuche’ na-egosipụta μηδὲν ἀνακρίνοντες διὰ τὴν συνείδησιν nke ọma, ma hapụ onye akọnuche ahụ na-ezo aka na ya n’enweghị nkọwa mgbakwunye, dịka Grik si hapụ ya n’amaokwu a.'
  naturalness: Asụsụ ahụ bụ Standard Igbo dị mfe, dị ọcha, ma kwesị ekwesị n’usoro Akwụkwọ Nsọ nke oge a. Usoro iwu ọtụtụ ‘rienụ’ na ‘unu ajụkwala’ kwekọrọ na ‘unu’ ma na-agụ nke ọma. ‘E debere n’ihu unu’ bụ ụzọ e si ekwu okwu n’Igbo nke na-egosi nri e nyere n’ihu ndị ọbịa.
  terminology: ‘Ndị na-ekweghị ekwe’ na ‘akọnuche’ bụ okwu doro anya ma dabara na ndekọ dị ùgwù. ‘Akọnuche’ adịghị etinye n’ederede onye akọnuche ahụ bụ, ya mere ọ naghị edozi nghọta a ka na-adị mkparịta ụka n’amaokwu na-esote. Ihe odide ala abụọ ahụ nwere akara ziri ezi n’ebe okwu ha na-akọwa dị; nke mbụ na-enye nhọrọ ziri ezi maka ἀνακρίνω, nke abụọ na-ezo amaokwu na-esote n’enweghị ịtinye ozizi ọzọ.
