  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸀εἴ τις καλεῖ ὑμᾶς τῶν ἀπίστων καὶ θέλετε πορεύεσθαι, πᾶν τὸ παρατιθέμενον ὑμῖν ἐσθίετε μηδὲν ἀνακρίνοντες διὰ τὴν συνείδησιν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/027.yaml
  text: If one of the unbelievers invites you and you want to go[a], eat whatever is set before you[b], asking no questions for the sake of conscience.
translation:
  language: ig
  text: Ọ bụrụ na otu onye n’ime ndị na-ekweghị ekwe akpọọ unu òkù, unu achọọkwa ịga, rienụ ihe ọ bụla e debere n’ihu unu, unu ajụkwala ajụjụ ọ bụla[a] n’ihi akọnuche.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “unu enyochala ihe ọ bụla” ma ọ bụ “unu emela nchọpụta.” Ihe ọ pụtara bụ ka ha ghara ịchọpụta ebe nri ahụ si bịa.
    reason: lexical_alternative
  - marker: b
    text: Amaokwu na-esote na-eme ka okwu ahụ bụ “akọnuche” dokwuo anya, ebe Pọl mere ka akọnuche onye nke ọzọ dị iche na nke mmadụ onwe ya.
    reason: cross_reference
lexical_decisions:
- source_word: ἀπίστων
  choice: ndị na-ekweghị ekwe
  rationale: Nke a na-akọwa ndị mmadụ e ji enweghị okwukwe mara n’ọnọdụ a, ya bụ, ndị na-abụghị ndị kwere ekwe, n’etinyeghị okwu mkparị.
- source_word: καλεῖ
  choice: akpọọ unu òkù
  rationale: N’ọnọdụ iri nri a, okwu Grik a pụtara ịkpọ mmadụ òkù, ọ bụghị nanị ịkpọ ya oku.
- source_word: θέλετε πορεύεσθαι
  choice: unu achọọkwa ịga
  rationale: Nke a na-egosi ọchịchọ ma ọ bụ nkwenye ha ịnabata ọkpụkpọ òkù ahụ, ma na-edobekwa ọnọdụ nke ahịrịokwu ahụ.
- source_word: πᾶν τὸ παρατιθέμενον ὑμῖν
  choice: ihe ọ bụla e debere n’ihu unu
  rationale: Okwu a na-ezo aka n’ihe oriri niile a na-enye ha n’oge nri; nsụgharị a bụ nke doro anya ma bụrụkwa Igbo e ji eme ihe ugbu a.
- source_word: ἐσθίετε
  choice: rienụ
  rationale: Ọ bụ iwu a na-enye n’ozuzu ya; ụdị iwu Igbo a na-ebunye ya n'ụzọ dị mkpirikpi ma doo anya.
- source_word: μηδὲν ἀνακρίνοντες
  choice: unu ajụkwala ajụjụ ọ bụla
  rationale: N’ebe a, ἀνακρίνω pụtara ịjụ ajụjụ ma ọ bụ ime nchọpụta banyere ebe nri ahụ si bịa; nsụgharị ahụ na-egosipụta isi ihe e nyere n’iwu ahụ.
- source_word: διὰ τὴν συνείδησιν
  choice: n’ihi akọnuche
  rationale: διά tinyere accusative na-egosi ihe kpatara ya ma ọ bụ ihe a na-elebara anya. A hapụrụ ‘akọnuche’ n’enweghị ịkọwa onye nwe ya ka edowe ndọrọndọrọ dị n’okwu Grik.
theological_decisions:
- issue: Onye akọnuche dị na διὰ τὴν συνείδησιν na-ezo aka na ya
  choice: E kwuru naanị ‘akọnuche’ n’amaokwu a, n’akọwaghị ma ọ bụ nke onye kwere ekwe ka ọ bụ nke onye ọzọ.
  alternative: Ịsụgharị ya dị ka ‘n’ihi akọnuche nke gị’ ma ọ bụ ‘n’ihi akọnuche onye ọzọ.’
  rationale: Okwu Grik nke amaokwu a akọwaghị onye nwe akọnuche ahụ kpọmkwem; amaokwu na-esote na-enye nkọwa ọzọ. Ya mere, nsụgharị ahụ anaghị edozi ihe e kpachaara anya hapụ ka ọ ghara ido anya.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta, dee ya. E ji nnọchiaha ọtụtụ ‘unu’ mee ihe dịka ederede Grik si dị. E debere okwu ‘akọnuche’ n’ụdị sara mbara ka a ghara ịgbakwunye nkọwa okpukpe nke amaokwu ahụ n’onwe ya na-enyeghị.
