id: 1CO.10.16
reference: 1 Corinthians 10:16
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τὸ ποτήριον τῆς εὐλογίας ὃ εὐλογοῦμεν, οὐχὶ κοινωνία ⸂ἐστὶν τοῦ αἵματος τοῦ Χριστοῦ⸃; τὸν ἄρτον ὃν κλῶμεν, οὐχὶ κοινωνία τοῦ σώματος τοῦ Χριστοῦ ἐστιν;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/016.yaml
  text: The cup of blessing that we bless—is it not a sharing in the blood of Messiah? The bread that we break—is it not a sharing in the body of Messiah?[a][b]
translation:
  language: ig
  text: Iko ngọzi ahụ nke anyị na-agọzi, ọ́ bụghị inwe òkè n’ọbara Mesaịa? Achịcha ahụ nke anyị na-anyawa, ọ́ bụghị inwe òkè n’ahụ Mesaịa?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “isonye na” ma ọ bụ “ịkekọrịta na”; n’ọdịnala, “mmekọrịta na.”
    reason: lexical_alternative
  - marker: b
    text: Okwu Grik ahụ bụ Χριστοῦ (Christou); a sụgharịrị ya “Mesaịa” ebe a n’ihi na Χριστός na-arụ ọrụ dị ka utu aha. N’ọdịnala, “Kraịst.”
    reason: alternative_reading
lexical_decisions:
- source_word: τὸ ποτήριον
  choice: iko ahụ
  rationale: “Iko” bụ okwu Igbo doro anya maka arịa a na-aṅụ ihe ọṅụṅụ; ọ naghị ebubata okwu pụrụ iche nke omenala ụka e mechara guzobe.
- source_word: τῆς εὐλογίας
  choice: ngọzi
  rationale: Nsụgharị a na-echekwa okwu εὐλογία dị ka “ngọzi,” kama ime ka ọ bụrụ naanị ekele, ma na-ahapụkwa njikọ ya na ngọzi a na-ekwu n’oge nri.
- source_word: ὃ εὐλογοῦμεν
  choice: nke anyị na-agọzi
  rationale: Nke a na-echekwa nkwughachi dị n’etiti εὐλογία na εὐλογοῦμεν—“ngọzi” na “na-agọzi”—n’enweghị ịkọwa ya naanị dị ka inye ekele.
- source_word: οὐχὶ
  choice: ọ́ bụghị
  rationale: Ụdị ajụjụ a na-atụ anya azịza nkwenye; “ọ́ bụghị” na-echekwa ma ọdịdị ajụjụ ahụ ma ike ya.
- source_word: κοινωνία
  choice: iketa oke na
  rationale: “Iketa oke na” na-egosi isonye ma ọ bụ inwe òkè n’ezie, ọ bụghị naanị mmekọrịta mmadụ na ibe ya; ọ naghịkwa ekpebi esemokwu ụka gbasara ụzọ e si anọnyere ọbara na ahụ Mesaịa.
- source_word: τοῦ αἵματος
  choice: ọbara
  rationale: Nsụgharị kpọmkwem a na-echekwa ịdị arọ nke okwu ahụ n’ihe gbasara ọgbụgba ndụ na àjà.
- source_word: τοῦ Χριστοῦ
  choice: Mesaịa
  rationale: Χριστός na-arụ ọrụ dị ka utu aha ebe a; “Mesaịa” na-egosipụta echiche nke Onye E Tere Mmanụ, ebe “Kraịst” dị na nkọwa ala peeji dị ka nsụgharị ọdịnala.
- source_word: τὸν ἄρτον
  choice: achịcha ahụ
  rationale: “Achịcha” bụ okwu Igbo nkịtị ma kpọmkwem; amaokwu a n’onwe ya anaghị achọ ka a kọwaa ya kpọmkwem dị ka otu ogbe achịcha.
- source_word: ὃν κλῶμεν
  choice: anyị na-anyawa
  rationale: Nke a na-egosipụta omume a na-eme achịcha ahụ n’ụzọ dị mfe ma kwekọọ n’asụsụ Igbo.
- source_word: τοῦ σώματος
  choice: ahụ
  rationale: Nsụgharị kpọmkwem a na-echekwa mkpa okwu ahụ gbasara Mesaịa na nri Onyenwe anyị n’enweghị ịbelata ya n’otu nkọwa ozizi.
theological_decisions:
- issue: Nsụgharị κοινωνία n’ọnọdụ nri Onyenwe anyị
  choice: iketa oke na
  alternative: ịkekọrịta na; mmekọrịta na
  rationale: “Iketa oke na” na-echekwa echiche nke isonye n’ezie, ma ọ naghị akọwa kpọmkwem otú mmadụ si eketa oke n’ọbara na ahụ Mesaịa. N’ihi ya, ọ naghị eme ka okwu ahụ bụrụ naanị ihe nnọchianya, ọ naghịkwa amanye otu ozizi ụka banyere ọnụnọ Mesaịa.
- issue: Nsụgharị Χριστός
  choice: Mesaịa
  alternative: Kraịst
  rationale: N’ebe a, Χριστός ka nwere ọrụ doro anya dị ka utu aha nke Onye E Tere Mmanụ. E debere “Kraịst” n’ala peeji n’ihi na ọ bụ nsụgharị ọdịnala a maara nke ọma.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E chekwara nkwughachi “ngọzi … na-agọzi,” ajụjụ abụọ yiri ibe ha, na esemokwu nkà mmụta okpukpe dị na κοινωνία. Akara ụda dị na “ọ́ bụghị” na-enyere onye na-agụ ya aka ịghọta ya ozugbo dị ka ajụjụ.
