- from: Ma Chineke enweghị mmasị n’ihe ka ọtụtụ n’ime ha, n’ihi na a kwaturu ha n’ọzara[a].
  to: Ma Chineke enweghị obi ụtọ n’ebe ọtụtụ n’ime ha nọ, n’ihi na a kwaturu ha n’ọzara[a].
  rationale: The revision replaces only the nonidiomatic expression of divine displeasure. It preserves the Greek contrast (ἀλλ’), the sense of “most” (τοῖς πλείοσιν), the explanatory connector (γάρ), and the judgment-context sense of κατεστρώθησαν, while retaining the existing lexical-alternative footnote and its anchor.
