  text: ἀλλ’ οὐκ ἐν τοῖς πλείοσιν αὐτῶν ηὐδόκησεν ὁ θεός, κατεστρώθησαν γὰρ ἐν τῇ ἐρήμῳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/005.yaml
  text: Nevertheless[a], God was not pleased with most of them, for they were struck down in the wilderness.
translation:
  language: ig
  text: Ma Chineke enweghị obi ụtọ n’ebe ọtụtụ n’ime ha nọ, n’ihi na a kwaturu ha n’ọzara[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “a tọgbọrọ ha n’ala” ma ọ bụ “ha dara n’ala” n’ọzara.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: Ma
  rationale: Ọ na-egosi nnukwu ọdịiche dị n’etiti ihe ọma ndị Izrel niile natara na ikpe dakwasịrị ọtụtụ n’ime ha; “Ma” bụ ụzọ dị mfe ma dị ike e si egosi nke a n’Igbo.
- source_word: οὐκ ἐν τοῖς πλείοσιν αὐτῶν ηὐδόκησεν ὁ θεός
  choice: Chineke enweghị mmasị n’ihe ka ọtụtụ n’ime ha
  rationale: Nke a na-egosipụta na Chineke enweghị obi ụtọ ma ọ bụ mmasị n’ebe ihe ka ọtụtụ n’ime ha nọ, ma na-edobe echiche ọnụọgụ dị na τοῖς πλείοσιν.
- source_word: γὰρ
  choice: n’ihi na
  rationale: Ọ na-ewebata ihe na-akọwa otú e si mara na Chineke enweghị mmasị n’ebe ha nọ.
- source_word: κατεστρώθησαν
  choice: a kwaturu ha
  rationale: Okwu Grik a na-enye onyinyo nke ndị dara n’ala ma tọgbọ n’ọzara. “A kwaturu ha” na-egosi ọdachi na ikpe ahụ n'ụzọ doro anya, ma ọ naghị etinye onye mere ya n’ahịrịokwu ebe Grik ekwughị ya kpọmkwem.
- source_word: ἐν τῇ ἐρήμῳ
  choice: n’ọzara
  rationale: “Ọzara” bụ okwu Igbo kwesịrị ekwesị maka ebe ụmụ Izrel gagharịrị, ma na-edobe njikọ akụkọ Ọpụpụ ahụ.
theological_decisions:
- issue: Ụdị ikpe κατεστρώθησαν na-akọwa
  choice: A kwaturu ihe ka ọtụtụ n’ime ụmụ Izrel n’ọzara dịka ihe si n’ikpe Chineke pụta.
  alternative: A tọgbọrọ ha n’ala ma ọ bụ ha dara n’ọzara, n’etinyeghị echiche ikpe ahụ n’ihu nke ukwuu.
  rationale: Ihe gbara amaokwu ahụ gburugburu bụ ịdọ ndị Kọrịnt aka ná ntị site n’ihe mere Izrel. “A kwaturu ha” na-edobe ike nke ịdọ aka ná ntị ahụ, ma ọ naghị agbakwụnye nkọwa banyere otú ha si nwụọ.
translation_notes:
  register: E ji Igbo Izugbe dị ugbu a, dị mfe ma dị ùgwù. Ahịrịokwu ahụ na-edobe ọdịiche siri ike nke ἀλλ’, ihe ọnụọgụ nke “ihe ka ọtụtụ,” na obosara ihe okwu κατεστρώθησαν nwere ike ịpụta.
