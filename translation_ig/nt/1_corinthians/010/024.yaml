  verdict: revise
  source_fidelity: The supplied sense “ọdịmma” is defensible in the immediate context and is balanced by a footnote preserving the Greek ellipsis. However, “naanị” (“only”) has no counterpart in μηδεὶς τὸ ἑαυτοῦ ζητείτω and adds a limiting qualification to the prohibition.
  naturalness: The revised wording is natural, clear Standard Igbo, with an appropriately dignified biblical register. “Ka mmadụ ghara …” idiomatically conveys the general prohibition, ‘let no one …’.
  terminology: “Ọdịmma” suitably renders the contextual sense of the implied object without imposing a theological interpretation. “Onye ọzọ” accurately conveys ἑτέρου here.
  issues:
