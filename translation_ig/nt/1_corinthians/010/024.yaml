id: 1CO.10.24
reference: 1 Corinthians 10:24
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: μηδεὶς τὸ ἑαυτοῦ ζητείτω ἀλλὰ τὸ τοῦ ⸀ἑτέρου.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/024.yaml
  text: Let no one seek his own good[a], but that of the other person.
translation:
  language: ig
  text: Ka mmadụ ghara ịchọ ọdịmma nke ya,[a] kama ka ọ chọọ ọdịmma nke onye ọzọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ, n''ụzọ kwekọrọ nnọọ n''okwu mbụ: “Ka mmadụ ghara ịchọ ihe nke ya, kama ihe nke onye ọzọ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: μηδεὶς
  choice: onye ọ bụla ghara
  rationale: Ya na ngwaa iwu ζητείτω, nke a na-egosipụta iwu izugbe na-adịghị ekwe ka onye ọ bụla mee ihe ahụ; usoro a bụ Igbo doro anya ma kwekọọ n'ike iwu Grik.
- source_word: ζητείτω
  choice: ka ọ chọọ
  rationale: “Ịchọ” na-echekwa ịdị mfe na obosara nke ζητέω, nke nwere ike ịpụta ịchọ ma ọ bụ ịgbalị inweta ihe.
- source_word: τὸ ἑαυτοῦ
  choice: naanị ọdịmma nke ya
  rationale: Nkebi Grik a hapụrụ ihe a na-achọghị kpọmkwem, n'ụzọ nkịtị ‘ihe nke ya.’ N'ọnọdụ a, ‘ọdịmma nke ya’ na-egosipụta uru ma ọ bụ ihe ọma mmadụ na-achọ maka onwe ya; ‘naanị’ na-eme ka ọdịiche ahụ daa nke ọma n'Igbo, ọ bụghịkwa ịsị na mmadụ agaghị echebara ọdịmma nke ya echiche n'ọnọdụ ọ bụla.
- source_word: ἀλλὰ
  choice: kama
  rationale: “Kama” na-egosipụta ntụgharị doro anya site n'ịchọ ọdịmma onwe onye gaa n'ịchọ nke onye ọzọ.
- source_word: τὸ τοῦ ἑτέρου
  choice: ọdịmma nke onye ọzọ
  rationale: ἕτερος bụ ‘onye ọzọ’ n'ebe a, dị iche na mmadụ n'onwe ya. Ikwughachi ‘ọdịmma’ na-eme ka okwu e zoro ezo na Grik doo anya n'Igbo.
theological_decisions:
- issue: Ijuputa ihe e hapụrụ n'okwu τὸ ἑαυτοῦ / τὸ τοῦ ἑτέρου
  choice: “ọdịmma nke ya ... ọdịmma nke onye ọzọ”
  alternative: “ihe nke ya ... ihe nke onye ọzọ”
  rationale: Ọ bụ ezie na Grik ekwughị kpọmkwem ihe a na-achọ, ọnọdụ 1 Ndị Kọrịnt 10:23–33 na-ekwu maka ime ihe ga-abara onye ọzọ uru karịa ịchọ uru onwe onye. “Ọdịmma” na-enye echiche ahụ n'Igbo nkịtị, ebe nkọwa ala peeji na-echekwa ụdị okwu Grik nke sara mbara.
translation_notes:
  register: Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E ji “ọdịmma” kọwaa ihe a hapụrụ n'okwu Grik, ma tinyekwa nkọwa ala peeji iji chekwaa ọdịdị na obosara nke okwu mbụ.
