id: 1CO.10.13
reference: 1 Corinthians 10:13
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: πειρασμὸς ὑμᾶς οὐκ εἴληφεν εἰ μὴ ἀνθρώπινος· πιστὸς δὲ ὁ θεός, ὃς οὐκ ἐάσει ὑμᾶς πειρασθῆναι ὑπὲρ ὃ δύνασθε, ἀλλὰ ποιήσει σὺν τῷ πειρασμῷ καὶ τὴν ἔκβασιν τοῦ ⸀δύνασθαι ὑπενεγκεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/013.yaml
  text: No temptation has overtaken you except what is common to man[a]. But God is faithful, who will not allow you to be tempted beyond what you are able, but with the temptation will also provide the way out[c][b], so that you may be able to endure it.
translation:
  language: ig
  text: Ọ dịghị ọnwụnwa ọbụla bịakwasịrị unu ma e wezụga nke a na-ahụkarị n’etiti ụmụ mmadụ[a][c]. Ma Chineke bụ onye kwesịrị ntụkwasị obi; ọ gaghị ekwe ka a nwaa unu karịa ike unu. Kama, ya na ọnwụnwa ahụ, ọ ga-emekwa ụzọ mgbapụ[b], ka unu nwee ike idi ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ma e wezụga nke bụ nke mmadụ,” ya bụ, nke a na-ahụkarị n’etiti ụmụ mmadụ.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ụzọ ọpụpụ” ma ọ bụ “nsonaazụ.” Okwu a na-egosi ndokwa Chineke nke na-enyere ndị ahụ a na-anwa aka idi ọnwụnwa ahụ.
    reason: lexical_alternative
  - marker: c
    text: Okwu ndị a sụgharịrị “ọnwụnwa” na “a nwaa” nwekwara ike ịpụta “nnwale” na “a nwalee” n’amaokwu a.
    reason: lexical_alternative
lexical_decisions:
- source_word: πειρασμός / πειρασθῆναι
  choice: ọnwụnwa / nwaa
  rationale: N’ọnọdụ a, okwu ndị a metụtara ọnwụnwa nke nwere ike iduga ná mmehie, karịsịa n’ihi ịdọ aka ná ntị banyere ọchịchọ ọjọọ na ikpere arụsị n’amaokwu ndị bu ụzọ. Ma ha nwekwara ike ịpụta nnwale; e debere nke ahụ n’ala peeji.
- source_word: εἴληφεν
  choice: bịakwasịrị
  rationale: Nke a na-egosi ahụmahụ bịakwasịrị mmadụ ma jide ya; ‘bịakwasịrị’ bụ Igbo dị mfe ma kwekọọ n’echiche ahụ.
- source_word: εἰ μὴ ἀνθρώπινος
  choice: abụghị nke karịrị ihe ụmụ mmadụ na-ahụ
  rationale: ἀνθρώπινος pụtara ihe bụ nke mmadụ ma ọ bụ ihe a na-ahụkarị n’etiti mmadụ. Nsụgharị a na-eme ka echiche ahụ doo anya n’Igbo n’enweghị ikwu na ọnwụnwa ahụ adịghị arọ.
- source_word: πιστός
  choice: kwesịrị ntụkwasị obi
  rationale: Nke a na-ekwupụta na Chineke bụ onye a pụrụ ịtụkwasị obi, onye na-emezu ihe o kwuru.
- source_word: οὐκ ἐάσει
  choice: ọ gaghị ekwe
  rationale: Ọ bụ ụzọ Igbo dị ndụ na nke doro anya isi kwuo na Chineke agaghị enye ohere ka ihe ahụ gafee ókè e kwuru.
- source_word: ὑπὲρ ὃ δύνασθε
  choice: karịa ike unu
  rationale: Nke a na-edobe ókè nke ikike ndị a na-agwa okwu, ma na-ada nke ọma n’Igbo.
- source_word: ποιήσει ... τὴν ἔκβασιν
  choice: ọ ga-emekwa ụzọ mgbapụ
  rationale: ποιέω na ἔκβασις jikọtara ọnụ na-egosi na Chineke na-eme ka ụzọ isi pụta ma ọ bụ gafere ọnwụnwa ahụ dị. ‘Ụzọ mgbapụ’ na-edobe ihe oyiyi nke ụzọ ọpụpụ.
- source_word: σὺν τῷ πειρασμῷ
  choice: mgbe ọnwụnwa ahụ bịara
  rationale: E jiri nke a gosi na ndokwa Chineke na-esoro ọnwụnwa ahụ; ọ bụghị nkwa na ọnwụnwa agaghị abịa.
- source_word: τοῦ δύνασθαι ὑπενεγκεῖν
  choice: ka unu nwee ike idi ya
  rationale: 'Nkebi a na-egosi nzube ma ọ bụ nsonaazụ: ụzọ Chineke mere na-enyere ndị kwere ekwe aka ịnọgide n’okpuru nrụgide ahụ ma ghara ịda.'
theological_decisions:
- issue: Ma πειρασμός ọ pụtara ọnwụnwa ime mmehie ka ọ bụ nnwale
  choice: E ji ‘ọnwụnwa’ na ‘nwaa’ mee ihe n’ahịrị bụ isi.
  alternative: ‘Nnwale’ na ‘ịnwale.’
  rationale: Ọnọdụ okwu ahụ na-elekwasị anya n’ihe ize ndụ nke mmehie, ma okwu Grik ahụ ka nwere ike ịgụnye nnwale ma ọ bụ ihe isi ike. Ihe e dere n’ala peeji na-echekwa obosara ahụ n’ebughị ụzọ dozie esemokwu ahụ.
- issue: Ụdị ụzọ Chineke na-eme n’ime ọnwụnwa
  choice: ‘Ụzọ mgbapụ’ nke na-eme ka ndị a na-agwa okwu nwee ike idi ọnwụnwa ahụ.
  alternative: ‘Ụzọ ọpụpụ’ ma ọ bụ ‘nsonaazụ.’
  rationale: ἔκβασις nwere ike izo aka n’ụzọ ọpụpụ ma ọ bụ nsonaazụ. Nkebi ikpeazụ na-egosi na ndokwa Chineke nwere ike ịbụ ụzọ isi gafere ọnwụnwa ahụ site n’idi ya, ọ bụghị naanị iwepụ ya ozugbo.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta mee ihe. A họọrọ ‘kwesịrị ntụkwasị obi’ maka πιστός, ‘karịa ike unu’ maka ókè nke δύνασθε, na ‘idi ya’ iji gosipụta ntachi obi a na-ekwu na ὑποφέρω. Ihe nrịbama ala peeji [a], [b], na [c] niile dị n’ahịrị bụ isi.
