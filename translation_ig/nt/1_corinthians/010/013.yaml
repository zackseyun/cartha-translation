revisions:
- from: Ọnwụnwa ọ bụla bịakwasịrị unu abụghị nke karịrị ihe ụmụ mmadụ na-ahụ[a]. Ma Chineke kwesịrị ntụkwasị obi; ọ gaghị ekwe ka a nwaa unu karịa ike unu. Kama, mgbe ọnwụnwa ahụ bịara, ọ ga-emekwa ụzọ mgbapụ[b], ka unu nwee ike idi ya[c].
  to: Ọ dịghị ọnwụnwa ọbụla bịakwasịrị unu ma e wezụga nke a na-ahụkarị n’etiti ụmụ mmadụ[a][c]. Ma Chineke bụ onye kwesịrị ntụkwasị obi; ọ gaghị ekwe ka a nwaa unu karịa ike unu. Kama, ya na ọnwụnwa ahụ, ọ ga-emekwa ụzọ mgbapụ[b], ka unu nwee ike idi ya.
  rationale: The revision restores the accompaniment expressed by σὺν τῷ πειρασμῷ (“ya na ọnwụnwa ahụ”), makes the human/common character of ἀνθρώπινος explicit without implying that the experience is trivial, and relocates the lexical footnote to the term it explains. It preserves the source's distinction between God's limiting permission and the temptation itself, without adding doctrinal explanation.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T18:12:22Z'
review_pass:
  verdict: revise
  source_fidelity: 'The draft conveys the central promise well, including God''s faithfulness, the limit on temptation, and endurance. However, “mgbe ọnwụnwa ahụ bịara” means “when the temptation comes” and does not faithfully represent σύν (“with/together with”): God''s provision accompanies the temptation. The opening can also represent εἰ μὴ ἀνθρώπινος more directly as what is common among human beings.'
  naturalness: The revised wording is clear, idiomatic Standard Igbo, and maintains a dignified biblical register. “Ọ dịghị ọnwụnwa ọbụla…” is a natural way to express the Greek negated perfect, and “ya na ọnwụnwa ahụ” clearly expresses accompaniment.
  terminology: “Ọnwụnwa” / “a nwaa” appropriately reflects the moral-temptation sense in context, while the footnote preserves “nnwale.” “Onye kwesịrị ntụkwasị obi” is suitable for πιστός. “Ụzọ mgbapụ” is retained, with “ụzọ ọpụpụ” and “nsonaazụ” noted as alternatives for ἔκβασις.
  issues:
  - severity: medium
    issue: The phrase “mgbe ọnwụnwa ahụ bịara” replaces “σὺν τῷ πειρασμῷ.”
    rationale: The Greek says that God makes the escape together with/accompanying the temptation, not merely at the time when temptation arrives. The temporal rendering weakens this relation.
  - severity: low
    issue: The opening expression “abụghị nke karịrị ihe ụmụ mmadụ na-ahụ” is less direct and somewhat ambiguous.
    rationale: It can suggest that the temptation is not beyond the kinds of things humans experience, but it does not naturally state the source's “except what is human/common to human beings.”
  - severity: low
    issue: Footnote [c] is anchored after “idi ya,” though it concerns the earlier terms “ọnwụnwa” and “a nwaa.”
    rationale: Moving the anchor to the first occurrence of “Ọnwụnwa” gives readers a clear and accurate lexical reference.
  revised_text: Ọ dịghị ọnwụnwa ọbụla bịakwasịrị unu ma e wezụga nke a na-ahụkarị n’etiti ụmụ mmadụ[a][c]. Ma Chineke bụ onye kwesịrị ntụkwasị obi; ọ gaghị ekwe ka a nwaa unu karịa ike unu. Kama, ya na ọnwụnwa ahụ, ọ ga-emekwa ụzọ mgbapụ[b], ka unu nwee ike idi ya.
