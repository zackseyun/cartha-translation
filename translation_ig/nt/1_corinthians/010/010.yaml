source:
  edition: SBLGNT
  text: μηδὲ γογγύζετε, ⸀καθάπερ τινὲς αὐτῶν ἐγόγγυσαν, καὶ ἀπώλοντο ὑπὸ τοῦ ὀλοθρευτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/010.yaml
  text: And do not grumble[a], just as some of them grumbled and were destroyed by the destroyer.
translation:
  language: ig
  text: Unu atala ntamu, dị ka ụfọdụ n’ime ha turu ntamu ma onye mbibi[a] bibie ha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “mmụọ ozi na-ebibi ihe.” Okwu Grik bụ “onye mbibi,” nke nwere ike na-ezo aka n’onye rụrụ ọrụ mbibi n’oge ikpe ndị dakwasịrị Izrel n’ọzara.
    reason: alternative_reading
lexical_decisions:
- source_word: μηδὲ
  choice: Unu atamụ
  rationale: N’usoro ịdọ aka ná ntị dị n’amaokwu ndị bu ụzọ, μηδέ na-agbakwụnye iwu a na nke ndị gara aga. Ụdị a bụ Igbo eke ma na-egosi iwu a machibidoro.
- source_word: γογγύζετε
  choice: tamụ ntamu
  rationale: Akpaalaokwu Igbo a na-egosi mkpesa nke enweghị afọ ojuju, nke dabara n’omume Izrel n’ọzara.
- source_word: καθάπερ
  choice: dị ka
  rationale: Ọ na-egosi ntụnyere doro anya n’etiti ndị a na-agwa okwu na ihe atụ nke ụfọdụ ndị Izrel.
- source_word: τινὲς αὐτῶν
  choice: ụfọdụ n’ime ha
  rationale: 'Nke a na-edobe echiche nkewa nke okwu Grik ahụ: ọ bụghị ha niile, kama ụfọdụ n’etiti ha.'
- source_word: ἐγόγγυσαν
  choice: tamụrụ ntamu
  rationale: Ejiri otu akpaalaokwu ahụ mee ihe ọzọ iji chekwaa njikọ okwu dị n’etiti iwu ahụ na ihe atụ akụkọ ihe mere eme.
- source_word: ἀπώλοντο
  choice: bibie ha
  rationale: Ọ bụ ezie na ụdị Grik ahụ pụtara na e bibiri ha, Igbo na-asụkarị ọrụ a n’usoro onye mere ihe + ngwaa + ndị ihe mere; okwu na-esote na-akọwapụta onye mere mbibi ahụ.
- source_word: ὑπὸ τοῦ ὀλοθρευτοῦ
  choice: onye mbibi
  rationale: Nke a na-asụgharị aha e ji kpọọ onye ahụ n’ụzọ kpọmkwem n’etinyeghị ‘mmụọ ozi,’ nke ederede Grik ekwughị.
theological_decisions:
- issue: Onye ὁ ὀλοθρευτής bụ
  choice: onye mbibi
  alternative: mmụọ ozi na-ebibi ihe
  rationale: Ederede Grik kpọrọ ya naanị ‘onye mbibi.’ Isi amaokwu ahụ anaghị akọwapụta na ọ bụ mmụọ ozi, ya mere a hapụrụ njirimara ya ka ọ ghara ịkọwa ihe karịrị ihe ederede kwuru; e tinyere nkọwa ọzọ n’ala peeji.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị mfe ma dị ùgwù. ‘Tamụ ntamu’ na-eburu echiche nke mkpesa n’obi ọjọọ; usoro ‘onye mbibi wee bibie ha’ bụ Igbo eke ma na-edobe onye mere ihe ahụ n’ụzọ doro anya. Akara ala peeji [a] dị n’isi amaokwu ahụ.
