    reason: alternative_reading
  revision_rationale: The revision corrects the Standard Igbo forms of the grumbling idiom and moves the note marker to “onye mbibi,” the expression addressed by the note. It preserves the Greek’s unspecified destroying agent and the causal sequence without adding theological identification.
