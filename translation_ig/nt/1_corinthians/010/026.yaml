  text: τοῦ ⸂κυρίου γὰρ⸃ ἡ γῆ καὶ τὸ πλήρωμα αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/026.yaml
  text: For the earth is the Lord’s[a], and all that fills it.
translation:
  language: ig
  text: N’ihi na, “Ụwa na ihe niile dị n’ime ya bụ nke Onyenwe anyị.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: E hotara nke a n’Abụ Ọma 24:1. A pụkwara ịsụgharị akụkụ ikpeazụ ya dịka, “ihe niile jupụtara n’ụwa.”
    reason: cross_reference
lexical_decisions:
- source_word: κυρίου
  choice: nke Onyenwe anyị
  rationale: Ọdịdị genitive τοῦ κυρίου na-egosi onye nwe ihe; “bụ nke Onyenwe anyị” bụ ụzọ Igbo doro anya ma dịkwa ebube isi kwuo na ụwa bụ nke Onyenwe anyị.
- source_word: γάρ
  choice: N’ihi na
  rationale: γάρ na-enye ihe Akwụkwọ Nsọ kwuru dịka ihe ndabere maka okwu bu ya ụzọ; “N’ihi na” na-egosipụta njikọ nkọwa a nke ọma.
- source_word: γῆ
  choice: Ụwa
  rationale: N’okwu e hotara n’Abụ Ọma 24:1, γῆ na-ezo aka n’ụwa dum, ọ bụghị naanị otu ala.
- source_word: πλήρωμα
  choice: ihe niile jupụtara na ya
  rationale: N’ebe a πλήρωμα pụtara ihe niile dị n’ụwa ma na-ejupụta ya; nsụgharị a bụ nke mmadụ nkịtị ga-aghọta ma na-edobe ihe oyiyi dị n’okwu Grik.
- source_word: αὐτῆς
  choice: na ya
  rationale: Nnọchiaha a na-alaghachi n’azụ na γῆ, ya bụ “ụwa”; “na ya” dabara na usoro okwu Igbo a.
theological_decisions:
- issue: Nsụgharị κύριος n’okwu Akwụkwọ Nsọ nwere ibu gbasara Chineke
  choice: Onyenwe anyị
  alternative: Onyenwe; Dinwenụ
  rationale: “Onyenwe anyị” bụ aha Igbo a na-aghọta nke ọma maka κύριος, na-edobe echiche nke ịbụ Onye nwe ihe na nkwanye ùgwù, n’etinyeghị usoro mkpụrụedemede ukwu nke ederede Grik n’onwe ya na-ekwughị.
translation_notes:
  register: Standard Igbo; asụsụ dị ugbu a, dị ebube ma dị mfe nghọta. E ji akara nhota gosi na Pọl na-ehota Akwụkwọ Nsọ, ma e debere akara nkọwa [a] n’isiokwu ahụ.
