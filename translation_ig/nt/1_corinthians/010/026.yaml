  rationale: The revision retains the explanatory “N’ihi na,” the scriptural-citation form, and the customary rendering “Onyenwe anyị,” while expressing the earth and its fullness in natural Standard Igbo. The footnote now gives a meaningful alternative that reflects the image of what fills the earth.
