  to: ha niile ṅụkwara otu ihe ọṅụṅụ ime mmụọ ahụ, n’ihi na ha nọ na-aṅụ site n’oké nkume ime mmụọ nke na-eso ha; oké nkume ahụ bụkwa Mesaịa.[a]
