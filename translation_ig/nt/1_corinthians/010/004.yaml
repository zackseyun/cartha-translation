source:
  edition: SBLGNT
  text: καὶ πάντες τὸ αὐτὸ ⸂πνευματικὸν ἔπιον πόμα⸃, ἔπινον γὰρ ἐκ πνευματικῆς ἀκολουθούσης πέτρας, ἡ ⸂πέτρα δὲ⸃ ἦν ὁ Χριστός·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/004.yaml
  text: and all drank the same spiritual drink[a], for they were drinking from a spiritual rock that followed them[b], and the rock was the Messiah.
translation:
  language: ig
  text: ha niile ṅụkwara otu ihe ọṅụṅụ ime mmụọ ahụ, n’ihi na ha nọ na-aṅụ site n’oké nkume ime mmụọ nke na-eso ha; oké nkume ahụ bụkwa Mesaịa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Kraịst.” Grik bụ Χριστός, ya bụ, Onye E Tere Mmanụ.
    reason: alternative_reading
lexical_decisions:
- source_word: πνευματικὸν ... πόμα
  choice: ihe ọṅụṅụ ime mmụọ
  rationale: Nke a na-edobe okwu Pọl banyere ihe ọṅụṅụ nke sitere n’ọrụ na onyinye Chineke, ma na-echekwa njikọ ya na “nri ime mmụọ” dị n’amaokwu bu ụzọ.
- source_word: ἔπιον
  choice: ṅụkwara
  rationale: Oge aorist na-achịkọta ahụmahụ otu ndị ahụ niile nwere; ụdị ngwaa a bụ nke Igbo dị mfe ma kwekọọ n’okwu ahụ.
- source_word: ἔπινον
  choice: ha nọ na-aṅụ
  rationale: Ụdị imperfect na-egosi omume gara n’ihu ma ọ bụ mere ugboro ugboro; “nọ na-aṅụ” na-echekwa akụkụ a ma kewapụ ya na ἔπιον.
- source_word: ἐκ πνευματικῆς ἀκολουθούσης πέτρας
  choice: site n’oké nkume ime mmụọ nke na-eso ha
  rationale: “Oké nkume” dabara na πέτρα karịa obere “nkume”; “nke na-eso ha” na-echekwa omume na-aga n’ihu nke present participle, ebe enweghị article n’Igbo adịghị amanye mkpebi n’etiti ‘a’ na ‘the.’
- source_word: ἡ πέτρα δὲ ἦν
  choice: oké nkume ahụ bụkwa
  rationale: “Ahụ” na-egosi na ọ bụ otu oké nkume ahụ a kpọtụrụ aha; “bụkwa” na-eburu njikọ dị nro nke δέ n’enweghị ime ka ọ bụrụ nnukwu mmegide.
- source_word: ὁ Χριστός
  choice: Kraịst
  rationale: “Kraịst” bụ okwu Igbo a nabatara nke na-anọchi Χριστός, aha-ọkwa nke Onye E Tere Mmanụ; ọ na-echekwa okwu Pọl kpọmkwem n’enweghị ịgbanwe ya ka ọ bụrụ naanị ihe nnọchianya.
- source_word: πάντες τὸ αὐτὸ
  choice: ha niile ... otu ... ahụ
  rationale: Nke a na-echekwa nkwusi ike Pọl na ndị niile nọ n’ọgbọ ahụ nwetara otu ihe ahụ.
theological_decisions:
- issue: Nkwupụta njirimara “oké nkume ahụ bụ Kraịst”
  choice: A sụgharịrị ya kpọmkwem dịka “oké nkume ahụ bụkwa Kraịst.”
  alternative: “Oké nkume ahụ nọchiri anya Kraịst.”
  rationale: Grik ji ahịrịokwu nhata kpọmkwem, ἡ πέτρα δὲ ἦν ὁ Χριστός. Nsụgharị ahụ kwesịrị ịhapụ ike na esemokwu nkà mmụta okpukpe dị n’okwu Pọl kama ime ka ọ bụrụ naanị ihe nnọchianya.
- issue: Ihe πνευματικός pụtara n’ihe ọṅụṅụ na oké nkume
  choice: E debere ya dịka “ime mmụọ.”
  alternative: “ọrụ ebube” ma ọ bụ “ihe nnọchianya”
  rationale: “Ime mmụọ” na-echekwa okwu Pọl na obosara ihe ọ pụrụ ịpụta—onyinye sitere n’aka Chineke nke nwekwara mkpa ime mmụọ—n’enweghị imechi ya n’otu nkọwa.
- issue: Χριστός dịka aha-ọkwa
  choice: “Kraịst,” tinyere nkọwa ala peeji na ọ pụtara Onye E Tere Mmanụ/Mesaịa.
  alternative: “Mesaịa” n’ahịrịokwu bụ isi
  rationale: “Kraịst” bụ ụdị Standard Igbo amaara nke ọma ma na-echekwa njikọ okwu na Χριστός; nkọwa ala peeji na-eme ka ọrụ ya dịka aha-ọkwa doo anya.
translation_notes:
  register: Standard Igbo dị ugbu a, dị nsọ ma doo ndị nkịtị anya. E ji “oké nkume” chekwaa ọdịiche πέτρα na obere nkume, jiri “nọ na-aṅụ” na “na-eso” gosipụta omume na-aga n’ihu. Akara ala peeji [a] dị n’ahịrịokwu bụ isi.
