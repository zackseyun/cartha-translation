id: 1CO.10.20
reference: 1 Corinthians 10:20
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀλλ’ ὅτι ἃ ⸀θύουσιν, δαιμονίοις ⸂καὶ οὐ θεῷ θύουσιν⸃, οὐ θέλω δὲ ὑμᾶς κοινωνοὺς τῶν δαιμονίων γίνεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/020.yaml
  text: No[a], but what they sacrifice, they sacrifice to demons and not to God, and I do not want you to become sharers with demons.
translation:
  language: ig
  text: Mba; kama, ihe ha na-achụ n’àjà, ha na-achụrụ ndị mmụọ ọjọọ, ọ bụghịkwa Chineke. Ma achọghị m ka unu ghọọ ndị na ndị mmụọ ọjọọ na-enwekọ òkè.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “ndị na ndị mmụọ ọjọọ na-eso ekere òkè,” ma ọ bụ “ndị na ndị mmụọ ọjọọ na-enwe mmekọrịta.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’ ὅτι
  choice: Mba, kama
  rationale: N’ọnọdụ okwu a, nkebi a na-agbagha nghọtahie nwere ike isi n’amaokwu gara aga pụta ma na-ewebata ihe Pọl chọrọ ikwu n’ezie.
- source_word: ἃ θύουσιν
  choice: ihe ha na-achụ n’àjà
  rationale: Nke a na-egosi ihe ndị a na-enye n’àjà n’ozuzu ya, n’etinyeghị nkọwa na-adịghị n’ederede.
- source_word: δαιμονίοις
  choice: ndị mmụọ ọjọọ
  rationale: N’Agba Ọhụrụ, okwu a na-ezo aka ná ndị mmụọ ọjọọ, ọ bụghị nanị chi nta ma ọ bụ ihe ime mmụọ na-anọpụ iche.
- source_word: καὶ οὐ θεῷ
  choice: ọ bụghịkwa Chineke
  rationale: N’ọnọdụ a, θεῷ na-ezo aka n’ezi Chineke ma na-emegide ndị mmụọ ọjọọ.
- source_word: οὐ θέλω δὲ
  choice: achọghịkwa m
  rationale: Nke a na-aga n’ihu n’okwu ahụ n’ụzọ dị nro ma bụrụkwa Igbo e ji ekwu okwu ugbu a.
- source_word: κοινωνοὺς
  choice: ndị ... na-ekekọrịta ihe
  rationale: Nkebi a na-echekwa echiche nke iso na ikere òkè n’ihe, na-enweghị ime ka ọ bụrụ naanị mkpakọrịta nkịtị ma ọ bụ ikwubiga ya ókè dị ka nrubeisi zuru ezu.
- source_word: τῶν δαιμονίων
  choice: ha na ndị mmụọ ọjọọ
  rationale: E ji usoro a gosipụta mkpakọrịta na ikere òkè ‘na’ ndị mmụọ ọjọọ n’ụzọ Igbo na-ada nke ọma.
- source_word: γίνεσθαι
  choice: ka unu ghọọ
  rationale: ‘Ghọọ’ na-echekwa echiche nke ịbanye n’ọnọdụ ọhụrụ, ọ bụghị nanị ịnọ n’ọnọdụ ahụ.
theological_decisions:
- issue: Ụdị ofufe dị n’àjà ndị ọgọ mmụọ
  choice: Àjà ndị ahụ bụ ndị a na-achụrụ ndị mmụọ ọjọọ, ọ bụghị Chineke.
  alternative: Iwere okwu a dị ka nanị nkọwa ihe oriri ahụ pụtara n’etiti ọha mmadụ, ma ọ bụ iwere ‘ndị mmụọ ọjọọ’ dị ka ihe atụ nkịtị.
  rationale: E chekwara esemokwu doro anya dị n’etiti ‘ndị mmụọ ọjọọ’ na ‘Chineke’ n’akwụkwọ Grik, n’etinyeghị nkọwa ọzọ karịa ihe amaokwu ahụ kwuru.
- issue: Ike okwu κοινωνοὺς τῶν δαιμονίων
  choice: Iso ndị mmụọ ọjọọ na-ekekọrịta ihe ma na-ekere òkè.
  alternative: Nanị iso ndị na-efe arụsị na-akpakọrịta, ma ọ bụ ikwupụta nrubeisi zuru ezu nye ndị mmụọ ọjọọ.
  rationale: Ọnọdụ okwu gbara amaokwu ahụ gburugburu na-ekwu maka ezigbo ikere òkè. Nsụgharị a na-echekwa ịdị arọ nke ahụ ma ghara ikwubiga ya ókè.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị nsọ ma dị mfe nghọta. ‘Ịchụ n’àjà’ na-echekwa asụsụ ofufe; ‘ndị ... na-ekekọrịta ihe’ na-egosi κοινωνός n’ụzọ mmadụ nkịtị ga-aghọta, ebe nkọwa ala peeji na-edebe ụzọ ndị ọzọ e nwere ike isi sụgharịa ya.
