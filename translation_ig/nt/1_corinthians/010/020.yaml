revisions:
- from: Mba, kama, ihe ha na-achụ n’àjà, ha na-achụrụ ndị mmụọ ọjọọ, ọ bụghịkwa Chineke; achọghịkwa m ka unu ghọọ ndị ha na ndị mmụọ ọjọọ na-ekekọrịta ihe.[a]
  to: Mba; kama, ihe ha na-achụ n’àjà, ha na-achụrụ ndị mmụọ ọjọọ, ọ bụghịkwa Chineke. Ma achọghị m ka unu ghọọ ndị na ndị mmụọ ọjọọ na-enwekọ òkè.[a]
  rationale: The revision preserves the corrective opening, both occurrences of “sacrifice,” the unsoftened contrast “to demons, not to God,” and the sense of entering into participatory association. It replaces an awkward expression for κοινωνούς τῶν δαιμονίων with a natural Standard Igbo formulation and adjusts the connective before Paul’s warning.
