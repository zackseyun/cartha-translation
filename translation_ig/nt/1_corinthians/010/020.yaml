review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the repeated sacrificial verb, the contrast between demons and God, and the prospective force of γίνεσθαι ('ghọọ'). The rendering of κοινωνούς is conceptually sound, but its present relative construction is unnecessarily cumbersome.
  naturalness: Several phrases are intelligible but less idiomatic than they can be in contemporary Standard Igbo. In particular, “ndị ha na ndị mmụọ ọjọọ na-ekekọrịta ihe” is structurally heavy and can imply sharing unspecified things. “Ndị na ndị mmụọ ọjọọ na-enwekọ òkè” naturally expresses participatory association without adding content. “Ma achọghị m” gives δέ a clear and natural adversative progression.
  terminology: “Ndị mmụọ ọjọọ” appropriately renders δαιμόνια in this New Testament context. “Ịchụ n’àjà” is suitable cultic terminology. “Nwekọ òkè” retains the participation/fellowship sense of κοινωνούς without imposing a stronger claim of total allegiance.
  issues:
  - severity: medium
    issue: 'The final clause is awkwardly phrased: “ndị ha na ndị mmụọ ọjọọ na-ekekọrịta ihe.”'
    rationale: Although it aims to render participation with demons, it is syntactically cumbersome and “na-ekekọrịta ihe” can suggest sharing particular objects rather than having participatory fellowship. A more idiomatic construction can retain the source meaning.
  - severity: low
    issue: “Achọghịkwa m” leaves δέ less explicit than needed in the warning’s progression.
    rationale: “Ma achọghị m” is natural Standard Igbo and represents the mild adversative/continuative force without changing meaning.
  revised_text: Mba; kama, ihe ha na-achụ n’àjà, ha na-achụrụ ndị mmụọ ọjọọ, ọ bụghịkwa Chineke. Ma achọghị m ka unu ghọọ ndị na ndị mmụọ ọjọọ na-enwekọ òkè.[a]
  revised_footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “ndị na ndị mmụọ ọjọọ na-eso ekere òkè,” ma ọ bụ “ndị na ndị mmụọ ọjọọ na-enwe mmekọrịta.”
    reason: lexical_alternative
  revision_rationale: The revision preserves the corrective opening, both occurrences of “sacrifice,” the unsoftened contrast “to demons, not to God,” and the sense of entering into participatory association. It replaces an awkward expression for κοινωνούς τῶν δαιμονίων with a natural Standard Igbo formulation and adjusts the connective before Paul’s warning.
