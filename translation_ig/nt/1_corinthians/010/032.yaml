source:
  edition: SBLGNT
  text: ἀπρόσκοποι ⸂καὶ Ἰουδαίοις γίνεσθε⸃ καὶ Ἕλλησιν καὶ τῇ ἐκκλησίᾳ τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/032.yaml
  text: Give no offense either to Jews or to Greeks or to the church of God[b][a],
translation:
  language: ig
  text: Unu abụla ndị na-adịghị akpasu ndị Juu, ndị Grik[b], na nzukọ Chineke iwe[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “Unu abụrụla ndị na-adịghị akpasu iwe,” ma ọ bụ “ndị na-adịghị eme ka mmadụ sụọ ngọngọ.”
    reason: lexical_alternative
  - marker: b
    text: “Ndị Grik” n'ebe a yiri ka ọ na-ezo aka n'ụzọ sara mbara n'ebe ndị na-abụghị ndị Juu nọ n'oge Pọl; ma ihe odide Grik kpọmkwem kwuru “ndị Grik.”
    reason: cultural_note
lexical_decisions:
- source_word: ἀπρόσκοποι
  choice: emela ihe ga-eme ka ... sụọ ngọngọ
  rationale: N'ọnọdụ a, okwu ahụ na-ekwu maka izere omume ga-abụrụ ndị ọzọ ihe ịsụ ngọngọ ma ọ bụ ihe iwe. Nsụgharị a na-egosipụta mmekọrịta ahụ nke ọma n'Igbo, kama iji naanị okwu sara mbara dịka ‘enweghị ụta.’
- source_word: γίνεσθε
  choice: Unu emela
  rationale: Ọ bụ iwu na-aga n'ihu nke a na-enye ọtụtụ mmadụ. N'Igbo, ụdị mmachibido a na-egosipụta ndụ ha kwesịrị ịnọgide na-ebi n'ụzọ na-adịghị eme ndị ọzọ ka ha sụọ ngọngọ.
- source_word: Ἰουδαίοις
  choice: ndị Juu
  rationale: N'ebe a ọ na-ezo aka n'ebe ndị Juu nọ dịka otu agbụrụ na okpukpe, ọ bụghị naanị ndị bi na Judia.
- source_word: Ἕλλησιν
  choice: ndị Grik
  rationale: Okwu Grik ahụ kpọmkwem bụ ‘ndị Grik.’ Ọ bụ ezie na n'ọnọdụ Pọl ọ pụrụ ịgụnye ndị na-abụghị ndị Juu n'ozuzu, a na-edobe kpọmkwem okwu isi mmalite n'ahịrịokwu.
- source_word: ἐκκλησίᾳ τοῦ θεοῦ
  choice: nzukọ Chineke
  rationale: ‘Nzukọ’ na-egosipụta ọgbakọ ndị kwere ekwe, ebe ‘Chineke’ na-edobe njikọ genitive nke okwu Grik n'ụzọ dị mfe ma dị ùgwù.
theological_decisions:
- issue: Otu dị iche iche a kpọrọ aha n'ịdọ aka ná ntị Pọl
  choice: 'E debere otu atọ ahụ: ndị Juu, ndị Grik, na nzukọ Chineke.'
  alternative: Ịsụgharị ‘ndị Grik’ dịka ‘ndị mba ọzọ,’ ma ọ bụ ịkọwa ndụmọdụ a naanị dịka atụmatụ mgbasa ozi ọma.
  rationale: Amaokwu ahụ n'onwe ya kpọrọ otu atọ aha. Nsụgharị ahụ anaghị agbasawanye ma ọ bụ belata ha, ọ naghịkwa ekpebi ma iwu a bụ naanị atụmatụ ozi ọma ka ọ bụ ụkpụrụ omume zuru ụwa ọnụ.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma doo anya nye ndị nkịtị. E jiri ‘unu’ gosi na iwu ahụ bụ nke ọtụtụ mmadụ; a họọrọ ‘sụọ ngọngọ’ iji chekwaa echiche nke ime ka onye ọzọ daa ma ọ bụ nwee ihe mgbochi n'ọnọdụ a.
