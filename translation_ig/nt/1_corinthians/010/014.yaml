id: 1CO.10.14
reference: 1 Corinthians 10:14
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Διόπερ, ἀγαπητοί μου, φεύγετε ἀπὸ τῆς εἰδωλολατρίας.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/014.yaml
  text: Therefore[a], my beloved, flee from idolatry.
translation:
  language: ig
  text: N’ihi ya, ndị m hụrụ n’anya, gbanahụ ikpere arụsị[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ife arụsị.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Διόπερ
  choice: N’ihi ya
  rationale: Ọ bụ okwu nkwubi okwu nke na-ejikọta iwu a na arụmụka bu ya ụzọ; “N’ihi ya” na-egosipụta ihe kpatara nkwubi okwu ahụ n’Igbo nkịtị.
- source_word: ἀγαπητοί μου
  choice: ndị m hụrụ n’anya
  rationale: Ọ na-echekwa ma okwu ịhụnanya Pọl ji kpọọ ha ma njikọ nke nnọchiaha “m,” n’asụsụ Igbo dị ugbu a ma dị ùgwù.
- source_word: φεύγετε
  choice: gbanahụ
  rationale: Ngwaa iwu a siri ike ma na-akpọ ọtụtụ mmadụ ka ha pụọ n’ihe dị ize ndụ; “gbanahụ” na-echekwa ike na ngwa ngwa dị n’okwu Grik ahụ.
- source_word: ἀπὸ
  choice: —
  rationale: E tinyela echiche nkewapụ nke ἀπό n’ime ngwaa Igbo “gbanahụ,” nke na-anabata ihe a na-agbanahụ ozugbo; ịgbakwunye preposition ọzọ agaghị abụ Igbo ebumpụta ụwa.
- source_word: τῆς εἰδωλολατρίας
  choice: ikpere arụsị
  rationale: Nke a bụ okwu Igbo a na-aghọta nke ọma maka ife ma ọ bụ ịkpọ isiala nye arụsị; ọ na-echekwa obosara okwu Grik ahụ n’enweghị ime ka ọ bụrụ naanị echiche dị n’obi.
theological_decisions:
- issue: Ụdị ihe a machibidoro
  choice: Iwu kpọmkwem ka ha gbanahụ ikpere arụsị, tinyere isonye n’omume metụtara ofufe arụsị
  alternative: Ịdọ aka ná ntị dị warara naanị megide ịrara arụsị nye obi
  rationale: N’akụkụ Akwụkwọ Nsọ gbara ya gburugburu, Pọl na-ekwu banyere isonye n’oriri na omume ofufe ndị ọgọ mmụọ. Ya mere, “ikpere arụsị” ka bụ okwu sara mbara, dịka εἰδωλολατρία si dị, n’enweghị imechi ya naanị n’omume mpụta ma ọ bụ naanị n’echiche ime mmụọ.
translation_notes:
  register: Asụsụ Igbo Izugbe dị ugbu a, dị mfe nghọta ma dị ùgwù. “Ndị m hụrụ n’anya” na-enye oku ahụ mmetụta ịhụnanya; “gbanahụ” na-echekwa ịdị ngwa na ike nke iwu ahụ.
