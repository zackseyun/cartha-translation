  text: καὶ πάντες εἰς τὸν Μωϋσῆν ⸀ἐβαπτίσαντο ἐν τῇ νεφέλῃ καὶ ἐν τῇ θαλάσσῃ,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/002.yaml
  text: and all were baptized into Moses in the cloud and in the sea[b][a],
translation:
  language: ig
  text: E mere ha niile baptizim n'ime Mosis, n'ígwé ojii na n'oké osimiri.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “e jikọtara ha na Mosis” ma ọ bụ “ha ghọrọ ndị na-akwado Mosis.” N'asụsụ Grik, e kwuru kpọmkwem, “n'ime Mosis”; nke a na-echekwa myirịta Pọl na-eme na baptizim.
    reason: alternative_reading
  - marker: b
    text: Pọl kwuru “n'oké osimiri,” ọ bụghị “gafee oké osimiri”; nke a na-echekwa myirịta ya na “n'ígwé ojii.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντες
  choice: ha niile
  rationale: Ọ na-ezo aka n'Izrel niile a na-ekwu banyere ha ma na-echekwa nkwusiri ike Pọl tinyere n'okwu a.
- source_word: εἰς τὸν Μωϋσῆν
  choice: baa n'ime Mosis
  rationale: Nsụgharị a na-echekwa okwu Grik pụrụ iche bụ́ ‘n'ime Mosis’ na njikọ ihe atụ ya na baptizim, n'akwụghị kpọmkwem na ọ pụtara nanị njirimara ma ọ bụ nrubeisi nye Mosis.
- source_word: ἐβαπτίσαντο
  choice: e mekwara ha baptizim
  rationale: Ụdị a bụ Igbo dị mfe ma dị n'okike nke na-egosi na e mere ha baptizim, n'agbanyeghị na ngwaa Grik dị n'ụdị middle; ọ naghị amanye echiche na ha mere onwe ha baptizim.
- source_word: ἐν τῇ νεφέλῃ
  choice: n'ígwé ojii
  rationale: Ọ na-echekwa ἐν (‘n'ime/n'’) na ihe oyiyi njem Ọpụpụ, ma hapụkwa nghọta ya dị ka ọnọdụ, ụzọ, ma ọ bụ mmekọrịta ka ọ ghara ịbụ nke a kpebiri oke.
- source_word: ἐν τῇ θαλάσσῃ
  choice: n'oké osimiri
  rationale: Ọ na-asụgharị ἐν kpọmkwem dị ka ‘n'’ ma na-echekwa myirịta ya na ‘n'ígwé ojii,’ kama ịgbanwe ya ka ọ bụrụ ‘site n'oké osimiri gafee.’
theological_decisions:
- issue: Ihe ‘baptizim baa n'ime Mosis’ pụtara
  choice: E chekwara asụsụ ihe atụ na nnọchiteanya ahụ n'akwaghị ya nkọwa gafere ihe ederede kwuru.
  alternative: ‘e jikọtara ha na Mosis’ ma ọ bụ ‘ha banyere n'okpuru idu ndú Mosis’
  rationale: Pọl na-eme ka ahụmahụ Ọpụpụ Izrel na baptizim Ndị Kraịst yie ibe ha. Nsụgharị ahụ kwesịrị ichekwa esemokwu na obosara nkà mmụta okpukpe dị na ya, kama ikpebi otu nkọwa naanị.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma doo ndị nkịtị anya. E ji ‘mee baptizim’ dịka okwu Ndị Kraịst maara nke ọma; a hapụrụ ‘baa n'ime Mosis’ ka ọ chekwaa ọdịdị na nghọta sara mbara nke Grik. Akara ndetu ala peeji abụọ pụtara n'ahịrị bụ isi.
