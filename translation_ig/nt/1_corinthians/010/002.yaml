- from: e mekwara ha niile baptizim baa n'ime Mosis n'ígwé ojii nakwa n'oké osimiri.[a][b]
  to: E mere ha niile baptizim n'ime Mosis, n'ígwé ojii na n'oké osimiri.[a][b]
  rationale: The revision repairs Igbo syntax while retaining the source’s unusual ‘into Moses’ construction as ‘n'ime Mosis.’ It preserves the paired ‘n’ phrases, avoids importing a doctrinal explanation, and updates both footnotes so that their wording and alternatives are accurate and idiomatic.
  reviewer_model: gpt-5.6-terra
