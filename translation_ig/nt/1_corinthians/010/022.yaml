id: 1CO.10.22
reference: 1 Corinthians 10:22
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἢ παραζηλοῦμεν τὸν κύριον; μὴ ἰσχυρότεροι αὐτοῦ ἐσμεν;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/022.yaml
  text: Or are we provoking the Lord to jealousy? Surely we are not stronger than he is, are we?
translation:
  language: ig
  text: Ma ọ bụ na anyị na-eme ka Onyenwe anyị nwee ekworo? Anyị ò dị ike karịa ya?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἢ
  choice: Ka
  rationale: N’ebe a, okwu a na-ewebata ajụjụ ọzọ dị ka nhọrọ ma ọ bụ ihe ga-esi n’omume a pụta; ‘Ka’ na-arụ ọrụ a nke ọma n’Igbo mgbe o so ajụjụ.
- source_word: παραζηλοῦμεν
  choice: anyị na-akpalikwa ... iwe n’ihi ekworo
  rationale: Ngwaa a pụtara ime ka onye nwee ekworo ma ọ bụ iwe nke ekworo kpaliri. Nsụgharị a na-edobe ma echiche nke ịkpasu iwe ma ihe kpatara ya, n’enweghị itinye nkọwa okpukpe ọzọ.
- source_word: τὸν κύριον
  choice: Onyenwe anyị
  rationale: Nke a bụ aha a na-ejikarị asụ κύριος n’Igbo, ma na-edobe ntụaka ahụ n’enweghị ịkọwapụta karịa ihe odide Grik kwuru.
- source_word: μὴ
  choice: N’ezie, ... adịghị ... ka anyị dị?
  rationale: μὴ na ajụjụ a na-atụ anya azịza ‘mba.’ Usoro Igbo a na-eme ka atụmanya ahụ doo anya ma na-edobe ya dịka ajụjụ nkwupụta.
- source_word: ἰσχυρότεροι αὐτοῦ
  choice: ike karịa ya
  rationale: 'Nke a na-asụ comparative Grik ahụ n’ụzọ kwụ ọtọ ma dị mfe nghọta: ‘stronger than him.’'
theological_decisions:
- issue: Ihe ‘ekworo’ nke Onyenwe anyị pụtara
  choice: E debere ya dịka iwe nke ekworo kpaliri
  alternative: ịkpasu Onyenwe anyị iwe naanị
  rationale: παραζηλόω nwere echiche ekworo n’ime ya; iwepụ ya ga-eme ka akụkụ ihe okwu Grik pụtara fuo, ebe ịkọwa ụdị ekworo ahụ n’ụzọ sara mbara ga-agafe amaokwu ahụ.
- issue: Ike ajụjụ nke abụọ
  choice: E gosiri na ọ na-atụ anya azịza ‘mba’
  alternative: Ịsụ ya dịka ajụjụ na-anọpụ iche
  rationale: μὴ na-egosi na Pọl na-atụ anya na ndị na-agụ ya ga-ekweta na ha adịghị ike karịa Onyenwe anyị.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị ùgwù ma dị mfe nghọta. E ji ‘na-akpalikwa’ gosi omume na-aga n’ihu ma jikọta ajụjụ a na ihe ndị bu ya ụzọ; e zere okwu ụka pụrụ iche na nkọwa na-adịghị n’odide Grik.
