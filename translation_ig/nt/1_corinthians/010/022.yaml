revisions:
- from: Ka anyị na-akpalikwa Onyenwe anyị iwe n’ihi ekworo? N’ezie, anyị adịghị ike karịa ya, ka anyị dị?
  to: Ma ọ bụ na anyị na-eme ka Onyenwe anyị nwee ekworo? Anyị ò dị ike karịa ya?
  rationale: The revision renders ἢ as an alternative rhetorical introduction, expresses παραζηλοῦμεν directly as causing the Lord to be jealous, and uses a natural Igbo rhetorical question for μή ἰσχυρότεροι αὐτοῦ ἐσμεν. It preserves the source’s ambiguity and does not add theological explanation.
  reviewer_model: gpt-5.6-terra
