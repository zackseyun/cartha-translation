revisions:
- from: Ka anyị ghara imekwa omume rụrụ arụ n’ihe gbasara mmekọahụ, dị ka ụfọdụ n’ime ha mere omume rụrụ arụ n’ihe gbasara mmekọahụ; puku mmadụ iri abụọ na atọ wee daa[a] n’otu ụbọchị.[b]
  to: Ka anyị ghara kwa ime mmehie mmekọahụ, dị ka ụfọdụ n’ime ha mere mmehie mmekọahụ; ma puku mmadụ iri abụọ na atọ[b] dara[a] n’otu ụbọchị.
  rationale: The revision improves idiomatic Standard Igbo, changes the sequential connector to an additive one consistent with καί, and moves the numerical cross-reference marker to the number it explains. It preserves the source wording, including the unharmonized total and the figurative 'fell.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T18:12:19Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly retains the hortatory prohibition, the repeated sexual-misconduct verb, Paul's stated total of twenty-three thousand, and the literal image of 'falling.' However, the additive καί before ἔπεσαν is better represented by 'ma' rather than a sequential 'wee.'
  naturalness: The repeated phrase 'ime omume rụrụ arụ n’ihe gbasara mmekọahụ' is understandable but cumbersome and less idiomatic than 'ime mmehie mmekọahụ.' 'Ka anyị ghara kwa ime' is a natural way to retain the connective force of μηδέ.
  terminology: '''Mmehie mmekọahụ'' is a clear, broad Standard Igbo rendering of πορνεύω in this moral-warning context and permits the Greek repetition to remain evident. ''Dara'' appropriately preserves ἔπεσαν, with the death sense explained in a note.'
  issues:
  - severity: medium
    issue: The main clause uses 'wee daa.'
    rationale: '''Wee'' normally marks sequence (''then''), whereas καὶ here simply links the consequence: ''and twenty-three thousand fell.'' ''Ma ... dara'' more closely reflects the source without adding a temporal sequence.'
  - severity: medium
    issue: Footnote b is anchored at the end of the sentence rather than on the number it discusses.
    rationale: The cross-reference note concerns 'twenty-three thousand'; its marker should immediately follow 'atọ' for a clear footnote anchor.
  - severity: low
    issue: The sexual-misconduct phrase is unnecessarily heavy.
    rationale: Replacing it with 'ime mmehie mmekọahụ' gives natural modern Standard Igbo while retaining the Greek term's broad moral reference and its repetition.
  revised_text: Ka anyị ghara kwa ime mmehie mmekọahụ, dị ka ụfọdụ n’ime ha mere mmehie mmekọahụ; ma puku mmadụ iri abụọ na atọ[b] dara[a] n’otu ụbọchị.
