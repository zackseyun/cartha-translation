id: 1CO.10.8
reference: 1 Corinthians 10:8
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: μηδὲ πορνεύωμεν, καθώς τινες αὐτῶν ἐπόρνευσαν, καὶ ἔπεσαν μιᾷ ἡμέρᾳ εἴκοσι τρεῖς χιλιάδες.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/008.yaml
  text: Nor should we commit sexual immorality[a], as some of them committed sexual immorality[b], and twenty-three thousand fell in one day.
translation:
  language: ig
  text: Ka anyị ghara kwa ime mmehie mmekọahụ, dị ka ụfọdụ n’ime ha mere mmehie mmekọahụ; ma puku mmadụ iri abụọ na atọ[b] dara[a] n’otu ụbọchị.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “nwụrụ” ma ọ bụ “e gburu ha.” Okwu Grik ahụ sịrị, “dara,” bụ ụzọ a na-ejikarị akọwa ọnwụ n’okpuru ikpe.
    reason: lexical_alternative
  - marker: b
    text: Ọnụọgụgụ 25:9 kwuru na ndị nwụrụ dị puku mmadụ iri abụọ na anọ. N’ebe a, Pọl kwuru na puku mmadụ iri abụọ na atọ dara “n’otu ụbọchị.” Nke a nwere ike igosi na ọ na-ekwu maka ndị nwụrụ n’ụbọchị ahụ, ebe ọnụ ọgụgụ ka ukwuu bụ ngụkọta ndị niile nwụrụ; ma nsụgharị a debere okwu Pọl n’enweghị ime ka ọnụ ọgụgụ abụọ ahụ daba n’otu.
    reason: cross_reference
lexical_decisions:
- source_word: μηδὲ
  choice: Ka anyị ghara ... kwa
  rationale: Njikọ “kwa” na-ejikọta ịdọ aka ná ntị a na ndị bu ya ụzọ, ebe “Ka anyị ghara” na-egosipụta ndụmọdụ iwu nke subjunctive ahụ n’Igbo dị ndụ.
- source_word: πορνεύωμεν / ἐπόρνευσαν
  choice: ime omume rụrụ arụ n’ihe gbasara mmekọahụ
  rationale: Nke a na-egosi omume mmekọahụ na-adịghị mma n’ụzọ sara mbara, n’enweghị ime ka okwu Grik ahụ bụrụ naanị otu ụdị mmehie mmekọahụ. E jikwa otu okwu ahụ mee ihe ugboro abụọ iji chekwaa nkwughachi dị na Grik.
- source_word: καθώς
  choice: dị ka
  rationale: Ọ bụ ụzọ Igbo kwụ ọtọ ma bụrụkwa nke ebumpụta ụwa isi gosipụta ntụnyere ahụ.
- source_word: τινες αὐτῶν
  choice: ụfọdụ n’ime ha
  rationale: Nke a na-ezo aka n’ụfọdụ ndị Izrel nke ọgbọ ahụ n’ụzọ doro anya.
- source_word: ἔπεσαν
  choice: daa
  rationale: “Daa” na-echekwa ihe okwu Grik pụtara kpọmkwem, ebe ọnọdụ ikpe ahụ na-egosi na ọ na-ekwu maka ọnwụ. E debere nkọwa ndị ọzọ n’ala peeji.
- source_word: μιᾷ ἡμέρᾳ
  choice: n’otu ụbọchị
  rationale: Nke a na-egosipụta oge ọnwụ ahụ mere ma na-eme ka ịdị ukwuu nke ihe mere n’otu ụbọchị pụta ìhè.
- source_word: εἴκοσι τρεῖς χιλιάδες
  choice: puku mmadụ iri abụọ na atọ
  rationale: A sụgharịrị ọnụ ọgụgụ Grik ahụ ozugbo; itinye “mmadụ” na-eme ka okwu ahụ doo anya ma bụrụ Igbo ebumpụta ụwa.
theological_decisions:
- issue: Mmekọrịta ọnụ ọgụgụ a na Ọnụọgụgụ 25:9
  choice: E debere “puku mmadụ iri abụọ na atọ” nke Pọl kwuru n’ahịrịokwu bụ isi, n’enweghị ime ka ọ daba n’ọnụ ọgụgụ ọzọ.
  alternative: Ịgbanwe ya ka ọ bụrụ “puku mmadụ iri abụọ na anọ,” ma ọ bụ ikwu kpọmkwem na otu ọnụ ọgụgụ bụ nke otu ụbọchị ebe nke ọzọ bụ ngụkọta.
  rationale: Ihe odide Grik nke 1 Ndị Kọrịnt kwuru puku iri abụọ na atọ. Nsụgharị ekwesịghị idozi esemokwu ọnụ ọgụgụ ahụ n’ahịrịokwu bụ isi; nkọwa nwere ike ịdị n’ala peeji.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị nsọ ma dị mfe nghọta, dee ya. Ahịrịokwu ahụ na-echekwa nkwughachi nke ngwaa Grik, okwu ihe atụ “daa,” na esemokwu ọnụ ọgụgụ dị n’etiti amaokwu a na Ọnụọgụgụ 25:9.
