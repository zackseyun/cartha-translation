  text: and all ate the same spiritual food[a]
translation:
  language: ig
  text: Ha niile ririkwa otu nri ime mmụọ ahụ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “nri sitere n'ike karịrị nke mmadụ.” O yikarịrị ka okwu a na-atụ aka na mana ahụ e nyere n'ọzara, ọ pụkwara inwe ihe atụ miri emi n'okwu ndị gbara ya gburugburu.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: -kwara
  rationale: A gbakwụnyere njikọ a n'ime ngwaa dịka “rịkwara,” nke na-ejikọta amaokwu a na nke bu ya ụzọ n'ụzọ Igbo si ekwu ya nke ọma.
- source_word: πάντες
  choice: Ha niile
  rationale: Nke a na-ezo aka n'ìgwè Izrel ahụ dum ma na-echekwa nkwusi ike nke πάντες.
- source_word: τὸ αὐτὸ
  choice: otu ... ahụ
  rationale: Usoro “otu ... ahụ” na-egosi na ha niile riri nri ahụ bụ otu, dịka okwu Grik si kwusi ike.
- source_word: πνευματικὸν
  choice: ime mmụọ
  rationale: Nke a bụ nsụgharị sara mbara ma bụrụkwa nke a na-ahụkarị maka πνευματικός; ọ naghị amanye nkọwa dị warara dịka “nke Mmụọ Nsọ” ma ọ bụ nanị “ọrụ ebube.”
- source_word: βρῶμα
  choice: nri
  rationale: “Nri” bụ okwu Igbo nkịtị na nke ziri ezi maka ihe a na-eri.
- source_word: ἔφαγον
  choice: rịkwara
  rationale: “Rị-” na-akọ omume iri mere n'oge gara aga, ebe “-kwara” na-eburu njikọ καὶ n'ụzọ dabara n'asụsụ Igbo.
theological_decisions:
- issue: Ihe “nri ime mmụọ” pụtara n'ihe atụ Pọl banyere njem n'ọzara
  choice: E debere “nri ime mmụọ” n'ahịrịokwu bụ isi n'akọwaghị ya kpọmkwem dịka mana ma ọ bụ Oriri Nsọ.
  alternative: “nri karịrị ike mmadụ” ma ọ bụ “mana Chineke nyere”
  rationale: O yikarịrị ka Pọl na-atụ aka na mana e nyere Izrel n'ọzara, ma okwu ya nwekwara ike ibu ihe atụ miri emi n'okwu ndị gbara ya gburugburu. Nsụgharị a na-echekwa obosara na esemokwu nkà mmụta okpukpe dị n'okwu mbụ.
translation_notes:
  register: Standard Igbo; asụsụ dị ugbu a, dị ùgwù, ma dị mfe nghọta. E ji “Ha niile” mee ka isiokwu ahụ doo anya n'Igbo, n'agbanyeghị na Grik gosipụtara ya site na ngwụcha ngwaa na πάντες.
