- from: Gịnịzi ka m na-ekwu? Ọ bụ na nri a chụrụ n’àjà nye arụsị bụ ihe ọ bụla[a][b], ka ọ bụ na arụsị bụ ihe ọ bụla?
  to: Gịnịzi ka m na-ekwu? Ọ bụ na nri a chụrụ n’àjà nye arụsị bụ ihe ọ bụla[a][b], ka ọ bụ na arụsị bụ ihe ọ bụla?
  rationale: 'The verse itself is retained because it is faithful and natural. The two footnotes are adjusted: footnote a more directly reflects the lexical alternative “idol-offering,” and footnote b replaces an unnatural expression with wording that accurately states the limited contextual explanation. The main text continues to preserve the Greek rhetorical ambiguity and does not import a doctrinal conclusion.'
