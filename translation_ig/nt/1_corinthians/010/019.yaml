  yaml_path: translation/nt/1_corinthians/010/019.yaml
  text: What then am I saying? That food sacrificed to idols is anything[b][a], or that an idol is anything?
translation:
  language: ig
  text: Gịnịzi ka m na-ekwu? Ọ bụ na nri a chụrụ n’àjà nye arụsị bụ ihe ọ bụla[a][b], ka ọ bụ na arụsị bụ ihe ọ bụla?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ihe a chụrụ n’àjà nye arụsị bara ihe ọ bụla.”
    reason: lexical_alternative
  - marker: b
    text: Ya bụ, Pọl anaghị ekwu na arụsị dị adị n’ezie dị ka chi, ma ọ bụ na nri e ji chụọ àjà nwere mkpa ime mmụọ pụrụ iche n’onwe ya.
    reason: cross_reference
lexical_decisions:
- source_word: τί οὖν φημι
  choice: Gịnịzi ka m na-ekwu?
  rationale: Ọ na-edobe ajụjụ arụmụka ahụ, oge ugbu a, na onye mbụ dị na Grik, ma bụrụkwa okwu Igbo e ji eme ihe n'ụzọ ebumpụta ụwa.
- source_word: ὅτι
  choice: Ọ bụ na
  rationale: Ọ na-ewebata ihe mmadụ nwere ike iche na Pọl na-ekwu, ma na-edobe ya dị ka ajụjụ kama ime ya nkwupụta.
- source_word: εἰδωλόθυτόν
  choice: nri a chụrụ n’àjà nye arụsị
  rationale: N’ọnọdụ a okwu ahụ na-ezo aka n’ihe oriri, karịchaa anụ, e jikọtara na àjà a na-achụrụ arụsị; ‘nri’ bụ okwu doro ndị na-agụ Igbo anya ma ghara ime ka ọ bụrụ naanị anụ.
- source_word: τί ἐστιν
  choice: bụ ihe ọ bụla
  rationale: 'Ọ na-edobe mkpụmkpụ okwu Grik ahụ na oghere ọ nwere: ma ihe ahụ ọ̀ nwere ịdị adị ma ọ bụ uru dị mkpa n’echiche a na-ekwu maka ya.'
- source_word: ἢ
  choice: ka ọ bụ na
  rationale: Ọ na-ejikọta ajụjụ abụọ yiri ibe ha n’usoro nkewa doro anya n’Igbo.
- source_word: εἴδωλον
  choice: arụsị
  rationale: ‘Arụsị’ bụ okwu Igbo a na-ahụkarị maka ihe oyiyi a na-efe ofufe ma dabara kpọmkwem n’ọnọdụ a.
theological_decisions:
- issue: Ma ajụjụ Pọl ọ na-ekwusi ike na arụsị ma ọ bụ nri a chụrụ nye ya nwere ịdị adị ma ọ bụ mkpa n’ezie
  choice: 'E depụtara ajụjụ abụọ ahụ n’ụzọ kpọmkwem: ‘nri ... bụ ihe ọ bụla ... arụsị bụ ihe ọ bụla?’'
  alternative: ‘àjà arụsị nwere ịdị adị n’ezie ... arụsị nwekwara ịdị adị n’ezie?’
  rationale: Nhọrọ a na-edobe okwu ‘ihe ọ bụla’ nke Grik n’oghere ya, na-enweghị itinye nkọwa nkà ihe ọmụma ma ọ bụ nkwenkwe otu ụka n’ime amaokwu ahụ.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke oge a, kwanyere ùgwù ma dị mfe nghọta. E ji ‘nri a chụrụ n’àjà nye arụsị’ mee ka okwu ahụ doo anya n’ọnọdụ iri ihe nke 1 Ndị Kọrịnt 8–10; e debere ‘bụ ihe ọ bụla’ iji chekwaa nghọta abụọ okwu Grik ahụ nwere.
