  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐὰν δέ τις ὑμῖν εἴπῃ· Τοῦτο ⸀ἱερόθυτόν ἐστιν, μὴ ἐσθίετε δι’ ἐκεῖνον τὸν μηνύσαντα καὶ τὴν ⸀συνείδησιν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/028.yaml
  text: But if someone says to you, “This has been offered in sacrifice,” do not eat it, for the sake of the one who informed you and for conscience’ sake.
translation:
  language: ig
  text: Ma ọ bụrụ na onye ọ bụla agwa unu, “E nyere nke a n’àjà,”[a] unu erila ya, n’ihi onye ahụ gwara unu nke a nakwa n’ihi akọnuche.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “Nke a bụ anụ e ji chụọ àjà.” Okwu Grik ahụ na-ekwu maka ihe e nyere n’àjà.
    reason: lexical_alternative
  - marker: b
    text: Ya bụ, n’ihi akọnuche onye nke ọzọ, ọ bụghị nke unu; lee amaokwu na-esote.
    reason: cross_reference
lexical_decisions:
- source_word: ἐὰν δέ τις ὑμῖν εἴπῃ
  choice: Ma ọ bụrụ na onye ọ bụla asị unu
  rationale: “Ma” na-egosi mgbanwe ma ọ bụ ntụnyere δέ na-eweta; “ọ bụrụ na” na-egosipụta ọnọdụ ἐὰν, ebe “onye ọ bụla” na-echekwa ịdị na-enweghị onye a kapịrị ọnụ nke τις.
- source_word: Τοῦτο ἱερόθυτόν ἐστιν
  choice: E jiri nke a chụọ àjà
  rationale: Nke a na-egosipụta na ihe a kpọrọ aha bụ ihe e nyere n’àjà, dịka ἱερόθυτόν si pụta. E tinyeghị “arụsị” n’ahịrịokwu n’ihi na okwu Grik a n’onwe ya ekwughị ya kpọmkwem.
- source_word: μὴ ἐσθίετε
  choice: unu erila ya
  rationale: Nke a bụ iwu na-egbochi iri ihe ahụ. “Ya” na-ezo aka n’ihe oriri ahụ a kpọtụrụ aha, ma mee ka Igbo daa nke ọma.
- source_word: δι’ ἐκεῖνον τὸν μηνύσαντα
  choice: n’ihi onye ahụ mere ka unu mara ya
  rationale: διά ya na accusative na-egosi ihe kpatara omume ahụ ma ọ bụ ilebara onye ahụ anya; μηνύσαντα bụ ime ka mmadụ mara ma ọ bụ ịkọrọ ya ihe.
- source_word: καὶ τὴν συνείδησιν
  choice: nakwa n’ihi akọnuche
  rationale: A sụgharịrị συνείδησις dịka “akọnuche.” E chekwara nkenke na ntakịrị mgbagwoju anya dị n’ahịrịokwu Grik, kama ịkọwa n’ahịrịokwu bụ akọnuche onye ọ bụ.
theological_decisions:
- issue: Akọnuche onye ka τὴν συνείδησιν na-ekwu maka ya?
  choice: Isi ahịrịokwu kwuru naanị “akọnuche,” ma nkọwa ala peeji kọwara na ọ bụ akọnuche onye mere ka ha mara ya.
  alternative: Ịsị n’isi ahịrịokwu kpọmkwem “akọnuche onye ahụ,” ma ọ bụ iwere ya dịka akọnuche onye ga-eri nri ahụ.
  rationale: Amaokwu na-esote na-akọwa na Pọl ekwughị maka akọnuche onye na-eri nri, kama nke onye ọzọ. Ma n’amaokwu a, ide naanị “akọnuche” na-echekwa usoro echiche Pọl na ụzọ o si mee ka nkọwa ya pụta n’amaokwu na-esote.
translation_notes:
  register: E ji Igbo Izugbe dị ugbu a, nke dị mfe nghọta ma nwee ugwu. E ji “unu” mee ka okwu ahụ e duuru ọtụtụ mmadụ doo anya. E zeere ịtinye “arụsị” n’isi ahịrịokwu n’ihi na, ọ bụ ezie na ọnọdụ gbara amaokwu ahụ gburugburu metụtara àjà arụsị, ἱερόθυτόν n’onwe ya pụtara ihe e nyere n’àjà.
