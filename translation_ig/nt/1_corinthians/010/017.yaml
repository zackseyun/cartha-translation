revisions:
- from: N’ihi na achịcha ahụ bụ otu[a], anyị bụ́ ọtụtụ bụ otu ahụ, n’ihi na anyị niile na-eketa oke n’otu achịcha ahụ.
  to: N’ihi na e nwere otu achịcha[a], anyị, ndị ọtụtụ, bụ otu ahụ; n’ihi na anyị niile na-eketa oke n’otu achịcha ahụ.
  rationale: The revision removes unwarranted definiteness from the first εἷς ἄρτος, retains the definite reference in τοῦ ἑνὸς ἄρτου, and improves idiomatic Igbo syntax. It preserves the causal and communal logic of the Greek and leaves the verse’s sacramental implications open, as does the source.
