source:
  edition: SBLGNT
  text: ὅτι εἷς ἄρτος, ἓν σῶμα οἱ πολλοί ἐσμεν, οἱ γὰρ πάντες ἐκ τοῦ ἑνὸς ἄρτου μετέχομεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/017.yaml
  text: Because there is one bread[a], we who are many are one body, for we all partake of the one bread.
translation:
  language: ig
  text: N’ihi na e nwere otu achịcha[a], anyị, ndị ọtụtụ, bụ otu ahụ; n’ihi na anyị niile na-eketa oke n’otu achịcha ahụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “otu ogbe achịcha,” n’ebe abụọ e kwuru “otu achịcha.” Okwu Grik ἄρτος nwere ike ịpụta “achịcha” ma ọ bụ “otu ogbe achịcha”; “otu ogbe achịcha” nwere ike ime ka onyinyo nke ọtụtụ mmadụ na-eketa oke n’otu ihe pụta ìhè karị.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: N’ihi na
  rationale: Na-egosi ihe kpatara okwu bu ya ụzọ; ọ bụ ụzọ Igbo doro anya ma dịkwa eke isi gosipụta njikọ nke ihe kpatara ihe.
- source_word: εἷς ἄρτος
  choice: achịcha ahụ bụ otu
  rationale: ἄρτος nwere ike ịpụta achịcha n’ozuzu ya ma ọ bụ otu ogbe achịcha. Nhazi a na-eme ka ịdị otu ya pụta ìhè ma na-edobe ụda metụtara Nri Anyasị Onyenweanyị.
- source_word: ἓν σῶμα
  choice: otu ahụ
  rationale: Na-edobe ihe atụ Pọl ji ‘ahụ’ kwuo banyere ịdị n’otu nke ndị kwere ekwe, n’etinyeghị nkọwa ozizi karịrị ihe odide ahụ kwuru.
- source_word: οἱ πολλοί ἐσμεν
  choice: anyị bụ́ ọtụtụ bụ
  rationale: Na-echekwa ọdịiche dị n’etiti ọtụtụ ndị na otu ahụ, ma bụrụkwa asụsụ Igbo a pụrụ ịghọta nke ọma.
- source_word: γὰρ
  choice: n’ihi na
  rationale: Na-ewebata nkọwa na ihe kpatara nkwupụta na ndị ahụ bụ otu ahụ.
- source_word: πάντες
  choice: anyị niile
  rationale: Na-ekwusi ike na ndị otu ahụ dum so n’iketa oke ahụ.
- source_word: ἐκ τοῦ ἑνὸς ἄρτου
  choice: n’otu achịcha ahụ
  rationale: N’ebe a ἐκ na-egosi isi iyi e si enweta oke; ‘n’otu achịcha ahụ’ na Igbo na-ekwupụta iketa oke n’ihe a na-eri n’ụzọ eke.
- source_word: μετέχομεν
  choice: na-eketa oke
  rationale: Na-egosi isonye n’ezie na ihe a na-ekerịta, ma na-ezere ime ka okwu ahụ bụrụ naanị iri nri ma ọ bụ ịmanye otu nkọwa sakrament.
theological_decisions:
- issue: Mmekọrịta dị n’etiti otu achịcha ahụ na otu ahụ
  choice: 'E debere njikọ Pọl mere: ọtụtụ ndị bụ otu ahụ n’ihi na ha niile na-eketa oke n’otu achịcha ahụ.'
  alternative: A pụrụ ịsụgharị ya n’ụzọ ga-emesi naanị akara nke ịdị n’otu ike, ma ọ bụ n’ụzọ ga-ekwu hoo haa na achịcha ahụ na-eme ka ịdị n’otu ahụ pụta.
  rationale: Asụsụ Grik jikọtara iketa oke n’otu achịcha ahụ na ịdị n’otu nke ndị kwere ekwe, ma ọ naghị edozi esemokwu ozizi ndị mechara bilie banyere Nri Anyasị Onyenweanyị. Nsụgharị a na-edobe njikọ ahụ na esemokwu nkọwa ya.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E ji ‘na-eketa oke’ chekwaa echiche nke mmekọrịta na isonye, ebe ‘otu ahụ’ na-edobe ihe atụ ahụ n’enweghị itinye ozizi otu ụka pụrụ iche.
