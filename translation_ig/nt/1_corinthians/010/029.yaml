revisions:
- from: Mgbe m kwuru “akọ na uche,” ihe m na-ekwu abụghị nke gị onwe gị, kama ọ bụ nke onye nke ọzọ.[a] N’ihi gịnị ka akọ na uche onye ọzọ ji ekpe nnwere onwe m ikpe?[b]
  to: Ma ọ bụghị akọ na uche gị ka m na-ekwu, kama ọ bụ nke onye ọzọ.[a] N’ihi gịnị kwa ka akọ na uche onye ọzọ ji ekpe nnwere onwe m ikpe?[b]
  rationale: The revision removes the unsupported temporal nuance and quotation marks, supplies a natural Igbo connective for δέ, and retains the contextual second-person interpretation of ἑαυτοῦ. It preserves the ambiguity over the rhetorical question’s speaker in a footnote and places both footnote anchors at their relevant textual units.
