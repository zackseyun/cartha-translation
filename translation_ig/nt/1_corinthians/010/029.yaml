source:
  edition: SBLGNT
  text: συνείδησιν δὲ λέγω οὐχὶ τὴν ἑαυτοῦ ἀλλὰ τὴν τοῦ ἑτέρου· ἱνατί γὰρ ἡ ἐλευθερία μου κρίνεται ὑπὸ ἄλλης συνειδήσεως;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/029.yaml
  text: I mean the other person's conscience[a], not your own[b]. For why is my freedom judged by another conscience?
translation:
  language: ig
  text: Ma ọ bụghị akọ na uche gị ka m na-ekwu, kama ọ bụ nke onye ọzọ.[a] N’ihi gịnị kwa ka akọ na uche onye ọzọ ji ekpe nnwere onwe m ikpe?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'N’ụzọ kwekọrọ nnọọ n’okwu Grik: “ọ bụghị nke ya onwe ya, kama nke onye nke ọzọ.” Ihe gbara okwu ahụ gburugburu na-akwado nghọta bụ́ “ọ bụghị nke gị onwe gị, kama nke onye nke ọzọ.”'
    reason: lexical_alternative
  - marker: b
    text: A pụrụ ịghọta ajụjụ nkwughachi a dị ka ajụjụ Pọl n’onwe ya, ma ọ bụ dị ka mkpesa onye ọzọ ọ na-ekwupụta. Asụsụ Grik enweghị akara nhota doro anya na-egosi mgbanwe onye na-ekwu okwu.
    reason: alternative_reading
lexical_decisions:
- source_word: συνείδησιν / συνειδήσεως
  choice: akọ na uche
  rationale: “Akọ na uche” bụ okwu Igbo a na-ejikarị akọwa ikike dị n’ime mmadụ nke na-enyocha omume ya n’ụzọ gbasara ezi ihe na ihe ọjọọ; ọ dabara n’iji okwu a eme ihe n’akwụkwọ Pọl.
- source_word: δὲ λέγω
  choice: Mgbe m kwuru … ihe m na-ekwu
  rationale: N’ebe a, λέγω na-akọwa ihe Pọl bu n’obi n’okwu bu ụzọ, kama ịbụ nkwupụta ọhụrụ. Nhazi a na-eme ka nkọwa ahụ doo anya n’Igbo, na-agbakwụnyeghị okwu pụtara “ugbu a,” nke na-adịghị n’asụsụ Grik.
- source_word: οὐχὶ τὴν ἑαυτοῦ ἀλλὰ τὴν τοῦ ἑτέρου
  choice: abụghị nke gị onwe gị, kama ọ bụ nke onye nke ọzọ
  rationale: N’agbanyeghị na ἑαυτοῦ dị n’ụdị onye nke atọ n’asụsụ Grik, ihe gbara amaokwu ahụ gburugburu na-egosi na Pọl na-agwa ndị na-agụ akwụkwọ okwu. “Nke gị onwe gị” na “nke onye nke ọzọ” na-eme ka ọdịiche dị n’etiti akọ na uche abụọ ahụ doo anya n’Igbo.
- source_word: ἱνατί γὰρ
  choice: N’ihi gịnị
  rationale: Nke a na-edobe ajụjụ nkwughachi nke ἱνατί ma na-egosikwa njikọ nkọwa nke γάρ n’ụzọ Igbo na-asụkarị.
- source_word: ἐλευθερία
  choice: nnwere onwe
  rationale: “Nnwere onwe” bụ okwu Igbo doro anya ma dị ugbu a maka ikike mmadụ nwere ime ihe n’enweghị mmachi, nke dabara n’arụmụka Pọl banyere ihe kwere ekwe ime.
- source_word: κρίνεται
  choice: ji ekpe … ikpe
  rationale: Okwu a na-egosi na akọ na uche onye ọzọ na-enyocha ma ọ bụ na-ekpebi ihe banyere nnwere onwe Pọl. “Ikpe ikpe” na-edobe nghọta sara mbara nke κρίνω n’ebughị ụzọ kọwaa ya dị ka ikpe ọmụma.
- source_word: ὑπὸ ἄλλης συνειδήσεως
  choice: akọ na uche onye ọzọ
  rationale: Nhọrọ a na-akọwapụta onye na-ekpe ikpe n’ụzọ Igbo sitere n’okike, ma na-edobe echiche nke “akọ na uche ọzọ.”
theological_decisions:
- issue: Onye ἑαυτοῦ na-ezo aka na ya
  choice: A sụgharịrị ya dị ka akọ na uche onye a na-agwa okwu—“nke gị onwe gị.”
  alternative: A pụrụ ịsụgharị ya n’ụzọ nkịtị dị ka “nke ya onwe ya,” nke nwere ike ime ka ọ yie ka ọ na-ezo aka na Pọl ma ọ bụ onye ọzọ.
  rationale: Ọ bụ ezie na ụdị okwu Grik bụ nke onye nke atọ, ọnọdụ okwu ahụ bụ ndụmọdụ Pọl na-enye ndị Kọrịnt banyere akọ na uche onye ọzọ. Nsụgharị bụ isi na-eme ka onye a na-agwa okwu pụta ìhè, ebe nkọwa ala peeji na-echekwa ụdị okwu Grik.
- issue: Onye na-ekwu ajụjụ nkwughachi dị n’ọkara nke abụọ
  choice: A hapụrụ ya dị ka ajụjụ nkwughachi n’enweghị akara na-egosi mgbanwe onye na-ekwu okwu.
  alternative: A pụrụ ịghọta ya dị ka mkpesa onye Kọrịnt Pọl na-ehota, ma ọ bụ dị ka ajụjụ Pọl n’onwe ya.
  rationale: Asụsụ Grik enweghị akara nhota ma ọ bụ ihe doro anya na-egosi na onye na-ekwu okwu agbanweela. Ya mere, nsụgharị ahụ anaghị ekpebi otu nkọwa n’ime ha n’aha onye na-agụ ya.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta, dee ya. E dezigharịrị usoro ahịrịokwu ahụ ntakịrị ka ọ bụrụ Igbo sitere n’okike, ma e chekwara ọdịiche dị n’etiti akọ na uche onye a na-agwa okwu na nke onye ọzọ, yana mgbagwoju anya banyere onye na-ekwu ajụjụ ikpeazụ.
