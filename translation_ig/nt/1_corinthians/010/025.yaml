  text: πᾶν τὸ ἐν μακέλλῳ πωλούμενον ἐσθίετε μηδὲν ἀνακρίνοντες διὰ τὴν συνείδησιν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/025.yaml
  text: Eat whatever is sold in the meat market[a], asking no questions for the sake of conscience,
translation:
  language: ig
  text: Rienụ ihe ọ bụla a na-ere n’ahịa anụ, na-enweghị ịjụ ajụjụ ọ bụla[a] n’ihi akọ na uche.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “na-enweghị ime nchọpụta ọ bụla” ma ọ bụ “na-enweghị inyocha ihe ọ bụla”; ihe ọ pụtara bụ ka unu ghara ịchọ ịmata ebe anụ ahụ si bịa.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶν τὸ ... πωλούμενον
  choice: ihe ọ bụla a na-ere
  rationale: Nkebiokwu a na-arụ ọrụ dị ka aha ma na-egosi ihe niile a na-ere; “ihe ọ bụla a na-ere” bụ Igbo nkịtị ma na-echekwa ike zuru ezu nke πᾶν.
- source_word: ἐν μακέλλῳ
  choice: n’ahịa anụ
  rationale: μάκελλον bụ ahịa a na-ere anụ kpọmkwem, ọ bụghị naanị ahịa n’ozuzu; “ahịa anụ” na-egosi ebe ahụ nke ọma.
- source_word: ἐσθίετε
  choice: Rienụ
  rationale: Ọ bụ iwu dị n’ụdị onye nke abụọ ọtụtụ; “Rienụ” na-enye iwu ahụ ozugbo ma kwekọọ na ndị a na-agwa okwu.
- source_word: μηδὲν ἀνακρίνοντες
  choice: unu ajụla ajụjụ ọ bụla banyere ya
  rationale: ἀνακρίνω nwere ike ịpụta ịjụ ajụjụ, inyocha, ma ọ bụ ime nchọpụta. N’ebe a, okwu ahụ bụ ka a ghara ịchọ ịmata ebe anụ ahụ si bịa; nsụgharị a bụ nke doro anya n’Igbo ma na-edebe ohere nke nkọwa ndị ọzọ na ndetu.
- source_word: διὰ τὴν συνείδησιν
  choice: n’ihi akọ na uche
  rationale: διά na accusative na-egosi ihe kpatara omume ahụ ma ọ bụ ihe a na-eburu n’uche. “N’ihi akọ na uche” dị nkenke ma ghara ịkọwapụta onye akọ na uche ahụ bụ.
theological_decisions:
- issue: Onye “akọ na uche” na-ezo aka na ya
  choice: E dere ya naanị dị ka “akọ na uche,” n’agbanyeghị onye nwe ya.
  alternative: “akọ na uche unu” ma ọ bụ “akọ na uche onye ọzọ”
  rationale: Grik kwuru τὴν συνείδησιν, “akọ na uche ahụ,” ma amaokwu a n’onwe ya akọwaghị onye nwe ya. Ya mere, nsụgharị ahụ na-echekwa nghọtahie ahụ ruo mgbe okwu ndị na-esote mere ka ihe doo anya.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe ma dị ùgwù. E ji ụdị ọtụtụ “Rienụ... unu ajụla” gosipụta na iwu Grik ahụ bụ maka ọtụtụ mmadụ. Akara ndetu [a] dị n’ebe nkebiokwu ọ na-akọwa dị.
