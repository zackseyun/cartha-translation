  to: N’ihi na achọghị m ka unu ghara ịma[a], ụmụnna, na ndị nna anyị niile nọ n’okpuru igwe ojii ahụ, ha niile gafere n’etiti oke osimiri ahụ.
  rationale: 'A gbanwere naanị okwu abụọ iji mee ka Igbo bụrụ nke doro anya ma dị ebumpụta ụwa: “ndị nna anyị” maka οἱ πατέρες ἡμῶν, na “gafere n’etiti oke osimiri ahụ” maka διὰ τῆς θαλάσσης διῆλθον. E debere usoro ajụjụ, njikọ “N’ihi na,” oku “ụmụnna,” na nkwughachi “niile” dịka ihe odide Grik si dị. Ihe odide ala peeji ahụ ka dabara adaba, ọ dịghịkwa mkpa ịgbakwunye nkọwa akụkọ ma ọ bụ nke ozizi.'
