  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Οὐ θέλω ⸀γὰρ ὑμᾶς ἀγνοεῖν, ἀδελφοί, ὅτι οἱ πατέρες ἡμῶν πάντες ὑπὸ τὴν νεφέλην ἦσαν καὶ πάντες διὰ τῆς θαλάσσης διῆλθον,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/001.yaml
  text: For I do not want you to be unaware[a], brothers, that our fathers were all under the cloud, and all passed through the sea,
translation:
  language: ig
  text: N’ihi na achọghị m ka unu ghara ịma[a], ụmụnna, na ndị nna anyị niile nọ n’okpuru igwe ojii ahụ, ha niile gafere n’etiti oke osimiri ahụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’asụsụ Grik, okwu a sụgharịrị ‘ụmụnna’ bụ ụdị okwu ụmụ nwoke, ma a pụrụ iji ya kpọọ ọgbakọ nke ụmụ nwoke na ụmụ nwanyị nọ na ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐ θέλω ... ἀγνοεῖν
  choice: achọghị m ka unu ghara ịma
  rationale: Nke a na-edobe usoro nkwupụta ajụjụ dị n’asụsụ Grik ma na-ekwupụta ya n’Igbo doro anya, kama ịgbanwe ya ka ọ bụrụ naanị ‘achọrọ m ka unu mara.’
- source_word: γὰρ
  choice: N’ihi na
  rationale: Ọ na-ejikọta amaokwu a na arụmụka bu ya ụzọ site n’inye nkọwa ma ọ bụ ihe kpatara ya.
- source_word: ἀδελφοί
  choice: ụmụnna
  rationale: ‘Ụmụnna’ bụ okwu Igbo ebumpụta ụwa e ji akpọ ndị otu okwukwe ọnụ; n’ebe a ọ na-agwa ọgbakọ dum okwu, ma ihe odide Grik jiri ụdị okwu ụmụ nwoke.
- source_word: οἱ πατέρες ἡμῶν
  choice: nna nna anyị
  rationale: Nke a na-edobe okwu ezinụlọ na njikọ Pọl ji jikọta ndị Kọrịnt na akụkọ Izrel, karịa okwu sara mbara dịka ‘ndị nna ochie anyị.’
- source_word: πάντες
  choice: niile ... ha niile
  rationale: E debere nkwughachi πάντες ugboro abụọ n’ihi ike nkwupụta ya n’amaokwu a.
- source_word: ὑπὸ τὴν νεφέλην ἦσαν
  choice: nọ n’okpuru igwe ojii ahụ
  rationale: Ọ na-ezo aka n’igwe ojii nke oge ọpụpụ Izrel ma na-edobe ọnọdụ ‘n’okpuru’ dị n’isi mmalite.
- source_word: διὰ τῆς θαλάσσης διῆλθον
  choice: sikwa n’etiti oke osimiri ahụ gafee
  rationale: ‘Site n’etiti ... gafee’ na-egosipụta ngagharị n’ime ma gafee oke osimiri ahụ, dị ka διά na διέρχομαι si kwuo.
theological_decisions:
- issue: Okwu ἀδελφοί a kpọrọ ọgbakọ nke ndị nwoke na ndị nwanyị nọ na ya
  choice: ụmụnna
  alternative: ụmụnna nwoke na ụmụnna nwanyị
  rationale: ‘Ụmụnna’ na-asụ Igbo nke ọma ma nwee ike ịgụnye ndị otu ezinụlọ ma ọ bụ okwukwe n’ozuzu ha; ihe odide ala peeji kọwara na ụdị okwu Grik bụ nke ụmụ nwoke ma na-agwa ọgbakọ agwakọtara ọnụ.
- issue: Njikọ ọgbakọ nke gụnyere ndị mba ọzọ na akụkọ Izrel n’okwu ‘nna nna anyị’
  choice: nna nna anyị
  alternative: ndị nna ochie anyị
  rationale: Nhọrọ a na-edobe okwu ezinụlọ na ike okwu Pọl ji tinye ndị na-agụ akwụkwọ n’akụkọ Izrel, n’enweghị ịkọwa kpọmkwem ụdị njikọ ahụ karịa ihe odide ahụ.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke oge a ma dị ùgwù. E jiri ‘ụmụnna’ mee ka oku ahụ bụrụ nke ebumpụta ụwa n’Igbo; e debere nkwughachi ‘niile’ na usoro ajụjụ ‘achọghị m ka unu ghara ịma’ iji chekwaa nkwusi okwu nke Grik.
