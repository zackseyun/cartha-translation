base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/015.yaml
  text: I speak as to sensible people[b][a]; judge for yourselves what I say.
translation:
  language: ig
  text: Ana m agwa unu okwu dị ka ndị nwere ezi uche[a]; unu onwe unu kpebie ihe m na-ekwu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịtụgharị ya, “ndị maara ihe” ma ọ bụ “ndị nwere akọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς
  choice: dị ka
  rationale: Ọ na-egosi na Pọl na-agwa ha okwu dịka ndị nwere ikike ịtụle okwu nke ọma.
- source_word: φρονίμοις
  choice: ndị nwere ezi uche
  rationale: Nke a na-egosipụta amamihe bara uru, akọ, na ezi nghọta n'Igbo nke oge a, n'etinyeghị echiche na ha zuru oke n'amamihe.
- source_word: λέγω
  choice: Ana m agwa unu okwu
  rationale: Ụdị a bụ okwu Igbo nkịtị ma doo anya maka Pọl ịgwa ndị na-agụ akwụkwọ okwu kpọmkwem.
- source_word: κρίνατε
  choice: kpebie
  rationale: N'ọnọdụ a, ọ bụ iwu ka ha tụlee okwu ahụ ma ruo ná mkpebi; ‘kpebie’ na-ada nke ọma n'Igbo ma chekwaa ọrụ ikpebi.
- source_word: ὑμεῖς
  choice: unu onwe unu
  rationale: Nnọchiaha ahụ pụtara ìhè na Grik maka imesi okwu ike; ‘unu onwe unu’ na-echekwa mmesi ike ahụ.
- source_word: ὅ
  choice: ihe
  rationale: Ọ na-arụ ọrụ dị ka ihe a na-ekwu maka ya, ya mere ‘ihe ...’ bụ ntụgharị Igbo nkịtị.
- source_word: φημι
  choice: m na-ekwu
  rationale: Ọ na-echekwa echiche nke ikwu ma ọ bụ ịkwupụta n'ụzọ dị nkenke ma bụrụ Igbo nkịtị.
theological_decisions:
- issue: Ụzọ Pọl si kọwaa ndị ọ na-agwa okwu
  choice: A tụgharịrị ya dịka ịgwa ndị nwere ezi uche, n'ekwughị na Pọl kwadoro omume ha niile.
  alternative: A pụrụ ịghọta ya dịka ịkpọ ha ndị maara ihe, ma ọ bụ dịka okwu e ji akaja ha.
  rationale: Grik nwere ike ịbụ okwu kpọmkwem ma ọ bụ nwee ụda nkwulu dabere n'ọnọdụ ya. Nsụgharị ahụ ahọpụtaghị otu n'ime nghọta ndị ahụ n'ụzọ ga-emechi nke ọzọ.
translation_notes:
  register: Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-echekwa mmesi ike dị na ὑμεῖς site n'iji ‘unu onwe unu,’ ma jiri ‘ndị nwere ezi uche’ mee ka echiche nke φρόνιμος bụrụ nke bara uru ma ghara ịkọwa ya gabiga ókè.
