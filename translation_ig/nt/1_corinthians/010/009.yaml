- from: Ka anyị gharakwa ịnwale Mesaịa[a], dị ka ụfọdụ n’ime ha nwara ya, agwọ wee na-egbu ha.
  to: Ka anyị gharakwa ịnwa Mesaịa ule[a], dị ka ụfọdụ n’ime ha nwalere ya ule, agwọ wee na-egbu ha.
  rationale: The revision clarifies that both clauses concern putting the Messiah to the test, not merely testing in a neutral sense, while maintaining the hortatory prohibition, the SBLGNT reading “Mesaịa,” and the ongoing destruction caused by snakes. The footnote’s variant title has been standardized orthographically.
  reviewer_model: gpt-5.6-terra
