id: 1CO.10.9
reference: 1 Corinthians 10:9
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: μηδὲ ἐκπειράζωμεν τὸν ⸀Χριστόν, ⸀καθώς τινες αὐτῶν ἐπείρασαν, καὶ ὑπὸ τῶν ὄφεων ⸀ἀπώλλυντο.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/009.yaml
  text: Nor should we put Messiah to the test[b][a], as some of them tested him and were being destroyed by the snakes.
translation:
  language: ig
  text: Ka anyị gharakwa ịnwa Mesaịa ule[a], dị ka ụfọdụ n’ime ha nwalere ya ule, agwọ wee na-egbu ha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ụfọdụ akwụkwọ aka ochie nwere “Onyenwe anyị” kama “Mesaịa” (ma ọ bụ “Kraịst”).
    reason: textual_variant
lexical_decisions:
- source_word: μηδὲ
  choice: Ka anyị gharakwa
  rationale: Ọ na-aga n’ihu n’usoro ịdọ aka ná ntị dị n’amaokwu ndị a ma na-edowe ụdị agbamume nke ngwaa Grik.
- source_word: ἐκπειράζωμεν
  choice: ịnwale ...
  rationale: Nke a na-egosi ile onye ahụ ule n’ụzọ na-ekwesịghị ekwesị; ‘ịnwale’ doro anya karịa okwu nwere ike ịpụta naanị ịrata mmadụ ime mmehie.
- source_word: τὸν Χριστόν
  choice: Mesaịa
  rationale: Χριστός bụ utu aha n’ebe a; ‘Mesaịa’ na-ebute ihe utu aha ahụ pụtara kama ime ya ka ọ bụrụ naanị aha mmadụ.
- source_word: καθώς
  choice: dị ka
  rationale: Ọ na-ejikọta ịdọ aka ná ntị ahụ na ihe mere ụmụ Izrel n’ọzara.
- source_word: τινες αὐτῶν
  choice: ụfọdụ n’ime ha
  rationale: Ọ na-ezo aka n’ụfọdụ ndị nọ n’etiti ọgbọ Izrel ahụ.
- source_word: ἐπείρασαν
  choice: nwara ya
  rationale: Ọ na-egosi ihe ha mere n’oge gara aga, ebe onye a nwalere ka a ghọtara site n’ahịrịokwu bu ya ụzọ.
- source_word: ὑπὸ τῶν ὄφεων
  choice: agwọ
  rationale: ‘Agwọ’ bụ okwu Igbo nkịtị ma doo anya maka ὄφεις; ọ na-ekpuchikwa echiche Bekee nke ‘snakes’ na ‘serpents,’ ya mere nkọwa ụkwụ ọzọ adịghị mkpa.
- source_word: ἀπώλλυντο
  choice: wee na-egbu ha
  rationale: Ụdị ‘na-egbu’ na-egosipụta omume na-aga n’ihu nke imperfect Grik, ma na-edowe agwọ dịka ndị kpatara ọnwụ ahụ.
theological_decisions:
- issue: Onye τὸν Χριστόν na-ezo aka na ọdịiche dị n’akwụkwọ aka ochie
  choice: Mesaịa
  alternative: Onyenweanyị
  rationale: Ederede SBLGNT họọrọ Χριστόν, ya mere isi ederede sụgharịrị ya dịka utu aha ‘Mesaịa’ ma ghara izochi njikọ Pọl mere n’etiti Mesaịa na onye Izrel nwalere n’ọzara. E debere ọgụgụ ‘Onyenweanyị’ nke akwụkwọ aka ochie ụfọdụ n’okpuru peeji.
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta. ‘Ka anyị gharakwa’ na-edowe agbamume na usoro mmachibido iwu; ‘wee na-egbu ha’ na-eme ka omume na-aga n’ihu pụta ìhè. A hapụrụ nkọwa ụkwụ Bekee banyere ‘snakes/serpents’ n’ihi na ha abụọ bụ ‘agwọ’ n’Igbo, ya mere ọdịiche ahụ anaghị arụ ọrụ n’asụsụ a.
