  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ταῦτα ⸀δὲ ⸂τυπικῶς συνέβαινεν⸃ ἐκείνοις, ἐγράφη δὲ πρὸς νουθεσίαν ἡμῶν, εἰς οὓς τὰ τέλη τῶν αἰώνων ⸀κατήντηκεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/011.yaml
  text: These things happened to them as examples[a], but they were written for our instruction[c][b], on whom the ends of the ages have come.
translation:
  language: ig
  text: Ihe ndị a mere ha dị ka ihe atụ[a], ma e dere ha maka ịdọ anyị aka ná ntị[b], bụ́ anyị ndị ngwụcha nke oge dị iche iche ruteworo[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “dị ka ụkpụrụ” ma ọ bụ “n’ụzọ ihe atụ”; Pọl na-egosi na ihe ndị a mere bụ ụkpụrụ nwere ihe ha na-akụziri ndị kwere ekwe bịara mgbe e mesịrị.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “iji gbazie anyị” ma ọ bụ “iji kụziere anyị ihe”; okwu Grik ahụ gụnyere ma nkuzi na-agbazi mmadụ ma ịdọ aka ná ntị.
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “ngwụcha nke oge eruola anyị.” N’asụsụ Grik, ma “ngwụcha” ma “oge” dị n’ọnụọgụ ọtụtụ; nsụgharị dị n’elu na-echekwa otú Pọl si kwuo ya banyere akụkọ nzọpụta.
    reason: alternative_reading
lexical_decisions:
- source_word: τυπικῶς
  choice: dị ka ihe atụ
  rationale: Nke a na-egosi na ihe ndị ahụ mere bụ ụkpụrụ ma ọ bụ ihe atụ nwere ihe ha na-akụziri ndị kwere ekwe bịara mgbe e mesịrị. Okwu a doro ndị na-agụ Igbo nke oge a anya karịa okwu nkà mmụta pụrụ iche.
- source_word: συνέβαινεν
  choice: mere
  rationale: Ụdị ngwaa Grik ahụ na-ekwu banyere ihe ndị na-eme n'oge gara aga. “Mere” bụ ụzọ Igbo dị mfe ma bụrụkwa nke ebumpụta ụwa isi kwuo ya; “ihe ndị a” na-egosikwa na ọ bụ ọtụtụ ihe.
- source_word: ἐκείνοις
  choice: ha
  rationale: Ọ na-ezo aka n’ọgbọ Izrel nọ n’ọzara nke a kọwara n’amaokwu ndị bu ụzọ.
- source_word: ἐγράφη
  choice: e dere ha
  rationale: Ọ na-egosi na e debere akụkọ banyere ihe ndị ahụ n’Akwụkwọ Nsọ. Nnọchiaha “ha” na-ezo aka n’“ihe ndị a” n’ụzọ Igbo si ekwu okwu nke ọma.
- source_word: πρὸς νουθεσίαν
  choice: iji dọọ anyị aka ná ntị
  rationale: νουθεσία gụnyere nkuzi na-agbazi mmadụ nakwa ịdọ aka ná ntị. Nhọrọ a bụ okwu Igbo e ji eme ihe ugbu a ma na-edobe ike nke ịma mmadụ ọkwa dị n’amaokwu a.
- source_word: εἰς οὓς
  choice: anyị bụ ndị ... bịakwasịrị
  rationale: Nhazi a na-egosi na ihe gbasara ọgwụgwụ oge ahụ erutela ndị Pọl na-agwa okwu ma nwee mmetụta n’ebe ha nọ.
- source_word: τὰ τέλη τῶν αἰώνων
  choice: ọgwụgwụ nke oge dị iche iche
  rationale: A na-edobe ọtụtụ n’ọnụọgụ dị na τέλη na αἰώνων, kama ime ka okwu Pọl bụrụ naanị otu ọgwụgwụ nke otu oge.
- source_word: κατήντηκεν
  choice: bịakwasịrị
  rationale: Oge ngwaa zuru oke n’asụsụ Grik na-egosi ọbịbịa merela ma ka metụtara ndị a na-ekwu banyere ha. “Bịakwasịrị” na-ekwupụta echiche nke ihe rutere mmadụ ma nọkwasị ya.
theological_decisions:
- issue: Okwu Pọl banyere akụkọ nzọpụta, τὰ τέλη τῶν αἰώνων
  choice: ọgwụgwụ nke oge dị iche iche bịakwasịrị
  alternative: ọgwụgwụ nke oge abịakwasịla
  rationale: A hapụrụ “ọgwụgwụ” na “oge” n’echiche ọtụtụ dị ka Grik si dị. Nke a na-echekwa esemokwu dị n’okwu Pọl banyere ọgwụgwụ nke bịarala ma ghara ịkọwa ya karịa ihe odide ahụ kwuru.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta, sụgharịa amaokwu ahụ. E zere okwu nkà mmụta pụrụ iche n’ahịrị bụ isi, ebe nkọwa ala peeji na-echekwa nhọrọ ndị ọzọ na nghọta pụrụ iche nke okwu Grik.
