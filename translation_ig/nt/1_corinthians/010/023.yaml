base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/023.yaml
  text: “All things are permitted,” but not all things are beneficial[a]. “All things are permitted,” but not all things build up.
translation:
  language: ig
  text: “E kwere ka e mee ihe niile,” ma ọ bụghị ihe niile bara uru.[a] “E kwere ka e mee ihe niile,” ma ọ bụghị ihe niile na-ewuli elu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “Iwu kwere ka e mee ihe niile.” Okwu Grik ahụ nwere ike ịpụta ihe e kwere ka e mee ma ọ bụ ihe iwu kwadoro. Akara okwu ndị a na-egosi na o yiri ka ọ bụ okwu ndị Kọrịnt na-ekwukarị, nke Pọl na-etinye ókè na ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάντα
  choice: Ihe niile
  rationale: Okwu a bụ adjective neuter plural e ji mee ihe dị ka noun; “Ihe niile” na-edobe obosara na nkwughachi nke okwu Grik ahụ n’Igbo nkịtị.
- source_word: ἔξεστιν
  choice: kwere ekwe
  rationale: Ọ na-egosi ihe e kwere ka e mee ma ọ bụ ihe iwu na-adịghị egbochi. “Kwere ekwe” dị nkenke ma kwekọọ n'ụdị okwu a na-ekwughachi; nkọwa ala peeji na-edobe echiche ọzọ nke ịdị n'iwu.
- source_word: ἀλλ’
  choice: ma
  rationale: “Ma” na-egosi ọdịiche dị nkenke ma doo anya n'etiti nkwupụta ahụ na ihe Pọl ji gbochie ya.
- source_word: συμφέρει
  choice: bara uru
  rationale: Ngwaa ahụ pụtara ihe na-enye aka ma ọ bụ bara mmadụ uru; okwu a bụ Igbo eke, ọ naghịkwa eme ka echiche ahụ bụrụ naanị uru ego.
- source_word: οἰκοδομεῖ
  choice: na-ewuli elu
  rationale: Nke a na-edobe ihe atụ ụlọ nke okwu Grik ahụ, ma n'ọnọdụ a ọ na-ezo aka n'ịkwado na iwusi ndị ọzọ ma ọ bụ ọgbakọ ike.
theological_decisions:
- issue: Ma a ga-egosi Πάντα ἔξεστιν dị ka okwu ndị Kọrịnt na-ekwu
  choice: 'E tinyere ya n''akara okwu: “Ihe niile kwere ekwe”'
  alternative: Ịhapụ akara okwu ma gụọ ya dị ka nkwupụta Pọl n'onwe ya
  rationale: Ọtụtụ ihe na-egosi na nke a nwere ike ịbụ okwu ndị Kọrịnt na-ekwukarị nke Pọl na-etinye ókè na ya. Ebe ihe odide Grik ochie na-enweghị akara okwu nke oge a, nke a bụ mkpebi ntụgharị, ọ bụghị ọdịiche dị n'ihe odide; nkọwa ala peeji na-echekwa nghọta ọzọ.
translation_notes:
  register: Asụsụ Igbo Izugbe, nke oge a ma dị ùgwù. E ji ahịrịokwu abụọ nwere otu nhazi debe nkwughachi na ụda okwu Grik ahụ; e dokwara ihe atụ “iwuli elu” anya kama ịgbanwe ya ka ọ bụrụ nkọwa denominational.
