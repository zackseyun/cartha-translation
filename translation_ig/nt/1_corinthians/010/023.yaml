    reason: lexical_alternative
  revision_rationale: The revision makes the central permission expression unambiguous and idiomatic in Standard Igbo, while preserving the repeated slogan-like form, the likely but non-certain quotation punctuation, and the source text’s concise contrasts. No doctrinal interpretation has been added.
