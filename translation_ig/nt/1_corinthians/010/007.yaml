revisions:
- from: Unu aghọkwala ndị na-efe arụsị, dị ka ụfọdụ n’ime ha ghọrọ; dị nnọọ ka e dere ya, sị, “Ndị ahụ nọdụrụ ala iri ihe na ịṅụ ihe, ha ebiliekwa igwuri egwu.[a]”
  to: Unu aghọkwala ndị na-efe arụsị, dị ka ụfọdụ n’ime ha ghọrọ; dị nnọọ ka e dere ya, sị, “Ndị mmadụ ahụ nọdụrụ ala iri ihe na ịṅụ ihe, ha wee bilie ka ha gwurie egwu.[a]”
  rationale: The revision preserves the Greek warning, its comparison with some Israelites, and the citation formula. It retains “igwuri egwu” in the main text so as not to resolve παίζειν beyond what the wording states, while the footnote offers a natural contextual alternative and identifies the Exodus setting.
