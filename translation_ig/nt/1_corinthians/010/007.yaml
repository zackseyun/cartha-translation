review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders the prohibition against becoming idolaters and retains the quotation's deliberately broad παίζειν as “igwuri egwu.” However, the quoted final clause needs a more idiomatic Igbo construction for the Greek purpose infinitive.
  naturalness: “Ha ebiliekwa igwuri egwu” is not fully natural Standard Igbo; “ha wee bilie ka ha gwurie egwu” clearly expresses that they rose in order to play. “Ndị mmadụ ahụ” is also a more natural and explicit rendering of ὁ λαός than “Ndị ahụ.” The footnote alternative “emume mkpọtụ” is not a precise or idiomatic equivalent of revelry.
  terminology: “ndị na-efe arụsị” is clear, standard, and faithful for εἰδωλολάτραι. The main-text “igwuri egwu” appropriately preserves lexical and contextual ambiguity; the footnote may indicate festive revelry without asserting a more specific kind of conduct.
  issues:
  - severity: medium
    issue: The quotation's final clause is grammatically awkward in Igbo.
    rationale: The Greek ἀνέστησαν παίζειν means that the people rose to play. Recasting it as “ha wee bilie ka ha gwurie egwu” is idiomatic while preserving the narrative sequence and purposive sense.
  - severity: low
    issue: “Ndị ahụ” underspecifies ὁ λαός in the citation.
    rationale: “Ndị mmadụ ahụ” explicitly conveys “the people” and reads naturally in Standard Igbo.
  - severity: low
    issue: The footnote's “emume mkpọtụ” is an imprecise alternative for revelry.
    rationale: Mkpọtụ chiefly denotes noise or disturbance. “mee emume ọṅụ” conveys celebratory/reveling activity more naturally, while the explanatory sentence supplies the idolatrous context.
  revised_text: Unu aghọkwala ndị na-efe arụsị, dị ka ụfọdụ n’ime ha ghọrọ; dị nnọọ ka e dere ya, sị, “Ndị mmadụ ahụ nọdụrụ ala iri ihe na ịṅụ ihe, ha wee bilie ka ha gwurie egwu.[a]”
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “ha bilie mee emume ọṅụ.” Okwu a e hotara sitere n’Ọpụpụ 32:6, ebe “igwuri egwu” ahụ jikọtara ya na oriri ofufe arụsị ndị Izrel mere gburugburu nwa ehi ọlaedo.
    reason: lexical_alternative
  revision_rationale: The revision preserves the Greek warning, its comparison with some Israelites, and the citation formula. It retains “igwuri egwu” in the main text so as not to resolve παίζειν beyond what the wording states, while the footnote offers a natural contextual alternative and identifies the Exodus setting.
