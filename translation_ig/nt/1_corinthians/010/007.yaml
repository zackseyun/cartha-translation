source:
  edition: SBLGNT
  text: μηδὲ εἰδωλολάτραι γίνεσθε, καθώς τινες αὐτῶν· ὥσπερ γέγραπται· Ἐκάθισεν ὁ λαὸς φαγεῖν καὶ πεῖν, καὶ ἀνέστησαν παίζειν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/007.yaml
  text: Do not become idolaters[a], as some of them were; just as it is written, “The people sat down to eat and drink, and rose up to play.”
translation:
  language: ig
  text: Unu aghọkwala ndị na-efe arụsị, dị ka ụfọdụ n’ime ha ghọrọ; dị nnọọ ka e dere ya, sị, “Ndị mmadụ ahụ nọdụrụ ala iri ihe na ịṅụ ihe, ha wee bilie ka ha gwurie egwu.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ha bilie mee emume ọṅụ.” Okwu a e hotara sitere n’Ọpụpụ 32:6, ebe “igwuri egwu” ahụ jikọtara ya na oriri ofufe arụsị ndị Izrel mere gburugburu nwa ehi ọlaedo.
    reason: lexical_alternative
lexical_decisions:
- source_word: μηδὲ
  choice: Unu ... kwala
  rationale: E ji usoro mmachibido omume nke Igbo gosipụta iwu na-adịghị mma a, ebe Pọl na-aga n’ihu n’usoro ịdọ aka ná ntị.
- source_word: εἰδωλολάτραι
  choice: ndị na-efe arụsị
  rationale: Nke a bụ okwu Igbo doro anya ma bụrụ nke mmadụ niile nwere ike ịghọta maka ndị na-ekpere ma ọ bụ na-efe arụsị.
- source_word: γίνεσθε
  choice: aghọkwala
  rationale: Ọ na-echekwa echiche nke ịghọ ma ọ bụ ịbanye n’omume ahụ, kama ikwu nanị ọnọdụ mmadụ nọ na ya.
- source_word: τινες αὐτῶν
  choice: ụfọdụ n’ime ha
  rationale: Ọ na-ezo aka n’ụfọdụ ndị Izrel n’akụkọ ọzara ahụ, na-enweghị ime ka ọ bụrụ ha niile.
- source_word: ὥσπερ γέγραπται
  choice: dị nnọọ ka e dere ya, sị
  rationale: Ọ na-echekwa ike ntụnyere ahụ na usoro e ji akpọpụta ihe e dere n’Akwụkwọ Nsọ.
- source_word: Ἐκάθισεν ὁ λαὸς
  choice: Ndị ahụ nọdụrụ ala
  rationale: Ọ na-asụgharị λαός dị ka ìgwè mmadụ ahụ ma na-enye nkebiokwu sitere n’Ọpụpụ n’ụzọ Igbo dị mma.
- source_word: φαγεῖν καὶ πεῖν
  choice: iri ihe na ịṅụ ihe
  rationale: Ọ na-echekwa ngwaa abụọ ahụ n’ụzọ kpọmkwem ma bụrụ Igbo eke.
- source_word: ἀνέστησαν
  choice: ha ebiliekwa
  rationale: Ọ na-egosi mmegharị akụkọ ahụ site n’ịnọdụ ala ruo n’ibili.
- source_word: παίζειν
  choice: igwuri egwu
  rationale: Nke a na-echekwa isi okwu sara mbara nke ngwaa Grik ahụ na okwu e hotara n’Ọpụpụ, kama ịkọwa kpọmkwem ụdị emume ahụ n’ahịrị bụ isi.
theological_decisions:
- issue: Otu a ga-esi sụgharị παίζειν n’okwu e hotara n’Ọpụpụ 32:6
  choice: igwuri egwu n’ahịrị bụ isi, tinyere nkọwa ala peeji
  alternative: ịṅụrị ọṅụ n’emume mkpọtụ ma ọ bụ ime emume aghara
  rationale: Ngwaa ahụ nwere ike ịpụta igwuri egwu, ma gburugburu akụkọ ahụ na-ejikọta ya na emume ofufe arụsị n’ihu nwa ehi ọlaedo. Ahịrị bụ isi na-echekwa obosara okwu Grik ahụ; nkọwa ala peeji na-egosi ihe ọnọdụ akụkọ ahụ nwere ike ịpụta.
translation_notes:
  register: Standard Igbo nke oge a, dị ùgwù ma doo ndị nkịtị anya. E jiri “ndị na-efe arụsị” mee ka okwu ahụ ghọta ngwa ngwa; e debere mgbagwoju anya dị na παίζειν site na ahịrị bụ isi na nkọwa ala peeji.
