  text: ὥστε ὁ δοκῶν ἑστάναι βλεπέτω μὴ πέσῃ,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/012.yaml
  text: Therefore[a], let the one who thinks he stands watch out lest he fall.
translation:
  language: ig
  text: Ya mere[a], onye na-eche na ọ na-eguzo, ya lezie anya ka ọ ghara ịda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “N’ihi ya, onye ọ bụla na-eche na ọ na-eguzo kwesịrị ịkpachara anya ka ọ ghara ịda.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: Ya mere
  rationale: Njikọ a na-egosi nkwubi okwu sitere n’ihe atụ ịdọ aka ná ntị ndị bu ụzọ; “Ya mere” bụ okwu Igbo doro anya nke na-echekwa ike nkwubi okwu ahụ.
- source_word: ὁ δοκῶν
  choice: onye chere
  rationale: Participu a nwere artikulu na-arụ ọrụ dị ka aha ma na-ezo aka n’otu onye n’ụzọ nnọchianya; “onye chere” bụ Igbo nkịtị ma ghara ịgbasa ihe okwu ahụ pụtara.
- source_word: ἑστάναι
  choice: na ọ kwụ
  rationale: Infinitivu zuru oke nke ἵστημι na-egosi ọnọdụ nke mmadụ nọ n’ịkwụ; “na ọ kwụ” na-echekwa ihe oyiyi ahụ n’etinyeghị echiche ọzọ dị ka “kwụsie ike.”
- source_word: βλεπέτω
  choice: ya lezie anya
  rationale: Imperativu ugbu a na-akpọ mmadụ ka ọ nọgide na-amụ anya; “ya lezie anya” bụ ịdọ aka ná ntị doro anya, dịkwa ugwu n’Igbo.
- source_word: μὴ πέσῃ
  choice: ka ọ ghara ịda
  rationale: μή tinyere subjunctivu aorist mgbe imperativu gasịrị na-egosi ebumnuche na-adịghị mma ma ọ bụ ịdọ aka ná ntị; “ka ọ ghara ịda” bụ usoro Igbo sitere n’okike nke na-echekwa ụda ịdọ aka ná ntị ahụ.
theological_decisions:
- issue: Ihe “ịda” pụtara n’ịdọ aka ná ntị Pọl
  choice: E debere okwu sara mbara bụ “ịda” n’akọwaghị ma ọ bụ ịhapụ okwukwe, ịdaba ná mmehie, ma ọ bụ ịdaba n’ikpe metụtara ikpere arụsị.
  alternative: ịdaba ná mmehie; ịdaba n’ikpe; ịhapụ okwukwe
  rationale: Ọnọdụ gbara amaokwu ahụ gburugburu na-adọ aka ná ntị megide ntụkwasị obi gabigara ókè site n’ihe mere Izrel, ma πέσῃ n’onwe ya akọwaghị kpọmkwem ụdị ọdịda ahụ. Okwu “ịda” na-echekwa nghọtahie ziri ezi na esemokwu nkà mmụta okpukpe dị na isi mmalite ahụ.
- issue: Okwu nwoke otu onye nke na-anọchi anya mmadụ niile
  choice: E jiri “onye ... ọ ... ọ” mee ka otu onye dị na Grik pụta, ebe ọ ka na-arụ ọrụ dịka onye nnọchianya nke onye ọ bụla.
  alternative: ndị chere na ha kwụ; onye ọ bụla chere na ha kwụ
  rationale: Grik ahụ bụ otu onye n’usoro ụtọasụsụ ma na-arụ ọrụ nnọchianya. Igbo “onye ... ọ” na-echekwa otu onye ahụ n’enweghị mkpa ịkpọpụta okike nwoke ebe usoro nnochiaha Igbo anaghị ekewa nwoke na nwanyị.
translation_notes:
  register: Igbo ọkọlọtọ, nke oge a, dị mfe nghọta ma nwee ugwu. A họọrọ “kwụ” n’amaokwu bụ isi iji chekwaa nkenke na ihe oyiyi Grik; ihe odide ala ala peeji nyere usoro ọzọ bụ “na-eguzo.”
