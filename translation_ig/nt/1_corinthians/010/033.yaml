source:
  edition: SBLGNT
  text: καθὼς κἀγὼ πάντα πᾶσιν ἀρέσκω, μὴ ζητῶν τὸ ἐμαυτοῦ ⸀σύμφορον ἀλλὰ τὸ τῶν πολλῶν, ἵνα σωθῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/033.yaml
  text: just as I also please everyone in everything[a], not seeking my own advantage but that of the many[b], so that they may be saved.
translation:
  language: ig
  text: Dị ka mụ kwa na-eme ihe na-atọ mmadụ niile ụtọ n'ihe niile[a], na-achọghị uru nke m, kama uru nke ọtụtụ mmadụ[b], ka e wee zọpụta ha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ihe niile nye mmadụ niile.” N'ụzọ nkịtị karị, Grik sịrị “mmadụ niile n'ihe niile,” nke na-egosi ime mgbanwe n'ụzọ sara mbara maka ọdịmma ndị ọzọ.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ọdịmma nke m ... ọdịmma nke ọtụtụ mmadụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς κἀγὼ
  choice: dị nnọọ ka mụ onwe m
  rationale: Na-egosi ntụnyere ahụ na ihe e kwuru n'amaokwu bu ụzọ, ma mee ka ihe nlereanya Pọl pụta ìhè.
- source_word: πάντα πᾶσιν ἀρέσκω
  choice: na-emekwa ihe na-atọ mmadụ niile ụtọ n'ihe niile
  rationale: Na-echekwa obosara nke okwu Grik, ‘onye ọ bụla n'ihe niile,’ ebe ọ na-ada ka Igbo e ji eme ihe ugbu a; ihe sochirinụ na-akọwa na nke a bụ ime ihe maka ọdịmma ha, ọ bụghị ịja mmadụ mma.
- source_word: μὴ ζητῶν
  choice: na-achọghị
  rationale: Na-egosipụta omume na ebumnuche na-eso ihe Pọl na-eme n'ụzọ dị mkpirikpi ma bụrụ Igbo eke.
- source_word: τὸ ἐμαυτοῦ σύμφορον
  choice: uru nke m
  rationale: ‘Uru’ na-eburu echiche nke ihe bara mmadụ uru ma ọ bụ nke ga-enyere ya aka, ma chekwaa ọdịiche dị n'etiti uru Pọl na nke ọtụtụ mmadụ.
- source_word: ἀλλὰ τὸ τῶν πολλῶν
  choice: kama uru nke ọtụtụ mmadụ
  rationale: E mejupụtara ahịrịokwu elliptical nke Grik n'ụzọ doro anya n'Igbo, ma chekwaa kpọmkwem echiche ‘ọtụtụ mmadụ’ kama ịgbanwe ya ka ọ bụrụ naanị ‘ndị ọzọ.’
- source_word: ἵνα σωθῶσιν
  choice: ka e wee zọpụta ha
  rationale: Na-echekwa ebumnuche nke ἵνα na olu nnara nke ngwaa ahụ, n'agbanyeghị na a kpọghị onye na-azọpụta aha.
theological_decisions:
- issue: Oke na nghọta nke σωθῶσιν
  choice: ka e wee zọpụta ha
  alternative: ka e wee nyere ha aka / chebe ha
  rationale: N'ebe a, ọnọdụ ozi ọma na ojiji Pọl na-eji σῴζω na-akwado nzọpụta n'echiche ime mmụọ na nke ikpeazụ; olu nnara ahụ ka echekwara n'ekwughị onye na-eme ya kpọmkwem.
- issue: Ihe ‘ime ihe na-atọ mmadụ ụtọ’ pụtara
  choice: ime mgbanwe n'omume maka ọdịmma ndị ọzọ
  alternative: ịchọ otuto ma ọ bụ nkwado mmadụ
  rationale: Nkebi na-esote—na ọ naghị achọ uru nke ya kama nke ọtụtụ mmadụ—na-achịkwa nghọta okwu ahụ ma gbochie ịghọta ya dị ka ime ihe na-amasị mmadụ n'ụzọ na-emebi eziokwu.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E jiri ‘uru’ mee ka ahịrịokwu ahụ dị nkenke ma kwekọọ n'okwu nkịtị; ndetu ala peeji na-enye ‘ọdịmma’ dị ka ụzọ ọzọ. Akara ndetu [a] na [b] dị n'ahịrịokwu isi.
