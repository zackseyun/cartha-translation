id: 1CO.10.31
reference: 1 Corinthians 10:31
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Εἴτε οὖν ἐσθίετε εἴτε πίνετε εἴτε τι ποιεῖτε, πάντα εἰς δόξαν θεοῦ ποιεῖτε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/031.yaml
  text: Therefore, whether you eat or drink, or whatever you do, do everything for the glory of God.
translation:
  language: ig
  text: Ya mere, ma unu na-eri, ma unu na-aṅụ, ma ọ bụ ihe ọ bụla unu na-eme, meenụ ihe niile maka otuto Chineke.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εἴτε ... εἴτε ... εἴτε
  choice: ma ... ma ... ma ọ bụ
  rationale: Usoro njikọ a na-egosi ọnọdụ dị iche iche. N'Igbo, “ma ... ma ... ma ọ bụ” na-edobe usoro okwu ahụ ma na-ada nke ọma n'asụsụ a na-asụ ugbu a.
- source_word: οὖν
  choice: Ya mere
  rationale: Ọ na-egosi nkwubi okwu Pọl wepụtara site n'ihe ọ kọwara tupu amaokwu a.
- source_word: ἐσθίετε
  choice: unu na-eri nri
  rationale: Oge ugbu a ebe a na-ekwu maka omume n'ozuzu ya, ọ bụghị naanị ihe a na-eme n'otu oge kpọmkwem. Ịtinye “nri” na-eme ka okwu Igbo doo anya ma bụrụ nke e ji eme ihe.
- source_word: πίνετε
  choice: unu na-aṅụ ihe ọṅụṅụ
  rationale: Dị ka ἐσθίετε, ọ na-ekwu maka omume n'ozuzu ya. “Ihe ọṅụṅụ” na-enye ngwaa ahụ mmeju zuru oke n'Igbo.
- source_word: τι
  choice: ihe ọ bụla
  rationale: N'ime usoro a, okwu a na-agbasapụ ihe a na-ekwu karịa iri nri na ịṅụ ihe ọṅụṅụ.
- source_word: ποιεῖτε
  choice: unu na-eme / meenụ
  rationale: Okwu Grik a sara mbara ma na-ezo aka n'omume ọ bụla. N'ahịrị nke mbụ a sụgharịrị ya dịka nkwupụta izugbe, ma n'ahịrị bụ isi dịka iwu ma ọ bụ agbamume.
- source_word: πάντα
  choice: ihe niile
  rationale: Ọ na-egosi oke zuru ezu ma na-ada n'ụzọ ebumpụta ụwa n'Igbo nke oge a.
- source_word: εἰς δόξαν
  choice: iji nye ... otuto
  rationale: εἰς na-egosi ebumnuche ma ọ bụ ihe omume ahụ na-elekwasị anya na ya. Usoro a na-eme ka ebumnuche ahụ doo anya n'Igbo n'ebughị echiche ọzọ abata.
- source_word: θεοῦ
  choice: Chineke
  rationale: Ọ na-egosi onye otuto ahụ bụ nke ya; n'usoro Igbo a họọrọ, a na-egosipụta njikọ ahụ site na “nye Chineke otuto.”
theological_decisions:
- issue: Oke agbamume Pọl
  choice: 'Agbamume zuru ụwa ọnụ: e kwesịrị ime ka omume niile, tinyere omume nkịtị, nye Chineke otuto.'
  alternative: Ịghọta ya dịka ntụziaka metụtara naanị okwu iri nri na ịṅụ ihe ọṅụṅụ.
  rationale: Ọ bụ ezie na amaokwu ahụ sitere n'arụmụka banyere nri na ihe ọṅụṅụ, “ihe ọ bụla unu na-eme” na “ihe niile” na-agbasapụ ụkpụrụ ahụ ruo n'omume niile.
- issue: Ihe εἰς δόξαν θεοῦ pụtara
  choice: “iji nye Chineke otuto,” nke na-egosi ebumnuche ma ọ bụ ntụziaka nke omume ahụ.
  alternative: “maka ebube Chineke,” nke pụrụ imesi ịdị ebube Chineke ike karịa omume mmadụ nke na-ewetara ya otuto.
  rationale: Okwu Grik δόξα nwere ike ịbụ “otuto” ma ọ bụ “ebube.” N'okwu agbamume a, “nye Chineke otuto” na-ekwupụta ebumnuche nke omume ahụ n'ụzọ doro anya, ma ọ naghị ekwu na mmadụ na-emepụta ịdị ebube Chineke.
translation_notes:
  register: Standard Igbo; asụsụ dị ugbu a, dị ugwu, ma dị mfe nghọta. E ji “unu” debe onye nke abụọ n'ụbara dị na ngwaa Grik, e jikwara “meenụ” gosipụta ike agbamume dị na isi ahịrịokwu.
