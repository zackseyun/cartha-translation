revisions:
- from: Ya mere, ma unu na-eri nri, ma unu na-aṅụ ihe ọṅụṅụ, ma ọ bụ ihe ọ bụla unu na-eme, meenụ ihe niile iji nye Chineke otuto.
  to: Ya mere, ma unu na-eri, ma unu na-aṅụ, ma ọ bụ ihe ọ bụla unu na-eme, meenụ ihe niile maka otuto Chineke.
  rationale: The revision retains the plural address, the alternative rhetorical structure, and the universal exhortation. It renders εἰς δόξαν θεοῦ with the more source-near and idiomatic “maka otuto Chineke,” while avoiding additions not required by the Greek.
  reviewer_model: gpt-5.6-terra
