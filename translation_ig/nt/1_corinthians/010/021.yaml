id: 1CO.10.21
reference: 1 Corinthians 10:21
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οὐ δύνασθε ποτήριον κυρίου πίνειν καὶ ποτήριον δαιμονίων· οὐ δύνασθε τραπέζης κυρίου μετέχειν καὶ τραπέζης δαιμονίων.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/021.yaml
  text: You cannot drink the cup of the Lord and the cup of demons[a]; you cannot partake of the table of the Lord and the table of demons.
translation:
  language: ig
  text: Unu apụghị ịṅụ iko Onyenwe anyị na iko ndị mmụọ ọjọọ; unu apụghị iketa òkè na tebụl Onyenwe anyị na tebụl ndị mmụọ ọjọọ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “isonye na tebụl Onyenwe anyị na tebụl ndị mmụọ ọjọọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ δύνασθε
  choice: Unu apụghị
  rationale: Nke a na-egosi n'ụzọ doro anya na ihe abụọ ahụ enweghị ike ịdịkọ ọnụ, ma na-ejigide nkwughachi ahụ n'ahịrịokwu abụọ ahụ.
- source_word: ποτήριον
  choice: iko
  rationale: “Iko” bụ okwu Igbo nkịtị na nke ziri ezi maka arịa a na-aṅụ ihe, ma ọ na-echekwa ihe oyiyi nke amaokwu ahụ.
- source_word: κυρίου
  choice: Onyenwe anyị
  rationale: Nke a bụ ntụgharị Igbo a na-aghọta nke ọma maka κύριος n'ebe a, na-egosipụta aha nsọpụrụ ahụ n'enweghị itinye nkọwa ọzọ.
- source_word: πίνειν
  choice: ịṅụ
  rationale: Nke a bụ ntụgharị kpọmkwem na nke ebumpụta ụwa maka omume ịṅụ ihe dị n'iko.
- source_word: δαιμονίων
  choice: ndị mmụọ ọjọọ
  rationale: Okwu a na-egosipụta mmụọ ọjọọ ndị nwere njikọ na ofufe arụsị, ma ọ naghị eme ka ha bụrụ naanị echiche ma ọ bụ ike na-enweghị onye.
- source_word: τραπέζης
  choice: tebụl
  rationale: “Tebụl” na-echekwa ihe oyiyi mmekọrịta nri na ofufe nke okwu Grik ahụ, n'etinyeghị echiche “ebe ịchụàjà” nke na-adịghị kpọmkwem n'okwu ahụ.
- source_word: μετέχειν
  choice: iketa òkè na
  rationale: Nkebiokwu a na-egosi ezigbo isonye na ihe mmadụ na ndị ọzọ na-emekọ, ọ bụghị naanị ịnọ ya nso.
- source_word: καὶ
  choice: na
  rationale: E chekwara njikọ dị mfe na nhazi okwu abụọ na-emegide onwe ha dịka ọ dị na Grik.
theological_decisions:
- issue: Mmekọrịta dị n'etiti isonye na tebụl Onyenwe anyị na isonye n'ofufe ndị mmụọ ọjọọ
  choice: A sụgharịrị οὐ δύνασθε ugboro abụọ dịka “Unu apụghị,” iji gosipụta na ụdị isonye abụọ ahụ enweghị ike ịdịkọ ọnụ.
  alternative: Ịsụgharị ya dịka ndụmọdụ dị nro, dịka “Unu ekwesịghị.”
  rationale: Nkwughachi οὐ δύνασθε na usoro ahịrịokwu abụọ kwekọrọ na-egosi enweghị nkwekọrịta siri ike, ọ bụghị naanị ndụmọdụ ma ọ bụ mmasị.
translation_notes:
  register: Asụsụ Igbo Izugbe dị ugbu a, dị nsọpụrụ ma dị mfe nghọta. E chekwara nhazi ahịrịokwu abụọ yiri ibe ha na nkwughachi nke ederede Grik.
