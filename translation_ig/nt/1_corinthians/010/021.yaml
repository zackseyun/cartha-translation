    text: Ma ọ bụ, “isonye na tebụl Onyenwe anyị na tebụl ndị mmụọ ọjọọ.”
    reason: lexical_alternative
  revision_rationale: 'No change to the translated wording is needed: it is faithful to the Greek and natural in Standard Igbo. The revision designation clarifies that footnote a is anchored to the second, table-participation clause, which is the clause to which its lexical alternative applies.'
