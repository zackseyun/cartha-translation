review_pass:
  verdict: revise
  source_fidelity: The wording accurately preserves the repeated categorical οὐ δύνασθε (“Unu apụghị”), both occurrences of ποτήριον (“iko”), the Lord/demons contrast, and μετέχειν as real participation (“iketa òkè na”). The parallel structure and the source’s unqualified categorical incompatibility are retained.
  naturalness: The Standard Igbo is clear, idiomatic, and appropriately dignified. “Iketa òkè na” naturally conveys sharing/participating in a table or fellowship.
  terminology: “Onyenwe anyị” is an established respectful rendering for κύριος in this setting; “ndị mmụọ ọjọọ” adequately renders δαιμονίων without reducing it to an impersonal force. “Tebụl” retains the source’s concrete table imagery and does not import “altar.”
  issues:
  - severity: low
    issue: Footnote anchor is placed at the end of the whole verse although its stated lexical alternative concerns μετέχειν.
    rationale: The marker should follow the second table-participation clause, rather than appear to annotate the entire sentence or the preceding reference to demons. This is an anchor-placement clarification only.
  revised_text: Unu apụghị ịṅụ iko Onyenwe anyị na iko ndị mmụọ ọjọọ; unu apụghị iketa òkè na tebụl Onyenwe anyị na tebụl ndị mmụọ ọjọọ.[a]
  revised_footnotes:
