- from: 'Tụlee Izrel n’usoro anụ ahụ: ndị na-eri ihe ndị e ji achụ àjà, hà abụghị ndị ha na ebe ịchụ àjà na-ekekọrịta?[a][b]'
  to: Tụleenụ Izrel nke anụ ahụ:[a] ndị na-eri àjà, hà abụghị ndị na-eketa òkè n’ebe ịchụàjà?[b]
  rationale: The revision preserves the source’s imperative, literal “according to the flesh” expression, rhetorical question, and sacrificial analogy. It replaces two potentially misleading phrases with direct, idiomatic Standard Igbo equivalents and retains alternatives in footnotes without resolving theological questions beyond the verse.
