base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/018.yaml
  text: 'Consider Israel according to the flesh: are not those who eat the sacrifices participants in the altar?[a][b][c]'
translation:
  language: ig
  text: Tụleenụ Izrel nke anụ ahụ:[a] ndị na-eri àjà, hà abụghị ndị na-eketa òkè n’ebe ịchụàjà?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Izrel site n’ọmụmụ anụ ahụ” ma ọ bụ “Izrel site n’agbụrụ.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ndị nwere oke n’ebe ịchụàjà” ma ọ bụ “ndị na ebe ịchụàjà na-enwe mmekọrịta.”
    reason: lexical_alternative
lexical_decisions:
- source_word: βλέπετε
  choice: Tụlee
  rationale: Ọ bụ iwu e nyere ọtụtụ mmadụ ka ha lebara ihe atụ ahụ anya ma tụgharịa uche na ya; “Tụlee” dabara n’arụmụka Pọl karịa okwu nke pụtara naanị iji anya hụ.
- source_word: Ἰσραὴλ κατὰ σάρκα
  choice: Izrel n’usoro anụ ahụ
  rationale: Nke a na-edobe okwu Pọl banyere “anụ ahụ” ma na-ezo aka n’Izrel site n’ọmụmụ anụ ahụ, ọ bụghị n’ọdịdị mmehie.
- source_word: οὐχ ... εἰσίν;
  choice: hà abụghị ...?
  rationale: Ajụjụ a na-atụ anya azịza nkwenye, dị ka οὐχ si egosi.
- source_word: οἱ ἐσθίοντες
  choice: ndị na-eri
  rationale: Na-edobe omume iri ihe n’ụzọ doro anya kama iji okwu nkọwa ọzọ dochie ya.
- source_word: τὰς θυσίας
  choice: ihe ndị e ji achụ àjà
  rationale: Ọ bụ okwu Igbo doro anya ma kwekọọ n’ihe àjà ndị a na-eri pụtara.
- source_word: κοινωνοὶ τοῦ θυσιαστηρίου
  choice: ndị ha na ebe ịchụ àjà na-ekekọrịta
  rationale: Na-egosi ezigbo oke ma ọ bụ mmekọrịta mmadụ na ebe ịchụ àjà nwere, ma zere okwu Igbo na-adịghị eke nke ga-apụta ka mmadụ nọ n’ime ebe ịchụ àjà.
theological_decisions:
- issue: Ihe “Izrel n’usoro anụ ahụ” pụtara
  choice: Izrel site n’ọmụmụ anụ ahụ ma ọ bụ agbụrụ
  alternative: Izrel nke a na-ele naanị n’ụzọ ihe a na-ahụ anya
  rationale: N’ebe a, okwu ahụ na-ezo n’ụzọ kachasị eke na ndị Izrel site n’agbụrụ dịka ihe atụ sitere n’omume ịchụ àjà. Nsụgharị ahụ na-edobe okwu “anụ ahụ” n’ebughị ụzọ kpebie arụmụka sara mbara banyere Izrel.
- issue: Mmekọrịta ndị na-eri àjà na ebe ịchụ àjà
  choice: ha na ebe ịchụ àjà na-ekekọrịta
  alternative: ha bụ ndị nwere oke n’ebe ịchụ àjà
  rationale: κοινωνοί na-egosi isonye ma ọ bụ inwe oke n’ezi mmekọrịta metụtara ebe ịchụ àjà; a hapụrụ ogo mmekọrịta ahụ ka ederede si kwuo ya n’etinyeghị nkọwa ụka pụrụ iche.
translation_notes:
  register: Asụsụ Igbo Izugbe dị ugbu a, kwụ ọtọ ma dị ùgwù. E debere “anụ ahụ” iji chekwaa usoro okwu Pọl, ebe e ji nkọwa ala peeji nyere ụzọ nghọta agbụrụ. Ajụjụ mmechi ahụ bụ ajụjụ nkwupụta nke na-atụ anya azịza ee.
