  text: εἰ ἐγὼ χάριτι μετέχω, τί βλασφημοῦμαι ὑπὲρ οὗ ἐγὼ εὐχαριστῶ;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/030.yaml
  text: If I partake with thankfulness[a], why am I denounced for that for which I give thanks?
translation:
  language: ig
  text: Ọ bụrụ na m ji obi ekele na-eri[a], gịnị mere a na-ekwulu m n’ihi ihe m na-enye ekele maka ya?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Ọ bụrụ na m na-eketa oke site n’amara, gịnị mere a na-ekwulu m n’ihi ihe m na-enye ekele maka ya?” Okwu Grik χάριτι nwekwara ike ịpụta “site n’amara,” ma n’ebe a ọtụtụ ndị na-aghọta ya dịka “ji obi ekele” n’ihi okwu sochiri ya, “m na-enye ekele.”
    reason: lexical_alternative
lexical_decisions:
- source_word: χάριτι
  choice: ji obi ekele
  rationale: N’ọnọdụ a gbasara iri nri, yana εὐχαριστῶ sochiri ya, okwu a na-egosi na onye ahụ ji ekele rie, ọ bụghị amara nzọpụta.
- source_word: μετέχω
  choice: rie ya
  rationale: Ọ bụ ezie na okwu Grik ahụ pụtara iketa oke ma ọ bụ iso nweta ihe, n’ebe a ihe a na-ekwu bụ nri; ‘rie ya’ bụ Igbo nkịtị ma doo anya.
- source_word: βλασφημοῦμαι
  choice: a ga-eji kwutọọ m
  rationale: N’ebe a, ọ pụtara ikwu okwu ọjọọ megide Pọl ma ọ bụ ịkatọ ya, ọ bụghị nkwulu a na-ekwulu Chineke.
- source_word: ὑπὲρ οὗ
  choice: n’ihi ihe
  rationale: Nke a na-egosi ihe kpatara nkwutọ ahụ ma na-asụgharị ya n’ụzọ Igbo na-aga were were.
- source_word: εὐχαριστῶ
  choice: m na-ekele ekele maka ya
  rationale: Nke a na-edobe echiche nke inye ekele n’etinyeghị ‘Chineke,’ nke a na-aghọta n’ọnọdụ ahụ ma ọ bụghị okwu e dere kpọmkwem.
- source_word: ἐγὼ ... ἐγὼ
  choice: m ... m
  rationale: A na-edobe onye mbụ ugboro abụọ dịka o si dị na Grik, n’enweghị ịgbakwunye nrụgide na-adịghị mkpa.
- source_word: τί
  choice: gịnị mere
  rationale: N’ajụjụ arụmụka a, τί pụtara ‘gịnị mere?’
theological_decisions:
- issue: Ihe χάριτι pụtara n’ihe gbasara iri nri na inye ekele
  choice: ji obi ekele
  alternative: site n’amara
  rationale: Okwu sochiri ya, ‘m na-ekele ekele,’ na-akwado echiche nke obi ekele. ‘Site n’amara’ nwere ike iweta echiche amara nzọpụta nke amaokwu a anaghị achọ kpọmkwem.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. A họọrọ ‘rie ya’ kama okwu nkịtị pụtara ‘keta oke’ n’ihi na ọnọdụ ahụ bụ iri nri; ihe ọzọ a pụrụ ịsụgharị maka χάριτι ka edobere n’ala ala peeji.
