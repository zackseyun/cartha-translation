id: 1CO.10.6
reference: 1 Corinthians 10:6
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ταῦτα δὲ τύποι ἡμῶν ἐγενήθησαν, εἰς τὸ μὴ εἶναι ἡμᾶς ἐπιθυμητὰς κακῶν, καθὼς κἀκεῖνοι ἐπεθύμησαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/006.yaml
  text: These things became examples for us[a], so that we might not be people who desire evil things, just as they also desired them.
translation:
  language: ig
  text: Ihe ndị a ghọrọ ihe atụ nye anyị[a], ka anyị ghara ịbụ ndị na-enwe agụụ maka ihe ọjọọ, dịka ha onwe ha nwekwara agụụ maka ihe ọjọọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ “ụkpụrụ nye anyị” ma ọ bụ “ihe nlereanya nye anyị.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταῦτα
  choice: Ihe ndị a
  rationale: Ọ na-ezo aka n'ihe ndị mere n'ọzara a kọrọ okwu ha tupu amaokwu a; nsụgharị a doro anya ma ọ naghị etinye nkọwa ọzọ n'ihe odide ahụ.
- source_word: δὲ
  choice: E gosighị ya site n'okwu njikọ pụrụ iche
  rationale: N'ebe a δὲ bụ njikọ dị nro nke na-akpụgharị okwu gaa na nkọwa; Igbo na-egosipụta ntụgharị a nke ọma site n'usoro ahịrịokwu n'enweghị ‘ma’ ma ọ bụ ‘ugbu a,’ nke nwere ike ime ka ọdịiche ma ọ bụ oge sie ike karịa Grik.
- source_word: τύποι
  choice: ihe atụ
  rationale: N'ọnọdụ ịdọ aka ná ntị a, ‘ihe atụ’ na-enye echiche nke ihe mere nke na-akụziri ndị ọzọ ihe. Ihe odide ala peeji na-echekwa ohere nke ‘ụkpụrụ’ ma ọ bụ ‘ihe nlereanya.’
- source_word: ἡμῶν
  choice: nye anyị
  rationale: Nke a bụ ụzọ Igbo si ekwu n'ụzọ ebumpụta ụwa na ihe ndị ahụ bara uru dị ka ihe atụ maka ọgbakọ ndị kwere ekwe.
- source_word: ἐγενήθησαν
  choice: ghọrọ
  rationale: ‘Ghọrọ’ na-echekwa echiche γίνομαι nke ịbịa bụrụ ma ọ bụ ịrụ ọrụ dị ka ihe atụ, kama ikwu naanị na ha ‘bụ’ ihe atụ.
- source_word: εἰς τὸ μὴ εἶναι
  choice: ka anyị ghara ịbụ
  rationale: Ọ na-egosi ebumnuche ma ọ bụ ihe e zubere ka ịdọ aka ná ntị ahụ rụpụta, ma na-echekwa okwu Grik banyere ‘ịbụ’ ndị nwere ọchịchọ ahụ.
- source_word: ἐπιθυμητὰς κακῶν
  choice: ndị ihe ọjọọ na-agụ agụụ
  rationale: Akpaalaokwu Igbo a na-egosi ndị na-achọ ihe ọjọọ nke ukwuu. Ọ naghị eme ka ọchịchọ ahụ bụrụ naanị agụụ mmekọahụ.
- source_word: καθὼς κἀκεῖνοι ἐπεθύμησαν
  choice: dị ka agụụ ya gụkwara ha
  rationale: Ọ na-echekwa ntụnyere ahụ na ike mgbakwunye nke καί, ebe ‘ya’ na-ezo aka n'ihe ọjọọ a kpọrọ aha n'ahịrịokwu ahụ.
theological_decisions:
- issue: Ihe τύποι pụtara n'ihe gbasara ahụmahụ Izrel n'ọzara
  choice: ihe atụ
  alternative: ụkpụrụ; ihe nlereanya
  rationale: Ihe gbara amaokwu a gburugburu na-eji akụkọ ndị ahụ adọ ọgbakọ aka ná ntị banyere omume. ‘Ihe atụ’ na-egosipụta ọrụ nkuzi a n'etinyeghị usoro nkà mmụta okpukpe pụrụ iche; ihe odide ala peeji na-echekwa obosara okwu Grik.
- issue: Ike na obosara nke okwu ọchịchọ ἐπιθυμητάς/ἐπεθύμησαν
  choice: ihe ọjọọ na-agụ agụụ / agụụ ya gụkwara ha
  alternative: ịchọ ihe ọjọọ; inwe oke agụụ maka ihe ọjọọ
  rationale: ‘Agụụ’ na-egosi ọchịchọ siri ike ma na-ahapụ ya ka ọ gbasaa n'ụdị ihe ọjọọ niile, kama ime ka ọ bụrụ naanị agụụ mmekọahụ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ usoro ‘ihe ọjọọ na-agụ agụụ’ n'ihi na ọ bụ ụzọ Igbo ebumpụta ụwa si akọwa ọchịchọ siri ike; e zere okwu nwere ike ime ka uche gaa naanị n'agụụ mmekọahụ. Akara [a] dị n'ahịrịokwu bụ isi ma kwekọọ n'ihe odide ala peeji.
