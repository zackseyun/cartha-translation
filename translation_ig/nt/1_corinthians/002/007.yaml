id: 1CO.2.7
reference: 1 Corinthians 2:7
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀλλὰ λαλοῦμεν ⸂θεοῦ σοφίαν⸃ ἐν μυστηρίῳ, τὴν ἀποκεκρυμμένην, ἣν προώρισεν ὁ θεὸς πρὸ τῶν αἰώνων εἰς δόξαν ἡμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/007.yaml
  text: But we speak God's wisdom in a mystery[c][b][a], the hidden wisdom that God predestined before the ages for our glory.
translation:
  language: ig
  text: Kama, anyị na-ekwu amamihe Chineke n’ihe omimi[a], ya bụ, amamihe ahụ e zoro ezo, nke Chineke buru ụzọ kpebie[b] tupu ọgbọ niile[c] maka ebube anyị.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’ihe nzuzo.” Okwu Grik bụ “ihe omimi,” okwu Pọl na-ejikarị akọwa atụmatụ Chineke nke e zoro na mbụ ma kpughee ugbu a.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “kara aka,” ma ọ bụ, “kpebie tupu oge eruo.”
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “tupu ụwa amalite.” Okwu ahụ n’ụzọ nkịtị bụ “tupu ọgbọ niile.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λαλοῦμεν
  choice: anyị na-ekwu
  rationale: Nke a na-enye ihe λαλέω pụtara n’ụzọ doro anya ma na-edobe okwu Pọl dị ka nkwupụta, n’etinyeghị echiche siri ike nke ‘ikwusa’ na-adịghị mkpa n’ebe a.
- source_word: θεοῦ σοφίαν
  choice: amamihe Chineke
  rationale: Nhazi a bụ nke Igbo nkịtị maka genitive, na-egosikwa na amamihe ahụ bụ nke Chineke ma si n’aka ya.
- source_word: ἐν μυστηρίῳ
  choice: n’ihe omimi
  rationale: ‘Ihe omimi’ na-edobe okwu Pọl maka atụmatụ Chineke nke e zoro na mbụ ma mesịa kpughee; a hapụrụkwa ohere nghọta nke preposition ἐν n’enweghị ịkọwa ya gabiga ihe ederede kwuru.
- source_word: τὴν ἀποκεκρυμμένην
  choice: amamihe ahụ e zoro ezo
  rationale: Participle nwanyị otu a na-alaghachi na ‘amamihe’; ikwughachi ‘amamihe’ na-eme ka ihe ọ na-ezo aka na ya doo anya n’Igbo.
- source_word: προώρισεν
  choice: buru ụzọ kpebie
  rationale: Nke a na-egosipụta mkpebi Chineke mere tupu oge eruo, ma na-ezere ibubata usoro ozizi pụrụ iche n’ime otu okwu ahụ.
- source_word: πρὸ τῶν αἰώνων
  choice: tupu oge nile
  rationale: Nke a na-anọ nso na ọtụtụ αἰῶνες ma na-edobe echiche oge sara mbara nke okwu Grik ahụ.
- source_word: εἰς δόξαν ἡμῶν
  choice: maka ebube anyị
  rationale: Nke a bụ nsụgharị kwụ ọtọ nke ahịrịokwu ahụ ma na-edobe ịdị arọ nke δόξα n’enweghị ịkọwa ya naanị dị ka nsọpụrụ ma ọ bụ ime ka anyị nwee ebube.
theological_decisions:
- issue: Otu e si asụgharị προώρισεν n’ebe okwu Pọl nwere mkpa n’ihe gbasara ozizi
  choice: buru ụzọ kpebie
  alternative: kara aka
  rationale: ‘Buru ụzọ kpebie’ na-edobe ike nke mkpebi Chineke mere tupu oge eruo, ma ọ naghị ewere otu usoro ozizi chọọchị kpọmkwem dị ka naanị nkọwa okwu ahụ.
- issue: Ihe ‘ihe omimi’ Pọl pụtara
  choice: ihe omimi
  alternative: ihe nzuzo
  rationale: ‘Ihe omimi’ na-edobe esemokwu dị n’etiti ihe Chineke zoro na mbụ na ihe ọ na-eme ka a mara, ebe ‘ihe nzuzo’ pụrụ ime ka ọ dị ka ozi a ka na-ezobe kpamkpam.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. Ahịrịokwu ahụ na-edobe apposition nke Grik site na ‘ya bụ,’ ma na-etinye akara nkọwa ụkwụ n’ebe okwu nke ọ bụla metụtara dị.
