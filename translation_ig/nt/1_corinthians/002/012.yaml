    text: Ma ọ bụ, “ka anyị wee ghọta.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ihe ndị Chineke nyere anyị n’efu,” ma ọ bụ, “ihe ndị Chineke nyere anyị dịka onyinye.”
    reason: lexical_alternative
  revision_rationale: The revision removes a redundant repeated verb and uses “sitere na Chineke” for a more natural expression of divine source. It retains the source text’s contrast, purpose, plural scope, and gracious-gift nuance, and keeps the footnote anchors aligned with the words they elucidate.
