id: 1CO.2.12
reference: 1 Corinthians 2:12
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἡμεῖς δὲ οὐ τὸ πνεῦμα τοῦ κόσμου ἐλάβομεν ἀλλὰ τὸ πνεῦμα τὸ ἐκ τοῦ θεοῦ, ἵνα εἰδῶμεν τὰ ὑπὸ τοῦ θεοῦ χαρισθέντα ἡμῖν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/012.yaml
  text: But we have not received the spirit of the world[a], but the Spirit from God[b], so that we may know the things graciously given to us by God.
translation:
  language: ig
  text: Ma ọ bụghị mmụọ nke ụwa, kama ọ bụ Mmụọ nke sitere na Chineke, ka anyị natara, ka anyị wee mara[a] ihe ndị Chineke ji amara nye anyị.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ka anyị wee ghọta.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ihe ndị Chineke nyere anyị n’efu,” ma ọ bụ, “ihe ndị Chineke nyere anyị dịka onyinye.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πνεῦμα
  choice: mmụọ / Mmụọ
  rationale: E ji “mmụọ” obere mkpụrụedemede sụgharịa nke ụwa, nke na-egosi ike ma ọ bụ mmetụta na-achị usoro ụwa; e ji “Mmụọ” nnukwu mkpụrụedemede sụgharịa nke si na Chineke n’ihi na ihe gbara amaokwu ahụ gburugburu na-ezo aka n’Mmụọ Nsọ.
- source_word: κόσμου
  choice: ụwa
  rationale: “Ụwa” bụ okwu Igbo doro anya ma bụrụkwa nke a na-ejikarị akọwa usoro mmadụ dị ugbu a nke e ji tụnyere Chineke.
- source_word: ἐλάβομεν
  choice: anyị natara
  rationale: Oge gara aga dị mfe na Igbo na-egosi nnata ahụ mere eme, ebe ihe ndị ọzọ dị n’amaokwu ahụ na-egosi mkpa ọ ka nwere ugbu a.
- source_word: τὸ ἐκ τοῦ θεοῦ
  choice: nke si na Chineke
  rationale: Nke a na-edobe echiche ἐκ nke na-egosi ebe Mmụọ ahụ si, n’asụsụ Igbo dị mfe ma kwekọọ n’usoro Grik.
- source_word: ἵνα εἰδῶμεν
  choice: ka anyị wee mara
  rationale: Nke a na-eme ka ebumnuche dị na ἵνα pụta ìhè ma na-edobe isi echiche οἶδα, ya bụ ịmata.
- source_word: χαρισθέντα
  choice: ji amara nye
  rationale: Nkebiokwu a na-egosi na Chineke nyere ihe ndị ahụ site n’amara, ọ bụghị nanị na o nyere ha; ya mere, ọ na-edobe echiche onyinye amara dị na χαρίζομαι.
- source_word: τὰ ... χαρισθέντα ἡμῖν
  choice: ihe ndị Chineke ji amara nye anyị
  rationale: “Ihe ndị” na-edobe obosara nke neuter plural ahụ, kama ime ka ọ bụrụ nanị onyinye ime mmụọ ụfọdụ.
theological_decisions:
- issue: Ma πνεῦμα τὸ ἐκ τοῦ θεοῦ ọ na-ezo aka kpọmkwem n’Mmụọ Nsọ
  choice: Mmụọ ahụ nke si na Chineke
  alternative: mmụọ nke si na Chineke
  rationale: N’ihe gbara amaokwu ahụ gburugburu, ọdịiche dị n’etiti “mmụọ nke ụwa” na Mmụọ e nyere ndị kwere ekwe na-egosi n’ụzọ kachasị kwe omume na Pọl na-ekwu maka Mmụọ Nsọ. Nnukwu mkpụrụedemede na-egosi nke a n’enweghị ịgbasa okwu Grik.
translation_notes:
  register: Asụsụ ahụ bụ Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. Usoro “ọ bụghị ... kama ọ bụ ...” na-eme ka ọdịiche Pọl kwusiri ike pụta nke ọma. E tinyere akara nkọwa ụkwụ n’ebe okwu ọzọ nke ọ bụla metụtara n’ezie, kama ịgbaso ebe akara ndị dị na consultation layer nke Bekee mgbe ebe ahụ adabaghị na ọdịnaya nkọwa ya.
