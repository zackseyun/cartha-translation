id: 1CO.2.4
reference: 1 Corinthians 2:4
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ὁ λόγος μου καὶ τὸ κήρυγμά μου οὐκ ἐν ⸂πειθοῖ σοφίας⸃ ἀλλ’ ἐν ἀποδείξει πνεύματος καὶ δυνάμεως,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/004.yaml
  text: And my speech and my proclamation were not with persuasive wisdom, but with a demonstration of the Spirit and of power,
translation:
  language: ig
  text: Okwu m na nkwusa m anọghị n’amamihe na-eme ka mmadụ kwenye[a], kama n’igosipụta Mmụọ[b] na ike.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’okwu amamihe na-eme ka mmadụ kwenye.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “mmụọ.”
    reason: alternative_reading
lexical_decisions:
- source_word: λόγος
  choice: okwu
  rationale: N’ebe a, “okwu” na-egosi okwu Pọl kwuru ma ọ bụ ụzọ o si kwuo ya; ọ na-adịkwa iche na “nkwusa” nke na-esochi ya.
- source_word: κήρυγμα
  choice: nkwusa
  rationale: “Nkwusa” na-egosi izi ozi n’ihu ọha, ma na-edobe ọdịiche dị n’etiti κήρυγμα na λόγος.
- source_word: πειθοῖ σοφίας
  choice: n’amamihe na-eme ka mmadụ kwenye
  rationale: Nke a anaghị etinye “okwu” n’ahịrị bụ isi ebe okwu Grik na-ekwughị ya hoo haa, ma ọ na-egosi amamihe e ji adọta mmadụ ka o kwenye.
- source_word: ἀποδείξει
  choice: n’igosipụta
  rationale: “Igosipụta” na-enye echiche nke ime ka ihe pụta ìhè site n’ihe akaebe, n’adịghị ka iji naanị nkà okwu mee ka mmadụ kwenye.
- source_word: πνεύματος
  choice: Mmụọ
  rationale: Ọnọdụ okwu a na isiakwụkwọ ahụ dum na-atụ aka n’ọrụ Mmụọ nke Chineke; agbanyeghị, e debere nghọta ọzọ, “mmụọ,” n’okpuru peeji.
- source_word: δυνάμεως
  choice: ike
  rationale: “Ike” bụ okwu Igbo doro anya ma kwekọọ nke ọma na Mmụọ n’ahịrịokwu a.
theological_decisions:
- issue: Ma πνεύματος ọ̀ na-ezo aka na Mmụọ Nsọ ka ọ bụ na mmụọ n’ozuzu ya
  choice: Mmụọ
  alternative: mmụọ
  rationale: Mkparịta ụka gbara amaokwu a gburugburu na-eme ka ịghọta ya dịka Mmụọ nke Chineke sie ike, ma okwu Grik n’onwe ya ka nwere ike ịpụta “mmụọ”; ya mere e debere nke ọzọ n’okpuru peeji.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-edobe ọdịiche dị n’etiti “okwu” na “nkwusa,” nakwa n’etiti ime ka mmadụ kwenye site n’amamihe na igosipụta Mmụọ na ike.
