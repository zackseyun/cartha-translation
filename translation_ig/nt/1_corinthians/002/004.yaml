  rationale: The revision replaces the origin-based wording with an Igbo locative/manner contrast corresponding to Greek οὐκ ἐν ... ἀλλ’ ἐν. It otherwise retains the draft's sound lexical choices, the deliberate distinction between 'Okwu' and 'nkwusa,' and both footnote alternatives.
