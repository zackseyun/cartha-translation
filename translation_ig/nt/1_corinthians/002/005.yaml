id: 1CO.2.5
reference: 1 Corinthians 2:5
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἵνα ἡ πίστις ὑμῶν μὴ ᾖ ἐν σοφίᾳ ἀνθρώπων ἀλλ’ ἐν δυνάμει θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/005.yaml
  text: so that your faith might not be in the wisdom of men[a], but in the power of God.
translation:
  language: ig
  text: ka okwukwe unu ghara ịdabere n’amamihe mmadụ, kama ka ọ dabere n’ike Chineke.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἵνα
  choice: ka
  rationale: Ọ na-ewebata ebumnuche ihe Pọl kwuru; “ka” bụ ụzọ Igbo dị mfe ma bụrụkwa nke ebumpụta ụwa isi gosipụta nke a.
- source_word: ἡ πίστις ὑμῶν
  choice: okwukwe unu
  rationale: N'ebe a, πίστις na-ezo aka n'okwukwe ma ọ bụ ntụkwasị obi ndị Kọrịnt nwere, ọ bụghị n'ikwesị ntụkwasị obi.
- source_word: μὴ ᾖ ἐν
  choice: ghara ịdabere n’
  rationale: Ọ bụ ezie na okwu Grik pụtara n'ụzọ nkịtị ‘ịdị n'ime,’ n'ọnọdụ a ọ na-egosi ihe okwukwe ha dabeere na ya. Nsụgharị a na-eme ka echiche ahụ doo anya n'Igbo ma debe ihe e ji tụnyere ibe ya.
- source_word: σοφίᾳ ἀνθρώπων
  choice: amamihe mmadụ
  rationale: ἀνθρώπων na-ezo aka n'ụmụ mmadụ n'ozuzu ha. “Amamihe mmadụ” bụ okwu Igbo ebumpụta ụwa nke gụnyere mmadụ niile, ọ bụghị naanị ụmụ nwoke.
- source_word: δυνάμει θεοῦ
  choice: ike Chineke
  rationale: “Ike Chineke” na-egosipụta δυνάμει θεοῦ nke ọma, ma debe ntụnyere dị n'etiti amamihe mmadụ na ike Chineke.
theological_decisions:
- issue: Ihe ἐν pụtara n'okwu abụọ e ji atụnyere ibe ha
  choice: A sụgharịrị ya dị ka ‘ịdabere n’ ... ịdabere n’’
  alternative: ‘ịdị n’amamihe mmadụ ... ịdị n’ike Chineke’
  rationale: N'ebe a, ἐν nwere ike igosi ntọala ma ọ bụ ebe okwukwe siri guzo. “Ịdabere n’” bụ Igbo doro anya ma na-echekwa isi okwu Pọl n’enweghị ịgbakwunye nkọwa okpukpe pụrụ iche.
- issue: Mpụtara ἀνθρώπων
  choice: “mmadụ” n’echiche nke ụmụ mmadụ niile
  alternative: “ndị mmadụ” ma ọ bụ “ụmụ mmadụ”
  rationale: Okwu Grik a bụ nke gụnyere mmadụ niile n'ebe a. “Amamihe mmadụ” bụ usoro okwu Igbo a na-anụkarị, nke na-adịghị ekwu naanị banyere nwoke.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị mfe ma dị ùgwù. E debere ahịrịokwu ahụ n'ụdị ebumnuche, a na-egosikwa ntụnyere doro anya n'etiti amamihe mmadụ na ike Chineke.
