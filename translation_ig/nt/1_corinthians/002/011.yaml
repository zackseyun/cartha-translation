reference: 1 Corinthians 2:11
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τίς γὰρ οἶδεν ἀνθρώπων τὰ τοῦ ἀνθρώπου εἰ μὴ τὸ πνεῦμα τοῦ ἀνθρώπου τὸ ἐν αὐτῷ; οὕτως καὶ τὰ τοῦ θεοῦ οὐδεὶς ⸀ἔγνωκεν εἰ μὴ τὸ πνεῦμα τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/011.yaml
  text: For who among people knows the things of a person except the spirit of the person that is in him? In the same way[b][a], no one has known the things of God except the Spirit of God.
translation:
  language: ig
  text: N’ihi na ònye n’etiti ụmụ mmadụ maara ihe gbasara mmadụ, ma e wezụga mmụọ onye ahụ nke dị n’ime ya? N’otu aka ahụ, ọ dịghị onye maara ihe gbasara Chineke, ma e wezụga Mmụọ Chineke.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị “ihe gbasara mmadụ” dị ka “echiche mmadụ,” ma okwu Grik ahụ sara mbara karịa naanị echiche.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνθρώπων / ἀνθρώπου
  choice: mmadụ / mmadụ
  rationale: Okwu Grik ndị a na-ezo aka n’ụmụ mmadụ n’ozuzu, ọ bụghị nanị ndị nwoke. “Mmadụ” bụ okwu Igbo nkịtị nke na-arụ ọrụ ma n’echiche mkpokọta ma n’echiche otu onye.
- source_word: τὰ τοῦ ἀνθρώπου
  choice: ihe ndị dị n’ime mmadụ
  rationale: Nkebi okwu ahụ sara mbara karịa naanị “echiche.” Nsụgharị a na-egosi ihe ime mmadụ ma na-edobe myirịta ya na “ihe ndị dị n’ime Chineke.”
- source_word: πνεῦμα τοῦ ἀνθρώπου τὸ ἐν αὐτῷ
  choice: mmụọ onye ahụ nke dị n’ime ya
  rationale: Nke a na-esochi usoro okwu Grik n’enweghị ịgbakwụnye echiche pụrụ iche banyere ọdịdị mmadụ.
- source_word: οὕτως καὶ
  choice: N’otu aka ahụ
  rationale: Ọ na-egosi ntụnyere chiri anya n’etiti otu mmadụ si mara ihe ime ya na otu Mmụọ Chineke si mara ihe Chineke.
- source_word: ἔγνωκεν
  choice: maara
  rationale: Ọ bụ ezie na ọ bụ perfect na Grik, ebe a ọ na-egosi ọnọdụ ọmụma nke dị ugbu a; “maara” bụ ụzọ Igbo sitere n’okike isi kwuo ya.
- source_word: τὰ τοῦ θεοῦ
  choice: ihe ndị dị n’ime Chineke
  rationale: A naghị ekpuchi ya n’echiche naanị; okwu a na-edobe obosara nke okwu Grik na myirịta ya na nkebi mbụ.
- source_word: πνεῦμα τοῦ θεοῦ
  choice: Mmụọ Chineke
  rationale: N’akụkụ okwu a, ọ na-ezo aka na Mmụọ nke Chineke nke na-enyocha ma na-ekpughe ihe Chineke; mkpụrụedemede ukwu na-egosi aha nsọ a n’ụzọ a na-ahụkarị n’Igbo.
theological_decisions:
- issue: Ma a ga-ewere πνεῦμα τοῦ θεοῦ dị ka aha nke Mmụọ Chineke ma ọ bụ naanị “mmụọ nke Chineke.”
  choice: Mmụọ Chineke
  alternative: mmụọ Chineke
  rationale: Ihe gbara amaokwu ahụ gburugburu na-egosi onye Mmụọ Chineke nke na-enyocha ma na-ekpughe ihe omimi Chineke. E tinyeghị nkọwa ozizi ọzọ n’elu ihe ederede kwuru.
- issue: Ma τὰ τοῦ ἀνθρώπου / τὰ τοῦ θεοῦ pụtara naanị echiche.
  choice: ihe ndị dị n’ime mmadụ / ihe ndị dị n’ime Chineke
  alternative: echiche mmadụ / echiche Chineke
  rationale: Okwu Grik sara mbara, ya mere nsụgharị ahụ ekwesịghị imechi ya naanị n’echiche.
translation_notes:
  register: Asụsụ Igbo Izugbe dị ugbu a, dị nsọ ma doo ndị nkịtị anya. E debere usoro ajụjụ na ntụnyere nke Grik, ma zere okwu pụrụ iche nke otu ụka.
