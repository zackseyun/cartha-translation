revisions:
- from: N’ihi na ekpebiri m na agaghị m ama ihe ọ bụla n’etiti unu ma e wezụga Jizọs bụ Mesaya—ya onwe ya kwa, onye a kpọgidere n’obe.[a]
  to: N’ihi na ekpebiri m ịmata ihe ọ bụla n’etiti unu ma e wezụga Jizọs bụ Mesaya—ya onwe ya kwa, onye a kpọgidere n’obe.[a]
  rationale: The revision replaces the future-oriented complement with an infinitival complement matching ἔκρινα … εἰδέναι. In the negative-exceptive construction, “ịmata ihe ọ bụla … ma e wezụga” naturally communicates that Paul’s sole concern among them was Jesus the Messiah, specifically him as crucified. No theological interpretation has been added.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T18:10:43Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys Paul’s settled determination, the restrictive force of “nothing … except,” the setting among the Corinthians, the messianic title, and the emphasis on Jesus as crucified. However, “na agaghị m ama” is a future-oriented finite clause (“that I would not know”) rather than the Greek infinitival object, and it can sound as though Paul is speaking of a future refusal to acquire knowledge.
  naturalness: The wording is generally clear Standard Igbo. Recasting the complement with “ịmata” makes the sentence more direct and idiomatic while preserving the intended restrictive sense. “ya onwe ya kwa” naturally carries the emphatic demonstrative together with καί.
  terminology: “Mesaya” appropriately renders Χριστός as a title, and “kpọgidere n’obe” is established, natural Christian Igbo for crucifixion. The footnote’s “Kraịst” alternative is appropriate.
  issues:
  - severity: medium
    issue: Finite future construction after “ekpebiri m”
    rationale: “ekpebiri m na agaghị m ama” introduces a future-negative proposition. Greek has ἔκρινα + infinitive (“I decided to know”), qualified by the exceptive phrase. “ekpebiri m ịmata ihe ọ bụla … ma e wezụga” follows the source construction more closely and avoids a misleading future nuance.
  revised_text: N’ihi na ekpebiri m ịmata ihe ọ bụla n’etiti unu ma e wezụga Jizọs bụ Mesaya—ya onwe ya kwa, onye a kpọgidere n’obe.[a]
  revised_footnotes:
  - marker: a
    text: 'A pụkwara ịsụgharị ya “Jizọs Kraịst.” N’asụsụ Grik: “Jizọs Mesaya.”'
    reason: lexical_alternative
  revision_rationale: The revision replaces the future-oriented complement with an infinitival complement matching ἔκρινα … εἰδέναι. In the negative-exceptive construction, “ịmata ihe ọ bụla … ma e wezụga” naturally communicates that Paul’s sole concern among them was Jesus the Messiah, specifically him as crucified. No theological interpretation has been added.
