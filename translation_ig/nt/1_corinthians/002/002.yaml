source:
  edition: SBLGNT
  text: οὐ γὰρ ἔκρινά ⸂τι εἰδέναι⸃ ἐν ὑμῖν εἰ μὴ Ἰησοῦν Χριστὸν καὶ τοῦτον ἐσταυρωμένον·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/002.yaml
  text: For I decided to know nothing among you except Jesus the Messiah—and him crucified[a].
translation:
  language: ig
  text: N’ihi na ekpebiri m ịmata ihe ọ bụla n’etiti unu ma e wezụga Jizọs bụ Mesaya—ya onwe ya kwa, onye a kpọgidere n’obe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ịsụgharị ya “Jizọs Kraịst.” N’asụsụ Grik: “Jizọs Mesaya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔκρινά
  choice: ekpebiri m
  rationale: N’ebe a, κρίνω na-egosi mkpebi siri ike Pọl mere, ọ bụghị ikpe ikpe; “ekpebiri m” bụ okwu Igbo doro anya ma bụrụkwa nke mmadụ na-eji taa.
- source_word: τι εἰδέναι
  choice: na agaghị m ama ihe ọ bụla
  rationale: Mgbe οὐ na εἰ μὴ jikọrọ aka, okwu a na-egosi na Pọl kpachapụrụ ihe ọ ga-elekwasị anya; ntụgharị a na-echekwa usoro na ike nke okwu Grik ahụ.
- source_word: ἐν ὑμῖν
  choice: n’etiti unu
  rationale: Nke a na-ezo aka n’oge Pọl nọ na-arụ ọrụ ozi n’etiti ndị Kọrịnt; okwu a dị nkenke ma bụrụ Igbo e ji eme ihe.
- source_word: εἰ μὴ
  choice: ma e wezụga
  rationale: Nke a bụ usoro okwu na-ewepụ ihe ndị ọzọ ma hapụ naanị ihe a kpọrọ aha.
- source_word: Χριστόν
  choice: bụ Mesaya
  rationale: N’ebe a Χριστός na-arụ ọrụ dịka utu aha nke na-egosi onye ahụ Chineke tere mmanụ. “Jizọs bụ Mesaya” bụ ụzọ Igbo ebumpụta ụwa si egosipụta utu aha ahụ.
- source_word: καὶ τοῦτον ἐσταυρωμένον
  choice: —ya onwe ya kwa, onye a kpọgidere n’obe
  rationale: “Ya onwe ya kwa” na-echekwa nkwusi ike dị na καὶ τοῦτον, ebe “onye a kpọgidere n’obe” na-egosi Jizọs dịka onye e kpogidere, dịka perfect passive participle si mee.
theological_decisions:
- issue: Ụzọ e si sụgharịa Χριστός
  choice: Mesaya
  alternative: Kraịst
  rationale: E ji Χριστός mee utu aha n’amaokwu a, ya mere “Mesaya” na-eme ka ọrụ ya dịka onye Chineke tere mmanụ pụta ìhè. E debere “Kraịst,” nke ndị na-agụ Igbo maara nke ọma, n’ala ala peeji ka ihe ọzọ a pụrụ ịsụgharị.
- issue: Ike okwu τοῦτον ἐσταυρωμένον
  choice: ya onwe ya kwa, onye a kpọgidere n’obe
  alternative: ya ka a kpọgidere n’obe
  rationale: Nhọrọ a na-echekwa nkwusi ike e tinyere n’ebe Jizọs n’onwe ya nọ nakwa ọnọdụ ya dịka onye a kpọgidere n’obe, n’ebughị ụzọ kọwaa ihe okwu ahụ pụtara n’ụzọ nkwenkwe otu ụka.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ugwu ma dị mfe nghọta, dee ya. A họọrọ “kpọgidere n’obe,” nke bụ okwu Ndị Kraịst na ndị na-agụ Igbo maara nke ọma, ma debe usoro okwu ahụ nkenke ka nkwusi ike Pọl ghara ịla n’iyi.
