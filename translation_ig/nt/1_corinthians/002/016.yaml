id: 1CO.2.16
reference: 1 Corinthians 2:16
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τίς γὰρ ἔγνω νοῦν κυρίου, ὃς συμβιβάσει αὐτόν; ἡμεῖς δὲ νοῦν Χριστοῦ ἔχομεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/016.yaml
  text: For who has known the mind of the Lord[b][a], that he may instruct him? But we have the mind of Messiah.
translation:
  language: ig
  text: N’ihi na, ònye maara uche Onyenwe anyị[b], onye ga-akụziri ya ihe? Ma anyị nwere uche Mesaịa[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “uche Kraịst.”
    reason: lexical_alternative
  - marker: b
    text: Pọl na-ekwughachi echiche dị n’Aịzaya 40:13.
    reason: cross_reference
lexical_decisions:
- source_word: τίς γὰρ
  choice: N’ihi na, “Ònye
  rationale: “N’ihi na” na-ejigide njikọ nkọwa γὰρ na okwu ndị bu ụzọ, ebe “Ònye” na-eweta ajụjụ nkwupụta ahụ n’ụzọ Igbo doro anya.
- source_word: ἔγνω νοῦν κυρίου
  choice: maara uche Onyenwe anyị
  rationale: “Maara” na-egosipụta ịmata uche ahụ, “uche” na-eburu echiche na ọnọdụ ime mmụọ nke νοῦς, “Onyenwe anyị” na-echekwa ụda Akwụkwọ Nsọ nke κύριος.
- source_word: ὃς συμβιβάσει αὐτόν
  choice: Ònye ga-akụziri ya ihe?
  rationale: E kewara ahịrịokwu ikwu onye ahụ ụzọ abụọ ka Igbo wee daa nke ọma ma doo anya na onye maara uche Onyenwe anyị bụ onye a na-ajụ ma ọ ga-akụziri ya ihe; “kụziri ya ihe” na-egosipụta isi echiche συμβιβάζω n’ebe a.
- source_word: ἡμεῖς δὲ
  choice: Ma anyị
  rationale: “Ma” na-egosipụta ntụgharị siri ike site n’enweghị onye pụrụ ịkụziri Onyenwe anyị gaa n’ihe Pọl kwuru banyere ‘anyị.’
- source_word: νοῦν Χριστοῦ ἔχομεν
  choice: anyị nwere uche Mesaịa
  rationale: “Nwere” na-egosipụta ἔχομεν ozugbo; “uche Mesaịa” na-echekwa njikọ genitive ahụ n’enweghị ịkọwa ya karịa ihe Grik kwuru, ebe “Mesaịa” na-egosipụta Χριστός dịka aha-ọrụ nke Onye E Tere Mmanụ.
theological_decisions:
- issue: Otu e si sụgharịa Χριστοῦ n’okwu νοῦν Χριστοῦ
  choice: uche Mesaịa
  alternative: uche Kraịst
  rationale: N’ebe a Χριστός ka nwere ike ịrụ ọrụ dịka aha-ọrụ nke Onye E Tere Mmanụ. “Mesaịa” na-echekwa mgbọrọgwụ na ọdịnala Hibru ahụ, ma ihe odide ala peeji na-enye “Kraịst,” nke bụkwa nsụgharị ọdịnala a na-ahụkarị.
- issue: Ihe “anyị nwere uche Mesaịa” pụtara kpọmkwem
  choice: E debere okwu ahụ n’ụdị sara mbara dịka Grik si dị
  alternative: ịkọwa ya dịka ‘anyị na-eche echiche dịka Mesaịa’ ma ọ bụ ‘anyị maara echiche Mesaịa’
  rationale: Genitive νοῦν Χριστοῦ nwere ike igosi uche nke Mesaịa ma ọ bụ ikere òkè n’ụzọ o si eche echiche. A hapụrụ esemokwu nkọwa a ka ọ dị kama ịhọrọ otu nkọwa n’ime ederede.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. E kewara ajụjụ Grik nwere relative clause ka ọ bụrụ ajụjụ abụọ jikọrọ ọnụ iji zere mgbagwoju anya n’Igbo, na-enweghị ịgbanwe ike ajụjụ nkwupụta ahụ.
