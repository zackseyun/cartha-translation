id: 1CO.2.9
reference: 1 Corinthians 2:9
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀλλὰ καθὼς γέγραπται· Ἃ ὀφθαλμὸς οὐκ εἶδεν καὶ οὖς οὐκ ἤκουσεν καὶ ἐπὶ καρδίαν ἀνθρώπου οὐκ ἀνέβη, ⸀ὅσα ἡτοίμασεν ὁ θεὸς τοῖς ἀγαπῶσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/009.yaml
  text: But just as it is written[a], “What no eye has seen, and no ear has heard[b], and what has not entered into the heart of man—what God has prepared for those who love him.”
translation:
  language: ig
  text: 'Ma dị ka e dere ya: “Ihe anya na-ahụbeghị, ihe ntị na-anụbeghị, nke na-abanyebeghịkwa n’obi mmadụ[a]—ihe niile Chineke kwadebeere ndị hụrụ ya n’anya.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “nke na-abịabeghị n’obi mmadụ” ma ọ bụ “nke onye ọ bụla na-echetụbeghị.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Ma
  rationale: Na-egosi ntụgharị ma ọ bụ ihe dị iche n’echiche bu ya ụzọ n’ụzọ dị nkenke ma dịkwa eke n’Igbo.
- source_word: καθὼς γέγραπται
  choice: dị ka e dere ya
  rationale: Na-echekwa usoro e ji ewebata ihe e dere n’Akwụkwọ Nsọ, ma na-ada nke ọma n’Igbo.
- source_word: Ἃ ... ὅσα
  choice: Ihe ... ihe niile
  rationale: Na-echekwa nhazi uri nke okwu njikọ abụọ ahụ; “ihe niile” na mmalite nke akụkụ ikpeazụ na-egosipụta ọnụọgụ ọtụtụ nke ὅσα ma na-eweghachi ihe ndị e kwuru tupu ya.
- source_word: ὀφθαλμὸς
  choice: anya
  rationale: Ọ bụ ntụgharị kwụ ọtọ nke aha ahụ n’otu, nke a na-eji ebe a akọwa anya n’ozuzu.
- source_word: οὖς
  choice: ntị
  rationale: Na-echekwa aha ahụ n’otu na myirịta ya na “anya,” dịka ọ dị n’asụsụ Grik.
- source_word: ἐπὶ καρδίαν ἀνθρώπου οὐκ ἀνέβη
  choice: nke na-abanyebeghịkwa n’obi mmadụ
  rationale: “Ịbanye n’obi” bụ ụzọ Igbo doro anya si kwuo echiche ma ọ bụ ihe na-eruteghị mmadụ n’obi; “obi” na-echekwa ihe oyiyi Akwụkwọ Nsọ kama ịgbanwe ya ka ọ bụrụ naanị “uche.”
- source_word: ἡτοίμασεν
  choice: kwadebeere
  rationale: Na-egosi na Chineke akwadebela ihe ndị ahụ maka otu ndị a kpọrọ aha; njikọ -reere na-eme ka onye ihe ahụ bụ maka ya doo anya n’Igbo.
- source_word: τοῖς ἀγαπῶσιν αὐτόν
  choice: ndị hụrụ ya n’anya
  rationale: Ọ bụ okwu Igbo eke nke na-akọwa ndị ịhụ Chineke n’anya bụ àgwà ha na-aga n’ihu.
theological_decisions:
- issue: Ihe “obi mmadụ” pụtara na ἐπὶ καρδίαν ἀνθρώπου
  choice: n’obi mmadụ
  alternative: n’uche mmadụ; mmadụ echetụbeghị ya
  rationale: A họọrọ “obi” iji chekwaa ihe oyiyi na nghọta mmadụ nke Akwụkwọ Nsọ, ebe “mmadụ” n’Igbo na-agụnye mmadụ niile n’enweghị mkpa iji okwu metụtara naanị nwoke.
- issue: Mmekọrịta nke Ἃ na ὅσα
  choice: Ihe ... ihe niile
  alternative: Ihe ndị ... ihe ndị ahụ
  rationale: Nke a na-ahapụ nrụgharị okwu Grik ka ọ pụta ìhè n’enweghị ịkọwa kpọmkwem ma akụkụ ikpeazụ ọ bụ nchịkọta zuru ezu ma ọ bụ mmeghachi nke ahịrị ndị bu ya ụzọ.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. A nọgidere na-eji myirịta uri nke “anya… ntị… obi,” ma zere okwu ụka pụrụ iche nke otu nzukọ.
