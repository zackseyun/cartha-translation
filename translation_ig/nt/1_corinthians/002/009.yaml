  naturalness: The rendering is clear, idiomatic Standard Igbo, and retains the elevated but accessible scriptural register and the source’s poetic parallelism. “N’obi mmadụ” is natural and preserves the biblical image of the heart.
  terminology: “Chineke,” “obi mmadụ,” “kwadebeere,” and “ndị hụrụ ya n’anya” are appropriate, established Standard Igbo choices. The inclusive sense of the generic Greek ἀνθρώπου is naturally conveyed by mmadụ.
