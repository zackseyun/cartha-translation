    text: 'A pụkwara ịsụgharị ya: “Mụ kwa bịakwutere unu n’adịghị ike, n’egwu, na n’oké ịma jijiji.”'
    reason: Okwu Grik ἐγενόμην πρὸς ὑμᾶς nwere ike ịpụta ịnọnyere ha ma ọ bụ ịbịakwute ha; ihe gbara amaokwu ahụ gburugburu anaghị ewepụ nke ọ bụla kpamkpam.
lexical_decisions:
- source_word: κἀγώ
  choice: Mụ onwe m kwa
  rationale: “Kwa” na-egosi njikọ ya na okwu bu ụzọ, ebe “mụ onwe m” na-eme ka ntụaka Pọl na-atụ onwe ya doo anya n’Igbo n’enweghị ịgbakwunye echiche ọzọ.
- source_word: ἐν ἀσθενείᾳ
  choice: n’adịghị ike
  rationale: Nke a bụ okwu Igbo doro anya ma dịkwa obosara nke na-egosi adịghị ike ma ọ bụ enweghị ume, n’akọwaghị kpọmkwem ụdị adịghị ike ahụ karịa ihe Grik kwuru.
- source_word: ἐν φόβῳ
  choice: n’egwu
  rationale: Ọ na-edobe okwu ahụ dị ka egwu n’ezie, kama ime ka ọ bụrụ naanị nsọpụrụ ma ọ bụ ịkpachara anya.
- source_word: ἐν τρόμῳ πολλῷ
  choice: na n’oké ịma jijiji
  rationale: “Ịma jijiji” na-asụgharị τρόμος nke ọma, ebe “oke” na-egosipụta ike nke πολλῷ n’ụzọ Igbo na-adị ire.
- source_word: ἐγενόμην πρὸς ὑμᾶς
  choice: nọnyere unu
  rationale: Nke a na-egosi ọnọdụ Pọl mgbe ya na ndị Kọrịnt nọ. Ebe okwu Grik ahụ nwekwara ike ịrụtụ aka n’ọbịbịa ya, e debere nghọta ahụ n’okpuru ala peeji.
