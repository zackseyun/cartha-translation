  source_fidelity: 'The rendering accurately conveys Paul''s presence among the Corinthians and preserves the threefold description: weakness, fear, and intensified trembling. The footnote appropriately retains the viable arrival-oriented sense of ἐγενόμην πρὸς ὑμᾶς. However, “onwe m” adds a reflexive/self-emphatic force not required by κἀγώ, which means “and I.”'
