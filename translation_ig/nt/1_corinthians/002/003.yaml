  terminology: 'The key terms are handled well: “adịghị ike” preserves the breadth of ἀσθένεια; “egwu” does not dilute φόβος; and “oké ịma jijiji” expresses the intensification of τρόμῳ πολλῷ. Removing “onwe m” prevents unnecessary emphasis.'
