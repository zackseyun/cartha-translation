id: 1CO.2.10
reference: 1 Corinthians 2:10
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἡμῖν ⸀γὰρ ⸂ἀπεκάλυψεν ὁ θεὸς⸃ διὰ τοῦ ⸀πνεύματος, τὸ γὰρ πνεῦμα πάντα ἐραυνᾷ, καὶ τὰ βάθη τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/010.yaml
  text: For God has revealed these things to us through the Spirit[a], for the Spirit searches all things[b], even the depths of God.
translation:
  language: ig
  text: N’ihi na Chineke ekpugheere anyị ihe ndị a site na Mmụọ Nsọ[a]; n’ihi na Mmụọ Nsọ na-enyocha ihe niile, ọbụna omimi nke Chineke.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ekpughere anyị ha”; Grik ekwughị kpọmkwem ihe e kpughere, ma ihe ọ na-ezo aka na ya sitere n’okwu ndị bu ụzọ.
    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ, “ihe miri emi nke Chineke.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμῖν
  choice: anyị
  rationale: E jiri nnọchiaha nnata mee ka o doo anya na ọ bụ anyị ka Chineke kpughere ihe ndị ahụ.
- source_word: ἀπεκάλυψεν
  choice: ekpughewo
  rationale: Oge perfect Igbo na-egosi omume mkpughe e mezuru nke uru ya ka dị ugbu a, n’enweghị ịgbanwe isi ihe aorist Grik.
- source_word: '[implicit object of ἀπεκάλυψεν]'
  choice: ihe ndị a
  rationale: Grik ekwughị kpọmkwem ihe e kpughere, ma gburugburu okwu bu ụzọ na-enye ya; ‘ihe ndị a’ jikọtara amaokwu ahụ na ihe e kwuru tupu ya.
- source_word: διὰ τοῦ πνεύματος
  choice: site na Mmụọ Nsọ
  rationale: ‘Site na’ na-egosipụta ụzọ ma ọ bụ onye ọrụ Chineke ji kpughee ihe ndị ahụ; ‘Mmụọ Nsọ’ dabara n’ọnọdụ okwu a.
- source_word: πνεῦμα
  choice: Mmụọ Nsọ
  rationale: N’ebe a, onye na-eweta mkpughe ma mara omimi Chineke bụ Mmụọ Nsọ, ọ bụghị mmụọ mmadụ.
- source_word: ἐραυνᾷ
  choice: na-enyocha
  rationale: ‘Na-enyocha’ na-eburu echiche nke ịchọ nke ọma ma nyochaa ihe ruo n’ime ya.
- source_word: πάντα
  choice: ihe niile
  rationale: Nke a na-edobe obosara okwu Grik ahụ n’ụzọ Igbo nkịtị.
- source_word: καὶ
  choice: ọbụna
  rationale: 'N’ebe a καί na-eme ka nkebi ikpeazụ sie ike: Mmụọ ahụ na-enyocha ihe niile, ruo ọbụna n’ihe miri emi nke Chineke.'
- source_word: τὰ βάθη τοῦ θεοῦ
  choice: ihe omimi miri emi nke Chineke
  rationale: Nke a na-edobe ihe atụ nke ịdị omimi ma na-eme ka okwu ahụ bụrụ Igbo doro anya; nkọwa dị nso karị n’ụdị okwu Grik dị n’ihe odide ala peeji.
theological_decisions:
- issue: Ma πνεῦμα ọ̀ bụ Mmụọ Nsọ ka ọ bụ mmụọ mmadụ
  choice: Mmụọ Nsọ n’ebe abụọ ahụ
  alternative: mmụọ mmadụ n’echiche sara mbara
  rationale: Ọnọdụ okwu ahụ kwuru na Chineke ji Mmụọ ahụ ekpughe ihe, nakwa na Mmụọ ahụ na-enyocha ọbụna omimi Chineke; nke a na-akwado Mmụọ Nsọ nke ukwuu.
- issue: Ma ἐραυνᾷ ọ na-egosi na Mmụọ Nsọ amaghị ihe ma na-achọ ịmata ya
  choice: ‘na-enyocha’ dị ka okwu na-egosi ịmata ihe ruo n’ime omimi ya
  alternative: ịsụgharị ya ‘maara’ iji zere echiche nke ọchịchọ
  rationale: E kwesịrị idobe ngwaa Grik na ihe atụ ya. N’ọnọdụ a, ọ na-akọwa nghọta zuru oke nke Mmụọ ahụ banyere ihe niile, ọ bụghị amaghị ama.
translation_notes:
  register: Asụsụ Igbo Izugbe dị ugbu a, dị nsọpụrụ ma dị mfe nghọta. E jiri ‘Mmụọ Nsọ’ mee ka onye πνεῦμα na-ezo aka na ya doo anya. E debere nkwughachi ‘n’ihi na’ nke γὰρ abụọ iji chekwaa usoro arụmụka amaokwu ahụ.
