  source_fidelity: 'Isi ntụgharị ahụ na-anọchite anya otu nghọta a pụrụ ịgbachitere nke πνευματικοῖς πνευματικὰ συγκρίνοντες: πνευματικοῖς dịka ọtụtụ mmadụ (''ndị ime mmụọ'') na συγκρίνοντες dịka ''ịkọwa/ịtụgharị''. Ọ na-edobe ọdịiche Pọl mere n''etiti okwu amamihe mmadụ kụziri na okwu Mmụọ Nsọ kụziri. Otú ọ dị, nkọwa ala peeji kwesịrị ikwu nke ọma na mgbagwoju anya ahụ metụtara ụdị okwu πνευματικοῖς, ka ọ ghara ịdị ka ọ na-ekwu na okwu Grik ahụ dum na-ezo n''otu aka ahụ n''ebe mmadụ nọ.'
