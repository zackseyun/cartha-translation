  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἃ καὶ λαλοῦμεν οὐκ ἐν διδακτοῖς ἀνθρωπίνης σοφίας λόγοις, ἀλλ’ ἐν διδακτοῖς ⸀πνεύματος, πνευματικοῖς πνευματικὰ συγκρίνοντες.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/013.yaml
  text: These things we also speak[a], not in words taught by human wisdom, but in those taught by the Spirit, interpreting spiritual things to spiritual people.
translation:
  language: ig
  text: Ihe ndị a ka anyị na-ekwukwa, ọ bụghị n'okwu amamihe mmadụ kụziri, kama n'okwu Mmụọ Nsọ kụziri, na-akọwara ndị ime mmụọ ihe ime mmụọ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “na-eji okwu ime mmụọ akọwa ihe ime mmụọ,” ma ọ bụ, “na-ejikọta ihe ime mmụọ na ihe ime mmụọ.” Okwu πνευματικοῖς dị n'asụsụ Grik nwere ike ịpụta “ndị ime mmụọ,” ma ọ bụ ihe ime mmụọ; n'ọnọdụ nke abụọ, a pụrụ ịghọta ya dịka okwu ime mmụọ.
    reason: alternative_reading
lexical_decisions:
- source_word: ἃ
  choice: Ihe ndị a
  rationale: Ọ na-ezo aka n'ihe Pọl kwuru tupu nke a, ma bụrụkwa ụzọ Igbo nkịtị si egosipụta ihe ndị ahụ.
- source_word: λαλοῦμεν
  choice: anyị na-ekwukwa
  rationale: “Na-ekwu” na-echekwa echiche ikwu okwu dị na λαλέω, ebe “-kwa” na-egosipụta καί.
- source_word: διδακτοῖς ἀνθρωπίνης σοφίας λόγοις
  choice: n'okwu amamihe mmadụ kụziri
  rationale: Nke a na-echekwa okwu dị ka ihe e ji ekwu ihe, ma na-egosi na amamihe mmadụ bụ isi iyi nke nkuzi ahụ.
- source_word: διδακτοῖς πνεύματος
  choice: n'okwu Mmụọ Nsọ kụziri
  rationale: A na-eburu λόγοις n'uche site n'ahịrịokwu gara aga; ịkpọpụta “okwu” n'Igbo na-eme ka ahịrịokwu doo anya. Ọnọdụ gbara ya gburugburu na-egosi na πνεύματος bụ Mmụọ Nsọ.
- source_word: πνευματικοῖς πνευματικὰ συγκρίνοντες
  choice: na-akọwara ndị ime mmụọ ihe ime mmụọ
  rationale: Nke a na-ewere πνευματικοῖς dị ka ndị mmadụ ma na-enye συγκρίνοντες nghọta nke ịkọwa. Ebe okwu Grik ahụ pụkwara izo aka n'okwu ma ọ bụ ihe ime mmụọ, e debere nghọta ọzọ n'okpuru peeji.
theological_decisions:
- issue: Onye πνεύματος na-ezo aka na ya
  choice: Mmụọ Nsọ
  alternative: mmụọ n'ozuzu ya
  rationale: N'okwu gbara amaokwu a gburugburu, Pọl na-ekewapụ Mmụọ Chineke n'amamihe mmadụ; ya mere, ọ bụ Mmụọ Nsọ ka ọ na-ekwu maka ya.
- issue: Ma πνευματικοῖς bụ ndị mmadụ ka ọ bụ ihe/okwu
  choice: ndị ime mmụọ
  alternative: okwu ime mmụọ
  rationale: Ụdị Grik ahụ nwere ike ịbụ oke nwoke ma ọ bụ oke ihe. E tinyere nke mbụ n'ahịrịokwu, ma e chekwara nke ọzọ na nkọwa n'okpuru peeji ka a ghara iwepụ mgbagwoju anya dị n'asụsụ mbụ.
- issue: Ihe συγκρίνοντες pụtara n'ebe a
  choice: na-akọwara
  alternative: na-ejikọta ma ọ bụ na-eji ihe ime mmụọ atụnyere ihe ime mmụọ
  rationale: “Na-akọwara” dabara n'echiche izigara ndị ime mmụọ eziokwu sitere n'aka Mmụọ, ma a naghị ekwu na ọ bụ naanị nghọta okwu Grik ahụ nwere.
translation_notes:
  register: E ji Igbo Izugbe dị ugbu a, nke dị ugwu ma dị mfe nghọta. A họọrọ “ndị ime mmụọ” iji gosi ndị ndụ ha na nghọta ha nọ n'okpuru ọrụ Mmụọ, n'etinyeghị nkọwa pụrụ iche nke otu ụka.
