id: 1CO.2.1
reference: 1 Corinthians 2:1
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Κἀγὼ ἐλθὼν πρὸς ὑμᾶς, ἀδελφοί, ἦλθον οὐ καθ’ ὑπεροχὴν λόγου ἢ σοφίας καταγγέλλων ὑμῖν τὸ ⸀μαρτύριον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/001.yaml
  text: And I[a], when I came to you, brothers, did not come with lofty speech or wisdom[b], proclaiming to you the testimony of God.
translation:
  language: ig
  text: Mụ kwa, ụmụnna[a], mgbe m bịakwutere unu, abịaghị m n’ịdị elu nke okwu ma ọ bụ amamihe, mgbe m na-ekwusara unu àmà nke Chineke.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’ebe a, “ụmụnna” na-ezo aka n’ebe ndị kwere ekwe ibe ya nọ n’ozuzu ha, nke gụnyere ụmụ nwanyị nọ n’ọgbakọ ahụ.
    reason: cultural_note
  - marker: b
    text: Ụfọdụ odide ochie sịrị, “ihe omimi nke Chineke.”
    reason: textual_variant
lexical_decisions:
- source_word: Κἀγὼ
  choice: Mụ onwe m kwa
  rationale: “Kwa” na-egosi njikọ nke καί, ebe “mụ onwe m” na-egosipụta nkwusi ike dị na nnọchiaha ahụ n'ụzọ Igbo si adị.
- source_word: ἐλθὼν … ἦλθον
  choice: mgbe m bịakwutere unu, ejighị m … bịakwute unu
  rationale: A tụgharịrị participle ahụ ka ọ bụrụ nkebiokwu oge, ma debeghachi ngwaa isi ahụ; nke a bụ Igbo eke ma na-echekwa usoro echiche Grik.
- source_word: ἀδελφοί
  choice: ụmụnna
  rationale: “Ụmụnna” bụ okwu nkwanye ùgwù a na-eji akpọ ndị nọ n’otu okwukwe; n’ọnọdụ a ọ pụrụ ịgụnye ma ndị nwoke ma ndị nwanyị, dịka nkọwa ala peeji si kwuo.
- source_word: καθ’ ὑπεροχὴν λόγου ἢ σοφίας
  choice: okwu dị elu ma ọ bụ amamihe
  rationale: Nke a na-egosi okwu e ji eme ngosi ma ọ bụ nke a na-ewere dị elu, yana amamihe, n’ebughị ụzọ kpebie kpọmkwem ụdị ịdị elu ahụ.
- source_word: καταγγέλλων
  choice: mgbe m na-ekwusara
  rationale: Nkebiokwu a na-egosi ihe Pọl nọ na-eme mgbe ọ bịara, ma “na-ekwusara” na-echekwa echiche nke ikwupụta ihe n’ihu ọha.
- source_word: μαρτύριον
  choice: ihe akaebe
  rationale: Nke a kwekọrọ na μαρτύριον dị na SBLGNT ma na-echekwa echiche nke akaebe ma ọ bụ ịgba ama, n’agbanyeghị na ụfọdụ odide nwere okwu ọzọ.
- source_word: τοῦ θεοῦ
  choice: nke Chineke
  rationale: Ụdị njikọta a na-echekwa nghọta dị iche iche genitive ahụ pụrụ inwe—ihe si n’aka Chineke, nke metụtara Chineke, ma ọ bụ nke na-agba ama banyere ya—n’akọwaghị ya n’otu ụzọ naanị.
theological_decisions:
- issue: Ọdịiche odide na μαρτύριον
  choice: ihe akaebe nke Chineke
  alternative: ihe omimi nke Chineke
  rationale: SBLGNT họọrọ μαρτύριον (“ihe akaebe”), ya mere nke ahụ dị n’ahụ amaokwu; a debere μυστήριον (“ihe omimi”) nke ụfọdụ odide nwere n’ala peeji.
- issue: Ihe τοῦ θεοῦ pụtara
  choice: nke Chineke
  alternative: si n’aka Chineke / banyere Chineke
  rationale: A hapụrụ genitive ahụ ka ọ nwee ezigbo nghọta ya dị iche iche kama ikpebi ma Chineke bụ isi mmalite ya ka ọ bụ onye a na-agba ama banyere ya.
translation_notes:
  register: Asụsụ Igbo Izugbe dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji “ụmụnna” mee vocative n’ụzọ Igbo si ekwu ya; a zere okwu ụka pụrụ iche. Akara ala peeji [a] na [b] abụọ dị n’ahụ amaokwu.
