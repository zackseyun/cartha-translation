  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἣν οὐδεὶς τῶν ἀρχόντων τοῦ αἰῶνος τούτου ἔγνωκεν, εἰ γὰρ ἔγνωσαν, οὐκ ἂν τὸν κύριον τῆς δόξης ἐσταύρωσαν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/008.yaml
  text: which none of the rulers of this age has known[a], for if they had known it, they would not have crucified the Lord of glory.
translation:
  language: ig
  text: Nke ọ dịghị onye n’ime ndị ọchịchị nke oge a maara[a]; n’ihi na a sị na ha maara ya, ha agaraghị akpọgide Onyenwe nke ebube n’obe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ndị ọchịchị nke oge a” nwere ike ịbụ ndị ọchịchị mmadụ, ike ime mmụọ, ma ọ bụ ha abụọ.
    reason: alternative_reading
lexical_decisions:
- source_word: ἣν
  choice: Nke
  rationale: Nnọchiaha njikọ a na-ezo aka n’amamihe e kwuru okwu ya tupu amaokwu a; “Nke” na-ejikọta ahịrịokwu ahụ nke ọma n’Igbo.
- source_word: ἀρχόντων
  choice: ndị ọchịchị
  rationale: Ọ na-egosi ndị nwere ikike ịchị, ma hapụkwara ohere ka okwu ahụ zoo aka n’aka ndị ọchịchị mmadụ, ike ime mmụọ, ma ọ bụ ha abụọ.
- source_word: αἰῶνος τούτου
  choice: nke oge a
  rationale: “Oge a” na-echekwa echiche αἰών dị ka oge ma ọ bụ usoro dị ugbu a, kama ịgbanwe ya ka ọ bụrụ naanị ụwa.
- source_word: ἔγνωκεν / ἔγνωσαν
  choice: maara / maara
  rationale: “Ịma” na-anọ nso n’ụdị okwu Grik, ma n’ọnọdụ a ọ pụkwara ịgụnye ịghọta ma ọ bụ ịmata ihe amamihe Chineke pụtara.
- source_word: κύριον
  choice: Onyenwe
  rationale: “Onyenwe” bụ aha nsọpụrụ doro anya ma dịkwa arọ n’echiche okpukpe maka κύριος.
- source_word: δόξης
  choice: ebube
  rationale: “Ebube” bụ okwu Igbo nkịtị ma kwanyere ùgwù nke na-egosipụta δόξα n’ebe a.
- source_word: κύριον τῆς δόξης
  choice: Onyenwe ebube
  rationale: Usoro a na-echekwa njikọ aha dị na Grik ma na-ada nke ọma n’Igbo, na-enweghị ime ya naanị “Onyenwe dị ebube.”
- source_word: ἐσταύρωσαν
  choice: akpọgide ... n’obe
  rationale: Nke a na-egosi kpọmkwem ụdị ọnwụ a kpọrọ mkpọgide n’obe ma bụrụ okwu ndị Igbo na-aghọta ngwa ngwa.
theological_decisions:
- issue: Ndị “ọchịchị nke oge a” bụ ndị ole?
  choice: E dere ya n’enweghị ịkọwa kpọmkwem ndị ọ bụ.
  alternative: Ndị ọchịchị mmadụ naanị; ike mmụọ naanị; ma ọ bụ ha abụọ ọnụ.
  rationale: Okwu Grik ahụ nwere ike izo aka n’aka ndị ọchịchị mmadụ, ike ime mmụọ, ma ọ bụ ha abụọ. Isi ederede na ihe odide ala peeji na-echekwa nghọtahie a n’emeghị mkpebi karịa ihe amaokwu ahụ kwuru.
- issue: Ihe “Onyenwe ebube” pụtara
  choice: Onyenwe ebube
  alternative: Onyenwe ahụ dị ebube
  rationale: Nhọrọ ahụ na-echekwa njikọ genitive dị na κύριον τῆς δόξης na ịdị arọ nke aha ahụ, kama idozi ya ka ọ bụrụ naanị nkọwa àgwà.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Akara [a] dị ozugbo n’azụ okwu ọ na-akọwa. E jidere usoro ọnọdụ megidere eziokwu site n’okwu “a sị na ... ha agaraghị ...”.
