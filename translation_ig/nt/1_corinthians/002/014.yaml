- from: Ma mmadụ nkịtị[a] anaghị anabata ihe ndị sitere n’aka Mmụọ Chineke, n’ihi na ha bụ ihe nzuzu n’anya ya. O nweghịkwa ike ịmata ha, n’ihi na ọ bụ n’ụzọ ime mmụọ ka a na-aghọta ha[b].
  to: Ma mmadụ nkịtị[a] anaghị anabata ihe ndị nke Mmụọ Chineke, n’ihi na ha bụ ihe nzuzu nye ya. O nweghịkwa ike ịmata ha, n’ihi na ọ bụ n’ụzọ ime mmụọ ka a na-aghọta ha[b].
