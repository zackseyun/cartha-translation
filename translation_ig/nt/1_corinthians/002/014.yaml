    text: Ma ọ bụ, “onye na-abụghị onye ime mmụọ.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “a na-atụle ha” ma ọ bụ “a na-enyocha ha.”
    reason: lexical_alternative
  revision_rationale: The revision changes only the phrase for τὰ τοῦ πνεύματος τοῦ θεοῦ from a source-focused expression to a possessive/genitival expression, retaining the source text’s breadth. “Nye ya” also directly expresses the Greek dative (“to him”). All footnote markers and alternatives are retained.
