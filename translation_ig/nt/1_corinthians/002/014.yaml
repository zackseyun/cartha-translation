review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the contrast, rejection, foolishness, inability, and spiritual mode of discernment. However, “ihe ndị sitere n’aka Mmụọ Chineke” means things that come from the Spirit of God and slightly narrows the Greek genitive τὰ τοῦ πνεύματος τοῦ θεοῦ (“the things of/belonging to the Spirit of God”).
  naturalness: The Igbo is clear, modern, and suitably formal. “Mmadụ nkịtị” is a reasonable context-sensitive rendering of ψυχικός, and the two-sentence structure reads naturally.
  terminology: “Mmụọ Chineke,” “ihe nzuzu,” “ịmata,” and “n’ụzọ ime mmụọ” are suitable. The alternative footnotes are correctly anchored and accurately represent the lexical alternatives.
  issues:
  - severity: low
    issue: “ihe ndị sitere n’aka Mmụọ Chineke” renders a genitive relationship as an explicit source relationship.
    rationale: The Greek says “the things of the Spirit of God,” which is deliberately broad. “Ihe ndị nke Mmụọ Chineke” preserves that relationship without specifying that the Spirit is the direct source.
  revised_text: Ma mmadụ nkịtị[a] anaghị anabata ihe ndị nke Mmụọ Chineke, n’ihi na ha bụ ihe nzuzu nye ya. O nweghịkwa ike ịmata ha, n’ihi na ọ bụ n’ụzọ ime mmụọ ka a na-aghọta ha[b].
  revised_footnotes:
