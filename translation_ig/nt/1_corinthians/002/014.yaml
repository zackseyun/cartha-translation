id: 1CO.2.14
reference: 1 Corinthians 2:14
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ψυχικὸς δὲ ἄνθρωπος οὐ δέχεται τὰ τοῦ πνεύματος τοῦ θεοῦ, μωρία γὰρ αὐτῷ ἐστίν, καὶ οὐ δύναται γνῶναι, ὅτι πνευματικῶς ἀνακρίνεται·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/014.yaml
  text: But the natural person does not accept the things of the Spirit of God[a], for they are foolishness to him, and he is not able to know them[b], because they are spiritually discerned.
translation:
  language: ig
  text: Ma mmadụ nkịtị[a] anaghị anabata ihe ndị nke Mmụọ Chineke, n’ihi na ha bụ ihe nzuzu nye ya. O nweghịkwa ike ịmata ha, n’ihi na ọ bụ n’ụzọ ime mmụọ ka a na-aghọta ha[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “onye na-abụghị onye ime mmụọ.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “a na-atụle ha” ma ọ bụ “a na-enyocha ha.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ψυχικὸς
  choice: nkịtị
  rationale: N’ebe a, ψυχικός dị iche na πνευματικός. “Mmadụ nkịtị” na-egosi onye echiche na ikike mmadụ nkịtị na-achị, n’akọwaghị okwu ahụ karịa ihe Grik kwuru.
- source_word: ἄνθρωπος
  choice: mmadụ
  rationale: “Mmadụ” bụ okwu Igbo zuru mmadụ niile ọnụ, kwekọọkwa n’ọrụ ἄνθρωπος dị ka onye nnọchianya mmadụ n’ozuzu.
- source_word: δέχεται
  choice: anaghị anabata
  rationale: “Ịnabata” na-egosi ọ bụghị naanị ịnụ ma ọ bụ ịnata ozi, kama ikwere na ya ma were ya dịka ihe ziri ezi.
- source_word: τὰ τοῦ πνεύματος τοῦ θεοῦ
  choice: ihe ndị sitere n’aka Mmụọ Chineke
  rationale: Nke a na-edebe okwu ahụ sara mbara ma na-egosi njikọ ihe ndị ahụ na Mmụọ Chineke n’ụzọ Igbo doro anya.
- source_word: μωρία
  choice: ihe nzuzu
  rationale: “Ihe nzuzu” na-edebe nnukwu ọdịiche Pọl na-eme n’etiti amamihe Chineke na ikpe mmadụ.
- source_word: γνῶναι
  choice: ịmata ha
  rationale: “Ịmata” na-esochi γνῶναι nke ọma ma na-ahapụ ohere nke ịghọta ma ọ bụ ịghọta uru ihe ndị ahụ, kama ime ka ọ bụrụ naanị inwe ihe ọmụma banyere ha.
- source_word: πνευματικῶς
  choice: n’ụzọ ime mmụọ
  rationale: Nke a bụ nsụgharị kpọmkwem nke adverb ahụ ma na-edebe nghọta ya dịka ụzọ ma ọ bụ ọnọdụ e ji aghọta ihe ndị ahụ.
- source_word: ἀνακρίνεται
  choice: a na-aghọta ha
  rationale: N’ọnọdụ a, okwu ahụ na-ezo aka n’ịmata ma ghọta ihe ndị ahụ nke ọma; ihe odide ala na-edebe echiche ndị ọzọ nke inyocha na ịtụle.
theological_decisions:
- issue: Otú e si sụgharịa ψυχικὸς ἄνθρωπος n’ọdịiche ya na nghọta ime mmụọ
  choice: mmadụ nkịtị
  alternative: onye na-abụghị onye ime mmụọ; onye Mmụọ na-adịghị edu
  rationale: “Mmadụ nkịtị” na-edebe esemokwu dị n’etiti ndụ mmadụ n’onwe ya na nghọta ime mmụọ, n’emeghị ka okwu Grik kwuo kpọmkwem na onye ahụ enweghị Mmụọ.
- issue: Ihe πνευματικῶς pụtara
  choice: n’ụzọ ime mmụọ
  alternative: site na Mmụọ
  rationale: Okwu Grik nwere ike ịkọwa ụzọ ma ọ bụ ọnọdụ nke nghọta ahụ. Nsụgharị a na-edebe ịdị obosara ahụ kama ikpebi na ọ pụtara naanị ọrụ Mmụọ kpọmkwem.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta, dee ya. E kewara ahịrịokwu ahụ ụzọ abụọ ka ọ na-aga nke ọma n’Igbo, ma e debere njikọ echiche na nkwugharị nnọchiaha dị na Grik.
