source:
  edition: SBLGNT
  text: Σοφίαν δὲ λαλοῦμεν ἐν τοῖς τελείοις, σοφίαν δὲ οὐ τοῦ αἰῶνος τούτου οὐδὲ τῶν ἀρχόντων τοῦ αἰῶνος τούτου τῶν καταργουμένων·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/006.yaml
  text: Yet we do speak wisdom among the mature[a], but not a wisdom of this age or of the rulers of this age[c][b], who are being brought to nothing.
translation:
  language: ig
  text: Ma anyị na-ekwu amamihe n’etiti ndị tozuru okè[a]; ma ọ bụghị amamihe nke oge a, ọ bụghịkwa nke ndị ọchịchị nke oge a[c], bụ ndị a na-eme ka ha ghara ịdị irè[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị zuru okè”; n’ebe a, o yikarịrị ka ọ na-ezo aka ná ndị tozuru okè n’ime mmụọ.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ndị na-agabiga,” “ndị a na-ewepụ,” ma ọ bụ “ndị a na-eme ka ha bụrụ ihe efu.”
    reason: lexical_alternative
  - marker: c
    text: “Ndị ọchịchị nke oge a” nwere ike ịpụta ndị ọchịchị mmadụ, ike ime mmụọ, ma ọ bụ ha abụọ.
    reason: alternative_reading
lexical_decisions:
- source_word: Σοφίαν
  choice: amamihe
  rationale: Nke a bụ nsụgharị Igbo kachasị kwekọọ na σοφία; e jikwa otu okwu ahụ mee ihe ugboro abụọ iji debe nkwughachi na nkwusi okwu nke Grik.
- source_word: δὲ
  choice: Ma
  rationale: Ọ na-egosi ọdịiche dị n’etiti ihe a na-ekwu ebe a na okwu ndị bu ya ụzọ.
- source_word: λαλοῦμεν
  choice: anyị na-ekwu okwu
  rationale: λαλέω pụtara ikwu okwu n’ụzọ bụ isi; nsụgharị a adịghị eme ka ọ bụrụ kpọmkwem ‘ikwusa ozi’ karịa ka isi mmalite kwuru.
- source_word: ἐν τοῖς τελείοις
  choice: n’etiti ndị tozuru etozu
  rationale: N’ebe a τέλειος yikarịrị ka ọ na-ezo aka ná ntozu, ọ bụghị izu okè nke enweghị mmehie. ‘N’etiti’ na-egosipụta akpaalaokwu Grik nke ọma n’Igbo.
- source_word: οὐ τοῦ αἰῶνος τούτου
  choice: ọ bụghị amamihe nke oge a
  rationale: ‘Oge a’ na-edebe echiche temporal nke αἰών, n’ejighị ‘ụwa’ dochie ya. E kwughachiri ‘amamihe’ ka ahịrịokwu Igbo doo anya ma debe usoro Grik.
- source_word: ἀρχόντων
  choice: ndị ọchịchị
  rationale: Okwu a sara mbara nke na ọ naghị ekpebi ma ndị a bụ ndị ọchịchị mmadụ, ike ime mmụọ, ma ọ bụ ha abụọ.
- source_word: τῶν καταργουμένων
  choice: bụ́ ndị a na-eme ka ha ghara ịdị ire
  rationale: Nke a na-egosipụta echiche καταργέω nke ime ka ihe ghara ịrụ ọrụ ma ọ bụ ghara ịdị ike, tinyere omume na-aga n’ihu nke participle dị ugbu a.
theological_decisions:
- issue: Ndị okwu ahụ ‘ndị ọchịchị nke oge a’ na-ezo aka na ha
  choice: E debere ‘ndị ọchịchị’ n’ụzọ sara mbara n’akọwaghị ma ha bụ mmadụ ma ọ bụ ike ime mmụọ.
  alternative: Ndị ọchịchị mmadụ naanị; ike ime mmụọ naanị; ma ọ bụ ha abụọ.
  rationale: Nkebiokwu Grik anaghị amanye otu nkọwa n’ime ndị a; nsụgharị ahụ na-edebe ejighị n’aka na esemokwu nkọwa ahụ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E debere nkwughachi ‘amamihe’ na nghọtahie nke okwu ‘ndị ọchịchị’; e zere okwu ụka pụrụ iche na nkọwa na-ekpebi ihe Grik hapụrụ ghe oghe.
