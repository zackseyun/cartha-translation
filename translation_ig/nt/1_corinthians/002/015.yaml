review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves the comprehensive scope of τὰ πάντα and the repeated assessment verb ἀνακρίνει/ἀνακρίνεται. However, “onye Mmụọ Nsọ na-achị” means specifically “a person whom the Holy Spirit rules/governs,” adding the distinct idea of rule or governance that πνευματικός does not itself state. “Onye nke Mmụọ Nsọ” more directly represents a person characterized by or belonging to the Spirit in this context. The revised wording also makes αὐτός emphatic with “ya onwe ya.”
  naturalness: “Onye nke Mmụọ Nsọ” and “na-atụle” are clear, dignified Standard Igbo suitable for this register. “Ma ya onwe ya, ọ dịghị onye pụrụ ịtụle ya” is natural and makes the contrast and emphasis explicit without forcing an unnatural passive construction.
  terminology: “Mmụọ Nsọ” appropriately reflects the referent established by the immediate context. “Na-atụle” suitably conveys ἀνακρίνω as assessment/discernment, and its repetition preserves the Greek verbal repetition without importing a final-condemnation sense.
  issues:
  - severity: medium
    issue: “onye Mmụọ Nsọ na-achị” adds the notion that the Spirit governs or rules the person.
    rationale: πνευματικός denotes one characterized by the Spirit; it does not lexically contain the verbal idea “na-achị.” This should not be added to the main text.
  - severity: low
    issue: The emphatic αὐτός is not clearly represented.
    rationale: The existing “ya” is required by the object construction and does not reliably convey the Greek emphasis. “Ya onwe ya” represents it plainly.
  - severity: low
    issue: The cultural footnote explains the added expression rather than the Greek adjective itself.
    rationale: Once the main text is corrected, the note should describe the substantival masculine singular adjective and its generic reference without claiming that “na-achị” translates it.
  revised_text: Ma onye nke Mmụọ Nsọ na-atụle ihe niile[b][a], ma ya onwe ya, ọ dịghị onye pụrụ ịtụle ya.
