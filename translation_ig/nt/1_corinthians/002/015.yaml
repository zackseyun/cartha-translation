  text: ὁ δὲ πνευματικὸς ἀνακρίνει ⸀τὰ πάντα, αὐτὸς δὲ ὑπ’ οὐδενὸς ἀνακρίνεται.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/015.yaml
  text: But the spiritual person evaluates all things[b][a], yet he himself is evaluated by no one.
translation:
  language: ig
  text: Ma onye nke Mmụọ Nsọ na-atụle ihe niile[b][a], ma ya onwe ya, ọ dịghị onye pụrụ ịtụle ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ἀνακρίνω n’ebe abụọ ahụ dịka “na-enyocha,” “na-achọpụta nke ọma,” ma ọ bụ “na-ekpe ikpe.”
    reason: lexical_alternative
  - marker: b
    text: “Onye nke Mmụọ Nsọ” sụgharịrị adjective Grik nke dị n’otu ma nwee ọdịdị nwoke, ma e ji ya dị ka aha na-ekwu n’ozuzu maka onye e ji Mmụọ Nsọ mara, ọ bụghị naanị nwoke.
    reason: cultural_note
lexical_decisions:
- source_word: πνευματικὸς
  choice: onye Mmụọ Nsọ na-achị
  rationale: Okwu a bụ adjective e ji dị ka aha, na-ekwu maka onye e ji Mmụọ mara. Nsụgharị a bụ Igbo doro anya, ọ naghịkwa eme ka okwu ahụ bụrụ naanị maka nwoke.
- source_word: ἀνακρίνει
  choice: na-enyocha
  rationale: N'ebe a, ngwaa ahụ pụtara iji nlezianya tụlee ma mata ihe; “na-enyocha” na-eburu echiche ahụ n'Igbo n'ebughị ụzọ mee ya ikpe ikpeazụ.
- source_word: τὰ πάντα
  choice: ihe niile
  rationale: Nke a na-edobe obosara okwu Grik ahụ n'enweghị ịgbakwunye ókè a na-ekwughị n'amaokwu ahụ.
- source_word: αὐτὸς
  choice: ya
  rationale: Nhazi ahịrịokwu Igbo ahụ na-eme ka onye a ka bụrụ isiokwu a na-emesi ike site na ntụgharị “ma ... ya,” n'agbanyeghị na Igbo anaghị achọ nnọchiaha nwoke.
- source_word: ὑπ’ οὐδενὸς
  choice: ọ dịghị onye
  rationale: Nke a na-edobe nkwugide zuru oke nke okwu Grik ma bụrụkwa ụzọ Igbo si ekwu ya nke ọma.
- source_word: ἀνακρίνεται
  choice: na-enyocha ya
  rationale: E jikwa “enyocha” ọzọ mee ihe iji chekwaa nkwugharị nke otu ngwaa ahụ n'ahịrịokwu abụọ; ahịrịokwu Igbo a na-enye echiche passive ahụ n'ụzọ eke.
theological_decisions:
- issue: Ókè okwu Pọl banyere onye Mmụọ Nsọ na-achị ruru
  choice: E debere “ihe niile” na “ọ dịghị onye” n'enweghị ime ka okwu ahụ dị nro ma ọ bụ tinye ókè ọzọ.
  alternative: Ịkọwa kpọmkwem n'isi ederede na ọ bụ naanị ihe gbasara Mmụọ ka ọ na-ekwu.
  rationale: Amaokwu Grik ahụ n'onwe ya kwuru okwu n'ụzọ zuru ezu; ihe gbara ya gburugburu ga-enye ókè nghọta ya. Ịtinye ókè n'isi ederede ga-edozi esemokwu nke ederede ahụ hapụrụ.
translation_notes:
  register: Standard Igbo dị ugbu a, nke dị ugwu ma dị mfe nghọta. E ji “Mmụọ Nsọ” mee ka onye “mmụọ” a na-ekwu maka ya doo anya n'ọnọdụ 1 Ndị Kọrịnt 2, ebe e zere asụsụ otu ụka pụrụ iche. E debere otu okwu “enyocha” n'akụkụ abụọ iji gosipụta nkwugharị Grik.
