id: 1CO.12.2
reference: 1 Corinthians 12:2
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οἴδατε ὅτι ὅτε ἔθνη ἦτε πρὸς τὰ εἴδωλα τὰ ἄφωνα ὡς ἂν ἤγεσθε ἀπαγόμενοι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/002.yaml
  text: You know that when you were Gentiles[a], you were led away to the mute idols[b], however you were led.
translation:
  language: ig
  text: Unu maara na mgbe unu bụ ndị mba ọzọ[a], a na-eduru unu pụọ gaa n’ebe arụsị ndị na-apụghị ikwu okwu nọ, n’ụzọ ọ bụla e si edu unu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị na-abụghị ndị Juu.” N’ebe a, okwu Grik ahụ nwekwara ike ịgụnye ọnọdụ ndụ ha n’okpukpe arụsị.
    reason: lexical_alternative
  - marker: b
    text: 'N’ụzọ dị nso n’usoro Grik: “a na-eduru unu pụọ gaa n’ebe arụsị ndị na-apụghị ikwu okwu nọ, otu ọ bụla e si edu unu.” Okwu Grik na-emesi ike na ha bụ ndị a na-edu n’okpuru mmetụta ọzọ.'
    reason: source_structure_and_passive_emphasis
lexical_decisions:
- source_word: οἴδατε
  choice: Unu maara
  rationale: Nke a bụ ụzọ Igbo kwụ ọtọ ma dị mfe isi kpọkuo ihe ndị a na-agwa okwu maralarị.
- source_word: ἔθνη
  choice: ndị mba ọzọ
  rationale: Okwu a na-echekwa echiche banyere ndị na-abụghị ndị Juu na ọnọdụ okpukpe ha gara aga, n’etinyeghị okwu mkparị.
- source_word: πρὸς τὰ εἴδωλα τὰ ἄφωνα
  choice: gaa n’ebe arụsị ndị na-apụghị ikwu okwu nọ
  rationale: “Gaa n’ebe” na-egosi ngagharị chere ihu n’ebe arụsị nọ; “ndị na-apụghị ikwu okwu” na-eme ka ἄφωνα doo onye Igbo nke oge a anya ma chekwaa ọdịiche ya na okwu sitere n’ike Mmụọ Nsọ n’akụkụ amaokwu a.
- source_word: ἤγεσθε ἀπαγόμενοι
  choice: a na-eduru unu pụọ
  rationale: Ụdị a na-egosi omume gara n’ihu n’oge gara aga nakwa na ha bụ ndị ike ọzọ na-edu, dịka imperfect passive na participle si kwusi ike.
- source_word: ὡς ἂν
  choice: n’ụzọ ọ bụla
  rationale: 'Nke a na-egosipụta ike okwu na-akọwaghị otu ụzọ kpọmkwem: n’ụzọ ọ bụla ha si bụrụ ndị a na-edu.'
theological_decisions:
- issue: Ihe ἔθνη pụtara banyere ndụ ndị Kọrịnt gara aga
  choice: ndị mba ọzọ
  alternative: ndị na-abụghị ndị Juu; ndị ọgọ mmụọ
  rationale: “Ndị mba ọzọ” na-echekwa akụkụ agbụrụ na nke okpukpe nke okwu Pọl n’enweghị ịgbakwunye ikpe omume siri ike nke okwu “ndị ọgọ mmụọ” nwere ike ibu.
- issue: Ọdịiche dị n’etiti arụsị na-adịghị ekwu okwu na okwu sitere n’ike Mmụọ Nsọ
  choice: arụsị ndị na-apụghị ikwu okwu
  alternative: arụsị ndị dara ogbi
  rationale: Nsụgharị a na-echekwa isi ihe Pọl kwuru banyere enweghị ike arụsị ikwu okwu, ma ọ naghị akọwakwu nkà mmụta okpukpe karịa ihe amaokwu ahụ kwuru.
- issue: Ike passive dị na ἤγεσθε ἀπαγόμενοι
  choice: a na-eduru unu pụọ
  alternative: e duuru unu pụọ
  rationale: “A na-eduru” na-egosi na omume ahụ na-aga n’ihu ma na ha anọghị n’ọrụ dịka ndị na-edu onwe ha; nke a na-echekwa nrụgide nke Greek n’enweghị ịkọwa onye ma ọ bụ ihe na-edu ha.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E zere okwu ochie “ndị ogbi” maka arụsị site n’ịsị “ndị na-apụghị ikwu okwu,” nke na-akọwa ihe ahụ kpọmkwem. A hapụrụ onye ma ọ bụ ike na-edu ha n’amaghị ama dịka ederede Grik si mee.
