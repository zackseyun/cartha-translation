id: 1CO.12.6
reference: 1 Corinthians 12:6
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ διαιρέσεις ἐνεργημάτων εἰσίν, ⸂ὁ δὲ⸃ ⸀αὐτὸς θεός, ὁ ἐνεργῶν τὰ πάντα ἐν πᾶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/006.yaml
  text: And there are varieties of workings[b][a], but it is the same God who works all things in all people.
translation:
  language: ig
  text: E nwekwara ụdị ọrụ dị iche iche, ma ọ bụ otu Chineke ahụ na-arụ ihe niile n’ime mmadụ niile.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’ụzọ nkịtị, “n’ime ha niile.” Grik ekwughị aha ahụ kpọmkwem; gburugburu okwu a na-egosi na ọ na-ekwu maka mmadụ, ya bụ, ndị otu niile Chineke na-arụ ọrụ ndị a n’ime ha.
    reason: lexical_alternative
lexical_decisions:
- source_word: διαιρέσεις
  choice: ụdị ... dị iche iche
  rationale: Nkebi okwu a na-egosi ụdị dịgasị iche iche n’enweghị echiche nke esemokwu ma ọ bụ nkewa n’etiti ndị kwere ekwe.
- source_word: ἐνεργημάτων
  choice: ọrụ
  rationale: “Ọrụ” bụ okwu Igbo doro anya ma kwekọọ na ngwaa “na-arụ” e ji sụgharịa ἐνεργῶν, si otú ahụ chekwaa njikọ okwu Pọl ji mee ihe.
- source_word: ὁ δὲ αὐτὸς θεός
  choice: ma ọ bụ otu Chineke ahụ
  rationale: “Ma” na-egosi obere ọdịiche dị n’etiti ụdị ọrụ dị iche iche na otu Chineke bụ isi iyi ha; “otu Chineke ahụ” na-emesi njirimara ya ike.
- source_word: ὁ ἐνεργῶν
  choice: na-arụ
  rationale: Ọ na-egosi ọrụ Chineke na-aga n’ihu ma na-ejigide njikọ ya na aha “ọrụ” dị na mbido amaokwu ahụ.
- source_word: τὰ πάντα
  choice: ihe niile
  rationale: Nke a na-edebe obosara okwu Grik n’ebughị ụzọ mee ka ọ bụrụ naanị onyinye ime mmụọ, ọ bụ ezie na onyinye ndị ahụ bụ ihe gbara amaokwu ahụ gburugburu.
- source_word: ἐν πᾶσιν
  choice: n’ime mmadụ niile
  rationale: N’ọnọdụ a, ọ kacha dabara na Pọl na-ekwu maka ndị nọ n’ọgbakọ Chineke na-arụ ọrụ n’ime ha. A na-edebe ụdị okwu Grik nke na-ekwughị aha ahụ kpọmkwem n’ihe odide ala peeji.
theological_decisions:
- issue: Ókè ọrụ Chineke dị na τὰ πάντα ἐν πᾶσιν
  choice: “na-arụ ihe niile n’ime mmadụ niile”
  alternative: “na-arụ ihe niile n’ime ha niile” ma ọ bụ “na-arụ ihe niile n’ime ihe niile”
  rationale: Nsụgharị ahụ na-edebe obosara τὰ πάντα, ma gburugburu okwu ahụ na-akwado na πᾶσιν na-ezo aka n’ụmụ mmadụ nọ n’ọgbakọ. Ihe odide ala peeji na-echekwa eziokwu ahụ na Grik ekwughị aha ahụ hoo haa.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta, dee ya. Njikọ dị n’etiti “ọrụ” na “na-arụ” na-eme ka egwuregwu okwu Grik dịgide n’ụzọ dabara adaba n’Igbo.
