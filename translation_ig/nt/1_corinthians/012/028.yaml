  to: Chineke edobela n’ọgbakọ, nke mbụ, ndị ozi; nke abụọ, ndị amụma; nke atọ, ndị nkuzi; e mesịa, ọrụ ebube[a]; e mesịa, onyinye nke ọgwụgwọ dị iche iche; enyemaka; nchịkwa[b]; na ụdị ire dị iche iche[c].
