id: 1CO.12.28
reference: 1 Corinthians 12:28
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ οὓς μὲν ἔθετο ὁ θεὸς ἐν τῇ ἐκκλησίᾳ πρῶτον ἀποστόλους, δεύτερον προφήτας, τρίτον διδασκάλους, ἔπειτα δυνάμεις, ⸀ἔπειτα χαρίσματα ἰαμάτων, ἀντιλήμψεις, κυβερνήσεις, γένη γλωσσῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/028.yaml
  text: And God has appointed in the church first apostles[a], second prophets, third teachers, then miracles, then gifts of healings, helps, administrations[c][b], kinds of tongues.
translation:
  language: ig
  text: Chineke edobela n’ọgbakọ, nke mbụ, ndị ozi; nke abụọ, ndị amụma; nke atọ, ndị nkuzi; e mesịa, ọrụ ebube[a]; e mesịa, onyinye nke ọgwụgwọ dị iche iche; enyemaka; nchịkwa[b]; na ụdị ire dị iche iche[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “ọrụ ike.”
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya “nduzi” ma ọ bụ “ụdị idu ndú.”
    reason: lexical_alternative
  - marker: c
    text: A pụkwara ịsụgharị ya “ụdị asụsụ dị iche iche.” Okwu Grik ahụ nwere ike ịpụta “ire” ma ọ bụ “asụsụ”; nsụgharị a anaghị ekpebi kpọmkwem ụdị okwu Pọl bu n’obi n’ebe a.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔθετο
  choice: edobela
  rationale: “Edobela” na-egosi na Chineke tinyere ma họpụta ndị a na ọrụ ndị a n’ọgbakọ, ma na-ezere ime ka okwu ahụ bụrụ naanị itinye ihe n’ebe nkịtị.
- source_word: ἐν τῇ ἐκκλησίᾳ
  choice: n’ọgbakọ
  rationale: “Ọgbakọ” na-egosi ndị Chineke kpọkọtara, ma bụrụ okwu Igbo doro anya nke dabara n’ọnọdụ Pọl na-ekwu maka otu ahụ Kraịst.
- source_word: πρῶτον ... δεύτερον ... τρίτον
  choice: nke mbụ ... nke abụọ ... nke atọ
  rationale: Usoro a na-edebe nhazi okwu Grik n’emeghị mkpebi ma ọ̀ bụ ọkwa, usoro oge, ka ọ bụ ịdị mkpa ka Pọl bu n’obi.
- source_word: ἀποστόλους
  choice: ndị ozi
  rationale: “Ndị ozi” bụ okwu Igbo a na-aghọta nke ọma maka ndị e zitere, ma n’ebe a ọ na-ezo aka n’ọrụ ndịozi a maara n’ọgbakọ.
- source_word: προφήτας
  choice: ndị amụma
  rationale: Nke a bụ nsụgharị Igbo kwụ ọtọ maka ndị na-ekwu okwu amụma.
- source_word: διδασκάλους
  choice: ndị nkuzi
  rationale: Ọ na-egosi ndị na-arụ ọrụ izi ndị ọzọ ihe n’ọgbakọ.
- source_word: δυνάμεις
  choice: ọrụ ebube
  rationale: Ọ bụ ezie na okwu Grik ahụ pụtara ike n’ụzọ nkịtị, n’usoro onyinye a ọ na-ezo aka n’ọrụ ike pụrụ iche. “Ọrụ ebube” na-eme ka nghọta ahụ doo ndị na-agụ akwụkwọ anya; ihe ọzọ e nwere dị n’ala peeji.
- source_word: χαρίσματα ἰαμάτων
  choice: onyinye nke ọgwụgwọ dị iche iche
  rationale: Nsụgharị a na-edebe echiche ọtụtụ nke okwu abụọ ahụ n’asụsụ Grik ma bụrụkwa Igbo sitere n’ọnụ mmadụ.
- source_word: ἀντιλήμψεις
  choice: enyemaka
  rationale: Ọ na-egosi ikike ma ọ bụ ọrụ nke ịkwado na inyere ndị ọzọ aka.
- source_word: κυβερνήσεις
  choice: nchịkwa
  rationale: “Nchịkwa” na-egosi ọrụ ịhazi na iduzi ihe n’ọgbakọ n’etinyeghị echiche nke ọkwa ọchịchị siri ike.
- source_word: γένη γλωσσῶν
  choice: ụdị asụsụ dị iche iche
  rationale: “Asụsụ” nwere ike ịpụta ụdị okwu mmadụ na-asụ, ma ọ bụ onyinye a na-akpọ ịsụ asụsụ dị iche iche. Ihe e dere n’ala peeji na-echekwa ihe okwu Grik ahụ nwekwara ike ịpụta n’ụzọ nkịtị.
theological_decisions:
- issue: Ma usoro “nke mbụ ... nke abụọ ... nke atọ” ọ̀ na-egosi ọkwa ọchịchị, usoro oge, ma ọ bụ ịdị mkpa nke ọrụ
  choice: E debere usoro okwu ahụ kpọmkwem n’enweghị nkọwa ọzọ.
  alternative: Ịkọwa ya dị ka ọkwa ikike na-adịgide adịgide, usoro oge, ma ọ bụ nhazi dịka ịdị mkpa si dị.
  rationale: Amaokwu ahụ gosiri na e nwere usoro, ma ọ kọwaghị kpọmkwem ụdị usoro ọ bụ. Nsụgharị ahụ ekwesịghị ikpebi ihe ederede ahụ na-ekpebighị.
- issue: Ihe γλῶσσαι pụtara n’ebe a
  choice: Jiri “asụsụ dị iche iche” n’ahịrịokwu bụ isi, tinyekwa nkọwa na okwu Grik nwere ike ịpụta “ire” ma ọ bụ “asụsụ.”
  alternative: Ịkọwa ya naanị dị ka asụsụ mmadụ ndị a maara, ma ọ bụ naanị dị ka okwu mmụọ na-abụghị asụsụ mmadụ.
  rationale: Ederede ahụ n’onwe ya anaghị edozi arụmụka banyere ụdị okwu ahụ kpamkpam; ya mere, nsụgharị ahụ na-echekwa ohere nghọta abụọ ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E debere usoro ndepụta nke Grik, ma zere okwu ga-etinye ozizi otu ụka n’ime amaokwu ahụ. Akara ala peeji [a], [b], na [c] niile pụtara n’ebe okwu ha na-akọwa dị n’ahịrịokwu bụ isi.
