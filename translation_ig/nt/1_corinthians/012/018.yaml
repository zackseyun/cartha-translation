  text: ⸀νυνὶ δὲ ὁ θεὸς ἔθετο τὰ μέλη, ἓν ἕκαστον αὐτῶν, ἐν τῷ σώματι καθὼς ἠθέλησεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/018.yaml
  text: But as it is[a], God arranged the members, each one of them[b], in the body just as he desired.
translation:
  language: ig
  text: Ma ugbu a, Chineke edobela akụkụ ọ bụla n’ime ahụ, dị ka ọ chọrọ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “haziela.”
    reason: lexical_alternative
lexical_decisions:
- source_word: νυνὶ δὲ
  choice: Ma otú ọ dị ugbu a bụ na
  rationale: Nkebiokwu a na-egosi ọdịiche n’ihe Pọl kwuru tupu ya ma na-alaghachi n’otú ihe dị n’ezie; nsụgharị a bụ Igbo doro anya ma dịkwa ebumpụta ụwa.
- source_word: ὁ θεὸς
  choice: Chineke
  rationale: Nke a bụ nsụgharị kwụ ọtọ nke onye na-eme ihe n’ahịrịokwu ahụ.
- source_word: ἔθετο
  choice: ahaziela
  rationale: N’ọmụmaatụ ahụ mmadụ a, okwu a na-egosi na Chineke ji ebumnuche dozie ma debe akụkụ dị iche iche n’ọnọdụ ha, ọ bụghị nanị na ọ tụbara ha ebe.
- source_word: τὰ μέλη
  choice: akụkụ ahụ dị iche iche
  rationale: N’ebe a μέλη bụ akụkụ dị iche iche nke otu ahụ; okwu Igbo a na-eme ka ihe atụ ahụ mmadụ doo anya ma ghara ime ka ọ bụrụ naanị aka na ụkwụ.
- source_word: ἓν ἕκαστον αὐτῶν
  choice: nke ọ bụla n’ime ha
  rationale: Nke a na-echekwa nkwusi okwu Grik ahụ na akụkụ nke ọ bụla n’otu n’otu.
- source_word: ἐν τῷ σώματι
  choice: n’ime ahụ
  rationale: Ọ bụ nsụgharị ebumpụta ụwa nke ọnọdụ akụkụ ndị ahụ n’otu ahụ ahụ; ihe atụ a na-emesịa metụta ọgbakọ n’okwu gbara ya gburugburu.
- source_word: καθὼς ἠθέλησεν
  choice: dị nnọọ ka ọ chọrọ
  rationale: Nke a na-echekwa echiche nke ọchịchọ na ebumnuche Chineke n’asụsụ Igbo nke ndị mmadụ na-aghọta ngwa ngwa.
theological_decisions:
- issue: Ebumnuche Chineke n’ịhazi akụkụ dị iche iche n’ime ahụ
  choice: Chineke ji ebumnuche hazie akụkụ nke ọ bụla dị ka ọ chọrọ.
  alternative: Ịsụgharị ya dị ka nanị idebe akụkụ ndị ahụ ebe, n’emeghị ka nhazi nwere ebumnuche pụta ìhè.
  rationale: Arụmụka Pọl bụ na ịdị iche iche nke akụkụ ahụ abụghị ihe mere na mberede, kama na Chineke haziri ya. “Ahaziela” na “dị nnọọ ka ọ chọrọ” na-echekwa nke a n’etinyeghị ozizi sara mbara nke amaokwu ahụ ekwughị.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta mee ihe. “Akụkụ ahụ dị iche iche” na-eme ka ihe atụ ahụ mmadụ doo anya, ebe “nke ọ bụla n’ime ha” na-echekwa nkwusi okwu dị n’asụsụ Grik. E debere akara nkọwa ụkwụ n’ebe okwu ndị nkọwa ahụ metụtara dị.
