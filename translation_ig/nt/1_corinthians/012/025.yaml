review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the purpose clause, the body metaphor, and the reciprocal care of the members. However, “ọ bụla” (“any”) is not represented in the Greek and should not be added. “otu aka” can suggest acting unanimously or jointly, but it does not clearly express τὸ αὐτό with μεριμνῶσι as the same/shared mutual concern.
  naturalness: “Ka akụkụ ahụ niile na-elekọtakwa ibe ha otu aka” is understandable, but the final expression is less precise and somewhat awkward for the intended sense. “Ka akụkụ ahụ na-enwe otu nlekọta maka ibe ha” is natural Standard Igbo and clearly states shared/equal concern.
  terminology: “Nkewa,” “ahụ,” and “akụkụ ahụ” appropriately preserve the metaphor and register. The alternate “mgbawa” is acceptable as a lexical note for the image of a split/tear, though “nkewa” remains the clearer main rendering in this context.
  issues:
  - severity: medium
    issue: The phrase “nkewa ọ bụla” adds “ọ bụla” (“any”).
    rationale: σχίσμα is indefinite after μὴ ᾖ (“that there may not be division/a division”); it does not contain a term corresponding to “any.”
  - severity: medium
    issue: “otu aka” is not a sufficiently precise rendering of τὸ αὐτό in this clause.
    rationale: 'In this context τὸ αὐτό modifies the members’ mutual care: they are to have the same/shared concern for one another. “otu aka” more readily denotes unity of action or agreement than the content and equality of care.'
  revised_text: ka nkewa[a] ghara ịdị n’ahụ, kama ka akụkụ ahụ na-enwe otu nlekọta[b] maka ibe ha.
