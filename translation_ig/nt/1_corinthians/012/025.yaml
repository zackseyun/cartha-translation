    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ka akụkụ ahụ na-echebara ibe ha echiche n’otu ụzọ ahụ.”
    reason: lexical_alternative
  revision_rationale: The revision removes the unsupported “ọ bụla” and replaces “otu aka” with “otu nlekọta,” which more directly communicates the same/shared concern expressed by τὸ αὐτό ... μεριμνῶσι. It retains the body metaphor, reciprocal sense, modern Standard Igbo register, and the lexical ambiguity of σχίσμα in the note.
