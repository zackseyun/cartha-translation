- from: ka nkewa[a] ọ bụla ghara ịdị n’ahụ, kama ka akụkụ ahụ niile na-elekọtakwa ibe ha otu aka[b].
  to: ka nkewa[a] ghara ịdị n’ahụ, kama ka akụkụ ahụ na-enwe otu nlekọta[b] maka ibe ha.
  rationale: The revision removes the unsupported “ọ bụla” and replaces “otu aka” with “otu nlekọta,” which more directly communicates the same/shared concern expressed by τὸ αὐτό ... μεριμνῶσι. It retains the body metaphor, reciprocal sense, modern Standard Igbo register, and the lexical ambiguity of σχίσμα in the note.
