reference: 1 Corinthians 12:25
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἵνα μὴ ᾖ ⸀σχίσμα ἐν τῷ σώματι, ἀλλὰ τὸ αὐτὸ ὑπὲρ ἀλλήλων μεριμνῶσι τὰ μέλη.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/025.yaml
  text: so that there may be no division in the body[b][a], but that the members may have the same concern for one another.
translation:
  language: ig
  text: ka nkewa[a] ghara ịdị n’ahụ, kama ka akụkụ ahụ na-enwe otu nlekọta[b] maka ibe ha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “mgbawa.” Okwu Grik ahụ nwere ike ịpụta mgbawa ma ọ bụ nkewa dị n’ime ahụ.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ka akụkụ ahụ na-echebara ibe ha echiche n’otu ụzọ ahụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: ka ... ghara ... kama ka
  rationale: Ọ na-egosi nzube ma ọ bụ ihe a chọrọ ka o si na ya pụta; nhazi a bụ nke e ji asụ Igbo n'ụzọ doro anya.
- source_word: σχίσμα
  choice: nkewa
  rationale: Ọ pụtara mgbawa ma ọ bụ nkewa dị n’otu ihe; “nkewa” dabara n’ihe atụ nke ahụ ma ghara ibubata okwu ụka e mechara nye nkọwa pụrụ iche.
- source_word: σῶμα
  choice: ahụ
  rationale: Ọ na-edobe ihe atụ Pọl ji ahụ mmadụ tụnyere ọgbakọ.
- source_word: τὸ αὐτό
  choice: otu aka
  rationale: N’ọnọdụ a, ọ na-akọwa ịdị nhata n’otú akụkụ ahụ si echebara ibe ha echiche; “otu aka” bụ Igbo dị mfe nke na-egosi nlekọta nha anya.
- source_word: ὑπὲρ ἀλλήλων
  choice: ibe ha
  rationale: Ọ na-egosi na nlekọta ahụ na-aga n’ebe onye ọ bụla nọ, ya bụ, nlekọta e nwere n’etiti ibe ha.
- source_word: μεριμνῶσι
  choice: na-elekọtakwa
  rationale: N’ebe a ngwaa ahụ na-egosi nlekọta na nchebara echiche dị mma, ọ bụghị nchegbu na-akpagbu mmadụ.
- source_word: μέλη
  choice: akụkụ ahụ niile
  rationale: N’Igbo, “akụkụ ahụ” na-egosi body parts nke ọma ma na-edobe ihe atụ ahụ; “niile” na-eme ka ọtụtụ akụkụ ndị ahụ doo anya.
theological_decisions:
- issue: Ntughari σχίσμα n’ihe atụ gbasara ahụ na ọgbakọ
  choice: nkewa
  alternative: mgbawa
  rationale: “Nkewa” na-egosi enweghị ịdị n’otu n’ime ahụ/ọgbakọ ma ghara ime ka okwu ahụ bụrụ aha nkà mmụta ụka pụrụ iche.
- issue: Ihe τὸ αὐτό pụtara n’ihe metụtara nlekọta ibe ha
  choice: na-elekọtakwa ibe ha otu aka
  alternative: nwee otu nchebara echiche ahụ maka ibe ha
  rationale: “Otu aka” na-egosi nlekọta nha anya, ma isiokwu Grik nwekwara ike ịbụ na akụkụ niile nwere otu ụdị nchebara echiche maka ibe ha; e debere ihe ọzọ ahụ na nkọwa ala peeji.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe ma dị ugwu. “Akụkụ ahụ” na-edobe ihe atụ ahụ n'ụzọ onye nkịtị ga-aghọta; “na-elekọtakwa ibe ha otu aka” na-egosi nlekọta na-adị n’etiti akụkụ niile n’ụzọ nha anya.
