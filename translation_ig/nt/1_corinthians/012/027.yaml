translation:
  language: ig
  text: Ma unu bụ ahụ Kraịst, unu bụkwa akụkụ ya n’otu n’otu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’asụsụ Grik, nkebiokwu a bụ n’ụzọ nkịtị “akụkụ site n’otu akụkụ”; n’ebe a ọ pụtara na unu n’otu n’otu bụ akụkụ nke ahụ ahụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὑμεῖς
  choice: unu
  rationale: Nnọchiaha onye nke abụọ n’ọnụọgụ ọtụtụ na-ezo aka n’ọgbakọ ndị Kọrịnt niile; ikwupụta ya n’ihu ahịrịokwu ahụ na-edobe nkwusi ike dị na Grik.
- source_word: δέ
  choice: Ma
  rationale: Ọ na-egosi ngafe site n’ihe atụ banyere ahụ gaa n’itinye ya kpọmkwem n’ahụ ndị Kọrịnt. “Ma” na-ejikọta okwu a na ihe bu ya ụzọ n’enweghị itinye echiche oge nke na-adịghị na isi mmalite.
- source_word: σῶμα Χριστοῦ
  choice: ahụ Kraịst
  rationale: Nke a na-edobe ihe atụ nke otu ahụ nwere ọtụtụ akụkụ ma na-ekwupụta njikọ nke ahụ ahụ na Kraịst n’ụzọ Igbo doro anya ma bụrụ nke a na-anụkarị.
- source_word: Χριστοῦ
  choice: Kraịst
  rationale: “Kraịst” bụ nsụgharị Igbo a maara nke ọma maka Χριστός; n’ebe a ọ na-arụ ọrụ dịka aha-utu Mesaya, ma o kwesịghị ịkọwa karịa ihe ederede kwuru.
- source_word: μέλη
  choice: otu akụkụ ya
  rationale: N’ime ihe atụ nke ahụ, μέλη bụ akụkụ dị iche iche nke ahụ. “Otu akụkụ ya” na-asụ Igbo nke ọma ma na-edobe mmekọrịta n’etiti ahụ dum na akụkụ nke ọ bụla.
- source_word: ἐκ μέρους
  choice: onye ọ bụla n’ime unu
  rationale: 'Nkebiokwu a nwere echiche nkesa: ndị Kọrịnt niile bụ ahụ ahụ, ma onye nke ọ bụla bụ akụkụ n’ime ya. Nsụgharị a na-ezere nghọtahie na ha bụ ahụ ahụ naanị ‘n’otu akụkụ’.'
theological_decisions:
- issue: Otu e si asụgharị Χριστοῦ n’okwu banyere nzukọ dịka ahụ
  choice: Kraịst
  alternative: Mesaya
  rationale: “Kraịst” bụ ụdị aha-utu Χριστός nke zuru ebe niile n’Igbo ma dabara n’okwu Pọl ebe a; ihe odide ahụ ka na-ekwu na nzukọ ahụ bụ ahụ nke onye ahụ e tere mmanụ, n’enweghị itinye nkọwa ụka pụrụ iche.
- issue: Uche ἐκ μέρους na καὶ μέλη ἐκ μέρους
  choice: 'echiche nkesa: onye ọ bụla bụ otu akụkụ ya'
  alternative: akụkụ n’otu n’otu; akụkụ n’ụzọ pụrụ iche
  rationale: Ihe gbara ya gburugburu na-edobe otu ahụ megide ọtụtụ akụkụ. Nhọrọ a na-echekwa ịdị n’otu nke ha niile na ọrụ onye ọ bụla n’ime ha, ma ghara ịpụta na onye ọ bụla nwere naanị akụkụ ụfọdụ nke ahụ.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị mfe ma dị ùgwù. A họọrọ “ahụ” na “akụkụ” iji mee ka ihe atụ nke otu ahụ na ọtụtụ akụkụ ya doo anya nye onye na-agụ akwụkwọ taa; e chekwara njikọ δέ site na “Ma.”
