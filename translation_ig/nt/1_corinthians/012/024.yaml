revisions:
- from: Ma akụkụ ahụ anyị ndị kwesịrị ekwesị igosi n'ihu ọha adịghị mkpa nke ahụ. Kama, Chineke jikọtara ahụ ọnụ[a], site n'inye akụkụ ahụ nke nsọpụrụ kọrọ nsọpụrụ ka ukwuu,
  to: Ma akụkụ ahụ anyị ndị dị mma n'anya enweghị mkpa. Kama, Chineke jikọtara ahụ ọnụ[a], site n'inye akụkụ ahụ nsọpụrụ kọrọ nsọpụrụ ka ukwuu,
  rationale: The revision removes an unnecessary expansion of εὐσχήμονα, improves idiomatic Standard Igbo for “have no need,” and smooths the construction describing the part lacking honor. It preserves the Greek ambiguity about what precisely the part lacks, while the immediately following “nsọpụrụ” makes the contextual reference clear.
