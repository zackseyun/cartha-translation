source:
  edition: SBLGNT
  text: τὰ δὲ εὐσχήμονα ἡμῶν οὐ χρείαν ⸀ἔχει. ἀλλὰ ὁ θεὸς συνεκέρασεν τὸ σῶμα, τῷ ⸀ὑστεροῦντι περισσοτέραν δοὺς τιμήν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/024.yaml
  text: but our presentable parts have no need. Instead[a], God has composed the body, giving greater honor to the part that lacked it,
translation:
  language: ig
  text: Ma akụkụ ahụ anyị ndị dị mma n'anya enweghị mkpa. Kama, Chineke jikọtara ahụ ọnụ[a], site n'inye akụkụ ahụ nsọpụrụ kọrọ nsọpụrụ ka ukwuu,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “gwakọtara ahụ ọnụ.” Ngwaa Grik a pụrụ imesi ike n'ịgwakọta ma ọ bụ ijikọta akụkụ dị iche iche ka ha bụrụ otu.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐσχήμονα
  choice: akụkụ ahụ anyị ndị kwesịrị ekwesị igosi n'ihu ọha
  rationale: N'okwu atụ banyere ahụ mmadụ, nke a na-egosi akụkụ ndị a pụrụ igosi n'enweghị ihere, n'adịghị ka akụkụ ndị a na-ele anya dị ka ndị na-erughị eru igosi. A gbakwụnyere ‘akụkụ ahụ’ n'ihi na adjective Grik a nọ n'ụdị neuter plural ma ihe ọ na-ezo aka na ya doro anya site n'ọnọdụ okwu ahụ.
- source_word: χρείαν ἔχει
  choice: adịghị mkpa nke ahụ
  rationale: Nke a na-asụgharị akpaalaokwu Grik nke pụtara ‘enweghị mkpa.’ ‘Nke ahụ’ na-ezo azụ nlekọta ma ọ bụ nkwanye ùgwù pụrụ iche a kpọtụrụ aha n'amaokwu bu ụzọ, na-enweghị ịkọwa ya karịa ihe gbara amaokwu ahụ gburugburu.
- source_word: συνεκέρασεν
  choice: jikọtara ... ọnụ
  rationale: Nhọrọ a na-egosi ijikọta ihe dị iche iche ka ha bụrụ otu zuru ezu. Ọ dị mfe ma dịkwa mma n'Igbo, ebe nkọwa ala peeji na-echekwa echiche ọzọ nke ‘ịgwakọta ọnụ.’
- source_word: σῶμα
  choice: ahụ
  rationale: A hapụrụ isi ihe atụ Pọl banyere otu ahụ ka ọ dị, n'enweghị ịgbasa ya bụrụ nkọwa banyere nzukọ Kraịst n'ime isi amaokwu.
- source_word: τῷ ὑστεροῦντι
  choice: akụkụ ahụ nke nsọpụrụ kọrọ
  rationale: Participle a pụtara ihe kọrọ ma ọ bụ ihe na-enweghị ihe kwesịrị ịdị na ya. N'ọnọdụ a, ihe kọrọ ya bụ nsọpụrụ, ọ bụghị na akụkụ ahụ ahụ enweghị uru n'onwe ya.
- source_word: περισσοτέραν τιμήν
  choice: nsọpụrụ ka ukwuu
  rationale: Nke a na-echekwa ike comparative nke περισσοτέραν ma na-ada ka Igbo a na-asụ ugbu a.
- source_word: δοὺς
  choice: site n'inye
  rationale: Nke a na-egosi na Chineke jikọtara ahụ ọnụ site n'omume inye akụkụ nsọpụrụ kọrọ nsọpụrụ ka ukwuu.
theological_decisions:
- issue: Ihe omume Chineke pụtara n'okwu atụ banyere ahụ
  choice: E gosiri Chineke dị ka onye ji nzube jikọta akụkụ ahụ, na-enye akụkụ ahụ nsọpụrụ kọrọ nsọpụrụ ka ukwuu.
  alternative: Ịghọta ya nanị dị ka ịgwakọta akụkụ anụ ahụ ọnụ, ma ọ bụ ime ka ọ na-ekwu kpọmkwem naanị banyere nzukọ Kraịst kama ịnọgide n'okwu atụ ahụ.
  rationale: Ọnọdụ okwu sara mbara metụtara nzukọ Kraịst dị ka ahụ, ma amaokwu a ka na-ekwu n'ụdị okwu atụ banyere ahụ mmadụ. Nsụgharị ahụ na-echekwa ọkwa abụọ ahụ n'ebughị ụzọ kpebie nke naanị ya.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị ugwu ma dị mfe nghọta. A họọrọ ‘kwesịrị ekwesị igosi n'ihu ọha’ iji zere okwu ochie ma chekwaa echiche banyere ịdị mma ma ọ bụ ịdị nsọpụrụ n'anya ọha. Akara nkọwa ala peeji [a] dị kpọmkwem n'akụkụ okwu ọ na-akọwa.
