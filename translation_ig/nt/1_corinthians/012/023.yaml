source:
  edition: SBLGNT
  text: καὶ ἃ δοκοῦμεν ἀτιμότερα εἶναι τοῦ σώματος, τούτοις τιμὴν περισσοτέραν περιτίθεμεν, καὶ τὰ ἀσχήμονα ἡμῶν εὐσχημοσύνην περισσοτέραν ἔχει,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/023.yaml
  text: and those parts of the body that we think to be less honorable[a], on these we bestow greater honor, and our unpresentable parts have greater decorum[b],
translation:
  language: ig
  text: Ma akụkụ ụfọdụ nke ahụ anyị, ndị anyị chere na ha dị ala n’ihe gbasara nsọpụrụ[a], ọ bụ ha ka anyị na-enye nsọpụrụ ka ukwuu; akụkụ ahụ anyị ndị na-adịghị mma igosi n’ihu ọha na-enwekwa ịdị mma n’ile anya ka ukwuu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị anyị na-ewere dị ka ndị a na-asọpụrụ obere.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ịdị mma igosi ka ukwuu” ma ọ bụ “ịdị mma n’ahụ ka ukwuu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἃ δοκοῦμεν
  choice: anyị chere na
  rationale: Nke a na-egosi otú mmadụ si ele akụkụ ndị ahụ anya, ọ bụghị na ha bụ ndị na-enweghị nsọpụrụ n'eziokwu.
- source_word: ἀτιμότερα
  choice: erughị eru inweta nsọpụrụ
  rationale: Na-echekwa ntụnyere dị n'okwu Grik nakwa njikọ ya na τιμή, n'asụsụ Igbo doro anya.
- source_word: τοῦ σώματος
  choice: akụkụ ahụ nke ahụ
  rationale: Na-edobe ihe atụ doro anya banyere akụkụ dị iche iche nke otu ahụ dum.
- source_word: τιμὴν περισσοτέραν περιτίθεμεν
  choice: anyị na-enye nsọpụrụ ka ukwuu
  rationale: Ọ bụ ụzọ Igbo sitere n'okike isi kwuo inye ma ọ bụ itinye nsọpụrụ n'ahụ ihe, ma na-edobe ntụnyere ahụ.
- source_word: τὰ ἀσχήμονα ἡμῶν
  choice: akụkụ ahụ anyị ndị na-ekwesịghị ka a na-egosi n'ihu ọha
  rationale: Na-egosipụta echiche nke ihe na-ekwesịghị igosi n'ihu ọha n'ihi ọdịnala, n'ebughị ebubo omume rụrụ arụ n'ime okwu ahụ.
- source_word: εὐσχημοσύνην περισσοτέραν ἔχει
  choice: na-enwetakwa ọdịdị kwesịrị ekwesị ka ukwuu
  rationale: Na-egosipụta seemliness ma ọ bụ presentability nke a na-enweta site n'iji nlezianya kpuchie ma lekọta akụkụ ndị ahụ.
theological_decisions:
- issue: Ihe atụ nke ahụ na nsọpụrụ n'etiti mmadụ
  choice: E debere okwu ahụ gbasara akụkụ ahụ n'ụzọ pụtara ìhè.
  alternative: Ịtụgharị ya ozugbo ka ọ bụrụ naanị ndị òtù nzukọ a na-elelị.
  rationale: Arụmụka Pọl dabeere n'ihe a na-eme akụkụ ahụ n'ezie, nke ọ ga-eji kọwaa ahụ Kraịst; ya mere, nsụgharị ekwesịghị ibu ụzọ tinye nkọwa ahụ n'ọnọdụ ihe atụ ahụ.
- issue: Ma akụkụ ndị ahụ enweghị nsọpụrụ n'eziokwu
  choice: 'E gosiri ya dị ka echiche anyị: “anyị chere na.”'
  alternative: Ikwupụta na akụkụ ndị ahụ bụ ndị na-enweghị nsọpụrụ n'onwe ha.
  rationale: δοκοῦμεν na-edobe ọdịiche dị n'etiti echiche mmadụ na uru akụkụ ndị ahụ nwere n'ezie.
translation_notes:
  register: Standard Igbo; asụsụ dị ugbu a, kwụ ọtọ ma dị ùgwù. E ji “akụkụ ahụ” mee ka o doo anya na a na-ekwu banyere akụkụ dị iche iche nke ahụ mmadụ, ma e zere okwu nwere ike ime ka ἀσχήμονα bụrụ ikpe omume karịa ihe Grik kwuru.
