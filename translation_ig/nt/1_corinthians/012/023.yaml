revisions:
- from: Akụkụ ahụ nke ahụ anyị chere na ha erughị eru inweta nsọpụrụ[a], ọ bụ ha ka anyị na-enye nsọpụrụ ka ukwuu; akụkụ ahụ anyị ndị na-ekwesịghị ka a na-egosi n'ihu ọha na-enwetakwa ọdịdị kwesịrị ekwesị ka ukwuu[b].
  to: Ma akụkụ ụfọdụ nke ahụ anyị, ndị anyị chere na ha dị ala n’ihe gbasara nsọpụrụ[a], ọ bụ ha ka anyị na-enye nsọpụrụ ka ukwuu; akụkụ ahụ anyị ndị na-adịghị mma igosi n’ihu ọha na-enwekwa ịdị mma n’ile anya ka ukwuu[b].
  rationale: The revision removes the redundant opening, restores the comparative sense of 'less honorable' without saying the parts are unworthy of honor, and gives εὐσχημοσύνη a more idiomatic bodily-context rendering. The notes are limited to lexical alternatives and do not add interpretation not present in the verse.
