  to: nye onye ọzọ, ọrụ ebube dị iche iche[a]; nye onye ọzọ, ibu amụma; nye onye ọzọ, ịmata ọdịiche dị n’etiti mmụọ; nye onye ọzọ, ụdị asụsụ dị iche iche[b]; nye onye ọzọ, ịkọwa asụsụ.
  rationale: The revision removes interpretive additions in the phrase for discerning spirits and corrects the explanatory footnote so that it accurately represents the lexical scope of γλωσσῶν without deciding the debated nature of the gift. It also removes the demonstrative “ndị ahụ” from the final phrase, keeping the generic Greek expression concise.
