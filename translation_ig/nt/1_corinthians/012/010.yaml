id: 1CO.12.10
reference: 1 Corinthians 12:10
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸀ἄλλῳ ἐνεργήματα δυνάμεων, ⸁ἄλλῳ προφητεία, ⸀1ἄλλῳ διακρίσεις πνευμάτων, ⸀ἑτέρῳ γένη γλωσσῶν, ⸀2ἄλλῳ ἑρμηνεία γλωσσῶν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/010.yaml
  text: to another[a], workings of miracles; to another, prophecy; to another, discernments of spirits; to another, kinds of tongues; to another[b], interpretation of tongues.
translation:
  language: ig
  text: nye onye ọzọ, ọrụ ebube dị iche iche[a]; nye onye ọzọ, ibu amụma; nye onye ọzọ, ịmata ọdịiche dị n’etiti mmụọ; nye onye ọzọ, ụdị asụsụ dị iche iche[b]; nye onye ọzọ, ịkọwa asụsụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ọrụ ike dị iche iche” ma ọ bụ “ọrụ dị ike dị iche iche.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ụdị ire dị iche iche” na “ịkọwa ire.” Okwu Grik ahụ nwere ike ịpụta “ire” ma ọ bụ “asụsụ.” E ji “asụsụ” mee ihe n’ebe a maka nghọta doro anya; “ire” na-echekwa mgbagwoju anya dị n’okwu Pọl banyere onyinye ndị a.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐνεργήματα δυνάμεων
  choice: ọrụ ebube dị iche iche
  rationale: Nkebiokwu a na-ezo aka n'ọrụ ma ọ bụ nsonaazụ ike pụrụ iche. N'ọnọdụ ndepụta onyinye Mmụọ a, “ọrụ ebube dị iche iche” bụ okwu Igbo doro anya ma na-edobe ụdị ọtụtụ nke Grik.
- source_word: προφητεία
  choice: ibu amụma
  rationale: Nke a bụ ụzọ Igbo nkịtị na nke doro anya isi kpọọ onyinye ikwupụta ozi amụma, n'emeghị ka ihe okwu Grik pụtara dị warara.
- source_word: διακρίσεις πνευμάτων
  choice: ikike ịmata ọdịiche dị n'etiti mmụọ dị iche iche
  rationale: Nsụgharị a na-egosi omume ịmata ma kewaa mmụọ, ma na-edobe ọtụtụ nke okwu Grik. Ọ naghị ekpebi ma mmụọ ndị ahụ bụ nke mmadụ, ndị ọjọọ, ma ọ bụ ụdị ndị ọzọ.
- source_word: γένη γλωσσῶν
  choice: ụdị asụsụ dị iche iche
  rationale: “Ụdị ... dị iche iche” na-egosipụta γένη nke ọma. “Asụsụ” nwere ike ịpụta asụsụ a maara ma ọ bụ okwu ndị a na-akpọ ire dị iche iche n'ọnọdụ onyinye ime mmụọ; ihe odide ukwu na ihe odide ala ala na-edobe esemokwu a.
- source_word: ἑρμηνεία γλωσσῶν
  choice: ịkọwa asụsụ ndị ahụ
  rationale: “Ịkọwa” na-ekwupụta ime ka ihe e kwuru bụrụ ihe ndị ọzọ ghọtara, n'ekpebighị ma ọ bụ ntụgharị asụsụ nkịtị ka ọ bụ nkọwa.
- source_word: ἄλλῳ / ἑτέρῳ
  choice: nye onye ọzọ
  rationale: Dative a na-egosi ikesa onyinye n'etiti ndị dị iche iche. Otu nsụgharị ahụ n'ebe niile na-eme ka Igbo na-aga nke ọma n'emeghị ka ọdịiche okwu abụọ ahụ bụrụ ihe karịrị ihe ọnọdụ a chọrọ.
theological_decisions:
- issue: Ụdị δυνάμεων n'ime ndepụta onyinye ime mmụọ
  choice: ọrụ ebube dị iche iche
  alternative: ọrụ ike dị iche iche; ọrụ dị ike dị iche iche
  rationale: N'ọnọdụ a, δυνάμεις nwere ike izo aka n'ọrụ ebube, ọ bụ ezie na isi echiche ya bụ ike. Ihe odide ukwu ji okwu Igbo a na-aghọta ngwa ngwa, ebe ihe odide ala ala na-echekwa nsụgharị ndị na-anọ okwu Grik nso.
- issue: Ihe γλωσσῶν pụtara
  choice: asụsụ dị iche iche
  alternative: ire dị iche iche
  rationale: Okwu Grik nwere ike ịpụta ire ma ọ bụ asụsụ. Igbo “asụsụ” bụ okwu nkịtị ma doro anya, ma ihe odide ala ala na-echekwa “ire” ka a ghara ikpebi n'ụzọ zuru ezu ụdị onyinye ahụ bụ.
- issue: Ihe πνευμάτων na-ezo aka na ya
  choice: mmụọ dị iche iche
  alternative: okwu sitere na mmụọ; mmụọ nọ n'azụ okwu
  rationale: Grik akọwaghị kpọmkwem ụdị mmụọ ndị a. Ya mere, nsụgharị ahụ hapụrụ okwu ahụ ka ọ saa mbara kama ikwu na ha bụ naanị mmụọ ọma, mmụọ ọjọọ, ma ọ bụ mmụọ mmadụ.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. Edebere usoro ndepụta na nkwugharị “nye onye ọzọ,” ma zere okwu pụrụ iche nke otu ụka ma ọ bụ nkọwa nke ga-emechi mgbagwoju anya dị na γλωσσῶν na πνευμάτων.
