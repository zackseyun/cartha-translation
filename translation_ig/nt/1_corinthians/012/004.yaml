  yaml_path: translation/nt/1_corinthians/012/004.yaml
  text: There are varieties of gifts[a], but the same Spirit.
translation:
  language: ig
  text: E nwere ụdị onyinye dị iche iche[a], ma Mmụọ ahụ bụ otu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “nkesa onyinye” ma ọ bụ “ọdịiche dị n’onyinye.” Okwu Grik ahụ na-emesi ịdịgasị iche nke onyinye ndị ahụ ike, ọ bụghị nkewa n’ọgbakọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Διαιρέσεις
  choice: ụdị ... dị iche iche
  rationale: N'ebe a, okwu ahụ na-egosi ọdịiche ma ọ bụ ụdị dịgasị iche n'ime onyinye ndị ahụ, ọ bụghị nkewa ma ọ bụ esemokwu n'ọgbakọ.
- source_word: δὲ
  choice: ma
  rationale: δὲ nke dị na nkebi nke abụọ na-egosi ọdịiche dị n'etiti onyinye dịgasị iche na ịdị n'otu nke Mmụọ. A hapụrụ nke mbụ ka nhazi ahịrịokwu Igbo wee bụrụ nke eke, n'enweghị itinye okwu oge na-adịghị na isi mmalite.
- source_word: χαρισμάτων
  choice: onyinye
  rationale: Okwu a na-ezo aka n'onyinye e nyere site n'amara, karịchaa ikike ime mmụọ n'ọnọdụ a; “onyinye” bụ okwu Igbo doro anya ma kwekọọ n'okwu a.
- source_word: τὸ ... αὐτὸ
  choice: otu ... ahụ
  rationale: Nhazi a na-emesi ike na Mmụọ ahụ bụ otu onye ahụ n'agbanyeghị onyinye ndị ahụ dịgasị iche.
- source_word: πνεῦμα
  choice: Mmụọ
  rationale: Ọnọdụ gbara amaokwu a gburugburu na-egosi na ọ bụ Mmụọ Nsọ, onye bụ isi iyi nke onyinye ndị a; mkpụrụedemede ukwu na-egosi onye okwu ahụ na-ezo aka.
theological_decisions:
- issue: Onye πνεῦμα na-ezo aka na ya
  choice: Mmụọ Nsọ
  alternative: mmụọ mmadụ ma ọ bụ ike ime mmụọ
  rationale: 1 Ndị Kọrịnt 12:3–11 na-ekwu ugboro ugboro banyere Mmụọ ahụ dị ka onye na-enye ma na-ekesa onyinye n'etiti ndị kwere ekwe. “Mmụọ” na mkpụrụedemede ukwu na-egosipụta ihe Pọl pụtara n'etinyeghị nkọwa karịrị ihe amaokwu ahụ kwuru.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị mfe nghọta ma dị ùgwù. E ji “ụdị onyinye dị iche iche” mee ka echiche nke diversity pụta ìhè n'enweghị echiche ọjọọ nke esemokwu ma ọ bụ nkewa.
