id: 1CO.12.5
reference: 1 Corinthians 12:5
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ διαιρέσεις διακονιῶν εἰσιν, καὶ ὁ αὐτὸς κύριος·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/005.yaml
  text: And there are varieties of ministries[a], and the same Lord.
translation:
  language: ig
  text: E nwekwara ọrụ ije ozi dị iche iche[a], ọ bụkwa otu Onyenwe anyị ahụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ọrụ ozi” ma ọ bụ “ọrụ e ji eje ozi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: E nwekwara
  rationale: Ọ na-ejikọta amaokwu a na usoro okwu ndị yiri ya n’amaokwu 4–6; ‘nwekwara’ na-egosipụta mgbakwunye ahụ n’Igbo eke.
- source_word: διαιρέσεις
  choice: ụdị ... dị iche iche
  rationale: N’ebe a okwu ahụ na-egosi ụdị dịgasị iche n’ime ịdị n’otu, ọ bụghị nkewa ma ọ bụ esemokwu.
- source_word: διακονιῶν
  choice: ọrụ ije ozi
  rationale: Nke a na-ekpuchi echiche nke ọrụ e ji ejere ndị ọzọ ma ọ bụ ọgbakọ ozi, n’enweghị ime ka ọ bụrụ naanị ọkwa ọchịchị.
- source_word: εἰσιν
  choice: E nwere
  rationale: Nke a bụ ụzọ Igbo nkịtị si egosipụta na ihe dị ma na-echekwa nhazi nke ahịrịokwu Grik.
- source_word: ὁ αὐτὸς
  choice: otu onye ahụ
  rationale: Ọ na-emesi ike na Onyenwe ahụ adịghị agbanwe n’agbanyeghị ụdị ọrụ dị iche iche.
- source_word: κύριος
  choice: Onyenwe anyị
  rationale: Ọ bụ aha nsọpụrụ Igbo a na-ejikarị atụgharị κύριος, ma ọ naghị agbasa onye okwu ahụ na-ezo aka na ya n’ime ederede.
theological_decisions:
- issue: Onye ‘Onyenwe anyị’ na-ezo aka na ya n’usoro Atọ n’Ime Otu dị n’1 Ndị Kọrịnt 12:4–6
  choice: E debere ya dịka aha nsọpụrụ ‘Onyenwe anyị’ n’enweghị ịgbakwunye ‘Jizọs’ n’ederede.
  alternative: Ịkọwa ya kpọmkwem dịka ‘Onyenwe anyị Jizọs.’
  rationale: Ọnọdụ gbara ya gburugburu yikarịrị ka ọ na-ezo aka na Jizọs n’usoro Mmụọ, Onyenwe anyị, na Chineke; ma nsụgharị ahụ na-echekwa okwu Pọl na obere ohere nghọta ya kama idozi ya n’ụzọ nkọwa.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị mfe nghọta ma nwee ugwu. ‘Ọrụ ije ozi’ na-ezere okwu ụka pụrụ iche ma na-edobe nghọta sara mbara nke διακονία.
