source:
  edition: SBLGNT
  text: εἰ δὲ ἦν τὰ πάντα ἓν μέλος, ποῦ τὸ σῶμα;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/019.yaml
  text: If all were one member, where would the body be?
translation:
  language: ig
  text: Ma ọ bụrụ na akụkụ niile bụ otu akụkụ ahụ, ahụ ga-adị ebee?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰ δὲ ἦν
  choice: Ma a sị na ... bụ
  rationale: “Ma” na-egosi njikọ na ntakịrị ntụnyere nke δέ, ebe “a sị na” na-egosipụta ọnọdụ a na-eche n’echiche nke εἰ ... ἦν n’Igbo dị mfe ma bụrụkwa nke a na-asụ ugbu a.
- source_word: τὰ πάντα
  choice: ha niile
  rationale: N’ọnọdụ a, okwu ahụ na-ezo aka n’akụkụ ahụ niile a kpọtụrụla aha, ọ bụghị n’ihe niile n’ozuzu. “Ha niile” na-edobe ntụaka ahụ n’enweghị ịgbakwunye nkọwa na-adịghị na Grik.
- source_word: ἓν μέλος
  choice: otu akụkụ ahụ
  rationale: “Akụkụ ahụ” bụ okwu Igbo doro anya maka otu akụkụ nke ahụ, ma na-echekwa ihe atụ Pọl ji mee ihe. “Otu” na-asụgharị ἓν kpọmkwem.
- source_word: ποῦ τὸ σῶμα
  choice: ahụ dum ga-adị ebee?
  rationale: Ajụjụ a na-eche azịza ya na-egosipụta ποῦ n’ụzọ Igbo sitere n’okike. Ịtụgharị usoro okwu ka ọ bụrụ “ahụ dum ... ebee?” na-ezere mgbagwoju anya nke “ebe ahụ,” nke nwekwara ike ịpụta “that place.” “Dum” na-eme ka ọdịiche dị n’etiti otu akụkụ na ahụ n’ozuzu doo anya.
theological_decisions:
- issue: Ókè ihe atụ banyere ahụ pụtara
  choice: E debere naanị “ahụ dum,” n’enweghị ịgbakwunye “ahụ Kraịst” ma ọ bụ “ụka.”
  alternative: Ịsụgharị ya n'ụzọ nkọwa dị ka “ahụ Kraịst” ma ọ bụ “ụka.”
  rationale: Ọ bụ ezie na gburugburu amaokwu ahụ na-ekwu banyere ndị kwere ekwe dịka ahụ Kraịst, amaokwu a n’onwe ya kwuru naanị τὸ σῶμα. Nsụgharị ahụ na-echekwa ihe atụ ahụ na esemokwu nkà mmụta okpukpe dị na ya n’enweghị ịgbakwunye nkọwa.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe ma nwee ugwu. Usoro “a sị na” dabara na ajụjụ atụ a, ebe ide “ahụ dum ga-adị ebee?” na-eme ka ajụjụ ahụ doo anya ma zere mgbagwoju anya dị n’okwu “ebe ahụ.”
