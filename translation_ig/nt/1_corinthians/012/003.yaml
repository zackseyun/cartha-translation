id: 1CO.12.3
reference: 1 Corinthians 12:3
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: διὸ γνωρίζω ὑμῖν ὅτι οὐδεὶς ἐν πνεύματι θεοῦ λαλῶν λέγει· Ἀνάθεμα ⸀Ἰησοῦς, καὶ οὐδεὶς δύναται εἰπεῖν· ⸂Κύριος Ἰησοῦς⸃ εἰ μὴ ἐν πνεύματι ἁγίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/003.yaml
  text: Therefore I make known to you that no one speaking by the Spirit of God says[a], “Jesus is accursed,” and no one is able to say[b], “Jesus is Lord,” except by the Holy Spirit.
translation:
  language: ig
  text: Ya mere, ana m eme ka unu mara na ọ dịghị onye na-ekwu okwu site na Mmụọ Chineke na-asị[a], “Jizọs bụ onye a bụrụ ọnụ,” ọ dịghịkwa onye pụrụ ikwu[b], “Jizọs bụ Onyenwe,” ma ọ bụghị site na Mmụọ Nsọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “Ka a bụrụ Jizọs ọnụ.” Okwu Grik ahụ bụ mkpu na-enweghị ngwaa e dere ede; n’ihi ya, ọ pụrụ ịdị ka nkwupụta ma ọ bụ ka ọchịchọ ọbụbụ ọnụ.
    reason: lexical_alternative
  - marker: b
    text: N’usoro okwu Grik, “Onyenwe Jizọs.” N’ebe a ọ bụ ihe mmadụ na-ekwupụta; ya bụ, “Jizọs bụ Onyenwe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διό
  choice: Ya mere
  rationale: Ọ na-egosi nkwubi okwu sitere n’ihe Pọl kwuru tupu nke a, ma bụrụkwa ụzọ Igbo dị mfe ma doo anya isi jikọta echiche abụọ ahụ.
- source_word: γνωρίζω ὑμῖν
  choice: ana m eme ka unu mara
  rationale: Nke a na-edobe echiche causative nke γνωρίζω, ‘ime ka a mara,’ n’etinyeghị echiche nke ọchịchọ nke na-adịghị n’okwu Grik.
- source_word: ἐν πνεύματι θεοῦ
  choice: site na Mmụọ Chineke
  rationale: N’ebe a ἐν nwere ike igosi onye na-eme ka okwu ahụ kwe omume ma ọ bụ ọnọdụ mmụọ e ji kwuo ya; ‘site na’ na-egosi ọrụ Mmụọ ahụ n’Igbo nkịtị.
- source_word: Ἀνάθεμα Ἰησοῦς
  choice: Jizọs bụ onye a bụrụ ọnụ
  rationale: Nkebiokwu Grik enweghị ngwaa e dere ede. Itinye ‘bụ’ na-eme ka ọ bụrụ ahịrịokwu Igbo zuru oke ma na-edobe echiche nke ἀνάθεμα dị ka ịbụ onye nọ n’okpuru ọbụbụ ọnụ, na-emeghị ya iwu kpọmkwem.
- source_word: δύναται εἰπεῖν
  choice: pụrụ ikwu
  rationale: ‘Pụrụ ikwu’ na-egosi ikike ma ọ bụ ohere dị na δύναται εἰπεῖν n’ụzọ Igbo dị nkenke ma bụrụkwa eke.
- source_word: Κύριος Ἰησοῦς
  choice: Jizọs bụ Onyenwe anyị
  rationale: Ọ bụ nkwupụta banyere Jizọs, ọ bụghị ịkpọ ya aha ozugbo. ‘Onyenwe anyị’ bụ okwu Igbo a na-aghọta nke ọma maka κύριος n’ọnọdụ nsọpụrụ a, ebe ‘Jizọs bụ’ na-eme ka ọdịdị nkwupụta ahụ doo anya.
- source_word: εἰ μὴ
  choice: ma ọ bụghị
  rationale: Ọ na-egosi nanị ụzọ e wepụrụ n’okwu njụ zuru ụwa ọnụ ahụ, ma bụrụkwa usoro Igbo kwesịrị ekwesị n’ahịrịokwu a.
- source_word: ἐν πνεύματι ἁγίῳ
  choice: site na Mmụọ Nsọ
  rationale: Dị ka nkebiokwu mbụ, ‘site na’ na-egosi ọrụ ma ọ bụ enyemaka nke Mmụọ Nsọ, ebe aha ahụ na-ezo aka n’Onye Mmụọ dị nsọ.
theological_decisions:
- issue: Ihe κύριος pụtara na nkwupụta Κύριος Ἰησοῦς
  choice: Onyenwe anyị
  alternative: Nna Ukwu / Nwe
  rationale: ‘Onyenwe anyị’ na-eburu ma echiche onye nwere ikike ma ịdị arọ nke aha nsọpụrụ ahụ n’okwu Pọl, n’agbanyeghị na okwu Grik n’onwe ya enweghị nnọchiaha ‘anyị.’ Ihe e dere n’ala ala peeji na-egosi usoro Grik ka a ghara izochi ọdịiche ahụ.
- issue: Ihe nkwupụta ‘ọ dịghị onye pụrụ ikwu ... ma ọ bụghị site na Mmụọ Nsọ’ na-akọ banyere ọrụ Mmụọ
  choice: E debere nkwupụta ahụ otú o siri dị, na-akọwapụtaghị ya karịa ederede
  alternative: Ịkọwa ya naanị dị ka ịkpọpụta okwu ọnụ, ma ọ bụ ime ya ozizi zuru ezu banyere mgbanwe ndụ
  rationale: Amaokwu ahụ jikọtara ezi nkwupụta banyere ịbụ Onyenwe nke Jizọs na ọrụ Mmụọ Nsọ. Nsụgharị ahụ anaghị eme ka njikọ a dị warara ma ọ bụ tinye usoro ozizi zuru ezu nke ederede ekwughị.
translation_notes:
  register: E jiri Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E debere usoro arụmụka ahụ n’ụzọ doro anya, jiri ‘site na’ mee ka ọrụ Mmụọ pụta ìhè, ma jiri ihe e dere n’ala ala peeji chekwaa mgbagwoju anya dị na mkpu Ἀνάθεμα Ἰησοῦς na ọdịiche dị n’etiti usoro Grik ‘Onyenwe Jizọs’ na nkwupụta Igbo.
