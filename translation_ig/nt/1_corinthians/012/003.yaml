revisions:
- from: Ya mere, ana m eme ka unu mara na ọ dịghị onye na-ekwu okwu site na Mmụọ Chineke na-asị[a], “Jizọs bụ onye a bụrụ ọnụ,” ọ dịghịkwa onye pụrụ ikwu[b], “Jizọs bụ Onyenwe anyị,” ma ọ bụghị site na Mmụọ Nsọ.
  to: Ya mere, ana m eme ka unu mara na ọ dịghị onye na-ekwu okwu site na Mmụọ Chineke na-asị[a], “Jizọs bụ onye a bụrụ ọnụ,” ọ dịghịkwa onye pụrụ ikwu[b], “Jizọs bụ Onyenwe,” ma ọ bụghị site na Mmụọ Nsọ.
  rationale: The revision removes the unsupported possessive “anyị” from the confession of Jesus’ lordship and revises its footnote accordingly. All other wording is retained because it communicates the source sense naturally and preserves the limited ambiguity of the curse formula.
  reviewer_model: gpt-5.6-terra
