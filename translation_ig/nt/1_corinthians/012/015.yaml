id: 1CO.12.15
reference: 1 Corinthians 12:15
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐὰν εἴπῃ ὁ πούς· Ὅτι οὐκ εἰμὶ χείρ, οὐκ εἰμὶ ἐκ τοῦ σώματος, οὐ παρὰ τοῦτο οὐκ ἔστιν ἐκ τοῦ σώματος;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/015.yaml
  text: If the foot says[a], “Because I am not a hand, I am not of the body,” it is not for this reason not of the body, is it?
translation:
  language: ig
  text: Ọ bụrụ na ụkwụ asị[a], “Ebe m na-abụghị aka, abụghị m akụkụ ahụ,” nke a ọ̀ na-eme ka ọ ghara ịbụ akụkụ ahụ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ikwu ya n’ụzọ ọzọ: “Ebe m na-abụghị aka, esoghị m n’ahụ” ... “nke ahụ anaghị eme ka ọ ghara ịbụ akụkụ ahụ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν εἴπῃ
  choice: Ọ bụrụ na ... asị
  rationale: Nke a na-egosipụta ọnọdụ a na-atụ anya ya ma ọ bụ ihe atụ, n’Igbo nkịtị ma doo anya.
- source_word: ὁ πούς
  choice: ụkwụ
  rationale: E debere aha akụkụ ahụ kpọmkwem n’ihi na ihe atụ Pọl ji arụ ụka dabere n’ụkwụ na aka.
- source_word: Ὅτι
  choice: Ebe
  rationale: N’ebe a, ὅτι na-eweta ihe kpatara mkpesa ụkwụ ahụ; “Ebe” na-egosipụta njikọ ahụ n’Igbo dị ndụ.
- source_word: χείρ
  choice: aka
  rationale: Nke a na-echekwa ọdịiche doro anya dị n’etiti ụkwụ na aka.
- source_word: ἐκ τοῦ σώματος
  choice: iso ... n’ahụ / ịbụ akụkụ ahụ
  rationale: N’Igbo, “iso n’ahụ” na “ịbụ akụkụ ahụ” na-ebuga echiche nke ịbụ onye ma ọ bụ ihe so n’otu ahụ n’ụzọ doro anya; ntụgharị nkịtị nke ἐκ agaghị ada nke ọma ebe a.
- source_word: οὐ παρὰ τοῦτο
  choice: nke a ọ̀ na-eme ka
  rationale: Nke a na-egosipụta na ihe kpatara e kwuru adịghị eme ka nkwubi okwu ahụ bụrụ eziokwu.
- source_word: οὐκ ἔστιν ἐκ τοῦ σώματος
  choice: ọ ghara ịbụ akụkụ ahụ?
  rationale: Ajụjụ nkwuwa okwu a na-echekwa ike nke ngọnarị Grik, ma zere ngọnarị abụọ nke ga-adị mgbagwoju anya n’Igbo.
theological_decisions:
- issue: Ogo a ga-eji mee ka ngọnarị abụọ na ihe atụ banyere ahụ dị mfe
  choice: 'E debere ajụjụ nkwuwa okwu ahụ, ma sụgharịa ngọnarị abụọ ahụ n’ụzọ Igbo doro anya: “nke a ọ̀ na-eme ka ọ ghara ịbụ akụkụ ahụ?”'
  alternative: “ọ bụghị n’ihi nke a ka ọ na-abụghị nke ahụ, ka ọ bụ?”
  rationale: 'Nhọrọ a anaghị agbanwe isi okwu Pọl: mkpesa otu akụkụ ahụ anaghị ewepụ ya n’ahụ. Ọ na-echekwa ajụjụ ahụ na esemokwu echiche ya, ma bụrụkwa Igbo a na-aghọta ngwa ngwa.'
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke ugbu a ma dị ùgwù. E ji “iso n’ahụ” mee ka okwu ụkwụ ahụ daa ka okwu onye na-ekwu na ya esoghị n’otu; e ji “ịbụ akụkụ ahụ” mee ka nkwubi okwu Pọl doo anya. Akara ụda olu dị na “ọ̀” na-enyere aka igosi ajụjụ nkwuwa okwu.
