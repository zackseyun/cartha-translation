review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves the conditional statement, the foot/hand body-member imagery, the causal complaint, and Paul’s rhetorical rebuttal. However, “esoghị m n’ahụ” normally suggests not following or accompanying the body, rather than not belonging to it. Rendering the repeated expression as “abụghị m akụkụ ahụ” / “ịbụ akụkụ ahụ” better conveys the membership metaphor in idiomatic Standard Igbo.
  naturalness: “Ọ bụrụ na ụkwụ asị” and the rhetorical question are natural. Replacing “esoghị m n’ahụ” removes an avoidable ambiguity. The revised wording is clear, contemporary, and retains the rhetorical force without reproducing an unnatural double negative.
  terminology: “Ụkwụ,” “aka,” “ahụ,” and “akụkụ ahụ” are appropriate for Paul’s concrete body metaphor. “Akụkụ ahụ” is an idiomatic contextual rendering of ἐκ τοῦ σώματος as belonging to the body, not a doctrinally loaded interpretation.
  issues:
  - severity: medium
    issue: “esoghị m n’ahụ” is semantically ambiguous.
    rationale: In Standard Igbo, -eso commonly means ‘follow/accompany’; thus the phrase can be understood as ‘I do not go along with the body’ rather than ‘I am not part of the body.’ The Greek expression concerns membership/belonging, and its repetition should be represented consistently.
  revised_text: Ọ bụrụ na ụkwụ asị[a], “Ebe m na-abụghị aka, abụghị m akụkụ ahụ,” nke a ọ̀ na-eme ka ọ ghara ịbụ akụkụ ahụ?
