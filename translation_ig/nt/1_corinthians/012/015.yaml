revisions:
- from: Ọ bụrụ na ụkwụ asị[a], “Ebe m na-abụghị aka, esoghị m n’ahụ,” nke a ọ̀ na-eme ka ọ ghara ịbụ akụkụ ahụ?
  to: Ọ bụrụ na ụkwụ asị[a], “Ebe m na-abụghị aka, abụghị m akụkụ ahụ,” nke a ọ̀ na-eme ka ọ ghara ịbụ akụkụ ahụ?
  rationale: The revision replaces only the ambiguous first occurrence of “esoghị m n’ahụ” with “abụghị m akụkụ ahụ,” matching the concluding expression and clearly expressing the Greek body-membership metaphor. The rhetorical question and its rejection of the foot’s conclusion are retained. The alternative wording is retained in the footnote as an idiomatic option, without making it the main text.
