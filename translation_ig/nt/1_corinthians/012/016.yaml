    text: N'ụzọ nkịtị, “esiteghị m n’ahụ.” N’ebe a, okwu Grik ahụ pụtara ịbụ akụkụ nke ahụ. E kwughachiri ya ugboro abụọ iji mee ka arụmụka ahụ sie ike.
    reason: lexical_alternative
  revision_rationale: The revision replaces an Igbo expression that can imply accompaniment with the clear body-member expression “akụkụ nke ahụ,” while preserving the repeated wording and Paul’s rhetorical logic. The final clause is rendered as a natural inference-denial rather than retaining an opaque sequence of negatives. The footnote is re-anchored and corrected to describe the Greek accurately.
