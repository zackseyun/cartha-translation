  text: καὶ ἐὰν εἴπῃ τὸ οὖς· Ὅτι οὐκ εἰμὶ ὀφθαλμός, οὐκ εἰμὶ ἐκ τοῦ σώματος, οὐ παρὰ τοῦτο οὐκ ἔστιν ἐκ τοῦ σώματος·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/016.yaml
  text: And if the ear says[a], ‘Because I am not an eye, I am not of the body,’ it is not for this reason not of the body.
translation:
  language: ig
  text: Ọ bụrụkwa na ntị asị, “Ebe ọ bụ na abụghị m anya, abụghị m akụkụ nke ahụ[a],” nke a apụtaghị na ntị ahụ abụghị akụkụ nke ahụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N'ụzọ nkịtị, “esiteghị m n’ahụ.” N’ebe a, okwu Grik ahụ pụtara ịbụ akụkụ nke ahụ. E kwughachiri ya ugboro abụọ iji mee ka arụmụka ahụ sie ike.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Ọ bụrụkwa
  rationale: Ejikọtara καὶ na nkebi ọnọdụ ἐὰν iji nweta njikọ Igbo dị ndụ nke na-aga n’ihu n’ihe atụ gara aga.
- source_word: ἐὰν εἴπῃ
  choice: ọ bụrụ ... asị
  rationale: Na-egosipụta ọnọdụ atụghị anya ya n'ụzọ Igbo nkịtị, n’enweghị ime ka ọ bụrụ nkwupụta mere eme.
- source_word: τὸ οὖς
  choice: ntị
  rationale: Okwu nkịtị maka akụkụ ahụ a; e mere ya ka ọ na-ekwu okwu dịka n’ihe atụ Grik.
- source_word: Ὅτι
  choice: Ebe ọ bụ na
  rationale: Na-egosipụta ihe kpatara mkpesa ntị ahụ, ọ bụghị naanị akara na-ewebata okwu a kwuru.
- source_word: ὀφθαλμός
  choice: anya
  rationale: Okwu ahụ́ nkịtị kwekọrọ kpọmkwem n’isi mmalite.
- source_word: ἐκ τοῦ σώματος
  choice: isoro n’ahụ
  rationale: N’ọnọdụ a, ἐκ τοῦ σώματος na-egosi ịbụ akụkụ ma ọ bụ iso n’ahụ. Okwu a na-ada nke ọma n’Igbo ma e kwughachiri ya iji chekwaa usoro arụmụka Pọl.
- source_word: οὐ παρὰ τοῦτο
  choice: ọ bụghị n’ihi nke a
  rationale: Na-ajụ nkwubi okwu ahụ kpọmkwem n’ihi ihe e kwuru tupu ya.
- source_word: οὐκ ἔστιν ἐκ τοῦ σώματος
  choice: ka ọ na-esoghị n’ahụ
  rationale: E debere njụ nke ugboro abụọ na usoro mgbagha nke Grik, kama ịgbanwe ya kpamkpam ka ọ bụrụ nkwupụta dị mma.
theological_decisions:
- issue: Ime ka ihe atụ banyere ahụ dị mfe karịa ka isi mmalite si kwuo
  choice: E debere okwu a kwughachiri, “isoro n’ahụ,” na usoro njụ nke Pọl.
  alternative: “nke ahụ apụtaghị na ọ bụghị akụkụ ahụ” ma ọ bụ “nke ahụ anaghị eme ka ọ ghara ịbụ akụkụ ahụ.”
  rationale: Nhọrọ ahụ na-echekwa esemokwu okwu na usoro arụmụka nke isi Grik, ma ọ naghị etinye nkọwa ụka ọzọ n’ime amaokwu ahụ.
translation_notes:
  register: Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ “isoro n’ahụ” ka ọ bụrụ okwu ebumpụta ụwa n’Igbo ma ka e nwee ike ikwughachi ya dịka e mere na Grik; akara nkọwa [a] dị n’ederede isi.
