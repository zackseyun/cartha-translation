id: 1CO.12.12
reference: 1 Corinthians 12:12
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Καθάπερ γὰρ τὸ σῶμα ἕν ἐστιν καὶ μέλη ⸂πολλὰ ἔχει⸃, πάντα δὲ τὰ μέλη τοῦ ⸀σώματος πολλὰ ὄντα ἕν ἐστιν σῶμα, οὕτως καὶ ὁ Χριστός·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/012.yaml
  text: For just as the body is one and has many members[a], and all the members of the body, though they are many, are one body[b], so also is Messiah.
translation:
  language: ig
  text: N’ihi na, dị nnọọ ka ahụ si bụrụ otu ma nwee ọtụtụ akụkụ ahụ, akụkụ niile nke ahụ, ọ bụ ezie na ha dị ọtụtụ, bụ otu ahụ, otu ahụkwa ka Mesaya[a][b] dị.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Mesaya” pụtara “Onye e tere mmanụ.” Ọ na-asụgharị aha-ọrụ Grik Χριστός ka ihe ọ pụtara wee pụta ìhè.
    reason: Na-eme ka ihe aha-ọrụ Grik Χριστός pụtara doo anya.
  - marker: b
    text: N’okwu Grik, ihe e kwuru kpọmkwem bụ “otu ahụkwa ka Mesaya dị.” E tinyeghị “ahụ Mesaya” ma ọ bụ “chọọchị”; amaokwu ndị na-esochi na-akọwakwu otú ọtụtụ akụkụ si bụrụ otu ahụ.
    reason: Na-echekwa okwu Pọl gbakọrọ ọnụ na nrụgide nkà mmụta okpukpe dị na ya n’etinyeghị nkọwa n’ime isiokwu.
lexical_decisions:
- source_word: Καθάπερ γὰρ
  choice: N’ihi na dị nnọọ ka
  rationale: “Dị nnọọ ka” na-egosipụta ntụnyere siri ike nke καθάπερ, ebe “N’ihi na” na-ejigide ọrụ γάρ nke ijikọ amaokwu a na nkọwa bu ya ụzọ.
- source_word: σῶμα
  choice: ahụ
  rationale: Nke a bụ okwu Igbo nkịtị ma doo anya maka ahụ mmadụ, ma na-edobe ihe atụ Pọl ji arụ ụka.
- source_word: ἕν
  choice: otu
  rationale: “Otu” na-edobe ma echiche ọnụ ọgụgụ ma echiche ịdị n’otu nke dị n’amaokwu ahụ.
- source_word: μέλη
  choice: akụkụ ahụ
  rationale: N’ebe a μέλη bụ akụkụ dị iche iche nke otu ahụ. “Akụkụ ahụ” bụ okwu Igbo eke ma ghara ime ka okwu ahụ buru ụzọ pụta dịka ndị otu nzukọ.
- source_word: πάντα δὲ τὰ μέλη τοῦ σώματος
  choice: akụkụ ahụ niile nke ahụ ahụ
  rationale: A sụgharịrị δέ dịka njikọ dị nro n’usoro ahịrịokwu ahụ, ebe “niile” na-edobe πάντα.
- source_word: πολλὰ ὄντα
  choice: ọ bụ ezie na ha dị ọtụtụ
  rationale: 'Nke a na-egosipụta echiche nkwenye megidere ọnọdụ nke participle ahụ: ha dị ọtụtụ, ma ha ka bụ otu ahụ.'
- source_word: ἕν ἐστιν σῶμα
  choice: bụ otu ahụ
  rationale: Nhọrọ a na-edobe ịdị n’otu nke akụkụ ndị ahụ n’ime otu ahụ, n’asụsụ Igbo dị mkpirikpi ma bụrụkwa nke eke.
- source_word: οὕτως καὶ
  choice: otu ahụkwa ka
  rationale: Nke a bụ ụzọ Igbo e si kwuo mmechi ntụnyere ahụ n’ụzọ doro anya.
- source_word: ὁ Χριστός
  choice: Kraịst
  rationale: “Kraịst” bụ aha-ọrụ a maara nke ọma n’Igbo; nkọwa ala peeji na-eme ka ihe aha-ọrụ Grik ahụ pụtara—Onye E Tere Mmanụ—pụta ìhè, n’etinyeghị nkọwa ahụ n’ahịrịokwu isi.
theological_decisions:
- issue: Otu e si sụgharịa ὁ Χριστός
  choice: Kraịst, ya na nkọwa ala peeji na ọ pụtara Onye E Tere Mmanụ
  alternative: Mesaya
  rationale: “Kraịst” bụ ụdị a na-anabata nke ọma n’Igbo maka Χριστός, ma nkọwa ala peeji na-echekwa ọrụ ya dịka aha-ọrụ, ọ bụghị naanị aha mmadụ.
- issue: Okwu a gbakọrọ ọnụ, οὕτως καὶ ὁ Χριστός
  choice: otu ahụkwa ka Kraịst dị
  alternative: otu ahụkwa ka ahụ Kraịst dị; otu ahụkwa ka chọọchị dị
  rationale: E tinyebeghị “ahụ Kraịst” ma ọ bụ “chọọchị,” n’ihi na ha adịghị n’okwu Grik amaokwu a. Nhọrọ ahụ na-ahapụ okwu Pọl dị mkpirikpi ma dị ịtụnanya ka amaokwu ndị na-esochi kọwaa ya.
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E ji “akụkụ ahụ” mee ka ihe atụ banyere ahụ mmadụ pụta ìhè; e zere okwu ụka pụrụ iche na mgbasawanye na-adịghị n’isi mmalite.
