  to: N’ihi na, dị nnọọ ka ahụ si bụrụ otu ma nwee ọtụtụ akụkụ ahụ, akụkụ niile nke ahụ, ọ bụ ezie na ha dị ọtụtụ, bụ otu ahụ, otu ahụkwa ka Mesaya[a][b] dị.
