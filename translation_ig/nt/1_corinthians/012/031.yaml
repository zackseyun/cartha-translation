revisions:
- from: Ma na-achọsịnụ onyinye ndị ka ukwuu.[a] M ga-egosikwa unu ụzọ ka nke ahụ niile mma nke ukwuu.[b]
  to: Ma na-achọsịnụ onyinye ndị ka ukwuu.[a] M ga-egosikwa unu ụzọ ka mma nke ukwuu.[b]
  rationale: The revision removes the unsupported reference to ‘all that’ and uses idiomatic Standard Igbo to express the exceptional, comparative excellence indicated by καθ’ ὑπερβολὴν. It also corrects the lexical-alternative footnote so that it does not turn the source expression into an unwarranted superlative. The grammatical ambiguity of ζηλοῦτε remains transparently preserved.
