  text: ζηλοῦτε δὲ τὰ χαρίσματα τὰ ⸀μείζονα. καὶ ἔτι καθ’ ὑπερβολὴν ὁδὸν ὑμῖν δείκνυμι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/031.yaml
  text: But earnestly desire the greater gifts[b][a]. And I will show you a still more surpassing way.
translation:
  language: ig
  text: Ma na-achọsịnụ onyinye ndị ka ukwuu.[a] M ga-egosikwa unu ụzọ ka mma nke ukwuu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “Ma unu na-achọsi ike inweta onyinye ndị ka ukwuu.” Ụdị okwu Grik ζηλοῦτε nwere ike ịbụ iwu ma ọ bụ nkwupụta n’ebe a.
    reason: alternative_reading
  - marker: b
    text: N’ụzọ ọdịnala, “ụzọ ka nnọọ mma.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ζηλοῦτε
  choice: na-achọsịnụ
  rationale: Okwu a na-egosi ọchịchọ siri ike ma ọ bụ ịnụ ọkụ n’obi. Ụdị iwu ahụ dabara n’usoro ndụmọdụ Pọl n’ebe a; e debere nghọta nke na-ewere ya dị ka nkwupụta n’ala ala peeji.
- source_word: χαρίσματα
  choice: onyinye
  rationale: N’isiakwụkwọ a, ihe a na-ekwu bụ onyinye sitere n’amara Chineke. ‘Onyinye’ na-eme ka okwu ahụ dị nkenke ma ghara ịtinye ‘nke mmụọ’ ebe okwu ahụ adịghị kpọmkwem n’ahịrịokwu Grik a.
- source_word: μείζονα
  choice: ndị ka ukwuu
  rationale: 'Nke a na-echekwa ntụnyere dị n’okwu Grik: onyinye ndị ka ukwuu ma ọ bụ ndị dị mkpa karịa.'
- source_word: καὶ ἔτι
  choice: M ga-egosikwa
  rationale: Mgbakwunye ‘-kwa’ na-egosi njikọ na ihe gara aga, ebe ahịrịokwu dum na-ebute ihe karịrị mkparịta ụka banyere onyinye.
- source_word: καθ’ ὑπερβολὴν
  choice: ka nke ahụ niile mma nke ukwuu
  rationale: Nke a na-egosipụta ịdị elu pụrụ iche na oke ịdị mma nke ụzọ ahụ n’Igbo a na-aghọta nke ọma, n’agbanyeghị na a pụkwara ịsụ ya n’ụzọ ọdịnala dịka ‘ụzọ kachasị mma.’
- source_word: ὁδὸν
  choice: ụzọ
  rationale: ‘Ụzọ’ na-echekwa ihe atụ nke ụzọ ndụ ma ọ bụ omume, nke na-eduga n’okwu banyere ịhụnanya n’isiakwụkwọ na-esote.
- source_word: δείκνυμι
  choice: M ga-egosi
  rationale: Ọ bụ ezie na Grik ji oge ugbu a, oge ọdịnihu dị mma n’Igbo n’ihi na Pọl na-achọ ịkọwa ụzọ ahụ ozugbo n’ihe na-esote.
theological_decisions:
- issue: Ike ụtọasụsụ nke ζηλοῦτε
  choice: 'Iwu: ‘na-achọsịnụ’'
  alternative: 'Nkwupụta: ‘unu na-achọsi’'
  rationale: Ụdị Grik ahụ nwere ike ịbụ iwu ma ọ bụ nkwupụta. Iwu dabara n’usoro ndụmọdụ Pọl, ma e debere nghọta nke ọzọ n’ala ala peeji ka a ghara ikpochapụ mgbagwoju anya dị n’asụsụ mbụ.
- issue: Uru ma ọ bụ ịdị elu nke ‘ụzọ’ ahụ
  choice: ‘ụzọ ka nke ahụ niile mma nke ukwuu’
  alternative: ‘ụzọ kachasị mma’
  rationale: Nsụgharị a na-echekwa echiche nke καθ’ ὑπερβολὴν banyere ịdị elu gafere oke, n’enweghị ịkọwa ịhụnanya n’ụzọ ozizi pụrụ iche.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe ma dị ùgwù. ‘Na-achọsịnụ’ na-egosi iwu nye ọtụtụ mmadụ; ‘onyinye’ na-ahapụ ọnọdụ gbara ya gburugburu ka ọ kọwaa na ndị a bụ onyinye amara. E zere okwu ụka nke otu ngalaba pụrụ iche.
