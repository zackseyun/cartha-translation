    reason: alternative_reading
  - marker: b
    text: N’ụzọ ọdịnala, “ụzọ ka nnọọ mma.”
    reason: lexical_alternative
  revision_rationale: The revision removes the unsupported reference to ‘all that’ and uses idiomatic Standard Igbo to express the exceptional, comparative excellence indicated by καθ’ ὑπερβολὴν. It also corrects the lexical-alternative footnote so that it does not turn the source expression into an unwarranted superlative. The grammatical ambiguity of ζηλοῦτε remains transparently preserved.
