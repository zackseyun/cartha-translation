id: 1CO.12.30
reference: 1 Corinthians 12:30
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: μὴ πάντες χαρίσματα ἔχουσιν ἰαμάτων; μὴ πάντες γλώσσαις λαλοῦσιν; μὴ πάντες διερμηνεύουσιν;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/030.yaml
  text: Not all have gifts of healings[a], do they? Not all speak in tongues, do they? Not all interpret[b], do they?
translation:
  language: ig
  text: Ọ̀ bụ mmadụ niile nwere onyinye ịgwọ ọrịa[a]? Ọ̀ bụ mmadụ niile na-asụ asụsụ dị iche iche[b]? Ọ̀ bụ mmadụ niile na-akọwa asụsụ dị iche iche?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'N''asụsụ Grik, ma “onyinye” ma “ọgwụgwọ” dị n''ụdị ọtụtụ: “onyinye nke ọgwụgwọ dị iche iche.”'
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “na-ekwu okwu n'asụsụ dị iche iche.” N'ebe a, okwu ahụ na-ezo aka n'onyinye a na-akpọkarị ịsụ asụsụ dị iche iche.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ πάντες
  choice: Ọ̀ bụghị mmadụ niile ... ka hà ...?
  rationale: Ajụjụ ndị μή malitere na-atụ anya azịza na-adịghị mma. Ụdị a na-egosi nke ọma na Pọl na-ekwusi ike na ọ bụghị mmadụ niile nwere otu onyinye.
- source_word: χαρίσματα
  choice: onyinye dị iche iche
  rationale: “Onyinye” bụ okwu Igbo doro anya maka onyinye amara; “dị iche iche” na-enyere aka igosi ọtụtụ onyinye ndị a kpọrọ aha n'ụdị ọtụtụ.
- source_word: ἰαμάτων
  choice: nke ịgwọ ọrịa
  rationale: Nke a na-egosi ọrụ ime ka ndị ọrịa gbakee. Ihe odide Grik ji ụdị ọtụtụ, nke e mere ka ọ pụta ìhè site n'okwu “onyinye dị iche iche”; ihe odide ala kọwakwuru ya.
- source_word: γλώσσαις
  choice: asụsụ dị iche iche
  rationale: γλῶσσα nwere ike ịpụta asụsụ, ma n'ebe a ọ na-ezo aka n'onyinye a na-akpọkarị ịsụ asụsụ dị iche iche. Nsụgharị a bụ nke okike ma na-edebe ohere nkọwa okwu ahụ.
- source_word: λαλοῦσιν
  choice: na-asụ
  rationale: Ụdị ugbu a na-egosi omume a na-ahụkarị, ya mere “na-asụ” dabara n'Igbo nkịtị.
- source_word: διερμηνεύουσιν
  choice: na-akọwa ihe a sụrụ
  rationale: N'okwu gbara ya gburugburu, ngwaa ahụ pụtara ime ka ihe e kwuru n'asụsụ dị iche doo ndị ọzọ anya; nkọwa a na-ezere ịghọta ya nanị dị ka ịsụgharị asụsụ nkịtị.
theological_decisions:
- issue: Ụdị ajụjụ Pọl ji μή jụọ
  choice: Ajụjụ ndị na-atụ anya azịza na-adịghị mma
  alternative: Ajụjụ nkịtị nke na-adịghị egosi azịza a tụrụ anya ya
  rationale: Usoro okwu Grik na-egosi na ọ bụghị onye kwere ekwe ọ bụla nwere onyinye ọ bụla. Ụdị Igbo a na-edebe nkwusi ike Pọl banyere onyinye dị iche iche n'ime otu ahụ.
- issue: Ihe διερμηνεύουσιν pụtara n'okwu banyere asụsụ dị iche iche
  choice: ịkọwa ihe a sụrụ ka ọ doo ndị ọzọ anya
  alternative: ịsụgharị ya dị ka asụsụ mmadụ nkịtị kpọmkwem
  rationale: Ihe gbara amaokwu ahụ gburugburu na 1 Ndị Kọrịnt 12–14 na-elekwasị anya n'ime ka okwu ahụ bụrụ ihe ọgbakọ ga-aghọta, ma ọ naghị ekpebi kpọmkwem usoro e si eme ya.
translation_notes:
  register: Standard Igbo; okwu dị ugbu a, dị ùgwù, ma dị mfe nghọta. E ji usoro ajụjụ na tag “ka hà ...?” mee ka azịza na-adịghị mma a tụrụ anya ya pụta ìhè. Akara ụda dị na “Ọ̀” naanị ebe ọ na-enyere aka ikewapụ ajụjụ ahụ n'ụzọ doro anya.
