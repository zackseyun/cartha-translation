  text: νῦν δὲ πολλὰ ⸀μὲν μέλη, ἓν δὲ σῶμα.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/020.yaml
  text: But as it is[a], there are many parts, yet one body.
translation:
  language: ig
  text: Ma dị ka ọ dị ugbu a, akụkụ ahụ dị ọtụtụ, ma ahụ bụ otu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Ọtụtụ akụkụ, ma otu ahụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: νῦν
  choice: dị ka ihe si dị ugbu a
  rationale: N'usoro arụmụka a, νῦν na-egosi otú ọnọdụ ahụ si dị n'eziokwu ugbu a, ọ bụghị naanị oge a kpọrọ ‘ugbu a’; nkebiokwu a jikọtara ya na ihe e kwuru n'amaokwu bu ụzọ.
- source_word: δὲ
  choice: Ma
  rationale: δὲ na-egosi ntakịrị ntụgharị ma ọ bụ ọdịiche megide echiche e kwuru na mbụ.
- source_word: πολλὰ ... μέλη
  choice: akụkụ ahụ dị ọtụtụ
  rationale: μέλη n'ihe atụ gbasara ahụ pụtara akụkụ ndị mejupụtara ahụ. ‘Akụkụ ahụ’ bụ Igbo doro anya ma na-edobe ihe atụ ahụ.
- source_word: μὲν ... δὲ
  choice: dị ọtụtụ, ma ... bụ otu
  rationale: Njikọ μὲν ... δὲ na-atụnyere ịdị ọtụtụ n'otu akụkụ na ịdị otu n'akụkụ nke ọzọ; usoro Igbo a na-egosipụta nguzozi na ọdịiche ahụ n'ụzọ ebumpụta ụwa.
- source_word: ἓν
  choice: otu
  rationale: Ọnụọgụ a na-emesi ịdị n'otu ike n'agbanyeghị ịdị ọtụtụ nke akụkụ ahụ.
- source_word: σῶμα
  choice: ahụ
  rationale: σῶμα bụ ‘ahụ’ n'ime ihe atụ Pọl ji akọwa ọgbakọ, ma okwu a na-edobe ma onyonyo ahụ ma echiche nke ịdị n'otu.
theological_decisions:
- issue: Otu e si sụgharịta μέλη n'ihe atụ nke ahụ
  choice: akụkụ ahụ
  alternative: ndị otu
  rationale: ‘Akụkụ ahụ’ na-eme ka ihe atụ gbasara ahụ doo anya, ma zere ime μέλη ka ọ bụrụ naanị okwu nhazi ọgbakọ. Otú ọ dị, ‘ndị otu’ ka bụ ụzọ ọzọ e nwere ike isi ghọta okwu ahụ n'ihe gbasara ọgbakọ, ya mere e debere ya n'ala ala peeji.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A hapụrụ ihe atụ nke ahụ na esemokwu dị n'etiti ọtụtụ akụkụ na otu ahụ ka ha guzosie ike.
