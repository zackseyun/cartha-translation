  text: For the body is not one member, but many.
translation:
  language: ig
  text: N’ihi na ahụ abụghị otu akụkụ, kama ọ bụ ọtụtụ akụkụ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ γὰρ
  choice: N’ihi na
  rationale: Ngwakọta mkpụrụokwu a na-enye nkọwa ma jikọta okwu a na arụmụka bu ya ụzọ. “N’ihi na” na-egosipụta ọrụ a n’Igbo nke ọma n’enweghị ịsụgharị mkpụrụokwu abụọ ahụ n’ụzọ ga-ada arọ.
- source_word: τὸ σῶμα
  choice: ahụ
  rationale: Nke a bụ nsụgharị nkịtị nke isiokwu ahịrịokwu ahụ. Pọl ji ahụ mee ihe atụ n’ebe a; a hapụrụ ihe atụ ahụ ka ọ dị, kama ịkọwa ya ozugbo dị ka nzukọ Kraịst.
- source_word: οὐκ ἔστιν
  choice: abụghị
  rationale: Nke a na-asụgharị ngwaa njikọ e tinyere ngọnarị n’ụzọ kpọmkwem ma bụrụkwa Igbo eke.
- source_word: ἓν μέλος
  choice: otu akụkụ
  rationale: N’Igbo nke oge a, “akụkụ” bụ okwu doro anya ma dị eke maka akụkụ ahụ. Ọ na-echekwa ihe atụ banyere ahụ n’enweghị nghọtahie okwu “onye otu,” nke pụrụ izo aka n’otu mmadụ.
- source_word: ἀλλὰ πολλά
  choice: kama ọ bụ ọtụtụ akụkụ
  rationale: πολλά bụ adjective e ji dị ka noun, ebe a ghọtara μέλη site n’okwu bu ya ụzọ. Igbo chọrọ imegharịa “akụkụ” ka ahịrịokwu ahụ doo anya ma daa nke ọma; “ọ bụ” na-eme ka ọdịiche ahụ bụrụ nke eke.
theological_decisions:
- issue: Ihe “ahụ” na-anọchi anya ya n’ihe atụ a
  choice: Idobe naanị “ahụ” dịka Pọl si kwuo ya
  alternative: ahụ Kraịst
  rationale: Ọ bụ ezie na okwu ndị gbara amaokwu a gburugburu na-ekwu banyere nzukọ dịka ahụ Kraịst, amaokwu a n’onwe ya kwuru naanị “ahụ.” Ịgbakwunye “Kraịst” ga-akọwa ihe atụ ahụ n’ime isi ederede karịa ka okwu Grik si kwuo.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. “Akụkụ” ka a họọrọ karịa “onye otu” iji mee ka ihe atụ nke akụkụ anụ ahụ doo anya ma zere ịtụgharị ya ozugbo gaa n’echiche nke onye so n’otu.
