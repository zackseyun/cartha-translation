  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Περὶ δὲ τῶν πνευματικῶν, ἀδελφοί, οὐ θέλω ὑμᾶς ἀγνοεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/001.yaml
  text: Concerning spiritual gifts, brothers, I do not want you to be uninformed.
translation:
  language: ig
  text: Banyere ihe ime mmụọ[a], ụmụnna[b], achọghị m ka unu ghara ịma banyere ha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “onyinye ime mmụọ.” Okwu Grik a sara mbara karịa “onyinye,” ọ bụ ezie na isiokwu nke isiakwụkwọ a lekwasịrị anya n'onyinye Mmụọ Nsọ na-enye.
    reason: alternative_reading
  - marker: b
    text: Okwu Grik a pụtara “ụmụnne nwoke,” ma Pọl ji ya akpọ ọgbakọ dum, o yikwara ka ọ gụnyere ụmụ nwanyị kwa.
    reason: cultural_note
lexical_decisions:
- source_word: Περὶ δὲ
  choice: Ma banyere
  rationale: Nke a na-egosi ngafe gaa n'isiokwu ọhụrụ. “Ma banyere” na-egosipụta περί na ọrụ njikọ dị nro nke δέ n'ụzọ Igbo na-aga were were, n'etinyeghị okwu oge dịka “ugbu a.”
- source_word: τῶν πνευματικῶν
  choice: onyinye ime mmụọ
  rationale: Adjective a e jiri dịka aha sara mbara ma nwee ike ịpụta ihe ime mmụọ; agbanyeghị, okwu ndị na-esochi na-elekwasị anya n'ihe Mmụọ Nsọ na-enye. Ya mere “onyinye ime mmụọ” doro onye na-agụ anya, ebe e debere nghọta sara mbara n'okpuru peeji.
- source_word: ἀδελφοί
  choice: ụmụnna
  rationale: “Ụmụnna” bụ okwu ọkpụkpọ sitere n'otu ezinụlọ nke na-adabara ụzọ Pọl si akpọ ọgbakọ, ma n'Igbo ọ nwekwara ike ịgụnye ndị nwoke na ndị nwanyị. Ihe banyere ọdịdị okwu Grik ka akọwara n'okpuru peeji.
- source_word: οὐ θέλω ὑμᾶς ἀγνοεῖν
  choice: achọghị m ka unu ghara ịma banyere ha
  rationale: Nke a na-ebute nkuzi dị mkpa ma na-egosipụta echiche nke enweghị ihe ọmụma n'ụzọ Igbo nkịtị, na-enweghị ụda mkparị.
theological_decisions:
- issue: Nkọwa τῶν πνευματικῶν
  choice: onyinye ime mmụọ
  alternative: ihe ime mmụọ; ndị ime mmụọ
  rationale: Ụdị Grik ahụ anaghị ekwu “onyinye” hoo haa, ya mere ọ ka sara mbara. Ma 1 Ndị Kọrịnt 12:4–11 na-ekwu banyere onyinye na ngosipụta Mmụọ Nsọ, nke mere ka “onyinye ime mmụọ” bụrụ ihe dabara n'ọnọdụ a. E debere nghọta sara mbara n'okpuru peeji ka a ghara ihichapụ mgbagwoju anya dị n'isi mmalite.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị ùgwù ma dị mfe nghọta. E ji “ụmụnna” mee ka okwu ọkpụkpọ ahụ bụrụ nke eke n'Igbo, ebe nkọwa ala peeji na-echekwa ọdịdị nwoke nke okwu Grik. A tinyere “banyere ha” iji mee ka njikọ ngwaa ahụ doo anya n'Igbo.
