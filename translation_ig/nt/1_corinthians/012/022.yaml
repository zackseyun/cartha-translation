    text: A pụkwara ịsị, “Ma nke ka nke, akụkụ dị iche iche nke ahụ ndị yiri ka hà na-esighị ike bụ ndị dị mkpa.” Okwu Grik ahụ nwere okwu na-emesi echiche a ike, nke pụtara “nke ka nke” ma ọ bụ “karịa nnọọ.”
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị “akụkụ dị iche iche nke ahụ” dịka “membà nke ahụ.”
    reason: lexical_alternative
  - marker: c
    text: A pụkwara ịsị, “bụ ndị a na-apụghị ime na-enweghị ha.”
    reason: lexical_alternative
