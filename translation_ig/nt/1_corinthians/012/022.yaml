  yaml_path: translation/nt/1_corinthians/012/022.yaml
  text: On the contrary[a], the parts of the body that seem to be weaker are necessary[c][b],
translation:
  language: ig
  text: Kama nke ahụ, akụkụ dị iche iche nke ahụ ndị a na-ahụ ka ndị na-esighị ike bụ ndị ka dị mkpa nke ukwuu.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “Ma nke ka nke, akụkụ dị iche iche nke ahụ ndị yiri ka hà na-esighị ike bụ ndị dị mkpa.” Okwu Grik ahụ nwere okwu na-emesi echiche a ike, nke pụtara “nke ka nke” ma ọ bụ “karịa nnọọ.”
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị “akụkụ dị iche iche nke ahụ” dịka “membà nke ahụ.”
    reason: lexical_alternative
  - marker: c
    text: A pụkwara ịsị, “bụ ndị a na-apụghị ime na-enweghị ha.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Kama nke ahụ
  rationale: Na-egosi mmegide siri ike na mgbazi nke echiche e kwuru n’amaokwu bu ụzọ.
- source_word: πολλῷ μᾶλλον
  choice: bụdị ndị dị nnọọ mkpa
  rationale: Okwu a na-emesi ihe na-esochi ya ike nke ukwuu; “bụdị” na “nnọọ” na-egosipụta na ihe megidere echiche mbụ bụ eziokwu nke ukwuu.
- source_word: τὰ δοκοῦντα
  choice: ndị yiri ka
  rationale: Na-echekwa echiche nke ihe mmadụ na-ahụ ma ọ bụ na-eche, n’ekwughị na adịghị ike ahụ bụ ọnọdụ ha n’ezie.
- source_word: μέλη τοῦ σώματος
  choice: akụkụ ahụ
  rationale: Nke a bụ okwu Igbo dị mfe ma bụrụkwa nke nkịtị maka akụkụ dị iche iche nke otu ahụ, ma na-echekwa ihe atụ ahụ Pọl ji mee ihe.
- source_word: ἀσθενέστερα ὑπάρχειν
  choice: ha esighị ike
  rationale: Na-egosipụta adịghị ike e jiri atụnyere akụkụ ndị ọzọ n’asụsụ Igbo dị ugbu a ma dị mfe nghọta.
- source_word: ἀναγκαῖά ἐστιν
  choice: ndị dị nnọọ mkpa
  rationale: Na-egosipụta na a pụghị ileghara akụkụ ndị ahụ anya ma ọ bụ were ha dị ka ihe na-abaghị uru, na-agbanyeghịghị nkọwa ọzọ n’amaokwu ahụ.
theological_decisions:
- issue: Ike nke ihe atụ banyere ahụ n’ihe gbasara nzukọ ndị kwere ekwe
  choice: Idowe okwu ahụ dịka ihe atụ doro anya banyere akụkụ ahụ
  alternative: Ịsụgharị μέλη ozugbo dịka ndị otu chọọchị
  rationale: Ọ bụ ezie na ihe gbara amaokwu ahụ gburugburu na-etinye ihe atụ a n’ahụ Kraịst na ndị kwere ekwe, amaokwu a n’onwe ya ka na-ekwu maka akụkụ ahụ; ya mere, nsụgharị ahụ anaghị atụgharị ihe atụ ahụ ka ọ bụrụ nkọwa ozugbo.
- issue: Ma akụkụ ndị ahụ hà bụ ndị na-adịghị ike n’ezie
  choice: “ndị yiri ka ha esighị ike”
  alternative: “akụkụ ndị na-adịghị ike”
  rationale: δοκοῦντα na-egosi otú a na-ahụ ma ọ bụ na-ewere ha, ọ bụghị nkwupụta doro anya na ha adịghị ike n’ezie.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “Kama nke ahụ” na-enye mmegide doro anya; “bụdị ndị dị nnọọ mkpa” na-eweghachi ike πολλῷ μᾶλλον n'ụzọ Igbo na-ada nke ọma. E debere ihe atụ banyere ahụ n’enweghị itinye nkọwa ụka n’ime amaokwu ahụ.
