revisions:
- from: Kama nke ahụ, akụkụ ahụ ndị yiri ka ha esighị ike bụdị ndị dị nnọọ mkpa.[a][b][c]
  to: Kama nke ahụ, akụkụ dị iche iche nke ahụ ndị a na-ahụ ka ndị na-esighị ike bụ ndị ka dị mkpa nke ukwuu.[a][b][c]
