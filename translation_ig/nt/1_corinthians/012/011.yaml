  to: Ma otu Mmụọ ahụ ka na-arụ[a] ihe ndị a niile—otu Mmụọ ahụ na otu ahụ[b]—na-ekesara[c] onye ọ bụla n’otu n’otu, dị ka ọ chọrọ[d].
  rationale: E degharịala ahịrịokwu ahụ ka ọ bụrụ Igbo eke, ma chekwaa nkwusi ike dị na «otu ... na otu ahụ». A gbanwere nkọwa ala b ka ọ ghara ikwu «onye», nke na-adịghị na Grik, ma dozie ebe ihe nrịbama nkọwa ala dị. «Dị ka ọ chọrọ» na-edobe uche na ọrụ nke Mmụọ ahụ n’etinyeghị nkọwa okwukwe ọzọ.
