  text: πάντα δὲ ταῦτα ἐνεργεῖ τὸ ἓν καὶ τὸ αὐτὸ πνεῦμα, διαιροῦν ἰδίᾳ ἑκάστῳ καθὼς βούλεται.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/011.yaml
  text: But one and the same Spirit works all these things[d][c][b][a], distributing to each one individually just as he wills.
translation:
  language: ig
  text: Ma otu Mmụọ ahụ ka na-arụ[a] ihe ndị a niile—otu Mmụọ ahụ na otu ahụ[b]—na-ekesara[c] onye ọ bụla n’otu n’otu, dị ka ọ chọrọ[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “na-arụpụta” ma ọ bụ “na-eme ka ihe ndị a niile pụta.”
    reason: lexical_alternative
  - marker: b
    text: N’asụsụ Grik, “otu Mmụọ ahụ na otu ahụ”; nke a na-emesi ike na onyinye dị iche iche sitere n’otu ebe.
    reason: cross_reference
  - marker: c
    text: A pụkwara ịsị, “na-ekenye onye ọ bụla òkè nke ya.”
    reason: lexical_alternative
  - marker: d
    text: A pụkwara ịsị, “dị ka ọ họọrọ.” Okwu Grik ahụ pụrụ ịpụta ịchọ, ịhọrọ, ma ọ bụ inwe ọchịchọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα δὲ ταῦτα
  choice: Ma ... ihe ndị a niile
  rationale: “Ihe ndị a niile” na-egosipụta na okwu a metụtara onyinye na ngosipụta niile e depụtara n’amaokwu ndị bu ụzọ; “Ma” na-egosi ntakịrị mgbanwe site n’ụdị onyinye dị iche iche gaa n’otu onye na-arụ ha.
- source_word: ἐνεργεῖ
  choice: na-arụ
  rationale: “Na-arụ” na-egosipụta ọrụ na ike nke Mmụọ n’enweghị ịkọwa kpọmkwem otú o si eme ya; ọ bụkwa okwu Igbo dị mfe ma kwekọọ n’echiche nke ịrụpụta ma ọ bụ ime ka ihe pụta.
- source_word: τὸ ἓν καὶ τὸ αὐτὸ πνεῦμα
  choice: otu Mmụọ ahụ, búkwa otu Mmụọ ahụ n’onwe ya
  rationale: Usoro a na-edobe nkwusi ike Grik na Mmụọ ahụ bụ otu onye ahụ n’agbanyeghị na onyinye ya dị iche iche. E ji mkpụrụedemede ukwu dee “Mmụọ” n’ihi na ebe a okwu ahụ na-ezo aka na Mmụọ Nsọ.
- source_word: διαιροῦν
  choice: na-ekesara
  rationale: “Na-ekesara” dabara n’ihe gbasara inye onyinye ma chekwaa echiche nke ikenye onye ọ bụla òkè, n’enweghị echiche ọjọọ nke ịkewa ihe.
- source_word: ἰδίᾳ ἑκάστῳ
  choice: onye ọ bụla n’otu n’otu
  rationale: Nke a na-edobe echiche nkesa nye onye nke ọ bụla kpọmkwem, ọ bụghị naanị nye ìgwè mmadụ n’ozuzu.
- source_word: καθὼς βούλεται
  choice: dị ka ọ chọrọ
  rationale: “Dị ka ọ chọrọ” na-egosipụta uche na mkpebi nke Mmụọ ma na-anọgide n’okwu Igbo a na-aghọta ngwa ngwa.
theological_decisions:
- issue: Onye πνεῦμα na βούλεται na-ezo aka na ya na ịbụ onye nwere uche
  choice: “Mmụọ” na-ezo aka na Mmụọ Nsọ, a sịkwa “dị ka ọ chọrọ” iji gosi na ọ na-eme mkpebi n’onwe ya.
  alternative: A pụrụ ime ka onye na-eme ihe ghara ịpụta ìhè, dịka “dị ka e si chọọ,” ma ọ bụ were Mmụọ dịka ike na-abụghị onye.
  rationale: Ọ bụ ezie na πνεῦμα bụ okwu nwere ụdị etiti n’asụsụ Grik, βούλεται na-ekwu na Mmụọ ahụ nwere uche ma na-ekpebi otú e si ekesa onyinye. Igbo anaghị ekewa “ọ” dịka nwoke ma ọ bụ nwanyị, ma ahịrịokwu ahụ ka na-egosi na Mmụọ bụ onye na-arụ ọrụ ma na-ahọrọ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta mee ntụgharị a. “N’otu n’otu” na-eme ka nkesa nye onye ọ bụla doo anya; mmegharị okwu n’akụkụ “otu Mmụọ ahụ” bụ nke e kpachapụrụ anya debe iji chekwaa nkwusi ike dị n’asụsụ Grik.
