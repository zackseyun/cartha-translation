review_pass:
  verdict: revise
  source_fidelity: A na-echekwa ihe atụ nke anya, aka, isi, na ụkwụ, nakwa ọdịiche dị n’etiti nnọchiaha otu onye (σου) na ọtụtụ mmadụ (ὑμῶν). Ma “Achọghị m gị/unu” pụtara karịa “I do not want you” karịa χρείαν ... οὐκ ἔχω (“Enweghị m mkpa gị/unu”). Ọzọkwa, “isi agaghị asị” nwere ike igosi ọdịnihu ma ọ bụ jụ ime ihe, ebe οὐ δύναται na-ekwu maka enweghị ike; e kwesịrị iji “enweghị ike.”
  naturalness: “ịgwa ... sị” na-ada n’ụzọ Igbo nke oge a karịa “ịsị [mmadụ/akụkụ ahụ],” ma na-echekwa okwu a na-ekwu kpọmkwem. “ma ọ bụ ọzọ” na-egosi ἢ πάλιν n’ụzọ doro anya karịa “maọbụkwa.”
  terminology: “Mkpa” bụ okwu Standard Igbo kwesịrị ekwesị maka χρεία (“need”). “Gị” na “unu” na-echekwa nke ọma ọdịiche Grik dị n’etiti aka otu na ụkwụ ọtụtụ.
  issues:
  - severity: medium
    issue: “Achọghị m gị/unu” anaghị asụgharị χρείαν ... οὐκ ἔχω kpọmkwem.
    rationale: Nkebiokwu ahụ pụtara na onye na-ekwu okwu enweghị mkpa onye a na-agwa okwu, ọ bụghị na ọ chọghị ya. “Enweghị m mkpa gị/unu” na-echekwa echiche “need” ahụ.
  - severity: medium
    issue: “Isi agaghị asị” agbanwere οὐ δύναται (“enweghị ike”) ka ọ bụrụ ụdị ọdịnihu.
    rationale: Greek na-ekwupụta enweghị ike, ma ọ bụghị ihe isi ga-adịghị ekwu n’ọdịnihu. Ikwughachi “enweghị ike” n’Igbo na-eme ka nke a doo anya.
  - severity: low
    issue: “maọbụkwa” anaghị egosi πάλιν (“ọzọ/again”) nke ọma.
    rationale: “ma ọ bụ ọzọ” na-echekwa na Pọl na-eweta ihe atụ ọzọ yiri nke mbụ.
