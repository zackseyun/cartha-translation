  text: οὐ δύναται δὲ ὁ ὀφθαλμὸς εἰπεῖν τῇ χειρί· Χρείαν σου οὐκ ἔχω, ἢ πάλιν ἡ κεφαλὴ τοῖς ποσίν· Χρείαν ὑμῶν οὐκ ἔχω·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/021.yaml
  text: But the eye cannot say to the hand[a], ‘I have no need of you,’ or again the head to the feet, ‘I have no need of you.’
translation:
  language: ig
  text: Ma anya enweghị ike ịgwa aka sị, “Enweghị m mkpa gị,” ma ọ bụ ọzọ, isi enweghị ike ịgwa ụkwụ sị, “Enweghị m mkpa unu.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'N’asụsụ Grik, nnọchiaha dị n’okwu nke abụọ bụ ọtụtụ: isi na-agwa “ụkwụ” okwu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ δύναται
  choice: enweghị ike
  rationale: Na-egosi enweghị ikike ime ihe ahụ, ọ bụghị naanị na ime ya adịghị mma.
- source_word: δὲ
  choice: Ma
  rationale: Na-egosi ntụgharị ma ọ bụ ọdịiche n’ihe Pọl kwuru tupu nke a banyere akụkụ ahụ dị iche iche.
- source_word: ὁ ὀφθαλμός
  choice: anya
  rationale: Na-echekwa ihe atụ Pọl ji akụkụ ahụ mmadụ mee.
- source_word: εἰπεῖν
  choice: ịsị
  rationale: Ọ bụ okwu Igbo dị mfe ma kwekọọ n’infinitive Grik ahụ.
- source_word: τῇ χειρί
  choice: aka
  rationale: Na-echekwa akụkụ ahụ e kwuru kpọmkwem; usoro Igbo anaghị achọ preposition ọzọ n’ebe a.
- source_word: Χρείαν σου οὐκ ἔχω
  choice: Achọghị m gị
  rationale: Ọ bụ ụzọ Igbo nkịtị si ekwu na mmadụ adịghị mkpa onye ọzọ, n’enweghị ịgbakwunye echiche siri ike dịka ‘ọ dịghị uru ị bara m.’
- source_word: ἢ πάλιν
  choice: maọbụkwa
  rationale: Na-ewebata ihe atụ nke abụọ yiri nke mbụ n’ụzọ Igbo dị ire.
- source_word: ἡ κεφαλή
  choice: isi
  rationale: Na-echekwa ihe atụ ahụ mmadụ.
- source_word: τοῖς ποσίν
  choice: ụkwụ
  rationale: Na-echekwa ihe oyiyi nke isi na-agwa ụkwụ okwu; ‘ụkwụ’ nwere ike ịbụ otu ma ọ bụ ọtụtụ n’Igbo.
- source_word: ὑμῶν
  choice: unu
  rationale: Na-eme ka ọtụtụ mmadụ dị na nnọchiaha Grik pụta ìhè, dị iche na ‘gị’ e ji gwa aka.
theological_decisions:
- issue: Ihe atụ akụkụ ahụ nke na-egosi na ndị nọ n’ọgbakọ Kraịst chọrọ ibe ha
  choice: E chekwara anya, aka, isi, na ụkwụ dịka ihe atụ nkịtị n’amaokwu ahụ.
  alternative: Ịkọwa ha ozugbo dịka ndị otu ọgbakọ Kraịst.
  rationale: Isi ihe Pọl na-akụzi sitere n’ihe atụ ahụ n’onwe ya; ịkọwa ya n’ime amaokwu ga-agafe ntụgharị banye na nkọwa.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe ma dị ùgwù. ‘Gị’ na ‘unu’ na-egosipụta ọdịiche dị n’etiti nnọchiaha otu onye na nke ọtụtụ mmadụ n’asụsụ Grik. A hapụrụ ihe atụ akụkụ ahụ n’enweghị nkọwa agbakwunyere.
