revisions:
- from: Ma anya enweghị ike ịsị aka, “Achọghị m gị,” maọbụkwa isi agaghị asị ụkwụ, “Achọghị m unu.”[a]
  to: Ma anya enweghị ike ịgwa aka sị, “Enweghị m mkpa gị,” ma ọ bụ ọzọ, isi enweghị ike ịgwa ụkwụ sị, “Enweghị m mkpa unu.”[a]
  rationale: E degharịrị okwu ndị a na-ekwu ka ha gosipụta χρεία (“mkpa”) n’enweghị mgbakwunye echiche nke ịchọghị mmadụ. E weghachiri “enweghị ike” n’akụkụ nke abụọ iji soro οὐ δύναται, ma jiri “ma ọ bụ ọzọ” sụgharịa ἢ πάλιν. A chekwabara ihe atụ akụkụ ahụ, ụda amaokwu, na akara footnote banyere nnọchiaha ọtụtụ.
  reviewer_model: gpt-5.6-terra
