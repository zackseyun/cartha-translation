base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/017.yaml
  text: If the whole body were an eye[a], where would the hearing be? If the whole were hearing, where would the sense of smell be?
translation:
  language: ig
  text: Ọ bụrụ na ahụ dum bụ anya[a], olee ebe ịnụ ihe ga-adị? Ọ bụrụ na ahụ dum bụ ịnụ ihe, olee ebe ịnụ ísì ga-adị?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “olee ebe ntị ga-adị? ... olee ebe imi ga-adị?” N'ụzọ nkịtị karị, okwu Grik ahụ na-ekwu banyere ikike ịnụ ihe na ịnụ ísì.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅλον τὸ σῶμα
  choice: ahụ niile
  rationale: Nke a bụ ụzọ doro anya ma bụrụkwa Igbo nkịtị isi kwuo ahụ dum, na-echekwa ihe atụ Pọl banyere otu ahụ nke akụkụ ya dị iche iche.
- source_word: ὀφθαλμός
  choice: naanị anya
  rationale: “Anya” na-echekwa otu akụkụ ahụ e kwuru n'asụsụ Grik; “naanị” na-eme ka echiche nke ahụ dum ịbụ anya pụta ìhè n'Igbo.
- source_word: ποῦ
  choice: olee ebe ... ga-adị?
  rationale: Ajụjụ a pụtara “ebe ole?”; iji “ga-adị” dabara n'ọnọdụ a na-eche n'echiche, bụ́ “ọ bụrụ na...”
- source_word: ἀκοή
  choice: ịnụ ihe
  rationale: Okwu Grik a na-ezo aka n'ikike ma ọ bụ ọrụ ịnụ ihe, ọ bụghị kpọmkwem ntị dịka akụkụ ahụ. Nhọrọ a na-echekwa ọdịiche ahụ ma dịkwa mfe nghọta.
- source_word: ὅλον
  choice: ahụ niile
  rationale: Ọ bụ ezie na “ahụ” adịghị n'ahịrịokwu Grik nke abụọ, ọ ka na-apụta site n'ahịrịokwu mbụ. Ikwughachi ya na-eme ka Igbo bụrụ nke eke ma doo anya.
- source_word: ὄσφρησις
  choice: ịnụ isi
  rationale: Nke a bụ okwu Igbo nkịtị maka ikike isi ísì, ma na-echekwa na Grik kwuru banyere ọrụ mmetụta ahụ, ọ bụghị imi n'onwe ya.
theological_decisions:
- issue: Ma a ga-asụgharị ọrụ mmetụta uche ma ọ bụ akụkụ ahụ
  choice: E ji “ịnụ ihe” na “ịnụ isi” sụgharịa ἀκοή na ὄσφρησις.
  alternative: “Ntị” na “imi.”
  rationale: Grik kpọrọ ikike ịnụ ihe na ịnụ isi aha, ọ bụghị akụkụ ahụ bụ ntị na imi. Nsụgharị a na-anọgide nso n'isi iyi ma hapụkwa ihe atụ Pọl dịka o siri dee ya.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị mfe nghọta ma nwee ugwu. “Naanị” na-enyere onye na-agụ ya aka ịghọta echiche a na-eche n'echiche nke ahụ dum ịbụ otu akụkụ, ebe “ịnụ ihe” na “ịnụ isi” na-echekwa okwu banyere ikike mmetụta dị na Grik.
