  text: to another[a], faith by the same Spirit; to another, gifts of healings by the one Spirit[b],
translation:
  language: ig
  text: a na-enyekwa onye ọzọ okwukwe[a] site n’otu Mmụọ ahụ; a na-enyekwa onye ọzọ onyinye nke ọgwụgwọ dị iche iche site n’otu Mmụọ ahụ[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “ịtụkwasị obi” ma ọ bụ “ikwesi ntụkwasị obi.”
    reason: lexical_alternative
  - marker: b
    text: 'N’asụsụ Grik, ma “onyinye” ma “ọgwụgwọ” dị n’ụdị ọtụtụ: “onyinye nke ọgwụgwọ dị iche iche.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑτέρῳ
  choice: onye ọzọ
  rationale: Ọ na-aga n’ihu n’usoro nkesa sitere n’amaokwu bu ụzọ; ‘onye ọzọ’ bụ Igbo doro anya ma ghara ịmanye ọdịiche siri ike n’etiti ἕτερος na ἄλλος.
- source_word: πίστις
  choice: okwukwe
  rationale: ‘Okwukwe’ bụ ntụgharị nkịtị nke πίστις n’Igbo ma dabara n’ọnọdụ onyinye Mmụọ a; nkọwa ala peeji na-echekwa nghọta ndị ọzọ nwere ike ịdị.
- source_word: ἐν τῷ αὐτῷ πνεύματι
  choice: site n’otu Mmụọ ahụ
  rationale: N’ebe a, ἐν na-egosi onye e si n’aka ya nye onyinye ahụ. ‘Site n’otu Mmụọ ahụ’ na-ada nke ọma n’Igbo ma na-echekwa nkwusi ike na ọ bụ otu Mmụọ ahụ.
- source_word: ἄλλῳ
  choice: onye ọzọ
  rationale: Ọ na-aga n’ihu n’usoro nkesa onyinye nye ndị dị iche iche; otu ntụgharị ahụ bụ ihe kachasị eke n’Igbo.
- source_word: χαρίσματα
  choice: onyinye dị iche iche
  rationale: ‘Onyinye’ na-ebute echiche nke ihe e nyere n’amara; ‘dị iche iche’ na-enyere aka igosipụta ọtụtụ nke χαρίσματα n’Igbo nkịtị.
- source_word: ἰαμάτων
  choice: ọgwụgwọ
  rationale: ‘Ọgwụgwọ’ na-egosi ime ka ọrịa dị mma; nkọwa ala peeji na-echekwa eziokwu ahụ na Grik ji ụdị ọtụtụ mee okwu abụọ ahụ.
- source_word: ἐν τῷ ἑνὶ πνεύματι
  choice: site n’otu Mmụọ ahụ
  rationale: Ọ na-egosi ọrụ Mmụọ dị ka isi mmalite/onye na-enye onyinye ma na-echekwa nkwusi ike nke ἑνί, ‘otu.’
theological_decisions:
- issue: Ihe πίστις pụtara n’ọnọdụ onyinye Mmụọ
  choice: okwukwe
  alternative: ịtụkwasị obi; ikwesị ntụkwasị obi
  rationale: Ederede ahụ na-ekwu maka onyinye sitere n’aka Mmụọ, ma ọ kọwaghị ụdị okwukwe ahụ n’ụzọ ga-eme ka a tinye ozizi otu ụka. Isi ederede jiri ‘okwukwe,’ ebe nkọwa ala peeji chekwara nghọta ndị ọzọ.
- issue: Onye πνεύματι na-ezo aka na ya
  choice: Mmụọ, ya bụ Mmụọ Nsọ
  alternative: mmụọ
  rationale: Ọnọdụ 1 Ndị Kọrịnt 12 na-egosi na okwu a na-ezo aka na Mmụọ Nsọ, onye na-ekesa onyinye; mkpụrụedemede ukwu na-eme ka ntụaka ahụ doo anya n’enweghị ịgbakwunye nkọwa ozizi ọzọ.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. A hapụrụ usoro nkesa nke amaokwu ahụ ka ọ na-aga n’ihu, ma jiri ‘site n’otu Mmụọ ahụ’ gosipụta ma onye e si n’aka ya nye onyinye na ịdị n’otu nke Mmụọ.
