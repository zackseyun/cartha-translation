id: 1CO.12.8
reference: 1 Corinthians 12:8
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ᾧ μὲν γὰρ διὰ τοῦ πνεύματος δίδοται λόγος σοφίας, ἄλλῳ δὲ λόγος γνώσεως κατὰ τὸ αὐτὸ πνεῦμα,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/008.yaml
  text: For to one is given through the Spirit a message of wisdom[a], and to another a message of knowledge according to the same Spirit[c][b],
translation:
  language: ig
  text: N’ihi na a na-enye otu onye ozi amamihe site na Mmụọ Nsọ[a], ma a na-enye onye ọzọ ozi ihe ọmụma n’ụzọ kwekọrọ n’otu Mmụọ Nsọ ahụ[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “okwu amamihe” ma ọ bụ “nkwupụta amamihe.”
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsị, “okwu ihe ọmụma” ma ọ bụ “nkwupụta ihe ọmụma.”
    reason: lexical_alternative
  - marker: c
    text: A pụkwara ịsị, “dịka otu Mmụọ Nsọ ahụ si dị” naanị ma a ghọta ya n’echiche “n’ụzọ kwekọrọ n’otu Mmụọ Nsọ ahụ”; ma ọ bụ, “site n’otu Mmụọ Nsọ ahụ.” N’ebe a, okwu Grik e ji gosi njikọ ahụ dị iche na nke a sụgharịrị “site na Mmụọ Nsọ” na mbụ. Ọ na-egosi na onyinye a kwekọrọ n’ọrụ nke otu Mmụọ ahụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾧ μὲν ... ἄλλῳ δὲ
  choice: otu onye ... onye ọzọ
  rationale: Nke a na-egosipụta nkesa dị n’etiti ndị dị iche iche n’ụzọ Igbo doro anya ma dịkwa n’okwu Grik.
- source_word: διὰ τοῦ πνεύματος
  choice: site na Mmụọ Nsọ
  rationale: “Site na” na-echekwa echiche διά na genitive, ya bụ ụzọ ma ọ bụ onye e si n’aka ya nye onyinye ahụ.
- source_word: πνεύματος / πνεῦμα
  choice: Mmụọ Nsọ
  rationale: Ihe ndị gbara amaokwu a gburugburu na-egosi na onye a na-ekwu maka ya bụ Mmụọ Nsọ; ịkpọ ya aha n’uju na-eme ka ọ doo ndị na-agụ Igbo anya.
- source_word: δίδοται
  choice: a na-enye
  rationale: 'Nke a na-echekwa present passive: a na-enye ihe ahụ onye ahụ; ọ bụghị ihe o ji aka ya nweta.'
- source_word: λόγος σοφίας
  choice: ozi amamihe
  rationale: “Ozi” na-egosi okwu ma ọ bụ nkwupụta a na-ezisara ndị ọzọ, ọ bụghị naanị otu mkpụrụokwu; njikọ ya na amamihe ka echekwara.
- source_word: λόγος γνώσεως
  choice: ozi ihe ọmụma
  rationale: A tụgharịrị λόγος otu ụzọ ahụ dịka n’ahịrịokwu nke mbụ iji chekwaa nhazi yiri ibe ya.
- source_word: κατὰ τὸ αὐτὸ πνεῦμα
  choice: dịka otu Mmụọ Nsọ ahụ si chọọ
  rationale: Nke a na-eme ka echiche nke κατά—ịdị n’usoro, mkpebi, ma ọ bụ nduzi nke otu Mmụọ ahụ—bụrụ Igbo e ji eme ihe, ma na-ekewapụ ya na διά nke e kwuru na mbụ.
theological_decisions:
- issue: Onye “Mmụọ” na-ezo aka na ya
  choice: Mmụọ Nsọ
  alternative: mmụọ mmadụ
  rationale: Isiokwu nke 1 Ndị Kọrịnt 12 bụ otu Mmụọ Chineke nke na-ekesa onyinye dị iche iche; nsụgharị a anaghị etinye ozizi ọzọ n’ihe karịrị ihe gbara amaokwu ahụ gburugburu.
- issue: Ihe λόγος pụtara n’okwu gbasara onyinye
  choice: ozi
  alternative: okwu; nkwupụta
  rationale: “Ozi” bụ okwu Igbo dị mfe nke na-egosi ihe e kwuru ka ndị ọzọ ghọta. E debere nhọrọ ndị na-anọ nso n’ihe odide ahụ na nkọwa ala peeji.
- issue: Nuance nke κατὰ τὸ αὐτὸ πνεῦμα
  choice: dịka otu Mmụọ Nsọ ahụ si chọọ
  alternative: dịka otu Mmụọ Nsọ ahụ si dị; site n’otu Mmụọ Nsọ ahụ
  rationale: Nhọrọ a na-egosi na otu Mmụọ ahụ bụ isi iyi na onye ndu nkesa ahụ, ma ọ na-akọwapụta κατά ntakịrị karịa okwu Grik n’onwe ya; ya mere e debere nsụgharị ndị ọzọ na nkọwa ala peeji.
translation_notes:
  register: Standard Igbo; asụsụ dị ugbu a, dị ùgwù, ma dị mfe nghọta. E ji “Mmụọ Nsọ” mee ka onye okwu ahụ na-ezo aka na ya doo anya. Akara nkọwa ala peeji niile [a], [b], na [c] dị n’ederede isi.
