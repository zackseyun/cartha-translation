id: 1CO.12.13
reference: 1 Corinthians 12:13
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ γὰρ ἐν ἑνὶ πνεύματι ἡμεῖς πάντες εἰς ἓν σῶμα ἐβαπτίσθημεν, εἴτε Ἰουδαῖοι εἴτε Ἕλληνες, εἴτε δοῦλοι εἴτε ἐλεύθεροι, καὶ ⸀πάντες ἓν πνεῦμα ἐποτίσθημεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/013.yaml
  text: For indeed[a], in one Spirit we all were baptized into one body—whether Jews or Greeks[c][b], whether servants or free—and we all were given to drink one Spirit.
translation:
  language: ig
  text: N’ihi na n’ezie, n’otu Mmụọ[a] ka e mere anyị niile baptizim ka anyị bụrụ otu ahụ—ma ndị Juu ma ndị Gris, ma ndị ohu ma ndị nweere onwe ha—e nyekwara anyị niile otu Mmụọ ka anyị ṅụọ[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “site n’otu Mmụọ.” Okwu Grik ahụ nwere ike igosi ọnọdụ mmadụ nọ n’ime ya, ụzọ e si eme ihe, ma ọ bụ onye e si n’aka ya mee ya.
    reason: alternative_reading
  - marker: b
    text: 'A pụkwara ịhazi akụkụ ikpeazụ a otú a: “e nyekwara anyị niile otu Mmụọ ka anyị ṅụọ.”'
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “otu mmụọ,” ma ọ bụrụ na a ghọta ya dịka otu ịdị n’otu ime mmụọ; ma ihe gbara okwu a gburugburu na-arụtụ aka n’Mmụọ Nsọ.
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ γὰρ
  choice: N’ihi na n’ezie
  rationale: Nke a na-egosipụta ma njikọ nkọwa nke γὰρ ma nkwusi ike nke καί n’Igbo dị ugbu a.
- source_word: ἐν ἑνὶ πνεύματι
  choice: n’ime otu Mmụọ ahụ
  rationale: “N’ime” na-edobe ọdịdị okwu Grik ma na-ahapụ ohere ma ọ̀ bụ ọnọdụ mmadụ nọ n’ime ya ka ọ bụ ụzọ e si rụọ ọrụ ahụ; e debere “site n’otu Mmụọ ahụ” n’ala peeji.
- source_word: ἡμεῖς πάντες
  choice: anyị niile
  rationale: Ọ na-egosipụta nkwusi ike nke nnọchiaha ahụ na πάντες n’ụzọ Igbo si ada nke ọma.
- source_word: ἐβαπτίσθημεν
  choice: e mere anyị niile baptizim
  rationale: Nke a na-edobe olu nnara nke ngwaa Grik ma jiri okwu baptizim nke ndị na-agụ Igbo maara, na-etinyeghị echiche banyere usoro e si eme ya.
- source_word: εἰς ἓν σῶμα
  choice: ka anyị bụrụ otu ahụ
  rationale: Nke a na-egosipụta nsonaazụ nke itinye mmadụ n’otu ahụ ma na-echekwa ihe atụ Pọl ji ahụ mmadụ mee.
- source_word: Ἰουδαῖοι ... Ἕλληνες
  choice: ndị Juu ... ndị Gris
  rationale: Nke a na-edobe ọdịiche agbụrụ na okpukpe nke okwu Grik kwuru kpọmkwem.
- source_word: δοῦλοι ... ἐλεύθεροι
  choice: ndị ohu ... ndị nweere onwe ha
  rationale: “Ndị ohu” na-egosipụta ọnọdụ ndị nọ n’agbụ nke ọma, ebe “ndị nweere onwe ha” na-enye ọdịiche ya n’Igbo doro anya.
- source_word: ἐποτίσθημεν
  choice: e mere ka anyị niile ṅụọ
  rationale: Nke a na-edobe olu nnara na ihe atụ nke ime ka mmadụ ṅụọ, ma na-ada nke ọma n’Igbo.
- source_word: ἓν πνεῦμα
  choice: otu Mmụọ ahụ
  rationale: Ọnọdụ okwu a na-arụtụ aka n’Mmụọ Nsọ ahụ e kwuru na mbido; mkpụrụedemede ukwu na-egosi nghọta a, ebe e debere nhọrọ ọzọ n’ala peeji.
theological_decisions:
- issue: Ma ἐν ἑνὶ πνεύματι ọ̀ pụtara ịnọ “n’ime” Mmụọ ahụ ka ọ bụ na ọ bụ “site n’aka/site na” Mmụọ ahụ ka e mere baptizim ahụ
  choice: n’ime otu Mmụọ ahụ
  alternative: site n’otu Mmụọ ahụ
  rationale: Okwu Grik ἐν nwere ike igosi ọnọdụ, ụzọ, ma ọ bụ onye na-arụ ọrụ. Isi ederede na-anọ nso n’ọdịdị Grik, ebe ala peeji na-echekwa nghọta nke ụzọ ma ọ bụ onye rụrụ ọrụ ahụ.
- issue: Ihe ἓν πνεῦμα nke ugboro abụọ na-arụtụ aka na ya
  choice: otu Mmụọ ahụ
  alternative: otu mmụọ
  rationale: Ihe gbara ya gburugburu na-akwado nghọta na ọ bụ Mmụọ Nsọ, ma e kwesịghị izochi ohere nghọta nke “otu mmụọ” dịka ịdị n’otu ime mmụọ.
- issue: Otu a ga-esi sụgharịa δοῦλοι n’ọdịiche ya na ἐλεύθεροι
  choice: ndị ohu
  alternative: ndị na-eje ozi
  rationale: Ebe a, okwu ahụ bụ maka ọnọdụ mmekọrịta mmadụ na iwu nke dị iche na ịbụ onye nweere onwe ya; “ndị ohu” ziri ezi karịa okwu sara mbara nke pụtara ndị na-eje ozi.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E debere ihe atụ nke baptizim, otu ahụ, na ịṅụ Mmụọ ahụ; a zere okwu ụka pụrụ iche nke ga-ekpebi esemokwu nkà mmụta okpukpe n’isi ederede.
