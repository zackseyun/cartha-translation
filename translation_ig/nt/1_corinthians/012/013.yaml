revisions:
- from: N’ihi na n’ezie, n’ime otu Mmụọ ahụ[a] ka e mere anyị niile baptizim ka anyị bụrụ otu ahụ—ma ndị Juu ma ndị Gris, ma ndị ohu ma ndị nweere onwe ha—e mekwara ka anyị niile ṅụọ otu Mmụọ ahụ[b][c].
  to: N’ihi na n’ezie, n’otu Mmụọ[a] ka e mere anyị niile baptizim ka anyị bụrụ otu ahụ—ma ndị Juu ma ndị Gris, ma ndị ohu ma ndị nweere onwe ha—e nyekwara anyị niile otu Mmụọ ka anyị ṅụọ[b][c].
  rationale: The revision uses n’otu rather than n’ime to preserve the disputed semantic range of ἐν, and it uses an explicit Igbo passive ‘e nyekwara anyị ... ka anyị ṅụọ’ for ἐποτίσθημεν. It otherwise preserves the draft’s faithful wording, register, and theological restraint. Footnote a is updated to match the revised wording; notes b and c remain properly anchored to the final phrase.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T18:13:40Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately retains the twofold πάντες, the passive baptism and drinking metaphors, the incorporation εἰς ἓν σῶμα, and both social pairings. However, “n’ime otu Mmụọ ahụ” unnecessarily narrows ἐν toward physical interior location. “n’otu Mmụọ” is the normal Igbo formal equivalent and better preserves the Greek ambiguity documented in the note.
  naturalness: The proposed text is natural Standard Igbo. “E nyere anyị niile otu Mmụọ ahụ ka anyị ṅụọ” is a more direct and idiomatic passive rendering of ἐποτίσθημεν than “e mekwara ka anyị niile ṅụọ,” while retaining the causative sense.
  terminology: “Ndị ohu ... ndị nweere onwe ha” correctly represents δοῦλοι ... ἐλεύθεροι. “Ndị Juu ... ndị Gris,” “baptizim,” and “Mmụọ” are appropriate. The demonstrative ahụ is not required by the Greek and is removed in the text to avoid adding definiteness; capitalization remains a contextually warranted but footnoted interpretation.
  issues:
  - severity: medium
    issue: The phrase “n’ime otu Mmụọ ahụ” over-specifies the force of ἐν.
    rationale: Although it can be understood figuratively, n’ime most readily means ‘inside/in the interior of’ in Igbo. The Greek ἐν may be locative/spherical or instrumental, and n’otu Mmụọ preserves this without deciding the question.
  - severity: low
    issue: The wording “e mekwara ka anyị niile ṅụọ” is less direct than the Greek passive and less natural than an Igbo ‘give ... to drink’ construction.
    rationale: ἐποτίσθημεν means ‘we were given/made to drink.’ “E nyere anyị niile otu Mmụọ ka anyị ṅụọ” expresses the passive and the object-to-drink construction clearly.
  - severity: low
    issue: The text adds ahụ (‘that/the’) to both occurrences of ‘one Spirit.’
    rationale: The Greek has ἑνὶ/ἓν πνεύματι without an article. Igbo may sometimes use ahụ anaphorically, but omitting it here is closer and avoids unnecessary added definiteness.
  revised_text: N’ihi na n’ezie, n’otu Mmụọ[a] ka e mere anyị niile baptizim ka anyị bụrụ otu ahụ—ma ndị Juu ma ndị Gris, ma ndị ohu ma ndị nweere onwe ha—e nyekwara anyị niile otu Mmụọ ka anyị ṅụọ[b][c].
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “site n’otu Mmụọ.” Okwu Grik ahụ nwere ike igosi ọnọdụ mmadụ nọ n’ime ya, ụzọ e si eme ihe, ma ọ bụ onye e si n’aka ya mee ya.
    reason: alternative_reading
  - marker: b
    text: 'A pụkwara ịhazi akụkụ ikpeazụ a otú a: “e nyekwara anyị niile otu Mmụọ ka anyị ṅụọ.”'
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “otu mmụọ,” ma ọ bụrụ na a ghọta ya dịka otu ịdị n’otu ime mmụọ; ma ihe gbara okwu a gburugburu na-arụtụ aka n’Mmụọ Nsọ.
    reason: alternative_reading
  revision_rationale: The revision uses n’otu rather than n’ime to preserve the disputed semantic range of ἐν, and it uses an explicit Igbo passive ‘e nyekwara anyị ... ka anyị ṅụọ’ for ἐποτίσθημεν. It otherwise preserves the draft’s faithful wording, register, and theological restraint. Footnote a is updated to match the revised wording; notes b and c remain properly anchored to the final phrase.
