id: 1CO.12.26
reference: 1 Corinthians 12:26
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ⸀εἴτε πάσχει ἓν μέλος, συμπάσχει πάντα τὰ μέλη· εἴτε δοξάζεται ⸀μέλος, συγχαίρει πάντα τὰ μέλη.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/026.yaml
  text: And if one member suffers[a], all the members suffer with it; if a member is honored, all the members rejoice with it.
translation:
  language: ig
  text: Ọ bụrụkwa na otu akụkụ ahụ na-ata ahụhụ, akụkụ ahụ niile na-esoro ya ata ahụhụ; ọ bụrụ na a na-asọpụrụ otu akụkụ ahụ[a], akụkụ ahụ niile na-esoro ya aṅụrị ọṅụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “a na-enye ebube.” N'ebe a, o yikarịrị ka a na-enye otu akụkụ ahụ nsọpụrụ, ahụ dum esoro ya kerịta ọṅụ ahụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴτε
  choice: ọ bụrụ na
  rationale: N'usoro ahịrịokwu a, ikwughachi “ọ bụrụ na ... ọ bụrụ na ...” na-egosipụta ọnọdụ abụọ Pọl ji kọwaa ihe nke ọma n'Igbo.
- source_word: πάσχει
  choice: na-ata ahụhụ
  rationale: Nke a na-edobe echiche sara mbara nke ịta ahụhụ ma ọ bụ ịnọ n'ihe mgbu, n'etinyeghị ụdị ahụhụ a kapịrị ọnụ.
- source_word: ἓν μέλος
  choice: otu akụkụ ahụ
  rationale: “Akụkụ ahụ” na-edobe ihe atụ Pọl banyere ahụ mmadụ ma bụrụkwa okwu doro ndị na-agụ Igbo anya.
- source_word: συμπάσχει
  choice: na-esoro ya ata ahụhụ
  rationale: Ngwaa a jikọtara ọnụ na-egosi na akụkụ ndị ọzọ na-ekekọrịta ahụhụ nke otu akụkụ ahụ.
- source_word: πάντα τὰ μέλη
  choice: akụkụ ahụ niile
  rationale: A na-edobe nkwughachi okwu ahụ n'ahịrịokwu abụọ ahụ iji chekwaa nhazi na ike okwu Grik.
- source_word: δοξάζεται
  choice: a na-asọpụrụ
  rationale: N'ihe atụ banyere mmekọrịta akụkụ dị iche iche nke otu ahụ, okwu a na-egosi inweta nsọpụrụ; ọ naghị achọ ka a kọwaa ya naanị dị ka ebube nke okpukpe.
- source_word: μέλος
  choice: otu akụkụ ahụ
  rationale: Ọ bụ ezie na ederede a ebipụtara enweghị ἕν n'ahịrịokwu nke abụọ, Igbo chọrọ ihe na-akọwa aha a; “otu” ebe a bụ ihe e ji ekwu akụkụ ọ bụla n'ime ahụ, ọ bụghị mgbakwunye echiche ọhụrụ.
- source_word: συγχαίρει
  choice: na-esoro ya aṅụrị ọṅụ
  rationale: Nke a na-egosipụta ọṅụ a na-ekekọrịta na akụkụ ahụ e nyere nsọpụrụ.
theological_decisions:
- issue: Ihe δοξάζεται pụtara n'ihe atụ banyere ahụ nke ọgbakọ
  choice: a na-asọpụrụ
  alternative: a na-enye ebube
  rationale: Ihe gbara amaokwu ahụ gburugburu bụ nlekọta na ịdị n'otu nke akụkụ ahụ. “A na-asọpụrụ” na-enye echiche mmekọrịta mmadụ na ibe ya nke okwu ahụ ebe a, ma ihe odide ala peeji na-echekwa nsụgharị ọzọ kwere omume.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke dị ugbu a ma dị ugwu. A họọrọ “akụkụ ahụ” kama okwu mgbazinye “memba” iji mee ka ihe atụ banyere ahụ mmadụ doo anya nye onye nkịtị; e debere nhazi abụọ na nkwughachi nke ederede Grik.
