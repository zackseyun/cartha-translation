id: 1CO.12.29
reference: 1 Corinthians 12:29
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: μὴ πάντες ἀπόστολοι; μὴ πάντες προφῆται; μὴ πάντες διδάσκαλοι; μὴ πάντες δυνάμεις;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/029.yaml
  text: Not all are apostles[a], are they? Not all are prophets, are they? Not all are teachers, are they? Not all work miracles, do they?
translation:
  language: ig
  text: Ọ̀ bụ na mmadụ niile bụ ndịozi? Ọ̀ bụ na mmadụ niile bụ ndị amụma? Ọ̀ bụ na mmadụ niile bụ ndị nkuzi? Ọ̀ bụ na mmadụ niile na-arụ ọrụ ebube?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N'ụzọ nkịtị, Grik kwuru, “Ọ̀ bụ na mmadụ niile bụ ike/ọrụ ebube?” E ji “ike” mee ihe nkenke ebe a maka ọrụ ebube ma ọ bụ maka ndị na-arụ ha.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ
  choice: Ọ̀ bụ na ...?
  rationale: N'usoro ajụjụ a, μή na-atụ anya azịza na-adịghị mma. Usoro Igbo a na-eme ka ajụjụ nkwughachi ahụ bụrụ nke doro anya ma dịkwa eke, ya bụ, azịza ya bụ ‘Mba.’
- source_word: πάντες
  choice: mmadụ niile
  rationale: N'ọnọdụ a πάντες na-ezo aka n'òtù mmadụ niile. ‘Mmadụ niile’ na-eme ka nke a doo anya ma chekwaa nkwughachi nke ahịrị Grik.
- source_word: ἀπόστολοι
  choice: ndịozi
  rationale: Ọ bụ okwu Igbo a na-ejikarị akọwa ọrụ ndịozi n'Agba Ọhụrụ, ọ bụghị naanị ndị e zigara ozi n'ozuzu.
- source_word: προφῆται
  choice: ndị amụma
  rationale: Nke a bụ ntụgharị Igbo doro anya maka ndị na-ebu ma na-ekwupụta amụma n'òtù ndị kwere ekwe.
- source_word: διδάσκαλοι
  choice: ndị nkuzi
  rationale: ‘Ndị nkuzi’ bụ okwu Igbo dị mfe ma bụrụkwa nke kwesịrị ekwesị maka ndị ọrụ ha bụ izi ihe.
- source_word: δυνάμεις
  choice: na-arụ ọrụ ebube
  rationale: N'agbanyeghị na aha Grik ahụ pụtara n'ụzọ nkịtị ‘ike’ ma ọ bụ ‘ọrụ ebube,’ ebe a ọ nọchiri anya ime ọrụ ndị dị ike. Ntughari dị ka ngwaa na-enye echiche ahụ n'Igbo eke n'emeghị ka a sị na mmadụ bụ ‘ike’ ma ọ bụ ‘ọrụ ebube.’
theological_decisions:
- issue: Otú e si ghọta δυνάμεις n'usoro ọrụ na onyinye
  choice: Ọ̀ bụ na mmadụ niile na-arụ ọrụ ebube?
  alternative: Ọ̀ bụ na mmadụ niile bụ ike/ọrụ ebube?; Ọ̀ bụ na mmadụ niile nwere ike ịrụ ọrụ ebube?
  rationale: Nke mbụ ga-ada ka ndị mmadụ n'onwe ha bụ ọrụ ebube; nke ikpeazụ nwere ike ịgbakwunye echiche banyere ikike ha ‘nwere.’ Ntughari a na-egosi ọrụ a na-eme ma na-ahapụ okwu ahụ n'ime ọnọdụ onyinye dị iche iche n'ahụ Kraịst.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E chekwara usoro ajụjụ anọ na nkwughachi ‘mmadụ niile’ nke dị n'asụsụ Grik. E debere akara ntụaka [a] n'akụkụ okwu ikpeazụ ọ na-akọwa.
