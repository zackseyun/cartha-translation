  text: ἑκάστῳ δὲ δίδοται ἡ φανέρωσις τοῦ πνεύματος πρὸς τὸ συμφέρον.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/007.yaml
  text: But to each one the manifestation of the Spirit is given for the common good[a].
translation:
  language: ig
  text: Ma a na-enye onye ọ bụla ngosipụta nke Mmụọ maka ọdịmma mmadụ niile.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “maka ihe bara uru” ma ọ bụ “maka uru mmadụ niile.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑκάστῳ
  choice: onye ọ bụla
  rationale: Nke a na-egosipụta nkesa ahụ nye onye nke ọ bụla n’ime ọgbakọ, dị ka ụdị dative singular nke ἕκαστος si dị.
- source_word: δὲ
  choice: Ma
  rationale: “Ma” na-egosipụta njikọ nwere obere ọdịiche ma ọ bụ mgbanwe n’okwu, n’emeghị ka ọdịiche ahụ sie ike karịa ka Grik si kwuo.
- source_word: δίδοται
  choice: a na-enye
  rationale: Nke a na-edobe present passive nke δίδωμι ma na-egosi na ngosipụta ahụ bụ ihe a na-enye, ọ bụghị ihe mmadụ ji aka ya mepụta.
- source_word: φανέρωσις
  choice: ngosipụta
  rationale: “Ngosipụta” na-enye echiche nke ime ka ihe pụta ìhè ma ọ bụ bụrụ ihe a pụrụ ịhụ, ma dabara n’ọrụ Mmụọ nke na-apụta ìhè site n’onyinye dị iche iche.
- source_word: τοῦ πνεύματος
  choice: nke Mmụọ
  rationale: E ji mkpụrụedemede ukwu dee “Mmụọ” iji gosi na ọ bụ Mmụọ Nsọ ka ihe gbara amaokwu ahụ gburugburu na-ekwu maka ya, ma etinyeghị “Nsọ” ebe ederede Grik na-ekwughị ya kpọmkwem.
- source_word: πρὸς τὸ συμφέρον
  choice: maka ọdịmma mmadụ niile
  rationale: N’ọnọdụ isiakwụkwọ a, okwu ahụ na-elekwasị anya n’uru onyinye ndị ahụ baara ahụ dum. Nsụgharị a na-eme ka nghọta obodo ahụ doo anya, ebe nkọwa ala peeji na-edobe ohere nke nghọta sara mbara karị.
theological_decisions:
- issue: Onye “Mmụọ” na-ezo aka na ya
  choice: Ọ na-ezo aka na Mmụọ Nsọ, ma nsụgharị ahụ sịrị naanị “Mmụọ.”
  alternative: Mmụọ n’echiche zuru ezu ma ọ bụ mmụọ mmadụ.
  rationale: Amaokwu ndị gbara ya gburugburu na-ekwu ugboro ugboro banyere otu Mmụọ ahụ bụ isi iyi onyinye ndị a. Ide “Mmụọ” na mkpụrụedemede ukwu na-egosi onye a na-ezo aka na ya, ma na-anọgide nso n’okwu Grik nke na-enweghị okwu “Nsọ” n’ebe a.
- issue: Oke uru nke συμφέρον
  choice: Uru a bụ maka ọdịmma mmadụ niile n’ime ahụ.
  alternative: Ihe bara uru n’ozuzu ya, nke nwere ike ọ gaghị ekwu kpọmkwem na ọ bụ uru obodo dum.
  rationale: Ọ bụ ezie na συμφέρον nwere ike ịpụta ihe bara uru n’ozuzu ya, isiakwụkwọ ahụ na-ekwusi ike n’ahụ Kraịst na n’uru ndị otu ya na-abara ibe ha. Nkọwa ala peeji na-edobe nghọta ọzọ nke okwu Grik ahụ.
translation_notes:
  register: E ji Standard Igbo dị mfe ma dị ugwu dee ya. “Ngosipụta” bụ okwu kpọmkwem ma dabara n’echiche nke ime ka ọrụ Mmụọ pụta ìhè; “ọdịmma mmadụ niile” na-eme ka ntụziaka obodo nke amaokwu ahụ doo anya.
