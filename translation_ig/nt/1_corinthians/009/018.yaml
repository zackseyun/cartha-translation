revisions:
- from: 'Gịnịzi bụ ụgwọ ọrụ m? Ọ bụ nke a: mgbe m na-ekwusa ozi ọma, ana m enye ozi ọma ahụ n’efu[a], ka m wee ghara iji ikike m nwere n’ozi ọma mee ihe n’ụzọ zuru ezu.[b]'
  to: Gịnịzi bụ ụgwọ ọrụ m? Ọ bụ ka, mgbe m na-ekwusa ozi ọma[a], m mee ka ozi ọma ahụ bụrụ nke a na-akwụghị ụgwọ, ka m wee ghara iji ikike m n’ihe gbasara ozi ọma mee ihe n’uju.[b]
  rationale: The revision restores the Greek purpose structure, replaces an awkward final phrase with natural Standard Igbo that preserves the source’s breadth, and corrects the lexical footnote anchor. It does not impose a narrower doctrinal reading of Paul’s right, though the contextual ministry interpretation remains available in the footnote.
  reviewer_model: gpt-5.6-terra
