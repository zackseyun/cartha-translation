id: 1CO.9.18
reference: 1 Corinthians 9:18
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τίς οὖν ⸀μού ἐστιν ὁ μισθός; ἵνα εὐαγγελιζόμενος ἀδάπανον θήσω τὸ ⸀εὐαγγέλιον, εἰς τὸ μὴ καταχρήσασθαι τῇ ἐξουσίᾳ μου ἐν τῷ εὐαγγελίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/018.yaml
  text: What then is my reward? That in preaching the good news I may present the good news free of charge[b][a], so as not to make full use of my right in the good news.
translation:
  language: ig
  text: Gịnịzi bụ ụgwọ ọrụ m? Ọ bụ ka, mgbe m na-ekwusa ozi ọma[a], m mee ka ozi ọma ahụ bụrụ nke a na-akwụghị ụgwọ, ka m wee ghara iji ikike m n’ihe gbasara ozi ọma mee ihe n’uju.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “oziọma,” n’ebe niile okwu a pụtara n’amaokwu a.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ka m wee ghara iji ikike m n’ọrụ ikwusa ozi ọma mee ihe n’uju.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μισθός
  choice: ụgwọ ọrụ
  rationale: 'Okwu a nwere ike ịpụta ụgwọ, ụgwọ ọrụ, ma ọ bụ ihe a na-enweta n’ihi ọrụ. “Ụgwọ ọrụ” dabara n’ajụjụ Pọl jụrụ ma na-edokwa njakịrị dị n’okwu ya: ụgwọ ọrụ ya bụ ikwusa ozi ọma n’anaghị ana ego.'
- source_word: εὐαγγελιζόμενος
  choice: mgbe m na-ekwusa ozi ọma
  rationale: Nke a na-egosi ihe Pọl na-eme n’otu oge ahụ; ọ na-edokwa ike ngwaa nke okwu Grik ahụ n’Igbo dị mfe nghọta.
- source_word: ἀδάπανον
  choice: n’efu
  rationale: Ọ pụtara na a naghị akwụ ụgwọ ma ọ bụ na ọ dịghị onye a na-ebo ego. “N’efu” bụ okwu Igbo dị mkpirikpi ma doo anya.
- source_word: θήσω τὸ εὐαγγέλιον
  choice: ana m enye ozi ọma ahụ
  rationale: N’agbanyeghị na ntụgharị nkịtị ya bụ ‘idowe ozi ọma,’ ihe a na-ekwu n’ebe a bụ ime ka ozi ọma ruo ndị mmadụ ma ọ bụ inye ha ya. “Enye” bụ okwu ebumpụta ụwa n’Igbo ma ghara ịgbakwunye echiche na-adịghị na isiokwu ahụ.
- source_word: εὐαγγέλιον
  choice: ozi ọma
  rationale: Nke a na-enye isi okwu Grik ahụ kpọmkwem n’Igbo nke oge a. E debere “oziọma” dị ka nhọrọ n’ala ala peeji n’ihi ojiji ya dị ka aha e ji mara ozi Kraịst.
- source_word: καταχρήσασθαι
  choice: mee ihe n’ụzọ zuru ezu
  rationale: N’ebe a, okwu ahụ na-ekwu maka iji ihe mmadụ nwere ruo n’ókè zuru ezu; ọ dịghị mkpa ka e mee ka ọ pụta iji ikike eme ihe ọjọọ.
- source_word: ἐξουσίᾳ
  choice: ikike
  rationale: N’ọnọdụ isi nke 1 Ndị Kọrịnt 9, ọ bụ ikike ziri ezi Pọl nwere ịnata nkwado maka ọrụ ya, ọ bụghị naanị ọchịchị n’ozuzu ya.
- source_word: ἐν τῷ εὐαγγελίῳ
  choice: n’ozi ọma
  rationale: Nke a na-anọ nso n’okwu Grik ma na-echekwa ohere ọ nwere ịpụta ‘n’ihe metụtara ozi ọma’ ma ọ bụ ‘n’ọrụ ikwusa ozi ọma.’ E nyere nkọwa nke abụọ n’ala ala peeji.
theological_decisions:
- issue: Ụdị ikike Pọl na-ekwu maka ya
  choice: Ikike ziri ezi o nwere ịnata nkwado n’ọrụ ozi ọma, nke ọ họọrọ ịghara iji n’ụzọ zuru ezu.
  alternative: Ikike Pọl dị ka onyeozi n’ozuzu ya, ma ọ bụ iji ikike eme ihe n’ụzọ na-ezighị ezi.
  rationale: Ihe gbara amaokwu a gburugburu na-ekwu ugboro ugboro banyere ikike onyeozi nwere ịnata ihe e ji akwado ndụ ya. Ya mere, ntụgharị a ekwughị na ikike ahụ n’onwe ya bụ mmegbu ma ọ bụ ihe ọjọọ.
- issue: Ntụgharị εὐαγγέλιον
  choice: ozi ọma
  alternative: oziọma
  rationale: “Ozi ọma” na-egosipụta nghọta nkịtị nke okwu Grik ahụ n’asụsụ Igbo nke oge a, ebe “oziọma” bụkwa okwu ọdịnala a na-eji akọwa ozi Kraịst. A hapụrụ nhọrọ ahụ n’ala ala peeji.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị ugwu ma dị mfe nghọta. Ahịrịokwu ahụ na-edobe ajụjụ Pọl na azịza ya, ma na-echekwa mgbagwoju anya dị na nkebi okwu ἐν τῷ εὐαγγελίῳ site n’isi ederede na nkọwa ala ala peeji.
