  text: ἐν γὰρ τῷ Μωϋσέως νόμῳ γέγραπται· Οὐ ⸀κημώσεις βοῦν ἀλοῶντα. μὴ τῶν βοῶν μέλει τῷ θεῷ,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/009.yaml
  text: For it is written in the law of Moses[a], “You shall not muzzle an ox while it is threshing.” Is God concerned about oxen?
translation:
  language: ig
  text: N’ihi na e dere n’Iwu Mosis, sị, “Ekpuchila ehi ọnụ mgbe ọ na-azọcha ọka[a].” Chineke ọ̀ na-eche banyere ehi?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “mgbe ọ na-eji ụkwụ ya azọ ọka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν γὰρ τῷ Μωϋσέως νόμῳ
  choice: N’ihi na ... n’Iwu Mosis
  rationale: “N’Iwu Mosis” na-edobe njikọ genitive dị n’asụsụ Grik ma bụrụkwa ụzọ doro anya e si ekwu ya n’Igbo. “N’ihi na” na-egosipụta γάρ nke jikọtara amaokwu a na arụmụka bu ya ụzọ.
- source_word: γέγραπται
  choice: e dere ya
  rationale: Nke a bụ okwu Igbo nkịtị na nke dị ùgwù maka usoro e ji kpọpụta ihe e dere n’Akwụkwọ Nsọ; ọ na-edobe passive nke Grik n’enweghị ịgbakwunye onye dere ya.
- source_word: Οὐ κημώσεις
  choice: Ekela ... ọnụ
  rationale: Ụdị iwu a na-enye n’Igbo na-ebute mmachibido iwu nke ọdịnihu Grik ji rụọ ọrụ ebe a. “Ikee anụmanụ ọnụ” na-enye echiche nke itinye ya ihe ga-egbochi ya iri nri.
- source_word: βοῦν
  choice: oke ehi
  rationale: “Oke ehi” na-akọwa anụ ehi nwoke e ji arụ ọrụ nke ọma karịa naanị “ehi,” ma kwekọọ n’otu anụmanụ dị na okwu ahụ e hotara.
- source_word: ἀλοῶντα
  choice: mgbe ọ na-azọcha ọka
  rationale: Okwu a na-egosi ọrụ na-aga n’ihu nke ịzọcha ọka. Nsụgharị a bụ Igbo eke ma doo ndị na-agụ ya anya; nkọwa ọzọ nke ịzọ ọka ụkwụ dị na ndetu ala peeji.
- source_word: μὴ τῶν βοῶν μέλει τῷ θεῷ
  choice: Chineke ọ̀ na-eche banyere oke ehi?
  rationale: Ajụjụ a dị mfe ma na-edobe ike ajụjụ arụmụka nke μή na-atụ anya azịza na-adịghị mma, n’etinyeghị okwu dịka “naanị” nke na-adịghị n’ederede Grik.
theological_decisions:
- issue: Ajụjụ Pọl banyere ma Chineke ọ na-eche banyere oke ehi
  choice: Chineke ọ̀ na-eche banyere oke ehi?
  alternative: Ọ bụ naanị oke ehi ka Chineke na-eche banyere ha?
  rationale: E debere ya dịka ajụjụ arụmụka kpọmkwem. Etinyeghị “naanị,” n’ihi na okwu ahụ adịghị n’ederede Grik, ya mere nsụgharị ahụ anaghị ekpebi ma Pọl na-ekwu na Chineke anaghị eche banyere anụmanụ ma ọlị, ka ọ̀ na-ekwu na iwu ahụ nwere nzube sara mbara.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe ma dị ùgwù. A hapụrụ ajụjụ ikpeazụ ka ọ bụrụ ajụjụ arụmụka n’enweghị nkọwa ụka agbakwunyere.
