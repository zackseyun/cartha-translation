  to: N’ihi na e dere n’Iwu Mosis, sị, “Ekpuchila ehi ọnụ mgbe ọ na-azọcha ọka[a].” Chineke ọ̀ na-eche banyere ehi?
  rationale: The revision keeps the Greek syntax and rhetorical force while using more natural Standard Igbo. It avoids the added male specification in “oke ehi,” improves the idiom for “muzzle,” and replaces the unclear footnote with a clear alternative that reflects the treading action without resolving Paul’s rhetorical question.
