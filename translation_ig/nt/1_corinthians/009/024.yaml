  text: Οὐκ οἴδατε ὅτι οἱ ἐν σταδίῳ τρέχοντες πάντες μὲν τρέχουσιν, εἷς δὲ λαμβάνει τὸ βραβεῖον; οὕτως τρέχετε ἵνα καταλάβητε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/024.yaml
  text: Do you not know that those who run in a stadium all run[a], but one receives the prize? Run in this way[b], so that you may obtain it.
translation:
  language: ig
  text: Ọ̀ bụ na unu amaghị na ndị na-agba ọsọ n’ámá ịgba ọsọ[a], ha niile na-agba ọsọ, ma ọ bụ naanị otu onye na-anata ihe nrite? Gbaanụ ọsọ otú a[b], ka unu wee nweta ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, ‘n’ebe a na-agba ọsọ.’ Okwu Grik στάδιον na-ezo aka n’ebe a na-agba ọsọ, ya bụ ámá egwuregwu ma ọ bụ ụzọ ịgba ọsọ.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, ‘Gbaanụ ọsọ ka unu merie,’ ma ọ bụ ‘ka unu wee jide ya.’ Okwu Grik καταλάβητε nwere ike ịpụta ‘inweta,’ ‘ijide,’ ma ọ bụ ‘iru.’
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐκ οἴδατε
  choice: Ọ̀ bụ na unu amaghị
  rationale: Na-edobe ajụjụ nkwupụta Pọl ji eme ihe, ma na-ada nke ọma n’Igbo ugbu a.
- source_word: ἐν σταδίῳ
  choice: n’ámá ịgba ọsọ
  rationale: Na-egosi ebe a na-agba ọsọ n’ụzọ doro anya, kama ime ka ọ bụrụ naanị asọmpi n’ozuzu.
- source_word: τρέχοντες ... τρέχουσιν
  choice: ndị na-agba ọsọ ... na-agba ọsọ ha niile
  rationale: Na-edobe nkwughachi nke ngwaa τρέχω na oyiyi egwuregwu ahụ.
- source_word: πάντες μὲν ... εἷς δὲ
  choice: ha niile, ma ọ bụ naanị otu onye
  rationale: Na-egosipụta ọdịiche dị n’etiti mmadụ niile na otu onye n’Igbo eke.
- source_word: λαμβάνει
  choice: na-anata
  rationale: Ọ bụ nghọta kpọmkwem nke ịnata, nke na-adịghị etinye nkọwa ‘imeri’ karịa ihe Grik kwuru.
- source_word: βραβεῖον
  choice: ihe nrite
  rationale: Okwu Igbo a na-aghọta nke ọma maka ụgwọ a na-enye onye meriri n’asọmpi.
- source_word: οὕτως
  choice: n’ụzọ dị otu a
  rationale: Na-eme ka njikọ dị n’etiti ihe atụ agbụrụ ahụ na ndụ ndị a na-agwa okwu doo anya.
- source_word: τρέχετε
  choice: Gbaanụ ọsọ
  rationale: Iwu a na-agwa ọtụtụ mmadụ okwu ma na-edobe ike na ịdị mfe nke okwu Grik.
- source_word: ἵνα καταλάβητε
  choice: ka unu wee nweta ya
  rationale: Na-egosipụta ebumnuche ahụ ma na-edobe ohere nghọta καταλαμβάνω dịka inweta, ijide, ma ọ bụ iru ihe.
theological_decisions:
- issue: Ihe atụ ịgba ọsọ e ji gbaa Ndị Kraịst ume ka ha nọgide na-agbasi mbọ ike
  choice: E debere oyiyi asọmpi ịgba ọsọ n’emeghị ka amaokwu ahụ kpebie ma ihe nrite ahụ bụ nzọpụta, ụgwọ ọrụ, ma ọ bụ ozizi pụrụ iche ọzọ.
  alternative: Ịsụgharị ya n’ụzọ nkọwa dịka ‘Gbaanụ ọsọ ka unu merie.’
  rationale: Pọl ji egwuregwu gbaa ndị na-agụ ya ume ka ha gbasie mbọ ike. Nsụgharị ekwesịghị itinye echiche banyere uru ọrụ mmadụ, ntachi obi, ma ọ bụ nzọpụta nke okwu Grik ahụ ekwughị kpọmkwem.
translation_notes:
  register: Standard Igbo; asụsụ dị ugbu a, dị ùgwù, ma dị mfe nghọta. E ji ụdị ọtụtụ mmadụ ‘unu’ mee ka okwu a Pọl gwara ọgbakọ dum doo anya. E debere ihe atụ egwuregwu na nkwughachi ‘ịgba ọsọ’.
