id: 1CO.9.2
reference: 1 Corinthians 9:2
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἰ ἄλλοις οὐκ εἰμὶ ἀπόστολος, ἀλλά γε ὑμῖν εἰμι, ἡ γὰρ σφραγίς ⸂μου τῆς⸃ ἀποστολῆς ὑμεῖς ἐστε ἐν κυρίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/002.yaml
  text: If I am not an apostle to others[a], yet I certainly am to you, for you are the seal of my apostleship in the Lord.
translation:
  language: ig
  text: Ọ bụrụ na abụghị m onyeozi nye ndị ọzọ, ma n’ezie, abụ m onyeozi nye unu, n’ihi na unu bụ akara[a] nke ịbụ onyeozi m n’ime Onyenwe anyị.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ihe akaebe” ma ọ bụ “ihe nkwado” nke ịbụ onyeozi m. Okwu Grik pụtara “akara e ji emechi ihe,” bụ́ ihe na-egosi na ihe bụ ezigbo ya ma ọ bụ na e nyere ya nkwado.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπόστολος
  choice: onyeozi
  rationale: “Onyeozi” bụ okwu Igbo a na-ejikarị akọwa ọkwa na ọrụ pụrụ iche Pọl na-ekwu maka ya, ọ bụghị naanị onye e zigara ozi nkịtị.
- source_word: ἀλλά γε
  choice: ma n’ezie
  rationale: Nke a na-egosipụta ma ntụgharị okwu ahụ ma nkwusi ike dị na γε, n’ụzọ doro anya ma kwekọọ n’Igbo.
- source_word: σφραγίς
  choice: akara
  rationale: “Akara” na-edobe ihe atụ Grik banyere akara e ji egosi na ihe bụ eziokwu ma ọ bụ nke ziri ezi; nkọwa ala peeji na-eme ka ike ihe atụ ahụ pụta ìhè.
- source_word: ἀποστολή
  choice: ịbụ onyeozi
  rationale: N’ebe a, okwu ahụ na-ezo aka n’ọkwa na ọrụ Pọl dị ka onyeozi. “Ịbụ onyeozi” bụ ụzọ Igbo dị mfe ma doo anya isi kwuo ya.
- source_word: ἐν κυρίῳ
  choice: n’ime Onyenwe anyị
  rationale: A hapụrụ ahịrịokwu Pọl a n’ụdị na-egosi na ndụ ndị Kọrịnt na ihe ha ji akwado ịbụ onyeozi Pọl dị n’ime mmekọrịta ha na Onyenwe anyị, kama ịkọwa ya naanị dị ka ihe Onyenwe anyị mere.
- source_word: ἄλλοις
  choice: nye ndị ọzọ
  rationale: 'Nke a na-edobe nghọta njikọ nke dative ahụ: ịbụ onyeozi nye ndị ọzọ.'
theological_decisions:
- issue: Ike okwu Pọl banyere ịbụ onyeozi ya
  choice: Pọl na-ekwu n’ụzọ nkwenye na ọ bụrụgodị na ndị ọzọ anaghị anabata ya dị ka onyeozi nye ha, ndị Kọrịnt enweghị ike ịgọnahụ ịbụ onyeozi ya, n’ihi na ịdị adị ha n’ime Onyenwe anyị na-akwado ọrụ ya.
  alternative: Pọl bụ onyeozi naanị nye ndị Kọrịnt, ọ bụghịkwa onyeozi n’ezie nye ndị ọzọ.
  rationale: Usoro okwu na arụmụka gbara amaokwu ahụ gburugburu bụ nke ịgbachitere ọrụ ya, ọ bụghị nke ịkpa oke ọrụ onyeozi ya n’otu chọọchị naanị. E debere usoro “ọ bụrụ na ... ma” ka esemokwu ahụ ghara ịla n’iyi.
translation_notes:
  register: E ji Standard Igbo nke dị ugwu ma dị mfe nghọta mee ntụgharị a. “Onyeozi” na “Onyenwe anyị” na-edobe okwu Ndị Kraịst maara nke ọma, ebe “ịbụ onyeozi” na-eme ka aha ọrụ ahụ bụrụ nke e ji Igbo nkịtị ghọta. E debeghị ihe ọ bụla ga-eme ka okwu ahụ bụrụ ozizi otu ụka pụrụ iche.
