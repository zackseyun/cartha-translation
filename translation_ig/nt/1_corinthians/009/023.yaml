review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents πάντα (“ihe niile”), the purposive force of ἵνα (“ka ... wee”), the becoming nuance of γένωμαι (“m wee bụrụ”), and the shared sense of συγκοινωνός. “N’ihi ozi ọma ahụ” is an acceptable broad rendering of διὰ τὸ εὐαγγέλιον, retaining both motivational and purpose-for-the-gospel resonance without over-specifying it.
  naturalness: The wording “onye ya na ndị ọzọ na-ekere òkè na ya” is understandable, but its two pronoun-linked phrases make the clause less smooth and can momentarily obscure who is participating. Recasting it as “onye na ndị ọzọ na-ekere òkè na ya” is more direct, natural Standard Igbo while retaining the reciprocal/shared force.
  terminology: “Ozi ọma” is an appropriate modern, accessible rendering of εὐαγγέλιον. “Ikere òkè” suitably renders the broad participatory sense of συγκοινωνός and does not impose a narrower ministerial or doctrinal interpretation.
  issues:
  - severity: low
    issue: Slightly awkward participant expression
    rationale: “Onye ya na ndị ọzọ na-ekere òkè na ya” is grammatically interpretable but stylistically heavy. “Onye na ndị ọzọ na-ekere òkè na ya” makes Paul’s shared participation more immediately clear without adding meaning.
