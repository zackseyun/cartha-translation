base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/023.yaml
  text: But I do all things for the sake of the good news[b][a], so that I may become a fellow participant in it.
translation:
  language: ig
  text: Ma ana m eme ihe niile n’ihi ozi ọma ahụ, ka m wee bụrụ onye na ndị ọzọ na-ekere òkè na ya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ka m wee soro ndị ọzọ keta oke na ya,” ma ọ bụ, “ka m wee bụrụ onye mmekọ na ya.”
    reason: alternative_reading
lexical_decisions:
- source_word: πάντα
  choice: ihe niile
  rationale: Nke a na-egosi obosara okwu Pọl n'ụzọ doro anya ma bụrụkwa okwu Igbo nkịtị.
- source_word: δὲ
  choice: Ma
  rationale: Ọ na-egosi obere ntụgharị ma ọ bụ ọdịiche n’ihe Pọl kwuru tupu nke a.
- source_word: ποιῶ
  choice: ana m eme
  rationale: Ụdị ugbu a na-egosi omume Pọl na-eme mgbe niile.
- source_word: διὰ τὸ εὐαγγέλιον
  choice: n’ihi ozi ọma ahụ
  rationale: Nke a na-egosi na ozi ọma bụ ihe kpatara ya na ihe ọ na-achọ ịkwalite, n’ebughị ụzọ kpebie naanị otu n’ime nghọta ndị ahụ.
- source_word: ἵνα
  choice: ka ... wee
  rationale: Usoro Igbo a na-egosipụta ebumnuche nke ọma.
- source_word: συγκοινωνὸς
  choice: onye ya na ndị ọzọ na-ekere òkè
  rationale: Ọ na-echekwa echiche συν-, ya bụ isoro ndị ọzọ kerịta ma ọ bụ sonye n’ihe, n’enweghị ime ka ihe a na-ekere òkè na ya dị warara.
- source_word: αὐτοῦ
  choice: na ya
  rationale: Ọ na-ezo aka n’ozi ọma ahụ; usoro a bụ Igbo e ji ekwu isonye ma ọ bụ ikere òkè n’ihe.
- source_word: γένωμαι
  choice: m wee bụrụ
  rationale: Ọ na-echekwa echiche nke ịghọ ma ọ bụ ịbata n’ọnọdụ ahụ, kama ịsị naanị na Pọl nọrịị otú ahụ.
theological_decisions:
- issue: Ihe ikere òkè Pọl n’ozi ọma pụtara
  choice: E debere ya n’ụzọ sara mbara dị ka isoro ndị ọzọ kere òkè n’ozi ọma ahụ.
  alternative: Ịkekọrịta ngọzi ya; isonye n’ịgbasa ya; ma ọ bụ ịbụ onye mmekọ n’ozi nke ozi ọma.
  rationale: συγκοινωνός nwere ike ịgụnye uru ozi ọma na ọrụ ịgbasa ya. Nsụgharị ahụ anaghị amanye otu nkọwa ozizi pụrụ iche.
translation_notes:
  register: Asụsụ Igbo izugbe, nke oge a, dị ùgwù ma dị mfe nghọta. E ji “ozi ọma” mee εὐαγγέλιον kama iji okwu ụka siri ike; a hapụrụ obosara ihe συγκοινωνός pụtara ka ọ dị.
