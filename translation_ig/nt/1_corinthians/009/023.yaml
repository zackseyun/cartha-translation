- from: Ma ana m eme ihe niile n’ihi ozi ọma ahụ, ka m wee bụrụ onye ya na ndị ọzọ na-ekere òkè na ya.[a]
  to: Ma ana m eme ihe niile n’ihi ozi ọma ahụ, ka m wee bụrụ onye na ndị ọzọ na-ekere òkè na ya.[a]
  rationale: The revision is limited to a smoother Standard Igbo expression for συγκοινωνός. It preserves the source’s inclusive, co-participatory sense, the antecedent of αὐτοῦ as “ozi ọma ahụ,” and the deliberate breadth concerning what sharing in the good news entails.
  reviewer_model: gpt-5.6-terra
