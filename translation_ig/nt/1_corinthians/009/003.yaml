  text: This is my defense to those who examine me[a].
translation:
  language: ig
  text: Nke a bụ azịza m nke nchebe nye ndị na-enyocha m[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Nke a bụ azịza m nye ndị na-ekpe m ikpe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπολογία
  choice: ihe m ji zaa
  rationale: N'okwu a, ọ pụtara azịza Pọl ji agbachitere onwe ya n'ihu ndị na-enyocha ikike na omume ya. Nkebi okwu a bụ Igbo dị mfe ma na-ezere echiche nke ịrịọ mgbaghara.
- source_word: ἀνακρίνουσίν
  choice: na-enyocha
  rationale: Okwu a na-egosi inyocha mmadụ nke ọma ma ọ bụ ịtụle ya. “Na-enyocha” na-edobe echiche ahụ n'etinyeghị ikpe ikpeazụ n'okwu ahụ.
- source_word: Ἡ ἐμὴ
  choice: m
  rationale: Nnochiaha nwe a na-egosi na azịza ahụ bụ nke Pọl; n'Igbo, “m” dị n'usoro “ihe m ji zaa” na-egosipụta nke a n'ụzọ ebumpụta ụwa.
- source_word: τοῖς ἐμὲ ἀνακρίνουσίν
  choice: ndị na-enyocha m
  rationale: Nke a na-akọwa ndị azịza Pọl chere ihu; usoro a bụ Igbo doro anya ma kwekọọ n'ọrụ dative Grik ahụ.
- source_word: ἐστιν αὕτη
  choice: Nke a bụ
  rationale: Ọ na-akọwapụta ihe a kpọrọ azịza Pọl. “Nke a bụ” bụ usoro okwu Igbo ebumpụta ụwa.
