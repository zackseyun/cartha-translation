review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves the repeated ‘weak,’ the aorist/perfect contrast (‘aghọrọ m’ / ‘aghọọla m’), the modest ‘ụfọdụ,’ and the salvation sense of σώσω. However, ‘rite ndị na-adịghị ike’ more readily means ‘receive/obtain the weak’ than κερδήσω’s contextual sense of winning or gaining persons; ‘nweta’ is clearer in this context. Rendering πάντως as ‘si n’ụzọ ọ bụla’ more directly represents the Greek adverbial force, ‘by every possible means.’
  naturalness: The revised wording is natural Standard Igbo and keeps Paul’s compressed rhetorical repetition. ‘N’ebe ndị na-adịghị ike nọ’ and ‘ihe niile nye mmadụ niile’ are idiomatic and appropriately formal for scripture.
  terminology: ‘Ndị na-adịghị ike’ rightly remains broad in the text, without restricting it to conscience. ‘Zọpụta’ correctly retains the theological force of σώσω. The first footnote is adjusted to give a plural, more idiomatic alternative consistent with the referent and to avoid making the explanatory wording sound like the main-text meaning.
  issues:
  - severity: medium
    issue: ‘rite ndị na-adịghị ike’ is not the clearest equivalent for κερδήσω.
    rationale: Although ‘rite’ can mean gain or obtain, it can sound like receiving or acquiring people. ‘Nweta’ more naturally conveys gaining/winning them in this evangelistic context without adding an interpretive object such as ‘for Christ.’
  - severity: low
    issue: The main rendering of πάντως is slightly over-literal in its instrumental phrasing.
    rationale: ‘Jiri ụzọ niile’ is understandable, but ‘si n’ụzọ ọ bụla’ more directly expresses πάντως, ‘by all means/in every possible way.’
  - severity: low
    issue: Footnote a uses singular wording for a plural expression and gives a less direct alternative.
    rationale: The verse speaks of plural ‘weak’ people. ‘Ndị na-adịghị ike n’akọ na uche’ is a concise, natural alternative while preserving the note’s nonexclusive explanation.
  revised_text: N’ebe ndị na-adịghị ike nọ, aghọrọ m onye na-adịghị ike[a], ka m wee nweta ndị na-adịghị ike. Aghọọla m ihe niile nye mmadụ niile, ka m wee si n’ụzọ ọ bụla[b] zọpụta ụfọdụ.
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị na-adịghị ike n’akọ na uche.” N’ime 1 Ndị Kọrịnt, okwu a nwere ike izo aka karịsịa n’ebe ndị akọ na uche ha na-adị mfe imerụ nọ.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “n’ụzọ ọ bụla” ma ọ bụ “n’agbanyeghị mgbalị ọ ga-ewe.” Nkebiokwu ahụ pụtara iji ụzọ ọ bụla kwe omume na-achụ ebumnuche ahụ.
    reason: lexical_alternative
  revision_rationale: The revision improves the contextual sense of κερδήσω and the adverbial force of πάντως while retaining the source’s repetition, aspectual distinction, broad reference to the weak, and deliberately limited ‘some.’ No disputed interpretation is imposed.
