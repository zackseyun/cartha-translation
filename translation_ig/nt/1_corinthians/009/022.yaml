revisions:
- from: N’ebe ndị na-adịghị ike nọ, aghọrọ m onye na-adịghị ike[a], ka m wee rite ndị na-adịghị ike. Aghọọla m ihe niile nye mmadụ niile, ka m wee jiri ụzọ niile[b] zọpụta ụfọdụ.
  to: N’ebe ndị na-adịghị ike nọ, aghọrọ m onye na-adịghị ike[a], ka m wee nweta ndị na-adịghị ike. Aghọọla m ihe niile nye mmadụ niile, ka m wee si n’ụzọ ọ bụla[b] zọpụta ụfọdụ.
  rationale: The revision improves the contextual sense of κερδήσω and the adverbial force of πάντως while retaining the source’s repetition, aspectual distinction, broad reference to the weak, and deliberately limited ‘some.’ No disputed interpretation is imposed.
