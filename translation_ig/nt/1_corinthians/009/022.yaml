id: 1CO.9.22
reference: 1 Corinthians 9:22
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐγενόμην τοῖς ⸀ἀσθενέσιν ἀσθενής, ἵνα τοὺς ἀσθενεῖς κερδήσω· τοῖς πᾶσιν ⸀γέγονα πάντα, ἵνα πάντως τινὰς σώσω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/022.yaml
  text: To the weak I became weak[a], so that I might win the weak. I have become all things to all people[b], so that by all means I might save some.
translation:
  language: ig
  text: N’ebe ndị na-adịghị ike nọ, aghọrọ m onye na-adịghị ike[a], ka m wee nweta ndị na-adịghị ike. Aghọọla m ihe niile nye mmadụ niile, ka m wee si n’ụzọ ọ bụla[b] zọpụta ụfọdụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị na-adịghị ike n’akọ na uche.” N’ime 1 Ndị Kọrịnt, okwu a nwere ike izo aka karịsịa n’ebe ndị akọ na uche ha na-adị mfe imerụ nọ.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “n’ụzọ ọ bụla” ma ọ bụ “n’agbanyeghị mgbalị ọ ga-ewe.” Nkebiokwu ahụ pụtara iji ụzọ ọ bụla kwe omume na-achụ ebumnuche ahụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγενόμην
  choice: aghọrọ m
  rationale: Oge aorist nke γίνομαι na-egosi na Pọl banyere n’ọnọdụ ma ọ bụ n’ụzọ omume kwekọrọ n’ebe ndị ọ na-ejere ozi nọ; “aghọrọ m” bụ Igbo dị ndụ nke na-echekwa echiche ahụ.
- source_word: ἀσθενέσιν / ἀσθενής / ἀσθενεῖς
  choice: ndị na-adịghị ike / onye na-adịghị ike
  rationale: E jigidere otu mgbọrọgwụ okwu n’ebe atọ ahụ iji chekwaa nkwughachi na ike okwu Grik. Okwu a nwere ike ịgụnye ndị akọ na uche ha na-adị mfe imerụ, ma amaokwu ahụ n’onwe ya akọwaghị ya naanị otú ahụ.
- source_word: κερδήσω
  choice: ka m wee rite
  rationale: κερδαίνω n’ọnọdụ a pụtara irite mmadụ ma ọ bụ nweta ya n’ọrụ izi ozi ọma, ọ bụghị nanị inweta uru onwe onye.
- source_word: τοῖς πᾶσιν
  choice: nye mmadụ niile
  rationale: Akụkụ dative a hapụrụ aha mmadụ n’ime Grik n’ihi na a ghọtara ya site n’ọnọdụ okwu; itinye “mmadụ” na-eme ka Igbo doo anya n’enweghị ịgbakwunye echiche ọhụrụ.
- source_word: γέγονα
  choice: aghọọla m
  rationale: Oge perfect na-egosi ọnọdụ dị ugbu a sitere n’omume Pọl gara aga; “aghọọla m” na-echekwa akụkụ ahụ.
- source_word: πάντα
  choice: ihe niile
  rationale: 'Nke a na-echekwa obosara na usoro okwu Grik: ịbụ “ihe niile nye mmadụ niile.”'
- source_word: πάντως
  choice: jiri ụzọ niile
  rationale: N’ebe a πάντως na-egosi iji ụzọ ọ bụla kwe omume mee ihe iji ruo ebumnuche ahụ; nsụgharị a anaghị ekwu na ụzọ na-ezighị ezi so na ya.
- source_word: τινὰς
  choice: ụfọdụ
  rationale: 'Okwu nnọchi anya a na-akpachapụ anya: Pọl ekwughị na mmadụ niile ga-azọpụta site n’ọrụ ya.'
- source_word: σώσω
  choice: ka m wee ... zọpụta
  rationale: σῴζω bụ okwu nzọpụta n’ọnọdụ izi ozi ọma a. “Zọpụta” na-echekwa ibu nkà mmụta okpukpe nke okwu ahụ n’enweghị ime ka ọ dị nro.
theological_decisions:
- issue: Ihe “ndị na-adịghị ike” pụtara
  choice: E debere ya n’obosara dịka “ndị na-adịghị ike.”
  alternative: ndị akọ na uche ha na-adịghị ike; ndị na-enweghị ike
  rationale: N’ime 1 Ndị Kọrịnt, karịsịa isi 8–10, okwu a nwere ike ịpụta ndị akọ na uche ha na-adị mfe imerụ. Ma okwu amaokwu a sara mbara ma kwekọọ n’usoro ìgwè ndị gbara ya gburugburu; ya mere, isi ederede ekwesịghị imechi ihe Grik hapụrụ ghe oghe.
- issue: Ike okwu “zọpụta”
  choice: E ji “zọpụta” kọwaa ebumnuche Pọl n’ọrụ izi ozi ọma.
  alternative: rite ha maka nzọpụta; nyere aka zọpụta
  rationale: σῴζω nwere ezigbo echiche nzọpụta. Ime ka okwu ahụ dị nro ga-ebelata ihe ederede kwuru; ịkọwa ya dịka Pọl bụ isi mmalite nzọpụta ga-agafe ihe ederede kwuru. Nsụgharị a na-echekwa esemokwu ahụ ma kwe ka ọnọdụ sara mbara kọwaa ọrụ ya dịka onye e ji arụ ọrụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E chekwara nkwughachi “ndị na-adịghị ike,” ọdịiche dị n’etiti aorist “aghọrọ m” na perfect “aghọọla m,” nakwa obosara nke “ihe niile nye mmadụ niile.” A zere asụsụ nke otu ụka pụrụ iche.
