id: 1CO.9.15
reference: 1 Corinthians 9:15
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἐγὼ δὲ ⸂οὐ κέχρημαι οὐδενὶ⸃ τούτων. οὐκ ἔγραψα δὲ ταῦτα ἵνα οὕτως γένηται ἐν ἐμοί, καλὸν γάρ μοι μᾶλλον ἀποθανεῖν ἤ— τὸ καύχημά μου ⸂οὐδεὶς κενώσει⸃.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/015.yaml
  text: But I have made use of none of these things[a]. Yet I did not write these things so that it should be done this way for me[b], for I would rather die than—no one will nullify my boasting.
translation:
  language: ig
  text: Ma ejibeghị m nke ọ bụla n’ime ihe ndị a[a]. Ma edeghị m ihe ndị a ka e wee mee m otu a[b], n’ihi na ọ ga-akara m mma ịnwụ karịa—ọ dịghị onye ga-eme ka ihe m ji anya isi ghọọ ihe efu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n’ụzọ na-akọwa ihe gbara ya gburugburu nke ọma, “ọ dịghị nke ọ bụla n’ime ikike ndị a.”
    reason: lexical_alternative
  - marker: b
    text: 'Okwu Grik kwụsịrị na mberede mgbe “ịnwụ karịa—” gasịrị, wee maliteghachi, sị: “ọ dịghị onye ga-eme ka ihe m ji anya isi ghọọ ihe efu.” Ọtụtụ nsụgharị na-eme ka okwu ahụ dị larịị, sị: “karịa ikwe ka onye ọ bụla mee ka ihe m ji anya isi ghọọ ihe efu.”'
    reason: alternative_reading
lexical_decisions:
- source_word: κέχρημαι
  choice: ejighị m ... mee ihe
  rationale: Nke a bụ ụzọ Igbo dị mfe ma bụrụkwa nke ebumpụta ụwa isi kwuo na Pọl ejibeghị ma ọ bụ eritebeghị uru n’ihe ndị ahụ; ọ naghị etinye echiche nke iji ihe eme ihe n’ụzọ ọjọọ.
- source_word: οὐδενὶ τούτων
  choice: nke ọ bụla n’ime ihe ndị a
  rationale: Ọ na-anọgide nso n’okwu Grik, ebe ihe gbara amaokwu a gburugburu na-egosi na ọ na-ekwu maka ikike ndị a tụlere.
- source_word: ἔγραψα ... ταῦτα
  choice: edeghị m ihe ndị a
  rationale: Ọ na-egosipụta aorist dị ka ihe Pọl mere n’ide akụkụ akwụkwọ ozi a, ma na-edobe ntụaka ya n’ihe ndị o kwuru tupu mgbe ahụ.
- source_word: ἵνα οὕτως γένηται ἐν ἐμοί
  choice: ka e wee si otu a meere m
  rationale: Nke a na-egosipụta nzube nke ἵνα na echiche na Pọl adịghị ede ka ndị ọzọ wee nye ya ụdị nkwado ahụ.
- source_word: καλὸν γάρ μοι μᾶλλον ἀποθανεῖν
  choice: n’ihi na ọ ga-akara m mma ịnwụ
  rationale: Ọ bụ ụzọ Igbo doro anya ma dị ebumpụta ụwa isi gosipụta ntụnyere na mkpebi siri ike dị n’okwu Grik.
- source_word: τὸ καύχημά μου
  choice: ihe m ji anya isi
  rationale: καύχημα nwere ike ịbụ ihe ma ọ bụ ihe ndabere mmadụ ji anya isi; nsụgharị a na-egosipụta nke ahụ nke ọma karịa okwu ga-apụta nanị omume ịnya isi.
- source_word: κενώσει
  choice: ga-eme ka ... ghọọ ihe efu
  rationale: Ọ na-echekwa ihe atụ nke ‘ime ka ihe tọgbọrọ chakoo/ghọọ ihe efu,’ ma n’Igbo ọ na-egosi imebi ike ma ọ bụ uru nke ihe Pọl ji anya isi.
theological_decisions:
- issue: Nhazi okwu nke kwụsịrị na mberede mgbe ἤ gasịrị
  choice: E debere akara ogologo ‘karịa—’ tupu ahịrịokwu amaliteghachi.
  alternative: ‘ọ ga-akara m mma ịnwụ karịa ikwe ka onye ọ bụla mee ka ihe m ji anya isi ghọọ ihe efu.’
  rationale: Grik kwụsịrị echiche mbụ mgbe ‘karịa—’ gasịrị ma maliteghachi n’ụzọ ọzọ. Idebe nkwụsị a na-echekwa ike mmetụta uche na mgbagwoju okwu nke isi mmalite kama idozi ya nwayọọ nwayọọ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E debere nkwụsị okwu nke Grik na akara ogologo, ebe nkọwa okwu gbara amaokwu ahụ gburugburu banyere ‘ikike’ dị n’okpuru ala kama itinye ya n’isiokwu ahụ.
