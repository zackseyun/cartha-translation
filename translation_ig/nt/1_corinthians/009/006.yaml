  text: ἢ μόνος ἐγὼ καὶ Βαρναβᾶς οὐκ ἔχομεν ἐξουσίαν ⸀μὴ ἐργάζεσθαι;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/006.yaml
  text: Or is it only Barnabas and I who have no right not to work?[a]
translation:
  language: ig
  text: Ka ọ̀ bụ naanị mụ na Banabas ka anyị na-enweghị ikike ịghara ịrụ ọrụ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ikike ịghara ịrụ ọrụ” ma ọ bụ “nnwere onwe ịghara ịdọgbu onwe anyị n'ọrụ.” N'ebe a, ọ na-ekwu maka ikike ịghara ịrụ ọrụ aka iji nweta ihe e ji ebi ndụ, ka e wee na-akwado ndịozi ahụ n'ozi ha.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἢ
  choice: Ka ọ̀ bụ
  rationale: Ọ na-ewebata ajụjụ ọzọ Pọl ji arụrịta ụka; nke a bụ ụzọ ebumpụta ụwa e si kwuo ya n'Igbo.
- source_word: μόνος
  choice: naanị
  rationale: Ọ na-emesi ike na a na-ekwu na ọ bụ naanị Pọl na Banabas ka ọnọdụ ahụ metụtara.
- source_word: ἐγὼ καὶ Βαρναβᾶς
  choice: mụ na Banabas
  rationale: Nke a na-edobe usoro isiokwu Grik ma na-ada nke ọma n'Igbo; e dere aha Βαρναβᾶς dịka Banabas.
- source_word: οὐκ ἔχομεν
  choice: bụ ndị na-enweghị
  rationale: Ọ bụ ntụgharị Igbo doro anya nke ngwaa ahụ a jụrụ ajụ, nke na-edobe ụdị ajụjụ Pọl ji arụrịta ụka.
- source_word: ἐξουσίαν
  choice: ikike
  rationale: N'ebe a, okwu ahụ pụtara ikike ziri ezi ma ọ bụ ihe onyeozi nwere ikike ime, ọ bụghị ikike ịchị ndị ọzọ.
- source_word: μὴ ἐργάζεσθαι
  choice: ịghara ịrụ ọrụ
  rationale: 'Ọ na-edobe ọdịnaya ikike ahụ n''ụzọ kpọmkwem: ikike ịghara ịrụ ọrụ; ihe gbara amaokwu ahụ gburugburu na-egosi ọrụ mmadụ ji akwado onwe ya.'
theological_decisions:
- issue: Ihe ἐξουσία pụtara n'okwu Pọl a
  choice: Ikike ndịozi ịghara ịrụ ọrụ ha ji akwado onwe ha, ka ndị ha na-ejere ozi wee na-akwado ha
  alternative: Ikike ma ọ bụ nnwere onwe n'ozuzu ya, n'enweghị ntụaka pụrụ iche n'ịkwado ha n'ihe onwunwe
  rationale: Ihe gbara 1 Ndị Kọrịnt 9:6 gburugburu na-ekwu banyere ikike ndịozi inweta nri na nkwado, nakwa banyere mkpebi Pọl ịghara iji ikike ndị ahụ. Isi amaokwu ahụ ka dị nkenke, ebe nkọwa ala peeji na-eme ka ihe gbara ya gburugburu doo anya.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. Ajụjụ ahụ na-edobe ụda arụmụka Pọl, ma e tinyebeghị nkọwa banyere nkwado ego n'ime isi amaokwu karịa ihe Grik kwuru.
