review_pass:
  verdict: revise
  source_fidelity: The draft correctly renders the rhetorical alternative (ἢ), the exclusivity of μόνος, the paired subject Paul and Barnabas, and ἐξουσία as a legitimate right. “Ịghara ịrụ ọrụ” accurately preserves μὴ ἐργάζεσθαι without importing the contextual issue of financial support into the verse itself.
  naturalness: The present wording is understandable, but “naanị mụ na Banabas bụ ndị na-enweghị” is less direct than the idiomatic Igbo rhetorical construction “naanị mụ na Banabas ka anyị na-enweghị.” This also explicitly carries the Greek first-person plural verb.
  terminology: “Ikike” is the appropriate Standard Igbo term for ἐξουσία here. “Banabas” is retained as the established Igbo form of Barnabas. The footnote is adjusted because “ịkwụsị ịrụ ọrụ” can suggest ceasing work after having begun, whereas the Greek concerns refraining from work.
  issues:
  - severity: low
    issue: The main clause uses a relative construction rather than an explicit first-person plural verb.
    rationale: “Bụ ndị na-enweghị” is grammatical, but “ka anyị na-enweghị” is more natural and more closely reflects οὐκ ἔχομεν (“we do not have”).
  - severity: medium
    issue: The footnote alternative “ikike ịkwụsị ịrụ ọrụ” can imply stopping work, rather than having the right to refrain from it.
    rationale: μὴ ἐργάζεσθαι denotes not working/refraining from work; “ịghara ịrụ ọrụ” or “izere ịrụ ọrụ” avoids a potentially misleading temporal nuance. The explanatory sentence also benefits from consistent first-person/plural reference.
  revised_text: Ka ọ̀ bụ naanị mụ na Banabas ka anyị na-enweghị ikike ịghara ịrụ ọrụ?[a]
  revised_footnotes:
