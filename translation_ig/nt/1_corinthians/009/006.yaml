- from: Ka ọ̀ bụ naanị mụ na Banabas bụ ndị na-enweghị ikike ịghara ịrụ ọrụ?[a]
  to: Ka ọ̀ bụ naanị mụ na Banabas ka anyị na-enweghị ikike ịghara ịrụ ọrụ?[a]
  rationale: The revision makes the rhetorical question more idiomatic in Standard Igbo while retaining every element of the Greek. The footnote preserves the lexical alternatives for ἐξουσία and μὴ ἐργάζεσθαι, removes the possible implication of merely stopping work, and states the contextual explanatory sense without adding it to the verse itself.
  reviewer_model: gpt-5.6-terra
