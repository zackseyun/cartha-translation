- from: N’otu aka ahụ, Onyenwe anyị nyekwara iwu ka ndị na-ekwusa ozi ọma[a] si n’ozi ọma ahụ na-ebi ndụ[b].
  to: N'otu aka ahụ, Onyenwe anyị nyekwara iwu ka ndị na-akpọsa ozi ọma[a] bie ndụ site n'ozi ọma ahụ[b].
  rationale: The revision uses a natural subjunctive construction for what the Lord commanded, preserves the source’s source-of-livelihood wording, and corrects the lexical footnote so that it does not introduce an unstated public-setting nuance. Footnote anchors remain in their order of occurrence.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T18:12:02Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the Lord's authoritative command and the material-source sense of ἐκ τοῦ εὐαγγελίου. However, the construction “ka ... na-ebi ndụ” is less precise for the infinitive governed by “nyere iwu”; the subjunctive “bie ndụ” expresses the commanded result more directly. The proposed revision also retains the source’s ambiguity by not expanding “Onyenwe anyị.”
  naturalness: “N'otu aka ahụ” and “Onyenwe anyị nyekwara iwu” are natural Standard Igbo. “Bie ndụ site n'ozi ọma ahụ” is a smoother and more idiomatic expression of living/making one’s living from the gospel than “si n’ozi ọma ahụ na-ebi ndụ” in this command construction.
  terminology: “Ozi ọma” is established Standard Igbo terminology for εὐαγγέλιον. “Ndị na-akpọsa ozi ọma” suitably conveys καταγγέλλω, while the footnote offers “ndị na-ekwusa ozi ọma” as a valid, familiar alternative. The existing footnote’s addition “n’ihu ọha” is not required by the Greek and should not be retained.
  issues:
  - severity: medium
    issue: The main-clause complement uses the progressive form “ka ndị ... na-ebi ndụ.”
    rationale: After “nyere iwu ka,” Standard Igbo more naturally uses the subjunctive/result form “bie ndụ.” This more clearly renders the infinitive ζῆν as the content of the command.
  - severity: medium
    issue: Footnote a adds “n’ihu ọha” (“in public”).
    rationale: καταγγέλλω conveys proclaiming/announcing, but the verse itself does not specify a public setting. The alternative should not add this detail.
  revised_text: N'otu aka ahụ, Onyenwe anyị nyekwara iwu ka ndị na-akpọsa ozi ọma[a] bie ndụ site n'ozi ọma ahụ[b].
  revised_footnotes:
