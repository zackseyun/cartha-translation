    text: Ma ọ bụ, “ndị na-ekwusa ozi ọma.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “na-enweta ihe ha ji ebi ndụ site n'ozi ọma ahụ.”
    reason: lexical_alternative
  revision_rationale: The revision uses a natural subjunctive construction for what the Lord commanded, preserves the source’s source-of-livelihood wording, and corrects the lexical footnote so that it does not introduce an unstated public-setting nuance. Footnote anchors remain in their order of occurrence.
