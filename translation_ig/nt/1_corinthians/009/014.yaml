base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/014.yaml
  text: In the same way[b][a], the Lord also commanded that those who proclaim the gospel should live from the gospel.
translation:
  language: ig
  text: N'otu aka ahụ, Onyenwe anyị nyekwara iwu ka ndị na-akpọsa ozi ọma[a] bie ndụ site n'ozi ọma ahụ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị na-ekwusa ozi ọma.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “na-enweta ihe ha ji ebi ndụ site n'ozi ọma ahụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως
  choice: N’otu aka ahụ
  rationale: Na-egosi ntụnyere ya na ihe atụ ndị bu ụzọ; okwu a bụ Igbo dị mfe ma doo anya.
- source_word: καὶ
  choice: -kwara
  rationale: 'E tinyere ya na ngwaa “nyere” iji gosipụta echiche mgbakwunye dị na καὶ: Onyenwe anyị nyekwara iwu.'
- source_word: ὁ κύριος
  choice: Onyenwe anyị
  rationale: Nke a bụ ụzọ a na-ejikarị asụ κύριος n’Igbo n’ebe a, ma ọ naghị agbakwunye “Jizọs” nke na-adịghị kpọmkwem n’ederede ahụ.
- source_word: διέταξεν
  choice: nyere iwu
  rationale: Na-egosipụta ntụziaka sitere n’aka onye nwere ikike, ọ bụghị nanị nhazi ihe.
- source_word: τοῖς ... καταγγέλλουσιν
  choice: ndị na-ekwusa
  rationale: Na-eme ka participle ahụ bụrụ aha otu ndị mmadụ, ma na-echekwa echiche nke ikwupụta ozi n’ihu ọha.
- source_word: τὸ εὐαγγέλιον
  choice: ozi ọma
  rationale: Ọ bụ okwu Igbo doro anya ma guzosie ike maka εὐαγγέλιον.
- source_word: ἐκ τοῦ εὐαγγελίου
  choice: si n’ozi ọma ahụ
  rationale: Na-echekwa echiche ἐκ nke isi iyi e si enweta ihe e ji ebi ndụ, n’enweghị ịkọwa ya karịa ihe ederede kwuru.
- source_word: ζῆν
  choice: na-ebi ndụ
  rationale: N’usoro “ka ... na-ebi ndụ,” ọ na-egosi ihe iwu ahụ chọrọ, ma na-ahapụ gburugburu okwu ka o doo anya na ọ bụ ihe e ji akpa afọ ka a na-ekwu.
theological_decisions:
- issue: Onye okwu ahụ bụ “Onyenwe anyị” na-ezo aka na ya
  choice: E debere “Onyenwe anyị”; n’ọnọdụ okwu Pọl, o yikarịrị ka ọ na-ezo aka na Jizọs.
  alternative: Ịsụ ya “Onyenwe anyị Jizọs,” ma ọ bụ iwere ya dị ka aha Chineke n’ozuzu.
  rationale: Ederede Grik kwuru naanị ὁ κύριος. Ide “Onyenwe anyị” na-echekwa okwu isi mmalite na nghọta ya, n’etinyeghị aha ọzọ.
- issue: Ihe “si n’ozi ọma ahụ na-ebi ndụ” pụtara
  choice: Ọ na-ekwu maka nkwado ihe e ji ebi ndụ nke ndị na-ekwusa ozi ọma na-enweta site n’ozi ha.
  alternative: Ndụ ime mmụọ nke sitere n’ozi ọma.
  rationale: Gburugburụ amaokwu ahụ na-atụle ikike ndị ozi nwere inweta nkwado. Ma a hapụrụ usoro okwu isi mmalite ka gburugburu ya kọwaa ụdị ndụ a na-ekwu.
translation_notes:
  register: Standard Igbo; asụsụ dị ugbu a, dị nsọ ma dị mfe nghọta. A haziri akara ndetu ala peeji dịka usoro ha si pụta n’amaokwu ahụ.
