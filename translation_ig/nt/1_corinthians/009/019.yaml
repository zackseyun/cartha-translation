  text: Ἐλεύθερος γὰρ ὢν ἐκ πάντων πᾶσιν ἐμαυτὸν ἐδούλωσα, ἵνα τοὺς πλείονας κερδήσω·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/019.yaml
  text: For though I am free from all[a], I made myself a servant to all, so that I might win more of them.
translation:
  language: ig
  text: Ọ bụ ezie na anọghị m n’okpuru onye ọ bụla, emere m onwe m ohu[a] nye mmadụ niile, ka m wee nweta ọtụtụ mmadụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “onye na-ejere mmadụ niile ozi.” Okwu Grik ji asụsụ metụtara ịgba ohu; e debere “ohu” n’ahịrịokwu ahụ n’ihi na ọdịiche dị n’etiti onye nweere onwe ya na ohu bụ isi n’ihe Pọl na-ekwu.
    reason: alternative_translation
lexical_decisions:
- source_word: Ἐλεύθερος
  choice: nwere onwe m
  rationale: Nke a na-egosi ịbụ onye nweere onwe ya, na-anọghị n’agbụ ma ọ bụ n’okpuru ikike onye ọzọ; ọ na-emekwa ka ọdịiche dị n’etiti ‘onye nweere onwe ya’ na ‘ohu’ pụta ìhè.
- source_word: ἐκ πάντων
  choice: n’ebe mmadụ niile nọ
  rationale: N’ebe a, πάντων na-ezo aka n’ebe mmadụ niile nọ, dịka πᾶσιν nke na-esote ya si kwado. Nsụgharị a na-egosi na Pọl anọghị n’okpuru onye ọ bụla, ma ọ naghị ekwubiga ihe Grik kwuru ókè.
- source_word: πᾶσιν
  choice: nye mmadụ niile
  rationale: Dative plural a na-egosi ndị Pọl mere onwe ya ohu nye ha. Okwu a na-echekwa myirịta dị n’etiti ‘n’ebe mmadụ niile nọ’ na ‘nye mmadụ niile.’
- source_word: ἐμαυτὸν ἐδούλωσα
  choice: emere m onwe m ohu
  rationale: δουλόω bụ ime mmadụ ohu ma ọ bụ idobe ya n’ọnọdụ ohu. ‘Emere m onwe m ohu’ bụ Igbo doro anya nke na-echekwa omume Pọl ji aka ya họrọ nakwa ike ihe atụ nke ịgba ohu.
- source_word: ἵνα
  choice: ka m wee
  rationale: Nke a na-ewebata nzube Pọl ji mee onwe ya ohu nye mmadụ niile.
- source_word: τοὺς πλείονας
  choice: ọtụtụ ndị ọzọ
  rationale: Comparative a pụtara ọnụ ọgụgụ ka ukwuu nke ndị mmadụ. ‘Ọtụtụ ndị ọzọ’ na-egosipụta nke a n’Igbo nkịtị, na-enweghị ịgbatị ya ruo n’echiche ‘ọtụtụ ndị o kwere mee.’
- source_word: κερδήσω
  choice: rite
  rationale: κερδαίνω ji ihe atụ nke inweta uru kọwaa irite ma ọ bụ imeta ndị mmadụ n’ozi ọma. ‘Rite’ na-echekwa ihe atụ ahụ ma dabara n’ọnọdụ a.
theological_decisions:
- issue: Nsụgharị δουλόω na okwu metụtara ịgba ohu
  choice: ohu
  alternative: onye na-eje ozi
  rationale: Pọl kpachapụrụ anya mee ka ịbụ onye nweere onwe ya na ịbụ ohu guzogide ibe ha. ‘Ohu’ na-echekwa isi ike nke ihe atụ ahụ; ‘onye na-eje ozi’ ga-eme ka ọdịiche ahụ daa mbà.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E chekwara myirịta nke okwu ‘mmadụ niile’ ugboro abụọ na ọdịiche dị n’etiti nnwere onwe na ịgba ohu.
