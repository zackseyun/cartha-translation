  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τίς στρατεύεται ἰδίοις ὀψωνίοις ποτέ; τίς φυτεύει ἀμπελῶνα καὶ ⸂τὸν καρπὸν⸃ αὐτοῦ οὐκ ἐσθίει; ⸀τίς ποιμαίνει ποίμνην καὶ ἐκ τοῦ γάλακτος τῆς ποίμνης οὐκ ἐσθίει;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/007.yaml
  text: Who ever serves as a soldier at his own expense? Who plants a vineyard and does not eat its fruit? Or who shepherds a flock and does not drink from the milk of the flock?[a][b]
translation:
  language: ig
  text: Ònye na-eje ozi dịka onye agha, ọ dịtụla mgbe, ma na-eji ego nke aka ya akwado ọrụ agha ya? Ònye na-akụ ubi vaịn ma ọ naghị eri mkpụrụ ya? Ma ọ bụ ònye na-azụ ìgwè atụrụ ma ọ naghị aṅụ mmiri ara ehi nke ìgwè atụrụ ahụ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’ụzọ nkịtị, Grik sịrị, “ọ naghị eri site na mmiri ara ehi nke ìgwè atụrụ ahụ.” N’Igbo, a na-ekwu “ịṅụ mmiri ara ehi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: στρατεύεται
  choice: na-eje ozi dị ka onye agha
  rationale: Nke a na-egosi ịrụ ọrụ agha, n’etinyeghị echiche na ọ bụ naanị ịga ibu agha kpọmkwem.
- source_word: ἰδίοις ὀψωνίοις
  choice: jiri ego nke aka ya kwụọ ụgwọ ya
  rationale: Ọ bụ ezie na ὀψώνιον pụrụ ịpụta ụgwọ ọrụ ma ọ bụ nri onye agha, ajụjụ a pụtara na onye agha anaghị eji ego nke aka ya akwụ ihe ọrụ agha ya na-efu.
- source_word: ποτέ
  choice: mgbe ọ bụla
  rationale: Ọ na-eme ka ajụjụ nkwupụta a nwee echiche nke ‘mgbe ọ bụla’ ma ọ bụ ‘ọ dịtụla mgbe.’
- source_word: φυτεύει ἀμπελῶνα
  choice: na-akụ ubi vaịn
  rationale: Nke a na-edowe ihe atụ ọrụ ugbo ahụ n’asụsụ Igbo doro anya ma dị mfe nghọta.
- source_word: τὸν καρπὸν αὐτοῦ
  choice: mkpụrụ ya
  rationale: καρπός ebe a bụ ihe ubi vaịn ahụ na-amị; ‘mkpụrụ ya’ dị nkenke ma kwekọọ na isi mmalite.
- source_word: ποιμαίνει ποίμνην
  choice: na-azụ ìgwè anụ ụlọ
  rationale: Nke a bụ ụzọ nkịtị e si ekwu ilekọta na ịta ìgwè anụ ụlọ n’Igbo, ma na-edowe ihe atụ onye ọzụzụ anụ ụlọ.
- source_word: ἐκ τοῦ γάλακτος τῆς ποίμνης
  choice: mmiri ara ehi si n’ìgwè anụ ụlọ ahụ
  rationale: Nke a na-echekwa echiche nke isi mmalite ma ọ bụ oke e si n’ihe ìgwè anụ ụlọ ahụ na-enye nweta.
- source_word: ἐσθίει
  choice: eri / aṅụ
  rationale: Okwu Grik ahụ bụ ‘iri’ na nkebi abụọ ahụ, ma Igbo nkịtị na-ekwu ‘ịṅụ’ mmiri ara ehi; e tinyere nkọwa okwu n’ala peeji iji chekwaa ọdịdị Grik.
theological_decisions:
- issue: Ụdị nwoke otu onye n’ajụjụ atọ ndị e ji τίς malite
  choice: E jiri ‘onye’ na ‘nke aka ya,’ bụ́ okwu pụrụ ịnọchite anya mmadụ ọ bụla n’Igbo.
  alternative: Iji ọtụtụ mmadụ kwuo ya, dị ka ‘ndị ... nke aka ha.’
  rationale: Grik ji otu onye kwuo ihe atụ niile. Igbo ‘onye’ na-edowe otu onye ahụ ma na-arụkwa ọrụ dịka okwu zuru mmadụ niile, n’enweghị ịgbakwunye nkọwa otu ụka.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Ajụjụ atọ ahụ nọgidere bụrụ ajụjụ nkwupụta, a chekwara ihe atụ agha, ubi vaịn, na ìgwè anụ ụlọ. E ji ‘ubi vaịn’ mee ka ἀμπελών pụta ìhè karịa naanị ‘ubi.’
