revisions:
- from: Ònye na-eje ozi dị ka onye agha mgbe ọ bụla, ma jiri ego nke aka ya kwụọ ụgwọ ya? Ònye na-akụ ubi vaịn ma ọ naghị eri mkpụrụ ya? Ma ọ bụ ònye na-azụ ìgwè anụ ụlọ ma ọ naghị aṅụ mmiri ara ehi si n’ìgwè anụ ụlọ ahụ?[a]
  to: Ònye na-eje ozi dịka onye agha, ọ dịtụla mgbe, ma na-eji ego nke aka ya akwado ọrụ agha ya? Ònye na-akụ ubi vaịn ma ọ naghị eri mkpụrụ ya? Ma ọ bụ ònye na-azụ ìgwè atụrụ ma ọ naghị aṅụ mmiri ara ehi nke ìgwè atụrụ ahụ?[a]
  rationale: The revision corrects the rendering of ποτέ, clarifies the idiom ἰδίοις ὀψωνίοις as bearing the cost of one’s military service, and corrects the lexical footnote. It otherwise preserves the source’s parallel rhetorical structure and images.
