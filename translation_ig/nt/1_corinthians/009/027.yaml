id: 1CO.9.27
reference: 1 Corinthians 9:27
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀλλὰ ὑπωπιάζω μου τὸ σῶμα καὶ δουλαγωγῶ, μή πως ἄλλοις κηρύξας αὐτὸς ἀδόκιμος γένωμαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/027.yaml
  text: But I discipline my body and make it my servant[a], lest somehow, after preaching to others[c][b], I myself should become disqualified.
translation:
  language: ig
  text: Kama, ana m ata ahụ m ahụhụ[a] ma na-eme ka ọ bụrụ ohu m[b], ka mụ onwe m ghara ịbụ onye na-erughị eru[c] mgbe m kwusachara ozi nye ndị ọzọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ana m akụ ahụ m ihe.” Okwu Grik ahụ pụtara n'ụzọ nkịtị ịkụ mmadụ n'okpuru anya; ebe a, e ji ya mee ihe atụ nke ọzụzụ onwe siri ike.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “na-eme ya ohu” ma ọ bụ “na-eme ya ka ọ bụrụ ohu.”
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “onye a jụrụ ajụ” ma ọ bụ “onye a na-anabataghị.” N'ọnọdụ ihe atụ nke asọmpi gbara amaokwu a gburugburu, ọ pụkwara ịpụta “onye a napụrụ ikike ịsọ mpi.”
    reason: alternative_reading
lexical_decisions:
- source_word: ὑπωπιάζω
  choice: ana m ata ahụ m ahụhụ
  rationale: Okwu Grik a pụtara n'ụzọ nkịtị ịkụ mmadụ n'okpuru anya, ma n'ọnọdụ a ọ bụ ihe atụ nke ọzụzụ onwe siri ike. Nhọrọ a na-egosi ịdị ike nke ihe atụ ahụ n'Igbo eke n'emeghị ka amaokwu ahụ bụrụ iwu imerụ onwe ahụ.
- source_word: σῶμα
  choice: ahụ m
  rationale: E debere okwu ahụ pụtara ‘ahụ’ kpọmkwem, kama ịgbasa ya ka ọ bụrụ naanị ‘onwe m.’
- source_word: δουλαγωγῶ
  choice: na-eme ka ọ bụrụ ohu m
  rationale: Nke a na-echekwa ihe atụ siri ike nke ime ka ahụ bụrụ ohu, ọ bụghị naanị ime ka ọ nọrọ n'okpuru nchịkwa.
- source_word: μή πως
  choice: ka ọ ghara ịbụ na
  rationale: Nkebiokwu a na-egosi ebumnuche igbochi ihe a na-atụ egwu ma ọ bụ nchegbu na ihe ahụ nwere ike ime.
- source_word: ἄλλοις
  choice: nye ndị ọzọ
  rationale: Nke a bụ ntụgharị Igbo doro anya nke onye a na-ekwusara ozi.
- source_word: κηρύξας
  choice: mgbe m kwusachara ozi ọma
  rationale: ‘Mgbe ... gasịrị’ na-egosi na nkwusa ahụ buru ụzọ mee tupu ihe a na-atụ egwu; ‘ozi ọma’ na-eme ka ụdị nkwusa Pọl na-ekwu maka ya doo anya n'ọnọdụ akwụkwọ ozi ahụ.
- source_word: ἀδόκιμος
  choice: onye na-erughị eru
  rationale: Nhọrọ a na-egosi onye na-agafeghị ule ma ọ bụ onye a na-anabataghị, ma ọ naghị ekpebi ma ọ bụ nzọpụta ikpeazụ ka ọ bụ ụgwọ ma ọ bụ ọrụ ozi ka okwu ahụ metụtara.
- source_word: γένωμαι
  choice: a ga-ahụ mụ onwe m dị ka
  rationale: Nke a na-egosi ihe Pọl na-atụ egwu na ọ pụrụ ịbụ ma ọ bụ pụta ìhè dịka ya, n'Igbo dị mfe nghọta.
- source_word: ἀλλὰ
  choice: Kama
  rationale: ‘Kama’ na-egosi mgbanwe siri ike site n'ihe e kwuru tupu ya gaa n'omume Pọl na-eme.
theological_decisions:
- issue: Ihe egwu Pọl na-atụ banyere ịbụ ἀδόκιμος
  choice: A sụgharịrị ya ‘onye na-erughị eru,’ n'ọnọdụ ihe atụ nke asọmpi na ule, n'akọwaghị kpọmkwem ụdị nsonaazụ ya.
  alternative: A jụrụ ya n'ụzọ metụtara nzọpụta ikpeazụ; ma ọ bụ na o rughị eru naanị maka ọrụ ozi ma ọ bụ ụgwọ ọrụ.
  rationale: Ọnọdụ gbara amaokwu ahụ gburugburu bụ ịgba ọsọ, njide onwe, na inweta ihe nrite. Ya mere, ntụgharị ahụ kwesịrị idebe ịdị njọ nke ịdọ aka ná ntị ahụ na esemokwu nkà mmụta okpukpe dị na ya, ghara ikpebi ihe Grik ahụ na-ekwughị kpọmkwem.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E debere ‘ahụ’ na ihe atụ nke ịbụ ohu; e jiri ‘ata ... ahụhụ’ mee ka okwu banyere ịkụ n'okpuru anya bụrụ Igbo eke, ebe nkọwa ala peeji na-echekwa ọdịdị okwu Grik siri ike.
