revisions:
- from: Kama, ana m ata ahụ m ahụhụ ma na-eme ka ọ bụrụ ohu m[a], ka ọ ghara ịbụ na, mgbe m kwusachara ozi ọma nye ndị ọzọ, a ga-ahụ mụ onwe m dị ka onye na-erughị eru[b].
  to: Kama, ana m ata ahụ m ahụhụ[a] ma na-eme ka ọ bụrụ ohu m[b], ka mụ onwe m ghara ịbụ onye na-erughị eru[c] mgbe m kwusachara ozi nye ndị ọzọ.
  rationale: The revision removes the added specification “ọma” from κηρύξας, restores Paul’s direct first-person feared result, and assigns separate footnote anchors to the two distinct severe-control metaphors. It retains the concrete “ahụ,” the strong “ohu” imagery, and the theological openness of ἀδόκιμος.
  reviewer_model: gpt-5.6-terra
