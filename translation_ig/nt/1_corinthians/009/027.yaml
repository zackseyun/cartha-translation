    reason: alternative_reading
  revision_rationale: The revision removes the added specification “ọma” from κηρύξας, restores Paul’s direct first-person feared result, and assigns separate footnote anchors to the two distinct severe-control metaphors. It retains the concrete “ahụ,” the strong “ohu” imagery, and the theological openness of ἀδόκιμος.
