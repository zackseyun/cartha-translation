review_pass:
  verdict: revise
  source_fidelity: 'The draft correctly retains σώμα as “ahụ m,” the severe metaphor of ὑπωπιάζω, and the slave-language of δουλαγωγῶ. However, “ozi ọma” specifies the content of κηρύξας more narrowly than the Greek, which says simply “having proclaimed/preached.” Further, “a ga-ahụ mụ onwe m dị ka” changes Paul’s first-person feared outcome into a future passive assessment. The revision restores the direct apprehensive sense: “ka mụ onwe m ghara ịbụ …”'
  naturalness: “Ana m ata ahụ m ahụhụ” is idiomatic Standard Igbo and communicates severe self-discipline. “Ka ọ ghara ịbụ na” is also natural, though the direct construction “ka mụ onwe m ghara ịbụ” reads more smoothly here. Separating the lexical notes makes each footnote clear and accurately anchored.
  terminology: “Ohu m” rightly preserves the force of δουλαγωγῶ. “Onye na-erughị eru” is a suitably non-sectarian rendering of ἀδόκιμος, preserving the athletic/testing resonance without deciding the debated theological implication. “Kwusaa ozi” avoids adding “ọma” where the Greek does not explicitly use εὐαγγέλιον.
  issues:
  - severity: medium
    issue: “ozi ọma” adds a specification not expressed by κηρύξας.
    rationale: Although proclamation of the gospel is likely in Pauline context, κηρύξας itself means “having proclaimed/preached,” without naming the message as “good news.” Source fidelity favors the less specific “ozi.”
  - severity: medium
    issue: “a ga-ahụ mụ onwe m dị ka onye na-erughị eru” recasts γένωμαι as a future passive judgment.
    rationale: 'γένωμαι is first-person aorist middle subjunctive in a feared-result clause: Paul fears that he himself may become/be found disqualified. A direct Igbo negative-purpose construction preserves this better.'
  - severity: low
    issue: One footnote combines alternatives for two distinct Greek verbs while only one anchor is supplied.
    rationale: Separate anchors for ὑπωπιάζω and δουλαγωγῶ make the lexical alternatives precise and prevent ambiguity about which expression each alternative explains.
  revised_text: Kama, ana m ata ahụ m ahụhụ[a] ma na-eme ka ọ bụrụ ohu m[b], ka mụ onwe m ghara ịbụ onye na-erughị eru[c] mgbe m kwusachara ozi nye ndị ọzọ.
  revised_footnotes:
