reference: 1 Corinthians 9:20
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἐγενόμην τοῖς Ἰουδαίοις ὡς Ἰουδαῖος, ἵνα Ἰουδαίους κερδήσω· τοῖς ὑπὸ νόμον ὡς ὑπὸ νόμον, ⸂μὴ ὢν αὐτὸς ὑπὸ νόμον⸃, ἵνα τοὺς ὑπὸ νόμον κερδήσω·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/020.yaml
  text: And to the Jews I became as a Jew[a], so that I might win Jews; to those under the law[b], as under the law—though I myself am not under the law—so that I might win those under the law.
translation:
  language: ig
  text: N’ebe ndị Juu nọ, aghọrọ m dị ka onye Juu, ka m wee nweta ndị Juu[a]. N’ebe ndị nọ n’okpuru Iwu ahụ nọ, aghọrọ m dị ka onye nọ n’okpuru Iwu ahụ—ọ bụ ezie na mụ onwe m anọghị n’okpuru Iwu ahụ—ka m wee nweta ndị nọ n’okpuru Iwu ahụ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “rite ndị Juu n’uru”; ngwaa a pụrụ ịpụta inweta ma ọ bụ imeri mmadụ ka o kwenye.
    reason: lexical_alternative
  - marker: b
    text: “Iwu ahụ” n’ebe a yikarịrị ka ọ na-ezo aka n’Iwu Mosis.
    reason: cultural_note
lexical_decisions:
- source_word: ἐγενόμην
  choice: aghọrọ m
  rationale: Ọ na-egosipụta na Pọl nakweere ụzọ omume kwesịrị ndị ọ na-agakwuru; ‘aghọrọ m’ na-echekwa ihe γίνομαι pụtara n’enweghị echiche na ọ gbanwere agbụrụ ya.
- source_word: τοῖς Ἰουδαίοις ... ὡς Ἰουδαῖος
  choice: N’ebe ndị Juu nọ ... dị ka onye Juu
  rationale: Nke a na-echekwa ntụnyere ὡς ma gosi na okwu a metụtara otú Pọl si eme omume n’etiti ha, ọ bụghị na ọ kwụsịrị ịbụ onye Juu n’agbụrụ.
- source_word: ἵνα ... κερδήσω
  choice: ka m wee nweta
  rationale: κερδαίνω pụtara inweta uru ma ọ bụ imeri mmadụ; ‘nweta’ bụ okwu Igbo doro anya nke na-echekwa ihe atụ ahụ n’ọnọdụ ozi ọma.
- source_word: τοῖς ὑπὸ νόμον
  choice: ndị nọ n’okpuru Iwu ahụ
  rationale: Ọ na-echekwa ihe oyiyi nke ịnọ n’okpuru ikike iwu, ebe ‘ahụ’ na-egosi usoro iwu a maara n’okwu gbara ya gburugburu.
- source_word: ὡς ὑπὸ νόμον
  choice: dị ka onye nọ n’okpuru Iwu ahụ
  rationale: Nke a na-eme ka okwu Grik dị mkpirikpi bụrụ Igbo eke, ma na-echekwa ntụnyere ahụ na-enweghị ikwu na Pọl n’onwe ya nọ n’okpuru ya.
- source_word: μὴ ὢν αὐτὸς ὑπὸ νόμον
  choice: ọ bụ ezie na mụ onwe m anọghị n’okpuru Iwu ahụ
  rationale: Ọ na-egosipụta nkọwa nke na-emegide ihe bu ya ụzọ, na-echekwa oge dị ugbu a na nkwusi ike dị na αὐτός.
- source_word: αὐτὸς
  choice: mụ onwe m
  rationale: Nke a na-echekwa nkwusi ike nke αὐτός n’okwu Pọl banyere ọnọdụ nke ya.
- source_word: νόμος
  choice: Iwu ahụ
  rationale: N’ebe a, νόμος yikarịrị ka ọ bụ Iwu Mosis; isi ederede na-ahapụ ya dịka ‘Iwu ahụ’ ka ọ ghara imechi ntakịrị obosara okwu Pọl nwere.
theological_decisions:
- issue: Ihe Pọl pụtara mgbe ọ sịrị na ya ‘anọghị n’okpuru Iwu ahụ’
  choice: 'E depụtara ya ozugbo dịka ọnọdụ Pọl n’onwe ya: ‘ọ bụ ezie na mụ onwe m anọghị n’okpuru Iwu ahụ.’'
  alternative: Ịkọwa ya dịka ‘anọghị m n’okpuru Iwu Mosis,’ ma ọ bụ tinye okwu amaokwu 21 banyere iwu Chineke na iwu Kraịst.
  rationale: Grik nke amaokwu a ekwughị nkọwa ndị ahụ. Nsụgharị ahụ na-echekwa ọdịiche na esemokwu nkà mmụta okpukpe nke Pọl n’enweghị ibubata okwu si n’amaokwu na-esote.
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-edobe usoro ntụnyere Pọl ugboro abụọ na nkwusi ike ‘mụ onwe m,’ ma na-eji akara ogologo kewaa nkọwa etiti ahụ.
