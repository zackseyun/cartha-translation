  to: N’ebe ndị Juu nọ, aghọrọ m dị ka onye Juu, ka m wee nweta ndị Juu[a]. N’ebe ndị nọ n’okpuru Iwu ahụ nọ, aghọrọ m dị ka onye nọ n’okpuru Iwu ahụ—ọ bụ ezie na mụ onwe m anọghị n’okpuru Iwu ahụ—ka m wee nweta ndị nọ n’okpuru Iwu ahụ.[b]
  rationale: E megharịrị naanị “adịkwara m” ka ọ bụrụ “aghọrọ m,” iji chekwaa ikwughachi ἐγενόμην na myirịta nke nkebi abụọ. E gbanweghị ihe amaokwu ahụ pụtara, ọnọdụ Pọl banyere Iwu ahụ, ma ọ bụ ihe nkọwa ala kwuru.
