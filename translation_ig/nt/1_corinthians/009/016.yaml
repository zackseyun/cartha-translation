  text: ἐὰν γὰρ εὐαγγελίζωμαι, οὐκ ἔστιν μοι καύχημα, ἀνάγκη γάρ μοι ἐπίκειται· οὐαὶ ⸀γάρ μοί ἐστιν ἐὰν μὴ ⸀εὐαγγελίσωμαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/016.yaml
  text: For if I preach the gospel[a], I have no ground for boasting, for necessity is laid upon me[b]. For woe is me if I do not preach the gospel.
translation:
  language: ig
  text: N’ihi na ọ bụrụ na m na-ekwusa ozi ọma[a], enweghị m ihe m ga-eji anya isi; n’ihi na mmanye dịkwasịrị m. N’ihi na ewoo m[b] ma ọ bụrụ na m ekwusaghị ozi ọma!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịtụgharị ya, “na-akpọsa ozi ọma”; otu a ka ọ dịkwa n’ebe okwu a pụtara ọzọ n’amaokwu a.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịtụgharị ya, “Ahụhụ ga-adịrị m.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐαγγελίζωμαι / εὐαγγελίσωμαι
  choice: na-ekwusa ozi ọma / ekwusaghị ozi ọma
  rationale: Ngwaa Grik a pụtara ịkpọsa ozi ọma. “Ikwusa ozi ọma” bụ okwu Igbo doro anya nke na-echekwa ike nke nkwusa ahụ; a na-ejikwa otu nsụgharị ahụ mee ihe n’ebe abụọ ahụ.
- source_word: καύχημα
  choice: ihe m ga-eji anya isi
  rationale: Nkebi okwu a na-egosi ihe ga-abụ ihe ndabere mmadụ ji anya isi, ọ bụghị naanị omume ịnya isi n’onwe ya.
- source_word: ἀνάγκη
  choice: mkpa ime ya
  rationale: Ọ na-egosi mkpa ma ọ bụ mmanye dị n’elu Pọl. Nhọrọ a na-egosi ọrụ a na-apụghị izere ezere n’akọwaghị ma mmanye ahụ sitere n’ime ya, n’èzí, ma ọ bụ n’aka Chineke.
- source_word: ἐπίκειται
  choice: dịkwasịrị m
  rationale: Ngwaa a na-egosi ihe dị n’elu mmadụ ma na-amanye ya; “dịkwasịrị m” na-echekwa ihe atụ na ibu ọrụ dị n’okwu Grik.
- source_word: οὐαί
  choice: Ahụhụ ga-adịrị m
  rationale: Nke a na-egosi nnukwu ọdachi ma ọ bụ ikpe na-echere onye ahụ, ma na-ada n’ụzọ dị nsọ ma doo anya n’Igbo ugbu a.
- source_word: ἐὰν μὴ
  choice: ma ọ bụrụ na m ...ghị
  rationale: Nke a na-enye ọnọdụ ahụ n’ụzọ kwụ ọtọ ma bụrụkwa usoro okwu Igbo e ji eme ihe.
- source_word: γάρ
  choice: n’ihi na
  rationale: A na-echekwa njikọ nkọwa nke γάρ ugboro abụọ ebe ọ dabara n’usoro okwu Igbo; nke ikpeazụ na-arụ ọrụ n’ime usoro ihe kpatara okwu ahụ dum, ya mere e kwesịghị ịmanye nkwughachi nke ga-eme ka Igbo sie ike.
theological_decisions:
- issue: Ụdị mmanye dị Pọl n’elu ikwusa ozi ọma
  choice: “mkpa ime ya dịkwasịrị m”
  alternative: “Chineke amanyela m ime ya” ma ọ bụ “mmanye dịkwasịrị m”
  rationale: Amaokwu Grik kwuru na mkpa ma ọ bụ mmanye dị n’elu Pọl, ma ọ kpọghị kpọmkwem onye ma ọ bụ ihe kpatara ya n’amaokwu a. Nsụgharị ahụ na-ahapụ okwu ahụ ka ọ dị n’enweghị itinye nkọwa ozizi sitere n’amaokwu ndị ọzọ.
- issue: Ike nke οὐαί
  choice: “Ahụhụ ga-adịrị m”
  alternative: “Ewoo m”
  rationale: Nhọrọ bụ isi na-echekwa ịdọ aka ná ntị banyere ọdachi ma ọ bụ ahụhụ, kama ịkọwa ya dịka naanị mwute mmetụta uche.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta, dee ya. “Ikwusa ozi ọma” bụ okwu ụka a maara nke ọma ma ka bụkwa okwu nkịtị doro anya. E tinyere akara [b] n’akụkụ nkebi okwu ọ na-akọwa, ya bụ okwu οὐαί, iji gbochie mgbagwoju anya.
