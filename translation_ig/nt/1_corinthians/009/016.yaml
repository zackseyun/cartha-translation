revisions:
- from: N’ihi na ọ bụrụ na m na-ekwusa ozi ọma[a], enweghị m ihe m ga-eji anya isi, n’ihi na mkpa ime ya dịkwasịrị m. Ahụhụ ga-adịrị m[b] ma ọ bụrụ na m ekwusaghị ozi ọma!
  to: N’ihi na ọ bụrụ na m na-ekwusa ozi ọma[a], enweghị m ihe m ga-eji anya isi; n’ihi na mmanye dịkwasịrị m. N’ihi na ewoo m[b] ma ọ bụrụ na m ekwusaghị ozi ọma!
  rationale: The revision restores the second explanatory conjunction, renders the imposed necessity with “mmanye,” and uses a present exclamation for οὐαί. It retains the established church-register term “ozi ọma,” avoids specifying the source of Paul’s obligation, and keeps both footnote anchors attached to the expressions they explain.
  reviewer_model: gpt-5.6-terra
