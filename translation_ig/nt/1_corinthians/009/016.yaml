review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys Paul’s lack of a basis for boasting and the conditional failure to proclaim the gospel. However, it omits the second γάρ (“for”), and “Ahụhụ ga-adịrị m” recasts the present idiomatic exclamation οὐαί ... μοί ἐστιν as a future prediction. “Mmanye dịkwasịrị m” more directly represents ἀνάγκη ... ἐπίκειται without making the unspecified necessity merely a need to perform an implied action.
  naturalness: The revised wording uses clear, modern Standard Igbo while retaining the solemn, apostolic register. “Ewoo m” functions naturally as an exclamation of woe, and “mmanye dịkwasịrị m” is intelligible and suitably preserves the image of an obligation resting upon Paul.
  terminology: “Ikwusa ozi ọma” is an appropriate, established rendering of εὐαγγελίζομαι and is retained consistently. “Ihe m ga-eji anya isi” adequately expresses a ground for boasting. “Mmanye” better expresses the imposed force of ἀνάγκη than the more neutral “mkpa.”
  issues:
  - severity: medium
    issue: The second γάρ is not represented in the main text.
    rationale: The Greek explicitly introduces the woe clause with γάρ. Igbo can represent this naturally with “N’ihi na,” retaining Paul’s explanatory/rhetorical linkage.
  - severity: medium
    issue: “Ahụhụ ga-adịrị m” changes οὐαί ... μοί ἐστιν into a future statement.
    rationale: The Greek is a present idiomatic exclamation, “woe to me,” rather than explicitly a prediction that suffering will come. “Ewoo m” preserves the exclamatory force and temporal openness.
  - severity: low
    issue: “mkpa ime ya” adds an implied object and somewhat weakens the sense of imposed compulsion.
    rationale: Although the object is clear from context, ἀνάγκη is more precisely an obligation/compulsion resting on Paul. “Mmanye dịkwasịrị m” retains the source ambiguity about its origin and nature.
  revised_text: N’ihi na ọ bụrụ na m na-ekwusa ozi ọma[a], enweghị m ihe m ga-eji anya isi; n’ihi na mmanye dịkwasịrị m. N’ihi na ewoo m[b] ma ọ bụrụ na m ekwusaghị ozi ọma!
  revised_footnotes:
  - marker: a
    text: A pụkwara ịtụgharị ya, “na-akpọsa ozi ọma”; otu a ka ọ dịkwa n’ebe okwu a pụtara ọzọ n’amaokwu a.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịtụgharị ya, “Ahụhụ ga-adịrị m.”
    reason: lexical_alternative
  revision_rationale: The revision restores the second explanatory conjunction, renders the imposed necessity with “mmanye,” and uses a present exclamation for οὐαί. It retains the established church-register term “ozi ọma,” avoids specifying the source of Paul’s obligation, and keeps both footnote anchors attached to the expressions they explain.
