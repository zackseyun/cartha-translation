reference: 1 Corinthians 9:13
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οὐκ οἴδατε ὅτι οἱ τὰ ἱερὰ ἐργαζόμενοι ⸀τὰ ἐκ τοῦ ἱεροῦ ἐσθίουσιν, οἱ τῷ θυσιαστηρίῳ ⸀παρεδρεύοντες τῷ θυσιαστηρίῳ συμμερίζονται;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/013.yaml
  text: Do you not know that those who work in the temple eat from the temple[b][a], and those who serve at the altar share in what is offered on the altar?
translation:
  language: ig
  text: Unu amaghị na ndị na-arụ ọrụ n’ihe ndị dị nsọ na-eri ihe sitere n’ụlọ nsọ[a], nakwa na ndị na-eje ozi n’ebe ịchụàjà na-enweta òkè n’àjà a na-achụ n’ebe ahụ[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị na-arụ ọrụ n’ụlọ nsọ.” Okwu Grik ahụ na-ekwu kpọmkwem banyere “ihe ndị dị nsọ.”
    reason: lexical_alternative
  - marker: b
    text: N’ụzọ ka kpọmkwem, “na-eso ebe ịchụàjà eketa òkè”; ya bụ, ha na-enweta akụkụ n’àjà ndị a na-achụ n’ebe ịchụàjà.
    reason: alternative_reading
lexical_decisions:
- source_word: οὐκ οἴδατε
  choice: Ọ̀ bụ na unu amaghị
  rationale: Nke a na-edobe ajụjụ nkwupụta Pọl ji eme ka ndị na-ege ya ntị cheta ihe ha kwesịrị ịma, ma bụrụkwa Igbo dị mfe nghọta.
- source_word: τὰ ἱερὰ ἐργαζόμενοι
  choice: ndị na-arụ ọrụ n’ihe dị nsọ
  rationale: Ọ na-edobe ntụaka kpọmkwem nke τὰ ἱερά, ‘ihe dị nsọ,’ kama ịkọwa ya naanị dị ka ịrụ ọrụ n’ụlọ nsọ.
- source_word: τὰ ἐκ τοῦ ἱεροῦ ἐσθίουσιν
  choice: na-eri ihe ndị si n’ụlọ nsọ
  rationale: Ọ na-egosipụta ma omume iri ihe ma ebe ihe ahụ si, dịka okwu Grik si kwuo.
- source_word: ἱεροῦ
  choice: ụlọ nsọ
  rationale: Nke a bụ okwu Igbo a na-ejikarị akọwa ụlọ nsọ ma ọ bụ ogige nsọ dum, kwekọọ na ἱερόν.
- source_word: παρεδρεύοντες
  choice: ndị na-eje ozi n’ebe
  rationale: Ọ na-egosipụta ịnọ n’akụkụ ebe ịchụàjà maka ọrụ, ọ bụghị naanị ịnọ nso ya.
- source_word: θυσιαστηρίῳ
  choice: ebe ịchụàjà
  rationale: Nke a bụ ntụgharị Igbo doro anya maka ebe a na-achụ àjà.
- source_word: συμμερίζονται
  choice: na-eso ... eketa òkè
  rationale: Ọ na-edobe echiche nke iketa òkè ọnụ, ma hapụ mmekọrịta ya na ebe ịchụàjà dịka e si kwuo ya na Grik.
theological_decisions:
- issue: Ihe atụ nke ọrụ nsọ na ihe ndị na-eje ozi na-enweta
  choice: E debere echiche na ndị na-arụ ọrụ n’ihe dị nsọ na-enweta nri ma ọ bụ òkè site n’ọrụ ahụ.
  alternative: A pụrụ ịkọwa nkebi ikpeazụ dịka ‘na-enweta òkè n’ihe a chụrụ n’ebe ịchụàjà.’
  rationale: Okwu ahụ na-akwado ụkpụrụ Pọl banyere nkwado ihe onwunwe sitere n’ozi nsọ, ma ntụgharị bụ isi anaghị etinye usoro ụka nke oge ọzọ n’ime amaokwu ahụ.
- issue: Mmekọrịta ndị na-eje ozi na ebe ịchụàjà
  choice: na-eso ebe ịchụàjà eketa òkè
  alternative: na-enweta òkè n’ihe a na-achụ n’ebe ịchụàjà
  rationale: Nhọrọ bụ isi na-edobe usoro okwu Grik na obere mgbagwoju anya ya; nkọwa ala peeji na-eme ka ihe ọ pụtara n’ọnọdụ àjà doo anya.
translation_notes:
  register: Standard Igbo; asụsụ dị ugwu ma dị mfe nghọta. E ji ‘ụlọ nsọ,’ ‘ihe dị nsọ,’ na ‘ebe ịchụàjà’ mee ka ihe atụ ofufe ochie pụta ìhè n’enweghị ịgbakwunye nkọwa ụka pụrụ iche.
