  source_fidelity: Nkebi mbụ na-anọchite anya τὰ ἱερὰ ἐργαζόμενοι na τὰ ἐκ τοῦ ἱεροῦ ἐσθίουσιν nke ọma. Ma, “na-eso ebe ịchụàjà eketa òkè” adịghị akọwa συμμερίζονται τῷ θυσιαστηρίῳ n’Igbo n’ụzọ doro anya; ọ pụrụ ịdị ka ebe ịchụàjà n’onwe ya na-eketa òkè. Ekwesịrị ikwu n’isi ederede na ndị ahụ na-enweta òkè n’àjà a chụrụ n’ebe ịchụàjà, ebe a na-edobe nkọwa nso n’ala peeji.
