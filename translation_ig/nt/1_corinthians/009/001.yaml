  to: Ọ̀ bụ na enweghị m nnwere onwe? Ọ̀ bụ na abụghị m onyeozi? Ọ̀ bụ na ahụbeghị m Jizọs Onyenwe anyị? Ọ̀ bụ na unu abụghị ọrụ m n'ime Onyenwe anyị?[a]
