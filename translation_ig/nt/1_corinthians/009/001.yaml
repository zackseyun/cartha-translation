    text: 'A pụkwara ịhazi okwu ahụ n''ụzọ Igbo dị mfe karịa, sị: “Onyenwe anyị Jizọs.”'
    reason: lexical_alternative
  revision_rationale: Only the rendering of ἐλεύθερος is revised. 'Nnwere onwe' is the unambiguous Standard Igbo expression for freedom/liberty and fits Paul's rhetorical claim. The negative rhetorical question, all other source elements, and the Greek-informed Jesus/Lord word-order footnote are retained.
