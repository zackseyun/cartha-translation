  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Οὐκ εἰμὶ ⸂ἐλεύθερος; οὐκ εἰμὶ ἀπόστολος⸃; οὐχὶ ⸀Ἰησοῦν τὸν κύριον ἡμῶν ἑόρακα; οὐ τὸ ἔργον μου ὑμεῖς ἐστε ἐν κυρίῳ;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/001.yaml
  text: Am I not free? Am I not an apostle? Have I not seen Jesus our Lord? Are you not my work in the Lord?[a]
translation:
  language: ig
  text: Ọ̀ bụ na enweghị m nnwere onwe? Ọ̀ bụ na abụghị m onyeozi? Ọ̀ bụ na ahụbeghị m Jizọs Onyenwe anyị? Ọ̀ bụ na unu abụghị ọrụ m n'ime Onyenwe anyị?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ịhazi okwu ahụ n''ụzọ Igbo dị mfe karịa, sị: “Onyenwe anyị Jizọs.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλεύθερος
  choice: nwere onwe m
  rationale: Nke a na-egosi nnwere onwe na ikike Pọl na-ekwu na o nwere; ọ bụkwa okwu Igbo doro anya ma kwekọọ na ihe gbara amaokwu a gburugburu.
- source_word: ἀπόστολος
  choice: onyeozi
  rationale: “Onyeozi” bụ okwu Ndị Kraịst ji eme ihe maka ọrụ pụrụ iche Pọl na-ekwu maka ya, ọ bụghị naanị onye bu ozi nkịtị.
- source_word: Ἰησοῦν τὸν κύριον ἡμῶν
  choice: Jizọs Onyenwe anyị
  rationale: Usoro a na-edobe Jizọs ụzọ dị ka n'asụsụ Grik, ma na-asụkwa Igbo n'ụzọ dị ùgwù na nke a na-aghọta.
- source_word: ἑόρακα
  choice: ahụbeghị m
  rationale: Ụdị ngwaa a na-egosi na Pọl ahụla Jizọs ma na ihe ahụ ọ hụrụ ka dị mkpa ugbu a; usoro “ahụbeghị m?” na-eburu nke a n'Igbo.
- source_word: ἔργον
  choice: ọrụ
  rationale: “Ọrụ” na-egosi na ndị Kọrịnt bụ mkpụrụ sitere n'ọrụ ozi Pọl, na-enweghị itinye nkọwa ọzọ n'ime amaokwu ahụ.
- source_word: ἐν κυρίῳ
  choice: n'ime Onyenwe anyị
  rationale: Nke a na-edobe okwu Pọl nke na-egosi ọnọdụ ma ọ bụ mmekọrịta ha nwere n'Onyenwe anyị, kama ịkọwa ya nke ukwuu.
- source_word: οὐκ / οὐχὶ / οὐ
  choice: Ọ̀ bụ na ...ghị ...?
  rationale: Ajụjụ ndị a bụ ajụjụ nkwupụta na-atụ anya azịza ee; usoro a bụ ụzọ Igbo nkịtị si egosipụta ya.
theological_decisions:
- issue: Ihe Pọl bu n'obi mgbe ọ sịrị na ọ hụrụ Jizọs
  choice: E debere ya dị ka nkwupụta dị mfe na Pọl ahụla Jizọs, nke na-akwado ịbụ onyeozi ya n'ọnọdụ amaokwu a.
  alternative: Ịkọwapụta ya kpọmkwem dị ka ịhụ Jizọs onye si n'ọnwụ bilie.
  rationale: Ọnọdụ okwu ahụ na-atụ aka n'ịhụ Jizọs onye si n'ọnwụ bilie, ma asụsụ Grik ekwughị “onye si n'ọnwụ bilie” kpọmkwem. Ya mere, nsụgharị ahụ anaghị etinye okwu ahụ n'amaokwu.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E debere usoro ajụjụ anọ Pọl ji arụ ụka, tinyere aha nsọ “Onyenwe anyị.”
