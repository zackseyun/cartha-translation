id: 1CO.9.5
reference: 1 Corinthians 9:5
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: μὴ οὐκ ἔχομεν ἐξουσίαν ἀδελφὴν γυναῖκα περιάγειν, ὡς καὶ οἱ λοιποὶ ἀπόστολοι καὶ οἱ ἀδελφοὶ τοῦ κυρίου καὶ Κηφᾶς;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/005.yaml
  text: Do we not have the right to take along a sister as a wife[a], as also the rest of the apostles and the brothers of the Lord and Cephas?
translation:
  language: ig
  text: Ànyị enweghị ikike ịkpọrọ nwunye bụ́ nwanna nwanyị n’okwukwe[a] soro anyị na-aga, dị ka ndịozi ndị ọzọ, ụmụnne nwoke nke Onyenwe anyị, na Kefa na-eme?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N'ụzọ nkịtị, “nwanna nwanyị, nwunye”—ya bụ, nwunye bụ́kwa onye otu okwukwe.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξουσίαν
  choice: ikike
  rationale: N'ebe a, okwu ahụ pụtara ikike ziri ezi Pọl na-ekwu na ndịozi nwere, ọ bụghị naanị ọchịchị n'ozuzu ya.
- source_word: ἀδελφὴν γυναῖκα
  choice: nwunye bụ́ nwanna nwanyị n’okwukwe
  rationale: 'Nke a na-egosi akụkụ abụọ nke okwu Grik: nwanyị ahụ bụ nwunye, bụrụkwa nwanna nwanyị n''okwukwe. Ọ na-ezere ime ka a ghọta ya dị ka naanị nwanyị kwere ekwe na-eso ha ejegharị.'
- source_word: περιάγειν
  choice: ịkpọrọ ... soro anyị na-aga
  rationale: N'ọnọdụ a, ọ pụtara ịkpọrọ onye ahụ soro mmadụ na njem ozi; nkebiokwu Igbo a bụ nke doro anya ma dịkwa eke.
- source_word: ὡς καὶ
  choice: dị ka ... na-eme
  rationale: Usoro a na-egosipụta ntụnyere ahụ nke ọma n'Igbo ma mee ka o doo anya na ihe ndị ọzọ a kpọrọ aha na-eme bụ ịkpọrọ nwunye ha.
- source_word: οἱ λοιποὶ ἀπόστολοι
  choice: ndịozi ndị ọzọ
  rationale: Nke a na-egosi ndị ọzọ nọ n'otu ìgwè ndịozi ahụ n'ụzọ dị mfe ma bụrụ Igbo a na-asụ ugbu a.
- source_word: οἱ ἀδελφοὶ τοῦ κυρίου
  choice: ụmụnne nwoke nke Onyenwe anyị
  rationale: A sụgharịrị okwu ahụ ozugbo, tinyekwa 'nwoke' iji gosipụta ụdị ọtụtụ nke nwoke dị na Grik, n'ebughị ụzọ kpebie kpọmkwem ụdị mmekọrịta ezinụlọ ha na Onyenwe anyị.
- source_word: Κηφᾶς
  choice: Kefa
  rationale: A hapụrụ aha ahụ n'ụdị Kefa kama iji Pita dochie ya, n'ihi na ọ bụ ụdị aha dị n'ihe odide Grik ebe a.
theological_decisions:
- issue: Ihe ‘ụmụnne nwoke nke Onyenwe anyị’ pụtara kpọmkwem
  choice: E debere ya dịka ‘ụmụnne nwoke nke Onyenwe anyị.’
  alternative: Ụmụnne Jizọs mụrụ n'otu nne; ụmụ nne ma ọ bụ nna ọzọ; ma ọ bụ ndị ikwu ya nso.
  rationale: Okwu Grik kpọrọ ha ụmụnne nwoke nke Onyenwe anyị, ma amaokwu ahụ n'onwe ya akọwaghị kpọmkwem ụdị njikọ ezinụlọ ahụ. Nsụgharị ahụ ekpebighị esemokwu ozizi a.
- issue: Uche dị na ἀδελφὴν γυναῖκα
  choice: nwunye bụ́ nwanna nwanyị n’okwukwe
  alternative: nwanna nwanyị dịka nwunye; nwunye kwere ekwe
  rationale: Nhọrọ a na-eme ka o doo anya na ọ bụ nwunye a na-ekwu maka ya, ma na-echekwa echiche nke ịbụ nwanna nwanyị n'okwukwe nke dị n'okwu Grik.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. Ajụjụ ‘Ànyị enweghị ikike...?’ na-atụ anya azịza nkwenye, dịka usoro ajụjụ Grik si dị. Akara nkọwa ala [a] dị n'ahịrị isi.
