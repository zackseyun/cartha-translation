    text: Ma ọ bụ, “dị ka mmadụ si eche” / “site n’echiche mmadụ.”
    reason: lexical_alternative
  revision_rationale: The revision corrects the interrogative syntax while preserving the Greek rhetorical structure, the contrastive ‘or,’ the plural demonstrative, the additive ‘also,’ and the negative question. The lexical alternative footnote remains appropriate and its anchor is retained.
