- from: Àna m ekwu ihe ndị a nanị site n'echiche mmadụ[a], ka Iwu ahụ adịghịkwa ekwu ihe ndị a?
  to: Ọ̀ bụ nanị n’echiche mmadụ ka m na-ekwu ihe ndị a, ka Iwu ahụ ọ̀ naghị ekwukwa ihe ndị a?[a]
  rationale: The revision corrects the interrogative syntax while preserving the Greek rhetorical structure, the contrastive ‘or,’ the plural demonstrative, the additive ‘also,’ and the negative question. The lexical alternative footnote remains appropriate and its anchor is retained.
