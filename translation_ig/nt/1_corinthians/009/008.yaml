  text: Μὴ κατὰ ἄνθρωπον ταῦτα λαλῶ ἢ ⸂καὶ ὁ νόμος ταῦτα οὐ⸃ λέγει;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/008.yaml
  text: Am I saying these things from a merely human perspective[a], or does not the Law also say these things?
translation:
  language: ig
  text: Ọ̀ bụ nanị n’echiche mmadụ ka m na-ekwu ihe ndị a, ka Iwu ahụ ọ̀ naghị ekwukwa ihe ndị a?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “dị ka mmadụ si eche” / “site n’echiche mmadụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ
  choice: Àna m ... nanị ...?
  rationale: Ajụjụ a na-atụ anya azịza na-adịghị mma. Nhazi ajụjụ Igbo na okwu “nanị” na-eme ka echiche ahụ doo anya n'ụzọ e ji asụ Igbo ugbu a.
- source_word: κατὰ ἄνθρωπον
  choice: nanị site n'echiche mmadụ
  rationale: Nkebiokwu a na-egosi echiche ma ọ bụ ihe ndabere nke mmadụ naanị, n'adịghị ka akaebe Akwụkwọ Nsọ; ọ bụghị naanị ikwu na Pọl bụ mmadụ.
- source_word: ταῦτα
  choice: ihe ndị a
  rationale: Nke a chekwara ọtụtụ ihe Greek ahụ ma na-ezo aka n'arụmụka Pọl kwuru tupu ebe a.
- source_word: λαλῶ
  choice: Àna m ekwu
  rationale: Oge ugbu a dabara n'okwu Pọl na-ekwu ugbu a, bụrụkwa ajụjụ e ji asụ Igbo n'ụzọ dị ndụ.
- source_word: ἢ
  choice: ka
  rationale: N'usoro ajụjụ Igbo, “ka” na-ewebata nhọrọ nke abụọ n'ụzọ okike.
- source_word: καὶ
  choice: kwa
  rationale: Mgbakwunye “kwa” na-egosi na Iwu ahụ bụkwa akaebe ọzọ.
- source_word: ὁ νόμος
  choice: Iwu ahụ
  rationale: Ọ na-ezo aka n'Iwu Mosis dị n'Akwụkwọ Nsọ, dịka ntụaka Deuterọnọmi 25:4 n'amaokwu na-esote gosiri; “ahụ” na-eme ka ntụaka a kapịrị ọnụ pụta ìhè n'Igbo.
- source_word: οὐ λέγει
  choice: adịghịkwa ekwu
  rationale: Nke a chekwara ụdị ajụjụ na-adịghị mma nke Greek, nke na-atụ anya nkwenye na Iwu ahụ na-ekwukwa otu ihe ahụ.
theological_decisions:
- issue: Ihe “Iwu ahụ” na-ezo aka na ya n'arụmụka Pọl
  choice: Iwu Mosis, ya bụ akụkụ iwu nke Akwụkwọ Nsọ
  alternative: iwu dịka ụkpụrụ n'ozuzu ya
  rationale: Amaokwu na-esote kpọrọ Deuterọnọmi 25:4 kpọmkwem. Ya mere, ntụaka a bụ Iwu dị n'Akwụkwọ Nsọ, ọ bụghị naanị ụkpụrụ iwu n'ozuzu.
translation_notes:
  register: Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E chekwara ajụjụ abụọ ahụ na nrụgide dị n'etiti echiche mmadụ na akaebe Iwu ahụ.
