id: 1CO.9.12
reference: 1 Corinthians 9:12
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἰ ἄλλοι τῆς ⸂ὑμῶν ἐξουσίας⸃ μετέχουσιν, οὐ μᾶλλον ἡμεῖς; Ἀλλ’ οὐκ ἐχρησάμεθα τῇ ἐξουσίᾳ ταύτῃ, ἀλλὰ πάντα στέγομεν ἵνα μή ⸂τινα ἐγκοπὴν⸃ δῶμεν τῷ εὐαγγελίῳ τοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/012.yaml
  text: If others share in this right over you[a], do not we even more? But we have not made use of this right; instead[b], we endure everything so that we may give no hindrance to the gospel of the Messiah.
translation:
  language: ig
  text: Ọ bụrụ na ndị ọzọ na-enwe òkè n'ikike a n'ebe unu nọ[a], ọ̀ bụ na anyị ekwesịghị inwe òkè na ya karịa? Ma anyị ejighị ikike a mee ihe; kama, anyị na-anagide ihe niile ka anyị ghara ịkpata ihe mgbochi ọ bụla nye ozi ọma nke Mezaịa ahụ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ihe ha nwere ike ịrịọ unu” ma ọ bụ “ikike a metụtara unu.” O yikarịrị ka okwu Grik a na-ekwu maka ikike ndịozi nwere ịnata nkwado ihe onwunwe n'aka ndị Kọrịnt.
    reason: lexical_alternative
  - marker: b
    text: N'ụzọ nkịtị, “ozi ọma nke Kraịst.” E ji “Mezaịa” mee ihe n'ebe a n'ihi na okwu Grik bụ Χριστός na-arụ ọrụ dị ka utu aha.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐξουσίας / ἐξουσίᾳ
  choice: ikike
  rationale: N'ebe a, okwu ahụ na-egosi ikike ziri ezi ndịozi nwere ịnata nkwado, ọ bụghị naanị ikike ịchị mmadụ. “Ikike” bụ okwu Igbo sara mbara nke na-ahapụkwa nghọta ahụ dị n'okwu Grik.
- source_word: τῆς ὑμῶν ἐξουσίας
  choice: ikike a n'ebe unu nọ
  rationale: Nke a na-egosi na ikike ahụ metụtara ndị Kọrịnt, na-ezere ịsụgharị ya dị ka a ga-asị na ọ bụ ha nwe ikike ahụ. Ihe ikike ahụ gụnyere kpọmkwem ka akọwara n'ihe odide ala peeji.
- source_word: μετέχουσιν
  choice: nwere oke n'ikike
  rationale: Nkebiokwu a na-egosi ikere òkè ma ọ bụ irite uru n'ikike ahụ n'Igbo dị mfe nghọta.
- source_word: οὐ μᾶλλον ἡμεῖς;
  choice: ọ̀ bụghị anyị kwesịrị inwe ya karịa?
  rationale: Nke a chekwara ajụjụ nkwuwa okwu na ntụnyere μᾶλλον, ma bụrụkwa okwu Igbo na-aga were were.
- source_word: ἐχρησάμεθα
  choice: anyị ejighị ... mee ihe
  rationale: Ọ na-egosi na ha ahọrọghị iji ikike ha nwere mee ihe.
- source_word: πάντα στέγομεν
  choice: anyị na-edi ihe niile
  rationale: N'ọnọdụ a, στέγομεν pụtara ịnagide ihe isi ike, ọ bụghị ikpuchi ihe.
- source_word: τινα ἐγκοπὴν
  choice: ihe mgbochi ọ bụla
  rationale: Nke a na-egosi ihe ọ bụla nwere ike igbochi mgbasa ozi ọma.
- source_word: δῶμεν
  choice: iweta
  rationale: N'okwu Igbo a, “iweta ihe mgbochi” na-egosipụta echiche nke ime ka ihe mgbochi bilie, nke bụ nzube nkebiokwu Grik.
- source_word: εὐαγγελίῳ
  choice: ozi ọma
  rationale: Nke a bụ okwu Igbo doro anya ma guzosie ike maka ozi ọma Chineke a na-ekwusa.
- source_word: Χριστοῦ
  choice: Mezaịa ahụ
  rationale: Χριστός na-arụ ọrụ dị ka utu aha n'ebe a; “Mezaịa” na-echekwa echiche nke Onye e tere mmanụ kama ime ka ọ bụrụ naanị aha mmadụ.
theological_decisions:
- issue: Nsụgharị Χριστοῦ
  choice: Mezaịa ahụ
  alternative: Kraịst
  rationale: Okwu ahụ bụ utu aha n'ebe a. “Mezaịa” na-eme ka ọrụ ya dị ka utu aha pụta ìhè, ebe ihe odide ala peeji na-edebe nsụgharị ọdịnala “Kraịst.”
- issue: Ihe ἐξουσία pụtara n'ebe a
  choice: ikike metụtara ndị Kọrịnt, nke gbadoro ụkwụ n'ịnata nkwado
  alternative: ikike ịchị ndị Kọrịnt
  rationale: Ọnọdụ okwu ndị gbara amaokwu a gburugburu na-ekwu maka ikike onyeozi ịnata ihe e ji ebi ndụ. Otú ọ dị, isi okwu ahụ anaghị etinye “nkwado” ozugbo, ya mere e debere nkọwa ahụ n'ihe odide ala peeji iji ghara imechi obosara okwu Grik.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta mee ihe. A hapụrụ “ikike a n'ebe unu nọ” ntakịrị obosara dịka okwu Grik si dị, ebe ihe odide ala peeji kọwara na ọ gbasara nkwado ihe onwunwe. E chekwara ajụjụ nkwuwa okwu Pọl na ọdịiche dị n'etiti ikike o nwere na mkpebi ya ịghara iji ya.
