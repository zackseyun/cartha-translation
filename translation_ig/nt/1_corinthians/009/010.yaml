id: 1CO.9.10
reference: 1 Corinthians 9:10
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἢ δι’ ἡμᾶς πάντως λέγει; δι’ ἡμᾶς γὰρ ἐγράφη, ὅτι ⸂ὀφείλει ἐπ’ ἐλπίδι⸃ ὁ ἀροτριῶν ἀροτριᾶν, καὶ ὁ ἀλοῶν ⸂ἐπ’ ἐλπίδι τοῦ μετέχειν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/010.yaml
  text: Or is he speaking entirely for our sake? Yes[a], it was written for our sake, because the one who plows ought to plow in hope[b], and the one who threshes ought to thresh in hope of sharing.
translation:
  language: ig
  text: Ka ọ̀ bụ na ọ na-ekwu nke a n’ezie maka anyị? N’ezie, e dere ya maka anyị, n’ihi na onye na-akọ ubi kwesịrị ịkọ ubi n’olileanya, onye na-azọcha ọka kwesịkwara ịzọcha ọka n’olileanya inweta òkè.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’ụzọ okwu Grik si dị kpọmkwem, akụkụ ikpeazụ ahụ bụ “n’olileanya isonye” ma ọ bụ “n’olileanya inweta òkè.” A kpọghị ihe a ga-eketa aha; ọnọdụ ọrụ ugbo na-eme ka a ghọta ya.
    reason: implicit_object
lexical_decisions:
- source_word: πάντως
  choice: naanị
  rationale: N’ajụjụ a, “naanị” na-egosipụta echiche nke “kpamkpam/maka anyị niile,” ma ndetu [a] na-edobe ohere na okwu Grik ahụ nwekwara ike ịbụ nkwusikwu dị ka “n’ezie” ma ọ bụ “ọ ghaghị ịbụ.”
- source_word: δι’ ἡμᾶς
  choice: maka anyị
  rationale: Nke a na-egosi uru ma ọ bụ ebumnuche okwu ahụ nwere n’ebe anyị nọ, n’ụzọ Igbo dị mfe ma kwekọọ n’arụmụka Pọl.
- source_word: ἐγράφη
  choice: e dere ya
  rationale: Ọ bụ ntụgharị nkịtị na nke doro anya nke aorist passive, ma dabara n’usoro e si atụ aka n’Akwụkwọ Nsọ n’Igbo.
- source_word: ὀφείλει
  choice: kwesịrị
  rationale: “Kwesịrị” na-edobe echiche nke ihe ziri ezi ma ọ bụ ọrụ dịịrị onye ahụ, n’etinyeghị mmanye karịrị nke okwu Grik kwuru.
- source_word: ἐπ’ ἐλπίδι
  choice: n’olileanya
  rationale: Nke a na-egosi olileanya ma ọ bụ atụmanya na-akpali ọrụ ahụ, ma na-eme ka nkwugharị dị na nkebi abụọ ahụ pụta ìhè.
- source_word: ὁ ἀροτριῶν ἀροτριᾶν
  choice: onye na-akọ ubi kwesịrị ịkọ ya
  rationale: Nke a bụ okwu izugbe maka onye ọrụ ugbo; ọ na-edobe omume ịkọ ubi na nhazi okwu Grik n’asụsụ Igbo dị ndụ.
- source_word: ὁ ἀλοῶν
  choice: onye na-azọcha ọka
  rationale: “Ịzọcha ọka” bụ ụzọ doro anya e si kọwaa ọrụ ikewapụ mkpụrụ n’ebe ahịhịa ya dị, ma na-edobe myirịta ya na onye na-akọ ubi.
- source_word: τοῦ μετέχειν
  choice: na ya ga-eso keta oke
  rationale: Nke a na-egosi isonye ma ọ bụ inweta òkè, ma anaghị etinye “owuwe ihe ubi” n’ahịrị n’onwe ya ebe ọ bụ na Grik akpọghị ihe a ga-eketa aha.
theological_decisions:
- issue: Ihe a na-eketa na τοῦ μετέχειν
  choice: E hapụrụ ihe a ga-eketa n’aha, sị naanị “ga-eso keta oke.”
  alternative: “ga-eso keta oke n’ihe ubi” ma ọ bụ “ga-enweta òkè n’owuwe ihe ubi.”
  rationale: Ọnọdụ ọrụ ugbo na-eme ka ihe a na-atụ anya ya doo anya, ma ihe odide Grik akpọghị ihe ahụ aha. Ịhapụ ya otu a na-edobe nkọwa ahụ n’emegheghị ya karịa isi mmalite.
- issue: Ike πάντως n’ajụjụ ahụ
  choice: “naanị” n’ahịrị, tinyere nkọwa ụzọ ndị ọzọ na ndetu ala peeji.
  alternative: “n’ezie,” “kpamkpam,” ma ọ bụ “ọ ghaghị ịbụ.”
  rationale: Okwu ahụ nwere ike ime ka echiche “maka anyị niile/naanị maka anyị” sie ike, ma ọ nwekwara ike ịbụ nkwusikwu nke ajụjụ arụmụka. Ndetu ahụ na-echekwa mgbagwoju anya a.
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E debere myirịta dị n’etiti onye na-akọ ubi na onye na-azọcha ọka, ma zere ịgbakwunye “owuwe ihe ubi” n’ahịrị ebe isi mmalite hapụrụ ihe a na-eketa n’aha.
