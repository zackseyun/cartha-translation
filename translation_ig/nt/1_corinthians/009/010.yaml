revisions:
- from: Ka ọ̀ bụ na ọ bụ naanị maka anyị ka ọ na-ekwu ya?[a] N’ezie, e dere ya maka anyị, n’ihi na onye na-akọ ubi kwesịrị ịkọ ya n’olileanya, onye na-azọcha ọka kwesịkwara ịzọcha ya n’olileanya na ya ga-eso keta oke.[b]
  to: Ka ọ̀ bụ na ọ na-ekwu nke a n’ezie maka anyị? N’ezie, e dere ya maka anyị, n’ihi na onye na-akọ ubi kwesịrị ịkọ ubi n’olileanya, onye na-azọcha ọka kwesịkwara ịzọcha ọka n’olileanya inweta òkè.[a]
  rationale: The revised wording renders πάντως as rhetorical emphasis rather than exclusivity, removes an object pronoun not found in the source, and retains the unstated object of μετέχειν. The repeated agricultural verbs and the implied obligation in the coordinated threshing clause are preserved in natural Standard Igbo. The former footnote on πάντως is no longer needed because the revised text does not select a disputed restrictive sense; the remaining note documents the implicit object of μετέχειν.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T18:12:02Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the benefactive force of δι’ ἡμᾶς, the passive ἐγράφη, and the repeated idea of labor performed in hope. However, “naanị” (“only”) makes πάντως sound exclusively restrictive, whereas the adverb here intensifies the rhetorical question (“certainly/altogether”). The object pronoun in “ịkọ ya” is not present in the Greek, and “na ya ga-eso keta oke” introduces a referential pronoun where the Greek leaves the object of μετέχειν unstated.
  naturalness: “Onye na-akọ ubi kwesịrị ịkọ ubi” and the parallel threshing clause are clear, idiomatic Standard Igbo. “N’olileanya inweta òkè” naturally expresses the expected participation/share without forcing an unstated object.
  terminology: “Ịkọ ubi,” “ịzọcha ọka,” “olileanya,” and “inweta òkè” are suitable modern Standard Igbo terms. The revision retains the agricultural imagery and avoids importing “the harvest” or another specific object.
  issues:
  - severity: medium
    issue: The rendering “naanị” for πάντως is overly exclusive.
    rationale: πάντως intensifies the question; it does not mean that God speaks only for Paul and his associates. “N’ezie” gives the rhetorical-certainty force without adding exclusivity.
  - severity: medium
    issue: “Ịkọ ya” supplies an unsupported object pronoun.
    rationale: The Greek says simply that the plower ought to plow. Repeating “ubi” is idiomatic in Igbo and avoids suggesting a specific antecedent absent from the source.
  - severity: low
    issue: “Na ya ga-eso keta oke” gives the implicit object a pronoun-like referent.
    rationale: μετέχειν has no stated object. “Inweta òkè” preserves the open-ended expression while remaining natural in Igbo.
  revised_text: Ka ọ̀ bụ na ọ na-ekwu nke a n’ezie maka anyị? N’ezie, e dere ya maka anyị, n’ihi na onye na-akọ ubi kwesịrị ịkọ ubi n’olileanya, onye na-azọcha ọka kwesịkwara ịzọcha ọka n’olileanya inweta òkè.[a]
  revised_footnotes:
  - marker: a
    text: N’ụzọ okwu Grik si dị kpọmkwem, akụkụ ikpeazụ ahụ bụ “n’olileanya isonye” ma ọ bụ “n’olileanya inweta òkè.” A kpọghị ihe a ga-eketa aha; ọnọdụ ọrụ ugbo na-eme ka a ghọta ya.
    reason: implicit_object
