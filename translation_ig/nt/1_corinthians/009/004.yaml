  text: μὴ οὐκ ἔχομεν ἐξουσίαν φαγεῖν καὶ ⸀πεῖν;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/004.yaml
  text: Do we not have the right to eat and drink?[a]
translation:
  language: ig
  text: Ọ̀ bụ na anyị enweghị ikike iri ihe na ịṅụ ihe?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μὴ οὐκ
  choice: Ọ̀ bụ na ... enweghị
  rationale: Ụdị ajụjụ a na-atụ anya azịza nkwenye; nsụgharị a na-edobe ya dị ka ajụjụ nkwughachi n'Igbo nke pụtara na n'ezie ha nwere ikike ahụ.
- source_word: ἔχομεν
  choice: anyị ... nwere
  rationale: Nke a bụ ụzọ Igbo kwụ ọtọ na nke ebumpụta ụwa isi kwuo inwe ihe ugbu a.
- source_word: ἐξουσίαν
  choice: ikike
  rationale: N'ebe a okwu ahụ na-egosi ikike ziri ezi ma ọ bụ nnwere onwe ndị ozi nwere, ọ bụghị naanị ike ịchị ndị ọzọ.
- source_word: φαγεῖν
  choice: iri ihe
  rationale: Nke a na-egosipụta omume iri nri n'ụzọ doro anya ma dị mma n'Igbo.
- source_word: καὶ πεῖν
  choice: na ịṅụ ihe
  rationale: A na-edobe njikọ omume abụọ ahụ, iri na ịṅụ, n'ụdị Igbo dị mfe ma doo anya.
theological_decisions:
- issue: Oke ikike ndị ozi a na-ekwu maka ya n'okwu gbara amaokwu ahụ gburugburu
  choice: E debere ya dị ka “ikike iri ihe na ịṅụ ihe,” nke na-ekwe ka okwu gbara ya gburugburu gosi na ọ metụtara nkwado ihe onwunwe ndị ọrụ ozi nwere ike ịnata.
  alternative: Ịghọta ya naanị dị ka nnwere onwe mmadụ niile nwere iri na ịṅụ.
  rationale: 1 Ndị Kọrịnt 9 na-ekwu maka ikike Pọl na ndị ozi ndị ọzọ nwere, karịchaa ikike ịnata nkwado. Ma e tinyeghị “ịnata nkwado” n'ahịrị bụ isi ka a ghara ime ka ihe Grik kwuru bụrụ nke kpọmkwem karịa ka ọ dị.
translation_notes:
  register: Standard Igbo; asụsụ dị ugbu a, dị ùgwù, ma dị mfe nghọta. Ajụjụ nkwughachi ahụ na-edobe ike okwu Grik, ebe “ikike” na-ahapụ ọdịiche dị n'etiti ikike, nnwere onwe, na ihe ziri ezi mmadụ nwere ịnata.
