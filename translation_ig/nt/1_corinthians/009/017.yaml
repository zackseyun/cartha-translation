id: 1CO.9.17
reference: 1 Corinthians 9:17
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἰ γὰρ ἑκὼν τοῦτο πράσσω, μισθὸν ἔχω· εἰ δὲ ἄκων, οἰκονομίαν πεπίστευμαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/017.yaml
  text: For if I do this willingly[a], I have a reward; but if unwillingly, I have been entrusted with a stewardship.
translation:
  language: ig
  text: N’ihi na ọ bụrụ na m ji obi m mee nke a, enwere m ụgwọ ọrụ; ma ọ bụrụ na m mee ya n’achọghị, e nyefewo m ọrụ nlekọta[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “e nyefewo m ọrụ m ga-arụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑκὼν
  choice: ji obi m
  rationale: N’ebe a, okwu a na-egosi ime ihe n’ụzọ mmadụ ji aka ya họrọ ma jiri ọchịchọ obi mee ya. Nhọrọ a bụ Igbo dị mfe ma na-edobe ọdịiche ya na ἄκων.
- source_word: τοῦτο πράσσω
  choice: mee nke a
  rationale: Nke a na-ezo aka n’ọrụ izisa ozi ọma a na-ekwu banyere ya n’amaokwu ndị gbara ya gburugburu, ma ọ naghị akọwa ya karịa otú Grik si kọwaa ya.
- source_word: μισθὸν
  choice: ụgwọ ọrụ
  rationale: μισθός nwere ike ịpụta ụgwọ a na-akwụ ma ọ bụ ihe nkwụghachi. “Ụgwọ ọrụ” na-edobe ohere nghọta abụọ ahụ n’Igbo.
- source_word: ἄκων
  choice: mee ya n’achọghị
  rationale: Nke a na-egosi ime ihe n’enweghị ọchịchọ ime ya, ma na-edobe ọdịiche kpọmkwem dị n’etiti ἄκων na ἑκών n’etinyeghị echiche siri ike dịka iwe ma ọ bụ nnupụisi.
- source_word: οἰκονομίαν
  choice: ọrụ nlekọta
  rationale: Okwu a na-egosi ibu ọrụ nke e nyere mmadụ ka ọ na-elekọta. “Ọrụ nlekọta” na-edobe echiche nke ịbụ onye e nyefere ihe n’aka karịa ịkpọ ya naanị ọrụ.
- source_word: πεπίστευμαι
  choice: e nyefewo m
  rationale: Perfect passive a na-egosi na e nyefere Pọl ibu ọrụ a nakwa na ọ ka nọ n’ọnọdụ onye e nyere ya n’aka. “E nyefewo m” na-egosipụta ma omume e mere ma ọnọdụ ya na-adịgide.
theological_decisions:
- issue: Ụdị ọrụ Pọl na nkebi nke abụọ
  choice: Ọ bụrụgodị na Pọl anaghị eji obi ya eme ya, ọ ka bụ onye e nyefere ọrụ nlekọta n’aka.
  alternative: A pụrụ ịghọta ya dịka na mgbe ọ na-eme ya n’achọghị, ihe o nwere bụ naanị ọrụ a manyere ya ịrụ, ọ bụghị ụgwọ ọrụ.
  rationale: Grik na-eme ka “enwere m ụgwọ ọrụ” dị iche na “e nyefewo m ọrụ nlekọta.” Nsụgharị a na-edobe esemokwu dị n’etiti ọrụ e ji obi mee na ibu ọrụ e nyere mmadụ, na-enweghị ikpebi ozizi ụka pụrụ iche banyere ọkpụkpọ ma ọ bụ ọrụ ndị ozi.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. “Ji obi m” na “n’achọghị” na-enye ọdịiche doro anya ma dịkwa eke; “ọrụ nlekọta” na-edobe ihe atụ nke ọrụ e nyere mmadụ n’aka.
