revisions:
- from: N’ebe ndị na-anọghị n’okpuru Iwu ahụ nọ, adị m ka onye na-anọghị n’okpuru Iwu ahụ[a]—ọ bụ ezie na anọghị m n’èzí iwu Chineke, kama anọ m n’okpuru iwu Mesaịa[b]—ka m wee nweta ndị na-anọghị n’okpuru Iwu ahụ.
  to: Nye ndị na-anọghị n’okpuru Iwu ahụ, emere m onwe m ka onye na-anọghị n’okpuru Iwu ahụ[a]—ọ bụ ezie na anọghị m n’èzí iwu Chineke kama anọ m n’okpuru iwu Mesaịa[b]—ka m wee rite ndị na-anọghị n’okpuru Iwu ahụ.
  rationale: The correction improves idiomatic Standard Igbo and represents Paul’s contextual adaptive action more faithfully. It preserves the source’s legal/covenantal contrast, its ambiguity concerning the exact scope of “Messiah’s law,” and all original footnote anchors.
