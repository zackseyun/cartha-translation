id: 1CO.9.21
reference: 1 Corinthians 9:21
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τοῖς ἀνόμοις ὡς ἄνομος, μὴ ὢν ἄνομος ⸀θεοῦ ἀλλ’ ἔννομος ⸀Χριστοῦ, ἵνα ⸀κερδάνω ⸀τοὺς ἀνόμους·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/021.yaml
  text: To those outside the law[b][a], as one outside the law—though not being outside God’s law but under Messiah’s law—so that I might win those outside the law.
translation:
  language: ig
  text: Nye ndị na-anọghị n’okpuru Iwu ahụ, emere m onwe m ka onye na-anọghị n’okpuru Iwu ahụ[a]—ọ bụ ezie na anọghị m n’èzí iwu Chineke kama anọ m n’okpuru iwu Mesaịa[b]—ka m wee rite ndị na-anọghị n’okpuru Iwu ahụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “dị ka onye na-enweghị Iwu ahụ.” N’ebe a, okwu ahụ na-ezo aka ná ndị na-anọghị n’okpuru Iwu Mosis; ọ pụtaghị na ha bụrịrị ndị na-enweghị ụkpụrụ omume.
    reason: lexical_alternative
  - marker: b
    text: N’ụzọ nkịtị, “ma m nọ n’ime iwu Mesaịa”; a pụkwara ịsị, “ma anọ m n’okpuru iwu Mesaịa.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνόμοις / ἄνομος / ἀνόμους
  choice: ndị na-anọghị n’okpuru Iwu ahụ / onye na-anọghị n’okpuru Iwu ahụ
  rationale: N’ọnọdụ a, okwu ahụ na-ezo aka ná ndị na-anọghị n’okpuru Iwu Mosis, ọ bụghị nanị ndị ajọ omume ma ọ bụ ndị na-enweghị iwu omume. Ntụgharị a na-edobe ugboro atọ e kwughachiri echiche ahụ ma na-ezere nghọtahie nke ‘ndị na-emebi iwu.’
- source_word: ὡς
  choice: ka
  rationale: Ọ na-egosi otú Pọl si eme onwe ya ka ọ dabara n’ọnọdụ ha, n’agbanyeghị na ọ bụghị onye na-enweghị ibu ọrụ n’ebe Chineke nọ.
- source_word: μὴ ὢν
  choice: ọ bụ ezie na anọghị m
  rationale: Nkebi participle a nwere ike nkwenye na-emegide ihe e kwuru tupu ya; ‘ọ bụ ezie na’ na-egosipụta nke ahụ n’Igbo doro anya.
- source_word: θεοῦ
  choice: Chineke
  rationale: E jiri usoro genitive Igbo ‘iwu Chineke’ gosipụta ihe Grik pụtara.
- source_word: ἔννομος
  choice: anọ m n’okpuru iwu
  rationale: Nke a na-egosi ịnọ n’ime ikike iwu ma ọ bụ ido onwe onye n’okpuru ya, ma na-emegide ‘ịnọghị n’okpuru Iwu ahụ’ n'ụzọ doro anya.
- source_word: Χριστοῦ
  choice: Mesaịa
  rationale: N’ebe a Χριστός na-arụ ọrụ dị ka utu aha; ‘Mesaịa’ na-edobe echiche nke Onye E Tere Mmanụ.
- source_word: ἵνα
  choice: ka ... wee
  rationale: Usoro Igbo a na-egosi ebumnuche nke ọma.
- source_word: κερδάνω
  choice: m wee nweta
  rationale: N’ọnọdụ ozi ọma a, okwu ahụ pụtara imeta mmadụ ma ọ bụ irite ya nye ozi ọma, ọ bụghị uru ego; ‘nweta’ na-edobe ihe atụ ahụ n’ụzọ dị nkenke.
theological_decisions:
- issue: Ihe ἄνομος pụtara n’ebe a
  choice: Ndị na-anọghị n’okpuru Iwu Mosis, karịsịa ndị mba ọzọ
  alternative: Ndị na-enweghị iwu ma ọ bụ ndị ajọ omume
  rationale: Amaokwu gbara ya gburugburu na-ekewapụta ndị Juu/n ndị nọ n’okpuru Iwu ahụ na ndị na-anọghị n’okpuru ya. Nkọwa Pọl banyere iwu Chineke na iwu Mesaịa na-egosi na ọ naghị ekwu na ọ ghọrọ onye na-enweghị ụkpụrụ omume.
- issue: Ike okwu ἔννομος Χριστοῦ
  choice: ịnọ n’okpuru iwu Mesaịa
  alternative: ịnọ n’ime iwu Mesaịa / ịnọ n’ime iwu nye Mesaịa
  rationale: Ntụgharị a na-egosi na Pọl ka nọ n’okpuru ọchịchọ Chineke dịka e si metụta ya na Mesaịa, ma ghara ikpebi karịa ihe Grik kwuru banyere kpọmkwem ọdịdị ‘iwu Mesaịa.’
- issue: Ntụgharị Χριστοῦ
  choice: Mesaịa
  alternative: Kraịst
  rationale: Ebe a okwu ahụ na-arụ ọrụ dịka utu aha n’ahịrịokwu ‘iwu Mesaịa,’ ya mere ‘Mesaịa’ na-eme ka ọrụ utu aha ahụ pụta ìhè.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji ‘Iwu ahụ’ nwere mkpụrụedemede ukwu mata Iwu Mosis n’ebe ọ pụtara, ebe ‘iwu Chineke’ na ‘iwu Mesaịa’ nọgide n’obere mkpụrụedemede dịka nkebi genitive. E debere nkwughachi okwu isi nke Grik kama iwepụ ya.
