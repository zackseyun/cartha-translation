review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately renders the spiritual/material contrast and the agricultural image of sowing. However, “anyị esite n’aka unu wee ghọrọ ihe anụ ahụ” is grammatically and semantically unsuitable for θερίσομεν: the future sense is not clear, and “ihe anụ ahụ” can suggest physical flesh rather than practical material provision.'
  naturalness: The proposed revision is idiomatic Standard Igbo, retains Paul’s rhetorical question and sowing/harvesting metaphor, and expresses expected support clearly.
  terminology: “Ihe ime mmụọ” appropriately preserves τὰ πνευματικά. “Ihe onwunwe” appropriately renders τὰ σαρκικά in this context as material provision, without importing the negative moral sense often associated with “anụ ahụ.”
  issues:
  - severity: high
    issue: The rendering of θερίσομεν as “anyị esite n’aka unu wee ghọrọ” is unclear and does not reliably express the Greek future ‘we will reap.’
    rationale: θερίσομεν continues the sowing/reaping metaphor and is future in form. “anyị ga-aghọrọ” directly and naturally preserves both features.
  - severity: medium
    issue: “Ihe anụ ahụ” is too liable to be understood as bodily or fleshly matters rather than material support.
    rationale: In this context τὰ σαρκικά denotes temporal, bodily, or material provision. “Ihe onwunwe” conveys the intended practical sense naturally in Igbo.
  revised_text: Ọ bụrụ na anyị kụrụ ihe ime mmụọ n’etiti unu, ọ̀ bụ ihe dị ukwuu ma anyị ga-aghọrọ ihe onwunwe[a] n’aka unu?
  revised_footnotes:
