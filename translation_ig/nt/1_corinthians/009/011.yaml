- from: Ọ bụrụ na anyị kụrụ ihe ime mmụọ n’etiti unu, ọ̀ bụ ihe karịrị akarị ma ọ bụrụ na anyị esite n’aka unu wee ghọrọ ihe anụ ahụ?[a]
  to: Ọ bụrụ na anyị kụrụ ihe ime mmụọ n’etiti unu, ọ̀ bụ ihe dị ukwuu ma anyị ga-aghọrọ ihe onwunwe[a] n’aka unu?
  rationale: The revision corrects the future harvesting verb, preserves the Greek agricultural metaphor, and uses “ihe onwunwe” for the material support intended by τὰ σαρκικά. The footnote retains the broader bodily/earthly lexical sense without suggesting sinful ‘fleshly’ conduct.
  reviewer_model: gpt-5.6-terra
