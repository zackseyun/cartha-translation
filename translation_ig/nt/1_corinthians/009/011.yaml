    text: A pụkwara ịsụgharị ya, “ihe ndị metụtara ndụ anụ ahụ” ma ọ bụ “ihe a na-ahụ anya.” Okwu Grik ahụ na-atụnyere ihe ndị a na-enye maka mkpa ndụ na “ihe ime mmụọ.”
    reason: lexical_alternative
  revision_rationale: The revision corrects the future harvesting verb, preserves the Greek agricultural metaphor, and uses “ihe onwunwe” for the material support intended by τὰ σαρκικά. The footnote retains the broader bodily/earthly lexical sense without suggesting sinful ‘fleshly’ conduct.
