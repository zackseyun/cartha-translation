id: 1CO.9.11
reference: 1 Corinthians 9:11
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἰ ἡμεῖς ὑμῖν τὰ πνευματικὰ ἐσπείραμεν, μέγα εἰ ἡμεῖς ὑμῶν τὰ σαρκικὰ θερίσομεν;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/011.yaml
  text: If we have sown spiritual things among you[a], is it too much if we reap material things from you?
translation:
  language: ig
  text: Ọ bụrụ na anyị kụrụ ihe ime mmụọ n’etiti unu, ọ̀ bụ ihe dị ukwuu ma anyị ga-aghọrọ ihe onwunwe[a] n’aka unu?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ihe ndị metụtara ndụ anụ ahụ” ma ọ bụ “ihe a na-ahụ anya.” Okwu Grik ahụ na-atụnyere ihe ndị a na-enye maka mkpa ndụ na “ihe ime mmụọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ πνευματικὰ
  choice: ihe ime mmụọ
  rationale: Nkebiokwu a na-edobe obosara nke adjective neuter plural e ji dị ka noun, na-ezo aka n’uru ma ọ bụ ozi ime mmụọ n’enweghị ime ka ihe ọ pụtara dị warara.
- source_word: ἐσπείραμεν
  choice: anyị kụrụ
  rationale: Nke a na-edobe ihe atụ ọrụ ugbo nke ịkụ mkpụrụ ma na-egosi ozi Pọl na ndị ọrụ ibe ya rụrụla n’etiti ndị Kọrịnt.
- source_word: μέγα
  choice: ihe karịrị akarị
  rationale: N’ajụjụ a na-ajụ iji mee ka mmadụ chee echiche, okwu ahụ pụtara ihe gabigara ókè ma ọ bụ arịrịọ na-enweghị ezi uche.
- source_word: τὰ σαρκικὰ
  choice: ihe anụ ahụ
  rationale: N’ebe a, okwu ahụ na-ezo aka n’ihe ndị metụtara ndụ anụ ahụ na nkwado a na-ahụ anya, ọ bụghị omume mmehie. Nsụgharị a na-edobe ọdịiche okwu Grik dị n’etiti ihe ime mmụọ na ihe anụ ahụ.
- source_word: θερίσομεν
  choice: anyị ... wee ghọrọ
  rationale: Okwu a na-aga n’ihu n’ihe atụ ịkụ mkpụrụ na owuwe ihe ubi, ma na-eburu echiche ọdịnihu nke ngwaa Grik.
- source_word: ὑμῶν
  choice: esite n’aka unu
  rationale: Nke a na-egosipụta ndị Kọrịnt dị ka isi ebe nkwado ahụ ga-esi bịa, n’Igbo nkịtị ma doo anya.
- source_word: ἡμεῖς
  choice: anyị
  rationale: Nnọchiaha a na-edobe nrụgide dị na Grik n’ebe ndị kụrụ ihe ime mmụọ nọ ma e jiri ha tụnyere ndị ha ga-anata nkwado n’aka ha.
theological_decisions:
- issue: Ihe τὰ σαρκικὰ pụtara mgbe e jiri ya tụnyere τὰ πνευματικὰ
  choice: Ihe ndị metụtara ndụ anụ ahụ ma ọ bụ nkwado a na-ahụ anya maka ndị na-eje ozi
  alternative: Ihe nke anụ ahụ n’echiche omume mmehie
  rationale: Ihe gbara amaokwu a gburugburu bụ ịkwado ikike ndị ozi nwere ịnata ihe e ji elekọta ndụ ha. Ya mere, ọdịiche ahụ abụghị n’etiti ịdị nsọ na mmehie, kama ọ bụ n’etiti ozi ime mmụọ na nkwado anụ ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta mee ya. E debere ihe atụ ịkụ mkpụrụ na owuwe ihe ubi, yana ajụjụ Pọl ji egosi na ịnata nkwado ahụ abụghị arịrịọ gabigara ókè.
