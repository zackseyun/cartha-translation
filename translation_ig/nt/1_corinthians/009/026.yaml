base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/026.yaml
  text: 'So then[a], I run in this way: not aimlessly; in this way I box: not beating the air.'
translation:
  language: ig
  text: 'N’ihi ya, otu a ka m si agba ọsọ: ọ bụghị n’enweghị ntụziaka; otu a ka m si akụ ọkpọ: ọ bụghị na m na-akụ ikuku.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοίνυν
  choice: N’ihi ya
  rationale: Ọ na-egosi nkwubi okwu Pọl wepụtara site n’ihe atụ egwuregwu ndị bu ụzọ, n’asụsụ Igbo doro anya.
- source_word: οὕτως
  choice: otu a ka m si
  rationale: E debere nkwugharị ya ugboro abụọ iji mesie ụzọ Pọl si eme ihe abụọ ahụ ike.
- source_word: τρέχω
  choice: agba ọsọ
  rationale: Ọ na-edobe ihe atụ asọmpi ịgba ọsọ na ụdị okwu na-egosi ihe onye ahụ na-eme.
- source_word: ἀδήλως
  choice: n’enweghị ebe m na-aga
  rationale: N’ihe atụ ịgba ọsọ, okwu a na-egosi ịgba ọsọ n’enweghị ebe a kapịrị ọnụ a na-agba aga; ntụgharị a bụ nke ndị nkịtị ga-aghọta ngwa ngwa.
- source_word: πυκτεύω
  choice: akụ ọkpọ
  rationale: Okwu Grik ahụ na-ekwu kpọmkwem banyere egwuregwu ịkụ ọkpọ, ọ bụghị ọgụ n’ozuzu ya.
- source_word: ἀέρα
  choice: ikuku
  rationale: Nke a bụ ihe a na-akụ n’ihe oyiyi Grik ahụ, na-egosi iti ihe na-erughị onye a chọrọ iti.
- source_word: δέρων
  choice: na-akụ
  rationale: Ọ na-egosi ụdị iti ahụ ka ihe na-aga n’ihu ma na-edobe ihe oyiyi nke ịkụ ikuku.
theological_decisions: []
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E debere ihe atụ abụọ nke egwuregwu—ịgba ọsọ na ịkụ ọkpọ—yana nhazi okwu a kwughachiri ugboro abụọ n’amaokwu Grik.
