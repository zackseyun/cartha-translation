review_pass:
  verdict: revise
  source_fidelity: Ahịrịokwu mbụ na-asụgharị πᾶς ... πάντα ἐγκρατεύεται nke ọma. Otú ọ dị, akụkụ ikpeazụ, “ma anyị, nke na-adịghị emebi emebi,” enweghị ngwaa ma na-eme ka ellipsis Grik ghara ịdị ụtọ n’Igbo. Ikwupụta ngwaa a ghọtara—“anyị ga-anata”—na-echekwa ihe pụtara λάβωσιν na ọdịiche μὲν ... δέ n’enweghị itinye nkọwa ozizi ọzọ.
  naturalness: “Onye ọ bụla na-asọ mpi na-ejide onwe ya n’ihe niile” bụ Igbo Izugbe doro anya. A chọrọ imeju akụkụ ikpeazụ ka ọ bụrụ ahịrịokwu zuru oke ma dị ka Igbo a na-asụ n’oge a.
  terminology: “Okpueze” na-echekwa στέφανος na ihe atụ Pọl. N’ala peeji, “okpueze e ji akwụkwọ osisi kpaa” ka “okpu mmeri” doo anya karịa dịka nhọrọ ntụgharị maka wreath/garland. “Na-adịghị emebi emebi” na-edobe ọdịiche φθαρτός/ἄφθαρτος.
  issues:
  - severity: medium
    issue: Akụkụ “ma anyị, nke na-adịghị emebi emebi” ezughị ezu n’usoro ahịrịokwu Igbo.
    rationale: Grik nwere ellipsis nke στέφανον, ma Igbo chọrọ ka e nye ngwaa ma ọ bụ usoro na-ejikọta “anyị” na ihe a na-anata. “Ma anyị ga-anata nke na-adịghị emebi emebi” na-eme ka mmekọrịta ahụ pụta ìhè n’enweghị ịgbanwe ihe amaokwu ahụ kwuru.
  - severity: low
    issue: Nhọrọ ntụgharị n’ala peeji, “okpu mmeri,” anaghị akọwa wreath/garland nke ọma dịka “okpueze e ji akwụkwọ osisi kpaa.”
    rationale: στέφανος n’ọnọdụ asọmpi bụ okpueze/garland a na-enye onye meriri, ọ bụghị naanị okpu n’ụzọ zuru ezu.
  revised_text: Onye ọ bụla na-asọ mpi na-ejide onwe ya n'ihe niile. Ha na-eme ya ka ha nweta okpueze na-emebi emebi[a], ma anyị ga-anata nke na-adịghị emebi emebi.
