  to: Onye ọ bụla na-asọ mpi na-ejide onwe ya n'ihe niile. Ha na-eme ya ka ha nweta okpueze na-emebi emebi[a], ma anyị ga-anata nke na-adịghị emebi emebi.
  rationale: E tinyeela “ga-anata” n’akụkụ nke abụọ iji mee ka ellipsis Grik bụrụ Igbo zuru oke, ebe “nke” ka na-arụtụ aka n’okpueze a kpọtụrụ aha na mbụ. A haziela ala peeji ka ọ kọwaa ihe στέφανος pụtara n’asọmpi n’ụzọ ziri ezi ma dị mfe.
