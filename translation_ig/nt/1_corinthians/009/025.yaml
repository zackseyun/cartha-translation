  text: πᾶς δὲ ὁ ἀγωνιζόμενος πάντα ἐγκρατεύεται, ἐκεῖνοι μὲν οὖν ἵνα φθαρτὸν στέφανον λάβωσιν, ἡμεῖς δὲ ἄφθαρτον.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/025.yaml
  text: Everyone who competes exercises self-control in all things. They do so in order to receive a perishable crown[a], but we an imperishable one.
translation:
  language: ig
  text: Onye ọ bụla na-asọ mpi na-ejide onwe ya n'ihe niile. Ha na-eme ya ka ha nweta okpueze na-emebi emebi[a], ma anyị ga-anata nke na-adịghị emebi emebi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “okpueze e ji akwụkwọ osisi kpaa”; okwu Grik a na-ezo aka n’okpueze mmeri a na-enye onye meriri n’asọmpi egwuregwu.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς
  choice: Onye ọ bụla
  rationale: Na-egosi onye ọ bụla n’otu n’otu n’enweghị ịkpọ nwoke aha kpọmkwem; ọ bụ Igbo nkịtị ma kwekọọ n’ike nnọchiteanya nke okwu Grik.
- source_word: ἀγωνιζόμενος
  choice: na-asọ mpi
  rationale: N’ebe a, ihe atụ ahụ bụ nke egwuregwu asọmpi; ‘na-asọ mpi’ na-ebute echiche nke ịgba mbọ n’asọmpi nke ọma.
- source_word: πάντα
  choice: n’ihe niile
  rationale: Na-echekwa oke sara mbara nke njide onwe onye, n’enweghị ịkpọda ya naanị n’ihe oriri ma ọ bụ ọzụzụ.
- source_word: ἐγκρατεύεται
  choice: na-ejide onwe ya
  rationale: Okwu a na-egosi omume njide onwe onye a na-eme mgbe niile; nsụgharị a bụ nke doro anya ma bụrụkwa Igbo a na-asụ ugbu a.
- source_word: ἐκεῖνοι μὲν οὖν
  choice: Ha na-eme ya
  rationale: ‘Ha’ na-alaghachi n’ebe ndị na-asọ mpi nọ, ebe ‘na-eme ya’ na-eme ka ngwaa e zoro ezo pụta ìhè n’Igbo.
- source_word: ἵνα
  choice: ka
  rationale: Na-egosi ebumnobi nke omume ahụ n'ụzọ Igbo dị nkenke ma doo anya.
- source_word: φθαρτὸν
  choice: na-emebi emebi
  rationale: Na-egosi ihe na-adịghị adịgide adịgide ma na-enye ọdịiche kpọmkwem megide ἄφθαρτον.
- source_word: στέφανον
  choice: okpueze
  rationale: ‘Okpueze’ na-echekwa ihe atụ nke nsọpụrụ na ụgwọ mmeri; ihe ọ pụtara kpọmkwem n’asọmpi kọwara n’ala peeji.
- source_word: λάβωσιν
  choice: nweta
  rationale: Na-egosi inata ma ọ bụ irite ihe a na-enye onye meriri; ọ dabara nke ọma n’ihe atụ asọmpi.
- source_word: ἡμεῖς δὲ ἄφθαρτον
  choice: ma anyị, nke na-adịghị emebi emebi
  rationale: Na-echekwa nkwụsị okwu nke Grik, ebe a na-aghọta ‘okpueze’ site n’ahịrịokwu bu ụzọ, ma mee ka ọdịiche ahụ doo anya.
theological_decisions:
- issue: Ụdị ụgwọ ọrụ e ji ihe atụ kwuo
  choice: E debere ihe atụ ahụ dịka ‘okpueze’ na-akọwaghị kpọmkwem ihe ozizi ọ nọchiri anya ya.
  alternative: Ịkọwa ya kpọmkwem dịka ndụ ebighị ebi ma ọ bụ ụgwọ ọrụ dị n’eluigwe.
  rationale: Amaokwu ahụ n’onwe ya akọwaghị ụgwọ ahụ n’ụzọ ozizi kpọmkwem; idebe ihe atụ ahụ na-echekwa ọdịiche Pọl mere n’etiti ụgwọ na-emebi emebi na nke na-adịghị emebi emebi.
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, nke dị ugwu ma dị mfe nghọta. Ahịrịokwu ahụ na-echekwa ihe atụ egwuregwu na ọdịiche dị n’etiti ihe na-emebi emebi na ihe na-adịghị emebi emebi, n’enweghị itinye nkọwa ozizi nke amaokwu ahụ ekwughị.
