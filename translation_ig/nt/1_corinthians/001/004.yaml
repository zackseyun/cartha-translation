id: 1CO.1.4
reference: 1 Corinthians 1:4
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Εὐχαριστῶ τῷ θεῷ ⸀μου πάντοτε περὶ ὑμῶν ἐπὶ τῇ χάριτι τοῦ θεοῦ τῇ δοθείσῃ ὑμῖν ἐν Χριστῷ Ἰησοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/004.yaml
  text: I thank my God always for you because of the grace of God given to you in Messiah Jesus[b][a],
translation:
  language: ig
  text: Ana m ekele Chineke m mgbe niile banyere unu n’ihi amara Chineke nke e nyere unu n’ime Mesaịa Jizọs.[b][a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Ana m ekele Chineke m mgbe niile maka unu.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “n’ime Kraịst Jizọs.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὐχαριστῶ
  choice: Ana m ekele
  rationale: Nke a bụ ụzọ Igbo dị ugbu a na nke doro anya isi kwuo ekele a na-enye Chineke; ọ na-egosikwa omume Pọl na-eme mgbe niile.
- source_word: τῷ θεῷ μου
  choice: Chineke m
  rationale: E debere nnọchiaha nwe ‘m’ dị n’asụsụ Grik, ebe usoro ‘ekele Chineke m’ bụ Igbo ebumpụta ụwa.
- source_word: πάντοτε
  choice: mgbe niile
  rationale: Ọ na-egosipụta oge sara mbara nke πάντοτε n’Igbo nkịtị ma dị ùgwù.
- source_word: περὶ ὑμῶν
  choice: n’ihi unu
  rationale: N’usoro okwu ekele, nke a na-egosi na ndị a bụ ndị Pọl na-ekele Chineke banyere ha ma ọ bụ n’ihi ha; ‘n’ihi unu’ bụ okwu Igbo kacha dị ire ebe a.
- source_word: ἐπὶ τῇ χάριτι
  choice: n’ihi amara
  rationale: ἐπί tinyere dative na-egosi ihe mere e ji kelee Chineke; ‘n’ihi’ na-eme ka njikọ ahụ doo anya.
- source_word: χάριτι
  choice: amara
  rationale: ‘Amara’ bụ okwu Igbo a na-ejikarị akọwa χάρις dị ka ezi ihuọma Chineke na-enye n’efu.
- source_word: τοῦ θεοῦ
  choice: Chineke
  rationale: Njikọ ‘amara Chineke’ na-edobe nghọta genitive ahụ n’enweghị ịkọwapụta ma ọ bụ naanị nwe ma ọ bụ isi mmalite.
- source_word: τῇ δοθείσῃ ὑμῖν
  choice: nke e nyere unu
  rationale: A hapụrụ ya n’olu nnara dịka Grik si dị, ka Chineke bụrụ onye nyere ya n’agbanyeghị na a kpọghị onye mere omume ahụ aha n’akụkụ a.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: n’ime Mesaịa Jizọs
  rationale: ‘N’ime’ na-edobe njikọ ἐν, ebe ‘Mesaịa’ na-egosipụta Χριστός dịka aha ọkwa ahụ n’asụsụ a na-aghọta taa.
theological_decisions:
- issue: Otu a ga-esi sụgharịa Χριστός n’aha njikọ ἐν Χριστῷ Ἰησοῦ
  choice: Mesaịa Jizọs
  alternative: Kraịst Jizọs
  rationale: A họọrọ ‘Mesaịa’ iji mee ka ihe aha ọkwa Χριστός pụtara pụta ìhè, ma e debere ụdị ọdịnala ‘Kraịst’ n’ihe odide ala peeji n’ihi na ọ bụkwa okwu Igbo ndị na-agụ Baịbụl maara nke ọma.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta dee ya. A zere usoro okwu siri ike, ma e chekwara ụdị olu nnara na njikọ ndị dị n’asụsụ Grik.
