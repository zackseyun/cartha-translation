id: 1CO.1.21
reference: 1 Corinthians 1:21
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐπειδὴ γὰρ ἐν τῇ σοφίᾳ τοῦ θεοῦ οὐκ ἔγνω ὁ κόσμος διὰ τῆς σοφίας τὸν θεόν, εὐδόκησεν ὁ θεὸς διὰ τῆς μωρίας τοῦ κηρύγματος σῶσαι τοὺς πιστεύοντας.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/021.yaml
  text: For since[a], in the wisdom of God, the world did not know God through wisdom[b], God was pleased through the foolishness of the proclamation to save those who believe.
translation:
  language: ig
  text: N’ihi na, n’amamihe Chineke, ụwa amataghị Chineke site n’amamihe, ọ masịrị Chineke site na nzuzu nke ihe a na-ekwusa[a] ịzọpụta ndị na-ekwere ekwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “site na nzuzu nke ikwusa ozi.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπειδὴ γὰρ
  choice: N’ihi na
  rationale: Na-egosi ihe kpatara okwu ahụ ma jikọta ya n’arụmụka bu ya ụzọ, n’asụsụ Igbo dị mfe ma bụrụkwa nke e ji ede ihe.
- source_word: ἐν τῇ σοφίᾳ τοῦ θεοῦ
  choice: n’amamihe Chineke
  rationale: Na-edobe ohere nghọta nke ἐν—ma dịka ọnọdụ dị n’ime nhazi amamihe Chineke, ma ọ bụ ihe metụtara ụzọ amamihe ya—n’enweghị ịkọwapụta ya karịa ihe Grik kwuru.
- source_word: οὐκ ἔγνω ὁ κόσμος
  choice: ụwa ... mata Chineke
  rationale: “Ụwa” bụ okwu Pọl ji anọchi anya ụmụ mmadụ n’usoro ụwa; “mata” na-edobe ma nghọta uche ma mmekọrịta mmadụ na Chineke.
- source_word: διὰ τῆς σοφίας
  choice: esiteghị n’amamihe
  rationale: “Site n’” na-egosi ụzọ ma ọ bụ ihe e ji eme ihe dịka διά tinyere genitive si pụta.
- source_word: εὐδόκησεν ὁ θεὸς
  choice: ọ masịrị Chineke
  rationale: Na-egosipụta ezi ọchịchọ na obi ụtọ Chineke, ọ bụghị naanị mkpebi efu.
- source_word: διὰ τῆς μωρίας τοῦ κηρύγματος
  choice: iji ihe a na-ekwusa nke ụwa na-ewere dị ka nzuzu
  rationale: “Ihe a na-ekwusa” na-elekwasị anya n’ozi a kpọsara, ebe nkọwa ahụ na-eme ka o doo anya na ọ bụ ụwa na-ewere ya dịka nzuzu, ọ bụghị na ọ bụ nzuzu n’anya Chineke.
- source_word: σῶσαι
  choice: zọpụta
  rationale: Ọ bụ okwu Igbo a na-ejikarị akọwa nzọpụta ma na-edobe ibu okwu ahụ n’ihe gbasara nzọpụta Chineke.
- source_word: τοὺς πιστεύοντας
  choice: ndị kweere
  rationale: Na-enye participle ahụ n’Igbo eke dịka ndị nwere okwukwe, n’etinyeghị nkọwa ozizi karịrị ihe Grik kwuru.
theological_decisions:
- issue: Ihe διὰ τῆς μωρίας τοῦ κηρύγματος pụtara
  choice: Ọ na-ezo n’ụzọ bụ isi n’ihe a na-ekwusa, nke ụwa na-ewere dịka nzuzu.
  alternative: Ọ pụrụ izo aka n’omume ma ọ bụ ụzọ e si ekwusa ozi ọma, ma ọ bụ jikọta ozi ahụ na omume ikwusa ya.
  rationale: κήρυγμα na-apụtakarị ihe a kpọsara, ọ bụ ezie na ọnọdụ a nwekwara ike ime ka a chee banyere omume ikwusa ya. Isi ederede na-egosi ozi ahụ ma ihe odide ala peeji na-edobe nghọta nke omume ikwusa.
translation_notes:
  register: Asụsụ Igbo izugbe, nke dị ugbu a ma dị ùgwù. A họọrọ usoro okwu dị mfe nghọta, ma e debeghị ἐν n’ụzọ ga-amanye naanị otu nkọwa. Ihe odide isi na-eme ka nghọtahie nke ụwa banyere ozi ahụ pụta ìhè, ebe nkọwa ala peeji na-echekwa ohere na κήρυγμα nwere ike metụta omume ikwusa.
