revisions:
- from: N’ihi na, n’amamihe Chineke, ụwa esiteghị n’amamihe mata Chineke, ọ masịrị Chineke iji ihe a na-ekwusa nke ụwa na-ewere dị ka nzuzu[a] zọpụta ndị kweere.
  to: N’ihi na, n’amamihe Chineke, ụwa amataghị Chineke site n’amamihe, ọ masịrị Chineke site na nzuzu nke ihe a na-ekwusa[a] ịzọpụta ndị na-ekwere ekwe.
  rationale: The revision removes an unstated interpretive attribution while preserving Paul’s ironic phrase, improves clause flow in Standard Igbo, and more closely reflects the present participle ‘those who believe.’ The footnote is anchored directly to the phrase in question and supplies the legitimate alternative in which κήρυγμα emphasizes the act of proclamation/preaching.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T18:10:40Z'
review_pass:
  verdict: revise
  source_fidelity: A safe revision is needed. The draft's explicit addition that 'the world considers' the proclamation foolish is contextually plausible but is not stated in this verse; the Greek simply says 'through the foolishness of the proclamation.' The revision retains that characterization without assigning the evaluation explicitly. It also renders the present substantival participle more transparently as 'those who believe.'
  naturalness: 'The revised word order is more natural and direct in Standard Igbo: ''ụwa amataghị Chineke site n’amamihe.'' The construction ''ọ masịrị Chineke ... ịzọpụta'' idiomatically conveys ''God was pleased ... to save.'''
  terminology: “Amamihe Chineke,” “ụwa,” “ihe a na-ekwusa,” “nzuzu,” and “ịzọpụta” are appropriate, dignified Standard Igbo equivalents. “Ihe a na-ekwusa” preserves κήρυγμα chiefly as proclaimed content while the footnote retains the possible emphasis on the act of preaching.
  issues:
  - severity: medium
    issue: The main text adds 'nke ụwa na-ewere dị ka' ('which the world regards as').
    rationale: Although Paul's context supports this implication, διὰ τῆς μωρίας τοῦ κηρύγματος itself does not identify who regards the proclamation as foolish. The added attribution narrows and expands the wording beyond the verse.
  - severity: low
    issue: “ụwa esiteghị n’amamihe mata Chineke” is less smooth than a direct negative clause.
    rationale: “Ụwa amataghị Chineke site n’amamihe” is clearer and more idiomatic while retaining the Greek sequence and causal relation.
  - severity: low
    issue: “ndị kweere” can suggest a completed past act rather than the present participle πιστεύοντας.
    rationale: “Ndị na-ekwere ekwe” naturally represents people characterized by believing and avoids unnecessarily losing the participle’s present aspect.
  revised_text: N’ihi na, n’amamihe Chineke, ụwa amataghị Chineke site n’amamihe, ọ masịrị Chineke site na nzuzu nke ihe a na-ekwusa[a] ịzọpụta ndị na-ekwere ekwe.
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “site na nzuzu nke ikwusa ozi.”
    reason: alternative_reading
  revision_rationale: The revision removes an unstated interpretive attribution while preserving Paul’s ironic phrase, improves clause flow in Standard Igbo, and more closely reflects the present participle ‘those who believe.’ The footnote is anchored directly to the phrase in question and supplies the legitimate alternative in which κήρυγμα emphasizes the act of proclamation/preaching.
