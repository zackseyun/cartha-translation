id: 1CO.1.11
reference: 1 Corinthians 1:11
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐδηλώθη γάρ μοι περὶ ὑμῶν, ἀδελφοί μου, ὑπὸ τῶν Χλόης ὅτι ἔριδες ἐν ὑμῖν εἰσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/011.yaml
  text: For it has been reported to me about you[a], my brothers, by Chloe’s people, that there are quarrels among you.
translation:
  language: ig
  text: N’ihi na a kọọrọ m gbasara unu, ụmụnna m[a], site n'aka ndị Kloi, na e nwere esemokwu n’etiti unu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Okwu Grik ahụ bụ ụdị ọtụtụ nke nwoke, “ụmụnna m”; ma n’ebe a ọ pụrụ ịgụnye ọgbakọ ndị kwere ekwe niile, ma ndị nwoke ma ndị nwanyị.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδηλώθη
  choice: mere ka m mata
  rationale: Nke a na-egosi na e mere ka ozi ahụ doo Pọl anya. N’asụsụ Igbo, usoro a bụ nke e ji ekwu okwu nke ọma ma na-edobe echiche nke ihe e mere ka ọ mata.
- source_word: γάρ
  choice: N’ihi na
  rationale: Ọ na-edobe njikọ nkọwa amaokwu a nwere na agbamume dị n’amaokwu bu ya ụzọ.
- source_word: περὶ ὑμῶν
  choice: banyere unu
  rationale: Nke a bụ ntụgharị Igbo doro anya ma kwekọọ n’echiche nkebi okwu Grik ahụ.
- source_word: ἀδελφοί μου
  choice: ụmụnna m
  rationale: “Ụmụnna” bụ okwu Igbo sitere n’echiche nwanne ma nwee ike ịkpọkọta ndị kwere ekwe n’agbanyeghị nwoke na nwanyị; ọ bụkwa asụsụ dị mma na nke a na-aghọta taa.
- source_word: ὑπὸ τῶν Χλόης
  choice: ndị Kloi
  rationale: Okwu Grik ahụ pụtara ndị ha na Kloi nwere mmekọrịta. “Ndị Kloi” na-edobe obosara ahụ n’ebughị ụzọ kpebie na ha bụ naanị ndị ezinụlọ ya.
- source_word: ἔριδες
  choice: esemokwu
  rationale: Ọ na-egosi ọgụ okwu na ndọrọndọrọ dị n’etiti mmadụ, ma ọ naghị agwakọta ya na okwu sara mbara karịa nke pụtara nkewa.
- source_word: ἐν ὑμῖν εἰσιν
  choice: dị n’etiti unu
  rationale: Nke a bụ usoro okwu Igbo ebumpụta ụwa nke na-egosi na esemokwu ahụ nọ n’etiti ndị ọ na-agwa okwu.
theological_decisions:
- issue: Ma ἀδελφοί ọ na-akpọ naanị ụmụ nwoke ka ọ bụ ọgbakọ niile
  choice: ụmụnna m
  alternative: ụmụnne m ndị nwoke; ụmụnna m ndị nwoke na ndị nwanyị
  rationale: Ọ bụ ezie na okwu Grik ahụ bụ ọtụtụ nke ụdị nwoke, n’ebe a ọ pụrụ ịgụnye ọgbakọ ndị kwere ekwe niile. “Ụmụnna” na Standard Igbo nwere ike ikwu maka ndị otu ezinụlọ ma ọ bụ otu okwukwe n’enweghị mkpebi na ọ bụ naanị nwoke, ya mere a na-edobe obosara ntụaka ahụ; ihe mgbagwoju anya nke Grik ka akọwara n’ala ala peeji.
translation_notes:
  register: Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E ji “ndị Kloi” zere ịkọwa τῶν Χλόης kpọmkwem dị ka ezinụlọ ma ọ bụ ndị ohu ya. Akara ala ala peeji [a] dị n’isiokwu ahụ.
