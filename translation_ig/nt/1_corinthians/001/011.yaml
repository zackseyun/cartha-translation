- from: N’ihi na ndị Kloi mere ka m mata banyere unu, ụmụnna m[a], na esemokwu dị n’etiti unu.
  to: N’ihi na a kọọrọ m gbasara unu, ụmụnna m[a], site n'aka ndị Kloi, na e nwere esemokwu n’etiti unu.
  rationale: The revision preserves Paul’s explanatory “N’ihi na,” the passive reporting event, the unspecified people associated with Chloe, and the plural interpersonal conflicts. It also retains the source’s ambiguity concerning the inclusive reference of ἀδελφοί while explaining its masculine grammatical form accurately in the footnote.
