id: 1CO.1.27
reference: 1 Corinthians 1:27
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀλλὰ τὰ μωρὰ τοῦ κόσμου ἐξελέξατο ὁ θεός, ἵνα ⸂καταισχύνῃ τοὺς σοφούς⸃, καὶ τὰ ἀσθενῆ τοῦ κόσμου ἐξελέξατο ὁ θεός, ἵνα καταισχύνῃ τὰ ἰσχυρά,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/027.yaml
  text: But God chose the foolish things of the world so that he might shame the wise[c][b][a], and God chose the weak things of the world so that he might shame the strong.
translation:
  language: ig
  text: Kama, Chineke họọrọ ihe nzuzu nke ụwa[a], ka o wee mee ka ihere mee[b] ndị maara ihe; Chineke họọrọkwa ihe na-adịghị ike nke ụwa[c], ka o wee mee ka ihere mee ihe ndị dị ike.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ihe dị nzuzu n’ụwa.” N’asụsụ Grik, nke a bụ okwu nkọwa n’ụdị neuter plural e ji dịka aha.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị “mee ka ihere mee” dịka “mee ka ha daa n’ihere.”
    reason: lexical_alternative
  - marker: c
    text: A pụkwara ịsụgharị ya, “ihe na-adịghị ike n’ụwa.” N’ebe a kwa, asụsụ Grik ji okwu nkọwa n’ụdị neuter plural dịka aha.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Kama
  rationale: Na-egosi nnukwu ọdịiche n'etiti okwu a na nke bu ya ụzọ; “Kama” bụ ụzọ Igbo doro anya si egosipụta ntụgharị a.
- source_word: τὰ μωρὰ τοῦ κόσμου
  choice: ihe ndị ụwa na-ewere dị ka ihe nzuzu
  rationale: μωρά bụ adjective neuter plural e ji dị ka aha. Nsụgharị a na-edobe ya dịka “ihe,” ma na-eme ka echiche ụwa banyere ha pụta ìhè n’Igbo nkịtị.
- source_word: ἐξελέξατο
  choice: họọrọ
  rationale: Na-egosi omume Chineke ji aka ya mee nke ịhọrọ; ọ bụ okwu Igbo dị mfe ma kwesị ekwesị.
- source_word: ἵνα
  choice: ka o wee
  rationale: Na-edobe ebumnuche nke nkebiokwu Grik ahụ n’ụzọ Igbo na-asụkarị.
- source_word: καταισχύνῃ
  choice: mee ka ihere mee
  rationale: Na-egosipụta ime ka onye ma ọ bụ ihe daa n’ihere, ma na-anọgide n’asụsụ Igbo dị ndụ.
- source_word: τοὺς σοφούς
  choice: ndị maara ihe
  rationale: Adjective masculine plural e ji dịka aha; “ndị maara ihe” bụ nsụgharị Igbo ebumpụta ụwa.
- source_word: τὰ ἀσθενῆ τοῦ κόσμου
  choice: ihe ndị ụwa na-ewere dị ka ihe na-adịghị ike
  rationale: ἀσθενῆ bụ adjective neuter plural e ji dịka aha. “Ihe” na-ezere ime ka ọ bụrụ naanị mmadụ, ebe nkebiokwu ahụ na-egosi adịghị ike dịka ụwa si ele ya.
- source_word: τὰ ἰσχυρά
  choice: ihe ndị dị ike
  rationale: Ụdị neuter plural ahụ na-akwado “ihe ndị”; nke a na-edobe ntụnyere ya na “ihe ndị ... na-adịghị ike” ma ghara imechi ndị a na-ekwu maka ha n’otu ụdị.
theological_decisions: []
translation_notes:
  register: Standard Igbo dị ugbu a, dị ugwu ma dị mfe nghọta. E debere usoro nkwughachi nke amaokwu ahụ na ọdịiche dị n’etiti ihe ụwa na-ewere dị ka nzuzu ma ọ bụ adịghị ike na ndị maara ihe ma ọ bụ ihe dị ike. E tinyere akara ntụaka ụkwụ niile n’ebe okwu ha na-akọwa dị.
