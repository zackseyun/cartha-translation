  text: ⸀εὐχαριστῶ ὅτι οὐδένα ὑμῶν ἐβάπτισα εἰ μὴ Κρίσπον καὶ Γάϊον,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/014.yaml
  text: I am thankful that I baptized none of you except Crispus and Gaius,
translation:
  language: ig
  text: Ana m ekele maka na ọ dịghị onye n’ime unu m baptiziri, ma e wezụga Krispọs na Gaiọs,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐχαριστῶ
  choice: Ana m ekele Chineke
  rationale: N’Igbo, okwu a na-adịkarị ka ‘ekele m Chineke.’ Ọ bụ ezie na ihe odide Grik a kpọrọ aha onye a na-ekeleghị kpọmkwem, ihe a na-ekwu na gburugburu amaokwu ahụ na-egosi na ọ bụ Chineke ka Pọl na-ekele; itinye ‘Chineke’ na-eme ka okwu ahụ bụrụ Igbo kwụ ọtọ ma ghara ịgbanwe isi echiche.
- source_word: ὅτι
  choice: na
  rationale: ‘Na’ na-ewebata ihe kpatara ma ọ bụ ọdịnaya nke ekele Pọl n’ụzọ Igbo si ekwu ya naturally.
- source_word: οὐδένα ὑμῶν
  choice: o nweghị onye ọ bụla n’ime unu
  rationale: Nke a na-egosipụta nkwusioru zuru ezu nke ahịrịokwu Grik ma bụrụkwa okwu doro anya n’Igbo.
- source_word: ἐβάπτισα
  choice: m mere baptizim
  rationale: ‘Ime baptizim’ bụ okwu Ndị Kraịst na-asụkarị n’Igbo; ọ naghị ekpebi ụzọ e si mee baptizim, ya mere ọ na-ezere ịkwado echiche otu ụka.
- source_word: εἰ μὴ
  choice: ma e wezụga
  rationale: Nke a bụ ụzọ Igbo doro anya isi gosipụta ndị e wepụtara n’okwu nchụpụ a.
- source_word: Κρίσπον
  choice: Krispọs
  rationale: A sụgharịrị aha onye ahụ ka ụda ya kwekọọ n’usoro mkpụrụokwu na mkpọpụta Igbo.
- source_word: Γάϊον
  choice: Gayọs
  rationale: A sụgharịrị aha onye ahụ ka ụda ya kwekọọ n’usoro mkpụrụokwu na mkpọpụta Igbo.
theological_decisions:
- issue: Onye Pọl na-ekele na εὐχαριστῶ
  choice: E mere onye ahụ ka ọ pụta ìhè dịka Chineke.
  alternative: Ana m ekele na…
  rationale: Grik ahịrịokwu a ekwughị θεῷ (‘Chineke’) n’ebe a dịka ụfọdụ ọdịiche ederede si dị, ma n’akwụkwọ Pọl, εὐχαριστῶ n’usoro dị otu a na-ezo aka n’inye Chineke ekele. Igbo chọrọkarị ihe nnara ka okwu ahụ ghara ịdị nkọcha; nke a bụ ime ka ihe e zubere doo anya, ọ bụghị ịgbakwunye ozizi.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị ugbu a, dị nsọ ma dị mfe nghọta. E ji ‘unu’ chekwaa ọtụtụ mmadụ nke ὑμῶν, e jikwa aha ndị a kpọgharịa n’ụda Igbo.
