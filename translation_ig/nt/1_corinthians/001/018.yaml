id: 1CO.1.18
reference: 1 Corinthians 1:18
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ὁ λόγος γὰρ ὁ τοῦ σταυροῦ τοῖς μὲν ἀπολλυμένοις μωρία ἐστίν, τοῖς δὲ σῳζομένοις ἡμῖν δύναμις θεοῦ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/018.yaml
  text: For the message of the cross is foolishness to those who are perishing[b][a], but to us who are being saved it is the power of God.
translation:
  language: ig
  text: N’ihi na ozi banyere obe[a] bụ ihe nzuzu nye ndị na-ala n’iyi, ma nye anyị ndị a na-azọpụta[b], ọ bụ ike Chineke.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “okwu nke obe.”
    reason: lexical_alternative
  - marker: b
    text: 'Okwu Grik gosiri nzọpụta ebe a dị ka ihe na-aga n’ihu: “anyị ndị a na-azọpụta.”'
    reason: alternative_reading
lexical_decisions:
- source_word: λόγος
  choice: ozi
  rationale: N'ebe a, λόγος na-ezo aka n'ihe a na-ekwusa banyere obe, ya mere “ozi” bụ Igbo doro anya ma dịkwa mma karịa “okwu” n'ahịrịokwu a; e debere “okwu” dị ka nhọrọ ọzọ na nkọwa ala peeji.
- source_word: σταυροῦ
  choice: obe
  rationale: “Obe” na-edobe nkenke okwu Grik ma na-ezo aka n'obe Kraịst na ọnwụ ya n'obe n'emebighị njupụta okwu ahụ.
- source_word: ἀπολλυμένοις
  choice: ndị na-ala n’iyi
  rationale: Nkebi-ngwaa oge ugbu a na-egosi ọnọdụ na-aga n'ihu; “na-ala n’iyi” na-edobe nke a ma bụrụkwa okwu Igbo a na-aghọta nke ọma.
- source_word: μωρία
  choice: ihe nzuzu
  rationale: “Ihe nzuzu” na-egosipụta echiche nke ihe e lere anya dị ka enweghị amamihe ma na-adaba nke ọma n'ọdịiche Pọl mere n'etiti ya na ike Chineke.
- source_word: σῳζομένοις
  choice: anyị ndị a na-azọpụta
  rationale: Ụdị nkebi-ngwaa oge ugbu a nwere olu passive na-egosi na nzọpụta bụ ihe Chineke na-eme nye ha ma na-aga n'ihu; “a na-azọpụta” na-echekwa akụkụ a.
- source_word: δύναμις θεοῦ
  choice: ike Chineke
  rationale: Nke a bụ ntụgharị Igbo nkịtị ma kpọmkwem nke na-edobe ịdị arọ nke okwu Grik na ịdị iche ya na “ihe nzuzu.”
theological_decisions:
- issue: Akụkụ oge nke nzọpụta dị na σῳζομένοις
  choice: anyị ndị a na-azọpụta
  alternative: anyị ndị a zọpụtara
  rationale: A họọrọ okwu na-egosi ihe na-aga n'ihu iji chekwaa nkebi-ngwaa oge ugbu a n'asụsụ Grik, kama ime ka nzọpụta ebe a bụrụ naanị ihe mere n'oge gara aga.
translation_notes:
  register: Asụsụ Igbo Izugbe dị ugbu a, dị ùgwù ma dị mfe nghọta. A họọrọ “ozi banyere obe” maka nghọta nkịtị, ebe nkọwa ala peeji chekwara ntụgharị dị nso karị, “okwu nke obe.”
