base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/016.yaml
  text: I also baptized the household of Stephanas[a]; beyond that[b], I do not know if I baptized anyone else.
translation:
  language: ig
  text: Emekwara m ndị ezinụlọ Stifanas baptizim[a]. E wezụga nke ahụ, amaghị m ma m mere onye ọ bụla ọzọ baptizim[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ụlọ Stifanas.” Okwu Grik ahụ pụrụ ịpụta ndị mejupụtara ezinụlọ ma ọ bụ ndị bi n’ụlọ ya, ọ bụghị naanị ụlọ e wuru.
    reason: lexical_alternative
  - marker: b
    text: 'Ma: “amaghị m ma m mere baptizim onye ọ bụla ọzọ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐβάπτισα
  choice: Emekwara m ... baptizim / m mere baptizim
  rationale: Nkebiokwu a bụ ụzọ doro anya, nke a na-aghọta n'Igbo maka ime mmadụ baptizim; ọ naghị etinye n'okwu ahụ otu usoro baptizim pụrụ iche.
- source_word: δὲ καὶ
  choice: Emekwara m
  rationale: Ngwakọta a na-egosi mgbakwunye dị nro n'ihe Pọl kwuru tupu ya; “-kwara” na-ebupụta echiche “ọzọkwa/also” n'Igbo n'ụzọ eke.
- source_word: τὸν Στεφανᾶ οἶκον
  choice: ndị ezinụlọ Stifanas
  rationale: οἶκος n'ebe a na-ezo aka n'ìgwè ndị mejupụtara ụlọ mmadụ, ọ bụghị naanị ụlọ e wuru; “ndị ezinụlọ” na-egosipụta nke a n'Igbo, ọ bụ ezie na ọ pụkwara ịgụnye ndị ọzọ bi n'ezinụlọ ahụ.
- source_word: λοιπὸν
  choice: E wezụga nke ahụ
  rationale: Ọ na-egosi ihe ọ bụla ọzọ fọdụrụ ma e wezụga ndị ahụ a kpọtụrụla aha.
- source_word: οὐκ οἶδα
  choice: amaghị m
  rationale: Nke a na-agbaso okwu Grik nke pụtara enweghị ihe ọmụma; ọnọdụ ahụ nwere ike igosi enweghị ncheta, ma e doghị nke ahụ anya kpọmkwem.
- source_word: εἴ τινα ἄλλον ἐβάπτισα
  choice: ma è nwere onye ọzọ m mere baptizim
  rationale: “Ma è nwere” na-edobe ajụjụ na ejighị n'aka nke εἴ, ma na-ada nke ọma n'Igbo.
theological_decisions: []
translation_notes:
  register: Standard Igbo; asụsụ dị ugbu a, dị ùgwù, ma dị mfe nghọta. E ji “ndị ezinụlọ” mee ka echiche nke household pụta ìhè, a hapụkwara “amaghị m” ka ọ ghara ịgbanwe okwu Grik ahụ ka ọ bụrụ naanị okwu banyere ncheta.
