id: 1CO.1.10
reference: 1 Corinthians 1:10
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Παρακαλῶ δὲ ὑμᾶς, ἀδελφοί, διὰ τοῦ ὀνόματος τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ ἵνα τὸ αὐτὸ λέγητε πάντες, καὶ μὴ ᾖ ἐν ὑμῖν σχίσματα, ἦτε δὲ κατηρτισμένοι ἐν τῷ αὐτῷ νοῒ καὶ ἐν τῇ αὐτῇ γνώμῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/010.yaml
  text: I urge you[a], brothers, by the name of our Lord Jesus the Messiah, that you all say the same thing, and that there be no divisions among you[e][d][c][b], but that you be joined together in the same mind and in the same judgment.
translation:
  language: ig
  text: Ụmụnna[a], ana m arịọ unu n’aha Onyenwe anyị Jizọs Mesaya[b], ka unu niile kwuo otu ihe, ka nkewa[c] ghara ịdị n’etiti unu, kama ka e jikọta unu nke ọma[d] n’otu uche na n’otu mkpebi[e].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ụmụnna nwoke na ụmụnna nwanyị”; okwu Grik e ji ọtụtụ nke nwoke dee nwere ike ịgụnye ndị kwere ekwe niile nọ n’ọgbakọ ahụ.
    reason: cultural_note
  - marker: b
    text: Ma ọ bụ, “Kraịst.” “Mesaya” na “Kraịst” pụtara Onye E Tere Mmanụ.
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “mgbawa” ma ọ bụ “ịkewa iche iche.”
    reason: lexical_alternative
  - marker: d
    text: Ma ọ bụ, “ka e dozie unu” ma ọ bụ “ka e mezie unu ọnụ.”
    reason: lexical_alternative
  - marker: e
    text: Ma ọ bụ, “otu nkwenye” ma ọ bụ “otu echiche e kpebisiri ike.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Παρακαλῶ
  choice: ana m arịọ unu
  rationale: Nke a na-egosi arịrịọ siri ike nke onye na-elekọta ọgbakọ na-arịọ, kama ịbụ naanị iwu kpọrọ nkụ.
- source_word: ἀδελφοί
  choice: Ụmụnna m
  rationale: “Ụmụnna” bụ okwu Igbo dị ùgwù ma dịkwa eke maka ndị otu okwukwe; “m” na-eme ka okwu Pọl bụrụ nke chiri anya. Ihe odide Grik bụ ọtụtụ nke nwoke, ma n’ọnọdụ a ọ na-agwa ọgbakọ dum okwu.
- source_word: διὰ τοῦ ὀνόματος
  choice: n’aha
  rationale: N’Igbo, “n’aha” na-egosi na arịrịọ ahụ dabere n’ikike na n’ọchịchị nke Jizọs.
- source_word: κυρίου
  choice: Onyenwe anyị
  rationale: Nke a bụ aha Igbo a na-aghọta nke ọma maka κύριος ma na-egosi ọchịchị Jizọs.
- source_word: Χριστοῦ
  choice: Mesaya
  rationale: A sụgharịrị aha ọrụ ahụ kama idepụta ya naanị n’ụdị omenala; “Kraịst” dị na nkọwa ala peeji dịka aha ọzọ a maara nke ọma.
- source_word: τὸ αὐτὸ λέγητε πάντες
  choice: ka unu niile kwuo otu ihe
  rationale: Nsụgharị a na-edobe ihe atụ Pọl ji—ikwu otu ihe—ma na-egosikwa ịdị n’otu n’okwu na nkwupụta.
- source_word: σχίσματα
  choice: nkewa
  rationale: “Nkewa” bụ okwu Igbo doro anya maka mgbawa ma ọ bụ ikewa ndị nọ n’otu ọgbakọ.
- source_word: κατηρτισμένοι
  choice: ka e jikọta unu nke ọma
  rationale: Nke a na-edobe echiche passive nke ịbụ ndị e doziri ma jikọta ọzọ nke ọma mgbe nkewa gasịrị.
- source_word: νοῒ
  choice: uche
  rationale: “Uche” na-egosi ụzọ mmadụ si eche echiche ma na-ahapụ ọdịiche dị n’etiti νοῦς na γνώμη.
- source_word: γνώμῃ
  choice: mkpebi
  rationale: “Mkpebi” na-egosi echiche e kpebisiri ike, nkwenye, ma ọ bụ ntụziaka mmadụ họọrọ; ọ dị iche na “uche” ma ghara ime ka okwu abụọ ahụ bụrụ otu.
theological_decisions:
- issue: Nsụgharị aha ọrụ Χριστός
  choice: Mesaya
  alternative: Kraịst
  rationale: N’ebe a Χριστός ka nwere ike aha ọrụ ya, ya mere “Mesaya” na-eme ka ihe aha ahụ pụtara pụta ìhè n’enweghị ịgbanwe onye ọ na-ekwu maka ya.
- issue: Ndị ἀδελφοί na-agụnye
  choice: Ụmụnna m n’ahịrị bụ isi, ya na nkọwa na ọ nwere ike ịgụnye ụmụnna nwanyị
  alternative: Ụmụnne nwoke na ụmụnne nwanyị
  rationale: Nke a na-edobe ụdị ọtụtụ nke nwoke dị n’asụsụ Grik, ma nkọwa ala peeji na-eme ka o doo anya na Pọl na-agwa ọgbakọ ndị kwere ekwe dum okwu.
- issue: Ọdịiche dị n’etiti νοῦς na γνώμη
  choice: uche na mkpebi
  alternative: uche na echiche
  rationale: 'Okwu abụọ a ekwesịghị ịbụ otu kpamkpam: nke mbụ metụtara ụzọ iche echiche, nke abụọ metụtara ikpe, nkwenye, ma ọ bụ mkpebi mmadụ ji guzoro.'
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-edobe usoro arịrịọ Pọl, mmegide dị n’etiti nkewa na ijikọta ọnụ, nakwa ọdịiche dị n’etiti “uche” na “mkpebi.” E tinyeghị “ugbu a,” n’ihi na δέ bụ njikọ okwu dị nro, ọ bụghị okwu oge kpọmkwem.
