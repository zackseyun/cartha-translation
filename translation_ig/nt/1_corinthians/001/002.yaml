  to: 'Nye ọgbakọ Chineke dị na Kọrịnt, bụ́ ndị e doro nsọ n''ime Jizọs onye bụ Mezaịa ahụ[a], ndị a kpọrọ ka ha bụrụ ndị nsọ[b], tinyere ndị niile na-akpọku aha Onyenwe anyị Jizọs onye bụ Mezaịa ahụ[c] n''ebe niile—nke ha na nke anyị[d]:'
  rationale: 'The revisions are limited to idiomatic Igbo syntax: “bụ́ ndị” gives a smoother apposition, and “tinyere” accurately renders σὺν as a prepositional inclusion rather than a potentially independent coordination. The translation continues to preserve the source’s final syntactic ambiguity, and all footnotes remain correctly anchored.'
