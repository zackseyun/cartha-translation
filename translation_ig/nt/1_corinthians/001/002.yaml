id: 1CO.1.2
reference: 1 Corinthians 1:2
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τῇ ἐκκλησίᾳ τοῦ θεοῦ, ⸂ἡγιασμένοις ἐν Χριστῷ Ἰησοῦ, τῇ οὔσῃ ἐν Κορίνθῳ,⸃ κλητοῖς ἁγίοις, σὺν πᾶσιν τοῖς ἐπικαλουμένοις τὸ ὄνομα τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ ἐν παντὶ τόπῳ ⸀αὐτῶν καὶ ἡμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/002.yaml
  text: 'To the church of God that is in Corinth[a], to those sanctified in Messiah Jesus, called to be saints, together with all those who call on the name of our Lord Jesus the Messiah in every place[d][c][b], theirs and ours:'
translation:
  language: ig
  text: 'Nye ọgbakọ Chineke dị na Kọrịnt, bụ́ ndị e doro nsọ n''ime Jizọs onye bụ Mezaịa ahụ[a], ndị a kpọrọ ka ha bụrụ ndị nsọ[b], tinyere ndị niile na-akpọku aha Onyenwe anyị Jizọs onye bụ Mezaịa ahụ[c] n''ebe niile—nke ha na nke anyị[d]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “n'ime Kraịst Jizọs.”
    reason: lexical_alternative
  - marker: b
    text: 'N''ụzọ dị nso n''usoro okwu Grik: “ndị nsọ a kpọrọ.”'
    reason: lexical_alternative
  - marker: c
    text: A pụkwara ịsụgharị ya, “Jizọs Kraịst.”
    reason: lexical_alternative
  - marker: d
    text: Nkebi “n'ebe niile—nke ha na nke anyị” nwere ike ịpụta ebe niile ndị kwere ekwe na-akpọku Onyenwe anyị, ma ọ bụ ebe niile bụ́ nke ha na nke anyị.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκκλησίᾳ
  choice: ọgbakọ
  rationale: “Ọgbakọ” na-egosi ndị Chineke kpọkọtara dịka otu obodo okwukwe, ma ọ bụkwa okwu Igbo doro anya nke na-adịghị eme ka a ghọta naanị ụlọ ofufe.
- source_word: ἡγιασμένοις
  choice: ndị e doro nsọ
  rationale: Nke a na-edobe olu nnara nke Grik ma na-egosikwa omume e mere nke nsonaazụ ya ka dịgide.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: n'ime Jizọs onye bụ Mezaịa ahụ
  rationale: Nsụgharị a na-eme ka Χριστός pụta dịka aha ọkwá “Mezaịa,” ma na-edobe echiche mmekọrịta dị n'okwu ἐν.
- source_word: κλητοῖς ἁγίοις
  choice: ndị a kpọrọ ka ha bụrụ ndị nsọ
  rationale: Nke a bụ Igbo dị mfe ma kwụ ọtọ nke na-egosi na ọkpụkpọ Chineke metụtara ọnọdụ ha dịka ndị nsọ, n'agbanyeghị na Grik n'onwe ya enweghị okwu infinitive.
- source_word: ἐπικαλουμένοις τὸ ὄνομα
  choice: ndị na-akpọku aha
  rationale: “Ịkpọku aha” bụ ụzọ Igbo kwesịrị ekwesị isi gosi ịrịọ, ife ofufe, na ikwupụta ntụkwasị obi n'Onyenwe anyị.
- source_word: κυρίου
  choice: Onyenwe anyị
  rationale: Nke a bụ okwu Igbo a na-ejikarị eme ihe maka κύριος n'okwu nkwupụta okwukwe banyere Jizọs.
- source_word: ἐν παντὶ τόπῳ αὐτῶν καὶ ἡμῶν
  choice: n'ebe niile—nke ha na nke anyị
  rationale: A hapụrụ nkebi a ka ọ dị mkpirikpi dịka Grik, ka a ghara ikpebi n'ike ma “nke ha na nke anyị” na-akọwa ebe ndị ahụ ma ọ bụ njikọ ọzọ.
theological_decisions:
- issue: Nsụgharị Χριστός
  choice: Mezaịa
  alternative: Kraịst
  rationale: N'ebe abụọ a, Χριστός ka nwere ike ịbụ aha ọkwá ahụ nke pụtara onye Chineke tere mmanụ; ya mere “Mezaịa” na-eme ka ihe aha ọkwá ahụ pụtara doo anya kama ime ka ọ dị ka aha ezinụlọ.
- issue: Ihe κλητοῖς ἁγίοις pụtara
  choice: ndị a kpọrọ ka ha bụrụ ndị nsọ
  alternative: ndị nsọ a kpọrọ
  rationale: Nhọrọ bụ isi bụ Igbo eke ma na-ejigide njikọ dị n'etiti ọkpụkpọ Chineke na ịdị nsọ ha; ihe ọzọ dị nso karịa n'ụdị mkpụrụokwu Grik ma ọ naghị ada mfe otu ahụ n'Igbo.
- issue: Njikọ αὐτῶν καὶ ἡμῶν
  choice: e debere ya dịka nkebi na-edochaghị anya
  alternative: ebe bụ nke ha na nke anyị
  rationale: Grik dị mkpirikpi ma nwee ike ịkọwa “ebe niile” n'ụzọ karịrị otu; nsụgharị ahụ na ihe edeturu ala anaghị ekpebi ihe ederede ahụ na-ekpebighị.
translation_notes:
  register: E ji Standard Igbo nke dị ugbu a, dị ùgwù, ma dị mfe nghọta. “Ọgbakọ” na-elekwasị anya n'obodo ndị kwere ekwe, “e doro nsọ” na-edobe omume Chineke n'olu nnara, ebe akara ogologo ahụ na-enyere aka idobe mkpirikpi na ihe na-edochaghị anya nke ngwụcha Grik.
