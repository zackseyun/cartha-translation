id: 1CO.1.5
reference: 1 Corinthians 1:5
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὅτι ἐν παντὶ ἐπλουτίσθητε ἐν αὐτῷ, ἐν παντὶ λόγῳ καὶ πάσῃ γνώσει,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/005.yaml
  text: because in him you were enriched in every way, in all speech and all knowledge,
translation:
  language: ig
  text: n’ihi na n’ime ya, e mere ka unu baa ọgaranya n’ụzọ niile, n’okwu niile na n’ọmụma niile,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι
  choice: n’ihi na
  rationale: N’ebe a, ὅτι na-egosi ihe mere Pọl ji ekele Chineke n’amaokwu bu ụzọ; “n’ihi na” na-egosipụta njikọ a nke ọma.
- source_word: ἐν παντὶ
  choice: n’ụzọ niile
  rationale: Nkebiokwu a sara mbara, na-egosi ụdị ụzọ niile; “n’ụzọ niile” bụ Igbo doro anya ma dị mfe karịa ntụgharị mkpụrụokwu n’otu n’otu.
- source_word: ἐπλουτίσθητε
  choice: e mere ka unu baa ọgaranya
  rationale: Nhọrọ a na-edobe olu nnara nke ngwaa Grik ahụ, na-egosi na ọ bụ onye ọzọ mere ka ha baa ọgaranya, ma na-ahapụkwa ihe atụ nke akụnụba ka ọ dị.
- source_word: ἐν αὐτῷ
  choice: n’ime ya
  rationale: “N’ime ya” na-edobe echiche nke ịnọ n’ime Kraịst ma ọ bụ ịdị n’otu na ya, kama ịgbanwe ya ka ọ bụrụ nanị “site n’aka ya.”
- source_word: ἐν παντὶ λόγῳ
  choice: n’okwu niile
  rationale: λόγος nwere ike ịpụta okwu, ozi, ma ọ bụ ikwu okwu. N’ịjikọta ya na γνώσει, “okwu niile” na-edobe obosara na ntakịrị mgbagwoju anya nke okwu Grik ahụ n’Igbo dị nkenke.
- source_word: πάσῃ γνώσει
  choice: n’ọmụma niile
  rationale: “Ọmụma niile” na-egosipụta γνώσει n’ụzọ sara mbara ma na-edobe nhazi yiri ibe ya nke “okwu niile na ọmụma niile.”
theological_decisions:
- issue: Ihe ἐν αὐτῷ pụtara
  choice: n’ime ya
  alternative: site n’aka ya
  rationale: A họọrọ ntụgharị nke na-edobe asụsụ Pọl banyere ịdị n’ime Kraịst; e zere ime ka preposition ahụ pụta naanị onye ji aka ya mee ihe.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. “E mere ka unu baa ọgaranya” na-edobe ihe atụ ahụ na olu nnara, ebe “okwu niile na ọmụma niile” na-edobe usoro abụọ yiri ibe ha n’isi mmalite.
