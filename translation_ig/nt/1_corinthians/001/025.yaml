source:
  edition: SBLGNT
  text: ὅτι τὸ μωρὸν τοῦ θεοῦ σοφώτερον τῶν ἀνθρώπων ἐστίν, καὶ τὸ ἀσθενὲς τοῦ θεοῦ ἰσχυρότερον τῶν ⸀ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/025.yaml
  text: Because the foolishness of God is wiser than people, and the weakness of God is stronger than people.
translation:
  language: ig
  text: N’ihi na nzuzu Chineke maara ihe karịa ụmụ mmadụ, adịghị ike Chineke dịkwa ike karịa ụmụ mmadụ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι
  choice: N’ihi na
  rationale: Ọ na-egosi ihe kpatara okwu bu ya ụzọ ma na-edobe njikọ arụmụka Pọl.
- source_word: τὸ μωρὸν τοῦ θεοῦ
  choice: ihe ahụ nke Chineke nke yiri nzuzu
  rationale: Ụdị Grik ahụ na-ekwu banyere ‘ihe nzuzu nke Chineke’; itinye ‘nke yiri’ na-egbochi nghọtahie na Chineke bụ onye nzuzu, ma na-egosipụta ntụnyere Pọl n’ụzọ Igbo nkịtị.
- source_word: σοφώτερον
  choice: maara ihe karịa
  rationale: Nke a na-ebute ogo ntụnyere nke okwu Grik n’ụzọ doro anya ma dị ndụ n’Igbo.
- source_word: τὸ ἀσθενὲς τοῦ θεοῦ
  choice: ihe ahụ nke Chineke nke yiri adịghị ike
  rationale: Ọ na-edobe ntụnyere yiri nke ahịrịokwu mbụ ma gosi na ọ bụ ihe ndị mmadụ na-ele anya dị ka adịghị ike.
- source_word: ἰσχυρότερον
  choice: dị ike karịa
  rationale: Ọ bụ ntụgharị kwụ ọtọ, nke eke, nke ogo ntụnyere okwu Grik.
- source_word: τῶν ἀνθρώπων
  choice: ụmụ mmadụ
  rationale: Ọ na-agụnye mmadụ niile, ọ bụghị naanị ndị nwoke, dị ka ἄνθρωποι si arụ ọrụ ebe a.
theological_decisions:
- issue: Ma a ga-asị na Chineke nwere nzuzu na adịghị ike n’ezie
  choice: Jiri ‘nke yiri nzuzu’ na ‘nke yiri adịghị ike.’
  alternative: ‘nzuzu nke Chineke’ na ‘adịghị ike nke Chineke’
  rationale: Okwu Pọl bụ ntụnyere na-akpali akpali banyere ihe Chineke nke ụwa na-ewere dị ka nzuzu ma ọ bụ adịghị ike; nhọrọ a na-echekwa ike okwu ahụ n’enweghị ịkụzi na nzuzu ma ọ bụ enweghị ike bụ àgwà Chineke.
translation_notes:
  register: Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E debere nhazi ahịrịokwu abụọ yiri ibe ha na ntụnyere ‘karịa ụmụ mmadụ.’
