  source_fidelity: 'The draft accurately represents the Greek: αὐτοῖς δέ is conveyed by “Ma nye,” τοῖς κλητοῖς by the appropriately unexpanded passive expression “ndị a kpọrọ òkù,” and the paired datives “ma ndị Juu ma ndị Grik” preserve both groups. “Mesaya” faithfully translates the active titular force of Χριστόν, while “bụ ike Chineke na amamihe Chineke” clearly supplies the implicit predicative relation and retains the repeated θεοῦ structure.'
