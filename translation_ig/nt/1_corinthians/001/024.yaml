id: 1CO.1.24
reference: 1 Corinthians 1:24
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: αὐτοῖς δὲ τοῖς κλητοῖς, Ἰουδαίοις τε καὶ Ἕλλησιν, Χριστὸν θεοῦ δύναμιν καὶ θεοῦ σοφίαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/024.yaml
  text: But to those who are called[a], both Jews and Greeks, Messiah is the power of God and the wisdom of God.
translation:
  language: ig
  text: Ma nye ndị a kpọrọ òkù, ma ndị Juu ma ndị Grik, Mesaya[a] bụ ike Chineke na amamihe Chineke.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, Kraịst.
    reason: lexical_alternative
lexical_decisions:
- source_word: κλητοῖς
  choice: ndị a kpọrọ òkù
  rationale: Okwu a bụ nkọwa e ji dochie aha, na-egosi ìgwè mmadụ a kpọrọ. Nsụgharị a na-edobe echiche nke ịkpọ mmadụ ma na-ada nke ọma n’Igbo.
- source_word: Ἰουδαίοις
  choice: ndị Juu
  rationale: N’ebe a, a na-atụnyere ha ndị Grik; ya mere ‘ndị Juu’ na-egosi nke ọma agbụrụ na okpukpe okwu ahụ na-ezo aka na ha.
- source_word: Ἕλλησιν
  choice: ndị Grik
  rationale: Nke a na-asụgharị okwu Grik ahụ kpọmkwem, kama ịgbasa ya ka ọ bụrụ ‘ndị mba ọzọ.’
- source_word: Χριστόν
  choice: Mesaya
  rationale: N’ebe a Χριστός na-arụ ọrụ dị ka utu aha nke Onye E Tere Mmanụ; ‘Mesaya’ na-edobe ihe utu aha ahụ pụtara, ebe ‘Kraịst’ bụkwa ụdị a na-ejikarị eme ihe.
- source_word: θεοῦ δύναμιν
  choice: ike Chineke
  rationale: Nke a na-edobe njikọ genitive ahụ n’ụzọ dị nkenke ma bụrụkwa Igbo nkịtị.
- source_word: θεοῦ σοφίαν
  choice: amamihe Chineke
  rationale: Nke a na-edobe usoro okwu e ji kwughachi ‘Chineke’ n’amaokwu Grik ahụ.
- source_word: implicit copula / verbless predicate relation
  choice: Mesaya bụ ike Chineke na amamihe Chineke
  rationale: Ọ bụ ezie na ngwaa njikọ adịghị n’ahịrịokwu Grik a, ‘bụ’ na-eme ka mmekọrịta prediketi ahụ doo anya ma mee ka amaokwu ahụ guzozie nke ọma n’Igbo.
theological_decisions:
- issue: Nsụgharị Χριστός dị ka utu aha metụtara Mesaya
  choice: Mesaya
  alternative: Kraịst
  rationale: ‘Mesaya’ na-egosipụta ihe utu aha Χριστός pụtara, ya bụ Onye E Tere Mmanụ, n’enweghị ịgbakwunye nkọwa ozizi ọzọ. E debere ‘Kraịst’ n’ala peeji dị ka ụdị ọzọ a na-ejikarị eme ihe.
- issue: Onye kpọrọ ndị ahụ
  choice: ndị a kpọrọ òkù
  alternative: ndị Chineke kpọrọ òkù
  rationale: Grik ahụ ekwughị onye kpọrọ ha n’ahịrịokwu a. Ịhapụ ya n’ụdị passive na-echekwa ihe e kwughị hoo haa, ọ bụ ezie na gburugburu okwu ahụ na-egosi ọkpụkpọ Chineke.
translation_notes:
  register: E ji Igbo ọkọlọtọ nke oge a, dị ùgwù ma dị mfe nghọta. E chekwara nkwughachi ‘Chineke’ dị n’akwụkwọ Grik, nakwa ọdịiche dị n’etiti ndị Juu na ndị Grik.
