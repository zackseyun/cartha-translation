id: 1CO.1.13
reference: 1 Corinthians 1:13
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: μεμέρισται ὁ Χριστός; μὴ Παῦλος ἐσταυρώθη ὑπὲρ ὑμῶν, ἢ εἰς τὸ ὄνομα Παύλου ἐβαπτίσθητε;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/013.yaml
  text: Has Messiah been divided? Was Paul crucified for you? Or were you baptized into the name of Paul?[a][b]
translation:
  language: ig
  text: E kewala Mesaịa? À kpọgidere Pọl n’obe n’ihi unu? Ma ọ bụ, è mere unu baptizim n’aha Pọl?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “E kewala Kraịst?”
    reason: lexical_alternative
  - marker: b
    text: N’ụzọ nkịtị, “è mere unu baptizim banye n’aha Pọl?”
    reason: literal_rendering
lexical_decisions:
- source_word: μεμέρισται
  choice: E kewala
  rationale: Okwu a na-egosi ihe e mere nke ọnọdụ ya ka dị ugbu a. “E kewala” na-edobe olu nnara na ajụjụ ịba mba Pọl n’enweghị ịkọwa ya karịa ihe ederede kwuru.
- source_word: ὁ Χριστός
  choice: Mezaịa
  rationale: Nkọwa aha ahụ pụtara ìhè n’ihi njirimara ὁ; ya mere “Mezaịa” na-ebute echiche nke Onye E Tere Mmanụ, kama iji ya dịka naanị aha mmadụ.
- source_word: μὴ
  choice: pụtara ìhè site n’ụdị ajụjụ ahụ
  rationale: μὴ na-egosi ajụjụ a na-atụ anya ka azịza ya bụrụ mba. Igbo na-egosipụta nke a nke ọma site n’ajụjụ ahụ n’onwe ya, n’etinyeghị okwu nkọwa ọzọ.
- source_word: ἐσταυρώθη
  choice: À kpọgidere ... n’obe
  rationale: Nke a bụ ntụgharị doro anya nke aorist passive ma na-eji okwu Igbo a na-ahụkarị maka ịkpọgide mmadụ n’obe.
- source_word: ὑπὲρ ὑμῶν
  choice: n’ihi unu
  rationale: “N’ihi unu” bụ Igbo nkịtị nke nwere ike iburu echiche nke ime ihe maka ọdịmma ma ọ bụ n’ọnọdụ mmadụ, n’enweghị ịmanye otu nkọwa nkà mmụta okpukpe.
- source_word: εἰς τὸ ὄνομα
  choice: banye n’aha
  rationale: “Banye n’aha” na-edobe ike ntụzịaka nke εἰς na njikọ ọhụrụ baptizim na-egosi; e nyere “n’aha” dịka ụzọ ọzọ dị mfe ma bụrụ nke a na-ahụkarị.
- source_word: ἐβαπτίσθητε
  choice: è mere unu baptizim
  rationale: Nke a na-egosipụta ihe e mere unu ma na-edobe ajụjụ Pọl n’asụsụ Igbo dị mfe nghọta.
theological_decisions:
- issue: Otu e si atụgharị Χριστός n’ajụjụ a
  choice: Mezaịa
  alternative: Kraịst
  rationale: ὁ Χριστός nwere ọrụ aha-ọkwa n’ebe a, ya mere “Mezaịa” na-ekwupụta ihe aha-ọkwa ahụ pụtara. “Kraịst” ka bụ ụzọ ọdịnala ziri ezi, e tinyekwara ya n’ala ala peeji.
- issue: Ike nke εἰς n’okwu baptizim
  choice: banye n’aha Pọl
  alternative: n’aha Pọl
  rationale: “Banye n’aha” na-echekwa echiche ntụzịaka ma ọ bụ njikọ dị n’okwu Grik, ma “n’aha” bụkwa ntụgharị Igbo a na-ahụkarị nke nwere ike igosi ikike ma ọ bụ njirimara.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Akara ụda dị na “À” na “è” na-enyere aka igosi ajụjụ nke ọma; ahịrịokwu atọ ahụ na-edobe ịdị nkọ na usoro ajụjụ nkwutọ nke isi mmalite Grik.
