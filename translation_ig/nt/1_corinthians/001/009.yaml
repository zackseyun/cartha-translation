id: 1CO.1.9
reference: 1 Corinthians 1:9
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: πιστὸς ὁ θεὸς δι’ οὗ ἐκλήθητε εἰς κοινωνίαν τοῦ υἱοῦ αὐτοῦ Ἰησοῦ Χριστοῦ τοῦ κυρίου ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/009.yaml
  text: God is faithful[a], by whom you were called into fellowship with his Son[c][b], Jesus the Messiah our Lord.
translation:
  language: ig
  text: Chineke kwesịrị ntụkwasị obi. Ọ bụ site n’aka ya[a] ka a kpọrọ unu ka unu na Ọkpara ya nwee mmekọrịta[b]—ya bụ, Jizọs bụ́ Mesaịa ahụ[c], Onyenwe anyị.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ọ bụ site na ya.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ “ikekọrịta” ma ọ bụ “ikere òkè.”
    reason: lexical_alternative
  - marker: c
    text: N’asụsụ Grik, “Jizọs Kraịst”; “Mesaịa” bụ nsụgharị utu aha Χριστός.
    reason: alternative_reading
lexical_decisions:
- source_word: πιστὸς
  choice: kwesịrị ntụkwasị obi
  rationale: Nkebiokwu a na-egosi na Chineke bụ onye a pụrụ ịdabere na ya, ma na-edowe echiche banyere ikwesị ntụkwasị obi ya n’asụsụ Igbo dị mfe ma dị ùgwù.
- source_word: δι’ οὗ
  choice: site n’aka ya
  rationale: διά tinyere genitive nwere ike igosi onye e si n’aka ya mee ihe ma ọ bụ onye e ji mee ya. “Site n’aka ya” na-egosi ọrụ Chineke n’ịkpọ ha ma na-ahapụkwa obosara okwu Grik ahụ.
- source_word: ἐκλήθητε
  choice: a kpọrọ unu
  rationale: E dowere ụdị passive nke okwu Grik ahụ na echiche Pọl banyere ọkpụkpọ Chineke, n’ebughị ụzọ kọwaa ma ọ bụ mee ka ọ bụrụ nanị òkù nkịtị.
- source_word: κοινωνίαν
  choice: mmekọrịta
  rationale: “Mmekọrịta” na-ekpuchi ịdị n’otu na ikekọrịta ndụ, ma ọ naghị akpọchi okwu ahụ n’otu nghọta ụka pụrụ iche.
- source_word: τοῦ υἱοῦ αὐτοῦ
  choice: ka unu na Ọkpara ya nwee mmekọrịta
  rationale: Ọ bụ ụzọ Igbo si ekwu n'ụzọ ebumpụta ụwa banyere mmekọrịta mmadụ na onye ọzọ, ebe ọ ka na-edowe njikọ genitive nke κοινωνία na Ọkpara ahụ.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jizọs bụ́ Mesaịa ahụ
  rationale: A sụgharịrị Χριστός dị ka utu aha “Mesaịa,” ebe a translitere aha Ἰησοῦ dị ka “Jizọs.”
- source_word: κυρίου
  choice: Onyenwe
  rationale: “Onyenwe” bụ okwu Igbo a na-ejikarị asụgharị κύριος dị ka utu aha Kraịst, ma ọ dabara na “anyị” nke na-eso ya.
theological_decisions:
- issue: Ma Χριστός ga-abụ “Kraịst” dị ka aha a translitere, ka ọ bụ “Mesaịa” dị ka utu aha a sụgharịrị.
  choice: Mesaịa ahụ
  alternative: Kraịst
  rationale: N’usoro “Jizọs Kraịst,” okwu ahụ amalitela ịdị ka aha, ma ọ ka bu echiche nke onye e tere mmanụ. “Mesaịa ahụ” na-eme ka utu aha ahụ pụta ìhè n’enweghị itinye ozizi otu ụka.
- issue: Ma κοινωνία na-egosi mmekọrịta “na” Ọkpara ahụ, ka ọ bụ ikere òkè “n’ime” ya.
  choice: ka unu na Ọkpara ya nwee mmekọrịta
  alternative: ka unu kere òkè n’ime Ọkpara ya
  rationale: Genitive ahụ nwere ike ibu echiche mmekọrịta na nke ikere òkè. Isi ederede jiri okwu Igbo kachasị eke maka mmekọrịta mmadụ na onye ọzọ, ebe ndetu ala peeji chekwara obosara nke okwu ahụ.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị mfe ma dị ùgwù. E kewara ahịrịokwu ahụ ụzọ abụọ maka nghọta doro anya; em dash na “ya bụ” na-eme ka Jizọs doo anya dị ka Ọkpara ahụ. E zere okwu ụka pụrụ iche nke nwere ike ime ka κοινωνία bụrụ naanị emume sacrament.
