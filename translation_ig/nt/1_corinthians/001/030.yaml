id: 1CO.1.30
reference: 1 Corinthians 1:30
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐξ αὐτοῦ δὲ ὑμεῖς ἐστε ἐν Χριστῷ Ἰησοῦ, ὃς ἐγενήθη ⸂σοφία ἡμῖν⸃ ἀπὸ θεοῦ, δικαιοσύνη τε καὶ ἁγιασμὸς καὶ ἀπολύτρωσις,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/030.yaml
  text: And it is from him that you are in Messiah Jesus[a], who became for us wisdom from God, and righteousness and sanctification and redemption,
translation:
  language: ig
  text: Ma ọ bụ site n’aka ya ka unu nọ n’ime Mesaịa Jizọs, onye ghọọrọ anyị amamihe nke si n’aka Chineke, na ezi omume[a], na ido nsọ, na mgbapụta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ikpe ziri ezi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξ αὐτοῦ
  choice: site n’aka ya
  rationale: Nke a na-egosi na ọnọdụ ndị kwere ekwe n’ime Mesaịa Jizọs sitere na Chineke, ma ọ na-ada nke ọma n’Igbo.
- source_word: ἐν
  choice: n’ime
  rationale: Ọ na-echekwa okwu Pọl banyere ịnọ n’ime Mesaịa, kama ịkọwa ya karịa ihe Grik kwuru.
- source_word: Χριστῷ
  choice: Mesaịa
  rationale: A sụgharịrị aha-ọrụ Χριστός dịka “Mesaịa” iji mee ka ihe aha ahụ pụtara doo anya, ọ bụghị ime ya ka ọ bụrụ naanị aha mmadụ.
- source_word: ἐγενήθη
  choice: ghọọrọ
  rationale: “Ghọọrọ anyị” na-egosipụta n’Igbo nke ọma ihe onye ahụ ghọrọ nye ndị kwere ekwe.
- source_word: σοφία
  choice: amamihe
  rationale: Ọ bụ okwu Igbo doro anya maka σοφία, ma kwekọọ na isiokwu amamihe dị n’akụkụ amaokwu a.
- source_word: ἀπὸ θεοῦ
  choice: nke si n’aka Chineke
  rationale: Nke a na-echekwa echiche nke isi mmalite—amamihe ahụ sitere na Chineke—na-enweghị itinye nkọwa ọzọ.
- source_word: δικαιοσύνη
  choice: ezi omume
  rationale: “Ezi omume” bụ okwu Igbo a na-aghọta nke ọma maka ọnọdụ ma ọ bụ omume ziri ezi; a debere “ikpe ziri ezi” n’ala peeji dịka ụzọ ọzọ.
- source_word: ἁγιασμός
  choice: ido nsọ
  rationale: Ọ na-egosipụta ime ka mmadụ dị nsọ ma ọ bụ ikewapụ ya nye Chineke, ma bụrụkwa okwu a maara n’Igbo Ndị Kraịst.
- source_word: ἀπολύτρωσις
  choice: mgbapụta
  rationale: “Mgbapụta” na-echekwa echiche nke ịtọhapụ mmadụ n’ohu ma ọ bụ n’aka ihe jidere ya.
theological_decisions:
- issue: Mmekọrịta “amamihe nke si n’aka Chineke” na aha atọ na-esochi ya
  choice: 'E debere usoro njikọ Grik: “amamihe nke si n’aka Chineke, na ezi omume, na ido nsọ, na mgbapụta.”'
  alternative: A pụrụ ịkọwa aha atọ ikpeazụ dịka nkọwa kpọmkwem nke “amamihe,” ma ọ bụ mee ka “nke si n’aka Chineke” metụta aha anọ ahụ niile.
  rationale: Usoro a anaghị ekpebi kpamkpam ma aha atọ ikpeazụ hà bụ nkọwa nke amamihe ma ọ bụ ihe ndị ọzọ e depụtara n’otu usoro; ya mere ọ na-echekwa mgbagwoju anya dị na Grik.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta. E jigidere “n’ime Mesaịa Jizọs” iji chekwaa asụsụ njikọta nke Pọl, n’agbanyeghị na “dịrị n’otu na Mesaịa Jizọs” ga-abụ nkọwa doro anya karịa.
