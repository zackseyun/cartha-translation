id: 1CO.1.29
reference: 1 Corinthians 1:29
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὅπως μὴ καυχήσηται πᾶσα σὰρξ ἐνώπιον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/029.yaml
  text: so that no flesh may boast before God[a].
translation:
  language: ig
  text: ka anụ ahụ ọ bụla ghara ịnya isi n’ihu Chineke.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ka mmadụ ọ bụla ghara ịnya isi n’ihu Chineke.” N’ụzọ nkịtị, “anụ ahụ ọ bụla.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπως
  choice: ka
  rationale: Ọ na-egosi nzube ma ọ bụ ihe si na ya pụta; “ka” bụ ụzọ Igbo nkịtị si webata ahịrịokwu nzube.
- source_word: μὴ καυχήσηται
  choice: ghara ịnya isi
  rationale: Ngwakọta μὴ na ngwaa subjunctive na-egosi ihe a chọrọ ka ọ ghara ime; “ghara ịnya isi” na-egosipụta nke a n’Igbo doro anya.
- source_word: πᾶσα σὰρξ
  choice: anụ ahụ ọ bụla
  rationale: N’okpuru nkwusị μὴ, okwu a na-ewepụ mmadụ niile. Idebe “anụ ahụ” na-echekwa ihe oyiyi Pọl ji mee ihe, ebe “ọ bụla” na-egosipụta πᾶσα.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: n’ihu Chineke
  rationale: 'Nke a bụ okwu Igbo dị mkpirikpi ma kwekọọ n’ihe Grik ahụ pụtara: n’ihu ma ọ bụ n’ọnụnọ Chineke.'
theological_decisions:
- issue: Nsụgharị σάρξ n’okwu Pọl a
  choice: anụ ahụ
  alternative: mmadụ; mmadụ ọ bụla; ọdịdị mmehie
  rationale: N’ebe a, σάρξ anaghị egosi ụkpụrụ mmehie dị n’ime mmadụ, kama ọ na-anọchi anya mmadụ n’adịghị ike ya n’ihu Chineke. “Anụ ahụ” na-echekwa okwu na esemokwu dị n’ụdị okwu Pọl, ebe nkọwa ala peeji na-eme ka ihe ọ pụtara doo anya.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E debere ihe oyiyi “anụ ahụ” n’isiokwu, tinyekwa nkọwa ala peeji iji gosi na ọ na-ezo aka n’ụmụ mmadụ niile.
