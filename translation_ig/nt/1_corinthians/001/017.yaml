source:
  edition: SBLGNT
  text: οὐ γὰρ ἀπέστειλέν με Χριστὸς βαπτίζειν ἀλλὰ εὐαγγελίζεσθαι, οὐκ ἐν σοφίᾳ λόγου, ἵνα μὴ κενωθῇ ὁ σταυρὸς τοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/017.yaml
  text: For Messiah did not send me to baptize[a], but to proclaim the good news—not in wisdom of speech[c][b], so that the cross of Messiah might not be emptied.
translation:
  language: ig
  text: N’ihi na Mesaịa eziteghị m ịbaptizim ndị mmadụ[a], kama ka m kwusaa ozi ọma—ọ bụghị n’amamihe nke okwu[b]—ka a ghara ime ka obe Mesaịa ghọọ ihe efu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ime ndị mmadụ baptizim site n’ịmikpu ha na mmiri.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “site n’okwu e ji amamihe na nka kwuo”; n’ụzọ nkịtị, “n’amamihe nke okwu.”
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “ka obe Mesaịa ghara ịdị irè,” ma ọ bụ “ka a ghara iwepụ ike ya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Χριστὸς / τοῦ Χριστοῦ
  choice: Mezaịa / nke Mezaịa
  rationale: A sụgharịrị aha-ọkwa ahụ dị ka “Mezaịa” iji mee ka ihe Χριστός pụtara pụta ìhè, kama iji naanị okwu ọdịnala “Kraịst.” E jikwa otu nsụgharị ahụ mee ihe n’ebe abụọ ahụ.
- source_word: βαπτίζειν
  choice: ime ndị mmadụ baptizim
  rationale: “Ime baptizim” bụ okwu ụka ndị Igbo maara nke ọma; itinye “ndị mmadụ” mere ka ngwaa ahụ doo anya ma ghara ịkọwapụta usoro baptizim karịa ihe Grik kwuru.
- source_word: εὐαγγελίζεσθαι
  choice: ikwusa ozi ọma
  rationale: Nke a na-egosi omume ikwusa ozi ọma n’asụsụ Igbo doro anya ma dị ugbu a.
- source_word: σοφίᾳ λόγου
  choice: n’amamihe nke okwu
  rationale: Nsụgharị a nọ nso n’usoro Grik ma na-ahapụ ohere ma Pọl ọ na-ekwu banyere amamihe e ji ekwu okwu, nka ikwu okwu, ma ọ bụ okwu ndị e mere ka ha maa mma.
- source_word: κενωθῇ
  choice: ka a ghara ime ka ... ghọọ ihe efu
  rationale: E debere echiche ngwaa passive nke pụtara ime ka ihe bụrụ ihe efu ma ọ bụ ghara ịdị irè, n’etinyeghị “ike” n’ahịrị bụ́ isi ebe Grik ekwughị ya kpọmkwem.
- source_word: σταυρὸς
  choice: obe
  rationale: “Obe” bụ nsụgharị Igbo kwụ ọtọ, nke a na-aghọta nke ọma maka σταυρός.
theological_decisions:
- issue: Ma a ga-asụgharị Χριστός dị ka aha-ọkwa ma ọ bụ dee ya dịka okwu ọdịnala “Kraịst.”
  choice: Mezaịa
  alternative: Kraịst
  rationale: N’amaokwu a, “Mezaịa” na-eme ka ihe aha-ọkwa Grik pụtara doo anya, ma ọ naghị etinye nkọwa otu ụka pụrụ iche.
- issue: Ihe “ime ka obe Mezaịa ghọọ ihe efu” pụtara.
  choice: E debere ihe atụ ahụ dịka o siri dị n’isiokwu bụ́ isi.
  alternative: Ime ka obe Mezaịa ghara ịdị irè / ghara inwe ike
  rationale: Grik na-eji κενόω, “ime ka ọ bụrụ ihe efu.” Ịgbakwunye “ike” ga-akọwa ihe a pụrụ ịghọta na ya, ma okwu ahụ adịghị kpọmkwem na isi mmalite.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị ugwu ma dị mfe nghọta. Ahịrị ahụ na-edebe ọdịiche Pọl mere n’etiti ime baptizim na ikwusa ozi ọma, na-enweghị ikwu na baptizim adịghị mkpa. E debere ihe atụ nke “ime obe ... ghọọ ihe efu,” ebe nkọwa ndị ọzọ nọ n’ala peeji.
