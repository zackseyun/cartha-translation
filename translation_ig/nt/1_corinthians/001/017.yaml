  naturalness: “Ịbaptizim ndị mmadụ” is more idiomatic and concise than “ime ndị mmadụ baptizim.” Recasting the second half with infinitives follows both Igbo flow and the Greek construction more closely. “N’amamihe nke okwu” is understandable and appropriately preserves the rhetorical ambiguity.
  terminology: Use “Mesaịa” consistently for Χριστός, retaining the project’s title-translation policy. “Obe” and “ozi ọma” are suitable established terms.
