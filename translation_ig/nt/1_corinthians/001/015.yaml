  yaml_path: translation/nt/1_corinthians/001/015.yaml
  text: so that no one may say that you were baptized into my name[a].
translation:
  language: ig
  text: ka onye ọ bụla ghara ikwu na e mere unu baptizim banye n'aha m[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n'aha m.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: ka ... ghara
  rationale: Nke a na-egosi ebumnuche ma ọ bụ ihe a chọrọ izere; usoro a bụ Igbo nkịtị ma na-edobe ọrụ nkebiokwu ahụ.
- source_word: μή τις
  choice: onye ọ bụla ghara
  rationale: N'ime usoro ahịrịokwu a, ọ na-egosi na e kwesịghị inwe onye ga-ekwu ihe ahụ; ntụgharị a bụ nke doro anya n'Igbo.
- source_word: εἴπῃ
  choice: ikwu
  rationale: Ngwaa a dị n'okpuru usoro 'ka ... ghara' ma na-edobe echiche nke ihe nwere ike ime.
- source_word: εἰς
  choice: baa n'
  rationale: Ọ na-edobe echiche ntụziaka nke εἰς, ya bụ ịbanye n'ime njikọ e ji aha ahụ mara, kama ime ka ọ bụrụ naanị 'n'aha.'
- source_word: τὸ ἐμὸν ὄνομα
  choice: aha m
  rationale: Nke a bụ ụzọ Igbo dị mfe ma kwekọọ n'ụzọ ziri ezi isi kwuo ihe onye nwe ya bụ 'm.'
- source_word: ἐβαπτίσθητε
  choice: e mere unu baptizim
  rationale: Ọ na-edobe olu nnara nke ngwaa Grik ma jiri okwu baptizim a maara nke ọma, na-enweghị ịkwado otu usoro ime baptizim karịa nke ọzọ.
theological_decisions:
- issue: Otú e si tụgharị εἰς τὸ ἐμὸν ὄνομα n'okwu gbasara baptizim
  choice: baa n'aha m
  alternative: n'aha m
  rationale: “Baa n'aha m” na-anwa idobe ike ntụziaka nke εἰς na echiche njikọ ma ọ bụ njirimara dị n'okwu ahụ. “N'aha m” bụkwa ntụgharị Igbo kwere omume ma bụrụ nke e nyere n'ala peeji ka a ghara imechi mgbagwoju anya dị n'okwu Grik.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke ugbu a, dị ùgwù ma dị mfe nghọta. E debere usoro olu nnara na ọdịiche dị n'etiti “baa n'aha” na “n'aha.”
