translation:
  language: ig
  text: dịka e mere ka àmà banyere Mesaịa guzosie ike n’etiti unu[b][a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “àmà nke Mesaịa.”
