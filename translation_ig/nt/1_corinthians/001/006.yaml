lexical_decisions:
- source_word: καθὼς
  choice: dịka
  rationale: Ọ na-egosi ntụnyere ma ọ bụ nkwekọrịta ya na okwu bu ya ụzọ; “dịka” bụ Igbo doro anya ma na-echekwa njikọ ahụ.
- source_word: μαρτύριον
  choice: ihe akaebe
  rationale: Okwu a pụtara akaebe ma ọ bụ ịgba akaebe. “Ihe akaebe” na-echekwa echiche nke ihe a na-agba akaebe banyere ya n’etinyeghị nkọwa gabigara ókè.
- source_word: τοῦ Χριστοῦ
  choice: banyere Mesaịa
  rationale: A ghọtara genitive a dị ka nke na-egosi onye ihe akaebe ahụ gbasara. “Mesaịa” na-echekwa Χριστός dị ka aha ọkwá.
- source_word: ἐβεβαιώθη
  choice: e mere ka ... guzosie ike
  rationale: Passive a na-egosi na e mere ka ihe ahụ sie ike ma ọ bụ bụrụ nke a kwadoro; ntụgharị a na-echekwa ụdị passive na echiche nke nkwado.
- source_word: ἐν ὑμῖν
  choice: n’etiti unu
  rationale: Ebe ọ bụ na a na-agwa ọtụtụ mmadụ okwu, nke a na-egosi n’ụzọ ebumpụta ụwa na ihe ahụ mere n’ime obodo ha; “n’etiti unu” na-egosipụta nke ahụ.
theological_decisions:
- issue: Ike genitive dị na τοῦ Χριστοῦ
  choice: 'genitive nke ihe a na-ekwu banyere ya: “ihe akaebe banyere Mesaịa”'
  alternative: 'genitive nke isi mmalite ma ọ bụ onye nwe ya: “ihe akaebe nke Mesaịa”'
  rationale: N’ebe a, o yikarịrị ka Pọl na-ekwu maka akaebe ndị ozi gbara banyere Jizọs nke e mere ka o guzosie ike n’etiti ndị Kọrịnt; ma okwu Grik ahụ nwekwara ike ibu nghọta ọzọ, ya mere e debere ya n’ala ala peeji.
translation_notes:
  register: Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E debere usoro ahịrịokwu ahụ ka ọ jikọọ n’ụzọ doro anya na amaokwu bu ya ụzọ; akara nkọwa ala peeji niile pụtara n’ederede.
