revisions:
- from: Chineke họpụtakwara ihe ndị ụwa na-ewere dị ka ndị a mụrụ n’ọkwa dị ala na ihe ndị a na-eleda anya[a], ihe ndị na-adịghị adị, ka o wee mee ka ihe ndị dị adị ghara ịdị ire[b].
  to: Chineke họpụtakwara ihe ndị dị ala n’ọkwa n’anya ụwa na ihe ndị a na-eleda anya[a], ihe ndị na-adịghị adị, ka o wee mee ka ihe ndị dị adị ghara ịba uru[b].
  rationale: The revision retains the Greek plural neuter wording and its rhetorical contrast while making the social-status expression for ἀγενῆ and the functional sense of καταργήσῃ natural in contemporary Standard Igbo. Footnote anchors and their lexical alternatives are retained.
  reviewer_model: gpt-5.6-terra
