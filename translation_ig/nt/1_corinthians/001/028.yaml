source:
  edition: SBLGNT
  text: καὶ τὰ ἀγενῆ τοῦ κόσμου καὶ τὰ ἐξουθενημένα ἐξελέξατο ὁ θεός, ⸀τὰ μὴ ὄντα, ἵνα τὰ ὄντα καταργήσῃ,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/028.yaml
  text: And God chose the lowborn things of the world and the despised things[a], the things that are not, to nullify the things that are[b],
translation:
  language: ig
  text: Chineke họpụtakwara ihe ndị dị ala n’ọkwa n’anya ụwa na ihe ndị a na-eleda anya[a], ihe ndị na-adịghị adị, ka o wee mee ka ihe ndị dị adị ghara ịba uru[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ihe ndị a na-ewere dị ka ihe efu.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ka o mee ka ha ghọọ ihe efu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγενῆ
  choice: ihe ndị ụwa na-ewere dị ka ndị a mụrụ n’ọkwa dị ala
  rationale: Nke a na-egosipụta enweghị ezi ọmụmụ ma ọ bụ ọkwa dị elu n’anya ọha mmadụ, ma na-eme ka echiche Grik ahụ doo onye Igbo nke oge a anya.
- source_word: ἐξουθενημένα
  choice: ihe ndị a na-eleda anya
  rationale: Nkebiokwu a na-egosi ihe ma ọ bụ ndị e lerela anya dị ka ndị na-abaghị uru ma ọ bụ ndị kwesịghị nsọpụrụ.
- source_word: τὰ μὴ ὄντα
  choice: ihe ndị na-adịghị adị
  rationale: Nsụgharị a na-edobe okwu Pọl dị egwu na nghọtahie o nwere ike ibu n’etiti adịghị adị n’ezie na ịbụ onye a na-ewere dị ka ihe efu.
- source_word: τὰ ὄντα
  choice: ihe ndị dị adị
  rationale: Ọ na-edobe ọdịiche ziri ezi e nwere n’etiti τὰ μὴ ὄντα na τὰ ὄντα.
- source_word: καταργήσῃ
  choice: mee ka ... ghara ịdị ire
  rationale: Nke a na-egosi ime ka ihe ghara ịrụ ọrụ, ghara inwe ike, ma ọ bụ ghara ịba uru, n’ebughị echiche nke ikpochapụ ya kpamkpam.
- source_word: ἐξελέξατο
  choice: họpụtakwara
  rationale: ‘Họpụtara’ bụ okwu Igbo kwụ ọtọ maka nhọrọ Chineke; ‘-kwara’ na-ejikọta amaokwu a na usoro nhọrọ ndị e kwuru n’amaokwu ndị gbara ya gburugburu.
theological_decisions:
- issue: Ma a ga-akọwa τὰ μὴ ὄντα / τὰ ὄντα ozugbo dị ka ọkwa ndị mmadụ n’anya ọha, ka a ga-edobe ọdịdị okwu Grik ahụ.
  choice: E debere ọdịiche ahụ dịka ‘ihe ndị na-adịghị adị’ / ‘ihe ndị dị adị.’
  alternative: ‘Ndị a na-ewere dị ka ihe efu’ / ‘ndị a na-ewere dị ka ndị bụ ihe.’
  rationale: Ọnọdụ okwu a metụtara ọkwa n’anya ụwa, ma Pọl ji okwu sara mbara ma dị ike. Nsụgharị nkịtị a na-echekwa ma ịdị nkọ nke okwu ya ma ike ya n’ihe gbasara ọkwa mmadụ, n’akọwaghị ya n’otu ụzọ naanị.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji ‘ihe ndị’ mee ihe n’ihi ụdị neuter plural nke Grik, ebe nkọwa gbara ya gburugburu ka na-enye ohere ịghọta na okwu ahụ gụnyere ndị mmadụ na ọkwa ha n’anya ụwa.
