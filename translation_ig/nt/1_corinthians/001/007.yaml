  text: ὥστε ὑμᾶς μὴ ὑστερεῖσθαι ἐν μηδενὶ χαρίσματι, ἀπεκδεχομένους τὴν ἀποκάλυψιν τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/007.yaml
  text: so that you do not lack any gift as you eagerly await the revelation of our Lord Jesus the Messiah[a][b][c].
translation:
  language: ig
  text: Nke mere na unu enweghị ụkọ n’onyinye amara ọ bụla[a], mgbe unu na-atụsi anya ike mkpughe[b] nke Onyenwe anyị Jizọs Kraịst[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “onyinye ime mmụọ ọ bụla” ma ọ bụ “onyinye ọ bụla sitere n’amara.”
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsị, “mpụta nke Onyenwe anyị Jizọs Kraịst.”
    reason: lexical_alternative
  - marker: c
    text: N’asụsụ Grik, “Jizọs Kraịst”; a pụkwara ịsị, “Jizọs Mesaya.” “Kraịst” pụtara “Mesaya,” ya bụ, Onye E Tere Mmanụ.
    reason: alternative_reading
lexical_decisions:
- source_word: ὥστε
  choice: N’ihi ya
  rationale: Ọ na-egosi ihe si n’amara Chineke a kọwara n’amaokwu ndị bu ụzọ pụta; nke a bụ ụzọ Igbo dị nkenke ma kwekọọ n’echiche ahụ.
- source_word: ὑμᾶς μὴ ὑστερεῖσθαι
  choice: unu adịghị akọ
  rationale: Nkebi a na-egosi na ọ dịghị ihe na-akọ ha; okwu Igbo a na-ekwupụta enweghị ụkọ n’ụzọ nkịtị.
- source_word: ἐν μηδενὶ χαρίσματι
  choice: ihe onyinye amara ọ bụla
  rationale: χαρίσμα bụ onyinye e nyere site n’amara. Ịsị “onyinye amara” na-edobe njikọ ahụ n’ụzọ doro anya n’enweghị ịkọwa ya naanị dị ka onyinye ime mmụọ.
- source_word: ἀπεκδεχομένους
  choice: ka unu ji agụụ na-atụ anya
  rationale: Ọ na-egosi ichere na-aga n’ihu, nke olileanya na agụụ siri ike so ya.
- source_word: ἀποκάλυψιν
  choice: mkpughe
  rationale: Nke a bụ ezigbo okwu Igbo maka ihe e kpughere ma kwekọọ n’asụsụ Pọl banyere nloghachi Kraịst, ebe ọ na-ahapụkwa ọdịiche dị n’etiti mkpughe na mpụta.
- source_word: κυρίου
  choice: Onyenwe anyị
  rationale: Nke a bụ nsụgharị Igbo a na-ejikarị eme κύριος dị ka aha nsọpụrụ n’Agba Ọhụrụ.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jizọs Kraịst
  rationale: N’ebe a, Χριστοῦ so Jizọs bụrụ aha a maara nke ọma; “Kraịst” na-edobe ụdị aha ahụ n’Igbo, ebe nkọwa ala peeji na-egosi ihe aha-ọrụ ahụ pụtara.
theological_decisions:
- issue: Otu e si asụgharị Χριστοῦ n’okwu Ἰησοῦ Χριστοῦ
  choice: Jizọs Kraịst
  alternative: Jizọs bụ Mesaya ahụ
  rationale: N’ahịrịokwu a, njikọta ahụ na-arụ ọrụ dịka aha a maara nke ọma karịa ebe a na-emesi aha-ọrụ Mesaya ike. A hapụrụ ụzọ ọzọ n’ala peeji ka ihe Χριστός pụtara ghara ifu.
- issue: Ihe ἀποκάλυψις na-ezo aka na ya
  choice: mkpughe
  alternative: mpụta
  rationale: “Mkpughe” bụ nsụgharị kacha nso na mkpụrụokwu Grik ma ọ naghị akpọchi ihe ahụ naanị n’echiche nke mpụta anya; “mpụta” ka edepụtara dịka ụzọ dabara n’ọnọdụ a.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị nsọpụrụ ma dị mfe nghọta. “Ji agụụ na-atụ anya” na-eburu ike dị na ἀπεκδεχομένους; “onyinye amara” na-echekwa njikọ χαρίσμα na amara n’enweghị itinye nkọwa otu ụka.
