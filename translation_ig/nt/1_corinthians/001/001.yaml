  to: Pọl, onye e kpọrọ ka ọ bụrụ onyeozi nke Mesaịa Jizọs[a] site n’uche Chineke, na Sọstenis, bụ nwanne,
  rationale: The revision removes the unexpressed possessive “anyị” while retaining a natural Igbo apposition for “Sosthenes the brother.” It also slightly regularizes the called-apostle construction as “onye e kpọrọ ka ọ bụrụ onyeozi,” expressing κλητὸς ἀπόστολος idiomatically without altering its sense. No change is needed to the Messiah/Christ footnote or the sentence-final comma.
