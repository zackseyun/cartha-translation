  text: Παῦλος κλητὸς ἀπόστολος ⸂Χριστοῦ Ἰησοῦ⸃ διὰ θελήματος θεοῦ καὶ Σωσθένης ὁ ἀδελφὸς
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/001.yaml
  text: Paul[a], a called apostle of Messiah Jesus by the will of God, and Sosthenes our brother,
translation:
  language: ig
  text: Pọl, onye e kpọrọ ka ọ bụrụ onyeozi nke Mesaịa Jizọs[a] site n’uche Chineke, na Sọstenis, bụ nwanne,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, Kraịst Jizọs.
    reason: lexical_alternative
lexical_decisions:
- source_word: Παῦλος
  choice: Pọl
  rationale: Ụdị aha a bụ nke a na-ejikarị ede Paul n’Igbo ọkọlọtọ.
- source_word: κλητὸς ἀπόστολος
  choice: onye a kpọrọ ịbụ onyeozi
  rationale: Nke a na-egosi na ọkpụkpọ ahụ metụtara ọrụ Pọl dị ka onyeozi, ma na-asụkwa ya n’Igbo doro anya.
- source_word: Χριστοῦ Ἰησοῦ
  choice: Mesaịa Jizọs
  rationale: Χριστός na-arụ ọrụ dị ka utu aha ebe a; ya mere, “Mesaịa” na-eme ka ihe okwu ahụ pụtara pụta ìhè, ebe “Jizọs” bụ aha onye ahụ.
- source_word: διὰ θελήματος θεοῦ
  choice: site n’uche Chineke
  rationale: Nkebiokwu a na-egosi na ịbụ onyeozi Pọl sitere n’uche na nhọpụta Chineke.
- source_word: Σωσθένης
  choice: Sọstenis
  rationale: Nke a bụ ntụgharị ụda aha Grik ahụ n’ụdị dabara n’ọgụgụ Igbo.
- source_word: ὁ ἀδελφὸς
  choice: nwanne anyị
  rationale: Ọ bụ ụzọ Igbo dị mfe ma kwekọọ n’usoro akwụkwọ ozi e si akọwa onye otu n’etiti ndị kwere ekwe; “anyị” na-eme ka mmekọrịta ahụ doo anya n’enweghị echiche na ọ bụ naanị nwanne afọ.
theological_decisions:
- issue: Otu e si sụgharịa Χριστός n’ekele akwụkwọ ozi Pọl
  choice: Mesaịa Jizọs
  alternative: Kraịst Jizọs
  rationale: Ebe a, Χριστός na-egosi ọrụ na utu aha Jizọs dị ka Onye E Tere Mmanụ, ọ bụghị naanị akụkụ aha e ji mara ya. A hapụrụ “Kraịst Jizọs” n’ala peeji dị ka nsụgharị ọdịnala ziri ezi.
translation_notes:
  register: E ji Igbo ọkọlọtọ nke oge a, dị ugwu ma dị mfe nghọta. A nọgidere na usoro ahịrịokwu mmalite akwụkwọ ozi ahụ, ya mere amaokwu a kwụsịrị na rikọma dịka isi mmalite si aga n’ihu n’amaokwu na-esote.
