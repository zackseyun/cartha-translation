source:
  edition: SBLGNT
  text: ὃς καὶ βεβαιώσει ὑμᾶς ἕως τέλους ἀνεγκλήτους ἐν τῇ ἡμέρᾳ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/008.yaml
  text: who will also establish you to the end[c][b][a], blameless in the day of our Lord Jesus the Messiah.
translation:
  language: ig
  text: onye ga-emekwa ka unu guzosie ike[a] ruo ọgwụgwụ, dịka ndị a na-apụghị ibo ebubo[b] n’ụbọchị Onyenwe anyị Jizọs bụ Mezaya.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “mee ka unu sie ike” ma ọ bụ “kwado unu.”
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsị, “ndị na-enweghị ụta” ma ọ bụ “ndị a na-apụghị ịta ụta.”
    reason: lexical_alternative
  - marker: c
    text: N’asụsụ Grik, “Kraịst”; aha ọkwa ahụ pụtara “Mezaya,” ya bụ, Onye E Tere Mmanụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: βεβαιώσει
  choice: ga-emekwa ka unu guzosie ike
  rationale: Ngwaa a pụtara ime ka mmadụ guzosie ike ma ọ bụ bụrụ onye siri ike. Nhọrọ a bụ Igbo doro anya ma na-edobe echiche nke ịkwado ndị kwere ekwe ka ha ghara ịda.
- source_word: ἕως τέλους
  choice: ruo ọgwụgwụ
  rationale: Nke a na-egosi oge na-aga n’ihu ruo n’ebe ikpeazụ, ma o kwekọrọ nke ọma n’ụzọ e si ekwu ya n’Igbo.
- source_word: ἀνεγκλήτους
  choice: ndị a na-apụghị ibo ebubo
  rationale: 'Okwu Grik a nwere ụda ikpe: ịbụ onye e nweghị ebubo ziri ezi a pụrụ iweta megide ya. Nsụgharị a na-edobe akụkụ ahụ karịa nanị ‘ndị na-enweghị ụta.’'
- source_word: ἐν τῇ ἡμέρᾳ
  choice: n’ụbọchị
  rationale: Nke a na-edobe akpaalaokwu Akwụkwọ Nsọ banyere ụbọchị ikpeazụ ma bụrụkwa Igbo ebumpụta ụwa.
- source_word: κυρίου
  choice: Onyenwe anyị
  rationale: Nke a bụ ụzọ Igbo a na-anabata nke ọma isi kpọọ κύριος dịka aha nsọpụrụ.
- source_word: Χριστοῦ
  choice: Mezaya
  rationale: Χριστός bụ aha ọkwa pụtara Onye E Tere Mmanụ; ‘Mezaya’ na-eme ka ihe aha ahụ pụtara ghara ịghọ naanị aha mmadụ.
theological_decisions:
- issue: Onye ὃς na-ezo aka na ya
  choice: E ji ‘onye’ mee ka okwu ahụ laghachi n’ebe Onyenwe anyị Jizọs bụ́ Mezaya nọ na amaokwu nke asaa.
  alternative: A pụrụ ịghọta ya dịka ihe na-ezo n’ebe Chineke e kwuru okwu ya na mbụ nọ.
  rationale: Aha nwoke otu onye kacha nso n’usoro ahịrịokwu bụ ‘Onyenwe anyị Jizọs bụ́ Mezaya.’ Ịhapụ ya dịka ‘onye’ na-edobe njikọ ụtọasụsụ ahụ n’ebughị nkọwa agbakwunyere n’ime amaokwu a.
- issue: Mmekọrịta ἀνεγκλήτους na βεβαιώσει
  choice: 'E gosipụtara ya dịka ihe ga-esi n’ime ka ha guzosie ike pụta: ‘ka unu bụrụ ndị a na-apụghị ibo ebubo.’'
  alternative: 'A pụrụ ịgụ ya dịka nkọwa kpọmkwem nke ọnọdụ ha: ‘unu ndị a na-apụghị ibo ebubo.’'
  rationale: Usoro ‘ka unu bụrụ’ bụ Igbo ebumpụta ụwa nke na-egosi ebumnuche ma ọ bụ nsonaazụ n’ebugharịghị nkwupụta ahụ gaa n’ozizi pụrụ iche.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. ‘Bụ́’ na-eme ka ‘Mezaya’ pụta ìhè dịka aha ọkwa Jizọs, ọ bụghị dịka aha ezinụlọ. Akara nkọwa ụkwụ [a], [b], na [c] niile dị n’ebe okwu ha na-akọwa nọ.
