  naturalness: The proposed direct construction is natural, dignified Standard Igbo and more closely follows the balanced rhetorical structure of the source.
  terminology: Use “Mesaya” for the title Χριστός; retain “ihe ịsụ ngọngọ” for σκάνδαλον and “ihe nzuzu” for μωρίαν. “Ndị mba ọzọ” appropriately conveys ἔθνεσιν in contrast with Jews, while the note preserves the broader lexical sense.
