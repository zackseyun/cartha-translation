  text: ἡμεῖς δὲ κηρύσσομεν Χριστὸν ἐσταυρωμένον, Ἰουδαίοις μὲν σκάνδαλον ⸀ἔθνεσιν δὲ μωρίαν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/023.yaml
  text: but we preach the Messiah crucified[a], to Jews a stumbling block and to Gentiles foolishness[b],
translation:
  language: ig
  text: Ma anyị na-ekwusa Mesaya a kpọgidere n’obe[a], nye ndị Juu ihe ịsụ ngọngọ, nye ndị mba ọzọkwa ihe nzuzu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “Kraịst a kpọgidere n’obe.”
    reason: alternative_reading
  - marker: b
    text: N’asụsụ Grik, “mba dị iche iche”; n’ebe a, o yikarịrị ka ọ pụtara ndị na-abụghị ndị Juu.
    reason: lexical_alternative
lexical_decisions:
- source_word: κηρύσσομεν
  choice: anyị na-ekwusa
  rationale: “Na-ekwusa” bụ okwu Igbo doro anya maka ịkpọsa ozi n’ihu ọha, ma na-echekwa echiche nke onye na-ezisa ozi e nyere ya.
- source_word: Χριστόν
  choice: Kraịst ahụ
  rationale: “Kraịst” bụ aha-utu a maara nke ọma n’Igbo maka Onye E Tere Mmanụ; “ahụ” na-eme ka ọrụ ya dị ka aha-utu pụta ìhè n’ebe a.
- source_word: ἐσταυρωμένον
  choice: a kpọgidere n’obe
  rationale: Nke a na-egosipụta passive participle ahụ n’ụzọ Igbo sitere n’okike, ma na-echekwa isi echiche banyere ọnwụ n’obe.
- source_word: Ἰουδαίοις
  choice: ndị Juu
  rationale: N’ọdịiche dị n’etiti ndị Juu na ἔθνη, nke a bụ nghọta agbụrụ na okpukpe kacha doo anya.
- source_word: σκάνδαλον
  choice: ihe ịsụ ngọngọ
  rationale: Nke a na-echekwa ihe atụ nke ihe na-eme ka mmadụ sụọ ngọngọ kama ime ka ọ bụrụ naanị iwe ma ọ bụ mkpasu iwe.
- source_word: ἔθνεσιν
  choice: ndị mba ọzọ
  rationale: Ọ na-egosi ndị na-abụghị ndị Juu n’ọdịiche a, ebe ndetu ala peeji na-echekwa nkọwa nkịtị nke ‘mba dị iche iche.’
- source_word: μωρίαν
  choice: ihe nzuzu
  rationale: Nke a bụ okwu Igbo ebumpụta ụwa nke na-echekwa echiche Pọl banyere ihe ndị mmadụ na-ewere dị ka nzuzu.
theological_decisions:
- issue: Ịsụgharị Χριστός dị ka aha-utu ma ọ bụ dị ka aha mmadụ
  choice: Kraịst ahụ
  alternative: Mesaya ahụ
  rationale: N’ebe a Χριστός na-arụ ọrụ dị ka aha-utu nke onye a na-ekwusa. “Kraịst ahụ” bụ ụdị a maara nke ọma n’Igbo, ebe “ahụ” na-enyere aka igosi na ọ bụghị naanị aha mmadụ.
- issue: Mmekọrịta nke ‘ihe ịsụ ngọngọ’ na ‘ihe nzuzu’ na Kraịst a kpọgidere n’obe
  choice: onye bụụrụ ... bụrụkwara ...
  alternative: nye ndị Juu ihe ịsụ ngọngọ, nyekwa ndị mba ọzọ ihe nzuzu
  rationale: Ịtinye nnọchiaha “onye” na-eme ka ahịrịokwu ahụ bụrụ Igbo sitere n’okike ma ghara idozi ma ọ bụ gbanwee esemokwu nkà mmụta okpukpe dị n’okwu ahụ.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji “Kraịst ahụ” mee ka aha-utu ahụ pụta ìhè n’enweghị itinye nkọwa otu ụka; e tinyere akara ndetu [a] na [b] kpọmkwem n’ederede.
