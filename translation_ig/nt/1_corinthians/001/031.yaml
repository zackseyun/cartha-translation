  text: ἵνα καθὼς γέγραπται· Ὁ καυχώμενος ἐν κυρίῳ καυχάσθω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/031.yaml
  text: 'so that[a], just as it is written: “The one who boasts must boast in the Lord.”'
translation:
  language: ig
  text: 'ka, dịka e dere: “Ka onye na-anya isi[a] na-anya isi n’Onyenwe anyị.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Onye ọbụla na-anya isi, ka ọ na-anya isi n’Onyenwe anyị.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: ka ... wee
  rationale: Ọ na-egosi ebumnuche ma ọ bụ ihe si n'okwu bu ụzọ pụta; usoro a bụ Igbo nkịtị ma na-edobe ike njikọ ahụ.
- source_word: καθὼς γέγραπται
  choice: ihe e dere
  rationale: N'usoro ahịrịokwu a, ‘ka ihe e dere wee mezuo’ na-egosi na ihe na-esochi bụ okwu Akwụkwọ Nsọ e dere, ma na-asụkwa Igbo nke ọma.
- source_word: Ὁ καυχώμενος
  choice: Onye na-anya isi
  rationale: Ọ na-anọchi onye ọ bụla na-etu ọnụ ma ọ bụ na-ahụ ihe dịka ihe nganga ya; ‘ịnya isi’ bụ okwu Igbo doro anya nke na-edobe echiche ahụ.
- source_word: ἐν κυρίῳ
  choice: n’ime Onyenwe anyị
  rationale: ‘N’ime’ na-edobe ἐν ma na-egosi na Onyenwe anyị bụ ebe na ihe kwesịrị ekwesị mmadụ ga-eji nya isi.
- source_word: καυχάσθω
  choice: ya nya isi
  rationale: Usoro ‘ya ...’ na-enye iwu ma ọ bụ agbamume n'Igbo n'ebughị ibu karịa ike imperative Grik ahụ.
theological_decisions:
- issue: Ike iwu dị na καυχάσθω
  choice: ya nya isi
  alternative: ọ ga-anya isi
  rationale: ‘Ya nya isi’ na-edobe ọdịdị iwu/agbamume nke Grik, ebe ‘ọ ga-anya isi’ nwere ike ịpụta amụma ma ọ bụ iwu siri ike karịa.
- issue: Ntụgharị κύριος
  choice: Onyenwe anyị
  alternative: Onyenwe
  rationale: ‘Onyenwe anyị’ bụ aha a na-aghọta nke ọma n'Igbo maka ‘the Lord’ ma na-edobe isi okwu okpukpe nke nhota ahụ.
- issue: Njikọ ἵνα na ihe ndị bu ụzọ
  choice: ka ihe e dere wee mezuo
  alternative: ka, dịka e dere ya
  rationale: Nhọrọ mbụ bụ Igbo eke ma na-egosi nsonaazụ/ebumnuche nke okwu ndị bu ụzọ. Nhọrọ nke ọzọ na-esochi usoro Grik nso karịa, ya mere e debere ya n'okpuru nkọwa ala peeji.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke oge a, dị ùgwù ma dị mfe nghọta. E ji ‘ịnya isi’ mee ka ntụgharị ahụ doo anya nye ndị na-agụ akwụkwọ taa, ebe a hapụrụ ụzọ ọzọ nke na-esochi usoro Grik nso na nkọwa ala peeji.
