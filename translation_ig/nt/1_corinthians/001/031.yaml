revisions:
- from: 'ka ihe e dere wee mezuo: “Onye na-anya isi, ya nya isi n’ime Onyenwe anyị.”[a]'
  to: 'ka, dịka e dere: “Ka onye na-anya isi[a] na-anya isi n’Onyenwe anyị.”'
  rationale: The revision removes the unsupported idea that a written statement is being fulfilled and restores the citation formula signaled by καθὼς γέγραπται. It retains the purposive/result connection of ἵνα (‘ka’), the participial sense of Ὁ καυχώμενος, the imperative force of καυχάσθω, and the conventional Igbo rendering of ‘in the Lord.’
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T18:10:44Z'
review_pass:
  verdict: revise
  source_fidelity: The draft substantially changes the introductory clause. ‘ka ihe e dere wee mezuo’ means ‘so that what was written might be fulfilled,’ whereas the Greek says ‘so that, just as it is written,’ introducing a citation. The revised text preserves both ἵνα and καθὼς γέγραπται, and renders the citation’s imperative without adding a fulfillment idea.
  naturalness: ‘Ka, dịka e dere’ is natural, dignified Standard Igbo for a scriptural citation. ‘Ka onye na-anya isi na-anya isi n’Onyenwe anyị’ is a clear and idiomatic exhortational rendering. ‘n’Onyenwe anyị’ is more idiomatic than the overly literal ‘n’ime Onyenwe anyị’ in this expression.
  terminology: ‘Onyenwe anyị’ appropriately renders κύριος in this context. ‘Ịnya isi’ adequately conveys καυχάομαι here, provided its object is explicitly redirected to the Lord. The footnote retains the substantival-participle alternative without altering the text’s sense.
  issues:
  - severity: high
    issue: The phrase ‘ka ihe e dere wee mezuo’ introduces fulfillment.
    rationale: Neither ἵνα nor καθὼς γέγραπται says that Scripture is being fulfilled; the Greek introduces a quotation by saying ‘so that, just as it is written.’ This changes the relationship to the preceding context.
  - severity: medium
    issue: ‘n’ime Onyenwe anyị’ is too literal for this idiom.
    rationale: While ἐν is literally ‘in,’ Standard Igbo naturally expresses this established religious phrase as ‘n’Onyenwe anyị’; the source sense is retained without implying a spatial interior.
  - severity: low
    issue: The draft’s citation wording does not express the imperative as naturally as it could.
    rationale: ‘Ka onye na-anya isi na-anya isi...’ clearly marks the exhortation and preserves the Greek repetition of καυχώμενος/καυχάσθω.
