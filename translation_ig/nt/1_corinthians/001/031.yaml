    text: Ma ọ bụ, “Onye ọbụla na-anya isi, ka ọ na-anya isi n’Onyenwe anyị.”
    reason: lexical_alternative
  revision_rationale: The revision removes the unsupported idea that a written statement is being fulfilled and restores the citation formula signaled by καθὼς γέγραπται. It retains the purposive/result connection of ἵνα (‘ka’), the participial sense of Ὁ καυχώμενος, the imperative force of καυχάσθω, and the conventional Igbo rendering of ‘in the Lord.’
