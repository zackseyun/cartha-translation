  text: λέγω δὲ τοῦτο ὅτι ἕκαστος ὑμῶν λέγει· Ἐγὼ μέν εἰμι Παύλου, Ἐγὼ δὲ Ἀπολλῶ, Ἐγὼ δὲ Κηφᾶ, Ἐγὼ δὲ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/012.yaml
  text: 'What I mean is this: each of you says[a], “I belong to Paul,” or “I belong to Apollos,” or “I belong to Cephas,” or “I belong to Messiah.”'
translation:
  language: ig
  text: 'Ihe m na-ekwu bụ nke a: onye ọ bụla n’ime unu na-ekwu, “Abụ m nke Pọl,” ma onye ọzọ na-ekwu, “Abụ m nke Apọlọs,” ma onye ọzọ, “Abụ m nke Kefa,” ma onye ọzọkwa, “Abụ m nke Onye e Tere Mmanụ.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγω δὲ τοῦτο ὅτι
  choice: 'Ihe m na-ekwu bụ nke a:'
  rationale: Nke a na-egosi na Pọl na-akọwa kpọmkwem ihe ọ na-ekwu, ma jiri akpaokwu Igbo dị mfe ma bụrụkwa nke e ji ùgwù dee.
- source_word: ἕκαστος ὑμῶν λέγει
  choice: onye ọ bụla n’ime unu na-ekwu
  rationale: “Onye ọ bụla n’ime unu” na-echekwa ike nkesa nke ἕκαστος, ebe “na-ekwu” na-egosi omume na-aga n’ihu dị ka oge ugbu a nke Grik si dị.
- source_word: Ἐγὼ μέν εἰμι Παύλου / Ἐγὼ δὲ Ἀπολλῶ / Ἐγὼ δὲ Κηφᾶ / Ἐγὼ δὲ Χριστοῦ
  choice: Abụ m nke Pọl ... Abụ m nke Apọlọs ... Abụ m nke Kefa ... Abụ m nke Onye E Tere Mmanụ
  rationale: “Abụ m nke...” na-egosi isonyere ma ọ bụ ịdabere n’otu onye, n’ebughị ụzọ kpebie na ọ pụtara ịbụ onye na-eso ụzọ ya n’usoro iwu. Ikwughachi ya na-echekwa usoro okwu ndị otu ahụ.
- source_word: Παύλου
  choice: Pọl
  rationale: Ụdị aha a bụ nke a na-aghọta nke ọma n’Igbo ugbu a.
- source_word: Ἀπολλῶ
  choice: Apọlọs
  rationale: A sụgharịrị aha Grik ahụ n’ụdị mkpụrụokwu Igbo nke na-eme ka a mata onye ahụ n’enweghị mgbagwoju anya.
- source_word: Κηφᾶ
  choice: Kefa
  rationale: E debere aha Κηφᾶς kama iji “Pita,” n’ihi na ọ bụ aha Kefa ka Pọl ji mee ihe n’ebe a.
- source_word: Χριστοῦ
  choice: Onye E Tere Mmanụ
  rationale: Χριστός bụ utu aha pụtara onye e tere mmanụ. Nsụgharị a na-eme ka ihe utu aha ahụ pụtara pụta ìhè kama idegharị ya naanị dịka aha.
theological_decisions:
- issue: Otú e si sụgharị Χριστοῦ n’okwu otu ndị na-ekewa onwe ha
  choice: Onye E Tere Mmanụ
  alternative: Kraịst
  rationale: A na-echekwa Χριστός dịka utu aha ma na-ezere ime ka ọ bụrụ naanị aha mmadụ. E tinyere “Kraịst,” nke ndị na-agụ Igbo maara nke ọma, n’ala peeji dịka ụzọ ọzọ e si asụgharị otu okwu Grik ahụ.
- issue: Ihe genitive dị n’okwu “εἰμι Παύλου” na ndị yiri ya pụtara
  choice: Abụ m nke...
  alternative: Ana m eso...
  rationale: “Abụ m nke...” na-echekwa nghọta nke ịbụ nke onye ma ọ bụ ịkwado ya, n’agbanyeghị na okwu ndị ahụ nwere ike ịbụ mkpọsa otu. “Ana m eso...” ga-eme ka echiche ịbụ onye na-eso ụzọ pụta ìhè karịa ka Grik kwuru.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe ma nwee ùgwù. A hapụrụ usoro mkpọsa ndị otu ahụ ka ọ pụta ìhè, ma jiri “onye ọzọ asị” mee ka ndepụta ahụ na-aga nke ọma n’Igbo. Akara ala peeji [a] dị n’isiokwu ahụ kpọmkwem ọ na-akọwa.
