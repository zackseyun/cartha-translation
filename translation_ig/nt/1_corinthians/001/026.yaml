id: 1CO.1.26
reference: 1 Corinthians 1:26
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Βλέπετε γὰρ τὴν κλῆσιν ὑμῶν, ἀδελφοί, ὅτι οὐ πολλοὶ σοφοὶ κατὰ σάρκα, οὐ πολλοὶ δυνατοί, οὐ πολλοὶ εὐγενεῖς·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/026.yaml
  text: 'For consider your calling, brothers: not many of you were wise by human standards, not many were powerful, not many were of noble birth.'
translation:
  language: ig
  text: 'N’ihi na, ụmụnna[a], chebaanụ ọkpụkpọ e kpọrọ unu echiche: ọ bụghị ọtụtụ n’ime unu bụ ndị maara ihe dị ka ndị mmadụ si ele ihe anya; ọ bụghị ọtụtụ bụ ndị dị ike; ọ bụghịkwa ọtụtụ bụ ndị a mụrụ n’ezinụlọ ndị a na-akwanyere ùgwù.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ụmụnna” n’ebe a bụ okwu a na-agwa ọgbakọ niile, ọ gụnyekwara ndị inyom kwere ekwe na ndị ikom.
    reason: cultural_note
lexical_decisions:
- source_word: Βλέπετε
  choice: tụleenụ
  rationale: Okwu a nwere ike ịbụ iwu ma ọ bụ nkwupụta, ma n’ebe a Pọl na-akpọ ndị na-agụ ya ka ha chebara ọnọdụ ha echiche; “tụleenụ” na-egosipụta ike arịrịọ ahụ n’Igbo dị mma.
- source_word: κλῆσιν
  choice: ọkpụkpọ Chineke kpọrọ unu
  rationale: “Ọkpụkpọ” na-ezo aka n’ọkpụkpọ sitere n’aka Chineke, ọ bụghị ọrụ mmadụ; ịkpọ Chineke aha na-eme ka ihe okwu ahụ pụtara doo anya n’Igbo.
- source_word: ἀδελφοί
  choice: ụmụnna[a]
  rationale: “Ụmụnna” bụ ụzọ Igbo dị ebube ma bụrụkwa nke a na-ejikarị agwa ọgbakọ okwu; ihe odide ala peeji kọwara na ọ gụnyere ndị inyom kwere ekwe.
- source_word: οὐ πολλοὶ ... σοφοὶ
  choice: ọ bụghị ọtụtụ n’ime unu bụ ndị maara ihe
  rationale: “N’ime unu” na-eme ka onye a na-ekwu banyere ya pụta ìhè dịka ụtọasụsụ Igbo chọrọ, n’agbanyeghị na ọ dị n’ime echiche Grik ahụ.
- source_word: κατὰ σάρκα
  choice: dịka mmadụ si ele ya anya
  rationale: N’ebe a, okwu ahụ na-ekwu banyere ntụle mmadụ, ọ bụghị anụahụ nkịtị ma ọ bụ “ọdịdị mmehie”; nsụgharị a na-eburu akpaalaokwu ahụ n’Igbo n’ebughị nkọwa ozizi ọzọ bata.
- source_word: δυνατοί
  choice: ndị dị ike
  rationale: Nke a na-echekwa echiche sara mbara nke ike ma ọ bụ ikike n’obodo n’akọwaghị ụdị ike ahụ karịa isi mmalite.
- source_word: εὐγενεῖς
  choice: ndị a mụrụ n’ezinụlọ ndị a na-akwanyere ùgwù
  rationale: Okwu Grik ahụ na-ezo aka n’ọkwa mmadụ nwetara site n’ezinụlọ a mụrụ ya; okwu Igbo a doro anya karịa ntụgharị mkpụrụokwu nkịtị.
theological_decisions:
- issue: Ihe κλῆσιν na-ezo aka na ya
  choice: ọkpụkpọ Chineke kpọrọ unu
  alternative: ọkpụkpọ unu
  rationale: N’echiche Pọl na n’usoro okwu a, ọ bụ ọkpụkpọ Chineke nke mere ka ha bụrụ ndị kwere ekwe; agbakwunyere “Chineke” maka ido anya, ọ bụghị iji webata ozizi otu ụka.
- issue: Ihe κατὰ σάρκα pụtara
  choice: dịka mmadụ si ele ya anya
  alternative: dịka anụahụ si dị
  rationale: Akpaalaokwu a na-egosi ụkpụrụ mmadụ ji atụ amamihe. Nsụgharị nkịtị banyere anụahụ nwere ike ime ka onye na-agụ ya ghọta ya dịka ahụ mmadụ ma ọ bụ ọdịdị mmehie, nke okwu a anaghị ekpebi n’ebe a.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta mee ihe. E debere usoro ugboro atọ nke “ọ bụghị ọtụtụ” iji chekwaa nkwughachi na ike okwu Grik, ebe a sụgharịrị akpaalaokwu κατὰ σάρκα n’ụzọ onye Igbo nkịtị ga-aghọta.
