  text: γέγραπται γάρ· Ἀπολῶ τὴν σοφίαν τῶν σοφῶν, καὶ τὴν σύνεσιν τῶν συνετῶν ἀθετήσω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/019.yaml
  text: 'For it is written: “I will destroy the wisdom of the wise[a], and I will set aside the understanding of the intelligent.”'
translation:
  language: ig
  text: 'N’ihi na e dere, sị: “Aga m emebi amamihe nke ndị amamihe, ajụkwa nghọta nke ndị nwere nghọta.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γέγραπται
  choice: e dere ya n’Akwụkwọ Nsọ
  rationale: Perfect passive a na-eji ewebata ihe e hotara n’Akwụkwọ Nsọ; ntụgharị a bụ nke doro anya n’Igbo ma na-egosi na ihe ahụ e dere ka dị ire.
- source_word: γάρ
  choice: N’ihi na
  rationale: Na-egosi na amaokwu a na-enye ihe ndabere ma ọ bụ ihe kpatara okwu bu ya ụzọ.
- source_word: Ἀπολῶ
  choice: Aga m emebi
  rationale: Na-egosipụta imebi ma ọ bụ iweta n’ọnọdụ enweghị uru, n’enweghị ịgbakwunye ike karịa nke okwu Grik ahụ.
- source_word: σοφίαν τῶν σοφῶν
  choice: amamihe nke ndị amamihe
  rationale: Na-echekwa nkwughachi nke mkpụrụokwu ndị nwere otu mgbọrọgwụ na ike okwu ahụ.
- source_word: σύνεσιν τῶν συνετῶν
  choice: nghọta nke ndị nwere nghọta
  rationale: Na-echekwa myirịta na nkwughachi dị n’asụsụ Grik, ma bụrụkwa Igbo ndị mmadụ na-aghọta.
- source_word: ἀθετήσω
  choice: meekwa ka ... ghara ịdị ire
  rationale: Na-egosi ime ka ihe ghara inwe ike ma ọ bụ uru; ọ na-echekwa obosara nke ἀθετέω n’ụzọ Igbo na-ada nke ọma.
theological_decisions:
- issue: Otu e si echekwa ike nke ihe e hotara n’Aịzaya na ọdịiche dị n’etiti amamihe mmadụ na omume Chineke
  choice: 'Jiri ngwaa ọdịnihu kwụ ọtọ: “Aga m emebi” na “meekwa ka ... ghara ịdị ire.”'
  alternative: “Aga m ajụ” ma ọ bụ “Aga m ewepụ.”
  rationale: Nke a na-echekwa nkwupụta na Chineke ga-emeri amamihe mmadụ, ma ọ naghị etinye nkọwa ozizi karịrị ihe Grik kwuru.
translation_notes:
  register: Igbo Izugbe nke oge a, dị ùgwù ma doo ndị nkịtị anya. E jiri “n’Akwụkwọ Nsọ” mee ka usoro γέγραπται doo anya dịka mmalite nke ihe e hotara n’Akwụkwọ Nsọ; e chekwara myirịta okwu dị n’ahịrị abụọ ahụ.
