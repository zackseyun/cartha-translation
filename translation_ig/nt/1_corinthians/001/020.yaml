id: 1CO.1.20
reference: 1 Corinthians 1:20
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ποῦ σοφός; ποῦ γραμματεύς; ποῦ συζητητὴς τοῦ αἰῶνος τούτου; οὐχὶ ἐμώρανεν ὁ θεὸς τὴν σοφίαν τοῦ ⸀κόσμου;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/020.yaml
  text: Where is the wise man? Where is the scribe? Where is the debater of this age? Has not God made the wisdom of the world foolish?[a][b][c]
translation:
  language: ig
  text: Olee ebe onye amamihe nọ?[a] Olee ebe odeakwụkwọ nọ? Olee ebe onye na-arụ ụka nke oge a nọ?[b] Ọ̀ bụghị Chineke mere ka amamihe nke ụwa ghọọ nzuzu?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Okwu Grik a dị n’ụdị otu nwoke, ma o yikarịrị ka ọ na-anọchite anya onye ọ bụla a na-ewere dị ka onye amamihe.
    reason: lexical_alternative
  - marker: b
    text: “Oge a” bụ ntụgharị okwu Grik dị iche na nke a sụgharịrị “ụwa” n’ikpeazụ amaokwu a.
    reason: cross_reference
  - marker: c
    text: A pụkwara ịsụgharị ya, “Ọ̀ bụghị Chineke gosiri na amamihe nke ụwa bụ nzuzu?”
    reason: lexical_alternative
lexical_decisions:
- source_word: ποῦ
  choice: Olee ebe ... nọ?
  rationale: Nke a na-egosipụta ajụjụ ịma aka Pọl ji okwu a jụọ, ọ bụghị naanị ajụjụ banyere ebe mmadụ nọ.
- source_word: σοφός
  choice: onye amamihe
  rationale: Ọ bụ ntụgharị doro anya ma bụrụkwa nke okike n’Igbo; ‘onye’ anaghị ekewa nwoke na nwanyị, ya mere ọ dị mma maka aha otu mmadụ nke na-anọchite anya ndị niile a na-akpọ ndị amamihe.
- source_word: γραμματεύς
  choice: odeakwụkwọ
  rationale: Ọ na-echekwa ihe okwu Grik pụtara n’ụzọ kpọmkwem na n’akụkọ ihe mere eme karịa iji naanị ‘ọkà mmụta,’ ọ bụ ezie na n’ebe a ọ pụrụ ịgụnye onye maara akwụkwọ ma ọ bụ iwu nke ọma.
- source_word: συζητητής
  choice: onye na-arụrịta ụka
  rationale: Nkebiokwu a bụ Igbo dị ugbu a ma doo anya maka onye ji arụmụka na ntụgharị uche na-azọrịta okwu.
- source_word: τοῦ αἰῶνος τούτου
  choice: nke oge a
  rationale: ‘Oge a’ na-echekwa echiche αἰών dị iche na κόσμος, nke a sụgharịrị ‘ụwa’ n’ikpeazụ amaokwu ahụ.
- source_word: οὐχὶ
  choice: Ọ̀ bụghị
  rationale: Ọ na-egosipụta ajụjụ nkwupụta nke na-atụ anya azịza nkwenye.
- source_word: ἐμώρανεν
  choice: mere ka ... ghọọ nzuzu
  rationale: 'Nke a na-echekwa ike causative nke ngwaa Grik: Chineke mere ka amamihe ụwa bụrụ ihe nzuzu; ma okwu ahụ nwekwara ike ịpụta na o mere ka nzuzu ya pụta ìhè.'
- source_word: σοφίαν
  choice: amamihe
  rationale: Nke a bụ okwu Igbo kwesịrị ekwesị maka σοφία, ebe Pọl na-ekwu maka ihe ụwa na-azọrọ na ọ bụ amamihe.
- source_word: κόσμου
  choice: ụwa
  rationale: ‘Ụwa’ bụ ntụgharị okike nke κόσμος ma na-eme ka okwu a nọgide dị iche na αἰών, ‘oge,’ nke e ji mee ihe tupu ya.
theological_decisions:
- issue: Ime ka αἰών na κόσμος dị iche n’otu amaokwu ahụ
  choice: A sụgharịrị αἰών dịka ‘oge’ ma sụgharịa κόσμος dịka ‘ụwa.’
  alternative: Ịsụgharị ha abụọ dịka ‘ụwa’ iji mee ka ahịrịokwu dị mfe.
  rationale: Pọl jiri okwu Grik abụọ dị iche mee ihe. Ichekwa ọdịiche ahụ na-egosipụta nke ọma ọdịiche dị n’etiti oge a na amamihe nke ụwa.
- issue: Ihe ἐμώρανεν pụtara
  choice: ‘mere ka ... ghọọ nzuzu,’ nke na-echekwa ike causative nke ngwaa ahụ
  alternative: ‘gosiri na ... bụ nzuzu,’ nke na-elekwasị anya n’ikpughe ụdị amamihe ụwa bụ
  rationale: Isiokwu Grik na-enye ohere ka a ghọta ya dịka ime ka ihe bụrụ nzuzu ma ọ bụ igosi na ọ bụ nzuzu. E tinyere ụzọ nke abụọ n’ala ala peeji kama idozi ambiguity ahụ kpamkpam n’ime isi ederede.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A nọgidere na-enwe usoro ajụjụ atọ Pọl ji agba aka, tinyere ajụjụ ikpeazụ nke na-atụ anya azịza ‘ee.’ E ji ‘onye’ mee ihe n’ụzọ na-adịghị ekewa nwoke na nwanyị, ebe nkọwa ala peeji na-echekwa ozi gbasara ụdị nwoke dị na Grik.
