id: 1CO.1.3
reference: 1 Corinthians 1:3
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: χάρις ὑμῖν καὶ εἰρήνη ἀπὸ θεοῦ πατρὸς ἡμῶν καὶ κυρίου Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/003.yaml
  text: Grace to you and peace from God our Father and the Lord Jesus the Messiah[a].
translation:
  language: ig
  text: Ka amara na udo sitere n’aka Chineke, bụ́ Nna anyị, na Onyenwe anyị Jizọs, bụ́ Mesaya[a], dịrị unu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ: “Onyenwe anyị Jizọs Kraịst.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρις
  choice: amara
  rationale: “Amara” bụ okwu Igbo a na-ejikarị akọwa χάρις n’ụzọ na-echekwa ma ihu ọma Chineke ma ịdị arọ nke okwu ahụ n’ozizi Pọl.
- source_word: ὑμῖν
  choice: dịrị unu
  rationale: N’ụdị ekele na ngọzi Igbo, “dịrị unu” na-enye dative ahụ n’ụzọ ebumpụta ụwa.
- source_word: εἰρήνη
  choice: udo
  rationale: “Udo” bụ ntụgharị doro anya nke na-echekwa echiche mmekọrịta dị mma, ọdịmma, na ụda ọgbụgba ndụ dị n’okwu ahụ.
- source_word: ἀπὸ
  choice: sitere n’aka
  rationale: Nkebi a na-egosi isi mmalite nke amara na udo n’Igbo doro anya ma dịkwa mma.
- source_word: θεοῦ πατρὸς ἡμῶν
  choice: Chineke, bụ́ Nna anyị
  rationale: 'Nke a na-egosipụta apposition nke Grik: Chineke bụ Nna anyị; ọ naghị agbanwe ya ka ọ bụrụ ihe owuwu ọzọ dịka “Chineke anyị na Nna.”'
- source_word: κυρίου
  choice: Onyenwe anyị
  rationale: “Onyenwe anyị” bụ aha nsọpụrụ e guzobere nke ọma n’Igbo ma na-echekwa ịdị arọ nke κύριος.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jizọs, bụ́ Mesaya
  rationale: “Mesaya” na-eme ka ihe Χριστός pụtara dị ndụ dịka aha ọkwá, ebe nhazi “bụ́” na-eme ka okwu ahụ daa nke ọma n’Igbo.
theological_decisions:
- issue: Ma a ga-echekwa na ma amara ma udo sitere n’aka Nna na Jizọs ọnụ
  choice: E ji otu nkebi “sitere n’aka” chịkwaa ma “Chineke, bụ́ Nna anyị” ma “Onyenwe anyị Jizọs.”
  alternative: Ikwughachi “sitere n’aka” tupu “Onyenwe anyị Jizọs,” ma ọ bụ ịhazigharị ahịrịokwu ahụ ka njikọ ha ghara ịpụta ìhè.
  rationale: N’asụsụ Grik, otu preposition ἀπό na-achị aha abụọ ahụ. Idebe otu isi mmalite e jikọtara ọnụ na-agbaso ihe ederede ahụ kwuru n’enweghị ịgbakwunye nkọwa ozizi.
- issue: Otu a ga-esi tụgharị Χριστός
  choice: Mesaya
  alternative: Kraịst
  rationale: “Mesaya” na-egosipụta ihe aha ọkwá Χριστός pụtara; e debere “Kraịst” n’ala peeji dịka ụdị ọdịnala a maara nke ọma.
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. Usoro “Ka … dịrị unu” na-eme ka ekele ozi ahụ daa nke ọma n’Igbo, ebe “sitere n’aka” na-echekwa njikọ isi mmalite dị n’asụsụ Grik.
