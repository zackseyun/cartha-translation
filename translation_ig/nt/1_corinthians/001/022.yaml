  text: For Jews ask for signs[c][b][a], and Greeks seek wisdom.
translation:
  language: ig
  text: N’ihi na ndị Juu na-arịọ ihe ịrịba ama,[a][b] ndị Gris na-achọkwa amamihe.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịtụgharị ya, “Ebe ọ bụ na ndị Juu na-arịọ ihe ịrịba ama, ndị Gris na-achọkwa amamihe.”
    reason: alternative_reading
  - marker: b
    text: “Ihe ịrịba ama” nwekwara ike ịpụta “ihe ịrịba ama nke ọrụ ebube.”
    reason: lexical_alternative
  - marker: c
    text: A pụkwara ịtụgharị “ndị Gris” n’ụzọ sara mbara dịka “ndị mba ọzọ”; ma o yiri ka Pọl na-ejigide kpọmkwem ọnọdụ ọdịbendị Gris n’ihi okwu ya banyere amamihe.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπειδή
  choice: N’ihi na
  rationale: Ọ na-egosi ihe kpatara okwu Pọl na-akọwa n’ebe a; “N’ihi na” na-echekwa njikọ nke ihe kpatara ya n’ụzọ doro anya n’Igbo.
- source_word: Ἰουδαῖοι
  choice: ndị Juu
  rationale: N’ebe a, okwu ahụ na-ezo aka n’òtù ndị Juu dịka ọdịbendị na okpukpe ha si dị, n’iche ha na ndị Gris.
- source_word: σημεῖα
  choice: ihe ịrịba ama
  rationale: Nke a bụ ntụgharị sara mbara nke na-echekwa okwu Grik ahụ, ma ghara ịkọwa ya naanị dịka ọrụ ebube n’ahịrịokwu bụ isi.
- source_word: αἰτοῦσιν
  choice: na-arịọ ka e gosi ha
  rationale: Nke a na-ekwupụta omume ịrịọ ihe akaebe n’ụzọ Igbo na-ada nke ọma, ma ghara ime ka ngwaa ahụ sie ike dịka “na-achọsi ike ka e mee.”
- source_word: Ἕλληνες
  choice: ndị Gris
  rationale: Ọ na-echekwa kpọmkwem ọdịbendị Gris Pọl kpọrọ aha, karịsịa n’ihi njikọ ya na ịchọ amamihe.
- source_word: σοφίαν
  choice: amamihe
  rationale: Nke a bụ nhata okwu kpọmkwem ma na-echekwa obosara echiche ahụ, na-enweghị ịkpa ya ókè naanị n’amamihe nkà ihe ọmụma.
- source_word: ζητοῦσιν
  choice: na-achọ
  rationale: Ọ bụ okwu Igbo nkịtị nke na-egosi omume na-aga n’ihu dịka ngwaa Grik dị ugbu a si dị.
