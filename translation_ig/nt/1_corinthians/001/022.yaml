translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Nhazi “ndị Juu… ndị Griskwa” na-echekwa nguzo na ntụnyere dị n’ahịrịokwu Grik; e tinyere nkọwa ndị nwere ike ime ka ihe doo anya karịa n’ala peeji kama ịmanye ha n’ahịrịokwu bụ isi.
