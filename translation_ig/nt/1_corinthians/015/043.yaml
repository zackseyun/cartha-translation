  variant: Standard Igbo
source:
  edition: SBLGNT
  text: σπείρεται ἐν ἀτιμίᾳ, ἐγείρεται ἐν δόξῃ· σπείρεται ἐν ἀσθενείᾳ, ἐγείρεται ἐν δυνάμει·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/043.yaml
  text: It is sown in dishonor; it is raised in glory. It is sown in weakness; it is raised in power.
translation:
  language: ig
  text: A na-agha ya n’enweghị ùgwù; a na-akpọlite ya n’ebube. A na-agha ya n’adịghị ike; a na-akpọlite ya n’ike.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σπείρεται
  choice: A na-agha ya
  rationale: Nkebi a na-edobe ihe atụ Pọl ji banyere ịgha mkpụrụ, na-edobekwa olu nnara nke ngwaa Grik. “Ya” na-ezo aka n’ahụ e kwuru banyere ya n’amaokwu ndị gbara ya gburugburu.
- source_word: ἀτιμίᾳ
  choice: n’enweghị ùgwù
  rationale: Nke a na-egosi ọnọdụ enweghị nsọpụrụ ma na-emegide “ebube” nke ọma, n’ebughị ụzọ mee ka okwu ahụ bụrụ naanị mmetụta ihere.
- source_word: ἐγείρεται
  choice: a na-akpọlite ya
  rationale: “Ịkpọlite” bụ okwu doro anya ma bụrụkwa nke a na-ejikarị ekwu mbilite n’ọnwụ. E debere olu nnara ka onye na-akpọlite ya, bụ́ Chineke, ghara ịbụ onye a kpọrọ aha ebe Grik akpọghị ya aha.
- source_word: δόξῃ
  choice: n’ebube
  rationale: “Ebube” na-eburu echiche nke δόξα n’ọnọdụ mbilite n’ọnwụ ma na-eguzogide “enweghị ùgwù” nke ọma.
- source_word: ἀσθενείᾳ
  choice: n’adịghị ike
  rationale: Nke a bụ ntụgharị kwụ ọtọ na nke ndị Igbo na-aghọta ngwa ngwa; ọ gụnyere adịghị ike nke ahụ n’emeghị ka ihe okwu ahụ pụtara dị warara.
- source_word: δυνάμει
  choice: n’ike
  rationale: “Ike” bụ okwu nkịtị ma sie ike nke na-emegide “adịghị ike,” ma nwee ike ịgụnye ike ọhụrụ nke ahụ e mere ka o si n’ọnwụ bilie.
theological_decisions:
- issue: Olu ngwaa na onye na-eme ka ahụ si n’ọnwụ bilie
  choice: E ji usoro olu nnara, “a na-akpọlite ya,” n’akpọghị Chineke aha kpọmkwem.
  alternative: Chineke na-akpọlite ya.
  rationale: Grik ji olu nnara ugboro abụọ. Idebe ya otú ahụ na-ahapụ onye na-eme ihe ahụ ka ọ bụrụ ihe a ghọtara n’agbanyeghị na a kpọghị ya aha, dịka Pọl si kwuo ya.
- issue: Ihe nnọchiaha “ya” na-ezo aka na ya
  choice: “Ya” na-ezo aka n’ahụ e kwuru banyere ya n’amaokwu ndị gbara ya gburugburu.
  alternative: A na-agha ahụ ... a na-akpọlite ahụ.
  rationale: Grik ekwughị aha ahụ ọzọ n’amaokwu a. Iji “ya” na-eme ka Igbo dị were were ma na-edobe njikọ ya na ihe ndị e kwuru tupu ya.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ugwu ma dị mfe nghọta. E debere ahịrị abụọ yiri ibe ha na mmegide ndị dị n’etiti “enweghị ùgwù/ebube” na “adịghị ike/ike.”
