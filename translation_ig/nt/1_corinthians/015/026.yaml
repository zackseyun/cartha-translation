id: 1CO.15.26
reference: 1 Corinthians 15:26
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἔσχατος ἐχθρὸς καταργεῖται ὁ θάνατος,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/026.yaml
  text: The last enemy to be abolished is death[a].
translation:
  language: ig
  text: Onye iro ikpeazụ a ga-eme ka ọ ghara ịdị irè bụ ọnwụ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Onye iro ikpeazụ a ga-ebibi bụ ọnwụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔσχατος
  choice: ikpeazụ
  rationale: Okwu a na-egosi onye nọ n'azụ n'usoro. “Ikpeazụ” bụ okwu Igbo doro anya ma na-echekwa usoro ihe Pọl na-ekwu banyere ya.
- source_word: ἐχθρὸς
  choice: onye iro
  rationale: Aha a pụtara onye ma ọ bụ ike na-emegide. “Onye iro” bụ Igbo nkịtị ma na-echekwa etu e si mee ọnwụ ka ọ dị ka onye na-emegide mmadụ.
- source_word: καταργεῖται
  choice: a ga-eme ka ọ ghara ịdị irè
  rationale: Ngwaa a nwere ike ịpụta ime ka ihe kwụsị ịrụ ọrụ, ime ka ike ya gwụ, ma ọ bụ iweta ya ná njedebe. Nhọrọ a na-egosi mmeri e meriri ọnwụ n'ebughị ụzọ kpebie na okwu Grik ahụ pụtara mkpochapụ kpamkpam.
- source_word: ὁ θάνατος
  choice: ọnwụ
  rationale: “Ọnwụ” bụ nsụgharị kpọmkwem ma na-egosikwa ya ebe a dị ka ike iro ikpeazụ.
theological_decisions:
- issue: Otú e si sụgharị καταργεῖται banyere mmeri a ga-emeri ọnwụ
  choice: a ga-eme ka ọ ghara ịdị irè
  alternative: a ga-ebibi
  rationale: Nhọrọ a na-echekwa echiche nke ime ka ọnwụ kwụsị ịrụ ọrụ ma ọ bụ ime ka ike ya gwụ, n'etinyeghị nkọwa metụtara ọdịdị nke mkpochapụ nke ngwaa ahụ n'onwe ya na-adịghị amanye. E debere “a ga-ebibi” n'ala peeji dịka nsụgharị ọzọ ziri ezi.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-echekwa ime ọnwụ ka ọ bụrụ onye iro, yana mgbagwoju pụtara n'ime καταργεῖται.
