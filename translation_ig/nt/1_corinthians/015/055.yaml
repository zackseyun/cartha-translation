  text: Where[a], O death, is your victory? Where, O death, is your sting?
translation:
  language: ig
  text: “Ọnwụ, olee ebe[a] mmeri gị dị? Ọnwụ, olee ebe agị gị dị?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Akwụkwọ odide ụfọdụ na-agụ ahịrị mbụ dịka, “Ọnwụ, olee ebe agị gị dị?” Ọgụgụ a pụtara na KJV na ụfọdụ nsụgharị ọdịnala ndị ọzọ.
    reason: textual_variant
lexical_decisions:
- source_word: ποῦ
  choice: olee ebe ... dị?
  rationale: Ọ bụ adverb ajụjụ e ji akparị ọnwụ n’ụzọ mmeri. Usoro ‘olee ebe ... dị?’ bụ Igbo nkịtị nke na-edobe ike ajụjụ ahụ n’etinyeghị okwu ọzọ na-adịghị na Grik.
- source_word: σου
  choice: gị
  rationale: Ọ bụ nnọchiaha onye nke abụọ n’ọnọdụ genitive, na-egosi na mmeri na ihe ọgbụgba ahụ bụ nke ọnwụ.
- source_word: θάνατε
  choice: Ọnwụ
  rationale: Ọ bụ vocative nke na-agwa ọnwụ okwu dịka onye. Ịkpọ ‘Ọnwụ’ aha ozugbo na-edobe ụdị abụ na ịkwa emo dị n’amaokwu ahụ; Igbo anaghị achọ ihe kwekọrọ kpọmkwem na ‘O’ Bekee.
- source_word: νῖκος
  choice: mmeri
  rationale: νῖκος pụtara mmeri ma ọ bụ imeri. ‘Mmeri’ doro anya ma kwekọọ n’okwu gbara amaokwu ahụ gburugburu banyere ọnwụ e loro n’ime mmeri.
- source_word: κέντρον
  choice: ihe ọgbụgba
  rationale: κέντρον nwere ike ịbụ ihe na-agba mmadụ dịka ogwu anụ ma ọ bụ ihe a kapịrị ọnụ e ji agba anụ. ‘Ihe ọgbụgba’ na-edobe ihe oyiyi nke ihe ọnwụ ji agba mmadụ, ma kwekọọ na nkọwa Pọl nyere n’amaokwu na-esote.
theological_decisions:
- issue: Ọgụgụ critical text n’ahịrị nke mbụ
  choice: Ịsụgharị νῖκος dịka ‘mmeri’ n’isi ederede
  alternative: Ịsụgharị ahịrị nke mbụ dịka ‘Ọnwụ, olee ebe ihe ọgbụgba gị dị?’ dịka ụfọdụ manuscript na ọdịnala Textus Receptus/KJV si gụọ ya.
  rationale: SBLGNT e nyere gụrụ νῖκος n’ahịrị nke mbụ, ya mere isi ederede kwesịrị inwe ‘mmeri ... ihe ọgbụgba.’ Nke a kwekọkwara n’amaokwu 54, ebe e kwuru na e loro ọnwụ n’ime mmeri. E debere ọgụgụ ọzọ ahụ n’ala peeji n’ihi na ọ bụ ọdịnala ederede a ma ama.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. Ntughari ahụ debere ịgwa ọnwụ okwu dịka onye na ụdị ajụjụ ịkwa emo nke Grik. A họọrọ ‘ihe ọgbụgba’ karịa naanị ‘ogwu’ ka ọ ghara ịkọwa kpọmkwem ma ọ bụ anụmanụ na-agba mmadụ ma ọ bụ ngwá a kapịrị ọnụ, ebe κέντρον n’onwe ya nwere obosara ahụ.
