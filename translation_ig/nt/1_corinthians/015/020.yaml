id: 1CO.15.20
reference: 1 Corinthians 15:20
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Νυνὶ δὲ Χριστὸς ἐγήγερται ἐκ νεκρῶν, ἀπαρχὴ τῶν ⸀κεκοιμημένων.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/020.yaml
  text: But now Messiah has been raised from the dead[c][b][a], the firstfruits of those who have fallen asleep.
translation:
  language: ig
  text: Ma ugbu a, e meela ka Mesaịa si n’etiti ndị nwụrụ anwụ bilie[a], ya bụ mkpụrụ mbụ[b] nke ndị dara n’ụra[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “E meela ka Kraịst si n’etiti ndị nwụrụ anwụ bilie.”
    reason: alternative_reading
  - marker: b
    text: “Mkpụrụ mbụ” bụ akụkụ mbụ nke owuwe ihe ubi a na-ewetara Chineke; ọ na-egosi ma ihe bịara ụzọ ma na-ekwe nkwa na owuwe ihe ubi ndị ọzọ ga-esochi.
    reason: cultural_note
  - marker: c
    text: “Ndị dara n’ụra” bụ ihe atụ e ji akọwa ndị nwụrụ anwụ, karịsịa mgbe a na-ekwu maka mbilite n’ọnwụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Νυνὶ δὲ
  choice: Ma ugbu a
  rationale: Ọ na-egosi ntụgharị siri ike site n’echiche a tụlere n’amaokwu ndị bu ụzọ gaa n’eziokwu Pọl na-ekwusi ike ugbu a.
- source_word: Χριστὸς
  choice: Mezaịa
  rationale: N’ebe a, okwu ahụ na-arụ ọrụ dị ka utu aha nke Onye Chineke Tere Mmanụ, ọ bụghị naanị dị ka aha mmadụ.
- source_word: ἐγήγερται
  choice: e meela ka … bilie
  rationale: 'Nke a na-echekwa olu nnara nke Grik na oge zuru ezu ya: omume ahụ emezuola, nsonaazụ ya ka dịkwa.'
- source_word: ἐκ νεκρῶν
  choice: si n’etiti ndị nwụrụ anwụ
  rationale: Ọ na-egosipụta n’ụzọ doro anya na Mezaịa biliri pụta n’etiti ndị nwụrụ anwụ, ma bụrụkwa okwu Igbo kwekọrọ n’echiche mbilite n’ọnwụ.
- source_word: ἀπαρχὴ
  choice: mkpụrụ mbụ
  rationale: 'Ọ na-echekwa ihe atụ owuwe ihe ubi: akụkụ mbụ a na-eweta, nke na-ebute ma na-egosi owuwe ihe ubi ndị ọzọ ga-abịa.'
- source_word: τῶν κεκοιμημένων
  choice: nke ndị dara n’ụra
  rationale: Ọ na-echekwa ihe atụ nke ihi ụra e ji akọwa ọnwụ n’ọnọdụ a na-ekwu maka mbilite n’ọnwụ, kama ịgbanwe ya ozugbo ka ọ bụrụ ‘ndị nwụrụ anwụ.’
theological_decisions:
- issue: Olu na onye mere ka mbilite n’ọnwụ pụta
  choice: e meela ka … bilie
  alternative: o biliela
  rationale: Nhọrọ a na-echekwa olu nnara dị na Grik n’enweghị ịkpọ aha onye mere ka ọ bilie, ya mere ọ naghị ezobe ma ọ bụ kọwaa karịa ihe amaokwu ahụ kwuru.
- issue: Ịsụgharị utu aha Χριστός
  choice: Mezaịa
  alternative: Kraịst
  rationale: A sụgharịrị ya dị ka utu aha n’ihi ọrụ nkà mmụta okpukpe ọ na-arụ n’argument a; e debere ‘Kraịst’ dị ka ụzọ ọzọ n’okpuru amaokwu.
- issue: Ihe ‘mkpụrụ mbụ’ pụtara
  choice: e chekwara ihe atụ owuwe ihe ubi
  alternative: onye mbụ bilitere
  rationale: Ịkpọ ya naanị ‘onye mbụ bilitere’ ga-eme ka ihe nnọchianya nke akụkụ mbụ na-ekwe nkwa owuwe ihe ubi zuru ezu funahụ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta, dee amaokwu ahụ. A họọrọ “si n’etiti ndị nwụrụ anwụ bilie” maka nghọta doro anya, ma e chekwara ma ihe atụ “mkpụrụ mbụ” ma nke “ndị dara n’ụra.”
