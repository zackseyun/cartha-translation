id: 1CO.15.3
reference: 1 Corinthians 15:3
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Παρέδωκα γὰρ ὑμῖν ἐν πρώτοις, ὃ καὶ παρέλαβον, ὅτι Χριστὸς ἀπέθανεν ὑπὲρ τῶν ἁμαρτιῶν ἡμῶν κατὰ τὰς γραφάς,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/003.yaml
  text: 'For I delivered to you as of first importance what I also received: that Messiah died for our sins according to the Scriptures[b][a],'
translation:
  language: ig
  text: 'N’ihi na enyefere m unu, dị ka ihe kacha mkpa, ihe m natakwara: na Mesaya[a] nwụrụ maka mmehie anyị, dị ka Akwụkwọ Nsọ si kwuo[b],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Kraịst nwụrụ maka mmehie anyị.” Okwu Grik bụ Χριστός; “Mesaya” pụtara “Onye e tere mmanụ.”
    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ, “n’ụzọ kwekọrọ n’Akwụkwọ Nsọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Παρέδωκα
  choice: enyefere m
  rationale: N’ọnọdụ a, ngwaa ahụ pụtara inyefe ndị ọzọ ozizi ma ọ bụ ozi e nwetara; “enyefere m” na-egosipụta nnyefe ahụ n'ụzọ doro anya ma dị ugwu.
- source_word: γὰρ
  choice: N’ihi na
  rationale: Ọ na-ejikọta amaokwu a na ihe bu ya ụzọ ma na-egosi na Pọl na-akọwa ihe o kwuru.
- source_word: ἐν πρώτοις
  choice: dị ka ihe kacha mkpa
  rationale: N’ebe a, nkebiokwu ahụ na-egosi mkpa kasịnụ karịa nanị usoro oge.
- source_word: ὃ καὶ παρέλαβον
  choice: ihe mụ onwe m natakwara
  rationale: Nke a na-edobe myirịta dị n’etiti ozi Pọl natara na ozi o nyefere; “mụ onwe m” na-eme ka καί pụta ìhè n’Igbo nkịtị.
- source_word: Χριστὸς
  choice: Mesaya
  rationale: Okwu ahụ ka na-arụ ọrụ dị ka utu aha n’ime nkwupụta okwukwe a; “Mesaya” na-echekwa echiche nke Onye E Tere Mmanụ.
- source_word: ἀπέθανεν
  choice: nwụrụ
  rationale: Oge gara aga dị mfe na-enye ihe aorist ahụ n’Igbo n'ụzọ ziri ezi na nke eke.
- source_word: ὑπὲρ τῶν ἁμαρτιῶν ἡμῶν
  choice: n’ihi mmehie anyị
  rationale: Nke a bụ ụzọ Igbo a na-aghọta nke ọma isi kwuo na ọnwụ ya metụtara mmehie anyị, n’etinyeghị otu nkọwa pụrụ iche banyere otú mgbapụta si arụ ọrụ.
- source_word: κατὰ τὰς γραφάς
  choice: dị ka Akwụkwọ Nsọ si kwuo
  rationale: Ọ na-egosi na ọnwụ ahụ kwekọrọ n’ihe Akwụkwọ Nsọ kwuru; “Akwụkwọ Nsọ” bụ aha mkpokọta e ji akọwa γραφάς n’Igbo.
theological_decisions:
- issue: Nsụgharị Χριστός
  choice: Mesaya
  alternative: Kraịst
  rationale: Ebe ọ bụ na okwu ahụ nwere ike ịbụ utu aha n’ime nkwupụta a, “Mesaya” na-eme ka echiche onye e tere mmanụ pụta ìhè; e debere “Kraịst” n’ala peeji dịka nsụgharị ọdịnala.
- issue: Ike okwu ὑπὲρ τῶν ἁμαρτιῶν ἡμῶν
  choice: n’ihi mmehie anyị
  alternative: maka mmehie anyị
  rationale: Nhọrọ a na-echekwa nkwupụta nzọpụta nke ederede ahụ n’akọwaghị ya dịka naanị otu ozizi kpọmkwem banyere aja mgbaghara.
- issue: Mmekọrịta κατὰ τὰς γραφάς na Akwụkwọ Nsọ
  choice: dị ka Akwụkwọ Nsọ si kwuo
  alternative: n’ụzọ kwekọrọ n’Akwụkwọ Nsọ
  rationale: Nhọrọ bụ isi na-ekwu nke ọma na ihe ahụ mezuru ma ọ bụ kwekọọ n’ihe Akwụkwọ Nsọ kwuru, ebe ọzọ na-eme ka echiche nke nkwekọrịta pụta ìhè.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị ugwu ma dịkwa mfe nghọta. Ahịrịokwu ahụ na-edobe usoro nnyefe na nnata ozi ahụ, ma na-eji “Mesaya” dịka utu aha. Akara ala peeji [b] na [a] dị n’ederede isi n’ebe okwu ha na-akọwa dị.
