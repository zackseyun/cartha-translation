- from: N’ihi na ebe ọnwụ si n’aka otu mmadụ bịa[a][b], mbilite n’ọnwụ nke ndị nwụrụ anwụ sikwa n’aka otu mmadụ bịa.
  to: N’ihi na ọnwụ sitere n’aka mmadụ[a][b], mbilite n’ọnwụ nke ndị nwụrụ anwụ sikwa n’aka mmadụ.
  rationale: The revision removes the added numeral, replaces an unnatural doubled causal opening with idiomatic Standard Igbo, and retains the Greek’s deliberately balanced wording. The footnotes are updated to match the revised wording and to express the contextual identification naturally.
