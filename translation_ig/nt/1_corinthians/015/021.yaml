    text: A pụkwara ịsụgharị ya, “site n’aka mmadụ,” n’akụkụ abụọ ahụ; preposition Grik ahụ nwere ike igosi onye mere ihe ma ọ bụ ụzọ ihe si mee.
    reason: lexical_alternative
  - marker: b
    text: Ihe Pọl kwuru n’amaokwu ndị gbara ya gburugburu na-egosi na mmadụ abụọ ahụ bụ Adam na Kraịst (lee 15:22, 45).
    reason: cross_reference
  revision_rationale: The revision removes the added numeral, replaces an unnatural doubled causal opening with idiomatic Standard Igbo, and retains the Greek’s deliberately balanced wording. The footnotes are updated to match the revised wording and to express the contextual identification naturally.
