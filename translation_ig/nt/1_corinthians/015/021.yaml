source:
  edition: SBLGNT
  text: ἐπειδὴ γὰρ δι’ ἀνθρώπου ⸀θάνατος, καὶ δι’ ἀνθρώπου ἀνάστασις νεκρῶν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/021.yaml
  text: For since death came through a man[b][a], the resurrection of the dead also came through a man.
translation:
  language: ig
  text: N’ihi na ọnwụ sitere n’aka mmadụ[a][b], mbilite n’ọnwụ nke ndị nwụrụ anwụ sikwa n’aka mmadụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “site n’aka mmadụ,” n’akụkụ abụọ ahụ; preposition Grik ahụ nwere ike igosi onye mere ihe ma ọ bụ ụzọ ihe si mee.
    reason: lexical_alternative
  - marker: b
    text: Ihe Pọl kwuru n’amaokwu ndị gbara ya gburugburu na-egosi na mmadụ abụọ ahụ bụ Adam na Kraịst (lee 15:22, 45).
    reason: cross_reference
lexical_decisions:
- source_word: ἐπειδὴ γὰρ
  choice: N’ihi na ebe
  rationale: Ngwakọta a na-egosi ihe kpatara okwu gara aga ma na-akọwakwa ya; ‘N’ihi na ebe’ na-edobe ọrụ ἐπειδή na γάρ n’ụzọ Igbo na-aghọta nke ọma.
- source_word: δι’ ἀνθρώπου
  choice: si n’aka otu mmadụ
  rationale: διά ya na genitive nwere ike igosi onye e ji mee ihe ma ọ bụ onye mere ya. ‘Si n’aka otu mmadụ’ bụ Igbo eke nke na-edobe mmadụ nwoke n’otu dịka Grik si kwuo, na-enweghị ịkpọ aha Adam ma ọ bụ Kraịst n’amaokwu ahụ.
- source_word: θάνατος
  choice: ọnwụ ... bịa
  rationale: Ahịrịokwu Grik enweghị ngwaa e dere, ya mere a gbakwụnyere ‘bịa’ ka ọ bụrụ Igbo zuru oke ma gosipụta mbata ọnwụ.
- source_word: ἀνάστασις νεκρῶν
  choice: mbilite n’ọnwụ nke ndị nwụrụ anwụ
  rationale: Nke a na-egosipụta mbilite ndị nwụrụ anwụ n’ezie, ọ bụghị nanị ndụ mgbe mmadụ nwụrụ ma ọ bụ mbilite ime mmụọ.
- source_word: καὶ
  choice: kwa
  rationale: ‘Kwa’ na-egosi njikọ na myirịta nke akụkụ nke abụọ na nke mbụ.
- source_word: δι’ ἀνθρώπου
  choice: si n’aka otu mmadụ
  rationale: E degharịrị otu okwu ahụ n’otu ụzọ iji chekwaa myirịta Pọl kpachapụrụ anya mee n’etiti mmadụ abụọ ahụ.
theological_decisions:
- issue: Myirịta nnọchite anya Adam na Kraịst
  choice: E debere ‘otu mmadụ’ n’akụkụ abụọ ahụ, ma a kpọghị aha ha n’ahịrịokwu bụ isi.
  alternative: ‘site n’aka Adam ... site n’aka Kraịst’ ma ọ bụ ‘site n’aka mmadụ ... site n’aka mmadụ’
  rationale: Amaokwu ndị gbara ya gburugburu na-eme ka a mata na ha bụ Adam na Mesaịa, ma amaokwu a n’onwe ya ekwughị aha ha. Nsụgharị ahụ na-echekwa okwu dị n’amaokwu na myirịta nkà mmụta okpukpe ya, n’agbanyeghị na ‘otu’ na-eme ka singular bụrụ ihe doro anya n’Igbo.
- issue: Ụdị mbilite n’ọnwụ
  choice: ‘mbilite n’ọnwụ nke ndị nwụrụ anwụ’
  alternative: ‘mbilite ime mmụọ’ ma ọ bụ ‘ndụ mgbe a nwụsịrị’
  rationale: N’isi nke 15, Pọl na-ekwu maka mbilite ndị nwụrụ anwụ n’ezie; e kwesịghị ime ka okwu ahụ ghọọ naanị echiche izugbe banyere ndụ mgbe mmadụ nwụsịrị.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta. A haziri akụkụ abụọ ahụ n’otu ụdị iji chekwaa myirịta nke Grik. E tinyere akara ndetu ala peeji [a] na [b] ozugbo e kwuchara nkebiokwu mbụ nke ha na-akọwa.
