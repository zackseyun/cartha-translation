review_pass:
  verdict: revise
  source_fidelity: The draft correctly retains the causal-explanatory connection, the death/resurrection parallel, and the unnamed human agents. However, it adds the numeral "otu" ('one'), which is not present in the anarthrous Greek ἀνθρώπου and is unnecessary in Igbo.
  naturalness: “N’ihi na ebe” is not idiomatic Standard Igbo in this context. “N’ihi na ọnwụ sitere n’aka mmadụ ...” is clear, modern, and preserves the concise parallelism. “Mbilite n’ọnwụ nke ndị nwụrụ anwụ” naturally communicates the resurrection of the dead.
  terminology: “Ọnwụ,” “mbilite n’ọnwụ,” and “ndị nwụrụ anwụ” are appropriate biblical and contemporary Standard Igbo terms. “Site n’aka mmadụ” appropriately conveys agency/mediation without specifying Adam or Christ in the main text.
  issues:
  - severity: medium
    issue: The main text renders ἀνθρώπου as “otu mmadụ” in both clauses.
    rationale: The Greek has singular “a man” without an explicit numeral. “Otu” may over-specify the wording; “mmadụ” preserves the singular/referential force without adding ‘one.’
  - severity: medium
    issue: The opening “N’ihi na ebe” is unnatural and redundantly combines causal expressions.
    rationale: Although ἐπειδὴ γάρ is both subordinating and explanatory, Standard Igbo naturally conveys the combined force here with “N’ihi na” without the awkward duplication.
  revised_text: N’ihi na ọnwụ sitere n’aka mmadụ[a][b], mbilite n’ọnwụ nke ndị nwụrụ anwụ sikwa n’aka mmadụ.
  revised_footnotes:
