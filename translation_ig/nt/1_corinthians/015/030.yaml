  text: Why are we also in danger every hour?[a]
translation:
  language: ig
  text: Gịnịkwa mere anyị ji nọ n’ihe ize ndụ n’awa ọ bụla?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ, n’ụzọ kpọmkwem karịa: “Gịnịkwa ka ọ pụtara na anyị nọ n’ihe ize ndụ n’awa ọ bụla?” N’ihe gbara ya gburugburu, nke a bụ ajụjụ na-atụ aro sị: “Gịnị mere anyị ji nọ n’ihe ize ndụ n’awa ọ bụla?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: τί
  choice: Gịnị mere
  rationale: N’ajụjụ arụmụka a, τί na-ajụ ihe kpatara omume ahụ; “Gịnị mere” na-egosipụta nke a n’Igbo nke ọma.
- source_word: καὶ
  choice: -kwa
  rationale: Mgbakwunye -kwa na-etinye Pọl na ndị ya n’ihe atụ ndị e kwuburu, dị ka καὶ si eme.
- source_word: ἡμεῖς
  choice: anyị
  rationale: A hapụrụ nnọchiaha ahụ pụta ìhè; njikọ ya na -kwa na-egosipụta echiche mgbakwunye dị na Grik.
- source_word: κινδυνεύομεν
  choice: anyị ji anọ n’ihe ize ndụ
  rationale: Nke a na-egosipụta ọnọdụ ịnọ n’ihe ize ndụ n’enweghị ịgbakwụnye nkọwa siri ike dịka ‘itinye ndụ anyị n’ihe ize ndụ.’
- source_word: πᾶσαν ὥραν
  choice: mgbe niile
  rationale: Akpaokwu Grik pụtara ịnọgide na-eche ihe ize ndụ ihu. “Mgbe niile” bụ okwu Igbo ebumpụta ụwa; nkọwa ala peeji na-echekwa ntụgharị nkịtị ya.
theological_decisions:
- issue: Ike ajụjụ arụmụka n’ime arụmụka Pọl banyere mbilite n’ọnwụ
  choice: A sụgharịrị amaokwu ahụ dịka ajụjụ arụmụka na-egosi na ọ gaghị enwe isi ka ndịozi na-eche ihe ize ndụ ihu ma ọ bụrụ na ndị nwụrụ anwụ adịghị ebilite.
  alternative: Ịsụgharị ya dịka ajụjụ nkịtị na-achọ ozi.
  rationale: Usoro okwu Grik na ihe ndị gbara amaokwu ahụ gburugburu na-akwado ajụjụ arụmụka, ma a gbakwụnyeghị nkwupụta ozizi ọzọ na-adịghị n’ederede.
translation_notes:
  register: Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ “mgbe niile” ka ọ bụrụ okwu ebumpụta ụwa n’Igbo, ebe nkọwa ala peeji chekwara “n’awa ọ bụla,” nke dị nso n’ụdị okwu Grik.
