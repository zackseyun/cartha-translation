  source_fidelity: The draft rightly takes τί as a rhetorical ‘why,’ preserves the additive force of καί with -kwa, and renders κινδυνεύομεν as being in danger. However, ‘mgbe niile’ is broader than πᾶσαν ὥραν (‘every hour’), and ‘ji anọ’ can suggest continued remaining rather than the simpler present state expressed by κινδυνεύομεν.
  naturalness: The main sentence is understandable Standard Igbo, but ‘anyị ji nọ n’ihe ize ndụ n’awa ọ bụla’ is both natural and closer to the Greek. The current footnote’s proposed wording, especially ‘Gịnịkwa ka ọ bụ na,’ is not idiomatic Igbo.
  terminology: ‘Ihe ize ndụ’ is an appropriate, modern rendering of danger. No theological term requires adjustment.
  issues:
