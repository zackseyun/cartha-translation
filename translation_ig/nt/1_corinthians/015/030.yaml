    issue: The temporal phrase ‘mgbe niile’ broadens πᾶσαν ὥραν.
    rationale: While it can convey continual danger, it does not retain the source’s explicit ‘every hour’ expression, which is readily idiomatic in Igbo as ‘n’awa ọ bụla.’
  - severity: medium
    issue: The footnote’s alleged more literal alternative is unidiomatic.
    rationale: ‘Gịnịkwa ka ọ bụ na anyị nọ ...’ does not read naturally and does not clearly convey the rhetorical syntax. The footnote should offer a clear explanatory alternative instead.
