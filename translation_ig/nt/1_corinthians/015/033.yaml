  text: 'Do not be deceived: bad company corrupts good morals[a].'
translation:
  language: ig
  text: 'Unu ekwela ka e duhie unu: mkpakọrịta ọjọọ na-emebi àgwà ọma[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “Mkparịta ụka ọjọọ na-emebi àgwà ọma.” Okwu Grik ahụ nwere ike ịpụta mkpakọrịta ma ọ bụ mkparịta ụka; “mkpakọrịta” kacha daba n’ọnọdụ a.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ πλανᾶσθε
  choice: Unu ekwela ka e duhie unu
  rationale: Nke a na-egosipụta ịdọ aka ná ntị dị n'ụdị passive/middle n'okwu Grik, n'ebughị ụzọ kpebie ma ọ bụ mmadụ ọzọ ma ọ bụ onwe ha na-eduhie ha.
- source_word: φθείρουσιν
  choice: na-emebi
  rationale: Ngwaa a na-egosi ime ka ihe ọma daa njọ ma ọ bụ ree ure; “na-emebi” dabara n'ọnọdụ gbasara omume ma na-edobe ike ilu ahụ.
- source_word: ἤθη χρηστά
  choice: ezi omume
  rationale: Nkebi a na-ezo aka n'àgwà na omume ọma, ọ bụghị naanị usoro nkwanye ùgwù n'etiti mmadụ.
- source_word: ὁμιλίαι κακαί
  choice: mkpakọrịta ọjọọ
  rationale: ὁμιλίαι nwere ike ịpụta mkpakọrịta ma ọ bụ mkparịta ụka. “Mkpakọrịta” na-enye echiche sara mbara nke iso ndị ọzọ na-akpa, nke dabara nke ọma n'ọnọdụ a.
