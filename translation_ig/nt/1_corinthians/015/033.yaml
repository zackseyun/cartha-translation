translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị mfe ma nwee ugwu. E ji “unu” mee ka adreesị plural nke Grik pụta ìhè; ahịrịokwu ahụ na-edobe ụdị ilu dị nkenke.
