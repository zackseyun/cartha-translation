review_pass:
  verdict: revise
  source_fidelity: The draft correctly retains the sequential content-clause force of καὶ ὅτι, transliterates Κηφᾷ as “Kefa,” and preserves τοῖς δώδεκα as the established group designation rather than harmonizing it. However, “pụrụ n’ihu” can primarily suggest appearing physically before someone; “pụtara ìhè nye” more directly conveys an appearance to the named witnesses in this context.
  naturalness: “Ọ pụtara ìhè nye Kefa” is natural, current Standard Igbo for an appearance to a person. Capitalizing “Ndị Iri na Abụọ” appropriately treats the phrase as the recognized designation of the apostolic group.
  terminology: “Kefa” faithfully reflects Κηφᾷ. The revised alternative in footnote a, “a hụrụ ya,” represents the Greek passive without adding an explicit subject (“ndị mmadụ”) that is not stated in Greek.
  issues:
  - severity: low
    issue: The phrase “ọ pụtara n’ihu Kefa” is less idiomatic and can be spatially understood as “appeared before Cephas.”
    rationale: The Greek construction concerns an appearance to Cephas. “Ọ pụtara ìhè nye Kefa” expresses this relation naturally without expanding the event.
  - severity: low
    issue: Footnote a renders the formal passive as “ndị mmadụ hụrụ ya.”
    rationale: The Greek leaves the seeing subject implicit. “A hụrụ ya” preserves that impersonal/passive sense more closely and avoids supplying “people.”
  revised_text: nakwa na ọ pụtara ìhè nye Kefa[a][b], e mesịa nye Ndị Iri na Abụọ[c].
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “a hụrụ ya.” N’asụsụ Grik, ngwaa ahụ dị n’ụdị nnara, ma n’akụkọ banyere ngosipụta mgbe mbilite n’ọnwụ gasịrị, a na-atụgharịkarị ya “ọ pụtara ìhè.”
    reason: lexical_alternative
  - marker: b
    text: Kefa bụ aha Arameik nke kwekọrọ na Pita.
    reason: cross_reference
  - marker: c
    text: “Ndị Iri na Abụọ” bụ aha e ji mara ìgwè ndị ozi Jizọs, ọ bụ ezie na ọnụ ọgụgụ ha abụghị iri na abụọ n’oge niile.
    reason: cultural_note
  revision_rationale: The revision replaces the potentially spatial “n’ihu” with the more idiomatic recipient construction “nye,” while retaining the resurrection-appearance sense of ὤφθη. It also applies “nye” consistently to both datival witness groups, capitalizes the conventional group title, and makes the passive alternative in the footnote source-faithful.
