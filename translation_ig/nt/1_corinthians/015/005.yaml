  text: καὶ ὅτι ὤφθη Κηφᾷ, εἶτα τοῖς δώδεκα·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/005.yaml
  text: and that he appeared to Cephas[c][b][a], then to the twelve.
translation:
  language: ig
  text: nakwa na ọ pụtara ìhè nye Kefa[a][b], e mesịa nye Ndị Iri na Abụọ[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “a hụrụ ya.” N’asụsụ Grik, ngwaa ahụ dị n’ụdị nnara, ma n’akụkọ banyere ngosipụta mgbe mbilite n’ọnwụ gasịrị, a na-atụgharịkarị ya “ọ pụtara ìhè.”
    reason: lexical_alternative
  - marker: b
    text: Kefa bụ aha Arameik nke kwekọrọ na Pita.
    reason: cross_reference
  - marker: c
    text: “Ndị Iri na Abụọ” bụ aha e ji mara ìgwè ndị ozi Jizọs, ọ bụ ezie na ọnụ ọgụgụ ha abụghị iri na abụọ n’oge niile.
    reason: cultural_note
lexical_decisions:
- source_word: ὤφθη
  choice: ọ pụtara n’ihu
  rationale: Ọ bụ ezie na ụdị ngwaa Grik a bụ nke nnara, n’akụkọ banyere ngosipụta mgbe mbilite n’ọnwụ gasịrị, okwu Igbo a na-egosi n'ụzọ doro anya na Kraịst mere ka ndị ahụ hụ ya, n’etinyeghị nkọwa ọzọ na-adịghị n’ederede.
- source_word: Κηφᾷ
  choice: Kefa
  rationale: E degharịrị aha Grik Κηφᾶς n’ụdị ụda ya kama iji aha Pita dochie ya; akara dative pụtara onye ọ pụtara n’ihu.
- source_word: εἶτα
  choice: e mesịa
  rationale: Ọ na-egosi usoro ihe ndị mere n’otu n’otu ma na-ada ka Igbo nkịtị.
- source_word: τοῖς δώδεκα
  choice: ndị Iri na Abụọ
  rationale: E debere aha otu a dị ka ederede Grik si kwuo ya, na-agbanweghị ya ka ọ bụrụ ‘ndị ozi’ ma ọ bụ ‘ndị Iri na Otu.’
- source_word: καὶ ὅτι
  choice: nakwa na
  rationale: Ọ na-aga n’ihu n’usoro ahịrịokwu ọdịnaya malitere n’amaokwu ndị bu ya ụzọ ma na-echekwa njikọ abụọ ahụ n’Igbo eke.
theological_decisions:
- issue: Asụsụ e ji kọwaa ngosipụta mgbe mbilite n’ọnwụ gasịrị
  choice: ọ pụtara n’ihu
  alternative: ndị mmadụ hụrụ ya
  rationale: Nhọrọ a na-echekwa nkwupụta banyere ngosipụta Kraịst dị ndụ n’ebughị ụzọ kọwaa otú ngosipụta ahụ siri mee; ihe ọzọ ahụ na-esochi ụdị nnara Grik nso karịa.
- issue: Ịkpọ otu ahụ ‘ndị Iri na Abụọ’ n’agbanyeghị na Judas anọghịzi
  choice: ndị Iri na Abụọ
  alternative: ndị Iri na Otu; ndị ozi
  rationale: τοῖς δώδεκα bụ aha otu ahụ e ji mara ndị ozi Jizọs. Ịhapụ ya otú ahụ na-egbochi ịhazigharị ederede ahụ dabere n’akụkọ ndị ọzọ.
translation_notes:
  register: Ejiri Standard Igbo dị ugbu a, nke nwere ugwu ma dị mfe nghọta. ‘Pụtara n’ihu’ bụ nkebiokwu eke maka ngosipụta nye mmadụ; ‘ndị Iri na Abụọ’ na-arụ ọrụ dị ka aha otu. E tinyere akara nkọwa ụkwụ ozugbo n’ebe okwu ndị ha na-akọwa dị.
