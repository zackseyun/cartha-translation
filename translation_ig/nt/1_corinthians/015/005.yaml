  rationale: The revision replaces the potentially spatial “n’ihu” with the more idiomatic recipient construction “nye,” while retaining the resurrection-appearance sense of ὤφθη. It also applies “nye” consistently to both datival witness groups, capitalizes the conventional group title, and makes the passive alternative in the footnote source-faithful.
