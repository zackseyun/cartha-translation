id: 1CO.15.23
reference: 1 Corinthians 15:23
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἕκαστος δὲ ἐν τῷ ἰδίῳ τάγματι· ἀπαρχὴ Χριστός, ἔπειτα οἱ τοῦ Χριστοῦ ἐν τῇ παρουσίᾳ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/023.yaml
  text: 'But each in his own order: Messiah the firstfruits[b][a], then those who belong to Messiah at his coming.'
translation:
  language: ig
  text: 'Ma onye ọ bụla n’usoro nke ya: Mesaịa[a] bụ mkpụrụ mbụ; emesịa, ndị bụ nke Mesaịa, mgbe ọ ga-abịa[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ “Kraịst.” Okwu Grik ahụ, Χριστός, bụ aha nsọpụrụ nke pụtara “Onye E Tere Mmanụ.”
    reason: alternative_reading
  - marker: b
    text: A pụkwara ịsụgharị ya “n’ọnụnọ ya” ma ọ bụ “mgbe ọ ga-erute.” N’ebe a, παρουσία na-ezo aka n’ọbịbịa ya n’ọdịnihu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕκαστος
  choice: onye ọ bụla
  rationale: Ọ na-egosi onye nke ọ bụla n’ime ndị a kpọtụrụ aha, karịchaa n’usoro mbilite n’ọnwụ e kwuru banyere ya n’amaokwu ndị gbara ya gburugburu.
- source_word: ἐν τῷ ἰδίῳ τάγματι
  choice: n’usoro nke ya
  rationale: τάγμα nwere ike ịpụta ọnọdụ a haziri ahazi ma ọ bụ usoro. N’ebe a, ihe a na-ekwu bụ usoro mbilite n’ọnwụ, ya mere ‘usoro’ doro anya ma ghara itinye echiche agha na-adịghị mkpa.
- source_word: ἀπαρχὴ
  choice: mkpụrụ mbụ
  rationale: Nke a na-edobe ihe atụ nke akụkụ mbụ nke owuwe ihe ubi a na-enye Chineke, nke na-egosikwa na ndị ọzọ ga-esochi.
- source_word: Χριστός
  choice: Mezaịa
  rationale: N’ebe a okwu ahụ na-arụ ọrụ dị ka aha nsọpụrụ nke pụtara Onye E Tere Mmanụ, ọ bụghị naanị dị ka aha mmadụ. ‘Mezaịa’ na-eme ka ọrụ aha nsọpụrụ ahụ pụta ìhè.
- source_word: οἱ τοῦ Χριστοῦ
  choice: ndị bụ nke Mezaịa
  rationale: Genitive ahụ na-egosi inwe ma ọ bụ ịbụ nke onye; nsụgharị a na-edobe mmekọrịta ahụ n'ụzọ dị nkenke.
- source_word: παρουσίᾳ
  choice: mgbe ọ ga-abịa
  rationale: N’ọnọdụ a, παρουσία na-ezo aka n’ọbịbịa Mezaịa n’ọdịnihu. Nsụgharị a bụ nke nkịtị ma doo ndị na-agụ Igbo anya.
theological_decisions:
- issue: Otu e si asụgharị Χριστός mgbe ọ bụ aha nsọpụrụ nwere ihe ọ pụtara banyere oge ikpeazụ
  choice: Mezaịa
  alternative: Kraịst
  rationale: Paụl na-egosi ọdịiche dị n’etiti Mezaịa na ndị bụ nke ya n’usoro mbilite n’ọnwụ. ‘Mezaịa’ na-echekwa ọrụ Χριστός dị ka aha nsọpụrụ; e tinyere ‘Kraịst’ n’ala ala peeji dị ka nsụgharị ọzọ a maara nke ọma.
- issue: Ma a ga-eji okwu nka pụrụ iche kọwaa παρουσία
  choice: mgbe ọ ga-abịa
  alternative: n’ọnụnọ ya; mgbe ọ ga-erute
  rationale: N’ebe a okwu ahụ na-ezo aka n’ihe ga-eme n’ọdịnihu, ma nsụgharị ahụ ekwesịghị ịgbakwunye nkọwa ozizi karịrị ihe Grik kwuru.
translation_notes:
  register: 'E ji Standard Igbo nke oge a, nke dị ugwu ma dịkwa mfe nghọta. E debere ahịrịokwu ahụ n’usoro abụọ nke Grik: Mezaịa dị ka mkpụrụ mbụ, ndị bụ nke ya esochizie. ‘Mkpụrụ mbụ’ na-echekwa ihe atụ owuwe ihe ubi na njikọ Akwụkwọ Nsọ ya.'
