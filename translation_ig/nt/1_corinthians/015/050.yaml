source:
  edition: SBLGNT
  text: Τοῦτο δέ φημι, ἀδελφοί, ὅτι σὰρξ καὶ αἷμα βασιλείαν θεοῦ κληρονομῆσαι οὐ ⸀δύναται, οὐδὲ ἡ φθορὰ τὴν ἀφθαρσίαν κληρονομεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/050.yaml
  text: 'I say this[a], brothers: flesh and blood cannot inherit the kingdom of God[b], nor does the perishable inherit the imperishable.'
translation:
  language: ig
  text: 'Ma, ụmụnna, ana m ekwu nke a: anụ ahụ na ọbara apụghị iketa alaeze Chineke[b]; ihe na-emebi emebi enweghịkwa ike iketa ihe na-adịghị emebi emebi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: “Anụ ahụ na ọbara” bụ akpaalaokwu na-ekwu maka ndụ mmadụ na-anwụ anwụ n’ọnọdụ ya ugbu a; ọ pụtaghị na a na-agọnahụ mbilite n’ọnwụ nke ahụ.
    reason: cultural_note
lexical_decisions:
- source_word: Τοῦτο δέ φημι
  choice: Ma ana m ekwu nke a
  rationale: “Ma” na-egosi njikọ na ntụgharị δέ n’ime arụmụka ahụ, ebe “ana m ekwu nke a” na-echekwa ụzọ Pọl si kwuo okwu ozugbo, n’etinyeghị okwu oge dịka “ugbu a.”
- source_word: ἀδελφοί
  choice: ụmụnna
  rationale: “Ụmụnna” bụ okwu Igbo dị ebube ma bụrụkwa nke a na-eji akpọ ndị otu okwukwe; ọ nwere ike ịgụnye ọgbakọ dum, ebe nkọwa ala peeji na-eme ka nke a doo anya.
- source_word: σὰρξ καὶ αἷμα
  choice: anụ ahụ na ọbara
  rationale: Nke a na-echekwa ihe oyiyi okwu Grik na akpaalaokwu ya maka ndụ mmadụ na-anwụ anwụ n’ọnọdụ ya ugbu a.
- source_word: βασιλείαν θεοῦ
  choice: alaeze Chineke
  rationale: Nke a bụ ntụgharị Igbo doro anya ma guzosie ike nke na-echekwa njikọ genitive na mkpa nkà mmụta okpukpe nke okwu ahụ.
- source_word: κληρονομῆσαι / κληρονομεῖ
  choice: iketa / eketa
  rationale: “Iketa” na-echekwa echiche nke ịnata ihe nketa ma na-edobe myirịta dị n’etiti akụkụ abụọ nke amaokwu ahụ.
- source_word: οὐ δύναται
  choice: apụghị
  rationale: Ọ bụ ụzọ Igbo dị mkpirikpi ma kwekọọ nke ọma iji gosipụta enweghị ike.
- source_word: ἡ φθορά
  choice: ihe na-emebi emebi
  rationale: Nke a na-egosi ihe nọ n’okpuru ire ure na mmebi, ma na-eme ka ọdịiche ya na ἀφθαρσία doo onye na-agụ akwụkwọ anya.
- source_word: τὴν ἀφθαρσίαν
  choice: ihe na-adịghị emebi emebi
  rationale: Nke a na-echekwa ọdịiche kpọmkwem ya na φθορά; a zere “anwụghị anwụ” n’ihi na nke ahụ metụtara ἀθανασία karịa.
theological_decisions:
- issue: Ihe “anụ ahụ na ọbara” pụtara n’ihe gbasara mbilite n’ọnwụ
  choice: E debere ya dịka akpaalaokwu na-ekwu maka ndụ mmadụ na-anwụ anwụ, nke mmebi na-emetụta n’ọnọdụ ya ugbu a.
  alternative: Ịghọta ya dị ka nkwupụta na ahụ anụ ọhụụ n’onwe ya apụghị ịbanye n’alaeze Chineke.
  rationale: Ihe gbara amaokwu a gburugburu na-ekwu maka mgbanwe site n’ihe na-emebi emebi gaa n’ihe na-adịghị emebi emebi, ọ bụghị ịhapụ ịdị n’ahụ kpamkpam. Ntụgharị ahụ na-echekwa akpaalaokwu ahụ, ebe nkọwa ala peeji na-egbochi nghọta na-ajụ mbilite n’ọnwụ nke ahụ.
- issue: Ndị ἀδελφοί na-ezo aka na ha
  choice: Jiri “ụmụnna” n’ahịrị amaokwu ma kọwaa na ọ nwere ike ịgụnye ụmụ nwoke na ụmụ nwanyị niile nọ n’ọgbakọ.
  alternative: Ụmụnna nwoke na ụmụnna nwanyị
  rationale: “Ụmụnna” bụ ntụgharị eke n’Igbo, ma ọ ka na-echekwa ụdị okwu ịkpọ oku ahụ n’enweghị ịgbasa isi ederede karịa ihe Grik kwuru.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ebube ma dị mfe nghọta. Ahịrịokwu ahụ na-echekwa myirịta na esemokwu dị n’etiti “ihe na-emebi emebi” na “ihe na-adịghị emebi emebi,” ma zere itinye nkọwa otu ụka n’ime isi ederede.
