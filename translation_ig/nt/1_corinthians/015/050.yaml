  verdict: revise
  source_fidelity: 'The draft accurately conveys the two parallel assertions: mortal “flesh and blood” cannot inherit God’s kingdom, and what is perishable does not inherit imperishability. The idiomatic and resurrection-contextual sense is appropriately retained.'
  naturalness: The main verse is understandable Standard Igbo. Reordering the vocative gives a more natural direct address, and recasting the second clause with “enweghị ike” makes the parallel inability explicit and smooth in Igbo.
  terminology: “Alaeze Chineke,” “iketa,” “anụ ahụ na ọbara,” and the paired “ihe na-emebi emebi / ihe na-adịghị emebi emebi” are suitable. Footnote a should not say that ἀδελφοί means “ụmụnne nwoke”; “ụmụnna nwoke” is the accurate explicit alternative. Footnote b benefits from more idiomatic wording that says the expression does not deny bodily resurrection.
  issues:
  - severity: low
    issue: Footnote a uses “ụmụnne nwoke” for the explicitly male alternative.
    rationale: For clarity and idiomatic consistency, “ụmụnna nwoke” is preferable; the Greek plural ἀδελφοί is literally “brothers,” while its referential scope may include the whole congregation.
  - severity: low
    issue: The second clause’s “adịghịkwa eketa” is less explicit than the Greek’s stated inability and is slightly less parallel in Igbo.
    rationale: “Enweghị ike iketa” naturally preserves the sense of inability and matches the first clause without altering meaning.
  - severity: low
    issue: Footnote b’s final wording is somewhat awkward.
    rationale: “Ọ pụtaghị na a na-agọnahụ mbilite n’ọnwụ nke ahụ” states the intended contextual clarification more naturally and precisely.
