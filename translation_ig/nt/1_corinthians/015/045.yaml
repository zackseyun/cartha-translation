reference: 1 Corinthians 15:45
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οὕτως καὶ γέγραπται· Ἐγένετο ὁ πρῶτος ἄνθρωπος Ἀδὰμ εἰς ψυχὴν ζῶσαν· ὁ ἔσχατος Ἀδὰμ εἰς πνεῦμα ζῳοποιοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/045.yaml
  text: 'So also it is written: “The first man[a], Adam, became a living being”[b]; the last Adam became a life-giving spirit.'
translation:
  language: ig
  text: 'Ọ bụkwa otu a ka e dere ya: “Mmadụ mbụ, Adam, ghọrọ onye dị ndụ”[a]; Adam ikpeazụ ghọrọ mmụọ na-enye ndụ.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “mkpụrụ obi dị ndụ,” dịka ntụgharị ọdịnala nke Jenesis 2:7 si dị.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, “mmụọ nke na-enye ndụ.” Okwu a na-akọwa Adam ikpeazụ n’ụzọ dị iche n’Adam mbụ; n’asụsụ Grik, ọ na-akọwa àgwà ya, ọ bụghị iwu na ọ na-ekwu kpọmkwem na Kraịst bụ Mmụọ Nsọ dịka onye dị iche.
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως καὶ γέγραπται
  choice: Ọ bụkwa otu a ka e dere ya
  rationale: Nke a na-ejigide njikọ καί na usoro arụmụka ahụ, ma na-eji okwu Igbo a na-ahụkarị ewebata ihe e dere n’Akwụkwọ Nsọ.
- source_word: Ἐγένετο
  choice: ghọrọ
  rationale: “Ghọrọ” na-egosi ọnọdụ mmadụ batara na ya, kwekọọkwa na γίνομαι n’ebe a karịa okwu ga-egosi naanị na e kere ya.
- source_word: ὁ πρῶτος ἄνθρωπος
  choice: Mmadụ mbụ ahụ
  rationale: “Mmadụ” bụ okwu Igbo sitere n’okike maka ἄνθρωπος; njikọ ya na Adam na-eme ka o doo anya na nwoke a bụ onye a na-ekwu maka ya, ma na-echekwa ọrụ nnọchianya ya.
- source_word: Ἀδὰμ
  choice: Adam
  rationale: E debere aha onye ahụ n’ụdị Igbo a maara nke ọma.
- source_word: εἰς ψυχὴν ζῶσαν
  choice: onye dị ndụ
  rationale: N’olu Jenesis 2:7, ψυχή na-ezo aka n’Adam dịka mmadụ dị ndụ, ọ bụghị n’ụzọ doro anya n’akụkụ ime mmụọ nke pụrụ iche n’ahụ. “Onye dị ndụ” bụ Igbo ebumpụta ụwa ma zere ịkọwa nkà mmụta banyere ọdịdị mmadụ karịa ihe amaokwu ahụ kwuru.
- source_word: ὁ ἔσχατος Ἀδὰμ
  choice: Adam ikpeazụ ahụ
  rationale: Nke a na-echekwa ntụnyere Pọl mere n’etiti Adam mbụ na Adam ikpeazụ, na-enweghị itinye nkọwa ọzọ n’ime ederede.
- source_word: εἰς πνεῦμα ζῳοποιοῦν
  choice: mmụọ na-enye ndụ
  rationale: “Mmụọ na-enye ndụ” na-egosipụta πνεῦμα ζῳοποιοῦν n’ụzọ doro anya ma dị mma n’Igbo, ma na-echekwa ọdịdị nkọwa nke ahịrịokwu Grik ahụ.
theological_decisions:
- issue: Ihe ψυχὴν ζῶσαν pụtara n’okwu e hotara na Jenesis
  choice: onye dị ndụ
  alternative: mkpụrụ obi dị ndụ
  rationale: N’ebe a, okwu ahụ na-akọwa Adam dịka mmadụ e nyere ndụ, ọ bụghị isi nkuzi doro anya banyere mkpụrụ obi na-enweghị ahụ. E debere ntụgharị ọdịnala ahụ n’ala peeji.
- issue: Ihe okwu “Adam ikpeazụ ahụ ghọrọ mmụọ na-enye ndụ” pụtara
  choice: 'E debere ntụnyere ahụ n’ụdị nkọwa: “mmụọ na-enye ndụ.”'
  alternative: Mmụọ ahụ na-enye ndụ; mmụọ nke na-enye ndụ
  rationale: πνεῦμα enweghị akara njirimara n’asụsụ Grik ma bụrụ nke na-akọwa àgwà. Ya mere, a naghị eji isi mkpụrụedemede ma ọ bụ nkọwa mgbakwunye mee ka ahịrịokwu ahụ bụrụ njirimara doro anya nke Kraịst na Mmụọ Nsọ dịka onye dị iche; a na-echekwa esemokwu na ntụnyere Pọl n’onwe ya.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. A họọrọ “onye dị ndụ” kama ntụgharị okwu-na-okwu “mkpụrụ obi dị ndụ” ka olu Jenesis doo anya n’Igbo, ebe e chekwara ntụgharị ọdịnala ahụ n’ala peeji. E tinyere akara ala peeji [a] na [b] n’ederede isi.
