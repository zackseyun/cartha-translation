id: 1CO.15.41
reference: 1 Corinthians 15:41
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἄλλη δόξα ἡλίου, καὶ ἄλλη δόξα σελήνης, καὶ ἄλλη δόξα ἀστέρων, ἀστὴρ γὰρ ἀστέρος διαφέρει ἐν δόξῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/041.yaml
  text: There is one glory of the sun[a], and another glory of the moon, and another glory of the stars; for star differs from star in glory.
translation:
  language: ig
  text: Anyanwụ nwere ebube ya, ọnwa nwekwara ebube ya, kpakpando nwekwara ebube ya; n’ihi na otu kpakpando dị iche na kpakpando ọzọ n’ebube.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄλλη
  choice: dị iche ... dịkwa iche ... dịkwa iche
  rationale: Nkwughachi a na-egosi ọdịiche dị n’etiti anyanwụ, ọnwa, na kpakpando. Usoro a bụ Igbo nkịtị ma na-edobe ọdịiche nke okwu Grik ahụ.
- source_word: δόξα
  choice: ebube
  rationale: N’ebe a ọ na-agụnye ìhè na ịma mma a na-ahụ anya, ma “ebube” na-edobekwa njikọ okwu ahụ na arụmụka Pọl banyere ebube nke ahụ mbilite n’ọnwụ.
- source_word: ἡλίου
  choice: nke anyanwụ
  rationale: Ọ bụ genitive nke dabere na δόξα, ya bụ, ebube nke anyanwụ.
- source_word: σελήνης
  choice: nke ọnwa
  rationale: Ọ bụ genitive nke dabere na δόξα, n’usoro yiri nke anyanwụ.
- source_word: ἀστέρων
  choice: nke kpakpando
  rationale: Ọ bụ plural genitive na-emecha usoro anyanwụ, ọnwa, na kpakpando; “kpakpando” nwere ike ịrụ ọrụ dịka aha mkpokọta na Igbo.
- source_word: ἀστὴρ ... ἀστέρος
  choice: otu kpakpando ... ibe ya
  rationale: Nke a na-edobe ntụnyere otu kpakpando na kpakpando ọzọ n’ụzọ Igbo na-ada nke ọma.
- source_word: γὰρ
  choice: n’ihi na
  rationale: Ọ na-ewebata nkọwa ma ọ bụ ihe mere e ji kwuo ahịrịokwu bu ụzọ.
- source_word: διαφέρει
  choice: dị iche
  rationale: Ọ na-egosi ọdịiche, na-enweghị ịmanye echiche na otu karịrị ibe ya.
- source_word: ἐν δόξῃ
  choice: n’ebube
  rationale: Ọ na-akọwa akụkụ nke ọdịiche ahụ ma na-edobe nkwughachi nke δόξα.
theological_decisions:
- issue: Ịsụgharị δόξα n’ihe atụ gbasara ihe ndị dị n’eluigwe n’ime okwu banyere mbilite n’ọnwụ
  choice: ebube
  alternative: ọmarịcha ìhè; nchapụta
  rationale: Ọ bụ ezie na ihe a na-ekwu ozugbo bụ ìhè dị iche iche nke ihe ndị dị n’eluigwe, “ebube” na-edobe njikọ okwu na echiche Pọl banyere ahụ mbilite n’ọnwụ, na-enweghị imechi nkọwa ahụ naanị n’ìhè anụ ahụ.
translation_notes:
  register: Asụsụ Igbo Izugbe dị ugbu a, kwụ ọtọ ma dị ùgwù. E ji “dị iche” mee ka ọdịiche ahụ doo anya, ebe e ji “ebube” chekwaa ma echiche nke nchapụta a na-ahụ anya ma njikọ ya na isiokwu mbilite n’ọnwụ.
