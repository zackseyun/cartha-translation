source:
  edition: SBLGNT
  text: ὅταν δὲ τὸ ⸂φθαρτὸν τοῦτο ἐνδύσηται ἀφθαρσίαν καὶ τὸ⸃ θνητὸν τοῦτο ἐνδύσηται ⸀ἀθανασίαν, τότε γενήσεται ὁ λόγος ὁ γεγραμμένος· Κατεπόθη ὁ θάνατος εἰς νῖκος.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/054.yaml
  text: 'But when this perishable puts on imperishability[a], and this mortal puts on immortality[d][c][b], then the written word will come to pass: “Death has been swallowed up in victory.”'
translation:
  language: ig
  text: 'Ma mgbe ihe a na-emebi emebi ga-eyikwasị ihe na-adịghị emebi emebi, ihe a na-anwụ anwụ ga-eyikwasịkwa ihe na-adịghị anwụ anwụ, mgbe ahụ okwu ahụ e dere ede[a][d] ga-emezu[b]: “E lodala ọnwụ ná mmeri.”[c]


    [a] A pụkwara ịsụ ya, “okwu ahụ e kwuru nke e dere ede.”


    [b] A pụkwara ịsụ ya, “mgbe ahụ okwu ahụ e dere ede ga-abịa bụrụ eziokwu.” N’ụzọ pụtara ihe kpọmkwem, ngwaa Grik ahụ pụtara “ga-eme” ma ọ bụ “ga-abịa bụrụ eziokwu.”


    [c] E si n’Aịzaya 25:8 hota okwu a; nhazi okwu ya na-agbaso ọdịnala Grik nke Pọl hotara.


    [d] A pụkwara ịsụ ya, “okwu ahụ e dere.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “okwu ahụ e kwuru nke e dere ede.”
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụ ya, “mgbe ahụ okwu ahụ e dere ede ga-abịa bụrụ eziokwu.” N’ụzọ pụtara ihe kpọmkwem, ngwaa Grik ahụ pụtara “ga-eme” ma ọ bụ “ga-abịa bụrụ eziokwu.”
    reason: alternative_reading
  - marker: c
