    reason: cross_reference
  - marker: d
    text: A pụkwara ịsụ ya, “okwu ahụ e dere.”
    reason: previous_rendering
lexical_decisions:
- source_word: φθαρτὸν
  choice: ihe a na-emebi emebi
  rationale: Ọ na-egosi ihe—n’ebe a, ahụ mmadụ dị ugbu a—nke mmebi na ire ure na-emetụta. Nhọrọ a bụ Igbo dị mfe ma na-emekọ nke ọma na ‘ihe na-adịghị emebi emebi.’
- source_word: ἐνδύσηται
  choice: yikwasịrị
  rationale: Ọ na-echekwa ihe atụ Pọl ji mee ihe banyere iyi uwe ma na-egosi na ihe a na-emebi emebi ga-eyikwasị ọnọdụ ọhụrụ.
- source_word: ἀφθαρσίαν
  choice: ihe na-adịghị emebi emebi
  rationale: Igbo na-ekwukarị àgwà a n’ụdị nkọwa kama iji aha echiche siri ike; ọ na-echekwa ọdịiche ya na φθαρτόν.
- source_word: θνητὸν
  choice: ihe a na-anwụ anwụ
  rationale: Ọ na-egosi ihe ọnwụ nwere ike imetụta, ma na-emepụta njikọ doro anya na ‘ihe na-adịghị anwụ anwụ.’
- source_word: ἀθανασίαν
  choice: ihe na-adịghị anwụ anwụ
  rationale: Nke a bụ ụzọ Igbo nkịtị na nke doro anya isi kwuo ọnọdụ enweghị ọnwụ.
- source_word: γενήσεται
  choice: ga-eme
  rationale: Ọ na-edobe isi ngwaa γίνομαι, ‘ime’ ma ọ bụ ‘ịbịa na ya,’ n’etinyeghị okwu ‘mmezu’ n’ahịrị bụ isi. E nyere ‘ga-emezu’ dị ka ụzọ ọzọ n’ala peeji.
- source_word: ὁ λόγος ὁ γεγραμμένος
  choice: okwu ahụ e dere ede
  rationale: ‘Okwu’ na-anọgide nso na λόγος, ebe ‘e dere ede’ na-egosi na ọ bụ okwu Akwụkwọ Nsọ a na-ehota.
- source_word: Κατεπόθη
  choice: E lodala
  rationale: Ọ na-echekwa ihe atụ nke iloda ihe na olu nnara, n’akpọghị onye mere ya aha; ọdịdị ngwaa a na-egosikwa na n’oge ahụ ihe ahụ abụrụla ihe mezuru.
- source_word: εἰς νῖκος
  choice: ná mmeri
  rationale: Ọ bụ ntụgharị Igbo dị nkenke nke na-egosi na ọnwụ ezuola oke n’imeri, na-enweghị ime ka ‘mmeri’ bụrụ onye a kpọrọ aha dị ka onye lodara ya.
theological_decisions:
- issue: Otú e si sụgharịa γενήσεται n’ihe metụtara okwu Akwụkwọ Nsọ a hotara
  choice: ga-eme
  alternative: ga-emezu; ga-abịa na ya
  rationale: Nke a na-echekwa ngwaa Grik pụtara ‘ime’ ma ọ bụ ‘ịbịa na ya,’ n’agbanyeghị na ihe gbara ya gburugburu na-egosi na okwu ahụ ga-abụ eziokwu. Ọ naghị etinye usoro okwu mmezu siri ike karịa ihe Grik kwuru.
- issue: Oge na ọdịdị nke Κατεπόθη n’okwu ahụ a hotara
  choice: E lodala ọnwụ ná mmeri
  alternative: E loro ọnwụ ná mmeri; A na-eloda ọnwụ ná mmeri
  rationale: '‘E lodala’ dabara n’okwu Pọl banyere oge ga-abịa: mgbe ahụ, a ga-ahụ ọnwụ dị ka ihe e meriri ma lodaa. Olu nnara na-ahapụ onye mere omume ahụ n’ekwughị aha, dịka Grik si mee.'
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. A hapụrụ ihe atụ iyi uwe na nke iloda ihe n’ihi na ha bụ isi ihe osise Pọl ji rụọ ọrụ. E jiri nkebiokwu nkọwa mee φθαρσία/ἀφθαρσία na θνητόν/ἀθανασία n’ihi na nke ahụ na-ada eke karịa aha echiche ndị siri ike n’Igbo.
