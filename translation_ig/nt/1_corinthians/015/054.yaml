review_pass:
  verdict: revise
  source_fidelity: 'N''ụzọ bụ isi, ntụgharị ahụ na-edobe usoro na ihe osise Grik nke ọma: ihe na-emebi emebi/na-anwụ anwụ, iyi uwe, na iloda ọnwụ. Ma «ga-eme» adịghị arụ ọrụ nke ọma n’Igbo mgbe isiokwu ya bụ «okwu ahụ e dere ede»; n’ebe a γενήσεται na-ekwu na okwu e dere ga-emezu/ga-abịa bụrụ eziokwu. «Ga-emezu» bụ ụzọ Igbo doro anya ma kwesị ekwesị n’ọnọdụ a, ọ bụ ezie na ọ na-akọwa idiom ahụ karịa ntụgharị okwu-na-okwu.'
  naturalness: A chọrọ mgbanwe nta iji mee ka ahịrịokwu ahụ daa nke ọma n’Igbo Standard. «Mgbe ... yikwasịrị» na-eji ọdịdị gara aga n’ebe ọnọdụ ọdịnihu Grik chọrọ; «ga-eyikwasị» na-egosi nke a nke ọma. Ọzọkwa, «ga-abịa na ya» n’ala peeji abụghị nkọwa Igbo ziri ezi maka γίνομαι n’amaokwu a.
  terminology: «ihe a na-emebi emebi», «ihe na-adịghị emebi emebi», «ihe a na-anwụ anwụ», na «ihe na-adịghị anwụ anwụ» bụ okwu doro anya ma na-echekwa nkwekọrịta okwu ndị Grik. «E lodala ọnwụ ná mmeri» na-edobe olu nnara na ihe osise nke Κατεπόθη, n’enweghị ịkpọ onye meriri ọnwụ aha. E debere «okwu ahụ e dere ede» maka ὁ λόγος ὁ γεγραμμένος.
  issues:
  - severity: medium
    issue: «okwu ahụ e dere ede ga-eme»
    rationale: Nke a adịghị eke n’Igbo ma na-eme ka «okwu» bụrụ onye na-eme ihe. N’ọnọdụ a, idiom Grik ahụ pụtara na okwu e dere ga-emezu ma ọ bụ ga-abịa bụrụ eziokwu.
  - severity: medium
    issue: «ga-abịa na ya» n’ala peeji [b]
    rationale: Nkebiokwu a pụtara ịbịarute ihe/ebe, ọ bụghị ‘come to pass’; ya mere ọ naghị akọwa γενήσεται n’amaokwu a n’ụzọ ziri ezi.
  - severity: low
    issue: «yikwasịrị» n’azụ «mgbe»
    rationale: Ọdịdị a na-ada ka ihe emechalarị, ebe ahịrịokwu ahụ na-ele anya n’oge ọdịnihu. «ga-eyikwasị» na-eme ka oge ahụ pụta ìhè ma dịrị Igbo eke.
