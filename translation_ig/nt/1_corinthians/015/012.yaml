revisions:
- from: Ọ bụrụ na a na-ekwusa na e meela ka Mesaya ahụ si n’etiti ndị nwụrụ anwụ bilie[a], olee otú ụfọdụ n’ime unu si ekwu na mbilite n’ọnwụ nke ndị nwụrụ anwụ adịghị?
  to: Ọ bụrụ na a na-ekwusa na e meela ka Mesaya si n’etiti ndị nwụrụ anwụ bilie[a], olee otú ụfọdụ n’ime unu si ekwu na mbilite n’ọnwụ nke ndị nwụrụ anwụ adịghị?
  rationale: Removed the potentially deictic ahụ from the title Mesaya and made the footnote a precise lexical alternative for Χριστός. The translation otherwise preserves the Greek grammar, rhetorical force, and resurrection terminology.
  reviewer_model: gpt-5.6-terra
