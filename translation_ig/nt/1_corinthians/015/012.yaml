id: 1CO.15.12
reference: 1 Corinthians 15:12
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Εἰ δὲ Χριστὸς κηρύσσεται ὅτι ἐκ νεκρῶν ἐγήγερται, πῶς λέγουσιν ⸂ἐν ὑμῖν τινες⸃ ὅτι ἀνάστασις νεκρῶν οὐκ ἔστιν;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/012.yaml
  text: If the Messiah is proclaimed as having been raised from the dead[a], how can some among you say that there is no resurrection of the dead?
translation:
  language: ig
  text: Ọ bụrụ na a na-ekwusa na e meela ka Mesaya si n’etiti ndị nwụrụ anwụ bilie[a], olee otú ụfọdụ n’ime unu si ekwu na mbilite n’ọnwụ nke ndị nwụrụ anwụ adịghị?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Kraịst.” A pụrụ ịsụgharị okwu Grik Χριστός dịka “Mesaya” ma ọ bụ “Kraịst”; n’ebe a, isi ederede jiri “Mesaya” mee ka aha-ọkwa ahụ pụta ìhè.
    reason: alternative_reading
lexical_decisions:
- source_word: Χριστὸς
  choice: Mesaya ahụ
  rationale: A sụgharịrị aha-ọkwa ahụ dịka “Mesaya” iji gosipụta ihe Χριστός pụtara n’arụmụka Pọl; “ahụ” na-eme ka aha-ọkwa a bụrụ nke a kapịrị ọnụ n’Igbo ekeghị eke.
- source_word: κηρύσσεται
  choice: a na-ekwusa
  rationale: Ụdị a na-egosi nkwusa ọha na-aga n’ihu ma na-edobekwa olu nnara nke okwu Grik.
- source_word: ἐκ νεκρῶν
  choice: si n’etiti ndị nwụrụ anwụ
  rationale: Nke a na-egosipụta n'ụzọ doro anya na νεκρῶν bụ ọtụtụ mmadụ nwụrụ anwụ, ma ghara ime ka okwu ahụ bụrụ naanị “ọnwụ” dịka ọnọdụ.
- source_word: ἐγήγερται
  choice: e meela ka ... bilie
  rationale: 'Nke a na-edobe olu nnara na ọdịdị zuru-oke nke ngwaa Grik: omume ahụ emezuola, ihe si na ya pụta ka dịkwa.'
- source_word: πῶς
  choice: olee otú ... si
  rationale: Ajụjụ a na-egosi na okwu ndị ahụ abụọ ekwekọghị; usoro a bụ ụzọ Igbo si ajụ ụdị ajụjụ ahụ n’ụzọ eke.
- source_word: ἐν ὑμῖν τινες
  choice: ụfọdụ n’ime unu
  rationale: Ọ na-akọwa na ọ bụ naanị ụfọdụ ndị nọ n’ọgbakọ Kọrịnt ka Pọl na-ekwu maka ha.
- source_word: ἀνάστασις νεκρῶν
  choice: mbilite n’ọnwụ nke ndị nwụrụ anwụ
  rationale: Nke a na-edobe njikọ genitivu ma na-ezo aka na mbilite n’ọnwụ izugbe nke ndị nwụrụ anwụ.
- source_word: οὐκ ἔστιν
  choice: adịghị
  rationale: N’usoro ahịrịokwu Igbo a, “adịghị” na-egosipụta n’ụzọ eke na ihe ahụ adịghị adị.
theological_decisions:
- issue: Nsụgharị Χριστός n’okwu Pọl
  choice: Mesaya ahụ
  alternative: Kraịst
  rationale: N’ebe a, okwu ahụ na-arụ ọrụ dịka aha-ọkwa, ya mere “Mesaya” na-eme ka ihe ọ pụtara pụta ìhè. Ihe odide ala peeji na-edobe “Kraịst” dịka nsụgharị ọzọ a na-anabata.
- issue: Olu nnara dị na ἐγήγερται
  choice: e meela ka ... bilie
  alternative: '... esitela n’ọnwụ bilie'
  rationale: A hapụghị olu nnara ahụ ka ọ ghọọ olu omume, a kpọpụtaghịkwa Chineke aha n’ahịrịokwu ahụ ebe ederede Grik ekwughị onye mere omume ahụ kpọmkwem.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E debere ajụjụ arụmụka Pọl n’usoro Igbo eke, ma e chekwara ọdịiche dị n’etiti mbilite Mesaya na mbilite n’ọnwụ izugbe nke ndị nwụrụ anwụ.
