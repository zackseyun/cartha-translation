source:
  edition: SBLGNT
  text: οὐ πᾶσα σὰρξ ἡ αὐτὴ σάρξ, ἀλλὰ ἄλλη μὲν ἀνθρώπων, ἄλλη δὲ σὰρξ κτηνῶν, ἄλλη δὲ ⸂σὰρξ πτηνῶν⸃, ἄλλη δὲ ⸀ἰχθύων.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/039.yaml
  text: Not all flesh is the same flesh[a], but one kind is of humans, another flesh of animals, another of birds[b], and another of fish.
translation:
  language: ig
  text: Ọ bụghị anụ ahụ niile bụ otu ụdị anụ ahụ,[a] kama anụ ahụ nke ụmụ mmadụ bụ otu ụdị, anụ ahụ nke anụmanụ bụ ụdị ọzọ, anụ ahụ nke ụmụ nnụnụ bụ ụdị ọzọ, anụ ahụ nke azụ̀ bụkwa ụdị ọzọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ịsụ ya: “Ọ bụghị anụ ahụ niile bụ otu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: σὰρξ
  choice: anụ ahụ
  rationale: N'ebe a, okwu ahụ na-ekwu banyere anụ ahụ nkịtị nke ihe ndị dị ndụ, ọ bụghị banyere ọchịchọ mmehie. “Anụ ahụ” na-echekwa ihe okwu Grik pụtara n'ụzọ doro anya.
- source_word: οὐ πᾶσα σὰρξ ἡ αὐτὴ σάρξ
  choice: Ọ bụghị anụ ahụ niile bụ otu ụdị anụ ahụ
  rationale: Nke a na-echekwa nkwughachi nke σάρξ ma na-eme ka ọdịiche dị n'etiti ụdị anụ ahụ doo anya n'Igbo dị ugbu a.
- source_word: ἄλλη
  choice: dị iche
  rationale: ἄλλη na-egosi na otu ụdị dị iche na nke ọzọ. N'usoro ndepụta Igbo a, nkwughachi “dị iche” na-enye ahịrịokwu ahụ ụda doro anya ma kwekọọ na nkwughachi Grik.
- source_word: ἀνθρώπων
  choice: ụmụ mmadụ
  rationale: Okwu ahụ na-ezo aka n'ụmụ mmadụ n'ozuzu ha, ọ bụghị naanị ụmụ nwoke.
- source_word: κτηνῶν
  choice: anụmanụ
  rationale: N'agbanyeghị na κτηνῶν pụrụ ịpụta anụ ụlọ, n'okwu a ọ bụ otu ìgwè ihe e kere eke e ji tụnyere mmadụ, nnụnụ, na azụ; “anụmanụ” bụ okwu sara mbara ma doo anya.
- source_word: πτηνῶν
  choice: ụmụ nnụnụ
  rationale: N'ebe a, “ụmụ nnụnụ” bụ ụzọ Igbo dị mfe ma bụrụ nke a na-ejikarị akọwa ìgwè ihe ndị na-efe efe a.
- source_word: ἰχθύων
  choice: azụ̀
  rationale: “Azụ̀” bụ okwu Igbo nkịtị maka ìgwè anụ mmiri a, ma akara ụda na-enyere aka ịmata ya iche n'okwu ọzọ a na-ede otu ụdị.
- source_word: σὰρξ κτηνῶν / σὰρξ πτηνῶν / ἰχθύων
  choice: anụ ahụ nke anụmanụ ... nke ụmụ nnụnụ ... nke azụ̀
  rationale: Asụsụ Grik kwughachiri σὰρξ n'akụkụ anụmanụ na nnụnụ, ma hapụ ya ka a ghọta ya n'akụkụ azụ. Igbo na-eburu “anụ ahụ” n'uche n'akụkụ ndị sochirinụ ka ahịrịokwu ahụ ghara ịdị arọ.
theological_decisions:
- issue: Nsụgharị σάρξ n'okwu Pọl banyere mbilite n'ọnwụ
  choice: anụ ahụ n'ụzọ nkịtị
  alternative: ahụ; ọdịdị mmehie
  rationale: Ihe gbara amaokwu a gburugburu na-atụle ụdị ahụ nke ihe ndị e kere eke na mbilite n'ọnwụ. Ya mere, ọ bụghị ihe atụ nke ọchịchọ mmehie; a ga-edebe ihe ọ pụtara n'ụzọ nkịtị.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. A họọrọ usoro “nke ... dị iche” iji gosipụta usoro nkwughachi ἄλλη n'ụzọ na-ada nke ọma n'Igbo, ebe e debere nkwughachi “anụ ahụ” n'okwu mmeghe maka ịdị nso n'usoro Grik.
