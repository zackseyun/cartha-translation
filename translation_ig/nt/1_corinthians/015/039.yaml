revisions:
- from: Ọ bụghị anụ ahụ niile bụ otu ụdị anụ ahụ,[a] kama anụ ahụ nke ụmụ mmadụ dị iche, nke anụmanụ dị iche, nke ụmụ nnụnụ dị iche, nke azụ̀ dịkwa iche.
  to: Ọ bụghị anụ ahụ niile bụ otu ụdị anụ ahụ,[a] kama anụ ahụ nke ụmụ mmadụ bụ otu ụdị, anụ ahụ nke anụmanụ bụ ụdị ọzọ, anụ ahụ nke ụmụ nnụnụ bụ ụdị ọzọ, anụ ahụ nke azụ̀ bụkwa ụdị ọzọ.
  rationale: The revision retains the literal rendering of σάρξ and its emphatic repetition in the opening, while expressing the Greek sequence ἄλλη ... ἄλλη ... ἄλλη ... ἄλλη with a clear, idiomatic Igbo pattern of “otu ụdị ... ụdị ọzọ.” The footnote remains a valid smoother alternative and its anchor is retained.
