source:
  edition: SBLGNT
  text: ἰδοὺ μυστήριον ὑμῖν λέγω· ⸀πάντες οὐ κοιμηθησόμεθα πάντες δὲ ἀλλαγησόμεθα,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/051.yaml
  text: 'Behold[a], I tell you a mystery: we will not all sleep, but we will all be changed[b],'
translation:
  language: ig
  text: 'Lee, ana m agwa unu ihe omimi: ọ bụghị anyị niile ga-arahụ ụra[a], ma a ga-agbanwe anyị niile[b],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n’ụzọ na-akọwa ihe ọ pụtara karịa, “ọ bụghị anyị niile ga-anwụ.” Asụsụ Grik kwuru “ịrahụ ụra,” ihe atụ Agba Ọhụrụ na-ejikarị ekwu maka ọnwụ n’ìhè mbilite n’ọnwụ.
    reason: lexical_alternative
  - marker: b
    text: Ọgụgụ dị iche dị mkpa n’ụfọdụ ihe odide na-ekwu, n’ihe ọ pụtara, “anyị niile ga-arahụ ụra, ma ọ bụghị anyị niile ka a ga-agbanwe.” Isi ederede gbasoro ọgụgụ SBLGNT.
    reason: textual_variant
lexical_decisions:
- source_word: ἰδοὺ
  choice: Lee
  rationale: Ọ bụ okwu e ji akpọ uche ndị na-ege ntị ka ha ṅaa ntị n’okwu dị mkpa na-esonụ; ọ dabara n’asụsụ Igbo dị ugwu ma bụrụkwa nke a na-aghọta ngwa ngwa.
- source_word: μυστήριον
  choice: ihe omimi
  rationale: N’ebe a, ọ pụtara eziokwu Chineke nke e zoro ezo na mbụ ma a na-ekpughe ugbu a, ọ bụghị naanị ihe siri ike nghọta. ‘Ihe omimi’ na-echekwa echiche Pọl na ịdị ugwu nke okwu ahụ.
- source_word: ὑμῖν λέγω
  choice: ana m agwa unu
  rationale: Nke a bụ ụzọ Igbo si ekwu ya n’ụzọ ebumpụta ụwa, ma ọ na-echekwa onye mbụ na okwu a na-agwa ọtụtụ mmadụ kpọmkwem.
- source_word: πάντες οὐ κοιμηθησόμεθα
  choice: ọ bụghị anyị niile ga-arahụ ụra
  rationale: 'Nhazi a na-eme ka oke nkw否 Greek doo anya: ụfọdụ agaghị anwụ tupu mgbanwe ahụ. E debere ihe atụ ‘ịrahụ ụra’ nke Agba Ọhụrụ ji ekwu ọnwụ n’ìhè olileanya mbilite n’ọnwụ.'
- source_word: πάντες δὲ ἀλλαγησόμεθα
  choice: ma a ga-agbanwe anyị niile
  rationale: Ụdị nnara a na-egosipụta ἀλλαγησόμεθα nke ọma ma na-ekwu maka mgbanwe nke ga-eme mmadụ n’ọdịnihu. ‘Ma’ na-egosipụta ọdịiche dị n’etiti na ọ bụghị mmadụ niile ga-anwụ na na mmadụ niile ga-agbanwe.
theological_decisions:
- issue: Ihe ‘ịrahụ ụra’ pụtara n’okwu gbasara mbilite n’ọnwụ
  choice: E debere ‘ịrahụ ụra’ dịka ihe atụ maka ọnwụ anụ ahụ tupu mbilite n’ọnwụ.
  alternative: Ịsụgharị ya ozugbo dịka ‘ịnwụ’.
  rationale: Ichekwa ihe atụ Pọl na-echekwa njikọ okwu ya na mbilite n’ọnwụ, ma ọ naghị akwado ozizi pụrụ iche banyere ọnọdụ mkpụrụ obi mgbe mmadụ nwụrụ.
- issue: Ọdịiche ederede gbasara usoro na ihe ahịrịokwu abụọ ahụ pụtara
  choice: 'Isi ederede gbasoro SBLGNT: ‘ọ bụghị anyị niile ga-arahụ ụra, ma a ga-agbanwe anyị niile.’'
  alternative: 'Ọdịiche ederede a ma ama na-enye echiche yiri: ‘anyị niile ga-arahụ ụra, ma ọ bụghị anyị niile ka a ga-agbanwe.’'
  rationale: A sụgharịrị ederede Greek e nyere ozugbo. E tinyere ọdịiche ahụ dị mkpa n’ala ala peeji kama ịhọrọ ya dịka isi ederede.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta. E tinyere [a] n’akụkụ ‘ịrahụ ụra,’ bụ ebe nkọwa ala ala peeji ya metụtara kpọmkwem, ma tinye [b] n’akụkụ ‘agbanwe’ maka ọdịiche ederede.
