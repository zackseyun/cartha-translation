  verdict: revise
  source_fidelity: Ihe ọnwụ ji agba mmadụ bụ mmehie na-ewepụta nke ọma echiche κέντρον dị ka ihe ọnwụ ji emerụ mmadụ, mana «mmadụ» bụ nkọwa a gbakwunyere nke na-adịghị n’edemede Grik. Nsụgharị a gbanwere na-edobe ihe atụ ahụ n’enweghị itinye onye ihe ahụ metụtara. «Ike» dabara na δύναμις, «mmehie» na ἁμαρτία, na «iwu» na ὁ νόμος.
  naturalness: «Ihe ọnwụ ji agba bụ mmehie» bụ Igbo Izugbe dị mfe ma na-agụ nke ọma n’ụdị ilu/atụ okwu nke amaokwu a. Iji «ma» n’akụkụ nke abụọ na-anọchi ọrụ njikọ δέ nke ọma, n’enweghị itinye echiche siri ike karịa nke Grik.
  terminology: E debere «mmehie», «ike», na «iwu» dịka okwu Akwụkwọ Nsọ Igbo a na-ahụkarị. Emeghị «iwu» ka ọ bụrụ naanị Iwu Mosis n’ederede isi; nkọwa ala na-akọwa ihe o yikarịrị ka Pọl bu n’uche n’enweghị imechi ohere ọgụgụ ọzọ.
