translation:
  language: ig
  text: Ihe ọnwụ ji agba bụ mmehie; ike[a] mmehie bụ iwu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ, “ume”: “ume mmehie bụ iwu.”'
    reason: lexical_alternative
  - marker: b
    text: O yikarịrị ka “iwu” ebe a na-ezo aka karịsịa n’Iwu Mosis n’arụmụka Pọl, ọ bụ ezie na okwu ahụ nwekwara ike ịgụnye ọrụ iwu n’ozuzu ya n’ikpughe mmehie na ime ka ike mmehie bawanye.
    reason: alternative_reading
lexical_decisions:
- source_word: κέντρον
  choice: ihe ... ji agba mmadụ
  rationale: N’ebe a, okwu ahụ na-egosi ihe dị nkọ e ji agba ma merụọ mmadụ. Nkebiokwu a na-enye Igbo dị mfe ma na-edobe ihe atụ nke ọnwụ dị ka onye nwere ihe ọ na-eji agba mmadụ.
- source_word: θανάτου
  choice: ọnwụ
  rationale: 'A haziri njikọ genitive ahụ n’ụzọ Igbo si ekwu ya: ihe ọnwụ ji agba mmadụ.'
- source_word: ἁμαρτία
  choice: mmehie
  rationale: Nke a bụ okwu Igbo a na-ejikarị akọwa ἁμαρτία; e debere ya n’otu n’ihi na Pọl na-ekwu maka mmehie dị ka ike ma ọ bụ ụkpụrụ na-achị.
- source_word: δύναμις
  choice: ike
  rationale: ‘Ike’ na-egosi ikike ma ọ bụ ume mmehie nwere, ma ọ ka na-ahapụkwa echiche ọzọ nke ‘ume’ ma ọ bụ ‘ịdị ike.’
- source_word: νόμος
  choice: iwu
  rationale: ‘Iwu’ na-edobe okwu Grik ahụ n’enweghị ime ka ọ bụrụ naanị Iwu Mosis, ọ bụ ezie na arụmụka Pọl na-atụkarị aka n’Iwu Mosis.
- source_word: δὲ
  choice: ; ... bụkwa
  rationale: δὲ nke mbụ na-arụ ọrụ nkọwa n’usoro okwu ahụ, ya mere a chọghị itinye okwu mmalite pụrụ iche; nke abụọ pụtara nke ọma site na ‘bụkwa.’
theological_decisions:
- issue: Ihe ‘iwu’ pụtara mgbe Pọl kwuru na ọ bụ ike mmehie
  choice: E ji ‘iwu’ dee ya n’ụzọ sara mbara, na-enweghị ịkpọ ya kpọmkwem ‘Iwu Mosis.’
  alternative: ‘Iwu Mosis’ kpọmkwem, ma ọ bụ iwu dị ka ụkpụrụ n’ozuzu ya.
  rationale: Ihe gbara amaokwu a gburugburu na echiche Pọl na-eme ka Iwu Mosis bụrụ ihe o yikarịrị ka ọ na-ekwu maka ya, ma okwu Grik ahụ n’onwe ya ekwesịghị ka nsụgharị mechie ụzọ n’echiche sara mbara banyere ọrụ iwu n’ikpughe na ime ka mmehie sie ike.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị mfe ma dị ùgwù. ‘Ihe ọnwụ ji agba mmadụ’ na-eme ka ihe atụ κέντρον doo onye nkịtị anya n’enweghị itinye anụmanụ dị ka akpị, nke ederede Grik ekwughị kpọmkwem.
