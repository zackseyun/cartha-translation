id: 1CO.15.1
reference: 1 Corinthians 15:1
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Γνωρίζω δὲ ὑμῖν, ἀδελφοί, τὸ εὐαγγέλιον ὃ εὐηγγελισάμην ὑμῖν, ὃ καὶ παρελάβετε, ἐν ᾧ καὶ ἑστήκατε,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/001.yaml
  text: I make known to you[a], brothers, the good news that I proclaimed to you, which you also received, in which you also stand,
translation:
  language: ig
  text: Ana m eme ka unu mara, ụmụnna[a], ozi ọma ahụ m kwusara unu, nke unu natakwara, nke unu guzosikwara ike n’ime ya,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịghọta ya dịka “ụmụnna nwoke na ụmụnna nwanyị.” Okwu Grik ahụ bụ okwu a na-asụgharịkarị “ụmụnna nwoke,” ma n’ebe a, a na-ejikarị ụdị nwoke ahụ agwa ọgbakọ ndị kwere ekwe dum.
    reason: lexical_alternative
lexical_decisions:
- source_word: Γνωρίζω
  choice: Ana m eme ka unu mara
  rationale: Nke a na-egosipụta kpọmkwem echiche nke ime ka mmadụ mara ma ọ bụ ịkọwara ya ihe; ọ naghị agbanwe ya ka ọ bụrụ naanị ‘ichetara.’
- source_word: δὲ
  choice: ahapụrụ ya n’asụsụ a sụgharịrị
  rationale: Ọ bụ njikọ dị nro na-egosi ntụgharị n’okwu. N’ebe a, itinye ‘ugbu a’ nwere ike ime ka ọ bụrụ okwu gbasara oge, ya mere usoro Igbo ahụ na-eburu ntụgharị ahụ n’enweghị okwu ọzọ.
- source_word: ἀδελφοί
  choice: ụmụnna[a]
  rationale: ‘Ụmụnna’ bụ okwu Igbo dị ùgwù na nke a na-ejikarị akpọ ndị otu okwukwe; ọ pụrụ ịgụnye ndị nwoke na ndị nwanyị, ebe ndetu na-akọwa ụdị okwu Grik ahụ.
- source_word: τὸ εὐαγγέλιον
  choice: ozi ọma ahụ
  rationale: Nke a na-enye ihe okwu Grik pụtara n’asụsụ Igbo doro anya ma dị mfe nghọta.
- source_word: εὐηγγελισάμην
  choice: m kwusara
  rationale: ‘Kwusara’ na-egosi ikwupụta ozi n’ihu ọha, ma na-ezere nkwughachi na-adịghị eke dịka ‘m ziri ozi ọma.’
- source_word: παρελάβετε
  choice: unu natakwara
  rationale: ‘Natara’ na-edobe echiche sara mbara nke ịnata ozi ma ọ bụ ọdịnala, n’etinyeghị echiche siri ike karịa nke ịnabata ya n’obi.
- source_word: ἐν ᾧ
  choice: nke unu ... n’ime ya
  rationale: Nke a na-edobe ‘n’ime ya’ dịka ebe ma ọ bụ ọnọdụ ha guzo, kama ịgbanwe ya ka ọ bụrụ ‘site na ya,’ nke ga-ebute echiche amaokwu nke abụọ.
- source_word: ἑστήκατε
  choice: guzokwa
  rationale: Ọ na-egosi ọnọdụ na-adị ugbu a nke sitere n’ihe mere na mbụ; okwu gbara ya gburugburu ‘n’ime ya’ na-eme ka echiche ahụ doo anya.
theological_decisions:
- issue: Otu e si sụgharịa ἀδελφοί mgbe a na-agwa ọgbakọ nwere ndị nwoke na ndị nwanyị
  choice: ụmụnna n’isiokwu, tinyere ndetu nkọwa
  alternative: ụmụnne nwoke; ụmụnna nwoke na nwanyị
  rationale: ‘Ụmụnna’ bụ okwu Igbo sitere n’okwu mmekọrịta ezinụlọ ma na-arụ ọrụ dị ka ịkpọ ndị otu obodo niile. Ndetu ahụ na-echekwa eziokwu na okwu Grik bụ ụdị nwoke ma na-ejikarị ya agwa ọgbakọ niile.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji ‘unu’ debe ịgwa ọtụtụ mmadụ, e jikwa usoro nkebiokwu ahụ chekwaa nkwughachi atọ nke na-ezo aka n’ozi ọma ahụ.
