    issue: Aspect of ἑστήκατε is not adequately represented by “guzokwa.”
    rationale: Ἑστήκατε is perfect and denotes a present state resulting from prior action. “Guzokwa” may be understood as a past/completed “also stood.” “Guzosiri ike” naturally conveys their established present standing without adding a distinct doctrinal claim.
  - severity: low
    issue: Footnote wording contains an unnatural/inaccurate Igbo form and imprecise lexical explanation.
    rationale: Replace “ụmụnne nwoke” with a natural expression such as “ụmụnna nwoke,” and explain the masculine Greek address without implying that the Greek word literally contains a separate word for “male.”
