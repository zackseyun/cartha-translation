id: 1CO.15.11
reference: 1 Corinthians 15:11
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἴτε οὖν ἐγὼ εἴτε ἐκεῖνοι, οὕτως κηρύσσομεν καὶ οὕτως ἐπιστεύσατε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/011.yaml
  text: Whether then it was I or they[a], so we proclaim and so you believed.
translation:
  language: ig
  text: Ya mere, ma ọ̀ bụ m ma ọ bụ ha, otu a ka anyị na-ekwusa, otu a kwa ka unu kwere.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ‘otu a’ n’ebe abụọ ahụ dị ka, “nke a bụ ihe anyị na-ekwusa, nke a kwa bụ ihe unu kwere.”
    reason: Ọ na-egosi na οὕτως pụrụ imesi ọdịnaya ozi ahụ ike, ọ bụghị naanị ụzọ e si kwusaa ma ọ bụ kwere ya.
lexical_decisions:
- source_word: εἴτε ... εἴτε
  choice: ma ọ̀ bụ ... ma ọ bụ
  rationale: Nke a na-egosipụta nhọrọ abụọ e ji tụnyere ibe ha, ma na-edobe usoro okwu Grik n’Igbo dị mfe nghọta.
- source_word: οὖν
  choice: Ya mere
  rationale: Ọ na-ejikọta okwu a na ihe Pọl kwuru tupu ya ma na-egosi nkwubi okwu sitere n’akụkọ banyere ndị hụrụ Kraịst mgbe o bilitesịrị.
- source_word: ἐγὼ ... ἐκεῖνοι
  choice: m ... ha
  rationale: ‘M’ na-ezo aka na Pọl, ebe ‘ha’ na-ezo aka ná ndịozi ndị ọzọ a kpọtụrụ aha n’okwu gbara amaokwu a gburugburu.
- source_word: οὕτως ... οὕτως
  choice: otu a ... otu a
  rationale: Ikwughachi otu okwu ahụ na-edobe myiri e nwere n’asụsụ Grik ma na-ahapụ ohere ka ọ na-ezo aka n’ụzọ e si kwusaa ozi ahụ ma ọ bụ n’ihe dị n’ozi ahụ.
- source_word: κηρύσσομεν
  choice: anyị na-ekwusa
  rationale: ‘Ikwusa’ na-egosi ime ka ozi mara n’ihu ọha; ‘anyị’ jikọtara Pọl na ndịozi ndị ọzọ.
- source_word: ἐπιστεύσατε
  choice: unu kwere
  rationale: Okwu a na-ezo aka n’omume ndị Kọrịnt mere n’oge gara aga mgbe ha nabatara ozi e kwusara, n’etinyeghị ihe ọzọ na-adịghị n’asụsụ Grik.
theological_decisions:
- issue: Oke ịdị n’otu nke ozi ndịozi kwusara
  choice: Amaokwu a na-ekwu na ma ọ bụ Pọl ma ọ bụ ndịozi ndị ọzọ kwusara, ha na-ekwusa otu ozi ahụ, ndị Kọrịnt kwekwara ya.
  alternative: A pụrụ ile ‘otu a’ anya dị ka ihe na-emesi ụzọ e si kwusaa na ụzọ e si kwere ike karịa ọdịnaya ozi ahụ.
  rationale: Nkwughachi οὕτως jikọtara nkwusa ndịozi na okwukwe ndị Kọrịnt, ma nsụgharị ahụ anaghị etinye nkwupụta sara mbara banyere ọchịchị ụka ma ọ bụ ozizi ọzọ amaokwu ahụ na-ekwughị.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta, dee ya. E debere nkwughachi ‘otu a’ iji chekwaa myiri na obere nghọta abụọ dị na Grik.
