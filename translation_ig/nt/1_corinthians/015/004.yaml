base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/004.yaml
  text: and that he was buried[a], and that he has been raised on the third day according to the Scriptures[b],
translation:
  language: ig
  text: na e liri ya, na a kpọlitela ya n’ọnwụ[a] n’ụbọchị nke atọ, dị ka Akwụkwọ Nsọ si kwuo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ: “a kpọlitere ya n’ọnwụ.” Oge zuru oke n’asụsụ Grik nwere ike igosi na ihe mbilite n’ọnwụ ahụ pụtara ka na-adịgide ugbu a.'
    reason: lexical_alternative
  - marker: b
    text: 'Ma ọ bụ: “n’ụzọ kwekọrọ n’Akwụkwọ Nsọ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐτάφη
  choice: e liri ya
  rationale: Okwu a bụ aorist passive nke θάπτω. “E liri ya” bụ ụzọ Igbo nkịtị si egosi na e mere ya olili, na-agbakwụghị nkọwa banyere ụdị ili ahụ.
- source_word: ἐγήγερται
  choice: a kpọlitela ya n’ọnwụ
  rationale: Perfect passive nke ἐγείρω na-ekwu maka ihe mere eme nke uru ya ka dị ugbu a. Mgbakwunye “-la” na “kpọlitela” na-egosi na ihe ahụ emezuola, ebe “a” na-edobe onye mere ya n’azụ dịka Greek si mee. “N’ọnwụ” na-eme ka ihe okwu a pụtara n’ebe a doo anya n’Igbo.
- source_word: τῇ ἡμέρᾳ τῇ τρίτῃ
  choice: n’ụbọchị nke atọ
  rationale: Nke a bụ ntụgharị Igbo doro anya nke okwu oge a; a gbakwụnyeghị “mgbe ụbọchị atọ gasịrị,” nke ga-akọwa usoro oge karịa ihe Greek kwuru.
- source_word: κατὰ τὰς γραφάς
  choice: dị ka Akwụkwọ Nsọ si kwuo
  rationale: Nke a bụ ụzọ Igbo dị ndụ si egosi na ihe ahụ kwekọrọ n’ama Akwụkwọ Nsọ, ma ghara ịgbakwunye otu amaokwu kpọmkwem nke Greek na-akpọghị aha.
- source_word: γραφάς
  choice: Akwụkwọ Nsọ
  rationale: N’ebe Pọl ji ya mee ihe, γραφαί na-ezo aka n’ihe odide nsọ ndị a nabatara, ọ bụghị naanị ihe odide n’ozuzu.
- source_word: ὅτι
  choice: na
  rationale: “Na” na-ebute nkebi ndị na-akọ ọdịnaya ma na-edobe usoro nkwupụta okwukwe ahụ n’Igbo.
- source_word: καὶ
  choice: na
  rationale: E ji njikọ a debe usoro nkebi abụọ Greek jikọtara; n’Igbo, “na” na-arụ ọrụ ahụ n’ụzọ dị mfe ma bụrụ nke ebumpụta ụwa.
theological_decisions:
- issue: Ụdị na nghọta oge nke okwu mbilite n’ọnwụ
  choice: a kpọlitela ya n’ọnwụ
  alternative: a kpọlitere ya n’ọnwụ
  rationale: “A kpọlitela” na-echekwa ma passive voice ma echiche perfect na ihe mere eme ka nwere uru ugbu a. Nhọrọ “a kpọlitere” ga-ekwusi ike n’ihe mere n’oge gara aga ma ghara igosipụta nke ọma na ọnọdụ ya ka dịgide.
- issue: Ihe “Akwụkwọ Nsọ” na-ezo aka na ya
  choice: Akwụkwọ Nsọ
  alternative: ihe odide nsọ
  rationale: Greek na-ezo aka n’akwụkwọ nsọ ndị a maara ama n’enweghị ịkọwapụta corpus ahụ karịa. “Akwụkwọ Nsọ” na-edobe nke a n’ụzọ Igbo doro anya ma ghara ịgbakwunye nkọwa otu okpukpe.
- issue: Onye kpọlitere Kraịst
  choice: a kpọlitela ya
  alternative: Chineke akpọlitela ya
  rationale: Greek ji passive voice mee ihe ma ọ kpọghị onye mere omume ahụ aha n’amaokwu a. Ya mere, ntụgharị ahụ ahapụghị nghọta na ọ bụ Chineke ma ọ bụ tinye aha ahụ n’ahịrị bụ isi.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta, dee ya. A hapụrụ amaokwu ahụ dịka akụkụ na-aga n’ihu n’usoro nkwupụta nke malitere n’amaokwu ndị gbara ya gburugburu. E tinyere akara ntụaka ụkwụ n’ebe okwu nke ọ bụla ọ na-akọwa dị.
