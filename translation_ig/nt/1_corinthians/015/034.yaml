id: 1CO.15.34
reference: 1 Corinthians 15:34
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐκνήψατε δικαίως καὶ μὴ ἁμαρτάνετε, ἀγνωσίαν γὰρ θεοῦ τινες ἔχουσιν· πρὸς ἐντροπὴν ὑμῖν ⸀λαλῶ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/034.yaml
  text: Come to your senses rightly[a], and do not go on sinning; for some have ignorance of God[b]. I say this to your shame.
translation:
  language: ig
  text: Lọghachinụ n'uche dịka o kwesịrị[a], unu anọgidekwala na-eme mmehie[b]; n'ihi na ụfọdụ enweghị ihe ọmụma banyere Chineke. Ana m ekwu nke a ka ihere mee unu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “Lọghachinụ n'uche ziri ezi.” Ngwaa Grik ahụ na-enye ihe oyiyi nke mmadụ ịpụ n'ịṅụbiga mmanya ókè wee nwee uche doro anya; o yiri ka e ji ya mee ihe atụ n'ebe a.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsị, “unu emekwala mmehie” ma ọ bụ “kwụsịnụ ime mmehie.” Ụdị iwu Grik dị ugbu a nwere ike igosi omume na-aga n'ihu ma ọ bụ nke a na-eme ugboro ugboro.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκνήψατε
  choice: Lọghachinụ n'uche
  rationale: Iwu a na-akpọ ndị na-ege ntị ka ha laghachi ozugbo n'uche doro anya. N'okwu Grik, ihe oyiyi ya bụ mmadụ ịpụ n'ịṅụbiga mmanya ókè, ma ebe a e ji ya mee ihe atụ.
- source_word: δικαίως
  choice: ziri ezi
  rationale: Nke a na-akọwa ụdị nlọghachi n'uche Pọl na-achọ—n'ụzọ kwesịrị ekwesị na nke ziri ezi—n'enweghị itinye echiche nkà mmụta okpukpe karịrị ihe okwu ahụ kwuru.
- source_word: μὴ ἁμαρτάνετε
  choice: unu anọgidekwala na-eme mmehie
  rationale: Iwu nọ n'ụdị ugbu a nwere ike igosi omume na-aga n'ihu ma ọ bụ nke a na-eme ugboro ugboro. Nsụgharị a na-edobe echiche ahụ n'ebughị ụzọ kwuo na ha niile nọ n'otu mmehie ahụ ugbu a.
- source_word: ἀγνωσίαν θεοῦ
  choice: enweghị ihe ọmụma banyere Chineke
  rationale: Nke a na-egosi amaghị ihe gbasara Chineke n'ụzọ doro anya ma na-edobe ịdị arọ nke mba Pọl na-aba ha.
- source_word: τινες
  choice: ụfọdụ
  rationale: Ọ na-ezo aka n'akụkụ ụfọdụ nke ndị a na-ekwu maka ha, n'etinyeghị nkọwa ọzọ na-adịghị na Grik.
- source_word: πρὸς ἐντροπὴν ὑμῖν λαλῶ
  choice: Ana m ekwu nke a ka ihere mee unu
  rationale: Ọ na-edobe ụda ịdọ aka ná ntị siri ike na mmetụta ihere okwu Pọl kwesịrị ịkpata n'ahụ ndị na-ege ya ntị.
theological_decisions:
- issue: Ike omume dị na δικαίως
  choice: ziri ezi
  alternative: n'ụzọ ezi omume
  rationale: “Ziri ezi” na-egosi na a ga-alọghachi n'uche dịka o kwesịrị, ma ọ naghị amanye echiche pụrụ iche banyere izi ezi nke a na-agụnyeghị kpọmkwem n'adverb a.
- issue: Ihe ἀγνωσίαν θεοῦ pụtara
  choice: enweghị ihe ọmụma banyere Chineke
  alternative: amaghị Chineke
  rationale: Nhọrọ a na-edobe echiche bụ isi nke enweghị ihe ọmụma gbasara Chineke, ma ọ naghị ekpebi ma okwu ahụ na-elekwasị anya naanị n'amaghị ozi banyere Chineke ma ọ bụ n'amaghị Chineke n'ụzọ mmekọrịta.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta, dee ya. A họọrọ “Lọghachinụ n'uche” iji mee ka ihe atụ Grik doo anya n'Igbo n'ekwughị na mmanya bụ isiokwu kpọmkwem; ụda amaokwu ahụ ka bụ nke ịdọ aka ná ntị siri ike.
