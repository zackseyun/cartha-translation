id: 1CO.15.58
reference: 1 Corinthians 15:58
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ὥστε, ἀδελφοί μου ἀγαπητοί, ἑδραῖοι γίνεσθε, ἀμετακίνητοι, περισσεύοντες ἐν τῷ ἔργῳ τοῦ κυρίου πάντοτε, εἰδότες ὅτι ὁ κόπος ὑμῶν οὐκ ἔστιν κενὸς ἐν κυρίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/058.yaml
  text: Therefore[a], my beloved brothers, become steadfast, immovable, always abounding in the work of the Lord, knowing that your labor in the Lord is not in vain.
translation:
  language: ig
  text: Ya mere, ụmụnna m ndị m hụrụ n’anya[a], guzosienụ ike, bụrụnụ ndị a na-apụghị ịkwagharị, na-arụkwa ọrụ Onyenwe anyị n’ụba mgbe niile, ebe unu maara na ọrụ ike unu n’Onyenwe anyị abụghị ihe efu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’ebe a, “ụmụnna” na-ezo aka n’ebe ndị niile kwere ekwe nọ, ma ndị nwoke ma ndị nwanyị.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὥστε
  choice: Ya mere
  rationale: Ọ na-egosi nkwubi okwu Pọl wetara site n’okwu banyere mbilite n’ọnwụ dị n’amaokwu ndị bu ụzọ.
- source_word: ἀδελφοί μου ἀγαπητοί
  choice: ụmụnna m ndị m hụrụ n’anya
  rationale: “Ụmụnna” bụ okwu Igbo sitere n’okike nke na-agụnyekarị ụmụ nwoke na ụmụ nwanyị ndị nọ n’otu ezinụlọ ma ọ bụ n’otu okwukwe; “ndị m hụrụ n’anya” na-egosipụta ἀγαπητοί nke ọma.
- source_word: ἑδραῖοι γίνεσθε
  choice: guzosienụ ike
  rationale: Nke a na-enye iwu ka ha bụrụ ndị siri ike ma guzosie ike; ọ bụkwa okwu Igbo doro anya ma dị ndụ.
- source_word: ἀμετακίνητοι
  choice: ndị a na-apụghị ịkwagharị
  rationale: Ọ na-echekwa echiche nke ịbụ ndị a na-apụghị isi n’ọnọdụ ha kwapụ, karịsịa n’okwukwe na nkwenye ha.
- source_word: περισσεύοντες ... πάντοτε
  choice: na-arụkwa ... n’ụba mgbe niile
  rationale: “N’ụba” na-egosipụta ịdị ukwuu nke περισσεύοντες, ebe “mgbe niile” na-echekwa πάντοτε na omume na-aga n’ihu.
- source_word: ἐν τῷ ἔργῳ τοῦ κυρίου
  choice: ọrụ Onyenwe anyị
  rationale: Nke a na-echekwa obosara nke ἔργον n’enweghị ime ka ọ bụrụ naanị otu ụdị ozi ma ọ bụ ije ozi.
- source_word: εἰδότες
  choice: ebe unu maara
  rationale: Ọ na-ejigide njikọ participle ahụ ma na-egosi na ihe ha maara bụ ihe na-akwado ndụmọdụ ahụ.
- source_word: ὁ κόπος ὑμῶν
  choice: ndọgbu unu
  rationale: “Ndọgbu” na-egosi ọrụ siri ike nke na-eri mmadụ ike, nke dabara n’ike okwu κόπος karịa naanị “ọrụ.”
- source_word: οὐκ ἔστιν κενὸς
  choice: abụghị ihe efu
  rationale: Ọ bụ ụzọ Igbo kwụ ọtọ isi kwuo na ndọgbu ahụ abụghị nke na-enweghị uru ma ọ bụ mkpụrụ.
- source_word: ἐν κυρίῳ
  choice: n’Onyenwe anyị
  rationale: A hapụrụ njikọ okwu ahụ n’ụdị sara mbara ka e wee ghara imechi ya naanị n’echiche ‘site n’enyemaka Onyenwe anyị’ ma ọ bụ ‘n’ịdị n’otu na Onyenwe anyị.’
theological_decisions:
- issue: Ndị ἀδελφοί na-ezo aka na ha
  choice: ụmụnna
  alternative: ụmụnna nwoke na ụmụnna nwanyị
  rationale: Ọ bụ ezie na okwu Grik ahụ bụ aha nwoke n'ụdị ọtụtụ, n’ebe a ọ na-akpọ nzukọ Kraịst dum. “Ụmụnna” n’Igbo nwere ike ịgụnye ndị nwoke na ndị nwanyị n'ụzọ ebumpụta ụwa; nkọwa ala peeji na-eme ka nke a doo anya.
- issue: Njikọ ikpeazụ ἐν κυρίῳ
  choice: ndọgbu unu n’Onyenwe anyị abụghị ihe efu
  alternative: ndọgbu unu abụghị ihe efu n’ihi Onyenwe anyị
  rationale: Nhọrọ a na-ejikọta nkebiokwu ahụ na ndọgbu ndị kwere ekwe ma na-echekwa obosara nke okwu Pọl n’enweghị ịkọwa ya naanị dị ka ihe kpatara ya.
- issue: Nsụgharị κύριος
  choice: Onyenwe anyị
  alternative: Nna ukwu
  rationale: “Onyenwe anyị” bụ okwu Igbo a na-ejikarị asọpụrụ Kraịst n’Agba Ọhụrụ, ọ dịghịkwa ihe dị n’amaokwu a chọrọ ka a gbanwee ya.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta, dee ya. A họọrọ “guzosienụ ike” na “ndị a na-apụghị ịkwagharị” iji mee ka okwu agbamume abụọ ahụ dị iche ma ghara ime ka ha bụrụ otu ihe. E debere “n’Onyenwe anyị” n’ụdị dị nkenke iji chekwaa obosara echiche okpukpe dị na Grik.
