  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἔπειτα ὤφθη ἐπάνω πεντακοσίοις ἀδελφοῖς ἐφάπαξ, ἐξ ὧν οἱ ⸀πλείονες μένουσιν ἕως ἄρτι, τινὲς ⸀δὲ ἐκοιμήθησαν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/006.yaml
  text: Then he appeared to more than five hundred brothers at one time[a], most of whom remain until now[b], though some have fallen asleep.
translation:
  language: ig
  text: Mgbe ahụ, ọ pụtara ìhè nye ụmụnna karịrị narị ise n’otu oge[a]. Ihe ka ọtụtụ n’ime ha ka dị ndụ ruo ugbu a, ma ụfọdụ adawo n’ụra[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Okwu Grik a sụgharịrị “ụmụnna” dị n’ụdị ọtụtụ nke nwoke. Otú ọ dị, n’ojiji Ndị Kraịst oge mbụ, ọ pụrụ izo aka n’ọgbakọ ndị kwere ekwe n’ozuzu, ndị nwoke na ndị nwanyị.
    reason: lexical_alternative
  - marker: b
    text: Ya bụ, ụfọdụ anwụọla. Pọl ji “ịdaba n’ụra” mee ihe atụ maka ọnwụ, n’ìhè olileanya mbilite n’ọnwụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔπειτα
  choice: Mgbe ahụ
  rationale: Ọ na-egosi usoro ihe ndị mere n’akụkọ Pọl banyere ndị Kraịst pụtara n’ihu ha.
- source_word: ὤφθη
  choice: ọ pụtara n’ihu
  rationale: N’akụkọ mbilite n’ọnwụ, ụdị okwu a pụtara na Kraịst mere ka ndị mmadụ hụ ya; nsụgharị a bụ Igbo nkịtị ma doo anya.
- source_word: ἐπάνω πεντακοσίοις
  choice: ihe karịrị narị ụmụnna ise
  rationale: ἐπάνω tinyere ọnụọgụ pụtara ‘ihe karịrị’; a haziri nkebiokwu ahụ n’ụzọ Igbo si aga nke ọma.
- source_word: ἀδελφοῖς
  choice: ụmụnna
  rationale: ‘Ụmụnna’ bụ okwu Igbo sitere n’okwu nwanne, nke nwere ike ịgụnye ndị nwoke na ndị nwanyị, ma nwee ike ịpụta ndị otu okwukwe.
- source_word: ἐφάπαξ
  choice: n’otu oge
  rationale: Ọ na-egosi na ihe karịrị narị mmadụ ise ahụ hụrụ ya n’otu oge, ọ bụghị naanị na ọ mere otu ugboro.
- source_word: οἱ πλείονες
  choice: ihe ka ọtụtụ n’ime ha
  rationale: Ọ na-egosipụta ihe ọtụtụ ma ọ bụ ọnụ ọgụgụ ka ukwuu n’ime ndị ahụ.
- source_word: μένουσιν ἕως ἄρτι
  choice: ka dị ndụ ruo ugbu a
  rationale: μένω pụtara ịnọgide ma ọ bụ ịdịgide; n’ebe a, ọdịiche ya na ndị ‘rarahụrụ ụra’ na-egosi na ihe a na-ekwu bụ na ha ka dị ndụ.
- source_word: τινὲς δὲ
  choice: ma ụfọdụ
  rationale: δέ na-egosi obere ọdịiche dị n’etiti ọtụtụ ndị ka dị ndụ na ụfọdụ ndị nwụrụ anwụ.
- source_word: ἐκοιμήθησαν
  choice: arahụla ụra
  rationale: E chekwara ihe atụ Pọl ji ụra kwuo ọnwụ, nke dị mkpa n’isiakwụkwọ a banyere mbilite n’ọnwụ.
theological_decisions:
- issue: Ma ἀδελφοῖς ọ na-ezo naanị aka n’ụmụ nwoke ka ọ bụ n’ọgbakọ ndị kwere ekwe n’ozuzu
  choice: ụmụnna
  alternative: ụmụ nwoke ndị kwere ekwe; ụmụnna nwoke na nwanyị
  rationale: Okwu Grik ahụ bụ ọtụtụ nke nwoke, ma n’ojiji Ndị Kraịst oge mbụ ọ pụrụ ịgụnye ọgbakọ niile. ‘Ụmụnna’ na Standard Igbo na-echekwa njikọ ezinụlọ ma ghara ịmanye mkpebi banyere okike ndị niile nọ n’ìgwè ahụ.
- issue: Ichekwa ihe atụ nke ἐκοιμήθησαν n’ọnọdụ mbilite n’ọnwụ
  choice: arahụla ụra
  alternative: anwụọla
  rationale: Pọl ji ụra mee ihe atụ maka ọnwụ. Ichekwa ya na-edobe njikọ ya na olileanya mbilite n’ọnwụ kama ime ka okwu ahụ bụrụ naanị ‘ọnwụ.’
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. ‘Ọ pụtara n’ihu’ na-eme ka onye ọ pụtara nye doo anya; ‘arahụla ụra’ na-echekwa ihe atụ dị na Grik. Akara edemede [a] na [b] dị n’ederede isi ma kwekọọ n’ihe odide ala peeji.
