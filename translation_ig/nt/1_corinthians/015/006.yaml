review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the sequence, the appearance to a group exceeding five hundred, the simultaneity, the contrast between those still living and those who have died, and it preserves the sleep metaphor. However, “ihe karịrị narị ụmụnna ise” is not a sound Igbo construction for “more than five hundred brothers”; the numeral must modify the people, not interrupt the numeral phrase. “Ọ pụtara n’ihu” is also less precise here, since n’ihu commonly means “before/in front of”; “pụtara ìhè nye” naturally expresses an appearance to specified people.
  naturalness: 'Revise for idiomatic Standard Igbo: “ụmụnna karịrị narị ise” and “pụtara ìhè nye ...” are clear and natural. “Ụfọdụ adawo n’ụra” retains Paul’s metaphor and idiomatically represents the completed action.'
  terminology: “Ụmụnna” appropriately retains the familial/community language without forcing a conclusion about the gender composition of the group. “Adawo n’ụra” retains the metaphor of κοιμάομαι; the footnote explains its reference to death without replacing the metaphor in the text.
  issues:
  - severity: medium
    issue: 'Incorrect/awkward numeric noun phrase: “ihe karịrị narị ụmụnna ise.”'
    rationale: This construction is not natural Standard Igbo and can obscure the intended quantity. The Greek ἐπάνω πεντακοσίοις ἀδελφοῖς means “to more than five hundred brothers,” naturally rendered “nye ụmụnna karịrị narị ise.”
  - severity: medium
    issue: “Ọ pụtara n’ihu” can suggest “he appeared before/in front of,” rather than “he appeared to.”
    rationale: The dative ἀδελφοῖς identifies those to whom Christ appeared. “Ọ pụtara ìhè nye ...” clearly marks them as the recipients of the appearance.
  - severity: low
    issue: Footnote a’s wording about the Greek term being “from ‘nwanne nwoke’” is linguistically imprecise in Igbo.
    rationale: It is better to state directly that the Greek form is masculine plural while noting that early Christian usage may refer to the whole community of believers.
  revised_text: Mgbe ahụ, ọ pụtara ìhè nye ụmụnna karịrị narị ise n’otu oge[a]. Ihe ka ọtụtụ n’ime ha ka dị ndụ ruo ugbu a, ma ụfọdụ adawo n’ụra[b].
  revised_footnotes:
