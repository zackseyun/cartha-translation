revisions:
- from: Mgbe ahụ, ọ pụtara n’ihu ihe karịrị narị ụmụnna ise n’otu oge[a]. Ihe ka ọtụtụ n’ime ha ka dị ndụ ruo ugbu a, ma ụfọdụ arahụla ụra[b].
  to: Mgbe ahụ, ọ pụtara ìhè nye ụmụnna karịrị narị ise n’otu oge[a]. Ihe ka ọtụtụ n’ime ha ka dị ndụ ruo ugbu a, ma ụfọdụ adawo n’ụra[b].
  rationale: The revision corrects the malformed number expression and makes the recipient sense of ὤφθη explicit in idiomatic Standard Igbo. It maintains the source’s ambiguity regarding the composition of ἀδελφοῖς and preserves the resurrection-context metaphor in ἐκοιμήθησαν. Footnote markers remain attached to the corresponding expressions.
  reviewer_model: gpt-5.6-terra
