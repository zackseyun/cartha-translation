id: 1CO.15.18
reference: 1 Corinthians 15:18
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἄρα καὶ οἱ κοιμηθέντες ἐν Χριστῷ ἀπώλοντο.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/018.yaml
  text: Then those also who have fallen asleep in Messiah have perished[a][b].
translation:
  language: ig
  text: Ya mere, ndị ahụ dara n’ụra n’ime Mesaya alawo n’iyi kwa.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ: “n’ime Kraịst.”'
    reason: alternative_reading
  - marker: b
    text: “Dara n’ụra” bụ okwu dị nro e ji ọnwụ akọwa n’asụsụ Grik, karịsịa ọnwụ ndị kwere ekwe.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρα
  choice: Ya mere
  rationale: Ọ bụ okwu nkwubi okwu nke na-ejikọta amaokwu a na arụmụka bu ya ụzọ; “Ya mere” doro anya ma bụrụkwa Igbo nkịtị.
- source_word: καὶ
  choice: kwa
  rationale: “Kwa” na-egosi na ndị nwụrụ anwụ sonyere ná nsonaazụ ndị Pọl na-akọ; ide ya n’azụ nkwupụta ahụ na-ada nke ọma n’Igbo.
- source_word: οἱ κοιμηθέντες
  choice: ndị ahụ dara n’ụra
  rationale: Nke a na-edobe ihe atụ Grik nke ihi ụra dị ka okwu dị nro maka ọnwụ, kama ịgbanwe ya ozugbo ka ọ bụrụ “ndị nwụrụ anwụ.”
- source_word: ἐν Χριστῷ
  choice: n’ime Mesaya
  rationale: “Mesaya” na-asụgharị Χριστός dị ka utu aha, ebe “n’ime” na-edobe asụsụ Pọl banyere njikọ mmadụ na Mesaya.
- source_word: ἀπώλοντο
  choice: alawo n’iyi
  rationale: Okwu a na-egosi ịla n’iyi na ọnọdụ nke si na ya pụta; “alawo n’iyi” na-eweta nke ahụ n’Igbo eke.
theological_decisions:
- issue: Otu e si asụgharị Χριστῷ n’okwu Pọl banyere ịdị n’ime ya
  choice: Mesaya
  alternative: Kraịst
  rationale: Χριστός bụ utu aha nke pụtara Mesaya. A họọrọ ịsụgharị ihe ọ pụtara, ma debe “Kraịst” n’ala peeji n’ihi na ọ bụ usoro okwu ndị mmadụ maara nke ọma.
- issue: Ihe ἀπώλοντο pụtara n’arụmụka banyere mbilite n’ọnwụ
  choice: alawo n’iyi
  alternative: efuola
  rationale: A hapụrụ ịdị ike na obosara nke okwu Grik ahụ n’enweghị ịkọwa kpọmkwem ụdị mbibi ma ọ bụ ọnọdụ ikpeazụ ọ na-ezo aka na ya.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E debere ihe atụ “dara n’ụra,” ma kọwaa ya n’ala peeji; e jighị okwu ụka pụrụ iche dozie mgbagwoju anya nke “alawo n’iyi.”
