  source_fidelity: The rendering accurately preserves the inferential force of ἄρα ("Ya mere"), the additive καί ("kwa"), the death euphemism in οἱ κοιμηθέντες ("ndị ahụ dara n’ụra"), Paul’s union-with-Messiah expression ἐν Χριστῷ, and the unqualified force of ἀπώλοντο ("alawo n’iyi"). It does not overdefine the nature of the perishing.
