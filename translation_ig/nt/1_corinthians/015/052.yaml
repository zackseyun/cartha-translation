revisions:
- from: n’otu ntabi anya[a], n’otu ntabi anya, mgbe opi ikpeazụ ga-ada. N’ihi na opi ahụ ga-ada, a ga-akpọlitekwa ndị nwụrụ anwụ ka ha bụrụ ndị na-apụghị ire ure, a ga-agbanwekwa anyị.
  to: n’otu ntabi[a], n’ịmipịa anya, n’oge opi ikpeazụ. N’ihi na opi ahụ ga-ada, a ga-akpọlitekwa ndị nwụrụ anwụ ka ha bụrụ ndị na-apụghị ire ure, a ga-agbanwekwa anyị.
  rationale: 'The revision distinguishes ''ἐν ἀτόμῳ'' (''n’otu ntabi'') from the eye-specific idiom ''ἐν ῥιπῇ ὀφθαλμοῦ'' (''n’ịmipịa anya''), while retaining their shared emphasis on suddenness. It also translates the trumpet phrase without absorbing σαλπίσει into it, preserving the Greek sequence: at the last trumpet; for the trumpet will sound. The passive constructions and the unqualified ''anyị'' remain intact.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T19:25:14Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves the future passive resurrection ('a ga-akpọlite') and transformation ('a ga-agbanwe anyị'), the collective 'ndị nwụrụ anwụ,' the imperishable state, and the unexpanded first-person plural 'anyị.' However, it renders both distinct opening Greek expressions with precisely the same Igbo phrase and folds the sounding of the last trumpet into the preceding temporal phrase, obscuring the source's two successive clauses.
  naturalness: Most of the verse is clear Standard Igbo. Distinguishing the compact temporal expression from the eye-blink idiom produces a more natural rhythmic rendering and avoids an unintended repetition. 'N'oge opi ikpeazụ' appropriately expresses the temporal force without prematurely stating that it sounds.
  terminology: '''Opi ikpeazụ,'' ''ndị nwụrụ anwụ,'' ''a ga-akpọlite,'' and ''ndị na-apụghị ire ure'' are suitable, comprehensible choices for the Greek terms and their resurrection context. No doctrinal expansion is introduced.'
  issues:
  - severity: medium
    issue: The two opening source expressions are translated identically as 'n’otu ntabi anya.'
    rationale: ἐν ἀτόμῳ and ἐν ῥιπῇ ὀφθαλμοῦ are closely related expressions for extreme brevity, but the latter specifically invokes an eye. A translation should retain the source's intensifying, paired imagery where Igbo can do so naturally.
  - severity: low
    issue: '''mgbe opi ikpeazụ ga-ada'' incorporates the following clause''s verb into the rendering of ἐν τῇ ἐσχάτῃ σάλπιγγι.'
    rationale: The Greek first says 'at the last trumpet' and then separately explains, 'for [the trumpet] will sound.' Rendering the first phrase as 'n'oge opi ikpeazụ' retains this clause structure and its deliberate repetition.
  revised_text: n’otu ntabi[a], n’ịmipịa anya, n’oge opi ikpeazụ. N’ihi na opi ahụ ga-ada, a ga-akpọlitekwa ndị nwụrụ anwụ ka ha bụrụ ndị na-apụghị ire ure, a ga-agbanwekwa anyị.
  revised_footnotes:
