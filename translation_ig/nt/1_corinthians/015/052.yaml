    text: Ma ọ bụ, “n’otu obere oge a na-apụghị ikewa.” Okwu Grik ahụ na-egosi oge dị nnọọ mkpụmkpụ na mberede.
    reason: lexical_alternative
  revision_rationale: 'The revision distinguishes ''ἐν ἀτόμῳ'' (''n’otu ntabi'') from the eye-specific idiom ''ἐν ῥιπῇ ὀφθαλμοῦ'' (''n’ịmipịa anya''), while retaining their shared emphasis on suddenness. It also translates the trumpet phrase without absorbing σαλπίσει into it, preserving the Greek sequence: at the last trumpet; for the trumpet will sound. The passive constructions and the unqualified ''anyị'' remain intact.'
