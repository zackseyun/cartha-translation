id: 1CO.15.52
reference: 1 Corinthians 15:52
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐν ἀτόμῳ, ἐν ῥιπῇ ὀφθαλμοῦ, ἐν τῇ ἐσχάτῃ σάλπιγγι· σαλπίσει γάρ, καὶ οἱ νεκροὶ ἐγερθήσονται ἄφθαρτοι, καὶ ἡμεῖς ἀλλαγησόμεθα.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/052.yaml
  text: in an instant[a], in the blink of an eye, at the last trumpet. For the trumpet will sound, and the dead will be raised imperishable, and we will be changed.
translation:
  language: ig
  text: n’otu ntabi[a], n’ịmipịa anya, n’oge opi ikpeazụ. N’ihi na opi ahụ ga-ada, a ga-akpọlitekwa ndị nwụrụ anwụ ka ha bụrụ ndị na-apụghị ire ure, a ga-agbanwekwa anyị.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’otu obere oge a na-apụghị ikewa.” Okwu Grik ahụ na-egosi oge dị nnọọ mkpụmkpụ na mberede.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἀτόμῳ
  choice: n’otu ntabi anya
  rationale: Nkebiokwu a na-egosi oge dị nnọọ mkpụmkpụ nke a na-apụghị ikewa; ‘n’otu ntabi anya’ na-enye echiche nke ihe mere ozugbo n’Igbo nkịtị.
- source_word: ἐν ῥιπῇ ὀφθαλμοῦ
  choice: n’otu ntabi anya
  rationale: Akpaalaokwu a na-egosi oke ọsọ na mberede. Igbo na-eji ‘ntabi anya’ ekwu nke a n’ụzọ doro anya, ọ bụ ezie na ọ na-eme ka nkebiokwu abụọ mbụ yie ibe ha.
- source_word: ἐν τῇ ἐσχάτῃ σάλπιγγι
  choice: mgbe opi ikpeazụ ga-ada
  rationale: Nke a na-egosipụta oge ihe ahụ ga-eme ma na-edobe ‘ikpeazụ’ n’enweghị ịtinye usoro nkọwa banyere ọgwụgwụ ụwa.
- source_word: σαλπίσει
  choice: opi ahụ ga-ada
  rationale: Ngwaa Grik pụtara ịkpọ opi ma ọ bụ ka opi daa. Ebe a kpọtụrụ opi aha ozugbo tupu ya, ‘opi ahụ ga-ada’ bụ Igbo sitere n’okike.
- source_word: οἱ νεκροὶ
  choice: ndị nwụrụ anwụ
  rationale: Nke a bụ ụzọ Igbo doro anya si akọwa ndị nwụrụ anwụ dịka otu ìgwè mmadụ.
- source_word: ἐγερθήσονται
  choice: a ga-akpọlitekwa
  rationale: Ọdịdị nnara nke ngwaa ahụ ka e debere, ọ na-egosikwa mbilite n’ọnwụ n’enweghị ịkpọ onye na-eme ihe ahụ aha.
- source_word: ἄφθαρτοι
  choice: ka ha bụrụ ndị na-apụghị ire ure
  rationale: Okwu ahụ pụtara ndị na-agaghị emebi ma ọ bụ ree ure; nsụgharị a doro ndị na-agụ Igbo anya ma dabaa n’arụmụka Pọl banyere mbilite n’ọnwụ.
- source_word: ἡμεῖς
  choice: anyị
  rationale: E debere nnọchiaha a kpọmkwem iji chekwaa nkwusi ike na ọdịiche dị n’etiti ‘ndị nwụrụ anwụ’ na ‘anyị.’
- source_word: ἀλλαγησόμεθα
  choice: a ga-agbanwekwa anyị
  rationale: Nke a na-edobe ọdịdị nnara na ihe ngwaa ahụ pụtara kpọmkwem, n’enweghị ịgbasa ihe amaokwu ahụ ekwughị.
theological_decisions:
- issue: Opi ikpeazụ na usoro ihe ndị ga-eme n’ọgwụgwụ
  choice: mgbe opi ikpeazụ ga-ada
  alternative: mgbe a ga-akpọ opi ikpeazụ
  rationale: Nsụgharị ahụ na-edobe ihe odide Grik kwuru banyere opi ikpeazụ, ma ọ naghị etinye nkọwa nke otu ozizi pụrụ iche banyere usoro ọgwụgwụ ụwa.
- issue: Ihe ‘anyị’ pụtara n’ihe metụtara mbilite n’ọnwụ na mgbanwe
  choice: a ga-agbanwekwa anyị
  alternative: a ga-agbanwekwa ndị nke anyị ka dị ndụ
  rationale: E debere onye mbụ n’ọnụọgụ ka Pọl si kwuo ya, kama ịgbakwunye nkọwa sitere n’amaokwu ndị gbara ya gburugburu.
translation_notes:
  register: Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E jiri usoro okwu ndị mmadụ na-asụkarị mee ihe, ebe a na-edobe ọdịdị nnara na nghọtahie ndị ihe odide Grik hapụrụ ghe oghe.
