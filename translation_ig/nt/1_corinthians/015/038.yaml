  text: ὁ δὲ θεὸς ⸂δίδωσιν αὐτῷ⸃ σῶμα καθὼς ἠθέλησεν, καὶ ἑκάστῳ τῶν σπερμάτων ⸀ἴδιον σῶμα.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/038.yaml
  text: But God gives it a body as he willed[a], and to each of the seeds its own body.
translation:
  language: ig
  text: Ma Chineke na-enye ya ahụ dị ka o si chọọ, na-enyekwa mkpụrụ nke ọ bụla ahụ nke ya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'N’asụsụ Grik: “nye nke ọ bụla n’ime mkpụrụ ndị ahụ ahụ nke ya”; okwu a nwere ike ịbụ ụzọ e si egosi nkesa n’otu n’otu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δίδωσιν αὐτῷ
  choice: na-enye ya
  rationale: Ọ na-egosipụta ngwaa dị n’oge ugbu a na onye nnata ya n’ụzọ Igbo si ada nke ọma, ma na-ezo aka ná mkpụrụ ahụ e kwuru okwu ya n’amaokwu bu ụzọ.
- source_word: σῶμα
  choice: ahụ
  rationale: “Ahụ” bụ okwu Igbo kwesịrị ekwesị maka σῶμα, ọ na-echekwakwa njikọ okwu ahụ na isiokwu banyere mbilite n’ọnwụ n’isiakwụkwọ a.
- source_word: καθὼς ἠθέλησεν
  choice: dị ka o si chọọ
  rationale: Nke a na-egosipụta uche na mkpebi Chineke n’ebughị nkọwa ozizi ọzọ abanye n’amaokwu ahụ.
- source_word: ἑκάστῳ τῶν σπερμάτων
  choice: mkpụrụ nke ọ bụla
  rationale: Ọ na-enye nghọta nkesa nke ἑκάστῳ na genitive partitive n’Igbo dị mfe ma bụrụkwa nke eke.
- source_word: ἴδιον σῶμα
  choice: ahụ nke ya
  rationale: Nke a na-egosi na mkpụrụ nke ọ bụla nwere ụdị ahụ bụ nke ya, n’agbanyeghị na e tinyeghị okwu nkọwa dịka “ụdị” n’ihe odide Grik.
theological_decisions:
- issue: Ọrụ na uche Chineke n’ihe atụ banyere mkpụrụ na ahụ
  choice: E depụtara Chineke dị ka onye na-enye mkpụrụ ahụ ahụ dị ka uche ya si dị.
  alternative: A pụrụ ịsụgharị ya n’ụzọ na-akọwa “ụdị ahụ” ma ọ bụ “ụdị mkpụrụ” nke ọma karịa.
  rationale: Nke a na-echekwa ihe Pọl kwuru kpọmkwem banyere ọrụ na uche Chineke, ma ọ naghị etinye usoro ozizi ma ọ bụ nkọwa ndị na-adịghị n’ihe odide Grik.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ “mkpụrụ nke ọ bụla” ka ọ daa nke ọma n’Igbo ma debe nghọta nkesa nke okwu Grik.
