revisions:
- from: Ma Chineke na-enye ya ahụ dị ka o si chọọ, nyekwa mkpụrụ nke ọ bụla ahụ nke ya.[a]
  to: Ma Chineke na-enye ya ahụ dị ka o si chọọ, na-enyekwa mkpụrụ nke ọ bụla ahụ nke ya.[a]
  rationale: The revision makes the two coordinated present-tense actions explicit and idiomatic in Standard Igbo, without altering the referent, divine volition, or the seed/body analogy. The footnote is recast to describe the Greek partitive-distributive wording accurately and naturally.
  reviewer_model: gpt-5.6-terra
