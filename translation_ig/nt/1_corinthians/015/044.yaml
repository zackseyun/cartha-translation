revisions:
- from: A na-akụ ya dịka ahụ nke ndụ mmadụ nkịtị na-achị; a na-akpọlite ya dịka ahụ nke Mmụọ Nsọ na-achị. Ọ bụrụ na e nwere ahụ nke ndụ mmadụ nkịtị na-achị[a], e nwekwara ahụ nke Mmụọ Nsọ na-achị.
  to: A na-akụ ya dị ka ahụ nke ndụ nkịtị; a na-akpọlite ya dị ka ahụ nke mmụọ. Ọ bụrụ na ahụ nke ndụ nkịtị dị[a], ahụ nke mmụọ dịkwa.
  rationale: The revision removes interpretive additions (“Mmụọ Nsọ” and “na-achị”) from the main text, restores a concise and parallel rendering of the two Greek adjectives, and retains the contextual clarification in the footnote. It preserves the passive verbs, the seed imagery, and the conditional/additive logic of the Greek.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T19:24:17Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly retains the passive agricultural and resurrection imagery and the conditional structure. However, “nke Mmụọ Nsọ na-achị” makes the referent explicitly the Holy Spirit and adds the idea of being “controlled,” neither of which is stated in πνευματικόν. The corresponding “nke ndụ mmadụ nkịtị na-achị” likewise expands ψυχικόν beyond the compact Greek adjective. The contrast should remain terminologically parallel and sufficiently open in the text, with explanation reserved for a note.
  naturalness: The repeated relative clauses “nke ... na-achị” are understandable but heavy and less idiomatic as a paired Pauline contrast. “Ahụ nke ndụ nkịtị” and “ahụ nke mmụọ” are more concise, natural Standard Igbo expressions while preserving the contrast.
  terminology: “Ahụ” and “a na-akpọlite” are appropriate. “Ahụ nke mmụọ” should not be forced in the main text to mean a nonmaterial body or explicitly “a body controlled by the Holy Spirit.” The note can identify “ahụ nke mkpụrụ obi” as a closer lexical alternative and explain the intended contrast without presenting a doctrinal conclusion as a lexical requirement.
  issues:
  - severity: medium
    issue: The main text adds “Mmụọ Nsọ” and “na-achị” for πνευματικόν.
    rationale: πνευματικόν is an adjective meaning spiritual/of spirit and does not explicitly name the Holy Spirit or state control. Although the Spirit-related sense is plausible in context, the translation should preserve the Greek term’s compactness and ambiguity.
  - severity: medium
    issue: The rendering of ψυχικόν as “nke ndụ mmadụ nkịtị na-achị” adds an agency notion and lacks close formal parallelism with the second adjective.
    rationale: ψυχικόν denotes what pertains to ψυχή/natural creaturely life. “Ahụ nke ndụ nkịtị” communicates this more directly and pairs naturally with “ahụ nke mmụọ.”
  - severity: low
    issue: The footnote’s statement that the contrast is specifically between bodies animated by ordinary life and by the Holy Spirit is too definite for a lexical-alternative note.
    rationale: It is a useful contextual explanation, but it should be phrased as clarification of the likely Pauline contrast and should avoid making “Mmụọ Nsọ” part of the translated wording.
  revised_text: A na-akụ ya dị ka ahụ nke ndụ nkịtị; a na-akpọlite ya dị ka ahụ nke mmụọ. Ọ bụrụ na ahụ nke ndụ nkịtị dị[a], ahụ nke mmụọ dịkwa.
  revised_footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ahụ nke mkpụrụ obi” … “ahụ nke mmụọ.” Ọdịiche Pọl na-ekwu abụghị n'etiti ahụ nwere ihe anụ ahụ na nke na-enweghị ya, kama ọ bụ n'etiti ahụ nke ndụ mmadụ nkịtị na-enye ndụ na ahụ nke Mmụọ na-enye ndụ.
    reason: lexical_alternative
  revision_rationale: The revision removes interpretive additions (“Mmụọ Nsọ” and “na-achị”) from the main text, restores a concise and parallel rendering of the two Greek adjectives, and retains the contextual clarification in the footnote. It preserves the passive verbs, the seed imagery, and the conditional/additive logic of the Greek.
