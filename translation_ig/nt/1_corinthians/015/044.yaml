id: 1CO.15.44
reference: 1 Corinthians 15:44
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: σπείρεται σῶμα ψυχικόν, ἐγείρεται σῶμα πνευματικόν. ⸀Εἰ ἔστιν σῶμα ψυχικόν, ⸂ἔστιν καὶ⸃ πνευματικόν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/044.yaml
  text: It is sown a natural body; it is raised a spiritual body. If there is a natural body[a], there is also a spiritual body.
translation:
  language: ig
  text: A na-akụ ya dị ka ahụ nke ndụ nkịtị; a na-akpọlite ya dị ka ahụ nke mmụọ. Ọ bụrụ na ahụ nke ndụ nkịtị dị[a], ahụ nke mmụọ dịkwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ahụ nke mkpụrụ obi” … “ahụ nke mmụọ.” Ọdịiche Pọl na-ekwu abụghị n'etiti ahụ nwere ihe anụ ahụ na nke na-enweghị ya, kama ọ bụ n'etiti ahụ nke ndụ mmadụ nkịtị na-enye ndụ na ahụ nke Mmụọ na-enye ndụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: σπείρεται
  choice: A na-akụ ya
  rationale: Nke a na-edobe ọnọdụ nnara nke okwu Grik na ihe atụ Pọl banyere ịkụ mkpụrụ n'akụkụ amaokwu a.
- source_word: σῶμα
  choice: ahụ
  rationale: “Ahụ” bụ okwu Igbo doro anya maka mmadụ nwere ahụ n'ọnwụ na ná mbilite n'ọnwụ.
- source_word: ψυχικόν
  choice: nke ndụ mmadụ nkịtị na-achị
  rationale: Nkọwa a na-egosi ahụ nke ndụ mmadụ e kere eke na-achị, ma zere ime ka okwu ahụ pụta nanị “anụ ahụ” ma ọ bụ ihe ọjọọ n'ụzọ ime mmụọ.
- source_word: ἐγείρεται
  choice: a na-akpọlite ya
  rationale: Nke a na-edobe ọnọdụ nnara ma bụrụkwa ụzọ Igbo doro anya isi kwuo mbilite n'ọnwụ.
- source_word: πνευματικόν
  choice: nke Mmụọ Nsọ na-achị
  rationale: Nke a na-egosi na ahụ ahụ bụ nke Mmụọ Nsọ na-enye ndụ ma na-achị, ọ bụghị ahụ na-enweghị ihe anụ ahụ; ide “Mmụọ Nsọ” na-eme ka ihe πνευματικόν na-ezo aka na ya doo anya n'ọnọdụ a.
- source_word: Εἰ
  choice: Ọ bụrụ na
  rationale: Nke a na-echekwa ụdị nkwupụta nwere ọnọdụ dị na Grik n'enweghị ịgbanwe ya ka ọ bụrụ nkwupụta doro anya nke “ebe ọ bụ na.”
- source_word: καὶ
  choice: kwa
  rationale: '“Kwa” na-egosipụta mgbakwunye ahụ: e wezụga ahụ mbụ, e nwekwara ahụ nke abụọ.'
theological_decisions:
- issue: Ọdịiche dị n'etiti σῶμα ψυχικόν na σῶμα πνευματικόν
  choice: Ahụ nke ndụ mmadụ nkịtị na-achị na ahụ nke Mmụọ Nsọ na-achị
  alternative: “ahụ nke mkpụrụ obi” na “ahụ nke mmụọ”; ma ọ bụ “ahụ anụ ahụ” na “ahụ ime mmụọ”
  rationale: Nhọrọ a na-echekwa ọdịiche Pọl na-ekwu n'etiti isi iyi ma ọ bụ ike na-achị ndụ ahụ, kama ịkọwa ya dịka ọdịiche n'etiti ahụ nwere ihe anụ ahụ na ndụ na-enweghị ahụ. Ọ na-emekwa ka nkuzi banyere mbilite n'ọnwụ nke ahụ ghara ịbụ nke a ga-aghọtahie.
translation_notes:
  register: Ejiri Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. A họọrọ nkọwa “nke … na-achị” iji mee ka ọdịiche ψυχικόν/πνευματικόν doo anya n'Igbo n'ebughị echiche na ahụ mbilite n'ọnwụ enweghị ihe anụ ahụ.
