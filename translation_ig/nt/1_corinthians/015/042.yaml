revisions:
- from: 'Otú ahụkwa ka mbilite n’ọnwụ nke ndị nwụrụ anwụ dị: a na-akụ ya n’ọnọdụ nke pụrụ ire ure[a]; a na-akpọlite ya n’ọnọdụ nke na-apụghị ire ure.'
  to: 'Otú ahụ ka mbilite n’ọnwụ nke ndị nwụrụ anwụ dị: a na-akụ ya n’ire ure; a na-akpọlite ya n’ireghị ure.'
  rationale: 'The revision removes the added, repetitive “n’ọnọdụ nke” while preserving every central feature of the Greek: the comparison with the preceding seed analogy, the resurrection of the dead, and the passive contrast between sowing and raising. “Ire ure / ireghị ure” is a natural, parallel Standard Igbo expression for perishability and imperishability. The footnote supplies the broader lexical alternative without altering the main text’s compact wordplay.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T19:24:16Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly retains the comparative transition, the genitive sense of “resurrection of the dead,” the agricultural metaphor, and the passive forms “is sown” and “is raised.” Its rendering of φθορά/ἀφθαρσία as susceptibility to decay versus freedom from decay is substantively sound.
  naturalness: “N’ọnọdụ nke ...” is an unnecessary and heavy expansion of the Greek ἐν + noun construction. “N’ire ure ... n’ireghị ure” is concise, idiomatic Standard Igbo and gives a clear, balanced contrast.
  terminology: “Mbilite n’ọnwụ” and “a na-akpọlite” are appropriate established Igbo resurrection terminology. “Ire ure / ireghị ure” preserves the lexical and rhetorical antithesis without importing a moral sense of “corruption.”
  issues:
  - severity: medium
    issue: The repeated phrase “n’ọnọdụ nke” adds an abstract expression not present in the source and makes the line stylistically cumbersome.
    rationale: Paul’s paired ἐν φθορᾷ / ἐν ἀφθαρσίᾳ is terse and antithetical. A direct paired Igbo rendering better reflects both the source form and contemporary natural usage.
  revised_text: 'Otú ahụ ka mbilite n’ọnwụ nke ndị nwụrụ anwụ dị: a na-akụ ya n’ire ure; a na-akpọlite ya n’ireghị ure.'
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “n’ịla n’iyi ... n’ịghara ịla n’iyi.”
    reason: lexical_alternative
  revision_rationale: 'The revision removes the added, repetitive “n’ọnọdụ nke” while preserving every central feature of the Greek: the comparison with the preceding seed analogy, the resurrection of the dead, and the passive contrast between sowing and raising. “Ire ure / ireghị ure” is a natural, parallel Standard Igbo expression for perishability and imperishability. The footnote supplies the broader lexical alternative without altering the main text’s compact wordplay.'
