base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/042.yaml
  text: 'So also is the resurrection of the dead: it is sown in corruption[a]; it is raised in incorruption.'
translation:
  language: ig
  text: 'Otú ahụ ka mbilite n’ọnwụ nke ndị nwụrụ anwụ dị: a na-akụ ya n’ire ure; a na-akpọlite ya n’ireghị ure.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οὕτως καὶ
  choice: Otú ahụkwa
  rationale: Na-ejikọta okwu a na ihe atụ mkpụrụ a kụrụ nke dị n’amaokwu ndị bu ya ụzọ, ma na-echekwa echiche ntụnyere na nkwubi okwu ahụ.
- source_word: ἡ ἀνάστασις τῶν νεκρῶν
  choice: mbilite n’ọnwụ nke ndị nwụrụ anwụ
  rationale: Nke a na-agbaso usoro genitive Grik ma na-ekwupụta nke ọma na okwu a metụtara mbilite n’ọnwụ nke ndị nwụrụ anwụ.
- source_word: σπείρεται
  choice: a na-akụ ya
  rationale: Ụdị a na-echekwa olu nnara na ihe atụ ọrụ ugbo; ihe ahụ bụ nke a na-eme ihe n’ahụ ya, ọ bụghị onye na-eme ihe.
- source_word: ἐν φθορᾷ
  choice: n’ọnọdụ nke pụrụ ire ure
  rationale: φθορά n’ebe a na-egosi ọnọdụ nke pụrụ ịla n’iyi ma ọ bụ ire ure. Nsụgharị a bụ Igbo nkịtị ma na-echekwa ọdịiche ya na ἀφθαρσία.
- source_word: ἐγείρεται
  choice: a na-akpọlite ya
  rationale: Na-echekwa olu nnara nke Grik nakwa asụsụ mbilite n’ọnwụ, na-egosighị ya dịka nanị iteta n’ụra.
- source_word: ἐν ἀφθαρσίᾳ
  choice: n’ọnọdụ nke na-apụghị ire ure
  rationale: Na-emepụta ọdịiche doro anya na nke yiri ibe ya na ‘pụrụ ire ure,’ ma na-egosi ọnọdụ na-agaghị emebi ma ọ bụ laa n’iyi.
theological_decisions:
- issue: Ụdị ahụ a na-akpọlite n’ọnwụ n’ime ntụnyere Pọl
  choice: E debere ihe atụ ịkụ mkpụrụ na ịkpọlite ya, tinyere olu nnara, n’enweghị ịkọwa ya dịka mbilite ime mmụọ naanị.
  alternative: Ịsụgharị ya n’ụzọ nkọwa dịka ‘a na-eli ahụ́ ... a na-akpọlite ya ka ọ ghara ire ure.’
  rationale: Ihe gbara amaokwu a gburugburu na-ekwu banyere mbilite n’ọnwụ nke ahụ́ site n’ihe atụ mkpụrụ. Idebe ‘a na-akụ ya ... a na-akpọlite ya’ na-echekwa ma njikọ ma mgbanwe dị n’etiti ọnọdụ abụọ ahụ, n’ebughị nkọwa karịrị ihe Grik kwuru.
translation_notes:
  register: Ejiri Standard Igbo nke dị ugwu ma dị mfe nghọta. ‘Ire ure’ bụ okwu ndụ kwa ụbọchị nke na-egosipụta ọdịiche φθορά/ἀφθαρσία nke ọma; ihe odide ala ala peeji na-edebe echiche sara mbara nke ịla n’iyi.
