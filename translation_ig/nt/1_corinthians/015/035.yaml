  yaml_path: translation/nt/1_corinthians/015/035.yaml
  text: But someone will say[a], “How are the dead raised, and with what kind of body do they come?”
translation:
  language: ig
  text: Ma mmadụ ga-asị[a], “Olee otú e si akpọlite ndị nwụrụ anwụ, olee ụdị ahụ ka ha ji abịa?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Olee otú ndị nwụrụ anwụ si ebili?” Ngwaa Grik ahụ dị n’ụdị nnata; n’ụzọ nkịtị, ọ pụtara, “a na-akpọlite [ha],” nke nwere ike ịpụta na Chineke bụ onye na-eme ya.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀλλὰ
  choice: Ma
  rationale: Na-egosi ntụgharị nwere ọdịiche ma na-eduba n’ajụjụ onye a tụrụ anya na ọ ga-ajụ.
- source_word: ἐρεῖ τις
  choice: mmadụ ga-asị
  rationale: Na-echekwa ọdịdị okwu ọdịnihu ahụ na onye a na-akọwaghị kpọmkwem, ma na-ada nke ọma n’Igbo.
- source_word: Πῶς
  choice: Olee otú
  rationale: Na-ajụ kpọmkwem ụzọ ma ọ bụ otú ihe ahụ si eme.
- source_word: ἐγείρονται
  choice: e si akpọlite
  rationale: Na-echekwa echiche nke nnara-eme dị na Grik, nke nwere ike ịtụ aka n’onye na-akpọlite ha n’agbanyeghị na a kpọghị ya aha.
- source_word: οἱ νεκροί
  choice: ndị nwụrụ anwụ
  rationale: Ọ bụ okwu Igbo doro anya ma dịkwa ebube maka ìgwè ndị nwụrụ anwụ.
- source_word: ποίῳ ... σώματι
  choice: ụdị ahụ ... ga-eji
  rationale: “Ụdị” na-echekwa ajụjụ banyere ụdị ma ọ bụ ọdịdị ahụ; “ga-eji” na-enye dativ Grik ahụ n’Igbo eke.
- source_word: δὲ
  choice: oleekwa
  rationale: Na-ejikọta ajụjụ nke abụọ na nke mbụ n’enweghị ime ka ọ bụrụ nnukwu mmegide.
- source_word: ἔρχονται
  choice: ha ga-eji bịa
  rationale: Na-echekwa ngwaa “ịbịa” kama ịkọwa ya karịa ihe Grik kwuru.
theological_decisions:
- issue: Okwu mbilite n’ọnwụ na onye na-eme ya
  choice: Olee otú e si akpọlite ndị nwụrụ anwụ
  alternative: Olee otú ndị nwụrụ anwụ si ebili
  rationale: Nhọrọ bụ isi na-echekwa nnara-eme nke ἐγείρονται na ohere ọ na-enye banyere ọrụ Chineke, ma ọ naghị etinye aha onye na-eme ya ebe amaokwu ahụ ekwughị ya.
translation_notes:
  register: Standard Igbo dị ugbu a, nke doro anya ma dị ùgwù. A họọrọ “akpọlite” iji debe nnara-eme na nghọta mbilite n’ọnwụ; a hapụrụ “bịa” ka ọ ghara ịkọwa ἔρχονται karịa isi mmalite.
