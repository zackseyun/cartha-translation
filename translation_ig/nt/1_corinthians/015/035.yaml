  to: Ma mmadụ ga-asị[a], “Olee otú e si akpọlite ndị nwụrụ anwụ, olee ụdị ahụ ka ha ji abịa?”
  rationale: The revision removes an unsupported future nuance from the second question while preserving the Greek passive in the first. It keeps the qualitative force of ποίῳ (“what kind of”) and retains the alternative active/intransitive rendering in the footnote without resolving the implied agency beyond the text.
