review_pass:
  verdict: revise
  source_fidelity: 'The first question accurately retains the Greek passive sense of ἐγείρονται through “e si akpọlite.” The second question should not introduce future time: ἔρχονται is present tense, so “ha ga-eji bịa” is an avoidable shift. “Ha ji abịa” preserves the source wording and rhetorical present more closely.'
  naturalness: The revised second question, “olee ụdị ahụ ka ha ji abịa?”, is idiomatic Standard Igbo and clearly expresses “with what kind of body do they come?” The cleft marker ka makes the instrumental phrase natural.
  terminology: “Ndị nwụrụ anwụ” and “akpọlite” are appropriate, established resurrection language. The footnote is adjusted to describe the Greek passive in clear Igbo without making divine agency explicit as though stated in the verse.
  issues:
  - severity: medium
    issue: The draft renders ἔρχονται as “ha ga-eji bịa.”
    rationale: The future auxiliary ga- is not represented in the Greek, whose present ἔρχονται is retained in the English audit trail as “do they come.” A present-form Igbo rendering better preserves the source.
  - severity: low
    issue: The footnote’s description of the passive can be phrased more clearly.
    rationale: “Ụdị nnata” and the literal sense “a na-akpọlite” communicate the passive more directly while retaining the cautious statement that it may imply divine agency.
  revised_text: Ma mmadụ ga-asị[a], “Olee otú e si akpọlite ndị nwụrụ anwụ, olee ụdị ahụ ka ha ji abịa?”
