  text: δι’ οὗ καὶ σῴζεσθε, τίνι λόγῳ εὐηγγελισάμην ὑμῖν, εἰ κατέχετε, ἐκτὸς εἰ μὴ εἰκῇ ἐπιστεύσατε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/002.yaml
  text: through which you also are being saved, if you hold firmly to the message I proclaimed as good news to you—unless you believed in vain.
translation:
  language: ig
  text: Ọ bụkwa site na ya ka a na-azọpụta unu[a], ma ọ bụrụ na unu ejidesie ozi m kwusara unu dịka ozi ọma ike[b]—ọ gwụla ma unu kweere n’efu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “e ji ya azọpụta unu.” Oge dị ugbu a n’asụsụ Grik nwere ike igosi nzọpụta na-aga n’ihu ma ọ bụ kwuo ya n’ụzọ izugbe.
    reason: lexical_alternative
  - marker: b
    text: 'N’ụzọ kpọmkwem, okwu Grik ahụ sịrị: “ma ọ bụrụ na unu ejidesie ike n’ozi m kwusara unu dịka ozi ọma.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: δι’ οὗ
  choice: Sitekwa na ya
  rationale: διά ya na genitive na-egosi ụzọ ma ọ bụ ihe e ji eme ihe; “site na ya” na-ezo aka n’ozi ọma e kwuru n’amaokwu bu ụzọ n’etinyeghị nkọwa ọzọ n’ime amaokwu a.
- source_word: σῴζεσθε
  choice: a na-azọpụta unu
  rationale: Usoro “a na-” na-egosipụta omume na-aga n’ihu ma kwekwa ka okwu ahụ nwee nghọta izugbe; ọ naghị amanye otu ozizi pụrụ iche banyere nzọpụta.
- source_word: τίνι λόγῳ
  choice: ozi
  rationale: N’ebe a λόγος pụtara ihe dị n’ozi Pọl ziri ha. “Ozi” bụ Igbo doro anya ma bụrụkwa nke dabara n’ọnọdụ a karịa ntụgharị nkịtị dịka “okwu.”
- source_word: εὐηγγελισάμην
  choice: m kwusara unu dịka ozi ọma
  rationale: Nke a na-echekwa echiche bụ isi nke ikwusa ihe dịka ozi ọma, kama iji naanị okwu nwere ike ịpụta nkwusa n’ozuzu.
- source_word: κατέχετε
  choice: unu ejidesie ... ike
  rationale: Nkebiokwu a na-egosi ịnọgide na-ejide ma na-agbasochi ozi ahụ ike.
- source_word: ἐκτὸς εἰ μὴ
  choice: ọ gwụla ma
  rationale: Nke a bụ ụzọ Igbo sitere n’okike si webata ọnọdụ e wepụrụ iche.
- source_word: εἰκῇ
  choice: n’efu
  rationale: “N’efu” na-egosi ihe na-enweghị uru ma ọ bụ nke na-arụpụtaghị ihe, dịka ịdọ aka ná ntị Pọl si dị.
- source_word: ἐπιστεύσατε
  choice: unu kweere
  rationale: Nke a na-egosi omume ha mere mgbe ha nabatara ozi ọma ahụ n’enweghị ịgbakwụnye nkọwa ozizi.
theological_decisions:
- issue: Ụdị oge nzọpụta dị na σῴζεσθε
  choice: a na-azọpụta unu
  alternative: e ji ya azọpụta unu
  rationale: Nhọrọ a na-eme ka omume na-aga n’ihu pụta ìhè, ma ihe odide ala peeji na-echekwa ohere nke nghọta izugbe. Ọ naghị ekpebi arụmụka banyere usoro nzọpụta.
- issue: Ọnọdụ dị na εἰ κατέχετε
  choice: ma ọ bụrụ na unu ejidesie ... ike
  alternative: ebe ọ bụ na unu na-ejidesi ... ike
  rationale: E debere ọnọdụ ahụ dịka ọnọdụ n’ezie, n’akọwaghị ya dịka naanị ihe àmà nke okwukwe ma ọ bụ dịka ọnọdụ Pọl chere na o mezuworị.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. “Ejidesie ... ike” bụ okwu sitere n’okike maka ịnọgide na-ejide ihe; ntụgharị ahụ chekwara ọnọdụ na esemokwu nkà mmụta okpukpe dị n’amaokwu ahụ n’enweghị ịkọwa ya n’ụzọ otu ụka.
