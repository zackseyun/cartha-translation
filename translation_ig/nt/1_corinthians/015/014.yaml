revisions:
- from: Ma ọ bụrụ na a kpọlitebeghị Mezaịa ahụ[a] n’ọnwụ, mgbe ahụ nkwusa anyị bụ ihe efu[b], okwukwe unu[c] bụkwa ihe efu.
  to: Ma ọ bụrụ na a kpọlitebeghị Mezaịa[a] site n’ọnwụ, mgbe ahụ, nkwusa anyị bụ ihe efu[b], okwukwe unu[c] bụkwa ihe efu.
  rationale: 'The revision corrects the resurrection idiom to site n’ọnwụ, removes an unnecessary definite demonstrative from the title, and makes the κενός lexical alternative more accurate. It otherwise preserves the source syntax and emphasis: the passive perfect, conditional inference, public-proclamation sense of κήρυγμα, and repeated ‘empty’ predicate.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T18:15:45Z'
review_pass:
  verdict: revise
  source_fidelity: The conditional argument, passive perfect sense of ἐγήγερται, logical inference, and rhetorical repetition of κενός are substantially preserved. However, n’ọnwụ (‘in death’) does not naturally express the source’s resurrection sense here; site n’ọnwụ (‘from the dead/from death’) is needed. The Greek title is anarthrous, so Mezaịa is preferable to the explicitly definite Mezaịa ahụ.
  naturalness: The revised wording is clear, contemporary Standard Igbo and retains Paul's compact parallelism. Adding a comma after mgbe ahụ improves the sentence rhythm.
  terminology: Mezaịa appropriately preserves Χριστός as a title, while Kraịst is retained as a valid alternative. Nkwusa and okwukwe are suitable renderings. The lexical note for κενός is revised because na-enweghị isi can mean ‘senseless’ rather than ‘empty/vain’; ihe na-enweghị uru is a safer alternative.
  issues:
  - severity: medium
    issue: The phrase n’ọnwụ is used with a kpọlitebeghị.
    rationale: In this construction it can suggest being raised ‘in death’ and is not the idiomatic expression for resurrection. The Greek ἐγήγερται in this context means ‘has been raised from the dead’; site n’ọnwụ conveys this without losing the passive voice.
  - severity: low
    issue: Mezaịa ahụ adds definiteness not marked by the anarthrous Χριστός.
    rationale: Although the referent is identifiable, the title Mezaịa is natural in Igbo without ahụ and more closely preserves the Greek form.
  - severity: low
    issue: The κενός footnote's alternative na-enweghị isi is semantically imprecise.
    rationale: It commonly denotes ‘without sense/meaning’ and can overstate the claim. Ihe na-enweghị uru better represents ‘vain, futile’ as a lexical alternative.
  revised_text: Ma ọ bụrụ na a kpọlitebeghị Mezaịa[a] site n’ọnwụ, mgbe ahụ, nkwusa anyị bụ ihe efu[b], okwukwe unu[c] bụkwa ihe efu.
  revised_footnotes:
  - marker: a
    text: 'Ma ọ bụ “Kraịst” kama “Mezaịa” (Grik: Χριστός).'
    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ “ihe na-enweghị uru” kama “ihe efu” n’ebe abụọ ahụ.
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ “ntụkwasị obi unu” kama “okwukwe unu.”
    reason: lexical_alternative
  revision_rationale: 'The revision corrects the resurrection idiom to site n’ọnwụ, removes an unnecessary definite demonstrative from the title, and makes the κενός lexical alternative more accurate. It otherwise preserves the source syntax and emphasis: the passive perfect, conditional inference, public-proclamation sense of κήρυγμα, and repeated ‘empty’ predicate.'
