  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἰ δὲ Χριστὸς οὐκ ἐγήγερται, κενὸν ⸀ἄρα τὸ κήρυγμα ἡμῶν, ⸀κενὴ καὶ ἡ πίστις ⸀ὑμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/014.yaml
  text: And if Messiah has not been raised[a], then our proclamation is empty[c][b], and your faith is empty.
translation:
  language: ig
  text: Ma ọ bụrụ na a kpọlitebeghị Mezaịa[a] site n’ọnwụ, mgbe ahụ, nkwusa anyị bụ ihe efu[b], okwukwe unu[c] bụkwa ihe efu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ “Kraịst” kama “Mezaịa” (Grik: Χριστός).'
    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ “ihe na-enweghị uru” kama “ihe efu” n’ebe abụọ ahụ.
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ “ntụkwasị obi unu” kama “okwukwe unu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Χριστὸς
  choice: Mezaịa ahụ
  rationale: E ji aha ọkwá a gosi onye Chineke tere mmanụ, kama ime ka Χριστός bụrụ naanị aha mmadụ. “Ahụ” na-eme ka okwu ahụ daa nke ọma n’Igbo dịka aha ọkwá a maara ama.
- source_word: ἐγήγερται
  choice: a kpọlitebeghị ... n’ọnwụ
  rationale: Nke a na-echekwa olu nnara nke ngwaa Grik na echiche nke ọnọdụ na-adịgide ruo ugbu a, ma hapụ onye mere omume ahụ n’ekwughị aha dịka isiokwu Grik si mee.
- source_word: κενὸν / κενὴ
  choice: ihe efu
  rationale: “Ihe efu” bụ okwu Igbo doro anya nke na-egosi ihe na-enweghị isi, ntọala, ma ọ bụ uru; e jikwa otu nsụgharị ahụ mee ugboro abụọ iji chekwaa myirịta okwu Pọl.
- source_word: ἄρα
  choice: mgbe ahụ
  rationale: Ọ na-egosi ihe ga-esite n’ọnọdụ e kwuru na mbụ pụta, ma na-eme ka usoro arụmụka ahụ doo anya n’Igbo.
- source_word: κήρυγμα
  choice: nkwusa
  rationale: “Nkwusa” na-egosi ozi a na-ekwupụta n’ihu ọha, ọ bụghị naanị ihe omume ikwusa okwu n’ụlọ nzukọ.
- source_word: πίστις
  choice: okwukwe
  rationale: N’ebe a ọ na-ezo aka na nzaghachi ndị Kọrịnt nke ikwere; “okwukwe” bụ okwu Igbo a kacha mara ma dabara n’ebe a.
theological_decisions:
- issue: Okwu mbilite n’ọnwụ na onye mere ya
  choice: a kpọlitebeghị ... n’ọnwụ
  alternative: o bilitebeghị n’ọnwụ
  rationale: A họọrọ olu nnara iji chekwaa ọdịdị ἐγήγερται na mgbagwoju echiche Akwụkwọ Nsọ banyere Chineke ịkpọlite Jizọs, n’agbanyeghị na a kpọghị onye mere ya aha n’amaokwu a.
- issue: Χριστός dịka aha ọkwá
  choice: Mezaịa ahụ
  alternative: Kraịst
  rationale: “Mezaịa” na-eme ka echiche onye e tere mmanụ pụta ìhè ma chekwaa ọrụ Χριστός dịka aha ọkwá n’arụmụka banyere mbilite n’ọnwụ.
translation_notes:
  register: Asụsụ Igbo izugbe, nke oge a ma dị ùgwù. E debere usoro arụmụka ahụ n’ụzọ dị mfe nghọta, chekwaa olu nnara nke ngwaa mbilite n’ọnwụ, ma chekwaakwa nkwughachi “ihe efu” nke dị n’isi mmalite.
