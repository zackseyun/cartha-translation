  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐγὼ γάρ εἰμι ὁ ἐλάχιστος τῶν ἀποστόλων, ὃς οὐκ εἰμὶ ἱκανὸς καλεῖσθαι ἀπόστολος, διότι ἐδίωξα τὴν ἐκκλησίαν τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/009.yaml
  text: For I am the least of the apostles[a], who am not worthy to be called an apostle, because I persecuted the church of God.
translation:
  language: ig
  text: N’ihi na mụ onwe m bụ onye kasị nta n’etiti ndịozi, ekwesịghị m[a] ka a kpọọ m onyeozi, n’ihi na akpagburu m ọgbakọ Chineke.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “adịghị m tozuo” ma ọ bụ “adịghị m eru” ka a kpọọ m onyeozi.
    reason: lexical_alternative
lexical_decisions:
- source_word: γάρ
  choice: N’ihi na
  rationale: Na-egosi na okwu a na-akọwa ihe Pọl kwuru n’amaokwu bu ya ụzọ, ma na-ada nke ọma n’Igbo ugbu a.
- source_word: ἐλάχιστος
  choice: onye kasị nta
  rationale: Ọ na-ekwu maka ọnọdụ Pọl n’etiti ndịozi, ọ bụghị banyere otú ahụ ya hà.
- source_word: ἀπόστολος / ἀποστόλων
  choice: onyeozi / ndịozi
  rationale: N’ebe a, okwu ahụ na-ezo aka n’òtù na ọrụ pụrụ iche nke ndị Kraịst mbụ kpọrọ ndịozi, ọ bụghị naanị ndị e zigara ozi n’ozuzu.
- source_word: ἱκανός
  choice: erughị m eru
  rationale: Nke a na-edobe echiche nke ịbụ onye na-ekwesịghị ekwesị, onye na-erughị eru, ma ọ bụ onye na-erughị ihe a chọrọ; ihe odide ala peeji na-egosi ụzọ ọzọ isi ghọta ya.
- source_word: καλεῖσθαι
  choice: ka a kpọọ m
  rationale: Nke a na-edobe usoro okwu nnara nke Grik n’Igbo dị mfe ma doo anya.
- source_word: διότι
  choice: n’ihi na
  rationale: Na-ewebata ihe kpatara Pọl ji kwuo na ya erughị eru ka a kpọọ ya onyeozi.
- source_word: ἐδίωξα
  choice: akpagburu m
  rationale: Na-egosi mmegide na mmeso ọjọọ Pọl mere ndị kwere ekwe, ọ bụghị naanị ịchụso ha.
- source_word: ἐκκλησίαν τοῦ θεοῦ
  choice: ọgbakọ Chineke
  rationale: Na-ezo aka n’ọgbakọ ma ọ bụ obodo ndị nke Chineke, n’enweghị itinye echiche otu ụka pụrụ iche n’ime okwu ahụ.
theological_decisions:
- issue: Ihe okwu Pọl pụtara banyere ịbụ onyeozi
  choice: Pọl gụnyere onwe ya n’etiti ndịozi, ma kwuo na ya erughị eru ka a kpọọ ya onyeozi n’ihi na ọ kpagburu ọgbakọ Chineke.
  alternative: Ịghọta okwu ahụ dị ka Pọl na-agọnahụ kpamkpam na ya bụ onyeozi, ma ọ bụ na ọ na-ekwu naanị na ọ nọ n’ọnọdụ kasị ala.
  rationale: “Abụ m onye kasị nta n’etiti ndịozi” na-egosi na ọ bụ otu n’ime ha; “erughị m eru ka a kpọọ m onyeozi” na-edobekwa mweda onwe ya n’ala n’ihi ihe o mere n’oge gara aga. Nsụgharị ahụ anaghị ewepụ esemokwu dị n’etiti eziokwu abụọ ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta, dee ya. “Ndịozi/onyeozi” na-edobe nghọta pụrụ iche nke okwu ahụ, ebe “ọgbakọ Chineke” na-ezere ime ka ọ bụrụ aha otu ụka ma na-egosi ndị Chineke kpọkọtara ọnụ.
