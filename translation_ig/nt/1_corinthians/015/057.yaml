  text: τῷ δὲ θεῷ χάρις τῷ διδόντι ἡμῖν τὸ νῖκος διὰ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/057.yaml
  text: But thanks be to God[a], who gives us the victory through our Lord Jesus the Messiah.
translation:
  language: ig
  text: Ma ekele dịrị Chineke, onye na-enye anyị mmeri site n’aka Onyenwe anyị Jizọs, bụ́ Mezaya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'N’asụsụ Bekee ọdịnala: “Jesus Christ” (“Jizọs Kraịst”). Utu aha Grik Χριστός pụtara “Mezaya.”'
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: Ma
  rationale: “Ma” na-egosi ntụgharị dị nro site n’okwu banyere ọnwụ gaa n’ekele, ma na-echekwa obere ọdịiche δέ nwere.
- source_word: χάρις
  choice: ekele dịrị
  rationale: N’usoro okwu a, χάρις bụ okwu e ji enye Chineke ekele, ọ bụghị okwu pụtara amara.
- source_word: τῷ θεῷ
  choice: Chineke
  rationale: N’ahịrịokwu “ekele dịrị Chineke,” ọdịdị okwu Igbo na-egosipụta onye a na-enye ekele dịka dativ Grik si eme.
- source_word: τῷ διδόντι
  choice: onye na-enye
  rationale: Nke a na-egosipụta participle nke na-akọwa Chineke dịka onye na-enye mmeri mgbe niile.
- source_word: ἡμῖν
  choice: anyị
  rationale: Ọ bụ onye a na-enye ihe; n’ebe a ọ na-ezo aka n’ebe ndị kwere ekwe nọ.
- source_word: τὸ νῖκος
  choice: mmeri
  rationale: “Mmeri” bụ okwu Igbo doro anya maka νῖκος ma na-ezo aka n’otu mmeri ahụ e kwuru banyere ya n’amaokwu ndị bu ụzọ.
- source_word: διὰ
  choice: site n’aka
  rationale: διά tinyere genitive na-egosi ụzọ ma ọ bụ onye e ji rụọ ọrụ; “site n’aka” bụ okwu Igbo ebumpụta ụwa nke na-echekwa echiche ahụ.
- source_word: τοῦ κυρίου ἡμῶν
  choice: Onyenwe anyị
  rationale: Nke a na-echekwa utu aha christological κύριος na nnọchiaha “anyị” n’ụdị Igbo a maara nke ọma.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jizọs, bụ́ Mezaya
  rationale: A sụgharịrị Χριστός dịka utu aha “Mezaya,” ebe Jizọs bụ aha; “bụ́” na-eme ka utu aha ahụ doo anya n’Igbo dị mma.
theological_decisions:
- issue: Otú e si sụgharịa Χριστοῦ n’usoro Ἰησοῦ Χριστοῦ
  choice: Jizọs, bụ́ Mezaya
  alternative: Jizọs Kraịst
  rationale: Χριστός bụ utu aha kwekọrọ na “Mezaya.” Isi ederede na-eme ka ihe utu aha ahụ pụtara doo anya, ebe ndetu ala na-edebe ụdị ọdịnala “Kraịst” maka ndị na-agụ ya.
- issue: Ụzọ Chineke si enye mmeri
  choice: site n’aka Onyenwe anyị Jizọs
  alternative: site n’Onyenwe anyị Jizọs
  rationale: “Site n’aka” na-egosipụta ụzọ ma ọ bụ agency nke διά n’enweghị ịkọwa karịa ihe Grik kwuru.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị ugwu ma dị mfe nghọta. Ejiri “Onyenwe anyị” dịka utu aha a maara nke ọma, ma sụgharịa Χριστός dịka “Mezaya” iji mee ka ihe ọ pụtara pụta ìhè.
