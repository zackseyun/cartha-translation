base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/047.yaml
  text: The first man was from the earth[a], made of dust; the second man is from heaven.
translation:
  language: ig
  text: Mmadụ mbụ bụ onye sitere n’ala, onye bụ nke ájá[a]; mmadụ nke abụọ bụ onye sitere n’eluigwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “onye bụ nke ụwa” ma ọ bụ “onye e ji ájá mee.” Okwu Grik χοϊκός na-akpọghachi uche n’otú e si kee Adam site n’ájá.
    reason: lexical_alternative
lexical_decisions:
- source_word: πρῶτος
  choice: mbụ
  rationale: Na-egosi onye mbụ n’ọdịiche Pọl na-eme n’etiti Adam na Kraịst; “mbụ” bụ okwu Igbo doro anya ma kwekọọ na “nke abụọ.”
- source_word: ἄνθρωπος
  choice: mmadụ
  rationale: N’ebe a okwu ahụ na-ezo aka n’otu nwoke, Adam, nakwa n’otu aka ahụ n’ebe Kraịst nọ. “Mmadụ” na-echekwa nkwughachi na nnọchiteanya ahụ n’Igbo nkịtị, ebe ọnọdụ gbara ya gburugburu na-eme ka ndị a bụ ndị kpọmkwem doo anya.
- source_word: ἐκ γῆς
  choice: si n’ala pụta
  rationale: Na-egosi ebe o si malite ma na-akpọghachi uche n’akụkọ e ji ala kee Adam.
- source_word: χοϊκός
  choice: onye e ji ájá mee
  rationale: Na-egosipụta na e ji ájá mee ya, ọ bụghị nanị na o nwere agwa nke ụwa; ọ na-echekwa njikọ ya na akụkọ okike.
- source_word: δεύτερος
  choice: nke abụọ
  rationale: Na-echekwa ọdịiche ahaziri ahazi dị n’etiti mmadụ mbụ na mmadụ nke abụọ.
- source_word: ἐξ οὐρανοῦ
  choice: si n’eluigwe bịa
  rationale: Na-egosi mmalite sitere n’eluigwe ma na-echekwa nghọta ime mmụọ nke οὐρανός n’ebe a.
theological_decisions:
- issue: Ihe “mmadụ nke abụọ” na-ekwu banyere Kraịst
  choice: A hapụrụ ya dịka “mmadụ nke abụọ ahụ” n’etinyeghị aha “Kraịst.”
  alternative: “Mmadụ nke abụọ ahụ, bụ Kraịst, si n’eluigwe bịa.”
  rationale: Ọnọdụ gbara amaokwu ahụ gburugburu na-akọwa onye ahụ dịka Kraịst, ma amaokwu Grik a akpọghị aha ya. Ịghara ịgbakwunye aha ahụ na-echekwa usoro na esemokwu nke ederede.
- issue: Oge ngwaa na nkebi nke abụọ
  choice: “si n’eluigwe bịa”
  alternative: “bụ onye si n’eluigwe”
  rationale: Grik etinyeghị ngwaa njikọ n’ụzọ pụtara ìhè. Igbo chọrọ nkebi zuru oke; “si n’eluigwe bịa” na-egosi mmalite ya n’enweghị ịmanye nkebi ahụ ka ọ bụrụ naanị ihe mere n’oge gara aga.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. E chekwara nhazi yiri ibe ya nke “mmadụ mbụ ... mmadụ nke abụọ,” ma zere ịgbakwunye aha Kraịst nke na-adịghị n’amaokwu Grik.
