    text: A pụkwara ịsụgharị ya, “onye bụ nke ụwa” ma ọ bụ “onye e ji ájá mee.” Okwu Grik χοϊκός na-akpọghachi uche n’otú e si kee Adam site n’ájá.
    reason: lexical_alternative
  revision_rationale: The revision renders both prepositional phrases consistently as origin statements (“sitere n’...”) and avoids turning the second clause into a past movement event. It retains the source’s unnamed “second man,” its first/second parallelism, and the dust/Adam allusion without imposing an interpretive identification or doctrine.
