  text: ⸀ἄφρων, σὺ ὃ σπείρεις, οὐ ζῳοποιεῖται ἐὰν μὴ ἀποθάνῃ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/036.yaml
  text: Foolish one[b][a], what you sow is not made alive unless it dies.
translation:
  language: ig
  text: Onye nzuzu, gị, ihe ị na-agha, a naghị eme ka ọ dị ndụ[b] ma ọ bụrụ na ọ nwụghị anwụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Ma ọ bụ, “ọ naghị amalite ịdị ndụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄφρων
  choice: onye nzuzu
  rationale: Nke a na-egosipụta mba Pọl baara onye ọ na-agwa kpọmkwem. Ọ bụ okwu siri ike, ma ọ ka bụ asụsụ Igbo doro anya ma bụrụkwa nke a na-aghọta taa.
- source_word: σὺ
  choice: gị
  rationale: 'E depụtara nnọchiaha ahụ n’ụzọ pụtara ìhè iji chekwaa nkwusi okwu dị na Grik: ọ bụ onye ahụ ka Pọl na-agwa kpọmkwem.'
- source_word: ὃ σπείρεις
  choice: ihe ị na-agha
  rationale: Nke a na-edebe ihe atụ ọrụ ugbo na-enweghị ịgbakwụnye ‘mkpụrụ’ n’ebe ederede Grik kwuru naanị ‘ihe.’
- source_word: ζῳοποιεῖται
  choice: a naghị eme ka ọ dị ndụ
  rationale: Nke a na-echekwa ụdị nnara-eme nke ngwaa Grik ma na-egosipụta na e mere ka ihe ahụ nweta ndụ, kama ikwu naanị na ọ malitere ịdị ndụ n’onwe ya.
- source_word: ἐὰν μὴ
  choice: ma ọ bụrụ na ... nwụghị
  rationale: Ụdị a bụ ụzọ Igbo nkịtị si egosipụta ọnọdụ ‘ọ gwụla ma’ n’ahịrịokwu a.
- source_word: ἀποθάνῃ
  choice: ọ nwụghị
  rationale: 'N’usoro ọnọdụ a, ụdị njụ a na-enye echiche Grik nke ọma n’Igbo: a gaghị eme ka ihe ahụ dị ndụ ma ọ bụrụ na ọnwụ ya emeghị.'
theological_decisions:
- issue: Mmekọrịta ihe atụ ọnwụ nke ihe a ghara na mbilite n’ọnwụ
  choice: E debere ihe atụ ọrụ ugbo ahụ n’enweghị ịkọwa ya karịa ihe amaokwu ahụ kwuru.
  alternative: Ịsụgharị ya dị ka nkwupụta ozizi doro anya banyere mbilite n’ọnwụ nke ahụ.
  rationale: Pọl ji ihe a na-agha aza ajụjụ banyere mbilite n’ọnwụ. Ịhapụ ihe atụ ahụ otú ọ dị na-echekwa obosara na esemokwu echiche nke ederede ahụ.
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe nke oge a, dị ùgwù ma doo onye nkịtị anya. ‘Gị’ na-edebe nkwusi okwu nke σὺ; ‘onye nzuzu’ na-echekwa ịdị nkọ nke mba ahụ. Ahịrịokwu ahụ anaghị agbakwụnye nkọwa ozizi na-adịghị na amaokwu ahụ.
