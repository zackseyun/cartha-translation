review_pass:
  verdict: revise
  source_fidelity: The draft accurately retains the direct rebuke, the emphatic second-person address, the sowing image, the passive life-giving verb, and the conditional relation to death. However, the final conditional is clearer and more idiomatic in Standard Igbo when the verb for dying is completed as “nwụrụ anwụ.”
  naturalness: “Gị onye nzuzu” is understandable but is less natural as a vocative in this sentence. “Onye nzuzu, gị” gives a natural direct address while retaining the Greek emphasis of σύ. “Ma ọ bụrụ na ọ nwụghị anwụ” is the normal unambiguous way to express ‘unless it dies’ here.
  terminology: “Onye nzuzu” suitably conveys ἄφρων as a sharp rebuke without importing a theological sense. “A naghị eme ka ọ dị ndụ” preserves the passive sense of ζῳοποιεῖται and is appropriate in this resurrection-context metaphor.
  issues:
  - severity: low
    issue: Vocative word order is awkward.
    rationale: “Gị onye nzuzu” is comprehensible, but “Onye nzuzu, gị” is more idiomatic Standard Igbo and still represents the emphatic explicit pronoun.
  - severity: medium
    issue: The conditional death expression is incomplete/less idiomatic.
    rationale: “Ọ nwụghị” may be understood, but “ọ nwụghị anwụ” is the conventional, clearer Standard Igbo expression for ‘it does not die’ in this conditional construction.
  revised_text: Onye nzuzu, gị, ihe ị na-agha, a naghị eme ka ọ dị ndụ[b] ma ọ bụrụ na ọ nwụghị anwụ.
