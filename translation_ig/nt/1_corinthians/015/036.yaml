- from: Gị onye nzuzu[a], ihe ị na-agha, a naghị eme ka ọ dị ndụ[b] ma ọ bụrụ na ọ nwụghị.
  to: Onye nzuzu, gị, ihe ị na-agha, a naghị eme ka ọ dị ndụ[b] ma ọ bụrụ na ọ nwụghị anwụ.
  rationale: The revision improves Standard Igbo vocative and conditional idiom without altering the Greek syntax, agricultural metaphor, passive life-giving sense, or rhetorical force. The alternative for ἄφρων remains available in footnote a, though the main rendering remains the sharper direct rebuke.
  reviewer_model: gpt-5.6-terra
