    text: Ụfọdụ ihe odide ochie na-agụ, “Ka anyị yikwasịkwa onyinyo nke onye si n’eluigwe.”
    reason: textual_variant
  revision_rationale: The revision makes the first verb an unambiguous past form corresponding to ἐφορέσαμεν, while retaining the future indicative in the second clause corresponding to the printed SBLGNT φορέσομεν. It preserves the Adamic dust/heavenly parallel, the metaphor of bearing an image, and the alternate hortatory reading without preferring it in the main text.
