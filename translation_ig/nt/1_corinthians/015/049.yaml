  text: καὶ καθὼς ἐφορέσαμεν τὴν εἰκόνα τοῦ χοϊκοῦ, ⸀φορέσομεν καὶ τὴν εἰκόνα τοῦ ἐπουρανίου.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/049.yaml
  text: And just as we have borne the image of the man of dust[a], we will also bear the image of the heavenly man.
translation:
  language: ig
  text: Ma dị ka anyị yikwasịrị onyinyo nke onye e ji ájá mee, otu a ka anyị ga-eyikwasịkwa onyinyo nke onye si n’eluigwe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ụfọdụ ihe odide ochie na-agụ, “Ka anyị yikwasịkwa onyinyo nke onye si n’eluigwe.”
    reason: textual_variant
lexical_decisions:
- source_word: καθὼς
  choice: dịkwa ka … otu a ka
  rationale: Usoro a na-egosi ntụnyere doro anya n’etiti ọnọdụ mmadụ nke sitere n’aka Adam na nke ga-adị n’ime Kraịst.
- source_word: ἐφορέσαμεν
  choice: anyị si yikwasị
  rationale: ‘Yikwasị’ na-egosipụta iburu ma ọ bụ iyi ọdịdị/onyinyo; usoro ‘anyị si’ na-edobe omume ahụ dị ka eziokwu e nwetaworị nke ka metụtara ọnọdụ anyị ugbu a.
- source_word: εἰκόνα
  choice: onyinyo
  rationale: ‘Onyinyo’ bụ okwu Igbo a na-ejikarị akọwa ihe nnọchianya ma ọ bụ ọdịdị yiri onye ọzọ, na-enweghị ịkọwa ihe Pọl kwuru karịa ókè.
- source_word: τοῦ χοϊκοῦ
  choice: nke onye e ji ájá mee
  rationale: Nke a na-edobe njikọ χοϊκός na ájá nke Jenesis, ma na-eme ka onye a na-ekwu banyere ya doo anya n’ụzọ kwekọrọ na amaokwu ndị gbara ya gburugburu.
- source_word: φορέσομεν
  choice: anyị ga-eyikwasịkwa
  rationale: Oge ọdịnihu na-egosipụta nkwa banyere mgbanwe n’oge mbilite n’ọnwụ; ‘-kwa’ na-ebute ike mgbakwunye nke καί.
- source_word: τοῦ ἐπουρανίου
  choice: nke onye si n’eluigwe
  rationale: Nke a na-edobe myirịta dị n’etiti ‘onye e ji ájá mee’ na onye nke eluigwe, dịka ihe gbara amaokwu a gburugburu si gosi.
theological_decisions:
- issue: Oge ọdịnihu nke ngwaa ma ọ bụ ndụmọdụ/ịgba ume n’ahịrịokwu nke abụọ
  choice: anyị ga-eyikwasịkwa
  alternative: ka anyị yikwasịkwa
  rationale: SBLGNT bipụtara φορέσομεν, nke bụ future indicative, ya mere isi ederede na-egosi nkwa ọdịnihu. A na-edobe variant nke hortatory subjunctive n’ala peeji kama idozi esemokwu ederede ahụ n’amaghị ama.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị ugwu ma dị mfe nghọta. E jiri ‘ájá’ chekwaa nkwughachi banyere okike Adam, ma jiri usoro abụọ yiri ibe ha mee ka ntụnyere Adam na Kraịst pụta ìhè.
