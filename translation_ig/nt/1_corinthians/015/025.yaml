  text: δεῖ γὰρ αὐτὸν βασιλεύειν ἄχρι ⸀οὗ θῇ πάντας τοὺς ἐχθροὺς ὑπὸ τοὺς πόδας αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/025.yaml
  text: For he must reign until he has put all his enemies under his feet[a][b].
translation:
  language: ig
  text: N’ihi na ọ ghaghị ịchị dị ka eze ruo mgbe ọ ga-etinye ndị iro ya niile n’okpuru ụkwụ ya[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ruo mgbe ọ tinyeworo ndị iro ya niile n’okpuru ụkwụ ya.” Okwu Grik n’onwe ya anaghị amanye ọdịiche dị n’etiti ụzọ abụọ a e si akọ oge omume ahụ.
    reason: lexical_alternative
  - marker: b
    text: Ihe oyiyi a nke idobe ndị iro “n’okpuru ụkwụ ya” bụ ihe atụ Akwụkwọ Nsọ nke pụtara imeri ha na ido ha kpamkpam n’okpuru ya. Tụlee Abụ Ọma 110:1.
    reason: cross_reference
lexical_decisions:
- source_word: δεῖ
  choice: ọ ghaghị
  rationale: Nke a na-egosi ihe dị mkpa ma ọ bụ ihe a na-apụghị izere ezere n’atụmatụ Chineke, ma na-adịkwa mfe nghọta n’Igbo.
- source_word: γὰρ
  choice: N’ihi na
  rationale: Ọ na-ejikọta amaokwu a na okwu bu ya ụzọ dịka nkọwa ma ọ bụ ihe mere e ji kwuo ya.
- source_word: αὐτὸν
  choice: ọ
  rationale: Ọ bụ Kraịst ka nnọchiaha a na-ezo aka n’ọnọdụ okwu ahụ; Igbo na-eji nnọchiaha dị ka isiokwu nke ngwaa zuru ezu.
- source_word: βασιλεύειν
  choice: ịchị dị ka eze
  rationale: Nke a na-echekwa echiche nke ọchịchị eze nke dị n’okwu Grik, ma bụrụkwa okwu doro ndị na-agụ Igbo anya.
- source_word: ἄχρι οὗ
  choice: ruo mgbe
  rationale: Ọ na-egosi oge a na-ele anya ka ihe ọzọ mee, ma n’onwe ya ekwughị na ọchịchị ahụ ga-akwụsị mgbe oge ahụ gasịrị.
- source_word: θῇ
  choice: ọ ga-etinye
  rationale: Ngwaa a sitere na τίθημι, ‘itinye’ ma ọ bụ ‘idowe.’ Ụdị a na-adị mma n’Igbo mgbe ‘ruo mgbe’ gasịrị, ma na-ele anya n’imeri ndị iro ahụ n’ọdịnihu.
- source_word: πάντας τοὺς ἐχθρούς
  choice: ndị iro ya niile
  rationale: Ọ na-echekwa echiche nke ndị iro ahụ n’ozuzu ha, tinyekwa njikọ ha na onye ahụ a na-ekwu maka ya.
- source_word: ὑπὸ τοὺς πόδας αὐτοῦ
  choice: n’okpuru ụkwụ ya
  rationale: Nke a na-echekwa ihe atụ Akwụkwọ Nsọ nke na-egosi imeri na ido mmadụ kpamkpam n’okpuru ọchịchị onye ọzọ.
theological_decisions:
- issue: Ihe ‘ruo mgbe’ (ἄχρι οὗ) pụtara banyere oge ọchịchị Kraịst
  choice: E ji ‘ruo mgbe’ sụgharịa ya, n’ebughị n’obi na ọchịchị Kraịst ga-akwụsị mgbe e merichara ndị iro ya.
  alternative: Ịsụgharị ya n’ụzọ ga-egosi hoo haa na ọchịchị ya ga-akwụsị ozugbo e doro ndị iro ya n’okpuru ya.
  rationale: Okwu Grik na-akọwa oge a na-ele anya ruo na ya, ma ọ naghị ekpebi n’onwe ya ihe ga-eme ọchịchị ahụ mgbe nke ahụ gasịrị.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị nsọ ma dị mfe nghọta, mee ihe. “Ịchị dị ka eze” na-eme ka echiche ọchịchị eze dị na βασιλεύειν pụta ìhè; e chekwara ihe atụ “n’okpuru ụkwụ ya” kama ịkọwa ya n’ime amaokwu ahụ.
