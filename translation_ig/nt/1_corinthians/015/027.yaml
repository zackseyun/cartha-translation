  source_fidelity: 'Nsụgharị ahụ na-anọgide nso n’asụsụ Grik: πάντα/τὰ πάντα bụ “ihe niile”; ὑπέταξεν ka e jiri “O doro ... n’okpuru ụkwụ ya”; perfect passive ὑποτέτακται ka e jiri “e doro ... n’okpuru ya”; ma ἐκτός na-apụta n’ụzọ doro anya site n’ikwu na onye doro ihe niile esoghị n’“ihe niile” ahụ. “Ma mgbe e kwuru” na-echekwa isiokwu εἴπῃ na-akọwaghị kpọmkwem.'
  naturalness: Igbo a bụ Standard Igbo dị mfe ịgụ ma dị ùgwù. “N’okpuru ụkwụ ya” na “n’okpuru ya” bụ usoro okwu nkịtị nke na-echekwa akpaalaokwu Akwụkwọ Nsọ na echiche nke ido ihe n’okpuru ọchịchị. Nkọwa “esoghị n’‘ihe niile’ ahụ” na-eme mgbagha nke pụrụ ịdị n’usoro Grik ka ọ doo ndị na-agụ Igbo anya n’enweghị ịgbakwunye ozizi.
