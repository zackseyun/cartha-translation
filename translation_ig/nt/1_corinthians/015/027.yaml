id: 1CO.15.27
reference: 1 Corinthians 15:27
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: πάντα γὰρ ὑπέταξεν ὑπὸ τοὺς πόδας αὐτοῦ. ὅταν δὲ εἴπῃ ὅτι πάντα ὑποτέτακται, δῆλον ὅτι ἐκτὸς τοῦ ὑποτάξαντος αὐτῷ τὰ πάντα.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/027.yaml
  text: For he has subjected all things under his feet. But when it says that all things have been subjected[a], it is clear that this excludes the one who subjected all things to him.
translation:
  language: ig
  text: N’ihi na, “O doro ihe niile n’okpuru ụkwụ ya.” Ma mgbe e kwuru na e doro ihe niile n’okpuru ya, o doro anya na onye ahụ nke doro ihe niile n’okpuru ya esoghị n’“ihe niile” ahụ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ịsụ ya: “ma e wezụga onye ahụ nke doro ihe niile n’okpuru ya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα / τὰ πάντα
  choice: ihe niile
  rationale: Ụdị nnọchiaha neuter plural a metụtara ihe niile n’ozuzu, ọ bụghị naanị mmadụ niile; ọ na-echekwakwa njikọ ya na Abụ Ọma 8.
- source_word: ὑπέταξεν / ὑποτέτακται
  choice: doro / e doro ... n’okpuru
  rationale: Nkebiokwu a na-egosi ime ka ihe nọrọ n’okpuru ọchịchị onye ọzọ. A sụgharịrị aorist nke mbụ dịka omume e mere, ebe ‘e doro’ na nke abụọ na-echekwa passive na ọnọdụ nke omume ahụ kpatara.
- source_word: ὑπὸ τοὺς πόδας αὐτοῦ
  choice: n’okpuru ụkwụ ya
  rationale: A hapụrụ akpaalaokwu Akwụkwọ Nsọ a n’ụdị ya iji chekwaa echiche nke ọchịchị na mmeri, tinyere njikọ ya na Abụ Ọma 8.
- source_word: ὅταν δὲ εἴπῃ
  choice: Ma mgbe e kwuru
  rationale: Ụdị a bụ nke nkịtị ma ọ naghị ekpebi ma onye kwuru ya bụ Chineke kpọmkwem ma ọ bụ na ọ bụ Akwụkwọ Nsọ ka a na-ekwu na o kwuru ya.
- source_word: δῆλον
  choice: o doro anya
  rationale: Nke a na-egosi nkwubi okwu Pọl tụrụ anya na ndị na-agụ ya ga-aghọta ozugbo.
- source_word: ἐκτὸς τοῦ ὑποτάξαντος αὐτῷ τὰ πάντα
  choice: onye ahụ nke doro ihe niile n’okpuru ya esoghị n’“ihe niile” ahụ
  rationale: 'Nke a na-eme ka echiche nke exception pụta ìhè n’Igbo dị mfe nghọta: onye mere ka ihe niile nọrọ n’okpuru Kraịst abụghị otu n’ime ihe ndị ahụ.'
- source_word: αὐτῷ
  choice: n’okpuru ya
  rationale: N’usoro okwu Igbo, ‘n’okpuru ya’ na-aga nke ọma na ngwaa ‘doro’ ma na-egosi onye e mere ka ihe niile nọrọ n’okpuru ya.
theological_decisions:
- issue: Mmekọrịta dị n’etiti Ọkpara na onye doro ihe niile n’okpuru ya
  choice: E kwuru hoo haa na onye doro ihe niile n’okpuru Ọkpara esoghị n’‘ihe niile’ e doro n’okpuru ya.
  alternative: Iji naanị nkebiokwu exception sị, ‘ma e wezụga onye doro ihe niile n’okpuru ya.’
  rationale: Nke a na-echekwa ọdịiche ederede ahụ mere n’etiti Ọkpara na Chineke, onye doro ihe niile n’okpuru ya, n’etinyeghị nkọwa ozizi ọzọ n’ime amaokwu ahụ.
- issue: Onye bụ isiokwu nke εἴπῃ
  choice: E ji ‘mgbe e kwuru’ hapụ onye kwuru ya n’ụzọ a na-akọwaghị kpọmkwem.
  alternative: ‘Mgbe ọ na-ekwu’ ma ọ bụ ‘mgbe Akwụkwọ Nsọ kwuru.’
  rationale: Grik ekwughị isiokwu ahụ hoo haa. Nsụgharị a na-echekwa nghọta na ọ bụ okwu Akwụkwọ Nsọ a kpọrọ ihe, ma ọ naghị emechi ụzọ n’echiche na Chineke bụ onye kwuru ya.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E chekwara akpaalaokwu ‘n’okpuru ụkwụ ya,’ ebe e ji passive ‘e kwuru’ na ‘e doro’ zere ịgbakwunye isiokwu Grik na-akọwaghị kpọmkwem.
