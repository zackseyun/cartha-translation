reference: 1 Corinthians 15:31
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καθ’ ἡμέραν ἀποθνῄσκω, νὴ τὴν ὑμετέραν ⸀καύχησιν, ἣν ἔχω ἐν Χριστῷ Ἰησοῦ τῷ κυρίῳ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/031.yaml
  text: I die every day—by the boasting in you that I have in Messiah Jesus our Lord[a][b][c].
translation:
  language: ig
  text: Ana m anwụ kwa ụbọchị[a]—ana m eji ịnya isi m ji unu eme, nke m nwere n’ime Mesaịa Jizọs[c], Onyenwe anyị, aṅụ iyi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n’ụzọ ka nso n’okwu Grik, “Kwa ụbọchị ka m na-anwụ.”
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, “dị nnọọ ka ịnya isi m ji unu eme si bụrụ eziokwu,” ma ọ bụ “site na ịnya isi unu.” Okwu Grik ahụ yiri usoro ịṅụ iyi, a na-arụrịtakwa ụka banyere otú okwu ahụ maka ịnya isi si jikọta n’ahịrịokwu ahụ.
    reason: alternative_reading
  - marker: c
    text: Nsụgharị ọdịnala bụ “Kraịst Jizọs.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καθ’ ἡμέραν
  choice: kwa ụbọchị
  rationale: Ọ bụ akpaalaokwu na-egosi ihe na-eme ụbọchị niile; “kwa ụbọchị” bụ Igbo nkịtị ma na-edobe ike nke ugboro ugboro dị na Grik.
- source_word: ἀποθνῄσκω
  choice: ana m anwụ
  rationale: Ọ na-edobe okwu Pọl n’ụzọ doro anya ma dị ndụ; ịsụgharị ya “ana m eche ọnwụ ihu” ga-akọwa ihe okwu ahụ pụtara kama ịsụgharị ya kpọmkwem.
- source_word: νὴ
  choice: ana m eji … aṅụ iyi na nke a bụ eziokwu
  rationale: νὴ bụ mkpụrụokwu e ji ekwusi okwu ike dịka iyi. Usoro a bụ Igbo sitere n’okike nke na-egosipụta ọrụ ya n’ahịrịokwu ahụ.
- source_word: τὴν ὑμετέραν καύχησιν
  choice: nganga ahụ m ji unu eme
  rationale: Nkebiokwu na-esochi ya, “nke m nwere,” na-akwado nghọta na ọ bụ nganga Pọl nwere banyere ndị Kọrịnt. “Nganga” na-edobe njikọ okwu καύχησις na ojiji Pọl, ebe e debere nghọta ọzọ n’ala peeji.
- source_word: ἣν ἔχω
  choice: ahụ m ji … eme
  rationale: E tinyere echiche nke “nke m nwere” n’ụzọ Igbo sitere n’okike n’ime nkebiokwu “nganga ahụ m ji unu eme.”
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: n’ime Mesaịa Jizọs
  rationale: “N’ime” na-edobe okwu Pọl banyere mmekọrịta ma ọ bụ ịdị n’ime Mesaịa; “Mesaịa” na-egosipụta Χριστός dịka utu aha.
- source_word: τῷ κυρίῳ ἡμῶν
  choice: Onyenwe anyị
  rationale: Nke a bụ nsụgharị Igbo a na-ejikarị eme κύριος yana nnọchiaha ἡμῶν.
theological_decisions:
- issue: Ịsụgharị Χριστῷ dịka utu aha ma ọ bụ dịka akụkụ aha
  choice: Mesaịa Jizọs
  alternative: Kraịst Jizọs
  rationale: Χριστός ka nwere ike ya dịka utu aha n’okwu Pọl; e debere ụdị ọdịnala n’ala peeji.
- issue: Onye nwe καύχησις na ihe ὑμετέραν na-ezo aka na ya
  choice: Nganga Pọl ji ndị Kọrịnt eme
  alternative: Nganga ndị Kọrịnt n’onwe ha, ma ọ bụ “nganga unu”
  rationale: Nkebiokwu ἣν ἔχω, “nke m nwere,” na-akwado nghọta na nganga ahụ bụ nke Pọl banyere ha. Ma n’ihi na usoro okwu Grik nwere ike ịpụta ihe ọzọ, e debere mgbagwoju anya ahụ n’ala peeji.
- issue: Ike iyi dị na νὴ
  choice: Iji nganga ahụ aṅụ iyi na okwu ahụ bụ eziokwu
  alternative: “Dị nnọọ ka nganga ahụ … si bụrụ eziokwu”
  rationale: Nhọrọ bụ isi na-eme ka ọrụ νὴ dịka okwu iyi pụta ìhè n’Igbo, ebe ala peeji na-edobe usoro ọzọ nwere ike ịkọwa Grik ahụ.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. “Ana m anwụ kwa ụbọchị” na-edobe ike okwu Pọl; usoro “ana m eji … aṅụ iyi” na-eme ka ọrụ νὴ doo anya n’Igbo na-enweghị ime ka okwu banyere nganga ghọọ nkuzi otu ụka.
