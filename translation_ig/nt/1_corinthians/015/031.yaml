revisions:
- from: Ana m anwụ kwa ụbọchị—ana m eji nganga ahụ m ji unu eme n’ime Mesaịa Jizọs Onyenwe anyị aṅụ iyi na nke a bụ eziokwu.[a][b][c]
  to: Ana m anwụ kwa ụbọchị[a]—ana m eji ịnya isi m ji unu eme, nke m nwere n’ime Mesaịa Jizọs[c], Onyenwe anyị, aṅụ iyi.[b]
  rationale: The revision removes an unstated explanatory clause, states Paul’s relative clause clearly, uses a more idiomatic Standard Igbo expression for boasting in the Corinthians, and relocates note anchors to the words they explain. It retains the source’s oath-like ambiguity and does not decide between all possible construals of ὑμετέραν καύχησιν beyond the main reading supported by the relative clause.
