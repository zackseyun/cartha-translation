review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves both sequential markers (ἔπειτα, εἶτα), the appearance to James, and the unrestricted phrase “all the apostles.” However, repeating “ọ pụtara n’ihu” is less idiomatic and can suggest appearing physically before someone rather than the conventional resurrection-appearance sense. The revision uses “pụtara ìhè nye,” which naturally expresses an appearance to a person while retaining the source’s sequence and scope.
  naturalness: “Pụtara ìhè nye” is clearer and more natural Standard Igbo in this context than “pụtara n’ihu.” Omitting the repeated verb in the second clause follows the Greek ellipsis and produces a smoother sentence.
  terminology: “Jemis” and “ndị ozi niile” are retained. “Ndị ozi” is established church-register terminology for ἀπόστολοι and does not improperly identify this group with the Twelve.
  issues:
  - severity: medium
    issue: The expression “ọ pụtara n’ihu” is not the best idiomatic rendering of ὤφθη here.
    rationale: It can be read spatially (“appeared before”) and is less natural than an Igbo expression specifically conveying that he became visible/appeared to the witnesses.
  - severity: low
    issue: The footnote’s wording “n’ụzọ dabara kpọmkwem” is awkward, and its purportedly literal wording shifts to an active construction without clearly signaling the Greek passive.
    rationale: A revised note should use natural Igbo and explicitly preserve the passive sense as closely as Igbo permits.
  revised_text: Mgbe nke ahụ gasịrị, ọ pụtara ìhè nye Jemis[a]; emesịa, nye ndị ozi niile.
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, n'ụzọ nkịtị karị, “a hụrụ ya n’anya Jemis ... n’anya ndị ozi niile.”
    reason: lexical_alternative
  revision_rationale: The revision renders ὤφθη with the natural resurrection-appearance expression “pụtara ìhè nye,” preserves the two-step temporal sequence, and keeps πᾶσιν ἀποστόλοις broad and untranslated by interpretive expansion. The footnote retains the Greek passive alternative in a more natural form.
