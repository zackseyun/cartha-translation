  yaml_path: translation/nt/1_corinthians/015/007.yaml
  text: Then he appeared to James[a], then to all the apostles.
translation:
  language: ig
  text: Mgbe nke ahụ gasịrị, ọ pụtara ìhè nye Jemis[a]; emesịa, nye ndị ozi niile.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n'ụzọ nkịtị karị, “a hụrụ ya n’anya Jemis ... n’anya ndị ozi niile.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔπειτα
  choice: Mgbe nke ahụ gasịrị
  rationale: Ọ bụ okwu na-egosi ihe sochiri nke gara aga n’usoro; nsụgharị a bụ Igbo nkịtị ma doo anya.
- source_word: ὤφθη
  choice: ọ pụtara n’ihu
  rationale: Ọ bụ aorist passive nke ὁράω, nke a na-eji n’ụzọ pụrụ iche ekwu maka ngosipụta mgbe mbilite n’ọnwụ; ‘ọ pụtara n’ihu’ na-enye echiche ahụ n’Igbo doro anya, ebe e debere nsụgharị nkịtị karị na nkọwa ala peeji.
- source_word: Ἰακώβῳ
  choice: n’ihu Jemis
  rationale: Dative a na-egosi onye ọ pụtara n’ihu; ‘Jemis’ bụ ụdị aha a maara nke ọma n’Igbo.
- source_word: εἶτα
  choice: emesịa
  rationale: Ọ na-egosi nzọụkwụ ọzọ n’usoro ihe ndị Pọl depụtara, na-enweghị ime ka ọ dị ka ogologo oge gafere.
- source_word: ἀποστόλοις
  choice: ndị ozi
  rationale: N’ebe a, okwu ahụ na-ekwu maka ndị e nyere ọrụ ma bụrụ ndị akaebe; ‘ndị ozi’ bụ okwu Igbo a na-eji eme ihe maka ndịozi Kraịst.
- source_word: πᾶσιν
  choice: niile
  rationale: Ọ na-emesi izu oke nke ìgwè ndị ozi ahụ ike ma ghara ịkọwa ndị kpọmkwem so na ya.
theological_decisions:
- issue: Onye Jemis bụ na ókè ndị a kpọrọ ‘ndị ozi niile’ ruru
  choice: E debere ya dị ka ‘Jemis’ na ‘ndị ozi niile’ n’enweghị ịkọwa ma ọ bụ ime ka ìgwè ahụ bụrụ naanị Ndịozi Iri na Abụọ.
  alternative: Ịsụgharị ya dị ka Ndịozi Iri na Abụọ kpọmkwem, ma ọ bụ ịkọwa ndị ozi ahụ dị ka ìgwè sara mbara nke ndị e zigara ozi.
  rationale: Ederede Grik akọwaghị kpọmkwem ndị so n’ìgwè a, ọ naghịkwa kọwaa Jemis ọzọ. Ya mere, nsụgharị ahụ na-ahapụ nghọta na esemokwu dị n’ederede ka ọ dị.
translation_notes:
  register: Standard Igbo nke oge a, dị mfe nghọta ma nwee ugwu kwesịrị Akwụkwọ Nsọ. E ji ‘pụtara n’ihu’ mee ka ngosipụta ahụ doo anya, ebe nkọwa ala peeji na-echekwa usoro passive nke Grik.
