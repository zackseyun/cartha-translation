revisions:
- from: Mgbe nke ahụ gasịrị, ọ pụtara n’ihu Jemis[a], emesịa ọ pụtara n’ihu ndị ozi niile.
  to: Mgbe nke ahụ gasịrị, ọ pụtara ìhè nye Jemis[a]; emesịa, nye ndị ozi niile.
  rationale: The revision renders ὤφθη with the natural resurrection-appearance expression “pụtara ìhè nye,” preserves the two-step temporal sequence, and keeps πᾶσιν ἀποστόλοις broad and untranslated by interpretive expansion. The footnote retains the Greek passive alternative in a more natural form.
  reviewer_model: gpt-5.6-terra
