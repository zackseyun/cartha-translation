revisions:
- from: N’ihi na ahụ a nke na-emebi emebi aghaghị iyikwasị ọnọdụ nke na-apụghị imebi emebi,[a] ahụ a nke na-anwụ anwụ aghaghịkwa iyikwasị anwụghị anwụ.
  to: N’ihi na ahụ a pụrụ ire ure aghaghị iyikwasị enweghị ire ure,[a] ahụ a na-anwụ anwụ aghaghịkwa iyikwasị anwụghị anwụ.
  rationale: Mgbanwe a na-echekwa ihe Pọl ji okwu abụọ yiri ibe ha eme, tinyere ihe atụ nke iyikwasị. “Pụrụ ire ure” na “enweghị ire ure” na-enye ọdịiche doro anya n’etiti φθαρτόν na ἀφθαρσία, n’enweghị ịgbakwunye nkọwa sara mbara nke “ọnọdụ.” A debere “ahụ” n’ahịrịokwu abụọ ahụ maka nghọta, ebe nkọwa ala peeji na-egosi na Grik ji nkọwa e ji mee aha, ọ bụghị okwu “ahụ,” n’amaokwu a.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T19:24:29Z'
review_pass:
  verdict: revise
  source_fidelity: 'The draft correctly conveys the explanatory γάρ, the necessity of δεῖ, the parallel clauses, and the clothing metaphor of ἐνδύσασθαι. Supplying “ahụ” is defensible from the immediate resurrection context and is appropriately disclosed in the note. However, “ọnọdụ nke na-apụghị imebi emebi” weakens and over-expands ἀφθαρσία: it can suggest a general state of being undamaged rather than freedom from decay/perishability.'
  naturalness: The syntax and parallelism are generally clear, but “ọtụtụ ọnọdụ nke na-apụghị imebi emebi” is cumbersome in this context. “Enweghị ire ure” is a more natural, established Standard Igbo expression for incorruptibility/imperishability and preserves the lexical contrast with “pụrụ ire ure.”
  terminology: Revise φθαρτόν/ἀφθαρσία to the decay-oriented pair “pụrụ ire ure” / “enweghị ire ure.” Retain “anwụ anwụ” / “anwụghị anwụ” for θνητόν/ἀθανασία and “iyikwasị” for the clothing image.
  issues:
  - severity: medium
    issue: The rendering of ἀφθαρσία as “ọnọdụ nke na-apụghị imebi emebi” is semantically diffuse and stylistically heavy.
    rationale: ἀφθαρσία denotes imperishability/incorruptibility, in deliberate contrast to φθαρτόν. The proposed wording emphasizes being undamaged and adds an abstract explanatory noun not present in the Greek. “Enweghị ire ure” more directly expresses freedom from decay and keeps the intended contrast.
  - severity: low
    issue: “na-emebi emebi” does not mark decay/perishability as precisely as the Greek contrast requires.
    rationale: While understandable, it can refer broadly to damage. “pụrụ ire ure” idiomatically identifies what is subject to decay, matching φθαρτόν and pairing naturally with “enweghị ire ure.”}],
