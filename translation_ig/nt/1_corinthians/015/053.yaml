  text: δεῖ γὰρ τὸ φθαρτὸν τοῦτο ἐνδύσασθαι ἀφθαρσίαν καὶ τὸ θνητὸν τοῦτο ἐνδύσασθαι ἀθανασίαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/053.yaml
  text: For this perishable body must put on imperishability[a], and this mortal body must put on immortality.
translation:
  language: ig
  text: N’ihi na ahụ a pụrụ ire ure aghaghị iyikwasị enweghị ire ure,[a] ahụ a na-anwụ anwụ aghaghịkwa iyikwasị anwụghị anwụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ, n’ụzọ na-esochi usoro Grik nke ọma karị: “ihe a pụrụ ire ure aghaghị iyikwasị enweghị ire ure, ihe a na-anwụ anwụ aghaghịkwa iyikwasị anwụghị anwụ.” Okwu Grik ekwughị “ahụ” kpọmkwem n’amaokwu a, ọ bụ ezie na ihe ndị gbara ya gburugburu na-eme ka o doo anya na ọ na-ekwu banyere ahụ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δεῖ
  choice: aghaghị
  rationale: Na-egosi na mgbanwe a dị mkpa ma bụrụ ihe na-aghaghị ime, dịka okwu Pọl si dị.
- source_word: γὰρ
  choice: N’ihi na
  rationale: Na-ejikọta amaokwu a na nkọwa dị n’amaokwu bu ya ụzọ.
- source_word: τὸ φθαρτὸν τοῦτο
  choice: ahụ a nke na-emebi emebi
  rationale: Okwu Grik ahụ bụ nkọwa e ji mee aha, ma gburugburu okwu banyere mbilite n’ọnwụ na-eme ka o doo anya na ọ na-ezo aka n’ahụ; ịgbakwunye ‘ahụ’ na-eme ka Igbo bụrụ nke doro anya ma dịkwa eke.
- source_word: ἐνδύσασθαι
  choice: iyikwasị
  rationale: Na-echekwa ihe atụ nke iyikwasị uwe dị n’okwu Grik.
- source_word: ἀφθαρσίαν
  choice: ọnọdụ nke na-apụghị imebi emebi
  rationale: Na-egosipụta ọdịiche ya na ihe ‘na-emebi emebi’ n’Igbo doro anya, n’enweghị ime ka ọ bụrụ naanị enweghị mmebi omume.
- source_word: καὶ
  choice: -kwa
  rationale: Mgbakwunye ‘kwa’ jikọtara ahịrịokwu abụọ yiri ibe ha n’ụzọ Igbo si ada nke ọma.
- source_word: τὸ θνητὸν τοῦτο
  choice: ahụ a nke na-anwụ anwụ
  rationale: Na-egosi ihe nke ọnwụ na-achị; ‘ahụ’ sitere na gburugburu okwu, ọ bụghị n’okwu pụtara ìhè n’amaokwu a.
- source_word: ἀθανασίαν
  choice: anwụghị anwụ
  rationale: Ọ bụ okwu Igbo a na-aghọta nke ọma maka ọnọdụ nke ọnwụ na-enweghịzi ike imeri.
theological_decisions:
- issue: Ịgbakwunye ‘ahụ’ n’ahịrịokwu abụọ ahụ ebe σώμα na-adịghị n’amaokwu Grik a
  choice: E tinyere ‘ahụ’ iji kọwaa ihe nkọwa ndị ahụ na-ezo aka na ya.
  alternative: “ihe a na-emebi emebi ... ihe a na-anwụ anwụ” ma ọ bụ naanị “nke a na-emebi emebi ... nke a na-anwụ anwụ.”
  rationale: Amaokwu ndị gbara ya gburugburu na-ekwu kpọmkwem banyere mbilite n’ọnwụ na mgbanwe nke ahụ. Nke a na-eme ka ebe okwu ahụ na-ezo anya doo anya n’enweghị ịgbakwunye ozizi ọhụrụ; e debekwara ụdị Grik kpọmkwem na nkọwa ala peeji.
- issue: Ihe atụ nke iyikwasị uwe
  choice: E jigidere ‘iyikwasị’ kama ịkọwa ya nanị dị ka ‘ịghọ.’
  alternative: ịghọ ihe na-apụghị imebi emebi / ịghọ onye na-anaghị anwụ anwụ
  rationale: Okwu Grik na-eji ihe atụ uwe eme ka mgbanwe ahụ pụta ìhè; idebe ya na-echekwa ike na esemokwu nke ihe atụ Pọl.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke oge a ma dị ugwu. E jigidere nhazi yiri ibe ya na ihe atụ nke iyikwasị uwe; ‘ọnọdụ nke’ na-enyere aka ime ka aha echiche ἀφθαρσία doo anya n’Igbo.
