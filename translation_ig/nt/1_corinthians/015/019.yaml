  text: εἰ ἐν τῇ ζωῇ ταύτῃ ⸂ἐν Χριστῷ ἠλπικότες ἐσμὲν⸃ μόνον, ἐλεεινότεροι πάντων ἀνθρώπων ἐσμέν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/019.yaml
  text: If we have hoped in Messiah for this life only[c][b][a], we are more pitiable than all people.
translation:
  language: ig
  text: Ọ bụrụ na ọ bụ naanị ná ndụ a ka anyị nwere olileanya n’ime Mezaịa[c][a], anyị bụ ndị e kwesịrị imere ebere karịa mmadụ niile.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’ime Kraịst.” Okwu Grik Χριστός bụ aha a pụrụ ịsụgharị “Kraịst” ma ọ bụ “Mezaịa”; e ji “Mezaịa” mee ka ihe aha ahụ pụtara pụta ìhè.
    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ, “anyị bụ ndị mmadụ niile kwesịrị imere ebere kachasị.” Ụdị ntụnyere Grik a pụkwara ịpụta n’Igbo dịka okwu na-egosi ndị kacha kwesị ebere.
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “Ọ bụrụ na anyị nwere olileanya n’ime Mezaịa naanị ná ndụ a.”
    reason: alternative_word_order
lexical_decisions:
- source_word: εἰ
  choice: Ọ bụrụ na
  rationale: Ọ na-ewebata ọnọdụ a na-atụle, dị ka o si dị n’asụsụ Grik.
- source_word: ἐν τῇ ζωῇ ταύτῃ
  choice: maka ndụ a
  rationale: N’usoro okwu Igbo a, nke a na-egosi nke ọma na olileanya ahụ metụtara naanị ndụ mmadụ na-ebi ugbu a.
- source_word: ἐν Χριστῷ
  choice: n’ime Mezaịa
  rationale: ‘N’ime’ na-edobe okwu Pọl nke nwere mkpa pụrụ iche, ebe ‘Mezaịa’ na-egosipụta Χριστός dịka utu aha, ọ bụghị naanị dịka aha mmadụ.
- source_word: ἠλπικότες ἐσμὲν
  choice: olileanya anyị nwere
  rationale: Nhazi a bụ Igbo dị mfe ma na-egosi olileanya e tinyere kemgbe nke ka dị ruo ugbu a.
- source_word: μόνον
  choice: naanị
  rationale: E debere ya n’akụkụ ‘maka ndụ a’ ka o doo anya na ihe a na-amachi bụ oke ndụ olileanya ahụ metụtara.
- source_word: ἐλεεινότεροι
  choice: anyị kwesịrị ka e meere anyị ebere karịa
  rationale: 'Nke a na-egosipụta ntụnyere Grik: ndị dị otú ahụ kwesịrị ebere karịa ndị ọzọ, ọ bụghị nanị na ha nọ ná mwute.'
- source_word: πάντων ἀνθρώπων
  choice: mmadụ niile
  rationale: ἄνθρωποι na-ekwu maka mmadụ niile n’ozuzu, ọ bụghị naanị ụmụ nwoke.
theological_decisions:
- issue: Nsụgharị Χριστῷ n’okwu Pọl ἐν Χριστῷ
  choice: n’ime Mezaịa
  alternative: n’ime Kraịst
  rationale: A họọrọ ‘Mezaịa’ iji chekwaa ihe utu aha Χριστός pụtara, ma a hapụrụ ‘n’ime’ iji ghara iwepụ ịdị omimi nke okwu Pọl.
- issue: Oke olileanya a na-ekwu maka ya
  choice: olileanya ahụ bụ naanị maka ndụ a
  alternative: ọ bụ naanị ná ndụ a ka anyị nwere olileanya n’ime Mezaịa
  rationale: Isi okwu bụ ọnọdụ nke olileanya n’ime Mezaịa ga-ejedebe naanị na ndụ ugbu a. Nsụgharị ahụ anaghị agbakwụnye nkọwa ozizi karịrị ihe amaokwu ahụ kwuru.
- issue: Ike ntụnyere ἐλεεινότεροι
  choice: kwesịrị ka e meere anyị ebere karịa mmadụ niile
  alternative: anyị bụ ndị mmadụ niile kwesịrị imere ebere kachasị
  rationale: A chekwara ụdị ntụnyere dị na Grik, ebe ihe ọzọ nwere ike ikwupụta ya dịka ihe kachasị elu n’Igbo.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. Nhazi ahịrịokwu ahụ bụ nke sitere n’okwu nkịtị nke Igbo, ma okwu ‘n’ime Mezaịa’ na-echekwa usoro Pọl na ịdị omimi ya.
