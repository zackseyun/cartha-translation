id: 1CO.15.17
reference: 1 Corinthians 15:17
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἰ δὲ Χριστὸς οὐκ ἐγήγερται, ματαία ἡ πίστις ⸀ὑμῶν, ἔτι ἐστὲ ἐν ταῖς ἁμαρτίαις ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/017.yaml
  text: But if Messiah has not been raised[a], your faith is futile[b]; you are still in your sins.
translation:
  language: ig
  text: Ma ọ bụrụ na a kpọlitebeghị Mesaịa[a] n’ọnwụ, okwukwe unu abaghị uru[b]; unu ka nọ ná mmehie unu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Kraịst.”
    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ, “okwukwe unu bụ ihe efu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Χριστὸς
  choice: Mezaịa
  rationale: E ji ya mee aha ọkwá nke Onye Chineke tere mmanụ n’ebe a; “Mezaịa” na-egosipụta nke ahụ, ebe “Kraịst” bụkwa nsụgharị omenala.
- source_word: οὐκ ἐγήγερται
  choice: a kpọlitebeghị ... n’ọnwụ
  rationale: Okwu a na-edobe echiche nke ihe e mere Mezaịa, na ọdịdị zuru oke nke ngwaa Grik nke na-egosi na ihe omume ahụ nwere ihe ọ pụtara ruo ugbu a; ọ naghị akpọ onye mere ya aha.
- source_word: ματαία
  choice: abaghị uru
  rationale: Nke a na-egosi na okwukwe ahụ agaghị arụpụta ihe ma ọ bụrụ na a kpọliteghị Mezaịa n’ọnwụ, ma bụrụkwa okwu Igbo doro anya nke oge a.
- source_word: πίστις
  choice: okwukwe
  rationale: N’ebe a, ọ bụ nzaghachi nke ndị Kọrịnt n’ikwere ozi ọma, ọ bụghị isi okwu banyere ikwesị ntụkwasị obi ha.
- source_word: ἔτι
  choice: ka nọ
  rationale: Ọ na-egosi na ọnọdụ mmehie ahụ ka na-aga n’ihu ruo ugbu a.
- source_word: ἐν ταῖς ἁμαρτίαις ὑμῶν
  choice: ná mmehie unu
  rationale: A na-edobe ihe oyiyi nke ịnọ n’ọnọdụ mmehie n’enweghị ịgbasa ihe Grik kwuru.
- source_word: δὲ
  choice: Ma
  rationale: Ọ na-egosi ọdịiche dị n’etiti okwu a na arụmụka bu ya ụzọ.
theological_decisions:
- issue: Ụdị okwu mbilite n’ọnwụ na onye mere ya
  choice: a kpọlitebeghị Mezaịa n’ọnwụ
  alternative: Mezaịa esitebeghị n’ọnwụ bilie
  rationale: Nhọrọ mbụ na-edobe ụdị okwu nke na-egosi na e mere Mezaịa ihe ahụ, ma ghara ịkpọ Chineke aha ebe Grik na-akpọghị ya aha.
- issue: Nsụgharị Χριστός
  choice: Mezaịa
  alternative: Kraịst
  rationale: N’ebe a, Χριστός na-arụ ọrụ dị ka aha ọkwá nke Onye e tere mmanụ. E tinyere “Kraịst” n’ala peeji ka a ghara izochi nsụgharị omenala ahụ.
- issue: Ọnọdụ ndị kwere ekwe ma ọ bụrụ na mbilite n’ọnwụ emeghị
  choice: unu ka nọ ná mmehie unu
  alternative: unu ka nọ n’okpuru mmehie unu
  rationale: A hapụrụ okwu ahụ n’ụdị sara mbara nke Grik, n’akọwaghị ma ọ pụtara ikpe ọmụma, ike mmehie, ma ọ bụ ha abụọ.
translation_notes:
  register: Asụsụ Igbo izugbe, nke oge a ma dị nsọ n’ụda ya. E ji “a kpọlitebeghị” mee ka passive Grik bụrụ okwu Igbo na-aga were were, a na-ejikwa akara n’okpuru mkpụrụedemede (n’ọnwụ, ná mmehie) dịka ụkpụrụ odide Igbo.
