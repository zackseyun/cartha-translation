  naturalness: The verse is clear, dignified Standard Igbo. The repeated construction 'ime ka … nọrọ n’okpuru' is natural enough and effectively represents the passive sense and verbal repetition in the Greek.
  terminology: '''Ọkpara,'' ''Chineke,'' and ''ihe niile'' are suitable and consistent. ''Ihe niile n’ime ihe niile'' retains the compressed breadth and ambiguity of πάντα ἐν πᾶσιν without doctrinal expansion.'
  issues:
