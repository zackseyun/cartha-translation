id: 1CO.15.28
reference: 1 Corinthians 15:28
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὅταν δὲ ὑποταγῇ αὐτῷ τὰ πάντα, ⸀τότε αὐτὸς ὁ υἱὸς ὑποταγήσεται τῷ ὑποτάξαντι αὐτῷ τὰ πάντα, ἵνα ᾖ ὁ θεὸς ⸀πάντα ἐν πᾶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/028.yaml
  text: But when all things are subjected to him[a], then the Son himself will also be subjected to the one who subjected all things to him[b], so that God may be all in all.
translation:
  language: ig
  text: Ma mgbe e mere ka ihe niile[a] nọrọ n’okpuru ya, mgbe ahụ, a ga-eme ka Ọkpara ahụ n’onwe ya nọrọ n’okpuru Onye ahụ mere ka ihe niile nọrọ n’okpuru ya, ka Chineke wee bụrụ ihe niile n’ime ihe niile.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “ihe dum.” Grik na-eji “ihe niile” (τὰ πάντα) ugboro ugboro, na-echekwa obosara zuru ụwa ọnụ nke arụmụka Pọl.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsị, “ka Chineke bụrụ ihe niile n’ime mmadụ niile.” Okwu Grik ahụ dị mkpụmkpụ, bụrụkwa “ihe niile n’ime niile” n’ụzọ ọ fọrọ nke nta ka ọ bụrụ kpọmkwem; ọ naghị ekpebi hoo haa ma “niile” nke ikpeazụ ahụ bụ mmadụ niile ka ọ bụ ihe niile.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅταν δὲ
  choice: Ma mgbe
  rationale: “Mgbe” na-egosi oge ihe a ga-eme; “ma” na-ejikọta amaokwu a na arụmụka gara aga ma na-egosi nzọụkwụ ọhụrụ n’usoro ahụ.
- source_word: ὑποταγῇ / ὑποταγήσεται / ὑποτάξαντι
  choice: e mere ka … nọrọ n’okpuru / a ga-eme ka … nọrọ n’okpuru / Onye ahụ mere ka … nọrọ n’okpuru
  rationale: Usoro a bụ Igbo doro anya nke na-echekwa echiche ugboro ugboro nke ὑποτάσσω, tinyere ọdịdị nnara nke ngwaa abụọ mbụ, n’ebughị nkọwa ozizi ọzọ bata.
- source_word: αὐτῷ
  choice: ya
  rationale: N’ọnọdụ amaokwu a, nnọchiaha ahụ na-ezo aka n’Ọkpara; “ya” na-echekwa ntụziaka nke ido ihe niile n’okpuru ya.
- source_word: τὰ πάντα
  choice: ihe niile
  rationale: Nke a na-echekwa mkpokọta na obosara eluigwe na ụwa nke okwu Pọl, ma na-emegharị otu okwu ahụ ugboro abụọ dịka Grik si mee.
- source_word: τότε
  choice: mgbe ahụ
  rationale: Nke a na-egosi ihe ga-esote mgbe e mesịrị n’usoro ihe Pọl na-akọ.
- source_word: αὐτὸς ὁ υἱὸς
  choice: Ọkpara ahụ n’onwe ya
  rationale: “N’onwe ya” na-egosipụta nkwusi ike dị na αὐτός, ebe “Ọkpara ahụ” na-eme ka onye a na-ekwu banyere ya doo anya.
- source_word: τῷ ὑποτάξαντι
  choice: Onye ahụ mere ka
  rationale: Nke a na-asụgharị participle nwere article dịka onye a kpọrọ aha site n’ihe o mere, n’ajụghị onye ahụ bụ n’ime ahịrịokwu ahụ.
- source_word: ἵνα ᾖ
  choice: ka … wee bụrụ
  rationale: Usoro Igbo a na-egosipụta ebumnuche ma ọ bụ ihe ga-esi na ya pụta, dịka ἵνα tinyere subjunctive si arụ ọrụ.
- source_word: ὁ θεὸς
  choice: Chineke
  rationale: Nke a bụ nsụgharị kpọmkwem ma kwekọọ n’asụsụ Igbo a na-eji eme ihe ugbu a.
- source_word: πάντα ἐν πᾶσιν
  choice: ihe niile n’ime ihe niile
  rationale: Nkebi okwu Grik a dị mkpụmkpụ ma nwee ike ịpụta ihe karịrị otu ụzọ. Nsụgharị a na-echekwa ọdịdị ya na obosara ya kama ikpebi na πᾶσιν bụ naanị mmadụ niile.
theological_decisions:
- issue: Ido Ọkpara ahụ n’okpuru Onye mere ka ihe niile nọrọ n’okpuru ya
  choice: E kwuru ya n’ụzọ kwụ ọtọ dịka Ọkpara ahụ ga-anọ n’okpuru Onye ahụ, na-enweghị ịgbakwunye nkọwa gbasara ụdị ịdị-n’okpuru ahụ.
  alternative: Ịgbasa ya ka ọ kwuo na nke a bụ naanị ido onwe n’okpuru n’ọrụ, ma ọ bụ ime ka okwu ahụ dị nro iji zere echiche ido n’okpuru.
  rationale: Grik na-ekwu hoo haa banyere ido Ọkpara ahụ n’okpuru n’ọdịnihu. Nsụgharị ahụ kwesịrị ichekwa esemokwu ozizi dị n’ederede n’onwe ya, n’ekwughị na Ọkpara dị ala n’ụdị ịdị adị ma ọ bụ tinye nkọwa okwukwe e dere mgbe e mesịrị.
- issue: Obosara τὰ πάντα na nghọta πάντα ἐν πᾶσιν
  choice: Jiri “ihe niile” ugboro ugboro, tinyere “ihe niile n’ime ihe niile” na njedebe.
  alternative: “Ihe niile n’ime mmadụ niile.”
  rationale: Okwu Grik na-echekwa obosara zuru ụwa ọnụ ma hapụ πᾶσιν ka ọ ghara ịbụ naanị ndị mmadụ. Ya mere, isi ederede ekwesịghị imechi ihe okwu ahụ nwere ike ịpụta.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “Ime ka … nọrọ n’okpuru” bụ ahịrịokwu eke karịa ịmepụta passive na-adịghị atọ ụtọ n’Igbo, ma ọ ka na-echekwa usoro na nkwughachi nke ngwaa Grik. A naghị etinye “kwa” n’ahịrịokwu nke Ọkpara ahụ, n’ihi na mbipụta Grik e nyere enweghị καί n’ebe ahụ.
