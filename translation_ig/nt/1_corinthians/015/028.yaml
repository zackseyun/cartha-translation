    issue: Footnote a says Paul's wording concerns 'ihe niile e kere eke' ('all created things').
    rationale: τὰ πάντα is comprehensive, but the phrase itself does not explicitly say 'created things.' The note should retain the source/audit trail's cosmic breadth without adding that specification.
