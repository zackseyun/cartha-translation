id: 1CO.15.15
reference: 1 Corinthians 15:15
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εὑρισκόμεθα δὲ καὶ ψευδομάρτυρες τοῦ θεοῦ, ὅτι ἐμαρτυρήσαμεν κατὰ τοῦ θεοῦ ὅτι ἤγειρεν τὸν Χριστόν, ὃν οὐκ ἤγειρεν εἴπερ ἄρα νεκροὶ οὐκ ἐγείρονται.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/015.yaml
  text: Then we are even found to be false witnesses about God[a], because we testified about God that he raised the Messiah[b], whom he did not raise if in fact the dead are not raised.
translation:
  language: ig
  text: Mgbe ahụ, a na-ahụtakwa anyị dị ka ndị akaebe ụgha banyere Chineke[a], n’ihi na anyị gbara akaebe megide Chineke, na ọ kpọlitere Mesaịa ahụ[b] n’ọnwụ—onye ọ kpọliteghị ma ọ bụrụ n’ezie na a dịghị akpọlite ndị nwụrụ anwụ n’ọnwụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ndị akaebe ụgha nke Chineke.” Usoro genitive Grik ahụ nwere ike ịkọwa akaebe ụgha metụtara Chineke; okwu na-esochi ya, “megide Chineke,” na-akwado nghọta siri ike karị.
    reason: lexical_alternative
  - marker: b
    text: N’asụsụ Grik, “Kraịst.” N’ebe a, a sụgharịrị ya “Mesaịa” n’ihi na Χριστός na-arụ ọrụ dịka aha-ọrụ.
    reason: alternative_reading
lexical_decisions:
- source_word: εὑρισκόμεθα δὲ καὶ
  choice: Mgbe ahụ, a na-ahụtakwa na anyị bụ
  rationale: “Mgbe ahụ” na-egosi nkwubi okwu Pọl na-ewepụta, ebe “-kwa” na-echekwa ike mgbakwunye nke καὶ. Usoro “a na-ahụta na anyị bụ” na-egosi ọnọdụ a na-achọpụta na ọ bụ eziokwu, dịka present passive si dị.
- source_word: ψευδομάρτυρες τοῦ θεοῦ
  choice: ndị akaebe ụgha banyere Chineke
  rationale: “Ndị akaebe ụgha” bụ ntụgharị doro anya nke ψευδομάρτυρες. “Banyere Chineke” na-ewere genitive ahụ dịka ihe akaebe ahụ metụtara, ma ihe odide ala peeji na-echekwa ọdịdị na nghọta ọzọ o nwere ike inwe.
- source_word: ἐμαρτυρήσαμεν κατὰ τοῦ θεοῦ
  choice: anyị gbara akaebe megide Chineke
  rationale: κατά ya na genitive na-apụtakarị “megide.” N’echiche arụmụka a, ọ bụrụ na Chineke emeghị ihe ndị ozi kwuru, akaebe ha ga-abụ ihe megidere Chineke. A naghị eme ka ike okwu a dị nro.
- source_word: ἤγειρεν τὸν Χριστόν
  choice: ọ kpọlitere Mesaịa ahụ n’ọnwụ
  rationale: ἐγείρω n’ebe a na-ekwu maka mbilite n’ọnwụ, ya mere “kpọlitere ... n’ọnwụ” bụ Igbo doro anya. Χριστός nwere ike aha-ọrụ ebe a, ya mere a sụgharịrị ya “Mesaịa ahụ.”
- source_word: ὃν οὐκ ἤγειρεν
  choice: onye ọ na-akpọliteghị
  rationale: E chekwara relative clause na nkwughachi ngwaa ahụ maka ike arụmụka Pọl.
- source_word: εἴπερ ἄρα νεκροὶ οὐκ ἐγείρονται
  choice: ma ọ bụrụ n’ezie na a dịghị akpọlite ndị nwụrụ anwụ n’ọnwụ
  rationale: “Ma ọ bụrụ n’ezie” na-egosi premise e ji arụ ụka; passive “a dịghị akpọlite” na-echekwa na ndị nwụrụ anwụ bụ ndị a na-eme ihe ahụ n’ahụ ha.
theological_decisions:
- issue: Ntụgharị Χριστός
  choice: Mesaịa ahụ
  alternative: Kraịst ahụ
  rationale: Article na arụmụka gbasara mbilite n’ọnwụ na-akwado nghọta ya dịka aha-ọrụ, ọ bụghị naanị aha mmadụ; “Mesaịa” na-eme ka aha-ọrụ ahụ pụta ìhè.
- issue: Ike κατὰ τοῦ θεοῦ
  choice: megide Chineke
  alternative: banyere Chineke
  rationale: 'κατά ya na genitive na-akwado “megide,” nke na-echekwa ịdị arọ nke okwu Pọl: ọ bụrụ na Chineke akpọliteghị Mesaịa ahụ, ndị ozi etinyela Chineke n’akaebe ụgha ha. N’agbanyeghị nke ahụ, e nwere ike ịghọta ya dịka akaebe gbasara Chineke, ya mere a na-ekweta ụzọ ahụ dịka ihe ọzọ.'
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “Ịkpọlite ... n’ọnwụ” na-eme ka okwu mbilite n’ọnwụ doo anya, ebe passive voice na usoro arụmụka nke amaokwu Grik ka echekwara.
