revisions:
- from: Mgbe ahụ, a na-ahụtakwa na anyị bụ ndị akaebe ụgha banyere Chineke[a], n’ihi na anyị gbara akaebe megide Chineke na ọ kpọlitere Mesaịa ahụ[b] n’ọnwụ—onye ọ na-akpọliteghị ma ọ bụrụ n’ezie na a dịghị akpọlite ndị nwụrụ anwụ n’ọnwụ.
  to: Mgbe ahụ, a na-ahụtakwa anyị dị ka ndị akaebe ụgha banyere Chineke[a], n’ihi na anyị gbara akaebe megide Chineke, na ọ kpọlitere Mesaịa ahụ[b] n’ọnwụ—onye ọ kpọliteghị ma ọ bụrụ n’ezie na a dịghị akpọlite ndị nwụrụ anwụ n’ọnwụ.
  rationale: The revision corrects the only substantive fidelity issue by matching the aorist “he did not raise” with “onye ọ kpọliteghị.” It also improves the idiomatic flow of the opening without changing its passive/resultative sense. The translation continues to distinguish the first genitive (“banyere Chineke”) from κατά with the genitive (“megide Chineke”), preserving the Greek syntax and Paul’s argumentative severity without resolving the lexical ambiguity beyond what the text supports.
