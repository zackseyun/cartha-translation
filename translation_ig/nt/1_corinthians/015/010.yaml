id: 1CO.15.10
reference: 1 Corinthians 15:10
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: χάριτι δὲ θεοῦ εἰμι ὅ εἰμι, καὶ ἡ χάρις αὐτοῦ ἡ εἰς ἐμὲ οὐ κενὴ ἐγενήθη, ἀλλὰ περισσότερον αὐτῶν πάντων ἐκοπίασα, οὐκ ἐγὼ δὲ ἀλλὰ ἡ χάρις τοῦ θεοῦ ⸀ἡ σὺν ἐμοί.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/010.yaml
  text: But by the grace of God I am what I am[a], and his grace toward me did not prove empty. On the contrary, I labored more than all of them—yet not I, but the grace of God that was with me.
translation:
  language: ig
  text: Ma site n’amara Chineke ka m bụ ihe m bụ; amara ya e mere m abụghị ihe efu. Kama, arụwo m ọrụ ike karịa ha niile; ma ọ bụghị m, kama ọ bụ amara Chineke nke nọnyere m.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χάριτι δὲ θεοῦ
  choice: Ma ọ bụ site n’amara Chineke
  rationale: “Site n’” na-egosi na amara Chineke bụ ihe mere ọnọdụ Pọl ji dị otu a; “Ma” na-echekwa obere ntụgharị δέ n’ihe gbara amaokwu ahụ gburugburu.
- source_word: εἰμι ὅ εἰμι
  choice: ka m ji bụrụ ihe m bụ
  rationale: Nke a na-echekwa nkwughachi okwu Grik ma na-ada ka Igbo ebumpụta ụwa, na-ekwu banyere ọnọdụ na njirimara Pọl ugbu a.
- source_word: ἡ χάρις αὐτοῦ ἡ εἰς ἐμὲ
  choice: amara ya n’ebe m nọ
  rationale: Nkebi a na-echekwa echiche nke amara e duziri n’ebe Pọl nọ, n’asụsụ Igbo doro anya.
- source_word: οὐ κενὴ ἐγενήθη
  choice: abụghịkwa ihe efu
  rationale: “Ihe efu” na-echekwa ihe atụ κενός ma na-ekwukwa na amara ahụ enweghịghị mkpụrụ ma ọ bụ nsonaazụ.
- source_word: ἀλλὰ περισσότερον αὐτῶν πάντων ἐκοπίασα
  choice: Kama, arụsịrị m ọrụ ike karịa ha niile
  rationale: “Arụsịrị m ọrụ ike” na-egosi ndọgbu na mgbalị dị na κοπιάω; “karịa ha niile” na-echekwa ntụnyere ahụ n’enweghị ịkọwapụta ndị “ha” karịa ka isi mmalite mere.
- source_word: οὐκ ἐγὼ δὲ ἀλλὰ ἡ χάρις τοῦ θεοῦ
  choice: ma ọ bụghị m, kama ọ bụ amara Chineke
  rationale: 'Nke a na-echekwa nkwupụta abụọ ahụ n’otu oge: Pọl rụrụ ọrụ n’ezie, ma ọ sịrị na ike na ịdị irè ya sitere n’amara Chineke.'
- source_word: ἡ σὺν ἐμοί
  choice: nke nọnyere m
  rationale: “Nọnyere m” na-egosipụta σύν na dative dịka amara Chineke nọ Pọl nso ma na-arụ ọrụ n’ime ọrụ ya.
theological_decisions:
- issue: Mmekọrịta dị n’etiti ọrụ Pọl na amara Chineke
  choice: E chekwara ma ezi ọrụ Pọl rụrụ ma ịdị irè nke amara Chineke, n’agbanyeghị esemokwu okwu dị n’etiti ha.
  alternative: Ịsụgharị ya ka ọ pụta ìhè na Chineke na Pọl bụ ndị mmekọ hà nhata, ma ọ bụ ka ọrụ Pọl yie ihe na-adịghị adị.
  rationale: Grik ahụ kwuru kpọmkwem na Pọl “rụsịrị ọrụ ike karịa,” ma mesịa kwuo “ọ bụghị m, kama ọ bụ amara Chineke.” Nsụgharị ahụ ekwesịghị idozi esemokwu a site n’itinye usoro nkà mmụta okpukpe e mesịrị.
translation_notes:
  register: Igbo Izugbe dị ugbu a, nke dị ùgwù ma dị mfe nghọta. E jigidere okwu bụ “amara” dịka okwu Pọl dị mkpa, ma jiri “arụsịrị m ọrụ ike” gosi ndọgbu dị na ngwaa Grik.
