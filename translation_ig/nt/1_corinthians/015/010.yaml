review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves Paul’s contrast between his real labor and God’s grace, and its final clause reflects the σύν (“with”) phrase well. However, the opening “Ma ọ bụ” means “or,” not the mild adversative δέ (“but/now”), and “amara ya n’ebe m nọ” is less precise and can sound locative rather than grace directed toward Paul.
  naturalness: 'The proposed revision uses idiomatic Standard Igbo: “Ma site n’amara Chineke” correctly opens the contrast, “amara ya e mere m” naturally conveys grace shown/directed to Paul, and “arụwo m ọrụ ike” clearly expresses strenuous labor. Semicolons keep the two Greek contrasts intelligible without adding interpretation.'
  terminology: “Amara” appropriately retains the central Pauline term χάρις. “Ihe efu” and “abaghị uru” convey κενός as empty/ineffective without importing doctrinal explanation. The revised footnote removes “ihe na-enweghị isi,” which means nonsensical and is not a suitable lexical alternative here.
  issues:
  - severity: high
    issue: “Ma ọ bụ” at the beginning translates as “or.”
    rationale: δέ is a mild connective/contrast in this context, not a disjunction. “Ma site n’amara Chineke” preserves the intended sense.
  - severity: medium
    issue: “amara ya n’ebe m nọ” is ambiguous as a location-based expression.
    rationale: ἡ εἰς ἐμὲ specifies grace directed toward Paul. “amara ya e mere m” naturally expresses grace shown to him.
  - severity: medium
    issue: The footnote alternative “abụghị ihe na-enweghị isi” does not match κενός in context.
    rationale: κενός here means empty, futile, or without effect/result, not irrational or meaningless.
  revised_text: Ma site n’amara Chineke ka m bụ ihe m bụ; amara ya e mere m abụghị ihe efu. Kama, arụwo m ọrụ ike karịa ha niile; ma ọ bụghị m, kama ọ bụ amara Chineke nke nọnyere m.
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “aghọghị ihe efu,” ma ọ bụ, “abaghị uru.”
    reason: lexical_alternative
  revision_rationale: 'The revision corrects the opening connective, makes the directional force of εἰς ἐμέ explicit in natural Igbo, and replaces an unsuitable footnote alternative. It retains the source’s deliberate tension: Paul truly labored, yet he attributes the effective agency to God’s grace with him.'
