revisions:
- from: Ma ọ bụ site n’amara Chineke ka m ji bụrụ ihe m bụ, amara ya n’ebe m nọ abụghịkwa ihe efu.[a] Kama, arụsịrị m ọrụ ike karịa ha niile—ma ọ bụghị m, kama ọ bụ amara Chineke nke nọnyere m.
  to: Ma site n’amara Chineke ka m bụ ihe m bụ; amara ya e mere m abụghị ihe efu. Kama, arụwo m ọrụ ike karịa ha niile; ma ọ bụghị m, kama ọ bụ amara Chineke nke nọnyere m.
  rationale: 'The revision corrects the opening connective, makes the directional force of εἰς ἐμέ explicit in natural Igbo, and replaces an unsuitable footnote alternative. It retains the source’s deliberate tension: Paul truly labored, yet he attributes the effective agency to God’s grace with him.'
