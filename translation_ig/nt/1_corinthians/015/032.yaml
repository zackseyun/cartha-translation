id: 1CO.15.32
reference: 1 Corinthians 15:32
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἰ κατὰ ἄνθρωπον ἐθηριομάχησα ἐν Ἐφέσῳ, τί μοι τὸ ὄφελος; εἰ νεκροὶ οὐκ ἐγείρονται, Φάγωμεν καὶ πίωμεν, αὔριον γὰρ ἀποθνῄσκομεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/032.yaml
  text: If[a], speaking in merely human terms, I fought with wild beasts in Ephesus, what does it profit me? If the dead are not raised[b], “Let us eat and drink[c], for tomorrow we die.”
translation:
  language: ig
  text: Ọ bụrụ[a] na, n'echiche mmadụ, alụrụ m anụ ọhịa ọgụ[b] n'Efesọs, uru gịnị ka nke ahụ baara m? Ọ bụrụ na a dịghị akpọlite ndị nwụrụ anwụ, “Ka anyị rie, ka anyị ṅụọ, n'ihi na echi anyị ga-anwụ.”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma eleghị anya: “Ọ bụrụ na, site n''echiche mmadụ nkịtị, alụrụ m anụ ọhịa ọgụ n''Efesọs…” Nkebiokwu ahụ nwere ike ịkọwa ụzọ Pọl si ekwu okwu ma ọ bụ echiche o si na ya ele ihe anya.'
    reason: lexical_alternative
  - marker: b
    text: A pụrụ ịghọta “alụrụ m anụ ọhịa ọgụ” dịka ọgụ nkịtị megide anụ ọhịa ma ọ bụ dịka ihe atụ maka mmegide obi ọjọọ sitere n'aka mmadụ; ahịrịokwu Grik ekpebighị nke ọ bụ.
    reason: alternative_reading
  - marker: c
    text: Nkwupụta e hotara ma ọ bụ e zoro aka na ya sitere n'Aịzaya 22:13.
    reason: cross_reference
lexical_decisions:
- source_word: κατὰ ἄνθρωπον
  choice: n'ikwu okwu dị ka mmadụ si eche
  rationale: Nke a na-egosipụta ụzọ mmadụ nkịtị si ekwu ma ọ bụ ele ihe anya, n'ebughị ụzọ kpebie kpọmkwem nke n'ime nghọta abụọ ahụ Pọl bu n'uche.
- source_word: ἐθηριομάχησα
  choice: mụ na anụ ọhịa lụrụ ọgụ
  rationale: Ọ na-edobe ihe oyiyi doro anya dị na Grik, ma hapụkwa ya ka a ghọta ya dịka ọgụ nkịtị ma ọ bụ dịka ihe atụ maka mmegide obi ọjọọ.
- source_word: ἐν Ἐφέσῳ
  choice: n'Efesọs
  rationale: Ụdị aha obodo ahụ a na-ejikarị eme ihe n'Igbo.
- source_word: τί μοι τὸ ὄφελος
  choice: uru gịnị ka nke ahụ baara m?
  rationale: Ọ bụ ajụjụ e ji arụ ụka nke na-egosipụta echiche uru ma na-ada ka Igbo nkịtị.
- source_word: νεκροὶ
  choice: ndị nwụrụ anwụ
  rationale: Nke a bụ ụzọ doro anya ma bụrụkwa nke e ji asụ Igbo maka ndị nwụrụ anwụ.
- source_word: ἐγείρονται
  choice: a dịghị akpọlite
  rationale: Ụdị a na-edobe olu nnara nke Grik ma ghara ịkpọ onye na-eme omume ahụ aha.
- source_word: Φάγωμεν καὶ πίωμεν
  choice: Ka anyị rie, ka anyị ṅụọ
  rationale: “Ka anyị...” na-egosipụta ike nke ngwaa hortatory subjunctive nke na-akpọ ndị mmadụ ka ha mee ihe.
- source_word: αὔριον γὰρ ἀποθνῄσκομεν
  choice: n'ihi na echi anyị ga-anwụ
  rationale: Nke a na-egosipụta ihe ga-eme n'ọdịnihu n'ụzọ Igbo dị mfe ma na-edobe nkwughachi Aịzaya 22:13.
theological_decisions:
- issue: Ma ἐθηριομάχησα ọ pụtara ịlụ anụ ọhịa ọgụ n'ezie ka ọ bụ ihe atụ maka ndị iro obi ọjọọ
  choice: Edobere “mụ na anụ ọhịa lụrụ ọgụ” n'ahịrịokwu bụ isi n'ekpebighị ma ọ bụ okwu nkịtị ka ọ bụ ihe atụ.
  alternative: Ịsụgharị ya ozugbo dịka ọgụ Pọl lụrụ megide ndị mmegide obi ọjọọ n'Efesọs.
  rationale: Okwu Grik n'onwe ya na-edobe ihe oyiyi anụ ọhịa; arụmụka amaokwu ahụ anaghị achọ ka onye ntụgharị kpebie ajụjụ akụkọ ihe mere eme ahụ.
- issue: Ihe κατὰ ἄνθρωπον na-akọwa
  choice: E gosipụtara ya dịka ụzọ ikwu okwu nke sitere n'echiche mmadụ nkịtị.
  alternative: Ịghọta ya dịka “site n'echiche mmadụ nkịtị” nke na-akọwa ọgụ ahụ n'onwe ya.
  rationale: Nkebiokwu ahụ nwere nghọta abụọ nwere ike ịdị; ederede bụ isi na ndetu ala na-edobe ohere abụọ ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta mee ihe. E debere ajụjụ arụmụka na ihe oyiyi siri ike nke Grik, ma zere ikpebi ihe ederede ahụ hapụrụ n'ọnọdụ nghọta abụọ.
