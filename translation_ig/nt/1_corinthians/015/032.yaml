- from: Ọ bụrụ[a] na, n'ikwu okwu dị ka mmadụ si eche, mụ na anụ ọhịa lụrụ ọgụ n'Efesọs, uru gịnị ka nke ahụ baara m? Ọ bụrụ na a dịghị akpọlite ndị nwụrụ anwụ[b], “Ka anyị rie, ka anyị ṅụọ[c], n'ihi na echi anyị ga-anwụ.”
  to: Ọ bụrụ[a] na, n'echiche mmadụ, alụrụ m anụ ọhịa ọgụ[b] n'Efesọs, uru gịnị ka nke ahụ baara m? Ọ bụrụ na a dịghị akpọlite ndị nwụrụ anwụ, “Ka anyị rie, ka anyị ṅụọ, n'ihi na echi anyị ga-anwụ.”[c]
  rationale: The revision retains all source-level ambiguity and the English audit trail’s cautious handling of the beast-fighting language. It improves Standard Igbo idiom and relocates footnote b to the exact phrase for which it supplies an alternative reading. No doctrinal or historical conclusion is introduced.
