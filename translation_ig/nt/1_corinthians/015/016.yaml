  yaml_path: translation/nt/1_corinthians/015/016.yaml
  text: For if the dead are not raised[a], not even Messiah has been raised.
translation:
  language: ig
  text: N’ihi na ọ bụrụ na a naghị akpọlite ndị nwụrụ anwụ, a kpọlitebeghị ọbụna Mesaịa[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ: “Kraịst.” A pụrụ ịsụgharị aha ọkwá Grik Χριστός dị ka “Mesaịa” ma ọ bụ, dịka omenala dịtere aka si dị, “Kraịst.”'
    reason: alternative_reading
lexical_decisions:
- source_word: εἰ γὰρ
  choice: N’ihi na ọ bụrụ na
  rationale: Ọ na-egosi ma njikọ nkọwa nke γάρ ma ọnọdụ nke εἰ, n’ụzọ Igbo na-aga were were n’arụmụka Pọl.
- source_word: νεκροὶ
  choice: ndị nwụrụ anwụ
  rationale: Adjective ahụ na-arụ ọrụ dị ka aha ma na-ekwu maka ndị nwụrụ anwụ n’ozuzu.
- source_word: οὐκ ἐγείρονται
  choice: a naghị akpọlite
  rationale: Nke a na-edobe olu nnara nke Grik ma na-egosi na ihe a na-ekwu bụ ịkpọlite ndị nwụrụ anwụ, ọ bụghị nanị na ha ji aka ha bilie.
- source_word: οὐδὲ
  choice: ọbụna ... -beghị
  rationale: 'Usoro a na-egosipụta ike okwu ahụ: ihe ga-esi na ọnọdụ ahụ pụta bụ na a kpọlitebeghị ọbụna Mesaya.'
- source_word: Χριστὸς
  choice: Mesaya
  rationale: Χριστός bụ aha ọkwá nke pụtara Onye E Tere Mmanụ; “Mesaya” na-eme ka ọrụ ya dị ka aha ọkwá pụta ìhè karịa iji ya dị ka aha nkịtị.
- source_word: ἐγήγερται
  choice: a kpọlitebeghị
  rationale: Perfect passive ahụ na-egosi omume e mere nke nsonaazụ ya ka dị; usoro Igbo a na-echekwa olu nnara na ọnọdụ mmezu ahụ.
theological_decisions:
- issue: Otu e si sụgharịa Χριστός n’arụmụka banyere mbilite n’ọnwụ
  choice: Mesaya
  alternative: Kraịst
  rationale: Ebe a, okwu ahụ ka nwere nghọta aha ọkwá nke Onye E Tere Mmanụ. “Mesaya” na-eme ka nke ahụ doo anya, ebe “Kraịst” bụkwa nsụgharị omenala a na-anabata.
- issue: Onye na-eme omume ịkpọlite n’ọnwụ
  choice: 'E debere olu nnara: “a naghị akpọlite / a kpọlitebeghị”'
  alternative: “ndị nwụrụ anwụ anaghị ebili / Mesaya ebilitebeghị”
  rationale: Grik ekwughị onye na-akpọlite ha n’amaokwu a, ma ọ na-eji olu nnara. Nsụgharị ahụ anaghị etinye onye e kwurughị kpọmkwem ma ọ bụ gbanwee ya ka ọ bụrụ omume onye ahụ ji aka ya mee.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji “ịkpọlite” chekwaa olu nnara nke Grik, e jikwa “Mesaya” gosipụta na Χριστός bụ aha ọkwá. Akara ndetu ala [a] dị n’ebe okwu ahụ metụtara.
