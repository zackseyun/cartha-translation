id: 1CO.15.22
reference: 1 Corinthians 15:22
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὥσπερ γὰρ ἐν τῷ Ἀδὰμ πάντες ἀποθνῄσκουσιν, οὕτως καὶ ἐν τῷ Χριστῷ πάντες ζῳοποιηθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/022.yaml
  text: For just as in Adam all die[a], so also in Messiah all will be made alive.
translation:
  language: ig
  text: N’ihi na dị nnọọ ka mmadụ niile si anwụ n’ime Adam, otu ahụkwa ka a ga-eme ka mmadụ niile dị ndụ n’ime Mesaịa[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Kraịst.” Aha Grik a, Χριστός, pụrụ ịpụta “Kraịst” ma ọ bụ “Mesaịa”; ọ pụtara “Onye E Tere Mmanụ.” Ebe a, a sụgharịrị ya “Mesaịa” iji gosi ihe aha ahụ pụtara.
    reason: alternative_reading
lexical_decisions:
- source_word: ὥσπερ γὰρ
  choice: N’ihi na, dị nnọọ ka
  rationale: “N’ihi na” na-egosipụta njikọ nkọwa nke γάρ, ebe “dị nnọọ ka” na-edobe ntụnyere siri ike nke ὥσπερ n’Igbo nkịtị.
- source_word: ἐν τῷ Ἀδὰμ
  choice: n’ime Adam
  rationale: Nke a na-edobe okwu Pọl dị mkpụmkpụ banyere ịdị “n’ime Adam” n’emeghị ka ἐν bụrụ naanị ụzọ e si mee ihe ma ọ bụ kọwaa njikọ ahụ karịa ihe Grik kwuru.
- source_word: πάντες
  choice: mmadụ niile
  rationale: “Mmadụ niile” na-enye πάντες nghọta doro anya n’Igbo ma na-edobe otu oke okwu ahụ n’akụkụ abụọ nke ahịrịokwu ahụ.
- source_word: ἀποθνῄσκουσιν
  choice: si anwụ
  rationale: N’usoro “dị ka ... si ...,” okwu a na-egosipụta eziokwu na-adịgide adịgide nke ngwaa Grik dị n’oge ugbu a, ọ bụghị naanị ihe na-eme n’otu oge.
- source_word: οὕτως καὶ
  choice: otu ahụkwa ka
  rationale: Nke a na-edobe ma njikọ ntụnyere nke οὕτως ma ike mgbakwunye nke καί n’Igbo na-asọ asọ.
- source_word: ἐν τῷ Χριστῷ
  choice: n’ime Mesaịa
  rationale: “Mesaịa” na-egosi Χριστός dị ka utu aha nke Onye E Tere Mmanụ, ma na-edobe usoro yiri “n’ime Adam.” E tinyere “Kraịst” dị ka nsụgharị ọzọ n’okpuru amaokwu.
- source_word: ζῳοποιηθήσονται
  choice: a ga-eme ka mmadụ niile dị ndụ
  rationale: 'Nke a na-edobe oge ọdịnihu na olu nnabata nke ngwaa Grik: ọ bụ a ga-eme ka ha dị ndụ, ọ bụghị naanị na ha ga-adị ndụ n’onwe ha.'
theological_decisions:
- issue: Oke okwu “mmadụ niile” n’akụkụ abụọ ahụ
  choice: E debere “mmadụ niile” n’akụkụ abụọ ahụ n’enweghị mbelata ma ọ bụ nkọwa agbakwunyere.
  alternative: Ịkọwa nke abụọ dị ka naanị ndị kwere ekwe, ma ọ bụ ikwupụta na ha abụọ pụtara mmadụ niile n’otu ụzọ kpọmkwem.
  rationale: Grik ji πάντες ugboro abụọ mee ntụnyere kpọmkwem, ma amaokwu a n’onwe ya akọwaghị oke ma ọ bụ usoro mmezu ya karịa nke ahụ. Nsụgharị ahụ na-ahapụ esemokwu nkà mmụta okpukpe ahụ ka ọ dị.
- issue: Ihe ἐν pụtara n’okwu “n’ime Adam” na “n’ime Mesaịa”
  choice: E jiri “n’ime” mee ihe n’ebe abụọ ahụ.
  alternative: “site n’aka Adam/Mesaịa” ma ọ bụ “n’ịdị n’otu na Adam/Mesaịa.”
  rationale: “N’ime” na-edobe njikọ dị mkpụmkpụ nke Grik n’enweghị ịgbanwe ya ka ọ bụrụ naanị ihe kpatara ihe ma ọ bụ ịkọwa ụdị ịdị n’otu ahụ n'ụzọ amaokwu ahụ na-ekwughị.
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. Usoro “dị nnọọ ka ... otu ahụkwa ka ...” na-edobe ntụnyere Pọl, ebe “a ga-eme ka ... dị ndụ” na-edobe olu nnabata na ọdịnihu nke okwu Grik.
