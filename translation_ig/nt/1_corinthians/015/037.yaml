revisions:
- from: Ihe ị na-agha abụghị ahụ nke ga-adị ka ị na-agha, kama ọ bụ mkpụrụ gba ọtọ[a]—ikekwe mkpụrụ ọka wit ma ọ bụ otu n’ime mkpụrụ ndị ọzọ.[b]
  to: Mgbe ị na-agha mkpụrụ, ọ bụghị ahụ nke ga-adị ka ị na-agha, kama ọ bụ naanị mkpụrụ—ikekwe nke wit ma ọ bụ nke ụdị mkpụrụ ọzọ.[a]
  rationale: The revised wording makes explicit that the object sown is not the future “body,” while retaining Paul’s body terminology and seed analogy. It renders γυμνὸν κόκκον with idiomatic “naanị mkpụrụ,” and retains the noncommittal illustrative “ikekwe” for εἰ τύχοι. The single footnote is correctly anchored to the expression it qualifies and offers the more literal alternative.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T19:24:13Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly retains the agricultural metaphor, σώμα as “ahụ,” the future reference of τὸ γενησόμενον, and the illustrative force of εἰ τύχοι. However, its word order (“ahụ nke ga-adị ka ị na-agha”) can grammatically suggest that the future body is being sown in the manner of sowing, rather than that what is sown is not the body that will come to be. The revision restores the Greek contrast plainly.
  naturalness: “Mkpụrụ gba ọtọ” is understandable but somewhat literal and less idiomatic for a seed without its developed form. “Naanị mkpụrụ” is natural modern Standard Igbo and expresses γυμνὸν κόκκον well in this context. Recasting the opening as “Mgbe ị na-agha mkpụrụ...” makes the sentence fluent and removes ambiguity.
  terminology: “Ahụ” appropriately preserves the theologically significant σῶμα without interpretation. “Mkpụrụ” is a suitable rendering of κόκκον. “Wit” is retained for σίτου. “Ụdị mkpụrụ ọzọ” naturally conveys τινος τῶν λοιπῶν without wrongly limiting it to a specific individual seed.
  issues:
  - severity: medium
    issue: Ambiguous placement of “ka ị na-agha”
    rationale: In “Ihe ị na-agha abụghị ahụ nke ga-adị ka ị na-agha,” the final phrase can attach to “ga-adị,” obscuring the source syntax. Greek contrasts the presently sown item with “the body that will come to be.”
  - severity: low
    issue: Literal “mkpụrụ gba ọtọ”
    rationale: Though it reflects γυμνόν, it is less natural in Standard Igbo for Paul’s agricultural image. “Naanị mkpụrụ” communicates a bare seed, i.e., seed not yet possessing the resulting body, without adding interpretation.
  revised_text: Mgbe ị na-agha mkpụrụ, ọ bụghị ahụ nke ga-adị ka ị na-agha, kama ọ bụ naanị mkpụrụ—ikekwe nke wit ma ọ bụ nke ụdị mkpụrụ ọzọ.[a]
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “mkpụrụ gba ọtọ”; ya bụ, “mkpụrụ na-enweghị ihe mkpuchi.”
    reason: lexical_alternative
  revision_rationale: The revised wording makes explicit that the object sown is not the future “body,” while retaining Paul’s body terminology and seed analogy. It renders γυμνὸν κόκκον with idiomatic “naanị mkpụrụ,” and retains the noncommittal illustrative “ikekwe” for εἰ τύχοι. The single footnote is correctly anchored to the expression it qualifies and offers the more literal alternative.
