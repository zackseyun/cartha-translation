source:
  edition: SBLGNT
  text: καὶ ὃ σπείρεις, οὐ τὸ σῶμα τὸ γενησόμενον σπείρεις ἀλλὰ γυμνὸν κόκκον εἰ τύχοι σίτου ἤ τινος τῶν λοιπῶν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/037.yaml
  text: And what you sow[a], you do not sow the body that will be, but a bare kernel[c][b], perhaps of wheat or of some other kind.
translation:
  language: ig
  text: Mgbe ị na-agha mkpụrụ, ọ bụghị ahụ nke ga-adị ka ị na-agha, kama ọ bụ naanị mkpụrụ—ikekwe nke wit ma ọ bụ nke ụdị mkpụrụ ọzọ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “mkpụrụ gba ọtọ”; ya bụ, “mkpụrụ na-enweghị ihe mkpuchi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: σπείρεις
  choice: ị na-agha
  rationale: “Ịgha” bụ okwu Igbo a na-eji maka ịgha mkpụrụ; ọ na-edobe ihe atụ Pọl ji banyere mkpụrụ na mbilite n’ọnwụ.
- source_word: σῶμα
  choice: ahụ
  rationale: “Ahụ” bụ ihe σῶμα pụtara kpọmkwem ma na-edobe njikọ amaokwu a na arụmụka Pọl banyere mbilite n’ọnwụ nke ahụ.
- source_word: τὸ γενησόμενον
  choice: nke ga-adị
  rationale: Nke a na-egosi ahụ nke ga-abịa dịrị, n’ebughị ụzọ kọwaa ya naanị dị ka osisi ga-eto.
- source_word: γυμνὸν κόκκον
  choice: mkpụrụ gba ọtọ
  rationale: “Mkpụrụ” na-egosi grain/kernel n’ụzọ doro anya n’Igbo, ebe “gba ọtọ” na-edobe ihe oyiyi nke γυμνόν, ya bụ ihe na-enweghị ahụ ga-emecha dịrị.
- source_word: εἰ τύχοι
  choice: ikekwe
  rationale: “Ikekwe” na-egosi na wit bụ naanị otu ihe atụ, dịka akpaokwu Grik si mee.
- source_word: σίτου ἤ τινος τῶν λοιπῶν
  choice: mkpụrụ ọka wit ma ọ bụ otu n’ime mkpụrụ ndị ọzọ
  rationale: Nke a na-akpọ wit aha kpọmkwem ma na-edobe echiche nke otu n’ime ụdị mkpụrụ ndị fọdụrụ.
theological_decisions:
- issue: Mmekọrịta dị n’etiti mkpụrụ a ghara na ahụ mbilite n’ọnwụ
  choice: E debere okwu “ahụ” na ọdịnihu ya n’enweghị ịkọwa karịa ihe atụ ahụ.
  alternative: Ịsụgharị ya dịka “osisi nke ga-eto.”
  rationale: Pọl na-eji ọrụ ugbo atụ mgbanwe na ịdịgide n’otu ụzọ, ma amaokwu ahụ n’onwe ya ka na-ekwu “ahụ”; nsụgharị a anaghị eme ka ihe atụ ahụ bụrụ naanị okwu banyere uto osisi.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ugwu ma dị mfe nghọta. E ji “ịgha mkpụrụ,” “ahụ,” na “mkpụrụ gba ọtọ” debe ihe atụ ọrụ ugbo na okwu gbasara ahụ n’enweghị itinye nkọwa ụka pụrụ iche.
