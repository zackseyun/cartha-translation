revisions:
- from: E nwekwara ahụ ndị nke eluigwe na ahụ ndị nke ụwa[a]; ma ebube nke ahụ ndị nke eluigwe dị otu ụdị, ebe ebube nke ahụ ndị nke ụwa dị ụdị ọzọ.
  to: E nwekwara ahụ nke eluigwe na ahụ nke ụwa; ma ebube nke ahụ nke eluigwe dị otu ụdị, ebe ebube nke ahụ nke ụwa dị ụdị ọzọ.
  rationale: The revision removes an unnatural plural construction, retains the source’s broad reference to heavenly and earthly bodies, and corrects the lexical-alternative footnote so that it accurately represents the celestial/terrestrial option. No doctrinal interpretation has been added.
