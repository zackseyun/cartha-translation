  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ σώματα ἐπουράνια, καὶ σώματα ἐπίγεια· ἀλλὰ ἑτέρα μὲν ἡ τῶν ἐπουρανίων δόξα, ἑτέρα δὲ ἡ τῶν ἐπιγείων.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/040.yaml
  text: And there are heavenly bodies and earthly bodies; but the glory of the heavenly is one kind[a], and the glory of the earthly is another.
translation:
  language: ig
  text: E nwekwara ahụ nke eluigwe na ahụ nke ụwa; ma ebube nke ahụ nke eluigwe dị otu ụdị, ebe ebube nke ahụ nke ụwa dị ụdị ọzọ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σώματα
  choice: ahụ ndị
  rationale: “Ahụ” bụ okwu Igbo nkịtị maka σῶμα. Itinye “ndị” na-eme ka ọtụtụ ahụ pụta ìhè n’enweghị ịkọwapụta ma ha bụ kpakpando, ahụ a kpọlitere n’ọnwụ, ma ọ bụ ụdị ahụ ndị ọzọ.
- source_word: ἐπουράνια
  choice: nke eluigwe
  rationale: “Nke eluigwe” na-edobe nghọta sara mbara nke ihe dị n’eluigwe ma ọ bụ nke eluigwe nwe, kama ime ka ọ bụrụ naanị ihe ndị dị na mbara igwe.
- source_word: ἐπίγεια
  choice: nke ụwa
  rationale: “Nke ụwa” kwekọrọ n’ụzọ doro anya na “nke eluigwe,” ma na-egosi ihe dị n’ụwa ma ọ bụ nke ụwa nwe.
- source_word: ἀλλὰ
  choice: ma
  rationale: “Ma” na-egosi ọdịiche dị n’etiti akụkụ abụọ ahụ n’ụzọ dị mfe ma dịkwa n’okwu Igbo ugbu a.
- source_word: ἑτέρα ... ἑτέρα
  choice: dị otu ụdị ... dị ụdị ọzọ
  rationale: Nhọrọ a na-egosi na ebube abụọ ahụ abụghị otu ụdị, ma na-edobe usoro ntụnyere nke okwu Grik.
- source_word: δόξα
  choice: ebube
  rationale: “Ebube” na-edobe ma echiche nke ịma mma ma ọ bụ ìhè pụrụ iche, ma echiche sara mbara nke δόξα n’okwu nkà mmụta okpukpe.
- source_word: τῶν ἐπουρανίων ... τῶν ἐπιγείων
  choice: nke ahụ ndị nke eluigwe ... nke ahụ ndị nke ụwa
  rationale: E kwughachiri “ahụ ndị” n’Igbo iji mee ka ihe nnọchiaha Grik ahụ na-ezo aka na ya doo anya, na-agbanweghị ihe ọ pụtara.
theological_decisions:
- issue: Ihe “ahụ ndị nke eluigwe” na “ahụ ndị nke ụwa” na-ezo aka na ya
  choice: A sụgharịrị ha n’ozuzu dịka “ahụ ndị nke eluigwe na ahụ ndị nke ụwa,” n’emeghị ka ha bụrụ naanị kpakpando ma ọ bụ ndị mmụọ ozi.
  alternative: “Ihe ndị dị na mbara igwe na ihe ndị dị n’elu ụwa,” ma ọ bụ “ndị nke eluigwe na ndị nke ụwa.”
  rationale: Ebe ọ bụ na Grik ji σώματα, ya bụ “ahụ,” nsụgharị ahụ ekwesịghị ịgbakwunye echiche gbasara ndị mmụọ ozi ma ọ bụ kpachie okwu ahụ n’ihe ndị a na-ahụ na mbara igwe. Nke a na-edobe obosara na esemokwu dị n’ihe atụ Pọl.
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, dị nsọ ma dị mfe nghọta. Usoro “ahụ ndị” na-eme ka ọtụtụ pụta ìhè; “ebube” na-edobe okwu nkà mmụta okpukpe na echiche nke ịma mma ma ọ bụ ìhè pụrụ iche.
