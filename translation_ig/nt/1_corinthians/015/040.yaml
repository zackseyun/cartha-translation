review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves σώματα as “ahụ,” the heavenly/earthly contrast, and δόξα as “ebube.” However, the repeated construction “ahụ ndị nke ...” is not idiomatic Standard Igbo, and the footnote’s “n’elu ụwa” is not a suitable equivalent for “terrestrial.”
  naturalness: Use the natural genitive-style phrases “ahụ nke eluigwe” and “ahụ nke ụwa.” The explicit contrast “otu ụdị ... ụdị ọzọ” clearly conveys ἑτέρα ... ἑτέρα without making the referents more specific.
  terminology: “Eluigwe,” “ụwa,” and “ebube” are appropriate established biblical terminology. “Ahụ” retains the broad meaning of σώματα and does not import an interpretation involving angels or astronomical objects.
  issues:
  - severity: medium
    issue: “ahụ ndị nke eluigwe / ahụ ndị nke ụwa” is structurally awkward in Standard Igbo.
    rationale: The plural marker “ndị” does not combine naturally here with the following possessive/genitive construction. “Ahụ nke eluigwe” and “ahụ nke ụwa” are more idiomatic while retaining the collective plural sense required by the Greek.
  - severity: medium
    issue: The footnote alternative says “ahụ ndị dị na mbara igwe na ahụ ndị dị n’elu ụwa.”
    rationale: “N’elu ụwa” means ‘on top of the earth,’ not ‘terrestrial’ or ‘earthly.’ The alternative should contrast bodies in the sky/celestial realm with bodies of/on the earth.
  revised_text: E nwekwara ahụ nke eluigwe na ahụ nke ụwa; ma ebube nke ahụ nke eluigwe dị otu ụdị, ebe ebube nke ahụ nke ụwa dị ụdị ọzọ.
  revised_footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ahụ ndị dị na mbara igwe na ahụ ndị dị n’ụwa.”
    reason: lexical_alternative
  revision_rationale: The revision removes an unnatural plural construction, retains the source’s broad reference to heavenly and earthly bodies, and corrects the lexical-alternative footnote so that it accurately represents the celestial/terrestrial option. No doctrinal interpretation has been added.
