id: 1CO.15.29
reference: 1 Corinthians 15:29
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἐπεὶ τί ποιήσουσιν οἱ βαπτιζόμενοι ὑπὲρ τῶν νεκρῶν; εἰ ὅλως νεκροὶ οὐκ ἐγείρονται, τί καὶ βαπτίζονται ὑπὲρ ⸀αὐτῶν;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/029.yaml
  text: Otherwise[a], what will those do who are being baptized on behalf of the dead? If the dead are not raised at all, why then are they being baptized on their behalf?
translation:
  language: ig
  text: Ma ọ bụghị ya, gịnị ka ndị a na-eme ha baptizim maka ndị nwụrụ anwụ[a] ga-eme? Ọ bụrụ na a dịghị akpọlite ndị nwụrụ anwụ ma ọlị, gịnịkwa mere a na-eme ha baptizim maka ndị ahụ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “n’aha ndị nwụrụ anwụ,” “n’ihi ndị nwụrụ anwụ,” ma ọ bụ, nke a na-eyighị ka ọ bụ ya, “n’elu ndị nwụrụ anwụ.” Okwu Grik a pụrụ inwe ihe karịrị otu nghọta, a maghịkwa kpọmkwem omume Pọl na-ekwu maka ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐπεὶ
  choice: Ma ọ bụghị ya
  rationale: N’usoro arụmụka a, okwu ahụ na-egosi ihe ga-esi n’ịjụ mbilite n’ọnwụ pụta. Nke a na-enye ntụgharị okwu Pọl n’ụzọ Igbo dị mma.
- source_word: τί ποιήσουσιν
  choice: gịnị ka ... ga-eme?
  rationale: A hapụrụ ποιέω n’echiche sara mbara nke ‘ime,’ ka ajụjụ Pọl ghara ịkọwa ihe karịrị ihe odide ahụ kwuru.
- source_word: οἱ βαπτιζόμενοι
  choice: ndị a na-eme baptizim
  rationale: Nke a na-egosipụta participle dị na present passive dị ka omume a na-eme n’oge ahụ ma ọ bụ nke a na-emekarị, n’ekpeghị ma omume ahụ ziri ezi.
- source_word: ὑπὲρ τῶν νεκρῶν
  choice: maka ndị nwụrụ anwụ
  rationale: ‘Maka’ bụ okwu Igbo sara mbara nke pụrụ igosi ime ihe n’ihi mmadụ, maka ọdịmma ya, ma ọ bụ n’ọnọdụ ya. Ọ na-ezere ịmanye otu nkọwa n’amaokwu a siri ike, ebe nkọwa ndị ọzọ dị n’okpuru peeji.
- source_word: εἰ ὅλως
  choice: Ọ bụrụ na ... ma ọlị
  rationale: ‘Ma ọlị’ na-echekwa ike ὅλως ji mesie ọnọdụ ahụ ike.
- source_word: νεκροὶ οὐκ ἐγείρονται
  choice: a dịghị akpọlite ndị nwụrụ anwụ
  rationale: E ji usoro Igbo na-enweghị onye a kpọrọ aha chekwaa passive ahụ, n’ebughị ụzọ kọwaa onye na-akpọlite ha.
- source_word: τί καὶ
  choice: gịnịkwa mere
  rationale: Nke a na-egosipụta ajụjụ arụmụka ahụ n’Igbo nkịtị, ebe ‘-kwa’ jikọtara ya na ajụjụ mbụ.
- source_word: βαπτίζονται
  choice: a na-eme ha baptizim
  rationale: Usoro a na-echekwa present passive ma na-egosi omume na-aga n’ihu ma ọ bụ nke a na-emekarị.
- source_word: ὑπὲρ αὐτῶν
  choice: maka ndị ahụ
  rationale: ‘Ndị ahụ’ na-ezoghachi n’ụzọ doro anya n’ebe ndị nwụrụ anwụ nọ, ebe ‘maka’ na-echekwa otu okwu na otu nghọta sara mbara dị na nkebi mbụ.
theological_decisions:
- issue: Ihe baptizim ‘maka ndị nwụrụ anwụ’ pụtara
  choice: E ji okwu sara mbara ‘a na-eme baptizim maka ndị nwụrụ anwụ’ mee ihe, n’akwadoghị otu nkọwa banyere omume ahụ ma ọ bụ ozizi e ji ya wuo.
  alternative: A na-eme baptizim n’ọnọdụ ndị nwụrụ anwụ; a na-eme baptizim n’ihi ndị nwụrụ anwụ; a na-eme baptizim n’elu ndị nwụrụ anwụ.
  rationale: Amaokwu a siri ike, a kọwawokwa ya n’ụzọ dị iche iche. Nsụgharị ahụ kwesịrị ichekwa mgbagwoju anya dị na ὑπέρ na otu Pọl si jiri omume ahụ rụọ arụmụka banyere mbilite n’ọnwụ, kama itinye nkọwa otu ụka ma ọ bụ otu onye n’ime ederede.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta, mee ihe. A họọrọ ‘baptizim’ dịka okwu Ndị Kraịst maara nke ọma; a zere okwu ga-ekpebi kpọmkwem ụdị omume e kwuru maka ya.
