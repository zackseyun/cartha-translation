  to: Ma ọ bụghị ya, gịnị ka ndị a na-eme ha baptizim maka ndị nwụrụ anwụ[a] ga-eme? Ọ bụrụ na a dịghị akpọlite ndị nwụrụ anwụ ma ọlị, gịnịkwa mere a na-eme ha baptizim maka ndị ahụ?
