review_pass:
  verdict: revise
  source_fidelity: The draft preserves the rhetorical inference, the emphatic conditional ('ma ọlị'), the passive resurrection wording, and the parallel use of ὑπέρ. However, the first occurrence of the passive participle is clearer and more idiomatic in Igbo when the people receiving baptism are explicitly marked.
  naturalness: The first question is understandable, but 'ndị a na-eme baptizim maka...' can momentarily suggest people performing baptism. Adding 'ha' makes the passive reference unambiguous and aligns it with the second clause. The revision retains a formal but contemporary Standard Igbo register.
  terminology: ‘Baptizim,’ ‘ndị nwụrụ anwụ,’ and ‘akpọlite’ are appropriate established Christian and biblical terms. ‘Maka’ suitably preserves the broad, disputed force of ὑπέρ without endorsing a particular interpretation.
  issues:
  - severity: medium
    issue: The first passive baptism expression lacks an explicit object pronoun.
    rationale: In 'ndị a na-eme baptizim maka ndị nwụrụ anwụ,' the construction may be read less clearly than intended. ‘Ndị a na-eme ha baptizim...’ explicitly conveys οἱ βαπτιζόμενοι, ‘those who are being baptized.’
  - severity: low
    issue: The footnote’s first alternative can better reflect the representative nuance without presenting it as a settled interpretation.
    rationale: ‘N’ọnọdụ’ is possible, but ‘n’aha’ more naturally expresses an ‘on behalf of’ sense in Igbo. The note must continue to state that the precise practice is unknown.
