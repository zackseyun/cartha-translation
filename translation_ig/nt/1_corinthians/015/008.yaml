  text: And last of all[a], as to one untimely born, he appeared also to me.
translation:
  language: ig
  text: Ma n’ikpeazụ n’ime ha niile, ọ pụtakwara n’ihu m, dị ka a ga-asị na a tụpụrụ m ime.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n’ụzọ kpọmkwem, “dị ka ihe ime a tụpụrụ” ma ọ bụ “dị ka ime pụtara n’afọ.” Pọl ji ihe atụ siri ike wedata onwe ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔσχατον δὲ πάντων
  choice: N’ikpeazụ, mgbe ọ pụtachara n’ihu ha niile
  rationale: Na-egosi na mpụta a bụ nke ikpeazụ n’usoro ndị e depụtara, ebe δέ na-aga n’ihu n’akụkọ ahụ n’enweghị nnukwu mmegide.
- source_word: ὡσπερεὶ
  choice: dị ka
  rationale: Na-echekwa ike ntụnyere ahụ na-enweghị ime ka ihe atụ ahụ bụrụ nkọwa nkịtị kpọmkwem.
- source_word: τῷ ἐκτρώματι
  choice: onye a mụrụ tupu oge eruo
  rationale: Ọ bụ ụzọ Igbo doro anya ma dị ùgwù isi chekwaa echiche ọmụmụ na-abụghị n’oge kwesịrị ekwesị na mweda onwe Pọl, ebe a na-etinye nkọwa ya ka sie ike karị n’ala peeji.
- source_word: ὤφθη
  choice: ọ pụtara n’ihu
  rationale: N’ọnọdụ akụkọ banyere mbilite n’ọnwụ, nke a na-ekwupụta mpụta a pụrụ ịhụ nke ọma karịa ntụgharị nkịtị ‘a hụrụ ya.’
- source_word: κἀμοί
  choice: ọ pụtakwara n’ihu m
  rationale: Na-echekwa ike mgbakwunye nke καί + ἐμοί, tinye Pọl n’usoro ndị hụrụ ya.
theological_decisions:
- issue: Ihe atụ Pọl ji kọwaa onwe ya, ἐκτρώματι
  choice: onye a mụrụ tupu oge eruo n’ahịrịokwu bụ isi, tinyere nkọwa okwu siri ike karị n’ala peeji
  alternative: ihe ime pụrụ n’afọ; nwa e wepụrụ n’afọ tupu oge ya
  rationale: Nke a na-echekwa echiche ọmụmụ na-ekwesịghị oge na mweda onwe Pọl, ma ọ naghị amanye nkọwa ozizi banyere ọkwa ozi ya nke okwu Grik ahụ n’onwe ya na-ekwughị.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. A họọrọ ‘pụtara n’ihu’ maka mpụta Kraịst a pụrụ ịhụ, ma debe ihe atụ siri ike nke ἐκτρώμα n’ala peeji.
