revisions:
- from: N’ikpeazụ, mgbe ọ pụtachara n’ihu ha niile, ọ pụtakwara n’ihu m, dị ka onye a mụrụ tupu oge eruo.[a]
  to: Ma n’ikpeazụ n’ime ha niile, ọ pụtakwara n’ihu m, dị ka a ga-asị na a tụpụrụ m ime.[a]
  rationale: The revision removes the unsupported clause about Christ’s prior appearance to all the others and directly renders the sequential phrase “last of all.” It also replaces the premature-birth wording with an idiomatic Igbo comparison that retains the disturbing, self-humbling force of ἐκτρώματι. The footnote supplies literal alternatives while leaving the precise nuance between miscarriage and abortion open.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T18:15:38Z'
review_pass:
  verdict: revise
  source_fidelity: 'The draft adds a temporal event not present in Greek: “mgbe ọ pụtachara n’ihu ha niile” means “after he had appeared before all of them,” whereas ἔσχατον δὲ πάντων means “last of all/in the final position among all [the appearances or witnesses].” Its rendering of ἐκτρώματι as “onye a mụrụ tupu oge eruo” chiefly suggests a premature birth and substantially softens the stark miscarriage/abortion metaphor. The revision retains the approximate comparison of ὡσπερεὶ and the additive force of κἀμοί.'
  naturalness: The revised wording is standard, contemporary Igbo and reads naturally. “Dị ka a ga-asị na a tụpụrụ m ime” communicates Paul’s deliberately harsh self-comparison without treating him literally as an unborn child.
  terminology: “Ọ pụtakwara n’ihu m” is an appropriate rendering of ὤφθη κἀμοί in this resurrection-appearance list. The footnote preserves both the literal image and its self-deprecating rhetorical function, without imposing a doctrinal explanation.
  issues:
  - severity: high
    issue: Added temporal assertion in “mgbe ọ pụtachara n’ihu ha niile.”
    rationale: 'The Greek does not say Christ appeared to Paul after appearing to every previously mentioned person as a completed event. It marks Paul’s appearance as last in the sequence: ἔσχατον δὲ πάντων.'
  - severity: medium
    issue: “onye a mụrụ tupu oge eruo” inadequately represents ἐκτρώματι.
    rationale: This normally denotes a prematurely born person, while ἔκτρωμα literally denotes a miscarriage/aborted fetus and is a notably stark self-deprecating metaphor. A clearer main-text comparison and literal alternatives in the footnote better preserve the source.
  revised_text: Ma n’ikpeazụ n’ime ha niile, ọ pụtakwara n’ihu m, dị ka a ga-asị na a tụpụrụ m ime.[a]
