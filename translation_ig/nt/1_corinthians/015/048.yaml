id: 1CO.15.48
reference: 1 Corinthians 15:48
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οἷος ὁ χοϊκός, τοιοῦτοι καὶ οἱ χοϊκοί, καὶ οἷος ὁ ἐπουράνιος, τοιοῦτοι καὶ οἱ ἐπουράνιοι·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/048.yaml
  text: As is the man of dust[a], so also are those of dust; and as is the heavenly man, so also are those who are heavenly.
translation:
  language: ig
  text: Dị ka nwoke ahụ e ji ájá kee dị, otu ahụkwa ka ndị e ji ájá kee dị; dịkwa ka nwoke ahụ nke eluigwe dị, otu ahụkwa ka ndị nke eluigwe dị.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἷος ... τοιοῦτοι
  choice: Dị ka ... dị, otu ahụkwa ka ... dị
  rationale: Usoro a na-egosi myirịta dị n’etiti onye nnọchiteanya na ndị so n’ụdị ya; ntụgharị a bụ Igbo ebumpụta ụwa ma na-edobe nhazi ahịrịokwu abụọ ahụ.
- source_word: χοϊκός
  choice: e ji ájá kee
  rationale: Ọ na-egosi onye e si n’ájá mee ma na-akpọghachi uche n’ebe e kere Adam si; ọ pụtaghị nanị onye ájá ruru ma ọ bụ ihe metụtara ụwa n’ozuzu.
- source_word: ὁ χοϊκός
  choice: nwoke ahụ e ji ájá kee
  rationale: N’ọnọdụ okwu a, otu onye a bụ Adam, onye nnọchiteanya nke mmadụ sitere n’ájá. Itinye ‘nwoke’ na-eme ka ntụnyere ya na onye nke eluigwe doo anya.
- source_word: οἱ χοϊκοί
  choice: ndị e ji ájá kee
  rationale: Ọ na-ezo aka n’ụmụ mmadụ ndị ha na nwoke e ji ájá kee nwere otu ọdịdị; e debere njikọ okwu ahụ na χοϊκός nke otu onye.
- source_word: ἐπουράνιος
  choice: nke eluigwe
  rationale: Ọ na-egosi ihe bụ nke eluigwe ma ọ bụ nke so n’eluigwe. Nke a na-edobe ọdịiche Pọl mere n’etiti nke ájá na nke eluigwe n’enweghị ibubata kpọmkwem okwu ‘si n’eluigwe bịa’ nke amaokwu 47.
- source_word: ὁ ἐπουράνιος
  choice: nwoke ahụ nke eluigwe
  rationale: N’ọnọdụ gbara ya gburugburu, ọ na-ezo aka na Kraịst n’ụzọ dị iche na Adam. ‘Nwoke’ na-edobe ọdịiche dị n’etiti mmadụ abụọ ahụ bụ ndị nnọchiteanya.
- source_word: οἱ ἐπουράνιοι
  choice: ndị nke eluigwe
  rationale: Ọ na-ezo aka n’ụmụ mmadụ ndị ha na nwoke nke eluigwe nwere otu njirimara ma ọ bụ ọdịnihu; okwu a anaghị eme ka ha bụrụ ndị mmụọ ozi.
theological_decisions:
- issue: Ma a ga-eme ka ọdịiche Adam/Kraịst pụta ìhè site n’itinye ‘nwoke’ n’akụkụ abụọ nke otu onye
  choice: nwoke ahụ e ji ájá kee ... nwoke ahụ nke eluigwe
  alternative: onye ahụ e ji ájá kee ... onye ahụ nke eluigwe
  rationale: Amaokwu ndị gbara ya gburugburu na-atụnyere Adam na Kraịst dịka mmadụ abụọ bụ ndị nnọchiteanya. ‘Nwoke’ na-eme ka nke a doo anya n’Igbo n’enweghị ịgbakwunye ozizi na-adịghị n’ọnọdụ okwu ahụ.
- issue: Ma οἱ ἐπουράνιοι ọ na-ezo aka n’ụmụ mmadụ ka ọ bụ ndị bi n’eluigwe dịka ndị mmụọ ozi
  choice: ndị nke eluigwe, ya bụ, ụmụ mmadụ kwekọrọ na nwoke nke eluigwe
  alternative: ndị bi n’eluigwe
  rationale: Isiokwu ebe a bụ mbilite n’ọnwụ mmadụ na oyiyi ha ga-ebu; ya mere okwu ahụ anaghị ezo aka n’ebe ndị mmụọ ozi nọ.
translation_notes:
  register: E ji Standard Igbo dị ugwu ma dị mfe nghọta. A họọrọ ‘e ji ájá kee’ iji mee ka mmalite Adam n’ájá pụta ìhè, ebe ‘nke eluigwe’ na-edobe mkpụmkpụ na nhazi kwekọrọ ekwekọ nke Grik.
