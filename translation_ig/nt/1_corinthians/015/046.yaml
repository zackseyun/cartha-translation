  text: ἀλλ’ οὐ πρῶτον τὸ πνευματικὸν ἀλλὰ τὸ ψυχικόν, ἔπειτα τὸ πνευματικόν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/046.yaml
  text: But the spiritual is not first[a], but the natural[b]; afterward the spiritual.
translation:
  language: ig
  text: Ma ọ bụghị nke ime mmụọ[a] buru ụzọ, kama ọ bụ nke ndụ nkịtị[b]; emesịa, nke ime mmụọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ahụ nke ndụ nkịtị ... ahụ nke ime mmụọ.” Pọl etinyeghị okwu ahụ bụ “ahụ” n’amaokwu a, ọ bụ ezie na o kwuru ya hoo haa n’amaokwu ndị gbara ya gburugburu.
    reason: alternative_reading
  - marker: b
    text: “Nke ndụ nkịtị” sụgharịrị okwu Grik psychikon, nke na-ekwu maka ihe metụtara ndụ eke, ya bụ ndụ nke ihe dị ndụ; a pụkwara ịsụgharị ya n’ụzọ na-arapara n’okwu Grik karịa ka “nke mkpụrụ obi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πρῶτον
  choice: nke mbụ
  rationale: 'Ọ na-egosi usoro oge: ihe bịara na mbụ. Nhọrọ a bụ nke doro anya ma kwekọọ n’ụzọ Pọl si atụnyere ihe abụọ ahụ.'
- source_word: πνευματικόν
  choice: nke ime mmụọ
  rationale: Adjective a na-arụ ọrụ dị ka aha n’asụsụ Grik. ‘Nke ime mmụọ’ na-echekwa mkpụmkpụ okwu Grik ma ghara itinye ‘ahụ’ n’amaokwu ahụ mgbe Pọl etinyeghị ya ebe a.
- source_word: ψυχικόν
  choice: nke ndụ nkịtị
  rationale: N’ebe a, okwu ahụ na-ezo aka n’ihe bụ́ nke ndụ mmadụ na anụmanụ dị ugbu a, n’adabereghị na ndụ ọhụrụ nke Mmụọ. ‘Nke ndụ nkịtị’ na-ezere ime ka ọ bụrụ naanị ihe gbasara ahụ́ ma ọ bụ ka ọ daa ka ikpe omume.
- source_word: ἔπειτα
  choice: emesịa
  rationale: Ọ na-egosi ihe sochiri nke mbụ n’usoro oge.
- source_word: ἀλλ’ οὐ ... ἀλλὰ
  choice: Ma ... abụghị ... kama
  rationale: Usoro a na-echekwa nkwụghachi na ntụnyere siri ike dị n’okwu Grik.
theological_decisions:
- issue: Ihe ntụnyere ψυχικόν na πνευματικόν pụtara
  choice: A hapụrụ ha dị ka ‘nke ndụ nkịtị’ na ‘nke ime mmụọ,’ nke na-egosi usoro abụọ n’ịdị adị mmadụ n’arụmụka Pọl banyere mbilite n’ọnwụ.
  alternative: Ịsụgharị ha kpọmkwem dị ka ‘ahụ nke ndụ nkịtị’ na ‘ahụ nke ime mmụọ.’
  rationale: Amaokwu ndị gbara ya gburugburu na-ekwu banyere ahụ, ma Pọl ekwughị okwu ahụ bụ ‘ahụ’ n’amaokwu a. Ya mere, nsụgharị bụ isi echekwala obosara na nkenke nke okwu Grik, ebe ndetu ala na-egosi nkọwa nke sitere n’amaokwu ndị gbara ya gburugburu.
translation_notes:
  register: E ji Standard Igbo nke dị ugwu ma dị mfe nghọta mee ihe. E chekwara mkpụmkpụ ahịrịokwu Grik na ntụnyere ya, ma zere okwu ‘nke anụ ahụ’ n’ihi na ọ pụrụ ime ka ψυχικόν bụrụ naanị ihe gbasara ahụ́ ma ọ bụ mee ka ndị na-agụ ya chee okwu Grik ọzọ dị ka σάρξ.
