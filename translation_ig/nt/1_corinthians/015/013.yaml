revisions:
- from: Ma ọ bụrụ na mbilite n’ọnwụ nke ndị nwụrụ anwụ adịghị, mgbe ahụ a kpọliteghị ọbụna Mesaịa[a] n’ọnwụ.[b]
  to: Ma ọ bụrụ na mbilite n’ọnwụ nke ndị nwụrụ anwụ adịghị, mgbe ahụ a kpọlitebeghị ọbụna Mesaịa[a].[b]
  rationale: The revision changes the passive verb to the Igbo perfect negative «a kpọlitebeghị», maintaining the Greek perfect passive and its present relevance. It removes an unneeded explicit “from death” element from the main text and aligns the footnote’s active alternative with the Greek wording while retaining the explanation of passive voice.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T18:15:45Z'
review_pass:
  verdict: revise
  source_fidelity: The conditional argument, existential denial of resurrection, title «Mesaịa», and passive sense of ἐγήγερται are retained. However, «a kpọliteghị» normally reads as a simple past negative and does not adequately convey the Greek perfect; «a kpọlitebeghị» more naturally expresses “has not been raised.”
  naturalness: The draft is generally clear Standard Igbo. Omitting the final «n’ọnwụ» avoids an unnecessary addition to the explicit wording of the Greek and yields a smoother, more direct clause.
  terminology: «Mbilite n’ọnwụ», «ndị nwụrụ anwụ», and «Mesaịa» are suitable. The passive alternative in the footnote should use a natural perfect active alternative and should not introduce «esiteghị n’ọnwụ», which is not explicit in the Greek clause.
  issues:
  - severity: medium
    issue: The main verb uses «a kpọliteghị».
    rationale: This form is readily understood as “was not raised,” whereas ἐγήγερται is perfect passive, “has not been raised.” «A kpọlitebeghị» preserves the completed action with continuing relevance more faithfully.
  - severity: low
    issue: The main text adds «n’ọnwụ» after the passive verb.
    rationale: Resurrection is certainly the context, but the Greek predicate is simply “has not been raised.” The addition is unnecessary and can be omitted without losing the sense.
  - severity: low
    issue: Footnote b’s alternative includes «esiteghị n’ọnwụ».
    rationale: The alternative active rendering should correspond directly to “has risen” and retain the perfect sense; the added “from death” is interpretive rather than explicit in this clause.
  revised_text: Ma ọ bụrụ na mbilite n’ọnwụ nke ndị nwụrụ anwụ adịghị, mgbe ahụ a kpọlitebeghị ọbụna Mesaịa[a].[b]
  revised_footnotes:
