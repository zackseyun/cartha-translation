    text: A pụkwara ịtụgharị ya, “Kraịst.” Okwu Grik Χριστός pụtara Onye e tere mmanụ; e ji “Mesaịa” mee ihe ebe a iji chekwaa ihe aha ọkwa ahụ pụtara.
    reason: alternative_reading
  - marker: b
    text: A pụkwara ịtụgharị ya, “Mesaịa ebilitebeghị.” Ngwaa Grik ahụ dị n’olu nnara—“a kpọlitebeghị ya”—nke nwere ike na-atụ aka n’omume Chineke, n’agbanyeghị na ekwughị onye mere ya.
    reason: lexical_alternative
  revision_rationale: The revision changes the passive verb to the Igbo perfect negative «a kpọlitebeghị», maintaining the Greek perfect passive and its present relevance. It removes an unneeded explicit “from death” element from the main text and aligns the footnote’s active alternative with the Greek wording while retaining the explanation of passive voice.
