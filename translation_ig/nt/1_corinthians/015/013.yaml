  yaml_path: translation/nt/1_corinthians/015/013.yaml
  text: But if there is no resurrection of the dead[b][a], then not even Messiah has been raised.
translation:
  language: ig
  text: Ma ọ bụrụ na mbilite n’ọnwụ nke ndị nwụrụ anwụ adịghị, mgbe ahụ a kpọlitebeghị ọbụna Mesaịa[a].[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịtụgharị ya, “Kraịst.” Okwu Grik Χριστός pụtara Onye e tere mmanụ; e ji “Mesaịa” mee ihe ebe a iji chekwaa ihe aha ọkwa ahụ pụtara.
    reason: alternative_reading
  - marker: b
    text: A pụkwara ịtụgharị ya, “Mesaịa ebilitebeghị.” Ngwaa Grik ahụ dị n’olu nnara—“a kpọlitebeghị ya”—nke nwere ike na-atụ aka n’omume Chineke, n’agbanyeghị na ekwughị onye mere ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δὲ
  choice: Ma ọ bụrụ na
  rationale: “Ma” na-egosi obere ngbanwe n’arụmụka ahụ, ebe “ọ bụrụ na” na-ewebata ọnọdụ a na-atụle.
- source_word: ἀνάστασις νεκρῶν
  choice: mbilite n’ọnwụ nke ndị nwụrụ anwụ
  rationale: Nke a na-egosi mbilite n’ọnwụ nke ndị nwụrụ anwụ dịka otu ìgwè, ọ bụghị naanị isi n’ebe ndị nwụrụ anwụ nọ pụta.
- source_word: οὐκ ἔστιν
  choice: adịghị
  rationale: Nke a bụ ụzọ Igbo dị nkenke ma bụrụkwa nke ebumpụta ụwa isi gọnahụ ịdị adị ma ọ bụ eziokwu nke mbilite n’ọnwụ.
- source_word: οὐδὲ
  choice: mgbe ahụ ... ọbụna
  rationale: “Mgbe ahụ” na-eme ka nkwubi okwu sitere n’ọnọdụ ahụ doo anya, ebe “ọbụna” na-echekwa ike nke οὐδέ.
- source_word: Χριστὸς
  choice: Mesaịa
  rationale: A họọrọ “Mesaịa” ka aha ọkwa a nọgide na-egosi Onye E Tere Mmanụ, kama ime ya naanị aha mmadụ.
- source_word: ἐγήγερται
  choice: a kpọliteghị ... n’ọnwụ
  rationale: Nhazi a na-echekwa olu nnara nke ngwaa Grik ahụ ma ghara ikwu kpọmkwem onye mere omume ahụ.
theological_decisions:
- issue: Nsụgharị Χριστός
  choice: Mesaịa
  alternative: Kraịst
  rationale: N’ebe a, okwu ahụ na-arụ ọrụ dịka aha ọkwa nke Onye E Tere Mmanụ. “Mesaịa” na-echekwa ọrụ ahụ, ebe “Kraịst” bụkwa okwu ndị ụka Igbo maara nke ọma.
- issue: Olu nke ἐγήγερται
  choice: a kpọliteghị ... n’ọnwụ
  alternative: esiteghị ... n’ọnwụ bilie
  rationale: A chekwara olu nnara nke Grik ka okwu ahụ gosi na e mere omume ahụ nye Mesaịa, n’agbanyeghị na ekwughị onye mere ya.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta, dee ya. A họọrọ “mbilite n’ọnwụ” dịka okwu Ndị Kraịst na-asụ Igbo maara nke ọma, ma e zere itinye onye kpọlitere Mesaịa n’ahịrịokwu ahụ n’ihi na Grik ekwughị onye ahụ kpọmkwem.
