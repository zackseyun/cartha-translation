id: 1CO.15.24
reference: 1 Corinthians 15:24
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἶτα τὸ τέλος, ὅταν ⸀παραδιδῷ τὴν βασιλείαν τῷ θεῷ καὶ πατρί, ὅταν καταργήσῃ πᾶσαν ἀρχὴν καὶ πᾶσαν ἐξουσίαν καὶ δύναμιν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/024.yaml
  text: Then comes the end[a], when he hands over the kingdom to God the Father[c][b], when he abolishes every rule and every authority and power.
translation:
  language: ig
  text: Mgbe ahụ ka ọgwụgwụ ga-abịa[a], mgbe ọ ga-enyefe alaeze ahụ n’aka Chineke bụ́ Nna[b], mgbe ọ ga-eme ka ọchịchị niile, ikike niile na ike niile kwụsị ịdị irè[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “mmezu ikpeazụ.” Okwu Grik τέλος pụrụ ịpụta ọgwụgwụ, ihe e bu n’obi, ma ọ bụ mmezu zuru ezu.
    reason: lexical_alternative
  - marker: b
    text: N’ụzọ nkịtị, “nye Chineke na Nna.”
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “mgbe ọ ga-eme ka ọchịchị niile, ikike niile na ike niile ghara ịdị irè,” ma ọ bụ “mgbe ọ ga-eme ka ha bụrụ ihe efu.” “Ọchịchị niile” nwekwara ike ịbụ “onye ọchịchị ọ bụla.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶτα
  choice: Mgbe ahụ
  rationale: Ọ na-egosi ihe na-esote n’usoro ihe Pọl na-akọ banyere mbilite n’ọnwụ.
- source_word: τὸ τέλος
  choice: ọgwụgwụ
  rationale: Ọ na-echekwa echiche bụ isi nke τέλος dị ka njedebe, ma ihe odide ala peeji na-egosikwa na ọ pụrụ ịpụta mmezu zuru ezu.
- source_word: ὅταν παραδιδῷ
  choice: mgbe ọ ga-enyefe
  rationale: Nke a na-egosi ihe ga-eme n’ọdịnihu, bụ́ inyefe ọchịchị ma ọ bụ ihe e nyere mmadụ n’aka onye ọzọ.
- source_word: τὴν βασιλείαν
  choice: alaeze ahụ
  rationale: “Alaeze” bụ okwu Igbo doro anya ma na-ahapụkwa echiche nke ọchịchị eze dị n’okwu Grik ahụ.
- source_word: τῷ θεῷ καὶ πατρί
  choice: n’aka Chineke bụ́ Nna
  rationale: Nke a na-agụ “Chineke” na “Nna” dịka otu onye ahụ, n’ụzọ doro anya ma dịkwa mma n’Igbo.
- source_word: ὅταν καταργήσῃ
  choice: mgbe ọ ga-eme ka ... kwụsị ịdị irè
  rationale: Nkebiokwu a na-egosi iwepụ ọrụ na mmetụta nke ike ndị ahụ n’enweghị ịkọwa ya dịka ikpochapụ ịdị adị ha kpamkpam.
- source_word: πᾶσαν ἀρχὴν
  choice: ọchịchị niile
  rationale: N’usoro ya na “ikike” na “ike,” ἀρχή nwere ike ịpụta ọchịchị ma ọ bụ ike na-achị; “ọchịchị niile” na-echekwa ọdịdị ahụ.
- source_word: πᾶσαν ἐξουσίαν
  choice: ikike niile
  rationale: “Ikike” bụ okwu Igbo nkịtị maka ikike ịchị ma ọ bụ ime ihe.
- source_word: δύναμιν
  choice: ike niile
  rationale: “Ike” bụ ntụgharị sara mbara ma kwekọọ n’usoro ike ndị a kpọrọ aha.
theological_decisions:
- issue: Mmekọrịta dị n’etiti “Chineke” na “Nna” na τῷ θεῷ καὶ πατρί
  choice: Chineke bụ́ Nna
  alternative: Chineke na Nna
  rationale: A pụrụ ịghọta okwu Grik ahụ n’ụzọ apposition, ya bụ, Chineke onye bụ Nna. Ihe odide ala peeji na-echekwa ntụgharị nke na-ejikọta aha abụọ ahụ na “na.”
- issue: Ihe καταργήσῃ pụtara banyere ọchịchị na ike niile
  choice: ime ka ha kwụsị ịdị irè
  alternative: iwepụsị ha ma ọ bụ ime ka ha ghara ịdị
  rationale: Nhọrọ a na-egosi njedebe zuru oke nke ọrụ ha, ma ọ naghị ekpebi ma okwu ahụ ọ̀ pụtara ikpochapụ ha kpamkpam.
- issue: Ma πᾶσαν ἀρχὴν ọ̀ bụ ọchịchị ma ọ bụ ndị ọchịchị
  choice: ọchịchị niile
  alternative: onye ọchịchị ọ bụla
  rationale: N’ihi na okwu ahụ nọ n’usoro ya na “ikike” na “ike,” a họọrọ echiche nke ọchịchị ma ọ bụ ike na-achị, ebe a na-edebe nhọrọ nke ndị ọchịchị n’ihe odide ala peeji.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta mee ya. A họọrọ usoro ahịrịokwu na-aga nke ọma n’Igbo, ebe e debere nkọwa ọzọ nke okwu Grik ndị nwere ọtụtụ nghọta n’ihe odide ala peeji.
