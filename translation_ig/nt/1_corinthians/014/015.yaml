  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τί οὖν ἐστιν; προσεύξομαι τῷ πνεύματι, προσεύξομαι δὲ καὶ τῷ νοΐ· ψαλῶ τῷ πνεύματι, ψαλῶ δὲ καὶ τῷ νοΐ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/015.yaml
  text: What then is to be done? I will pray with the spirit[a], but I will also pray with the mind; I will sing praise with the spirit[c][b], but I will also sing praise with the mind.
translation:
  language: ig
  text: Gịnịzi ka a ga-eme? Aga m eji mmụọ[a] kpee ekpere, ma aga m ejikwa uche kpee ekpere; aga m eji mmụọ bụọ abụ otuto[b], ma aga m ejikwa uche bụọ abụ otuto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya ‘n’ime mmụọ’ ma ọ bụ ‘site na mmụọ.’ Grik akọwaghị kpọmkwem ma ‘mmụọ’ ọ̀ bụ Mmụọ Nsọ, mmụọ onye na-ekwu okwu, ka ọ bụ okwu ime mmụọ.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya ‘bụọ abụ’ ma ọ bụ ‘kpọọ ụda abụ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: τί οὖν ἐστιν;
  choice: Gịnịzi ka a ga-eme?
  rationale: Ajụjụ a na-achọ nkwubi okwu bara uru n’ihe Pọl na-ekwu; nsụgharị a bụ Igbo ebumpụta ụwa ma na-ewepụta ọrụ okwu Grik ahụ karịa nsụgharị mkpụrụokwu nkịtị.
- source_word: προσεύξομαι
  choice: Aga m ... kpee ekpere
  rationale: Ọdịnihu nke προσεύχομαι pụtara n'ụzọ kwụ ọtọ na onye na-ekwu okwu ga-ekpe ekpere.
- source_word: τῷ πνεύματι
  choice: eji mmụọ
  rationale: ‘Eji’ na-egosipụta ike dative ahụ ma debe njikọ yiri ibe ya n’etiti mmụọ na uche, n’akọwaghị ma ọ bụ Mmụọ Nsọ, mmụọ mmadụ, ka ọ bụ okwu ime mmụọ.
- source_word: τῷ νοΐ
  choice: eji uche
  rationale: ‘Uche’ na-ezo aka n’ike mmadụ ji aghọta ma chee echiche; ọ na-emekwa ka ọdịiche ya na ‘mmụọ’ doo anya.
- source_word: ψαλῶ
  choice: Aga m ... bụọ abụ otuto
  rationale: N’ọnọdụ ofufe a, ψάλλω pụtara ịbụ abụ e ji eto Chineke; okwu a doro ndị na-agụ Igbo nke oge a anya.
- source_word: δὲ καὶ
  choice: ma aga m ejikwa
  rationale: 'Nke a na-egosipụta mgbakwunye nwere obere ọdịiche: ọ bụghị naanị otu ụzọ, kama ụzọ nke ọzọ kwa.'
theological_decisions:
- issue: Ihe πνεῦμα pụtara n’ọdịiche dị n’etiti mmụọ na uche
  choice: E dere ya naanị dị ka ‘mmụọ,’ n’akọwaghị onye ma ọ bụ ụdị mmụọ ọ bụ.
  alternative: Mmụọ Nsọ; mmụọ m; ma ọ bụ mmụọ mmadụ nke Mmụọ Nsọ na-akpali
  rationale: Ihe odide Grik anaghị ekwu kpọmkwem ma ọ bụ Mmụọ Nsọ, mmụọ onye na-ekwu okwu, ka ọ bụ okwu ime mmụọ. Ide naanị ‘mmụọ’ na-echekwa mgbagwoju anya na esemokwu nkà mmụta okpukpe dị n’isiokwu a.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E jigidere usoro abụọ yiri ibe ha—‘eji mmụọ’ na ‘eji uche’—iji gosipụta nhazi na ọdịiche nke Grik. E tinyere akara ala ala peeji niile n’ahịrịokwu bụ isi.
