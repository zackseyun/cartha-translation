id: 1CO.14.10
reference: 1 Corinthians 14:10
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τοσαῦτα εἰ τύχοι γένη φωνῶν ⸀εἰσιν ἐν κόσμῳ, καὶ ⸀οὐδὲν ἄφωνον·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/010.yaml
  text: There are perhaps many kinds of languages in the world[a], and none is without meaning.
translation:
  language: ig
  text: Ikekwe, e nwere ọtụtụ ụdị asụsụ n’ụwa[a], ọ dịghịkwa nke na-enweghị ihe ọ pụtara.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Ikekwe, e nwere ọtụtụ ụdị ụda n’ụwa, ọ dịghịkwa nke na-enweghị ụda.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τοσαῦτα
  choice: ọtụtụ
  rationale: Ọ na-egosi ọnụ ọgụgụ buru ibu n'ụzọ dị mfe ma kwekọọ n'Igbo nkịtị, na-enweghị ịkọwa ọnụ ọgụgụ kpọmkwem.
- source_word: εἰ τύχοι
  choice: Ikekwe
  rationale: Ọ na-echekwa ụda okwu nke na-eme ka nkwupụta ahụ ghara ịbụ nke siri ike kpamkpam.
- source_word: γένη
  choice: ụdị
  rationale: “Ụdị” bụ okwu Igbo doro anya maka ìgwè ma ọ bụ ụdị dị iche iche.
- source_word: φωνῶν
  choice: asụsụ
  rationale: N'okwu gbara amaokwu a gburugburu, φωναί na-ezo aka n'ụdị okwu mmadụ na-ekwu nke nwere ihe ọ pụtara; “asụsụ” na-eme ka echiche ahụ doo onye na-agụ Igbo anya, ebe e debere “ụda” dị ka ụzọ ọzọ na nkọwa ala peeji.
- source_word: ἐν κόσμῳ
  choice: n’ụwa
  rationale: Nke a bụ ntụgharị kpọmkwem na nke e ji eme ihe n'Igbo maka ụwa mmadụ bi na ya.
- source_word: οὐδὲν ἄφωνον
  choice: ọ dịghịkwa nke na-enweghị ihe ọ pụtara
  rationale: N'ihe gbasara asụsụ na nkwurịta okwu, nkebi a na-egosi na ọ dịghị nke na-enweghị ihe ọ na-ezipụta; ntụgharị a na-enye nghọta ahụ n'Igbo eke, ebe a na-echekwa oyiyi nkịtị nke “enweghị ụda” na nkọwa ala peeji.
theological_decisions: []
translation_notes:
  register: Igbo ọkọlọtọ, dị ugbu a ma dị ugwu. Ahịrịokwu ahụ dị mfe nghọta nye ndị nkịtị, ma nkọwa ala peeji na-echekwa obosara na ihe mgbagwoju anya nke φωνῶν na ἄφωνον.
