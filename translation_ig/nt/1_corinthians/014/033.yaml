source:
  edition: SBLGNT
  text: οὐ γάρ ἐστιν ἀκαταστασίας ὁ θεὸς ἀλλὰ εἰρήνης), ὡς ἐν πάσαις ταῖς ἐκκλησίαις τῶν ἁγίων.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/033.yaml
  text: For God is not a God of disorder but of peace[b][a], as in all the churches of the saints.
translation:
  language: ig
  text: N’ihi na Chineke abụghị Chineke nke ọgbaaghara[a] kama ọ bụ Chineke nke udo, dị ka ọ dị n’ime chọọchị niile nke ndị nsọ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “N’ihi na Chineke abụghị Chineke nke mgbagwoju anya, kama ọ bụ Chineke nke udo.”
    reason: lexical_alternative
  - marker: b
    text: Ụfọdụ na-ejikọta nkebiokwu a na amaokwu na-esonụ kama ijikọ ya na amaokwu a.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀκαταστασίας
  choice: ọgbaaghara
  rationale: “Ọgbaaghara” na-egosi enweghị usoro na ndakpọ nke ịdị n’otu n’ofufe ọgbakọ; ọ naghị amachi okwu ahụ naanị n’ọgba aghara nke uche.
- source_word: εἰρήνης
  choice: udo
  rationale: “Udo” bụ okwu Igbo a na-ejikarị sụgharịa εἰρήνη, ma n’ebe a ọ na-emegide ọgbaaghara ma na-egosi ịdị n’usoro na ịdị n’otu.
- source_word: ὁ θεὸς
  choice: Chineke
  rationale: “Chineke” bụ aha doro anya, nke onwe, kwekọrọ n’ụzọ Igbo si ekwu okwu.
- source_word: ὡς
  choice: Otú ahụ ka ọ dị
  rationale: Nkebiokwu a na-egosipụta ntụnyere ma ọ bụ ihe a na-ahụ n’ọgbakọ niile, ma na-ahapụ njikọ ya na ihe bu ya ụzọ ka ọ pụta ìhè.
- source_word: ἐκκλησίαις
  choice: chọọchị
  rationale: “Chọọchị” bụ okwu a maara nke ọma n’Igbo maka ọgbakọ Ndị Kraịst dị iche iche n’ebe a.
- source_word: τῶν ἁγίων
  choice: nke ndị nsọ
  rationale: “Ndị nsọ” na-echekwa aha Pọl na-akpọ ndị kwere ekwe nakwa olu nkà mmụta okpukpe nke okwu Grik ahụ.
- source_word: γάρ
  choice: N’ihi na
  rationale: Ọ na-egosi na okwu a bụ ihe kpatara ntụziaka ndị bu ya ụzọ gbasara ikwu okwu n’usoro n’ọgbakọ.
theological_decisions:
- issue: Njikọ nke nkebiokwu ὡς ἐν πάσαις ταῖς ἐκκλησίαις τῶν ἁγίων
  choice: Ejikọtara ya na amaokwu 33 dị ka ntụnyere gbasara ihe dị n’ọgbakọ niile
  alternative: A pụrụ ijikọ ya na amaokwu 34 ka ọ bụrụ mmalite nke ahịrịokwu na-esonụ
  rationale: Akara edemede SBLGNT nyere na-akwado ijikọ ya na amaokwu 33, ma usoro okwu Grik nwekwara ike ikwe ka e jikọta ya na amaokwu na-esonụ; ya mere, e debere nke ọzọ n’okpuru peeji kama idozi esemokwu ahụ n’ime isiokwu.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “Ọgbaaghara” dabara n’ọnọdụ ofufe ọgbakọ, ebe “ndị nsọ” na-echekwa okwu Pọl a na-ahụkarị. E kewara ahịrịokwu ikpeazụ ntakịrị iji mee ka Igbo daa nke ọma n’enweghị iwepụ njikọ ya na ihe bu ya ụzọ.
