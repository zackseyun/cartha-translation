  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὥστε, ἀδελφοί ⸀μου, ζηλοῦτε τὸ προφητεύειν, καὶ τὸ λαλεῖν ⸂μὴ κωλύετε γλώσσαις⸃·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/039.yaml
  text: So then[a], my brothers, be eager to prophesy, and do not forbid speaking in tongues.
translation:
  language: ig
  text: Ya mere, ụmụnna m[a], gbasienụ mbọ ike ibu amụma, unu egbochila ikwu okwu n'asụsụ dị iche iche.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ụmụnne m ndị nwoke na ndị nwanyị.” Okwu Grik ahụ bụ ụdị ọtụtụ nke nwoke, ma ọ pụrụ ịbụ okwu a na-eji akpọ ọgbakọ niile, gụnyere ndị nwanyị.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: Ya mere
  rationale: Njikọ a na-egosi nkwubi okwu sitere n'ihe a kọwara tupu amaokwu a; “Ya mere” na-enye nghọta ahụ n'Igbo nkịtị.
- source_word: ἀδελφοί μου
  choice: ụmụnna m
  rationale: Ọ bụ okwu a na-akpọ ndị mmadụ ozugbo, tinyere nnọchiaha “m.” “Ụmụnna” bụ ụzọ Igbo si akpọ ndị otu obodo okwukwe, ọ pụkwara ịgụnye ndị nwoke na ndị nwanyị dịka ọnọdụ siri dị.
- source_word: ζηλοῦτε
  choice: gbasienụ mbọ ike
  rationale: Ngwaa iwu dị ugbu a na-akpọ ha ka ha nọgide jiri ịnụ ọkụ n'obi na-achọ ihe a; okwu a bụ nke doro anya ma bụrụkwa Igbo a na-asụ ugbu a.
- source_word: τὸ προφητεύειν
  choice: ibu amụma
  rationale: Nke a na-egosi ọrụ ikwupụta ozi amụma; ntụgharị a na-edobe ya dịka ihe a gwara ha ka ha gbasie mbọ ike ime.
- source_word: μὴ κωλύετε
  choice: unu egbochikwala
  rationale: Ọ bụ iwu na-amachibido igbochi omume ahụ. “Egbochikwala” na-eburu echiche nke ịghara igbochi ma ọ bụ machibido ya.
- source_word: τὸ λαλεῖν γλώσσαις
  choice: ikwu okwu n'asụsụ dị iche iche
  rationale: Akụkụ a na-ezo aka n'omume a na-atụle n'isiakwụkwọ ahụ. “Asụsụ dị iche iche” na-edobe ohere okwu γλώσσαις nwere, na-enweghị ịkọwa n'ụzọ ga-emechi esemokwu dị na ya.
theological_decisions:
- issue: Ma ἀδελφοί ọ na-akpọ naanị ndị nwoke ka ọ bụ ọgbakọ niile
  choice: ụmụnna m
  alternative: ụmụnne m ndị nwoke na ndị nwanyị
  rationale: Ụdị Grik bụ ọtụtụ nke nwoke, ma n'ọnọdụ akwụkwọ ozi a ọ pụrụ ịbụ okwu nnọchiteanya a na-akpọ ọgbakọ niile. “Ụmụnna” bụ okwu Igbo sitere n'okike nke nwere ike ịgụnye mmadụ niile; ihe odide ala peeji na-eme ka nke a pụta ìhè na-enweghị itinye nkọwa sara mbara n'ime ederede.
- issue: Ihe γλώσσαις pụtara n'okwu a
  choice: asụsụ dị iche iche
  alternative: ire dị iche iche
  rationale: γλῶσσα pụrụ ịpụta ire ma ọ bụ asụsụ. N'ọnọdụ ikwu okwu, “asụsụ dị iche iche” bụ Igbo doro anya ma na-ezere ịkọwa ọdịdị ahụmahụ ahụ karịa ka ederede si kwuo.
translation_notes:
  register: 'E ji Standard Igbo dị ugbu a, nke nwere ugwu ma dị mfe nghọta. A họọrọ “ụmụnna” dịka okwu sitere n''okike n''okwu ọgbakọ; ihe odide ala peeji kọwara na ọ pụrụ ịgụnye ụmụ nwoke na ụmụ nwanyị. Usoro ahịrịokwu ahụ na-edobe iwu abụọ nke Grik: ịchọsi ibu amụma ike na ịghara igbochi ikwu okwu n''asụsụ dị iche iche.'
