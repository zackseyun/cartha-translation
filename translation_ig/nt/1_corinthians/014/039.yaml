review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the inferential force of ὥστε, the possessive vocative ἀδελφοί μου, the exhortation to pursue prophesying, and the prohibition concerning speaking in tongues/languages. “N'asụsụ dị iche iche” is a defensible rendering of γλώσσαις in this context and does not settle the debated nature of the speech. However, “egbochikwala” can naturally carry a discontinuative sense (‘do not stop/prevent any longer’) that is not explicit in the Greek. A plain negative prohibition is preferable.
  naturalness: The sentence is clear Standard Igbo and maintains an appropriate pastoral-apostolic register. Replacing “unu egbochikwala” with “unu egbochila” gives a more direct and idiomatic prohibition without the possible added temporal nuance.
  terminology: “Ụmụnna m” is natural in Igbo Christian usage and can address the congregation collectively. “Ibu amụma” appropriately renders προφητεύειν. “Ikwu okwu n'asụsụ dị iche iche” remains suitably neutral for γλώσσαις; no doctrinal interpretation is introduced.
  issues:
  - severity: low
    issue: The negative imperative “unu egbochikwala” may imply ‘do not prevent/stop any longer.’
    rationale: The Greek μὴ κωλύετε is a straightforward prohibition and contains no explicit ‘any longer’ or discontinuative element. “Unu egbochila” is more semantically neutral and direct.
