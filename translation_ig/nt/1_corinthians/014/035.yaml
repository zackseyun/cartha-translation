id: 1CO.14.35
reference: 1 Corinthians 14:35
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἰ δέ τι ⸀μαθεῖν θέλουσιν, ἐν οἴκῳ τοὺς ἰδίους ἄνδρας ἐπερωτάτωσαν, αἰσχρὸν γάρ ἐστιν γυναικὶ ⸂λαλεῖν ἐν ἐκκλησίᾳ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/035.yaml
  text: But if they want to learn anything[a], let them ask their own husbands at home[b], for it is shameful for a woman to speak in the assembly.
translation:
  language: ig
  text: Ma ọ bụrụ na ha chọrọ ịmụ ihe ọ bụla, ka ha jụọ ndị di ha n’ụlọ, n’ihi na ọ bụ ihe ihere ka nwanyị[a] kwuo okwu n’ọgbakọ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “nwunye.” Okwu Grik ahụ nwere ike ịpụta “nwanyị” ma ọ bụ “nwunye,” dịka ọnọdụ okwu si dị.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “n’ụka” ma ọ bụ “n’etiti nzukọ ndị kwere ekwe.” Okwu Grik ahụ na-ezo aka ná ndị zukọrọ ọnụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: μαθεῖν
  choice: ịmụ
  rationale: Ọ na-egosi ịmụ ma ọ bụ ịmata ihe; “ịmụ” bụ okwu Igbo doro anya ma kwekọọ kpọmkwem n’ebe a.
- source_word: ἐν οἴκῳ
  choice: n’ụlọ
  rationale: N’Igbo nkịtị, “n’ụlọ” na-egosi ebe obibi ma na-echekwa ọdịiche dị n’etiti ụlọ na nzukọ ọgbakọ.
- source_word: τοὺς ἰδίους ἄνδρας
  choice: ndị di ha
  rationale: N’agbanyeghị na ἀνήρ pụrụ ịpụta nwoke ma ọ bụ di, ἰδίους na ọnọdụ ezinụlọ ebe a na-akwado nghọta ya dịka “ndị di ha.”
- source_word: ἐπερωτάτωσαν
  choice: ka ha jụọ
  rationale: Nke a na-echekwa ike iwu dị na ngwaa Grik ma bụrụkwa okwu Igbo e ji eme ihe n’ụzọ ebumpụta ụwa.
- source_word: αἰσχρὸν
  choice: ihe ihere
  rationale: “Ihe ihere” na-echekwa mmetụta mmekọrịta mmadụ na omume nke okwu Grik ahụ n’enweghị ime ka ọ dị nro.
- source_word: γυναικὶ
  choice: ka nwanyị
  rationale: γυνή pụrụ ịpụta nwanyị ma ọ bụ nwunye. “Nwanyị” bụ nhọrọ sara mbara n’ahịrị bụ isi, ebe nkọwa ala peeji na-echekwa nhọrọ “nwunye.”
- source_word: λαλεῖν
  choice: kwuo okwu
  rationale: Nke a bụ ụzọ Igbo doro anya na nke kwesịrị ekwesị isi sụgharịa okwu sara mbara nke pụtara ikwu okwu, n’enweghị ịkọwa ụdị okwu ahụ karịa ihe Grik kwuru.
- source_word: ἐν ἐκκλησίᾳ
  choice: n’ọgbakọ
  rationale: N’ebe a ἐκκλησία na-ezo aka ná ndị zukọrọ; “ọgbakọ” na-egosipụta nzukọ ahụ n’enweghị itinye echiche ụlọ ụka ma ọ bụ nzukọ okpukpe dịka ụlọ ọrụ.
theological_decisions:
- issue: Ókè mmachibido iwu banyere nwanyị ikwu okwu
  choice: A sụgharịrị okwu ahụ dịka o si dị, n’akọwaghị n’ahịrị bụ isi otu ụdị okwu kpọmkwem ọ na-ekwu maka ya.
  alternative: Ịkọwa ya naanị dịka ajụjụ na-akpaghasị nzukọ, ikpe amụma, ma ọ bụ dịka okwu ndị Kọrịnt e hotara.
  rationale: Grik kwuru nanị banyere “ikwu okwu n’ọgbakọ.” Ebe okwu ndị ahụ n’onwe ha na-akọwaghị ókè kpọmkwem, nsụgharị ahụ na-echekwa mgbagwoju anya na esemokwu nkọwa ahụ kama idozi ya n’ime nsụgharị.
- issue: Ma γυνή/ἀνήρ pụtara nwanyị/nwoke ka ọ bụ nwunye/di
  choice: E ji “ndị di ha” sụgharịa ἄνδρας, ma jiri “nwanyị” sụgharịa γυναικί n’ahịrị bụ isi; e debere “nwunye” dịka nhọrọ n’ala peeji.
  alternative: Iji “nwunye…di” n’ebe abụọ ahụ, ma ọ bụ “nwanyị…ndị nwoke” n’ebe abụọ ahụ.
  rationale: “Ndị di ha” dabara nke ọma n’okwu “nke ha” na ọnọdụ ụlọ. Ma γυναικί nke na-esochi ya ka nwere ike ịbụ nwanyị n’ozuzu ma ọ bụ nwunye n’ọnọdụ a, ya mere e chekwara ụzọ nghọta abụọ ahụ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta, dee ya. “Kwuo okwu” na-echekwa obosara λαλεῖν; “ọgbakọ” na-elekwasị anya ná nzukọ ndị mmadụ karịa ụlọ ma ọ bụ usoro nzukọ dịka ụlọ ọrụ.
