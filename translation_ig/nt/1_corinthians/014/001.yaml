  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Διώκετε τὴν ἀγάπην, ζηλοῦτε δὲ τὰ πνευματικά, μᾶλλον δὲ ἵνα προφητεύητε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/001.yaml
  text: Pursue love[a], and earnestly desire the spiritual things[c][b], but especially that you may prophesy.
translation:
  language: ig
  text: Chụọnụ ịhụnanya, chọsienụ ihe ime mmụọ ike[a], ma karịchaa ka unu na-ebu amụma[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “onyinye ime mmụọ” ma ọ bụ “ihe ndị sitere n’aka Mmụọ.” Okwu Grik ahụ sara mbara karịa “onyinye,” ọ bụ ezie na ihe a na-ekwu n’isi nke 12–14 bụ ngosipụta ndị Mmụọ na-enye n’ọgbakọ.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya “ma kama nke ahụ, ka unu na-ebu amụma.”
    reason: alternative_reading
lexical_decisions:
- source_word: Διώκετε
  choice: Na-achụso
  rationale: Nke a na-egosi ịchụ ihe ike na ịnọgide na-agbaso ya, ọ bụghị naanị ịchọ ya obere oge.
- source_word: τὴν ἀγάπην
  choice: ịhụnanya
  rationale: “Ịhụnanya” bụ okwu Igbo doro anya ma na-ejikọ amaokwu a na isi nke 13.
- source_word: ζηλοῦτε
  choice: na-achọsikwa ... ike
  rationale: Nke a na-egosipụta ọchịchọ siri ike na ịnụ ọkụ n’obi nke ζηλόω nwere n’ebe a.
- source_word: τὰ πνευματικά
  choice: ihe ime mmụọ
  rationale: Ụdị okwu Grik a sara mbara karịa naanị “onyinye”; nsụgharị a na-echekwa obosara ahụ, ebe ihe gbara amaokwu ahụ gburugburu na-egosi ọrụ ma ọ bụ ngosipụta ndị Mmụọ na-enye n’ọgbakọ.
- source_word: μᾶλλον δὲ
  choice: ma nke ka nke
  rationale: Nke a na-echekwa ma ntụgharị δὲ ma nkwusi ike na ntụnyere nke μᾶλλον.
- source_word: ἵνα προφητεύητε
  choice: ka unu na-ebu amụma
  rationale: “Ka unu” na-echekwa usoro ἵνα na subjunctive dị ka ihe ha kwesịrị ịchọsi ike; “na-ebu amụma” bụ okwu Akwụkwọ Nsọ a na-aghọta nke ọma.
theological_decisions:
- issue: Ogologo ihe τὰ πνευματικά pụtara
  choice: ihe ime mmụọ
  alternative: onyinye ime mmụọ; ihe ndị sitere n’aka Mmụọ
  rationale: Okwu Grik ahụ bụ adjective neuter plural e ji mee noun, ya mere ọ pụtara ihe ime mmụọ n’ụzọ sara mbara. Isi nke 12–14 na-elekwasị anya na ngosipụta ma ọ bụ onyinye ndị Mmụọ, ma ederede n’onwe ya ekwughị okwu Grik pụtara “onyinye.”
- issue: Ike ntụnyere μᾶλλον δὲ
  choice: ma nke ka nke
  alternative: kama nke ahụ
  rationale: Nke a na-egosi na Pọl na-enye ibu amụma ọnọdụ pụrụ iche n’etiti ihe ime mmụọ, n’emeghị ka o doo anya karịa Grik ma ọ na-ekwu “karịchaa” ma ọ bụ “kama nke ahụ.”
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. Usoro “na-achụso” na “na-achọsi ... ike” na-enye iwu ndị a mmetụta nke omume a ga-anọgide na-eme; “ihe ime mmụọ” na-echekwa obosara na ntakịrị mgbagwoju anya dị n’okwu Grik.
