  to: Chụọnụ ịhụnanya, chọsienụ ihe ime mmụọ ike[a], ma karịchaa ka unu na-ebu amụma[b].
  rationale: The revision corrects the misplaced lexical-footnote anchor and uses more natural plural imperative forms. It retains the source’s broad wording for τὰ πνευματικά, the comparative emphasis of μᾶλλον δὲ, and the established biblical expression “ibu amụma.”
