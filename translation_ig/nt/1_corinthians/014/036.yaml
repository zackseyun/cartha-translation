source:
  edition: SBLGNT
  text: ἢ ἀφ’ ὑμῶν ὁ λόγος τοῦ θεοῦ ἐξῆλθεν, ἢ εἰς ὑμᾶς μόνους κατήντησεν;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/036.yaml
  text: Or did the word of God go out from you[b][a], or has it reached only you?
translation:
  language: ig
  text: Ọ̀ bụ n’aka unu ka okwu Chineke siri pụta,[a] ka ọ̀ bụ naanị unu ka ọ rutere?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Ọ̀ bụ n’aka unu ka okwu Chineke sitere?”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “Ka ọ̀ bụ naanị unu ka ọ bịakwutere?”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἢ
  choice: Ka ọ̀ bụ na ... ka ọ̀ bụkwa
  rationale: Usoro a na-egosipụta ajụjụ abụọ ἢ ... ἢ nke Pọl ji baara ha mba n’ụzọ ajụjụ, n’Igbo dị nfe ma doo anya.
- source_word: ἀφ’ ὑμῶν
  choice: n’aka unu ... si
  rationale: N’aka ... si na-egosi ebe ihe siri malite ma ọ bụ pụta, kwekọrọ na ἀπό tinyere genitive, na-enweghị ịkọwapụta karịa ihe Grik kwuru.
- source_word: ὁ λόγος τοῦ θεοῦ
  choice: okwu Chineke
  rationale: 'Nke a bụ ntụgharị Igbo a na-ahụkarị nke na-edobe ịdị obosara nke okwu ahụ: ọ pụrụ izo aka n’ozi Chineke, ozi ọma, ma ọ bụ nkuzi sitere n’aka Chineke.'
- source_word: ἐξῆλθεν
  choice: pụtara
  rationale: ‘Pụtara’ na-edobe ihe oyiyi nke okwu ahụ isi n’ebe pụta; ya na ‘n’aka unu ... si’ na-egosikwa ajụjụ banyere ma okwu Chineke ò sitere n’aka ha.
- source_word: εἰς ὑμᾶς μόνους
  choice: naanị unu ka
  rationale: ‘Naanị unu’ na-edobe nkwusi ike nke μόνους na echiche na ndị Kọrịnt abụghị naanị ha natara okwu ahụ.
- source_word: κατήντησεν
  choice: rutere
  rationale: ‘Rutere’ bụ okwu Igbo kwụ ọtọ maka iru ebe a na-aga, kwekọrọ n’echiche καταντάω nke ịbịarute ma ọ bụ iru.
theological_decisions:
- issue: Ihe ‘okwu Chineke’ na-ezo aka na ya
  choice: E debere ya dịka ‘okwu Chineke’ n’enweghị imechi ihe ọ pụtara.
  alternative: Ịkpọ ya kpọmkwem ‘ozi ọma’ ma ọ bụ ‘okwu amụma n’ọgbakọ.’
  rationale: N’ebe a, Pọl na-ajụ ndị Kọrịnt ma hà bụ isi mmalite ma ọ bụ naanị ndị natara ozi Chineke. Grik anaghị amanye ka e were ya naanị dịka ozi ọma ma ọ bụ naanị okwu amụma, ya mere ntụgharị ahụ na-edobe obosara na esemokwu nkọwa ahụ.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji usoro ‘Ka ọ̀ bụ ... ka ọ̀ bụkwa ...?’ chekwaa ajụjụ ịba mba nke amaokwu ahụ. Akara ụda dị mkpa ka e tinyere n’ebe ha na-enyere aka ịmata ụdị ajụjụ ahụ, ma e zere asụsụ siri ike ma ọ bụ nke otu ụka pụrụ iche.
