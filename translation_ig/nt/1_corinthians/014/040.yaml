  text: πάντα ⸀δὲ εὐσχημόνως καὶ κατὰ τάξιν γινέσθω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/040.yaml
  text: But let everything be done decently and in order[a].
translation:
  language: ig
  text: Ma ka e mee ihe niile n'ụzọ kwesịrị ekwesị, nakwa n'usoro[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “n'ụzọ dabara adaba”; okwu Grik ahụ pụtara ihe kwesịrị ma ọ bụ kwekọrọ n'ọnọdụ ahụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα
  choice: ihe niile
  rationale: Na-egosi ihe niile a na-eme n'ọgbakọ n'ozuzu ya, ma na-asụ Igbo nke ọma.
- source_word: δὲ
  choice: Ma
  rationale: Na-egosi obere ntụgharị ma ọ bụ ọdịiche site n'ihe ndị bu ya ụzọ gaa n'iwu nchịkọta a.
- source_word: εὐσχημόνως
  choice: n'ụzọ kwesịrị ekwesị
  rationale: Na-egosi omume dabara adaba, kwesịkwara ọnọdụ ahụ; ọ bụ okwu Igbo doro anya ma dị ugwu.
- source_word: κατὰ τάξιν
  choice: n'usoro
  rationale: Na-echekwa echiche nke ime ihe dịka nhazi ma ọ bụ usoro kwesịrị ekwesị si dị.
- source_word: γινέσθω
  choice: ka e mee
  rationale: Na-enye iwu onye nke atọ dị n'okwu Grik n'ụzọ Igbo dị mfe ma bụrụkwa eke.
theological_decisions:
- issue: Oke iwu Pọl n'ọnọdụ ofufe ọgbakọ
  choice: Iwu izugbe ka omume niile n'ọgbakọ bụrụ nke dabara adaba ma gaa n'usoro, n'enweghị ịkọwa otu usoro ofufe nke ụka ọ bụla.
  alternative: Ịghọta ya dị ka iwu maka otu usoro ofufe a kapịrị ọnụ, ma ọ bụ dị ka ụkpụrụ gbasara omume ụka niile n'ebe niile.
  rationale: Amaokwu ahụ na-achịkọta mkparịta ụka dị ya nso banyere ikwu okwu na usoro n'ọgbakọ. Nsụgharị ahụ na-ahapụ oke okwu Grik ka ọ dị, ma ọ naghị ebubata usoro nke otu ụka.
translation_notes:
  register: Igbo Izugbe nke oge a, dị mfe nghọta ma dị ugwu. E jiri “n'ụzọ kwesịrị ekwesị” zere nghọtahie nwere ike isi n'okwu ndị na-elekwasị naanị n'omume ọma pụta, ma chekwaa echiche nke ihe dabara adaba n'ọgbakọ.
