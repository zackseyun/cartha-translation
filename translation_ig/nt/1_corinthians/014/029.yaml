  text: προφῆται δὲ δύο ἢ τρεῖς λαλείτωσαν, καὶ οἱ ἄλλοι διακρινέτωσαν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/029.yaml
  text: Let two or three prophets speak[a], and let the others weigh what is said.
translation:
  language: ig
  text: Ka ndị amụma abụọ ma ọ bụ atọ kwuo okwu, ka ndị ọzọ tụleekwa ihe e kwuru.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “kpee ikpe,” “mata ọdịiche,” ma ọ bụ “nyochaa.” N’ebe a, okwu Grik ahụ nwere ike ịpụta iji nlezianya tụlee okwu amụma.
    reason: lexical_alternative
lexical_decisions:
- source_word: προφῆται
  choice: ndị amụma
  rationale: Ọ bụ nsụgharị kpọmkwem nke aha ahụ, na-akọwa ndị na-ekwu okwu amụma n’ọgbakọ.
- source_word: δὲ
  choice: ka
  rationale: N’ebe a, δέ na-eme njikọ dị nro n’etiti ntụziaka ndị na-aga n’ihu; usoro ahịrịokwu Igbo nke ji ‘ka’ malite na-enye ntụziaka ahụ n’ụzọ eke n’enweghị ime ka ọdịiche ya sie ike karịa nke Grik.
- source_word: δύο ἢ τρεῖς
  choice: abụọ ma ọ bụ atọ
  rationale: A nọgidere na-enwe ọnụ ọgụgụ na nhọrọ dị n’akwụkwọ Grik n’ụzọ doro anya.
- source_word: λαλείτωσαν
  choice: ka ... kwuo okwu
  rationale: Nke a na-egosipụta iwu onye nke atọ n’ụzọ Igbo dị ugbu a ma dịkwa mfe nghọta.
- source_word: οἱ ἄλλοι
  choice: ndị ọzọ
  rationale: Nhọrọ a na-edobe njirimara ndị ahụ ghe oghe dịka Grik si mee, n’akọwaghị ma hà bụ ndị amụma ndị ọzọ, ndị ndu, ma ọ bụ ọgbakọ ahụ.
- source_word: διακρινέτωσαν
  choice: ka ... tụleekwa ihe e kwuru
  rationale: N’ọnọdụ a, okwu ahụ pụtara iji nlezianya nyochaa ma chọpụta ihe okwu amụma ahụ bụ, ọ bụghị ikpe ọmụma. ‘Tụlee ihe e kwuru’ na-enye echiche a n’Igbo eke.
theological_decisions:
- issue: Ndị ‘ndị ọzọ’ bụ ndị ole n’ọgbakọ ahụ
  choice: E dere ya naanị dịka ‘ndị ọzọ.’
  alternative: ‘ndị amụma ndị ọzọ’ ma ọ bụ ‘ndị ọzọ niile nọ n’ọgbakọ’
  rationale: Grik akọwaghị ndị ọ na-ekwu maka ha kpọmkwem; ya mere, nsụgharị ahụ na-edobe nghọta ahụ ghe oghe kama idozi ajụjụ gbasara ọrụ ndị nọ n’ọgbakọ.
- issue: Ụdị nyocha e nyere n’iwu
  choice: ‘tụlee ihe e kwuru’
  alternative: ‘kpee ikpe,’ ‘ghọta nke ọma,’ ma ọ bụ ‘nyochaa’
  rationale: διακρίνω n’ebe a nwere ike ịpụta ikpebi, ịmata ọdịiche, ma ọ bụ inyocha okwu amụma. Nhọrọ ahụ na-egosi nyocha nwere uche ma ghara ime ka ọ bụrụ ikpe ọmụma.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Usoro ‘ka ... kwuo ... ka ... tụleekwa’ na-edobe ike ntụziaka nke ngwaa iwu Grik, ebe ‘ndị ọzọ’ na-echekwa ihe odide ahụ na-akọwaghị kpọmkwem.
