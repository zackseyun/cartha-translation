id: 1CO.14.21
reference: 1 Corinthians 14:21
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐν τῷ νόμῳ γέγραπται ὅτι Ἐν ἑτερογλώσσοις καὶ ἐν χείλεσιν ⸀ἑτέρων λαλήσω τῷ λαῷ τούτῳ, καὶ οὐδ’ οὕτως εἰσακούσονταί μου, λέγει κύριος.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/021.yaml
  text: 'In the Law it is written: “By people of other tongues and by the lips of foreigners I will speak to this people[d][c][b][a], and not even in this way will they listen to me,” says the Lord.'
translation:
  language: ig
  text: 'N’Iwu ahụ, e dere, sị: “M ga-eji asụsụ ndị mba ọzọ na egbugbere ọnụ ndị mba ọzọ gwa ndị mmadụ a okwu[a]; ma ọbụna n’ụzọ dị otu a, ha agaghị ege m ntị[b],” ka Onyenwe anyị na-ekwu.[c][d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “M ga-eji asụsụ ndị ọzọ na egbugbere ọnụ ndị ọzọ gwa ndị mmadụ a okwu.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ha agaghị aṅa m ntị.”
    reason: lexical_alternative
  - marker: c
    text: Okwu e hotara ebe a sitere n’Aịzaya 28:11–12.
    reason: cross_reference
  - marker: d
    text: Ebe ọ bụ Chineke Izrel na-ekwu okwu n’ebe a, ụfọdụ ntụgharị na-ede “ka ONYENWE ANYỊ na-ekwu,” iji gosi ndabere Hibru nke okwu ahụ.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν τῷ νόμῳ
  choice: N’Iwu ahụ
  rationale: “Iwu ahụ” na-edobe ụzọ Pọl si akpọ Akwụkwọ Nsọ ndị Juu Iwu, ọ bụ ezie na okwu a sitere n’Aịzaya, ọ bụghị n’akwụkwọ ise mbụ.
- source_word: γέγραπται
  choice: e dere
  rationale: Nke a bụ ụzọ Igbo doro anya ma bụrụkwa nke a na-ejikarị ewebata ihe e dere n’Akwụkwọ Nsọ.
- source_word: ἐν ἑτερογλώσσοις
  choice: M ga-eji ndị na-asụ asụsụ ndị ọzọ
  rationale: Ọ na-egosi ndị na-ekwu okwu n’asụsụ dị iche ma na-edobekwa njikọ okwu a na isiokwu banyere asụsụ dị iche iche n’amaokwu ndị gbara ya gburugburu.
- source_word: ἐν χείλεσιν ἑτέρων
  choice: na egbugbere ọnụ ndị mba ọzọ
  rationale: E debere ihe atụ nke egbugbere ọnụ; “ndị mba ọzọ” na-eme ka o doo anya na a na-ekwu banyere ndị asụsụ ha dị iche, ọ bụghị naanị ndị ọzọ n’ozuzu.
- source_word: λαλήσω
  choice: gwa ... okwu
  rationale: Nke a bụ okwu Igbo ebumpụta ụwa maka “I will speak to” ma na-edobe ọdịnihu nke ngwaa Grik.
- source_word: τῷ λαῷ τούτῳ
  choice: ndị a
  rationale: N’Igbo, “ndị a” bụ ụzọ dị mfe ma dị ndụ isi zoo aka n’otu ndị ahụ; ọ naghị agbanwe ha ka ha bụrụ mba.
- source_word: οὐδ’ οὕτως
  choice: ma ọbụna n’ụzọ dị otu a
  rationale: 'Ọ na-edobe nkwusi ike nke οὐδέ na οὕτως: ọbụna mgbe Chineke ji ụzọ a gwa ha okwu, ha agaghị aza ya.'
- source_word: εἰσακούσονταί μου
  choice: ha agaghị ege m ntị
  rationale: “Ige ntị” na-egosi ịnụ ihe nke ọma ma na-enye ohere maka echiche nke ịṅa ntị ma ọ bụ irube isi, n’enweghị ịmanye naanị otu n’ime ha.
- source_word: λέγει κύριος
  choice: ka Onyenwe anyị na-ekwu
  rationale: “Na-ekwu” na-edobe oge ugbu a nke λέγει, ebe “Onyenwe anyị” bụ ntụgharị kwesịrị ekwesị nke κύριος n’ihe odide Grik.
theological_decisions:
- issue: Otu e si asụgharị κύριος n’okwu Akwụkwọ Nsọ ebe Chineke Izrel bụ onye na-ekwu okwu
  choice: Onyenwe anyị
  alternative: ONYENWE ANYỊ
  rationale: Ihe odide Grik nwere κύριος, ya mere isi ihe odide jiri “Onyenwe anyị.” N’ihi na okwu a na-ekwughachi Aịzaya, ebe ndabere Hibru na-ezo aka n’aha Chineke, e nyere “ONYENWE ANYỊ” dị ka ụzọ ọzọ n’okpuru peeji.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. A hapụrụ “Iwu ahụ” dị ka aha sara mbara Pọl ji ezo aka n’Akwụkwọ Nsọ, ma e debere ma ihe atụ nke “egbugbere ọnụ” ma esemokwu dị n’etiti naanị ịnụ ihe na ịṅa ntị n’ihe a na-ekwu.
