- from: 'N’Iwu ahụ, e dere, sị: “M ga-eji ndị na-asụ asụsụ ndị ọzọ na egbugbere ọnụ ndị mba ọzọ gwa ndị a okwu[a]; ma ọbụna n’ụzọ dị otu a, ha agaghị ege m ntị[b],” ka Onyenwe anyị na-ekwu.[c][d]'
  to: 'N’Iwu ahụ, e dere, sị: “M ga-eji asụsụ ndị mba ọzọ na egbugbere ọnụ ndị mba ọzọ gwa ndị mmadụ a okwu[a]; ma ọbụna n’ụzọ dị otu a, ha agaghị ege m ntị[b],” ka Onyenwe anyị na-ekwu.[c][d]'
  rationale: The revision restores a natural and source-sensitive parallelism between “other languages” and “lips of others/foreigners,” while preserving the literal lip imagery. It also renders “this people” explicitly as “ndị mmadụ a” and clarifies that the Isaiah note concerns a citation. No doctrinal interpretation has been added.
  reviewer_model: gpt-5.6-terra
