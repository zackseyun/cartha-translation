revisions:
- from: N’ihi na unu niile nwere ike ibu amụma n’otu n’otu[a], ka mmadụ niile wee mụta ihe, ka e wee gbaakwa mmadụ niile ume[b].
  to: N’ihi na unu niile nwere ike ibu amụma, otu onye n’otu oge[a], ka mmadụ niile mụta ihe ma ka e wee gbaa mmadụ niile ume[b].
  rationale: The revision makes the sequential meaning of καθ’ ἕνα explicit, while retaining “n’otu n’otu” as a viable lexical alternative. It also coordinates the two intended outcomes more naturally in Igbo, preserving the Greek repetition of πάντες and the passive sense of παρακαλῶνται. No doctrinal or referential scope beyond the Greek has been imposed.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T18:15:22Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys δύνασθε γὰρ, the repeated πάντες, προφητεύειν, and the purpose expressed by ἵνα. However, “n’otu n’otu” can naturally be heard as individually rather than the sequential sense required by καθ’ ἕνα in this setting. “Otu onye n’otu oge” more clearly preserves the intended orderly, successive sense.
  naturalness: The wording is generally clear Standard Igbo. A single coordinated purpose construction is smoother than repeating “ka” for the two coordinated Greek subjunctives.
  terminology: “Ịbu amụma” is an established and suitable rendering of προφητεύειν. “Ịgba ume” appropriately represents παρακαλῶνται without narrowing its semantic range; the alternatives in the footnote are useful.
  issues:
  - severity: medium
    issue: Sequential force of καθ’ ἕνα is not fully explicit
    rationale: Although “n’otu n’otu” can mean one by one, it may also suggest merely doing something individually. The Greek expression, in the immediate context of regulated congregational speech, specifically indicates one person at a time/in succession.
  - severity: low
    issue: Purpose clauses are less idiomatically coordinated than they could be
    rationale: Greek has one ἵνα clause with two coordinated verbs. Rendering the second result with “ma” gives a more natural Igbo coordination while retaining both repeated instances of πάντες.
  revised_text: N’ihi na unu niile nwere ike ibu amụma, otu onye n’otu oge[a], ka mmadụ niile mụta ihe ma ka e wee gbaa mmadụ niile ume[b].
