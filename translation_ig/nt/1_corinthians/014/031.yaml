  text: δύνασθε γὰρ καθ’ ἕνα πάντες προφητεύειν, ἵνα πάντες μανθάνωσιν καὶ πάντες παρακαλῶνται
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/031.yaml
  text: For you can all prophesy one by one[b][a], so that all may learn and all may be encouraged.
translation:
  language: ig
  text: N’ihi na unu niile nwere ike ibu amụma, otu onye n’otu oge[a], ka mmadụ niile mụta ihe ma ka e wee gbaa mmadụ niile ume[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’otu n’otu.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ka e wee dọọ mmadụ niile ọdụ,” ma ọ bụ “ka e wee kasie mmadụ niile obi.” Ngwaa Grik a nwere ike ịpụta ịgba ume, ịdọ ọdụ, ma ọ bụ ịkasi obi, dabere n’ọnọdụ ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: δύνασθε
  choice: unu nwere ike
  rationale: Ọ bụ ngwaa na-egosi ikike ma ọ bụ ihe ga-ekwe omume. “Unu nwere ike” bụ ụzọ Igbo nke oge a si ekwu ya nke ọma n’ime ntụziaka Pọl.
- source_word: γὰρ
  choice: N’ihi na
  rationale: Ọ na-ejikọta amaokwu a na ntụziaka bu ya ụzọ site n’inye ihe kpatara ya ma ọ bụ kọwaa ya.
- source_word: καθ’ ἕνα
  choice: n’otu n’otu
  rationale: Nkebiokwu a pụtara ime ihe n’usoro, otu onye soro onye ọzọ, ọ bụghị mmadụ niile ikwu okwu n’otu oge.
- source_word: πάντες
  choice: niile / mmadụ niile
  rationale: E chekwara nkwugharị okwu ahụ ugboro atọ. N’ebe mbụ, “unu niile” dabara na ngwaa onye nke abụọ n’ọnụọgụ; n’ebe abụọ ndị ọzọ, “mmadụ niile” na-eme ka okwu ahụ doo anya n’Igbo n’ebughị ụzọ kpebie ònye kpọmkwem Pọl bu n’obi.
- source_word: προφητεύειν
  choice: ibu amụma
  rationale: Nke a na-echekwa aha ọrụ ime mmụọ Pọl ji mee ihe, kama ịkọwa ya n’ụzọ ga-eme ka ihe ọ pụtara dị warara.
- source_word: ἵνα
  choice: ka ... wee
  rationale: Ụdị a na-egosi nzube ma ọ bụ ihe ga-esi n’omume ahụ pụta n’Igbo eke.
- source_word: μανθάνωσιν
  choice: wee mụta ihe
  rationale: Ọ na-egosi na nzube okwu amụma a bụ ka ndị nọ n’ọgbakọ nweta mmụta.
- source_word: παρακαλῶνται
  choice: e wee gbaa ... ume
  rationale: παρακαλέω nwere ike ịpụta ịgba ume, ịdọ ọdụ, ma ọ bụ ịkasi obi. “Ịgba ume” na-ekpuchi echiche sara mbara nke iwulite ndị ọgbakọ n’ebe a, ebe nkọwa ala peeji na-echekwa ụzọ ndị ọzọ.
theological_decisions:
- issue: Oke ndị πάντες (“niile”) na-ezo aka na ha n’ime ntụziaka nye ọgbakọ
  choice: E chekwara “niile” ugboro atọ n’ebughị ụzọ kọwaa ya dị ka naanị ndị amụma ma ọ bụ ndị otu pụrụ iche.
  alternative: Ịsụgharị nke mbụ dị ka “ndị amụma niile” ma ọ bụ ịkọwa ebe ndị ọzọ n’ụzọ ga-eme ka ndị a na-ekwu maka ha dị warara.
  rationale: Nke mbụ nwere ike izo aka n’ebe ndị nwere ohere ibu amụma nọ, ebe abụọ ndị ọzọ na-elekwasị anya n’ebe ndị na-anụ okwu ahụ nọ. Ebe Grik akọwaghị oke ahụ kpọmkwem, ntụgharị ahụ hapụrụ ọnọdụ amaokwu ndị gbara ya gburugburu ka ọ kọwaa ya.
- issue: Uche sara mbara nke παρακαλῶνται
  choice: A sụgharịrị ya “e wee gbaa ... ume,” tinyekwa nhọrọ nke ịdọ ọdụ na ịkasi obi na nkọwa ala peeji.
  alternative: Ịhọrọ naanị “dọọ ọdụ” ma ọ bụ naanị “kasie obi.”
  rationale: N’ọnọdụ okwu amụma nke na-ewulite ọgbakọ, ngwaa ahụ nwere ike ibu echiche nke agbamume, ndụmọdụ siri ike, ma ọ bụ nkasi obi. A gaghị eme ka ọ bụrụ naanị otu n’ime ha n’enweghị ihe àmà doro anya.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E chekwara usoro nkwugharị “niile” na njikọ nzube “ka ... wee,” ebe e tinyere nhọrọ okwu ndị dị mkpa na nkọwa ala peeji.
