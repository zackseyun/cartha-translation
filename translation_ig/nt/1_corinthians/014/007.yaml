id: 1CO.14.7
reference: 1 Corinthians 14:7
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὅμως τὰ ἄψυχα φωνὴν διδόντα, εἴτε αὐλὸς εἴτε κιθάρα, ἐὰν διαστολὴν τοῖς φθόγγοις μὴ ⸀δῷ, πῶς γνωσθήσεται τὸ αὐλούμενον ἢ τὸ κιθαριζόμενον;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/007.yaml
  text: Even lifeless things that produce sound—whether flute or harp—if they do not give a distinction in the notes[a], how will what is played on the flute or on the harp be recognized?
translation:
  language: ig
  text: Ọbụna ihe ndị na-enweghị ndụ na-ada ụda—ma ọ̀ bụ ọjà ma ọ̀ bụ ụbọ akwara[a]—ọ bụrụ na ụda ha adịghị iche iche, olee otú a ga-esi amata ihe a na-akpọ n’ọjà ma ọ bụ n’ụbọ akwara?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ma ọ̀ bụ ọjà ma ọ̀ bụ une.” Okwu Grik bụ κιθάρα, bụ́ ngwá egwu oge ochie nwere eriri, nke yiri une karịa; e ji “ụbọ akwara” mee ihe n’ebe a ka ọ dịrị ndị na-agụ akwụkwọ mfe nghọta.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅμως
  choice: Ọbụna
  rationale: N’ebe a, okwu ahụ ji ike webata ihe atụ ọzọ; “Ọbụna” na-egosi na Pọl na-atụle ihe ndị na-enweghị ndụ kwa.
- source_word: τὰ ἄψυχα
  choice: ihe ndị na-enweghị ndụ
  rationale: Nke a bụ okwu doro ndị na-agụ Igbo nke oge a anya, ma na-echekwa echiche nke ihe na-adịghị ndụ.
- source_word: φωνὴν διδόντα
  choice: nke na-ada ụda
  rationale: Nke a bụ ụzọ Igbo si ekwu n'ụzọ ebumpụta ụwa na ihe ndị ahụ na-emepụta ụda.
- source_word: εἴτε αὐλὸς εἴτε κιθάρα
  choice: ma ọ̀ bụ ọjà ma ọ̀ bụ ụbọ akwara
  rationale: “Ọjà” dabara n’ụdị ngwá ikuku αὐλός, ebe “ụbọ akwara” na-egosi ngwá egwu nwere eriri nke κιθάρα bụ.
- source_word: ἐὰν διαστολὴν τοῖς φθόγγοις μὴ δῷ
  choice: ọ bụrụ na ụda ha adịghị iche iche
  rationale: Nke a na-egosi na ụda ma ọ bụ note dị iche iche ga-apụta ìhè ka e wee mata egwu ahụ, n’asụsụ Igbo dị mfe ma dị mma.
- source_word: πῶς γνωσθήσεται
  choice: olee otú a ga-esi amata
  rationale: Ụdị a na-echekwa ajụjụ na passive sense nke ihe a ga-amata ma ọ bụ ghọta site n’ụda ahụ.
- source_word: τὸ αὐλούμενον ἢ τὸ κιθαριζόμενον
  choice: ihe a na-akpọ n’ọjà ma ọ bụ n’ụbọ akwara
  rationale: Participles ndị a na-ezo aka n’ihe egwu a na-akpọ site na ngwá abụọ ahụ; ntụgharị a bụ nke ebumpụta ụwa n’Igbo ma chekwaa njikọ ahụ.
theological_decisions: []
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ chekwara ihe atụ nke ngwá egwu na ajụjụ mmechi nke isi mmalite Grik.
