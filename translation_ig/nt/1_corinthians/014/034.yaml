id: 1CO.14.34
reference: 1 Corinthians 14:34
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Αἱ ⸀γυναῖκες ἐν ταῖς ἐκκλησίαις σιγάτωσαν, οὐ γὰρ ⸀ἐπιτρέπεται αὐταῖς λαλεῖν· ἀλλὰ ⸀ὑποτασσέσθωσαν, καθὼς καὶ ὁ νόμος λέγει.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/034.yaml
  text: The women should keep silent in the churches[a], for they are not permitted to speak, but should be in submission[c][b], just as the law also says.
translation:
  language: ig
  text: Ka ụmụ nwanyị[a] gbachie nkịtị n’ọgbakọ ụka, n’ihi na a naghị ekwe ka ha kwuo okwu[b]; kama, ka ha doo onwe ha n’okpuru, dị ka iwu ahụ[c] na-ekwukwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị nwunye”; okwu Grik a sụgharịrị “ụmụ nwanyị” nwekwara ike ịpụta “ndị nwunye,” dabere n’ihe gbara ya gburugburu.
    reason: alternative_reading
  - marker: b
    text: Amaokwu a n’onwe ya akọwaghị ụdị okwu ọ na-ekwu maka ya; ụfọdụ na-aghọta ya n’ụzọ dị warara site n’ihe gbara amaokwu a gburugburu.
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “Iwu ahụ”; Pọl nwere ike na-ezo aka n’Iwu Mozis kpọmkwem, ma ọ bụ n’Akwụkwọ Nsọ n’echiche sara mbara.
    reason: alternative_reading
lexical_decisions:
- source_word: γυναῖκες
  choice: ụmụ nwanyị
  rationale: γυνή nwere ike ịpụta “nwanyị” ma ọ bụ “nwunye.” Ebe amaokwu a ekwughị kpọmkwem banyere ndị di, “ụmụ nwanyị” na-edobe nghọta sara mbara; e debere “ndị nwunye” dị ka nhọrọ ọzọ n’ala peeji.
- source_word: ἐκκλησίαις
  choice: n’ọgbakọ ụka
  rationale: N’ebe a, ἐκκλησία na-ezo aka n’ọgbakọ ndị Kraịst zukọtara ọnụ. “Ọgbakọ ụka” bụ okwu Igbo doro anya nke na-elekwasị anya n’ọgbakọ ahụ, ọ bụghị naanị n’ụlọ ụka.
- source_word: σιγάτωσαν
  choice: ka ... gbachie nkịtị
  rationale: Okwu iwu a na-akpọ ka e kwụsị ikwu okwu ma nọrọ jụụ n’ọnọdụ a kọwara. “Ka ... gbachie nkịtị” na-egosipụta ike iwu ahụ n’ụzọ Igbo sitere n’okike.
- source_word: ἐπιτρέπεται
  choice: a naghị ekwe ka
  rationale: Ụdị nnara a na-egosi na e nyeghị ikike. “A naghị ekwe ka” na-edobe ụdị okwu ahụ na-enweghị ịkpọ onye na-ajụ ikike aha.
- source_word: λαλεῖν
  choice: kwuo okwu
  rationale: λαλέω bụ okwu sara mbara maka ikwu okwu. “Kwuo okwu” na-edobe obosara ya ma ghara ịkọwapụta ụdị okwu a na-ekwu maka ya.
- source_word: ὑποτασσέσθωσαν
  choice: ka ha doo onwe ha n’okpuru
  rationale: Okwu iwu a na-egosi ido onwe onye n’okpuru ma ọ bụ ịnọ n’ọnọdụ nrubeisi. Nsụgharị a na-egosipụta ihe omume ahụ n’enweghị ịgbakwụnye onye a ga-edo onwe ha n’okpuru ya, ebe amaokwu ahụ ekwughị ya.
- source_word: νόμος
  choice: iwu ahụ
  rationale: νόμος nwere ike izo aka n’Iwu Mozis kpọmkwem ma ọ bụ n’Akwụkwọ Nsọ n’echiche sara mbara. “Iwu ahụ” na-ahapụ ajụjụ ahụ oghe, ebe nkọwa ala peeji na-egosi nhọrọ ndị ahụ.
- source_word: καθὼς καὶ ὁ νόμος λέγει
  choice: dị ka iwu ahụ kwukwara
  rationale: “Dị ka ... kwukwara” na-edobe ma ntụnyere καθὼς ma echiche mgbakwunye nke καί.
theological_decisions:
- issue: Ndị γυναῖκες na-ezo aka na ha
  choice: ụmụ nwanyị nọ n’ọgbakọ ụka
  alternative: ndị nwunye nọ n’ọgbakọ ụka
  rationale: Okwu Grik ahụ nwere ike ịpụta ụmụ nwanyị n’ozuzu ma ọ bụ ndị nwunye. N’ihi na amaokwu ahụ akpọghị ndị di aha, e jiri nghọta sara mbara mee isi nsụgharị ma debe nke ọzọ n’ala peeji.
- issue: Ókè mmachibido ikwu okwu ruru
  choice: e sụgharịrị “ikwu okwu” n’ụzọ sara mbara n’isi amaokwu
  alternative: okwu na-akpaghasị ọgbakọ, ma ọ bụ ikwu okwu mgbe a na-enyocha amụma
  rationale: Amaokwu Grik a n’onwe ya anaghị akọwa ụdị okwu a machibidoro. Ya mere, a gbakwụnyeghị nkọwa okpukpe a na-arụrịta ụka banyere ya n’isi nsụgharị.
- issue: Ihe ὁ νόμος pụtara
  choice: iwu ahụ
  alternative: Iwu Mozis kpọmkwem, ma ọ bụ Akwụkwọ Nsọ n’ozuzu
  rationale: Ihe Pọl na-ezo aka na ya kpọmkwem ka bụ ihe a na-arụrịta ụka. Nsụgharị ahụ na nkọwa ala peeji na-edobe ihe abụọ ahụ n’enweghị ikpebi nke ọ bụ.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke kwanyere ùgwù ma dị mfe nghọta. “Ọgbakọ ụka” na-eme ka ọnọdụ nzukọ ndị kwere ekwe pụta ìhè; a zere okwu ndị nwere ike itinye nkọwa ụka pụrụ iche n’ihe amaokwu ahụ hapụrụ oghe.
