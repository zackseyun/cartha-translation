  source_fidelity: 'Nsụgharị ahụ na-anọchi anya ọdịiche Pọl ji mee ihe nke ọma: a dọrọ aka ná ntị ka ndị a kpọrọ okwu ghara ịbụ ụmụaka n’echiche, ma ka ha bụrụ ụmụ ọhụrụ n’ihe ọjọọ, bụrụkwa ndị tozuru okè n’echiche. ‘Ihe ọjọọ’ na-echekwa obosara τῇ κακίᾳ, ‘ụmụ ọhụrụ’ na-egosipụta νηπιάζετε, ‘ndị tozuru okè’ na-egosipụta τέλειοι, ebe nkwughachi banyere echiche na-adịkwa ka nke Grik.'
  naturalness: Standard Igbo a dị mfe nghọta ma dabara n’usoro okwu ntụziaka. ‘Ụmụnna,’ ‘unu abụla,’ ‘Kama,’ na ‘bụrọnụ’ bụ okwu dị ebumpụta ụwa n’akwụkwọ Igbo nke oge a. Nkwughachi ‘n’ụzọ unu si eche echiche’ dị ntakịrị ogologo, ma ọ bụ nke ziri ezi, doro anya, ma na-echekwa nkwughachi e nwere n’isi mmalite.
  terminology: ‘Ụmụnna’ dabara nke ọma maka Ἀδελφοί n’ịkpọ ọgbakọ. Ndeta ala a na-akọwa ụdị nwoke ọtụtụ nke okwu Grik na ojiji ya maka ọgbakọ niile n’enweghị ịgbanwe okwu dị n’ahịrị isi. Ndeta ala nke abụọ na-enye ‘n’ajọ obi’ dịka nhọrọ maka κακία n’ụzọ kwesịrị ekwesị.
