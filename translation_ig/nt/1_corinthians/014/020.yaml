id: 1CO.14.20
reference: 1 Corinthians 14:20
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἀδελφοί, μὴ παιδία γίνεσθε ταῖς φρεσίν, ἀλλὰ τῇ κακίᾳ νηπιάζετε, ταῖς δὲ φρεσὶν τέλειοι γίνεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/020.yaml
  text: Brothers[a], do not become children in your thinking, but be infants in evil[b]; yet in your thinking become mature.
translation:
  language: ig
  text: Ụmụnna[a], unu abụla ụmụaka n’ụzọ unu si eche echiche. Kama, bụrụnụ ụmụ ọhụrụ n’ihe ọjọọ[b]; ma n’ụzọ unu si eche echiche, bụrụnụ ndị tozuru okè.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Okwu Grik ahụ pụtara kpọmkwem “ụmụnne nwoke,” ma e ji ya ebe a kpọọ ndị ọgbakọ, ndị nwoke na ndị nwanyị.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “n’ajọ obi.” Okwu Grik κακία nwere ike ịpụta ihe ọjọọ, ajọ omume, ma ọ bụ ajọ obi.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀδελφοί
  choice: Ụmụnna
  rationale: Nke a bụ ụzọ e si akpọ ndị otu okwukwe n’Igbo n’ụzọ dị ugwu ma dịkwa ire ụtọ. Ọ dabara n’ịkpọ ọgbakọ ahụ niile, ebe ndetu ala na-eme ka a hụ na okwu Grik ahụ dị n’ụdị nwoke ọtụtụ.
- source_word: παιδία
  choice: ụmụaka
  rationale: Okwu a pụtara ụmụaka n’ozuzu ya. Nhọrọ a na-echekwa ọdịiche dị n’etiti ‘ụmụaka,’ ‘ụmụ ọhụrụ,’ na ‘ndị tozuru okè.’
- source_word: γίνεσθε
  choice: unu abụla / bụrụnụ
  rationale: N’Igbo, ụdị ngwaa ‘ịbụ’ a na-eji n’iwu na-enye echiche nke ịghọ ma ọ bụ ịnọ n’ọnọdụ a kpọrọ aha, ma na-eme ka ahịrịokwu ahụ bụrụ nke e ji asụsụ nkịtị kwuo.
- source_word: ταῖς φρεσίν / ταῖς δὲ φρεσὶν
  choice: n’ụzọ unu si eche echiche
  rationale: Nkebi a na-egosi ikike nghọta na echiche mmadụ. Nsụgharị a doro ndị na-agụ Igbo nke oge a anya ma na-echekwa nkwughachi dị na Grik.
- source_word: τῇ κακίᾳ
  choice: n’ihe ọjọọ
  rationale: κακία nwere ike ịpụta ihe ọjọọ n’ozuzu, ajọ omume, ma ọ bụ ajọ obi. ‘Ihe ọjọọ’ na-echekwa obosara okwu ahụ; e debere ‘ajọ obi’ dịka nhọrọ ọzọ na ndetu ala.
- source_word: νηπιάζετε
  choice: bụrụnụ ụmụ ọhụrụ
  rationale: Ngwaa a pụtara ịbụ ma ọ bụ ime ka nwa ọhụrụ. ‘Ụmụ ọhụrụ’ na-egosipụta obere ntozu e bu n’uche ma na-adị iche na ‘ụmụaka’ nke dị na nkebi mbụ.
- source_word: τέλειοι
  choice: ndị tozuru okè
  rationale: N’ebe a τέλειοι na-ekwu maka ntozu n’echiche na nghọta, ọ bụghị izu okè nke enweghị mmehie.
- source_word: ἀλλὰ ... δὲ
  choice: Kama ... ma
  rationale: Njikọ ndị a na-echekwa mgbanwe na ntụnyere dị n’etiti ịbụ ụmụ ọhụrụ n’ihe ọjọọ na ịbụ ndị tozuru okè n’echiche.
theological_decisions:
- issue: Okwu e ji akpọ ọgbakọ nke dị n’ụdị nwoke na Grik
  choice: Jiri ‘Ụmụnna’ n’ahịrịokwu, tinyekwa nkọwa banyere ụdị okwu Grik ahụ na ndetu ala.
  alternative: Ụmụnna nwoke na ụmụnna nwanyị
  rationale: Ἀδελφοί dị n’ụdị nwoke ọtụtụ, ma n’ọnọdụ a o yikarịrị ka ọ na-akpọ ọgbakọ niile. ‘Ụmụnna’ bụ okwu Igbo ebumpụta ụwa maka ndị otu okwukwe, ebe ndetu ala na-echekwa ozi gbasara ụdị okwu isi mmalite ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ugwu ma dị mfe nghọta, dee ya. E chekwara nkwughachi nke ‘n’ụzọ unu si eche echiche’ na ọdịiche dị n’etiti ‘ụmụaka,’ ‘ụmụ ọhụrụ,’ na ‘ndị tozuru okè.’
