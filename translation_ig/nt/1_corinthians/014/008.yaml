  text: καὶ γὰρ ἐὰν ἄδηλον ⸂φωνὴν σάλπιγξ⸃ δῷ, τίς παρασκευάσεται εἰς πόλεμον;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/008.yaml
  text: For if the trumpet gives an unclear sound[b][a], who will prepare for battle?
translation:
  language: ig
  text: N’ihi na ọ bụrụ na opi enye ụda na-edoghị anya[a], ònye ga-akwadebe onwe ya maka agha?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ụda a na-apụghị ịmata nke ọma.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γὰρ
  choice: N’ihi na
  rationale: Ọ na-egosi na okwu a bụ nkọwa ma ọ bụ ihe na-akwado ihe e kwuru tupu ya; “N’ihi na” na-ebute njikọ ahụ nke ọma n’Igbo.
- source_word: ἐὰν
  choice: ọ bụrụ na
  rationale: Ọ na-ebute ahịrịokwu ọnọdụ, dị ka ojiji subjunctive δῷ si gosi.
- source_word: ἄδηλον
  choice: na-edoghị anya
  rationale: Ọ pụtara ihe a na-apụghị ịmata nke ọma ma ọ bụ nke na-enweghị ọdịiche doro anya; okwu a dabara n’ụda mgbaàmà opi.
- source_word: φωνὴν
  choice: ụda
  rationale: N’agbanyeghị na φωνή nwekwara ike ịpụta olu, n’ebe a ọ bụ ụda opi na-eme.
- source_word: σάλπιγξ
  choice: opi
  rationale: “Opi” bụ okwu Igbo dị mfe ma bụrụkwa nke kwesịrị ekwesị maka ngwá a na-afụ iji nye mgbaàmà agha.
- source_word: δῷ
  choice: enye
  rationale: Ọ na-echekwa ihe atụ nkịtị nke δίδωμι, ‘inye,’ ma bụrụkwa okwu Igbo kwekọrọ n’ahịrịokwu ‘inye ụda.’
- source_word: τίς
  choice: ònye
  rationale: Ọ bụ nnọchiaha ajụjụ na-ebute ajụjụ nzaghachi ya doro anya.
- source_word: παρασκευάσεται
  choice: ga-akwadebe onwe ya
  rationale: Middle voice nwere echiche nke mmadụ ịkwadebe onwe ya; ịkpọ “onwe ya” na-eme ka nke a doo anya n’Igbo.
- source_word: εἰς πόλεμον
  choice: maka agha
  rationale: Nke a na-asụgharị nkebi ahụ n’ụzọ kpọmkwem, ma n’okwu gbara ya gburugburu ọ pụtara ịkwadebe ịlụ ọgụ.
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ugwu ma dị mfe nghọta. A hapụrụ ajụjụ ahụ dịka ajụjụ na-achọghị azịza, ma mee ka echiche middle voice dị na παρασκευάσεται pụta site na “onwe ya.”
