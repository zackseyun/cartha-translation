  text: ἐὰν δὲ ἄλλῳ ἀποκαλυφθῇ καθημένῳ, ὁ πρῶτος σιγάτω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/030.yaml
  text: But if a revelation is given to another who is seated[b][a], let the first be silent.
translation:
  language: ig
  text: Ma ọ bụrụ na e kpughere onye ọzọ nọ ọdụ ihe, onye nke mbụ kwụsị ikwu okwu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ya bụ, onye na-ekwu okwu na mbụ kwesịrị ịkwụsị ka onye nke ọzọ nwee ike ikwu okwu.
    reason: cross_reference
lexical_decisions:
- source_word: ἐὰν δὲ
  choice: Ma ọ bụrụ na
  rationale: Ọ na-egosi ọnọdụ nwere obere ntụgharị ma ọ bụ ọdịiche n'iwu Pọl na-enye.
- source_word: ἄλλῳ
  choice: onye ọzọ
  rationale: Ọ na-egosi onye ọzọ dị iche n'onye na-ekwu okwu ugbu a.
- source_word: ἀποκαλυφθῇ
  choice: e kpugheere ... ihe
  rationale: Nke a na-edobe olu nnara nke ngwaa Grik ma ghara ịkpọ onye mere mkpughe ahụ aha; ọ bụkwa okwu Igbo na-aga were were.
- source_word: καθημένῳ
  choice: onye ... nọ ọdụ
  rationale: Ọ na-edobe ihe oyiyi doro anya nke onye ọzọ nọ ọdụ n'ọgbakọ.
- source_word: ὁ πρῶτος
  choice: onye nke mbụ
  rationale: Ọ na-edobe okwu Grik n'ụzọ kwụ ọtọ; n'ọnọdụ a, ọ bụ onye mbụ na-ekwu okwu.
- source_word: σιγάτω
  choice: kwụsị ikwu okwu
  rationale: N'ọnọdụ a, iwu ahụ pụtara na onye na-ekwu okwu ga-akwụsị ka onye ọzọ nwee ike ikwu; nke a bụ Igbo doro anya karịa ntụgharị nkịtị nke 'gbachi nkịtị.'
theological_decisions:
- issue: Ụdị mkpughe e nyere n'oge amụma n'ọgbakọ
  choice: e kpugheere onye ọzọ ... ihe
  alternative: e nyere onye ọzọ mkpughe
  rationale: Ngwaa ahụ na-egosi na e kpughere ihe, ma amaokwu ahụ akpọghị onye kpughere ya aha. Nsụgharị a na-edobe njide onwe ahụ ma zere ịgbakwụnye nkọwa ozizi karịa ihe e dere.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta mee ya. A họọrọ “e kpugheere ... ihe” iji chekwaa olu nnara na enweghị onye ọrụ a kpọrọ aha; “kwụsị ikwu okwu” na-akọwapụta ihe σιγάτω pụtara kpọmkwem n'ọnọdụ a.
