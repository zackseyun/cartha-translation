id: 1CO.14.23
reference: 1 Corinthians 14:23
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐὰν οὖν συνέλθῃ ἡ ἐκκλησία ὅλη ἐπὶ τὸ αὐτὸ καὶ πάντες ⸂λαλῶσιν γλώσσαις⸃, εἰσέλθωσιν δὲ ἰδιῶται ἢ ἄπιστοι, οὐκ ἐροῦσιν ὅτι μαίνεσθε;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/023.yaml
  text: Therefore[a], if the whole church comes together in one place and all speak in tongues, and uninstructed people or unbelievers enter[b], will they not say that you are out of your minds?
translation:
  language: ig
  text: Ya mere, ọ bụrụ na ọgbakọ ahụ dum ezukọta n'otu ebe, ha niile na-ekwu okwu n'ire[a], ndị na-amaghị usoro ọgbakọ ahụ[b] ma ọ bụ ndị na-ekweghị ekwe abata, hà agaghị asị na isi adịghị unu mma?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “na-ekwu okwu n’asụsụ.” Okwu Grik ahụ pụrụ ịpụta “asụsụ,” ma “ikwu okwu n’ire” na-edobe okwu a na-ejikarị eme ihe n’akụkụ a, n’akọwaghị kpọmkwem ụdị okwu ahụ.
    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ, “ndị na-amaghị ihe” ma ọ bụ “ndị nọ n’èzí.” Okwu Grik ahụ nwere ike izo aka n’ndị a na-akụzibeghị ma ọ bụ ndị na-amaghị usoro ọgbakọ ahụ; e mere ka ha dị iche n’ebe ndị na-ekweghị ekwe nọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκκλησία
  choice: nzukọ Kraịst
  rationale: N’ebe a okwu ahụ na-ezo aka n’ọgbakọ ndị kwere na Kraịst zukọrọ ọnụ; “nzukọ Kraịst” bụ okwu Igbo doro anya ma ghara ime ka a ghọta ya naanị dị ka ụlọ.
- source_word: ὅλη
  choice: ahụ dum
  rationale: Ọ na-emesi ike na ọgbakọ ahụ niile, ọ bụghị naanị ụfọdụ n’ime ha, bịara ọnụ.
- source_word: ἐπὶ τὸ αὐτό
  choice: n’otu ebe
  rationale: Nke a na-echekwa echiche nke ịnọkọ n’otu ebe, ma ghara ikwughachi naanị echiche dị na “ezukọta.”
- source_word: λαλῶσιν γλώσσαις
  choice: ana-asụkwa asụsụ dị iche iche
  rationale: “Asụsụ dị iche iche” bụ ụzọ Igbo nkịtị si akọwapụta γλώσσαι n’ụdị ọtụtụ; ihe odide ala peeji na-echekwa oghere nkọwa banyere ụdị okwu ahụ.
- source_word: ἰδιῶται
  choice: ndị na-amaghị ihe banyere omume nzukọ ahụ
  rationale: Nke a na-egosi ndị a na-akụzibeghị ma ọ bụ ndị na-amaghị usoro ọgbakọ ahụ, ma mee ka ha dị iche n’ebe “ndị na-ekweghị ekwe” nọ.
- source_word: ἄπιστοι
  choice: ndị na-ekweghị ekwe
  rationale: Nke a bụ ntụgharị Igbo kwụ ọtọ maka ndị na-enweghị okwukwe, ma na-echekwa ọdịiche ya na ἰδιῶται.
- source_word: μαίνεσθε
  choice: isi adịghị unu mma
  rationale: Akpaalaokwu Igbo a na-enye echiche nke ịbụ ndị uche na-adịghị mma n’ụzọ eke, n’ebughị okwu mkparị gabiga ókè.
- source_word: οὐκ ἐροῦσιν ὅτι
  choice: hà agaghị asị na
  rationale: Ajụjụ a haziri ka azịza ya bụrụ ee; ụdị Igbo a na-echekwa ike ajụjụ ahụ.
- source_word: οὖν
  choice: Ya mere
  rationale: Ọ na-egosi nkwubi okwu sitere n’ihe Pọl kwuru tupu nke a.
- source_word: συνέλθῃ
  choice: ezukọta
  rationale: Ọ bụ okwu Igbo eke maka ịbịakọta dị ka ọgbakọ.
theological_decisions:
- issue: Ụdị γλώσσαι e kwuru na 1 Ndị Kọrịnt 14
  choice: E ji “asụsụ dị iche iche” mee ihe n’ahịrị bụ isi, tinyere nkọwa ala peeji na ọ bụ okwu karịrị ike mmadụ nyere.
  alternative: ịsụ n’ire dị iche iche
  rationale: γλῶσσαι nwere ike ịpụta asụsụ, ma n’isiakwụkwọ a ọ bụkwa aha e ji mara onyinye okwu pụrụ iche. Nkọwa ala peeji na-egbochi ntụgharị ahụ idozi esemokwu banyere ma ọ bụ asụsụ mmadụ, okwu mmụọ, ma ọ bụ ha abụọ.
translation_notes:
  register: Asụsụ Igbo Standard nke oge a, dị ugwu ma dị mfe nghọta. E ji “nzukọ Kraịst” zere mgbagwoju anya nke nwere ike ime ka “ụka” pụta naanị ụlọ. E debere ajụjụ mmechi dịka ajụjụ na-atụ anya azịza ee.
