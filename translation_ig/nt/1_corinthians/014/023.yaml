revisions:
- from: Ya mere, ọ bụrụ na nzukọ Kraịst ahụ dum ezukọta n’otu ebe, ha niile ana-asụkwa asụsụ dị iche iche[a], ndị na-amaghị ihe banyere omume nzukọ ahụ[b] ma ọ bụ ndị na-ekweghị ekwe abata, hà agaghị asị na isi adịghị unu mma?
  to: Ya mere, ọ bụrụ na ọgbakọ ahụ dum ezukọta n'otu ebe, ha niile na-ekwu okwu n'ire[a], ndị na-amaghị usoro ọgbakọ ahụ[b] ma ọ bụ ndị na-ekweghị ekwe abata, hà agaghị asị na isi adịghị unu mma?
  rationale: The revision retains the verse’s syntax and rhetorical force while using “ọgbakọ” for the gathered church. It replaces language that narrows γλώσσαι to ordinary different languages and removes the unsupported assertion that the speech is superhuman. The revised footnote preserves both the lexical alternative and the interpretive openness of the Greek.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T18:15:19Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately reflects the conditional gathering, the whole congregation, a shared location, the two categories of entrants, and the rhetorical question. However, “asụsụ dị iche iche” in the main text selects ordinary distinct languages more strongly than the Greek expression warrants in this debated Pauline context. The existing footnote compounds this by characterizing the speech as superhuman.
  naturalness: “Ọgbakọ” is a natural Standard Igbo term for the gathered Christian community. “Ha agaghị asị na isi adịghị unu mma?” is idiomatic and suitably conveys the force of μαίνεσθε. “Ndị na-amaghị usoro ọgbakọ ahụ” is clear without making them identical with unbelievers.
  terminology: Replace “nzukọ Kraịst” with “ọgbakọ” for the congregation and render the established charismatic expression as “na-ekwu okwu n’ire,” with a footnote that retains the lexical alternative “asụsụ” without defining the phenomenon as superhuman. This preserves the ambiguity of γλώσσαι.
  issues:
  - severity: medium
    issue: The main text renders λαλῶσιν γλώσσαις as “ana-asụkwa asụsụ dị iche iche.”
    rationale: Although γλῶσσαι can mean languages, this wording naturally specifies a plurality of ordinary languages and so risks deciding an interpretively disputed question. The verse’s established contextual expression should be retained more neutrally.
  - severity: high
    issue: Footnote a calls the speech “ụdị okwu karịrị ike mmadụ.”
    rationale: The Greek verse itself does not state that the speech is superhuman. This theological characterization exceeds the source and contradicts the stated aim of leaving the phenomenon unresolved.
  - severity: low
    issue: “Nzukọ Kraịst” is less idiomatic and less direct than “ọgbakọ” for ἐκκλησία in this context.
    rationale: ἐκκλησία denotes the gathered community; “ọgbakọ” is a standard, natural Igbo equivalent and does not imply merely a building.
  revised_text: Ya mere, ọ bụrụ na ọgbakọ ahụ dum ezukọta n'otu ebe, ha niile na-ekwu okwu n'ire[a], ndị na-amaghị usoro ọgbakọ ahụ[b] ma ọ bụ ndị na-ekweghị ekwe abata, hà agaghị asị na isi adịghị unu mma?
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “na-ekwu okwu n’asụsụ.” Okwu Grik ahụ pụrụ ịpụta “asụsụ,” ma “ikwu okwu n’ire” na-edobe okwu a na-ejikarị eme ihe n’akụkụ a, n’akọwaghị kpọmkwem ụdị okwu ahụ.
    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ, “ndị na-amaghị ihe” ma ọ bụ “ndị nọ n’èzí.” Okwu Grik ahụ nwere ike izo aka n’ndị a na-akụzibeghị ma ọ bụ ndị na-amaghị usoro ọgbakọ ahụ; e mere ka ha dị iche n’ebe ndị na-ekweghị ekwe nọ.
    reason: lexical_alternative
  revision_rationale: The revision retains the verse’s syntax and rhetorical force while using “ọgbakọ” for the gathered church. It replaces language that narrows γλώσσαι to ordinary different languages and removes the unsupported assertion that the speech is superhuman. The revised footnote preserves both the lexical alternative and the interpretive openness of the Greek.
