id: 1CO.14.9
reference: 1 Corinthians 14:9
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οὕτως καὶ ὑμεῖς διὰ τῆς γλώσσης ἐὰν μὴ εὔσημον λόγον δῶτε, πῶς γνωσθήσεται τὸ λαλούμενον; ἔσεσθε γὰρ εἰς ἀέρα λαλοῦντες.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/009.yaml
  text: 'So also with you: if through the tongue you do not give intelligible speech[a], how will what is spoken be understood? For you will be speaking into the air.'
translation:
  language: ig
  text: Otú ahụ kwa, unu, ọ bụrụ na unu ejighị ire unu kwuo okwu a pụrụ ịghọta nke ọma[a], olee otú a ga-esi ghọta ihe a na-ekwu? N’ihi na unu ga na-agwa ikuku okwu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “okwu doro anya,” ma ọ bụ, “ozi doro anya.” Okwu Grik ahụ na-emesi ike na okwu ahụ kwesịrị ịbụ nke ndị na-ege ntị pụrụ ịmata ma ghọta.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως καὶ ὑμεῖς
  choice: Otú ahụ kwa, unu onwe unu
  rationale: Na-ejikọta okwu a na ihe atụ bu ya ụzọ ma na-agwa ndị Kọrịnt okwu kpọmkwem.
- source_word: διὰ τῆς γλώσσης
  choice: ejighị ire unu
  rationale: Na-echekwa ihe oyiyi doro anya nke ‘ire’ ma na-egosi na ọ bụ ụzọ e si ekwu okwu.
- source_word: εὔσημον λόγον
  choice: okwu a pụrụ ịghọta nke ọma
  rationale: Na-egosi okwu doro anya, nke ndị na-anụ ya pụrụ ịmata ma ghọta, n’Igbo nkịtị ma kwanyere ùgwù.
- source_word: δῶτε
  choice: kwuo
  rationale: Ọ bụ ezie na δίδωμι pụtara ‘nye,’ ‘kwuo okwu’ bụ ụzọ Igbo si ekwu echiche a n'ụzọ dị ndụ; ‘nye okwu’ ga-ada ka nsụgharị siri ike na-adịghị eke.
- source_word: πῶς γνωσθήσεται τὸ λαλούμενον
  choice: olee otú a ga-esi ghọta ihe a na-ekwu?
  rationale: Ọnọdụ a na-ekwu maka nghọta nke ndị na-ege ntị; usoro a na-echekwa passive na ajụjụ nke Grik n’ụzọ Igbo doro anya.
- source_word: ἔσεσθε γὰρ εἰς ἀέρα λαλοῦντες
  choice: N’ihi na unu ga na-agwa ikuku okwu
  rationale: Na-echekwa ihe atụ banyere ikwu okwu n’efu nke na-erughị onye na-ege ntị, ma na-ada eke n’Igbo.
theological_decisions: []
translation_notes:
  register: Standard Igbo nke oge a, dị mfe nghọta ma dị ùgwù. E chekwara ihe oyiyi ‘ire’ na ‘ikuku,’ ebe e ji usoro okwu Igbo eke kọwaa echiche nke nghọta.
