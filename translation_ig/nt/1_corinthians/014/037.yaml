  text: Εἴ τις δοκεῖ προφήτης εἶναι ἢ πνευματικός, ἐπιγινωσκέτω ἃ γράφω ὑμῖν ὅτι κυρίου ⸀ἐστίν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/037.yaml
  text: If anyone thinks he is a prophet or spiritual[a], let him recognize that what I am writing to you is a command of the Lord.
translation:
  language: ig
  text: Ọ bụrụ na onye ọ bụla na-eche na ọ bụ onye amụma ma ọ bụ onye ime mmụọ, ka onye ahụ mata na ihe m na-edegara unu bụ iwu nke Onyenwe anyị.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “na ihe m na-edegara unu bụ nke Onyenwe anyị.” N’okwu Grik, ọ pụtara kpọmkwem, “bụ nke Onyenwe anyị” ma ọ bụ “bụ ihe Onyenwe anyị nwe”; etinyere okwu “iwu” n’ahịrịokwu iji mee ka ihe ọ pụtara n’ọnọdụ a doo anya.
    reason: alternative_reading
lexical_decisions:
- source_word: δοκεῖ
  choice: echee na ya bụ
  rationale: Nke a na-egosi otú onye ahụ si ele onwe ya anya ma ọ bụ ihe ọ na-azọrọ banyere onwe ya; ọ na-edobekwa ụda mgbazi dị n’okwu Pọl.
- source_word: προφήτης
  choice: onye amụma
  rationale: Nke a bụ okwu Igbo a na-ejikarị eme ihe maka onye na-ekwu ozi sitere n’aka Chineke, ọ dabakwara n’ọnọdụ a nke onyinye ime mmụọ.
- source_word: πνευματικός
  choice: onye ime mmụọ
  rationale: Nhọrọ a na-edobe okwu Grik ahụ n’ụdị sara mbara, n’akọwaghị ya nanị dị ka inwe otu onyinye pụrụ iche ma ọ bụ idozi kpọmkwem ihe onye ahụ na-azọrọ.
- source_word: ἐπιγινωσκέτω
  choice: onye ahụ aghaghị ịghọta
  rationale: Iwu dị n’okwu Grik na-achọ ka onye ahụ mata ma kweta n’ikike nke ihe Pọl dere; ‘aghaghị ịghọta’ na-egosipụta ike iwu ahụ n’Igbo nkịtị.
- source_word: ἃ γράφω ὑμῖν
  choice: ihe m na-edetara unu
  rationale: Nke a bụ ụzọ Igbo dị ire ụtọ isi gosipụta ihe Pọl na-ede ugbu a nye ndị ọ na-agwa okwu.
- source_word: κυρίου ἐστίν
  choice: bụ iwu sitere n’aka Onyenwe anyị
  rationale: Nkebi Grik a dị mkpirikpi ma hapụ aha ihe ahụ n’ezoghị ọnụ. N’ọnọdụ a, ‘iwu sitere n’aka Onyenwe anyị’ na-eme ka ikike nke ntụziaka ahụ doo anya, ebe nkọwa ala peeji na-echekwa nsụgharị nkịtị na ihe ọ ka nwere ike ịpụta.
theological_decisions:
- issue: Ihe nkebi κυρίου ἐστίν pụtara n’ihi na e wepụrụ aha ihe a na-ekwu maka ya
  choice: bụ iwu sitere n’aka Onyenwe anyị
  alternative: bụ nke Onyenwe anyị / bụ ihe Onyenwe anyị nwe
  rationale: Ọnọdụ okwu ahụ na-egosi na Pọl na-ekwu na ntụziaka o dere nwere ikike nke Onyenwe anyị. Ma ebe okwu Grik kwuru naanị ‘bụ nke Onyenwe anyị,’ e nyere ihe ọzọ ọ pụrụ ịpụta n’ala peeji ka a ghara izochi mgbagwoju anya ahụ.
- issue: Ụdị nwoke dị na τις ... προφήτης ... πνευματικός
  choice: onye ọ bụla ... onye ahụ
  alternative: iji nnọchiaha nwoke ma ọ bụrụ na asụsụ Igbo nwere nke dabara adaba
  rationale: Igbo anaghị ekewa nnọchiaha onye nke atọ n’ụdị nwoke na nwanyị. ‘Onye ọ bụla ... onye ahụ’ bụ ntụaka otu onye n’ụzọ ebumpụta ụwa, ọ dịghịkwa etinye echiche banyere okike mmadụ nke asụsụ isi iyi na-achọghị.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta mee ihe. ‘Onye ime mmụọ’ na-echekwa obosara nke πνευματικός, ebe ‘aghaghị ịghọta’ na-egosipụta ike nke iwu Grik n’enweghị asụsụ siri ike ma ọ bụ nke otu ụka pụrụ iche.
