    rationale: The phrase “ọ ga-ada kpudo ihu ya n’ala” is not the most natural Standard Igbo expression for πεσὼν ἐπὶ πρόσωπον. Reordering it as “ọ ga-ada n’ala kpudo ihu” retains the physical image while improving clarity and idiomatic usage.
