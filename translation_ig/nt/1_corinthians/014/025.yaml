  to: ihe zoro ezo dị n’obi ya na-apụta ìhè, ya mere, ọ ga-ada n’ala kpudo ihu, fee Chineke ofufe, na-ekwupụta, sị, “N’ezie, Chineke nọ n’etiti unu.”[a]
