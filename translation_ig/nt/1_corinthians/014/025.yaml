id: 1CO.14.25
reference: 1 Corinthians 14:25
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸀τὰ κρυπτὰ τῆς καρδίας αὐτοῦ φανερὰ γίνεται, καὶ οὕτως πεσὼν ἐπὶ πρόσωπον προσκυνήσει τῷ θεῷ, ἀπαγγέλλων ὅτι ⸂Ὄντως ὁ θεὸς⸃ ἐν ὑμῖν ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/025.yaml
  text: the secrets of his heart become evident[a], and so, falling on his face, he will worship God, declaring that God truly is among you.
translation:
  language: ig
  text: ihe zoro ezo dị n’obi ya na-apụta ìhè, ya mere, ọ ga-ada n’ala kpudo ihu, fee Chineke ofufe, na-ekwupụta, sị, “N’ezie, Chineke nọ n’etiti unu.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ: “N’ezie, Chineke nọ n’ime unu.”'
    reason: alternative_reading
lexical_decisions:
- source_word: τὰ κρυπτὰ
  choice: ihe zoro ezo
  rationale: Nke a na-egosi ihe ndị mmadụ na-amaghị nke dị n’ime onye ahụ; ọ bụ okwu Igbo doro anya ma kwekọọ n’ọnọdụ a.
- source_word: τῆς καρδίας αὐτοῦ
  choice: dị n’obi ya
  rationale: “Obi” na-echekwa okwu Akwụkwọ Nsọ maka ebe echiche na ebumnuche mmadụ dị, kama ịkọwa ya karịa ihe Grik kwuru.
- source_word: φανερὰ γίνεται
  choice: na-apụta ìhè
  rationale: Nke a na-echekwa echiche nke ihe zoro ezo ịghọ ihe pụtara ìhè, ma bụrụkwa okwu Igbo sitere n’okike.
- source_word: καὶ οὕτως
  choice: ya mere
  rationale: Ọ na-egosi nsonaazụ nke ihe ndị dị n’obi onye ahụ pụtara ìhè.
- source_word: πεσὼν ἐπὶ πρόσωπον
  choice: ọ ga-ada kpudo ihu ya n’ala
  rationale: Nke a na-egosi n'ụzọ doro anya ọnọdụ ahụ mmadụ ji wedata onwe ya n’ala; ọ na-ezere nghọtahie nke ịda n’amaghị ama.
- source_word: προσκυνήσει τῷ θεῷ
  choice: fee Chineke ofufe
  rationale: N’ebe a, ngwaa ahụ bụ ife Chineke ofufe; ọnọdụ ịkpọ isiala ahụ apụtalarị n’okwu bu ya ụzọ.
- source_word: ἀπαγγέλλων
  choice: na-ekwupụta sị
  rationale: Nke a na-egosi na onye ahụ ji ọnụ ya kwupụta nkwenye sitere n’ihe o hụrụ.
- source_word: Ὄντως
  choice: N’ezie
  rationale: Ọ na-echekwa nkwusi ike nke adverb Grik ahụ n’Igbo dị ugbu a ma dị ùgwù.
- source_word: ἐν ὑμῖν
  choice: n’etiti unu
  rationale: N’ọnọdụ nzukọ ọgbakọ a, okwu ahụ na-egosi ọnụnọ Chineke n’etiti ndị gbakọrọ ọnụ, ma Grik ka nwekwara ike ịpụta “n’ime unu.”
theological_decisions:
- issue: Ihe ἐν ὑμῖν pụtara n’okwupụta ikpeazụ
  choice: n’etiti unu
  alternative: n’ime unu
  rationale: Ihe gbara amaokwu ahụ gburugburu bụ nzukọ ọgbakọ na onye bịara ọhụrụ na-amata ọnụnọ Chineke n’etiti ha. Ma ebe ἐν nwere ike ịpụta ọnụnọ dị n’ime ha, e debere nke ahụ n’ala peeji kama iwepụ mgbagwoju anya ziri ezi dị na Grik.
translation_notes:
  register: Standard Igbo dị ugbu a, dị mfe nghọta ma dị ùgwù. E jiri “fee Chineke ofufe” maka omume okpukpe ahụ, ebe “daa kpudo ihu ya n’ala” na-echekwa ihe oyiyi anụ ahụ nke isiala.
