  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ γὰρ λαλῶν γλώσσῃ οὐκ ἀνθρώποις λαλεῖ ⸀ἀλλὰ θεῷ, οὐδεὶς γὰρ ἀκούει, πνεύματι δὲ λαλεῖ μυστήρια·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/002.yaml
  text: For the one speaking in a tongue does not speak to people but to God, for no one understands; rather, he speaks mysteries in the Spirit.
translation:
  language: ig
  text: N’ihi na onye na-ekwu okwu n’asụsụ anaghị agwa ndị mmadụ okwu, kama ọ na-agwa Chineke okwu; n’ihi na ọ dịghị onye na-anụ[a]. Ma ọ na-ekwu ihe omimi n’ime mmụọ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ọ dịghị onye na-aghọta.” Ngwaa Grik ahụ pụtara n’ụzọ nkịtị “ịnụ,” ma n’ebe a ọ nwekwara ike igosi ịghọta.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “n’ime Mmụọ.” Nkebiokwu Grik ahụ nwere ike izo aka na Mmụọ Nsọ ma ọ bụ na mmụọ onye na-ekwu okwu.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ λαλῶν
  choice: onye na-ekwu okwu
  rationale: Nkebiokwu a na-arụ ọrụ dị ka aha ma na-ezo aka n’onye ọ bụla na-eme ihe ahụ; nsụgharị a bụ nke okike n’Igbo ma anaghị akọwapụta nwoke ma ọ bụ nwaanyị.
- source_word: γλώσσῃ
  choice: n’ire
  rationale: E debere ya n’otu mkpụrụ okwu dịka Grik si dị. ‘Ire’ na-ejigide njikọ ya na ikwu okwu n’ire n’enweghị ịkọwa ya ozugbo dị ka asụsụ mmadụ ọzọ.
- source_word: ἀνθρώποις
  choice: ndị mmadụ
  rationale: Okwu Grik a na-ezo aka n’ụmụ mmadụ n’ozuzu ha, ọ bụghị naanị ndị nwoke.
- source_word: θεῷ
  choice: Chineke
  rationale: Nke a bụ onye a na-agwa okwu kpọmkwem; nsụgharị dị mfe dabara na Grik.
- source_word: ἀκούει
  choice: na-aghọta ihe ọ na-ekwu
  rationale: Ọ bụ ezie na ngwaa Grik pụtara n’ụzọ nkịtị ‘na-anụ,’ ebe a okwu gbara ya gburugburu na-elekwasị anya n’ịghọta okwu ahụ. E tinyere ihe a na-anụ n’Igbo ka ahịrịokwu ahụ bụrụ nke okike, ebe e debere ‘na-anụ’ n’ala peeji.
- source_word: πνεύματι
  choice: n’ime Mmụọ
  rationale: Nke a na-egosi ọgụgụ nke na-ezo aka na Mmụọ Nsọ, ma usoro okwu ahụ anaghị eme ka ọ bụrụ ihe kpebisiri ike kpamkpam; ya mere, e debere ọgụgụ nke na-ezo aka na mmụọ onye na-ekwu okwu n’ala peeji.
- source_word: μυστήρια
  choice: ihe omimi
  rationale: Nke a na-ejigide echiche nke ihe zoro ezo ma ọ bụ eziokwu Chineke kpughere, n’ebughị ụzọ kọwaa ihe ndị ahụ karịa ihe Grik kwuru.
- source_word: δὲ
  choice: Kama
  rationale: N’ebe a, okwu ahụ na-egosi ọdịiche na nkọwa ọzọ megide okwu dị n’ihu.
theological_decisions:
- issue: Ihe πνεύματι na-ezo aka na ya
  choice: n’ime Mmụọ
  alternative: n’ime mmụọ ya
  rationale: Dative Grik ahụ nwere ike izo aka na Mmụọ Nsọ ma ọ bụ na mmụọ onye na-ekwu okwu. Isi ederede họọrọ ọgụgụ mbụ, ma ala peeji na-echekwa nke ọzọ ka a ghara idozi esemokwu nkọwa ahụ n’ụzọ ozizi otu ụka.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke nwere ugwu ma dị mfe nghọta, dee ya. E jigidere otu mkpụrụ okwu nke γλώσσῃ site na ‘n’ire,’ ma e zere ịkpọ ya ozugbo ‘asụsụ ọzọ’ ka a ghara itinye nkọwa karịrị ihe isi mmalite kwuru. Akara ala peeji [a] na [b] dị n’isi ederede.
