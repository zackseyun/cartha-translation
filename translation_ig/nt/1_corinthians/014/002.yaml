revisions:
- from: N’ihi na onye na-ekwu okwu n’ire adịghị agwa ndị mmadụ okwu, kama ọ na-agwa Chineke okwu; n’ihi na ọ dịghị onye na-aghọta ihe ọ na-ekwu[a]. Kama, ọ na-ekwu ihe omimi n’ime Mmụọ[b].
  to: N’ihi na onye na-ekwu okwu n’asụsụ anaghị agwa ndị mmadụ okwu, kama ọ na-agwa Chineke okwu; n’ihi na ọ dịghị onye na-anụ[a]. Ma ọ na-ekwu ihe omimi n’ime mmụọ[b].
  rationale: 'The revision restores the direct sense of ἀκούει in the main text and places the contextual sense “understands” in the footnote. It uses idiomatic Standard Igbo for tongue-speech and avoids capitalizing πνεύματι, thereby retaining the source’s disputed ambiguity. The two contrastive particles are distinguished naturally: “kama” for ἀλλά and “Ma” for δέ.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T18:14:59Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the overall contrast, but its main rendering of ἀκούει as “na-aghọta ihe ọ na-ekwu” expands the Greek, which simply says “no one hears.” Comprehension is a defensible contextual implication and belongs in a footnote. The capitalization of “Mmụọ” also selects the Holy Spirit as the main reading where πνεύματι is grammatically disputed; a lowercase rendering better preserves the source ambiguity.
  naturalness: “N’ihi na onye na-ekwu okwu n’ire” is understandable, but “n’asụsụ” is the more natural modern Standard Igbo expression for the tongue-speech/language phenomenon in this context. The revised wording is fluent while retaining the singular sense without specifying that it is a foreign language.
  terminology: Use “asụsụ” for γλώσσῃ in this communicative setting, “ihe omimi” for μυστήρια, and an uncapitalized “mmụọ” for πνεύματι so that neither the Holy Spirit nor the speaker’s spirit is prematurely imposed. “Ma” appropriately represents the mild δέ transition; “kama” remains suitable for ἀλλά.
  issues:
  - severity: medium
    issue: The main text renders ἀκούει as “na-aghọta ihe ọ na-ekwu.”
    rationale: The Greek has no expressed object and most directly means “hears.” Although “understands” is possible by contextual implication, adding “ihe ọ na-ekwu” makes the translation more explicit than the source. Retain that interpretation as a footnoted alternative.
  - severity: medium
    issue: “Mmụọ” capitalizes πνεύματι in the main text.
    rationale: The dative πνεύματι may refer to the Holy Spirit or to the speaker’s spirit. Capitalization resolves this disputed referent. Lowercase “mmụọ,” with an explanatory footnote, preserves the ambiguity.
  - severity: low
    issue: “n’ire” is less natural for the communicative sense of γλώσσῃ.
    rationale: While literal “tongue” is possible, “n’asụsụ” is clearer and more idiomatic Standard Igbo for speaking in a tongue/language, without adding “another” or pluralizing the Greek.
  revised_text: N’ihi na onye na-ekwu okwu n’asụsụ anaghị agwa ndị mmadụ okwu, kama ọ na-agwa Chineke okwu; n’ihi na ọ dịghị onye na-anụ[a]. Ma ọ na-ekwu ihe omimi n’ime mmụọ[b].
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “ọ dịghị onye na-aghọta.” Ngwaa Grik ahụ pụtara n’ụzọ nkịtị “ịnụ,” ma n’ebe a ọ nwekwara ike igosi ịghọta.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “n’ime Mmụọ.” Nkebiokwu Grik ahụ nwere ike izo aka na Mmụọ Nsọ ma ọ bụ na mmụọ onye na-ekwu okwu.
    reason: alternative_reading
  revision_rationale: 'The revision restores the direct sense of ἀκούει in the main text and places the contextual sense “understands” in the footnote. It uses idiomatic Standard Igbo for tongue-speech and avoids capitalizing πνεύματι, thereby retaining the source’s disputed ambiguity. The two contrastive particles are distinguished naturally: “kama” for ἀλλά and “Ma” for δέ.'
