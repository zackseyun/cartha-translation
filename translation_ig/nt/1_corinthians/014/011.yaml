    issue: Relational phrases are somewhat awkward.
    rationale: The Greek dative and ἐν ἐμοί express reciprocal alienness from each person's perspective, not location. “Nye” communicates this naturally in Igbo.
  - severity: low
    issue: Footnote b's opening wording is imprecise.
    rationale: The Greek word is βάρβαρος (barbaros); “onye mba ọzọ” is the Igbo translation, not the Greek lexical form itself.
