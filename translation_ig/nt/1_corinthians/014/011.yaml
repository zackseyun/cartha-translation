id: 1CO.14.11
reference: 1 Corinthians 14:11
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐὰν οὖν μὴ εἰδῶ τὴν δύναμιν τῆς φωνῆς, ἔσομαι τῷ λαλοῦντι βάρβαρος καὶ ὁ λαλῶν ἐν ἐμοὶ βάρβαρος.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/011.yaml
  text: Therefore[a], if I do not know the meaning of the voice, I will be a foreigner to the one speaking[b], and the one speaking will be a foreigner to me.
translation:
  language: ig
  text: Ya mere, ọ bụrụ na amaghị m ihe olu ahụ pụtara[a], aga m abụ onye mba ọzọ nye onye na-ekwu okwu[b], onye na-ekwu okwu ahụ ga-abụkwa onye mba ọzọ nye m.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ike olu ahụ”; ya bụ, ihe olu ahụ na-egosi ma ọ bụ ihe ọ pụtara.
    reason: lexical_alternative
  - marker: b
    text: Okwu Grik e ji mee ihe ebe a bụ barbaros; ọ na-ekwu maka onye asụsụ ya bụ nke mba ọzọ ma ọ bụ onye a na-apụghị ịghọta okwu ya, ọ pụtaghị na onye ahụ enweghị mmepeanya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν οὖν
  choice: Ya mere, ọ bụrụ na
  rationale: Ọ na-edobe ma nkwubi okwu οὖν ma ọnọdụ ἐὰν n’ụzọ Igbo sitere n’okike.
- source_word: μὴ εἰδῶ
  choice: ọ bụrụ na amaghị m
  rationale: “Ịma” na-edobe isi nghọta nke οἶδα; ihe gbara ya gburugburu na-eme ka o doo anya na ọ bụ ịmata ihe olu ahụ pụtara.
- source_word: τὴν δύναμιν τῆς φωνῆς
  choice: ihe olu ahụ pụtara
  rationale: N’okwu a, δύναμις na-egosi uru, nghọta, ma ọ bụ ihe φωνή na-ezipụta; ntụgharị a bụ Igbo doro anya ma na-edobe “olu” maka φωνή.
- source_word: τῷ λαλοῦντι
  choice: n’ebe onye na-ekwu okwu nọ
  rationale: Ọ na-egosipụta njikọ dative ahụ n’Igbo dị mma ma na-edobe participle dị ka onye nọ na-ekwu okwu.
- source_word: βάρβαρος
  choice: onye mba ọzọ
  rationale: N’ebe a okwu ahụ na-egosi onye asụsụ ya bụ ihe a na-apụghị ịghọta, ọ bụghị ịkpọ mmadụ onye obi tara mmiri ma ọ bụ onye na-enweghị mmepeanya.
- source_word: ἐν ἐμοὶ
  choice: n’ebe m nọ
  rationale: 'Ọ bụ ụzọ Igbo sitere n’okike isi gosipụta mmekọrịta ahụ: onye na-ekwu okwu bụ onye mba ọzọ nye m.'
theological_decisions: []
translation_notes:
  register: 'E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta mee ya. E debere nhazi ahịrịokwu abụọ na-ele ibe ha anya n’ụzọ kwekọrọ: onye na-ege ntị bụ onye mba ọzọ nye onye na-ekwu okwu, onye na-ekwu okwu abụrụkwa onye mba ọzọ nye ya.'
