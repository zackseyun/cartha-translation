- from: Ya mere, onye na-asụ asụsụ dị iche[a] kwesịrị ikpe ekpere ka o nwee ike ịkọwa ya.
  to: Ya mere, onye na-ekwu okwu n’ire[a] kwesịrị ikpe ekpere ka o wee kọwaa.
