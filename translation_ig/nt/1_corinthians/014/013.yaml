source:
  edition: SBLGNT
  text: ⸀Διὸ ὁ λαλῶν γλώσσῃ προσευχέσθω ἵνα διερμηνεύῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/013.yaml
  text: Therefore[b][a], the one who speaks in a tongue should pray that he may interpret.
translation:
  language: ig
  text: Ya mere, onye na-ekwu okwu n’ire[a] kwesịrị ikpe ekpere ka o wee kọwaa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “n’asụsụ.” Okwu Grik ahụ bụ “n’ire,” bụ okwu a na-ejikarị n’isiakwụkwọ a maka okwu chọrọ nkọwa ka ndị ọzọ ghọta ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὸ
  choice: Ya mere
  rationale: Ọ bụ njikọ na-egosi nkwubi okwu sitere n’ihe e kwuru tupu ya; “Ya mere” bụ Igbo nkịtị ma na-edobe ike nke nkwubi okwu ahụ.
- source_word: ὁ λαλῶν
  choice: onye na-asụ
  rationale: Nkebiokwu a na-arụ ọrụ dị ka aha ma na-ezo aka n’ozuzu onye ọ bụla na-eme ihe ahụ; “onye na-asụ” bụ okwu Igbo doro anya ma dị ndụ.
- source_word: γλώσσῃ
  choice: asụsụ dị iche
  rationale: Ọdịdị otu nke okwu Grik ahụ ka e debere. N’ebe a, ọ na-ezo aka n’okwu ọgbakọ na-anaghị aghọta ma ọ bụrụ na a kọwaghị ya; okwu a anaghị ekpebi ma ọ bụ asụsụ mmadụ nkịtị ka ọ bụ ụdị okwu ọzọ.
- source_word: προσευχέσθω
  choice: kwesịrị ikpe ekpere
  rationale: Ọ bụ iwu ndụmọdụ n’ụdị onye nke atọ; “kwesịrị ikpe ekpere” na-enye ume nke agbamume ahụ n’Igbo nke oge a.
- source_word: ἵνα
  choice: ka
  rationale: “Ka” na-egosi ebumnuche ma ọ bụ ihe a na-arịọ n’ekpere, dịka njikọ Grik ahụ si mee.
- source_word: διερμηνεύῃ
  choice: o nwee ike ịkọwa ya
  rationale: Ngwaa ahụ pụtara ime ka okwu ahụ doo ndị ọzọ anya. “Ịkọwa ya” dabara n’ọnọdụ ọgbakọ ma ghara ime ka ihe ọ pụtara bụrụ naanị ịsụgharị site n’otu asụsụ gaa n’ọzọ.
theological_decisions:
- issue: Ihe γλώσσῃ pụtara n’akwụkwọ 1 Ndị Kọrịnt 12–14
  choice: asụsụ dị iche
  alternative: ire; asụsụ
  rationale: Nhọrọ a na-edobe njikọ ya na onyinye okwu chọrọ nkọwa n’ọgbakọ, ma ọ naghị edozi n’amaghị ama esemokwu banyere ma ọ bụ asụsụ mmadụ, okwu mmụọ, ma ọ bụ ụdị okwu sara mbara.
- issue: Onye nnọchianya n’ụdị otu
  choice: onye ... o
  alternative: ndị ... ha
  rationale: Grik ji onye otu nwoke n’ụzọ nnọchianya. Igbo “onye ... o” na-edobe otu onye ahụ ma na-arụ ọrụ n’ozuzu, n’enweghị ịkọwa na ọ bụ naanị nwoke.
translation_notes:
  register: Standard Igbo dị mfe, nke oge a, ma nwee ugwu. E jiri “asụsụ dị iche” mee ka okwu ahụ bụrụ ihe ndị na-agụ akwụkwọ ga-aghọta, ebe nkọwa ala peeji na-edobe ihe oyiyi nkịtị nke okwu Grik bụ “ire.”
