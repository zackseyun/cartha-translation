source:
  edition: SBLGNT
  text: ἐὰν δὲ μὴ ᾖ ⸀διερμηνευτής, σιγάτω ἐν ἐκκλησίᾳ, ἑαυτῷ δὲ λαλείτω καὶ τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/028.yaml
  text: But if there is no interpreter[a], he must keep silent in the church and speak to himself and to God.
translation:
  language: ig
  text: Ma ọ bụrụ na onye ntụgharị asụsụ adịghị, ka ọ gbachie nkịtị n’ọgbakọ[a]; ka ọ gwa onwe ya na Chineke okwu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “na nzukọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διερμηνευτής
  choice: onye ga-akọwa ya
  rationale: N’ebe a, okwu ahụ na-ezo aka n’onye na-eme ka okwu e kwuru n’asụsụ ọzọ doo ndị ọzọ anya; nsụgharị a bụ nke doro ndị Igbo nke oge a anya.
- source_word: σιγάτω
  choice: ya gbachie nkịtị
  rationale: Nke a na-egosipụta iwu dị na ngwaa Grik nke onye nke atọ, ma na-ada ka Igbo ebumpụta ụwa.
- source_word: ἐν ἐκκλησίᾳ
  choice: n’ọgbakọ
  rationale: N’isiakwụkwọ a, ἐκκλησία pụtara nzukọ ndị kwere ekwe zukọrọ, ọ bụghị ụlọ ụka; “ọgbakọ” na-egosipụta ọnọdụ ahụ nke ọma.
- source_word: ἑαυτῷ
  choice: na-agwa onwe ya ... okwu
  rationale: Na-edobe nnọchiaha na-alaghachikwuru onye ahụ n’onwe ya, n’etinyeghị nkọwa dịka “naanị ya” nke na-adịghị n’ihe odide.
- source_word: λαλείτω
  choice: na-agwa ... okwu
  rationale: Na-egosipụta iwu ka onye ahụ kwuo okwu nye onwe ya na Chineke, n’ụzọ dabara na asụsụ Igbo.
- source_word: τῷ θεῷ
  choice: na Chineke
  rationale: N’usoro Igbo “ịgwa mmadụ okwu,” a na-eji “na” gosi onye a na-agwa okwu; nke a na-ezipụta dative Grik ahụ n'ụzọ ebumpụta ụwa.
- source_word: ἐὰν δὲ μὴ ᾖ
  choice: Ma ọ bụrụ na ... adịghị
  rationale: Na-edobe ọnọdụ nke ahịrịokwu Grik na njikọ δέ, ma bụrụkwa usoro okwu Igbo doro anya.
theological_decisions:
- issue: Ókè iwu ịgbachi nkịtị nwere mgbe ọgbakọ zukọrọ
  choice: A machibidoro onye ahụ ikwu okwu n’ihu ọgbakọ ma ọ bụrụ na onye ga-akọwa ya adịghị, ma a ka gwara ya ka ọ na-agwa onwe ya na Chineke okwu.
  alternative: Ka onye ahụ kwụsị ụdị ikwu okwu niile kpamkpam.
  rationale: Ọdịiche dị n’etiti “gbachie nkịtị n’ọgbakọ” na “na-agwa onwe ya na Chineke okwu” na-egosi na iwu ahụ metụtara okwu a na-agwa ọgbakọ, ọ bụghị mmachibido okwu niile; nsụgharị ahụ akọwaghị otú ma ọ bụ olu a ga-eji kwuo ya.
translation_notes:
  register: Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta. E ji “ọgbakọ” zere ime ka ἐκκλησία yie naanị ụlọ a na-akpọ ụka, ma e debere obere mgbagwoju anya banyere otú onye ahụ si agwa onwe ya na Chineke okwu.
