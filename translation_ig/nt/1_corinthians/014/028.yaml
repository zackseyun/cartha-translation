revisions:
- from: Ma ọ bụrụ na onye ga-akọwa ya adịghị, ya gbachie nkịtị n’ọgbakọ[a], na-agwa onwe ya na Chineke okwu.
  to: Ma ọ bụrụ na onye ntụgharị asụsụ adịghị, ka ọ gbachie nkịtị n’ọgbakọ[a]; ka ọ gwa onwe ya na Chineke okwu.
  rationale: The revision replaces the explanatory and source-expanding expression for “interpreter” with the standard term “onye ntụgharị asụsụ,” makes both Greek imperatives explicit in natural Igbo, and retains the source’s deliberate contrast between silence in the assembly and speech to oneself and God. The footnote now offers a lexical alternative without importing additional description.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T18:15:20Z'
review_pass:
  verdict: revise
  source_fidelity: The conditional absence of an interpreter, the command for silence within the gathered assembly, and the contrast with speech directed to oneself and God are retained. However, “onye ga-akọwa ya” adds an unspecified object (“it”) and can mean someone who will explain something, rather than an interpreter.
  naturalness: “Ya gbachie nkịtị” is understandable but is less idiomatic as a third-person directive without “ka ọ.” The revised paired imperatives are natural Standard Igbo.
  terminology: “Onye ntụgharị asụsụ” is the clearest modern Igbo term for διερμηνευτής in this context. “Ọgbakọ” suitably renders ἐκκλησία as the gathered body rather than a building. The alternative footnote is revised to a genuine lexical alternative without adding “ndị kwere ekwe,” which is not explicit in the Greek.
  issues:
  - severity: medium
    issue: “onye ga-akọwa ya” does not precisely render διερμηνευτής.
    rationale: It introduces “ya” (“it”), which has no expressed antecedent in the Greek, and “kọwa” primarily means explain rather than interpret/translate speech.
  - severity: low
    issue: The imperative forms are not fully explicit in the latter clause.
    rationale: The Greek has two third-person present imperatives (σιγάτω, λαλείτω). “Ka ọ gbachie nkịtị ... ka ọ gwa ... okwu” preserves the directive force more clearly and idiomatically.
  - severity: low
    issue: The existing footnote is explanatory rather than a close lexical alternative.
    rationale: “N’ọgbakọ ndị kwere ekwe zukọrọ” expands the source. “Na nzukọ” supplies a concise alternative for ἐκκλησίᾳ.
  revised_text: Ma ọ bụrụ na onye ntụgharị asụsụ adịghị, ka ọ gbachie nkịtị n’ọgbakọ[a]; ka ọ gwa onwe ya na Chineke okwu.
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “na nzukọ.”
    reason: lexical_alternative
  revision_rationale: The revision replaces the explanatory and source-expanding expression for “interpreter” with the standard term “onye ntụgharị asụsụ,” makes both Greek imperatives explicit in natural Igbo, and retains the source’s deliberate contrast between silence in the assembly and speech to oneself and God. The footnote now offers a lexical alternative without importing additional description.
