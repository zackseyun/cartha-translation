review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the conditional instruction, the limit of two or at most three speakers, sequential speaking, and the requirement for one interpreter. However, “n’ire” is not natural Standard Igbo for speech/language and can be understood chiefly as the physical tongue. The final clause’s “ihe ha kwuru” is slightly more explicit than the Greek object, which refers collectively to the tongue-speech; “ya” retains the reference more closely.
  naturalness: “Na-ekwu okwu n’ire” is a calqued and awkward expression in contemporary Standard Igbo. “Na-ekwu okwu n’asụsụ” is natural. “Onye ọ bụla n’usoro nke ya” naturally expresses the distributive sense of ἀνὰ μέρος. “Kọwaa ya” is suitable for διερμηνευέτω without restricting the act to translation alone.
  terminology: Use “asụsụ” in the main text for idiomatic Igbo, while the footnote identifies “ire” as the literal lexical alternative and explicitly preserves the unresolved question about the nature of the gift. “Kọwaa” appropriately represents interpretation without imposing a specific theory of tongues.
  issues:
  - severity: medium
    issue: The main-text expression “na-ekwu okwu n’ire” is unnatural and potentially misleading in Standard Igbo.
    rationale: In ordinary Igbo, “ire” primarily denotes the bodily tongue; “asụsụ” is the normal word for a language. Retaining “ire” as the main rendering produces a literal Greek calque rather than clear Igbo.
  - severity: low
    issue: “Ihe ha kwuru” slightly expands the Greek referent in the interpretation clause.
    rationale: The Greek simply requires one person to interpret; using the singular pronoun “ya” refers back to the speech while avoiding an unnecessary explicit plural formulation.
  revised_text: Ọ bụrụ na onye ọ bụla na-ekwu okwu n’asụsụ[a], ka mmadụ abụọ kwuo, ma ọ bụ nke kachasị mmadụ atọ; onye ọ bụla n’usoro nke ya, ka otu onye kọwaakwa ya.
