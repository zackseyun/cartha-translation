revisions:
- from: Ọ bụrụ na onye ọ bụla na-ekwu okwu n’ire[a], ka ndị na-ekwu ya bụrụ mmadụ abụọ, ma ọ bụ, nke kachasị, mmadụ atọ; ha kwuo n’otu n’otu, ka otu onye kọwakwa ihe ha kwuru.
  to: Ọ bụrụ na onye ọ bụla na-ekwu okwu n’asụsụ[a], ka mmadụ abụọ kwuo, ma ọ bụ nke kachasị mmadụ atọ; onye ọ bụla n’usoro nke ya, ka otu onye kọwaakwa ya.
  rationale: The revision replaces an unnatural literal calque with idiomatic Standard Igbo while retaining the lexical and theological openness of γλώσσῃ in the footnote. It also streamlines the numerical and sequential instructions and uses a pronoun in the final clause to stay close to the Greek’s concise reference to the speech being interpreted.
