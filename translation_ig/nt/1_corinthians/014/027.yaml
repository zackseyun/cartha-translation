source:
  edition: SBLGNT
  text: εἴτε γλώσσῃ τις λαλεῖ, κατὰ δύο ἢ τὸ πλεῖστον τρεῖς, καὶ ἀνὰ μέρος, καὶ εἷς διερμηνευέτω·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/027.yaml
  text: If anyone speaks in a tongue[a], let there be two, or at most three, and each in turn, and let one interpret.
translation:
  language: ig
  text: Ọ bụrụ na onye ọ bụla na-ekwu okwu n’asụsụ[a], ka mmadụ abụọ kwuo, ma ọ bụ nke kachasị mmadụ atọ; onye ọ bụla n’usoro nke ya, ka otu onye kọwaakwa ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’ire.” Okwu Grik a pụrụ ịpụta ire ma ọ bụ asụsụ. N’amaokwu a, ọ na-ezo aka n’ụdị okwu a na-atụle n’isiakwụkwọ a, n’ekpebighị ma ọ bụ asụsụ mmadụ ka ọ bụ ụdị okwu ọzọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: γλώσσῃ
  choice: n’ire
  rationale: “Ire” na-edobe okwu Pọl ji kpọọ onyinye a n’isi 12–14, n’akọwaghị ma ọ bụ asụsụ mmadụ ma ọ bụ ụdị okwu ọzọ. Ihe odide ala peeji gosiri na “asụsụ” bụkwa ntụgharị kwe omume.
- source_word: τις
  choice: onye ọ bụla
  rationale: Nnọchiaha a na-ezo aka n’onye ọbụla n’enweghị ịkọ onye kpọmkwem, ya mere “onye ọ bụla” dabara n’ọnọdụ iwu a.
- source_word: λαλεῖ
  choice: na-ekwu okwu
  rationale: Oge ugbu a n’ahịrịokwu ọnọdụ zuru oke ka e ji okwu Igbo a na-asụkarị gosipụta.
- source_word: κατὰ δύο ἢ τὸ πλεῖστον τρεῖς
  choice: ka ndị na-ekwu ya bụrụ mmadụ abụọ, ma ọ bụ, nke kachasị, mmadụ atọ
  rationale: 'Nke a na-egosi oke ọnụ ọgụgụ ndị ga-ekwu okwu: mmadụ abụọ, ma ọ bụ karịa nke ahụ naanị ruo mmadụ atọ.'
- source_word: ἀνὰ μέρος
  choice: ha kwuo n’otu n’otu
  rationale: Nke a na-egosi na ha agaghị ekwu okwu n’otu oge, kama onye nke ọ bụla ga-ekwu mgbe oge ya ruru.
- source_word: εἷς
  choice: otu onye
  rationale: Ọnụọgụ “otu” na-arụ ọrụ dị ka aha, na-egosi na otu onye ga-akọwa okwu ahụ.
- source_word: διερμηνευέτω
  choice: ka otu onye kọwakwa ihe ha kwuru
  rationale: “Kọwaa” na-enye echiche ime ka okwu ahụ doo ọgbakọ anya, ma na-ezere imechi ihe okwu Grik ahụ pụtara ka ọ bụrụ naanị ntụgharị site n’otu asụsụ gaa n’asụsụ ọzọ.
theological_decisions:
- issue: Ihe γλώσσῃ pụtara n’ọnọdụ onyinye ime mmụọ
  choice: E ji “ire” mee ihe n’ahịrịokwu bụ isi, n’akọwaghị ma okwu ahụ ọ bụ asụsụ mmadụ ma ọ bụ okwu eluigwe.
  alternative: A pụrụ ịsụgharị ya “asụsụ,” ma ọ bụ kọwaa ya kpọmkwem dị ka okwu mkpali mmụọ ma ọ bụ asụsụ mba ọzọ.
  rationale: Amaokwu a n’onwe ya anaghị edozi arụmụka banyere ụdị onyinye ahụ. “Ire,” tinyere ihe odide ala peeji, na-edobe obosara ihe okwu Grik ahụ pụrụ ịpụta na esemokwu nkà mmụta okpukpe dị na ya.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta mee ihe. “N’otu n’otu” na-eme ka iwu ikwu okwu n’usoro doo anya; “nke kachasị” na-egosi na mmadụ atọ bụ oke elu.
