review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the conditional consequence, blessing, the congregational “Amen,” thanksgiving, and the reason of non-understanding. However, “onye a na-akụzibeghị” adds a temporal sense (“not yet taught”) not present in ἰδιώτης. The revised wording removes that addition while retaining the non-specialist/uninstructed sense.
  naturalness: The sentence is generally clear in Standard Igbo. “Sị ‘Amen’” is more idiomatic than “kwuo, ‘Amen,’”; “n’oge ị na-enye ekele” also gives a smoother connection to the act at which the response is made.
  terminology: “N’ime mmụọ” appropriately leaves πνεύματι open rather than specifying the human spirit or the Holy Spirit. “Inye ekele” appropriately renders εὐχαριστία without imposing the later technical sacramental sense. The lexical note for ἰδιώτης is retained with less pejorative wording in the main text.
  issues:
  - severity: medium
    issue: Temporal implication in “onye a na-akụzibeghị”
    rationale: The suffix -beghị normally conveys that instruction has not happened yet. The Greek ἰδιώτης identifies a lay, untrained, or uninformed person without asserting that the person is awaiting instruction.
  - severity: low
    issue: Less idiomatic rendering of the congregational response
    rationale: In this context, Standard Igbo naturally uses “sị ‘Amen’” for responding with Amen, rather than “kwuo, ‘Amen.’”
  revised_text: Ma ọ bụghị ya, ọ bụrụ na ị na-agọzi n’ime mmụọ[b], olee otú onye nọ n’ọnọdụ onye na-enweghị ọmụma[a] ga-esi sị, “Amen,” n’oge ị na-enye ekele[c], ebe ọ bụ na ọ maghị ihe ị na-ekwu?
