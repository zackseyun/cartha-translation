id: 1CO.14.16
reference: 1 Corinthians 14:16
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐπεὶ ἐὰν ⸀εὐλογῇς ⸀πνεύματι, ὁ ἀναπληρῶν τὸν τόπον τοῦ ἰδιώτου πῶς ἐρεῖ τὸ Ἀμήν ἐπὶ τῇ σῇ εὐχαριστίᾳ; ἐπειδὴ τί λέγεις οὐκ οἶδεν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/016.yaml
  text: Otherwise[a], if you bless in the spirit, how will the one filling the place of the uninstructed say the Amen at your thanksgiving[c][b], since he does not know what you are saying?
translation:
  language: ig
  text: Ma ọ bụghị ya, ọ bụrụ na ị na-agọzi n’ime mmụọ[b], olee otú onye nọ n’ọnọdụ onye na-enweghị ọmụma[a] ga-esi sị, “Amen,” n’oge ị na-enye ekele[c], ebe ọ bụ na ọ maghị ihe ị na-ekwu?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya ‘onye na-abụghị ọkachamara,’ ‘onye nkịtị,’ ma ọ bụ ‘onye a na-akụzighị.’
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya ‘site na mmụọ.’ Okwu Grik anaghị ekpebi nkọwa ka nke ahụ kpọmkwem n’ebe a.
    reason: alternative_reading
  - marker: c
    text: ‘Inye ekele’ n’ebe a pụtara ikwupụta ekele; ọ pụtaghị n’ezie na ọ bụ aha emume e mesịrị kpọọ ‘Yukarist.’
    reason: cultural_note
lexical_decisions:
- source_word: ἐπεὶ ἐὰν
  choice: Ma ọ bụghị ya, ọ bụrụ na
  rationale: Nkebiokwu a na-eweta ọnọdụ dabere n'ihe Pọl kwuru tupu ya, ma na-egosikwa ihe ga-esi na ya pụta; nsụgharị a na-eme ka njikọ ahụ doo anya n'Igbo.
- source_word: εὐλογῇς
  choice: ị na-agọzi
  rationale: Nke a na-edobe echiche bụ isi nke ikwu okwu ngọzi n'ofufe, n'agbanyeghị na ihe a na-agọzi ekwughị kpọmkwem na Grik.
- source_word: πνεύματι
  choice: n'ime mmụọ
  rationale: Dative Grik nwere ike ịpụta ‘n'ime mmụọ’ ma ọ bụ ‘site na mmụọ.’ Nhọrọ a na-ahapụ oghe ma ọ bụ mmụọ onye na-ekwu okwu ka a na-ekwu ma ọ bụ okwu Mmụọ na-enyere aka.
- source_word: ὁ ἀναπληρῶν τὸν τόπον τοῦ ἰδιώτου
  choice: onye nọ n'ọnọdụ onye a na-akụzibeghị
  rationale: Nke a na-enye n'Igbo dị mfe nghọta ihe oyiyi nke onye nọ n'ọnọdụ onye na-enweghị ihe ọmụma pụrụ iche banyere okwu a na-ekwu.
- source_word: πῶς ἐρεῖ τὸ Ἀμήν
  choice: olee otú ... ga-esi kwuo, “Amen”
  rationale: A hapụrụ ‘Amen’ dịka okwu nzaghachi ọgbakọ ji ekwenye n'okwu ekpere ma ọ bụ ekele.
- source_word: ἐπὶ τῇ σῇ εὐχαριστίᾳ
  choice: mgbe ị na-enye ekele
  rationale: Nke a na-egosi omume inye ekele n'ụzọ doro anya, na-enweghị ime εὐχαριστία ka ọ bụrụ aha emume okpukpe e mesịrị kpọọ Yukarist.
- source_word: ἐπειδὴ τί λέγεις οὐκ οἶδεν
  choice: ebe ọ bụ na ọ maghị ihe ị na-ekwu
  rationale: Nsụgharị a na-esochi okwu Grik nso ma na-akọwa ihe mere onye ahụ na-apụghị iji ‘Amen’ zaghachi.
theological_decisions:
- issue: Ihe πνεύματι pụtara n'ọnọdụ ofufe a
  choice: n'ime mmụọ
  alternative: site na mmụọ; jiri mmụọ gị
  rationale: Amaokwu a anaghị ekpebi kpọmkwem ma ọ bụ mmụọ mmadụ ka a na-ekwu ma ọ bụ okwu nke Mmụọ Nsọ na-enyere aka; ya mere, a hapụrụ ihe ahụ ka ọ ghara ịbụ nkwubi okwu ozizi.
- issue: Ihe εὐχαριστίᾳ pụtara
  choice: inye ekele
  alternative: Yukarist
  rationale: Ihe gbara amaokwu ahụ gburugburu bụ okwu ekele nke onye ọzọ kwesịrị ịghọta wee sị ‘Amen’; ọ naghị achọ ka a ghọta ya dịka aha emume sacrament e mesịrị.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta mee ihe. A haziri ahịrịokwu ahụ ka ọ na-aga nke ọma n'ọnụ, ma e chekwara mgbagwoju anya dị na πνεύματι na ọdịiche pụtara na ἰδιώτης.
