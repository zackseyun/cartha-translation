revisions:
- from: Ma ọ bụghị ya, ọ bụrụ na ị na-agọzi n'ime mmụọ[b], olee otú onye nọ n'ọnọdụ onye a na-akụzibeghị[a] ga-esi kwuo, “Amen,” mgbe ị na-enye ekele[c], ebe ọ bụ na ọ maghị ihe ị na-ekwu?
  to: Ma ọ bụghị ya, ọ bụrụ na ị na-agọzi n’ime mmụọ[b], olee otú onye nọ n’ọnọdụ onye na-enweghị ọmụma[a] ga-esi sị, “Amen,” n’oge ị na-enye ekele[c], ebe ọ bụ na ọ maghị ihe ị na-ekwu?
  rationale: The revision corrects the unwarranted “not yet” implication in the rendering of ἰδιώτης and improves idiomatic Igbo for the liturgical response, while preserving the Greek ambiguity concerning πνεύματι and avoiding a technical sacramental interpretation of εὐχαριστία. All footnote markers remain present and correctly anchored.
  reviewer_model: gpt-5.6-terra
