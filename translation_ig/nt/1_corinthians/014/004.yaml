id: 1CO.14.4
reference: 1 Corinthians 14:4
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ λαλῶν γλώσσῃ ἑαυτὸν οἰκοδομεῖ· ὁ δὲ προφητεύων ἐκκλησίαν οἰκοδομεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/004.yaml
  text: The one who speaks in a tongue builds up himself[c][b][a], but the one who prophesies builds up the church.
translation:
  language: ig
  text: Onye na-ekwu okwu n’asụsụ[a] na-ewuli onwe ya[b] elu; ma onye na-ebu amụma na-ewuli ọgbakọ[c] elu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, ‘n’otu asụsụ.’ N’isi a, okwu ahụ yiri ka ọ na-ezo aka n’onyinye ikwu okwu n’asụsụ; ma a ka na-arụrịta ụka banyere ụdị okwu ahụ kpọmkwem.
    reason: lexical_alternative
  - marker: b
    text: N’asụsụ Grik, ọ bụ ‘onwe ya’ n’ụdị nwoke otu onye, ma e ji ya anọchi anya onye ọ bụla. N’Igbo, ‘ya’ anaghị egosi nwoke ma ọ bụ nwanyị.
    reason: lexical_alternative
  - marker: c
    text: A pụkwara ịsụgharị ya, ‘ụka,’ ‘nzukọ,’ ma ọ bụ ‘ọgbakọ ndị kwere ekwe.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ λαλῶν
  choice: Onye na-ekwu okwu
  rationale: Nkebiokwu a na-arụ ọrụ dị ka aha onye, na-ekwu maka onye ọ bụla e ji mee ihe atụ. Nhọrọ a na-edebekwa nhazi yiri nke dị n’akụkụ nke abụọ.
- source_word: γλώσσῃ
  choice: n’asụsụ
  rationale: Aha a dị n’otu, ọ bụghị n’ọtụtụ. ‘N’asụsụ’ na-edebe otu ahụ ma ghara ikpebi kpọmkwem ụdị okwu ahụ, ebe isi 12–14 na-ekwu maka onyinye ikwu okwu n’asụsụ.
- source_word: ἑαυτὸν
  choice: onwe ya
  rationale: Nke a bụ nnọchiaha na-alaghachikwuru onye ahụ n’onwe ya. Igbo anaghị egosi nwoke ma ọ bụ nwanyị na ‘ya,’ ma ọ na-edebe otu onye na ihe nnọchiaha Grik pụtara.
- source_word: οἰκοδομεῖ
  choice: na-ewuli ... elu
  rationale: Okwu ahụ bụ ihe atụ sitere n’ịrụ ụlọ, ma ebe a ọ pụtara ime ka mmadụ ma ọ bụ ọgbakọ sie ike ma too n’ụzọ ime mmụọ. ‘Na-ewuli ... elu’ na-edebe ihe atụ ahụ n’Igbo dị mfe nghọta.
- source_word: ὁ δὲ προφητεύων
  choice: ma onye na-ebu amụma
  rationale: ‘Ma’ na-egosi obere ọdịiche δέ na-eweta. ‘Onye na-ebu amụma’ bụ ụzọ Igbo a maara nke ọma isi kọwaa onye na-ekwu okwu amụma.
- source_word: ἐκκλησίαν
  choice: ọgbakọ
  rationale: N’ebe a, okwu ahụ na-ezo aka n’ọgbakọ ndị kwere ekwe, karịsịa mgbe ha gbakọtara ọnụ. ‘Ọgbakọ’ na-ezere echiche ụlọ ụka ma kwekọọ na ọdịiche dị n’etiti uru onye naanị ya na uru ndị niile gbakọtara.
theological_decisions:
- issue: Ihe γλώσσῃ pụtara na 1 Ndị Kọrịnt 12–14
  choice: Jiri ‘n’asụsụ’ mee ka o kwe omume ịghọta ya dị ka okwu sitere n’onyinye asụsụ, n’ebughị ụzọ kọwaa ụdị okwu ahụ kpọmkwem.
  alternative: ‘N’asụsụ ọzọ,’ ‘n’asụsụ dị iche,’ ma ọ bụ okwu na-akọwa ya naanị dị ka okwu obi ụtọ na-enweghị asụsụ mmadụ.
  rationale: Ihe gbara amaokwu a gburugburu bụ onyinye asụsụ n’ofufe ọgbakọ, ma a ka na-arụrịta ụka banyere ma ọ bụ asụsụ mba ọzọ, okwu mmụọ pụrụ iche, ma ọ bụ ụdị ọzọ. Nsụgharị ahụ echekwala nghọtahie a kama ikpebi ya n’ụzọ otu ozizi.
- issue: Ụdị nwoke otu onye dị na Grik
  choice: ‘Onye ... onwe ya,’ nke na-anọchi anya onye ọ bụla n’Igbo.
  alternative: Ịtinye okwu kpọmkwem na-egosi nwoke.
  rationale: Grik ji ụdị nwoke otu onye mee ihe n’ụzọ nnọchiteanya. Igbo ‘onye’ na ‘ya’ anaghị ekewa nwoke na nwanyị, ya mere ha na-ebute ụkpụrụ izugbe ahụ n’enweghị ịgbakwunye nkọwa na-adịghị n’asụsụ Igbo.
- issue: Ihe οἰκοδομεῖ pụtara
  choice: Debe ihe atụ ahụ dịka ‘na-ewuli ... elu.’
  alternative: ‘Na-eme ka ... sie ike’ ma ọ bụ ‘na-enye ... uru.’
  rationale: Ihe atụ nke iwuli elu dị na Grik ma bụrụkwa ihe a na-aghọta n’Igbo. Ọ na-egosi uto ma ọ bụ nkwado ime mmụọ n’enweghị ịkọwapụta kpọmkwem otú o si eme.
translation_notes:
  register: E ji Igbo ọkọlọtọ, nke dị ugbu a ma dị nsọpụrụ, dee ya. Ahịrịokwu ahụ dị mfe maka ndị nkịtị, ma o debere nhazi abụọ yiri ibe ha, ọdịiche nke δέ, otu onye nke γλώσσῃ, na ihe atụ nke ‘iwuli elu.’
