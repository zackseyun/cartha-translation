source:
  edition: SBLGNT
  text: οὕτως καὶ ὑμεῖς, ἐπεὶ ζηλωταί ἐστε πνευμάτων, πρὸς τὴν οἰκοδομὴν τῆς ἐκκλησίας ζητεῖτε ἵνα περισσεύητε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/012.yaml
  text: So also you[a], since you are eager for spiritual gifts, seek to abound for the building up of the church.
translation:
  language: ig
  text: Otú ahụ ka unu kwa, ebe ọ bụ na unu na-anụ ọkụ n’obi maka onyinye ime mmụọ[a], chọsienụ ike ka unu baa ụba maka iwulite nzukọ ahụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'N’asụsụ Grik: “ihe ime mmụọ” ma ọ bụ “mmụọ”; ihe gbara amaokwu a gburugburu na-egosi onyinye ime mmụọ ma ọ bụ ngosipụta nke Mmụọ Nsọ.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως καὶ ὑμεῖς
  choice: Ya mere, unu onwe unu kwa
  rationale: Na-ejikọta ndụmọdụ a na ihe atụ Pọl kwuru tupu ya, ma mee ka ntụnyere ahụ doo anya n’Igbo.
- source_word: ἐπεὶ ζηλωταί ἐστε
  choice: ebe unu na-anụ ọkụ n’obi maka
  rationale: Na-egosi ihe kpatara ndụmọdụ ahụ, ma sụgharịa ịnụ ọkụ n’obi n’asụsụ Igbo dị ndụ ma kwanyere ùgwù.
- source_word: πνευμάτων
  choice: onyinye ime mmụọ[a]
  rationale: Ihe gbara amaokwu ahụ gburugburu bụ onyinye na ngosipụta nke Mmụọ Nsọ; ihe odide Grik n’onwe ya dị mkpụmkpụ ma pụtakwa n’ụzọ karịrị otu, ya mere e debere nke ahụ n’okpuru peeji.
- source_word: πρὸς τὴν οἰκοδομὴν τῆς ἐκκλησίας
  choice: n’ihe ndị na-ewulite nzukọ ahụ
  rationale: Na-echekwa ihe atụ nke iwulite, ma na-egosi na ebumnuche ya bụ ime ka ọgbakọ ndị kwere ekwe sie ike.
- source_word: ζητεῖτε ἵνα περισσεύητε
  choice: gbalịanụ ka unu baa ụba
  rationale: Imperativu ahụ na-akpọ ha ka ha jiri ọchịchọ siri ike chụsoo ịdị ukwuu ma ọ bụ ịba ụba; a hapụghị ya ka ọ pụta naanị dị ka inwe ọtụtụ onyinye.
theological_decisions:
- issue: Ihe πνευμάτων pụtara n’ebe a
  choice: onyinye ime mmụọ
  alternative: ihe ime mmụọ; mmụọ dị iche iche
  rationale: Isiokwu 1 Ndị Kọrịnt 12–14 na-atụle onyinye na ngosipụta ndị sitere n’aka Mmụọ Nsọ. Ma n’ihi na Grik kwuru naanị ‘πνευμάτων,’ e gosipụtara nghọta ndị ọzọ n’okpuru peeji ka a ghara ikpochapụ mgbagwoju anya dị n’isi mmalite.
- issue: Ihe ha ga-aba ụba na ya
  choice: ihe ndị na-ewulite nzukọ ahụ
  alternative: ịba ụba n’onyinye ime mmụọ
  rationale: Grik ekwughị kpọmkwem ‘n’ime ha.’ Nhazi ahịrịokwu ahụ na-etinye ịba ụba n’ebe ebumnuche iwulite nzukọ dị, ya mere nsụgharị a anaghị ekwusi ike na onyinye n’onwe ha bụ kpọmkwem ihe a ga-aba ụba na ya.
translation_notes:
  register: Standard Igbo dị ugbu a, nke a pụrụ ịghọta n’ọgbakọ na n’ọgụgụ onwe onye. E ji ‘nzukọ’ mee ἐκκλησία iji gosipụta ọgbakọ ndị kwere ekwe n’ebe a, ma zere ka okwu ahụ bụrụ naanị ụlọ ụka.
