  yaml_path: translation/nt/1_corinthians/014/018.yaml
  text: I thank God that I speak in tongues more than all of you[a].
translation:
  language: ig
  text: Ana m ekele Chineke na m na-asụ asụsụ karịa unu niile.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Ana m asụ ire karịa unu niile.” Okwu Grik ahụ nwere ike ịpụta “asụsụ,” ma n’ebe a ọ na-ezo aka n’ihe a na-atụle n’1 Ndị Kọrịnt 12–14, nke a na-akpọkarị “ire” n’ụzọ ọdịnala.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐχαριστῶ
  choice: Ana m ekele
  rationale: Oge ugbu a, onye mbụ otu. “Ana m ekele” bụ ụzọ Igbo nkịtị na nke doro anya isi kwuo ekele a na-enye Chineke.
- source_word: τῷ θεῷ
  choice: Chineke
  rationale: Dative a bụ onye a na-ekele; n'Igbo, ngwaa “ikele” na-ewere onye a na-ekele ozugbo.
- source_word: πάντων ὑμῶν μᾶλλον
  choice: karịa unu niile
  rationale: Nke a na-egosipụta ntụnyere Pọl na ndị niile ọ na-agwa okwu, na-edoghị ya anya karịa ka Grik si kwuo.
- source_word: γλώσσαις
  choice: asụsụ dị iche iche
  rationale: γλῶσσα nwere ike ịpụta ire ma ọ bụ asụsụ; n'ọnọdụ 1 Ndị Kọrịnt 12–14, ọ bụ aha e ji akọwa ihe ime mmụọ a na-atụle. Nhọrọ a na-ada ka Igbo sitere n'okike, ebe nkọwa ala peeji na-echekwa okwu ọdịnala “ire dị iche iche.”
- source_word: λαλῶ
  choice: na m na-asụ
  rationale: Oge ugbu a, onye mbụ otu; “ịsụ asụsụ” bụ njikọ okwu Igbo kwesịrị ekwesị maka ikwu okwu n'asụsụ.
theological_decisions:
- issue: Ntụgharị γλώσσαις n'okwu gbasara onyinye ime mmụọ
  choice: asụsụ dị iche iche
  alternative: ire dị iche iche
  rationale: Nhọrọ isi na-enye nghọta γλῶσσα dị ka “asụsụ” n'Igbo nkịtị, ma nkọwa [a] na-echekwa aha ọdịnala ahụ ma na-ekwupụta na amaokwu ahụ anaghị akọwapụta kpọmkwem ụdị okwu ahụ. Ya mere, a naghị ekpebi ma ọ bụ asụsụ mmadụ a maara, okwu mmụọ, ma ọ bụ ụdị ọzọ.
translation_notes:
  register: Igbo Izugbe dị ugbu a, kwụ ọtọ ma dị ùgwù. E ji “asụsụ dị iche iche” mee ka amaokwu ahụ ghọta ndị nkịtị, ebe e debere okwu ọdịnala “ire dị iche iche” na nkọwa ala peeji iji chekwaa obosara okwu Grik na esemokwu nkà mmụta okpukpe.
