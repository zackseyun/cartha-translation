    text: Ma ọ bụ, “Ana m asụ ire karịa unu niile.” Okwu Grik ahụ nwere ike ịpụta “asụsụ,” ma n’ebe a ọ na-ezo aka n’ihe a na-atụle n’1 Ndị Kọrịnt 12–14, nke a na-akpọkarị “ire” n’ụzọ ọdịnala.
    reason: lexical_alternative
  revision_rationale: The revision removes “dị iche iche,” which is not explicitly present in the Greek and can over-specify γλώσσαις as distinct human languages. The revised wording remains natural Igbo and leaves the debated character of the speech unresolved, while the footnote retains the literal/traditional “ire” alternative and identifies the contextual usage.
