  yaml_path: translation/nt/1_corinthians/014/017.yaml
  text: For you are indeed giving thanks well[a], but the other person is not built up.
translation:
  language: ig
  text: N’ihi na n’ezie, ị na-enye ekele nke ọma, ma a naghị ewuli[a] onye nke ọzọ elu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “onye nke ọzọ anaghị enweta owuwu elu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: σὺ
  choice: ị
  rationale: Aha nnọchiaha a na-egosi otu onye a na-agwa okwu, dị ka Grik si kwuo.
- source_word: μὲν γὰρ
  choice: N’ihi na n’ezie
  rationale: “N’ihi na” na-egosi nkọwa γάρ, ebe “n’ezie” na-eburu nkwenye nke μέν nke na-akwadebe ọdịiche ἀλλά ga-eweta.
- source_word: καλῶς
  choice: nke ọma
  rationale: Nke a bụ okwu Igbo doro anya ma bụrụkwa nke e ji ekwu na e mere ihe n’ụzọ kwesịrị ekwesị.
- source_word: εὐχαριστεῖς
  choice: ị na-enye ekele
  rationale: Ọ na-egosipụta omume inye ekele n’ekpere ma ghara ịtinye onye a na-enye ekele n’ahịrịokwu ebe Grik akpọghị ya aha kpọmkwem.
- source_word: ἀλλ’
  choice: ma
  rationale: Ọ na-eweta ọdịiche doro anya n’etiti ekele onye ahụ na uru onye ọzọ na-erite.
- source_word: ὁ ἕτερος
  choice: onye nke ọzọ
  rationale: Ọ na-ezo aka n’onye ọzọ nọ ná nzukọ ahụ, n’etinyeghị nkọwa karịrị ihe isi mmalite kwuru.
- source_word: οὐκ οἰκοδομεῖται
  choice: a naghị ewulite
  rationale: Ọ na-edobe ihe atụ Pọl ji okwu iwuli ụlọ kọwaa ime ka mmadụ sie ike ma ọ bụ baara ya uru n’ime mmụọ.
theological_decisions:
- issue: Ihe atụ Pọl nke οἰκοδομέω n’ọgbakọ
  choice: a naghị ewulite
  alternative: onye nke ọzọ anaghị enweta nkwado ime mmụọ
  rationale: Nhọrọ a na-edobe ihe atụ e ji iwuli ụlọ mee, ma ihe ọzọ dị n’ala ala peeji na-akọwa uche ime mmụọ ya n’enweghị ịgbakwụnye ozizi otu chọọchị.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-edobe ị nke otu onye, usoro nkwenye na ọdịiche nke μέν ... ἀλλά, nakwa ihe atụ nke ‘iwulite.’
