review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the direct second-person address, explanatory/concessive setup, thanksgiving, and the contrast that the other person does not receive the benefit of being built up. The impersonal passive form should more clearly mark the Pauline ‘build up’ metaphor in idiomatic Igbo.
  naturalness: “A naghị ewulite onye nke ọzọ” is understandable, but “a naghị ewuli onye nke ọzọ elu” is the more natural and established Igbo expression for building up a person, while retaining the construction metaphor.
  terminology: “Ị na-enye ekele nke ọma” is suitable for εὐχαριστεῖς. “Ewuli ... elu” preserves οἰκοδομεῖται without replacing it in the main text with the interpretive phrase “nkwado ime mmụọ.”
  issues:
  - severity: medium
    issue: The main-text passive metaphor is somewhat unnatural as phrased.
    rationale: Changing “a naghị ewulite onye nke ọzọ” to “a naghị ewuli onye nke ọzọ elu” gives a natural Standard Igbo passive expression and retains the metaphor of edification.
  - severity: low
    issue: The footnote gives an interpretive paraphrase rather than a close lexical alternative.
    rationale: “Nkwado ime mmụọ” adds an explicit spiritual qualifier not present in the Greek. A footnote should instead identify the traditional equivalent “edified” in natural Igbo wording.
  revised_text: N’ihi na n’ezie, ị na-enye ekele nke ọma, ma a naghị ewuli[a] onye nke ọzọ elu.
