  text: But if anyone does not recognize this[b][a], he is not recognized.
translation:
  language: ig
  text: Ma ọ bụrụ na onye ọ bụla eleghara nke a anya[b][a], a na-eleghara ya anya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ụfọdụ ihe odide na-agụ, “Ma ọ bụrụ na onye ọ bụla amaghị, ya nọgide n’amaghị.” Ihe odide a nabatara na-agụ, “Ma ọ bụrụ na onye ọ bụla eleghara nke a anya, a na-eleghara ya anya.”
    reason: textual_variant
  - marker: b
    text: A pụkwara ịsị, “ọ bụrụ na onye ọ bụla ajụ ịnakwere nke a, a jụ ịnakwere ya.” N’asụsụ Grik, e ji otu ngwaa ahụ mee ihe mbụ n’ụdị onye na-eme omume, emesịa n’ụdị onye a na-eme omume, iji mesie nkwughachi ahụ ike.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ
  choice: ọ bụrụ na
  rationale: Nke a bụ ụzọ Igbo nkịtị si webata ọnọdụ, n’emeghị ka e kwuo na ọnọdụ ahụ bụ eziokwu n’ezie.
- source_word: δέ
  choice: ma
  rationale: Ọ na-egosi ntụgharị nwere ọdịiche n’ihe Pọl kwuru tupu nke a.
- source_word: τις
  choice: onye ọ bụla
  rationale: Ọ na-ezo aka n’onye ọbụla n’ozuzu, dị ka okwu Grik ahụ si dị.
- source_word: ἀγνοεῖ
  choice: amataghị
  rationale: N’ebe a, okwu ahụ nwere ike ịpụta na mmadụ aghọtaghị ma ọ bụ na ọ jụrụ ịmata ma kweta n’iwu Pọl kwuru. ‘Amataghị’ na-edobe oghere nkọwa a ma kwekọọ n’okwu dị na amaokwu 37.
- source_word: ἀγνοεῖται
  choice: a naghị amata ya
  rationale: 'Nke a na-edobe ụdị nnara-omume nke okwu Grik ahụ na nkwughachi e ji otu ngwaa rụọ: onye na-amataghị ihe a, a naghịkwa amata ya. Ọ naghị ekwu kpọmkwem onye na-adịghị amata ya.'
theological_decisions:
- issue: Ihe ἀγνοεῖται, nke dị n’ụdị nnara-omume, pụtara
  choice: onye na-adịghị amata ma ọ bụ na-ajụ ịnabata ntụziaka ndịozi, a naghị amata ya
  alternative: ‘ya nọgide n’amaghị ihe’ dịka ụfọdụ ihe odide si agụ; ma ọ bụ naanị ‘a maghị onye ọ bụ’
  rationale: SBLGNT nwere ngwaa nnara-omume nke na-akọ ihe na-eme, ọ bụghị iwu. Nsụgharị a na-edobe mmetụta nke ịkwụghachi ihe mmadụ mere n’ụdị yiri ya, ma ọ naghị akpọpụta ma ọ bụ Chineke ma ọ bụ ọgbakọ dịka onye na-eme omume ahụ.
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, dị mfe ma dị ugwu. ‘Amataghị … a naghị amata’ na-edobe nkwughachi okwu Grik na nghọta ya nwere ike ịbụ amaghị, amataghị, ma ọ bụ ịjụ ịnabata, n’ebughị otu nkọwa okpukpe n’elu ndị ọzọ.
