id: 1CO.14.22
reference: 1 Corinthians 14:22
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὥστε αἱ γλῶσσαι εἰς σημεῖόν εἰσιν οὐ τοῖς πιστεύουσιν ἀλλὰ τοῖς ἀπίστοις, ἡ δὲ προφητεία οὐ τοῖς ἀπίστοις ἀλλὰ τοῖς πιστεύουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/022.yaml
  text: So then[a], tongues are for a sign not to those who believe but to unbelievers[b], while prophecy is not to unbelievers but to those who believe.
translation:
  language: ig
  text: Ya mere, ikwu okwu n’asụsụ dị iche iche[a] bụ ihe ịrịba ama[b], ọ bụghị nye ndị kwere ekwe, kama ọ bụ nye ndị na-ekweghị ekwe; ma ibu amụma abụghị nye ndị na-ekweghị ekwe, kama ọ bụ nye ndị kwere ekwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Okwu Grik ahụ nwekwara ike ịpụta “asụsụ.” N’isi 12–14, “ikwu okwu n’asụsụ dị iche iche” na-edebe okwu Pọl ji mee ihe, ma ọ naghị ekpebi kpọmkwem ụdị okwu ahụ.
    reason: lexical_alternative
  - marker: b
    text: N’ihi ihe e hotara n’Aịzaya 28:11–12 n’amaokwu ndị bu ụzọ, ụfọdụ ndị na-akọwa Akwụkwọ Nsọ na-aghọta “ihe ịrịba ama” ebe a dị ka ihe ịrịba ama nke ikpe.
    reason: cross_reference
lexical_decisions:
- source_word: ὥστε
  choice: Ya mere
  rationale: Na-egosi nkwubi okwu Pọl wepụtara n’ihe o kwuru tupu nke a, n’ụzọ doro anya ma bụrụkwa Igbo a na-asụ ugbu a.
- source_word: γλῶσσαι
  choice: ikwu okwu n’asụsụ dị iche iche
  rationale: Nke a bụ okwu Igbo doro anya maka onyinye ma ọ bụ omume a na-atụle na 1 Ndị Kọrịnt 12–14. Ọ naghị ekpebi ma okwu ahụ ọ̀ bụ asụsụ mba ọzọ ma ọ bụ ụdị okwu pụrụ iche nke mmụọ.
- source_word: εἰς σημεῖόν
  choice: bụ ihe ịrịba ama
  rationale: Na-echekwa echiche nke ịbụ ihe ịrịba ama n’enweghị ịkọwapụta ma ọ bụ ihe nkwado, ihe ịdọ aka ná ntị, ma ọ bụ ihe ikpe.
- source_word: τοῖς πιστεύουσιν
  choice: nye ndị kwere ekwe
  rationale: Na-egosipụta participle ahụ dị ka ndị e ji omume ikwere mara, ma na-anọgide n’ụdị Igbo dị nkenke ma dịkwa eke.
- source_word: τοῖς ἀπίστοις
  choice: nye ndị na-ekweghị ekwe
  rationale: Na-eme ka ntụnyere ya na ‘ndị kwere ekwe’ pụta ìhè ma zere aha nke nwere ike ịdị arọ ma ọ bụ nke ụka pụrụ iche.
- source_word: προφητεία
  choice: ibu amụma
  rationale: Na-ezo aka n’omume ma ọ bụ onyinye nke ikwupụta amụma n’ebe a, ọ bụghị nanị n’ozi amụma e dere ede.
- source_word: δὲ
  choice: ma
  rationale: Na-egosi ọdịiche dị n’etiti ikwu okwu n’asụsụ dị iche iche na ibu amụma n’ụzọ Igbo dị mfe.
theological_decisions:
- issue: Ihe γλῶσσαι pụtara n’ọnọdụ onyinye ime mmụọ
  choice: ikwu okwu n’asụsụ dị iche iche
  alternative: asụsụ mba ọzọ; okwu mmụọ a na-apụghị ịghọta
  rationale: Edebere okwu ahụ n’ụdị sara mbara nke kwekọrọ n’okwu Pọl n’isi 12–14, n’enweghị ịmanye otu nkọwa ụka banyere ụdị okwu ahụ.
- issue: Ike σημεῖον nwere n’ihe gbasara ndị na-ekweghị ekwe
  choice: ihe ịrịba ama
  alternative: ihe ịrịba ama nke nkwado; ihe ịrịba ama nke ikpe
  rationale: Grik kwuru naanị ‘ihe ịrịba ama.’ Ntụaka Aịzaya dị n’amaokwu ndị bu ụzọ emeela ka e nwee nkọwa dị iche iche; ya mere, isi ederede anaghị ekpebi arụmụka ahụ.
translation_notes:
  register: Standard Igbo dị ugbu a, kwụ ọtọ ma nwee ugwu. E ji ‘ndị kwere ekwe / ndị na-ekweghị ekwe’ mee ka ntụnyere Grik pụta ìhè. E tinyere akara nkọwa [a] n’ebe okwu γλῶσσαι dị, na [b] n’ebe σημεῖον dị, ka nkọwa ụkwụ ọ bụla kwekọọ kpọmkwem n’okwu ọ na-akọwa.
