review_pass:
  verdict: revise
  source_fidelity: 'The main clause structure and contrasts accurately reflect the Greek: tongues/languages are a sign not for believers but for unbelievers, whereas prophecy is not for unbelievers but for believers. The rendering of γλῶσσαι as “ikwu okwu n’asụsụ dị iche iche” is an established, intelligible Igbo expression in this context and does not by itself settle the debated nature of the phenomenon. However, footnote a unnecessarily introduces “ire” (‘physical tongue’), a contextual sense not at issue in 1 Corinthians 12–14 and not represented in the English audit trail.'
  naturalness: The wording is clear, modern Standard Igbo, and the balanced contrast (“ọ bụghị ... kama ...; ma ... abụghị ... kama ...”) reads naturally. “Ibu amụma” is appropriate for προφητεία in this setting.
  terminology: “Ndị kwere ekwe / ndị na-ekweghị ekwe,” “ihe ịrịba ama,” and “ibu amụma” are suitable and consistent. The lexical note should limit the alternative for γλῶσσαι to ‘languages,’ preserving the contextual Pauline terminology without distracting with the anatomical sense.
  issues:
  - severity: low
    issue: Footnote a includes “ire” as an alternative meaning.
    rationale: Although γλῶσσα can denote a physical tongue in other contexts, that sense is not a viable contextual alternative here. Including it weakens the note’s precision and departs from the English audit trail, which identifies only ‘languages’ as the lexical alternative.
  revised_text: Ya mere, ikwu okwu n’asụsụ dị iche iche[a] bụ ihe ịrịba ama[b], ọ bụghị nye ndị kwere ekwe, kama ọ bụ nye ndị na-ekweghị ekwe; ma ibu amụma abụghị nye ndị na-ekweghị ekwe, kama ọ bụ nye ndị kwere ekwe.
