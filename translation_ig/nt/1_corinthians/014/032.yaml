  yaml_path: translation/nt/1_corinthians/014/032.yaml
  text: And the spirits of prophets are subject to prophets,[a]
translation:
  language: ig
  text: Ọzọkwa, mmụọ ndị amụma na-erubere ndị amụma isi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “mmụọ nke ndị amụma na-erubere ndị amụma isi.” Nkebiokwu a nwere ike izo aka na mkpali ibu amụma ma ọ bụ ọrụ ime mmụọ metụtara ndị amụma; n’ọnọdụ a, ọ pụrụ igosi na ndị na-ebu amụma na-ejide onwe ha.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: na-
  rationale: Njikọ a na-agbakwụnye okwu a n'ihe Pọl kwuru tupu ya. N'Igbo, njikọ dị n'ụdị ahịrịokwu a na-apụta nke ọma site na “na-” dị n'isi ngwaa, kama ịmalite ya na “Ma” ma ọ bụ “Na.”
- source_word: πνεύματα
  choice: Mmụọ
  rationale: “Mmụọ” na-edobe ihe okwu Grik pụtara n'ụzọ sara mbara, n'etinyeghị “okwu amụma” ma ọ bụ “onyinye mmụọ” n'isiokwu ahụ.
- source_word: προφητῶν
  choice: ndị amụma
  rationale: N'ebe a, nhazi “Mmụọ ndị amụma” na-egosi njikọ nke genitive ahụ n'ụzọ dị mfe ma kwekọọ n'Igbo nkịtị.
- source_word: προφήταις
  choice: n'okpuru ndị amụma
  rationale: N'ịgbaso ngwaa nke ido onwe n'okpuru, “n'okpuru ndị amụma” na-egosi ndị mmụọ ahụ na-edo onwe ha n'okpuru ha, na-enweghị ịkọwa ma ọ bụ gbanwee ndị ahụ ịbụ naanị ndị amụma ndị ọzọ.
- source_word: ὑποτάσσεται
  choice: na-edokwa onwe ha n'okpuru
  rationale: Nhọrọ a na-egosipụta echiche nke nrubeisi ma ọ bụ ịnọ n'okpuru nchịkwa. “Onwe ha” na-egosikwa ọdịdị middle/passive nke ngwaa ahụ n'ụzọ Igbo na-aghọta nke ọma; “-kwa” na-eburu ọrụ njikọ καὶ n'okwu a.
theological_decisions:
- issue: Ihe “mmụọ ndị amụma” pụtara na otú o si metụta njide onwe onye mgbe a na-ebu amụma
  choice: E debere “Mmụọ ndị amụma” n'isiokwu ahụ, ebe ihe odide ala ala na-akọwa na ọ pụrụ izo aka na mkpali ma ọ bụ ọrụ ime mmụọ metụtara ndị amụma.
  alternative: Ịsụgharị ya ozugbo dị ka “mkpali ibu amụma” ma ọ bụ ikwu na mmụọ mmadụ nke otu onye amụma na-edo onwe ya n'okpuru ndị amụma ndị ọzọ.
  rationale: Ihe ndị gbara amaokwu ahụ gburugburu na-emesi usoro na njide onwe onye ike, ma okwu Grik n'onwe ya ka nwere obosara ụfọdụ. Ya mere, isiokwu ahụ anaghị ekpebi nkọwa ahụ karịa ka isi mmalite si mee.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. A họọrọ “na-edokwa onwe ha n'okpuru” iji mee ka njikọ amaokwu ahụ na echiche nke nrubeisi/nchịkwa doo anya, ebe a hapụrụ “mmụọ ndị amụma” ka o chekwaa obosara na mgbagwoju anya nke okwu mbụ.
