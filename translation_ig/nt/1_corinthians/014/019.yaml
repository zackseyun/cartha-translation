revisions:
- from: Ma n'ọgbakọ ndị kwere ekwe, ọ ga-akara m mma iji uche m kwuo okwu ise, ka m wee kụzikwaara ndị ọzọ ihe, karịa ikwu puku okwu iri n'asụsụ[a].
  to: Ma n'ọgbakọ ndị kwere ekwe, ọ ga-akara m mma iji uche m kwuo okwu ise, ka m wee kụzikwaara ndị ọzọ ihe, karịa ikwu okwu puku iri n'ire[a].
  rationale: A gbanwere naanị nsụgharị γλῶσσα site na “n’asụsụ” gaa na “n’ire” ka e wee ghara ikpebi n’aka otu ihe ụdị okwu ahụ bụ. A na-edobe “asụsụ” dịka nhọrọ ọzọ n’ihe odide ala peeji. E tinyekwara “okwu” n’ihu “puku iri” iji mee ka ntụnyere “okwu ise … okwu puku iri” pụta ìhè n’Igbo.
