id: 1CO.14.19
reference: 1 Corinthians 14:19
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀλλὰ ἐν ἐκκλησίᾳ θέλω πέντε λόγους ⸂τῷ νοΐ⸃ μου λαλῆσαι, ἵνα καὶ ἄλλους κατηχήσω, ἢ μυρίους λόγους ἐν γλώσσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/019.yaml
  text: But in the church I would rather speak five words with my mind[a], so that I may also instruct others, than ten thousand words in a tongue.
translation:
  language: ig
  text: Ma n'ọgbakọ ndị kwere ekwe, ọ ga-akara m mma iji uche m kwuo okwu ise, ka m wee kụzikwaara ndị ọzọ ihe, karịa ikwu okwu puku iri n'ire[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Okwu Grik a nwere ike ịpụta ‘ire’ ma ọ bụ ‘asụsụ.’ N'ebe a, ọ na-ezo aka n'ụdị okwu a na-atụle na 1 Ndị Kọrịnt isi nke 12 ruo nke 14.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκκλησίᾳ
  choice: n'ọgbakọ ndị kwere ekwe
  rationale: N'ebe a, okwu ahụ na-ezo aka n'ìgwè Ndị Kraịst zukọrọ maka ofufe. Nsụgharị a na-egosi nzukọ ndị ahụ nke ọma n'Igbo nke oge a, kama ime ka ọ dị ka naanị ụlọ ụka.
- source_word: θέλω … ἢ
  choice: ọ ga-akara m mma … karịa
  rationale: Ọ bụ ezie na θέλω pụtara ọchịchọ, njikọ ya na ἢ ebe a na-egosi nhọrọ Pọl họọrọ. Akpaokwu Igbo a na-ewepụta ntụnyere ahụ n'ụzọ doro anya.
- source_word: πέντε λόγους
  choice: okwu ise
  rationale: Nsụgharị a na-edobe ọnụ ọgụgụ na ike nke ntụnyere Pọl n'etiti okwu ise na okwu puku iri.
- source_word: τῷ νοΐ μου
  choice: iji uche m
  rationale: Nke a na-edobe echiche nke νοῦς, ya bụ ikwu okwu site n'uche na nghọta, n'ụzọ dị mfe ma bụrụkwa Igbo nkịtị.
- source_word: λαλῆσαι
  choice: kwuo
  rationale: ‘Ikwu’ bụ ụzọ ebumpụta ụwa e si akọwa omume ikwu okwu n'ihu ọgbakọ n'Igbo.
- source_word: κατηχήσω
  choice: kụzikwaara … ihe
  rationale: κατηχέω na-egosi iji okwu akụziri mmadụ ma mee ka ọ ghọta. ‘Kụzikwaara … ihe’ na-eburu καί (‘kwa’) ma zere itinye nkọwa ụka pụrụ iche e mesịrị.
- source_word: ἄλλους
  choice: ndị ọzọ
  rationale: Nke a bụ nsụgharị Igbo kpọmkwem ma dịkwa mfe nghọta.
- source_word: μυρίους λόγους
  choice: okwu puku iri
  rationale: A na-edobe ọnụ ọgụgụ puku iri, kama ịgbanwe ya ka ọ bụrụ naanị ‘ọtụtụ okwu,’ ka ihe dị egwu n'ntụnyere Pọl wee nọgide.
- source_word: ἐν γλώσσῃ
  choice: n'asụsụ[a]
  rationale: γλῶσσα nwere ike ịpụta ire ma ọ bụ asụsụ, ma n'isiakwụkwọ a ọ na-ezo aka n'ụdị okwu a na-atụle. ‘Asụsụ’ bụ okwu Igbo ebumpụta ụwa; ihe odide ala peeji na-edobe esemokwu banyere kpọmkwem ụdị okwu ahụ.
theological_decisions:
- issue: Otu e si sụgharịa γλῶσσα na 1 Ndị Kọrịnt 12–14
  choice: n'asụsụ
  alternative: n'ire; n'asụsụ pụrụ iche
  rationale: ‘N'asụsụ’ na-edobe isi ihe okwu Grik ahụ pụtara n'enweghị ịkọwa na ọ bụ asụsụ mba ọzọ nkịtị ma ọ bụ okwu mmụọ na-enweghị usoro. A hapụrụ ụdị ihe ahụ kpọmkwem ka ọnọdụ isiakwụkwọ ahụ na ihe odide ala peeji kọwaa ya.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. ‘Ọgbakọ ndị kwere ekwe’ na-eme ka o doo anya na ihe a na-ekwu bụ ndị zukọrọ, ọ bụghị ụlọ. E debere ntụnyere siri ike dị n'etiti okwu ise na okwu puku iri.
