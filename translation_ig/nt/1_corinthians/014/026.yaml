review_pass:
  verdict: revise
  source_fidelity: 'A chọrọ mmezi abụọ iji kwekọọ na Grik: ἀδελφοί enweghị nkebiokwu “m” (‘my’), na ἔχει a kpọghachiri ugboro ise bụ okwu na-akọ ihe dị ugbu a, ọ bụghị ‘nwee’ nke nwere ike ịdị ka iwu ma ọ bụ ọchịchọ. E wepụrụkwa ‘ọgbakọ’ n’ahịrị ikpeazụ, n’ihi na οἰκοδομή enweghị aha ihe a na-ewuli n’akwụkwọ Grik, ọ bụ ezie na ọnọdụ ya na-ekwu maka nzukọ.'
  naturalness: “Gịnịzi ka ọ bụ, ụmụnna?” bụ ajụjụ nkwubi okwu a pụrụ ịghọta n’Igbo. Ịkpọghachi “nwere” na ndepụta ahụ na-eme ka usoro Grik doo anya ma na-adịkwa n’ụzọ Igbo nkịtị. “Maka iwuli elu” na-edobe nghọta zuru ezu nke okwu ikpeazụ n’enweghị itinye onye ma ọ bụ otu a na-ewuli elu n’ime ederede.
  terminology: “Ụmụnna,” “abụ ọma,” “ozizi,” “mkpughe,” “ire,” na “nkọwa” dabara adaba. “Ire” na ihe odide nta ya na-echekwa nghọta abụọ nke γλῶσσα n’enweghị ikpebi ụdị okwu a karịa ihe ederede kwuru.
  issues:
  - severity: medium
    issue: E tinyere “m” na “ụmụnna m.”
    rationale: ἀδελφοί bụ oku ọtụtụ (‘ụmụnna/brothers’) ma enweghị μου (‘m/my’) na SBLGNT.
  - severity: medium
    issue: A sụgharịrị ἔχει ndị sochirinụ dị ka “nwee.”
    rationale: Okwu Grik ἔχει dị ugboro ise, bụrụ indicative ugbu a; “nwere” kwesịrị ịdị n’akụkụ nke ọ bụla ka a ghara ime ka ihe Pọl na-akọ ghọọ iwu ma ọ bụ ọchịchọ.
  - severity: low
    issue: “Ọgbakọ” na “wulie ọgbakọ elu” kọwara ihe οἰκοδομή kpọmkwem karịa ederede Grik si kwuo.
    rationale: Ọnọdụ ya na-akwado iwuli nzukọ elu, mana ihe a na-ewuli elu ka a hapụrụ n’enweghị aha n’ahịrị a. Ntụgharị kwesịrị idobe ohere ahụ.
