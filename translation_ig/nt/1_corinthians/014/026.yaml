id: 1CO.14.26
reference: 1 Corinthians 14:26
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Τί οὖν ἐστιν, ἀδελφοί; ὅταν συνέρχησθε, ⸀ἕκαστος ψαλμὸν ἔχει, διδαχὴν ἔχει, ⸂ἀποκάλυψιν ἔχει, γλῶσσαν⸃ ἔχει, ἑρμηνείαν ἔχει· πάντα πρὸς οἰκοδομὴν γινέσθω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/026.yaml
  text: What then is it[a], brothers? When you come together, each one has a psalm, has a teaching, has a revelation, has a tongue, has an interpretation[b]. Let all things be done for building up.
translation:
  language: ig
  text: Gịnịzi ka ọ bụ, ụmụnna[a]? Mgbe unu zukọrọ, onye ọ bụla nwere abụ ọma, nwere ozizi, nwere mkpughe, nwere ire[b], nwere nkọwa. Ka e mee ihe niile maka iwuli elu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Okwu Grik a sụgharịrị “ụmụnna” dị n’ụdị nwoke, ma n’ebe a ọ na-akpọ ọgbakọ dum, ya bụ, ma ndị nwoke ma ndị nwanyị.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya “asụsụ.” Okwu Grik ahụ nwere ike ịpụta ire ma ọ bụ asụsụ; “ire” ebe a na-echekwa okwu Pọl ji kọwaa ihe a n’isiakwụkwọ a.
    reason: alternative_reading
lexical_decisions:
- source_word: Τί οὖν ἐστιν
  choice: Gịnịzi ka ọ bụ
  rationale: Na-edobe ajụjụ nkwubi okwu Pọl n’ụzọ dị nso n’asụsụ Grik, n’agbanyeghị na okwu ahụ dị mkpirikpi ma nwee ntakịrị nghọta a hapụrụ oghe.
- source_word: ἀδελφοί
  choice: ụmụnna m
  rationale: “Ụmụnna” bụ okwu Igbo e ji akpọ ndị otu ezinụlọ ma ọ bụ ndị otu okwukwe, ọ pụkwara ịgụnye nwoke na nwanyị; “m” na-eme ka oku Pọl bụrụ nke sitere n’obi.
- source_word: ὅταν συνέρχησθε
  choice: Mgbe unu zukọrọ
  rationale: Ọ bụ Igbo nkịtị ma doo anya maka nzukọ ọgbakọ nke na-eme ugboro ugboro.
- source_word: ἕκαστος
  choice: onye ọ bụla
  rationale: Na-egosipụta kpọmkwem na onyinye ndị a na-abịa site n’aka ndị dị iche iche n’otu n’otu.
- source_word: ψαλμὸν
  choice: abụ ọma
  rationale: Okwu Igbo a na-anụkarị maka psalm ma ọ bụ abụ otuto, ma ọ naghị eme ka ọ bụrụ naanị abụ n’ozuzu.
- source_word: διδαχὴν
  choice: ozizi
  rationale: Okwu dị mfe ma kwụ ọtọ maka ihe a na-akụzi n’ọgbakọ, n’enweghị ime ka ọ bụrụ usoro nkwenkwe a haziri ahazi.
- source_word: ἀποκάλυψιν
  choice: mkpughe
  rationale: Na-egosi ihe e mere ka ọ pụta ìhè ma ọ bụ ihe Chineke kpughere, dịka okwu Grik si dị.
- source_word: γλῶσσαν
  choice: ire
  rationale: Na-edobe ihe atụ okwu Grik nke pụtara ma ire ma asụsụ, ka ntụgharị ghara ikpebi kpọmkwem ụdị okwu ahụ bụ.
- source_word: ἑρμηνείαν
  choice: nkọwa
  rationale: Na-adabara ọrụ ime ka ihe e kwuru n’ire doo ọgbakọ anya; ọ naghị amanye ma ọ bụ ntụgharị asụsụ kpọmkwem ma ọ bụ nkọwa sara mbara.
- source_word: πάντα πρὸς οἰκοδομὴν γινέσθω
  choice: Ka e mee ihe niile iji wulie ọgbakọ elu
  rationale: Na-echekwa ihe atụ nke iwu ụlọ n’οἰκοδομή, ma na-akọwa nke ọma na ihe a na-ewuli elu bụ ọgbakọ.
theological_decisions:
- issue: Oku ἀδελφοί e ji ụdị nwoke kpọọ ọgbakọ dum
  choice: ụmụnna m
  alternative: ụmụnne nwoke m; ụmụnna nwoke na nwanyị
  rationale: N’Igbo, “ụmụnna” nwere ike ịkpọkọta ndị nwoke na ndị nwanyị dịka otu ezinụlọ ma ọ bụ otu okwukwe. Ihe odide nta na-eme ka oke okwu Grik na ihe ọ pụtara n’ọnọdụ a doo anya.
- issue: Ihe γλῶσσα pụtara n’isiakwụkwọ a
  choice: ire
  alternative: asụsụ; okwu e kwuru n’ire
  rationale: “Ire” na-echekwa ụzọ Pọl si kwuo ya na esemokwu dị n’etiti akụkụ ahụ mmadụ, asụsụ, na ụdị okwu ime mmụọ a na-atụle, kama ikpebi ihe ahụ karịa ihe odide ahụ.
- issue: Onye ma ọ bụ ihe a na-ewuli elu n’οἰκοδομή
  choice: wulie ọgbakọ elu
  alternative: iwuli elu; ime ka mmadụ sie ike
  rationale: Ọnọdụ nzukọ ọgbakọ na-egosi na ebumnuche bụ iwusi ndị zukọrọ ike dịka otu ahụ, ebe okwu “wulie ... elu” na-echekwa ihe atụ ụlọ ahụ.
translation_notes:
  register: Ejiri Standard Igbo nke dị ugbu a, dị ugwu ma dị mfe nghọta. E debere usoro ndepụta na nkwughachi “nwee” iji mee ka usoro Grik pụta ìhè, ebe “wulie ọgbakọ elu” na-eme ka ihe atụ ikpeazụ doo onye na-agụ ya anya.
