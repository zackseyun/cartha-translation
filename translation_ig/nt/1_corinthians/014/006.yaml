review_pass:
  verdict: revise
  source_fidelity: The fourfold σειρά introduced by ἐν is preserved, as is the rhetorical question. However, “ma ọ bụrụ na agwaghị m unu okwu” is grammatically liable to mean “if I am not told/spoken to,” rather than “unless I speak to you,” because agwa is not correctly inflected here for Paul as the speaking subject. The wording for γλώσσαις should also not add the sense “different” where the Greek simply has the plural “tongues/languages.”
  naturalness: The draft is generally clear and suitably dignified Standard Igbo. Revising the conditional clause to make m the overt agent of gwa okwu removes a substantial ambiguity and produces natural contemporary Igbo.
  terminology: “Mkpughe,” “ọmụma,” “amụma,” and “nkuzi” are appropriate and maintain the parallel list. “Ụmụnna” is a natural congregational address; its inclusive potential can be noted. “Na-ekwu okwu n’asụsụ” preserves the lexical and contextual ambiguity of γλώσσαις without deciding the debated nature of the phenomenon.
  issues:
  - severity: high
    issue: The clause “ma ọ bụrụ na agwaghị m unu okwu” does not reliably mean “unless I speak to you.”
    rationale: Its form can be read as passive or as an ill-formed construction, with Paul no longer clearly the agent of speaking. The source has the active first-person subjunctive λαλήσω. “ma ọ bụrụ na m ejighị … gwa unu okwu” explicitly retains the active subject and the conditional negation.
  - severity: medium
    issue: “Asụsụ dị iche iche” adds “different.”
    rationale: γλώσσαις is plural but does not itself contain an adjective meaning “different.” “N’asụsụ” is idiomatic Igbo generic plural usage and leaves the contextual meaning open, as required.
  revised_text: Ma ugbu a, ụmụnna[a], ọ bụrụ na m abịakwute unu na-ekwu okwu n’asụsụ[b], olee uru m ga-abara unu ma ọ bụrụ na m ejighị mkpughe, ma ọ bụ ọmụma, ma ọ bụ amụma, ma ọ bụ nkuzi gwa unu okwu?
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “ụmụnna nwoke na nwanyị”; okwu Grik a sụgharịrị “ụmụnna” pụrụ ịbụ ụzọ e si akpọ ọgbakọ nke ụmụ nwoke na ụmụ nwanyị nọ na ya.
    reason: lexical_alternative
  - marker: b
    text: N’ụzọ nkịtị, “na-ekwu okwu n’asụsụ”; okwu Grik ahụ pụrụ ịpụta “asụsụ,” ma n’ebe a ọ na-ezo aka n’ihe a na-atụle n’ime 1 Ndị Kọrịnt isi 12–14.
    reason: lexical_alternative
  revision_rationale: The revision corrects the active sense of “unless I speak to you,” removes the unsupported modifier “different,” and retains the source’s four parallel means of profitable speech in clear Standard Igbo. The footnote on tongues preserves rather than resolves the contextual and theological ambiguity.
