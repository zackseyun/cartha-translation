id: 1CO.14.6
reference: 1 Corinthians 14:6
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸀Νῦν δέ, ἀδελφοί, ἐὰν ἔλθω πρὸς ὑμᾶς γλώσσαις λαλῶν, τί ὑμᾶς ὠφελήσω, ἐὰν μὴ ὑμῖν λαλήσω ἢ ἐν ἀποκαλύψει ἢ ἐν γνώσει ἢ ἐν προφητείᾳ ἢ ἐν διδαχῇ;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/006.yaml
  text: Now[a], brothers, if I come to you speaking in tongues[b], what will I benefit you unless I speak to you either by revelation or by knowledge or by prophecy or by teaching?
translation:
  language: ig
  text: Ma ugbu a, ụmụnna[a], ọ bụrụ na m abịakwute unu na-ekwu okwu n’asụsụ[b], olee uru m ga-abara unu ma ọ bụrụ na m ejighị mkpughe, ma ọ bụ ọmụma, ma ọ bụ amụma, ma ọ bụ nkuzi gwa unu okwu?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ụmụnna nwoke na nwanyị”; okwu Grik a sụgharịrị “ụmụnna” pụrụ ịbụ ụzọ e si akpọ ọgbakọ nke ụmụ nwoke na ụmụ nwanyị nọ na ya.
    reason: lexical_alternative
  - marker: b
    text: N’ụzọ nkịtị, “na-ekwu okwu n’asụsụ”; okwu Grik ahụ pụrụ ịpụta “asụsụ,” ma n’ebe a ọ na-ezo aka n’ihe a na-atụle n’ime 1 Ndị Kọrịnt isi 12–14.
    reason: lexical_alternative
lexical_decisions:
- source_word: Νῦν δέ
  choice: Ma ugbu a
  rationale: Na-egosi ntụgharị gaa n’isi okwu Pọl na-ekwu ugbu a, ma na-edebekwa obere mmetụta nke δέ n’enweghị ime ka ọdịiche ahụ sie ike karịa ka o kwesịrị.
- source_word: ἀδελφοί
  choice: ụmụnna
  rationale: Ọ bụ okwu Igbo dị ebube ma bụrụkwa nke a na-eji akpọ ndị otu okwukwe; ọ na-edebe ụdị ọtụtụ nke okwu Grik, ebe nkọwa ala peeji na-akọwa na ọ pụrụ ịgụnye ụmụnwaanyị.
- source_word: γλώσσαις λαλῶν
  choice: na-ekwu okwu n’asụsụ dị iche iche
  rationale: γλῶσσα nwere ike ịpụta asụsụ, ebe ihe gbara amaokwu a gburugburu na-ekwu maka ihe onyinye ime mmụọ a na-atụle na 1 Ndị Kọrịnt 12–14. Nsụgharị a na-edebe okwu ahụ ghọta mmadụ n’Igbo n’ebughị ụzọ kpebie ụdị asụsụ ndị ahụ bụ.
- source_word: τί ὑμᾶς ὠφελήσω
  choice: olee uru m ga-abara unu
  rationale: Nke a bụ ụzọ Igbo dị ndụ e si kwuo ‘what will I benefit you,’ ma na-edebe ajụjụ Pọl banyere uru okwu ya ga-ewetara ọgbakọ.
- source_word: ἐὰν μὴ
  choice: ma ọ bụrụ na ...ghị
  rationale: Ọdịdị a na-enye echiche ọnọdụ na-adịghị emezu nke ἐὰν μή n’Igbo nkịtị.
- source_word: ἐν ἀποκαλύψει / γνώσει / προφητείᾳ / διδαχῇ
  choice: site ná mkpughe / site n’ọmụma / site n’amụma / site na nkuzi
  rationale: ‘Site na’ na-egosipụta ụzọ ma ọ bụ ihe e ji ekwu okwu bara uru, ma na-edebe nhazi yiri onwe ya nke ihe anọ ahụ.
theological_decisions:
- issue: Ndị ἀδελφοί na-agụnye n’okwu a
  choice: ụmụnna
  alternative: ụmụnna ndị nwoke na ndị nwanyị
  rationale: Isi ederede na-edebe aha ọtụtụ nke sitere na Grik n’ụzọ Igbo a na-ejikarị eme ihe; nkọwa ala peeji na-egosi na Pọl nwere ike ịkpọ ọgbakọ dum, gụnyere ndị nwoke na ndị nwanyị.
- issue: Ihe γλώσσαις pụtara n’ebe a
  choice: asụsụ dị iche iche
  alternative: asụsụ ndị mmụọ
  rationale: Nhọrọ a na-edebe ihe okwu Grik pụrụ ịpụta na ọnọdụ 1 Ndị Kọrịnt 12–14, n’enweghị ịkọwa ma ha bụ asụsụ mmadụ ndị a maara ma ọ bụ ụdị okwu ọzọ sitere n’ike mmụọ.
- issue: Mmekọrịta nke mkpughe, ọmụma, amụma, na nkuzi na ngwaa ‘ikwu okwu’
  choice: site na
  alternative: n’ime
  rationale: ἐν nwere ike igosi ụzọ ma ọ bụ ọnọdụ. ‘Site na’ bụ Igbo doro anya nke na-egosi ụzọ okwu ahụ ga-esi baa ndị na-ege ntị uru, ma ọ naghị eme ka ihe anọ ahụ bụrụ otu ihe.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta mee ihe. Ahịrịokwu ahụ na-edebe ajụjụ nkwupụta Pọl na usoro ihe anọ yiri ibe ha. A họọrọ ‘ọmụma’ kama okwu siri ike karị, na ‘nkuzi’ maka okwu a na-akụzi, ka ndị na-agụ akwụkwọ taa ghọta ya nke ọma.
