revisions:
- from: Ma ugbu a, ụmụnna[a], ọ bụrụ na m abịakwute unu na-ekwu okwu n’asụsụ dị iche iche[b], olee uru m ga-abara unu ma ọ bụrụ na agwaghị m unu okwu site ná mkpughe, ma ọ bụ site n’ọmụma, ma ọ bụ site n’amụma, ma ọ bụ site na nkuzi?
  to: Ma ugbu a, ụmụnna[a], ọ bụrụ na m abịakwute unu na-ekwu okwu n’asụsụ[b], olee uru m ga-abara unu ma ọ bụrụ na m ejighị mkpughe, ma ọ bụ ọmụma, ma ọ bụ amụma, ma ọ bụ nkuzi gwa unu okwu?
  rationale: The revision corrects the active sense of “unless I speak to you,” removes the unsupported modifier “different,” and retains the source’s four parallel means of profitable speech in clear Standard Igbo. The footnote on tongues preserves rather than resolves the contextual and theological ambiguity.
