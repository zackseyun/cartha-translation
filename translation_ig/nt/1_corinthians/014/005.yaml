id: 1CO.14.5
reference: 1 Corinthians 14:5
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: θέλω δὲ πάντας ὑμᾶς λαλεῖν γλώσσαις, μᾶλλον δὲ ἵνα προφητεύητε· μείζων ⸀δὲ ὁ προφητεύων ἢ ὁ λαλῶν γλώσσαις, ἐκτὸς εἰ μὴ ⸀διερμηνεύῃ, ἵνα ἡ ἐκκλησία οἰκοδομὴν λάβῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/005.yaml
  text: I want all of you to speak in tongues[a], but even more that you would prophesy. The one who prophesies is greater than the one who speaks in tongues, unless he interprets[b], so that the church may receive edification.
translation:
  language: ig
  text: Achọrọ m ka unu niile na-asụ asụsụ dị iche iche[a], ma karịa nke ahụ, achọrọ m ka unu na-ebu amụma. Onye na-ebu amụma dị ukwuu karịa onye na-asụ asụsụ dị iche iche, belụsọ ma onye ahụ akọwaa ya[b], ka e wee wulite ọgbakọ elu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N'ụzọ nkịtị, “na-asụ ire.” N'ebe a, “asụsụ dị iche iche” anaghị ekpebi ma ọ bụ asụsụ mmadụ a maara ma ọ bụ ụdị okwu mmụọ pụrụ iche.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “belụsọ ma onye ọzọ akọwaa ya.” Ngwaa Grik ahụ dị n'otu onye; n'okwu a ọ na-alaghachi n'ụzọ nkịtị n'onye na-asụ asụsụ ahụ, ma n'ọnọdụ sara mbara ọ pụkwara ịpụta na onye ọzọ nyere nkọwa.
    reason: alternative_reading
lexical_decisions:
- source_word: θέλω
  choice: Achọrọ m
  rationale: Na-egosipụta ọchịchọ Pọl n'ụzọ doro anya ma bụrụkwa Igbo nkịtị nke oge a.
- source_word: πάντας ὑμᾶς
  choice: unu niile
  rationale: Na-echekwa mkpokọta na ọtụtụ mmadụ dị n'okwu Grik.
- source_word: λαλεῖν γλώσσαις
  choice: na-asụ asụsụ dị iche iche
  rationale: Na-echekwa okwu γλώσσαις ma na-enye ya n'Igbo a na-aghọta nke ọma n'ọnọdụ 1 Ndị Kọrịnt 12–14, n'ebughị ụzọ kpebie ma ọ bụ asụsụ mmadụ a maara.
- source_word: μᾶλλον δὲ
  choice: ma nke ka m chọọ
  rationale: Na-egosi na Pọl anaghị ajụ ịsụ asụsụ dị iche iche, kama na ọ na-ahọrọ ibu amụma karịa ya.
- source_word: ἵνα προφητεύητε
  choice: ka unu na-ebu amụma
  rationale: Na-egosipụta ihe Pọl chọrọ ka ndị niile ọ na-agwa mee.
- source_word: μείζων
  choice: ka ... ukwuu
  rationale: Na-echekwa ntụnyere Grik ahụ n'ekpebighị na ọ bụ ịdị nsọ ma ọ bụ ọkwa onwe onye ka elu; ebumnuche nke iwulite nzukọ na-akọwa uru ahụ.
- source_word: ὁ προφητεύων
  choice: onye na-ebu amụma
  rationale: Ọ bụ ntụgharị nkịtị nke participle e ji mee aha mmadụ.
- source_word: ὁ λαλῶν γλώσσαις
  choice: onye na-asụ asụsụ dị iche iche
  rationale: Na-echekwa nhazi okwu yiri nke 'onye na-ebu amụma'.
- source_word: ἐκτὸς εἰ μὴ
  choice: ma ọ bụrụ na ...ghị
  rationale: Ụzọ Igbo nkịtị si kwuo 'unless' n'ahịrịokwu a.
- source_word: διερμηνεύῃ
  choice: onye ahụ akọwaghị ihe ọ na-ekwu
  rationale: Isiokwu ngwaa otu onye ahụ nwere ike ịlaghachikwuru onye na-asụ asụsụ dị iche iche; 'kọwaa ihe ọ na-ekwu' na-eme ka ọrụ nkọwa ahụ doo anya n'Igbo.
- source_word: ἡ ἐκκλησία
  choice: nzukọ Kraịst
  rationale: N'ebe a, ἐκκλησία bụ ọgbakọ ndị kwere ekwe zukọrọ; okwu a na-eme ka echiche ọgbakọ pụta ìhè ma zere nghọta nke ụlọ.
- source_word: οἰκοδομὴν λάβῃ
  choice: wee nweta ihe ga-ewulite ya elu
  rationale: Na-echekwa echiche nke 'inweta iwulite elu' ma na-enye ya n'Igbo dị ndụ ma doo anya.
theological_decisions:
- issue: Ịdị ukwuu nke onye na-ebu amụma karịa onye na-asụ asụsụ dị iche iche
  choice: E debere ntụnyere ahụ dịka 'ka ... ukwuu,' ebe ebumnuche ikpeazụ gosiri na ihe a na-elekwasị anya bụ uru ọ bara n'iwulite nzukọ elu.
  alternative: Ịkọwa ya dịka ịdị elu n'ọkwa ime mmụọ ma ọ bụ n'ịdị nsọ.
  rationale: Akụkụ ikpeazụ, 'ka nzukọ Kraịst wee nweta ihe ga-ewulite ya elu,' na-akọwa ntụnyere ahụ site n'uru ọ bara nye ọgbakọ, ọ bụghị site n'ịdị mmadụ otu onye mma karịa ibe ya.
- issue: Onye bụ isiokwu nke διερμηνεύῃ
  choice: Isi ederede na-ewere ya dịka onye na-asụ asụsụ dị iche iche n'onwe ya.
  alternative: Ọ nwere ike ịbụ onye ọzọ na-akọwa, ma ọ bụ naanị na e nyere nkọwa.
  rationale: Ngwaa Grik ahụ dị n'otu onye, enweghịkwa isiokwu ọhụrụ e kwuru kpọmkwem, ya mere ọ na-alaghachi n'ụzọ nkịtị n'onye e kwuru ozugbo. Ma ọnọdụ sara mbara nke isi nke 14 kwere ka onye ọzọ kọwaa, ya mere e debere nke ahụ n'ala peeji.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. A họọrọ “nzukọ Kraịst” iji gosipụta ọgbakọ zukọrọ, “iwulite ya elu” iji chekwaa ihe atụ οἰκοδομή, ma e tinyere ihe mgbagwoju anya banyere γλῶσσαι na onye na-akọwa n'ala peeji kama idozi ya n'ụzọ nkwenkwe otu ụka.
