review_pass:
  verdict: revise
  source_fidelity: 'A safe correction is needed: the draft’s exception clause, “ma ọ bụrụ na onye ahụ akọwaghị…,” means ‘if that person has not explained…’ and therefore reverses the force of Greek ἐκτὸς εἰ μὴ διερμηνεύῃ (‘unless he interprets’). The revision restores the exception. It retains the immediate-reference reading that the tongue-speaker interprets, while the footnote preserves the contextual possibility of another interpreter.'
  naturalness: 'The revised wording uses clear Standard Igbo: “dị ukwuu karịa” is the more natural comparative construction, and “ka e wee wulite ọgbakọ elu” idiomatically conveys the purpose of congregational edification.'
  terminology: “na-asụ asụsụ dị iche iche” remains a viable contextual rendering of λαλεῖν γλώσσαις in this chapter, with a footnote preventing an unwarranted decision about the precise kind of tongues. “ọgbakọ” naturally renders the gathered ἐκκλησία without suggesting merely a building or importing a denominational sense.
  issues:
  - severity: high
    issue: The exception clause has reversed polarity.
    rationale: “ma ọ bụrụ na ... akọwaghị” is ‘if ... does not interpret/explain,’ whereas ἐκτὸς εἰ μὴ διερμηνεύῃ requires ‘unless ... interprets.’ This changes the condition under which the comparison is qualified.
  - severity: low
    issue: The comparative wording is awkward.
    rationale: “ka ... ukwuu” is understandable, but “dị ukwuu karịa” is the standard natural form for μείζων in this sentence.
  - severity: low
    issue: The purpose clause can be more idiomatic.
    rationale: “nweta ihe ga-ewulite ya elu” is intelligible, but “ka e wee wulite ọgbakọ elu” directly and naturally expresses οἰκοδομὴν λάβῃ.
  revised_text: Achọrọ m ka unu niile na-asụ asụsụ dị iche iche[a], ma karịa nke ahụ, achọrọ m ka unu na-ebu amụma. Onye na-ebu amụma dị ukwuu karịa onye na-asụ asụsụ dị iche iche, belụsọ ma onye ahụ akọwaa ya[b], ka e wee wulite ọgbakọ elu.
