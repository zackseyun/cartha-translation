    reason: alternative_reading
  revision_rationale: The revision corrects the reversed ‘unless’ condition, improves the comparative and purpose-clause idiom, and leaves the source’s contextual ambiguity concerning tongues and the interpreter available in the footnotes. No doctrinal conclusion is added.
