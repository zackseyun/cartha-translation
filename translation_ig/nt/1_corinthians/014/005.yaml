revisions:
- from: Achọrọ m ka unu niile na-asụ asụsụ dị iche iche[a], ma nke ka m chọọ bụ ka unu na-ebu amụma. Onye na-ebu amụma ka onye na-asụ asụsụ dị iche iche ukwuu, ma ọ bụrụ na onye ahụ akọwaghị ihe ọ na-ekwu[b], ka nzukọ Kraịst wee nweta ihe ga-ewulite ya elu.
  to: Achọrọ m ka unu niile na-asụ asụsụ dị iche iche[a], ma karịa nke ahụ, achọrọ m ka unu na-ebu amụma. Onye na-ebu amụma dị ukwuu karịa onye na-asụ asụsụ dị iche iche, belụsọ ma onye ahụ akọwaa ya[b], ka e wee wulite ọgbakọ elu.
  rationale: The revision corrects the reversed ‘unless’ condition, improves the comparative and purpose-clause idiom, and leaves the source’s contextual ambiguity concerning tongues and the interpreter available in the footnotes. No doctrinal conclusion is added.
