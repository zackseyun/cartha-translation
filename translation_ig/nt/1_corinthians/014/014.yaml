id: 1CO.14.14
reference: 1 Corinthians 14:14
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐὰν γὰρ προσεύχωμαι γλώσσῃ, τὸ πνεῦμά μου προσεύχεται, ὁ δὲ νοῦς μου ἄκαρπός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/014.yaml
  text: For if I pray in a tongue[a], my spirit prays[b], but my mind is unfruitful.
translation:
  language: ig
  text: N’ihi na ọ bụrụ na m ekpee ekpere n’ire[a], mmụọ m na-ekpe ekpere, ma uche m adịghị amị mkpụrụ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’asụsụ.” Okwu Grik ahụ pụrụ ịpụta asụsụ mmadụ ma ọ bụ “ire,” n’echiche e ji ya mee ihe n’isiakwụkwọ a maka ụdị okwu a na-ekwu n’ike Mmụọ.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “nghọta m anaghị arụpụta ihe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν γὰρ
  choice: N’ihi na ọ bụrụ na
  rationale: “N’ihi na” na-egosi ọrụ nkọwa nke γάρ, ebe “ọ bụrụ na” na-edobe ọnọdụ nke ἐάν.
- source_word: προσεύχωμαι
  choice: m ekpee ekpere
  rationale: Nke a bụ ụzọ Igbo kwụ ọtọ ma dịkwa mma isi kwuo ekpere n’ahịrịokwu ọnọdụ.
- source_word: γλώσσῃ
  choice: n’otu ire
  rationale: “Ire” na-edobe ihe oyiyi na mgbagwoju anya nke okwu Grik, nke pụrụ izo aka n’asụsụ mmadụ ma ọ bụ n’okwu mmụọ nyere dịka a na-eji ya n’isiakwụkwọ a; “otu” na-egosipụta ọnụọgụ otu.
- source_word: τὸ πνεῦμά μου
  choice: mmụọ m
  rationale: Ọ na-edobe onye nwe okwu ahụ ma ghara ịkọwa ya n’ụzọ siri ike dị ka Mmụọ Nsọ.
- source_word: ὁ δὲ νοῦς μου
  choice: ma uche m
  rationale: “Uche” bụ okwu Igbo sara mbara nke na-egosipụta νοῦς dịka ikike iche echiche ma ọ bụ nghọta, ma na-edobe ọdịiche ya na “mmụọ m.”
- source_word: ἄκαρπός ἐστιν
  choice: adịghị amị mkpụrụ
  rationale: Nke a na-edobe ihe atụ nke ịmị mkpụrụ dị na ἄκαρπος n’Igbo dị ndụ ma doo anya.
theological_decisions:
- issue: Ihe “mmụọ m” (τὸ πνεῦμά μου) na-ezo aka na ya
  choice: E depụtara ya dịka “mmụọ m,” nke na-akachasị kwekọọ na mmụọ nke onye na-ekpe ekpere.
  alternative: Mmụọ Nsọ nọ n’ime onye ahụ.
  rationale: Okwu nwe “m” na ọdịiche e mere n’etiti “mmụọ m” na “uche m” na-akwado nghọta nke akụkụ abụọ dị n’ime onye ahụ; nsụgharị ahụ ka na-edobe okwu isi mmalite n’enweghị itinye nkwenkwe nkọwa ọzọ.
- issue: Ihe “uche m adịghị amị mkpụrụ” pụtara
  choice: E debere ihe atụ ahụ n’ahịrịokwu bụ isi.
  alternative: “Nghọta m anaghị arụpụta ihe.”
  rationale: Okwu Grik nwere ike ịpụta na uche anaghị arụpụta mkpụrụ ma ọ bụ na nghọta anaghị enweta uru; idebe ihe atụ ahụ na-egbochi idozi mgbagwoju anya ahụ n’amaghị ama.
translation_notes:
  register: Standard Igbo dị ugbu a, kwanyere ùgwù ma dị mfe nghọta. E jiri “ire” chekwaa okwu na mgbagwoju anya nke isi mmalite, ebe e ji nkọwa ala peeji gosi “asụsụ” dịka nhọrọ ọzọ.
