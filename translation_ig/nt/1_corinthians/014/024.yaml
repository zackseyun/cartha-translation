review_pass:
  verdict: revise
  source_fidelity: The draft preserves the conditional contrast, the inclusive force and repetition of πάντες (“ha niile”), the two categories of entrant, and the distinct sequence ἐλέγχεται / ἀνακρίνεται. However, the future auxiliaries “ga-eme” and “ga-enyocha” do not best reflect the present forms in the Greek conditional construction. The revision uses present habitual forms, natural in Igbo for this general conditional scenario.
  naturalness: “Ha niile ga-eme ka ọ mata na ikpe mara ya” is understandable but somewhat heavy and less idiomatic. “Ha niile na-eme ka o doo ya anya na o mejọrọ” gives the sense of conviction without presenting it as a final judicial sentence. The following “ha niile na-enyochakwa ya” retains the separate sense of scrutiny/evaluation.
  terminology: “Na-ebu amụma” is an established and suitable rendering of προφητεύωσιν. “Onye na-ekweghị ekwe” accurately renders ἄπιστος. “Onye na-amaghị ihe banyere ihe ndị a” is a defensible contextual rendering of ἰδιώτης; the footnote appropriately retains “onye nọ n’èzí” as an alternative and explains the semantic range without forcing a church-membership conclusion.
  issues:
  - severity: medium
    issue: The main verbs in the result clause are rendered with future auxiliaries.
    rationale: Greek ἐλέγχεται and ἀνακρίνεται are present passive indicatives. In this general conditional statement, Igbo present habitual forms more directly preserve the source aspect and avoid making the result sound merely future.
  - severity: low
    issue: The wording “ọ mata na ikpe mara ya” can sound like a settled legal verdict.
    rationale: ἐλέγχεται denotes conviction, exposure, or reproof in this context, while ἀνακρίνεται supplies the further idea of examination. “O doo ya anya na o mejọrọ” expresses moral conviction without importing final condemnation.
  revised_text: Ma ọ bụrụ na ha niile na-ebu amụma, onye na-ekweghị ekwe ma ọ bụ onye na-amaghị ihe banyere ihe ndị a[a] abata, ha niile na-eme ka o doo ya anya na o mejọrọ; ha niile na-enyochakwa ya.
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “onye nọ n’èzí.” Okwu Grik a nwere ike ịpụta onye na-amaghị ihe, onye a na-etinyebeghị n’ihe ahụ, ma ọ bụ onye na-esoghị n’òtù ndị na-ekwu okwu.
    reason: alternative_reading
  revision_rationale: The revision corrects the verbal aspect in the conditional result and makes the expression of conviction more idiomatic and less judicially final, while preserving the Greek repetition, ambiguity concerning ἰδιώτης, and the distinction between conviction and examination.
