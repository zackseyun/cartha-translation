revisions:
- from: Ma ọ bụrụ na ha niile na-ebu amụma, onye na-ekweghị ekwe ma ọ bụ onye na-amaghị ihe banyere ihe ndị a[a] abata, ha niile ga-eme ka ọ mata na ikpe mara ya; ha niile ga-enyochakwa ya.
  to: Ma ọ bụrụ na ha niile na-ebu amụma, onye na-ekweghị ekwe ma ọ bụ onye na-amaghị ihe banyere ihe ndị a[a] abata, ha niile na-eme ka o doo ya anya na o mejọrọ; ha niile na-enyochakwa ya.
  rationale: The revision corrects the verbal aspect in the conditional result and makes the expression of conviction more idiomatic and less judicially final, while preserving the Greek repetition, ambiguity concerning ἰδιώτης, and the distinction between conviction and examination.
