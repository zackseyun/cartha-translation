id: 1CO.14.24
reference: 1 Corinthians 14:24
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐὰν δὲ πάντες προφητεύωσιν, εἰσέλθῃ δέ τις ἄπιστος ἢ ἰδιώτης, ἐλέγχεται ὑπὸ πάντων, ἀνακρίνεται ὑπὸ πάντων,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/024.yaml
  text: But if all prophesy[a], and some unbeliever or uninstructed person enters, he is convicted by all; he is examined by all.
translation:
  language: ig
  text: Ma ọ bụrụ na ha niile na-ebu amụma, onye na-ekweghị ekwe ma ọ bụ onye na-amaghị ihe banyere ihe ndị a[a] abata, ha niile na-eme ka o doo ya anya na o mejọrọ; ha niile na-enyochakwa ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “onye nọ n’èzí.” Okwu Grik a nwere ike ịpụta onye na-amaghị ihe, onye a na-etinyebeghị n’ihe ahụ, ma ọ bụ onye na-esoghị n’òtù ndị na-ekwu okwu.
    reason: alternative_reading
lexical_decisions:
- source_word: πάντες
  choice: ha niile
  rationale: Ọ na-edobe nghọta sara mbara nke okwu Grik ahụ, ya bụ ndị niile na-ekwu okwu n’ọgbakọ ahụ.
- source_word: προφητεύωσιν
  choice: na-ebu amụma
  rationale: Nke a bụ okwu Igbo a maara nke ọma maka ibu amụma, ma ọ na-edobe ụdị okwu Pọl ji mee ihe n’isiakwụkwọ a n’akọwaghị ya karịa ihe odide ahụ kwuru.
- source_word: ἄπιστος
  choice: onye na-ekweghị ekwe
  rationale: N’ebe a, okwu ahụ na-ezo aka n’onye na-enweghị okwukwe, ọ bụghị nanị onye na-adịghị eguzosi ike n’ihe.
- source_word: ἰδιώτης
  choice: onye na-amaghị ihe banyere ihe ndị a
  rationale: Nhọrọ a na-egosi onye na-amaghị ma ọ bụ na-aghọtaghị ihe ndị a na-eme n’ọgbakọ ahụ, n’etinyeghị echiche ụka nke oge a dịka onye nkịtị ma ọ bụ kpebie na ọ bụ onye na-abụghị onye otu kpamkpam.
- source_word: ἐλέγχεται
  choice: ha niile ga-eme ka ọ mata na ikpe mara ya
  rationale: Nke a na-egosi na okwu ndị amụma ahụ na-ekpughe ọnọdụ onye ahụ ma mee ka akọ na uche ya maa ya ikpe, kama ịsị na e nyela ya ikpe ikpeazụ.
- source_word: ἀνακρίνεται
  choice: ha niile ga-enyochakwa ya
  rationale: “Ga-enyocha” na-egosi nyocha miri emi ma ọ bụ ịtụle ọnọdụ ya, na-enweghị ime ka okwu ahụ pụta ikpe ọmụma ikpeazụ.
- source_word: ὑπὸ πάντων
  choice: ha niile
  rationale: E dekwara ya ugboro abụọ iji chekwaa nkwughachi na ike okwu Grik ahụ.
- source_word: δέ
  choice: Ma / ma ọ bụ
  rationale: “Ma” na-egosi ọdịiche dị n’etiti ọnọdụ a na nke bu ya ụzọ; “ma ọ bụ” jikọtara ụdị mmadụ abụọ ahụ dịka Grik si dị.
- source_word: τις
  choice: onye
  rationale: N’asụsụ Igbo, “onye” n’ọnọdụ a na-egosi onye ọ bụla a na-akọwaghị kpọmkwem n’ụzọ na-adabaghị adaba.
theological_decisions:
- issue: Ihe ἰδιώτης pụtara n’ọgbakọ
  choice: onye na-amaghị ihe banyere ihe ndị a
  alternative: onye nọ n’èzí
  rationale: Ihe gbara amaokwu a gburugburu bụ nghọta okwu na mmetụta okwu ọgbakọ nwere n’ahụ onye na-amaghị ihe a na-eme. Nhọrọ dị n’ahịrịokwu ahụ na-edobe isi echiche a n’ekpebighị na onye ahụ abụghị onye otu ọgbakọ kpamkpam; e debere “onye nọ n’èzí” n’ala ala peeji dịka nghọta ọzọ kwere omume.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. A họọrọ usoro ahịrịokwu na-aga were were, ma e debere nkwughachi “ha niile” nke dị n’asụsụ Grik. Akara ala ala peeji [a] dị n’akụkụ okwu ἰδιώτης ọ na-akọwa.
