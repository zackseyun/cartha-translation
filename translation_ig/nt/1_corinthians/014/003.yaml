  text: ὁ δὲ προφητεύων ἀνθρώποις λαλεῖ οἰκοδομὴν καὶ παράκλησιν καὶ παραμυθίαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/003.yaml
  text: But the one who prophesies speaks to people for edification and encouragement and consolation[a][b][c].
translation:
  language: ig
  text: Ma onye na-ebu amụma na-agwa ndị mmadụ okwu iji wulite ha, gbaa ha ume, na kasie ha obi[a][b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “iji mee ka ha sie ike,” kama “iji wulite ha.”
    reason: lexical_alternative
  - marker: b
    text: “Gbaa ha ume” sụgharịrị παράκλησις; okwu ahụ nwekwara ike ịpụta “dọọ ha aka ná ntị ma kpalie ha,” ma ọ bụ, n’ọnọdụ ụfọdụ, “kasie ha obi.”
    reason: lexical_alternative
  - marker: c
    text: “Kasie ha obi” sụgharịrị παραμυθία; a pụkwara ịsụgharị ya “nye ha nkasi obi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ προφητεύων
  choice: Ma onye na-ebu amụma
  rationale: Nkebi participle a nwere article na-arụ ọrụ dị ka aha, na-ezo aka n’onye na-eme omume ahụ. “Ma” na-egosipụta ọdịiche dị nro nke δέ na amaokwu bu ụzọ, ebe “onye na-ebu amụma” na-edobe ịdị obosara nke okwu ahụ n’enweghị ịkọwa ya dịka naanị ikwusa ozi ma ọ bụ ibu amụma banyere ọdịnihu.
- source_word: ἀνθρώποις
  choice: ndị mmadụ
  rationale: Dative plural a na-egosi ndị a na-agwa okwu; ọ na-ezo aka n’ụmụ mmadụ n’ozuzu, ọ bụghị naanị ụmụ nwoke.
- source_word: λαλεῖ
  choice: na-agwa ... okwu
  rationale: Nke a bụ ntụgharị Igbo dị ndụ ma doo anya nke λαλεῖ mgbe e kwuru ndị na-anụ okwu ahụ.
- source_word: οἰκοδομὴν
  choice: iji wulite ha
  rationale: Okwu a sitere n’echiche iwulite ụlọ, ma n’ebe a ọ pụtara ime ka ndị mmadụ sie ike ma too n’ime mmụọ. “Wulite ha” na-edobe ihe atụ ahụ ma bụrụkwa okwu ndị mmadụ na-aghọta ngwa ngwa.
- source_word: παράκλησιν
  choice: gbaa ha ume
  rationale: παράκλησις nwere ike ịpụta ịgba ume, ịdọ aka ná ntị nke na-akpali mmadụ, ma ọ bụ nkasi obi. N’ebe a, “ịgba ume” na-eme ka ọ dị iche n’okwu ikpeazụ nke na-elekwasị anya na nkasi obi.
- source_word: παραμυθίαν
  choice: kasịe ha obi
  rationale: παραμυθία na-egosi okwu na-eme ka obi dajụọ ma na-enye nkasi obi. Nhọrọ a na-edobe ya iche na παράκλησις.
theological_decisions:
- issue: Ihe “onye na-ebu amụma” pụtara n’ọgbakọ
  choice: E debere “onye na-ebu amụma” n’enweghị ime ka ọ bụrụ naanị onye na-ekwusa ozi ma ọ bụ onye na-ekwu ihe ga-eme n’ọdịnihu.
  alternative: onye na-ekwusa ozi; onye na-ekwu mkpughe; onye na-ebu amụma banyere ọdịnihu
  rationale: Amaokwu ahụ kọwara ibu amụma site ná mmetụta okwu ahụ nwere n’ebe ndị ọzọ nọ, ma ọ naghị enye nkọwa ga-amachi ya n’otu ụdị ọrụ. Nhọrọ a na-echekwa obosara na esemokwu nkà mmụta okpukpe dị n’okwu Grik ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E jiri usoro okwu na-aga nke ọma n’Igbo, tinyere nnọchiaha “ha” iji mee ka ebumnuche nke okwu atọ ahụ doo anya. Akara nkọwa ala ala [a], [b], na [c] dị n’isi ederede dịka achọrọ.
