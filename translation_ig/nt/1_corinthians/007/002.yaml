id: 1CO.7.2
reference: 1 Corinthians 7:2
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: διὰ δὲ τὰς πορνείας ἕκαστος τὴν ἑαυτοῦ γυναῖκα ἐχέτω, καὶ ἑκάστη τὸν ἴδιον ἄνδρα ἐχέτω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/002.yaml
  text: But because of sexual immoralities[a], let each man have his own wife, and let each woman have her own husband.
translation:
  language: ig
  text: Ma n’ihi omume rụrụ arụ n’ihe gbasara mmekọahụ[a], ka nwoke ọ bụla nwee nwunye nke ya, ka nwaanyị ọ bụla nwee di nke ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “omume rụrụ arụ n’ihe gbasara mmekọahụ.” Okwu Grik ahụ dị n’ụdị ọtụtụ, ya bụ, “omume rụrụ arụ n’ihe gbasara mmekọahụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ δὲ
  choice: Ma n’ihi
  rationale: “N’ihi” na-egosi ihe kpatara ya dịka διά na accusative si eme, ebe “Ma” na-egosi obere mgbanwe ma ọ bụ ntụgharị δέ wetara.
- source_word: τὰς πορνείας
  choice: omume rụrụ arụ dị iche iche n’ihe gbasara mmekọahụ
  rationale: Nke a na-egosi omume mmekọahụ na-adịghị mma n’ụzọ sara mbara, ma na-echekwa plural πορνείας site n’okwu “dị iche iche,” kama ime ka ọ bụrụ naanị otu ụdị mmehie.
- source_word: ἕκαστος
  choice: nwoke ọ bụla
  rationale: Masculine singular a, nke kwekọrọ na feminine ἑκάστη na okwu nwunye/di sochirinụ, na-ezo aka n’otu nwoke n’otu nwoke.
- source_word: τὴν ἑαυτοῦ γυναῖκα
  choice: nwunye nke ya
  rationale: N’ọnọdụ alụmdi na nwunye a, γυνή pụtara “nwunye,” ebe ἑαυτοῦ na-emesi ike na ọ bụ nke onye ahụ n’onwe ya.
- source_word: ἐχέτω
  choice: ka ... nwee
  rationale: Usoro “ka ... nwee” na Igbo na-ebuga ike nke imperative onye nke atọ n’enweghị ịgbakwunye echiche siri ike dịka “aghaghị.”
- source_word: καὶ ἑκάστη
  choice: ka nwaanyị ọ bụla
  rationale: 'Nke a na-echekwa nkesa feminine singular: otu nwaanyị n’otu nwaanyị. E wepụtaghị “na” ọzọ n’ihu nkebi nke abụọ ka ahịrịokwu ahụ daa nke ọma n’Igbo; njikọ dị n’usoro nkebi abụọ ahụ ka doro anya.'
- source_word: τὸν ἴδιον ἄνδρα
  choice: di nke ya
  rationale: N’ọnọdụ a ἀνήρ pụtara “di,” ebe ἴδιον na-emesi ike na ọ bụ di nke nwaanyị ahụ n’onwe ya.
theological_decisions:
- issue: Ma a ga-akọwa amaokwu ahụ dịka iwu ka ndị mmadụ lụọ di na nwunye, ka ọ bụ dịka ntụziaka banyere inwe di ma ọ bụ nwunye n’ihi omume mmekọahụ rụrụ arụ
  choice: A sụgharịrị ἐχέτω ozugbo dịka “ka ... nwee,” n’etinyeghị ngwaa pụtara kpọmkwem “lụọ.”
  alternative: “Nwoke ọ bụla lụọ nwunye, nwaanyị ọ bụla alụọ di,” ma ọ bụ nkọwa gbasara imezu ọrụ mmekọahụ n’alụmdi na nwunye.
  rationale: Greek ji ἐχέτω, “ka o nwee,” ọ bụghị ngwaa doro anya maka ịlụ di na nwunye ma ọ bụ maka mmekọahụ n’etiti di na nwunye. Nsụgharị ahụ na-ahapụ nghọta sara mbara na esemokwu nkọwa ahụ ka ọnọdụ gbara amaokwu ahụ gburugburu kọwaa ya.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke kwụ ọtọ ma dị nsọpụrụ. “N’ihe gbasara mmekọahụ” na-eme ka ihe πορνεία pụtara doo ndị na-agụ akwụkwọ anya, ebe “omume rụrụ arụ dị iche iche” na-echekwa plural nke Greek. Usoro “ka ... nwee” na-ezere ịkọwa okwu ahụ karịa ka isi mmalite si kwuo.
