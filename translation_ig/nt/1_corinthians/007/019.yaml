  to: Ibi úgwù abụghị ihe ọ bụla[a], ebighị úgwù abụghịkwa ihe ọ bụla; kama idebe iwu Chineke.
  rationale: The revision retains the source's emphatic symmetry while correcting the natural placement of the Igbo additive particle in the second clause. It also removes a nonessential supplied copula, leaving the final contrast concise and faithful to the Greek.
