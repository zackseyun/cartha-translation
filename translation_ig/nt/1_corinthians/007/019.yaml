  text: ἡ περιτομὴ οὐδέν ἐστιν, καὶ ἡ ἀκροβυστία οὐδέν ἐστιν, ἀλλὰ τήρησις ἐντολῶν θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/019.yaml
  text: Circumcision is nothing[a], and uncircumcision is nothing, but keeping the commandments of God.
translation:
  language: ig
  text: Ibi úgwù abụghị ihe ọ bụla[a], ebighị úgwù abụghịkwa ihe ọ bụla; kama idebe iwu Chineke.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ọ baghị uru ọ bụla.” Nke a metụtara ebe abụọ e kwuru “abụghị ihe ọ bụla.”
    reason: lexical_alternative
lexical_decisions:
- source_word: περιτομή
  choice: Ibi úgwù
  rationale: Nke a bụ aha omume a na-aghọta nke ọma n’Igbo, ma na-edobe ọdịdị aha nke okwu Grik ahụ na ntụnyere Pọl na-eme banyere akara ọnọdụ ọgbụgba ndụ.
- source_word: οὐδέν ἐστιν
  choice: abụghị ihe ọ bụla
  rationale: Nsụgharị a na-edobe okwu Pọl siri ike na ugboro abụọ e ji otu usoro ahụ mee ihe. A kọwara ụzọ ọzọ e nwere ike isi ghọta ya n’okpuru amaokwu.
- source_word: ἀκροβυστία
  choice: ebighị úgwù
  rationale: Nke a bụ ụzọ doro anya e si egosi ọnọdụ megidere ibi úgwù, ma na-echekwa nhata dị n’etiti akụkụ abụọ nke okwu Pọl.
- source_word: ἀλλά
  choice: kama
  rationale: “Kama” na-egosi ntụgharị siri ike site n’ihe abụọ ahụ a sịrị na ha abụghị ihe ọ bụla gaa n’ihe Pọl tinyere ha n’ihu.
- source_word: τήρησις
  choice: idebe
  rationale: “Idebe” bụ okwu Igbo sitere n’okwu a na-ejikarị iwu eme ihe, ma na-egosi ịgbaso ma ọ bụ ịrụzu iwu n’enweghị ịgbasa ihe okwu Grik ahụ pụtara.
- source_word: ἐντολῶν θεοῦ
  choice: iwu Chineke
  rationale: Nke a bụ usoro Igbo dị mfe ma dị ùgwù nke na-edobe ọtụtụ iwu na mmekọrịta ha na Chineke.
theological_decisions:
- issue: Otú Pọl si atụle ibi úgwù na ebighị úgwù
  choice: Amaokwu ahụ na-ekwu na ibi úgwù na ebighị úgwù abụghị ihe ọ bụla ma e jiri ha tụnyere idebe iwu Chineke.
  alternative: Ịghọta ya dị ka ikwu na ibi úgwù enweghị uru omume ọ bụla n’ọnọdụ niile.
  rationale: Nsụgharị ahụ na-edobe nkwupụta Grik nke na-akpọ ọnọdụ abụọ ahụ “ihe ọ bụla,” ma na-etinye ha n’ihu idebe iwu Chineke, n’ebughị ụzọ kpebie ihe ọ pụtara n’ọnọdụ nkà mmụta okpukpe niile.
translation_notes:
  register: E ji Igbo ọkọlọtọ, nke oge a ma dị ùgwù mee ihe. E debere nkwughachi na ntụnyere siri ike nke Grik, ebe e tinyere “ọ bụ” naanị ka ahịrịokwu ahụ wee daa nke ọma n’Igbo.
