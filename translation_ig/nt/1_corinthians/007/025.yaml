    reason: alternative_reading
  - marker: c
    text: Ma ọ bụ, “ka m bụrụ onye kwesịrị ntụkwasị obi.” Okwu Grik ahụ nwere ike ịpụta onye kwesịrị ntụkwasị obi n’omume ma ọ bụ onye a pụrụ ịtụkwasị obi; n’ebe a, o yikarịrị ka ọ na-ekwu na Pọl bụ onye nduzi a pụrụ ịtụkwasị obi n’ihi ebere Onyenwe anyị.
