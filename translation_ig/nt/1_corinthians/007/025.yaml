id: 1CO.7.25
reference: 1 Corinthians 7:25
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Περὶ δὲ τῶν παρθένων ἐπιταγὴν κυρίου οὐκ ἔχω, γνώμην δὲ δίδωμι ὡς ἠλεημένος ὑπὸ κυρίου πιστὸς εἶναι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/025.yaml
  text: Concerning virgins[a], I have no command from the Lord[c][b], but I give my judgment as one who by the Lord’s mercy is trustworthy.
translation:
  language: ig
  text: Ma banyere ndị na-amaghị nwoke[a], enweghị m iwu sitere n’aka Onyenwe anyị; kama ana m enye echiche m[b] dị ka onye Onyenwe anyị meere ebere ka m bụrụ onye a pụrụ ịtụkwasị obi[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ụmụ nwanyị na-alụbeghị di” ma ọ bụ, n’ụfọdụ nkọwa nke ihe ndị gbara amaokwu a gburugburu, “ụmụ agbọghọ na-amaghị nwoke.” Okwu Grik ahụ pụtara “ndị na-amaghị nwoke.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “mkpebi m” ma ọ bụ “ndụmọdụ m.” N’ebe a, Pọl na-egosi ọdịiche dị n’etiti echiche ya e chebara echiche na iwu kpọmkwem sitere n’aka Onyenwe anyị.
    reason: alternative_reading
  - marker: c
    text: Ma ọ bụ, “ka m bụrụ onye kwesịrị ntụkwasị obi.” Okwu Grik ahụ nwere ike ịpụta onye kwesịrị ntụkwasị obi n’omume ma ọ bụ onye a pụrụ ịtụkwasị obi; n’ebe a, o yikarịrị ka ọ na-ekwu na Pọl bụ onye nduzi a pụrụ ịtụkwasị obi n’ihi ebere Onyenwe anyị.
    reason: lexical_alternative
lexical_decisions:
- source_word: Περὶ δὲ
  choice: Ma banyere
  rationale: Ọ bụ usoro Pọl ji webata isiokwu ọhụrụ. “Ma banyere” na-egosi mgbanwe isiokwu ahụ n’enweghị itinye okwu oge na-adịghị na Grik.
- source_word: τῶν παρθένων
  choice: ụmụ agbọghọ na-amaghị nwoke
  rationale: παρθένος pụtara n’ụzọ bụ isi onye, karịsịa nwaanyị na-alụbeghị di, nke na-amaghị nwoke. Nsụgharị a na-edebe isi okwu ahụ ma zere ikpebi n’ederede bụ́ ndị ọ na-ekwu kpọmkwem.
- source_word: ἐπιταγὴν κυρίου
  choice: iwu sitere n’aka Onyenwe anyị
  rationale: ἐπιταγή bụ iwu ma ọ bụ ntụziaka e nyere n’ike; “sitere n’aka” na-eme ka isi mmalite iwu ahụ doo anya.
- source_word: γνώμην
  choice: echiche m
  rationale: γνώμη nwere ike ịpụta echiche, mkpebi e chebara echiche, ma ọ bụ ndụmọdụ. “Echiche m” na-edebe ọdịiche ya na iwu Onyenwe anyị ma ọ naghị eme ka ọ bụrụ okwu na-enweghị isi.
- source_word: δίδωμι
  choice: ana m enye
  rationale: Nke a na-edebe ngwaa dị mfe na oge ugbu a nke Grik.
- source_word: ὡς
  choice: dị ka onye
  rationale: Ọ na-egosi ọnọdụ ma ọ bụ njirimara Pọl ji enye echiche ahụ.
- source_word: ἠλεημένος ὑπὸ κυρίου
  choice: onye Onyenwe anyị, site n’ebere ya, mere ka
  rationale: Perfect passive participle na-egosi na Pọl bụ onye Onyenwe anyị meere ebere, na ọnọdụ ya sitere n’ebere ahụ.
- source_word: πιστὸς εἶναι
  choice: ọ bụrụ onye a pụrụ ịtụkwasị obi
  rationale: πιστός nwere ike ịpụta onye kwesịrị ntụkwasị obi ma ọ bụ onye kwesịrị ntụkwasị obi n’omume. N’ebe a, ntụkwasị obi nke nduzi Pọl bụ ihe pụtara ìhè, ma ndetu ala na-edebe ụzọ ọzọ.
theological_decisions:
- issue: Ụdị ikike Pọl nwere mgbe ọ na-ekwu na o nweghị iwu sitere n’aka Onyenwe anyị
  choice: Edebere ọdịiche dị n’etiti iwu kpọmkwem sitere n’aka Onyenwe anyị na echiche Pọl nyere dị ka onye e mere ka ọ bụrụ onye a pụrụ ịtụkwasị obi site n’ebere Onyenwe anyị.
  alternative: Iwere okwu a dị ka naanị echiche onwe onye na-enweghị ikike, ma ọ bụ dị ka iwu Jizọs nyere n’ụzọ na-apụtaghị ìhè.
  rationale: Ọdịiche dị n’etiti ἐπιταγή na γνώμη na-egosi na Pọl enweghị iwu kpọmkwem nke Onyenwe anyị n’okwu a, ma ọ ka na-enye nduzi dịka onye Onyenwe anyị mere ka ọ bụrụ onye a pụrụ ịtụkwasị obi. Nsụgharị ahụ anaghị ebelata ma ọ bụ ebulite ụdị ikike ahụ karịa ihe Grik kwuru.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta, dee ya. A hapụrụ nghọta kpọmkwem nke “ndị na-amaghị nwoke” na “onye a pụrụ ịtụkwasị obi/onye kwesịrị ntụkwasị obi” ka ndetu ala gosi ụzọ ndị ọzọ, n’enweghị ịmanye otu nkọwa ụka.
