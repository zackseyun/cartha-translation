id: 1CO.7.29
reference: 1 Corinthians 7:29
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τοῦτο δέ φημι, ἀδελφοί, ὁ καιρὸς συνεσταλμένος ⸂ἐστίν· τὸ λοιπὸν⸃ ἵνα καὶ οἱ ἔχοντες γυναῖκας ὡς μὴ ἔχοντες ὦσιν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/029.yaml
  text: 'This is what I mean[a], brothers: the time has been shortened, so that from now on even those who have wives should be as though they had none[b],'
translation:
  language: ig
  text: 'Ma ihe m na-ekwu bụ nke a, ụmụnna[b]: oge ahụ[a] adịla mkpụmkpụ; site ugbu a gaa n’ihu, ka ọbụna ndị nwere nwunye dịrị ka ndị na-enweghị nwunye,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “oge a kara aka.”
    reason: lexical_alternative
  - marker: b
    text: “Ụmụnna” na-asụgharị ἀδελφοί, okwu Grik dị n’ụdị ọtụtụ nke nwoke ma nke pụrụ ịkpọ ndị otu okwukwe, ma ndị nwoke ma ndị nwanyị, ọnụ.
    reason: cultural_note
lexical_decisions:
- source_word: τοῦτο δέ φημι
  choice: Ma ihe m na-ekwu bụ nke a
  rationale: Ọ bụ ụzọ Igbo dị mfe ma doo anya isi webata nkọwa Pọl, ma ọ ka na-egosipụta usoro okwu Grik ahụ.
- source_word: ἀδελφοί
  choice: ụmụnna
  rationale: “Ụmụnna” bụ okwu Igbo sitere n’okike nke a na-eji akpọkọta ndị otu okwukwe, ma ndị nwoke ma ndị nwanyị, n’enweghị mkpa ịgbasa okwu ahụ.
- source_word: ὁ καιρός
  choice: oge ahụ
  rationale: Ọ na-egosi oge pụrụ iche ma ọ bụ oge a kara aka, ọ bụghị naanị ogologo oge a na-agụ n’elekere; “ahụ” na-enyere aka igosi oge a Pọl na-ekwu banyere ya.
- source_word: συνεσταλμένος ἐστίν
  choice: adịla mkpụmkpụ
  rationale: Ụdị a na-egosipụta ọnọdụ dị ugbu a nke sitere n’ịdị mkpụmkpụ; ọ bụkwa okwu Igbo sitere n’okike nke na-edobeghị kpọmkwem onye mere ka oge ahụ dị mkpụmkpụ.
- source_word: τὸ λοιπὸν
  choice: Site ugbu a gaa n’ihu
  rationale: Ọ na-egosipụta ihe a ga-eme malite ugbu a n’oge fọdụrụ.
- source_word: ἵνα
  choice: ka
  rationale: “Ka” na-ejikọta ịdị mkpụmkpụ nke oge ahụ na ụzọ ndụ na-esochi ya, n’ebughị ụzọ kpebie ma njikọ ahụ bụ nzube ka ọ bụ nsonaazụ.
- source_word: οἱ ἔχοντες γυναῖκας
  choice: ndị nwere nwunye
  rationale: Ọ na-agbasochi okwu Grik nke na-ekwu kpọmkwem banyere ndị ikom nwere nwunye, kama ịgbanwe ya ka ọ bụrụ naanị “ndị lụrụ di na nwunye.”
- source_word: ὡς μὴ ἔχοντες
  choice: dịrị ka ndị na-enweghị nwunye
  rationale: Ọ na-edobe ike na esemokwu dị n’usoro okwu Pọl n’ụzọ doro anya, na-enweghị ịkọwa ya dị ka ịhapụ mmetụta ma ọ bụ ịkwụsị ibu ọrụ alụmdi na nwunye.
theological_decisions:
- issue: Ihe ntụziaka Pọl gbasara alụmdi na nwunye pụtara n’ụzọ nchịkọta okpukpe na nlekọta ndị kwere ekwe
  choice: 'E sụgharịrị okwu ahụ n’ụzọ kwụ ọtọ: “ndị nwere nwunye dịrị ka ndị na-enweghị nwunye.”'
  alternative: Ịkọwa ya dịka “ka alụmdi na nwunye ghara ijide ha n’obi,” ma ọ bụ ime ka okwu ahụ dị nro ka ọ ghara iyi ka ọ na-emegide ọrụ dị n’alụmdi na nwunye.
  rationale: Grik ahụ ji ọnọdụ oge dị ngwa belata ịdị arọ nke ọnọdụ mmekọrịta mmadụ na ibe ya. Nsụgharị kwesịrị idowe esemokwu a ma ghara iji nkọwa e tinyere n’ime ya dozie ya.
- issue: Mmekọrịta ἵνα na nkebiokwu bu ya ụzọ
  choice: Ejiri “ka,” nke nwere ike ibu nzube ma ọ bụ nsonaazụ.
  alternative: Ịsụgharị ya n’ụzọ na-ekpebi naanị “n’ihi ya” ma ọ bụ naanị “iji mee ka.”
  rationale: ἵνα nwere ike igosi nzube ma ọ bụ nsonaazụ n’ebe a; okwu Igbo “ka” na-echekwa ohere abụọ ahụ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. “Ụmụnna” bụ okwu nkịtị a na-eji agwa ndị otu okwukwe niile okwu. E zere ịkọwa okwu Pọl karịa ihe Grik kwuru, ma chekwaa ịdị nkọ na esemokwu dị na nkebiokwu ikpeazụ.
