base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/006.yaml
  text: But I say this as a concession[a], not as a command.
translation:
  language: ig
  text: Ma ana m ekwu nke a dị ka ihe e kwere ka e mee[a], ọ bụghị dị ka iwu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “dị ka nkwenye,” ma ọ bụ, “dị ka ohere e nyere.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο
  choice: nke a
  rationale: Nnọchiaha a na-arụtụ aka n'okwu dị ya nso n'akụkụ a, ma ọ naghị amanye mkpebi ma ọ na-arụtụ aka n'azụ ka ọ bụ n'ihu.
- source_word: δὲ
  choice: Ma
  rationale: Ọ na-egosi obere ntụgharị ma ọ bụ ọdịiche dị n'etiti nkwenye a na iwu.
- source_word: λέγω
  choice: ana m ekwu
  rationale: Nke a bụ ụzọ Igbo nkịtị si gosipụta ngwaa oge ugbu a n'okwu a.
- source_word: κατὰ συγγνώμην
  choice: dị ka ihe m kwere ka e mee
  rationale: Nkebiokwu a na-egosi nkwenye ma ọ bụ ohere e nyere, ọ bụghị mgbaghara mmehie; nsụgharị a na-eme ka ọdịiche ya na iwu doo anya n'Igbo nkịtị.
- source_word: οὐ κατ’ ἐπιταγήν
  choice: ọ bụghị dị ka iwu
  rationale: Nke a na-echekwa ngọnarị na ọdịiche kpọmkwem n'etiti ihe e kwere ka e mee na iwu a nyere n'ikike.
theological_decisions:
- issue: Ma okwu Pọl a bụ nkwenye nke aka ya ka ọ bụ iwu Chineke nke dị obere
  choice: A sụgharịrị ya dị ka ihe Pọl kwere ka e mee, ọ bụghị iwu a na-amanye mmadụ idebe.
  alternative: Enwere ike ịghọta ya dị ka ndụmọdụ Pọl nke ka nwere ikike onyeozi.
  rationale: Amaokwu ahụ n'onwe ya kewapụrụ nkwenye na iwu. Nsụgharị ahụ na-echekwa ọdịiche a n'emeghị ka ikike onyeozi Pọl dị ntakịrị karịa ihe ederede kwuru.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. A họọrọ ‘ihe m kwere ka e mee’ kama okwu nwere ike ịpụta mgbaghara, ka echiche συγγνώμην n'ọnọdụ a pụta ìhè.
