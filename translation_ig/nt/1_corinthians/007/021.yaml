  text: Δοῦλος ἐκλήθης; μή σοι μελέτω· ἀλλ’ εἰ καὶ δύνασαι ἐλεύθερος γενέσθαι, μᾶλλον χρῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/021.yaml
  text: Were you called as a servant? Do not let it trouble you. But if indeed you are able to become free[a], rather make use of it.
translation:
  language: ig
  text: À kpọrọ gị mgbe ị bụ ohu? Ekwela ka nke ahụ nye gị nsogbu. Ma ọ bụrụ n’ezie na i nwere ike inweta nnwere onwe, kama jiri ohere ahụ mee ihe[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “kama, jiri ọnọdụ ị nọ na ya mee ihe,” ya bụ, nọgide otú ị dị. N’asụsụ Grik, okwu a sụgharịrị “jiri ... mee ihe” ekwughị kpọmkwem ihe a ga-eji mee ihe; ya mere, a ghọtala ya n’ụzọ abụọ a.
    reason: alternative_reading
lexical_decisions:
- source_word: Δοῦλος
  choice: ohu
  rationale: ‘Ohu’ na-egosi ọnọdụ mmadụ nọ n'okpuru onye nwe ya, ọ bụghị naanị onye na-eje ozi; nke a dabara n'okwu banyere inwere onwe.
- source_word: ἐκλήθης
  choice: À kpọrọ gị
  rationale: E debere okwu a n’enweghị itinye ‘Chineke’ ma ọ bụ ‘n’okwukwe,’ n’ihi na ihe ndị ahụ apụtaghị kpọmkwem na Grik, ọ bụ ezie na gburugburu okwu ahụ na-egosi ọkpụkpọ Chineke.
- source_word: μή σοι μελέτω
  choice: Ekwela ka nke ahụ nye gị nsogbu
  rationale: Nke a na-enye echiche nke ịghara ikwe ka ọnọdụ ahụ na-enye mmadụ nchegbu, ma bụrụkwa Igbo dị mfe nghọta.
- source_word: ἐλεύθερος γενέσθαι
  choice: inwere onwe gị
  rationale: Ọ na-egosi mgbanwe site n’ọnọdụ ohu gaa n’ọnọdụ onye nweere onwe ya.
- source_word: μᾶλλον χρῆσαι
  choice: jiri ohere ahụ mee ihe
  rationale: Ihe a na-eji eme ihe ekwughị kpọmkwem na Grik. N’ahịrịokwu bụ isi, ‘ohere ahụ’ na-ezo aka n’ohere inwere onwe, ebe e debere nkọwa ọzọ nwere nkwado n’ihe odide ala peeji.
theological_decisions:
- issue: Ihe μᾶλλον χρῆσαι pụtara n’ihi na ihe a ga-eji eme ihe ekwughị
  choice: Pọl na-agba ohu ume ka o jiri ohere inwere onwe ya mee ihe ma ọ bụrụ na o nwere ya.
  alternative: Pọl na-agwa ya ka o jiri ọnọdụ ohu ọ nọ na ya mee ihe, ya bụ, ka ọ nọgide otú ọ dị.
  rationale: Nkebiokwu dị nso, ‘ọ bụrụ n’ezie na i nwere ike inwere onwe gị,’ na-eme ka ohere inwere onwe bụrụ ihe a na-eche na χρῆσαι na-ezo aka na ya. Ma ebe Grik ekwughị ihe ahụ kpọmkwem, e chekwara nkọwa nke ọzọ n’ihe odide ala peeji.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma doo ndị nkịtị anya. A họọrọ ‘ohu’ iji gosipụta ọnọdụ ịgba ohu nke ọma. Akara ajụjụ na ụda olu ‘À’ na-eme ka ahịrịokwu mbụ bụrụ ajụjụ doro anya.
