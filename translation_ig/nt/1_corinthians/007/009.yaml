revisions:
- from: Ma ọ bụrụ na ha enweghị ike ijide onwe ha, ka ha lụọ di ma ọ bụ nwunye; n’ihi na ịlụ di ma ọ bụ nwunye ka mma karịa ịbụ onye agụụ mmekọahụ na-ere ọkụ.[a]
  to: Ma ọ bụrụ na ha enweghị njide onwe ha, ka ha lụọ; n’ihi na ịlụ ka mma karịa ịre ọkụ.[a]
  rationale: The revision retains the imperative force of γαμησάτωσαν and the comparative construction, while removing unnecessary gendered expansion. It renders πυροῦσθαι as ‘ịre ọkụ’ in the main text to preserve the concise Greek metaphor and leaves the likely sexual contextual sense in the footnote.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T18:11:35Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly recognizes the contrast between lack of self-control, marriage, and burning. However, its main text makes the sexual sense of πυροῦσθαι explicit ('agụụ mmekọahụ na-ere ọkụ'), whereas the Greek leaves the object/cause of the burning unexpressed. The contextual sense can be supplied in the footnote without narrowing the wording of the text.
  naturalness: ‘Ka ha lụọ di ma ọ bụ nwunye’ and ‘ịlụ di ma ọ bụ nwunye’ are unnecessarily cumbersome and can sound perspective-bound in Igbo. The simple verb ‘lụọ’/infinitive ‘ịlụ’ naturally expresses marrying and applies to all persons. ‘Enweghị njide onwe ha’ is a more direct, idiomatic rendering of not exercising self-control than ‘enweghị ike ijide onwe ha,’ which can overstate inability.
  terminology: ‘Njide onwe ha’ preserves ἐγκρατεύονται without importing a stronger claim of incapacity. ‘Ịre ọkụ’ preserves the Greek metaphor and ambiguity; the note appropriately identifies sexual desire as the likely contextual reference.
  issues:
  - severity: medium
    issue: The main text specifies sexual desire in the rendering of πυροῦσθαι.
    rationale: The immediate context strongly supports sexual desire, but πυροῦσθαι itself simply says ‘to burn’ and does not explicitly state ‘with sexual desire.’ The supplied footnote is the proper place for that contextual clarification.
  - severity: low
    issue: ‘Lụọ di ma ọ bụ nwunye’ is overly expanded.
    rationale: The Greek merely says ‘let them marry.’ In Standard Igbo, ‘ka ha lụọ’ and ‘ịlụ’ are inclusive and more natural, without introducing gender-specific complements not present in the source.
  - severity: low
    issue: ‘Enweghị ike ijide onwe ha’ may imply inability more strongly than the Greek.
    rationale: The verb refers to not exercising self-control. ‘Enweghị njide onwe ha’ is concise and more closely matches the source expression.
  revised_text: Ma ọ bụrụ na ha enweghị njide onwe ha, ka ha lụọ; n’ihi na ịlụ ka mma karịa ịre ọkụ.[a]
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ naanị, “ịre ọkụ.” Okwu Grik ahụ hapụrụ ihe a n’ụzọ na-edoghị anya, ma n’ebe a o yikarịrị ka ọ na-ekwu banyere agụụ mmekọahụ na-ere mmadụ ọkụ.
    reason: lexical_alternative
  revision_rationale: The revision retains the imperative force of γαμησάτωσαν and the comparative construction, while removing unnecessary gendered expansion. It renders πυροῦσθαι as ‘ịre ọkụ’ in the main text to preserve the concise Greek metaphor and leaves the likely sexual contextual sense in the footnote.
