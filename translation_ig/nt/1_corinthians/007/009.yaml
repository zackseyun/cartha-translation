  text: εἰ δὲ οὐκ ἐγκρατεύονται, γαμησάτωσαν, κρεῖττον γάρ ἐστιν ⸀γαμῆσαι ἢ πυροῦσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/009.yaml
  text: But if they do not have self-control[a], let them marry; for it is better to marry than to burn.
translation:
  language: ig
  text: Ma ọ bụrụ na ha enweghị njide onwe ha, ka ha lụọ; n’ihi na ịlụ ka mma karịa ịre ọkụ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ naanị, “ịre ọkụ.” Okwu Grik ahụ hapụrụ ihe a n’ụzọ na-edoghị anya, ma n’ebe a o yikarịrị ka ọ na-ekwu banyere agụụ mmekọahụ na-ere mmadụ ọkụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγκρατεύονται
  choice: enweghị ike ijide onwe ha
  rationale: Ụdị okwu a na-egosi mmadụ ijide onwe ya, karịsịa n’ihe gbasara agụụ mmekọahụ n’ebe a. Nsụgharị a bụ Igbo nkịtị ma na-edobe echiche nke njide onwe onye.
- source_word: γαμησάτωσαν
  choice: ka ha lụọ di ma ọ bụ nwunye
  rationale: Nke a na-edobe ike iwu dị n’aorist imperative ahụ, ma kwuo alụmdi na nwunye n’ụzọ doro ndị nwoke na ndị nwanyị anya n’Igbo.
- source_word: κρεῖττον
  choice: ka mma
  rationale: Nke a bụ okwu Igbo ebumpụta ụwa maka ntụnyere a.
- source_word: γαμῆσαι
  choice: ịlụ di ma ọ bụ nwunye
  rationale: Nke a na-asụgharị infinitive ahụ ozugbo ma gụnye ma nwoke ma nwanyị.
- source_word: πυροῦσθαι
  choice: ịbụ onye agụụ mmekọahụ na-ere ọkụ
  rationale: Onyinyo ọkụ dị na Grik ka echekwara, ebe ihe gbara amaokwu ahụ gburugburu na-egosi na ọkụ a bụ agụụ mmekọahụ.
- source_word: δὲ
  choice: Ma
  rationale: Ọ na-egosi obere ọdịiche dị n’etiti ndụmọdụ a na ihe e kwuru tupu ya.
theological_decisions:
- issue: Ihe πυροῦσθαι pụtara n’ebe a
  choice: agụụ mmekọahụ na-ere ọkụ
  alternative: ire ọkụ, n’akọwaghị ụdị ọkụ ọ bụ; ma ọ bụ ire ọkụ n’ikpe
  rationale: Mkparịta ụka gbara amaokwu ahụ gburugburu bụ banyere ịnọ n’alụghị di ma ọ bụ nwunye, ịlụ di ma ọ bụ nwunye, na ijide onwe onye. Ya mere, ihe ọ pụtara nke ukwuu bụ agụụ mmekọahụ. N’agbanyeghị nke ahụ, nkọwa ala peeji na-echekwa ụzọ Grik si hapụ ihe ahụ n’ụzọ dị nkenke.
translation_notes:
  register: Standard Igbo; asụsụ dị ugbu a, dị ùgwù, ma dị mfe nghọta. E jiri “lụọ di ma ọ bụ nwunye” mee ka ndị nwoke na ndị nwanyị doo anya. Akara nkọwa [a] dị n’isiokwu ahụ ma kwekọọ na nkọwa ala peeji.
