  to: 'Ma ana m agwa ndị na-alụghị di ma ọ bụ nwunye[a] na ụmụanyị di ha nwụrụ: ọ dị mma nye ha ma ọ bụrụ na ha anọgide dị ka mụ onwe m kwa[b].'
