base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/008.yaml
  text: 'I say to the unmarried and to the widows: it is good for them if they remain as I am[a][b].'
translation:
  language: ig
  text: 'Ma ana m agwa ndị na-alụghị di ma ọ bụ nwunye[a] na ụmụanyị di ha nwụrụ: ọ dị mma nye ha ma ọ bụrụ na ha anọgide dị ka mụ onwe m kwa[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “ụmụ nwoke na-alụghị nwaanyị,” n’ihi na ụdị okwu Grik a bụ nke nwoke ọtụtụ; ma o nwekwara ike ịnọchite anya ndị niile na-alụghị di ma ọ bụ nwunye.
    reason: lexical_alternative
  - marker: b
    text: 'N’ụzọ nkịtị: “dị ka mụ onwe m kwa.” Okwu “kwa” na-anọchite anya mgbakwunye dị n’okwu Grik ahụ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Λέγω δὲ
  choice: Ma ana m agwa
  rationale: δέ bụ njikọ dị nro nke nwere ike igosi ntughari ma ọ bụ obere ọdịiche; “Ma” na-egosipụta ya n’ụzọ nkịtị n’Igbo n’etinyeghị echiche oge na-adịghị na Grik.
- source_word: τοῖς ἀγάμοις
  choice: ndị na-alụghị di ma ọ bụ nwunye
  rationale: ἄγαμος pụtara ndị na-alụghị di ma ọ bụ nwunye. Nkebi a na-enye nghọta zuru ezu n’Igbo ma hapụ ohere nke ụdị nwoke ọtụtụ dị na Grik, nke nwere ike ịnọchite anya otu sara mbara.
- source_word: ταῖς χήραις
  choice: ụmụanyị di ha nwụrụ
  rationale: χήραις na-ezo kpọmkwem aka n’ụmụanyị di ha nwụrụ; nke a bụ okwu Igbo doro anya ma bụrụkwa nke ndị mmadụ na-eji ugbu a.
- source_word: καλὸν
  choice: ọ dị mma
  rationale: καλόν na-egosi ihe dị mma ma ọ bụ ihe kwesịrị ekwesị; ọ bụghị okwu ntụnyere nke pụtara “ọ ka mma.”
- source_word: αὐτοῖς
  choice: ka ha
  rationale: Dative αὐτοῖς n’usoro a na-egosi ndị ndụmọdụ ahụ metụtara; usoro Igbo “ọ dị mma ka ha...” na-enye echiche ahụ nke ọma.
- source_word: ἐὰν μείνωσιν
  choice: ka ha nọgide
  rationale: μένω pụtara ịnọgide ma ọ bụ ịnọ otu ọnọdụ; n’ebe a ọ na-ekwu maka ịnọgide n’ọnọdụ alụghị di ma ọ bụ nwunye.
- source_word: ὡς κἀγώ
  choice: otú mụ onwe m nọ
  rationale: κἀγώ bụ καὶ ἐγώ, ya bụ “mụ onwe m kwa.” “Otú mụ onwe m nọ” bụ Igbo nkịtị nke na-egosi ọnọdụ Pọl ugbu a, ebe nkọwa ala peeji na-echekwa ike mgbakwunye nke καί.
theological_decisions:
- issue: Oke ndị okwu ἀγάμοις gụnyere n’ihe metụtara ụmụanyị di ha nwụrụ
  choice: ndị na-alụghị di ma ọ bụ nwunye
  alternative: ụmụ nwoke na-alụghị nwaanyị
  rationale: Ụdị Grik bụ nwoke ọtụtụ, ma enwere ike iji ya nọchite anya ndị niile na-alụghị di ma ọ bụ nwunye. Ebe Pọl kpọkwara ụmụanyị di ha nwụrụ aha iche, ntụgharị sara mbara na-echekwa mgbagwoju anya ahụ kama ime ka ọ bụrụ naanị ụmụ nwoke.
- issue: Ike okwu καλὸν n’ọdụmọdụ Pọl
  choice: ọ dị mma
  alternative: ọ ka mma
  rationale: καλόν n’onwe ya abụghị ntụnyere. “Ọ dị mma” anaghị etinye nkwupụta siri ike karịa ihe ederede Grik kwuru.
translation_notes:
  register: Ejiri Standard Igbo nke dị ugbu a, dị ùgwù ma dị mfe nghọta. “Ụmụanyị di ha nwụrụ” doro anya karịa okwu nwere ike bụrụ nke mpaghara. E debere ntụgharị dị nro nke δέ site na “Ma,” ma zere itinye “ugbu a,” ebe okwu oge adịghị na isi mmalite.
