    issue: The conditional ἐὰν is not explicit in the main text.
    rationale: The construction καλὸν αὐτοῖς ἐὰν μείνωσιν means “it is good for them if they remain.” The draft's “ọ dị mma ka ha nọgide” may naturally be heard as “it is good that they remain,” which blurs the conditional form.
