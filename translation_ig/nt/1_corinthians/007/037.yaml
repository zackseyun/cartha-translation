id: 1CO.7.37
reference: 1 Corinthians 7:37
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὃς δὲ ἕστηκεν ⸂ἐν τῇ καρδίᾳ αὐτοῦ ἑδραῖος⸃ μὴ ἔχων ἀνάγκην, ἐξουσίαν δὲ ἔχει περὶ τοῦ ἰδίου θελήματος, καὶ τοῦτο κέκρικεν ἐν τῇ ⸂ἰδίᾳ καρδίᾳ⸃, ⸀τηρεῖν τὴν ἑαυτοῦ παρθένον, καλῶς ⸀ποιήσει·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/037.yaml
  text: But whoever stands firm in his heart[a], having no necessity, but has authority over his own will[b], and has decided this in his own heart—to keep his own virgin—he will do well.
translation:
  language: ig
  text: Ma onye ọ bụla guzosiri ike n’obi ya, na-enweghị ihe na-amanye ya[a], kama o nwere ikike n’ebe uche nke ya dị, ma kpebiela nke a n’obi ya—idebe nwa agbọghọ ya na-amaghị nwoke[b]—ọ ga-eme nke ọma.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “na-enweghị mkpa ma ọ bụ ọnọdụ mmanye.”
    reason: lexical_alternative
  - marker: b
    text: “Nwa agbọghọ ya na-amaghị nwoke” nwere ike ịpụta nwa ya nwanyị na-amaghị nwoke ma ọ bụ nwaanyị ahụ ya na ya kwere nkwa ịlụ; ihe okwu Grik ahụ kpọmkwem na-ezo aka na ya ka na-arụrịta ụka.
    reason: alternative_reading
lexical_decisions:
- source_word: ἕστηκεν ... ἑδραῖος
  choice: guzosiri ike
  rationale: Na-egosi mkpebi siri ike nke e meela ma guzosie ike; ọ bụkwa okwu Igbo doro anya ma kwekọọ n’usoro okwu Grik.
- source_word: ἐν τῇ καρδίᾳ αὐτοῦ
  choice: n’obi ya
  rationale: Na-echekwa akpaalaokwu Akwụkwọ Nsọ nke na-akọwa ime mmadụ, ebe mkpebi na ebumnuche si apụta.
- source_word: μὴ ἔχων ἀνάγκην
  choice: na-enweghị ihe na-amanye ya
  rationale: ἀνάγκη nwere ike ịpụta mkpa, nrụgide, ma ọ bụ mmanye. Nsụgharị a na-enye echiche nke enweghị mmanye n’Igbo nkịtị.
- source_word: ἐξουσίαν ... ἔχει περὶ τοῦ ἰδίου θελήματος
  choice: o nwere ikike ime ihe o kpebiri n’onwe ya
  rationale: Na-egosipụta ikike mmadụ nwere n’ebe ọchịchọ ma ọ bụ mkpebi nke ya dị, n’enweghị ịtụgharị ya ka ọ bụrụ naanị ọchịchọ mmekọahụ.
- source_word: κέκρικεν
  choice: kpebiekwa
  rationale: Ụdị perfect ahụ na-egosi mkpebi e meelarị ma ka dịgide; ‘kpebie’ bụ okwu Igbo dị mfe ma zie ezi.
- source_word: τηρεῖν
  choice: idebe
  rationale: Na-echekwa isi ihe τηρέω pụtara—idebe ma ọ bụ ịnọgide na-echekwa—n’ebughị nkọwa ọzọ banyere alụghị di ma ọ bụ nwunye banye n’ahịrịokwu ahụ.
- source_word: τὴν ἑαυτοῦ παρθένον
  choice: nwaanyị ya na-amaghị nwoke
  rationale: Na-edebe παρθένος dị ka nwaanyị na-amaghị nwoke, ma ghara ikpebi n’ahịrịokwu bụ isi ma ọ bụ nwa ya nwanyị ka ọ bụ onye ọ chọrọ ịlụ.
- source_word: καλῶς ποιήσει
  choice: ọ ga-eme nke ọma
  rationale: Ọ bụ ụzọ Igbo dị mma ma dị mfe isi kwuo na omume ahụ kwesịrị ekwesị ma bụrụ ihe a pụrụ ito.
theological_decisions:
- issue: Onye τὴν ἑαυτοῦ παρθένον na-ezo aka na ya
  choice: E debere okwu ahụ n’ụzọ na-adịghị ekpebi kpọmkwem mmekọrịta nwaanyị ahụ na nwoke ahụ.
  alternative: Ọ pụrụ ịbụ nwa ya nwanyị na-amaghị nwoke, ma ọ bụ nwaanyị ya na ya kwere nkwa ịlụ.
  rationale: Ihe Grik kwuru ka a na-arụrịta ụka banyere ya; ịkpọ ya kpọmkwem ‘nwa ya nwanyị’ ma ọ bụ ‘onye ọ chọrọ ịlụ’ ga-ekpebi ihe isi mmalite ahụ na-ekpebighị.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E chekwara nkwughachi ‘n’obi ya’ na usoro mkpebi nke amaokwu Grik, ebe e tinyere nkọwa abụọ maka ebe okwu ahụ nwere ezigbo mgbagwoju anya.
