  text: καὶ γυνὴ ⸂εἴ τις⸃ ἔχει ἄνδρα ἄπιστον, καὶ ⸀οὗτος συνευδοκεῖ οἰκεῖν μετ’ αὐτῆς, μὴ ἀφιέτω ⸂τὸν ἄνδρα⸃.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/013.yaml
  text: And if a woman has an unbelieving husband[a], and he consents to live with her, she must not leave her husband.
translation:
  language: ig
  text: Ọ bụrụkwa na nwanyị ọ bụla nwere di na-ekweghị ekwe, ma di ahụ kwetara ibi na ya, ka ọ ghara ịhapụ di ya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ngwaa Grik ahụ pụtara n'ụzọ nkịtị “ịhapụ” ma ọ bụ “izipu.” N’ebe a, ọ na-ekwu maka ịkwụsị mmekọrịta alụmdi na nwunye.
    reason: lexical_alternative
lexical_decisions:
- source_word: γυνή
  choice: otu nwanyị
  rationale: γυνή nwere ike ịpụta ‘nwanyị’ ma ọ bụ ‘nwunye’; ebe a, okwu gbasara di na nwunye na-eme ka o doo anya na ọ bụ nwanyị lụrụ di. ‘Otu nwanyị’ na-ebupụta ọnọdụ izugbe nke εἴ τις n’Igbo eke.
- source_word: ἄνδρα ἄπιστον
  choice: di na-ekweghị ekwe
  rationale: N’ọnọdụ a, ἀνήρ pụtara di, ebe ἄπιστος na-akọwa onye na-enweghị okwukwe Kraịst; nsụgharị a anaghị eme ka ọ dị ka ekwesịghị ntụkwasị obi n’alụmdi na nwunye.
- source_word: οὗτος
  choice: nwoke ahụ
  rationale: Ihe ngosi a na-ezo aka kpọmkwem n’ebe di ahụ nọ. ‘Nwoke ahụ’ na-edobe ntakịrị ike ngosipụta nke οὗτος ma na-ada nke ọma n’Igbo.
- source_word: συνευδοκεῖ
  choice: kwetara
  rationale: Okwu a na-egosi nkwenye sitere n’obi ma ọ bụ ịdị njikere; ‘kwetara’ bụ okwu Igbo doro anya na nke eke.
- source_word: οἰκεῖν μετ’ αὐτῆς
  choice: ka ya na ya biri
  rationale: Nkebiokwu a na-ekwu maka ịnọgide na-ebi ndụ ụlọ ọnụ, ọ bụghị nanị ịnọ n’otu ebe nwa oge.
- source_word: μὴ ἀφιέτω τὸν ἄνδρα
  choice: nwanyị ahụ ekewala onwe ya n'ebe di ya nọ
  rationale: N’ọnọdụ alụmdi na nwunye, ἀφίημι nwere ike ịpụta ịhapụ, ịchụpụ, ma ọ bụ ime ka mmekọrịta alụmdi na nwunye kwụsị. ‘Ekewala onwe ya n'ebe di ya nọ’ na-edobe obosara okwu Grik karịa ịkọwa ya naanị dịka ịgba alụkwaghịm.
theological_decisions:
- issue: Iwu Pọl banyere ἀφιέτω n’alụmdi na nwunye ebe otu onye na-ekweghị ekwe
  choice: nwanyị ahụ ekewala onwe ya n'ebe di ya nọ
  alternative: nwanyị ahụ agbakwala di ya alụkwaghịm; nwanyị ahụ ahapụla di ya
  rationale: Nhọrọ a na-egosi na nwanyị ahụ ekwesịghị ime ka alụmdi na nwunye ahụ kwụsị mgbe di ya dị njikere ka ha biri ọnụ, ma ọ naghị amanye otu nkọwa iwu kpọmkwem n’elu ngwaa Grik nwere obosara pụtara.
translation_notes:
  register: Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E ji ‘ekewala onwe ya n'ebe di ya nọ’ chekwaa obosara na ntakịrị mgbagwoju anya dị na ἀφιέτω, ebe nkọwa ala peeji na-enye ụzọ ndị ọzọ.
