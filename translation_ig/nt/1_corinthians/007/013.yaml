review_pass:
  verdict: revise
  source_fidelity: The draft correctly identifies the marital setting and the husband's willingness to continue living with his wife. However, “nwanyị ahụ ekewala onwe ya n'ebe di ya nọ” shifts the action to self-separation, is less direct than ἀφιέτω τὸν ἄνδρα, and does not naturally convey the Greek present prohibition. “Ka ọ ghara ịhapụ di ya” preserves the verbal breadth while directly retaining the husband as the object.
  naturalness: “Otu nwanyị” is understandable but “nwanyị ọ bụla” is more natural for the generic conditional εἴ τις. Repeating “nwoke ahụ” after “di” is less idiomatic and weakens the specific marital referent; “di ahụ” is clearer. The revised conditional and prohibition are standard, fluent modern Igbo.
  terminology: “Di na-ekweghị ekwe” is an established and suitable rendering in this Christian-context contrast. “Ịhapụ di ya” retains the source wording’s breadth without prematurely limiting it to a particular legal formulation of divorce. The footnote notes the literal lexical range and its marital-context force without imposing a doctrinal conclusion.
  issues:
  - severity: medium
    issue: The main prohibition is rendered as “nwanyị ahụ ekewala onwe ya n'ebe di ya nọ.”
    rationale: This expression focuses on the woman separating herself rather than on her not leaving/dismissing her husband, whereas the Greek explicitly has τὸν ἄνδρα as the object. Its form is also less natural for the ongoing third-person prohibition μὴ ἀφιέτω.
  - severity: low
    issue: “Otu nwanyị” and “nwoke ahụ” are less natural choices in this context.
    rationale: The generic conditional is more idiomatically expressed by “nwanyị ọ bụla,” and the demonstrative refers specifically to the husband, so “di ahụ” is clearer and maintains the marital terminology.
  - severity: low
    issue: The existing footnote’s alternatives use awkward imperative forms and overstates “ịchụpụ” as a direct alternative.
    rationale: A concise note on the verb’s literal range, while identifying the marital context, is clearer and avoids unnatural wording.
  revised_text: Ọ bụrụkwa na nwanyị ọ bụla nwere di na-ekweghị ekwe, ma di ahụ kwetara ibi na ya, ka ọ ghara ịhapụ di ya.[a]
  revised_footnotes:
