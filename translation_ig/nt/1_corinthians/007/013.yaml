revisions:
- from: Ọ bụrụkwa na otu nwanyị nwere di na-ekweghị ekwe, ma nwoke ahụ kwetara ka ya na ya biri, nwanyị ahụ ekewala onwe ya n'ebe di ya nọ.[a]
  to: Ọ bụrụkwa na nwanyị ọ bụla nwere di na-ekweghị ekwe, ma di ahụ kwetara ibi na ya, ka ọ ghara ịhapụ di ya.[a]
  rationale: 'The revision directly reflects the Greek construction: a generic case involving a woman with an unbelieving husband, the husband''s consent to live with her, and a prohibition against her leaving him. It uses natural Standard Igbo, retains the source term’s marital breadth, and keeps a restrained lexical note.'
  reviewer_model: gpt-5.6-terra
