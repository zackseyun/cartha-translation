    reason: lexical_alternative
  revision_rationale: The revision restores imperative force in both clauses while preserving their reciprocal structure. It retains the draft’s contextually appropriate wording for the marital due and replaces an unclear footnote alternative with idiomatic Igbo that reflects the literal sense of ὀφειλή.
