  text: τῇ γυναικὶ ὁ ἀνὴρ τὴν ⸀ὀφειλὴν ἀποδιδότω, ὁμοίως δὲ καὶ ἡ γυνὴ τῷ ἀνδρί.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/003.yaml
  text: The husband must give to his wife her marital duty, and likewise the wife to her husband.
translation:
  language: ig
  text: Ka di nye nwunye ya ihe ruuru ya n’alụmdi na nwunye[a]; otu a kwa, ka nwunye nye di ya ihe ruuru ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ihe e ji ya ụgwọ”; n’ụzọ nkịtị karị, “ụgwọ” ma ọ bụ “ọrụ dịịrị mmadụ.” N’ebe a, ọ na-ekwu maka ọrụ mmekọrịta chiri anya nke di na nwunye ji ibe ha.
    reason: lexical_alternative
lexical_decisions:
- source_word: γυναικί / γυνή
  choice: nwunye
  rationale: N’ọnọdụ a, okwu ahụ na-ekwu maka nwanyị dịka nwunye, ọ bụghị nwanyị n’ozuzu.
- source_word: ἀνήρ / ἀνδρί
  choice: di
  rationale: N’ọnọdụ ntụziaka gbasara alụmdi na nwunye, okwu ahụ pụtara di, ọ bụghị nwoke n’ozuzu.
- source_word: ὀφειλήν
  choice: ihe ruuru ya n’alụmdi na nwunye
  rationale: Okwu Grik ahụ pụtara ihe e ji mmadụ ụgwọ ma ọ bụ ọrụ dịịrị mmadụ. N’ebe a, ihe gbara amaokwu ahụ gburugburu na-egosi ọrụ mmekọrịta di na nwunye; nsụgharị a na-eme ka nke ahụ doo anya n’ebughị ụzọ kọwaa ya karịa ihe ederede kwuru.
- source_word: ἀποδιδότω
  choice: ga na-enye
  rationale: Nke a na-egosipụta iwu a na-enye nakwa na ọ bụ ọrụ a ga na-eme, n’asụsụ Igbo dị mfe ma bụrụkwa nke ebumpụta ụwa.
- source_word: ὁμοίως δὲ καὶ
  choice: otu aka ahụkwa
  rationale: Nke a na-echekwa nha anya na mmeghachi omume dị n’etiti ọrụ di na nke nwunye.
theological_decisions:
- issue: Otu a ga-esi kọwaa ὀφειλή dịka ọrụ dị n’etiti di na nwunye
  choice: ihe ruuru ya n’alụmdi na nwunye
  alternative: ọrụ dịịrị ya n’alụmdi na nwunye; ihe e ji ya ụgwọ; ihe ruuru ya dịka nwunye ma ọ bụ di
  rationale: Nhọrọ a na-echekwa echiche bụ isi nke ‘ihe e ji mmadụ ụgwọ’ ma na-eme ka ọnọdụ alụmdi na nwunye pụta ìhè. Ọ naghị agbanwe okwu ahụ ka ọ bụrụ naanị ikike iwu, ma ọ bụ kọwaa mmekọahụ n’ụzọ karịrị ihe okwu ahụ n’onwe ya kwuru.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Nhazi ahịrịokwu abụọ ahụ na-emesi ike na ọrụ a bụ nke di na nwunye ji ibe ha n’otu aka ahụ.
