revisions:
- from: Di ga na-enye nwunye ya ihe ruuru ya n’alụmdi na nwunye[a]; otu aka ahụkwa, nwunye ga na-enye di ya ihe ruuru ya.
  to: Ka di nye nwunye ya ihe ruuru ya n’alụmdi na nwunye[a]; otu a kwa, ka nwunye nye di ya ihe ruuru ya.
  rationale: The revision restores imperative force in both clauses while preserving their reciprocal structure. It retains the draft’s contextually appropriate wording for the marital due and replaces an unclear footnote alternative with idiomatic Igbo that reflects the literal sense of ὀφειλή.
  reviewer_model: gpt-5.6-terra
