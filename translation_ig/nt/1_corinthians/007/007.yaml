revisions:
- from: Ma achọrọ m ka mmadụ niile dịrị ka mụ onwe m. Ma onye ọ bụla nwere onyinye nke aka ya sitere n’aka Chineke, otu onye nwere nke otu ụdị, onye ọzọ enwee nke ụdị ọzọ.
  to: 'Ma achọrọ m ka mmadụ niile dị ka mụ onwe m. Otú ọ dị, onye ọ bụla nwere onyinye nke ya sitere n’aka Chineke: onye a n’ụzọ a, onye ọzọ n’ụzọ ọzọ.'
  rationale: The revision retains the source’s broad reference to all people, Paul’s personal wish, the individual gift from God, and the deliberately unspecified twofold contrast. “Otú ọ dị” naturally conveys ἀλλά, while the final balanced phrases preserve the Greek ellipsis rather than defining the gifts.
  reviewer_model: gpt-5.6-terra
