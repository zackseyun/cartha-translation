  text: θέλω ⸀δὲ πάντας ἀνθρώπους εἶναι ὡς καὶ ἐμαυτόν· ἀλλὰ ἕκαστος ἴδιον ⸂ἔχει χάρισμα⸃ ἐκ θεοῦ, ⸀ὁ μὲν οὕτως, ⸁ὁ δὲ οὕτως.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/007.yaml
  text: But I want all men to be as I myself am. Yet each has his own gift from God, one in this way and another in that way.
translation:
  language: ig
  text: 'Ma achọrọ m ka mmadụ niile dị ka mụ onwe m. Otú ọ dị, onye ọ bụla nwere onyinye nke ya sitere n’aka Chineke: onye a n’ụzọ a, onye ọzọ n’ụzọ ọzọ.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πάντας ἀνθρώπους
  choice: mmadụ niile
  rationale: N'okwu Grik a, ἀνθρώπους na-ezo aka n'ọrụ mmadụ n'ozuzu, ọ bụghị naanị ụmụ nwoke; “mmadụ niile” bụ Igbo nkịtị ma na-edobe obosara okwu ahụ.
- source_word: θέλω
  choice: achọrọ m
  rationale: Nke a na-egosi ọchịchọ Pọl, ọ bụghị iwu.
- source_word: χάρισμα
  choice: onyinye
  rationale: “Onyinye” na-egosi ihe Chineke nyere n'amara; ihe ndị gbara amaokwu a gburugburu na-akọwa ụdị onyinye ahụ, ya mere e kwesịghị ịkọwa ya karịa ihe Grik kwuru.
- source_word: ἐκ θεοῦ
  choice: sitere n’aka Chineke
  rationale: Nke a na-egosi na Chineke bụ isi iyi nke onyinye ahụ n'Igbo doro anya ma dị ebube.
- source_word: ὁ μὲν οὕτως, ὁ δὲ οὕτως
  choice: otu onye nwere nke otu ụdị, onye ọzọ enwee nke ụdị ọzọ
  rationale: Nke a na-ebute ọdịiche dị n'etiti onyinye mmadụ n'otu n'otu n'ụzọ Igbo na-aghọta nke ọma, n'ebughị nkọwa ọzọ n'ime amaokwu ahụ.
theological_decisions:
- issue: Ihe ‘ịdị ka m’ pụtara
  choice: E debere ya dịka “dịrị ka mụ onwe m” n'enweghị nkọwa agbakwunyere.
  alternative: Ịkọwa ya ozugbo dịka ịnọ n'alụghị di ma ọ bụ nwunye, ma ọ bụ dịka njide onwe onye.
  rationale: Ihe ndị gbara amaokwu a gburugburu nwere ike ịkọwa ọchịchọ Pọl, ma amaokwu a n'onwe ya hapụrụ ntụaka ahụ n'ụzọ dị mkpirikpi; nsụgharị ekwesịghị idozi ihe ahụ n'ime ederede.
- issue: Ụdị onyinye nke onye ọ bụla
  choice: E jiri naanị “onyinye” mee ihe.
  alternative: “Onyinye ịnọ n'alụghị di ma ọ bụ nwunye” na “onyinye ịlụ di ma ọ bụ nwunye.”
  rationale: Grik kwuru χάρισμα n'ozuzu ma kwuo naanị na otu onye nwere otu ụdị, onye ọzọ nwekwara ụdị ọzọ. Ịkpọ ụdị abụọ ahụ aha ga-abụ nkọwa karịrị ederede.
translation_notes:
  register: Standard Igbo dị ugbu a, dị mfe nghọta ma dị ùgwù. A họọrọ “mmadụ niile” kama okwu ga-eme ka ἀνθρώπους bụrụ naanị ụmụ nwoke. Ahịrịokwu nke abụọ ka e mere ka ọ na-asọ nke ọma n'Igbo ma na-edobe ntụnyere abụọ dị n'okwu Grik.
