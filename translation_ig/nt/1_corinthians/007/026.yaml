id: 1CO.7.26
reference: 1 Corinthians 7:26
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: νομίζω οὖν τοῦτο καλὸν ὑπάρχειν διὰ τὴν ἐνεστῶσαν ἀνάγκην, ὅτι καλὸν ἀνθρώπῳ τὸ οὕτως εἶναι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/026.yaml
  text: 'Therefore I think this is good because of the present distress: that it is good for a man to remain as he is[a][b][c].'
translation:
  language: ig
  text: 'N’ihi ya, echere m na nke a dị mma n’ihi mkpagbu dị ugbu a[a]: ọ dị mma ka mmadụ[b] nọgide otú ọ dị[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “n’ihi mkpa dị ugbu a,” ma ọ bụ, “n’ihi nsogbu dị ugbu a.”
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, “ka nwoke.” Okwu Grik e ji mee ihe, ἄνθρωπος, nwere ike ịpụta mmadụ n’ozuzu.
    reason: lexical_alternative
  - marker: c
    text: N’ụzọ nkịtị, “ịdị otu a.”
    reason: lexical_alternative
lexical_decisions:
- source_word: νομίζω
  choice: echere m
  rationale: Ọ na-egosi echiche Pọl tụlere nke ọma, ọ bụghị iwu a na-enye n’enweghị ihe ọ bụla metụtara ọnọdụ ahụ.
- source_word: οὖν
  choice: N’ihi ya
  rationale: Ọ na-ejikọta okwu a na ntụle dị n’amaokwu ndị bu ya ụzọ ma gosipụta nkwubi okwu sitere na ha.
- source_word: τοῦτο καλὸν ὑπάρχειν
  choice: nke a dị mma
  rationale: Nsụgharị a bụ Igbo doro anya ma na-edobe καλόν dị ka ‘dị mma,’ nke pụrụ ịpụta ihe dabara adaba n’ọnọdụ a.
- source_word: διὰ τὴν ἐνεστῶσαν ἀνάγκην
  choice: n’ihi mkpagbu dị ugbu a
  rationale: ἀνάγκη nwere ike ịpụta mkpa siri ike, nsogbu, ma ọ bụ mkpagbu; ‘mkpagbu’ na-egosi ọnọdụ mpụga na-amanye mmadụ, ebe ἐνεστῶσαν na-egosi na ọ dị ugbu a.
- source_word: ὅτι
  choice: ':'
  rationale: N’ebe a, ὅτι na-akọwapụta ihe Pọl kwuru na ọ dị mma. Akara kọlọn na-eme ka njikọ nkọwa ahụ bụrụ Igbo eke n’etinyeghị nkọwa ọzọ.
- source_word: καλὸν
  choice: ọ dị mma
  rationale: A na-emegharị okwu ‘dị mma’ dịka e mere na nkebi mbụ, si otú a debe nkwughachi dị n’asụsụ Grik.
- source_word: ἀνθρώπῳ
  choice: ka nwoke
  rationale: Ọ bụ ezie na ἄνθρωπος pụrụ ịrụ ọrụ n’ụzọ metụtara mmadụ n’ozuzu, otu nwoke ka okwu ahụ dị na Grik, ebe ọnọdụ gbara ya gburugburu na-ekwu banyere alụmdi na nwunye. ‘Nwoke’ na-edobe ụdị ahụ, ebe nkọwa ala peeji na-egosi nghọta sara mbara.
- source_word: τὸ οὕτως εἶναι
  choice: nọgide otú ọ nọ
  rationale: N’ụzọ nkịtị, ọ bụ ‘ịdị otu a.’ ‘Nọgide otú ọ nọ’ bụ Igbo eke ma na-egosi ịnọgide n’ọnọdụ a na-ekwu maka ya n’amaokwu ndị gbara ya gburugburu.
theological_decisions:
- issue: Ụdị okwu ndụmọdụ Pọl na-enye
  choice: E gosipụtara ya dị ka echiche Pọl banyere ọnọdụ ahụ, nke mkpagbu dị ugbu a kpatara.
  alternative: Ịghọta ya dị ka iwu zuru ụwa ọnụ ma ọ bụ nkwenye na alụmdi na nwunye adịghị mma.
  rationale: Okwu ‘echere m’ na ihe kpatara ya, ‘n’ihi mkpagbu dị ugbu a,’ na-egosi ndụmọdụ metụtara ọnọdụ ahụ. Nsụgharị ahụ anaghị eme ka esemokwu dị n’etiti ndụmọdụ a na okwu ndị ọzọ banyere alụmdi na nwunye pụọ.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-edobe nkwughachi nke ‘dị mma,’ echiche Pọl dị ka echiche a tụlere, na mgbagwoju anya nke ἀνάγκη na ἄνθρωπος site na nkọwa ala peeji.
