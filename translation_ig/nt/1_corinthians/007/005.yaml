review_pass:
  verdict: revise
  source_fidelity: Draft correctly conveys the temporary, mutually agreed exception, devotion to prayer, reunion, Satan's tempting, and lack of self-control. However, its first clause makes the implied marital due overly explicit ('inweta ihe ruuru ya n'alụmdi na nwunye') and is syntactically awkward; the footnote's claimed literal wording for πάλιν ἐπὶ τὸ αὐτὸ ἦτε is inaccurate.
  naturalness: The middle exception ('ma e wezụga, ma eleghị anya, mgbe...') is cumbersome in Standard Igbo. A more direct conditional-exception construction is natural and retains the Greek qualification. 'nọnụkọtanụ ọzọ' is a natural, modest rendering of the reunion idiom.
  terminology: '''Setan,'' ''ekpere,'' and ''enweghị njide onwe'' are appropriate Standard Igbo terms. The marital implication should remain appropriately implicit in the verse, as it is in Greek; a restrained explanatory footnote can identify the contextual sense.'
  issues:
  - severity: medium
    issue: The rendering of ἀποστερεῖτε ἀλλήλους is over-explicit and awkward.
    rationale: ‘Unu egbochikwala ibe unu inweta ihe ruuru ya n'alụmdi na nwunye’ adds ‘in marriage’ and recasts the verb as preventing someone from obtaining a right. The Greek says not to deprive one another, with the object supplied by the marital context. ‘Unu anapụkwala ibe unu ihe ruuru ibe ya’ is closer and idiomatic while retaining the contextual implication.
  - severity: medium
    issue: The exception clause is stylistically cumbersome.
    rationale: ‘ma e wezụga, ma eleghị anya, mgbe...’ has stacked connectives and does not cleanly represent the qualified exception. ‘ma e wezụga ma ọ bụrụ na unu abụọ ekwekọrịta’ clearly expresses the mutual-agreement exception without making it absolute.
  - severity: high
    issue: Footnote [a] misidentifies the literal sense of πάλιν ἐπὶ τὸ αὐτὸ ἦτε.
    rationale: ‘ịnọkọkwa n'otu ebe ọzọ’ means being together in one place again and introduces ‘ebe’ (“place”), which is not stated. The idiom is better represented as ‘be together again’; in this context it refers to resuming married life, likely including marital relations.
  revised_text: Unu anapụkwala ibe unu ihe ruuru ibe ya, ma e wezụga ma ọ bụrụ na unu abụọ ekwekọrịta, ruo nwa oge, ka unu wee tinye onwe unu n'ekpere. Ma mesịa, nọnụkọtanụ ọzọ[a], ka Setan ghara ịnwa unu n'ihi enweghị njide onwe unu.
  revised_footnotes:
  - marker: a
    text: N'ụzọ nkịtị, “nọkọta ọnụ ọzọ”; n'ebe a, ọ na-ezo aka n'ịmaliteghachi ndụ di na nwunye ọnụ, ma eleghị anya gụnyekwa mmekọrịta alụmdi na nwunye.
    reason: lexical_alternative
  revision_rationale: The revision follows the Greek more closely, improves Standard Igbo flow, and preserves Paul's modest indirectness about marital relations. The revised footnote explains the contextual implication without falsely presenting an expanded phrase as literal.
