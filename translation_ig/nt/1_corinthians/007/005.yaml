id: 1CO.7.5
reference: 1 Corinthians 7:5
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: μὴ ἀποστερεῖτε ἀλλήλους, εἰ μήτι ἂν ἐκ συμφώνου πρὸς καιρὸν ἵνα ⸀σχολάσητε ⸀τῇ προσευχῇ καὶ πάλιν ἐπὶ τὸ αὐτὸ ⸀ἦτε, ἵνα μὴ πειράζῃ ὑμᾶς ὁ Σατανᾶς διὰ τὴν ἀκρασίαν ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/005.yaml
  text: Do not deprive one another[a], except perhaps by mutual agreement for a time, so that you may devote yourselves to prayer, and then come together again[b], so that Satan may not tempt you because of your lack of self-control.
translation:
  language: ig
  text: Unu anapụkwala ibe unu ihe ruuru ibe ya, ma e wezụga ma ọ bụrụ na unu abụọ ekwekọrịta, ruo nwa oge, ka unu wee tinye onwe unu n'ekpere. Ma mesịa, nọnụkọtanụ ọzọ[a], ka Setan ghara ịnwa unu n'ihi enweghị njide onwe unu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N'ụzọ nkịtị, “nọkọta ọnụ ọzọ”; n'ebe a, ọ na-ezo aka n'ịmaliteghachi ndụ di na nwunye ọnụ, ma eleghị anya gụnyekwa mmekọrịta alụmdi na nwunye.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποστερεῖτε ἀλλήλους
  choice: Unu egbochikwala ibe unu inweta ihe ruuru ya n'alụmdi na nwunye
  rationale: Okwu a na-ekwu banyere ịnapụ di ma ọ bụ nwunye ihe ruuru ya n'ime alụmdi na nwunye. Nsụgharị a na-eme ka ihe ọ pụtara doo anya n'Igbo, ma na-edobe ike nke iwu ahụ na nkwanye ùgwù nke okwu Grik.
- source_word: εἰ μήτι ἂν ἐκ συμφώνου
  choice: ma e wezụga, ma eleghị anya, mgbe unu abụọ kwekọrịtara
  rationale: Nke a na-egosi ọnọdụ pụrụ iche a na-ekwe omume, ọ bụghị iwu zuru oke, ma na-emesi nkwenye nke di na nwunye abụọ ike.
- source_word: πρὸς καιρόν
  choice: ruo nwa oge
  rationale: Ọ na-egosi oge dị mkpirikpi ma nwere njedebe.
- source_word: σχολάσητε τῇ προσευχῇ
  choice: ka unu wee tinye obi unu n'ekpere
  rationale: Akpaokwu Igbo a na-egosi ilekwasị anya na itinye onwe n'ekpere, kama ịsụgharị ya n'ụzọ nkịtị dị ka inwe ohere.
- source_word: πάλιν ἐπὶ τὸ αὐτὸ ἦτε
  choice: unu alaghachikwa n'ịdịkọ ọnụ
  rationale: Ọ na-edobe ụzọ Pọl si kwuo okwu n'ụzọ dị umeala n'obi, ebe gburugburu okwu ahụ na-egosi ịmaliteghachi mmekọrịta di na nwunye.
- source_word: πειράζῃ
  choice: nwa
  rationale: N'ebe a, ebe Setan bụ onye na-eme ihe ahụ, okwu ahụ pụtara ịrata mmadụ ime mmehie, ọ bụghị naanị ịnwale ya.
- source_word: Σατανᾶς
  choice: Setan
  rationale: Nke a bụ idegharị aha onye ahụ n'ụdị a na-ejikarị eme ihe n'Igbo.
- source_word: ἀκρασίαν
  choice: enweghị njide onwe
  rationale: Ọ na-egosi enweghị ike ijide ọchịchọ onwe, ma bụrụ okwu Igbo doro anya na nke oge a.
theological_decisions:
- issue: Ma a ga-akọwa πάλιν ἐπὶ τὸ αὐτὸ ἦτε kpọmkwem dị ka ịmaliteghachi mmekọahụ ma ọ bụ hapụ ya dịka ịdịkọ ọnụ ọzọ
  choice: A sụgharịrị ya dịka “unu alaghachikwa n'ịdịkọ ọnụ,” tinyere nkọwa n'okpuru.
  alternative: “unu amaliteghachikwa mmekọahụ”
  rationale: Grik ahụ na-ezo aka n'ịmaliteghachi mmekọrịta di na nwunye, ikekwe gụnyere mmekọahụ, ma o kwuru ya n'ụzọ na-adịghị ekwupụta ihe niile hoo haa. Nsụgharị ahụ na-edobe nkwanye ùgwù na obosara okwu mbụ.
- issue: Ma ὁ Σατανᾶς bụ aha onye ọjọọ ma ọ bụ naanị “onye iro” n'ozuzu
  choice: Setan
  alternative: onye iro
  rationale: N'okwu Pọl ebe a, Σατανᾶς na-ezo aka n'onye a maara dịka Setan; ya mere, a na-edobe ya dịka aha.
translation_notes:
  register: E jiri Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A zere okwu siri ike ma ọ bụ nkọwa mmekọahụ doro anya karịa ka isi Grik si kwuo, ma e mere ka ọdịnaya metụtara alụmdi na nwunye doo anya.
