revisions:
- from: Unu egbochikwala ibe unu inweta ihe ruuru ya n'alụmdi na nwunye, ma e wezụga, ma eleghị anya, mgbe unu abụọ kwekọrịtara ime ya ruo nwa oge, ka unu wee tinye obi unu n'ekpere. Mgbe ahụ, unu alaghachikwa n'ịdịkọ ọnụ[a], ka Setan ghara ịnwa unu n'ihi enweghị njide onwe unu.
  to: Unu anapụkwala ibe unu ihe ruuru ibe ya, ma e wezụga ma ọ bụrụ na unu abụọ ekwekọrịta, ruo nwa oge, ka unu wee tinye onwe unu n'ekpere. Ma mesịa, nọnụkọtanụ ọzọ[a], ka Setan ghara ịnwa unu n'ihi enweghị njide onwe unu.
  rationale: The revision follows the Greek more closely, improves Standard Igbo flow, and preserves Paul's modest indirectness about marital relations. The revised footnote explains the contextual implication without falsely presenting an expanded phrase as literal.
