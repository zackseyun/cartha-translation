  source_fidelity: 'Isi ntụgharị ahụ na-esochi SBLGNT nke ọma: a na-echekwa nkwughachi χωρίζεται/χωριζέσθω, e meghị οὐ δεδούλωται ka ọ bụrụ nkwubi okwu gbasara ịlụ ọzọ, ma ‘anyị’ na-agbaso ἡμᾶς. Otú ọ dị, ‘onye ahụ na-ekweghị ekwe’ na-eme ka nkọwa demonstrative (‘ahụ’) pụta nke na-adịghị na Grik, ebe nkọwa ala a ugbu a na-emegharị otu okwu ahụ kama inye nhọrọ bara uru.'
