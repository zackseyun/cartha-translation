  to: Ma ọ bụrụ na onye na-ekweghị ekwe[a] ekewapụ onwe ya, ka ọ kewapụ onwe ya. N’ọnọdụ ndị dị otu a, e meghị nwanna nwoke ma ọ bụ nwanna nwanyị ohu[b]; kama Chineke akpọọla anyị ka anyị biri n’udo[c].
