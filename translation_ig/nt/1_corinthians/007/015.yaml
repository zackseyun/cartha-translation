id: 1CO.7.15
reference: 1 Corinthians 7:15
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἰ δὲ ὁ ἄπιστος χωρίζεται, χωριζέσθω· οὐ δεδούλωται ὁ ἀδελφὸς ἢ ἡ ἀδελφὴ ἐν τοῖς τοιούτοις, ἐν δὲ εἰρήνῃ κέκληκεν ⸀ἡμᾶς ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/015.yaml
  text: But if the unbeliever separates[a], let him separate. The brother or the sister is not enslaved in such cases[c][b], but God has called us in peace.
translation:
  language: ig
  text: Ma ọ bụrụ na onye na-ekweghị ekwe[a] ekewapụ onwe ya, ka ọ kewapụ onwe ya. N’ọnọdụ ndị dị otu a, e meghị nwanna nwoke ma ọ bụ nwanna nwanyị ohu[b]; kama Chineke akpọọla anyị ka anyị biri n’udo[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “onye na-ekweghị ekwe”; dịka ihe gbara okwu a gburugburu si dị, ọ bụ di ma ọ bụ nwunye na-ekweghị ekwe.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ọ nọghị n’agbụ.” Ngwaa Grik a sitere na δουλόω, nke pụtara “ime mmadụ ohu,” ọ bụghị ngwaa a na-ejikarị ekwu “ike” ma ọ bụ “ike agbụ.”
    reason: lexical_alternative
  - marker: c
    text: Ụfọdụ ihe odide ochie nwere “unu” kama “anyị.”
    reason: textual_variant
lexical_decisions:
- source_word: ὁ ἄπιστος
  choice: onye ahụ na-ekweghị ekwe
  rationale: Nke a na-edobe okwu Grik dịka aha e ji nkọwa mee, na-akọwaghị n’ime amaokwu ahụ kpọmkwem na ọ bụ di ma ọ bụ nwunye, ọ bụ ezie na ihe gbara ya gburugburu na-egosi nke ahụ.
- source_word: χωρίζεται / χωριζέσθω
  choice: ekewapụ onwe ya / ya kewapụ onwe ya
  rationale: E ji otu mgbọrọgwụ okwu mee ha abụọ iji chekwaa nkwughachi dị na Grik. Okwu a anaghị ekpebi ma ọ bụ ịgba alụkwaghịm n’iwu ka ọ bụ naanị ịhapụ ibe ya.
- source_word: οὐ δεδούλωται
  choice: e meghị ... ohu
  rationale: Nke a na-egosipụta δουλόω, ‘ime mmadụ ohu,’ kama iji okwu nkịtị pụtara ‘ike agbụ,’ ma na-edobe nghọtahie banyere ókè nnwere onwe ahụ ruru.
- source_word: ὁ ἀδελφὸς ἢ ἡ ἀδελφὴ
  choice: nwanna nwoke ma ọ bụ nwanna nwanyị
  rationale: E debere aha abụọ ahụ n'ụzọ doro anya dịka Grik si mee, na-ezo aka n’ụmụnna ndị kwere ekwe.
- source_word: ἐν τοῖς τοιούτοις
  choice: n’ọnọdụ ndị dị otu a
  rationale: Nke a bụ ntụgharị Igbo dị mfe ma doo anya nke na-ezo aka n’ụdị ọnọdụ ahụ a kọwara.
- source_word: ἐν δὲ εἰρήνῃ
  choice: kama ... ibi n’udo
  rationale: N’Igbo, ‘akpọọla anyị ibi n’udo’ na-egosipụta n’ụzọ eke na udo bụ ọnọdụ na ụzọ ndụ nke ọkpụkpọ Chineke metụtara.
- source_word: κέκληκεν ἡμᾶς ὁ θεός
  choice: Chineke akpọọla anyị
  rationale: ‘Akpọọla’ na-egosipụta omume emere nke nsonaazụ ya ka dị; ‘anyị’ na-agbaso ọgụgụ SBLGNT.
theological_decisions:
- issue: Ihe οὐ δεδούλωται pụtara banyere njedebe alụmdi na nwunye na ịlụ ọzọ
  choice: E meghị ... ohu
  alternative: Enweghị agbụ jikọrọ ya / o nweere onwe ya ịlụ ọzọ
  rationale: Amaokwu ahụ anaghị akọwa kpọmkwem ókè nnwere onwe a ruru. Ya mere, ntụgharị ahụ na-anọ nso n’okwu δουλόω ma ghara ikpebi ozizi banyere ịlụ ọzọ.
- issue: Onye ὁ ἄπιστος na-ezo aka na ya
  choice: onye ahụ na-ekweghị ekwe
  alternative: di ma ọ bụ nwunye na-ekweghị ekwe
  rationale: Ihe gbara amaokwu ahụ gburugburu na-egosi na ọ bụ di ma ọ bụ nwunye, ma Grik n’onwe ya ekwughị okwu pụtara ‘di ma ọ bụ nwunye’; a hapụrụ nkọwa ahụ n’ihe gbara ya gburugburu.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta mee ntụgharị ahụ. A họọrọ ‘ikewapụ onwe ya’ iji ghara ịkọwapụta karịa Grik ma nke a bụ ịgba alụkwaghịm n’iwu ka ọ bụ ịhapụ ụlọ; e jikwa ‘e meghị ... ohu’ chekwaa ihe atụ siri ike nke okwu mbụ.
