  verdict: revise
  source_fidelity: 'The core sense is retained: the Lord''s apportioning, God''s calling, the individual application, and Paul''s instruction to all churches are all represented. However, “Kama” is more plainly adversative (“but/rather”), whereas εἰ μὴ here introduces the limiting governing principle (“only/nevertheless”). “Naanị” better preserves this force without making the transition a contrast not explicit in the Greek.'
  naturalness: The revised wording is natural Standard Igbo. “Ka onye ọ bụla na-ebi ndụ” appropriately conveys the exhortation concerning one’s manner of life; the explanatory footnote responsibly preserves the Greek walking metaphor.
  terminology: “Onyenwe anyị,” “Chineke,” and “ọgbakọ” are appropriate and maintain the source’s distinction between κύριος and θεός. “Kenye ya òkè” suitably conveys ἐμέρισεν. “M na-enye ntụziaka” is a measured rendering of διατάσσομαι.
  issues:
