reference: 1 Corinthians 7:17
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Εἰ μὴ ἑκάστῳ ὡς ⸀ἐμέρισεν ὁ ⸀κύριος, ἕκαστον ὡς κέκληκεν ὁ ⸀θεός, οὕτως περιπατείτω· καὶ οὕτως ἐν ταῖς ἐκκλησίαις πάσαις διατάσσομαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/017.yaml
  text: Only[a], as the Lord has assigned to each one, as God has called each one, so let him walk[b]. And so I direct in all the churches.
translation:
  language: ig
  text: Naanị, ka onye ọ bụla na-ebi ndụ[a] dị ka Onyenwe anyị si kenye ya òkè, nakwa dị ka Chineke si kpọọ ya. Ọ bụkwa otu a ka m na-enye ntụziaka n’ọgbakọ niile.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’ụzọ nkịtị, “na-eje ije.” N’Akwụkwọ Nsọ, “ije ije” na-abụkarị ihe atụ nke ụzọ mmadụ si ebi ndụ ma ọ bụ akpa àgwà.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰ μὴ
  choice: Kama
  rationale: N’ebe a, ọ bụ njikọ na-egosi ntụgharị gaa n’ụkpụrụ na-achị okwu ahụ, ọ bụghị ahịrịokwu ọnọdụ nkịtị. “Kama” na-aga nke ọma n’Igbo ma ghara ịgbakwunye echiche na-anọghị na Grik.
- source_word: ἑκάστῳ / ἕκαστον
  choice: onye ọ bụla ... ya
  rationale: Nke a na-edobe ike nkesa nke okwu ahụ n’ebe mmadụ niile n’otu n’otu nọ, ma kwuo ya n’ụzọ Igbo dị ire.
- source_word: ἐμέρισεν
  choice: si kenye ya òkè
  rationale: “Kenye ... òkè” na-egosipụta ihe Onyenwe anyị kesara ma ọ bụ nyere onye ahụ dịka ọnọdụ ya, ma na-edobe ihe okwu Grik nwere ike ịpụta.
- source_word: ὁ κύριος
  choice: Onyenwe anyị
  rationale: Nke a bụ aha nsọ a na-ejikarị asụ κύριος n’Igbo, ma na-edobe ya iche na “Chineke” n’ahịrịokwu nke ọzọ.
- source_word: κέκληκεν
  choice: si kpọọ ya
  rationale: Ọ na-egosipụta ọkpụkpọ Chineke nke metụtara onye ahụ; usoro “si ...” na-ejikọta nkebi abụọ ahụ nke ọma n’Igbo.
- source_word: ὁ θεός
  choice: Chineke
  rationale: Ọ bụ nsụgharị Igbo kwesịrị ekwesị nke θεός.
- source_word: οὕτως περιπατείτω
  choice: ka onye ọ bụla na-ebi ndụ ... dị ka
  rationale: A sụgharịrị ihe atụ “ije ije” n’ụzọ pụtara omume na ụzọ ndụ, n’ihi na “ịna-eje ije” n’Igbo ebe a nwere ike ịdị ka mmegharị ahụ nkịtị karịa ihe atụ Pọl bu n’obi.
- source_word: διατάσσομαι
  choice: m na-enye ntụziaka
  rationale: Nke a na-edobe ikike Pọl ji hazie omume ọgbakọ, ma ghara ime ka ụda ya sie ike karịa Grik.
- source_word: ἐν ταῖς ἐκκλησίαις πάσαις
  choice: n’ọgbakọ niile
  rationale: “Ọgbakọ” na-ezo aka n’ebe ndị kwere ekwe zukọrọ ma bụrụkwa okwu Igbo doro anya maka ἐκκλησίαις n’ebe a.
theological_decisions:
- issue: Ọdịiche dị n’etiti “Onyenwe anyị” na “Chineke”
  choice: 'E debere aha abụọ ahụ iche: “Onyenwe anyị ... Chineke.”'
  alternative: Ịgụ ha dịka ụzọ abụọ e si kpọọ otu onye Chineke n’enweghị ọdịiche ọ bụla.
  rationale: Grik jiri aha abụọ dị iche n’ahịrịokwu ndị yiri ibe ha. Nsụgharị ahụ anaghị ejikọta ma ọ bụ kọwaa ha karịa ka isi mmalite mere.
- issue: Ihe atụ dị na περιπατείτω
  choice: A sụgharịrị ya “na-ebi ndụ,” ma tinye nkọwa ala peeji banyere “ije ije.”
  alternative: Idobe ya n’ahịrịokwu ukwu dịka “na-eje ije.”
  rationale: N’Igbo nke oge a, “ibi ndụ” na-ebuga echiche banyere ụzọ mmadụ si akpa agwa nke ọma, ebe nkọwa ala peeji na-edobe ihe atụ okwu Grik.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. A haziri usoro okwu ahụ ka ọ bụrụ nke Igbo eke, ebe e debere nkewa dị n’etiti Onyenwe anyị na Chineke, nakwa echiche nke ọnọdụ e kenyere onye ọ bụla.
