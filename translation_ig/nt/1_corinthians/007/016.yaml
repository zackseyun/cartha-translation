  verdict: revise
  source_fidelity: Ederede ahụ na-edobe akụkụ abụọ yiri ibe ha, okwu kpọmkwem maka di na nwunye, na ‘ịzọpụta’ maka σώσεις. Ma ‘gịnị ka ị maara’ bụ nsụgharị nkịtị nke τί ... οἶδας nke na-adịghị ada nke ọma dịka ajụjụ okwu-nkatọ n’Igbo; ‘olee otú ị ga-esi mara’ na-enye mmetụta ajụjụ ahụ n’enweghị ikwu na nzọpụta ahụ agaghị ekwe omume.
  naturalness: ‘N’ihi na, gịnị ka ị maara, nwunye’ adịghị ada n’usoro Igbo Izugbe a na-asụ taa. Ịkpọ ‘nwunye’ na ‘di’ ozugbo n’ihu ajụjụ ahụ, tinyere ‘olee otú ị ga-esi mara,’ dịkwuo eke ma na-edobe nkwughachi Grik ahụ.
  terminology: ‘nwunye,’ ‘di,’ na ‘ị ga-azọpụta’ kwesịrị ekwesị. E kwesịghị ịgbanwe ‘ịzọpụta’ ka ọ bụrụ okwu na-akọwa n’ụzọ warara, dịka ime ka o kwere ekwe ma ọ bụ ichekwa alụmdi na nwunye.
