  text: τί γὰρ οἶδας, γύναι, εἰ τὸν ἄνδρα σώσεις; ἢ τί οἶδας, ἄνερ, εἰ τὴν γυναῖκα σώσεις;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/016.yaml
  text: For how do you know[a], wife, whether you will save your husband? Or how do you know, husband, whether you will save your wife?
translation:
  language: ig
  text: N’ihi na, nwunye, olee otú ị ga-esi mara ma ị ga-azọpụta di gị? Ma ọ bụ, di, olee otú ị ga-esi mara ma ị ga-azọpụta nwunye gị?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ịsụgharị ya n’ụzọ ọzọ: “olee otú ị ga-esi mara ma ị pụrụ ịzọpụta ...?” N’asụsụ Grik, ngwaa ahụ dị n’ụdị ọdịnihu, “ị ga-azọpụta,” ma ọ dị n’ime ajụjụ banyere ma ihe ahụ ọ ga-eme.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τί γὰρ οἶδας
  choice: N’ihi na, gịnị ka ị maara
  rationale: A sụgharịrị τί n'ụzọ kwekọrọ n'ụdị ajụjụ Grik ahụ, ma γάρ ka e gosipụtara site na “N’ihi na,” nke jikọtara amaokwu a na ihe e kwuru tupu ya. Igbo a na-edobe ajụjụ ahụ n’enweghị ịgbanwe ya ka ọ bụrụ nkwupụta doro anya banyere enweghị ike ịmata.
- source_word: γύναι
  choice: nwunye
  rationale: N'ọnọdụ alụmdi na nwunye a, γυνή pụtara nwunye, ọ bụghị naanị nwanyị.
- source_word: ἄνερ
  choice: di
  rationale: N'ọnọdụ a, vocative ἄνερ na-ezo aka n’ebe di nọ, ọ bụghị naanị nwoke.
- source_word: σώσεις
  choice: ị ga-azọpụta
  rationale: Nke a na-edobe future indicative Grik ahụ (“ị ga-azọpụta”) n'ime ajụjụ na-amaghị ma ihe ahụ ọ ga-emezu; a zere ịkọwa ya naanị dị ka ime ka onye ahụ kwere ekwe ma ọ bụ ichekwa alụmdi na nwunye.
- source_word: τὸν ἄνδρα
  choice: di gị
  rationale: Igbo nkịtị chọrọ nnọchiaha nwe iji gosi na ọ bụ di nwanyị a kpọrọ okwu.
- source_word: τὴν γυναῖκα
  choice: nwunye gị
  rationale: A na-eji “gị” mee ka mmekọrịta di na nwunye doo anya n’ụzọ Igbo si ekwu ya.
- source_word: ἢ
  choice: Ma ọ bụ
  rationale: Nke a na-eburu njikọ nkewa dị n’etiti ajụjụ abụọ yiri ibe ha.
theological_decisions:
- issue: Ihe “ị ga-azọpụta” pụtara n’ọnọdụ alụmdi na nwunye
  choice: Idowe “ị ga-azọpụta” n’enweghị nkọwa na-amachibido ihe ọ pụtara
  alternative: “ị ga-eme ka o kwere ekwe” ma ọ bụ “ị ga-echekwa alụmdi na nwunye unu”
  rationale: σῴζω nwere ibu echiche nzọpụta n’akwụkwọ Pọl. Ịhapụ ya dịka “azọpụta” na-edobe esemokwu na obosara echiche nke ederede ahụ, kama ikpebi tupu oge eruo kpọmkwem otu nzọpụta a ga-esi mee.
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe dị ugwu ma dị mfe nghọta. E debere myirịta nke ajụjụ abụọ ahụ na kpọmkwem okwu metụtara di na nwunye. Akara nkọwa [a] dị n’isi ederede ma na-akọwa ụzọ ọzọ e si aghọta ụdị ajụjụ na future verb ahụ.
