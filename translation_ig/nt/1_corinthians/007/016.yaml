  rationale: E gbanwere naanị usoro ajụjụ ahụ ka ọ bụrụ Igbo Izugbe na-ada nke ọma, ebe a na-edobe γάρ (“N’ihi na”), okwu kpọmkwem nye nwunye na di, ọdịnihu nke σώσεις, na mgbagwoju anya nke ajụjụ ‘ma.’ E degharịrị ihe odide ala peeji ahụ maka nghọta na asụsụ eke.
