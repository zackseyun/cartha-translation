  - severity: low
    issue: Ihe odide ala peeji ahụ nwere okwu na-adịghị eke (‘na-aga were were’) ma kwughachi ihe isi ederede kwesịrị ikwu n’ụzọ doro anya.
    rationale: A ga-ede ya n’Igbo Izugbe dị mfe, ma kọwaa na ọdịnihu Grik ahụ bụ akụkụ ajụjụ ‘ma,’ ọ bụghị nkwa ma ọ bụ amụma.
