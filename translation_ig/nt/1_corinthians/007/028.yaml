revisions:
- from: Ma ọ bụrụgodị na ị lụọ di ma ọ bụ nwunye, i mehịghị mmehie; ọ bụrụkwa na nwa agbọghọ na-amaghị nwoke alụọ di, o mehịghị mmehie. Ma ndị dị otu a ga-enwe mkpagbu n’anụ ahụ́[a]; ma ana m eche unu ka unu ghara ịgabiga ya[b].
  to: Ma ọ bụrụgodị na ị lụọ di ma ọ bụ nwunye, i mehịghị mmehie; ọ bụrụkwa na nwaanyị na-amaghị nwoke alụọ di, o mehịghị mmehie. Ma ndị dị otu a ga-enwe mkpagbu n’anụ ahụ́[a]; ma ana m echebe unu[b].
  rationale: The revision removes the interpretive and ambiguous expansion in the final clause while retaining its benefactive pastoral force. It uses a more age-neutral expression for the virgin woman and refines the footnotes to preserve lexical and contextual ambiguity without importing a doctrinal reading of σάρξ.
  reviewer_model: gpt-5.6-terra
