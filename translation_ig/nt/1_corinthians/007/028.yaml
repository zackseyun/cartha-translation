review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys that marriage is not sin, retains the reference to the virgin, and preserves the deliberately nontechnical expression τῇ σαρκί as “n’anụ ahụ́.” However, “ana m eche unu ka unu ghara ịgabiga ya” substantially expands φείδομαι, introduces an unclear antecedent (“ya”), and turns Paul’s concise statement into an explicit prevention claim.
  naturalness: Most of the verse is clear Standard Igbo. “Nwa agbọghọ na-amaghị nwoke” is understandable but can suggest a young girl; “nwaanyị na-amaghị nwoke” more naturally identifies the γυναῖκα/παρθένος category without adding an age implication. The revised final clause is both more direct and idiomatic.
  terminology: “Mkpagbu n’anụ ahụ́” appropriately retains θλῖψις and σάρξ without importing the theological sense “sinful nature.” “Nwaanyị na-amaghị nwoke” preserves the sexual-status sense of παρθένος. The footnote explanation should avoid saying marriage itself necessarily causes the hardship and should not characterize “anụ ahụ́” as “ọdịdị mmehie.”
  issues:
  - severity: medium
    issue: The rendering of φείδομαι is overexpanded and ambiguous.
    rationale: “Ana m eche unu ka unu ghara ịgabiga ya” adds “so that you do not go through it” and leaves “ya” unclear. The Greek states succinctly that Paul is sparing them; in context this expresses his pastoral purpose but does not require this added clause.
  - severity: low
    issue: The wording for παρθένος carries an unnecessary age nuance.
    rationale: “Nwa agbọghọ” commonly denotes a girl/young woman. παρθένος here identifies a virgin woman in the marriage discussion, not necessarily her age.
  - severity: low
    issue: Footnote a is more definite than the source about the cause of the hardship.
    rationale: Saying that marital life “na-eweta” the hardships can sound causal and categorical. The Greek says such persons will have affliction in the flesh; the explanatory note should retain the contextual interpretation as a likelihood, not a settled causal claim.
  revised_text: Ma ọ bụrụgodị na ị lụọ di ma ọ bụ nwunye, i mehịghị mmehie; ọ bụrụkwa na nwaanyị na-amaghị nwoke alụọ di, o mehịghị mmehie. Ma ndị dị otu a ga-enwe mkpagbu n’anụ ahụ́[a]; ma ana m echebe unu[b].
  revised_footnotes:
  - marker: a
    text: A pụkwara ịsị, “ha ga-enwe ahụhụ” ma ọ bụ “nsogbu n’anụ ahụ́.” O yikarịrị ka okwu a na-ekwu banyere ihe isi ike nke ndụ n’ụwa ma ọ bụ nke metụtara ahụ́, nke ndị lụrụ di ma ọ bụ nwunye pụrụ izute; ọ naghị ekwu kpọmkwem banyere “anụ ahụ́” dịka ike mmehie.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsị, “ma ana m emere unu ebere,” “ma ana m eche unu,” ma ọ bụ, “ma achọrọ m ichebe unu.” Pọl na-egosi ebumnuche nlekọta ya mgbe ọ na-adọ ha aka ná ntị banyere mkpagbu dị otu a.
    reason: lexical_alternative
