id: 1CO.7.28
reference: 1 Corinthians 7:28
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐὰν δὲ καὶ ⸀γαμήσῃς, οὐχ ἥμαρτες. καὶ ἐὰν γήμῃ ἡ παρθένος, οὐχ ἥμαρτεν. θλῖψιν δὲ τῇ σαρκὶ ἕξουσιν οἱ τοιοῦτοι, ἐγὼ δὲ ὑμῶν φείδομαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/028.yaml
  text: But even if you marry[a], you have not sinned; and if the virgin marries, she has not sinned. Yet such people will have tribulation in the flesh[b], and I am sparing you.
translation:
  language: ig
  text: Ma ọ bụrụgodị na ị lụọ di ma ọ bụ nwunye, i mehịghị mmehie; ọ bụrụkwa na nwaanyị na-amaghị nwoke alụọ di, o mehịghị mmehie. Ma ndị dị otu a ga-enwe mkpagbu n’anụ ahụ́[a]; ma ana m echebe unu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “ha ga-enwe ahụhụ” ma ọ bụ “nsogbu n’anụ ahụ́.” O yikarịrị ka okwu a na-ekwu banyere ihe isi ike nke ndụ n’ụwa ma ọ bụ nke metụtara ahụ́, nke ndị lụrụ di ma ọ bụ nwunye pụrụ izute; ọ naghị ekwu kpọmkwem banyere “anụ ahụ́” dịka ike mmehie.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsị, “ma ana m emere unu ebere,” “ma ana m eche unu,” ma ọ bụ, “ma achọrọ m ichebe unu.” Pọl na-egosi ebumnuche nlekọta ya mgbe ọ na-adọ ha aka ná ntị banyere mkpagbu dị otu a.
    reason: lexical_alternative
lexical_decisions:
- source_word: γαμήσῃς
  choice: ị lụọ di ma ọ bụ nwunye
  rationale: Ngwaa Grik ahụ akọwaghị ma onye a na-agwa okwu ọ̀ bụ nwoke ka ọ̀ bụ nwanyị. N’ihi na Igbo na-ekwukarị alụmdi na nwunye n’ụzọ dabere na okike mmadụ, ‘ị lụọ di ma ọ bụ nwunye’ na-edobe njikọta ahụ n’enweghị ịkpa oke.
- source_word: ἥμαρτες
  choice: i mehịghị mmehie
  rationale: Nke a na-ekwupụta na ịbanye n’alụmdi na nwunye abụghị mmehie; okwu Igbo a na-egosipụta mkpebi omume ahụ nke ọma.
- source_word: ἡ παρθένος
  choice: nwa agbọghọ na-amaghị nwoke
  rationale: παρθένος pụtara nwaanyị na-amaghị nwoke. A hapụghị nkọwa gbasara ọnọdụ mmekọahụ ya, dịka ọ ga-adị ma a sị naanị ‘nwaanyị na-alụbeghị di.’
- source_word: γήμῃ
  choice: alụọ di
  rationale: Ebe onye a kpọrọ aha bụ nwa agbọghọ, ‘alụọ di’ bụ ụzọ Igbo si ekwu ya n’ụzọ ebumpụta ụwa ma na-edobe ọnọdụ ‘ọ bụrụ na.’
- source_word: θλῖψιν
  choice: mkpagbu
  rationale: θλῖψις nwere ike ịpụta mkpagbu, ahụhụ, ma ọ bụ nsogbu na-akpa mmadụ aka. ‘Mkpagbu’ na-edobe ịdị arọ nke okwu ahụ n’ebughị ụzọ kpebie kpọmkwem ụdị nsogbu ọ bụ.
- source_word: τῇ σαρκὶ
  choice: n’anụ ahụ́
  rationale: Nsụgharị a na-edobe okwu nkịtị nke σάρξ ma ghara ịtụgharị ya ka ọ bụrụ ‘ọdịdị mmehie.’ N’ebe a, o yiri ka ọ na-ekwu banyere ndụ mmadụ n’ụwa na ihe isi ike metụtara ahụ́.
- source_word: οἱ τοιοῦτοι
  choice: ndị dị otu a
  rationale: Nke a na-ezo aka n’ụdị ndị a ka kpọtụrụ aha—ndị lụrụ di ma ọ bụ nwunye—n’emeghị ka okwu ahụ dị warara karịa Grik.
- source_word: φείδομαι
  choice: ana m eche unu ka unu ghara ịgabiga ya
  rationale: φείδομαι na-egosi iche mmadụ ka ọ ghara ịta ahụhụ ma ọ bụ ịgabiga ihe siri ike. Nsụgharị a na-eme ka ebumnuche nlekọta Pọl doo anya, ebe ndetu ala na-edobe ụzọ ndị ọzọ e nwere isi ghọta ọdịdị ngwaa ahụ.
theological_decisions:
- issue: Ihe σάρξ pụtara n’okwu τῇ σαρκί
  choice: ‘n’anụ ahụ́,’ ya bụ n’ọnọdụ ndụ mmadụ n’ụwa na n’ahụ́
  alternative: ‘ọdịdị mmehie’ ma ọ bụ echiche sara mbara banyere ndụ nke ụwa
  rationale: Pọl anaghị ekwu ebe a na alụmdi na nwunye na-akpata ọdịdị mmehie. Ọ na-adọ aka ná ntị banyere mkpagbu ndị lụrụ di ma ọ bụ nwunye ga-ezute na ndụ ha. Idebe ‘anụ ahụ́’ na-echekwa okwu ya na esemokwu nkọwa ya.
- issue: Ike okwu φείδομαι
  choice: ebumnuche Pọl bụ ichebe ha ka ha ghara ịgabiga mkpagbu ahụ
  alternative: ‘ana m eche unu’ ma ọ bụ ‘achọrọ m iche unu’
  rationale: Oge ugbu a nke ngwaa Grik nwere ike ịbụ nkwupụta ihe Pọl na-eme ma ọ bụ gosi nzube ya. Isiokwu ahụ na-egosi nlekọta onye ọzụzụ atụrụ, ma ndetu ala na-ekweta ọdịiche ahụ kama ikpochapụ ya.
translation_notes:
  register: E ji Igbo Izugbe dị ugbu a, dị ùgwù ma dị mfe nghọta. A họọrọ ‘ị lụọ di ma ọ bụ nwunye’ iji zere itinye okike mmadụ n’okwu Grik nke onye nke abụọ na-akọwaghị okike; e jikwa ‘nwa agbọghọ na-amaghị nwoke’ debe ihe παρθένος kwuru kpọmkwem. Akara ndetu [a] na [b] dị n’ebe okwu ndị ndetu ha na-akọwa nọ.
