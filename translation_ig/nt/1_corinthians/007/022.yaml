revisions:
- from: N’ihi na ohu ahụ a kpọrọ mgbe ọ nọ n’ime Onyenwe anyị bụ onye Onyenwe anyị tọhapụrụ n’ohu[a]; n’otu aka ahụ, onye nweere onwe ya mgbe a kpọrọ ya bụ ohu Kraịst[b].
  to: N’ihi na ohu ahụ a kpọrọ n’ime Onyenwe anyị bụ onye Onyenwe anyị tọhapụrụ n’ohu[a]; n’otu aka ahụ, onye nweere onwe ya a kpọrọ bụ ohu Kraịst[b].
  rationale: 'The revision keeps the social-status reversal and the precise freedman language, while restoring the source’s compact parallel: the slave is ‘called in the Lord,’ and the free person is ‘called.’ It also confines footnote b to the title Χριστός, preserving the verse’s meaning without adding interpretation.'
