id: 1CO.7.22
reference: 1 Corinthians 7:22
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ γὰρ ἐν κυρίῳ κληθεὶς δοῦλος ἀπελεύθερος κυρίου ἐστίν· ⸀ὁμοίως ὁ ἐλεύθερος κληθεὶς δοῦλός ἐστιν Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/022.yaml
  text: For the servant who was called in the Lord is the Lord’s freedman[a]; likewise[b], the free man who was called is Messiah’s servant.
translation:
  language: ig
  text: N’ihi na ohu ahụ a kpọrọ n’ime Onyenwe anyị bụ onye Onyenwe anyị tọhapụrụ n’ohu[a]; n’otu aka ahụ, onye nweere onwe ya a kpọrọ bụ ohu Kraịst[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'N’ụzọ ọzọ: “onye nweere onwe ya nke Onyenwe anyị.” Okwu Grik a na-ekwu kpọmkwem banyere onye a tọhapụrụ n’ohu.'
    reason: lexical_alternative
  - marker: b
    text: “Kraịst” pụtara “Mesaya,” ya bụ, Onye E Tere Mmanụ.
    reason: title_clarification
lexical_decisions:
- source_word: δοῦλος
  choice: ohu
  rationale: '“Ohu” na-egosi ọnọdụ onye nọ n’okpuru onye nwe ya, ma na-edobe ike nke ntụgharị ọnọdụ Pọl ji arụ ụka: ohu n’ọha mmadụ ghọrọ onye a tọhapụrụ n’ime Onyenwe anyị, ebe onye nweere onwe ya ghọrọ ohu Kraịst.'
- source_word: ἐν κυρίῳ
  choice: n’ime Onyenwe anyị
  rationale: Nke a na-edobe usoro okwu Grik ma na-egosi ọnọdụ ma ọ bụ njikọ onye ahụ na Onyenwe anyị, n’etinyeghị nkọwa karịrị ihe ederede kwuru.
- source_word: κληθεὶς
  choice: a kpọrọ
  rationale: A sụgharịrị participle passive ahụ dị ka omume e mere onye ahụ; nke a kwekọrọ n’ụzọ Pọl si ekwu banyere ọkpụkpọ Chineke.
- source_word: ἀπελεύθερος
  choice: onye ... tọhapụrụ n’ohu
  rationale: Nkebi okwu a na-egosi kpọmkwem onye bụbu ohu ma a tọhapụrụ ya, ọ bụghị naanị onye nweere onwe ya n’ụzọ sara mbara.
- source_word: κυρίου
  choice: Onyenwe anyị
  rationale: Usoro Igbo a na-egosi na onye ahụ bụ onye Onyenwe anyị tọhapụrụ ma bụrụkwa nke ya, na-enweghị ime ka okwu ahụ sie ike nghọta.
- source_word: ὁμοίως
  choice: n’otu aka ahụ
  rationale: Nke a bụ okwu Igbo doro anya nke na-edobe nhata dị n’etiti akụkụ abụọ nke amaokwu ahụ.
- source_word: ἐλεύθερος
  choice: onye nweere onwe ya
  rationale: Nke a na-egosi ọnọdụ onye na-abụghị ohu ma na-arụ ọrụ n’Igbo dịka okwu na-anọchi mmadụ n’ozuzu, dịka otu onye nwoke nnọchiteanya dị na Grik.
- source_word: Χριστοῦ
  choice: Kraịst
  rationale: “Kraịst” bụ aha-utu e ji eme ihe n’Igbo maka Onye E Tere Mmanụ ahụ; genitive Grik pụtara na onye ahụ bụ nke Kraịst.
- source_word: κύριος
  choice: Onyenwe anyị
  rationale: A họọrọ aha-utu a n’ihi ịdị arọ nke κύριος n’okwu Pọl banyere Jizọs; “nna ukwu” naanị ya nwere ike ime ka ọ bụrụ naanị mmekọrịta ohu na onye nwe ohu.
theological_decisions:
- issue: Ịchekwa ntụgharị ọnọdụ dị n’etiti ọnọdụ mmadụ n’ọha na ọnọdụ ya n’ime Kraịst
  choice: E debere “ohu” n’akụkụ abụọ ma kọwaa ἀπελεύθερος dị ka onye a tọhapụrụ n’ohu.
  alternative: Iji “onye na-eje ozi” dochie “ohu,” ma ọ bụ ịsụgharị ἀπελεύθερος naanị dị ka “onye nweere onwe ya.”
  rationale: 'Pọl na-etinye ọnọdụ abụọ a ihu na ihu n’amaghị ama: onye bụ ohu n’ụwa bụ onye Onyenwe anyị tọhapụrụ, ma onye nweere onwe ya n’ụwa bụ ohu Kraịst. Ime ka okwu ndị ahụ dị nro ga-ebelata ike nke ntụnyere ahụ.'
- issue: Nkọwa Χριστοῦ dị ka aha-utu
  choice: ohu Kraịst
  alternative: ohu Mesaya / ohu Onye E Tere Mmanụ
  rationale: “Kraịst” bụ ụdị aha-utu Χριστός a maara nke ọma n’Igbo Bible ma ka na-ezo aka n’Onye E Tere Mmanụ ahụ; e nyere ihe ọzọ n’ala ala peeji iji mee ka aha-utu ahụ doo anya.
translation_notes:
  register: Asụsụ ahụ bụ Standard Igbo dị ugbu a, kwụ ọtọ ma dị ùgwù. E jiri “ohu” chekwaa ike nke δοῦλος, jiri nkebi okwu “onye ... tọhapụrụ n’ohu” mee ka ἀπελεύθερος doo ndị na-agụ akwụkwọ anya, ma debe nhazi yiri ibe ya nke akụkụ abụọ ahụ.
