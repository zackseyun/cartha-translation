source:
  edition: SBLGNT
  text: Τοῖς δὲ λοιποῖς ⸂λέγω ἐγώ⸃, οὐχ ὁ κύριος· εἴ τις ἀδελφὸς γυναῖκα ἔχει ἄπιστον, καὶ αὕτη συνευδοκεῖ οἰκεῖν μετ’ αὐτοῦ, μὴ ἀφιέτω αὐτήν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/012.yaml
  text: But to the rest I say—I[a], not the Lord—if any brother has an unbelieving wife, and she consents to live with him, he must not divorce her.
translation:
  language: ig
  text: 'Ma ndị fọdụrụ ka m na-agwa—mụ onwe m, ọ bụghị Onyenwe anyị—sị: ọ bụrụ na nwanna nwoke ọ bụla nwere nwunye na-ekweghị ekwe, ma nwaanyị ahụ ekweta ka ya na ya biri, ya ahapụla ya.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ya agbahapụla ya” ma ọ bụ “ya achụpụla ya.” Okwu Grik ahụ pụtara n’ụzọ nkịtị “ịhapụ” ma ọ bụ “ịchụpụ,” ma n’ebe a ọ na-ekwu banyere ịkwụsị alụmdi na nwunye.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῖς δὲ λοιποῖς
  choice: Ma ana m agwa ndị fọdụrụ
  rationale: “Ndị fọdụrụ” na-ezo aka n’òtù ndị ọzọ a na-ekwubeghị okwu banyere ha n’iwu gara aga; “Ma” na-egosipụta mgbanwe dị nro nke δέ.
- source_word: λέγω ἐγώ, οὐχ ὁ κύριος
  choice: ọ bụ mụ onwe m, ọ bụghị Onyenwe anyị
  rationale: “Mụ onwe m” na-edobe nkwusi ike dị na ἐγώ, ebe ahịrịokwu ahụ ka na-egosipụta ọdịiche dị n’etiti okwu Pọl na okwu Onyenwe anyị kwuru kpọmkwem.
- source_word: ἀδελφὸς
  choice: nwanna nwoke
  rationale: N’ebe a, aha nwoke dị n’otu na-ekwu kpọmkwem banyere nwoke kwere ekwe nke nwere nwunye; “nwanna nwoke” na-edobe ma mmekọrịta okwukwe ma okike nwoke.
- source_word: γυναῖκα ἔχει ἄπιστον
  choice: nwere nwunye na-ekweghị ekwe
  rationale: Nke a bụ ụzọ Igbo doro anya ma dị ndụ isi kwuo na nwoke ahụ lụrụ nwaanyị na-abụghị onye kwere ekwe.
- source_word: ἄπιστον
  choice: na-ekweghị ekwe
  rationale: N’ọnọdụ a, okwu ahụ pụtara onye na-adịghị ekere òkè n’okwukwe Ndị Kraịst, ọ bụghị onye na-ekwesịghị ntụkwasị obi n’alụmdi na nwunye.
- source_word: καὶ αὕτη συνευδοκεῖ
  choice: ma nwaanyị ahụ ekweta
  rationale: “Ekweta” na-egosipụta nkwenye nke afọ ofufo ibi ndụ alụmdi na nwunye ahụ ọnụ.
- source_word: οἰκεῖν μετ’ αὐτοῦ
  choice: ka ya na ya biri
  rationale: Nke a bụ okwu Igbo nkịtị maka ibikọ ọnụ n’ụlọ dịka di na nwunye.
- source_word: μὴ ἀφιέτω αὐτήν
  choice: ya ahapụla ya
  rationale: “Ahapụla” na-edobe obosara okwu Grik ἀφίημι ma n’ọnọdụ alụmdi na nwunye a na-ezo aka n’ịkwụsị mmekọrịta ahụ; nkọwa ụkwụ na-eme ka nke a doo anya.
theological_decisions:
- issue: Okwu Pọl, “ọ bụ mụ onwe m, ọ bụghị Onyenwe anyị”
  choice: E debere ọdịiche dị n’etiti ntụziaka Pọl na okwu Jizọs kwuru kpọmkwem n’oge ozi ya n’ụwa.
  alternative: Ịghọta ya dị ka nanị echiche Pọl nke na-enweghị ikike.
  rationale: Nsụgharị ahụ anaghị etinye nkọwa banyere mmụọ nsọ ma ọ bụ ikike Pọl n’ime amaokwu ahụ; ọ na-ahapụ esemokwu nke ederede n’onwe ya ka ọ dị.
translation_notes:
  register: Ejiri Igbo Izugbe dị ugbu a, nke nwere ugwu ma dị mfe nghọta. A họọrọ “nwanna nwoke” iji debe nwoke kpọmkwem dị n’ederede, ebe “nwaanyị ahụ” na-eme ka onye nnọchiaha ghara ịdị mgbagwoju anya. Akara ụkwụ [a] dị n’isi ederede dịka achọrọ.
