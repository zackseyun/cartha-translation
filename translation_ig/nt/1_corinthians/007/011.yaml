revisions:
- from: Ma ọ bụrụ na ọ kewapụ onwe ya[a], ya nọgide n’alụghị di, ma ọ bụ ka ya na di ya dịghachi ná mma—di ekwesịghịkwa ịgba nwunye ya alụkwaghịm.
  to: Ma ọ bụrụ na ọ kewapụ[a], ka ọ nọgide n’alụghị di, ma ọ bụ ka ya na di ya dịghachi ná mma—di ekwesịghịkwa ịgba nwunye ya alụkwaghịm[b].
  rationale: E debere ọdịiche Pọl ji mee ihe n’etiti ikewapụ na ịgba alụkwaghịm. E wepụrụ “onwe ya” iji ghara ime ka nkebi mbụ bụrụ ihe reflexive n’ụzọ siri ike karịa Grik chọrọ, ma edozigharịa “ka ọ nọgide” maka mmụta okwu Igbo dị mfe. E tinyere ndetu [b] n’ebe “alụkwaghịm” dị ka nkọwa lexical nke ἀφιέναι, nke na-eme ka akara ndetu na ihe ọ na-akọwa kwekọọ.
