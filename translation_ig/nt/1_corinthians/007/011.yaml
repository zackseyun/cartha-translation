reference: 1 Corinthians 7:11
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐὰν δὲ καὶ χωρισθῇ, μενέτω ἄγαμος ἢ τῷ ἀνδρὶ καταλλαγήτω— καὶ ἄνδρα γυναῖκα μὴ ἀφιέναι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/011.yaml
  text: But if she does separate[a], let her remain unmarried[b], or else be reconciled to her husband—and a husband must not divorce his wife.
translation:
  language: ig
  text: Ma ọ bụrụ na ọ kewapụ[a], ka ọ nọgide n’alụghị di, ma ọ bụ ka ya na di ya dịghachi ná mma—di ekwesịghịkwa ịgba nwunye ya alụkwaghịm[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “Ma ọ bụrụgodị na ọ kewapụ.” Okwu Grik ahụ nwere ike inwe ntakịrị echiche nkwenye n’ebe a.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya n’ụzọ nkịtị, “ekwesịghị ịchụpụ nwunye ya.” N’ọnọdụ alụmdi na nwunye a, okwu ahụ na-ezokarị aka n’ịgba alụkwaghịm.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν δὲ καὶ
  choice: Ma ọ bụrụ na
  rationale: Na-ewebata ọnọdụ nwere ike inwe ntakịrị echiche nke nkwenye; e debere ụdị dị mfe n’ahịrị, ebe e kwuru nhọrọ ‘ọ bụrụgodị na’ n’okpuru.
- source_word: χωρισθῇ
  choice: ọ kewapụ onwe ya
  rationale: χωρίζω pụtara ikewapụ ma ọ bụ ịpụ. N’ọnọdụ alụmdi na nwunye a, okwu a na-egosi nkewa n’etinyeghị kpọmkwem na ọ bụ ịgba alụkwaghịm n’usoro iwu.
- source_word: μενέτω
  choice: ya nọgide
  rationale: Na-egosipụta iwu nke μένω, ya bụ ịnọgide ma ọ bụ ịnọ otu a.
- source_word: ἄγαμος
  choice: n’alụghị di
  rationale: N’ebe nwanyị a nọ, nke a bụ ụzọ Igbo doro anya isi kwuo na ọ nọ n’ọnọdụ onye na-alụghị di.
- source_word: καταλλαγήτω
  choice: ka ya na di ya dịghachi ná mma
  rationale: Na-echekwa echiche nke ime ka mmekọrịta ha dịghachi ná mma, nke passive imperative καταλλαγήτω na-enye.
- source_word: ἀνδρί / ἄνδρα
  choice: di / di
  rationale: Ọnọdụ alụmdi na nwunye na-egosi na ἀνήρ pụtara di, ọ bụghị naanị nwoke.
- source_word: γυναῖκα
  choice: nwunye ya
  rationale: N’ọnọdụ a γυνή pụtara nwunye; ‘ya’ na-eme ka mmekọrịta alụmdi na nwunye doo anya n’Igbo.
- source_word: μὴ ἀφιέναι
  choice: ekwesịghị ịgba ... alụkwaghịm
  rationale: N’ọnọdụ alụmdi na nwunye, ἀφίημι nwere ike izo aka n’ịchụpụ ma ọ bụ ịgba nwunye alụkwaghịm. Nhọrọ a na-enye iwu ahụ n’Igbo nke oge a nke ọma.
theological_decisions:
- issue: Ma a ga-eji otu okwu sụgharịa χωρισθῇ na ἀφιέναι
  choice: Sụgharịa χωρισθῇ dị ka ‘kewapụ onwe ya,’ ma ἀφιέναι dị ka ‘ịgba ... alụkwaghịm.’
  alternative: Iji ‘ịgba alụkwaghịm’ mee ha abụọ, ma ọ bụ iji ‘ikewapụ/ịhapụ’ mee ha abụọ.
  rationale: Pọl jiri ngwaa abụọ dị iche. Idebe ọdịiche ahụ na-ezere ime ka nkewa bụrụrịrị ịgba alụkwaghịm n’usoro iwu, ma na-egosikwa ike okwu ἀφιέναι nwere n’ọnọdụ a.
- issue: Otu esi egosipụta nwanyị bụ isiokwu nke nkebi mbụ
  choice: Jiri ‘ọ’ na ntụaka di ya mee ka o doo anya na ọ bụ nwanyị ahụ a na-ekwu maka ya.
  alternative: Ikwughachi ‘nwanyị ahụ’ ma ọ bụ ‘nwunye ahụ’ n’ahịrị ahụ.
  rationale: Igbo nwere ike iji nnọchiaha ‘ọ’ n’enweghị imebi usoro okwu ahụ; ‘di ya’ na-eme ka nwoke na nwanyị a na-ekwu maka ha doo anya.
translation_notes:
  register: Igbo ọkọlọtọ nke oge a, dị nsọ ma dị mfe nghọta. E debere ọdịiche dị n’etiti nkewa na ịgba alụkwaghịm. Naanị akara [a] ka e tinyere n’ahịrị n’ihi na nkọwa ọzọ e nyere n’English dịka [b] metụtara ἀφιέναι, ọ bụghị ἄγαμος; e mere ka ndetu ụkwụ kwekọọ n’ebe o kwesịrị ịdị.
