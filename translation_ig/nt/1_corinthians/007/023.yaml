  yaml_path: translation/nt/1_corinthians/007/023.yaml
  text: You were bought with a price[a]; do not become servants of men.
translation:
  language: ig
  text: E ji ọnụ ahịa zụta unu; unu aghọla ndị ohu nke ụmụ mmadụ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị ohu mmadụ.” Okwu Grik ahụ na-ezo aka n’ụmụ mmadụ n’ozuzu ha, ọ bụghị naanị ụmụ nwoke; n’ọnọdụ a, ọ na-eme ka ọdịiche dị n’etiti ụmụ mmadụ na Onyenweanyị pụta ìhè.
    reason: lexical_alternative
lexical_decisions:
- source_word: τιμῆς
  choice: ji ọnụ ahịa
  rationale: Ọnọdụ genitive a na-egosi ihe e ji zụta mmadụ, ya bụ ụgwọ ma ọ bụ ọnụ ahịa. Nkebi a na-edobe echiche nke nzụta dị oke ọnụ n’ebughị ụzọ kọwaa ego ole ọ bụ.
- source_word: ἠγοράσθητε
  choice: zụta unu
  rationale: Ọ bụ aorist passive indicative, onye nke abụọ ọtụtụ. Usoro “E ... zụta unu” na-egosi nke ọma na ọ bụ onye ọzọ zụtara ha, ma na-edokwa ihe atụ Pọl ji azụmahịa kọwaa mgbapụta.
- source_word: μὴ γίνεσθε
  choice: unu aghọkwala
  rationale: γίνομαι pụtara ‘ịghọ’ karịa nanị ‘ịbụ.’ “Unu aghọkwala” na-enye iwu ka ha ghara ịbanye ma ọ bụ nọgide n’ọnọdụ ahụ.
- source_word: δοῦλοι
  choice: ndị ohu
  rationale: N’ebe a, okwu ahụ na-egosi mmadụ nọ n’okpuru onye nwe ya, ọ bụghị nanị onye na-eje ozi n’afọ ofufo. “Ndị ohu” na-edobe echiche nke inwe mmadụ na nrubeisi nke dị n’ihe atụ ahụ.
- source_word: ἀνθρώπων
  choice: mmadụ
  rationale: Okwu Grik a bụ genitive plural nke ἄνθρωπος ma na-ezo aka n’ụmụ mmadụ n’ozuzu, ọ bụghị nanị ndị nwoke. “Mmadụ” n’Igbo na-arụ ọrụ dịka aha mkpokọta ebe a ma na-egosi ọdịiche dị n’etiti ndị nwe mmadụ na Onyenweanyị.
theological_decisions:
- issue: Otu a ga-esi sụgharịa δοῦλοι ἀνθρώπων n’ìhè nke ihe atụ banyere onye nwe mmadụ na nrubeisi
  choice: ndị ohu mmadụ
  alternative: ndị na-ejere mmadụ ozi
  rationale: 'Isi okwu amaokwu ahụ metụtara onye nwe mmadụ na onye a na-erubere isi: ebe e jiri ọnụ ahịa zụta ndị kwere ekwe, ha ekwesịghị idobe onwe ha n’okpuru ikike mmadụ dịka onye nwe ha kpamkpam. “Ndị ohu” na-edobe ike nke ihe atụ ahụ karịa “ndị na-eje ozi,” ma “mmadụ” gụnyere ụmụ mmadụ niile.'
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, dị mfe ma nwee ugwu. Usoro ahịrịokwu ahụ dị nkenke dịka nke Grik, ma “E ji ọnụ ahịa zụta unu” bụ usoro Igbo sitere n’okike nke na-edobe passive na ihe atụ nzụta. “Unu aghọkwala” na-egosipụta mgbanwe ọnọdụ nke γίνεσθε.
