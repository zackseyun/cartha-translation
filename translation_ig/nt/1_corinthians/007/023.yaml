  terminology: “Ndị ohu” correctly preserves the ownership/bondage force of δοῦλοι. “Ụmụ mmadụ” accurately renders ἀνθρώπων inclusively, without introducing a male-only sense. “Onyenweanyị” is retained only in the footnote’s contextual clarification, as in the English audit trail.
