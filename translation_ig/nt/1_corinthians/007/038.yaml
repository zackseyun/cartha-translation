  text: ὥστε καὶ ὁ ⸀γαμίζων ⸂τὴν παρθένον ἑαυτοῦ⸃ καλῶς ποιεῖ, ⸂καὶ ὁ⸃ μὴ ⸁γαμίζων κρεῖσσον ⸀ποιήσει.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/038.yaml
  text: So then[a], the one who gives his own virgin in marriage does well, and the one who does not give her in marriage will do better.
translation:
  language: ig
  text: Ya mere[a], onye na-enye nwa agbọghọ na-amaghị nwoke nke ya n’alụmdi na nwunye na-eme nke ọma; ma onye na-adịghị enye ya n’alụmdi na nwunye ga-eme nke ka mma.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ: “onye lụrụ nwa agbọghọ na-amaghị nwoke ahụ ọ kwere nkwa ịlụ na-eme nke ọma; ma onye na-alụghị ya ga-eme nke ka mma.” Nkọwa ọzọ a na-ahụkarị bụ “nwa ya nwanyị na-amaghị nwoke.” Ngwaa Grik e ji mee ihe n’ebe a na-apụtakarị “inye mmadụ n’alụmdi na nwunye”; ya mere, isi okwu ahụ na-echekwa nghọta ahụ ma ọ naghị akọwa kpọmkwem njikọ dị n’etiti nwoke ahụ na nwa agbọghọ ahụ.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὥστε
  choice: Ya mere
  rationale: Na-egosi nkwubi okwu sitere n'ihe Pọl kwuru tupu nke a, n'Igbo dị mfe ma kwụ ọtọ.
- source_word: γαμίζων
  choice: na-enye ... ka ọ lụọ di
  rationale: Na-echekwa nghọta causative nke γαμίζω, ya bụ ime ka onye ọzọ lụọ di, kama ịtụgharị ya dị ka γαμέω, ‘ịlụ.’
- source_word: τὴν παρθένον ἑαυτοῦ
  choice: nwa agbọghọ ya na-amaghị nwoke
  rationale: ‘Nwa agbọghọ ... na-amaghị nwoke’ na-egosi παρθένος n'ụzọ ndị Igbo taa ga-aghọta; ‘ya’ na-echekwa njikọ nke ἑαυτοῦ n'ebughị ụzọ kpebie ma ọ bụ nwa ya nwanyị, onye ọ na-elekọta, ka ọ bụ onye ọ chọrọ ịlụ.
- source_word: καλῶς ποιεῖ
  choice: na-eme nke ọma
  rationale: Na-echekwa nkwupụta na omume ahụ dị mma, n'emeghị ya iwu zuru oke.
- source_word: μὴ γαμίζων
  choice: na-adịghị enye ya ka ọ lụọ di
  rationale: Na-eme ka otu nghọta causative ahụ gaa n'ihu; ‘ya’ na-anọchi ihe e kwuru na nkebiokwu mbụ.
- source_word: κρεῖσσον ποιήσει
  choice: ga-eme nke ka mma
  rationale: Na-echekwa ntụnyere κρεῖσσον, ‘ka mma,’ kama ime ya ka ọ bụrụ ‘kachasị mma.’
theological_decisions:
- issue: Onye παρθένος ἑαυτοῦ na-ekwu maka ya na ihe γαμίζω pụtara
  choice: Isi okwu ahụ ji ‘na-enye nwa agbọghọ ya na-amaghị nwoke ka ọ lụọ di,’ nke na-echekwa nghọta causative ma hapụ njikọ ha kpọmkwem ka ọ ghara ikpebi ya.
  alternative: A pụkwara ịghọta ya dị ka nwoke ịlụ nwa agbọghọ ahụ ya na ya kwere nkwa ịlụ; nkọwa ọzọ a na-ahụkarị bụ na ọ bụ nna na-enye nwa ya nwanyị ka ọ lụọ di.
  rationale: γaμίζω na-akachasị egosi ‘inye n'alụmdi na nwunye,’ ma okwu Grik ahụ ekwughị kpọmkwem ma nwa agbọghọ ahụ ọ bụ nwa ya nwanyị, onye ọ na-elekọta, ma ọ bụ onye ya na ya kwere nkwa ịlụ. Ya mere, nsụgharị ahụ echekwala esemokwu nkọwa ahụ kama idozi ya n'isi okwu.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E ji ‘nwa agbọghọ ... na-amaghị nwoke’ mee ka echiche παρθένος doo anya n'ụzọ ebumpụta ụwa; e zere ‘nwa ya nwanyị’ n'isi okwu ka a ghara idozi ihe Grik hapụrụ edoghị anya.
