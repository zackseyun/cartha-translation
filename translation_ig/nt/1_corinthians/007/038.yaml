revisions:
- from: Ya mere[a], onye na-enye nwa agbọghọ ya na-amaghị nwoke ka ọ lụọ di na-eme nke ọma; ma onye na-adịghị enye ya ka ọ lụọ di ga-eme nke ka mma.
  to: Ya mere[a], onye na-enye nwa agbọghọ na-amaghị nwoke nke ya n’alụmdi na nwunye na-eme nke ọma; ma onye na-adịghị enye ya n’alụmdi na nwunye ga-eme nke ka mma.
  rationale: The revision retains the Greek’s causative verb and its unresolved social referent, while using smoother Standard Igbo. It neither makes the virgin explicitly a daughter nor adopts the less likely fiancée/marriage reading in the main text; that reading remains appropriately in the footnote.
