  text: Each one should remain in the calling in which he was called[a][b].
translation:
  language: ig
  text: Ka onye ọ bụla nọgide n’ọkpụkpọ e kpọrọ ya n’ime ya.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ‘ọkpụkpọ’ dịka ‘ọnọdụ,’ ‘ọnọdụ ndụ,’ ma ọ bụ ‘ọkwa mmadụ nọ na ya.’ Ma Grik kwuru ‘ọkpụkpọ,’ nke na-ekwughachi okwu ‘a kpọrọ ya’ n’otu amaokwu a.
    reason: lexical_alternative
  - marker: b
    text: Okwu Grik maka ‘onye ọ bụla’ dị n’ụdị nwoke na otu, ma eji ya anọchite anya onye ọ bụla. N’Igbo, ‘onye ọ bụla’ na nnọchiaha ‘ya’ anaghị ekewa nwoke na nwanyị.
    reason: cultural_note
lexical_decisions:
- source_word: ἕκαστος
  choice: onye ọ bụla
  rationale: Nke a na-edobe echiche nkesa nke otu onye n’otu onye, ma bụrụkwa okwu Igbo doro anya ma dị ndụ.
- source_word: κλήσει
  choice: n’ọkpụkpọ ahụ
  rationale: A họọrọ ‘ọkpụkpọ’ kama ‘ọnọdụ’ ka e wee debe njikọ okwu dị n’etiti κλήσει na ἐκλήθη, ma ghara imechi esemokwu dị n’etiti ọkpụkpọ Chineke na ọnọdụ ndụ mmadụ.
- source_word: ᾗ ἐκλήθη
  choice: ọ nọ na ya mgbe a kpọrọ ya
  rationale: Nke a na-eme ka ahịrịokwu ahụ bụrụ Igbo a na-aghọta nke ọma, na-edobekwa passive ahụ n’enweghị ịkpọpụta onye kpọrọ ya, dịka Grik si mee.
- source_word: ἐν ταύτῃ
  choice: n’ọkpụkpọ ahụ ọ nọ na ya
  rationale: A na-eme ka demonstrative ahụ laghachi n’ọkpụkpọ e kwuru okwu ya, n’ụzọ na-adịghị arọ n’Igbo.
- source_word: μενέτω
  choice: Ka … nọgide
  rationale: Usoro ‘Ka … nọgide’ na-egosi iwu nke present imperative, ya bụ ịnọgide n’ọnọdụ ahụ, n’asụsụ Igbo dị ugbu a ma dị nsọpụrụ.
theological_decisions:
- issue: Ihe κλῆσις pụtara n’ebe a
  choice: E debere ‘ọkpụkpọ’ n’ahịrịokwu bụ isi, ebe ihe gbara ya gburugburu na-egosikwa ọnọdụ mmadụ nọ na ya mgbe a kpọrọ ya.
  alternative: ọnọdụ; ọnọdụ ndụ; ọkwa mmadụ n’obodo
  rationale: Ihe ndị Pọl na-ekwu gburugburu amaokwu a metụtara ọnọdụ ndụ, ma o jiri κλήσει na ἐκλήθη jikọta ‘ọkpụkpọ’ na ‘ịkpọ.’ Nsụgharị a na-edobe njikọ ahụ na esemokwu nkọwa ya kama ikpebi na ọ bụ naanị ọnọdụ mmadụ n’obodo.
- issue: Masculine singular nke Grik
  choice: A sụgharịrị ya dịka ‘onye ọ bụla … ya,’ nke na-emetụta onye kwere ekwe ọ bụla n’Igbo.
  alternative: Iji okwu ga-akọwapụta nwoke kpọmkwem
  rationale: Grik ji masculine singular n’ọnọdụ nnọchite anya mmadụ niile. N’Igbo, ‘ya’ anaghị ekewa nwoke na nwanyị, ya mere ọ na-enye iwu ahụ otu onye n’otu onye n’enweghị ịgbakwunye okike na-adịghị apụta n’usoro ụtọasụsụ Igbo.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị nsọpụrụ ma dị mfe nghọta. A họọrọ usoro dịtụ nkịtị ‘ọ nọ na ya mgbe a kpọrọ ya’ iji zere ahịrịokwu siri ike ‘a kpọrọ ya n’ime ya,’ ma a ka debere njikọ okwu ‘ọkpụkpọ/a kpọrọ.’
