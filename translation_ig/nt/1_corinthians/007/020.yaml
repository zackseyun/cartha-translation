revisions:
- from: Ka onye ọ bụla nọgide n’ọkpụkpọ ahụ ọ nọ na ya mgbe a kpọrọ ya.[a][b]
  to: Ka onye ọ bụla nọgide n’ọkpụkpọ e kpọrọ ya n’ime ya.[a][b]
  rationale: The revision restores the source’s “in which … in this” relationship by rendering “e kpọrọ ya n’ime ya,” while retaining the κλῆσις/ἐκλήθη correspondence as “ọkpụkpọ/ kpọrọ.” The second footnote is made grammatically accurate and does not impose an English-specific gender claim on Igbo.
