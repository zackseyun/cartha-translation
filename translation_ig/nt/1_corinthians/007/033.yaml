  text: ὁ δὲ γαμήσας μεριμνᾷ τὰ τοῦ κόσμου, πῶς ⸀ἀρέσῃ τῇ γυναικί,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/033.yaml
  text: But the married man is concerned with the things of the world[a], how he may please his wife,
translation:
  language: ig
  text: Ma nwoke lụrụ nwanyị na-eche banyere ihe ndị metụtara ụwa[a], otu ọ ga-esi atọ nwunye ya ụtọ,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ihe ndị metụtara ndụ n’ụwa,” ma ọ bụ, “ọrụ na ihe ndị ọzọ nke ụwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ γαμήσας
  choice: Ma nwoke lụrụ nwanyị
  rationale: Nkebi a na-arụ ọrụ dị ka aha ma na-ezo aka kpọmkwem n’ nwoke lụrụ nwanyị, n’ụzọ megidere nwoke na-alụghị nwanyị n’okwu ndị gbara ya gburugburu.
- source_word: μεριμνᾷ
  choice: na-eche banyere
  rationale: Okwu a nwere ike ịpụta inwe nchegbu ma ọ bụ ilekọta ihe. N’ebe a, ọ na-egosi ihe ndị metụtara ọrụ na ndụ alụmdi na nwunye, n’enweghị ikwu na nchegbu ahụ bụ mmehie.
- source_word: τὰ τοῦ κόσμου
  choice: ihe nke ụwa
  rationale: Nke a na-echekwa ụdị okwu Grik ahụ ma na-ezo aka n’ihe ndị metụtara ndụ nkịtị n’ụwa, n’enweghị inye ya echiche ọjọọ n’onwe ya.
- source_word: πῶς ἀρέσῃ
  choice: otu ọ ga-esi mee ihe ga-atọ ... ụtọ
  rationale: Nsụgharị a na-egosi na ihe ọ na-eche bụ ụzọ ọ ga-esi mee nwunye ya obi ụtọ, ma bụrụkwa okwu Igbo doro anya ma dị n’okike.
- source_word: τῇ γυναικί
  choice: nwunye ya
  rationale: N’ọnọdụ alụmdi na nwunye a, γυνή pụtara nwunye; ‘ya’ na-eme ka mmekọrịta ahụ doo anya n’Igbo.
theological_decisions:
- issue: Ma κόσμος ebe a ò nwere echiche omume ọjọọ
  choice: A sụgharịrị ya n’ụzọ na-anọpụ iche dịka ‘ụwa’ / ‘ihe nke ụwa.’
  alternative: ‘Ihe ụwa’ nke nwere ike ịpụta ihe ọjọọ ma ọ bụ omume nke ụwa.
  rationale: N’okwu ndị gbara ya gburugburu, Pọl na-ekwu maka ọrụ nkịtị nke ndụ alụmdi na nwunye ma jiri ya tụnyere ijere Onyenwe anyị ozi n’enweghị ihe na-ekewa uche. Ọ naghị ama alụmdi na nwunye ikpe ma ọ bụ kwuo na ọrụ ndị ahụ bụ ihe ọjọọ.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. ‘Na-eche banyere’ na-edobe obosara echiche μεριμνᾷ, ebe ‘ihe nke ụwa’ na-ezere ịkọwa κόσμος dịka ihe ọjọọ n’amaghị ama.
