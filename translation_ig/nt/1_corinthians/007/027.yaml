base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/027.yaml
  text: Are you bound to a wife? Do not seek release[a]. Are you released from a wife? Do not seek a wife.
translation:
  language: ig
  text: Ị̀ bụ onye e kegidere na nwunye? Achọla ịtọpụ onwe gị.[a] Ị̀ bụ onye a tọpụụrụ n’ebe nwunye nọ? Achọla nwunye.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ, n’ụzọ na-akọwa ihe ọ pụtara karịa: “Ị̀ lụọla nwunye? Achọla ịgba alụkwaghịm. Ị̀ gbaala alụkwaghịm n’ebe nwunye gị nọ? Achọla nwunye.” N’asụsụ Grik, okwu ndị e ji mee ihe pụtara n’ụzọ nkịtị ịbụ onye “e kegidere” na onye “a tọpụụrụ.”'
    reason: alternative_reading
lexical_decisions:
- source_word: δέδεσαι
  choice: Ì kegidere gị
  rationale: Na-echekwa ihe atụ nke ịbụ onye e kegidere, nke perfect passive/middle δέω na-egosi, ma na-eme ka njikọ ya na λύσιν doo anya.
- source_word: γυναικί
  choice: na nwunye
  rationale: N’ọnọdụ alụmdi na nwunye a, γυνή pụtara nwunye, ọ bụghị naanị nwanyị.
- source_word: μὴ ζήτει
  choice: Achọla
  rationale: Na-enye iwu mgbochi ahụ n’Igbo nkịtị ma debe echiche ζητέω nke ịchọ ma ọ bụ ịgbalị inweta ihe.
- source_word: λύσιν
  choice: ka a tọpụ gị n’agbụ ahụ
  rationale: ‘Ịtọpụ n’agbụ’ na-echekwa ihe atụ λύσις nke ịtọpụ ma na-ezere ime ka okwu ahụ bụrụ naanị ịgba alụkwaghịm.
- source_word: λέλυσαι ἀπὸ γυναικός
  choice: Ì nọzi n’enweghị nwunye
  rationale: Igbo nkịtị anaghị ekwu ‘a tọpụla gị n’aka nwunye’ nke ọma; nhọrọ a na-egosi ọnọdụ nke kewapụrụ mmadụ n’ebe nwunye nọ, ma ghara ikpebi ma ihe kpatara ya bụ ịgba alụkwaghịm, ọnwụ nwunye, ma ọ bụ ọnọdụ ọzọ.
- source_word: γυναῖκα
  choice: nwunye
  rationale: N’ebe a, ọnọdụ ahụ bụ ịchọ ịlụ, ya mere ‘nwunye’ ziri ezi karịa ‘anyị nwanyị.’
theological_decisions:
- issue: Ma a ga-akọwa okwu ahụ kpọmkwem dịka ‘ịlụ di na nwunye/ịgba alụkwaghịm,’ ka a ga-edebe ihe atụ nke ikegide na ịtọpụ.
  choice: E debere ihe atụ nke ịbụ onye e kegidere na onye a tọpụụrụ n’isi ahịrịokwu mbụ, ma jiri okwu Igbo doro anya ‘ịnọ n’enweghị nwunye’ n’ahịrịokwu nke abụọ.
  alternative: Ì lụọla nwunye? Achọla ịgba alụkwaghịm. Ì gbaala alụkwaghịm? Achọla nwunye.
  rationale: Grik ji δέω/λύω, ọ bụghị okwu ndị na-ekwu kpọmkwem ịlụ di na nwunye na ịgba alụkwaghịm. Ya mere nsụgharị ahụ anaghị eme ka ihe Pọl kwuru dị warara karịa ka ọ dị, ma ihe odide ala peeji na-enye nkọwa alụmdi na nwunye nke nwere ike ịdị n’okwu ahụ.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E jiri ‘Ì’ mee ajụjụ n'ụzọ eke; e zere okwu iwu alụmdi na nwunye nke ga-eme ka nghọta Grik dị warara. Ihe odide ala peeji [a] pụtara n’isi ederede dịka a chọrọ.
