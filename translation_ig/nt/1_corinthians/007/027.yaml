revisions:
- from: Ì kegidere gị na nwunye? Achọla ka a tọpụ gị n’agbụ ahụ.[a] Ì nọzi n’enweghị nwunye? Achọla nwunye.
  to: Ị̀ bụ onye e kegidere na nwunye? Achọla ịtọpụ onwe gị.[a] Ị̀ bụ onye a tọpụụrụ n’ebe nwunye nọ? Achọla nwunye.
  rationale: The complete revision repairs the unclear passive construction and restores the lexical pairing between δέδεσαι/λύσιν/λέλυσαι. It avoids portraying the marriage bond as ‘bondage’ and does not reduce the second clause to the broader state of having no wife. The alternative footnote remains clearly labeled as interpretive.
  reviewer_model: gpt-5.6-terra
