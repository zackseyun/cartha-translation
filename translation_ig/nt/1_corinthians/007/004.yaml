id: 1CO.7.4
reference: 1 Corinthians 7:4
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἡ γυνὴ τοῦ ἰδίου σώματος οὐκ ἐξουσιάζει ἀλλὰ ὁ ἀνήρ· ὁμοίως δὲ καὶ ὁ ἀνὴρ τοῦ ἰδίου σώματος οὐκ ἐξουσιάζει ἀλλὰ ἡ γυνή.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/004.yaml
  text: The wife does not have authority over her own body[a], but the husband does; likewise also the husband does not have authority over his own body, but the wife does.
translation:
  language: ig
  text: Nwunye enweghị ikike n’ahụ nke ya[a], kama di ya nwere ikike ahụ; n’otu aka ahụkwa, di enweghị ikike n’ahụ nke ya, kama nwunye ya nwere ikike ahụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “anaghị eji ikike achị ahụ nke ya.” Okwu Grik a pụrụ ịpụta inwe ikike ma ọ bụ iji ikike eme ihe; n’ebe a, ọ na-ekwu maka ikike di na nwunye nwere n’ebe ibe ha nọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: γυνή
  choice: nwunye
  rationale: N’ọnọdụ okwu a gbasara alụmdi na nwunye na ọrụ di na nwunye nwere n’ebe ibe ha nọ, okwu a pụtara nwunye, ọ bụghị naanị nwanyị n’ozuzu.
- source_word: ἀνήρ
  choice: di
  rationale: E jikọtara okwu a na γυνή n’ọnọdụ alụmdi na nwunye, ya mere ‘di’ bụ ntụgharị dabara adaba karịa ‘nwoke’.
- source_word: ἰδίου σώματος
  choice: ahụ nke ya
  rationale: Nke a na-edobe nkwusi ike nke ἴδιος n’ihe bụ nke mmadụ onwe ya, ma bụrụkwa okwu Igbo doro anya ma dị mfe.
- source_word: ἐξουσιάζει
  choice: nwere ikike n’ahụ
  rationale: Nhọrọ a na-egosipụta inwe ikike ma ọ bụ ọchịchị n’ebe ihe nọ, na-enweghị ime ka okwu ahụ bụrụ nke ike ma ọ bụ mmanye karịa ka Grik si kwuo.
- source_word: ἀλλά
  choice: kama
  rationale: ‘Kama’ na-egosipụta ntụgharị doro anya site n’otu di ma ọ bụ nwunye gaa n’aka nke ọzọ dịka onye nwere ikike ahụ.
- source_word: ὁμοίως δὲ καὶ
  choice: n’otu aka ahụkwa
  rationale: Nke a na-edobe myirịta na nkwughachi zuru oke dị n’ahịrịokwu abụọ ahụ, ma na-ada ka Igbo nkịtị.
theological_decisions:
- issue: Ụdị ikike di na nwunye e kwuru n’amaokwu a
  choice: E gosipụtara ikike ahụ dịka nke di na nwunye nwere n’ebe ibe ha nọ n’otu nha.
  alternative: Ịsụgharị ya n’ụzọ dị nro dịka ‘ahụ ya abụghị naanị nke ya,’ ma ọ bụ n’ụzọ siri ike dịka ‘onye nke ọzọ na-achị ahụ ya.’
  rationale: 'Ahịrịokwu Grik abụọ ahụ haziri n’ụzọ kwekọrọ ekwekọ: ihe e kwuru banyere nwunye ka e kwukwara banyere di. Ya mere, ntụgharị ahụ na-edobe ikike ha nwere n’ebe ibe ha nọ n’enweghị itinye echiche ọchịchị otu onye ma ọ bụ mmanye nke ederede ahụ ekwughị.'
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta mee ihe. Nhazi ahịrịokwu abụọ ahụ na-edobe myirịta na mmeghachi omume dị n’ederede Grik, ebe ‘n’ahụ nke ya’ na-enye Igbo dị ndụ karịa ntụgharị siri ike nke usoro okwu Grik.
