  text: ἕκαστος ἐν ᾧ ἐκλήθη, ἀδελφοί, ἐν τούτῳ μενέτω παρὰ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/024.yaml
  text: Brothers[b][a], let each one remain with God in that condition in which he was called.
translation:
  language: ig
  text: Ụmụnna[b], ka onye ọ bụla nọgide n’ọnọdụ ahụ a kpọrọ ya, ya na Chineke[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “n’ihu Chineke” ma ọ bụ “n’ọnụnọ Chineke.”
    reason: lexical_alternative
  - marker: b
    text: “Ụmụnna” n’ebe a bụ okwu a na-agwa ọgbakọ dum, gụnyere ụmụ nwanyị.
    reason: cultural_note
lexical_decisions:
- source_word: ἕκαστος
  choice: onye ọ bụla
  rationale: Nke a na-egosipụta nkesa n’otu n’otu ma mee ka ntụziaka ahụ metụta onye nke ọ bụla n’ụzọ doro anya.
- source_word: ἐν ᾧ ... ἐν τούτῳ
  choice: n’ọnọdụ ahụ ...
  rationale: Usoro ἐν na nnọchiaha njikọ na nke ngosi na-atụ aka n’ọnọdụ ndụ ma ọ bụ ọkwa mmadụ nọ na ya, dịka ihe ndị gbara amaokwu a gburugburu si gosi.
- source_word: ἐκλήθη
  choice: a kpọrọ ya
  rationale: E jigidere olu nnabata nke Grik ma etinyeghị ‘Chineke’ dịka onye kpọrọ ya, n’ihi na ederede ekwughị onye ahụ kpọrọ ya kpọmkwem.
- source_word: ἀδελφοί
  choice: Ụmụnna
  rationale: ‘Ụmụnna’ bụ okwu Igbo e ji akpọkọta ọgbakọ n’ụzọ ebumpụta ụwa; n’ebe a ọ gụnyere ndị nwoke na ndị nwanyị, nke nkọwa ala peeji na-eme ka o doo anya.
- source_word: μενέτω
  choice: ka ... nọgide
  rationale: Nke a na-echekwa iwu nke μένω na echiche nke ịnọgide n’ọnọdụ mmadụ nọ na ya.
- source_word: παρὰ θεῷ
  choice: ya na Chineke
  rationale: Παρά tinyere dative nwere ike igosi mmekọrịta ma ọ bụ ịnọ nso; ‘ya na Chineke’ na-enye ọgụgụ dị mkpirikpi ma kwekọọ n’echiche ahụ. A debere nhọrọ ndị ọzọ n’ala peeji.
theological_decisions:
- issue: Ma a ga-ekwupụta Chineke dịka onye kpọrọ mmadụ
  choice: Jide ‘a kpọrọ ya’ n’olu nnabata n’etinyeghị ‘Chineke’
  alternative: ‘Chineke kpọrọ ya’ ma ọ bụ ‘mgbe Chineke kpọrọ ya’
  rationale: Ihe Pọl na-ekwu na gburugburu amaokwu a na-egosi na ọ bụ Chineke na-akpọ, ma Grik hapụrụ onye mere omume ahụ n’ekwughị ya. Nsụgharị ahụ anaghị atụkwasị okwu na-anọghị n’ederede.
- issue: Otu a ga-esi sụgharịa ἀδελφοί mgbe a na-agwa ọgbakọ nwere nwoke na nwanyị okwu
  choice: Ụmụnna
  alternative: Ụmụnna ndị nwoke na ndị nwanyị
  rationale: ‘Ụmụnna’ na-echekwa ụdị okwu e ji kpọọ ndị otu okwukwe ma na-arụkwa ọrụ dịka okwu na-agụnye ọgbakọ dum n’Igbo; nkọwa ala peeji na-egbochi nghọtahie.
- issue: Ihe παρὰ θεῷ pụtara n’ebe a
  choice: ya na Chineke
  alternative: n’ihu Chineke; n’ọnụnọ Chineke
  rationale: Nkebiokwu Grik ahụ dị mkpirikpi, o nwekwara ike igosi mmekọrịta mmadụ na Chineke ma ọ bụ ibi ndụ n’ihu ya. E chekwara ohere nghọta abụọ ahụ n’ala peeji kama imechi esemokwu ahụ.
translation_notes:
  register: E ji Igbo Izugbe dị ugbu a, dị ùgwù ma dị mfe nghọta. Nhazi ahịrịokwu ahụ na-edobe ‘ọnọdụ ahụ a kpọrọ ya’ ọnụ iji gosipụta njikọ ἐν ᾧ ... ἐν τούτῳ, ebe ‘ya na Chineke’ nọ n’ikpeazụ dịka ọ dị na Grik. A họọrọ ‘ọnọdụ’ kama okwu na-egosi naanị ebe mmadụ nọ, n’ihi mkparịta ụka gbasara ọnọdụ ndụ na ọkwa mmadụ n’akụkụ amaokwu a.
