  rationale: Mmezi a na-ewepụ ‘ka ha dị ka,’ na-eme ka nkebi atọ ahụ soro nhazi ὡς μὴ + participle n’ụzọ kpọmkwem karịa, ma na-ewepụ ‘n'aka ha,’ nke na-amachi ihe κατέχοντες pụtara. E chekwara ntụgharị okwu, ụda nkwughachi, na nghọta na Pọl anaghị agọnahụ eziokwu nke ịkwa ákwá, ịṅụrị ọṅụ, ma ọ bụ ịzụ ihe.
