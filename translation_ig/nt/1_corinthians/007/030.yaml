source:
  edition: SBLGNT
  text: καὶ οἱ κλαίοντες ὡς μὴ κλαίοντες, καὶ οἱ χαίροντες ὡς μὴ χαίροντες, καὶ οἱ ἀγοράζοντες ὡς μὴ κατέχοντες,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/030.yaml
  text: and those who weep as not weeping[a], and those who rejoice as not rejoicing, and those who buy as not possessing,
translation:
  language: ig
  text: Na ndị na-akwa ákwá, dị ka ndị na-adịghị akwa ákwá; na ndị na-aṅụrị ọṅụ, dị ka ndị na-adịghị aṅụrị ọṅụ; na ndị na-azụ ihe, dị ka ndị na-enweghị ihe ha zụtara.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, ‘dị ka a ga-asị na ha anaghị akwa ákwá ... dị ka a ga-asị na ha anaghị aṅụrị ọṅụ ... dị ka a ga-asị na ha enweghị ihe ha zụtara.’ Okwu Grik na-emegharị usoro ‘dị ka ndị na-adịghị’ iji gosi otú mmadụ si ebi ndụ, ọ bụghị ịgọnahụ na ahụmahụ ndị a na-eme n’eziokwu.
    reason: lexical_alternative
lexical_decisions:
- source_word: κλαίοντες
  choice: ndị na-akwa ákwá
  rationale: Nkebi participle a na article na-arụ ọrụ dị ka aha otu ndị; ‘ndị na-akwa ákwá’ bụ okwu Igbo doro anya nke na-echekwa omume na mmetụta dị na okwu Grik ahụ.
- source_word: ὡς μὴ κλαίοντες
  choice: ka ha dị ka ndị na-adịghị akwa ákwá
  rationale: ὡς μή tinyere participle na-egosi otú ha kwesịrị isi bie ndụ n’etiti ahụmahụ a, ọ bụghị na ha anaghị akwa ákwá n’eziokwu. Nhazi a na-echekwa ‘dị ka ... adịghị’ nke a na-emeghachi n’amaokwu ahụ.
- source_word: χαίροντες
  choice: ndị na-aṅụrị ọṅụ
  rationale: ‘Ịṅụrị ọṅụ’ bụ okwu Igbo nkịtị ma dịkwa ugwu maka χαίρω, ma na-emegide ‘ịkwa ákwá’ n'ụzọ doro anya.
- source_word: ὡς μὴ χαίροντες
  choice: ka ha dị ka ndị na-adịghị aṅụrị ọṅụ
  rationale: A tụgharịrị ya n'otu usoro dị ka nkebi bu ya ụzọ iji chekwaa nhata na ụda nkwughachi nke okwu Grik.
- source_word: ἀγοράζοντες
  choice: ndị na-azụ ihe
  rationale: Okwu a na-ezo aka n’ịzụta ihe n’ụzọ sara mbara; ‘ndị na-azụ ihe’ bụ ntụgharị Igbo kachasị mfe ma kwekọọ n’ojiji kwa ụbọchị.
- source_word: κατέχοντες
  choice: ndị nwere ihe ha zụtara n'aka ha
  rationale: κατέχω nwere ike ịpụta ijide, inwe, ma ọ bụ idowe. N’ebe a, n’ihi na e mere ya ihe dị iche n’ịzụ ihe, okwu a na-egosi ile ihe a zụtara anya dị ka ihe mmadụ ji aka ike nwe. ‘N'aka ha’ na-eweta echiche ijidesi ihe ike n’enweghị ikwu na ha enweghị ya n’iwu.
- source_word: καὶ
  choice: ndị ...; ndị ...; ndị ...
  rationale: A haziri njikọ ndị a n’usoro nkebi ndị na-esochi ibe ha, jiri semicolon kewaa ha. Nke a na-echekwa mkpokọta na ụda nkwughachi nke καὶ ugboro atọ n’Igbo na-ada nke ọma.
theological_decisions:
- issue: Ihe ὡς μή a na-emeghachi ugboro ugboro pụtara
  choice: Ọ na-akpọ ndị kwere ekwe ka ha ghara ikwe ka iru újú, ọṅụ, ma ọ bụ ihe ha zụtara jide ndụ ha, ọ bụghị ka ha gọnahụ na ahụmahụ ndị ahụ dị adị.
  alternative: Ịghọta ya dị ka iwu siri ike megide ịkwa ákwá, ịṅụrị ọṅụ, ma ọ bụ ịzụ na inwe ihe.
  rationale: Ọnọdụ okwu gbara amaokwu a gburugburu na-ekwu maka nsogbu dị ugbu a nakwa na ọdịdị ụwa a na-agafe. ὡς μή na participle na-egosi ụzọ ma ọ bụ ọnọdụ obi mmadụ, ọ bụghị ịgọnahụ omume ahụ kpamkpam; ntụgharị ahụ na-ahapụ esemokwu a ka ọ dị n’enweghị itinye ozizi ịjụ ihe niile nke ụwa.
translation_notes:
  register: Asụsụ Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. E chekwara usoro nkebi atọ na nkwughachi nke Grik, ebe e mere ka ὡς μή daa nke ọma n’Igbo. Akara ụdaume na ntụpọ dị mkpa dị na ‘ákwá,’ ‘aṅụrị,’ na ‘ọṅụ’ iji belata mgbagwoju anya.
