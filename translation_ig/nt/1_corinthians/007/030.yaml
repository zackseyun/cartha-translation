  verdict: revise
  source_fidelity: A chọrọ obere mmezi iji mee ka ὡς μὴ + participle daa n’Igbo n’enweghị mgbakwunye echiche ‘ka ha dị,’ nke na-adịghị n’asụsụ Grik. N’akụkụ ikpeazụ, ‘n'aka ha’ na-eme ka κατέχοντες pụta kpọmkwem dịka ijide ihe n’aka, ebe okwu ahụ gụnyekwara inwe ma ọ bụ idowe ihe mmadụ zụtara.
  naturalness: ‘Ndị na-akwa ákwá, dị ka ndị na-adịghị akwa ákwá’ na-ada n’ụzọ dị mkpirikpi, dị n’usoro, ma dabara n’ụda amaokwu ahụ karịa ‘ka ha dị ka ndị…’.
  terminology: ‘Ịkwa ákwá,’ ‘ịṅụrị ọṅụ,’ na ‘ịzụta ihe’ dabara nke ọma. A sụgharịrị κατέχοντες dịka ‘ndị na-enweghị ihe ha zụtara’ n’usoro ntụnyere (‘dị ka’), ka o gosi enweghị ijidesi ihe ahụ ike n’echiche nke inwe ya, n’enweghị itinye nkọwa anụ ahụ ‘n'aka ha.’
  issues:
  - severity: medium
    issue: ‘ka ha dị ka’ na-agbakwunye okwu ‘dị’ n’ụlọ nkebi atọ.
    rationale: Ihe Grik kwuru bụ ὡς μὴ na participle, ya bụ ‘dị ka ndị na-adịghị…’; ọ naghị ekwu ‘ka ha dị ka.’ Mgbakwunye a na-eme ka ahịrịokwu ahụ sie ike ma gbanwee ntakịrị nhazi ya.
  - severity: medium
    issue: ‘ndị na-enweghị ihe ha zụtara n'aka ha’ na-akọwa κατέχοντες n’ụzọ dị warara.
    rationale: ‘N'aka ha’ na-atụ aka n’ijide ihe n’anụ ahụ, ebe κατέχοντες ebe a nwere ike ịpụta inwe, idowe, ma ọ bụ ijidesi ihe mmadụ zụtara ike. E kwesịghị itinye oke ahụ n’ederede.
  - severity: low
    issue: Njikọ mbụ καὶ anaghị apụta n’ederede.
    rationale: Amaokwu Grik malitere na ‘na’; itinye ‘Na’ na-echekwa usoro njikọ a na usoro amaokwu ahụ.
