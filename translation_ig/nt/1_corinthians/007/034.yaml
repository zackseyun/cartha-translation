id: 1CO.7.34
reference: 1 Corinthians 7:34
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸀καὶ μεμέρισται. καὶ ἡ γυνὴ ⸂ἡ ἄγαμος⸃ καὶ ἡ ⸀παρθένος μεριμνᾷ τὰ τοῦ κυρίου, ἵνα ᾖ ἁγία καὶ ⸀τῷ σώματι καὶ ⸁τῷ πνεύματι· ἡ δὲ γαμήσασα μεριμνᾷ τὰ τοῦ κόσμου, πῶς ⸀ἀρέσῃ τῷ ἀνδρί.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/034.yaml
  text: And she is divided. And the unmarried woman[a], that is, the virgin, is concerned about the things of the Lord, so that she may be holy both in body and in spirit. But the married woman is concerned about the things of the world, how she may please her husband.
translation:
  language: ig
  text: E kewara ya. Nwanyị na-alụghị di, ya bụ, nwanyị na-amaghị nwoke[a], na-eche banyere ihe ndị nke Onyenwe anyị, ka o wee dị nsọ ma n’ahụ ma na mmụọ. Ma nwanyị lụrụ di na-eche banyere ihe ndị nke ụwa, otu ọ ga-esi atọ di ya ụtọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Nwanyị na-alụghị di na nwanyị na-amaghị nwoke na-eche banyere ihe ndị nke Onyenwe anyị.” A pụrụ ịgụ okwu Grik ahụ dịka o kwuru maka òtù abụọ, kama ịkọwa na nwanyị na-amaghị nwoke bụ nwanyị ahụ na-alụghị di.
    reason: alternative_reading
lexical_decisions:
- source_word: μεμέρισται
  choice: E kewakwa ya abụọ
  rationale: Na-echekwa ụdị nkwụsị na nsonaazụ nke perfect passive, tinyere echiche nke mmasị kewara abụọ; “-kwa” na-ejikọ ya na echiche amaokwu bu ụzọ.
- source_word: γυνὴ ἡ ἄγαμος
  choice: nwanyị na-alụghị di
  rationale: Nke a bụ okwu Igbo doro anya maka nwanyị na-anọghị n’alụmdi na nwunye, n’ụzọ kwekọrọ na ntụnyere ya na nwanyị lụrụ di.
- source_word: παρθένος
  choice: nwa agbọghọ na-amaghị nwoke
  rationale: Na-egosipụta kpọmkwem na ọ bụ nwanyị na-enwebeghị mmekọahụ, kama iji okwu sara mbara nke pụrụ ịpụta naanị nwa agbọghọ.
- source_word: γυνὴ ἡ ἄγαμος καὶ ἡ παρθένος
  choice: Nwanyị na-alụghị di, ya bụ, nwa agbọghọ na-amaghị nwoke
  rationale: A họọrọ ntụgharị apposition n’isi ederede n’ihi ngwaa otu onye μεριμνᾷ; e debere nghọta nke depụtara ha dịka òtù abụọ n’ala ala peeji.
- source_word: μεριμνᾷ
  choice: na-eche banyere
  rationale: Na-egosi nlekọta na itinye uche n’ihe, na-enweghị ime ka ọ bụrụ nchegbu mmehie.
- source_word: τὰ τοῦ κυρίου
  choice: ihe ndị Onyenwe anyị
  rationale: Na-echekwa nhazi okwu Grik na ntụnyere ya na “ihe ndị nke ụwa.”
- source_word: ἵνα ᾖ ἁγία
  choice: ka o wee dị nsọ
  rationale: Na-egosipụta ebumnuche ma ọ bụ nsonaazụ nke ἵνα tinyere subjunctive, ma na-edobe okwu banyere ịdị nsọ.
- source_word: τῷ σώματι καὶ τῷ πνεύματι
  choice: ma n’ahụ ma na mmụọ
  rationale: Na-egosipụta akụkụ abụọ a kpọrọ aha, n’enweghị ịkọwa karịa ihe ederede kwuru banyere ọdịdị mmadụ.
- source_word: ἡ δὲ γαμήσασα
  choice: nwanyị lụrụ di
  rationale: Ọ bụ ụzọ Igbo dị mfe ma kwekọọ n’ọnọdụ nwanyị nọ n’alụmdi na nwunye.
- source_word: τὰ τοῦ κόσμου
  choice: ihe ndị nke ụwa
  rationale: Na-echekwa ntụnyere ahịrịokwu ya na “ihe ndị Onyenwe anyị,” na-enweghị itinye echiche ọjọọ karịrị nke okwu a chọrọ.
- source_word: πῶς ἀρέσῃ τῷ ἀνδρί
  choice: otu ọ ga-esi mee ihe ga-atọ di ya ụtọ
  rationale: Na-enye echiche Grik ahụ n’Igbo dị ndụ; ἀνήρ pụtara di n’ebe a n’ihi ọnọdụ alụmdi na nwunye.
theological_decisions:
- issue: Ma “nwanyị na-alụghị di” na “nwa agbọghọ na-amaghị nwoke” bụ otu òtù a kọwakwuru, ka hà bụ òtù abụọ dị iche
  choice: 'A tụgharịrị ya dịka nkọwa apposition: “nwanyị na-alụghị di, ya bụ, nwa agbọghọ na-amaghị nwoke.”'
  alternative: “Nwanyị na-alụghị di na nwa agbọghọ na-amaghị nwoke na-eche banyere ihe ndị Onyenwe anyị.”
  rationale: Nhazi Grik dị mkpirikpi ma nwee ike ịnabata nghọta abụọ ahụ. Ngwaa otu onye na-akwado nghọta apposition, ma ebe nghọta coordinated ka kwe omume, e debere ya n’ala ala peeji ka a ghara ihichapụ mgbagwoju anya dị n’isi mmalite.
translation_notes:
  register: Standard Igbo nke oge a, n’asụsụ dị ùgwù ma dị mfe nghọta. E ji “Onyenwe anyị” mee κύριος, ma zere okwu ụka pụrụ iche. A hapụrụ nkebi mmalite “E kewakwa ya abụọ” ka ọ na-aga n’ihu n’echiche amaokwu bu ụzọ, dịka ọ dị na Grik.
