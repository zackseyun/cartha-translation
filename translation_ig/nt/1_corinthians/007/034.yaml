  to: E kewara ya. Nwanyị na-alụghị di, ya bụ, nwanyị na-amaghị nwoke[a], na-eche banyere ihe ndị nke Onyenwe anyị, ka o wee dị nsọ ma n’ahụ ma na mmụọ. Ma nwanyị lụrụ di na-eche banyere ihe ndị nke ụwa, otu ọ ga-esi atọ di ya ụtọ.
  rationale: Ndozigharị ndị a na-ewepụ mgbakwunye “abụọ,” nke na-agafe ihe Grik kwuru, na mgbakwunye afọ dị na “nwa agbọghọ.” Ha na-edobe ntụgharị apposition a họọrọ, ebe ala ala peeji na-edobe nghọta ọzọ nke na-ahụ ụmụ nwanyị abụọ dị iche iche. A gbanwere obere nkebi ikpeazụ naanị maka ịdị nso na Grik na ịdị eke n’Igbo.
