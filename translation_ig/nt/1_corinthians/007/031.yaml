  text: καὶ οἱ χρώμενοι ⸂τὸν κόσμον⸃ ὡς μὴ καταχρώμενοι· παράγει γὰρ τὸ σχῆμα τοῦ κόσμου τούτου.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/031.yaml
  text: and those who use the world as not making full use of it[b][a]; for the present form of this world is passing away.
translation:
  language: ig
  text: ndị na-eji ụwa eme ihe, ka ndị na-adịghị eji ya eme ihe n’uju[a]; n’ihi na ọdịdị nke ụwa a[b] na-agabiga.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ka ndị na-adịghị eji ya eme ihe n’uju”; ngwaa ahụ nwekwara ike ịpụta, “ka ndị na-adịghị emebiga ihe ókè n’iji ya eme ihe.”
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, “mpụta” ma ọ bụ “ụdị” nke ụwa a.
    reason: lexical_alternative
lexical_decisions:
- source_word: χρώμενοι
  choice: na-ejikwa
  rationale: “Iji” na-egosipụta itinye ihe ndị dị n’ụwa n’ọrụ; “na-” na-echekwa ọdịdị participle nke na-aga n’ihu.
- source_word: κόσμον
  choice: ụwa a
  rationale: N’ebe a, κόσμος na-arụtụ aka n’usoro ndụ na ihe onwunwe nke ụwa dị ugbu a; “a” na-adabara τούτου nke dị n’ahịrịokwu na-esote.
- source_word: ὡς μὴ καταχρώμενοι
  choice: ka ndị na-adịghị eji ya eme ihe ruo n’ókè zuru ezu
  rationale: Nke a na-echekwa egwuregwu okwu dị n’etiti χρώμενοι na καταχρώμενοι, tinyere echiche nke iji ihe ruo n’ókè zuru ezu, n’ebughị ụzọ kpebie na ọ pụtara naanị iji ya eme ihe ọjọọ.
- source_word: παράγει
  choice: na-agabiga
  rationale: Oge ugbu a nke ngwaa ahụ na-egosi usoro na-aga n’ihu; “na-agabiga” na-echekwa ma echiche nke ịgafe ma nke ịdịru nwa oge.
- source_word: σχῆμα
  choice: ọdịdị ... dị ugbu a
  rationale: “Ọdịdị” nwere ike ịpụta ụdị ma ọ bụ mpụta ihe; mgbakwunye “dị ugbu a” na-egosi na ọ bụ nhazi ụwa nke oge a, ọ bụghị ihe bụ isi nke okike.
- source_word: τοῦ κόσμου τούτου
  choice: ụwa a
  rationale: A na-echekwa demonstrative τούτου n'ụzọ doro anya site na “a.”
theological_decisions:
- issue: Ihe καταχρώμενοι pụtara n’akụkụ χρώμενοι
  choice: Iji ụwa eme ihe n’etinyeghị onwe onye n’iji ya ruo n’ókè zuru ezu
  alternative: Ịghara iji ụwa eme ihe ọjọọ; ma ọ bụ ibi ka onye na-adịghị eji ya ma ọlị
  rationale: Njikọ χρώμενοι / καταχρώμενοι bụ egwuregwu okwu. Nsụgharị a na-echekwa ọdịiche ahụ na esemokwu dị na ya, ebe ihe odide ala peeji na-egosi echiche ndị ọzọ okwu ahụ nwere ike ibu.
- issue: Ihe σχῆμα pụtara
  choice: Ọdịdị ma ọ bụ nhazi ụwa nke dị ugbu a, nke na-agabiga
  alternative: Naanị mpụta ụwa; ma ọ bụ ihe bụ isi nke ụwa
  rationale: N’ọnọdụ a, okwu ahụ na-arụtụ aka n’ụdị ụwa dị ugbu a nke na-adịru nwa oge, ọ bụghị n’ịsị na okike n’onwe ya dị njọ.
translation_notes:
  register: Igbo Izugbe dị ugbu a, nke dị ùgwù ma dị mfe nghọta. E jidere nhazi participle nke Grik, ma zere okwu ụka pụrụ iche. E debere akara ihe odide ala peeji [a] na [b] n’ahịrịokwu ahụ kpọmkwem.
