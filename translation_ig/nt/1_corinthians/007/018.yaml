id: 1CO.7.18
reference: 1 Corinthians 7:18
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: περιτετμημένος τις ἐκλήθη; μὴ ἐπισπάσθω· ἐν ἀκροβυστίᾳ ⸂κέκληταί τις⸃; μὴ περιτεμνέσθω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/018.yaml
  text: Was anyone called while circumcised? He should not try to reverse it[a]. Was anyone called while uncircumcised? He should not be circumcised.
translation:
  language: ig
  text: Ọ̀ dị onye a kpọrọ mgbe ọ bụ onye e biri ya úgwù? Ya anwala ime ka ọ dị ka onye a na-ebighị úgwù.[a] Ọ̀ dị onye a kpọrọ mgbe ọ bụ onye a na-ebighị úgwù? Ya ekwela ka e bie ya úgwù.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n’ụzọ dabara okwu mbụ nso, “Ya emela ka ọ bụrụ onye a na-ebighị úgwù”—ya bụ, ya anwala izochi ma ọ bụ iwepụ ihe àmà nke ibi úgwù.
    reason: lexical_alternative
lexical_decisions:
- source_word: περιτετμημένος
  choice: mgbe e biri ya úgwù
  rationale: Nke a na-egosi ọnọdụ onye ahụ nọ na ya n’ihi na e birila ya úgwù tupu a kpọọ ya; nsụgharị a dị mfe ma doo anya n’Igbo.
- source_word: ἐκλήθη / κέκληταί
  choice: à kpọrọ
  rationale: A hapụrụ okwu ahụ dịka ‘kpọrọ’ iji chekwaa asụsụ Pọl banyere ọkpụkpọ, kama ịkọwa ya ozugbo dịka nchegharị ma ọ bụ ịghọ Onye Kraịst.
- source_word: ἐπισπάσθω
  choice: ya anwala ime ka ọ dị ka onye a na-ebighị úgwù
  rationale: Okwu Grik ahụ na-ekwu maka ịnwa izochi ma ọ bụ iwepụ ihe àmà nke ibi úgwù. Nsụgharị a na-eme ka omume ahụ doo onye Igbo nke oge a anya, ebe nkọwa nkịtị karị dị n’ala peeji.
- source_word: ἐν ἀκροβυστίᾳ
  choice: mgbe a na-ebighị ya úgwù
  rationale: Nkebiokwu a na-egosi ọnọdụ onye ahụ nọ na ya mgbe a kpọrọ ya; okwu a bụ Igbo nkịtị ma zere nsụgharị siri ike dịka ‘n’ọnọdụ enweghị úgwù.’
- source_word: περιτεμνέσθω
  choice: ya ekwela ka e bie ya úgwù
  rationale: Nke a na-enye iwu mgbochi ahụ n’Igbo doro anya ma gosipụta na onye a na-ekwu maka ya ekwesịghị ịnata ibi úgwù.
theological_decisions:
- issue: Ihe ‘a kpọrọ’ pụtara n’ahịrịokwu abụọ ahụ
  choice: A kpọrọ ya mgbe ọ nọ n’ọnọdụ ahụ, ebe gburugburu okwu na-atụ aka n’ọkpụkpọ Chineke ịbanye na ndụ nke okwukwe
  alternative: Ọkpụkpọ nkịtị nke mmadụ kpọrọ mmadụ
  rationale: N’ebe a Pọl na-ekwu banyere ọnọdụ ndị kwere ekwe nọ na ya mgbe a kpọrọ ha. Ma nsụgharị ahụ anaghị etinye ‘Chineke’ ma ọ bụ ‘ịghọ Onye Kraịst’ n’ahịrịokwu n’onwe ya, ka ọ ghara ịkọwa ihe odide ahụ gabiga ókè.
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ ‘ibi úgwù’ dịka okwu a na-ejikarị ekwu circumcision. Ajụjụ abụọ ahụ na iwu mgbochi abụọ ahụ na-echekwa nhazi yiri ibe ya nke Grik, ebe nkọwa ala peeji na-echekwa ọdịdị nkịtị na mgbagwoju anya nke ἐπισπάσθω.
