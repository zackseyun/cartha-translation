revisions:
- from: À kpọrọ onye ọ bụla mgbe e biri ya úgwù? Ya anwala ime ka ọ dị ka onye a na-ebighị úgwù.[a] À kpọrọ onye ọ bụla mgbe a na-ebighị ya úgwù? Ya ekwela ka e bie ya úgwù.
  to: Ọ̀ dị onye a kpọrọ mgbe ọ bụ onye e biri ya úgwù? Ya anwala ime ka ọ dị ka onye a na-ebighị úgwù.[a] Ọ̀ dị onye a kpọrọ mgbe ọ bụ onye a na-ebighị úgwù? Ya ekwela ka e bie ya úgwù.
  rationale: The revision makes explicit that both clauses concern a person’s state when called, reflecting the Greek perfect participles and the parallel contrast between circumcision and uncircumcision. It leaves the directive force, ambiguity of “called,” and the footnote anchor intact.
  reviewer_model: gpt-5.6-terra
