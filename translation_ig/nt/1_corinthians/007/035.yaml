revisions:
- from: Ana m ekwu nke a maka ọdịmma unu onwe unu, ọ bụghị ka m tụkwasị unu eriri ọnyà n’olu, kama ka unu na-eme ihe kwesịrị ekwesị, jirikwa obi na-enweghị ihe ndọpụ nọgide na-efe Onyenwe anyị.
  to: Ana m ekwu nke a maka ọdịmma unu onwe unu, ọ bụghị ka m tụkwasị unu eriri ọnyà n’olu, kama maka ihe kwesịrị ekwesị na nraranye n’ife Onyenwe anyị n’enweghị ndọpụ uche.
  rationale: 'The revision retains the concrete noose image and the benefit-oriented framing, while restoring the source’s paired concepts: propriety and undistracted devoted service to the Lord. It avoids adding an explicit command or continuative nuance and uses idiomatic Standard Igbo for undistracted attention.'
