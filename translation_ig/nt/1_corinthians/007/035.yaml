id: 1CO.7.35
reference: 1 Corinthians 7:35
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τοῦτο δὲ πρὸς τὸ ὑμῶν αὐτῶν ⸀σύμφορον λέγω, οὐχ ἵνα βρόχον ὑμῖν ἐπιβάλω, ἀλλὰ πρὸς τὸ εὔσχημον καὶ ⸀εὐπάρεδρον τῷ κυρίῳ ἀπερισπάστως.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/035.yaml
  text: I say this for your own benefit, not to put a noose on you, but for what is proper and for undistracted devotion to the Lord.
translation:
  language: ig
  text: Ana m ekwu nke a maka ọdịmma unu onwe unu, ọ bụghị ka m tụkwasị unu eriri ọnyà n’olu, kama maka ihe kwesịrị ekwesị na nraranye n’ife Onyenwe anyị n’enweghị ndọpụ uche.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σύμφορον
  choice: ọdịmma
  rationale: Ọ pụtara ihe bara mmadụ uru ma ọ bụ ihe ga-adị ya mma; “ọdịmma unu onwe unu” na-egosipụta nke a n’Igbo dị mfe ma doo anya.
- source_word: βρόχον
  choice: eriri ọnyà n’olu
  rationale: Okwu Grik a na-ezo aka n’eriri e ji ama mmadụ ma ọ bụ anụmanụ n’olu. E debere ihe atụ ahụ kama ịtụgharị ya naanị dị ka mmachi.
- source_word: εὔσχημον
  choice: ihe kwesịrị ekwesị
  rationale: N’ebe a, ọ na-egosi omume dị mma, kwụ ọtọ, ma dabara adaba; ntụgharị a anaghị eme ka ihe ọ pụtara dị warara karịa isi mmalite.
- source_word: εὐπάρεδρον
  choice: ịnọgide na-efe
  rationale: Okwu a na-enye echiche nke ịnọ nso na ịdị njikere mgbe niile n’ọrụ Onyenwe anyị; “ịnọgide na-efe” na-ekwupụta echiche ahụ n’Igbo nkịtị.
- source_word: ἀπερισπάστως
  choice: jiri obi na-enweghị ihe ndọpụ
  rationale: Ọ pụtara ime ihe n’enweghị ihe na-adọpụ uche; “obi” n’ebe a na-ekpuchi uche na ntinye onwe onye n’ụzọ Igbo si ekwu ya.
theological_decisions:
- issue: Ma Pọl na-amanye alụghị di ma ọ bụ nwunye dịka iwu
  choice: E gosiri na ndụmọdụ ya bụ maka ọdịmma ha, ọ bụghị ịtụkwasị ha eriri ọnyà n’olu.
  alternative: Ịsụgharị βρόχος naanị dịka “mmachi” ma ọ bụ “iwu.”
  rationale: Nke a na-edobe ihe atụ siri ike dị n’asụsụ Grik ma na-egosikwa na ebumnuche Pọl abụghị ịmanye ha n’iwu.
- issue: Ụdị njikọ onye kwere ekwe na Onyenwe anyị
  choice: “ịnọgide na-efe Onyenwe anyị”
  alternative: “ịnọ ọdụ n’akụkụ Onyenwe anyị”
  rationale: Nhọrọ ahụ na-eburu echiche nke ntinye onwe onye na-aga n’ihu, ma ọ naghị akpọpụta ozizi pụrụ iche ma ọ bụ mee ka okwu ahụ bụrụ naanị ọnọdụ anụ ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ debere ihe atụ “eriri ọnyà n’olu,” ma jiri usoro okwu eke kọwaa ofufe na-enweghị ndọpụ uche.
