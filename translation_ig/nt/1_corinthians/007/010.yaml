source:
  edition: SBLGNT
  text: Τοῖς δὲ γεγαμηκόσιν παραγγέλλω, οὐκ ἐγὼ ἀλλὰ ὁ κύριος, γυναῖκα ἀπὸ ἀνδρὸς μὴ χωρισθῆναι—
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/010.yaml
  text: 'To the married I give this command—not I[a], but the Lord: a wife must not separate from her husband—'
translation:
  language: ig
  text: 'Ma ndị lụrụ di na nwunye ka m na-enye iwu a—ọ bụghị m[a], kama ọ bụ Onyenwe anyị: ka nwunye ghara ikewapụ onwe ya n’ebe di ya nọ—'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ịgba di ya alụkwaghịm.” Okwu Grik a nwere ike ịpụta ikewapụ n’alụmdi na nwunye, nke n’ọnọdụ a nwekwara ike ịgụnye ịgba alụkwaghịm.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῖς δὲ γεγαμηκόσιν
  choice: Ma ndị lụrụ di na nwunye
  rationale: Akụkụ a na-ezo aka n’ụmụ mmadụ nọ n’ọnọdụ alụmdi na nwunye. “Ndị lụrụ di na nwunye” bụ Igbo doro anya ma kwekọọ n’ụdị onye e nyere iwu; “Ma” na-eburu njikọ mgbanwe nke δέ n’enweghị itinye okwu oge na-adịghị na Grik.
- source_word: παραγγέλλω
  choice: ka m na-enye iwu a
  rationale: Ọ na-egosipụta ntụziaka nwere ikike; okwu a bụ nke e ji eme ihe n’Igbo ugbu a ma na-edobe ike nke iwu ahụ.
- source_word: οὐκ ἐγὼ ἀλλὰ ὁ κύριος
  choice: ọ bụghị m, kama ọ bụ Onyenwe anyị
  rationale: Nke a na-edobe ntụnyere siri ike dị n’etiti “m” na “Onyenwe anyị” n’enweghị ịkọwa ihe ọ pụtara karịa ihe ederede kwuru.
- source_word: ὁ κύριος
  choice: Onyenwe anyị
  rationale: Nke a bụ aha Igbo a na-ejikarị asụgharị κύριος n’ebe ọ na-ezo aka n’Onyenwe anyị Jizọs.
- source_word: γυναῖκα
  choice: nwunye
  rationale: Ọnọdụ alụmdi na nwunye na njikọ ya na ἀνήρ na-egosi na ihe ọ pụtara ebe a bụ “nwunye,” ọ bụghị naanị “anyị nwanyị.”
- source_word: ἀπὸ ἀνδρὸς
  choice: di ya
  rationale: N’ọnọdụ a ἀνήρ pụtara di; “ya” na-eme ka mmekọrịta ahụ doo anya n’Igbo.
- source_word: μὴ χωρισθῆναι
  choice: ekwesịghị ịhapụ
  rationale: “Ịhapụ” nwere ike igosi ikewapụ onwe onye n’alụmdi na nwunye ma ghara imechi okwu ahụ naanị n’ịgba alụkwaghịm n’usoro iwu. “Ekwesịghị” na-eburu ike nke iwu ahụ n’Igbo eke.
theological_decisions:
- issue: Ihe “ọ bụghị m, kama ọ bụ Onyenwe anyị” pụtara
  choice: E debere ntụnyere ahụ kpọmkwem n’ederede, na-egosi na iwu a sitere n’ozizi Onyenwe anyị.
  alternative: Ịkọwa ya dị ka Pọl na-ekwu na okwu nke ya enweghị ikike.
  rationale: Ederede ahụ na-atụnyere iwu Onyenwe anyị na ntụziaka Pọl ga-enye banyere ọnọdụ ndị ọzọ; nsụgharị ahụ ekwesịghị ịgbakwunye na Pọl na-ajụ ikike ozi ya.
- issue: Oke ihe χωρισθῆναι pụtara n’alụmdi na nwunye
  choice: ịhapụ
  alternative: ịgba di ya alụkwaghịm
  rationale: Nhọrọ a na-edobe obosara okwu Grik ahụ, nke nwere ike ịgụnye ikewapụ n’alụmdi na nwunye ma ọ bụ ịgba alụkwaghịm, kama ime ka ọ bụrụ naanị usoro iwu nke ịgba alụkwaghịm.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke dị ugbu a, kwanyere ugwu, ma dị mfe nghọta. Ahịrị ogologo ngwụcha na-egosi na echiche ahụ gara n’ihu n’amaokwu na-esote.
