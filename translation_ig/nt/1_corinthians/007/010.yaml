review_pass:
  verdict: revise
  source_fidelity: The draft correctly identifies the addressees as married people, retains the contrast “not I, but the Lord,” and keeps the continuing dash. However, “ịhapụ di ya” can naturally suggest abandoning/leaving her husband and is broader and more unilateral than χωρισθῆναι, whose marital sense is separation. A reflexive separation expression better preserves the Greek wording and its ambiguity concerning divorce.
  naturalness: “Ndị lụrụ di na nwunye” and “Onyenwe anyị” are natural Standard Igbo in this register. “Ka nwunye ghara ikewapụ onwe ya n’ebe di ya nọ” is clear, formal, and idiomatic enough for a biblical instruction. The initial “Ma” acceptably carries the mild discourse transition of δέ.
  terminology: “Onyenwe anyị” appropriately renders ὁ κύριος in this context. “Ikewapụ onwe ya” preserves the marital-separation terminology without reducing it to legal divorce; the footnote properly supplies “ịgba di ya alụkwaghịm” as an alternative contextual sense.
  issues:
  - severity: medium
    issue: The main text uses “ịhapụ di ya” for μὴ χωρισθῆναι.
    rationale: Although it can be understood in a marital context, “ịhapụ” may imply abandonment or simply leaving. “Ikewapụ onwe ya n’ebe di ya nọ” more directly represents marital separation while leaving open whether divorce is included.
  revised_text: 'Ma ndị lụrụ di na nwunye ka m na-enye iwu a—ọ bụghị m[a], kama ọ bụ Onyenwe anyị: ka nwunye ghara ikewapụ onwe ya n’ebe di ya nọ—'
