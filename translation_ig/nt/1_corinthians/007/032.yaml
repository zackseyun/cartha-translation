language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Θέλω δὲ ὑμᾶς ἀμερίμνους εἶναι. ὁ ἄγαμος μεριμνᾷ τὰ τοῦ κυρίου, πῶς ⸀ἀρέσῃ τῷ κυρίῳ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/032.yaml
  text: But I want you to be free from anxieties. The unmarried man is concerned with the things of the Lord[a], how he may please the Lord;
translation:
  language: ig
  text: Ma achọrọ m ka unu ghara inwe nchegbu. Nwoke na-alụbeghị nwaanyị na-eche banyere ihe banyere Onyenwe anyị[a], otú ọ ga-esi atọ Onyenwe anyị ụtọ;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “Onye na-alụbeghị di ma ọ bụ nwunye.” Okwu Grik ahụ dị n’ụdị nwoke, n’otu ọgụgụ (“nwoke na-alụbeghị nwaanyị”), ọ bụ ezie na n’amaokwu ndị gbara ya gburugburu, Pọl na-atụle ọnọdụ ndị na-alụbeghị na ndị lụrụ di ma ọ bụ nwunye n’ụzọ sara mbara.
    reason: lexical_alternative
lexical_decisions:
- source_word: Θέλω δὲ
  choice: Ma achọrọ m
  rationale: θέλω na-egosi ọchịchọ, ebe δέ na-egosi obere ntụgharị ma ọ bụ ọdịiche n'ihe e kwuru tupu ya; “Ma achọrọ m” bụ Igbo nkịtị nke na-echekwa ha abụọ.
- source_word: ὑμᾶς ἀμερίμνους εἶναι
  choice: ka unu nwere onwe unu pụọ ná nchegbu
  rationale: ἀμέριμνος pụtara ịnọ n'enweghị nchegbu ma ọ bụ ibu echiche na-enye nsogbu. Nkebiokwu a na-egosi nnwere onwe pụọ ná nchegbu, ọ bụghị enweghị mmasị n'ihe niile.
- source_word: ὁ ἄγαμος
  choice: Nwoke na-alụbeghị nwaanyị
  rationale: Ụdị Grik a bụ otu onye nke nwoke. Nsụgharị a na-echekwa okike na ọnụọgụ dị na isi mmalite, ebe ihe e dere gburugburu amaokwu a na-atụlekwa ọnọdụ ụmụ nwoke na ụmụ nwaanyị iche iche.
- source_word: μεριμνᾷ
  choice: na-eche banyere
  rationale: μεριμνάω nwere ike ịpụta inwe nchegbu ma ọ bụ itinye uche n'ihe. N'ebe a, “na-eche banyere” na-egosi nlekọta na mmasị n'ihe Onyenwe anyị n'enweghị ịkpọ ya nchegbu ọjọọ.
- source_word: τὰ τοῦ κυρίου
  choice: ihe ndị dịịrị Onyenwe anyị
  rationale: Akpaalaokwu Grik a sara mbara, na-ezo aka n'ihe metụtara Onyenwe anyị ma ọ bụ ihe bụ nke ya. “Ihe ndị dịịrị Onyenwe anyị” na-echekwa obosara ahụ.
- source_word: κυρίου / κυρίῳ
  choice: Onyenwe anyị
  rationale: κύριος bụ aha nsọpụrụ e ji akpọ Kraịst n'ọnọdụ a. “Onyenwe anyị” bụ ụzọ doro anya, dị ùgwù, ma bụrụkwa nke ndị Igbo na-aghọta nke ọma.
- source_word: πῶς ἀρέσῃ τῷ κυρίῳ
  choice: ka ọ ga-esi mee ihe ga-atọ Onyenwe anyị ụtọ
  rationale: πῶς na-egosi ụzọ ma ọ bụ etu ihe ga-esi mee, ebe ἀρέσῃ na-egosi ime ihe dị onye ọzọ mma. Nsụgharị a bụ Igbo eke ma na-echekwa nzube a na-atụ anya ya.
theological_decisions:
- issue: Ntụaka otu onye nke nwoke n'ọdịiche Pọl na-eme n'etiti ndị na-alụbeghị na ndị lụrụ di ma ọ bụ nwunye
  choice: 'Idowe otu onye nke nwoke n''ahịrị bụ isi: “Nwoke na-alụbeghị nwaanyị”'
  alternative: “Onye na-alụbeghị di ma ọ bụ nwunye”
  rationale: ὁ ἄγαμος bụ ụdị otu onye nke nwoke, akụkụ amaokwu ndị sochirinụ na-ekwukwa banyere nwoke na nwaanyị n'ụzọ dị iche. Ya mere, e debere ụdị nwoke ahụ n'ahịrị bụ isi, ma kọwaa na ndetu ala na ntụle gbara ya gburugburu sara mbara karịa nwoke naanị.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe nghọta ma dịkwa ùgwù. A hapụrụ ntụgharị okwu “nchegbu” na “na-eche banyere” ka njikọ echiche nke ἀμέριμνος na μεριμνάω pụta ìhè n'enweghị ime ka nlekọta banyere ihe Onyenwe anyị yie nchegbu ọjọọ.
