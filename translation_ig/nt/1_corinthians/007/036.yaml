id: 1CO.7.36
reference: 1 Corinthians 7:36
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Εἰ δέ τις ἀσχημονεῖν ἐπὶ τὴν παρθένον αὐτοῦ νομίζει ἐὰν ᾖ ὑπέρακμος, καὶ οὕτως ὀφείλει γίνεσθαι, ὃ θέλει ποιείτω· οὐχ ἁμαρτάνει· γαμείτωσαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/036.yaml
  text: But if anyone thinks he is behaving improperly toward his virgin[a], if she is past her youth and it ought to be so, let him do what he wants; he is not sinning. Let them marry.
translation:
  language: ig
  text: Ma ọ bụrụ na onye ọ bụla echee na ọ na-akpa àgwà na-adịghị mma n’ebe nwa agbọghọ ya na-amaghị nwoke[a] nọ, ọ bụrụ na oge ntorobịa ya agafewo, ma ọ dị mkpa ka ọ dị otú ahụ, ya mee ihe ọ chọrọ; ọ naghị eme mmehie. Ka ha lụọ di na nwunye.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “nwa agbọghọ o kwere nkwa ịlụ nke na-amaghị nwoke”; a na-aghọtakwa ya kemgbe dị ka “nwa ya nwaanyị na-amaghị nwoke.” Okwu Grik ahụ nwere ike ịpụta nke ọ bụla n’ime ha.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀσχημονεῖν
  choice: na-akpaso ... omume na-ekwesịghị ekwesị
  rationale: Nke a na-egosi omume na-adịghị mma ma ọ bụ na-ekwesịghị ekwesị n’ebe onye ọzọ nọ, n’enweghị ime ka okwu Grik ahụ sie ike karịa ka ọ dị.
- source_word: ἐπὶ τὴν παρθένον αὐτοῦ
  choice: nwaanyị ya na-amaghị nwoke
  rationale: “Nwaanyị ... na-amaghị nwoke” na-egosipụta παρθένος, ebe “ya” na-edobe mgbagwoju anya dị n’okwu Grik banyere ma ọ̀ bụ onye ọ chọrọ ịlụ ka ọ̀ bụ nwa ya nwaanyị nọ n’okpuru nlekọta ya.
- source_word: ὑπέρακμος
  choice: oge ntorobịa ya agafewo
  rationale: Nhọrọ a na-egosi na ọ gafewo oge ntozu ma ọ bụ oge ntorobịa ya kacha maa mma, ma ọ naghị etinye afọ a kapịrị ọnụ n’ihe odide ahụ.
- source_word: καὶ οὕτως ὀφείλει γίνεσθαι
  choice: ma ọ dịkwa mkpa ka ọ dị otú ahụ
  rationale: Ọ na-edobe echiche nke mkpa ma ọ bụ ibu ọrụ dị na ὀφείλει, nakwa izugbe nke γίνεσθαι, n’akọwaghị kpọmkwem ihe kpatara ọnọdụ ahụ.
- source_word: ὃ θέλει ποιείτω
  choice: ya mee ihe ọ chọrọ
  rationale: Nke a bụ iwu na-enye ohere, e kwupụtara ya n’Igbo doro anya ma dị nkenke.
- source_word: οὐχ ἁμαρτάνει
  choice: ọ naghị eme mmehie
  rationale: Ọ na-egosipụta n'ụzọ nkịtị na omume ahụ abụghị mmehie.
- source_word: γαμείτωσαν
  choice: Ka ha lụọ di na nwunye
  rationale: Ọ na-edobe iwu nke onye nke atọ n’ọnụọgụ ọtụtụ ma na-egosi na mmadụ abụọ ahụ ga-abanye n’alụmdi na nwunye.
theological_decisions:
- issue: Onye “nwaanyị ya na-amaghị nwoke” (παρθένον αὐτοῦ) bụ
  choice: E debere mgbagwoju anya ahụ n’isi okwu site n’iji “nwaanyị ya na-amaghị nwoke.”
  alternative: A pụrụ ịghọta ya dị ka nwaanyị ya kwere nkwa ịlụ, ma ọ bụ nwa ya nwaanyị na-amaghị nwoke nọ n’okpuru nlekọta ya.
  rationale: Okwu Grik anaghị ekpebi n’ụzọ doro anya ụdị mmekọrịta ahụ. Ya mere, nsụgharị ahụ anaghị ahọrọ otu nkọwa ma jụ nke ọzọ; nkọwa ala peeji na-edepụta isi ụzọ abụọ e si aghọta ya.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-edobe izugbe na mgbagwoju anya nke Grik, karịsịa n’ihe gbasara ụdị mmekọrịta nwoke ahụ na nwaanyị ahụ.
