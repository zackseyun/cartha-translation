revisions:
- from: Ma ọ bụrụ na onye ọ bụla echee na ọ na-akpaso nwaanyị ya na-amaghị nwoke[a] omume na-ekwesịghị ekwesị, ọ bụrụ na oge ntorobịa ya agafewo, ma ọ dịkwa mkpa ka ọ dị otú ahụ, ya mee ihe ọ chọrọ; ọ naghị eme mmehie. Ka ha lụọ di na nwunye.
  to: Ma ọ bụrụ na onye ọ bụla echee na ọ na-akpa àgwà na-adịghị mma n’ebe nwa agbọghọ ya na-amaghị nwoke[a] nọ, ọ bụrụ na oge ntorobịa ya agafewo, ma ọ dị mkpa ka ọ dị otú ahụ, ya mee ihe ọ chọrọ; ọ naghị eme mmehie. Ka ha lụọ di na nwunye.
  rationale: The revision replaces a phrase that normally identifies the woman as the man’s wife with “nwa agbọghọ ya na-amaghị nwoke,” which better preserves the referential ambiguity of παρθένον αὐτοῦ. It also uses a more natural Igbo expression for improper conduct. The age, necessity, permission, absence of sin, and command for the two to marry remain unchanged in meaning.
