review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents the conditional structure, the necessity expressed by ὀφείλει, the moral permission of οὐχ ἁμαρτάνει, and the plural imperative γαμείτωσαν. However, “nwaanyị ya” normally means “his wife” in Standard Igbo. This introduces a relationship not specified by the Greek and substantially weakens the deliberate ambiguity of παρθένον αὐτοῦ.
  naturalness: Most of the verse is clear and suitably formal. Recasting the first clause with “na-akpa àgwà ... n’ebe ... nọ” is more idiomatic than “na-akpaso ... omume.”
  terminology: “Nwa agbọghọ ya na-amaghị nwoke” represents παρθένον while avoiding the usual wife-sense of “nwaanyị ya.” It retains, as far as Standard Igbo permits, the unresolved relationship signaled in the Greek. “Oge ntorobịa ya agafewo” appropriately conveys being beyond youth without assigning a specific age or cause for the necessity.
  issues:
  - severity: high
    issue: “nwaanyị ya na-amaghị nwoke” can naturally be understood as “his virgin wife.”
    rationale: The source does not identify the woman as his wife; it remains ambiguous between a betrothed woman and a virgin daughter/ward. The present wording therefore adds a specific relationship and fails to preserve the source ambiguity.
  - severity: low
    issue: “na-akpaso ... omume na-ekwesịghị ekwesị” is awkward Standard Igbo collocation.
    rationale: “Na-akpa àgwà na-adịghị mma n’ebe ... nọ” more naturally expresses behaving improperly toward someone, without increasing the strength of ἀσχημονεῖν.
  revised_text: Ma ọ bụrụ na onye ọ bụla echee na ọ na-akpa àgwà na-adịghị mma n’ebe nwa agbọghọ ya na-amaghị nwoke[a] nọ, ọ bụrụ na oge ntorobịa ya agafewo, ma ọ dị mkpa ka ọ dị otú ahụ, ya mee ihe ọ chọrọ; ọ naghị eme mmehie. Ka ha lụọ di na nwunye.
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “nwa agbọghọ o kwere nkwa ịlụ nke na-amaghị nwoke”; a na-aghọtakwa ya kemgbe dị ka “nwa ya nwaanyị na-amaghị nwoke.” Okwu Grik ahụ nwere ike ịpụta nke ọ bụla n’ime ha.
    reason: alternative_reading
  revision_rationale: The revision replaces a phrase that normally identifies the woman as the man’s wife with “nwa agbọghọ ya na-amaghị nwoke,” which better preserves the referential ambiguity of παρθένον αὐτοῦ. It also uses a more natural Igbo expression for improper conduct. The age, necessity, permission, absence of sin, and command for the two to marry remain unchanged in meaning.
