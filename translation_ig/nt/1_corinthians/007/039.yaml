revisions:
- from: Nwunye nọ n’okpuru nkekọ ruo oge di ya dị ndụ; ma ọ bụrụ na di ya alakpuo ụra[a], o nweere onwe ya ịlụ onye ọ chọrọ, naanị n’ime Onyenwe anyị.[b]
  to: Nwunye ejikọtara n’alụmdi na nwunye ruo mgbe di ya dị ndụ; ma ọ bụrụ na di ya alakpuo ụra[a], o nweere onwe ya ịlụ onye ọ chọrọ, naanị n’ime Onyenwe anyị[b].
  rationale: The revision replaces a less natural calque for the marital bond with idiomatic Standard Igbo, improves the temporal wording, and attaches footnote b directly to the phrase it explains. It retains “alakpuo ụra” to reflect κοιμηθῇ and leaves “n’ime Onyenwe anyị” untranslated beyond its literal Igbo equivalent, preserving the source’s interpretive openness.
