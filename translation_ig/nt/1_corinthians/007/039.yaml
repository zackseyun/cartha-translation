reference: 1 Corinthians 7:39
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Γυνὴ ⸀δέδεται ἐφ’ ὅσον χρόνον ζῇ ὁ ἀνὴρ αὐτῆς· ἐὰν ⸀δὲ κοιμηθῇ ὁ ἀνήρ, ἐλευθέρα ἐστὶν ᾧ θέλει γαμηθῆναι, μόνον ἐν κυρίῳ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/039.yaml
  text: A wife is bound for as long as her husband lives[a]; but if her husband dies, she is free to be married to whom she wishes[b], only in the Lord.
translation:
  language: ig
  text: Nwunye ejikọtara n’alụmdi na nwunye ruo mgbe di ya dị ndụ; ma ọ bụrụ na di ya alakpuo ụra[a], o nweere onwe ya ịlụ onye ọ chọrọ, naanị n’ime Onyenwe anyị[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ya bụ, “ọ nwụọ.” Okwu Grik ji “ịlakpu ụra” mee ihe dị ka okwu nro a na-ejikarị ekwu ọnwụ.
    reason: lexical_alternative
  - marker: b
    text: A na-aghọtakarị “naanị n’ime Onyenwe anyị” dị ka naanị ịlụ onye bụ nke Onyenwe anyị, ya bụ, onye kwere ekwe ibe ya. O nwekwara ike imesi ike na alụmdi ahụ ga-adị n’okpuru nrubeisi nye Onyenwe anyị.
    reason: alternative_reading
lexical_decisions:
- source_word: Γυνή
  choice: Nwunye
  rationale: N’ọnọdụ a, okwu ahụ na-ekwu maka nwanyị n’ime mmekọrịta alụmdi na nwunye, ya mere “nwunye” dabara karịa “nwanyị.”
- source_word: δέδεται
  choice: nọ n’okpuru nkekọ
  rationale: Nke a na-egosi ọnọdụ nkekọ na-adịgide adịgide, ma na-echekwa echiche iwu na mmekọrịta dị n’okwu Grik n’ụzọ Igbo na-aghọta nke ọma.
- source_word: ἐφ’ ὅσον χρόνον ζῇ ὁ ἀνὴρ αὐτῆς
  choice: ruo oge di ya dị ndụ
  rationale: Nke a na-enye echiche oge nke akpaalaokwu Grik n’ụzọ dị mkpirikpi ma bụrụkwa Igbo ebumpụta ụwa.
- source_word: κοιμηθῇ
  choice: alakpuo ụra
  rationale: E chekwara ihe atụ Grik nke ihi ụra dị ka okwu nro maka ọnwụ; nkọwa ala peeji na-eme ka ihe ọ pụtara doo anya.
- source_word: ἐλευθέρα ἐστίν
  choice: o nweere onwe ya
  rationale: Nkebiokwu a na-egosi na a tọhapụrụ ya ná nkekọ alụmdi na nwunye mbụ.
- source_word: ᾧ θέλει γαμηθῆναι
  choice: ịlụ onye ọ chọrọ
  rationale: Nke a bụ ụzọ Igbo dị mma isi kwuo na o nwere nnwere onwe ịhọrọ onye ọ ga-alụ ọzọ, na-enweghị itinye nkọwa ọzọ na-adịghị n’isi mmalite.
- source_word: μόνον ἐν κυρίῳ
  choice: naanị n’ime Onyenwe anyị
  rationale: Nsụgharị a na-echekwa okwu Pọl dị mkpirikpi na ike mmachi nke “naanị,” n’agbanyeghị na nkebiokwu ahụ nwere ike ịgụnye karịa otu akụkụ nghọta.
theological_decisions:
- issue: Ihe “n’ime Onyenwe anyị” pụtara n’iwu banyere ịlụ di ọzọ
  choice: naanị n’ime Onyenwe anyị
  alternative: naanị onye kwere ekwe ibe ya; ma ọ bụ naanị n’ụzọ kwekọrọ na nrubeisi nye Onyenwe anyị
  rationale: Okwu Grik dị mkpirikpi ma nwee ibu mmụta okpukpe. Idebe ya otú ahụ na-echekwa mgbagwoju anya ya ma zere ime ka otu nkọwa a na-ahụkarị bụrụ naanị ihe o nwere ike ịpụta.
- issue: Okwu nro e ji kwuo ọnwụ
  choice: alakpuo ụra
  alternative: anwụọ
  rationale: Pọl ji okwu nke pụtara ịlakpu ụra mee ihe kama iji okwu ọnwụ kpọmkwem. E chekwara ihe atụ ahụ n’ahịrịokwu, ebe nkọwa ala peeji na-enye ihe ọ pụtara n’ụzọ doro anya.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E debere “Onyenwe anyị” maka κύριος, ma chekwaa ma ihe atụ nke ihi ụra maka ọnwụ ma okwu Pọl a chịkọtara ọnụ, “n’ime Onyenwe anyị.”
