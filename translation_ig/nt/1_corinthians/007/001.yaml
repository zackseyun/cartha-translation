  revision_rationale: A tiny syntactic revision clarifies that Paul is addressing matters about which the Corinthians had written. The literal-but-idiomatic ambiguity of γυναικὸς μὴ ἅπτεσθαι remains in the main text, and the footnote retains the likely sexual sense without making it the only possible reading.
