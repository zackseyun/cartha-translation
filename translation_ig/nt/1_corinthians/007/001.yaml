review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders Περὶ δὲ ὧν ἐγράψατε, καλὸν ἀνθρώπῳ γυναικὸς μὴ ἅπτεσθαι. However, in Standard Igbo the plural antecedent is more explicit and natural as “ihe ndị unu dere banyere ha,” rather than wording that can sound like the Corinthians merely wrote the matters themselves. The literal wording for ἅπτεσθαι is appropriately retained, with the sexual idiom explained in a note.
  naturalness: “Banyere ihe ndị unu dere” is understandable, but “Banyere ihe ndị unu dere banyere ha” better reflects the intended relationship and is idiomatic modern Standard Igbo. The rest of the sentence is concise, clear, and suitably formal.
  terminology: “Ọ dị mma,” “nwoke,” “nwanyị,” and “imetụ nwanyị aka” are appropriate. The footnote correctly identifies the likely sexual idiom while preserving the Greek expression’s surface wording in the main text.
  issues:
  - severity: low
    issue: The phrasing “ihe ndị unu dere” is slightly underspecified in Igbo.
    rationale: ὧν ἐγράψατε means “the things concerning which you wrote,” not simply “the things that you wrote.” Adding “banyere ha” makes that relation explicit without adding meaning.
  revised_text: 'Banyere ihe ndị unu dere banyere ha: ọ dị mma ka nwoke ghara imetụ nwanyị aka.[a]'
  revised_footnotes:
