  text: Περὶ δὲ ὧν ⸀ἐγράψατε, καλὸν ἀνθρώπῳ γυναικὸς μὴ ἅπτεσθαι·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/001.yaml
  text: 'Concerning the matters you wrote about: it is good for a man not to touch a woman.[a]'
translation:
  language: ig
  text: 'Banyere ihe ndị unu dere banyere ha: ọ dị mma ka nwoke ghara imetụ nwanyị aka.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Imetụ nwanyị aka” nwere ike ịbụ akpaalaokwu na-ekwu banyere iso nwanyị nwee mmekọahụ.
    reason: Iji kọwaa nghọta akpaalaokwu nke okwu Grik ahụ ma ghara iwepụ ụdị okwu nkịtị ya n’ahịrịokwu bụ isi.
lexical_decisions:
- source_word: Περὶ δὲ ὧν ἐγράψατε
  choice: Banyere ihe ndị unu dere
  rationale: Nke a na-egosipụta mgbanwe isiokwu nke δέ na ihe ndị Kọrịnt dere, n’enweghị itinye okwu oge dịka “ugbu a” nke na-adịghị n’isi mmalite ahụ.
- source_word: καλὸν
  choice: ọ dị mma
  rationale: Ọ bụ ntụgharị Igbo doro anya ma bụrụkwa nke nkịtị maka okwu a na-egosi ihe dị mma ma ọ bụ ihe kwesịrị ekwesị, n’enweghị ịkọwapụta ụdị ịdị mma ahụ karịa ihe Grik kwuru.
- source_word: ἀνθρώπῳ
  choice: ka nwoke
  rationale: Ọ bụ ezie na ἄνθρωπος nwere ike ịpụta mmadụ n’ozuzu, njikọ ya na γυναικός ebe a na-egosi nwoke n’ụzọ doro anya.
- source_word: γυναικὸς μὴ ἅπτεσθαι
  choice: ghara imetụ nwanyị aka
  rationale: Nke a na-edobe oyiyi okwu Grik n’ahịrịokwu bụ isi, ebe ndetu ala na-akọwa na ọ pụrụ ịbụ akpaalaokwu gbasara mmekọahụ.
theological_decisions:
- issue: Ma okwu ahụ ọ na-ekwu nanị banyere mmetụ aka nkịtị ka ọ bụ mmekọahụ
  choice: E debere “imetụ nwanyị aka” n’ahịrịokwu bụ isi ma kọwaa nghọta mmekọahụ na ndetu ala.
  alternative: “ghara iso nwanyị nwee mmekọahụ”
  rationale: ἅπτεσθαι γυναικός nwere ike ịbụ akpaalaokwu maka mmekọahụ, ma ntụgharị nkịtị na-echekwa ụdị okwu na ntakịrị nghọta abụọ dị n’isi mmalite kama imechi ya kpamkpam.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị mfe ma dị ùgwù. A họọrọ “unu” n’ihi na ndị natara akwụkwọ ozi ahụ bụ ọtụtụ mmadụ. Ahịrịokwu ahụ dị mkpirikpi dịka nke Grik ma na-echekwa esemokwu dị n’etiti okwu nkịtị na nghọta akpaalaokwu.
