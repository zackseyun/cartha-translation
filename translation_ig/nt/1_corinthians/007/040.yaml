  to: Ma ọ ga-enwe obi ụtọ karịa ma ọ bụrụ na ọ nọgide otú ahụ[a], dị ka uche m si dị—echere m na mụ kwa nwere Mmụọ Chineke.
  rationale: A small revision removes reflexive emphasis not required by κἀγώ while retaining its additive sense. All other wording, including the conditional comparison, the open reference of 'otú ahụ,' and the lexical-alternative footnote, is retained.
