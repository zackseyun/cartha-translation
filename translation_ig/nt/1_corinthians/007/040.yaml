id: 1CO.7.40
reference: 1 Corinthians 7:40
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: μακαριωτέρα δέ ἐστιν ἐὰν οὕτως μείνῃ, κατὰ τὴν ἐμὴν γνώμην, δοκῶ ⸀δὲ κἀγὼ πνεῦμα θεοῦ ἔχειν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/040.yaml
  text: But she is happier if she remains as she is[a], according to my judgment—and I think that I also have the Spirit of God.
translation:
  language: ig
  text: Ma ọ ga-enwe obi ụtọ karịa ma ọ bụrụ na ọ nọgide otú ahụ[a], dị ka uche m si dị—echere m na mụ kwa nwere Mmụọ Chineke.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ọ ga-abụ onye a gọziri agọzi karịa.” Okwu ntụnyere Grik μακαριωτέρα nwere ike ịpụta ọnọdụ ngọzi ka ukwuu nakwa obi ụtọ ka ukwuu.
    reason: lexical_alternative
lexical_decisions:
- source_word: μακαριωτέρα
  choice: ọ ga-enwekwu obi ụtọ
  rationale: 'Nke a na-egosipụta ntụnyere dị n’okwu Grik: ọnọdụ ya ga-enye ya obi ụtọ ka ukwuu. E tinyere ụzọ ọzọ, ‘onye a gọziri agọzi karịa,’ n’okpuru amaokwu n’ihi na okwu ahụ nwekwara ike ịpụta ngọzi ka ukwuu.'
- source_word: ἐὰν οὕτως μείνῃ
  choice: ma ọ bụrụ na ọ nọgide otú ahụ
  rationale: ‘Nọgide’ na-egosipụta μένω, ebe ‘otú ahụ’ na-arụtụ aka n’ọnọdụ ya nke a kọwara n’amaokwu ndị bu ụzọ n’emeghị ka ihe odide ahụ kwuo ihe karịrị nke Grik kwuru.
- source_word: κατὰ τὴν ἐμὴν γνώμην
  choice: dị ka uche m si dị
  rationale: Nke a bụ ụzọ Igbo si ekwu echiche ma ọ bụ mkpebi mmadụ tụlere nke ọma, ma na-echekwa ọdịiche dị n’etiti ndụmọdụ Pọl na iwu Onyenwe anyị o kwuru kpọmkwem.
- source_word: δοκῶ
  choice: echere m
  rationale: Ọ na-echekwa olu Pọl nke dị umeala n’obi n’ụzọ okwu, ma ọ dịghị eme ka okwu ya bụrụ nke obi abụọ na-adịghị ike.
- source_word: κἀγὼ
  choice: mụ onwe m nwekwara
  rationale: Nke a na-egosipụta ike mgbakwunye nke ‘mụ onwe m kwa,’ nke nwere ike ịbụ nzaghachi nye ndị ọzọ na-azọrọ na ha nwere ikike ime mmụọ.
- source_word: πνεῦμα θεοῦ
  choice: Mmụọ Chineke
  rationale: N’iji okwu Pọl eme ihe, nkebi a na-arụtụ aka na Mmụọ Nsọ nke Chineke, ọ bụghị naanị àgwà ime mmụọ mmadụ nwere.
- source_word: ἔχειν
  choice: nwere
  rationale: ‘Nwere’ bụ ntụgharị kpọmkwem, dị mfe, ma bụrụkwa nke Igbo nkịtị maka infinitive a.
theological_decisions:
- issue: Ma πνεῦμα θεοῦ ọ̀ bụ Mmụọ Nsọ ka ọ bụ naanị àgwà ime mmụọ
  choice: Mmụọ Chineke
  alternative: mmụọ sitere n’aka Chineke; nghọta ime mmụọ Chineke nyere
  rationale: N’akwụkwọ Pọl, πνεῦμα θεοῦ na-arụtụkarị aka na Mmụọ Chineke. N’ebe a, Pọl na-ekwu na ndụmọdụ ya nwere nduzi nke Mmụọ, ma ọ naghị akpọ ya iwu Onyenwe anyị kwuru kpọmkwem.
- issue: Ike okwu Pọl n’ebe δοκῶ ... πνεῦμα θεοῦ ἔχειν dị
  choice: Okwu dị umeala n’obi nke ka bụ nkwupụta n’ezie na Mmụọ na-eduzi ya
  alternative: Pọl ejighị n’aka ma o nwere Mmụọ; ma ọ bụ okwu mkparị megide ndị na-emegide ya
  rationale: ‘Echere m’ na-echekwa ịdị umeala n’obi nke usoro okwu ahụ, ma ihe gbara ya gburugburu anaghị egosi na Pọl nwere obi abụọ n’ezie banyere inwe Mmụọ Chineke.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. ‘Ọ nọgide otú ahụ’ na-ahapụ ntụaka ahụ ka ọ dabere n’ọnọdụ nwanyị ahụ a kọwara n’amaokwu ndị bu ụzọ, dịka okwu Grik si eme. E ji mkpụrụedemede ukwu dee ‘Mmụọ’ iji mee ka o doo anya na ọ bụ Mmụọ Chineke ka a na-ekwu maka ya.
