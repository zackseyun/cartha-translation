id: 1CO.7.14
reference: 1 Corinthians 7:14
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἡγίασται γὰρ ὁ ἀνὴρ ὁ ἄπιστος ἐν τῇ γυναικί, καὶ ἡγίασται ἡ γυνὴ ἡ ἄπιστος ἐν τῷ ⸀ἀδελφῷ· ἐπεὶ ἄρα τὰ τέκνα ὑμῶν ἀκάθαρτά ἐστιν, νῦν δὲ ἅγιά ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/014.yaml
  text: For the unbelieving husband has been made holy through his wife[a], and the unbelieving wife has been made holy through the brother; otherwise your children are unclean, but as it is[b], they are holy.
translation:
  language: ig
  text: N’ihi na e meela di ahụ na-ekweghị ekwe ka ọ dị nsọ[b] site na nwunye ya, e meekwaala nwunye ahụ na-ekweghị ekwe ka ọ dị nsọ site na nwanna nwoke ahụ[a]; a sị na ọ bụghị otú ahụ, ụmụ unu bụ ndị na-adịghị ọcha, ma otú ọ dị ugbu a, ha dị nsọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'N’asụsụ Grik: “site na nwanna nwoke ahụ.” O yikarịrị ka Pọl ji “nwanna nwoke” mee ihe n’ụzọ ọ na-ejikarị ya akọwa onye kwere ekwe ibe ya; n’ebe a, ọ bụ di ahụ kwere ekwe.'
    reason: lexical_alternative
  - marker: b
    text: “E meela ... ka ọ dị nsọ” n’ebe a na-ekwu na e kewapụtala onye ahụ n’ụzọ pụrụ iche n’ihi mmekọrịta ya na di ma ọ bụ nwunye kwere ekwe na ezinụlọ ahụ; ọ pụtaghị n’onwe ya na onye ahụ enwetala nzọpụta onwe ya.
    reason: cultural_note
lexical_decisions:
- source_word: ἡγίασται
  choice: e meela ... ka ọ dị nsọ
  rationale: 'Nke a na-egosipụta perfect passive: ihe e mere nke rụpụtara ọnọdụ ka dị ugbu a. Ọ na-ejikwa okwu dị nsọ na ἅγιά nwee njikọ, na-enweghị ikwu na onye ahụ enwetala nzọpụta onwe ya.'
- source_word: ἄπιστος
  choice: na-ekweghị ekwe
  rationale: N’ọnọdụ alụmdi na nwunye a, ọ na-akọwa onye na-ekweghị na Kraịst, ọ bụghị onye a na-apụghị ịtụkwasị obi.
- source_word: ἐν
  choice: site na
  rationale: Ọ na-enye echiche mmekọrịta ma ọ bụ ụzọ ọnọdụ nsọ ahụ si bịa n’ime njikọ alụmdi na nwunye, ma ọ naghị akọwa kpọmkwem otú nke ahụ si arụ ọrụ.
- source_word: ἀνήρ / γυνή
  choice: di / nwunye
  rationale: Ọnọdụ okwu ndị gbara amaokwu a gburugburu bụ alụmdi na nwunye, ya mere ndị a bụ okwu Igbo dabara adaba.
- source_word: ἀδελφῷ
  choice: nwanna nwoke ahụ
  rationale: Nke a na-echekwa okwu Grik ahụ kpọmkwem kama ịgbanwe ya ozugbo ka ọ bụrụ ‘di kwere ekwe’; ihe odide ala peeji na-akọwa onye o yikarịrị ka ọ na-ezo aka na ya.
- source_word: ἐπεὶ ἄρα
  choice: a sị na ọ bụghị otú ahụ
  rationale: Nkebiokwu a na-ewebata ihe ga-abụ eziokwu ma ọ bụrụ na okwu gara aga abụghị eziokwu.
- source_word: ἀκάθαρτα
  choice: ndị na-adịghị ọcha
  rationale: Ọ na-echekwa ọdịiche dị n’etiti ihe na-adịghị ọcha na ihe dị nsọ, tinyere ụda okpukpe na nke ọgbụgba ndụ dị n’okwu ahụ.
- source_word: νῦν δὲ
  choice: ma otú ọ dị ugbu a
  rationale: Ọ na-egosi ọnọdụ dị adị ugbu a, n’ụzọ megidere ọnọdụ e chere n’echiche n’ahịrịokwu gara aga.
- source_word: ἅγιά
  choice: dị nsọ
  rationale: Ọ na-echekwa njikọ mkpụrụokwu ya na ἡγίασται ma hapụkwa ịdị arọ nke okwu ahụ n’akụkụ nkà mmụta okpukpe.
theological_decisions:
- issue: Ihe ‘e meela ... ka ọ dị nsọ’ pụtara banyere di ma ọ bụ nwunye na-ekweghị ekwe
  choice: E debere okwu ịdị nsọ dịka ọnọdụ pụrụ iche nke sitere na mmekọrịta alụmdi na nwunye na onye kwere ekwe, n’ebughị ụzọ kwuo na nke a bụ nzọpụta onwe onye.
  alternative: Ịsụgharị ya ka ọ pụta na onye na-ekweghị ekwe azọpụtala n’ihi na ọ lụrụ onye kwere ekwe, ma ọ bụ na naanị ihe ọ pụtara bụ na mmekọahụ di na nwunye ahụ ziri ezi.
  rationale: Arụmụka Pọl jikọtara ọnọdụ di na nwunye ahụ na ọnọdụ ụmụ ha. Nsụgharị ahụ na-echekwa okwu ‘nsọ’ na esemokwu nkà mmụta okpukpe dị na ya, ebe ihe odide ala peeji na-egbochi nghọta karịrị ihe amaokwu ahụ kwuru.
- issue: Onye ἀδελφῷ na-ezo aka na ya
  choice: E debere ‘nwanna nwoke ahụ’ n’ahịrịokwu bụ isi, a kọwaakwa na ọ ga-abụ di ahụ kwere ekwe.
  alternative: Ịsụgharị ya ozugbo dịka ‘di ahụ kwere ekwe’ ma ọ bụ ‘onye òtù ọlụlụ ahụ kwere ekwe.’
  rationale: Ihe odide Grik kwuru ἀδελφῷ, ọ bụghị ἀνήρ, n’akụkụ nke abụọ. Idebe ‘nwanna nwoke’ na-eme ka nsụgharị ahụ doo anya n’ebe isi mmalite dị, ma ihe odide ala peeji na-enyere onye na-agụ ya aka.
translation_notes:
  register: Asụsụ Igbo izugbe, nke oge a, dị ugwu ma dị mfe nghọta. E ji ‘di,’ ‘nwunye,’ ‘ụmụ unu,’ na ‘dị nsọ’ mee ka ahịrịokwu ahụ bụrụ nke nkịtị nye ndị na-agụ Igbo, ebe a ka na-echekwa ọdịiche na nghọta na-edoghị anya nke ihe odide Grik.
