id: 1CO.11.30
reference: 1 Corinthians 11:30
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: διὰ τοῦτο ἐν ὑμῖν πολλοὶ ἀσθενεῖς καὶ ἄρρωστοι καὶ κοιμῶνται ἱκανοί.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/030.yaml
  text: For this reason many among you are weak and sick[a], and a good number have fallen asleep.
translation:
  language: ig
  text: N’ihi nke a, ọtụtụ ndị nọ n’etiti unu adịghị ike, na-arịakwa ọrịa, ọtụtụkwa ndị arahụla ụra.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n’ụzọ doro anya karị, “anwụọla.” O yikarịrị ka Pọl ji “arahụla ụra” mee ihe dị ka okwu Ndị Kraịst ji ekwu maka ọnwụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: N’ihi nke a
  rationale: Ọ na-egosi ihe kpatara ọnọdụ a, na-ezo aka n’ihe Pọl kwuru tupu amaokwu a; ọ bụkwa okwu Igbo doro anya ma kwekọọ na causal force nke Grik.
- source_word: ἐν ὑμῖν
  choice: ndị nọ n’etiti unu
  rationale: N’ebe a, ọ na-ekwu maka ndị nọ n’ọgbakọ Kọrịnt, ọ bụghị ihe dị n’ime ahụ mmadụ.
- source_word: πολλοὶ
  choice: ọtụtụ ndị
  rationale: Nke a na-enye kpọmkwem echiche nke ọnụ ọgụgụ buru ibu n’Igbo nkịtị.
- source_word: ἀσθενεῖς
  choice: adịghị ike
  rationale: Ọ na-echekwa echiche nke adịghị ike n’ahụ ma ghara ijikọta ya kpamkpam na ọrịa nke okwu na-esochi ya.
- source_word: ἄρρωστοι
  choice: na-arịakwa ọrịa
  rationale: Nke a bụ ụzọ Igbo dị mfe ma doo anya isi kwuo na mmadụ na-arịa ọrịa, ma na-edobe ọdịiche ya na ‘adịghị ike.’
- source_word: κοιμῶνται
  choice: arahụla ụra
  rationale: Ọ na-echekwa ihe atụ Pọl ji ụra kwuo maka ọnwụ kama ịgbanwe ya ozugbo ka ọ bụrụ ‘anwụọla.’
- source_word: ἱκανοί
  choice: ọtụtụkwa ndị
  rationale: N’ebe a, okwu ahụ pụtara ọnụ ọgụgụ dị ukwuu. Nsụgharị a bụ Igbo eke ma ghara iji ahịrịokwu siri ike dịka ‘ọnụ ọgụgụ dị ukwuu.’
theological_decisions:
- issue: Ma κοιμῶνται ga-apụta ụra nkịtị ka ọ bụ ihe atụ maka ọnwụ
  choice: E chekwara ihe atụ ahụ dịka ‘arahụla ụra’ n’ahịrị bụ isi.
  alternative: ‘anwụọla’ ma ọ bụ ‘na-ehi ụra’ n’ụzọ nkịtị
  rationale: Usoro echiche ahụ—adịghị ike, ọrịa, mesịa ụra—na ọnọdụ ikpe Chineke n’ọgbakọ na-egosi na ‘ụra’ bụ okwu e ji nwayọọ kwuo ọnwụ. Ichekwa ihe atụ ahụ anaghị ehichapụ ụda na esemokwu dị n’okwu Pọl.
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. E debere ihe atụ nke ‘ịrahụ ụra’ maka ọnwụ, tinyekwa akara nkọwa [a] ozugbo n’ebe ihe atụ ahụ dị.
