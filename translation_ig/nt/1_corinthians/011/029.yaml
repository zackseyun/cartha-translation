  text: ὁ γὰρ ἐσθίων καὶ ⸀πίνων κρίμα ἑαυτῷ ἐσθίει καὶ πίνει μὴ διακρίνων τὸ ⸀σῶμα.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/029.yaml
  text: For the one who eats and drinks eats and drinks judgment on himself[b][a], not discerning the body.
translation:
  language: ig
  text: N’ihi na onye na-eri ma na-aṅụ na-enweghị ịkpa ókè banyere ahụ ahụ na-ewetara onwe ya ikpe site n’iri na n’ịṅụ ya.[b][a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ụfọdụ akwụkwọ odide aka na-agụ, “ahụ Onyenwe anyị,” kama “ahụ ahụ.”
    reason: textual_variant
  - marker: b
    text: A pụkwara ịsụgharị ya, “na-enweghị ịmata ahụ ahụ nke ọma.” Nke a nwere ike ịpụta ịghọta mkpa Nri Anyasị nke Onyenwe anyị dị, ịmata ọgbakọ ndị kwere ekwe dịka ahụ, ma ọ bụ ha abụọ.
    reason: alternative_reading
lexical_decisions:
- source_word: κρίμα
  choice: ikpe
  rationale: “Ikpe” na-egosi mkpebi ikpe ma ọ bụ ntaramahụhụ sitere n’ikpe, ma ọ naghị emesi ikpe mbibi ikpeazụ ike dịka okwu siri ike karị ga-eme.
- source_word: ἑαυτῷ
  choice: nye onwe ya
  rationale: Dative reflexive na-egosi na onye ahụ ji omume iri na ịṅụ ya wetara onwe ya ikpe.
- source_word: διακρίνων
  choice: ịmata ihe dị iche banyere
  rationale: Nkebiokwu a na-echekwa echiche nke ịkpa ókè, ịtụle nke ọma, ma ọ bụ ịghọta ihe ahụ n’ụzọ kwesịrị ekwesị, n’agbanyeghị na ọ dịtụ ogologo n’Igbo.
- source_word: τὸ σῶμα
  choice: ahụ ahụ
  rationale: E debere naanị “ahụ ahụ” dịka Greek si kwuo, n’etinyeghị “nke Onyenwe anyị” ma ọ bụ “ọgbakọ ndị kwere ekwe,” ka mgbagwoju anya ziri ezi dịgide.
- source_word: ὁ ... ἐσθίων καὶ πίνων
  choice: onye na-eri ma na-aṅụ
  rationale: Nke a bụ ụzọ Igbo dị mfe ma bụrụkwa nke ebumpụta ụwa isi gosipụta substantival participle nke na-ezo aka n’onye ọ bụla na-eme ihe ahụ.
- source_word: μὴ διακρίνων
  choice: ebe ọ na-amataghị ihe dị iche banyere
  rationale: E ji nkebiokwu participial kwekọrọ n’usoro Greek, kama ime ya kpọmkwem ka ọ bụrụ ọnọdụ “ọ bụrụ na,” nke nwere ike ime ka mmekọrịta ahụ sie ike karịa ka isi mmalite kwuru.
theological_decisions:
- issue: Ihe “ahụ ahụ” pụtara n’ihe gbasara Nri Anyasị nke Onyenwe anyị
  choice: E debere “ahụ ahụ” n’enweghị nkọwa ọzọ.
  alternative: “ahụ Onyenwe anyị” ma ọ bụ “ahụ nke ndị kwere ekwe”
  rationale: Greek kacha ochie e nwere na-ekwu naanị “ahụ ahụ.” Ihe gbara amaokwu ahụ gburugburu nwere ike ịtụ aka n’ahụ Kraịst, n’ọgbakọ dịka ahụ, ma ọ bụ na ha abụọ; ya mere nsụgharị ekwesịghị ikpebi ihe ederede hapụrụ ka ọ ghere oghe.
- issue: Ike okwu κρίμα
  choice: ikpe
  alternative: ikpe mbibi
  rationale: Amaokwu 32 na-ekewa ịdọ aka ná ntị Chineke n’ebe ndị kwere ekwe nọ na ikpe a ga-ama ụwa. “Ikpe” na-echekwa oke nkọwa ahụ n’etinyeghị echiche nke mbibi ikpeazụ.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke dị ugwu ma dị mfe nghọta. E chekwara nkwughachi “na-eri ma na-aṅụ ... na-eriri ma na-aṅụrụ” iji soro nkwusi ike nke Greek; akara nkọwa [b][a] nọ n’isi ederede dịka achọrọ.
