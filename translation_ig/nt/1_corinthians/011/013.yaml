    text: Ma ọ bụ “nwunye,” ma ọ bụrụ na a ghọta γυνή n'echiche nwunye n'ọnọdụ sara mbara nke akụkụ a.
    reason: alternative_reading
  revision_rationale: 'The revision preserves the rhetorical force and ambiguity of the Greek while making ἀκατακάλυπτον a clear contemporaneous description: the woman prays with her head uncovered. The footnote continues to present “wife” only as an alternative contextual reading.'
