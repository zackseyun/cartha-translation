review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the imperative to evaluate, the question of propriety, prayer directed to God, and the generic default sense of γυναῖκα as “woman.” However, “kpuchighị isi ya” uses a completed negative verbal form and can suggest that she did not cover her head on a particular occasion, rather than describing her as uncovered while praying. A stative descriptive expression more closely represents ἀκατακάλυπτον.
  naturalness: “Kpebienụ n'onwe unu” and “kpegara Chineke ekpere” are clear Standard Igbo. Recasting the head-covering phrase as “jiri isi ya na-enweghị mkpuchi” gives a more natural and unambiguous description of the circumstance of prayer.
  terminology: “Nwanyị” appropriately retains the generic sense of γυναῖκα, while the footnote preserves “nwunye” as a contextual alternative without making that reading mandatory. “Chineke” and “ekpere” are appropriate standard Christian register terms.
  issues:
  - severity: medium
    issue: The phrase “ka nwanyị kpuchighị isi ya kpegara Chineke ekpere” does not clearly express the adjectival state “uncovered.”
    rationale: The Greek ἀκατακάλυπτον modifies “woman” and denotes her uncovered state in the act of praying. The Igbo completed negative form “kpuchighị” may be read as a past/complete failure to cover rather than as the relevant state or manner.
  - severity: low
    issue: The footnote’s wording for the contextual wife reading is somewhat awkward.
    rationale: “N'ihi ihe ndị gbara amaokwu a gburugburu” is less idiomatic and less precise than referring to the broader context of the passage.
  revised_text: 'Kpebienụ n''onwe unu: ò kwesịrị ekwesị ka nwanyị jiri isi ya na-enweghị mkpuchi kpegara Chineke ekpere?[a]'
  revised_footnotes:
