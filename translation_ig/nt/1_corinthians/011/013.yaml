  text: ἐν ὑμῖν αὐτοῖς κρίνατε· πρέπον ἐστὶν γυναῖκα ἀκατακάλυπτον τῷ θεῷ προσεύχεσθαι;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/013.yaml
  text: 'Judge for yourselves: is it proper for a woman to pray to God with her head uncovered?[a]'
translation:
  language: ig
  text: 'Kpebienụ n''onwe unu: ò kwesịrị ekwesị ka nwanyị jiri isi ya na-enweghị mkpuchi kpegara Chineke ekpere?[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ “nwunye,” ma ọ bụrụ na a ghọta γυνή n'echiche nwunye n'ọnọdụ sara mbara nke akụkụ a.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν ὑμῖν αὐτοῖς
  choice: n'onwe unu
  rationale: Nke a na-egosipụta arịrịọ ka ndị Kọrịnt jiri aka ha nyochaa okwu ahụ; “n'onwe unu” bụ ụzọ Igbo doro anya ma bụrụkwa nke e ji ekwu okwu taa.
- source_word: κρίνατε
  choice: Kpebienụ
  rationale: Aorist imperative a na-akpọ ha ka ha nyochaa ma kpebie; “Kpebienụ” na-eburu ike iwu ahụ ma na-ada nke ọma n'Igbo.
- source_word: πρέπον ἐστὶν
  choice: ò kwesịrị ekwesị
  rationale: Nkebi a na-ajụ ma omume ahụ ò dabara n'ihe kwesịrị ekwesị n'omume na n'ọha; okwu a na-egosi echiche ahụ n'ụzọ doro anya.
- source_word: γυναῖκα
  choice: nwanyị
  rationale: γυνή nwere ike ịpụta nwanyị ma ọ bụ nwunye. Ebe amaokwu a na-ekwu okwu n'ozuzu ma ọ kpọghị di aha, “nwanyị” ka e tinyere n'ahụ amaokwu, ebe e debere “nwunye” n'ala peeji dịka ihe ọzọ okwu ahụ nwere ike ịpụta.
- source_word: ἀκατακάλυπτον
  choice: kpuchighị isi ya
  rationale: Okwu ahụ pụtara onye a na-ekpuchighị; ihe gbara ya gburugburu na-ekwu banyere ikpuchi isi, ya mere e mere isi a na-ekwu banyere ya ka ọ pụta ìhè.
- source_word: τῷ θεῷ
  choice: kpegara Chineke
  rationale: Dative a na-egosi onye a na-ekpegara ekpere; usoro ngwaa Igbo “kpegara Chineke ekpere” na-eburu nke ahụ n'ụzọ ebumpụta ụwa.
- source_word: προσεύχεσθαι
  choice: kpegara ... ekpere
  rationale: Nke a bụ infinitive nke pụtara ikpe ekpere; e ji usoro Igbo zuru ezu “ikpegara Chineke ekpere” mee ka ọ bụrụ okwu dị mfe ma bụrụkwa nke dị ùgwù.
theological_decisions:
- issue: Ihe γυνή pụtara n'okwu gbasara ikpuchi isi
  choice: nwanyị
  alternative: nwunye
  rationale: Amaokwu a akpọghị di aha ma jụọ ajụjụ ahụ n'ozuzu banyere onye nwanyị na-ekpe ekpere. Iji zere ime ka okwu ahụ bụrụ naanị banyere ndị nwunye mgbe Grik anaghị amanye nke ahụ, e ji “nwanyị” n'ahụ amaokwu ma debe “nwunye” dịka ihe ọzọ e nwere ike ịghọta site n'ọnọdụ sara mbara.
translation_notes:
  register: Standard Igbo; asụsụ dị ugbu a, doro anya ma dị ùgwù. E ji “Kpebienụ n'onwe unu” chekwaa ike arịrịọ Pọl, ma e debeghị mgbagwoju anya nke γυνή n'enweghị nkọwa.
