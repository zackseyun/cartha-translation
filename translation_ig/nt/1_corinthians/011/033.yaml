id: 1CO.11.33
reference: 1 Corinthians 11:33
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ὥστε, ἀδελφοί μου, συνερχόμενοι εἰς τὸ φαγεῖν ἀλλήλους ἐκδέχεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/033.yaml
  text: So then[a], my brothers, when you come together to eat, wait for one another.
translation:
  language: ig
  text: Ya mere, ụmụnna m[a], mgbe unu na-ezukọta iri nri, chereenụ ibe unu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Okwu Grik ahụ pụtara kpọmkwem “ụmụnna nwoke,” ma a na-ejikarị ụdị nwoke a akpọ ọgbakọ nwere ma ndị nwoke ma ndị nwanyị.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “nabatanụ ibe unu.” N’ebe a, ihe gbara amaokwu ahụ gburugburu na-akwado “chereenụ ibe unu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὥστε
  choice: Ya mere
  rationale: Njikọ a na-egosi nkwubi okwu Pọl si na ntụziaka na ịdọ aka ná ntị ndị bu ụzọ kwuo banyere Nri Anyasị Onyenweanyị.
- source_word: ἀδελφοί μου
  choice: ụmụnna m
  rationale: Nke a bụ okwu a na-akpọ ọgbakọ ozugbo. “Ụmụnna m” bụ okwu Igbo dị ebube ma dịkwa n'ụzọ mmadụ na-asụ, nke nwere ike ịgụnye ndị nwoke na ndị nwanyị n’ọgbakọ, ebe ndetu na-akọwa ọdịdị okwu Grik.
- source_word: συνερχόμενοι
  choice: mgbe unu na-ezukọta
  rationale: Nkebi a na-egosi ọnọdụ ma ọ bụ oge iwu ahụ metụtara, ma kwekọọ n’okwu a na-ekwughachi banyere nzukọ ọgbakọ n’isiakwụkwọ a.
- source_word: εἰς τὸ φαγεῖν
  choice: iri nri
  rationale: 'Preposition na infinitive nwere article na-egosi ebumnuche: ha na-ezukọta ka ha rie. Nsụgharị a dị mkpirikpi ma ọ naghị akọwapụta ụdị nri karịa ihe Grik kwuru.'
- source_word: ἀλλήλους
  choice: ibe unu
  rationale: Ọ bụ nnọchiaha mmeghachi omume nke pụtara na onye ọ bụla kwesịrị ime ihe a n’ebe ndị ọzọ nọ.
- source_word: ἐκδέχεσθε
  choice: chereenụ
  rationale: N’ọnọdụ a, ebe ụfọdụ malitere iri tupu ndị ọzọ erute (amaokwu 21), ihe okwu a kacha pụta bụ ichere ndị ọzọ tupu a malite iri. Ndetu na-edobe nghọta ọzọ nke nwere ike ịbụ ịnabata.
theological_decisions:
- issue: Okwu nwoke na-anọchite anya ọgbakọ dum na ἀδελφοί
  choice: Jiri “ụmụnna m” n’ahụ amaokwu ma kọwaa n’ala peeji na okwu Grik bụ ụdị nwoke.
  alternative: “ụmụnna m ndị nwoke na ndị nwanyị”
  rationale: ἀδελφοί bụ ụdị nwoke n’asụsụ Grik, ma a na-ejikarị ya akpọ ọgbakọ dum, nke nwere ndị nwoke na ndị nwanyị. “Ụmụnna m” na-asụ nke ọma n’Igbo ma ghara ịgbakwunye okwu ndị na-adịghị kpọmkwem n’ahụ Grik.
- issue: Ihe ἐκδέχεσθε pụtara n’ọnọdụ Nri Anyasị Onyenweanyị
  choice: “chereenụ”
  alternative: “nabatanụ”
  rationale: Ihe e kwuru na amaokwu 21 banyere onye ọ bụla iburu ụzọ rie nri nke ya na-akwado iwu ka ha chere ibe ha. Otú ọ dị, ebe ngwaa ahụ nwekwara ike ịpụta ịnabata mmadụ, a hapụrụ nke ahụ na ndetu kama ikpochapụ ya.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe nghọta ma dị ebube mee ihe. “Mgbe unu na-ezukọta iri nri” na-edobe njikọ oge na ebumnuche dị na Grik; iwu “chereenụ” doro anya ma bụrụ nke a na-asụkarị.
