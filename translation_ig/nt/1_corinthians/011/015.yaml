base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/015.yaml
  text: But if a woman has long hair[a], it is her glory[b], because her hair has been given to her instead of a covering.
translation:
  language: ig
  text: Ma ọ bụrụ na nwanyị[a] nwere ogologo ntutu isi, ọ bụụrụ ya ebube, n’ihi na e nyewo ya ntutu isi ya n’ọnọdụ ihe mkpuchi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “nwunye.” Okwu Grik ahụ nwere ike ịpụta “nwanyị” ma ọ bụ “nwunye,” dabere n’ọnọdụ okwu.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “dị ka ihe mkpuchi.” Okwu Grik a, ἀντί, nwere ike igosi nnọchi ma ọ bụ ihe kwekọrọ n’ihe ọzọ; nkebiokwu a naanị ya anaghị ekpebi ma Pọl ọ̀ na-ekwu na ntutu ahụ na-arụ ọrụ dị ka ihe mkpuchi, ka ọ̀ bụ na e nyere ya n’ihe metụtara ihe mkpuchi.
    reason: lexical_alternative
lexical_decisions:
- source_word: γυνή
  choice: nwanyị
  rationale: Okwu Grik a nwere ike ịpụta “nwanyị” ma ọ bụ “nwunye” dabere n’ọnọdụ okwu. N’amaokwu a, okwu ahụ dị ka ụkpụrụ gbasara nwanyị n’ozuzu ya, ya mere “nwanyị” dabara nke ọma.
- source_word: κομᾷ
  choice: enwee ogologo ntutu isi
  rationale: Ngwaa a na-ekwu banyere inwe ma ọ bụ ịhapụ ntutu isi ka ọ too ogologo, ọ bụghị naanị inwe ntutu isi.
- source_word: δόξα
  choice: ebube
  rationale: “Ebube” na-echekwa ike okwu δόξα dị ka ihe na-ewetara mmadụ nsọpụrụ ma ọ bụ otuto, ma bụrụkwa okwu Igbo doro anya n’ebe a.
- source_word: κόμη
  choice: ntutu isi ya
  rationale: κόμη bụ ntutu dị n’isi, ọ na-enwekarị echiche nke ntutu toro ogologo. E kwuworị ịdị ogologo ya na ngwaa bu ya ụzọ, ya mere “ntutu isi ya” na-ezere ikwughachi okwu n’enweghị mkpa.
- source_word: ἀντί
  choice: n’ọnọdụ
  rationale: ἀντί nwere ike igosi nnọchi ma ọ bụ mmekọrịta kwekọrọ ekwekọ. “N’ọnọdụ” na-egosipụta isi echiche nke ihe e nyere n’ọnọdụ ihe ọzọ, ma ihe odide ala peeji na-edebe nkọwa ọzọ o nwere ike inwe.
- source_word: περιβολαίου
  choice: ihe mkpuchi
  rationale: Okwu a na-ezo aka n’ozuzu ya n’ihe a na-eyikwasị ma ọ bụ eji ekpuchi mmadụ. “Ihe mkpuchi” anaghị eme ka okwu ahụ bụrụ kpọmkwem “akwa mkpuchi isi” ma ọ bụ “veil” karịa ihe Grik kwuru.
- source_word: δέδοται
  choice: e nyewo ya
  rationale: Ụdị perfect passive na-egosi na e nyere ya ihe ahụ, ọnọdụ nke inwe ya ka na-adịkwa. “E nyewo ya” na-echekwa olu nnara na nsonaazụ omume ahụ.
theological_decisions:
- issue: Ma περιβόλαιον ọ̀ kwesịrị ịsụgharị kpọmkwem dị ka akwa mkpuchi isi, nke ga-eme ka a kpebie na ntutu nwanyị n’onwe ya bụ ihe mkpuchi a chọrọ n’akụkụ Akwụkwọ Nsọ a.
  choice: Jiri okwu sara mbara “ihe mkpuchi,” ma ghara iji nsụgharị ahụ kpebie arụmụka banyere ihe mkpuchi isi.
  alternative: “akwa mkpuchi isi” ma ọ bụ “akwa a na-eyikwasị mmadụ”
  rationale: περιβόλαιον sara mbara karịa okwu pụtara naanị akwa mkpuchi isi. “Ihe mkpuchi” na-edebe ihe okwu Grik pụtara ma na-ahapụ esemokwu dị n’etiti ntutu dịka ihe nọchiri mkpuchi na ntutu dịka ihe kwekọrọ na mkpuchi n’enweghị itinye ozizi otu ụka.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “Ọ bụụrụ ya ebube” na-edebe ike okwu Grik n’enweghị ime ka ọ bụrụ naanị ịma mma; “ihe mkpuchi” na-edebekwa obosara okwu mbụ.
