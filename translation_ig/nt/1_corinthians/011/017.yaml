- from: Ma mgbe m na-enye unu ntụziaka a[a], anaghị m aja unu mma, n’ihi na mgbe unu na-ezukọ, ọ naghị abụ maka ime ka ihe ka mma, kama ọ na-eme ka ihe ka njọ.
  to: Ma mgbe m na-enye unu ntụziaka a[a], anaghị m eto unu, n’ihi na unu anaghị ezukọ maka ihe ka mma, kama maka ihe ka njọ.
  rationale: 'The revision retains the authoritative but not unnecessarily harsh sense of παραγγέλλων and preserves Paul’s direct contrast: their coming together is not for better but for worse. It removes the added causative interpretation and uses idiomatic modern Standard Igbo for “I do not praise you.”'
