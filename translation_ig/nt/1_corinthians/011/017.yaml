source:
  edition: SBLGNT
  text: Τοῦτο δὲ ⸂παραγγέλλων οὐκ ἐπαινῶ⸃ ὅτι οὐκ εἰς τὸ κρεῖσσον ἀλλὰ εἰς τὸ ἧσσον συνέρχεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/017.yaml
  text: But in giving this instruction[a], I do not praise you, because you come together not for the better but for the worse.
translation:
  language: ig
  text: Ma mgbe m na-enye unu ntụziaka a[a], anaghị m eto unu, n’ihi na unu anaghị ezukọ maka ihe ka mma, kama maka ihe ka njọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “mgbe m na-enye unu iwu a.” Okwu Grik a nwere ike ịpụta inye ntụziaka, nduzi, ma ọ bụ iwu.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῦτο δὲ
  choice: Ma ... a
  rationale: “Ma” na-egosi ntughari nwere obere mmegide; “a” na-arụtụ aka n’ihe Pọl na-aga inye n’iwu.
- source_word: παραγγέλλων
  choice: mgbe m na-enye unu ntụziaka
  rationale: Nke a na-egosi ntụziaka nwere ikike, ma ọ naghị eme ka olu okwu sie ike karịa ihe Grik chọrọ; ihe odide ala peeji na-echekwa nhọrọ ‘iwu.’
- source_word: οὐκ ἐπαινῶ
  choice: anaghị m aja unu mma
  rationale: Ọ bụ ụzọ Igbo doro anya si kwuo na Pọl adịghị eto ha, ma na-echetakwa otuto dị n’amaokwu nke 2.
- source_word: ὅτι
  choice: n’ihi na
  rationale: Ọ na-ewebata ihe kpatara Pọl ji ghara ịja ha mma.
- source_word: οὐκ εἰς τὸ κρεῖσσον ἀλλὰ εἰς τὸ ἧσσον
  choice: ọ naghị abụ maka ime ka ihe ka mma, kama ọ na-eme ka ihe ka njọ
  rationale: Ntụgharị a na-echekwa ọdịiche dị n’etiti κρεῖσσον na ἧσσον ma na-eme ka okwu nsonaazụ ahụ bụrụ Igbo eke.
- source_word: συνέρχεσθε
  choice: mgbe unu na-ezukọ
  rationale: Ọ dabara n’ọnọdụ nzukọ ndị kwere ekwe ma bụrụ okwu ndị Igbo taa na-aghọta ngwa ngwa.
theological_decisions:
- issue: Ike na ụda olu nke παραγγέλλων
  choice: ntụziaka
  alternative: iwu
  rationale: “Ntụziaka” na-egosi na Pọl ji ikike na-eduzi ha n’emeghị ka okwu ahụ sie ike gabiga ókè; ebe ọ bụ na ngwaa Grik nwekwara ike ịpụta iwu, e debere nke ahụ n’ihe odide ala peeji.
translation_notes:
  register: Standard Igbo; asụsụ dị ugbu a, dị ùgwù, ma dị mfe nghọta. E ji ‘unu’ chekwaa na okwu a bụ maka ọtụtụ mmadụ. A haziri akụkụ ikpeazụ ka ọ bụrụ Igbo eke ma chekwaa mmegide ‘ka mma/ka njọ.’
