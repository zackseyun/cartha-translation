reference: 1 Corinthians 11:22
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: μὴ γὰρ οἰκίας οὐκ ἔχετε εἰς τὸ ἐσθίειν καὶ πίνειν; ἢ τῆς ἐκκλησίας τοῦ θεοῦ καταφρονεῖτε, καὶ καταισχύνετε τοὺς μὴ ἔχοντας; τί ⸂εἴπω ὑμῖν⸃; ἐπαινέσω ὑμᾶς; ἐν τούτῳ οὐκ ἐπαινῶ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/022.yaml
  text: For do you not have houses for eating and drinking? Or do you despise the church of God and shame those who have nothing? What should I say to you? Should I praise you? In this I do not praise you[a].
translation:
  language: ig
  text: Ọ̀ bụ na unu enweghị ụlọ ka unu rie ma ṅụọ? Ka unu na-eleda nzukọ Chineke anya, na-eme ndị na-enweghị ihe ihere? Gịnị ka m ga-agwa unu? M̀ ga-eto unu? N’ihe a, anaghị m eto unu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ndị ogbenye” ma ọ bụ “ndị na-enweghị nri.” N’asụsụ Grik, ọ bụ kpọmkwem “ndị na-enweghị [ihe].”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἰκίας
  choice: ụlọ
  rationale: Ọ na-ezo aka n’ụlọ nke onwe, ma mee ka ọdịiche dị n’etiti ha na nzukọ ndị kwere ekwe pụta ìhè.
- source_word: εἰς τὸ ἐσθίειν καὶ πίνειν
  choice: ebe unu ga-eri ihe ma ṅụọ ihe
  rationale: Nke a na-egosi nzube nke ụlọ ndị ahụ n’Igbo dị mfe ma kwekọọ n’ụzọ e si ekwu okwu ugbu a.
- source_word: ἐκκλησίας τοῦ θεοῦ
  choice: nzukọ Chineke
  rationale: N’ebe a, ἐκκλησία bụ ndị Chineke zukọrọ ọnụ; “nzukọ Chineke” na-ezere ime ka okwu ahụ bụrụ naanị ụlọ ma ọ bụ usoro ọchịchị chọọchị.
- source_word: καταφρονεῖτε
  choice: na-eleda ... anya
  rationale: Akpaalaokwu Igbo a na-egosi ile mmadụ ma ọ bụ ihe anya dị ka ihe na-abaghị uru, ma na-edobe ịdị ike nke ịba mba Pọl.
- source_word: καταισχύνετε
  choice: na-emekwa ... ihere
  rationale: Ọ na-egosi ime ka ndị ọzọ nwee ihere, n’enweghị ịgbakwụnye nkọwa karịrị ihe Grik kwuru.
- source_word: τοὺς μὴ ἔχοντας
  choice: ndị na-enweghị ihe ọ bụla
  rationale: Nke a na-edobe okwu Grik sara mbara—“ndị na-enweghị”—ka ihe gbara ya gburugburu gosi ma ọ bụ nri, akụ, ma ọ bụ ọnọdụ ịda ogbenye.
- source_word: τί εἴπω ὑμῖν;
  choice: Gịnị ka m ga-agwa unu?
  rationale: Ọ bụ ajụjụ nkwupụta nke na-egosi mgbagwoju anya na ịba mba n’Igbo ebumpụta ụwa.
- source_word: ἐπαινέσω ὑμᾶς;
  choice: M̀ ga-eto unu?
  rationale: Ọ na-edobe ajụjụ nkwupụta na atụmanya nke azịza na-adịghị mma.
- source_word: ἐν τούτῳ ... οὐκ ἐπαινῶ
  choice: N’ihe a, agaghị m eto unu
  rationale: “N’ihe a” na-ezo aka n’omume a na-atụle; iji “eto” ọzọ na-edobe nkwughachi nke ἐπαινέσω/ἐπαινῶ.
theological_decisions:
- issue: Ihe “ndị na-enweghị” na-ezo aka n’oge nri Onyenwe anyị
  choice: ndị na-enweghị ihe ọ bụla
  alternative: ndị ogbenye; ndị na-enweghị nri
  rationale: Ihe gbara amaokwu ahụ gburugburu na-egosi ndị kwere ekwe dara ogbenye ma ọ bụ ndị na-enweghị nri, ma okwu Grik n’onwe ya sara mbara. Isi amaokwu na-edobe obosara ahụ, ebe nkọwa ala peeji na-egosi ụzọ ndị ọzọ kwesịrị ekwesị.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị ùgwù ma doo ndị nkịtị anya. E jiri “nzukọ Chineke” gosi ọgbakọ ndị kwere ekwe, ọ bụghị ụlọ chọọchị. Akara ụda na “M̀” na-eme ka ajụjụ ahụ doo anya.
