revisions:
- from: N’ihi na, unu enweghị ụlọ ebe unu ga-eri ihe ma ṅụọ ihe? Ka unu na-eleda nzukọ Chineke anya, na-emekwa ndị na-enweghị ihe ọ bụla ihere? Gịnị ka m ga-agwa unu? M̀ ga-eto unu? N’ihe a, agaghị m eto unu.[a]
  to: Ọ̀ bụ na unu enweghị ụlọ ka unu rie ma ṅụọ? Ka unu na-eleda nzukọ Chineke anya, na-eme ndị na-enweghị ihe ihere? Gịnị ka m ga-agwa unu? M̀ ga-eto unu? N’ihe a, anaghị m eto unu.[a]
  rationale: The revision corrects the final verb from future to present, matching οὐκ ἐπαινῶ and preserving Paul’s repeated praise/commend language. It also clarifies the opening rhetorical question and slightly streamlines the purposive phrase. The broad referent of τοὺς μὴ ἔχοντας is retained, and the footnote continues to identify contextually plausible alternatives without forcing one into the main text.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T18:12:54Z'
review_pass:
  verdict: revise
  source_fidelity: The rendering follows the Greek argument, rhetorical questions, and the contrast between private houses and God's assembly well. However, the final οὐκ ἐπαινῶ is present tense ('I do not praise/commend'), whereas the draft's “agaghị m eto unu” is future ('I will not praise you').
  naturalness: The text is generally clear Standard Igbo. “Ọ̀ bụ na unu enweghị ụlọ...” gives the opening negative rhetorical question a more natural and unmistakable interrogative form. “ụlọ ... ka unu rie ma ṅụọ” is concise and preserves the purposive sense.
  terminology: “Nzukọ Chineke” appropriately conveys ἐκκλησία τοῦ θεοῦ as God's gathered assembly without implying a building. “Na-eleda ... anya,” “na-eme ... ihere,” and “eto” accurately retain the rebuke and the rhetorical repetition. “Ndị na-enweghị ihe” is broad, while remaining idiomatic; it does not prematurely restrict the referent to the poor or those without food.
  issues:
  - severity: medium
    issue: The final clause is rendered in the future tense.
    rationale: 'Greek οὐκ ἐπαινῶ is present indicative: Paul says, “I do not praise/commend you,” not “I will not praise you.” The Igbo must therefore use “anaghị m eto unu.”'
  - severity: low
    issue: The opening negative rhetorical question can be made clearer and more idiomatic.
    rationale: Adding “Ọ̀ bụ na” clearly marks the expected-answer rhetorical question represented by μὴ γὰρ ... οὐκ ἔχετε; without changing its force.
  revised_text: Ọ̀ bụ na unu enweghị ụlọ ka unu rie ma ṅụọ? Ka unu na-eleda nzukọ Chineke anya, na-eme ndị na-enweghị ihe ihere? Gịnị ka m ga-agwa unu? M̀ ga-eto unu? N’ihe a, anaghị m eto unu.[a]
  revised_footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ndị ogbenye” ma ọ bụ “ndị na-enweghị nri.” N’asụsụ Grik, ọ bụ kpọmkwem “ndị na-enweghị [ihe].”
    reason: lexical_alternative
  revision_rationale: The revision corrects the final verb from future to present, matching οὐκ ἐπαινῶ and preserving Paul’s repeated praise/commend language. It also clarifies the opening rhetorical question and slightly streamlines the purposive phrase. The broad referent of τοὺς μὴ ἔχοντας is retained, and the footnote continues to identify contextually plausible alternatives without forcing one into the main text.
