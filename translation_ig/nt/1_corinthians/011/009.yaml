  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ γὰρ οὐκ ἐκτίσθη ἀνὴρ διὰ τὴν γυναῖκα, ἀλλὰ γυνὴ διὰ τὸν ἄνδρα.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/009.yaml
  text: For indeed[a], man was not created for the woman, but woman for the man.
translation:
  language: ig
  text: N’ihi na, n’ezie, e keghị nwoke n’ihi nwanyị, kama e kere nwanyị n’ihi nwoke.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “n’ihi nwanyị” / “n’ihi nwoke” n’echiche “n’ihi nwanyị kpatara” / “n’ihi nwoke kpatara,” ma ọ bụ “maka nwanyị” / “maka nwoke.” Okwu Grik e ji mee ihe n’ebe a nwere ike igosi ihe kpatara ihe ma ọ bụ nzube ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γὰρ
  choice: N’ihi na n’ezie
  rationale: Nkebiokwu a na-enye ihe kpatara okwu bu ya ụzọ ma na-emesikwa ya ike; nsụgharị a na-echekwa ọrụ γάρ na nkwusi ike nke καί n’Igbo dị mfe nghọta.
- source_word: ἐκτίσθη
  choice: e kere
  rationale: κτίζω pụtara ‘ike/kee’; ụdị a na-egosi na onye a na-ekwu maka ya natara omume ahụ ma dabara n’arụmụka banyere okike.
- source_word: ἀνὴρ
  choice: nwoke
  rationale: N’ebe a, okwu ahụ na-ezo aka n’ụdị nwoke n’akụkọ okike, ọ bụghị naanị di.
- source_word: διὰ τὴν γυναῖκα
  choice: n’ihi nwanyị
  rationale: διά tinyere accusative nwere ike igosi ihe kpatara ihe ma ọ bụ nzube ya. ‘N’ihi’ na-echekwa oghere nghọta abụọ ahụ karịa ịkọwapụta naanị otu.
- source_word: ἀλλὰ
  choice: kama
  rationale: ‘Kama’ na-egosi ọdịiche siri ike dị n’etiti ahịrịokwu abụọ ahụ n’ụzọ ebumpụta ụwa n’Igbo.
- source_word: γυνὴ
  choice: nwanyị
  rationale: N’ihi njikọ ya na okike, okwu a na-ezo aka n’ụdị nwanyị n’ozuzu, ọ bụghị naanị nwunye.
- source_word: διὰ τὸν ἄνδρα
  choice: n’ihi nwoke
  rationale: A sụgharịrị ya n’otu ụzọ ahụ dị ka διά nke mbụ iji chekwaa myirịta na enweghị mkpebi doro anya n’etiti ihe kpatara ihe na nzube ya.
theological_decisions:
- issue: Ma ἀνήρ/γυνή kwesịrị ịbụ ‘nwoke/nwanyị’ ka ọ bụ ‘di/nwunye’
  choice: nwoke/nwanyị
  alternative: di/nwunye
  rationale: Ngwaa ‘e kere’ na-ejikọta okwu a na akụkọ okike, ya mere okwu gbasara nwoke na nwanyị n’ozuzu dabara karịa ime ka ọ bụrụ naanị mmekọrịta alụmdi na nwunye.
- issue: Ma διά + accusative ga-abụ naanị nzube ka ọ bụ ihe kpatara ihe
  choice: n’ihi
  alternative: maka / n’ihi nzube nke
  rationale: ‘N’ihi’ n’Igbo nwere ike ibu echiche nke ihe kpatara ihe ma ọ bụ ihe e bu n’obi, ya mere ọ naghị ekpochapụ mgbagwoju anya dị n’asụsụ Grik.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke ugwu ya dị mma ma dịkwa mfe ndị na-agụ akwụkwọ taa ịghọta. E debere nhazi abụọ ahụ n’ụdị yiri ibe ha iji gosipụta ọdịiche Pọl mere.
