reference: 1 Corinthians 11:7
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀνὴρ μὲν γὰρ οὐκ ὀφείλει κατακαλύπτεσθαι τὴν κεφαλήν, εἰκὼν καὶ δόξα θεοῦ ὑπάρχων· ⸀ἡ γυνὴ δὲ δόξα ἀνδρός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/007.yaml
  text: For a man ought not to cover his head[a], since he is the image and glory of God[b]; but the woman is the glory of man.
translation:
  language: ig
  text: N’ihi na nwoke[a] ekwesịghị ikpuchi isi ya[b], ebe ọ bụ onyinyo na ebube Chineke; ma nwanyị bụ ebube nwoke.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị “nwoke” na “nwanyị” n’amaokwu a dị ka “di” na “nwunye”; okwu Grik ἀνήρ na γυνή nwere ike ịpụta nke ọ bụla n’ime ha dabere n’ọnọdụ okwu.
    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ, “itinye akwa mkpuchi n’isi ya”; okwu Grik ahụ na-ekwu n’ozuzu ya banyere ikpuchi isi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνὴρ
  choice: nwoke
  rationale: “Nwoke” na-egosi nwoke n’ozuzu ya n’ọnọdụ a, kama ime ka okwu ahụ bụrụ naanị banyere di.
- source_word: ὀφείλει
  choice: ekwesịghị
  rationale: N’usoro ya na οὐ, “ekwesịghị” na-egosi ọrụ ma ọ bụ ihe kwesịrị ekwesị n’asụsụ Igbo dị mfe, n’emeghị ka ọ bụrụ iwu siri ike karịa okwu Grik ahụ.
- source_word: κατακαλύπτεσθαι τὴν κεφαλήν
  choice: ikpuchi isi ya
  rationale: Nke a na-edobe okwu ahụ n’ozuzu ya banyere ikpuchi isi, n’akọwaghị ụdị ihe mkpuchi a na-ekwu maka ya.
- source_word: εἰκὼν
  choice: onyinyo
  rationale: “Onyinyo” bụ okwu Igbo a na-ejikarị atụgharị εἰκών, ọ na-edobekwa njikọ okwu a nwere ike inwe na akụkọ okike.
- source_word: δόξα
  choice: ebube
  rationale: “Ebube” na-edobe ịdị arọ nke okwu ahụ n’ebe abụọ ọ pụtara, ma na-ezere ime ka ihe ọ pụtara bụrụ naanị nsọpụrụ.
- source_word: θεοῦ
  choice: Chineke
  rationale: “Ebube Chineke” na-edobe njikọ nke genitive ahụ n’enweghị mgbakwunye nkọwa.
- source_word: ὑπάρχων
  choice: ebe ọ bụ
  rationale: Nkebi a na-egosi ihe kpatara okwu bu ya ụzọ; “ebe ọ bụ” na-eme ka njikọ ahụ doo anya n’Igbo eke.
- source_word: ἡ γυνὴ
  choice: nwanyị
  rationale: “Nwanyị” na-edobe ọdịiche dị n’etiti nwoke na nwanyị n’ozuzu ya, kama ịkpa ya ókè n’ebe nwunye nọ.
- source_word: ἀνδρός
  choice: nwoke
  rationale: “Ebube nwoke” na-edobe otu nghọta zuru ụwa ọnụ nke ἀνήρ e ji mee ihe na mbido amaokwu ahụ, ma ghara ịkọwa ya kpọmkwem dị ka di ya.
theological_decisions:
- issue: Ma ἀνήρ na γυνή̀ pụtara nwoke/nwanyị ka ọ bụ di/nwunye
  choice: nwoke/nwanyị
  alternative: di/nwunye
  rationale: Arụmụka gbara amaokwu a gburugburu na-ekwu banyere nwoke na nwanyị n’ofufe na n’ihe gbasara okike. Nhọrọ “nwoke/nwanyị” na-edobe obosara a, ebe nkọwa ala peeji na-egosi na “di/nwunye” ka kwere omume n’asụsụ Grik.
- issue: Otu e si edobe okwu Pọl nke na-ekwu na nwanyị bụ ebube nwoke
  choice: ma nwanyị bụ ebube nwoke
  alternative: ma nwanyị na-egosipụta ebube nwoke
  rationale: Okwu Grik ji ἐστιν kwuo ya ozugbo. Nsụgharị a anaghị eme ka esemokwu echiche dị n’okwu ahụ dị nro, ọ naghịkwa agbakwunye nkọwa na-adịghị n’ederede.
translation_notes:
  register: E ji Igbo izugbe nke oge a, dị ùgwù ma dị mfe nghọta mee ihe. A hapụrụ usoro echiche na ịdị arọ nke “onyinyo” na “ebube” dịka ha dị n’ederede, ma tinye nkọwa ala peeji maka nghọta ndị ọzọ okwu Grik ahụ nwere ike ibu.
