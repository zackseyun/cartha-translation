id: 1CO.11.27
reference: 1 Corinthians 11:27
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ὥστε ὃς ἂν ἐσθίῃ τὸν ⸀ἄρτον ἢ πίνῃ τὸ ποτήριον τοῦ κυρίου ⸀ἀναξίως, ἔνοχος ἔσται τοῦ σώματος καὶ τοῦ αἵματος τοῦ κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/027.yaml
  text: Therefore[b][a], whoever eats the bread or drinks the cup of the Lord in an unworthy manner will be guilty concerning the body and blood of the Lord.
translation:
  language: ig
  text: Ya mere, onye ọ bụla nke na-eri achịcha ahụ ma ọ bụ na-aṅụ iko nke Onyenwe anyị n'ụzọ na-ekwesịghị ekwesị[a] ga-enwe ikpe ọmụma n’ihe banyere ahụ na ọbara Onyenwe anyị.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “N'ụzọ na-ekwesịghị ekwesị” na-akọwa otú mmadụ si eri ma ọ bụ aṅụ; ọ naghị ekwu na onye ahụ n’onwe ya erughị eru.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya n’ụzọ ọdịnala karịa dịka, “ọ ga-enwe ikpe ọmụma maka ahụ na ọbara Onyenwe anyị.” Usoro okwu Grik na-enye ohere ntụgharị a; “n’ihe banyere” na-egosi na ikpe ọmụma ahụ metụtara ahụ na ọbara Onyenwe anyị n’ebughị ụzọ kọwaa kpọmkwem ụdị ibu ọrụ ahụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὥστε
  choice: Ya mere
  rationale: Na-egosi nkwubi okwu sitere n’ihe Pọl kwuru tupu nke a banyere Nri Anyasị nke Onyenwe anyị.
- source_word: ὃς ἂν
  choice: onye ọ bụla nke
  rationale: Na-egosipụta onye ọbụla n’enweghị ịkpa ókè, dịka njikọ nnọchiaha na ἄν si arụ ọrụ.
- source_word: ἐσθίῃ τὸν ἄρτον
  choice: na-eri achịcha ahụ
  rationale: Na-edobe ihe omume ahụ n’ụdị izugbe ma na-ezo aka n’achịcha a na-ekwu banyere ya.
- source_word: ἢ
  choice: ma ọ bụ
  rationale: Na-edobe njikọ nkewa dị na Grik; ịdọ aka ná ntị ahụ metụtara ime nke ọ bụla n’ime omume abụọ ahụ n’ụzọ na-ekwesịghị ekwesị.
- source_word: πίνῃ τὸ ποτήριον τοῦ κυρίου
  choice: na-aṅụ iko nke Onyenwe anyị
  rationale: Na-edobe okwu nnọchianya nke isi iyi, ebe ‘iko’ nọchiri anya ihe dị n’ime ya, ma gosipụta mmekọrịta ya na Onyenwe anyị.
- source_word: ἀναξίως
  choice: n'ụzọ na-ekwesịghị ekwesị
  rationale: Ọ bụ adverb na-akọwa otú mmadụ si eri ma ọ bụ aṅụ, ọ bụghị na-ekpebi uru mmadụ n’onwe ya bara.
- source_word: ἔνοχος ἔσται
  choice: ikpe ga-ama ya
  rationale: Akpaalaokwu Igbo a na-egosipụta ikpe ọmụma na ibu ọrụ n’ụzọ doro anya ma dị arọ.
- source_word: τοῦ σώματος καὶ τοῦ αἵματος τοῦ κυρίου
  choice: n’ihe banyere ahụ na ọbara Onyenwe anyị
  rationale: Na-ahapụ obosara ihe genitive jikọrọ na ἔνοχος pụtara—ikpe ọmụma ma ọ bụ ibu ọrụ gbasara ahụ na ọbara—n’etinyeghị nkọwa iwu nke gafere isi iyi.
theological_decisions:
- issue: Ihe ἀναξίως pụtara n’ihe gbasara Oriri Nsọ
  choice: Amaokwu ahụ katọrọ iri ma ọ bụ ịṅụ n’ụzọ na-ekwesịghị ekwesị.
  alternative: Amaokwu ahụ na-ekwu na onye ahụ n’onwe ya erughị eru.
  rationale: ἀναξίως bụ adverb na-akọwa ἐσθίῃ na πίνῃ; ya mere nsụgharị ahụ lekwasịrị anya n’ụzọ e si eme omume ahụ, ọ bụghị uru onye ahụ bara.
- issue: Ike njikọ ἢ n’etiti iri na ịṅụ
  choice: Ịdọ aka ná ntị ahụ metụtara ma mmadụ mee nke ọ bụla n’ime ha n’ụzọ na-ekwesịghị ekwesị.
  alternative: Ịgụ omume abụọ ahụ dịka otu ụzọ okwu nke pụtara ‘na’.
  rationale: Isiokwu Grik ji njikọ nkewa ἢ mee ihe, ya mere e debere ya dịka ‘ma ọ bụ’.
- issue: Mmekọrịta ikpe ọmụma na ahụ na ọbara Onyenwe anyị
  choice: ‘n’ihe banyere ahụ na ọbara Onyenwe anyị’
  alternative: ‘ikpe ga-ama ya maka ahụ na ọbara Onyenwe anyị’
  rationale: Nhọrọ bụ isi na-echekwa ọdịdị sara mbara nke genitive na ἔνοχος, ebe nhọrọ ọzọ bụ ntụgharị ọdịnala nke dị nso n’usoro okwu Grik.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. ‘Onyenwe anyị’ na-edobe aha nsọ κύριος; ‘ikpe ga-ama ya’ bụ akpaalaokwu Igbo nkịtị maka ikpe ọmụma. E debere ‘ma ọ bụ’ na esemokwu dị n’okwu banyere ụdị ibu ọrụ ahụ.
