    text: A pụkwara ịsụgharị ya n’ụzọ ọdịnala karịa dịka, “ọ ga-enwe ikpe ọmụma maka ahụ na ọbara Onyenwe anyị.” Usoro okwu Grik na-enye ohere ntụgharị a; “n’ihe banyere” na-egosi na ikpe ọmụma ahụ metụtara ahụ na ọbara Onyenwe anyị n’ebughị ụzọ kọwaa kpọmkwem ụdị ibu ọrụ ahụ.
    reason: lexical_alternative
