revisions:
- from: Ya mere, onye ọ bụla nke na-eri achịcha ahụ ma ọ bụ na-aṅụ iko nke Onyenwe anyị n'ụzọ na-ekwesịghị ekwesị[a], ikpe ga-ama ya n’ihe banyere ahụ na ọbara Onyenwe anyị.[b]
  to: Ya mere, onye ọ bụla nke na-eri achịcha ahụ ma ọ bụ na-aṅụ iko nke Onyenwe anyị n'ụzọ na-ekwesịghị ekwesị[a] ga-enwe ikpe ọmụma n’ihe banyere ahụ na ọbara Onyenwe anyị.[b]
  rationale: The revision makes the predicate ἔνοχος ἔσται explicit as personal guilt/liability rather than merely the arrival of judgment. It retains the draft's careful, non-sectarian handling of the debated genitive relation and its accurate understanding of ἀναξίως as an adverb of manner. Footnote a is tightened so that it addresses personal worthiness rather than intrinsic human value.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T18:13:09Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the inferential force of Ὥστε, the indefinite scope of ὃς ἂν, the disjunction ἢ ('ma ọ bụ'), and the fact that ἀναξίως modifies the manner of eating or drinking. Its rendering of the genitive with ἔνοχος appropriately avoids imposing a more specific theory of liability.
  naturalness: Most of the verse is clear, modern Standard Igbo. However, “ikpe ga-ama ya” more readily conveys that a judgment will come upon or condemn the person, whereas ἔνοχος ἔσται directly predicates guilt/liability. “Ọ ga-enwe ikpe ọmụma” more directly states the person's culpability and retains the cautious relational phrase that follows.
  terminology: “Onyenwe anyị,” “ahụ,” and “ọbara” are appropriate and consistent. The note on ἀναξίως should avoid the distracting expression “abaghị uru” ('has no value'), since the relevant contrast is personal worthiness/fitness, not a person's value.
  issues:
  - severity: medium
    issue: The main-clause rendering “ikpe ga-ama ya” does not most directly express ἔνοχος ἔσται.
    rationale: The Greek says that the person will be guilty/liable with respect to the Lord's body and blood. Revising to “ọ ga-enwe ikpe ọmụma” makes culpability explicit without narrowing the ambiguous genitive relation.
  - severity: low
    issue: Footnote a includes “onye ahụ n’onwe ya abaghị uru.”
    rationale: This can suggest that the alternative concerns a person's intrinsic value. The grammatical point is instead that the adverb does not describe the participant as personally unworthy or unfit.
  revised_text: Ya mere, onye ọ bụla nke na-eri achịcha ahụ ma ọ bụ na-aṅụ iko nke Onyenwe anyị n'ụzọ na-ekwesịghị ekwesị[a] ga-enwe ikpe ọmụma n’ihe banyere ahụ na ọbara Onyenwe anyị.[b]
  revised_footnotes:
