review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the cup saying, the direct identification of the cup with the new covenant, «n’ọbara m» for ἐν τῷ ἐμῷ αἵματι, the repeated-command force, plural addressees, and the memorial purpose. However, «mgbe ha risịrị nri anyasị» supplies «ha» where the Greek temporal infinitive leaves the eater(s) unexpressed. An impersonal Igbo construction preserves that source-level non-specification more closely.
  naturalness: The Igbo is generally clear, modern, and suitably reverent. «Mgbe e richara nri anyasị» is natural Standard Igbo and avoids assigning an explicit subject unnecessarily.
  terminology: «Iko», «ọgbụgba ndụ ọhụrụ», «ọbara m», and «iji na-echeta m» are appropriate and do not impose sacramental or denominational interpretation. No footnote is required for this small source-fidelity adjustment.
  issues:
  - severity: low
    issue: Explicit subject in the temporal clause
    rationale: «Ha» in «mgbe ha risịrị nri anyasị» is contextually plausible, but μετὰ τὸ δειπνῆσαι does not state who ate. «Mgbe e richara nri anyasị» retains the natural contextual sense without adding a subject.
  revised_text: N’otu aka ahụ kwa, mgbe e richara nri anyasị, o weere iko ahụ, na-asị, “Iko a bụ ọgbụgba ndụ ọhụrụ ahụ n’ọbara m. Na-emenụ nke a mgbe ọ bụla unu na-aṅụ ya, iji na-echeta m.”
