id: 1CO.11.25
reference: 1 Corinthians 11:25
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὡσαύτως καὶ τὸ ποτήριον μετὰ τὸ δειπνῆσαι, λέγων· Τοῦτο τὸ ποτήριον ἡ καινὴ διαθήκη ἐστὶν ἐν τῷ ἐμῷ αἵματι· τοῦτο ποιεῖτε, ὁσάκις ⸀ἐὰν πίνητε, εἰς τὴν ἐμὴν ἀνάμνησιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/025.yaml
  text: In the same way also[a], after supper, he took the cup, saying, “This cup is the new covenant in my blood. Keep doing this, whenever you drink it[b], in remembrance of me.”
translation:
  language: ig
  text: N’otu aka ahụ kwa, mgbe e richara nri anyasị, o weere iko ahụ, na-asị, “Iko a bụ ọgbụgba ndụ ọhụrụ ahụ n’ọbara m. Na-emenụ nke a mgbe ọ bụla unu na-aṅụ ya, iji na-echeta m.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡσαύτως καὶ
  choice: N’otu aka ahụ kwa
  rationale: Na-egosi na ihe e mere banyere iko ahụ kwekọrọ n’ihe e mere banyere achịcha, ma na-echekwa ma echiche ὡσαύτως ma nke καί n’Igbo dị mfe nghọta.
- source_word: τὸ ποτήριον
  choice: iko ahụ
  rationale: “Iko” bụ okwu Igbo nkịtị, doro anya; “ahụ” na-egosi iko a kpọtụrụ kpọmkwem n’ọnọdụ a, na-enweghị itinye asụsụ emume pụrụ iche.
- source_word: μετὰ τὸ δειπνῆσαι
  choice: mgbe ha risịrị nri anyasị
  rationale: Nkebiokwu ahụ na-egosi oge, ya bụ mgbe e risịrị nri. E tinyere “ha” dịka onyeisiokwu a ghọtara site n’ọnọdụ okwu ahụ, ọ bụghị dịka nkọwa okwukwe agbakwunyere.
- source_word: λέγων
  choice: o weere iko ahụ, na-asị
  rationale: “Na-asị” sụgharịrị participle ahụ kpọmkwem; “o weere iko ahụ” sitere n’omume a na-aghọta site n’usoro okwu banyere achịcha na iko ma na-eme ka ahịrịokwu ahụ zuo oke n’Igbo.
- source_word: ἡ καινὴ διαθήκη
  choice: ọgbụgba ndụ ọhụrụ ahụ
  rationale: διαθήκη n’ebe a na-adabere n’echiche Akwụkwọ Nsọ banyere ọgbụgba ndụ e ji ọbara mee; “ọgbụgba ndụ” ka “ọgbụgba ndụ ikpeazụ/testament” dabara n’ọnọdụ a.
- source_word: ἐν τῷ ἐμῷ αἵματι
  choice: n’ọbara m
  rationale: Nke a na-echekwa preposition ἐν n’ụzọ dị nso ma ghara ịkọwa ya n’ike dịka “site n’ọbara m” ma ọ bụ “e ji ọbara m kwado ya.”
- source_word: τοῦτο ποιεῖτε
  choice: Na-emenụ nke a
  rationale: Ụdị iwu na-aga n’ihu n’Igbo na-egosi omume a ga na-eme ugboro ugboro, kwekọrọ na present imperative na nkebiokwu na-esochi ya.
- source_word: ὁσάκις ἐὰν πίνητε
  choice: mgbe ọ bụla unu na-aṅụ ya
  rationale: Na-echekwa echiche nke oge ọ bụla omume ahụ mere. “Ya” bụ ihe a na-aghọta na ọ na-ezo aka n’ihe dị n’iko ahụ, ma ọ bụ n’iko dịka okwu metonymic.
- source_word: εἰς τὴν ἐμὴν ἀνάμνησιν
  choice: iji na-echeta m
  rationale: Na-egosi ebumnuche nke omume ncheta/ịkpọta n’uche, n’Igbo nkịtị ma dị ùgwù, na-enweghị ime ka ọ bụrụ naanị akara efu.
theological_decisions:
- issue: Ihe διαθήκη pụtara n’okwu banyere iko ahụ
  choice: ọgbụgba ndụ
  alternative: testament / akwụkwọ nketa
  rationale: Ọnọdụ banyere ọbara na ndabere Akwụkwọ Nsọ na-akwado “ọgbụgba ndụ.” Nhọrọ a anaghị ebubata ojiji ụka mechara pụta nke nwere ike ime ka ihe okwu Grik pụtara ghara ido anya.
- issue: Mmekọrịta iko ahụ na ọgbụgba ndụ ahụ
  choice: “Iko a bụ ọgbụgba ndụ ọhụrụ ahụ n’ọbara m”
  alternative: “Iko a na-anọchi anya ọgbụgba ndụ ọhụrụ ahụ” ma ọ bụ “Iko a bụ ọgbụgba ndụ ọhụrụ ahụ e ji ọbara m kwado”
  rationale: E chekwara nkwupụta njirimara nke Grik dịka ọ dị. A naghị akọwa ya n’ụzọ ga-ekpebi esemokwu gbasara ọnụnọ n’emume ma ọ bụ ihe nnọchianya.
- issue: Onyeisiokwu a ghọtara na μετὰ τὸ δειπνῆσαι
  choice: ha risịrị
  alternative: o risịrị / e risịrị
  rationale: Grik articular infinitive anaghị ekwupụta onyeisiokwu n’onwe ya. “Ha” dabara n’ọnọdụ oriri ndị nọkọtara ọnụ, ma a naghị eji ya wuo nkwupụta okwukwe ọzọ.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke oge a, dị ùgwù ma dị mfe nghọta. E jiri “unu” na ụdị iwu “Na-emenụ” gosi plural nke πίνητε na ποιεῖτε. Enweghị ihe nrịbama nkọwa ala peeji n’ihi na ihe odide isi anaghị achọ nkọwa dị mkpa maka mbipụta a.
