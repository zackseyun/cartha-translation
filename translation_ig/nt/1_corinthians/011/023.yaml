id: 1CO.11.23
reference: 1 Corinthians 11:23
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἐγὼ γὰρ παρέλαβον ἀπὸ τοῦ κυρίου, ὃ καὶ παρέδωκα ὑμῖν, ὅτι ὁ κύριος Ἰησοῦς ἐν τῇ νυκτὶ ᾗ ⸀παρεδίδετο ἔλαβεν ἄρτον
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/023.yaml
  text: 'For I received from the Lord what I also delivered to you: that the Lord Jesus[a], on the night when he was being handed over, took bread'
translation:
  language: ig
  text: 'N’ihi na ihe m natara n’aka Onyenwe anyị ka m nyefekwara unu: na Onyenwe anyị Jizọs, n’abalị ahụ a na-enyefe ya[a], were achịcha.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, dị ka a na-asụgharịkarị ya, “a raara ya nye.”
    reason: alternative_reading
lexical_decisions:
- source_word: παρέλαβον
  choice: ihe m natara
  rationale: Ọ na-egosi na Pọl natara ozizi ma ọ bụ ọdịnala a; ọ na-echekwa njikọ ya na παρέδωκα.
- source_word: ἀπὸ τοῦ κυρίου
  choice: n’aka Onyenwe anyị
  rationale: Nke a na-egosi Onyenwe anyị dị ka isi iyi nke ihe Pọl natara, n’asụghị ihe Grik na-ekwughị.
- source_word: παρέδωκα
  choice: nyefekwara
  rationale: “Nyefee” bụ okwu Igbo doro anya maka inyefe ihe a natara n’aka ndị ọzọ, ma na-ejikọta echiche nke ịnata na inyefe.
- source_word: ὅτι
  choice: na
  rationale: Ọ na-ewebata ọdịnaya nke ihe Pọl nyefere ha n’ụzọ Igbo nkịtị.
- source_word: κύριος
  choice: Onyenwe anyị
  rationale: Ọ na-echekwa nsọpụrụ na ihe okwu ahụ pụtara banyere Kraịst n’Igbo Akwụkwọ Nsọ.
- source_word: ἐν τῇ νυκτὶ ᾗ
  choice: n’abalị ahụ
  rationale: Nkebiokwu a bụ Igbo dị mma nke na-edobe oge ihe ahụ mere; ahịrịokwu na-esochi ya mezuru echiche ahụ.
- source_word: παρεδίδετο
  choice: a na-enyefe ya
  rationale: Ọ na-echekwa imperfect passive na obosara ihe παραδίδωμι pụtara, n’emeghị ka ọ bụrụ naanị nrara Judas raara ya.
- source_word: ἔλαβεν ἄρτον
  choice: were achịcha
  rationale: Nke a bụ ụzọ Igbo nkịtị si ekwu omume ahụ, ma ọ naghị atụkwasị “otu ogbe” nke Grik ekwughị.
theological_decisions:
- issue: Nsụgharị παρεδίδετο n’akụkọ banyere nri Onyenwe anyị
  choice: a na-enyefe ya
  alternative: a raara ya nye
  rationale: Ngwaa Grik ahụ nwere ike ịpụta inyefe mmadụ ma ọ bụ ịrara ya nye. Nsụgharị bụ isi na-echekwa obosara na esemokwu dị n’okwu ahụ; ihe odide ala peeji na-edobe nsụgharị ọdịnala.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke nwere ugwu ma dịkwa mfe nghọta. E debere usoro ‘natara…nyefekwara’ iji gosipụta njikọ okwu abụọ Pọl ji, ebe ‘a na-enyefe ya’ na-echekwa ambiguity nke isi mmalite Grik.
