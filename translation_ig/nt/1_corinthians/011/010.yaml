  source_fidelity: 'The Igbo text closely represents the Greek: “N’ihi nke a” conveys διὰ τοῦτο; “nwanyị kwesịrị” reflects the generic-singular subject and ὀφείλει; and “inwe ikike n’isi ya” deliberately retains the lexically difficult ἐξουσίαν ἔχειν ἐπὶ τῆς κεφαλῆς without adding a covering or sign. “N’ihi ndị mmụọ ozi” appropriately renders διὰ τοὺς ἀγγέλους without supplying a theory for the reference.'
  naturalness: The sentence is clear, idiomatic Standard Igbo overall. Although “ikike n’isi ya” is an unusual expression in ordinary Igbo, this reflects the deliberately compressed and disputed Greek wording; the accompanying note makes the tension intelligible without overtranslating it.
  terminology: “Nwanyị” properly preserves the broader woman/wife ambiguity without narrowing it to “nwunye.” “Ikike” is the appropriate primary equivalent for ἐξουσία, and “ndị mmụọ ozi” is the most likely contextual sense of ἄγγελοι. Both footnotes accurately preserve the interpretive and lexical alternatives and their anchors are correctly placed.
