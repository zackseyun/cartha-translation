id: 1CO.11.10
reference: 1 Corinthians 11:10
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: διὰ τοῦτο ὀφείλει ἡ γυνὴ ἐξουσίαν ἔχειν ἐπὶ τῆς κεφαλῆς διὰ τοὺς ἀγγέλους.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/010.yaml
  text: For this reason the woman ought to have authority on her head[b][a], because of the angels.
translation:
  language: ig
  text: N’ihi nke a, nwanyị kwesịrị inwe ikike n’isi ya[a], n’ihi ndị mmụọ ozi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n’ụzọ na-akọwa ihe okwu ahụ nwere ike ịpụta, “kwesịrị inwe akara nke ikike n’isi ya.” Ederede Grik kwuru “ikike”; o kwughị “akara” ma ọ bụ “ihe mkpuchi” kpọmkwem.
    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ “ndị ozi,” ọ bụ ezie na “ndị mmụọ ozi” yikarịrị ka ọ bụ ihe okwu ahụ pụtara n’ebe a.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: N’ihi nke a
  rationale: Ọ na-egosi ihe kpatara nkwubi okwu Pọl ji soro arụmụka gara aga, n’asụsụ Igbo doro anya.
- source_word: ὀφείλει
  choice: kwesịrị
  rationale: Ọ na-egosi ọrụ ma ọ bụ ihe kwesịrị ekwesị, n’etinyeghị ya n’ụdị iwu siri ike karịa okwu Grik ahụ.
- source_word: ἡ γυνὴ
  choice: nwanyị
  rationale: Ọ na-edobe nghọta izugbe nke nwanyị n’arụmụka gbasara nwoke na nwanyị, kama ịkpa ya ókè nye nwunye.
- source_word: ἐξουσίαν
  choice: ikike
  rationale: Nke a bụ ihe okwu Grik kwuru kpọmkwem; ọ naghị etinye ‘akara’ ma ọ bụ ‘ihe mkpuchi’ nke na-adịghị n’ederede.
- source_word: ἔχειν
  choice: inwe
  rationale: Ọ bụ ntụgharị nkịtị nke infinitive Grik ahụ, na-enweghị ịgbakwunye echiche ‘iyi’ site n’okwu gbara ya gburugburu.
- source_word: ἐπὶ τῆς κεφαλῆς
  choice: n’isi ya
  rationale: Ọ bụ ụzọ Igbo dị mfe ma kwekọọ na nkebiokwu ebe Grik ahụ, ma na-ahapụ kpọmkwem ihe ọ pụtara ka ọ ghara imechi.
- source_word: διὰ τοὺς ἀγγέλους
  choice: n’ihi ndị mmụọ ozi
  rationale: διά tinyere accusative na-egosikarị ihe kpatara ya; ‘ndị mmụọ ozi’ bụ nghọta kachasị yie ἄγγελοι n’ebe a.
theological_decisions:
- issue: Ihe ἐξουσίαν ἔχειν ἐπὶ τῆς κεφαλῆς pụtara
  choice: inwe ikike n’isi ya
  alternative: inwe akara nke ikike n’isi ya; iyi ihe mkpuchi isi dị ka akara nke ikike
  rationale: Ederede Grik ekwughị ‘akara’ ma ọ bụ ‘ihe mkpuchi.’ Isi ederede na-edobe okwu ya na mgbagwoju anya ya, ebe nkọwa ala peeji na-egosi nghọta ntụgharị a na-ahụkarị.
- issue: Onye ma ọ bụ ihe ἀγγέλους na-ezo aka na ya
  choice: ndị mmụọ ozi
  alternative: ndị ozi
  rationale: ἄγγελος nwere ike ịpụta onye ozi ma ọ bụ mmụọ ozi, ma plural ahụ na-enweghị nkọwa ọzọ n’ebe a yikarịrị ka ọ na-ezo aka n’ụmụ mmụọ nke eluigwe; a naghị etinye ozizi pụrụ iche banyere ihe mere e ji kpọọ ha aha.
- issue: Ókè nghọta γυνή
  choice: nwanyị
  alternative: nwunye
  rationale: Arụmụka gbara amaokwu a gburugburu bụ banyere nwoke na nwanyị n’ụzọ izugbe; ya mere, ‘nwanyị’ anaghị eme ka okwu ahụ bụrụ naanị ihe gbasara di na nwunye.
translation_notes:
  register: Ejiri Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. E debere ahịrịokwu ahụ nso n’usoro na esemokwu nke Grik, n’agbanyeghị na “ikike n’isi ya” abụghị nkebiokwu a na-ejikarị eme ihe n’Igbo, n’ihi na ịkọwa ya karịa nke ahụ ga-etinye nkọwa a na-arụrịta ụka n’isi ederede.
