base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/021.yaml
  text: For each one goes ahead with his own supper when it is time to eat, and one is hungry while another gets drunk.
translation:
  language: ig
  text: N’ihi na, mgbe a na-eri nri, onye ọ bụla na-ebu ụzọ were nri anyasị nke ya[a]; otu onye agụụ na-agụ, ebe onye ọzọ na-aṅụbiga mmanya ókè[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “na-ewere nri nke ya tupu ndị ọzọ”; ngwaa Grik ahụ pụrụ imesi ike n’iwere ihe tupu oge ya ma ọ bụ n’ịga n’ihu n’echeghị ndị ọzọ.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “otu onye na-agụ agụụ, ebe mmanya egbuola onye ọzọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕκαστος
  choice: onye ọ bụla
  rationale: Nke a na-echekwa echiche nkesa nke onye n’otu n’otu n’ụzọ Igbo si ekwu ya nke ọma.
- source_word: γὰρ
  choice: N’ihi na
  rationale: Ọ na-egosi na amaokwu a na-akọwa ihe mere Pọl ji baara ha mba n’okwu bu ya ụzọ.
- source_word: τὸ ἴδιον δεῖπνον
  choice: nri anyasị nke ya
  rationale: δεῖπνον bụ nri, karịchaa nri anyasị, ebe ἴδιον na-emesi ike na ọ bụ nri nke onye ahụ n’onwe ya kama nri ha na-erikọ ọnụ.
- source_word: προλαμβάνει
  choice: na-ebu ụzọ were
  rationale: Nhọrọ a na-egosi ime ihe tupu ndị ọzọ ma ọ bụ ịga n’ihu n’echeghị ha; e debere obosara ihe ngwaa Grik ahụ pụrụ ịpụta na nkọwa ala peeji.
- source_word: ἐν τῷ φαγεῖν
  choice: mgbe ha na-eri nri
  rationale: Nkebi a bụ nke oge; ntụgharị a dị nso na Grik ma bụrụkwa Igbo doro anya.
- source_word: ὃς μὲν ... ὃς δὲ
  choice: otu onye ... onye ọzọ
  rationale: Ọ na-egosipụta ọdịiche dị n’etiti ọnọdụ ndị sonyere na nri ahụ.
- source_word: πεινᾷ
  choice: agụụ na-agụ
  rationale: Ọ na-egosi ọnọdụ onye ahụ nọ na ya n’oge ahụ n’enweghị mgbakwunye nkọwa.
- source_word: μεθύει
  choice: na-aṅụbigakwa mmanya ókè
  rationale: Ọ na-egosi ịṅụ ruo n’ókè nke ịṅụbiga mmanya ókè, ghara ime ka ihe Pọl katọrọ dị nro.
theological_decisions:
- issue: Nrụtụ aka nke onye n’otu n’otu na okike nwoke
  choice: nri anyasị nke ya
  alternative: nri anyasị nke ha
  rationale: Igbo anaghị achọ ka nnọchiaha ebe a gosi nwoke kpọmkwem; “nke ya” na-echekwa otu onye nke ἕκαστος ma ghara ịgbakwunye nwoke ebe usoro Igbo na-adịghị achọ ya.
- issue: Ụdị mmejọ ahụ mere na Nri Anyasị Onyenwe anyị
  choice: na-aṅụbigakwa mmanya ókè
  alternative: mmanya na-egbu ya
  rationale: μεθύει na-enye ohere maka ọnọdụ ma ọ bụ usoro ịṅụbiga mmanya ókè. Isi ederede na-egosi omume ahụ n’Igbo eke, ebe nkọwa [b] na-echekwa ntụgharị nke ọnọdụ onye ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta, dee ya. “Nri anyasị” na-edobe echiche δεῖπνον na njikọ ya na nri a na-ekwu maka ya n’akụkụ amaokwu ndị a; akara nkọwa [a] na [b] pụtara n’isi ederede dịka achọrọ.
