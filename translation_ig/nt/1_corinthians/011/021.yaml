revisions:
- from: N’ihi na mgbe ha na-eri nri, onye ọ bụla na-ebu ụzọ were nri anyasị nke ya[a]; ya mere, agụụ na-agụ otu onye, ebe onye ọzọ na-aṅụbigakwa mmanya ókè[b].
  to: N’ihi na, mgbe a na-eri nri, onye ọ bụla na-ebu ụzọ were nri anyasị nke ya[a]; otu onye agụụ na-agụ, ebe onye ọzọ na-aṅụbiga mmanya ókè[b].
  rationale: The revision removes the unsupported inferential and additive particles, retains the Greek coordination and contrast, and clarifies the footnoted alternative as a state of drunkenness. It also uses a natural generic temporal construction while preserving the temporal sense of ἐν τῷ φαγεῖν.
