id: 1CO.11.11
reference: 1 Corinthians 11:11
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: πλὴν οὔτε ⸂γυνὴ χωρὶς ἀνδρὸς οὔτε ἀνὴρ χωρὶς γυναικὸς⸃ ἐν κυρίῳ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/011.yaml
  text: Nevertheless[a], in the Lord woman is not apart from man, nor man apart from woman.
translation:
  language: ig
  text: Ma otu ọ dị[a], n’ime Onyenwe anyị, nwanyị adịghị anọpụ iche n’ebe nwoke nọ, nwoke adịghịkwa anọpụ iche n’ebe nwanyị nọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, ‘nwunye adịghị anọpụ iche n’ebe di ya nọ, di adịghịkwa anọpụ iche n’ebe nwunye ya nọ.’ Okwu Grik ndị a nwere ike ịpụta ma nwoke/nwanyị ma di/nwunye; a họọrọ echiche sara mbara ebe a n’ihi na okwu a yiri ka ọ gbasara mmadụ n’ozuzu ya, ọ bụghị naanị alụmdi na nwunye.
    reason: alternative_reading
lexical_decisions:
- source_word: πλὴν
  choice: Ma otu ọ dị
  rationale: Ọ na-egosi ntụgharị nke na-eme ka okwu ndị bu ya ụzọ guzozie, n’enweghị ịkagbu ha.
- source_word: γυνή
  choice: nwanyị
  rationale: Okwu Grik a nwere ike ịpụta ‘nwanyị’ ma ọ bụ ‘nwunye’; ebe a, okwu sara mbara bụ ‘nwanyị’ dabara n’otú Pọl si ekwu banyere nwoke na nwanyị n’ozuzu ha.
- source_word: ἀνήρ
  choice: nwoke
  rationale: O nwere ike ịpụta ‘nwoke’ ma ọ bụ ‘di’; a họọrọ ‘nwoke’ ka e chekwaa echiche sara mbara nke amaokwu a.
- source_word: χωρὶς
  choice: adịghị anọpụ iche n’ebe ... nọ
  rationale: Nkebiokwu a na-egosi na otu adịghị iche ma ọ bụ nwee onwe ya n’enweghị nke ọzọ; ọ na-ezere ịsụgharị ya dị ka nanị ọdịiche.
- source_word: ἐν κυρίῳ
  choice: n’ime Onyenwe anyị
  rationale: Nke a na-echekwa nkebiokwu Pọl nke na-egosi ọnọdụ ma ọ bụ mmekọrịta nke ndị nọ n’ime Onyenwe anyị.
- source_word: οὔτε ... οὔτε
  choice: adịghị ... adịghịkwa
  rationale: Usoro a na-echekwa ahịrịokwu abụọ na-agakọ ọnụ, na-enye ha otu ibu n’asụsụ Igbo.
theological_decisions:
- issue: Ma a ga-asụgharị γυνή / ἀνήρ dị ka ‘nwanyị/nwoke’ ka ọ bụ ‘nwunye/di’
  choice: nwanyị/nwoke
  alternative: nwunye/di
  rationale: Ihe gbara amaokwu a gburugburu na-ekwu banyere nwoke na nwanyị n’okike na n’ofufe, amaokwu a na-emekwa ka mmekọrịta ha guzozie. Nhọrọ sara mbara na-echekwa echiche ahụ, ebe nkọwa ala peeji na-egosi ihe ọzọ okwu Grik nwere ike ịpụta.
- issue: Ihe ‘χωρὶς’ pụtara n’ihe gbasara mmekọrịta nwoke na nwanyị
  choice: adịghị anọpụ iche n’ebe ... nọ
  alternative: enweghị ...
  rationale: Nhọrọ a na-echekwa echiche nke ịnọ iche ma ọ bụ ịnọrọ onwe ya n’enweghị ịkọwapụta kpọmkwem ụdị ndabere ahụ, ya mere ọ naghị edozi esemokwu nkà mmụta okpukpe nke ederede ahụ hapụrụ oghe.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma doo ndị nkịtị anya. ‘Onyenwe anyị’ na-echekwa aha nsọpụrụ κύριος, ebe ‘anọpụ iche n’ebe ... nọ’ na-egosipụta mmekọrịta χωρὶς n’enweghị ịgbakwunye nkọwa okpukpe na-adịghị n’ederede.
