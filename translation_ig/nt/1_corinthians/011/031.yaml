review_pass:
  verdict: revise
  source_fidelity: The draft rightly preserves the reflexive object and the lexical relationship between διακρίνω and κρίνω. However, “a gaghị ekpe anyị ikpe” reads chiefly as a future negation (“we will not be judged”) and does not adequately represent the conditional potential/counterfactual force of οὐκ ἂν ἐκρινόμεθα. “Ekpebie onwe anyị ikpe” is also less idiomatic than the direct judicial expression “ekpe onwe anyị ikpe.”
  naturalness: “Ma a sị na anyị na-ekpe onwe anyị ikpe, a garaghị ekpe anyị ikpe” is natural Standard Igbo. It conveys the conditional force, maintains the deliberate repetition of “ikpe,” and does not overstate the kind of judgment intended.
  terminology: Use “ekpe onwe anyị ikpe” / “ekpe anyị ikpe” to retain the source’s wordplay without adding “condemnation.” The footnote should offer natural alternatives such as “nyochaa onwe anyị” and “tụlee onwe anyị,” rather than “mata onwe anyị nke ọma,” which can suggest self-knowledge rather than discriminating self-assessment.
  issues:
  - severity: medium
    issue: The apodosis “a gaghị ekpe anyị ikpe” weakens οὐκ ἂν ἐκρινόμεθα.
    rationale: The Greek imperfect with ἄν expresses a conditional result, rendered in Igbo more accurately by “a garaghị ekpe anyị ikpe.”
  - severity: low
    issue: “Ekpebie onwe anyị ikpe” is unnecessarily cumbersome.
    rationale: “Ekpe onwe anyị ikpe” is the normal Igbo judicial expression and better preserves the verbal parallel with the following clause.
  - severity: low
    issue: The footnote alternative “mata onwe anyị nke ọma” is not a sufficiently close lexical alternative.
    rationale: It shifts toward knowing oneself rather than examining or judging oneself.
  revised_text: Ma a sị na anyị na-ekpe onwe anyị ikpe[a], a garaghị ekpe anyị ikpe.
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “nyochaa onwe anyị” ma ọ bụ “tụlee onwe anyị.” Ngwaa Grik a nwere ike ịpụta inyocha, ịtụle, ma ọ bụ ịmata ọdịiche. E ji “ekpe onwe anyị ikpe” mee ihe ebe a iji chekwaa njikọ ya na “ekpe anyị ikpe” n’ahịrị na-esonụ.
    reason: lexical_alternative
  revision_rationale: The revision supplies the conditional-result force of the Greek and uses idiomatic Standard Igbo while retaining the intentional lexical parallel. It leaves the nature of the judgment unspecified, as the verse itself does.
