- from: Ma ọ bụrụ na anyị ekpebie onwe anyị ikpe[a], a gaghị ekpe anyị ikpe.
  to: Ma a sị na anyị na-ekpe onwe anyị ikpe[a], a garaghị ekpe anyị ikpe.
