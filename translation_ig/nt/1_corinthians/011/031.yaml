  yaml_path: translation/nt/1_corinthians/011/031.yaml
  text: But if we judged ourselves[a], we would not be judged.
translation:
  language: ig
  text: Ma a sị na anyị na-ekpe onwe anyị ikpe[a], a garaghị ekpe anyị ikpe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “nyochaa onwe anyị” ma ọ bụ “tụlee onwe anyị.” Ngwaa Grik a nwere ike ịpụta inyocha, ịtụle, ma ọ bụ ịmata ọdịiche. E ji “ekpe onwe anyị ikpe” mee ihe ebe a iji chekwaa njikọ ya na “ekpe anyị ikpe” n’ahịrị na-esonụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δὲ
  choice: Ma ọ bụrụ na
  rationale: Nke a na-egosipụta ma ọnọdụ nke εἰ ma obere ntụgharị ma ọ bụ ọdịiche nke δέ n'Igbo dị ugbu a.
- source_word: ἑαυτοὺς
  choice: onwe anyị
  rationale: Ọ bụ nnọchiaha nlaghachi onwe nke na-arụ ọrụ dị ka ihe ngwaa metụtara; ‘onwe anyị’ bụ Igbo nkịtị ma doo anya.
- source_word: διεκρίνομεν
  choice: ekpebie onwe anyị ikpe
  rationale: διακρίνω nwere ike ịpụta inyocha, ịmata ọdịiche, ma ọ bụ ime mkpebi nyocha. N'ebe a, okwu a na-ekwu maka mmadụ iji nlezianya tụlee onwe ya. Nhọrọ a na-edobe njikọ okwu ya na κρίνω nke dị n'ahịrị nke abụọ, ma ihe odide ala na-echekwa nkọwa ndị ọzọ nwere ike ịdị.
- source_word: οὐκ ἂν
  choice: a gaghị
  rationale: N'okwu ọnọdụ a, οὐκ ἂν na-egosi nsonaazụ na-agaghị eme ma ọnọdụ ahụ mezuru; ‘a gaghị’ na-ekwupụta nke a n'ụzọ Igbo ebumpụta ụwa.
- source_word: ἐκρινόμεθα
  choice: ekpe anyị ikpe
  rationale: κρίνω pụtara ikpe ikpe n'ebe a. Nhọrọ a adịghị eme ka okwu ahụ sie ike ruo n'ịsị ‘maa anyị ikpe mbibi,’ ma na-ahapụ ọdịdị ikpe ahụ ka ihe gbara amaokwu ahụ gburugburu kọwaa ya.
theological_decisions:
- issue: Ma ahịrị nke abụọ ọ na-ekwu maka ikpe mbibi ikpeazụ, ka ọ bụ ikpe na ịdọ aka ná ntị sitere n'aka Chineke
  choice: A sụgharịrị ya nanị dị ka ‘a gaghị ekpe anyị ikpe,’ nke na-ekwe ka ihe gbara amaokwu ahụ gburugburu gosi ikpe Chineke nke ịdọ aka ná ntị.
  alternative: ‘A gaghị ama anyị ikpe mbibi.’
  rationale: Amaokwu 32 na-ekewa ikpe na ịdọ aka ná ntị nke Onyenwe anyị na ịbụ ndị a mara ikpe ọnụ na ụwa. Ya mere, e kwesịghị itinye echiche siri ike nke ikpe mbibi ikpeazụ n'amaokwu 31.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-edobe ọdịiche dị n'etiti mmadụ ikpebi onwe ya ikpe na ịbụ onye e kpere ikpe, na-enweghị ịmanye otu nkọwa ozizi n'elu ederede.
