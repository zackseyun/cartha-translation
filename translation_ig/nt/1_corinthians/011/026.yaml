id: 1CO.11.26
reference: 1 Corinthians 11:26
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁσάκις γὰρ ⸀ἐὰν ἐσθίητε τὸν ἄρτον τοῦτον καὶ τὸ ⸀ποτήριον πίνητε, τὸν θάνατον τοῦ κυρίου καταγγέλλετε, ἄχρι ⸀οὗ ἔλθῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/026.yaml
  text: For as often as you eat this bread and drink the cup[b][a], you proclaim the Lord’s death until he comes.
translation:
  language: ig
  text: N’ihi na mgbe ọ bụla unu na-eri achịcha a ma na-aṅụ iko ahụ,[a] unu na-ekwusa ọnwụ Onyenwe anyị ruo mgbe ọ ga-abịa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'N’asụsụ Grik: “iko ahụ,” ọ bụghị “iko a” n’amaokwu a, ọ bụ ezie na amaokwu ndị gbara ya gburugburu na-egosi iko a na-ekwu maka ya.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁσάκις ... ἐὰν
  choice: mgbe ọ bụla
  rationale: 'Nke a na-egosi ihe a na-eme ugboro ugboro: oge ọ bụla omume ahụ mere. Ọ bụkwa okwu Igbo dị mfe ma kwekọọ n’ọnọdụ a.'
- source_word: γὰρ
  choice: N’ihi na
  rationale: Ọ na-ejikọta amaokwu a na ntụziaka bu ya ụzọ site n’inye nkọwa ma ọ bụ ihe ndabere ya.
- source_word: ἐσθίητε
  choice: unu na-eri
  rationale: Ụdị ngwaa dị na nkebiokwu oge na-enweghị oge a kapịrị ọnụ na-egosi ihe a na-eme oge ọ bụla ọnọdụ ahụ mere.
- source_word: ἄρτον τοῦτον
  choice: achịcha a
  rationale: ἄρτος pụtara achịcha, ebe τοῦτον na-arụtụ aka kpọmkwem n’achịcha a kpọtụrụ aha n’ọnọdụ ahụ.
- source_word: τὸ ποτήριον
  choice: iko ahụ
  rationale: Asụsụ Grik nwere mkpụrụokwu njirimara, ọ bụghị okwu ngosi ‘a.’ ‘Iko ahụ’ na-edobe ọdịiche a ma na-arụtụ aka n’iko e kwuru okwu ya n’amaokwu ndị dị nso.
- source_word: καταγγέλλετε
  choice: unu na-ekwusa
  rationale: Okwu a pụtara ikwupụta ma ọ bụ ịkpọsa ihe n’ihu ọha. ‘Na-ekwusa’ na-eburu ike nkwupụta ahụ n’Igbo ugbu a.
- source_word: τὸν θάνατον τοῦ κυρίου
  choice: ọnwụ Onyenwe anyị
  rationale: Nke a bụ ụzọ ebumpụta ụwa na nke dị nsọ e si gosipụta njikọ genitive ahụ n’Igbo.
- source_word: κυρίου
  choice: Onyenwe anyị
  rationale: N’ọnọdụ Pọl a, κύριος na-ezo aka n’Onyenwe anyị Jizọs; ‘Onyenwe anyị’ bụ aha nsọ a na-aghọta nke ọma n’Igbo.
- source_word: ἄχρι οὗ ἔλθῃ
  choice: ruo mgbe ọ ga-abịa
  rationale: Nke a na-egosi njedebe oge omume ikwusa ahụ, ebe onye ngwaa ahụ na-ezo aka na ya bụ Onyenwe anyị e kwuru okwu ya ozugbo tupu ya.
theological_decisions:
- issue: Onye ‘ọ’ dị na ἄχρι οὗ ἔλθῃ na-ezo aka na ya
  choice: Onyenwe anyị Jizọs bụ onye a na-aghọta dịka isiokwu ngwaa ahụ.
  alternative: Ịhapụ onye ọ na-ezo aka na ya kpamkpam n’enweghị ihe ọnọdụ amaokwu ahụ na-egosi.
  rationale: ‘Onyenwe anyị’ bụ aha kacha nso tupu nkebiokwu ahụ, nke a kwekọkwara na olileanya Pọl banyere ọbịbịa Onyenwe anyị.
- issue: Okwu banyere Nri Anyasị Onyenwe anyị
  choice: Ịsụgharị omume ndị ahụ n’ụzọ kwụ ọtọ dịka iri achịcha, ịṅụ iko, na ikwusa ọnwụ Onyenwe anyị.
  alternative: Ịgbakwunye nkọwa na-akwado naanị echiche sacramental ma ọ bụ naanị echiche ncheta.
  rationale: Amaokwu ahụ kwuru ihe omume a na-eme—ọ na-ekwusa ọnwụ Onyenwe anyị—ma ọ kọwaghị ozizi sacrament n’uju; ya mere nsụgharị ahụ anaghị edozi esemokwu ahụ n’aha otu ụka.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. ‘Mgbe ọ bụla’ na-egosi ugboro ugboro n’enweghị mgbagwoju anya; ‘iko ahụ’ na-edobe mkpụrụokwu njirimara Grik ma ghara itinye okwu ngosi na-adịghị na isi mmalite.
