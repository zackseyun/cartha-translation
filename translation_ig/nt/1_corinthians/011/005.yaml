id: 1CO.11.5
reference: 1 Corinthians 11:5
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: πᾶσα δὲ γυνὴ προσευχομένη ἢ προφητεύουσα ἀκατακαλύπτῳ τῇ κεφαλῇ καταισχύνει τὴν κεφαλὴν ⸀αὐτῆς, ἓν γάρ ἐστιν καὶ τὸ αὐτὸ τῇ ἐξυρημένῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/005.yaml
  text: But every woman who prays or prophesies with her head uncovered dishonors her head[b][a], for that is one and the same as having been shaved.
translation:
  language: ig
  text: Ma nwanyị ọ bụla nke na-ekpe ekpere ma ọ bụ na-ebu amụma n’isi ekpuchighị ekpuchi[b] na-eme isi ya ihere[a], n’ihi na nke a bụ otu ihe ahụ dịka nwanyị a kpụrụ isi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “nwunye ọ bụla nke na-ekpe ekpere ma ọ bụ na-ebu amụma ... na-eme di ya ma ọ bụ isi ya ihere.” Okwu Grik gynē nwere ike ịpụta “nwanyị” ma ọ bụ “nwunye”; “isi” nwekwara ike ịpụta isi anụ ahụ ma ọ bụ isi n’ụzọ ihe atụ, dịka ihe ndị gbara amaokwu a gburugburu si dị.
    reason: alternative_reading
  - marker: b
    text: Okwu a sụgharịrị “n’isi ekpuchighị ekpuchi” akọwaghị kpọmkwem ụdị mkpuchi a na-ekwu maka ya; ndị na-akọwa ihe odide a ekwekọghị ma Pọl ọ̀ na-ekwu kpọmkwem maka ákwà mkpuchi isi, ka ọ̀ na-ekwu n’ozuzu maka isi na-enweghị mkpuchi.
    reason: lexical_alternative
lexical_decisions:
- source_word: γυνή
  choice: nwanyị
  rationale: Okwu Grik a nwere ike ịpụta “nwanyị” ma ọ bụ “nwunye.” N’ahịrịokwu a, “nwanyị” na-edobe nghọta sara mbara nke okwu ahụ n’ebughị ụzọ kpebie na ọ bụ naanị ndị lụrụ di ka a na-ekwu maka ha; e debere “nwunye” n’ala ala peeji dịka nghọta ọzọ.
- source_word: προσευχομένη ἢ προφητεύουσα
  choice: nke na-ekpe ekpere ma ọ bụ na-ebu amụma
  rationale: Nke a na-egosi omume nwanyị ahụ na-eme. Usoro a bụ Igbo dị ugbu a ma na-edobe ma ekpere ma ibu amụma dịka ihe odide Grik si kwuo.
- source_word: ἀκατακαλύπτῳ τῇ κεφαλῇ
  choice: mgbe isi ya na-ekpuchighị ekpuchi
  rationale: Nke a na-egosi ọnọdụ isi ya n’oge omume ahụ, ma ọ naghị akọwa ụdị ihe mkpuchi a chọrọ. Ya mere, nsụgharị ahụ ekpebighị ma ọ bụ ákwà mkpuchi isi, ntutu, ma ọ bụ ihe ọzọ.
- source_word: καταισχύνει
  choice: na-emechu ... ihu
  rationale: Akpaalaokwu Igbo a na-egosi iweta ihere ma ọ bụ mmebi nsọpụrụ, kwekọrọ n’ọnọdụ ihere na nsọpụrụ nke okwu Grik ahụ.
- source_word: τὴν κεφαλὴν αὐτῆς
  choice: isi ya
  rationale: Nke a na-edobe okwu ahụ dịka o si dị, na-ekpebighị ma “isi” ọ bụ isi anụ ahụ ya ma ọ bụ onye bụ isi ya n’ụzọ ihe atụ.
- source_word: ἓν γάρ ἐστιν καὶ τὸ αὐτό
  choice: nke ahụ bụ otu ihe ahụ
  rationale: Usoro a na-edobe nkwusi ike nke akpaalaokwu Grik ahụ na ihe abụọ ahụ hà otu.
- source_word: τῇ ἐξυρημένῃ
  choice: dị ka ịbụ nwanyị a kpụrụ isi
  rationale: Nke a na-egosi nwanyị nọ n’ọnọdụ sitere n’ịkpụcha isi ya, dịka participle zuru oke nke Grik si egosi.
theological_decisions:
- issue: Ihe “isi ya” nke abụọ (κεφαλή) pụtara
  choice: E debere “isi ya” n’isi ederede n’akọwaghị ma ọ bụ isi anụ ahụ ma ọ bụ isi n’ụzọ ihe atụ.
  alternative: Isi anụ ahụ ya; ma ọ bụ di ya/nwoke ahụ dịka “isi” n’usoro arụmụka a.
  rationale: Okwu Grik ahụ n’onwe ya kwekọrọ na nghọta nkịtị, ebe ihe ndị gbara ya gburugburu na-eme ka nghọta ihe atụ kwe omume. Ịhapụ ya otu a na-echekwa ejighị n’aka dị n’ihe odide ahụ.
- issue: Ụdị ihe mkpuchi e zoro aka na ya
  choice: A sụgharịrị ya n’ozuzu dịka “isi ya na-ekpuchighị ekpuchi.”
  alternative: Enweghị ákwà mkpuchi isi; ma ọ bụ ntutu ya nọ n’ụzọ a na-ewere dị ka ekpuchighị isi.
  rationale: Adjective Grik ahụ na-ekwu na isi ahụ ekpuchighị, ma ọ naghị kpọọ kpọmkwem ihe e kwesịrị iji kpuchie ya. Ịkpọ ya ákwà mkpuchi isi n’isi ederede ga-abụ ikpebi ihe okwu ahụ n’onwe ya na-ekpebighị.
translation_notes:
  register: E ji Igbo Izugbe dị ugbu a, kwụ ọtọ ma dị ùgwù. “Na-emechu ... ihu” bụ akpaalaokwu a na-aghọta ngwa ngwa maka mmebi nsọpụrụ. E zere okwu ga-ekpebi ụdị mkpuchi ma ọ bụ ihe “isi” nke abụọ pụtara.
