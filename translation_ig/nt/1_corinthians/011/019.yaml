revisions:
- from: N’ihi na òtù na-ekewa ekewa[a] aghaghị ịdịkwa n’etiti unu, ka ndị a nwapụtara[b] wee pụta ìhèkwa n’etiti unu.
  to: N’ihi na nkewa dị iche iche[a] aghaghị ịdịkwa n’etiti unu, ka ndị a nwapụtara[b] pụtakwa ìhè n’etiti unu.
  rationale: The revision replaces the awkward singular expression for αἱρέσεις with an idiomatic plural/collective expression, ‘nkewa dị iche iche,’ which reflects the source and the local context of divisions in the Corinthian congregation. It also moves ‘kwa’ to ‘pụtakwa ìhè’ for smoother Standard Igbo. No theological interpretation beyond the Greek text has been added, and both footnote anchors remain attached to their relevant terms.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T18:12:55Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately retains the explanatory ‘N’ihi na,’ the unqualified necessity of δεῖ (‘aghaghị’), the communal framing (‘n’etiti unu’), and the purpose/result ambiguity of ἵνα (‘ka’). It also appropriately avoids assigning a source to the necessity. However, ‘òtù na-ekewa ekewa’ is an awkward singular/reduplicated expression for the plural αἱρέσεις. ‘Nkewa dị iche iche’ more naturally conveys divisive factions or splits in this context without importing the later technical sense of heresy.
  naturalness: The revised wording is standard, clear modern Igbo. ‘Pụtakwa ìhè’ places the additive force of the second καί naturally with the verb phrase. ‘Ndị a nwapụtara’ is retained as a concise rendering of δόκιμοι, with the footnote clarifying its tested-and-approved sense.
  terminology: ‘Nkewa dị iche iche’ fits Paul’s immediate concern with internal communal divisions. The footnote may mention the later sense ‘ozizi nduhie,’ but does not use it as the verse’s primary meaning. The rendering preserves the non-doctrinal, factional sense of αἵρεσις here.
  issues:
  - severity: medium
    issue: ‘Òtù na-ekewa ekewa’ is not an idiomatic or well-aligned rendering of αἱρέσεις.
    rationale: The Greek plural denotes factions, parties, or divisions. The draft’s singular ‘òtù,’ together with the reduplication ‘na-ekewa ekewa,’ sounds cumbersome and can obscure the reference to multiple internal divisions. ‘Nkewa dị iche iche’ is natural and contextually precise.
  - severity: low
    issue: Placement of ‘kwa’ in ‘pụta ìhèkwa’ is less natural than verbal placement.
    rationale: The second καί is well represented by ‘kwa’; ‘pụtakwa ìhè’ reads more smoothly in Standard Igbo while preserving its additive emphasis.
  revised_text: N’ihi na nkewa dị iche iche[a] aghaghị ịdịkwa n’etiti unu, ka ndị a nwapụtara[b] pụtakwa ìhè n’etiti unu.
