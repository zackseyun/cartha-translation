id: 1CO.11.19
reference: 1 Corinthians 11:19
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: δεῖ γὰρ καὶ αἱρέσεις ἐν ὑμῖν εἶναι, ἵνα ⸀καὶ οἱ δόκιμοι φανεροὶ γένωνται ἐν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/019.yaml
  text: For there must also be factions among you[b][a], so that those who are approved may also become evident among you.
translation:
  language: ig
  text: N’ihi na nkewa dị iche iche[a] aghaghị ịdịkwa n’etiti unu, ka ndị a nwapụtara[b] pụtakwa ìhè n’etiti unu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya ‘nkewa’ ma ọ bụ ‘òtù dị iche iche.’ N’oge e mesịrị, okwu Grik a bịara pụtakwa ‘ozizi nduhie.’ N’ebe a, o yikarịrị ka ọ na-ekwu maka nkewa n’ime ọgbakọ.
    reason: lexical_alternative
  - marker: b
    text: ‘Ndị a nwapụtara’ nwekwara ike ịbụ ‘ndị e gosiri na ha bụ ezi ndị’ ma ọ bụ ‘ndị gafere ule.’
    reason: lexical_alternative
lexical_decisions:
- source_word: δεῖ
  choice: aghaghị ịdị
  rationale: Nke a na-egosipụta mkpa siri ike dị n’okwu Grik, ma ọ naghị akọwa ma mkpa ahụ ọ bụ atụmatụ Chineke, ihe ọnọdụ ahụ mere ka ọ ghara izere ezere, ma ọ bụ ha abụọ.
- source_word: γὰρ
  choice: N’ihi na
  rationale: Ọ na-edobe njikọ nkọwa amaokwu a na ihe e kwuru n’amaokwu bu ya ụzọ.
- source_word: καὶ αἱρέσεις
  choice: òtù na-ekewa ekewa
  rationale: N’ebe a αἱρέσεις na-ezo aka n’òtù dị iche iche na-ekewa ọgbakọ, ọ bụghị kpọmkwem n’ozizi ụgha dịka okwu ahụ si nweta ihe ọ pụtara n’oge e mesịrị. ‘Dịkwa’ na-eburu echiche καί.
- source_word: ἐν ὑμῖν
  choice: n’etiti unu
  rationale: Nke a bụ ụzọ Igbo doro anya ma bụrụkwa nke ebumpụta ụwa isi gosi na ihe ahụ dị n’ime obodo ndị kwere ekwe.
- source_word: ἵνα
  choice: ka
  rationale: ‘Ka’ na-ahapụ ohere maka echiche ebumnuche ma ọ bụ ihe si na ya pụta, n’emeghị ka otu n’ime ha bụrụ naanị ihe a na-ekwu.
- source_word: καὶ οἱ δόκιμοι
  choice: ndị a nwapụtara
  rationale: δόκιμοι na-egosi ndị ule gosiri na ha bụ ndị kwesịrị ekwesị ma ọ bụ ndị bụ eziokwu. Ihe odide ala peeji na-enye nkọwa ndị ahụ; ‘kwa’ dị n’ahịrị na-edobe καί nke abụọ.
- source_word: φανεροὶ γένωνται
  choice: wee pụta ìhè
  rationale: Nke a na-egosi mgbanwe gaa n’ọnọdụ ebe a pụrụ ịhụ ma mata ndị ahụ nke ọma.
- source_word: ἐν ὑμῖν
  choice: n’etiti unu
  rationale: Ikwughachi ya na-edobe usoro na nkwusi ike dị n’asụsụ Grik.
theological_decisions:
- issue: Otú e si sụgharịa αἱρέσεις
  choice: òtù na-ekewa ekewa
  alternative: nkewa; òtù okpukpe dị iche iche; ozizi nduhie
  rationale: Ihe gbara amaokwu a gburugburu bụ nkewa n’ọgbakọ Kọrịnt, karịsịa mgbe ha na-ezukọ. Nhọrọ a anaghị ebubata echiche e mesịrị banyere ‘heresy’ n’ebe ederede ahụ na-ekwughị ya kpọmkwem.
- issue: Ike okwu δεῖ
  choice: aghaghị, n’akọwaghị ebe mkpa ahụ si bịa
  alternative: ọ bụ uche Chineke; ọ bụ ihe a na-apụghị izere ezere n’ọnọdụ ahụ
  rationale: Ederede ahụ kwuru na ọ ghaghị ịdị, ma ọ kọwaghị ma nke a bụ mkpa sitere n’atụmatụ Chineke, ihe omume mmadụ mere ka ọ ghara izere ezere, ma ọ bụ ha abụọ. Nsụgharị ahụ na-ahapụ esemokwu echiche a ka ọ dị.
- issue: Mmekọrịta ἵνα na ihe si n’ịdị nke òtù ndị ahụ pụta
  choice: ka
  alternative: n’ihi ya; ka e wee
  rationale: ‘Ka’ nwere ike igosi ebumnuche ma ọ bụ ihe si na ya pụta, ya mere ọ naghị ekpebi karịa ihe asụsụ Grik kwuru.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta, dee ya. A họọrọ ‘òtù na-ekewa ekewa’ iji mee ka echiche ndị na-ekewa ọgbakọ doo anya n’etinyeghị nkọwa okpukpe e mesịrị. A hapụrụ ‘aghaghị’ na ‘ka’ ka ha debe ike okwu na nghọta abụọ nwere ike ịdị n’asụsụ Grik.
