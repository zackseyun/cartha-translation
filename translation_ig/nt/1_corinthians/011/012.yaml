  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὥσπερ γὰρ ἡ γυνὴ ἐκ τοῦ ἀνδρός, οὕτως καὶ ὁ ἀνὴρ διὰ τῆς γυναικός· τὰ δὲ πάντα ἐκ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/012.yaml
  text: For just as the woman is from the man[a], so also the man is through the woman; but all things are from God.
translation:
  language: ig
  text: N’ihi na, dịka nwanyị siri n’ nwoke pụta[a], otu ahụkwa ka nwoke na-abịa site n’ nwanyị; ma ihe niile sitere na Chineke.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “nwunye sitere n’ di, di na-abịakwa site n’ nwunye,” ma ọ bụrụ na a ghọta okwu ndị a n’ụzọ dị warara dịka okwu gbasara alụmdi na nwunye kama mmekọrịta nwoke na nwanyị n’ozuzu ya.
    reason: alternative_reading
lexical_decisions:
- source_word: ὥσπερ γὰρ
  choice: N’ihi na, dị nnọọ ka
  rationale: Na-egosipụta ma ihe kpatara okwu gara aga site na γάρ ma usoro ntụnyere nke ὥσπερ.
- source_word: ἡ γυνὴ
  choice: nwanyị
  rationale: N’ebe a, okwu ahụ na-ekwu maka nwanyị n’ozuzu ya, ọ bụghị naanị nwunye; asụsụ Igbo anaghị achọ idepụta article Grik ahụ iche.
- source_word: ἐκ τοῦ ἀνδρός
  choice: si n’ nwoke pụta
  rationale: Na-echekwa echiche ἐκ banyere isi mmalite ma na-eme ka ntụaka okike—nwanyị sitere n’ nwoke—doo anya n’Igbo.
- source_word: ὁ ἀνὴρ
  choice: nwoke
  rationale: A họọrọ nghọta izugbe ‘nwoke’ kama ‘di,’ n’ihi ntụnyere okike na ọmụmụ mmadụ dị n’amaokwu ahụ.
- source_word: διὰ τῆς γυναικός
  choice: si site n’ nwanyị abịa
  rationale: ‘Site n’ nwanyị’ na-egosipụta ụzọ ma ọ bụ onye e ji mee ka nwoke bịa n’ụwa, ma na-edobe ọdịiche dị n’etiti διά na ἐκ.
- source_word: τὰ δὲ πάντα
  choice: ma ihe niile
  rationale: ‘Ma’ na-egosipụta mgbanwe dị nro na obere ọdịiche nke δέ, ebe ‘ihe niile’ na-anọchi τὰ πάντα.
- source_word: ἐκ τοῦ θεοῦ
  choice: si n’aka Chineke
  rationale: Akpaokwu Igbo a na-egosipụta na Chineke bụ isi mmalite ikpeazụ nke ihe niile.
theological_decisions:
- issue: Nghọta γυνή na ἀνήρ
  choice: nwanyị na nwoke n’echiche izugbe
  alternative: nwunye na di
  rationale: Amaokwu ahụ jikọtara mmalite nwanyị n’okike na ụzọ nwoke si abịa n’ụwa site n’ọmụmụ; ya mere nghọta izugbe na-echekwa obosara okwu Pọl.
- issue: Ọdịiche dị n’etiti mmalite nwoke na nwanyị
  choice: ichekwa ‘si na’ (ἐκ) na ‘site na’ (διά) dị ka echiche abụọ metụtara ibe ha ma dị iche
  alternative: ịsụgharị ha abụọ naanị dị ka ‘si na’
  rationale: Nke a na-echekwa ọdịiche Pọl mere n’etiti nwanyị sitere n’ nwoke n’okike na nwoke na-abịa site n’ nwanyị n’ọmụmụ, n’enweghị ime ka ha bụrụ otu echiche.
translation_notes:
  register: Igbo ọkọlọtọ, nke ugwu na nke a na-aghọta ngwa ngwa. E ji ‘dị nnọọ ka ... otu ahụkwa’ chekwaa ntụnyere ahụ, ma e debere akara ntụaka [a] ozugbo n’ebe okwu nwere nghọta ọzọ dị.
