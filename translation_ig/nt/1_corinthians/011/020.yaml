review_pass:
  verdict: revise
  source_fidelity: 'The draft rightly conveys Paul''s evaluative rebuke: their assembly does not constitute eating the Lord''s Supper. However, “ihe unu na-eme abụghị iri” inserts an explicit subject (“what you are doing”) that is not present in the compressed Greek construction and weakens its direct focus on what is eaten.'
  naturalness: “Ihe unu na-eme abụghị iri ...” is understandable but somewhat roundabout in Standard Igbo. “Ọ bụghị Nri Anyasị nke Onyenwe anyị ka unu na-eri” is more idiomatic and directly expresses that the meal they eat does not properly bear that designation.
  terminology: “Nri Anyasị nke Onyenwe anyị” is a clear, established rendering of κυριακὸν δεῖπνον. Retain it consistently, including capitalization as a recognized designation.
  issues:
  - severity: low
    issue: The main clause adds “ihe unu na-eme” (“what you are doing”).
    rationale: This interpretively supplies a subject absent from οὐκ ἔστιν ... φαγεῖν. A direct Igbo cleft construction can preserve the Greek's evaluative force without that added abstraction.
  revised_text: Ya mere, mgbe unu zukọrọ n’otu ebe, ọ bụghị Nri Anyasị nke Onyenwe anyị ka unu na-eri.[a]
