- from: Ya mere, mgbe unu zukọrọ n’otu ebe, ihe unu na-eme abụghị iri Nri Anyasị nke Onyenwe anyị.[a]
  to: Ya mere, mgbe unu zukọrọ n’otu ebe, ọ bụghị Nri Anyasị nke Onyenwe anyị ka unu na-eri.[a]
  rationale: The revision replaces the added, roundabout expression “ihe unu na-eme abụghị iri” with a natural Standard Igbo cleft clause. It retains the contextual sense that their divisive practice means the meal is not properly the Lord's Supper, while the footnote preserves the viable more literal/predicative alternative without forcing a doctrinal conclusion.
