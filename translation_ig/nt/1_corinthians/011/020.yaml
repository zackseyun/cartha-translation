id: 1CO.11.20
reference: 1 Corinthians 11:20
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: συνερχομένων οὖν ὑμῶν ἐπὶ τὸ αὐτὸ οὐκ ἔστιν κυριακὸν δεῖπνον φαγεῖν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/020.yaml
  text: Therefore[a], when you come together in the same place, it is not to eat the Lord’s supper,
translation:
  language: ig
  text: Ya mere, mgbe unu zukọrọ n’otu ebe, ọ bụghị Nri Anyasị nke Onyenwe anyị ka unu na-eri.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “unu anaghị eri Nri Anyasị nke Onyenwe anyị,” nke na-emesi ike na omume unu emeela ka nri ahụ gharazie iru eru ịbụ Nri Anyasị nke Onyenwe anyị.
    reason: alternative_reading
lexical_decisions:
- source_word: συνερχομένων
  choice: mgbe unu zukọrọ
  rationale: 'Nkebi a na ὑμῶν na-egosi oge: “mgbe unu zukọrọ.” “Zukọrọ” bụ Igbo dị ndụ nke na-egosi nzukọ ndị kwere ekwe.'
- source_word: οὖν
  choice: Ya mere
  rationale: Ọ na-egosi nkwubi okwu sitere ná mba Pọl baara ha banyere nkewa dị n’etiti ha.
- source_word: ἐπὶ τὸ αὐτό
  choice: n’otu ebe
  rationale: Akpaalaokwu a na-egosi na ha gbakọtara n’otu ebe ma ọ bụ n’otu nzukọ; nsụgharị a na-edobe echiche banyere ebe.
- source_word: οὐκ ἔστιν ... φαγεῖν
  choice: ihe unu na-eme abụghị iri
  rationale: Okwu Grik ahụ dị mkpụmkpụ ma nwee ike ịpụta na omume ha anaghị eru eru ịkpọ ya iri Nri Anyasị nke Onyenwe anyị. Nsụgharị a na-eme ka Igbo bụrụ ihe e ji ọnụ ekwu nke ọma n’enweghị ikwu na iri ya agaghị ekwe omume kpamkpam.
- source_word: κυριακὸν
  choice: nke Onyenwe anyị
  rationale: Adjective a pụtara ihe bụ nke Onyenwe anyị ma ọ bụ nke dịịrị ya; usoro a bụ nke doro anya ma bụrụkwa nke a na-ahụkarị n’Igbo.
- source_word: δεῖπνον
  choice: Nri Anyasị
  rationale: Ọ na-ezo aka na nri a na-eri n’oge mgbede; n’ebe a, ọ bụ nri nzukọ ndị kwere ekwe jikọtara na ncheta Jizọs.
- source_word: κυριακὸν δεῖπνον
  choice: Nri Anyasị nke Onyenwe anyị
  rationale: Nke a na-edobe echiche Grik nke nri ahụ bụ nke Onyenwe anyị, ma bụrụkwa okwu doro anya n’okwu ofufe Ndị Kraịst.
theological_decisions:
- issue: Ma Pọl ọ na-ekwu na ha enweghị ike iri nri ahụ ma ọ bụ na omume ha emeela ka nri ha gharazie iru eru ịbụ Nri Anyasị nke Onyenwe anyị
  choice: Omume ha mgbe ha zukọrọ pụtara na ihe ha na-eri anaghị eru eru ịkpọ ya Nri Anyasị nke Onyenwe anyị.
  alternative: “Unu anaghị eri Nri Anyasị nke Onyenwe anyị,” ma ọ bụ “ọ gaghị ekwe omume iri Nri Anyasị nke Onyenwe anyị.”
  rationale: Amaokwu 21–22 na-egosi na Pọl na-akatọ ụzọ nkewa na ịchọ ọdịmma onwe ha si emebi nri ahụ. Nsụgharị a na-edobe ike nke nkatọ ahụ, ebe ihe odide ala ala peeji na-egosi ụzọ ọzọ e si aghọta njikọ okwu Grik ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “Nri Anyasị nke Onyenwe anyị” na-edobe aha omume ahụ n’ụzọ pụtara ìhè, ebe ahịrịokwu bụ isi na ihe odide ala ala peeji na-echekwa mgbagwoju anya dị na οὐκ ἔστιν ... φαγεῖν.
