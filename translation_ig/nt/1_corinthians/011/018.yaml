    text: A pụkwara ịsụgharị ya, “n’ọgbakọ” ma ọ bụ “dị ka chọọchị.” Okwu Grik a na-ekwu maka ọgbakọ mmadụ zukọrọ ọnụ, ọ bụghị kpọmkwem maka ụlọ.
    reason: lexical_alternative
  revision_rationale: 'The final clause has been revised to preserve the Greek ambiguity and scope: Paul’s belief is partial in degree, rather than necessarily directed to only selected details of the report. The existing footnote remains accurate and its anchor is retained.'
