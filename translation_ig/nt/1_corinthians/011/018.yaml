id: 1CO.11.18
reference: 1 Corinthians 11:18
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: πρῶτον μὲν γὰρ συνερχομένων ὑμῶν ἐν ἐκκλησίᾳ ἀκούω σχίσματα ἐν ὑμῖν ὑπάρχειν, καὶ μέρος τι πιστεύω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/018.yaml
  text: For[a], in the first place, when you come together in assembly, I hear that divisions exist among you, and in part I believe it.
translation:
  language: ig
  text: N’ihi na, nke mbụ, mgbe unu na-ezukọta dị ka ọgbakọ[a], ana m anụ na nkewa dị n’etiti unu, ekwenyekwa m na ya ruo n’ókè ụfọdụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “n’ọgbakọ” ma ọ bụ “dị ka chọọchị.” Okwu Grik a na-ekwu maka ọgbakọ mmadụ zukọrọ ọnụ, ọ bụghị kpọmkwem maka ụlọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: πρῶτον μὲν
  choice: nke mbụ
  rationale: Na-egosi isi okwu mbụ Pọl na-ebute, n’agbanyeghị na ọ naghị esochi ya kpọmkwem n’usoro μέν...δέ.
- source_word: συνερχομένων ὑμῶν
  choice: mgbe unu na-ezukọta
  rationale: Na-asụgharị genitive absolute ahụ dị ka oge, ma kwekọọ n’otú e si ekwu okwu n’Igbo banyere nzukọ ọgbakọ.
- source_word: ἐν ἐκκλησίᾳ
  choice: dị ka ọgbakọ
  rationale: Na-egosi ndị kwere ekwe zukọrọ ọnụ dịka otu ọgbakọ, ọ bụghị ụlọ a na-akpọ chọọchị.
- source_word: ἀκούω
  choice: ana m anụ
  rationale: Na-echekwa present tense ahụ na echiche na Pọl natara akụkọ banyere ha.
- source_word: σχίσματα
  choice: nkewa
  rationale: Na-egosi mgbawa ma ọ bụ esemokwu na-ekewa ndị nọ n’otu obodo, n’ebughị ụzọ kọwaa ya dị ka otu ndọrọ ndọrọ siri ike.
- source_word: ὑπάρχειν
  choice: dị
  rationale: Ụzọ Igbo dị mfe ma kwekọọ n’okwu Grik nke na-ekwu na nkewa ahụ nọ n’etiti ha.
- source_word: καὶ μέρος τι πιστεύω
  choice: ekwenyekwa m na akụkụ ụfọdụ nke akụkọ ahụ bụ eziokwu
  rationale: Na-eme ka ihe e kwenyere—akụkọ a nụrụ—pụta ìhè n’Igbo, ma na-echekwa oke ma ọ bụ ndoputa dị na μέρος τι.
theological_decisions:
- issue: Ihe ἐκκλησία pụtara n’ebe a
  choice: ọgbakọ ndị kwere ekwe zukọrọ ọnụ
  alternative: ụlọ chọọchị ma ọ bụ nzukọ dị ka ụlọ ọrụ
  rationale: Ihe gbara amaokwu ahụ gburugburu bụ izukọ ndị Kọrịnt maka oriri Onyenwe anyị; okwu ahụ na-ezo aka n’ọgbakọ mmadụ, ọ bụghị n’ụlọ.
- issue: Ogo nkwenye Pọl n’akụkọ ahụ
  choice: ọ kwenyere na akụkụ ụfọdụ nke akụkọ ahụ bụ eziokwu
  alternative: ọ kwenyere akụkọ ahụ kpamkpam
  rationale: μέρος τι na-egbochi nkwenye ahụ ka ọ ghara ịbụ nkwenye zuru ezu; nsụgharị ahụ na-echekwa ndoputa a.
translation_notes:
  register: Igbo Izugbe nke oge a, dị ugwu ma doo ndị nkịtị anya. E ji “ọgbakọ” zere echiche na ἐκκλησία bụ ụlọ, ebe “dị ka ọgbakọ” na-egosi ọnọdụ ha dịka otu ndị zukọrọ ọnụ.
