review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders the general-person sense of ἄνθρωπος, the reflexive object, and the paired injunctions to eat and drink. However, “mgbe ahụkwa” (“then/after that”) reduces καὶ οὕτως, which means “and thus/in this way,” to a merely temporal sequence. The Greek connects the self-examination with the manner in which one proceeds to eat and drink.
  naturalness: The wording is generally clear and suitably formal. Using “ka o rie ... ma ṅụọ ...” gives a more regular and parallel Standard Igbo expression for the two present imperatives.
  terminology: “Mmadụ” properly preserves the inclusive, generic force of ἄνθρωπος. “Nyochaa onwe ya” is an appropriate rendering of δοκιμαζέτω ἑαυτόν. “Ṅụọ n’iko ahụ” naturally represents drinking from the cup without implying that the cup itself is drunk.
  issues:
  - severity: medium
    issue: “mgbe ahụkwa” for καὶ οὕτως
    rationale: This expression primarily means “then/afterwards,” whereas οὕτως denotes “thus/in this way.” The source does imply a sequence, but its stated connection is manner/result, which should be retained.
  - severity: low
    issue: Nonparallel imperative construction in the final clauses
    rationale: “ya rie ... ma ṅụọ” is understandable, but “ka o rie ... ma ṅụọ” is more idiomatic and maintains the explicit hortatory-imperative structure introduced by “ka mmadụ.”
  revised_text: Ma ka mmadụ nyochaa onwe ya; n’ụzọ dị otu a, ka o rie achịcha ahụ ma ṅụọ n’iko ahụ.
  revised_footnotes: []
  revision_rationale: The revision restores the manner-related force of καὶ οὕτως with “n’ụzọ dị otu a,” while retaining the source’s generic “mmadụ,” its self-examination command, and the bread/cup metonymy. No footnote is necessary.
