id: 1CO.11.28
reference: 1 Corinthians 11:28
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: δοκιμαζέτω δὲ ἄνθρωπος ἑαυτόν, καὶ οὕτως ἐκ τοῦ ἄρτου ἐσθιέτω καὶ ἐκ τοῦ ποτηρίου πινέτω·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/028.yaml
  text: But let a man examine himself, and in this way let him eat from the bread and drink from the cup.
translation:
  language: ig
  text: Ma ka mmadụ nyochaa onwe ya; n’ụzọ dị otu a, ka o rie achịcha ahụ ma ṅụọ n’iko ahụ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δοκιμαζέτω
  choice: ka ... nyochaa
  rationale: Okwu a pụtara inyocha ma ọ bụ ịnwale ihe iji mata ọnọdụ ya; “nyochaa” na-egosi nyocha onwe onye e nyere iwu n’amaokwu a.
- source_word: ἄνθρωπος
  choice: mmadụ
  rationale: N’ebe a, okwu Grik a na-ezo aka n’onye ọ bụla; “mmadụ” bụ okwu Igbo nkịtị nke na-edobe obosara ihe ọ pụtara n’enweghị ịgbakwunye nkọwa gbasara nwoke naanị.
- source_word: ἑαυτόν
  choice: onwe ya
  rationale: Nke a na-edobe nrụtụ aka nke onye ahụ n’onwe ya.
- source_word: καὶ οὕτως
  choice: mgbe ahụkwa
  rationale: Na-egosi na iri na ịṅụ ga-esochi nyocha onwe onye; ọ bụ ụzọ Igbo dị nfe ma doo anya isi gosipụta usoro ahụ.
- source_word: ἐκ τοῦ ἄρτου ἐσθιέτω
  choice: ya rie achịcha ahụ
  rationale: Igbo nkịtị anaghị achọ ka e depụta “site n’achịcha ahụ” n’ụzọ siri ike; ntụgharị a na-edobe ihe e nyere iwu ime na ihe a ga-eri.
- source_word: ἐκ τοῦ ποτηρίου πινέτω
  choice: ma ṅụọ iko ahụ
  rationale: “Ịṅụ iko” bụ ụzọ ebumpụta ụwa n’Igbo isi kwuo ịṅụ ihe dị n’iko ahụ, dịka metonymy dị n’isi mmalite.
theological_decisions:
- issue: Onye okwu ἄνθρωπος na-ezo aka na ya
  choice: mmadụ
  alternative: nwoke
  rationale: N’agbanyeghị na ụfọdụ ntụgharị nwere “nwoke,” ἄνθρωπος n’ọnọdụ a bụ okwu izugbe maka onye; “mmadụ” anaghị emechi iwu a n’ebe ụmụ nwoke naanị nọ.
- issue: Mmekọrịta nyocha onwe onye na iri/ịṅụ
  choice: mgbe ahụkwa
  alternative: n’ụzọ dị otu a
  rationale: οὕτως nwere ike igosi “otu a” ma ọ bụ usoro nke ga-esochi nyocha ahụ. “Mgbe ahụkwa” na-edobe njikọ usoro ahụ n’enweghị ikwu na nyocha ahụ bụ ụzọ e si eri.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị ùgwù ma dị mfe nghọta. E ji usoro iwu “ka ... / ya ...” mee ka ume ndụmọdụ-iwu nke Grik pụta ìhè, ma zere okwu ụka pụrụ iche na nkọwa agbakwunyere.
