revisions:
- from: Ma ka mmadụ nyochaa onwe ya, mgbe ahụkwa, ya rie achịcha ahụ ma ṅụọ iko ahụ.
  to: Ma ka mmadụ nyochaa onwe ya; n’ụzọ dị otu a, ka o rie achịcha ahụ ma ṅụọ n’iko ahụ.
  rationale: The revision restores the manner-related force of καὶ οὕτως with “n’ụzọ dị otu a,” while retaining the source’s generic “mmadụ,” its self-examination command, and the bread/cup metonymy. No footnote is necessary.
  reviewer_model: gpt-5.6-terra
