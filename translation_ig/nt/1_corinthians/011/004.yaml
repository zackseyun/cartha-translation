revisions:
- from: Nwoke ọ bụla nke na-ekpe ekpere ma ọ bụ na-ebu amụma, ebe o nwere ihe n’isi ya[a], na-ewetara isi ya ihere[b].
  to: Nwoke ọ bụla nke, mgbe ọ na-ekpe ekpere ma ọ bụ na-ebu amụma, nwere ihe n’isi ya[a], na-eme isi ya ihere[b].
  rationale: The revision replaces the awkward locative-like “ebe o nwere” with an idiomatic circumstantial construction while retaining the Greek sequence and its deliberate lack of specificity about the item on/from the head. It also slightly smooths the footnote wording without narrowing either lexical or theological ambiguity.
  reviewer_model: gpt-5.6-terra
