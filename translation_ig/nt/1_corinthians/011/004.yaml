source:
  edition: SBLGNT
  text: πᾶς ἀνὴρ προσευχόμενος ἢ προφητεύων κατὰ κεφαλῆς ἔχων καταισχύνει τὴν κεφαλὴν αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/004.yaml
  text: Every man who prays or prophesies with something on his head dishonors his head[a][b].
translation:
  language: ig
  text: Nwoke ọ bụla nke, mgbe ọ na-ekpe ekpere ma ọ bụ na-ebu amụma, nwere ihe n’isi ya[a], na-eme isi ya ihere[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, dịka nsụgharị ọdịnala si ekwu, “onye e kpuchiri isi ya.” N’asụsụ Grik, okwu ahụ pụtara n’ụzọ nkịtị “inwe ihe n’isi ma ọ bụ ihe si n’isi rịdata,” ma ọ kọwaghị kpọmkwem ihe ahụ bụ.
    reason: lexical_alternative
  - marker: b
    text: “Isi ya” nwere ike ịpụta isi anụ ahụ nke nwoke ahụ, ma n’otu oge ahụ ọ na-eme ka a cheta ojiji okwu “isi” n’echiche mmekọrịta n’amaokwu ndị gbara ya gburugburu.
    reason: alternative_reading
lexical_decisions:
- source_word: πᾶς ἀνὴρ
  choice: Nwoke ọ bụla
  rationale: ἀνήρ nwere ike ịpụta ‘nwoke’ ma ọ bụ ‘di’; n’amaokwu a, okwu ahụ gbasara nwoke n’ozuzu ya ma kwekọọ na ‘anyị nwaanyị ọ bụla’ n’amaokwu na-esote, ya mere ‘Nwoke ọ bụla’ anaghị etinye nkọwa di/nwunye n’ime ederede.
- source_word: προσευχόμενος
  choice: nke na-ekpe ekpere
  rationale: Nke a na-egosi nwoke nọ n’omume ikpe ekpere; usoro ahịrịokwu a bụ Igbo doro anya ma dịkwa eke.
- source_word: προφητεύων
  choice: ma ọ bụ na-ebu amụma
  rationale: ‘Ibu amụma’ bụ okwu Igbo a na-aghọta nke ọma maka ikwu ozi amụma; e debeere njikọ ya na ikpe ekpere.
- source_word: κατὰ κεφαλῆς ἔχων
  choice: ebe o nwere ihe n’isi ya
  rationale: Grik ahụ pụtara n’ụzọ nkịtị inwe ihe n’isi ma ọ bụ ihe si n’isi rịdata, ma ọ kpọghị kpọmkwem ụdị ihe mkpuchi ahụ. Nsụgharị a na-echekwa enweghị nkọwa ahụ.
- source_word: καταισχύνει
  choice: na-ewetara … ihere
  rationale: Ngwaa ahụ pụtara ime ka ihere ma ọ bụ enweghị nsọpụrụ bịakwasị onye ma ọ bụ ihe. ‘Na-ewetara … ihere’ bụ okwu Igbo eke nke na-egosipụta ọnọdụ nsọpụrụ na ihere dị n’amaokwu ahụ.
- source_word: τὴν κεφαλὴν αὐτοῦ
  choice: isi ya
  rationale: A na-edebe okwu ‘isi ya’ n’enweghị ịkọwa ma ọ bụ isi anụ ahụ ka a na-ekwu ma ọ bụ onye a kpọrọ ‘isi’ ya n’ọnọdụ gbara ya gburugburu.
theological_decisions:
- issue: Ma κεφαλή n’ahịrịokwu ikpeazụ ọ̀ bụ isi anụ ahụ ka ọ̀ bụ onye bụ isi nwoke ahụ
  choice: E debere ihe abụọ ahụ nwere ike ịpụta site n’iji ‘isi ya.’
  alternative: ‘isi anụ ahụ ya’ ma ọ bụ ‘onye bụ isi ya’
  rationale: 'Okwu Pọl nwere ike ịrụ ọrụ n’ụzọ abụọ: ọ na-ekwu maka isi anụ ahụ, ma n’otu oge ahụ na-eme ka a cheta ojiji mmekọrịta nke ‘isi’ n’amaokwu ndị gbara ya gburugburu. E kwesịghị idozi esemokwu a n’isi ederede.'
translation_notes:
  register: Standard Igbo; asụsụ dị ugbu a, dị ùgwù, ma dị mfe nghọta. E jiri ‘ihe n’isi ya’ zere ịkpọ kpọmkwem ụdị mkpuchi Grik ahụ na-akọwaghị, ma e debere mgbagwoju anya nke ‘isi ya’ n’isi ederede na ndetu ala peeji.
