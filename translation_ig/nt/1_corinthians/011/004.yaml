    issue: The circumstantial phrase “ebe o nwere ihe n’isi ya” is structurally and idiomatically imprecise.
    rationale: It may be read as a locative clause (“where he has...”) rather than expressing the condition/circumstance attached to praying or prophesying. The source describes a man praying or prophesying while having something on/down from his head.
