review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders the generic πᾶς ἀνήρ as “Nwoke ọ bụla,” preserves the coordinated activities of praying and prophesying, and appropriately avoids specifying the unnamed object in κατὰ κεφαλῆς ἔχων. “Isi ya” rightly retains the possible literal and contextual relational resonance of κεφαλή.
  naturalness: '“Ebe o nwere ihe n’isi ya” is not the most natural Standard Igbo construction here: ebe primarily denotes place and can make the clause sound locative rather than circumstantial. Recasting it with “mgbe ọ na-ekpe ekpere ma ọ bụ na-ebu amụma” makes the participial circumstances clear and idiomatic.'
  terminology: “Na-ebu amụma” is an established, understandable rendering for prophesying. “Na-eme isi ya ihere” is a direct and natural Igbo expression for bringing shame/dishonor upon his head. The footnotes preserve the lexical and contextual ambiguity without imposing an interpretation.
  issues:
