  text: ⸀οὐδὲ ⸂ἡ φύσις αὐτὴ⸃ διδάσκει ὑμᾶς ὅτι ἀνὴρ μὲν ἐὰν κομᾷ, ἀτιμία αὐτῷ ἐστιν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/014.yaml
  text: Does not even nature itself teach you that if a man wears long hair[a], it is a dishonor to him[b],
translation:
  language: ig
  text: Ọ̀ bụ na ọbụna okike n’onwe ya adịghị akụziri unu na, ọ bụrụ na nwoke nwere ogologo ntutu isi[a], ọ bụ ihe ihere nye ya[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “hapụ ntutu isi ya ka o too ogologo,” ma ọ bụ, “nwee ogologo ntutu isi.” Ngwaa Grik ahụ na-ezo aka n’inwe ma ọ bụ ikwe ntutu isi ogologo.
    reason: lexical_alternative
  - marker: b
    text: “Okike n’onwe ya” nwere ike ịpụta usoro e kere eke, nghọta ụmụ mmadụ na-enwekarị, ma ọ bụ ihe omenala na-ewere dị ka ihe dabara n’okike; okwu Grik ahụ akọwaghị ya n’ụzọ dị warara n’ebe a.
    reason: alternative_reading
lexical_decisions:
- source_word: οὐδὲ
  choice: Ọ̀ bụ na ọbụna ... adịghị
  rationale: Na-egosipụta ajụjụ nkwupụta nke na-aga n’ihu n’arụmụka Pọl, ma na-echekwa ike okwu ‘ọbụna.’
- source_word: ἡ φύσις αὐτὴ
  choice: okike n’onwe ya
  rationale: ‘N’onwe ya’ na-echekwa nkwusi ike nke αὐτή; ‘okike’ na-ahapụ φύσις ka ọ nọgide nwee nghọta sara mbara.
- source_word: διδάσκει ὑμᾶς
  choice: akụziri unu
  rationale: Nke a bụ nsụgharị doro anya ma bụrụkwa Igbo nkịtị maka echiche izi ihe dị na ngwaa ahụ.
- source_word: ἀνὴρ
  choice: nwoke
  rationale: N’ebe a okwu ahụ na-ezo aka n’ nwoke, ọ bụghị kpọmkwem n’ di.
- source_word: ἐὰν κομᾷ
  choice: ọ bụrụ na nwoke enwee ogologo ntutu isi
  rationale: Na-egosipụta inwe ma ọ bụ iyi ogologo ntutu isi, n’enweghị itinye echiche ọzọ na-adịghị n’okwu Grik.
- source_word: ἀτιμία
  choice: ihe ihere
  rationale: Okwu Igbo a na-enye echiche nke enweghị nsọpụrụ ma ọ bụ ihere n’ụzọ ndị mmadụ na-aghọta nke ọma.
- source_word: αὐτῷ ἐστιν
  choice: ọ bụụrụ ya
  rationale: 'Na-eme ka njikọ ahụ daa nke ọma n’Igbo: ‘ọ bụụrụ ya ihe ihere.’'
theological_decisions:
- issue: Ihe φύσις (‘okike’) pụtara n’arụmụka Pọl
  choice: E debere ya dịka ‘okike n’onwe ya’ n’enweghị ịkọwa ya n’ụzọ dị warara.
  alternative: Usoro e kere eke; nghọta ụmụ mmadụ na-enwekarị; ma ọ bụ ihe omenala na-ewere dị ka ihe kwesịrị ekwesị site n’okike.
  rationale: Okwu Grik ahụ ekwughị kpọmkwem otu n’ime nghọta ndị a; nsụgharị ahụ na-echekwa nghọtahie ahụ kama idozi ya n’otu ụzọ nkà mmụta okpukpe ma ọ bụ omenala.
translation_notes:
  register: Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E jiri usoro ajụjụ nkwupụta chekwaa ụda amaokwu ahụ; e zere okwu ụka pụrụ iche na nkọwa gafere ihe Grik kwuru.
