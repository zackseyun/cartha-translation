    reason: lexical_alternative
  - marker: b
    text: “Okike n’onwe ya” nwere ike ịpụta usoro e kere eke, nghọta ụmụ mmadụ na-enwekarị, ma ọ bụ ihe omenala na-ewere dị ka ihe dabara n’okike; okwu Grik ahụ akọwaghị ya n’ụzọ dị warara n’ebe a.
    reason: alternative_reading
  revision_rationale: The revision makes the predicative statement explicitly present and generic in idiomatic Standard Igbo. It also replaces an unnatural lexical alternative in footnote a while preserving the Greek verb’s semantic range and the interpretive openness of φύσις.
