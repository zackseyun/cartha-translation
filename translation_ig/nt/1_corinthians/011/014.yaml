revisions:
- from: Ọ̀ bụ na ọbụna okike n’onwe ya adịghị akụziri unu na ọ bụrụ na nwoke enwee ogologo ntutu isi[a], ọ bụụrụ ya ihe ihere[b]?
  to: Ọ̀ bụ na ọbụna okike n’onwe ya adịghị akụziri unu na, ọ bụrụ na nwoke nwere ogologo ntutu isi[a], ọ bụ ihe ihere nye ya[b]?
  rationale: The revision makes the predicative statement explicitly present and generic in idiomatic Standard Igbo. It also replaces an unnatural lexical alternative in footnote a while preserving the Greek verb’s semantic range and the interpretive openness of φύσις.
