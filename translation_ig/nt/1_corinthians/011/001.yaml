id: 1CO.11.1
reference: 1 Corinthians 11:1
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: μιμηταί μου γίνεσθε, καθὼς κἀγὼ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/001.yaml
  text: Become imitators of me[b][a], just as I also am of the Messiah.
translation:
  language: ig
  text: Bụrụnụ ndị na-eṅomi m, dị nnọọ ka mụ onwe m bụkwa onye na-eṅomi Mesaịa ahụ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ: “Kraịst.”'
    reason: alternative_reading
lexical_decisions:
- source_word: μιμηταί
  choice: ndị na-eṅomi
  rationale: Nke a na-egosi ndị na-agbaso ihe nlereanya mmadụ site n’ịṅomi ya; ọ kapịrị ọnụ karịa naanị ịsị “ndị na-eso.”
- source_word: μου
  choice: m
  rationale: N’usoro Igbo “ndị na-eṅomi m” na-egosipụta genitive Greek n’ụzọ doro anya ma bụrụkwa okwu a na-asụkarị.
- source_word: γίνεσθε
  choice: Bụrụnụ
  rationale: Imperative a na-agwa ọtụtụ mmadụ okwu ma na-edobe echiche nke ịghọ ma ọ bụ ịnọ n’ọnọdụ a, kama ime ka ọ bụrụ naanị iwu dị larịị.
- source_word: καθὼς
  choice: dị nnọọ ka
  rationale: Ọ na-edobe ike ntụnyere dị na Greek, na-ejikọta ihe nlereanya Pọl na nke Mesaịa.
- source_word: κἀγὼ
  choice: mụ onwe m bụkwa
  rationale: “Bụkwa” na-edobe καί, ebe “mụ onwe m” na-enye ἐγώ nrụgide kwesịrị ekwesị n’Igbo.
- source_word: Χριστοῦ
  choice: Mesaịa ahụ
  rationale: Χριστός bụ aha ọkwá pụtara Onye E Tere Mmanụ; “Mesaịa ahụ” na-ebupụta ihe aha ọkwá ahụ pụtara, ebe ntụaka ụkwụ na-echekwa ụdị ọdịnala “Kraịst.”
theological_decisions:
- issue: Otu e si sụgharịa Χριστοῦ
  choice: Mesaịa ahụ
  alternative: Kraịst
  rationale: E ji “Mesaịa” gosi na Χριστός bụ aha ọkwá, ọ bụghị nanị akụkụ aha mmadụ. A hapụrụ “Kraịst” na ntụaka ụkwụ maka ndị maara ụdị ọdịnala ahụ.
- issue: Ellipsis dị na κἀγὼ Χριστοῦ
  choice: mụ onwe m bụkwa onye na-eṅomi Mesaịa ahụ
  alternative: mụ onwe m kwa [bụ] nke Mesaịa ahụ
  rationale: Greek ahapụla μιμητής n’ahịrịokwu nke abụọ n’ihi na a ghọtara ya site n’ahịrịokwu mbụ. Igbo chọrọ ka e kwughachi “onye na-eṅomi” ka ihe ọ pụtara doo anya; nke a anaghị etinye echiche ọhụrụ, kama ọ na-emeju okwu a hapụrụ n’usoro Greek.
translation_notes:
  register: Asụsụ ahụ bụ Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E ji “ndị na-eṅomi” mee ka echiche iṅomi ihe nlereanya pụta ìhè; e zere “ndị na-eso,” nke nwere ike ịdị obosara karịa ihe Greek kwuru.
