  verdict: approve
  source_fidelity: 'Ntụgharị ahụ na-edobe nke ọma ihe Greek kwuru: iwu ọtụtụ mmadụ dị na γίνεσθε (“Bụrụnụ”), echiche kpọmkwem nke μιμηταί (“ndị na-eṅomi”), na ntụnyere/additive dị na καθὼς κἀγώ. Ikwughachi “onye na-eṅomi” n’akụkụ nke abụọ na-emeju ellipsis Greek n’ụzọ ziri ezi, na-enweghị itinye echiche ọhụrụ.'
  naturalness: “Bụrụnụ ndị na-eṅomi m, dị nnọọ ka mụ onwe m bụkwa onye na-eṅomi Mesaịa ahụ” bụ Standard Igbo a na-aghọta nke ọma, ma nwee register kwesịrị ekwesị maka akwụkwọ ozi Pọl. Ọ bụ ezie na e nwere ike ịhọrọ usoro dị mkpirikpi n’ụzọ stylistic, ederede dị ugbu a adịghị akpa ike ma ọ bụ bụrụ ihe na-adịghị eke.
  terminology: “Ndị na-eṅomi” na-egosipụta μιμηταί karịa “ndị na-eso.” “Mesaịa” bụ ntụgharị aha-ọkwa kwesịrị ekwesị maka Χριστοῦ n’ebe a; ntụaka ụkwụ “Kraịst” na-echekwa ụdị ọdịnala a maara nke ọma. Akara ntụaka [a] dị n’ebe dabara adaba.
