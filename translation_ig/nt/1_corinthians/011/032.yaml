  variant: Standard Igbo
source:
  edition: SBLGNT
  text: κρινόμενοι δὲ ⸀ὑπὸ κυρίου παιδευόμεθα, ἵνα μὴ σὺν τῷ κόσμῳ κατακριθῶμεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/032.yaml
  text: But when we are judged by the Lord[a], we are disciplined, so that we may not be condemned along with the world.
translation:
  language: ig
  text: Ma mgbe Onyenwe anyị na-ekpe anyị ikpe[a], ọ na-agbazi anyị, ka a ghara ịma anyị ikpe ọmụma ọnụ na ụwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Ebe Onyenwe anyị na-ekpe anyị ikpe, ọ na-agbazi anyị.” N’asụsụ Grik, e ji okwu dị n’ụdị ugbu a mee ihe; nke a pụrụ imesi omume na-aga n’ihu ike.
    reason: lexical_alternative
lexical_decisions:
- source_word: κρινόμενοι
  choice: mgbe ... na-ekpe anyị ikpe
  rationale: E ji nkebi oge gosipụta participle dị na present passive, ma chekwaa echiche ikpe dị na κρίνω n’enweghị ịkọwapụta ya karịa ihe Grik kwuru.
- source_word: δὲ
  choice: Ma
  rationale: Ọ na-egosi obere ọdịiche dị n’etiti ịdọ aka ná ntị nke amaokwu gara aga na nzube mmezi dị n’amaokwu a.
- source_word: ὑπὸ κυρίου
  choice: Onyenwe anyị
  rationale: ὑπό na genitive na-egosi onye na-eme ihe ahụ; okwu a ekwesịghị ịgbasa ka ọ bụrụ ‘Onyenwe anyị Jizọs’ ebe ederede kwuru naanị κύριος.
- source_word: παιδευόμεθα
  choice: ọ na-adọ anyị aka ná ntị
  rationale: N’ọnọdụ a, παιδεύω bụ ịzụ na imezi site n’ịdọ aka ná ntị, ọ bụghị naanị inye ntaramahụhụ. Nkebi a bụ Igbo nkịtị ma doo anya.
- source_word: ἵνα μὴ
  choice: ka a ghara
  rationale: Ọ na-echekwa echiche nzube ma ọ bụ ihe a na-achọ izere.
- source_word: σὺν τῷ κόσμῳ
  choice: ya na ụwa
  rationale: Ọ na-egosi iso ụwa kerịta otu ikpe ahụ; ‘ụwa’ na-anọchi anya ụwa dịka otu ìgwè n’ebe a.
- source_word: κατακριθῶμεν
  choice: ịma anyị ikpe ọmụma
  rationale: Nke a na-egosi ikpe na-ama mmadụ ikpe ọmụma, ma na-edobe ọdịiche ya na κρινόμενοι, nke bụ ‘ikpe ikpe’ n’ozuzu ya.
theological_decisions:
- issue: Mmekọrịta dị n’etiti ikpe Onyenwe anyị na-ekpe ugbu a na ikpe ọmụma nke ụwa
  choice: E debere ikpe Onyenwe anyị dị ka ịdọ aka ná ntị na-emezi mmadụ, nke nzube ya bụ ka a ghara ịma anyị ikpe ọmụma ya na ụwa.
  alternative: A pụrụ ịghọta ya naanị dị ka ntaramahụhụ a na-enye n’oge a, n’enweghị ikwu kpọmkwem banyere ọdịiche dị n’etiti ndị kwere ekwe na ndị na-ekweghị ekwe.
  rationale: Ọdịiche dị n’etiti κρίνω na κατακρίνω, tinyere παιδεύω na ἵνα μή, na-egosi mmezi ugbu a nke na-egbochi ikpe ọmụma; nsụgharị ahụ anaghị etinye ozizi zuru ezu banyere nzọpụta ma ọ bụ Nri Anyasị Onyenwe anyị.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E jiri ‘Onyenwe anyị’ mee κύριος, ‘ịdọ aka ná ntị’ mee echiche mmezi nke παιδεύω, ma debe ọdịiche dị n’etiti ‘ikpe ikpe’ na ‘ịma ikpe ọmụma.’
