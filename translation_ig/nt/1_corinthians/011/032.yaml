    text: Ma ọ bụ, “Ebe Onyenwe anyị na-ekpe anyị ikpe, ọ na-agbazi anyị.” N’asụsụ Grik, e ji okwu dị n’ụdị ugbu a mee ihe; nke a pụrụ imesi omume na-aga n’ihu ike.
    reason: lexical_alternative
  revision_rationale: The revision retains the Greek temporal sense (“mgbe”), the Lord’s agency, and the purposeful contrast between corrective judgment now and condemnation with the world. It clarifies the final association phrase and uses a more faithful, natural Igbo expression for corrective discipline.
