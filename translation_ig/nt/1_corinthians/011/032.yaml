revisions:
- from: Ma mgbe Onyenwe anyị na-ekpe anyị ikpe[a], ọ na-adọ anyị aka ná ntị, ka a ghara ịma anyị ikpe ọmụma ya na ụwa.
  to: Ma mgbe Onyenwe anyị na-ekpe anyị ikpe[a], ọ na-agbazi anyị, ka a ghara ịma anyị ikpe ọmụma ọnụ na ụwa.
  rationale: The revision retains the Greek temporal sense (“mgbe”), the Lord’s agency, and the purposeful contrast between corrective judgment now and condemnation with the world. It clarifies the final association phrase and uses a more faithful, natural Igbo expression for corrective discipline.
