id: 1CO.11.3
reference: 1 Corinthians 11:3
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: θέλω δὲ ὑμᾶς εἰδέναι ὅτι παντὸς ἀνδρὸς ἡ κεφαλὴ ὁ Χριστός ἐστιν, κεφαλὴ δὲ γυναικὸς ὁ ἀνήρ, κεφαλὴ δὲ ⸀τοῦ Χριστοῦ ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/003.yaml
  text: But I want you to know that the head of every man is Messiah[a], and the head of a woman is the man[b], and the head of Messiah is God.
translation:
  language: ig
  text: Ma achọrọ m ka unu mara na isi nke nwoke ọ bụla bụ Mesaịa[a], isi nke nwanyị bụ nwoke[b], isi nke Mesaịa bụkwa Chineke.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, a pụrụ ịghọta “isi” dịka “isi mmalite” ma ọ bụ “ikike n’elu”; edemede bụ isi na-edobe ihe atụ Grik ahụ.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịghọta “nwanyị” na “nwoke” ebe a dịka “nwunye” na “di.”
    reason: alternative_reading
lexical_decisions:
- source_word: θέλω δὲ ὑμᾶς εἰδέναι
  choice: Ma achọrọ m ka unu mara
  rationale: Ọ na-egosipụta ọchịchọ Pọl n'ụzọ doro anya ma dịkwa eke n'Igbo; “Ma” na-egosi ntakịrị ntụgharị n'okwu.
- source_word: παντὸς ἀνδρὸς
  choice: nwoke ọ bụla
  rationale: ἀνήρ nwere ike ịbụ nwoke ma ọ bụ di; ebe a, usoro ahịrịokwu ahụ na-akwado nghọta sara mbara, ebe e debere nghọta nke di na nwunye n'okpuru ederede.
- source_word: κεφαλή
  choice: isi
  rationale: “Isi” na-edobe ihe atụ Grik ahụ n'emebighị esemokwu ma ọ pụtara isi mmalite, onyeisi, ma ọ bụ onye nwere ikike.
- source_word: ὁ Χριστός / τοῦ Χριστοῦ
  choice: Mesaịa
  rationale: Χριστός na-arụ ọrụ dịka aha-ọkwa ebe a; “Mesaịa” na-egosipụta nke ahụ kama ime ya naanị aha mmadụ.
- source_word: γυναικός
  choice: nwanyị
  rationale: γυνή nwere ike ịbụ nwanyị ma ọ bụ nwunye; “nwanyị” na-edobe nghọta izugbe nke ahịrịokwu ahụ.
- source_word: ὁ ἀνήρ
  choice: nwoke ahụ
  rationale: Edemede ὁ na mmekọrịta ya na γυναικός na-akwado “nwoke ahụ,” ma o nwekwara ike ịpụta di ya dịka e gosiri n'okpuru ederede.
- source_word: ὁ θεός
  choice: Chineke
  rationale: Nke a bụ nsụgharị Igbo a na-ejikarị eme ihe maka θεός.
theological_decisions:
- issue: Ihe κεφαλή pụtara n'ahịrịokwu atọ ahụ
  choice: Idobe ihe atụ ahụ dịka “isi”
  alternative: “isi mmalite” ma ọ bụ “onye nwere ikike n'isi”
  rationale: Grik ahụ n'onwe ya ji ihe atụ nke “isi”; nsụgharị ekwesịghị ikpebi esemokwu nkọwa ahụ n'ime isi ederede.
- issue: Ma ἀνήρ na γυνή pụtara nwoke/nwanyị ka ha bụ di/nwunye
  choice: “nwoke” na “nwanyị” n'isi ederede
  alternative: “di” na “nwunye”
  rationale: Usoro ahịrịokwu ndị yiri ibe ha na-akwado nghọta izugbe, ma okwu Grik ndị ahụ nwekwara ike ịpụta ndị lụrụ di na nwunye.
- issue: Mmekọrịta dị n'okwu “isi nke Mesaịa bụkwa Chineke”
  choice: Ịsụgharị ya kpọmkwem n'enweghị nkọwa agbakwunyere
  alternative: Nkọwa ga-akọwa ya naanị dịka usoro ọrụ ma ọ bụ ọkwa
  rationale: Nke a na-edobe okwu na esemokwu nkà mmụta okpukpe dị na isi mmalite, n'etinyeghị nkọwa otu ụka n'ime ederede.
translation_notes:
  register: Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. E ji “unu” mee ọtụtụ ndị Pọl na-agwa okwu; e debere usoro ahịrịokwu atọ yiri ibe ha na ihe atụ “isi.”
