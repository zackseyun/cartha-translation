review_pass:
  verdict: revise
  source_fidelity: The draft correctly renders γάρ, the man/woman pairing, and the strong contrast. However, "n’ahụ" ('from the body of') adds an explicit bodily source not stated in the Greek, whose ἐκ/ἐξ simply marks origin.
  naturalness: '"Si na ... pụta" is natural Standard Igbo for origin in this concise creational contrast. Removing "n’ahụ" also makes the line less heavy and avoids an unnecessarily anatomical expression.'
  terminology: '"Nwoke/nwanyị" appropriately preserves the broader creational reference of ἀνήρ/γυνή. The alternative "di/nwunye" remains suitably confined to the footnote.'
  issues:
