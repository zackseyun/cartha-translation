  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οὐ γάρ ἐστιν ἀνὴρ ἐκ γυναικός, ἀλλὰ γυνὴ ἐξ ἀνδρός·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/008.yaml
  text: For man is not from woman[a], but woman from man.
translation:
  language: ig
  text: N’ihi na nwoke esighị na nwanyị pụta, kama nwanyị si na nwoke pụta.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γάρ
  choice: N’ihi na
  rationale: Ọ na-ewebata ihe mere e ji kwuo okwu bu ya ụzọ ma ọ bụ ihe na-akwado ya; nke a bụ njikọ doro anya ma bụrụkwa nke a na-ejikarị eme ihe n’Igbo.
- source_word: ἀνὴρ / ἀνδρός
  choice: nwoke
  rationale: N’arụmụka a gbasara okike, okwu ndị a na-arụtụ aka n’ebe nwoke nọ n’ozuzu ya, ọ bụghị nanị di.
- source_word: γυναικός / γυνὴ
  choice: nwanyị
  rationale: N’ebe a, okwu a na-arụtụ aka n’ebe nwanyị nọ n’ozuzu ya, dịka akụkụ nke ntụaka ahụ banyere okike, ọ bụghị nanị nwunye.
- source_word: ἐκ / ἐξ
  choice: si n’ahụ ... pụta
  rationale: N’ebe a, preposition ahụ na-egosi ebe mmadụ si malite ma ọ bụ onye e si n’ahụ ya nweta ya. Nsụgharị a na-eme ka echiche ahụ doo anya n’Igbo, karịsịa dịka ntụaka e zoro aka na ya bụ akụkọ okike.
- source_word: ἀλλὰ
  choice: kama
  rationale: Ọ na-egosi ọdịiche siri ike n’etiti akụkụ abụọ nke ahịrịokwu ahụ.
- source_word: ἐστιν
  choice: esighị ... pụta
  rationale: E tinyere ngwaa ahụ n’usoro okwu Igbo e ji ekwupụta mmalite ma ọ bụ isi iyi, kama ịsụgharị ya dịka copula naanị.
theological_decisions:
- issue: Ma ἀνήρ/γυνή ga-abụ ‘nwoke/nwanyị’ ka ọ bụ ‘di/nwunye’
  choice: nwoke/nwanyị
  alternative: di/nwunye
  rationale: Arụmụka Pọl na-ezo aka n’usoro okike ma na-elekwasị anya n’ebe onye si malite. ‘Nwoke/nwanyị’ na-edobe echiche sara mbara nke okwu Grik ahụ, ebe ‘di/nwunye’ ga-eme ka ọ bụrụ naanị ihe gbasara alụmdi na nwunye.
translation_notes:
  register: Asụsụ Igbo Izugbe nke dị ugbu a, dị ùgwù ma dị mfe nghọta. E jiri ‘si n’ahụ ... pụta’ gosipụta echiche nke isi mmalite n’ụzọ ebumpụta ụwa, ma debe ọdịiche na mgbagwoju anya dị n’etiti ‘nwoke/nwanyị’ na ‘di/nwunye’ n’okpuru ala peeji.
