    rationale: SBLGNT has ἐκ γυναικός / ἐξ ἀνδρός, 'from woman / from man,' without a word for 'body.' In this context the addition may be inferable from the creation argument, but it over-specifies the source expression and should not be placed in the main text or alternative rendering.
  revised_text: N’ihi na nwoke esighị na nwanyị pụta, kama nwanyị si na nwoke pụta.
