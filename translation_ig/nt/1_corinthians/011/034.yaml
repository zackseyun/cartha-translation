id: 1CO.11.34
reference: 1 Corinthians 11:34
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸀εἴ τις πεινᾷ, ἐν οἴκῳ ἐσθιέτω, ἵνα μὴ εἰς κρίμα συνέρχησθε. Τὰ δὲ λοιπὰ ὡς ἂν ἔλθω διατάξομαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/034.yaml
  text: If anyone is hungry[a], let him eat at home, so that you may not come together for judgment. And I will give directions about the rest when I come.
translation:
  language: ig
  text: Ọ bụrụ na agụụ na-agụ onye ọ bụla, ya rie nri n'ụlọ, ka unu ghara ịgbakọta ọnụ maka ikpe.[a] Ma ihe ndị ọzọ fọdụrụ, aga m enye ntụziaka banyere ha mgbe m bịara.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “maka ikpe ọmụma.” Okwu Grik κρίμα nwere ike ịpụta “ikpe” ma ọ bụ “ikpe ọmụma.” N'ebe a, “ikpe” kacha daba n'ihe gbara ya gburugburu, ebe Pọl na-ekwu banyere ịdọ aka ná ntị Onyenwe anyị na-enye ugbu a, ọ bụghị ikpe ọmụma ikpeazụ (amaokwu 29–32).
    reason: lexical_alternative
lexical_decisions:
- source_word: πεινᾷ
  choice: agụụ na-agụ
  rationale: Nke a bụ ụzọ Igbo nkịtị si akọwa ọnọdụ agụụ dị ugbu a; ọ dabara na present indicative Grik.
- source_word: ἐν οἴκῳ
  choice: n'ụlọ
  rationale: Ọ na-ezo aka iri nri n'ebe obibi mmadụ, ọ bụghị n'ọgbakọ chọọchị; “n'ụlọ” bụ okwu Igbo kacha eke.
- source_word: ἐσθιέτω
  choice: ya rie nri
  rationale: Ọ na-edobe ike nke iwu dị na third-person imperative ma bụrụkwa Igbo doro anya.
- source_word: εἰς κρίμα
  choice: maka ikpe
  rationale: “Ikpe” na-echekwa obosara nke κρίμα dị ka ikpe ma ọ bụ mkpebi ikpe, n'ekwughị hoo haa na ọ bụ ikpe ọmụma ikpeazụ.
- source_word: συνέρχησθε
  choice: unu ... ịgbakọta ọnụ
  rationale: Ọ na-edobe njikọ okwu banyere nzukọ ọgbakọ nke a na-ahụ ugboro ugboro n'akụkụ akwụkwọ ozi a.
- source_word: Τὰ δὲ λοιπὰ
  choice: Ma ihe ndị ọzọ fọdụrụ
  rationale: Ọ bụ ntụgharị eke nke na-egosi na e nwere ihe ndị ọzọ Pọl ga-elebara anya ma e mesịa.
- source_word: ὡς ἂν ἔλθω
  choice: mgbe m bịara
  rationale: Ọ na-egosi oge nleta Pọl a na-atụ anya ya n'ọdịnihu n'Igbo eke.
- source_word: διατάξομαι
  choice: aga m enye ntụziaka
  rationale: Ọ na-egosipụta echiche nke ịhazi ma ọ bụ inye iwu banyere ihe a ga-eme n'ụzọ doro anya ma dị ugbu a.
theological_decisions:
- issue: Ihe κρίμα pụtara n'ịdọ aka ná ntị banyere nzukọ maka Nri Anyasị Onyenwe anyị
  choice: ikpe, nke nwere ike ịpụta ikpe ịdọ aka ná ntị sitere n'aka Chineke
  alternative: ikpe ọmụma
  rationale: Amaokwu 29–32 gbara ya gburugburu na-ekwu banyere ikpe na ịdọ aka ná ntị nke Onyenwe anyị ma kewapụ ya n'ịbụ ndị a mara ikpe ya na ụwa. “Ikpe” na-edobe esemokwu na obosara okwu Grik ahụ.
- issue: τις nke na-ezo aka n'onye ọ bụla na imperative singular
  choice: onye ọ bụla ... ya rie nri
  alternative: onye ahụ rie nri
  rationale: Nke a na-edobe singular nke Grik ma na-agụkwa nke ọma n'Igbo, n'etinyeghị nwoke ma ọ bụ nwanyị ebe Grik akọwaghị ya.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta, dee ya. A họọrọ “ya rie nri” iji chekwaa iwu singular n'ụzọ Igbo eke; e debere “ikpe” ka a ghara imechi obosara na esemokwu nke κρίμα.
