id: 1CO.11.6
reference: 1 Corinthians 11:6
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἰ γὰρ οὐ κατακαλύπτεται γυνή, καὶ κειράσθω· εἰ δὲ αἰσχρὸν γυναικὶ τὸ κείρασθαι ἢ ξυρᾶσθαι, κατακαλυπτέσθω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/006.yaml
  text: For if a woman does not cover her head[a], she should also have her hair cut off; but if it is disgraceful for a woman to have her hair cut off or to be shaved[b], she should cover her head.
translation:
  language: ig
  text: N’ihi na ọ bụrụ na nwanyị anaghị ekpuchi isi ya[a], ya kpụkwaa ntutu isi ya mkpụmkpụ. Ma ọ bụrụ na ọ bụ ihe ihere nye nwanyị ka a kpụọrọ ya ntutu isi mkpụmkpụ ma ọ bụ ka a kpụchapụ isi ya, ya kpuchie isi ya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “nwunye” n’amaokwu a dum; okwu Grik gynē nwere ike ịpụta “nwanyị” ma ọ bụ “nwunye,” dabere n’okirikiri okwu.
    reason: alternative_reading
  - marker: b
    text: A pụkwara ịsụgharị ya, “ka e kpuchie ya” ma ọ bụ “ka e kpuchie ya ákwà”; ngwaa Grik ahụ na-ekwu maka ikpuchi ekpuchi, ebe okirikiri okwu na-egosi na ọ bụ isi ka a na-ekwu maka ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατακαλύπτεται / κατακαλυπτέσθω
  choice: anaghị ekpuchi isi ya / ya kpuchie isi ya
  rationale: Ngwaa Grik ahụ pụtara ikpuchi ma ọ bụ iji ákwà kpuchie. N’ihi na ihe a na-ekwu bụ mkpuchi isi, e mere ka ‘isi ya’ pụta ìhè n’Igbo, ma a kọwaghị kpọmkwem ụdị ihe mkpuchi ahụ.
- source_word: γυνή
  choice: nwanyị
  rationale: γυνή nwere ike ịpụta ‘nwanyị’ ma ọ bụ ‘nwunye.’ Amaokwu a ekwughị di kpọmkwem, ya mere ‘nwanyị’ na-echekwa okwu ahụ ka ọ ghara ịdị warara; e debere ‘nwunye’ dị ka ụzọ ọzọ na nkọwa ala peeji.
- source_word: κειράσθω / τὸ κείρασθαι
  choice: ya kpụkwaa ntutu isi ya mkpụmkpụ / ka a kpụọrọ ya ntutu isi mkpụmkpụ
  rationale: Okwu ahụ na-ezo aka n’ịkpụ ma ọ bụ n’ịkwa ntutu nke ukwuu, ma ọ bụghị ịkpụchapụ isi kpamkpam. ‘Kpụ ntutu isi mkpụmkpụ’ bụ Igbo doro anya nke na-edobe ọdịiche ya na ξυρᾶσθαι.
- source_word: καί
  choice: -kwaa
  rationale: 'Mgbakwunye ‘-kwaa’ na-egosipụta ‘kwa/ọzọkwa’ dị n’arụmụka ahụ: ọ bụrụ na ọ naghị ekpuchi isi, ya nabatakwa ihe nke ọzọ.'
- source_word: αἰσχρόν
  choice: ihe ihere
  rationale: ‘Ihe ihere’ na-eburu echiche nke ihere na mmebi ugwu n’ihu ọha nke okwu Grik ahụ nwere n’ebe a.
- source_word: ξυρᾶσθαι
  choice: ka a kpụchapụ ya isi
  rationale: Nke a na-egosi ịkpụchapụ ntutu isi kpamkpam, ma na-edobe ọdịiche ya na ịkpụ ntutu mkpụmkpụ.
- source_word: γὰρ ... δέ
  choice: N’ihi na ... Ma
  rationale: 'Njikọ ndị a na-egosipụta usoro echiche Pọl: nke mbụ na-enye ihe kpatara okwu gara aga, nke abụọ ewebata ọdịiche.'
theological_decisions:
- issue: Ma γυνή kwesịrị ịbụ ‘nwanyị’ ka ọ bụ ‘nwunye’
  choice: nwanyị
  alternative: nwunye
  rationale: Amaokwu ahụ n’onwe ya anaghị akpọ di ma ọ bụ kee okwu ahụ naanị nye ndị lụrụ di. ‘Nwanyị’ na-echekwa obosara okwu Grik ahụ, ebe nkọwa ala peeji na-egosi na ‘nwunye’ ka nwekwara ike ịbụ nghọta ya dabere n’okirikiri okwu.
- issue: Ma κατακαλύπτεσθαι ga-akọwa ụdị ihe mkpuchi isi kpọmkwem
  choice: kpuchie isi ya
  alternative: kpuchie onwe ya / yiri ákwà mkpuchi n’isi
  rationale: Grik na-ekwu maka ịbụ onye e kpuchiri ekpuchi, ebe okirikiri okwu na-egosi isi. Nsụgharị ahụ mere ka isi doo anya, ma o zere ịkpọ otu ụdị uwe ma ọ bụ ákwà mkpuchi kpọmkwem.
translation_notes:
  register: E ji Standard Igbo nke dị ugbu a, dị ugwu ma dị mfe nghọta. Usoro ‘ya + ngwaa’ na-enye iwu ahụ ụda nkwubi okwu dabara n’arụmụka Pọl. E ji ‘kpụ ntutu isi mkpụmkpụ’ na ‘kpụchapụ isi’ kewaa nke ọma echiche κείρω na ξυράω.
