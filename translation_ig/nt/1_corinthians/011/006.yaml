review_pass:
  verdict: revise
  source_fidelity: The main translation accurately preserves the conditional argument, the contrast between cropping the hair (κείρασθαι) and shaving it (ξυρᾶσθαι), and the social-shame force of αἰσχρόν. Rendering γυνή as “nwanyị” is appropriately nonrestrictive, with “nwunye” retained as a contextual alternative. A small adjustment makes the shaving expression more idiomatic and makes footnote b accurately reflect the Greek middle/passive form without imposing a particular kind of covering.
  naturalness: The revised wording is clear Standard Igbo and retains a formal but natural biblical register. “Ka a kpụchapụ isi ya” is more idiomatic and direct than “ka a kpụchapụ ya isi.”
  terminology: “kpuchie isi ya,” “ntutu isi ... mkpụmkpụ,” “kpụchapụ isi,” and “ihe ihere” communicate the relevant terms faithfully. The revised note avoids saying that the Greek verb itself means specifically “use a head covering”; rather, it states the viable passive rendering and then identifies the implied head context.
  issues:
  - severity: low
    issue: The wording for shaving is slightly awkward.
    rationale: “Ka a kpụchapụ ya isi” is understandable, but “ka a kpụchapụ isi ya” is the more natural Standard Igbo way to say that her head is shaved.
  - severity: medium
    issue: Footnote b overstates and slightly misdescribes the lexical alternative.
    rationale: The Greek κατακαλυπτέσθω can be rendered “let her be covered/veiled.” The existing note’s proposed alternative, “ya were ihe mkpuchi kpuchie onwe ya,” shifts to an explicitly instrumental active formulation and then defines the verb as merely passive. The note should preserve the Greek ambiguity while noting that the context implies the head.
  revised_text: N’ihi na ọ bụrụ na nwanyị anaghị ekpuchi isi ya[a], ya kpụkwaa ntutu isi ya mkpụmkpụ. Ma ọ bụrụ na ọ bụ ihe ihere nye nwanyị ka a kpụọrọ ya ntutu isi mkpụmkpụ ma ọ bụ ka a kpụchapụ isi ya, ya kpuchie isi ya.[b]
