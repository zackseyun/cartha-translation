id: 1CO.11.16
reference: 1 Corinthians 11:16
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἰ δέ τις δοκεῖ φιλόνεικος εἶναι, ἡμεῖς τοιαύτην συνήθειαν οὐκ ἔχομεν, οὐδὲ αἱ ἐκκλησίαι τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/016.yaml
  text: But if anyone seems to be contentious[a], we have no such custom[b], nor do the churches of God.
translation:
  language: ig
  text: Ma ọ bụrụ na onye ọ bụla chere na ọ bụ onye na-achọ esemokwu[a], anyị enweghị omenala dị otu a[b], ọgbakọ Chineke enweghịkwa ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “onye na-ese okwu” ma ọ bụ “onye na-enwe mmasị n'esemokwu.”
    reason: lexical_alternative
  - marker: b
    text: “Omenala dị otu a” nwere ike ịpụta ma omenala nke ịchọ esemokwu, ma ọ bụ omume a na-arụrịta ụka banyere ya n'amaokwu ndị bu ụzọ.
    reason: alternative_reading
lexical_decisions:
- source_word: δοκεῖ
  choice: echee
  rationale: N'ebe a, δοκεῖ tinyere infinitive nwere ike ịpụta ‘echee na’ ma ọ bụ ‘yie ka.’ ‘Echee’ bụ okwu Igbo dị mfe nke na-edobe ohere na ọ bụ echiche ma ọ bụ ọnọdụ onye ahụ n'onwe ya.
- source_word: φιλόνεικος
  choice: onye na-achọ esemokwu
  rationale: Nkebiokwu a na-egosi onye ihe na-atọ ya ụtọ bụ ịrụ ụka ma ọ bụ ịkpata esemokwu; ọ bụ okwu Igbo doro anya ma dịkwa mma n'okwu ịdọ aka ná ntị a.
- source_word: τοιαύτην
  choice: dị otu a
  rationale: Ọ na-atụ aka n'ụdị omume ma ọ bụ omenala a kpọtụrụla, n'emeghị ka ihe ọ na-ekwu kpọmkwem sie ike karịa Grik.
- source_word: συνήθειαν
  choice: omenala
  rationale: συνήθεια nwere ike ịbụ omume a na-emekarị, usoro, ma ọ bụ omenala a nabatara. ‘Omenala’ na-egosi omume obodo nabatara ma na-ahapụkwa ihe ọ na-atụ aka na ya ka ọ ghe oghe.
- source_word: οὐκ ἔχομεν
  choice: anyị enweghị
  rationale: Nke a bụ ntụgharị kwụ ọtọ na nke okike nke na-etinyeghị echiche ndị ọzọ dịka ‘anyị anaghị ekwe’ ma ọ bụ ‘anyị anaghị eso.’
- source_word: ἐκκλησίαι τοῦ θεοῦ
  choice: ọgbakọ Chineke niile
  rationale: ‘Ọgbakọ Chineke’ na-egosi ọgbakọ ndị bụ nke Chineke; ‘niile’ na-eme ka ọtụtụ aha ahụ bụrụ nke doro anya n'Igbo ma kwekọọ n'ịkpọku ọgbakọ dị iche iche.
theological_decisions:
- issue: Ihe ‘omenala dị otu a’ na-atụ aka na ya
  choice: A hapụrụ ya n'ụzọ sara mbara dịka ‘omenala dị otu a,’ n'ekwughị kpọmkwem ma ọ bụ omume nke ịchọ esemokwu ka ọ bụ omume a na-arụrịta ụka banyere ya n'amaokwu ndị bu ụzọ.
  alternative: Ọ pụrụ ịpụta na ha enweghị omenala nke ịchọ esemokwu, ma ọ bụ na ọgbakọ enweghị omenala ọzọ megidere omume e kwuru banyere ya n'amaokwu ndị bu ụzọ.
  rationale: τοιαύτην συνήθειαν dị mkpụmkpụ na Grik, ihe ọ na-atụ aka na ya adịghịkwa doo anya kpamkpam. Ịhapụ ya otú a na-echekwa nghọta abụọ ahụ n'emeghị ka otu bụrụ naanị ya.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ ‘ọgbakọ’ maka ἐκκλησίαι iji zoo aka n'òtù ndị kwere ekwe, ọ bụghị ụlọ; e debere ihe Grik na-ahapụ n'amaghị ama n'amaokwu a.
