    text: “Omenala dị otu a” nwere ike ịpụta ma omenala nke ịchọ esemokwu, ma ọ bụ omume a na-arụrịta ụka banyere ya n'amaokwu ndị bu ụzọ.
    reason: alternative_reading
  revision_rationale: The revision removes the unsupported universal “niile” while preserving the plural collective sense of “churches of God.” It also replaces an unidiomatic lexical alternative in footnote a. The translation continues to leave the referent of “omenala dị otu a” open, as does the Greek and the English audit trail.
