revisions:
- from: Ma ọ bụrụ na onye ọ bụla echee na ọ ga-abụ onye na-achọ esemokwu[a], anyị enweghị omenala dị otu a[b], ọgbakọ Chineke niile enweghịkwa ya.
  to: Ma ọ bụrụ na onye ọ bụla chere na ọ bụ onye na-achọ esemokwu[a], anyị enweghị omenala dị otu a[b], ọgbakọ Chineke enweghịkwa ya.
  rationale: The revision removes the unsupported universal “niile” while preserving the plural collective sense of “churches of God.” It also replaces an unidiomatic lexical alternative in footnote a. The translation continues to leave the referent of “omenala dị otu a” open, as does the Greek and the English audit trail.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T18:12:46Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly retains the conditional construction, the disputedly broad reference of τοιαύτην συνήθειαν, and the final appeal to the churches of God. However, “ọgbakọ Chineke niile” introduces “all,” which is not stated in the Greek (αἱ ἐκκλησίαι τοῦ θεοῦ).
  naturalness: The main wording is generally understandable Standard Igbo. “Onye na-achọ esemokwu” is natural, though it can suggest actively provoking disputes; it remains a suitable concise rendering here. The proposed footnote alternative “onye esemokwu na-atọ ụtọ” is not idiomatic Igbo and should be replaced.
  terminology: “Ọgbakọ Chineke” is an appropriate rendering of ἐκκλησίαι τοῦ θεοῦ. “Omenala” can convey established custom, although “omume” is also possible. The revised wording avoids adding a universal quantifier while retaining the ambiguity concerning the custom.
  issues:
  - severity: medium
    issue: The word “niile” has been added in “ọgbakọ Chineke niile.”
    rationale: The plural “churches” does not itself mean “all churches.” Adding “all” broadens Paul’s statement beyond the source text.
  - severity: low
    issue: Footnote a contains the unnatural expression “onye esemokwu na-atọ ụtọ.”
    rationale: This does not naturally express a person who enjoys or is inclined toward strife. “Onye na-enwe mmasị n'esemokwu” is clear and idiomatic.
  revised_text: Ma ọ bụrụ na onye ọ bụla chere na ọ bụ onye na-achọ esemokwu[a], anyị enweghị omenala dị otu a[b], ọgbakọ Chineke enweghịkwa ya.
  revised_footnotes:
