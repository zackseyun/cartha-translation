base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/024.yaml
  text: And after giving thanks[a], he broke it and said, “This is my body, which is for you[b]. Keep doing this in remembrance of me.”
translation:
  language: ig
  text: 'Mgbe o nyechara ekele, ọ nyawara ya wee sị, “Nke a bụ ahụ m, nke bụ maka unu[a][b]. Nọgidenụ na-eme nke a iji na-echeta m.”


    [a] A pụkwara ịsụgharị ya “maka ọdịmma unu” ma ọ bụ “n’ihi unu.”


    [b] Ụfọdụ ihe odide oge ochie gbakwụnyere okwu “nke e nyawara” mgbe okwu “maka unu” gasịrị: “Nke a bụ ahụ m, nke e nyawara maka unu.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “maka ọdịmma unu” ma ọ bụ “n’ihi unu.”
    reason: lexical_alternative
  - marker: b
    text: 'Ụfọdụ ihe odide oge ochie gbakwụnyere okwu “nke e nyawara” mgbe okwu “maka unu” gasịrị: “Nke a bụ ahụ m, nke e nyawara maka unu.”'
    reason: textual_variant
lexical_decisions:
- source_word: εὐχαριστήσας
  choice: Mgbe o nyechara ekele
  rationale: Aorist participle ahụ na-egosi ihe mere tupu ọ nyawaa achịcha; ntụgharị a na-egosi usoro ahụ n’Igbo doro anya ma dịkwa mfe.
- source_word: ἔκλασεν
  choice: ọ nyawara ya
  rationale: ‘Ịnyawa’ dabara n’omume ịnyawa achịcha; ‘ya’ na-ezo aka n’achịcha ahụ nke okwu ndị gbara amaokwu a gburugburu mere ka o doo anya.
- source_word: Τοῦτό μού ἐστιν τὸ σῶμα
  choice: Nke a bụ ahụ m
  rationale: A sụgharịrị njikọ copula ahụ ozugbo, n’etinyeghị okwu dịka ‘na-anọchi anya,’ nke ga-ekpebi esemokwu nkà mmụta okpukpe nke Grik ahụ n’onwe ya na-ekpebighị.
- source_word: τὸ ὑπὲρ ὑμῶν
  choice: nke bụ maka unu
  rationale: ‘Maka unu’ na-edobe echiche uru na nnọchite anya nke ὑπέρ nwere ike ibu, n’akọwaghị ya karịa ihe Grik kwuru.
- source_word: τοῦτο ποιεῖτε
  choice: Nọgidenụ na-eme nke a
  rationale: Present imperative ahụ, n’ọnọdụ iwu a, na-akwado omume a na-eme ugboro ugboro ma ọ bụ na-aga n’ihu; okwu Igbo a na-eme ka ike ahụ pụta ìhè.
- source_word: εἰς τὴν ἐμὴν ἀνάμνησιν
  choice: iji na-echeta m
  rationale: Nke a na-egosi ebumnuche nke ime omume ahụ dịka ncheta Jizọs, n’asụsụ Igbo nkịtị ma dị ùgwù.
theological_decisions:
- issue: Ihe ‘Nke a bụ ahụ m’ pụtara n’ihe gbasara Nri Anyasị Onyenweanyị
  choice: E debere ya dịka ‘Nke a bụ ahụ m’ n’enweghị nkọwa ọzọ.
  alternative: ‘Nke a na-anọchi anya ahụ m,’ ma ọ bụ nkọwa ga-ekwusi ike na ọnụnọ ahụ bụ nke sacrament kpọmkwem.
  rationale: Ụdị okwu Grik ahụ anaghị akọwa etu njikọ ahụ si arụ ọrụ; ntụgharị ahụ na-ahapụ esemokwu nkà mmụta okpukpe ahụ dịka ọ dị.
- issue: Ike okwu ὑπὲρ ὑμῶν
  choice: maka unu
  alternative: n’aha unu; n’ihi unu
  rationale: Nhọrọ a na-egosi na ahụ ahụ bụ maka uru ha ma ọ bụ n’ọnọdụ ha, ma ọ naghị ebubata usoro nkọwa mgbapụta pụrụ iche.
translation_notes:
  register: Standard Igbo nke oge a, dị mfe nghọta ma dị ùgwù. E jiri ‘unu’ gosi na a na-agwa ọtụtụ ndị okwu. E tinyere akara ndetu abụọ ahụ n’ebe τὸ ὑπὲρ ὑμῶν dị, ebe ha metụtara, kama itinye ndetu [a] n’akụkụ ‘ekele,’ n’ihi na ọdịnaya ndetu ahụ bụ maka ὑπέρ.
