  source_fidelity: 'Isi ntụgharị a na-esochi SBLGNT nke ọma: εὐχαριστήσας, ἔκλασεν, okwu ‘Nke a bụ ahụ m,’ τὸ ὑπὲρ ὑμῶν, na iwu present imperative ahụ ka edobere. ‘Nọgidenụ na-eme’ kwekọrọ n’ọrụ na-aga n’ihu nke ποιεῖτε n’ọnọdụ a, n’agbanyeghị na ọ na-eme ugboro ugboro pụta ìhè karịa naanị ‘meenụ.’'
  naturalness: Igbo bụ Standard Igbo, dị mfe ma nwee ugwu kwesịrị ekwesị. ‘Mgbe o nyechara ekele’ na ‘ọ nyawara ya’ dị mma n’usoro akụkọ a. A chọrọ obere mmezi n’ahịrịokwu nke ndetu variant ka o doo anya na ọ bụ ‘ahụ’ ka e nyawara, ọ bụghị ‘nke a’ dịka isiokwu na-enweghị onye mere ya.
  terminology: ‘Ahụ m,’ ‘maka unu,’ na ‘iji na-echeta m’ na-edobe okwu na nghọta nke isi Grik n’enweghị ikpebi ozizi Oriri Nsọ. Ma ‘n’aha unu’ abụghị ezigbo ụzọ ọzọ maka ὑπὲρ ὑμῶν ebe a; ọ pụtara ‘in your name’ karịa ‘for your benefit/on your behalf.’
  issues:
