    rationale: ‘N’aha unu’ na-adịkarị ka ‘in your name’ ma ọ bụ ‘by your authority,’ nke anaghị egosipụta nke ọma uru/nnọchite anya ὑπέρ με genitive na ahịrịokwu a. ‘Maka ọdịmma unu’ na ‘n’ihi unu’ ka dabara adaba.
  - severity: low
    issue: Okwu variant ‘nke a nyawara’
    rationale: N’Igbo, ‘nke a nyawara’ nwere ike ịdị ka ‘this which broke’ ma ọ bụ hapụ onye na-eme omume ahụ ka ọ ghara ido anya. ‘Nke e nyawara maka unu’ na-ekwu nke ọma na ụfọdụ ihe odide na-agbakwụnye ‘broken’ banyere ahụ ahụ.
