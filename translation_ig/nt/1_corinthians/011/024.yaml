  to: 'Mgbe o nyechara ekele, ọ nyawara ya wee sị, “Nke a bụ ahụ m, nke bụ maka unu[a][b]. Nọgidenụ na-eme nke a iji na-echeta m.”


    [a] A pụkwara ịsụgharị ya “maka ọdịmma unu” ma ọ bụ “n’ihi unu.”


    [b] Ụfọdụ ihe odide oge ochie gbakwụnyere okwu “nke e nyawara” mgbe okwu “maka unu” gasịrị: “Nke a bụ ahụ m, nke e nyawara maka unu.”'
  rationale: E meziiri naanị ndetu abụọ. Ndeta [a] ugbu a na-enye ụzọ ndị Igbo na-egosipụta uru a na-enweta ma ọ bụ ihe e mere n’ihi ndị a na-agwa okwu, dabara na ὑπὲρ ὑμῶν. Ndeta [b] ugbu a na-ekwu variant ahụ n’ụzọ Igbo doro anya. E debere ihe amaokwu ahụ pụtara, akara ndetu [a] na [b] n’ebe τὸ ὑπὲρ ὑμῶν dị, na enweghị nkọwa ozizi agbakwunyere.
