id: 1CO.11.2
reference: 1 Corinthians 11:2
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἐπαινῶ δὲ ⸀ὑμᾶς ὅτι πάντα μου μέμνησθε καὶ καθὼς παρέδωκα ὑμῖν τὰς παραδόσεις κατέχετε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/002.yaml
  text: I praise you because you remember me in everything and hold firmly to the traditions just as I delivered them to you[a].
translation:
  language: ig
  text: Ana m eto unu n’ihi na unu na-echeta m n’ihe niile, na-ejidesikwa ọdịnala ndị ahụ ike dị nnọọ ka m nyefere ha n’aka unu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “nkuzi ndị ahụ” ma ọ bụ “ntụziaka ndị ahụ.” N’asụsụ Grik, ọ bụ “ọdịnala ndị ahụ,” ya bụ, ihe ndị e nyefere n’aka ndị ọzọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐπαινῶ
  choice: Ana m eto
  rationale: Nke a na-enye kpọmkwem echiche nke ito ma ọ bụ ikwu okwu ọma banyere mmadụ, ma dabara n’olu ọma Pọl ji malite akụkụ a.
- source_word: δὲ
  choice: E gosipụtaghị ya dị ka okwu pụrụ iche
  rationale: N’ebe a δέ bụ njikọ dị nro nke na-akpali okwu gaa n’ihu, ọ bụghị ‘ma’ nke na-egosi nnukwu mmegide. Igbo na-aga nke ọma n’enweghị itinye ‘ugbu a,’ nke nwere ike iweta echiche oge na-adịghị na isi okwu Grik.
- source_word: ὑμᾶς
  choice: unu
  rationale: Ọ bụ nnọchiaha onye nke abụọ n’ọnụọgụ ọtụtụ; ‘unu’ na-egosipụta nke ahụ kpọmkwem n’Igbo.
- source_word: ὅτι
  choice: n’ihi na
  rationale: Ọ na-ewebata ihe kpatara Pọl ji eto ha.
- source_word: πάντα
  choice: n’ihe niile
  rationale: Ọ na-echekwa obosara okwu Grik ma na-adabara njikọ ya na ‘unu na-echeta m.’
- source_word: μου μέμνησθε
  choice: unu na-echeta m
  rationale: Ọ bụ okwu Igbo doro anya nke na-egosi na ha ka na-eburu Pọl n’obi.
- source_word: καθὼς
  choice: dị nnọọ ka
  rationale: Ọ na-eme ka nkwekọrịta dị n’etiti otú Pọl si nyefee ha ihe ndị ahụ na otú ha si jide ha pụta ìhè.
- source_word: παρέδωκα
  choice: m nyefere ha n’aka unu
  rationale: ‘Nyefere ... n’aka’ na-egosi omume nke inyefe ma ọ bụ ibufe ihe e nyere mmadụ ka o debe, na-enweghị ịkọwa ya nanị dị ka nkuzi.
- source_word: τὰς παραδόσεις
  choice: ọdịnala ndị ahụ
  rationale: '‘Ọdịnala’ na-echekwa echiche bụ isi nke παράδοσις: ihe e nyefere ma ọ bụ e bufere n’aka ndị ọzọ. Ihe ngosi ‘ndị ahụ’ na-ezo aka n’ihe Pọl nyefere ha kpọmkwem, ọ bụghị ọdịnala niile n’ozuzu.'
- source_word: κατέχετε
  choice: na-ejidesikwa ... ike
  rationale: Ọ na-egosi ịnọgide na-ejide ma na-agbaso ihe ahụ nke ọma, ọ bụghị naanị ịnwe ya.
theological_decisions:
- issue: Nsụgharị παράδοσις n’ihe gbasara ihe ndịozi nyefere ọgbakọ
  choice: ọdịnala
  alternative: nkuzi; ntụziaka; ihe ndị e nyefere
  rationale: ‘Ọdịnala’ na-echekwa ụdị okwu Grik na echiche nke ihe e nyefere ọgbakọ. Ọ naghị eme ka okwu ahụ bụrụ naanị nkuzi, ma ọ naghịkwa etinye nkwenkwe otu ụka ọ bụla banyere ọdịnala ndị e mesịrị.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. ‘Unu’ na-echekwa ọnụọgụ ọtụtụ nke Grik. A hapụrụ δέ n’enweghị otu okwu Igbo pụrụ iche ka a ghara ime ka njikọ dị nro ghọọ nnukwu mmegide ma ọ bụ okwu oge.
