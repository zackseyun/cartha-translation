review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the contextual sense of ὧδε λοιπὸν, the requirement expressed by ζητεῖται, and the entrusted-management sense of οἰκονόμοις. However, “onye ọ bụla” can make the indefinite τις sound distributively universal, whereas the Greek retains a generic indefinite singular (“one/someone”).
  naturalness: The sentence is generally clear and in an appropriate modern Standard Igbo register. Recasting the final clause as a direct finding (“ka e chọpụta onye…”) is more idiomatic and more closely follows εὑρεθῇ than “ka a hụ na…”.
  terminology: “Ndị na-elekọta ihe e nyefere ha” suitably conveys stewards/managers entrusted with another’s goods. “Onye kwesịrị ntụkwasị obi” is a natural and accurate rendering of πιστός here.
  issues:
  - severity: low
    issue: The rendering “onye ọ bụla” over-specifies τις.
    rationale: τις is an indefinite singular used generically. Although the context concerns what is expected of stewards generally, “onye ọ bụla” explicitly means “every person” and is less close to the source’s retained indefinite form.
  - severity: low
    issue: “ka a hụ na” slightly shifts the finding/evaluation construction.
    rationale: εὑρεθῇ means “be found” or “be discovered.” “Ka e chọpụta onye…” expresses this naturally in Igbo without adding an ‘ensure that’ nuance.
  revised_text: N'okwu a kwa, ihe a na-achọ n'aka ndị na-elekọta ihe e nyefere ha bụ ka e chọpụta onye bụ onye kwesịrị ntụkwasị obi.[a]
  revised_footnotes:
