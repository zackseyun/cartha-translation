  to: N'okwu a kwa, ihe a na-achọ n'aka ndị na-elekọta ihe e nyefere ha bụ ka e chọpụta onye bụ onye kwesịrị ntụkwasị obi.[a]
  rationale: The revision preserves the draft’s clear contextual rendering of “stewards” while retaining the Greek indefinite singular and rendering the passive “be found” with natural Igbo evaluative wording. The footnote is retained, with wording aligned to the revised main text.
