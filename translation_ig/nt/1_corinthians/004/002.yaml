source:
  edition: SBLGNT
  text: ⸀ὧδε λοιπὸν ζητεῖται ἐν τοῖς οἰκονόμοις ἵνα πιστός τις εὑρεθῇ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/002.yaml
  text: In this case[a], moreover[c][b], it is required of stewards that one be found faithful.
translation:
  language: ig
  text: N'okwu a kwa, ihe a na-achọ n'aka ndị na-elekọta ihe e nyefere ha bụ ka e chọpụta onye bụ onye kwesịrị ntụkwasị obi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'N''ụzọ nkịtị: “a na-achọ n''etiti ndị na-elekọta ihe e nyefere ha ka a chọpụta onye kwesịrị ntụkwasị obi.” A pụkwara ịsụ mmalite ya, “N''ebe a kwa” ma ọ bụ “N''okwu a, ya mere.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὧδε
  choice: N'okwu a
  rationale: Ọ na-ezo aka n'okwu Pọl na-ekwu ugbu a banyere ndị ozi dịka ndị e nyefere ihe Chineke n'aka, ọ bụghị nanị ebe nkịtị.
- source_word: λοιπὸν
  choice: kwa
  rationale: “Kwa” na-eme ka arụmụka ahụ gaa n'ihu n'Igbo dị mfe, n'enweghị ịkụnye njikọ abụọ na-ada arọ.
- source_word: ζητεῖται
  choice: ihe a na-achọ n'aka
  rationale: 'Nke a na-echekwa ihe oyiyi nke ‘ịchọ’ dị na ζητέω ma na-ekwupụta nghọta idiom ahụ: ihe a tụrụ anya ya ma ọ bụ chọrọ n''aka ha.'
- source_word: ἐν τοῖς οἰκονόμοις
  choice: n'aka ndị na-elekọta ihe e nyefere ha
  rationale: Ọ na-egosi ìgwè ndị ihe a chọrọ metụtara ma na-eme ka ọrụ οἰκονόμος doo onye Igbo nke oge a anya.
- source_word: οἰκονόμοις
  choice: ndị na-elekọta ihe e nyefere ha
  rationale: Nhọrọ a na-echekwa echiche nke onye na-elekọta ihe onye ọzọ tinyere n'aka ya, kama iji okwu ụka siri ike ma ọ bụ okwu nwere ike ịpụta naanị onyeisi ụlọ.
- source_word: ἵνα
  choice: bụ ka
  rationale: Ọ na-ewebata ọdịnaya nke ihe a na-achọ n'ụzọ Igbo nkịtị.
- source_word: πιστός
  choice: kwesịrị ntụkwasị obi
  rationale: N'ọnọdụ a, ọ pụtara onye a pụrụ ịtụkwasị obi nke na-emezu ọrụ e nyere ya.
- source_word: τις
  choice: onye ọ bụla
  rationale: Ọ na-egosipụta onye n'otu n'otu n'ụzọ zuru mmadụ ọnụ, n'enweghị ime ka okwu ahụ bụrụ naanị maka nwoke.
- source_word: εὑρεθῇ
  choice: a hụ na
  rationale: Ọ na-echekwa echiche nke ịbụ onye a chọpụtara ma ọ bụ gosipụta na nyocha na ọ bụ ụdị onye ahụ.
theological_decisions:
- issue: Otu onye nnọchiteanya na izere ịkpọ naanị nwoke
  choice: onye ọ bụla
  alternative: otu onye; nwoke
  rationale: τις bụ onye a na-akọwaghị kpọmkwem; ụdị nwoke nke πιστός n'asụsụ Grik adịghị egosi na okwu a bụ naanị maka ụmụ nwoke. “Onye ọ bụla” na-eme ka njirimara zuru mmadụ ọnụ doo anya, ma ka na-elekwasị anya n'ọrụ onye n'otu n'otu.
translation_notes:
  register: Standard Igbo dị ugbu a, nke nwere nsọpụrụ ma dị mfe nghọta. E ji nkọwa ọrụ dochie otu aha ọrụ nwere ike ghara ido ọtụtụ ndị anya, ma e chekwara ihe oyiyi nke ihe e nyefere mmadụ ka o lekọta.
