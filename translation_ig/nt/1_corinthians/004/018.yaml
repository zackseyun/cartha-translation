  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὡς μὴ ἐρχομένου δέ μου πρὸς ὑμᾶς ἐφυσιώθησάν τινες·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/018.yaml
  text: Some have become puffed up[b][a], as though I were not coming to you.
translation:
  language: ig
  text: Ụfọdụ afụliwo elu[a][b], dị ka a ga-asị na m gaghị abịakwute unu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Ụfọdụ adịla mpako, dị ka a ga-asị na m gaghị abịakwute unu.”
    reason: lexical_alternative
  - marker: b
    text: Pọl ji ihe atụ “ịfụli elu” ugboro ugboro n’akwụkwọ mbụ ọ degaara ndị Kọrịnt kọwaa mpako nke na-eme ka mmadụ were onwe ya ka onye dị mkpa; tulee 1 Ndị Kọrịnt 4:6, 4:19; 5:2; 8:1; 13:4.
    reason: cross_reference
lexical_decisions:
- source_word: ὡς
  choice: dị ka a ga-asị
  rationale: Nke a na-egosi echiche ha chere n’agbanyeghị na ọ bụghị eziokwu, ma na-edobe ike ntụnyere na nchepụta dị na okwu Grik.
- source_word: μὴ ἐρχομένου ... μου πρὸς ὑμᾶς
  choice: na agaghị m abịakwute unu
  rationale: Nkebiokwu participle nke genitive a dabere na ὡς ma na-egosi ọnọdụ ha chere, ọ bụghị nkwupụta Pọl na ọ gaghị abịa.
- source_word: δέ
  choice: —
  rationale: δέ bụ njikọ dị nro n’ebe a; usoro ahịrịokwu ahụ na-egosi ọrụ ya nke ọma n’enweghị okwu Igbo pụrụ iche.
- source_word: ἐφυσιώθησάν
  choice: afụliela onwe ha
  rationale: Nke a na-edobe ihe atụ Pọl ji ugboro ugboro n’akwụkwọ 1 Ndị Kọrịnt banyere mpako nke na-eme ka mmadụ dị ka ihe e fụrụ ikuku.
- source_word: τινες
  choice: Ụfọdụ n’ime unu
  rationale: Ọ na-ezo aka n’ụfọdụ mmadụ n’ime ndị a na-agwa okwu, ọ bụghị ọgbakọ ahụ dum.
theological_decisions:
- issue: Otú e si sụgharịta nkatọ Pọl banyere mpako ndị Kọrịnt
  choice: Jiri ihe atụ “afụliela onwe ha.”
  alternative: Ụfọdụ n’ime unu adịla mpako.
  rationale: Ihe atụ a na-egosipụta okwu Grik φυσιόω ma na-echekwa njikọ ya na otu Pọl si eji okwu ahụ ugboro ugboro n’akwụkwọ ozi a, kama ịkọwa ya naanị dịka mpako.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị mfe nghọta ma dịkwa nsọpụrụ. A họọrọ “dị ka a ga-asị” iji mee ka echiche e chere ma na-abụghị eziokwu pụta ìhè; e debere ihe atụ nke ịfụli elu n’isiokwu ahụ.
