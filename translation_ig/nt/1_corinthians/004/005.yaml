revisions:
- from: N’ihi ya, unu ekpela ihe ọ bụla ikpe tupu oge eruo[a], ruo mgbe Onyenwe anyị ga-abịa. Ọ ga-emekwa ka ihe ndị zoro ezo n’ọchịchịrị pụta ìhè, kpugheekwa ebumnobi dị n’obi ndị mmadụ[b][c]. Mgbe ahụ, onye ọ bụla ga-enweta otuto ya n’aka Chineke.
  to: N’ihi ya, unu ekpela ihe ọ bụla ikpe tupu oge eruo[a], ruo mgbe Onyenwe anyị ga-abịa. Ọ ga-emekwa ka ihe ndị zoro ezo n’ọchịchịrị pụta ìhè, kpugheekwa ebumnobi dị n’obi ndị mmadụ[b][c]. Mgbe ahụ, Chineke ga-enye onye ọ bụla otuto.
  rationale: 'The revision makes two limited fidelity corrections: it renders the final statement as praise given by God to each person, without an unexpressed possessive, and removes the unexpressed universal “all” from footnote c. The rest of the draft is retained because it is source-faithful, natural Standard Igbo, and preserves the verse’s temporal and eschatological framing without overinterpreting it.'
