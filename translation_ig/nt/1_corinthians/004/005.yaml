id: 1CO.4.5
reference: 1 Corinthians 4:5
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὥστε μὴ πρὸ καιροῦ τι κρίνετε, ἕως ἂν ἔλθῃ ὁ κύριος, ὃς καὶ φωτίσει τὰ κρυπτὰ τοῦ σκότους καὶ φανερώσει τὰς βουλὰς τῶν καρδιῶν, καὶ τότε ὁ ἔπαινος γενήσεται ἑκάστῳ ἀπὸ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/005.yaml
  text: Therefore[a], do not judge anything before the time, until the Lord comes, who will also bring to light the hidden things of darkness and reveal the purposes of the hearts[c][b]. Then each one’s praise will come from God.
translation:
  language: ig
  text: N’ihi ya, unu ekpela ihe ọ bụla ikpe tupu oge eruo[a], ruo mgbe Onyenwe anyị ga-abịa. Ọ ga-emekwa ka ihe ndị zoro ezo n’ọchịchịrị pụta ìhè, kpugheekwa ebumnobi dị n’obi ndị mmadụ[b][c]. Mgbe ahụ, Chineke ga-enye onye ọ bụla otuto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “tupu oge kwesịrị ekwesị eruo” ma ọ bụ “mgbe oge ya na-erubeghị.” Okwu Grik ahụ nwere ike ịpụta ime ihe tupu oge kwesịrị ya.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, “ihe ndị mmadụ bu n’obi” ma ọ bụ “ihe kpatara ha ji eme ihe.”
    reason: lexical_alternative
  - marker: c
    text: Ya bụ, mgbe Onyenwe anyị ga-abịa mee ntule ikpeazụ ma kpughee ihe zoro ezo.
    reason: cross_reference
lexical_decisions:
- source_word: ὥστε
  choice: N’ihi ya
  rationale: Na-egosi nkwubi okwu sitere n’ihe Pọl kwuru tupu nke a, ma bụrụkwa okwu Igbo a na-aghọta nke ọma.
- source_word: μὴ πρὸ καιροῦ τι κρίνετε
  choice: unu ekpela ihe ọ bụla ikpe tupu oge eruo
  rationale: Na-echekwa obosara nke τι (‘ihe ọ bụla’) na echiche πρὸ καιροῦ nke ikpe ikpe tupu oge kwesịrị ya, n’enweghị itinye okwu ‘a kara aka’ nke na-adịghị n’amaokwu Grik kpọmkwem.
- source_word: ἕως ἂν ἔλθῃ ὁ κύριος
  choice: ruo mgbe Onyenwe anyị ga-abịa
  rationale: Na-egosi ókè oge mmachibido ahụ ruru; ‘Onyenwe anyị’ na-echekwa κύριος dị ka utu aha.
- source_word: φωτίσει τὰ κρυπτὰ τοῦ σκότους
  choice: ga-emekwa ka ihe ndị zoro ezo n’ọchịchịrị pụta ìhè
  rationale: ‘Pụta ìhè’ na-enye echiche ihe e kpughere kama ìhè nkịtị; ‘zoro ezo n’ọchịchịrị’ bụ Igbo sitere n’okike ma na-echekwa ihe oyiyi nke okwu Grik.
- source_word: φανερώσει τὰς βουλὰς τῶν καρδιῶν
  choice: kpugheekwa ebumnobi dị n’obi ndị mmadụ
  rationale: ‘Ebumnobi’ nwere ike ịgụnye nzube na ihe mmadụ bu n’obi; ‘obi ndị mmadụ’ na-egosipụta obi dị ka ebe echiche na ọchịchọ ime mmadụ dị.
- source_word: ὁ ἔπαινος γενήσεται ἑκάστῳ ἀπὸ τοῦ θεοῦ
  choice: onye ọ bụla ga-enweta otuto ya n’aka Chineke
  rationale: Ọ bụ Igbo doro anya nke na-echekwa nkesa ἑκάστῳ (‘onye ọ bụla’) na Chineke dị ka ebe otuto ahụ si bịa.
theological_decisions:
- issue: Oke na oge ikpe mmadụ na-ekpe
  choice: 'E debere mmachibido ahụ n’ime oge: mmadụ ekpela ikpe tupu Onyenwe anyị abịa ma kpughee ihe zoro ezo.'
  alternative: Iwere ya dị ka mmachibido ikpe ma ọ bụ nghọta ụdị ọ bụla n’oge niile.
  rationale: Nkebi ‘ruo mgbe Onyenwe anyị ga-abịa’ na-ejikọta okwu ahụ na mkpughe na ntule ikpeazụ, ebe nsụgharị ahụ ka na-echekwa okwu mmachibido ahụ sara mbara.
- issue: Onye ‘Onyenwe anyị’ bụ
  choice: A sụgharịrị κύριος dị ka ‘Onyenwe anyị,’ na-ahapụghị utu aha ahụ ma ọ bụ gbakwunye aha Jizọs n’amaokwu.
  alternative: Ịkọwa ya n’ime amaokwu dịka ‘Jizọs Kraịst’ ma ọ bụ iwere ya naanị dị ka aha Chineke n’ozuzu.
  rationale: N’ọnọdụ akwụkwọ Pọl na ọbịbịa ikpeazụ a na-ekwu maka ya, okwu ahụ na-ezo aka n’Onyenwe anyị Jizọs; ma ide naanị utu aha ahụ na-echekwa ụdị na ike okwu Grik.
- issue: Otuto onye ọ bụla ga-enweta
  choice: E kwuru na onye ọ bụla ga-enweta ‘otuto ya’ n’aka Chineke, n’enweghị ịkọwa ogo ma ọ bụ ọdịdị otuto ahụ.
  alternative: Ịsụgharị ya dịka ụgwọ ọrụ ma ọ bụ nkwupụta na Chineke ga-eto omume onye ọ bụla niile.
  rationale: ἔπαινος pụtara otuto ma ọ bụ nkwado, ọ bụghị kpọmkwem ‘ụgwọ ọrụ’; nsụgharị ahụ anaghị etinye nkọwa karịrị ihe amaokwu kwuru.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E ji ‘unu’ mee ka iwu ahụ nye ọtụtụ mmadụ pụta ìhè; e zere okwu ụka nke otu òtù pụrụ iche na nkọwa na-emechi nghọta okwu Grik nwere ike ibu.
