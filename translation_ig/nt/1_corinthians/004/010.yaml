id: 1CO.4.10
reference: 1 Corinthians 4:10
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἡμεῖς μωροὶ διὰ Χριστόν, ὑμεῖς δὲ φρόνιμοι ἐν Χριστῷ· ἡμεῖς ἀσθενεῖς, ὑμεῖς δὲ ἰσχυροί· ὑμεῖς ἔνδοξοι, ἡμεῖς δὲ ἄτιμοι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/010.yaml
  text: We are fools for Messiah[a], but you are wise in Messiah; we are weak, but you are strong; you are honored[c][b], but we are dishonored.
translation:
  language: ig
  text: anyị bụ ndị nzuzu n’ihi Mezaịa[a], ma unu bụ ndị maara ihe n’ime Mezaịa[b]; anyị adịghị ike, ma unu siri ike; a na-akwanyere unu ùgwù[c], ma a naghị akwanyere anyị ùgwù.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịtụgharị ya, “n’ihi ọdịmma Mezaịa.” Okwu Grik διὰ Χριστόν nwere ike igosi ihe kpatara ihe ma ọ bụ ihe e ji eme ya.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịtụgharị ya, “n’ime Kraịst.” Nke a bụ ahịrịokwu Pọl na-ejikarị eme ihe, ἐν Χριστῷ.
    reason: lexical_alternative
  - marker: c
    text: “A na-akwanyere ùgwù” na “a naghị akwanyere ùgwù” n’ebe a na-ekwu maka nsọpụrụ ma ọ bụ ihere mmadụ n’ihu ọha, ya bụ, n’anya ndị ọzọ; ọ bụghị naanị mmetụta dị n’obi.
    reason: cultural_note
lexical_decisions:
- source_word: μωροὶ
  choice: ndị nzuzu
  rationale: Ọ na-edobe okwu Pọl siri ike na ihe ọ na-ekwu n’ụzọ ịkwa emo, ma mee ka ọdịiche ya na “ndị maara ihe” pụta ìhè.
- source_word: διὰ Χριστόν
  choice: n’ihi Mezaịa
  rationale: “N’ihi” na-egosi ihe kpatara ọnọdụ ndị ozi ahụ ma nwee ike iburu echiche nke ịta ahụhụ n’ihi Mezaịa; e tinyere nkọwa ala peeji iji chekwaa ohere nke “n’ihi ọdịmma Mezaịa.”
- source_word: φρόνιμοι
  choice: ndị maara ihe
  rationale: Nke a bụ ụzọ Igbo doro anya ma kwekọọ na “ndị nzuzu” n’ọdịiche Pọl ji akpa emo.
- source_word: ἐν Χριστῷ
  choice: n’ime Mezaịa
  rationale: Ọ na-edobe ahịrịokwu Pọl a na-ahụkarị, ἐν Χριστῷ, n’enweghị ịkọwa ya n’otu ụzọ naanị.
- source_word: ἀσθενεῖς / ἰσχυροί
  choice: adịghị ike / siri ike
  rationale: Okwu ndị a bụ ibe ha n’ụzọ kwụ ọtọ ma na-echekwa usoro ọdịiche dị n’amaokwu ahụ.
- source_word: ἔνδοξοι / ἄτιμοι
  choice: a na-akwanyere unu ùgwù / a naghị akwanyere anyị ùgwù
  rationale: Nsụgharị a na-egosi nsọpụrụ ma ọ bụ enweghị nsọpụrụ n’ihu ọha, ma na-ada ka Igbo nkịtị karịa ịmanye ụdị nkọwaaha Grik.
- source_word: ἡμεῖς / ὑμεῖς
  choice: anyị / unu
  rationale: A hapụrụ nnọchiaha ndị a ka ha pụta ìhè n’ihi na ha bụ isi ihe dị n’ọdịiche siri ike Pọl na-eme.
theological_decisions:
- issue: Nsụgharị Χριστός
  choice: Mezaịa
  alternative: Kraịst
  rationale: “Mezaịa” na-eme ka ọrụ Χριστός dị ka aha ọkwa Onye E Tere Mmanụ pụta ìhè; “Kraịst” bụkwa okwu a maara nke ọma n’Igbo, ma o nwere ike ịdị ka aha mmadụ naanị.
- issue: Ihe ἐν Χριστῷ pụtara
  choice: n’ime Mezaịa
  alternative: n’ihe gbasara Mezaịa
  rationale: A hapụrụ okwu njikọ ahụ n’ụdị sara mbara ka a ghara idozi n’amaghị ama ihe Pọl pụtara banyere ịdị n’ime Mezaịa.
translation_notes:
  register: 'E ji Standard Igbo nke ugbu a, nke dị ùgwù ma dị mfe nghọta. E chekwara usoro ọdịiche atọ Pọl ji akpa emo: nzuzu/ịma ihe, adịghị ike/ịdị ike, na nsọpụrụ/enweghị nsọpụrụ.'
