source:
  edition: SBLGNT
  text: ἐμοὶ δὲ εἰς ἐλάχιστόν ἐστιν, ἵνα ὑφ’ ὑμῶν ἀνακριθῶ ἢ ὑπὸ ἀνθρωπίνης ἡμέρας· ἀλλ’ οὐδὲ ἐμαυτὸν ἀνακρίνω·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/003.yaml
  text: But to me it is a very small thing that I should be examined by you or by any human court; in fact[a], I do not even examine myself.
translation:
  language: ig
  text: Ma n’ebe m nọ, ọ bụ ihe dị nnọọ ntakịrị ka unu nyochaa m, ma ọ bụ ka ụlọikpe mmadụ nyochaa m; ma ọbụna mụ onwe m anaghị enyocha onwe m.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’asụsụ Grik, okwu ya kpọmkwem bụ “ụbọchị mmadụ,” bụ́ akpaalaokwu na-ezo aka n’ikpe ma ọ bụ ntụle mmadụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμοὶ δὲ
  choice: Ma n’ebe m nọ
  rationale: Na-egosi echiche Pọl banyere onwe ya ma na-edobe njikọ mmegide nke δέ n’ụzọ Igbo sitere n’okike.
- source_word: εἰς ἐλάχιστόν ἐστιν
  choice: ọ bụ ihe dị nnọọ ntakịrị
  rationale: Na-egosi na ihe a adịghị Pọl mkpa nke ukwuu, ma na-edobe ike nke ἐλάχιστον.
- source_word: ἵνα ὑφ’ ὑμῶν ἀνακριθῶ
  choice: na unu ga-enyocha m
  rationale: ἵνα ebe a na-eweta ọdịnaya nke ihe a na-ewere dị ntakịrị; ‘ga-enyocha’ na-egosi nyocha ma ọ bụ ntụle, ọ bụghị ikpe ikpeazụ.
- source_word: ἢ ὑπὸ ἀνθρωπίνης ἡμέρας
  choice: ma ọ bụ na ụlọikpe mmadụ ọ bụla ga-enyocha m
  rationale: A sụgharịrị akpaalaokwu ‘ụbọchị mmadụ’ n’ụzọ na-egosi nyocha ma ọ bụ ikpe nke mmadụ; ‘ụlọikpe mmadụ’ bụ okwu doro ndị na-agụ Igbo anya.
- source_word: ἀλλ’ οὐδὲ
  choice: n’ezie, ọbụna ... adịghị
  rationale: Na-egosi nzọụkwụ siri ike n’okwu Pọl ma na-edobe echiche ‘ọbụna ... adịghị.’
- source_word: ἐμαυτὸν ἀνακρίνω
  choice: mụ onwe m adịghị enyocha onwe m
  rationale: Na-edobe okwu ntụgharị onwe na njikọ okwu ya na ἀνακριθῶ nke mbụ.
theological_decisions:
- issue: Ihe ἀνθρωπίνης ἡμέρας pụtara
  choice: ụlọikpe mmadụ ọ bụla
  alternative: ụbọchị mmadụ; ikpe ma ọ bụ ntụle mmadụ
  rationale: Akpaalaokwu ahụ na-egosi nyocha ma ọ bụ ikpe nke mmadụ, n’adịghị ka ụbọchị ikpe nke Onyenwe anyị n’okwu gbara ya gburugburu. Nsụgharị a anaghị eme ka ọ bụrụ okwu nkịtị banyere ụbọchị kalenda.
- issue: Ike ἀνακρίνω
  choice: enyocha
  alternative: kpee ikpe; nyochaa nke ọma
  rationale: ‘Enyocha’ na-edobe echiche nyocha ma ọ bụ ntụle n’ebughị ụzọ mee ka okwu ahụ bụrụ ikpe ikpeazụ, ma na-edobekwa otu okwu ahụ n’ebe abụọ n’amaokwu ahụ.
translation_notes:
  register: Ejiri Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. E debere nkwughachi nke ‘enyocha’ iji gosipụta otu mgbọrọgwụ okwu Grik e ji mee ihe ugboro abụọ; e tinyere nkọwa akpaalaokwu ahụ n’ala ala peeji.
