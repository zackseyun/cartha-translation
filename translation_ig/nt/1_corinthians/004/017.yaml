revisions:
- from: N’ihi nke a ka m ji zitere unu Timoti, onye bụ nwa m[a] m hụrụ n’anya, bụrụkwa onye kwesịrị ntụkwasị obi n’ime Onyenwe anyị. Ọ ga-echetara unu ụzọ m n’ime Mesaya Jizọs,[b] dị nnọọ ka m na-akụzi n’ebe niile, n’ọgbakọ ọ bụla.
  to: N’ihi nke a ka m ji zitere unu Timoti, onye bụ nwa m m hụrụ n’anya na onye kwesịrị ntụkwasị obi n’Onyenwe anyị. Ọ ga-echetara unu ụzọ m dị n’ime Mesaya Jizọs,[b] dịka m na-akụzi n’ọgbakọ ọ bụla n’ebe niile.
  rationale: The revised text improves idiomatic Standard Igbo and makes the Greek syntactic relationship of ‘my ways ... in Messiah Jesus’ clear. Footnote a is rewritten for clarity, and footnote b is retained with minor normalization. Footnote a is not anchored in the verse text because the main rendering ‘nwa m’ already carries the lexical sense; it remains supplied as the requested lexical alternative.
