id: 1CO.4.17
reference: 1 Corinthians 4:17
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: διὰ τοῦτο ἔπεμψα ὑμῖν Τιμόθεον, ὅς ἐστίν ⸂μου τέκνον⸃ ἀγαπητὸν καὶ πιστὸν ἐν κυρίῳ, ὃς ὑμᾶς ἀναμνήσει τὰς ὁδούς μου τὰς ἐν Χριστῷ ⸀Ἰησοῦ, καθὼς πανταχοῦ ἐν πάσῃ ἐκκλησίᾳ διδάσκω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/017.yaml
  text: For this reason I sent Timothy to you[a], who is my beloved and faithful child in the Lord. He will remind you of my ways in Messiah Jesus[b], just as I teach everywhere in every church.
translation:
  language: ig
  text: N’ihi nke a ka m ji zitere unu Timoti, onye bụ nwa m m hụrụ n’anya na onye kwesịrị ntụkwasị obi n’Onyenwe anyị. Ọ ga-echetara unu ụzọ m dị n’ime Mesaya Jizọs,[b] dịka m na-akụzi n’ọgbakọ ọ bụla n’ebe niile.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: A pụkwara ịsụgharị ya ‘n’ime Kraịst Jizọs.’ Okwu Grik Χριστός bụ utu aha pụtara ‘Mesaya,’ ya bụ, Onye e Tere Mmanụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: N’ihi nke a
  rationale: Ọ na-egosi ihe kpatara ihe Pọl mere ma na-ezo aka n’ihe o kwuru tupu amaokwu a.
- source_word: ἔπεμψα
  choice: ka m ji zitere unu
  rationale: Oge aorist dị n’asụsụ Grik dabara n’omume gara aga; nhazi a bụkwa Igbo nkịtị mgbe e jikọtara ya na ‘N’ihi nke a.’
- source_word: Τιμόθεον
  choice: Timoti
  rationale: Nke a bụ odide aha ahụ a na-ejikarị eme ihe n’Igbo.
- source_word: τέκνον
  choice: nwa
  rationale: ‘Nwa’ na-edobe ihe atụ nke mmekọrịta ezinụlọ ma ọ naghị akọwapụta nwoke dịka okwu Grik υἱός gaara eme.
- source_word: ἀγαπητὸν
  choice: m hụrụ n’anya
  rationale: Ọ na-egosipụta ịhụnanya miri emi Pọl nwere n’ebe Timoti nọ n’ụzọ doro anya ma dịkwa ebube.
- source_word: πιστὸν
  choice: onye kwesịrị ntụkwasị obi
  rationale: Ọ na-egosi na Timoti na-ekwesị ntụkwasị obi ma bụrụ onye a pụrụ ịdabere na ya n’ozi ya.
- source_word: ἐν κυρίῳ
  choice: n’ime Onyenwe anyị
  rationale: Ọ na-edobe okwu Pọl ji akọwa mmekọrịta na ọnọdụ ndụ Timoti n’ime Onyenwe anyị.
- source_word: ἀναμνήσει
  choice: Ọ ga-echetara
  rationale: Ọ na-egosipụta omume Timoti ga-eme n’ọdịnihu dịka ngwaa Grik ahụ si dị.
- source_word: τὰς ὁδούς μου
  choice: ụzọ m
  rationale: Ọ na-edobe ihe atụ nke ‘ụzọ’ nke gụnyere usoro ndụ, omume, na ozi Pọl, n’emeghị ka ihe ọ pụtara dị warara.
- source_word: τὰς ἐν Χριστῷ Ἰησοῦ
  choice: n’ime Mesaya Jizọs
  rationale: Χριστός na-arụ ọrụ dịka utu aha ebe a; ‘Mesaya’ na-eweta ihe utu aha ahụ pụtara kama idegharị naanị ụda ya.
- source_word: καθὼς
  choice: dị nnọọ ka
  rationale: Ọ na-egosi nkwekọrịta dị n’etiti ihe Timoti ga-echetara ha na ihe Pọl na-akụzi mgbe niile.
- source_word: πανταχοῦ ἐν πάσῃ ἐκκλησίᾳ
  choice: n’ebe niile, n’ọgbakọ ọ bụla
  rationale: 'Ọ na-edobe akụkụ abụọ nke okwu Grik: ebe niile na ọgbakọ nke ọ bụla.'
theological_decisions:
- issue: Otu e si sụgharịa Χριστός n’okwu ἐν Χριστῷ Ἰησοῦ
  choice: Mesaya Jizọs
  alternative: Kraịst Jizọs
  rationale: Ebe a, Χριστός ka nwere ike nke utu aha ahụ na-egosi Onye E Tere Mmanụ; ‘Mesaya’ na-edobe ihe ọ pụtara, ebe nkọwa ala peeji na-enye ụdị a na-ahụkarị nke ‘Kraịst.’
- issue: Ihe ‘ụzọ m’ pụtara
  choice: E debere ihe atụ sara mbara nke na-agụnye usoro ndụ, omume, na nkuzi Pọl n’ime Mesaya
  alternative: ụzọ m si ebi ndụ; omume m
  rationale: Ọ bụghị ụzọ njem ka okwu a na-ekwu, ma ịsụgharị ya ‘ụzọ m’ na-edobe obosara na esemokwu okwu ihe atụ ahụ n’enweghị ịmanye naanị otu akụkụ ya.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ugwu ma dị mfe nghọta, dee ya. E debere okwu ihe atụ ‘ụzọ m,’ jiri ‘ọgbakọ’ maka ἐκκλησία, ma zere okwu pụrụ iche nke otu ụka ma ọ bụ ozizi mmadụ.
