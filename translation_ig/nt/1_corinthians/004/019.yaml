  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐλεύσομαι δὲ ταχέως πρὸς ὑμᾶς, ἐὰν ὁ κύριος θελήσῃ, καὶ γνώσομαι οὐ τὸν λόγον τῶν πεφυσιωμένων ἀλλὰ τὴν δύναμιν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/019.yaml
  text: But I will come to you soon[a], if the Lord wills, and I will find out not the speech of those who are puffed up[b], but the power.
translation:
  language: ig
  text: Ma aga m abịakwute unu n’oge na-adịghị anya, ma ọ bụrụ na Onyenwe anyị achọọ, aga m achọpụta, ọ bụghị okwu ndị fụliri onwe ha elu[a], kama ike.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ndị fụliri onwe ha elu” na-asụgharị okwu Pọl ji ọtụtụ ugboro n’akwụkwọ ozi a akọwa ndị mpako, ndị na-ebuli onwe ha elu.
    reason: cross_reference
lexical_decisions:
- source_word: ἐλεύσομαι δὲ ταχέως πρὸς ὑμᾶς
  choice: Ma aga m abịakwute unu n’oge na-adịghị anya
  rationale: “Ma” na-egosi obere ọdịiche dị n’ihe e kwuru tupu ya; “abịakwute unu” na-egosi ngagharị Pọl na-aga n’ebe ndị Kọrịnt nọ, ebe “n’oge na-adịghị anya” na-egosi oge dị nso.
- source_word: ἐὰν ὁ κύριος θελήσῃ
  choice: ma ọ bụrụ na Onyenwe anyị achọọ
  rationale: Nke a na-edobe ọnọdụ ahụ na-adabere n’uche Onyenwe anyị, n’asụsụ Igbo dị mfe ma kwụ ọtọ.
- source_word: γνώσομαι
  choice: aga m amata
  rationale: Ọ bụ ezie na okwu ahụ pụtara “ịma,” n’ebe a ọ bụ ịmata ihe dị adị mgbe Pọl bịara; “aga m amata” na-edobe ma ihe okwu ahụ pụtara kpọmkwem ma nghọta ahụ.
- source_word: οὐ τὸν λόγον
  choice: ọ bụghị okwu
  rationale: “Okwu” nwere ike ịgụnye ihe ha na-ekwu ma ọ bụ ụzọ ha si ekwu ya, si otú ahụ na-edobe obosara λόγος ma ghara imechi ya naanị n’okwu ọnụ efu.
- source_word: τῶν πεφυσιωμένων
  choice: ndị ahụ fụliri onwe ha elu
  rationale: Nhọrọ a na-edobe ihe atụ Pọl ji maka mpako—ịfụli elu—ma na-egosi ọnọdụ mpako ha nọgidere na ya.
- source_word: ἀλλὰ τὴν δύναμιν
  choice: kama ike ha
  rationale: “Ike” na-edobe ọdịiche dị mkpirikpi dị n’etiti λόγος na δύναμις. E tinyere nnọchiaha “ha” ka njikọ okwu ahụ doo anya n’Igbo, n’agbanyeghị na Grik hapụrụ ya ka a ghọta ya site n’ahịrịokwu.
theological_decisions:
- issue: Onye aha “Onyenwe anyị” na-ezo aka na ya
  choice: Onyenwe anyị
  alternative: Onyenwe anyị Jizọs; Chineke
  rationale: Grik kwuru naanị ὁ κύριος. Nsụgharị ahụ anaghị akọwapụta karịa ihe amaokwu ahụ kwuru, ya mere ọ na-edobe ohere nghọta dị na ya.
- issue: Ọdịiche dị n’etiti λόγος na δύναμις
  choice: okwu ... kama ike
  alternative: nkuzi ... kama ike ọrụ ebube; ikwu okwu nka ... kama ikike onyeozi
  rationale: Nhọrọ a na-edobe ọdịiche sara mbara dị n’etiti okwu na ike n’emeghị ka “ike” bụrụ naanị ọrụ ebube ma ọ bụ naanị ikike onyeozi.
translation_notes:
  register: Asụsụ ahụ bụ Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E ji “Onyenwe anyị” mee κύριος n’enweghị ịkọwapụta onye ọ bụ karịa ihe Grik kwuru. E debere ihe atụ nke ịfụli elu maka mpako.
