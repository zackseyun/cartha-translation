  text: Οὐκ ἐντρέπων ὑμᾶς γράφω ταῦτα, ἀλλ’ ὡς τέκνα μου ἀγαπητὰ ⸀νουθετῶν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/014.yaml
  text: I am not writing these things to shame you[b][a], but admonishing you as my beloved children.
translation:
  language: ig
  text: Anaghị m ede ihe ndị a iji mee unu ihere[a], kama ana m adụ unu ọdụ[b] dị ka ụmụ m m hụrụ n’anya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “iji mee ka ihere jide unu.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ana m adọ unu aka ná ntị.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐντρέπων
  choice: iji mee ka ihere mee unu
  rationale: 'Nkebi a na-egosi ebumnuche Pọl na-ajụ: ọ naghị ede ka o mee ka ihere mee ha. Nhọrọ a na-edobe echiche nke ihere na nsọpụrụ nke okwu Grik ahụ.'
- source_word: γράφω ταῦτα
  choice: ana m ede ihe ndị a
  rationale: A sụgharịrị γράφω dị ka omume na-aga n’ihu n’akwụkwọ ozi, ma debe ọtụtụ nke ταῦτα n’okwu ‘ihe ndị a.’
- source_word: ἀλλ’
  choice: kama
  rationale: ‘Kama’ na-egosi ọdịiche doro anya n’etiti ebumnuche ọ jụrụ na ihe ọ na-eme n’ezie.
- source_word: ὡς
  choice: dị ka
  rationale: Ọ na-egosi mmekọrịta Pọl ji na-adụ ha ọdụ n’enweghị ịgbakwụnye nkọwa na-adịghị n’ederede.
- source_word: τέκνα μου ἀγαπητὰ
  choice: ụmụ m m hụrụ n’anya
  rationale: ‘Ụmụ’ gụnyere nwoke na nwaanyị ma na-egosi mmekọrịta nne na nna na ụmụ; ‘m hụrụ n’anya’ na-ebute ịhụnanya dị na ἀγαπητά n’Igbo nkịtị ma dị ùgwù.
- source_word: νουθετῶν
  choice: ana m adụ unu ọdụ
  rationale: Nkebi a na-egosi ndụmọdụ nwere ịdọ aka ná ntị na mgbazi. ‘Ịdụ ọdụ’ bụ okwu Igbo sitere n’okike nke na-ejigide nlekọta na mgbazi n’enweghị ụda ntaramahụhụ gabigara ókè.
theological_decisions:
- issue: Ụda nke mgbazi Pọl dị ka nna ime mmụọ
  choice: ana m adụ unu ọdụ dị ka ụmụ m m hụrụ n’anya
  alternative: ana m adọ unu aka ná ntị dị ka ụmụ m m hụrụ n’anya
  rationale: Nhọrọ bụ isi na-ejikọta mgbazi na ịhụnanya dịka ederede si mee. Nhọrọ ọzọ na-eme ka akụkụ ịdọ aka ná ntị sie ike, ma ọ nwere ike ịdị nkọ karịa νουθετῶν n’ọnọdụ a.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji ‘unu’ mee ka okwu ahụ nye ọtụtụ mmadụ doo anya; e zere okwu ụka pụrụ iche ma debe ngwakọta nke mgbazi na ịhụnanya.
