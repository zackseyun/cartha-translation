id: 1CO.4.8
reference: 1 Corinthians 4:8
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἤδη κεκορεσμένοι ἐστέ, ἤδη ἐπλουτήσατε, χωρὶς ἡμῶν ἐβασιλεύσατε· καὶ ὄφελόν γε ἐβασιλεύσατε, ἵνα καὶ ἡμεῖς ὑμῖν συμβασιλεύσωμεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/008.yaml
  text: Already you have had your fill[a]; already you have become rich; apart from us you have become kings. And I wish indeed that you had become kings[c][b], so that we also might reign with you.
translation:
  language: ig
  text: Ugbua afọ ejuola unu[a]; ugbua unu aghọọla ndị ọgaranya; n’enweghị anyị, unu achịala dịka ndị eze. A sị nnọọ na unu achịala dịka ndị eze[c][b], ka anyị sokwa unu chịa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “unu enweela afọ ojuju.”
    reason: lexical_alternative
  - marker: b
    text: 'Pọl na-ekwu n’ụzọ njakịrị: ndị Kọrịnt na-eme dịka a ga-asị na afọ ejula ha kpamkpam, na ha abụrụla ọgaranya, na ha amalitela ịchị dịka ndị eze.'
    reason: cultural_note
  - marker: c
    text: Ma ọ bụ, “A sị nnọọ na unu achịala,” nke na-edobe usoro ọchịchọ ahụ n’ụzọ dị nso na nke Grik.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤδη
  choice: Ugbu a
  rationale: E tinyere ya ugboro abụọ iji debe nkwusi ike nke Pọl na-eme n’isi ahịrịokwu abụọ ahụ.
- source_word: κεκορεσμένοι ἐστέ
  choice: afọ ejula unu
  rationale: Akpaalaokwu Igbo a na-egosi na mmadụ erijuola afọ ma nwee afọ ojuju; ọ na-edebekwa ụda njakịrị dị n’okwu Pọl.
- source_word: ἐπλουτήσατε
  choice: unu aghọọla ndị ọgaranya
  rationale: Ọ na-egosi mgbanwe gaa n’ọnọdụ ịba ọgaranya, ọ bụghị naanị ịkọwa ọnọdụ ha.
- source_word: χωρὶς ἡμῶν
  choice: unu esorola anyị
  rationale: Ọ na-egosi na ihe ahụ mere n’enweghị ndị ozi ahụ ma na-edebe akụkụ mmekọrịta dị n’ịba mba Pọl.
- source_word: ἐβασιλεύσατε
  choice: unu amalitela ịchị dịka ndị eze
  rationale: Ọ na-edebe ihe oyiyi nke ọchịchị eze n’ahịrịokwu njakịrị ahụ, n’agbanyeghị na mmalite ọchịchị abụghị ihe ngwaa ahụ kwuru hoo haa.
- source_word: ὄφελόν γε
  choice: Ọ dị m nnọọ ka
  rationale: Nke a bụ ụzọ Igbo dị ndụ e si ekwupụta ọchịchọ siri ike, ebe “nnọọ” na-eburu nkwusi ike nke γε.
- source_word: ἐβασιλεύσατε
  choice: unu bụrụla ndị na-achị n’ezie
  rationale: N’ahịrịokwu ọchịchọ ahụ, “n’ezie” na-egosi ọdịiche dị n’etiti ọchịchị ha na-etu ọnụ banyere ya na ọchịchị Pọl chọrọ ka ọ bụrụ eziokwu.
- source_word: ἵνα
  choice: ka
  rationale: Ọ bụ njikọ Igbo nkịtị maka ebumnuche ma ọ bụ ihe ga-esi n’ọchịchọ ahụ pụta.
- source_word: συμβασιλεύσωμεν
  choice: ka anyị onwe anyị sokwa unu chịa
  rationale: “Sokwa unu chịa” na-edebe echiche nke συν-, ya bụ, iso ndị ọzọ chịa.
theological_decisions:
- issue: Ụda nke nkwupụta atọ mbụ
  choice: E depụtara ha dị ka nkwupụta njakịrị na-aba mba, ma e tinyeghị nkọwa ahụ n’ahụ amaokwu.
  alternative: Ịgụ ha dị ka otuto nkịtị na-enweghị njakịrị.
  rationale: Ọnọdụ gbara 1 Ndị Kọrịnt 4:7–13 gburugburu na-egosi na Pọl na-atụnyere mpako ndị Kọrịnt na ahụhụ ndị ozi; ihe odide ahụ na-edebe esemokwu a, ebe nkọwa ala peeji na-eme ka ụda ahụ doo anya.
- issue: Ihe oyiyi nke ịchị dịka eze
  choice: E debere asụsụ ọchịchị eze na nke iso ndị ọzọ chịa.
  alternative: Ịsụgharị ya n’ụzọ sara mbara dịka inwe ike, ọganiihu, ma ọ bụ ịdị elu.
  rationale: βασιλεύω na συμβασιλεύω bụ okwu ọchịchị eze kpọmkwem; iwepụ ihe oyiyi ahụ ga-ebelata ike okwu Pọl na ndumodu banyere ọchịchị zuru oke nke ka ga-abịa.
- issue: Ọchịchọ Pọl ọ bụ naanị njakịrị ka ọ bụ ezi ọchịchọ?
  choice: E debere ma njakịrị ahụ ma ohere na Pọl nwekwara ezigbo ọchịchọ ka ha chịa n’ezie.
  alternative: Ịkọwa ahịrịokwu ahụ dịka naanị njakịrị na-enweghị ezi ọchịchọ ọ bụla.
  rationale: ὄφελόν γε nwere ike ibu ọchịchọ siri ike, ebe ọnọdụ okwu na-enye ya agba njakịrị; nsụgharị ekwesịghị idozi esemokwu abụọ a n’otu akụkụ naanị.
translation_notes:
  register: E jiri Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. E debere nkwughachi “Ugbu a” na ihe oyiyi nke ọchịchị eze. “Afọ ejula unu” bụ akpaalaokwu nkịtị ma nwee ike ibu ma iri juo afọ ma inwe afọ ojuju. A haziri akara ala peeji [c][b] n’ebe ọchịchọ na nkọwa njakịrị metụtara ya.
