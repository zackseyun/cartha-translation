  text: οὐ γὰρ ἐν λόγῳ ἡ βασιλεία τοῦ θεοῦ ἀλλ’ ἐν δυνάμει.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/020.yaml
  text: For the kingdom of God is not in word[a], but in power.
translation:
  language: ig
  text: N’ihi na alaeze Chineke adịghị n’okwu[a], kama ọ dị n’ike.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’ikwu okwu” ma ọ bụ “n’okwu ọnụ efu”; ihe e ji ya tụnyere bụ ike na-arụpụta ihe, ọ bụghị okwu ịchọ mma na-enweghị ihe ọ na-arụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ γὰρ
  choice: N’ihi na ... adịghị
  rationale: γάρ na-enye ihe kpatara okwu bu ya ụzọ; “N’ihi na” bụ njikọ doro anya ma kwekọọ n’Igbo. οὐ na-agọnahụ akụkụ ahịrịokwu ahụ.
- source_word: ἐν λόγῳ
  choice: n’okwu
  rationale: λόγος nwere ike ịpụta okwu, ikwu okwu, ma ọ bụ ozi. “N’okwu” na-edobe mkpụmkpụ na ọdịdị ntụnyere Grik ahụ, ebe nkọwa ala peeji na-egosi na okwu ọnụ efu nwekwara ike ịbụ echiche ya.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: alaeze Chineke
  rationale: “Alaeze Chineke” bụ okwu Igbo a maara nke ọma, ma nwee ike ibu echiche nke ọchịchị Chineke nakwa ebe ọchịchị ya na-arụ ọrụ, n’enweghị imechi ya n’otu nghọta.
- source_word: ἀλλ’ ἐν δυνάμει
  choice: kama ọ dị n’ike
  rationale: δύναμις bụ ike ma ọ bụ ikike na-arụpụta ihe. “N’ike” na-edobe ntụnyere siri ike ya na “n’okwu” ma ghara ịkọwa kpọmkwem ụdị ike ahụ.
theological_decisions:
- issue: Ụdị ọdịiche dị n’etiti “okwu” na “ike”
  choice: E debere ọdịiche ahụ dịka nke dị n’etiti okwu ọnụ na ike na-arụpụta ihe nke alaeze Chineke, ma akọwaghị kpọmkwem ụdị ike ahụ.
  alternative: Ịkọwa ike ahụ naanị dịka ọrụ ebube, ndụ gbanwere, ịdọ aka ná ntị n’ọgbakọ, ikike onyeozi, ma ọ bụ ọrụ Mmụọ Nsọ n’ụzọ pụrụ iche.
  rationale: Grik kwuru naanị “ike” n’ụzọ sara mbara. Ịhapụ ya otu a na-echekwa obosara na esemokwu nkà mmụta okpukpe dị n’amaokwu ahụ kama ịmanye otu nkọwa.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke dị ugbu a, dị nsọ ma dị mfe nghọta. E tinyere “ọ dị” n’akụkụ nke abụọ iji mee ka ahịrịokwu ahụ bụrụ nke eke n’Igbo, n’agbanyeghị na Grik hapụrụ ngwaa ahụ ka a ghọta ya site n’akụkụ mbụ.
