revisions:
- from: Mgbe a na-ekwutọ anyị[a], anyị na-arịọ ha; anyị aghọọla dị ka ihe mkpofu nke ụwa, ihe e si n'ihe niile hichapụ[b], ruo ugbu a.
  to: Mgbe a na-ekwutọ anyị[a], anyị na-arịọ; anyị aghọọla dị ka ihe mkpofu nke ụwa, ihe ruru unyi n'ihe niile[b], ruo ugbu a.
  rationale: The revision corrects the second metaphor so that it conveys social abjection as “vile residue” rather than an item cleaned out of every object. It retains the broad “n'ihe niile” corresponding to πάντων, avoids importing a sacrificial interpretation, and corrects the footnote’s Standard Igbo spelling and contextual explanation. The supplied object of “arịọ” is removed to preserve the Greek’s unstated object.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T18:11:13Z'
review_pass:
  verdict: revise
  source_fidelity: 'The temporal passive “Mgbe a na-ekwutọ anyị” faithfully represents δυσφημούμενοι, and “anyị aghọọla” adequately conveys the aorist-result sense with ἕως ἄρτι. The response verb is reasonably rendered as entreating/appealing, though adding “ha” supplies an object not stated explicitly. More significantly, “ihe e si n''ihe niile hichapụ” reverses the relation expressed by περίψημα πάντων: it can mean something scrubbed from all things, rather than the strongly contemptuous residue/offscouring characterized as belonging to or associated with “all.”'
  naturalness: The draft is generally clear Standard Igbo. “Ihe e si n'ihe niile hichapụ” is cumbersome and semantically misleading in this context. “Ihe ruru unyi n'ihe niile” is a more direct, natural way to retain the image of vile residue while keeping the broad scope of πάντων. The footnote contains the orthographic error “ịkasị obi”; Standard Igbo is “ịkasi obi.”
  terminology: “Ihe mkpofu” suitably conveys περικαθάρματα. “Ihe ruru unyi” gives a forceful, non-doctrinal rendering for περίψημα without asserting a debated expiatory or ritual meaning. The revised note describes possible cleansing imagery without making it the verse’s asserted sense.
  issues:
  - severity: medium
    issue: The second degradation term is translated with the wrong semantic relationship.
    rationale: περίψημα πάντων denotes vile residue/offscouring in relation to “all,” not specifically material that has been scrubbed out of all things. The present wording can obscure Paul’s comprehensive rhetoric.
  - severity: low
    issue: Footnote a has an orthographic error and overextends the lexical gloss.
    rationale: “Ịkasị obi” should be “ịkasi obi.” The note should present the contextual sense as appeal/entreaty without implying that all listed senses are equally apt here.
  - severity: low
    issue: “Ha” is supplied as the object of “anyị na-arịọ ha.”
    rationale: The implied audience is plausible in context, but the Greek leaves the object unstated. Omitting it better preserves the concise source expression.
  revised_text: Mgbe a na-ekwutọ anyị[a], anyị na-arịọ; anyị aghọọla dị ka ihe mkpofu nke ụwa, ihe ruru unyi n'ihe niile[b], ruo ugbu a.
