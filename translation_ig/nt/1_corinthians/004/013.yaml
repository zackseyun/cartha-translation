id: 1CO.4.13
reference: 1 Corinthians 4:13
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸀δυσφημούμενοι παρακαλοῦμεν· ὡς περικαθάρματα τοῦ κόσμου ἐγενήθημεν, πάντων περίψημα ἕως ἄρτι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/013.yaml
  text: When slandered[a], we appeal; we have become like the world's refuse, the scum of all things[b], until now.
translation:
  language: ig
  text: Mgbe a na-ekwutọ anyị[a], anyị na-arịọ; anyị aghọọla dị ka ihe mkpofu nke ụwa, ihe ruru unyi n'ihe niile[b], ruo ugbu a.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “Mgbe a na-emebi aha anyị, anyị na-arịọ.” Okwu Grik a pụrụ ịpụta ịrịọ, ịgba ume, ma ọ bụ ịkasi obi; n'ebe a, o yikarịrị ka ọ na-egosi iji arịrịọ zaa mmegbu kama imegwara.
    reason: lexical_alternative
  - marker: b
    text: Okwu abụọ a sụgharịrị “ihe mkpofu” na “ihe ruru unyi” adịghị apụta ọtụtụ mgbe, ha dịkwa ike nke ukwuu. Ha nwere ike ịkpọtụrụ ihe a na-ewepụ n'ịsacha ma ọ bụ n'ikpochapụ ihe, si otú ahụ gosi oke nlelị e lelịrị ndịozi anya.
    reason: cultural_note
lexical_decisions:
- source_word: δυσφημούμενοι
  choice: Mgbe a na-ekwutọ anyị
  rationale: Na-egosi na a na-ekwu okwu ọjọọ megide ndịozi iji mebie aha ha; nhazi ‘Mgbe...’ na-egosipụta ọrụ participle ahụ n'Igbo eke.
- source_word: παρακαλοῦμεν
  choice: anyị na-arịọ ha
  rationale: N'usoro okwu a, ọ pụtara ịgwa ndị na-emegbu ha okwu arịrịọ kama imegwara; e tinyeghị ‘nwayọọ’ n'ihi na okwu Grik ahụ ekwughị ya kpọmkwem.
- source_word: ὡς
  choice: dị ka
  rationale: Na-egosipụta ntụnyere, ọ bụghị na ihe abụọ ahụ bụ otu ihe kpamkpam.
- source_word: περικαθάρματα
  choice: ihe mkpofu
  rationale: Okwu a na-ezo aka n'ihe a na-ewepụ mgbe a na-asacha ihe, ma n'ebe a ọ na-egosi ihe ndị mmadụ lere anya dị ka ihe na-abaghị uru.
- source_word: τοῦ κόσμου
  choice: nke ụwa
  rationale: Na-echekwa njikọ genitive nke okwu Grik n'Igbo doro anya.
- source_word: ἐγενήθημεν
  choice: anyị aghọọla
  rationale: Na-egosi ọnọdụ sitere n'ihe mere gara aga nke ka dị ruo oge Pọl na-ede akwụkwọ ozi a.
- source_word: πάντων
  choice: n'ihe niile
  rationale: Na-echekwa obosara okwu Grik ahụ, n'emeghị ka ọ bụrụ naanị mmadụ niile.
- source_word: περίψημα
  choice: ihe e si n'ihe niile hichapụ
  rationale: Na-egosipụta ihe ruru unyi ma ọ bụ ihe fọdụrụ nke a na-ehichapụ tụfuo, ma na-edobe onyonyo nke okwu Grik ahụ karịa otu okwu mkparị nkịtị.
- source_word: ἕως ἄρτι
  choice: ruo ugbu a
  rationale: Okwu oge Igbo doro anya nke na-egosi na ọnọdụ ahụ gara n'ihu ruo oge e dere akwụkwọ ozi ahụ.
theological_decisions:
- issue: Otu e si asụgharị okwu abụọ nke mweda n'ala, περικαθάρματα na περίψημα
  choice: ihe mkpofu nke ụwa / ihe e si n'ihe niile hichapụ
  alternative: ihe ruru unyi / nsị nke ihe niile; ma ọ bụ ịkọwa ha dị ka ndị e ji chụọ àjà iji sachapụ ndị ọzọ
  rationale: Isi okwu n'ahịrịokwu a bụ na ụwa lelịrị ndịozi anya dị ka ihe na-abaghị uru. Okwu ndị ahụ nwere ike ịmetụta ihe a na-ewepụ mgbe a na-asacha, ma isiokwu a anaghị eme ka echiche nke àjà mgbaghara mmehie doo anya; ya mere, etinyeghị nkọwa ahụ n'ahịrịokwu bụ isi.
translation_notes:
  register: Standard Igbo nke oge a, n'ụdị dị ùgwù ma dị mfe nghọta. E ji ‘ihe mkpofu’ mee ka mweda n'ala doo anya, ebe ‘ihe e si n'ihe niile hichapụ’ na-echekwa onyonyo siri ike nke okwu Grik nke abụọ. E debere mgbagwoju anya gbasara ihe ndị a na-ewepụ n'ịsacha na nkọwa ala peeji kama ịtụgharị ya ka ọ bụrụ ozizi àjà.
