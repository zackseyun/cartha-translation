revisions:
- from: 'Ihe ndị a, ụmụnna m[a], ejirila mụ onwe m na Apọlọs kọwaa n’ụzọ ihe atụ n’ihi unu, ka unu wee site n’aka anyị mụta nke a: “Unu agabigala ihe e dere ede.”[b] Nke a bụ ka otu onye n’ime unu ghara ịfụli onwe ya elu n’ịkwado otu onye megide onye ọzọ.'
  to: 'Ihe ndị a, ụmụnna m[a], emeela m ka ha metụta mụ onwe m na Apọlọs n’ụzọ ihe atụ n’ihi unu, ka unu wee mụta n’ime anyị nke a: “Unu agabigala ihe e dere.”[b] Ka onye ọ bụla n’ime unu ghara ịfụli onwe ya elu n’ịkwado otu onye megide onye ọzọ.'
  rationale: The revision corrects the second purpose clause, restores the figurative-application force of μετεσχημάτισα, and makes the maxim and its note more idiomatic while preserving the source’s ellipsis and ambiguity. It does not add a doctrinal interpretation.
  reviewer_model: gpt-5.6-terra
