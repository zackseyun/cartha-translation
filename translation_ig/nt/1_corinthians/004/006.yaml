id: 1CO.4.6
reference: 1 Corinthians 4:6
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ταῦτα δέ, ἀδελφοί, μετεσχημάτισα εἰς ἐμαυτὸν καὶ ⸀Ἀπολλῶν δι’ ὑμᾶς, ἵνα ἐν ἡμῖν μάθητε τό· Μὴ ὑπὲρ ⸀ἃ ⸀γέγραπται, ἵνα μὴ εἷς ὑπὲρ τοῦ ἑνὸς φυσιοῦσθε κατὰ τοῦ ἑτέρου.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/006.yaml
  text: 'These things, brothers, I have applied to myself and Apollos for your sake, so that in us you may learn this: “Do not go beyond what is written,” so that none of you may be puffed up in favor of one against another.'
translation:
  language: ig
  text: 'Ihe ndị a, ụmụnna m[a], emeela m ka ha metụta mụ onwe m na Apọlọs n’ụzọ ihe atụ n’ihi unu, ka unu wee mụta n’ime anyị nke a: “Unu agabigala ihe e dere.”[b] Ka onye ọ bụla n’ime unu ghara ịfụli onwe ya elu n’ịkwado otu onye megide onye ọzọ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Okwu Grik a sụgharịrị “ụmụnna” nwere ike ịgụnye ma ụmụ nwoke ma ụmụ nwaanyị n’otu ndị a na-agwa okwu.
    reason: cultural_note
  - marker: b
    text: 'Okwu Grik ahụ dị mkpụmkpụ; n’ụzọ nkịtị, ọ bụ: “ihe a: ‘ọ bụghị karịa ihe e dere.’” O nwere ike ịbụ okwu e ji ama mmadụ aka ná ntị ma ọ bụ ilu; ihe ọ pụtara kpọmkwem ka na-arụrịta ụka.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταῦτα
  choice: Ihe ndị a
  rationale: Ọ na-ezo aka n’ihe Pọl kwuru tupu amaokwu a ma na-edobe ụdị ọtụtụ nke okwu Grik ahụ.
- source_word: ἀδελφοί
  choice: ụmụnna m
  rationale: N’Igbo, “ụmụnna” bụ okwu a na-ejikarị akpọ ndị otu okwukwe ma nwee ike ịgụnye ma ndị nwoke ma ndị nwaanyị; “m” na-eme ka ọkpụkpọ ahụ daa nke ọma n’Igbo.
- source_word: μετεσχημάτισα εἰς ἐμαυτὸν καὶ Ἀπολλῶν
  choice: ejirila mụ onwe m na Apọlọs kọwaa n’ụzọ ihe atụ
  rationale: Nke a na-egosi na Pọl tinyere ihe ndị ọ kọwara n’ụdị ihe atụ metụtara ya na Apọlọs, na-enweghị ime ka ọ pụta na ọ gbanwere isiokwu ahụ kpamkpam.
- source_word: δι’ ὑμᾶς
  choice: n’ihi unu
  rationale: Ọ na-egosi na ihe Pọl mere bụ maka ọdịmma ndị ọ na-agwa okwu.
- source_word: ἵνα ἐν ἡμῖν μάθητε
  choice: ka unu wee site n’aka anyị mụta
  rationale: Ọ na-edobe echiche na Pọl na Apọlọs bụ ndị e ji akụziri ha ihe ahụ.
- source_word: τό· Μὴ ὑπὲρ ἃ γέγραπται
  choice: 'nke a: “Unu agabigala ihe e dere ede”'
  rationale: Ọ na-enye ahịrịokwu Grik ahụ dị mkpụmkpụ ma ezughị ezu n’ụdị ndụmọdụ doro anya, ma ihe e dere n’ala peeji na-echekwa ụdị okwu mbụ ahụ.
- source_word: φυσιοῦσθε
  choice: ịfụli onwe ya elu
  rationale: Ọ na-echekwa onyinyo Pọl ji mee ihe banyere onye mpako dị ka onye fụrụ elu.
- source_word: ὑπὲρ τοῦ ἑνὸς κατὰ τοῦ ἑτέρου
  choice: n’ịkwado otu onye megide onye ọzọ
  rationale: Nke a na-egosi ịsọpụrụ otu onye n’otu esemokwu ma guzogide onye ọzọ.
theological_decisions:
- issue: Ihe ahịrịokwu dị mkpụmkpụ τό· Μὴ ὑπὲρ ἃ γέγραπται pụtara
  choice: 'Tụgharịa ya dị ka ndụmọdụ: “Unu agabigala ihe e dere ede.”'
  alternative: “Ihe ọ bụla agafela ihe e dere ede” ma ọ bụ ụdị okwu nkịtị, “Ọ bụghị ịgafe ihe e dere ede.”
  rationale: Okwu Grik ahụ enweghị ngwaa e kwuru hoo haa, ma n’ọnọdụ a ọ bụ ihe Pọl chọrọ ka ha mụta. Nsụgharị a na-eme ka ọrụ ndụmọdụ ya doo anya, ebe ihe e dere n’ala peeji na-egosi na okwu mbụ ahụ dị mkpụmkpụ ma nwee ike ịbụ ilu ma ọ bụ okwu e ji ama mmadụ aka ná ntị.
- issue: Ndị okwu ἀδελφοί gụnyere
  choice: Jiri “ụmụnna m,” nke n’Igbo nwere ike ịkpọ ọgbakọ niile.
  alternative: “ụmụnna m ndị nwoke na ndị nwaanyị”
  rationale: Ụdị Grik bụ aha ọtụtụ nke nwoke, ma o yikarịrị ka ọ na-agwa ọgbakọ ndị nwoke na ndị nwaanyị okwu. Okwu Igbo a na-arụ ọrụ n’ụzọ sara mbara n’enweghị ịgbakwunye nkọwa ogologo n’ahịrịokwu ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta mee ihe. “Ịfụli onwe ya elu” na-echekwa onyinyo okwu Pọl banyere mpako; “site n’aka anyị mụta” na-edobe mkpirikpi echiche Grik ἐν ἡμῖν. Akara [a] na [b] dị n’ederede n’ebe nkọwa ha metụtara.
