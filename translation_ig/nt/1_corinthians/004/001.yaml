revisions:
- from: 'Otu a ka mmadụ[b] kwesịrị isi were anyị: dị ka ndị na-ejere Mesaya[a] ozi na ndị e nyefere ihe omimi Chineke n’aka ka ha lekọta.'
  to: 'Ka mmadụ[b] si otú a lee anyị anya: dịka ndị na-ejere Mesaịa[a] ozi na ndị nlekọta nke ihe omimi Chineke.'
  rationale: The revision makes the imperative assessment expressed by λογιζέσθω explicit and idiomatic, restores a compact parallel rendering of ὑπηρέτας and οἰκονόμους, and uses the customary Standard Igbo spelling “Mesaịa.” It does not add an interpretation of the ‘mysteries’ beyond the Greek text.
  reviewer_model: gpt-5.6-terra
