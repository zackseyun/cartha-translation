id: 1CO.4.1
reference: 1 Corinthians 4:1
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Οὕτως ἡμᾶς λογιζέσθω ἄνθρωπος ὡς ὑπηρέτας Χριστοῦ καὶ οἰκονόμους μυστηρίων θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/001.yaml
  text: 'This is how a person should regard us: as servants of Messiah and stewards of the mysteries of God[a][b].'
translation:
  language: ig
  text: 'Ka mmadụ[b] si otú a lee anyị anya: dịka ndị na-ejere Mesaịa[a] ozi na ndị nlekọta nke ihe omimi Chineke.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Kraịst.” Okwu Grik Χριστός ka a sụgharịrị ebe a dị ka “Mesaịa” n’ihi na ọ na-arụ ọrụ dị ka aha-ọrụ.
    reason: lexical_alternative
  - marker: b
    text: “Mmadụ” ebe a pụtara onye ọ bụla n’ozuzu.
    reason: cultural_note
lexical_decisions:
- source_word: Οὕτως
  choice: Otu a
  rationale: Na-egosi ụzọ kwesịrị ekwesị e si ele Pọl na ndị ya na ha na-eje ozi anya.
- source_word: λογιζέσθω
  choice: kwesịrị isi were
  rationale: Na-egosipụta iwu ma ọ bụ ntụziaka banyere otú mmadụ ga-esi tụlee ma lezie ha anya, n’Igbo dị ugbu a ma dị mfe nghọta.
- source_word: ἄνθρωπος
  choice: mmadụ
  rationale: Okwu Grik a na-arụ ọrụ n’ozuzu ebe a; “mmadụ” na-egosi onye ọ bụla n’enweghị ịgbakwunye nwoke ma ọ bụ nwanyị.
- source_word: ὑπηρέτας
  choice: ndị na-ejere ... ozi
  rationale: Na-egosi ndị nọ n’okpuru onye ọzọ na-eje ozi, na-enweghị echiche siri ike nke ịbụ ohu dị n’okwu δοῦλος.
- source_word: Χριστοῦ
  choice: Mesaya
  rationale: A sụgharịrị aha-ọrụ Χριστός dị ka “Mesaya” n’ihi na echiche nke Onye Chineke tere mmanụ ka na-arụ ọrụ n’ebe a.
- source_word: οἰκονόμους
  choice: ndị e nyefere ... n’aka ka ha lekọta
  rationale: Na-eme ka ọrụ onye nlekọta e nyere ihe n’aka pụta ìhè n’Igbo nkịtị, karịa iji naanị aha nwere ike ghara igosi ntụkwasị obi ahụ.
- source_word: μυστηρίων θεοῦ
  choice: ihe omimi Chineke
  rationale: Na-echekwa okwu Pọl banyere eziokwu Chineke zoro ezo ma Chineke mere ka a mara, na-akọwaghị ya karịa ihe isi mmalite kwuru.
theological_decisions:
- issue: Nsụgharị Χριστοῦ
  choice: Mesaya
  alternative: Kraịst
  rationale: N’amaokwu a, Χριστός bụ aha-ọrụ nke Onye Chineke tere mmanụ, ọ bụghị naanị aha onwe onye; e debere ụzọ ọzọ a maara nke ọma n’ala ala peeji.
- issue: Ike izugbe nke ἄνθρωπος
  choice: mmadụ
  alternative: nwoke
  rationale: Ọ bụ ezie na ụdị okwu Grik ahụ bụ otu onye, ihe ọ pụtara bụ mmadụ ọ bụla n’ozuzu. “Mmadụ” na-echekwa nke a n’Igbo n’enweghị igbochi ya n’ebe ụmụ nwoke nọ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-echekwa ntụziaka nke ngwaa Grik, ọrụ dị n’okpuru Mesaya, na echiche nke ihe Chineke nyefere ndị nlekọta n’aka.
