  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τί θέλετε; ἐν ῥάβδῳ ἔλθω πρὸς ὑμᾶς, ἢ ἐν ἀγάπῃ πνεύματί τε πραΰτητος;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/021.yaml
  text: What do you want? Should I come to you with a rod[b][a], or with love and a spirit of gentleness?
translation:
  language: ig
  text: Gịnị ka unu chọrọ? M̀ ga-eji mkpara bịakwute unu, ka m̀ ga-eji ịhụnanya na mmụọ[b] nke ịdị nwayọọ[a] bịakwute unu?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “jiri ịhụnanya na ịdị nwayọọ nke mmụọ.”
    reason: lexical_alternative
  - marker: b
    text: Okwu a bụ “mmụọ nke ịdị nwayọọ” nwere ike ịpụta àgwà ịdị nwayọọ Pọl nwere; ụfọdụ na-aghọta “Mmụọ” n’ebe a dị ka ntụaka na-apụtaghị ìhè banyere ọrụ Mmụọ Nsọ.
    reason: alternative_reading
lexical_decisions:
- source_word: τί θέλετε
  choice: Gịnị ka unu chọrọ?
  rationale: Ajụjụ a kpọmkwem na-egosipụta ike nke ihe Pọl na-ajụ, ma bụrụkwa Igbo a na-asụ ugbu a.
- source_word: ἐν ῥάβδῳ
  choice: jiri mkpara
  rationale: “Mkpara” na-echekwa ihe oyiyi nkịtị nke ῥάβδος na echiche ịdọ aka ná ntị dị n’ime ya, kama ịkọwa ya naanị dị ka “ntaramahụhụ” ma ọ bụ “ịdọ aka ná ntị.”
- source_word: ἔλθω πρὸς ὑμᾶς
  choice: M̀ ga-… bịakwute unu
  rationale: Ụdị ajụjụ a na-egosipụta mkpebi Pọl na-atụle, ma na-ada nke ọma n’Igbo ugbu a.
- source_word: ἢ
  choice: ka
  rationale: “Ka” na-egosi nhọrọ nke abụọ n’ajụjụ a n’ụzọ ebumpụta ụwa n’Igbo.
- source_word: ἐν ἀγάπῃ
  choice: jiri ịhụnanya
  rationale: “Jiri” dabara na otu e si kwuo “jiri mkpara,” ebe “ịhụnanya” bụ okwu doro anya maka ἀγάπη.
- source_word: πνεύματί τε πραΰτητος
  choice: na mmụọ nke ịdị nwayọọ
  rationale: Nke a na-echekwa okwu πνεῦμα na njikọ genitive nke πραΰτης, ma na-akọwa àgwà ịdị nro na nke na-adịghị aka ike n’Igbo dị ùgwù.
theological_decisions:
- issue: Ihe πνεύματι pụtara n’okwu πνεύματί τε πραΰτητος
  choice: mmụọ nke ịdị nwayọọ, nke na-ezo n’ụzọ mbụ aka n’àgwà ma ọ bụ omume Pọl
  alternative: Mmụọ nke ịdị nwayọọ, nke a pụrụ ịghọta dị ka ọrụ Mmụọ Nsọ
  rationale: 'Ihe gbara amaokwu ahụ gburugburu na-atụnyere ụzọ abụọ Pọl pụrụ isi bịa: jiri mkpara, ma ọ bụ jiri ịhụnanya na ịdị nwayọọ. Enweghị artikụl n’asụsụ Grik, ya mere ederede ahụ anaghị amanye ka a kpọọ πνεῦμα Mmụọ Nsọ kpọmkwem. E debere ohere nghọta nke ọzọ n’okpuru amaokwu.'
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe ma dị ùgwù. “Unu” na-egosipụta na Pọl na-agwa ọgbakọ mmadụ ọtụtụ okwu. E debere ihe oyiyi “mkpara” na nghọtahie nwere ike ịdị n’okwu “mmụọ” n’ebughị ụzọ kpebie ya n’ụzọ otu ụka.
