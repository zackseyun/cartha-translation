review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the strenuous labor, manual self-support, blessing in response to abuse, and persecution. However, “anyị na-edi” is not a clear or idiomatic Standard Igbo rendering of ἀνεχόμεθα (‘we endure/bear with’); it risks being understood through a different verb. “anyị na-anagide” clearly expresses enduring hostile hardship. “aka nke anyị” also more explicitly retains the emphasis of ἰδίαις (‘our own’).
  naturalness: The antithetical rhythm is natural and appropriately concise. Replacing “anyị na-edi” with “anyị na-anagide” improves modern Standard Igbo clarity. The opening capitalization is normalized for a standalone verse.
  terminology: “na-adọgbu onwe anyị n’ọrụ,” “na-agọzi,” “na-akparị,” and “na-akpagbu” are suitable in register and sense. “na-eji aka nke anyị arụ ọrụ” preserves the emphatic possessive/manual-labor wording without adding an unsupported purpose such as earning a living.
  issues:
  - severity: medium
    issue: The phrase “anyị na-edi” inadequately renders ἀνεχόμεθα.
    rationale: The Greek denotes enduring or bearing hostile treatment. “anyị na-anagide” is the clear, idiomatic Standard Igbo expression for this sense and does not require supplying an explicit object.
  - severity: low
    issue: The phrase “aka anyị” weakens the explicit emphasis of ἰδίαις.
    rationale: Using “aka nke anyị” makes ‘our own hands’ explicit while retaining natural Igbo.
