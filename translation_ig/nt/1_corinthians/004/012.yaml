source:
  edition: SBLGNT
  text: καὶ κοπιῶμεν ἐργαζόμενοι ταῖς ἰδίαις χερσίν· λοιδορούμενοι εὐλογοῦμεν, διωκόμενοι ἀνεχόμεθα,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/012.yaml
  text: and we labor[a], working with our own hands. When insulted, we bless; when persecuted, we endure;
translation:
  language: ig
  text: Anyị na-adọgbu onwe anyị n’ọrụ, na-eji aka nke anyị arụ ọrụ. Mgbe a na-akparị anyị[a], anyị na-agọzi; mgbe a na-akpagbu anyị, anyị na-anagide.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ịsụgharị ya: “Mgbe a na-akọcha anyị, anyị na-agọzi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: κοπιῶμεν
  choice: anyị na-adọgbu onwe anyị n’ọrụ
  rationale: Nke a na-egosi ọrụ siri ike nke na-eme ka ike gwụ mmadụ, ọ bụghị naanị ịrụ ọrụ nkịtị.
- source_word: ἐργαζόμενοι
  choice: na-eji aka anyị arụ ọrụ
  rationale: Ebe ọ bụ participle na-akọwa otú ha si adọgbu onwe ha n’ọrụ, e jikọtara ya na nkebi banyere iji aka ha rụọ ọrụ.
- source_word: ταῖς ἰδίαις χερσίν
  choice: na-eji aka anyị arụ ọrụ
  rationale: ‘Aka anyị’ na-edobe ike dị na ἰδίαις, ya bụ na ha ji aka nke ha na-arụ ọrụ.
- source_word: λοιδορούμενοι
  choice: Mgbe a na-akparị anyị
  rationale: Nke a na-enye passive participle ahụ n’ụzọ Igbo doro anya, ma na-egosi okwu mkparị a na-ekwu megide ha.
- source_word: εὐλογοῦμεν
  choice: anyị na-agọzi
  rationale: ‘Ịgọzi’ na-edobe okwu bụ isi nke Akwụkwọ Nsọ ma gosipụta nzaghachi ha megide mkparị.
- source_word: διωκόμενοι
  choice: mgbe a na-akpagbu anyị
  rationale: N’ebe a okwu ahụ pụtara mmegide na mkpagbu, ọ bụghị naanị ịchụ mmadụ ọsọ.
- source_word: ἀνεχόμεθα
  choice: anyị na-edi
  rationale: Nke a na-edobe ngwaa Greek ahụ n’enweghị ịtinye ihe a na-edi nke edepụtaghị n’ahịrịokwu ahụ.
theological_decisions:
- issue: Nzaghachi ndịozi nye mmeso ọjọọ
  choice: 'A sụgharịrị amaokwu ahụ dị ka nkọwa omume ndịozi: ha na-agọzi mgbe a na-akparị ha, na-edikwa mgbe a na-akpagbu ha.'
  alternative: Ịsụgharị ya dị ka iwu e nyere ndị kwere ekwe niile kpọmkwem.
  rationale: Greek na-akọwa omume ndịozi n’usoro okwu dị mkpirikpi; nsụgharị ahụ edoghị ya ka iwu kpọmkwem karịa ihe ederede kwuru.
translation_notes:
  register: 'E ji Standard Igbo nke oge a, nke dị ugwu ma dị mfe nghọta. E debere usoro antithesis nke Greek na okwu ndị na-aga n’otu ahịrị: ‘mgbe a na-akparị anyị …; mgbe a na-akpagbu anyị …’.'
