  rationale: The revision preserves every element of the Greek while using a natural Standard Igbo exhortation. “Ana m arịọsi unu ike ka ...” renders the earnest appeal, and “ka unu ghọọ ndị na-eṅomi m” clearly preserves the transition/adoption nuance of γίνεσθε. Both existing footnote anchors and their functions are retained.
