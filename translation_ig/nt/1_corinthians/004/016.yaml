review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the inferential οὖν, Paul's earnest appeal (παρακαλῶ), the plural audience, and the call to become his imitators. The main verb should be adjusted to the standard and unambiguous Igbo form ghọọ, and the appeal is more naturally expressed with a ka-clause.
  naturalness: “Ana m arịọsị unu ike” is less idiomatic in this construction and contains a problematic spelling/form. “Ana m arịọsi unu ike ka unu ghọọ ...” is natural Standard Igbo and retains the earnest exhortational force.
  terminology: “Ndị na-eṅomi m” accurately represents μιμηταί μου and is appropriate modern Standard Igbo. “Kraịst” is established biblical terminology. The cross-reference accurately reflects 1 Corinthians 11:1 without importing it into the verse itself.
  issues:
  - severity: medium
    issue: The form “ghọnụ” is not the safe standard imperative/complement form for ‘become’ here.
    rationale: γίνεσθε calls for becoming/adopting a state. “Ghọọ” is the clear Standard Igbo verb; in the natural complement construction it is “ka unu ghọọ.”
  - severity: low
    issue: “Ana m arịọsị unu ike” is awkwardly formed for this appeal.
    rationale: The idiomatic intensive expression is “ana m arịọsi unu ike,” normally followed by “ka” and the requested action.
  revised_text: Ya mere, ana m arịọsi unu ike ka unu ghọọ ndị na-eṅomi m.[a][b]
