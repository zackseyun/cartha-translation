  text: παρακαλῶ οὖν ὑμᾶς, μιμηταί μου γίνεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/016.yaml
  text: 'Therefore I urge you: become imitators of me[a][b].'
translation:
  language: ig
  text: Ya mere, ana m arịọsi unu ike ka unu ghọọ ndị na-eṅomi m.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “bụrụnụ ndị na-eṅomi m.”
    reason: lexical_alternative
  - marker: b
    text: N'ebe ọzọ Pọl kwuru kpọmkwem, “Na-eṅominụ m, dị ka mụ onwe m si eṅomi Kraịst” (1 Kọrịnt 11:1).
    reason: cross_reference
lexical_decisions:
- source_word: παρακαλῶ
  choice: ana m arịọsị unu ike
  rationale: N'ọnọdụ a, okwu ahụ bụ arịrịọ siri ike nke na-agba ndị a ume ime ihe, ọ bụghị naanị ịrịọ arịrịọ nkịtị. Nke a bụ Igbo doro anya ma dịrị ndị mmadụ mfe.
- source_word: οὖν
  choice: Ya mere
  rationale: Ọ na-egosi na ndụmọdụ a sitere n'ihe Pọl kwuru tupu ya.
- source_word: ὑμᾶς
  choice: unu
  rationale: Ụdị onye nke abụọ n'ọnụọgụ Igbo na-egosipụta n'ụzọ doro anya na Pọl na-agwa ọtụtụ mmadụ okwu.
- source_word: μιμηταί
  choice: ndị na-eṅomi
  rationale: Nke a na-echekwa isi echiche nke ịgbaso ma ṅomie ụkpụrụ mmadụ, karịa okwu sara mbara dịka 'ndị na-eso ụzọ.'
- source_word: μου
  choice: m
  rationale: 'E jikọtara ya na ''na-eṅomi'' n''ụdị Igbo ebumpụta ụwa: ''ndị na-eṅomi m.'''
- source_word: γίνεσθε
  choice: ghọnụ
  rationale: Okwu a na-egosi ịbanye n'ọnọdụ ma ọ bụ ịghọ ụdị mmadụ a kpọrọ aha; ya mere 'ghọnụ' dabara karịa naanị 'dịrịnụ.'
theological_decisions:
- issue: Nkụzi Pọl ka ndị Kọrịnt ṅomie ya nwere ike iyi ihe gabigara ókè ma ọ bụrụ na ewepụ ya n'ọnọdụ sara mbara nke lekwasịrị Kraịst anya.
  choice: A sụgharịrị ya ozugbo dịka “ghọnụ ndị na-eṅomi m” n'emeghị ka ike okwu ahụ belata.
  alternative: “soronụ ihe nlereanya m”
  rationale: Grik kpọrọ Pọl n'onwe ya onye ha ga-eṅomi. Amaokwu a ekwesịghị ime ka nke ahụ dị nro, ebe nkọwa gbasara iṅomi Kraịst kwesịrị ịdị na nkọwa ntụaka, ọ bụghị itinye ya n'ime isi ederede.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị ùgwù ma doo anya. “Ana m arịọsị unu ike” na-ebute ịdị ike nke παρακαλῶ n'ụzọ ebumpụta ụwa; “ghọnụ ndị na-eṅomi m” na-echekwa iwu ahụ na echiche nke γίνεσθε.
