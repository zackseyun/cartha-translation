id: 1CO.4.15
reference: 1 Corinthians 4:15
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐὰν γὰρ μυρίους παιδαγωγοὺς ἔχητε ἐν Χριστῷ, ἀλλ’ οὐ πολλοὺς πατέρας, ἐν γὰρ Χριστῷ Ἰησοῦ διὰ τοῦ εὐαγγελίου ἐγὼ ὑμᾶς ἐγέννησα.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/015.yaml
  text: For even if you have countless guardians in Messiah[a], yet not many fathers; for in Messiah Jesus, through the gospel[d][c][b], I became your father.
translation:
  language: ig
  text: N’ihi na ọ bụrụgodị na unu nwere puku iri[a] ndị na-elekọta unu[b] n’ime Mesaya[d], unu enweghị ọtụtụ nna; n’ihi na n’ime Mesaya Jizọs, site n’oziọma, ọ bụ m bụụrụ unu nna[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ọtụtụ a na-apụghị ịgụta ọnụ.” N’asụsụ Grik, “puku iri” na-abụkarị ụzọ e si ekwu ọnụ ọgụgụ dị nnọọ ukwuu.
    reason: lexical_alternative
  - marker: b
    text: Okwu Grik a na-ekwu maka onye na-elekọta nwa, na-edu ya ma na-ahụ maka omume ya; ọ bụghị naanị onye nkụzi n’ụlọ akwụkwọ.
    reason: cultural_note
  - marker: c
    text: N’asụsụ Grik, “amụrụ m unu” ma ọ bụ “mụrụ m unu.” Nke a bụ ihe atụ maka ọrụ Pọl n’iwetara ha okwukwe site n’oziọma; e ji “ọ bụ m bụụrụ unu nna” mee ka ihe atụ nna ahụ doo anya n’Igbo.
    reason: lexical_alternative
  - marker: d
    text: Aha-ọkwa Grik Χριστός pụtara “Onye E Tere Mmanụ,” ya bụ, “Mesaya”; a sụgharịrị ya ebe a dịka “Mesaya.” Ihe a metụtara ma “n’ime Mesaya” ma “n’ime Mesaya Jizọs.”
    reason: translation_note
lexical_decisions:
- source_word: μυρίους
  choice: puku iri
  rationale: Nke a bụ ihe okwu Grik ahụ pụtara kpọmkwem, ma n’ebe a ọ na-ekwusi ike na ọnụ ọgụgụ ahụ dị nnọọ ukwuu. Ihe odide ala peeji na-akọwa ojiji a.
- source_word: παιδαγωγοὺς
  choice: ndị na-elekọta unu
  rationale: N’ọha ndị Gris na Rom, παιδαγωγός bụ onye na-elekọta nwa, na-edu ya ma na-ahụ maka omume ya; ọ bụghị nanị onye nkụzi n’ụlọ akwụkwọ.
- source_word: ἐν Χριστῷ
  choice: n’ime Kraịst
  rationale: A hapụrụ okwu njikọ Pọl bụ ‘n’ime’ ka ọ nọgide nwee obosara ihe ọ pụrụ ịpụta, ma sụgharịa Χριστός dị ka aha-ọkwa ‘Kraịst.’
- source_word: πατέρας
  choice: nna
  rationale: E debere ihe atụ nna ahụ n’ụzọ doro anya, n’etinyeghị nkọwa dịka ‘nna ime mmụọ’ n’ahịrịokwu bụ isi.
- source_word: διὰ τοῦ εὐαγγελίου
  choice: site n’oziọma
  rationale: διά ya na genitive na-egosi ụzọ ma ọ bụ ihe e ji mee ihe; oziọma bụ ụzọ e si mụọ ha n’ihe atụ a.
- source_word: ἐγέννησα
  choice: ọ bụ m mụrụ unu
  rationale: Nke a na-edebe ihe oyiyi ọmụmụ nke γεννάω ma na-ada ka Igbo nkịtị; nhazi ‘ọ bụ m’ na-emesi ọrụ Pọl pụrụ iche ike dịka Grik ἐγώ si eme.
theological_decisions:
- issue: Otu e si chekwaa ihe atụ Pọl banyere ịbụ nna n’etinyeghị nkọwa ụka pụrụ iche
  choice: ‘ọ bụ m mụrụ unu’
  alternative: ‘aghọrọ m nna unu’ ma ọ bụ ‘ọ bụ m ghọrọ nna ime mmụọ unu’
  rationale: Grik ji ngwaa pụtara ‘ịmụ’ ma ọ bụ ‘ịghọ nna’ mee ihe atụ banyere ọrụ Pọl n’iwetara ha okwukwe site n’oziọma. Nhọrọ a na-echekwa ike na esemokwu dị n’ihe atụ ahụ, na-agbakwụnyeghị echiche sakrament ma ọ bụ ọkwa ndị ụkọchukwu.
- issue: Ihe okwu ἐν Χριστῷ pụtara
  choice: ‘n’ime Kraịst’
  alternative: ịkọwa ya kpọmkwem dịka ‘n’ịdị n’otu na Kraịst’
  rationale: ‘N’ime Kraịst’ na-echekwa obosara na nghọta dị iche iche okwu Pọl nwere ike ibu kama idozi ya n’otu ụzọ nkọwa.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. Ahịrịokwu ahụ na-agbaso arụmụka Pọl nke ọma, ma jiri nhazi Igbo kwekọrọ n’okwu nkịtị. E debere ‘n’ime Kraịst,’ ‘nna,’ na ihe oyiyi ‘ịmụ’ n’enweghị ịgbasa ha n’ụzọ ozizi otu ụka.
