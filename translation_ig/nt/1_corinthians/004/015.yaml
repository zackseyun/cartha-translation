revisions:
- from: N’ihi na ọ bụrụgodị na unu nwere puku iri[a] ndị na-elekọta unu[b] n’ime Kraịst[d], unu enweghị ọtụtụ nna; n’ihi na n’ime Kraịst Jizọs, site n’oziọma, ọ bụ m mụrụ unu[c].
  to: N’ihi na ọ bụrụgodị na unu nwere puku iri[a] ndị na-elekọta unu[b] n’ime Mesaya[d], unu enweghị ọtụtụ nna; n’ihi na n’ime Mesaya Jizọs, site n’oziọma, ọ bụ m bụụrụ unu nna[c].
  rationale: The revision resolves the only substantive Igbo idiom issue by expressing Paul’s role as paternal, as required by the Greek contrast between παιδαγωγοί and πατέρες. It also consistently translates Χριστός as “Mesaya,” as specified in the translation decisions. The literal and idiomatic dimensions of γεννάω are retained in the footnote without imposing a denominational interpretation.
