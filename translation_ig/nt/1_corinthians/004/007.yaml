source:
  edition: SBLGNT
  text: τίς γάρ σε διακρίνει; τί δὲ ἔχεις ὃ οὐκ ἔλαβες; εἰ δὲ καὶ ἔλαβες, τί καυχᾶσαι ὡς μὴ λαβών;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/007.yaml
  text: For who makes you different? And what do you have that you did not receive? And if you did receive it[a], why do you boast as if you had not received it?
translation:
  language: ig
  text: N’ihi na ònye na-eme ka ị dị iche[a]? Gịnịkwa ka i nwere nke ị nataghị? Ọ bụrụkwa na ị natara ya, gịnị mere i ji etu ọnụ dị ka a ga-asị na ị nataghị ya?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “Ònye na-ekewapụta gị?” ma ọ bụ “Ònye na-eme ka ị pụta iche?” Okwu Grik ahụ nwere ike ịpụta ikewapụta, ime ka ihe dị iche, ma ọ bụ ime ka ihe pụta iche.
    reason: lexical_alternative
lexical_decisions:
- source_word: τίς γάρ σε διακρίνει
  choice: N’ihi na, ònye na-eme ka ị dị iche?
  rationale: “N’ihi na” na-egosipụta ọrụ γάρ nke na-enye ihe mere e ji baara ha mba n’amaokwu ndị bu ụzọ. “Na-eme ka ị dị iche” na-ebupụta ntụnyere dị na διακρίνει n’ụzọ Igbo dị mfe ma na-ahapụ ajụjụ ahụ ka ọ jụọ onye ma ọ bụ ihe mere onye ahụ ji chee na ọ ka ndị ọzọ.
- source_word: τί δὲ ἔχεις
  choice: Gịnịkwa ka i nwere
  rationale: “-kwa” na-ejikọta ajụjụ nke abụọ na nke mbụ n’ụzọ kwekọrọ na δέ, nke bụ njikọ dị nro ebe a, ọ bụghị nnukwu mmegide.
- source_word: ὃ οὐκ ἔλαβες
  choice: nke ị na-anataghị
  rationale: Nhọrọ a na-ekwu n’ụzọ Igbo ebumpụta ụwa na ihe onye ahụ nwere bụ ihe ọ natara, ọ bụghị ihe sitere n’aka ya onwe ya. Ọ naghị amachi ihe ahụ n’onyinye ime mmụọ naanị.
- source_word: εἰ δὲ καὶ ἔλαβες
  choice: Ọ bụrụkwa na ị natara ya
  rationale: “-kwa” na-eburu njikọ δέ, ebe usoro ahịrịokwu na ihe gbara ya gburugburu na-eme ka nkwenye dị na καί pụta ìhè. “Ya” na-alaghachi n’ihe onye ahụ nwere, dị ka asụsụ Igbo si achọ.
- source_word: τί καυχᾶσαι
  choice: gịnị mere i ji etu ọnụ
  rationale: “Itu ọnụ” bụ okwu Igbo doro anya maka καυχάομαι ma na-egosipụta omume na mmụọ nganga Pọl na-abara mba.
- source_word: ὡς μὴ λαβών
  choice: dị ka a ga-asị na ị nataghị ya
  rationale: 'Usoro a na-egosipụta omume megidere eziokwu: onye ahụ na-etu ọnụ ka à ga-asị na ihe o nwere abụghị ihe ọ natara.'
theological_decisions:
- issue: Ihe Pọl na-ekwu gbasara ịdị iche, ihe mmadụ nwere, na itu ọnụ
  choice: 'E debere okwu ahụ n’ozuzu ya: ihe ọ bụla mere mmadụ ji dị iche ma ọ bụ ihe ọ bụla o nwere bụ ihe ọ natara, n’amachighị ya n’onyinye ime mmụọ naanị.'
  alternative: Ịkọwa ya kpọmkwem dị ka onyinye ime mmụọ na ọrụ ije ozi, ma ọ bụ gbasaa ya n’ụzọ doro anya ruo n’ikike na ngọzi niile.
  rationale: Ihe gbara amaokwu ahụ gburugburu metụtara ọrụ ndị ozi, nkewa n’ọgbakọ, na nganga; ma okwu Grik n’onwe ya sara mbara. Ya mere, nsụgharị ahụ anaghị amachi ma ọ bụ gbasaa ihe Pọl kwuru karịa ihe odide ahụ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta, dee ya. A hapụrụ usoro ajụjụ atọ nke Pọl ji agba nganga ha aka ná ntị. E tinyere akara nkọwa ala [a] ozugbo n’akụkụ nkebi okwu ọ na-akọwa.
