  to: N’ihi na ònye na-eme ka ị dị iche[a]? Gịnịkwa ka i nwere nke ị nataghị? Ọ bụrụkwa na ị natara ya, gịnị mere i ji etu ọnụ dị ka a ga-asị na ị nataghị ya?
