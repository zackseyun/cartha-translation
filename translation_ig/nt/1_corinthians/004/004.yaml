source:
  edition: SBLGNT
  text: οὐδὲν γὰρ ἐμαυτῷ σύνοιδα, ἀλλ’ οὐκ ἐν τούτῳ δεδικαίωμαι, ὁ δὲ ἀνακρίνων με κύριός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/004.yaml
  text: For I am aware of nothing against myself[a], but I am not justified by this[c][b]; the one who examines me is the Lord.
translation:
  language: ig
  text: N’ihi na ọ dịghị ihe ọ bụla m maara megide onwe m[a], ma nke a abụghị ihe e ji agụ m dịka onye ezi omume[b]; ọ bụ Onyenwe anyị na-enyocha m[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ọ dịghị ihe ọ bụla akọ na uche m na-ama m ikpe na ya,” ma ọ bụ, “ọ dịghị ihe ọ bụla m maara n’ime onwe m.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ọ bụghị n’ihi nke a ka a tọhapụrụ m n’ikpe,” ma ọ bụ, “ọ bụghị site na nke a ka a kwadoro na m ziri ezi.” Okwu Grik bụ okwu metụtara ikpe, nke Pọl na-ejikwa n’ebe ndị ọzọ maka ịgụ mmadụ dịka onye ezi omume.
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “onye na-ekpe m ikpe.” Okwu Grik ahụ nwere ike ịpụta inyocha, ịchọpụta nke ọma, ma ọ bụ ịtụle mmadụ n’ọnọdụ ikpe.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδὲν γὰρ ἐμαυτῷ σύνοιδα
  choice: N’ihi na ọ dịghị ihe ọ bụla m maara megide onwe m
  rationale: Nke a na-egosipụta nkọwa Pọl na-enye n’amaokwu gbara ya gburugburu. “M maara megide onwe m” na-eburu echiche nke ihe akọ na uche ya pụrụ ịgba ya akaebe na ya, ma ọ naghị ekwu na o nweghị mmehie ọ bụla n’ime ya.
- source_word: ἀλλ’ οὐκ ἐν τούτῳ
  choice: ma nke a adịghị eme ka
  rationale: Nkebi a na-egosi na enweghị ihe Pọl maara megide onwe ya abụghị ihe ndabere nke mkpebi ikpe banyere ya. Usoro a dị mfe nghọta n’Igbo ma na-edobe njikọ nke echiche ahụ.
- source_word: δεδικαίωμαι
  choice: a gụọ m dịka onye ezi omume
  rationale: Okwu a bụ perfect passive nke δικαιόω ma nwee ụda okwu ikpe n’ebe a. Nhọrọ a na-edobe echiche nke ịkpọ mmadụ onye ezi omume ma ghara ime ka ọ bụrụ naanị mmetụta nke ịdị ọcha n’obi.
- source_word: ὁ δὲ ἀνακρίνων με
  choice: ọ bụ ... na-enyocha m
  rationale: ἀνακρίνω nwere ike ịpụta inyocha, ịchọpụta, ma ọ bụ ikpebi uru mmadụ n’ọnọdụ metụtara ikpe. “Na-enyocha m” na-edobe echiche nke nnyocha n’enweghị ịgbatị ya ruo n’ikpe ikpeazụ.
- source_word: κύριός
  choice: Onyenwe anyị
  rationale: Nke a bụ ụzọ Igbo kwụ chịm si akọwa κύριος dị ka aha nsọpụrụ doro anya. A naghị etinye “Jizọs” ebe ederede Grik na-ekwughị ya kpọmkwem.
theological_decisions:
- issue: Ụda okwu ikpe dị na δεδικαίωμαι na mmekọrịta ya na nyocha Pọl banyere onwe ya
  choice: a gụọ m dịka onye ezi omume
  alternative: a tọhapụ m n’ikpe; a kwado na m ziri ezi
  rationale: Ọnọdụ okwu a bụ nke nyocha na ikpe. Nsụgharị ahụ na-edobe ịdị arọ nke okwu δικαιόω, ma ọ naghị amanye amaokwu a ikwu ozizi sara mbara karịa ihe ọnọdụ a chọrọ.
- issue: Onye κύριος na-ezo aka na ya
  choice: Onyenwe anyị
  alternative: Onyenwe anyị Jizọs
  rationale: Ederede Grik kwuru naanị κύριος. Ọ bụ ezie na ọnọdụ akwụkwọ Pọl pụrụ ime ka onye na-agụ ya ghọta Kraịst, nsụgharị ahụ anaghị etinye aha na-anọghị n’amaokwu a.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-edobe ụda arụmụka Pọl, echiche nke akọ na uche, na asụsụ metụtara ikpe. E tinyere akara ndetu ụkwụ [a], [b], na [c] n’isi ederede n’ebe okwu ndị ha na-akọwa dị.
