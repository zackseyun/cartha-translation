reference: 1 Corinthians 4:9
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: δοκῶ ⸀γάρ, ὁ θεὸς ἡμᾶς τοὺς ἀποστόλους ἐσχάτους ἀπέδειξεν ὡς ἐπιθανατίους, ὅτι θέατρον ἐγενήθημεν τῷ κόσμῳ καὶ ἀγγέλοις καὶ ἀνθρώποις.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/009.yaml
  text: For it seems to me that God has displayed us[a], the apostles, last of all, like men sentenced to death, because we have become a spectacle to the world[c][b], both to angels and to men.
translation:
  language: ig
  text: N’ihi na ọ dị m ka Chineke egosipụtala anyị, bụ ndịozi, dịka ndị ikpeazụ, dịka ndị e debere ka ha nwụọ[a], n’ihi na anyị aghọọla ihe ngosi nye ụwa, nye ndị mmụọ ozi na ụmụ mmadụ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “dịka ndị a mara ikpe ka ha nwụọ.” Okwu Grik ahụ na-ezo aka ná ndị e debere maka ọnwụ, ikekwe n’ihe oyiyi nke ọgbọ egwuregwu ọha.
    reason: lexical_alternative
  - marker: b
    text: N’ụzọ kpọmkwem, okwu Grik ahụ bụ “ụlọ ihe nkiri”; ihe ọ pụtara ebe a bụ ihe ngosi ọha mmadụ na-ekiri.
    reason: lexical_alternative
lexical_decisions:
- source_word: δοκῶ γάρ
  choice: N’ihi na ọ dị m ka
  rationale: Na-egosipụta njikọ nkọwa nke γάρ na echiche Pọl n’onwe ya nke δοκῶ, n’Igbo dị mfe ma dị ebube.
- source_word: ἡμᾶς τοὺς ἀποστόλους
  choice: anyị, ndịozi
  rationale: 'Na-echekwa nkọwa apposition nke okwu Grik: ‘ndịozi’ na-akọwa ndị ‘anyị’ bụ.'
- source_word: ἐσχάτους ἀπέδειξεν
  choice: egosila anyị ... n’ọnọdụ ikpeazụ
  rationale: ‘Egosila’ na-ebute echiche nke iweta mmadụ n’ihu ọha ka a hụ ya; ‘n’ọnọdụ ikpeazụ’ na-echekwa nrụgide nke ἐσχάτους.
- source_word: ὡς ἐπιθανατίους
  choice: dịka ndị a mara ikpe ọnwụ
  rationale: Na-egosipụta ndị e kpebiri ka ha nwụọ, ma na-ahapụ ihe oyiyi ebe ngosi ọha nke okwu ahụ nwere.
- source_word: θέατρον ἐγενήθημεν
  choice: anyị aghọọla ihe ngosi
  rationale: Na-enye ihe okwu ahụ pụtara n’ebe a—ndị mmadụ na-ele n’ihu ọha—kama ịsụgharị θέατρον naanị dịka ụlọ ihe nkiri.
- source_word: τῷ κόσμῳ
  choice: n’ihu ụwa
  rationale: Na-egosipụta ụwa dịka ndị na-ekiri ihe ngosi ahụ.
- source_word: καὶ ἀγγέλοις καὶ ἀνθρώποις
  choice: n’ihu ma ndị mmụọ ozi ma ụmụ mmadụ
  rationale: Na-echekwa ọdịiche dị n’etiti ndị mmụọ ozi na mmadụ niile, na-enweghị ime ἀνθρώποις ka ọ bụrụ naanị ụmụ nwoke.
theological_decisions:
- issue: Ihe ἀγγέλοις pụtara
  choice: ndị mmụọ ozi, ya bụ, ndị e kere eke nke eluigwe na-ekiri ahụhụ ndịozi
  alternative: ndị ozi n’ozuzu ha
  rationale: Njikọ ya na ‘ụwa’ na ‘ụmụ mmadụ’ na-eme ka ndị mmụọ ozi nke eluigwe bụrụ nghọta kacha kwekọọ n’ebe a, n’enweghị itinye nkọwa ozizi ọzọ.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma doo ndị nkịtị anya. E ji ‘ụmụ mmadụ’ mee ἀνθρώποις ka o doo anya na ọ gbasara mmadụ niile, ọ bụghị naanị ụmụ nwoke. A haziri akara edemede ka apposition ‘anyị, ndịozi’ pụta ìhè.
