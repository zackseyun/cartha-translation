revisions:
- from: N’ihi na ọ dị m ka Chineke egosila anyị, ndịozi, n’ọnọdụ ikpeazụ, dịka ndị a mara ikpe ọnwụ[a], n’ihi na anyị aghọọla ihe ngosi n’ihu ụwa[b], n’ihu ma ndị mmụọ ozi ma ụmụ mmadụ.
  to: N’ihi na ọ dị m ka Chineke egosipụtala anyị, bụ ndịozi, dịka ndị ikpeazụ, dịka ndị e debere ka ha nwụọ[a], n’ihi na anyị aghọọla ihe ngosi nye ụwa, nye ndị mmụọ ozi na ụmụ mmadụ.[b]
  rationale: The revised wording more directly reflects ἐσχάτους as the apostles’ being exhibited as last and renders ἐπιθανατίους with an idiomatic phrase that does not over-specify judicial condemnation. The audience phrase is smoothed in Standard Igbo without changing its scope. Footnote anchors are retained and placed directly after the terms they explain.
