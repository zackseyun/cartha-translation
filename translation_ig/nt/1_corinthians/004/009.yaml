review_pass:
  verdict: revise
  source_fidelity: The draft correctly renders the explanatory γάρ, the apostolic apposition, the public-exhibition imagery, and the threefold audience. However, “n’ọnọdụ ikpeazụ” makes ἐσχάτους sound chiefly like a spatial or rank position; in this context it is better rendered directly as God’s exhibiting the apostles “as the last.” “Ndị a mara ikpe ọnwụ” is understandable, but more idiomatic Igbo can retain the source’s broader sense of persons appointed for death without requiring a formal court sentence.
  naturalness: 'The revision uses idiomatic Standard Igbo constructions: “egosipụtala anyị, bụ ndịozi” for the apposition, “dị ka ndị ikpeazụ,” and “ihe ngosi nye ụwa, nye ndị mmụọ ozi na ụmụ mmadụ.” This also avoids the somewhat repetitive “n’ihu ... n’ihu ma.”'
  terminology: “Ndị mmụọ ozi” and “ụmụ mmadụ” accurately distinguish angels from human beings. “Ndị e debere ka ha nwụọ” expresses ἐπιθανατίους without adding a specific legal procedure; the footnote supplies the viable alternative of those sentenced to death and notes the likely public-arena imagery.
  issues:
  - severity: medium
    issue: “n’ọnọdụ ikpeazụ” for ἐσχάτους
    rationale: The Greek modifies the apostles as those exhibited last, rather than explicitly describing an abstract ‘last position.’ “dị ka ndị ikpeazụ” preserves the predicative force and rhetorical comparison more closely.
  - severity: low
    issue: “ndị a mara ikpe ọnwụ” is narrower and less idiomatic
    rationale: It can suggest a formal sentence of death, whereas ἐπιθανατίους denotes persons assigned or marked out for death. “ndị e debere ka ha nwụọ” is idiomatic and preserves the lexical breadth.
  - severity: low
    issue: Repeated “n’ihu” in the audience phrase
    rationale: The dative audience is more naturally expressed with “nye,” while retaining the sequence world, angels, and humans.
  revised_text: N’ihi na ọ dị m ka Chineke egosipụtala anyị, bụ ndịozi, dịka ndị ikpeazụ, dịka ndị e debere ka ha nwụọ[a], n’ihi na anyị aghọọla ihe ngosi nye ụwa, nye ndị mmụọ ozi na ụmụ mmadụ.[b]
