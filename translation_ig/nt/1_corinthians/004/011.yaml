  text: ἄχρι τῆς ἄρτι ὥρας καὶ πεινῶμεν καὶ διψῶμεν καὶ γυμνιτεύομεν καὶ κολαφιζόμεθα καὶ ἀστατοῦμεν
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/011.yaml
  text: Up to this present hour we are hungry and thirsty[a], and poorly clothed, and beaten[c][b], and homeless.
translation:
  language: ig
  text: Ruo n'oge a, agụụ na-agụ anyị, akpịrị na-akpọkwa anyị nkụ, anyị enweghị uwe zuru ezu, a na-eti anyị, anyị enweghịkwa ebe obibi na-adịgide adịgide.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “anyị na-awagharị,” ma ọ bụ, “anyị enweghị ebe obibi kwụsiri ike.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄχρι τῆς ἄρτι ὥρας
  choice: Ruo ugbu a
  rationale: Nke a bụ okwu oge pụtara ‘ruo n’oge a.’ Ọ bụ ụzọ Igbo dị mfe ma bụrụkwa nke e ji eme ihe ugbu a, nke na-edobe nkwusi ike dị na ἄρτι.
- source_word: πεινῶμεν
  choice: agụụ ka na-agụ anyị
  rationale: Okwu a na-egosi ọnọdụ na-aga n’ihu. ‘Ka na-agụ’ na-egosipụta na ahụhụ ahụ ka dị ruo ugbu a.
- source_word: διψῶμεν
  choice: akpịrị ka na-akpọkwa anyị nkụ
  rationale: Nke a bụ ụzọ Igbo nkịtị e si ekwu na mmiri na-agụ mmadụ, ma na-ejikọ nke ọma na ọnọdụ agụụ na-aga n’ihu.
- source_word: γυμνιτεύομεν
  choice: uwe anyị ezughị ezu
  rationale: Ngwaa Grik ahụ pụrụ ịpụta enweghị uwe zuru ezu, ọ bụghị naanị ịgba ọtọ kpamkpam. Nhọrọ a na-edobe obosara ihe ọ pụtara n’emeghị ka okwu ahụ sie ike karịa isi mmalite.
- source_word: κολαφιζόμεθα
  choice: a na-akụkwa anyị ihe
  rationale: Ọ bụ passive dị ugbu a nke na-egosi mmeso ahụ ugboro ugboro. Okwu Igbo a bụ nke mmadụ niile ga-aghọta, ọ naghịkwa amachi ụdị ihe e ji eti ha.
- source_word: ἀστατοῦμεν
  choice: anyị enweghịkwa ebe obibi na-adịgide adịgide
  rationale: Okwu ahụ na-egosi enweghị ebe mmadụ biri nke kwụsiri ike, ma nwee ike ịgụnye ịgagharị. Nhọrọ a na-edobe echiche ahụ n’enweghị ịmanye naanị otu nkọwa.
- source_word: καὶ ... καὶ ... καὶ ...
  choice: '..., ...kwa; ..., ...kwa, ...kwa'
  rationale: Mgbakwunye ‘-kwa’ ugboro ugboro na Igbo na-eburu usoro nchịkọta καί nke Grik, na-eme ka ndepụta ahụ nwee ike na ịdị arọ.
theological_decisions:
- issue: Ụdị nkọwa Pọl banyere ahụhụ ndị ozi
  choice: Ndepụta doro anya nke mkpa na mmeso ọjọọ ha ka na-ata
  alternative: Iwere ya dị ka okwu e mere ka ọ gabiga ókè karịsịa
  rationale: Ngwaa ndị dị ugbu a na-akọ ọnọdụ ndị a dị ka ihe na-aga n’ihu. Nsụgharị ahụ anaghị ebelata ahụhụ ahụ, ọ naghịkwa eme ka ọ ka njọ karịa ihe Grik kwuru.
translation_notes:
  register: Standard Igbo; asụsụ dị ugbu a, kwanyere ugwu, ma dị mfe nghọta. E ji ‘uwe anyị ezughị ezu’ zere ịkọwa γυμνιτεύομεν nanị dị ka ịgba ọtọ kpamkpam. A debere footnote marker [a] ozugbo n’isiokwu metụtara ya.
