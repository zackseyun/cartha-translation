  source_fidelity: 'Nsụgharị ahụ na-edobe nke ọma ndepụta ọnọdụ na-aga n’ihu dị na Grik: agụụ, akpịrị ịkpọ nkụ, enweghị uwe zuru ezu, iti ihe, na enweghị ebe obibi kwụsiri ike. Otú ọ dị, “a na-akụkwa anyị ihe” anaghị akọwapụta κολαφιζόμεθα n’ụzọ kacha doo anya; “a na-eti anyị” bụ okwu Igbo doro anya ma dabara n’ịta ahụhụ a na-eme ugboro ugboro. “Ruo n''oge a” na-anọchi ἄχρι τῆς ἄρτι ὥρας n’ụzọ ziri ezi karịa “Ruo ugbu a,” ebe ọ na-edobe ntụaka n’oge a kpọmkwem.'
  naturalness: “anyị enweghị uwe zuru ezu” dị nro ma bụrụ Igbo Standard nkịtị karịa “uwe anyị ezughị ezu” n’ebe a. Edegharị ndepụta ahụ site na rịkọm na mgbakwunye “-kwa” na-eme ka ọ gụọ nke ọma ma na-echekwa ike nchịkọta nke καί ugboro ugboro.
  terminology: A naghị etinye nkọwa ozizi ọ bụla. “Ebe obibi na-adịgide adịgide” na-egosipụta ἀστατοῦμεν n’enweghị ịmachi ya n’echiche nke enweghị ụlọ naanị. Footnote na-echekwa nhọrọ “ịwagharị.”
