  - severity: low
    issue: “Ruo ugbu a”
    rationale: Ọ bụ ntụgharị a pụrụ ịnabata, ma “Ruo n'oge a” na-edobe nke ọma echiche ὥρα—oge a kpọmkwem—ma na-ada n’Igbo n’ụzọ nkịtị.
