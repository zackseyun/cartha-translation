  rationale: 'E mezigharịrị okwu abụọ naanị maka ido anya na ịdị nkịtị n’Igbo: “Ruo n''oge a” maka ἄχρι τῆς ἄρτι ὥρας, na “a na-eti anyị” maka κολαφιζόμεθα. E dochiri “uwe anyị ezughị ezu” anya na “anyị enweghị uwe zuru ezu” iji gosipụta γυμνιτεύομεν n’ụzọ doro anya, na-enweghị ikwu na ha gba ọtọ kpamkpam. A debere ambiguity nke ἀστατοῦμεν n’azụ footnote.'
