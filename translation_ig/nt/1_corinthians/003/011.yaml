id: 1CO.3.11
reference: 1 Corinthians 3:11
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: θεμέλιον γὰρ ἄλλον οὐδεὶς δύναται θεῖναι παρὰ τὸν κείμενον, ὅς ἐστιν Ἰησοῦς Χριστός·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/011.yaml
  text: For no one can lay another foundation besides the one already laid[a], which is Jesus the Messiah.
translation:
  language: ig
  text: N’ihi na ọ dịghị onye pụrụ ịtọ ntọala ọzọ ma e wezụga nke a tọwororị, nke bụ Jizọs, bụ́ Mesaịa ahụ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ: “Jizọs Kraịst.”'
    reason: Na-enye ụdị nsụgharị ọdịnala nke Ἰησοῦς Χριστός, ebe isi ederede sụgharịrị Χριστός dị ka aha ọkwa “Mesaịa ahụ.”
lexical_decisions:
- source_word: θεμέλιον
  choice: ntọala
  rationale: “Ntọala” bụ okwu Igbo doro anya maka ihe e ji amalite ụlọ, ma kwekọọ n’ihe atụ Pọl ji gbasara iwu ụlọ.
- source_word: γὰρ
  choice: N’ihi na
  rationale: Ọ na-egosi na amaokwu a na-enye ihe kpatara okwu bu ya ụzọ.
- source_word: ἄλλον
  choice: ọzọ
  rationale: Ọ na-egosi ntọala ọzọ ma ọ bụ nke dị iche na nke dịlarị.
- source_word: οὐδεὶς δύναται θεῖναι
  choice: ọ dịghị onye pụrụ ịtọ
  rationale: Nkebi a na-egosipụta n'ụzọ Igbo nkịtị na ọ dịghị onye nwere ike ịtọ ntọala ọzọ.
- source_word: παρὰ τὸν κείμενον
  choice: ma e wezụga nke a tọwororị
  rationale: “Ma e wezụga” na-echekwa ike nke mwepụ dị na παρά, ebe “a tọwororị” na-egosi na ntọala ahụ adịlarị n’ọnọdụ ya.
- source_word: ὅς ἐστιν
  choice: nke bụ
  rationale: Ọ na-ejikọta onye a kpọrọ aha na “ntọala” ahụ n’enweghị ịgbakwunye nkọwa na-adịghị na Grik.
- source_word: Ἰησοῦς Χριστός
  choice: Jizọs, bụ́ Mesaịa ahụ
  rationale: A sụgharịrị Χριστός dị ka aha ọkwa “Mesaịa ahụ,” ebe “Jizọs” ka bụ aha onye ahụ; usoro a bụkwa Igbo dị ùgwù ma doo anya.
theological_decisions:
- issue: Otú e si sụgharịa Χριστός n’aha Ἰησοῦς Χριστός
  choice: Jizọs, bụ́ Mesaịa ahụ
  alternative: Jizọs Kraịst
  rationale: Χριστός nwere ike ịbụ aha ọkwa pụtara Onye E Tere Mmanụ, ya bụ Mesaịa. Isi ederede na-egosipụta ihe aha ọkwa ahụ pụtara, ebe e debere ụdị ọdịnala “Jizọs Kraịst” n’ala peeji.
- issue: Njirimara nke ntọala ahụ
  choice: nke bụ Jizọs
  alternative: ntọala ahụ na-anọchi anya Jizọs
  rationale: Grik ji okwu njirimara kpọmkwem, ὅς ἐστιν, ya mere nsụgharị ahụ ekwesịghị ime ka ọ bụrụ naanị ihe nnọchianya ma ọ bụ kọwaa ya karịa ka ederede si kwuo.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị mfe nghọta ma dị ùgwù. “Ntọala” na “ịtọ” na-echekwa otu ihe atụ iwu ụlọ ahụ. E tinyere akara ala peeji [a] ozugbo n’ebe okwu ọzọ ọ na-akọwa dị.
