id: 1CO.3.4
reference: 1 Corinthians 3:4
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὅταν γὰρ λέγῃ τις· Ἐγὼ μέν εἰμι Παύλου, ἕτερος δέ· Ἐγὼ Ἀπολλῶ, ⸂οὐκ ἄνθρωποί⸃ ἐστε;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/004.yaml
  text: For whenever someone says[a], “I am of Paul,” and another, “I am of Apollos,” are you not merely human?
translation:
  language: ig
  text: N’ihi na mgbe ọ bụla otu onye kwuru, “Abụ m onye Pọl,” onye ọzọ ekwuo, “Abụ m onye Apọlọs,” ọ bụ na unu abụghị mmadụ nkịtị[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ọ bụ na unu abụghị naanị mmadụ?” Ma ọ bụ, “ọ bụ na unu anaghị akpa àgwà ka mmadụ nkịtị?”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν
  choice: mgbe ọ bụla
  rationale: Ọ na-egosi ọnọdụ na-eme ugboro ugboro ma ọ bụ mgbe ọ bụla ihe a kpọrọ aha mere, ọ bụghị naanị otu oge.
- source_word: γὰρ
  choice: N’ihi na
  rationale: Ọ na-ejikọta amaokwu a na nkọwa Pọl gara aga dị ka ihe na-akwado arụmụka ya.
- source_word: λέγῃ τις
  choice: otu onye kwuru
  rationale: Nke a bụ ụzọ Igbo si egosipụta onye ọ bụla a na-akọwaghị aha ya n’ọnọdụ a; usoro ngwaa sochirinụ na-egosi ọnọdụ a na-eme mgbe ọ bụla.
- source_word: Ἐγὼ μέν εἰμι Παύλου
  choice: Abụ m onye Pọl
  rationale: “Onye Pọl” na-egosi onye kwụ n’akụkụ Pọl ma ọ bụ onye na-ewere onwe ya dị ka nke òtù ya, ma ọ naghị akọwa njikọ ahụ karịa ihe genitive Grik kwuru.
- source_word: ἕτερος δέ
  choice: onye ọzọ ekwuo
  rationale: Ọ na-egosi ọdịiche dị n’etiti okwu onye mbụ na nke onye ọzọ, n’ụzọ na-asụ ụtọ n’Igbo.
- source_word: Ἐγὼ Ἀπολλῶ
  choice: Abụ m onye Apọlọs
  rationale: E tinyere echiche ngwaa e hapụrụ n’ahịrị Grik iji mee ka njikọ ya na okwu bu ụzọ doo anya, ma debe usoro okwu abụọ ahụ ka ha yie ibe ha.
- source_word: οὐκ ἄνθρωποί ἐστε;
  choice: ọ bụ na unu abụghị mmadụ nkịtị?
  rationale: Ajụjụ a na-ata ndị Kọrịnt mba n’ihi na nkewa ha na-egosi echiche na omume mmadụ nkịtị. “Mmadụ nkịtị” na-ebute ike okwu ahụ n’Igbo n’etinyeghị ozizi ọzọ.
theological_decisions:
- issue: Ma okwu ἄνθρωποι ọ na-akọwa ihe ha bụ ka ọ bụ otú ha si akpa àgwà
  choice: ọ bụ na unu abụghị mmadụ nkịtị?
  alternative: ọ bụ na unu anaghị akpa àgwà ka mmadụ nkịtị?
  rationale: Isi ederede debere ụdị ajụjụ Grik nke ji ngwaa “ịbụ,” ebe ndetu ala peeji na-echekwa nghọta gbasara omume ha n’ebughị ụzọ kpebie na ọ bụ naanị ya ka Pọl pụtara.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. “Onye Pọl” na “onye Apọlọs” na-egosi ịrapara n’otu onye dịka onye ndu, ebe a zere okwu ga-eme ka njikọ ahụ bụrụ ihe onwunwe nkịtị.
