id: 1CO.3.3
reference: 1 Corinthians 3:3
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἔτι γὰρ σαρκικοί ἐστε. ὅπου γὰρ ἐν ὑμῖν ζῆλος καὶ ⸀ἔρις, οὐχὶ σαρκικοί ἐστε καὶ κατὰ ἄνθρωπον περιπατεῖτε;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/003.yaml
  text: For you are still fleshly. For where there is jealousy and strife among you[a], are you not fleshly and walking according to man?
translation:
  language: ig
  text: N’ihi na unu ka bụ ndị nke anụ ahụ. N’ihi na ebe ekworo na esemokwu dị n’etiti unu, ọ̀ bụghị na unu bụ ndị nke anụ ahụ, na na-eje ije n’ụzọ mmadụ[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “na-ebi ndụ nanị n’ụzọ mmadụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔτι
  choice: ka bụ
  rationale: Ọ na-egosi na ọnọdụ ahụ ka na-aga n’ihu, ma na-eme ka ịba mba Pọl doo anya n’Igbo nkịtị.
- source_word: γὰρ
  choice: N’ihi na
  rationale: Ọ na-edobe ọrụ nkọwa nke mkpụrụokwu ahụ n’ebe abụọ ahụ n’arụmụka Pọl.
- source_word: σαρκικοί
  choice: ndị anụ ahụ
  rationale: Ọ na-edobe njikọ okwu ahụ na σάρξ, ‘anụ ahụ,’ kama ịkọwa ya ozugbo dịka ‘ndị mmehie’ ma ọ bụ itinye nkọwa ozizi sara mbara n’ime amaokwu ahụ.
- source_word: ὅπου
  choice: ebe
  rationale: 'Ọ na-echekwa nghọta mbụ nke ebe: ọnụnọ ekworo na esemokwu n’etiti ha na-egosi ọnọdụ Pọl na-ekwu maka ya.'
- source_word: ζῆλος
  choice: ekworo
  rationale: N’ọnọdụ ọjọọ a, okwu ahụ pụtara ekworo, ọ bụghị ịnụ ọkụ n’obi dị mma.
- source_word: ἔρις
  choice: esemokwu
  rationale: Ọ bụ okwu Igbo doro anya nke na-ekpuchi mgbagha, ịrụrịta ụka, na enweghị udo n’etiti mmadụ.
- source_word: οὐχὶ
  choice: ọ̀ bụghị ... ka unu bụ
  rationale: Ọ na-edobe ajụjụ nkwupụta nke na-atụ anya azịza nkwenye.
- source_word: κατὰ ἄνθρωπον
  choice: dịka mmadụ
  rationale: Ọ na-echekwa otu onye dị na Grik na esemokwu dị n’etiti omume mmadụ nkịtị na ndụ Mmụọ na-achị; nkọwa ọzọ dị mfe nghọta dị n’ala peeji.
- source_word: περιπατεῖτε
  choice: na-ejekwa ije
  rationale: Ọ na-edobe ihe atụ Pọl ji ‘ije ije’ kọwaa ụzọ mmadụ si ebi ndụ, kama ime ka ọ bụrụ naanị ‘ibi ndụ.’
theological_decisions:
- issue: Ịsụgharị okwu metụtara σάρξ dị na σαρκικοί
  choice: ndị anụ ahụ
  alternative: ndị nke ụwa; ndị mmehie
  rationale: Nhọrọ a na-echekwa ihe atụ ‘anụ ahụ’ na esemokwu Pọl na-eweta, n’etinyeghị nkọwa pụrụ iche dịka ‘ọdịdị mmehie’ nke okwu ahụ ekwughị kpọmkwem.
- issue: Ịsụgharị κατὰ ἄνθρωπον
  choice: dịka mmadụ
  alternative: na-ebi ndụ nanị n’ụzọ mmadụ
  rationale: Isi ederede na-edobe ọdịdị na nghọta sara mbara nke Grik; ala peeji na-enye ụzọ Igbo doro anya karị n’ebughị ụzọ mechie esemokwu echiche dị na ya.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ugwu ma dị mfe nghọta, dee ya. E debere nkwughachi ‘N’ihi na’ na ihe atụ ‘ije ije’ iji chekwaa usoro arụmụka na onyonyo nke Grik; akara ụda dị na ‘ọ̀’ na-eme ka ajụjụ nkwupụta ahụ doo anya.
