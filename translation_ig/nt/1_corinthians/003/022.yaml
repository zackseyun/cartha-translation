  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἴτε Παῦλος εἴτε Ἀπολλῶς εἴτε Κηφᾶς εἴτε κόσμος εἴτε ζωὴ εἴτε θάνατος εἴτε ἐνεστῶτα εἴτε μέλλοντα, πάντα ⸀ὑμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/022.yaml
  text: whether Paul or Apollos or Cephas or the world or life or death or things present or things to come—all are yours,
translation:
  language: ig
  text: ma ọ bụ Pọl, ma ọ bụ Apọlọs, ma ọ bụ Kefa, ma ọ bụ ụwa, ma ọ bụ ndụ, ma ọ bụ ọnwụ, ma ọ bụ ihe ndị dị ugbu a, ma ọ bụ ihe ndị ga-abịa—ha niile bụ nke unu,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἴτε … εἴτε
  choice: ma ọ bụ … ma ọ bụ
  rationale: Nkwughachi a na-edepụta ihe dị iche iche n’usoro ma na-echekwa ụda nkwuwa okwu nke Grik n’Igbo nkịtị.
- source_word: Παῦλος
  choice: Pọl
  rationale: Nke a bụ ide aha onye ahụ n’ụdị a na-ejikarị eme ihe n’Igbo.
- source_word: Ἀπολλῶς
  choice: Apọlọs
  rationale: A sụgharịghị aha ahụ; e dere ya n’ụdị dabara n’usoro ụda na mkpụrụedemede Igbo.
- source_word: Κηφᾶς
  choice: Kefa
  rationale: E chekwara aha Semitik nke Grik ji mee ihe kama iji aha ya na ya hà, bụ Pita, dochie ya.
- source_word: κόσμος
  choice: ụwa
  rationale: “Ụwa” bụ okwu Igbo doro anya nke nwere ike ịgụnye mbara ụwa na usoro ihe e kere eke dịka okwu ahụ si arụ ọrụ n’ebe a.
- source_word: ζωή
  choice: ndụ
  rationale: Nke a bụ nsụgharị kpọmkwem na nke ebumpụta ụwa n’Igbo.
- source_word: θάνατος
  choice: ọnwụ
  rationale: Nke a bụ okwu Igbo kpọmkwem maka ihe Grik ahụ pụtara.
- source_word: ἐνεστῶτα
  choice: ihe ndị dị ugbu a
  rationale: Aha e mere site na participle a na-ezo aka n’ihe ndị dị n’oge ugbu a; nsụgharị a doro onye na-agụ Igbo anya.
- source_word: μέλλοντα
  choice: ihe ndị ga-abịa
  rationale: Aha e mere site na participle a na-ezo aka n’ihe ndị dị n’ọdịnihu, ma na-adabara nkebi “ihe ndị dị ugbu a.”
- source_word: πάντα
  choice: ha niile
  rationale: “Ha niile” na-achịkọta ndị mmadụ na ihe niile e depụtara, ma na-echekwa ike okwu nchịkọta ahụ.
- source_word: ὑμῶν
  choice: bụ nke unu
  rationale: Genitive a na-egosi inwe ihe; “bụ nke unu” bụ ụzọ Igbo doro anya si kwuo na ihe ndị ahụ niile bụ nke ndị a na-agwa okwu.
theological_decisions:
- issue: Ókè ihe okwu πάντα ὑμῶν pụtara
  choice: ha niile bụ nke unu
  alternative: ihe niile na-ejere unu ozi
  rationale: Isi mmalite kwuru naanị mmekọrịta nke inwe ihe ma ọ bụ ịbụ nke mmadụ; a gbakwụnyeghị nkọwa gbasara otú ihe ndị ahụ si bụrụ nke ha, ka e wee chekwaa mkpirikpi okwu na nrụgide nkà mmụta okpukpe nke amaokwu ahụ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị mfe ma dị ùgwù mee ihe. A hapụrụ amaokwu a dịka akụkụ ahịrịokwu na-aga n’ihu, ya mere e debere rikoma n’ọgwụgwụ dịka isi mmalite na ederede ntụaka si gosi.
