  text: ⸀Τί οὖν ἐστιν ⸂Ἀπολλῶς; τί δέ ἐστιν Παῦλος⸃; ⸀διάκονοι δι’ ὧν ἐπιστεύσατε, καὶ ἑκάστῳ ὡς ὁ κύριος ἔδωκεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/005.yaml
  text: What then is Apollos? And what is Paul? Servants through whom you believed[c][b][a], as the Lord gave to each one.
translation:
  language: ig
  text: Gịnịzi ka Apọlọs bụ? Gịnịkwa ka Pọl bụ?[a] Ha bụ ndị na-eje ozi[b] ndị unu si n’aka ha kwere ekwe, dịka Onyenwe anyị nyere onye nke ọ bụla.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “Ònyezi bụ Apọlọs? Ònyekwa bụ Pọl?” Ma asụsụ Grik ji “gịnị,” na-elekwasị anya n’ọrụ ha karịa n’onye ha bụ.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, “ndị ozi.” Okwu Grik a pụtara ndị na-eje ozi ma ọ bụ ndị na-arụ ọrụ; ọ pụtaghị ọkwa diakọn n’ọgbakọ.
    reason: lexical_alternative
  - marker: c
    text: N’asụsụ Grik, ahịrịokwu a ekwughị ihe Onyenwe anyị nyere. A pụkwara ịsụgharị ya, “dịka Onyenwe anyị kenyere onye nke ọ bụla.”
    reason: alternative_reading
lexical_decisions:
- source_word: Τί
  choice: Gịnị ... ka ... bụ?
  rationale: A na-edobe ajụjụ ahụ n’ụdị ‘gịnị’ kama ‘onye’ iji mee ka uche dị n’ọrụ ma ọ bụ ọnọdụ Apọlọs na Pọl, ọ bụghị n’aha onye ha bụ.
- source_word: οὖν
  choice: -zi
  rationale: Mgbakwunye ‘-zi’ na-egosi ntụgharị echiche na nkwubi okwu n’ụzọ Igbo dị nkenke ma dịkwa eke.
- source_word: δέ
  choice: -kwa
  rationale: ‘-kwa’ na-ejikọta ajụjụ nke abụọ na nke mbụ ma na-egosipụta obere ntụnyere dị n’etiti Apọlọs na Pọl.
- source_word: διάκονοι
  choice: ndị na-eje ozi
  rationale: Nke a na-egosi ndị ọrụ ma ọ bụ ndị na-ejere ozi, n’ebughị ụzọ mee ka okwu ahụ bụrụ aha ọkwa pụrụ iche n’ọgbakọ.
- source_word: δι’ ὧν
  choice: ndị unu si n’aka ha
  rationale: Akpaalaokwu a na-egosi na ha bụ ụzọ ma ọ bụ ndị ọrụ e sitere n’aka ha nweta nzaghachi nke okwukwe.
- source_word: ἐπιστεύσατε
  choice: unu ... kwere ekwe
  rationale: ‘Kwere ekwe’ na-enye ihe omume nke ikwere n’ụzọ doro anya, na-etinyeghị nkọwa ọzọ na-adịghị n’isi mmalite.
- source_word: καὶ ἑκάστῳ ὡς ὁ κύριος ἔδωκεν
  choice: dịka Onyenwe anyị nyere onye nke ọ bụla
  rationale: A hapụrụ ihe e nyere n’ekwughị ya, dịka e mere n’asụsụ Grik, kama ịgbakwunye ‘ọrụ,’ ‘oke,’ ma ọ bụ ‘onyinye.’
- source_word: κύριος
  choice: Onyenwe anyị
  rationale: Nke a bụ okwu Igbo a na-ejikarị asụgharị κύριος n’ụdị nsọpụrụ, ma isi ederede akọwaghị onye a na-ekwu maka ya karịa ka Grik mere.
theological_decisions:
- issue: Onye okwu ‘Onyenwe anyị’ (κύριος) na-ezo aka na ya
  choice: Isi ederede hapụrụ ya dịka ‘Onyenwe anyị,’ nke dabara n’echiche na ọ bụ Onyenwe anyị Jizọs na-enye onye ọrụ nke ọ bụla ihe o kwesịrị.
  alternative: O nwere ike ịbụ ntụaka sara mbara nye Chineke.
  rationale: Ọnọdụ okwu Pọl na-akwado ntụaka nye Kraịst dịka Onyenwe anyị, ma ịkpọ aha Jizọs kpọmkwem n’isi ederede ga-akọwapụta ihe Grik hapụrụ n’aha κύριος.
- issue: Okwu e hapụrụ n’ahịrị ‘dịka Onyenwe anyị nyere’
  choice: A naghị agbakwunye ihe e nyere n’isi ederede.
  alternative: ‘dịka Onyenwe anyị kenyere onye nke ọ bụla ọrụ’ ma ọ bụ ‘dịka Onyenwe anyị nyere onye nke ọ bụla oke ya.’
  rationale: Grik ekwughị ihe e nyere; idebe oghere ahụ na-echekwa mgbagwoju anya na esemokwu echiche dị n’isi mmalite.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị nsọpụrụ ma dị mfe nghọta. A họọrọ ‘ndị na-eje ozi’ kama okwu nwere ike ịpụta ọkwa ụka pụrụ iche. A hapụrụ njedebe ahịrịokwu ahụ nkenke iji chekwaa ellipsis dị na Grik.
