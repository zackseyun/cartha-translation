id: 1CO.3.7
reference: 1 Corinthians 3:7
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὥστε οὔτε ὁ φυτεύων ἐστίν τι οὔτε ὁ ποτίζων, ἀλλ’ ὁ αὐξάνων θεός.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/007.yaml
  text: So neither the one planting is anything[a], nor the one watering, but God who causes the growth.
translation:
  language: ig
  text: Ya mere, onye na-akụ ihe abụghị ihe ọ bụla, onye na-agba ya mmiri abụghịkwa ihe ọ bụla, kama ọ bụ Chineke na-eme ka o too.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὥστε
  choice: Ya mere
  rationale: Na-egosi nkwubi okwu sitere n'okwu ndị bu ụzọ n'ụzọ doro anya ma bụrụkwa Igbo a na-asụ ugbu a.
- source_word: ὁ φυτεύων
  choice: onye na-akụ ihe
  rationale: Na-echekwa ụdị participle e ji mee aha onye ahụ na omume ịkụ ihe, ma na-ada nke ọma n'Igbo.
- source_word: ἐστίν τι
  choice: ka e ji ihe
  rationale: Nke a bụ ụzọ Igbo si egosipụta na onye ahụ abụghị ihe dị mkpa n'onwe ya; ọ na-ezere nsụgharị okwu n'okwu nke ga-ada ka a na-ekwu na onye ahụ adịghị adị.
- source_word: ὁ ποτίζων
  choice: onye na-agba ya mmiri
  rationale: Na-eme ka ntụnyere ya na onye na-akụ ihe guzozie, ebe nnọchiaha ‘ya’ na-ezo aka n'ihe a kụrụ.
- source_word: ἀλλ’
  choice: kama
  rationale: Na-egosipụta nnukwu ọdịiche dị n'etiti ndị ọrụ mmadụ na Chineke.
- source_word: ὁ αὐξάνων
  choice: onye na-eme ka o too
  rationale: Na-egosi na Chineke bụ onye na-akpata uto ahụ, ma ọ naghị etinye ihe ọzọ Grik na-ekwughị.
- source_word: θεός
  choice: Chineke
  rationale: Na-edobe aha Chineke n'ụzọ pụtara ìhè dị ka isi ihe e ji mechie ọdịiche ahụ.
theological_decisions:
- issue: Uru ndị ọrụ mmadụ na ọrụ Chineke
  choice: ‘ọ bụghị ... ka e ji ihe ... kama ọ bụ Chineke’
  alternative: ‘onye na-akụ ihe na onye na-agba mmiri abụghị ihe ọ bụla’
  rationale: Nhọrọ a na-echekwa ike okwu Pọl banyere na ọ bụ Chineke na-enye uto, n'agbanyeghị na ọ bụghị ịgọnahụ ịdị adị ma ọ bụ ọrụ ndị ọrụ mmadụ kpamkpam.
translation_notes:
  register: Igbo Izugbe dị ugbu a, dị ùgwù ma dị mfe nghọta. E debere usoro ntụnyere nke onye na-akụ ihe, onye na-agba mmiri, na Chineke; a họọrọ akpaalaokwu Igbo ‘ka e ji ihe’ iji zipụta ἐστίν τι n'ụzọ eke.
