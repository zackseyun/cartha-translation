id: 1CO.3.2
reference: 1 Corinthians 3:2
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: γάλα ὑμᾶς ἐπότισα, ⸀οὐ βρῶμα, οὔπω γὰρ ἐδύνασθε. ἀλλ’ ⸀οὐδὲ ἔτι νῦν δύνασθε,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/002.yaml
  text: I fed you milk[a], not solid food, for you were not yet able. But even now you are still not able[b],
translation:
  language: ig
  text: Enyere m unu mmiri ara ka unu ṅụọ[a], ọ bụghị nri, n’ihi na unu enwebeghị ike. Ma ọbụna ugbu a, unu ka enweghị ike[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'N’ụzọ nkịtị: “Enyere m unu mmiri ara ka unu ṅụọ.”'
    reason: lexical_alternative
  - marker: b
    text: “Nri” bụ okwu izugbe maka ihe a na-eri. N’ihi ọdịiche ya na mmiri ara, ọ pụrụ ịpụta nri ka ukwuu n’ihe atụ a.
    reason: lexical_alternative
lexical_decisions:
- source_word: γάλα
  choice: mmiri ara
  rationale: Nke a bụ okwu Igbo a na-ejikarị akọwa milk; ọ na-edobe ihe atụ Pọl ji tụnyere ya na nri.
- source_word: ἐπότισα
  choice: Enyere m unu ... ka unu ṅụọ
  rationale: Ngwaa Grik pụtara n'ụzọ kpọmkwem ‘inye mmadụ ihe ọṅụṅụ’; ntụgharị a bụ Igbo doro anya ma na-edobe ihe ọṅụṅụ ahụ dịka mmiri ara.
- source_word: βρῶμα
  choice: nri
  rationale: Okwu Grik pụtara nri n’ozuzu, ọ bụghị naanị anụ ma ọ bụ kpọmkwem nri siri ike. Ọdịiche dị n’etiti mmiri ara na nri na-eme ka ihe atụ ahụ doo anya n’Igbo.
- source_word: οὔπω
  choice: enwebeghị
  rationale: Ọ na-egosi na ruo n’oge ahụ ikike ahụ abịabeghị; ụdị a bụ Igbo eke maka ‘not yet’ n’ahịrịokwu a.
- source_word: ἐδύνασθε
  choice: unu ... enweghị ike
  rationale: Ọ na-egosi ikike ma ọ bụ ikike ịnagide ihe ahụ, na-enweghị itinye nkọwa ọzọ n’ihe atụ ahụ.
- source_word: οὐδὲ ἔτι νῦν
  choice: Ma ọbụna ugbu a, unu ka enweghị
  rationale: ‘Ọbụna ugbu a’ na ‘ka’ jikọtara ọnụ na-egosi ma oge dị ugbu a ma ọnọdụ nke ka na-aga n’ihu.
- source_word: δύνασθε
  choice: unu ... enweghị ike
  rationale: Ọ na-edobe echiche nke ikike ugbu a ma na-emegharị ahịrịokwu nke mbụ n’ụzọ kwekọrọ ekwekọ.
theological_decisions:
- issue: Nkọwa ihe atụ Pọl banyere mmiri ara na nri
  choice: Idobe ihe atụ ahụ n’onwe ya n’enweghị ịkọwa ya dịka ozizi ndị bụ isi na ozizi ndị miri emi.
  alternative: Ịsụgharị ya n'ụzọ nkọwa dịka ‘Akụziri m unu naanị ihe ndị bụ isi.’
  rationale: Grik na-eji ihe atụ, ọ naghị akọwapụta kpọmkwem ụdị nkuzi ọ bụla. Idobe ya na-echekwa obosara na esemokwu nkà mmụta okpukpe dị n’amaokwu ahụ.
translation_notes:
  register: Standard Igbo dị ugbu a, dị nsọ ma dị mfe nghọta. E ji ‘mmiri ara’ na ‘nri’ debe ihe atụ mbụ; e zere ‘anụ’ n’ihi na βρῶμα abụghị naanị anụ. Akara ụkwụ [a] na [b] dị n’ederede isi.
