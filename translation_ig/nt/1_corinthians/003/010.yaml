review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys God’s grace given to Paul, Paul’s laying of a foundation, another worker’s subsequent building, and the imperative that each worker exercise care. The implicit object of ἐποικοδομεῖ is legitimately made explicit in Igbo as the foundation.
  naturalness: Several expressions are understandable but less idiomatic or precise in Standard Igbo. “Dị ka … si dị” is better formed as “Dị ka … siri dị”; “onyeisi na-ewu ụlọ” can suggest a foreman who personally builds houses rather than a master craftsman directing construction; and “ewukwasị n’elu ya” is clearer and more natural for building upon a foundation.
  terminology: “Amara,” “ntọala,” and “lezie anya” are appropriate, clear, and maintain the passage’s established theological and construction imagery. “Onyeisi omenkà maara ihe n’ọrụ owuwu” better represents σοφὸς ἀρχιτέκτων without reducing the term to a modern building designer.
  issues:
  - severity: medium
    issue: The rendering of ἀρχιτέκτων is potentially imprecise.
    rationale: “Onyeisi na-ewu ụlọ” may be read chiefly as a construction foreman or one who builds a house. The Greek denotes a leading/master craftsperson responsible for construction, so “onyeisi omenkà … n’ọrụ owuwu” is more faithful.
  - severity: low
    issue: Relative-clause form and building idiom need smoothing.
    rationale: “Dị ka amara Chineke nke e nyere m si dị” is more naturally “Dị ka amara Chineke e nyere m siri dị.” Adding “n’elu” with ewukwasị makes the building-on-foundation image explicit and idiomatic in Igbo.
  revised_text: Dị ka amara Chineke e nyere m siri dị, dịka onyeisi omenkà maara ihe n’ọrụ owuwu[a], atọrọ m ntọala, onye ọzọ na-ewukwasị n’elu ya. Ma ka onye ọ bụla lezie anya n’otú o si ewukwasị n’elu ntọala ahụ.
  revised_footnotes:
