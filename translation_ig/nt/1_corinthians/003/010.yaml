id: 1CO.3.10
reference: 1 Corinthians 3:10
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Κατὰ τὴν χάριν τοῦ θεοῦ τὴν δοθεῖσάν μοι ὡς σοφὸς ἀρχιτέκτων θεμέλιον ⸀ἔθηκα, ἄλλος δὲ ἐποικοδομεῖ. ἕκαστος δὲ βλεπέτω πῶς ἐποικοδομεῖ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/010.yaml
  text: According to the grace of God given to me[a], like a wise master builder I laid a foundation, and another builds on it[c][b]. But let each one be careful how he builds.
translation:
  language: ig
  text: Dị ka amara Chineke e nyere m siri dị, dịka onyeisi omenkà maara ihe n’ọrụ owuwu[a], atọrọ m ntọala, onye ọzọ na-ewukwasị n’elu ya. Ma ka onye ọ bụla lezie anya n’otú o si ewukwasị n’elu ntọala ahụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ọkà n’ịrụ ụlọ.” Okwu Grik ahụ na-ezo aka n’onyeisi omenkà na-ahụ maka ọrụ owuwu, ọ bụghị naanị onye na-ese atụmatụ ụlọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Κατὰ
  choice: Dị ka ... si dị
  rationale: Ọ na-egosi na ọrụ Pọl kwekọrọ n’amara e nyere ya, ọ bụghị naanị na amara ahụ bụ ngwá ọrụ o ji rụọ ọrụ.
- source_word: χάριν
  choice: amara
  rationale: “Amara” bụ okwu Igbo a na-ejikarị akọwa ihu ọma na ike Chineke na-enye n’efu; ọ na-echekwa ịdị arọ nke okwu ahụ n’ozizi Pọl.
- source_word: σοφὸς ἀρχιτέκτων
  choice: onyeisi na-ewu ụlọ nke maara ihe
  rationale: N’oge ahụ, ἀρχιτέκτων bụ onyeisi omenkà na-elekọta ọrụ owuwu, ọ bụghị naanị onye na-ese atụmatụ ụlọ. Nsụgharị a na-egosi ma ọkwa ya ma amamihe ya.
- source_word: θεμέλιον ἔθηκα
  choice: atọrọ m ntọala
  rationale: N’Igbo, “ịtọ ntọala” bụ ụzọ ebumpụta ụwa e si akọwa idobe ntọala ụlọ.
- source_word: ἐποικοδομεῖ
  choice: ana-ewukwasịkwa ya
  rationale: Ngwaa ahụ pụtara iwu ihe n’elu ntọala e torola; “ya” na-ezo anya n’ntọala ahụ.
- source_word: ἕκαστος δὲ βλεπέτω πῶς ἐποικοδομεῖ
  choice: Ma onye ọ bụla lezie anya n’otú o si ewukwasị ya
  rationale: “Lezie anya” na-enye iwu ịmụrụ anya na ịkpachara anya, ebe “onye ọ bụla” na-egosi na okwu ahụ metụtara onye ọrụ ọ bụla n’otu n’otu.
theological_decisions:
- issue: Amara dị ka ihe e nyere Pọl maka ọrụ ya
  choice: “amara Chineke nke e nyere m”
  alternative: “ihu ọma Chineke e nyere m”
  rationale: “Amara” na-echekwa ma ihu ọma Chineke na enyemaka o nyere Pọl, n’ebughị ụzọ kpebie na okwu ahụ pụtara naanị otu n’ime ha.
- issue: Ma ἕκαστος ọ na-ekwu naanị banyere ụmụ nwoke
  choice: “onye ọ bụla”
  alternative: “nwoke ọ bụla”
  rationale: Ụdị okwu Grik ahụ bụ otu onye nke ọdịdị nwoke, ma ebe a ọ na-anọchi anya onye ọrụ ọ bụla; Igbo “onye ọ bụla” na-echekwa obosara ahụ n’enweghị ịgbakwunye oke gbasara okike.
- issue: Ihe a na-ewukwasị na nkeji ikpeazụ
  choice: Kwughachi “ya,” nke na-ezo aka na ntọala
  alternative: Hapụ ihe a na-ewukwasị n’ekwughị ya, dịka Grik si mee
  rationale: Grik hapụrụ ihe ngwaa ahụ metụtara ka a ghọta ya site n’ahịrịokwu gara aga. N’Igbo, “ewukwasị ya” doro anya ma dịkwa ebumpụta ụwa, n’agbanyeghị na “ya” bụ ihe e mere ka ọ pụta ìhè.
translation_notes:
  register: E ji Igbo Izugbe dị ugbu a, nke dị nsọ ma dị mfe nghọta. “Ịtọ ntọala” na “iwukwasị ya” na-edobe ihe atụ owuwu ụlọ nke dị n’asụsụ Grik. E tinyere naanị otu nkọwa ala peeji maka ἀρχιτέκτων, ebe ọdịiche dị n’etiti onye na-ese atụmatụ na onyeisi na-elekọta owuwu nwere ike ime ka onye na-agụ ya ghọtahie.
