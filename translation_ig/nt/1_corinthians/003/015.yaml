    text: A pụkwara ịsụgharị ya, “ma naanị dị ka onye gafere n’ọkụ,” ma ọ bụ, “ma dị ka onye gbapụrụ n’ọkụ.”
    reason: lexical_alternative
  revision_rationale: The revised wording directly conveys the loss denoted by ζημιωθήσεται, maintains the emphatic distinction between the work and the person, and renders the final metaphor in natural Standard Igbo. The footnote offers the more restrictive and escape-oriented alternatives without selecting either as the meaning of the main text.
