source:
  edition: SBLGNT
  text: εἴ τινος τὸ ἔργον κατακαήσεται, ζημιωθήσεται, αὐτὸς δὲ σωθήσεται, οὕτως δὲ ὡς διὰ πυρός.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/015.yaml
  text: If anyone’s work is burned up[a], he will suffer loss, but he himself will be saved—yet as through fire.
translation:
  language: ig
  text: Ọ bụrụ na ọrụ onye ọ bụla ere ọkụ laa n’iyi, ọ ga-enwe mfu; ma a ga-azọpụta ya onwe ya, ma ọ dị ka onye gafere n’ọkụ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ma naanị dị ka onye gafere n’ọkụ,” ma ọ bụ, “ma dị ka onye gbapụrụ n’ọkụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴ τινος
  choice: Ọ bụrụ na ... onye ọ bụla
  rationale: Nke a na-egosi ọnọdụ nwere ike ime ma na-edobe echiche onye ọ bụla a na-ekwu maka ya.
- source_word: τὸ ἔργον
  choice: ọrụ
  rationale: “Ọrụ” bụ okwu sara mbara nke dabara n’ihe onye ahụ rụrụ, ma na-ejikọkwa ya na ihe atụ iwu ụlọ dị n’okwu ndị gbara amaokwu a gburugburu.
- source_word: κατακαήσεται
  choice: a gbaa ... ọkụ laa n’iyi
  rationale: Nkebiokwu a na-egosi na ọkụ eripịala ihe ahụ kpamkpam, ọ bụghị nanị na o metụrụ ya ọkụ.
- source_word: ζημιωθήσεται
  choice: ọ ga-ata ahụhụ n’ihi ihe funahụrụ ya
  rationale: Nke a na-egosi mfu onye ahụ ga-enweta n’etinyeghị nkọwa na mfu ahụ bụ ntaramahụhụ ma ọ bụ ụgwọ ọrụ a napụrụ ya.
- source_word: αὐτὸς δὲ σωθήσεται
  choice: ma a ga-azọpụta ya onwe ya
  rationale: “Ya onwe ya” na-edobe nkwusi ike na ọdịiche dị n’etiti ọrụ ahụ lara n’iyi na onye ahụ a ga-azọpụta.
- source_word: οὕτως δὲ ὡς διὰ πυρός
  choice: ma ọ ga-adị ka onye si n’ọkụ gafee
  rationale: Nke a na-edobe ihe atụ ọkụ na echiche nke ịgafe n’ọkụ, na-akọwaghị kpọmkwem ma ọ bụ mgbapụ tara akpụ ma ọ bụ ụdị ọzọ nke ihe atụ.
theological_decisions:
- issue: Ma a ga-akọwa okwu ikpeazụ dịka ọkụ na-eme ka mmadụ dị ọcha, ma ọ bụ naanị dịka mgbapụ tara akpụ.
  choice: E debere ya dịka “ọ ga-adị ka onye si n’ọkụ gafee.”
  alternative: “ma ọ ga-abụ naanị dịka onye gbapụrụ n’ọkụ” ma ọ bụ “site n’ọkụ na-eme ka ọ dị ọcha”
  rationale: Grik na-enye ihe atụ dị nkenke nke na-akọwaghị ọrụ ọkụ ahụ kpọmkwem. Nsụgharị ahụ anaghị etinye ozizi otu ụka ma ọ bụ dozie nghọtahie ahụ n’ụzọ ederede n’onwe ya na-emeghị.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị ùgwù ma doo ndị nkịtị anya. E jiri “gbaa ... ọkụ laa n’iyi” mee ka ike nke κατακαήσεται pụta, ebe e debere ihe atụ ikpeazụ n’enweghị nkọwa nke otu ozizi.
