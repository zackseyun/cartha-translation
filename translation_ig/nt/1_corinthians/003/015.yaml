review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the conditional, the destruction of the work, the contrast between the person's loss and salvation, and the fire imagery. However, “ọ ga-ata ahụhụ n’ihi ihe funahụrụ ya” shifts the direct sense of ζημιωθήσεται (“will suffer loss”) toward emotional suffering caused by a loss, and the final wording is less direct than the Greek comparison.
  naturalness: 'The revision uses idiomatic modern Standard Igbo: “ọ ga-enwe mfu” directly expresses incurring loss, and “dị ka onye gafere n’ọkụ” preserves the vivid, terse comparison without making the person explicitly an escapee.'
  terminology: “ọrụ,” “a ga-azọpụta ya onwe ya,” and “mfu” are suitable and theologically noncommittal. The final clause retains the ambiguity of διὰ πυρός and does not import a purgatorial or narrowly-escape interpretation.
  issues:
  - severity: medium
    issue: The rendering of ζημιωθήσεται is indirect and may overemphasize distress.
    rationale: “Ọ ga-ata ahụhụ n’ihi ihe funahụrụ ya” means that he will suffer because something was lost. The Greek states more directly that he will incur/suffer loss. “Ọ ga-enwe mfu” better preserves this without specifying the nature of the loss.
  - severity: low
    issue: The final comparison can be phrased more directly.
    rationale: “Ọ ga-adị ka onye si n’ọkụ gafee” is understandable, but “ọ ga-adị ka onye gafere n’ọkụ” more naturally expresses passing through fire while retaining the Greek image and ambiguity.
  revised_text: Ọ bụrụ na ọrụ onye ọ bụla ere ọkụ laa n’iyi, ọ ga-enwe mfu; ma a ga-azọpụta ya onwe ya, ma ọ dị ka onye gafere n’ọkụ.[a]
  revised_footnotes:
