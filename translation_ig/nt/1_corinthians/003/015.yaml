revisions:
- from: Ọ bụrụ na a gbaa ọrụ onye ọ bụla ọkụ laa n’iyi, ọ ga-ata ahụhụ n’ihi ihe funahụrụ ya; ma a ga-azọpụta ya onwe ya—ma ọ ga-adị ka onye si n’ọkụ gafee.[a]
  to: Ọ bụrụ na ọrụ onye ọ bụla ere ọkụ laa n’iyi, ọ ga-enwe mfu; ma a ga-azọpụta ya onwe ya, ma ọ dị ka onye gafere n’ọkụ.[a]
  rationale: The revised wording directly conveys the loss denoted by ζημιωθήσεται, maintains the emphatic distinction between the work and the person, and renders the final metaphor in natural Standard Igbo. The footnote offers the more restrictive and escape-oriented alternatives without selecting either as the meaning of the main text.
