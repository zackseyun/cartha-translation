id: 1CO.3.21
reference: 1 Corinthians 3:21
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὥστε μηδεὶς καυχάσθω ἐν ἀνθρώποις· πάντα γὰρ ὑμῶν ἐστιν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/021.yaml
  text: So then[a], let no one boast in people[b], for all things are yours.
translation:
  language: ig
  text: Ya mere, ka onye ọ bụla ghara ịnya isi banyere ụmụ mmadụ[a][b], n’ihi na ihe niile bụ nke unu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị mmadụ”; okwu Grik a na-ezo aka n’ụmụ mmadụ n’ozuzu, ọ bụghị naanị ndị nwoke.
    reason: lexical_alternative
  - marker: b
    text: N’ihe amaokwu a na-ekwu banyere ya, a pụkwara ịghọta ya dịka “ndị ndu.”
    reason: alternative_reading
lexical_decisions:
- source_word: ὥστε
  choice: Ya mere
  rationale: Ọ na-egosi nkwubi okwu sitere n’ihe Pọl kwuru tupu nke a; “Ya mere” bụ Igbo doro anya ma na-echekwa njikọ echiche ahụ.
- source_word: μηδεὶς
  choice: onye ọ bụla ghara
  rationale: N’usoro “ka ... ghara,” nke a na-enye iwu mgbochi metụtara mmadụ niile n’ụzọ ebumpụta ụwa n’Igbo.
- source_word: καυχάσθω
  choice: ka ... ghara ịnya isi
  rationale: “Ịnya isi” na-egosipụta ịnya isi ma ọ bụ ịtuku ọnụ, na-enweghị ịgbakwunye nkọwa pụrụ iche na-adịghị n’okwu Grik.
- source_word: ἐν
  choice: n’ihi
  rationale: Mgbe ọ na-eso καυχάομαι, ἐν nwere ike igosi onye ma ọ bụ ihe e ji eme ihe ndabere nke ịnya isi. “N’ihi” bụ Igbo sitere n’ọnụ ma doo anya karịa ntụgharị nkịtị dịka “n’ime,” nke ga-ada mgbagwoju anya ebe a.
- source_word: ἀνθρώποις
  choice: ụmụ mmadụ
  rationale: Okwu ahụ bụ ọtụtụ ma na-ezo aka n’ụmụ mmadụ n’ozuzu, ọ bụghị naanị ndị nwoke. “Ụmụ mmadụ” na-echekwa obosara okwu Grik; ihe gbara ya gburugburu nwere ike ime ka a ghọta ya dị ka ndị ndu mmadụ.
- source_word: πάντα
  choice: ihe niile
  rationale: Ọ na-echekwa echiche sara mbara nke ụdị ọtụtụ na-anọpụ iche n’okwu Grik ma bụrụkwa Igbo nkịtị.
- source_word: γὰρ
  choice: n’ihi na
  rationale: Ọ na-ewebata ihe mere e ji nye iwu mgbochi ahụ.
- source_word: ὑμῶν
  choice: bụ nke unu
  rationale: Ọ na-egosi nwe ma na-edobe “unu” dị ka ọtụtụ, dịka okwu Grik si dị.
- source_word: ἐστιν
  choice: bụ
  rationale: “Bụ” bụ njikọ okwu kwesịrị ekwesị n’Igbo; ọ dịghị agbanwe n’ihi na isiokwu ahụ bụ “ihe niile.”
theological_decisions:
- issue: Ma ἀνθρώποις ọ̀ pụtara ụmụ mmadụ n’ozuzu ka ọ bụ ndị ndu ọgbakọ kpọmkwem
  choice: ụmụ mmadụ
  alternative: ndị ndu mmadụ
  rationale: Okwu Grik n’onwe ya pụtara ụmụ mmadụ ma hapụ nkọwa ya ka ọ saa mbara, ebe ihe gbara ya gburugburu na-ekwu banyere Pọl, Apọlọs na Kefa. E debere nkọwa “ndị ndu mmadụ” n’okpuru amaokwu kama ime ka ọ bụrụ naanị ihe ederede pụtara.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “Ịnya isi” bụ okwu nkịtị ma siri ike nke na-eburu echiche καυχάομαι. E tinyere akara abụọ [a][b] ozugbo n’azụ “ụmụ mmadụ,” ebe nkọwa abụọ ahụ metụtara okwu ahụ.
