revisions:
- from: Ya mere, ka onye ọ bụla ghara ịnya isi n’ihi ụmụ mmadụ[a][b], n’ihi na ihe niile bụ nke unu.
  to: Ya mere, ka onye ọ bụla ghara ịnya isi banyere ụmụ mmadụ[a][b], n’ihi na ihe niile bụ nke unu.
  rationale: The revision corrects the prepositional relationship so that the prohibition concerns boasting in or about people, as in the Greek, rather than boasting because of them. It also improves both footnotes’ lexical precision and idiomatic Standard Igbo while preserving the source text’s breadth and the contextual possibility that Paul has leaders in view.
