    text: A pụkwara ịsụgharị ya, ‘nọgide.’
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ ‘ụgwọ’ ma ọ bụ ‘nkwụghachi.’
    reason: lexical_alternative
  revision_rationale: The revision resolves the ambiguous pronoun by naming ‘ntọala ahụ’ (‘the foundation’), which is explicit in the immediate preceding context (1 Cor 3:11) and is entailed by the contextual use of ‘build on.’ It retains the source’s conditional wording, singular representative reference, ambiguity concerning the nature of the reward, and the existing footnote anchors.
