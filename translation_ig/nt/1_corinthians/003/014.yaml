  text: εἴ τινος τὸ ἔργον μενεῖ ὃ ἐποικοδόμησεν, μισθὸν λήμψεται·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/014.yaml
  text: If anyone’s work that he built on remains[b][a], he will receive a reward.
translation:
  language: ig
  text: Ọ bụrụ na ọrụ nke onye ọ bụla wuru n’elu ntọala ahụ adịgide[a], ọ ga-anata ụgwọ ọrụ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, ‘nọgide.’
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ ‘ụgwọ’ ma ọ bụ ‘nkwụghachi.’
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴ
  choice: Ọ bụrụ na
  rationale: Ọ na-ewebata ahịrịokwu ọnọdụ n'ụzọ doro anya ma bụrụkwa asụsụ Igbo a na-eji eme ihe.
- source_word: τινος
  choice: onye ọ bụla
  rationale: Nnochiaha a na-akọwaghị onye kpọmkwem na-egosi na okwu a metụtara onye ọ bụla; njikọ ya na ‘ọrụ’ na-egosi nwe.
- source_word: ἔργον
  choice: ọrụ
  rationale: ‘Ọrụ’ dabara n’ihe atụ nke iwu ụlọ ma ghara ịkọwa ya karịa otú Grik si kwuo.
- source_word: μενεῖ
  choice: adịgide
  rationale: Ọ na-egosi ịnọgide ma ọ bụ ịtachi obi; n’ọnọdụ a, ‘adịgide’ na-ada nke ọma n’Igbo ma ghara itinye nkọwa ọzọ banyere ọkụ.
- source_word: ὃ ἐποικοδόμησεν
  choice: nke o wuru n’elu ya
  rationale: Ngwaa ahụ pụtara iwu ihe n’elu ntọala ma ọ bụ ihe ọzọ. ‘N’elu ya’ na-echekwa echiche ahụ n’agbanyeghị na e kwughị ihe e wuru n’elu ya kpọmkwem n’amaokwu a.
- source_word: μισθὸν
  choice: ụgwọ ọrụ
  rationale: Ọ na-egosi ihe a na-akwụ mmadụ n’ihi ọrụ ya; ‘ụgwọ ọrụ’ na-echekwa echiche nkwụghachi ma dabara n’ọnọdụ ikpe Chineke.
- source_word: λήμψεται
  choice: ọ ga-anata
  rationale: Nke a bụ ọdịnihu nke ‘ịnara/ịnata’; ‘ọ ga-anata’ bụ Igbo dị ugwu ma doo anya.
theological_decisions:
- issue: Ihe ‘ụgwọ ọrụ’ pụtara n’oge nyocha Chineke
  choice: E debere ya dịka ‘ụgwọ ọrụ’ n’enweghị nkọwa nke ụdị ụgwọ ahụ.
  alternative: Ịkọwa ya dịka nzọpụta ma ọ bụ otu ụdị ngọzi kpọmkwem.
  rationale: Amaokwu ahụ kwuru naanị μισθός, ya mere nsụgharị ekwesịghị ikpebi ụdị nkwụghachi ahụ ma ọ bụ tinye ozizi a na-ekwughị n’ebe a.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe ma dị ugwu. A hapụrụ onye ahụ dịka otu onye (‘o/ọ’) dịka usoro Grik si dị, ma ‘onye ọ bụla’ na-eme ka o doo anya na ọ metụtara mmadụ ọ bụla. Akara nkọwa ala ala [a] na [b] dị n’ahịrịokwu bụ isi.
