  text: ὑμεῖς δὲ Χριστοῦ, Χριστὸς δὲ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/023.yaml
  text: and you are Messiah's[b][a], and Messiah is God's.
translation:
  language: ig
  text: Unu bụkwa nke Mesaịa[a], Mesaịa bụkwa nke Chineke.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị “Mesaịa” dịka “Kraịst.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς
  choice: unu
  rationale: Nnọchiaha onye nke abụọ n’ọnụọgụ; “unu” na-egosi nke ọma na a na-agwa ọtụtụ mmadụ okwu.
- source_word: δὲ
  choice: bụkwa
  rationale: A gbakwụnyere “-kwa” n’ahịrịokwu abụọ ahụ iji gosi njikọ na-aga n’ihu na ntụnyere dị n’usoro okwu Pọl, n’ụzọ dabara n’Igbo.
- source_word: Χριστοῦ
  choice: nke Mezaịa
  rationale: Ọdịdị genitive a na-egosi inwe ma ọ bụ ịbụ nke onye ọzọ; “nke Mezaịa” na-edebe mkpụmkpụ okwu Grik na echiche nke ịbụ nke ya.
- source_word: Χριστὸς
  choice: Mezaịa
  rationale: E ji ya dịka aha ọkwa nke Onye E Tere Mmanụ, ọ bụghị naanị dịka aha mmadụ; e dekwara ya otu ụzọ ahụ n’ahịrịokwu abụọ ahụ iji chekwaa myiri okwu Grik.
- source_word: θεοῦ
  choice: nke Chineke
  rationale: Genitive a na-egosi mmekọrịta nke ịbụ nke Chineke, n’enweghị ịkọwa karịa ihe ederede kwuru.
theological_decisions:
- issue: Otu a ga-esi kọwaa genitive abụọ ahụ na-enweghị ime ka mmekọrịta ha doo anya karịa ihe Grik kwuru.
  choice: “Unu bụkwa nke Mezaịa, Mezaịa bụkwa nke Chineke.”
  alternative: “Unu bụ ndị Mezaịa nwe, Mezaịa bụkwa onye Chineke nwe.”
  rationale: “Nke” na-edebe nhata na mkpụmkpụ nke ahịrịokwu Grik, ma na-ahapụ ụdị na oke mmekọrịta ahụ n’amaghị kpọmkwem kama ịkọwa ya dịka naanị ịbụ ohu, ọchịchị, ma ọ bụ ụdị mmekọrịta ọzọ.
translation_notes:
  register: Igbo Izugbe dị mfe ma dị ùgwù. A họọrọ “Mezaịa” iji mee ka Χριστός pụta dịka aha ọkwa, ebe ntụaka ala peeji na-enye okwu ọdịnala “Kraịst.”
