  text: εἴ τις τὸν ναὸν τοῦ θεοῦ φθείρει, φθερεῖ τοῦτον ὁ θεός· ὁ γὰρ ναὸς τοῦ θεοῦ ἅγιός ἐστιν, οἵτινές ἐστε ὑμεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/017.yaml
  text: If anyone destroys God's temple[a], God will destroy him; for God's temple is holy[b], and you are that temple.
translation:
  language: ig
  text: Ọ bụrụ na onye ọ bụla na-emebi ụlọ nsọ Chineke[a], Chineke ga-emebi onye ahụ; n’ihi na ụlọ nsọ Chineke dị nsọ, unu bụkwa ụlọ nsọ ahụ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị “emebi” n’ebe abụọ a dịka “emerụ” ma ọ bụ “mebie ịdị nsọ.”
    reason: lexical_alternative
  - marker: b
    text: “Unu” bụ okwu e ji agwa ọtụtụ mmadụ okwu; Pọl na-ekwu maka ọgbakọ ahụ dum dịka otu ụlọ nsọ Chineke.
    reason: cultural_note
lexical_decisions:
- source_word: ναός
  choice: ụlọ nsọ
  rationale: “Ụlọ nsọ” bụ okwu Igbo doro anya ma bụrụ nke a na-ejikarị akọwa ebe nsọ Chineke bi; ọ dabara n’ebe a karịa okwu ga-egosi nanị ụlọ nkịtị.
- source_word: φθείρει / φθερεῖ
  choice: emebie / ga-emebi
  rationale: E ji otu mgbọrọgwụ okwu ahụ mee ihe ugboro abụọ iji chekwaa nkwughachi na ike ịdọ aka ná ntị dị na Grik. “Imebi” nwekwara ike ịgụnye ibibi ihe ma ọ bụ ime ka ọ laa n’iyi.
- source_word: τοῦτον
  choice: onye ahụ
  rationale: “Onye ahụ” na-ezo aka n’otu onye ahụ a kpọrọ “onye ọ bụla,” ma ọ na-ada nke ọma n’Igbo ma zere ịkọwa nwoke ma ọ bụ nwanyị.
- source_word: ἅγιος
  choice: dị nsọ
  rationale: “Dị nsọ” na-echekwa echiche nke ịbụ nke Chineke, nke e doro iche, na nke dị nsọ n’enweghị nkọwa agbakwunyere.
- source_word: οἵτινές ἐστε ὑμεῖς
  choice: unu bụkwa ụlọ nsọ ahụ
  rationale: 'Nke a na-egosipụta njirimara ahụ n’Igbo dị mfe ma doo anya: ndị a na-agwa okwu, n’otu ha, bụ ụlọ nsọ Chineke.'
- source_word: ὑμεῖς
  choice: unu
  rationale: “Unu” na-eme ka ọtụtụ mmadụ dị na okwu Grik pụta ìhè, nke dị mkpa n’ihi na Pọl na-akpọ ọgbakọ ahụ dum otu “ụlọ nsọ.”
theological_decisions:
- issue: Ma “ụlọ nsọ Chineke” ọ na-ezo n’ụzọ bụ isi n’otu onye kwere ekwe ka ọ bụ n’ọgbakọ dum
  choice: 'E gosipụtara isi echiche nke ọgbakọ dum: “unu” bụ ọtụtụ mmadụ, ma “ụlọ nsọ” bụ otu.'
  alternative: A pụrụ ịghọta ya dịka ihe na-emetụtakwa onye kwere ekwe n’otu n’otu site n’ebe ndị ọzọ Akwụkwọ Nsọ kwuru.
  rationale: Ụtọasụsụ Grik jikọtara “ụlọ nsọ” nke dị n’otu na “unu” nke dị n’ọtụtụ; n’ọnọdụ okwu a, nke ahụ na-egosi ọgbakọ Ndị Kraịst dịka ebe Chineke bi.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. A chekwara nkwughachi nke φθείρω, ọdịiche dị n’etiti “onye ọ bụla” na “onye ahụ,” nakwa njikọ dị n’etiti “ụlọ nsọ” otu na “unu” ọtụtụ.
