- from: Ọ bụrụ na onye ọ bụla emebie ụlọ nsọ Chineke[a], Chineke ga-emebi onye ahụ; n’ihi na ụlọ nsọ Chineke dị nsọ, unu bụkwa ụlọ nsọ ahụ.[b]
  to: Ọ bụrụ na onye ọ bụla na-emebi ụlọ nsọ Chineke[a], Chineke ga-emebi onye ahụ; n’ihi na ụlọ nsọ Chineke dị nsọ, unu bụkwa ụlọ nsọ ahụ.[b]
  rationale: A gbanwere naanị “emebie” ka ọ bụrụ “na-emebi” iji mee ka ahịrịokwu ahụ bụrụ Igbo Izugbe a na-ekwu n’ụzọ nkịtị ma chekwaa ọdịiche oge na nkwughachi φθείρει / φθερεῖ. A hazikwara nkọwa ala a ka ọ bụrụ nke dị nkenke ma ghara ịgbakwunye nkọwa na-adịghị n’okwu Grik.
