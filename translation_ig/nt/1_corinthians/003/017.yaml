review_pass:
  verdict: revise
  source_fidelity: 'The draft preserves the Greek structure and central meaning well: the conditional warning, the deliberate repetition of φθείρω, the singular reference to the offender, the holiness of God''s temple, and the plural address identifying the congregation collectively. However, the first use, “emebie,” is less natural and less semantically aligned with the future “ga-emebi”; using “na-emebi” gives a clear present/future correspondence while retaining verbal repetition.'
  naturalness: “Ọ bụrụ na onye ọ bụla na-emebi ... Chineke ga-emebi ...” is natural Standard Igbo and communicates an ongoing or characteristic act without adding interpretation. The concluding “unu bụkwa ụlọ nsọ ahụ” is clear and idiomatic.
  terminology: “Ụlọ nsọ Chineke,” “dị nsọ,” and “unu” are appropriate Standard Igbo renderings. “Megharịa/merụọ” alternatives in the existing footnote are potentially uneven, but a concise note that “emebi” may also mean corrupt/defile safely reflects the lexical range and applies to both occurrences.
  issues:
  - severity: low
    issue: The form “emebie” in the protasis is awkward beside “ga-emebi” and does not best mirror the Greek present φθείρει.
    rationale: The Greek has present φθείρει followed by future φθερεῖ. “Na-emebi ... ga-emebi” is idiomatic Igbo, clearly maintains the verbal repetition, and avoids an unnecessary shift to a less natural form.
  - severity: low
    issue: The lexical footnote’s alternatives are overly expanded and “mebie ịdị ọcha ya” introduces an explicit possessive/object not stated in the Greek.
    rationale: A shorter note can represent the alternatives “corrupt” and “defile” for both occurrences without adding detail or weakening the matching verb pattern.
