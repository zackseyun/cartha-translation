id: 1CO.3.6
reference: 1 Corinthians 3:6
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐγὼ ἐφύτευσα, Ἀπολλῶς ἐπότισεν, ἀλλὰ ὁ θεὸς ηὔξανεν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/006.yaml
  text: I planted[a], Apollos watered, but God gave the growth.
translation:
  language: ig
  text: Mụ onwe m kụrụ ihe, Apọlọs gbara ya mmiri, ma Chineke nọ na-eme ka o too.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ịsị: “ma Chineke nyere uto ahụ,” ma ọ bụ “ma Chineke mere ka o too.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγὼ
  choice: Mụ onwe m
  rationale: Nnọchiaha ahụ e kwuru hoo haa na Grik na-enye ‘m’ ike pụrụ iche; ‘Mụ onwe m’ na-egosipụta nkwusi ike ahụ n’Igbo n’ụzọ doro anya.
- source_word: ἐφύτευσα
  choice: kụrụ ihe
  rationale: Nke a na-echekwa ihe atụ ọrụ ugbo nke φυτεύω ma na-ada nke ọma n’Igbo.
- source_word: Ἀπολλῶς
  choice: Apọlọs
  rationale: A sụgharịrị aha onye ahụ n’usoro mkpọpụta na odide Igbo.
- source_word: ἐπότισεν
  choice: gbara ya mmiri
  rationale: Nke a bụ ụzọ Igbo nkịtị si ekwu inye ihe a kụrụ mmiri, ma na-aga n’ihu na ihe atụ ọrụ ugbo ahụ.
- source_word: ἀλλὰ
  choice: ma
  rationale: ‘Ma’ na-egosipụta ọdịiche siri ike dị n’etiti ọrụ ndị ozi na ọrụ Chineke.
- source_word: ὁ θεὸς
  choice: Chineke
  rationale: Ọ na-akọwapụta Chineke dị ka onye na-eme ka uto ahụ pụta n’ezie.
- source_word: ηὔξανεν
  choice: nọ na-eme ka o too
  rationale: Nke a na-egosipụta imperfect Grik dị ka ihe na-aga n’ihu n’oge gara aga, ma na-edobe Chineke dị ka onye na-akpata uto ahụ.
theological_decisions:
- issue: Ọrụ Chineke na ọrụ ụmụ mmadụ n’ozi
  choice: Pọl kụrụ ihe, Apọlọs gbara ya mmiri, ma Chineke nọ na-eme ka ọ too.
  alternative: Chineke nyere uto ahụ.
  rationale: Nsụgharị a na-edobe ma ezi ọrụ ndị ozi ma ọrụ Chineke nke na-ekpebi uto, n’etinyeghị nkọwa ozizi ọzọ.
translation_notes:
  register: Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E debere ihe atụ ọrụ ugbo na ọdịiche dị n’etiti ndị ọrụ mmadụ na Chineke.
