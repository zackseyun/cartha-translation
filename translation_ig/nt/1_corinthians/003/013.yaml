revisions:
- from: Ọrụ onye ọ bụla ga-apụta ìhè, n’ihi na Ụbọchị ahụ[a] ga-eme ka a mata ya, n’ihi na a na-ekpughe ya n’ọkụ[b]; ọkụ ahụ n’onwe ya ga-anwale ụdị ọrụ onye ọ bụla rụrụ.
  to: Ọrụ onye ọ bụla ga-apụta ìhè, n’ihi na Ụbọchị ahụ[a] ga-eme ka a mata ya, n’ihi na a na-ekpughe Ụbọchị ahụ n’ọkụ[b]; ọkụ ahụ n’onwe ya ga-anwale ọrụ onye ọ bụla, iji mata ụdị ọ bụ.
  rationale: 'The revision preserves the Greek syntax and its debated ‘in/by fire’ nuance, while correcting the final clause so that it concerns the kind or quality of each person’s work rather than explicitly work already performed. It also makes the subject of ‘is revealed’ explicit: the Day.'
