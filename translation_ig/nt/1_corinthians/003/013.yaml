review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately conveys the verse’s principal sequence: each person’s work becomes manifest, the Day discloses it, the Day is revealed in fire, and fire tests the work. However, “ọrụ onye ọ bụla rụrụ” introduces a completed-action sense (‘work each one did’) not expressed by the Greek, which speaks of the character of each person’s work.'
  naturalness: The Igbo is generally clear and appropriately formal. Recasting the final clause as ‘ọrụ onye ọ bụla, iji mata ụdị ọ bụ’ is more idiomatic and avoids the unnecessary past-tense implication.
  terminology: ‘Ọrụ,’ ‘Ụbọchị ahụ,’ ‘n’ọkụ,’ ‘a na-ekpughe,’ and ‘ọkụ ahụ n’onwe ya’ are suitable Standard Igbo renderings. Naming ‘Ụbọchị ahụ’ explicitly in the clause about revelation removes a possible ambiguity in the pronoun ‘ya’ without adding interpretation.
  issues:
  - severity: medium
    issue: The final phrase reads ‘ụdị ọrụ onye ọ bụla rụrụ.’
    rationale: The Greek ὁποῖόν ἐστιν asks what sort each person’s work is; it does not use a past verb corresponding to ‘rụrụ.’ The draft wording can suggest that the test concerns merely a past act rather than the nature/quality of the work.
  - severity: low
    issue: The pronoun in ‘a na-ekpughe ya n’ọkụ’ may be momentarily unclear.
    rationale: Its intended antecedent is ‘Ụbọchị ahụ,’ but the preceding ‘ya’ refers to the work. Repeating ‘Ụbọchị ahụ’ makes the source referent clear.
  revised_text: Ọrụ onye ọ bụla ga-apụta ìhè, n’ihi na Ụbọchị ahụ[a] ga-eme ka a mata ya, n’ihi na a na-ekpughe Ụbọchị ahụ n’ọkụ[b]; ọkụ ahụ n’onwe ya ga-anwale ọrụ onye ọ bụla, iji mata ụdị ọ bụ.
  revised_footnotes:
