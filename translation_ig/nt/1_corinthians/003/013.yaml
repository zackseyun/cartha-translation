language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἑκάστου τὸ ἔργον φανερὸν γενήσεται, ἡ γὰρ ἡμέρα δηλώσει· ὅτι ἐν πυρὶ ἀποκαλύπτεται, καὶ ἑκάστου τὸ ἔργον ὁποῖόν ἐστιν τὸ πῦρ ⸀αὐτὸ δοκιμάσει.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/013.yaml
  text: each one’s work will become evident[a], for the Day will disclose it, because it is revealed in fire[b], and the fire itself will test what sort of work each one has.
translation:
  language: ig
  text: Ọrụ onye ọ bụla ga-apụta ìhè, n’ihi na Ụbọchị ahụ[a] ga-eme ka a mata ya, n’ihi na a na-ekpughe Ụbọchị ahụ n’ọkụ[b]; ọkụ ahụ n’onwe ya ga-anwale ọrụ onye ọ bụla, iji mata ụdị ọ bụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ụbọchị ahụ” nwere ike na-arụtụ aka n’ụbọchị ọdịnihu nke Chineke ga-eji nyochaa ma ọ bụ kpee ikpe.
    reason: cross_reference
  - marker: b
    text: A pụkwara ịsụgharị ya, “site n’ọkụ.” Okwu Grik ἐν πυρί nwere ike ịpụta “n’ọkụ” ma ọ bụ gosi ọkụ dị ka ụzọ e ji ekpughe ihe.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑκάστου
  choice: onye ọ bụla
  rationale: Ọ na-echekwa echiche nkesa nke onye n’otu n’otu, n’enweghị ịkọwa nwoke ma ọ bụ nwaanyị.
- source_word: τὸ ἔργον
  choice: ọrụ
  rationale: “Ọrụ” sara mbara ma dabara n’ihe Pọl na-ekwu banyere ihe onye ọ bụla wuru ma ọ bụ rụpụtara.
- source_word: φανερὸν γενήσεται
  choice: ga-apụta ìhè
  rationale: Nke a bụ okwu Igbo dị ndụ nke na-egosi na ihe ahụ ga-aghọ ihe a pụrụ ịhụ ma mara nke ọma.
- source_word: ἡ ἡμέρα
  choice: Ụbọchị ahụ
  rationale: Mkpọaha ahụ na ọnọdụ okwu a na-arụtụ aka n’ụbọchị ọdịnihu nke Chineke ga-eji nyochaa ọrụ.
- source_word: δηλώσει
  choice: ga-eme ka a mata ya
  rationale: Ọ na-egosi ime ka ihe doo anya, ma na-ekewapụ okwu a n’ἀποκαλύπτεται nke sochiri ya.
- source_word: ἐν πυρὶ
  choice: n’ọkụ
  rationale: Ọ na-echekwa ọdịdị preposition Grik ahụ ma hapụ ohere ma ọ̀ bụ ọnọdụ “n’ọkụ” ka ọ̀ bụ ụzọ e ji eme ihe “site n’ọkụ.”
- source_word: ἀποκαλύπτεται
  choice: a na-ekpughe ya
  rationale: Ọ na-echekwa olu nnara na echiche nke iwepụ ihe mkpuchi ka ihe pụta ìhè.
- source_word: ὁποῖόν ἐστιν
  choice: ụdị ọrụ onye ọ bụla rụrụ
  rationale: Ọ na-elekwasị anya n’ụdị ma ọ bụ ịdị mma nke ọrụ ahụ n’Igbo doro anya.
- source_word: δοκιμάσει
  choice: ga-anwale
  rationale: Ọ na-egosi nnwale e ji achọpụta ụdị ma ọ bụ ịdị mma nke ihe.
- source_word: αὐτὸ
  choice: n’onwe ya
  rationale: Ọ na-echekwa nkwusi ike na ọkụ ahụ n’onwe ya bụ ihe ga-anwale ọrụ ahụ.
theological_decisions:
- issue: Ma ἡ ἡμέρα ọ̀ bụ naanị otu ụbọchị n’ozuzu ya, ka ọ̀ bụ ụbọchị ọdịnihu nke nyocha ma ọ bụ ikpe Chineke.
  choice: Ụbọchị ahụ
  alternative: ụbọchị ahụ
  rationale: E ji mkpụrụedemede ukwu gosipụta na ọ bụ ụbọchị pụrụ iche a maara n’echiche banyere ihe ikpeazụ, ebe “ahụ” na-eme ka ntụaka ahụ doo anya n’Igbo na-agbakwunyeghị nkọwa n’ahịrịokwu ahụ.
- issue: Ma ἐν πυρὶ ọ̀ pụtara “n’ọkụ” ka ọ̀ bụ “site n’ọkụ.”
  choice: n’ọkụ
  alternative: site n’ọkụ
  rationale: A họọrọ nsụgharị kacha nso n’usoro Grik, ma debe ụzọ ọzọ n’okpuru peeji ka a ghara idozi nghọta okwu ahụ n’ike.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji “ga-apụta ìhè” na “ga-eme ka a mata” mee ka okwu ahụ bụrụ nke mmadụ nkịtị ga-aghọta, ebe e chekwara ọdịiche dị n’etiti ngwaa Grik abụọ ahụ. Akara ndetu [a] na [b] dị n’ederede isi ma kwekọọ na ndetu ha.
