  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Οὐκ οἴδατε ὅτι ναὸς θεοῦ ἐστε καὶ τὸ πνεῦμα τοῦ θεοῦ ⸂οἰκεῖ ἐν ὑμῖν⸃;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/016.yaml
  text: Do you not know that you are God’s temple and that God’s Spirit dwells in you?[a][b][c]
translation:
  language: ig
  text: Ọ̀ bụ na unu[b] amaghị na unu bụ ụlọ nsọ Chineke,[a] nakwa na Mmụọ Chineke bi n'ime unu?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ebe nsọ Chineke.”
    reason: lexical_alternative
  - marker: b
    text: “Unu” dị n'ụdị ọtụtụ; Pọl na-agwa obodo ndị kwere ekwe okwu dịka otu.
    reason: cultural_note
  - marker: c
    text: Ma ọ bụ, “n'etiti unu.”
    reason: alternative_reading
lexical_decisions:
- source_word: ναὸς
  choice: ụlọnsọ
  rationale: Okwu a na-ezo aka n'ebe nsọ ahụ n'onwe ya, ọ bụghị naanị ogige ụlọ nsọ dum. “Ụlọnsọ” bụ okwu Igbo doro anya ma na-edobe ihe atụ nke obodo ndị kwere ekwe dịka ebe nsọ Chineke.
- source_word: θεοῦ
  choice: Chineke
  rationale: Usoro Igbo “ụlọnsọ Chineke” na “Mmụọ Chineke” na-egosi njikọ genitiv ahụ n'ụzọ ebumpụta ụwa.
- source_word: ἐστε
  choice: unu bụ
  rationale: “Unu” na-egosi onye nke abụọ n'ụdị ọtụtụ, dịka Grik si dị, ma na-adabara obodo Kọrịnt niile a na-agwa okwu.
- source_word: τὸ πνεῦμα τοῦ θεοῦ
  choice: Mmụọ Chineke
  rationale: Nke a bụ ntụgharị Igbo dị mfe ma kwesị ntụkwasị obi nke “Mmụọ nke Chineke,” na-edobe njikọ ya na Chineke.
- source_word: οἰκεῖ
  choice: bi
  rationale: “Bi” na-egosi ịnọgide biri, ma na-arụkọ ọrụ nke ọma na ihe atụ nke ụlọnsọ.
- source_word: ἐν ὑμῖν
  choice: n'ime unu
  rationale: Nke a na-edobe isi nghọta nke ἐν, ebe “unu” plural na-ahapụkwa ohere maka nghọta gbasara obodo ahụ dum. Ihe odide ala peeji na-egosi nhọrọ “n'etiti unu.”
- source_word: Οὐκ οἴδατε
  choice: Ọ̀ bụ na unu amaghị
  rationale: Nke a na-ebute ajụjụ nrụgide Pọl n'ụzọ Igbo dị ugbu a ma dị ùgwù.
theological_decisions:
- issue: Ma amaokwu a ọ na-ekwu nke mbụ banyere onye kwere ekwe n'otu n'otu ka ọ bụ banyere nzukọ ndị kwere ekwe dịka otu obodo
  choice: E debere “unu” n'isiokwu ahụ, nke bụ plural ma na-ekwe ka ọnọdụ gbara ya gburugburu gosi na a na-agwa obodo ahụ ọnụ.
  alternative: “Unu niile ọnụ bụ ụlọnsọ Chineke,” ma ọ bụ ntụgharị na-eme ka ọ bụrụ onye ọ bụla n'otu n'otu.
  rationale: Grik ji onye nke abụọ plural, ma o tinyeghị okwu pụtara kpọmkwem “ọnụ.” Ya mere, “unu bụ” na-edobe usoro na esemokwu dị n'isi mmalite n'enweghị ịkọwa ya karịa ihe e dere.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji “unu” mee ka plural nke Grik pụta ìhè; e zere ịgbakwunye “ọnụ” n'isiokwu ka a ghara idozi nghọta obodo ahụ karịa ihe isi mmalite kwuru.
