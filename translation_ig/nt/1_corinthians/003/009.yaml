  text: θεοῦ γάρ ἐσμεν συνεργοί· θεοῦ γεώργιον, θεοῦ οἰκοδομή ἐστε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/009.yaml
  text: For we are God’s fellow workers; you are God’s field[a], God’s building.
translation:
  language: ig
  text: N’ihi na anyị bụ ndị na-arụkọ ọrụ n’ọrụ Chineke; unu bụ ubi Chineke[a], ụlọ Chineke.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “anyị na Chineke na-arụkọ ọrụ.”
    reason: alternative_reading
lexical_decisions:
- source_word: γάρ
  choice: N’ihi na
  rationale: Na-egosipụta na okwu a na-akọwa ma jikọta ya na arụmụka dị n’amaokwu ndị bu ya ụzọ.
- source_word: συνεργοί
  choice: ndị ha na ibe ha na-arụ ọrụ
  rationale: Nke a bụ Igbo doro anya nke na-egosipụta ọtụtụ ndị na-arụkọ ọrụ ọnụ, n’enweghị ịgbatị ihe okwu ahụ pụtara.
- source_word: θεοῦ (with συνεργοί)
  choice: nke Chineke
  rationale: A na-ewere genitive a dị ka nke na-egosi na ndị ọrụ ahụ bụ nke Chineke ma na-ejere ya ozi; nke a kwekọrọ n’okwu gbara ya gburugburu, ebe Pọl na-emesi ike na ndị ozi bụ ndị Chineke.
- source_word: γεώργιον
  choice: ubi
  rationale: “Ubi” bụ okwu Igbo dị mfe ma bụrụ ihe kwesịrị ekwesị maka ihe atụ nke ala a na-akọ.
- source_word: οἰκοδομή
  choice: ụlọ
  rationale: “Ụlọ” bụ okwu nkịtị, doro anya, ma na-akwadebe ụzọ maka ihe atụ banyere iwu ụlọ nke na-esochi.
- source_word: ἐστε
  choice: unu bụ
  rationale: Na-egosipụta nke ọma onye nke abụọ n’ọnụọgụ ọtụtụ dị na Grik.
theological_decisions:
- issue: Ma θεοῦ συνεργοί ọ̀ pụtara “ndị ha na ibe ha na-arụ ọrụ nke Chineke” ka ọ bụ “ndị ha na Chineke na-arụkọ ọrụ.”
  choice: ndị ha na ibe ha na-arụ ọrụ nke Chineke
  alternative: ndị ha na Chineke na-arụkọ ọrụ
  rationale: Genitive Grik ahụ nwere ike ịkwado nghọta abụọ ahụ. N’okwu gbara ya gburugburu, Pọl na-emesi ike na ndị ozi bụ nke Chineke ma na-ejere ya ozi, ebe ndị Kọrịnt bụ ihe onwunwe Chineke. Nsụgharị a na-echekwa isi okwu ahụ, ebe ihe odide ala ala na-echekwa nghọta ọzọ a na-arụrịta ụka banyere ya.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A nọgidere na-eji ihe atụ abụọ ahụ—ubi na ụlọ—n’ụdị dị nkenke, ma chekwaa nghọta ọzọ nke θεοῦ συνεργοί n’ihe odide ala ala.
