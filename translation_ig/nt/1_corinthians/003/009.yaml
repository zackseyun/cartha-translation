- from: N’ihi na anyị bụ ndị ha na ibe ha na-arụ ọrụ nke Chineke; unu bụ ubi Chineke[a], ụlọ Chineke.
  to: N’ihi na anyị bụ ndị na-arụkọ ọrụ n’ọrụ Chineke; unu bụ ubi Chineke[a], ụlọ Chineke.
  rationale: The revision corrects the defective Igbo expression for συνεργοί while maintaining the contextual main-text sense that Paul and Apollos work in God's service. The footnote clearly preserves the alternate interpretation that they work together with God. No change is made to the verse's metaphors or its theological ambiguity.
