source:
  edition: SBLGNT
  text: ὁ φυτεύων δὲ καὶ ὁ ποτίζων ἕν εἰσιν, ἕκαστος δὲ τὸν ἴδιον μισθὸν λήμψεται κατὰ τὸν ἴδιον κόπον,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/008.yaml
  text: The one who plants and the one who waters are one[a], and each will receive his own reward according to his own labor.
translation:
  language: ig
  text: Onye na-akụ ihe na onye na-agba ya mmiri bụ otu[a], ma onye ọ bụla ga-anata ụgwọ ọrụ nke ya dịka ọrụ ike nke ya si dị.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ha dị n'otu,” ma ọ bụ, “ha nwere otu ebumnuche.”
    reason: lexical_alternative
lexical_decisions:
- source_word: φυτεύων
  choice: onye na-akụ mkpụrụ
  rationale: Nkebi okwu a na-egosi onye na-arụ ọrụ ịkụ ihe; ‘onye na-akụ mkpụrụ’ bụ Igbo doro anya nke na-echekwa ihe atụ ọrụ ugbo ahụ.
- source_word: ποτίζων
  choice: onye na-agba ya mmiri
  rationale: Nke a na-echekwa ihe atụ nke ịgbara ihe a kụrụ mmiri, ebe ‘ya’ na-ezo aka n'ihe a kụrụ.
- source_word: ἕν
  choice: bụ otu
  rationale: 'Ọ na-echekwa mkpụmkpụ na mgbagwoju nghọta nke Grik: ọ na-egosi ịdị n''otu, ọ bụghị na mmadụ abụọ ahụ bụ otu onye.'
- source_word: μισθὸν
  choice: ụgwọ ọrụ
  rationale: Okwu a pụrụ ịpụta ụgwọ ma ọ bụ ihe nkwụghachi; ‘ụgwọ ọrụ’ dabara n'ọnọdụ a ma ghara ime ka ọ bụrụ naanị ego a na-akwụ onye ọrụ.
- source_word: λήμψεται
  choice: ga-anata
  rationale: Nke a na-egosipụta ọdịnihu nke ngwaa Grik n'Igbo nkịtị ma dị ugwu.
- source_word: κατὰ
  choice: dịka ... si dị
  rationale: Usoro a na-egosi na nkwụghachi onye ọ bụla ga-adaba n'ọrụ siri ike ọ rụrụ.
- source_word: κόπον
  choice: ndọgbu
  rationale: ‘Ndọgbu’ na-egosi ọrụ e tinyere mgbalị na ike na ya, nke kwekọrọ na κόπος karịa naanị ‘ọrụ.’
- source_word: ἴδιον
  choice: nke ya / ya
  rationale: Nkwughachi a na-echekwa nkwusi ike nke Grik na onye ọ bụla nwere ụgwọ ọrụ nke ya, dịka ndọgbu nke ya si dị.
theological_decisions:
- issue: Ihe ‘bụ otu’ (ἕν εἰσιν) pụtara
  choice: A hapụrụ ya dịka ‘bụ otu,’ na-egosi ịdị n'otu ha n'ọrụ na ebumnuche.
  alternative: ‘dị n'otu’ ma ọ bụ ‘nwere otu ebumnuche’
  rationale: ἕν bụ ụdị neuter, ya mere ọ naghị ekwu na ha bụ otu onye. N'ọnọdụ amaokwu ndị gbara ya gburugburu, Pọl na-emegide ịkpa ókè n'etiti ndị ozi ma na-egosi na ọrụ ha dị iche iche na-eje otu nzube n'okpuru Chineke; ndetu ala na-echekwa nkọwa ndị a n'ebughị ha n'ime isi ederede.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị mfe nghọta ma dị ugwu. E chekwara ihe atụ ọrụ ugbo, nkwusi ike dị na ‘onye ọ bụla’ na ‘nke ya,’ nakwa mgbagwoju nghọta ziri ezi nke ‘bụ otu.’
