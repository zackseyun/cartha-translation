    text: Ma ọ bụ, “ha dị n'otu,” ma ọ bụ, “ha nwere otu ebumnuche.”
    reason: lexical_alternative
  revision_rationale: The revision removes an unwarranted specification of seed from φυτεύων, uses a more transparent modern expression for κόπος, and makes the second occurrence of ‘own’ explicit. The main text retains the source’s deliberate compactness and ambiguity concerning the workers’ unity; the footnote offers alternatives without treating either as the sole interpretation.
