- from: Onye na-akụ mkpụrụ na onye na-agba ya mmiri bụ otu[a], ma onye ọ bụla ga-anata ụgwọ ọrụ nke ya dịka ndọgbu ya si dị.
  to: Onye na-akụ ihe na onye na-agba ya mmiri bụ otu[a], ma onye ọ bụla ga-anata ụgwọ ọrụ nke ya dịka ọrụ ike nke ya si dị.
  rationale: The revision removes an unwarranted specification of seed from φυτεύων, uses a more transparent modern expression for κόπος, and makes the second occurrence of ‘own’ explicit. The main text retains the source’s deliberate compactness and ambiguity concerning the workers’ unity; the footnote offers alternatives without treating either as the sole interpretation.
