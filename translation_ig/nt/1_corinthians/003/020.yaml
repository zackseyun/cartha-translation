  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ πάλιν· Κύριος γινώσκει τοὺς διαλογισμοὺς τῶν σοφῶν ὅτι εἰσὶν μάταιοι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/020.yaml
  text: And again[a], “The Lord knows the thoughts of the wise[c][b], that they are futile.”
translation:
  language: ig
  text: Ọzọkwa, “Onyenwe anyị maara echiche[a] ndị amamihe, na ha bụ ihe efu.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ntụgharị uche.”
    reason: lexical_alternative
  - marker: b
    text: E hotara nke a n’Abụ Ọma 94:11 (93:11 na Septuagint).
    reason: cross_reference
lexical_decisions:
- source_word: καὶ πάλιν
  choice: Ọzọkwa
  rationale: Ọ na-ewebata amaokwu ọzọ e hotara iji kwado okwu ahụ; nke a bụ ụzọ Igbo dị mkpirikpi ma dịkwa mma isi kwuo ya.
- source_word: Κύριος
  choice: Onyenwe anyị
  rationale: Nke a bụ nsụgharị Igbo a na-ejikarị eme κύριος mgbe ọ na-ezo aka n’ebe Chineke nọ.
- source_word: γινώσκει
  choice: maara
  rationale: Ọ na-enye kpọmkwem echiche nke ịma, n’etinyeghị nkọwa ọzọ na-adịghị n’ihe odide Grik.
- source_word: διαλογισμοὺς
  choice: echiche
  rationale: Ọ bụ okwu Igbo doro anya maka echiche na ntụgharị uche dị n’ime mmadụ; ‘ntụgharị uche’ ka edebere n’ala peeji dịka ụzọ ọzọ e nwere ike isi ghọta ya.
- source_word: τῶν σοφῶν
  choice: ndị amamihe
  rationale: Ọ na-edobe adjective ahụ e ji dị ka aha n’ụzọ Igbo sitere n’okike, ma ọ naghị agbakwụnye nwoke ma ọ bụ ndị gụrụ akwụkwọ.
- source_word: ὅτι
  choice: na
  rationale: N’ebe a, ọ na-ewebata ihe Onyenwe anyị maara, ọ bụghị ihe kpatara ya.
- source_word: μάταιοι
  choice: ihe efu
  rationale: Ọ na-egosi na echiche ndị ahụ abaghị uru, tọgbọ chakoo, ma ghara iru ihe e bu n’obi, n’asụsụ Igbo ndị mmadụ na-aghọta ngwa ngwa.
theological_decisions:
- issue: Ihe ‘ha’ na-ezo aka na ya
  choice: E ji ‘ha’ zoro aka n’echiche ndị amamihe.
  alternative: Ịsụgharị ya n’ụzọ ga-eme ka ọ dị ka ọ na-ekwu na ndị amamihe n’onwe ha bụ ihe efu.
  rationale: μάταιοι kwekọrọ n’ọnụọgụ na διαλογισμούς, ya mere ihe a na-akpọ ihe efu bụ echiche ndị ahụ. Nke a na-edobe usoro na ihe amaokwu Grik pụtara.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, dị ugwu ma dị mfe nghọta. A họọrọ ‘ihe efu’ maka μάταιοι; ọ na-eburu echiche nke ihe na-abaghị uru ma ọ bụ na-enweghị isi, n’emeghị ka amaokwu ahụ bụrụ nkọwa otu ụka.
