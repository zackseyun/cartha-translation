id: 1CO.3.18
reference: 1 Corinthians 3:18
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Μηδεὶς ἑαυτὸν ἐξαπατάτω· εἴ τις δοκεῖ σοφὸς εἶναι ἐν ὑμῖν ἐν τῷ αἰῶνι τούτῳ, μωρὸς γενέσθω, ἵνα γένηται σοφός,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/018.yaml
  text: Let no one deceive himself[a]. If anyone among you thinks he is wise in this age, let him become foolish[b], so that he may become wise.
translation:
  language: ig
  text: Ka onye ọ bụla ghara ịghọgbu onwe ya. Ọ bụrụ na onye ọ bụla n’ime unu echee na ya maara ihe n’oge a, ya ghọọ onye nzuzu[a], ka o wee ghọọ onye maara ihe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ya ghọọ onye na-enweghị amamihe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Μηδεὶς ἑαυτὸν ἐξαπατάτω
  choice: Ka onye ọ bụla ghara ịghọgbu onwe ya
  rationale: Nke a na-edobe mmachibido iwu ahụ, ike okwu ‘onye ọ bụla,’ na nnọchiaha ntụgharị onwe nke dị n’asụsụ Grik, n’Igbo dị mfe ma kwụ ọtọ.
- source_word: δοκεῖ σοφὸς εἶναι
  choice: echee na ya maara ihe
  rationale: N’ebe a, δοκεῖ na-egosi otú mmadụ si ele onwe ya anya; ‘echee na ya maara ihe’ na-egosipụta nke ahụ nke ọma.
- source_word: ἐν ὑμῖν
  choice: n’ime unu
  rationale: Nke a bụ ụzọ Igbo nkịtị si egosi onye so n’otu ndị a na-agwa okwu.
- source_word: ἐν τῷ αἰῶνι τούτῳ
  choice: n’oge a
  rationale: ‘Oge a’ na-echekwa echiche αἰών dị ka oge ma ọ bụ usoro dị ugbu a, kama ịgbanwe ya ka ọ bụrụ naanị ‘ụwa.’
- source_word: μωρὸς γενέσθω
  choice: ya ghọọ onye nzuzu
  rationale: 'Nke a na-echekwa iwu ahụ na ihe mgbagwoju anya Pọl kpachaara anya kwuo: mmadụ aghaghị ịghọ onye a na-ewere dị ka onye nzuzu iji ghọọ onye maara ihe n’ezie.'
- source_word: ἵνα γένηται σοφός
  choice: ka o wee ghọọ onye maara ihe
  rationale: Nke a na-echekwa nkebi ebumnuche nke ἵνα na njikọ dị n’etiti ịghọ onye nzuzu na ịghọ onye maara ihe.
theological_decisions:
- issue: Ihe αἰών pụtara n’ọdịiche Pọl na-eme
  choice: A sụgharịrị ya ‘oge a.’
  alternative: ‘ụwa a’ ma ọ bụ ‘dị ka ụkpụrụ oge a si dị’
  rationale: ‘Oge a’ na-echekwa akụkụ oge na usoro ụwa dị ugbu a nke Pọl ji tụnyere amamihe Chineke, na-enweghị itinye nkọwa ahụ ozugbo n’ime ahịrịokwu.
- issue: Ihe ‘ịghọ onye nzuzu’ pụtara
  choice: E debere okwu mgbagwoju anya ahụ kpọmkwem.
  alternative: ‘ka ndị oge a were ya dị ka onye nzuzu’
  rationale: Asụsụ Grik ekwughị kpọmkwem onye na-ewere ya dị ka onye nzuzu; ya mere, nsụgharị ahụ ekwesịghị idozi nghọta ahụ n’ime isiokwu.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. A họọrọ ‘onye maara ihe’ na ‘onye nzuzu’ iji mee ka ọdịiche okwu σοφός/μωρός doo anya. Akara nkọwa [a] pụtara n’isiokwu dịka achọrọ.
