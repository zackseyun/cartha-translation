id: 1CO.3.19
reference: 1 Corinthians 3:19
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἡ γὰρ σοφία τοῦ κόσμου τούτου μωρία παρὰ τῷ θεῷ ἐστιν· γέγραπται γάρ· Ὁ δρασσόμενος τοὺς σοφοὺς ἐν τῇ πανουργίᾳ αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/019.yaml
  text: For the wisdom of this world is foolishness with God[a]. For it is written[b], “He catches the wise in their craftiness.”
translation:
  language: ig
  text: N’ihi na amamihe nke ụwa a bụ nzuzu n’anya Chineke.[a] N’ihi na e dere, “Ọ na-ejide ndị maara ihe n’aghụghọ ha.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’asụsụ nkịtị, “n’ebe Chineke nọ”; ya bụ, dịka Chineke si ele ya ma ọ bụ kpee ya.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị “aghụghọ” dịka “atụmatụ aghụghọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: σοφία
  choice: amamihe
  rationale: Ọ bụ okwu Igbo a na-ejikarị akọwa amamihe; n’ebe a, ọ na-ezo aka n’ihe ụwa na-ewere dị ka amamihe.
- source_word: κόσμου τούτου
  choice: nke ụwa a
  rationale: Nke a na-egosipụta κόσμος dị ka usoro ụwa nke ugbu a, ma na-edobe okwu Pọl n’ụzọ dị mfe ma doo anya.
- source_word: μωρία
  choice: nzuzu
  rationale: Ọ na-egosipụta ihe na-enweghị amamihe ma kwekọọ n’ụzọ Pọl si eji okwu ahụ n’akụkụ akwụkwọ ozi a.
- source_word: παρὰ τῷ θεῷ
  choice: n’anya Chineke
  rationale: Παρά na dative ebe a na-egosi otú Chineke si ele ma kpee ihe ahụ; ‘n’anya Chineke’ bụ okwu Igbo sitere n’okike nke na-ebupụta echiche ahụ.
- source_word: γέγραπται
  choice: e dere
  rationale: Nke a bụ usoro Igbo doro anya maka okwu e ji ewebata ihe e dere n’Akwụkwọ Nsọ.
- source_word: δρασσόμενος
  choice: na-ejide
  rationale: Okwu ahụ pụtara ijide ma ọ bụ inweta mmadụ dịka onye dabara n’ọnyà; ‘na-ejide’ dị mfe ma dabara n’ike ilu ahụ.
- source_word: σοφοὺς
  choice: ndị maara ihe
  rationale: Ọ na-ezo aka n’ebe ndị a na-ewere dị ka ndị nwere amamihe nọ, n’enweghị ịkọwa ha dịka naanị ụmụ nwoke.
- source_word: πανουργίᾳ
  choice: aghụghọ
  rationale: N’ebe a, okwu ahụ na-egosi amamihe aghụghọ e ji eme atụmatụ ọjọọ; ‘aghụghọ’ na-edobe ụda omume ọjọọ ahụ.
theological_decisions:
- issue: Otu e si akọwa onye na-eme ihe n’okwu e hotara na Job 5:13
  choice: Ọ na-ejide ndị maara ihe n’aghụghọ ha
  alternative: Onye na-ejide ndị maara ihe n’aghụghọ ha
  rationale: Ọ bụ Chineke ka okwu gbara ya gburugburu na-ezo aka na ya. Iji ‘Ọ’ mee isiokwu na-eme ka Igbo bụrụ nke zuru oke ma dị mfe ịgụ, n’ebughị echiche okpukpe ọhụrụ bata.
- issue: Uche dị na παρὰ τῷ θεῷ
  choice: n’anya Chineke
  alternative: n’ebe Chineke nọ
  rationale: Nhọrọ a na-eme ka o doo anya na okwu ahụ gbasara ikpe ma ọ bụ echiche Chineke, ma nkọwa ala peeji na-edobe ntụgharị nke na-esochi nhazi Grik nso.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-edobe nkwughachi ‘N’ihi na’ nke γάρ abụọ, ma na-ezere okwu ụka pụrụ iche ma ọ bụ nkọwa nke ga-emechi mgbagwoju anya dị n’ederede.
