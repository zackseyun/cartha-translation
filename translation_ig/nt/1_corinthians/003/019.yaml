  source_fidelity: 'The translation accurately conveys the Greek: worldly wisdom is evaluated by God as foolishness, and the citation portrays God as catching the wise by means of their own morally negative cunning. “N’anya Chineke” appropriately expresses the evaluative force of παρὰ τῷ θεῷ, while the footnote preserves the more literal spatial formulation.'
  naturalness: The Standard Igbo is clear, dignified, and natural. The repeated “N’ihi na” faithfully reflects the two occurrences of γάρ without becoming cumbersome. “Ọ na-ejide ndị maara ihe n’aghụghọ ha” is an idiomatic and readable rendering of the quotation.
  terminology: “Amamihe,” “ụwa a,” “nzuzu,” “ndị maara ihe,” and “aghụghọ” are suitable choices in this Pauline context. In particular, “aghụghọ” retains the negative moral sense of πανουργία rather than reducing it to neutral cleverness.
