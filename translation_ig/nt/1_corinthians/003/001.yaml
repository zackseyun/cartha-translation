- from: Mụ onwe m kwa, ụmụnna m[a], enweghị m ike ịgwa unu okwu dị ka ndị mmụọ, kama dị ka ndị anụ ahụ, dị ka ụmụ ọhụrụ n'ime Mesaịa[b].
  to: Mụ onwe m kwa, ụmụnna m[a], enweghị m ike ịgwa unu okwu dị ka ndị ime mmụọ, kama dị ka ndị anụ ahụ, dị ka ụmụ ọhụrụ n'ime Mesaịa[b].
  rationale: The sole revision replaces an ambiguous and potentially misleading Igbo expression with the natural Standard Igbo expression for ‘spiritual people.’ It preserves the Greek’s person-reference, the spiritual/fleshly contrast, and the source text’s theological openness. Footnote markers remain attached to the terms they explain.
