id: 1CO.3.1
reference: 1 Corinthians 3:1
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Κἀγώ, ἀδελφοί, οὐκ ἠδυνήθην ⸂λαλῆσαι ὑμῖν⸃ ὡς πνευματικοῖς ἀλλ’ ὡς ⸀σαρκίνοις, ὡς νηπίοις ἐν Χριστῷ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/001.yaml
  text: And I[a], brothers, was not able to speak to you as spiritual people, but as fleshly people[b], as infants in Messiah.
translation:
  language: ig
  text: Mụ onwe m kwa, ụmụnna m[a], enweghị m ike ịgwa unu okwu dị ka ndị ime mmụọ, kama dị ka ndị anụ ahụ, dị ka ụmụ ọhụrụ n'ime Mesaịa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Okwu Grik pụtara kpọmkwem “ụmụnne nwoke,” ma n’ebe a ọ pụrụ ịgụnye ụmụnne nwanyị ndị nọ n’ọgbakọ ahụ.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “n'ime Kraịst.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Κἀγώ
  choice: Mụ onwe m kwa
  rationale: “Kwa” na-echekwa njikọ καί, ebe “mụ onwe m” na-eme ka nnọchiaha ahụ pụta ìhè n’Igbo n’enweghị itinye ike karịrị nke Grik.
- source_word: ἀδελφοί
  choice: ụmụnna m
  rationale: Nke a bụ ụzọ e si akpọ ndị otu okwukwe okwu n’Igbo n’ụzọ ebumpụta ụwa. Ọ pụrụ ịgụnye ndị nwoke na ndị nwanyị, ebe ndetu ala na-egosi na okwu Grik ahụ bụ ụdị nwoke n’ụtọasụsụ.
- source_word: οὐκ ἠδυνήθην
  choice: enweghị m ike
  rationale: Ọ na-egosi enweghị ike ime ihe ahụ n’oge Pọl na-ekwu maka ya, n’ụzọ doro anya ma bụrụkwa Igbo a na-asụ ugbu a.
- source_word: λαλῆσαι ὑμῖν
  choice: ịgwa unu okwu
  rationale: Ọ bụ ntụgharị Igbo kwụ ọtọ ma dị ebumpụta ụwa nke infinitive ahụ na onye a na-agwa.
- source_word: πνευματικοῖς
  choice: ndị mmụọ
  rationale: Adjective ahụ na-anọchi aha mmadụ. Nhọrọ a na-echekwa njikọ ya na mmụọ ma ghara ịkọwa n’ihu ma ọ̀ bụ Mmụọ Nsọ kpọmkwem ka e bu n’obi.
- source_word: σαρκίνοις
  choice: ndị anụ ahụ
  rationale: Ọ na-echekwa ọdịiche dị n’etiti mmụọ na anụ ahụ, na-enweghị ịtụgharị ya ozugbo ka ọ bụrụ “ndị ụwa” ma ọ bụ “ndị mmehie,” nke ga-agbakwụnye nkọwa.
- source_word: νηπίοις
  choice: ụmụ ọhụrụ
  rationale: Ọ na-echekwa ihe atụ nke ụmụ ọhụrụ na-egosi akabeghị aka.
- source_word: ἐν Χριστῷ
  choice: n'ime Mesaịa
  rationale: A sụgharịrị Χριστός dị ka aha ọkwa “Mesaịa,” ebe “n'ime” na-echekwa usoro okwu Pọl banyere ịdị n’ime ya.
theological_decisions:
- issue: Ihe πνευματικοῖς na-ezo aka na ya
  choice: ndị mmụọ
  alternative: ndị nke Mmụọ Nsọ
  rationale: Grik anaghị etinye πνεῦμα n’amaokwu a ma ọ bụ kọwaa ya n’ụzọ doro anya; ya mere, isiokwu ahụ na-echekwa nghọta sara mbara kama imechi ya n’otu nkọwa.
- issue: Nsụgharị Χριστῷ
  choice: Mesaịa
  alternative: Kraịst
  rationale: E ji aha ọkwa ahụ mee ihe ebe a; “Mesaịa” na-eme ka ọrụ ya dị ka Onye E Tere Mmanụ pụta ìhè, ebe ndetu ala na-enye nsụgharị ọdịnala ọzọ.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị nsọpụrụ ma dị mfe nghọta, dee ya. A hapụrụ ọdịiche dị n’etiti “mmụọ” na “anụ ahụ” ka ọ dị n’isi mmalite, ma zere okwu ndị ga-eme ka “anụ ahụ” bụrụ ozugbo “ụwa” ma ọ bụ “ọdịdị mmehie.” Ihe nrịbama ndetu ala [a] na [b] pụtara n’ebe okwu ha na-akọwa dị n’isiokwu.
