  text: εἰ δέ τις ἐποικοδομεῖ ἐπὶ τὸν ⸀θεμέλιον ⸂χρυσόν, ἄργυρον⸃, λίθους τιμίους, ξύλα, χόρτον, καλάμην,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/012.yaml
  text: If anyone builds on the foundation with gold, silver, precious stones, wood, hay, straw,
translation:
  language: ig
  text: Ma ọ bụrụ na onye ọ bụla ejiri ọlaedo, ọlaọcha, nkume dị oké ọnụ ahịa, osisi, ahịhịa kpọrọ nkụ, na ahịhịa ọka wuo n’elu ntọala ahụ,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰ δέ τις
  choice: Ma ọ bụrụ na onye ọ bụla
  rationale: “Ọ bụrụ na” na-egosi ọnọdụ; “ma” na-eburu mgbanwe dị nro nke δέ n’arụmụka ahụ n’enweghị ime ya ka ọ bụrụ mgbagha siri ike; “onye ọ bụla” na-echekwa izugbe nke τις.
- source_word: ἐποικοδομεῖ ἐπὶ τὸν θεμέλιον
  choice: wuo ụlọ n’elu ntọala ahụ
  rationale: Nkebi a na-echekwa ihe atụ nke iwu ihe n’elu ntọala. Ịtinye “ụlọ” na-eme ka okwu ahụ bụrụ Igbo eke, ebe “ntọala ahụ” na-arụtụ aka ná ntọala a kpọrọ aha n’amaokwu bu ụzọ.
- source_word: χρυσόν
  choice: ọlaedo
  rationale: Ọ bụ aha ihe ahụ kpọmkwem ma dabara n’usoro ihe e ji ewu ụlọ.
- source_word: ἄργυρον
  choice: ọlaọcha
  rationale: Ọ bụ ntụgharị aha ihe ahụ kpọmkwem, nke e jikọtara ya na ọlaedo.
- source_word: λίθους τιμίους
  choice: nkume dị oké ọnụ ahịa
  rationale: Nke a na-echekwa echiche nke nkume bara ezigbo uru, n’enweghị ikpebi ma ha bụ nkume ịchọ mma ma ọ bụ nkume owuwu dị oke mma.
- source_word: ξύλα
  choice: osisi
  rationale: N’ọnọdụ a, “osisi” bụ okwu Igbo nkịtị maka wood/timber dịka ihe e ji ewu ụlọ.
- source_word: χόρτον
  choice: ahịhịa kpọrọ nkụ
  rationale: χόρτος nwere ike ịpụta ahịhịa; n’usoro ihe owuwu a, ịkọwa ya dịka ahịhịa kpọrọ nkụ na-egosi hay nke ọma.
- source_word: καλάμην
  choice: okporo ọka
  rationale: καλάμη nwere ike ịpụta ahịhịa ọka fọdụrụ ma ọ bụ okporo ahịhịa. “Okporo ọka” na-egosi stubble/straw n’usoro ihe ndị ọkụ na-ere ngwa ngwa, ma ọ naghị agwakọta ya na χόρτος.
theological_decisions: []
translation_notes:
  register: Asụsụ Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E debere amaokwu ahụ dịka ahịrịokwu ọnọdụ na-aga n’ihu n’amaokwu na-esote, ya mere rikoma dị na njedebe. A sụgharịrị δέ dịka “Ma” iji gosipụta mmepe dị nro n’arụmụka ahụ.
