review_pass:
  verdict: revise
  source_fidelity: The conditional force, mild δέ transition, generic subject, foundation metaphor, and six-item materials list are retained. However, “ụlọ” adds a specified object not present in ἐποικοδομεῖ, and “okporo ọka” more naturally denotes a grain stalk than the straw/stubble sense of καλάμη in this contrastive materials list.
  naturalness: The proposed revision is fluent Standard Igbo and preserves the unfinished conditional syntax with a final comma. “Ahịhịa ọka” is a more idiomatic and immediately clear term for straw than “okporo ọka.”
  terminology: “Ntọala,” “ọlaedo,” “ọlaọcha,” and “nkume dị oké ọnụ ahịa” are suitable. “Ahịhịa kpọrọ nkụ” distinguishes hay from “ahịhịa ọka” (straw). The final coordinator is rendered as “na” rather than “ma ọ bụ,” since the Greek simply lists materials and does not explicitly mark the last item as an alternative.
  issues:
  - severity: medium
    issue: Added “ụlọ”
    rationale: The Greek verb means “build/build upon” and does not state “a house.” The construction metaphor is clear in Igbo without adding this object.
  - severity: medium
    issue: “okporo ọka” for καλάμη
    rationale: This normally evokes a stalk of grain. In this familiar low-grade-building-material sequence, καλάμη is best represented by “ahịhịa ọka” (straw), while retaining a distinction from hay.
  - severity: low
    issue: “ma ọ bụ” before the final material
    rationale: The source has an unmarked series, not an explicit disjunction. “na” gives a neutral Igbo list.
  revised_text: Ma ọ bụrụ na onye ọ bụla ejiri ọlaedo, ọlaọcha, nkume dị oké ọnụ ahịa, osisi, ahịhịa kpọrọ nkụ, na ahịhịa ọka wuo n’elu ntọala ahụ,
