  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ὑμεῖς πεφυσιωμένοι ἐστέ, καὶ οὐχὶ μᾶλλον ἐπενθήσατε, ἵνα ⸀ἀρθῇ ἐκ μέσου ὑμῶν ὁ τὸ ἔργον τοῦτο ⸀ποιήσας;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/002.yaml
  text: And you are puffed up[a], and should you not rather have mourned, so that the one who did this deed might be removed from among you?
translation:
  language: ig
  text: Ma unu jupụtara n’nganga! Ọ̀ bụ na kama nke ahụ, unu ekwesịghị iru újú, ka e wee wepụ onye mere omume a n’etiti unu[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ka e si n’etiti unu wepụ onye ahụ.” N’ihe ndị gbara amaokwu a gburugburu, o yikarịrị ka ọ na-ekwu maka iwepụ ya n’ọgbakọ site n’ịdọ aka ná ntị.
    reason: lexical_alternative
lexical_decisions:
- source_word: πεφυσιωμένοι
  choice: afụwo elu n’ihi nganga
  rationale: Nhọrọ a na-echekwa ihe atụ nke ịbụ onye ‘fụrụ elu,’ ma na-eme ka ihe ọ pụtara—nganga—doo onye Igbo nke oge a anya. Oge ngwaa ahụ na-egosikwa ọnọdụ ha abanyelarị ma nọgide na ya.
- source_word: οὐχὶ μᾶλλον
  choice: Ọ̀ bụ na unu ekwesịghị kama
  rationale: Nke a na-edobe ike ajụjụ ịba mba ahụ ma na-egosi ọdịiche dị n’etiti nganga ha na nzaghachi ha kwesịrị inwe.
- source_word: ἐπενθήσατε
  choice: iru újú
  rationale: ‘Iru újú’ na-egosi mwute miri emi dịka nke onye na-eru uju, ọ bụghị naanị iwe ma ọ bụ mwute nkịtị; nke a dabara n’ike okwu Grik ahụ.
- source_word: ἵνα ἀρθῇ
  choice: ka e wee wepụ
  rationale: Nke a na-egosipụta ebumnuche ma ọ bụ ihe a tụrụ anya ya, ma na-echekwa ụdị okwu a na-eme onye ahụ n’amaghị kpọmkwem onye mere ya.
- source_word: ἐκ μέσου ὑμῶν
  choice: n’etiti unu
  rationale: Ọ bụ ụzọ Igbo doro anya ma dị mfe isi kwuo na a ga-ewepụ onye ahụ n’ime obodo ha.
- source_word: ὁ τὸ ἔργον τοῦτο ποιήσας
  choice: onye mere omume a
  rationale: Nhọrọ a na-akọwa onye ahụ site n’ihe o mere, na-edobekwa ịdị arọ nke ἔργον n’enweghị ịgbakwụnye nkọwa na-adịghị na okwu ahụ.
theological_decisions:
- issue: Ụdị iwepụ onye mere ihe ahụ
  choice: ka e wee wepụ ... n’etiti unu
  alternative: ka Chineke buru onye ahụ pụọ, ma ọ bụ ka e chụpụ ya n’ọgbakọ
  rationale: Ụdị okwu Grik ahụ anaghị akpọ onye ga-ewepụ ya aha. Ihe ndị gbara amaokwu a gburugburu na-akwado iwepụ ya n’ọgbakọ site n’ịdọ aka ná ntị, ma nsụgharị bụ isi anaghị etinye okwu kpọmkwem dịka ‘ịchụpụ n’ọgbakọ,’ ka ọ ghara imechi obosara na esemokwu dị n’okwu mbụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. ‘Afụwo elu n’ihi nganga’ na-echekwa ihe atụ Pọl ji ma na-akọwakwa ya n’ụzọ nkịtị; ‘iru újú’ na-edobe ịdị arọ nke mwute a chọrọ. E tinyere akara poznote [a] n’akụkụ okwu gbasara iwepụ onye ahụ, ebe poznote ahụ metụtara.
