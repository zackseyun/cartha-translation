revisions:
- from: Ma unu afụwo elu n’ihi nganga! Ọ̀ bụ na unu ekwesịghị kama iru újú, ka e wee wepụ onye mere omume a n’etiti unu[a]?
  to: Ma unu jupụtara n’nganga! Ọ̀ bụ na kama nke ahụ, unu ekwesịghị iru újú, ka e wee wepụ onye mere omume a n’etiti unu[a]?
  rationale: The revision removes the added causal phrase and replaces the less idiomatic metaphorical wording with a natural Standard Igbo expression for pride. It retains the Greek rhetorical question, the strong call to mourn, and the deliberately unspecified passive removal. The footnote now gives a broad lexical alternative without implying physical carrying away.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T18:11:13Z'
review_pass:
  verdict: revise
  source_fidelity: The main clause sequence, rebuking question, purpose/result clause, passive removal, and identification of the offender are substantially faithful. However, “afụwo elu n’ihi nganga” adds a causal expression (“because of pride”) not stated in Greek and is not the most natural Standard Igbo expression for Paul’s idiom. The footnote’s “buru ... pụọ” can suggest carrying someone away rather than the broader passive “take away/remove.”
  naturalness: The proposed revision uses idiomatic, modern Standard Igbo while retaining the rhetorical rebuke and the gravity of mourning. “Jupụtara n’nganga” is clear and natural, though it necessarily renders rather than reproduces the Greek inflation metaphor.
  terminology: “Iru újú” appropriately conveys strong mourning. “Wepụ ... n’etiti unu” preserves the nonspecific passive and communal exclusion without prematurely specifying excommunication. “Omume a” is suitable for τοῦτο τὸ ἔργον in this context.
  issues:
  - severity: medium
    issue: The phrase “n’ihi nganga” adds an explicit causal relation.
    rationale: πεφυσιωμένοι denotes being inflated/puffed up; it does not say that they are inflated because of pride. The added phrase is interpretive and should be avoided for optimal equivalence.
  - severity: medium
    issue: The rendering “afụwo elu” is less natural Standard Igbo in this predicative moral sense.
    rationale: A clearer idiomatic expression is needed for the settled state of pride conveyed by πεφυσιωμένοι.
  - severity: low
    issue: The footnote’s alternative “ka e buru onye ahụ pụọ” is overly concrete.
    rationale: ἀρθῇ is a passive ‘be taken away/removed’; ‘carry away’ may narrow the sense beyond the Greek. The note should retain the broader wording.
  revised_text: Ma unu jupụtara n’nganga! Ọ̀ bụ na kama nke ahụ, unu ekwesịghị iru újú, ka e wee wepụ onye mere omume a n’etiti unu[a]?
