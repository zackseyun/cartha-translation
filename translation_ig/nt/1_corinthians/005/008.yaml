review_pass:
  verdict: revise
  source_fidelity: The draft retains the inferential force, the hortatory invitation, and Paul's sustained Passover/leaven contrast. However, “site n’” can suggest means or agency rather than the source's metaphorical sphere/association, and the expressions for leaven and unleavened bread should be made clearer and more idiomatic.
  naturalness: “Eko achịcha” and especially “achịcha na-ekoghị eko” are awkward in modern Standard Igbo. “Ihe na-eko achịcha” and “achịcha na-enweghị ihe na-eko achịcha” communicate the culinary metaphor clearly. “N’” gives a more natural parallel structure in this figurative contrast.
  terminology: “Ajọ obi na ajọ omume” appropriately distinguishes κακία from πονηρία without doctrinal expansion. “Ezi obi na eziokwu” is a suitable rendering of sincerity and truth. The revision consistently uses “ihe na-eko achịcha” for ζύμη and explicitly identifies the unleavened bread in the supplied contextual expression.
  issues:
  - severity: medium
    issue: The rendering uses “site n’eko achịcha” and “site n’achịcha na-ekoghị eko.”
    rationale: In this metaphor, “n’” more naturally renders being associated with or characterized by leaven; “site n’” may imply instrumental means. The latter phrase is also not idiomatic Standard Igbo.
  - severity: medium
    issue: “Eko achịcha” is insufficiently clear as the noun for leaven, and “achịcha na-ekoghị eko” is awkward.
    rationale: “Ihe na-eko achịcha” clearly denotes leaven/yeast, while “achịcha na-enweghị ihe na-eko achịcha” naturally expresses unleavened bread and preserves the Passover image.
  - severity: low
    issue: Footnote a says the Greek “gara n’ihu” with the Passover image.
    rationale: The Greek wording does not mean that it proceeds; it retains or continues the imagery from the preceding verse. The note is adjusted for accuracy and idiomatic Igbo.
  revised_text: Ya mere, ka anyị debe ememme ahụ[a], ọ bụghị n’ihe na-eko achịcha ochie ma ọ bụ n’ihe na-eko achịcha nke ajọ obi na ajọ omume, kama n’achịcha na-enweghị ihe na-eko achịcha[b] nke ezi obi na eziokwu.
