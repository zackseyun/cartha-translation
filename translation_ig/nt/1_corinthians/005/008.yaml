revisions:
- from: Ya mere, ka anyị debe ememme ahụ[a], ọ bụghị site n’eko achịcha ochie, ma ọ bụ site n’eko achịcha nke ajọ obi na ajọ omume, kama site n’achịcha na-ekoghị eko[b] nke ezi obi na eziokwu.
  to: Ya mere, ka anyị debe ememme ahụ[a], ọ bụghị n’ihe na-eko achịcha ochie ma ọ bụ n’ihe na-eko achịcha nke ajọ obi na ajọ omume, kama n’achịcha na-enweghị ihe na-eko achịcha[b] nke ezi obi na eziokwu.
  rationale: The revision preserves the Greek's hortatory and inferential form, its repeated leaven metaphor, and its contextual Passover imagery. It replaces unclear or awkward culinary expressions with natural Standard Igbo while retaining the contextual supply of “bread,” which is transparently documented in the footnote.
