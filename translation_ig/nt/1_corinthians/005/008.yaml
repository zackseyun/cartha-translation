id: 1CO.5.8
reference: 1 Corinthians 5:8
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὥστε ἑορτάζωμεν, μὴ ἐν ζύμῃ παλαιᾷ μηδὲ ἐν ζύμῃ κακίας καὶ πονηρίας, ἀλλ’ ἐν ἀζύμοις εἰλικρινείας καὶ ἀληθείας.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/008.yaml
  text: Therefore let us keep the feast[a], not with old leaven, nor with the leaven of malice and wickedness[b], but with the unleavened bread of sincerity and truth.
translation:
  language: ig
  text: Ya mere, ka anyị debe ememme ahụ[a], ọ bụghị n’ihe na-eko achịcha ochie ma ọ bụ n’ihe na-eko achịcha nke ajọ obi na ajọ omume, kama n’achịcha na-enweghị ihe na-eko achịcha[b] nke ezi obi na eziokwu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, ‘ka anyị mee ememme’ ma ọ bụ ‘ka anyị debe ememme ahụ.’ Okwu Grik ahụ na-edobe ihe atụ nke ememme Ngabiga sitere n’amaokwu bu ya ụzọ.
    reason: lexical_alternative
  - marker: b
    text: N’asụsụ Grik, ọ bụ ‘ihe ndị na-enweghị ihe na-eko achịcha nke ezi obi na eziokwu.’ E tinyere ‘achịcha’ ebe a iji mee ka ihe atụ nke Ngabiga doo anya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: Ya mere
  rationale: Ọ na-egosi nkwubi okwu sitere n’ihe Pọl kwuru tupu nke a, ma ọ bụkwa okwu Igbo doro anya ma bụrụ nke a na-ejikarị eme ihe.
- source_word: ἑορτάζωμεν
  choice: ka anyị debe ememme ahụ
  rationale: Ụdị ngwaa a bụ agbamume nke gụnyere onye na-ekwu okwu na ndị ọ na-agwa. ‘Debe ememme ahụ’ chekwara ihe atụ nke ememme Ngabiga dị n’amaokwu ndị gbara ya gburugburu.
- source_word: ζύμῃ παλαιᾷ
  choice: site n’eko achịcha ochie
  rationale: ‘Eko achịcha’ na-egosipụta ihe ζύμη pụtara n’ezie ma na-echekwa ihe atụ nke Ngabiga. ‘Site n’…’ na-egosipụta ọrụ ἐν n’ụzọ Igbo na-aga were were n’ebe a.
- source_word: κακίας
  choice: ajọ obi
  rationale: N’usoro okwu gbasara omume ọjọọ, κακία nwere ike ịpụta ajọ echiche ma ọ bụ ajọ ọchịchọ mmadụ nwere n’ebe ibe ya nọ. ‘Ajọ obi’ bụ okwu Igbo doro anya nke na-ekewapụ ya na πονηρία.
- source_word: πονηρίας
  choice: ajọ omume
  rationale: Ọ na-egosi omume ọjọọ ma ọ bụ ajọ omume n’ozuzu ya, ma na-echekwa ọdịiche dị n’etiti ya na ‘ajọ obi.’
- source_word: ἀλλ’ ἐν ἀζύμοις
  choice: kama site n’achịcha na-ekoghị eko
  rationale: ἀζύμοις bụ ‘ihe ndị na-ekoghị eko,’ ma n’ọnọdụ ememme Ngabiga a, itinye ‘achịcha’ na-eme ka ihe atụ ahụ doo onye na-agụ Igbo anya.
- source_word: εἰλικρινείας
  choice: ezi obi
  rationale: Ọ na-egosi ịdị ọcha n’ebumnobi na enweghị aghụghọ; ‘ezi obi’ bụ okwu Igbo dị mfe ma dịkwa ebube nke na-egosi ezi omume sitere n’ime mmadụ.
- source_word: ἀληθείας
  choice: eziokwu
  rationale: Ọ bụ ntụgharị kwụ ọtọ ma doo anya nke na-echekwa njikọ ya na ‘ezi obi.’
theological_decisions:
- issue: Ihe atụ nke ememme Ngabiga n’agbamume Pọl
  choice: A sụgharịrị ἑορτάζωμεν ka ọ bụrụ ‘ka anyị debe ememme ahụ,’ tinyekwa ‘achịcha’ na ἀζύμοις.
  alternative: ‘Ka anyị mee ọṅụ’ ma ọ bụ ‘ka anyị mee ememme’; ‘ihe ndị na-ekoghị eko.’
  rationale: Amaokwu bu ụzọ kpọrọ Kraịst nwa atụrụ Ngabiga, ya mere idebe okwu ememme na achịcha na-ekoghị eko na-echekwa usoro arụmụka Pọl. Itinye ‘achịcha’ na-eme ka ihe atụ ahụ doo anya n’enweghị ịgbakwụnye ozizi pụrụ iche.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị mfe nghọta ma dịkwa ùgwù. A hapụrụ ihe atụ nke eko achịcha na ememme Ngabiga ka ọ bụrụ isi ihe n’amaokwu ahụ, ma zere okwu pụrụ iche nke otu ụka.
