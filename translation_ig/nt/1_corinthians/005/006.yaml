  text: Οὐ καλὸν τὸ καύχημα ὑμῶν. οὐκ οἴδατε ὅτι μικρὰ ζύμη ὅλον τὸ φύραμα ζυμοῖ;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/006.yaml
  text: Your boasting is not good[a]. Do you not know that a little leaven leavens the whole batch of dough?
translation:
  language: ig
  text: Ịnya isi unu adịghị mma. Ọ̀ bụ na unu amaghị na obere ihe na-eko achịcha na-eme ka ngwakọta ntụ ọka ahụ dum[a] koo?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ogbe ntụ ọka ahụ dum.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καλὸν
  choice: adịghị mma
  rationale: Nke a na-egosipụta ntule omume na nke kwesịrị ekwesị n'ụzọ doro anya ma bụrụkwa Igbo nkịtị.
- source_word: καύχημα
  choice: ịnya isi unu
  rationale: “Ịnya isi” bụ okwu Igbo dị ndụ nke na-egosi ịnya isi ma ọ bụ ito onwe mmadụ, kwekọọkwa n'olu ịba mba Pọl.
- source_word: οὐκ οἴδατε
  choice: Ọ̀ bụ na unu amaghị
  rationale: E debere ajụjụ nkwughachi nke Pọl, kama ịtụgharị ya ka ọ bụrụ nanị “unu aghọtaghị.”
- source_word: μικρὰ ζύμη
  choice: obere ihe na-eko achịcha
  rationale: Nke a na-eme ka ihe a na-ekwu banyere ya doo onye Igbo nke oge a anya, ma na-edebe ihe atụ nke ihe na-eme ka ntụ ọka koo.
- source_word: ὅλον τὸ φύραμα
  choice: ntụ ọka a gwakọtara agwakọta ... niile
  rationale: φύραμα bụ ntụ ọka e tinyeworo mmiri ma gwakọta; okwu a na-egosi ya n'ụzọ doro anya karịa okwu nwere ike ịpụta naanị ntụ ọka akọrọ.
- source_word: ζυμοῖ
  choice: na-eme ka ... koo
  rationale: Nke a na-edebe njikọ okwu dị n'etiti ζύμη na ζυμοῖ ma na-ada n'ụzọ ebumpụta ụwa n'Igbo.
theological_decisions:
- issue: Ihe atụ nke ihe na-eko achịcha
  choice: E debere ihe atụ ahụ n'onwe ya n'amaokwu ahụ.
  alternative: Ịkọwa ya ozugbo dị ka “obere mmehie na-emebi ọgbakọ niile.”
  rationale: Pọl kwuru ilu n'ụdị ihe atụ; amaokwu gbara ya gburugburu na-egosi ihe ọ na-ezo aka na ya. Ịkọwa ya n'ime amaokwu a ga-emechi ihe okwu Grik hapụrụ ka ọnọdụ ya kọwaa.
translation_notes:
  register: Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E ji “ịnya isi” mee ka olu ịba mba ahụ bụrụ nke ebumpụta ụwa; e ji nkọwa banyere ntụ ọka gwakọtara mee ka ihe oyiyi achịcha doo anya.
