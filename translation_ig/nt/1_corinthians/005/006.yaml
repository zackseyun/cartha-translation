revisions:
- from: Ịnya isi unu adịghị mma. Ọ̀ bụ na unu amaghị na obere ihe na-eko achịcha na-eme ka ntụ ọka a gwakọtara agwakọta[a] koo niile?
  to: Ịnya isi unu adịghị mma. Ọ̀ bụ na unu amaghị na obere ihe na-eko achịcha na-eme ka ngwakọta ntụ ọka ahụ dum[a] koo?
  rationale: 'The revision preserves every element of the Greek: the negative evaluation of boasting, the rhetorical ‘do you not know,’ a small amount of leaven, and its effect on the entire dough. It improves the natural Igbo expression for φύραμα while retaining the metaphor without theological expansion.'
