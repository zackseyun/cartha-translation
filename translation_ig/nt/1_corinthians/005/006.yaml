review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the rebuke about the Corinthians’ boasting and retains Paul’s rhetorical question and the leaven image. Its rendering of φύραμα as ‘ntụ ọka a gwakọtara agwakọta’ is intelligible, but the split placement of ‘niile’ is less smooth than a compact noun phrase for the mixed dough/batch.
  naturalness: ‘Ịnya isi unu adịghị mma’ and ‘Ọ̀ bụ na unu amaghị’ are natural Standard Igbo in this rebuking, rhetorical register. ‘Ngwakọta ntụ ọka ahụ dum’ expresses the whole prepared dough more fluently and avoids the slightly cumbersome repetition ‘gwakọtara agwakọta.’
  terminology: ‘Obere ihe na-eko achịcha’ appropriately preserves the concrete leaven image without importing an interpretation such as sin or corruption. ‘Ngwakọta ntụ ọka’ accurately represents φύραμα as mixed dough; the footnote retains ‘ogbe’ as a viable alternative.
  issues:
  - severity: low
    issue: The phrase ‘ntụ ọka a gwakọtara agwakọta ... niile’ is syntactically dispersed and repetitious.
    rationale: Although faithful in meaning, a more compact expression is more idiomatic and clearly identifies φύραμα as the prepared mixture/dough rather than dry flour.
  revised_text: Ịnya isi unu adịghị mma. Ọ̀ bụ na unu amaghị na obere ihe na-eko achịcha na-eme ka ngwakọta ntụ ọka ahụ dum[a] koo?
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “ogbe ntụ ọka ahụ dum.”
    reason: lexical_alternative
  revision_rationale: 'The revision preserves every element of the Greek: the negative evaluation of boasting, the rhetorical ‘do you not know,’ a small amount of leaven, and its effect on the entire dough. It improves the natural Igbo expression for φύραμα while retaining the metaphor without theological expansion.'
