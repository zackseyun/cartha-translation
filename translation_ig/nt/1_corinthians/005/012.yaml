source:
  edition: SBLGNT
  text: τί γάρ ⸀μοι τοὺς ἔξω κρίνειν; οὐχὶ τοὺς ἔσω ὑμεῖς κρίνετε,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/012.yaml
  text: For what is it to me to judge outsiders? Is it not those inside that you are to judge?[a][b]
translation:
  language: ig
  text: N’ihi na, olee ihe jikọrọ m na ikpe ndị nọ n’èzí ikpe? Ọ̀ bụghị ndị nọ n’ime ka unu na-ekpe ikpe?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “N’ihi na, gịnị ka ọ gbasara m ikpe ndị nọ n’èzí ikpe?”
    reason: lexical_alternative
  - marker: b
    text: Ya bụ, ndị nọ n’ime ọgbakọ.
    reason: cultural_note
lexical_decisions:
- source_word: τί γάρ μοι
  choice: N’ihi na gịnị ka ... metụtara m?
  rationale: Akpaalaokwu a na-ajụ ihe okwu ahụ metụtara Pọl ma ọ bụ ihe jikọrọ ya na ya. Nsụgharị a na-edobe ajụjụ nkwughachi ahụ na γάρ (“n’ihi na”) n’Igbo dị mfe nghọta.
- source_word: τοὺς ἔξω
  choice: ndị nọ n’èzí
  rationale: Ọ na-ezo aka n’ụdị mmekọrịta, ya bụ ndị na-anọghị n’ime ọgbakọ ndị kwere ekwe, ọ bụghị nanị ebe mmadụ guzo n’anụ ahụ.
- source_word: κρίνειν
  choice: ikpe ... ikpe
  rationale: N’ebe a κρίνω bụ ime mkpebi ikpe n’ihe gbasara ịdọ aka ná ntị n’ime ọgbakọ. Akpaokwu Igbo a na-edobe obosara na ike okwu Grik ahụ.
- source_word: οὐχὶ
  choice: Ọ̀ bụghị
  rationale: Ọ na-edobe ụdị ajụjụ na-atụ anya azịza nkwenye.
- source_word: τοὺς ἔσω
  choice: ndị nọ n’ime
  rationale: Ọ na-edobe ọdịiche doro anya ya na “ndị nọ n’èzí,” ma na-ezo aka ná ndị nọ n’ime obodo ụka.
- source_word: ὑμεῖς κρίνετε
  choice: ka unu na-ekpe ikpe
  rationale: Nhazi a na-egosi ibu ọrụ a tụrụ anya ya n’ajụjụ nkwughachi ahụ, ma ọ naghị agbanwe ya ka ọ bụrụ iwu e kwuru kpọmkwem.
theological_decisions:
- issue: Ma ọdịiche Pọl na-eme ọ̀ bụ n’etiti ndị nọ n’ime ụka na ndị nọ n’èzí n’ihe gbasara ikpe ịdọ aka ná ntị
  choice: E debere ọdịiche dị n’etiti “ndị nọ n’èzí” na “ndị nọ n’ime,” nke na-egosi na ikpe a a na-ekwu maka ya metụtara obodo ụka.
  alternative: Ịghọta ya dịka okwu sara mbara banyere ụdị ikpe omume ọma niile.
  rationale: Ọnọdụ 1 Ndị Kọrịnt 5:9–13 bụ ịdọ aka ná ntị n’ime ọgbakọ. Nsụgharị ahụ anaghị etinye nkwupụta ozizi sara mbara karịa ihe amaokwu ahụ kwuru.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji “ndị nọ n’èzí/ndị nọ n’ime” chekwaa ihe oyiyi na ọdịiche nke Grik; e tinyere akara ala [a] na [b] n’ederede.
