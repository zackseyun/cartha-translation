review_pass:
  verdict: revise
  source_fidelity: The inside/outside contrast and the rhetorical questions are retained. However, “ikpe ndị nọ n’èzí” can be read as “judgment of/on outsiders” rather than explicitly as Paul’s act of judging them. The revision makes the infinitival sense of κρίνειν unambiguous while retaining τί γὰρ μοι as a rhetorical question of personal concern.
  naturalness: The second question is clear and idiomatic Standard Igbo. The opening is improved by using a direct, natural expression for “what concern is it of mine to judge...,” rather than a nominal phrase whose participant relationship is unclear.
  terminology: “ndị nọ n’èzí” and “ndị nọ n’ime” appropriately preserve the relational contrast. “ekpe ... ikpe” is the customary Igbo expression for judging and is suitably broad for the disciplinary context. The community note is revised from the potentially less precise “obodo ụka” to “ọgbakọ.”
  issues:
  - severity: medium
    issue: The phrase “ikpe ndị nọ n’èzí” is structurally ambiguous.
    rationale: It may denote judgment concerning outsiders or judgment rendered upon them, without clearly expressing that Paul is speaking of judging outsiders. Greek κρίνειν takes τοὺς ἔξω as its object.
  - severity: low
    issue: Footnote [a] is not natural Standard Igbo.
    rationale: “gịnị ka mụ na ikpe ... nwere ime?” is a close structural calque and is less idiomatic than a direct alternative.
  - severity: low
    issue: Footnote [b] uses “obodo ụka,” which can be less precise for the intended community sense.
    rationale: “Ọgbakọ” directly conveys the congregation/community contrast in this context without implying a geographical settlement.
  revised_text: N’ihi na, olee ihe jikọrọ m na ikpe ndị nọ n’èzí ikpe? Ọ̀ bụghị ndị nọ n’ime ka unu na-ekpe ikpe?[a][b]
  revised_footnotes:
