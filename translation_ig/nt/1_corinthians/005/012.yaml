    text: Ma ọ bụ, “N’ihi na, gịnị ka ọ gbasara m ikpe ndị nọ n’èzí ikpe?”
    reason: lexical_alternative
  - marker: b
    text: Ya bụ, ndị nọ n’ime ọgbakọ.
    reason: cultural_note
  revision_rationale: The revision explicitly renders Paul’s judging of those outside, preserves the rhetorical force and the γάρ connection, and keeps the present-tense question about the Corinthians’ judging those inside. The note identifies the community referent without expanding the verse into a broader doctrinal statement.
