revisions:
- from: N’ihi na gịnị ka ikpe ndị nọ n’èzí metụtara m? Ọ̀ bụghị ndị nọ n’ime ka unu na-ekpe ikpe?[a][b]
  to: N’ihi na, olee ihe jikọrọ m na ikpe ndị nọ n’èzí ikpe? Ọ̀ bụghị ndị nọ n’ime ka unu na-ekpe ikpe?[a][b]
  rationale: The revision explicitly renders Paul’s judging of those outside, preserves the rhetorical force and the γάρ connection, and keeps the present-tense question about the Corinthians’ judging those inside. The note identifies the community referent without expanding the verse into a broader doctrinal statement.
