- from: Ma ọ bụ Chineke na-ekpe ndị nọ n’èzí ikpe.[a][b] “Wepụnụ onye ajọ omume ahụ n’etiti unu.”[c]
  to: Ma Chineke na-ekpe ndị nọ n’èzí ikpe.[a][b] “Wepụnụ onye ajọ omume ahụ n’etiti unu.”[c]
  rationale: 'A chọrọ naanị mgbanwe nchekwa na njikọ mmalite: “Ma Chineke” na-asụgharị δέ n’ụzọ ziri ezi dịka ọdịiche. A hapụrụ akụkụ ndị ọzọ na ihe ndetu ha dịka ha dị n’uche na isi Grik, ebe a na-eme ka nkọwa nke ndetu Deuterọnọmi bụrụ nke ziri ezi ma ghara ikwubiga okwu ókè.'
