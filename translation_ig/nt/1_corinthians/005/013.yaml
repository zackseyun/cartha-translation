base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/013.yaml
  text: But God judges those outside[c][b][a]. Remove the evil person from among yourselves.
translation:
  language: ig
  text: Ma Chineke na-ekpe ndị nọ n’èzí ikpe.[a][b] “Wepụnụ onye ajọ omume ahụ n’etiti unu.”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị na-abụghị ndị ọgbakọ.”
    reason: lexical_alternative
  - marker: b
    text: Ngwaa Grik dị n’oge ugbu a (“na-ekpe ikpe”), ọ bụ ezie na ụfọdụ nsụgharị na-asụ ya dịka “ga-ekpe ikpe” n’ihi ọnọdụ okwu ahụ.
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “Chụpụnụ onye ajọ omume ahụ n’etiti unu.” Okwu a na-ekwughachi usoro okwu n’Akwụkwọ Deuterọnọmi nke na-enye iwu iwepụ ihe ọjọọ n’etiti ndị ọgbụgba ndụ.
    reason: cross_reference
lexical_decisions:
- source_word: τοὺς ... ἔξω
  choice: ndị nọ n’èzí
  rationale: Nkebiokwu a na-ezo aka n’ụmụ mmadụ na-abụghị ndị nọ n’ime ọgbakọ; nsụgharị a na-edobe echiche nke ‘ndị nọ n’èzí’ n’etinyeghị nkọwa ọzọ.
- source_word: δὲ
  choice: Ma ọ bụ
  rationale: Ọ na-egosi ọdịiche dị nro n’etiti ikpe ndị nọ n’ime ọgbakọ na ikpe ndị nọ n’èzí.
- source_word: κρίνει
  choice: na-ekpe ... ikpe
  rationale: E debere ngwaa ahụ n’oge ugbu a dịka ọ dị n’asụsụ Grik, kama ịgbanwe ya gaa n’oge ọdịnihu.
- source_word: ἐξάρατε
  choice: Wepụnụ
  rationale: Iwu a chọrọ ka ọgbakọ mee ihe doro anya ozugbo, ma nsụgharị ahụ anaghị atụkwasị usoro nchịkwa ụka nke na-adịghị n’ihe odide ahụ.
- source_word: τὸν πονηρὸν
  choice: onye ajọ omume ahụ
  rationale: Ọ na-egosi otu onye a kpọtụrụ aha n’ọnọdụ a ma na-edobe nkọwa omume ọjọọ ya; Igbo anaghị achọ ka e tinye okike nwoke n’aha a.
- source_word: ἐξ ὑμῶν αὐτῶν
  choice: n’etiti unu
  rationale: Nke a bụ ụzọ Igbo dị mfe ma bụrụ ihe e ji eme ihe maka iwepụ mmadụ n’ime otu obodo ma ọ bụ ọgbakọ.
theological_decisions:
- issue: Ụdị iwu gbasara ịdọ aka ná ntị n’ọgbakọ
  choice: Ọgbakọ ga-ewepụ onye ajọ omume ahụ n’etiti ha, ebe ikpe ndị nọ n’èzí bụ nke Chineke.
  alternative: A pụrụ ịghọta iwu ahụ n’ụzọ sara mbara dịka iwepụ ihe ọjọọ n’obodo ahụ n’ekwughị kpọmkwem nchụpụ mmadụ.
  rationale: Ọnọdụ 1 Ndị Kọrịnt 5 na-ekwu maka otu onye nọ n’ime ọgbakọ ma na-eme ka ndị nọ n’ime dị iche na ndị nọ n’èzí. Nsụgharị ahụ na-egosi iwepụ onye ahụ, ma ọ naghị ebubata okwu ọchịchị ụka e mepụtara n’oge ọzọ.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma doo ndị nkịtị anya. E jiri ọtụtụ ‘unu’ nke iwu mee ka iwu e nyere ọgbakọ dum pụta ìhè. Akara ụkwụ ndetu dị ozugbo n’akụkụ okwu ha na-akọwa.
