review_pass:
  verdict: revise
  source_fidelity: The rendering of κρίνει as “na-ekpe ... ikpe” accurately preserves the present tense, and “Wepụnụ onye ajọ omume ahụ n’etiti unu” faithfully conveys the decisive plural imperative and communal removal. However, δέ is a mild adversative here (“but/now”), not a disjunctive “or”; therefore “Ma ọ bụ Chineke” misrepresents the Greek connection.
  naturalness: Apart from the opening connective, the wording is clear, idiomatic Standard Igbo, and appropriately direct. “Ma Chineke” is the natural contrastive opening.
  terminology: “ndị nọ n’èzí,” “na-ekpe ... ikpe,” and “onye ajọ omume ahụ” are suitable and preserve the contextual reference without importing formal church-disciplinary terminology. The Deuteronomy note is appropriate, though it should describe the echoed purge formula without making the wording sound more exact than it is.
  issues:
  - severity: high
    issue: “Ma ọ bụ Chineke” translates δέ as ‘but or’ / ‘or,’ creating an incorrect disjunction.
    rationale: δέ contrasts God’s judging of outsiders with the congregation’s responsibility toward the person within. Standard Igbo “Ma Chineke” expresses this contrast; “Ma ọ bụ” means ‘or’ and changes the sense.
  revised_text: Ma Chineke na-ekpe ndị nọ n’èzí ikpe.[a][b] “Wepụnụ onye ajọ omume ahụ n’etiti unu.”[c]
