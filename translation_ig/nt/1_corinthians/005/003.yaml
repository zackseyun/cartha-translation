source:
  edition: SBLGNT
  text: Ἐγὼ μὲν γάρ, ⸀ἀπὼν τῷ σώματι παρὼν δὲ τῷ πνεύματι, ἤδη κέκρικα ὡς παρὼν τὸν οὕτως τοῦτο κατεργασάμενον
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/003.yaml
  text: For I[a], though absent in body but present in spirit, have already judged, as though present[b], the one who has done this thing.
translation:
  language: ig
  text: N’ihi na mụ onwe m, ọ bụ ezie na anọghị m n’ahụ́ ma anọ m na mmụọ[b], ekpeworị m onye mere ihe a n’ụzọ dị otu a ikpe[a], dị ka a ga-asị na m nọ n’ebe ahụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ekpebiela m ikpe.”
    reason: lexical_alternative
  - marker: b
    text: O yikarịrị ka “anọ m na mmụọ” na-ekwu maka mmụọ Pọl n’onwe ya, ọ bụghị Mmụọ Nsọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγὼ μὲν γάρ
  choice: N’ihi na mụ onwe m
  rationale: “N’ihi na” na-egosi njikọ nkọwa γάρ nwere n’ihe bu ụzọ; “mụ onwe m” na-echekwa nkwusiri ike dị na Ἐγώ na μὲν.
- source_word: ἀπὼν τῷ σώματι
  choice: ọ bụ ezie na anọghị m n’ahụ́
  rationale: Nke a na-egosi na Pọl anọghị n’ebe ahụ n’anụ ahụ, n’enweghị echiche na ọ nwụrụ ma ọ bụ na mkpụrụ obi ya kewapụrụ n’ahụ́.
- source_word: παρὼν δὲ τῷ πνεύματι
  choice: ma anọ m n’ime mmụọ
  rationale: Ọ na-echekwa ntụnyere ahụ́ na mmụọ ma hapụ okwu ahụ ka ọ nwee obosara ọ nwere n’asụsụ Grik.
- source_word: ἤδη κέκρικα
  choice: ekpebiela m ... ikpe
  rationale: Ụdị perfect nke κέκρικα na-egosi mkpebi ikpe e mewororị nke ka na-adị ire; “ekpebiela m ... ikpe” bụ Igbo doro anya ma kwekọọ n’ọnọdụ ịdọ aka ná ntị a.
- source_word: ὡς παρὼν
  choice: dị ka a ga-asị na m nọ ya
  rationale: 'Nke a na-echekwa ike ntụnyere ὡς: Pọl ekpeela ikpe dịka onye nọ n’ebe ahụ n’onwe ya.'
- source_word: τὸν ... κατεργασάμενον
  choice: onye mere
  rationale: Participial ahụ na-arụ ọrụ dịka aha onye ahụ; “onye mere” adịghị atụkwasị nwoke n’ebe Grik na-ekwughị ya kpọmkwem.
- source_word: οὕτως τοῦτο
  choice: ihe a
  rationale: “Ihe a” bụ ụzọ Igbo dị ndụ isi zoo aka n’omume ihere a kọwara n’amaokwu gara aga; ịsụgharị οὕτως iche n’ebe a ga-eme ka ahịrịokwu ahụ daa arọ ma ọ bụ bụrụ ihe na-adịghị eke.
theological_decisions:
- issue: Ihe “anọ m n’ime mmụọ” pụtara
  choice: E debere akpaokwu ahụ n’enweghị ịkọwa ya n’ime amaokwu; n’ọnọdụ a o yikarịrị ka ọ bụ mmụọ Pọl n’onwe ya, ya bụ, ọ bụ ezie na ọ nọghị n’anụ ahụ, uche ya na mkpebi ya nọnyere nzukọ ahụ.
  alternative: Ọ pụrụ izo aka na ọnụnọ ma ọ bụ nghọta sitere n’aka Mmụọ Nsọ, ma ọ bụ n’ụdị ọnụnọ ime mmụọ siri ike karị.
  rationale: Enweghị article n’ihu πνεύματι, tinyere ntụnyere ya na σώματι, na-akwado mmụọ Pọl n’onwe ya; ma ntụgharị ahụ ekwesịghị imechi mgbagwoju anya niile dị n’okwu ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ usoro okwu na-asụ asụ nke ọma n’Igbo, ma debe ọdịiche dị n’etiti ahụ́ na mmụọ yana ike mkpebi ikpe Pọl. Akara nkọwa ala ala [a] na [b] abụọ pụtara n’ederede isi.
