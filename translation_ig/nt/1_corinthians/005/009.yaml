  text: Ἔγραψα ὑμῖν ἐν τῇ ἐπιστολῇ μὴ συναναμίγνυσθαι πόρνοις,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/009.yaml
  text: I wrote to you in the letter not to associate with sexually immoral people[c][b][a],
translation:
  language: ig
  text: N’akwụkwọ ozi ahụ, agwara m unu ka unu ghara iso ndị na-eme omume rụrụ arụ n’ihe banyere mmekọahụ na-akpakọrịta.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’akwụkwọ ozi m.” Okwu Grik ahụ nwere ike izo aka n’akwụkwọ ozi Pọl zigara ha na mbụ ma ọ bụ n’akwụkwọ ozi a n’onwe ya, n’akụkụ e dere tupu akụkụ a.
    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ, “ka unu na ha ghara ịdị na-anọkọ” ma ọ bụ “ka unu ghara ịgwakọta onwe unu na ha.”
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “ndị omume mmekọahụ ha rụrụ arụ.” Okwu Grik πόρνοις na-ezo aka ná ndị e ji omume rụrụ arụ n’ihe banyere mmekọahụ mara.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔγραψα
  choice: Edere m
  rationale: Oge aorist indicative na-egosi omume ide ihe dị ka ihe mere eme; ‘Edere m’ bụ ụzọ Igbo doro anya na nke nkịtị isi kwuo ya.
- source_word: ὑμῖν
  choice: unu
  rationale: Ọ bụ nnọchiaha dative plural na-egosi ndị e degaara akwụkwọ ozi ahụ.
- source_word: ἐν τῇ ἐπιστολῇ
  choice: n’akwụkwọ ozi ahụ
  rationale: Akara njirimara Grik na-arụtụ aka n’akwụkwọ ozi ndị Kọrịnt maara, ma okwu ahụ n’onwe ya ekpebighị ma ọ bụ akwụkwọ ozi gara aga ka ọ bụ akwụkwọ ozi a.
- source_word: μὴ συναναμίγνυσθαι
  choice: ka unu ... ghara ịdị na-akpakọrịta
  rationale: Nke a na-egosi ọdịnaya iwu Pọl nyere, ma na-ejigide echiche nke iso ndị ọzọ na-emekọ ma ọ bụ ịnọkọ ha mgbe niile.
- source_word: πόρνοις
  choice: ndị na-eme omume rụrụ arụ n’ihe gbasara mmekọahụ
  rationale: Okwu ahụ na-ezo aka n’ụmụ mmadụ e ji omume mmekọahụ rụrụ arụ mara; ntụgharị a doro ndị na-agụ Igbo nke oge a anya ma zere okwu ochie ma ọ bụ nke dị warara.
theological_decisions:
- issue: Ihe ‘akwụkwọ ozi ahụ’ na-ezo aka na ya
  choice: A hapụrụ ya ka ọ bụrụ akwụkwọ ozi Pọl na ndị Kọrịnt maara, n’ekpebighị ma ọ bụ nke gara aga ka ọ bụ nke a.
  alternative: Ọ nwere ike ịbụ akwụkwọ ozi mbụ furu efu, ma ọ bụ akụkụ mbụ nke 1 Ndị Kọrịnt.
  rationale: ἐν τῇ ἐπιστολῇ bụ okwu a kapịrị ọnụ, ma ọ naghị edozi ajụjụ ahụ n’onwe ya; ya mere ntụgharị ahụ na-echekwa nghọtahie abụọ ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Nhazi ahịrịokwu ahụ bụ nke Igbo ebumpụta ụwa, ebe okwu gbasara mmekọahụ doro anya ma ghara ịbụ okwu mkparị; e chekwara mgbagwoju anya dị n’ebe ‘akwụkwọ ozi ahụ’ na-ezo aka.
