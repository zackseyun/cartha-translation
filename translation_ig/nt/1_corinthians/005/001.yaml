revisions:
- from: 'A na-anụ n’ezie na omume rụrụ arụ n’ihe gbasara mmekọahụ dị n’etiti unu, ọbụna ụdị omume rụrụ arụ ahụ nke a na-adịghị ahụ ọbụna n’etiti ndị mba ọzọ[a]: otu nwoke na nwunye nna ya na-enwe mmekọahụ[b].'
  to: 'N’ezie, a na-akọ na omume mmekọahụ rụrụ arụ dị n’etiti unu, ọbụna ụdị omume mmekọahụ rụrụ arụ nke a na-adịghị ahụ ọbụna n’etiti ndị mba ọzọ[a]: otu nwoke na nwunye nna ya na-enwe mmekọahụ[b].'
  rationale: The revision improves Standard Igbo idiom while preserving the source’s emphasis, public-report sense, qualitative comparison, non-pejorative designation of the nations/Gentiles, and the deliberately non-specific phrase “his father’s wife.” The main text explicitly states the sexual relationship because the Greek euphemism has no equally clear, natural direct counterpart in this Igbo construction; the literal wording is supplied in footnote b.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T18:11:12Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the reported sexual offense, its exceptional character, the reference to the Gentiles, and the relationship described as a father's wife. However, “A na-anụ n’ezie” can sound like a claim that the report is true rather than Paul’s emphatic “actually/in fact,” and the repeated expanded phrase is somewhat cumbersome.
  naturalness: “N’ezie, a na-akọ...” is more idiomatic for a publicly reported matter and places the emphatic discourse marker naturally. “Omume mmekọahụ rụrụ arụ” is a clearer, less cumbersome Standard Igbo expression. The explicit final clause is retained because a bare literal rendering of ἔχειν would be unclear in Igbo.
  terminology: “Ndị mba ọzọ” suitably renders ἔθνη without the more evaluative “ndị na-ekpere arụsị.” “Nwunye nna ya” preserves the Greek wording and does not over-specify “stepmother.”
  issues:
  - severity: medium
    issue: Placement and sense of n’ezie
    rationale: 'In “A na-anụ n’ezie,” n’ezie most readily modifies the truth of what is heard. Initial “N’ezie” better represents ὅλως as an emphatic reaction: “Actually/In fact.”'
  - severity: low
    issue: Cumbersome repetition of the sexual-conduct expression
    rationale: “Omume rụrụ arụ n’ihe gbasara mmekọahụ” is understandable, but “omume mmekọahụ rụrụ arụ” is more natural and is retained in both occurrences for clear reference to πορνεία.
  revised_text: 'N’ezie, a na-akọ na omume mmekọahụ rụrụ arụ dị n’etiti unu, ọbụna ụdị omume mmekọahụ rụrụ arụ nke a na-adịghị ahụ ọbụna n’etiti ndị mba ọzọ[a]: otu nwoke na nwunye nna ya na-enwe mmekọahụ[b].'
