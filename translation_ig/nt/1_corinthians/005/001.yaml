id: 1CO.5.1
reference: 1 Corinthians 5:1
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ὅλως ἀκούεται ἐν ὑμῖν πορνεία, καὶ τοιαύτη πορνεία ἥτις οὐδὲ ἐν τοῖς ⸀ἔθνεσιν, ὥστε γυναῖκά τινα τοῦ πατρὸς ἔχειν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/001.yaml
  text: 'It is actually reported that there is sexual immorality among you, and sexual immorality of such a kind as is not even found among the Gentiles: a man has his father’s wife.'
translation:
  language: ig
  text: 'N’ezie, a na-akọ na omume mmekọahụ rụrụ arụ dị n’etiti unu, ọbụna ụdị omume mmekọahụ rụrụ arụ nke a na-adịghị ahụ ọbụna n’etiti ndị mba ọzọ[a]: otu nwoke na nwunye nna ya na-enwe mmekọahụ[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’etiti mba dị iche iche”; ụfọdụ nsụgharị na-asị, “n’etiti ndị na-ekpere arụsị.”
    reason: lexical_alternative
  - marker: b
    text: N’ụzọ nkịtị, “inwe nwunye nna ya”; ya bụ, ya na nwunye nna ya inwe mmekọahụ. O nwere ike ịbụ nne nkuchi ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅλως
  choice: n’ezie
  rationale: N’ebe a, okwu ahụ na-egosi nkwusi ike na ihe ijuanya Pọl nwere, ọ bụghị ‘kpamkpam’ n’echiche ọnụọgụ.
- source_word: ἀκούεται
  choice: A na-anụ
  rationale: Ụdị ngwaa a na-egosi na a na-akọ ma ọ bụ na akụkọ ahụ eruola ndị mmadụ; ‘A na-anụ’ bụ ụzọ Igbo dị mkpirikpi ma kwekọọ na isi mmalite.
- source_word: ἐν ὑμῖν
  choice: n’etiti unu
  rationale: Nke a na-egosi na ihe ahụ na-eme n’ime ọgbakọ ndị Kọrịnt.
- source_word: πορνεία
  choice: omume rụrụ arụ n’ihe gbasara mmekọahụ
  rationale: Nke a na-ekpuchi omume mmekọahụ ndị iwu Chineke na omume ọma jụrụ, na-enweghị ime ka okwu ahụ bụrụ naanị otu ụdị mmehie.
- source_word: τοιαύτη πορνεία
  choice: ụdị omume rụrụ arụ ahụ
  rationale: Ọ na-echekwa nkwusi ike nke τοιαύτη banyere ụdị omume ahụ dị egwu.
- source_word: οὐδὲ ἐν τοῖς ἔθνεσιν
  choice: a na-adịghị ahụ ọbụna n’etiti ndị mba ọzọ
  rationale: ‘Ndị mba ọzọ’ na-echekwa ọdịiche ndị Juu na ndị na-abụghị Juu nke ἔθνη; ‘a na-adịghị ahụ’ bụ mmeju asụsụ Igbo iji mee ka ahịrịokwu ahụ doo anya.
- source_word: ὥστε
  choice: ':'
  rationale: Akara kọlọ́n na-ewebata nkọwa kpọmkwem nke akụkọ ahụ n’ụzọ dị mma n’Igbo.
- source_word: γυναῖκά τινα τοῦ πατρὸς
  choice: nwunye nna ya
  rationale: Nke a bụ ntụgharị kpọmkwem karịa ‘nne di ya’ ma ọ bụ ‘nne nkuchi ya,’ bụ́ ndị nwere ike itinye nkọwa nke Grik ekwughị.
- source_word: ἔχειν
  choice: na ... na-enwe mmekọahụ
  rationale: N’ọnọdụ a, ἔχειν bụ okwu e ji zoro aka n’inwe nwanyị ahụ dịka onye mmekọahụ; ịsụ ya nke ọma n’Igbo na-ezere nghọtahie dịka nanị ibikọ ọnụ ma ọ bụ inwe ihe.
theological_decisions:
- issue: Ma a ga-asụgharị ἔθνεσιν dịka ndị mba ọzọ, mba dị iche iche, ma ọ bụ ndị na-ekpere arụsị
  choice: ndị mba ọzọ
  alternative: ndị na-ekpere arụsị
  rationale: Okwu Grik ahụ na-akọwa ndị na-abụghị ndị Juu, ma ọ dịghị n’onwe ya kpọọ ha aha n’ụzọ mkparị ma ọ bụ kwuo kpọmkwem na ha niile na-ekpere arụsị.
- issue: Ma a ga-akpọ nwanyị ahụ nne nkuchi ya
  choice: nwunye nna ya
  alternative: nne nkuchi ya
  rationale: Ọ bụ ezie na ọ pụrụ ịbụ nne nkuchi nwoke ahụ, Grik ji ‘nwunye nna ya’ mee ihe; nke a na-echekwa ihe isi mmalite kwuru n’enweghị itinye nkọwa ọzọ.
- issue: Ma a ga-edowe ἔχειν n’ụdị okwu nkịtị ‘o nwere’
  choice: na nwunye nna ya na-enwe mmekọahụ
  alternative: o nwere nwunye nna ya
  rationale: N’Igbo, ‘o nwere nwunye nna ya’ nwere ike ịghara ịkọwa ụdị mmekọrịta a na-ekwu maka ya. Nhọrọ a na-eme ka okwu nzuzo Grik pụta ìhè n’enweghị ịkọwa karịa ọnọdụ ahụ chọrọ.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ugwu ma doo ndị nkịtị anya. A hapụrụ okwu ‘nwunye nna ya’ ka ọ ghara itinye mmekọrịta ezinụlọ nke isi mmalite ekwughị kpọmkwem; a kọwara ἔχειν n’ụzọ doro anya n’ahịrị bụ isi n’ihi na ntụgharị nkịtị agaghị abụ ihe e ji asụ otu echiche ahụ n’Igbo.
