  text: ἐν τῷ ὀνόματι τοῦ κυρίου ἡμῶν ⸀Ἰησοῦ, συναχθέντων ὑμῶν καὶ τοῦ ἐμοῦ πνεύματος σὺν τῇ δυνάμει τοῦ κυρίου ἡμῶν ⸁Ἰησοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/004.yaml
  text: In the name of our Lord Jesus[a], when you are assembled, and my spirit is with you, with the power of our Lord Jesus,
translation:
  language: ig
  text: N’aha Onyenwe anyị Jizọs[a], mgbe unu zukọtara, mmụọ m esoro unu nọrọ, ya na ike nke Onyenwe anyị Jizọs,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ, “mgbe unu na mmụọ m zukọtara, ya na ike nke Onyenwe anyị Jizọs.” N’asụsụ Grik, okwu a dị mkpirikpi: ọ na-ejikọta “unu” na “mmụọ m” n’usoro okwu oge, ma o doghị anya kpọmkwem otú e si aghọta njikọ ahụ n’Igbo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῷ ὀνόματι
  choice: N’aha
  rationale: Nke a bụ akpaala okwu Igbo kwekọrọ n’okwu Grik; ọ na-echekwa echiche ime ihe n’aha Jizọs na n’okpuru ikike ya n’akọwaghị ya karịa ihe ederede kwuru.
- source_word: κυρίου
  choice: Onyenwe
  rationale: “Onyenwe” bụ aha nsọpụrụ a na-eji n’Igbo maka κύριος, ma na-echekwa ịdị arọ nke aha ahụ mgbe a na-ekwu maka Jizọs.
- source_word: Ἰησοῦ
  choice: Jizọs
  rationale: E dere aha onye ahụ dịka omenala nsụgharị Igbo si dị.
- source_word: συναχθέντων ὑμῶν
  choice: mgbe unu zukọtara
  rationale: E gosipụtara aorist passive participle dị na genitive absolute dịka nkebiokwu oge nke na-ada nke ọma n’Igbo, n’enweghị ịkọwapụta ma ndị ahụ kpọkọtara onwe ha ma ọ bụ na e mere ka ha zukọta.
- source_word: τοῦ ἐμοῦ πνεύματος
  choice: mmụọ m esoro unu nọrọ
  rationale: Okwu Grik dị mkpirikpi ma hapụ ụfọdụ ihe n’aghọtaghị anya; ntụgharị a na-eme ka ọnụnọ Pọl n’ụzọ na-abụghị nke anụ ahụ doo anya, ma ọ naghị akọwa otú ọnụnọ ahụ si arụ ọrụ.
- source_word: σὺν
  choice: tinyere
  rationale: “Tinyere” na-egosi iso ma ọ bụ ịdịkọ ọnụ n’ụzọ doro anya ma dabara n’usoro ahịrịokwu Igbo a.
- source_word: δυνάμει
  choice: ike
  rationale: “Ike” na-echekwa isi echiche δύναμις dịka ike na-arụpụta ihe, kama ịbelata ya ka ọ bụrụ naanị ikike iwu.
- source_word: τοῦ κυρίου ἡμῶν Ἰησοῦ
  choice: nke Onyenwe anyị Jizọs
  rationale: E chekwara genitive nke Grik n’ụzọ sara mbara, ka okwu ahụ nwee ike igosi na ike ahụ bụ nke Jizọs ma ọ bụ sitere n’aka ya n’enweghị ịhọrọ otu nkọwa naanị.
theological_decisions:
- issue: Ụdị ọnụnọ Pọl n’ọgbakọ ahụ
  choice: “mmụọ m esoro unu nọrọ” na-egosi na Pọl na-ekwu na ya na ha nọ n’ezie n’ụzọ na-abụghị ọnụnọ anụ ahụ.
  alternative: A pụrụ ịghọta “mmụọ m” dịka naanị uche ma ọ bụ nkwenye Pọl, ma ọ bụ dịka ọnụnọ ime mmụọ siri ike karịa nke ahụ.
  rationale: Ederede ahụ ekwughị otú ọnụnọ a si arụ ọrụ. Ya mere, ntụgharị ahụ na-echekwa nkwupụta Pọl na esemokwu nkọwa dị na ya n’etinyeghị ozizi pụrụ iche.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. Ahịrịokwu ahụ ka bụ akụkụ nke ahịrịokwu na-aga n’ihu n’amaokwu na-esote, ya mere e mechiri ya na rikoma dịka isi mmalite ahụ si dị.
