id: 1CO.5.5
reference: 1 Corinthians 5:5
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: παραδοῦναι τὸν τοιοῦτον τῷ Σατανᾷ εἰς ὄλεθρον τῆς σαρκός, ἵνα τὸ πνεῦμα σωθῇ ἐν τῇ ἡμέρᾳ τοῦ ⸀κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/005.yaml
  text: to hand such a man over to Satan for the destruction of the flesh[b][a], so that the spirit may be saved in the day of the Lord.
translation:
  language: ig
  text: ka e nyefee onye dị otu a n’aka Setan maka mbibi nke anụ ahụ,[a] ka e wee zọpụta mmụọ ahụ n’ụbọchị Onyenwe anyị.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “maka ịla n’iyi nke anụ ahụ.” Okwu a nwere ike izo aka n’ikpe siri ike dakwasịrị ahụ mmadụ, ma ọ bụ, n’ụzọ ihe atụ, na mbibi nke ọchịchọ na ụzọ ndụ mmehie nke nwoke ahụ.
    reason: lexical_alternative
  - marker: b
    text: Ụfọdụ akwụkwọ aka ochie dere “Onyenwe anyị Jizọs” ma ọ bụ “Onyenwe Jizọs” kama nanị “Onyenwe anyị.”
    reason: textual_variant
lexical_decisions:
- source_word: παραδοῦναι
  choice: ka e nyefee ... n’aka
  rationale: Nke a na-egosipụta inyefe onye ahụ n’aka Setan n’ụzọ Igbo doro anya, ma na-edobe ike nke παραδίδωμι.
- source_word: τὸν τοιοῦτον
  choice: onye dị otu a
  rationale: Ọ na-ezo aka n’otu nwoke ahụ a kpọtụrụ aha ma na-edobekwa ụda nke ịkọwa ụdị onye ahụ, n’etinyeghị nkọwa ọzọ.
- source_word: Σατανᾷ
  choice: Setan
  rationale: A sụgharịrị aha ahụ dịka e si akpọkarị ya n’Igbo.
- source_word: εἰς ὄλεθρον
  choice: maka mbibi
  rationale: “Mbibi” na-edobe ịdị arọ nke ὄλεθρος, ma ọ naghị ekpebi ma ọ bụ mbibi anụ ahụ, ọdịda, ma ọ bụ ahụhụ siri ike.
- source_word: τῆς σαρκός
  choice: nke anụ ahụ
  rationale: '“Anụ ahụ” na-edobe nghọta abụọ σάρξ nwere ike inwe ebe a: ahụ mmadụ ma ọ bụ ọchịchọ na ụzọ ndụ nke mmehie.'
- source_word: ἵνα
  choice: ka e wee
  rationale: Ọ na-egosi ebumnuche ma ọ bụ nsonaazụ e bu n’obi, dịka ἵνα si arụ ọrụ n’ahịrịokwu ahụ.
- source_word: τὸ πνεῦμα
  choice: mmụọ ahụ
  rationale: E tinyeghị “ya” n’ihi na Grik enweghị nnọchiaha nwe; “mmụọ ahụ” na-edobe njide ahụ ma ka bụrụ Igbo eke.
- source_word: σωθῇ
  choice: zọpụta
  rationale: Ụdị a na-edobe echiche nke nzọpụta na olu nnara nke σωθῇ n’usoro Igbo “ka e wee zọpụta.”
- source_word: ἐν τῇ ἡμέρᾳ
  choice: n’ụbọchị
  rationale: Nke a bụ ụzọ Igbo eke si kwuo oge ahụ ma kwekọọ n’okwu gbasara ụbọchị ikpeazụ.
- source_word: τοῦ κυρίου
  choice: Onyenwe anyị
  rationale: A sụgharịrị κύριος n’ụdị nsọpụrụ a na-ahụkarị n’Igbo, na-enweghị ịgbakwunye “Jizọs” nke adịghị na ederede SBLGNT a.
theological_decisions:
- issue: Ihe “mbibi nke anụ ahụ” pụtara
  choice: E debere okwu ahụ dịka “mbibi nke anụ ahụ” n’isi ederede.
  alternative: Ọ nwere ike ịpụta ahụhụ siri ike ma ọ bụ ọnwụ nke anụ ahụ, ma ọ bụ mbibi nke ọchịchọ na ụzọ ndụ mmehie.
  rationale: Grik anaghị ekpebi otu nghọta n’ime ha; ya mere nsụgharị ahụ na-edobe mgbagwoju anya na esemokwu nkọwa ahụ.
- issue: Onye “mmụọ ahụ” na-ezo aka na ya
  choice: E dere “mmụọ ahụ” n’etinyeghị “ya.”
  alternative: “mmụọ ya”
  rationale: Ọ bụ ezie na gburugburu okwu ahụ na-atụ aro mmụọ onye mejọrọ ahụ, Grik etinyeghị nnọchiaha nwe, ya mere a naghị agbakwunye ya.
- issue: Okwu gbasara ọgwụgwụ oge “ụbọchị Onyenwe anyị”
  choice: A sụgharịrị ederede bụ isi dịka “ụbọchị Onyenwe anyị.”
  alternative: “ụbọchị Onyenwe anyị Jizọs” ma ọ bụ “ụbọchị Onyenwe anyị Jizọs Kraịst” dịka ụfọdụ akaebe ederede si dị.
  rationale: Ederede SBLGNT e nyere nwere naanị κυρίου; a naghị agbasawanye ya n’isi ederede.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. A họọrọ “onye dị otu a” na “nyefee ... n’aka” maka ịdị eke; e debere “anụ ahụ” na “mmụọ ahụ” iji ghara idozi ihe Grik hapụrụ ka ọ nwee nkọwa karịrị otu.
