review_pass:
  verdict: revise
  source_fidelity: 'The final clause in the draft is not grammatically faithful to the passive Greek ἐτύθη (“was sacrificed”): “e jirila Mesaya ... chụọ aja” means that Messiah/the lamb was used to offer a sacrifice, rather than that Messiah was offered as a sacrifice. The revision uses the Igbo passive sacrifice construction “a chụọla ... aja.” The supplied “nwa atụrụ” remains interpretive but is responsibly qualified by footnote a, preserving the Greek’s literal “our Passover.”'
  naturalness: The revised wording is clear Standard Igbo, retains the plural imperative, and improves the final clause's idiomatic syntax. “Ogbe ntụ ọka ọhụrụ” communicates νέον φύραμα without the unnecessary added participial description “a gwakọtara.”
  terminology: “Mesaya” appropriately represents Χριστός as a title in this context. “Ngabiga” and “nwa atụrụ Ngabiga” preserve the Passover imagery. Footnote b is adjusted to say explicitly that Christos is a Greek word, rather than implying that Greek itself is Christos.
  issues:
  - severity: high
    issue: The construction “e jirila Mesaya, nwa atụrụ Ngabiga anyị, chụọ aja” reverses the sacrificial relation.
    rationale: It means “Messiah, our Passover lamb, has been used to offer a sacrifice,” whereas ἐτύθη states that Christ/Messiah was sacrificed.
  - severity: low
    issue: “a gwakọtara” adds an explicit descriptive element to φύραμα.
    rationale: A batch/dough is inherently mixed; removing it is more concise and stays closer to the source.
  - severity: low
    issue: Footnote b begins “Grik bụ Christos.”
    rationale: This is imprecise Igbo phrasing; “Okwu Grik bụ Christos” accurately identifies Christos as the Greek term.
  revised_text: Kpochapụnụ ihe iko achịcha ochie ahụ, ka unu wee bụrụ ogbe ntụ ọka ọhụrụ, dịka unu bụ ndị na-enweghị ihe iko achịcha. N’ihi na a chụọla Mesaya[b], nwa atụrụ Ngabiga anyị[a], aja.
  revised_footnotes:
  - marker: a
    text: N’asụsụ Grik, okwu ya bụ naanị “Ngabiga anyị.” N’ebe a, a pụrụ ịghọta ya dịka okwu dị mkpirikpi maka nwa atụrụ Ngabiga ma ọ bụ aja Ngabiga.
    reason: lexical_alternative
  - marker: b
    text: Okwu Grik bụ Christos, nke pụtara “Onye E Tere Mmanụ.” A sụgharịrị ya “Mesaya” n’ebe a n’ihi na ọ pụtara dịka utu aha n’ọnọdụ Ngabiga a.
    reason: alternative_reading
  revision_rationale: The necessary correction restores the passive sacrificial meaning of ἐτύθη. Minor adjustments make the dough metaphor and footnote phrasing more natural while retaining the source's purpose/result clause, its present description of the readers as unleavened, and the documented ambiguity of τὸ πάσχα ἡμῶν.
