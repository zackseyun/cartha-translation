id: 1CO.5.7
reference: 1 Corinthians 5:7
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐκκαθάρατε τὴν παλαιὰν ζύμην, ἵνα ἦτε νέον φύραμα, καθώς ἐστε ἄζυμοι. καὶ γὰρ τὸ πάσχα ⸀ἡμῶν ἐτύθη Χριστός·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/007.yaml
  text: Clean out the old leaven[a], so that you may be a new batch, just as you are unleavened. For Messiah, our Passover lamb[b], has been sacrificed.
translation:
  language: ig
  text: Kpochapụnụ ihe iko achịcha ochie ahụ, ka unu wee bụrụ ogbe ntụ ọka ọhụrụ, dịka unu bụ ndị na-enweghị ihe iko achịcha. N’ihi na a chụọla Mesaya[b], nwa atụrụ Ngabiga anyị[a], aja.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’asụsụ Grik, okwu ya bụ naanị “Ngabiga anyị.” N’ebe a, a pụrụ ịghọta ya dịka okwu dị mkpirikpi maka nwa atụrụ Ngabiga ma ọ bụ aja Ngabiga.
    reason: lexical_alternative
  - marker: b
    text: Okwu Grik bụ Christos, nke pụtara “Onye E Tere Mmanụ.” A sụgharịrị ya “Mesaya” n’ebe a n’ihi na ọ pụtara dịka utu aha n’ọnọdụ Ngabiga a.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκκαθάρατε
  choice: Kpochapụnụ
  rationale: Okwu iwu a dị n’ụdị ọtụtụ ma na-enye iwu ka e wepụ ihe ahụ kpamkpam; “kpochapụnụ” na-egosipụta ike na ịdị ngwa nke iwu ahụ n’Igbo dị ugbu a.
- source_word: παλαιὰν ζύμην
  choice: ihe iko achịcha ochie ahụ
  rationale: “Ihe iko achịcha” bụ okwu Igbo doro anya maka ihe na-eme ka ntụ ọka koo; idebe ya na-echekwa ihe atụ Ngabiga Pọl ji mee ihe.
- source_word: ἵνα ἦτε
  choice: ka unu wee bụrụ
  rationale: Nke a na-egosipụta ebumnuche ma ọ bụ nsonaazụ e zubere, na-enweghị ikpochapụ esemokwu dị n’etiti iwu ka ha bụrụ ihe ọhụrụ na nkwupụta na ha adịlarị n’enweghị ihe iko achịcha.
- source_word: νέον φύραμα
  choice: ogbe ntụ ọka ọhụrụ a gwakọtara
  rationale: φύραμα bụ ntụ ọka a gwakọtara ọnụ, ma ọ bụ otu ogbe ya. Nsụgharị a na-eme ka ihe atụ ime achịcha doo onye Igbo nke oge a anya.
- source_word: καθώς ἐστε ἄζυμοι
  choice: dị nnọọ ka unu bụ ndị na-enweghị ihe iko achịcha
  rationale: “Dị nnọọ ka” na-egosipụta ntụnyere καθώς, ebe “ndị na-enweghị ihe iko achịcha” na-edebe ma ihe atụ Ngabiga ma nkwupụta banyere ọnọdụ ha ugbu a.
- source_word: τὸ πάσχα ἡμῶν
  choice: nwa atụrụ Ngabiga anyị
  rationale: N’asụsụ Grik, okwu ahụ bụ kpọmkwem “Ngabiga anyị,” ma ngwaa “chụọ aja” na ọnọdụ okwu ahụ na-ezo aka n’anụ e ji achụ aja Ngabiga. Ịgbakwunye “nwa atụrụ” na-eme ka ihe a pụtara ìhè n’Igbo, ebe ndetu ala na-echekwa okwu Grik kpọmkwem.
- source_word: ἐτύθη
  choice: e jirila … chụọ aja
  rationale: Ụdị θύω a na-ekwu maka igbu anụ dịka aja. “E jirila … chụọ aja” na-egosipụta omume ịchụ aja nke ọma ma na-egosi na ihe ahụ mere eme nwere mkpa ruo ugbu a.
- source_word: Χριστός
  choice: Mesaya
  rationale: N’ebe a Χριστός na-arụ ọrụ dịka utu aha n’ime ọnọdụ Ngabiga, ya mere “Mesaya” na-egosipụta echiche nke Onye E Tere Mmanụ karịa iji ya dịka aha nkịtị.
theological_decisions:
- issue: Ihe πάσχα pụtara mgbe e jikọtara ya na Mesaya
  choice: nwa atụrụ Ngabiga anyị
  alternative: Ngabiga anyị; aja Ngabiga anyị
  rationale: Grik hapụrụ “nwa atụrụ” n’ime nghọta okwu ahụ, mana “e ji … chụọ aja” na-eme ka ntụaka ya n’anụ aja pụta ìhè. Nsụgharị isi na-eme ka nke a doo anya, ebe ndetu ala na-echekwa ịdị mkpụmkpụ na ohere nghọta dị na Grik.
- issue: Nsụgharị Χριστός
  choice: Mesaya
  alternative: Kraịst
  rationale: Ọnọdụ Ngabiga na-eme ka Χριστός pụta dịka utu aha. “Mesaya” na-echekwa echiche ahụ n’enweghị itinye nkọwa otu ụka pụrụ iche.
- issue: Esemokwu dị n’etiti iwu na njirimara ndị na-agụ akwụkwọ ozi ahụ
  choice: ka unu wee bụrụ … dị nnọọ ka unu bụ
  alternative: ka unu ghọọ … ebe ọ bụ na unu enweghị ihe iko achịcha
  rationale: 'Nsụgharị a na-edebe esemokwu Pọl zubere: ọ na-enye ha iwu ka ha bụrụ ogbe ọhụrụ ma n’otu oge ahụ na-ekwupụta na ha bụ ndị na-enweghị ihe iko achịcha. E meghị ka otu akụkụ loda nke ọzọ.'
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. E debere ihe atụ ime achịcha na Ngabiga, tinyere iwu dị n’ụdị ọtụtụ. Akara ndetu [a] na [b] dị n’ahịrịokwu n’ebe okwu ha na-akọwa dị.
