revisions:
- from: Kpochapụnụ ihe iko achịcha ochie ahụ, ka unu wee bụrụ ogbe ntụ ọka ọhụrụ a gwakọtara, dị nnọọ ka unu bụ ndị na-enweghị ihe iko achịcha. N’ihi na e jirila Mesaya[b], nwa atụrụ Ngabiga anyị[a], chụọ aja.
  to: Kpochapụnụ ihe iko achịcha ochie ahụ, ka unu wee bụrụ ogbe ntụ ọka ọhụrụ, dịka unu bụ ndị na-enweghị ihe iko achịcha. N’ihi na a chụọla Mesaya[b], nwa atụrụ Ngabiga anyị[a], aja.
  rationale: The necessary correction restores the passive sacrificial meaning of ἐτύθη. Minor adjustments make the dough metaphor and footnote phrasing more natural while retaining the source's purpose/result clause, its present description of the readers as unleavened, and the documented ambiguity of τὸ πάσχα ἡμῶν.
