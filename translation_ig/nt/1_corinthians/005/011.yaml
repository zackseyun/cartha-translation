revisions:
- from: Ma ugbu a, edere m unu ka unu na onye ọ bụla a na-akpọ nwanna ghara ịkpakọrịta ma ọ bụrụ na ọ bụ onye na-akwa iko, ma ọ bụ onye anyaukwu, ma ọ bụ onye na-efe arụsị, ma ọ bụ onye na-ekwujọ mmadụ, ma ọ bụ onye aṅụrụma, ma ọ bụ onye na-apụnara mmadụ ihe. Unu na onye dị otu a erikwarịla nri.
  to: Ma ugbu a, edere m unu akwụkwọ ka unu ghara ịkpakọrịta na onye ọ bụla a na-akpọ nwanna, ọ bụrụ na onye ahụ bụ onye na-enwe mmekọahụ rụrụ arụ, ma ọ bụ onye anyaukwu, ma ọ bụ onye na-efe arụsị, ma ọ bụ onye na-ekwu okwu mkparị, ma ọ bụ onye aṅụrụma, ma ọ bụ onye na-apụnara mmadụ ihe. Unu esokwala onye dị otú ahụ rie nri.
  rationale: E mezie okwu ndị na-adịghị eke n’Igbo ma dozie obosara okwu abụọ Grik dị mkpa, n’agbanweghị ihe amaokwu ahụ kwuru. “A na-akpọ nwanna” ka dị, ya mere nsụgharị ahụ anaghị ekpebi ezi ọnọdụ ime mmụọ onye ahụ. “Esokwala ... rie nri” anaghị akọwa nri ahụ dịka Nri Onyenwe anyị.
