id: 1CO.5.11
reference: 1 Corinthians 5:11
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: νῦν δὲ ἔγραψα ὑμῖν μὴ συναναμίγνυσθαι ἐάν τις ἀδελφὸς ὀνομαζόμενος ᾖ πόρνος ἢ πλεονέκτης ἢ εἰδωλολάτρης ἢ λοίδορος ἢ μέθυσος ἢ ἅρπαξ, τῷ τοιούτῳ μηδὲ συνεσθίειν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/011.yaml
  text: But now I wrote to you not to associate with anyone who is called a brother if he is sexually immoral or greedy or an idolater or abusive or a drunkard or a swindler—not even to eat with such a person.
translation:
  language: ig
  text: Ma ugbu a, edere m unu akwụkwọ ka unu ghara ịkpakọrịta na onye ọ bụla a na-akpọ nwanna, ọ bụrụ na onye ahụ bụ onye na-enwe mmekọahụ rụrụ arụ, ma ọ bụ onye anyaukwu, ma ọ bụ onye na-efe arụsị, ma ọ bụ onye na-ekwu okwu mkparị, ma ọ bụ onye aṅụrụma, ma ọ bụ onye na-apụnara mmadụ ihe. Unu esokwala onye dị otú ahụ rie nri.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νῦν δὲ ἔγραψα
  choice: Ma ugbu a, edere m unu
  rationale: Na-edobe ọdịdị aorist nke ἔγραψα (‘edere m’) na mgbanwe δέ, kama ịgbanwe ya gaa n’oge ugbu a.
- source_word: μὴ συναναμίγνυσθαι
  choice: ka unu ... ghara ịkpakọrịta
  rationale: Na-egosi iwu ịghara iso onye ahụ nwee mmekọrịta chiri anya; ọ dị mfe nghọta n’Igbo nke oge a.
- source_word: ἀδελφὸς ὀνομαζόμενος
  choice: onye ọ bụla a na-akpọ nwanna
  rationale: Na-edobe okwu ahụ dịka aha ma ọ bụ nkwupụta e ji mara onye ahụ, n’ebughị ụzọ kpebie ma ọ bụ ezi onye kwere ekwe n’ezie.
- source_word: πόρνος
  choice: onye na-akwa iko
  rationale: Okwu Igbo a maara nke ọma maka onye na-eme omume mmekọahụ rụrụ arụ; ọ dabara n’usoro omume ọjọọ dị n’amaokwu ahụ.
- source_word: πλεονέκτης
  choice: onye anyaukwu
  rationale: Na-egosi onye ọchịchọ inweta ihe karịrị akarị na-achị, n’agbanyeghị na okwu Grik nwekwara ike ịgụnye irigbu mmadụ.
- source_word: εἰδωλολάτρης
  choice: onye na-efe arụsị
  rationale: Nsụgharị kpọmkwem ma doo anya nke onye na-efe chi oyiyi ma ọ bụ arụsị.
- source_word: λοίδορος
  choice: onye na-ekwujọ mmadụ
  rationale: Na-egosi okwu mkparị na okwu na-emebi aha mmadụ, ọ bụghị naanị iwe ma ọ bụ omume ike n’ozuzu.
- source_word: μέθυσος
  choice: onye aṅụrụma
  rationale: Okwu Igbo nkịtị maka onye ịṅụbiga mmanya ókè bụ àgwà ya.
- source_word: ἅρπαξ
  choice: onye na-apụnara mmadụ ihe
  rationale: Na-eburu echiche nke onye ji aghụghọ, ike, ma ọ bụ mmegbu anara ndị ọzọ ihe; ọ sara mbara karịa naanị ‘onye ohi.’
- source_word: μηδὲ συνεσθίειν
  choice: Unu na onye dị otu a erikwarịla nri
  rationale: 'Na-edobe nkwusiri ike nke μηδέ: ọ bụghị naanị izere mkpakọrịta, kama ọbụna ịghara iso onye dị otu ahụ rie nri.'
theological_decisions:
- issue: Ọnọdụ onye a na-akpọ ‘nwanna’
  choice: a na-akpọ nwanna
  alternative: onye bụ nwanna
  rationale: 'Okwu ὀνομαζόμενος na-ahapụ esemokwu ahụ ka ọ dị: amaokwu ahụ na-ekwu banyere onye na-aza ma ọ bụ a na-ewere dị ka nwanna, n’ekpebighị n’ime nsụgharị ahụ ezi ọnọdụ ime mmụọ ya.'
- issue: Ókè nke ‘iso rie nri’
  choice: erikwarịla nri
  alternative: unu esokwala ya rie Nri Onyenwe anyị
  rationale: Ihe odide Grik kwuru naanị συνεσθίειν, ‘iso rie nri’; nsụgharị ahụ ekwesịghị ịkọwa ya naanị dịka Nri Onyenwe anyị ma ọ bụ gbasaa ya karịa ihe ederede kwuru.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. E debere usoro ndepụta mmehie na nkwusiri ike nke ahịrịokwu ikpeazụ; e zere okwu ụka pụrụ iche na nkọwa na-emechi nghọta ndị ederede hapụrụ oghe.
