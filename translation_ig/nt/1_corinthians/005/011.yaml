review_pass:
  verdict: revise
  source_fidelity: A na-edobe usoro na ihe dị n’ndepụta mmehie ahụ nke ọma, nakwa echiche “onye a na-akpọ nwanna.” Otú ọ dị, “edere m unu ka” chọrọ mmeju “akwụkwọ,” λοίδορος ekwesịghị ịdaba naanị na nkwujọ, na ahịrị ikpeazụ chọrọ okwu Igbo doro anya nke pụtara iso rie nri.
  naturalness: “Unu na onye dị otu a erikwarịla nri” adịghị asụ Igbo nke ọma n’ebe a. “Unu esokwala onye dị otú ahụ rie nri” bụ iwu doro anya ma bụrụkwa ụzọ nkịtị e si ekwu ya. “Ọ bụrụ na onye a na-akpọ nwanna bụ...” na-eme ka nhazi ahịrịokwu ahụ doo anya.
  terminology: A gbanwere “onye na-akwa iko,” nke pụrụ ịpụta onye na-eme adultery kpọmkwem, ka ọ bụrụ “onye na-enwe mmekọahụ rụrụ arụ,” iji gosi obosara πόρνος. A gbanwere “onye na-ekwujọ mmadụ” ka ọ bụrụ “onye na-ekwu okwu mkparị” maka λοίδορος, onye na-ekwulu ma ọ bụ na-akparị ndị ọzọ.
