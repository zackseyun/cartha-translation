    issue: “edere m unu ka” ezughị ezu n’Igbo.
    rationale: N’usoro a, Igbo chọrọ ihe e dere, dịka “akwụkwọ”; “edere m unu akwụkwọ ka...” na-anọchi ἔγραψα ὑμῖν n’ụzọ zuru ezu.
  - severity: medium
    issue: “onye na-ekwujọ mmadụ” pere mpe karịa λοίδορος.
    rationale: λόιδορος na-ekwu maka onye na-ekwu okwu nlelị, mkparị, ma ọ bụ okwu ọjọọ; ọ bụghị naanị onye na-ekwu asịrị ma ọ bụ na-emebi aha mmadụ.
  - severity: medium
    issue: “erikwarịla nri” adịghị akọwa ‘iso rie nri’ nke ọma.
    rationale: συνεσθίειν bụ iri nri ọnụ. “Unu esokwala ... rie nri” na-egosi nke a n’Igbo doro anya ma na-edobe nkwusiri ike μηδέ.
