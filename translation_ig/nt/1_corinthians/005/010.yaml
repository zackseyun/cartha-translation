id: 1CO.5.10
reference: 1 Corinthians 5:10
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸀οὐ πάντως τοῖς πόρνοις τοῦ κόσμου τούτου ἢ τοῖς πλεονέκταις ⸀καὶ ἅρπαξιν ἢ εἰδωλολάτραις, ἐπεὶ ⸀ὠφείλετε ἄρα ἐκ τοῦ κόσμου ἐξελθεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/010.yaml
  text: not at all meaning the sexually immoral of this world[a], or the greedy and swindlers, or idolaters[b], since then you would have to go out of the world.
translation:
  language: ig
  text: Ihe m kwuru apụtaghị na unu ekwesịghị iso ndị na-eme omume rụrụ arụ n’ihe gbasara mmekọahụ nke ụwa a, ma ọ bụ ndị anyaukwu na ndị na-apụnara mmadụ ihe[a], ma ọ bụ ndị na-efe arụsị[b], na-enwe mmekọrịta ma ọlị; n’ihi na ma ọ bụghị ya, unu gaara esi n’ụwa pụọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “ndị ohi” ma ọ bụ “ndị na-anara mmadụ ihe n’ike”; okwu Grik ahụ (ἅρπαξ) pụrụ ịpụta ndị ji ike ma ọ bụ nrigbu na-anapụ ndị ọzọ ihe.
    reason: lexical_alternative
  - marker: b
    text: Pọl na-akọwa na ihe o kwuru apụtaghị na ndị kwere ekwe ga-ezere ndị niile na-eme omume ọjọọ nọ n’èzí nzukọ; tulee 1 Ndị Kọrịnt 5:11.
    reason: cross_reference
lexical_decisions:
- source_word: οὐ πάντως
  choice: Ihe m na-ekwu abụghị ma ọlị
  rationale: N’ọnọdụ okwu a, Pọl na-akọwa ihe o bu n’obi n’iwu o nyere na mbụ. Nhọrọ a na-egosipụta nkwusi ike dị n’okwu Grik ahụ n’Igbo dị mfe ma doo anya.
- source_word: πόρνοις
  choice: ndị ... na-eme omume rụrụ arụ n’ihe gbasara mmekọahụ
  rationale: Nke a na-echekwa kpọmkwem na okwu ahụ metụtara mmehie mmekọahụ, kama iji okwu sara mbara nke pụrụ ịpụta ụdị omume ọjọọ niile.
- source_word: τοῦ κόσμου τούτου
  choice: ndị ụwa a
  rationale: N’ebe a, κόσμος na-ezo aka n’ụmụ mmadụ na ọha mmadụ nọ n’èzí nzukọ ndị kwere ekwe. ‘Ndị ụwa a’ bụ okwu Igbo e ji eme ihe nke na-echekwa echiche ahụ.
- source_word: πλεονέκταις
  choice: ndị anyaukwu
  rationale: Okwu a na-akọwa ndị na-achọ inwetakwu ihe n’ụzọ oke ọchịchọ, nke na-agụnyekarị irigbu ndị ọzọ. ‘Ndị anyaukwu’ bụ ntụgharị doro anya ma bụrụ nke ndị mmadụ na-aghọta ngwa ngwa.
- source_word: ἅρπαξιν
  choice: ndị na-apụnara mmadụ ihe
  rationale: ἅρπαξ pụrụ ịkọwa ndị ji ike, aghụghọ, ma ọ bụ nrigbu ana ihe ndị ọzọ. Nhọrọ a na-edobe echiche sara mbara nke ịnara mmadụ ihe n’ụzọ na-ezighị ezi.
- source_word: εἰδωλολάτραις
  choice: ndị na-efe arụsị
  rationale: Nke a bụ okwu Igbo dị mfe ma kpọmkwem maka ndị na-efe ihe oyiyi ma ọ bụ chi ụgha ofufe.
- source_word: ἐπεὶ ... ἄρα
  choice: Ọ bụrụ na ọ bụ otú ahụ
  rationale: Nkebiokwu a na-ewebata ihe ga-esi na nghọta zuru oke ma na-ezighị ezi nke iwu ahụ pụta. Ntughari a na-egosipụta mgbagha ahụ n’Igbo ebumpụta ụwa.
- source_word: ὠφείλετε
  choice: unu ga-ahapụrịrị
  rationale: Ọ bụ ezie na ọdịdị okwu Grik ahụ bụ imperfect indicative, n’arụmụka a ọ na-egosi ihe ga-abụrịrị mkpa. Mgbakwunye ‘rịrị’ na-egosipụta mkpa a nke ọma.
- source_word: ἐκ τοῦ κόσμου ἐξελθεῖν
  choice: ịhapụ ụwa
  rationale: Nhọrọ a na-echekwa okwu siri ike Pọl ji gosi na izere ndị niile dị otu a n’ọha mmadụ agaghị ekwe omume ma ọ bụghị site n’ịpụ n’ụwa.
theological_decisions:
- issue: Ókè nkewapụ a na-enye n’iwu ndị gbara amaokwu a gburugburu
  choice: Pọl na-agọnahụ na iwu o nyere na mbụ pụtara na ndị kwere ekwe ga-ekewapụ kpamkpam n’ebe ndị na-ekweghị ekwe na-eme omume ọjọọ nọ.
  alternative: Pọl nyere iwu ka ndị kwere ekwe zere kpamkpam mmekọrịta niile ha na ndị ọjọọ nọ n’ụwa ga-enwe.
  rationale: Amaokwu ahụ n’onwe ya na-egosi na nghọta nke abụọ ahụ ga-achọ ka ha hapụ ụwa. Ya mere, ntụgharị a na-echekwa nkọwa Pọl n’emeghị ka ihe o kwuru kwado ikewapụ onwe onye n’ọha mmadụ karịa ihe ederede kwuru.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ ahịrịokwu ndị mmadụ na-asụkarị, ma e chekwara nkwusi ike, mgbagha, na oke okwu dị n’asụsụ Grik.
