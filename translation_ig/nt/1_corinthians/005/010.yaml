revisions:
- from: Ihe m na-ekwu abụghị ma ọlị ndị ụwa a na-eme omume rụrụ arụ n’ihe gbasara mmekọahụ, ma ọ bụ ndị anyaukwu na ndị na-apụnara mmadụ ihe[a], ma ọ bụ ndị na-efe arụsị[b]. Ọ bụrụ na ọ bụ otú ahụ, unu ga-ahapụrịrị ụwa.
  to: Ihe m kwuru apụtaghị na unu ekwesịghị iso ndị na-eme omume rụrụ arụ n’ihe gbasara mmekọahụ nke ụwa a, ma ọ bụ ndị anyaukwu na ndị na-apụnara mmadụ ihe[a], ma ọ bụ ndị na-efe arụsị[b], na-enwe mmekọrịta ma ọlị; n’ihi na ma ọ bụghị ya, unu gaara esi n’ụwa pụọ.
  rationale: The revision supplies only the association idea ellipted from the immediately preceding sentence, so that οὐ πάντως is represented in natural Igbo as a clarification of what Paul did not mean. It also changes the final verb to a counterfactual expression and uses “esi n’ụwa pụọ” to retain the source’s “out of the world” wording. The vice-list terminology and footnote anchors are retained, with a small grammatical improvement to the lexical footnote.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T18:11:22Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the vice categories and Paul’s point that a total avoidance of such people in society would be impossible. However, the opening Igbo construction is syntactically incomplete/unnatural for the Greek ellipsis, whose omitted idea is association from the preceding verse. Also, the imperfect ὠφείλετε in this unreal consequence is better conveyed by a counterfactual form (“gaara ...”) rather than a simple future/necessitative form.
  naturalness: '“Ihe m na-ekwu abụghị ma ọlị ndị ụwa a ...” is not idiomatic Standard Igbo: it leaves the relationship to those people unstated and makes “ndị ụwa a” sound potentially like a religious label. Supplying “iso ... na-enwe mmekọrịta” produces a clear, natural sentence while retaining the contextual ellipsis. “Sị n’ụwa pụọ” naturally preserves the directional force of ἐκ ... ἐξελθεῖν.'
  terminology: “omume rụrụ arụ n’ihe gbasara mmekọahụ,” “ndị anyaukwu,” “ndị na-apụnara mmadụ ihe,” and “ndị na-efe arụsị” are accurate, contemporary Standard Igbo renderings. The lexical note for ἅρπαξ needs minor grammatical polishing.
  issues:
  - severity: medium
    issue: The opening clause, “Ihe m na-ekwu abụghị ma ọlị ndị ụwa a na-eme ...,” is grammatically and semantically incomplete.
    rationale: Greek οὐ πάντως is elliptical, referring back to the instruction not to associate with such persons (v. 9). Igbo cannot naturally make the people themselves the direct complement of “abụghị.” Supplying the implied association makes the intended scope explicit without adding a new theological claim.
  - severity: medium
    issue: “unu ga-ahapụrịrị ụwa” does not clearly express the counterfactual force of ὠφείλετε.
    rationale: In this consequence argument, the imperfect indicates what they would have had to do if the prior instruction meant total avoidance. “Unu gaara esi n’ụwa pụọ” expresses that unreal consequence and preserves the imagery of leaving/out of the world.
  - severity: low
    issue: The wording of footnote a is slightly unidiomatic.
    rationale: “ji ike ma ọ bụ nrigbu ana ndị ọzọ ihe” should be recast as “ji ike ma ọ bụ nrigbu na-anapụ ndị ọzọ ihe” for natural Standard Igbo.
  revised_text: Ihe m kwuru apụtaghị na unu ekwesịghị iso ndị na-eme omume rụrụ arụ n’ihe gbasara mmekọahụ nke ụwa a, ma ọ bụ ndị anyaukwu na ndị na-apụnara mmadụ ihe[a], ma ọ bụ ndị na-efe arụsị[b], na-enwe mmekọrịta ma ọlị; n’ihi na ma ọ bụghị ya, unu gaara esi n’ụwa pụọ.
  revised_footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “ndị ohi” ma ọ bụ “ndị na-anara mmadụ ihe n’ike”; okwu Grik ahụ (ἅρπαξ) pụrụ ịpụta ndị ji ike ma ọ bụ nrigbu na-anapụ ndị ọzọ ihe.
    reason: lexical_alternative
  - marker: b
    text: Pọl na-akọwa na ihe o kwuru apụtaghị na ndị kwere ekwe ga-ezere ndị niile na-eme omume ọjọọ nọ n’èzí nzukọ; tulee 1 Ndị Kọrịnt 5:11.
    reason: cross_reference
  revision_rationale: The revision supplies only the association idea ellipted from the immediately preceding sentence, so that οὐ πάντως is represented in natural Igbo as a clarification of what Paul did not mean. It also changes the final verb to a counterfactual expression and uses “esi n’ụwa pụọ” to retain the source’s “out of the world” wording. The vice-list terminology and footnote anchors are retained, with a small grammatical improvement to the lexical footnote.
