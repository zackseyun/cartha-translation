reference: 1 Corinthians 6:9
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἢ οὐκ οἴδατε ὅτι ἄδικοι ⸂θεοῦ βασιλείαν⸃ οὐ κληρονομήσουσιν; μὴ πλανᾶσθε· οὔτε πόρνοι οὔτε εἰδωλολάτραι οὔτε μοιχοὶ οὔτε μαλακοὶ οὔτε ἀρσενοκοῖται
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/009.yaml
  text: 'Or do you not know that the unrighteous will not inherit the kingdom of God? Do not be deceived: neither the sexually immoral[a], nor idolaters, nor adulterers, nor effeminate men[b], nor men who have sex with men'
translation:
  language: ig
  text: 'Ka ọ̀ bụ na unu amaghị na ndị ajọ omume agaghị eketa alaeze Chineke? Unu ekwela ka a duhie unu: ọ bụghị ndị na-eme omume rụrụ arụ n’ihe gbasara mmekọahụ, ọ bụghị ndị na-efe arụsị, ọ bụghị ndị na-akwa iko, ọ bụghị ndị nwoke dị nro[a], ọ bụghị ndị nwoke na ndị nwoke ibe ha na-enwe mmekọahụ[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị nwoke na-akpa àgwà ka ụmụ nwanyị,” “ndị nwoke dị nro,” ma ọ bụ ikekwe “ndị nwoke akwụna.” Okwu Grik μαλακοί nwere ike ịpụta ịdị nro, omume a na-ele anya dị ka nke ụmụ nwanyị, ma ọ bụ adịghị ike n’omume; n’ebe a, ụfọdụ na-ekwu na ọ pụrụ izo aka n’ọrụ nwoke na-anabata n’omume mmekọahụ n’etiti ụmụ nwoke.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ndị na-edina nwoke,” “ndị nwoke na-eme mmekọahụ megidere iwu ha na nwoke ibe ha,” ma ọ bụ “ndị nwoke na-eme omume mmekọahụ na ụmụ nwoke.” Okwu Grik ἀρσενοκοῖται adịghị apụta ọtụtụ ugboro, a na-arụrịta ụka banyere ókè ihe ọ pụtara; ọtụtụ ndị na-ejikọta ya na okwu Grik dị na Levitikọs banyere nwoke na nwoke dina.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἢ
  choice: Ka ọ̀ bụ na
  rationale: Na-egosi ajụjụ ntụgharị uche nke na-aga n’ihu n’ihe Pọl kwuru tupu nke a.
- source_word: οὐκ οἴδατε
  choice: unu amaghị
  rationale: Na-edobe usoro ajụjụ Pọl ji akpọ ndị na-agụ akwụkwọ ya ka ha cheta ihe ha kwesịrị ịma.
- source_word: ἄδικοι
  choice: ndị na-adịghị eme ezi omume
  rationale: Na-egosi ụdị ndị omume ha na-emegide ezi omume na ikpe ziri ezi, n’asụsụ Igbo ndị mmadụ na-aghọta.
- source_word: θεοῦ βασιλείαν
  choice: alaeze Chineke
  rationale: Nke a bụ okwu Baịbụl a maara nke ọma maka ọchịchị ma ọ bụ alaeze nke Chineke.
- source_word: κληρονομήσουσιν
  choice: agaghị eketa
  rationale: ‘Iketa’ na-edobe echiche nke inweta ihe dịka ihe nketa, tinyere nghọta ọgbụgba ndụ na nke oge ikpeazụ.
- source_word: μὴ πλανᾶσθε
  choice: Unu ekwela ka e duhie unu
  rationale: Na-egosi ịdọ aka ná ntị ka ha ghara ikwe ka echiche ụgha duru ha ụzọ.
- source_word: πόρνοι
  choice: ndị na-eme omume rụrụ arụ n’ihe gbasara mmekọahụ
  rationale: Okwu a sara mbara karịa ịkwa iko n’alụmdi na nwunye, ya mere nsụgharị a na-ekpuchi omume mmekọahụ rụrụ arụ n’ozuzu ya.
- source_word: εἰδωλολάτραι
  choice: ndị na-efe arụsị
  rationale: Ọ bụ okwu Igbo doro anya, nke a na-ejikarị akọwa ndị na-asọpụrụ chi ma ọ bụ ihe e kere eke dịka chi.
- source_word: μοιχοὶ
  choice: ndị na-akwa iko
  rationale: Na-egosi mmebi ntụkwasị obi n’alụmdi na nwunye, dịka okwu Grik ahụ pụtara kpọmkwem.
- source_word: μαλακοὶ
  choice: ndị nwoke na-akpa àgwà ka ụmụanyị
  rationale: Na-agbaso nghọta ‘ndị nwoke na-eme ka ụmụanyị’ n’usoro mmehie a, ma ihe e dere n’ala peeji na-edobe mgbagwoju anya nke okwu ahụ, nke pụkwara ịpụta ‘ndị dị nro’ ma ọ bụ ndị nwoke nọ n’ọnọdụ nnabata n’mmekọahụ nwoke na nwoke.
- source_word: ἀρσενοκοῖται
  choice: ndị nwoke na ndị nwoke ibe ha na-enwe mmekọahụ
  rationale: Nsụgharị nkọwa a na-elekwasị anya n’omume kama itinye aha njirimara nke oge a; ọ kwekọrọ n’usoro mkpụrụokwu ahụ na njikọ ọtụtụ ndị na-ahụ n’etiti ya na okwu Grik nke Levitikọs.
theological_decisions:
- issue: Otu e si asụgharị μαλακοὶ na ἀρσενοκοῖται n’usoro mmehie a na-arụrịta ụka banyere ya
  choice: ndị nwoke na-akpa àgwà ka ụmụanyị; ndị nwoke na ndị nwoke ibe ha na-enwe mmekọahụ
  alternative: ndị nwoke dị nro ma ọ bụ ndị nwoke akwụna; ndị na-edina nwoke ma ọ bụ ndị nwoke na-eme mmekọahụ megidere iwu
  rationale: Okwu abụọ a siri ike ịkọwa kpọmkwem. Nsụgharị a na-egosipụta otu nghọta a na-ahụkarị ma na-ezere ịkpọ ndị mmadụ aha njirimara nke oge a. Ihe e dere n’ala peeji na-edobe ụzọ nghọta ndị ọzọ kama idozi esemokwu ahụ n’enweghị nkọwa.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E debere usoro ajụjụ na ịdọ aka ná ntị nke Pọl, tinyere ugboro ugboro nke “ma ... ma ...” n’usoro aha ndị ahụ. A kọwara okwu mmekọahụ ndị siri ike n’ụzọ doro anya ma na-adịghị eji aha njirimara nke oge a; ebe ihe okwu Grik pụtara na-arụrịta ụka, e debere ụzọ nghọta ndị ọzọ n’ihe e dere n’ala peeji.
