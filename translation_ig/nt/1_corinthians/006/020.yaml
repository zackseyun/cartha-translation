  source_fidelity: The rendering preserves the passive purchase image (ἠγοράσθητε), the stated price (τιμῆς), the imperative to glorify God, and the concrete reference to the body. “Ya mere” is an acceptable idiomatic rendering of δή in this exhortational context, consistent with the English audit trail, though the particle chiefly supplies urging/emphasis.
  naturalness: The Igbo is clear, modern, and suitably formal. “E ji ọnụ ahịa zụta unu” and “nyenụ Chineke otuto n’ahụ unu” are natural Standard Igbo.
  terminology: “Zụta”/“ọnụ ahịa” properly retain the commercial metaphor without importing an interpretation, while “otuto” is an established and appropriate rendering for glory. “Ahụ” accurately retains the embodied sense of σῶμα.
