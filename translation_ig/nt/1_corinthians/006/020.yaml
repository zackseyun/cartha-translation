base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/020.yaml
  text: For you were bought with a price[b][a]; therefore glorify God in your body.
translation:
  language: ig
  text: N’ihi na e ji ọnụ ahịa zụta unu[a]; ya mere[b], nyenụ Chineke otuto n’ahụ unu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “a zụtara unu n’ọnụ ahịa.” Okwu Grik na-edebe ihe atụ nke ịzụta ihe na ụgwọ e ji zụta ya.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị “ya mere” dịka “mgbe ahụ,” ma ọ bụ hapụ ya n’nsụgharị Igbo; mkpụrụokwu Grik ahụ na-eme ka iwu a bụrụ ihe e mesiri ike.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠγοράσθητε
  choice: e ji ... zụta unu
  rationale: Ụdị a na-edebe ihe atụ ahịa dị na ngwaa Grik ἀγοράζω, ma na-egosikwa na e mere unu ihe ahụ, dị ka passive ahụ si dị.
- source_word: γὰρ
  choice: N’ihi na
  rationale: γάρ na-enye ihe kpatara ndụmọdụ bu ụzọ; ‘N’ihi na’ bụ njikọ doro anya ma bụrụkwa Igbo nkịtị.
- source_word: τιμῆς
  choice: ọnụ ahịa
  rationale: N’ebe a τιμή na-egosi ụgwọ e ji zụta ihe. ‘Ọnụ ahịa’ na-edebe okwu ahịa ahụ n’enweghị ịkọwa ihe ọnụ ahịa ahụ bụ.
- source_word: δοξάσατε
  choice: nyenụ ... otuto
  rationale: Nke a bụ iwu e nyere ọtụtụ mmadụ. ‘Nyenụ Chineke otuto’ bụ ụzọ Igbo sitere n’okike si kwuo δοξάζω ma debe ịdị arọ nke okwu ahụ.
- source_word: δὴ
  choice: ya mere
  rationale: δή na-eme ka iwu ahụ sie ike ma jikọta ya na ihe kpatara ya. ‘Ya mere’ na-egosipụta ntụgharị ahụ n'ụzọ doro anya.
- source_word: ἐν τῷ σώματι ὑμῶν
  choice: n’ahụ unu
  rationale: Nke a na-edebe σῶμα dịka ahụ mmadụ, nke dị mkpa n’okwu gbara amaokwu ahụ gburugburu. ‘N’ahụ unu’ na-ahapụ ohere locative/instrumental nke ἐν n’emeghị ka ọ bụrụ naanị ‘site n’ahụ unu.’
theological_decisions:
- issue: Ihe atụ nke ịzụta mmadụ n’ọnụ ahịa
  choice: Debe ya dịka ‘e ji ọnụ ahịa zụta unu’
  alternative: ‘a gbapụtara unu site n’ịkwụ ụgwọ’
  rationale: Okwu Grik ji ihe atụ ahịa kpọmkwem. Idebe ‘zụta’ na ‘ọnụ ahịa’ na-ezere itinye nkọwa ozizi nke karịrị ihe ederede kwuru.
- issue: Omume metụtara ahụ mmadụ
  choice: Tụgharịa σῶμα dịka ‘ahụ’
  alternative: ‘ndụ’ ma ọ bụ ‘onwe unu’
  rationale: Ihe gbara amaokwu ahụ gburugburu metụtara omume mmekọahụ nke ahụ; ya mere ‘ahụ’ na-edebe isi arụmụka Pọl n’enweghị mgbasawanye nkọwa.
- issue: Ọnụọgụ nke ‘ahụ’
  choice: Jiri ‘n’ahụ unu,’ nke nwere ike ịrụ ọrụ n’Igbo maka ahụ onye ọ bụla n’etiti ọtụtụ mmadụ
  alternative: ‘n’ahụ́ unu niile’
  rationale: Grik nwere σῶμα n’otu mana ὑμῶν n’ọtụtụ. Nsụgharị ahụ na-edebe esemokwu ọnụọgụ a n’ụzọ Igbo na-anabata, kama ime ka ọ bụrụ ọtụtụ ahụ n’ụzọ doro anya karịa isi mmalite.
translation_notes:
  register: Standard Igbo dị ugbu a, nke kwanyere ugwu ma dị mfe nghọta. E ji ‘ọnụ ahịa’ na ‘zụta’ debe ihe atụ ahịa nke isi mmalite; e jighị okwu ụka pụrụ iche dochie ya. E tinyere akara ụkwụ [a] ozugbo n’akụkụ okwu ịzụta, na [b] n’ahịrịokwu nwere ‘ya mere,’ ka akara niile dị n’ederede isi.
