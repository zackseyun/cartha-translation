id: 1CO.6.5
reference: 1 Corinthians 6:5
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: πρὸς ἐντροπὴν ὑμῖν λέγω. οὕτως οὐκ ἔνι ἐν ὑμῖν ⸂οὐδεὶς σοφὸς⸃ ὃς δυνήσεται διακρῖναι ἀνὰ μέσον τοῦ ⸀ἀδελφοῦ αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/005.yaml
  text: I say this to your shame[a]. Is it really so[b], that there is not among you even one wise man who will be able to judge between his brothers?
translation:
  language: ig
  text: Ana m ekwu nke a ka ihere mee unu. Ọ̀ bụ eziokwu na ọ dịghị ọbụna otu onye maara ihe n’etiti unu nke ga-enwe ike ikpe ikpe n’etiti otu nwanna na nwanna ọzọ?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πρὸς ἐντροπὴν ὑμῖν
  choice: iji mee ka ihere mee unu
  rationale: Nkebiokwu a na-egosi nzube ma ọ bụ ihe okwu Pọl ga-arụpụta, ma na-echekwa ike nke mba ọ na-abara ha.
- source_word: οὕτως
  choice: Ọ̀ bụ eziokwu
  rationale: Ajụjụ a na-egosipụta iwe na ihe ijuanya Pọl nwere, kama ịsụgharị ya nanị dịka ‘otu a.’
- source_word: οὐκ ἔνι ἐν ὑμῖν
  choice: ọ dịghị ... n’etiti unu
  rationale: Nke a na-egosi na a na-ekwu banyere ndị nọ n’ime ọgbakọ ahụ.
- source_word: οὐδεὶς σοφὸς
  choice: ọbụna otu onye maara ihe
  rationale: ‘Ọbụna otu’ na-egosipụta ike nke nkwụsi ike dị na ajụjụ ahụ; ‘onye maara ihe’ bụ Igbo nkịtị ma dịkwa mma maka nwoke ma ọ bụ nwanyị n’ọgbakọ.
- source_word: δυνήσεται
  choice: ga-enwe ike
  rationale: Nke a na-echekwa ọdịdị ọdịnihu na echiche nke ikike dị n’okwu Grik ahụ.
- source_word: διακρῖναι
  choice: ikpe ikpe
  rationale: N’ọnọdụ esemokwu ikpe a, ngwaa ahụ pụtara ikpebi okwu dị n’etiti ndị na-ese okwu.
- source_word: ἀνὰ μέσον τοῦ ἀδελφοῦ αὐτοῦ
  choice: ikpe ikpe dị n’etiti nwanna ya na nwanna ọzọ
  rationale: Grik ahụ dị mkpirikpi ma hapụ onye nke abụọ n’esemokwu ahụ ka a ghọta ya site n’ọnọdụ okwu. Ịtinye ‘na nwanna ọzọ’ na-eme ka Igbo doo anya n’enweghị ịgbanwe isi echiche ahụ.
theological_decisions:
- issue: Asụsụ ezinụlọ na nwoke e ji anọchi anya ndị niile nọ n’ọgbakọ
  choice: onye maara ihe ... nwanna ya na nwanna ọzọ
  alternative: nwoke maara ihe ... nwanne ya nwoke
  rationale: Ụdị Grik bụ nke nwoke otu, ma okwu ahụ metụtara ọgbakọ niile. ‘Onye’ na ‘nwanna’ bụ Igbo e ji agụnye mmadụ n’ozuzu, ma ‘nwanna’ ka na-echekwa ihe atụ ezinụlọ dị na ἀδελφός.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. Ajụjụ nkwutọ Pọl na ike mba ya ka echekwara; a zere okwu iwu siri ike nke ndị nkịtị nwere ike ghara ịghọta.
