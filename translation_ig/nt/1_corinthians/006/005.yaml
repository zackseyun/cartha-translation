revisions:
- from: Ana m ekwu nke a iji mee ka ihere mee unu. Ọ̀ bụ eziokwu na ọ dịghị ọbụna otu onye maara ihe n’etiti unu nke ga-enwe ike ikpe ikpe dị n’etiti nwanna ya na nwanna ọzọ?
  to: Ana m ekwu nke a ka ihere mee unu. Ọ̀ bụ eziokwu na ọ dịghị ọbụna otu onye maara ihe n’etiti unu nke ga-enwe ike ikpe ikpe n’etiti otu nwanna na nwanna ọzọ?
  rationale: The revision improves Standard Igbo idiom and syntax without altering the source sense. It retains the rhetorical question and explicitly but minimally supplies the second party implied by the Greek elliptical expression and its context.
