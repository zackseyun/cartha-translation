id: 1CO.6.2
reference: 1 Corinthians 6:2
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸀ἢ οὐκ οἴδατε ὅτι οἱ ἅγιοι τὸν κόσμον κρινοῦσιν; καὶ εἰ ἐν ὑμῖν κρίνεται ὁ κόσμος, ἀνάξιοί ἐστε κριτηρίων ἐλαχίστων;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/002.yaml
  text: Or do you not know that the saints will judge the world? And if the world is judged by you[b][a], are you unworthy of the smallest courts?
translation:
  language: ig
  text: Ka ọ̀ bụ na unu amaghị na ndị nsọ ga-ekpe ụwa ikpe? Ọ bụrụkwa na a ga-ekpe ụwa ikpe site n'aka unu[a], unu erughị eru ikpe okwu ikpe ndị kasị nta[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n'etiti unu.” Okwu Grik ahụ pụtara n'ụzọ nkịtị, “ọ bụrụ na a na-ekpe ụwa ikpe n'ime unu” ma ọ bụ “n'etiti unu”; n'okwu a, ọ na-egosi na ndị nsọ ga-esonye n'ikpe ụwa.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ụlọikpe ndị kasị nta.” Okwu Grik ahụ nwere ike izo aka n'ụlọikpe ma ọ bụ n'okwu ikpe ndị na-adịchaghị mkpa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἢ
  choice: Ka ọ̀ bụ na
  rationale: Ọ na-ejikọta ajụjụ a na arụmụka bu ya ụzọ dịka ajụjụ nkwughachi siri ike, ma na-ada nke ọma n'Igbo.
- source_word: οὐκ οἴδατε
  choice: unu amaghị
  rationale: Nke a na-edobe ihe οἶδα pụtara ma na-ewepụta ajụjụ nkwughachi Pọl n'Igbo doro anya.
- source_word: οἱ ἅγιοι
  choice: ndị nsọ
  rationale: Ọ bụ okwu Igbo dị mkpirikpi maka ndị e doro Chineke nsọ; n'ebe a ọ na-ezo aka n'ozuzu nye ndị kweere, ọ bụghị naanị òtù pụrụ iche.
- source_word: τὸν κόσμον
  choice: ụwa
  rationale: “Ụwa” bụ okwu Igbo nkịtị nke na-eburu obosara κόσμος n'okwu a n'enweghị ịkọwa ya karịa ihe odide ahụ kwuru.
- source_word: κρινοῦσιν
  choice: ga-ekpe ... ikpe
  rationale: Ọ na-egosipụta ọdịnihu na isi echiche nke ikpe ikpe, n'enweghị ịkọwa otú ndị nsọ ga-esi sonye na ya.
- source_word: ἐν ὑμῖν
  choice: site n'aka unu
  rationale: N'ọnọdụ ikpe a, ọ na-egosi na ha ga-esonye n'ikpe ụwa; a hapụrụ “n'etiti unu” dị ka ihe ọzọ n'okpuru ama ala peeji.
- source_word: κρίνεται
  choice: a ga-ekpe ... ikpe
  rationale: Ọdịdị a na-eme ka olu nnara nke Grik pụta ìhè, ma ọdịnihu dabara n'okwu gbara ya gburugburu na ajụjụ ọnọdụ ahụ.
- source_word: ἀνάξιοί ἐστε
  choice: unu erughị eru
  rationale: Ọ na-edobe echiche nke ịbụ ndị na-erughị eru ma na-ada nke ọma n'Igbo nke oge a.
- source_word: κριτηρίων ἐλαχίστων
  choice: ikpe okwu ndị kasị nta
  rationale: N'ọnọdụ esemokwu dị n'etiti ndị kwere ekwe, nke a na-ekwupụta okwu ikpe ndị na-adịchaghị mkpa; enwere ike ịghọta κριτήρια dịka ụlọikpe, ya mere e depụtara nke ahụ n'okpuru ama ala peeji.
theological_decisions:
- issue: Ndị “nsọ” bụ ndị?
  choice: Ndị kwere ekwe, ya bụ ndị Chineke doro nsọ, n'ozuzu ha
  alternative: Naanị ụfọdụ ndị kwere ekwe ndị pụrụ iche n'ịdị nsọ
  rationale: Ojiji Pọl na-emekarị na-eji οἱ ἅγιοι akọwa ndị nke Chineke n'ozuzu ha; nsụgharị ahụ anaghị etinye echiche nke òtù ndị e nyere ọkwa pụrụ iche.
- issue: Otú ndị nsọ ga-esi kpee ụwa ikpe
  choice: Ha ga-esonye n'ezie n'ikpe ga-abịa, ma a kọwaghị usoro ya
  alternative: Naanị ịtụle omume ụwa n'ụzọ ihe atụ, ma ọ bụ inwe ikike ikpe nke ha n'adabereghị na Chineke
  rationale: Ihe odide ahụ kwuru na ha ga-ekpe ụwa ikpe, ma ọ kọwaghị kpọmkwem otú nke a ga-esi mee; ya mere nsụgharị ahụ hapụrụ esemokwu ahụ n'ọnọdụ ya.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta mee ya. “Ndị nsọ” na-edobe okwu Baịbụl a maara ama, ebe “okwu ndị kasị nta” na-ezere echiche na ihe a na-ekwu bụ nha ụlọikpe n'onwe ya. E tinyere akara ama ala peeji [a] na [b] n'ebe okwu ha na-akọwa dị.
