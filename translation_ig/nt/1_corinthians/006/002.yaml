review_pass:
  verdict: revise
  source_fidelity: The draft faithfully renders the rhetorical question, the future judgment of the world by the saints, and the conditional passive clause. “Site n'aka unu” is an interpretive but contextually defensible rendering of ἐν ὑμῖν, with the more literal alternative retained in a footnote. The final phrase needs a more idiomatic Igbo expression for handling/judging minor legal cases.
  naturalness: Most of the verse is natural Standard Igbo. “Unu erughị eru ikpe okwu ndị kasị nta” is syntactically compressed and can sound as though “okwu” alone is the object of judging rather than legal cases. “Unu erughị eru ikpe okwu ikpe ndị kasị nta” is clearer and more idiomatic in this judicial context.
  terminology: “Ndị nsọ,” “ụwa,” and “kpee ... ikpe” are appropriate, established, and theologically non-specifying. The footnote’s proposed alternative “ịnọ n'ụlọikpe” does not accurately express κριτηρίων; the alternative should simply identify “ụlọikpe” or “okwu ikpe” as the possible sense.
  issues:
  - severity: medium
    issue: The rendering of κριτηρίων in the final question is awkward.
    rationale: κρίτηρια refers here to courts/judicial matters. “Ikpe okwu ndị kasị nta” is not the clearest Standard Igbo phrasing for minor legal cases. Adding “okwu ikpe” preserves the judicial sense without choosing exclusively between ‘courts’ and ‘cases.’
  - severity: medium
    issue: Footnote b gives an inaccurate Igbo alternative.
    rationale: “Ịnọ n'ụlọikpe ndị kasị nta” means ‘being in the smallest courts’ and is not an alternative rendering of the Greek noun phrase. The note should offer “ụlọikpe ndị kasị nta” and explain the possible ‘minor legal cases’ sense.
  revised_text: Ka ọ̀ bụ na unu amaghị na ndị nsọ ga-ekpe ụwa ikpe? Ọ bụrụkwa na a ga-ekpe ụwa ikpe site n'aka unu[a], unu erughị eru ikpe okwu ikpe ndị kasị nta[b]?
  revised_footnotes:
