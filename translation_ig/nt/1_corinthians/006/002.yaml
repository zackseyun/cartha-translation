revisions:
- from: Ka ọ̀ bụ na unu amaghị na ndị nsọ ga-ekpe ụwa ikpe? Ọ bụrụkwa na a ga-ekpe ụwa ikpe site n'aka unu[a], unu erughị eru ikpe okwu ndị kasị nta[b]?
  to: Ka ọ̀ bụ na unu amaghị na ndị nsọ ga-ekpe ụwa ikpe? Ọ bụrụkwa na a ga-ekpe ụwa ikpe site n'aka unu[a], unu erughị eru ikpe okwu ikpe ndị kasị nta[b]?
  rationale: The revision retains the source’s ambiguity concerning ἐν ὑμῖν and κριτηρίων while making the final question idiomatic in Standard Igbo. It also corrects the footnote so that its stated alternative actually corresponds to the Greek expression.
