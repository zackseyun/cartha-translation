    text: Ma ọ bụ, “n'etiti unu.” Okwu Grik ahụ pụtara n'ụzọ nkịtị, “ọ bụrụ na a na-ekpe ụwa ikpe n'ime unu” ma ọ bụ “n'etiti unu”; n'okwu a, ọ na-egosi na ndị nsọ ga-esonye n'ikpe ụwa.
    reason: lexical_alternative
