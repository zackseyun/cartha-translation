id: 1CO.6.4
reference: 1 Corinthians 6:4
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: βιωτικὰ μὲν οὖν κριτήρια ἐὰν ἔχητε, τοὺς ἐξουθενημένους ἐν τῇ ἐκκλησίᾳ, τούτους καθίζετε;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/004.yaml
  text: So if you have courts for matters of this life[c][b][a], do you appoint as judges those who are of no standing in the church?
translation:
  language: ig
  text: Ya mere, ọ bụrụ na unu nwere okwu ikpe gbasara ihe ndị dị ná ndụ a[a], ọ bụ ndị a na-eleda anya n’ọgbakọ[b] ka unu na-ahọpụta ka ha bụrụ ndị ikpe?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ihe ndị metụtara ndụ kwa ụbọchị”; okwu Grik ahụ na-ezo aka n’ihe nkịtị nke ụwa ma ọ bụ okwu obodo.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ndị a na-elelị n’ọgbakọ.” Okwu Grik ahụ nwere ike ịbụ njakịrị na-ezo aka ma ndị a na-ewere dị ka ndị na-abaghị uru n’ime ọgbakọ, ma ọ bụ ndị na-enweghị ọnọdụ n’anya ọgbakọ.
    reason: alternative_reading
  - marker: c
    text: 'Ụfọdụ na-aghọta nkebi ahịrịokwu a dịka iwu e ji njakịrị kwuo: “họpụtara ndị a na-eleda anya n’ọgbakọ ka ha bụrụ ndị ikpe.”'
    reason: alternative_reading
lexical_decisions:
- source_word: βιωτικὰ
  choice: ihe ndị dị ná ndụ a
  rationale: Nke a na-ezo aka n’ihe ndị metụtara ndụ nkịtị n’ụwa, karịchaa okwu obodo ma ọ bụ ihe na-adịru nwa oge. Nhọrọ a adịghị enye echiche na ihe ndị ahụ bụ ihe ọjọọ n’ụzọ omume.
- source_word: κριτήρια
  choice: okwu ikpe
  rationale: Okwu Grik a nwere ike ịpụta ụlọikpe, ikpe, ma ọ bụ usoro ikpe. N’ebe a, “okwu ikpe” na-ada nke ọma n’Igbo ma kwekọọ n’arụmụka Pọl banyere esemokwu ndị kwere ekwe na-ebuga ka e kpee ha ikpe.
- source_word: ἐὰν ἔχητε
  choice: ọ bụrụ na unu nwere
  rationale: Nke a na-edobe usoro ọnọdụ dị n’okwu Grik n’ụzọ doro anya ma bụrụkwa Igbo nkịtị.
- source_word: τοὺς ἐξουθενημένους
  choice: ndị a na-eleda anya
  rationale: Nkebi a na-ekwu banyere ndị a na-ewere dị ka ndị na-abaghị uru, ndị a na-elelị, ma ọ bụ ndị na-enweghị ọnọdụ. “Ndị a na-eleda anya” na-echekwa echiche mmekọrịta mmadụ na ibe ya n’enweghị ịmanye otu onye a na-ekwu banyere ya.
- source_word: ἐν τῇ ἐκκλησίᾳ
  choice: n’ọgbakọ
  rationale: “Ọgbakọ” na-egosi obodo ndị kwere ekwe. Ọ ka na-ahapụ ohere ma ihe a ọ̀ pụtara ndị nọ n’ime ọgbakọ a na-eleda anya, ma ọ bụ ndị na-enweghị ọnọdụ n’anya ọgbakọ.
- source_word: τούτους καθίζετε
  choice: unu na-ahọpụta ka ha bụrụ ndị ikpe
  rationale: Ọ bụ ezie na καθίζω pụtara n’ụzọ nkịtị “ime ka mmadụ nọdụ,” n’ọnọdụ ikpe ọ na-egosi ime ka mmadụ nọdụ dịka onye ikpe ma ọ bụ ịhọpụta ya ka ọ kpee ikpe. Nsụgharị a na-eme ka ọrụ ahụ doo anya n’Igbo.
theological_decisions:
- issue: Ma okwu Pọl ọ bụ ajụjụ ịba mba ka ọ bụ iwu njakịrị, nakwa ndị “a na-eleda anya” bụ ndị
  choice: 'E depụtara ya dịka ajụjụ ịba mba: “ọ bụ ndị a na-eleda anya n’ọgbakọ ka unu na-ahọpụta ka ha bụrụ ndị ikpe?”'
  alternative: 'A pụrụ ịghọta ya dịka iwu e ji njakịrị kwuo: “họpụtaanụ ndị a na-eleda anya n’ọgbakọ ka ha bụrụ ndị ikpe.” A pụkwara ịghọta ndị ahụ dịka ndị nọ n’èzí ọgbakọ, kama ịbụ ndị nọ n’ime ya a na-ewere dị ka ndị na-abaghị uru.'
  rationale: Akara ajụjụ nke SBLGNT na ihe gbara amaokwu a gburugburu kwadoro ịgụ ya dịka ajụjụ ịba mba. Ma okwu Grik ahụ siri ike n’usoro ahịrịokwu, ya mere e debere ụzọ ọzọ na nkọwa ala peeji; “n’ọgbakọ” anaghị ekpebi kpamkpam ndị a na-ekwu banyere ha.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “Ọgbakọ” na-ezo aka n’ọgbakọ ndị kwere ekwe, ebe “okwu ikpe” na-ezere ahịrịokwu Igbo na-adịghị eke eke nke ga-esite n’ịsụgharị κριτήρια naanị dịka “ụlọikpe.”
