  naturalness: The verse is clear and natural in Standard Igbo. “Okwu ikpe gbasara ihe ndị dị ná ndụ a” and “unu na-ahọpụta ka ha bụrụ ndị ikpe” are idiomatic. The alternative-reading footnote for marker b can be made more direct and natural, and marker c contains a spelling error in the imperative.
  terminology: “Ọgbakọ” is suitable for ἐκκλησία in this context. “Ndị a na-eleda anya” adequately expresses those treated with contempt, while “ndị ikpe” clearly conveys the judicial implication of καθίζετε. No theological or interpretive overstatement is introduced.
