review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents God as the subject, the Lord's past resurrection, believers' future resurrection, and divine power as the means. The explicit phrase “si n’ọnwụ” appropriately makes the resurrection sense clear in Igbo, though it is implicit rather than stated in the Greek.
  naturalness: The draft is understandable and suitably reverent, but the repeated periphrasis “mere ka ... si n’ọnwụ bilie” is heavier than necessary. “Kpọlitere ... n’ọnwụ” is a natural, concise Standard Igbo resurrection expression. Starting with “Ma” can sound more adversative than the Greek’s mild connective; omitting an overt connector gives natural Igbo continuity without introducing contrast.
  terminology: “Chineke,” “Onyenwe anyị,” “anyị,” and “ike ya” are appropriate Standard Igbo theological terminology. “Kpọlitere ... n’ọnwụ” clearly preserves the resurrection reference in this bodily-resurrection context.
  issues:
  - severity: low
    issue: “Ma” may imply a stronger contrast than δέ bears here.
    rationale: δέ is a mild connective in this context. Igbo need not state a contrasting conjunction, and omission produces smoother flow.
  - severity: low
    issue: The repeated causative wording is somewhat cumbersome.
    rationale: “Kpọlitere ... n’ọnwụ” conveys resurrection directly and naturally, while retaining God as the agent.
  revised_text: Chineke kpọlitere Onyenwe anyị n’ọnwụ, ọ ga-ejikwa ike ya kpọlite anyị n’ọnwụ.
