  text: ὁ δὲ θεὸς καὶ τὸν κύριον ἤγειρεν καὶ ἡμᾶς ἐξεγερεῖ διὰ τῆς δυνάμεως αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/014.yaml
  text: And God raised the Lord and will also raise us by his power.
translation:
  language: ig
  text: Chineke kpọlitere Onyenwe anyị n’ọnwụ, ọ ga-ejikwa ike ya kpọlite anyị n’ọnwụ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: Ma
  rationale: N'ebe a, δέ bụ njikọ dị nro nke na-aga n'ihu n'arụmụka Pọl. “Ma” bụ ụzọ Igbo si ejikọ echiche a na nke bu ya ụzọ n'enweghị ime ka ọdịiche ahụ sie ike gabiga ókè.
- source_word: θεὸς
  choice: Chineke
  rationale: Nke a bụ okwu Igbo a na-ejikarị asụgharị θεός; ọ bụkwa Chineke ka amaokwu ahụ kpọrọ onye na-eme ka ndị nwụrụ anwụ bilie.
- source_word: τὸν κύριον
  choice: Onyenwe anyị
  rationale: N'ọnọdụ a κύριος bụ aha nsọpụrụ e ji kpọọ Jizọs. “Onyenwe anyị” bụ nsụgharị Igbo doro anya ma bụrụ nke a maara nke ọma.
- source_word: ἤγειρεν
  choice: mere ka ... si nʼọnwụ bilie
  rationale: Aorist ἤγειρεν na-ekwu banyere ihe Chineke mere n'oge gara aga, ya bụ mbilite Jizọs n'ọnwụ. Ịgbakwunye “si nʼọnwụ” na-eme ka echiche mbilite n'ọnwụ doo anya n'Igbo.
- source_word: ἡμᾶς
  choice: anyị
  rationale: Ọ bụ nnọchiaha onye mbụ n'ụbara nke gụnyere Pọl na ndị kwere ekwe ọ na-agwa okwu.
- source_word: ἐξεγερεῖ
  choice: ọ ga-... eme ka anyị si nʼọnwụ bilie
  rationale: Ụdị ọdịnihu a yiri ngwaa e ji kọwaa mbilite Onyenwe anyị. Nsụgharị ahụ na-echekwa oge ọdịnihu na myirịta dị n'etiti mbilite Kraịst na nke ndị kwere ekwe.
- source_word: διὰ τῆς δυνάμεως αὐτοῦ
  choice: jikwa ike ya
  rationale: διά na genitive na-egosi ụzọ ma ọ bụ ihe e ji rụọ ọrụ. “Jikwa ike ya” bụ Igbo ebumpụta ụwa nke na-egosi na ike Chineke bụ ụzọ ọ ga-esi mee ka anyị bilie.
theological_decisions:
- issue: Ihe mbilite ahụ dị n'ahịrịokwu nke ọdịnihu na-ezo aka na ya
  choice: Mbilite ahụ́ ndị kwere ekwe n'ọnwụ n'ọdịnihu
  alternative: Nkwado Chineke n'ozuzu ya ma ọ bụ mbilite ime mmụọ n'ụzọ ihe atụ
  rationale: Ihe gbara amaokwu ahụ gburugburu na-ekwu banyere ahụ́ (1 Kọr. 6:13–20), myirịta ya na okwu “Chineke mere ka Onyenwe anyị si nʼọnwụ bilie” na-akwadokwa na ọ bụ ezigbo mbilite ndị kwere ekwe n'ọnwụ ka a na-ekwu, ọ bụghị naanị ihe atụ.
translation_notes:
  register: 'E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta mee nsụgharị ahụ. Ahịrịokwu ahụ na-echekwa nhazi abụọ nke Grik: ihe Chineke mere Onyenwe anyị n''oge gara aga na ihe ọ ga-emere anyị n''ọdịnihu. Enweghị akara nkọwa ala peeji n''ihi na ọ dịghị nke dị mkpa n''amaokwu a.'
