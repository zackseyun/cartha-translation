  text: οὔτε ⸂κλέπται οὔτε πλεονέκται⸃, ⸀οὐ μέθυσοι, οὐ λοίδοροι, οὐχ ἅρπαγες βασιλείαν ⸀θεοῦ κληρονομήσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/010.yaml
  text: nor thieves[a], nor the greedy, nor drunkards, nor revilers[c][b], nor swindlers will inherit the kingdom of God.
translation:
  language: ig
  text: ma ndị ohi, ma ndị anyaukwu, ma ndị aṅụrụma, ma ndị na-akparị mmadụ, ma ndị na-apụnara mmadụ ihe[a] agaghị eketa alaeze Chineke.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ndị na-eji ike ma ọ bụ iyi egwu anara mmadụ ihe.”
    reason: lexical_alternative
  - marker: b
    text: Ya bụ, ha agaghị enweta òkè n'alaeze Chineke.
    reason: clarification
lexical_decisions:
- source_word: κλέπται
  choice: ndị ohi
  rationale: Ọ bụ okwu Igbo a na-ejikarị akọwa ndị na-ezu ohi; ọ dabara n'usoro omume ọjọọ a.
- source_word: πλεονέκται
  choice: ndị anyaukwu
  rationale: Ọ na-akọwa ndị ọchịchọ inwetakwu ihe na-achị, karịchaa n'ihe gbasara akụnụba.
- source_word: μέθυσοι
  choice: ndị aṅụrụma
  rationale: Ọ na-egosi ndị ịṅụbiga mmanya ókè ji mara ndụ ha, ọ bụghị naanị onye ṅụrụ mmanya otu mgbe.
- source_word: λοίδοροι
  choice: ndị na-ekwujọ mmadụ
  rationale: Nkebiokwu a na-egosi ndị na-akparị ma ọ bụ na-eji okwu ọjọọ emegbu ndị ọzọ, n'emeghị ka ihe ọ pụtara bụrụ naanị nkwutọ ụgha.
- source_word: ἅρπαγες
  choice: ndị na-apụnara mmadụ ihe
  rationale: Ọ na-eburu echiche nke iji ike, aghụghọ, ma ọ bụ mmegbu napụ ndị ọzọ ihe; ọ sara mbara karịa izu ohi nkịtị.
- source_word: βασιλείαν θεοῦ
  choice: alaeze Chineke
  rationale: Nke a bụ nsụgharị Igbo doro anya ma guzosie ike nke na-echekwa echiche ọchịchị na alaeze Chineke.
- source_word: κληρονομήσουσιν
  choice: agaghị eketa
  rationale: Ọ na-echekwa ihe atụ nke ihe nketa na ọdịdị okwu ọdịnihu dị n'okwu Grik ahụ.
theological_decisions:
- issue: Ike ndepụta omume ọjọọ na okwu banyere iketa alaeze
  choice: E debere aha ọtụtụ ndị nke na-egosi ụdị mmadụ omume ndị a ji mara, n'etinyeghị okwu nkọwa dịka “ndị na-adịghị echegharị” n'ime amaokwu ahụ.
  alternative: Ịsụgharị ya ka ọ na-ekwu maka onye ọ bụla mere otu n'ime omume ndị a ọbụna naanị otu mgbe, ma ọ bụ ịgbakwunye “ndị na-adịghị echegharị.”
  rationale: Ụdị aha ọtụtụ ndị dị na ndepụta omume ọjọọ na-egosikarị ndị omume ndị ahụ ji mara. Ma ebe ederede n'onwe ya etinyeghị nkọwa banyere nchegharị ma ọ bụ ugboro omume ahụ mere, nsụgharị ahụ ekwesịghị idozi esemokwu nkà mmụta okpukpe ahụ n'ime isi okwu.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E jigidere usoro ndepụta ahụ na okwu nketa nke ederede Grik. E tinyere akara ụkwụ okwu niile n'isi amaokwu, ma zere okwu ụka pụrụ iche ma ọ bụ nkọwa na-ekpebi esemokwu nkà mmụta okpukpe.
