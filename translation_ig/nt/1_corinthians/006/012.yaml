  to: “E kwere m ime ihe niile,”[a] ma ọ bụghị ihe niile bara uru.[b] “E kwere m ime ihe niile,” ma agaghị m ekwe ka ihe ọ bụla chịkwaa m.[c]
  rationale: 'Only the final main-text verb is revised: ‘chịkwaa m’ is a more natural and precise Standard Igbo rendering of the Greek future passive, ‘I will not be mastered/controlled by anything.’ The repeated wording, quotation-mark convention, theological restraint, and all footnote anchors and alternatives are retained.'
