id: 1CO.6.12
reference: 1 Corinthians 6:12
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Πάντα μοι ἔξεστιν· ἀλλ’ οὐ πάντα συμφέρει. πάντα μοι ἔξεστιν· ἀλλ’ οὐκ ἐγὼ ἐξουσιασθήσομαι ὑπό τινος.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/012.yaml
  text: “All things are lawful for me,” but not all things are beneficial[c][b][a]. “All things are lawful for me,” but I will not be mastered by anything.
translation:
  language: ig
  text: “E kwere m ime ihe niile,”[a] ma ọ bụghị ihe niile bara uru.[b] “E kwere m ime ihe niile,” ma agaghị m ekwe ka ihe ọ bụla chịkwaa m.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ, n’enweghị akara nhota: E kwere m ime ihe niile. Ọtụtụ ndị na-aghọta nkebi okwu a dịka okwu ndị Kọrint ji ekwu, nke Pọl na-ehota ma mesịa nye ya oke.'
    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ, na-eweta uru; ma ọ bụ, na-enye aka.
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, ma agaghị m abanye n’okpuru ike nke ihe ọ bụla.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάντα
  choice: ihe niile
  rationale: Okwu Grik a bụ aha nnọchi nke na-agụnye ihe n’ozuzu ya. ‘Ihe niile’ na-edobe ịdị obosara nke okwu ahụ na nkwughachi ya.
- source_word: μοι
  choice: m
  rationale: N’usoro ‘E kwere m ime,’ ọ na-egosi onye e nyere ohere ime ihe; nke a bụ ụzọ Igbo dị mfe ma bụrụkwa nke e ji ekwu okwu taa.
- source_word: ἔξεστιν
  choice: E kwere ... ime
  rationale: Ngwaa a pụtara na e nyere mmadụ ohere ma ọ bụ na ihe ahụ megidereghị iwu. ‘E kwere m ime’ doro ndị na-agụ Igbo anya ma na-edobe echiche nke ikike ma ọ bụ nnwere onwe.
- source_word: ἀλλ’ οὐ πάντα συμφέρει
  choice: ma ọ bụghị ihe niile bara uru
  rationale: συμφέρει n’ebe a pụtara ihe na-eweta uru ma ọ bụ na-enyere aka. ‘Bara uru’ bụ okwu Igbo nkịtị nke na-adịghị eme ka echiche ahụ bụrụ naanị uru ego.
- source_word: οὐκ ἐγὼ ἐξουσιασθήσομαι
  choice: ma agaghị m ekwe ka ... chịwa m
  rationale: Ụdị passive nke ἐξουσιάζω na-egosi ịbanye n’okpuru ikike ma ọ bụ ọchịchị ihe ọzọ. N’Igbo, ‘agaghị m ekwe ka ... chịwa m’ na-enye echiche ahụ n’ụzọ eke ma na-egosikwa mkpebi siri ike nke ἐγώ.
- source_word: ὑπό τινος
  choice: ihe ọ bụla
  rationale: τινος nwere ike ịdị obosara, ma n’ọnọdụ a ọ na-ezo nke ọma n’ihe ma ọ bụ omume ndị nwere ike ịchị mmadụ. ‘Ihe ọ bụla’ na-edobe obosara ahụ.
theological_decisions:
- issue: Ma Πάντα μοι ἔξεστιν ọ bụ okwu ndị Kọrint ji ekwu nke Pọl na-ehota
  choice: E tinyere okwu ahụ ugboro abụọ n’akara nhota dịka okwu e hotara.
  alternative: A pụrụ ide ya n’enweghị akara nhota dịka okwu Pọl n’onwe ya, nke nkebi okwu ndị na-esote na-akọwa ma na-amachi.
  rationale: Ọtụtụ ndị na-aghọta ya dịka okwu a ma ama n’etiti ndị Kọrint nke Pọl na-ehota ma na-edozi. Ma ihe odide Grik ochie enweghị akara nhota, ya mere nke a bụ mkpebi ntụgharị, ọ bụghị ọdịiche dị n’ihe odide. Ihe odide ala peeji na-edobe nghọta ọzọ ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. A họọrọ ‘E kwere m ime’ kama usoro iwu siri ike ma ọ bụ okwu Igbo ochie; a họọrọ ‘chịwa m’ iji mee ka echiche nke ịnọ n’okpuru ikike doo anya. Nkwughachi nke ahịrị Grik ahụ ka e debere iji chekwaa usoro na ike okwu Pọl.
