id: 1CO.6.11
reference: 1 Corinthians 6:11
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ταῦτά τινες ἦτε· ἀλλὰ ἀπελούσασθε, ἀλλὰ ἡγιάσθητε, ἀλλὰ ἐδικαιώθητε ἐν τῷ ὀνόματι τοῦ κυρίου ⸀Ἰησοῦ καὶ ἐν τῷ πνεύματι τοῦ θεοῦ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/011.yaml
  text: And such were some of you[a]. But you washed yourselves, but you were sanctified[c][b], but you were justified in the name of the Lord Jesus and in the Spirit of our God.
translation:
  language: ig
  text: Ụfọdụ n’ime unu bụkwa ndị dị otu ahụ. Ma e sachara unu[a], ma e doro unu nsọ, ma a gụrụ unu ndị ezi omume n’aha Onyenwe anyị Jizọs nakwa n’ime Mmụọ nke Chineke anyị.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “unu sachara onwe unu.” Ụdị ngwaa Grik ahụ nwere ike inwe nghọta a, ọ bụ ezie na ọtụtụ ndị na-ewere ya dịka otu n’ime omume nzọpụta Chineke mere n’ahịrịokwu a.
    reason: alternative_reading
  - marker: b
    text: A pụkwara ịsụgharị ya, “site na Mmụọ nke Chineke anyị.” Okwu mbu ụzọ Grik a nwere ike igosi ime ihe n’ime ọnọdụ ma ọ bụ n’ike Mmụọ, ma ọ bụ igosi na Mmụọ bụ onye e si n’aka ya mee ihe.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ταῦτά τινες ἦτε
  choice: Ụfọdụ n’ime unu bụkwa ndị dị otu ahụ
  rationale: Nke a na-ezo aka n’ụdị ndị a kpọrọ aha n’amaokwu bu ụzọ. Nsụgharị a na-edobe ike ngosi nke ταῦτα ma na-ada ka Igbo e ji ekwu okwu ugbu a.
- source_word: ἀλλὰ
  choice: ma
  rationale: Ikwughachi “ma” ugboro atọ na-edobe ntụgharị okwu siri ike na usoro nkwusiri ike Pọl ji mee ihe.
- source_word: ἀπελούσασθε
  choice: e sachara unu
  rationale: Ọ bụ ezie na ngwaa Grik a dị n’olu etiti, usoro ya na ngwaa abụọ sochiri ya na-akwado nghọta nke omume nzọpụta e mere n’ahụ ha. E debere nghọta nke ịsa onwe ha n’ala peeji.
- source_word: ἡγιάσθητε
  choice: e doro unu nsọ
  rationale: “Ido nsọ” bụ okwu Igbo doro anya nke na-egosi ime ka mmadụ bụrụ nke Chineke ma ọ bụ kewapụ ya nye Chineke, n’enweghị ịgbakwunye nkọwa otu ụka.
- source_word: ἐδικαιώθητε
  choice: a gụrụ unu ndị ezi omume
  rationale: Nke a na-egosi mkpebi na ọnọdụ ọhụrụ dị n’ihu Chineke, ma ọ naghị agwakọta ngwaa a na echiche sara mbara nke omume ziri ezi ma ọ bụ ikpe ziri ezi.
- source_word: ἐν τῷ ὀνόματι τοῦ κυρίου Ἰησοῦ
  choice: n’aha Onyenwe anyị Jizọs
  rationale: “N’aha” na-edobe ohere nghọta nke ἐν dịka ọnọdụ, ikike, ma ọ bụ ụzọ e si mee ihe.
- source_word: ἐν τῷ πνεύματι τοῦ θεοῦ ἡμῶν
  choice: n’ime Mmụọ nke Chineke anyị
  rationale: Nsụgharị a na-edobe ἐν n’ụzọ na-adịghị ekpebi kpamkpam ma ọ na-egosi ọnọdụ ma ọ bụ onye ji ike ya rụọ ọrụ ahụ. Mkpụrụedemede ukwu na “Mmụọ” na-egosi na okwu a yiri ka ọ na-ezo aka na Mmụọ Nsọ.
theological_decisions:
- issue: Olu na onye mere omume dị na ἀπελούσασθε
  choice: e sachara unu
  alternative: unu sachara onwe unu
  rationale: Ụdị olu etiti ahụ nwere ike ibu nghọta nke ime ihe n’onwe ha, ma ngwaa ndị passive gbara ya gburugburu na usoro omume nzọpụta na-akwado nsụgharị yiri passive. E gosiri nhọrọ nke ọzọ n’ala peeji iji ghara ikpochapụ mgbagwoju anya dị n’asụsụ mbụ.
- issue: Ihe πνεύματι na-ezo aka na ya
  choice: Mmụọ nke Chineke anyị
  alternative: ọnọdụ ime mmụọ n’ozuzu ya
  rationale: N’akwụkwọ Pọl, “Mmụọ nke Chineke anyị” na-ezokarị aka na Mmụọ Nsọ, ma nsụgharị ahụ etinyeghị okwu “Nsọ” nke na-adịghị n’amaokwu a.
- issue: Ọrụ ἐν n’ahịrị ikpeazụ
  choice: n’ime Mmụọ
  alternative: site na Mmụọ
  rationale: “N’ime” na-edobe ọdịdị preposition Grik ahụ na ụfọdụ ambiguity ya; “site na” ga-eme ka nghọta nke onye ji ike ya mee ihe bụrụ naanị nghọta enwere.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke nwere ugwu ma dị mfe nghọta. E zere okwu ụka pụrụ iche ebe okwu Igbo nkịtị nwere ike ibuga ihe Grik kwuru. Ikwughachi “ma” na-edobe ụda nkwusiri ike nke amaokwu ahụ.
