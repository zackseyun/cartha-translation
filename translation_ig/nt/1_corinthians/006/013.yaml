id: 1CO.6.13
reference: 1 Corinthians 6:13
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τὰ βρώματα τῇ κοιλίᾳ, καὶ ἡ κοιλία τοῖς βρώμασιν· ὁ δὲ θεὸς καὶ ταύτην καὶ ταῦτα καταργήσει. τὸ δὲ σῶμα οὐ τῇ πορνείᾳ ἀλλὰ τῷ κυρίῳ, καὶ ὁ κύριος τῷ σώματι·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/013.yaml
  text: Food is for the stomach[a], and the stomach for food—but God will do away with both it and them. But the body is not for sexual immorality, but for the Lord[c][b], and the Lord for the body.
translation:
  language: ig
  text: Ihe oriri dị maka afọ, afọ dịkwa maka ihe oriri—ma Chineke ga-eme ka ma nke a ma ihe ndị a kwụsị ịdị irè.[a] Ma ahụ abụghị maka ịkwa iko, kama ọ bụ maka Onyenwe anyị; Onyenwe anyị dịkwa maka ahụ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ma Chineke ga-ebibi ma nke a ma ihe ndị a,” ma ọ bụ “ga-ewepụ ha.” “Nke a” na-ezo aka n'afọ, “ihe ndị a” na-ezokwa aka n'ihe oriri.
    reason: lexical_alternative
  - marker: b
    text: Ọtụtụ ndị na-akọwa Akwụkwọ Nsọ chere na “Ihe oriri dị maka afọ, afọ dịkwa maka ihe oriri” bụ okwu ndị Kọrịnt na-ekwukarị, nke Pọl hotara tupu o dozie echiche ha. Ma ederede Grik egosighị nke a hoo haa.
    reason: alternative_reading
lexical_decisions:
- source_word: τὰ βρώματα
  choice: ihe oriri
  rationale: Ọ bụ ezie na okwu Grik a dị n'ụdị ọtụtụ, “ihe oriri” bụ okwu mkpokọta sitere n'okike n'Igbo ma ka na-egosipụta nri n'ozuzu ya.
- source_word: κοιλίᾳ / κοιλία
  choice: afọ
  rationale: N'ebe a, “afọ” na-ezo aka n'akụkụ ahụ nke na-anabata ma na-agbari nri; ọ bụ okwu Igbo doro anya ma bụrụ nke a na-ejikarị eme ihe.
- source_word: καταργήσει
  choice: ga-eme ka ... kwụsị ịdị irè
  rationale: Nhọrọ a na-egosi ime ka ọrụ ma ọ bụ ọnọdụ ihe kwụsị, n'ekwughị hoo haa na Chineke ga-ebibi ha kpamkpam.
- source_word: ταύτην καὶ ταῦτα
  choice: ma nke a ma ihe ndị a
  rationale: A hapụrụ ọdịiche dị n'etiti nnọchiaha otu nke na-ezo aka n'afọ na nnọchiaha ọtụtụ nke na-ezo aka n'ihe oriri, dịka ọ dị na Grik.
- source_word: σῶμα
  choice: ahụ
  rationale: “Ahụ” bụ nsụgharị Igbo ziri ezi ma bụrụ nke nkịtị maka ahụ mmadụ a na-ekwu maka ya n'ebe a.
- source_word: πορνείᾳ
  choice: ịkwa iko
  rationale: N'Igbo Baịbụl na n'okwu okwukwe a na-aghọta nke ọma, “ịkwa iko” na-anọchi omume mmekọahụ megidere ụkpụrụ Chineke; ọ na-ada ugwu ma dị mfe nghọta.
- source_word: κυρίῳ / κύριος
  choice: Onyenwe anyị
  rationale: Nke a bụ okwu Igbo a na-ejikarị asụgharị κύριος mgbe ọ na-ezo aka na Jizọs, ma na-echekwa ibu okwu ahụ n'echiche Kraịst.
- source_word: δὲ
  choice: ma
  rationale: “Ma” na-egosipụta ọdịiche dị n'etiti okwu banyere nri na afọ na nkwupụta banyere ahụ na Onyenwe anyị.
theological_decisions:
- issue: Ma ahịrịokwu mmalite ahụ bụ okwu ndị Kọrịnt kwuru ka Pọl na-ehota, ka ọ bụ okwu Pọl n'onwe ya
  choice: E tinyere ya dịka nkwupụta nkịtị, n'enweghị akara nhota okwu.
  alternative: Itinye ya n'akara nhota okwu ma ọ bụ ịgbakwunye “unu na-ekwu.”
  rationale: Grik anaghị enye akara doro anya na ọ bụ nhota okwu. Nsụgharị ahụ na-echekwa ejighị n'aka a, ebe akara ogologo na “ma” na-egosipụta mgbanwe okwu.
- issue: Ihe καταργήσει pụtara banyere afọ na ihe oriri
  choice: “ga-eme ka ... kwụsị ịdị irè”
  alternative: “ga-ebibi ha” ma ọ bụ “ga-ewepụ ha”
  rationale: Nke a na-echekwa echiche nke ịkwụsị ọrụ ha n'ọdịnihu n'emeghị ka okwu ahụ bụrụ nkwupụta doro anya banyere mbibi anụ ahụ kpamkpam.
- issue: Ike okwu “Onyenwe anyị dịkwa maka ahụ”
  choice: E debere okwu mmekọrịta ahụ nkenke dịka Grik si dị.
  alternative: “Onyenwe anyị na-elekọta ahụ” ma ọ bụ “Onyenwe anyị dị maka ọdịmma ahụ.”
  rationale: Ịgbasa ya ga-akọwa ụdị mmekọrịta ahụ karịa ihe ederede kwuru. Okwu nkenke ahụ na-echekwa nhata na esemokwu echiche dị n'ahịrịokwu ahụ.
translation_notes:
  register: 'Ejiri Standard Igbo nke oge a, nke dị mfe nghọta ma nwee ugwu. E chekwara usoro okwu abụọ na-emekọrịta onwe ha: ihe oriri/afọ na ahụ/Onyenwe anyị. E tinyere nkọwa niile n''ụkwụedemede ebe ederede Grik nwere nhọrọ ntụgharị ma ọ bụ ejighị n''aka.'
