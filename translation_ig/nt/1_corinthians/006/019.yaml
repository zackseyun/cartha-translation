review_pass:
  verdict: revise
  source_fidelity: The draft accurately retains the rhetorical question, singular “ahụ” with plural “unu,” the temple metaphor, the Holy Spirit’s presence among/in the addressees, the divine source, and the concluding statement of non-self-possession. “Site na Chineke” is a more direct and idiomatic rendering of ἀπὸ θεοῦ than “site n'aka Chineke,” which can evoke agency by God’s hand.
  naturalness: The verse is generally clear Standard Igbo. Adding commas around the restrictive/appositional description of the Holy Spirit makes the referents and sentence structure easier to follow. The alternative wording in footnote a needs correction for natural Igbo syntax.
  terminology: “ụlọ nsọ,” “Mmụọ Nsọ,” “ahụ unu,” and “nke onwe unu” are appropriate, dignified, and theologically non-expansive. The personal relative “onye” is suitable for the stated referent without adding doctrinal interpretation.
  issues:
  - severity: low
    issue: Footnote a has awkward relative-clause syntax.
    rationale: “nke Mmụọ Nsọ onye nọ n'ime unu” requires punctuation and is more naturally expressed with the relative clause following “Mmụọ Nsọ.”
  - severity: low
    issue: “site n'aka Chineke” is less direct than the source expression.
    rationale: ἀπὸ θεοῦ simply identifies God as source; “site na Chineke” is idiomatic and avoids the additional hand/agency nuance.
  revised_text: Ma ọ bụ na unu amaghị na ahụ unu bụ ụlọ nsọ nke Mmụọ Nsọ, onye nọ n'ime unu, onye unu nwere site na Chineke? Unu abụghịkwa nke onwe unu,
