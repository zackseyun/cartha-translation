id: 1CO.6.19
reference: 1 Corinthians 6:19
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἢ οὐκ οἴδατε ὅτι τὸ σῶμα ὑμῶν ναὸς τοῦ ἐν ὑμῖν ἁγίου πνεύματός ἐστιν, οὗ ἔχετε ἀπὸ θεοῦ; καὶ οὐκ ἐστὲ ἑαυτῶν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/019.yaml
  text: Or do you not know that your body is a temple of the Holy Spirit within you[a], whom you have from God? And you are not your own[b],
translation:
  language: ig
  text: Ma ọ bụ na unu amaghị na ahụ unu bụ ụlọ nsọ nke Mmụọ Nsọ, onye nọ n'ime unu, onye unu nwere site na Chineke? Unu abụghịkwa nke onwe unu,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἢ
  choice: Ka ọ bụ na
  rationale: Na-egosi ajụjụ nkwupụta nke na-aga n'ihu n'arụmụka Pọl ma na-echekwa ntụgharị okwu ya siri ike.
- source_word: οὐκ οἴδατε
  choice: unu amaghị
  rationale: Ọ bụ ụzọ ajụjụ Pọl na-ejikarị ekwu okwu; nsụgharị a kwekọrọ n'οἶδα ma bụrụkwa Igbo nkịtị.
- source_word: τὸ σῶμα ὑμῶν
  choice: ahụ unu
  rationale: E chekwara 'ahụ' n'ọnụọgụ otu na 'unu' n'ọnụọgụ ọtụtụ dịka Grik si dị, ka a ghara ikpebi ma ọ na-ekwu maka ahụ onye ọ bụla n'ime ha ka ọ bụ ahụ dịka ihe nnọchianya.
- source_word: ναὸς
  choice: ụlọ nsọ
  rationale: Na-egosi ebe nsọ pụrụ iche, ọ bụghị naanị ogige dị nsọ; 'ụlọ nsọ' bụ okwu Igbo doro anya ma dị ugwu.
- source_word: τοῦ ἐν ὑμῖν ἁγίου πνεύματός
  choice: nke Mmụọ Nsọ nọ n'ime unu
  rationale: Na-ejikọta genitive ahụ na 'ụlọ nsọ' ma na-echekwa ἐν ὑμῖν n'ụzọ Igbo dị mma.
- source_word: οὗ
  choice: onye
  rationale: Nnọchiaha ahụ na-ezo aka na Mmụọ Nsọ; 'onye' na-egosi onye a na-ekwu maka ya n'ụzọ kwekọrọ na ụtọasụsụ ahụ.
- source_word: ἔχετε ἀπὸ θεοῦ
  choice: unu nwere site n'aka Chineke
  rationale: Na-echekwa ihe ἔχετε pụtara, 'unu nwere,' na isi mmalite nke ἀπὸ θεοῦ n'ejighị 'natara' dochie ya.
- source_word: καὶ οὐκ ἐστὲ ἑαυτῶν
  choice: Unu abụghịkwa nke onwe unu
  rationale: Na-echekwa okwu dị mkpirikpi na echiche na ha abụghị ndị nwe onwe ha, ma na-akwadebe ihe mere e nyere n'amaokwu na-esonụ.
theological_decisions:
- issue: Ihe οὗ na-ezo aka na ya na ịbụ onye nke Mmụọ Nsọ
  choice: A sụgharịrị ya 'onye,' na-ezo aka na Mmụọ Nsọ.
  alternative: Iji nnọchiaha ihe, ma ọ bụ ịhazigharị ahịrịokwu ahụ ka ọ bụrụ 'Mmụọ Nsọ, onye nọ n'ime unu.'
  rationale: Ọdịdị ụtọasụsụ Grik jikọtara οὗ na ἁγίου πνεύματός. 'Onye' na-echekwa njikọ ahụ n'etinyeghị nkọwa ozizi ọzọ.
- issue: Ahụ n'ọnụọgụ otu ebe ndị a na-agwa nọ n'ọnụọgụ ọtụtụ
  choice: E debere 'ahụ unu' kama 'ahụ́ unu niile' ma ọ bụ 'ahụ́ onye ọ bụla n'ime unu.'
  alternative: ahụ́ unu; ahụ onye ọ bụla n'ime unu
  rationale: Grik nwere τὸ σῶμα n'ọnụọgụ otu na ὑμῶν n'ọnụọgụ ọtụtụ. Idebe ọdịdị a na-ahapụ ohere nghọta nkesa na nke nnọchianya n'emebighị esemokwu ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe nghọta ma dị ugwu. E chekwara usoro ajụjụ Pọl, ihe atụ 'ụlọ nsọ,' na mgbagwoju anya dị n'etiti 'ahụ' otu na 'unu' ọtụtụ.
