source:
  edition: SBLGNT
  text: ἀλλὰ ἀδελφὸς μετὰ ἀδελφοῦ κρίνεται, καὶ τοῦτο ἐπὶ ἀπίστων;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/006.yaml
  text: But brother goes to court against brother[b][a], and this before unbelievers?
translation:
  language: ig
  text: Kama, nwanne[a] na-agba nwanne ya akwụkwọ, ọbụnakwa n’ihu ndị na-ekweghị ekwe?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nwanne ndị a bụ ndị otu obodo ndị kwere na Kraịst.
    reason: cultural_note
  - marker: b
    text: A pụkwara ịsụ ya, ‘n’ihu ndị ahụ na-ekweghị ekwe.’ O yikarịrị ka okwu a na-ezo aka n’ụlọikpe ọha nke ndị na-abụghị ndị otu ọgbakọ na-ahụ maka ha; ma okwu Grik ahụ kwuru naanị, ‘n’ihu ndị na-ekweghị ekwe.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Kama
  rationale: Ọ na-egosi nnukwu ọdịiche dị n’etiti ihe Pọl kwuru na amaokwu bu ụzọ na ihe na-eme n’ezie.
- source_word: ἀδελφὸς ... ἀδελφοῦ
  choice: nwanne ... nwanne ya
  rationale: E debere okwu ezinụlọ e kwughachiri ugboro abụọ; n’ebe a ọ na-anọchi anya onye otu ọgbakọ Kraịst.
- source_word: μετὰ
  choice: na-akpọrọ ... gaa ikpe
  rationale: N’ọnọdụ okwu ikpe a, ọ na-egosi na otu onye na-emegide ibe ya n’ikpe, ọ bụghị nanị ịnọnyere ya.
- source_word: κρίνεται
  choice: na-akpọrọ ... gaa ikpe
  rationale: Okwu Grik a nwere nghọta metụtara ịgba akwụkwọ n’ụlọikpe n’ebe a; nsụgharị a bụ Igbo doro anya ma bụrụkwa nke e ji eme ihe.
- source_word: καὶ τοῦτο
  choice: ọbụnakwa
  rationale: Ọ na-ejide mmetụta Pọl nke iju anya na ịkatọ ọnọdụ ahụ n’ụzọ Igbo na-asụ nke ọma.
- source_word: ἐπὶ ἀπίστων
  choice: n’ihu ndị na-ekweghị ekwe
  rationale: Ọ na-echekwa obosara okwu Grik ahụ n’etinyeghị ‘ndị ikpe’ n’ahịrịokwu, ọ bụ ezie na ọnọdụ ahụ bụ nke ụlọikpe.
theological_decisions:
- issue: Uche nnọchianya nke ἀδελφός n’ime ọgbakọ
  choice: nwanne
  alternative: onye kwere ekwe ibe ya; nwanna nwoke
  rationale: ‘Nwanne’ na-echekwa asụsụ ezinụlọ nke Pọl ma na-arụ ọrụ n’Igbo maka onye otu obodo ndị kwere ekwe n’enweghị ịgbakwunye nkọwa na-adịghị n’okwu Grik.
- issue: Oke ihe ἀπίστων na-ezo aka na ya
  choice: ndị na-ekweghị ekwe
  alternative: ndị ikpe na-ekweghị ekwe; ndị nọ n’èzí
  rationale: Nhọrọ a na-echekwa ọdịiche dị n’etiti ọgbakọ na ndị na-abụghị ndị okwukwe, ma ọ naghị eme ka okwu Grik ahụ dị warara karịa ka ọ dị.
translation_notes:
  register: Asụsụ Igbo Izugbe dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji ‘ịkpọrọ mmadụ gaa ikpe’ gosipụta ọnọdụ iwu n’ụzọ ebumpụta ụwa; e chekwara ajụjụ nkwugharị nke Pọl na esemokwu dị n’okwu mbụ.
