review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves the adversative force, the repeated familial term, the forensic setting, and the broad reference to people outside the faith. However, “na-akpọrọ nwanne ya gaa ikpe” can foreground taking someone to a judicial proceeding rather than the reciprocal/adversarial litigation expressed by μετὰ ... κρίνεται. “na-agba nwanne ya akwụkwọ” is the clearer standard Igbo legal idiom for suing someone.
  naturalness: The revised clause is more idiomatic and concise in modern Standard Igbo. Moving the community-note anchor to its referent also makes the annotation structure clearer.
  terminology: “Nwanne” appropriately retains Paul’s family/community language without forcing a male-only reading in Igbo. “Ndị na-ekweghị ekwe” faithfully retains ἀπίστων without adding that they are judges. “N’ihu” is a natural rendering of the forensic/public setting implied by ἐπὶ.
  issues:
  - severity: medium
    issue: The main-clause legal idiom is not optimally precise.
    rationale: “Na-akpọrọ ... gaa ikpe” may mean taking someone to trial, whereas the Greek depicts a brother litigating against a brother. “Na-agba ... akwụkwọ” directly expresses bringing a lawsuit against another person.
  - severity: low
    issue: Footnote a is attached to “ikpe” rather than to “nwanne.”
    rationale: The note explains the repeated term “nwanne,” so its anchor should occur immediately after that term.
  - severity: low
    issue: Footnote b’s explanatory sentence is somewhat awkwardly phrased in Igbo.
    rationale: A more direct formulation preserves the cautious explanatory force while avoiding the cumbersome description of court administration.
  revised_text: Kama, nwanne[a] na-agba nwanne ya akwụkwọ, ọbụnakwa n’ihu ndị na-ekweghị ekwe?[b]
