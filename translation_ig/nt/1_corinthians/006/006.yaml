- from: Kama, nwanne na-akpọrọ nwanne ya gaa ikpe[a], ọbụnakwa n’ihu ndị na-ekweghị ekwe?[b]
  to: Kama, nwanne[a] na-agba nwanne ya akwụkwọ, ọbụnakwa n’ihu ndị na-ekweghị ekwe?[b]
  rationale: The revision replaces an only partially equivalent courtroom expression with the established Igbo expression for suing another person, retaining the Greek’s adversarial legal sense. It preserves the rhetorical “even/besides this” force of καὶ τοῦτο, the question form, and the deliberately broad wording for ἀπίστων. Footnote markers and wording are adjusted for clear reference and natural Standard Igbo.
