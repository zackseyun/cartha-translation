  text: Do you not know that we will judge angels? How much more[a], the things of this life!
translation:
  language: ig
  text: Ọ̀ bụ na unu amaghị na anyị ga-ekpe ndị mmụọ ozi ikpe? Ya fọdụzie[a] ihe ndị metụtara ndụ a!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “oleekwa otú ihe ndị metụtara ndụ a ga-adị?” ma ọ bụ “karịsịa ihe ndị metụtara ndụ a.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ οἴδατε
  choice: Ọ̀ bụ na unu amaghị
  rationale: Nke a na-edobe ajụjụ nkwugharị Pọl ji eme ka ndị na-agụ ya chebara ihe ha kwesịrị ịma echiche, ma bụrụkwa Igbo doro anya ma na-aga were were.
- source_word: ὅτι
  choice: na
  rationale: “Na” na-ewebata nkebiokwu na-akọwa ihe ha kwesịrị ịma.
- source_word: ἀγγέλους
  choice: ndị mmụọ ozi
  rationale: N'ọnọdụ ikpe nke ga-eme n'ọdịnihu a, okwu ahụ na-ezo aka n'ihe ndị dị n'eluigwe, ọ bụghị ndị mmadụ na-ezisa ozi.
- source_word: κρινοῦμεν
  choice: anyị ga-ekpe ... ikpe
  rationale: “Ga-ekpe ... ikpe” na-egosipụta ọdịnihu nke ngwaa Grik ahụ ma na-edobe echiche ikpe n'emeghị ka ọ pụta nanị ịchị achị.
- source_word: μήτιγε
  choice: Ya fọdụzie
  rationale: 'Akpaokwu Igbo a na-egosipụta arụmụka sitere n''ihe ka ukwuu gaa n''ihe pekarịrị: ọ bụrụ na ndị kwere ekwe ga-ekpe ndị mmụọ ozi ikpe, ihe ndị metụtara ndụ ugbu a ekwesịghị ịkarị ha ike. Ihe odide ala peeji na-edobe ụzọ ndị ọzọ e nwere isi ghọta ma kwuo njikọ a.'
- source_word: βιωτικά
  choice: ihe ndị metụtara ndụ a
  rationale: Nkọwa a sara mbara ma na-ezo aka n'ihe omume nke ndụ mmadụ n'ụwa, gụnyere esemokwu ikpe dị n'ọnọdụ gbara amaokwu ahụ gburugburu, n'emeghị ka okwu ahụ dị warara karịa Grik.
theological_decisions:
- issue: Ụdị ikpe ndị kwere ekwe ga-ekpe ndị mmụọ ozi
  choice: anyị ga-ekpe ndị mmụọ ozi ikpe
  alternative: anyị ga-achị ndị mmụọ ozi; anyị ga-ama ndị mmụọ ozi dara ada ikpe
  rationale: Ihe odide ahụ kwuru kpọmkwem na ndị kwere ekwe ga-ekpe ndị mmụọ ozi ikpe, ma ọ kọwaghị otú ikpe ahụ ga-adị, ókè ọ ga-eru, ma ọ bụ na ọ bụ naanị ndị mmụọ ozi dara ada ka ọ na-ekwu maka ha. Ya mere, nsụgharị ahụ anaghị etinye nkọwa ozizi nke ihe odide ahụ n'onwe ya na-ekwughị.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. “Ya fọdụzie” bụ akpaokwu nkịtị na nke siri ike nke na-eburu nrụgide arụmụka μήτιγε, ebe “ihe ndị metụtara ndụ a” na-edobe obosara βιωτικά. Akara ala peeji [a] dị n'isiokwu ahụ ozugbo n'akụkụ okwu ọ na-akọwa.
