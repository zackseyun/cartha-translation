    issue: Ihe odide ala peeji [a] mbụ anaghị adị eke ma ghara ịbụ nhọrọ ntụgharị kwesịrị ekwesị.
    rationale: Nkebiokwu “ọ ga-akara nnọọ anyị ikpe ihe ndị metụtara ndụ a” nwere nsogbu nhazi na nghọta n’Igbo, ma ọ bụghịkwa ụzọ doro anya isi kwuo μήτιγε. A ghaghị dochie ya na nhọrọ ndị na-egosi ‘let alone/much less’ na, n’ọnọdụ a, ‘much more’ n’enweghị ịgbakwunye nkọwa.
