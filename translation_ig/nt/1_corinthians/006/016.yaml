id: 1CO.6.16
reference: 1 Corinthians 6:16
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸀ἢ οὐκ οἴδατε ὅτι ὁ κολλώμενος τῇ πόρνῃ ἓν σῶμά ἐστιν; Ἔσονται γάρ, φησίν, οἱ δύο εἰς σάρκα μίαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/016.yaml
  text: Or do you not know that the one who joins himself to a prostitute is one body with her? For[a], as he says[b], “The two will become one flesh.”
translation:
  language: ig
  text: Ka ọ̀ bụ na unu amaghị na onye na-ejikọta onwe ya na nwanyị akwụna bụ otu ahụ́ na ya? N’ihi na, dị ka ọ na-ekwu,[a] “Ha abụọ ga-aghọ otu anụ ahụ́.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'N’asụsụ Grik: “ọ na-ekwu.” Nhota a sitere na Jenesis 2:24.'
    reason: cross_reference
lexical_decisions:
- source_word: ἢ
  choice: Ka ọ̀ bụ na
  rationale: Na-aga n’ihu n’arụmụka Pọl dịka ajụjụ nzaghachi, n’ụzọ Igbo na-ada nke ọma.
- source_word: οὐκ οἴδατε
  choice: unu amaghị
  rationale: Na-echekwa usoro ajụjụ Pọl ji akpọ ndị na-agụ ya ka ha cheta ihe ha maara.
- source_word: ὁ κολλώμενος
  choice: onye na-ejikọta onwe ya
  rationale: Na-egosi isonyere ma ọ bụ ịrapara n’ahụ onye ọzọ; ‘onwe ya’ na-echekwa nghọta nke onye ahụ ji aka ya banye na njikọ ahụ.
- source_word: τῇ πόρνῃ
  choice: na nwanyị akwụna
  rationale: πόρνη pụtara kpọmkwem nwanyị na-agba akwụna; okwu a doro ndị Igbo nke oge a anya.
- source_word: ἓν σῶμά ἐστιν
  choice: na ya bụ otu ahụ́
  rationale: Na-egosi na nwoke ahụ na nwanyị ahụ bụ otu ahụ́, n’enweghị ịgbakwunye na ha ‘ghọrọ’ otu n’ahịrịokwu mbụ ebe Grik kwuru ‘bụ.’
- source_word: Ἔσονται γάρ
  choice: N’ihi na ... ga-aghọ
  rationale: γάρ na-enye ihe ndabere maka okwu bu ụzọ, ebe ọdịdị ọdịnihu ya na εἰς na-egosi ịghọ.
- source_word: φησίν
  choice: dị ka ọ na-ekwu
  rationale: Na-echekwa onye nke atọ otu mkpụrụ okwu Grik ahụ n’akọwaghị kpọmkwem onye na-ekwu ya.
- source_word: οἱ δύο
  choice: Ha abụọ
  rationale: Ọ bụ ntụgharị eke nke na-echekwa mmadụ abụọ ahụ e kwuru banyere ha.
- source_word: εἰς σάρκα μίαν
  choice: otu anụ ahụ́
  rationale: 'Na-echekwa ihe σάρξ pụtara n’ebe a: njikọ anụ ahụ na mmekọrịta, ọ bụghị ‘ọdịdị mmehie.’'
theological_decisions:
- issue: Ihe nhota Jenesis pụtara banyere mmekọahụ na-abụghị nke alụmdi na nwunye
  choice: E gosipụtara na mmekọahụ na nwanyị akwụna na-eme ka ha bụrụ otu ahụ́, a hapụkwara nhota ‘otu anụ ahụ́’ ka ọ kwado okwu ahụ n’onwe ya.
  alternative: Ịkọwa nhota ahụ dịka nke metụtara naanị alụmdi na nwunye, ma ọ bụ ịgbakwunye nkwubi okwu gbasara alụmdi na nwunye na-adịghị n’amaokwu a.
  rationale: Pọl ji Jenesis 2:24 tụnyere njikọ ahụ nke onye ya na nwanyị akwụna nwere. Ntụgharị ahụ kwesịrị ichekwa ike okwu a na esemokwu nkà mmụta okpukpe dị na ya, n’agbakwụnyeghị nkọwa na-adịghị na Grik.
translation_notes:
  register: Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta. E ji ‘ahụ́’ tụgharị σῶμα, ma jiri ‘anụ ahụ́’ tụgharị σάρξ ka ọdịiche okwu Grik abụọ ahụ pụta ìhè. Akara ụda dị mkpa dị na ‘ọ̀’ na ‘ahụ́’ iji belata mgbagwoju anya.
