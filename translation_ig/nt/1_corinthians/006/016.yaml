revisions:
- from: Ka ọ̀ bụ na unu amaghị na onye na-ejikọta onwe ya na nwanyị akwụna na ya bụ otu ahụ́? N’ihi na, dị ka ọ na-ekwu,[a] “Ha abụọ ga-aghọ otu anụ ahụ́.”
  to: Ka ọ̀ bụ na unu amaghị na onye na-ejikọta onwe ya na nwanyị akwụna bụ otu ahụ́ na ya? N’ihi na, dị ka ọ na-ekwu,[a] “Ha abụọ ga-aghọ otu anụ ahụ́.”
  rationale: The revision only moves the comitative phrase “na ya” to its clearer idiomatic position after “bụ otu ahụ́.” It retains the present assertion “bụ,” the generic reference to a prostitute, the deliberately nonspecific “ọ na-ekwu,” and the Genesis wording “otu anụ ahụ́.”
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T18:11:23Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the rhetorical question, the specific sense of πόρνη as “prostitute,” the σώμα/σάρξ distinction, and the Genesis quotation. However, the first clause’s current word order (“na ya bụ otu ahụ́”) is syntactically less clear in Igbo and can obscure that the woman is the other party in the one-body union.
  naturalness: “Ka ọ̀ bụ na unu amaghị” and “Ha abụọ ga-aghọ otu anụ ahụ́” are natural Standard Igbo. Repositioning “na ya” after the predicate produces a clearer and more idiomatic expression of “is one body with her.”
  terminology: “nwanyị akwụna” is an appropriate modern, specific equivalent for πόρνη. “ahụ́” for σῶμα and “anụ ahụ́” for σάρξ properly preserve the lexical distinction without imposing further theological interpretation.
  issues:
  - severity: medium
    issue: Ambiguous/awkward placement of “na ya” in the first clause
    rationale: In “onye na-ejikọta onwe ya na nwanyị akwụna na ya bụ otu ahụ́,” the sequence “na ya bụ” is less transparent than the normal predicate followed by its comitative complement. “bụ otu ahụ́ na ya” clearly states that the person is one body with the prostitute, matching ἓν σῶμά ἐστιν.
  revised_text: Ka ọ̀ bụ na unu amaghị na onye na-ejikọta onwe ya na nwanyị akwụna bụ otu ahụ́ na ya? N’ihi na, dị ka ọ na-ekwu,[a] “Ha abụọ ga-aghọ otu anụ ahụ́.”
  revised_footnotes:
  - marker: a
    text: 'N’asụsụ Grik: “ọ na-ekwu.” Nhota a sitere na Jenesis 2:24.'
    reason: cross_reference
  revision_rationale: The revision only moves the comitative phrase “na ya” to its clearer idiomatic position after “bụ otu ahụ́.” It retains the present assertion “bụ,” the generic reference to a prostitute, the deliberately nonspecific “ọ na-ekwu,” and the Genesis wording “otu anụ ahụ́.”
