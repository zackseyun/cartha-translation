- from: N’ezie, mgbe ahụ, ọ bụrụlarị mmeri e meriri unu kpamkpam na unu nwere ikpe n’etiti onwe unu.[a][b] Gịnị mere unu agaghị ekwe ka e megbuo unu kama? Gịnị mere unu agaghị ekwe ka a napụ unu ihe unu kama?[c]
  to: Ya mere, n’ezie, ọ bụrịrị mfu zuru ezu[a] nye unu n’ihi na unu nwere ikpe[b] n’etiti onwe unu. Gịnị mere unu agaghị ekwe ka e mejọọ unu kama? Gịnị mere unu agaghị ekwe ka a napụ unu ihe unu kama?[c]
