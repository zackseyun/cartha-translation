id: 1CO.6.7
reference: 1 Corinthians 6:7
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἤδη μὲν ⸀οὖν ὅλως ἥττημα ὑμῖν ἐστιν ὅτι κρίματα ἔχετε μεθ’ ἑαυτῶν· διὰ τί οὐχὶ μᾶλλον ἀδικεῖσθε; διὰ τί οὐχὶ μᾶλλον ἀποστερεῖσθε;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/007.yaml
  text: Indeed[a], then, it is already altogether a defeat for you that you have lawsuits among yourselves[c][b]. Why not rather be wronged? Why not rather be defrauded?
translation:
  language: ig
  text: Ya mere, n’ezie, ọ bụrịrị mfu zuru ezu[a] nye unu n’ihi na unu nwere ikpe[b] n’etiti onwe unu. Gịnị mere unu agaghị ekwe ka e mejọọ unu kama? Gịnị mere unu agaghị ekwe ka a napụ unu ihe unu kama?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ọdịda” ma ọ bụ “mmeri e meriri mmadụ,” kama “mfu.” Okwu Grik ἥττημα nwere ike ịpụta mfu, ọdịda, ma ọ bụ mmeri e meriri mmadụ.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị “ikpe” dị ka “okwu ikpe ụlọikpe.” N’ebe a, okwu Grik κρίματα na-ezo aka n’esemokwu a na-ebuga n’ụlọikpe.
    reason: lexical_alternative
  - marker: c
    text: A pụkwara ịsụgharị ya, “ka a ghọgbuo unu” ma ọ bụ “ka a napụ unu ihe ruuru unu.” Okwu Grik ἀποστερεῖσθε nwere ike ịpụta ịnapụ mmadụ ihe, ịghọgbu ya, ma ọ bụ ịnapụ ya ihe ruuru ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤδη
  choice: ọ bụrụlarị
  rationale: Na-egosi na ọnọdụ a abịalarị tupu a mara onye ga-emeri ikpe ndị ahụ.
- source_word: μὲν οὖν
  choice: N’ezie, mgbe ahụ
  rationale: Na-echekwa ma nkwusi okwu ike dị nro ma nkwubi okwu sitere n’ịba mba dị n’amaokwu ndị bu ụzọ.
- source_word: ὅλως
  choice: kpamkpam
  rationale: 'Na-eme ka ntule Pọl sie ike: ịdị adị nke ikpe ndị ahụ n’onwe ya bụ mmeri e meriri ha.'
- source_word: ἥττημα
  choice: mmeri e meriri unu
  rationale: Okwu a na-egosi mfu ma ọ bụ mmeri e meriri mmadụ; nkebiokwu a bụ Igbo doro anya nke na-echekwa ike okwu Pọl.
- source_word: ὑμῖν ἐστιν
  choice: ọ bụrụlarị mmeri e meriri unu
  rationale: Na-egosipụta dative nke ntụaka n’Igbo ekeghị eke, n’etinyeghị echiche ‘ihere’ nke na-adịghị kpọmkwem n’asụsụ Grik.
- source_word: ὅτι
  choice: na
  rationale: Na-ewebata ihe mmeri ahụ e meriri ha bụ, n’enweghị ịkọwa ya karịa ihe odide ahụ kwuru.
- source_word: κρίματα
  choice: ikpe
  rationale: N’ọnọdụ a, ọ na-ezo aka n’esemokwu e bugara n’ụlọikpe; ‘ikpe’ bụ okwu Igbo dị mfe ma kwekọọ n’ọnọdụ ahụ.
- source_word: μεθ’ ἑαυτῶν
  choice: n’etiti onwe unu
  rationale: Na-egosi na esemokwu iwu ahụ dị n’etiti ndị otu ọgbakọ ahụ.
- source_word: διὰ τί οὐχὶ μᾶλλον
  choice: Gịnị mere unu agaghị ... kama?
  rationale: Na-echekwa ajụjụ ịma aka Pọl na echiche nke ịhọrọ nke a karịa nke ọzọ.
- source_word: ἀδικεῖσθε
  choice: ekwe ka e megbuo unu
  rationale: Na-echekwa olu nnara nke ngwaa ahụ ma na-ekwupụta ịta ahụhụ n’aka omume na-ezighị ezi n’Igbo nkịtị.
- source_word: ἀποστερεῖσθε
  choice: ekwe ka a napụ unu ihe unu
  rationale: Na-echekwa ohere nghọta sara mbara nke ịbụ onye a napụrụ ihe, a ghọgburu, ma ọ bụ e merụrụ n’ihe onwunwe, kama imechi ya naanị n’aghụghọ ego.
theological_decisions:
- issue: Ụdị ntule Pọl banyere ndị kwere ekwe ịgba ibe ha akwụkwọ n’ụlọikpe
  choice: A sụgharịrị ἥττημα dị ka ‘mmeri e meriri unu’ iji chekwaa ntule omume siri ike Pọl kwuru.
  alternative: ‘mfu’ ma ọ bụ ‘ọdịda’
  rationale: Amaokwu ahụ na-ekwu na ịdị adị nke ikpe n’etiti ha abụrụlarị mmeri e meriri ọgbakọ ahụ, n’agbanyeghị onye ga-emeri n’ụlọikpe; nsụgharị ahụ etinyeghị ozizi ọzọ na-adịghị n’ihe odide ahụ.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji ‘mmeri e meriri unu’ chekwaa ike ihe atụ ἥττημα, ebe ‘ikpe’ na-arụ ọrụ dịka okwu nkịtị nke ọnọdụ ụlọikpe kọwara. E debere akara nkọwa ụkwụ ozugbo n’akụkụ okwu ha na-akọwa.
