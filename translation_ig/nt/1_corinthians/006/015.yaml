id: 1CO.6.15
reference: 1 Corinthians 6:15
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οὐκ οἴδατε ὅτι τὰ σώματα ὑμῶν μέλη Χριστοῦ ἐστιν; ἄρας οὖν τὰ μέλη τοῦ Χριστοῦ ποιήσω πόρνης μέλη; μὴ γένοιτο.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/015.yaml
  text: Do you not know that your bodies are members of Messiah? Shall I then take the members of Messiah and make them members of a prostitute? May it never be[a][b].
translation:
  language: ig
  text: Unu amaghị na ahụ́ unu bụ akụkụ ahụ́ Kraịst[a]? M̀ ga-ewerezi akụkụ ahụ́ Kraịst mee ha akụkụ ahụ́ nwanyị akwụna? Ya adịla mgbe ọ bụla![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Mezaịa” ma ọ bụ “Onye E Tere Mmanụ.” Okwu Grik Χριστός nwere ike ịrụ ọrụ dịka utu aha a sụgharịrị ma ọ bụ dịka aha e ji amata onye ahụ.
    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ, “Mba, ma ọlị!” Okwu Grik μὴ γένοιτο bụ ụzọ siri ike e si jụ echiche ahụ kpamkpam.
    reason: lexical_alternative
lexical_decisions:
- source_word: σώματα
  choice: ahụ́
  rationale: N'Igbo, “ahụ́” nwere ike ịpụta ahụ mmadụ n'otu ma ọ bụ n'ọtụtụ dabere n'okwu gbara ya gburugburu; “ahụ́ unu” na-egosi ahụ́ nke ndị kwere ekwe n'otu n'otu, ọ bụghị naanị akụkụ anụ ahụ.
- source_word: μέλη
  choice: akụkụ ahụ́
  rationale: Nke a na-echekwa ihe atụ Pọl ji banyere akụkụ dị iche iche nke otu ahụ, ma doo ndị na-agụ Igbo anya karịa iji okwu nwere ike ịpụta naanị ndị otu.
- source_word: Χριστοῦ
  choice: Kraịst
  rationale: “Kraịst” bụ okwu Igbo a maara nke ọma maka Χριστός ma ka na-eburu echiche nke Onye E Tere Mmanụ; ihe odide ahụ na-egosi onye ahụ́ ndị kwere ekwe bụ akụkụ ya.
- source_word: ἄρας
  choice: werezi
  rationale: “Werezi” jikọtara omume nke iwere na οὖν (“ya mere/zi”), ma kwekọọ n'ajụjụ nkwuwa okwu ahụ n'ụzọ eke.
- source_word: ποιήσω
  choice: mee ha
  rationale: “Mee ha” na-egosipụta ime ka akụkụ ahụ́ Kraịst ghọọ akụkụ ahụ́ nwanyị akwụna, ma na-edobe ike na-awụ akpata oyi nke ajụjụ ahụ.
- source_word: πόρνης
  choice: nwanyị akwụna
  rationale: Okwu a kpọmkwem na-ezo aka n'anyịanyị na-ere mmekọahụ; “nwanyị akwụna” bụ okwu Igbo doro anya ma ghara ime ka ọ bụrụ naanị nwanyị rụrụ arụ n'ozuzu.
- source_word: μὴ γένοιτο
  choice: Ya adịla mgbe ọ bụla!
  rationale: Nkebiokwu a na-egosipụta ịjụ echiche ahụ kpamkpam na n'ụzọ siri ike, ma na-echekwa ụdị ọchịchọ dị na okwu Grik ahụ.
- source_word: οὐκ οἴδατε
  choice: Ọ̀ bụ na unu amaghị
  rationale: Nke a bụ ajụjụ nkwuwa okwu Igbo e ji akpọ ndị na-ege ntị ka ha cheta ihe a tụrụ anya na ha maara.
theological_decisions:
- issue: Ịsụgharị Χριστός n'okwu banyere njikọ ahụ́ ndị kwere ekwe na ya
  choice: Kraịst
  alternative: Mezaịa / Onye E Tere Mmanụ
  rationale: “Kraịst” bụ ụdị a nabatara nke ọma n'Igbo ma ọ naghị edozi ma okwu Grik ahụ na-arụ ọrụ dịka aha ma ọ bụ utu aha kpamkpam. Ihe odide ala peeji na-akọwa uru utu aha ahụ.
- issue: Ike nkwugide dị na μὴ γένοιτο
  choice: Ya adịla mgbe ọ bụla!
  alternative: Mba, ma ọlị! / O nweghị ụzọ ọ ga-esi dị!
  rationale: Nhọrọ a abụghị nanị ịsị mba; ọ na-egosipụta ịjụ ihe ahụ n'ụzọ siri ike, n'enweghị itinye nkọwa ozizi ọzọ.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke ugbu a ma dị ùgwù. E ji “akụkụ ahụ́” chekwaa ihe atụ banyere ahụ́ ma mee ka ọ dị mfe nghọta. Akara ụda olu ole na ole dị mkpa ka e tinyere iji belata mgbagwoju anya, n'enweghị ime ka ederede sie ndị nkịtị ike.
