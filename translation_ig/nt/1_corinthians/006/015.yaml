review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the rhetorical questions, the plural embodied referent in σώματα, the body-member metaphor in μέλη, the specific reference to a prostitute (πόρνη), and the emphatic repudiation μὴ γένοιτο. “Kraịst” is an established Standard Igbo form and appropriately retains the title/name-like ambiguity of Χριστός.
  naturalness: “Ọ̀ bụ na unu amaghị” is intelligible but somewhat less direct and idiomatic than the ordinary Igbo rhetorical question “Unu amaghị na ...?” The latter retains the Greek force while reading more naturally in contemporary Standard Igbo. The remaining wording is clear and suitably formal.
  terminology: “Akụkụ ahụ́” consistently preserves Paul’s σώμα/μέλη imagery. “Nwanyị akwụna” is a precise, current equivalent for πόρνη. The proposed revision does not alter the established rendering “Kraịst”; the note appropriately gives title-based alternatives.
  issues:
  - severity: low
    issue: Opening rhetorical question is slightly stilted.
    rationale: “Ọ̀ bụ na unu amaghị na ...?” can sound like a marked ‘Is it that ...?’ construction. “Unu amaghị na ...?” is the more natural Standard Igbo rhetorical form and faithfully renders οὐκ οἴδατε.
