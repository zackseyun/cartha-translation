id: 1CO.6.18
reference: 1 Corinthians 6:18
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: φεύγετε τὴν πορνείαν· πᾶν ἁμάρτημα ὃ ἐὰν ποιήσῃ ἄνθρωπος ἐκτὸς τοῦ σώματός ἐστιν, ὁ δὲ πορνεύων εἰς τὸ ἴδιον σῶμα ἁμαρτάνει.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/018.yaml
  text: Flee sexual immorality. Every sin that a person may commit is outside the body[a], but the one who commits sexual immorality sins against his own body.
translation:
  language: ig
  text: Gbanahụ omume rụrụ arụ nke mmekọahụ. Mmehie ọ bụla mmadụ[a] pụrụ ime dị n’èzí ahụ́, ma onye na-eme omume rụrụ arụ nke mmekọahụ na-emehie megide ahụ́ nke ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Okwu Grik a sụgharịrị “mmadụ” bụ ἄνθρωπος; n'ebe a, ọ na-anọchi anya mmadụ ọ bụla.
    reason: lexical_clarification
lexical_decisions:
- source_word: φεύγετε
  choice: Gbanahụ
  rationale: Ọ bụ iwu e nyere ọtụtụ mmadụ, nke na-akpọ ha ka ha zere ihe ahụ kpamkpam ma nọgide na-agbara ya ọsọ. “Gbanahụ” na-egosi ịdị ngwa na izere ihe ize ndụ.
- source_word: πορνείαν
  choice: omume rụrụ arụ nke mmekọahụ
  rationale: πορνεία na-ezo aka n’omume mmekọahụ dị iche iche na-ezighị ezi, ọ bụghị naanị mmekọahụ tupu alụmdi na nwunye. Nsụgharị a na-edobe obosara okwu Grik ahụ n’Igbo a na-aghọta taa.
- source_word: πᾶν ἁμάρτημα
  choice: Mmehie ọ bụla
  rationale: Nke a na-egosi mmehie n’ozuzu ya ma na-edobe ike nke πᾶν n'ụzọ Igbo si ekwu okwu nke ọma.
- source_word: ὃ ἐὰν ποιήσῃ ἄνθρωπος
  choice: mmadụ pụrụ ime
  rationale: “Mmadụ” bụ okwu Igbo nkịtị na-anọchi anya onye ọ bụla, dịka ἄνθρωπος si arụ ọrụ n'okwu a. “Pụrụ ime” na-egosikwa echiche modal nke ἐὰν ya na subjunctive.
- source_word: ἐκτὸς τοῦ σώματός ἐστιν
  choice: dị n’èzí ahụ́
  rationale: Nsụgharị a na-edobe ihe atụ gbasara ọnọdụ dị na Grik na esemokwu ya na nkebiokwu na-esote, n'ebughị ụzọ kọwaa okwu Pọl pụtara.
- source_word: ὁ δὲ πορνεύων
  choice: ma onye na-eme omume rụrụ arụ nke mmekọahụ
  rationale: “Onye na-eme” na-edobe ike omume na-aga n’ihu nke participle ahụ ma jikọta ya nke ọma na πορνεία dị na mmalite amaokwu ahụ.
- source_word: εἰς τὸ ἴδιον σῶμα ἁμαρτάνει
  choice: na-emehie megide ahụ́ nke ya
  rationale: Ọ bụ ezie na εἰς pụtara “n’ime” n'ụzọ nkịtị, “megide” na-enye echiche idiom ahụ nke ọma n’Igbo. “Nke ya” na-edobe nkwusiri ike nke ἴδιον.
theological_decisions:
- issue: Uru ἄνθρωπος bara n'okwu a na-ekwu n'ozuzu
  choice: mmadụ
  alternative: nwoke
  rationale: N'okwu a, ἄνθρωπος bụ otu onye n'ụdị ụtọasụsụ ma ọ na-anọchi anya mmadụ ọ bụla. “Mmadụ” na-ebute echiche ahụ n'Igbo n'ụzọ ziri ezi, n'etinyeghị nwoke naanị ebe isi okwu ahụ abụghị gbasara okike nwoke.
- issue: Ihe okwu “mmehie ọ bụla ... dị n’èzí ahụ́” pụtara
  choice: Ịsụgharị nkebiokwu ahụ ozugbo ma hapụ esemokwu nkọwa ya ka ọ dị
  alternative: Ịkọwa ya dị ka okwu ndị Kọrịnt kwuru ma ọ bụ itinye nkọwa ga-eme ka ọ daba n’ozizi ụfọdụ
  rationale: Grik na-enye okwu ahụ ozugbo, ma ihe ọ pụtara bụ okwu a na-arụrịta ụka. Nsụgharị ahụ ekwesịghị ikpebi n'ime ederede ma ọ bụ okwu ndị Kọrịnt, ma ọ bụ mee ka esemokwu ahụ laa n'iyi.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. A họọrọ “omume rụrụ arụ nke mmekọahụ” iji gosi obosara πορνεία, ebe a hapụrụ okwu siri ike banyere mmehie ịdị “n’èzí ahụ́” n'ụdị ya na-enweghị ịgbakwunye nkọwa otu ụka.
