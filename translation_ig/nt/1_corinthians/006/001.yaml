review_pass:
  verdict: revise
  source_fidelity: The draft preserves the rhetorical question, the singular representative subject, the legal dispute, and the contrast between ἀδίκων and ἁγίων. However, “ịga” (“go”) adds an action not expressed by κρίνεσθαι, and “ọ bụghịkwa n’ihu” is less clear as the intended contrast in this legal construction.
  naturalness: The register is generally standard and appropriate. Recasting the infinitival phrase as “ka e kpee ya ikpe” is more direct Igbo, and “kama n’ihu” makes the contrast natural and unambiguous.
  terminology: “Ndị na-adịghị ezi omume” and “ndị nsọ” suitably retain the morally/theologically marked Greek terms without interpretively substituting “unbelievers” and “believers.” The first footnote should not offer “ndị na-ekpe ikpe na-ezighị ezi,” since the Greek identifies the people, not specifically their judging conduct.
  issues:
  - severity: medium
    issue: The wording “ịga ka e kpee ya ikpe” adds “go.”
    rationale: κρίνεσθαι is a passive infinitive, “to be judged / to have a case decided,” and does not itself state going somewhere. Removing “ịga” better preserves the source while remaining idiomatic.
  - severity: medium
    issue: “ọ bụghịkwa n’ihu ndị nsọ” does not express the contrast as clearly as the Greek’s rhetorical “and not before the saints.”
    rationale: Using “kama n’ihu ndị nsọ” naturally conveys the opposed venue in Igbo without changing the rhetorical force.
  - severity: low
    issue: Footnote a includes an overly specific interpretive alternative.
    rationale: “Ndị na-ekpe ikpe na-ezighị ezi” shifts from “unrighteous/unjust people” to “judges who judge unjustly.” A lexical note should retain the source’s broader designation.
  revised_text: Ọ̀ dị onye ọ bụla n’ime unu nke, mgbe o nwere okwu megide onye ọzọ, na-anwa anwa ka e kpee ya ikpe n’ihu ndị na-adịghị ezi omume[a], kama n’ihu ndị nsọ[b]?
