revisions:
- from: Ọ̀ dị onye ọ bụla n’ime unu na-anwa anwa, mgbe o nwere okwu megide onye ọzọ, ịga ka e kpee ya ikpe n’ihu ndị na-adịghị ezi omume[a], ọ bụghịkwa n’ihu ndị nsọ[b]?
  to: Ọ̀ dị onye ọ bụla n’ime unu nke, mgbe o nwere okwu megide onye ọzọ, na-anwa anwa ka e kpee ya ikpe n’ihu ndị na-adịghị ezi omume[a], kama n’ihu ndị nsọ[b]?
  rationale: The revision removes the added motion verb, keeps the passive legal sense of κρίνεσθαι, and makes the contrast with the saints idiomatic and explicit in Standard Igbo. It retains the source terms’ evaluative force and corrects the lexical footnote so that it does not over-specify the referent.
