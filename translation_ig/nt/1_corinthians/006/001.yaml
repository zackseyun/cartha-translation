source:
  edition: SBLGNT
  text: Τολμᾷ τις ὑμῶν πρᾶγμα ἔχων πρὸς τὸν ἕτερον κρίνεσθαι ἐπὶ τῶν ἀδίκων, καὶ οὐχὶ ἐπὶ τῶν ἁγίων;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/001.yaml
  text: Does any one of you dare[a], when he has a case against another[b], to be judged before the unrighteous and not before the saints?
translation:
  language: ig
  text: Ọ̀ dị onye ọ bụla n’ime unu nke, mgbe o nwere okwu megide onye ọzọ, na-anwa anwa ka e kpee ya ikpe n’ihu ndị na-adịghị ezi omume[a], kama n’ihu ndị nsọ[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “ndị na-ezighị ezi” ma ọ bụ “ndị ajọ omume.” Ụfọdụ nsụgharị na-akọwa ya dị ka “ndị na-ekweghị ekwe,” ma okwu Grik ahụ pụtara “ndị na-adịghị ezi omume.”
    reason: lexical_alternative
  - marker: b
    text: “Ndị nsọ” n’ebe a bụ ndị Chineke doro nsọ, ya bụ, ndị kwere ekwe.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τολμᾷ
  choice: na-anwa anwa
  rationale: Na-egosipụta ajụjụ Pọl ji ata ha ụta na obi ike gabigara ókè nke ngwaa τολμάω na-egosi n’ebe a.
- source_word: τις ὑμῶν
  choice: onye ọ bụla n’ime unu
  rationale: Na-echekwa onye otu a na-akọwaghị kpọmkwem, tinyere okwu Pọl gwara ndị Kọrịnt ozugbo.
- source_word: πρᾶγμα ἔχων
  choice: mgbe o nwere okwu
  rationale: “Okwu” bụ ụzọ Igbo dị mfe ma sara mbara isi kwuo okwu esemokwu a ga-ekpe, n’ebughị ụzọ kọwaa ya kpọmkwem dị ka ikpe ụlọikpe.
- source_word: πρὸς τὸν ἕτερον
  choice: megide onye ọzọ
  rationale: Na-egosipụta mmekọrịta nke ndị na-emegiderịta onwe ha n’okwu ikpe ahụ.
- source_word: κρίνεσθαι
  choice: ịga ka e kpee ya ikpe
  rationale: Na-echekwa nghọta pasivụ nke κρίνεσθαι ma na-ekwu ya n’Igbo eke n’ọnọdụ ikpe.
- source_word: ἐπὶ τῶν ἀδίκων
  choice: n’ihu ndị na-adịghị ezi omume
  rationale: Na-echekwa nkọwa omume na nkà mmụta okpukpe nke ἀδίκων, kama iji okwu nkọwa “ndị na-ekweghị ekwe” dochie ya.
- source_word: καὶ οὐχὶ
  choice: ọ bụghịkwa
  rationale: Na-egosipụta ntụnyere megidere ibe ya n’ajụjụ ahụ n’enweghị itinye nkwusi ike ọzọ.
- source_word: ἐπὶ τῶν ἁγίων
  choice: n’ihu ndị nsọ
  rationale: “Ndị nsọ” bụ okwu Pọl ji akpọ ndị Chineke doro nsọ; ọ na-echekwa njikọ okwu a na ojiji ya n’ebe ndị ọzọ.
theological_decisions:
- issue: Otu e si tụnyere ἀδίκων na ἁγίων
  choice: ndị na-adịghị ezi omume ... ndị nsọ
  alternative: ndị na-ekpe ikpe na-ezighị ezi ... ndị kwere ekwe
  rationale: Asụsụ Grik ji okwu nwere ibu omume na nkà mmụta okpukpe tụnyere ibe ha. Nsụgharị a anaghị edozi mgbagwoju ahụ site n’ịgbanwe ha ozugbo ka ha bụrụ “ndị na-ekweghị ekwe” na “ndị kwere ekwe.”
- issue: Nwoke otu onye nke ἔχων na-anọchi anya mmadụ ọ bụla
  choice: mgbe o nwere okwu
  alternative: mgbe ha nwere okwu
  rationale: “Onye ọ bụla ... o” na-echekwa otu onye nke asụsụ Grik ma na-arụkwa ọrụ n’Igbo dị ka onye nnọchianya nke onye ọ bụla.
translation_notes:
  register: E ji asụsụ Igbo ọkọlọtọ, nke dị ugbu a ma dị ùgwù mee ihe. Ahịrịokwu ahụ na-echekwa ụdị ajụjụ Pọl ji baara ndị na-agụ ya mba, ma na-eji “ịga ka e kpee ya ikpe n’ihu” mee ka ọnọdụ ikpe ahụ doo onye Igbo anya.
