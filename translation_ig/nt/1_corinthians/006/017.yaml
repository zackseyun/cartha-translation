  text: But the one who joins himself to the Lord is one spirit with him[a][b][c].
translation:
  language: ig
  text: Ma onye na-ejikọta onwe ya na Onyenwe anyị bụ otu mmụọ na ya[a][b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “onye ejikọrọ na Onyenwe anyị.” Ngwaa Grik ahụ nwere ike ịpụta ma “onye na-ejikọta onwe ya na” ma ọ bụ “onye ejikọrọ na.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ naanị, “bụ otu mmụọ.” Okwu “na ya” adịghị kpọmkwem n'asụsụ Grik, ma e tinyere ya iji mee ka ihe a na-ekwu doo anya.
    reason: lexical_alternative
  - marker: c
    text: Ụfọdụ nwere ike ịghọta “mmụọ” ebe a dị ka “Mmụọ”; ma o yikarịrị ka nkebiokwu ahụ pụtara na onye kwere ekwe na Onyenwe anyị jikọrọ ọnụ n'otu mmụọ.
    reason: alternative_reading
lexical_decisions:
- source_word: κολλώμενος (κολλάομαι)
  choice: na-ejikọta onwe ya na
  rationale: Okwu a na-egosi ịrapara ma ọ bụ ijikọ onwe onye na onye ọzọ n'ụzọ chiri anya. N'ebe a, ọ na-echekwa ntụnyere dị n'etiti njikọ anụ ahụ e kwuru banyere ya n'amaokwu 16 na njikọ onye kwere ekwe na Onyenwe anyị.
- source_word: κυρίῳ (κύριος)
  choice: Onyenwe anyị
  rationale: N'okwu Pọl ebe a, ọ na-ezo aka na Jizọs onye bilitere n'ọnwụ ma na-eburu ibu echiche karịrị naanị onyeisi ma ọ bụ nna ukwu.
- source_word: ἓν
  choice: otu
  rationale: Ọ na-egosi ịdị n'otu, ọ bụghị naanị inwe otu echiche ma ọ bụ otu ebumnuche.
- source_word: πνεῦμα
  choice: mmụọ
  rationale: E ji mkpụrụedemede nta dee ya n'echiche na nkebiokwu a na-akọwa njikọ ime mmụọ nke onye kwere ekwe na Onyenwe anyị, ọ bụghị na ha ghọrọ otu onye ahụ ma ọ bụ na onye kwere ekwe bụ Mmụọ Nsọ.
- source_word: ὁ δὲ ... ἐστιν
  choice: Ma onye ... bụ
  rationale: Nke a bụ ụzọ Igbo dị mfe ma bụrụkwa nke mmadụ niile nwere ike ịghọta maka article na participle ndị Grik ji mee aha, bụ́ 'onye na-eme ihe ahụ.'
theological_decisions:
- issue: Ụdị ịdị n'otu e gosiri n'okwu ‘otu mmụọ’
  choice: Okwu ahụ na-egosi ezi njikọ ime mmụọ dị n'etiti onye kwere ekwe na Onyenwe anyị, ma ọ naghị eme ka ha bụrụ otu onye ahụ.
  alternative: Ịghọta ya dị ka ngwakọta zuru oke nke mmadụ na Onyenwe anyị, ma ọ bụ naanị dịka inwe otu echiche na otu ebumnuche.
  rationale: Amaokwu gbara ya gburugburu na-atụnyere njikọ anụ ahụ na nwanyị akwụna na njikọ ime mmụọ na Onyenwe anyị. Ya mere, nsụgharị ahụ kwesịrị igosi ịdị ike nke njikọ a n'emebighị ọdịiche dị n'etiti ha.
- issue: Ịtinye ‘na ya’
  choice: E tinyere ‘na ya’ iji mee ka mmekọrịta ahụ doo anya n'Igbo.
  alternative: Ịsụgharị naanị ‘bụ otu mmụọ.’
  rationale: N'asụsụ Grik, onye nke ọzọ e ji atụnyere nwere ike ịdị n'ime nghọta okwu ahụ; ma ‘na ya’ na-eme ka o doo anya na ịdị n'otu ahụ bụ nke onye kwere ekwe na Onyenwe anyị.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. ‘Na-ejikọta onwe ya na’ na-echekwa ma omume onye ahụ ma ịdị omimi nke njikọ ahụ; ‘otu mmụọ na ya’ na-eme ka mmekọrịta ahụ doo anya n'ụzọ nkịtị n'Igbo.
