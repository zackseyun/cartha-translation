revisions:
- from: Ma unu onwe unu na-eme ihe ọjọọ, na-aghọgbukwa mmadụ ihe ruuru ya—ọ bụkwa ụmụnna unu[a] ka unu na-eme ya.
  to: Ma unu onwe unu na-eme mmadụ ihe na-ezighị ezi, na-anapụkwa ya ihe ruuru ya—ọ bụkwa ụmụnna unu[a] ka unu na-emeso otu a.
  rationale: 'The revision preserves the Greek word order’s rhetorical force: the Corinthians themselves wrong and deprive others, and the final clause heightens the offense by naming those others as their fellow believers. It uses idiomatic Standard Igbo while avoiding an unnecessary claim that the deprivation must be accomplished by deception.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T18:11:23Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the strong contrast (ἀλλά), the emphatic pronoun (ὑμεῖς), the two wrongful actions, and the climactic identification of those wronged as fellow believers. However, “na-eme ihe ọjọọ” is less clearly interpersonal than ἀδικεῖτε in this context, and the final “ka unu na-eme ya” has an unclear antecedent. A small revision makes the wronging explicitly directed toward people and retains the rhetorical climax naturally.
  naturalness: “Na-aghọgbu mmadụ ihe ruuru ya” is understandable, but “na-anapụ ... ihe ruuru ...” is more idiomatic and directly expresses depriving someone of what is due. “Ka unu na-emeso otu a” naturally refers back to both actions and avoids the vague pronoun “ya.”
  terminology: “Ụmụnna unu” appropriately preserves the family/community term ἀδελφούς. The note should not state that Greek simply “means male siblings,” since the term’s contextual reference here can encompass fellow believers generally; it should describe the literal masculine form while noting its broader contextual use.
  issues:
  - severity: medium
    issue: The object of ἀδικεῖτε is not explicit enough, and the final pronoun is ambiguous.
    rationale: In this legal and ethical context, ἀδικεῖτε means wronging people, not merely doing wrong in the abstract. “Ọ bụkwa ụmụnna unu ka unu na-eme ya” leaves “ya” without a precise natural antecedent in Igbo.
  - severity: low
    issue: The footnote’s wording about the Greek term is overly narrow.
    rationale: Although ἀδελφούς is grammatically masculine plural, its Pauline ecclesial reference can be broader. The note should preserve that distinction without equating its meaning in context simply with biological male siblings.
  revised_text: Ma unu onwe unu na-eme mmadụ ihe na-ezighị ezi, na-anapụkwa ya ihe ruuru ya—ọ bụkwa ụmụnna unu[a] ka unu na-emeso otu a.
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “ụmụnna unu, ya bụ, ndị ikom na ndị inyom.” N’asụsụ Grik, okwu ahụ bụ ụdị ọtụtụ nke nwoke, “ụmụnna nwoke,” ma n’ọnọdụ a ọ pụrụ izo aka n’ebe ndị kwere ekwe ibe ha niile nọ.
    reason: lexical_alternative
  revision_rationale: 'The revision preserves the Greek word order’s rhetorical force: the Corinthians themselves wrong and deprive others, and the final clause heightens the offense by naming those others as their fellow believers. It uses idiomatic Standard Igbo while avoiding an unnecessary claim that the deprivation must be accomplished by deception.'
