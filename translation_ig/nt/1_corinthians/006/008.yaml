  yaml_path: translation/nt/1_corinthians/006/008.yaml
  text: But you yourselves do wrong and defraud—and this to your brothers[a].
translation:
  language: ig
  text: Ma unu onwe unu na-eme mmadụ ihe na-ezighị ezi, na-anapụkwa ya ihe ruuru ya—ọ bụkwa ụmụnna unu[a] ka unu na-emeso otu a.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ụmụnna unu, ya bụ, ndị ikom na ndị inyom.” N’asụsụ Grik, okwu ahụ bụ ụdị ọtụtụ nke nwoke, “ụmụnna nwoke,” ma n’ọnọdụ a ọ pụrụ izo aka n’ebe ndị kwere ekwe ibe ha niile nọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Ma
  rationale: Ọ na-egosi nnukwu ọdịiche n’etiti omume a na ihe e kwuru n’amaokwu bu ụzọ; “Ma” bụ okwu Igbo doro anya ma kwekọọ n’ebe a.
- source_word: ὑμεῖς
  choice: unu onwe unu
  rationale: Nnochiaha ahụ pụtara ìhè na Grik, nke na-enye ya ike pụrụ iche; “unu onwe unu” na-edobe nkwusi ike Pọl tinyere n’omume ndị Kọrịnt.
- source_word: ἀδικεῖτε
  choice: na-eme ihe ọjọọ
  rationale: Ngwaa ahụ pụtara ime mmadụ ihe na-ezighị ezi ma ọ bụ imegide ikpe ziri ezi. Nsụgharị a bụ nke nkịtị, sara mbara, ma na-edobe ịdị arọ nke omume ahụ.
- source_word: ἀποστερεῖτε
  choice: na-aghọgbukwa mmadụ ihe ruuru ya
  rationale: Ọ na-egosi ịnapụ mmadụ ihe kwesịrị iru ya site n’aghụghọ. Okwu ndị a na-egosipụta ma aghụghọ ma mfu ahụ nke ọma n’Igbo, karịsịa n’ọnọdụ esemokwu gbasara ikpe na akụnụba.
- source_word: καὶ τοῦτο
  choice: —ọ bụkwa ... ka unu na-eme ya
  rationale: 'Usoro a na-eme ka njọ nke omume ahụ pụta ìhè: ọ bụghị naanị na ha na-eme ya, kama ọ bụ ụmụnna ha ka ha na-eme ya. Akara ogologo na usoro nkwusi ike Igbo na-edobe mmetụta okwu Grik ahụ.'
- source_word: ἀδελφούς
  choice: ụmụnna unu
  rationale: “Ụmụnna” bụ okwu Igbo sitere n’echiche nwanne, ma n’ọnọdụ ọgbakọ ndị kwere ekwe ọ pụrụ ịgụnye ndị nwoke na ndị nwanyị. “Unu” na-eme ka mmekọrịta ha pụta ìhè n’asụsụ Igbo dị mfe.
theological_decisions:
- issue: Ma ἀδελφούς ọ na-ezo naanị aka n’ụmụ nwoke ka ọ bụ n’ebe ndị kwere ekwe niile nọ
  choice: ụmụnna unu
  alternative: ụmụnna unu ndị nwoke; ndị kwere ekwe ibe unu
  rationale: Ụdị okwu Grik bụ ọtụtụ nke nwoke, ma n’akwụkwọ Pọl ọ na-ejikarị ya akpọ ndị otu ọgbakọ n’ozuzu ha. “Ụmụnna” na-edobe ihe atụ ezinụlọ ahụ ma nwee ike ịgụnye ndị nwoke na ndị nwanyị; ihe odide ala peeji na-eme ka nke a doo anya n’enweghị idozi obosara ntụaka ahụ n’ime isiokwu.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. Usoro “unu onwe unu” na-edobe nkwusi ike nke Grik; “na-aghọgbu mmadụ ihe ruuru ya” na-akọwa ịnapụ mmadụ ihe kwesịrị iru ya n’enweghị iji okwu siri ike karịa isi mmalite.
