  text: This greeting is in my own hand—Paul.
translation:
  language: ig
  text: Ọ bụ mụ onwe m, Pọl, ji aka m dee ekele a.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὁ ἀσπασμός
  choice: ekele a
  rationale: “Ekele” bụ okwu Igbo doro anya maka ozi ekele; “a” na-egosipụta isiokwu ahụ nke dị n'okwu Grik.
- source_word: τῇ ἐμῇ χειρί
  choice: ji aka m dee
  rationale: 'N''ụzọ nkịtị, ọ bụ “site n''aka nke m.” Ịtinye “dee” na-eme ka ihe Pọl pụtara doo anya n''Igbo: ọ bụ ya ji aka ya dee ekele ahụ.'
- source_word: Παύλου
  choice: mụ onwe m, Pọl
  rationale: Genitive a na-akọwa onye aka ahụ bụ nke ya. Usoro Igbo a na-egosipụta nkwusi ike dị na ἐμῇ ma na-edebe aha Pọl.
