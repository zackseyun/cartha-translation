translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị mfe ma dị ùgwù. A haziri ahịrịokwu ahụ n'ụdị Igbo sitere n'okike, ebe e debere nkwusi ike na Pọl ji aka ya dee ekele ahụ.
