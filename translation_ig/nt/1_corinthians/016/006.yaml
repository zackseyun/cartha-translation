    reason: lexical_alternative
  revision_rationale: The revision removes the unwarranted “short time” limitation, renders πρός + accusative consistently as “n’ebe unu,” and replaces the ability nuance in “m nwere ike ịga” with an indefinite future destination. The purpose and the broad travel-context sense of προπέμπω are retained.
