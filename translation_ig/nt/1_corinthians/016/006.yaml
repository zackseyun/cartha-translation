  text: πρὸς ὑμᾶς δὲ τυχὸν ⸀παραμενῶ ἢ ⸀καὶ παραχειμάσω, ἵνα ὑμεῖς με προπέμψητε οὗ ἐὰν πορεύωμαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/006.yaml
  text: and perhaps I will stay with you[a], or even spend the winter, so that you may send me on my way wherever I may go.
translation:
  language: ig
  text: Ma eleghị anya, m ga-anọ n’ebe unu, ma ọ bụ ọbụ nọrọ n’ebe unu n’oge oyi, ka unu wee ziga m n’ụzọ[a] n’ebe ọ bụla m ga-aga.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “nyere m aka n’ime njem m.” Ngwaa Grik a nwekwara ike ịgụnye iso onye njem mgbe ọ na-apụ ma ọ bụ inye ya enyemaka maka njem ahụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸς ὑμᾶς
  choice: n’ebe unu / nọnyeere unu
  rationale: N’ihi na okwu a so ngwaa nke ịnọ, ọ na-egosi ịnọ n’etiti ha ma ọ bụ n’ebe ha nọ; Igbo kwesịrị ekwesị ji “nọnyeere unu” ma ọ bụ “n’ebe unu” kwuo ya.
- source_word: δὲ
  choice: Ma
  rationale: Ọ bụ njikọ dị nro n’usoro atụmatụ njem Pọl. “Ma” na-ejikọta echiche a na nke bu ya ụzọ n’enweghị ime ka esemokwu sie ike.
- source_word: τυχὸν
  choice: eleghị anya
  rationale: Ọ na-egosi na ihe ahụ nwere ike ime ma o doghị anya; “eleghị anya” bụ okwu Igbo nkịtị ma doo anya.
- source_word: παραμενῶ
  choice: m ga-anọnyere unu nwa oge
  rationale: Ngwaa ahụ pụtara ịnọgide ma ọ bụ ịnọkwu. “Nwa oge” na-eme ka echiche nke ịnọkwu pụta n’Igbo n’enweghị ịkọ ogologo oge a na-ekwughị kpọmkwem.
- source_word: ἢ καὶ
  choice: ma ọ bụdị
  rationale: “Ọ bụdị” na-egosi na nhọrọ nke abụọ karịrị nanị ịnọ nwa oge.
- source_word: παραχειμάσω
  choice: nọrọ n’ebe unu n’oge oyi
  rationale: Ngwaa Grik ahụ pụtara ịnọ n’otu ebe ruo oge oyi ma ọ bụ n’oge oyi. Nsụgharị a bụ nke eke ma dokwaa oge ahụ kpọmkwem.
- source_word: ἵνα
  choice: ka ... wee
  rationale: Usoro Igbo “ka ... wee” na-egosipụta ebumnuche nke okwu Grik ahụ n’ụzọ doro anya.
- source_word: προπέμψητε
  choice: zipụ m n’ụzọ m
  rationale: N’ọnọdụ njem, ngwaa ahụ nwere ike ịpụta ịhụ onye njem ụzọ, iso ya ntakịrị, ma ọ bụ nyere ya ihe ọ chọrọ. Isi ederede na-edobe okwu sara mbara, ebe nkọwa ala na-akọwa obosara ya.
- source_word: οὗ ἐὰν πορεύωμαι
  choice: gaa ebe ọ bụla m nwere ike ịga
  rationale: Nke a na-edobe ma ebe a na-amaghị ama ma ọnọdụ nke atụmatụ Pọl nke na-erubeghị mkpebi ikpeazụ.
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. E debere ejighị n’aka dị n’atụmatụ njem Pọl, ghara ime ka ebe ọ ga-aga bụrụ ihe o kpebiela.
