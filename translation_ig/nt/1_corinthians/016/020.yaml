  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀσπάζονται ὑμᾶς οἱ ἀδελφοὶ πάντες. ἀσπάσασθε ἀλλήλους ἐν φιλήματι ἁγίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/020.yaml
  text: All the brothers greet you[b][a]. Greet one another with a holy kiss.
translation:
  language: ig
  text: Ụmụnna niile na-ekele unu.[a] Jirinụ nsusu ọnụ dị nsọ kelee ibe unu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Ụmụnna nwoke na ụmụnna nwanyị niile na-ekele unu,” n’ihi na “ụmụnna” nwere ike ịpụta ndị kwere ekwe niile dịka otu ìgwè.
    reason: lexical_alternative
  - marker: b
    text: “Nsusu ọnụ dị nsọ” bụ otu ụzọ ndị kwere ekwe si ekele ibe ha n’oge ahụ; ọ na-egosi ịdị nsọ na mmekọrịta ha nwere n’etiti onwe ha.
    reason: cultural_note
lexical_decisions:
- source_word: ἀσπάζονται
  choice: na-ekele
  rationale: N’akwụkwọ ozi, ngwaa a pụtara iziga ma ọ bụ ikwu ekele. “Na-ekele” bụ okwu Igbo doro anya ma kwekọọkwa na iwu dị n’ahịrịokwu nke abụọ.
- source_word: οἱ ἀδελφοὶ πάντες
  choice: Ụmụnna niile
  rationale: “Ụmụnna” na-edobe ihe oyiyi nke mmekọrịta ezinụlọ dị na ἀδελφοί, ma n’Igbo ọ pụkwara ịrụ ọrụ dị ka aha mkpokọta maka ndị otu okwukwe. Ihe nwere ike ịgụnye nwoke na nwanyị ka akọwara n’ala ala peeji.
- source_word: ἀσπάσασθε
  choice: keleenụ
  rationale: Ọ bụ iwu a gwara ọtụtụ mmadụ. “Keleenụ” na-enye iwu ahụ n’ụzọ eke ma na-edobe otu mgbọrọgwụ okwu e ji sụgharịa ἀσπάζονται.
- source_word: ἀλλήλους
  choice: ibe unu
  rationale: Nke a bụ ụzọ Igbo si ekwu mmekọrịta nke onye ọ bụla na ibe ya n’ụzọ doro anya ma bụrụkwa nke eke.
- source_word: ἐν φιλήματι ἁγίῳ
  choice: jirinụ nsusu ọnụ dị nsọ
  rationale: “Jirinụ” na-egosi ụzọ e si ekele, “nsusu ọnụ” na-edobe omume ahụ n’onwe ya, “dị nsọ” na-edobekwa àgwà ἁγίῳ n’enweghị ịkọwa ya karịa ihe Grik kwuru.
theological_decisions:
- issue: Ihe ἀδελφοί pụtara mgbe a na-agwa ọgbakọ
  choice: Ụmụnna
  alternative: Ụmụnna nwoke na ụmụnna nwanyị; ndị kwere ekwe niile
  rationale: A hapụrụ okwu mmekọrịta ezinụlọ nke Grik n’ahịrịokwu bụ isi. Ebe ọ bụ na ἀδελφοί nwere ike ịbụ aha mkpokọta maka ndị kwere ekwe, ma nwoke ma nwanyị, e debere nghọta ahụ n’ala ala peeji kama ịgbasa okwu ahụ n’ahịrịokwu bụ isi.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Nhazi “Jirinụ … kelee ibe unu” bụ nke eke n’Igbo ma na-egosi na nsusu ọnụ ahụ bụ ụzọ e si ekele. E tinyere akara ala ala peeji [a] n’akụkụ “Ụmụnna” na [b] n’akụkụ “nsusu ọnụ dị nsọ,” ebe nkọwa nke ọ bụla metụtara kpọmkwem.
