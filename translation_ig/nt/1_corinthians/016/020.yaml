  source_fidelity: “Ụmụnna niile na-ekele unu” faithfully renders ἀσπάζονται ὑμᾶς οἱ ἀδελφοὶ πάντες, retaining both the greeting formula and the collective familial term. “Jirinụ nsusu ọnụ dị nsọ kelee ibe unu” accurately represents the reciprocal imperative ἀσπάσασθε ἀλλήλους and the means/manner phrase ἐν φιλήματι ἁγίῳ. No disputed-source ambiguity has been unnecessarily resolved.
