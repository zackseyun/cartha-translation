  text: Ἐὰν δὲ ἔλθῃ Τιμόθεος, βλέπετε ἵνα ἀφόβως γένηται πρὸς ὑμᾶς, τὸ γὰρ ἔργον κυρίου ἐργάζεται ὡς ⸀κἀγώ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/010.yaml
  text: If Timothy comes[a], see that he may be with you without fear, for he is doing the Lord’s work[b], as I also am.
translation:
  language: ig
  text: Ọ bụrụ na Timoti abịa, hụnụ na ka ọ nọrọnyere unu n’atụghị egwu[a], n’ihi na ọ na-arụ ọrụ Onyenwe anyị[b], dịka mụ kwa na-arụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “hụnụ na ka ọ nọ n’etiti unu n’atụghị egwu.” Okwu Grik ahụ nwere ike imesi ọnụnọ Timoti n’etiti ha ike.
    reason: lexical_alternative
  - marker: b
    text: N’ụzọ nkịtị, “n’ihi na ọ na-arụ ọrụ nke Onyenwe anyị, dịka mụ kwa na-arụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐὰν δὲ ἔλθῃ Τιμόθεος
  choice: Ọ bụrụ na Timoti abịa
  rationale: Nke a na-egosipụta ọnọdụ nwere ike ime n’ọdịnihu. A hapụrụ δέ ka mgbanwe okwu dị nro nke usoro Igbo na-egosipụta n’enweghị njikọ ọzọ.
- source_word: βλέπετε
  choice: hụnụ na
  rationale: Ụdị iwu a na-akpọ ndị niile a na-agwa ka ha gbaa mbọ hụ na ihe na-esochi ya mere; “hụnụ na” bụ okwu Igbo dị mfe ma sie ike.
- source_word: ἵνα ἀφόβως γένηται πρὸς ὑμᾶς
  choice: na ọ ga-anọnyere unu n’atụghị egwu
  rationale: “Ga-anọnyere unu” na-egosipụta ọnụnọ Timoti n’etiti ha, ebe “n’atụghị egwu” na-edobe kpọmkwem echiche ἀφόβως n’enweghị ịkọwa ihe kpatara egwu ahụ.
- source_word: τὸ γὰρ ἔργον κυρίου ἐργάζεται
  choice: n’ihi na ọ na-arụ ọrụ Onyenwe anyị
  rationale: “Ọ na-arụ” na-egosipụta ọrụ na-aga n’ihu; “ọrụ Onyenwe anyị” na-edobe njikọ genitive ahụ n’ụzọ Igbo sitere n’okike.
- source_word: ὡς κἀγώ
  choice: dịka mụ onwe m na-arụkwa
  rationale: κἀγώ pụtara “mụ onwe m kwa.” Ikwughachi “na-arụ” na Igbo na-eme ka ntụnyere ahụ doo anya ma ghara ịgbanwe ihe ọ pụtara.
theological_decisions:
- issue: Onye κυρίου (“Onyenwe anyị”) na-ezo aka na ya
  choice: E debere ya dịka “Onyenwe anyị” n’enweghị ịkpọ Jizọs aha n’amaokwu ahụ.
  alternative: Ịsụgharị ya dịka “Onyenwe anyị Jizọs.”
  rationale: N’akwụkwọ Pọl, o yikarịrị ka ọ na-ezo aka na Jizọs, ma ihe odide Grik kwuru naanị κυρίου. Nsụgharị ahụ na-edobe obosara okwu ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Ụdị ọtụtụ mmadụ “hụnụ” dabara adreesị πρὸς ὑμᾶς; “Onyenwe anyị” bụ okwu Baịbụl a na-aghọta nke ọma maka κύριος.
