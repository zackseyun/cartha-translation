id: 1CO.16.1
reference: 1 Corinthians 16:1
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Περὶ δὲ τῆς λογείας τῆς εἰς τοὺς ἁγίους, ὥσπερ διέταξα ταῖς ἐκκλησίαις τῆς Γαλατίας, οὕτως καὶ ὑμεῖς ποιήσατε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/001.yaml
  text: Concerning the collection for the saints[a], as I directed the churches of Galatia, so you also are to do.
translation:
  language: ig
  text: Banyere nchịkọta ego maka ndị nsọ[a], dị ka m nyere ọgbakọ ndị dị na Galetia ntụziaka, unu meekwa otu ahụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “maka ndị nke Chineke.”
    reason: Ọ bụ ụzọ ọzọ e si akọwa τοὺς ἁγίους n’Igbo ka o doo anya na ọ na-ezo aka n’ebe a n’ebe ndị kwere ekwe nọ.
lexical_decisions:
- source_word: Περὶ δὲ
  choice: Banyere
  rationale: Ọ na-ewebata isiokwu ọhụrụ n’akwụkwọ ozi. “Banyere” bụ ụzọ Igbo dị mfe ma kwekọọ n’ebe a; njikọ δὲ adịghị mkpa ka a sụgharịa ya iche n’ụzọ ga-etinye echiche oge na-adịghị na okwu Grik.
- source_word: λογείας
  choice: nchịkọta ego
  rationale: Okwu a na-ekwu maka ego a na-achịkọta. Ịkpọ ego aha na-eme ka ihe ọ pụtara doo anya n’Igbo n’enweghị ime ya kpọmkwem àjà ofufe.
- source_word: τῆς εἰς τοὺς ἁγίους
  choice: maka ndị nsọ
  rationale: Nkebiokwu a na-egosi ndị a ga-enyere ego ahụ. “Ndị nsọ” na-echekwa okwu Pọl ji akpọ ndị kwere ekwe na echiche nke ndị e doro nsọ nye Chineke.
- source_word: διέταξα
  choice: m nyere … ntụziaka
  rationale: Nke a na-egosi na Pọl nyere iwu ma ọ bụ ntụziaka nwere ikike, ma ọ naghị ada ka okwu ike gabigara ókè n’Igbo.
- source_word: ἐκκλησίαις
  choice: ọgbakọ
  rationale: N’ebe a ọ na-ezo aka n’ọgbakọ ndị Kraịst, ọ bụghị ụlọ a na-anọ efe ofufe.
- source_word: Γαλατίας
  choice: Galetia
  rationale: Nke a bụ nsụgharị aha mpaghara Galatia n’ụdị dabara n’usoro mkpọpụta na odide Igbo.
- source_word: οὕτως καὶ ὑμεῖς ποιήσατε
  choice: unu onwe unu meekwa otu ahụ
  rationale: Ọ na-echekwa ntụnyere ahụ na ike nke iwu a, ma na-ada ka Igbo e ji eme ihe ugbu a.
theological_decisions:
- issue: Otú e si asụgharị ἅγιοι n’okwu gbasara enyemaka ego
  choice: ndị nsọ
  alternative: ndị nke Chineke
  rationale: “Ndị nsọ” na-echekwa okwu Pọl na-ejikarị akọwa ndị kwere ekwe ma na-ejikọ ya na isiokwu ido nsọ. Ihe e dere n’ala ala peeji na-enye nsụgharị na-akọwa ihe okwu ahụ pụtara n’enweghị ịtụnye echiche na ọ bụ naanị ndị e mechara kwupụta dịka ndị nsọ.
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E ji “ọgbakọ” zere mgbagwoju anya nke “ụka” nwere ike ịpụta ụlọ ma ọ bụ nzukọ; e jikwa “nchịkọta ego” mee ka ụdị nchịkọta ahụ doo anya.
