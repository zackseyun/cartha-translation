- from: Banyere nchịkọta ego maka ndị nsọ[a], dị ka m nyere ọgbakọ ndị dị na Galetia ntụziaka, unu onwe unu meekwa otu ahụ.
  to: Banyere nchịkọta ego maka ndị nsọ[a], dị ka m nyere ọgbakọ ndị dị na Galetia ntụziaka, unu meekwa otu ahụ.
  rationale: A naanị mgbanwe a chọrọ bụ iwepu “onwe unu,” nke na-agbakwunye nkwusi ike na-adịghị n’okwu Grik. “Meekwa” na-echekwa καὶ (‘kwa/ọzọ’) na iwu ποιήσατε, ebe “otu ahụ” na-echekwa οὕτως.
