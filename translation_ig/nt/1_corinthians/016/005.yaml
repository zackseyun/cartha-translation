  register: E ji Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. A họọrọ “m gafesịrị” iji chekwaa echiche nke ihe ga-ebu ụzọ mezue, ebe “aga m esi Masedonia gafee” na-ada ka atụmatụ njem eke n’Igbo.
