  text: Ἐλεύσομαι δὲ πρὸς ὑμᾶς ὅταν Μακεδονίαν διέλθω, Μακεδονίαν γὰρ διέρχομαι,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/005.yaml
  text: But I will come to you when I have gone through Macedonia[a], for I am going through Macedonia.
translation:
  language: ig
  text: Ma aga m abịakwute unu mgbe m gafesịrị Masedonia[a], n’ihi na m na-agafe Masedonia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “mgbe m gafere Masedonia.” A pụrụ ịtụgharị ngwaa Grik a n’ụzọ dị mfe dịka “mgbe m gafere,” ma “mgbe m gafesịrị” na-egosi nke ọma na Pọl ga-ebu ụzọ gafee Masedonia tupu ọ bịa leta ha.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐλεύσομαι
  choice: aga m abịakwute
  rationale: Ọdịnihu nke ἔρχομαι na-egosi nzube Pọl ịbịakwute ndị Kọrịnt; “abịakwute” na-edobe ntụziaka dị na πρὸς ὑμᾶς.
- source_word: δὲ
  choice: Ma
  rationale: δὲ na-egosi obere mgbanwe ma ọ bụ ntakịrị ọdịiche site n’atụmatụ njem ndị e kwuru tupu ya.
- source_word: πρὸς ὑμᾶς
  choice: unu
  rationale: Mgbe e jikọtara ya na “abịakwute,” “unu” na-egosi ndị njem ahụ na-aga iru n’Igbo dị mfe ma bụrụ nke e ji eme ihe.
- source_word: ὅταν
  choice: mgbe
  rationale: N’ọnọdụ atụmatụ njem a, ὅταν ya na aorist subjunctive na-ezo aka n’oge ga-abịa; “mgbe” bụ ntụgharị Igbo kachasị kwekọọ.
- source_word: Μακεδονίαν
  choice: Masedonia
  rationale: Nke a bụ nsụgharị mkpụrụokwu aha ógbè Rom ahụ n’ụdị a na-ahụkarị n’Igbo.
- source_word: διέλθω
  choice: m gafesịrị
  rationale: Aorist subjunctive n’okpuru ὅταν na-enye echiche na ịgafe Masedonia ga-ebu ụzọ zuo tupu Pọl abịakwute ha; “gafesịrị” na-edobe usoro oge ahụ.
- source_word: γὰρ
  choice: n’ihi na
  rationale: γὰρ na-enye ihe kpatara oge Pọl kwuru na ọ ga-abịa.
- source_word: διέρχομαι
  choice: aga m esi ... gafee
  rationale: Present a na-akọ ụzọ njem Pọl kpebiri iso ma ọ bụ nke dị ya n’ihu; usoro a bụ Igbo nkịtị nke na-egosi njem gafere otu ebe.
