  text: Let all that you do be done in love[a].
translation:
  language: ig
  text: Ka e jiri ịhụnanya mee ihe niile unu na-eme.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n’ụzọ dabara n’okwu Grik kpọmkwem karị, “Ka ihe niile nke unu dịrị n’ịhụnanya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα
  choice: ihe niile
  rationale: Ụdị nnọchiaha a na-agụnye ihe niile n’enweghị ihe a hapụrụ; “ihe niile” bụ ụzọ Igbo nkịtị si egosipụta oke ahụ zuru ezu.
- source_word: ὑμῶν
  choice: unu na-eme
  rationale: 'N’okwu Grik, ὑμῶν bụ mkpụrụokwu genitive e jikọrọ ya na πάντα n’ụzọ e wepụrụ ụfọdụ okwu: n’ụzọ nkịtị, “ihe niile nke unu.” “Unu na-eme” na-eme ka ihe a na-atụ aka ya pụta ìhè n’Igbo, ya bụ, ihe niile sitere n’omume ndị Kọrịnt, n’enweghị ịgbasa ihe okwu ahụ pụtara.'
- source_word: ἐν ἀγάπῃ
  choice: jiri ịhụnanya
  rationale: ἀγάπη bụ “ịhụnanya.” N’ebe a, ἐν na-egosi ụzọ ma ọ bụ ọnọdụ e ji eme ihe; “jiri ịhụnanya” bụ okwu Igbo dị ndụ nke na-echekwa echiche ahụ.
- source_word: γινέσθω
  choice: ka e ... mee
  rationale: 'Nke a bụ iwu ma ọ bụ agbamume nke onye nke atọ: “ka ọ bụrụ/mee.” Usoro “ka e ... mee” na-enye ike agbamume ahụ ma na-adaba nke ọma n’Igbo mgbe a na-ekwu banyere omume niile.'
theological_decisions: []
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị mfe nghọta ma nwee ugwu. Nsụgharị bụ nke na-achọ ịdị nso n’usoro Grik ma na-asụkwa Igbo n’ụzọ nkịtị; nkọwa okwu Grik dị mkpirikpi echekwara n’ala peeji.
