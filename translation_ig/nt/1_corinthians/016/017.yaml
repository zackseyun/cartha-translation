  text: χαίρω δὲ ἐπὶ τῇ παρουσίᾳ Στεφανᾶ καὶ Φορτουνάτου καὶ Ἀχαϊκοῦ, ὅτι τὸ ⸀ὑμέτερον ὑστέρημα οὗτοι ἀνεπλήρωσαν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/017.yaml
  text: And I rejoice at the coming of Stephanas and Fortunatus and Achaicus[a], because these men have made up for your absence.
translation:
  language: ig
  text: Obi dịkwa m ụtọ maka ọbịbịa Stefanas na Fọtunatus na Akaịkọs, n’ihi na ndị a emezula ihe kọrọ unu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịtụgharị ya, “ndị a emezula ihe na-adịghị n’aka unu.” O nwere ike ịbụ na Pọl na-ekwu maka enweghị ike ndị Kọrịnt ịnọnyere ya n’onwe ha, ọ bụghị na ha nwere ntụpọ n’omume.
    reason: lexical_alternative
lexical_decisions:
- source_word: χαίρω
  choice: Obi dị m ụtọ
  rationale: Nke a bụ ụzọ Igbo dị ugbu a si ekwu ọṅụ nke onye na-ekwu okwu n’onwe ya, ma ọ ka na-edobe ụda akwụkwọ ozi Pọl.
- source_word: δὲ
  choice: dịkwa
  rationale: δέ bụ njikọ dị nro n’ebe a, ọ bụghị mmegide siri ike; ‘dịkwa’ na-ejikọta amaokwu a na ihe bu ya ụzọ n’ụzọ Igbo kwụ ọtọ.
- source_word: ἐπὶ τῇ παρουσίᾳ
  choice: maka ọbịbịa
  rationale: παρουσία n’ebe a na-ekwu maka mbata ndị ahụ n’onwe ha, ọ bụghị maka ọbịbịa Kraịst n’ọdịnihu.
- source_word: Στεφανᾶ καὶ Φορτουνάτου καὶ Ἀχαϊκοῦ
  choice: Stefanas na Fọtunatus na Akaịkọs
  rationale: E depụtara aha ndị ahụ n’ụdị na-anọchi ụda Grik ma dịkwa mfe ndị na-agụ Igbo ịkpọ.
- source_word: ὅτι
  choice: n’ihi na
  rationale: Ọ na-ewebata ihe mere obi ji dị Pọl ụtọ.
- source_word: τὸ ὑμέτερον ὑστέρημα
  choice: ihe fọdụrụ n’aka unu
  rationale: Nhọrọ a na-edobe echiche bụ́ ihe na-erughị eru ma ọ bụ ihe na-adịghị, n’ebughị ụzọ kpebie na okwu ahụ pụtara naanị anọghị ha n’ebe Pọl nọ.
- source_word: οὗτοι
  choice: ndị a
  rationale: Ọ na-edobe nrụsi aka nke nnọchiaha ngosi Grik ma na-ezo aka n’ụmụ nwoke atọ a kpọrọ aha.
- source_word: ἀνεπλήρωσαν
  choice: emejuola
  rationale: Ngwaa a na-egosi imeju ma ọ bụ iweta ihe ga-eme ka ihe na-adịghị zuo oke.
theological_decisions:
- issue: Ma ‘ihe fọdụrụ n’aka unu’ ọ pụtara anọghị ndị Kọrịnt n’onwe ha ka ọ bụ ihe ọzọ ha na-enyeghị
  choice: E debere okwu sara mbara ‘ihe fọdụrụ n’aka unu’ n’ahịrị amaokwu.
  alternative: ‘ha anọchiela unu n’ebe unu na-anọghị’
  rationale: ὑστέρημα nwere ike izo aka n’ihe na-adịghị ma ọ bụ na-erughị eru. Ihe gbara amaokwu ahụ gburugburu nwere ike igosi na ọ bụ enweghị ike ndị Kọrịnt ịnọnyere Pọl, ma Grik anaghị ekwu nke ahụ kpọmkwem; ya mere, e debere nghọta abụọ ahụ kama idozi esemokwu ahụ n’ime ederede.
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji ‘Obi dị m ụtọ’ mee ka okwu ahụ bụrụ nke eke n’Igbo, ebe e debere ‘ihe fọdụrụ n’aka unu’ ka edoghị ihe ὑστέρημα pụtara n’ụzọ karịrị ihe Grik kwuru.
