source:
  edition: SBLGNT
  text: Περὶ δὲ Ἀπολλῶ τοῦ ἀδελφοῦ, πολλὰ παρεκάλεσα αὐτὸν ἵνα ἔλθῃ πρὸς ὑμᾶς μετὰ τῶν ἀδελφῶν· καὶ πάντως οὐκ ἦν θέλημα ἵνα νῦν ἔλθῃ, ἐλεύσεται δὲ ὅταν εὐκαιρήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/012.yaml
  text: Concerning Apollos our brother[a], I strongly urged him to come to you with the brothers; but it was not at all his will to come now[b]. Yet he will come when he has opportunity.
translation:
  language: ig
  text: Banyere Apọlọs, nwanna anyị[a], arịọsiri m ya ike ka ya na ụmụnna bịakwute unu; ma ọ chọghị ma ọlị ịbịa ugbu a.[b] Ma ọ ga-abịa mgbe o nwere ohere.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “nwanna ahụ.” N’asụsụ Grik, e dere “nwanna ahụ” n’etinyeghị okwu nke pụtara “anyị.”
    reason: lexical_alternative
  - marker: b
    text: 'N''ụzọ dị nso n''okwu Grik: “ọ bụghị ọchịchọ ya ma ọlị ịbịa ugbu a.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Περὶ δὲ
  choice: Banyere
  rationale: Ọ na-ewebata isiokwu ọhụrụ n’akwụkwọ ozi n'ụzọ doro anya, n’etinyeghị ‘ugbu a’ n’isi amaokwu ebe Grik na-etinyeghị νῦν.
- source_word: Ἀπολλῶ τοῦ ἀδελφοῦ
  choice: Apọlọs, nwanna anyị
  rationale: A sụgharịrị aha ahụ dịka a na-akpọ ya n’Igbo; ‘nwanna anyị’ bụ ụzọ Igbo si ekwu nke ọma banyere onye kwere ekwe ibe ha, ọ bụ ezie na Grik kwuru kpọmkwem ‘nwanna ahụ.’
- source_word: πολλὰ παρεκάλεσα αὐτόν
  choice: arịọsiri m ya ike
  rationale: Nke a na-egosipụta ike dị na πολλὰ ma na-ada ka Igbo ebumpụta ụwa.
- source_word: ἵνα ἔλθῃ πρὸς ὑμᾶς μετὰ τῶν ἀδελφῶν
  choice: ka ya na ụmụnna ndị ahụ bịakwute unu
  rationale: Ọ na-edobe ebumnobi arịrịọ ahụ na echiche nke iso ụmụ nwoke ndị a kpọtụrụ aha mee njem.
- source_word: καὶ πάντως οὐκ ἦν θέλημα ἵνα νῦν ἔλθῃ
  choice: ma ọ chọghị ma ọlị ịbịa ugbu a
  rationale: ‘Ma ọlị’ na-egosipụta nkwusiri ike nke πάντως na nkwụghachi; okwu a na-ekwu n’ụzọ Igbo dị mfe na Apọlọs achọghị ịbịa n’oge ahụ.
- source_word: ἐλεύσεται δὲ ὅταν εὐκαιρήσῃ
  choice: Ma ọ ga-abịa mgbe o nwere ohere
  rationale: Ọ na-egosipụta ọdịiche dị n’ahịrịokwu ahụ ma sụgharịa εὐκαιρέω dịka inwe oge ma ọ bụ ohere kwesịrị ekwesị, ọ bụghị naanị ihe ga-adịrị ya mfe.
theological_decisions:
- issue: Onye θέλημα na-ezo aka na ya na ihe ọ pụtara
  choice: 'E gosiri ya dịka ọchịchọ Apọlọs: ‘ọ chọghị ma ọlị.’'
  alternative: ‘Ọ bụghị uche Chineke ka ọ bịa ugbu a’ ma ọ bụ ‘ọ bụghị ọchịchọ ya ma ọlị ịbịa ugbu a.’
  rationale: Apọlọs bụ onye e kwuru okwu ya ozugbo, ya mere ọ bụ ya ka okwu a na-ezo aka n’ụzọ kacha nso. E kwesịghị itinye uche Chineke n’ebe akụkụ Akwụkwọ Nsọ a na-ekwughị ya.
translation_notes:
  register: Igbo ọkọlọtọ nke oge a, dị ùgwù ma dị mfe nghọta. E ji ‘ụmụnna ndị ahụ’ gosi otu ndị nwoke kpọmkwem so mee njem, ma jiri ‘nwanna anyị’ mee ka njikọ ndị kwere ekwe doo anya n’Igbo.
