  text: Γρηγορεῖτε, στήκετε ἐν τῇ πίστει, ἀνδρίζεσθε, κραταιοῦσθε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/013.yaml
  text: Stay alert[a], stand firm in the faith, act courageously[b], be strong.
translation:
  language: ig
  text: Nọọnụ na nche; guzosienụ ike n’okwukwe; nweenụ obi ike[a]; dịnụ ike[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’ụzọ nkịtị, ngwaa Grik ahụ nwere onyinyo nke “meenụ omume dịka ndị nwoke”; n’iji ya eme ihe, ọ pụtara “nweenụ obi ike” ma ọ bụ “dịnụ dike.”
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, “ka e mee unu ka unu dị ike.” Ngwaa Grik dị n’olu passive.
    reason: lexical_alternative
lexical_decisions:
- source_word: Γρηγορεῖτε
  choice: Na-amụ anya
  rationale: Ngwaa iwu nke oge ugbu a na-akpọ ndị a na-agwa ka ha nọgide na-eche nche ma na-amụ anya; okwu a bụ nke Igbo dị ugbu a ma na-egosi omume na-aga n’ihu.
- source_word: στήκετε
  choice: guzosienụ ike
  rationale: Nke a na-egosi iguzosi ike na ịghara ịda mbà, ọ bụghị naanị iguzo n’ụkwụ.
- source_word: ἐν τῇ πίστει
  choice: n’okwukwe
  rationale: Akara nkọwa dị na Grik na-akwado nghọta nke okwukwe Ndị Kraịst dị ka ebe ma ọ bụ ọdịnaya ha ga-eguzosi ike na ya; n’Igbo, “n’okwukwe” na-ekwupụta nke a n’enweghị ịmanye nkọwa otu ụka.
- source_word: ἀνδρίζεσθε
  choice: nweenụ obi ike
  rationale: Ọ bụ ezie na ngwaa Grik sitere n’okwu pụtara “nwoke,” n’iji ya eme ihe ọ bụ òkù ka mmadụ nwee obi ike. Nsụgharị isi na-eji okwu Igbo doro anya ma dị ndụ, ebe nkọwa ala na-echekwa onyinyo nwoke dị na okwu mbụ.
- source_word: κραταιοῦσθε
  choice: dịnụ ike
  rationale: Nke a bụ iwu ka ha dị ike. Olu passive nke Grik nwekwara ike ịpụta ka e mee ha ka ha sie ike; a na-edebe ohere ahụ na nkọwa ala.
theological_decisions:
- issue: Ihe πίστις pụtara n’ebe a
  choice: n’okwukwe
  alternative: n’inwe okwukwe
  rationale: Akara nkọwa dị n’okwu Grik na usoro okwu Pọl na-akwado “okwukwe” dị ka okwukwe Ndị Kraịst ha na-eguzosi ike n’ime ya, ọ bụghị naanị omume mmadụ nke ịtụkwasị obi n’otu oge.
- issue: Onyinyo gbasara nwoke dị na ἀνδρίζεσθε
  choice: nweenụ obi ike, tinyere nkọwa ala banyere okwu nkịtị
  alternative: meenụ omume dị ka ndị nwoke
  rationale: Isi ihe ngwaa ahụ na-ekwu n’ụzọ ilu bụ inwe obi ike. Iji nsụgharị nkịtị mee isi ederede nwere ike ime ka onye Igbo ghọta ya dị ka òkù maka omume metụtara naanị ụmụ nwoke; nkọwa ala na-echekwa ọdịdị okwu Grik na esemokwu dị n’etiti ọdịdị ya na ihe ọ pụtara n’iji ya eme ihe.
- issue: Olu passive nke κραταιοῦσθε
  choice: dịnụ ike, tinyere nkọwa ala
  alternative: ka e mee unu ka unu dị ike
  rationale: “Dịnụ ike” bụ iwu Igbo dị nkenke ma kwekọọ na usoro amaokwu ahụ, ma olu passive dị na Grik nwere ike igosi ike a na-enye ha; ya mere e debere ya na nkọwa ala kama imechi nghọta ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E debere iwu anọ ahụ n’usoro dị mkpirikpi site na semicolon iji chekwaa ụda siri ike nke Grik. Akara nkọwa [a] na [b] nọ kpọmkwem n’ebe okwu ha na-akọwa dị.
