  verdict: revise
  source_fidelity: The four Greek present imperatives are retained in sequence. However, “Na-amụ anya” is not a clear plural imperative in this context; “Nọọnụ na nche” directly and naturally renders Γρηγορεῖτε as an ongoing command to keep watch. The rendering “nweenụ obi ike” accurately conveys the idiomatic force of ἀνδρίζεσθε, while the note can preserve its masculine imagery. “Guzosienụ ike n’okwukwe” and “dịnụ ike” adequately convey the remaining commands; the passive nuance of κραταιοῦσθε is appropriately noted without forcing an unnatural main-text construction.
  naturalness: “Nọọnụ na nche” is idiomatic Standard Igbo and gives a crisp exhortation parallel to the other imperatives. The semicolon sequence is effective. The expression “dịnụ ndị dimkpa” in footnote a is not an appropriate lexical alternative here, since it means being mature/adult-like rather than courageous.
  terminology: “Okwukwe” naturally represents τῇ πίστει and does not impose a denominational construal. “Nweenụ obi ike” is a suitable contemporary rendering of the idiomatic meaning of ἀνδρίζεσθε. The footnote should state the literal male imagery accurately but should not present “being mature” as a meaning of the Greek verb.
  issues:
  - severity: medium
    issue: The opening “Na-amụ anya” is not a clear imperative plural.
    rationale: Γρηγορεῖτε is a present active imperative plural. “Nọọnụ na nche” plainly expresses the required continuing exhortation in Standard Igbo.
  - severity: medium
    issue: Footnote a gives “dịnụ ndị dimkpa” as an alternative meaning.
    rationale: That Igbo phrase concerns maturity or adulthood and can misrepresent ἀνδρίζεσθε, whose idiomatic sense is courage, while its literal imagery is acting like men.
