review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately represents the main syntax and sense: Paul’s arrival, the Corinthians’ approval of delegates, the letters, the purpose of carrying the contribution, and Jerusalem. The future-contingent force is conveyed acceptably by the future main clause. However, the place name should be rendered in established Standard Igbo biblical orthography as “Jeruselem.”'
  naturalness: The sentence is clear and appropriately formal. “Aga m eji akwụkwọ ozi ziga” is understandable, though “eziga … tinyere akwụkwọ ozi” more directly expresses that the delegates are sent accompanied by letters and avoids suggesting that letters are merely the impersonal means by which people are sent.
  terminology: “Onyinye unu” appropriately renders χάρις in this collection context without imposing an abstract theological meaning. The footnote preserves the lexical alternative “amara.” “Jeruselem” is the conventional Igbo form of the biblical place name.
  issues:
  - severity: low
    issue: The draft uses “Jerusalem” rather than Standard Igbo biblical spelling “Jeruselem.”
    rationale: Using the established Igbo form improves consistency of names in a Standard Igbo scripture translation; the same correction is needed in the footnote.
  - severity: low
    issue: “eji akwụkwọ ozi ziga” can be read as using letters as the means of sending the delegates.
    rationale: Greek δι’ ἐπιστολῶν is compact and its precise attachment is not fully explicit, but in context the letters accompany/credential the approved persons. “tinyere akwụkwọ ozi” expresses this naturally without specifying letters of recommendation.
  revised_text: Ma mgbe m bịarutere, aga m eziga ndị unu kwadoro, tinyere akwụkwọ ozi, ka ha buru onyinye unu gaa Jeruselem.[a]
  revised_footnotes:
