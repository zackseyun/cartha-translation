  text: ὅταν δὲ παραγένωμαι, οὓς ⸀ἐὰν δοκιμάσητε δι’ ἐπιστολῶν, τούτους πέμψω ἀπενεγκεῖν τὴν χάριν ὑμῶν εἰς Ἰερουσαλήμ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/003.yaml
  text: And when I arrive[b][a], I will send with letters those whom you approve to carry your gift to Jerusalem.
translation:
  language: ig
  text: Ma mgbe m bịarutere, aga m eziga ndị unu kwadoro, tinyere akwụkwọ ozi, ka ha buru onyinye unu gaa Jeruselem.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “onyinye ebere unu.” Okwu Grik a pụkwara ịpụta “amara,” ma n’ebe a ọ na-ezo aka n’onyinye a na-eziga Jeruselem.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν δὲ παραγένωμαι
  choice: Ma mgbe m bịarutere
  rationale: “Mgbe” tinyere ngwaa ọdịnihu dị n’ahịrịokwu ukwu na-egosipụta ihe a na-atụ anya na ọ ga-eme; “Ma” na-ejigide njikọ δέ n’enweghị ime ka ọ bụrụ nnukwu esemokwu.
- source_word: οὓς ἐὰν δοκιμάσητε
  choice: ndị unu kwadoro
  rationale: δοκιμάζω nwere echiche nke inyocha ma mesịa kwado; n’ọnọdụ ịhọpụta ndị nnọchi anya a, “kwadoro” bụ Igbo doro anya ma kwekọọ n’ihe a na-ekwu.
- source_word: δι’ ἐπιστολῶν
  choice: jiri akwụkwọ ozi
  rationale: διά na genitive na-egosi ihe e ji mee ihe. Nke a na-egosi na ndị ahụ ga-eji akwụkwọ ozi Pọl nyere ha gaa, n’agbanyeghị na ụdị akwụkwọ ozi ndị ahụ akọwaghị kpọmkwem.
- source_word: τούτους πέμψω
  choice: aga m ... ziga ndị
  rationale: Nnọchiaha τούτους na-alaghachi n’ebe ndị ọgbakọ kwadoro nọ; usoro Igbo a na-eme ka ihe e ziga na onye zitere ya doo anya.
- source_word: ἀπενεγκεῖν
  choice: ka ha buru
  rationale: Infinitive a na-egosi nzube iziga ha, ya bụ ka ha buru onyinye ahụ gaa Jerusalem.
- source_word: τὴν χάριν ὑμῶν
  choice: onyinye unu
  rationale: N’ọnọdụ nchịkọta ego a, χάρις na-ezo aka n’onyinye ebere a na-eziga ndị nsọ nọ na Jerusalem, ọ bụghị naanị ‘amara’ dị ka echiche nkịtị.
- source_word: εἰς Ἰερουσαλήμ
  choice: gaa Jerusalem
  rationale: εἰς na aha obodo na-egosi ebe a na-aga; “gaa Jerusalem” bụ usoro Igbo ebumpụta ụwa.
theological_decisions:
- issue: Ihe χάρις pụtara n’ọnọdụ nchịkọta onyinye a
  choice: Onyinye a na-eziga ndị kwere ekwe nọ na Jerusalem
  alternative: Amara; ma ọ bụ omume ebere
  rationale: Ihe gbara amaokwu ahụ gburugburu na-ekwu maka nchịkọta maka ndị nsọ. Ya mere, okwu ahụ na-ezo kpọmkwem n’onyinye ahụ, ma ọ ka nwekwara ụda echiche nke mmesapụ aka sitere n’amara.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E debere usoro ahịrịokwu ahụ ka o doo anya na akwụkwọ ozi so ndị a kwadoro, ebe nzube ha bụ ibu onyinye ahụ gaa Jerusalem.
