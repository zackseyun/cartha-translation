- from: Ma mgbe m bịarutere, aga m eji akwụkwọ ozi ziga ndị unu kwadoro ka ha buru onyinye unu gaa Jerusalem.[a]
  to: Ma mgbe m bịarutere, aga m eziga ndị unu kwadoro, tinyere akwụkwọ ozi, ka ha buru onyinye unu gaa Jeruselem.[a]
  rationale: The revision retains the source meaning and the draft’s register while using the conventional Standard Igbo form “Jeruselem.” It also makes the relationship of the letters to the sent delegates more idiomatic in Igbo, without adding the interpretive phrase “akwụkwọ ozi nkwado.”
  reviewer_model: gpt-5.6-terra
