    reason: lexical_alternative
  revision_rationale: The revision retains the source meaning and the draft’s register while using the conventional Standard Igbo form “Jeruselem.” It also makes the relationship of the letters to the sent delegates more idiomatic in Igbo, without adding the interpretive phrase “akwụkwọ ozi nkwado.”
