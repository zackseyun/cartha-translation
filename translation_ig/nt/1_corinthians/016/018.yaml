  text: ἀνέπαυσαν γὰρ τὸ ἐμὸν πνεῦμα καὶ τὸ ὑμῶν. ἐπιγινώσκετε οὖν τοὺς τοιούτους.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/018.yaml
  text: For they refreshed my spirit and yours[a]. Therefore acknowledge such men.
translation:
  language: ig
  text: N’ihi na ha nyere mmụọ m na nke unu ume ọhụrụ. Ya mere, maranụ ndị ikom dị otu a[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “mataanụ ndị ikom dị otu a,” ma ọ bụ, “jirinụ ndị ikom dị otu a kpọrọ ihe.” Okwu Grik ahụ dị n’ụdị nwoke; ebe a, ọ na-ezo aka kpọmkwem n’ndị ikom a kpọrọ aha n’amaokwu ndị bu ụzọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέπαυσαν
  choice: nyere ... ume ọhụrụ
  rationale: N'ebe a, okwu ahụ na-egosi izu ike na ume ọhụrụ nke ime mmadụ, ọ bụghị izu ike nkịtị.
- source_word: γὰρ
  choice: N’ihi na
  rationale: Ọ na-ejikọta amaokwu a na ihe bu ya ụzọ dịka ihe kpatara otuto ahụ.
- source_word: πνεῦμα
  choice: mmụọ
  rationale: Ọ na-ekwu maka ime mmadụ na ọnọdụ obi ya, ọ bụghị Mmụọ Nsọ; ‘mmụọ’ na-echekwa okwu Pọl ji.
- source_word: τὸ ἐμὸν πνεῦμα καὶ τὸ ὑμῶν
  choice: mmụọ m na nke unu
  rationale: Nke a na-echekwa nhazi okwu Grik dị mkpirikpi; ‘nke unu’ na-anọchi anya ‘mmụọ unu.’
- source_word: ἐπιγινώσκετε
  choice: nyenụ ... nkwanye kwesịrị ha
  rationale: N'ebe a, ọ pụtara ịmata uru ndị a ma nye ha nnabata kwesịrị ekwesị, ọ bụghị nanị ịmata ndị ha bụ.
- source_word: οὖν
  choice: Ya mere
  rationale: Ọ na-egosi nkwubi okwu na ndụmọdụ sitere n'ihe e kwuru tupu ya.
- source_word: τοὺς τοιούτους
  choice: ndị ikom dị otu a
  rationale: Ọ na-ezo aka kpọmkwem n’ụmụ nwoke atọ a kpọrọ aha n’amaokwu ndị bu ụzọ, ma na-echekwa ntụaka nwoke dị na Grik.
theological_decisions:
- issue: Ụdị okike nwoke dị na τοὺς τοιούτους
  choice: ndị ikom dị otu a
  alternative: ndị dị otu a
  rationale: Ọ bụ ezie na okwu a nwere ike ịgụnye mmadụ niile n’ọnọdụ ụfọdụ, ebe a ọ na-ezo aka na Stefanas, Fọtunatus, na Akaịkọs, ndị bụ ụmụ nwoke.
translation_notes:
  register: Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ ‘nyere ... ume ọhụrụ’ maka nkọwa ihe mere n’ime mmadụ, ebe ‘nkwanye kwesịrị ha’ na-egosi nnabata bara uru n’enweghị ime ka ọ bụrụ iwu nke nsọpụrụ pụrụ iche.
