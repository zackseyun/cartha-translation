    issue: The phrase “n'ọrụ ijere ndị nsọ ozi” is redundant/heavy.
    rationale: It combines “ọrụ” and “ijere ... ozi” where “ije ozi nye ndị nsọ” already naturally conveys διακονίαν τοῖς ἁγίοις.
  - severity: low
    issue: Footnote a's wording for the literal Greek expression is awkward.
    rationale: “Ụmụnne nwoke” is less idiomatic here than “ụmụnna nwoke”; the alternative can also be stated more naturally as “ụmụnna nwoke na ụmụnna nwanyị.”
  - severity: low
    issue: Footnote b's phrase “ndị so ná ndị mbụ kwere ekwe” is awkward.
    rationale: “Ndị mbụ kwere ekwe n'Akaịa” states the likely temporal sense directly without changing the retained metaphor in the main text.
