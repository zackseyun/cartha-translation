  text: Παρακαλῶ δὲ ὑμᾶς, ἀδελφοί· οἴδατε τὴν οἰκίαν Στεφανᾶ, ὅτι ἐστὶν ἀπαρχὴ τῆς Ἀχαΐας καὶ εἰς διακονίαν τοῖς ἁγίοις ἔταξαν ἑαυτούς·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/015.yaml
  text: 'I urge you[a], brothers: you know the household of Stephanas, that they are the firstfruits of Achaia[b], and they devoted themselves to the service of the saints.'
translation:
  language: ig
  text: 'Ma ana m arịọ unu[a], ụmụnna: unu maara ezinaụlọ Stefanas, na ha bụ mkpụrụ mbụ nke Akaịa[b], nakwa na ha rara onwe ha nye ije ozi nye ndị nsọ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ụmụnna nwoke na ụmụnna nwanyị”; okwu Grik ahụ pụtara n'ụzọ nkịtị “ụmụnna nwoke,” ma a na-ejikarị ya akpọ ọgbakọ niile.
    reason: lexical_alternative
  - marker: b
    text: “Mkpụrụ mbụ” yiri ka ọ pụtara ndị mbụ kwere ekwe n'Akaịa, ma ọ ka na-echekwa ihe atụ nke akụkụ mbụ e wepụtara nye Chineke.
    reason: lexical_alternative
lexical_decisions:
- source_word: Παρακαλῶ
  choice: ana m arịọ unu
  rationale: Nke a na-egosi arịrịọ siri ike nke Pọl na-arịọ ha, ma ọ ka bụkwa okwu Igbo dị mfe ma dị nsọpụrụ.
- source_word: δὲ
  choice: Ma
  rationale: δέ na-egosi ntụgharị dị nro n'okwu; “Ma” na-ejikọta amaokwu a na ihe bu ya ụzọ n'ụzọ ebumpụta ụwa, n'agbanyeghị na ọ bụghị mmegide siri ike.
- source_word: ἀδελφοί
  choice: ụmụnna
  rationale: “Ụmụnna” bụ okwu a na-ejikarị akpọkọta ndị otu okwukwe n'Igbo, ọ pụkwara ịgụnye ndị nwoke na ndị nwanyị n'ụzọ ebumpụta ụwa.
- source_word: οἴδατε
  choice: unu maara
  rationale: Ụdị perfect Grik a nwere nghọta nke ugbu a n'ebe a; “unu maara” bụ ntụgharị kwụ ọtọ.
- source_word: οἰκίαν Στεφανᾶ
  choice: ezinaụlọ Stefanas
  rationale: “Ezinaụlọ” na-echekwa echiche nke ndị niile so n'ụlọ, ọ bụghị naanị ụlọ ahụ ma ọ bụ ndị ikwu ọbara.
- source_word: ἀπαρχὴ τῆς Ἀχαΐας
  choice: mkpụrụ mbụ nke Akaịa
  rationale: Nke a na-echekwa ihe atụ nke ἀπαρχή, gụnyere echiche nke ndị mbụ kwere ekwe na nke ihe mbụ e wepụtara nye Chineke.
- source_word: εἰς διακονίαν τοῖς ἁγίοις
  choice: n'ọrụ ijere ndị nsọ ozi
  rationale: Nke a bụ okwu Igbo doro anya maka ọrụ enyemaka ma ọ bụ ije ozi a na-emere ndị kwere ekwe, na-enweghị itinye echiche nke ọkwa ụka.
- source_word: ἔταξαν ἑαυτούς
  choice: ha tinyere onwe ha
  rationale: Okwu a na-egosi na ha ji aka ha kpebie ma rara onwe ha nye ọrụ ahụ n'ụzọ na-adịgide adịgide.
theological_decisions:
- issue: Nghọta nke ἀδελφοί mgbe a na-akpọ ọgbakọ
  choice: ụmụnna
  alternative: ụmụ nwoke na ụmụ nwanyị ibe m
  rationale: “Ụmụnna” na-echekwa ihe oyiyi nke mmekọrịta ezinụlọ ma bụrụkwa okwu Igbo nwere ike ịgụnye ọgbakọ niile; nkọwa ala peeji na-eme ka nke a doo anya.
- issue: Nghọta nke ἀπαρχὴ τῆς Ἀχαΐας
  choice: mkpụrụ mbụ nke Akaịa
  alternative: ndị mbụ kwere ekwe n'Akaịa
  rationale: Idobe ihe atụ nke “mkpụrụ mbụ” na-echekwa ma echiche oge—ndị mbụ kwere ekwe—ma ụda nke ihe e wepụtara nye Chineke, kama idozi ya naanị n'otu nghọta.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ “ụmụnna” n'ihi na ọ bụ okwu ọgbakọ ebumpụta ụwa n'Igbo; a hapụrụ ihe atụ “mkpụrụ mbụ” ka esemokwu na omimi dị na isi mmalite ghara ịla n'iyi.
