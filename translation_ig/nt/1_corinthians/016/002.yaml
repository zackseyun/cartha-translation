  variant: Standard Igbo
source:
  edition: SBLGNT
  text: κατὰ μίαν ⸀σαββάτου ἕκαστος ὑμῶν παρ’ ἑαυτῷ τιθέτω θησαυρίζων ὅ τι ⸀ἐὰν εὐοδῶται, ἵνα μὴ ὅταν ἔλθω τότε λογεῖαι γίνωνται.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/002.yaml
  text: On the first day of every week[a], each of you is to set something aside, storing up whatever he may prosper in[c][b], so that collections will not be made when I come.
translation:
  language: ig
  text: N’ụbọchị mbụ nke izu ọ bụla[a], ka onye ọ bụla n’ime unu debe ihe n’akụkụ, n’ebe ya[b], na-akpakọba dịka ọganihu ya si dị[c], ka a ghara inwe nchịkọta mgbe m bịara.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “N’ụbọchị mbụ nke izu.” Okwu Grik ebe a na-egosi omume a na-eme kwa izu.
    reason: lexical_alternative
  - marker: b
    text: N’ụzọ nkịtị, “n’ebe onwe ya” ma ọ bụ “n’akụkụ onwe ya.” Nke a nwere ike ịpụta ka onye ọ bụla debe ihe ahụ n’onwe ya, ikekwe n’ụlọ.
    reason: lexical_alternative
  - marker: c
    text: A pụkwara ịsụgharị ya, “dịka ọ na-aga nke ọma.” Ihe ọ pụtara bụ ka onye ọ bụla debe ihe dịka ọganihu ya si dị.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ μίαν σαββάτου
  choice: N’ụbọchị mbụ nke izu ọ bụla
  rationale: Κατά na nkebiokwu a na-egosi ihe a na-eme ugboro ugboro; ntụgharị a na-eme ka omume a na-eme kwa izu doo anya n’Igbo nkịtị.
- source_word: ἕκαστος ὑμῶν
  choice: onye ọ bụla n’ime unu
  rationale: Ọ na-ekesa iwu ahụ n’otu n’otu nye ndị niile Pọl na-agwa okwu.
- source_word: παρ’ ἑαυτῷ τιθέτω
  choice: ka ... debe ihe n’akụkụ ya
  rationale: Nke a na-echekwa echiche nke idobere ihe iche n’onwe onye, n’agbanyeghị na okwu Grik ahụ anaghị ekpebi kpamkpam ma ọ bụ n’ụlọ ka a ga-edebe ya.
- source_word: θησαυρίζων
  choice: na-achịkọta
  rationale: Ọ na-egosi na a ga na-edobe ma na-achịkọta onyinye ahụ nwayọọ nwayọọ tupu Pọl abịa.
- source_word: ὅ τι ἐὰν εὐοδῶται
  choice: ihe dịka ọganihu o nwetara si dị
  rationale: Nke a na-egosi na ihe onye ahụ ga-edobe ga-adaba n’ọganihu ma ọ bụ ihe ọma o nwetara, ma ọ naghị eme ka okwu ahụ bụrụ naanị ụgwọ ọrụ o ritere.
- source_word: ἵνα μὴ ὅταν ἔλθω τότε λογεῖαι γίνωνται
  choice: ka a ghara ịmalite ịnakọta onyinye mgbe m bịara
  rationale: 'Ọ na-egosipụta ebumnuche iwu ahụ: ka a ghara ichere ọbịbịa Pọl tupu amalite nchịkọta ego.'
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “Debe ihe n’akụkụ ya” na-edobe ntakịrị mgbagwoju anya nke παρ’ ἑαυτῷ; “onyinye” na-eme ka ụdị nchịkọta ego a na-ekwu maka ya doo anya n’ọnọdụ amaokwu ahụ.
