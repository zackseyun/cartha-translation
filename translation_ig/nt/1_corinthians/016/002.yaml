review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the recurring first-day practice, individual participation, proportionality to prosperity, and Paul's purpose. However, “ịmalite ịnakọta” adds the idea of beginning collections, whereas λογεῖαι γίνωνται says that collections should not occur at that time. The participle θησαυρίζων is better represented as ongoing saving/accumulating than as a collection-drive action.
  naturalness: “Debe ihe n’akụkụ ya” is understandable but somewhat awkward and can suggest physical proximity to a person. “Debe ihe n’akụkụ, n’ebe ya” is more idiomatic while retaining the source phrase’s unresolved sense. “Ka a ghara inwe nchịkọta” is natural Standard Igbo.
  terminology: “Ọganihu” appropriately expresses εὐοδῶται without restricting it to wages. “Nchịkọta” accurately renders λογεῖαι; it does not need the more interpretively specific “onyinye.”
  issues:
  - severity: medium
    issue: The phrase “ka a ghara ịmalite ịnakọta onyinye” adds “begin” and specifies “gifts.”
    rationale: The Greek purpose is that no collections take place when Paul arrives, not merely that they not be started then. λογεῖαι means collections; the supplied object “onyinye” is not necessary.
  - severity: low
    issue: “na-achịkọta” may be heard as conducting a collection rather than storing funds over time.
    rationale: θησαυρίζων denotes laying up or accumulating. “na-akpakọba” more directly conveys the ongoing storing sense.
  - severity: low
    issue: “n’akụkụ ya” is slightly unnatural for παρ’ ἑαυτῷ.
    rationale: The Greek may mean privately/by oneself or at one’s home. Adding “n’ebe ya” gives an idiomatic expression without deciding the debated location.
  revised_text: N’ụbọchị mbụ nke izu ọ bụla[a], ka onye ọ bụla n’ime unu debe ihe n’akụkụ, n’ebe ya[b], na-akpakọba dịka ọganihu ya si dị[c], ka a ghara inwe nchịkọta mgbe m bịara.
  revised_footnotes:
