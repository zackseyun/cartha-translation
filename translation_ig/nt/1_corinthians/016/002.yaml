revisions:
- from: N’ụbọchị mbụ nke izu ọ bụla[a], ka onye ọ bụla n’ime unu debe ihe n’akụkụ ya[b], na-achịkọta ihe dịka ọganihu o nwetara si dị[c], ka a ghara ịmalite ịnakọta onyinye mgbe m bịara.
  to: N’ụbọchị mbụ nke izu ọ bụla[a], ka onye ọ bụla n’ime unu debe ihe n’akụkụ, n’ebe ya[b], na-akpakọba dịka ọganihu ya si dị[c], ka a ghara inwe nchịkọta mgbe m bịara.
  rationale: The revision removes the unsupported idea of beginning a collection, renders the ongoing storing sense of θησαυρίζων more clearly, and makes the deliberately ambiguous παρ’ ἑαυτῷ phrasing more natural in Standard Igbo. It preserves the Greek’s unspecified “something,” the proportional character of the saving, and the weekly recurrence.
  reviewer_model: gpt-5.6-terra
