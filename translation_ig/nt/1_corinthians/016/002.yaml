    text: A pụkwara ịsụgharị ya, “N’ụbọchị mbụ nke izu.” Okwu Grik ebe a na-egosi omume a na-eme kwa izu.
    reason: lexical_alternative
  - marker: b
    text: N’ụzọ nkịtị, “n’ebe onwe ya” ma ọ bụ “n’akụkụ onwe ya.” Nke a nwere ike ịpụta ka onye ọ bụla debe ihe ahụ n’onwe ya, ikekwe n’ụlọ.
    reason: lexical_alternative
  - marker: c
    text: A pụkwara ịsụgharị ya, “dịka ọ na-aga nke ọma.” Ihe ọ pụtara bụ ka onye ọ bụla debe ihe dịka ọganihu ya si dị.
    reason: lexical_alternative
  revision_rationale: The revision removes the unsupported idea of beginning a collection, renders the ongoing storing sense of θησαυρίζων more clearly, and makes the deliberately ambiguous παρ’ ἑαυτῷ phrasing more natural in Standard Igbo. It preserves the Greek’s unspecified “something,” the proportional character of the saving, and the weekly recurrence.
