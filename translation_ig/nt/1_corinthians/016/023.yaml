id: 1CO.16.23
reference: 1 Corinthians 16:23
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἡ χάρις τοῦ κυρίου ⸀Ἰησοῦ μεθ’ ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/023.yaml
  text: The grace of the Lord Jesus be with you.
translation:
  language: ig
  text: Ka amara nke Onyenwe anyị Jizọs dịnyere unu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χάρις
  choice: amara
  rationale: “Amara” bụ okwu Igbo a na-ejikarị akọwa ihu ọma na ngọzi Chineke na-enye n’efu; ọ dabara n’usoro ngọzi Pọl ma na-edobe ibu echiche okpukpe dị n’okwu Grik ahụ.
- source_word: κύριος
  choice: Onyenwe anyị
  rationale: “Onyenwe anyị” bụ aha nsọpụrụ a na-ejikarị eme ihe n’Igbo maka κύριος, ma na-egosipụta ọnọdụ Jizọs dị ka Onyenwe anyị.
- source_word: Ἰησοῦ
  choice: Jizọs
  rationale: E degharịrị aha onye ahụ n’ụdị a maara nke ọma na Standard Igbo.
- source_word: μεθ’ ὑμῶν
  choice: dịnyere unu
  rationale: Ọ bụ ezie na nkebi Grik ahụ pụtara n'ụzọ nkịtị “nọnyeere unu,” “dịnyere unu” na-ekwupụta nke ọma arịrịọ ngọzi a na-aghọta n’ahịrịokwu Grik na-enweghị ngwaa.
- source_word: τοῦ κυρίου Ἰησοῦ
  choice: Onyenwe anyị Jizọs
  rationale: 'Nhazi a na-edobe njikọ genitive ahụ n’ụzọ Igbo sitere n’okike: “amara Onyenwe anyị Jizọs,” n’enweghị ime ka “sitere n’aka” pụta ìhè karịa ka Grik si kwuo.'
theological_decisions:
- issue: Usoro ngọzi na-enweghị ngwaa e dere kpọmkwem
  choice: E jiri “Ka ... dịnyere unu” gosipụta ọchịchọ ngọzi ahụ.
  alternative: “Amara Onyenwe anyị Jizọs nọnyeere unu.”
  rationale: Grik enweghị ngwaa, ma usoro Igbo “Ka ... dịnyere unu” na-eme ka ike nke ngọzi ahụ doo anya ma bụrụ asụsụ ebumpụta ụwa, n’etinyeghị echiche ọhụrụ.
translation_notes:
  register: Asụsụ Standard Igbo dị ugbu a, dị nsọpụrụ ma dị mfe nghọta. E ji usoro ngọzi “Ka ... dịnyere unu” mee ka ellipsis Grik bụrụ nke sitere n’okike n’Igbo.
