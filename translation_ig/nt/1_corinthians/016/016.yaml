  text: ἵνα καὶ ὑμεῖς ὑποτάσσησθε τοῖς τοιούτοις καὶ παντὶ τῷ συνεργοῦντι καὶ κοπιῶντι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/016.yaml
  text: that you also submit yourselves to such people[b][a], and to everyone who works and labors.
translation:
  language: ig
  text: ka unu rubekwa isi n’ebe ndị dị otu a nọ,[a] nakwa n’ebe onye ọ bụla na-arụkọ ọrụ[b] ma na-adọgbu onwe ya n’ọrụ nọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “ka unu rubekwa isi n’ebe ndị dịka ndị a nọ.”
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụ ya, “na-arụkọ ọrụ,” dịka “bụ onye ọrụ ibe” ma ọ bụ “na-esonyere ndị ọzọ n’ọrụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: ka
  rationale: N'okwu a, “ka” na-ejikọta arịrịọ a na ihe Pọl kwuru n'amaokwu bu ya ụzọ, ma nwee ike igosi ebumnuche ma ọ bụ ọdịnaya nke arịrịọ ahụ.
- source_word: καὶ ὑμεῖς
  choice: unu onwe unu dookwa
  rationale: “Onwe unu” na “-kwa” na-echekwa nkwusi ike na echiche nke na ndị Kọrịnt kwesịkwara ime otu ahụ.
- source_word: ὑποτάσσησθε
  choice: dọọ onwe unu n'okpuru
  rationale: Nke a na-egosi iji ọchịchọ mmadụ kweta ịnọ n'okpuru nduzi ma ọ bụ usoro, ma na-echekwa ọdịdị reflexive nke okwu Grik ahụ.
- source_word: τοῖς τοιούτοις
  choice: ndị dị otu a
  rationale: Ọ na-ezo aka n'ụdị ndị dịka ezinụlọ Stefanas, ọ bụghị nanị n'ahụ nwoke, ya mere okwu a anaghị etinye oke gbasara okike mmadụ.
- source_word: παντὶ τῷ συνεργοῦντι
  choice: onye ọ bụla na-arụkọ ọrụ
  rationale: “Na-arụkọ ọrụ” na-echekwa ọdịdị ngwaa na echiche imekọ ihe ọnụ dị na συνεργοῦντι, na-ahapụghị ya ka ọ bụrụ naanị aha ọrụ.
- source_word: καὶ κοπιῶντι
  choice: ma na-adọgbu onwe ya n'ọrụ
  rationale: Nkebi a na-egosi ọrụ siri ike nke na-eri ume, nke bụ isi echiche κοπιάω.
theological_decisions:
- issue: Ụdị ido onwe onye n'okpuru a na-enye n'iwu
  choice: Arịrịọ ka ndị Kọrịnt jiri ọchịchọ ha kwanyere ndị ọrụ Kraịst dịka ndị a ùgwù ma nabata nduzi ha.
  alternative: Iwu sara mbara nke na-achọ nrubeisi zuru oke n'okpuru usoro ọchịchị.
  rationale: Amaokwu ndị gbara ya gburugburu na-ekwu banyere ezinụlọ Stefanas na ndị niile so na-arụ ọrụ. Nsụgharị a na-echekwa ike nke ὑποτάσσησθε n'etinyeghị echiche banyere nrubeisi zuru oke ma ọ bụ usoro ụlọọrụ nke amaokwu ahụ n'onwe ya na-ekwughị.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. “Dọọ onwe unu n'okpuru” na-echekwa ike okwu isi mmalite ahụ n'emeghị ka ọ bụrụ nrubeisi na-enweghị oke; “na-adọgbu onwe ya n'ọrụ” na-egosi ọrụ siri ike.
