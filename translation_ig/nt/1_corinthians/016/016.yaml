review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents ἵνα, the inclusive force of καὶ ὑμεῖς, the class-reference of τοῖς τοιούτοις, and the paired participles συνεργοῦντι and κοπιῶντι. However, “unu onwe unu dookwa onwe unu n'okpuru” is both orthographically/formally problematic and unnecessarily repetitive. A more idiomatic Standard Igbo expression is needed for voluntary submission while retaining the command’s force.
  naturalness: “Rubekwa isi n’ebe … nọ” is natural contemporary Standard Igbo for submitting oneself to persons, and it avoids the doubled “onwe unu.” The revised coordination makes clear that the same response extends to every fellow worker and laborer.
  terminology: “Ndị dị otu a” appropriately retains the non-gender-specific class reference. “Na-arụkọ ọrụ” preserves the collaborative verbal sense of συνεργέω, while “na-adọgbu onwe ya n’ọrụ” suitably conveys strenuous labor. “Rubekwa isi” should be understood here in the immediate context of deference to such workers, not as an imported claim of unlimited obedience.
  issues:
  - severity: medium
    issue: The expression “ka unu onwe unu dookwa onwe unu n'okpuru” is awkward and contains an avoidable duplicated reflexive/emphatic construction.
    rationale: It attempts to represent both καὶ ὑμεῖς and the middle sense of ὑποτάσσησθε, but it is not idiomatic modern Standard Igbo. “Rubekwa isi n’ebe … nọ” naturally conveys the required response and the -kwa retains the inclusion/emphasis.
  - severity: low
    issue: Footnote b is grammatically incomplete in its introductory wording.
    rationale: Adding “ya” after “A pụkwara ịsụ” makes the note well formed without changing its lexical content.
