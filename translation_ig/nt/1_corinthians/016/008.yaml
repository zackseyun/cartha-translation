lexical_decisions:
- source_word: ἐπιμενῶ
  choice: m ga-anọ
  rationale: Ọ bụ ngwaa ọdịnihu nke ἐπιμένω; n’ebe a, n’atụmatụ njem Pọl, ọ pụtara ịnọgide n’otu ebe ruo oge a kara aka. “M ga-anọ” bụ Igbo nkịtị ma doo anya.
- source_word: δὲ
  choice: Ma
  rationale: δέ na-egosi obere ntụgharị ma ọ bụ ọdịiche n’ihe a na-ekwu. “Ma” na-echekwa ọdịiche ahụ n’ụzọ dị mfe.
- source_word: ἐν Ἐφέσῳ
  choice: n’Efesọs
  rationale: ἐν tinyere aha n’ụdị dative na-egosi ebe. E dere aha obodo ahụ dịka a na-akpọkarị ya n’Igbo.
- source_word: ἕως τῆς πεντηκοστῆς
  choice: ruo Pentikọst
  rationale: ἕως tinyere genitive na-egosi oge ga-eru tupu ihe agbanwee. “Pentikọst” bụ aha a maara nke ọma n’Agba Ọhụrụ maka ememme ahụ.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị mfe ma dị ùgwù. E ji “ga-anọ” mee ka atụmatụ njem ọdịnihu pụta ìhè; a hapụrụ aha ememme ahụ dịka “Pentikọst,” ma tinye aha ọzọ n’okpuru peeji.
