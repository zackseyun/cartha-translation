  text: But I will stay in Ephesus until Pentecost[a].
translation:
  language: ig
  text: Ma m ga-anọ n’Efesọs ruo Pentikọst[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ruo Ememme Izu Asaa.”
