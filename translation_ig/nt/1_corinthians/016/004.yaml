  naturalness: “Ha ga-eso m gaa” is a more idiomatic Standard Igbo expression for accompanying Paul on the journey than “ha na m ga-agakọ,” while retaining the future journey sense.
  terminology: “Ọ dabara adaba” naturally conveys the contextual sense of ἄξιον as appropriate/fitting. The footnote preserves “ọ bara uru” as a legitimate lexical alternative without making it the primary contextual sense.
