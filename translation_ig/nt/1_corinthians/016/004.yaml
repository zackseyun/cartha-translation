  text: ἐὰν δὲ ⸂ἄξιον ᾖ⸃ τοῦ κἀμὲ πορεύεσθαι, σὺν ἐμοὶ πορεύσονται.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/004.yaml
  text: And if it is worthwhile for me to go also, they will go with me.
translation:
  language: ig
  text: Ọ bụrụkwa na ọ dabara adaba[a] ka m kwa gaa, ha ga-eso m gaa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịtụgharị ya, “Ọ bụrụkwa na ọ bara uru ka m kwa gaa.” Okwu Grik a nwere ike ịpụta ihe kwesịrị ekwesị, ihe dabara adaba, ma ọ bụ ihe bara uru n’ọnọdụ ahụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν δὲ
  choice: Ọ bụrụkwa na
  rationale: Nke a na-egosi ọnọdụ e tinyere, ebe δέ bụ njikọ dị nro; “-kwa” na-eme ka amaokwu a jikọọ nke ọma na ihe bu ya ụzọ n’enweghị ime ka ọ bụrụ nnukwu mmegide.
- source_word: ἄξιον ᾖ
  choice: o kwesịrị
  rationale: N’okwu a, nkebi ahụ na-arụ ọrụ dịka okwu na-abụghị maka ịdị mma nke Pọl n’onwe ya, kama ọ bụ maka ma njem ya ò kwesịrị ekwesị n’ọnọdụ ahụ.
- source_word: τοῦ κἀμὲ πορεύεσθαι
  choice: ka mụ onwe m gaa
  rationale: “Ka ... gaa” na-enye infinitive ahụ n’Igbo nkịtị, ebe “mụ onwe m” na-echekwa ike mgbakwunye dị na κἀμέ—na Pọl kwa ga-aga.
- source_word: σὺν ἐμοὶ πορεύσονται
  choice: ha na m ga-agakọ
  rationale: “Ga-agakọ” na-egosi njem ha na Pọl ọnụ, ma na-anọgide na ngwaa ‘ịga’ dị ka e mere ugboro abụọ n’asụsụ Grik.
theological_decisions:
- issue: Ihe ọnọdụ Pọl kwuru banyere iso ndị nnọchi anya gaa pụtara
  choice: Ọ bụrụ na a hụ na ọ kwesịrị ekwesị ka Pọl kwa gaa, ndị nnọchi anya ahụ na ya ga-agakọ.
  alternative: Ọ bụrụ na onyinye ahụ bara uru nke ukwuu ka Pọl gaa; ma ọ bụ, ọ bụrụ na Pọl ruru eru ịga.
  rationale: 'ἄξιον bụ okwu impersonal n’ebe a, infinitive ahụ akọwakwa ihe a na-atụle: ọ bụ njem Pọl, ọ bụghị uru onyinye ahụ ma ọ bụ ịdị mma Pọl n’omume.'
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji “mụ onwe m” mee ka mgbakwunye dị na κἀμέ pụta ìhè; e jikwa “ga-agakọ” gosipụta iso ibe ha mee njem n’asụsụ Igbo nkịtị.
