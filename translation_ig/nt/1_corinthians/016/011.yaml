id: 1CO.16.11
reference: 1 Corinthians 16:11
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: μή τις οὖν αὐτὸν ἐξουθενήσῃ. προπέμψατε δὲ αὐτὸν ἐν εἰρήνῃ, ἵνα ἔλθῃ πρός ⸀με, ἐκδέχομαι γὰρ αὐτὸν μετὰ τῶν ἀδελφῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/011.yaml
  text: So then[a], let no one despise him. But send him on his way in peace, so that he may come to me, for I am expecting him with the brothers.
translation:
  language: ig
  text: Ya mere, ka onye ọ bụla ghara ileda ya anya. Ma ziganụ ya n’udo, ka o wee bịakwute m, n’ihi na mụ na ụmụnna[a] na-atụ anya ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ụmụnna nwoke na ụmụnna nwanyị,” ma ọ bụrụ na Pọl na-ekwu maka ìgwè ndị kwere ekwe ma ọ bụ ndị ọrụ ibe sara mbara.
    reason: lexical_alternative
lexical_decisions:
- source_word: μή τις οὖν
  choice: Ya mere, ka onye ọ bụla ghara
  rationale: “Ya mere” na-egosi njikọ nkwubi okwu nke οὖν; “ka onye ọ bụla ghara” na-enye iwu mgbochi nke μή tinyere aorist subjunctive n’Igbo dị ugbu a.
- source_word: ἐξουθενήσῃ
  choice: ileda ya anya
  rationale: Nke a bụ okwu Igbo e ji ekwu ile mmadụ anya dị ka onye na-abaghị uru ma ọ bụ onye na-enweghị ihe ọ pụtara; ọ na-eburu echiche nlelị dị na ngwaa Grik ahụ.
- source_word: προπέμψατε
  choice: nyere ya aka ka ọ gaa n’ihu
  rationale: Ngwaa ahụ na-agụnyekarị inyere onye njem aka, ịkwado ya, ma ọ bụ iziga ya ka ọ gaa n’ihu. Nsụgharị a na-egosi enyemaka maka njem, ọ bụghị nanị ịchụpụ ya ka ọ laa.
- source_word: ἐν εἰρήνῃ
  choice: n’udo
  rationale: E debere okwu ahụ n’ụzọ dị nkenke ma kwekọọ n’Igbo; n’ebe a ọ na-egosi ọpụpụ nke udo na nkwado na-adịghị egbochi ya.
- source_word: ἵνα ἔλθῃ πρός με
  choice: ka o wee bịakwute m
  rationale: “Ka o wee” na-egosi ebumnuche nke ἵνα tinyere subjunctive, ebe “bịakwute m” na-enye πρός με n’ụzọ eke n’Igbo.
- source_word: ἐκδέχομαι
  choice: ana m atụ anya
  rationale: Ụdị present nke Grik na-egosi atụmanya na-aga n’ihu; “ana m atụ anya” bụ okwu Igbo doro anya ma dị ugbu a.
- source_word: μετὰ τῶν ἀδελφῶν
  choice: na ụmụnna
  rationale: “Ụmụnna” na-edebe ihe oyiyi ezinụlọ nke ἀδελφοί ma nwee ike ịpụta ụmụ nwoke ibe mmadụ ma ọ bụ ndị kwere ekwe ibe ya dabere n’ọnọdụ. Ahịrịokwu ahụ anaghị akpọchi kpamkpam ma ụmụnna nọnyere Pọl na-atụ anya Timoti ka hà ga-eso Timoti bịa.
theological_decisions:
- issue: Ma ἀδελφῶν ọ na-ezo aka naanị n’ụmụ nwoke ka ọ bụ n’ìgwè ndị kwere ekwe ma ọ bụ ndị ọrụ ibe nke nwere ike ịgụnye ụmụ nwanyị
  choice: ụmụnna
  alternative: ụmụnna nwoke na ụmụnna nwanyị
  rationale: Aha Grik ahụ bụ masculine plural, ya mere isi ederede ejighị nkọwa sara mbara dozie ihe ọnọdụ ahụ na-ahapụghị kpamkpam. Ihe odide ala peeji na-egosi na okwu ahụ nwekwara ike ịgụnye ìgwè ndị kwere ekwe ma ọ bụ ndị ọrụ ibe sara mbara.
- issue: Njikọ nke μετὰ τῶν ἀδελφῶν
  choice: ana m atụ anya ya na ụmụnna
  alternative: mụ na ụmụnna na-atụ anya ya / ana m atụ anya ya, ya na ụmụnna
  rationale: Grik nwere ike ime ka a jụọ ma ụmụnna hà nọnyere Pọl n’atụmanya ahụ, ka hà so n’ìgwè a na-atụ anya ịbịa. E debere nhazi dị nkenke nke na-adịghị akọwa karịa ihe isi mmalite kwuru.
translation_notes:
  register: Ejiri Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. “Ileda anya” bụ okwu eke maka nlelị; “nyere ya aka ka ọ gaa n’ihu” na-eme ka echiche enyemaka njem dị na προπέμπω pụta ìhè. E tinyere akara [a] ozugbo n’ebe okwu “ụmụnna” dị, nke bụ okwu ihe odide ala peeji na-akọwa.
