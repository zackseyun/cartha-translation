revisions:
- from: Ụka dị iche iche dị n’Eshia na-ekele unu[a]. Akwịla na Priska, ha na ụka dị n’ụlọ ha, ji obi ụtọ na-ekele unu n’ime Onyenwe anyị[b].
  to: Ụka ndị dị n’Eshia na-ekele unu[a]. Akwịla na Priska[b], tinyere ụka dị n’ụlọ ha, na-ekele unu nke ukwuu n’Onyenwe anyị.
  rationale: The revision removes an unsupported qualifier from “churches,” renders πολλὰ as degree rather than as a particular emotion, improves the coordination of Aquila, Prisca, and the church in their house, and moves the name-form footnote to its proper anchor. It retains the source’s wording “in the Lord” without identifying the referent more narrowly than the text does.
