id: 1CO.16.19
reference: 1 Corinthians 16:19
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἀσπάζονται ὑμᾶς αἱ ἐκκλησίαι τῆς Ἀσίας. ⸀ἀσπάζεται ὑμᾶς ἐν κυρίῳ πολλὰ Ἀκύλας καὶ ⸀Πρίσκα σὺν τῇ κατ’ οἶκον αὐτῶν ἐκκλησίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/019.yaml
  text: The churches of Asia greet you[a]. Aquila and Prisca, together with the church in their house[b], greet you warmly in the Lord.
translation:
  language: ig
  text: Ụka ndị dị n’Eshia na-ekele unu[a]. Akwịla na Priska[b], tinyere ụka dị n’ụlọ ha, na-ekele unu nke ukwuu n’Onyenwe anyị.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Eshia” n’ebe a bụ ógbè Eshia nke Alaeze Rom, nke dị n’ọdịda anyanwụ Eshia Maịnọ; ọ bụghị kọntinent Eshia nke oge a.
    reason: cultural_note
  - marker: b
    text: Ihe odide Grik n’ebe a kpọrọ ya “Priska”; n’ebe ndị ọzọ, a kpọkwara ya “Priskila” (dịka n’Ọrụ Ndịozi 18:2, 18, 26; Ndị Rom 16:3).
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀσπάζονται / ἀσπάζεται
  choice: na-ekele / na-ekele
  rationale: N’ọnọdụ a, ἀσπάζομαι pụtara iziga ekele ma ọ bụ ikele mmadụ; “na-ekele” bụ okwu Igbo doro anya ma kwekọọ n’ụdị akwụkwọ ozi.
- source_word: αἱ ἐκκλησίαι
  choice: ụka dị iche iche
  rationale: Ọtụtụ nke ἐκκλησία na-ezo aka n’ọgbakọ ndị Kraịst n’ebe dị iche iche. “Ụka dị iche iche” na-eme ka ọtụtụ ahụ doo anya n’Igbo.
- source_word: τῆς Ἀσίας
  choice: dị n’Eshia
  rationale: Genitive Grik a na-egosi ebe ụka ndị ahụ dị. “Dị n’Eshia” bụ Igbo nkịtị; ihe “Eshia” pụtara n’akụkọ ihe mere eme kọwara n’okpuru peeji.
- source_word: ἐν κυρίῳ
  choice: n’ime Onyenwe anyị
  rationale: Nke a na-edobe okwu Pọl banyere njikọ na mmekọrịta ndị kwere ekwe nwere n’Onyenwe anyị, n’etinyeghị nkọwa karịrị ihe odide ahụ.
- source_word: πολλὰ
  choice: ji obi ụtọ
  rationale: E ji πολλὰ mee ka ekele nke abụọ sie ike. “Ji obi ụtọ” na-egosi ekele sitere n’obi n’Igbo dị ndụ, kama nsụgharị nkịtị nke ga-ada arọ.
- source_word: Ἀκύλας καὶ Πρίσκα
  choice: Akwịla na Priska
  rationale: A sụgharịrị aha ndị ahụ n’ụdị dabara n’usoro ụda na mkpopụta Igbo, ma debe Πρίσκα dị ka “Priska,” ụdị aha dị n’amaokwu a.
- source_word: σὺν τῇ κατ’ οἶκον αὐτῶν ἐκκλησίᾳ
  choice: ha na ụka dị n’ụlọ ha
  rationale: Nke a na-edobe njikọ “ha na” na echiche nke ọgbakọ dị n’ụlọ ha, n’etinyeghị okwu ọzọ na isi amaokwu na ọ bụ n’ebe ahụ ka ha na-ezukọ.
theological_decisions:
- issue: Ihe ἐκκλησία pụtara mgbe ọ dị n’ụlọ mmadụ
  choice: “Ụka dị n’ụlọ ha” bụ ọgbakọ ndị Kraịst nke dị ma na-ezukọ n’ụlọ Akwịla na Priska.
  alternative: Ịghọta ya nanị dị ka ezinụlọ ha, ma ọ bụ dị ka aha ụlọ ọrụ pụrụ iche.
  rationale: N’akwụkwọ Pọl, ἐκκλησία na-ezokarị aka n’ọgbakọ ndị kwere ekwe. κατ’ οἶκον na-egosi njikọ ya na ụlọ ha, ma okwu ahụ abụghị naanị ndị ezinụlọ.
- issue: Nsụgharị κύριος
  choice: Onyenwe anyị
  alternative: Nna ukwu
  rationale: “Onyenwe anyị” na-edobe ike nkwupụta okwukwe na mmekọrịta dị na nkebi ahịrịokwu Pọl, n’emeghị ka ihe odide ahụ kpọọ aha onye ọ na-ekwughị kpọmkwem n’ebe a.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị nsọ ma dị mfe nghọta, dee amaokwu ahụ. A hapụrụ “ụka dị n’ụlọ ha” n’ụdị dị nso n’asụsụ Grik, ebe e ji “ji obi ụtọ” gosipụta ike nke πολλὰ n’Igbo eke.
