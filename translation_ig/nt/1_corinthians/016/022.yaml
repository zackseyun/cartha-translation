review_pass:
  verdict: revise
  source_fidelity: The draft correctly renders the conditional warning, κύριον as “Onyenwe anyị,” and preserves the disputed Aramaic expression by transliteration with both principal senses in a footnote. However, “ahụghị … n’anya” can naturally suggest a completed failure to love, whereas φιλεῖ is present (“does not love”), and “ya bụrụ” is less idiomatic for the jussive force of ἤτω.
  naturalness: “Ka ọ bụrụ onye a bụrụ ọnụ” is clearer and more idiomatic Standard Igbo than “ya bụrụ onye a bụrụ ọnụ,” while retaining the solemn judicial/imprecatory register. “Anaghị ahụ … n’anya” naturally expresses an ongoing lack of love.
  terminology: “Onyenwe anyị” appropriately retains the established New Testament title “the Lord.” “Onye a bụrụ ọnụ” communicates ἀνάθεμα without imposing a more specific theological interpretation. The footnote retains the traditional loanword and explanatory sense.
  issues:
  - severity: medium
    issue: The verb phrase “ahụghị … n’anya” does not most directly reflect the present tense φιλεῖ.
    rationale: In this conditional context it may be understood as “has not loved” or as a completed negative. “Anaghị ahụ … n’anya” directly conveys “does not love.”
  - severity: low
    issue: “Ya bụrụ onye a bụrụ ọnụ” is somewhat awkward as a jussive formulation.
    rationale: “Ka ọ bụrụ onye a bụrụ ọnụ” is the more natural Standard Igbo way to express “let that person be accursed.”
  revised_text: Ọ bụrụ na onye ọ bụla anaghị ahụ Onyenwe anyị n’anya, ka ọ bụrụ onye a bụrụ ọnụ.[a] Marana tha.[b]
  revised_footnotes:
