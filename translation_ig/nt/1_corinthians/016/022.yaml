    text: Ma ọ bụ, dịka okwu ọdịnala si dị, “anatema”; ya bụ, onye nọ n’okpuru ọbụbụ ọnụ.
    reason: lexical_alternative
  - marker: b
    text: Ọ bụ okwu Arameik. Ọ pụrụ ịpụta “Onyenwe anyị, bịa!” ma ọ bụ “Onyenwe anyị abịawo.”
    reason: alternative_reading
  revision_rationale: The revision makes the present sense of φιλεῖ explicit and replaces an awkward jussive phrase with idiomatic Standard Igbo. It leaves the established title, the severe force of ἀνάθεμα, the ambiguity of Μαράνα θά, and both correctly aligned footnote anchors intact.
