  yaml_path: translation/nt/1_corinthians/016/022.yaml
  text: If anyone does not love the Lord[a], let him be accursed[b]. Marana tha.
translation:
  language: ig
  text: Ọ bụrụ na onye ọ bụla anaghị ahụ Onyenwe anyị n’anya, ka ọ bụrụ onye a bụrụ ọnụ.[a] Marana tha.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, dịka okwu ọdịnala si dị, “anatema”; ya bụ, onye nọ n’okpuru ọbụbụ ọnụ.
    reason: lexical_alternative
  - marker: b
    text: Ọ bụ okwu Arameik. Ọ pụrụ ịpụta “Onyenwe anyị, bịa!” ma ọ bụ “Onyenwe anyị abịawo.”
    reason: alternative_reading
lexical_decisions:
- source_word: φιλεῖ
  choice: ahụghị … n’anya
  rationale: Akpaalaokwu Igbo a na-egosi ịhụ mmadụ n’anya nke ọma, ma na-echekwa echiche nke ịhụ Onyenwe anyị n’anya n’onwe ya n’etinyeghị nkọwa mmetụta uche karịrị ihe okwu Grik kwuru.
- source_word: κύριον
  choice: Onyenwe anyị
  rationale: N’ebe a, κύριος bụ aha nsọpụrụ e ji kpọọ Jizọs. “Onyenwe anyị” bụ okwu Igbo doro anya nke na-echekwa ibu aha ahụ na ojiji ya n’Agba Ọhụrụ.
- source_word: ἤτω
  choice: ya bụrụ
  rationale: Ụdị iwu nke εἰμί ebe a nwere ike nke ikpe ma ọ bụ nkwupụta ọchịchọ. “Ya bụrụ” na-egosipụta ike ahụ n’Igbo n’enweghị ịgbanwe ya ka ọ bụrụ nanị nkwupụta nkịtị.
- source_word: ἀνάθεμα
  choice: onye a bụrụ ọnụ
  rationale: ἀνάθεμα na-egosi onye nọ n’okpuru ọbụbụ ọnụ ma ọ bụ onye e debere maka mbibi. Nsụgharị a doro ndị na-agụ Igbo taa anya ma na-echekwa ịdị arọ nke ịdọ aka ná ntị ahụ.
- source_word: Μαράνα θά
  choice: Marana tha
  rationale: Nke a bụ okwu Arameik e dere n’ mkpụrụedemede Grik. Idegharị ụda ya n’ahịrị bụ isi na-echekwa ọdịdị okwu ahụ ma ghara ikpebi otu n’ime nkọwa ya ndị a na-arụrịta ụka.
theological_decisions:
- issue: Ihe okwu Arameik Μαράνα θά pụtara
  choice: 'Idowe ya dịka ntụgharị mkpụrụedemede n’ahịrị bụ isi: “Marana tha.”'
  alternative: “Onyenwe anyị, bịa!” ma ọ bụ “Onyenwe anyị abịawo.”
  rationale: Nkewa na nghọta okwu Arameik ahụ nwere ụzọ abụọ a ma ama. Idowe ụdị okwu ahụ ma kọwaa nhọrọ abụọ ahụ n’ala peeji na-echekwa mgbagwoju anya dị n’ihe àmà asụsụ mbụ kama ikpebi ya n’enweghị nkwado zuru ezu.
translation_notes:
  register: E ji asụsụ Igbo ọkọlọtọ, dị ùgwù ma dị mfe nghọta mee ihe. “Ahụghị … n’anya” bụ akpaalaokwu Igbo nkịtị; “ya bụrụ onye a bụrụ ọnụ” na-echekwa ụda ikpe siri ike nke amaokwu ahụ. E tinyere akara ala peeji [a] n’akụkụ ἀνάθεμα na [b] n’akụkụ okwu Arameik kwekọrọ n’ihe nkọwa nke ọ bụla kwuru.
