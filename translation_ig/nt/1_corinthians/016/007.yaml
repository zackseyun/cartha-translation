id: 1CO.16.7
reference: 1 Corinthians 16:7
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οὐ θέλω γὰρ ὑμᾶς ἄρτι ἐν παρόδῳ ἰδεῖν, ἐλπίζω ⸀γὰρ χρόνον τινὰ ἐπιμεῖναι πρὸς ὑμᾶς, ἐὰν ὁ κύριος ⸀ἐπιτρέψῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/007.yaml
  text: For I do not want to see you now in passing[a], for I hope to remain with you for some time, if the Lord permits.
translation:
  language: ig
  text: N’ihi na achọghị m ịhụ unu ugbu a mgbe m na-agafe; n’ihi na enwere m olileanya na mụ na unu ga-anọ oge ụfọdụ, ma ọ bụrụ na Onyenwe anyị ekwe.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐ θέλω
  choice: achọghị m
  rationale: Nke a na-egosi ọchịchọ na ebumnuche Pọl n’ụzọ Igbo dị mfe, ọ bụghị nkwupụta siri ike banyere ikike ime ihe.
- source_word: ἄρτι
  choice: ugbu a
  rationale: Ọ na-akọwa oge dị ugbu a nkenke ma doo anya.
- source_word: ἐν παρόδῳ
  choice: naanị mgbe m na-agafe
  rationale: Ọ na-egosi nleta dị mkpirikpi mgbe onye ahụ na-aga ebe ọzọ; ‘naanị’ na-eme ka ọdịiche dị n’etiti ngafe na ịnọ ogologo oge pụta ìhè.
- source_word: ἰδεῖν
  choice: ịhụ
  rationale: Nke a na-edobe isi ihe ngwaa Grik ahụ pụtara, ebe ọnọdụ okwu ahụ ka na-eme ka a ghọta na ọ bụ ileta ha.
- source_word: ἐλπίζω
  choice: enwere m olileanya
  rationale: Ọ na-egosi atụmanya na ọchịchọ na-enweghị ikwu na ihe ahụ aghaghị ime.
- source_word: χρόνον τινά
  choice: ruo oge ụfọdụ
  rationale: Ọ na-egosi oge a na-akọwaghị kpọmkwem ma nke na-abụghị naanị nleta ngafe.
- source_word: ἐπιμεῖναι
  choice: ịnọnyere
  rationale: Ọ na-egosi ịnọgide n’ebe ahụ, ọ bụghị naanị ịbịa hụ ha obere oge.
- source_word: πρὸς ὑμᾶς
  choice: unu
  rationale: N’ime ‘ịnọnyere unu,’ nsụgharị a na-egosi ịnọ n’ụlọ ọrụ na mmekọrịta ha n’ụzọ Igbo nkịtị.
- source_word: ἐὰν ὁ κύριος ἐπιτρέψῃ
  choice: ma ọ bụrụ na Onyenwe anyị ekwe
  rationale: Ọ na-edobe ahịrịokwu ọnọdụ ahụ na nkwenye na ihe a ga-eme dabere n’ikike Onyenwe anyị.
- source_word: κύριος
  choice: Onyenwe anyị
  rationale: Nke a bụ aha nsọ a na-ejikarị akọwa κύριος n’Igbo ma ghara ịkọwapụta karịa ihe ederede Grik kwuru.
theological_decisions:
- issue: Onye okwu ahụ bụ ‘Onyenwe anyị’ na-ezo aka na ya
  choice: A hapụrụ ya dịka ‘Onyenwe anyị’ n’akọwaghị ma ọ bụ Jizọs ka ọ bụ Chineke Nna.
  alternative: ‘Onyenwe anyị Jizọs’ ma ọ bụ ‘Chineke’
  rationale: Ederede Grik kwuru naanị κύριος, ya mere ịgbakwunye onye a kapịrị ọnụ ga-ewepụ oghere ihe ederede ahụ hapụrụ.
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E debere mmegharị ‘n’ihi na ... n’ihi na’ nke na-egosipụta njikọ abụọ γάρ, ebe ahịrịokwu ahụ ka na-ada nke ọma n’Igbo.
