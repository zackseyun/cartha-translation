  yaml_path: translation/nt/1_corinthians/016/009.yaml
  text: For a great and effective door has opened to me[a], and there are many opponents.
translation:
  language: ig
  text: N’ihi na e megheere m nnukwu ọnụ ụzọ dị ukwuu ma dị irè, ma ndị na-emegide dị ọtụtụ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “e megheere m nnukwu ohere dị ukwuu ma dị irè.” Pọl ji “ọnụ ụzọ” mee ihe atụ nke ohere e nyere ya ịrụ ọrụ ozi.
    reason: lexical_alternative
lexical_decisions:
- source_word: θύρα
  choice: ọnụ ụzọ
  rationale: Ọ pụtara ‘ọnụ ụzọ’ n'ụzọ nkịtị, ma n'ebe a ọ bụ ihe atụ nke ohere e meghere maka ozi. Idowe ‘ọnụ ụzọ’ na-echekwa ihe atụ dị n'okwu Grik.
- source_word: γάρ
  choice: N’ihi na
  rationale: Ọ na-enye ihe kpatara atụmatụ Pọl kwuru n'amaokwu ndị gbara ya gburugburu.
- source_word: μοι
  choice: m
  rationale: N'usoro ‘e megheere m,’ ọ na-egosi onye e meere oghere ahụ, ma na-ada nke ọma n'Igbo.
- source_word: ἀνέῳγεν
  choice: e megheere
  rationale: Oge perfect ahụ na-egosi na e meghere ọnụ ụzọ ahụ, ọ ka ghekwara oghe. Nsụgharị a anaghị ekpebi onye meghere ya, dịka isiokwu Grik ekwughị onye mere ya.
- source_word: μεγάλη
  choice: nnukwu
  rationale: ‘Nnukwu’ na-egosi ịdị ukwuu ma ọ bụ mkpa nke oghere ahụ, ma na-adabara ihe atụ nke ọnụ ụzọ.
- source_word: ἐνεργής
  choice: nke ọrụ ga-amị mkpụrụ
  rationale: N'ọnọdụ a, okwu ahụ na-egosi na oghere ahụ nwere ike ịrụpụta ihe ma ọ bụ ịmị mkpụrụ n'ozi. Nkebiokwu a na-eme ka echiche ahụ doo onye Igbo nke oge a anya n'enweghị itinye echiche otu ụka.
- source_word: ἀντικείμενοι
  choice: ndị na-emegide m
  rationale: Participle ahụ na-arụ ọrụ dịka aha maka ndị na-eguzogide Pọl na ọrụ ya. Nke a bụ okwu Igbo doro anya ma dị ndụ.
- source_word: πολλοί
  choice: dị ọtụtụ
  rationale: Ọ na-enye kpọmkwem echiche nke ịdị ọtụtụ.
theological_decisions:
- issue: ‘Ọnụ ụzọ’ dịka ihe atụ nke ohere maka ozi
  choice: E debere ihe atụ ahụ dịka ‘ọnụ ụzọ.’
  alternative: ‘E mepeere m nnukwu ohere dị irè.’
  rationale: Isiokwu Grik ji ‘ọnụ ụzọ’ mee ihe atụ. Idowe ya na-echekwa onyonyo Pọl ji kwuo okwu, ebe nkọwa ala peeji na-eme ka ihe ọ pụtara n'ọnọdụ a doo anya.
translation_notes:
  register: Standard Igbo; asụsụ dị ugbu a, kwụ ọtọ ma dị ùgwù. A hapụrụ ihe atụ ‘ọnụ ụzọ,’ ma kọwaa ike ịrụpụta ihe nke ἐνεργής n'ụzọ eke dịka ‘ọrụ ga-amị mkpụrụ.’
