  text: ἡ ἀγάπη μου μετὰ πάντων ὑμῶν ἐν Χριστῷ ⸀Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/024.yaml
  text: My love be with all of you in Messiah Jesus[a].
translation:
  language: ig
  text: Ka ịhụnanya m dịnyere unu niile n’ime Mezaịa Jizọs.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ: “Kraịst Jizọs.” Okwu Grik bụ Χριστός, utu aha nke pụtara Mezaịa, ya bụ Onye E Tere Mmanụ.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἡ ἀγάπη μου
  choice: ịhụnanya m
  rationale: “Ịhụnanya” bụ okwu Igbo doro anya ma kwekọọ n’ἀγάπη; “m” na-egosi na ọ bụ ịhụnanya Pọl n’onwe ya.
- source_word: μετὰ πάντων ὑμῶν
  choice: dịnyere unu niile
  rationale: Μετά na genitive pụtara ịnọnyere mmadụ. “Dịnyere unu niile” na-egosipụta nke a n’Igbo dị mma ma na-edobe na ọ gụnyere ndị niile a na-agwa okwu.
- source_word: ἐν
  choice: n’ime
  rationale: “N’ime” na-edobe okwu Pọl banyere ịdị n’ime ma ọ bụ n’okirikiri nke Mezaịa, n’enweghị ịkọwa ya karịa ihe Grik kwuru.
- source_word: Χριστῷ Ἰησοῦ
  choice: Mezaịa Jizọs
  rationale: Χριστός bụ utu aha nke pụtara Mezaịa, ya bụ Onye E Tere Mmanụ. “Mezaịa Jizọs” na-eme ka uru utu aha ahụ pụta ìhè; “Kraịst Jizọs” bụkwa nsụgharị ọdịnala.
theological_decisions:
- issue: Otu e si ghọta ahịrịokwu ngọzi a nke na-enweghị ngwaa n’asụsụ Grik
  choice: Ka ịhụnanya m dịnyere unu niile
  alternative: Ịhụnanya m dịnyere unu niile
  rationale: Grik ekwughị kpọmkwem ma nke a bụ ọchịchọ/ngọzi ka ọ bụ nkwupụta. “Ka ... dịnyere” dabara n’olu mmechi akwụkwọ ozi, ma a ka na-ekwupụta na ihe ọzọ ga-ekwe omume.
- issue: Nsụgharị Χριστός n’usoro okwu ἐν Χριστῷ Ἰησοῦ
  choice: Mezaịa Jizọs
  alternative: Kraịst Jizọs
  rationale: “Mezaịa” na-eme ka Χριστός bụrụ utu aha nwere ihe ọ pụtara, ebe “Kraịst” bụ ụdị ọdịnala nke aghọwokwa ihe yiri aha n’Igbo. Ihe odide bụ isi họọrọ Mezaịa ma tinye nke ọzọ n’okpuru peeji.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe ma dị ugwu. “Ka ... dịnyere” na-enye ahịrịokwu ahụ ụda ngọzi mmechi; “unu niile” na-edobe oke πάντων ὑμῶν.
