  text: ὁ δὲ νόμος οὐκ ἔστιν ἐκ πίστεως, ἀλλ’· Ὁ ποιήσας ⸀αὐτὰ ζήσεται ἐν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/012.yaml
  text: But the law is not from faith[a]; rather[b], “The one who does them will live by them.”
translation:
  language: ig
  text: Ma iwu ahụ esiteghị n'okwukwe; kama, “Onye na-eme ihe ndị ahụ ga-adị ndụ site na ha.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ga-adị ndụ n'ime ha.”
    reason: lexical_alternative
  - marker: b
    text: Okwu e hotara na Levitikọs 18:5.
    reason: cross_reference
lexical_decisions:
- source_word: νόμος
  choice: iwu ahụ
  rationale: ‘Iwu ahụ’ bụ ụzọ Igbo si egosi iwu a maara ama, ma na-ahapụ iwu Mosis ka ihe gbara amaokwu ahụ gburugburu mee ka ọ pụta ìhè.
- source_word: ἐκ πίστεως
  choice: esiteghị n'okwukwe
  rationale: Nke a na-edobe okwu mbido/source nke ἐκ na ọdịiche Pọl mere n'etiti iwu na okwukwe, n'ejighị nkọwa sara mbara dochie ya.
- source_word: πίστεως
  choice: okwukwe
  rationale: ‘Okwukwe’ bụ okwu Igbo a na-ahụkarị maka πίστις ebe a, ma na-egosi ụkpụrụ nke ikwere.
- source_word: ἀλλὰ
  choice: kama
  rationale: ‘Kama’ na-egosi ntụgharị dị nkọ gaa n'okwu Akwụkwọ Nsọ nke e hotara.
- source_word: ὁ ποιήσας
  choice: onye na-eme
  rationale: Ọ na-edobe onye ọbụla n'ozuzu nke participle ahụ ma bụrụkwa Igbo dị ndụ ma doo anya.
- source_word: αὐτά
  choice: ihe ndị ahụ
  rationale: Nke a na-edobe nnọchiaha ahụ n'ụzọ doro anya, na-ezo aka n'ihe iwu nyere n'iwu n'emeghị ka nkọwa ya karịa nke Grik.
- source_word: ζήσεται
  choice: ga-adị ndụ
  rationale: Nke a na-egosipụta future ahụ n'Igbo nke oge a ma na-edobe ịdị arọ nke okwu e hotara.
- source_word: ἐν αὐτοῖς
  choice: ga-esite na ha dị ndụ
  rationale: N'okwu a, ‘site na ha’ na-egosi ụzọ ma ọ bụ ihe ndabere nke ndụ ahụ, ma a na-edobe ntụgharị nkịtị ‘n'ime ha’ n'okpuru peeji.
theological_decisions:
- issue: Ọdịiche Pọl mere n'etiti iwu na okwukwe
  choice: “Iwu ahụ esiteghị n'okwukwe” na-edobe antithesis ahụ n'ụzọ dị nso na Grik.
  alternative: “Iwu ahụ adabereghị n'okwukwe” ma ọ bụ “iwu ahụ anaghị arụ ọrụ n'ụkpụrụ okwukwe.”
  rationale: Nhọrọ a anaghị eme ka esemokwu nkà mmụta okpukpe dị n'okwu Pọl dị nro, ọ naghịkwa tinye nkọwa nke otu okpukpe n'ime amaokwu ahụ.
translation_notes:
  register: Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E tinyere akara ụkwụ [a] na [b] n'isiokwu ahụ, ozugbo e hotachara okwu metụtara ha.
