id: GAL.3.7
reference: Galatians 3:7
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Γινώσκετε ἄρα ὅτι οἱ ἐκ πίστεως, οὗτοι ⸂υἱοί εἰσιν⸃ Ἀβραάμ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/007.yaml
  text: Know, then, that those of faith—these are Abraham’s sons.
translation:
  language: ig
  text: Ya mere, maranụ na ndị sitere n’okwukwe—ndị a bụ ụmụ Ebreham.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Γινώσκετε
  choice: maranụ
  rationale: Okwu iwu dị n'ụdị ọtụtụ; ọ na-akpọ ndị na-agụ akwụkwọ ka ha mata ma ghọta eziokwu a.
- source_word: ἄρα
  choice: Ya mere
  rationale: Na-egosi nkwubi okwu Pọl sitere n'ihe o kwuru tupu amaokwu a.
- source_word: οἱ ἐκ πίστεως
  choice: ndị sitere n’okwukwe
  rationale: Na-edobe ihe owuwu na obosara nke okwu Grik ahụ, nke na-akọwa ndị okwukwe bụ isi njirimara ha, n'etinyeghị ihe ọzọ na-adịghị na isi mmalite.
- source_word: οὗτοι
  choice: ndị a
  rationale: 'Na-egosipụta nkwusi ike doro anya dị n''okwu Grik: ọ bụ ndị a kpọmkwem.'
- source_word: υἱοί
  choice: ụmụ
  rationale: N'ọnọdụ a, okwu ahụ na-egosi ụmụ ma ọ bụ ndị sitere n'agbụrụ Ebreham n'ụzọ njirimara; 'ụmụ' bụ okwu Igbo e ji akọwa otu ahụ n'ụzọ ebumpụta ụwa ma ghara ime ka ọ bụrụ naanị ụmụ nwoke.
- source_word: Ἀβραάμ
  choice: Ebreham
  rationale: Ụdị aha a bụ nke a maara nke ọma n'asụsụ Igbo.
theological_decisions:
- issue: Ihe 'ụmụ Ebreham' pụtara
  choice: E debere okwu ahụ dịka 'ụmụ Ebreham' n'ebughị ụzọ kọwaa ma ọ bụ belata ya.
  alternative: ndị nketa Ebreham; ụmụ ime mmụọ nke Ebreham
  rationale: Isi mmalite kpọrọ ha 'ụmụ' ma hapụ ihe oyiyi nke njikọ ezinụlọ ahụ ka ọ rụọ ọrụ n'okwu Pọl; ịgbakwunye 'ime mmụọ' ma ọ bụ dochie ya na 'ndị nketa' ga-akọwa karịa ihe amaokwu a kwuru.
translation_notes:
  register: 'Igbo ọkọlọtọ, dị ùgwù ma dị mfe nghọta. Akara ogologo ahụ na-edobe nkwusi ike nke οὗτοι: ''ndị a bụ ụmụ Ebreham.'''
