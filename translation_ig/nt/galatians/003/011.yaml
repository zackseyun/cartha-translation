    issue: The words “e dere” have been added before the quotation.
    rationale: The SBLGNT text moves directly from ὅτι (“because”) into the quotation; it does not contain γέγραπται or an equivalent introductory formula. Removing it avoids adding source content.
  - severity: medium
    issue: The Habakkuk cross-reference note is attached to “iwu,” and the lexical-alternative note is attached to the whole quotation rather than specifically to “okwukwe.”
    rationale: The cross-reference should anchor the quotation from Habakkuk 2:4, while the lexical note should anchor the rendering of πίστις/“okwukwe.” Correct placement makes each note’s referent unambiguous.
