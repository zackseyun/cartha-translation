- from: O doro anya na ọ dịghị onye a na-agụ dị ka onye ezi omume n’ihu Chineke site n’iwu[a], n’ihi na e dere, “Onye ezi omume ga-adị ndụ site n’okwukwe.”[b]
  to: O doro anya na ọ dịghị onye a na-agụ n’onye ezi omume n’ihu Chineke site n’iwu, n’ihi na “Onye ezi omume ga-adị ndụ site n’okwukwe[b].”[a]
  rationale: The revision removes the unsupported introductory phrase “e dere,” retains the Greek ambiguity and forensic sense of justification, and relocates both footnote anchors to the material each note explains. The slight adjustment from “dị ka onye ezi omume” to “n’onye ezi omume” gives a more idiomatic Standard Igbo expression for being reckoned/declared righteous.
