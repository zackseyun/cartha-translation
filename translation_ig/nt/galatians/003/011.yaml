  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὅτι δὲ ἐν νόμῳ οὐδεὶς δικαιοῦται παρὰ τῷ θεῷ δῆλον, ὅτι Ὁ δίκαιος ἐκ πίστεως ζήσεται,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/011.yaml
  text: It is evident that no one is justified before God by the law[b][a], because "The righteous will live by faith."
translation:
  language: ig
  text: O doro anya na ọ dịghị onye a na-agụ n’onye ezi omume n’ihu Chineke site n’iwu, n’ihi na “Onye ezi omume ga-adị ndụ site n’okwukwe[b].”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Pọl na-ehota Habakọk 2:4.
    reason: cross_reference
  - marker: b
    text: A pụkwara ịsụ ya, “Onye ezi omume ga-adị ndụ site n’ikwesị ntụkwasị obi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι δὲ
  choice: O doro anya na
  rationale: A naghị atụgharị δέ dị ka okwu oge; a na-egosipụta ntụgharị dị nro n’arụmụka site n’usoro ahịrịokwu Igbo.
- source_word: ἐν νόμῳ
  choice: site n’iwu
  rationale: N’ebe a, ἐν νόμῳ na-egosi ụzọ e si achọ ka a gụọ mmadụ n’onye ezi omume; ‘site n’iwu’ bụ Igbo doro anya ma kwekọọ n’arụmụka ikpe.
- source_word: οὐδεὶς
  choice: ọ dịghị onye
  rationale: Nke a na-echekwa nkwụsi ike nke nkwulu zuru ụwa ọnụ n’asụsụ Igbo nkịtị.
- source_word: δικαιοῦται
  choice: a na-agụ dị ka onye ezi omume
  rationale: Nhọrọ a na-egosipụta ọrụ ikpe nke ngwaa ahụ—ikwu ma ọ bụ ịgụ mmadụ n’onye ezi omume—na-enweghị ime ka ọ bụrụ mgbanwe omume n’ime mmadụ.
- source_word: παρὰ τῷ θεῷ
  choice: n’ihu Chineke
  rationale: Ọ na-egosi ọnọdụ mmadụ n’ebe ikpe Chineke dị ma na-echekwa ụda ụlọikpe nke okwu Grik ahụ.
- source_word: δῆλον
  choice: O doro anya
  rationale: Nke a bụ okwu Igbo eke maka nkwupụta doro anya n’arụmụka.
- source_word: Ὁ δίκαιος
  choice: Onye ezi omume
  rationale: Ọ na-echekwa adjective e ji mee aha mmadụ ma na-ada nke ọma n’Igbo.
- source_word: ἐκ πίστεως
  choice: site n’okwukwe
  rationale: ‘Okwukwe’ bụ isi ntụgharị πίστις ebe a; ‘site na’ na-echekwa njikọ ἐκ n’ụzọ Igbo ghọtara nke ọma. A na-edebe ‘ikwesị ntụkwasị obi’ dị ka ihe ọzọ na nkọwa ala peeji.
- source_word: ζήσεται
  choice: ga-adị ndụ
  rationale: Ọ na-echekwa ọdịnihu nke ngwaa ahụ n’Igbo nke oge a.
theological_decisions:
- issue: Otu e si ghọta Ὁ δίκαιος ἐκ πίστεως ζήσεται
  choice: Onye ezi omume ga-adị ndụ site n’okwukwe
  alternative: Onye ezi omume ga-adị ndụ site n’ikwesị ntụkwasị obi; ma ọ bụ, Onye a na-agụ dị ka onye ezi omume site n’okwukwe ga-adị ndụ
  rationale: Isi ederede na-edebe nkewa ahịrịokwu kacha mfe ma na-atụgharị πίστις dị ka ‘okwukwe.’ Ebe okwu ahụ nwekwara ike ịpụta ‘ikwesị ntụkwasị obi,’ a na-edebe nke ahụ n’ala peeji kama idozi esemokwu nkọwa ahụ n’ime isi ederede.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. A họọrọ ‘a na-agụ dị ka onye ezi omume’ iji mee ka echiche ikpe dị na δικαιοῦται pụta ìhè. Akara nkọwa ala peeji niile dị n’isi ederede, nke ọ bụla nọ n’ebe okwu ọ na-akọwa dị.
