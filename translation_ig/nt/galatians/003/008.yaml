language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: προϊδοῦσα δὲ ἡ γραφὴ ὅτι ἐκ πίστεως δικαιοῖ τὰ ἔθνη ὁ θεὸς προευηγγελίσατο τῷ Ἀβραὰμ ὅτι Ἐνευλογηθήσονται ἐν σοὶ πάντα τὰ ἔθνη.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/008.yaml
  text: 'And the Scripture[a], foreseeing that God justifies the nations by faith[b], proclaimed the good news beforehand to Abraham: “In you all the nations will be blessed.”'
translation:
  language: ig
  text: Ma Akwụkwọ Nsọ, ebe ọ buru ụzọ hụ na Chineke na-agụ mba niile[a] dịka ndị ezi omume site n'okwukwe, buru ụzọ zisaara Abraham ozi ọma[b], sị, “N'ime gị ka a ga-agọzi mba niile.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị “mba niile” dịka “ndị mba ọzọ.” Okwu Grik ἔθνη nwere ike ịpụta “mba” ma ọ bụ “ndị mba ọzọ.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “buru ụzọ kwusaara Abraham ozi ọma.”
    reason: lexical_alternative
lexical_decisions:
- source_word: προϊδοῦσα
  choice: buru ụzọ hụ
  rationale: Nke a na-egosi ịhụ ihe tupu oge ya, ma na-adị mfe ma bụrụkwa okwu Igbo nkịtị.
- source_word: ἡ γραφή
  choice: Akwụkwọ Nsọ
  rationale: N'ebe a, okwu ahụ na-anọchi anya Akwụkwọ Nsọ n'onwe ya, bụ́ nke e mere ka ọ dị ka onye na-ahụ ma na-ekwusa.
- source_word: ἐκ πίστεως
  choice: site n'okwukwe
  rationale: Ọ na-egosi okwukwe dịka ụzọ ma ọ bụ ntọala Chineke ji agụ mmadụ dị ka onye ezi omume.
- source_word: δικαιοῖ
  choice: ga-agụ ... dị ka ndị ezi omume
  rationale: Nhọrọ a na-egosipụta echiche ikpe nke ngwaa ahụ n'enweghị ịkọwa ya dịka mgbanwe omume n'ime mmadụ. Oge ọdịnihu dị n'Igbo dabara n'ihe Akwụkwọ Nsọ buru ụzọ hụ, ọ bụ ezie na ngwaa Grik dị n'oge ugbu a.
- source_word: τὰ ἔθνη ... πάντα τὰ ἔθνη
  choice: mba dị iche iche ... mba niile
  rationale: Ọ na-edobe njikọ okwu dị n'etiti okwu Pọl na nkwa e nyere Abraham, ma ihe odide ala peeji na-echekwa ihe ọzọ okwu Grik ahụ nwere ike ịpụta.
- source_word: προευηγγελίσατο
  choice: buru ụzọ kwusara ... ozi ọma
  rationale: Ọ na-edobe ma echiche izi ozi ọma ma echiche na e mere ya tupu oge ahụ.
- source_word: τῷ Ἀβραὰμ
  choice: Abraham
  rationale: Aha onye a na ihe onye natara ozi ahụ pụtara nke ọma n'usoro ahịrịokwu Igbo.
- source_word: Ἐνευλογηθήσονται
  choice: ka a ga-agọzi
  rationale: Ọ na-edobe ọdịnihu na olu nnara nke ngwaa Grik ahụ, n'ekwughị kpọmkwem onye ga-agọzi ha.
- source_word: ἐν σοὶ
  choice: N'ime gị
  rationale: Nsụgharị a na-esochi preposition Grik ahụ nso ma na-echekwa asụsụ nkwa ahụ n'enweghị ịkọwa kpọmkwem otú ngọzi ahụ ga-esi bịa.
theological_decisions:
- issue: Ma a ga-asụgharị ἔθνη dịka “mba dị iche iche” ka ọ bụ “ndị mba ọzọ”
  choice: “mba dị iche iche” na “mba niile”
  alternative: “ndị mba ọzọ” na “mba niile”
  rationale: Iji okwu metụtara mba n'ebe abụọ ahụ na-eme ka njikọ dị n'etiti izi ezi site n'okwukwe na nkwa Abraham pụta ìhè, ebe ihe odide ala peeji na-echekwa nghọta nke “ndị mba ọzọ.”
- issue: Ụdị izi ezi δικαιοῖ na-egosi
  choice: “agụ ... dị ka ndị ezi omume”
  alternative: “eme ... ka ha bụrụ ndị ezi omume”
  rationale: Nhọrọ a na-echekwa ụda ikpe nke okwu ahụ n'akwụghị na okwu ahụ na-ekwu naanị banyere nkwupụta ikpe ma ọ bụ mgbanwe ime mmụọ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E kewara participle mbụ na isi ahịrịokwu ka okwu ahụ daa nke ọma n'Igbo, ma personification nke Akwụkwọ Nsọ ka echekwara. E tinyere akara ihe odide ala peeji n'akụkụ okwu ha na-akọwa.
