id: GAL.3.2
reference: Galatians 3:2
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τοῦτο μόνον θέλω μαθεῖν ἀφ’ ὑμῶν, ἐξ ἔργων νόμου τὸ πνεῦμα ἐλάβετε ἢ ἐξ ἀκοῆς πίστεως;
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/002.yaml
  text: 'This only I want to learn from you: did you receive the Spirit by works of the law[b][a], or by hearing with faith?'
translation:
  language: ig
  text: 'Achọrọ m ịmata naanị nke a n’aka unu: unu natara Mmụọ ahụ site n’ọrụ nke iwu, ka ọ bụ site n’ịnụ ihe ahụ na inwe okwukwe?[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “site n’ịnụ nke okwukwe”; okwu Grik ahụ nwekwara ike ịpụta ịnụ ozi ahụ n’okwukwe.
    reason: alternative_reading
  - marker: b
    text: N’ebe a, o yikarịghị ka “okwukwe” ọ pụtara “ikwesị ntụkwasị obi,” ma ụfọdụ na-atụle nghọta ahụ n’ihi na e jikọtara okwu Grik ndị a ọnụ n’ụzọ dị mkpụmkpụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο μόνον
  choice: Ọ bụ naanị ihe a
  rationale: Na-edobe nrụgide Pọl tinyere n’ihu ahịrịokwu ahụ ma na-ada nke ọma n’Igbo.
- source_word: θέλω μαθεῖν
  choice: ka m chọrọ ịmụta
  rationale: Na-egosipụta θέλω na μαθεῖν kpọmkwem, ma na-edobe ụda ajụjụ nke onye chọrọ ka ndị na-ege ya zaa.
- source_word: ἀφ’ ὑμῶν
  choice: n’aka unu
  rationale: Nke a bụ ụzọ Igbo si ekwu ‘site n’aka unu,’ ma ‘unu’ na-egosipụta na ọ bụ ọtụtụ mmadụ.
- source_word: ἐξ ἔργων νόμου
  choice: site n’ọrụ iwu
  rationale: Na-edobe okwu Pọl dị mkpụmkpụ ma ghara ịgbakwunye nkọwa banyere ụdị iwu ọ bụ ebe Grik ekwughị ya n’ụzọ doro anya.
- source_word: τὸ πνεῦμα
  choice: Mmụọ ahụ
  rationale: Isi mkpụrụedemede na-egosi na ihe a na-ekwu maka ya bụ Mmụọ Chineke; etinyeghị ‘Nsọ’ n’ihi na okwu ahụ adịghị na Grik.
- source_word: ἐλάβετε
  choice: unu natara
  rationale: Oge gara aga dabara na aorist ahụ na ajụjụ Pọl banyere ahụmahụ ha nwetarala.
- source_word: ἐξ ἀκοῆς πίστεως
  choice: site n’ịnụ ihe ahụ na inwe okwukwe
  rationale: Na-enye Igbo dị mfe nghọta maka njikọ Grik ahụ e kpokọtara ọnụ, ma ihe ndị ọzọ okwu ahụ pụrụ ịpụta ka edobere n’akụkụ nkọwa.
- source_word: πίστεως
  choice: okwukwe
  rationale: ‘Okwukwe’ bụ ntụgharị nkịtị na nke dabara n’ebe a; echiche ‘ikwesị ntụkwasị obi’ ka a kpọtụrụ n’akụkụ nkọwa dịka nke na-adịchaghị mfe ịbụ ihe e bu n’obi.
theological_decisions:
- issue: Ihe τὸ πνεῦμα na-ezo aka na ya
  choice: Mmụọ Chineke nke ndị kwere ekwe natara
  alternative: Ahụmahụ ime mmụọ ma ọ bụ ike ime mmụọ n’ozuzu
  rationale: Ihe ndị gbara amaokwu a gburugburu na Ndị Galeshia 3 na-ekwu maka nnata Mmụọ Chineke; ya mere edere ‘Mmụọ’ n’isi mkpụrụedemede, ma etinyeghị okwu ‘Nsọ’ nke na-adịghị na Grik.
- issue: Mmekọrịta dị n’etiti ἀκοῆς na πίστεως
  choice: ịnụ ozi ahụ na inwe okwukwe
  alternative: ịnụ nke sitere n’okwukwe; ma ọ bụ ịnụ banyere okwukwe
  rationale: Genitive Grik ahụ dị mkpụmkpụ ma nwee nghọta karịrị otu. Isi ntụgharị na-enye nghọta kacha kwekọọ na ọdịiche dị n’etiti ọrụ iwu na nzaghachi okwukwe, ebe nkọwa [a] na-echekwa mgbagwoju anya ahụ.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. A hapụrụ ajụjụ Pọl ka ọ bụrụ nke kpọmkwem ma sie ike; e zere okwu ụka pụrụ iche na nkọwa agbakwunyere na-adịghị na isi mmalite.
