- from: 'Ọ bụ naanị ihe a ka m chọrọ ịmụta n’aka unu: unu natara Mmụọ ahụ site n’ọrụ iwu, ka ọ bụ site n’ịnụ ihe ahụ na inwe okwukwe?[a][b]'
  to: 'Achọrọ m ịmata naanị nke a n’aka unu: unu natara Mmụọ ahụ site n’ọrụ nke iwu, ka ọ bụ site n’ịnụ ihe ahụ na inwe okwukwe?[a][b]'
  rationale: The revision improves idiomatic Igbo at the opening and makes the genitive relationship in “works of the law” explicit. It retains the draft’s cautious, intelligible rendering of the compressed phrase ἐξ ἀκοῆς πίστεως and retains both notes to preserve the relevant ambiguity and lexical alternative.
