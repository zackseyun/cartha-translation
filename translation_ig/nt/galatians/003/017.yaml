id: GAL.3.17
reference: Galatians 3:17
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τοῦτο δὲ λέγω· διαθήκην προκεκυρωμένην ὑπὸ τοῦ ⸀θεοῦ ὁ μετὰ ⸂τετρακόσια καὶ τριάκοντα ἔτη⸃ γεγονὼς νόμος οὐκ ἀκυροῖ, εἰς τὸ καταργῆσαι τὴν ἐπαγγελίαν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/017.yaml
  text: 'This is what I mean: the law[a], which came four hundred and thirty years later, does not invalidate a covenant previously ratified by God[b], so as to abolish the promise.'
translation:
  language: ig
  text: 'Ihe m na-ekwu bụ nke a: Iwu ahụ, nke bịara mgbe afọ narị anọ na iri atọ gasịrị, anaghị akagbu ọgbụgba ndụ Chineke kwadoro na mbụ[a], iji mee ka nkwa ahụ ghara ịdị irè[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “anaghị eme ka ọgbụgba ndụ ahụ ghara ịdị irè.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “iji si otú ahụ kagbuo nkwa ahụ” ma ọ bụ “mee ka nkwa ahụ ghara ịrụ ọrụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο δὲ λέγω
  choice: Ihe m na-ekwu bụ nke a
  rationale: Ọ bụ ụzọ Igbo sitere n'okike e si webata nkọwa Pọl, ma ọ naghị atụkwasị okwu oge dịka “ugbu a” nke na-adịghị na Grik.
- source_word: διαθήκην
  choice: ọgbụgba ndụ
  rationale: N'okwu gbara amaokwu a gburugburu, ọ na-ezo aka ná nkwa Chineke kwere Ebreham dịka ọgbụgba ndụ, ọ bụghị naanị nkwekọrịta mmadụ.
- source_word: προκεκυρωμένην
  choice: kwadoro na mbụ
  rationale: Ọ na-egosi na Chineke emeelarị ka ọgbụgba ndụ ahụ guzosie ike tupu Iwu ahụ abịa, dịka participle perfect na echiche nke ihe mere tupu oge ọzọ si dị.
- source_word: ὑπὸ τοῦ θεοῦ
  choice: Chineke
  rationale: Usoro Igbo “ọgbụgba ndụ Chineke kwadoro” na-egosi nke ọma na Chineke bụ onye mere nkwado ahụ, n'enweghị itinye nkwusi ike na-adịghị na isiokwu Grik.
- source_word: ὁ ... γεγονὼς νόμος
  choice: Iwu ahụ, nke bịara
  rationale: “Bịara” na-egosi nke ọma na Iwu ahụ pụtara n'akụkọ ihe mere eme mgbe ọgbụgba ndụ ahụ gasịrị.
- source_word: μετὰ τετρακόσια καὶ τριάκοντα ἔτη
  choice: narị afọ anọ na iri atọ mgbe e mesịrị
  rationale: Nke a na-edobe kpọmkwem oge afọ 430 na mmekọrịta ya na ihe mere tupu ya.
- source_word: οὐκ ἀκυροῖ
  choice: anaghị eme ka ... ghara ịdị ire
  rationale: Okwu a na-egosipụta n'Igbo dị ugbu a echiche iwu nke ime ka ọgbụgba ndụ ghara inwe ike ma ọ bụ ghara ịdị irè.
- source_word: εἰς τὸ καταργῆσαι
  choice: iji si otú ahụ mee ka ... ghara ịdị irè
  rationale: Nke a na-edobe ohere echiche ebumnuche ma ọ bụ ihe ga-esi na ya pụta, ma na-egosi ike okwu ahụ nke ime ka ihe kwụsị ịrụ ọrụ.
- source_word: τὴν ἐπαγγελίαν
  choice: nkwa ahụ
  rationale: “Nkwa” bụ okwu doro anya n'Igbo maka nkwa Chineke e kwuru banyere ya n'arụmụka Pọl gbasara Ebreham.
theological_decisions:
- issue: Ihe διαθήκη pụtara n'arụmụka Pọl
  choice: ọgbụgba ndụ
  alternative: ihe e dere n'akwụkwọ iketa; nkwekọrịta iwu
  rationale: Amaokwu ndị gbara ya gburugburu lekwasịrị anya ná nkwa Chineke nyere Ebreham; “ọgbụgba ndụ” na-edobe echiche ahụ n'akụkọ nzọpụta n'ebughị nkọwa okpukpe pụrụ iche bata.
- issue: Mmekọrịta ebumnuche na ihe ga-esi na ya pụta n'okwu εἰς τὸ καταργῆσαι
  choice: iji si otú ahụ mee ka
  alternative: nke ga-eme ka
  rationale: Nsụgharị ahụ na-ahapụ ntakịrị oghere dị n'etiti ebumnuche na ihe ga-esi na ya pụta kama ikpebi otu n'ime ha n'ụzọ siri ike.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. A họọrọ usoro okwu nkịtị kama asụsụ iwu siri ike, ma e debere ọdịiche dị n'etiti ime ka ọgbụgba ndụ ghara ịdị ire na ime ka nkwa ghara ịrụ ọrụ.
