  rationale: 'A small syntactic revision improves Standard Igbo idiom: the means phrase now follows the act of receiving that it qualifies. The explicit possessive connector in “ngọzi nke Ebreham” improves clarity. No theological ambiguity has been resolved or introduced, and all original footnote anchors and alternatives are retained.'
