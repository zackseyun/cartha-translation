id: GAL.3.14
reference: Galatians 3:14
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἵνα εἰς τὰ ἔθνη ἡ εὐλογία τοῦ Ἀβραὰμ γένηται ἐν ⸂Χριστῷ Ἰησοῦ⸃, ἵνα τὴν ἐπαγγελίαν τοῦ πνεύματος λάβωμεν διὰ τῆς πίστεως.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/014.yaml
  text: so that the blessing of Abraham might come to the Gentiles in Messiah Jesus[c][b][a], so that we might receive the promise of the Spirit through faith.
translation:
  language: ig
  text: ka ngọzi nke Ebreham wee ruo ndị mba ọzọ[a] n'ime Mesaịa Jizọs[b], ka anyị wee nata nkwa nke Mmụọ[c] site n'okwukwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “mba dị iche iche.”
    reason: lexical_alternative
  - marker: b
    text: N’asụsụ ọdịnala, “n’ime Kraịst Jizọs.”
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “Mmụọ ahụ e kwere ná nkwa.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἵνα … ἵνα
  choice: ka … wee …, ka … wee
  rationale: Usoro a na-egosi ebumnuche ugboro abụọ n’ụzọ Igbo dị mfe, ma na-echekwa nhazi ahịrịokwu Grik ahụ.
- source_word: εἰς τὰ ἔθνη
  choice: ruo ndị mba ọzọ
  rationale: “Ndị mba ọzọ” na-egosi ndị na-abụghị ndị Juu n’ọnọdụ a; “ruo” na-enye γένηται εἰς n’ụzọ Igbo sitere n’okike.
- source_word: ἡ εὐλογία τοῦ Ἀβραὰμ
  choice: ngọzi Ebreham
  rationale: Nke a na-echekwa njikọ kpọmkwem ya na ngọzi e jikọrọ ya na Ebreham.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: n'ime Mesaịa Jizọs
  rationale: “Mesaịa” na-asụgharị Χριστός dị ka utu aha, ebe “Jizọs” bụ aha; “n’ime” na-echekwa okwu njikọ ἐν nke Pọl.
- source_word: τὴν ἐπαγγελίαν τοῦ πνεύματος
  choice: nkwa nke Mmụọ
  rationale: Nke a na-echekwa ụdị genitiv Grik ahụ na-enweghị ikpebi ma ọ pụtara nkwa metụtara Mmụọ ma ọ bụ Mmụọ ahụ e kwere ná nkwa.
- source_word: λάβωμεν διὰ τῆς πίστεως
  choice: anyị wee site n'okwukwe nata
  rationale: “Nata” bụ okwu Igbo kwesịrị ekwesị maka λάβωμεν, ebe “site n’okwukwe” na-egosi ụzọ e si enweta ya.
theological_decisions:
- issue: Ma a ga-asụgharị Χριστός dị ka utu aha ka ọ bụ jiri ụdị ọdịnala mee ya
  choice: Mesaịa Jizọs
  alternative: Kraịst Jizọs
  rationale: N’arụmụka Pọl banyere nkwa Ebreham, Χριστός ka nwere ike dị ka utu aha; ya mere, “Mesaịa” na-eme ka nke ahụ doo anya n’enweghị itinye nkọwa otu ụka.
- issue: Ihe genitiv τοῦ πνεύματος pụtara
  choice: nkwa nke Mmụọ
  alternative: Mmụọ ahụ e kwere ná nkwa
  rationale: Isiokwu bụ́ “nkwa nke Mmụọ” na-echekwa mgbagwoju anya dị na Grik; a hapụrụ nkọwa nke na-ewere Mmụọ dị ka ihe e kwere ná nkwa n’ala ala peeji.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ugwu ma dị mfe nghọta, dee ya. E chekwara usoro ebumnuche abụọ nke ἵνα, utu aha “Mesaịa,” na mgbagwoju anya dị na “nkwa nke Mmụọ.”
