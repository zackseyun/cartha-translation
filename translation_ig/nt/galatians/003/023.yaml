  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Πρὸ τοῦ δὲ ἐλθεῖν τὴν πίστιν ὑπὸ νόμον ἐφρουρούμεθα ⸀συγκλειόμενοι εἰς τὴν μέλλουσαν πίστιν ἀποκαλυφθῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/023.yaml
  text: But before faith came[a], we were being guarded under the law[d][c][b], confined until the faith that was about to be revealed.
translation:
  language: ig
  text: Ma tupu okwukwe abịa[a][d], e chebere anyị n'okpuru iwu[b], kpọchibido anyị[c] ruo mgbe a ga-ekpughe okwukwe ahụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, ‘tupu okwukwe ahụ abịa’; okwu Grik ahụ nwere okwu kwekọrọ na ‘the,’ nke pụrụ ịtụ aka n'oge okwukwe malitere site na Kraịst.
    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ, ‘e jidere anyị n'okpuru nche.’
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, ‘a tụrụ anyị mkpọrọ’ ma ọ bụ ‘a mechiri anyị ụzọ.’
    reason: lexical_alternative
  - marker: d
    text: Okwu Grik πίστις nwekwara ike ịpụta ‘ikwesi ntụkwasị obi’ ma ọ bụ ‘ntụkwasị obi,’ ọ bụ ezie na ‘okwukwe’ kacha daba n'ọnọdụ a.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πρὸ τοῦ ... ἐλθεῖν
  choice: tupu ... abịa
  rationale: Nkebiokwu a na-egosi oge, ya mere ‘tupu ... abịa’ bụ Igbo doro anya ma kwekọọ n'usoro Grik.
- source_word: δὲ
  choice: Ma
  rationale: ‘Ma’ na-egosi obere ntụgharị ma ọ bụ ọdịiche dị n'etiti okwu a na arụmụka bu ya ụzọ.
- source_word: τὴν πίστιν
  choice: okwukwe
  rationale: ‘Okwukwe’ bụ ntụgharị kacha adabara ebe a; a hapụrụkwa ohere ka okwu ahụ nwee ike ịpụta oge ọhụrụ nke okwukwe malitere site na Kraịst.
- source_word: ὑπὸ νόμον
  choice: n'okpuru iwu
  rationale: Nke a na-egosi ịnọ n'okpuru ọchịchị ma ọ bụ ikike iwu ahụ, n'ụzọ kwekọrọ n'okwu Pọl.
- source_word: ἐφρουρούμεθα
  choice: a na-eche anyị nche
  rationale: Ụdị okwu a na-egosi omume gara n'ihu n'oge gara aga; ‘a na-eche anyị nche’ na-echekwa ma echiche nchedo ma nke njide.
- source_word: συγκλειόμενοι
  choice: mechibidokwa anyị
  rationale: Okwu a na-enye echiche nke imechi ndị mmadụ ma gbochie ha ịpụ; ntụgharị a na-edobe ike mgbochi ahụ.
- source_word: εἰς
  choice: ruo mgbe
  rationale: N'ebe a, ọ na-atụ aka n'oge nkwụsị ahụ gara n'ihu ruo na mkpughe okwukwe ahụ.
- source_word: τὴν μέλλουσαν πίστιν ἀποκαλυφθῆναι
  choice: okwukwe ahụ nke na-aga ịpụta ìhè
  rationale: Nke a na-echekwa echiche nke okwukwe ahụ dị njikere ka e kpughee ya, ma na-asụ ya n'Igbo dị mfe ma dị ebube.
theological_decisions:
- issue: Ma πίστις ọ̀ pụtara okwukwe mmadụ n'ozuzu ya, ka ọ̀ bụ eziokwu ọhụrụ n'akụkọ nzọpụta nke metụtara ọbịbịa Kraịst
  choice: E ji ‘okwukwe’ mee ihe, ebe usoro okwu ahụ ka na-enye ohere maka echiche oge ọhụrụ malitere site na Kraịst.
  alternative: ‘okwukwe ahụ’ dịka usoro ọgbụgba ndụ ọhụrụ, ma ọ bụ ‘ikwesị ntụkwasị obi’
  rationale: Galetia 3 na-atụnyere oge tupu ọbịbịa Kraịst na oge sochiri ya. Isiokwu Grik dị na πίστις nwere ike igosi ihe karịrị nkwenye nke mmadụ n'otu n'otu, ma ịkọwa ya karịa otú a ga-esi dozie esemokwu ahụ nke ederede hapụrụ emeghe.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta mee ihe. E debere ihe abụọ dị n'okwu Grik—nchedo na njide—na-enweghị ime ka iwu bụrụ naanị ihe ọma ma ọ bụ naanị ihe ọjọọ. E jighị nkọwa otu ụka ma ọ bụ ozizi pụrụ iche dozie nghọtahie dị na πίστις.
