- from: Ma tupu okwukwe abịa[a][d], a na-eche anyị nche[b] n'okpuru iwu, mechibidokwa anyị[c] ruo mgbe a ga-ekpughe okwukwe ahụ nke na-aga ịpụta ìhè.
  to: Ma tupu okwukwe abịa[a][d], e chebere anyị n'okpuru iwu[b], kpọchibido anyị[c] ruo mgbe a ga-ekpughe okwukwe ahụ.
  rationale: The revision makes the prior, ongoing passive condition clear in Standard Igbo and renders the final revelation clause with an explicit passive. It retains the source’s ambiguity concerning πίστις and the salvation-historical force of the repeated articular noun without adding doctrinal interpretation.
