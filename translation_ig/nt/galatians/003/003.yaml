  text: οὕτως ἀνόητοί ἐστε; ἐναρξάμενοι πνεύματι νῦν σαρκὶ ἐπιτελεῖσθε;
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/003.yaml
  text: Are you so foolish? Having begun by the Spirit[c][b][a], are you now being perfected by the flesh?
translation:
  language: ig
  text: Unu ọ̀ bụ ndị na-enweghị uche nke ukwuu? Ebe unu ji Mmụọ[a] malite, ọ̀ bụzi anụ ahụ[b] ka e ji eme ka unu zuo oke[c]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’ime Mmụọ.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “mgbalị mmadụ”; o nwekwara ike ịbụ, “agwa mmehie.”
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “a na-eme ka unu zuo ezu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως
  choice: ruo otú a
  rationale: N’ajụjụ nkọcha a, okwu ahụ na-egosi ogo—‘ruo otú a’—karịa nanị ụzọ e si eme ihe.
- source_word: ἀνόητοί
  choice: ndị na-enweghị uche
  rationale: Nke a na-egosi enweghị nghọta ma ọ bụ ezi mkpebi n’asụsụ Igbo doro anya, na-akpọghị ha ndị nzuzu n’ụzọ gabigara ihe ederede ahụ.
- source_word: ἐναρξάμενοι
  choice: ebe unu ji ... malite
  rationale: Ọ na-egosi omume malitere tupu ajụjụ banyere ihe ha na-eme ugbu a, ma na-ada nke ọma n’Igbo.
- source_word: πνεύματι
  choice: ji Mmụọ
  rationale: ‘Ji’ na-egosi na Mmụọ bụ onye e ji malite, dabara na dative instrumental; mkpụrụedemede ukwu na-egosi Mmụọ Nsọ dịka ihe gbara ya gburugburu si kwado.
- source_word: νῦν
  choice: bụzi
  rationale: ‘Zi’ na-edebe mgbanwe oge na ọdịiche dị n’etiti mmalite ha na ọnọdụ ugbu a.
- source_word: σαρκὶ
  choice: anụ ahụ
  rationale: Nke a na-edebe okwu ihe atụ Pọl na esemokwu ya na ‘Mmụọ,’ n’ebughị ụzọ kpebie na ọ bụ naanị mgbalị mmadụ ma ọ bụ ọdịdị mmehie.
- source_word: ἐπιτελεῖσθε
  choice: e ji eme ka unu zuo oke
  rationale: Nke a na-egosipụta usoro passive nke iru na mmezu ma na-edebe ike ajụjụ Pọl; ‘mezue unu’ bụkwa ihe nwere ike ịbụ.
theological_decisions:
- issue: Onye πνεύματι na-ezo aka na ya
  choice: Mmụọ Nsọ
  alternative: mmụọ mmadụ ma ọ bụ ụkpụrụ ime mmụọ
  rationale: Ihe gbara amaokwu a gburugburu na-ekwu banyere ịnata Mmụọ, ọrụ ebube, na okwukwe; ya mere Mmụọ Nsọ bụ nghọta kacha dabara.
- issue: Ihe σάρξ pụtara n’ọdịiche ya na Mmụọ
  choice: anụ ahụ
  alternative: mgbalị mmadụ; ọdịdị mmehie
  rationale: A hapụrụ okwu ihe atụ Pọl ka ọ dịrị obosara, ebe ọ pụrụ ịgụnye adịghị ike na ụzọ mmadụ, kama imechi ya n’otu nkọwa.
- issue: Ụdị olu nke ἐπιτελεῖσθε
  choice: a na-eme ka unu zuo oke
  alternative: unu na-emecha onwe unu; a na-eme ka unu mezue
  rationale: Ụdị Grik nwere ike ịbụ middle/passive; nsụgharị passive na-adaba nke ọma na ọdịiche dị n’etiti ụzọ e ji malite na ụzọ e ji achọ iru na mmezu, ma e debere ‘mezue’ na nkọwa ala peeji.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Ajụjụ abụọ ahụ na-edebe ụda nkọcha Pọl. E debere ‘Mmụọ’ na ‘anụ ahụ’ ka esemokwu okwu Grik ahụ ghara ịla n’iyi; akara ụda dị na ‘ọ̀ bụzi’ na-enyere onye na-agụ aka ịmata ajụjụ ahụ.
