revisions:
- from: Unu bụ ndị na-enweghị uche ruo otú a? Ebe unu ji Mmụọ[a] malite, ọ̀ bụzi anụ ahụ[b] ka e ji eme ka unu zuo oke[c]?
  to: Unu ọ̀ bụ ndị na-enweghị uche nke ukwuu? Ebe unu ji Mmụọ[a] malite, ọ̀ bụzi anụ ahụ[b] ka e ji eme ka unu zuo oke[c]?
  rationale: The revision retains the source’s rhetorical form, the antecedent action of “having begun,” and the debated Spirit/flesh contrast. It improves modern Standard Igbo idiom and repairs the two footnote alternatives that were unnatural or unclear. The main clause continues to represent ἐπιτελεῖσθε with a passive-like construction, without forcing a denominational interpretation of σάρξ.
