id: GAL.3.15
reference: Galatians 3:15
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἀδελφοί, κατὰ ἄνθρωπον λέγω· ὅμως ἀνθρώπου κεκυρωμένην διαθήκην οὐδεὶς ἀθετεῖ ἢ ἐπιδιατάσσεται.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/015.yaml
  text: 'Brothers[a], I am speaking in human terms: even a covenant ratified by a man[b], no one sets aside or adds to it.'
translation:
  language: ig
  text: 'Ụmụnna[a], ana m ekwu okwu dịka mmadụ si ekwu: ọbụna ọgbụgba ndụ[b] mmadụ kwadorola, ọ dịghị onye na-akagbu ya ma ọ bụ na-agbakwụnye ihe ọzọ na ya.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Okwu Grik a sụgharịrị “Ụmụnna” dị n’ụdị nwoke ọtụtụ; Pọl na-agwa ndị kwere ekwe ibe ya okwu, o yikwara ka ụmụ nwanyị sokwa na ha.
    reason: cultural_note
  - marker: b
    text: Ma ọ bụ, “akwụkwọ nketa” ma ọ bụ “uche ikpeazụ banyere nketa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀδελφοί
  choice: Ụmụnna
  rationale: Okwu a bụ aha ịkpọ ọtụtụ ndị n’ụdị nwoke. “Ụmụnna” bụ ụzọ ebumpụta ụwa na nke a na-akwanyere ùgwù e si akpọ ndị otu okwukwe n’Igbo; ihe odide ala peeji na-akọwa na ndị a na-agwa nwere ike ịgụnye ụmụ nwanyị.
- source_word: κατὰ ἄνθρωπον λέγω
  choice: ana m ekwu okwu n’ụzọ mmadụ si ekwu
  rationale: Nke a na-egosi na Pọl na-eji ihe a maara n’etiti mmadụ eme ihe atụ. Nsụgharị a na-edobe akpaala okwu ahụ n’Igbo doro anya n’ebughị nkọwa karịrị ihe Grik kwuru.
- source_word: ὅμως
  choice: ọbụna
  rationale: 'N’ebe a okwu ahụ na-eme ka ike ihe atụ ahụ pụta ìhè: ọbụna n’ihe gbasara ọgbụgba ndụ mmadụ, ụkpụrụ a ka na-adị.'
- source_word: ἀνθρώπου
  choice: nke mmadụ
  rationale: A hapụrụ ya n’otu onye dịka Grik si dị, kama ime ya okwu izugbe banyere mmadụ niile.
- source_word: κεκυρωμένην
  choice: kwadoro ka o guzosie ike
  rationale: Nkebiokwu a na-egosi ihe e kwadoro n’ụzọ doro anya nke mere na ọ na-arụ ọrụ. Okwu Igbo a na-ebute echiche iwu ahụ n’asụsụ a na-aghọta ngwa ngwa.
- source_word: διαθήκην
  choice: ọgbụgba ndụ
  rationale: “Ọgbụgba ndụ” dabara n’arụmụka Pọl banyere nkwa Chineke nyere Ebreham, ma na-edobe njikọ ya na amaokwu ndị gbara ya gburugburu. A kọwara ihe ọzọ okwu ahụ pụrụ ịpụta n’ihe odide ala peeji.
- source_word: ἀθετεῖ
  choice: na-akagbu ya
  rationale: “Ịkagbu” na-egosi ime ka ihe ghara ịdị ire ma dabara n’ọnọdụ iwu a.
- source_word: ἐπιδιατάσσεται
  choice: na-agbakwụnye ihe na ya
  rationale: Nke a na-egosipụta itinye usoro ma ọ bụ ihe ọzọ n’ihe e kwadorola, n’Igbo dị mfe ma doo anya.
theological_decisions:
- issue: Ma a ga-asụgharị διαθήκη dịka “ọgbụgba ndụ” ka ọ bụ “akwụkwọ ikike nketa”
  choice: ọgbụgba ndụ
  alternative: akwụkwọ ikike nketa / ọgbụgba ndụ ikpeazụ
  rationale: N’ime Ndị Galeshia 3, Pọl na-ekwu maka nkwa na ọgbụgba ndụ metụtara Ebreham. Ya mere, “ọgbụgba ndụ” na-edobe njikọ okpukpe na usoro arụmụka ahụ, ebe ihe okwu ahụ pụtara n’iwu gbasara nketa ka bụ ezigbo nhọrọ a na-egosi n’ihe odide ala peeji.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ “kwadoro ka o guzosie ike” iji mee ka echiche iwu nke participle Grik pụta ìhè n’enweghị asụsụ ọkachamara siri ike; e debere “ọgbụgba ndụ” n’isi ederede n’ihi ọnọdụ arụmụka ahụ.
