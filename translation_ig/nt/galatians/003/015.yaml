  to: 'Ụmụnna[a], ana m ekwu okwu dịka mmadụ si ekwu: ọbụna ọgbụgba ndụ[b] mmadụ kwadorola, ọ dịghị onye na-akagbu ya ma ọ bụ na-agbakwụnye ihe ọzọ na ya.'
