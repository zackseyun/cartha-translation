id: GAL.3.10
reference: Galatians 3:10
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ὅσοι γὰρ ἐξ ἔργων νόμου εἰσὶν ὑπὸ κατάραν εἰσίν, γέγραπται γὰρ ⸀ὅτι Ἐπικατάρατος πᾶς ὃς οὐκ ⸀ἐμμένει πᾶσιν τοῖς γεγραμμένοις ἐν τῷ βιβλίῳ τοῦ νόμου τοῦ ποιῆσαι αὐτά.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/010.yaml
  text: For all who are of works of the law are under a curse[a], for it is written, “Cursed is everyone who does not remain in all the things written in the book of the law[b], to do them.”
translation:
  language: ig
  text: N’ihi na ndị niile na-esite n’ọrụ Iwu[a] nọ n’okpuru ọbụbụ ọnụ, n’ihi na e dere, sị, “Onye ọ bụla nke na-adịghị anọgide n’ihe niile e dere n’akwụkwọ Iwu ahụ[b] ka o mee ha, bụ onye a bụrụ ọnụ.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “ndị niile na-adabere n’ọrụ Iwu.”
    reason: alternative_reading
  - marker: b
    text: 'N’ụzọ nkịtị: “onye ọ bụla nke na-adịghị anọgide n’ihe niile e dere n’akwụkwọ Iwu ahụ, ime ha.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅσοι γὰρ
  choice: N’ihi na ndị niile
  rationale: “Ndị niile” na-egosi ìgwè mmadụ niile okwu a gbasara, ebe “N’ihi na” na-ebute ihe kpatara okwu bu ya ụzọ.
- source_word: ἐξ ἔργων νόμου
  choice: na-esite n’ọrụ Iwu
  rationale: Nke a na-edobe ihe atụ nke isi mmalite dị na ἐξ ma ghara ịkọwa ya ozugbo dị ka ‘ịdabere na’; e tinyere nkọwa ọzọ n’ala peeji n’ihi na akpaokwu ahụ nwere nnukwu ibu n’echiche Pọl.
- source_word: ὑπὸ κατάραν
  choice: nọ n’okpuru ọbụbụ ọnụ
  rationale: Nke a bụ ụzọ Igbo doro anya si egosi ịnọ n’okpuru ike ma ọ bụ ikpe nke ọbụbụ ọnụ, na-enweghị ịkọwapụta ọbụbụ ọnụ pụrụ iche karịa ihe Grik kwuru.
- source_word: γέγραπται
  choice: e dere
  rationale: Ọ bụ usoro okwu Igbo dị nkenke ma kwanyere ugwu maka usoro e ji kpọtụrụ Akwụkwọ Nsọ; ọ na-edobe echiche na ihe ahụ ka dị n’akwụkwọ.
- source_word: Ἐπικατάρατος πᾶς ὃς
  choice: A bụrụla onye ọ bụla ọnụ, bụ́ onye
  rationale: Nke a na-egosi ọnọdụ nke ịbụ onye a bụrụ ọnụ ma na-edobe ike zuru ụwa ọnụ nke πᾶς ὃς.
- source_word: ἐμμένει
  choice: na-adịghị anọgide
  rationale: “Ịnọgide” na-egosi nrubeisi na-aga n’ihu, kwekọọkwa na akụkụ na-adịgide adịgide nke ngwaa Grik.
- source_word: πᾶσιν τοῖς γεγραμμένοις
  choice: n’ihe niile e dere
  rationale: Nke a na-edobe oke zuru ezu nke πᾶσιν ma bụrụkwa Igbo sitere n’okike.
- source_word: ἐν τῷ βιβλίῳ τοῦ νόμου
  choice: n’akwụkwọ Iwu ahụ
  rationale: “Akwụkwọ” bụ okwu Igbo nkịtị ma doo anya; “Iwu ahụ” na-egosi Iwu ahụ a maara n’ọnọdụ okwu a n’enweghị itinye nkọwa ụka ọzọ.
- source_word: τοῦ ποιῆσαι αὐτά
  choice: ime ha
  rationale: Nke a na-edobe usoro infinitive nke Grik na echiche nke ime ihe ndị ahụ n’eziokwu, kama nanị ịmata ha.
theological_decisions:
- issue: Ihe ἐξ ἔργων νόμου pụtara
  choice: na-esite n’ọrụ Iwu
  alternative: na-adabere n’ọrụ Iwu
  rationale: Akpaokwu Grik ahụ nwere esemokwu nkọwa dị mkpa. Nsụgharị bụ isi na-edobe ihe atụ ‘isite na’ kama ịkwụsị esemokwu ahụ site n’ịsụ naanị ‘ịdabere na’; ala peeji na-enye nghọta ọzọ kwesịrị ekwesị.
- issue: Ụdị nrubeisi a chọrọ n’okwu e hotara
  choice: na-adịghị anọgide n’ihe niile e dere … ime ha
  alternative: na-adịghị eme ihe niile e dere n’akwụkwọ Iwu ahụ mgbe niile
  rationale: Nhọrọ bụ isi na-edobe ma echiche ịnọgide nke ἐμμένει ma usoro ‘ime ha’ nke τοῦ ποιῆσαι αὐτά, n’agbanyeghị na Igbo dị mfe karị nwere ike ijikọta ha ọnụ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, doro anya ma kwanyere ugwu mee ihe. E debere nhazi na esemokwu nkọwa nke Grik ebe ọ dị mkpa, ma jiri ala peeji kọwaa ụzọ ọzọ kama itinye ozizi otu ụka n’ahịrị nsụgharị.
