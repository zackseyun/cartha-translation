revisions:
- from: N’ihi na ndị niile na-esite n’ọrụ Iwu[a] nọ n’okpuru ọbụbụ ọnụ, n’ihi na e dere, sị, “A bụrụla onye ọ bụla ọnụ, bụ́ onye na-adịghị anọgide n’ihe niile e dere n’akwụkwọ Iwu ahụ[b], ime ha.”
  to: N’ihi na ndị niile na-esite n’ọrụ Iwu[a] nọ n’okpuru ọbụbụ ọnụ, n’ihi na e dere, sị, “Onye ọ bụla nke na-adịghị anọgide n’ihe niile e dere n’akwụkwọ Iwu ahụ[b] ka o mee ha, bụ onye a bụrụ ọnụ.”
  rationale: The revision only regularizes the Igbo syntax of the scriptural quotation. It keeps the formal, interpretively open rendering “na-esite n’ọrụ Iwu,” preserves the scope of the curse, maintains the durative force of ἐμμένει through “na-adịghị anọgide,” and explicitly retains the final requirement to do the written things.
  reviewer_model: gpt-5.6-terra
