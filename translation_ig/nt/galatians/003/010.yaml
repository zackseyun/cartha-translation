review_pass:
  verdict: revise
  source_fidelity: 'The draft correctly reflects the major Greek clauses and retains the deliberate noncommittal wording of ἐξ ἔργων νόμου. However, the quoted curse is not idiomatic Igbo as written: “A bụrụla onye ọ bụla ọnụ, bụ́ onye ...” has an awkward word order and an unnecessary perfect nuance. A small recasting is needed so that the universal subject and the predicate “cursed” are clear while retaining the final infinitive of purpose.'
  naturalness: “Ndị niile na-esite n’ọrụ Iwu” is a defensible formal rendering, though somewhat literal; its alternative is appropriately footnoted. The wording for the curse needs revision to natural Standard Igbo. “Onye ọ bụla ... bụ onye a bụrụ ọnụ” is clear, solemn, and natural in biblical register. “ka o mee ha” gives an intelligible rendering of the Greek infinitive τοῦ ποιῆσαι αὐτά without omitting it.
  terminology: “Iwu,” “ọrụ Iwu,” “n’okpuru ọbụbụ ọnụ,” and “akwụkwọ Iwu ahụ” are suitable and consistent. No doctrinal interpretation has been imposed. The footnote markers remain correctly anchored after “Iwu” and “akwụkwọ Iwu ahụ.”
  issues:
  - severity: medium
    issue: The quotation begins “A bụrụla onye ọ bụla ọnụ, bụ́ onye ...”
    rationale: This construction is awkward in Standard Igbo and obscures the relationship between “everyone” and “cursed.” “A bụrụla” also introduces a perfect/completed nuance not required by Ἐπικατάρατος. Recasting with “Onye ọ bụla ... bụ onye a bụrụ ọnụ” is natural and preserves the source sense.
  - severity: low
    issue: The infinitive phrase “ime ha” is left as a fragment after the quoted clause.
    rationale: Although it mirrors the Greek closely, it is strained in Igbo. “ka o mee ha” provides a grammatical purpose-oriented expression while retaining the explicit reference to doing the written requirements.
  revised_text: N’ihi na ndị niile na-esite n’ọrụ Iwu[a] nọ n’okpuru ọbụbụ ọnụ, n’ihi na e dere, sị, “Onye ọ bụla nke na-adịghị anọgide n’ihe niile e dere n’akwụkwọ Iwu ahụ[b] ka o mee ha, bụ onye a bụrụ ọnụ.”
  revised_footnotes:
