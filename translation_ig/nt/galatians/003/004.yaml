    text: Ma ọ bụ, “Ùnu gabigara ọtụtụ ihe n’efu?”
    reason: lexical_alternative
  revision_rationale: The revision removes the non-idiomatic and source-obscuring locative phrase, while retaining the likely contextual sense of πάσχω as suffering. It preserves the repeated “n’efu,” the rhetorical question, and the hesitant “if indeed” qualification. The footnote continues to represent the lexically broader alternative without imposing it on the main text.
