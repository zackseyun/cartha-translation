  text: τοσαῦτα ἐπάθετε εἰκῇ; εἴ γε καὶ εἰκῇ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/004.yaml
  text: Did you suffer so many things in vain?—if indeed it really was in vain[a].
translation:
  language: ig
  text: Ùnu tara ọtụtụ ahụhụ n’efu?—ma ọ bụrụ na ọ bụ n’ezie n’efu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Ùnu gabigara ọtụtụ ihe n’efu?”
    reason: lexical_alternative
lexical_decisions:
- source_word: τοσαῦτα
  choice: n’ọtụtụ ihe ahụ
  rationale: Nnọchiaha a dị n'ụdị ọtụtụ ma na-ezo aka n'ụzọ sara mbara n'ọtụtụ ihe ndị Galeshia gabigara; okwu a na-echekwa echiche nke ịdị ọtụtụ.
- source_word: ἐπάθετε
  choice: tara ahụhụ
  rationale: πάσχω nwere ike ịpụta ịta ahụhụ ma ọ bụ ịgabiga ihe. N'ebe a, 'tara ahụhụ' na-egosipụta ike okwu ahụ nke ọma, ebe a debere nghọta sara mbara n'okpuru peeji.
- source_word: εἰκῇ
  choice: n’efu
  rationale: Okwu a na-egosi na ihe ahụ enweghị uru ma ọ bụ nzube; 'n’efu' bụ ụzọ dị nkenke ma bụrụkwa nke mmadụ niile na-aghọta.
- source_word: εἴ γε
  choice: ma ọ bụrụ n’ezie
  rationale: Nke a na-echekwa ọnọdụ ajụjụ ahụ na nkwenye na-ezughị oke Pọl tinyere n'okwu ya.
- source_word: καὶ
  choice: na ọ bụ
  rationale: N'usoro okwu Igbo a, ike idiomatic nke καὶ na-apụta site na 'n’ezie na ọ bụ n’efu,' kama ịsụgharị ya dịka okwu kwụụrụ onwe ya nke ga-ada arọ.
- source_word: εἰκῇ
  choice: n’efu
  rationale: E kwughachiri 'n’efu' dịka e mere n'asụsụ Grik iji chekwaa ike nkwughachi na nchegbu na ahụhụ ha pụrụ ịbụ ihe na-abaghị uru.
theological_decisions:
- issue: Ma ἐπάθετε pụtara ịta ahụhụ ka ọ bụ ịgabiga ahụmahụ n'ozuzu
  choice: tara ahụhụ
  alternative: gabigara ọtụtụ ihe ahụ
  rationale: Ọnọdụ okwu ahụ nwere ike ịkwado ahụhụ metụtara okwukwe, ma okwu Grik ka nwere nghọta sara mbara; ya mere e debere nke ọzọ n'okpuru peeji kama imechi mgbagwoju anya ahụ.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị ugbu a ma dị ugwu. A haziri ajụjụ ahụ ka ọ bụrụ nke a na-aghọta ngwa ngwa, ma chekwaa nkwughachi nke ‘n’efu’ na ọnọdụ nkwubi okwu ahụ na-ezughị oke.
