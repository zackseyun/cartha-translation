- from: Ùnu tara ahụhụ n’ọtụtụ ihe ahụ n’efu?—ma ọ bụrụ n’ezie na ọ bụ n’efu[a].
  to: Ùnu tara ọtụtụ ahụhụ n’efu?—ma ọ bụrụ na ọ bụ n’ezie n’efu[a].
  rationale: The revision removes the non-idiomatic and source-obscuring locative phrase, while retaining the likely contextual sense of πάσχω as suffering. It preserves the repeated “n’efu,” the rhetorical question, and the hesitant “if indeed” qualification. The footnote continues to represent the lexically broader alternative without imposing it on the main text.
