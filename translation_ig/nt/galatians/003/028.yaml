id: GAL.3.28
reference: Galatians 3:28
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οὐκ ἔνι Ἰουδαῖος οὐδὲ Ἕλλην, οὐκ ἔνι δοῦλος οὐδὲ ἐλεύθερος, οὐκ ἔνι ἄρσεν καὶ θῆλυ· ⸀πάντες γὰρ ὑμεῖς εἷς ἐστε ἐν Χριστῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/028.yaml
  text: There is no Jew or Greek[a], there is no servant or free, there is no male and female[b]; for you are all one in Messiah Jesus.
translation:
  language: ig
  text: Ọ dịghị onye Juu ma ọ bụ onye Gris; ọ dịghị ohu ma ọ bụ onye nweere onwe ya; ọ dịghị nwoke na nwanyị[a]; n’ihi na unu niile bụ otu n’ime Mesaịa Jizọs[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’asụsụ Grik, okwu ya bụ kpọmkwem ‘nwoke na nwanyị,’ nke nwere ike ịbụ nkwughachi Jenesis 1:27. A pụkwara ịghọta usoro ahịrịokwu ahụ dị ka ‘ọ dịghị nwoke ma ọ bụ nwanyị.’
    reason: alternative_reading
  - marker: b
    text: N’asụsụ Grik, ‘n’ime Kraịst Jizọs.’ E ji ‘Mesaịa Jizọs’ sụgharịa ya ebe a n’ihi na Χριστός bụ aha ọkwá nke pụtara Onye E Tere Mmanụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ἔνι
  choice: Ọ dịghị
  rationale: Nke a bụ ụzọ Igbo dị nkenke ma kwekọọ n’okwu Grik e kwughachiri ugboro atọ iji mesie nkwupụta ahụ ike.
- source_word: Ἰουδαῖος
  choice: onye Juu
  rationale: N’ịtụnyere ya na Ἕλλην, okwu a na-egosi onye sitere n’agbụrụ na okwukwe ndị Juu.
- source_word: Ἕλλην
  choice: onye Gris
  rationale: E jigidere ‘Gris’ kama ịgbasa ya ka ọ bụrụ ndị mba ọzọ niile, n’ihi na nke ahụ bụ okwu Grik Pọl ji.
- source_word: δοῦλος
  choice: ohu
  rationale: ‘Ohu’ na-egosi ọnọdụ onye nọ n’okpuru onye nwe ya, nke bụ isi ọdịiche ya na onye nweere onwe ya n’ebe a.
- source_word: ἐλεύθερος
  choice: onye nweere onwe ya
  rationale: Nke a bụ okwu Igbo doro anya ma bụrụ ihe megidere ‘ohu’ n’ụzọ ebumpụta ụwa.
- source_word: ἄρσεν καὶ θῆλυ
  choice: nwoke na nwanyị
  rationale: Nke a na-echekwa njikọ ‘na’ dị na Grik ma na-enye ohere ka ntụaka yiri Jenesis 1:27 pụta ìhè.
- source_word: πάντες ὑμεῖς
  choice: unu niile
  rationale: Ọ na-echekwa ma nnọchiaha onye nke abụọ n’ọnụọgụgụ ma nkwusi ike nke ‘niile.’
- source_word: εἷς ἐστε
  choice: bụ otu
  rationale: Nsụgharị a na-echekwa nkwupụta dị nkenke banyere ịdị n’otu n’ebughị ụzọ kọwaa ya karịa ihe amaokwu ahụ kwuru.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: n’ime Mesaịa Jizọs
  rationale: ‘Mesaịa’ na-egosi na Χριστός bụ aha ọkwá nke Onye E Tere Mmanụ n’ebe a, ebe ‘n’ime’ na-echekwa njikọ ἐν.
theological_decisions:
- issue: Otu a ga-esi sụgharịa ἄρσεν καὶ θῆλυ
  choice: nwoke na nwanyị
  alternative: nwoke ma ọ bụ nwanyị
  rationale: Grik ji καὶ (‘na’), ọ bụghị οὐδὲ (‘ma ọ bụ/ma’), n’ụzọ pụrụ ịbụ nkwughachi Jenesis 1:27. Ya mere, e chekwara ọdịiche ahụ kama ime ka ahịrị atọ ahụ bụrụ otu ụdị.
- issue: Ma a ga-akọwawanye εἷς ἐστε
  choice: unu niile bụ otu
  alternative: unu niile bụ otu onye / unu niile dị n’otu
  rationale: ‘Bụ otu’ na-ahapụ nkwupụta Pọl banyere ịdị n’otu n’ime Mesaịa ka ọ dị, n’agbanyeghị na ọ kọwaghị n’amaokwu a ma ọdịiche niile e kere eke akwụsịla.
- issue: Otu a ga-esi gosipụta Χριστός
  choice: Mesaịa
  alternative: Kraịst
  rationale: N’ebe a, Χριστός ka nwere ike aha ọkwá ya; ‘Mesaịa’ na-eme ka nke ahụ pụta ìhè n’enweghị itinye nkọwa okwukwe ọzọ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E chekwara nkwughachi ‘Ọ dịghị’ ugboro atọ na njikọ pụrụ iche ‘nwoke na nwanyị,’ ebe a zere ịgbakwunye nkọwa na ọdịiche ndị ahụ adịkwaghị n’ụdị ọ bụla.
