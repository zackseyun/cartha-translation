- from: Dị nnọọ ka Ebreham kweere Chineke, e wee gụọ ya nye ya dị ka ezi omume,[a]
  to: Dịka Ebreham kweere Chineke, a gụrụ ya nye ya dịka ezi omume,[a]
  rationale: The revision preserves the Greek syntax and continuing comma while using a clearer Standard Igbo reckoning expression for ἐλογίσθη. It retains the established name and the main rendering "ezi omume," with the required lexical alternative anchored to that term.
