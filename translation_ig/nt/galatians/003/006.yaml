  text: καθὼς Ἀβραὰμ ἐπίστευσεν τῷ θεῷ, καὶ ἐλογίσθη αὐτῷ εἰς δικαιοσύνην.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/006.yaml
  text: Just as Abraham believed God[a], and it was counted to him as righteousness,
translation:
  language: ig
  text: Dịka Ebreham kweere Chineke, a gụrụ ya nye ya dịka ezi omume,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ikpe ziri ezi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς
  choice: Dị nnọọ ka
  rationale: Na-egosipụta ntụnyere Pọl ji Ebreham mee ntọala arụmụka ya, ma na-edobe ike nke ntụnyere ahụ.
- source_word: Ἀβραὰμ
  choice: Ebreham
  rationale: Ụdị aha ahụ a na-ejikarị eme ihe n'Igbo.
- source_word: ἐπίστευσεν
  choice: kweere
  rationale: Na-asụgharị omume ikwere n'ụzọ kwụ ọtọ, n'etinyeghị nkọwa ọzọ dị ka ịtụkwasị obi.
- source_word: τῷ θεῷ
  choice: Chineke
  rationale: E ji ya dị ka mmeju kpọmkwem nke 'kweere,' ya bụ, Ebreham nabatara ihe Chineke kwuru; a sịghị 'kweere na Chineke,' nke nwere ike ịpụta naanị nkwenye na Chineke dị.
- source_word: ἐλογίσθη
  choice: e wee gụọ
  rationale: Na-edobe ọdịdị passive na echiche nke ịgụ ma ọ bụ itinye ihe n'aha mmadụ.
- source_word: αὐτῷ
  choice: nye ya
  rationale: Na-egosi Ebreham dị ka onye e nyere ọnọdụ ahụ.
- source_word: εἰς δικαιοσύνην
  choice: dị ka ezi omume
  rationale: Na-edobe ntụgharị ọdịnala nke δικαιοσύνη na echiche nke ihe a gụrụ okwukwe ya ịbụ, na-enweghị ịkọwa ya karịa ihe Greek kwuru.
theological_decisions:
- issue: Ntụgharị δικαιοσύνη n'okwu Pọl sitere na Jenesis
  choice: ezi omume
  alternative: ikpe ziri ezi
  rationale: '''Ezi omume'' dabara n''echiche nke ọnọdụ ziri ezi a gụrụ nye Ebreham n''arụmụka Pọl. E debere ''ikpe ziri ezi'' n''okpuru peeji iji chekwaa ụzọ ọzọ okwu Greek ahụ pụrụ isi pụta.'
translation_notes:
  register: Igbo Izugbe dị ugbu a, dị ùgwù ma doo anya. Akara rikoma n'ikpeazụ na-egosi na ahịrịokwu ahụ na-aga n'ihu n'amaokwu na-esonụ.
