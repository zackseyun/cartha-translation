  yaml_path: translation/nt/galatians/003/020.yaml
  text: A mediator is not of one[b][a], but God is one.
translation:
  language: ig
  text: Onye ogbugbo abụghị nke otu onye[a]; ma Chineke bụ otu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n’ụzọ ga-esochi okwu Grik nso karị, “onye ogbugbo abụghị nke otu”; ihe ọ pụtara nwere ike ịbụ, “ọ naghị arụ ọrụ maka naanị otu onye,” ma ọ bụ, “ọ bụghị maka naanị otu akụkụ.”
    reason: alternative_reading
  - marker: b
    text: Okwu ahụ bụ “Chineke bụ otu” nwere ike ịbụ nkwughachi nke nkwupụta okwukwe Izrel na e nwere naanị otu Chineke; tụlee Diuterọnọmi 6:4.
    reason: cross_reference
lexical_decisions:
- source_word: μεσίτης
  choice: onye ogbugbo
  rationale: Nke a bụ okwu Igbo a na-ejikarị akọwa onye na-anọ n’etiti ndị abụọ ma ọ bụ akụkụ abụọ iji mee ka ha kwekọọ ma ọ bụ kwado nkwekọrịta; ọ dabara n’echiche iwu na ọgbụgba ndụ dị n’amaokwu a.
- source_word: ἑνὸς
  choice: nke otu onye
  rationale: E debere mkpụmkpụ na mgbagwoju anya nke okwu Grik ahụ. N’ebe a, “otu onye” nwekwara ike ịpụta otu akụkụ n’ime ndị nwere okwu, ma e tinyeghị nkọwa ahụ n’ahịrị amaokwu ka a ghara idozi okwu Pọl karịa ka isi mmalite si kwuo.
- source_word: οὐκ ἔστιν
  choice: abụghị
  rationale: Nke a na-asụgharị okwu ahụ ozugbo ma na-echekwa ike nke ahịrịokwu Grik ahụ dị mkpụmkpụ.
- source_word: δὲ
  choice: ma
  rationale: E jiri “ma” gosi ọdịiche dị n’etiti okwu banyere onye ogbugbo na nkwupụta na Chineke bụ otu. δέ nke mbụ adịghị mkpa ka e jiri okwu mmalite pụrụ iche sụgharịa ya n’Igbo.
- source_word: θεὸς εἷς ἐστιν
  choice: Chineke bụ otu
  rationale: Nke a bụ nsụgharị kwụ ọtọ, dị ùgwù, nke na-echekwa nkwupụta dị mfe ma sie ike banyere ịdị-otu Chineke.
theological_decisions:
- issue: Ihe okwu Pọl dị mkpụmkpụ n’ahịrị nke mbụ pụtara
  choice: Onye ogbugbo abụghị nke otu onye
  alternative: Onye ogbugbo anaghị anọchite anya naanị otu akụkụ; ma ọ bụ, onye ogbugbo abụghị maka naanị otu onye.
  rationale: Galetia 3:20 siri ike ịkọwa, okwu Grik ahụ bụkwa nke e nwere ike ịghọta n’ụzọ dị iche iche. Nsụgharị ahụ na-echekwa mgbagwoju anya ya kama ịkọwapụta ya dịka ozizi zuru ezu banyere iwu, Mozis, Kraịst, ma ọ bụ ọgbụgba ndụ.
- issue: Nkwupụta “Chineke bụ otu”
  choice: E debere ya dịka nkwupụta doro anya na Chineke bụ otu.
  alternative: Chineke bụ otu Chineke.
  rationale: Ụdị a na-esochi okwu Grik nke ọma ma na-ahapụ ka onye na-agụ ya hụ njikọ o nwere ike inwe na nkwupụta okwukwe Izrel, n’etinyeghị nkọwa ọzọ n’ime amaokwu ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe nghọta ma dị ùgwù. “Onye ogbugbo” bụ okwu a maara nke ọma ma na-echekwa ọnọdụ onye nọ n’etiti akụkụ dị iche iche. E zere nkọwa ụka pụrụ iche, a hapụkwara mgbagwoju anya nke ahịrị mbụ ka ọ dị.
