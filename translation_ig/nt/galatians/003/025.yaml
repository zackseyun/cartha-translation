id: GAL.3.25
reference: Galatians 3:25
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐλθούσης δὲ τῆς πίστεως οὐκέτι ὑπὸ παιδαγωγόν ἐσμεν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/025.yaml
  text: But now that faith has come[b][a], we are no longer under a guardian.
translation:
  language: ig
  text: Ma ugbu a okwukwe abịala[a], anyị anọkwaghị n'okpuru onye nlekọta.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “okwukwe ahụ abịala.”
    reason: alternative_reading
  - marker: b
    text: Okwu Grik a na-ezo aka n'onye na-elekọta ma na-achịkwa nwata n'ezinụlọ, ọ bụghị karịchaa onye nkụzi n'ụlọ akwụkwọ.
    reason: cultural_note
lexical_decisions:
- source_word: ἐλθούσης
  choice: ugbu a ... abịala
  rationale: A tụgharịrị nkebi a dị ka ahịrịokwu na-egosi oge n'Igbo. “Abịala” na-egosi na ọbịbịa ahụ emezuola ma na-emetụta ọnọdụ dị ugbu a.
- source_word: δὲ
  choice: Ma
  rationale: “Ma” na-egosi obere ọdịiche dị n'etiti oge iwu nọ na-arụ ọrụ nlekọta na ọnọdụ ọhụrụ ahụ.
- source_word: πίστεως
  choice: okwukwe
  rationale: “Okwukwe” bụ ntụgharị nkịtị nke πίστις n'ebe a, ma ọ naghị amanye nkọwa ahụ ka ọ bụrụ nanị usoro nkwenkwe; ihe odide ala peeji na-echekwa ohere ịghọta ya dị ka “okwukwe ahụ.”
- source_word: οὐκέτι
  choice: anyị anọkwaghị
  rationale: Ụdị a na-egosi n'ụzọ ebumpụta ụwa n'Igbo na ọnọdụ gara aga akwụsịla.
- source_word: ὑπὸ
  choice: n'okpuru
  rationale: Nke a na-echekwa ihe atụ Pọl ji kọwaa ịnọ n'okpuru nlekọta na ikike onye ọzọ.
- source_word: παιδαγωγόν
  choice: onye nlekọta
  rationale: N'omenala Gris na Rom, παιδαγωγός bụ onye ezinụlọ nyere ọrụ ilekọta na ịchịkwa nwata, ọ bụghị karịchaa onye nkụzi n'ụlọ akwụkwọ.
- source_word: ἐσμεν
  choice: anyị anọkwaghị
  rationale: Ngwaa “ịnọ” jikọtara ya na “-kwaghị” na-enye okwu Igbo doro anya maka “anyị adịkwaghị n'okpuru.”
theological_decisions:
- issue: Ihe “ọbịbịa okwukwe” pụtara n'okwu gbara ya gburugburu
  choice: “okwukwe abịala”
  alternative: “okwukwe ahụ abịala”
  rationale: Isi ederede na-eji “okwukwe” n'ụzọ nkịtị ma na-echekwa ọdịiche dị n'etiti oge iwu na ọnọdụ ọhụrụ Pọl na-ekwu maka ya. Ihe odide ala peeji na-egosi ntụgharị ọzọ nwere ike imesi oge ọhụrụ nke okwukwe ike, n'ebughị ụzọ kpebie esemokwu ahụ.
translation_notes:
  register: Standard Igbo dị ugbu a, dị mfe nghọta ma nwee ugwu. E debere ihe atụ nke ịnọ “n'okpuru” onye nlekọta, ma zere okwu nwere ike ime ka onye na-agụ ya chee na παιδαγωγός bụ naanị onye nkụzi.
