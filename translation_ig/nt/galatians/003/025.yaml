  source_fidelity: Isi ederede na-anọchi anya genitive absolute ἐλθούσης δὲ τῆς πίστεως nke ọma site na “Ma ugbu a okwukwe abịala,” ma na-echekwa mgbanwe dị n'etiti ọnọdụ gara aga na ọnọdụ dị ugbu a. “anyị anọkwaghị n'okpuru onye nlekọta” na-atụgharị οὐκέτι ὑπὸ παιδαγωγόν ἐσμεν n'enweghị mgbakwunye nkọwa.
  naturalness: Ahịrịokwu a bụ Igbo ọkọlọtọ doro anya ma na-agụ nke ọma. “Ugbu a ... abịala” na-egosi ọbịbịa mezuru emezụ nke nwere mkpa ugbu a, ebe “anyị anọkwaghị n'okpuru” bụ usoro ebumpụta ụwa.
  terminology: “Okwukwe” dabara na πίστις, ma ihe odide ala peeji na-echekwa nhọrọ “okwukwe ahụ” n'enweghị imechi mkpebi nkọwa. “Onye nlekọta” na ihe odide ala peeji ya na-akọwa παιδαγωγός n'ụzọ ziri ezi dịka onye nlekọta/onye na-achịkwa nwata, ọ bụghị naanị onye nkụzi.
