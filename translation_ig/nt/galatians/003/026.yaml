  text: For you are all sons of God through faith in Messiah Jesus[a][b].
translation:
  language: ig
  text: N’ihi na unu niile bụ ụmụ Chineke[a] site n’okwukwe, n’ime Jizọs, Onye e tere mmanụ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ụmụ ndị ikom nke Chineke.” N’asụsụ Grik, okwu ahụ bụ “ụmụ ndị ikom,” na-echekwa echiche banyere ọnọdụ ịbụ nwa na ihe nketa dịka Pọl si eji ya eme ihe.
    reason: lexical_alternative
  - marker: b
    text: 'N’ụdị a na-asụkarị n’ọgbakọ: “Kraịst Jizọs.” “Onye e tere mmanụ” bụ ihe utu aha Grik, Χριστός, pụtara.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντες
  choice: unu niile
  rationale: Ngwaa ἐστε bụ onye nke abụọ n’ụbara; “unu niile” na-eme ka o doo anya na okwu a metụtara ndị niile a na-agwa.
- source_word: γὰρ
  choice: N’ihi na
  rationale: Ọ na-ejikọta amaokwu a na ihe bu ya ụzọ dịka ihe kpatara ya ma ọ bụ ntọala ya.
- source_word: υἱοὶ θεοῦ
  choice: ụmụ Chineke
  rationale: Nke a bụ ụzọ Igbo si ekwu ya n’ụzọ ebumpụta ụwa ma na-agụnye ọgbakọ dum. Ihe odide Grik kwuru kpọmkwem “ụmụ ndị ikom”; e debere nkọwa ọnọdụ ịbụ nwa na ihe nketa ya n’ala ala peeji.
- source_word: διὰ τῆς πίστεως
  choice: site n’okwukwe
  rationale: “Site” na-egosipụta ụzọ ma ọ bụ ihe e ji enweta ya, ebe “okwukwe” bụ ntụgharị kwesịrị ekwesị nke πίστις n’ebe a.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: n’ime Jizọs Onye E Tere Mmanụ
  rationale: “N’ime” na-echekwa asụsụ Pọl banyere ịdị n’ime Onye ahụ; “Onye E Tere Mmanụ” na-atụgharị Χριστός dịka utu aha, ebe Jizọs ka bụ aha.
theological_decisions:
- issue: Asụsụ ịbụ nwa nwoke na ọnọdụ ihe nketa
  choice: ụmụ Chineke, tinyere nkọwa ala ala peeji na Grik kwuru “ụmụ ndị ikom”
  alternative: ụmụ ndị ikom nke Chineke
  rationale: Ụdị ọzọ ahụ na-ada arọ ma nwee ike ime ka onye na-agụ ya chee na ọ bụ naanị ndị nwoke ka a na-ekwu maka ha. “Ụmụ Chineke” bụ Igbo doro anya maka ọgbakọ dum, ebe nkọwa ahụ na-echekwa ụda Pọl banyere ọnọdụ nwa nwoke na ikike ihe nketa.
- issue: Ntughari Χριστός
  choice: Jizọs Onye E Tere Mmanụ
  alternative: Kraịst Jizọs
  rationale: Χριστός bụ utu aha pụtara onye e tere mmanụ. Ịtụgharị ihe ọ pụtara na-echekwa ọrụ utu aha ahụ kama ile ya anya dịka aha nkịtị.
- issue: Njikọ ἐν na okwukwe ma ọ bụ ịdị n’ime Onye E Tere Mmanụ
  choice: site n’okwukwe n’ime Jizọs Onye E Tere Mmanụ
  alternative: site n’okwukwe, ebe unu nọ n’ime Jizọs Onye E Tere Mmanụ
  rationale: 'Usoro a na-esochi njikọta okwu Grik ma ghara ikewapụ n’ike ihe odide ahụ nwere ike ijikọ: okwukwe a tụkwasịrị n’Onye E Tere Mmanụ na ọnọdụ ịdị n’ime ya.'
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. “Ụmụ Chineke” bụ okwu ebumpụta ụwa karịa “ụmụ ndị ikom nke Chineke”; ala ala peeji na-echekwa nkọwa nwoke na ọnọdụ ihe nketa dị na υἱοί. E debere “n’ime” iji chekwaa asụsụ Pọl banyere ịdị n’ime Onye E Tere Mmanụ.
