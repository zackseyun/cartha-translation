id: GAL.3.13
reference: Galatians 3:13
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Χριστὸς ἡμᾶς ἐξηγόρασεν ἐκ τῆς κατάρας τοῦ νόμου γενόμενος ὑπὲρ ἡμῶν κατάρα, ⸂ὅτι γέγραπται⸃· Ἐπικατάρατος πᾶς ὁ κρεμάμενος ἐπὶ ξύλου,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/013.yaml
  text: 'The Messiah redeemed us from the curse of the law by becoming a curse for us[d][c][b][a], because it is written: “Cursed is everyone who hangs on a tree.”'
translation:
  language: ig
  text: Mesaịa ahụ[a] gbapụtara anyị n'ọbụbụ ọnụ nke iwu ahụ site n'ịghọ ọbụbụ ọnụ maka anyị[b], n'ihi na e dere, sị:[c] “Onye ọ bụla a kpọgidere n'osisi[d] bụ onye a bụrụ ọnụ.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Kraịst ahụ.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “maka ọdịmma anyị”; o nwekwara ike ịpụta, “n'ọnọdụ anyị.”
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “n'ihi na e dere, sị,” n'echiche nke “n'ihi na Akwụkwọ Nsọ kwuru.”
    reason: alternative_reading
  - marker: d
    text: Okwu Grik ξύλον pụtara n'ụzọ nkịtị “osisi” ma ọ bụ “ihe e ji osisi rụọ.” “Osisi” na-edobe okwu e ji hota Akwụkwọ Nsọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Χριστός
  choice: Mezaịa ahụ
  rationale: A sụgharịrị aha-ọkwa ahụ ka ọ bụrụ “Mezaịa” iji gosipụta echiche nke Onye E Tere Mmanụ; “ahụ” na-eme ka ọ bụrụ aha-ọkwa a maara nke ọma n'okwu a.
- source_word: ἐξηγόρασεν
  choice: gbapụtara
  rationale: “Gbapụtara” bụ okwu Igbo doro anya maka ịtọhapụ mmadụ site n'ịkwụ ụgwọ ma ọ bụ site n'ike nzọpụta; ọ na-edobe ma echiche ịzụta onye pụọ n'okpuru ikike ma echiche nzọpụta.
- source_word: κατάρας / κατάρα
  choice: ọbụbụ ọnụ
  rationale: Okwu a na-edobe ịdị arọ nke ikpe na ọbụbụ ọnụ dị n'okwu Grik ahụ, ma n'okwu “ọbụbụ ọnụ nke iwu” ma n'okwu na-awụ akpata oyi “ịghọ ọbụbụ ọnụ.”
- source_word: νόμου
  choice: iwu ahụ
  rationale: “Iwu ahụ” na-egosi iwu a na-ekwu maka ya n'ọnọdụ a, ya bụ Iwu Mosis, n'enweghị ịgbakwunye nkọwa ahụ n'ime amaokwu.
- source_word: γενόμενος
  choice: site n'ịghọ
  rationale: Nke a na-egosi na ịghọ ọbụbụ ọnụ bụ ụzọ e si gbapụta anyị, ma na-edobekwa njikọ nke participle Grik ahụ.
- source_word: ὑπὲρ ἡμῶν
  choice: n'ihi anyị
  rationale: “N'ihi anyị” na-egosi na ihe ahụ mere maka ọdịmma anyị ma ghara ikpebi n'ụzọ dị warara ma ọ pụtara nanị ịnọchite anya anyị ma ọ bụ ịnọ n'ọnọdụ anyị.
- source_word: ὅτι γέγραπται
  choice: n'ihi na e dere, sị
  rationale: Nke a na-enye okwu ahụ ike nke ihe kpatara ma na-ewebata ihe e dere n'Akwụkwọ Nsọ n'Igbo dị mma.
- source_word: Ἐπικατάρατος
  choice: A bụrụla … ọnụ
  rationale: Usoro a bụ ụzọ Igbo dị ndụ na nke siri ike isi kwuo na mmadụ nọ n'okpuru ọbụbụ ọnụ.
- source_word: κρεμάμενος
  choice: a kwụbara
  rationale: N'ebe a, passive Igbo dabara n'okwu e hotara banyere onye e mere ka ọ kwụ n'osisi, ma na-agụ nke ọma dịka okwu Akwụkwọ Nsọ.
- source_word: ξύλου
  choice: osisi
  rationale: “Osisi” nwere ike ịpụta tree ma ọ bụ ihe osisi e ji rụọ, ma ebe a ọ na-edobe okwu nke amaokwu e hotara na njikọ ya na Diuterọnọmi.
theological_decisions:
- issue: Ókè echiche ὑπὲρ ἡμῶν n'okwu gbasara mgbaghara mmehie
  choice: n'ihi anyị
  alternative: maka ọdịmma anyị; n'ọnọdụ anyị
  rationale: Okwu Grik ahụ na-egosi na Kraịst mere nke a maka anyị ma nwee ike ibu echiche ịnọchite anya anyị, ma ya onwe ya anaghị amanye onye nsụgharị ịhọrọ otu nkọwa ozizi dị warara.
- issue: Ike nke okwu γενόμενος κατάρα
  choice: ịghọ ọbụbụ ọnụ
  alternative: ịghọ onye a bụrụ ọnụ
  rationale: A hapụrụ okwu Pọl dịka noun, “ọbụbụ ọnụ,” kama ime ka ọ dị nro dịka naanị adjective. Nke a na-edobe ike na esemokwu nkà mmụta okpukpe dị n'okwu ahụ.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. A họọrọ “Mezaịa” dịka ntụgharị aha-ọkwa, ebe e debere “Kraịst” n'okpuru nkọwa ọzọ. Ahịrịokwu ahụ na-edobe nkwughachi siri ike nke “ọbụbụ ọnụ” nke dị na Grik, ma ghara itinye ozizi otu ụka n'okwu ὑπὲρ ἡμῶν.
