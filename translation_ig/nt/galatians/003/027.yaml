revisions:
- from: N’ihi na unu niile e mere baptizim ịbanye n’ime Kraịst eyikwasịla Kraịst dịka uwe.[a]
  to: N’ihi na ndị niile n’ime unu e mere baptizim n’ime Kraịst eyikwasịla Kraịst dị ka uwe.
  rationale: The revision preserves the qualifying force of ὅσοι, expresses baptism directly ‘into Christ,’ and retains the completed clothing metaphor without adding doctrinal interpretation. The unnecessary footnote is omitted.
  reviewer_model: gpt-5.6-terra
