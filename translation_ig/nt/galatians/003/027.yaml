  text: ὅσοι γὰρ εἰς Χριστὸν ἐβαπτίσθητε, Χριστὸν ἐνεδύσασθε·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/027.yaml
  text: For as many of you as were baptized into Messiah have put on Messiah[a][b].
translation:
  language: ig
  text: N’ihi na ndị niile n’ime unu e mere baptizim n’ime Kraịst eyikwasịla Kraịst dị ka uwe.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅσοι
  choice: unu niile
  rationale: N’ọnọdụ a, ọ na-ezo aka n’òtù niile n’etiti ndị a na-agwa okwu bụ́ ndị e mere baptizim; okwu a dị mfe ma na-edobe oke nke ὅσοι.
- source_word: γὰρ
  choice: N’ihi na
  rationale: Ọ na-edobe njikọ nkọwa amaokwu a na arụmụka dị n’amaokwu bu ya ụzọ.
- source_word: εἰς
  choice: ịbanye n’ime
  rationale: Ọ na-egosipụta ntụziaka na njikọ nke εἰς Χριστόν n’Igbo nkịtị, n’etinyeghị nkọwa ụka banyere otú njikọ ahụ si arụ ọrụ.
- source_word: Χριστόν
  choice: Kraịst
  rationale: Kraịst bụ aha-utu a maara nke ọma n’Igbo maka Χριστός, ma ọ ka na-egosi Onye E Tere Mmanụ.
- source_word: ἐβαπτίσθητε
  choice: e mere baptizim
  rationale: Ọ na-edobe olu nnara nke ngwaa Grik ma zere ikpebi otu e si eji mmiri eme baptizim.
- source_word: ἐνεδύσασθε
  choice: eyikwasịla Kraịst dịka uwe
  rationale: Ọ na-eme ka ihe atụ nke iyikwasị uwe doo anya n’Igbo ma na-edobe nsonaazụ omume ahụ ruo ugbu a.
theological_decisions:
- issue: Ma okwu baptizim a ò kwesịrị ịkwado otu ozizi pụrụ iche banyere ihe baptizim na-arụ ma ọ bụ otu e si eme ya.
  choice: e mere baptizim ịbanye n’ime Kraịst
  alternative: e mikpuru unu n’ime Kraịst; e mere unu baptizim n’ihe metụtara Kraịst
  rationale: Grik ahụ na-ekwu banyere baptizim ‘n’ime Kraịst,’ ma ọ naghị edozi arụmụka ndị e mechara nwee banyere nrụpụta sakrament ahụ ma ọ bụ etu e si eji mmiri eme ya.
translation_notes:
  register: Asụsụ Igbo zuru ụwa ọnụ, nke ugwu ma dị mfe nghọta. E ji “Kraịst” mee ihe n’ihi na ọ bụ aha-utu a maara nke ọma n’Igbo; a kọwaghị ihe atụ nke uwe n’ụzọ ga-ewepụ omimi ya.
