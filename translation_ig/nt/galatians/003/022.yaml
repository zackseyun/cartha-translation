id: GAL.3.22
reference: Galatians 3:22
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀλλὰ συνέκλεισεν ἡ γραφὴ τὰ πάντα ὑπὸ ἁμαρτίαν ἵνα ἡ ἐπαγγελία ἐκ πίστεως Ἰησοῦ Χριστοῦ δοθῇ τοῖς πιστεύουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/022.yaml
  text: But the Scripture imprisoned everything under sin[b][a], so that the promise by faith in Jesus the Messiah might be given to those who believe.
translation:
  language: ig
  text: Ma Akwụkwọ Nsọ kpọchibidoro ihe niile n'okpuru mmehie,[a] ka e wee nye ndị na-ekwere nkwa ahụ sitere n'okwukwe n'ime Jizọs Mesaịa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “mechibidoro ihe niile n'okpuru mmehie.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “site n'ikwesị ntụkwasị obi Jizọs Mesaịa.”
    reason: alternative_reading
lexical_decisions:
- source_word: συνέκλεισεν
  choice: kpọchibidoro
  rationale: Ọ na-egosi imechi ihe n'ime ọnọdụ a na-apụghị isi na ya pụta, dị ka onye nọ n'okpuru njide, ma na-ada nke ọma n'Igbo ugbu a.
- source_word: ἡ γραφή
  choice: Akwụkwọ Nsọ
  rationale: Nke a bụ aha Igbo a na-ejikarị akpọ Scripture; e debere ya dị ka otu akaebe nke na-eme ihe n'ahịrịokwu ahụ.
- source_word: τὰ πάντα
  choice: ihe niile
  rationale: Ọ na-edobe obosara nke neuter plural ahụ n'ebughị ụzọ kpebie na ọ bụ naanị mmadụ ka a na-ekwu maka ha.
- source_word: ὑπὸ ἁμαρτίαν
  choice: n'okpuru mmehie
  rationale: Ọ na-edobe ihe atụ Pọl ji kọwaa ịbụ onye mmehie chịkọtara, n'etinyeghị nkọwa dị ka 'ike' ma ọ bụ 'ọchịchị' n'ime isi okwu.
- source_word: ἡ ἐπαγγελία
  choice: nkwa ahụ
  rationale: Nke a bụ ntụgharị kpọmkwem ma doo anya nke 'the promise,' na-edobekwa definite article ahụ.
- source_word: ἐκ πίστεως Ἰησοῦ Χριστοῦ
  choice: site n'okwukwe n'ime Jizọs Mesaịa
  rationale: Isi okwu họọrọ objective-genitive reading, ya bụ okwukwe a tụkwasịrị na Jizọs Mesaịa; e debere subjective-genitive reading n'ala peeji.
- source_word: Χριστοῦ
  choice: Mesaịa
  rationale: N'ebe a Χριστός bụ utu aha e jikọtara na Jizọs; 'Mesaịa' na-eme ka ọrụ utu aha ahụ pụta ìhè.
- source_word: δοθῇ
  choice: ka e wee nye
  rationale: Usoro a na-egosi nzube nke ἵνα tinyere passive subjunctive n'ụzọ sitere n'okike n'Igbo.
- source_word: τοῖς πιστεύουσιν
  choice: ndị kwere ekwe
  rationale: Ọ na-egosi ndị na-eme omume ikwere, ma bụrụkwa okwu Igbo doro anya ma dị ndụ.
theological_decisions:
- issue: 'πίστεως Ἰησοῦ Χριστοῦ: ụdị genitive'
  choice: 'objective genitive: “okwukwe n''ime Jizọs Mesaịa”'
  alternative: 'subjective genitive: “ikwesị ntụkwasị obi nke Jizọs Mesaịa”'
  rationale: Greek ahụ nwere nghọta abụọ a na-agbagha agbagha. Isi okwu na-eji nghọta nke okwukwe mmadụ tụkwasịrị na Jizọs, ebe ala peeji na-echekwa nghọta nke ikwesị ntụkwasị obi Jizọs n'onwe ya.
translation_notes:
  register: Asụsụ ahụ bụ Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. “Kpọchibidoro” na-edobe ihe atụ nke njide; “ihe niile” na-echekwa obosara Greek; e zere itinye nkọwa ụka pụrụ iche n'ime isi okwu.
