id: GAL.3.21
reference: Galatians 3:21
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ὁ οὖν νόμος κατὰ τῶν ἐπαγγελιῶν τοῦ θεοῦ; μὴ γένοιτο· εἰ γὰρ ἐδόθη νόμος ὁ δυνάμενος ζῳοποιῆσαι, ὄντως ⸂ἐκ νόμου ἂν⸃ ἦν ἡ δικαιοσύνη.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/021.yaml
  text: Is the law then against the promises of God? May it never be! For if a law had been given that was able to give life[a], then righteousness really would have been from the law.
translation:
  language: ig
  text: Ya mere, iwu ahụ ọ̀ na-emegide nkwa Chineke? Mba, ọ dịghị ma ọlị! N’ihi na a sị na e nyere iwu nke pụrụ inye ndụ, mgbe ahụ ezi omume[a] gaara esite n’iwu n’ezie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ikpe ziri ezi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: νόμος
  choice: iwu / iwu ahụ
  rationale: “Iwu” na-edobe okwu Pọl ka ọ bụrụ iwu n’ozuzu ya, ebe “iwu ahụ” n’ajụjụ mbụ na-egosipụta article Grik ma na-ahapụkwa njikọ ya na Iwu Mosis n’ọnọdụ a.
- source_word: κατὰ
  choice: na-emegide
  rationale: N’ebe a κατά na genitive na-egosi mmegide; “na-emegide” bụ okwu Igbo doro anya ma kwekọọ n’ajụjụ arụmụka ahụ.
- source_word: ἐπαγγελιῶν
  choice: nkwa niile
  rationale: “Nkwa” na-enye ihe okwu ahụ pụtara, ebe “niile” na-eme ka plural Grik pụta ìhè n’Igbo.
- source_word: μὴ γένοιτο
  choice: Mba, ọ dịghị ma ọlị!
  rationale: Nke a na-egosipụta ike nke usoro okwu Pọl ji jụ echiche ahụ kpamkpam, n’Igbo eke ma dị ùgwù.
- source_word: ἐδόθη
  choice: a sị na e nyere
  rationale: Nke a na-enye ọnọdụ hypothetical nke conditional Grik nke ọma n’Igbo, n’enweghị ikwu na e nyere ụdị iwu ahụ n’ezie.
- source_word: δυνάμενος
  choice: nke pụrụ
  rationale: Ọ na-akọwa ikike iwu ahụ gaara enwe, ma na-agụ nke ọma n’Igbo.
- source_word: ζῳοποιῆσαι
  choice: inye ndụ
  rationale: “Inye ndụ” bụ ntụgharị Igbo dị mfe ma ziri ezi maka echiche ime ka mmadụ dị ndụ.
- source_word: ὄντως
  choice: n’ezie
  rationale: Ọ na-eme ka nkwubi okwu ahụ sie ike dịka adverb Grik si eme.
- source_word: ἐκ νόμου
  choice: esite n’iwu
  rationale: “Esite n’iwu” na-echekwa echiche isi mmalite dị na ἐκ karịa ntụgharị nke ga-egosi naanị ụzọ e si eme ihe.
- source_word: δικαιοσύνη
  choice: ezi omume
  rationale: “Ezi omume” bụ okwu Igbo a na-aghọta nke ọma maka righteousness, ma ntụgharị ọzọ “ikpe ziri ezi” ka edobere n’ala peeji iji chekwaa obosara okwu Grik ahụ.
theological_decisions:
- issue: Ihe δικαιοσύνη pụtara n’arụmụka Pọl
  choice: ezi omume
  alternative: ikpe ziri ezi
  rationale: N’ọnọdụ a, okwu ahụ metụtara ọnọdụ ziri ezi n’ihu Chineke n’ihe gbasara iwu na nkwa. “Ezi omume” dabara n’arụmụka ahụ, ma “ikpe ziri ezi” ka bụ ụzọ ọzọ okwu Grik ahụ pụrụ isi pụta; ya mere e tinyere ya n’ala peeji kama ikpochapụ mgbagwoju ahụ.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. A hapụrụ okwu “iwu” ka ọ ghara ịbụ naanị aha pụrụ iche maka Iwu Mosis, n’ihi na ahịrịokwu conditional na-ekwu banyere iwu dịka ụdị ihe n’ozuzu ya, ọ bụ ezie na Iwu Mosis ka dị n’azụ arụmụka ahụ. E debere akara ala peeji [a] n’akụkụ “ezi omume,” ebe ọ bụ δικαιοσύνη—ọ bụghị ζῳοποιῆσαι—ka ntụgharị ọzọ “ikpe ziri ezi” metụtara.
