  text: εἰ δὲ ὑμεῖς Χριστοῦ, ἄρα τοῦ Ἀβραὰμ σπέρμα ἐστέ, ⸀κατ’ ἐπαγγελίαν κληρονόμοι.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/029.yaml
  text: And if you are Messiah’s[a], then you are Abraham’s seed[b], heirs according to promise.
translation:
  language: ig
  text: Ọ bụrụkwa na unu bụ ndị nke Onye Mesaịa[a], mgbe ahụ unu bụ mkpụrụ Ebreham[b], bụrụkwa ndị nketa dị ka nkwa si dị.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ “Kraịst.” Okwu Grik ahụ bụ utu aha pụtara “Onye E Tere Mmanụ.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ “ụmụ” ma ọ bụ “ụmụ ụmụ.” Okwu Grik a sụgharịrị “mkpụrụ” dị n’otu, ma ọ bụ aha nchịkọta; ọ na-ekwughachikwa okwu Pọl ji mee ihe n’isiakwụkwọ a.
    reason: lexical_alternative
lexical_decisions:
- source_word: Χριστοῦ
  choice: ndị nke Onye Mezaịa
  rationale: Χριστός bụ utu aha pụtara “Onye E Tere Mmanụ,” ya mere “Onye Mezaịa” na-egosipụta utu aha ahụ. Ụdị okwu “ndị nke” na-egosi n'ụzọ Igbo dị ire na mmadụ bụ nke ya, dị ka genitive Grik si kwuo.
- source_word: σπέρμα
  choice: mkpụrụ
  rationale: “Mkpụrụ” na-edobe okwu ihe atụ ahụ na ịdị n’otu nke okwu Grik, ma na-ejikọ amaokwu a na arụmụka Pọl banyere “mkpụrụ” Ebreham n’isiakwụkwọ a. N’ebe a ọ bụ aha nchịkọta nke na-ezo aka ná ndị sitere n’Ebreham.
- source_word: κληρονόμοι
  choice: ndị nketa
  rationale: “Ndị nketa” bụ okwu Igbo doro anya maka ndị nwere ikike ịnata ihe nketa, ma dabara n’ọnọdụ ezinụlọ na nkwa ọgbụgba ndụ a.
- source_word: κατ’ ἐπαγγελίαν
  choice: dị ka nkwa ahụ si dị
  rationale: Nsụgharị a na-edobe nghọta sara mbara nke κατά—ịdị n’usoro ma ọ bụ n’ụzọ kwekọrọ ná nkwa—na-enweghị ikpebi na ọ pụtara naanị ihe ndabere ma ọ bụ naanị ụkpụrụ.
- source_word: εἰ δὲ ὑμεῖς ... ἄρα
  choice: Ọ bụrụkwa na unu ... mgbe ahụ
  rationale: Nke a na-edobe njikọ dị mfe nke δέ na usoro echiche ọnọdụ-na-nsonaazụ nke εἰ ... ἄρα n’Igbo dị mma.
theological_decisions:
- issue: Ma a ga-eji okwu nchịkọta dị mfe dochie σπέρμα, ka a ga-edobe ihe atụ “mkpụrụ” nke jikọtara amaokwu a na arụmụka Pọl gara aga.
  choice: mkpụrụ
  alternative: ụmụ; ụmụ ụmụ; ụmụ Ebreham
  rationale: Iji “mkpụrụ” na-edobe njikọ okwu na nke nkà mmụta okpukpe dị na Ndị Galeshia 3, ma ihe odide ala peeji na-akọwa na ọ bụ aha nchịkọta.
- issue: Ma Χριστοῦ ga-apụta dị ka aha “Kraịst” ka ọ bụ dị ka utu aha “Onye Mezaịa.”
  choice: Onye Mezaịa
  alternative: Kraịst
  rationale: Χριστός ka na-arụ ọrụ dị ka utu aha n’ebe a. “Onye Mezaịa” na-eme ka ọrụ utu aha ahụ pụta ìhè, ebe ihe odide ala peeji na-enye nsụgharị omenala “Kraịst.”
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta, mee ihe. “Ndị nke Onye Mezaịa” na-ada nke ọma n’Igbo ma na-edobe echiche nke ịbụ nke ya; “mkpụrụ” na-edobe njikọ okwu dị mkpa n’ime isiakwụkwọ ahụ.
