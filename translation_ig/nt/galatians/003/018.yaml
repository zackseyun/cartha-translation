id: GAL.3.18
reference: Galatians 3:18
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἰ γὰρ ἐκ νόμου ἡ κληρονομία, οὐκέτι ἐξ ἐπαγγελίας· τῷ δὲ Ἀβραὰμ δι’ ἐπαγγελίας κεχάρισται ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/018.yaml
  text: For if the inheritance is from the law[a], it is no longer from a promise; but God has graciously given it to Abraham through a promise.
translation:
  language: ig
  text: N’ihi na ọ bụrụ na ihe nketa ahụ sitere n’Iwu ahụ, ọ dịkwaghị esi ná nkwa; ma Chineke ejirila nkwa nye Ebreham ihe nketa ahụ n’amara.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κληρονομία
  choice: ihe nketa
  rationale: Nke a bụ okwu Igbo a na-ejikarị akọwa ihe mmadụ na-enweta dị ka onye nketa, ọ dabakwara n’arụmụka Pọl banyere Iwu na nkwa.
- source_word: ἐκ νόμου
  choice: sitere n’Iwu ahụ
  rationale: “Sitere” na-echekwa echiche nke isi mmalite dị na ἐκ, ebe “Iwu ahụ” na-ezo aka n’Iwu Mosis a na-atụle n’ebe a.
- source_word: ἐξ ἐπαγγελίας
  choice: site ná nkwa
  rationale: Nke a na-echekwa ọdịiche Pọl mere n’etiti isi na Iwu pụta na isi ná nkwa pụta, n’Igbo dị mfe ma doo anya.
- source_word: οὐκέτι
  choice: ọ dịkwaghị
  rationale: Ọ na-egosi na ọ bụrụ na ihe nketa ahụ sitere n’Iwu, a pụghịkwa ikwu na o sitere ná nkwa.
- source_word: δι’ ἐπαγγελίας
  choice: esila ná nkwa
  rationale: Nke a na-egosi na nkwa ahụ bụ ụzọ Chineke si nye Ebreham ihe nketa ahụ.
- source_word: κεχάρισται
  choice: were amara nye
  rationale: Ọ na-echekwa echiche nke inye n’amara dị na χαρίζομαι, na-egosikwa omume Chineke nke ihe ọ rụpụtara ka dị irè.
- source_word: τῷ Ἀβραὰμ
  choice: nye Ebreham
  rationale: Ọ na-egosi Ebreham dịka onye natara onyinye Chineke.
theological_decisions:
- issue: Ma a ga-eme ka echiche amara dị na κεχάρισται pụta ìhè
  choice: “were amara nye”
  alternative: “nyere” ma ọ bụ “nyere n’efu”
  rationale: “Were amara nye” na-echekwa njikọ okwu ahụ na amara n’enweghị itinye nkọwa ozizi ọzọ, ma na-akwado ọdịiche dị n’etiti Iwu na nkwa.
- issue: Mmekọrịta ihe nketa ahụ na Iwu ma ọ bụ nkwa
  choice: 'Echekwara okwu ọnọdụ ahụ: “ọ bụrụ na ... sitere n’Iwu ahụ”'
  alternative: Ịkọwa ya dị ka ịdabere n’idebe Iwu
  rationale: Asụsụ isi mmalite na-ekwu maka isi mmalite ihe nketa ahụ; ntụgharị ahụ anaghị agbakwunye nkọwa banyere ọrụ mmadụ karịa ihe amaokwu ahụ kwuru.
translation_notes:
  register: Asụsụ Igbo Izugbe, dị ùgwù ma dị mfe nghọta. E ji “Iwu” malite n’isi mkpụrụedemede iji gosi Iwu Mosis n’ọnọdụ a; e chekwara ugboro abụọ e ji “nkwa” mee ihe na ọdịiche ya na Iwu.
