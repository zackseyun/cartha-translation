id: GAL.3.5
reference: Galatians 3:5
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ οὖν ἐπιχορηγῶν ὑμῖν τὸ πνεῦμα καὶ ἐνεργῶν δυνάμεις ἐν ὑμῖν ἐξ ἔργων νόμου ἢ ἐξ ἀκοῆς πίστεως;
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/005.yaml
  text: So then[a], does the one who supplies the Spirit to you and works miracles among you do so by works of the law[b], or by hearing with faith?
translation:
  language: ig
  text: Ya mere, onye na-enye unu Mmụọ ahụ ma na-arụ ọrụ ebube n’etiti unu[a], ọ̀ na-eme nke a site n’ọrụ iwu, ka ọ̀ bụ site n’ịnụ ozi ahụ n’okwukwe[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’ime unu.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “site n’ịnụ okwukwe,” ma ọ bụ “site n’ozi a nụrụ ma jiri okwukwe nabata.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπιχορηγῶν
  choice: na-enye
  rationale: Ọ na-egosi inye ma ọ bụ iweta ihe a chọrọ n’ụzọ na-aga n’ihu; ọ bụkwa okwu Igbo doro anya ma dị mfe nghọta.
- source_word: τὸ πνεῦμα
  choice: Mmụọ ahụ
  rationale: Ọ na-edobe nrụtụ aka doro anya n’ebe Mmụọ Chineke nọ n’enweghị ịgbakwunye okwu ‘Nsọ,’ nke na-adịghị n’ahịrịokwu Grik a.
- source_word: ἐνεργῶν δυνάμεις
  choice: na-arụ ọrụ ebube
  rationale: Nke a na-ekwupụta n’Igbo nkịtị ọrụ dị ike nke Chineke nke okwu Grik a na-ezo aka na ya.
- source_word: ἐν ὑμῖν
  choice: n’etiti unu
  rationale: N’ọnọdụ a, ọ dabara nke ọma maka ọrụ ebube ndị a na-ahụ n’ọgbakọ ndị Galetia; e debere nghọta ọzọ, ‘n’ime unu,’ n’ala peeji.
- source_word: ἐξ ἔργων νόμου
  choice: site n’ọrụ iwu
  rationale: Ọ na-edobe okwu Pọl banyere ‘ọrụ iwu’ ma na-egosi isi iyi ma ọ bụ ụzọ e si eme ihe n’Igbo eke.
- source_word: ἀκοῆς πίστεως
  choice: site n’ịnụ ozi ahụ na okwukwe
  rationale: Ọ na-egosi ịnụ ozi nke okwukwe sonyere ya, ma ghara ikpuchi na njikọ okwu Grik ahụ nwere ike ịghọta n’ụzọ ndị ọzọ dị nso.
- source_word: πίστεως
  choice: okwukwe
  rationale: ‘Okwukwe’ bụ okwu Igbo kacha kwekọọ na πίστις n’arụmụka a, ebe Pọl na-atụnyere ya na ọrụ iwu.
theological_decisions:
- issue: Njikọ okwu ἀκοῆς πίστεως nwere ike ịkọwa ma ịnụ ihe e ji okwukwe nabata, ma ọ bụ ịnụ ozi gbasara okwukwe.
  choice: ịnụ ozi ahụ na okwukwe
  alternative: ịnụ nke okwukwe; ma ọ bụ ịnụ ozi ahụ e ji okwukwe nabata
  rationale: Nhọrọ bụ isi na-eme ka ọdịiche Pọl na-egosi n’etiti ọrụ iwu na ịnụ nke okwukwe sonyere ya pụta ìhè, ebe ala peeji na-echekwa nghọta ndị ọzọ okwu Grik ahụ nwere ike ibu.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ ka bụ ajụjụ nkwupụta siri ike dịka n’asụsụ Grik, a hapụkwara ‘ọrụ iwu’ dịka okwu Pọl n’enweghị ịtụgharị ya ka ọ bụrụ nkọwa otu ụka.
