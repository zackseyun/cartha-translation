id: GAL.3.9
reference: Galatians 3:9
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὥστε οἱ ἐκ πίστεως εὐλογοῦνται σὺν τῷ πιστῷ Ἀβραάμ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/009.yaml
  text: So then[a], those who are of faith are blessed along with Abraham, the faithful one.
translation:
  language: ig
  text: Ya mere, a na-agọzi ndị nwere okwukwe, ha na Ebreham, onye kwesịrị ntụkwasị obi,[a] ọnụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “Ebreham, onye kwere ekwe,” ma ọ bụ, “Ebreham, onye nwere okwukwe.”
    reason: alternative_reading
lexical_decisions:
- source_word: ὥστε
  choice: Ya mere
  rationale: Na-egosi nkwubi okwu sitere n’arụmụka bu ụzọ ma bụrụkwa okwu Igbo doro anya ma dịrị ndị mmadụ mfe.
- source_word: οἱ ἐκ πίστεως
  choice: ndị nwere okwukwe
  rationale: Ọ bụ ụzọ Igbo dị n’ụzọ nkịtị isi kọwaa ndị e ji okwukwe mara, n’enweghị itinye echiche ọzọ na-adịghị na Grik.
- source_word: πίστεως
  choice: okwukwe
  rationale: N’ebe a, πίστις na-ekwu banyere ikwere ma ọ bụ ịtụkwasị obi; “okwukwe” bụ okwu Igbo a na-aghọta nke ọma ma kwekọọ n’arụmụka banyere Ebreham.
- source_word: εὐλογοῦνται
  choice: a na-agọzi
  rationale: Na-edobe olu nnara nke Grik, nke na-egosi na ha na-anata ngọzi kama ịbụ na ha ji aka ha nweta ya.
- source_word: σὺν
  choice: ọnụ na
  rationale: Na-egosi n’ụzọ Igbo nkịtị na ndị nwere okwukwe na Ebreham na-ekekọrịta otu ngọzi ahụ.
- source_word: τῷ πιστῷ Ἀβραάμ
  choice: Ebreham, onye kwesịrị ntụkwasị obi
  rationale: Na-edobe ihe πιστός nwere ike ịpụta dịka “onye kwesịrị ntụkwasị obi,” ebe a na-etinye nghọta ọzọ, “onye kwere ekwe,” n’ala ala peeji ka a ghara iwepụ nghọta abụọ ahụ.
theological_decisions:
- issue: Ma πιστός nke na-akọwa Ebreham ọ pụtara “onye kwesịrị ntụkwasị obi” ka ọ bụ “onye kwere ekwe”
  choice: Ebreham, onye kwesịrị ntụkwasị obi
  alternative: Ebreham, onye kwere ekwe; ma ọ bụ, Ebreham nwere okwukwe
  rationale: πιστός nwere ike ịkọwa onye kwesịrị ntụkwasị obi ma ọ bụ onye kwere ekwe. N’agbanyeghị na ihe gbara amaokwu a gburugburu lekwasịrị anya n’okwukwe Ebreham, isiokwu ahụ nwere nghọta abụọ; ya mere, e debere otu n’isi ederede ma chekwaa nke ọzọ n’ala ala peeji.
translation_notes:
  register: Standard Igbo; natural, current, and dignified. The wording avoids archaic idiom while retaining the passive blessing and the ambiguity of πιστός.
