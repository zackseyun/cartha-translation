    issue: Less idiomatic rendering of σὺν
    rationale: “ọnụ na Ebreham” is comprehensible, but “ya na Ebreham ... ọnụ” is more natural Standard Igbo for ‘together with Abraham.’
  - severity: low
    issue: Footnote anchor is placed at the sentence end
    rationale: The note concerns πιστῷ / “onye kwesịrị ntụkwasị obi,” so its marker should immediately follow that phrase.
