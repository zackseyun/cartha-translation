source:
  edition: SBLGNT
  text: Ὦ ἀνόητοι Γαλάται, τίς ὑμᾶς ⸀ἐβάσκανεν, οἷς κατ’ ὀφθαλμοὺς Ἰησοῦς Χριστὸς ⸀προεγράφη ἐσταυρωμένος;
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/001.yaml
  text: You foolish Galatians[a], who has bewitched you[c][b], before whose eyes Jesus the Messiah was publicly portrayed as crucified?
translation:
  language: ig
  text: Unu ndị Galeshia na-enweghị uche! Ònye mere unu ọgwụ[a]? N’ihu unu ka e gosipụtara Jizọs, bụ Mesaya[b], n’ụzọ doro anya dị ka onye a kpọgidere n’obe[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ: “Ònye duhiere unu?” Okwu Grik ahụ na-akpalite echiche nke ime mmadụ ọgwụ ma ọ bụ ịtụ ya afa.'
    reason: lexical_alternative
  - marker: b
    text: 'Grik: “Jizọs Kraịst.” N’ebe a, a sụgharịrị “Kraịst” dị ka “Mesaya” iji chekwaa ihe utu aha ahụ pụtara.'
    reason: lexical_alternative
  - marker: c
    text: 'Ma ọ bụ: “e depụtara ya n’ihu unu n’ụzọ pụtara ìhè dị ka onye a kpọgidere n’obe,” ma ọ bụ “e tinyere ya n’ihu ọha dị ka n’akwụkwọ ọkwa, dị ka onye a kpọgidere n’obe.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνόητοι
  choice: na-enweghị uche
  rationale: Na-egosipụta mba Pọl baara ha n’ihi na ha aghọtaghị ihe, n’etinyeghị ikpe omume siri ike karịa okwu Grik ahụ.
- source_word: Γαλάται
  choice: ndị Galeshia
  rationale: Aha a na-akpọ ndị bi na Galeshia n’Igbo n’ụzọ doro anya ma dị mfe nghọta.
- source_word: ἐβάσκανεν
  choice: mere unu ọgwụ
  rationale: Na-echekwa ihe atụ siri ike nke ime mmadụ ọgwụ ma ọ bụ ịchịkwa ya site n’ike ọjọọ; nkọwa ọzọ bụ iduhie.
- source_word: οἷς κατ’ ὀφθαλμοὺς
  choice: unu ndị e mere ka unu hụ ... n’ihu unu
  rationale: Na-egosipụta na e tinyere ihe ahụ n’ihu ha nke ọma, ọ bụghị na anya anụ ahụ ha hụrụ kpọmkwem ihe mere na obe.
- source_word: Ἰησοῦς Χριστός
  choice: Jizọs, bụ Mesaya
  rationale: A sụgharịrị Χριστός dị ka utu aha ‘Mesaya’ kama ime ya ka ọ bụrụ naanị akụkụ aha.
- source_word: προεγράφη
  choice: e mere ka unu hụ ... n’ụzọ doro anya
  rationale: Na-eburu echiche nke igosi ma ọ bụ ịkọwa ihe n’ihu ọha n’ụzọ pụtara ìhè, ma na-anọgide bụrụ Igbo eke.
- source_word: ἐσταυρωμένος
  choice: dị ka onye a kpọgidere n’obe
  rationale: 'Na-egosipụta ọnọdụ Jizọs nke e gosipụtara: onye a kpọgidere n’obe.'
theological_decisions:
- issue: Utu aha Χριστός n’okwu Ἰησοῦς Χριστός
  choice: Jizọs, bụ Mesaya
  alternative: Jizọs Kraịst
  rationale: ‘Mesaya’ na-echekwa ihe utu aha ahụ pụtara ma ghara ime Χριστός ka ọ dị ka aha ezinụlọ.
- issue: Ma προεγράφη ọ na-ekwu maka ihe osise nkịtị ka ọ bụ nkwusa doro anya
  choice: e mere ka unu hụ ... n’ụzọ doro anya
  alternative: e sere ya n’ihu ọha / e debere ya n’ihu unu dị ka n’akwụkwọ ọkwa
  rationale: Okwu Grik ahụ nwere ike ịpụta igosi n’ihu ọha ma ọ bụ itinye ihe n’ihu mmadụ n’ụzọ pụtara ìhè. Nsụgharị a echekwaghị echiche na ọ ga-abụrịrị ihe osise nkịtị.
translation_notes:
  register: Igbo Standard nke oge a, dị ùgwù ma dị mfe nghọta. E ji “mere unu ọgwụ” chekwaa ịdị nkọ nke ajụjụ Pọl, ebe nkọwa ala peeji na-enye nhọrọ dị larịị, “duhiere unu.”
