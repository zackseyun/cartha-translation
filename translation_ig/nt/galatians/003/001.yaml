revisions:
- from: Unu ndị Galeshia na-enweghị uche! Ònye mere unu ọgwụ[a], unu ndị e mere ka unu hụ Jizọs, bụ Mesaya[b], n’ihu unu n’ụzọ doro anya dị ka onye a kpọgidere n’obe?[c]
  to: Unu ndị Galeshia na-enweghị uche! Ònye mere unu ọgwụ[a]? N’ihu unu ka e gosipụtara Jizọs, bụ Mesaya[b], n’ụzọ doro anya dị ka onye a kpọgidere n’obe[c].
  rationale: 'The revision removes the awkward relative-clause imitation and renders the Greek sense in clear Standard Igbo: the Galatians had Christ vividly set before them as crucified. It retains the rhetorical rebuke and the metaphor of bewitchment, translates Χριστός as ‘Mesaya,’ and places every footnote anchor directly after the relevant translated expression.'
  reviewer_model: gpt-5.6-terra
