  text: So then[a], the law has become our guardian until Messiah[b], so that we might be justified by faith.
translation:
  language: ig
  text: N’ihi ya, iwu ahụ aghọọla onye nlekọta anyị ruo mgbe Mesaịa bịara,[a][b] ka e wee gụọ anyị dịka ndị ezi omume site n’okwukwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “onye na-elekọta ma na-achịkwa anyị”; n’ọdịnala, “onye nkụzi anyị.” Okwu Grik παιδαγωγός bụ onye na-elekọta ma na-achịkwa nwata n’ezinụlọ, ọ bụghị n’ụzọ bụ isi onye nkụzi n’ụlọ akwụkwọ.
    reason: lexical_alternative
  - marker: b
    text: N’ụzọ kpọmkwem, “n’ebe Mesaịa nọ”; a pụkwara ịghọta ya dị ka “na-eduga anyị na Mesaịa.”
    reason: alternative_reading
lexical_decisions:
- source_word: ὥστε
  choice: N’ihi ya
  rationale: Ọ na-egosi nkwubi okwu sitere n’arụmụka bu ụzọ, ọ bụghị nzube.
- source_word: ὁ νόμος
  choice: iwu ahụ
  rationale: N’ebe a, ọ na-ezo aka n’Iwu Mosis dị ka ihe ndị na-agụ akwụkwọ ahụ maralarị.
- source_word: παιδαγωγὸς ἡμῶν
  choice: onye nlekọta anyị
  rationale: παιδαγωγός bụ onye na-elekọta ma na-achịkwa nwata n’ezinụlọ, ọ bụghị n’ụzọ bụ isi onye nkụzi klas.
- source_word: γέγονεν
  choice: aghọọla
  rationale: Ụdị perfect na-egosi ihe mere n’oge gara aga nke ọnọdụ ya ka dị.
- source_word: εἰς Χριστόν
  choice: ruo mgbe Mesaịa bịara
  rationale: N’ọdịnaya a, εἰς na-egosi Mesaịa dị ka njedebe na ebumnuche nke ọrụ nlekọta iwu ahụ; mgbakwunye ‘bịara’ na-eme ka Igbo doo anya ma kwekọọ n’amaokwu gbara ya gburugburu.
- source_word: ἵνα
  choice: ka e wee
  rationale: Ọ na-ewebata nzube ma na-ada nke ọma n’Igbo ugbu a.
- source_word: ἐκ πίστεως
  choice: site n’okwukwe
  rationale: Ọ na-egosi ụzọ ma ọ bụ ihe ndabere; nke a bụ ntụgharị Igbo doro anya nke okwu ahụ.
- source_word: δικαιωθῶμεν
  choice: gụọ anyị dị ka ndị ezi omume
  rationale: Ọ na-echekwa echiche ikpe nke ngwaa passive ahụ n’asụsụ Igbo a na-aghọta nke ọma, na-egosighị na ọ bụ naanị mgbanwe omume.
theological_decisions:
- issue: Ihe εἰς Χριστόν pụtara n’ihe gbasara ọrụ iwu ahụ
  choice: ruo mgbe Mesaịa bịara
  alternative: ruo Mesaịa; na-eduga anyị na Mesaịa
  rationale: Ihe gbara amaokwu ahụ gburugburu na-emesi ọrụ iwu ahụ nke dị nwa oge ike, ma εἰς nwekwara ike igosi ntụziaka ma ọ bụ ebumnuche. E debere nghọta ndị ọzọ n’ala peeji ka a ghara imechi mgbagwoju anya dị n’asụsụ Grik.
- issue: Otu e si akọwa δικαιωθῶμεν
  choice: gụọ anyị dị ka ndị ezi omume
  alternative: mee ka anyị bụrụ ndị ezi omume
  rationale: Nhọrọ a na-echekwa ọdịdị ikpe nke okwu Pọl n’emebighị esemokwu nkà mmụta okpukpe dị n’etiti nkwupụta ọnọdụ ziri ezi na mgbanwe mmadụ.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke ugbu a ma dị ugwu. E ji ‘onye nlekọta’ zere echiche na παιδαγωγός bụ naanị onye nkụzi, ma e tinyere nkọwa ala peeji iji chekwaa ụzọ ndị ọzọ e nwere ike isi ghọta okwu ahụ. Ihe nrịba ama [a] na [b] pụtara n’ahịrị isi.
