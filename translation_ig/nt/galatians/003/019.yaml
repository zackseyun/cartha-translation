id: GAL.3.19
reference: Galatians 3:19
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Τί οὖν ὁ νόμος; τῶν παραβάσεων χάριν προσετέθη, ἄχρις ⸀οὗ ἔλθῃ τὸ σπέρμα ᾧ ἐπήγγελται, διαταγεὶς δι’ ἀγγέλων ἐν χειρὶ μεσίτου·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/019.yaml
  text: Why then the law? It was added because of transgressions until the seed should come to whom the promise had been made[c][b][a], having been ordained through angels by the hand of a mediator.
translation:
  language: ig
  text: Gịnịzi mere e ji nye Iwu ahụ? A gbakwụnyere ya n’ihi mmebi iwu[b], ruo mgbe Mkpụrụ ahụ[a], onye e kwere nkwa ahụ nye, ga-abịa; e haziri[c] Iwu ahụ site n’aka ndị mmụọ ozi, sitekwa n’aka onye ogbugbo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “nwa sitere n’agbụrụ ahụ” ma ọ bụ “onye sitere n’ezinụlọ ahụ.”
    reason: lexical_alternative
  - marker: b
    text: “N’ihi mmebi iwu” nwere ike ịpụta na e nyere Iwu ahụ iji lebara mmebi iwu anya, kpughee ya, ma ọ bụ gbochie ya; okwu Grik ahụ akọwaghị nke ọ bụ kpọmkwem.
    reason: alternative_reading
  - marker: c
    text: A pụkwara ịsụgharị ya “E mere ka Iwu ahụ guzosie ike” ma ọ bụ “E debere Iwu ahụ n’usoro.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί οὖν ὁ νόμος;
  choice: Gịnịzi mere e ji nye Iwu ahụ?
  rationale: Ajụjụ Grik a dị nkenke ma hapụ ụfọdụ okwu; n’usoro arụmụka Pọl, ọ na-ajụ ihe mere e ji nye Iwu ahụ. Nsụgharị a na-eme ka ajụjụ ahụ doo onye Igbo nke oge a anya n’enweghị ịkọwa ọrụ Iwu ahụ karịa ihe okwu ahụ kwuru.
- source_word: νόμος
  choice: Iwu ahụ
  rationale: N’ebe a, ọ na-ezo aka n’Iwu Mosis dị ka ihe ndị na-agụ akwụkwọ maara; “ahụ” na-egosipụta article nke Grik.
- source_word: τῶν παραβάσεων χάριν
  choice: n’ihi mmebi iwu
  rationale: “N’ihi” nwere ike igosi ihe kpatara ihe ma ọ bụ ebumnuche ya, ya mere ọ na-echekwa nghọta dị iche iche nke χάριν kama ikwu kpọmkwem na Iwu ahụ gbochiri, kpughere, ma ọ bụ mụbara mmebi iwu.
- source_word: προσετέθη
  choice: A gbakwụnyere ya
  rationale: Nke a na-egosipụta passive aorist ahụ nke ọma ma na-echekwa echiche na e tinyere Iwu ahụ n’ihe dịbu adị.
- source_word: ἄχρις οὗ ἔλθῃ
  choice: ruo mgbe ... ga-abịa
  rationale: Ọ na-egosi njedebe oge nke na-ele anya n’ọbịbịa a ka na-atụ anya ya site n’oge e nyere Iwu ahụ.
- source_word: τὸ σπέρμα
  choice: Mkpụrụ ahụ
  rationale: “Mkpụrụ” na-echekwa njikọ okwu Pọl na nkwa e kwere Ebreham nakwa arụmụka ya banyere otu mkpụrụ; ihe ọ pụtara n’ebe a abụghị naanị mkpụrụ osisi, kama onye sitere n’agbụrụ ahụ.
- source_word: ᾧ ἐπήγγελται
  choice: onye e kwere nkwa ahụ nye
  rationale: Nke a na-eme ka dative ahụ na nkwa e kwuburu okwu ya pụta ìhè, ma na-egosikwa na nkwa ahụ ka dị ire.
- source_word: διαταγεὶς
  choice: E haziri Iwu ahụ
  rationale: “Haziri” na-enye echiche nke idebe ma ọ bụ ịtọ ihe n’usoro. A kpọghachiri “Iwu ahụ” aha iji zere mgbagwoju anya n’Igbo, ebe participle Grik ahụ na-ezo aka n’Iwu ahụ.
- source_word: δι’ ἀγγέλων
  choice: site n’aka ndị mmụọ ozi
  rationale: Nke a na-egosipụta na ndị mmụọ ozi bụ ndị e si n’aka ha mee ka Iwu ahụ ruo ndị mmadụ.
- source_word: ἐν χειρὶ μεσίτου
  choice: n’aka onye ogbugbo
  rationale: “N’aka” na-echekwa ihe atụ doro anya nke χείρ ma bụrụkwa ụzọ Igbo si egosi onye e si n’aka ya mee ihe; “onye ogbugbo” bụ okwu kwụ ọtọ maka onye nọ n’etiti akụkụ abụọ.
theological_decisions:
- issue: Ihe “n’ihi mmebi iwu” pụtara
  choice: E debere ya n’ụdị sara mbara, “n’ihi mmebi iwu.”
  alternative: “iji gbochie mmebi iwu,” “iji kpughee mmebi iwu,” ma ọ bụ “iji mee ka mmebi iwu pụta ìhè.”
  rationale: Okwu Grik ahụ ekwughị kpọmkwem otú Iwu ahụ si metụta mmebi iwu. Ịhapụ ya n’ụdị sara mbara na-echekwa esemokwu nkọwa ahụ.
- issue: Nsụgharị σπέρμα n’arụmụka Pọl
  choice: Mkpụrụ ahụ
  alternative: Nwa sitere n’agbụrụ ahụ; onye sitere n’ezinụlọ ahụ
  rationale: “Mkpụrụ” na-echekwa otu mkpụrụokwu e ji kee nkwa Ebreham na arụmụka Pọl, ebe nkọwa ala peeji na-eme ka ihe ọ pụtara doo anya.
- issue: Ndị so mee ka Iwu ahụ ruo mmadụ
  choice: “site n’aka ndị mmụọ ozi, n’aka onye ogbugbo”
  alternative: “ndị mmụọ ozi nyere ya site n’aka onye ogbugbo”
  rationale: Nhọrọ a na-echekwa ụzọ abụọ Grik si egosi usoro mgbasa ahụ, na-ekwughị karịa ihe amaokwu ahụ kwuru banyere njirimara onye ogbugbo ma ọ bụ ọrụ nke akụkụ ọ bụla.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta, dee ya. “Iwu ahụ,” “Mkpụrụ ahụ,” “ndị mmụọ ozi,” na “onye ogbugbo” bụ okwu ndị nkịtị na ndị na-agụ Akwụkwọ Nsọ ga-aghọta. E jiri mkpụrụedemede ukwu dee “Iwu” na “Mkpụrụ” iji nyere aka gosipụta ihe a kapịrị ọnụ a na-ekwu n’usoro arụmụka ahụ, ọ bụghị iji tinye nkọwa ụka pụrụ iche.
