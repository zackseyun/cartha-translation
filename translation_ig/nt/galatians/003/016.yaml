revisions:
- from: 'E kwuru nkwa ndị ahụ nye Ebreham na mkpụrụ ya[a]. Ọ sịghị, “Na nye mkpụrụ dị iche iche”[b], dị ka a ga-asị na ọ na-ekwu banyere ọtụtụ ndị, kama ọ na-ekwu banyere otu onye: “Na nye mkpụrụ gị,” onye ahụ bụ Mesaịa[c].'
  to: 'E kwuru nkwa ndị ahụ nye Ebreham na mkpụrụ ya[a]. Ọ sịghị, “Nakwa nye ọtụtụ mkpụrụ”[b], dị ka a ga-asị na ọ na-ekwu banyere ọtụtụ ndị, kama dịka ọ na-ekwu banyere otu onye: “Nakwa nye mkpụrụ gị,” onye bụ Mesaịa[c].'
  rationale: The revision removes an unintended ‘different’ nuance from the plural citation, clarifies the formulaic quoted phrases, and improves the explanatory footnote while retaining the source’s singular/collective wordplay and the titular rendering ‘Mesaịa.’
  reviewer_model: gpt-5.6-terra
