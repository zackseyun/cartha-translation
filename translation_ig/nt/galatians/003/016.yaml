id: GAL.3.16
reference: Galatians 3:16
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τῷ δὲ Ἀβραὰμ ἐρρέθησαν αἱ ἐπαγγελίαι καὶ τῷ σπέρματι αὐτοῦ· οὐ λέγει· Καὶ τοῖς σπέρμασιν, ὡς ἐπὶ πολλῶν, ἀλλ’ ὡς ἐφ’ ἑνός· Καὶ τῷ σπέρματί σου, ὅς ἐστιν Χριστός.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/016.yaml
  text: The promises were spoken to Abraham and to his offspring[a]. It does not say, “And to offsprings,” as referring to many, but as referring to one[c][b], “And to your offspring,” who is Messiah.
translation:
  language: ig
  text: 'E kwuru nkwa ndị ahụ nye Ebreham na mkpụrụ ya[a]. Ọ sịghị, “Nakwa nye ọtụtụ mkpụrụ”[b], dị ka a ga-asị na ọ na-ekwu banyere ọtụtụ ndị, kama dịka ọ na-ekwu banyere otu onye: “Nakwa nye mkpụrụ gị,” onye bụ Mesaịa[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘Mkpụrụ’ nwekwara ike ịpụta ụmụ sitere n'agbụrụ ya. N'asụsụ Grik, e ji aha dị n'otu ọnụ ọgụgụ nke nwekwara ike ịpụta ìgwè mmadụ mee ihe n'amaokwu a niile; nke a bụ isi n'arụmụka Pọl.
    reason: lexical_alternative
  - marker: b
    text: 'N''asụsụ Grik: ‘nakwa nye mkpụrụ’ n''ụdị ọtụtụ. Pọl na-eme ka ọdịiche dị n''etiti otu mkpụrụ na ọtụtụ mkpụrụ pụta ìhè.'
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ ‘Kraịst.’
    reason: alternative_reading
lexical_decisions:
- source_word: ἐρρέθησαν
  choice: E kwuru
  rationale: 'Nke a na-edobe echiche nke ngwaa λέγω n''ụdị nnara: e kwuru ma ọ bụ e kwupụtara nkwa ndị ahụ, kama ịgbanwe ya naanị ka ọ bụrụ ‘e nyere.’'
- source_word: ἐπαγγελίαι
  choice: nkwa ndị ahụ
  rationale: ‘Nkwa’ bụ okwu Igbo doro anya ma bụrụkwa ihe a na-ejikarị akọwa nkwa Chineke; ‘ndị ahụ’ gosiri ọtụtụ na ntụaka a kapịrị ọnụ.
- source_word: σπέρμα / σπέρματι
  choice: mkpụrụ
  rationale: ‘Mkpụrụ’ nwere ike ịpụta mkpụrụ ma ọ bụ ụmụ sitere n'otu onye, ya mere ọ na-echekwa otu-okwu nke nwere nghọta mkpokọta, nke bụ isi n'arụmụka Pọl.
- source_word: τοῖς σπέρμασιν
  choice: mkpụrụ dị iche iche
  rationale: Igbo anaghị egosikarị ọtụtụ site n'ịgbanwe ọdịdị aha; ‘dị iche iche’ na-eme ka ọdịiche Pọl na-eme n'etiti otu na ọtụtụ pụta ìhè.
- source_word: ὡς ἐπὶ πολλῶν
  choice: dị ka a ga-asị na ọ na-ekwu banyere ọtụtụ ndị
  rationale: Nke a na-ekwupụta nkọwa Pọl n'Igbo dị ndụ ma na-edobe ntụaka ya n'ebe ọtụtụ mmadụ nọ.
- source_word: ἀλλ’ ὡς ἐφ’ ἑνός
  choice: kama ọ na-ekwu banyere otu onye
  rationale: Ọ na-edobe ntụnyere doro anya n'etiti ọtụtụ ndị na otu onye, ma na-eme ka okwu Igbo ghara ịdị arọ.
- source_word: Χριστός
  choice: Mesaịa
  rationale: N'ebe a okwu ahụ bụ aha ọkwa nke onye Chineke tere mmanụ, ọ bụghị naanị aha e ji amata mmadụ; ‘Mesaịa’ na-eme ka nghọta ahụ pụta ìhè.
theological_decisions:
- issue: Otu e si asụgharị Χριστός n'okwu Pọl ji mata mkpụrụ ahụ
  choice: Mesaịa
  alternative: Kraịst
  rationale: N'ahịrịokwu a, Pọl na-akọwa onye mkpụrụ ahụ bụ dịka onye ahụ e tere mmanụ. ‘Mesaịa’ na-echekwa ọrụ okwu ahụ dịka aha ọkwa, ebe ‘Kraịst’ nwekwara ike ịdị ka naanị aha.
- issue: Otu-ọnụọgụ na nghọta mkpokọta nke σπέρμα
  choice: mkpụrụ
  alternative: nwa sitere n'ezinụlọ ya
  rationale: A hapụrụ ‘mkpụrụ’ ka ọ bụrụ otu okwu nwere ike ịgụnye ụmụ sitere n'otu onye, n'ihi na esemokwu Pọl dabere kpọmkwem na mgbagwoju anya na esemokwu dị n'etiti otu ọdịdị okwu ahụ na nghọta ya.
translation_notes:
  register: E ji Standard Igbo nke dị ugbu a, dị ùgwù ma dị mfe nghọta mee ihe. A hapụrụ ‘mkpụrụ’ n'ihi na ọ na-arụ ọrụ dịka okwu nkịtị na okwu gbasara ụmụ sitere n'otu onye, nke na-echekwa esemokwu asụsụ dị n'isi arụmụka Pọl. E debere ‘Na nye...’ n'ime nhota iji gosipụta καί nke dị na okwu Akwụkwọ Nsọ Pọl na-ehota, n'agbanyeghị na ọ dị ntakịrị ka okwu a kpụrụ akpụ n'Igbo.
