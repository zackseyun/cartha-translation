id: GAL.6.8
reference: Galatians 6:8
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὅτι ὁ σπείρων εἰς τὴν σάρκα ἑαυτοῦ ἐκ τῆς σαρκὸς θερίσει φθοράν, ὁ δὲ σπείρων εἰς τὸ πνεῦμα ἐκ τοῦ πνεύματος θερίσει ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/008.yaml
  text: For the one who sows to his own flesh will reap corruption from the flesh[c][b][a], but the one who sows to the Spirit will reap eternal life from the Spirit.
translation:
  language: ig
  text: N’ihi na onye na-agha mkpụrụ maka anụ ahụ nke ya[a] ga-aghọrọ ire ure site n’anụ ahụ; ma onye na-agha mkpụrụ maka Mmụọ[c] ga-aghọrọ ndụ ebighị ebi site na Mmụọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ọdịdị mmehie nke ya.” Okwu Grik bụ sarx nwere ike ịpụta anụ ahụ nkịtị; ma mgbe Pọl ji ya atụnyere Mmụọ n’ihe gbasara omume, ọ pụrụ ịpụta ọchịchọ ma ọ bụ ụzọ ndụ mmadụ dara ada nke na-emegide Mmụọ.
    reason: lexical_alternative
  - marker: c
    text: Ya bụ, Mmụọ Nsọ. Ụfọdụ nwere ike ide ya “mmụọ,” ma n’Akwụkwọ Ndị Galeshia, ntụnyere a na-ezokarị aka na Mmụọ Chineke.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: N’ihi na
  rationale: Njikọ a na-enye ihe mere e ji nye ndụmọdụ dị n’amaokwu bu ụzọ; “N’ihi na” na-egosipụta ọrụ nkọwa a nke ọma n’Igbo.
- source_word: ὁ σπείρων
  choice: onye na-agha mkpụrụ
  rationale: Nkebi a na-ekwu banyere onye ọ bụla na-eme omume a. Nsụgharị ahụ na-edobe ihe atụ ọrụ ugbo na ọdịdị ilu dị n’asụsụ Grik.
- source_word: εἰς τὴν σάρκα ἑαυτοῦ
  choice: maka anụ ahụ nke ya
  rationale: “Maka” na-egosi ebe onye ahụ na-etinye mbọ ya ma ọ bụ ihe ọ na-achọ iji ya baa uru. “Anụ ahụ” na-edobe okwu Pọl na esemokwu ya na Mmụọ, ebe “nke ya” na-egosipụta ἑαυτοῦ.
- source_word: ἐκ τῆς σαρκὸς
  choice: ga-esi n’anụ ahụ ahụ
  rationale: “Si na” na-egosipụta isi mmalite nke ihe ubi ahụ ma na-edobe nhazi ya na nkebi nke na-ekwu banyere Mmụọ.
- source_word: θερίσει
  choice: wee ihe ubi
  rationale: Nke a bụ ụzọ Igbo doro anya si kwuo inweta ihe ubi, ọ na-edobekwa njikọ dị n’etiti ịgha mkpụrụ na iwe ihe ubi.
- source_word: φθοράν
  choice: ire ure
  rationale: “Ire ure” nwere ike ịgụnye mmebi, ịla n’iyi, na ọnọdụ nke ihe na-emebi emebi, ya mere ọ naghị akpọchi okwu Grik ahụ n’otu naanị n’ime ihe ọ pụrụ ịpụta.
- source_word: εἰς τὸ πνεῦμα
  choice: maka Mmụọ
  rationale: N’esemokwu anụ ahụ na Mmụọ dị na Ndị Galeshia, πνεῦμα yikarịrị ka ọ na-ezo aka na Mmụọ Chineke. Mkpụrụedemede ukwu na-egosi nghọta a n’enweghị itinye “Nsọ” nke na-adịghị n’ederede Grik.
- source_word: ἐκ τοῦ πνεύματος
  choice: ga-esi na Mmụọ ahụ
  rationale: “Si na” na-edobe echiche nke isi mmalite na myiri doro anya ya na “si n’anụ ahụ.”
- source_word: ζωὴν αἰώνιον
  choice: ndụ ebighị ebi
  rationale: Nke a bụ okwu Igbo a maara nke ọma ma bụrụkwa nke ziri ezi maka ndụ na-adịgide ebighị ebi.
theological_decisions:
- issue: Ihe σάρξ pụtara n’esemokwu omume nke Pọl
  choice: anụ ahụ
  alternative: ọdịdị mmehie nke mmadụ
  rationale: Ọ bụ ezie na ebe a σάρξ na-egosi ọchịchọ mmadụ nke na-emegide Mmụọ, “anụ ahụ” na-edobe okwu na esemokwu nke Pọl kama ịkọwa ya kpamkpam n’isi ederede. Ihe odide ala peeji na-egosi nkọwa ọzọ.
- issue: Onye πνεῦμα na-ezo aka na ya
  choice: Mmụọ
  alternative: mmụọ
  rationale: N’akwụkwọ Ndị Galeshia, karịchaa n’esemokwu anụ ahụ na Mmụọ, okwu a na-ezokarị aka na Mmụọ Chineke. Otú ọ dị, ebe mkpụrụedemede Grik n’onwe ya anaghị edo nke a anya, e debere nhọrọ ọzọ n’ihe odide ala peeji.
translation_notes:
  register: E ji Standard Igbo nke dị ugbu a, dị ugwu ma dị mfe nghọta mee ihe. “Ịgha mkpụrụ” na “iwe ihe ubi” na-edobe ihe atụ ọrụ ugbo nke amaokwu ahụ, ebe nhazi nkebi abụọ ahụ na-eme ka esemokwu dị n’etiti anụ ahụ na Mmụọ pụta ìhè.
