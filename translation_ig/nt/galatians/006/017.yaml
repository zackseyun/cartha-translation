source:
  edition: SBLGNT
  text: Τοῦ λοιποῦ κόπους μοι μηδεὶς παρεχέτω, ἐγὼ γὰρ τὰ στίγματα ⸀τοῦ Ἰησοῦ ἐν τῷ σώματί μου βαστάζω.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/017.yaml
  text: From now on let no one cause me trouble[a], for I bear the marks of Jesus on my body.
translation:
  language: ig
  text: Site ugbu a gaa n’ihu, ka onye ọ bụla ghara inye m nsogbu, n’ihi na m na-ebu akara[a] Jisọs n’ahụ m.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “akara a kanyere n’ahụ”; okwu a pụrụ izo aka n’akara dị n’ahụ nke na-egosi na mmadụ bụ nke onye ọzọ ma ọ bụ na ọ kwadoro ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῦ λοιποῦ
  choice: Site ugbu a gaa n’ihu
  rationale: Nke a bụ ụzọ Igbo dị mfe ma bụrụkwa nke a na-ejikarị ekwu ‘malite ugbu a gaa n’ihu,’ nke dabara n’okwu mmechi Pọl.
- source_word: κόπους ... παρεχέτω
  choice: inye ... nsogbu
  rationale: N’agbanyeghị na κόπος pụrụ ịpụta ọrụ ike, nkebiokwu κόπους παρέχειν pụtara iweta ma ọ bụ ịkpata nsogbu nye mmadụ. ‘Inye m nsogbu’ bụ okwu Igbo eke n’ọnọdụ a.
- source_word: μοι μηδεὶς παρεχέτω
  choice: ka onye ọ bụla ghara inye m
  rationale: Ụdị a na-egosipụta iwu mgbochi nke onye nke atọ dị n’asụsụ Grik ma debe μοι dịka ‘m.’
- source_word: στίγματα
  choice: akara
  rationale: ‘Akara’ na-ahapụ okwu ahụ ka ọ gụnye akara anụ ahụ, ọnya fọdụrụ, ma ọ bụ akara na-egosi onye nwe mmadụ, n’etinyeghị nkọwa karịrị ihe ederede kwuru.
- source_word: τοῦ Ἰησοῦ
  choice: Jizọs
  rationale: Njikọ ‘akara Jizọs’ na-edebe obosara genitive Grik ahụ n’enweghị ikpebi ma ọ pụtara akara ndị sitere n’ihi Jizọs, nke na-egosi ịbụ nke ya, ma ọ bụ nke na-eme ka Pọl yie ya.
- source_word: ἐν τῷ σώματί μου
  choice: n’ahụ m
  rationale: Nke a bụ ụzọ Igbo eke si akọwa ebe akara dị n’ahụ mmadụ.
- source_word: βαστάζω
  choice: ana m ebu
  rationale: ‘Ibu’ kwekọrọ n’echiche βαστάζω nke ibu ma ọ bụ ịnagide ihe, ma debe ụda dị nsọ nke okwu ahụ.
theological_decisions:
- issue: Ụdị akara Pọl na-ekwu maka ya (στίγματα)
  choice: A sụgharịrị ya n’enweghị ịkọwapụta karịa ka ‘akara Jizọs.’
  alternative: Ọnya fọdụrụ site na mkpagbu; akara e ji mara ohu ma ọ bụ onye nwe mmadụ; ma ọ bụ ihe atụ nke ahụhụ ozi Pọl na njikọ ya na Jizọs.
  rationale: Okwu ahụ nwere ike izo aka n’akara anụ ahụ sitere n’ahụhụ, nke n’otu oge ahụ na-egosi na Pọl bụ nke Jizọs. Amaokwu ahụ anaghị amanye naanị otu nkọwa, ya mere nsụgharị ahụ debere nghọtahie na esemokwu nkà mmụta okpukpe dị n’ime ya.
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, dị mfe ma dị ùgwù. ‘Ka onye ọ bụla ghara inye m nsogbu’ bụ okwu eke ma na-edebe ike nke iwu mgbochi ahụ. A kpachapụrụ anya ghara ịkọwa ‘akara Jizọs’ dịka naanị ọnya ma ọ bụ naanị akara ihe atụ.
