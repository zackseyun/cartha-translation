  to: Site ugbu a gaa n’ihu, ka onye ọ bụla ghara inye m nsogbu, n’ihi na m na-ebu akara[a] Jisọs n’ahụ m.
  rationale: The revision retains the source’s ambiguity concerning στίγματα and the genitive “of Jesus,” while using established Standard Igbo naming and a clearer lexical footnote. No interpretive claim is added about whether the marks were literal scars, brands, or a figurative expression of suffering and allegiance.
