revisions:
- from: Ma mụ onwe m, ka ọ ghara ịdị mgbe ọ bụla na m ga-anya isi n’ihe ọ bụla ma e wezụga obe Onyenwe anyị Jizọs, bụ Mesaya[a]. Ọ bụ site n’obe ahụ[b] ka e ji kpọgide ụwa n’obe n’ebe m nọ, kpọgidekwa m n’obe n’ebe ụwa nọ.
  to: Ma mụ onwe m, ka ọ ghara ịdị ma ọlị ka m na-anya isi n’ihe ọ bụla ma e wezụga n’obe Onyenwe anyị Jizọs Mesaya[a], bụ́ site n’obe ahụ[b] ka e kpọgideworo ụwa n’obe n’ebe m nọ, kpọgidewokwa m n’obe n’ebe ụwa nọ.
  rationale: The revision makes the strong optative idiomatic, marks the Greek perfect passive with completed-result forms, retains the cross as the primary antecedent of δι’ οὗ, and clarifies the alternative antecedent in the footnote. It preserves the Greek’s theological and syntactic ambiguity without resolving it doctrinally.
  reviewer_model: gpt-5.6-terra
