id: GAL.6.14
reference: Galatians 6:14
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐμοὶ δὲ μὴ γένοιτο καυχᾶσθαι εἰ μὴ ἐν τῷ σταυρῷ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ, δι’ οὗ ἐμοὶ κόσμος ἐσταύρωται ⸀κἀγὼ κόσμῳ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/014.yaml
  text: But far be it from me to boast except in the cross of our Lord Jesus the Messiah[a], through which the world has been crucified to me[b], and I to the world.
translation:
  language: ig
  text: Ma mụ onwe m, ka ọ ghara ịdị ma ọlị ka m na-anya isi n’ihe ọ bụla ma e wezụga n’obe Onyenwe anyị Jizọs Mesaya[a], bụ́ site n’obe ahụ[b] ka e kpọgideworo ụwa n’obe n’ebe m nọ, kpọgidewokwa m n’obe n’ebe ụwa nọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Greek kwuru “Jizọs Kraịst.” N’ebe a, a tụgharịrị aha ọkwa Χριστός dịka “Mesaya” iji gosipụta ihe ọ pụtara.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “site n’aka Onyenwe anyị Jizọs Mesaya,” ma ọ bụrụ na e were nnọchiaha ahụ dịka ihe na-ezo aka n’Onyenwe anyị Jizọs Mesaya kama n’obe.
    reason: alternative_reading
lexical_decisions:
- source_word: μὴ γένοιτο
  choice: ka ọ ghara ịdị mgbe ọ bụla
  rationale: Nke a na-egosipụta ọjụjụ siri ike nke optative ahụ n’Igbo dị ugbu a, ma na-edobe ike nke okwu Pọl.
- source_word: καυχᾶσθαι
  choice: ịnya isi
  rationale: Ọ bụ okwu Igbo doro anya maka ito onwe mmadụ ma ọ bụ ịdabere n’ihe dị ka ihe e ji etu ọnụ; ọ dabara n’ọdịiche Pọl na-eme n’akụkụ a.
- source_word: εἰ μὴ
  choice: ma e wezụga
  rationale: Ọ na-egosi na obe bụ naanị ihe Pọl kwuru na ya nwere ike ịnya isi.
- source_word: σταυρῷ
  choice: obe
  rationale: Nke a bụ okwu Igbo a na-ejikarị eme ihe maka σταυρός n’ihe gbasara ọnwụ Jizọs na nkuzi Pọl.
- source_word: κυρίου
  choice: Onyenwe
  rationale: Ọ bụ aha nsọpụrụ Igbo kwesịrị ekwesị maka κύριος n’ebe a.
- source_word: Χριστοῦ
  choice: bụ Mesaya
  rationale: A tụgharịrị aha ọkwa Χριστός ka ihe ọ pụtara pụta ìhè, kama ide ya naanị dịka aha e si mba ọzọ nweta.
- source_word: δι’ οὗ
  choice: site n’obe ahụ
  rationale: Nnọchiaha Greek nwere ike ịlaghachi na ‘obe’ nke dị ya nso; ikwughachi ‘obe ahụ’ na-eme ka Igbo doo anya. A hapụrụ ụzọ ọzọ ‘site n’aka onye ahụ’ n’akwụkwọ nkọwa.
- source_word: κόσμος
  choice: ụwa
  rationale: Ọ na-edobe ịdị obosara na obere mgbagwoju anya nke κόσμος, nke nwere ike ịgụnye usoro ụwa nke na-emegide Chineke.
- source_word: ἐσταύρωται
  choice: e ji kpọgide ... n’obe
  rationale: Ọ na-edobe ihe atụ nke ịkpọgide n’obe na olu nnara; usoro ahịrịokwu ahụ na-egosikwa ihe merela nke nsonaazụ ya ka dị.
- source_word: κἀγὼ κόσμῳ
  choice: kpọgidekwa m n’obe n’ebe ụwa nọ
  rationale: E tinyere ngwaa a hapụrụ n’ahịrị Greek ka Igbo bụrụ nke zuru oke ma doo anya, ebe a ka na-edobe nha anya nke akụkụ abụọ ahụ.
theological_decisions:
- issue: Ntughari Χριστοῦ n’aha Ἰησοῦ Χριστοῦ
  choice: Jizọs, bụ Mesaya
  alternative: Jizọs Kraịst
  rationale: ‘Mesaya’ na-egosipụta ihe aha ọkwa Χριστός pụtara. ‘Bụ’ na-eme ka aha ọkwa ahụ bụrụ Igbo sitere n’okike, na-enweghị ịgbakwunye nkwenkwe otu chọọchị.
- issue: Ihe δι’ οὗ na-ezo aka na ya
  choice: 'obe ahụ: ‘site n’obe ahụ’'
  alternative: 'Onyenwe Jizọs Mesaya: ‘site n’aka onye ahụ’'
  rationale: ‘Obe’ bụ ihe dị nso nke kwekọrọ n’usoro asụsụ Greek, ya mere ọ bụ nhọrọ bụ isi. Otú ọ dị, n’ihi na ụdị nwoke nke aha Greek abụghị ihe na-ekpebi ihe nnọchiaha ahụ na-ezo aka kpamkpam, e debere ụzọ ọzọ na nkọwa ala peeji.
translation_notes:
  register: Asụsụ Igbo Standard dị ugbu a, dị ùgwù ma dị mfe nghọta. E jiri ‘Ma mụ onwe m’ chekwaa ọdịiche nke ἐμοὶ δέ; e jiri nkwughachi ngwaa mee ka parallelism ikpeazụ doo anya n’Igbo. E debere ihe mgbagwoju anya nke δι’ οὗ site na nkọwa ala peeji.
