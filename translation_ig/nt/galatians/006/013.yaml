id: GAL.6.13
reference: Galatians 6:13
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οὐδὲ γὰρ οἱ ⸀περιτεμνόμενοι αὐτοὶ νόμον φυλάσσουσιν, ἀλλὰ θέλουσιν ὑμᾶς περιτέμνεσθαι ἵνα ἐν τῇ ὑμετέρᾳ σαρκὶ καυχήσωνται.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/013.yaml
  text: For not even those who are circumcised themselves keep the law[a], but they want you to be circumcised so that they may boast in your flesh.
translation:
  language: ig
  text: N’ihi na ọbụna ndị e biri úgwù[a] n’onwe ha adịghị edebe Iwu ahụ; kama ha chọrọ ka e bie unu úgwù, ka ha wee nwee ike ịnya isi n’anụ ahụ unu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ịsụgharị ya, “ndị a na-ebi úgwù.” Okwu Grik ahụ bụ participle e ji mee aha: “ndị a na-ebi úgwù / ndị e biri úgwù.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδὲ γὰρ
  choice: N’ihi na ọbụna ... adịghị
  rationale: “N’ihi na” na-egosi njikọ nkọwa nke γάρ na amaokwu bu ụzọ, ebe “ọbụna ... adịghị” na-edobe nkwusi ike nke οὐδέ.
- source_word: οἱ περιτεμνόμενοι
  choice: ndị e biri úgwù
  rationale: Nke a na-akọwa ndị ahụ site n’ibi ha úgwù, n’ebughị ụzọ kọwaa ha dịka naanị ndị na-akwado ibi úgwù.
- source_word: αὐτοὶ
  choice: n’onwe ha
  rationale: 'Ọ na-egosi nkwusi ike ahụ dị n’asụsụ Grik: ndị ahụ n’onwe ha anaghị edebe Iwu ahụ.'
- source_word: νόμον φυλάσσουσιν
  choice: edebe Iwu ahụ
  rationale: “Idebe Iwu” bụ ụzọ Igbo doro anya na nke a na-ejikarị akọwa irubere Iwu Chineke isi.
- source_word: ἀλλὰ θέλουσιν
  choice: kama ha chọrọ
  rationale: Ọ na-edobe mgbanwe echiche na ọchịchọ ndị ahụ n’ụzọ Igbo sitere n’okike.
- source_word: ὑμᾶς περιτέμνεσθαι
  choice: ka e bie unu úgwù
  rationale: Ihe a na-ekwu bụ ka ndị ọzọ bie ndị a na-agwa okwu úgwù; usoro a na-edobe nghọta nke infinitive passive ahụ.
- source_word: ἵνα
  choice: ka ha wee nwee ike
  rationale: Nke a na-egosi ebumnuche nke omume ahụ n’ụzọ doro anya.
- source_word: ἐν τῇ ὑμετέρᾳ σαρκὶ
  choice: n’anụ ahụ unu
  rationale: N’ebe a, σάρξ na-ezo aka n’anụ ahụ nkịtị nke a na-ebi úgwù, ọ bụghị n’ọdịdị mmehie.
- source_word: καυχήσωνται
  choice: ịnya isi
  rationale: “Ịnya isi” na-ebupụta echiche nke ịtโอ onwe ha ma ọ bụ ịnya isi n’ihe ahụ, nke kwekọrọ na ụda okwu Pọl n’ebe a.
theological_decisions:
- issue: Ihe σάρξ pụtara n’ebe a
  choice: anụ ahụ nkịtị, ebe akara ibi úgwù dị
  alternative: ọdịdị mmehie
  rationale: Ebe okwu gbara ya gburugburu na-ekwu kpọmkwem banyere ibi úgwù, ya mere ihe a na-ekwu bụ ahụ mmadụ, ọ bụghị ọdịdị ime mmụọ a na-akpọ ọdịdị mmehie.
- issue: Ike na nghọta nke περιτεμνόμενοι
  choice: ndị e biri úgwù
  alternative: ndị na-akwado ibi úgwù
  rationale: Participle ahụ ji ibi úgwù kọwaa otu ndị ahụ. Ọ bụ ezie na gburugburu amaokwu ahụ na-egosi na ha na-akwado ya, ịtinye nkọwa ahụ kpọmkwem n’ederede ga-agafe ihe okwu Grik kwuru.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. “Iwu ahụ” na-ezo aka n’Iwu Chineke n’ọnọdụ a; “anụ ahụ unu” na-edobe ihe σάρξ pụtara n’ụzọ nkịtị n’ihe gbasara ibi úgwù.
