id: GAL.6.2
reference: Galatians 6:2
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀλλήλων τὰ βάρη βαστάζετε, καὶ οὕτως ⸀ἀναπληρώσετε τὸν νόμον τοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/002.yaml
  text: Carry one another’s burdens[a], and in this way you will fulfill the law of Messiah.
translation:
  language: ig
  text: Buruonụ ibu arọ ibe unu, otu a ka unu ga-esi mezuo iwu Mesaịa[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ: “iwu Kraịst.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλήλων
  choice: nke ibe unu
  rationale: Nkebiokwu a na-egosi na ndị nọ n’ọgbakọ kwesịrị inyere ibe ha aka; ọ na-echekwa echiche nke ime ihe n’etiti onwe ha.
- source_word: τὰ βάρη
  choice: ibu arọ
  rationale: Ọ na-egosi ibu n’ụzọ ihe atụ—nsogbu, nhụjuanya, ma ọ bụ nrụgide mmadụ na-ebu. “Ibu arọ” doro ndị na-agụ Igbo anya ma na-echekwa ihe atụ ahụ.
- source_word: βαστάζετε
  choice: Na-eburịtanụ
  rationale: Ọ bụ iwu e nyere ọtụtụ mmadụ, nke na-akpọ ha ka ha nọgide na-eme ya. “Na-eburịtanụ” na-egosi ma iburu ibu ma inyere ibe ha aka iburu ya.
- source_word: οὕτως
  choice: otu a
  rationale: 'Ọ na-ejikọta iwu ahụ na ihe ga-esi na ya pụta: ọ bụ site n’ime ihe a ka ha ga-esi mezuo iwu ahụ.'
- source_word: ἀναπληρώσετε
  choice: unu ga-esi mezuo
  rationale: Ụdị ọdịnihu ahụ na-egosi ihe ga-esi n’irube isi n’iwu ahụ pụta. “Mezuo” bụ okwu Igbo dabara adaba mgbe ihe a na-ekwu bụ iwu.
- source_word: τὸν νόμον
  choice: iwu
  rationale: “Iwu” na-echekwa ihe νόμος pụtara kpọmkwem nakwa njikọ ya na ọrụ omume e ji mmadụ ụgwọ.
- source_word: τοῦ Χριστοῦ
  choice: nke Mesaịa
  rationale: N’ebe a Χριστός bụ utu aha nke pụtara Onye E Tere Mmanụ; “Mesaịa” na-echekwa ihe utu aha ahụ pụtara na ndabere ndị Juu.
theological_decisions:
- issue: Otu e si sụgharị Χριστοῦ
  choice: Mesaịa
  alternative: Kraịst
  rationale: “Mesaịa” na-egosipụta Χριστός dị ka utu aha, kama ime ka ọ dị naanị ka aha mmadụ. A hapụrụ “Kraịst” n’ala peeji n’ihi na ọ bụkwa nsụgharị a maara nke ọma n’omenala Ndị Kraịst.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ugwu ma dị mfe nghọta. “Na-eburịtanụ” na-egosi iwu a ga-anọgide na-eme, ebe “ibu arọ” na-echekwa ihe atụ nke ederede Grik.
