  rationale: The wording is revised only for idiomatic Standard Igbo. It preserves the command’s ongoing ethical import without adding interpretation, retains the Greek future-result construction (“unu ga-esi mezuo”), and keeps “Mesaịa” with the established alternative in the footnote.
