  source_fidelity: 'The draft accurately represents the Greek: the comprehensive subject (ὅσοι), desire to present themselves favorably, the retained Pauline expression “n’anụ ahụ,” coercion into circumcision, the limiting purpose clause, and avoidance of persecution because of the Messiah’s cross. The passive sense of περιτέμνεσθαι and διώκωνται is appropriately conveyed.'
