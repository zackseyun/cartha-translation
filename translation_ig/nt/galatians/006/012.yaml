id: GAL.6.12
reference: Galatians 6:12
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὅσοι θέλουσιν εὐπροσωπῆσαι ἐν σαρκί, οὗτοι ἀναγκάζουσιν ὑμᾶς περιτέμνεσθαι, μόνον ⸀ἵνα τῷ σταυρῷ τοῦ ⸀Χριστοῦ ⸀μὴ διώκωνται·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/012.yaml
  text: As many as want to make a good showing in the flesh[a], these are forcing you to be circumcised[c][b], only so that they may not be persecuted for the cross of the Messiah.
translation:
  language: ig
  text: Ndị niile chọrọ igosi onwe ha nke ọma n’anụ ahụ[a] bụ ndị na-amanye unu ka e bie unu úgwù, naanị ka a ghara ịkpagbu ha n’ihi obe nke Mesaya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ime ka ndị mmadụ hụ ha n’ụzọ dị mma n’ihe a na-ahụ anya.”
    reason: lexical_alternative
  - marker: b
    text: 'Nsụgharị ọdịnala: “obe nke Kraịst.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ὅσοι θέλουσιν
  choice: Ndị niile chọrọ
  rationale: Na-egosi ìgwè mmadụ niile nwere ọchịchọ a; ọ bụkwa okwu Igbo dị mfe ma kwekọọ n’ike nkebi Grik.
- source_word: εὐπροσωπῆσαι
  choice: igosi onwe ha nke ọma
  rationale: Na-egosi mbọ ime ka ndị ọzọ hụ ha n’ụzọ dị mma, karịchaa n’ihe a na-ahụ anya.
- source_word: ἐν σαρκί
  choice: n’anụ ahụ
  rationale: Na-edobe okwu Pọl bụ σάρξ n’ederede, kama ịkọwa ya naanị dị ka ihe mpụga; nkọwa ụkwụ na-egosi nghọta dabere n’ọnọdụ a.
- source_word: οὗτοι
  choice: bụ ndị
  rationale: Na-ejikọta okwu ahụ n’Igbo eke ma nọgide na-emesi ike na ọ bụ ndị ahụ kpọmkwem na-eme nke a.
- source_word: ἀναγκάζουσιν
  choice: na-amanye
  rationale: Na-egosi nrụgide ma ọ bụ mmanye na-aga n’ihu.
- source_word: ὑμᾶς περιτέμνεσθαι
  choice: unu ka e bie unu úgwù
  rationale: Na-edobe ọdịdị nnara nke Grik ma jiri ahịrịokwu Igbo doro anya maka ibi úgwù.
- source_word: μόνον ἵνα
  choice: naanị ka
  rationale: Na-egosi na nke a bụ naanị ebumnuche Pọl kwuru na ha nwere.
- source_word: τῷ σταυρῷ
  choice: n’ihi obe
  rationale: Dative a nwere ike igosi ihe kpatara mkpagbu; ‘n’ihi’ na-egosipụta nke a nke ọma n’Igbo.
- source_word: τοῦ Χριστοῦ
  choice: nke Mesaya
  rationale: Χριστός na-arụ ọrụ dị ka aha ọkwá n’ebe a, ya mere ‘Mesaya’ na-ebupụta ihe ọ pụtara kama iji ụdị aha nkịtị naanị.
- source_word: μὴ διώκωνται
  choice: ka a ghara ịkpagbu ha
  rationale: 'Na-edobe nnara na ebumnuche nke subjunctive: ha chọrọ izere ịbụ ndị a na-akpagbu.'
theological_decisions:
- issue: Ihe ἐν σαρκί pụtara
  choice: n’anụ ahụ
  alternative: n’ihe a na-ahụ anya
  rationale: A hapụrụ okwu Pọl nwere obosara echiche n’ederede, ebe nkọwa ụkwụ na-enye echiche nke ngosipụta mpụga nke ọnọdụ a na-atụ aro.
- issue: Nsụgharị Χριστοῦ n’okwu obe
  choice: nke Mesaya
  alternative: nke Kraịst
  rationale: N’ebe a Χριστός ka nwere ike ya dị ka aha ọkwá; ‘Mesaya’ na-egosi nke ahụ, ebe nkọwa ụkwụ na-echekwa nsụgharị ọdịnala.
- issue: Mmekọrịta τῷ σταυρῷ na διώκωνται
  choice: n’ihi obe
  alternative: maka obe
  rationale: Dative ahụ nwere ike ịbụ ihe kpatara ma ọ bụ ihe mkpagbu metụtara. ‘N’ihi’ doro anya n’Igbo, ma ekwesịghị ịgbakwunye nkọwa ozizi ọzọ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E debere ‘anụ ahụ’ iji chekwaa esemokwu na obosara okwu Pọl, ma jiri nkọwa ụkwụ kọwaa echiche mpụga ya n’ọnọdụ a. Akara ụda dị na ‘úgwù’ na-enyere aka ịmata okwu ahụ nke ọma.
