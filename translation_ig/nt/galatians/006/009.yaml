review_pass:
  verdict: revise
  source_fidelity: A chọrọ obere mmezi ka e wee chekwaa ọdịiche Pọl ji okwu abụọ ahụ mee. ἐγκακῶμεν dabara nke ọma na “ịda mba,” ebe μὴ ἐκλυόμενοι na-ekwu kpọmkwem maka ike ịgwụ ma ọ bụ ịda n’ike. “N’oge kwesịrị ekwesị” na-anọchi καιρῷ ἰδίῳ n’enweghị nkwughachi dị na “mgbe oge ... ruru.” “Iwe ihe ubi” bụ nkịtị ma na-echekwa ihe atụ θερίσομεν.
  naturalness: “Ka anyị ghara ịda mba n’ime ime ezi ihe” bụ Standard Igbo doro anya, n’agbanyeghị na e nwere obere nkwughachi “n’ime ime” nke na-egosi ịga n’ihu n’omume ahụ. “Anyị ga-ewe ihe ubi” bụ okwu ọrụ ugbo a na-ejikarị eme ihe karịa “anyị ga-aghọrọ mkpụrụ” n’ebe a.
  terminology: “Ezi ihe” na-edobe echiche omume ọma nke τὸ καλόν. “Ịda mba” na “ike agwụ” na-edobe okwu abụọ yiri ibe ha mana na-adịghị otu nke Grik, n’enweghị itinye nkọwa ozizi ọzọ.
  issues:
