source:
  edition: SBLGNT
  text: τὸ δὲ καλὸν ποιοῦντες μὴ ⸀ἐγκακῶμεν, καιρῷ γὰρ ἰδίῳ θερίσομεν μὴ ἐκλυόμενοι.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/009.yaml
  text: And let us not grow weary in doing good[a], for in due time we will reap[c][b], if we do not give up.
translation:
  language: ig
  text: Ka anyị ghara ịda mba n’ime ime ezi ihe[a], n’ihi na n’oge kwesịrị ekwesị[b], anyị ga-ewe ihe ubi, ma ọ bụrụ na ike agwụghị anyị[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “n’ime ime ihe dị mma.”
    reason: lexical_alternative
  - marker: b
    text: N’ụzọ nkịtị karị, “n’oge nke ya.”
    reason: lexical_alternative
  - marker: c
    text: N’ụzọ nkịtị karị, “n’enweghị ịgwụ ike.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ καλὸν
  choice: ezi ihe
  rationale: Nkebiokwu a na ποιέω pụtara ime ihe dị mma ma ọ bụ ihe kwesịrị ekwesị. “Ezi ihe” bụ okwu Igbo doro anya nke na-echekwa echiche omume ọma dị n’ebe a.
- source_word: ποιοῦντες
  choice: n’ime
  rationale: Participle a na-egosi ihe a na-aga n’ihu na-eme; “n’ime” jikọtara ya n’ụzọ ebumpụta ụwa na ndụmọdụ bụ́ isi.
- source_word: μὴ ἐγκακῶμεν
  choice: Ka ike ghara ịgwụ anyị
  rationale: ἐγκακέω nwere ike ịpụta ịda mbà n’obi, ịda mba, ma ọ bụ ịgwụ ike n’ime ihe a na-eme. Nhọrọ a bụ Igbo e ji eme ihe ma na-enye ohere ịmata ọdịiche ya na okwu ikpeazụ ἐκλύω.
- source_word: καιρῷ ... ἰδίῳ
  choice: mgbe oge kwesịrị ekwesị ruru
  rationale: καιρός na ἴδιος ọnụ na-egosi oge dabara adaba ma ọ bụ oge e kwesịrị ka ihe ahụ mee; ntụgharị a doro ndị na-agụ Igbo anya ma ghara ikwu kpọmkwem onye kpebiri oge ahụ.
- source_word: θερίσομεν
  choice: anyị ga-aghọrọ mkpụrụ
  rationale: Nhọrọ a na-echekwa ihe atụ ọrụ ugbo nke ịghọrọ ihe a kụrụ, bụ́ nke gbara amaokwu a gburugburu.
- source_word: μὴ ἐκλυόμενοι
  choice: ma ọ bụrụ na anyị adaghị mba
  rationale: 'Participle a nwere echiche ọnọdụ n’ebe a: owuwe ihe ubi ga-abịa ma ọ bụrụ na ndị na-eme ezi ihe akwụsịghị n’ihi ike ọgwụgwụ ma ọ bụ nkụda mmụọ. “Adaghị mba” dị iche ntakịrị na “ike ghara ịgwụ,” ya mere ọ na-echekwa okwu abụọ Pọl ji mee ihe.'
theological_decisions:
- issue: 'Mmekọrịta dị n’etiti okwu abụọ gbasara ịnọgidesi ike: ἐγκακῶμεν na ἐκλυόμενοι'
  choice: 'A tụgharịrị ha n’ụzọ abụọ yiri ibe ha ma dịtụ iche: “ike ghara ịgwụ anyị” na “anyị adaghị mba.”'
  alternative: “Ka anyị ghara ịda mba” ... “n’enweghị ike ọgwụgwụ.”
  rationale: Pọl ji okwu abụọ metụtara nkụda mmụọ na ịkwụsị mee ihe. Ichekwa obere ọdịiche ha na-eme ka nkwughachi okwu ahụ ghara ịla n’iyi, ma ọ naghị etinye nkọwa ozizi karịrị ihe ederede kwuru.
- issue: Ike ọnọdụ dị na μὴ ἐκλυόμενοι
  choice: “ma ọ bụrụ na anyị adaghị mba”
  alternative: “n’ejighị ike ọgwụgwụ” ma ọ bụ “anyị adaghị mba”
  rationale: Ọ bụ ezie na Grik ji participle, n’ime ahịrịokwu a ọ nwere ike igosi ọnọdụ metụtara “anyị ga-aghọrọ mkpụrụ.” E debere njikọ ahụ n’ụzọ doro anya, n’enweghị ịkọwa ụdị ụgwọ ọrụ ma ọ bụ ụzọ nzọpụta.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. “Ịghọrọ mkpụrụ” na-echekwa ihe atụ ọrụ ugbo. Akara nkọwa ala ala [a], [b], na [c] niile pụtara n’ederede bụ́ isi, ma e debere ihe okwu Grik nwere ike ịpụta n’enweghị itinye echiche otu ụka pụrụ iche.
