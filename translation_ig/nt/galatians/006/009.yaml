  rationale: 'E degharịrị amaokwu ahụ naanị iji mee ka Igbo ya bụrụ nke nkịtị karị ma kwekọọ nke ọma na usoro na ọdịiche okwu nke Grik: ἐγκακέω → “ịda mba”; ἐκλύω → “ike agwụ.” E dochiri nkebiokwu oge na okwu owuwe ihe ubi n’ụdị Standard Igbo doro anya. Akara nkọwa ala ala atọ ahụ ka dị ma dabara n’ebe ha kwesịrị.'
