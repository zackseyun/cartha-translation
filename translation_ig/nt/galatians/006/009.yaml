    rationale: N’ederede a, “ike ghara ịgwụ anyị” dị nso na ἐκλύω, ebe “adaghị mba” dị nso na ἐγκακέω. Ịtụgharị ha n’usoro nke Grik na-echekwa usoro na obere ọdịiche nkwughachi Pọl.
  - severity: low
    issue: “Mgbe oge kwesịrị ekwesị ruru” nwere nkwughachi ma na-eme ka ‘oge’ bụrụ oge a ga-eru, karịa oge kwesịrị ekwesị a na-eme ihe.
    rationale: “N’oge kwesịrị ekwesị” na-asụ Igbo nke ọma ma na-anọchi καιρῷ ἰδίῳ kpọmkwem.
  - severity: low
    issue: “Aghọrọ mkpụrụ” adịghị ka okwu owuwe ihe ubi kacha nkịtị n’amaokwu a.
    rationale: “Iwe ihe ubi” na-edobe ihe atụ ịkụ na owuwe ihe ubi nke θερίσομεν ma bụrụ okwu Igbo a na-ahụkarị.
