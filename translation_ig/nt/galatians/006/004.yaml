id: GAL.6.4
reference: Galatians 6:4
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τὸ δὲ ἔργον ἑαυτοῦ δοκιμαζέτω ἕκαστος, καὶ τότε εἰς ἑαυτὸν μόνον τὸ καύχημα ἕξει καὶ οὐκ εἰς τὸν ἕτερον,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/004.yaml
  text: But let each one test his own work[a], and then he will have his reason for boasting in himself alone and not in the other person[b],
translation:
  language: ig
  text: Ma ka onye ọ bụla nyochaa ọrụ nke aka ya, mgbe ahụ ọ ga-enwe ihe ọ ga-eji anya isi banyere onwe ya naanị, ọ bụghị banyere onye ọzọ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔργον
  choice: ọrụ
  rationale: “Ọrụ” bụ okwu sara mbara nke nwere ike ịgụnye omume mmadụ na ihe ọ na-arụpụta, n’enweghị ime ka ọ bụrụ naanị otu omume.
- source_word: δοκιμαζέτω
  choice: ka ... nyochaa
  rationale: “Nyochaa” na-egosi ileba ihe anya iji mata ụdị ya ma ọ bụ ịdị mma ya, n’ebughị ụzọ kpebie na nsonaazụ ya ga-adị mma.
- source_word: ἕκαστος
  choice: onye ọ bụla
  rationale: 'Nke a na-echekwa echiche nkesa nke okwu Grik ahụ: mmadụ n’otu n’otu.'
- source_word: ἑαυτοῦ
  choice: nke aka ya
  rationale: Ọ na-egosi na onye ahụ ga-enyocha ọrụ nke ya, ọ bụghị nke onye ọzọ.
- source_word: εἰς ἑαυτὸν μόνον
  choice: n’ebe onwe ya naanị nọ
  rationale: Nke a na-echekwa nlebara anya n’onwe onye na ike nke μόνον, ma na-ekwekọkwa na ntụnyere megide onye ọzọ.
- source_word: καύχημα
  choice: ihe ọ ga-eji anya isi
  rationale: Nkebiokwu a nwere ike ịpụta ihe ndabere ma ọ bụ ihe kpatara ịnya isi, ma ọ ka na-edobe njikọ ya na omume ịnya isi.
- source_word: ἕξει
  choice: ọ ga-enwe
  rationale: Nke a na-enye ọdịnihu dị mfe nke na-egosi ihe ga-esochi nyocha ọrụ mmadụ.
- source_word: τὸν ἕτερον
  choice: onye ọzọ
  rationale: Ọ na-ezo aka n’onye ọzọ e ji tụnyere onwe onye; “onye ọzọ” bụ Igbo doro anya ma dị ndụ.
- source_word: δέ
  choice: Ma
  rationale: “Ma” na-egosi obere ntụgharị ma ọ bụ ọdịiche n’ihe Pọl na-ekwu.
theological_decisions:
- issue: Ihe καύχημα pụtara n’okwu Pọl
  choice: “ihe ọ ga-eji anya isi”
  alternative: “ịnya isi” ma ọ bụ “ihe ndabere maka ịnya isi”
  rationale: Nhọrọ a anaghị eme ka okwu ahụ bụrụ mpako dị mma ma ọ bụ dị njọ tupu oge eruo; ọ na-echekwa esemokwu dị n’okwu ahụ.
- issue: Ụdị otu onye nke nwere nghọta izugbe
  choice: “onye ọ bụla ... nke aka ya ... ọ ga-enwe”
  alternative: Iji ọtụtụ mmadụ kwuo ya
  rationale: Igbo pụrụ iji “onye ọ bụla” na nnọchiaha “ọ/ya” gosipụta otu onye nke na-anọchi anya mmadụ niile n’enweghị itinye okike nwoke na-adịghị mkpa n’asụsụ ahụ.
- issue: Ọdịiche dị n’etiti inyocha onwe onye na iji onwe onye atụnyere ibe ya
  choice: “ọ bụghị site n’iji onwe ya tụnyere onye ọzọ”
  alternative: “ọ bụghị n’ebe onye ọzọ nọ”
  rationale: εἰς τὸν ἕτερον dị nkenke n’asụsụ Grik, ma n’ọnọdụ a ọ na-egosi na ihe mmadụ ji anya isi ekwesịghị ịdabere n’onye ọzọ. Ịkọwa ntụnyere ahụ na-eme ka Igbo bụrụ ihe okike n’enweghị idozi ụdị ịnya isi ahụ n’ụzọ ozizi.
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E debere ahịrịokwu ahụ n’ụdị otu onye dịka isi mmalite Grik si dị. Enweghị akara nkọwa ala ala n’ihi na ntụgharị isi nwere ike ikwupụta echiche ahụ nke ọma n’enweghị ya.
