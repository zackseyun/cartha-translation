  yaml_path: translation/nt/galatians/006/005.yaml
  text: For each one will carry his own load[a].
translation:
  language: ig
  text: N’ihi na onye ọ bụla ga-ebu ibu nke ya[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ga-ebu ibu nke aka ya.” Okwu Grik e ji mee ihe ebe a bụ φορτίον (“ibu”), nke dị iche na βάρη (“ibu”) e ji mee ihe n’amaokwu nke 2.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕκαστος
  choice: onye ọ bụla
  rationale: Nkebi okwu a na-egosi mmadụ n’otu n’otu, ma bụrụkwa ụzọ Igbo nkịtị si akọwa ‘onye nke ọ bụla’ n’enweghị ime ka uche onye ọbụla n’otu n’otu funahụ.
- source_word: γὰρ
  choice: N’ihi na
  rationale: Ọ na-egosi na okwu a na-akọwa ihe e kwuru tupu ya; ‘N’ihi na’ na-eme ka njikọ echiche ahụ doo anya n’Igbo.
- source_word: τὸ ἴδιον
  choice: nke ya
  rationale: Nke a na-egosi ibu nke onye ahụ n’onwe ya, ma na-echekwa ike nkesa nke onye ọ bụla n’otu n’otu.
- source_word: φορτίον
  choice: ibu
  rationale: ‘Ibu’ bụ okwu Igbo doro anya maka ihe a na-ebu, ma ọ pụkwara ịpụta ihe siri mmadụ ike. A naghị etinye ‘ọrụ dịịrị ya’ n’ahịrị bụ isi, ka a ghara ịkọwa okwu Grik ahụ karịa ihe o kwuru.
- source_word: βαστάσει
  choice: ga-ebu
  rationale: Ọ na-echekwa ọdịdị ngwaa nke ga-eme n’ọdịnihu ma na-adabara ‘ibu’ n’Igbo nke ọma.
theological_decisions:
- issue: Mmekọrịta dị n’etiti Ndị Galeshia 6:5 na 6:2
  choice: E ji ‘ibu’ sụgharịa φορτίον ebe a, ma kọwaa ọdịiche okwu Grik ahụ n’ihe odide ala peeji kama itinye nkọwa ozizi pụrụ iche n’ahịrị bụ isi.
  alternative: Ịkọwa ya kpọmkwem dị ka ibu ọrụ nke onye ọ bụla ma ọ bụ ikpe ga-abịa n’ọdịnihu.
  rationale: Okwu a na-asụ Grik na-eji φορτίον ebe a, ma jiri βάρη n’amaokwu nke 2. Nsụgharị ahụ na-ahapụ esemokwu bara uru n’etiti inyere ibe anyị aka ibu ibu na onye ọ bụla ibu nke ya, n’ekpebighị kpọmkwem otú e si edozi ya n’usoro ozizi.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe ma nwee ugwu. Ahịrịokwu ahụ dị nkenke dịka nke Grik, ma akara ihe odide ala peeji [a] dị n’ahịrị bụ isi.
