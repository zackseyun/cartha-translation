review_pass:
  verdict: revise
  source_fidelity: The warning, agricultural metaphor, generic reference to humanity, and emphatic correspondence between sowing and reaping are conveyed accurately. However, “a pụghị ịkwa Chineke emo” primarily states inability (“God cannot be mocked”), whereas οὐ μυκτηρίζεται is a present passive assertion, “God is not mocked / is not treated with contempt.”
  naturalness: The verse is clear and idiomatic in Standard Igbo. Recasting the middle clause as the customary passive/general expression “a naghị akwa Chineke emo” is more natural and closer to the Greek verbal assertion.
  terminology: '“Chineke,” “mmadụ,” “kụrọ,” and “ghọrọ” are appropriate Standard Igbo renderings. No footnote is required: mmadụ naturally expresses the generic singular force of ἄνθρωπος without importing a male-only sense.'
  issues:
  - severity: medium
    issue: “a pụghị ịkwa Chineke emo” shifts the aspect and nuance of οὐ μυκτηρίζεται.
    rationale: The Greek says literally that God “is not mocked,” not explicitly that mocking God is impossible. Although the draft’s wording can communicate the proverb’s force, it adds an ability/impossibility formulation not present in the source. “A naghị akwa Chineke emo” preserves the direct, proverbial passive sense.
  revised_text: 'Unu ekwela ka e duhie unu: a naghị akwa Chineke emo; n’ihi na ihe ọ bụla mmadụ kụrụ, ọ bụkwa ya ka ọ ga-aghọrọ.'
