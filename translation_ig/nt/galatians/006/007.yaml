source:
  edition: SBLGNT
  text: μὴ πλανᾶσθε, θεὸς οὐ μυκτηρίζεται· ὃ γὰρ ⸀ἐὰν σπείρῃ ἄνθρωπος, τοῦτο καὶ θερίσει·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/007.yaml
  text: 'Do not be deceived: God is not mocked[a], for whatever a man sows, this he will also reap.'
translation:
  language: ig
  text: 'Unu ekwela ka e duhie unu: a naghị akwa Chineke emo; n’ihi na ihe ọ bụla mmadụ kụrụ, ọ bụkwa ya ka ọ ga-aghọrọ.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μὴ πλανᾶσθε
  choice: Unu ekwela ka e duhie unu
  rationale: 'Nke a na-egosi iwu dị n''ụdị passive, onye nke abụọ plural: a na-adọ ìgwè ndị a aka ná ntị ka ha ghara ikwe ka e duhie ha.'
- source_word: θεὸς
  choice: Chineke
  rationale: Ọ bụ okwu Igbo a na-ejikarị akọwa θεός ebe a, ya bụ otu ezi Chineke ahụ.
- source_word: οὐ μυκτηρίζεται
  choice: a pụghị ịkwa Chineke emo
  rationale: Nke a na-edobe echiche nke ịkwa emo ma ọ bụ ileda anya n'ụzọ mkparị; ‘a pụghị’ na-ekwupụta ike ilu ahụ nke ọma n'Igbo.
- source_word: ὃ γὰρ ἐὰν
  choice: n’ihi na ihe ọ bụla
  rationale: Ọ na-egosi ọnọdụ izugbe na-enweghị ịkọwapụta otu ihe kpọmkwem.
- source_word: σπείρῃ
  choice: kụrụ
  rationale: ‘Ịkụ mkpụrụ’ bụ ụzọ Igbo si ekwu sowing; ebe ihe a na-akụ doro anya site n'ilu ọrụ ugbo, ‘kụrụ’ bụ nke eke ma na-edobe ihe atụ ahụ.
- source_word: ἄνθρωπος
  choice: mmadụ
  rationale: ἄνθρωπος ebe a na-anọchi anya mmadụ n'ozuzu ya. ‘Mmadụ’ bụ otu aha singular n'Igbo, ọ naghị ewepụkwa ma nwoke ma nwanyị.
- source_word: τοῦτο καὶ θερίσει
  choice: ọ bụkwa ya ka ọ ga-aghọrọ
  rationale: Usoro a na-emesi njikọ kpọmkwem dị n'etiti ihe a kụrụ na ihe a ga-aghọ ike; ‘bụkwa ya’ na-egosipụta τοῦτο na καί.
theological_decisions:
- issue: Ihe ἄνθρωπος pụtara n'okwu a
  choice: mmadụ
  alternative: nwoke
  rationale: Ọ bụ ezie na ἄνθρωπος bụ singular ma nwee ike ịpụta ‘nwoke’ n'ọnọdụ ụfọdụ, ebe a ọ na-anọchi anya mmadụ ọ bụla. ‘Mmadụ’ na-edobe singular na nghọta izugbe nke okwu Grik ahụ n'ụzọ eke n'Igbo, n'enweghị itinye nkọwa ụka pụrụ iche.
- issue: Ike okwu οὐ μυκτηρίζεται
  choice: a pụghị ịkwa Chineke emo
  alternative: a naghị akwa Chineke emo
  rationale: ‘A pụghị’ na-egosipụta na mmadụ agaghị eme ka Chineke bụrụ onye e meriri ma ọ bụ onye a ghọgburu site n'ileda ya anya; ọ na-edobe ike na esemokwu nke ịdọ aka ná ntị ahụ.
translation_notes:
  register: Asụsụ Igbo Izugbe, dị ugbu a ma nwee nsọpụrụ. E debere ụda ịdọ aka ná ntị na ilu ịkụ mkpụrụ na owuwe ihe ubi n'ụzọ dị mfe nghọta. A chọghị nkọwa ala peeji n'ihi na ‘mmadụ’ n'Igbo na-egosipụta ihe ἄνθρωπος pụtara n'ozuzu ya n'enweghị mgbagwoju anya.
