  rationale: The revision changes only the rendering of οὐ μυκτηρίζεται, replacing an explicit impossibility statement with a natural Igbo passive/general construction that corresponds directly to “God is not mocked.” The warning, register, and sowing–reaping imagery remain unchanged.
