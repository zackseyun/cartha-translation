revisions:
- from: Lee otú mkpụrụedemede ndị m ji aka m dee unu si buo ibu[a].
  to: Leenụ otú mkpụrụedemede ndị m ji aka m deere unu hà ukwuu[a].
  rationale: The revision retains the likely sense of large physical letters while using natural Standard Igbo syntax. “Leenụ” reflects the plural imperative, “deere unu” clearly expresses writing to the recipients, and “hà ukwuu” directly predicates size of the letters. The footnote preserves, without endorsing, the historically supported alternative that πηλίκοις γράμμασιν refers to the length of the letter.
  reviewer_model: gpt-5.6-terra
