base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/011.yaml
  text: See with what large letters I have written to you with my own hand[a].
translation:
  language: ig
  text: Leenụ otú mkpụrụedemede ndị m ji aka m deere unu hà ukwuu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Leenụ otú akwụkwọ ozi m ji aka m deere unu hà dị ogologo.”
    reason: alternative_reading
lexical_decisions:
- source_word: Ἴδετε
  choice: Lee
  rationale: Ọ bụ iwu na-adọta uche ndị a na-agwa okwu; “Lee” dị nkenke ma bụrụkwa okwu Igbo a na-eji eme ka mmadụ tụlee ihe.
- source_word: πηλίκοις
  choice: otú ... si buo ibu
  rationale: Ọ na-egosi hà ma ọ bụ ịdị ukwuu. N'ebe a, njikọ ya na γράμμασιν na okwu banyere iji aka dee ihe na-akwado hà mkpụrụedemede.
- source_word: γράμμασιν
  choice: mkpụrụedemede
  rationale: N'ebe a, ọ kacha ezo aka n'akara e ji ede okwu, ọ bụghị akwụkwọ ozi ahụ dum.
- source_word: ὑμῖν
  choice: unu
  rationale: Ọ bụ onye nnata nke ihe Pọl dere; “dee unu” bụ usoro okwu Igbo doro anya ma dịkwa n'okike.
- source_word: ἔγραψα
  choice: ndị m ... dee
  rationale: A sụgharịrị aorist ahụ dịka omume ide ihe e mechara, nke ihe e dere ka dị n'ihu ndị na-agụ ya.
- source_word: τῇ ἐμῇ χειρί
  choice: ji aka m
  rationale: Nke a na-egosi na Pọl n'onwe ya ji aka ya dee ya; n'Igbo, “aka m” na-egosipụta echiche ahụ n'ụzọ ebumpụta ụwa.
theological_decisions:
- issue: Ihe πηλίκοις γράμμασιν pụtara
  choice: hà buru ibu nke mkpụrụedemede e dere
  alternative: ogologo akwụkwọ ozi ahụ
  rationale: γράμματα na-apụtakarị mkpụrụedemede ma ọ bụ akara e dere, okwu sochiri ya bụ́ “ji aka m” na-akwadokwa echiche banyere otú aka dere ihe ahụ dị. Ma ebe πηλίκος nwekwara ike igosi ịdị ukwuu n'ogo, e debere nghọta nke akwụkwọ ozi dị ogologo n'okpuru peeji.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ “mkpụrụedemede” iji mee ka ihe a na-ekwu banyere hà akara e dere pụta ìhè, ebe e chekwara nghọta ọzọ n'okpuru peeji.
