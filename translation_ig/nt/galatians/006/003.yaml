id: GAL.6.3
reference: Galatians 6:3
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἰ γὰρ δοκεῖ τις εἶναί τι μηδὲν ὤν, ⸂φρεναπατᾷ ἑαυτόν⸃·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/003.yaml
  text: For if anyone thinks he is something when he is nothing[a], he deceives himself.
translation:
  language: ig
  text: N’ihi na ọ bụrụ na onye ọ bụla echee na ya bụ ihe, mgbe ọ na-abụghị ihe ọ bụla, ọ na-aghọgbu onwe ya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ọ na-eduhie onwe ya n’uche.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ γὰρ
  choice: N’ihi na ọ bụrụ na
  rationale: Nke a na-echekwa ma ọrụ nkọwa nke γάρ (‘n’ihi na’) ma ọnọdụ nke εἰ (‘ọ bụrụ na’), ma jikọọ amaokwu a nke ọma na ndụmọdụ bu ya ụzọ.
- source_word: δοκεῖ
  choice: echee
  rationale: N’ebe a, okwu ahụ na-ekwu banyere otú mmadụ si ele onwe ya anya, ọ bụghị otú o si yie ndị ọzọ.
- source_word: τις
  choice: onye ọ bụla
  rationale: Okwu a na-anọchi anya mmadụ n’ozuzu ya ma mee ka ịdọ aka ná ntị a metụta onye ọ bụla.
- source_word: εἶναί τι
  choice: na ya bụ ihe
  rationale: Nke a na-echekwa okwu Pọl dị mkpirikpi nke pụtara na mmadụ na-ewere onwe ya dị ka onye bara uru ma ọ bụ dị mkpa, ma na-edobe ntụnyere ya na ‘ọ bụghị ihe ọ bụla.’
- source_word: μηδὲν ὤν
  choice: mgbe ọ na-abụghị ihe ọ bụla
  rationale: Nke a na-egosipụta ọnọdụ participle ahụ n’Igbo doro anya, n’ebughị ụzọ mee ka ọ bụrụ nkwenye mmegide siri ike karịa nke Grik kwuru.
- source_word: φρεναπατᾷ
  choice: na-aghọgbu
  rationale: ‘Na-aghọgbu’ bụ okwu Igbo doro anya maka iduhie mmadụ; n’ebe a, onye ahụ na-eme ya onwe ya n’ihe gbasara echiche ya.
- source_word: ἑαυτόν
  choice: onwe ya
  rationale: Nke a na-echekwa nkwụghachi omume nke reflexive pronoun ahụ. Igbo anaghị amanye ka a họrọ nwoke ma ọ bụ nwanyị n’ụdị nnọchiaha a.
theological_decisions:
- issue: Ntụaka mmadụ n’ozuzu ya
  choice: onye ọ bụla / ya / onwe ya
  alternative: nwoke ọ bụla / onwe ya
  rationale: Ọ bụ ezie na Grik ji ụdị otu onye nke asụsụ na-ewere dị ka nwoke, ntụaka ya bụ nke onye ọ bụla. Nnọchiaha Igbo ‘ọ/ya’ enweghị akara nwoke ma ọ bụ nwanyị, ya mere ọ na-echekwa otu onye na ntụaka izugbe ahụ n’enweghị ịgbakwunye okike mmadụ na-adịghị mkpa.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke kwụ ọtọ ma dị ùgwù. A hapụrụ ntụnyere Pọl nke ‘ịbụ ihe’ na ‘ịghara ịbụ ihe ọ bụla’ ka ike okwu mbụ ahụ ghara ịla n’iyi.
