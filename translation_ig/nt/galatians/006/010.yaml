revisions:
- from: Ya mere, mgbe ohere dịịrị anyị[a], ka anyị na-emere mmadụ niile ihe ọma, ma karịchaa ndị so n’ezinụlọ nke okwukwe[b][c].
  to: Ya mere, mgbe anyị nwere ohere[a], ka anyị na-emere mmadụ niile ihe ọma, ma karịchaa ndị ezinụlọ nke okwukwe[b][c].
  rationale: The revision makes only limited lexical and idiomatic improvements. It renders the Greek idiom of having an opportune occasion more directly and identifies the recipients as members of the household of faith, while preserving the universal scope of doing good and the special emphasis on fellow believers. The three footnote anchors remain attached to their relevant expressions.
