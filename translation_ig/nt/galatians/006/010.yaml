id: GAL.6.10
reference: Galatians 6:10
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἄρα οὖν ὡς καιρὸν ⸀ἔχομεν, ἐργαζώμεθα τὸ ἀγαθὸν πρὸς πάντας, μάλιστα δὲ πρὸς τοὺς οἰκείους τῆς πίστεως.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/010.yaml
  text: So then[a], as we have opportunity, let us do what is good toward everyone[c][b], and especially toward those who are of the household of faith.
translation:
  language: ig
  text: Ya mere, mgbe anyị nwere ohere[a], ka anyị na-emere mmadụ niile ihe ọma, ma karịchaa ndị ezinụlọ nke okwukwe[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “mgbe anyị ka nwere oge.” Okwu Grik bụ καιρός na-elekwasị anya n’oge dabara adaba ma ọ bụ ohere, ọ bụghị naanị oge n’ozuzu ya.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ndị bụ ezinụlọ nke okwukwe” ma ọ bụ “ndị so n’ezinụlọ nke okwukwe.” Okwu Grik ji okwu gbasara otu ụlọ ma ọ bụ ezinụlọ kọwaa ndị so n’otu ndị kwere ekwe.
    reason: lexical_alternative
  - marker: c
    text: A pụkwara ịghọta “okwukwe” dị ka “okwukwe ahụ,” ya bụ, nkwupụta okwukwe Ndị Kraịst ha niile na-ekwupụta.
    reason: alternative_reading
lexical_decisions:
- source_word: ἄρα οὖν
  choice: Ya mere
  rationale: Nkebiokwu a na-egosi nkwubi okwu sitere n’ihe e kwuru tupu ya; “Ya mere” bụ ụzọ Igbo doro anya ma bụrụkwa nke e ji ekwu okwu n’ụzọ ebumpụta ụwa.
- source_word: ὡς καιρὸν ἔχομεν
  choice: mgbe ohere dịịrị anyị
  rationale: καιρός na-elekwasị anya n’oge dabara adaba ma ọ bụ ohere ime ihe, ọ bụghị naanị n’oge n’ozuzu ya. Nkebiokwu Igbo a na-egosipụta echiche ahụ n’ụzọ dị mfe.
- source_word: ἐργαζώμεθα
  choice: ka anyị na-emere
  rationale: Ụdị subjunctive a bụ agbamume nye ọgbakọ, present tense ya na-egosikwa omume a ga-anọgide na-eme. “Ka anyị na-emere” dabara na ihe a na-emere ndị mmadụ.
- source_word: τὸ ἀγαθὸν
  choice: ihe ọma
  rationale: Adjective neuter a nwere article na-arụ ọrụ dị ka noun; “ihe ọma” bụ ntụgharị Igbo doro anya nke na-echekwa ọdịdị omume ọma ahụ.
- source_word: πρὸς πάντας
  choice: mmadụ niile
  rationale: πρός ebe a na-egosi ndị omume ahụ na-erute. N’ime ahịrịokwu Igbo “na-emere mmadụ niile” na-egosipụta nke a n’ụzọ ebumpụta ụwa ma tinye mmadụ niile.
- source_word: μάλιστα δὲ
  choice: ma karịchaa
  rationale: Okwu a na-enye otu ìgwè mkpa pụrụ iche n’ime iwu gbasara mmadụ niile, ọ naghị ewepụ ndị ọzọ.
- source_word: τοὺς οἰκείους τῆς πίστεως
  choice: ndị so n’ezinụlọ nke okwukwe
  rationale: οἰκεῖοι bụ ndị nke otu ụlọ ma ọ bụ ezinụlọ. Nhọrọ a na-echekwa ihe atụ ezinụlọ ahụ ma na-ezere ịkọwa ya naanị dị ka òtù iwu kwadoro.
- source_word: πίστεως
  choice: okwukwe
  rationale: “Okwukwe” bụ ntụgharị Igbo kwesịrị ekwesị maka πίστις n’ebe a, ma ọ ka na-ahapụ ohere ịghọta ya dị ka ihe ndị kwere ekwe jikọrọ ọnụ.
theological_decisions:
- issue: Oke iru mmadụ niile na mkpa pụrụ iche nke imere ndị kwere ekwe ihe ọma
  choice: Iwu ahụ metụtara mmadụ niile, ma ọ na-enye ndị nọ n’ezinụlọ nke okwukwe mkpa pụrụ iche.
  alternative: Ịghọta iwu ahụ dị ka nke metụtara naanị ndị kwere ekwe, ma ọ bụ dị ka nke na-enyeghị ha mkpa pụrụ iche.
  rationale: πρὸς πάντας na-egosi mmadụ niile, ebe μάλιστα na-agbakwụnye mkpa pụrụ iche nye ndị ezinụlọ nke okwukwe. A hapụrụ akụkụ abụọ ahụ ka ha dị n’otu n’enweghị ihichapụ nke ọ bụla.
- issue: Ihe τῆς πίστεως pụtara
  choice: E debere “okwukwe” dị ka ihe e ji amata ezinụlọ ahụ.
  alternative: A pụkwara ịghọta ya dị ka “okwukwe ahụ,” ya bụ nkwupụta okwukwe Ndị Kraịst ha niile nwere.
  rationale: Ihe odide Grik na-akwado “okwukwe” ma ọ chọghị ka a kpachie ya n’echiche ụkpụrụ nkwenkwe a haziri ahazi. Ihe odide isi na ndetu ala na-echekwa ohere nghọta abụọ ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “Ezinụlọ nke okwukwe” na-echekwa ihe atụ ezinụlọ dị n’asụsụ Grik, ebe “mgbe ohere dịịrị anyị” na-enye echiche καιρός n’ụzọ Igbo ebumpụta ụwa.
