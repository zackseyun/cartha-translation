review_pass:
  verdict: revise
  source_fidelity: 'The draft correctly conveys the inferential force, the available/opportune occasion, the exhortation to do good to all, and the special priority given to believers. A small adjustment is warranted: “ndị so n’ezinụlọ” can suggest people merely participating in a family, whereas οἰκείους identifies household members/those belonging to it. “ndị ezinụlọ nke okwukwe” more directly preserves this sense.'
  naturalness: The text is clear and uses natural modern Standard Igbo. “Mgbe anyị nwere ohere” is a more direct and idiomatic rendering of ὡς καιρὸν ἔχομεν than “mgbe ohere dịịrị anyị,” while retaining the contextual sense of opportunity.
  terminology: “Okwukwe” appropriately renders πίστεως and retains the source’s breadth. “Ezinụlọ nke okwukwe” preserves the household metaphor without imposing an institutional interpretation. The revised footnote avoids defining the referent more narrowly as an organized congregation.
  issues:
  - severity: low
    issue: “ndị so n’ezinụlọ nke okwukwe” is slightly less precise for τοὺς οἰκείους τῆς πίστεως.
    rationale: οἰκεῖοι denotes household members or those belonging to a household. “Ndị ezinụlọ nke okwukwe” states that relationship more directly.
  - severity: low
    issue: The wording “mgbe ohere dịịrị anyị” is somewhat less direct than the Greek possession idiom.
    rationale: “Mgbe anyị nwere ohere” naturally expresses “as/while we have opportunity” and supports the note’s distinction between opportunity and time in general.
  - severity: low
    issue: Footnote b’s reference to “ọgbakọ” may over-specify the household metaphor.
    rationale: The Greek uses household language for believers; “otu ndị kwere ekwe” retains that reference without adding a congregational/institutional frame.
