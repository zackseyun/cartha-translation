id: GAL.6.16
reference: Galatians 6:16
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ὅσοι τῷ κανόνι τούτῳ στοιχήσουσιν, εἰρήνη ἐπ’ αὐτοὺς καὶ ἔλεος, καὶ ἐπὶ τὸν Ἰσραὴλ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/016.yaml
  text: And as many as will walk by this rule—peace be upon them and mercy[c][b][a], and upon the Israel of God.
translation:
  language: ig
  text: Ndị niile ga na-eso ụkpụrụ a[a]—ka udo na ebere dịrị ha, dịrịkwa Izrel nke Chineke.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ndị niile ga-agbaso ụkpụrụ a.” Ngwaa Grik ahụ nwere echiche nke ije ije n’ahịrị ma ọ bụ ịnọgide na-aga kwekọrọ n’ụkpụrụ.
    reason: lexical_alternative
  - marker: b
    text: 'A na-arụrịta ụka banyere “Izrel nke Chineke”: Pọl nwere ike na-ekwu maka ndị Juu kwere ekwe, Nzukọ Kraịst dum, ma ọ bụ ndị Chineke n’ụzọ sara mbara. Nsụgharị a na-echekwa okwu Grik ahụ n’ekpebighị arụmụka ahụ.'
    reason: alternative_reading
  - marker: c
    text: Njikọ ikpeazụ ahụ nwere ike ịgbakwunye òtù ọzọ (“dịrịkwa Izrel nke Chineke”), ma ọ bụ kọwagharịa otu òtù ahụ (“ya bụ, Izrel nke Chineke”).
    reason: alternative_reading
lexical_decisions:
- source_word: ὅσοι
  choice: ndị niile
  rationale: Ọ na-egosipụta mmadụ niile dabara n’òtù a n’ụzọ doro anya ma bụrụkwa Igbo a na-asụ ugbu a.
- source_word: κανόνι
  choice: ụkpụrụ
  rationale: “Ụkpụrụ” na-egosi ihe e ji atụ ma ọ bụ eduzi omume; ọ na-eburu echiche nke norm ma ọ bụ standard dị na κανών n’enweghị nkọwa agbakwunyere.
- source_word: στοιχήσουσιν
  choice: ga na-eje ije kwekọrọ
  rationale: Nke a na-echekwa ihe atụ nke ije ije n’ahịrị ma ọ bụ ime ihe kwekọrọ n’ụkpụrụ, kama ime ka ọ bụrụ naanị “ịgbaso.”
- source_word: εἰρήνη
  choice: udo
  rationale: Nke a bụ okwu Igbo kwesịrị ekwesị maka εἰρήνη, ma dabara n’okwu ngọzi a.
- source_word: ἔλεος
  choice: ebere
  rationale: “Ebere” bụ okwu Igbo doro anya maka ἔλεος ma na-esonyere “udo” nke ọma n’ọchịchọ ngọzi.
- source_word: ἐπ’ αὐτοὺς ... καὶ ἐπὶ
  choice: dịrị ha ... ma dịrịkwa
  rationale: Usoro a bụ Igbo ebumpụta ụwa n’okwu ngọzi, ma ọ na-echekwa nkwughachi echiche nke ἐπί n’ebe abụọ ahụ.
- source_word: Ἰσραὴλ τοῦ θεοῦ
  choice: Izrel nke Chineke
  rationale: Nsụgharị a na-egosipụta njikọ mkpụrụokwu Grik ahụ ozugbo ma ghara ikpebi onye ma ọ bụ òtù okwu ahụ na-ezo aka na ya.
theological_decisions:
- issue: Onye okwu ahụ bụ “Izrel nke Chineke” na-ezo aka na ya
  choice: E debere ya dịka “Izrel nke Chineke” n’akọwaghị ma ọ bụ ndị Juu kwere ekwe, nzukọ Kraịst niile, ma ọ bụ ndị Chineke n’ụzọ sara mbara.
  alternative: A pụrụ ịkọwa ya dịka ndị Juu kwere ekwe, nzukọ Kraịst niile, ma ọ bụ ndị Chineke niile gụnyere ndị Juu na ndị mba ọzọ kwere ekwe.
  rationale: Okwu Grik ahụ anaghị amanye otu nkọwa naanị; idebe ya otu a na-echekwa mgbagwoju anya na esemokwu nkà mmụta okpukpe dị na ya.
- issue: Ike nke καί ikpeazụ tupu “Izrel nke Chineke”
  choice: A sụgharịrị ya “ma ... kwa,” nke ka na-enye ohere ka a ghọta Izrel nke Chineke dịka òtù ọzọ ma ọ bụ dịka nkọwagharị nke otu òtù ahụ.
  alternative: A pụrụ ịsụgharị ya n’echiche mgbakwunye, “na Izrel nke Chineke,” ma ọ bụ n’echiche nkọwagharị, “ya bụ, Izrel nke Chineke.”
  rationale: Njikọ ahụ nwere ike ịrụ ọrụ n’ụzọ abụọ n’ebe a; nsụgharị ahụ ekwesịghị idozi ajụjụ nkọwa na nkà mmụta okpukpe nke Grik hapụrụ oghe.
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. “Ga na-eje ije kwekọrọ” na-echekwa ihe atụ Pọl ji mee ihe, ebe “udo na ebere dịrị” na-enye okwu ngọzi ahụ ụda Igbo ebumpụta ụwa. E debeghị nkọwa ụka ọ bụla n’ime isiokwu a.
