base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/015.yaml
  text: For neither circumcision counts for anything[a], nor uncircumcision[b], but a new creation.
translation:
  language: ig
  text: N’ihi na ibi úgwù abụghị ihe ọ bụla, ịbụ onye a na-ebighị úgwù abụghịkwa ihe ọ bụla, kama ọ bụ okike ọhụrụ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “kama, onye e kere ọhụrụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὔτε γὰρ
  choice: N’ihi na ... adịghị ... adịghịkwa
  rationale: “N’ihi na” na-ejigide ọrụ nkọwa nke γάρ ma jiri usoro “... adịghị ... adịghịkwa” gosipụta njikọ οὔτε ... οὔτε n’Igbo eke.
- source_word: περιτομή
  choice: ibi úgwù
  rationale: Nke a bụ okwu Igbo a na-aghọta nke ọma maka emume ibi úgwù; ọ na-edobe ma omume ahụ n’onwe ya ma ọnọdụ njirimara ọ na-anọchi anya n’ebe a.
- source_word: τί ἐστιν
  choice: adịghị ihe ọ bụ
  rationale: Akpaalaokwu Igbo a na-egosi na ihe ahụ enweghị uru ma ọ bụ mkpa na-ekpebi okwu, ma ọ naghị agbasa ihe Grik kwuru karịa ókè.
- source_word: οὔτε ἀκροβυστία
  choice: ịbụ onye a na-ebighị úgwù adịghịkwa ihe ọ bụ
  rationale: A sụgharịrị ya dị ka ọnọdụ nke onye a na-ebighị úgwù, nke dabara n’ọgụgụ Pọl ma zere nsụgharị nkịtị nke akụkụ ahụ́ nke ga-eduhie n’ebe a.
- source_word: ἀλλὰ
  choice: kama
  rationale: “Kama” na-egosi ntụgharị siri ike site n’ọnọdụ abụọ ahụ gaa n’ihe Pọl na-ekwu na ọ bụ isi okwu.
- source_word: καινὴ κτίσις
  choice: ihe dị mkpa bụ okike ọhụrụ
  rationale: “Okike ọhụrụ” na-edobe obosara κτίσις dịka ọrụ okike ma ọ bụ ọnọdụ ọhụrụ e kere eke; e tinyere “ihe dị mkpa bụ” iji mee ka ahịrịokwu na-enweghị ngwaa doo anya n’Igbo, dịka ihe τί ἐστιν na ἀλλά na-egosi.
theological_decisions:
- issue: Ihe ntụnyere Pọl n’etiti ibi úgwù, ịbụ onye a na-ebighị úgwù, na okike ọhụrụ pụtara
  choice: E gosiri na ọnọdụ abụọ ahụ enweghị mkpa na-ekpebi okwu ma e jiri ha tụnyere okike ọhụrụ.
  alternative: Ịkọwa ya naanị dịka akara njirimara mmekọrịta mmadụ, ma ọ bụ dịka ụzọ abụọ hà nhata.
  rationale: Grik na-agọnahụ na nke ọ bụla n’ime ọnọdụ abụọ ahụ bụ “ihe,” wee tụnyere ha na “okike ọhụrụ.” Nsụgharị ahụ na-edobe ọdịiche a n’etinyeghị ozizi otu ụka n’ime ya.
- issue: Ma καινὴ κτίσις ọ bụ “okike ọhụrụ” ka ọ bụ “onye e kere ọhụrụ”
  choice: okike ọhụrụ
  alternative: onye e kere ọhụrụ
  rationale: κτίσις nwere ike izo aka n’ihe e kere eke ma ọ bụ n’okike; “okike ọhụrụ” na-edobe nghọta sara mbara ma kwekọọ nke ọma na ojiji Pọl n’ebe a, ebe nhọrọ nke mmadụ n’otu n’otu ka ga-ekwe omume dịka nkọwa ọzọ.
translation_notes:
  register: Asụsụ Igbo Izugbe nke ugbu a, dị ùgwù ma dị mfe nghọta. E ji “ibi úgwù” na “okike ọhụrụ” mee ka okwu Pọl dị nkenke ma nwee ike idobe ibu nkà mmụta okpukpe ya.
