source:
  edition: SBLGNT
  text: Ἡ χάρις τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ μετὰ τοῦ πνεύματος ὑμῶν, ἀδελφοί· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/018.yaml
  text: The grace of our Lord Jesus Christ be with your spirit[a], brothers[b]. Amen.
translation:
  language: ig
  text: Ka amara Onyenwe anyị Jizọs Kraịst dịnyere mmụọ unu, ụmụnna[a]. Amen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ụmụnna” n'ebe a na-ezo aka n'obodo ndị kwere ekwe, ọ pụkwara ịgụnye ma ndị nwoke ma ndị nwanyị.
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρις
  choice: amara
  rationale: “Amara” bụ okwu Igbo a na-ejikarị akọwa χάρις n'ozizi Pọl; ọ na-echekwa echiche nke ihu ọma na onyinye ọma Chineke.
- source_word: κυρίου
  choice: Onyenwe anyị
  rationale: Nke a bụ nsụgharị ebumpụta ụwa nke κύριος n'Igbo ma na-echekwa nkwupụta Ndị Kraịst banyere ọchịchị Jizọs.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jizọs Kraịst
  rationale: “Jizọs” bụ ụdị aha ahụ a maara nke ọma n'Igbo, “Kraịst” bụkwa aha-ọkwa ọdịnala nke Χριστός; ihe ọ pụtara dị ka Mesaịa ka akọwara n'okpuru.
- source_word: μετὰ
  choice: dịnyere
  rationale: Asụsụ Grik enweghị ngwaa n'usoro ngọzi a; “dịnyere” na-eme ka ngọzi ahụ bụrụ Igbo dị mma ma chekwaa echiche nke “ịnọnyere.”
- source_word: πνεύματος ὑμῶν
  choice: mmụọ unu
  rationale: Nke a na-esochi kpọmkwem otu aha “mmụọ” na nnọchiaha ọtụtụ “unu,” na-egosipụta na a na-agwa ọgbakọ ahụ dum okwu.
- source_word: ἀδελφοί
  choice: ụmụnna
  rationale: “Ụmụnna” bụ okwu Igbo ebumpụta ụwa e ji akpọ ndị otu ezinụlọ ma ọ bụ obodo okwukwe; n'ọnọdụ a ọ pụrụ ịgụnye ndị nwoke na ndị nwanyị.
- source_word: ἀμήν
  choice: Amen
  rationale: E debere ụdị okwu litọji a maara nke ọma n'Igbo.
theological_decisions:
- issue: Nsụgharị Χριστός n'ngọzi mmechi Pọl
  choice: Kraịst
  alternative: Mesaịa
  rationale: “Kraịst” bụ ụdị a maara nke ọma ma dị ugwu n'Igbo. E ji ihe odide ala kọwaa na ọ bụ aha-ọkwa pụtara “Mesaịa,” ka ihe okwu Grik ahụ pụtara ghara ifu.
- issue: Ndị ἀδελφοί na-agụnye n'ọgbakọ ahụ
  choice: ụmụnna
  alternative: ụmụnne nwoke na ụmụnne nwanyị
  rationale: Okwu Igbo “ụmụnna” dabara nke ọma n'ịkpọkọta obodo ndị kwere ekwe, ma ọ naghị amanye nkọwa ogologo n'ahịrịokwu ahụ; ihe odide ala na-eme ka o doo anya na ọ pụrụ ịgụnye nwoke na nwanyị.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị ugwu ma dị mfe nghọta. Ahịrịokwu ahụ na-eji usoro ngọzi ebumpụta ụwa “Ka ... dịnyere ...” ma na-echekwa “mmụọ unu” nke ederede Grik. Agbakwunyere naanị otu akara [a], ọ pụtakwara n'ahịrịokwu bụ isi.
