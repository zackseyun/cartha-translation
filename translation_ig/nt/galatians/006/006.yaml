  yaml_path: translation/nt/galatians/006/006.yaml
  text: Let the one who is taught the word share in all good things with the one who teaches.
translation:
  language: ig
  text: Ka onye a na-akụziri okwu ahụ soro onye na-akụzi okwu ahụ kerịta ezi ihe niile.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “Ka onye a na-akụziri okwu ahụ nye onye na-akụzi okwu ahụ òkè n'ezi ihe niile.” O yikarịrị ka nke a gụnyere iji ihe onwunwe akwado onye na-akụzi okwu ahụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Κοινωνείτω
  choice: ka ... kerịta
  rationale: Ngwaa a dị n'ụdị iwu nke na-egosi omume a ga na-eme. “Kerịta” na-egosipụta isoro onye ọzọ nwee òkè n'ihe, ma hapụkwa okwu ahụ ka ọ gụnye nkwado nke ihe onwunwe na ụdị ezi ihe ndị ọzọ.
- source_word: δὲ
  choice: —
  rationale: δὲ bụ njikọ dị nro nke na-egosi ntụgharị n'okwu, ọ bụghịrịrị mmegide. A hapụrụ ya n'enweghị okwu Igbo pụrụ iche ka a ghara iji “ma” mee ka mmegide dị ike karịa nke Grik.
- source_word: ὁ κατηχούμενος
  choice: onye a na-akụziri
  rationale: Nke a na-egosi onye na-anata nkuzi ugbu a; nsụgharị a bụ Igbo doro anya ma zere itinye aha ụka pụrụ iche nke pụtara mgbe e mesịrị.
- source_word: τὸν λόγον
  choice: okwu ahụ
  rationale: N'ebe a λόγος na-ezo aka n'ozi ma ọ bụ nkuzi a na-akụzi. “Okwu ahụ” nọ nso n'okwu Grik ma ghara ịgbakwunye “Chineke,” nke na-adịghị n'ahịrịokwu a.
- source_word: τῷ κατηχοῦντι
  choice: onye na-akụzi ya
  rationale: Nke a na-akọwa onye na-enye nkuzi, ma na-edobe myirịta dị n'etiti onye a na-akụziri na onye na-akụzi.
- source_word: ἐν πᾶσιν ἀγαθοῖς
  choice: ezi ihe niile
  rationale: Okwu a sara mbara ma nwee ike ịgụnye ihe onwunwe na enyemaka bara uru ndị ọzọ. “Ezi ihe niile” na-edobe obosara ahụ n'Igbo e ji eme ihe ugbu a.
theological_decisions:
- issue: Ụdị ikerịta ihe e nyere n'iwu
  choice: Onye a na-akụziri ga-eso onye na-akụzi ya kerịta ezi ihe niile, nke nwere ike ịgụnye nkwado nke ihe onwunwe.
  alternative: Iwere ya naanị dị ka mkpakọrịta ime mmụọ, na-enweghị nkwado nke ihe onwunwe.
  rationale: Njikọ κοινωνέω na onye a na-ekerịta ihe na ya, tinyere “ezi ihe niile,” na-akwado nghọta nke ikerịta ihe n'ụzọ bara uru. Ma okwu Grik ahụ sara mbara, ya mere nsụgharị ahụ ejedebeghị ya naanị n'ego ma ọ bụ ihe onwunwe.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta, dee ya. Nhazi “soro ... kerịta” bụ ụzọ ebumpụta ụwa e si egosipụta isoro mmadụ nwee òkè n'ihe, ma ọ naghị emechi ma okwu ahụ ọ̀ bụ naanị ihe onwunwe.
