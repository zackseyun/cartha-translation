  to: Ụmụnna[a], ọ bụrụgodị na a jide mmadụ[b][c] na mmehie ụfọdụ, unu ndị ime mmụọ, mezie onye dị otu ahụ n’ime mmụọ ịdị nwayọọ. Ka onye ọ bụla n’ime unu lezie onwe ya anya, ka a ghara ịnwa ya kwa.
  rationale: E dochiri ọdịnihu ahụ “ga-eweghachi” anya n’iwu “mezie,” wepụ “n’ụzọ ziri ezi” nke na-adịghị n’isi mmalite, ma tinye “Ka onye ọ bụla n’ime unu…” iji gosipụta n’Igbo na ịdọ aka ná ntị ahụ metụtara onye ọ bụla n’ime ndị “ime mmụọ.” E degharịrị nkọwa b ka ọ ghara ikwusi ike n’echiche “a hụrụ mmadụ ka ọ na-eme mmehie,” nke na-achọ ịkọwa isi mmalite karịa ka ọ dị.
