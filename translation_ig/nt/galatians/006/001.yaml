id: GAL.6.1
reference: Galatians 6:1
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἀδελφοί, ἐὰν καὶ προλημφθῇ ἄνθρωπος ἔν τινι παραπτώματι, ὑμεῖς οἱ πνευματικοὶ καταρτίζετε τὸν τοιοῦτον ἐν πνεύματι πραΰτητος, σκοπῶν σεαυτόν, μὴ καὶ σὺ πειρασθῇς.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/001.yaml
  text: Brothers[a], even if a man is caught in some trespass, you who are spiritual should restore such a one in a spirit of gentleness, watching yourself[c][b], lest you also be tempted.
translation:
  language: ig
  text: Ụmụnna[a], ọ bụrụgodị na a jide mmadụ[b][c] na mmehie ụfọdụ, unu ndị ime mmụọ, mezie onye dị otu ahụ n’ime mmụọ ịdị nwayọọ. Ka onye ọ bụla n’ime unu lezie onwe ya anya, ka a ghara ịnwa ya kwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ụmụnna” sụgharịrị ụdị ọtụtụ nke nwoke na Grik, ma ụdị a nwere ike ịkpọ ndị kwere ekwe, ma ndị nwoke ma ndị nwanyị.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, “a kpalie mmadụ n’ime mmehie ụfọdụ,” ma ọ bụ “mmehie ụfọdụ jide mmadụ na mberede.”
    reason: alternative_reading
  - marker: c
    text: “Mmadụ” sụgharịrị okwu Grik nke pụtara mmadụ n’ozuzu; ọ naghị ekwu kpọmkwem na onye ahụ bụ nwoke.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀδελφοί
  choice: Ụmụnna
  rationale: Okwu a bụ oku a na-akpọ ndị otu ezinụlọ okwukwe. “Ụmụnna” bụ okwu Igbo dị ndụ ma dị ùgwù, nke nwekwara ike ịgụnye ndị nwoke na ndị nwanyị n’ọgbakọ.
- source_word: ἐὰν καὶ
  choice: ọ bụrụgodị na
  rationale: Ọ na-egosipụta ọnọdụ nwere nghọta nke nkwenye ma ọ bụ ihe a na-atụghị anya ya; “ọ bụrụgodị na” na-ebute nke a nke ọma.
- source_word: προλημφθῇ
  choice: ejide
  rationale: “Ejide” na-enye isi echiche nke ịbụ onye mmejọ jidere, ma ọ ka na-ahapụ ohere maka nghọta ọzọ nke ịbụ onye a hụrụ ka ọ na-eme ya; e debere nkọwa ndị ahụ n’ala peeji.
- source_word: ἄνθρωπος
  choice: mmadụ
  rationale: ἄνθρωπος ebe a bụ aha mmadụ n’ozuzu, ọ bụghị ἀνήρ nke na-akọwa nwoke kpọmkwem. “Mmadụ” bụ okwu Igbo ziri ezi ma dị mfe.
- source_word: ἔν τινι παραπτώματι
  choice: mmehie ụfọdụ
  rationale: παράπτωμα bụ ịda n’ụzọ ma ọ bụ ime ihe megidere uche Chineke. “Mmehie” bụ okwu ndị mmadụ na-aghọta nke ọma, “ụfọdụ” na-egosikwa τινι.
- source_word: οἱ πνευματικοὶ
  choice: unu ndị bụ ndị ime mmụọ
  rationale: 'Nsụgharị a na-edebe obosara okwu Pọl: o nwere ike izo aka n’ebe ndị Mmụọ Nsọ na-achị nọ ma ọ bụ ndị tozuru etozu n’ime mmụọ, n’emeghị ka naanị otu nghọta bụrụ iwu.'
- source_word: καταρτίζετε
  choice: ga-eweghachi … n’ụzọ ziri ezi
  rationale: Okwu a pụtara idozi ma ọ bụ iweghachi ihe n’ọnọdụ kwesịrị ekwesị. Usoro a na-eme ka iwu ahụ doo anya n’Igbo.
- source_word: τὸν τοιοῦτον
  choice: onye dị otu ahụ
  rationale: Ọ na-atụ aka kpọmkwem n’onye ahụ e kwuru banyere ya, ma na-edebe ya n’otu onye dịka Grik si dị.
- source_word: ἐν πνεύματι πραΰτητος
  choice: n’ime mmụọ nke ịdị nwayọọ
  rationale: A hapụrụ “mmụọ” n’ederede ka okwu ahụ nwee ike igosi ọnọdụ obi mmadụ nakwa omume nke Mmụọ Nsọ na-amịpụta, n’akọwaghị ya karịa isi mmalite.
- source_word: σκοπῶν σεαυτόν
  choice: Lezie onwe gị anya
  rationale: Ọ na-enye ịdọ aka ná ntị nye onye ọ bụla na-eweghachi onye ọzọ, ma na-edebe ụdị onye nke abụọ dị n’otu dịka Grik si dị.
- source_word: μὴ καὶ σὺ πειρασθῇς
  choice: ka a ghara ịnwakwa gị
  rationale: “Ịnwa” na-egosi ọnwụnwa nke ime mmehie n’ọnọdụ a; “-kwa” na-edebe καὶ, ya bụ, na onye na-enyere aka nwekwara ike ịdaba.
theological_decisions:
- issue: Ndị okwu Ἀδελφοί na ἄνθρωπος na ụdị nwoke/ụdị mmadụ n’ozuzu
  choice: A sụgharịrị ha “Ụmụnna” na “mmadụ,” ma tinye nkọwa na-egosi etu ha si arụ ọrụ n’ebe a.
  alternative: “Ụmụnne nwoke” na “nwoke”
  rationale: ἄνθρωπος pụtara mmadụ n’ozuzu, ọ bụghị nwoke kpọmkwem; Ἀδελφοί bụ ụdị ọtụtụ nke nwoke na Grik ma n’okwu a ọ pụrụ ịkpọ ọgbakọ dum. Igbo na-egosipụta nke a n’ụzọ eke site na “Ụmụnna” na “mmadụ,” n’emeghị ka nwoke bụrụ ihe Grik na-ekwughị kpọmkwem.
- issue: Ihe προλημφθῇ pụtara
  choice: “mmehie ụfọdụ ejide mmadụ”
  alternative: “a hụ mmadụ ka ọ na-eme mmehie” ma ọ bụ “mmehie bịakwasị mmadụ na mberede”
  rationale: Ngwaa ahụ nwere ike igosi ma ịbụ onye e jidere n’ime mmejọ ma mmejọ ijide mmadụ na mberede. Isi ederede na nkọwa ala peeji na-edebe esemokwu a.
- issue: Ihe πνεῦμα pụtara na ἐν πνεύματι πραΰτητος
  choice: E debere “mmụọ” n’enweghị nkọwa ọzọ.
  alternative: “jiri obi dị nwayọọ” ma ọ bụ “site na Mmụọ Nsọ nke na-eweta ịdị nwayọọ”
  rationale: Akụkụokwu ahụ nwere ike ịkọwa ọnọdụ ime mmadụ ma ọ bụ omume Mmụọ Nsọ na-amịpụta. Nsụgharị ahụ anaghị emechi otu n’ime ụzọ abụọ ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A zere okwu ụka nke otu ngalaba pụrụ iche. A hapụrụ nghọta sara mbara nke “ndị ime mmụọ” na “mmụọ nke ịdị nwayọọ,” ebe isi Grik n’onwe ya anaghị akọwa ha n’otu ụzọ naanị.
