  verdict: revise
  source_fidelity: A chọrọ mmegharị n’ihi na “ga-eweghachi” bụ ọdịnihu, ebe καταρτίζετε bụ iwu kpọmkwem. “n’ụzọ ziri ezi” na-agbakwụnye echiche na-adịghị n’ederede Grik. Ekwesịrịkwa ime ka ịdọ aka ná ntị nke participle singular metụta onye ọ bụla n’ime ndị a gwara okwu.
  naturalness: “Unu ndị ime mmụọ, mezie…” bụ Standard Igbo dị eke ma sie ike karịa “unu ndị bụ ndị ime mmụọ ga-eweghachi…”. “Ka onye ọ bụla n’ime unu lezie onwe ya anya” na-ezere mgbanwe na-adịghị edo anya site n’oku ọtụtụ mmadụ gaa n’oku otu onye.
  terminology: “Ụmụnna,” “mmadụ,” “ndị ime mmụọ,” “mmụọ ịdị nwayọọ,” na “ọnwụnwa” na-edobe nkọwa sara mbara nke Grik n’enweghị ịtụgharị ya n’usoro nkwenkwe pụrụ iche. “Mmehie ụfọdụ” nabatara maka παραπτώματι, ebe nkọwa ala peeji na-echekwa echiche “a jidere/overtaken.”
  issues:
  - severity: medium
    issue: “ga-eweghachi” anaghị egosi iwu καταρτίζετε nke ọma.
    rationale: Ngwaa Grik bụ present imperative plural; nsụgharị kwesịrị ịbụ iwu, dịka “mezie” ma ọ bụ “weghachinụ.”
  - severity: medium
    issue: “n’ụzọ ziri ezi” bụ mgbakwunye echiche.
    rationale: Isi mmalite ekwughị “n’ụzọ ziri ezi”; ọ na-ekwu ka e mee ya “n’ime mmụọ ịdị nwayọọ.”
  - severity: low
    issue: “Lezie onwe gị anya” na-eso ndị a kpọrọ “unu” n’enweghị igosi na singular participle ahụ bụ nkesa nye onye ọ bụla.
    rationale: “Ka onye ọ bụla n’ime unu lezie onwe ya anya” na-egosi nke a n’Igbo n’ụzọ doro anya.
