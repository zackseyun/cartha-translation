  text: For if I rebuild the things I tore down[b][a], I prove myself to be a transgressor.
translation:
  language: ig
  text: N’ihi na ọ bụrụ na m na-ewughachi ihe ndị ahụ m kwaturu[b], ana m egosi onwe m dịka onye na-emebi iwu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ana m eme ka o doo anya na m bụ onye na-emebi iwu.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ihe ndị ahụ m bibiri” ma ọ bụ “ihe ndị ahụ m kwasasịrị.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ γὰρ
  choice: N’ihi na ọ bụrụ na
  rationale: “N’ihi na” na-egosi na ahịrịokwu a na-akọwa arụmụka gara aga, ebe “ọ bụrụ na” na-echekwa ọnọdụ nke εἰ.
- source_word: ἃ ... ταῦτα
  choice: ihe ndị ahụ ...
  rationale: Nhọrọ a na-echekwa nhazi ntụaka nke okwu Grik ahụ na ọtụtụ ihe ọ na-ekwu maka ha, ma na-ada nke ọma n’Igbo.
- source_word: κατέλυσα
  choice: m kwaturu
  rationale: “Kwaturu” na-echekwa ihe atụ nke ịkwatu ụlọ, nke dabara kpọmkwem na “iwughachi”; ọ naghị akpọpụta nkọwa dị warara karịa ihe odide ahụ.
- source_word: πάλιν οἰκοδομῶ
  choice: m ewughachi
  rationale: “Wughachi” na-ejikọta echiche nke πάλιν na οἰκοδομῶ n’Igbo dị mfe ma na-echekwa ihe atụ nke iwu ụlọ ọzọ.
- source_word: παραβάτην
  choice: onye na-emebi iwu
  rationale: Okwu a na-enye echiche omume na nke iwu dị na παραβάτης n’asụsụ Igbo ndị mmadụ na-aghọta nke ọma, n’agbanyeghị na ihe odide Grik ekwughị kpọmkwem νόμος n’ahịrịokwu a.
- source_word: ἐμαυτὸν συνιστάνω
  choice: ana m eme ka o doo anya na m bụ
  rationale: Nhọrọ a na-egosi na omume onye ahụ na-eme ka njirimara ya dị ka onye mmebi iwu pụta ìhè, ma na-echekwa ike nke nnọchiaha onwe ἐμαυτόν n’ụzọ Igbo na-ada eke.
