id: GAL.2.20
reference: Galatians 2:20
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ζῶ δὲ οὐκέτι ἐγώ, ζῇ δὲ ἐν ἐμοὶ Χριστός· ὃ δὲ νῦν ζῶ ἐν σαρκί, ἐν πίστει ζῶ τῇ τοῦ ⸂υἱοῦ τοῦ θεοῦ⸃ τοῦ ἀγαπήσαντός με καὶ παραδόντος ἑαυτὸν ὑπὲρ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/020.yaml
  text: And it is no longer I who live[a], but Messiah lives in me. And the life that I now live in the flesh, I live by faith in the Son of God, who loved me and gave himself for me.
translation:
  language: ig
  text: Ana m adị ndụ, ma ọ bụghịzi m na-adị ndụ; kama Onye e tere mmanụ na-adị ndụ n’ime m. Ndụ nke m na-ebi ugbu a n’anụ ahụ, ana m ebi ya site n’okwukwe n’Ọkpara Chineke[a], onye hụrụ m n’anya ma nye onwe ya maka m.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “site na ikwesị ntụkwasị obi nke Ọkpara Chineke.”
    reason: alternative_reading
lexical_decisions:
- source_word: Χριστός
  choice: Onye E Tere Mmanụ
  rationale: A sụgharịrị aha-ọkwa Grik a dịka “Onye E Tere Mmanụ,” kama iji naanị mkpụrụokwu a kpọgharịrị n’ụda dịka “Kraịst.” Nke a na-egosi ọrụ ya dịka aha-ọkwa Mesaya n’ebe a.
- source_word: ὃ δὲ νῦν ζῶ
  choice: Ndụ m na-adị ugbu a
  rationale: Nkebi Grik a bụ okwu e mere mkpirikpi; itinye “ndụ” n’Igbo na-eme ka ọ bụrụ okwu ebumpụta ụwa ma ghara ịgbakwunye echiche ọhụrụ.
- source_word: σάρξ
  choice: anụ ahụ
  rationale: N’ebe a, okwu ahụ na-ezo aka ná ndụ mmadụ nke ụwa a n’ime ahụ, ọ bụghị kpọmkwem n’ọdịdị mmehie. “Anụ ahụ” na-edobe echiche Pọl ma doo onye na-agụ ya anya.
- source_word: πίστει
  choice: okwukwe
  rationale: “Okwukwe” bụ nsụgharị doro anya nke πίστις n’ebe a. E debere nghọta ọzọ nke pụtara ikwesị ntụkwasị obi n’okpuru peeji.
- source_word: τῇ τοῦ υἱοῦ τοῦ θεοῦ
  choice: n’Ọkpara Chineke
  rationale: 'Isi ahịrịokwu na-ewere genitive a dịka onye okwukwe ahụ chere ihu: okwukwe n’Ọkpara Chineke. E chekwara nghọta nke ọzọ n’okpuru peeji n’ihi na usoro Grik ahụ nwere ezi mgbagwoju anya.'
- source_word: παραδόντος ἑαυτὸν ὑπὲρ ἐμοῦ
  choice: nye onwe ya maka m
  rationale: Nke a bụ ụzọ Igbo si ekwu n’ụzọ dị mma na ọ jiri aka ya rara onwe ya nye n’ihi onye ọzọ, ma ọ naghị eme ka ὑπέρ bụrụ naanị okwu nnọchi anya.
theological_decisions:
- issue: Ihe πίστις na genitive pụtara na τῇ τοῦ υἱοῦ τοῦ θεοῦ
  choice: site n’okwukwe n’Ọkpara Chineke
  alternative: site na ikwesị ntụkwasị obi nke Ọkpara Chineke
  rationale: Usoro Grik nwere ike ịpụta okwukwe onye kwere ekwe nwere n’Ọkpara Chineke, ma ọ bụ ikwesị ntụkwasị obi nke Ọkpara Chineke n’onwe ya. Isi ederede họọrọ nghọta nke mbụ n’ihi na ọ doro onye nkịtị anya, ebe nkọwa ala peeji na-echekwa nghọta nke abụọ n’emebighị mgbagwoju anya ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dịkwa mfe nghọta. E jighị okwu ụka nke otu denomination mee ka ihe odide ahụ nwee nkọwa pụrụ iche. Akara [a] dị ozugbo n’akụkụ nkebi okwu ọ na-akọwa.
