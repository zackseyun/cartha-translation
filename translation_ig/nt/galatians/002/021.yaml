id: GAL.2.21
reference: Galatians 2:21
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οὐκ ἀθετῶ τὴν χάριν τοῦ θεοῦ· εἰ γὰρ διὰ νόμου δικαιοσύνη, ἄρα Χριστὸς δωρεὰν ἀπέθανεν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/021.yaml
  text: I do not nullify the grace of God[a], for if righteousness comes through the law[c][b], then Messiah died for nothing.
translation:
  language: ig
  text: Anaghị m akagbu amara Chineke; n’ihi na ọ bụrụ na a na-enweta ezi omume[a] site n’iwu, mgbe ahụ Mesaịa[b] nwụrụ n’efu.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ikpe ziri ezi.”
    reason: lexical_alternative
  - marker: b
    text: N’asụsụ Grik, Christos; a sụgharịwo ya ebe a dị ka “Mesaịa” n’ihi na ọ na-arụ ọrụ dị ka utu aha.
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “nwụrụ na-enweghị uru ọ bụla.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀθετῶ
  choice: akagbu
  rationale: “Ịkagbu” na-egosi ime ka ihe ghara ịdị irè ma ọ bụ ghara inwe ike, nke dabara n’arụmụka Pọl karịa naanị “ịjụ.”
- source_word: χάριν
  choice: amara
  rationale: “Amara” bụ okwu Igbo a na-ejikarị akọwa ihu ọma Chineke nke a na-enye n’efu, ma ọ dabara n’echiche Pọl n’ebe a.
- source_word: διὰ νόμου
  choice: na-abịa site n’iwu
  rationale: Nkebi a na-eme ka ngwaa a hapụrụ n’asụsụ Grik pụta n’Igbo n’ụzọ ebumpụta ụwa, ma na-edobe echiche nke ụzọ ma ọ bụ ihe e ji enweta ya.
- source_word: δικαιοσύνη
  choice: ezi omume
  rationale: “Ezi omume” na-edobe okwu ahụ dịka aha echiche sara mbara, n’etinyeghị nkọwa ọzọ nke ga-amanye ya ịbụ naanị ikpe ziri ezi ma ọ bụ naanị ịbụ onye a gụrụ n’onye ezi omume.
- source_word: Χριστὸς
  choice: Mesaịa
  rationale: N’ebe a Χριστός na-arụ ọrụ dịka utu aha nke Onye E Tere Mmanụ, ya mere “Mesaịa” na-eme ka ọrụ utu aha ahụ doo anya.
- source_word: δωρεὰν
  choice: n’efu
  rationale: N’ọnọdụ a, okwu ahụ na-egosi na ọnwụ ahụ agaraghị enwe isi ma ọ bụ uru; “n’efu” na-enye ike arụmụka ahụ n’Igbo dị mfe ma dị ugbu a.
theological_decisions:
- issue: Mmekọrịta dị n’etiti δικαιοσύνη na iwu n’arụmụka Pọl
  choice: Amaokwu ahụ na-ekwu na ọ bụrụ na ezi omume na-abịa site n’iwu, ọnwụ Mesaịa ga-abụrịrị n’efu.
  alternative: A pụkwara ịnụ δικαιοσύνη dịka “ikpe ziri ezi,” nke nwere ike ime ka echiche idozi mmekọrịta ọgbụgba ndụ pụta ìhè.
  rationale: A hapụrụ “ezi omume” dịka okwu sara mbara, ka nsụgharị ahụ ghara ikpebi n’ụzọ zuru ezu ma Pọl na-elekwasị anya naanị n’ịgụ mmadụ n’onye ezi omume, n’ọnọdụ ezi omume, ma ọ bụ n’ikpe ziri ezi nke Chineke.
translation_notes:
  register: 'E ji Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-edobe usoro arụmụka nke Grik: nkwupụta, ihe kpatara ya, ọnọdụ “ọ bụrụ na,” na nkwubi okwu ya. E zere ịgbatị “ezi omume” ka ọ bụrụ nkọwa okpukpe nke ga-emechi nghọta ndị ọzọ okwu Grik ahụ nwere ike ibu.'
