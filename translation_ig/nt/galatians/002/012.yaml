id: GAL.2.12
reference: Galatians 2:12
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: πρὸ τοῦ γὰρ ἐλθεῖν τινας ἀπὸ Ἰακώβου μετὰ τῶν ἐθνῶν συνήσθιεν· ὅτε δὲ ⸀ἦλθον, ὑπέστελλεν καὶ ἀφώριζεν ἑαυτόν, φοβούμενος τοὺς ἐκ περιτομῆς.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/012.yaml
  text: For before certain men came from James[a], he used to eat with the Gentiles; but when they came, he began to draw back and separate himself[c][b], fearing those of the circumcision.
translation:
  language: ig
  text: N’ihi na tupu ụfọdụ ndị[a] si n’ebe Jemis nọ[b] abịa, ọ na-eso ndị mba ọzọ eri nri. Ma mgbe ha bịara, ọ malitere ịla azụ ma kewapụ onwe ya n’ebe ndị mba ọzọ nọ, n’ihi na ọ na-atụ ndị e biri úgwù[c] egwu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị ụfọdụ.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ndị ha na Jemis nọkọrọ.” Grik n’onwe ya ekwughị hoo haa ma Jemis ò zitere ha.
    reason: alternative_reading
  - marker: c
    text: Ma ọ bụ, “òtù ndị na-akwado ibi úgwù.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸ τοῦ ἐλθεῖν
  choice: tupu ... abịa
  rationale: Ọ bụ ụzọ Igbo dị mfe ma bụrụkwa nke ebumpụta ụwa isi gosipụta oge ihe mere, dị ka πρό tinyere infinitive si eme na Grik.
- source_word: τινας
  choice: ụfọdụ ndị
  rationale: Ọ na-edobe na a kpọghị ndị ahụ aha kpọmkwem, ma ọ naghị agbakwunye na ha bụ ndị Jemis zitere.
- source_word: ἀπὸ Ἰακώβου
  choice: si n’ebe Jemis nọ
  rationale: Nke a na-egosi ebe ha si ma ọ bụ njikọ ha na Jemis, ma ọ naghị ekwu hoo haa na Jemis nyere ha ikike ma ọ bụ zitere ha.
- source_word: μετὰ τῶν ἐθνῶν
  choice: na-eso ndị mba ọzọ eri nri
  rationale: “Ndị mba ọzọ” bụ okwu Igbo a na-aghọta nke ọma maka ndị na-abụghị ndị Juu; etinyeghị “ndị kwere ekwe” n’ihi na okwu ahụ adịghị na Grik.
- source_word: συνήσθιεν
  choice: ọ na-eso ... eri nri
  rationale: Usoro “ọ na-...” na-egosipụta omume ọ na-emebu, nke kwekọrọ n’ike imperfect nke ngwaa Grik.
- source_word: ὑπέστελλεν
  choice: ọ malitere ịla azụ
  rationale: Ọ na-egosipụta ịmalite ịdọrọ onwe ya azụ n’ebe mmekọrịta ahụ dị, ma na-edobe nghọta incipient nke imperfect n’ọnọdụ a.
- source_word: ἀφώριζεν ἑαυτόν
  choice: kewapụ onwe ya n’ebe ha nọ
  rationale: Ọ na-edobe reflexive ahụ ma mee ka o doo anya na nkewa a bụ nkewa mmekọrịta mmadụ na ibe ya.
- source_word: φοβούμενος
  choice: n’ihi na ọ na-atụ ... egwu
  rationale: Ọ na-egosipụta ihe kpatara omume ahụ n’Igbo dị mfe, dịka participle ahụ nwere ike isi rụọ ọrụ n’ebe a.
- source_word: τοὺς ἐκ περιτομῆς
  choice: ndị e biri úgwù
  rationale: Ọ na-akọwa ndị ahụ site n’ibi úgwù, n’ebughị ụzọ kpọọ ha otu ndọrọ ma ọ bụ òtù pụrụ iche nke Grik na-ekwughị hoo haa.
theological_decisions:
- issue: Ma ἀπὸ Ἰακώβου ọ̀ pụtara na Jemis kwadoro ma ọ bụ zitere ndị ahụ
  choice: si n’ebe Jemis nọ
  alternative: ndị Jemis zitere
  rationale: Grik na-egosi isi ebe ma ọ bụ njikọ, ma ọ naghị ekwu hoo haa na Jemis nyere ha iwu. Nsụgharị ahụ na-edobe ihe a n’amaghị ama.
- issue: Ma τοὺς ἐκ περιτομῆς ò kwesịrị ịkpọ òtù pụrụ iche
  choice: ndị e biri úgwù
  alternative: òtù ndị na-akwado ibi úgwù
  rationale: Isiokwu Grik na-akọwa ha site n’ibi úgwù, ma ọ kpọghị ha “òtù” hoo haa. Nhọrọ bụ isi na-ezere ịgbakwunye nkọwa mmekọrịta ma ọ bụ nkà mmụta okpukpe.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ “na-eso ... eri nri” iji gosipụta omume ọ na-emebu, ma e debere mgbagwoju anya gbasara njikọ ndị ahụ na Jemis na gbasara ndị e biri úgwù site na nkọwa ala peeji.
