revisions:
- from: N’ihi na tupu ụfọdụ ndị[a] si n’ebe Jemis nọ[b] abịa, ọ na-eso ndị mba ọzọ eri nri. Ma mgbe ha bịara, ọ malitere ịla azụ ma kewapụ onwe ya n’ebe ha nọ, n’ihi na ọ na-atụ ndị e biri úgwù[c] egwu.
  to: N’ihi na tupu ụfọdụ ndị[a] si n’ebe Jemis nọ[b] abịa, ọ na-eso ndị mba ọzọ eri nri. Ma mgbe ha bịara, ọ malitere ịla azụ ma kewapụ onwe ya n’ebe ndị mba ọzọ nọ, n’ihi na ọ na-atụ ndị e biri úgwù[c] egwu.
  rationale: The revision resolves a real Igbo antecedent ambiguity by identifying the Gentiles as those from whom he separated himself. It retains all source ambiguities regarding the men’s relation to James and the designation of the circumcision group, while preserving the existing footnote anchors and content.
