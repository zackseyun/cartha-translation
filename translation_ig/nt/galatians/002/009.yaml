id: GAL.2.9
reference: Galatians 2:9
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ γνόντες τὴν χάριν τὴν δοθεῖσάν μοι, Ἰάκωβος καὶ Κηφᾶς καὶ Ἰωάννης, οἱ δοκοῦντες στῦλοι εἶναι, δεξιὰς ἔδωκαν ἐμοὶ καὶ Βαρναβᾷ κοινωνίας, ἵνα ⸀ἡμεῖς εἰς τὰ ἔθνη, αὐτοὶ δὲ εἰς τὴν περιτομήν·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/009.yaml
  text: and recognizing the grace that had been given to me[a], James and Cephas and John, who were regarded as pillars, gave to Barnabas and me the right hands of fellowship[c][b], so that we would go to the Gentiles and they to the circumcised.
translation:
  language: ig
  text: Mgbe Jemis, Kefa na Jọn—ndị a na-ewere dị ka ogidi—matara amara ahụ e nyere m, ha nyere mụ na Banabas aka nri nke mmekọrịta[a], ka anyị gaa n’ebe ndị mba ọzọ nọ[b], ha onwe ha n’ebe ndị e biri úgwù nọ[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’ụzọ nkịtị, “aka nri nke mmekọrịta.” Okwu a na-ezo aka n’ịnye aka nri dịka ihe ịrịba ama nke nkwenye na imekọ ọrụ.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “mba dị iche iche”; n’ebe a ọ pụtara ndị na-abụghị ndị Juu.
    reason: lexical_alternative
  - marker: c
    text: N’ụzọ nkịtị, “ibi úgwù”; n’ebe a ọ na-ezo aka n’ndị Juu.
    reason: lexical_alternative
lexical_decisions:
- source_word: γνόντες
  choice: matara
  rationale: Ọ na-egosi na ha ghọtara ma kweta na amara ahụ dị n’ọrụ Pọl; ‘matara’ na-enye nghọta ahụ n’Igbo n’enweghị ịgbakwunye nkọwa na-adịghị na Greek.
- source_word: χάριν
  choice: amara
  rationale: ‘Amara’ bụ okwu Igbo kwesịrị ekwesị maka χάρις, ma na-edobe echiche nke ihu ọma Chineke na onyinye ọrụ Pọl n’enweghị ime ka ihe ọ pụtara dị warara.
- source_word: δοθεῖσάν μοι
  choice: e nyere m
  rationale: Ụdị a na-edobe olu nnara nke Greek ma na-egosi na e nyere Pọl amara ahụ tupu ha amata ya.
- source_word: Κηφᾶς
  choice: Kefa
  rationale: A sụgharịghị aha ahụ ka ọ bụrụ Pita, n’ihi na ederede Greek ji Κηφᾶς; ‘Kefa’ bụ ntụgharị ụda dabara n’Igbo.
- source_word: οἱ δοκοῦντες στῦλοι εἶναι
  choice: ndị a na-ewere dị ka ogidi
  rationale: Nke a na-edobe echiche nke otú ọha si ele ha anya, ma zere ime ka okwu Pọl yie mkparị ma ọ bụ obi abụọ na-enweghị isi.
- source_word: δεξιὰς ... κοινωνίας
  choice: ha ... machara aka nri dị ka ihe àmà nke njikọ aka anyị
  rationale: 'Nke a na-asụpụta omume nkwekọrịta ahụ n’Igbo eke: ịma aka nri bụ ihe àmà nke κοινωνία, ya bụ, iso ibe ha nwee òkè na imekọ ọrụ.'
- source_word: ἔθνη
  choice: ndị mba ọzọ
  rationale: N’ebe a okwu ahụ na-ezo aka n’ụmụ mmadụ na-abụghị ndị Juu, ọ bụghị nanị mba dịka ngalaba ọchịchị.
- source_word: περιτομήν
  choice: ndị e biri úgwù
  rationale: Aha nkịtị Greek bụ okwu nnọchi anya ndị Juu; ntụgharị a na-edobe ihe oyiyi ibi úgwù, ebe nkọwa ala peeji na-eme ka ndị a na-ekwu maka ha doo anya.
theological_decisions:
- issue: Ma κοινωνίας kwesịrị ịbụ ‘mmekọrịta’ naanị ya ka ọ bụ ‘njikọ aka’ n’ọrụ
  choice: njikọ aka anyị
  alternative: mmekọrịta anyị
  rationale: Ihe gbara amaokwu ahụ gburugburu bụ nkwenye maka ọrụ ozi na nkewa ebe ha ga-arụ ọrụ. ‘Njikọ aka’ na-egosi iso ibe ha nwee òkè na imekọ ọrụ, ma ọ naghị eme ka okwu ahụ bụrụ naanị mmetụta enyi.
- issue: Ma a ga-akpọ Κηφᾶς ‘Kefa’ ka ọ bụ ‘Pita’
  choice: Kefa
  alternative: Pita
  rationale: Ederede a kpọrọ ya Κηφᾶς, ya mere a na-edobe aha ahụ kama iji aha Greek ya bụ Pita dochie ya.
- issue: Ma περιτομήν ga-anọ dịka ‘ibi úgwù’ nkịtị ma ọ bụ kọwaa ya dịka ‘ndị Juu’
  choice: ndị e biri úgwù
  alternative: ndị Juu
  rationale: Isi ederede na-edobe okwu nnọchi anya nke Greek na esemokwu ya na ‘ndị mba ọzọ’; ala peeji na-akọwa na ọ na-ezo aka n’ebe a nye ndị Juu.
translation_notes:
  register: E ji Igbo Ọha nke oge a, nke dị ùgwù ma dị mfe nghọta. A haziri ahịrịokwu ahụ ka isiokwu ya—Jemis, Kefa na Jọn—pụta n’isi maka ịdị mfe n’Igbo. Akara ogologo ahịrị na-ekewa nkọwa ‘ndị a na-ewere dị ka ogidi’ ka ahịrịokwu ghara ịgbagwoju anya.
