    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “mba dị iche iche”; n’ebe a ọ pụtara ndị na-abụghị ndị Juu.
    reason: lexical_alternative
  - marker: c
    text: N’ụzọ nkịtị, “ibi úgwù”; n’ebe a ọ na-ezo aka n’ndị Juu.
    reason: lexical_alternative
  revision_rationale: The revision restores the source’s directional action (“gave ... right hands”) rather than paraphrasing it as a mutual handshake, removes interpretive expansion from the main text, and makes the notes more textually precise. It retains the draft’s sound terminology and preserves the Greek contrast between the Gentiles and the circumcised.
