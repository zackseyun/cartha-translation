  text: καὶ συνυπεκρίθησαν αὐτῷ ⸀καὶ οἱ λοιποὶ Ἰουδαῖοι, ὥστε καὶ Βαρναβᾶς συναπήχθη αὐτῶν τῇ ὑποκρίσει.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/013.yaml
  text: And the rest of the Jews also joined him in hypocrisy[b][a], so that even Barnabas was carried away by their hypocrisy.
translation:
  language: ig
  text: Ndị Juu ndị fọdụrụ sonyekwara ya n’omume ihu abụọ, nke mere na ihu abụọ ha dọpụtara ọbụna Banabas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνυπεκρίθησαν αὐτῷ
  choice: sonyekwara Pita n’ihu abụọ ya
  rationale: Ngwaa a jikọtara echiche nke iso onye ọzọ mee omume ihu abụọ. Ikwughachi aha Pita kama nnọchiaha na-eme ka onye a na-ekwu banyere ya doo anya n’Igbo.
- source_word: οἱ λοιποὶ Ἰουδαῖοι
  choice: Ndị Juu ndị ọzọ
  rationale: Nke a na-egosi ndị Juu ndị fọdụrụ n’ìgwè a na-ekwu maka ya, ma na-adịkwa mfe nghọta n’Igbo.
- source_word: ὥστε καὶ
  choice: nke mere na ... ọbụna
  rationale: Nke a na-echekwa njikọ nke nsonaazụ yana ihe ịtụnanya dị n’okwu ahụ.
- source_word: Βαρναβᾶς
  choice: Banabas
  rationale: Nke a bụ nsụgharị aha ahụ a na-ejikarị eme ihe n’Igbo.
- source_word: συναπήχθη
  choice: dọkpụrụ
  rationale: Nhọrọ a na-echekwa ọdịdị nnara nke ngwaa ahụ na echiche nke ịbụ onye mmetụta ndị ọzọ dọọrọ iso ha.
- source_word: τῇ ὑποκρίσει
  choice: ihu abụọ ha
  rationale: “Ihu abụọ” bụ ụzọ doro anya ma bụrụkwa nke nkịtị n’Igbo isi kwuo omume aghụghọ nke na-ekpuchi ihe mmadụ bu n’obi n’ezie.
