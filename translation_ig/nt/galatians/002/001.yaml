source:
  edition: SBLGNT
  text: Ἔπειτα διὰ δεκατεσσάρων ἐτῶν πάλιν ἀνέβην εἰς Ἱεροσόλυμα μετὰ Βαρναβᾶ συμπαραλαβὼν καὶ Τίτον·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/001.yaml
  text: Then after fourteen years I went up again to Jerusalem with Barnabas, also taking Titus along.
translation:
  language: ig
  text: Mgbe ahụ, mgbe afọ iri na anọ gachara, arịgoro m ọzọ gaa Jerusalem mụ na Banabas, kpọrọkwa Taịtọs ka o soro anyị.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔπειτα
  choice: Mgbe ahụ
  rationale: Ọ na-egosi usoro ihe Pọl na-akọ n'ụzọ dị mfe ma doo anya.
- source_word: διὰ δεκατεσσάρων ἐτῶν
  choice: mgbe afọ iri na anọ gachara
  rationale: N'okwu a banyere oge, διά na genitive na-egosi oge gafere tupu ihe ọzọ emee.
- source_word: πάλιν
  choice: ọzọ
  rationale: Ọ na-egosi na nke a bụ njem ọzọ Pọl gara Jerusalem.
- source_word: ἀνέβην
  choice: arịgoro m ... gaa
  rationale: Ọ na-echekwa echiche nke ịrịgo Jerusalem, ma na-ada ka Igbo ebumpụta ụwa.
- source_word: εἰς Ἱεροσόλυμα
  choice: gaa Jerusalem
  rationale: Nke a na-egosi Jerusalem dị ka ebe njem ahụ na-aga.
- source_word: μετὰ Βαρναβᾶ
  choice: mụ na Banabas
  rationale: Ọ na-egosi n'ụzọ doro anya na Banabas so Pọl gaa.
- source_word: συμπαραλαβὼν καὶ Τίτον
  choice: akpọrọ m Taịtọs soro anyị
  rationale: Ọ na-egosi na, na mgbakwunye na Banabas, Pọl kpọkwara Taịtọs ka o soro ha.
theological_decisions: []
translation_notes:
  register: Standard Igbo dị ugbu a, nke dị ugwu ma dị mfe nghọta. A họọrọ “arịgoro m” iji chekwaa ntụziaka dị na Greek, ebe “akpọrọ m Taịtọs soro anyị” na-eme ka omume participle ahụ doo anya n'Igbo.
