id: GAL.2.15
reference: Galatians 2:15
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἡμεῖς φύσει Ἰουδαῖοι καὶ οὐκ ἐξ ἐθνῶν ἁμαρτωλοί,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/015.yaml
  text: We are Jews by birth and not sinners from among the Gentiles[b][a],
translation:
  language: ig
  text: Anyị onwe anyị bụ ndị Juu site n'ọmụmụ, ọ bụghịkwa ndị mmehie si n'etiti ndị mba ọzọ[a][b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ: “ọ bụghịkwa ndị mmehie bụ́ ndị mba ọzọ.”'
    reason: lexical_alternative
  - marker: b
    text: “Site n'ọmụmụ” sụgharịrị okwu nke pụtara n'ụzọ nkịtị “site n'okike”; n'ebe a, ọ na-ekwu maka agbụrụ mmadụ sitere na ya.
    reason: cultural_note
lexical_decisions:
- source_word: Ἡμεῖς
  choice: Anyị onwe anyị
  rationale: Nnọchiaha e kwuru hoo haa nwere ntakịrị ike nkwusiri ike; “Anyị onwe anyị” na-egosipụta nke a n'Igbo n'enweghị ịgbatị ihe ọ pụtara.
- source_word: φύσει
  choice: site n'ọmụmụ
  rationale: N'ebe a okwu ahụ na-ekwu maka agbụrụ mmadụ sitere na ya, ọ bụghị ụdị omume dị n'ime ya. “Site n'ọmụmụ” bụ Igbo doro anya nke na-ebute echiche ahụ.
- source_word: Ἰουδαῖοι
  choice: ndị Juu
  rationale: Nke a bụ aha agbụrụ a na-ejikarị eme ihe n'Igbo, ọ na-echekwakwa ọdịiche dị n'etiti ndị Juu na ndị mba ọzọ.
- source_word: ἐξ ἐθνῶν
  choice: si n'etiti ndị mba ọzọ
  rationale: Nsụgharị a na-echekwa preposition ἐξ na ọdịiche agbụrụ dị n'ahịrịokwu ahụ; “ndị mba ọzọ” bụ okwu Igbo dabara adaba maka ndị na-abụghị ndị Juu n'ebe a.
- source_word: ἁμαρτωλοί
  choice: ndị mmehie
  rationale: Nke a na-echekwa okwu Pọl ji kpọọ ndị na-eme mmehie, na-emekughị ka ọdịiche ahụ dị nro ma ọ bụ tinye nkọwa ọzọ n'ime amaokwu ahụ.
theological_decisions:
- issue: Ma amaokwu ahụ ò kwesịrị ịdị ka Pọl na-akwado na ndị Juu ka ndị mba ọzọ mma n'omume
  choice: E chekwara ọdịiche agbụrụ ahụ n'ụzọ dị mkpirikpi ma kwụ ọtọ dịka Grik si kwuo ya, n'etinyeghị echiche na ndị Juu bụ ndị ezi omume site n'ọmụmụ.
  alternative: “ọ bụghịkwa ndị a na-agụ dị ka ndị mmehie dịka ndị mba ọzọ”
  rationale: Grik ekwughị “ndị a na-agụ dị ka” ma ọ bụ “dịka.” Ọnọdụ okwu gbara amaokwu ahụ gburugburu ga-akọwakwu ọdịiche ahụ; e kwesịghị itinye nkọwa ahụ n'ime amaokwu a.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. “Anyị onwe anyị” na-eburu ntakịrị nkwusiri ike nke Ἡμεῖς; a hapụrụ ụda siri ike nke ọdịiche ahụ ka ọ dị, n'emeghị ka ọ dị nro ma ọ bụ bụrụ nkwupụta ozizi agbakwunyere.
