  text: οἷς οὐδὲ πρὸς ὥραν εἴξαμεν τῇ ὑποταγῇ, ἵνα ἡ ἀλήθεια τοῦ εὐαγγελίου διαμείνῃ πρὸς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/005.yaml
  text: To them we did not yield in submission even for a moment[b][a], so that the truth of the gospel might remain for you.
translation:
  language: ig
  text: Anyị ekweghịdị ido onwe anyị n’okpuru ha ọbụna otu ntabi anya,[a] ka eziokwu nke oziọma wee dịgide maka unu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’ụzọ nkịtị, “ọbụna ruo otu awa”; ọ bụ akpaala okwu pụtara “ọbụna otu ntabi anya.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “wee dịgide n’ebe unu nọ” ma ọ bụ “wee nọnyere unu.”
    reason: alternative_reading
lexical_decisions:
- source_word: οἷς
  choice: ha
  rationale: Nnọchiaha a na-ezo aka n’ụmụ nwoke ahụ a kpọtụrụ aha n’amaokwu bu ụzọ; “ha” na-egosipụta njikọ ahụ n’ụzọ Igbo nkịtị.
- source_word: οὐδὲ πρὸς ὥραν
  choice: ọbụna otu ntabi anya
  rationale: Nkebiokwu a pụtara na ha ekweghị ma ọlị, ọbụna ruo obere oge; “otu ntabi anya” na-enye echiche ahụ n’Igbo doro anya.
- source_word: εἴξαμεν τῇ ὑποταγῇ
  choice: anyị ekweghịdị erubere ha isi
  rationale: Nke a na-egosipụta na Pọl na ndị ya ekweghị enyefe onwe ha n’okpuru ndị ahụ. Ọ na-ejikọta omume nke ‘ịda mba/ikwe’ na ọnọdụ nrubeisi n’Igbo eke, na-enweghị ime ka okwu ahụ bụrụ naanị okwu onwe onye ma ọ bụ naanị usoro ọchịchị.
- source_word: ἵνα
  choice: ka ... wee
  rationale: Usoro “ka ... wee” na-egosipụta nzube e ji mee ihe ahụ n’Igbo.
- source_word: ἡ ἀλήθεια τοῦ εὐαγγελίου
  choice: eziokwu nke oziọma
  rationale: “Oziọma” bụ okwu Igbo a maara nke ọma maka εὐαγγέλιον; usoro ahụ na-edowe okwu Pọl banyere eziokwu nke oziọma.
- source_word: διαμείνῃ
  choice: dịgide
  rationale: “Dịgide” na-egosi ịnọgide ma ọ bụ ịbụ nke a na-echekwa, dịka ngwaa Grik si pụta.
- source_word: πρὸς ὑμᾶς
  choice: maka unu
  rationale: N’ebe a, πρός nwere ike igosi uru ma ọ bụ ntụaka nye ndị Galetia; “maka unu” bụ Igbo eke, ebe “n’etiti unu” ma ọ bụ “nọnyere unu” ka ga-ekwe omume.
theological_decisions:
- issue: Ụdị ọjụjụ Pọl jụrụ ndị mmegide ahụ
  choice: Pọl kwuru na ha ekweghị erubere ndị ahụ isi ma ọlị, ka eziokwu nke oziọma wee dịgide.
  alternative: A pụrụ ịghọta ya dịka ọjụjụ Pọl jụrụ ido onwe ya n’okpuru ha n’onwe ya, ma ọ bụ dịka ọjụjụ inye ha ohere n’usoro ọchịchị.
  rationale: Grik ahụ na-ekwu n’ozuzu banyere ekweghị ‘n’irube isi’; ntụgharị a anaghị amachi ya naanị n’ihe gbasara onwe onye ma ọ bụ naanị n’ihe gbasara usoro ọchịchị.
translation_notes:
  register: Asụsụ Igbo Izugbe dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji “oziọma” debe okwu Ndị Kraịst maara nke ọma, ma zere ịgbakwunye nkọwa otu ụka ma ọ bụ ozizi pụrụ iche.
