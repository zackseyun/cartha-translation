revisions:
- from: Ma anyị ekweghịdị erubere ha isi ọbụna otu ntabi anya,[a] ka eziokwu nke oziọma wee dịgide maka unu.[b]
  to: Anyị ekweghịdị ido onwe anyị n’okpuru ha ọbụna otu ntabi anya,[a] ka eziokwu nke oziọma wee dịgide maka unu.[b]
  rationale: The revision removes an unexpressed adversative, renders the combined force of εἴξαμεν τῇ ὑποταγῇ as a refusal to place oneself under the opponents, and keeps the purpose, gospel terminology, and the ambiguity of πρὸς ὑμᾶς. The footnotes retain the idiomatic duration note and the viable locative/associative alternatives.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T19:28:59Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the refusal, the emphatic short duration, the purpose clause, and the key expression ‘eziokwu nke oziọma.’ However, ‘Ma’ has no explicit counterpart in the Greek sentence and is unnecessary. The wording can also more directly retain the sense of yielding ‘in submission’ without implying a broader obedience than the immediate context requires.
  naturalness: ‘Anyị ekweghịdị irubere ha isi’ is understandable Standard Igbo, but ‘anyị ekweghịdị ido onwe anyị n’okpuru ha’ is a more direct and natural expression of refusal to yield in submission. Removing the initial ‘Ma’ gives a smoother self-contained rendering of this verse.
  terminology: ‘Oziọma’ and ‘eziokwu nke oziọma’ are appropriate established Igbo Christian terms. ‘Dịgide’ suitably renders διαμείνῃ. ‘Maka unu’ is a defensible contextual rendering of πρὸς ὑμᾶς; the alternative ‘n’ebe unu nọ’ should be retained in the note.
  issues:
  - severity: low
    issue: The opening ‘Ma’ is not represented in the Greek text.
    rationale: The verse begins with the dative relative pronoun οἷς (‘to them/to whom’), not an adversative conjunction. Omitting ‘Ma’ avoids adding an explicit discourse relation not stated in this sentence.
  - severity: medium
    issue: ‘Ekweghịdị erubere ha isi’ can sound like general obedience rather than yielding in submission.
    rationale: εἴξαμεν τῇ ὑποταγῇ specifically describes not giving way by submitting. ‘Ido onwe anyị n’okpuru ha’ preserves this sense naturally without resolving the nature of the demanded submission.
  - severity: low
    issue: Footnote a’s literal wording does not explicitly include the prepositional duration sense.
    rationale: πρὸς ὥραν is literally ‘for/toward an hour’; ‘ọbụna ruo otu awa’ represents the phrase more fully before explaining the idiomatic sense.
  revised_text: Anyị ekweghịdị ido onwe anyị n’okpuru ha ọbụna otu ntabi anya,[a] ka eziokwu nke oziọma wee dịgide maka unu.[b]
  revised_footnotes:
  - marker: a
    text: N’ụzọ nkịtị, “ọbụna ruo otu awa”; ọ bụ akpaala okwu pụtara “ọbụna otu ntabi anya.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “wee dịgide n’ebe unu nọ” ma ọ bụ “wee nọnyere unu.”
    reason: alternative_reading
  revision_rationale: The revision removes an unexpressed adversative, renders the combined force of εἴξαμεν τῇ ὑποταγῇ as a refusal to place oneself under the opponents, and keeps the purpose, gospel terminology, and the ambiguity of πρὸς ὑμᾶς. The footnotes retain the idiomatic duration note and the viable locative/associative alternatives.
