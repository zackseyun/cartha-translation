  yaml_path: translation/nt/galatians/002/019.yaml
  text: For through the law I died to the law, so that I might live to God. I have been crucified with Messiah.
translation:
  language: ig
  text: N’ihi na site n’iwu ka m nwụrụ n’ebe iwu dị, ka m wee dị ndụ nye Chineke. E sooro Mesaịa kpọgidewo m n’obe.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γὰρ
  choice: N’ihi na
  rationale: Na-egosi na okwu a na-akọwa ma na-akwado ihe e kwuru tupu ya, ma na-eme ka usoro arụmụka ahụ doo anya n’Igbo.
- source_word: διὰ νόμου
  choice: site n’iwu
  rationale: Na-echekwa nghọta διά na genitive dị ka ụzọ ma ọ bụ ihe e ji mee ihe; ‘iwu’ n’ebe a dabara n’iwu ahụ Pọl na-ekwu maka ya n’okwu gbara ya gburugburu.
- source_word: νόμῳ
  choice: n’ebe iwu dị
  rationale: Nke a bụ ụzọ Igbo si ekwu na mmadụ anwụọla n’ihe metụtara otu ikike ma ọ bụ mmekọrịta, n’enweghị ịgbasa nkọwa nke okwu Grik ahụ dị mkpirikpi.
- source_word: ἀπέθανον
  choice: m nwụrụ
  rationale: Na-egosipụta aorist dị ka ihe mere n’oge gara aga n’ụzọ doro anya ma dị mfe.
- source_word: ἵνα
  choice: ka m wee
  rationale: Na-egosipụta ebumnuche nke ihe ahụ mere n’Igbo nkịtị.
- source_word: θεῷ ζήσω
  choice: m wee dịrị Chineke ndụ
  rationale: Na-echekwa echiche nke ibi nye Chineke—mmekọrịta na ntụziaka—kama ime ya naanị ‘ibi maka uru Chineke.’
- source_word: Χριστῷ
  choice: Mesaịa
  rationale: Na-ewere Χριστός dị ka aha ọkwá nke Onye E Tere Mmanụ, ọ bụghị naanị dị ka aha nkịtị.
- source_word: συνεσταύρωμαι
  choice: A kpọgidewo mụ na Mesaịa n’obe
  rationale: Ụdị perfect passive ahụ na-egosi ihe mere eme nke nsonaazụ ya ka dị; ‘-wo’ na-enyere aka igosipụta ọnọdụ ahụ na-aga n’ihu.
theological_decisions:
- issue: Ma a ga-akọwakwu otú Pọl si sị na site n’iwu ka ọ nwụrụ n’ebe iwu dị
  choice: 'E debere okwu ahụ n’ụdị dị mkpirikpi: ‘site n’iwu ka m nwụrụ n’ebe iwu dị.’'
  alternative: ‘ikpe iwu mara m mere ka m nwụọ n’okpuru ikike iwu’ ma ọ bụ ‘iwu mere ka m kwụsị idebe iwu.’
  rationale: Okwu Grik ahụ dị mkpirikpi ma juputakwa n’echiche nkà mmụta okpukpe. Ịgbasa ya ga-ahọrọ otu nkọwa nke ederede ahụ na-ekwughị kpọmkwem.
- issue: Ike perfect dị na συνεσταύρωμαι
  choice: ‘A kpọgidewo mụ na Mesaịa n’obe,’ nke na-egosi ihe mere ma ọnọdụ ya ka dị.
  alternative: ‘A kpọgidere mụ na Mesaịa n’obe,’ nke nwere ike igosi naanị ihe mere n’oge gara aga.
  rationale: Nhọrọ a na-echekwa ma ihe mere n’oge gara aga ma nsonaazụ ya nke ka na-adị, n’enweghị itinye nkọwa ozizi ọzọ.
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E chekwara mkpụmkpụ na esemokwu dị n’okwu banyere iwu, a naghịkwa agbasa ya ka ọ bụrụ nkọwa otu ụka.
