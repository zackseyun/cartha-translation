translation:
  language: ig
  text: Naanị ihe ha rịọrọ bụ ka anyị na-echeta ndị ogbenye, nke bụkwa kpọmkwem ihe ahụ m gbalịsiri ike ime.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μόνον
  choice: Naanị ihe ha rịọrọ bụ
  rationale: μόνον na-egosi otu arịrịọ fọdụrụ n’ọgbụgba ndụ ahụ. Ịtinye ‘ihe ha rịọrọ bụ’ na-eme ka njikọ ahụ doo anya n’Igbo n’enweghị ịgbanwe isi okwu.
- source_word: τῶν πτωχῶν
  choice: ndị ogbenye
  rationale: Nke a bụ okwu Igbo doro anya ma bụrụkwa nke a na-ejikarị akọwa ndị dara ogbenye.
- source_word: ἵνα μνημονεύωμεν
  choice: ka anyị na-echeta
  rationale: Ọ na-edobe echiche nke icheta mgbe niile; n’ọnọdụ a, icheta gụnyere ilekọta ha n’omume, ma a naghị etinye nkọwa ahụ kpọmkwem n’ahịrịokwu.
- source_word: ὃ
  choice: nke bụkwa
  rationale: Ọ na-ezo aka n’arịrịọ ahụ dum ma jikọta akụkụ abụọ nke ahịrịokwu ahụ n’ụzọ Igbo si aga were were.
- source_word: ἐσπούδασα
  choice: m ji ịnụ ọkụ n’obi na-eme
  rationale: σπουδάζω na-egosi ọchịchọ siri ike tinyere mbọ ime ihe ahụ; okwu a na-ebupụta akụkụ abụọ ahụ n’Igbo nkịtị.
- source_word: αὐτὸ τοῦτο ποιῆσαι
  choice: kpọmkwem ihe ... na-eme
  rationale: ‘kpọmkwem’ na-edobe nkwusi ike nke αὐτὸ τοῦτο, ebe ‘na-eme’ na-egosi na ọ bụghị naanị iche echiche kama ọ bụ ime ihe ahụ.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị ùgwù ma dị mfe nghọta. A họọrọ ‘ndị ogbenye’ kama okwu nwere ike ịkọwa naanị ndị nọ ná mkpa n’ozuzu. Ahịrịokwu ahụ na-ahapụ ‘icheta’ ka ọ buru ma ncheta ma nlekọta n’omume dịka isi Greek si mee.
