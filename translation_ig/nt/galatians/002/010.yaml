revisions:
- from: Naanị ihe ha rịọrọ bụ ka anyị na-echeta ndị ogbenye, nke bụkwa kpọmkwem ihe m ji ịnụ ọkụ n’obi na-eme.
  to: Naanị ihe ha rịọrọ bụ ka anyị na-echeta ndị ogbenye, nke bụkwa kpọmkwem ihe ahụ m gbalịsiri ike ime.
  rationale: The revision changes only the final verbal expression to avoid an unwarranted progressive/current sense and to represent the aorist ἐσπούδασα as Paul’s earnest past effort. The emphatic “kpọmkwem ihe ahụ” continues to represent αὐτὸ τοῦτο.
  reviewer_model: gpt-5.6-terra
