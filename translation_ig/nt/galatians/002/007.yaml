id: GAL.2.7
reference: Galatians 2:7
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀλλὰ τοὐναντίον ἰδόντες ὅτι πεπίστευμαι τὸ εὐαγγέλιον τῆς ἀκροβυστίας καθὼς Πέτρος τῆς περιτομῆς,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/007.yaml
  text: But on the contrary[a], when they saw that I had been entrusted with the gospel for the uncircumcised, just as Peter had been for the circumcised,
translation:
  language: ig
  text: Ma, n'ụzọ megidere nke ahụ, mgbe ha hụrụ na e nyefewo m oziọma maka ndị a na-ebighị úgwù, dịka e nyefeworo Pita oziọma maka ndị e biri úgwù,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’ụzọ nkịtị, “oziọma nke ndị a na-ebighị úgwù … nke ndị e biri úgwù.” E nwere ike ịghọta nke a dịka oziọma e nyefere maka ìgwè ndị ahụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ τοὐναντίον
  choice: Ma, n’ụzọ dị iche
  rationale: Na-egosi ntụgharị siri ike megide echiche gara aga, ma na-ada nke ọma n’Igbo ugbu a.
- source_word: ἰδόντες
  choice: mgbe ha hụrụ
  rationale: Na-egosipụta ọnọdụ oge nke participle aorist n’ụzọ doro anya ma dị mfe nghọta.
- source_word: πεπίστευμαι
  choice: e nyefewo m
  rationale: Perfect passive ebe a pụtara na e tinyela ozi na ọrụ n’aka Pọl, ọnọdụ ahụ ka na-adịkwa; ‘e nyefewo m’ na-echekwa nke a.
- source_word: τὸ εὐαγγέλιον
  choice: oziọma
  rationale: Ọ bụ okwu Igbo a maara nke ọma maka εὐαγγέλιον, na-echekwakwa ibu okwu ahụ nwere n’akwụkwọ Pọl.
- source_word: τῆς ἀκροβυστίας
  choice: maka ndị a na-ebighị úgwù
  rationale: Na-eme ka ndị ozi ahụ gbasara doo anya, ma na-echekwa ihe odide Grik kwuru banyere ọnọdụ ibi úgwù kama ịgbanwe ya ozugbo ka ọ bụrụ ‘ndị mba ọzọ.’
- source_word: καθὼς
  choice: dịka
  rationale: Na-egosipụta ntụnyere dị n’etiti ọrụ e nyere Pọl na nke e nyere Pita.
- source_word: Πέτρος
  choice: Pita
  rationale: Ụdị aha a bụ nke a na-ejikarị eme ihe n’Igbo ọkọlọtọ.
- source_word: τῆς περιτομῆς
  choice: maka ndị e biri úgwù
  rationale: Na-adaba n’usoro okwu nke mbụ ma na-echekwa akara ọgbụgba ndụ nke Grik jiri kama ịkọwa ya naanị dịka ‘ndị Juu.’
- source_word: '[ellipsis after Πέτρος τῆς περιτομῆς]'
  choice: e nyefere Pita ya
  rationale: Igbo chọrọ ka e megharịa echiche nke inyefe ozi ahụ ka ntụnyere wee zuo oke; ‘ya’ na-ezo aka n’oziọma ahụ, ọ bụghị oziọma ọzọ.
theological_decisions:
- issue: Ma a ga-asụgharị ἀκροβυστία / περιτομή dịka agbụrụ (‘ndị mba ọzọ’ / ‘ndị Juu’) ka ọ bụ dịka ọnọdụ ibi úgwù e kwuru kpọmkwem.
  choice: ndị a na-ebighị úgwù / ndị e biri úgwù
  alternative: ndị mba ọzọ / ndị Juu; enweghị ibi úgwù / ibi úgwù
  rationale: Nhọrọ a na-echekwa ụzọ Pọl si kọwaa ìgwè abụọ ahụ site n’akara ibi úgwù, ma zere ịgbasa ma ọ bụ mechie ihe Grik pụtara karịa ka ederede kwuru.
translation_notes:
  register: Igbo ọkọlọtọ, nke ugwu na nke mmadụ nkịtị nwere ike ịghọta. E ji ‘oziọma’ mee ihe dịka okwu Ndị Kraịst maara nke ọma; e zere ịkọwa ìgwè ndị ahụ ozugbo dịka ‘ndị mba ọzọ’ na ‘ndị Juu.’
