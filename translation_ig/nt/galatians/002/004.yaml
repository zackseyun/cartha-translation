source:
  edition: SBLGNT
  text: διὰ δὲ τοὺς παρεισάκτους ψευδαδέλφους, οἵτινες παρεισῆλθον κατασκοπῆσαι τὴν ἐλευθερίαν ἡμῶν ἣν ἔχομεν ἐν Χριστῷ Ἰησοῦ, ἵνα ἡμᾶς ⸀καταδουλώσουσιν—
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/004.yaml
  text: But because of the false brothers secretly brought in[a], who slipped in to spy out our freedom that we have in Messiah Jesus[b], so that they might enslave us—
translation:
  language: ig
  text: Ma n’ihi ụmụnna ụgha[a] ndị e webatara na nzuzo, ndị zoro banye inyocha nnwere onwe anyị nwere n’ime Mezaịa Jizọs[b], ka ha wee mee anyị ka anyị bụrụ ohu—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ụmụnna ụgha” na-echekwa okwu ezinụlọ Pọl ji; ọ na-ekwu banyere ndị na-egosi onwe ha dịka ndị ha na ya kwekọrọ n’okwukwe.
    reason: cultural_note
  - marker: b
    text: Ma ọ bụ, “Kraịst Jizọs.”
    reason: alternative_reading
lexical_decisions:
- source_word: παρεισάκτους
  choice: ndị e webatara na nzuzo
  rationale: Nke a na-egosi na e sitere n’èzí webata ha n’ụzọ zoro ezo, ma na-ekewapụkwa okwu a na ngwaa παρεισῆλθον na-esote ya.
- source_word: ψευδαδέλφους
  choice: ụmụnna ụgha
  rationale: Ọ na-edobe okwu ezinụlọ Pọl ji na ike nke nkatọ ya, kama ịgbanwe ya gaa n’okwu sara mbara dịka ‘ndị kwere ekwe ụgha.’
- source_word: παρεισῆλθον
  choice: ndị zoro banye
  rationale: Ọ na-egosipụta nke ọma na ha batara na nzuzo, n’Igbo dị mfe ma dị ugbu a.
- source_word: κατασκοπῆσαι
  choice: iledo
  rationale: ‘Iledo’ na-enye echiche nke nnyocha nzuzo nwere ebumnuche ọjọọ dị n’okwu Grik ahụ.
- source_word: ἐλευθερίαν
  choice: nnwere onwe
  rationale: Nke a bụ okwu Igbo nkịtị ma doo anya nke na-echekwa ịdị arọ nke echiche Pọl gbasara nnwere onwe.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: n’ime Mezaịa Jizọs
  rationale: ‘N’ime’ na-echekwa njikọ ἐν, ebe ‘Mezaịa’ na-eme ka ọnọdụ Χριστός dịka aha-ọkwa a na-atụ anya ya pụta ìhè.
- source_word: καταδουλώσουσιν
  choice: mee anyị ndị ohu
  rationale: Nkebiokwu a na-egosi n’ụzọ doro anya ime ka mmadụ daba n’ọnọdụ ohu, nke bụ ike okwu ngwaa Grik a.
- source_word: ἵνα ... καταδουλώσουσιν
  choice: ka ha wee mee anyị ndị ohu
  rationale: Nke a na-egosipụta ebumnuche ha n’Igbo e ji eme ihe kwa ụbọchị, ma ghara ime ka ihe ahụ bụrụrịrị ihe mezuru emezu.
theological_decisions:
- issue: Ịsụgharị Χριστῷ dịka aha-ọkwa ma ọ bụ dịka ụdị aha a maara nke ọma
  choice: Mezaịa Jizọs
  alternative: Kraịst Jizọs
  rationale: N’ebe a, Χριστός ka nwere ike ịpụta nke ọma dịka aha-ọkwa nke na-akọwa Jizọs dịka Mezaịa ahụ; ihe odide ala peeji na-echekwa ụdị ‘Kraịst Jizọs’ a maara nke ọma.
- issue: Ichekwa okwu ezinụlọ dị na ψευδαδέλφους
  choice: ụmụnna ụgha
  alternative: ndị kwere ekwe ụgha
  rationale: Nhọrọ a na-echekwa ihe atụ ezinụlọ na nkatọ Pọl, ebe ihe odide ala peeji na-akọwa na okwu a bụ maka ndị na-egosi onwe ha dịka ndị ha na ya kwekọrọ n’okwukwe.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. A hapụrụ ahịrịokwu ahụ ka ọ kwụsị na akara ogologo (—), n’ihi na echiche malitere ebe a na-aga n’ihu n’amaokwu na-esote. E debere mmegharị ụda nke ‘ndị e webatara na nzuzo, ndị zoro banye’ iji gosipụta okwu Grik abụọ yiri ibe ha ma dị iche.
