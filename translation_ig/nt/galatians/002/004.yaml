revisions:
- from: Ma ọ bụ n’ihi ụmụnna ụgha[a] ndị e webatara na nzuzo, ndị zoro banye iledo nnwere onwe anyị nwere n’ime Mezaịa Jizọs[b], ka ha wee mee anyị ndị ohu—
  to: Ma n’ihi ụmụnna ụgha[a] ndị e webatara na nzuzo, ndị zoro banye inyocha nnwere onwe anyị nwere n’ime Mezaịa Jizọs[b], ka ha wee mee anyị ka anyị bụrụ ohu—
  rationale: The revision corrects the opening connective, clarifies the spying purpose without weakening its covert and hostile sense, and strengthens the rendering of enslavement. It retains the Greek’s unfinished dash, the title-sensitive rendering “Mezaịa Jizọs,” all source distinctions, and both correctly anchored footnotes.
