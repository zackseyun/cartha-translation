    text: Ma ọ bụ, “ha anaghị eje ije n'ụzọ ziri ezi kwekọrọ n'eziokwu oziọma ahụ.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ịgbaso omenala ndị Juu.”
    reason: lexical_alternative
  revision_rationale: The revision makes the alignment sense of πρὸς τὴν ἀλήθειαν τοῦ εὐαγγελίου explicit in idiomatic Igbo, while preserving the source metaphor of walking straight. It also corrects the lexical alternatives in both notes without adding theological interpretation.
