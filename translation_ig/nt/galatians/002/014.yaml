id: GAL.2.14
reference: Galatians 2:14
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀλλ’ ὅτε εἶδον ὅτι οὐκ ὀρθοποδοῦσιν πρὸς τὴν ἀλήθειαν τοῦ εὐαγγελίου, εἶπον τῷ ⸀Κηφᾷ ἔμπροσθεν πάντων· Εἰ σὺ Ἰουδαῖος ὑπάρχων ἐθνικῶς ⸂καὶ ⸀οὐκ Ἰουδαϊκῶς ζῇς⸃, ⸀πῶς τὰ ἔθνη ἀναγκάζεις Ἰουδαΐζειν;
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/014.yaml
  text: But when I saw that they were not walking in step with the truth of the gospel[a], I said to Cephas before them all, “If you, though a Jew, live like a Gentile and not like a Jew[b], how do you compel the Gentiles to live like Jews?”
translation:
  language: ig
  text: Ma mgbe m hụrụ na ha anaghị eje ije n'ụzọ kwụ ọtọ kwekọrọ n'eziokwu oziọma ahụ[a], agwara m Kefa n'ihu ha niile, sị, “Ọ bụrụ na gị onwe gị, onye bụ onye Juu, na-ebi ndụ dịka onye mba ọzọ, ọ bụghịkwa dịka onye Juu, olee otú i si amanye ndị mba ọzọ ibi ndụ dịka ndị Juu?[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ha anaghị eje ije n'ụzọ ziri ezi kwekọrọ n'eziokwu oziọma ahụ.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ịgbaso omenala ndị Juu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀρθοποδοῦσιν
  choice: adịghị eje ije n'ụzọ kwụ ọtọ
  rationale: Nke a na-edobe ihe atụ nke ije ije kwụ ọtọ dị na ngwaa Grik ahụ, ma n'Igbo ọ na-egosikwa omume ziri ezi nke kwekọrọ n'eziokwu.
- source_word: πρὸς τὴν ἀλήθειαν τοῦ εὐαγγελίου
  choice: dịka eziokwu nke oziọma si dị
  rationale: πρός n'ebe a na-egosi nkwekọrịta ma ọ bụ ụkpụrụ e ji atụ omume, ọ bụghị nanị ntụziaka e ji aga.
- source_word: Κηφᾷ
  choice: Kefa
  rationale: E debere aha Aramaik nke Pọl ji mee ihe, kama iji Pita dochie ya.
- source_word: ἐθνικῶς
  choice: dịka onye mba ọzọ
  rationale: Ọ na-akọwa ụzọ ndụ nke onye na-abụghị onye Juu; okwu a bụ nke a na-aghọta nke ọma n'Igbo ma na-edobe ọdịiche agbụrụ na mmekọrịta mmadụ dị n'amaokwu ahụ.
- source_word: Ἰουδαϊκῶς
  choice: dịka onye Juu
  rationale: E debere nhazi okwu yiri nke ἐθνικῶς iji mee ka ọdịiche ahụ doo anya.
- source_word: ἀναγκάζεις
  choice: amanye
  rationale: “Amanye” na-edobe echiche nke nrụgide ma ọ bụ ịmanye mmadụ ime ihe.
- source_word: Ἰουδαΐζειν
  choice: ibi ndụ dịka ndị Juu
  rationale: Nke a na-akọwa ịnakwere ụzọ ndụ ndị Juu n'asụsụ Igbo doro anya, na-enweghị ibubata esemokwu nkà mmụta okpukpe nke oge ndị e mesịrị.
theological_decisions:
- issue: Otu e si akọwa Ἰουδαΐζειν n'enweghị ibubata esemokwu ozizi nke oge e mesịrị
  choice: ibi ndụ dịka ndị Juu
  alternative: ịgbaso omenala ndị Juu; ịbụ ndị na-eme dịka ndị Juu
  rationale: Ihe gbara amaokwu a gburugburu metụtara iri nri ọnụ na ókè mmekọrịta dị n'etiti ndị Juu na ndị mba ọzọ. Nsụgharị a na-edobe okwu Pọl n'ogo mmekọrịta na ụzọ ndụ ahụ, n'emeghị ka ọ bụrụ aha usoro ozizi e mesịrị.
translation_notes:
  register: Standard Igbo; asụsụ dị ugbu a, dị ùgwù, ma dị mfe nghọta. E debere ihe atụ nke ‘ije ije kwụ ọtọ’ ma mee ka njikọ ya na eziokwu nke oziọma pụta ìhè. Aha Kefa ka e ji dịka ihe odide Grik si dị.
