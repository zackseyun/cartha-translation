revisions:
- from: Ma mgbe m hụrụ na ha adịghị eje ije n'ụzọ kwụ ọtọ dịka eziokwu nke oziọma si dị[a], agwara m Kefa n'ihu ha niile, sị, “Ọ bụrụ na gị onwe gị, onye bụ onye Juu, na-ebi ndụ dịka onye mba ọzọ, ọ bụghịkwa dịka onye Juu, olee otu i si amanye ndị mba ọzọ ibi ndụ dịka ndị Juu?[b]”
  to: Ma mgbe m hụrụ na ha anaghị eje ije n'ụzọ kwụ ọtọ kwekọrọ n'eziokwu oziọma ahụ[a], agwara m Kefa n'ihu ha niile, sị, “Ọ bụrụ na gị onwe gị, onye bụ onye Juu, na-ebi ndụ dịka onye mba ọzọ, ọ bụghịkwa dịka onye Juu, olee otú i si amanye ndị mba ọzọ ibi ndụ dịka ndị Juu?[b]”
  rationale: The revision makes the alignment sense of πρὸς τὴν ἀλήθειαν τοῦ εὐαγγελίου explicit in idiomatic Igbo, while preserving the source metaphor of walking straight. It also corrects the lexical alternatives in both notes without adding theological interpretation.
