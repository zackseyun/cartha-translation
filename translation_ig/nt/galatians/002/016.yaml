    reason: lexical_alternative
  revision_rationale: The revision strengthens the restrictive force of ἐὰν μὴ, uses natural Standard Igbo constructions for faith in a person and for Jesus’ messianic title, and clarifies the judicial metaphor with “dịka.” It preserves the source’s meaning, sequence, ambiguity in the two πίστις Χριστοῦ phrases, and formal register. Footnote c is corrected to reflect the literal collective idiom without reproducing an ungrammatical paraphrase.
