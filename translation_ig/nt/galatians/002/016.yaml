id: GAL.2.16
reference: Galatians 2:16
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἰδότες ⸀δὲ ὅτι οὐ δικαιοῦται ἄνθρωπος ἐξ ἔργων νόμου ἐὰν μὴ διὰ πίστεως ⸂Ἰησοῦ Χριστοῦ⸃, καὶ ἡμεῖς εἰς Χριστὸν Ἰησοῦν ἐπιστεύσαμεν, ἵνα δικαιωθῶμεν ἐκ πίστεως Χριστοῦ καὶ οὐκ ἐξ ἔργων νόμου, ⸂ὅτι ἐξ ἔργων νόμου οὐ δικαιωθήσεται⸃ πᾶσα σάρξ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/016.yaml
  text: Yet knowing that a person is not justified by works of the law except through faith in Jesus the Messiah[a], even we have believed in Messiah Jesus, so that we might be justified by faith in Messiah and not by works of the law[c][b], because by works of the law no flesh will be justified.
translation:
  language: ig
  text: Ma anyị maara na a naghị agụ mmadụ dịka onye ezi omume site n’ọrụ iwu, ma e wezụga site n’okwukwe na Jizọs bụ Mezaya[a]; anyị onwe anyị kwerekwa na Jizọs bụ Mezaya, ka e wee gụọ anyị dịka ndị ezi omume site n’okwukwe na Mezaya[b], ọ bụghị site n’ọrụ iwu; n’ihi na a gaghị agụ mmadụ ọ bụla dịka onye ezi omume site n’ọrụ iwu.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “site n’ikwesị ntụkwasị obi nke Jizọs bụ Mezaya.”
    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ, “site n’ikwesị ntụkwasị obi nke Mezaya.”
    reason: alternative_reading
  - marker: c
    text: N’ụzọ nkịtị, “anụ ahụ ọ bụla”; n’ebe a ọ pụtara mmadụ ọ bụla.
    reason: lexical_alternative
lexical_decisions:
- source_word: δικαιοῦται / δικαιωθῶμεν / δικαιωθήσεται
  choice: a naghị agụ mmadụ n’onye ezi omume / ka e wee gụọ anyị ná ndị ezi omume / a gaghị agụ mmadụ ọ bụla n’onye ezi omume
  rationale: 'Nke a na-edobe echiche ikpe nke okwu Pọl: Chineke na-agụ ma ọ bụ na-ekwupụta mmadụ dịka onye ezi omume, na-ezere ime ka ọ bụrụ naanị mgbanwe omume mmadụ.'
- source_word: ἄνθρωπος
  choice: mmadụ
  rationale: “Mmadụ” bụ Igbo nkịtị na nke sitere n’okike maka otu onye a na-ekwu maka ya n’ozuzu, ọ naghịkwa efunahụ ịdị otu nke okwu Grik.
- source_word: ἐξ ἔργων νόμου
  choice: site n’ọrụ iwu
  rationale: Ọ na-edobe okwu Pọl kpọmkwem, ma ghara ịgbasa ya ka ọ bụrụ “ọrụ ọma” n’ozuzu.
- source_word: διὰ πίστεως Ἰησοῦ Χριστοῦ
  choice: site n’okwukwe n’ime Jizọs bụ Mezaya
  rationale: Isi ederede na-ewere genitive ahụ dịka okwukwe mmadụ nwere n’ime Jizọs; e debere nghọta nke ikwesị ntụkwasị obi Jizọs na ndetu ala peeji.
- source_word: εἰς Χριστὸν Ἰησοῦν ἐπιστεύσαμεν
  choice: anyị onwe anyị kwekwara na Mezaya Jizọs
  rationale: “Kwere na” bụ ụzọ Igbo dị mma isi kwuo πιστεύω εἰς; “onwe anyị” na-egosipụta καὶ ἡμεῖς.
- source_word: ἐκ πίστεως Χριστοῦ
  choice: site n’okwukwe n’ime Mezaya
  rationale: A na-agbaso otu mkpebi ahụ e mere n’ahịrịokwu mbụ, ebe ndetu na-echekwa nghọta ọzọ a na-arụrịta ụka banyere ya.
- source_word: Χριστός
  choice: Mezaya
  rationale: A sụgharịrị aha ọkwa ahụ kama idegharị ụda ya, ebe ọ ka na-arụ ọrụ dịka aha ọkwa.
- source_word: πᾶσα σάρξ
  choice: mmadụ ọ bụla
  rationale: N’Igbo, nke a na-ebuga ihe akpaalaokwu Hibru/Grik ahụ pụtara—mmadụ ọbụla—n’ụzọ doro anya ma dị ndụ; a na-echekwa nkịtị ya na ndetu.
- source_word: εἰδότες δὲ
  choice: Ma ebe anyị maara
  rationale: Nke a na-edobe njikọ na ihe bu ụzọ nakwa ike mmegide dị nro nke δέ.
- source_word: ἐὰν μὴ
  choice: kama ọ bụ site
  rationale: N’ebe a, ọ na-egosipụta ụzọ nke ọzọ e kewapụrụ iche n’Igbo nkịtị, na-enweghị ime ka ọrụ iwu bụrụ otu n’ime ụzọ abụọ ziri ezi.
theological_decisions:
- issue: Ihe πίστεως Ἰησοῦ Χριστοῦ / πίστεως Χριστοῦ pụtara
  choice: okwukwe n’ime Jizọs bụ Mezaya / okwukwe n’ime Mezaya
  alternative: ikwesị ntụkwasị obi nke Jizọs bụ Mezaya / nke Mezaya
  rationale: Genitive Grik ahụ nwere ike ịbụ ihe okwukwe lekwasịrị anya ma ọ bụ ikwesị ntụkwasị obi nke Mezaya. Isi ederede họọrọ nke mbụ, ma ndetu abụọ ahụ echekwara esemokwu ahụ n’enweghị idozi ya n’ụzọ nzuzo.
- issue: Okwu ikpe δικαιόω
  choice: ịgụ mmadụ n’onye ezi omume
  alternative: ikwu na mmadụ bụ onye ezi omume
  rationale: Nhọrọ a na-echekwa ike ikpe na nkwupụta nke okwu ahụ ma ghara ime ka ọ bụrụ naanị “ime mmadụ ka ọ na-eme ezi omume.”
- issue: Njikọ ἐὰν μὴ
  choice: kama ọ bụ site
  alternative: ma e wezụga site
  rationale: N’usoro okwu a, Igbo a họọrọ na-eme ka ọdịiche dị n’etiti ọrụ iwu na okwukwe doo anya, na-enweghị ikwu na okwukwe bụ otu ụdị “ọrụ iwu.”
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E debere okwu Pọl “ọrụ iwu” na ịdị arọ nke okwu ikpe “ịgụ n’onye ezi omume”; e jiri “mmadụ ọ bụla” mee ka akpaalaokwu πᾶσα σάρξ doo onye na-agụ Igbo anya, ma debe nkịtị ya na ndetu.
