  - severity: low
    issue: “ndị ahụ a na-akwanyere ùgwù” adịghị echekwa otu okwu δοκοῦντες e kwuburu.
    rationale: Okwu a nwere ike igosi nsọpụrụ Pọl kwenyere na ya, ebe δοκοῦντες na-ekwu maka aha ma ọ bụ ọnọdụ ndị mmadụ chere ha nwere. Ikwughachi “a na-ewere na ha bụ ndị dị mkpa” na-echekwa ntụgharị okwu na ụda ya.
  - severity: medium
    issue: Nkọwa ala ala c kpọmkwem kwuru “iwu ma ọ bụ ibu ọrụ.”
    rationale: προσανέθεντο nwere ike ịbụ itinye, ịgbakwunye, ma ọ bụ ịtụkwasị ihe ọzọ n’aka Pọl; amaokwu a ekwughị iwu ma ọ bụ ibu ọrụ kpọmkwem. Nkọwa ahụ ekwesịghị ịkpachapụ uche ya.
