id: GAL.2.6
reference: Galatians 2:6
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀπὸ δὲ τῶν δοκούντων εἶναί τι— ὁποῖοί ποτε ἦσαν οὐδέν μοι διαφέρει· πρόσωπον ⸀θεὸς ἀνθρώπου οὐ λαμβάνει— ἐμοὶ γὰρ οἱ δοκοῦντες οὐδὲν προσανέθεντο,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/006.yaml
  text: But from those who were reputed to be something—whatever they once were makes no difference to me[a]; God shows no partiality—to me, indeed[c][b], those of reputation added nothing.
translation:
  language: ig
  text: Ma site n’aka ndị a na-ewere na ha bụ ndị dị mkpa[a]—ụdị ndị ha bụbu adịghị emetụta m; Chineke adịghị ele mmadụ anya n’ihu[b]—n’ihi na ndị a na-ewere na ha bụ ndị dị mkpa atụkwasịghị m ihe ọ bụla[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị yiri ka ha bụ ndị dị mkpa.”
    reason: lexical_alternative
  - marker: b
    text: N’okwu nkịtị, “Chineke adịghị anabata ihu mmadụ”; ọ bụ akpaalaokwu pụtara na Chineke adịghị ele mmadụ anya n’ihu.
    reason: cultural_note
  - marker: c
    text: Ma ọ bụ, “ọ dịghị ihe ọzọ ha tịkwasịrị m.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τῶν δοκούντων εἶναί τι / οἱ δοκοῦντες
  choice: ndị a na-ewere dị ka ndị dị mkpa / ndị ahụ a na-akwanyere ùgwù
  rationale: Nke a na-egosi aha na ọnọdụ ndị mmadụ nyere ha, ma na-echekwa ntakịrị ụda Pọl ji kewapụ onwe ya n’ịdabere n’ọnọdụ ha, n’emeghị ka okwu ahụ bụrụ mkparị.
- source_word: ὁποῖοί ποτε ἦσαν
  choice: ụdị ndị ha bụbu
  rationale: Nke a na-egosi na ụdị ọnọdụ ma ọ bụ aha ha nwere n’oge gara aga abụghị ihe dị mkpa n’ihe Pọl na-ekwu.
- source_word: οὐδέν μοι διαφέρει
  choice: adịghị m mkpa
  rationale: Ọ bụ ụzọ Igbo dị mfe ma bụrụkwa nke ebumpụta ụwa isi kwuo na ọnọdụ ha enweghị mmetụta n’otú Pọl si ele okwu ahụ.
- source_word: πρόσωπον θεὸς ἀνθρώπου οὐ λαμβάνει
  choice: Chineke adịghị ele mmadụ anya n’ihu
  rationale: 'Akpaalaokwu Igbo a na-enye ihe akpaalaokwu Grik ahụ pụtara: Chineke adịghị emere mmadụ amara pụrụ iche n’ihi onye ọ bụ ma ọ bụ ọnọdụ ya.'
- source_word: ἐμοὶ γὰρ
  choice: n’ezie
  rationale: Nke a na-ejikọta nkwupụta ahụ na ahụmahụ Pọl n’ụzọ doro anya ma dị ugwu; nnọchiaha onye mbụ ka dị n’ime ngwaa “atụkwasịghị m.”
- source_word: οὐδὲν προσανέθεντο
  choice: atụkwasịghị m ihe ọ bụla ọzọ
  rationale: Nke a na-echekwa echiche nke ịgbakwụnye ma ọ bụ itinye ihe ọzọ n’ozi ma ọ bụ ọrụ Pọl, n’ebughị ụzọ kpebie kpọmkwem nke abụọ ahụ.
theological_decisions:
- issue: Ma okwu Pọl ọ̀ na-akparị ndị ndu Jerusalem, ka ọ̀ na-ekwupụta nnwere onwe ya pụọ n’ịdabere n’ọnọdụ ha
  choice: E chekwara ụda nke na-egosi na aha ha anaghị achị eziokwu oziọma Pọl, ma e meghị ka ọ bụrụ mwakpo megide ịbụ ndị ndu ha.
  alternative: A pụrụ iji okwu siri ike karị nke ga-eme ka ọ dị ka Pọl na-elelị ha, ma ọ bụ okwu dị nro karị nke ga-ewepụ nkọ okwu ya.
  rationale: Isi okwu Pọl bụ na ọnọdụ mmadụ anaghị ekpebi eziokwu oziọma ya; ederede ahụ anaghị amanye anyị ikwu na ọ jụrụ kpamkpam ịdị ndu ha.
translation_notes:
  register: Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. E ji akpaalaokwu Igbo “ile mmadụ anya n’ihu” mee ka akpaalaokwu Grik doo anya, ma chekwaa nkwụsị okwu na esemokwu dị n’ahịrịokwu Pọl site n’akara ogologo.
