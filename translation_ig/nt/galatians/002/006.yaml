  verdict: revise
  source_fidelity: 'A na-echekwa isi echiche nke amaokwu a nke ọma: Pọl anaghị ekwe ka aha ma ọ bụ ọnọdụ ndị a ma ama kpebie okwu ya, Chineke anaghị ele mmadụ anya n’ihu, ndị ahụ etinyeghịkwa ihe ọ bụla n’aka ya. Ma “n’ezie” anaghị akọwa njikọ γάρ nke ọma, ma nkọwa ala ala c na-egbochi ihe προσανατίθημι nwere ike ịpụta karịa ka Grik si kwuo.'
  naturalness: Igbo ahụ bụ nke a ghọtara ma bụrụkwa Standard Igbo. Otú ọ dị, “ụdị ndị ha bụbu adịghị m mkpa” adịghị ada nnọọ nwayọọ dịka “ụdị ndị ha bụbu adịghị emetụta m,” na ikwughachi “ndị a na-ewere na ha bụ ndị dị mkpa” na-echekwa ụda Grik karịa iji “ndị a na-akwanyere ùgwù,” nke na-agbanwe ntakịrị uche ya.
  terminology: “Chineke adịghị ele mmadụ anya n’ihu” bụ akpaalaokwu Igbo kwesịrị ekwesị maka πρόσωπον ... οὐ λαμβάνει. “Ndị a na-ewere na ha bụ ndị dị mkpa” na-echekwa δοκοῦντες—aha ndị mmadụ nyere ha—nakwa ụda Pọl nke na-edobe anya. A gbanwere nkọwa ala ala c ka ọ ghara ikwu kpọmkwem banyere iwu ma ọ bụ ibu ọrụ, ebe Grik anaghị akọwa ihe e tinyeghị.
  issues:
