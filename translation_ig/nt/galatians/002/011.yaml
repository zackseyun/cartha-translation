id: GAL.2.11
reference: Galatians 2:11
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ὅτε δὲ ἦλθεν ⸀Κηφᾶς εἰς Ἀντιόχειαν, κατὰ πρόσωπον αὐτῷ ἀντέστην, ὅτι κατεγνωσμένος ἦν·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/011.yaml
  text: But when Cephas came to Antioch[a], I opposed him to his face[b], because he stood condemned.
translation:
  language: ig
  text: Ma mgbe Kefa bịara Antiọk[a], emegidere m ya ihu na ihu, n'ihi na a mara ya ikpe.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kefa bụ aha Aramaik a na-akpọ Pita.
    reason: cross_reference
  - marker: b
    text: Ma ọ bụ, “n'ihi na o doro anya na o mejọrọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅτε δὲ
  choice: Ma mgbe
  rationale: Na-egosipụta oge ihe mere na obere ntụgharị echiche nke δέ n'Igbo dị mfe.
- source_word: Κηφᾶς
  choice: Kefa
  rationale: E debere ụdị aha ahụ dị n'okwu Grik kama iji Pita dochie ya; nkọwa ala peeji na-eme ka onye na-agụ mara onye ọ bụ.
- source_word: ἦλθεν
  choice: bịara
  rationale: Ọ bụ okwu Igbo nkịtị dabara adaba maka ọbịbịa ya n'Antiọk.
- source_word: εἰς Ἀντιόχειαν
  choice: Antiọk
  rationale: N'Igbo, ngwaa 'bịara' na aha ebe ahụ na-egosi ịbata n'obodo ahụ n'ụzọ ebumpụta ụwa.
- source_word: κατὰ πρόσωπον αὐτῷ
  choice: n'ihu ya
  rationale: Na-echekwa ihe oyiyi nke ịgwa ya okwu ihu na ihu, n'ezoghị ọnụ.
- source_word: ἀντέστην
  choice: emegidere m ya
  rationale: Na-egosi na Pọl guzogidere omume Kefa n'ihu ọha, n'Igbo doro anya.
- source_word: ὅτι
  choice: n'ihi na
  rationale: Na-ewebata ihe kpatara Pọl ji megide ya.
- source_word: κατεγνωσμένος ἦν
  choice: a mara ya ikpe
  rationale: Na-echekwa ụdị passive na echiche nke ọnọdụ ikpe dị na periphrastic construction ahụ, na-enweghị ịkọwa onye mara ya ikpe.
theological_decisions:
- issue: Onye Κηφᾶς bụ na otu e si dee aha ya
  choice: Kefa ka dị n'ahịrịokwu bụ isi
  alternative: Pita
  rationale: Ebe ihe odide Grik ji Κηφᾶς, ide ya dịka Kefa na-echekwa ụdị aha isi mmalite ahụ; nkọwa ala peeji na-akọwa njikọ ya na Pita.
- issue: Ihe κατεγνωσμένος ἦν pụtara
  choice: a mara ya ikpe
  alternative: o doro anya na ihe o mere ezighị ezi
  rationale: Nhọrọ bụ isi na-echekwa passive na ike okwu ikpe ahụ. Nhọrọ nke abụọ na-akọwa ya dịka ịbụ onye mejọrọ n'ụzọ doro anya, ya mere e debere ya na nkọwa ala peeji ka ambiguity ahụ ghara ịla n'iyi.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke oge a, dị ùgwù ma dị mfe nghọta. E jiri 'n'ihu ya' chekwaa ịdị ndụ nke akpaalaokwu Grik, ma e debere aha Kefa dịka aha dị n'isi mmalite.
