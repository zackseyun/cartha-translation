review_pass:
  verdict: revise
  source_fidelity: The draft correctly retains Κηφᾶς as “Kefa,” translates the temporal-contrastive opening, and preserves the passive sense of κατεγνωσμένος ἦν in “a mara ya ikpe.” However, “n'ihu ya” means chiefly “before him/in his presence” and does not adequately convey the direct-confrontation force of κατὰ πρόσωπον αὐτῷ.
  naturalness: The revision uses the idiomatic Standard Igbo expression “ihu na ihu” for a face-to-face confrontation. The remaining wording is clear, modern, and suitably dignified.
  terminology: “Kefa” appropriately follows the Greek name form, with a concise footnote identifying it as Peter’s Aramaic name. “A mara ya ikpe” retains the source’s passive wording without specifying who condemned him or imposing an interpretation.
  issues:
  - severity: medium
    issue: The phrase “n'ihu ya” under-translates κατὰ πρόσωπον αὐτῷ.
    rationale: It can mean “before him” or “in his presence,” whereas the Greek idiom explicitly indicates confronting him face to face. “Ihu na ihu” preserves this directness.
  revised_text: Ma mgbe Kefa bịara Antiọk[a], emegidere m ya ihu na ihu, n'ihi na a mara ya ikpe.[b]
  revised_footnotes:
