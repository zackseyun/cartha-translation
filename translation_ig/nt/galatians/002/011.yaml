- from: Ma mgbe Kefa bịara Antiọk[a], emegidere m ya n'ihu ya, n'ihi na a mara ya ikpe.[b]
  to: Ma mgbe Kefa bịara Antiọk[a], emegidere m ya ihu na ihu, n'ihi na a mara ya ikpe.[b]
