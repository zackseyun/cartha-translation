reference: Galatians 2:2
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀνέβην δὲ κατὰ ἀποκάλυψιν· καὶ ἀνεθέμην αὐτοῖς τὸ εὐαγγέλιον ὃ κηρύσσω ἐν τοῖς ἔθνεσιν, κατ’ ἰδίαν δὲ τοῖς δοκοῦσιν, μή πως εἰς κενὸν τρέχω ἢ ἔδραμον.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/002.yaml
  text: But I went up in response to a revelation[a], and I laid before them the gospel that I proclaim among the Gentiles—but privately before those of repute—lest somehow I should be running, or had run[c][b], in vain.
translation:
  language: ig
  text: Ma agbagoro m n’ihi mkpughe[a], ma kọwaara m ha oziọma ahụ m na-ekwusa n’etiti ndị mba ọzọ—ma na nzuzo nye ndị a na-ewere na ha dị mkpa[b]—ka m ghara ịdị na-agba ọsọ, ma ọ bụ na agbaala m ọsọ, n’efu.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, ‘n’ihi na mkpughe kpaliri m.’
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, ‘ndị e chere na ha dị mkpa’ ma ọ bụ ‘ndị a na-ewere dị ka ndị ndu.’
    reason: lexical_alternative
  - marker: c
    text: A pụkwara ịsụgharị ya, ‘ka o wee ghara ịbụ na m na-agba ọsọ ma ọ bụ na agbaala m ọsọ n’efu.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέβην
  choice: arịgoro m
  rationale: Nke a na-edobe echiche nkịtị nke ‘ịrịgo’ n’etinyeghị ebe a na-aga, ebe ọ bụ na amaokwu a akpọghị Jeruselem aha.
- source_word: κατὰ ἀποκάλυψιν
  choice: n’ihi mkpughe
  rationale: Nkebiokwu a nwere ike igosi ihe kpatara njem ahụ ma ọ bụ ihe njem ahụ dabere na ya. Igbo a bụ nke eke ma na-ahapụ nkọwa ọzọ na nkọwa ala peeji.
- source_word: ἀνεθέμην αὐτοῖς
  choice: kọwaara m ha
  rationale: N’ebe a, okwu ahụ pụtara iweta ihe n’ihu ndị ọzọ ka ha tụlee ya. Nhọrọ a anaghị ekwu na Pọl nyefere oziọma ya ka ha nye ya ikike ma ọ bụ dozie ya.
- source_word: τὸ εὐαγγέλιον
  choice: oziọma ahụ
  rationale: ‘Oziọma’ bụ okwu Igbo a maara nke ọma maka εὐαγγέλιον ma dabara n’ojiji Pọl ebe a.
- source_word: ἐν τοῖς ἔθνεσιν
  choice: n’etiti ndị mba ọzọ
  rationale: N’ọnọdụ a, ọ na-ezo aka ná ndị na-abụghị ndị Juu, ọ bụghị nanị mba dị iche iche dịka mpaghara ọchịchị.
- source_word: κατ’ ἰδίαν
  choice: na nzuzo
  rationale: Ọ na-egosi na nkọwa ahụ nye ndị a ma ama mere n’ọnọdụ nzuzo, dị iche na ikwu ya n’ihu mmadụ niile.
- source_word: τοῖς δοκοῦσιν
  choice: ndị a na-ewere dị ka ndị a ma ama
  rationale: 'Nke a na-edobe obere nghọtahie dị na δοκοῦσιν: ha bụ ndị mmadụ na-ele anya dị ka ndị dị mkpa, n’ebughị ụzọ kpebie ma Pọl n’onwe ya na-akwado ọkwa ahụ ma ọ bụ na-atụ ya ajụjụ.'
- source_word: μή πως εἰς κενὸν τρέχω ἢ ἔδραμον
  choice: ka ọ ghara ịbụ na m na-agba ọsọ ugbu a, ma ọ bụ na agbaala m ọsọ n’oge gara aga, n’efu
  rationale: A na-edobe ihe atụ nke ịgba ọsọ, ọdịiche dị n’etiti ọrụ na-aga n’ihu na ọrụ gara aga, nakwa echiche nke ọrụ na-enweghị mkpụrụ.
theological_decisions:
- issue: Ma Pọl ọ na-enyefe oziọma ya n’okpuru ndịozi ka ha kwado ma ọ bụ dozie ya
  choice: A sụgharịrị ἀνεθέμην dịka ‘kọwaara m ha,’ nke na-egosi iweta ozi ahụ n’ihu ha ka a tụlee ya ma na-anọpụ iche n’ihe banyere ikike ikpeazụ.
  alternative: ‘Nyefere m ha oziọma ahụ ka ha nyochaa ya’ ma ọ bụ ‘naanị gwara m ha oziọma ahụ.’
  rationale: Okwu Grik ahụ anaghị amanye echiche na Pọl nọ n’okpuru ha maka nkwado, ma ọ naghịkwa ewepụ kpamkpam echiche nke ntụle. Ya mere, a hapụrụ esemokwu ahụ ka ọ dị.
- issue: Ihe mere Pọl ji tụọ egwu na ọ na-agba ọsọ n’efu
  choice: E debere okwu nchegbu ahụ n’ụzọ na-adịghị akọwa kpọmkwem ma ọ bụ izi ozi ya, ịdị n’otu nke ọrụ ahụ, ma ọ bụ nnabata ndị mba ọzọ ka ọ na-ekwu maka ya.
  alternative: Ịkọwa ya kpọmkwem dịka egwu na oziọma ya ezighị ezi ma ọ bụ na ndị isi agaghị akwado ọrụ ya.
  rationale: Amaokwu ahụ n’onwe ya anaghị edozi ụdị ọdịda Pọl bu n’obi; nsụgharị ekwesịghị itinye azịza otu okpukpe ma ọ bụ otu onye nkọwa.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. A kewara ahịrịokwu Grik ogologo ahụ ụzọ abụọ ka ọ daa nke ọma n’Igbo, ma debe njikọ echiche, okwu ntinye banyere nzukọ nzuzo, na ihe atụ nke ịgba ọsọ. E tinyere akara nkọwa ala peeji [a], [b], na [c] niile n’ederede bụ isi.
