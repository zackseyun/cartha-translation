  verdict: revise
  source_fidelity: 'A na-edobe usoro na isi ihe nke amaokwu ahụ nke ọma, ma e nwere ndozi dị mkpa: ‘arịgoro m’ adịghị eke nke ọma dịka ‘agbagoro m’; ‘ndị a ma ama’ na-atụgharị δοκοῦσιν n’ụzọ dị ntakịrị karịa ihe Grik ahụ kwuru; nkọwa ‘ugbu a’ na ‘n’oge gara aga’ na-agbakwunye nkọwa oge na-adịghị mkpa.'
  naturalness: Ederede ahụ ghọtara nke ọma, ma ‘agbagoro m’ na usoro ahịrịokwu a na-emezigharịrị ga-adịkwu eke n’Igbo Izugbe. A na-edobe nkebi nzuzo ahụ n’etiti akara nkewa iji mee ka ọ doo anya na ọ na-akọwa igosi oziọma ahụ.
  terminology: ‘Oziọma’ na ‘ndị mba ọzọ’ dabara nke ọma n’ọnọdụ Pọl. ‘Ndị a na-ewere na ha dị mkpa’ na-edobe nghọtahie dị na τοῖς δοκοῦσιν karịa ‘ndị a ma ama,’ nke nwere ike ịpụta ndị a ma ama n’ọha mmadụ.
  issues:
  - severity: medium
    issue: ‘arịgoro m’
    rationale: Nke a abụghị nhọrọ eke nke ọma maka ἀνέβην n’Igbo Izugbe. ‘Agbagoro m’ na-enye echiche ‘gara elu’ n’etinyeghị Jerusalem, nke amaokwu a ekwughị.
  - severity: medium
    issue: ‘ndị a na-ewere dị ka ndị a ma ama’
    rationale: ‘A ma ama’ na-elekwasị anya n’ịbụ ndị a ma ama/famous, ebe τοῖς δοκοῦσιν na-ekwu maka ndị a na-ewere dị ka ndị dị mkpa ma ọ bụ ndị nwere ọnọdụ. Nhọrọ ọhụrụ ahụ na-edobekwa obere enweghị nkwenye dị na okwu Grik ahụ.
  - severity: low
    issue: ‘ugbu a’ na ‘n’oge gara aga’
    rationale: Ha na-akọwa ọdịiche present/aorist n’ụzọ karịrị ihe edere. Igbo nwere ike idobe ọdịiche ahụ site na ‘na-agba ọsọ’ na ‘agbaala m ọsọ’ na-enweghị mgbakwunye a.
  - severity: low
    issue: Nkọwa ala [a]
    rationale: ‘dị ka mkpughe si dị’ adịghị eke nke ọma. A gbanwere ya ka ọ bụrụ ụzọ ọzọ doro anya nke na-egosi na mkpughe ahụ bụ ihe kpaliri njem ahụ.
