id: GAL.2.17
reference: Galatians 2:17
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἰ δὲ ζητοῦντες δικαιωθῆναι ἐν Χριστῷ εὑρέθημεν καὶ αὐτοὶ ἁμαρτωλοί, ἆρα Χριστὸς ἁμαρτίας διάκονος; μὴ γένοιτο·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/017.yaml
  text: But if[a], while seeking to be justified in Messiah, we ourselves also were found to be sinners, is Messiah then a servant of sin? May it never be!
translation:
  language: ig
  text: Ma ọ bụrụ na mgbe anyị na-achọ ka a gụọ anyị ná ndị ezi omume n'ime Mesaịa[a], a hụkwara na anyị onwe anyị bụ ndị mmehie, Mesaịa ọ̀ bụzi onye na-ejere mmehie ozi? Ya adịla ma ọlị!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A na-asụgharịkarị “Mesaịa” dịka “Kraịst” n’ebe a nakwa n’ebe ọzọ ọ pụtara n’amaokwu a.
    reason: lexical_alternative
lexical_decisions:
- source_word: ζητοῦντες
  choice: mgbe anyị na-achọ
  rationale: E ji nkebiokwu na-egosi ihe na-aga n’otu oge mee ka participle ahụ doo anya ma na-asụkwa Igbo nke ọma.
- source_word: δικαιωθῆναι
  choice: ka a gụọ anyị ná ndị ezi omume
  rationale: Nke a na-echekwa ụdị passive na echiche ikpe nke okwu ahụ, n’ebughị ụzọ kpebie na ọ pụtara nanị ime mmadụ ka ọ bụrụ onye ezi omume n’omume.
- source_word: ἐν Χριστῷ
  choice: n'ime Mesaịa
  rationale: E debere ἐν n’ụzọ na-adịghị akpa oke ka ntụgharị ghara ikpebi ma ọ bụ njikọ, ọnọdụ, ma ọ bụ ụzọ ka Pọl bu n’obi; “Mesaịa” na-egosipụta Χριστός dịka aha ọkwa.
- source_word: εὑρέθημεν
  choice: a hụkwara na
  rationale: Nke a na-echekwa ụdị passive na ike okwu nke nchọpụta ahụ, ma na-ada ka Igbo nkịtị.
- source_word: καὶ αὐτοὶ ἁμαρτωλοί
  choice: anyị onwe anyị bụ ndị mmehie
  rationale: “Anyị onwe anyị” na-egosipụta nkwusi ike dị na αὐτοί, ebe “ndị mmehie” na-echekwa predicate ahụ n’enweghị nkọwa agbakwunyere.
- source_word: ἁμαρτίας διάκονος
  choice: onye na-ejere mmehie ozi
  rationale: Nke a na-egosipụta ọrụ ma ọ bụ ijere mmehie ozi n’enweghị echiche nke ọkwa ụka nke “onye ozi” nwere ike iweta.
- source_word: μὴ γένοιτο
  choice: Ya adịla ma ọlị!
  rationale: Nke a bụ ụzọ Igbo siri ike ma dị ugwu e si jụ echiche ahụ kpamkpam, ma na-echekwa ụdị ọchịchọ dị n’okwu Grik.
theological_decisions:
- issue: Ma ajụjụ ahụ ò kwesịrị iyi ka ọ na-akụzi na Mesaịa na-akpata mmehie.
  choice: Mesaịa ọ̀ bụzi onye na-ejere mmehie ozi?
  alternative: Mesaịa ọ̀ bụ onye na-akpata mmehie?
  rationale: Grik na-ajụ ajụjụ arụmụka banyere ihe nkwubi okwu ahụ ga-apụta; ọ naghị ekwu na Mesaịa na-emepụta mmehie. Nhọrọ a na-echekwa esemokwu ahụ Pọl jụrụ ozugbo.
- issue: Uru kpọmkwem nke ἐν Χριστῷ.
  choice: n'ime Mesaịa
  alternative: site na Mesaịa; site n'ịdị n'otu na Mesaịa
  rationale: Nhọrọ bụ isi na-echekwa ohere nghọta dị na preposition ἐν kama ịmanye naanị echiche nke ụzọ ma ọ bụ njikọ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị mfe nghọta ma dị ugwu. A hapụrụ usoro ajụjụ arụmụka ahụ na nkwusi ike “anyị onwe anyị,” ma zere okwu ụka pụrụ iche nke nwere ike idozi ihe Grik hapụrụ ghe oghe.
