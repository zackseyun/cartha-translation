source:
  edition: SBLGNT
  text: ὁ γὰρ ἐνεργήσας Πέτρῳ εἰς ἀποστολὴν τῆς περιτομῆς ἐνήργησεν καὶ ἐμοὶ εἰς τὰ ἔθνη,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/008.yaml
  text: For the one who worked through Peter for apostleship to the circumcised also worked through me for the Gentiles[b][a],
translation:
  language: ig
  text: N’ihi na onye rụrụ ọrụ site n’aka Pita maka ọrụ onyeozi nye ndị e biri úgwù[a], rụkwara ọrụ site n’aka m nye ndị mba ọzọ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’ụzọ nkịtị, “maka ọrụ onyeozi nke ibi úgwù.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “nye mba dị iche iche.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνεργήσας / ἐνήργησεν
  choice: rụrụ ọrụ / rụkwara ọrụ
  rationale: E ji otu ngwaa Igbo mee ụdị abụọ nke otu ngwaa Grik iji chekwaa nkwughachi na nhazi yiri ibe ya dị n’etiti ọrụ Pita na nke Pọl, n’etinyeghị echiche ọzọ dịka ‘nyere ike.’
- source_word: Πέτρῳ / ἐμοὶ
  choice: site n’aka Pita / site n’aka m
  rationale: N’ebe a, dative na-egosi onye e ji rụọ ọrụ; ‘site n’aka’ bụ ụzọ Igbo doro anya ma bụrụkwa eke isi kwuo na onye ahụ rụrụ ọrụ site n’aka Pita na Pọl.
- source_word: εἰς ἀποστολὴν
  choice: maka ọrụ onyeozi
  rationale: Nke a na-egosipụta ọrụ ma ọ bụ ozi e nyere onyeozi, ma na-anọgide nso n’echiche ἀποστολή n’asụsụ a na-aghọta nke ọma.
- source_word: τῆς περιτομῆς
  choice: nye ndị e biri úgwù
  rationale: ‘Ibi úgwù’ nọchiri anya ndị Juu e biri úgwù n’ebe a. Nsụgharị a na-eme ka ndị a na-ekwu maka ha doo anya ma chekwaa ọdịiche ha na ndị mba ọzọ.
- source_word: τὰ ἔθνη
  choice: ndị mba ọzọ
  rationale: N’ọnọdụ akwụkwọ Pọl a, okwu ahụ na-ezo aka n’ebe ndị na-abụghị ndị Juu nọ; ‘ndị mba ọzọ’ na-egosipụta ọdịiche ahụ nke ọma. A hapụrụ ‘mba dị iche iche’ n’ihe odide ala peeji dịka ụzọ ọzọ ziri ezi.
theological_decisions:
- issue: Ma a ga-akpọ onye na-arụ ọrụ ahụ ‘Chineke’ kpọmkwem
  choice: onye ahụ
  alternative: Chineke, onye rụrụ ọrụ site n’aka Pita
  rationale: Grik nwere participle nwere article, nke pụtara ‘onye ahụ rụrụ ọrụ,’ ma ọ kpọghị ‘Chineke’ aha kpọmkwem n’amaokwu a. Ya mere, ‘onye ahụ’ na-echekwa usoro na ntakịrị oghere nkọwa dị na isi mmalite, ọ bụ ezie na gburugburu okwu na-egosi na onye ahụ bụ Chineke.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Nhazi ahịrịokwu ahụ chekwara myirịta dị n’etiti Pita na Pọl, tinyere nkwughachi ‘rụrụ ọrụ … rụkwara ọrụ.’
