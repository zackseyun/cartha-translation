revisions:
- from: Ma a manyeghị ọbụna Taịtọs, onye mụ na ya nọ, ibi úgwù, ọ bụ ezie na ọ bụ onye Gris.[a]
  to: Ma ọbụna Taịtọs, onye mụ na ya nọ, a manyeghị ka e bie ya úgwù, n’agbanyeghị na ọ bụ onye Gris.[a]
  rationale: 'The revision retains every source-level element while making the passive infinitive explicit and natural in Standard Igbo: Titus was not compelled for others to circumcise him. The footnote remains substantively unchanged but is moved to its proper lexical anchor.'
  reviewer_model: gpt-5.6-terra
