base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/003.yaml
  text: But not even Titus[a], who was with me, though he was a Greek[b], was compelled to be circumcised.
translation:
  language: ig
  text: Ma ọbụna Taịtọs, onye mụ na ya nọ, a manyeghị ka e bie ya úgwù, n’agbanyeghị na ọ bụ onye Gris.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’ebe a, ịbụ onye Gris na-egosi na Taịtọs bụ onye a na-ebighị úgwù; ma ederede ahụ kwuru kpọmkwem “onye Gris,” ọ bụghị naanị “onye mba ọzọ.”
    reason: cultural_note
lexical_decisions:
- source_word: ἀλλ’
  choice: Ma
  rationale: Na-egosi ọdịiche dị n'etiti okwu a na ihe e kwuru tupu ya n'ụzọ dị mkpirikpi ma bụrụkwa Igbo nkịtị.
- source_word: οὐδὲ
  choice: ọbụna ... -ghị
  rationale: Ngwakọta ‘ọbụna’ na n否ga Igbo na-echekwa nkwusi ike nke okwu Grik ahụ n’ebe Taịtọs nọ.
- source_word: Τίτος
  choice: Taịtọs
  rationale: E dere aha onye ahụ n’ụdị mkpụrụokwu dabara n’ụda Igbo.
- source_word: ὁ σὺν ἐμοί
  choice: onye mụ na ya nọ
  rationale: Nke a na-akọwa Taịtọs n'ụzọ doro anya, n’etinyeghị echiche ọzọ na-adịghị n’ederede.
- source_word: Ἕλλην ὤν
  choice: ọ bụ ezie na ọ bụ onye Gris
  rationale: 'Nke a na-egosipụta ọnọdụ nkwenye megidere ihe a tụrụ anya ya: n’agbanyeghị na ọ bụ onye Gris, a manyeghị ya ibi úgwù.'
- source_word: Ἕλλην
  choice: onye Gris
  rationale: Na-echekwa nkọwa kpọmkwem nke okwu Grik ahụ kama iji okwu sara mbara dịka ‘onye mba ọzọ.’
- source_word: ἠναγκάσθη
  choice: a manyeghị
  rationale: Ụdị a na-egosi na ndị ọzọ etinyeghị ya n’ike ma ọ bụ n’oké nrụgide ime ihe ahụ.
- source_word: περιτμηθῆναι
  choice: ibi úgwù
  rationale: Nke a bụ ụzọ Igbo doro anya ma bụrụkwa nke a na-aghọta nke ọma maka omume ibi úgwù.
theological_decisions:
- issue: Ịsụgharị Ἕλλην dịka aha agbụrụ na omenala ma ọ bụ dịka okwu okpukpe sara mbara
  choice: onye Gris
  alternative: onye mba ọzọ
  rationale: Ederede ahụ kpọrọ Taịtọs onye Gris kpọmkwem. Ọ bụ ezie na nke a na-egosi n’ọnọdụ ahụ na ọ bụ onye mba ọzọ a na-ebighị úgwù, nsụgharị ahụ kwesịrị ichekwa okwu kpọmkwem nke isi mmalite.
translation_notes:
  register: Igbo Izugbe nke oge a, dị mfe nghọta ma nwee ugwu. Ahịrịokwu ahụ na-echekwa nkwusi ike nke οὐδὲ, ọnọdụ nkwenye nke Ἕλλην ὤν, na okwu agbụrụ kpọmkwem ‘onye Gris.’
