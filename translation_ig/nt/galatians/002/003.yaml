    reason: cultural_note
  revision_rationale: 'The revision retains every source-level element while making the passive infinitive explicit and natural in Standard Igbo: Titus was not compelled for others to circumcise him. The footnote remains substantively unchanged but is moved to its proper lexical anchor.'
