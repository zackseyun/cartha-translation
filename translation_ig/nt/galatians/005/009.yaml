  text: μικρὰ ζύμη ὅλον τὸ φύραμα ζυμοῖ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/009.yaml
  text: A little leaven leavens the whole batch of dough[a].
translation:
  language: ig
  text: Ntakịrị ihe iko achịcha na-eme ka ntụ ọka ahụ dum koo[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Ntakịrị yist na-eme ka ntụ ọka ahụ dum koo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μικρὰ
  choice: obere
  rationale: N'ebe a, ọ na-egosi ntakịrị ihe n'ọnụọgụ, ọ bụghị naanị ihe pere mpe n'ibu.
- source_word: ζύμη
  choice: ihe na-eko achịcha
  rationale: Nke a bụ okwu Igbo doro anya maka ihe na-eme ka ntụ ọka koo; ọ na-echekwa oyiyi ilu ahụ n'etinyeghị nkọwa ihe ilu ahụ pụtara.
- source_word: ὅλον
  choice: dum
  rationale: Ọ na-egosi na mmetụta ahụ ruru ntụ ọka niile.
- source_word: φύραμα
  choice: ntụ ọka a gwakọtara agwakọta
  rationale: Ọ na-ezo aka n'igwe ntụ ọka a gwakọtara maka ime achịcha, ma na-eme ka oyiyi ahụ doo onye na-agụ Igbo nke oge a anya.
- source_word: ζυμοῖ
  choice: na-eme ka ... koo
  rationale: Nke a na-egosipụta kpọmkwem ọrụ ihe na-eko achịcha n'okwu Igbo eke, ma na-echekwa mkpụmkpụ na ike ilu ahụ.
theological_decisions:
- issue: Ike ihe atụ nke ilu ahụ
  choice: E debere oyiyi nkịtị nke ihe na-eko achịcha na ntụ ọka, n'akọwaghị ihe Pọl ji ya atụ n'ime amaokwu ahụ.
  alternative: Ntakịrị ozizi ụgha na-agbasa n'ọgbakọ dum.
  rationale: Amaokwu ahụ n'onwe ya na-ekwu ilu; ịkọwa ozugbo na ọ bụ ozizi ụgha ma ọ bụ mmetụta ọjọọ ga-etinye nkọwa sitere n'akụkụ amaokwu gbara ya gburugburu n'ime ederede.
translation_notes:
  register: Asụsụ Igbo Izugbe dị ugbu a, dị mfe ma nwee ugwu. A họọrọ “ihe na-eko achịcha” ka ọ ghara ịdị mgbagwoju anya; ihe ọzọ bụ “ihe iko achịcha.” Akara ndetu [a] dị n'ederede isi.
