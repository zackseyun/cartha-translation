review_pass:
  verdict: revise
  source_fidelity: The draft retains the proverb’s concrete imagery and correctly conveys that a small amount of leaven affects the entire mixed dough. However, “ihe na-eko achịcha” can be heard as a thing that ferments bread rather than the leavening agent itself; “ihe iko achịcha” identifies ζύμη more directly in Standard Igbo.
  naturalness: “Ntụ ọka a gwakọtara agwakọta” is unnecessarily repetitive and somewhat cumbersome. “Ntụ ọka ahụ dum” is natural, clear, and preserves the referential sense of the whole batch.
  terminology: Use “ihe iko achịcha” for leaven, retaining the familiar scriptural/proverbial image without explaining its figurative application. “Yist” is a suitable lexical alternative in a footnote.
  issues:
  - severity: medium
    issue: The main rendering of ζύμη is potentially ambiguous.
    rationale: “Ihe na-eko achịcha” may describe something that ferments bread, whereas ζύμη is the fermenting/leavening agent. “Ihe iko achịcha” more directly denotes the agent.
  - severity: low
    issue: The wording for φύραμα is overly repetitive.
    rationale: “Ntụ ọka a gwakọtara agwakọta” duplicates the idea of mixing. “Ntụ ọka ahụ dum” communicates the dough/batch naturally in the proverb’s context.
  - severity: low
    issue: The current footnote repeats the preferred terminology rather than providing a meaningful alternative.
    rationale: A footnote using “yist” gives readers a genuine modern lexical alternative for “ihe iko achịcha.”
  revised_text: Ntakịrị ihe iko achịcha na-eme ka ntụ ọka ahụ dum koo[a].
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “Ntakịrị yist na-eme ka ntụ ọka ahụ dum koo.”
    reason: lexical_alternative
  revision_rationale: The revision makes the leavening agent explicit, streamlines the expression for the whole batch of dough, and keeps the compact proverbial form and its unresolved metaphorical force. No interpretive expansion has been added.
