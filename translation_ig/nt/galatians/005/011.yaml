id: GAL.5.11
reference: Galatians 5:11
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐγὼ δέ, ἀδελφοί, εἰ περιτομὴν ἔτι κηρύσσω, τί ἔτι διώκομαι; ἄρα κατήργηται τὸ σκάνδαλον τοῦ σταυροῦ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/011.yaml
  text: But I[a], brothers, if I am still preaching circumcision[b], why am I still being persecuted? Then the offense of the cross has been removed.
translation:
  language: ig
  text: 'Ma mụ onwe m, ụmụnna m[a], ọ bụrụ na m ka na-ekwusa ibi úgwù, gịnị mere a ka ji na-akpagbu m? Ọ bụrụ otú ahụ, e wepụla ihe mkpasu iwe[b] nke obe.


    [a] Okwu Grik a sụgharịrị “ụmụnna m” pụtara n''ụzọ nkịtị “ụmụnne nwoke,” ma a pụkwara iji ya kpọọ ìgwè ndị nwoke na ndị nwanyị nọkọrọ.

    [b] Ma ọ bụ, “ihe ịsụ ngọngọ nke obe.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Okwu Grik a sụgharịrị “ụmụnna m” pụtara n'ụzọ nkịtị “ụmụnne nwoke,” ma a pụkwara iji ya kpọọ ìgwè ndị nwoke na ndị nwanyị nọkọrọ.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ihe ịsụ ngọngọ nke obe.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγὼ δέ
  choice: Ma mụ onwe m
  rationale: “Ma” na-egosi ntụgharị δέ, ebe “mụ onwe m” na-echekwa nkwusi ike dị na nnọchiaha ἐγώ.
- source_word: ἀδελφοί
  choice: ụmụnna m
  rationale: Nke a bụ ụzọ Igbo dị ndụ na nke kwesịrị nsọpụrụ e si akpọ ndị otu okwukwe; ihe odide ala peeji na-akọwa ụdị nwoke dị n'okwu Grik na ojiji ya nye ìgwè agwakọtara.
- source_word: περιτομήν
  choice: ibi úgwù
  rationale: Nke a bụ okwu Igbo doro anya maka circumcision, ma ọ na-ahapụkwa ihe gbara ya gburugburu na Galetia ka ọ gosi na a na-ekwu maka ya dị ka ihe a chọrọ n'iwu.
- source_word: ἔτι κηρύσσω
  choice: ka na-ekwusa
  rationale: “Ka na-” na-echekwa echiche oge nke ἔτι, “na-ekwusa” na-egosikwa omume na-aga n'ihu nke κηρύσσω.
- source_word: ἔτι διώκομαι
  choice: a ka ji na-akpagbu m
  rationale: Nke a na-echekwa ma ἔτι ma olu nnara nke διώκομαι, ma na-ada n'ụzọ ebumpụta ụwa n'Igbo.
- source_word: ἄρα
  choice: Ọ bụrụ otú ahụ
  rationale: Ọ na-egosi nkwubi okwu sitere n'echiche e tinyere n'ajụjụ ahụ, n'enweghị ime ka njikọ ahụ sie ike karịa nke Grik.
- source_word: κατήργηται
  choice: e wepụla
  rationale: Ụdị a na-egosi ihe emeworo nke nsonaazụ ya ka dị, kwekọọ na perfect passive nke Grik.
- source_word: σκάνδαλον
  choice: ihe mkpasu iwe
  rationale: N'ọnọdụ a, ọ na-egosi obe dị ka ihe na-akpalite ịjụ ozi ahụ na mmegide; ihe odide ala peeji na-echekwa ntụgharị “ihe ịsụ ngọngọ.”
- source_word: σταυροῦ
  choice: nke obe
  rationale: “Obe” bụ ntụgharị Igbo kwụ ọtọ na nke a na-amakarị maka σταυρός n'okwu Pọl.
theological_decisions:
- issue: Otu e si sụgharịa ἀδελφοί mgbe ndị a na-agwa nwere ike ịbụ ndị nwoke na ndị nwanyị
  choice: ụmụnna m
  alternative: ụmụnne nwoke m; ụmụnna nwoke na nwanyị
  rationale: “Ụmụnna m” bụ okwu Igbo ebumpụta ụwa nke nwere ike ịgụnye ìgwè niile, ebe ihe odide ala peeji na-echekwa eziokwu na ụdị okwu Grik bụ nke nwoke ma nwee ike ịkpọ ìgwè agwakọtara.
- issue: Ihe σκάνδαλον τοῦ σταυροῦ pụtara
  choice: ihe mkpasu iwe nke obe
  alternative: ihe ịsụ ngọngọ nke obe
  rationale: Isi okwu ahụ bụ na obe na-akpalite ịjụ na mmegide. A naghị ewepụ esemokwu nkà mmụta okpukpe ahụ; a na-edebekwa ihe oyiyi nkịtị nke ịsụ ngọngọ n'ihe odide ala peeji.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke oge a, dị ùgwù ma dị mfe nghọta. E ji “mụ onwe m” chekwaa nkwusi ike Pọl, jiri usoro ajụjụ na nkwubi okwu dị mkpụmkpụ chekwaa ike arụmụka ahụ.
