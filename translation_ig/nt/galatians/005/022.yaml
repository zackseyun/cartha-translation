id: GAL.5.22
reference: Galatians 5:22
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ὁ δὲ καρπὸς τοῦ πνεύματός ἐστιν ἀγάπη, χαρά, εἰρήνη, μακροθυμία, χρηστότης, ἀγαθωσύνη, πίστις,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/022.yaml
  text: But the fruit of the Spirit is love[a], joy, peace, patience, kindness, goodness, faithfulness,
translation:
  language: ig
  text: Ma mkpụrụ nke Mmụọ Nsọ bụ ịhụnanya, ọṅụ, udo, ndidi, obiọma, ịdị mma, okwukwe[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ikwesị ntụkwasị obi.” Okwu Grik bụ pistis nwere ike ịpụta okwukwe, ntụkwasị obi, ma ọ bụ ikwesị ntụkwasị obi.
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: Ma
  rationale: Ọ na-egosi ọdịiche dị n'etiti mkpụrụ nke Mmụọ Nsọ na ọrụ nke anụ ahụ e depụtara n'amaokwu ndị bu ụzọ.
- source_word: καρπὸς
  choice: mkpụrụ
  rationale: E debere ihe atụ Pọl ji mee ihe, tinyere ịdị n'otu nke okwu ahụ n'ụdị otu, nke na-egosi ihe ọma ndị a dịka otu ihe Mmụọ Nsọ na-amịpụta.
- source_word: τοῦ πνεύματός
  choice: nke Mmụọ Nsọ
  rationale: N'ọnọdụ a, πνεῦμα na-ezo aka na Mmụọ Nsọ, onye a na-atụnyere anụ ahụ n'akụkụ akwụkwọ ozi a.
- source_word: ἀγάπη
  choice: ịhụnanya
  rationale: Nke a bụ okwu Igbo doro anya ma bụrụkwa nke a na-ejikarị akọwa ἀγάπη.
- source_word: χαρά
  choice: ọṅụ
  rationale: Ọ bụ okwu Igbo dị mkpirikpi ma bụrụ nke nkịtị maka ọṅụ miri emi.
- source_word: εἰρήνη
  choice: udo
  rationale: Ọ na-echekwa ma echiche nke ịdị n'udo n'ime obi ma nke ịdị n'udo n'etiti mmadụ na ibe ya, n'ebughị ụzọ kpebie naanị otu n'ime ha.
- source_word: μακροθυμία
  choice: ntachi obi
  rationale: Ọ bụ okwu a na-aghọta nke ọma maka iji ogologo oge nagide ihe ma ghara iwe ọkụ ọsọ ọsọ.
- source_word: χρηστότης
  choice: obiọma
  rationale: Ọ na-egosipụta omume ọma na ebere mmadụ na-emere ndị ọzọ.
- source_word: ἀγαθωσύνη
  choice: ịdị mma
  rationale: Ọ na-egosipụta àgwà ọma sara mbara nke okwu Grik a pụtara, ma mee ka ọ dị iche ntakịrị na obiọma.
- source_word: πίστις
  choice: okwukwe
  rationale: Okwukwe bụ nkọwa bụ isi nke πίστις ma na-echekwa nghọtahie ziri ezi dị n'okwu ahụ; e debere 'ikwesị ntụkwasị obi' dịka nhọrọ ọzọ n'ala ala peeji.
theological_decisions:
- issue: Onye πνεῦμα na-ezo aka na ya
  choice: Mmụọ Nsọ
  alternative: mmụọ mmadụ
  rationale: Ọdịiche dị n'etiti anụ ahụ na Mmụọ n'ime Ndị Galeshia 5, tinyere arụmụka Pọl n'ozuzu ya, na-akwado na nke a bụ ọrụ Mmụọ Nsọ n'ime ndị kwere ekwe.
- issue: Nkọwa πίστις n'ime ndepụta àgwà ọma
  choice: okwukwe
  alternative: ikwesị ntụkwasị obi
  rationale: πίστις nwere ike ịpụta okwukwe, ntụkwasị obi, ma ọ bụ ikwesị ntụkwasị obi. A họọrọ 'okwukwe' n'ahịrị bụ isi n'ebughị ụzọ mechie ụzọ maka nghọta ọzọ, nke e debere n'ala ala peeji.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta. E debere usoro ndepụta ahụ na ihe atụ nke otu “mkpụrụ,” ma jiri “Mmụọ Nsọ” mee ka onye a na-ekwu banyere ya doo anya n'ọnọdụ a.
