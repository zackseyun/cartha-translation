base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/002.yaml
  text: 'Look: I[a], Paul, say to you that if you receive circumcision[b], Messiah will benefit you nothing.'
translation:
  language: ig
  text: Lee, ọ bụ m, Pọl, na-agwa unu na ọ bụrụ na unu ekwe ka e bie unu úgwù[a], Mesaịa[b] agaghị abara unu uru ọ bụla.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ọ bụrụ na e bie unu úgwù.”
    reason: lexical_alternative
  - marker: b
    text: N’asụsụ Grik, “Kraịst”; a sụgharịrị ya ebe a dịka “Mesaịa” n’ihi na Χριστός na-arụ ọrụ dịka utu aha.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἴδε
  choice: Lee
  rationale: Ọ bụ okwu e ji adọta uche ndị na-ege ntị. “Lee” na-egosipụta ike nke ịdọ aka ná ntị Pọl n'ụzọ doro anya ma bụrụkwa Igbo nkịtị.
- source_word: ἐγὼ Παῦλος
  choice: mụ onwe m, Pọl
  rationale: Nnọchiaha ahụ e kwuru hoo haa tinyere aha Pọl nwere nkwusi ike; “mụ onwe m, Pọl” na-edobe nkwusi ike ahụ.
- source_word: λέγω ὑμῖν
  choice: na-agwa unu
  rationale: Nke a bụ ụzọ Igbo dị ndụ ma kwụ ọtọ isi gosipụta okwu Pọl gwara ndị na-agụ akwụkwọ ozi ahụ ozugbo.
- source_word: ἐὰν περιτέμνησθε
  choice: ọ bụrụ na unu ekwe ka e bie unu úgwù
  rationale: Ụdị ngwaa Grik a na-egosi na ha ga-anara omume ibi úgwù. Nsụgharị a na-eme ka ọnọdụ ahụ doo anya n’Igbo n’etinyeghị ihe kpatara omume ahụ n’ime ederede.
- source_word: Χριστὸς
  choice: Mesaịa
  rationale: N’ebe a, Χριστός na-arụ ọrụ dị ka utu aha nke Onye E Tere Mmanụ, ya mere “Mesaịa” na-echekwa ihe utu aha ahụ pụtara.
- source_word: οὐδὲν ὠφελήσει
  choice: agaghị abara unu uru ọ bụla
  rationale: Nkebi a na-egosi na uru agaghị adị ma ọlị; okwu Igbo a doro anya ma na-edobe ịdị ike nke nkwupụta ahụ.
theological_decisions:
- issue: Nsụgharị Χριστός
  choice: Mesaịa
  alternative: Kraịst
  rationale: “Mesaịa” na-egosipụta Χριστός dị ka utu aha n’amaokwu a, kama ime ka ọ bụrụ naanị aha mmadụ.
- issue: Oke ịdọ aka ná ntị Pọl banyere ibi úgwù
  choice: E debere okwu ahụ n’ọnọdụ nke mmadụ ikwe ka e bie ya úgwù, n’enweghị ịgbasa ya ka ọ bụrụ ikpe megide ụdị ibi úgwù niile.
  alternative: Ịkọwa ya dị ka ikpe megide ibi úgwù n’ọnọdụ ọ bụla
  rationale: Ihe gbara amaokwu ahụ gburugburu metụtara ibi úgwù dịka ihe a na-achọ n’ihi idebe Iwu na inweta izi ezi. Nsụgharị ahụ anaghị etinye nkọwa sara mbara karịa okwu Pọl.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. “Mụ onwe m, Pọl” na-edobe nkwusi ike okwu Grik ahụ, ebe “agaghị abara unu uru ọ bụla” na-egosipụta enweghị uru kpamkpam n'ụzọ ndị Igbo na-asụkarị.
