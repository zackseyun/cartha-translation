review_pass:
  verdict: revise
  source_fidelity: The vice list, repeated warning, future denial of inheritance, and ‘kingdom of God’ are represented accurately. However, ‘ndị na-eme ihe ndị dị otú ahụ dị ka omume ha’ is an awkward and somewhat interpretive expansion of πράσσοντες. The participle can denote those engaged in such conduct, but the verse itself does not explicitly state ‘as their habitual practice.’
  naturalness: The draft is generally clear Standard Igbo. The phrase ‘dị ka omume ha’ is not idiomatic in this position. Linking the warning directly to the preceding list with ‘banyere ihe ndị a ka’ better reflects the Greek relative construction and reads more naturally.
  terminology: ‘anyaụfụ,’ ‘ịṅụbiga mmanya ókè,’ ‘oriri na ọṅụṅụ aghara aghara,’ ‘alaeze Chineke,’ and ‘agaghị eketa’ are suitable. The footnote appropriately clarifies that κῶμοι concerns excessive revelry rather than necessarily sexual conduct.
  issues:
  - severity: medium
    issue: Interpretive and unnatural rendering of οἱ τὰ τοιαῦτα πράσσοντες
    rationale: ‘ndị na-eme ihe ndị dị otú ahụ dị ka omume ha’ adds an explicit habitual-life qualification and is awkward Igbo. ‘ndị na-eme ihe ndị dị otu a’ is direct, natural, and preserves the participial wording without resolving a theological question beyond the source.
  - severity: low
    issue: Clause linkage for the warning
    rationale: Ending the list with a full stop and then saying ‘Ana m adọ unu aka ná ntị banyere ihe ndị a’ is understandable, but a semicolon and ‘banyere ihe ndị a ka m na-adọ unu aka ná ntị’ more naturally retain the Greek’s direct relative connection to the listed conduct.
  revised_text: anyaụfụ, ịṅụbiga mmanya ókè, oriri na ọṅụṅụ aghara aghara,[a] na ihe ndị yiri ndị a; banyere ihe ndị a ka m na-adọ unu aka ná ntị, dịka m dọrọ unu aka ná ntị na mbụ, na ndị na-eme ihe ndị dị otu a agaghị eketa alaeze Chineke.
  revised_footnotes:
