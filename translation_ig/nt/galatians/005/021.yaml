    text: Ma ọ bụ, “mkpori ndụ gabigara ókè.” Okwu Grik ahụ na-ezo aka n’ememme na ọṅụṅụ aghara aghara, nke na-enwekarị ịṅụ mmanya.
    reason: lexical_alternative
  revision_rationale: The revision removes an awkward, explicit habitual-practice gloss while retaining the source’s reference to people who engage in such conduct. It also makes the warning clause flow directly from the vice list in natural formal Standard Igbo. The lexical rendering and footnote for κῶμοι are retained.
