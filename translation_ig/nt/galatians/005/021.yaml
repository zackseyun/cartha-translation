  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸀φθόνοι, μέθαι, κῶμοι, καὶ τὰ ὅμοια τούτοις, ἃ προλέγω ὑμῖν ⸀καθὼς προεῖπον ὅτι οἱ τὰ τοιαῦτα πράσσοντες βασιλείαν θεοῦ οὐ κληρονομήσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/021.yaml
  text: envy[a], drunkenness, carousing, and things like these, about which I warn you, just as I warned before, that those who practice such things will not inherit the kingdom of God.
translation:
  language: ig
  text: anyaụfụ, ịṅụbiga mmanya ókè, oriri na ọṅụṅụ aghara aghara,[a] na ihe ndị yiri ndị a; banyere ihe ndị a ka m na-adọ unu aka ná ntị, dịka m dọrọ unu aka ná ntị na mbụ, na ndị na-eme ihe ndị dị otu a agaghị eketa alaeze Chineke.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “mkpori ndụ gabigara ókè.” Okwu Grik ahụ na-ezo aka n’ememme na ọṅụṅụ aghara aghara, nke na-enwekarị ịṅụ mmanya.
    reason: lexical_alternative
lexical_decisions:
- source_word: φθόνοι
  choice: anyaụfụ
  rationale: Okwu a na-egosi iwe ma ọ bụ ọchịchọ ọjọọ n’ihi ihe ọma onye ọzọ nwere; “anyaụfụ” bụ okwu Igbo doro anya ma kwekọọ na ndepụta ajọ omume.
- source_word: μέθαι
  choice: ịṅụbiga mmanya ókè
  rationale: Ọ na-ezo aka n’ịṅụ mmanya ruo n’ókè mmadụ ṅụrụma; ntụgharị a bụ nke ndị mmadụ na-aghọta ngwa ngwa.
- source_word: κῶμοι
  choice: oriri na ọṅụṅụ aghara aghara
  rationale: Ọ na-egosi ememme ma ọ bụ mkpori ndụ gabigara ókè, nke na-enwekarị ịṅụ mmanya; ọ naghị adị mkpa ka ọ pụta omume mmekọahụ.
- source_word: τὰ ὅμοια τούτοις
  choice: ihe ndị yiri ha
  rationale: Nke a na-edebe ndepụta ahụ ka ọ ghe oghe, gụnyere omume ndị ọzọ yiri ndị a kpọrọ aha.
- source_word: ἃ προλέγω ὑμῖν
  choice: Ana m adọ unu aka ná ntị banyere ihe ndị a
  rationale: N’ọnọdụ ndụmọdụ omume a, προλέγω nwere ike ibu ihe ịdọ aka ná ntị tupu oge eruo, ọ bụghị nanị ikwu okwu.
- source_word: καθὼς προεῖπον
  choice: dị nnọọ ka m dọrọ unu aka ná ntị na mbụ
  rationale: Ọ na-ezo aka n’ịdọ aka ná ntị e mere tupu nke a ma na-edebe nkwughachi okwu Pọl.
- source_word: οἱ τὰ τοιαῦτα πράσσοντες
  choice: ndị na-eme ihe ndị dị otú ahụ dị ka omume ha
  rationale: Nkebi a na-egosi omume e ji mara mmadụ ma ọ bụ nke a na-eme mgbe niile, ọ bụghị otu mmejọ naanị.
- source_word: βασιλείαν θεοῦ
  choice: alaeze Chineke
  rationale: Nke a bụ ntụgharị Igbo kwụ ọtọ nke ahịrịokwu nkà mmụta okpukpe a.
- source_word: οὐ κληρονομήσουσιν
  choice: agaghị eketa
  rationale: Ọ na-edebe ihe atụ nke ihe nketa na ike okwu ọdịnihu dị na Grik.
theological_decisions:
- issue: Ma ịdọ aka ná ntị Pọl ọ na-ekwu banyere otu omume e mere naanị otu ugboro ka ọ bụ usoro ndụ a na-eme mgbe niile
  choice: ndị na-eme ihe ndị dị otú ahụ dị ka omume ha
  alternative: ndị na-eme ihe ndị dị otú ahụ
  rationale: Present participle πράσσοντες n’ime ndepụta ajọ omume a na-egosi omume e ji mara mmadụ. Tụgharị ya otú a na-edebe ịdị arọ nke ịdọ aka ná ntị ahụ n’enweghị ikwu na otu ọdịda naanị na-ekpebi ihe niile.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. E debere usoro ndepụta ajọ omume ahụ, nkwughachi ịdọ aka ná ntị, na asụsụ ihe nketa nke okwu Grik.
