  to: N’ihi na a kpọrọ unu ka unu nwee nnwere onwe, ụmụnna[a]. Naanị unu emela ka nnwere onwe unu ghọọ ohere maka anụ ahụ[b][c]; kama, site n’ịhụnanya, na-ejerenu ibe unu ozi[d].
  rationale: 'The revision preserves the Greek syntax and contrast while replacing three expressions with clearer, idiomatic Standard Igbo. Footnote anchors remain attached to the same referents: “ụmụnna” (a), “anụ ahụ” (b–c), and reciprocal service (d).'
