id: GAL.5.13
reference: Galatians 5:13
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ὑμεῖς γὰρ ἐπ’ ἐλευθερίᾳ ἐκλήθητε, ἀδελφοί· μόνον μὴ τὴν ἐλευθερίαν εἰς ἀφορμὴν τῇ σαρκί, ἀλλὰ διὰ τῆς ἀγάπης δουλεύετε ἀλλήλοις·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/013.yaml
  text: For you were called to freedom[a], brothers; only do not use your freedom as an opportunity for the flesh[d][c][b], but through love serve one another.
translation:
  language: ig
  text: N’ihi na a kpọrọ unu ka unu nwee nnwere onwe, ụmụnna[a]. Naanị unu emela ka nnwere onwe unu ghọọ ohere maka anụ ahụ[b][c]; kama, site n’ịhụnanya, na-ejerenu ibe unu ozi[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Okwu Grik a sụgharịrị “ụmụnna” bụ okwu n’ọnụọgụ ọtụtụ nke ụdị nwoke, ma n’akwụkwọ ozi a ọ na-agwa ọgbakọ ndị kwere ekwe dum, tinyere ụmụ nwanyị.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, “ka ọ bụrụ oge ma ọ bụ ụzọ anụ ahụ ga-eji rụọ ọrụ”; ya bụ, ka nnwere onwe ghara ịghọ ụzọ ọchịchọ mmehie nke na-achọ naanị ọdịmma onwe onye ga-esi rụọ ọrụ.
    reason: lexical_alternative
  - marker: c
    text: “Anụ ahụ” n’ebe a abụghị naanị ahụ mmadụ nkịtị; ọ na-ezo aka n’ọchịchọ mmadụ dara ada. Ụfọdụ nsụgharị na-akpọ ya “ọdịdị mmehie.”
    reason: alternative_reading
  - marker: d
    text: Ngwaa Grik a sụgharịrị “na-ejerenu ... ozi” sitere n’otu ezinụlọ okwu na okwu pụtara “ohu,” ya mere ọ nwere echiche nke mmadụ inyefe onwe ya ijere ndị ọzọ ozi.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὑμεῖς γὰρ
  choice: N’ihi na ... unu
  rationale: “N’ihi na” na-egosi na okwu a na-akọwa ma na-akwado ihe e kwuru tupu ya; “unu” na-edebe onye nke abụọ n’ọnụọgụ ọtụtụ.
- source_word: ἐπ’ ἐλευθερίᾳ ἐκλήθητε
  choice: a kpọrọ unu ka unu nweere onwe unu
  rationale: Nke a na-egosi nnwere onwe dịka ọnọdụ ma ọ bụ ebumnuche ọkpụkpọ ahụ, n’asụsụ Igbo doro anya ma bụrụ nke e ji eme ihe ugbu a.
- source_word: ἀδελφοί
  choice: ụmụnna
  rationale: “Ụmụnna” bụ okwu Igbo kwesịrị ekwesị maka ndị otu ezinụlọ ma ọ bụ ndị okwukwe; ọ na-adabara ọgbakọ ahụ dum, ebe nkọwa ala peeji na-akọwa ụdị okwu Grik ahụ.
- source_word: μόνον μὴ ... εἰς ἀφορμὴν
  choice: Naanị unu emela ... ka ọ bụrụ ohere
  rationale: Ọ na-edebe ịdọ aka ná ntị na oke e tinyere na nnwere onwe ahụ; “ohere” na-enye echiche nke ihe e ji amalite ma ọ bụ mee ọchịchọ ọjọọ.
- source_word: σάρξ
  choice: anụ ahụ
  rationale: A hapụrụ ihe atụ Pọl ji mee ihe kama ịkọwa ya ozugbo dịka “ọdịdị mmehie”; nkọwa ala peeji na-eme ka uche omume na ọchịchọ dara ada pụta ìhè.
- source_word: διὰ τῆς ἀγάπης
  choice: site n’ịhụnanya
  rationale: Ọ na-edebe ịhụnanya dịka ụzọ ma ọ bụ ike e ji eje ozi ahụ.
- source_word: δουλεύετε ἀλλήλοις
  choice: na-ejeritanụ ibe unu ozi
  rationale: Nke a bụ iwu na-aga n’ihu nke na-egosi ijere ibe ha ozi; ụdị “-rịta-” na “ibe unu” na-eme ka mmekọrịta ahụ doo anya, ebe nkọwa ala peeji na-echekwa echiche ọrụ ohu dị n’okwu Grik.
theological_decisions:
- issue: Ndị okwu ἀδελφοί na-agwa
  choice: ụmụnna
  alternative: ụmụnne nwoke; ụmụnna nwoke na nwanyị
  rationale: Okwu Grik bụ ụdị nwoke n’ọnụọgụ ọtụtụ, ma n’akwụkwọ ozi a ọ na-agwa ọgbakọ ndị kwere ekwe dum. “Ụmụnna” bụ okwu Igbo ebumpụta ụwa nke na-adịghị egbochi ụmụ nwanyị, ebe nkọwa na-echekwa eziokwu gbasara ụdị Grik.
- issue: Uche σάρξ n’ebe a
  choice: anụ ahụ
  alternative: ọdịdị mmehie; ọchịchọ ọjọọ nke mmadụ dara ada
  rationale: N’ebe a, okwu ahụ abụghị naanị ahụ mmadụ nkịtị, ma ọ metụtara ọchịchọ mmadụ nke na-emegide Chineke. Idebe “anụ ahụ” na-echekwa ihe atụ na esemokwu nkà mmụta okpukpe Pọl ji.
- issue: Ike okwu δουλεύετε
  choice: na-ejeritanụ ibe unu ozi
  alternative: bụrụnụ ndị ohu ibe unu
  rationale: Okwu Grik nwere echiche nke ịrụ ọrụ dịka ohu, ma ịsị “bụrụnụ ndị ohu ibe unu” nwere ike iduhie onye Igbo na-agụ ya. Isi okwu ahụ jiri ụdị okwu dị mma maka ndụmọdụ, ebe nkọwa ala peeji na-echekwa ike ihe atụ ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-edebe njikọ ya na ihe bu ya ụzọ, ihe atụ “anụ ahụ,” na ike okwu banyere ọrụ ohu, ma na-eji usoro okwu Igbo ebumpụta ụwa.
