source:
  edition: SBLGNT
  text: Λέγω δέ, πνεύματι περιπατεῖτε καὶ ἐπιθυμίαν σαρκὸς οὐ μὴ τελέσητε.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/016.yaml
  text: But I say[a], walk by the Spirit, and you will certainly not carry out the desire of the flesh.
translation:
  language: ig
  text: Ma ana m asị, na-ejegharịnụ site na Mmụọ Nsọ, unu agaghị emezu ọchịchọ nke anụ ahụ ma ọlị.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị “anụ ahụ” ebe a dị ka “ọdịdị mmehie.” Okwu Grik bụ “anụ ahụ”; n'akwụkwọ Pọl, ọ pụrụ ịpụta ọdịdị mmadụ dara ada mgbe ọ na-emegide Mmụọ Nsọ.
    reason: alternative_reading
lexical_decisions:
- source_word: Λέγω δέ
  choice: Ma ana m asị unu
  rationale: “Ma” na-egosi ntakịrị ntụgharị ma ọ bụ mmegide n'okwu Pọl; itinye “unu” na-eme ka onye ọ na-agwa doo anya n'Igbo, dị ka ụdị ngwaa na-esote si gosi.
- source_word: πνεύματι
  choice: site na Mmụọ Nsọ
  rationale: Dative a nwere ike igosi onye na-enye ike ma ọ bụ ọnọdụ mmadụ nọ n'ime ya. N'okwu gbara amaokwu a gburugburu, ọ na-ezo aka na Mmụọ Nsọ; “site na” na-egosi nduzi na ike ya n'Igbo nke ọma.
- source_word: περιπατεῖτε
  choice: na-ejegharịnụ
  rationale: A hapụrụ ihe atụ Pọl nke ijegharị, nke pụtara ibi ndụ ma ọ bụ ịkpa àgwà kwa ụbọchị. Ọ bụ okwu a na-aghọta n'Igbo ma na-echekwa oyiyi nke isi mmalite.
- source_word: ἐπιθυμίαν
  choice: ọchịchọ
  rationale: Okwu a sara mbara karịa agụụ mmekọahụ; ihe na-eme ka ọ bụrụ ọchịchọ ọjọọ ebe a bụ njikọ ya na “anụ ahụ.”
- source_word: σαρκὸς
  choice: anụ ahụ
  rationale: Nsụgharị a na-echekwa okwu na esemokwu echiche Pọl n'etiti anụ ahụ na Mmụọ, kama ịkọwa ya ozugbo dị ka “ọdịdị mmehie.”
- source_word: οὐ μὴ τελέσητε
  choice: unu agaghị emezu ... ma ọlị
  rationale: “Agaghị ... ma ọlị” na-ebute nkwụsi ike nke οὐ μή; “emezu” na-egosi ime ọchịchọ ahụ ruo n'omume ma ọ bụ ime ya nke ọma.
theological_decisions:
- issue: Onye πνεύματι na-ezo aka na ya
  choice: Mmụọ Nsọ
  alternative: mmụọ mmadụ ma ọ bụ ụkpụrụ ime mmụọ n'ozuzu
  rationale: N'okwu Galetia 5 gbara ya gburugburu, Pọl na-eme ka Mmụọ na anụ ahụ guzogide ibe ha, nke na-akwado na nke a bụ Mmụọ Nsọ. Ide ya dị ka “Mmụọ Nsọ” na-eme ka ntụaka ahụ doo anya n'Igbo.
- issue: Nsụgharị σαρκὸς
  choice: anụ ahụ
  alternative: ọdịdị mmehie
  rationale: Ọ bụ ezie na okwu ahụ nwere echiche omume ọjọọ ebe a, ide “anụ ahụ” na-echekwa ụdị okwu Pọl na esemokwu nkà mmụta okpukpe ya, ebe nkọwa ọzọ dị n'ala peeji.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E chekwara ihe atụ nke “ijegharị” na okwu Pọl bụ “anụ ahụ”; e ji “ma ọlị” mee ka nkwụsi ike nke nkwupụta ahụ pụta ìhè.
