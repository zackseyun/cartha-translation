  text: οἱ δὲ τοῦ ⸀Χριστοῦ τὴν σάρκα ἐσταύρωσαν σὺν τοῖς παθήμασιν καὶ ταῖς ἐπιθυμίαις.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/024.yaml
  text: Those who belong to Messiah have crucified the flesh along with its passions and desires[a][b].
translation:
  language: ig
  text: Ma ndị bụ nke Mesaya[a] akpọgidewo anụ ahụ[b] n’obe, ya na agụụ ya na ọchịchọ ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị bụ nke Kraịst.”
    reason: alternative_reading
  - marker: b
    text: “Anụ ahụ” n’ebe a na-ezo aka n’ọdịdị mmadụ nke mmehie merụrụ, nke na-emegide Mmụọ; ụfọdụ nsụgharị na-asụgharị ya “ọdịdị mmehie.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ ... τοῦ Χριστοῦ
  choice: ndị bụ nke Mesaya
  rationale: Ụdị okwu a na-egosi ndị Mesaya nwe, ya bụ, ndị so ya ma bụrụ nke ya. Nke a bụ ụzọ Igbo doro anya si chekwaa echiche nke ịbụ nke onye ọzọ.
- source_word: δὲ
  choice: Ma
  rationale: δὲ na-egosi obere ntụgharị ma ọ bụ ọdịiche n’ihe a na-ekwu. “Ma” na-ejikọta amaokwu a na ihe bu ya ụzọ n’enweghị ime ka ọdịiche ahụ sie ike gabiga ókè.
- source_word: σάρκα
  choice: anụ ahụ
  rationale: E debere okwu ihe atụ Pọl ji mee ihe kama ịkọwa ya ozugbo dị ka “ọdịdị mmehie,” ka esemokwu dị n’etiti anụ ahụ na Mmụọ ghara ịla n’iyi. Ihe odide ala peeji kọwara ihe ọ pụtara n’ebe a.
- source_word: ἐσταύρωσαν
  choice: akpọgidewo ... n’obe
  rationale: Nke a na-echekwa ihe oyiyi obe dị kpọmkwem n’okwu Grik. Ụdị “-wo” na-egosi ihe e mere nke nsonaazụ ya ka dị ugbu a.
- source_word: σὺν
  choice: ya na
  rationale: “Ya na” na-egosi na a kpọgidere anụ ahụ tinyere ihe ndị na-eso ya.
- source_word: παθήμασιν
  choice: agụụ
  rationale: N’ọnọdụ a, okwu ahụ na-ekwu maka mkpali siri ike nke anụ ahụ, ọ bụghị ahụhụ. “Agụụ” bụ okwu Igbo dị mfe nke na-enye echiche ahụ.
- source_word: ἐπιθυμίαις
  choice: ọchịchọ
  rationale: “Ọchịchọ” na-anọchi anya ọchịchọ siri ike n’ụzọ sara mbara, n’ebughị ụzọ mee ka ọ bụrụ naanị agụụ mmekọahụ.
theological_decisions:
- issue: Nsụgharị Χριστοῦ
  choice: Mesaya
  alternative: Kraịst
  rationale: N’ebe a, Χριστός na-arụ ọrụ dị ka utu aha Jizọs bụ Onye E Tere Mmanụ. “Mesaya” na-eme ka ọrụ ahụ pụta ìhè, ebe e debere “Kraịst” dị ka nsụgharị ọzọ n’ala peeji.
- issue: Ihe σάρξ pụtara n’ọdịiche omume Pọl na-eme
  choice: anụ ahụ
  alternative: ọdịdị mmehie
  rationale: “Anụ ahụ” na-echekwa okwu na esemokwu nkà mmụta okpukpe Pọl ji mee ihe. “Ọdịdị mmehie” bụ nkọwa nwere ike imechi ihe okwu ahụ pụtara, ya mere e tinyere ya naanị n’ihe odide ala peeji.
translation_notes:
  register: Asụsụ Igbo a bụ nke oge a, dị ùgwù ma dị mfe nghọta. E ji “akpọgidewo ... n’obe” chekwaa ihe oyiyi obe, ma e ji ihe odide ala peeji kọwaa okwu nwere nghọta pụrụ iche n’akwụkwọ Pọl.
