    reason: lexical_alternative
  revision_rationale: The revision retains the draft’s accurate and readable renderings while replacing the redundant final phrase with “òtù nkewa,” a compact Standard Igbo expression for socially divisive factions. Footnote b is narrowed to the later technical sense of αἱρέσεις, without making that later sense the meaning in this context.
