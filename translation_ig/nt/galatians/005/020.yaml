  text: εἰδωλολατρία, φαρμακεία, ἔχθραι, ⸂ἔρις, ζῆλος⸃, θυμοί, ἐριθεῖαι, διχοστασίαι, αἱρέσεις,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/020.yaml
  text: idolatry[a], sorcery, hostilities, strife, jealousy, outbursts of anger, selfish ambition, divisions, factions[b],
translation:
  language: ig
  text: ikpere arụsị, ime anwansi[a], ibu iro, esemokwu, ekworo, iwe ọkụ ọkụ, ịchọ naanị ọdịmma onwe onye, nkewa, na òtù nkewa[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “amoosu.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ìgwè” ma ọ bụ “òtù”; n’oge chọọchị e mesịrị, “ozizi jụrụ okwukwe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδωλολατρία
  choice: ikpere arụsị
  rationale: Nke a bụ okwu Igbo doro anya ma bụrụkwa nke a na-ejikarị akọwa ife ma ọ bụ ịkpọ isiala nye arụsị.
- source_word: φαρμακεία
  choice: ime anwansi
  rationale: N’usoro ajọ omume a, okwu ahụ na-ezo aka n’omume mgbaasị ma ọ bụ anwansi, ọ bụghị n’iji ọgwụ eme ihe n’ozuzu ya.
- source_word: ἔχθραι
  choice: ibu iro
  rationale: Ọ na-egosi ọnọdụ ma ọ bụ omume nke ịbụ onye iro; ntụgharị a bụ nke nkịtị ma doo ndị na-agụ Igbo anya.
- source_word: ἔρις
  choice: esemokwu
  rationale: Ọ na-egosi ọgụ okwu na ndọrọndọrọ n’etiti mmadụ; ‘esemokwu’ dabara nke ọma n’usoro a.
- source_word: ζῆλος
  choice: ekworo
  rationale: N’ebe a, ihe gbara okwu ahụ gburugburu chọrọ nghọta ọjọọ nke anyaụfụ na ịsọrịta mpi, ọ bụghị ịnụ ọkụ n’obi dị mma.
- source_word: θυμοί
  choice: iwe ọkụ ọkụ
  rationale: Ụdị ọtụtụ nke okwu Grik ahụ na-egosi iwe na-apụta ugboro ugboro n’ike, ọ bụghị naanị ọnọdụ iwe dịgide adịgide.
- source_word: ἐριθεῖαι
  choice: ịchọ naanị ọdịmma onwe onye
  rationale: Ọ na-egosi ime ihe n’ihi uru ma ọ bụ ọganihu nke onwe, karịsịa n’ụzọ na-akpalite ndọrọndọrọ.
- source_word: διχοστασίαι
  choice: nkewa
  rationale: Okwu ahụ na-egosi mmadụ iguzo n’akụkụ dị iche iche na-emegide ibe ha; ‘nkewa’ dị mfe ma saa mbara.
- source_word: αἱρέσεις
  choice: òtù ndị na-ekewa ekewa
  rationale: N’ebe a, ọ kacha egosi òtù ma ọ bụ akụkụ ndị na-ebute nkewa, kama ịbụ okwu nkà mmụta okpukpe e ji akọwa ozizi ụgha n’oge e mesịrị.
theological_decisions:
- issue: Ntụgharị αἱρέσεις
  choice: òtù ndị na-ekewa ekewa
  alternative: òtù okpukpe dị iche iche; ozizi nduhie
  rationale: Ihe ndị ọzọ e depụtara gburugburu ya bụ mmehie na-emebi mmekọrịta na ịdị n’otu. Ya mere, ntụgharị ahụ chekwara isi okwu gbasara nkewa n’etiti mmadụ, ma zere itinye nghọta nkà mmụta okpukpe nke oge e mesịrị n’ime okwu Grik ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta, dee ya. E debere ya n’ụdị ndepụta dị mkpirikpi dịka isi mmalite Grik si dị. ‘Iwe ọkụ ọkụ’ na-egosipụta iwe na-agbawa ugboro ugboro, ebe ‘òtù ndị na-ekewa ekewa’ na-echekwa ihe okwu ikpeazụ pụtara n’ụzọ mmekọrịta mmadụ na ibe ya.
