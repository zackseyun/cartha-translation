base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/007.yaml
  text: You were running well[a]. Who hindered you from obeying the truth?
translation:
  language: ig
  text: Unu nọ na-agba ọsọ nke ọma; ònye gbochiri unu ka unu ghara irubere eziokwu ahụ isi?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ka eziokwu ahụ mee ka unu kwenye.” Ngwaa Grik ahụ nwere ike ịpụta “irube isi” ma ọ bụ “ka e kwenye.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐτρέχετε
  choice: Unu nọ na-agba ọsọ
  rationale: Na-egosipụta omume gara n’ihu n’oge gara aga nke imperfect ahụ, ma na-echekwa ihe atụ Pọl ji banyere ịgba ọsọ n’etinyeghị ‘ọsọ ahụ,’ nke adịghị kpọmkwem n’asụsụ Grik.
- source_word: καλῶς
  choice: nke ọma
  rationale: Ọ bụ adverb na-akọwa otú ha si agba ọsọ; ‘nke ọma’ bụ okwu Igbo doro anya ma kwekọọ n’ihe atụ ahụ.
- source_word: τίς
  choice: Ònye
  rationale: Ajụjụ a na-ajụ banyere onye mere ihe mgbochi ahụ.
- source_word: ἐνέκοψεν
  choice: gbochiri
  rationale: Na-enye isi echiche nke igbochi mmadụ ka ọ ghara ịga n’ihu; ihe atụ ịgba ọsọ dịgidere site n’okwu ndị gbara ya gburugburu.
- source_word: τῇ ἀληθείᾳ
  choice: eziokwu ahụ
  rationale: Na-egosipụta article Grik ahụ ma yie ka ọ na-ezo aka n’eziokwu ozi ọma ndị Galeshia nataburu.
- source_word: μὴ πείθεσθαι
  choice: irubere ... isi
  rationale: πείθομαι nwere ike ịpụta irube isi ma ọ bụ ikwere ihe e mere ka mmadụ kwenye; ebe a, ‘irubere eziokwu ahụ isi’ na-egosipụta nzaghachi ha kwesịrị inye eziokwu ahụ, ebe e debere ụzọ nghọta ọzọ n’ala peeji.
theological_decisions:
- issue: Ihe πείθεσθαι pụtara mgbe ọ na τῇ ἀληθείᾳ nọkọrọ
  choice: irubere eziokwu ahụ isi
  alternative: ikwere eziokwu ahụ / ịbụ ndị eziokwu ahụ mere ka ha kwenye
  rationale: Ọnọdụ okwu a na-ekwu banyere nzaghachi ndị Galeshia nye ozi ọma na isi n’ụzọ ahụ pụọ. ‘Irubere ... isi’ na-echekwa akụkụ omume dị na ya n’etinyeghị ozizi otu ụka; ala peeji na-echekwa nghọta ọzọ nke ngwaa ahụ.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E chekwara ihe atụ ịgba ọsọ ahụ na ajụjụ siri ike nke amaokwu ahụ.
