    rationale: This is not a coherent Standard Igbo rendering and does not provide the stated lexical alternative “alienated from Christ.” It must be replaced.
  - severity: medium
    issue: Footnote b says “Unu ndị a na-agụ ná ndị ezi omume,” omitting the object required by the chosen Igbo construction.
    rationale: The formal passive alternative should read “Unu ndị a na-agụ unu ná ndị ezi omume site n’iwu” (or equivalent) to be grammatically complete and to reflect the Greek phrase.
  - severity: low
    issue: The placement of “site n’iwu” before “gụọ unu” is somewhat awkward in the main text.
    rationale: Moving it after the predicate makes the means/basis of justification clear in idiomatic modern Igbo without changing meaning.
