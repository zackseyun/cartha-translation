language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: κατηργήθητε ⸀ἀπὸ Χριστοῦ οἵτινες ἐν νόμῳ δικαιοῦσθε, τῆς χάριτος ἐξεπέσατε.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/004.yaml
  text: You who are seeking to be justified by law have been severed from the Messiah; you have fallen away from grace.
translation:
  language: ig
  text: Unu ndị na-achọ ka e gụọ unu ná ndị ezi omume site n’iwu[b], e kewapụla unu n’ebe Mezaịa nọ[a][c]; unu esiwo n’amara dapụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “unu enweghịzi mmekọrịta na Mezaịa,” ma ọ bụ, “e bipụla unu n’ebe Mezaịa nọ.”
    reason: lexical_alternative
  - marker: b
    text: 'Ma ọ bụ, “Unu ndị a na-agụ unu ná ndị ezi omume site n’iwu.” Ngwaa Grik ahụ dị n’ụdị ugbu a nke nnara omume, a pụkwara ịsụgharị ya n’ụzọ a kpọmkwem. N’ebe a, e jiri “na-achọ ka e gụọ unu ná ndị ezi omume” gosipụta ihe Pọl na-arụ ụka banyere ya: ịgbalị inweta ọnọdụ ịbụ onye ezi omume site n’idebe iwu.'
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “Kraịst.” Okwu Grik bụ Christos; a pụrụ ịsụgharị ya “Kraịst” ma ọ bụ “Mezaịa” mgbe ọ na-arụ ọrụ doro anya dịka utu aha.
    reason: alternative_reading
lexical_decisions:
- source_word: κατηργήθητε
  choice: e kewapụla unu
  rationale: N’ọnọdụ a, ya na ἀπὸ Χριστοῦ, okwu a na-egosi na e meela ka mmekọrịta ha na Mezaịa kwụsị ma ọ bụ na ha anọkwaghị n’otu ya. “E kewapụla unu” na-edobe ike nke okwu ahụ n’enweghị ịkọwa ma nkewa a ọ bụ nke na-enweghị mgbake.
- source_word: ἀπὸ Χριστοῦ
  choice: n’ebe Mezaịa nọ
  rationale: ἀπό na-egosi nkewa. “Mezaịa” na-egosipụta Χριστός dị ka utu aha nke Onye E Tere Mmanụ, ebe usoro “n’ebe … nọ” bụ ụzọ Igbo si ekwu nkewa n’ụzọ sitere n’okwu a kpọrọ aha.
- source_word: οἵτινες
  choice: Unu ndị
  rationale: Nke a na-akọwapụta kpọmkwem ndị nọ n’etiti ndị Galetia Pọl na-agwa okwu, ma na-edobekwa ike nke onye nke abụọ n’Igbo.
- source_word: ἐν νόμῳ
  choice: site n’iwu
  rationale: N’ebe a, ἐν na-egosi ihe mmadụ ji ma ọ bụ ihe ọ dabeere na ya. “Site n’iwu” bụ Igbo doro anya nke na-egosi na iwu bụ ihe ndabere maka ịgụ mmadụ ná ndị ezi omume, n’enweghị ịtinye mkpụrụokwu ntụaka na-adịghị na Grik.
- source_word: δικαιοῦσθε
  choice: na-achọ ka e … gụọ unu ná ndị ezi omume
  rationale: Ọ bụ ngwaa nọ n’ụdị ugbu a nke nnara omume. N’arụmụka Pọl, ọ na-ekwu banyere ndị na-achọ inweta ọnọdụ ịbụ ndị ezi omume site n’iwu. Nsụgharị a na-eme ka echiche ahụ doo anya, ebe nkọwa ala peeji na-edobe nsụgharị ka chiri anya, “ndị a na-agụ ná ndị ezi omume.”
- source_word: τῆς χάριτος
  choice: n’amara
  rationale: Ya na ἐκπίπτω, genitive a na-egosi ihe mmadụ si na ya dapụ. “N’amara” bụ okwu Igbo dị nkenke ma kwekọọ na ihe atụ ahụ.
- source_word: ἐξεπέσατε
  choice: unu esiwo … dapụ
  rationale: Aorist a na-egosi ihe mere n’ụzọ siri ike ma rute n’ọnọdụ dị ugbu a. “Esiwo … dapụ” na-edobe ihe atụ nke isi n’ọnọdụ amara dapụ n’enweghị ịkọwa esemokwu ozizi karịa ihe ederede kwuru.
theological_decisions:
- issue: Ma a ga-eji nsụgharị a kpebie arụmụka banyere ịla nzọpụta kpamkpam ma ọ bụ ịhapụ amara dịka ụzọ mmadụ si abịakwute Chineke
  choice: 'E debere okwu ịdọ aka ná ntị siri ike: “e kewapụla unu n’ebe Mezaịa nọ; unu esiwo n’amara dapụ.”'
  alternative: A pụrụ ime ka ọ dị nro dịka “unu aghọọla ndị bịara Mezaịa abịa,” ma ọ bụ kọwaa ya dịka “unu ahapụla ụzọ amara.”
  rationale: Grik na-ekwu maka nkewa n’ebe Mezaịa nọ na isi n’amara dapụ, ma ọ naghị akọwa usoro ozizi zuru ezu banyere ma ọnọdụ ahụ ò nwere mgbake. Ya mere, nsụgharị ahụ na-edobe ịdị arọ na esemokwu dị n’okwu Pọl n’enweghị itinye nkwenkwe pụrụ iche nke otu ụka.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “Gụọ … ná ndị ezi omume” na-edobe echiche ikpe ziri ezi nke δικαιόω n’enweghị ịkpọbata nkọwa ozizi karịa ederede. E jiri “Mezaịa” mee ka utu aha Χριστός pụta ìhè, ma tinye “Kraịst” dịka ụzọ ọzọ n’ala peeji.
