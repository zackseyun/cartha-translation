  variant: Standard Igbo
source:
  edition: SBLGNT
  text: φανερὰ δέ ἐστιν τὰ ἔργα τῆς σαρκός, ἅτινά ⸀ἐστιν πορνεία, ἀκαθαρσία, ἀσέλγεια,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/019.yaml
  text: 'The works of the flesh are evident: sexual immorality[a], impurity, sensuality,'
translation:
  language: ig
  text: 'Ma ọrụ nke anụ ahụ[a] pụtara ìhè: omume mmekọahụ rụrụ arụ, adịghị ọcha, omume rụrụ arụ a na-eme n’enweghị ihere,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “agwa mmehie.” Okwu Grik bụ “anụ ahụ” (σάρξ); n’ebe a, Pọl ji ya mee ihe atụ maka ọchịchọ na ụzọ ndụ mmadụ nke mmehie merụrụ.
    reason: alternative_reading
lexical_decisions:
- source_word: φανερὰ
  choice: pụtara ìhè
  rationale: Nkebi okwu a na-egosi ihe doro anya ma bụrụ nke a pụrụ ịhụ; ọ bụkwa Igbo nkịtị, nke dị ugwu.
- source_word: δέ
  choice: Ma
  rationale: Ọ na-egosi obere mgbanwe ma ọ bụ ọdịiche n’ihe Pọl na-ekwu, n’enweghị ime ka ọdịiche ahụ sie ike karịa ka Grik si kwuo ya.
- source_word: τὰ ἔργα
  choice: ọrụ
  rationale: “Ọrụ” na-edobe okwu Pọl ji mee ihe ma na-akwado ọdịiche dị n’etiti ọrụ anụ ahụ na mkpụrụ nke Mmụọ n’amaokwu ndị sochirinụ.
- source_word: τῆς σαρκός
  choice: nke anụ ahụ
  rationale: “Anụ ahụ” na-edobe ihe atụ Pọl na esemokwu dị n’etiti anụ ahụ na Mmụọ, kama ịkọwa ya ozugbo dịka “ọdịdị mmehie.”
- source_word: ἅτινά ἐστιν
  choice: ':'
  rationale: Akara ntụpọ abụọ na-ewebata ndepụta ahụ nke ọma n’Igbo ma na-ezere ikwughachi “nke bụ.”
- source_word: πορνεία
  choice: omume mmekọahụ rụrụ arụ
  rationale: Nke a na-ekpuchi omume mmekọahụ niile megidere ụkpụrụ omume, kama ime ka okwu Grik ahụ dị warara naanị n’otu ụdị mmehie mmekọahụ.
- source_word: ἀκαθαρσία
  choice: adịghị ọcha
  rationale: Ọ na-egosi adịghị ọcha n’omume na n’uche n’ọnọdụ ndepụta omume ọjọọ a.
- source_word: ἀσέλγεια
  choice: omume rụrụ arụ a na-eme n’enweghị ihere
  rationale: Okwu a na-egosi omume ọjọọ a na-eme n’enweghị ihere ma ọ bụ njide onwe onye; nsụgharị a sara mbara karịa ime ka ọ bụrụ naanị agụụ mmekọahụ.
theological_decisions:
- issue: Nsụgharị σάρξ n’ọnọdụ nkuzi omume Pọl
  choice: anụ ahụ
  alternative: ọdịdị mmehie
  rationale: “Anụ ahụ” na-echekwa ihe atụ Pọl na nkọwa ya nke nwere ọtụtụ akụkụ. “Ọdịdị mmehie” bụ nkọwa e nwere ike inye, ma ọ ga-ekpebi ihe okwu ahụ pụtara karịa ka ederede Grik n’onwe ya mere.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị mfe nghọta ma dịkwa ugwu. E debere “anụ ahụ” iji chekwaa okwu ihe atụ Pọl, ma kọwaa ihe ọzọ a pụrụ ịsụgharị ya na nkọwa ala peeji. Akara rịkọm ikpeazụ na-egosi na ndepụta ahụ gara n’ihu n’amaokwu na-esote.
