    issue: The footnote’s alternative rendering “ọdịdị mmehie” is awkward and may suggest the form or appearance of sin rather than a sinful disposition/nature.
    rationale: The footnote is intended to offer the interpretive alternative “sinful nature.” “Agwa mmehie” communicates that sense more idiomatically in Standard Igbo while remaining clearly marked as an alternative.
