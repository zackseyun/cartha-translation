  verdict: revise
  source_fidelity: 'The verse accurately renders the Greek sequence: the works of the flesh are presented as evident, followed by the three vices. “Ma” appropriately conveys the mild connective force of δέ without asserting a temporal “now.” “Omume rụrụ arụ a na-eme n’enweghị ihere” faithfully conveys the shameless, unrestrained character of ἀσέλγεια. The final comma correctly preserves the fact that the list continues in the next verse.'
  naturalness: The main text is clear, modern Standard Igbo, and has an appropriately serious register. “Pụtara ìhè” and “adịghị ọcha” are natural in this ethical context. The footnote alternative “ọdịdị mmehie,” however, is not an idiomatic Standard Igbo expression for “sinful nature”; “agwa mmehie” is clearer and more natural.
  terminology: “Anụ ahụ” properly preserves Paul’s metaphorical σάρξ and its contrast with the Spirit. The explanatory note appropriately identifies the metaphorical ethical sense without making the interpretive alternative the main text. The alternative rendering is adjusted for idiomatic Igbo.
  issues:
