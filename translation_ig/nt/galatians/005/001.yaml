  text: τῇ ἐλευθερίᾳ ⸂ἡμᾶς Χριστὸς ἠλευθέρωσεν· στήκετε οὖν⸃ καὶ μὴ πάλιν ζυγῷ δουλείας ἐνέχεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/001.yaml
  text: For freedom Messiah set us free[a]; therefore stand firm[b], and do not again be held by a yoke of slavery.
translation:
  language: ig
  text: Maka nnwere onwe ka Mesaịa tọhapụrụ anyị[a]. Ya mere, guzosienụ ike[b], unu ekwekwala ka e yikwasa unu yok nke ohu ọzọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “N'ime nnwere onwe ka Mesaịa tọhapụrụ anyị.” Nkebiokwu dative dị na mmalite dị mkpirikpi, a pụkwara ịghọta ya n’ụzọ abụọ a nwere njikọ chiri anya.
    reason: alternative_reading
  - marker: b
    text: A pụkwara ịsụgharị ya, “nọgidenụ na-eguzosi ike.” Ụdị iwu Grik a na-akpọ ha ka ha nọgide na-eguzosi ike, ọ bụghị naanị ka ha mee ya otu ugboro.
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ ἐλευθερίᾳ
  choice: Ọ bụ ka anyị nwere onwe anyị
  rationale: Nke a na-egosipụta dative ahụ dịka ebumnuche, ma na-edobe nnwere onwe n'isi ahịrịokwu maka nkwusi ike.
- source_word: Χριστὸς
  choice: Mesaịa
  rationale: A sụgharịrị aha ọkwa ahụ iji chekwaa ihe ọ pụtara na ọnọdụ ndị Juu na-atụ anya onye Chineke tere mmanụ.
- source_word: ἠλευθέρωσεν
  choice: ji tọhapụ anyị
  rationale: “Tọhapụ” bụ okwu Igbo doro anya maka ime ka onye nwere onwe ya, ọ na-ejikọkwa nke ọma na “nwere onwe anyị.”
- source_word: στήκετε
  choice: guzosienụ ike
  rationale: Ọ na-egosipụta iwu ka ha nọgide na-eguzosi ike, n'okwu Igbo dị ndụ ma dị nsọpụrụ.
- source_word: οὖν
  choice: Ya mere
  rationale: Ọ na-egosi nkwubi okwu sitere n'okwu bu ya ụzọ.
- source_word: ζυγῷ δουλείας
  choice: n'okpuru ịnyagba ohu
  rationale: “Ịnyagba ohu” na-echekwa ihe atụ nke yoke yana echiche siri ike nke ịnọ n'ohu.
- source_word: ἐνέχεσθε
  choice: ka e tinyekwa unu
  rationale: N'ịgbakwunye “n'okpuru,” okwu a na-egosipụta ịghọ ndị e doro n'okpuru ma ọ bụ ndị ihe jidere.
- source_word: πάλιν
  choice: ọzọ
  rationale: Ọ na-egosi ịlaghachi n'ọnọdụ ha nọbu na ya.
theological_decisions:
- issue: Ma a ga-asụgharị Χριστός dịka aha ọkwa ka ọ bụ jiri ụdị ụka maara ama
  choice: Mesaịa
  alternative: Kraịst
  rationale: Χριστός bụ aha ọkwa nke pụtara onye e tere mmanụ; “Mesaịa” na-eme ka ihe aha ọkwa ahụ pụtara pụta ìhè n'enweghị itinye nkọwa otu ụka.
- issue: Ike okwu δουλεία
  choice: ohu
  alternative: agbụ
  rationale: “Ohu” na-echekwa ọnọdụ mmadụ nọ n'okpuru onye nwe ya, ma gosipụta ọdịiche siri ike dị n'etiti nnwere onwe na ịbụ ohu.
- issue: Nkọwa nke dative τῇ ἐλευθερίᾳ
  choice: 'ebumnuche: “ka anyị nwere onwe anyị”'
  alternative: 'ọnọdụ: “n''ime nnwere onwe”'
  rationale: Usoro okwu Pọl dị mkpirikpi nwere ike ịpụta ebumnuche ma ọ bụ ọnọdụ; ederede bụ isi họọrọ ebumnuche, ma ihe odide ala peeji chekwara nghọta nke ọzọ.
translation_notes:
  register: Standard Igbo dị ugbu a, dị nsọpụrụ ma dị mfe nghọta. E chekwara nkwusi ike nke “nnwere onwe,” ihe atụ nke ịnyagba, na mgbagwoju nghọta nke nkebiokwu dative ahụ site n'ihe odide ala peeji.
