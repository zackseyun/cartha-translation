  to: Maka nnwere onwe ka Mesaịa tọhapụrụ anyị[a]. Ya mere, guzosienụ ike[b], unu ekwekwala ka e yikwasa unu yok nke ohu ọzọ.
  rationale: The revision replaces the awkward opening paraphrase with an idiomatic purpose/result rendering, preserves the title Mesaịa, and restores the explicit yoke metaphor with clear Standard Igbo wording. The alternate construal of the opening dative and the continuing force of the imperative remain represented in the footnotes.
