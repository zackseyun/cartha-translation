    issue: The cross-reference footnote uses “tulee Galetia 5:23.”
    rationale: For the imperative ‘compare’ in this concise reference style, “lee Galetia 5:23” is more idiomatic Standard Igbo.
  - severity: low
    issue: Footnote a does not clearly distinguish the present passive alternative from the main active-style Igbo wording.
    rationale: “Mmụọ Nsọ nọ na-edu unu” mostly repeats the main sense and adds an awkward progressive construction. An impersonal passive construction better reflects ‘you are being led by the Spirit.’
