  text: εἰ δὲ πνεύματι ἄγεσθε, οὐκ ἐστὲ ὑπὸ νόμον.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/018.yaml
  text: But if you are led by the Spirit[b][a], you are not under the law.
translation:
  language: ig
  text: Ma ọ bụrụ na Mmụọ Nsọ na-edu unu,[a] unu anọghị n'okpuru Iwu ahụ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ọ bụrụ na Mmụọ Nsọ na-edu unu mgbe niile.”
    reason: lexical_alternative
  - marker: b
    text: “N'okpuru Iwu ahụ” pụtara ịnọ n'okpuru ikike ma ọ bụ ọchịchị Iwu ahụ; lee Galetia 5:23.
    reason: cross_reference
lexical_decisions:
- source_word: εἰ
  choice: ọ bụrụ na
  rationale: Ọ na-ewebata ahịrịokwu ọnọdụ, ya mere “ọ bụrụ na” bụ ntụgharị Igbo doro anya.
- source_word: δὲ
  choice: Ma
  rationale: Ọ na-egosi obere ọdịiche n'etiti ibi dị ka anụ ahụ si chọọ na ịbụ onye Mmụọ Nsọ na-edu.
- source_word: πνεύματι
  choice: Mmụọ Nsọ
  rationale: N'ọnọdụ Galetia 5:16–25, πνεῦμα na-ezo aka na Mmụọ Nsọ, onye e mere ka ọ dị iche n'anụ ahụ.
- source_word: ἄγεσθε
  choice: na-edu unu
  rationale: Ọ bụ ngwaa dị n'ụdị nnara, ugbu a, nke na-egosi na Mmụọ Nsọ bụ onye na-edu ha; usoro a bụkwa Igbo nkịtị ma doo anya.
- source_word: οὐκ ἐστὲ
  choice: unu anọghị
  rationale: Nke a na-atụgharị okwu njụ nke ngwaa ịbụ n'ụzọ Igbo sitere n'okike.
- source_word: ὑπὸ νόμον
  choice: n'okpuru Iwu ahụ
  rationale: Ọ na-egosi ịnọ n'okpuru ọchịchị ma ọ bụ ikike Iwu ahụ; mkpụrụedemede ukwu na “Iwu” na-enyere aka igosi Iwu Mosis n'ọnọdụ a.
theological_decisions:
- issue: Ihe πνεύματι na-ezo aka na ya
  choice: Mmụọ Nsọ
  alternative: mmụọ mmadụ
  rationale: N'okwu ndị gbara amaokwu a gburugburu, Pọl na-eme ka anụ ahụ na Mmụọ dị iche; Mmụọ ahụ bụ onye Chineke nke na-edu ndị kwere ekwe.
- issue: Ihe ὑπὸ νόμον pụtara
  choice: ịnọghị n'okpuru Iwu ahụ
  alternative: ịnọghị n'okpuru iwu n'ozuzu ya
  rationale: N'ime Galetia, okwu a na-ezokarị aka n'ịnọ n'okpuru ikike ma ọ bụ usoro ọchịchị nke Iwu Mosis. E debere okwu ahụ nkenke ka a ghara ịgbasa ya bụrụ nkọwa ozizi zuru ezu.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị ugwu ma dị mfe nghọta. “Na-edu unu” na-eme ka ọrụ Mmụọ Nsọ pụta ìhè n'ụzọ sitere n'okike; “Iwu ahụ” na-ezo aka n'Iwu Mosis n'enweghị itinye nkọwa otu ụka pụrụ iche.
