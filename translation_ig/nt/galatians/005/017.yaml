reference: Galatians 5:17
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἡ γὰρ σὰρξ ἐπιθυμεῖ κατὰ τοῦ πνεύματος, τὸ δὲ πνεῦμα κατὰ τῆς σαρκός, ταῦτα ⸀γὰρ ⸂ἀλλήλοις ἀντίκειται⸃, ἵνα μὴ ἃ ⸀ἐὰν θέλητε ταῦτα ποιῆτε.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/017.yaml
  text: For the flesh desires what is against the Spirit[a], and the Spirit what is against the flesh; for these oppose each other[b], so that you do not do the things you want.
translation:
  language: ig
  text: N’ihi na anụ ahụ[a] na-achọ ihe na-emegide Mmụọ[b], Mmụọ na-achọkwa ihe na-emegide anụ ahụ; n’ihi na ha abụọ na-emegide ibe ha, ka unu ghara ime ihe ọ bụla unu chọrọ ime.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “agwa mmehie.” Okwu Grik bụ σάρξ (sarx), “anụ ahụ”; ma n’ebe a, Pọl ji ya mee ihe n’echiche omume sara mbara karịa naanị ahụ mmadụ.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsị, “mmụọ,” ma ọ bụrụ na a ghọta ya dịka mmụọ mmadụ kama Mmụọ Nsọ.
    reason: alternative_reading
lexical_decisions:
- source_word: σὰρξ
  choice: anụ ahụ
  rationale: Nke a na-edobe ihe atụ Pọl ji okwu σάρξ mee, kama ịkọwa ya ozugbo dịka “ọdịdị mmehie.” N’ebe a, okwu ahụ karịrị naanị ahụ mmadụ ma na-ezo aka n’ọchịchọ mmadụ nke na-emegide Chineke.
- source_word: ἐπιθυμεῖ
  choice: na-achọ
  rationale: “Na-achọ” bụ okwu Igbo doro anya ma dị ugbu a nke na-egosi ọchịchọ siri ike; okwu “ihe megidere” na-egosikwa ụzọ iro dị na κατά.
- source_word: κατὰ τοῦ πνεύματος / κατὰ τῆς σαρκός
  choice: ihe megidere Mmụọ / ihe megidere anụ ahụ
  rationale: Ịtinye “ihe” na-eme ka ahịrịokwu ahụ bụrụ Igbo eke, ma na-edobe echiche nke κατά na genitive dịka mmegide.
- source_word: πνεῦμα
  choice: Mmụọ
  rationale: Mkpụrụedemede ukwu na-egosi na o yikarịrị ka okwu a na-ezo aka na Mmụọ Nsọ, dịka gburugburu Galetia 5 si kwado, ma ihe odide ala na-edobe nhọrọ nke mmụọ mmadụ.
- source_word: ἀλλήλοις ἀντίκειται
  choice: na-emegide ibe ha
  rationale: Nke a na-egosi mmegide ha na-emegiderịta onwe ha n'ụzọ dị nkenke ma doo anya.
- source_word: ἵνα μὴ
  choice: ka ... ghara
  rationale: Usoro a na-edobe nghọta nzube ma ọ bụ ihe si na mmegide ahụ pụta, na-enweghị ịkọwa nke ọ bụ n’ụzọ karịrị ihe Grik kwuru.
- source_word: ἃ ἐὰν θέλητε ταῦτα ποιῆτε
  choice: ime ihe ndị unu chọrọ ime
  rationale: Nke a bụ Igbo a na-asụ nke ọma ma na-edobe ihe nnọchiaha nke ihe ndị mmadụ chọrọ na ngwaa ποιέω, “ime.”
theological_decisions:
- issue: Ihe σάρξ pụtara n’ọnọdụ okwu gbasara omume Pọl
  choice: E debere “anụ ahụ” n’ahịrị bụ isi dịka ihe atụ Pọl ji kwuo ọchịchọ mmadụ dara ada.
  alternative: ọdịdị mmehie
  rationale: Ọ bụ ezie na ebe a nwere nghọta gbasara mmehie, “anụ ahụ” na-echekwa okwu nkà mmụta okpukpe Pọl na esemokwu dị n’amaokwu ahụ, kama ime ka otu nkọwa bụrụ naanị nkọwa kwere omume.
- issue: Onye πνεῦμα na-ezo aka na ya
  choice: “Mmụọ” nwere mkpụrụedemede ukwu, nke na-egosi Mmụọ Nsọ.
  alternative: mmụọ mmadụ
  rationale: Galetia 5 gbara amaokwu a gburugburu na-ekwu ugboro ugboro banyere ibi ndụ site na Mmụọ, ya mere Mmụọ Nsọ bụ nghọta kacha dabara adaba; ma ihe odide Grik n’onwe ya anaghị eji mkpụrụedemede ukwu kewaa nhọrọ abụọ ahụ.
translation_notes:
  register: E ji Standard Igbo nke dị ugbu a, dị ùgwù, ma dị mfe nghọta. A hapụrụ “anụ ahụ” dịka ihe atụ Pọl ji mee ihe, ma jiri “Mmụọ” nwere mkpụrụedemede ukwu gosipụta nghọta kachasị kwekọọ na gburugburu amaokwu ahụ, na-edobe nhọrọ ọzọ n’ihe odide ala.
