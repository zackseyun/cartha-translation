  text: ἡμεῖς γὰρ πνεύματι ἐκ πίστεως ἐλπίδα δικαιοσύνης ἀπεκδεχόμεθα.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/005.yaml
  text: For through the Spirit[a], by faith[d][c][b], we eagerly await the hope of righteousness.
translation:
  language: ig
  text: N’ihi na site na Mmụọ Nsọ[a], site n’okwukwe[b], anyị ji agụụ na-echere olileanya nke ezi omume[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “n’ime Mmụọ Nsọ.” Ụdị dative nke πνεύματι pụrụ igosi ụzọ e si eme ihe (“site na Mmụọ Nsọ”) ma ọ bụ ọnọdụ mmadụ nọ n’ime ya (“n’ime Mmụọ Nsọ”).
    reason: lexical_alternative
  - marker: b
    text: N’asụsụ Grik, ọ bụ n’ụzọ nkịtị “site n’okwukwe.” Okwu πίστις pụkwara, n’ọnọdụ ụfọdụ, ịpụta ntụkwasị obi ma ọ bụ ikwesị ntụkwasị obi.
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ “ikpe ziri ezi.” Okwu Grik δικαιοσύνη pụrụ ịpụta ezi omume ma ọ bụ ikpe ziri ezi. Nkebiokwu a pụkwara ịpụta “ezi omume ahụ a na-atụ anya ya.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἡμεῖς
  choice: anyị
  rationale: Nnọchiaha onye mbụ n’ọnụọgụ ọtụtụ. Ọnọdụ ya na Grik na-enye ya ntakịrị nkwusi ike, ma “anyị” na-egosipụta ya nke ọma n’Igbo n’enweghị nkwusi ike a na-amanye amanye.
- source_word: γὰρ
  choice: N’ihi na
  rationale: Ọ na-ejikọta amaokwu a na ihe e kwuru tupu ya ma na-enye ihe mere ya ma ọ bụ nkwado ya.
- source_word: πνεύματι
  choice: site na Mmụọ Nsọ
  rationale: Dative a pụrụ igosi ụzọ e si eme ihe ma ọ bụ ọnọdụ e nọ n’ime ya. N’ọnọdụ Galetia 5, o yikarịrị ka ọ na-ekwu maka Mmụọ Nsọ; “site na” na-egosipụta ọrụ ya dị ka ụzọ e si eme ihe.
- source_word: ἐκ πίστεως
  choice: site n’okwukwe
  rationale: ἐκ na-egosi isi mmalite ma ọ bụ ntọala. “Site n’okwukwe” na-echekwa ike preposition ahụ ma na-adịkwa nghọta n’Igbo.
- source_word: ἐλπίδα
  choice: olileanya
  rationale: Ọ bụ ihe nnara nke ngwaa ἀπεκδεχόμεθα; “olileanya” bụ okwu Igbo doro anya ma kwesị ekwesị.
- source_word: δικαιοσύνης
  choice: ezi omume
  rationale: N’ebe a, δικαιοσύνη nwere echiche ịbụ onye ziri ezi n’ihu Chineke; “ezi omume” bụ nsụgharị a na-aghọta nke ọma, ebe e debere echiche ọzọ nke ikpe ziri ezi n’ala ala peeji.
- source_word: ἀπεκδεχόμεθα
  choice: anyị ji agụụ na-echere
  rationale: Ngwaa a na-egosi ichere ihe nke ukwuu na atụmanya siri ike, ọ bụghị naanị ichere nkịtị.
theological_decisions:
- issue: Onye πνεύματι na-ezo aka na ya
  choice: Mmụọ Nsọ
  alternative: mmụọ mmadụ
  rationale: Ihe gbara amaokwu a gburugburu, karịchaa ọdịiche dị n’etiti Mmụọ, anụ ahụ, na iwu, na-akwado na ọ bụ Mmụọ Nsọ ka Pọl na-ekwu maka ya.
- issue: Ihe ἐλπίδα δικαιοσύνης pụtara
  choice: olileanya nke ezi omume
  alternative: ezi omume a na-atụ anya ya; olileanya ezi omume na-eweta
  rationale: Nsụgharị ahụ na-edobe njikọ genitive nke Grik n’enweghị ikpebi kpamkpam ma ọ bụ ezi omume ahụ bụ ihe a na-atụ anya ya, ihe olileanya ahụ metụtara, ma ọ bụ isi iyi ya.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E debere usoro arụmụka Pọl na “N’ihi na,” tinyekwa ntakịrị nkwusi ike dị n’ichere nke ukwuu site n’okwu “ji agụụ na-echere.”
