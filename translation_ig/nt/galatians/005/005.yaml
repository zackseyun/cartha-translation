  source_fidelity: 'Nsụgharị a na-anọchi anya akụkụ niile nke Grik n’ụzọ kwesịrị ntụkwasị obi: ἡμεῖς γάρ (“N’ihi na ... anyị”), πνεύματι (“site na Mmụọ Nsọ”), ἐκ πίστεως (“site n’okwukwe”), ἐλπίδα δικαιοσύνης (“olileanya nke ezi omume”), na ἀπεκδεχόμεθα (“ji agụụ na-echere”). “Site na” na nkebiokwu abụọ ahụ na-edobe, n’enweghị mgbagwoju anya, ọrụ dative na ἐκ dị iche iche n’asụsụ Igbo. Ịkpọ πνεύματι “Mmụọ Nsọ” dabara nke ọma na gburugburu Galetia 5, ebe ọ na-ekwughi ihe karịrị ihe ederede na gburugburu ya kwadoro.'
