  terminology: “Mmụọ Nsọ,” “okwukwe,” “olileanya,” na “ezi omume” bụ okwu Igbo a na-ahụkarị ma dabara n’ọnọdụ Pọl. “Ezi omume” na-edobe obosara δικαιοσύνη; ihe odide ala peeji c na-edobe “ikpe ziri ezi” dịka nhọrọ ọzọ ma na-ekwupụta n’enweghị ịmanye otu nkọwa nke genitive ahụ.
