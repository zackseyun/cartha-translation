  variant: Standard Igbo
source:
  edition: SBLGNT
  text: μὴ γινώμεθα κενόδοξοι, ἀλλήλους προκαλούμενοι, ἀλλήλοις φθονοῦντες.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/026.yaml
  text: Let us not become conceited[a], provoking one another, envying one another.
translation:
  language: ig
  text: Ka anyị ghara ịghọ ndị na-achọ otuto efu[a], na-ama ibe anyị aka, na-enwere ibe anyị anyaụfụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị mpako n’efu.” Okwu Grik ahụ na-ekwu maka ọchịchọ otuto efu ma ọ bụ echiche na mmadụ dị mkpa karịa ndị ọzọ n’enweghị ezi ihe ndabere.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ γινώμεθα
  choice: Ka anyị ghara ịghọ
  rationale: Nke a na-egosipụta agbamume e nyere mmadụ niile, ‘ka anyị ghara,’ ma na-echekwa echiche nke γίνομαι bụ ịghọ ihe ma ọ bụ ịmalite ịdị otu ahụ.
- source_word: κενόδοξοι
  choice: ndị na-achọ otuto efu
  rationale: Nkebiokwu a na-egosipụta ọchịchọ maka ebube na-enweghị isi ma ọ bụ ibuli onwe elu. Ọ bụ Igbo doro anya nke na-echekwa oyiyi dị n’okwu Grik.
- source_word: ἀλλήλους / ἀλλήλοις
  choice: ibe anyị
  rationale: Nke a bụ ụzọ Igbo sitere n’okike si egosipụta omume ndị mmadụ na-emere ibe ha.
- source_word: προκαλούμενοι
  choice: na-ama ibe anyị aka
  rationale: Okwu Grik nwere echiche nke ịkpọ mmadụ ka ọ zaghachi ma ọ bụ ịkpali esemokwu. ‘Ịma aka’ na-echekwa echiche sara mbara nke ịma mmadụ aka, kama ime ka ọ bụrụ naanị ịkpasu iwe.
- source_word: φθονοῦντες
  choice: na-enwere ibe anyị anyaụfụ
  rationale: Nke a na-egosipụta n’ụzọ doro anya inwe anyaụfụ n’ebe onye ọzọ nọ, ma na-echekwa nhazi yiri ibe ya nke participle abụọ ahụ.
theological_decisions:
- issue: Mmekọrịta participle abụọ ahụ na agbamume bụ isi
  choice: 'E debere ha dịka omume ndị na-eso ịchọ otuto efu: ‘na-ama ibe anyị aka, na-enwere ibe anyị anyaụfụ.’'
  alternative: 'A pụrụ ịghọta ha dịka mgbasawanye nke iwu ahụ: ka anyị ghara ịchọ otuto efu site n’ịma ibe anyị aka na inwe anyaụfụ.'
  rationale: Nhazi Grik na-egosi κενόδοξοι dịka ihe bụ isi e kwuru banyere isiokwu ahụ, ebe participle abụọ ahụ na-akọwa omume ndị na-eso ya. Nsụgharị ahụ ahapụghị njikọ ezi uche dị n’etiti ha n’ụzọ ga-emechi nghọta ọzọ.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị mfe nghọta ma nwee nsọpụrụ. ‘Otuto efu’ na-eme ka oyiyi okwu Grik pụta ìhè; ‘na-ama ibe anyị aka’ na ‘na-enwere ibe anyị anyaụfụ’ na-echekwa nhazi ahịrịokwu na myiri nke omume abụọ ahụ.
