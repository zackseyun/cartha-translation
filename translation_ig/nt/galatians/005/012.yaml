  yaml_path: translation/nt/galatians/005/012.yaml
  text: I wish those who are upsetting you would even mutilate themselves[a][b].
translation:
  language: ig
  text: A sị nnọọ na ndị na-akpaghasị unu[b] ga-egbipụkwa onwe ha![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n’ụzọ dabara n’okwu Gris karịa, “ga-ebipụ onwe ha.” N’ihi na okwu a gbara gburugburu bụ banyere ibi úgwù, o yikarịrị ka Pọl na-ekwu ka ha gaa karịa ibi úgwù, merụọ onwe ha nke ukwuu, ma ọ bụ bepụ amụ ha.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ndị na-enye unu nsogbu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὄφελον
  choice: A sị nnọọ na
  rationale: Nke a bụ ụzọ Igbo dị ndụ si ekwupụta ọchịchọ siri ike, nke kwekọrọ n’ike ọchịchọ dị na ὄφελον.
- source_word: καὶ
  choice: -dị-
  rationale: Mgbakwunye ‘dị’ n’ime ngwaa na-egosi ‘ọbụna,’ na-eme ka okwu Pọl rịgoro n’ike site n’ibibi úgwù ruo n’ịkpụpụ akụkụ ahụ́.
- source_word: ἀποκόψονται
  choice: ga-egbudị onwe ha akụkụ ahụ́
  rationale: Nke a na-egosi ịkpụpụ ma ọ bụ imerụ akụkụ ahụ́ nke ukwuu, dị ka ihe gbara okwu banyere ibi úgwù gburugburu si kwado, ma ọ naghị eme ka isi okwu ahụ bụrụ naanị otu ụdị mmerụ ahụ́ kpọmkwem.
- source_word: οἱ ἀναστατοῦντες
  choice: ndị na-akpaghasị
  rationale: ‘Na-akpaghasị’ na-egosi na ndị ahụ na-akpata ọgba aghara ma na-enye ndị kwere ekwe nsogbu.
- source_word: ὑμᾶς
  choice: unu
  rationale: ‘Unu’ na-edobe onye nke abụọ n’ọnụọgụ ọtụtụ nke okwu Gris.
theological_decisions:
- issue: Ihe ọchịchọ Pọl pụtara n’ihe gbasara ibi úgwù
  choice: A sụgharịrị ya dịka ọchịchọ ilu dị nkọ ka ndị na-akwado ibi úgwù gaa n’ihu ruo n’ịkpụpụ akụkụ ahụ́ ha.
  alternative: Pọl nwere ike ịbụ na ọ chọrọ ka ha kewapụ onwe ha n’ọgbakọ.
  rationale: Ihe a na-ekwu ozugbo banyere ibi úgwù na-akwado egwuregwu okwu gbasara ịkpụ ahụ́; ma ndetu ala na-echekwa nghọta nkịtị nke nwere ike ịpụta ‘ikewapụ onwe ha.’
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe nke oge a, dị mfe nghọta ma dị ugwu. ‘A sị nnọọ na’ na-edobe ọchịchọ siri ike, ebe ‘ga-egbudị onwe ha akụkụ ahụ́’ na-edobe ịdị nkọ nke okwu Pọl n’enweghị ime ka naanị otu nkọwa bụrụ iwu.
