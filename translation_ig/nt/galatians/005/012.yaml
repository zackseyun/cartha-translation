revisions:
- from: A sị nnọọ na ndị na-akpaghasị unu[b] ga-egbudị onwe ha akụkụ ahụ́![a]
  to: A sị nnọọ na ndị na-akpaghasị unu[b] ga-egbipụkwa onwe ha![a]
  rationale: The revision replaces the unnatural phrase “ga-egbudị onwe ha akụkụ ahụ́” with “ga-egbipụkwa onwe ha,” an idiomatic Standard Igbo rendering that carries both the literal cutting-off wording and the intensified force of καί through -kwa. The note retains the likely allusion to self-mutilation/castration in the circumcision controversy without presenting that contextual inference as the only possible lexical sense.
