id: GAL.5.6
reference: Galatians 5:6
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐν γὰρ Χριστῷ Ἰησοῦ οὔτε περιτομή τι ἰσχύει οὔτε ἀκροβυστία, ἀλλὰ πίστις δι’ ἀγάπης ἐνεργουμένη.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/006.yaml
  text: For in Messiah Jesus neither circumcision nor uncircumcision counts for anything[c][b][a], but faith working through love.
translation:
  language: ig
  text: N’ihi na n’ime Mesaịa[a] Jizọs, ibi úgwù enweghị uru ọ bụla, ebighị úgwù enweghịkwa uru ọ bụla; kama, okwukwe[b] nke na-arụ ọrụ[c] site n’ịhụnanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “Kraịst Jizọs.” Okwu Grik bụ Χριστός, utu aha nke pụtara “Mesaịa” ma ọ bụ “Onye E Tere Mmanụ.”
    reason: alternative_reading
  - marker: b
    text: Okwu Grik πίστις nwekwara ike ịpụta “ntụkwasị obi” ma ọ bụ “ikwesị ntụkwasị obi.”
    reason: lexical_alternative
  - marker: c
    text: A pụkwara ịsụgharị ya “okwukwe na-arụsi ọrụ ike site n’ịhụnanya,” “okwukwe na-egosipụta onwe ya site n’ịhụnanya,” ma ọ bụ “okwukwe a na-eme ka ọ rụọ ọrụ site n’ịhụnanya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν γὰρ Χριστῷ Ἰησοῦ
  choice: N’ihi na n’ime Mesaịa Jizọs
  rationale: “N’ihi na” na-egosi na ahịrịokwu a na-enye ihe ndabere maka okwu bu ya ụzọ. “N’ime” na-edobe asụsụ Pọl banyere ịdị n’ime Mesaịa, ebe “Mesaịa” na-egosipụta Χριστός dị ka utu aha.
- source_word: περιτομή ... ἀκροβυστία
  choice: ibi úgwù ... ebighị úgwù
  rationale: Okwu ndị a bụ ụzọ doro anya, kwekọrọ n’Igbo, isi gosi omume ibi úgwù na ọnọdụ nke onye a na-ebighị úgwù; ha na-edobekwa ntụnyere Pọl n’etinyeghị nkọwa okpukpe ọzọ.
- source_word: τι ἰσχύει
  choice: abaghị uru ọ bụla
  rationale: N’ebe a, ἰσχύει na-ekwu banyere ịdị mkpa, uru, ma ọ bụ ike ihe nwere, ọ bụghị naanị ike anụ ahụ. Nkebiokwu Igbo a na-egosi na ọnọdụ abụọ ahụ enweghị uru n’ihe Pọl na-ekwu.
- source_word: πίστις
  choice: okwukwe
  rationale: “Okwukwe” bụ okwu Igbo a na-ejikarị sụgharịa πίστις; ihe odide ala peeji na-echekwa echiche ndị ọzọ nke okwu ahụ pụrụ inwe, dịka ntụkwasị obi ma ọ bụ ikwesị ntụkwasị obi.
- source_word: δι’ ἀγάπης
  choice: site n’ịhụnanya
  rationale: διά ya na genitive na-egosi ụzọ ma ọ bụ ihe e ji eme ihe. “Site n’ịhụnanya” na-edobe njikọ ahụ n’etinyeghị nkọwa karịrị ihe Grik kwuru.
- source_word: ἐνεργουμένη
  choice: nke na-arụ ọrụ
  rationale: Nkebiokwu a na-egosipụta okwukwe dị ka ihe na-arụ ọrụ ma ọ bụ na-arụpụta ihe. Nsụgharị a dị nkenke ma ghara ikpebi kpamkpam ma ọdịdị participle ahụ bụ middle ka ọ bụ passive.
theological_decisions:
- issue: Nsụgharị Χριστός
  choice: Mesaịa
  alternative: Kraịst
  rationale: Χριστός bụ utu aha nke pụtara onye e tere mmanụ. “Mesaịa” na-eme ka uru utu aha ahụ pụta ìhè, ebe a na-edowe “Kraịst” dịka nsụgharị ọzọ a maara nke ọma.
- issue: Ihe πίστις pụtara
  choice: okwukwe
  alternative: ntụkwasị obi; ikwesị ntụkwasị obi
  rationale: “Okwukwe” bụ nhọrọ bụ isi, ma okwu Grik ahụ nwere ike ịgụnye ntụkwasị obi ma ọ bụ ikwesị ntụkwasị obi. Ihe odide ala peeji na-echekwa obosara okwu ahụ n’enweghị idozi esemokwu ahụ n’ime amaokwu.
- issue: Olu na nghọta nke ἐνεργουμένη
  choice: okwukwe nke na-arụ ọrụ site n’ịhụnanya
  alternative: okwukwe nke na-arụsi ọrụ ike site n’ịhụnanya; okwukwe nke ịhụnanya na-eme ka ọ rụọ ọrụ; okwukwe nke na-egosipụta onwe ya site n’ịhụnanya
  rationale: Participial form ahụ nwere ike ikwe ka a ghọta ya n’ụzọ na-egosi okwukwe na-arụ ọrụ ma ọ bụ nke a na-eme ka ọ rụọ ọrụ. Isi nsụgharị na-edobe okwu ahụ n’ụzọ dị mfe, ebe ihe odide ala peeji na-echekwa nhọrọ ndị ọzọ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta mee nsụgharị ahụ. A họọrọ “ibi úgwù/ebighị úgwù” maka ntụnyere doro anya, ma jiri “n’ime Mesaịa Jizọs” chekwaa asụsụ njikọ Pọl. Ihe odide ala peeji na-edobe nhọrọ okwu na mgbagwoju anya nke Grik n’enweghị itinye ozizi otu ụka.
