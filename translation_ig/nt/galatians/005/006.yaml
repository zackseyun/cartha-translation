revisions:
- from: N’ihi na n’ime Mesaịa[a] Jizọs, ma ibi úgwù ma ebighị úgwù abaghị uru ọ bụla; kama ihe dị mkpa bụ okwukwe[b] nke na-arụ ọrụ site n’ịhụnanya.[c]
  to: N’ihi na n’ime Mesaịa[a] Jizọs, ibi úgwù enweghị uru ọ bụla, ebighị úgwù enweghịkwa uru ọ bụla; kama, okwukwe[b] nke na-arụ ọrụ[c] site n’ịhụnanya.
  rationale: The revision removes the small interpretive addition, expresses the Greek οὔτε … οὔτε contrast explicitly in natural Igbo, retains the source ambiguity concerning faith’s activity, and places the related footnote at its proper phrase anchor.
