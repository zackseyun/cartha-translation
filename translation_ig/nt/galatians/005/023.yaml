  text: gentleness[a], self-control[b]; against such things there is no law.
translation:
  language: ig
  text: ịdị nwayọọ, na njide onwe onye; ọ dịghị iwu na-emegide ihe ndị dị otu a.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ọ dịghị iwu na-emegide ndị dị otu a.” Otú ọ dị, n'ebe a, o yikarịrị ka okwu Grik ahụ ọ na-ezo aka n'àgwà ọma ndị e depụtara, ọ bụghị n'ahụ ndị na-egosipụta ha.
    reason: lexical_alternative
lexical_decisions:
- source_word: πραΰτης
  choice: ịdị nwayọọ
  rationale: N'ime ndepụta omume ọma a, okwu a na-egosi mmụọ dị nro, dị umeala n'obi, nke na-adịghị emeso mmadụ ihe ike. “Ịdị nwayọọ” bụ okwu Igbo doro anya ma dị ugbu a nke na-ejigide echiche ahụ.
- source_word: ἐγκράτεια
  choice: njide onwe onye
  rationale: Okwu a pụtara ikike mmadụ nwere ịchị ọchịchọ na mkpali ya. “Njide onwe onye” na-ekwupụta echiche ahụ n'ụzọ nkịtị ma doo anya n'Igbo.
- source_word: κατὰ τῶν τοιούτων
  choice: na-emegide ihe ndị dị otu a
  rationale: Ọ bụ ezie na τοιούτων nwere ike izo aka n'ụdị mmadụ ma ọ bụ n'ụdị ihe, ihe gbara ya gburugburu na-egosi nke ọma na ọ na-alaghachi n'àgwà ọma ndị e depụtara dị ka mkpụrụ nke Mmụọ Nsọ.
- source_word: νόμος
  choice: iwu
  rationale: E dere νόμος n'enweghị edemede na Grik; ya mere “iwu” na-echekwa okwu ahụ ka ọ ghara ịkọwa ya naanị dị ka Iwu Mosis, ma na-ahapụkwa njikọ ya na arụmụka Pọl banyere Iwu ahụ.
theological_decisions:
- issue: Oke ihe νόμος na-ezo aka na ya n'okwu Pọl
  choice: iwu
  alternative: Iwu ahụ, ya bụ Iwu Mosis
  rationale: Akwụkwọ Ndị Galeshia na-ekwu ọtụtụ ihe banyere Iwu Mosis, ma ụdị okwu Grik a na-enweghị edemede nwere ike ịbụ nkwupụta sara mbara na ọ dịghị iwu na-emegide àgwà ọma ndị a. Nsụgharị a na-echekwa ma ịdị sara mbara nke okwu ahụ ma njikọ ya na Iwu Mosis.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. Nhazi “ọ dịghị iwu na-emegide…” na-ada nke ọma n'Igbo ma na-echekwa ike nke nkwupụta Grik ahụ.
