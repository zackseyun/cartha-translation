  text: ἡ πεισμονὴ οὐκ ἐκ τοῦ καλοῦντος ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/008.yaml
  text: This persuasion is not from the one who calls you[a].
translation:
  language: ig
  text: Nkwenye a esighị n’aka onye ahụ na-akpọ unu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Mmetụta a esighị n’aka onye ahụ na-akpọ unu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πεισμονὴ
  choice: Nkwenye
  rationale: Aha okwu Grik a dị ụkọ ma na-ezo aka ná nkwenye ma ọ bụ ọnọdụ mmadụ ịbụ onye e mere ka o kwenye. “Nkwenye” na-edobe ọdịdị aha okwu ahụ, n’agbanyeghị na ọ pụkwara ịpụta mmetụta nke na-eme ka mmadụ kwenye.
- source_word: ἐκ
  choice: esighị n’aka
  rationale: ἐκ na-egosi isi mmalite. N’Igbo, “isi n’aka” na-egosi nke ọma na nkwenye ahụ adịghị esi n’aka onye na-akpọ ha.
- source_word: τοῦ καλοῦντος ὑμᾶς
  choice: onye ahụ na-akpọ unu
  rationale: Nke a na-edobe participle ahụ dị ka okwu na-anọchi aha ma chekwaa ihe ọ na-egosi banyere ịkpọ oku na-aga n’ihu, n’etinyeghị “Chineke” kpọmkwem n’ebe Grik na-etinyeghị ya.
- source_word: οὐκ
  choice: esighị
  rationale: A gbakwụnyere ngọnarị ahụ n’ime ngwaa Igbo n’ụzọ ebumpụta ụwa, ka nkwupụta Pọl na-agọnahụ isi mmalite ahụ wee dịgide.
theological_decisions:
- issue: Onye “onye ahụ na-akpọ unu” bụ
  choice: E dere ya n’ozuzu dịka “onye ahụ na-akpọ unu,” n’etinyeghị “Chineke” kpọmkwem.
  alternative: “Chineke onye na-akpọ unu” dịka nkọwa agbakwunyere.
  rationale: Ihe gbara amaokwu ahụ gburugburu na-egosi nke ukwuu na ọ bụ Chineke, ma Grik n’onwe ya ji participle nke ghọrọ aha mee ihe kama ịkpọ “Chineke” aha. Nsụgharị ahụ na-ahapụ onye a na-ekwu maka ya dịka Pọl si kwuo ya.
translation_notes:
  register: Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E ji “nkwenye” mee ka aha okwu Grik ahụ dị ụkọ ghara ịghọ nkọwa sara mbara; ihe odide ala ala na-edobe “mmetụta” dịka ụzọ ọzọ nwere ike isi ghọta ya.
