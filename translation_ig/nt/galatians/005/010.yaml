id: GAL.5.10
reference: Galatians 5:10
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐγὼ πέποιθα εἰς ὑμᾶς ἐν κυρίῳ ὅτι οὐδὲν ἄλλο φρονήσετε· ὁ δὲ ταράσσων ὑμᾶς βαστάσει τὸ κρίμα, ὅστις ⸀ἐὰν ᾖ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/010.yaml
  text: I am confident in the Lord about you[a], that you will think nothing else; but the one who is troubling you will bear the judgment[b], whoever he may be.
translation:
  language: ig
  text: Enwere m ntụkwasị obi n’ime Onyenwe anyị banyere unu na unu agaghị enwe echiche ọzọ[a]. Ma onye ahụ na-enye unu nsogbu ga-ebu ikpe ahụ, onye ọ bụla ọ bụ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “unu agaghị anabata echiche ọzọ.” Okwu Grik a nwere ike ịpụta iche echiche n’ozuzu, inwe otu uche, ma ọ bụ ijide otu echiche.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “n’agbanyeghị onye ọ bụ.”
    reason: alternative_reading
lexical_decisions:
- source_word: πέποιθα
  choice: Ekwenyesiri m ike
  rationale: Oge perfect nke πείθω na-egosi ọnọdụ ntụkwasị obi siri ike nke ka dị ugbu a; okwu a bụ ụzọ Igbo doro anya ma dịkwa mma isi kwupụta ya.
- source_word: εἰς ὑμᾶς
  choice: banyere unu
  rationale: N’akwụkwọokwu a, εἰς na-ezo aka n’ebe ntụkwasị obi Pọl gbasara ndị Galeshia nọ; ‘banyere unu’ bụ Igbo nkịtị nke na-ezere ime ka ọ bụrụ na ntụkwasị obi ya sitere n’aka ha.
- source_word: ἐν κυρίῳ
  choice: n’ime Onyenwe anyị
  rationale: Nke a na-echekwa okwu Pọl a na-ahụkarị, nke na-egosi na Onyenwe anyị bụ ebe ma ọ bụ ntọala ntụkwasị obi ahụ.
- source_word: οὐδὲν ἄλλο φρονήσετε
  choice: unu agaghị enwe echiche ọzọ
  rationale: φρονέω nwere ike ịpụta iche echiche, inwe otu uche, ma ọ bụ ijide otu echiche. Nsụgharị a bụ Igbo dị mma nke na-echekwa nghọta ahụ n’ebughị ụzọ kpebie kpọmkwem ụdị echiche a na-ekwu maka ya.
- source_word: ὁ δὲ ταράσσων ὑμᾶς
  choice: Ma onye ahụ na-enye unu nsogbu
  rationale: Participu nke ugbu a na-akọwa onye na-akpaghasị ma na-enye ọgbakọ ahụ nsogbu ugbu a.
- source_word: βαστάσει
  choice: ga-ebu
  rationale: βαστάζω pụtara ibu ma ọ bụ ịchị ihe; ‘ga-ebu’ na-echekwa ihe atụ ahụ ma ghara ịkọwapụta ụdị ntaramahụhụ ahụ karịa ihe ederede kwuru.
- source_word: τὸ κρίμα
  choice: ikpe ahụ
  rationale: κρίμα nwere ike ịpụta ikpe, mkpebi ikpe, ma ọ bụ ihe si n’ikpe pụta. ‘Ikpe ahụ’ na-echekwa obosara na mgbagwoju anya nke okwu Grik ahụ.
- source_word: ὅστις ἐὰν ᾖ
  choice: onye ọ bụla ọ bụ
  rationale: Nrụpụta a na-egosi na aha ma ọ bụ ọnọdụ onye na-enye nsogbu ahụ adịghị agbanwe ịdọ aka ná ntị ahụ.
theological_decisions:
- issue: Ụdị ntụkwasị obi Pọl nwere banyere ndị Galeshia
  choice: Pọl nwere ntụkwasị obi banyere uche ha n’ọdịnihu, ntụkwasị obi ahụ dịkwa n’ime Onyenwe anyị.
  alternative: Iwere ya dị ka nkwa na-enweghị ọnọdụ na ndị Galeshia niile aghaghị ịnọgide, ma ọ bụ dị ka naanị olileanya mmadụ na-enweghị ntọala n’ime Onyenwe anyị.
  rationale: Ederede ahụ jikọtara ntụkwasị obi Pọl na ‘n’ime Onyenwe anyị,’ ma jiri okwu ọdịnihu kwuo ihe ọ na-atụ anya ya. Nsụgharị ahụ na-echekwa esemokwu echiche abụọ a n’emeghị ka otu gafee ihe ederede kwuru.
- issue: Ihe τὸ κρίμα pụtara
  choice: Ikpe ga-adakwasị onye na-enye nsogbu ahụ, ma akọwaghị kpọmkwem ụdị ikpe ahụ.
  alternative: Ịkọwa ya ozugbo dị ka ikpe ọmụma ebighị ebi, ma ọ bụ naanị dịka ntaramahụhụ ọgbakọ.
  rationale: κρίμα sara mbara karịa otu ụdị ikpe a kapịrị ọnụ; amaokwu a anaghị ekwu ma ọ bụ ikpe ikpeazụ, ntaramahụhụ, ma ọ bụ usoro ọzọ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta, sụgharịa ya. E chekwara okwu Pọl ‘n’ime Onyenwe anyị,’ ihe atụ nke ‘ibu ikpe,’ na obosara nke okwu ‘ikpe’ n’etinyeghị nkọwa okpukpe karịrị ihe amaokwu ahụ kwuru.
