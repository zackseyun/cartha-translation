    text: 'A pụkwara ịsụgharị ya: “Ọ bụrụ na anyị na-adị ndụ n''ime Mmụọ Nsọ, ka anyị na-agbasokwa usoro nke Mmụọ Nsọ.”'
    reason: lexical_alternative
  revision_rationale: The revision removes the added idea of correctness, renders στοιχῶμεν with the more specific sense of following an ordered course or keeping in step, and maintains the Greek conditional structure and repeated reference to the Spirit. The footnote preserves the viable locative rendering of πνεύματι (“n'ime Mmụọ Nsọ”) without presenting it as the only sense.
