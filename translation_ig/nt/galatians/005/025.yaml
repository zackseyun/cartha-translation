  text: εἰ ζῶμεν πνεύματι, πνεύματι καὶ στοιχῶμεν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/025.yaml
  text: If we live by the Spirit[a], let us also walk by the Spirit.
translation:
  language: ig
  text: Ọ bụrụ na anyị na-adị ndụ site na Mmụọ Nsọ[a], ka anyị na-agbasokwa usoro nke Mmụọ Nsọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ịsụgharị ya: “Ọ bụrụ na anyị na-adị ndụ n''ime Mmụọ Nsọ, ka anyị na-agbasokwa usoro nke Mmụọ Nsọ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ
  choice: Ọ bụrụ na
  rationale: Nke a na-edobe ụdị ọnọdụ dị n'okwu Grik, kama ịgbanwe ya ka ọ bụrụ ‘Ebe ọ bụ na,’ nke ga-akọwapụta ike okwu ahụ karịa ka isi mmalite mere.
- source_word: ζῶμεν
  choice: anyị na-adị ndụ
  rationale: Ọ na-egosi ndụ na-aga n'ihu nke sitere n'aka Mmụọ Nsọ, ọ bụghị naanị ịdị ndụ n'anụ ahụ.
- source_word: πνεύματι
  choice: site na Mmụọ Nsọ
  rationale: Dative a nwere ike igosi onye ma ọ bụ ihe ndụ si n'aka ya abịa. N'ọnọdụ Galetia 5, ‘Mmụọ’ na-ezo aka n'ụzọ siri ike n'ebe Mmụọ Nsọ nọ; ‘site na’ na-egosipụta echiche nke isi iyi ma ọ bụ onye na-eme ka ndụ dị.
- source_word: καὶ
  choice: na-esokwa
  rationale: '‘-sokwa’ na-eweta ike okwu nke ‘kwa/ọzọ’: ndụ sitere na Mmụọ kwesịrị ịpụta n''omume kwekọrọ na ya.'
- source_word: στοιχῶμεν
  choice: ka anyị na-esokwa ... na-aga n'ụzọ kwesịrị ekwesị
  rationale: Ngwaa a pụtara ịga n'ahịrị, iso usoro, ma ọ bụ ime ka nzọụkwụ kwekọọ. Nsụgharị a na-edobe echiche njem nke Pọl ma na-egosipụta kpọmkwem ịdị na-agbaso nduzi Mmụọ karịa okwu sara mbara dịka ‘ịga ije.’
theological_decisions:
- issue: Onye πνεύματι na-ezo aka na ya
  choice: Mmụọ Nsọ
  alternative: mmụọ mmadụ
  rationale: N'ime Galetia 5, ntụnyere dị n'etiti anụ ahụ na Mmụọ na-egosi na Pọl na-ekwu banyere Mmụọ Nsọ. Ịkpọ ya ‘Mmụọ Nsọ’ na-eme ka nke a doo anya n'Igbo, ebe mkpụrụedemede ukwu naanị ya anaghị akọwa onye a na-ekwu banyere ya nke ọma.
- issue: Mmekọrịta dị n'etiti ndụ na omume
  choice: A hapụrụ ya dịka ọnọdụ na-akpali ndụ kwekọrọ ekwekọ
  alternative: Ịsụgharị εἰ dịka ‘Ebe ọ bụ na’ ma mee ka nkwupụta ahụ bụrụ eziokwu e kwadoro
  rationale: ‘Ọ bụrụ na’ na-echekwa usoro Grik na esemokwu dị n'ịkpọ ndị natara ndụ site na Mmụọ ka ha bie ndụ kwekọrọ na ya.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta mee ihe. ‘Na-esokwa ... na-aga n'ụzọ kwesịrị ekwesị’ na-ezere ntụgharị nkịtị nke ‘walk’ nke nwere ike ịda ka naanị ije ụkwụ, ma na-echekwa echiche στοιχέω nke iso usoro ma ọ bụ ime ka nzọụkwụ kwekọọ.
