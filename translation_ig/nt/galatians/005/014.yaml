  text: ὁ γὰρ πᾶς νόμος ἐν ἑνὶ λόγῳ ⸀πεπλήρωται, ἐν τῷ· Ἀγαπήσεις τὸν πλησίον σου ὡς ⸀σεαυτόν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/014.yaml
  text: 'For the whole law is fulfilled in one statement: “You shall love your neighbor as yourself.”[a][b]'
translation:
  language: ig
  text: 'N’ihi na e mezuwala iwu ahụ dum n’otu nkwupụta: “Ị ga-ahụ onye agbata obi gị n’anya dịka onwe gị.”[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’otu okwu.” N’asụsụ Gris, e kwuru ya n’ụzọ nkịtị “n’otu okwu”; n’ebe a, ọ pụtara otu okwu e kwuru, ma ọ bụ otu iwu.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “a mezuworị”; ma ọ bụ n’ụzọ nkọwa, “a chịkọtara.” Ngwaa Gris ahụ pụtara “e mezuwala” ma ọ bụ “a mezuworị”; ọ nwekwara ike igosi na iwu ahụ ruru mmezu ya n’iwu a.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ γὰρ
  choice: N’ihi na
  rationale: γάρ na-enye ihe kpatara ma ọ bụ nkọwa nke ndụmọdụ bu ụzọ; “N’ihi na” na-egosipụta njikọ ahụ nke ọma n’Igbo.
- source_word: πᾶς νόμος
  choice: iwu ahụ dum
  rationale: Akụkụ okwu ahụ na-ekwu banyere iwu dịka otu ihe zuru ezu; “iwu ahụ dum” na-echekwa ike nke πᾶς na article ahụ.
- source_word: ἐν ἑνὶ λόγῳ
  choice: n’otu okwu a
  rationale: λόγος n’ebe a pụtara otu okwu e kwuru, nkwupụta, ma ọ bụ iwu; “otu okwu a” bụ okwu Igbo e ji akọwa otu okwu/nkwupụta zuru ezu, ọ bụghị naanị otu mkpụrụokwu.
- source_word: πεπλήρωται
  choice: e mezuwala
  rationale: Perfect passive ahụ na-egosi na e mezuola iwu ahụ ma ọnọdụ nke mmezu ahụ ka dị ugbu a. “e mezuwala” na-echekwa passive na echiche mmezu ahụ.
- source_word: Ἀγαπήσεις
  choice: Ị ga-ahụ … n’anya
  rationale: Future indicative a sitere n’iwu dị na Levitikọs 19:18 ma na-arụ ọrụ dịka iwu; ụdị “Ị ga-…” na-echekwa ọdịdị okwu e hotara.
- source_word: τὸν πλησίον σου
  choice: onye agbata obi gị
  rationale: N’ọnọdụ omume a, πλησίον pụtara onye agbata obi; nsụgharị a bụ nke doro anya ma kwekọọ n’ebe e si hota ya.
- source_word: ὡς σεαυτόν
  choice: dịka onwe gị
  rationale: Nke a na-echekwa ntụnyere doro anya dị n’asụsụ Gris.
theological_decisions:
- issue: Ihe okwu Pọl banyere njikọ iwu ahụ na iwu ịhụnanya pụtara
  choice: Iwu ahụ dum na-enweta mmezu ya n’iwu ịhụ onye agbata obi n’anya.
  alternative: Iwu ahụ dum bụ naanị ihe a chịkọtara n’iwu a.
  rationale: πληρόω na-ekwusi ike na mmezu karịa nanị nchịkọta. Nsụgharị ahụ ahapụghị echiche nchịkọta kpamkpam, ma ọ naghị ebelata okwu Pọl ma ọ bụ tinye nkwubi okwu gbasara nkà mmụta okpukpe nke ederede ahụ na-ekwughị.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji “okwu” n’echiche nke nkwupụta ma kọwaa nghọta ọzọ na ndetu ala peeji. E chekwara ike nke perfect passive na πεπλήρωται site na “e mezuwala.”
