  variant: Standard Igbo
source:
  edition: SBLGNT
  text: μαρτύρομαι δὲ πάλιν παντὶ ἀνθρώπῳ περιτεμνομένῳ ὅτι ὀφειλέτης ἐστὶν ὅλον τὸν νόμον ποιῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/003.yaml
  text: And I testify again to every man who receives circumcision that he is obligated to keep the whole law[a][b][c].
translation:
  language: ig
  text: Ana m agba akaebe ọzọ nye onye ọ bụla na-anabata ibi úgwù[a] na ọ nọ n’okpuru ibu ọrụ[b] idebe Iwu ahụ dum.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịtụgharị ya, “onye a na-ebi úgwù” ma ọ bụ “onye kwere ka e bie ya úgwù.” Okwu Grik ahụ nwere ike ịpụta nke ọ bụla n’ime ha; n’ọnọdụ a, ọ na-elekwasị anya n’onye na-anabata ibi úgwù.
    reason: alternative_reading
  - marker: b
    text: N’ụzọ nkịtị, “ọ bụ onye ji ụgwọ”; ya bụ, ọ nọ n’okpuru ibu ọrụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: μαρτύρομαι
  choice: Ana m ekwupụta
  rationale: N’ebe a, okwu Grik a bụ nkwupụta siri ike nke onye na-ekwu ji onwe ya akwado. “Ana m ekwupụta” na-enye echiche ahụ n’Igbo dị ugbu a n’etinyeghị nkọwa dị ka “Ana m adọ aka ná ntị.”
- source_word: δὲ πάλιν
  choice: -kwa ọzọ
  rationale: “-kwa” na-ejikọta amaokwu a nwayọọ na nke bu ya ụzọ, “ọzọ” egosikwa nkwughachi ma ọ bụ imesi okwu ike ọzọ.
- source_word: παντὶ ἀνθρώπῳ
  choice: nye onye ọ bụla
  rationale: ἄνθρωπος nwere ike ịpụta mmadụ n’ozuzu ya. “Onye ọ bụla” bụ Igbo eke nke na-echekwa ike nkesa nke otu onye n’otu onye, n’agbanyeghị na ọnọdụ ibi úgwù metụtara ụmụ nwoke.
- source_word: περιτεμνομένῳ
  choice: na-anabata ibi úgwù
  rationale: Nkọwa a na-egosi onye na-ekwe ka e bie ya úgwù n’esemokwu a, ọ bụghị nanị onye e biri úgwù kemgbe ọ bụ nwata. Ọ naghị etinye ebumnobi a na-akọwaghị n’okwu Grik.
- source_word: ὀφειλέτης ἐστίν
  choice: ọ nọ n’okpuru ibu ọrụ
  rationale: Aha Grik ahụ pụtara onye ji ụgwọ ma ọ bụ onye nọ n’okpuru ọrụ. N’Igbo, “ọ nọ n’okpuru ibu ọrụ” na-egosi iwu ọrụ ahụ nke ọma n’enweghị mgbagwoju anya banyere ụgwọ ego.
- source_word: ὅλον τὸν νόμον
  choice: Iwu ahụ dum
  rationale: “Dum” na-echekwa nkwusi okwu Grik ahụ banyere Iwu ahụ n’ozuzu ya, ọ bụghị nanị akụkụ ụfọdụ.
- source_word: ποιῆσαι
  choice: idebe
  rationale: Ọ bụ ezie na isi echiche ποιέω bụ “ime,” mgbe ihe ọ na-ekwu maka ya bụ Iwu, “idebe” bụ Igbo eke maka irube isi n’iwu.
theological_decisions:
- issue: Oke okwu Pọl banyere ibi úgwù na ibu ọrụ idebe Iwu
  choice: Okwu a na-ezo aka n’onye na-anabata ibi úgwù n’esemokwu dị na Galetia, nke na-etinye ya n’okpuru ibu ọrụ idebe Iwu ahụ dum.
  alternative: O nwere ike ịgụnye n’ụzọ sara mbara nwoke ọ bụla e biri úgwù, tinyere ndị Juu e biri úgwù mgbe ha bụ ụmụ ọhụrụ.
  rationale: N’ọnọdụ Galetia 5:2–3, participle περιτεμνομένῳ na-elekwasị anya n’ebe ndị na-atụle ịnakwere ibi úgwù nọ. Nsụgharị ahụ echekwala ihe ọnọdụ a na-egosi ma ọ gbakwụnyeghị kpọmkwem ebumnobi a na-adịghị n’ahịrịokwu Grik.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. “Iwu” malitere na mkpụrụedemede ukwu iji gosi Iwu ahụ a maara nke ọma n’ọnọdụ akwụkwọ ozi a; “dum” na-enye nkwusi okwu nke ὅλον.
