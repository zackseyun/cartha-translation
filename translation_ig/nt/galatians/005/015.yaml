  text: εἰ δὲ ἀλλήλους δάκνετε καὶ κατεσθίετε, βλέπετε μὴ ὑπ’ ἀλλήλων ἀναλωθῆτε.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/015.yaml
  text: But if you bite and devour one another[a], watch out that you are not consumed by one another.
translation:
  language: ig
  text: Ma ọ bụrụ na unu na-atịta ibe unu ma na-eripịa ibe unu, kpacharanụ anya ka ibe unu ghara ikpochapụ unu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰ δὲ
  choice: Ma ọ bụrụ na
  rationale: Nke a na-egosi ọnọdụ ma na-ebute ntakịrị ntụgharị site n’ihe e kwuru tupu ya.
- source_word: ἀλλήλους
  choice: ibe unu
  rationale: Ọ na-egosi omume ndị otu ọgbakọ na-emere ibe ha n’ụzọ na-alaghachi azụ n’etiti ha.
- source_word: δάκνετε
  choice: na-atịta
  rationale: Ọ na-edobe ihe atụ nkịtị nke ịta mmadụ ma na-egosikwa omume na-aga n’ihu ma ọ bụ nke a na-emekarị.
- source_word: κατεσθίετε
  choice: na-eripịa
  rationale: ‘Eripịa’ siri ike karịa iri nkịtị, ya mere ọ na-edobe ike na obi ọjọọ dị n’ihe atụ ahụ.
- source_word: βλέπετε
  choice: kpacharanụ anya
  rationale: Ọ bụ iwu nke na-akpọ ndị na-ege ntị ka ha mụrụ anya n’ihi ihe ize ndụ.
- source_word: μὴ
  choice: ka ... ghara
  rationale: Usoro a na-ebute ịdọ aka ná ntị banyere ihe ọjọọ nwere ike isi na omume ahụ pụta.
- source_word: ὑπ’ ἀλλήλων
  choice: ibe unu
  rationale: N’usoro Igbo a, onye na-eme ihe ahụ ka bụ ndị otu ahụ n’otu n’otu; nkwughachi ‘ibe unu’ na-echekwa echiche nke mbibi ha na-ebibiri onwe ha.
- source_word: ἀναλωθῆτε
  choice: ikpochapụ
  rationale: Okwu a na-egosi iri ihe ruo mgbe ihe ahụ gwụrụ ma ọ bụ ibibi ya kpamkpam; ‘ikpochapụ’ na-echekwa njedebe siri ike nke ihe atụ ahụ.
theological_decisions:
- issue: Ihe atụ nke anụ ọhịa banyere ọgụ n’etiti ndị kwere ekwe
  choice: 'E debere ihe atụ ahụ n’ụzọ pụtara ìhè: ‘na-atịta,’ ‘na-eripịa,’ na ‘ikpochapụ.’'
  alternative: Ịsụgharị ya dịka ‘na-emerụ ibe unu ma na-ebibi ibe unu.’
  rationale: Okwu Pọl ji kpachaara anya bụrụ nke siri ike ma na-ese onyinyo anụmanụ na-alụ ọgụ. Ime ka ọ bụrụ naanị okwu izugbe banyere esemokwu ga-ebelata ịdị ngwa nke ịdọ aka ná ntị ahụ.
translation_notes:
  register: Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. A họọrọ ‘kpacharanụ anya’ maka ịdọ aka ná ntị doro anya, ebe ‘na-atịta ... na-eripịa’ na-edobe ike nke ihe atụ Grik.
