revisions:
- from: Ma ọ bụrụ na unu na-atịta ibe unu ma na-eripịa ibe unu, kpacharanụ anya ka unu ghara ikpochapụ ibe unu.
  to: Ma ọ bụrụ na unu na-atịta ibe unu ma na-eripịa ibe unu, kpacharanụ anya ka ibe unu ghara ikpochapụ unu.
  rationale: 'The sole change is in the final clause: “ka ibe unu ghara ikpochapụ unu” restores the source’s passive-result warning and the agency expressed by ὑπ’ ἀλλήλων, while retaining natural modern Standard Igbo and the force of the metaphor.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T19:29:44Z'
review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately preserves the conditional warning, reciprocal biting and devouring imagery, and the imperative to be vigilant. However, its final clause, “ka unu ghara ikpochapụ ibe unu,” makes “unu” the active destroyers of “ibe unu.” The Greek ἀναλωθῆτε is passive, with ὑπ’ ἀλλήλων marking the reciprocal agents: they are warned not to be consumed/destroyed by one another.'
  naturalness: “Ma ọ bụrụ na unu na-atịta ibe unu ma na-eripịa ibe unu, kpacharanụ anya ...” is natural, clear Standard Igbo. Recasting the last clause as “ka ibe unu ghara ikpochapụ unu” is also idiomatic and makes the agency unambiguous.
  terminology: “na-atịta” and “na-eripịa” suitably retain the escalating animalistic metaphor. “ikpochapụ” conveys ruin/destruction well in the final warning, though it does not repeat the eating image as closely as “eripịa”; it is a safe rendering of ἀναλωθῆτε and preserves the distinction from κατεσθίετε. No theological terminology issue arises.
  issues:
  - severity: medium
    issue: The final clause reverses the Greek passive construction.
    rationale: “ka unu ghara ikpochapụ ibe unu” means “so that you do not destroy one another,” whereas ὑπ’ ἀλλήλων ἀναλωθῆτε means “so that you are not consumed/destroyed by one another.” The revised wording explicitly retains the reciprocal agents and the passive sense.
  revised_text: Ma ọ bụrụ na unu na-atịta ibe unu ma na-eripịa ibe unu, kpacharanụ anya ka ibe unu ghara ikpochapụ unu.
  revised_footnotes: []
  revision_rationale: 'The sole change is in the final clause: “ka ibe unu ghara ikpochapụ unu” restores the source’s passive-result warning and the agency expressed by ὑπ’ ἀλλήλων, while retaining natural modern Standard Igbo and the force of the metaphor.'
