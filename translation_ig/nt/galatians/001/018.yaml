id: GAL.1.18
reference: Galatians 1:18
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἔπειτα μετὰ ⸂ἔτη τρία⸃ ἀνῆλθον εἰς Ἱεροσόλυμα ἱστορῆσαι ⸀Κηφᾶν, καὶ ἐπέμεινα πρὸς αὐτὸν ἡμέρας δεκαπέντε·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/018.yaml
  text: Then after three years I went up to Jerusalem to visit Cephas[b][a], and I stayed with him fifteen days.
translation:
  language: ig
  text: Mgbe ahụ, mgbe afọ atọ gachara, arịgoro m Jerusalem ka m leta Kifas[a][b], m wee nọnyere ya ụbọchị iri na ise.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kifas bụ aha Arameik nke Pita.
    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ, “ka m mata Kifas nke ọma site n'ịhụ ya n'onwe m.” Ngwaa Grik ahụ nwere ike ịpụta ileta mmadụ, ma ọ bụ ịmata ya nke ọma site na nzute onwe onye.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔπειτα
  choice: Mgbe ahụ
  rationale: Ọ na-egosi ihe sochiri n'usoro akụkọ Pọl, n'Igbo dị mfe ma bụrụkwa nke sitere n'okike.
- source_word: μετὰ ἔτη τρία
  choice: mgbe afọ atọ gachara
  rationale: Ọ na-egosi oge gafere n'ụzọ doro anya ma kwekọọ n'okwu Grik.
- source_word: ἀνῆλθον
  choice: agbagoro m
  rationale: Ọ na-echekwa echiche nke ịrịgo Jerusalem, nke dị n'ime ngwaa Grik, ma bụrụkwa okwu Igbo a na-aghọta.
- source_word: Ἱεροσόλυμα
  choice: Jerusalem
  rationale: Nke a bụ aha obodo ahụ a na-ejikarị eme ihe n'Igbo.
- source_word: ἱστορῆσαι
  choice: ka m gaa leta
  rationale: N'ọnọdụ a, ngwaa ahụ na-ezo aka n'ịga hụ mmadụ n'onwe ya; ‘gaa leta’ bụ Igbo sitere n'okike, ebe nkọwa ala peeji na-echekwa echiche ọzọ nke ịmata ya nke ọma site na nzute ahụ.
- source_word: Κηφᾶν
  choice: Kifas
  rationale: Aha Arameik Pọl ji ka e dere ya ka e chekwaa ya, kama iji ‘Pita’ dochie ya.
- source_word: ἐπέμεινα πρὸς αὐτὸν
  choice: m wee nọnyere ya
  rationale: Ọ na-egosi na Pọl gara n'ihu ịnọ n'ebe Kifas nọ n'ime oge ahụ, n'Igbo dị mfe.
- source_word: ἡμέρας δεκαπέντε
  choice: ụbọchị iri na ise
  rationale: Ọ na-egosi ogologo oge ahụ kpọmkwem dịka okwu Grik si dị.
theological_decisions:
- issue: Njirimara Kifas
  choice: E debere ‘Kifas’ n'ahịrị amaokwu ahụ, ma kọwaa njikọ ya na Pita n'ala peeji.
  alternative: Iji ‘Pita’ dochie ‘Kifas’ n'ahịrị amaokwu ahụ.
  rationale: Nke a na-edobe aha Pọl ji n'ebe a ma zere ime ka ederede kwekọọ n'aha ọzọ n'enweghị mkpa.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. A họọrọ ‘agbagoro m’ iji chekwaa echiche ịrịgo Jerusalem, ebe ‘gaa leta’ na-eme ka ahịrịokwu ahụ bụrụ nke sitere n'okike n'Igbo; nkọwa ala peeji na-echekwa obosara nghọta nke ἱστορῆσαι.
