  text: ἕτερον δὲ τῶν ἀποστόλων οὐκ εἶδον, εἰ μὴ Ἰάκωβον τὸν ἀδελφὸν τοῦ κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/019.yaml
  text: But I saw none of the other apostles except James[a], the Lord’s brother.
translation:
  language: ig
  text: Ma ahụghị m onye ọzọ n’ime ndịozi ahụ, ma e wezụga Jemis[a], nwanne Onyenwe anyị.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Ahụghị m onyeozi ọzọ ọ bụla—naanị Jemis, nwanne Onyenwe anyị.” Ụfọdụ na-aghọta okwu a dịka nke na-adịghị agụta Jemis n’etiti ndịozi.
    reason: alternative_reading
lexical_decisions:
- source_word: ἕτερον
  choice: onye ọzọ
  rationale: N’usoro nkebi nke na-ekwu banyere otu ìgwè, okwu a pụtara onye ọzọ sitere n’etiti ndị ahụ; “onye ọzọ” bụ Igbo doro anya ma dịkwa mfe.
- source_word: δέ
  choice: Ma
  rationale: Ọ na-egosi obere ọdịiche n’ihe Pọl kwuru tupu nke a; “Ma” na-egosipụta njikọ ahụ nke ọma.
- source_word: ἀποστόλων
  choice: ndịozi
  rationale: N’ebe a ọ na-ezo aka n’òtù ndị a maara dị ka ndịozi; “ndịozi” bụ okwu Ndị Kraịst maara nke ọma maka ndị e zigara n’ọrụ pụrụ iche.
- source_word: οὐκ εἶδον
  choice: ahụghị m
  rationale: Nke a na-edobe ngọnarị na oge gara aga nke Grik n’ụzọ Igbo si ekwu ya nke ọma.
- source_word: εἰ μὴ
  choice: ma e wezụga
  rationale: N’ebe a, ọ bụ okwu na-ewebata onye a napụrụ n’okwu izugbe, ọ bụghị ahịrịokwu ọnọdụ; “ma e wezụga” na-egosipụta nke ahụ.
- source_word: Ἰάκωβον
  choice: Jemis
  rationale: Nke a bụ ụdị aha a maara nke ọma n’Igbo maka Jekọb/Jemis a kpọrọ aha n’Agba Ọhụrụ.
- source_word: ἀδελφὸν
  choice: nwanne
  rationale: “Nwanne” na-edobe ihe okwu Grik pụtara kpọmkwem n’etinyeghị nkọwa na ọ bụ naanị onye ikwu.
- source_word: τοῦ κυρίου
  choice: Onyenwe anyị
  rationale: “Onyenwe anyị” bụ nsụgharị Igbo doro anya ma kwanyere ùgwù maka utu aha κύριος n’ebe a.
theological_decisions:
- issue: Ma ahịrịokwu a ọ̀ na-agụnye Jemis n’etiti ndịozi
  choice: Isi ederede na-egosi na Pọl ahụghị onye ọzọ n’etiti ndịozi ma e wezụga Jemis, nke na-eme ka Jemis bụrụ onye e wepụtara n’òtù ahụ.
  alternative: A pụrụ ịghọta ya na Pọl ahụghị onyeozi ọzọ, kama na ọ hụrụ naanị Jemis, nwanne Onyenwe anyị, n’agụnyeghị Jemis n’etiti ndịozi.
  rationale: N’usoro Grik, εἰ μὴ na-ewebatakarị ihe e wepụtara n’okwu bu ya ụzọ. Ma ebe usoro a nwere ike ịghọta n’ụzọ ọzọ, e debere echiche ọzọ ahụ n’ala peeji kama idozi esemokwu ahụ n’isi ederede.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị mfe ma dị ùgwù. Ahịrịokwu ahụ na-agbaso usoro echiche Grik n’enweghị ịmanye nkọwa okpukpe pụrụ iche; akara ala peeji [a] dị n’isi ederede dịka achọrọ.
