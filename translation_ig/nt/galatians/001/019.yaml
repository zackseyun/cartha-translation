  naturalness: The main sentence is clear and modern Standard Igbo; adding a comma before the exception improves its reading. The footnote's explanatory sentence can be made more idiomatic with 'na-adịghị agụta Jemis n’etiti ndịozi' rather than the less natural 'na-adịghị agụnye Jemis.'
  terminology: '''ndịozi,'' ''Jemis,'' ''nwanne,'' and ''Onyenwe anyị'' are suitable established terms. The wording preserves the syntactic question of whether Jemis is included among the apostles and does not impose a theological conclusion.'
