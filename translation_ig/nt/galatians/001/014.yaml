  text: καὶ προέκοπτον ἐν τῷ Ἰουδαϊσμῷ ὑπὲρ πολλοὺς συνηλικιώτας ἐν τῷ γένει μου, περισσοτέρως ζηλωτὴς ὑπάρχων τῶν πατρικῶν μου παραδόσεων.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/014.yaml
  text: And I was advancing in Judaism beyond many of my contemporaries among my people[b][a], being far more zealous for the traditions of my fathers.
translation:
  language: ig
  text: M nọ na-enwe ọganihu n’okpukpe ndị Juu karịa ọtụtụ ndị mụ na ha hà n’afọ n’etiti ndị m,[a] na-enwekwa ịnụ ọkụ n’obi karịa maka ọdịnala ndị nna nna m.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị “n’okpukpe ndị Juu” dịka “n’ụzọ ndụ ndị Juu,” dabere n’otú e si ghọta obosara ihe okwu Grik ahụ bụ Ἰουδαϊσμός pụtara n’ebe a.
    reason: lexical_alternative
lexical_decisions:
- source_word: προέκοπτον
  choice: Ana m aga n’ihu
  rationale: Na-egosipụta omume na-aga n’ihu n’oge gara aga, ya bụ, ọganihu Pọl nọ na-eme.
- source_word: Ἰουδαϊσμῷ
  choice: n’okpukpe ndị Juu
  rationale: Ọ bụ nsụgharị doro ndị Igbo nke oge a anya; ọ na-egosi usoro okpukpe ndị Juu n’enweghị itinye nkọwa agbakwunyere.
- source_word: ὑπὲρ πολλοὺς συνηλικιώτας
  choice: karịa ọtụtụ ndị ọgbọ m
  rationale: Na-echekwa ntụnyere ὑπέρ na echiche nke ndị ha na ya hà n’afọ dị na συνηλικιώτας.
- source_word: ἐν τῷ γένει μου
  choice: n’etiti ndị m
  rationale: Na-egosi ndị otu agbụrụ ma ọ bụ obodo ya n’asụsụ Igbo dị mfe, na-ezere mgbagwoju anya nke okwu metụtara ‘race.’
- source_word: περισσοτέρως ζηλωτὴς ὑπάρχων
  choice: na-anụ ọkụ n’obi nke ukwuu
  rationale: Na-enye ike ntụnyere ahụ ma na-egosipụta oke ịnụ ọkụ n’obi n’asụsụ Igbo ebumpụta ụwa.
- source_word: τῶν πατρικῶν μου παραδόσεων
  choice: maka ọdịnala ndị nna nna m
  rationale: Na-echekwa ma echiche ọdịnala e ketara eketa ma njikọ ya na ndị nna ochie Pọl.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke oge a, dị ugwu ma dị mfe nghọta. A họọrọ usoro okwu ebumpụta ụwa ma chekwaa ntụnyere, mmegharị na-aga n’ihu n’oge gara aga, na echiche ọdịnala e ketara eketa.
