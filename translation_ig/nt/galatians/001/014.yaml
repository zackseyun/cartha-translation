- from: Ana m aga n’ihu n’okpukpe ndị Juu karịa ọtụtụ ndị ọgbọ m n’etiti ndị m,[a] na-anụ ọkụ n’obi nke ukwuu maka ọdịnala ndị nna nna m.
  to: M nọ na-enwe ọganihu n’okpukpe ndị Juu karịa ọtụtụ ndị mụ na ha hà n’afọ n’etiti ndị m,[a] na-enwekwa ịnụ ọkụ n’obi karịa maka ọdịnala ndị nna nna m.
  rationale: The revision changes the opening to an ongoing past construction, matching the imperfect προέκοπτον in its narrative setting. It also makes the comparative force of περισσοτέρως explicit. The remaining phrasing, including the footnote anchor and lexical alternative, is retained because it is structurally sound and faithfully communicates the Greek.
