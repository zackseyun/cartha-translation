id: GAL.1.1
reference: Galatians 1:1
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Παῦλος ἀπόστολος, οὐκ ἀπ’ ἀνθρώπων οὐδὲ δι’ ἀνθρώπου ἀλλὰ διὰ Ἰησοῦ Χριστοῦ καὶ θεοῦ πατρὸς τοῦ ἐγείραντος αὐτὸν ἐκ νεκρῶν,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/001.yaml
  text: Paul[a], an apostle—not from men nor through a man, but through Jesus the Messiah and God the Father, who raised him from the dead,
translation:
  language: ig
  text: Pọl, onyeozi—ọ bụghị site n’aka ụmụ mmadụ, ọ bụghịkwa site n’aka mmadụ, kama ọ bụ site n’aka Jizọs, bụ́ Mesaịa ahụ,[a] na Chineke Nna, onye mere ka o si ná ndị nwụrụ anwụ bilie—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “site n’aka Jizọs Kraịst.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Παῦλος
  choice: Pọl
  rationale: Ụdị aha a bụ nke a na-amakarị n’Igbo, ọ dịkwa mfe nghọta n’asụsụ Igbo nke oge a.
- source_word: ἀπόστολος
  choice: onyeozi
  rationale: “Onyeozi” na-egosi onye e zipụrụ ma nye ọrụ, ma na-edobekwa ịdị arọ nke aha ọrụ Pọl ji kọwaa onwe ya.
- source_word: ἀπ’ ἀνθρώπων
  choice: site n’aka ụmụ mmadụ
  rationale: Nkebi a na-egosi isi mmalite; “ụmụ mmadụ” na-anọgide na ọtụtụ dịka Grik si dị ma na-emegide “otu mmadụ” na-esote ya.
- source_word: δι’ ἀνθρώπου
  choice: site n’aka otu mmadụ
  rationale: Nke a na-egosi onye e si n’aka ya mee ihe; “otu mmadụ” na-echekwa otu-onye nke Grik na ọdịiche ya na ọtụtụ mmadụ.
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: site n’aka Jizọs, bụ́ Mesaịa ahụ
  rationale: Nkwughachi “site n’aka” na-echekwa nhazi okwu Grik na ọdịiche dị n’etiti ọrụ mmadụ na ọrụ Jizọs; “Mesaịa” na-egosipụta Χριστός dịka aha-ọkwa.
- source_word: θεοῦ πατρὸς
  choice: Chineke Nna
  rationale: Nke a bụ ụzọ Igbo dị nkenke ma dị ùgwù si egosi aha njikọ a, na-enweghị ịgbanwe mmekọrịta okwu ahụ.
- source_word: τοῦ ἐγείραντος αὐτὸν ἐκ νεκρῶν
  choice: onye mere ka o si ná ndị nwụrụ anwụ bilie
  rationale: Nke a na-eme ka o doo anya na Chineke Nna bụ onye mere ka Jizọs bilie, ma na-echekwa nkwupụta mbilite n’ọnwụ nke Grik.
theological_decisions:
- issue: Ntụgharị Χριστοῦ n’aha Ἰησοῦ Χριστοῦ
  choice: Mesaịa
  alternative: Kraịst
  rationale: N’ebe a, Χριστός ka nwere ike aha-ọkwa ya; “Mesaịa” na-eme ka ihe aha ahụ pụtara pụta ìhè, ebe e tinyere ụzọ ọzọ a na-amakarị n’ala ala peeji.
- issue: Onye mere ka Jizọs bilie
  choice: E jikọtara nkebi ahụ na Chineke Nna
  alternative: Ịhapụ njikọ ahụ ka ọ ghara ido anya
  rationale: Articular participle τοῦ ἐγείραντος na-akọwa θεοῦ πατρὸς; ya mere Chineke Nna bụ onye okwu ahụ na-ekwu na o mere ka Jizọs bilie.
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. A hapụrụ ahịrịokwu ahụ ka ọ bụrụ mmalite nke ekele ogologo Pọl, dịka akara nkebi na-egosi. Em dash na-enyere aka idebe nkwụsị okwu Pọl na-enweghị ime ya ahịrịokwu zuru ezu.
