  text: 'and all the brothers with me[a], to the churches of Galatia:'
translation:
  language: ig
  text: 'na ụmụnna niile mụ na ha nọ,[a] nye ọgbakọ dị iche iche nke Galetia:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ụmụnna nwoke niile mụ na ha nọ.” Okwu Grik ahụ bụ ἀδελφοί (“ụmụnna nwoke”), ma n’ọnọdụ ụfọdụ ọ pụrụ ịgụnye ndị kwere ekwe nwoke na nwanyị.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: na
  rationale: Ọ na-ejikọta ndị a na Pọl, onye a kpọrọ aha n’amaokwu nke mbụ, ma na-edobe otú ahịrịokwu ahụ si aga n’ihu.
- source_word: οἱ σὺν ἐμοὶ πάντες ἀδελφοί
  choice: ụmụnna niile mụ na ha nọ
  rationale: “Ụmụnna” bụ okwu Igbo ebumpụta ụwa maka ndị otu ezinụlọ ma ọ bụ ndị otu okwukwe; n’ebe a ọ dabara maka ἀδελφοί, ebe nkebi “mụ na ha nọ” na-egosi ndị ha na Pọl nọ ugbu a.
- source_word: ἐκκλησίαις
  choice: ọgbakọ Kraịst
  rationale: “Ọgbakọ Kraịst” na-egosi obodo ndị kwere ekwe n’otu n’otu, ọ bụghị ụlọ ofufe naanị, ma bụrụkwa okwu doro ndị Igbo nke oge a anya.
- source_word: τῆς Γαλατίας
  choice: ndị dị na Galetia
  rationale: Ọ bụ ezie na Grik ji genitive, Igbo na-ekwu ya nke ọma dị ka ọgbakọ ndị nọ n’ógbè Galetia.
theological_decisions:
- issue: Ma ἀδελφοί ọ na-ezo aka naanị n’ụmụ nwoke ka ọ bụ n’ụmụ nwoke na ụmụ nwanyị kwere ekwe
  choice: ụmụnna
  alternative: ụmụnna nwoke
  rationale: ἀδελφοί bụ masculine plural n’asụsụ Grik, ma n’ụdị a ọ pụrụ ịgụnye ndị kwere ekwe nwoke na nwanyị. “Ụmụnna” na Igbo na-edobe ohere ahụ n’enweghị ịmanye otu nkọwa.
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E tinyere “na-edegara ... akwụkwọ” iji mee ka ndị nnata pụta nke ọma n’Igbo, ebe amaokwu a na-aga n’ihu site n’aha ndị na-ezipụ akwụkwọ ozi e kwuru n’amaokwu 1.
