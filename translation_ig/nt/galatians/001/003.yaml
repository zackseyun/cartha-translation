  text: χάρις ὑμῖν καὶ εἰρήνη ἀπὸ θεοῦ πατρὸς ⸂καὶ κυρίου ἡμῶν⸃ Ἰησοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/003.yaml
  text: Grace to you and peace from God our Father and the Lord Jesus the Messiah,[a]
translation:
  language: ig
  text: Ka amara na udo si n’aka Chineke Nna anyị na Onyenwe anyị Jizọs, bú Mesaya, bịakwute unu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ: “Jizọs Kraịst.”'
    reason: alternative_reading
lexical_decisions:
- source_word: χάρις
  choice: amara
  rationale: “Amara” bụ okwu Igbo a na-ejikarị akọwa χάρις n’Agba Ọhụrụ; ọ na-echekwa ma ụdị ngọzi e ji ekele ndị a na-edegara akwụkwọ ozi ma echiche miri emi Pọl na-etinye n’okwu ahụ.
- source_word: ὑμῖν
  choice: bịakwute unu
  rationale: N’ụdị ngọzi Igbo, “bịakwute unu” na-egosipụta dative ὑμῖν n'ụzọ eke karịa ịsụgharị ya naanị dịka “nye unu.”
- source_word: εἰρήνη
  choice: udo
  rationale: “Udo” bụ ntụgharị doro anya ma gbasaara nke ọma, na-echekwa echiche ekele ndị Juu na ọdịmma zuru ezu nke okwu ahụ.
- source_word: ἀπό
  choice: si n’aka
  rationale: “Si n’aka” na-egosi isi mmalite nke amara na udo n’Igbo dị ndụ ma kwụsie ike.
- source_word: θεοῦ πατρὸς
  choice: Chineke Nna anyị
  rationale: Nke a na-agụ ἡμῶν na πατρός dịka “Nna anyị,” ma na-enye usoro okwu Igbo doro anya.
- source_word: κυρίου
  choice: Onyenwe anyị
  rationale: “Onyenwe anyị” na-echekwa κύριος dịka aha nsọpụrụ na nkwupụta banyere Jizọs, ọ bụghị naanị “onyeisi” ma ọ bụ “nna ukwu.”
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jizọs, bú Mesaya
  rationale: “Mesaya” na-asụgharị Χριστός dịka aha ọrụ e tere mmanụ; “bú” na-eme ka aha ahụ bụrụ Igbo eke ma gbochie ka e were ya dịka aha nna nkịtị.
theological_decisions:
- issue: Ma a ga-asụgharị Χριστοῦ dịka aha ọrụ “Mesaya” ka a ga-edebe ụdị ọdịnala “Kraịst”
  choice: Jizọs, bú Mesaya
  alternative: Jizọs Kraịst
  rationale: N’ebe a Χριστός ka nwere ike aha ọrụ nke Onye E Tere Mmanụ. Isi ederede na-akọwapụta ya dịka “Mesaya,” ebe ihe odide ala peeji na-echekwa ụdị ọdịnala a maara nke ọma, “Kraịst,” n’enweghị ịkagbu njikọ dị n’etiti ha.
- issue: Njikọ nke ἡμῶν n’usoro θεοῦ πατρὸς καὶ κυρίου ἡμῶν
  choice: Ịghọta ya n'ụzọ dabara na “Chineke Nna anyị” na “Onyenwe anyị”
  alternative: “Chineke Nna na Onyenwe anyị”
  rationale: N’ụdị ekele Pọl na n’usoro echiche a, “Nna anyị” bụ nghọta ziri ezi ma bụrụkwa Igbo eke; a na-edebe “Onyenwe anyị” dịka aha a na-akpọ Jizọs.
translation_notes:
  register: 'Asụsụ ahụ bụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. A haziri ahịrịokwu ahụ dịka ngọzi Igbo (“Ka ... bịakwute unu”), ebe a na-echekwa isi mmalite abụọ ahụ jikọrọ ọnụ: Chineke Nna anyị na Onyenwe anyị Jizọs.'
