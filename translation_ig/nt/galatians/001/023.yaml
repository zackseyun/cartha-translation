  rationale: E degharịrị mmalite amaokwu ahụ iji gosipụta δὲ na mmachi nke μόνον n’Igbo a na-asụ nke ọma. E dochiri «ọ gbalịburu ibibi» anya na «ọ na-emebu ibibi» ka e wee ghara itinye echiche ‘ịrịọ’ na-enweghị isi n’okwu Grik, ma chekwaa imperfect nke ἐπόρθει. E debeere «okwukwe ahụ» na akara [a], a gbanwekwara nkọwa ala peeji ka ọ bụrụ nke ziri ezi ma ghara ikwu karịa ihe amaokwu ahụ kwuru.
