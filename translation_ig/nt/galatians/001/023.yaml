  text: μόνον δὲ ἀκούοντες ἦσαν ὅτι Ὁ διώκων ἡμᾶς ποτε νῦν εὐαγγελίζεται τὴν πίστιν ἥν ποτε ἐπόρθει,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/023.yaml
  text: They were only hearing[a], “The one who formerly persecuted us now proclaims the faith he once tried to destroy.”
translation:
  language: ig
  text: Ma naanị akụkọ ha na-anụ bụ, “Onye ahụ na-akpagbu anyị na mbụ na-ekwusa ugbu a okwukwe ahụ nke ọ na-emebu ibibi.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ozi ọma ahụ.” N’asụsụ Grik, ọ bụ “okwukwe ahụ,” nke o yikarịrị ka ọ na-ekwu maka ozi ma ọ bụ okwukwe Ndị Kraịst Pọl na-emebu imebi.
    reason: lexical_alternative
lexical_decisions:
- source_word: μόνον
  choice: Naanị ihe
  rationale: Ọ na-egosi na ihe ọmụma ha banyere Pọl bụ naanị akụkọ a ha nọ na-anụ.
- source_word: ἀκούοντες ἦσαν
  choice: ha nọ na-anụ
  rationale: Ụdị imperfect a na-egosi na ha nọgidere ma ọ bụ na-anụkarị akụkọ ahụ.
- source_word: ὁ διώκων ἡμᾶς ποτε
  choice: Onye ahụ na-akpagbu anyị n'oge gara aga
  rationale: Nke a na-egosipụta participle ahụ dịka nkọwa e ji amata Pọl site n'ihe ọ na-emebu.
- source_word: νῦν εὐαγγελίζεται
  choice: na-ekwusa ugbu a
  rationale: ‘Na-ekwusa’ bụ okwu Igbo doro anya maka ikwusa ozi ọma, ebe ‘ugbu a’ na-echekwa ntụnyere oge dị n'amaokwu ahụ.
- source_word: τὴν πίστιν
  choice: okwukwe ahụ
  rationale: Article ahụ na gburugburu okwu na-akwado nghọta nke okwukwe dịka ozi ma ọ bụ nkwupụta Ndị Kraịst, ọ bụghị naanị omume mmadụ nke ikwere.
- source_word: ἣν ποτε ἐπόρθει
  choice: ọ gbalịburu ibibi
  rationale: πορθέω na-egosi imebi ma ọ bụ ịla n'iyi; nsụgharị a na-ekwupụta ebumnuche ọjọọ Pọl nwere n'oge gara aga n'Igbo dị mfe.
theological_decisions:
- issue: Ihe τὴν πίστιν pụtara
  choice: ‘okwukwe ahụ’ bụ okwukwe ma ọ bụ ozi Ndị Kraịst Pọl na-ekwusa ugbu a
  alternative: ‘okwukwe’ dịka omume mmadụ nke ikwere; ma ọ bụ ‘ozi ọma’ dịka nsụgharị dabere n'ọnọdụ okwu
  rationale: N'ebe a, Pọl na-atụnyere mkpagbu ọ kpagburu ndị kwere ekwe n'oge gara aga na nkwusa ọ na-ekwusa ugbu a. Article ahụ na-akwado nghọta nke okwukwe dịka ozi a na-ekwere na ya, ma nsụgharị ahụ anaghị ewepụ kpamkpam njikọ ya na ikwere.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta mee nsụgharị ahụ. ‘Na-akpagbu’ na-egosipụta ọrụ gara n'ihu e ji mara Pọl n'oge ahụ; ‘okwukwe ahụ’ na-echekwa okwu Grik na mgbagwoju nghọta ya. E debere akara nkọwa ala peeji [a] ozugbo n'isi amaokwu.
