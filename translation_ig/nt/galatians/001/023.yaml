  verdict: revise
  source_fidelity: A chọrọ obere mmegharị. «Naanị ihe ha nọ na-anụ» na-echekwa mgbochi nke μόνον na echiche imperfect nke ἀκούοντες ἦσαν nke ọma. Ma «ọ gbalịburu ibibi» na-agbakwunye echiche nke ‘ịrịọ ma ọ bụ ịnwa’ nke na-adịghị kpọmkwem n’okwu Grik ἐπόρθει, nke bụ imperfect ma na-ekwu maka imebi/ravaging nke ọ na-emebu. «na-akpagbu anyị n'oge gara aga» ghọtara nke ọma, ma «na mbụ» dị mkpirikpi ma bụrụ nke ekere eke n’ọnụ Pọl a kọrọ.
  naturalness: Nsụgharị a e degharịrị na-eji Standard Igbo dị mfe ma dị ùgwù. «Ma naanị akụkọ ha na-anụ bụ» na-ada n’ụzọ nkịtị karịa «Naanị ihe ha nọ na-anụ bụ» n’ebe a, ebe ọ na-eme ka o doo anya na ihe ha nwetara bụ akụkọ banyere Pọl.
  terminology: «okwukwe ahụ» bụ nsụgharị kwesịrị ekwesị maka τὴν πίστιν; ọ na-echekwa okwu Grik ahụ na nghọta ya nke nwere ike ịbụ okwukwe/ozi Ndị Kraịst. «na-ekwusa» dabara εὐαγγελίζεται n’ọnọdụ a. Akọwaala nhọrọ «ozi ọma ahụ» n’ala peeji n’enweghị ịmanye otu nkọwa.
