  text: ἃ δὲ γράφω ὑμῖν, ἰδοὺ ἐνώπιον τοῦ θεοῦ ὅτι οὐ ψεύδομαι.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/020.yaml
  text: What I am writing to you—behold[a], before God[b], I am not lying.
translation:
  language: ig
  text: Ma ihe ndị m na-edetara unu—lee[a], n’ihu Chineke[b], anaghị m agha ụgha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Lee” bụ mkpụrụokwu Grik e ji mesie okwu ike ma kpọọ uche onye na-agụ ya.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụ ya, “n’ọnụnọ Chineke.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἃ
  choice: ihe ndị
  rationale: Nnọchiaha ikwu ihe nke dị n'ụdị ọtụtụ na-ezo aka n'ihe Pọl na-ede; “ihe ndị” na-echekwa echiche ọtụtụ ahụ ma na-ada nke ọma n'Igbo.
- source_word: δὲ
  choice: Ma
  rationale: N'ebe a, δέ bụ njikọ dị nro na-egosi ntụgharị n'okwu; “Ma” na-egosipụta njikọ ahụ n'enweghị ime ka esemokwu ya sie ike gabiga ókè.
- source_word: γράφω ὑμῖν
  choice: m na-edetara unu
  rationale: Okwu a na-egosi omume ide ihe nye ndị nnata akwụkwọ ozi; “m na-edetara unu” bụ Igbo dị ndụ ma doo anya.
- source_word: ἰδοὺ
  choice: lee
  rationale: “Lee” na-anọchi mkpụrụokwu nkwusi ike nke na-akpọ uche onye na-agụ ihe, ma na-echekwa ụda dị nsọ nke nkwupụta ahụ.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: n’ihu Chineke
  rationale: Nke a bụ okwu nkwupụta dị nsọ nke na-egosi na Pọl na-ekwu dịka onye nọ n'ihu Chineke ma na-aza ya ajụjụ.
- source_word: ὅτι
  choice: '[atụgharịghị ya iche]'
  rationale: Ọ na-ewebata ọdịnaya nkwupụta Pọl; nhazi ahịrịokwu Igbo na akara nkwụsị na-eme ka ọdịnaya ahụ doo anya n'enweghị ịgbakwunye okwu ọzọ.
- source_word: οὐ ψεύδομαι
  choice: anaghị m agha ụgha
  rationale: Nke a bụ ụzọ Igbo nkịtị, kpọmkwem, isi gọnahụ na mmadụ na-ekwu ụgha, ma na-echekwa ike nkwupụta Pọl.
theological_decisions:
- issue: Ike nke ịkpọku Chineke dịka onye akaebe
  choice: 'E depụtara ya dịka nkwupụta dị nsọ: “n’ihu Chineke, anaghị m agha ụgha.”'
  alternative: Ịghọta ya naanị dịka okwu nkwusi ike na-enweghị echiche nke ịza ajụjụ n’ihu Chineke.
  rationale: ἐνώπιον τοῦ θεοῦ na-egosi na Pọl na-etinye okwu ya n'okpuru ịma ikpe Chineke, ma nsụgharị ahụ anaghị akpọ ya iyi n'ụzọ doro anya karịa ihe Grik kwuru.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Akara ogologo na-ekewa ihe Pọl na-ede na nkwupụta ya siri ike; “lee” na-echekwa nkwusi ike nke ἰδού, ebe “n’ihu Chineke” na-echekwa ụda ịza ajụjụ n’ihu Chineke.
