source:
  edition: SBLGNT
  text: Ἠκούσατε γὰρ τὴν ἐμὴν ἀναστροφήν ποτε ἐν τῷ Ἰουδαϊσμῷ, ὅτι καθ’ ὑπερβολὴν ἐδίωκον τὴν ἐκκλησίαν τοῦ θεοῦ καὶ ἐπόρθουν αὐτήν,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/013.yaml
  text: For you have heard of my former way of life in Judaism[d][c][b][a], that I was persecuting the church of God beyond measure and was ravaging it.
translation:
  language: ig
  text: N’ihi na unu anụla banyere otú m si ebi ndụ n’oge gara aga,[a] n’okpukpe ndị Juu,[b] na m na-akpagbu ọgbakọ Chineke gabiga ókè,[c] na-ebibikwa ya.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “omume m n’oge gara aga” ma ọ bụ “ụzọ ndụ m n’oge gara aga.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “n’usoro ndụ ndị Juu.”
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “nke ukwuu” ma ọ bụ “n’ụzọ pụrụ nnọọ iche.”
    reason: lexical_alternative
  - marker: d
    text: Ma ọ bụ, “na-emebikwa ya” ma ọ bụ “na-agbalị ibibi ya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστροφήν
  choice: otú m si ebi ndụ
  rationale: Nke a na-egosi ụzọ ndụ na omume mmadụ n’ozuzu ya, ọ bụghị naanị otu omume pụrụ iche.
- source_word: ποτε
  choice: n’oge gara aga
  rationale: Ọ na-egosi ndụ Pọl n’oge mbụ tupu ọkpụkpọ ya, ma na-edobe ọdịiche oge dị n’amaokwu ahụ.
- source_word: Ἰουδαϊσμῷ
  choice: n’okpukpe ndị Juu
  rationale: Nke a bụ okwu Igbo doro ndị nkịtị anya maka njirimara na usoro okpukpe ndị Juu; ọ naghị agwakọta ya na ndị Juu dịka agbụrụ naanị.
- source_word: καθ’ ὑπερβολὴν
  choice: nke ukwuu
  rationale: Ọ na-egosi oke pụrụ iche nke mkpagbu ahụ n’Igbo dị mfe ma bụrụkwa nke siri ike n’ọnọdụ a.
- source_word: ἐδίωκον
  choice: m nọ na-akpagbu
  rationale: Usoro a na-egosipụta omume gara n’ihu n’oge gara aga dịka imperfect Grik si eme.
- source_word: ἐκκλησίαν τοῦ θεοῦ
  choice: nzukọ Chineke
  rationale: “Nzukọ” na-egosi ọgbakọ ndị kwere ekwe nke Chineke ma zere ịkọwa ἐκκλησία dịka ụlọ; ọ bụkwa okwu a pụrụ ịghọta n’Igbo ụka.
- source_word: ἐπόρθουν
  choice: na-agbalịkwa ibibi ya
  rationale: Ngwaa ahụ nwere ike ịpụta imebi ma ọ bụ ịchọ ibibi; okwu a na-egosi ebumnobi na omume ike Pọl n’enweghị nkwubi okwu na ọ bibiri nzukọ ahụ n’ezie.
theological_decisions:
- issue: Ịsụgharị ἐκκλησία dịka “ụka” ma ọ bụ “nzukọ”
  choice: nzukọ Chineke
  alternative: ụka Chineke
  rationale: “Nzukọ Chineke” na-elekwasị anya n’ọgbakọ mmadụ Pọl kpagburu, ọ bụghị ụlọ ma ọ bụ otu ụka e guzobere n’oge ọzọ.
- issue: Ike na nsonaazụ nke ἐπόρθουν
  choice: na-agbalịkwa ibibi ya
  alternative: na-ebibikwa ya
  rationale: Nhọrọ a na-echekwa ike na ebumnobi nke ngwaa ahụ, ma ọ naghị ekwu na Pọl mezuru mbibi nzukọ Chineke.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke oge a, dị ùgwù ma dị mfe nghọta. E debere imperfect abụọ ahụ dịka omume gara n’ihu (“nọ na-akpagbu,” “na-agbalịkwa”), ebe nkọwa ndị dị n’okpuru na-echekwa ụzọ ndị ọzọ isi ghọta okwu Grik.
