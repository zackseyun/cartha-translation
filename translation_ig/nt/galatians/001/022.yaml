lexical_decisions:
- source_word: δὲ
  choice: Ma
  rationale: “Ma” na-egosi ntakịrị ntụgharị ma ọ bụ ọdịiche n’ihe Pọl na-ekwu, dịka δέ si arụ ọrụ n’ebe a.
- source_word: ἀγνοούμενος τῷ προσώπῳ
  choice: amaghị m n’ihu
  rationale: Nkebiokwu a na-egosi na ọgbakọ ndị ahụ amataghị Pọl ma ha hụ ya, ọ bụghị na ha anụtụbeghị banyere ya. “Amaghị m n’ihu” na-edobe ihe atụ nke ihu ma bụrụkwa okwu Igbo a pụrụ ịghọta.
- source_word: ἐκκλησίαις
  choice: ọgbakọ
  rationale: “Ọgbakọ” na-ezo aka n’ìgwè ndị kwere ekwe na-ezukọ, ma na-adabara ọtụtụ ἐκκλησίαις.
- source_word: Ἰουδαίας
  choice: Judia
  rationale: “Judia” bụ aha mpaghara ahụ a na-ejikarị eme ihe n’Igbo.
- source_word: ἐν Χριστῷ
  choice: ndị nọ n’ime Mesaịa
  rationale: “Nọ n’ime” na-echekwa njikọ ἐν, ebe “Mesaịa” na-eme ka ọrụ Χριστός dị ka utu aha Onye E Tere Mmanụ pụta ìhè.
theological_decisions:
- issue: Otú e si sụgharịa Χριστῷ n’okwu ἐν Χριστῷ
  choice: Mesaịa
  alternative: Kraịst
  rationale: N’ebe a, Χριστός ka nwere ike ịrụ ọrụ dị ka utu aha. “Mesaịa” na-echekwa echiche nke Onye E Tere Mmanụ, ebe e tinyere “Kraịst” n’ala peeji dịka nsụgharị ọdịnala.
translation_notes:
  register: E ji Igbo Izugbe dị mfe ma dị ùgwù mee ihe. Nhazi ahịrịokwu ahụ bụ nke nkịtị n’Igbo, ma okwu “amaghị m n’ihu” na-echekwa echiche nke τῷ προσώπῳ n’enweghị ịkọwa karịa ihe Grik kwuru.
