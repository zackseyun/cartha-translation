  language: en
  yaml_path: translation/nt/galatians/001/022.yaml
  text: But I was personally unknown by face to the churches of Judea that are in Messiah[b][a],
translation:
  language: ig
  text: Ma ọgbakọ ndị dị na Judia, ndị dị n’ime Mesaịa[b], amataghị m n’anya[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “amataghị m site n’ịhụ m” ma ọ bụ “ha amataghị m n’onwe m.”
