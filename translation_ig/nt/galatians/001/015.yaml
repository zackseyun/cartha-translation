  yaml_path: translation/nt/galatians/001/015.yaml
  text: But when the one who set me apart from my mother’s womb and called me through his grace was pleased[a]
translation:
  language: ig
  text: Ma mgbe ọ masịrị onye ahụ kewapụrụ m iche site n’afọ nne m, ma kpọrọ m site n’amara ya[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “site n’ọmụmụ m”; tulee asụsụ banyere ọkpụkpọ onye amụma na Jeremaya 1:5 na Aịzaya 49:1.
    reason: cross_reference
lexical_decisions:
- source_word: ὅτε δὲ
  choice: Ma mgbe
  rationale: Nke a na-echekwa ihe ὅτε pụtara banyere oge, tinyekwa ntakịrị ntụgharị echiche dị na δέ n’Igbo na-aga were were.
- source_word: εὐδόκησεν
  choice: ọ masịrị
  rationale: “Ọ masịrị” na-egosipụta ezi ọchịchọ na afọ ojuju nke Chineke, kama ime ka okwu ahụ bụrụ nanị mkpebi.
- source_word: ὁ ἀφορίσας με
  choice: onye ahụ nke kewapụrụ m iche
  rationale: “Kewapụrụ m iche” na-egosipụta idobe mmadụ iche maka nzube pụrụ iche, ma ọ naghị ebubata nkọwa ozizi karịrị ihe okwu Grik kwuru.
- source_word: ἐκ κοιλίας μητρός μου
  choice: site n’afọ nne m
  rationale: Nke a na-echekwa ihe atụ doro anya nke afọ nne dị n’asụsụ Grik na n’ụzọ e si ekwu banyere ọkpụkpọ ndị amụma.
- source_word: καλέσας
  choice: kpọọkwa m
  rationale: “Kpọọ” bụ okwu Igbo dabara adaba maka ọkpụkpọ Chineke, ma “-kwa” jikọtara ya na omume nke ikewapụ iche.
- source_word: διὰ τῆς χάριτος αὐτοῦ
  choice: site n’amara ya
  rationale: Nke a na-echekwa amara Chineke dị ka ụzọ o si kpọọ Pọl, dịka διά tinyere genitive si egosi.
theological_decisions:
- issue: Ma a ga-asụgharị ἀφορίσας n’ụzọ ga-etinye ozizi pụrụ iche banyere ịhọpụta mmadụ tupu oge eruo
  choice: kewapụrụ m iche
  alternative: họpụtara m; họpụtara m maka ọrụ
  rationale: Okwu Grik na-akwado echiche nke Chineke idobe Pọl iche, karịchaa n’usoro okwu ọkpụkpọ onye amụma, ma ọ naghị achọ ka e kpebie n’ebe a ozizi sara mbara banyere nhọpụta.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, dị nsọ ma dị mfe nghọta. Ahịrị ogologo (—) na-egosi na ahịrịokwu a na-aga n’ihu n’amaokwu na-esote, dịka ọ dị na Grik.
