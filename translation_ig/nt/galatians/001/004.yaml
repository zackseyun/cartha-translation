id: GAL.1.4
reference: Galatians 1:4
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τοῦ δόντος ἑαυτὸν ⸀ὑπὲρ τῶν ἁμαρτιῶν ἡμῶν ὅπως ἐξέληται ἡμᾶς ἐκ τοῦ ⸂αἰῶνος τοῦ ἐνεστῶτος⸃ πονηροῦ κατὰ τὸ θέλημα τοῦ θεοῦ καὶ πατρὸς ἡμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/004.yaml
  text: who gave himself for our sins so that he might rescue us from the present evil age[a], according to the will of our God and Father,
translation:
  language: ig
  text: onye nyere onwe ya maka mmehie anyị, ka o wee napụta anyị n’ọgbọ ọjọọ a dị ugbu a[a], dị ka uche Chineke na Nna anyị si dị,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ụwa ọjọọ a dị ugbu a.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δόντος ἑαυτὸν
  choice: nyere onwe ya
  rationale: Nke a na-egosipụta ido onwe ya n’afọ ofufo n'ụzọ doro anya ma bụrụkwa Igbo nkịtị.
- source_word: ὑπὲρ τῶν ἁμαρτιῶν ἡμῶν
  choice: n’ihi mmehie anyị
  rationale: N’ebe a, ‘n’ihi’ na-egosi njikọ nke onyinye Kraịst na mmehie anyị n’enweghị ịkọwapụta otu ozizi kpọmkwem banyere mkpuchi mmehie.
- source_word: ἐξέληται
  choice: napụta
  rationale: ‘Napụta’ na-egosi iwepụta mmadụ n’ihe ize ndụ ma ọ bụ n’okpuru ike na-achị ya.
- source_word: αἰῶνος τοῦ ἐνεστῶτος πονηροῦ
  choice: ọgbọ ọjọọ a dị ugbu a
  rationale: ‘Ọgbọ’ na-echekwa echiche αἰών dịka oge ma ọ bụ usoro nke oge a, kama ime ya naanị ụwa anụ ahụ; ‘a dị ugbu a’ na-egosipụta ἐνεστῶτος.
- source_word: κατὰ τὸ θέλημα
  choice: dị ka uche ... si dị
  rationale: Akpaokwu Igbo a na-egosi na ihe ahụ kwekọrọ n’uche na nzube Chineke.
- source_word: τοῦ θεοῦ καὶ πατρὸς ἡμῶν
  choice: Chineke na Nna anyị
  rationale: Nke a na-echekwa njikọ aha abụọ ahụ dịka ihe na-ezo aka n’otu onye, ma na-ada nke ọma n’Igbo.
theological_decisions:
- issue: Ma a ga-akọwa ὑπὲρ τῶν ἁμαρτιῶν ἡμῶν n’ụzọ ga-ekpebi kpọmkwem usoro mkpuchi mmehie
  choice: n’ihi mmehie anyị
  alternative: maka mmehie anyị
  rationale: Nhọrọ a na-echekwa ike nke okwu mgbapụta ahụ ma ghara itinye nkọwa ozizi karịrị ihe Grik kwuru.
- issue: Ma αἰών ga-abụ ‘ọgbọ/oge’ ka ọ bụ ‘ụwa’
  choice: ọgbọ ọjọọ a dị ugbu a
  alternative: ụwa ọjọọ a dị ugbu a
  rationale: αἰών bụ isi na-egosi oge ma ọ bụ usoro ụwa nke oge a; ‘ọgbọ’ na-echekwa akụkụ oge ahụ karịa ‘ụwa.’
translation_notes:
  register: Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. E ji ‘ọgbọ’ mee ka echiche oge dị na αἰών pụta ìhè, ebe e debere ‘ụwa’ dịka nhọrọ n’ala peeji.
