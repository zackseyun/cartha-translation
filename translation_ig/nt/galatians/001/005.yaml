  text: to whom be the glory forever and ever. Amen.
translation:
  language: ig
  text: Ka otuto dịrị ya ruo mgbe ebighị ebi. Amen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ᾧ
  choice: ya
  rationale: Nnọchiaha a na-ezo aka n’ebe ‘Chineke anyị na Nna anyị’ nọ n’ahịrịokwu bu ụzọ; ‘ya’ bụ ụzọ Igbo si ekwu ya n'ụzọ ebumpụta ụwa n’usoro otuto a.
- source_word: δόξα
  choice: otuto
  rationale: N’usoro a nke inye Chineke nsọpụrụ, ‘otuto’ bụ okwu Igbo doro anya ma bụrụ nke a na-ejikarị eme ihe, na-eburu echiche nke ịkpọsa ịdị ukwuu na nsọpụrụ ya.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: ruo mgbe niile ebighị ebi
  rationale: Nkebi okwu Grik a bụ akpaala okwu na-egosi oge na-enweghị ọgwụgwụ; nsụgharị a na-eme ka ike okwu ahụ doo onye Igbo nke oge a anya.
- source_word: ἀμήν
  choice: Amen
  rationale: E debere okwu nkwenye a n’ụdị a maara nke ọma n’Igbo na n’ojiji Akwụkwọ Nsọ.
theological_decisions:
- issue: Ngwaa a na-aghọtaghị ma e kwughị ya kpọmkwem n’usoro otuto ahụ
  choice: Ka otuto dịrị ya
  alternative: Otuto bụ nke ya
  rationale: Grik enweghị ngwaa e dere ede. ‘Ka otuto dịrị ya’ na-echekwa ọdịdị arịrịọ na nkwupụta otuto ahụ, na-agbakwunyeghị nkọwa ozizi na-adịghị na isi mmalite.
translation_notes:
  register: Asụsụ Igbo Izugbe dị ugwu, dị mfe nghọta, ma dabara n’usoro otuto. E nweghị akara nkọwa ala peeji n’ihi na enweghị ihe dị n’amaokwu a chọrọ ya.
