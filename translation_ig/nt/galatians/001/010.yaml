id: GAL.1.10
reference: Galatians 1:10
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἄρτι γὰρ ἀνθρώπους πείθω ἢ τὸν θεόν; ἢ ζητῶ ἀνθρώποις ἀρέσκειν; ⸀εἰ ἔτι ἀνθρώποις ἤρεσκον, Χριστοῦ δοῦλος οὐκ ἂν ἤμην.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/010.yaml
  text: For am I now persuading people[a], or God? Or am I seeking to please people? If I were still pleasing people[b], I would not be Messiah’s servant.
translation:
  language: ig
  text: N’ihi na, ọ̀ bụ ụmụ mmadụ ka m na-eme ka ha kweta ugbu a[a], ka ọ̀ bụ Chineke? Ka m̀ na-achọ ime ihe ga-atọ ụmụ mmadụ ụtọ? A sị na m ka na-eme ihe na-atọ ụmụ mmadụ ụtọ, agaraghị m abụ ohu Mesaịa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ọ̀ bụ ihu ọma ụmụ mmadụ ka m na-achọ ugbu a, ka ọ̀ bụ ihu ọma Chineke?”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ohu Kraịst.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄρτι
  choice: ugbu a
  rationale: Ọ na-egosi ọnọdụ Pọl ugbu a ma na-eme ka ọdịiche dị n’etiti ya na ụzọ ndụ ya gara aga pụta ìhè.
- source_word: πείθω
  choice: na-eme ka ha kweta
  rationale: Nke a na-egosipụta isi echiche nke ime ka onye kwenye, ma na-ahapụ mgbagwoju anya dị n’ajụjụ banyere ụmụ mmadụ na Chineke ka ọ dị; a kọwara nghọta ọzọ n’okpuru peeji.
- source_word: ἀνθρώπους
  choice: ụmụ mmadụ
  rationale: Okwu Grik a na-ekwu maka mmadụ niile, ọ bụghị naanị ndị nwoke.
- source_word: θεόν
  choice: Chineke
  rationale: Nke a bụ nsụgharị kwụ ọtọ nke ihe e tinyere n’akụkụ ụmụ mmadụ n’ajụjụ ahụ.
- source_word: ζητῶ
  choice: na-achọ
  rationale: Ọ na-egosipụta omume Pọl na-ajụ ma ọ̀ na-eme ugbu a.
- source_word: ἀρέσκειν / ἤρεσκον
  choice: ime ihe ga-atọ / na-eme ihe na-atọ ... ụtọ
  rationale: Akpaala okwu Igbo a na-egosi ịchọ ime ihe ga-amasị mmadụ ma ọ bụ inweta ihu ọma ya.
- source_word: εἰ ἔτι
  choice: A sị na m ka
  rationale: Ọ na-ejigide ọnọdụ a na-eche n’echiche na echiche nke omume nwere ike ịbụ nke gara n’ihu site n’oge gara aga.
- source_word: Χριστοῦ
  choice: Mesaịa
  rationale: A sụgharịrị aha-ọrụ Χριστός dị ka Mesaịa, ebe echiche nke Onye E Tere Mmanụ na nrubeisi nye ya ka dị mkpa.
- source_word: δοῦλος
  choice: ohu
  rationale: '‘Ohu’ na-egosipụta ike okwu δοῦλος: ịbụ onye nwe ya ma na-erubere ya isi kpamkpam, n’ụzọ dị iche n’ịchọ ime ihe ga-atọ ụmụ mmadụ ụtọ.'
theological_decisions:
- issue: Nsụgharị Χριστοῦ δοῦλος
  choice: ohu Mesaịa
  alternative: ohu Kraịst; onye na-ejere Kraịst ozi
  rationale: Amaokwu ahụ na-egosi na Pọl bụ nke Mesaịa kpamkpam, ọ bụghị onye na-achụso ihu ọma ụmụ mmadụ. ‘Ohu’ na-echekwa ike nke δοῦλος, ebe ‘Mesaịa’ na-egosipụta aha-ọrụ Χριστός.
- issue: Ihe πείθω pụtara n’ajụjụ mbụ
  choice: ime ka ... kweta
  alternative: ịchọ ihu ọma ...
  rationale: Isi okwu ahụ nwere ike ịpụta ime ka onye kwenye ma ọ bụ ịnweta ihu ọma ya n’ọnọdụ a. E tinyere nke mbụ n’ahụ amaokwu maka ịdị nso n’okwu Grik, ma debe nke ọzọ n’okpuru peeji ka e ghara idozi mgbagwoju anya ahụ n’ụzọ zoro ezo.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ugwu ma dị mfe nghọta. Ajụjụ nkwugharị atọ ahụ na ọdịiche dị n’etiti ime ihe ga-atọ ụmụ mmadụ ụtọ na ịbụ ohu Mesaịa ka e chekwara.
