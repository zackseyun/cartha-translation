id: GAL.1.7
reference: Galatians 1:7
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὃ οὐκ ἔστιν ἄλλο· εἰ μή τινές εἰσιν οἱ ταράσσοντες ὑμᾶς καὶ θέλοντες μεταστρέψαι τὸ εὐαγγέλιον τοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/007.yaml
  text: which is not another gospel[b][a]; except that there are some who are troubling you and wanting to distort the gospel of Messiah.
translation:
  language: ig
  text: nke na-abụghị ozi ọma ọzọ; naanị na e nwere ụfọdụ ndị na-akpaghasị unu ma na-achọ ịgbagọ[b] ozi ọma nke Mezaịa[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Kraịst.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “imebi” ozi ọma nke Mezaịa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλο
  choice: ozi ọma ọzọ
  rationale: Ọ bụ ezie na ἄλλο pụtara naanị ‘ọzọ,’ okwu εὐαγγέλιον dị n’amaokwu nke 6 bụ ihe a na-ekwu maka ya; itinye ‘ozi ọma’ na-eme ka Igbo doo anya n’etinyeghị echiche ọhụrụ.
- source_word: εἰ μή
  choice: Kama
  rationale: N’ebe a εἰ μή na-eweta nkọwa na-eme ka okwu gara aga doo anya, ọ bụghị ọnọdụ nkịtị nke ‘ọ bụrụ na ọ bụghị.’ ‘Kama’ na-egosipụta mgbanwe ahụ n’Igbo dị mfe.
- source_word: ταράσσοντες
  choice: ndị na-akpaghasị unu
  rationale: ‘Na-akpaghasị’ na-ejide echiche nke inye nsogbu na ịkpata ọgba aghara ma ọ bụ mgbagwoju anya.
- source_word: θέλοντες
  choice: ndị na-achọkwa
  rationale: ‘Na-achọ’ na-egosipụta ebumnuche ha n’Igbo nkịtị, n’enweghị ime ka ike ọchịchọ ahụ karịrị nke okwu Grik kwuru.
- source_word: μεταστρέψαι
  choice: ịgbagọ
  rationale: ‘Ịgbagọ’ na-egosi ịgbanwe ozi ahụ n’ụzọ na-emebi ezi ọdịdị ya; ọ bụ okwu dị ugbu a ma dị arọ n’ụzọ kwesịrị ekwesị.
- source_word: εὐαγγέλιον
  choice: ozi ọma
  rationale: ‘Ozi ọma’ bụ ntụgharị Igbo doro anya nke εὐαγγέλιον, ma n’ebe a ọ ka na-ejigide ihe okwu ahụ pụtara n’ozizi Pọl.
- source_word: Χριστοῦ
  choice: nke Mezaịa
  rationale: Χριστός ka na-arụ ọrụ dị ka aha ọkwá n’okwu a. ‘Mezaịa’ na-echekwa ntọala ndị Juu na echiche nke onye Chineke tere mmanụ.
theological_decisions:
- issue: Ma a ga-asụgharị Χριστοῦ dị ka aha ọkwá ma ọ bụ dị ka aha mmadụ a na-akpọkarị
  choice: Mezaịa
  alternative: Kraịst
  rationale: Nkebiokwu ahụ nwere ike ịpụta ozi ọma nke bụ nke Mezaịa ma ọ bụ nke gbasara ya. Isi ederede ji ‘Mezaịa’ chekwaa ọrụ Χριστός dị ka aha ọkwá, ebe ndetu na-enye ‘Kraịst’ dị ka ntụgharị omenala ziri ezi.
translation_notes:
  register: E ji Igbo Izugbe dị ugbu a, dị ugwu ma dị mfe nghọta. A hapụrụ mbido ‘nke’ iji chekwaa njikọ ahịrịokwu ahụ na amaokwu nke 6. ‘Kama’ na-egosipụta nkọwa/ịkpa oke nke εἰ μή, ebe ‘ịgbagọ’ na-echekwa ịdị arọ nke ebumnuche ndị ahụ n’enweghị okwu ochie ma ọ bụ nke otu ụka pụrụ iche.
