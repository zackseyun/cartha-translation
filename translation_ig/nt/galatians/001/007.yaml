    text: Ma ọ bụ, “Kraịst.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “imebi” ozi ọma nke Mezaịa.
    reason: lexical_alternative
  revision_rationale: The revision corrects the rendering of εἰ μή from a merely adversative connector to a qualifying/explanatory one and smooths the coordination of the two Greek participles. It otherwise retains the draft’s faithful terminology, supplied referent for ἄλλο, and footnote anchors.
