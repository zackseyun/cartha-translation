language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀλλὰ καὶ ἐὰν ἡμεῖς ἢ ἄγγελος ἐξ οὐρανοῦ ⸀εὐαγγελίζηται ⸀ὑμῖν παρ’ ὃ εὐηγγελισάμεθα ὑμῖν, ἀνάθεμα ἔστω.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/008.yaml
  text: But even if we or an angel from heaven should proclaim good news to you contrary to what we proclaimed to you[c][b][a], let him be accursed.
translation:
  language: ig
  text: Ma ọ bụrụgodị na anyị onwe anyị ma ọ bụ mmụọ ozi si n’eluigwe ezisa unu ozi ọma[a] megidere[b] nke anyị zisasịrị unu ozi ọma, ka a bụrụ onye ahụ ọnụ.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “kwusara unu ozi ọma.” Greek ji ngwaa pụtara “izisa ozi ọma.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “dị iche na nke anyị zisasịrị unu ozi ọma,” ma ọ bụ “gafere nke anyị zisasịrị unu ozi ọma.”
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “ka onye ahụ nọrọ n’okpuru ọbụbụ ọnụ,” ma ọ bụ “ka onye ahụ bụrụ anatema.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ καὶ ἐὰν
  choice: Ma ọ bụrụgodị na
  rationale: Nke a na-egosipụta ntụgharị siri ike nke ἀλλά na nkwusi ike nke καί n’ụzọ Igbo dị eke.
- source_word: ἡμεῖς ἢ ἄγγελος ἐξ οὐρανοῦ
  choice: anyị onwe anyị ma ọ bụ mmụọ ozi si n’eluigwe
  rationale: “Anyị onwe anyị” na-echekwa nkwusi ike dị na ἡμεῖς, ebe “mmụọ ozi si n’eluigwe” na-anọgide nso n’usoro na echiche Greek.
- source_word: εὐαγγελίζηται
  choice: ezisa unu ozi ọma
  rationale: Ọ na-asụgharị ngwaa Greek dịka omume izisa ozi ọma, kama ime ya naanị aha okpukpe pụrụ iche.
- source_word: παρ’ ὃ
  choice: megidere nke
  rationale: N’ọnọdụ a, ọ na-egosi ozi nke si n’ozi ndịozi ahụ wezuga onwe ya ma na-emegide ya; ndetu ala na-echekwa nghọta ndị ọzọ enwere ike.
- source_word: εὐηγγελισάμεθα
  choice: nke anyị ziri unu
  rationale: “Ziri unu” bụ okwu Igbo dị mkpirikpi ma doo anya maka izisa ozi e zisaworị, na-enweghị nkwugharị na-adịghị eke.
- source_word: ἀνάθεμα ἔστω
  choice: ka onye ahụ bụrụ onye a bụrụ ọnụ
  rationale: Nke a na-echekwa ịdị arọ nke nkwupụta ọbụbụ ọnụ ahụ n’Igbo doro anya, na-enweghị itinye nkọwa ụka e mechara guzobe.
theological_decisions:
- issue: Ihe usoro okwu ọbụbụ ọnụ Pọl pụtara
  choice: 'A sụgharịrị ya dịka ọbụbụ ọnụ dị adị: “ka onye ahụ bụrụ onye a bụrụ ọnụ.”'
  alternative: “Ka onye ahụ nọrọ n’okpuru ọbụbụ ọnụ,” ma ọ bụ iji okwu agbaziri “anatema.”
  rationale: Greek siri ike ma nwee ụda ikpe. Nsụgharị a na-echekwa ịdị arọ ya, ma ọ naghị ekpebi na ọ bụ naanị nchụpụ n’ọgbakọ ma ọ bụ tinye nkọwa ụka pụrụ iche.
- issue: Oke echiche nke παρ’ ὃ
  choice: “megidere nke”
  alternative: “dị iche na nke” ma ọ bụ “gafere nke”
  rationale: “Megidere” dabara n’ụda esemokwu nke amaokwu a, ebe ndetu ala na-ahapụ oghere maka obosara pụtara nke παρά.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. “Anyị onwe anyị” na-ebupụta nkwusi ike nke Greek; “mmụọ ozi,” “ozi ọma,” na “onye a bụrụ ọnụ” bụ okwu ndị nkịtị ga-aghọta n’enweghị ịdabere n’okwu nkà mmụta okpukpe siri ike.
