source:
  edition: SBLGNT
  text: Θαυμάζω ὅτι οὕτως ταχέως μετατίθεσθε ἀπὸ τοῦ καλέσαντος ὑμᾶς ἐν χάριτι Χριστοῦ εἰς ἕτερον εὐαγγέλιον,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/006.yaml
  text: I am astonished that you are so quickly deserting the one who called you in the grace of Messiah for a different gospel[c][b][a],
translation:
  language: ig
  text: Ọ na-eju m anya na unu na-ahapụ onye ahụ kpọrọ unu n’amara Mesaịa[a][b] ngwa ngwa otu a, wee tụgharịa gaa n’ozi ọma dị iche[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịtụgharị ya, “site n’amara Mesaịa.” Okwu mbu ụzọ Grik a nwere ike igosi ọnọdụ ma ọ bụ ụzọ e si mee ihe.
    reason: alternative_reading
  - marker: b
    text: N’asụsụ Grik, “Kraịst”; a sụgharịrị ya “Mesaịa” ebe a n’ihi na okwu ahụ na-arụ ọrụ dịka utu aha.
    reason: lexical_alternative
  - marker: c
    text: A pụkwara ịtụgharị ya, “ozi ọma ọzọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Θαυμάζω
  choice: Ọ na-eju m anya
  rationale: Nke a bụ okwu Igbo doro anya ma dị ndụ nke na-egosipụta oke ihe ijuanya na mwute Pọl, ọ bụghị naanị ịtụnanya nkịtị.
- source_word: οὕτως ταχέως
  choice: ji ngwa ngwa dị otu a
  rationale: Ọ na-edobe nkwusi ike dị n’otú ha si malite ịgbanwe ngwa ngwa n’ụzọ tụrụ Pọl n’anya.
- source_word: μετατίθεσθε
  choice: na-ahapụ ... na-echigharịkwuru
  rationale: Ngwakọta okwu abụọ a na-egosi ma isi n’ebe onye kpọrọ ha nọ wezuga onwe ha ma ịtụgharị gaa n’ebe ozi ọzọ dị; ọ na-ewepụta ike mmekọrịta dị na ngwaa Grik ahụ n’Igbo sitere n’okike.
- source_word: τοῦ καλέσαντος ὑμᾶς
  choice: onye ahụ kpọrọ unu
  rationale: Ọ na-edobe oku ahụ dịka ihe merela, ma ọ naghị etinye aha onye kpọrọ ha ebe Grik ekwughị ya kpọmkwem.
- source_word: ἐν χάριτι Χριστοῦ
  choice: n’amara Mesaịa ahụ
  rationale: “N’amara” na-anọ nso n’ụdị ἐν tinyere dative, ma na-ahapụ ohere ka e ghọta ya dịka ọnọdụ ma ọ bụ ụzọ e si kpọọ ha.
- source_word: Χριστοῦ
  choice: Mesaịa ahụ
  rationale: N’ebe a Χριστός na-arụ ọrụ dịka utu aha; “Mesaịa” na-eburu ihe okwu ahụ pụtara karịa nanị idegharị ya dịka aha.
- source_word: εἰς ἕτερον εὐαγγέλιον
  choice: na-echigharịkwuru ozi ọma dị iche
  rationale: “Na-echigharịkwuru” na-egosi mmegharị εἰς, ebe “dị iche” na-egosipụta ọdịiche ἕτερον nke amaokwu na-esonụ ga-akọwakwu.
theological_decisions:
- issue: Onye bụ “onye ahụ kpọrọ unu”
  choice: E debere ya dịka “onye ahụ kpọrọ unu” n’etinyeghị “Chineke” ma ọ bụ “Mesaịa” n’ahịrị bụ isi.
  alternative: “Chineke onye kpọrọ unu” ma ọ bụ “Mesaịa onye kpọrọ unu.”
  rationale: Grik dị nso anaghị akpọ onye ahụ aha kpọmkwem; nsụgharị a na-edobe njide onwe nke ederede na esemokwu nkọwa ya.
- issue: Uru ἐν n’okwu ἐν χάριτι Χριστοῦ
  choice: n’amara Mesaịa ahụ
  alternative: site n’amara Mesaịa ahụ
  rationale: ἐν nwere ike igosi ọnọdụ ma ọ bụ ụzọ/ngwa e si mee ihe; ahịrị bụ isi na ndetu ala na-edobe ohere abụọ ahụ.
translation_notes:
  register: E jiri Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-edobe ụda ịtụnanya na mwute Pọl, njikọ nke ịhapụ onye kpọrọ ha na ịtụgharị gaa n’ozi ọzọ, yana ihe na-edoghị anya banyere onye kpọrọ ha na uru ἐν.
