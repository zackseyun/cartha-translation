  yaml_path: translation/nt/galatians/001/024.yaml
  text: And they glorified God because of me[a].
translation:
  language: ig
  text: Ha na-enyekwa Chineke otuto n’ihi m[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n’ụzọ nkịtị, “n’ime m.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: nọkwa na
  rationale: Ọ na-ejikọta amaokwu a na akụkọ bu ya ụzọ; n’Igbo, “-kwa” na-eme ka njikọ a daa n'ụzọ ebumpụta ụwa.
- source_word: ἐδόξαζον
  choice: na-enye ... otuto
  rationale: Okwu a pụtara inye otuto ma ọ bụ nsọpụrụ. Usoro “na-enye” na-egosipụta omume na-aga n’ihu ma ọ bụ na-eme ugboro ugboro dị n’ụdị imperfect Grik.
- source_word: ἐν ἐμοὶ
  choice: n’ihi m
  rationale: N’ebe a, ọ na-egosi ihe kpatara ha ji too Chineke—ihe ha nụrụ banyere ihe Chineke mere n’ihe gbasara Pọl. A hapụrụ nsụgharị nkịtị “n’ime m” n’ala ala peeji.
- source_word: τὸν θεόν
  choice: Chineke
  rationale: Ọ bụ ihe omume ngwaa ahụ metụtara kpọmkwem; “Chineke” bụ nsụgharị Igbo kwesịrị ekwesị.
theological_decisions:
- issue: Ihe ἐν ἐμοὶ pụtara
  choice: n’ihi m
  alternative: n’ime m
  rationale: Ihe gbara amaokwu a gburugburu na-egosi na ọgbakọ ndị ahụ nyere Chineke otuto n’ihi akụkọ banyere mgbanwe ndụ Pọl na ozi ya. Ma ebe ἐν pụkwara ịpụta “n’ime,” e debere nhọrọ ahụ n’ala ala peeji ka e ghara iwepụ nghọta ọzọ dị n’usoro Grik.
translation_notes:
  register: Igbo ọkọlọtọ nke dị ugbu a, dị ugwu ma dị mfe nghọta. “Na-enye ... otuto” na-edobe echiche nke δοξάζω, ebe “n’ihi m” na-eme ka mmekọrịta kpatara ihe doo anya n’enweghị itinye nkọwa ụka pụrụ iche.
