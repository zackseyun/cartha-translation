id: GAL.1.16
reference: Galatians 1:16
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀποκαλύψαι τὸν υἱὸν αὐτοῦ ἐν ἐμοὶ ἵνα εὐαγγελίζωμαι αὐτὸν ἐν τοῖς ἔθνεσιν, εὐθέως οὐ προσανεθέμην σαρκὶ καὶ αἵματι,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/016.yaml
  text: to reveal his Son in me[a], so that I might proclaim him among the Gentiles, I did not immediately consult with flesh and blood[b],
translation:
  language: ig
  text: ikpughe Ọkpara ya n’ime m[a], ka m wee kwusaa ya n’etiti ndị mba ọzọ. Ajụghị m anụ ahụ na ọbara ndụmọdụ ozugbo[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “nye m,” ma ọ bụ, “site n’aka m.”
    reason: alternative_reading
  - marker: b
    text: “Anụ ahụ na ọbara” bụ akpaalaokwu pụtara mmadụ ma ọ bụ ndị mmadụ.
    reason: cultural_note
lexical_decisions:
- source_word: ἀποκαλύψαι
  choice: ikpughe
  rationale: “Ikpughe” na-egosi ime ka ihe zoro ezo pụta ìhè, ma na-echekwa echiche nke mkpughe sitere n’aka Chineke.
- source_word: τὸν υἱὸν αὐτοῦ
  choice: Ọkpara ya
  rationale: Nke a bụ ụzọ Igbo doro anya ma dị ugwu isi debe aha mmekọrịta ahụ na ihe ọ pụtara banyere Kraịst.
- source_word: ἐν ἐμοὶ
  choice: n’ime m
  rationale: 'Ntụgharị nkịtị a na-echekwa mgbagwoju anya dị na Greek: ọ pụrụ ịpụta mkpughe n’ime Pọl, nye Pọl, ma ọ bụ site n’aka Pọl.'
- source_word: ἵνα εὐαγγελίζωμαι αὐτὸν
  choice: ka m wee kwusaa ya
  rationale: “Kwusaa ya” na-edebe Ọkpara ahụ n’onwe ya dị ka ihe e ji ngwaa ahụ mee, kama ịgbasa ya gaa na “ozi ọma banyere ya.”
- source_word: ἐν τοῖς ἔθνεσιν
  choice: n’etiti ndị mba ọzọ
  rationale: N’ọnọdụ akwụkwọ Pọl a, okwu a na-ezo aka n’ebe ndị na-abụghị ndị Juu nọ; “ndị mba ọzọ” bụ okwu Igbo a na-aghọta nke ọma.
- source_word: εὐθέως
  choice: ngwa ngwa
  rationale: Ọ na-egosi na ihe a emeghị ozugbo, n’ụzọ dị mfe ma kwekọọ n’Igbo ugbu a.
- source_word: οὐ προσανεθέμην
  choice: Emeghị m ngwa ngwa ka mụ na ... gbaa izu
  rationale: “Ịgba izu” ebe a na-egosi ịjụ mmadụ uche ma ọ bụ iso ya tụlee okwu, nke dabara n’echiche ngwaa Greek ahụ.
- source_word: σαρκὶ καὶ αἵματι
  choice: anụ ahụ na ọbara
  rationale: E debere akpaalaokwu Pọl n’ụdị ya doro anya, ebe nkọwa ala peeji na-akọwa na ọ pụtara mmadụ ma ọ bụ ụmụ mmadụ.
theological_decisions:
- issue: Ihe ἐν ἐμοὶ pụtara n’ihe banyere mkpughe Ọkpara ahụ
  choice: Idobe “n’ime m” n’ahịrịokwu bụ isi
  alternative: “nye m” ma ọ bụ “site n’aka m”
  rationale: Greek ahụ nwere ike ịpụta mkpughe dị n’ime Pọl, mkpughe e nyere Pọl, ma ọ bụ mkpughe sitere n’aka ya ruo ndị ọzọ. Ntụgharị ahụ anaghị ekpebi otu nkọwa naanị.
translation_notes:
  register: Ejiri Standard Igbo dị ugbu a, dị ugwu ma dị mfe nghọta. E debere akpaalaokwu na mgbagwoju echiche nke Greek, ma tinye nkọwa ebe ọ dị mkpa.
