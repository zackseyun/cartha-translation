    reason: cultural_note
  revision_rationale: The revision replaces “ịgba izu” with the unambiguous expression “ịjụ ... ndụmọdụ,” which faithfully conveys Paul’s statement that he did not immediately consult human beings. It retains the Greek idiom “anụ ahụ na ọbara” in the main text, as well as the ambiguity of “n’ime m” and the existing footnote alternatives.
