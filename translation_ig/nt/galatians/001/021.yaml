  text: ἔπειτα ἦλθον εἰς τὰ κλίματα τῆς Συρίας καὶ τῆς Κιλικίας.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/021.yaml
  text: Then I went into the regions of Syria and Cilicia[a][b].
translation:
  language: ig
  text: Mgbe nke ahụ gasịrị, agara m n’ógbè Siria na Silisia.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “M bịara n’ógbè Siria na Silisia.”
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị “ógbè” dịka “mpaghara.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔπειτα
  choice: Mgbe nke ahụ gasịrị
  rationale: Ọ na-egosi ihe sochiri ihe ọzọ n’akụkọ Pọl, ma na-ada nke ọma n’Igbo ugbu a.
- source_word: ἦλθον
  choice: agara m
  rationale: Ọ bụ ezie na ngwaa Grik ahụ nwere ike ịpụta ‘abịara m,’ ebe a ọ na-akọ njem Pọl si n’ebe ọ nọ gaa ebe ọzọ; ‘agara m’ bụ ụzọ Igbo si ekwu ya nke ọma.
- source_word: εἰς
  choice: n’
  rationale: N’usoro okwu Igbo a, ‘n’ógbè’ na-egosi ịbanye ma ọ bụ ịga n’ebe ndị ahụ; ihe ọzọ e nwere ike ikwu bụ ‘gaa n’ógbè.’
- source_word: κλίματα
  choice: ógbè ndị dị na
  rationale: Ọ na-ezo aka n’akụkụ ala ma ọ bụ mpaghara dị iche iche, ọ bụghị naanị otu obodo. ‘Ógbè ndị dị na’ doro ndị na-agụ Igbo anya.
- source_word: Συρίας
  choice: Siria
  rationale: Ụdị aha ebe a na-ejikarị ede n’Igbo.
- source_word: Κιλικίας
  choice: Silisia
  rationale: Nsụgharị mkpụrụokwu aha Κιλικία dabara n’usoro ụda na odide Igbo.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị mfe nghọta ma dịkwa nsọpụrụ. E debere usoro oge nke akụkọ ahụ na ọtụtụ ‘ógbè’ nke κλίματα; aha ebe ndị ahụ bụ Siria na Silisia.
