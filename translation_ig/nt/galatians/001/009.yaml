  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὡς προειρήκαμεν, καὶ ἄρτι πάλιν λέγω, εἴ τις ὑμᾶς εὐαγγελίζεται παρ’ ὃ παρελάβετε, ἀνάθεμα ἔστω.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/009.yaml
  text: 'As we have said before[a], so now I say again: if anyone is preaching a gospel to you contrary to what you received[b], let him be accursed.'
translation:
  language: ig
  text: 'Dị ka anyị kwuburu, ugbu a ana m ekwukwa ọzọ: ọ bụrụ na onye ọ bụla na-ekwusara unu ozi ọma nke megidere ihe unu natara[a], ka onye ahụ bụrụ onye a bụrụ ọnụ.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “nke gafere ihe unu natara”; nkebiokwu Grik ahụ pụrụ ịpụta ihe dị iche na, ma ọ bụ nke gafere, ihe unu natara.
    reason: lexical_alternative
  - marker: b
    text: 'Ma ọ bụ, “ka onye ahụ nọrọ n’okpuru ọbụbụ ọnụ.” N’asụsụ Grik: ἀνάθεμα ἔστω.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς προειρήκαμεν
  choice: Dị ka anyị kwuburu
  rationale: “Kwuburu” na-egosi na e kwelarị ihe ahụ na mbụ, ebe “dị ka” na-echekwa njikọ ntụnyere dị na ὡς.
- source_word: ἄρτι πάλιν λέγω
  choice: ugbu a ana m ekwukwa ọzọ
  rationale: “Ugbu a” na-echekwa ἄρτι, ebe “ekwukwa ọzọ” na-egosi nkwughachi dị na πάλιν n’Igbo dị n’usoro eke.
- source_word: εἴ τις ὑμᾶς εὐαγγελίζεται
  choice: Ọ bụrụ na onye ọ bụla na-ekwusara unu ozi ọma
  rationale: “Na-ekwusara unu ozi ọma” na-echekwa ọrụ ngwaa εὐαγγελίζεται na ntụaka ya n’ozi ọma a na-ekwusa.
- source_word: παρ’ ὃ
  choice: nke megidere ihe
  rationale: N’ebe a, παρά na-egosi isi n’ozi ahụ ha natara wezuga onwe ya ma ọ bụ imegide ya; “megidere ihe” na-echekwa ike ịdọ aka ná ntị ahụ, ebe a kọwara nhọrọ ọzọ n’ala peeji.
- source_word: παρελάβετε
  choice: unu natara
  rationale: “Natara” bụ okwu Igbo doro anya maka ịnata ozi ma ọ bụ nkuzi e nyefere mmadụ.
- source_word: ἀνάθεμα ἔστω
  choice: ka onye ahụ bụrụ onye a bụrụ ọnụ
  rationale: Usoro “ka ... bụrụ” na-echekwa iwu ma ọ bụ ikpe dị na ἔστω, ebe “onye a bụrụ ọnụ” na-egosipụta ịdị arọ nke ἀνάθεμα n’enweghị ịgbakwụnye nkọwa ozizi na-adịghị na Grik.
theological_decisions:
- issue: Ike ikpe dị na ἀνάθεμα ἔστω
  choice: ka onye ahụ bụrụ onye a bụrụ ọnụ
  alternative: ka onye ahụ nọrọ n’okpuru ọbụbụ ọnụ
  rationale: Nhọrọ a na-echekwa ịdị njọ nke okwu Pọl ma ghara ịkọwapụta onye na-abụ ọnụ ma ọ bụ usoro ikpe ahụ karịa ihe odide Grik kwuru.
- issue: Mmekọrịta ozi ọzọ ahụ na ozi ndị Galetia natara
  choice: ozi ọma nke megidere ihe unu natara
  alternative: ozi ọma nke gafere ihe unu natara
  rationale: Ihe gbara amaokwu a gburugburu na-akwado echiche nke ozi na-emegide ma ọ bụ na-agbanwe ozi ha natara, ma a hapụrụ ohere nghọta “gafere” n’ala peeji iji chekwaa obosara παρά.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta, dee ya. “Na-ekwusara unu ozi ọma” bụ okwu ụka a maara nke ọma ma ka na-edo anya nye ndị na-agụ akwụkwọ nkịtị; “ka onye ahụ bụrụ onye a bụrụ ọnụ” na-echekwa ụda ikpe siri ike nke amaokwu ahụ.
