id: GAL.1.11
reference: Galatians 1:11
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Γνωρίζω ⸀γὰρ ὑμῖν, ἀδελφοί, τὸ εὐαγγέλιον τὸ εὐαγγελισθὲν ὑπ’ ἐμοῦ ὅτι οὐκ ἔστιν κατὰ ἄνθρωπον·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/011.yaml
  text: For I make known to you[a], brothers[b], that the gospel proclaimed by me is not according to man.
translation:
  language: ig
  text: N’ihi na ana m eme ka unu mara, ụmụnna[a], na ozi ọma ahụ m kwusara esiteghị n’aka mmadụ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Okwu Grik a sụgharịrị “ụmụnna” pụrụ ịgụnye ụmụnna nwoke na ụmụnna nwanyị.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ọ bụghị dịka ụkpụrụ mmadụ si dị.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Γνωρίζω ὑμῖν
  choice: ana m eme ka unu mara
  rationale: Nke a na-egosipụta echiche bụ́ ‘ana m eme ka unu mata’ n’Igbo doro anya ma dịkwa ebube, na-enweghị itinye ihe ọhụrụ n’okwu ahụ.
- source_word: γὰρ
  choice: N’ihi na
  rationale: Ọ na-ejikọta amaokwu a na ihe e kwuru tupu ya dị ka nkọwa ma ọ bụ ihe kpatara ya.
- source_word: ἀδελφοί
  choice: ụmụnna m
  rationale: ‘Ụmụnna’ bụ ụzọ nkịtị Pọl ga-esi kpọọ ndị otu okwukwe n’Igbo; n’ọnọdụ a, ọ pụrụ ịgụnye ma ndị nwoke ma ndị nwanyị.
- source_word: εὐαγγέλιον
  choice: ozi ọma
  rationale: Nke a bụ ntụgharị doro anya na nke ndị Igbo nke oge a na-aghọta nke ọma maka ozi ọma Pọl na-ekwusa.
- source_word: τὸ εὐαγγελισθὲν ὑπ’ ἐμοῦ
  choice: ahụ m kwusara
  rationale: ‘Kwusara’ na-echekwa echiche nke ikwupụta ozi ahụ n’ihu ọha, ebe ‘m’ na-egosi na ọ bụ Pọl kwusara ya.
- source_word: κατὰ ἄνθρωπον
  choice: esiteghị n’aka mmadụ
  rationale: 'N’ihi amaokwu na-esote, nkebiokwu a na-elekwasị anya n’isi mmalite ozi ahụ: Pọl anataghị ya n’aka mmadụ. Nkọwa ala peeji na-echekwa ihe ọzọ nkebiokwu Grik ahụ pụrụ ịpụta.'
theological_decisions:
- issue: Ma κατὰ ἄνθρωπον na-ekwu banyere ebe ozi ọma si malite ka ọ̀ bụ ụkpụrụ mmadụ
  choice: esiteghị n’aka mmadụ
  alternative: ọ bụghị dị ka mmadụ si eche ma ọ bụ dị ka ụkpụrụ mmadụ si dị
  rationale: N’amaokwu 12, Pọl kọwara na ọ nataghị ozi ọma ahụ n’aka mmadụ, mmadụ akụzighịkwa ya; ya mere, echiche banyere isi mmalite ya kacha daba n’ihe gbara amaokwu a gburugburu. Otú ọ dị, a hapụrụ echiche banyere ụkpụrụ mmadụ na nkọwa ala peeji.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị mfe nghọta ma dịkwa ebube. A họọrọ ‘ana m eme ka unu mara’ iji debe usoro Γνωρίζω ὑμῖν, ebe ‘esiteghị n’aka mmadụ’ na-eme ka isi okwu Pọl banyere mmalite ozi ọma doo anya n’enweghị iwepụ nghọta ọzọ dị na Grik.
