source:
  edition: SBLGNT
  text: οὐδὲ γὰρ ἐγὼ παρὰ ἀνθρώπου παρέλαβον αὐτό, ⸀οὔτε ἐδιδάχθην, ἀλλὰ δι’ ἀποκαλύψεως Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/012.yaml
  text: For I neither received it from a human source[a], nor was I taught it, but through a revelation of Jesus the Messiah.
translation:
  language: ig
  text: N’ihi na ọ bụghị n’aka mmadụ ka m natara ya, ọ dịghịkwa onye kụziiri m ya; kama ọ bụ site na mkpughe nke Jizọs bụ Mezaya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “site ná mkpughe banyere Jizọs bụ Mezaya.”
    reason: alternative_reading
lexical_decisions:
- source_word: παρὰ ἀνθρώπου
  choice: n’aka mmadụ
  rationale: “N’aka mmadụ” na-egosi na ozi ahụ esiteghị n’ebe mmadụ nọ ma ọ bụ site ná nnyefe mmadụ; “mmadụ” bụ otu mkpụrụokwu e ji ekwu banyere mmadụ n’ozuzu ya.
- source_word: παρέλαβον
  choice: anataghị m ya
  rationale: Ngwaa “ịnata” dabara n’ọnọdụ nnyefe ozi ma na-edobe nkwupụta Pọl na ọ nataghị ozi ọma ahụ site n’aka mmadụ.
- source_word: ἐδιδάχθην
  choice: ọ bụghịkwa mmadụ kụziiri m ya
  rationale: 'Nke a na-asụgharị echiche ngwaa ndabere ahụ n’Igbo dị mfe ma doo anya: Pọl enwetaghị ozi ahụ site n’ịbụ onye mmadụ kuziri.'
- source_word: δι’ ἀποκαλύψεως
  choice: site ná mkpughe
  rationale: “Site ná” na-egosi ụzọ e si nweta ozi ahụ, ebe “mkpughe” na-egosi omume ikpughe ihe e zoro ezo.
- source_word: Ἰησοῦ Χριστοῦ
  choice: sitere n’aka Jizọs bụ Mezaya
  rationale: N’isiokwu a, ụdị genitive ahụ nwere ike ịpụta na Jizọs bụ isi mmalite nke mkpughe ahụ ma ọ bụ na ọ bụ ihe mkpughe ahụ gbasara. Isi ederede họọrọ echiche isi mmalite n’ihi ntụnyere ya na isi mmalite mmadụ, ebe e debere echiche nke ọzọ n’ala peeji. “Mezaya” na-edobe Χριστός dị ka utu aha.
theological_decisions:
- issue: Ihe Ἰησοῦ Χριστοῦ pụtara n’okwu ἀποκαλύψεως Ἰησοῦ Χριστοῦ
  choice: Mkpughe sitere n’aka Jizọs bụ Mezaya
  alternative: Mkpughe banyere Jizọs bụ Mezaya
  rationale: Ihe gbara amaokwu ahụ gburugburu na-emesi ike na ozi ọma Pọl esiteghị n’aka mmadụ, ya mere echiche na Jizọs bụ isi mmalite ya dabara nke ọma. Ma asụsụ Grik nwekwara ike ịpụta na Jizọs bụ ihe mkpughe ahụ gbasara, ya mere e chekwara nke ahụ n’ala peeji.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. “Mụ onwe m” na-edobe nkwusi ike dị na ἐγὼ; usoro “ọ bụghịkwa mmadụ kụziiri m ya” bụ ụzọ Igbo ebumpụta ụwa si kwuo passive ahụ n’enweghị asụsụ siri ike.
