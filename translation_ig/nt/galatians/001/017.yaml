revisions:
- from: Agbagokwaghị m Jerusalem ka m gakwuru ndị bụ ndịozi tupu mụ onwe m aghọọ onyeozi; kama agara m Arebia, mesịa laghachi ọzọ na Damaskọs.
  to: Agbaghịkwa m Jerusalem ịgakwuru ndịozi ndị bu m ụzọ, kama agara m Arebia, laghachiri m ọzọ Damaskọs.
  rationale: The revision corrects the negation, removes the unsupported explanatory expansion concerning Paul's becoming an apostle, and preserves the Greek sequence and contrast in natural Standard Igbo. 'ndị bu m ụzọ' conveys that these apostles preceded Paul temporally without implying superior rank.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T19:28:50Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents the travel contrast, Arabia, and the return to Damascus. However, it expands πρὸ ἐμοῦ ('before me') into 'before I myself became an apostle.' Although that is a plausible contextual understanding, the Greek itself does not state Paul's becoming an apostle here, so the translation should retain the source's more concise wording.
  naturalness: The opening form 'Agbagokwaghị m' is not a secure Standard Igbo realization of the linked negation. 'Agbaghịkwa m' is natural and clearly carries 'nor did I go up.' The revised wording is concise, fluent, and maintains the formal register.
  terminology: '''ndịozi'' is the appropriate established term for ''apostles.'' The place names Arebia and Damaskọs are suitable Standard Igbo forms. ''ndịozi ndị bu m ụzọ'' naturally conveys temporal precedence without introducing hierarchy or an explicit interpretive gloss.'
  issues:
  - severity: medium
    issue: Interpretive expansion of πρὸ ἐμοῦ
    rationale: '''tupu mụ onwe m aghọọ onyeozi'' adds an event—Paul''s becoming an apostle—that is not expressed in this clause. ''ndịozi ndị bu m ụzọ'' preserves the temporal sense directly.'
  - severity: medium
    issue: Unnatural/incorrect linked-negation form
    rationale: '''Agbagokwaghị m'' should be revised to ''Agbaghịkwa m'' for idiomatic Standard Igbo and a clear equivalent of οὐδὲ.'
  - severity: low
    issue: Added sequential adverb 'mesịa'
    rationale: The Greek coordinates the actions with καί but does not explicitly say 'afterward.' It is safer to retain simple coordination.
  revised_text: Agbaghịkwa m Jerusalem ịgakwuru ndịozi ndị bu m ụzọ, kama agara m Arebia, laghachiri m ọzọ Damaskọs.
  revised_footnotes: []
  revision_rationale: The revision corrects the negation, removes the unsupported explanatory expansion concerning Paul's becoming an apostle, and preserves the Greek sequence and contrast in natural Standard Igbo. 'ndị bu m ụzọ' conveys that these apostles preceded Paul temporally without implying superior rank.
