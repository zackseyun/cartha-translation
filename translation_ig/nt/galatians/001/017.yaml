reference: Galatians 1:17
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οὐδὲ ἀνῆλθον εἰς Ἱεροσόλυμα πρὸς τοὺς πρὸ ἐμοῦ ἀποστόλους, ἀλλὰ ἀπῆλθον εἰς Ἀραβίαν, καὶ πάλιν ὑπέστρεψα εἰς Δαμασκόν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/017.yaml
  text: Nor did I go up to Jerusalem to those who were apostles before me, but I went away to Arabia, and returned again to Damascus.
translation:
  language: ig
  text: Agbaghịkwa m Jerusalem ịgakwuru ndịozi ndị bu m ụzọ, kama agara m Arebia, laghachiri m ọzọ Damaskọs.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐδὲ
  choice: Agbagokwaghị m
  rationale: Ngwakọta ‘-ghịkwa’ na-ejikọta nkwugide a na ihe a gọnahụrụ n'okwu bu ụzọ, ma na-ada ka Igbo nkịtị.
- source_word: ἀνῆλθον εἰς Ἱεροσόλυμα
  choice: Agbagokwaghị m Jerusalem
  rationale: ‘Gbago’ na-echekwa ụzọ e si ekwu njem ịga Jerusalem, tinyere echiche ịrịgo, n'Igbo dị mfe.
- source_word: πρὸς τοὺς πρὸ ἐμοῦ ἀποστόλους
  choice: ka m gakwuru ndị bụ ndịozi tupu mụ onwe m aghọọ onyeozi
  rationale: Nke a na-egosi na πρό bụ ịga ‘gakwuru,’ ebe πρὸ ἐμοῦ na-ekwu maka ndị ghọrọ ndịozi tupu Pọl, ọ bụghị na ha ka ya n'ọkwa.
- source_word: ἀλλὰ
  choice: kama
  rationale: ‘Kama’ na-egosipụta ọdịiche siri ike n'etiti ịghara ịga Jerusalem na ịga Arebia.
- source_word: ἀπῆλθον εἰς Ἀραβίαν
  choice: agara m Arebia
  rationale: ‘Agara m’ bụ ụzọ Igbo dị ndụ si akọ njem ahụ; echiche nke isi n'otu ebe pụọ pụtara ìhè site n'ọdịiche dị n'ahịrịokwu ahụ.
- source_word: πάλιν ὑπέστρεψα
  choice: mesịa laghachi ọzọ
  rationale: ‘Laghachi ọzọ’ na-echekwa ma echiche nlọghachi nke ὑπέστρεψα ma πάλιν; ‘mesịa’ na-eme ka usoro njem ahụ doo anya n'Igbo.
- source_word: Δαμασκόν
  choice: Damaskọs
  rationale: Nke a bụ nsụgharị mkpụrụokwu aha obodo ahụ n'ụdị Igbo a na-aghọta ngwa ngwa.
theological_decisions:
- issue: Ihe ‘tupu mụ onwe m’ pụtara banyere ndịozi
  choice: Ndị ghọrọ ndịozi tupu Pọl aghọọ onyeozi
  alternative: Ndịozi ka Pọl elu n'ọkwa
  rationale: πρὸ ἐμοῦ na-egosi ibute ụzọ n'oge karịa ịdị elu n'ọkwa. A kọwara ya n'Igbo ka oge o ji bụrụ onyeozi pụta ìhè, n'etinyeghị echiche banyere usoro ọchịchị ndịozi.
translation_notes:
  register: Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E ji ‘ndịozi’ mee apostolos, e jikwa usoro ahịrịokwu doro anya zere nghọtahie na ‘tupu mụ onwe m.’
