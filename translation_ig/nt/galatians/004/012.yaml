revisions:
- from: Ụmụnna m,[b] na-adịkwanụ ka mụ onwe m,[a] n’ihi na mụ onwe m dịkwa ka unu. Ana m arịọ unu nke a:[c] unu emejọghị m n’ihe ọ bụla.
  to: 'Ụmụnna,[b] ana m arịọ unu: bụrụnụ ka mụ onwe m,[a] n’ihi na mụ onwe m dịkwa ka unu.[c] Unu emejọghị m n’ihe ọ bụla.'
  rationale: The revision corrects the imperative’s aspectual sense, removes the unexpressed possessive from the address, and places the vocative and plea in a clear Igbo order. It retains “dịkwa ka unu” in the main text so that the Greek ellipsis remains open, while footnote c responsibly records the contextual past-oriented alternative without making it the sole meaning.
