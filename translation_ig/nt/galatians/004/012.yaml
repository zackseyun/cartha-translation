base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/012.yaml
  text: Become as I am[a], because I also am as you are, brothers; I beg you[c][b], you did me no wrong.
translation:
  language: ig
  text: 'Ụmụnna,[b] ana m arịọ unu: bụrụnụ ka mụ onwe m,[a] n’ihi na mụ onwe m dịkwa ka unu.[c] Unu emejọghị m n’ihe ọ bụla.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “dịnụ ka m.”
    reason: lexical_alternative
  - marker: b
    text: “Ụmụnna” n’ebe a na-agwa ndị obodo ndị kwere ekwe okwu, o yikwara ka ọ gụnyere ma ndị nwoke ma ndị nwanyị.
    reason: cultural_note
  - marker: c
    text: A pụkwara ịsị, “n’ihi na mụ onwe m abụrụkwala onye dị ka unu.” Grik ekwughachighị ngwaa n’akụkụ a, ya mere a pụrụ ịghọta ya dịka ọnọdụ dị ugbu a ma ọ bụ dịka ihe mere n’oge gara aga.
    reason: alternative_reading
lexical_decisions:
- source_word: Γίνεσθε
  choice: na-adịkwanụ
  rationale: Imperative a na-egosi ka ha banye ma nọgide n’ọnọdụ a; “na-adịkwanụ” na-enye iwu ahụ n’Igbo dị ndụ ma na-egosikwa ịdịgide.
- source_word: ὡς ἐγώ
  choice: ka mụ onwe m
  rationale: Na-echekwa ntụnyere ὡς ἐγώ n’enweghị ịkọwapụta kpọmkwem ihe ọnọdụ Pọl pụtara.
- source_word: ὅτι
  choice: n’ihi na
  rationale: Na-egosi ihe kpatara arịrịọ ahụ, dịka ọrụ ὅτι si dị ebe a.
- source_word: κἀγὼ ὡς ὑμεῖς
  choice: mụ onwe m dịkwa ka unu
  rationale: Na-echekwa nkebiokwu Grik nke na-enweghị ngwaa e kwuru ọzọ, ma na-eji “dị” mee ka ọ bụrụ Igbo zuru oke; ihe ọzọ nwere ike ịbụ “abụrụkwala m onye dị ka unu.”
- source_word: ἀδελφοί
  choice: Ụmụnna m
  rationale: Ọ bụ okwu a na-akpọ ndị otu okwukwe; “ụmụnna” bụ okwu Igbo nkịtị nke nwere ike ịgụnye ndị nwoke na ndị nwanyị, ebe “m” na-egosi ịhụnanya nke okwu a kpọrọ ha.
- source_word: δέομαι ὑμῶν
  choice: Ana m arịọ unu nke a
  rationale: Na-egosipụta arịrịọ siri ike n’asụsụ Igbo dị mma, na-enweghị iji okwu na-ada ka nke mgbe ochie.
- source_word: οὐδέν με ἠδικήσατε
  choice: unu emejọghị m n’ihe ọ bụla
  rationale: Na-edobe onye e mere ihe ahụ, με, ma na-egosipụta οὐδέν dị ka “n’ihe ọ bụla,” ya bụ na ha emejọghị ya ma ọlị.
theological_decisions:
- issue: Ihe ἀδελφοί gụnyere mgbe a na-agwa ọgbakọ Galetia okwu
  choice: Ụmụnna m
  alternative: Ụmụnne nwoke m; ụmụnna nwoke na nwanyị
  rationale: Ụdị Grik bụ ọtụtụ nwoke, ma n’okwu a ọ na-akpọkarị ọgbakọ niile, tinyere ụmụ nwanyị. “Ụmụnna” na Standard Igbo na-arụ ọrụ dịka okwu ezinụlọ sara mbara ma ghara itinye nkọwa otu okpukpe n’ime amaokwu ahụ.
- issue: Ngwaa a na-aghọta n’okwu κἀγὼ ὡς ὑμεῖς
  choice: mụ onwe m dịkwa ka unu
  alternative: mụ onwe m abụrụkwala onye dị ka unu
  rationale: Grik ekwughachighị ngwaa, ya mere ọ nwere ike ịpụta ọnọdụ dị ugbu a ma ọ bụ mgbanwe Pọl mere n’oge gara aga. Isi ederede na-edobe okwu ahụ nso n’ụdị Grik; ihe ọzọ dị na ndetu ala peeji ka e wee ghara idozi mgbagwoju anya ahụ n’amaghị ama.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. A họọrọ “ụmụnna” dịka okwu okike n’Igbo maka obodo okwukwe; ahịrịokwu nke abụọ na-echekwa nkenke na mgbagwoju anya nke Grik, ebe ndetu ala peeji na-enye nghọta ọzọ.
