  text: οὕτως καὶ ἡμεῖς, ὅτε ἦμεν νήπιοι, ὑπὸ τὰ στοιχεῖα τοῦ κόσμου ⸀ἤμεθα δεδουλωμένοι·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/003.yaml
  text: So also we[a], when we were children, were enslaved under the elemental principles of the world.
translation:
  language: ig
  text: N’otu aka ahụ kwa, mgbe anyị bụ ụmụaka, anyị bụ ndị e mere ohu n’okpuru ụkpụrụ ndị bụ isi nke ụwa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ike mmụọ ndị bụ isi nke ụwa.” Okwu Grik a pụrụ ịpụta ihe ma ọ bụ ụkpụrụ ndị bụ isi, ma ọ bụkwa ike mmụọ ndị na-achị n’ụwa.
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως καὶ
  choice: N’otu aka ahụkwa
  rationale: Na-egosi ntụnyere ya na ihe atụ banyere onye nketa nọ n’okpuru ndị nlekọta n’amaokwu ndị bu ụzọ, ma na-ada nke ọma n’Igbo.
- source_word: ἡμεῖς
  choice: anyị
  rationale: E debere nnọchiaha onye mbụ n'ụbara n'ụzọ doro anya, dịka e mesiri ya ike n'asụsụ Grik.
- source_word: ὅτε ἦμεν νήπιοι
  choice: mgbe anyị bụ ụmụaka
  rationale: Ọ na-egosi oge ha nọ n’ọnọdụ nke erughị ntozu, na-aga n’ihu n’ihe atụ nke onye nketa; ‘ụmụaka’ bụ okwu nkịtị ma ghara ime ka ọ bụrụ naanị ụmụ ọhụrụ.
- source_word: ὑπὸ
  choice: n’okpuru
  rationale: Na-echekwa onyinyo nke ịnọ n’okpuru ikike ma kwekọọ n’otú Pọl si eji okwu ahụ ugboro ugboro n'akụkụ a.
- source_word: τὰ στοιχεῖα τοῦ κόσμου
  choice: ụkpụrụ ndị mbụ nke ụwa
  rationale: στοιχεῖα nwere ike ịpụta ụkpụrụ ma ọ bụ ihe ndị bụ isi, ma nwekwara ike ịpụta ike mmụọ nke ụwa. Nhọrọ a dabara n’ihe gbasara erughị ntozu ma hapụ nkọwa nke ike mmụọ n’ala peeji.
- source_word: ἤμεθα δεδουλωμένοι
  choice: anyị nọ n’okpuru ịgba ohu
  rationale: Na-echekwa ike nke ihe e kwuru banyere ịbụ ndị e mere ohu, ma bụrụkwa usoro okwu doro anya ma dị ùgwù n’Igbo.
theological_decisions:
- issue: Ihe τὰ στοιχεῖα τοῦ κόσμου pụtara
  choice: A sụgharịrị ya n’isiokwu dị ka ‘ụkpụrụ ndị mbụ nke ụwa.’
  alternative: ‘ike mmụọ ndị mbụ nke ụwa’ ma ọ bụ ‘ihe ndị bụ isi nke ụwa.’
  rationale: Okwu ahụ nwere arụmụka n’akwụkwọ ndị Pọl. Ihe gbara ya gburugburu gbasara ụmụaka na usoro ndị na-achị ha na-akwado ‘ụkpụrụ ndị mbụ,’ ma o nwekwara ike izo aka n’ike mmụọ nke ụwa. Ala peeji ahụ na-echekwa nghọta ọzọ a n’enweghị idozi esemokwu ahụ n’amaghị ama.
translation_notes:
  register: Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E ji ‘n’okpuru ịgba ohu’ chekwaa okwu siri ike nke ịbụ ohu, ebe e debere ihe abụọ στοιχεῖα nwere ike ịpụta n’isiokwu na n’ala peeji.
