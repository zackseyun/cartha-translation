- from: Kama, ọ nọ n'okpuru ndị na-elekọta ya na ndị na-elekọta ihe onwunwe[a] ruo n'oge nna ya kara aka.[b]
  to: Kama, ọ nọ n'okpuru ndị nlekọta ya na ndị na-elekọta ihe onwunwe[a] ruo n'oge nna ya kara aka.[b]
  rationale: 'The revision retains every element of the Greek and the English audit trail: adversative contrast, subjection to guardians and estate managers, and the father''s appointed time. It improves the lexical distinction between the two supervisory roles and replaces an unnatural footnote alternative with idiomatic Standard Igbo. The father’s role in fixing the time remains contextual and does not add theological interpretation.'
  reviewer_model: gpt-5.6-terra
