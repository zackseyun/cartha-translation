  text: ἀλλὰ ὑπὸ ἐπιτρόπους ἐστὶ καὶ οἰκονόμους ἄχρι τῆς προθεσμίας τοῦ πατρός.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/002.yaml
  text: but he is under guardians and stewards until the time set by his father[a][b].
translation:
  language: ig
  text: Kama, ọ nọ n'okpuru ndị nlekọta ya na ndị na-elekọta ihe onwunwe[a] ruo n'oge nna ya kara aka.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “ndị na-ahụ maka ụlọ ma ọ bụ ala”; okwu Grik ahụ na-ezo aka ná ndị na-elekọta ụlọ, ala, ma ọ bụ ihe onwunwe.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụ ya, “ruo n’oge nna ya kpebiri.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Kama
  rationale: 'Ọ na-egosi ntụgharị megide ihe e kwuru n’amaokwu bu ụzọ: n’agbanyeghị na nwata ahụ bụ onye nketa, ọ ka nọ n’okpuru ndị ọzọ.'
- source_word: ὑπὸ
  choice: n’okpuru
  rationale: N’ebe a ọ pụtara ịnọ n’okpuru ikike na nlekọta mmadụ; okwu Igbo a na-echekwa ihe atụ ahụ nke ọma.
- source_word: ἐπιτρόπους
  choice: ndị na-elekọta ya
  rationale: Ọ na-ezo aka ná ndị e nyere ọrụ ilekọta nwata na-erubeghị afọ; ịtinye ‘ya’ na-eme ka ọdịiche dị n’etiti nlekọta nwata ahụ na nlekọta ihe onwunwe doo anya.
- source_word: ἐστὶ
  choice: ọ nọ
  rationale: Onye a na-ekwu banyere ya bụ onye nketa e kwuru okwu ya n’amaokwu bu ụzọ; ‘ọ nọ’ bụ ụzọ Igbo dị ndụ isi kwuo ọnọdụ ya.
- source_word: καὶ
  choice: na
  rationale: Ọ na-ejikọta ìgwè abụọ ahụ n’ụzọ dị mfe.
- source_word: οἰκονόμους
  choice: ndị na-elekọta ihe onwunwe
  rationale: Okwu Grik ahụ na-ezo aka ná ndị na-elekọta ihe gbasara ụlọ ma ọ bụ ala na akụ ya; nsụgharị a doro onye Igbo nke oge a anya.
- source_word: ἄχρι
  choice: ruo
  rationale: Ọ na-egosi ebe oge ọnọdụ ahụ ga-akwụsị.
- source_word: τῆς προθεσμίας
  choice: n’oge ... kara aka
  rationale: Ọ na-egosi oge e kpebiri ma ọ bụ e debeere tupu oge ahụ eruo.
- source_word: τοῦ πατρός
  choice: nna ya kara aka
  rationale: N’ime ihe atụ ezinụlọ a, nna onye nketa bụ onye na-ekpebi oge ahụ; ‘nna ya’ na-egosi njikọ ahụ n’ụzọ Igbo sitere n’okike.
theological_decisions:
- issue: Ihe genitive τοῦ πατρός pụtara
  choice: 'A sụgharịrị ya dị ka nna onye nketa bụ onye kara oge ahụ aka: ‘nna ya kara aka.’'
  alternative: 'A pụrụ ịsụ ya n’ụzọ na-esochikwu usoro Grik: ‘oge a kara aka nke nna ahụ.’'
  rationale: Ihe atụ Pọl ji bụ nke nwata bụ onye nketa nọ n’okpuru nlekọta ruo oge nna ya kpebiri. Nhọrọ a na-eme ka Igbo bụrụ nke sitere n’okike, ma ihe odide ala ala peeji na-echekwa ụzọ ọzọ e nwere isi ghọta njikọ okwu ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ugwu ma dị mfe nghọta. E kewapụrụ ọrụ ndị na-elekọta nwata na nke ndị na-elekọta ihe onwunwe, dịka okwu Grik abụọ ahụ si dị; e zere okwu ụka pụrụ iche ma ọ bụ nkọwa okwukwe agbakwunyere.
