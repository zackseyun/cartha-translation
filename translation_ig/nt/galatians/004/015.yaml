base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/015.yaml
  text: Where then is your blessedness? For I testify to you that[a], if possible[b], you would have torn out your eyes and given them to me.
translation:
  language: ig
  text: Oleezi ebe ngọzi unu dị ugbu a? N’ihi na ana m agba unu akaebe na, a sị na ọ ga-ekwe omume, unu gaara aghụpụ anya unu nye m.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N'ụzọ nkịtị, “mgbe unu ghụpụrụ anya unu.” O nwere ike ịbụ ikwubiga okwu ókè iji gosi otú unu si hụ Pọl n’anya n’oge ahụ; ụfọdụ na-ahụkwa ya dịka ihe nwere ike ịtụ aka n’ahụhụ dị n’ahụ Pọl.
    reason: lexical_alternative
lexical_decisions:
- source_word: ποῦ οὖν
  choice: Oleezi ebe ... nọ?
  rationale: Ajụjụ nkwupụta a na-ajụ ihe mere ọnọdụ ha mbụ; “-zi” na-egosipụta ike οὖν n'Igbo dị ndụ.
- source_word: μακαρισμὸς ὑμῶν
  choice: ngọzi ahụ unu nwere
  rationale: Nke a na-egosipụta ọnọdụ ma ọ bụ nghọta ha na ha bụ ndị a gọziri agọzi, n'enweghị ime ya naanị ‘ọṅụ.’
- source_word: μαρτυρῶ γὰρ ὑμῖν
  choice: Ana m agba unu akaebe na
  rationale: Na-echekwa ụda siri ike nke ịgba akaebe ma jikọta ὅτι dịka ihe akaebe ahụ kwuru.
- source_word: εἰ δυνατὸν
  choice: a sị na ọ ga-ekwe omume
  rationale: Na-egosipụta ọnọdụ a na-apụghị imezu n'ọnọdụ gara aga n'Igbo eke.
- source_word: τοὺς ὀφθαλμοὺς ὑμῶν ἐξορύξαντες
  choice: unu gaara aghụpụ anya unu
  rationale: Na-edobe ihe oyiyi doro anya ma sie ike nke ἐξορύσσω kama ime ka ọ bụrụ naanị inye ihe niile.
- source_word: ἐδώκατέ μοι
  choice: nye m
  rationale: Ihe a ga-enye bụ ‘anya unu’ e kwuru ozugbo tupu ya, ya mere Igbo achọghị nnọchiaha ọzọ.
theological_decisions:
- issue: Ma okwu banyere ịghụpụ anya ọ̀ bụ naanị ikwu banyere mmesapụ aka, ka ọ̀ na-atụkwa aka n'ọrịa Pọl
  choice: E debere ihe oyiyi ahụ n'ụzọ nkịtị n'ahịrịokwu bụ isi.
  alternative: “Unu gaara enye m ihe ọ bụla unu nwere.”
  rationale: Grik kpọrọ anya aha ma jiri ngwaa siri ike; nsụgharị ekwesịghị ikpebi ma ọ bụ naanị ikwubiga okwu ókè, ka ọ na-atụkwa aka n'ọnọdụ ahụ Pọl nọ na ya.
translation_notes:
  register: Standard Igbo dị ugbu a, dị nsọ ma dị mfe nghọta. E jiri “ngọzi ahụ unu nwere” chekwaa obosara μακαρισμός; e zere okwu ụka nke otu òtù pụrụ iche.
