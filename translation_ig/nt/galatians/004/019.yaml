base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/019.yaml
  text: My children[a], for whom I am again suffering birth pains until Messiah is formed in you[c][b],
translation:
  language: ig
  text: Ụmụ m, ndị m na-enwekwa ihe mgbu ịmụ nwa n’ihi unu, ruo mgbe e kpụrụ Mezaya[a] n’ime unu[b].[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “Kraịst.” “Mezaya” bụ ntụgharị aha-ọkwa Χριστός; “Kraịst” bụkwa ụdị okwu ndị na-agụ Akwụkwọ Nsọ maara nke ọma.
    reason: alternative_reading
  - marker: b
    text: A pụkwara ịsị, “n’etiti unu,” nke na-eme ka echiche banyere unu dịka otu obodo pụta ìhè.
    reason: lexical_alternative
  - marker: c
    text: 'N’ụzọ okwu Grik siri kwuo ya kpọmkwem: “Ana m enwe ihe mgbu ịmụ nwa ọzọ,” ma ọ bụ “Ana m anọ n’ime ime ọzọ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: τέκνα μου
  choice: Ụmụ m
  rationale: Ọ bụ okwu ịkpọ ndị ọ na-agwa nke na-egosi ịhụnanya. “Ụmụ m” bụ Igbo kwụ ọtọ ma dịkwa mma; ịgbakwunye “ụmụntakịrị” ga-etinye echiche na-adịghị kpọmkwem n’okwu Grik.
- source_word: οὓς
  choice: unu ndị ... n’ihi unu
  rationale: Nnọchiaha a bụ ihe omume ὠδίνω metụtara. N’Igbo, “n’ihi unu” na-eme ka ihe atụ nke ihe mgbu ịmụ nwa doo anya n’enweghị ahịrịokwu gbagọrọ agbagọ.
- source_word: πάλιν
  choice: ọzọ
  rationale: Ọ na-egosi na ahụhụ a na-emegharị ọzọ.
- source_word: ὠδίνω
  choice: m na-anọ ọzọ n’ihe mgbu ịmụ nwa
  rationale: Nke a na-echekwa ihe atụ Pọl ji mee onwe ya dịka nne nọ n’ihe mgbu ịmụ nwa, ma na-ada ka Igbo mmadụ na-asụ ugbu a.
- source_word: μέχρις οὗ
  choice: ruo mgbe
  rationale: Ọ na-egosi ókè oge ma ọ bụ ihe a na-ele anya ka o mezuo.
- source_word: μορφωθῇ
  choice: e kpụrụ
  rationale: Ụdị a na-echekwa olu nnara nke ngwaa Grik na echiche nke ime ka ihe nweta ọdịdị, n’enweghị ịkọwa ihe atụ ahụ dịka ozizi teknụzụ.
- source_word: Χριστὸς
  choice: Mezaya
  rationale: Χριστός bụ aha-ọkwa nke Onye E Tere Mmanụ; “Mezaya” na-eme ka ọrụ aha-ọkwa ahụ pụta ìhè. “Kraịst” ka edebere n’okpuru dịka okwu ọzọ ndị na-agụ Akwụkwọ Nsọ maara nke ọma.
- source_word: ἐν ὑμῖν
  choice: n’ime unu
  rationale: Nke a na-enye echiche mbụ nke imepụta n’ime ndị kwere ekwe, ebe “unu” bụ ọtụtụ ma ka na-ahapụkwa echiche nke obodo ha ọnụ.
theological_decisions:
- issue: Ihe “e kpụrụ Mezaya n’ime unu” pụtara
  choice: E chekwara ihe atụ Pọl nke Mezaya na-enweta ọdịdị n’ime ndị Galeshia, n’akọwaghị usoro ozizi pụrụ iche.
  alternative: A pụrụ ịghọta ya dịka Mezaya na-enweta ọdịdị n’etiti ha dịka otu obodo, ma ọ bụ dịka ihe oyiyi ọmụmụ ọhụrụ.
  rationale: Grik ahụ nwere ike ibu echiche nke onye ọbụla nakwa nke ọgbakọ dum. Nsụgharị ahụ na-echekwa esemokwu na obosara echiche a kama idozi ya n’otu ụzọ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E chekwara ihe atụ siri ike nke ịmụ nwa, olu nnara dị na μορφωθῇ, na ma echiche nke onye n’otu n’otu ma nke obodo dị na ἐν ὑμῖν.
