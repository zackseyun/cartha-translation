id: GAL.4.6
reference: Galatians 4:6
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὅτι δέ ἐστε υἱοί, ἐξαπέστειλεν ὁ θεὸς τὸ πνεῦμα τοῦ υἱοῦ αὐτοῦ εἰς τὰς καρδίας ⸀ἡμῶν, κρᾶζον· Αββα ὁ πατήρ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/006.yaml
  text: And because you are sons[a], God sent the Spirit of his Son into our hearts, crying, “Abba[c][b], Father.”
translation:
  language: ig
  text: Ma n’ihi na unu bụ ụmụ[b], Chineke zitere Mmụọ nke Nwa ya n’ime obi anyị[a], na-eti mkpu, sị, “Abba[c], Nna!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ụfọdụ ihe odide ochie nwere ‘obi unu’ kama ‘obi anyị.’
    reason: textual_variant
  - marker: b
    text: Okwu Grik a sụgharịrị ‘ụmụ’ bụ okwu nwoke ọtụtụ nke na-edobe asụsụ Pọl banyere ịnabata mmadụ dị ka nwa na inweta ihe nketa; n’ebe a ọ na-agụnye ndị niile kwere ekwe, ọ bụghị naanị ndị nwoke.
    reason: cultural_note
  - marker: c
    text: Abba bụ okwu Aramaik e ji akpọ ‘Nna’; e debere ya ebe a iji chekwaa nkwusi ike na mmekọrịta chiri anya dị n’okwu mbụ ahụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι δέ
  choice: Ma ebe ọ bụ na
  rationale: Nkebi a na-ejikọta okwu ahụ na nke bu ya ụzọ ma na-egosi ihe kpatara ihe na-esote; okwu Igbo a na-eme ha abụọ n'ụzọ doro anya.
- source_word: ἐστε
  choice: unu bụ
  rationale: Oge ugbu a nke εἰμί na-ekwu maka ọnọdụ ndị a na-agwa okwu dị ugbu a, ọ bụghị na ha ka ghọrọ ya.
- source_word: υἱοί
  choice: ụmụ nwoke
  rationale: Nke a na-edobe okwu Pọl kpọmkwem banyere ịbụ ụmụ nwoke, nke jikọtara ebe a na ikuchi mmadụ dị ka nwa na ihe nketa; ọ na-emetụta ndị niile kwere ekwe, ọ bụghị naanị ndị nwoke.
- source_word: ἐξαπέστειλεν
  choice: zitere
  rationale: Ọ na-egosi omume Chineke mezuru; ‘zitere’ bụ okwu Igbo dị mfe ma kwekọọ n’ike ngwaa ahụ.
- source_word: τὸ πνεῦμα τοῦ υἱοῦ αὐτοῦ
  choice: Mmụọ nke Nwa ya
  rationale: Nke a na-edobe njikọ dị n’etiti Mmụọ ahụ na Nwa Chineke n’enweghị itinye echiche ‘ọkpara’ nke na-adịghị kpọmkwem n’okwu Grik a.
- source_word: εἰς τὰς καρδίας ἡμῶν
  choice: n’ime obi anyị
  rationale: Nke a na-asụgharị ahịrịokwu ahụ ozugbo ma na-edobe ‘obi’ dị ka okwu Akwụkwọ Nsọ maka ime mmadụ.
- source_word: κρᾶζον
  choice: Mmụọ ahụ na-eti mkpu, sị
  rationale: Ọdịdị participle ahụ dabara na πνεῦμα, ya mere e mere ka o doo anya n’Igbo na ọ bụ Mmụọ ahụ na-eti mkpu, ma debe ịdị ndụ na ike nke okwu ahụ.
- source_word: Αββα
  choice: Aba
  rationale: A hapụrụ okwu Aramaik ahụ dịka aha-akpọ translitere n’Igbo iji chekwaa ụda na nkwusi ike mbụ ya.
- source_word: ὁ πατήρ
  choice: Nna
  rationale: Ọ bụ okwu a na-akpọ mmadụ ozugbo; ‘Nna’ bụ ụzọ Igbo nkịtị na nke kwesịrị nsọpụrụ si kwuo ya.
theological_decisions:
- issue: Ịsụgharị υἱοί n’ọnọdụ ikuchi nwa na ihe nketa
  choice: ụmụ nwoke
  alternative: ụmụ
  rationale: Arụmụka Pọl na Ndị Galeshia 3–4 dabere n’ọnọdụ nwa nwoke nke nwere ihe nketa. ‘Ụmụ nwoke’ na-edobe ihe iwu na nkà mmụta okpukpe dị n’okwu ahụ, ebe nkọwa ala peeji na-eme ka o doo anya na ndị niile kwere ekwe so na ya.
- issue: Ọdịiche ederede n’okwu nnọchiaha nke so ‘obi’
  choice: obi anyị
  alternative: obi unu
  rationale: SBLGNT e nyere nwere ἡμῶν, ‘anyị,’ ya mere nke ahụ ka ederede bụ isi soro. E debere ‘unu’ n’ala peeji n’ihi ọdịiche ederede a maara nke ọma.
- issue: Onye na-eti mkpu
  choice: Mmụọ ahụ bụ onye na-eti mkpu
  alternative: ndị kwere ekwe na-eti mkpu site na Mmụọ
  rationale: κρᾶζον bụ neuter singular nke dabara kpọmkwem na τὸ πνεῦμα, ya mere Mmụọ ahụ bụ onye e kwuru n’ụtọ asụsụ na ọ na-eti mkpu, ọ bụ ezie na nke a gụnyekwara ịkpọku Nna nke ndị kwere ekwe site na Mmụọ.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị mfe ma nwee nsọpụrụ. E zere okwu ụka pụrụ iche ebe ha nwere ike itinye nkọwa na-adịghị n’asụsụ Grik; ya mere a họọrọ ‘Nwa ya’ kama ‘Ọkpara ya.’ E kwughachiri ‘Mmụọ ahụ’ iji mee ka onye na-eti mkpu doo anya n’Igbo.
