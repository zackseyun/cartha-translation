  text: ὥστε οὐκέτι εἶ δοῦλος ἀλλὰ υἱός· εἰ δὲ υἱός, καὶ κληρονόμος ⸂διὰ θεοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/007.yaml
  text: So you are no longer a servant but a son[a]; and if a son[b], then also an heir through God.
translation:
  language: ig
  text: Ya mere, ị bụghịzi ohu, kama ị bụ nwa[a]; ma ọ bụrụ na ị bụ nwa, ị bụkwa onye nketa site n'aka Chineke.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Okwu Grik ahụ bụ “nwa nwoke.” E ji “nwa” sụgharịa ya n’ebe a n’ihi na ọnọdụ a metụtara ndị niile kwere ekwe. Okwu “nwa nwoke” na-echekwa ihe oyiyi Pọl banyere ịnabata mmadụ dịka nwa na ikike iketa ihe.
    reason: lexical_alternative
  - marker: b
    text: Ụfọdụ ihe odide nwere “onye nketa nke Chineke site na Kraịst” (ma ọ bụ “site na Mesaịa”) kama “onye nketa site n'aka Chineke.”
    reason: textual_variant
lexical_decisions:
- source_word: ὥστε
  choice: N’ihi ya
  rationale: Na-egosi nkwubi okwu sitere n’arụmụka bu ụzọ, n’Igbo doro anya ma dịkwa eke.
- source_word: οὐκέτι εἶ δοῦλος
  choice: ị bụghịzi ohu
  rationale: “Ọ bụghịzi” na-egosi mgbanwe ọnọdụ; “ohu” na-echekwa echiche nke ịbụ onye nọ n’agbụ, nke a na-atụnyere ọnọdụ nwa na onye nketa.
- source_word: ἀλλὰ υἱός
  choice: kama ị bụ nwa nwoke
  rationale: “Nwa nwoke” na-echekwa ụdị nwoke dị na υἱός na njikọ ya na ọnọdụ iwu nke nwa a nabatara na onye ga-eketa, ọ bụ ezie na ọnọdụ a metụtara ndị kwere ekwe niile.
- source_word: εἰ δὲ υἱός
  choice: ebe ị bụkwa nwa nwoke
  rationale: N’ebe a ọnọdụ e kwuru abụghị nke a na-enyo enyo kama ọ na-ewulite nzọụkwụ ọzọ n’arụmụka; “ebe” na-enye Igbo dị eke n’enweghị iwepụ njikọ ahụ.
- source_word: καὶ κληρονόμος
  choice: ị bụkwa onye nketa
  rationale: “Onye nketa” bụ okwu Igbo doro anya maka onye nwere ọnọdụ ịnata ihe nketa; “bụkwa” na-echekwa καὶ.
- source_word: διὰ θεοῦ
  choice: site na Chineke
  rationale: Na-agbaso ọgụgụ SBLGNT ma na-egosipụta na ọnọdụ onye nketa ahụ sitere n’ọrụ Chineke, na-enweghị ibubata “Kraịst” n’ahịrị bụ isi.
theological_decisions:
- issue: Asụsụ nwoke na υἱός n’arụmụka banyere ịnabata mmadụ dịka nwa na ihe nketa
  choice: nwa nwoke
  alternative: nwa
  rationale: A họọrọ “nwa nwoke” iji chekwaa ọdịdị okwu Grik na echiche ọnọdụ nwa nwoke dịka onye nketa n’ụwa oge ahụ. Ihe odide gbara ya gburugburu na-egosi na ọnọdụ a bụ nke ndị niile kwere ekwe, ma nwoke ma nwanyị; e mere ka nke ahụ doo anya n’okpuru peeji kama ime ka ọdịiche okwu ahụ laa n’iyi.
- issue: Ọgụgụ dị na ngwụcha amaokwu
  choice: site na Chineke
  alternative: onye nketa nke Chineke site na Kraịst/Mesaịa
  rationale: Isi ihe odide SBLGNT nwere διὰ θεοῦ. A sụgharịrị ọgụgụ ahụ n’ahịrị bụ isi, ebe e debere ọdịiche dị n’ihe odide ụfọdụ n’okpuru peeji.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E ji “ohu” chekwaa ike nke ntụnyere dị n’etiti agbụ na ọnọdụ nwa; e ji “onye nketa” mee ka isiokwu ihe nketa doo anya. Akara ukwu abụọ [a] na [b] dị n’ahịrị bụ isi.
