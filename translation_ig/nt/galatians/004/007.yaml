revisions:
- from: N’ihi ya, ị bụghịzi ohu, kama ị bụ nwa nwoke[a]; ebe ị bụkwa nwa nwoke, ị bụkwa onye nketa site na Chineke.[b]
  to: Ya mere, ị bụghịzi ohu, kama ị bụ nwa[a]; ma ọ bụrụ na ị bụ nwa, ị bụkwa onye nketa site n'aka Chineke.[b]
  rationale: The revision restores the explicit conditional progression of the Greek, improves idiomatic Standard Igbo, and avoids implying that the addressed believer must be biologically male. The footnote preserves the Greek masculine filial term and its adoption/inheritance logic. The main text continues to follow SBLGNT’s διὰ θεοῦ, while the textual alternative remains clearly footnoted.
