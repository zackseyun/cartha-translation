  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Λέγετέ μοι, οἱ ὑπὸ νόμον θέλοντες εἶναι, τὸν νόμον οὐκ ἀκούετε;
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/021.yaml
  text: Tell me[a], you who want to be under the law, do you not listen to the law?
translation:
  language: ig
  text: 'Gwanụ m, unu ndị chọrọ ịnọ n’okpuru iwu: ọ̀ bụ na unu anaghị ege iwu ahụ ntị[a]?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ọ̀ bụ na unu anaghị anụ iwu ahụ?” Ngwaa Grik a nwere ike ịpụta “ịnụ” ma ọ bụ “ige ntị.” O yikarịrị ka “iwu ahụ” na-ezo aka n’Iwu Mosis, karịchaa n’akụkọ Akwụkwọ Nsọ Pọl ga-ehota ozugbo.
    reason: lexical_alternative
lexical_decisions:
- source_word: Λέγετέ μοι
  choice: Gwanụ m
  rationale: Ụdị a bụ iwu e nyere ọtụtụ mmadụ, ọ na-egosikwa okwu ịma aka Pọl ji akpọ ha ka ha zaa ya n’ụzọ Igbo na-ada nke ọma.
- source_word: οἱ ὑπὸ νόμον θέλοντες εἶναι
  choice: unu ndị chọrọ ịnọ n’okpuru iwu
  rationale: “Unu ndị chọrọ” na-egosi ìgwè mmadụ e ji ọchịchọ a mara; “ịnọ n’okpuru iwu” na-echekwa ihe atụ Pọl ji kọwaa ịnọ n’okpuru ikike ma ọ bụ ọchịchị iwu.
- source_word: νόμον / τὸν νόμον
  choice: iwu / iwu ahụ
  rationale: 'Iji otu okwu bụ “iwu” n’ebe abụọ ahụ na-echekwa egwuregwu okwu Pọl: ha chọrọ ịnọ n’okpuru iwu, ma ha anaghị ege iwu ahụ ntị. “Ahụ” na nke ugboro abụọ na-egosipụta article Grik ma na-ahapụ ọnọdụ okwu ka ọ kọwaa na a na-ekwu banyere Iwu Mosis na akụkụ Akwụkwọ Nsọ Pọl ga-ehota.'
- source_word: οὐκ ἀκούετε
  choice: ọ̀ bụ na unu anaghị ege ... ntị
  rationale: ἀκούω nwere ike ịpụta ịnụ ihe ma ọ bụ ige ya ntị. N’ebe a, “ige ntị” na-egosi ilebara ihe iwu na-ekwu anya, ma e debere “ịnụ” dị ka nhọrọ ọzọ n’okpuru ala.
theological_decisions:
- issue: Ihe “iwu” na-ezo aka na ya
  choice: A sụgharịrị νόμος dịka “iwu,” ebe ọnọdụ okwu na-eme ka o kwe nghọta dịka Iwu Mosis nakwa dịka akụkụ Akwụkwọ Nsọ.
  alternative: Ịkpọ ya kpọmkwem “Iwu Mosis.”
  rationale: 'Pọl ji otu okwu ahụ rụọ ọrụ ụzọ abụọ: dịka ọchịchị iwu ha chọrọ ịnọ n’okpuru ya, nakwa dịka ihe e dere ede ha kwesịrị ịnụ. Ịghara itinye “Mosis” n’ahịrị bụ isi na-echekwa njikọ na mgbagwoju anya a.'
- issue: Ihe ἀκούετε pụtara
  choice: “na-ege ... ntị,” nke na-enye echiche nke ilebara ihe iwu ahụ na-ekwu anya.
  alternative: “na-anụ iwu ahụ,” nke na-anọkwu nso n’echiche anụ ahụ nke ịnụ.
  rationale: Ihe Pọl ga-ekwu n’amaokwu ndị na-esote na-egosi na ọ na-akpọ ha ka ha tụlee akụkọ e dere n’iwu ahụ; agbanyeghị, e debere ihe ọzọ okwu Grik ahụ nwere ike ịpụta n’okpuru ala.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma doo anya, dee ya. “Gwanụ m” na-agwa ọtụtụ mmadụ okwu n’ụzọ nkịtị; “ịnọ n’okpuru iwu” na-echekwa ihe atụ iwu na ọchịchị dị n’asụsụ Grik.
