id: GAL.4.22
reference: Galatians 4:22
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: γέγραπται γὰρ ὅτι Ἀβραὰμ δύο υἱοὺς ἔσχεν, ἕνα ἐκ τῆς παιδίσκης καὶ ἕνα ἐκ τῆς ἐλευθέρας·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/022.yaml
  text: For it is written that Abraham had two sons[a], one by the servant woman and one by the free woman.
translation:
  language: ig
  text: N’ihi na e dere na Ebreham nwere ụmụ nwoke abụọ, otu sitere na nwanyị ohu, nke ọzọkwa sitere na nwanyị nweere onwe ya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γέγραπται
  choice: e dere
  rationale: Nke a bụ ụzọ Igbo dị mfe ma bụrụkwa nke a na-ejikarị egosi ihe e dere n’Akwụkwọ Nsọ; ọ na-egosipụta ọnọdụ zuru ezu nke perfect passive ahụ.
- source_word: γὰρ
  choice: N’ihi na
  rationale: Ọ na-ejikọta amaokwu a na arụmụka bu ya ụzọ ma na-egosi na nke a bụ ihe nkwado nye ihe Pọl kwuru.
- source_word: Ἀβραὰμ
  choice: Ebraham
  rationale: Nke a bụ nsụgharị aha ahụ nke ndị na-agụ Akwụkwọ Nsọ n’Igbo maara nke ọma.
- source_word: δύο υἱοὺς
  choice: ụmụ nwoke abụọ
  rationale: υἱούς na-ekwu kpọmkwem banyere ụmụ nwoke, ọ bụghị naanị ụmụ n’ozuzu.
- source_word: ἔσχεν
  choice: nwere
  rationale: Ọ bụ okwu Igbo ebumpụta ụwa nke na-egosi na Ebraham mụrụ ma nwee ụmụ ndị a n’ezinụlọ ya, n’agbanyeghị na ọ naghị agbakwụnye nkọwa dị karịa isi mmalite.
- source_word: ἕνα ... καὶ ἕνα
  choice: otu ... nke ọzọkwa
  rationale: Ụdị a na-eme ka nhazi okwu abụọ ahụ doo anya ma daa nke ọma n’Igbo.
- source_word: ἐκ
  choice: site n’aka
  rationale: N’ọnọdụ usoro ọmụmụ a, nke a na-egosi nne onye nwa ahụ sitere n’aka ya n’ụzọ Igbo dị mma.
- source_word: παιδίσκης
  choice: nwanyị ohu
  rationale: Okwu ahụ na-ezo aka n’otu nwanyị nọ n’ọnọdụ ịgba ohu; nhọrọ a na-echekwa ọdịiche dị n’etiti ịgba ohu na nnwere onwe nke arụmụka Pọl dabere na ya.
- source_word: ἐλευθέρας
  choice: nwanyị nweere onwe ya
  rationale: Ọ na-egosi nwanyị na-abụghị ohu ma na-echekwa ntụnyere ya na ‘nwanyị ohu’ n’ụzọ doro anya.
theological_decisions:
- issue: Ọdịiche ọnọdụ mmekọrịta mmadụ nke dị n’etiti παιδίσκη na ἐλευθέρα
  choice: nwanyị ohu / nwanyị nweere onwe ya
  alternative: nwaanyị na-eje ozi / nwanyị nweere onwe ya
  rationale: Ihe Pọl na-ekwu n’akụkụ amaokwu a gbadoro ụkwụ n’ịgba ohu na nnwere onwe. ‘Nwanyị ohu’ na-eme ka ọdịiche ahụ pụta ìhè n’agbakwụnyeghị ozizi ọzọ n’ihe odide ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-echekwa njikọ arụmụka, usoro abụọ yiri ibe ha, na ọdịiche dị n’etiti ohu na onye nweere onwe ya.
