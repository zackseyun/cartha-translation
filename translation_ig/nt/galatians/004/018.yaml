  text: καλὸν ⸀δὲ ζηλοῦσθαι ἐν καλῷ πάντοτε, καὶ μὴ μόνον ἐν τῷ παρεῖναί με πρὸς ὑμᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/018.yaml
  text: But it is good to be sought eagerly for a good purpose at all times[b][a], and not only when I am present with you.
translation:
  language: ig
  text: Ma ọ dị mma ka e jiri ezi ebumnuche na-achọsi unu ike mgbe niile[b], ọ bụghịkwa naanị mgbe m nọ n’etiti unu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ka unu nwee ịnụ ọkụ n’obi” ma ọ bụ “ka unu na-egosi ịnụ ọkụ n’obi.” Okwu Grik ζηλοῦσθαι nwere ike ịghọta n’ụzọ ndị a, ma nghọta passive dabara nke ọma na amaokwu gara aga, ebe ndị ọzọ na-achọsi ndị Galetia ike.
    reason: alternative_reading
  - marker: b
    text: N’ụzọ nkịtị, “n’ihe dị mma.” O yikarịrị ka ọ na-ekwu banyere ezi ebumnuche ma ọ bụ ezi ihe a na-achọ ime.
    reason: lexical_alternative
lexical_decisions:
- source_word: καλὸν
  choice: ọ dị mma
  rationale: Adjective a bụ predicate e ji infinitive jikọta; ‘ọ dị mma’ bụ ụzọ Igbo kwụ ọtọ ma dị eke isi kwuo ya.
- source_word: δὲ
  choice: Ma
  rationale: Ọ na-egosi ntụgharị megide ebumnuche ọjọọ ndị a kpọtụrụ aha n’amaokwu 17.
- source_word: ζηλοῦσθαι
  choice: ka a na-achọsi unu ike
  rationale: A tụgharịrị present passive infinitive ahụ n’ụzọ passive. Ihe ndị gbara ya gburugburu na amaokwu 17–18 na-akwado echiche nke ndị ọzọ ji ịnụ ọkụ n’obi achọ ndị Galetia.
- source_word: ἐν καλῷ
  choice: maka ezi nzube
  rationale: Nkebiokwu ahụ pụtara na ọchịchọ ahụ kwesịrị inwe ezi ebumnuche, n’adịghị ka ebumnuche ọjọọ dị n’amaokwu bu ụzọ.
- source_word: πάντοτε
  choice: mgbe niile
  rationale: Ọ na-edobe ọdịiche oge dị n’etiti mgbe Pọl nọ ha nso na mgbe ọ na-anọghị.
- source_word: καὶ μὴ μόνον
  choice: ọ bụghịkwa naanị
  rationale: Nke a na-egosipụta njikọ na mmachi nke mkpụrụokwu Grik ahụ n’Igbo eke.
- source_word: ἐν τῷ παρεῖναί με πρὸς ὑμᾶς
  choice: mgbe m nọ nʼetiti unu
  rationale: Articular infinitive nwere ἐν na-egosi oge; nsụgharị a bụ Igbo doro anya ma na-echekwa echiche nke ọnụnọ Pọl.
theological_decisions:
- issue: Voice na onye a na-ekwu banyere ya na ζηλοῦσθαι
  choice: 'Passive: ndị ọzọ na-achọsi ndị Galetia ike'
  alternative: Ka mmadụ nwee ịnụ ọkụ n’obi / gosi ịnụ ọkụ n’obi
  rationale: 'Ojiji ζηλόω n’amaokwu 17 na-eme ka passive bụrụ ọgụgụ dabara nke ọma: ịchọsi ndị Galetia ike dị mma ma ọ bụrụ na ebumnuche ya dị mma. N’agbanyeghị ya, morphology ahụ nwere ike ikwe ka a ghọta ya n’ụzọ ọzọ, ya mere e debere nke ahụ n’ala peeji.'
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji ‘unu’ mee ihe n’ime ζηλοῦσθαι iji mee ka ihe passive ahụ doo anya n’Igbo; e tinyere akara ala peeji n’ebe nkebiokwu ọ bụla metụtara.
