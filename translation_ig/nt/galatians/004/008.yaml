  text: Ἀλλὰ τότε μὲν οὐκ εἰδότες θεὸν ἐδουλεύσατε τοῖς ⸂φύσει μὴ⸃ οὖσι θεοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/008.yaml
  text: But at that time[a], when you did not know God, you were enslaved to those that by nature are not gods.
translation:
  language: ig
  text: Ma n’oge ahụ[a], mgbe unu na-amaghị Chineke, unu jere ndị ahụ na-abụghị chi n’okike ha ozi dị ka ndị ohu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Ma na mbụ, ebe unu na-amaghị Chineke, unu jere ndị na-abụghị chi n’okike ha ozi dị ka ndị ohu.”
    reason: Ụzọ ọzọ e nwere ike isi tụgharịa τότε μὲν na nhazi nke φύσει μὴ οὖσι θεοῖς.
lexical_decisions:
- source_word: Ἀλλὰ
  choice: Ma
  rationale: Ọ na-egosi ọdịiche dị n’etiti ihe Pọl kwuru tupu nke a na ọnọdụ ndị Galeshia n’oge gara aga.
- source_word: τότε μὲν
  choice: n’oge ahụ
  rationale: Ọ na-ezo aka n’oge gara aga ma na-akwadebe ọdịiche ya na amaokwu na-esote.
- source_word: οὐκ εἰδότες θεὸν
  choice: mgbe unu na-amaghị Chineke
  rationale: E ji nkebi oge mee ka njikọ participle ahụ na ọnọdụ ha n’oge gara aga doo anya; “ịma Chineke” na-edebekwa echiche mmekọrịta dị n’okwu Pọl.
- source_word: ἐδουλεύσατε
  choice: unu jere ... ozi dị ka ndị ohu
  rationale: Nke a na-egosipụta ma omume ije ozi ma ịdị n’agbụ ohu, nke dị mkpa n’arụmụka ndị Galeshia banyere ịgba ohu na nnwere onwe.
- source_word: τοῖς ... οὖσι θεοῖς
  choice: ndị ahụ ... na-abụghị chi
  rationale: “Ndị ahụ” anaghị ekpebi ma ihe a na-ekwu bụ arụsị, mmụọ ọjọọ, ma ọ bụ ụdị ndị ọzọ a na-efe ofufe; otú ahụ ka edobere obosara okwu Grik ahụ.
- source_word: φύσει μὴ
  choice: site n’ọdịdị ha, na-abụghị
  rationale: Ọ na-egosi ihe ndị ahụ bụ n’ezie, ọ bụghị naanị aha ndị mmadụ kpọrọ ha.
- source_word: θεοῖς
  choice: chi
  rationale: Ọ bụ ọtụtụ chi a na-ekwu maka ha, n’ụzọ dị iche na otu Chineke ahụ e kwuru okwu ya tupu ya.
theological_decisions:
- issue: Ụdị ndị ma ọ bụ ihe ndị ha na-efe ofufe n’oge gara aga
  choice: ndị ahụ, site n’ọdịdị ha, na-abụghị chi
  alternative: ihe ndị na-abụghị chi n’ezie; ndị a na-akpọ chi n’ụgha
  rationale: Okwu ahụ na-agọnahụ na ha bụ chi n’ezie, ma ọ naghị akọwa kpọmkwem ma ha bụ arụsị ma ọ bụ ike mmụọ. Nsụgharị ahụ ahapụghị esemokwu a ma ọ bụ tinye nkọwa nke na-adịghị n’amaokwu ahụ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ugwu ma dị mfe nghọta, dee ya. E debere “dị ka ndị ohu” iji mee ka echiche siri ike nke δουλεύω pụta ìhè, ma e zere ịkpọ ndị ahụ “arụsị” ma ọ bụ “ndị mmụọ ọjọọ” n’ihi na amaokwu ahụ akọwaghị ha otú ahụ.
