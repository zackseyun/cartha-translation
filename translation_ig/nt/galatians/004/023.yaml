source:
  edition: SBLGNT
  text: ἀλλ’ ὁ μὲν ἐκ τῆς παιδίσκης κατὰ σάρκα γεγέννηται, ὁ δὲ ἐκ τῆς ἐλευθέρας ⸀δι’ ἐπαγγελίας.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/023.yaml
  text: But the son by the servant woman was born according to the flesh[b][a], while the son by the free woman was born through promise.
translation:
  language: ig
  text: Ma nwa ahụ sitere n’aka nwanyị ohu ka a mụrụ n’ụzọ anụ ahụ[a], ebe nwa ahụ sitere n’aka nwanyị nweere onwe ya ka a mụrụ site ná nkwa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ, “n’ụzọ nkịtị mmadụ si amụ nwa.” N’asụsụ Grik: “dị ka anụ ahụ.”'
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “n’ihi nkwa.” Nke a na-ekwu maka ọmụmụ sitere na mmezu nkwa Chineke, n’ọdịiche na ụzọ nkịtị mmadụ si amụ nwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: παιδίσκη
  choice: ohu nwaanyị
  rationale: Nke a na-egosi ọnọdụ Hega dị ka ohu, nke dị mkpa n'ọdịiche Pọl na-eme; ọ dịkwa mfe nghọta n'Igbo ugbu a.
- source_word: κατὰ σάρκα
  choice: n'ụzọ anụ ahụ
  rationale: Ọ na-edobe okwu Pọl banyere anụ ahụ, ma n'ebe a ọ pụtara ọmụmụ sitere n'ụzọ mmadụ si amụ nwa, ọ bụghị na ọmụmụ ahụ bụ mmehie.
- source_word: γεγέννηται
  choice: onye a mụrụ
  rationale: Nke a bụ ụzọ Igbo dị mma isi kwuo passive perfect a n'ime ahịrịokwu na-atụnyere ụmụ abụọ ahụ.
- source_word: ἐλευθέρα
  choice: nwaanyị nweere onwe ya
  rationale: Ọ na-egosi kpọmkwem ọdịiche dị n'etiti onye bụ ohu na onye nweere onwe ya.
- source_word: δι’ ἐπαγγελίας
  choice: site ná nkwa
  rationale: Ọ na-echekwa echiche na ọmụmụ nwa ahụ sitere ná nkwa Chineke ma mee ka ụzọ nkịtị o si metụta nkwa ahụ ghara ịla n'iyi.
- source_word: ὁ μὲν ... ὁ δὲ
  choice: nwa ahụ ... ebe nwa ahụ
  rationale: Ịkpọpụta ‘nwa ahụ’ ugboro abụọ na-eme ka ntụnyere ahụ doo anya n'Igbo n'agbanyeghị na Grik hapụrụ aha ahụ n'echiche.
theological_decisions:
- issue: Ọdịiche dị n'etiti κατὰ σάρκα na δι’ ἐπαγγελίας
  choice: Edobere ‘n'ụzọ anụ ahụ’ na isiokwu, ma kọwaa ya n'okpuru peeji dị ka ụzọ mmadụ si amụ nwa.
  alternative: A pụrụ ịsụgharị ya ozugbo dịka ‘n'ụzọ mmadụ si amụ nwa.’
  rationale: Nke a na-echekwa okwu Pọl na esemokwu nkà mmụta okpukpe dị na ya, ma na-egbochi nghọtahie na Pọl na-akpọ ọmụmụ anụ ahụ mmehie. ‘Site ná nkwa’ na-egosi na ọmụmụ nke abụọ mere n'ihi nkwa Chineke.
translation_notes:
  register: Standard Igbo; asụsụ dị ugbu a, kwụ ọtọ ma dị nsọ. E ji ‘ohu nwaanyị’ mee ka ọnọdụ mmekọrịta mmadụ na ibe ya doo anya, ebe ‘nwaanyị nweere onwe ya’ na-echekwa ọdịiche Pọl na-eme.
