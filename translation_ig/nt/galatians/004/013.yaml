    text: Ma ọ bụ, “n’ihi ọrịa n’anụ ahụ.” Okwu Grik ahụ nwere ike ịpụta “adịghị ike” ma ọ bụ “ọrịa”; n’ebe a, ọ na-ekwu maka ọnọdụ anụ ahụ.
    reason: lexical_alternative
  revision_rationale: The revision keeps the physical reference of τῆς σαρκὸς and the probable context of illness while avoiding an unnecessarily narrow diagnosis in the main text. It also makes the temporal force of τὸ πρότερον and the sentence flow more natural in Standard Igbo.
