  text: οἴδατε δὲ ὅτι δι’ ἀσθένειαν τῆς σαρκὸς εὐηγγελισάμην ὑμῖν τὸ πρότερον,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/013.yaml
  text: But you know that it was because of an illness of the flesh that I first proclaimed the good news to you,[a]
translation:
  language: ig
  text: Ma unu maara na ọ bụ n’ihi adịghị ike n’anụ ahụ ka m buru ụzọ kwusara unu ozi ọma.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’ihi ọrịa n’anụ ahụ.” Okwu Grik ahụ nwere ike ịpụta “adịghị ike” ma ọ bụ “ọrịa”; n’ebe a, ọ na-ekwu maka ọnọdụ anụ ahụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἴδατε
  choice: unu maara
  rationale: Ọ na-egosi ihe ndị Galeshia maralarị; ụdị perfect a nwere nghọta nke oge ugbu a.
- source_word: δὲ
  choice: Ma
  rationale: Ọ na-egosi ntakịrị mgbanwe ma ọ bụ ntụgharị site n'okwu bu ya ụzọ.
- source_word: ὅτι
  choice: na
  rationale: Ọ na-ewebata ihe ndị na-agụ akwụkwọ maara.
- source_word: δι’ ἀσθένειαν τῆς σαρκὸς
  choice: n’ihi ọrịa nke anụ ahụ
  rationale: διά ya na accusative na-egosi ihe kpatara ya; ἀσθένεια nwere ike ịbụ ọrịa ma ọ bụ adịghị ike, ebe σάρξ n'ebe a na-ezo aka n'ahụ mmadụ.
- source_word: εὐηγγελισάμην
  choice: m kwusara ... ozi ọma
  rationale: Ọ na-egosi ikwupụta ozi ọma n'ụzọ doro anya ma dịrị ndị Igbo nke oge a mfe nghọta.
- source_word: ὑμῖν
  choice: unu
  rationale: Dative ahụ na-egosi ndị e ziri nkwusa ahụ.
- source_word: τὸ πρότερον
  choice: na nke mbụ
  rationale: Ọ na-ezo aka n'oge mbụ Pọl kwusara ha ozi ọma, ma na-ahapụ ohere nke nghọta 'oge mbụ' dị n'okwu Grik.
theological_decisions:
- issue: Ihe σάρξ pụtara n'okwu ἀσθένειαν τῆς σαρκὸς
  choice: anụ ahụ, ya bụ ọnọdụ ọrịa ma ọ bụ adịghị ike nke ahụ
  alternative: adịghị ike n'ozuzu; anụ ahụ dị ka ọchịchọ mmehie
  rationale: N'ebe a, ihe gbara okwu ahụ gburugburu na-egosi ọnọdụ nke ahụ Pọl, ọ bụghị omume mmehie. Isi ederede họọrọ 'ọrịa' dịka nghọta kacha yie, ebe nkọwa ala peeji chekwara mgbagwoju anya dị n'okwu ἀσθένεια.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E debere 'anụ ahụ' iji chekwaa ọdịdị okwu Grik, ma jiri nkọwa ala peeji gosipụta na ἀσθένεια nwere ike ịpụta ma ọrịa ma adịghị ike.
