revisions:
- from: Ma unu maara na ọ bụ n’ihi ọrịa nke anụ ahụ ka m ji kwusara unu ozi ọma na nke mbụ.[a]
  to: Ma unu maara na ọ bụ n’ihi adịghị ike n’anụ ahụ ka m buru ụzọ kwusara unu ozi ọma.[a]
  rationale: The revision keeps the physical reference of τῆς σαρκὸς and the probable context of illness while avoiding an unnecessarily narrow diagnosis in the main text. It also makes the temporal force of τὸ πρότερον and the sentence flow more natural in Standard Igbo.
