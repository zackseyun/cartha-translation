base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/017.yaml
  text: They are zealous for you[a], but not in a good way. Rather, they want to shut you out[b], so that you may be zealous for them.
translation:
  language: ig
  text: Ha na-achọsi unu ike[a], ma ọ bụghị n’ụzọ dị mma. Kama, ha chọrọ ịkpọchi unu n’èzí[b], ka unu wee na-achọsikwa ha ike.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “Ha na-anụ ọkụ n’obi n’ebe unu nọ, ma ọ bụghị n’ụzọ kwesịrị ekwesị.” Okwu Grik ahụ nwekwara ike ịpụta ịchọ mmadụsi ike ma ọ bụ ịgbalị inweta mmasị ya.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ikewapụ unu.” O yikarịrị ka ihe a na-ekwu bụ na ha chọrọ ikewapụ unu na Pọl na ndị ya, ka unu wee chọọ ha kama.
    reason: alternative_reading
lexical_decisions:
- source_word: ζηλοῦσιν / ζηλοῦτε
  choice: na-achọsi ... ike / na-achọsikwa ... ike
  rationale: Nkebiokwu a na-egosi ọchịchọ siri ike na mgbalị mmadụ na-eme iji nweta mmasị ma ọ bụ nkwado onye ọzọ. Iji otu nkebiokwu ahụ n’ebe abụọ ahụ na-echekwa myirịta okwu Pọl ji rụọ ọrụ n’amaokwu ahụ, n’etinyeghị echiche ịhụnanya nwoke na nwaanyị.
- source_word: οὐ καλῶς
  choice: ma ọ bụghị n’ụzọ dị mma
  rationale: Nke a na-ekwupụta na ụzọ ma ọ bụ ebumnobi ha adịghị mma, n’Igbo doro anya ma bụrụkwa nke mmadụ na-asụ taa.
- source_word: ἀλλὰ
  choice: Kama
  rationale: Ọ na-egosi ntụgharị siri ike gaa n’ezi ebumnobi nke ndị ahụ.
- source_word: ἐκκλεῖσαι ὑμᾶς
  choice: ịkpọchi unu n’èzí
  rationale: Nke a na-echekwa ihe oyiyi dị n’okwu Grik nke ịkpọchi mmadụ n’èzí, ma ọ naghị akọwapụta kpọmkwem ndị ma ọ bụ ihe a na-ekewapụ ha na ya.
- source_word: θέλουσιν
  choice: ha chọrọ
  rationale: Nke a bụ ụzọ Igbo dị mfe ma kwekọọ n’okwu a na-ejikarị egosi ọchịchọ.
- source_word: ἵνα
  choice: ka ... wee
  rationale: Usoro a na-egosi ebumnobi nke ọma n’Igbo.
theological_decisions:
- issue: Ihe ἐκκλεῖσαι ὑμᾶς pụtara n’ebe a
  choice: A hapụrụ ya dịka ‘ịkpọchi unu n’èzí,’ nke na-egosi ikewapụ ndị Galeshia iji mee ka ha tụkwasị ndị nkuzi ahụ obi.
  alternative: Ịsị kpọmkwem na ha chọrọ ikewapụ ndị Galeshia na Pọl na ndị ya, ma ọ bụ n’ọgbakọ Chineke.
  rationale: Ọnọdụ okwu ahụ na-akwado echiche nke ịdọpụ mmasị na ntụkwasị obi ha n’ebe Pọl nọ, ma ihe odide Grik ekwughị kpọmkwem onye ma ọ bụ ihe a na-akpọchi ha n’èzí ya. Ya mere, nsụgharị ahụ na-echekwa oghere ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ugwu ma dịkwa mfe nghọta. ‘Unu’ na-echekwa ọtụtụ mmadụ dị na ὑμᾶς/ζηλοῦτε. E jiri ‘na-achọsi ... ike’ mee ka nkwughachi ζηλόω pụta ìhè n’akụkụ abụọ ahụ.
