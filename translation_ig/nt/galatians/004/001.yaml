id: GAL.4.1
reference: Galatians 4:1
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Λέγω δέ, ἐφ’ ὅσον χρόνον ὁ κληρονόμος νήπιός ἐστιν, οὐδὲν διαφέρει δούλου κύριος πάντων ὤν,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/001.yaml
  text: I say that as long as the heir is a child[a], he differs in nothing from a servant, though he is lord of all[b],
translation:
  language: ig
  text: 'Ihe m na-ekwu bụ nke a: Ọ bụrụhaala na onye nketa ahụ ka bụ nwata[a], ọ dịghị iche na ohu[b] n’ihe ọ bụla, ọ bụ ezie na ọ bụ onye nwe ihe niile.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “onye na-erubeghị afọ.” Okwu Grik ahụ, νήπιος, nwere ike ịpụta nwata na-etozughị okè; n’ọnọdụ a, ọ pụkwara izo onye na-erubeghị afọ.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “odibo.” Okwu Grik ahụ, δοῦλος, na-ezokarị aka n’ohu, onye nọ n’okpuru ikike onye ọzọ; a sụgharịrị ya “ohu” ebe a iji chekwaa ike ntụnyere Pọl.
    reason: lexical_alternative
lexical_decisions:
- source_word: Λέγω δέ
  choice: Ihe m na-ekwu bụ nke a
  rationale: Nke a na-egosi na Pọl na-amalite ịkọwa okwu ya n’ụzọ Igbo dị nfe, ma ghara ime δέ ka ọ bụrụ mmegide siri ike.
- source_word: ἐφ’ ὅσον χρόνον
  choice: Ruo oge ... ka
  rationale: Akpaokwu a na-egosi ogologo oge ọnọdụ ahụ na-adịgide ruo n’ókè ụfọdụ.
- source_word: ὁ κληρονόμος
  choice: onye nketa
  rationale: Nke a bụ okwu Igbo doro anya maka onye ga-anata ihe nketa.
- source_word: νήπιός
  choice: nwata
  rationale: νήπιος nwere ike ịbụ obere nwa ma ọ bụ onye na-erubeghị afọ iwu; n’ihe atụ a, “nwata” na-adị nfe ma ghara ịkọwapụta afọ ya karịa ihe Grik kwuru.
- source_word: οὐδὲν διαφέρει
  choice: ọ dịghị ihe ọ dị iche
  rationale: Nke a na-echekwa ike okwu Grik nke na-ekwu na, n’ọnọdụ ahụ, ọdịiche bara uru adịghị.
- source_word: δούλου
  choice: ohu
  rationale: N’ihe atụ a, δοῦλος na-ezo aka n’onye nọ n’okpuru ikike onye nwe ya, ọ bụghị naanị onye na-eje ozi n’afọ ofufo.
- source_word: κύριος πάντων ὤν
  choice: ọ bụ ezie na ọ bụ onye nwe ihe niile
  rationale: κύριος ebe a bụ onye nwere ihe ma ọ bụ ikike, ọ bụghị utu aha Chineke; “ọ bụ ezie na” na-egosipụta echiche nkwenye dị n’ahịrị participle ahụ.
theological_decisions:
- issue: Nsụgharị δοῦλος n’ihe atụ Pọl
  choice: ohu
  alternative: odibo
  rationale: “Ohu” na-echekwa ọnọdụ onye e kere agbụ ma ọ bụ onye nọ kpamkpam n’okpuru ikike onye ọzọ, nke bụ isi ike ntụnyere Pọl; “odibo” nwere ike ịdị ka onye ọrụ ma ọ bụ onye na-eje ozi n’afọ ofufo.
- issue: Ihe κύριος pụtara ebe a
  choice: onye nwe
  alternative: Onyenwe
  rationale: N’ebe a okwu ahụ na-ekwu maka ikike onye nketa nwere n’ihe niile, ọ bụghị aha nsọ nke Chineke.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ “ohu” iji chekwaa ike ntụnyere ahụ. Akara nkọwa ala [a] dị n’ahịrị isi, dị ka achọrọ.
