  to: 'N’ihi na e dere, sị:


    “Ṅụrịa ọṅụ, gị nwanyị aga[a], onye na-adịghị amụ nwa;


    gbawaa, tie mkpu, gị onye na-adịghị enwe ihe mgbu ime;


    n’ihi na ụmụ nke nwanyị ahụ tọgbọrọ n’efu[c] dị ọtụtụ karịa ụmụ nke nwanyị ahụ nwere di.”[b]'
  rationale: 'E meziri njehie dị mkpa nke mere ka τέκνα (“ụmụ”) bụrụ “ụmụ nwanyị.” E weghachiri ntụnyere ahụ n’ụdị ya ziri ezi: ụmụ nke nwanyị tọgbọrọ n’efu na ụmụ nke nwanyị nwere di. A hazikwara okwu na ndetu c ka ọ soro “nwanyị ahụ tọgbọrọ n’efu,” nke ọ na-akọwa, ma debe ihe oyiyi na enweghị nkọwa ụka agbakwunyere.'
