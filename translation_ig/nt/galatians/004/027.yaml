review_pass:
  verdict: revise
  source_fidelity: 'A chọrọ ndozi: draft ahụ sụgharịrị τὰ τέκνα (“ụmụ/children”) dị ka “ụmụ nwanyị” (“women”) n’akụkụ abụọ nke ntụnyere ahụ. Nke a gbanwere isi okwu Grik ma mee ka e nwee ọtụtụ ụmụ nwanyị kama ụmụ nke nwanyị ọ bụla. A na-edobe nwanyị abụọ ahụ n’otu (singular) dịka isi mmalite si dị.'
  naturalness: “Ụmụ nke nwanyị ahụ tọgbọrọ n’efu” na “ụmụ nke nwanyị ahụ nwere di” bụ Igbo doro anya ma na-ewepụ mgbagwoju anya dị na “ụmụ nwanyị.” “Gbawaa, tie mkpu” na-edobe akara uri nke iwu abụọ ahụ n’enweghị ịgbakwunye ihe okwu Grik anaghị ekwu.
  terminology: “Nwanyị aga” dabara maka στεῖρα, “ihe mgbu ime” maka ὠδίνουσα, “nwanyị ahụ tọgbọrọ n’efu” maka τῆς ἐρήμου n’ihe atụ a, “di” maka ἄνδρα, ma “ụmụ” maka τέκνα. Ndetu c ka na-enye nhọrọ “a hapụrụ” na “nọ naanị ya” n’enweghị ịkpọchi ihe atụ ahụ n’otu nkọwa.
  issues:
  - severity: high
    issue: “ụmụ nwanyị ahụ a gbahapụrụ agbahapụ” na “ụmụ nwanyị ahụ nwere di”
    rationale: Okwu ndị a pụtara “the abandoned women” na “the women with husbands,” ebe τὰ τέκνα ugboro abụọ pụtara “the children.” Ọzọkwa, genitive ndị na-esote ha na-ekwu maka nwanyị abụọ n’otu, ọ bụghị ọtụtụ ụmụ nwanyị.
  - severity: low
    issue: “tiwasịa n’ọṅụ” maka ῥῆξον
    rationale: Ọ bụ ntụgharị nwere ike ịghọta, ma “gbawaa” na-esochi “tie mkpu” na-egosipụta “break forth and cry out” n’ụzọ kpọmkwem karị, na-enweghị itinye “n’ọṅụ” n’akụkụ iwu nke abụọ.
