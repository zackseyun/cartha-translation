reference: Galatians 4:27
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: γέγραπται γάρ· Εὐφράνθητι, στεῖρα ἡ οὐ τίκτουσα, ῥῆξον καὶ βόησον, ἡ οὐκ ὠδίνουσα· ὅτι πολλὰ τὰ τέκνα τῆς ἐρήμου μᾶλλον ἢ τῆς ἐχούσης τὸν ἄνδρα.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/027.yaml
  text: 'For it is written: “Rejoice[a], barren woman who is not bearing children; break forth and cry out, you who are not in labor[c][b]; because the children of the desolate woman are more numerous than those of the woman who has a husband.”'
translation:
  language: ig
  text: 'N’ihi na e dere, sị:


    “Ṅụrịa ọṅụ, gị nwanyị aga[a], onye na-adịghị amụ nwa;


    gbawaa, tie mkpu, gị onye na-adịghị enwe ihe mgbu ime;


    n’ihi na ụmụ nke nwanyị ahụ tọgbọrọ n’efu[c] dị ọtụtụ karịa ụmụ nke nwanyị ahụ nwere di.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ihe e hotara na Aịzaya 54:1.
    reason: cross_reference
  - marker: b
    text: A pụkwara ịsụgharị ya, “Nwee ọṅụ, gị nwanyị aga nke na-adịghị amụ nwa … gbawaa, tie mkpu.”
    reason: lexical_alternative
  - marker: c
    text: “Nwanyị ahụ tọgbọrọ n’efu” sụgharịrị okwu nwekwara ike ịpụta “nwanyị a hapụrụ” ma ọ bụ “nwanyị nọ naanị ya” n’ihe atụ a.
    reason: lexical_alternative
lexical_decisions:
- source_word: γέγραπται
  choice: e dere
  rationale: Ọ bụ ụzọ Igbo dị nkenke ma bụrụ nke a na-ejikarị webata ihe e dere n’Akwụkwọ Nsọ; ọ dabara n’ụdị perfect passive nke na-egosi na ihe ahụ e dere ka dị ire.
- source_word: Εὐφράνθητι
  choice: Ṅụrịa ọṅụ
  rationale: Na-egosipụta iwu ka onye ahụ nwee ọṅụ ma na-edobe ụda amụma nke okwu e hotara.
- source_word: στεῖρα
  choice: gị nwanyị aga
  rationale: Adjective ahụ na-arụ ọrụ dị ka aha onye a na-agwa okwu. “Nwanyị aga” bụ okwu Igbo a ghọtara nke ọma maka nwanyị na-adịghị amụ nwa.
- source_word: ἡ οὐ τίκτουσα
  choice: nke na-adịghị amụ nwa
  rationale: Na-edobe nkọwa nke ọnọdụ ịghara ịmụ nwa na-aga n’ihu n’asụsụ Igbo doro anya.
- source_word: ῥῆξον
  choice: tiwasịa n’ọṅụ
  rationale: N’idiom a, okwu ahụ pụtara ịmalite ngosipụta ọṅụ n’ike na mberede; “tiwasịa n’ọṅụ” na-ada ka Igbo ebumpụta ụwa.
- source_word: βόησον
  choice: tiekwa mkpu
  rationale: Na-egosipụta iti olu ike nke iwu ahụ chọrọ ma na-ejikọta nke ọma na “tiwasịa n’ọṅụ.”
- source_word: ἡ οὐκ ὠδίνουσα
  choice: gị onye na-anaghị enwe ihe mgbu ime
  rationale: ὠδίνω na-ezo aka n’ihe mgbu ọmụmụ; ntụgharị a na-edobe ihe atụ nke ịmụ nwa ma bụrụ nke ndị na-agụ Igbo ga-aghọta.
- source_word: πολλὰ τὰ τέκνα
  choice: ụmụ ... dị ọtụtụ
  rationale: Na-etinye nkwupụta banyere ọnụ ọgụgụ ụmụ n’usoro okwu Igbo ebumpụta ụwa.
- source_word: τῆς ἐρήμου
  choice: ụmụ nwanyị ahụ a gbahapụrụ agbahapụ
  rationale: ἔρημος n’ebe a na-egosi nwanyị onye nọ naanị ya, onye a gbahapụrụ ma ọ bụ onye tọgbọrọ n’efu; okwu a na-edobe ihe atụ banyere onye ahụ.
- source_word: μᾶλλον ἢ
  choice: dị ọtụtụ karịa
  rationale: Na-eme ka ntụnyere ọnụ ọgụgụ ụmụ pụta ìhè n’Igbo.
- source_word: τῆς ἐχούσης τὸν ἄνδρα
  choice: ụmụ nwanyị ahụ nwere di
  rationale: Na-edobe okwu nkịtị banyere nwanyị nwere di, kama iji naanị aha zuru ezu nke ‘nwanyị lụrụ di,’ ma na-echekwa ọdịiche dị n’amaokwu ahụ.
theological_decisions:
- issue: Ihe e hotara n’Agba Ochie na ọnọdụ ihe atụ dị na Ndị Galeshia 4
  choice: A tụgharịrị Aịzaya 54:1 n’ụzọ kwụ ọtọ, na-etinyeghị n’ime amaokwu ahụ nkọwa Pọl banyere ihe atụ ahụ.
  alternative: Ịtụgharị ya n’ụzọ ga-eme ka njikọ ya na Jerusalem nke dị n’elu ma ọ bụ Sera pụta ìhè ozugbo.
  rationale: Amaokwu a bụ okwu Akwụkwọ Nsọ e hotara kpọmkwem. Ọ dị mkpa ka ihe oyiyi amụma ahụ guzo n’ụdị nke ya, ka ihe Pọl na-ekwu n’amaokwu ndị gbara ya gburugburu kọwaa njikọ ya.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. E debere ụda uri na amụma nke okwu Aịzaya e hotara, ma zere okwu ụka pụrụ iche. E doziri akara ndetu ala peeji ka ha soro okwu ha na-akọwa kpọmkwem.
