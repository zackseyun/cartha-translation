id: GAL.4.31
reference: Galatians 4:31
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸀διό, ἀδελφοί, οὐκ ἐσμὲν παιδίσκης τέκνα ἀλλὰ τῆς ἐλευθέρας.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/031.yaml
  text: Therefore[a], brothers, we are not children of the servant woman[b], but of the free woman.
translation:
  language: ig
  text: Ya mere, ụmụnna[a], anyị abụghị ụmụ nke nwanyị ahụ bụ ohu[b], kama anyị bụ ụmụ nke nwanyị ahụ nweere onwe ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’asụsụ Grik, okwu a pụtara kpọmkwem ‘ụmụnne nwoke,’ ma a pụkwara iji ya kpọọ ìgwè nwere ma ụmụ nwoke ma ụmụ nwanyị.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya ‘nwa agbọghọ bụ ohu.’ Okwu Grik ahụ na-ezo aka n’ohu nwanyị ma ọ bụ nwanyị na-eje ozi; n’ebe a, ọ na-egosi Hega n’ọdịiche ya na Sera n’ihe atụ Pọl kwuru (Gal. 4:21–31).
    reason: lexical_alternative
lexical_decisions:
- source_word: διό
  choice: Ya mere
  rationale: Na-egosi nkwubi okwu Pọl si n’ihe atụ ya kwuru tupu nke a nweta; ọ bụ okwu Igbo doro anya nke na-echekwa njikọ echiche ahụ.
- source_word: ἀδελφοί
  choice: ụmụnna
  rationale: Ọ bụ okwu a na-eji akpọ ndị otu ezinụlọ ma ọ bụ ndị otu okwukwe; n’Igbo ọ na-ada nke ọma mgbe a na-agwa ìgwè nwere ma ndị nwoke ma ndị nwanyị okwu, ebe nkọwa ala peeji na-akọwa ụdị okwu Grik.
- source_word: οὐκ ἐσμὲν
  choice: anyị abụghị
  rationale: Na-echekwa ngọnahụ dị n’oge ugbu a n’etinyeghị echiche ‘anyị abụghịzi,’ nke na-adịghị n’ụdị Grik ahụ.
- source_word: παιδίσκης
  choice: nke nwanyị ahụ bụ ohu
  rationale: Ọnọdụ nwanyị ahụ dị ka ohu bụ isi n’ọdịiche Pọl na-egosi n’etiti Hega na Sera; ‘ohu’ na-echekwa ịdị ike nke okwu ahụ.
- source_word: τέκνα
  choice: ụmụ
  rationale: Ọ na-agụnye ụmụ nwoke na ụmụ nwanyị, dị ka τέκνα, ma bụrụkwa okwu Igbo kachasị mfe ma kwekọọ n’ebe a.
- source_word: ἀλλὰ
  choice: kama
  rationale: Na-egosi ọdịiche siri ike n’etiti njirimara abụọ ahụ n’ụzọ Igbo na-ada nke ọma.
- source_word: τῆς ἐλευθέρας
  choice: nke nwanyị ahụ nweere onwe ya
  rationale: Na-eme ka onye nwanyị okwu Grik ahụ na-ezo aka na ya pụta ìhè, ma chekwaa ọdịiche dị n’etiti ịbụ ohu na inwere onwe.
theological_decisions:
- issue: Otu a ga-esi mee ka ọdịiche Pọl tinyere n’etiti Hega na Sera pụta ìhè
  choice: Jiri ‘nwanyị ahụ bụ ohu’ na ‘nwanyị ahụ nweere onwe ya’ n’amaokwu ahụ.
  alternative: ‘nwaanyị na-eje ozi’ na ‘nwanyị nweere onwe ya’
  rationale: Arụmụka ihe atụ dị na Galetia 4:21–31 dabere n’ọdịiche dị n’etiti ịgba ohu na inwere onwe. Nsụgharị a na-echekwa ọdịiche ahụ n’etinyeghị nkọwa ozizi ọzọ.
- issue: Otu a ga-esi sụgharịa ἀδελφοί mgbe ndị a na-agwa nwere ike ịgụnye ma ndị nwoke ma ndị nwanyị
  choice: Jiri ‘ụmụnna’ n’amaokwu, tinyekwa nkọwa ala peeji banyere ụdị okwu Grik ahụ.
  alternative: ‘ụmụnne nwoke na ụmụnne nwanyị’
  rationale: ‘Ụmụnna’ bụ okwu Igbo e ji akpọ otu ndị nwere njikọ ezinụlọ ma ọ bụ okwukwe, ọ pụkwara ịgụnye ìgwè ahụ dum; nkọwa ala peeji na-echekwakwa ụdị okwu nwoke dị na Grik.
translation_notes:
  register: Standard Igbo; natural, dignified, and accessible. The repeated construction ‘ụmụ nke nwanyị ahụ...’ avoids the possible ambiguity of reading ‘ụmụ nwanyị’ as ‘daughters/women,’ while preserving the source text’s parallel contrast.
