  text: ὅτε δὲ ἦλθεν τὸ πλήρωμα τοῦ χρόνου, ἐξαπέστειλεν ὁ θεὸς τὸν υἱὸν αὐτοῦ, γενόμενον ἐκ γυναικός, γενόμενον ὑπὸ νόμον,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/004.yaml
  text: But when the fullness of time had come[a], God sent out his Son, born of a woman, born under the law[d][c][b],
translation:
  language: ig
  text: Ma mgbe oge ahụ zuru[a], Chineke zipụrụ[b] Ọkpara ya, onye a mụrụ site na nwanyị[c], onye a mụrụ n’okpuru Iwu[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “oge ahụ mezuru,” ma ọ bụ, “oge ahụ erutela n’uju.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “zitere.” Ngwaa Grik e ji mee ihe nwere ike inye echiche nke izipụ onye ka ọ pụọ gaa rụọ ọrụ e nyere ya.
    reason: lexical_alternative
  - marker: c
    text: N’ụzọ nkịtị, “onye a mụrụ site na nwanyị.” Okwu a na-emesi ezi ọmụmụ mmadụ nke Ọkpara ahụ ike.
    reason: lexical_alternative
  - marker: d
    text: Ya bụ, n’okpuru ikike Iwu Mosis.
    reason: cross_reference
lexical_decisions:
- source_word: ὅτε δὲ
  choice: Ma mgbe
  rationale: “Ma” na-egosi ntakịrị ntụgharị n’okwu, ebe “mgbe” na-egosi oge, n’enweghị ime ka ọdịiche ahụ sie ike karịa Grik.
- source_word: ἦλθεν τὸ πλήρωμα τοῦ χρόνου
  choice: oge ahụ zuru
  rationale: Nke a na-egosi na oge ahụ erutela n’uju ma ọ bụ na o mezuru, n’Igbo dị mfe ma bụrụkwa nke e ji eme ihe ugbu a.
- source_word: ἐξαπέστειλεν
  choice: zipụrụ
  rationale: “Zipụrụ” na-egosi iziga onye ka ọ gaa rụọ ọrụ; ihe odide ala ala na-echekwa ohere ịsụgharị ngwaa ahụ dịka “zitere.”
- source_word: τὸν υἱὸν αὐτοῦ
  choice: Ọkpara ya
  rationale: “Ọkpara ya” bụ ụzọ ebumpụta ụwa na nke dị ùgwù isi kwuo Ọkpara Chineke n’ebe a.
- source_word: γενόμενον ἐκ γυναικός
  choice: onye a mụrụ site n’aka otu nwanyị
  rationale: “A mụrụ” na-enye nghọta okwu ahụ nwere n’ahịrịokwu a, ebe “site n’aka otu nwanyị” na-echekwa echiche isi mmalite dị na ἐκ ma na-ekwupụta ọmụmụ mmadụ n’ezie.
- source_word: γενόμενον ὑπὸ νόμον
  choice: onye a mụrụ n’okpuru Iwu
  rationale: Ikwughachi “onye a mụrụ” na-echekwa nhazi okwu abụọ yiri ibe ha n’asụsụ Grik; “n’okpuru Iwu” na-egosi ịnọ n’okpuru ikike Iwu ahụ.
theological_decisions:
- issue: Ezi mmadụ nke Ọkpara n’okwu γενόμενον ἐκ γυναικός
  choice: onye a mụrụ site n’aka otu nwanyị
  alternative: onye sitere n’otu nwanyị
  rationale: Nhọrọ a na-ekwupụta ezi ọmụmụ mmadụ nke Ọkpara, ma ọ naghị ehichapụ ihe okwu “Chineke zipụrụ Ọkpara ya” nwere ike igosi banyere ịdị adị ya tupu ọmụmụ ahụ.
- issue: Ihe νόμος na-ezo aka na ya n’okwu ὑπὸ νόμον
  choice: n’okpuru Iwu
  alternative: n’okpuru iwu
  rationale: N’akwụkwọ Ndị Galeshia, ihe a na-ezo aka na ya bụ Iwu Mosis karịsịa. Isi mkpụrụedemede ukwu na ihe odide ala ala na-eme ka nke ahụ doo anya, ebe isi okwu ahụ ka dị mkpirikpi dịka nke Pọl.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị ùgwù ma doo ndị nkịtị anya. E debere nhazi ahịrịokwu abụọ yiri ibe ha—“onye a mụrụ … onye a mụrụ …”—iji gosipụta nkwughachi γενόμενον dị n’asụsụ Grik. “Iwu” nwere mkpụrụedemede ukwu iji gosi na ọ bụ Iwu Mosis ka ọnọdụ akwụkwọ ozi a na-ezo aka na ya.
