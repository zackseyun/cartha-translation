revisions:
- from: Ma mgbe oge ahụ zuru[a], Chineke zipụrụ Ọkpara ya[b], onye a mụrụ site n’aka otu nwanyị[c], onye a mụrụ n’okpuru Iwu[d].
  to: Ma mgbe oge ahụ zuru[a], Chineke zipụrụ[b] Ọkpara ya, onye a mụrụ site na nwanyị[c], onye a mụrụ n’okpuru Iwu[d].
  rationale: The revision removes the unwarranted “otu” and replaces “site n’aka” with “site na,” accurately expressing the maternal source denoted by ἐκ. It also relocates [b] to the verb it annotates. The repeated “onye a mụrụ … onye a mụrụ …” is retained to reflect the parallel Greek participles without introducing doctrinal interpretation.
