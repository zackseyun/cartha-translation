    reason: lexical_alternative
  revision_rationale: The revision replaces a potentially over-literal expression for φωνή with an idiomatic Igbo expression for Paul’s manner of speaking. It also renders ἀποροῦμαι ἐν ὑμῖν as being at a loss about the Galatians, preserving Paul’s uncertainty without adding interpretation. The footnote retains the literal “voice” reading and acknowledges its possible tonal sense.
