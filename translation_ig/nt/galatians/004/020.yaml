  text: ἤθελον δὲ παρεῖναι πρὸς ὑμᾶς ἄρτι, καὶ ἀλλάξαι τὴν φωνήν μου, ὅτι ἀποροῦμαι ἐν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/020.yaml
  text: But I wish I could be with you right now and change my tone[a], because I am perplexed about you.
translation:
  language: ig
  text: Ma ọ ga-amasị m ka mụ na unu nọrọ ugbu a, ka m wee gbanwee otú m si agwa unu okwu[a], n’ihi na amaghị m ihe m ga-eche banyere unu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “gbanwee olu m.” Okwu Grik ahụ kwuru kpọmkwem, “gbanwee olu m”; ma n’ebe a, o yikarịrị ka ọ na-ekwu banyere ụda ma ọ bụ ụzọ Pọl si agwa ha okwu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤθελον
  choice: ọ ga-amasị m
  rationale: Ụdị ngwaa a na-egosi ọchịchọ Pọl nwere ugbu a nke na-emezughị; okwu a bụ Igbo nkịtị na-egosi ọchịchọ ahụ n’ụzọ dị nro.
- source_word: δὲ
  choice: Ma
  rationale: Ọ na-egosi obere ntụgharị ma ọ bụ ọdịiche n’ihe Pọl na-ekwu.
- source_word: παρεῖναι πρὸς ὑμᾶς
  choice: ịnọnyere unu
  rationale: Ọ na-egosi na Pọl chọrọ ịnọ n’ebe ha nọ, ọ bụghị nanị izigara ha ozi.
- source_word: ἄρτι
  choice: ugbu a
  rationale: Ọ na-echekwa echiche nke oge a kpọmkwem na ọchịchọ dị ngwa.
- source_word: ἀλλάξαι τὴν φωνήν μου
  choice: gbanwee ụda olu m
  rationale: N’agbanyeghị na φωνή pụtara ‘olu’ n’ụzọ nkịtị, n’ebe a ọ metụtara otú Pọl ga-esi gwa ha okwu. ‘Ụda olu’ na-egosi nke a nke ọma n’Igbo.
- source_word: ὅτι
  choice: n’ihi na
  rationale: Ọ na-ewebata ihe kpatara Pọl ji chọọ ịnọnyere ha.
- source_word: ἀποροῦμαι
  choice: gbagwojuru m anya
  rationale: Ọ na-egosi na Pọl nọ ná mgbagwoju anya ma ọ bụ na ọ maghị nke ọma ihe ọ ga-eche banyere ọnọdụ ha.
- source_word: ἐν ὑμῖν
  choice: ihe banyere unu
  rationale: N’ebe a ἐν na-ezo aka n’ihe gbasara ndị Galeshia; ntụgharị a bụ Igbo doro anya ma dịkwa mma.
theological_decisions:
- issue: Ihe φωνή pụtara n’ebe a
  choice: Ụzọ ma ọ bụ ụda Pọl ga-eji gwa ha okwu
  alternative: Olu anụ ahụ Pọl n’onwe ya
  rationale: Ihe ndị gbara amaokwu a gburugburu bụ ịdọ aka ná ntị na nchegbu onye ọzụzụ atụrụ; ya mere, o yikarịrị ka okwu ahụ na-ekwu banyere otú ọ ga-esi gwa ha okwu. Ihe odide ala peeji na-echekwa ihe okwu Grik ahụ pụtara kpọmkwem.
translation_notes:
  register: Ejiri Igbo ọkọlọtọ nke oge a, nke dị mfe nghọta ma nwee ugwu. E debere ahịrịokwu ahụ n’ụzọ na-egosi ọchịchọ Pọl, ịdị ngwa nke ‘ugbu a,’ na mgbagwoju anya ya, n’enweghị ịgbakwunye nkọwa ụka pụrụ iche.
