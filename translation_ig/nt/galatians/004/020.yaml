revisions:
- from: Ma ọ ga-amasị m ịnọnyere unu ugbu a, ka m wee gbanwee ụda olu m[a], n’ihi na ihe banyere unu gbagwojuru m anya.
  to: Ma ọ ga-amasị m ka mụ na unu nọrọ ugbu a, ka m wee gbanwee otú m si agwa unu okwu[a], n’ihi na amaghị m ihe m ga-eche banyere unu.
  rationale: The revision replaces a potentially over-literal expression for φωνή with an idiomatic Igbo expression for Paul’s manner of speaking. It also renders ἀποροῦμαι ἐν ὑμῖν as being at a loss about the Galatians, preserving Paul’s uncertainty without adding interpretation. The footnote retains the literal “voice” reading and acknowledges its possible tonal sense.
  reviewer_model: gpt-5.6-terra
