id: GAL.4.14
reference: Galatians 4:14
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ τὸν πειρασμὸν ⸀ὑμῶν ἐν τῇ σαρκί μου οὐκ ἐξουθενήσατε οὐδὲ ἐξεπτύσατε, ἀλλὰ ὡς ἄγγελον θεοῦ ἐδέξασθέ με, ὡς Χριστὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/014.yaml
  text: And though my bodily condition was a trial to you[a], you did not treat me with contempt or disgust; rather, you welcomed me as an angel of God[c][b], as Messiah Jesus.
translation:
  language: ig
  text: Ọ bụ ezie na ọnọdụ anụ ahụ m bụụrụ unu ule[a], unu eledaghị m anya, unu asọghịkwa m oyi[b]; kama, unu nabatara m dị ka mmụọ ozi Chineke, dị ka Mesaịa Jizọs[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ule unu n’anụ ahụ m.” Usoro okwu Grik siri ike, e nwekwara ike ịghọta njikọ okwu ndị a n’ụzọ ahụ.
    reason: alternative_reading
  - marker: b
    text: N’ụzọ nkịtị, “unu agbụpụghị ọnụ mmiri.” Ọ bụ okwu na-egosi ịsọ oyi ma ọ bụ ịjụ mmadụ kpamkpam.
    reason: lexical_alternative
  - marker: c
    text: N’asụsụ Grik, “Kraịst Jizọs.” E ji “Mesaịa Jizọs” mee ya ebe a n’ihi na Χριστός bụ utu aha.
    reason: lexical_alternative
lexical_decisions:
- source_word: πειρασμὸν
  choice: ule
  rationale: N’ebe a, okwu ahụ na-egosi ọnọdụ siri ike nke ọnọdụ anụ ahụ Pọl wetara ndị Galeshia, ọ bụghị ọnwụnwa ime mmehie.
- source_word: ὑμῶν ἐν τῇ σαρκί μου
  choice: ọnọdụ anụ ahụ m bụụrụ unu ule
  rationale: Nke a na-enye Igbo dị mfe ma na-egosi na ọnọdụ Pọl n’anụ ahụ ghọrọ ule nye ha; a hapụrụ ihe isi ike dị n’usoro okwu Grik n’ihe odide ala peeji.
- source_word: ἐξουθενήσατε
  choice: eledaghị m anya
  rationale: Akpaalaokwu Igbo a na-egosi ile mmadụ anya dị ka onye na-abaghị uru ma ọ bụ ịkpọ ya ihe efu.
- source_word: ἐξεπτύσατε
  choice: asọghịkwa m oyi
  rationale: Nke a na-egosi ịkpọ mmadụ asị ma ọ bụ ịjụ ya n’ihi ihe na-asọ oyi; ihe oyiyi nkịtị nke ‘ịgbụpụ ọnụ mmiri’ dị n’ihe odide ala peeji.
- source_word: ἐδέξασθέ
  choice: nabatara m
  rationale: ‘Nabatara’ na-egosi nnabata onwe onye nke ọma ma bụrụkwa okwu Igbo doro anya.
- source_word: ἄγγελον θεοῦ
  choice: mmụọ ozi Chineke
  rationale: Ntụnyere ahụ dị elu ma jikọta ya na ntụnyere Mesaịa Jizọs, ya mere ‘mmụọ ozi’ dabara karịa nanị ‘onye ozi.’
- source_word: Χριστὸν Ἰησοῦν
  choice: Mesaịa Jizọs
  rationale: Χριστός na-arụ ọrụ dị ka utu aha n’ebe a; ‘Mesaịa’ na-echekwa ọrụ ahụ karịa ime ya aha nkịtị.
theological_decisions:
- issue: Ihe ntụnyere ‘dị ka mmụọ ozi Chineke, dị ka Mesaịa Jizọs’ pụtara
  choice: Ọ na-akọ otú ndị Galeshia si kwanyere Pọl ugwu nke ukwuu mgbe ha nabatara ya.
  alternative: Enwere ike ịghọta ntụnyere nke abụọ dị ka nkwusi ike na-arị elu karịa nke mbụ.
  rationale: ὡς abụọ ahụ na-akọ ụdị nnabata e nyere Pọl; ha anaghị ekwu na Pọl bụ Mesaịa Jizọs ma ọ bụ na ha bụ otu onye.
- issue: Ihe σάρξ pụtara
  choice: ahụ mmadụ ma ọ bụ ọnọdụ anụ ahụ
  alternative: ọdịdị mmehie
  rationale: Ihe gbara amaokwu ahụ gburugburu na-ekwu maka adịghị ike ma ọ bụ ọnọdụ anụ ahụ Pọl, ọ bụghị ọchịchọ ime mmehie.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta mee ihe. ‘Eledaghị m anya’ na ‘asọghịkwa m oyi’ bụ akpaalaokwu Igbo ebumpụta ụwa nke na-echekwa ike nke ngwaa Grik abụọ ahụ, ebe ihe odide ala peeji na-edebe ihe oyiyi nkịtị nke ἐξεπτύσατε na mgbagwoju anya nke ahịrịokwu mmalite.
