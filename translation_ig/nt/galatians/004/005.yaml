revisions:
- from: ka o wee gbapụta ndị nọ n’okpuru Iwu ahụ, ka anyị wee nata ọnọdụ ịbụ ụmụ ya.[a]
  to: ka o wee gbapụta ndị nọ n’okpuru Iwu ahụ, ka anyị wee nata nkuchi dịka ụmụ.[a]
  rationale: The revision preserves the purpose structure and the reference to those under the Mosaic Law, while making the adoption sense of υἱοθεσία explicit. The note explains the masculine lexical form as filial and inheritance language without implying that women are excluded or transformed into males.
