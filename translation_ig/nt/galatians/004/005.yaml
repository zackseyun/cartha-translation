source:
  edition: SBLGNT
  text: ἵνα τοὺς ὑπὸ νόμον ἐξαγοράσῃ, ἵνα τὴν υἱοθεσίαν ἀπολάβωμεν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/005.yaml
  text: so that he might redeem those under the law[a], so that we might receive adoption as sons.
translation:
  language: ig
  text: ka o wee gbapụta ndị nọ n’okpuru Iwu ahụ, ka anyị wee nata nkuchi dịka ụmụ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “ọnọdụ ụmụ.” Okwu Grik a pụtara n’ụzọ nkịtị, “ido mmadụ n’ọnọdụ nwa nwoke”; ọ na-emesi ọnọdụ zuru ezu nke nwa na ikike nketa ike. Ndị a na-ekwu maka ha gụnyere ndị kwere ekwe, ma ndị inyom ma ndị ikom.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: ka ... wee
  rationale: Usoro a na-egosi nzube nke ọma n’Igbo n’ahịrịokwu abụọ ahụ, ma na-ada ka Igbo eke.
- source_word: τοὺς ὑπὸ νόμον
  choice: ndị nọ n’okpuru Iwu ahụ
  rationale: Ọ na-echekwa echiche nke ndị nọ n’okpuru ikike Iwu Mosis; mkpụrụedemede ukwu na okwu ngosi “ahụ” na-eme ka o doo anya na ọ bụ Iwu ahụ a maara n’okwu gbara ya gburugburu.
- source_word: ἐξαγοράσῃ
  choice: gbapụta
  rationale: “Gbapụta” na-ejikọta echiche ịtọhapụ mmadụ n’ọnọdụ e ji ya, kwekọọkwa n’ụzọ okwu mgbapụta si arụ ọrụ n’Igbo Akwụkwọ Nsọ.
- source_word: τὴν υἱοθεσίαν
  choice: ọnọdụ ịbụ ụmụ ya
  rationale: Nhọrọ a na-egosi na ihe a na-anata bụ ọnọdụ zuru ezu n’ezinụlọ Chineke, gụnyere ikike nketa, ma ghara ime ka ndị na-agụ ya chee na ọ bụ naanị ụmụ nwoke ka a na-ekwu maka ha.
- source_word: ἀπολάβωμεν
  choice: anyị wee nata
  rationale: “Nata” bụ ụzọ doro anya ma bụrụkwa nke eke isi kwuo ịnweta ihe e nyere; ihe okwu a gbakwụnyere apụtaghị n’ebe a na ọ bụ ‘ịnaghachi’.
theological_decisions:
- issue: Mmekọrịta υἱοθεσία na asụsụ gbasara nwoke na nwanyị
  choice: ọnọdụ ịbụ ụmụ ya
  alternative: ịbụ ụmụ nwoke ya e kuchiri ekuchi; nkuchi
  rationale: N’Igbo, “ụmụ” na-agụnye nwoke na nwanyị. Ịgbakwunye “ọnọdụ” na-echekwa isi okwu Pọl banyere ọnọdụ zuru ezu na ikike nketa nke ụmụ, ebe nkọwa ala peeji na-akọwa ọdịdị okwu Grik ahụ.
- issue: Ndị okwu “ndị nọ n’okpuru Iwu ahụ” na-ezo aka na ha
  choice: N’ụzọ bụ isi, ndị nọ n’okpuru Iwu Mosis
  alternative: mmadụ niile nọ n’okpuru iwu n’ozuzu
  rationale: N’ime Ndị Galeshia 4:4–5, njikọ ya na Ọkpara a mụrụ n’okpuru Iwu na-atụ aka n’ụzọ kachasị eke n’ebe ndị nọ n’okpuru Torah nọ, ma ‘anyị’ na-esote ya na-eme ka uru nke ọnọdụ ụmụ ahụ gbasaa ruo ndị niile kwere ekwe.
translation_notes:
  register: Igbo ọkọlọtọ, nke dị ugwu ma dị mfe nghọta. E jiri “Iwu” mee aha Iwu Mosis; e jiri “ụmụ” mee ka ndị nwoke na ndị nwanyị sonye n’enweghị ihichapụ echiche ọnọdụ na ikike nketa dị n’okwu Grik.
