  text: You are carefully observing days and months and seasons and years.
translation:
  language: ig
  text: Unu na-akpachapụ anya n’idebe ụbọchị na ọnwa na oge na afọ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Unu na-edebe ụbọchị na ọnwa na oge a kara aka na afọ.” Ndepụta a na-ekwu maka idebe oge dị iche iche n’usoro kalenda; a pụkwara ịsụgharị “oge” (καιρούς) dịka “oge a kara aka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμέρας
  choice: ụbọchị
  rationale: Ọ bụ okwu nkịtị maka ‘ụbọchị.’ Agbakwunyereghị ‘ụbọchị pụrụ iche’ n’ihi na nkọwa ahụ adịghị n’okwu Grik n’onwe ya.
- source_word: παρατηρεῖσθε
  choice: na-akpachapụ anya edebe
  rationale: Ụdị ngwaa a na-egosi omume ha na-aga n’ihu, ọ pụkwara ịpụta ilezi anya nke ọma ma ọ bụ idebe ihe nke ọma. Nhọrọ a na-egosi nlezianya dị n’omume ahụ n’agbanyeghị na ọ naghị akọwa ụdị iwu kalenda ahụ karịa ihe odide Grik kwuru.
- source_word: μῆνας
  choice: ọnwa
  rationale: Nke a bụ ntụgharị nkịtị nke okwu Grik maka ọnwa, dịka otu akụkụ nke usoro oge e depụtara.
- source_word: καιρούς
  choice: oge
  rationale: Okwu a nwere ike ịpụta oge ma ọ bụ oge a kara aka. ‘Oge’ na-echekwa obosara ihe okwu Grik nwere ike ịpụta, ebe e tinyere ‘oge a kara aka’ dị ka nhọrọ n’okpuru peeji.
- source_word: ἐνιαυτούς
  choice: afọ
  rationale: Ọ bụ ntụgharị nkịtị nke okwu Grik maka afọ, ma ọ na-emecha usoro oge ahụ.
- source_word: καὶ
  choice: na
  rationale: E chekwara njikọ ndị a iji nọgide na-enwe usoro na ụda nke ndepụta Pọl.
theological_decisions:
- issue: Ma a ga-akọwa n’amaokwu ahụ kpọmkwem na ndị a bụ emume ndị Juu ma ọ bụ omume okpukpe dịka kalenda si dị
  choice: E debere naanị aha oge ndị ahụ n’amaokwu ahụ, n’etinyeghị ‘ndị pụrụ iche,’ ‘ndị dị nsọ,’ ma ọ bụ ‘emume.’
  alternative: Unu na-akpachapụ anya edebe ụbọchị okpukpe, ọnwa, oge emume, na afọ.
  rationale: Pọl depụtara ụdị oge ndị ahụ n’enweghị okwu ndị na-akọwa ha. Ihe gbara amaokwu ahụ gburugburu na-egosi idebe usoro kalenda metụtara okpukpe, ma e kwesịghị itinye nkọwa karịrị ihe Grik kwuru kpọmkwem.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke kwụ ọtọ ma dị ùgwù. ‘Na-akpachapụ anya edebe’ na-egosi omume na-aga n’ihu na nlezianya dị na παρατηρεῖσθε; a hapụrụ aha oge ndị ahụ n’ụdị dị mfe ka a ghara ịtinye nkọwa okpukpe na-adịghị n’okwu Grik kpọmkwem.
