    issue: Unidiomatic verbal construction in the main text
    rationale: The phrase “na-akpachapụ anya edebe” improperly joins the adverbial expression with the infinitive. Standard Igbo naturally uses “na-akpachapụ anya n’idebe.”
  - severity: low
    issue: Footnote phrasing is awkward
    rationale: “Omume ndị a na-edebe dịka kalenda si dị” is less clear and natural than directly describing the list as referring to observances in a calendar.
