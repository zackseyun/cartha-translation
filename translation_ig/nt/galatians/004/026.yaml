  source_fidelity: The text accurately conveys the adversative δέ ('Ma'), the spatial-metaphorical ἄνω ('nke dị n’elu'), Jerusalem’s free status, and the maternal personification in ἥτις ἐστὶν μήτηρ ἡμῶν. 'Nweere onwe ya' naturally communicates the predicate ‘is free’ without adding an explicit ‘woman,’ which the Greek does not state independently here.
  naturalness: The sentence is clear, idiomatic Standard Igbo, and retains a dignified biblical register. The use of ‘ọ’ in the second clause appropriately carries the feminine personification of Jerusalem in Igbo.
  terminology: ‘Jerusalem,’ ‘nweere onwe ya,’ and ‘nne anyị’ are suitable and consistent with the surrounding slave/free and mother imagery. The wording avoids over-specifying ‘above’ as ‘heavenly.’
