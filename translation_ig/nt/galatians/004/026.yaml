id: GAL.4.26
reference: Galatians 4:26
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἡ δὲ ἄνω Ἰερουσαλὴμ ἐλευθέρα ἐστίν, ἥτις ἐστὶν ⸀μήτηρ ἡμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/026.yaml
  text: But the Jerusalem above is free[a], and she is our mother.
translation:
  language: ig
  text: Ma Jerusalem nke dị n’elu nweere onwe ya, ọ bụkwa nne anyị.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “nke bụ nne anyị.” Nnọchiaha njikọ Grik ahụ nwere ike ịsụgharị n’ụzọ a kapịrị ọnụ karị, ma n’amaokwu a, e mere Jerusalem ka à ga-asị na ọ bụ nne.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Ma
  rationale: Ọ na-egosi ọdịiche dị n’etiti Jerusalem nke dị ugbu a, nke amaokwu bu ụzọ kwuru banyere ya, na Jerusalem nke dị n’elu.
- source_word: ἄνω
  choice: nke dị n’elu
  rationale: Nke a na-edobe echiche ọnọdụ dị n’elu dị n’okwu Grik, kama ịkọwa ya ozugbo dị ka ‘nke eluigwe.’
- source_word: Ἰερουσαλήμ
  choice: Jerusalem
  rationale: E ji ụdị aha a a maara nke ọma n’Igbo dee aha obodo ahụ.
- source_word: ἐλευθέρα
  choice: nweere onwe ya
  rationale: Ọ na-egosi ọnọdụ Jerusalem ahụ dị ka onye nweere onwe ya, ma na-edobe njikọ ya na ọdịiche dị n’etiti ohu na onye nweere onwe ya n’akụkụ Akwụkwọ Nsọ a.
- source_word: ἥτις
  choice: ọ bụkwa
  rationale: Ọ na-aga n’ihu n’ụzọ Igbo si ada nke ọma ma na-egosikwa na e ji Jerusalem mee ka à ga-asị na ọ bụ nwanyị; ihe e ji ‘nke bụ’ sụgharịa ya n’ụzọ ka kpọmkwem ka edere n’ala ala peeji.
- source_word: μήτηρ
  choice: nne
  rationale: Ọ na-edobe ihe atụ nke ịbụ nne, bụ́ isi ihe n’arụmụka Pọl banyere Hega, Sera, na Jerusalem.
- source_word: ἡμῶν
  choice: anyị
  rationale: Nke a bụ ụzọ doro anya na nke nkịtị e si egosi ‘nne nke anyị’ n’Igbo.
theological_decisions:
- issue: Onye ‘Jerusalem nke dị n’elu’ na-anọchi anya ya na ime ka ọ dị ka nwanyị
  choice: E ji nnọchiaha ‘ọ’ na nkebiokwu ‘ọ bụkwa nne anyị’ mee ka Jerusalem pụta dị ka nne.
  alternative: ‘nke bụ nne anyị’
  rationale: N’arụmụka ihe atụ Pọl, Jerusalem kwekọrọ na Sera, bụ́ nwanyị nweere onwe ya na nne. Nsụgharị a na-eme ka ihe atụ ahụ doo anya n’Igbo n’etinyeghị nkọwa okpukpe ọzọ na-adịghị n’ihe odide ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta, mee ihe. ‘Nke dị n’elu’ na-edobe ihe atụ dị n’asụsụ Grik; ‘nweere onwe ya’ na-adaba n’okwu ndị gbara amaokwu ahụ gburugburu banyere ịbụ ohu na ịbụ onye nweere onwe ya.
