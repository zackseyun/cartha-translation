  - severity: medium
    issue: “nọ n’ohu” is less explicit than the Greek slavery predicate.
    rationale: Although it can express a state of bondage, it may also be understood more generally as service. δουλεύει in this allegorical context calls for an unambiguous expression of being enslaved/slaves.
