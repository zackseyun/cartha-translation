  text: τὸ ⸀δὲ Ἁγὰρ Σινᾶ ὄρος ἐστὶν ἐν τῇ Ἀραβίᾳ, συστοιχεῖ δὲ τῇ νῦν Ἰερουσαλήμ, δουλεύει ⸀γὰρ μετὰ τῶν τέκνων αὐτῆς·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/025.yaml
  text: Hagar is Mount Sinai in Arabia[a], and she corresponds to the present Jerusalem, for she is enslaved with her children.
translation:
  language: ig
  text: Hega bụ Ugwu Saịnaị nke dị n’Arebia[a], ọ dakọkwara na Jerusalem nke dị ugbu a, n’ihi na ya na ụmụ ya bụ ohu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “Ma Hega a bụ Ugwu Saịnaị nke dị n’Arebia.” N’asụsụ Grik, e nwere edemede n’ihu “Hega,” nke mere ka nhazi nkebi ahịrịokwu a sie ike.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ δὲ Ἁγὰρ
  choice: Hega
  rationale: A hapụrụ δέ ka njikọ dị nro nke usoro okwu wee pụta site n’usoro ahịrịokwu Igbo; edemede τὸ dị n’ihu aha ahụ siri ike igosipụta n’Igbo n’enweghị ịgbakwụnye nkọwa na-adịghị na ederede.
- source_word: Σινᾶ ὄρος ἐστὶν ἐν τῇ Ἀραβίᾳ
  choice: bụ Ugwu Saịnaị nke dị n’Arebia
  rationale: Nke a na-edobe nkwupụta nhata Pọl kwuru kpọmkwem, ma gosikwa ọnọdụ ugwu ahụ n’Arebia n’ụzọ doro anya.
- source_word: συστοιχεῖ
  choice: ọ dakọkwara na
  rationale: ‘Dakọtara na’ na-egosi na ha nọ n’otu ahịrị ma ọ bụ otu akụkụ n’ihe atụ Pọl, n’enweghị ịkọwa ihe atụ ahụ karịa ka Grik kwuru.
- source_word: τῇ νῦν Ἰερουσαλήμ
  choice: Jerusalem nke dị ugbu a
  rationale: Nke a na-egosipụta νῦν nke na-ekewa Jerusalem nke oge ahụ na ‘Jerusalem nke dị n’elu’ n’amaokwu na-esote.
- source_word: δουλεύει
  choice: nọ n’ohu
  rationale: Okwu a na-egosipụta ọnọdụ ịbụ ohu, ọ bụghị nanị ijere mmadụ ozi, ma na-edobe ọdịiche dị n’etiti ohu na nnwere onwe n’akụkụ Akwụkwọ Nsọ a.
- source_word: μετὰ τῶν τέκνων αὐτῆς
  choice: ya na ụmụ ya
  rationale: Nke a bụ ụzọ Igbo nkịtị si egosi na ya na ụmụ ya nọkọtara n’otu ọnọdụ ahụ.
theological_decisions:
- issue: Njirimara ihe atụ nke Hega na Ugwu Saịnaị/Jerusalem
  choice: ‘Hega bụ Ugwu Saịnaị ... ọ dakọkwara na Jerusalem nke dị ugbu a’
  alternative: ‘Hega nọchiri anya Ugwu Saịnaị’
  rationale: Grik ji asụsụ nhata kpọmkwem kwuo ya tupu o jiri ngwaa nke ndakọrịta; nsụgharị ahụ anaghị eme ka ike okwu Pọl daa ma ọ bụ tinyekwuo nkọwa.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ugwu ma dị mfe nghọta, dee ya. A họọrọ ‘nọ n’ohu’ iji mee ka isiokwu ohu na nnwere onwe pụta ìhè; e debere okwu nhata Pọl n’enweghị ime ka ọ bụrụ naanị ‘na-anọchi anya.’
