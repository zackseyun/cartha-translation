  text: So then[a], have I become your enemy by telling you the truth?
translation:
  language: ig
  text: Ya mere[a], ọ̀ bụrụla m onye iro unu n’ihi na m na-agwa unu eziokwu?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ịsụgharị ya: “n’ihi na m na-ekwu eziokwu n’ebe unu nọ.” Okwu Grik a, ἀληθεύων, nwere ike ịpụta “ịgwa mmadụ eziokwu” ma ọ bụ “ikwu okwu n’eziokwu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: Ya mere
  rationale: Ọ bụ okwu nkwubi okwu nke na-ejikọta ajụjụ a na ihe Pọl kwuru tupu ya; “Ya mere” bụ Igbo nkịtị ma doo anya.
- source_word: ἐχθρὸς
  choice: onye iro
  rationale: N’ebe a, okwu ahụ na-ezo aka n’onye a na-ewere dị ka onye iro; “onye iro” bụ ntụgharị Igbo doro anya.
- source_word: ὑμῶν
  choice: unu
  rationale: Ọ bụ nnọchiaha ọtụtụ n’ọnọdụ genitive, nke e ji n’Igbo soro “onye iro” kwuo “onye iro unu.”
- source_word: γέγονα
  choice: èmeela m
  rationale: Perfect nke γίνομαι na-egosi mgbanwe nke mere eme ma ọnọdụ ya ka dị ugbu a; “èmeela m” na-eburu echiche ahụ n’ajụjụ a.
- source_word: ἀληθεύων
  choice: na-agwa unu eziokwu
  rationale: Participle a nwere ike ịpụta ịgwa mmadụ eziokwu ma ọ bụ ikwu okwu n’eziokwu. N’ọnọdụ a, “na-agwa unu eziokwu” bụ okwu Igbo ebumpụta ụwa nke na-egosi okwu Pọl gwara ha.
- source_word: ὑμῖν
  choice: unu
  rationale: Dative a na-egosi ndị a gwara okwu; etinyere ya n’usoro Igbo ebumpụta ụwa, “na-agwa unu eziokwu.”
theological_decisions:
- issue: Ihe ἀληθεύων pụtara n’arụmụka Pọl
  choice: Pọl na-ajụ ma ịgwa ndị Galeshia eziokwu ò mere ka ha were ya dị ka onye iro ha.
  alternative: Pọl na-ajụ ma ịdị na-ekwu eziokwu n’ebe ha nọ ò mere ka ọ bụrụ onye iro ha.
  rationale: Ihe ndị gbara amaokwu a gburugburu bụ ịdọ aka ná ntị na arịrịọ Pọl gwara ha ozugbo. Ma ebe okwu Grik ahụ nwere ohere abụọ, e debere nke ọzọ n’okpuru peeji kama ikpochapụ nghọta ahụ.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị mfe nghọta ma nwee ugwu. Ajụjụ ahụ ka bụ ajụjụ nkwubi okwu dị nkọ, a hapụkwara nghọta abụọ nke ἀληθεύων site n’okpuru peeji.
