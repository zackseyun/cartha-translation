  text: ⸂ὑμεῖς δέ, ἀδελφοί, κατὰ Ἰσαὰκ ἐπαγγελίας τέκνα ἐστέ⸃·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/028.yaml
  text: You[a], brothers, like Isaac, are children of promise.
translation:
  language: ig
  text: Ma unu onwe unu, ụmụnna[a], dị ka Aịzik, bụ ụmụ nke nkwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’asụsụ Grik, okwu a bụ ụdị ọtụtụ nke “nwanne nwoke,” ma a na-eji ya akpọ ọgbakọ dum okwu, o yikwara ka ọ gụnyere ma ndị nwoke ma ndị nwanyị. Okwu Igbo bụ “ụmụnna” nwere ike ịgụnye ha niile.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς
  choice: unu onwe unu
  rationale: Nnọchiaha onye nke abụọ n’ọtụtụ dị n’amaokwu Grik ahụ n’onwe ya, ya mere “unu onwe unu” na-egosipụta nkwusi okwu ahụ n’ụzọ Igbo na-ada nke ọma.
- source_word: δέ
  choice: ma
  rationale: Ọ na-egosi ntụgharị okwu dị nro nke nwekwara ntakịrị ọdịiche n’ihe Pọl kwuru tupu ya; “ma” na-eburu ọrụ ahụ n’Igbo.
- source_word: ἀδελφοί
  choice: ụmụnna
  rationale: Ọ bụ okwu ịkpọ ọgbakọ ahụ okwu. “Ụmụnna” bụ okwu Igbo ebumpụta ụwa nke pụrụ ịgụnye ndị nwoke na ndị nwanyị, ma ọ naghị etinye nkọwa okpukpe pụrụ iche.
- source_word: κατὰ Ἰσαὰκ
  choice: dị ka Aịzik
  rationale: κατά ebe a na-egosi Aịzik dị ka ihe atụ ma ọ bụ ụkpụrụ a na-atụnyere ndị a na-agwa okwu; “dị ka Aịzik” bụ ntụgharị doro anya ma dị mma n’Igbo.
- source_word: ἐπαγγελίας
  choice: nke nkwa
  rationale: A hapụrụ njikọ genitiv ahụ dịka “ụmụ nke nkwa” iji chekwaa ụzọ Pọl si kwuo ya na ibu echiche ya, kama ịgbanwe ya ka ọ bụrụ nanị “ụmụ e kwere ná nkwa.”
- source_word: τέκνα
  choice: ụmụ
  rationale: Okwu ahụ anaghị akọwapụta okike nwoke ma ọ bụ nwanyị, kama ọ na-elekwasị anya n’ọnọdụ ha dị ka ụmụ; “ụmụ” na-egosi nke a nke ọma.
- source_word: ἐστέ
  choice: bụ
  rationale: Nke a bụ ngwaa njikọ onye nke abụọ n’ọtụtụ, nke jikọtara ndị a na-agwa okwu na “ụmụ nke nkwa.”
theological_decisions:
- issue: Njikọ e mere n’etiti ndị kwere ekwe na Aịzik n’arụmụka Pọl
  choice: “dị ka Aịzik, bụ ụmụ nke nkwa”
  alternative: “bụ ụmụ e kwere ná nkwa dị ka Aịzik”
  rationale: Nhọrọ a na-edebe Aịzik dịka onye e ji atụ ha, ma na-edebekwa “ụmụ nke nkwa” dịka ihe a na-ekwu na ha bụ. Ọ naghị eme ka nkwa ahụ bụrụ nanị nkwa banyere ọmụmụ ha, ma ọ bụ tinye nkọwa nkwenkwe karịrị ihe amaokwu ahụ kwuru.
translation_notes:
  register: E ji Igbo ọkọlọtọ, nke ugwu ma dị mfe nghọta, dee amaokwu ahụ. “Unu onwe unu” na-eburu nkwusi okwu nke nnọchiaha Grik; “ụmụ nke nkwa” na-echekwa usoro okwu Pọl na mgbagwoju echiche ya n’enweghị nkọwa agbakwunyere.
