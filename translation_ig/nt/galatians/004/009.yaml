id: GAL.4.9
reference: Galatians 4:9
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: νῦν δὲ γνόντες θεόν, μᾶλλον δὲ γνωσθέντες ὑπὸ θεοῦ, πῶς ἐπιστρέφετε πάλιν ἐπὶ τὰ ἀσθενῆ καὶ πτωχὰ στοιχεῖα, οἷς πάλιν ἄνωθεν ⸀δουλεύειν θέλετε;
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/009.yaml
  text: But now[a], having come to know God—or rather, having been known by God—how can you turn back again to the weak and poor elemental principles, to which you want to be enslaved all over again?
translation:
  language: ig
  text: Ma ugbu a, ebe unu marala Chineke—ma kama, ebe Chineke marala unu—olee otú unu si alaghachi ọzọ n’ebe ihe ndị bụ isi[a] ndị na-adịghị ike na ndị ogbenye dị, bụ́ ndị unu chọrọ ịbụ ohu ha ọzọ site ná mmalite?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị okwu Grik a dị ka “mmụọ elementrị,” “ụkpụrụ ndị bụ isi,” ma ọ bụ “ihe elementrị.”
    reason: lexical_alternative
lexical_decisions:
- source_word: γνόντες θεόν
  choice: ebe unu matara Chineke
  rationale: A sụgharịrị aorist participle ahụ n’ụzọ na-egosi na ha abanyela n’ịmara Chineke, ma debe njikọ ya na ajụjụ bụ isi.
- source_word: μᾶλλον δὲ γνωσθέντες ὑπὸ θεοῦ
  choice: ma ọ bụ kama, ebe Chineke matara unu
  rationale: “Ma ọ bụ kama” na-egosi na Pọl na-agbazi ma na-eme ka okwu mbụ sikwuo ike; ntụgharị ahụ debekwara Chineke dị ka onye mere ihe ahụ.
- source_word: πῶς ἐπιστρέφετε πάλιν
  choice: olee otú unu si na-alaghachi ọzọ
  rationale: Ajụjụ a na-egosi ihe ijuanya na mba Pọl; “na-alaghachi” na-egosikwa omume na-aga n’ihu, ebe “ọzọ” debere πάλιν.
- source_word: τὰ ἀσθενῆ καὶ πτωχὰ στοιχεῖα
  choice: ihe ndị mbụ ahụ na-adịghị ike, ndị darakwa ogbenye
  rationale: “Ihe ndị mbụ” anaghị ekpebi kpamkpam ma okwu ahụ ọ pụtara ụkpụrụ okpukpe ndị bụ isi, ihe ndị elementrị, ma ọ bụ ike ime mmụọ. E debere ihe atụ “dara ogbenye” nke πτωχά kama ime ka ọ ghọọ naanị “abaghị uru.”
- source_word: οἷς
  choice: ha
  rationale: Nnochiaha a na-ezo azụ n’ihe ndị mbụ ahụ; Igbo nwere ike iji “ha” maka ọtụtụ ihe n’enweghị ikpebi na ha bụ ndị mmụọ.
- source_word: πάλιν ἄνωθεν
  choice: ọzọ site ná mmalite
  rationale: Nke a na-egosi ma imeghachi ihe ahụ ma ịmaliteghachi ya site na mbụ.
- source_word: δουλεύειν θέλετε
  choice: unu ji chọọ ịbụ ndị ohu ha
  rationale: “Ịbụ ndị ohu” na-echekwa ihe oyiyi nke ịgba ohu dị na δουλεύειν, ebe “chọọ” na-egosi uche ma ọ bụ ọchịchọ dị na θέλετε.
theological_decisions:
- issue: Ihe στοιχεῖα pụtara na Ndị Galeshia 4:9
  choice: ihe ndị mbụ
  alternative: mmụọ ndị na-achị ihe ndị dị n’ụwa; ụkpụrụ ndị bụ isi; ihe ndị elementrị
  rationale: Okwu Grik ahụ nwere nghọta dị iche iche n’ebe Pọl nọ. Nhọrọ dị n’ahịrị bụ isi na-ahapụ nghọta ahụ ghe oghe, ebe nkọwa ala peeji na-edebe nhọrọ ndị ọzọ.
- issue: Ike dị n’okwu “Chineke matara unu”
  choice: E gosiri ịmata ha nke Chineke dị ka mgbazi na ihe ka mkpa karịa ịmata Chineke nke ha
  alternative: Nanị ikwu maka mmekọrịta, n’enweghị ihe ọ bụla gbasara ụzọ Chineke si buru ụzọ mee ihe
  rationale: μᾶλλον δέ na-egosi mgbazi n’ezie. Ntụgharị ahụ debere Chineke dị ka onye mere ihe ahụ, ma ọ naghị etinye usoro ozizi karịrị ihe amaokwu ahụ kwuru.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma doo ndị nkịtị anya. E kewara ajụjụ Grik ahụ ụzọ abụọ n’Igbo ka ọ na-aga nke ọma ma na-edebe mba na ihe ijuanya Pọl. Akara nkọwa [a] dị kpọmkwem n’akụkụ okwu στοιχεῖα metụtara.
