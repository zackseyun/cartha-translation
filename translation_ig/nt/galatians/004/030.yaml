  text: ἀλλὰ τί λέγει ἡ γραφή; Ἔκβαλε τὴν παιδίσκην καὶ τὸν υἱὸν αὐτῆς, οὐ γὰρ μὴ ⸀κληρονομήσει ὁ υἱὸς τῆς παιδίσκης μετὰ τοῦ υἱοῦ τῆς ἐλευθέρας.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/030.yaml
  text: But what does the Scripture say? “Cast out the servant woman and her son[c][b][a], for the son of the servant woman will certainly not inherit with the son of the free woman.”
translation:
  language: ig
  text: Ma gịnị ka Akwụkwọ Nsọ na-ekwu? “Chụpụ nwanyị ohu ahụ[a] na nwa ya nwoke, n’ihi na nwa nwoke nke nwanyị ohu ahụ agaghị eso nwa nwoke nke nwanyị nweere onwe ya keta ihe nketa ma ọlị.”[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “nwanyị nọ n’agbụ” ma ọ bụ “odibo nwanyị.” Okwu Grik ahụ na-egosi nwanyị bụ ohu ma ọ bụ odibo; a họọrọ “nwanyị ohu” n’ihi na ọdịiche dị n’etiti ịgba ohu na inwere onwe bụ isi n’akụkụ a.
    reason: lexical_alternative
  - marker: b
    text: Okwu a na-ekwughachi Jenesis 21:10.
    reason: cross_reference
  - marker: c
    text: 'Asụsụ Grik ji nkwugide siri ike: “agaghị ... ma ọlị”; a pụkwara ịsụgharị ya, “ọ dịghị ụzọ ọ ga-esi keta.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Ma
  rationale: Na-egosi ntụgharị nke na-emegide ihe e kwuru tupu ya, n’ụzọ dị mfe ma bụrụkwa Igbo eke.
- source_word: τί λέγει ἡ γραφή
  choice: gịnị ka Akwụkwọ Nsọ na-ekwu?
  rationale: Na-edobe oge ugbu a na ụzọ e si mee Akwụkwọ Nsọ ka ọ bụrụ onye na-ekwu okwu.
- source_word: Ἔκβαλε
  choice: Chụpụ
  rationale: Na-egosipụta iwu siri ike nke ịchụ mmadụ pụọ, ọ bụghị naanị iziga ya nwayọọ.
- source_word: παιδίσκην
  choice: nwanyị ahụ bụ ohu
  rationale: Na-eme ka ọnọdụ ya dịka ohu pụta ìhè, ebe ọdịiche dị n’etiti ịbụ ohu na inwere onwe bụ isi n’arụmụka a.
- source_word: υἱὸν αὐτῆς
  choice: nwa ya nwoke
  rationale: Na-asụgharị njikọ nwe ya n'ụzọ doro anya ma kwekọọ na Igbo ugbu a.
- source_word: οὐ γὰρ μὴ κληρονομήσει
  choice: agaghị eketa ma ọlị
  rationale: ‘Ma ọlị’ na-ebupụta nkwugide siri ike nke οὐ μή tinyere ngwaa ọdịnihu.
- source_word: μετὰ τοῦ υἱοῦ
  choice: ya na nwa nwoke
  rationale: Na-egosi iso onye ọzọ kerịta ihe nketa.
- source_word: τῆς ἐλευθέρας
  choice: nke nwanyị nweere onwe ya
  rationale: Na-emeju aha nwanyị nke adjective Greek na-anọchi anya ya ma na-echekwa ọdịiche ohu/onwere onwe.
theological_decisions:
- issue: Nsụgharị παιδίσκη n’ihe atụ Pọl banyere Hega na Sera
  choice: nwanyị ahụ bụ ohu
  alternative: odibo nwanyị / nwanyị nọ n’agbụ
  rationale: Ọnọdụ ịgba ohu bụ isi n’ọdịiche Pọl na-eme n’etiti ịgba ohu na inwere onwe; ya mere a kpọrọ ya ohu n’ụzọ doro anya.
- issue: Ike nke nkwugide οὐ γὰρ μὴ κληρονομήσει
  choice: agaghị eketa ma ọlị
  alternative: ọ dịghị ụzọ ọ ga-esi keta / ọ gaghị eketa n’ezie
  rationale: Na-echekwa nkwugide kategorikal nke Greek n’etinyeghị nkọwa nkà mmụta okpukpe karịrị amaokwu ahụ.
translation_notes:
  register: Igbo ọkọlọtọ, nke oge a, dị ùgwù ma dị mfe nghọta. A na-eji “Akwụkwọ Nsọ” dịka aha isi mmalite nwere ikike; “chụpụ” na-echekwa ike iwu ahụ, ebe “ma ọlị” na-egosi nkwugide siri ike nke Greek.
