    text: Ma ọ bụ, “onye nke Mmụọ Nsọ.” Okwu “a mụrụ” adịghị na nkebi nke abụọ n’asụsụ Grik; e si na nkebi mbụ ghọta ya iji mee ka ntụnyere ahụ doo anya n’Igbo.
    reason: lexical_alternative
