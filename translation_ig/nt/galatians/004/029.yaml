id: GAL.4.29
reference: Galatians 4:29
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀλλ’ ὥσπερ τότε ὁ κατὰ σάρκα γεννηθεὶς ἐδίωκε τὸν κατὰ πνεῦμα, οὕτως καὶ νῦν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/029.yaml
  text: But just as then the one born according to the flesh persecuted the one born according to the Spirit[b][a], so also it is now.
translation:
  language: ig
  text: Ma dịka o siri dị n’oge ahụ, onye a mụrụ n’ụzọ anụ ahụ[a] na-akpagbu onye a mụrụ n’ụzọ nke Mmụọ Nsọ[b], otu a ka ọ dịkwa ugbu a.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “onye a mụrụ site n’ụzọ mmadụ nkịtị”; n’ụzọ nkịtị, “onye a mụrụ n’ụzọ anụ ahụ.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “onye nke Mmụọ Nsọ.” Okwu “a mụrụ” adịghị na nkebi nke abụọ n’asụsụ Grik; e si na nkebi mbụ ghọta ya iji mee ka ntụnyere ahụ doo anya n’Igbo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: Ma
  rationale: Na-egosi ntụgharị megide ihe e kwuru tupu ya n’ụzọ dị mkpirikpi ma bụrụkwa Igbo nkịtị.
- source_word: ὥσπερ τότε ... οὕτως καὶ νῦν
  choice: dị nnọọ ka n’oge ahụ ... otú ahụ ka ọ dịkwa ugbu a
  rationale: Na-echekwa nhazi ntụnyere na ọdịiche dị n’etiti oge ahụ na ugbu a, ma na-ada nke ọma n’Igbo.
- source_word: ὁ ... γεννηθεὶς
  choice: onye a mụrụ
  rationale: Na-asụgharị participle passive e ji mee aha n’ụzọ doro anya ma dị mfe nghọta.
- source_word: κατὰ σάρκα
  choice: dị ka anụ ahụ si dị
  rationale: Na-echekwa okwu Pọl na njikọ ya na ọdịiche dị n’etiti anụ ahụ na Mmụọ, n’ebughị ụzọ kọwaa ya dị ka ‘ọdịdị mmehie.’
- source_word: ἐδίωκε
  choice: kpagburu
  rationale: Na-egosi mmegide na mmekpa ahụ dị n’okwu διώκω; oge gara aga kwekọrọ na ntụnyere akụkọ ihe mere eme.
- source_word: τὸν κατὰ πνεῦμα
  choice: onye a mụrụ dị ka Mmụọ Nsọ si dị
  rationale: E tinyere ‘a mụrụ’ nke a ghọtara site na nkebi mbụ ka ntụnyere ahụ doo anya n’Igbo, ebe ‘dị ka ... si dị’ na-echekwa obosara κατά.
- source_word: πνεῦμα
  choice: Mmụọ Nsọ
  rationale: N’ọnọdụ akwụkwọ Ndị Galeshia, okwu a na-ezo aka n’ọrụ Mmụọ Chineke nke jikọrọ ya na nkwa; ‘Mmụọ Nsọ’ na-eme ka onye a na-ekwu maka ya doo ndị na-agụ Igbo anya.
- source_word: νῦν
  choice: ugbu a
  rationale: Na-ejikọta ihe mere n’oge ahụ na ọnọdụ dị n’oge Pọl.
theological_decisions:
- issue: Ihe κατὰ σάρκα pụtara n’ọdịiche dị n’etiti Ishmel na Aịzik
  choice: Ọmụmụ sitere n’ụzọ mmadụ nkịtị, ebe a ka debere okwu ‘anụ ahụ’ n’ahịrịokwu bụ isi.
  alternative: Ịmụ site n’ọdịdị mmehie, ma ọ bụ ịmụ n’ụzọ nke ụwa.
  rationale: Ọnọdụ Galeshia 4:23, 29 na-atụnyere ọmụmụ Ishmel n’ụzọ mmadụ na ọmụmụ Aịzik nke jikọrọ ya na nkwa na Mmụọ; ọ dịghị mkpa itinye echiche banyere ọdịdị mmehie n’okwu a.
- issue: Onye πνεῦμα na-ezo aka na ya
  choice: Mmụọ Nsọ
  alternative: Mmụọ mmadụ, ma ọ bụ ụkpụrụ ime mmụọ.
  rationale: N’ọnọdụ arụmụka Pọl banyere nkwa na ndị bụ ụmụ nkwa, Mmụọ Chineke bụ ihe okwu a kacha yie ka ọ na-ezo aka na ya, ọ bụ ezie na nhazi ‘dị ka ... si dị’ ka na-echekwa ụzọ okwu Grik si kwuo ya.
translation_notes:
  register: Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E ji ‘kpagburu’ gosipụta mmegide siri ike. E debere ọdịiche Pọl n’etiti ‘anụ ahụ’ na ‘Mmụọ Nsọ’ n’enweghị itinye nkọwa ụka pụrụ iche.
