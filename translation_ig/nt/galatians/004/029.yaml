revisions:
- from: Ma dị nnọọ ka n’oge ahụ, onye a mụrụ dị ka anụ ahụ si dị kpagburu onye a mụrụ dị ka Mmụọ Nsọ si dị,[a][b] otú ahụ ka ọ dịkwa ugbu a.
  to: Ma dịka o siri dị n’oge ahụ, onye a mụrụ n’ụzọ anụ ahụ[a] na-akpagbu onye a mụrụ n’ụzọ nke Mmụọ Nsọ[b], otu a ka ọ dịkwa ugbu a.
  rationale: The revision replaces literal but awkward κατά-calques with parallel Standard Igbo expressions, retains “anụ ahụ” and “Mmụọ Nsọ” for the key Pauline contrast, uses an imperfective verb for ἐδίωκε, and relocates each footnote marker to its proper lexical anchor.
