  text: ἅτινά ἐστιν ἀλληγορούμενα· αὗται γάρ εἰσιν δύο διαθῆκαι, μία μὲν ἀπὸ ὄρους Σινᾶ, εἰς δουλείαν γεννῶσα, ἥτις ἐστὶν Ἁγάρ,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/024.yaml
  text: 'These things are being interpreted allegorically[a], for these women are two covenants: one from Mount Sinai, bearing children for slavery[b]; she is Hagar.'
translation:
  language: ig
  text: 'A na-akọwa ihe ndị a n''ụzọ ihe atụ[a], n’ihi na ụmụ nwanyị abụọ a bụ ọgbụgba ndụ abụọ: otu sitere n’Ugwu Saịnaị, nke na-amụ ụmụ ka ha bụrụ ndị ohu[b]; ọ bụ Hega.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Enwere ike ịtụgharị ya, “a na-ekwu ihe ndị a n’ụzọ ihe atụ,” ma ọ bụ, “ihe ndị a bụ ihe atụ.” Okwu Grik ahụ na-egosi na Pọl ji akụkọ e kwuru n’elu mee ihe n’ụzọ ihe atụ.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “na-amụ ụmụ ka ha daba n’ịbụ ohu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἅτινά
  choice: ihe ndị a
  rationale: Ọ na-ezo aka n’akụkọ banyere Sera na Hega e kwuru tupu ebe a; nsụgharị a bụ Igbo doro anya ma na-edobe njikọ ahụ.
- source_word: ἀλληγορούμενα
  choice: a na-akọwa ... n'ụzọ ihe atụ
  rationale: Ọ na-egosi na a na-eji akụkọ ahụ akọwa ihe ọzọ n'ụzọ ihe atụ, kama ikwu na akụkọ ahụ abụghị ihe mere eme.
- source_word: αὗται
  choice: ụmụanyị abụọ a
  rationale: Okwu Grik ahụ bụ nke ụdị nwanyị ma na-ezo kpọmkwem n’ebe ụmụanyị abụọ ahụ nọ.
- source_word: διαθῆκαι
  choice: ọgbụgba ndụ abụọ
  rationale: Ọgbụgba ndụ bụ okwu Baịbụl kwesịrị ekwesị n’ọnọdụ a, karịsịa n’ihi ntụaka e nyere Saịnaị.
- source_word: ἀπὸ ὄρους Σινᾶ
  choice: sitere n’Ugwu Saịnaị
  rationale: Nke a na-egosi isi mmalite nke otu ọgbụgba ndụ ahụ n’ụzọ Igbo dị mma.
- source_word: εἰς δουλείαν
  choice: ka ha bụrụ ndị ohu
  rationale: Ọ na-egosipụta nsonaazụ ma ọ bụ ọnọdụ ụmụ a mụrụ na-abanye na ya, ma na-edobe ike nke okwu banyere ịbụ ohu.
- source_word: γεννῶσα
  choice: na-amụ ụmụ
  rationale: Ọ na-edobe ihe oyiyi nke nwanyị na-amụ ụmụ nke dị mkpa n’ihe atụ Pọl ji mee ihe.
- source_word: ἥτις ἐστὶν Ἁγάρ
  choice: ọ bụ Hega
  rationale: Ọ na-edobe njirimara Pọl nyere n’etiti ọgbụgba ndụ ahụ na Hega n’enweghị ịgbakwunye nkọwa ọzọ.
theological_decisions:
- issue: Ụdị ojiji Pọl ji akụkọ Sera na Hega mee ihe
  choice: A na-akọwa akụkọ ahụ n'ụzọ ihe atụ
  alternative: Ihe ndị a bụ naanị akụkọ ihe atụ, ọ bụghị ihe mere eme
  rationale: Ụdị ngwaa Grik ahụ na-egosi usoro nkọwa ma ọ bụ ojiji ihe atụ; nsụgharị ahụ anaghị ekpebi ma ọ bụ gọnarị na ndị ahụ bụ ndị mere eme.
- issue: Nkọwa nke δουλεία
  choice: ịbụ ndị ohu
  alternative: ịbụ ndị nọ n’okpuru ikike
  rationale: Ọnọdụ ịbụ ohu bụ isi n’ọdịiche Pọl na-egosi n’etiti ọgbụgba ndụ abụọ ahụ; okwu a na-edobe ike nke Grik.
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. “Ọgbụgba ndụ” na “ndị ohu” na-edobe okwu Baịbụl na ike echiche nke isi mmalite ahụ; akara nkọwa ala ala [a] na [b] dị n’ederede bụ isi.
