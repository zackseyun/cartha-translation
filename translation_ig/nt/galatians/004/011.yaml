  yaml_path: translation/nt/galatians/004/011.yaml
  text: I fear for you[a], that somehow I have labored over you in vain.
translation:
  language: ig
  text: Ana m atụ ụjọ n’ihi unu[a], ka o nwee ike ịbụ na m dọgburu onwe m n’ọrụ n’efu maka unu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Ana m atụ egwu maka unu, ka o nwee ike ịbụ na m dọgburu onwe m n’ọrụ n’efu n’etiti unu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: φοβοῦμαι
  choice: Ana m atụ ụjọ
  rationale: Okwu dị n’oge ugbu a na-egosi nchegbu Pọl ka nwere ugbu a; Igbo a bụ ụzọ ebumpụta ụwa na nke doro anya isi kwuo ya.
- source_word: ὑμᾶς
  choice: n’ihi unu
  rationale: Accusative a bụ ndị nchegbu ahụ metụtara, ọ bụghị na Pọl na-atụ ha egwu; “n’ihi unu” na-egosi nchegbu maka ọnọdụ ha.
- source_word: μή πως
  choice: ka ọ ghara ịbụ na
  rationale: Nke a na-ebute ihe Pọl na-atụ ụjọ na o nwere ike ịbụ eziokwu, ma na-ahapụ ejighị n’aka dị n’asụsụ Grik.
- source_word: εἰκῇ
  choice: bụ n’efu
  rationale: Ọ na-egosi ọrụ na-enweghị mkpụrụ ma ọ bụ nsonaazụ; “n’efu” bụ okwu Igbo nkịtị ma doo anya.
- source_word: κεκοπίακα
  choice: ndọgbu niile m dọgburu onwe m n’ọrụ
  rationale: Perfect active indicative na-elekwasị anya n’ọrụ siri ike Pọl rụwororị nke ka dị mkpa ugbu a; “dọgburu onwe m n’ọrụ” na-echekwa echiche nke ịrụsi ọrụ ike.
- source_word: εἰς ὑμᾶς
  choice: n’etiti unu
  rationale: Preposition ahụ na-egosi ọrụ e tinyere n’ebe ndị Galetia nọ; “n’etiti unu” bụ Igbo dị mfe ma na-egosi ebe na ndị ọrụ ozi ya metụtara, na-enweghị ime ka Pọl dị ka onye na-achị ha.
theological_decisions:
- issue: Ụdị nchegbu Pọl
  choice: Nchegbu onye ọzụzụ atụrụ na ọrụ ozi ya n’etiti ndị Galetia nwere ike ịbụ nke na-amịghị mkpụrụ.
  alternative: Nanị ụjọ onwe onye nke na-ekwusighị ike na ọrụ ozi ya nwere ike ghara ịmị mkpụrụ.
  rationale: Njikọ φοβοῦμαι ... μή πως ... εἰκῇ κεκοπίακα na-egosi nchegbu kpọmkwem na ndọgbu ọrụ ya nwere ike bụrụ nke na-enweghị nsonaazụ; ntụgharị ahụ anaghị ekpebi karịa ihe amaokwu ahụ kwuru.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji “Ana m atụ ụjọ n’ihi unu” gbochie nghọtahie na Pọl na-atụ ndị Galetia n’onwe ha egwu; ihe odide ala ala na-echekwa ụzọ ọzọ dị mma isi gosipụta φοβοῦμαι ὑμᾶς na εἰς ὑμᾶς.
