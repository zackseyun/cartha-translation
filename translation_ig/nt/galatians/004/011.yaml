    text: Ma ọ bụ, “Ana m atụ egwu maka unu, ka o nwee ike ịbụ na m dọgburu onwe m n’ọrụ n’efu n’etiti unu.”
    reason: lexical_alternative
  revision_rationale: The revision removes the unsupported “niile,” keeps the perfect labor as work already undertaken, and makes the uncertainty carried by μή πως clear with “ka o nwee ike ịbụ na.” It also renders εἰς ὑμᾶς in the main line as labor directed “maka unu,” while preserving the viable contextual alternative “n’etiti unu” in the anchored footnote.
