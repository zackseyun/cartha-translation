source:
  edition: SBLGNT
  text: μετανόησον οὖν ἀπὸ τῆς κακίας σου ταύτης, καὶ δεήθητι τοῦ ⸀κυρίου εἰ ἄρα ἀφεθήσεταί σοι ἡ ἐπίνοια τῆς καρδίας σου·
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/022.yaml
  text: Therefore repent of this wickedness of yours[a], and pray to the Lord, if perhaps the intent of your heart may be forgiven you.
translation:
  language: ig
  text: Ya mere, si n’ajọ omume gị a chegharịa, kpeekwa Onyenwe anyị ekpere, ma eleghị anya, a ga-agbaghara gị maka ebumnobi dị n’obi gị[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “echiche dị n’obi gị.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μετανόησον
  choice: chegharịa
  rationale: Ọ bụ iwu na-akpọ mmadụ ka o mee mgbanwe doro anya n’uche na n’omume ya; “chegharịa” bụ okwu Igbo a na-eji eme ihe n’ụzọ ebumpụta ụwa maka nchegharị.
- source_word: οὖν
  choice: Ya mere
  rationale: Ọ na-egosi na iwu a bụ ihe si n’ịba mba Pita kwuru tupu ya pụta.
- source_word: ἀπὸ τῆς κακίας σου ταύτης
  choice: si n’ajọ omume gị a
  rationale: “Ajọ omume” na-egosi ihe ọjọọ n’omume na n’ọnọdụ omume mmadụ, ebe “si … chegharịa” na-echekwa echiche nke isi n’ihe ahụ pụọ.
- source_word: δεήθητι
  choice: rịọkwa
  rationale: Ọ na-egosi ịrịọ arịrịọ n’aka Chineke; n’ọnọdụ a, “rịọ” bụ okwu Igbo dị mfe ma dabara n’ekpere.
- source_word: τοῦ κυρίου
  choice: Onyenwe anyị
  rationale: Nke a bụ ụzọ Igbo a na-ejikarị asụ κύριος n’akwụkwọ nsọ, na-enweghị ịkọwa kpọmkwem onye a na-ekwu maka ya karịa ihe okwu Grik kwuru.
- source_word: εἰ ἄρα
  choice: ma eleghị anya
  rationale: Ọ na-echekwa obi abụọ na ohere dị n’okwu Pita, na-emeghị mgbaghara ahụ ka ọ bụrụ ihe e kwere ná nkwa n’enweghị ọnọdụ.
- source_word: ἀφεθήσεταί σοι
  choice: a ga-agbaghara gị
  rationale: Ụdị a na-echekwa olu nnara nke Grik ma na-ahapụ onye na-agbaghara n’amaghị aha, dị ka isi mmalite ahụ mere.
- source_word: ἡ ἐπίνοια
  choice: ebumnobi
  rationale: N’ebe a okwu ahụ abụghị naanị echiche gafere n’uche, kama ọ bụ nzube ma ọ bụ ihe mmadụ bu n’obi ime.
- source_word: τῆς καρδίας σου
  choice: obi gị
  rationale: Ọ na-agbaso njikọ nke Grik ma na-echekwa echiche Akwụkwọ Nsọ banyere obi dịka ebe ebumnobi mmadụ si apụta.
theological_decisions:
- issue: Ogo ntụkwasị obi banyere mgbaghara
  choice: 'E kwuru ya dịka ihe nwere ike ime: “ma eleghị anya, a ga-agbaghara gị.”'
  alternative: Ịsụ ya dịka nkwa doro anya na a ghaghị ịgbaghara ya ma ọ chegharịa.
  rationale: εἰ ἄρα na-ahapụ okwu Pita n’ọnọdụ olileanya nwere nchekwube, ma ọ naghị ekwe nkwa nsonaazụ ahụ ma ọ bụ kwuo na mgbaghara agaghị ekwe omume.
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji “si … chegharịa” chekwaa echiche isi n’ajọ omume pụọ, ebe “ma eleghị anya” na-echekwa ọnọdụ na-edoghị anya nke okwu Grik.
