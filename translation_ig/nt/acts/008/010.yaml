- from: Ha niile, malite n'onye nta ruo n'onye ukwu, na-ege ya ntị, na-asị, “Nwoke a bụ ike Chineke nke a na-akpọ Ike Ukwu.”[a]
  to: Ha niile, site n’onye nta ruo n’onye ukwu, na-ege ya ntị, na-asị, “Nwoke a bụ ike Chineke a na-akpọ Ukwu.”[a]
  rationale: The revision keeps the ongoing sense of paying attention and speaking, preserves the quoted—and not narrator-affirmed—claim about Simon, and more closely reflects the Greek relation between “the power of God” and “called Great.” The alternative footnote retains the compact title-like rendering.
