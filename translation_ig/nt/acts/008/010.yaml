source:
  edition: SBLGNT
  text: ᾧ προσεῖχον ⸀πάντες ἀπὸ μικροῦ ἕως μεγάλου λέγοντες· Οὗτός ἐστιν ἡ Δύναμις τοῦ θεοῦ ἡ ⸀καλουμένη Μεγάλη.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/010.yaml
  text: They all paid attention to him[a], from the least to the greatest, saying, “This man is the power of God that is called Great.”
translation:
  language: ig
  text: Ha niile, site n’onye nta ruo n’onye ukwu, na-ege ya ntị, na-asị, “Nwoke a bụ ike Chineke a na-akpọ Ukwu.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Onye a bụ ihe a na-akpọ Ike Ukwu nke Chineke.” Okwu Grik ahụ nwekwara ike ịpụta dịka utu aha e kwuru n'ụzọ dị nkenke.
    reason: alternative_reading
lexical_decisions:
- source_word: ᾧ προσεῖχον
  choice: na-ege ya ntị
  rationale: Nke a bụ okwu Igbo e ji egosi ilekwasị mmadụ anya na ịṅa ihe ọ na-ekwu ntị, n'etinyeghị echiche siri ike karịa nke dị na προσέχω.
- source_word: πάντες
  choice: Ha niile
  rationale: Ọ na-egosi n'ụzọ doro anya na mmadụ niile nọ n'òtù ahụ so mee ya.
- source_word: ἀπὸ μικροῦ ἕως μεγάλου
  choice: malite n'onye nta ruo n'onye ukwu
  rationale: Nke a na-echekwa ụzọ okwu Grik si gụnye mmadụ niile, n'agbanyeghị ọkwa ha.
- source_word: λέγοντες
  choice: na-asị
  rationale: Ọ na-egosi na okwu ha na omume ige ya ntị na-aga n'otu oge.
- source_word: Οὗτός
  choice: Nwoke a
  rationale: Ihe nnọchiaha ngosi ahụ na-arụtụ aka n'ebe Saịmọn nọ; ‘Nwoke a’ bụ okwu Igbo doro anya ma dị ndụ.
- source_word: ἡ Δύναμις τοῦ θεοῦ
  choice: ike Chineke
  rationale: Ọ na-echekwa echiche bụ isi nke okwu Grik ma na-ada ka Igbo nkịtị; n'ime nkwupụta ahụ, ọ na-arụ ọrụ dịka aha e nyere Saịmọn.
- source_word: ἡ καλουμένη Μεγάλη
  choice: nke a na-akpọ Ike Ukwu
  rationale: E tinyere ‘Ike’ ọzọ iji mee ka o doo anya na ‘Ukwu’ na-akọwa ike ahụ, ma chekwaa ọdịdị aha ma ọ bụ utu aha nke okwu Grik.
- source_word: Μεγάλη
  choice: Ukwu
  rationale: ‘Ukwu’ na-enye nkọwa nwanyị Μεγάλη n'ebe Δύναμις nọ ma na-echekwa ya dịka akụkụ nke utu aha ahụ.
theological_decisions:
- issue: Ma okwu ìgwè mmadụ ahụ bụ utu aha Chineke kwadoro, ka ọ bụ nanị nkwupụta ha banyere Saịmọn
  choice: 'E dere ya dịka okwu ndị mmadụ kwuru: “Nwoke a bụ ike Chineke nke a na-akpọ Ike Ukwu.”'
  alternative: “Onye a bụ ihe a na-akpọ Ike Ukwu nke Chineke.”
  rationale: Akụkọ ahụ na-akọ nkwupụta ndị mmadụ banyere Saịmọn; ọ naghị ekwu na onye na-akọ akụkọ kwadoro ya. Nsụgharị ahụ na-echekwa esemokwu a n'enweghị ịnabata ma ọ bụ ịgọnahụ nkwupụta ha.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. Akara [a] dị n'isiokwu ma kwekọọ na nkọwa ala peeji.
