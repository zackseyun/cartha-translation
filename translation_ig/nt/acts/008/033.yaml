revisions:
- from: Mgbe e wedara ya ala, e napụrụ ya ikpe ziri ezi[b]. Ònye ga-akọ banyere ọgbọ ya[a]? N’ihi na a na-ewepụ ndụ ya n’ụwa.
  to: N’ime mmechuihu ya, e napụrụ ya ikpe ziri ezi[b]. Ònye ga-akọ banyere ọgbọ ya[a]? N’ihi na a na-ewepụ ndụ ya n’elu ụwa.
  rationale: The revision makes the opening wording more directly correspond to ‘in his humiliation,’ clarifies that life is taken ‘from the earth,’ and corrects the lexical-alternative footnote so that it retains the Greek reference to the person affected. It continues to preserve the disputed ambiguity of ‘his generation’ without interpretive expansion.
