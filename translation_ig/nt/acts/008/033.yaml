source:
  edition: SBLGNT
  text: ἐν τῇ ⸀ταπεινώσει ἡ κρίσις αὐτοῦ ἤρθη· ⸀τὴν γενεὰν αὐτοῦ τίς διηγήσεται; ὅτι αἴρεται ἀπὸ τῆς γῆς ἡ ζωὴ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/033.yaml
  text: In his humiliation justice was taken away from him[b][a]. Who will recount his generation? For his life is taken from the earth.
translation:
  language: ig
  text: N’ime mmechuihu ya, e napụrụ ya ikpe ziri ezi[b]. Ònye ga-akọ banyere ọgbọ ya[a]? N’ihi na a na-ewepụ ndụ ya n’elu ụwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ụmụ ụmụ ya,” ma ọ bụ, “ndị ya na ha dịkọrọ ndụ.” Okwu Grik a sụgharịrị “ọgbọ” na-edobe mgbagwoju anya dị n’okwu e hotara n’Aịzaya 53.
    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ, “e napụrụ ya ikpe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ταπεινώσει
  choice: mgbe e wedara ya ala
  rationale: Nke a na-egosi ọnọdụ mweda n’ala na mmechuihu onye ahụ nọ na ya, ma na-ada nke ọma n’Igbo nke oge a.
- source_word: κρίσις
  choice: ikpe ziri ezi
  rationale: N’ebe a, okwu ahụ nwere akụkụ iwu ma na-egosi na a napụrụ ya ikpe nkwụmọtọ; ‘ikpe ziri ezi’ na-edobe echiche nke ikpe na nke ezi omume ọnụ.
- source_word: ἤρθη
  choice: e napụrụ ya
  rationale: Ụdị a na-egosi na e wepụrụ ihe ruuru ya, ya bụ, na ọ tụfuru ikpe ziri ezi.
- source_word: γενεὰν
  choice: ọgbọ
  rationale: ‘Ọgbọ’ na-edobe obosara na mgbagwoju anya nke γενεά, nke nwere ike izo aka n’ụmụ ụmụ ya ma ọ bụ ndị ya na ha dịkọrọ ndụ.
- source_word: διηγήσεται
  choice: ga-akọ banyere
  rationale: Nke a na-egosi ịkọ ma ọ bụ ịkọwa ihe gbasara mmadụ n’ụzọ dabara n’ajụjụ nkwupụta ahụ.
- source_word: αἴρεται
  choice: a na-ewepụ
  rationale: Ụdị a na-edobe ihe ngosi ugbu a nke ngwaa Grik ma na-enye ahịrịokwu ahụ ike nke ihe a na-eme.
- source_word: γῆς
  choice: ụwa
  rationale: ‘Ụwa’ dabara n’okwu a banyere iwepụ ndụ mmadụ n’ebe ndị dị ndụ nọ.
- source_word: ζωὴ
  choice: ndụ
  rationale: Nke a bụ ntụgharị kwụ ọtọ, ma n’ebe a ọ na-ezo aka ná ndụ anụ ahụ nke onye ahụ.
theological_decisions:
- issue: Ihe ‘ọgbọ ya’ pụtara
  choice: E debere ‘ọgbọ ya’ n’ahịrịokwu bụ isi.
  alternative: ‘ụmụ ụmụ ya’ ma ọ bụ ‘ndị ya na ha dịkọrọ ndụ’
  rationale: Okwu ahụ e hotara n’Aịzaya 53 siri ike ịkọwa n’otu ụzọ naanị. Idebe ‘ọgbọ’ anaghị ekpebi ma ọ bụ ụmụ ụmụ ya ka a na-ekwu, ma ọ bụ ndị ya na ha dịkọrọ ndụ.
- issue: Ihe κρίσις pụtara
  choice: ikpe ziri ezi
  alternative: ikpe
  rationale: N’ọnọdụ a, okwu ahụ nwere ike igosi na a napụrụ ya ikpe nkwụmọtọ, ọ bụghị nanị na e wepụrụ otu mkpebi ikpe. Ihe ọzọ nwere ike ịbụ ‘ikpe,’ ya mere e tinyere ya n’ala peeji.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. A họọrọ ahịrịokwu ndị na-ada nke ọma n’ọnụ ndị Igbo, ebe e debere mgbagwoju anya dị n’ederede Grik site n’okwu ‘ọgbọ’ na nkọwa ala peeji.
