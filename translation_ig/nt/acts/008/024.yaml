  text: ἀποκριθεὶς δὲ ὁ Σίμων εἶπεν· Δεήθητε ὑμεῖς ὑπὲρ ἐμοῦ πρὸς τὸν κύριον ὅπως μηδὲν ἐπέλθῃ ἐπ’ ἐμὲ ὧν εἰρήκατε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/024.yaml
  text: But Simon answered[a], “You pray to the Lord for me, so that nothing of what you have said may come upon me.”
translation:
  language: ig
  text: Ma Saịmọn zara sị, “Unu kpeere m ekpere n’ebe Onyenwe anyị nọ, ka ihe ọ bụla n’ime ihe ndị unu kwuru ghara ịbịakwasị m.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ Σίμων εἶπεν
  choice: Ma Saịmọn zara sị
  rationale: Akụkụ okwu a na-ewebata nzaghachi Saịmọn n’ụzọ e ji asụ Igbo nke ọma; “Ma” na-egosi ntakịrị mgbanwe ma ọ bụ mmegide n’ihe a na-akọ.
- source_word: Δεήθητε
  choice: rịọrọ ... arịrịọ
  rationale: N’ebe a, ngwaa ahụ pụtara ịrịọ Chineke n’ekpere. Nhazi a doro ndị na-agụ Igbo anya ma gosipụta na Saịmọn na-arịọ Pita na Jọn ka ha rịọchitere ya arịrịọ.
- source_word: ὑμεῖς
  choice: Unu onwe unu
  rationale: Nnochiaha Grik ahụ pụtara ìhè ma nwee nkwusi ike; “unu onwe unu” na-echekwa na Saịmọn na-arịọ ha kpọmkwem ka ha mee ya.
- source_word: ὑπὲρ ἐμοῦ
  choice: n’ihi m
  rationale: N’ọnọdụ ekpere a, okwu ahụ na-egosi ịrịọchitere onye ọzọ arịrịọ; “n’ihi m” bụ okwu Igbo dị mfe ma kwekọọ n’echiche ahụ.
- source_word: πρὸς τὸν κύριον
  choice: Onyenwe anyị
  rationale: N’asụsụ Igbo, “rịọrọ Onyenwe anyị arịrịọ” na-egosi onye a na-ekpegara ekpere n’enweghị mkpa itinye okwu ntụziaka ọzọ; aha ahụ echekwaghị onye κύριος na-ezo aka na ya karịa ka Grik mere.
- source_word: ὅπως μηδὲν
  choice: ka ihe ọ bụla ... ghara
  rationale: Nhazi “ka ... ghara” na-enye nzube ma ọ bụ ihe a chọrọ n’ekpere, ebe “ihe ọ bụla” na nkw否 ahụ na-enye echiche μηδέν n’Igbo eke.
- source_word: ἐπέλθῃ ἐπ’ ἐμὲ
  choice: ịbịakwasị m
  rationale: “Ịbịakwasị” na-echekwa onyonyo nke ihe ọjọọ ma ọ bụ ikpe na-abịakwasị mmadụ, kama ime ka ọ bụrụ naanị ihe na-eme mmadụ.
- source_word: ὧν εἰρήκατε
  choice: n’ime ihe ndị unu kwuru
  rationale: Nke a na-egosipụta njikọ genitive ahụ dị ka otu ihe n’ime ihe ndị ha kwuru, ma na-edebe okwu ahụ n’Igbo doro anya.
theological_decisions:
- issue: Onye “τὸν κύριον” na-ezo aka na ya
  choice: Onyenwe anyị
  alternative: Chineke; Onyenwe anyị Jizọs
  rationale: Grik kwuru naanị “Onyenwe ahụ” ma ekpebighị kpọmkwem ma ọ bụ Chineke Nna ka ọ bụ Jizọs. Nsụgharị ahụ na-edebe otu ọkwa nke enweghị nkọwa zuru ezu.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “Unu onwe unu” na-edebe nkwusi ike dị na ὑμεῖς, ebe “ịbịakwasị m” na-echekwa ụda dị arọ nke ịdọ aka ná ntị ma ọ bụ ikpe.
