id: ACT.8.26
reference: Acts 8:26
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἄγγελος δὲ κυρίου ἐλάλησεν πρὸς Φίλιππον λέγων· Ἀνάστηθι καὶ πορεύου κατὰ μεσημβρίαν ἐπὶ τὴν ὁδὸν τὴν καταβαίνουσαν ἀπὸ Ἰερουσαλὴμ εἰς Γάζαν· αὕτη ἐστὶν ἔρημος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/026.yaml
  text: An angel of the Lord spoke to Philip[a], saying[b], “Get up and go south to the road that goes down from Jerusalem to Gaza.” This is a deserted road.
translation:
  language: ig
  text: Ma otu mmụọ ozi nke Onyenwe anyị gwara Filip okwu, sị, “Bilie, gawa n’ebe ndịda[a], ruo n’ụzọ ahụ si Jerusalem agbada Gaza.” Ụzọ a tọgbọrọ n’efu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’etiti ehihie.” Nkebiokwu Grik a nwere ike igosi ma ntụziaka (“n’ebe ndịda”) ma oge (“n’etiti ehihie”).
    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ, “Ebe a bụ ọzara.” Nke a nwere ike ịpụta na ụzọ ahụ na-agafe n’ala ọzara, kama ịkwusi ike na ọ bụ ụzọ tọgbọrọ n’efu.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄγγελος δὲ κυρίου
  choice: Ma otu mmụọ ozi nke Onyenwe anyị
  rationale: “Otu mmụọ ozi” na-egosi otu onye n’ime ndị mmụọ ozi n’ihi na aha Grik ahụ enweghị άρθρον; “nke Onyenwe anyị” na-edobe njikọ ya na Chineke n’enweghị ịkọwa onye ozi ahụ karịa ihe ederede kwuru. “Ma” na-eburu njikọ dị nro nke δέ.
- source_word: ἐλάλησεν πρὸς Φίλιππον λέγων
  choice: gwara Filip okwu, sị
  rationale: Nke a na-egosipụta ma omume ikwu okwu ma λέγων nke na-ewebata okwu kpọmkwem, n’Igbo dị ugbu a ma dị mfe nghọta.
- source_word: Ἀνάστηθι καὶ πορεύου
  choice: Bilie, gawa
  rationale: Iwu abụọ a na-akpọ Filip ka o mee ihe ozugbo; “Bilie, gawa” bụ ụzọ Igbo e si ekwu ya n’ụzọ ekeghị aka ma doo anya.
- source_word: κατὰ μεσημβρίαν
  choice: n’ebe ndịda
  rationale: N’usoro okwu banyere ịga n’ụzọ, nghọta nke ntụziaka, “n’ebe ndịda,” yikarịrị ka ọ bụ ya; ma n’ihi na okwu Grik ahụ nwekwara ike ịpụta oge ehihie, e debere nke ahụ n’ala ala peeji.
- source_word: ἐπὶ τὴν ὁδὸν
  choice: ruo n’ụzọ ahụ
  rationale: “Ruo n’ụzọ ahụ” na-egosi mmegharị gaa n’ebe ụzọ ahụ dị n’Igbo doro anya, kama ime ka ọ dị ka a sị na Filip adịlarị n’ụzọ ahụ.
- source_word: τὴν καταβαίνουσαν ἀπὸ Ἰερουσαλὴμ εἰς Γάζαν
  choice: si Jerusalem agbada Gaza
  rationale: “Agbada” na-edobe echiche ala nke isi Jerusalem gbadata ebe Gaza dị, ma bụrụkwa okwu njem Igbo na-ada nke ọma.
- source_word: αὕτη ἐστὶν ἔρημος
  choice: Ụzọ a tọgbọrọ n’efu
  rationale: Ụdị nwanyị nke αὕτη na ἔρημος nwere ike ịlaghachi n’azụ n’aha nwanyị ὁδός, ya mere e mere “ụzọ” ka ọ pụta ìhè. “Tọgbọrọ n’efu” na-egosi ebe mmadụ na-adịghị ebi ma ọ bụ ụzọ mmadụ na-anaghị agakarị, n’enweghị ikwubiga ihe ókè.
theological_decisions:
- issue: Onye “Onyenwe anyị” na onye mmụọ ozi ahụ bụ kpọmkwem
  choice: E sụgharịrị ya dịka “otu mmụọ ozi nke Onyenwe anyị,” nke na-egosi onye ozi sitere n’aka Chineke n’enweghị nkọwa ọzọ.
  alternative: “Mmụọ ozi ahụ nke Onyenwe anyị,” nke nwere ike ime ka ọ dị ka ọ bụ otu onye pụrụ iche amaara ama.
  rationale: Ederede ahụ na-ekwu naanị na onye ozi ahụ bụ nke Onyenwe anyị; ọ naghị amanye ka a kọwaa ya dịka ngosipụta pụrụ iche nke Chineke ma ọ bụ tinye ozizi ọzọ n’ime ya.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta, dee ya. A na-eji “Onyenwe anyị” maka κύριος n’ọnọdụ a. E tinyere akara ala ala peeji [a] na [b] kpọmkwem n’ebe okwu ndị nwere nghọta ọzọ dị, ka e wee chekwaa mgbagwoju anya dị n’asụsụ Grik.
