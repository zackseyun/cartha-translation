id: ACT.8.9
reference: Acts 8:9
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἀνὴρ δέ τις ὀνόματι Σίμων προϋπῆρχεν ἐν τῇ πόλει μαγεύων καὶ ⸀ἐξιστάνων τὸ ἔθνος τῆς Σαμαρείας, λέγων εἶναί τινα ἑαυτὸν μέγαν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/009.yaml
  text: A certain man named Simon had previously been in the city practicing magic and astonishing the people of Samaria[a], saying that he himself was someone great[b],
translation:
  language: ig
  text: Ma otu nwoke aha ya bụ Saịmọn nọbu n’obodo ahụ, na-eme anwansi ma na-eme ka ndị Sameria ju anya[a], na-ekwu na ya onwe ya bụ onye dị ukwuu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “na-eme mgbaasị.” Okwu Grik ahụ pụtara itinye aka n’omume anwansi.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, “na ọ bụ nnukwu mmadụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀνὴρ δέ τις
  choice: Ma otu nwoke
  rationale: “Otu nwoke” na-egosipụta nwoke na indefiniteness nke τις; “Ma” na-eburu njikọ dị nro nke δέ n’enweghị itinye echiche oge na-adịghị na Grik.
- source_word: ὀνόματι Σίμων
  choice: aha ya bụ Saịmọn
  rationale: Nke a bụ ụzọ Igbo dị mfe ma bụrụkwa nke e ji eme ihe maka ịkpọ aha mmadụ; a sụgharịghị aha ahụ kama e dere ya dịka ụda ya si dị.
- source_word: προϋπῆρχεν ἐν τῇ πόλει
  choice: nọbu n’obodo ahụ
  rationale: “Nọbu” na-egosipụta na ọ nọworị ebe ahụ tupu ihe ndị a kọrọ ugbu a; “obodo ahụ” na-ezo aka n’obodo e kwuru okwu ya n’akụkụ amaokwu a.
- source_word: μαγεύων
  choice: na-eme anwansi
  rationale: Ọ na-egosi itinye aka n’omume ime anwansi n’asụsụ Igbo nke ndị mmadụ na-aghọta, n’etinyeghị nkọwa banyere isi ike ahụ si bịa.
- source_word: ἐξιστάνων
  choice: na-eme ka ... ju anya
  rationale: Nkebi okwu a na-egosipụta mmetụta causative nke ime ka ndị mmadụ maa jijiji n’anya ma ọ bụ ju anya, ma na-edokwa participle na-aga n’ihu.
- source_word: τὸ ἔθνος τῆς Σαμαρείας
  choice: ndị Sameria
  rationale: N’ebe a ἔθνος na-ezo aka n’ìgwè ndị Sameria, ọ bụghị n’usoro ọchịchị nke mba; okwu a dịkwa nkenke ma bụrụ nke e ji eme ihe n’Igbo.
- source_word: λέγων
  choice: Ọ na-ekwu
  rationale: Ọ na-ebute ihe Saịmọn kwuru banyere onwe ya n’enweghị ịgbakwunye ikpe na ọ bụ nkwupụta ụgha.
- source_word: εἶναί τινα ἑαυτὸν μέγαν
  choice: na ya onwe ya bụ onye dị ukwuu
  rationale: “Ya onwe ya” na-echekwa nkwusi ike nke ἑαυτόν, ebe “onye dị ukwuu” na-egosipụta τινα ... μέγαν n’enweghị ikpebi kpọmkwem ụdị ịdị ukwuu ahụ.
theological_decisions:
- issue: Ụdị omume Saịmọn
  choice: na-eme anwansi
  alternative: na-eme mgbaasị
  rationale: Amaokwu ahụ kwuru na ọ na-eme ọrụ anwansi, ma ọ kọwaghị kpọmkwem ebe ike ahụ si bịa ma ọ bụ kpọọ ya aghụghọ. Nsụgharị ahụ anaghị etinye nkọwa okpukpe karịrị ihe ederede kwuru.
- issue: Nkwupụta Saịmọn banyere onwe ya
  choice: na ya onwe ya bụ onye dị ukwuu
  alternative: na ọ bụ nnukwu mmadụ
  rationale: Nhọrọ a na-echekwa nkwusi ike nke “onwe ya” na mgbagwoju anya nke μέγαν—ọ pụrụ ịpụta onye dị mkpa ma ọ bụ onye nwere ịdị ukwuu—n’enweghị ịkọwa ihe Saịmọn bu n’obi karịa ederede.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe nghọta ma nwee ugwu, mee ihe. E kewara ogologo ahịrịokwu Grik ahụ ụzọ abụọ ka ọ bụrụ Igbo eke, ma njikọ echiche ya ka dị. Akara nkọwa ala ala [a] na [b] pụtara n’ebe okwu ha na-akọwa dị na isi ederede.
