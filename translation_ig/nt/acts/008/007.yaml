source:
  edition: SBLGNT
  text: ⸀πολλοὶ γὰρ τῶν ἐχόντων πνεύματα ἀκάθαρτα βοῶντα φωνῇ μεγάλῃ ⸀ἐξήρχοντο, πολλοὶ δὲ παραλελυμένοι καὶ χωλοὶ ἐθεραπεύθησαν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/007.yaml
  text: For many who had unclean spirits[a], they came out crying with a loud voice; and many who were paralyzed and lame were healed.
translation:
  language: ig
  text: N’ihi na ọtụtụ ndị mmụọ na-adịghị ọcha ji, mmụọ ndị ahụ si n’ime ha pụta, na-eti mkpu n’olu dara ụda; a gwọkwara ọtụtụ ndị mkpọnwụ na ndị ngwọrọ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πολλοὶ γὰρ τῶν ἐχόντων
  choice: N’ihi na ... ọtụtụ ndị ha ji
  rationale: “N’ihi na” na-echekwa njikọ nkọwa nke γάρ na amaokwu bu ụzọ. A haziri genitive construction ahụ n’ụzọ Igbo sitere n’okike, ka o doo anya na ndị mmadụ bụ ndị mmụọ ahụ ji.
- source_word: πνεύματα ἀκάθαρτα
  choice: mmụọ na-adịghị ọcha
  rationale: Nke a bụ ntụgharị doro anya ma bụrụ nke a na-aghọta nke ọma maka mmụọ ọjọọ n’akụkọ Luk na Ọrụ Ndịozi, ma ọ naghị agbakwunye nkọwa na-adịghị na okwu Grik.
- source_word: βοῶντα φωνῇ μεγάλῃ
  choice: na-eti mkpu n’olu dara ụda
  rationale: Ọ na-echekwa omume nke iti mkpu na ike olu ahụ, ma na-ejikọta ya n’ụzọ doro anya na mmụọ na-adịghị ọcha.
- source_word: ἐξήρχοντο
  choice: si n’ime ... pụta
  rationale: N’ọnọdụ ịchụ mmụọ, Igbo chọrọ ka ebe ha si pụta doo anya; usoro a na-egosi na mmụọ ahụ si n’ime ndị ha ji pụta, ma na-echekwa imperfect ahụ site n’usoro omume na-aga n’ihu.
- source_word: παραλελυμένοι
  choice: ndị ahụ ha kpọnwụrụ akpọnwụ
  rationale: Nke a na-egosi ọnọdụ anụ ahụ na-adịgide adịgide nke perfect passive participle ahụ, n’asụsụ ndị mmadụ na-aghọta.
- source_word: χωλοὶ
  choice: ndị ngwọrọ
  rationale: “Ndị ngwọrọ” bụ okwu Igbo a na-ahụkarị maka ndị na-enweghị ike ịga ije nke ọma.
- source_word: ἐθεραπεύθησαν
  choice: a gwọkwara
  rationale: Passive Igbo a na-echekwa na e mere ha ọgwụgwọ n’enweghị ịkpọ onye mere ya aha n’ahịrịokwu a.
theological_decisions:
- issue: Onye na-eti mkpu ma na-apụta
  choice: Mmụọ na-adịghị ọcha bụ ndị na-eti mkpu ma na-esi n’ime ndị ahụ apụta.
  alternative: Ndị mmụọ ahụ ji bụ ndị na-eti mkpu mgbe mmụọ na-apụta.
  rationale: Neuter plural participle βοῶντα kwekọrọ kpọmkwem na πνεύματα ἀκάθαρτα; ya mere, n’usoro Grik, mmụọ ndị ahụ ka a kọwara dị ka ndị na-eti mkpu. A haziri Igbo ka njikọ a doo anya.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E jiri “ha ji” mee ka echiche nke ịnwe mmụọ pụta n’ụzọ Igbo sitere n’okike, ma zere itinye okwu okpukpe nke otu ụka.
