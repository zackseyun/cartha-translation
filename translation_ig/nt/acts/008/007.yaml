review_pass:
  verdict: revise
  source_fidelity: The draft correctly identifies the unclean spirits as the entities crying out and coming out, preserves the explanatory force of γάρ, and retains both groups healed. However, its first clause is syntactically strained, and the wording for the paralyzed is malformed.
  naturalness: “Mmụọ na-adịghị ọcha si n’ime ọtụtụ ndị ha ji pụta” is understandable but has awkward placement and an unclear relationship between “ọtụtụ ndị” and “ha ji.” “Ndị ahụ ha kpọnwụrụ akpọnwụ” is not natural Standard Igbo. Recasting the sentence makes the antecedents and coordination clear while retaining a formal biblical register.
  terminology: “Mmụọ na-adịghị ọcha,” “na-eti mkpu n’olu dara ụda,” “ndị ngwọrọ,” and passive “a gwọrọ” are suitable Standard Igbo renderings. “Ndị mkpọnwụ” is a natural designation for those who were paralyzed.
  issues:
  - severity: medium
    issue: The first clause has awkward and potentially unclear word order.
    rationale: The draft places “ọtụtụ ndị ha ji” inside the source phrase for the spirits’ departure, making the reference and flow less natural in Igbo. Explicitly introducing the affected people and then referring to the spirits makes the source relationship clear.
  - severity: medium
    issue: “ndị ahụ ha kpọnwụrụ akpọnwụ” is grammatically and idiomatically defective.
    rationale: The doubled construction is not natural Standard Igbo. “Ndị mkpọnwụ” accurately conveys the resulting condition expressed by παραλελυμένοι.
  revised_text: N’ihi na ọtụtụ ndị mmụọ na-adịghị ọcha ji, mmụọ ndị ahụ si n’ime ha pụta, na-eti mkpu n’olu dara ụda; a gwọkwara ọtụtụ ndị mkpọnwụ na ndị ngwọrọ.
  revised_footnotes: []
