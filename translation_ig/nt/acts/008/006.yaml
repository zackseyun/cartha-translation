  to: Ìgwè mmadụ ahụ ji otu obi[b] gee ihe Filip na-ekwu ntị nke ọma[a], ka ha na-anụ ma na-ahụ ihe ịrịba ama ndị ahụ ọ na-eme.
  rationale: 'A small revision adds “ndị ahụ” to mark the definite plural “the signs.” The remainder is retained: the Igbo naturally leaves implicit the content heard, which has already been identified as what Philip was saying, and does not alter the plural αὐτούς into a singular reference to Philip.'
