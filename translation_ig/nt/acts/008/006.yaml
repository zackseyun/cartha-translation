  text: προσεῖχον ⸀δὲ οἱ ὄχλοι τοῖς λεγομένοις ὑπὸ τοῦ Φιλίππου ὁμοθυμαδὸν ἐν τῷ ἀκούειν αὐτοὺς καὶ βλέπειν τὰ σημεῖα ἃ ἐποίει·
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/006.yaml
  text: And the crowds with one accord paid close attention to what was being said by Philip[b][a], as they heard him and saw the signs that he was doing.
translation:
  language: ig
  text: Ìgwè mmadụ ahụ ji otu obi[b] gee ihe Filip na-ekwu ntị nke ọma[a], ka ha na-anụ ma na-ahụ ihe ịrịba ama ndị ahụ ọ na-eme.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “lekwasị anya n’ihe” ma ọ bụ “gee ntị.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “n’otu olu” ma ọ bụ “n’otu echiche”; okwu Grik na-emesi nzaghachi jikọrọ ha ọnụ ike.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσεῖχον
  choice: gee ... ntị nke ọma
  rationale: Nkebi okwu Igbo a na-egosi na ha lekwasịrị anya n'ihe a na-ekwu ma nọgide na-ege ya ntị; ọ dabara n'omume na-aga n'ihu nke imperfect Grik.
- source_word: δὲ
  choice: ejighị okwu njikọ pụrụ iche mee ya
  rationale: δέ bụ njikọ dị nro n'akụkọ a. N'Igbo, ịga n'ihu n'ahịrịokwu ahụ na-enweghị ‘ma’ ma ọ bụ ‘ugbu a’ na-ada nke ọma ma ghara ime ka e nwee ọdịiche siri ike nke Grik na-ekwughị.
- source_word: οἱ ὄχλοι
  choice: Ìgwè mmadụ ahụ
  rationale: Nke a bụ ụzọ Igbo nkịtị si akọwa ọtụtụ ndị gbakọtara; ọ naghị eji okwu ochie ma ọ bụ nke na-agbagwoju anya.
- source_word: τοῖς λεγομένοις ὑπὸ τοῦ Φιλίππου
  choice: ihe Filip na-ekwu
  rationale: Ọ na-egosi ọdịnaya okwu ahụ na Filip bụ onye na-ekwu ya, ma na-asụ ya n'ụzọ Igbo dị ndụ karịa ntụgharị okwu n'okwu nke usoro passive Grik.
- source_word: ὁμοθυμαδὸν
  choice: ji otu obi
  rationale: Ọ na-egosi nzaghachi ha jikọrọ ọnụ na otu ebumnuche, ọ bụghị naanị na ha nọkọrọ n'otu ebe.
- source_word: ἐν τῷ ἀκούειν αὐτοὺς καὶ βλέπειν
  choice: ka ha na-anụ ma na-ahụ
  rationale: ἐν τῷ tinyere infinitive na-egosi ọnọdụ ma ọ bụ oge ihe ahụ na-eme. αὐτούς bụ isiokwu accusative nke infinitive, ya bụ ìgwè mmadụ ahụ; ya mere, e tinyeghị ‘ya’ dị ka ihe ha nụrụ.
- source_word: τὰ σημεῖα
  choice: ihe ịrịba ama
  rationale: Nke a na-echekwa echiche nke σημεῖα n'emeghị ka nkọwa ‘ọrụ ebube’ bụrụ akụkụ nke ederede n'onwe ya.
- source_word: ἃ ἐποίει
  choice: ndị ọ na-eme
  rationale: Ụdị na-aga n'ihu na-egosipụta imperfect ἐποίει karịa simple past.
theological_decisions:
- issue: Ma ‘ihe ịrịba ama’ kwesịrị ịbụ ‘ọrụ ebube’
  choice: ihe ịrịba ama
  alternative: ọrụ ebube
  rationale: σημεῖα na-akpọ ọrụ ndị ahụ ihe na-egosi ihe ọzọ ma ọ bụ na-agba akaebe. ‘Ọrụ ebube’ ga-eme ka otu akụkụ nke echiche ahụ pụta ìhè ma belata ihe okwu Grik pụtara.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. ‘Ji otu obi’ bụ okwu e ji eme ihe n’Igbo maka ịdị n’otu n’ebumnuche; ‘gee ... ntị nke ọma’ na-enye ike nke ngwaa ahụ n’enweghị asụsụ ochie. E debere akara nkọwa [b] n’akụkụ ‘ji otu obi’ na [a] n’akụkụ ‘ntị nke ọma’.
