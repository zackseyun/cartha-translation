  text: ⸂ἐγένετο δὲ⸃ ⸂πολλὴ χαρὰ⸃ ἐν τῇ πόλει ἐκείνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/008.yaml
  text: And there was great joy in that city.
translation:
  language: ig
  text: E nwere ọṅụ dị ukwuu n’obodo ahụ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγένετο
  choice: wee jupụta
  rationale: N’ebe a, ἐγένετο na-egosi na ọnọdụ ọṅụ ahụ malitere ịdị n’obodo ahụ. “Wee jupụta” bụ okwu Igbo dị mfe nke na-egosi ịdị ukwuu na mgbasawanye nke ọṅụ ahụ n’enweghị ịsụgharị ya n’ụzọ siri ike.
- source_word: δὲ
  choice: wee
  rationale: δὲ na-ejikọta nke a na akụkọ gara n’ihu; “wee” na-eme ka usoro akụkọ ahụ gaa were were n’Igbo, na-enweghị ime ka ọ bụrụ ọdịiche siri ike.
- source_word: πολλὴ χαρά
  choice: ọṅụ dị ukwuu
  rationale: πολλή na-eme ka χαρά sie ike. “Ọṅụ dị ukwuu” na-enye echiche nke great joy n’Igbo doro anya ma dịkwa ugwu.
- source_word: ἐν τῇ πόλει ἐκείνῃ
  choice: n’obodo ahụ
  rationale: πόλις bụ obodo, ebe ἐκείνῃ na-atụ aka n’obodo ahụ e kwuburu banyere ya. “N’obodo ahụ” bụ ntụgharị Igbo kpọmkwem ma bụrụ nke eke.
