translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị mfe nghọta ma dị ugwu. Ahịrịokwu ahụ na-edebe njikọ akụkọ na ịdị ukwuu nke ọṅụ ahụ.
