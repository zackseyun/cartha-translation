source:
  edition: SBLGNT
  text: ὁ δὲ Σίμων καὶ αὐτὸς ἐπίστευσεν, καὶ βαπτισθεὶς ἦν προσκαρτερῶν τῷ Φιλίππῳ, θεωρῶν τε ⸂σημεῖα καὶ δυνάμεις μεγάλας γινομένας⸃ ἐξίστατο.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/013.yaml
  text: And Simon himself also believed[a], and after being baptized he continued with Philip, and as he saw signs and great works of power happening, he was amazed.
translation:
  language: ig
  text: Saimọn n’onwe ya kwenyekwara. Mgbe e mere ya baptizim, ọ nọgidere na Filip. Ka ọ na-ahụ ihe ịrịba ama na ọrụ ike dị ukwuu[a] ndị na-eme, o juru ya anya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “ọrụ ebube dị ukwuu.” Okwu Grik a nwere ike ịpụta ngosipụta nke ike nakwa ọrụ ebube.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ αὐτὸς
  choice: n’onwe ya ... kwa
  rationale: Nke a na-echekwa ma nkwusi ike dị na αὐτός ma echiche nke ‘kwa’ dị na καί, na-egosi na Saimọn sokwa ná ndị kweere.
- source_word: ἐπίστευσεν
  choice: kwenyere
  rationale: Nke a na-ekwu naanị ihe ngwaa Grik kwuru, n’etinyeghị mkpebi banyere ma okwukwe Saimọn ò bụ nke zuru oke ma ọ bụ na ọ bụghị.
- source_word: βαπτισθεὶς
  choice: Mgbe e mere ya baptizim
  rationale: Ụdị a na-egosi na baptizim buru ụzọ mee tupu omume na-aga n’ihu nke iso Filip.
- source_word: ἦν προσκαρτερῶν τῷ Φιλίππῳ
  choice: ọ nọgidere na-eso Filip
  rationale: Nke a na-egosi omume na-aga n’ihu na ịrapara Saimọn n’ebe Filip nọ n’asụsụ Igbo dị mfe nghọta.
- source_word: θεωρῶν
  choice: Ka ọ na-ahụ
  rationale: Ọ na-egosi ịhụ ihe na-aga n’ihu, bụ́ nke kpatara ịtụnanya ya.
- source_word: σημεῖα
  choice: ihe ịrịba ama
  rationale: Ọ na-echekwa echiche nke ihe na-egosi ma ọ bụ na-agba akaebe banyere ike Chineke.
- source_word: δυνάμεις μεγάλας
  choice: nnukwu ọrụ ike
  rationale: Nsụgharị a na-anọ nso n’echiche bụ ngosipụta dị ukwuu nke ike, n’akọwaghị okwu ahụ nanị dị ka ọrụ ebube.
- source_word: γινομένας
  choice: ndị a na-arụ
  rationale: Nke a na-egosi na ihe ndị ahụ nọ na-eme n’ihu Saimọn.
- source_word: ἐξίστατο
  choice: o juru ya anya
  rationale: Nke a bụ ụzọ Igbo nkịtị si akọ na ihe ọ hụrụ tụrụ ya n’anya nke ukwuu.
theological_decisions:
- issue: Ma okwukwe Saimọn ò kwesịrị ịkọwa dị ka ezi nchegharị ma ọ bụ okwukwe na-abụghị eziokwu
  choice: Kwuo naanị na ọ ‘kwenyere.’
  alternative: ‘o ji ezi obi kwere’ ma ọ bụ ‘o kwuru na ya kwere’
  rationale: Amaokwu ahụ n’onwe ya kwuru na Saimọn kwenyere ma nata baptizim, ebe akụkọ sochirinụ na-eme ka ajụjụ banyere ọnọdụ ime mmụọ ya dị mgbagwoju anya. Nsụgharị ahụ anaghị ekpebi ihe Grik na-ekpebighị.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E kewara ahịrịokwu Grik ahụ ụzọ atọ iji mee ka ọ na-aga nke ọma n’Igbo, n’agbanweghị usoro ihe ndị mere ma ọ bụ njikọ echiche ha.
