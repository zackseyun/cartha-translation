id: ACT.8.39
reference: Acts 8:39
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὅτε δὲ ἀνέβησαν ἐκ τοῦ ὕδατος, πνεῦμα κυρίου ἥρπασεν τὸν Φίλιππον, καὶ οὐκ εἶδεν αὐτὸν οὐκέτι ὁ εὐνοῦχος, ἐπορεύετο γὰρ τὴν ὁδὸν αὐτοῦ χαίρων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/039.yaml
  text: And when they came up out of the water[a], the Spirit of the Lord carried Philip away, and the eunuch saw him no longer, for he went on his way rejoicing.
translation:
  language: ig
  text: Mgbe ha si na mmiri ahụ rịpụta, Mmụọ nke Onyenwe anyị napụrụ Filip pụọ[a]. Onozi ahụ ahụghịkwa ya ọzọ, n’ihi na ọ gara n’ihu n’ụzọ ya na-aṅụrị ọṅụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “dọkpụrụ Filip pụọ.” Ngwaa Grik a nwere ike imesi mwepụ dị na mberede na nke ike ike.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέβησαν ἐκ τοῦ ὕδατος
  choice: ha si na mmiri ahụ rịpụta
  rationale: Nkebiokwu a na-egosi na ha abụọ si n’ime mmiri ahụ rịgopụta, ma ọ naghị ekpebi kpọmkwem otú e si mee baptizim.
- source_word: πνεῦμα κυρίου
  choice: Mmụọ nke Onyenwe anyị
  rationale: N’akwụkwọ Luk na Ọrụ Ndị Ozi, okwu a na-ezokarị aka na Mmụọ Nsọ dịka onye na-arụ ọrụ Chineke; ‘Onyenwe anyị’ bụ ntụgharị kwụ ọtọ nke κύριος n’ebe a.
- source_word: ἥρπασεν
  choice: buru Filip pụọ
  rationale: Nke a na-egosi na Mmụọ ahụ wepụrụ Filip n’ebe ahụ. E debere echiche nke mwepụ mberede na nke ike n’ihe odide ala peeji.
- source_word: οὐκ εἶδεν αὐτὸν οὐκέτι
  choice: ahụghịkwa ya ọzọ
  rationale: Okwu a na-egosi na, malite n’oge ahụ, ọnaozi ahụ ahụghị Filip ọzọ.
- source_word: ὁ εὐνοῦχος
  choice: ọnọzi ahụ
  rationale: ‘Ọnọzi’ bụ okwu Igbo a na-eji maka eunuch ma na-edobe njikọ ya na nwoke ahụ a kọwara n’akụkọ gara aga.
- source_word: ἐπορεύετο τὴν ὁδὸν αὐτοῦ
  choice: ọ gara n’ihu n’ụzọ ya
  rationale: 'Nke a na-egosipụta omume na-aga n’ihu: nwoke ahụ nọgidere na njem ya.'
- source_word: χαίρων
  choice: na-aṅụrị ọṅụ
  rationale: Nke a na-edobe ike ngwaa nke participle ahụ ma na-egosi na ọṅụ so ụzọ o si gaa n’ihu.
theological_decisions:
- issue: Ma πνεῦμα κυρίου ọ̀ bụ Mmụọ Nsọ ka ọ bụ naanị ike na-abụghị onye
  choice: Mmụọ nke Onyenwe anyị, dịka onye Chineke ji rụọ ọrụ
  alternative: mmụọ sitere n’aka Onyenwe anyị, dịka ike na-abụghị onye
  rationale: Ojiji okwu a n’akwụkwọ Luk na Ọrụ Ndị Ozi na-egosi n’ụzọ kacha kwe omume na ọ bụ Mmụọ Chineke na-arụ ọrụ n’onwe ya.
- issue: Ma ἥρπασεν ò kwesịrị igosi mwepụ dị ebube na nke mberede
  choice: buru Filip pụọ, ebe ihe odide ala peeji na-egosi ike okwu ahụ
  alternative: dọkpụrụ Filip pụọ
  rationale: Akụkọ ahụ na-egosi na ọ bụ ọrụ Chineke pụrụ iche. Isi ntụgharị ahụ dị ugwu ma dị mfe nghọta; ntụgharị ọzọ na-echekwa echiche nke mwepụ mberede na nke ike.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ugwu ma dị mfe nghọta. E debere usoro akụkọ ahụ na njikọ ‘n’ihi na’ nke γάρ, n’agbanyeghị na njikọ echiche ya nwere ntakịrị mgbagwoju anya. E tinyere akara [a] ozugbo n’akụkụ okwu ọ na-akọwa.
