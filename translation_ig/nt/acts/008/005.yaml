source:
  edition: SBLGNT
  text: Φίλιππος δὲ κατελθὼν εἰς ⸀τὴν πόλιν τῆς Σαμαρείας ἐκήρυσσεν αὐτοῖς τὸν χριστόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/005.yaml
  text: Philip went down to the city of Samaria and proclaimed the Messiah to them[a][b].
translation:
  language: ig
  text: Filip wee gbadaa n'obodo Sameria ma kwusaara ha Mezaya ahụ[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “otu obodo dị na Sameria.” Okwu Grik ahụ nwere ike ịpụta ma obodo Sameria, ma ọ bụ otu obodo dị n’ógbè Sameria.
    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ, “n'obodo Sameria ahụ.”
    reason: previous_rendering
lexical_decisions:
- source_word: δὲ
  choice: wee
  rationale: E ji “wee” jikọta ihe a na akụkọ bu ya ụzọ n'ụzọ dị nro ma na-aga n'ihu, n'etinyeghị echiche nke oge dịka “ugbu a” ma ọ bụ nkwụsi ike dịka “ma.”
- source_word: κατελθὼν
  choice: gbadaa
  rationale: Nke a na-egosipụta ụzọ mgbada dị na κατέρχομαι, ma na-agbanwe participle Grik ka ọ bụrụ usoro omume sitere n'okike n'Igbo.
- source_word: τὴν πόλιν τῆς Σαμαρείας
  choice: n'obodo Sameria
  rationale: Nke a na-agbasochi kpọmkwem ọdịdị a kapịrị ọnụ nke πόλιν nwere article na genitive “nke Sameria,” ma hapụkwa nghọta ya dị ka obodo dị n'ógbè Sameria ka nkọwa ala kọwaa.
- source_word: ἐκήρυσσεν
  choice: kwusaara
  rationale: “Kwusaa” na-egosipụta ikwupụta ozi n'ihu ọha dịka onye na-ekwusa ozi, na-enweghị ime ka okwu ahụ bụrụ naanị okwu ụka.
- source_word: αὐτοῖς
  choice: ha
  rationale: “Ha” bụ ndị Filip gwara ozi ahụ, dịka dative pronoun Grik si dị.
- source_word: τὸν χριστόν
  choice: Mezaya ahụ
  rationale: Χριστός na-arụ ọrụ dịka utu aha ebe a; “Mezaya” na-echekwa echiche onye e tere mmanụ, ebe “ahụ” na-egosipụta article Grik.
theological_decisions:
- issue: Nsụgharị Χριστός
  choice: Mezaya ahụ
  alternative: Kraịst ahụ
  rationale: N'ọnọdụ a, okwu ahụ bụ utu aha nke onye ahụ Filip na-ekwusa, ọ bụghị naanị aha nkeonwe. “Mezaya” na-eme ka ndabere olileanya ndị Juu pụta ìhè ma ghara ịgbanwe ya ka ọ bụrụ aha nkịtị.
- issue: Ma πόλις ọ bụ otu obodo a maara kpọmkwem ka ọ bụ otu obodo n'ógbè Sameria
  choice: obodo Sameria
  alternative: otu obodo dị na Sameria
  rationale: Article dị n'ihe odide Grik na-akwado nsụgharị a kapịrị ọnụ, ma okwu ahụ ka nwere ike ịpụta otu obodo dị n'ógbè Sameria; e debere nghọta ọzọ ahụ n'ala peeji kama idozi ihe na-edoghị anya n'ime amaokwu.
translation_notes:
  register: Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta. E jiri “wee” mee njikọ akụkọ dị nro; e jighị okwu oge na-adịghị n'isi mmalite. E tinyere akara ala peeji [a] na [b] kpọmkwem n'ederede.
