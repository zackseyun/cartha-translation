review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the temporal participle, the passive giving of the Spirit, and διά as means. However, “o nyere ha ego” normally states that Simon gave them money, whereas προσήνεγκεν in this context means that he brought/presented money as an offer.
  naturalness: The revised wording is idiomatic Standard Igbo and keeps the narrative’s concise, formal register. “site n'ibikwasị aka nke ndị ozi ahụ” naturally identifies the apostles as those whose hands were laid on others without supplying an unstated recipient.
  terminology: “Mmụọ ahụ” appropriately reflects τὸ πνεῦμα, with the footnote identifying the contextual referent as the Holy Spirit. “Ndị ozi” is the standard term for apostles. The wording retains passive divine ambiguity and does not make the apostles the ultimate givers of the Spirit.
  issues:
  - severity: medium
    issue: The verb “nyere” can assert a completed gift rather than an offer or presentation.
    rationale: προσήνεγκεν denotes bringing or presenting money to them. “wetara ha ego” better retains the act of presenting it, while the following context supplies the proposed transaction.
  revised_text: Ma mgbe Saịmọn hụrụ na a na-enye Mmụọ ahụ[a] site n'ibikwasị aka nke ndị ozi ahụ, o wetara ha ego,
