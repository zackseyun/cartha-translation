    text: Ma ọ bụ, “Mmụọ Nsọ.” Ihe odide Grik kwuru naanị “Mmụọ ahụ,” ma ihe gbara ya gburugburu na-egosi na ọ bụ Mmụọ Nsọ.
    reason: lexical_alternative
  revision_rationale: Only the final verb phrase is adjusted to distinguish Simon’s presentation of money from an accomplished gift. All other wording faithfully reflects the Greek syntax and contextual referent.
