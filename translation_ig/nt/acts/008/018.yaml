id: ACT.8.18
reference: Acts 8:18
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸀ἰδὼν δὲ ὁ Σίμων ὅτι διὰ τῆς ἐπιθέσεως τῶν χειρῶν τῶν ἀποστόλων δίδοται τὸ ⸀πνεῦμα προσήνεγκεν αὐτοῖς χρήματα
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/018.yaml
  text: But when Simon saw that the Spirit was given through the laying on of the apostles’ hands[a], he offered them money,
translation:
  language: ig
  text: Ma mgbe Saịmọn hụrụ na a na-enye Mmụọ ahụ[a] site n'ibikwasị aka nke ndị ozi ahụ, o wetara ha ego,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Mmụọ Nsọ.” Ihe odide Grik kwuru naanị “Mmụọ ahụ,” ma ihe gbara ya gburugburu na-egosi na ọ bụ Mmụọ Nsọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν
  choice: mgbe ... hụrụ
  rationale: Nkejiasụsụ aorist a na-arụ ọrụ dị ka ihe na-egosi oge; ‘mgbe ... hụrụ’ na-egosi usoro ihe mere n'ụzọ Igbo si ada nke ọma.
- source_word: δὲ
  choice: Ma
  rationale: Ọ na-egosi obere mgbanwe ma ọ bụ ọdịiche n'akụkọ ahụ; ‘Ma’ dabara na ntụgharị uche gaa n'omume Saịmọn.
- source_word: διὰ τῆς ἐπιθέσεως τῶν χειρῶν
  choice: site n'ibikwasị aka
  rationale: διά ya na genitive na-egosi ụzọ ma ọ bụ ihe e ji mee ihe. Okwu a doro anya ma na-ezere ikwu na ndị ozi bụ isi iyi nke Mmụọ ahụ.
- source_word: τῶν ἀποστόλων
  choice: nke ndị ozi ahụ
  rationale: Nke a na-edobe njikọ genitive nke Grik ma na-eme ka o doo anya na aka ndị ahụ bụ nke ndị ozi ahụ.
- source_word: δίδοται
  choice: a na-enye
  rationale: Ọ na-edobe passive present nke Grik ma na-ada nke ọma dịka ihe Saịmọn chọpụtara na-eme site n'ụzọ ahụ.
- source_word: τὸ πνεῦμα
  choice: Mmụọ ahụ
  rationale: Grik kwuru naanị ‘Mmụọ ahụ’; mkpụrụedemede ukwu na ihe gbara amaokwu ahụ gburugburu na-egosi na ọ bụ Mmụọ Nsọ, ebe ihe odide bụ isi ka na-edobe ụdị okwu Grik.
- source_word: προσήνεγκεν
  choice: nyere
  rationale: N'ọnọdụ a προσφέρω pụtara iweta ma ọ bụ inye ihe dịka onyinye a chọrọ ka a nabata; ‘nyere ha ego’ bụ ụzọ Igbo nkịtị si kwuo na ọ chọrọ iji ego kwụọ ha.
- source_word: αὐτοῖς
  choice: ha
  rationale: Ọ bụ nnọchiaha na-anata ihe e nyere; ọnọdụ ya n'ahịrịokwu Igbo doro anya.
- source_word: χρήματα
  choice: ego
  rationale: χρήματα n'ebe a pụtara ego, nke bụ okwu Igbo kachasị kpọmkwem ma doo anya.
theological_decisions:
- issue: Onye τὸ πνεῦμα na-ezo aka na ya
  choice: Mmụọ ahụ, ya bụ Mmụọ Nsọ
  alternative: Mmụọ Nsọ
  rationale: Ihe odide Grik kwuru ‘Mmụọ ahụ,’ ebe amaokwu ndị bu ya ụzọ na-egosi n'ụzọ doro anya na ọ bụ Mmụọ Nsọ. Isi ederede na-edobe ụdị okwu Grik, ebe nkọwa ala peeji na-eme ka onye a na-ekwu maka ya doo anya.
- issue: Ụzọ e si enye Mmụọ ahụ
  choice: a na-enye Mmụọ ahụ site n'ibikwasị aka nke ndị ozi ahụ
  alternative: ndị ozi ahụ na-enye Mmụọ Nsọ site n'ibikwasị aka ha
  rationale: Nhọrọ a na-edobe passive nke Grik na διά nke na-egosi ụzọ e si mee ihe, n'emeghị ka ndị ozi bụrụ isi iyi ikpeazụ nke Mmụọ ahụ ma ọ bụ tinye nkwubi okwu gbasara usoro ụka nke amaokwu ahụ ekwughị.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke ugbu a ma dị nsọ n'olu; ahịrịokwu ahụ dị mfe nghọta. E debere passive na nghọtahie kwesịrị ekwesị banyere onye bụ isi iyi nke Mmụọ ahụ.
