translation_notes:
  register: Ejiri Standard Igbo dị ugbu a, dị nsọpụrụ ma dị mfe nghọta. A họọrọ ‘ụgbọ ịnyịnya’ maka ἅρμα ka ụdị ụgbọ njem oge ochie pụta ìhè. E tinyere naanị otu akara ndetu [a] n’ahịrịokwu bụ isi ma jikọta nkọwa usoro aha na omenala ịgụ ihe n’otu ndetu.
