  yaml_path: translation/nt/acts/008/028.yaml
  text: And he was returning[a], seated in his chariot[b], and was reading Isaiah the prophet.
translation:
  language: ig
  text: Ọ nọ na-alaghachi, nọ ọdụ n’ụgbọ ịnyịnya ya, na-agụkwa akwụkwọ onye amụma Aịzaya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “na-agụ Aịzaya onye amụma,” ma “akwụkwọ onye amụma Aịzaya” na-eme ka o doo anya n’Igbo na ọ na-agụ ihe onye amụma ahụ dere. N’oge ochie, a na-agụkarị ihe n’olu dara ụda; ya mere, “na-agụ n’olu dara ụda” nwekwara ike ịbụ ntụgharị uche, ọ bụ ezie na ngwaa Grik n’onwe ya ekwughị nke a hoo haa n’ebe a.
    reason: lexical_alternative_and_cultural_note
lexical_decisions:
- source_word: ἦν τε ὑποστρέφων
  choice: Ọ nọkwa na-alaghachi
  rationale: Nrụpụta ἦν tinyere participle na-egosi omume na-aga n’ihu n’oge gara aga. ‘Ọ nọkwa na-alaghachi’ na-echekwa echiche ahụ ma ghara ịgbakwụnye na ọ na-ala n’ụlọ, nke Grik ekwughị kpọmkwem.
- source_word: καθήμενος
  choice: nọdụ
  rationale: Nke a na-akọ ọnọdụ ahụ ya mgbe ọ na-eme njem; ‘nọdụ’ bụ okwu Igbo dị mfe ma kwekọọ n’akụkọ a.
- source_word: ἐπὶ τοῦ ἅρματος αὐτοῦ
  choice: n’ụgbọ ịnyịnya ya
  rationale: Ọ bụ ụzọ doro anya ma bụrụ nke ndị Igbo taa ga-aghọta maka ụgbọ njem ahụ, na-ezere nsụgharị nkịtị nke ἐπί nke nwere ike ịdị ka ọ nọ n’elu ụgbọ ahụ.
- source_word: ἀνεγίνωσκεν
  choice: na-agụkwa akwụkwọ
  rationale: Imperfect ahụ na-egosi omume na-aga n’ihu. Okwu a anaghị ekwu hoo haa na ọ na-agụ ya n’olu dara ụda, ya mere etinyeghị nke ahụ n’ahịrịokwu bụ isi.
- source_word: τὸν προφήτην Ἠσαΐαν
  choice: akwụkwọ Aịzaya onye amụma
  rationale: N’ọnọdụ a, onye ahụ na-agụ ihe e dere, ya mere ‘akwụkwọ Aịzaya’ na-eme ka Igbo doo anya n’enweghị ịgbanwe onye e kwuru na ọ bụ onye amụma. Usoro ‘Aịzaya onye amụma’ na-esokwa usoro okwu Grik.
