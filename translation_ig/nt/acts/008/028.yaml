    text: A pụkwara ịsị, “na-agụ Aịzaya onye amụma,” ma “akwụkwọ onye amụma Aịzaya” na-eme ka o doo anya n’Igbo na ọ na-agụ ihe onye amụma ahụ dere. N’oge ochie, a na-agụkarị ihe n’olu dara ụda; ya mere, “na-agụ n’olu dara ụda” nwekwara ike ịbụ ntụgharị uche, ọ bụ ezie na ngwaa Grik n’onwe ya ekwughị nke a hoo haa n’ebe a.
    reason: lexical_alternative_and_cultural_note
