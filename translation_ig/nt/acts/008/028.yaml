revisions:
- from: Ọ nọkwa na-alaghachi, nọdụ n’ụgbọ ịnyịnya ya, na-agụkwa akwụkwọ Aịzaya onye amụma.[a]
  to: Ọ nọ na-alaghachi, nọ ọdụ n’ụgbọ ịnyịnya ya, na-agụkwa akwụkwọ onye amụma Aịzaya.[a]
  rationale: The revision corrects the malformed posture expression, avoids doubling the weak connective, and corrects the footnote’s account of the Greek title-name order. It retains the contextual Igbo expression “akwụkwọ onye amụma Aịzaya” while marking the more literal alternative and keeping the oral-reading observation nonassertive.
