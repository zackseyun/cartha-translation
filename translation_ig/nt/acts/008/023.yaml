  yaml_path: translation/nt/acts/008/023.yaml
  text: For I see that you are in the gall of bitterness and the bond of unrighteousness[a][b].
translation:
  language: ig
  text: N’ihi na ana m ahụ na ị nọ n’ime nsi ilu na n’agbụ ajọ omume[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “n’ígwè nke ikpe na-ezighị ezi” ma ọ bụ “n’agbụ nke ajọ omume.”
    reason: lexical_alternative
  - marker: b
    text: Okwu Grik e sụgharịrị “nsi ilu” bụ, n’ụzọ nkịtị, “mmiri ilu nke ilu” (bile ma ọ bụ gall nke ilu). Ọ bụ okwu ihe atụ siri ike, o yikwara ka ọ na-echetara okwu Agba Ochie banyere ilu na-egbu egbu (tụnyere Diuterọnọmi 29:18 na Septuagint).
    reason: cross_reference
lexical_decisions:
- source_word: εἰς
  choice: n’ime
  rationale: N’usoro okwu a, εἰς na-egosi ọnọdụ Saịmọn nọ na ya, ọ bụghị nanị ịbanye n’ebe. “N’ime” na-egosipụta ọnọdụ ihe atụ ahụ nke ọma.
- source_word: γὰρ
  choice: N’ihi na
  rationale: γάρ na-enye ihe mere Pita ji kwuo ịdọ aka ná ntị dị n’amaokwu bu ụzọ; “N’ihi na” bụ njikọ doro anya ma bụrụkwa Igbo e ji eme ihe ugbu a.
- source_word: χολὴν πικρίας
  choice: nsi ilu
  rationale: χολή pụtara ihe dị ka mmiri ilu nke imeju, ma n’ebe a ọ bụ ihe atụ nke ihe ilu na-egbu egbu. “Nsi ilu” na-eme ka ike na ihe ize ndụ dị n’ihe atụ ahụ doo onye Igbo nke oge a anya, ebe nkọwa ala peeji na-echekwa nkọwa nkịtị nke okwu Grik.
- source_word: σύνδεσμον ἀδικίας
  choice: agbụ ajọ omume
  rationale: σύνδεσμος bụ ihe na-ekekọta mmadụ, ya mere “agbụ” na-echekwa ihe atụ ahụ. ἀδικία nwere ike ịpụta ajọ omume, mmebi ezi omume, ma ọ bụ ikpe na-ezighị ezi; “ajọ omume” dabara n’ọnọdụ omume ime mmụọ Saịmọn n’ebe a n’etinyeghị nkọwa okpukpe ọzọ.
- source_word: ὁρῶ
  choice: ana m ahụ
  rationale: Ọ bụ ngwaa oge ugbu a; “ana m ahụ” na-echekwa ma ịhụ anya ma nghọta miri emi okwu Grik ahụ nwere ike ịpụta.
- source_word: σε ὄντα
  choice: na ị nọ
  rationale: 'Usoro onye nnọchi aha na participle so ὁρῶ na-aghọ nkebiokwu ọdịnaya n’Igbo n’ụzọ eke: “ana m ahụ na ị nọ.”'
theological_decisions:
- issue: Nkọwa ihe atụ banyere ọnọdụ ime mmụọ na omume Saịmọn
  choice: 'E debere ihe atụ abụọ ahụ dịka ọnọdụ ọ nọ n’ime ya: “n’ime nsi ilu” na “n’agbụ ajọ omume.”'
  alternative: Ịkọwa ya kpọmkwem dịka “obi ilu jupụtara gị, mmehie ejidekwala gị.”
  rationale: Okwu Grik ji ihe atụ siri ike ma dị mkpụmkpụ, ọ naghị enye nkọwa ozizi zuru ezu banyere ọnọdụ Saịmọn. Nsụgharị a na-echekwa ịdị arọ na ohere nghọta dị n’okwu ahụ n’etinyeghị ozizi ọzọ.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ugwu ma dị mfe nghọta. “Nsi ilu” na-eme ka ihe atụ χολὴν πικρίας ghọta ngwa ngwa; nkọwa ala peeji na-echekwa ọdịdị nkịtị ya dịka mmiri ilu nke imeju. E zere okwu ụka pụrụ iche na nkọwa ozizi agbakwunyere.
