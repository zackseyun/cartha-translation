  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀνοίξας δὲ ὁ Φίλιππος τὸ στόμα αὐτοῦ καὶ ἀρξάμενος ἀπὸ τῆς γραφῆς ταύτης εὐηγγελίσατο αὐτῷ τὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/035.yaml
  text: Then Philip opened his mouth[a], and beginning from this Scripture[b], he proclaimed the good news about Jesus to him.
translation:
  language: ig
  text: Mgbe ahụ, Filip meghere ọnụ ya, malite n’Akwụkwọ Nsọ a[a], wee kwusara ya ozi ọma banyere Jizọs.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “malite site n’Akwụkwọ Nsọ a.”
    reason: lexical_alternative
  - marker: b
    text: N’ụzọ nkịtị, “o kwusaara ya Jizọs,” ya bụ, o kwusara ozi ọma banyere Jizọs.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνοίξας ... τὸ στόμα αὐτοῦ
  choice: Filip meghere ọnụ ya
  rationale: Nke a na-edobe akpaala okwu Grik nke pụtara ịmalite ikwu okwu, ma ọ ka bụkwa okwu Igbo a pụrụ ịghọta nke ọma n’akụkọ dị nsọ.
- source_word: δὲ
  choice: Mgbe ahụ
  rationale: N’ebe a, δέ na-eme ka akụkọ gaa n’ihu; ‘Mgbe ahụ’ na-egosi usoro ihe mere n’enweghị ịgbakwunye nkọwa ọzọ.
- source_word: ἀρξάμενος ἀπὸ τῆς γραφῆς ταύτης
  choice: malitekwa n’Akwụkwọ Nsọ a
  rationale: ‘Malite n’…’ na-egosipụta ἀπό dị ka ebe Filip siri bido nkọwa ya, ebe ‘Akwụkwọ Nsọ’ na-egosipụta na γραφή bụ ihe odide dị nsọ.
- source_word: γραφῆς
  choice: Akwụkwọ Nsọ
  rationale: N’ọnọdụ Agba Ọhụrụ a, γραφή na-ezo aka n’ihe odide dị nsọ, ọ bụghị naanị ihe odide nkịtị.
- source_word: εὐηγγελίσατο
  choice: kwusara ... ozi ọma banyere
  rationale: Nhọrọ a na-egosipụta omume nke ikwusa ozi ọma n’asụsụ Igbo dị ugbu a, n’enweghị ụda nke ọrụ ụka a haziri ahazi nke okwu ụfọdụ nwere ike iweta.
- source_word: αὐτῷ
  choice: ya
  rationale: ‘Ya’ na-ezo kpọmkwem n’ebe onye Etiopia ahụ nọ, dịka nnọchiaha Grik si dị, n’etinyeghị aha ọzọ na-adịghị n’amaokwu a.
- source_word: τὸν Ἰησοῦν
  choice: banyere Jizọs
  rationale: Mgbe εὐαγγελίζομαι so ebubo aha mmadụ, onye ahụ nwere ike ịbụ ọdịnaya nke ozi ọma ahụ; ‘banyere Jizọs’ na-eme ka nke a doo anya n’Igbo eke.
theological_decisions:
- issue: Ihe εὐηγγελίσατο αὐτῷ τὸν Ἰησοῦν pụtara
  choice: Filip kwusara ya ozi ọma banyere Jizọs, ya bụ, Jizọs bụ isi na ọdịnaya nke ozi ahụ.
  alternative: Filip kwusara ya Jizọs.
  rationale: Usoro okwu Grik na-etinye Jizọs dịka ọdịnaya nke nkwusa ozi ọma. Nsụgharị a na-ekwupụta nke ahụ nke ọma n’Igbo eke, ma ọ naghị agbakwunye nkọwa nkwenkwe karịrị ihe ahịrịokwu ahụ kwuru.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. E debere akpaala okwu ‘meghere ọnụ ya’ iji chekwaa ụdị okwu Grik na ụda akụkọ ahụ; e tinyekwara akara ndetu [a] na [b] n’ebe ha metụtara isiokwu ha kpọmkwem.
