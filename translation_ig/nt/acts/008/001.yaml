id: ACT.8.1
reference: Acts 8:1
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Σαῦλος δὲ ἦν συνευδοκῶν τῇ ἀναιρέσει αὐτοῦ. Ἐγένετο δὲ ἐν ἐκείνῃ τῇ ἡμέρᾳ διωγμὸς μέγας ἐπὶ τὴν ἐκκλησίαν τὴν ἐν Ἱεροσολύμοις· πάντες δὲ διεσπάρησαν κατὰ τὰς χώρας τῆς Ἰουδαίας καὶ Σαμαρείας πλὴν τῶν ἀποστόλων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/001.yaml
  text: Saul was approving of his execution. And on that day a great persecution arose against the church in Jerusalem[a], and they were all scattered throughout the regions of Judea and Samaria, except the apostles.
translation:
  language: ig
  text: Sọl nọ na-akwado igbu ya[a]. N’ụbọchị ahụ, oké mkpagbu bilitere megide ọgbakọ dị na Jeruselem; ha niile wee gbasasịa n’akụkụ niile nke Judia na Sameria, ma e wezụga ndịozi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “ime ka ọ nwụọ,” “ọnwụ ya,” ma ọ bụ, n’ụzọ nwere nkọwa karịa, “ogbugbu ọchụ e gburu ya.” Okwu Grik ahụ na-ezo aka n’omume igbu ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: Σαῦλος
  choice: Sọl
  rationale: Ụdị aha a na-ejikarị n’Igbo maka aha Grik Σαῦλος.
- source_word: ἦν συνευδοκῶν
  choice: nọ na-akwado
  rationale: Na-egosi nkwado na-aga n’ihu ma ọ bụ nke dị n’otu oge ahụ, n’enweghị ikwu na Sọl ji aka ya sonyere n’igbu ahụ.
- source_word: τῇ ἀναιρέσει αὐτοῦ
  choice: igbu ya
  rationale: Na-edobe echiche nke omume ime ka ọ nwụọ; ọ naghị ewebata ma igbu ahụ ò ziri ezi n’iwu, dị ka ‘ikpe ọnwụ,’ ma ọ bụ kpọọ ya ‘ogbugbu ọchụ’ n’ụzọ siri ike karịa okwu Grik ahụ.
- source_word: Ἐγένετο
  choice: bilitere
  rationale: N’ebe a ọ na-egosi na mkpagbu ahụ malitere ma pụta ìhè.
- source_word: διωγμὸς μέγας
  choice: oké mkpagbu
  rationale: Na-edobe ike nke μέγας ma jiri okwu Igbo doro anya maka mkpagbu.
- source_word: ἐπὶ τὴν ἐκκλησίαν τὴν ἐν Ἱεροσολύμοις
  choice: megide ọgbakọ dị na Jerusalem
  rationale: ‘Megide’ na-egosi iro a tụkwasịrị ọgbakọ ahụ; ‘ọgbakọ’ na-ezere ime ka ἐκκλησία bụrụ ụlọ ofufe.
- source_word: πάντες δὲ διεσπάρησαν
  choice: ha niile wee gbasasịa
  rationale: Na-edobe ‘ha niile’ dịka e dere ya, ebe njedebe ahịrịokwu ahụ na-akọwapụta na ndịozi esoghị.
- source_word: κατὰ τὰς χώρας τῆς Ἰουδαίας καὶ Σαμαρείας
  choice: n’akụkụ niile nke Judia na Sameria
  rationale: Na-egosi mgbasa gafee mpaghara ala abụọ ahụ n’Igbo dị mfe ma bụrụ nke a na-asụ ugbu a.
- source_word: πλὴν τῶν ἀποστόλων
  choice: ma e wezụga ndịozi
  rationale: Na-egosi n'ụzọ kwụ ọtọ na ndịozi bụ ndị e wepụrụ n’okwu ‘ha niile.’
theological_decisions:
- issue: Ihe ἀναιρέσει αὐτοῦ pụtara gbasara ọnwụ Stivin
  choice: igbu ya
  alternative: ikpe ọnwụ ya; ọnwụ ya; ogbugbu ọchụ e gburu ya
  rationale: ‘Igbu ya’ na-ekwu kpọmkwem banyere ime ka ọ nwụọ, ma ọ naghị ekpebi na omume ahụ bụ ikpe iwu ziri ezi ma ọ bụ tinye aha ikpe omume nke okwu Grik ahụ n’onwe ya na-ekwughị kpọmkwem.
- issue: Ókè πάντες (‘ha niile’) ruru
  choice: ha niile ... ma e wezụga ndịozi
  alternative: ndị kwere ekwe niile; onye ọ bụla
  rationale: A hapụrụ ike okwu ‘niile’ ka ọ dị, ma ahịrịokwu ahụ n’onwe ya na-enye nkọwa doro anya na ndịozi esoghị ná ndị gbasasịrị.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E jiri ‘ọgbakọ’ mee ihe kama okwu nwere ike ime ka onye na-agụ ya chee naanị banyere ụlọ ụka; e jikọtara akara nkọwa ala ala peeji [a] na ‘igbu ya,’ bụ́ okwu nkọwa ahụ metụtara.
