revisions:
- from: Sọl nọ na-akwado igbu ya[a]. N’ụbọchị ahụkwa, oké mkpagbu bilitere megide ọgbakọ dị na Jerusalem; ha niile wee gbasasịa n’akụkụ niile nke Judia na Sameria, ma e wezụga ndịozi.
  to: Sọl nọ na-akwado igbu ya[a]. N’ụbọchị ahụ, oké mkpagbu bilitere megide ọgbakọ dị na Jeruselem; ha niile wee gbasasịa n’akụkụ niile nke Judia na Sameria, ma e wezụga ndịozi.
  rationale: The revision removes the unwarranted extra emphasis in «ahụkwa» and regularizes the place-name spelling to «Jeruselem». It otherwise preserves the draft’s faithful and natural rendering, including the footnote anchored to «igbu ya».
  reviewer_model: gpt-5.6-terra
