  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἶπεν δὲ τὸ πνεῦμα τῷ Φιλίππῳ· Πρόσελθε καὶ κολλήθητι τῷ ἅρματι τούτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/029.yaml
  text: Then the Spirit said to Philip[a], “Go over and join this chariot.”
translation:
  language: ig
  text: Mgbe ahụ, Mmụọ ahụ gwara Filip, sị, “Gakwuru ụgbọ ịnyịnya a, nọgide n'akụkụ ya.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶπεν
  choice: gwara ... sị
  rationale: N'Igbo, ‘gwara ... sị’ bụ ụzọ e si ekwu okwu kpọmkwem n'ụzọ ebumpụta ụwa, ma na-egosikwa nke ọma na Mmụọ ahụ gwara Filip okwu.
- source_word: δὲ
  choice: Mgbe ahụ
  rationale: N'ebe a, δέ na-eme ka akụkọ gaa n'ihu, ọ bụghị igosi nnukwu mmegide; ‘Mgbe ahụ’ na-egosi usoro ihe ndị mere.
- source_word: τὸ πνεῦμα
  choice: Mmụọ ahụ
  rationale: A hapụrụ okwu ahụ dịka Grik si kwuo ya n'etinyeghị ‘Nsọ,’ ọ bụ ezie na ọnọdụ dị n'Ọrụ Ndịozi na-egosi na ọ bụ Mmụọ Nsọ.
- source_word: τῷ Φιλίππῳ
  choice: Filip
  rationale: A sụgharịrị aha ahụ n'ụdị a na-ahụkarị ma dị mfe ọgụgụ n'Igbo; ngwaa ‘gwara’ na-egosi na ọ bụ ya ka a gwara okwu.
- source_word: Πρόσελθε
  choice: Gakwuru
  rationale: Okwu a na-enye iwu ka Filip gaa nso n'ebe ụgbọ ahụ nọ; ‘gakwuru’ bụ Igbo doro anya ma kwekọọ na ọnọdụ ahụ.
- source_word: κολλήθητι
  choice: nọdebekwa ya nso
  rationale: κολλάομαι na-enye echiche nke ịrapara ma ọ bụ ịnọ ezigbo nso. N'ọnọdụ ụgbọ na-aga ije, ‘nọdebe ya nso’ na-egosi iso ya n'akụkụ n'enweghị nkọwa na-adịghị ebumpụta ụwa.
- source_word: τῷ ἅρματι τούτῳ
  choice: ụgbọ ịnyịnya a
  rationale: ἅρμα bụ ụgbọ e ji ịnyịnya adọkpụ; ‘ụgbọ ịnyịnya’ na-enyere onye Igbo nke oge a aka ịghọta ụdị ụgbọ ahụ, ebe ‘a’ na-edobe ịdị nso nke τούτῳ.
theological_decisions:
- issue: Ihe τὸ πνεῦμα na-ezo aka na ya
  choice: ‘Mmụọ ahụ,’ nke n'ọnọdụ akụkọ a bụ Mmụọ Nsọ
  alternative: ‘Mmụọ Nsọ’ kpọmkwem, ma ọ bụ mmụọ dị ka mkpali ime mmụọ a na-akọwaghị nke ọma
  rationale: N'Ọrụ Ndịozi, ‘Mmụọ ahụ’ nke na-enye ndị kwere ekwe ntụziaka na-abụkarị Mmụọ Nsọ. Ma ebe Grik etinyeghị ἅγιον (‘Nsọ’), ntụgharị ahụ adịghị agbakwunye ya, si otú ahụ chekwaa ma ihe a na-ezo aka na ya ma usoro okwu isi mmalite.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ ‘gwara ... sị’ maka okwu kpọmkwem, na ‘nọdebekwa ya nso’ iji chekwaa echiche nke κολλήθητι nke ịbụ ma ọ bụ ịnọgide ezigbo nso.
