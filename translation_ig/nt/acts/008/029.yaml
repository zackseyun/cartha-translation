    rationale: κολλήθητι is a single imperative meaning to attach oneself/remain close; it does not contain an ‘also’ component.
  - severity: low
    issue: The expression for κολλήθητι can be made more idiomatic.
    rationale: ‘Nọgide n'akụkụ ya’ naturally communicates staying close alongside the chariot in this narrative setting.
