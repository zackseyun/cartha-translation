base_translation:
  language: en
  yaml_path: translation/nt/acts/008/034.yaml
  text: Then the eunuch answered Philip and said[a], “I ask you, about whom does the prophet say this—about himself or about someone else?”
translation:
  language: ig
  text: Mgbe ahụ, onozi ahụ zara Filip, sị, “Biko, ana m ajụ gị,[a] onye ka onye amụma ahụ na-ekwu ihe a banyere? Ọ̀ bụ banyere onwe ya, ka ọ̀ bụ banyere onye ọzọ?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “Ana m arịọ gị.” Okwu Grik ahụ na-egosi arịrịọ e ji nkwanye ùgwù kwuo, o nwekwara ike igosi arịrịọ siri ike karị.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ
  choice: Mgbe ahụ ... zara
  rationale: δὲ na-akwalite akụkọ ahụ n’ihu, ebe ἀποκριθείς bụ nzaghachi nke na-eduga n’okwu e kwuru; nsụgharị a bụ Igbo nkịtị ma na-edobe ọrụ abụọ ahụ.
- source_word: ὁ εὐνοῦχος
  choice: ọnaozi ahụ
  rationale: “Ọnaozi” bụ okwu Igbo doro anya maka nwoke e biri amụ; idebe ya kama “onyeisi” na-echekwa njirimara onye ahụ dị n’ihe Luk dere.
- source_word: τῷ Φιλίππῳ
  choice: Filip ... ya
  rationale: Dative ahụ na-egosi onye a gwara okwu. “Zara Filip sị ya” na-ada nke ọma n’Igbo ma na-egosipụta onye a na-agwa okwu.
- source_word: Δέομαί σου
  choice: Biko, ana m ajụ gị
  rationale: Nke a na-egosipụta arịrịọ nkwanye ùgwù nke δέομαι n’enweghị ime ka ike arịrịọ ahụ sie karịa ihe ọnọdụ ahụ chọrọ.
- source_word: περὶ τίνος
  choice: onye ... banyere ya
  rationale: Usoro ajụjụ a bụ Igbo eke maka ịjụ onye okwu ahụ na-ezo aka na ya.
- source_word: ὁ προφήτης λέγει τοῦτο
  choice: onye amụma ahụ na-ekwu
  rationale: Ọnọdụ ahụ emeela ka o doo anya na ihe a na-ekwu bụ amaokwu a ka gụrụ; Igbo a na-ezere nkwughachi na-adịghị eke ma na-echekwa ihe Greek pụtara.
- source_word: περὶ ἑαυτοῦ ἢ περὶ ἑτέρου τινός
  choice: Ọ̀ bụ banyere onwe ya, ka ọ̀ bụ banyere onye ọzọ?
  rationale: Nke a na-edobe ọdịiche doro anya dị n’etiti onye amụma n’onwe ya na onye ọzọ.
theological_decisions: []
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. E debere ajụjụ abụọ na esemokwu dị n’etiti “onwe ya” na “onye ọzọ,” n’enweghị ịkọwa onye amaokwu ahụ na-ezo aka na ya tupu nzaghachi Filip.
