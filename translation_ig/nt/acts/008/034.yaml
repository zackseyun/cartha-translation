- from: Mgbe ahụ, ọnaozi ahụ zara Filip sị ya, “Biko, ana m ajụ gị,[a] onye ka onye amụma ahụ na-ekwu banyere ya? Ọ̀ bụ banyere onwe ya, ka ọ̀ bụ banyere onye ọzọ?”
  to: Mgbe ahụ, onozi ahụ zara Filip, sị, “Biko, ana m ajụ gị,[a] onye ka onye amụma ahụ na-ekwu ihe a banyere? Ọ̀ bụ banyere onwe ya, ka ọ̀ bụ banyere onye ọzọ?”
  rationale: The revision explicitly translates “this,” replaces an unclear designation with the established Igbo biblical term “onozi” for “eunuch,” and smooths the speech introduction. It preserves the respectful force of Δέομαί σου and the text’s deliberate ambiguity concerning whether the prophet speaks about himself or another person.
