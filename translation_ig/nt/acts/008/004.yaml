  text: Οἱ μὲν οὖν διασπαρέντες διῆλθον εὐαγγελιζόμενοι τὸν λόγον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/004.yaml
  text: So those who had been scattered went through the region proclaiming the word[a][b][c].
translation:
  language: ig
  text: Ya mere, ndị e chụsasịrị gara ebe dị iche iche, na-ekwusa okwu ahụ dị ka ozi ọma.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “na-ekwusa ozi ọma ahụ.”
    reason: lexical_alternative
  - marker: b
    text: N'asụsụ Grik, “okwu ahụ.” N'ọnọdụ a, ọ na-ezo aka n'ozi banyere Jizọs.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἱ μὲν οὖν
  choice: Ya mere, ndị
  rationale: “Ya mere” na-egosi njikọ na ihe mere tupu amaokwu a—mkpagbu na nchụsasị—ma μέν na-arụ ọrụ nhazi okwu nke na-adịghị mkpa ka a sụgharịa ya iche n'Igbo.
- source_word: διασπαρέντες
  choice: e chụsasịrị
  rationale: Ụdị a na-echekwa passive nke participle ahụ ma na-egosi na ọ bụ ihe mere ha tupu ha amalite ịgagharị na ikwusa.
- source_word: διῆλθον
  choice: gara ebe dị iche iche
  rationale: Nke a na-egosipụta ịgagharị site n'otu ebe ruo n'ebe ọzọ, nke bụ isi echiche nke διέρχομαι n'ọnọdụ a, n'Igbo nkịtị ma doo anya.
- source_word: εὐαγγελιζόμενοι
  choice: na-ekwusa ... dị ka ozi ọma
  rationale: Ngwaa Grik ahụ n'onwe ya nwere echiche nke ịkpọsa ozi ọma; nhazi a na-eme ka echiche ahụ pụta ìhè ma debe “okwu ahụ” dị ka ihe a na-ekwusa.
- source_word: τὸν λόγον
  choice: okwu ahụ
  rationale: Nke a na-echekwa okwu Luk ji mee ihe n'ụzọ dị nkenke, kama ịgbakwunye “nke Chineke” ma ọ bụ ịkọwapụta ya ozugbo dị ka “ozi banyere Jizọs.”
theological_decisions:
- issue: Mmekọrịta εὐαγγελιζόμενοι na τὸν λόγον
  choice: na-ekwusa okwu ahụ dị ka ozi ọma
  alternative: na-ekwusa ozi ọma ahụ
  rationale: Nke a na-echekwa ma echiche ozi ọma dị na ngwaa ahụ ma “okwu ahụ” nke bụ direct object ya. Ọ naghị emepụta genitive na-adịghị na Grik, ọ naghịkwa agwakọta okwu abụọ ahụ ka nghọta Luk funahụ.
translation_notes:
  register: Asụsụ Igbo a bụ nke oge a, kwụ ọtọ ma dị ùgwù. “Ebe dị iche iche” na-enye echiche nke njem site n'otu ebe ruo n'ebe ọzọ n'enweghị ịgbakwunye otu mpaghara a na-akpọghị aha na Grik. Akara nkọwa ala ala [a] na [b] dị n'ahịrị isi.
