- from: Ha na-egekwa ya ntị, n’ihi na o jirila ọrụ anwansi ya mee ka ha ju anya ruo ogologo oge.[a][b]
  to: Ha na-egekwa ya ntị, n’ihi na o jirila ọrụ anwansi ya mee ka ha ju anya kemgbe ogologo oge.[a][b]
  rationale: The revision changes only the temporal expression and its corresponding alternative note. It preserves the Greek causal construction, the prior-and-continuing force of the perfect infinitive, and the source text’s noncommittal description of Simon’s magical practices.
