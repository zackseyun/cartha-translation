  text: προσεῖχον δὲ αὐτῷ διὰ τὸ ἱκανῷ χρόνῳ ταῖς μαγείαις ἐξεστακέναι αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/011.yaml
  text: And they paid attention to him because for a considerable time he had amazed them with his magic arts[a][b].
translation:
  language: ig
  text: Ha na-egekwa ya ntị, n’ihi na o jirila ọrụ anwansi ya mee ka ha ju anya kemgbe ogologo oge.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “kemgbe oge dị ogologo.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “site ná mgbaasị ya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: προσεῖχον
  choice: Ha na-egekwa ya ntị
  rationale: Okwu a na-egosi na ha nọgidere na-etinye uche n’ihe ọ na-ekwu ma ọ bụ na-eme; “na-ege ya ntị” bụ okwu Igbo nkịtị ma doo anya. “-kwa” na-egosipụta njikọ δὲ na ihe e kwuru n’amaokwu bu ụzọ.
- source_word: αὐτῷ
  choice: ya
  rationale: Ọ bụ onye a na-ege ntị, ya bụ Saịmọn, dịka dative αὐτῷ si arụ ọrụ na προσέχω.
- source_word: διὰ τὸ ἱκανῷ χρόνῳ
  choice: n’ihi na ... ruo ogologo oge
  rationale: διά tinyere infinitive nwere article na-enye ihe kpatara omume ahụ; ἱκανῷ χρόνῳ na-egosi oge dị ukwuu ma ọ bụ dị ogologo.
- source_word: ταῖς μαγείαις
  choice: ọrụ anwansi ya
  rationale: μαγεία na-ezo aka n’omume anwansi. “Ọrụ anwansi” bụ Igbo doro anya nke na-akọwa omume ahụ n’akọwaghị ma ọ bụ aghụghọ nkịtị, ike ime mmụọ, ma ọ bụ ha abụọ. E tinyere “ya” site n’ọnọdụ okwu ahụ.
- source_word: ἐξεστακέναι
  choice: o jirila ... mee ka ha ju anya
  rationale: Perfect infinitive a pụtara ime ka mmadụ ju anya nke ukwuu, ya na mmetụta nke malitere tupu oge ahụ ma kọwaa ihe mere ha ji nọgide na-ege ya ntị. “Jirila” na-enyere aka igosi ọnọdụ ahụ dịbu adị.
- source_word: αὐτούς
  choice: ha
  rationale: Ọ na-ezo aka n’ìgwè mmadụ ahụ e kwuru banyere ha n’amaokwu ndị gbara ya gburugburu.
theological_decisions:
- issue: Ụdị omume Saịmọn nke μαγείαις na-akọwa
  choice: ọrụ anwansi
  alternative: ịgba afa na mgbaasị
  rationale: Amaokwu ahụ kpọrọ ihe ndị ahụ omume anwansi ma kwuo mmetụta ha nwere n’ahụ ndị mmadụ, ma ọ kọwaghị kpọmkwem ma ha bụ aghụghọ, ọrụ ike ọchịchịrị, ma ọ bụ ha abụọ. Nsụgharị ahụ ahapụghị mgbagwoju a.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-edebe usoro ihe kpatara ya na Greek, ma jiri usoro okwu Igbo kwụ ọtọ. Akara nkọwa ala [a] na [b] dị n’isi ederede.
