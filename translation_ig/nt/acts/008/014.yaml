id: ACT.8.14
reference: Acts 8:14
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἀκούσαντες δὲ οἱ ἐν Ἱεροσολύμοις ἀπόστολοι ὅτι δέδεκται ἡ Σαμάρεια τὸν λόγον τοῦ θεοῦ, ἀπέστειλαν πρὸς ⸀αὐτοὺς Πέτρον καὶ Ἰωάννην,
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/014.yaml
  text: When the apostles in Jerusalem heard that Samaria had received the word of God, they sent Peter and John to them,
translation:
  language: ig
  text: Mgbe ndịozi nọ na Jerusalem nụrụ na Sameria anabatala okwu Chineke, ha zigara ha Pita na Jọn.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀκούσαντες
  choice: Mgbe ... nụrụ
  rationale: Nkebi a nke dị n'ụdị aorist participle na-egosi ihe mere tupu ngwaa bụ isi; “Mgbe ... nụrụ” bụ Igbo eke nke na-edobe njikọ oge ahụ.
- source_word: δὲ
  choice: E gosipụtaghị ya iche
  rationale: N'ebe a δέ bụ njikọ akụkọ dị nro, ọ bụghị mmegide siri ike. Usoro ahịrịokwu Igbo na-eburu njikọ ahụ nke ọma n'enweghị itinye okwu dịka “ma” nke nwere ike ime ka a ghọta na e nwere mmegide.
- source_word: οἱ ἐν Ἱεροσολύμοις ἀπόστολοι
  choice: ndịozi nọ na Jerusalem
  rationale: Nke a na-akọwa ndịozi dị na Jerusalem n'ụzọ doro anya ma bụrụkwa Igbo nkịtị.
- source_word: δέδεκται
  choice: anabatala
  rationale: Ụdị perfect nke δέχομαι na-egosi nnabata emechara nke nsonaazụ ya ka dị; “anabatala” na-edobe akụkụ a n'Igbo n'ụzọ eke.
- source_word: ἡ Σαμάρεια
  choice: Sameria
  rationale: E debere aha ebe ahụ dịka isiokwu, dịka Grik si mee, ka e ghara ịkọwa ya n'ụzọ dị warara dịka naanị “ndị Sameria.”
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: okwu Chineke
  rationale: Nke a na-edobe okwu Akwụkwọ Nsọ a maara nke ọma na njikọ genitive nke Grik, n'enweghị ịgbasa ya gaa na “ozi” naanị.
- source_word: ἀπέστειλαν
  choice: ha zigara
  rationale: “Zigara” bụ nsụgharị Igbo kwụ ọtọ ma dị eke maka iziga mmadụ n'ebe ndị ọzọ nọ.
- source_word: πρὸς αὐτοὺς
  choice: ha
  rationale: N'ime “zigara ha,” nnọchiaha a na-egosi ndị bi na Sameria ndị a kpọtụrụ aha n'ụzọ metonymic.
- source_word: Πέτρον καὶ Ἰωάννην
  choice: Pita na Jọn
  rationale: Aha ndị a bụ ụdị transliteration a na-eji n'Igbo Akwụkwọ Nsọ.
theological_decisions:
- issue: Ojiji “Sameria” n'ọnọdụ ndị bi na ya
  choice: Sameria anabatala okwu Chineke
  alternative: ndị Sameria anabatala okwu Chineke
  rationale: Grik kpọrọ ebe ahụ aha ma jiri ya nọchite anya ndị bi na ya. Idebe “Sameria” na-anọ nso na isi mmalite ma ghara imechi ihe okwu ahụ nwere ike ịgụnye.
- issue: Nsụgharị λόγος dịka “okwu”
  choice: okwu Chineke
  alternative: ozi Chineke
  rationale: “Okwu Chineke” na-edobe ọdịdị na ụda nkà mmụta okpukpe nke okwu Grik, ebe ihe gbara ya gburugburu na-egosi na ọ bụ okwu e kwusara.
translation_notes:
  register: Asụsụ Igbo izugbe, nke ugbu a, dị ùgwù ma dị mfe nghọta. E ji “ndịozi” mee otu okwu dịka ojiji Igbo Akwụkwọ Nsọ si dị; a hapụrụ akara njikọ δέ ka usoro ahịrịokwu gosipụta ya n'enweghị itinye mmegide na-adịghị na Grik.
