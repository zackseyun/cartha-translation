source:
  edition: SBLGNT
  text: Φίλιππος δὲ εὑρέθη εἰς Ἄζωτον, καὶ διερχόμενος εὐηγγελίζετο τὰς πόλεις πάσας ἕως τοῦ ἐλθεῖν αὐτὸν εἰς Καισάρειαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/040.yaml
  text: But Philip was found at Azotus[a], and as he passed through, he was proclaiming the good news to all the cities until he came to Caesarea.
translation:
  language: ig
  text: Ma a hụrụ Filip n’Azọt[a]; ka ọ na-agafe, ọ nọ na-ekwusa ozi ọma n’obodo niile ruo mgbe ọ bịarutere Sesaria.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “Filip pụtara n’Azọt.” N’asụsụ Grik, ihe e kwuru kpọmkwem bụ, “a hụrụ Filip n’Azọt.” N’ọnọdụ akụkọ a, nke a nwere ike ịpụta na a kpọgara ya ebe ahụ na mberede, ma okwu ahụ ekwughị nke ahụ hoo haa.
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: Ma
  rationale: Ọ na-egosi ntakịrị mgbanwe ma ọ bụ ọdịiche n’akụkọ ahụ mgbe Mmụọ Onyenweanyị wepụrụ Filip n’amaokwu gara aga.
- source_word: εὑρέθη
  choice: a hụrụ Filip
  rationale: Nke a na-edobe ngwaa ahụ n’ụdị nnara dịka Grik si kwuo ya, ma ghara ịkọwa n’ụzọ doro anya ihe odide ahụ hapụrụ ka ọnọdụ gbara ya gburugburu gosi.
- source_word: εἰς Ἄζωτον
  choice: n’Azọt
  rationale: N’agbanyeghị na εἰς na-egosikarị ebe a na-aga, n’ebe a ọ na-egosi ebe Filip nọ mgbe a hụrụ ya; ‘n’Azọt’ bụ Igbo eke.
- source_word: διερχόμενος
  choice: Ka ọ na-agafe n’obodo dị iche iche
  rationale: Ọ na-egosi njem Filip na-eme n’otu oge ahụ; mgbakwunye ‘n’obodo dị iche iche’ na-eme ka mmekọrịta ya na ‘obodo niile’ doo anya n’Igbo.
- source_word: εὐηγγελίζετο
  choice: ọ nọ na-ekwusa ozi ọma
  rationale: Ụdị imperfect na-egosi omume na-aga n’ihu ma ọ bụ na-eme ugboro ugboro; okwu a bụ nke a na-aghọta ngwa ngwa ma zere ịdabere n’okwu ụka pụrụ iche.
- source_word: τὰς πόλεις πάσας
  choice: n’obodo niile
  rationale: Ọ na-ezo aka n’obodo niile dị n’ụzọ njem ya, ọ bụghị obodo niile n’ụwa.
- source_word: ἕως τοῦ ἐλθεῖν αὐτὸν
  choice: ruo mgbe ọ bịarutere
  rationale: Ọ na-egosi njedebe nke njem na nkwusa ahụ n’Igbo dị mfe ma doo anya.
- source_word: εἰς Καισάρειαν
  choice: Sesaria
  rationale: A sụgharịrị aha ebe ahụ n’ụdị a na-ahụkarị n’Igbo, ebe ngwaa ‘bịarutere’ egosilarị na ọ bụ ebe ọ na-aga.
theological_decisions:
- issue: Ma εὑρέθη kwesịrị ịkọwa n’ụzọ doro anya na Filip pụtara na mberede n’Azọt site n’ọrụ ebube
  choice: Edobere okwu nnara na-anọpụ iche, ‘a hụrụ Filip,’ n’ahịrị bụ isi.
  alternative: ‘Filip pụtara na mberede n’Azọt’ ma ọ bụ ‘Filip hụrụ onwe ya n’Azọt.’
  rationale: Ọnọdụ gbara amaokwu ahụ gburugburu na-egosi ọrụ Chineke siri ike, ma okwu Grik n’onwe ya sịrị ‘a hụrụ.’ Nsụgharị ahụ na-edobe nghọtahie a pụrụ inwe ma ghara itinye nkọwa ozizi karịrị ihe e dere.
translation_notes:
  register: Igbo ọkọlọtọ, nke oge a ma dị ugwu. E ji ‘ozi ọma’ mee ka εὐαγγελίζω doo ndị nkịtị anya; e zere ịkọwa ọrụ ebube ahụ karịa otú Grik si kwuo ya. Akara nkọwa ala peeji [a] dị n’ahịrị bụ isi.
