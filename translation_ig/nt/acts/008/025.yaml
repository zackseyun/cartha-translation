  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Οἱ μὲν οὖν διαμαρτυράμενοι καὶ λαλήσαντες τὸν λόγον τοῦ κυρίου ⸀ὑπέστρεφον εἰς ⸀Ἱεροσόλυμα, πολλάς τε κώμας τῶν Σαμαριτῶν ⸀εὐηγγελίζοντο.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/025.yaml
  text: So[a], after they had solemnly testified and spoken the word of the Lord, they were returning to Jerusalem[b], and were proclaiming the good news in many Samaritan villages.
translation:
  language: ig
  text: Ya mere, mgbe ha gbachara ama n’ụzọ siri ike ma kwuo okwu Onyenwe anyị, ha nọ na-alaghachi Jerusalem, na-ekwusakwa ozi ọma n’ọtụtụ obodo nta ndị Sameria.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διαμαρτυράμενοι
  choice: mgbe ha gbachara ama n'ụzọ siri ike
  rationale: Nke a na-egosipụta ịdị arọ na nkwusi ike dị n'omume ịgba ama ahụ, ma ọ naghị atụgharị ya ka ọ bụrụ naanị ịdọ aka ná ntị.
- source_word: λαλήσαντες
  choice: ma kwusaa
  rationale: N'ọnọdụ a, ebe ihe ha kwuru bụ ‘okwu Onyenwe anyị,’ ‘kwusaa’ bụ Igbo doro anya ma kwekọọ n'omume ikwupụta ozi ahụ.
- source_word: τὸν λόγον τοῦ κυρίου
  choice: okwu Onyenwe anyị
  rationale: ‘Okwu’ na-edobe okwu λόγος n'ụzọ e ji ya eme ihe n'Agba Ọhụrụ, ebe ‘Onyenwe anyị’ na-egosipụta κύριος n'enweghị ịkọwapụta onye a na-ekwu maka ya karịa ihe odide ahụ.
- source_word: ὑπέστρεφον
  choice: ha nọ na-alaghachi
  rationale: Ụdị imperfect na-egosi omume nọ na-aga n'ihu; ‘nọ na-alaghachi’ na-edobe akụkụ a.
- source_word: Ἱεροσόλυμα
  choice: Jeruselem
  rationale: Nke a bụ aha obodo ahụ n'ụdị Igbo a na-ejikarị eme ihe.
- source_word: πολλάς τε κώμας τῶν Σαμαριτῶν
  choice: n'ọtụtụ obodo nta ndị Sameria
  rationale: Nke a na-akọwa obodo nta ndị ahụ dị ka nke ndị Sameria ma na-ada nke ọma n'Igbo ugbu a.
- source_word: εὐηγγελίζοντο
  choice: na-ekwusakwa ozi ọma
  rationale: Ụdị imperfect na-egosi omume na-aga n'ihu; ‘ikwusa ozi ọma’ bụ okwu Igbo doro anya nke na-ezere mkpụrụokwu ụka siri ike.
theological_decisions:
- issue: Onye plural subject ahụ na-ezo aka na ya
  choice: E debere ya dịka ‘ha’
  alternative: Ịkpọ Pita na Jọn aha kpọmkwem
  rationale: Ọnọdụ gbara ama na-egosi Pita na Jọn, ma ihe odide Grik nke amaokwu a enweghị aha ha; ya mere ntụgharị ahụ etinyeghị aha ndị na-adịghị n'amaokwu ahụ.
translation_notes:
  register: Asụsụ ahụ bụ Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E debere omume abụọ nke imperfect dịka omume na-aga n'ihu, ma e jiri njikọ ‘-kwa’ mee ka ahịrịokwu ahụ daa nke ọma.
