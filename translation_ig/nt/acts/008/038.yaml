review_pass:
  verdict: revise
  source_fidelity: 'The main sequence and participants are retained: the eunuch orders the chariot stopped, both men go down into the water, and Philip baptizes him. However, ‘ọnaozi’ means a messenger/agent and does not render εὐνοῦχος (‘eunuch’); the established Standard Igbo biblical term ‘onozi’ should be used. The footnote’s proposed alternative (‘ka ọ kwụsị n’akụkụ mmiri’) alters the clause and does not represent the lexical alternative for εἰς τὸ ὕδωρ.'
  naturalness: The revised wording uses clear, contemporary Standard Igbo. ‘Filip wee baptizim ya’ is direct and natural in biblical register, and placing the alternative-reading marker on ‘mmiri’ correctly identifies the phrase it discusses.
  terminology: Use ‘onozi’ for εὐνοῦχος, preserving the conventional Igbo biblical term without reducing the man to a generic court official or messenger. Retain ‘baptizim’ rather than an interpretation of baptismal mode.
  issues:
  - severity: high
    issue: ‘ọnaozi ahụ’ is not an accurate term for εὐνοῦχος.
    rationale: ‘Ọnaozi/onye ozi’ denotes a messenger or envoy. The Greek term is ‘eunuch’; Standard Igbo biblical usage ‘onozi’ preserves that referent.
  - severity: medium
    issue: The footnote gives an incorrect alternative and is anchored to the wrong words.
    rationale: The alternative concerns εἰς τὸ ὕδωρ (‘into/to the water’), not the command for the chariot to stop. ‘Ka ọ kwụsị n’akụkụ mmiri’ introduces ‘beside the water’ and changes the syntax.
  revised_text: O wee nye iwu ka ụgbọ ịnyịnya ahụ kwụsị. Ha abụọ, Filip na onozi ahụ, wee rịdata banye n’ime mmiri[a], Filip wee baptizim ya.
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “gaa na mmiri”; ma okwu mbu ụzọ Grik εἰς na-egosikarị mmegharị ịbanye n’ime mmiri.
    reason: lexical_alternative
  revision_rationale: The revision corrects the referent of εὐνοῦχος to ‘onozi,’ retains the explicit movement expressed by κατέβησαν ... εἰς τὸ ὕδωρ, and preserves βαπτίζω as ‘baptizim’ without specifying a baptismal mode. The footnote is moved to the water phrase and revised so that it presents only the genuine directional alternative.
