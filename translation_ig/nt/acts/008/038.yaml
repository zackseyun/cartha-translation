id: ACT.8.38
reference: Acts 8:38
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἐκέλευσεν στῆναι τὸ ἅρμα, καὶ κατέβησαν ἀμφότεροι εἰς τὸ ὕδωρ ὅ τε Φίλιππος καὶ ὁ εὐνοῦχος, καὶ ἐβάπτισεν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/038.yaml
  text: And he ordered the chariot to stop[a], and both Philip and the eunuch went down into the water, and he baptized him.
translation:
  language: ig
  text: O wee nye iwu ka ụgbọ ịnyịnya ahụ kwụsị. Ha abụọ, Filip na onozi ahụ, wee rịdata banye n’ime mmiri[a], Filip wee baptizim ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “gaa na mmiri”; ma okwu mbu ụzọ Grik εἰς na-egosikarị mmegharị ịbanye n’ime mmiri.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκέλευσεν
  choice: nye iwu
  rationale: Nke a na-egosi iwu e nyere n’ụzọ doro anya ma bụrụkwa okwu Igbo a na-eji eme ihe ugbu a.
- source_word: στῆναι τὸ ἅρμα
  choice: ka ụgbọ ịnyịnya ahụ kwụsị
  rationale: N’ebe a, infinitive ahụ pụtara ime ka ụgbọ ahụ kwụsị; nsụgharị a bụ Igbo eke maka ụgbọala ma ọ bụ ụgbọ njem.
- source_word: ἅρμα
  choice: ụgbọ ịnyịnya
  rationale: Nke a na-egosi ụdị ụgbọ nke anụmanụ na-adọkpụ, ma na-ezere ịkọwa kpọmkwem ụdị ụgbọ ahụ karịa ihe okwu Grik kwuru.
- source_word: κατέβησαν
  choice: rịdata
  rationale: Okwu a na-echekwa echiche nke isi n’ebe dị elu rịda ala.
- source_word: ἀμφότεροι
  choice: ha abụọ
  rationale: Ọ na-eme ka o doo anya na mmadụ abụọ ahụ sonyere n’ịrịdata ahụ.
- source_word: εἰς τὸ ὕδωρ
  choice: banye na mmiri
  rationale: εἰς na-egosikarị mmegharị na-abanye n’ime ebe; ‘banye na mmiri’ na-echekwa ntụziaka ahụ n’Igbo eke.
- source_word: ὅ τε Φίλιππος καὶ ὁ εὐνοῦχος
  choice: Filip na ọnaozi ahụ
  rationale: Aha mmadụ abụọ ahụ ka e kwuru kpọmkwem, ebe ‘ha abụọ’ chekwara nkwusi ike nke ἀμφότεροι na usoro τε ... καί.
- source_word: εὐνοῦχος
  choice: ọnaozi
  rationale: ‘Ọnaozi’ bụ okwu Igbo a na-eji maka nwoke a pịrị amụ, ma ọ bụ ọnaozi eze n’ọnọdụ ụfọdụ; ebe a ọ na-echekwa aha e ji mara nwoke ahụ n’akụkọ a n’enweghị ịgbanwe ya naanị ka ọ bụrụ onyeisi ụlọikpe.
- source_word: ἐβάπτισεν
  choice: mee ya baptizim
  rationale: Nke a bụ ụzọ Igbo a maara nke ọma isi kwuo βαπτίζω, ma ọ naghị etinye nkọwa otu ụka banyere usoro baptizim.
- source_word: αὐτόν
  choice: ya
  rationale: Nnọchiaha a na-ezo aka n’ọnaozi ahụ dịka onye Filip mere baptizim.
theological_decisions:
- issue: Ma nsụgharị ahụ ò kwesịrị ikpebi usoro e ji mee baptizim
  choice: Chekwaa ‘banye na mmiri’ na ‘mee ya baptizim’ n’enweghị ịgbakwunye na e mikpuru ya ma ọ bụ na e fesa ya mmiri.
  alternative: Ịsụgharị βαπτίζω dịka ‘mikpuru ya’ ma ọ bụ ime ka εἰς bụrụ naanị ‘gaa n’akụkụ mmiri.’
  rationale: Grik kwuru na ha abụọ rịdata banye na mmiri nakwa na Filip mere nwoke ahụ baptizim. Nsụgharị ahụ kwesịrị idebe ihe ndị a ma ghara ikpebi esemokwu ụka nke amaokwu ahụ n’onwe ya na-akọwaghị.
translation_notes:
  register: Standard Igbo dị ugbu a, nke dị nsọ ma doo ndị nkịtị anya. E ji usoro ahịrịokwu eke mee ihe, ma e chekwara nkwusi ike na mmadụ abụọ ahụ rịdata na ntụziaka nke εἰς n’enweghị ịkwado ozizi otu ụka.
