revisions:
- from: O wee nye iwu ka ụgbọ ịnyịnya ahụ kwụsị[a]. Ha abụọ, Filip na ọnaozi ahụ, wee rịdata banye na mmiri, Filip wee mee ya baptizim.
  to: O wee nye iwu ka ụgbọ ịnyịnya ahụ kwụsị. Ha abụọ, Filip na onozi ahụ, wee rịdata banye n’ime mmiri[a], Filip wee baptizim ya.
  rationale: The revision corrects the referent of εὐνοῦχος to ‘onozi,’ retains the explicit movement expressed by κατέβησαν ... εἰς τὸ ὕδωρ, and preserves βαπτίζω as ‘baptizim’ without specifying a baptismal mode. The footnote is moved to the water phrase and revised so that it presents only the genuine directional alternative.
