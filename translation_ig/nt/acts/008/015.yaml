  text: οἵτινες καταβάντες προσηύξαντο περὶ αὐτῶν ὅπως λάβωσιν πνεῦμα ἅγιον·
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/015.yaml
  text: who came down and prayed for them so that they might receive the Holy Spirit[a][b].
translation:
  language: ig
  text: ndị gbadatara[a][b] wee kpee ekpere maka ha, ka ha wee nata Mmụọ Nsọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị ndị, mgbe ha gbadatara, kpeere ha ekpere maka ha.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ndị ndị kpeere ha ekpere maka ha mgbe ha gbadatara.”
    reason: previous_rendering
lexical_decisions:
- source_word: οἵτινες
  choice: ndị
  rationale: Ọ na-ezo aka na Pita na Jọn ndị a kpọrọ aha n’amaokwu bu ụzọ, ma na-ejikọta okwu a dị ka nkebiokwu na-akọwa ha.
- source_word: καταβάντες
  choice: gbadatara
  rationale: Participul aorist a na-egosi omume mere tupu ma ọ bụ jikọrọ ya n’usoro na isi ngwaa; njikọ “gbadatara wee” na-egosi usoro omume ahụ n’Igbo dị mfe ma dị ndụ.
- source_word: προσηύξαντο
  choice: kpee ekpere
  rationale: Nke a bụ ụzọ Igbo nkịtị na nke doro anya si ekwu προσεύχομαι; ọdịdị middle nke Grik adịghị achọ mgbakwunye pụrụ iche ebe a.
- source_word: περὶ αὐτῶν
  choice: maka ha
  rationale: N’ebe a περί tinyere genitive na-egosi ikpe ekpere n’ihi ma ọ bụ n’aha mmadụ; “maka ha” na-egosipụta nke ahụ n’Igbo nkịtị.
- source_word: ὅπως
  choice: ka ... wee
  rationale: Usoro a na-egosi ebumnuche nke ekpere ahụ n’Igbo n’enweghị ime ka ihe e bu n’obi bụrụ ihe e kwere nkwa na ọ ghaghị ime.
- source_word: λάβωσιν
  choice: nata
  rationale: “Nata” na-egosipụta echiche nke ịnweta ihe e nyere, dabara nke ọma na λάβωσιν n’ọnọdụ a.
- source_word: πνεῦμα ἅγιον
  choice: Mmụọ Nsọ
  rationale: N’akụkọ Ọrụ Ndị Ozi, okwu a na-ezo aka na Mmụọ Nsọ nke Chineke; mkpụrụedemede ukwu na-eme ka onye a na-ezo aka doo anya n’Igbo.
theological_decisions:
- issue: Ma πνεῦμα ἅγιον ọ̀ bụ mmụọ dị nsọ n’ozuzu ya ka ọ bụ Mmụọ Nsọ nke Chineke
  choice: Mmụọ Nsọ
  alternative: mmụọ dị nsọ
  rationale: Ọnọdụ akụkọ a n’Ọrụ Ndị Ozi na-egosi na ọ bụ Mmụọ Nsọ e kwere ndị kwere ekwe nkwa ka a na-ekwu maka ya. Nhọrọ a na-egosipụta onye okwu ahụ na-ezo aka n’etinyeghị nkọwa ozizi ọzọ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta mee ya. “Gbadatara wee kpee” na-eme ka usoro omume abụọ ahụ gaa were were, ebe ndetu ala peeji na-echekwa ụzọ e nwere ike isi gosi participul Grik ahụ dịka nkebiokwu oge.
