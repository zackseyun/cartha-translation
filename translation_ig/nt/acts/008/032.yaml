id: ACT.8.32
reference: Acts 8:32
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἡ δὲ περιοχὴ τῆς γραφῆς ἣν ἀνεγίνωσκεν ἦν αὕτη· Ὡς πρόβατον ἐπὶ σφαγὴν ἤχθη, καὶ ὡς ἀμνὸς ἐναντίον τοῦ ⸀κείραντος αὐτὸν ἄφωνος, οὕτως οὐκ ἀνοίγει τὸ στόμα αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/032.yaml
  text: 'The passage of Scripture that he was reading was this: “Like a sheep he was led to slaughter[a], and like a lamb before the one shearing it is silent[b], so he does not open his mouth.”'
translation:
  language: ig
  text: 'Akụkụ Akwụkwọ Nsọ ọ nọ na-agụ bụ nke a: “Dị ka atụrụ, e duuru ya gaa ka e gbuo ya[a]; dịkwa ka nwa atụrụ si agba nkịtị n’ihu onye na-akpacha ya ajị[b], otu ahụ ka ọ na-adịghị emeghe ọnụ ya.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “gaa n’ebe a ga-egbu ya.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “n’ihu onye na-akpacha ajị”; n’asụsụ Grik, ọ bụ kpọmkwem “n’ihu onye na-akpacha ya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: περιοχὴ
  choice: Akụkụ
  rationale: N’ebe a, okwu ahụ pụtara otu akụkụ a kapịrị ọnụ nke Akwụkwọ Nsọ a na-agụ; “akụkụ” bụ okwu Igbo doro anya ma bụrụkwa nke e ji eme ihe ugbu a.
- source_word: γραφῆς
  choice: Akwụkwọ Nsọ
  rationale: N’ọnọdụ a, γραφή na-ezo aka n’ihe odide dị nsọ, ọ bụghị naanị ihe odide nkịtị.
- source_word: ἀνεγίνωσκεν
  choice: ọ nọ na-agụ
  rationale: Ụdị imperfect na-egosi omume gara n’ihu n’oge gara aga; “ọ nọ na-agụ” na-echekwa echiche ahụ.
- source_word: Ὡς πρόβατον
  choice: Dị ka atụrụ
  rationale: Ọ na-echekwa ntụnyere ahụ n’Igbo dị mfe ma kwekọọ n’ụdị isi mmalite.
- source_word: ἐπὶ σφαγὴν ἤχθη
  choice: e duuru ya gaa ka e gbuo ya
  rationale: Nke a na-egosi ma idu ya gaa ma ebumnuche nke igbu ya, n’ụzọ Igbo na-ada nke ọma.
- source_word: ἀμνὸς
  choice: nwa atụrụ
  rationale: Ọ na-echekwa ọdịiche dị n’etiti πρόβατον, atụrụ n’ozuzu, na ἀμνός, nwa atụrụ.
- source_word: ἐναντίον τοῦ κείραντος αὐτὸν
  choice: n’ihu onye na-akpacha ya ajị
  rationale: Nke a na-egosipụta onye nọ na-akpacha ajị nwa atụrụ ahụ, ma mee ka ihe participle Grik ahụ pụtara doo onye Igbo anya.
- source_word: ἄφωνος
  choice: si agba nkịtị
  rationale: N’ime ntụnyere a, ihe ọ pụtara bụ ịnọ jụụ n’emeghị ụda; “agba nkịtị” bụ Igbo ebumpụta ụwa.
- source_word: οὕτως οὐκ ἀνοίγει τὸ στόμα αὐτοῦ
  choice: otu ahụ ka ọ na-adịghị emeghe ọnụ ya
  rationale: “Otu ahụ” na-eweta nkwubi okwu ntụnyere ahụ, ebe “ọ na-adịghị emeghe” na-echekwa present tense dị ndụ nke ihe e hotara.
theological_decisions:
- issue: Ihe e hotara n’Aịzaya 53 nke akụkọ gbara ya gburugburu metụtara Jizọs
  choice: E debere ihe e hotara dịka ntụnyere ahụ si dị, n’etinyeghị aha Jizọs n’amaokwu a.
  alternative: Ịkọwa ya ozugbo dịka Jizọs, Ohu ahụ na-ata ahụhụ.
  rationale: Akụkọ gbara amaokwu ahụ gburugburu na-eme ka onye a na-ekwu banyere ya pụta ìhè, ma amaokwu a n’onwe ya bụ naanị ihe e hotara n’Akwụkwọ Nsọ. Ịhapụ ya otu a na-echekwa usoro na esemokwu nkọwa nke isi mmalite.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ugwu ma dị mfe nghọta. E ji “ajị” mee ka ihe a na-akpacha doo anya n’Igbo, ebe nkọwa ala peeji na-echekwa ọdịdị okwu Grik. E tinyere akara ala peeji [a] na [b] n’ahịrị isi.
