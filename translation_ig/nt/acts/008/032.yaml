  naturalness: Ọ bụ Standard Igbo doro anya, nke na-ada n’ụzọ ebumpụta ụwa ma kwesị ekwesị maka ide Akwụkwọ Nsọ. «na-akpacha ya ajị» na «si agba nkịtị» dabara n’ọnọdụ atụnyere ahụ.
  terminology: «Akwụkwọ Nsọ», «atụrụ», «nwa atụrụ», na «ajị» dabara adaba. E tinyeghị nkọwa Kraịst ma ọ bụ nkuzi ọ bụla n’ime okwu e hotara, ya mere amaokwu ahụ na-edobe oke ya dịka ihe e hotara n’Aịzaya.
