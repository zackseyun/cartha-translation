id: ACT.8.21
reference: Acts 8:21
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οὐκ ἔστιν σοι μερὶς οὐδὲ κλῆρος ἐν τῷ λόγῳ τούτῳ, ἡ γὰρ καρδία σου οὐκ ἔστιν εὐθεῖα ⸀ἔναντι τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/021.yaml
  text: You have neither part nor share in this matter, because your heart is not right before God.
translation:
  language: ig
  text: I nweghị oke ma ọ bụ òkè n'okwu a, n'ihi na obi gị adịghị ziri ezi n'ihu Chineke.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μερὶς οὐδὲ κλῆρος
  choice: oke ma ọ bụ òkè
  rationale: E ji okwu abụọ dị nso chekwaa nkwughachi nke Grik, nke na-ekwusi ike na onye ahụ enweghị akụkụ ma ọ bụ òkè n'okwu ahụ.
- source_word: ἐν τῷ λόγῳ τούτῳ
  choice: n'okwu a
  rationale: N'ebe a λόγος na-ezo aka n'okwu ma ọ bụ ihe a na-atụle, ya mere ‘okwu a’ bụ nsụgharị Igbo doro anya ma hapụkwa obosara ihe ọ pụtara.
- source_word: ἡ καρδία σου
  choice: obi gị
  rationale: ‘Obi’ na-echekwa ihe atụ nke isi mmalite banyere ọnọdụ ime mmadụ.
- source_word: οὐκ ἔστιν εὐθεῖα
  choice: adịghị ziri ezi
  rationale: Nke a na-enye echiche nke ‘ịghara ịdị kwụ ọtọ/ziri ezi’ n'Igbo nkịtị ma dị ùgwù.
- source_word: ἔναντι τοῦ θεοῦ
  choice: n'ihu Chineke
  rationale: Nsụgharị a na-echekwa echiche nke ọnọdụ mmadụ n'anya ma ọ bụ n'ihu Chineke.
theological_decisions:
- issue: Ihe ‘oke’ na ‘òkè’ pụtara
  choice: E chekwara okwu abụọ ahụ n'enweghị ịkọwa ha dịka ọkwa ụka, nzọpụta, ma ọ bụ onyinye mmụọ kpọmkwem.
  alternative: Ịsụgharị ya n'ụzọ na-akọwa otu ozizi kpọmkwem, dịka ‘ị nweghị ọnọdụ n'ozi a.’
  rationale: Amaokwu ahụ n'onwe ya anaghị ekpebi n'ụzọ zuru ezu ụdị òkè a; nsụgharị ahụ kwesịrị ichekwa obosara na esemokwu nke okwu Grik.
- issue: Ọnọdụ obi n'ihu Chineke
  choice: ‘obi gị adịghị ziri ezi n'ihu Chineke’
  alternative: ‘Chineke anaghị anabata obi gị.’
  rationale: Nhọrọ ahụ na-esochi okwu isi mmalite ma ghara ịgbakwunye nkwubi okwu banyere nnabata Chineke karịa ihe ederede kwuru.
translation_notes:
  register: Standard Igbo dị ugbu a, dị mfe nghọta ma nwee ùgwù. Ahịrịokwu ahụ na-ejigide usoro nkwusi ike nke isi mmalite ma zere nkọwa okpukpe agbakwunyere.
