review_pass:
  verdict: revise
  source_fidelity: The draft conveys Peter’s adversative reply, the optative imprecation, the concrete term ‘silver,’ destruction, God’s gift, and acquisition by means of money. However, ‘a pụrụ iji ego nweta’ makes the acquisition impersonal (‘it can be acquired’) rather than retaining the addressee as the one who thought he could acquire it. The revision restores that relation explicitly.
  naturalness: ‘Ka ọlaọcha gị na gị laa n’iyi’ is a natural, forceful Standard Igbo imprecatory formulation and directly expresses σὺν σοὶ. ‘I chere na i nwere ike iji ego nweta’ is clear modern Igbo and follows the Greek construction naturally.
  terminology: ‘Ọlaọcha,’ ‘laa n’iyi,’ ‘onyinye Chineke,’ and ‘ego’ are appropriate. The wording does not over-specify ἀπώλεια as eternal condemnation or make κτᾶσθαι exclusively ‘buy.’
  issues:
  - severity: medium
    issue: Footnote anchors do not attach to the terms addressed by their notes.
    rationale: Note [a] explains ‘ọlaọcha’ but is anchored after ‘laa n’iyi’; note [b] explains ‘nweta’/‘ịzụta’ but is anchored after ‘onyinye Chineke.’ Relocating them makes the audit notes usable without altering meaning.
  - severity: medium
    issue: The addressee’s prospective acquisition is made impersonal.
    rationale: The Greek has ἐνόμισας ... κτᾶσθαι, ‘you thought [you could] acquire.’ ‘a pụrụ ... nweta’ means broadly that acquisition is possible. ‘i chere na i nwere ike ... nweta’ preserves Simon as the understood acquirer.
  revised_text: Ma Pita sịrị ya, “Ka ọlaọcha gị[a] na gị laa n’iyi, n’ihi na i chere na i nwere ike iji ego nweta onyinye Chineke[b].”
  revised_footnotes:
