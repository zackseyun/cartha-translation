  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Πέτρος δὲ εἶπεν πρὸς αὐτόν· Τὸ ἀργύριόν σου σὺν σοὶ εἴη εἰς ἀπώλειαν ὅτι τὴν δωρεὰν τοῦ θεοῦ ἐνόμισας διὰ χρημάτων κτᾶσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/020.yaml
  text: But Peter said to him[a], “May your silver perish with you[b], because you thought you could acquire the gift of God with money.”
translation:
  language: ig
  text: Ma Pita sịrị ya, “Ka ọlaọcha gị[a] na gị laa n’iyi, n’ihi na i chere na i nwere ike iji ego nweta onyinye Chineke[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Ka ego gị na gị laa na mbibi.” N’asụsụ Grik, “ọlaọcha” bụkwa okwu a na-ejikarị ekwu maka ego.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsị “ịnata” ma ọ bụ “ịzụta.” Ihe ọ pụtara bụ na Saịmọn lere onyinye Chineke anya dị ka ihe a pụrụ inweta site n’ịkwụ ego.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀργύριόν
  choice: ọlaọcha
  rationale: Okwu Grik ahụ pụtara ọlaọcha ma ọ bụ ego ọlaọcha. ‘Ọlaọcha’ na-edobe ihe atụ doro anya nke isi mmalite ahụ, ebe ‘ego’ dị n'ikpeazụ na-egosi n'ụzọ nkịtị na ihe a na-ekwu bụ akụ e ji akwụ ụgwọ.
- source_word: σὺν σοὶ
  choice: soro gị
  rationale: Nke a na-egosi na a kpọkọtara Saịmọn na ọlaọcha ya ọnụ n'okwu ikpe ahụ.
- source_word: εἴη εἰς ἀπώλειαν
  choice: ka ... laa n’iyi
  rationale: Ụdị optative εἴη na-egosi ọchịchọ ma ọ bụ okwu ikpe siri ike. ‘Ka ... laa n’iyi’ na-edobe ike ahụ n'Igbo dị ugbu a n'etinyeghị ozizi pụrụ iche banyere ikpe ebighị ebi.
- source_word: δωρεὰν
  choice: onyinye
  rationale: ‘Onyinye’ bụ okwu Igbo doro anya maka ihe e nyere mmadụ, ọ na-emekwa ka ọdịiche dị n'etiti onyinye Chineke na ihe a pụrụ iji ego zụta pụta ìhè.
- source_word: ἐνόμισας
  choice: i chere
  rationale: Nke a bụ ntụgharị nkịtị ma doo anya nke echiche ‘iche’ ma ọ bụ ‘ịtụ anya na ihe dị otu a.’
- source_word: διὰ χρημάτων
  choice: iji ego
  rationale: διά tinyere genitive na-egosi ụzọ e si eme ihe; ‘iji ego’ bụ usoro okwu Igbo kachasị eke n'ebe a.
- source_word: κτᾶσθαι
  choice: nweta
  rationale: ‘Inweta’ na-egosi ịba n'ihe ma ọ bụ ịghọ onye nwere ya, ma ọ naghị eme ka ngwaa ahụ pụta kpọmkwem dị ka ‘ịzụta’; echiche ịkwụ ụgwọ apụtalarị n'okwu ‘iji ego.’
- source_word: δὲ
  choice: Ma
  rationale: δέ na-egosi ntụgharị megide arịrịọ Saịmọn dị n'amaokwu bu ụzọ; ‘Ma’ na-egosipụta ọdịiche ahụ nke ọma.
theological_decisions:
- issue: Ike okwu Pita banyere Saịmọn na ọlaọcha ya
  choice: 'A tụgharịrị ya dị ka ọchịchọ ma ọ bụ okwu ikpe nke ịla n’iyi: ‘Ka ọlaọcha gị soro gị laa n’iyi.’'
  alternative: A pụrụ ịghọta ya dị ka amụma kpọmkwem banyere mbibi, ma ọ bụ mee ya ka ọ bụrụ okwu siri ike banyere ikpe ebighị ebi.
  rationale: Optative εἴη kwadoro ọchịchọ ma ọ bụ nkwupụta ikpe karịa nanị amụma. Nsụgharị a na-edobe ịdị njọ nke ịba mba ahụ n'ekwughị kpọmkwem na ọ bụ ikpe ebighị ebi, nke okwu Grik ahụ n'onwe ya na-akọwaghị.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị nsọ ma dịkwa mfe nghọta. ‘Laa n’iyi’ na-enye okwu ahụ ike n'enweghị okwu nkwenkwe pụrụ iche. Etinyere akara ndetu [a] na [b] n'ahịrịokwu bụ isi.
