- from: Ma Pita sịrị ya, “Ka ọlaọcha gị soro gị laa n’iyi[a], n’ihi na i chere na a pụrụ iji ego nweta onyinye Chineke[b].”
  to: Ma Pita sịrị ya, “Ka ọlaọcha gị[a] na gị laa n’iyi, n’ihi na i chere na i nwere ike iji ego nweta onyinye Chineke[b].”
  rationale: The revision preserves the Greek optative as an imprecation, keeps the lexical contrast between ‘silver’ and ‘money,’ explicitly retains Simon as the one who imagined he could acquire God’s gift, and places each footnote marker at its relevant word or expression. No disputed textual or doctrinal claim is introduced.
