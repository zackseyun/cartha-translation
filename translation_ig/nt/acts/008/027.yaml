  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἀναστὰς ἐπορεύθη, καὶ ἰδοὺ ἀνὴρ Αἰθίοψ εὐνοῦχος δυνάστης ⸀Κανδάκης βασιλίσσης Αἰθιόπων, ὃς ἦν ἐπὶ πάσης τῆς γάζης αὐτῆς, ὃς ἐληλύθει προσκυνήσων εἰς Ἰερουσαλήμ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/027.yaml
  text: So he got up and went[a]. And behold, an Ethiopian man, a eunuch, a high official of Candace, queen of the Ethiopians, who was over all her treasury, had come to Jerusalem to worship[b],
translation:
  language: ig
  text: O biliri gaa. Lee, otu nwoke onye Etiopia, onye e biri amụ[a], onye ọchịchị dị elu nke Kandake, eze nwaanyị ndị Etiopia[b], onye na-ahụ maka akụ ya niile, bịara Jerusalem ife ofufe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Okwu Grik a nwekwara ike ịpụta “onye ọrụ n'obí eze”; ma n'ebe a, ihe ọ pụtara n'ụzọ nkịtị, “onye e biri amụ,” yikarịrị ka e bu n'obi.
    reason: lexical_alternative
  - marker: b
    text: “Kandake” nwere ike ịbụ utu aha eze nwaanyị nke usoro ndị eze, ọ bụghị aha nke onwe ya.
    reason: cultural_note
lexical_decisions:
- source_word: ἀναστὰς ἐπορεύθη
  choice: o biliri gaa
  rationale: Na-echekwa usoro omume nke participle na ngwaa bụ isi n'Igbo dị mfe ma bụrụkwa nke eke.
- source_word: ἰδοὺ
  choice: Ma lee
  rationale: Na-egosipụta okwu e ji adọta uche n'akụkọ Luk n'ụzọ dị ugwu ma doo anya.
- source_word: ἀνὴρ Αἰθίοψ
  choice: otu nwoke onye Etiopia
  rationale: Na-echekwa ma njirimara nwoke ahụ ma agbụrụ/ebe o si, dịka Grik si kwuo kpọmkwem.
- source_word: εὐνοῦχος
  choice: onye ọnaozi
  rationale: Okwu a na-egosi nwoke e biri amụ; ọ bụ isi nghọta okwu Grik ebe a, ebe δυνάστης na-egosikwa ọkwa ọchịchị ya.
- source_word: δυνάστης
  choice: onye nọ n'ọkwa dị elu
  rationale: Na-egosi na ọ bụ onye nwere ikike dị ukwuu n'obí eze, na-enweghị ịkpọ ya onye ọchịchị n'onwe ya.
- source_word: Κανδάκης βασιλίσσης Αἰθιόπων
  choice: n'okpuru Kandake, eze nwaanyị ndị Etiopia
  rationale: Na-edobe aha/utu aha Kandake ma na-agbaso ethnonym ọtụtụ nke Grik.
- source_word: ἐπὶ πάσης τῆς γάζης αὐτῆς
  choice: onye na-elekọta akụ ya niile
  rationale: Na-egosipụta ọrụ nlekọta ya na akụ eze nwaanyị n'Igbo eke karịa ntụgharị okwu n'usoro Grik.
- source_word: ἐληλύθει προσκυνήσων εἰς Ἰερουσαλήμ
  choice: bịara Jeruselem ife ofufe
  rationale: Na-echekwa omume gara aga na ebumnuche njem ahụ n'usoro Igbo doro anya.
theological_decisions:
- issue: Ma a ga-atụgharị εὐνοῦχος dịka nwoke e biri amụ ka ọ bụ naanị onye ọrụ eze
  choice: onye ọnaozi
  alternative: onye ọrụ n'obí eze
  rationale: Isi nghọta lexical bụ nwoke e biri amụ, ma δυνάστης egosilarị na ọ bụ onye nọ n'ọkwa ọchịchị. Ihe ọzọ o nwere ike ịpụta ka edebere n'okpuru amaokwu.
translation_notes:
  register: Igbo ọkọlọtọ, nke oge a ma dị ugwu. E ji “onye ọnaozi” kọwaa eunuch n'ụzọ dị nkenke; akara nkọwa [a] na [b] dị n'ahịrịokwu ahụ n'ebe ha metụtara.
