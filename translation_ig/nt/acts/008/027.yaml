revisions:
- from: Ya mere, o biliri gaa.[a] Ma lee, otu nwoke onye Etiopia, onye ọnaozi, onye nọ n'ọkwa dị elu n'okpuru Kandake, eze nwaanyị ndị Etiopia,[b] onye na-elekọta akụ ya niile, bịara Jeruselem ife ofufe.
  to: O biliri gaa. Lee, otu nwoke onye Etiopia, onye e biri amụ[a], onye ọchịchị dị elu nke Kandake, eze nwaanyị ndị Etiopia[b], onye na-ahụ maka akụ ya niile, bịara Jerusalem ife ofufe.
  rationale: The revision removes the unsupported inference, corrects the central lexical rendering of εὐνοῦχος, and makes the official’s connection to Kandake precise. It retains the Greek narrative emphasis, the plural ethnonym’s sense (“ndị Etiopia”), and the pilgrimage purpose without adding interpretive claims.
  reviewer_model: gpt-5.6-terra
