  text: ὡς δὲ ἐπορεύοντο κατὰ τὴν ὁδόν, ἦλθον ἐπί τι ὕδωρ, καί φησιν ὁ εὐνοῦχος· Ἰδοὺ ὕδωρ, τί κωλύει με ⸀βαπτισθῆναι;
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/036.yaml
  text: And as they were going along the road, they came to some water, and the eunuch says, “Look, water! What prevents me from being baptized?”
translation:
  language: ig
  text: Ka ha na-aga n’ụzọ, ha bịarutere n’otu ebe mmiri dị, onye ọnaozi ahụ sịrị, “Lee, mmiri! Gịnị na-egbochi ka e mee m baptizim?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ εὐνοῦχος
  choice: ozi ahụ e biri amụ
  rationale: “Ozi” na-egosi onye nọ n’ọrụ eze dịka ihe gbara ya gburugburu si kọwaa, ebe “e biri amụ” na-eburu isi nghọta anụahụ nke εὐνοῦχος n’ụzọ ndị na-agụ Igbo taa ga-aghọta.
- source_word: φησιν
  choice: sịrị
  rationale: Ọ bụ ezie na Grik ji present nke akụkọ (“ọ na-ekwu”), Igbo na-akọkarị ihe mere eme n’ụdị gara aga; “sịrị” na-ada nke ọma ma na-echekwa ọrụ okwu ahụ n’akụkọ.
- source_word: τι ὕδωρ
  choice: n’ebe mmiri dị
  rationale: Nke a na-egosi na ha rutere n’otu ebe e nwere mmiri, n’enweghị ịkọwa ụdị ma ọ bụ oke mmiri ahụ karịa ihe Grik kwuru.
- source_word: βαπτισθῆναι
  choice: ime m baptizim
  rationale: 'Na-egosi passive infinitive ahụ n''ụzọ Igbo nkịtị: ka onye ọzọ mee ya baptizim, ọ bụghị na ọ ga-eme onwe ya baptizim.'
theological_decisions:
- issue: Ihe nwere ike igbochi baptizim
  choice: “Gịnị na-egbochi ime m baptizim?”
  alternative: “Ọ dị ihe na-egbochi ime m baptizim?”
  rationale: Ajụjụ “Gịnị” na-esochi τί kpọmkwem ma ghara itinye azịza ma ọ bụ ọnọdụ okwukwe ndị amaokwu ndị ọzọ nwere ike ịkọwa.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta. E debere mkparịta ụka ahụ nkenke na ndụ; ejighị okwu ụka pụrụ iche kọwaa ihe ederede ahụ na-ekwughị.
