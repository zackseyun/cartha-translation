  text: τότε ⸀ἐπετίθεσαν τὰς χεῖρας ἐπ’ αὐτούς, καὶ ἐλάμβανον πνεῦμα ἅγιον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/017.yaml
  text: Then they laid their hands on them, and they were receiving the Holy Spirit.
translation:
  language: ig
  text: Mgbe ahụ, ha bikwasịrị ha aka, ha wee na-anata Mmụọ Nsọ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ, n’ụzọ na-esochikwu usoro Grik: “Mgbe ahụ, ha nọ na-ebikwasị ha aka, ha nọkwa na-anata Mmụọ Nsọ.” Ngwaa abụọ ahụ dị n’ụdị imperfect n’asụsụ Grik.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Mgbe ahụ
  rationale: 'Na-egosi oge na usoro akụkọ: ihe a mere mgbe ekpere ndịozi gasịrị.'
- source_word: ἐπετίθεσαν τὰς χεῖρας ἐπ’ αὐτούς
  choice: ha bikwasịrị ha aka
  rationale: Nke a bụ ụzọ Igbo si ekwu omume ibikwasị mmadụ aka; ọ na-eburu onye nwe aka na ndị a bikwasịrị ya n'ụzọ doro anya.
- source_word: ἐλάμβανον
  choice: ha wee na-anata
  rationale: Ụdị ‘na-anata’ na-echekwa ọdịdị imperfect nke Grik, nke na-egosi omume na-aga n’ihu ma ọ bụ na-eme ugboro ugboro n’usoro ahụ, n’etinyeghị echiche ọzọ dịka ‘malitere.’
- source_word: πνεῦμα ἅγιον
  choice: Mmụọ Nsọ
  rationale: N’ebe a na Luk–Ọrụ Ndịozi, okwu ahụ na-ezo aka n’Mmụọ Nsọ nke Chineke; aha a bụkwa okwu Igbo kwụ ọtọ ma dị ebube.
theological_decisions:
- issue: Ma πνεῦμα ἅγιον ọ̀ ga-abụ mmụọ nsọ na-enweghị nkọwa ma ọ bụ Mmụọ Nsọ nke Chineke
  choice: Mmụọ Nsọ
  alternative: otu mmụọ dị nsọ
  rationale: Ihe gbara amaokwu a gburugburu na Luk–Ọrụ Ndịozi na-egosi na onye a na-ekwu maka ya bụ Mmụọ Nsọ nke Chineke, ọ bụghị otu mmụọ ọ bụla dị nsọ.
- issue: Otu e si egosipụta imperfect abụọ ahụ
  choice: Oge gara aga maka ibikwasị aka, tinyere ‘na-anata’ maka nnata
  alternative: ha nọ na-ebikwasị ha aka, ha nọkwa na-anata Mmụọ Nsọ
  rationale: Nke a na-eme ka Igbo dị mfe ma bụrụ nke mmadụ na-asụ, ma na-echekwa ọdịdị omume na-aga n’ihu nke ἐλάμβανον. Ihe odide ala peeji na-egosi nsụgharị nke na-egosipụta imperfect abụọ ahụ n'ụzọ zuru ezu.
translation_notes:
  register: Standard Igbo dị ugbu a, nke a na-aghọta ngwa ngwa ma ka nwee nsọpụrụ kwesịrị ekwesị maka Akwụkwọ Nsọ. E jiri ‘bikwasịrị ha aka’ mee ka ahịrịokwu ahụ bụrụ nke e ji ọnụ ekwu n’Igbo; e jikwara ‘na-anata’ chekwaa ọdịdị imperfect n’enweghị ịmanye nkọwa okpukpe ọzọ.
