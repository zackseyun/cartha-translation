revisions:
- from: Ma Sọl nọ na-ebibi ọgbakọ ahụ[a]. Ọ na-abanye n’ụlọ n’ụlọ[b], na-adọkpụrụ ma ndị ikom ma ndị inyom pụọ, na-enyefekwa ha ka a tụọ ha mkpọrọ.
  to: Ma Sọl nọ na-ebibi ọgbakọ ahụ[a], na-abanye site n’ụlọ ruo n’ụlọ[b], na-adọkpụrụ ma ndị ikom ma ndị inyom, na-enyefe ha ka e tinye ha n’ụlọ mkpọrọ.
  rationale: The revision retains the draft’s strong rendering of λυμαίνομαι and its ongoing aspect, while replacing the potentially sentencing-oriented prison expression with wording that explicitly conveys being handed over for confinement. It also uses a more idiomatic distributive expression for repeated entry into homes and keeps each footnote anchored to the relevant source expression.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T08:29:04Z'
review_pass:
  verdict: revise
  source_fidelity: The draft conveys Saul’s sustained violent action against the believing community, his repeated entry into homes, and the imprisonment of men and women. However, «ka a tụọ ha mkpọrọ» can suggest sentencing them to prison rather than handing them over for confinement. The revised wording more directly reflects παρέδιδου εἰς φυλακήν.
  naturalness: The revised single-sentence construction follows the Greek participial sequence more smoothly. «site n’ụlọ ruo n’ụlọ» is a clear, natural Standard Igbo expression for the distributive sense, and «ka e tinye ha n’ụlọ mkpọrọ» is idiomatic and precise.
  terminology: «Ọgbakọ ahụ» appropriately represents ἐκκλησία here as the community of believers without restricting the sense to a building. «Nọ na-ebibi» preserves the strong, ongoing force of ἐλυμαίνετο; «ụlọ mkpọrọ» clearly communicates φυλακή.
  issues:
  - severity: medium
    issue: «ka a tụọ ha mkpọrọ» is potentially imprecise for εἰς φυλακήν.
    rationale: This expression may be heard as imposing a prison sentence. The Greek says Saul was handing people over into prison/custody, not specifically describing a judicial sentence.
  - severity: low
    issue: The draft divides the Greek’s continuous participial description into two sentences.
    rationale: This is not a meaning error, but retaining one sentence gives a more natural account of the manner and sequence of Saul’s repeated actions.
  revised_text: Ma Sọl nọ na-ebibi ọgbakọ ahụ[a], na-abanye site n’ụlọ ruo n’ụlọ[b], na-adọkpụrụ ma ndị ikom ma ndị inyom, na-enyefe ha ka e tinye ha n’ụlọ mkpọrọ.
