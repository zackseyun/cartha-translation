id: ACT.8.3
reference: Acts 8:3
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Σαῦλος δὲ ἐλυμαίνετο τὴν ἐκκλησίαν κατὰ τοὺς οἴκους εἰσπορευόμενος, σύρων τε ἄνδρας καὶ γυναῖκας παρεδίδου εἰς φυλακήν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/003.yaml
  text: But Saul was ravaging the church[a], entering house after house; dragging off both men and women[b], he was handing them over to prison.
translation:
  language: ig
  text: Ma Sọl nọ na-ebibi ọgbakọ ahụ[a], na-abanye site n’ụlọ ruo n’ụlọ[b], na-adọkpụrụ ma ndị ikom ma ndị inyom, na-enyefe ha ka e tinye ha n’ụlọ mkpọrọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “nọ na-emeso ọgbakọ ahụ ihe ike dị egwu.”
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsị, “n’ụlọ n’ụlọ.” Okwu Grik ahụ na-egosi na ọ na-abanye n’ụlọ dị iche iche otu otu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλυμαίνετο
  choice: nọ na-ebibi
  rationale: “Na-ebibi” na-egosipụta mmebi na mmeso ike dị n’okwu Grik a karịa okwu nkịtị maka mkpagbu; “nọ na-” na-echekwa omume gara n’ihu nke imperfect.
- source_word: ἐκκλησίαν
  choice: ọgbakọ ahụ
  rationale: N’ebe a, okwu ahụ na-ezo aka n’obodo ndị kwere ekwe, ọ bụghị ụlọ ma ọ bụ nzukọ obodo nkịtị.
- source_word: κατὰ τοὺς οἴκους
  choice: n’ụlọ n’ụlọ
  rationale: Nkebi a na-egosipụta ime ihe n’ụlọ dị iche iche otu otu, ya bụ, ịbanye n’ụlọ mgbe ụlọ gasịrị.
- source_word: εἰσπορευόμενος
  choice: Ọ na-abanye
  rationale: Nke a na-egosi ụzọ Sọl si na-ebibi ọgbakọ ahụ, ma mee ka usoro ahịrịokwu ahụ doo anya n’Igbo.
- source_word: σύρων
  choice: na-adọkpụrụ ... pụọ
  rationale: “Na-adọkpụrụ” na-echekwa echiche nke iji ike dọkpụrụ mmadụ; “pụọ” na-egosi na a na-ewepụ ha n’ụlọ ha.
- source_word: ἄνδρας καὶ γυναῖκας
  choice: ma ndị ikom ma ndị inyom
  rationale: Usoro “ma ... ma ...” na-egosipụta nke ọma na mmeso ahụ metụtara ndị ikom nakwa ndị inyom n’enweghị ịkpa oke.
- source_word: παρεδίδου
  choice: na-enyefekwa ha
  rationale: “Na-enyefe” na-egosi inyefe mmadụ n’aka ndị ọchịchị, ebe usoro “na-” na-echekwa omume e mere ugboro ugboro.
- source_word: εἰς φυλακήν
  choice: ka a tụọ ha mkpọrọ
  rationale: Nke a bụ ụzọ Igbo dị ndụ si kwuo na e tinyere ha n’ọnọdụ ịbụ ndị mkpọrọ, ma ọ dabara n’echiche nke inyefe ha n’aka ndị ọchịchị.
theological_decisions:
- issue: Igosipụta oke njọ nke omume Sọl tupu ọ ghọọ onye na-eso ụzọ Kraịst
  choice: nọ na-ebibi ọgbakọ ahụ
  alternative: nọ na-akpagbu ọgbakọ ahụ
  rationale: Okwu Grik λυμαίνομαι siri ike karịa okwu nkịtị pụtara “ịkpagbu”; nsụgharị a na-egosipụta mmebi ike na-aga n’ihu n’etinyeghị nkọwa ozizi ọzọ n’ime amaokwu ahụ.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. “Ọgbakọ” na-ezere ime ka ἐκκλησία bụrụ naanị ụlọ ụka. E doziri akara nkọwa ala peeji ka [a] soro okwu gbasara λυμαίνομαι, ebe [b] soro κατὰ τοὺς οἴκους, n’ihi na nke ahụ bụ ihe nkọwa nke ọ bụla metụtara.
