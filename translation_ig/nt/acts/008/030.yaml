  text: προσδραμὼν δὲ ὁ Φίλιππος ἤκουσεν αὐτοῦ ἀναγινώσκοντος ⸂Ἠσαΐαν τὸν προφήτην⸃ καὶ εἶπεν· Ἆρά γε γινώσκεις ἃ ἀναγινώσκεις;
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/030.yaml
  text: So Philip ran up and heard him reading Isaiah the prophet[a], and said, “Do you really understand what you are reading?”
translation:
  language: ig
  text: Filip wee gbaara ọsọ gakwuuru ya, nụrụ ya ka ọ na-agụ akwụkwọ onye amụma Aịzaya, sị ya, “Ị̀ ghọtara n’ezie[a] ihe ị na-agụ?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Enwere ike ịsụgharị ya, “Ị̀ ghọtara ihe ị na-agụ?” Mkpụrụ okwu Grik ndị e ji jụọ ajụjụ ahụ na-agbakwụnye nkwusi ike.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσδραμὼν
  choice: gbakwuru ya
  rationale: Ngwaa a na-egosi na Filip ji ọsọ gaa n'ebe nwoke ahụ nọ; ‘gbakwuru ya’ na-echekwa ngwa ngwa na ntụziaka mmegharị ahụ n'Igbo nkịtị.
- source_word: δὲ
  choice: wee
  rationale: N'ebe a δέ na-aga n'ihu n'akụkọ ahụ. ‘Wee’ bụ njikọ akụkọ sitere n'okike n'Igbo ma na-egosi ihe sochiri nke bu ya ụzọ.
- source_word: ἤκουσεν αὐτοῦ ἀναγινώσκοντος
  choice: nụ ka ọ na-agụ
  rationale: Nke a na-egosi na Filip nụrụ nwoke ahụ mgbe ọ nọ na-agụ. E tinyebeghị ‘n'olu dara ụda’ n'ihi na ọ bụ ezie na ọnọdụ ahụ na-egosi na a pụrụ ịnụ ya, okwu ahụ adịghị kpọmkwem na Grik.
- source_word: Ἠσαΐαν τὸν προφήτην
  choice: akwụkwọ Aịzaya onye amụma
  rationale: Ihe a na-agụ bụ ihe odide Aịzaya; itinye ‘akwụkwọ’ na-eme ka okwu ahụ doo anya ma bụrụ Igbo sitere n'okike, ebe ‘Aịzaya onye amụma’ na-echekwa aha na ọkwa ya.
- source_word: εἶπεν
  choice: sị ya
  rationale: ‘Sị ya’ bụ ụzọ Igbo sitere n'okike isi gosipụta na Filip gwara nwoke ahụ okwu; ajụjụ sochiri ya na-eme ka ụdị okwu ahụ doo anya.
- source_word: Ἆρά γε
  choice: n’ezie
  rationale: Ngwakọta mkpụrụokwu Grik ndị a na-enye ajụjụ ahụ ike na nyocha. ‘N’ezie’ na-echekwa nkwusi ike ahụ n'Igbo na-enweghị ime ka ajụjụ ahụ bụrụ nkwubi okwu.
- source_word: γινώσκεις
  choice: ị na-aghọta
  rationale: N'ọnọdụ a, okwu ahụ pụtara ịghọta ihe ihe odide ahụ na-ekwu, ọ bụghị nanị ịma ya.
- source_word: ἃ ἀναγινώσκεις
  choice: ihe ị na-agụ
  rationale: ‘Ihe’ na-anọchi ọdịnaya a na-agụ, ebe usoro ‘na-agụ’ na-echekwa omume na-aga n'ihu nke oge ugbu a.
theological_decisions: []
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị mfe nghọta ma nwee ugwu. ‘Wee gbakwuru ya’ na-enye akụkọ ahụ ọsọ, ebe ‘n’ezie’ na-echekwa ike ajụjụ Grik ahụ. Akara ndetu ala peeji [a] dị n'isiokwu ahụ dịka achọrọ.
