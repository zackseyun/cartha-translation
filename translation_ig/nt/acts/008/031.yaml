  text: ὁ δὲ εἶπεν· Πῶς γὰρ ἂν δυναίμην ἐὰν μή τις ⸀ὁδηγήσει με; παρεκάλεσέν τε τὸν Φίλιππον ἀναβάντα καθίσαι σὺν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/031.yaml
  text: And he said[a], “How could I[b], unless someone guides me?” Then he urged Philip to come up and sit with him.
translation:
  language: ig
  text: Ọ sịrị, “Olee otú m ga-esi nwee ike ma ọ bụrụ na o nweghị onye ga-eduzi m[a]?” Mgbe ahụ, ọ rịọsiri Filip ike[b] ka ọ rịgote n'ụgbọ ahụ ka ya na ya nọdụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “ma ọ bụrụ na o nweghị onye ga-egosi m ụzọ.” Okwu Grik a nwere ike ịpụta ma idu mmadụ n'ụzọ n'ezie ma iduzi ya ka ọ ghọta ihe.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsị, “ọ kpọrọ Filip ka ọ rịgote n'ụgbọ ahụ ka ya na ya nọdụ.” Okwu Grik a nwere ike ịpụta arịrịọ siri ike ma ọ bụ ịkpọ mmadụ òkù.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πῶς γὰρ ἂν δυναίμην
  choice: Olee otú m ga-esi nwee ike
  rationale: Nkebi a na-egosipụta ihe mmadụ na-agaghị enwe ike ime ma ọ bụrụ na ọnọdụ dị mkpa emezughị. Nsụgharị a na-echekwa echiche ahụ n'etinyeghị ihe a na-eme, ebe Grik hapụkwara ya ka a ghọta ya site n'okwu gbara ya gburugburu.
- source_word: ἐὰν μή τις ὁδηγήσει με
  choice: ma ọ bụrụ na o nweghị onye ga-eduzi m
  rationale: ‘Iduzi’ na-echekwa ma echiche nke idu mmadụ n'ụzọ ma echiche nke inyere ya aka ịghọta Akwụkwọ Nsọ; ya mere, a kọwaghị ya naanị dị ka ‘ịkọwara m.’
- source_word: παρεκάλεσέν
  choice: ọ rịọsiri ... ike
  rationale: Okwu Grik ahụ nwere ike ịpụta ịrịọsi ike, ịgba ume, ma ọ bụ ịkpọ mmadụ ka ọ bịa. N'ebe a, ‘rịọsiri ... ike’ na-egosipụta arịrịọ siri ike ma dị nsọpụrụ, n'emeghị ka ọ bụrụ ịrịọ arịrịọ gabiga ókè.
- source_word: τε
  choice: Mgbe ahụ
  rationale: Njikọ a dị mfe na-aga n'ihu n'akụkọ ahụ; ‘Mgbe ahụ’ na-egosipụta usoro ihe mere n'Igbo nkịtị.
- source_word: ἀναβάντα
  choice: ka ọ rịgote n'ụgbọ ahụ
  rationale: ‘Ịrịgote’ na-echekwa echiche spatial nke ịrịgo banye n'ụgbọ. A gbakwụnyere ‘n'ụgbọ ahụ’ iji mee ka okwu ahụ doo anya n'Igbo site n'ihe gbara amaokwu a gburugburu.
- source_word: καθίσαι σὺν αὐτῷ
  choice: nọdụnyere ya
  rationale: Nke a bụ ụzọ Igbo dị nkenke ma bụrụ nke eke isi kwuo ‘ịnọdụ ya na mmadụ,’ n'ekwughị kpọmkwem na ọ nọ n'akụkụ ya mgbe Grik ekwughị nke ahụ.
- source_word: Φίλιππον
  choice: Filip
  rationale: E degharịrị aha onye ahụ n'ụdị a na-eji n'Igbo.
theological_decisions: []
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E chekwara nhapụ dị na ‘Olee otú m ga-esi nwee ike’ kama ịgbakwunye ‘ịghọta ya,’ ka a ghara imechi nghọta sara mbara nke okwu Grik. Akara nkọwa [a] na [b] dị n'akụkụ okwu ha na-akọwa.
