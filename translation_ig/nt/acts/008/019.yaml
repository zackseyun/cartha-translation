revisions:
- from: na-asị[a], “Nyekwanụ m ikike a, ka onye ọ bụla m bikwasịrị aka nata Mmụọ Nsọ.”
  to: na-asị[a], “Nyekwanụ m ikike a, ka onye ọ bụla m ga-ebikwasị aka m n’elu ya nata Mmụọ Nsọ.”
  rationale: The revision retains the draft’s sound renderings of ἐξουσία and πνεῦμα ἅγιον, while changing the verbal construction for laying on hands so that the purpose-oriented, prospective sense of ἵνα ... ἐπιθῶ ... λαμβάνῃ is clear in Standard Igbo. No doctrinal interpretation has been added.
  reviewer_model: gpt-5.6-terra
