  variant: Standard Igbo
source:
  edition: SBLGNT
  text: λέγων· Δότε κἀμοὶ τὴν ἐξουσίαν ταύτην ἵνα ᾧ ἐὰν ἐπιθῶ τὰς χεῖρας λαμβάνῃ πνεῦμα ἅγιον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/019.yaml
  text: saying[a], “Give me also this authority, so that anyone on whom I lay my hands may receive the Holy Spirit.”
translation:
  language: ig
  text: na-asị[a], “Nyekwanụ m ikike a, ka onye ọ bụla m ga-ebikwasị aka m n’elu ya nata Mmụọ Nsọ.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “wee sị.” Okwu Grik a bụ participle nke jikọtara okwu Saịmọn na ihe e kwuru n’amaokwu bu ụzọ.
    reason: translation_alternative
lexical_decisions:
- source_word: λέγων
  choice: na-asị
  rationale: Ọ bụ participle nke ugbu a nke na-ewebata okwu Saịmọn ma jikọta ya na ihe dị n’amaokwu bu ụzọ; “na-asị” na-eme nke a n’ụzọ eke n’Igbo.
- source_word: Δότε
  choice: Nyekwanụ
  rationale: Imperative plural a pụtara “nyenụ”; ijikọta ya na echiche κἀμοί mere ka “Nyekwanụ m” bụrụ okwu Igbo dị eke nke na-egosikwa “m kwa.”
- source_word: κἀμοί
  choice: m
  rationale: Ihe καί + ἐμοί pụtara bụ “m kwa.” N’usoro “Nyekwanụ m,” akụkụ “-kwa-” dị na ngwaa na-eburu nkwusi ike nke “kwa” n’ụzọ Igbo dị eke.
- source_word: ἐξουσίαν
  choice: ikike
  rationale: “Ikike” nwere ike igosi ikike e nyere mmadụ, ikike ime ihe, ma ọ bụ ike ime ya, ma ọ naghị eme ka okwu ahụ bụrụ naanị ike anụahụ; ọ na-echekwa obosara ἐξουσία.
- source_word: ταύτην
  choice: a
  rationale: “A” na-atụ aka n’ikike ahụ kpọmkwem Saịmọn hụrụ n’amaokwu bu ụzọ.
- source_word: ἵνα
  choice: ka
  rationale: “Ka” na-ewebata nzube ma ọ bụ ihe a chọrọ ka o si na ya pụta n’Igbo nkịtị.
- source_word: ᾧ ἐὰν
  choice: onye ọ bụla ...
  rationale: Usoro a na-egosi onye ọ bụla n’enweghị ịkọ onye kpọmkwem; “onye ọ bụla” na-eburu echiche ahụ nke ọma.
- source_word: ἐπιθῶ τὰς χεῖρας
  choice: m bikwasịrị aka
  rationale: “Bikwasị aka” bụ okwu Igbo doro anya maka itinye aka n’elu mmadụ, ma na-echekwa ihe oyiyi dị n’asụsụ Grik.
- source_word: λαμβάνῃ
  choice: nata
  rationale: N’okwu nzube e ji “ka” webata, “nata” na-egosi ihe a chọrọ ka onye ahụ nweta n’enweghị ịgbakwunye nkọwa aspect na-adịghị mkpa.
- source_word: πνεῦμα ἅγιον
  choice: Mmụọ Nsọ
  rationale: N’ọrụ Ndịozi, okwu a na-ezo aka na Mmụọ Chineke; “Mmụọ Nsọ” bụ aha a na-aghọta nke ọma n’Igbo ma ọ chọghị article dịka Bekee.
theological_decisions:
- issue: Ma πνεῦμα ἅγιον, n’ihi na article adịghị ya n’asụsụ Grik, ò kwesịrị ịpụta mmụọ nsọ ọ bụla kama ịbụ Mmụọ Chineke.
  choice: Mmụọ Nsọ
  alternative: otu mmụọ nsọ
  rationale: Akụkọ gbara ya gburugburu n’Ọrụ Ndịozi na-egosi na ọ bụ Mmụọ Chineke ka a na-ekwu maka ya. Ịsụgharị ya “otu mmụọ nsọ” ga-etinye echiche indefinite nke ọnọdụ a anaghị akwado.
- issue: Ma ἐξουσίαν ò kwesịrị ịbụ naanị “ike” ma ọ bụ ikike e nyere mmadụ ime ihe.
  choice: ikike
  alternative: ike
  rationale: ἐξουσία nwere ike ịgụnye ikike, ikike ime ihe, na ike e nyere mmadụ. “Ikike” na-echekwa ọdịiche ahụ ma hapụ ọnọdụ okwu ka o gosi na ikike ahụ na-arụpụta ihe.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. “Nyekwanụ m” na-etinye echiche “m kwa” n’ime ngwaa n’ụzọ eke. Akara ndetu ala ala [a] dị n’isiokwu dịka achọrọ.
