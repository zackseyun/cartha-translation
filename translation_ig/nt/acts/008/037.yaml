  native_name: Igbo
  variant: Standard Igbo
source:
  edition: robinson-pierpont-2005-byzantine
  text: Εἶπεν δὲ ὁ Φίλιππος, Εἰ πιστεύεις ἐξ ὅλης τῆς καρδίας, ἔξεστιν. Ἀποκριθεὶς δὲ εἶπεν, Πιστεύω τὸν υἱὸν τοῦ θεοῦ εἶναι τὸν Ἰησοῦν Χριστόν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/037.yaml
  text: And Philip[a] said, “If you believe with all your heart, you may.” And he answered and said, “I believe that Jesus is the Messiah, the Son of God.”
translation:
  language: ig
  text: Filip[a] wee sị, “Ọ bụrụ na i ji obi gị niile kwere, ị pụrụ.” Ọ zara sị, “Ekwere m na Jizọs Kraịst bụ Ọkpara Chineke.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Amaokwu a adịghị n’ihe odide Grik ndị kacha ochie, gụnyere akwụkwọ papaịrọs nke narị afọ nke atọ na Codex Sinaiticus na Codex Vaticanus nke narị afọ nke anọ; ọ dịghịkwa na nsụgharị Koptik ndị mbụ. Ma ọ dị n’ọtụtụ ihe odide nke ọdịnala Baịzantium nakwa n’ọdịnala Latin, ndị nna ụka mbụ dịka Irenaeus na Cyprian kpọkwara ya ihe n’ọgwụgwụ narị afọ nke abụọ. Ọtụtụ ndị ọkà mmụta na-akọwa ya dị ka usoro nkwupụta okwukwe e ji eme baptizim n’oge mbụ, nke e mesịrị tinye n’akụkọ Ọrụ Ndị Ozi.
    reason: textual_critical
lexical_decisions:
- source_word: ἔξεστιν
  choice: ị pụrụ
  rationale: Okwu a na-egosi na e kwere ka e mee ihe a na-ekwu maka ya—ya bụ, ime baptizim. “Ị pụrụ” na-enye echiche ahụ n’ụzọ dị nkenke ma dịkwa mma n’Igbo, n’enweghị ụda iwu siri ike.
- source_word: ἐξ ὅλης τῆς καρδίας
  choice: ji obi gị niile
  rationale: Nke a na-edobe akpaalaokwu Akwụkwọ Nsọ nke na-egosi nkwenye zuru oke na nke sitere n’ezi obi.
- source_word: Πιστεύω
  choice: Ekwere m
  rationale: N’ọnọdụ nkwupụta okwukwe a, “Ekwere m” na-egosi ịnakwere eziokwu banyere onye Jizọs bụ.
- source_word: Ἰησοῦν Χριστόν
  choice: Jizọs Kraịst
  rationale: A na-edobe aha na utu aha Grik ọnụ. “Kraịst” bụ utu aha nke pụtara Mesaịa, ọ bụghị aha ezinụlọ.
- source_word: υἱὸν τοῦ θεοῦ
  choice: Ọkpara Chineke
  rationale: Nke a bụ ụzọ a maara nke ọma ma dị ùgwù e si akọwa utu aha a n’Igbo; ebe a, “Ọkpara” anaghị ekwu na ọ bụ nwa mbụ, kama ọ na-anọchi anya ‘Ọkpara Chineke’ dị ka utu aha.
theological_decisions:
- issue: Mmekọrịta dị n’etiti ‘Jizọs Kraịst’ na ‘Ọkpara Chineke’
  choice: Ekwere m na Jizọs Kraịst bụ Ọkpara Chineke.
  alternative: Ekwere m na Jizọs bụ Mesaịa ahụ, Ọkpara Chineke.
  rationale: Grik kpọmkwem na-ekwu na onye na-aza ajụjụ kwenyere na Jizọs Kraịst bụ Ọkpara Chineke. Nhọrọ a na-edobe usoro na mmekọrịta okwu Grik ahụ, ma ghara ime ka ‘Kraịst’ na ‘Ọkpara Chineke’ bụrụ aha abụọ e tinyere n’usoro apposition nke ederede Grik na-ekwughị kpọmkwem.
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, dị mfe nghọta ma nwee ugwu. Ahịrịokwu ndị ahụ dị nkenke dịka mkparịta ụka dị na Grik. E tinyere akara nkọwa [a] ozugbo n’akụkụ “Filip” dịka n’akwụkwọ ntụaka e nyere.
