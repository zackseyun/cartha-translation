  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὅτε δὲ ἐπίστευσαν τῷ Φιλίππῳ εὐαγγελιζομένῳ ⸀περὶ τῆς βασιλείας τοῦ θεοῦ καὶ τοῦ ὀνόματος Ἰησοῦ Χριστοῦ, ἐβαπτίζοντο ἄνδρες τε καὶ γυναῖκες.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/012.yaml
  text: But when they believed Philip as he proclaimed the good news about the kingdom of God and the name of Jesus the Messiah[a], they were being baptized, both men and women.
translation:
  language: ig
  text: Ma mgbe ha kwere ihe Filip na-ekwu, ka ọ na-ekwusa ozi ọma banyere alaeze Chineke na aha Jizọs, bú Mesaya[a], a nọ na-eme ha baptizim, ma ụmụ nwoke ma ụmụ nwanyị.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Jizọs Kraịst.”
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτε δὲ
  choice: Ma mgbe
  rationale: “Mgbe” na-egosi oge, ebe “ma” na-egosi ntakịrị mgbanwe ma ọ bụ ọdịiche n’akụkọ ahụ n’enweghị ime ka ọdịiche ahụ sie ike karịa Grik.
- source_word: ἐπίστευσαν τῷ Φιλίππῳ
  choice: ha kwere ihe Filip na-ekwu
  rationale: πιστεύω tinyere onye n’ụdị dative pụtara ikwere onye ahụ dị ka onye na-ekwu eziokwu, ọ bụghị ikwere na Filip dị ka onye nzọpụta. N’Igbo, “kwere ihe Filip na-ekwu” na-ewepụ nghọtahie ahụ ma chekwaa isi ihe Grik pụtara.
- source_word: εὐαγγελιζομένῳ
  choice: ka ọ na-ekwusa ozi ọma
  rationale: Nke a na-egosi ihe Filip nọ na-eme mgbe ha kwere ya; “na-ekwusa ozi ọma” bụ okwu Igbo doro anya nke na-echekwa echiche nke ikwusa ozi ọma.
- source_word: περὶ τῆς βασιλείας τοῦ θεοῦ
  choice: banyere alaeze Chineke
  rationale: “Banyere” na-egosi isiokwu ozi ahụ, ebe “alaeze Chineke” bụ nsụgharị kwụ ọtọ ma bụrụ nke ndị na-agụ Baịbụl n’Igbo maara.
- source_word: τοῦ ὀνόματος Ἰησοῦ Χριστοῦ
  choice: aha Jizọs, bú Mesaya
  rationale: E debere “aha” n’ihi na ὄνομα nwere ike ịgụnye onye ahụ, ikike ya, na njirimara ya. “Mesaya” na-echekwa Χριστός dị ka utu aha, ọ bụghị aha ezinụlọ.
- source_word: ἐβαπτίζοντο
  choice: a nọ na-eme ... baptizim
  rationale: Ụdị imperfect passive na-egosi omume gara n’ihu ma ọ bụ nke a na-eme ugboro ugboro ka ndị mmadụ na-ekwere; usoro a na-echekwa akụkụ ahụ karịa naanị “e mere ha baptizim.”
- source_word: ἄνδρες τε καὶ γυναῖκες
  choice: ụmụ nwoke na ụmụ nwanyị
  rationale: Nke a na-edobe aha ìgwè abụọ ahụ Luke kpọrọ kpọmkwem ma bụrụ okwu Igbo dị mfe nghọta.
theological_decisions:
- issue: Nsụgharị Χριστοῦ n’okwu Ἰησοῦ Χριστοῦ
  choice: Jizọs, bú Mesaya
  alternative: Jizọs Kraịst
  rationale: N’ebe a Χριστός ka nwere ọrụ nke utu aha Mesaya. “Bú Mesaya” na-eme ka nke ahụ doo anya n’Igbo ma ghara ime ka ọ dị ka aha nke abụọ.
- issue: Ihe “ikwere Filip” pụtara
  choice: ha kwere ihe Filip na-ekwu
  alternative: ha kwere na Filip
  rationale: Nhọrọ a na-egosi na ha nabatara ozi Filip dị ka eziokwu, ma zere ịpụta na Filip n’onwe ya bụ onye ha tụkwasịrị okwukwe nzọpụta ha n’ime ya.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke ugbu a, dị nsọ ma dị mfe nghọta. E jiri “a nọ na-eme ... baptizim” chekwaa omume na-aga n’ihu nke imperfect Grik; e jiri “bú Mesaya” mee ka utu aha Χριστός pụta ìhè.
