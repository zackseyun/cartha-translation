  text: ⸀οὐδέπω γὰρ ἦν ἐπ’ οὐδενὶ αὐτῶν ἐπιπεπτωκός, μόνον δὲ βεβαπτισμένοι ὑπῆρχον εἰς τὸ ὄνομα τοῦ ⸀κυρίου Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/016.yaml
  text: For he had not yet fallen upon any of them[b][a]; they had only been baptized into the name of the Lord Jesus.
translation:
  language: ig
  text: N’ihi na Mmụọ Nsọ adakwasịbeghị onye ọ bụla n’ime ha[a]; naanị e meela ha baptizim n’aha Onyenwe anyị Jizọs[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “abịakwasịbeghị onye ọ bụla n’ime ha.”
    reason: lexical_alternative
  - marker: b
    text: N’ụzọ na-esochi okwu Grik nso karị, “e meela ha baptizim banye n’aha Onyenwe anyị Jizọs.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδέπω
  choice: adakwasịbeghị
  rationale: Ngwakọta ‘-beghị’ na-egosi na ihe ahụ emebeghị ruo n’oge ahụ; ọ bụ ụzọ Igbo dị ndụ si kwuo ‘not yet’.
- source_word: ἐπ’ οὐδενὶ αὐτῶν
  choice: onye ọ bụla n’ime ha
  rationale: N’usoro ahịrịokwu a na ngwaa ‘dakwasị,’ nke a na-egosipụta na Mmụọ Nsọ abịakwasịbeghị ọbụna otu onye n’etiti ha.
- source_word: ἐπιπεπτωκός
  choice: adakwasịbeghị
  rationale: ‘Dakwasị’ na-echekwa onyinyo nke ἐπιπίπτω, ya bụ ịdakwasị mmadụ, nke Luk ji akọ banyere ọbịbịa Mmụọ Nsọ.
- source_word: μόνον
  choice: naanị ihe e mere bụ na
  rationale: Nke a na-eme ka oke na ọdịiche μόνον na-egosi doo anya n’Igbo nkịtị.
- source_word: βεβαπτισμένοι ὑπῆρχον
  choice: e meela ha baptizim
  rationale: Ụdị ‘e meela’ na-egosi omume e mezuru tupu oge a na-ekwu maka ya na ọnọdụ sitere na ya.
- source_word: εἰς τὸ ὄνομα
  choice: n’aha
  rationale: ‘N’aha’ bụ akpaokwu Igbo doro anya ma bụrụkwa nke a na-ejikarị eme ihe n’ihe gbasara baptizim; ntụgharị nkịtị ‘banye n’aha’ dị na nkọwa ala peeji.
- source_word: κυρίου Ἰησοῦ
  choice: Onyenwe anyị Jizọs
  rationale: Nke a na-asụgharị κύριος dịka aha nsọpụrụ ‘Onyenwe anyị’ ma na-edobe aha Jizọs.
theological_decisions:
- issue: Onye bụ isiokwu nke ‘adakwasịbeghị’
  choice: Akpọrọ Mmụọ Nsọ aha n’ahịrịokwu ahụ.
  alternative: Ịhapụ isiokwu ahụ ka a ghọta ya naanị site n’amaokwu bu ụzọ.
  rationale: Grik ahapụghị aha isiokwu n’amaokwu a, ma amaokwu bu ụzọ kpọrọ Mmụọ Nsọ aha. Ịkpọ ya aha n’Igbo na-eme ka ahịrịokwu guzozie nke ọma n’enweghị ịgbakwunye echiche ozizi ọhụrụ.
- issue: Okwu e ji kọwaa baptizim na aha Jizọs
  choice: n’aha Onyenwe anyị Jizọs
  alternative: banye n’aha Onyenwe anyị Jizọs
  rationale: ‘N’aha’ bụ asụsụ Igbo kachasị eke. Nkọwa ala peeji na-echekwa ntụgharị nke na-eso εἰς nso karị, n’enweghị ikpebi arụmụka ozizi banyere usoro okwu baptizim.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị ùgwù ma dị mfe nghọta. ‘Dakwasị’ na-echekwa onyinyo okwu Grik, ebe ‘abịakwasị’ dị na nkọwa ala peeji dịka ụzọ ọzọ dị nro. E debere akara nkọwa [a] na [b] ozugbo n’ebe ha metụtara.
