review_pass:
  verdict: revise
  source_fidelity: The translation accurately supplies “Mmụọ Nsọ” from the immediate context (v. 15) for the Greek’s implicit subject and faithfully renders the Spirit’s not-yet having fallen upon any of the Samaritans. “Adakwasịbeghị” preserves the imagery of ἐπιπεπτωκός. “N’aha” is an idiomatic rendering of the baptismal εἰς-phrase, while the footnote retains the more formally literal directional sense.
  naturalness: The opening clause is clear, dignified Standard Igbo. However, “naanị ihe e mere bụ na e meela ha baptizim” is unnecessarily roundabout and slightly shifts the contrast to “the only thing done.” A direct restrictive construction better reflects μόνον while reading more naturally.
  terminology: “Mmụọ Nsọ,” “baptizim,” and “Onyenwe anyị Jizọs” are appropriate, established Standard Igbo Christian terminology. The alternatives in both notes are relevant and their anchors are correctly placed.
  issues:
  - severity: low
    issue: The restrictive baptism clause is periphrastic.
    rationale: μόνον δὲ βεβαπτισμένοι ὑπῆρχον contrasts their prior baptism with the Spirit’s not yet falling upon them. “Naanị e meela ha baptizim” states this more directly than “naanị ihe e mere bụ na …,” without altering the sense.
