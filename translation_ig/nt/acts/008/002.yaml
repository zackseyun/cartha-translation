base_translation:
  language: en
  yaml_path: translation/nt/acts/008/002.yaml
  text: But devout men buried Stephen and made great lamentation over him[a][b].
translation:
  language: ig
  text: Ma ndị ikom na-atụ egwu Chineke liri Stivin[a], kwaara ya akwa nke ukwuu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “kwadebere ozu Stivin maka olili” ma ọ bụ “buru ozu Stivin gaa ili”; ngwaa Grik ahụ nwere ike imesi ilekọta ma ọ bụ iburu ozu ahụ ike, ọ bụghị naanị ili ya.
    reason: lexical_alternative
  - marker: b
    text: “Ịkwa ya akwa nke ukwuu” nwere ike ịgụnye iru újú a na-egosipụta n’olu dara ụda na n’ihu ọha, ọ bụghị naanị mwute dị n’obi.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνεκόμισαν
  choice: likọrọ
  rationale: N’ọnọdụ a, ngwaa ahụ na-ezo aka n’ilekọta ozu Stivin ruo n’ili ya. “Likọrọ” bụ okwu Igbo doro anya ma dịkwa nkenke; nkọwa ala peeji na-echekwa echiche ndị ọzọ nke ịkwadebe ozu ma ọ bụ iburu ya gaa ili.
- source_word: δέ
  choice: Ma
  rationale: “Ma” na-egosi ntakịrị ntụgharị ma ọ bụ ọdịiche n’akụkọ ahụ mgbe e gbusịrị Stivin.
- source_word: ἄνδρες εὐλαβεῖς
  choice: ndị ikom na-atụ egwu Chineke
  rationale: “Ndị ikom” na-echekwa ụdị nwoke ọtụtụ nke ἄνδρες, ebe okwu Igbo “na-atụ egwu Chineke” na-egosi nsọpụrụ na ndụ ofufe nke εὐλαβεῖς n’ụzọ ndị nkịtị na-aghọta.
- source_word: ἐποίησαν κοπετὸν μέγαν
  choice: kwaakwa ya akwa nke ukwuu
  rationale: Nke a bụ akpaalaokwu Igbo sitere n’okike nke na-egosi iru újú siri ike, ma nwee ike ịgụnye ịkwa ákwá n’olu na n’ihu ọha.
- source_word: ἐπ’ αὐτῷ
  choice: ya
  rationale: N’akpaalaokwu “kwaa mmadụ akwa,” nnọchiaha “ya” na-egosi na Stivin bụ onye a na-eru újú maka ya.
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “Na-atụ egwu Chineke” bụ okwu Baịbụl a maara nke ọma maka nsọpụrụ Chineke, ọ bụghị ụjọ nkịtị. Akpaalaokwu “kwaa ya akwa” na-eme ka ahịrịokwu ahụ bụrụ Igbo sitere n’okike ma na-echekwa ike nke κοπετὸν μέγαν.
