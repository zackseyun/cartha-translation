  verdict: revise
  source_fidelity: 'Ọtụtụ akụkụ na-esochi Grik nke ọma: ‘maara nke ọma karị,’ ‘Ụzọ ahụ,’ na ‘aga m ekpebi’ na-anọchi anya okwu ndị dị na ya n’ụzọ kwesịrị ekwesị. Ma ‘si n’ebe ahụ’ na-agbakwụnye ebe mmalite nke καταβῇ na-ekwughị n’amaokwu a. Nkọwa ala peeji c kwa ekwesịghị ntụkwasị obi, n’ihi na ‘achọpụta mkpebi’ nwere ike ịpụta ịchọpụta mkpebi e mere, ọ bụghị ime mkpebi banyere ihe ahụ.'
  naturalness: Ederede ahụ dị n’ụdị Standard Igbo a na-asụ ugbu a ma debekwa ụda nkwanye ùgwù kwesịrị ekwesị. ‘Mgbe Lisias, ọchịagha ahụ, rịdata’ dị mfe ma bụrụkwa nke eke karịa ‘si n’ebe ahụ rịdata,’ ebe ọ naghị etinye ozi na-adịghị na Grik.
  terminology: ‘Ụzọ ahụ’ na-echekwa aha pụrụ iche ἡ ὁδός n’Akwụkwọ Ọrụ Ndị Ozi; ‘ọchịagha’ bụ ntụgharị doro anya maka χιλίαρχος. A na-edobe ‘Kraịst’ naanị na nkọwa omenala, ọ bụghị dị ka mgbakwunye n’ahịrịokwu nsọ.
