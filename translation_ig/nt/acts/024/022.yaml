base_translation:
  language: en
  yaml_path: translation/nt/acts/024/022.yaml
  text: But Felix, having a more accurate knowledge about the Way, put them off, saying, “When Lysias the commander comes down, I will decide your case.”
translation:
  language: ig
  text: Ma Feliks, ebe ọ maara nke ọma karị ihe ndị metụtara Ụzọ ahụ,[b] yigharịrị okwu ha,[a] sị, “Mgbe Lisias, ọchịagha ahụ, rịdata, aga m ekpebi okwu unu.”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “kwụsịtụrụ ikpe ahụ ruo mgbe ọzọ”; ngwaa Grik ahụ nwere ike ịpụta iyigharị ma ọ bụ ịkwụsịtụ ihe a na-eme n'ụlọikpe.
    reason: lexical_alternative
  - marker: b
    text: “Ụzọ ahụ” bụ otu n'ime aha ndị mbụ e ji mara òtù ndị kwere na Kraịst.
    reason: cultural_note
  - marker: c
    text: A pụkwara ịsị, “aga m ekpebi ihe ndị metụtara unu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀνεβάλετο
  choice: yigharịrị okwu ha
  rationale: Ngwaa a pụtara iyigharị ime mkpebi ma ọ bụ ikpe n'okwu ụlọikpe. ‘Yigharịrị okwu ha’ bụ Igbo doro anya nke na-ejigide ma echiche nke iyigharị ma ntụaka αὐτούς nye ndị nọ n'ikpe ahụ.
- source_word: ἀκριβέστερον εἰδὼς
  choice: ebe ọ maara nke ọma karị
  rationale: Nke a na-egosi ihe mere Feliks ji yigharịa okwu ahụ, ma ‘karị’ na-echekwa ụdị ntụnyere dị na ἀκριβέστερον.
- source_word: τὰ περὶ τῆς ὁδοῦ
  choice: ihe ndị metụtara Ụzọ ahụ
  rationale: ‘Ụzọ ahụ’ na-echekwa aha e ji mara òtù ndị kwere na Kraịst n'akwụkwọ Ọrụ Ndị Ozi, kama ịkọwa ya karịa ihe Grik kwuru.
- source_word: Ὅταν ... καταβῇ
  choice: Mgbe ... si n’ebe ahụ rịdata
  rationale: ‘Mgbe’ na-egosi ọbịbịa a tụrụ anya ya n'ọdịnihu; ‘rịdata’ na-echekwa ntụgharị njem dị na καταβῇ, ebe ‘si n’ebe ahụ’ na-eme ka Igbo bụrụ nke eke n'enweghị ịkpọ ebe a na-akpọghị aha.
- source_word: χιλίαρχος
  choice: ọchịagha
  rationale: Okwu a na-ezo aka n'onyeisi ndị agha Rom. ‘Ọchịagha’ bụ okwu Igbo dị mfe nghọta ma dabara n'ọkwa agha n'ozuzu ya.
- source_word: διαγνώσομαι
  choice: aga m ekpebi
  rationale: N'ọnọdụ ikpe, ngwaa a pụtara ikpebi okwu mgbe a tụlechara ya.
- source_word: τὰ καθ’ ὑμᾶς
  choice: okwu unu
  rationale: Nkebiokwu a pụtara ihe gbasara ndị a na-ekpe ikpe. ‘Okwu unu’ bụ Igbo eke nke na-echekwa obosara okwu Grik karịa ịmanye ya ka ọ bụrụ naanị ‘ikpe unu’.
theological_decisions: []
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A hapụrụ ‘Ụzọ ahụ’ dịka aha pụrụ iche nke òtù ahụ, ma tinye nkọwa n'ala peeji. Akara nkọwa [a], [b], na [c] niile dị n'ahịrịokwu ahụ n'ebe ha metụtara.
