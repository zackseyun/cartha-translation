  - severity: medium
    issue: Nkọwa ala peeji c kwuru ‘aga m achọpụta mkpebi.’
    rationale: διαγνώσομαι pụtara ‘aga m ekpebi/ekpebie’ n’ọnọdụ ikpe, ọ bụghị ‘aga m achọpụta mkpebi.’ Nkọwa ọzọ kwesịrị igosi ‘ihe ndị metụtara unu,’ dịka τὰ καθ’ ὑμᾶς si dị.
