id: ACT.24.16
reference: Acts 24:16
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐν τούτῳ ⸀καὶ αὐτὸς ἀσκῶ ἀπρόσκοπον συνείδησιν ⸀ἔχειν πρὸς τὸν θεὸν καὶ τοὺς ἀνθρώπους διὰ παντός.
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/016.yaml
  text: In view of this[a], I myself also strive always to have a blameless conscience before God and men.
translation:
  language: ig
  text: N’ihi nke a[a], mụ onwe m na-agbakwa mbọ mgbe niile ka m nwee akọ na uche na-enweghị ihe ịta ụta n’ihu Chineke na ụmụ mmadụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “N’ime nke a.”
    reason: ἐν τούτῳ nwere ike ịbụ nkebiokwu na-egosi ihe kpatara ihe ma ọ bụ ọnọdụ e ji eme ya; isiokwu amaokwu ndị gbara ya gburugburu kwadoro “N’ihi nke a,” ma ọdịdị okwu Grik ahụ ka na-enye ohere maka nsụgharị nke ọzọ.
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: N’ihi nke a
  rationale: Nkebiokwu a na-ezo aka n’olileanya mbilite n’ọnwụ e kwuru n’amaokwu bu ụzọ ma na-egosi ihe mere Pọl ji na-agba mbọ. Nsụgharị a bụ Igbo dị mfe ma na-edebe njikọ echiche ahụ.
- source_word: καὶ αὐτός
  choice: mụ onwe m na-agbakwa
  rationale: “Mụ onwe m” na-egosipụta nkwusi ike nke αὐτός, ebe “-kwa” na-edebe ike mgbakwunye nke καί.
- source_word: ἀσκῶ
  choice: na-agba mbọ
  rationale: Okwu a pụtara itinye onwe mmadụ n’omume ma ọ bụ n’ọzụzụ siri ike. “Na-agba mbọ” na-egosi mbọ omume na-aga n’ihu n’ụzọ Igbo si ada nke ọma.
- source_word: ἀπρόσκοπον
  choice: na-enweghị ihe ịta ụta
  rationale: N’ebe a, okwu ahụ na-akọwa akọ na uche nke na-enweghị ihe ga-abụ mmejọ ma ọ bụ ihe ịsụ ngọngọ n’ihu Chineke na mmadụ. Nhọrọ a na-edebe echiche nke enweghị ụta n’ebughị nkọwa ọzọ bata.
- source_word: συνείδησιν
  choice: akọ na uche
  rationale: Nke a bụ okwu Igbo a na-ejikarị akọwa ikike dị n’ime mmadụ nke na-ama ihe ọma na ihe ọjọọ.
- source_word: ἔχειν
  choice: ka m nwee
  rationale: Infinitive a na-egosi ihe mbọ Pọl na-agba bu n’obi; “ka m nwee” na-enye echiche ahụ n’ụzọ Igbo doro anya.
- source_word: πρὸς τὸν θεὸν καὶ τοὺς ἀνθρώπους
  choice: n’ihu Chineke na ụmụ mmadụ
  rationale: πρός na-egosi mmekọrịta na ibu ọrụ n’ebe Chineke na mmadụ nọ. “N’ihu” na-egosipụta nke a n’Igbo dị nkenke. ἀνθρώπους bụ mmadụ n’ozuzu, ya mere “ụmụ mmadụ” gụnyere mmadụ niile.
- source_word: διὰ παντός
  choice: mgbe niile
  rationale: Nkebiokwu a na-egosi omume na-aga n’ihu mgbe nile; “mgbe niile” bụ okwu Igbo doro anya ma kwekọọ na ya.
theological_decisions:
- issue: Ihe ἀνθρώπους pụtara n’ụzọ nnọchite anya mmadụ niile
  choice: ụmụ mmadụ
  alternative: ndị mmadụ
  rationale: Ọ bụ ezie na ụdị Grik ahụ bụ plural, ἀνθρώπους n’ebe a na-anọchi anya mmadụ niile, ọ bụghị naanị ndị nwoke. Igbo anaghị achọ ka e jiri okwu na-egosi naanị nwoke mee ka echiche a pụta; “ụmụ mmadụ” na-edebe obosara okwu Grik ahụ.
- issue: Mmekọrịta “akọ na uche na-enweghị ihe ịta ụta” na Chineke na mmadụ
  choice: n’ihu Chineke na ụmụ mmadụ
  alternative: n’ebe Chineke na ụmụ mmadụ nọ
  rationale: Nsụgharị a na-edebe akụkụ abụọ nke ibu ọrụ Pọl—n’ebe Chineke nọ na n’ebe mmadụ nọ—n’akwụsịghị ma akọ na uche ahụ bụ nke onwe ya ma ọ bụ otú ndị ọzọ si ele omume ya anya.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta, dee ya. “Mụ onwe m” na “-kwa” na-edebe nkwusi ike na mgbakwunye dị na Grik; a zere okwu ụka pụrụ iche ma ọ bụ nkọwa nkwenkwe agbakwunyere.
