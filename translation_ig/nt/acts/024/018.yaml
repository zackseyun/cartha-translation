base_translation:
  language: en
  yaml_path: translation/nt/acts/024/018.yaml
  text: In these things they found me purified in the temple[a], not with a crowd nor with an uproar[b],
translation:
  language: ig
  text: N’ime ihe ndị a, ha hụrụ m n’ụlọ nsọ, mgbe e mechara m nsacha emume[a]; mụ na ìgwè mmadụ anọghị, ọgbaaghara adịghịkwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Nsacha emume” na-ekwu maka nsacha okpukpe a na-eme n’emume.
    reason: cultural_note
lexical_decisions:
- source_word: ἐν αἷς
  choice: N’ime ihe ndị a
  rationale: Ọ na-ezo aka n’ihe ma ọ bụ ihe omume ndị Pọl kwuru tupu nke a, ma na-edobe usoro okwu Grik n’enweghị ịkọwa ya karịa ihe ederede kwuru.
- source_word: εὗρόν με
  choice: ha hụrụ m
  rationale: Nke a bụ ụzọ Igbo nkịtị na nke dabara n’akụkọ si asụ na ha zutere ma hụ Pọl n’ụlọ nsọ.
- source_word: ἡγνισμένον
  choice: mgbe m sachara onwe m dịka iwu ofufe si dị
  rationale: Perfect passive participle ahụ na-egosi na Pọl nọ n’ọnọdụ onye mezuru nsacha emume. N’Igbo, nkọwa a na-eme ka echiche emume okpukpe ahụ doo anya, na-enweghị ime ka ọ bụrụ naanị ịsa ahụ nkịtị.
- source_word: ἐν τῷ ἱερῷ
  choice: n’ụlọ nsọ
  rationale: ἱερόν na-ezo aka n’ụlọ nsọ na ogige ya n’ozuzu, ọ bụghị nanị ime ebe nsọ kachasị nsọ; “ụlọ nsọ” bụ okwu Igbo a na-aghọta nke ọma.
- source_word: οὐ μετὰ ὄχλου
  choice: ọ bụghị na mụ na ìgwè mmadụ nọ
  rationale: Nke a na-edobe nkwupụta Pọl na ìgwè mmadụ esoghị ya, ma ghara iji okwu dị ka “ìgwè ọgbaaghara” nke ga-agbakwụnye echiche na-adịghị na ὄχλος n’onwe ya.
- source_word: οὐδὲ μετὰ θορύβου
  choice: ọ bụghịkwa n’ọgbaaghara
  rationale: θόρυβος na-egosi mkpọtụ, ọgba aghara, ma ọ bụ ọgbaaghara ọha; “ọgbaaghara” dabara n’ọnọdụ ikpe a ma bụrụkwa okwu Igbo doro anya.
