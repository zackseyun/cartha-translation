translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. A hapụrụ njikọ “N’ime ihe ndị a” ka ọ na-ezo azụ n’ihe ndị bu ụzọ, dịka okwu Grik si mee. Akara ntụaka [a] pụtara n’ahịrịokwu ahụ.
