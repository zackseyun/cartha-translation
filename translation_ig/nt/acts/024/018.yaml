revisions:
- from: N’ime ihe ndị a, ha hụrụ m n’ụlọ nsọ mgbe m sachara onwe m dịka iwu ofufe si dị[a]; ọ bụghị na mụ na ìgwè mmadụ nọ, ọ bụghịkwa n’ọgbaaghara.
  to: N’ime ihe ndị a, ha hụrụ m n’ụlọ nsọ, mgbe e mechara m nsacha emume[a]; mụ na ìgwè mmadụ anọghị, ọgbaaghara adịghịkwa.
  rationale: 'The revision preserves the anaphoric ambiguity of ἐν αἷς (“N’ime ihe ndị a”), represents the completed passive ritual state without adding an unstated legal qualification, and maintains the two Greek negations: Paul was neither with a crowd nor involved in an uproar.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T10:22:31Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the relative reference, the temple setting, and the absence of a crowd and disturbance. However, “mgbe m sachara onwe m dịka iwu ofufe si dị” makes the perfect passive participle ἡγνισμένον active (“after I cleansed myself”) and adds “according to religious law,” which is not stated in this clause. The Greek says that Paul was in a state of having been ritually purified.
  naturalness: The proposed revision uses clear, modern Standard Igbo. “Mgbe e mechara m nsacha emume” naturally expresses that ritual purification had been carried out for/on Paul without making him the explicit agent. The final two coordinated phrases retain the legal-defense contrast and read smoothly.
  terminology: “ụlọ nsọ” is an appropriate general rendering of ἱερόν. “nsacha emume” preserves the ritual sense of ἁγνίζω without reducing it to ordinary washing. “ìgwè mmadụ” and “ọgbaaghara” suitably render ὄχλος and θόρυβος respectively.
  issues:
  - severity: medium
    issue: Active wording for a passive participle
    rationale: '“m sachara onwe m” presents Paul as cleansing himself, whereas ἡγνισμένον is perfect passive: he had been purified.'
  - severity: medium
    issue: Added qualification “dịka iwu ofufe si dị”
    rationale: The clause itself does not specify that the purification was according to religious law. Its ritual character may be explained in a footnote, but should not be inserted into the translated text.
  revised_text: N’ime ihe ndị a, ha hụrụ m n’ụlọ nsọ, mgbe e mechara m nsacha emume[a]; mụ na ìgwè mmadụ anọghị, ọgbaaghara adịghịkwa.
  revised_footnotes:
  - marker: a
    text: “Nsacha emume” na-ekwu maka nsacha okpukpe a na-eme n’emume.
    reason: cultural_note
  revision_rationale: 'The revision preserves the anaphoric ambiguity of ἐν αἷς (“N’ime ihe ndị a”), represents the completed passive ritual state without adding an unstated legal qualification, and maintains the two Greek negations: Paul was neither with a crowd nor involved in an uproar.'
