  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸀διαταξάμενος τῷ ἑκατοντάρχῃ τηρεῖσθαι ⸀αὐτὸν ἔχειν τε ἄνεσιν καὶ μηδένα κωλύειν τῶν ἰδίων αὐτοῦ ⸀ὑπηρετεῖν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/023.yaml
  text: And he ordered the centurion to keep him in custody[a], yet to let him have some freedom[b], and to prevent none of his own people from attending to his needs.
translation:
  language: ig
  text: O nyere ọchịagha otu narị ndị agha iwu ka ọ debe Pọl n'okpuru nche, ma kwe ka o nwee nnwere onwe ụfọdụ[a], ghara igbochikwa onye ọ bụla n’ime ndị nke ya[b] ilekọta mkpa ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ka o nwee ahụ efe” ma ọ bụ “ka o nwee ohere.” Okwu Grik ahụ nwere ike ịpụta ahụ efe, ịdị mfe, ma ọ bụ nnwere onwe e nyere n’ókè n’agbanyeghị na onye ahụ ka nọ n’okpuru nche.
    reason: lexical_alternative
  - marker: b
    text: N'ụzọ nkịtị, “ndị nke ya.” O nwere ike ịbụ ndị Pọl na ha so, ndị enyi ya, ma ọ bụ ndị na-akwado ya, bụ́ ndị e kwere ka ha nyere ya aka.
    reason: lexical_alternative
lexical_decisions:
- source_word: διαταξάμενος
  choice: O nyere ... iwu
  rationale: Nke a na-egosi iwu siri ike Felix nyere, ma na-agbanwe usoro participle Grik ka ọ bụrụ ahịrịokwu akụkọ dị mma n’Igbo.
- source_word: ἑκατοντάρχῃ
  choice: ọchịagha na-elekọta otu narị ndị agha
  rationale: Nkọwa a na-eme ka ọkwa onyeisi agha Rom ahụ doo onye Igbo nke oge a anya karịa iji okwu mbịarambịa.
- source_word: τηρεῖσθαι αὐτόν
  choice: ka e debe Pọl n'okpuru nche
  rationale: N’ebe a, τηρέω pụtara idobe onye mkpọrọ n’okpuru nche, ọ bụghị naanị ile ya anya. E jiri aha Pọl dochie nnọchiaha iji mee ka onye a na-ekwu maka ya doo anya.
- source_word: ἔχειν τε ἄνεσιν
  choice: ka e kwe ka o nwee nnwere onwe ụfọdụ
  rationale: ἄνεσις nwere ike ịpụta ahụ efe, ohere, ma ọ bụ ibelata mmachi. N’ọnọdụ njide a, okwu a na-egosi nnwere onwe e nyere ya n’ókè, ọ bụghị ịhapụ ya kpamkpam.
- source_word: τε ... καὶ
  choice: ma ... nakwa
  rationale: 'Usoro a jikọtara ohere abụọ e nyere: ime ka njide Pọl ghara isi ike, na ịghara igbochi ndị ya inyere ya aka. “Ma” na-egosikwa ọdịiche dị n’etiti ịnọ n’okpuru nche na inwe ohere ụfọdụ.'
- source_word: μηδένα κωλύειν
  choice: ka a ghara igbochi onye ọ bụla
  rationale: Nke a na-echekwa ike nke okwu Grik nke na-ekwu na a gaghị egbochi onye ọbụla.
- source_word: τῶν ἰδίων αὐτοῦ
  choice: n’ime ndị nke ya
  rationale: Okwu Grik ahụ akọwaghị kpọmkwem ma ha bụ ndị enyi, ndị ezinụlọ, ma ọ bụ ndị otu ya; nsụgharị a na-echekwa obosara ahụ.
- source_word: ὑπηρετεῖν αὐτῷ
  choice: ilekọta mkpa ya
  rationale: N’ọnọdụ a, ngwaa ahụ na-ezo aka n’inyere Pọl aka n’ihe ndị ọ chọrọ. Nsụgharị a doro anya ma ọ naghị etinye echiche pụrụ iche banyere ozi ụka.
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A kọwara ọkwa agha Rom kama iji okwu mbịarambịa, ma e chekwara nghọta sara mbara nke ἄνεσις na τῶν ἰδίων αὐτοῦ site na ndetu ala peeji.
