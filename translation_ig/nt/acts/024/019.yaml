  text: τινὲς δὲ ἀπὸ τῆς Ἀσίας Ἰουδαῖοι, οὓς ⸀ἔδει ἐπὶ σοῦ παρεῖναι καὶ κατηγορεῖν εἴ τι ἔχοιεν πρὸς ⸀ἐμέ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/019.yaml
  text: But there are some Jews from Asia who ought to have been present before you and to accuse me[b][a], if they had anything against me.
translation:
  language: ig
  text: Ma e nwere ụfọdụ ndị Juu si Eshia[a], bú ndị kwesịrị ịnọ ebe a n’ihu gị ma bo m ebubo[b], ma ọ bụrụ na ha nwere ihe ọ bụla megide m.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Eshia” n’ebe a bụ ógbè Rom nke dị n’Eshia Nta, ọ bụghị kọntinent Eshia nke oge a.
    reason: cultural_note
  - marker: b
    text: Ma ọ bụ, “weta ebubo megide m.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τινὲς δὲ
  choice: Ma e nwere ụfọdụ
  rationale: “Ụfọdụ” na-egosi ìgwè a na-akọwaghị ọnụ ọgụgụ ha, ebe “ma” na-egosipụta mgbanwe ma ọ bụ mmegide n’ihe Pọl na-ekwu.
- source_word: ἀπὸ τῆς Ἀσίας Ἰουδαῖοι
  choice: ndị Juu si Eshia
  rationale: Nke a bụ ụzọ Igbo dị mfe ma doo anya isi kwuo na ha bụ ndị Juu si mpaghara ahụ; nkọwa ala Rom oge ahụ dị n’ala ala peeji.
- source_word: οὓς ἔδει ἐπὶ σοῦ παρεῖναι
  choice: bú ndị kwesịrị ịnọ n’ihu gị bịa
  rationale: “Kwesịrị” na-echekwa echiche nke ọrụ ha na-emezughị, “n’ihu gị” na-egosikwa ọnọdụ ikpe n’ihu onye ọchịchị. “Bịa” na-eme ka ọ pụta ìhè na ihe a tụrụ anya ya bụ ka ha pụta n’ebe ikpe ahụ nọ.
- source_word: κατηγορεῖν
  choice: boo m ebubo
  rationale: Nke a bụ okwu Igbo ebumpụta ụwa maka ịkatọ mmadụ n’usoro ikpe ma ọ bụ iweta ebubo megide ya.
- source_word: εἴ τι ἔχοιεν πρὸς ἐμέ
  choice: ma ọ bụrụ na ha nwere ihe ọ bụla megide m
  rationale: Nke a na-echekwa obosara okwu Grik ahụ n’etinyeghị “ebubo” ọzọ n’ọnọdụ ebe isi mmalite kwuru nanị “ihe ọ bụla megide m.”
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke oge a ma nwee ugwu. A họọrọ usoro okwu a na-eji n’ikpe—“n’ihu gị” na “boo m ebubo”—ka ọnọdụ ụlọikpe doo anya, ma a hapụrụ ọnọdụ ntụgharị uche dị n’okwu ikpeazụ n’enweghị ịkọwa ya karịa isi mmalite.
