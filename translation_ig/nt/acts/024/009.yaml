translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ugwu ma dị mfe nghọta mee ihe. Ahịrịokwu ahụ na-edobe ọnọdụ ikpe nke amaokwu a, ebe nkọwa ala peeji na-egosi ike okwu συνεπέθεντο nwere ike inwe.
