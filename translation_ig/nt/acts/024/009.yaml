  text: And the Jews also joined in the charge[a], asserting that these things were so.
translation:
  language: ig
  text: Ndị Juu sonyekwara n’ịbo ebubo ahụ[a], na-ekwusi ike na ihe ndị a dị otu a.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Ndị Juu sonyekwara n’ịwakpo ahụ, na-ekwu na ihe ndị a dị otu a.”
    reason: lexical_alternative
lexical_decisions:
- source_word: συνεπέθεντο
  choice: sonyekwara n’ibo ya ebubo
  rationale: Ngwaa a nwere ike ịpụta iso ndị ọzọ wakpo mmadụ ma ọ bụ kwado ebubo ha. N’ọnọdụ ikpe a, okwu a họọrọ na-egosi na ndị Juu sonyere n’ebubo ahụ, ebe nkọwa ala peeji na-echekwa echiche siri ike nke ‘mwakpo.’
- source_word: δὲ καὶ
  choice: kwara
  rationale: Ngwakọta a na-aga n’ihu n’akụkọ ahụ ma na-egosi na ndị Juu sokwa n’ihe a na-eme; mgbakwunye ‘-kwara’ na-egosipụta nke a n’ụzọ Igbo dị mfe.
- source_word: οἱ Ἰουδαῖοι
  choice: Ndị Juu
  rationale: Nke a bụ nsụgharị kwụ ọtọ ma doo anya maka ìgwè ndị nọ n’ebe ikpe ahụ.
- source_word: φάσκοντες
  choice: na-ekwusi ike
  rationale: Okwu a na-egosi na ha kwuru okwu ndị a dị ka ihe ha na-akwado siri ike; ọ dabara n’ọnọdụ ikpe n’etinyeghị obi abụọ na-adịghị na Greek.
- source_word: ταῦτα οὕτως ἔχειν
  choice: na ihe ndị a dị otu ahụ
  rationale: Nke a na-echekwa okwu sara mbara ‘ihe ndị a’ ma na-asụgharị akpaalaokwu Greek ahụ n’Igbo eke, ya bụ na ihe ndị e kwuru bụ eziokwu dịka e si kwuo ha.
