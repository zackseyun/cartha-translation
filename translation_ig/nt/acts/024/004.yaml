translation_notes:
  register: Ejiri Igbo Izugbe nke dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-edobe olu arịrịọ nkwanye ùgwù nke onye na-ekwu okwu n'ihu onye ọchịchị, ma ihe odide ala ala na-echekwa obosara nghọta nke ἐγκόπτω na ἐπιείκεια.
