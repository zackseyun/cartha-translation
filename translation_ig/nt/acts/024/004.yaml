- from: Ma ka m ghara igbu oge gị karịa[a], ana m arịọ gị ka i jiri obiọma gị[b] gee anyị ntị ná nkenke.
  to: Ma ka m ghara igbu oge gị ọzọ[a], ana m arịọ gị ka i jiri ịdị nwayọọ gị[b] gee anyị ntị ná nkenke.
  rationale: Replaced the incomplete comparative karịa with ọzọ to render ἐπὶ πλεῖον idiomatically as “any further.” Replaced obiọma with ịdị nwayọọ to reflect the principal sense of ἐπιείκεια in a deferential legal setting, while preserving its broader range in the footnote. The verse’s ambiguity and formal register are retained.
