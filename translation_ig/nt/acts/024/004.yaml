  text: ἵνα δὲ μὴ ἐπὶ πλεῖόν σε ἐγκόπτω, παρακαλῶ ἀκοῦσαί σε ἡμῶν συντόμως τῇ σῇ ἐπιεικείᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/004.yaml
  text: But[a], so that I may not delay you any further[b], I beg you to hear us briefly, in your graciousness.
translation:
  language: ig
  text: Ma ka m ghara igbu oge gị ọzọ[a], ana m arịọ gị ka i jiri ịdị nwayọọ gị[b] gee anyị ntị ná nkenke.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “ka m ghara ijide gị ogologo oge ọzọ” ma ọ bụ “ka m ghara igbochi gị ọzọ.”
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụ ya, “jiri obiọma gị,” “site n'ebere gị,” ma ọ bụ “n'ikpe ziri ezi.” Okwu Grik ahụ nwere ike ịpụta ịdị nwayọọ, ikpe ziri ezi, ma ọ bụ imere mmadụ ebere, karịsịa mgbe a na-ekpe ikpe.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα δὲ μὴ
  choice: Ma ka m ghara
  rationale: “Ma” na-egosi ntughari dị nro, ebe “ka ... ghara” na-edobe echiche ebumnuche dị n'ἵνα μή.
- source_word: ἐπὶ πλεῖόν
  choice: karịa
  rationale: N'okwu a, ọ pụtara ime ihe gaa n'ihu ma ọ bụ were oge ọzọ; “karịa” na-enye echiche ahụ n'Igbo dị mfe.
- source_word: σε ἐγκόπτω
  choice: igbu oge gị
  rationale: N'ọnọdụ ikpe a, okwu ahụ na-ekwu maka iwepụta oge onye ọchịchị karịa, ọ bụghị igbochi ya n'ụzọ nkịtị.
- source_word: παρακαλῶ
  choice: ana m arịọ gị
  rationale: Nke a na-egosipụta arịrịọ nkwanye ùgwù nke okwu Grik ahụ nwere n'okwu e kwuru n'ihu onye ọchịchị.
- source_word: ἀκοῦσαί σε ἡμῶν
  choice: ka i ... gee anyị ntị
  rationale: Ọ bụ ụzọ Igbo sitere n'okike isi kwuo “ịnụrụ anyị” n'echiche nke ikwe ka a kwuo okwu n'ikpe.
- source_word: συντόμως
  choice: ná nkenke
  rationale: Ọ na-egosi na okwu ha ga-adị mkpirikpi.
- source_word: τῇ σῇ ἐπιεικείᾳ
  choice: i jiri obiọma gị
  rationale: “Obiọma” na-eburu echiche nke ịdị nwayọọ, ịdị mma, na imere mmadụ ebere n'enweghị ịhọrọ naanị otu n'ime ha.
