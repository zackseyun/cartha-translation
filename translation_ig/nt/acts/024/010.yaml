base_translation:
  language: en
  yaml_path: translation/nt/acts/024/010.yaml
  text: 'Then Paul answered[a], after the governor had nodded to him to speak: “Knowing that for many years you have been a judge over this nation, I gladly make my defense concerning myself.'
translation:
  language: ig
  text: 'Mgbe ahụ, mgbe gọvanọ ahụ fere Pọl isi ka o kwuo okwu, Pọl zara, sị: “Ebe m maara na ị bụworo onyeikpe nke mba a kemgbe ọtụtụ afọ, eji m obi ike[a] agbachitere onwe m.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “eji m obi ụtọ agbachitere onwe m.” Okwu Grik a nwere ike igosi ịdị njikere, inwe obi ike, ma ọ bụ inwe obi ọma; ọ bụghị naanị inwe mmetụta ọṅụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπεκρίθη τε ὁ Παῦλος
  choice: Pọl zara
  rationale: “Zara” bụ ụzọ Igbo si ekwu ἀποκρίνομαι n’ụzọ doro anya; a sụgharịrị τε site na “Mgbe ahụ” iji jikọta akụkọ ahụ n’ụzọ ebumpụta ụwa.
- source_word: νεύσαντος αὐτῷ τοῦ ἡγεμόνος λέγειν
  choice: mgbe gọvanọ ahụ kweere Pọl n’isi ka o kwuo okwu
  rationale: Nkebi ahịrịokwu a na-egosi oge ihe ahụ mere. “Kweere ... n’isi” na-echekwa mmegharị ahụ νεύω na-egosi, ebe “ka o kwuo okwu” na-enye echiche infinitive λέγειν.
- source_word: ἡγεμόνος
  choice: gọvanọ
  rationale: N’ọnọdụ a, ọ bụ onye ọchịchị Rom na-elekọta ógbè ahụ; “gọvanọ” bụ okwu a na-aghọta nke ọma n’Igbo nke oge a.
- source_word: Ἐκ πολλῶν ἐτῶν
  choice: kemgbe ọtụtụ afọ
  rationale: Nke a na-egosi oge malitere n’afọ ndị gara aga ma ruo n’oge ahụ.
- source_word: ὄντα σε κριτὴν τῷ ἔθνει τούτῳ
  choice: ị nọwo dị ka onyeikpe nke mba a
  rationale: “Ị nọwo” na-egosi ọrụ ahụ gara n’ihu ruo ọtụtụ afọ; “onyeikpe” na-echekwa ihe κριτής pụtara n’ọnọdụ ikpe a, “mba a” na-anọchi ἔθνος.
- source_word: ἐπιστάμενος
  choice: Ebe m maara
  rationale: Nke a na-egosi na ihe Pọl maara bụ ihe ndabere nke okwu ọ na-ekwu.
- source_word: εὐθύμως
  choice: eji m obi dị mma
  rationale: Nhọrọ a na-enye echiche nke ịdị njikere na inwe obi ọma n’enweghị ime ka ọ bụrụ naanị mmetụta ọṅụ; e debere “obi ike” dị ka nhọrọ ọzọ n’ala ala peeji.
- source_word: τὰ περὶ ἐμαυτοῦ ἀπολογοῦμαι
  choice: agbachitere onwe m
  rationale: N’ọnọdụ ụlọikpe, okwu a na-egosi ịza ebubo na ikwu ihe ga-agbachitere mmadụ; nsụgharị Igbo a bụ nke doro anya ma dịkwa ebumpụta ụwa.
