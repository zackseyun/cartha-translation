translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ ka nwere ụda okwu ụlọikpe, ma ọ naghị eji okwu iwu ndị siri ike nke ndị nkịtị agaghị aghọta.
