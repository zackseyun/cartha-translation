- from: Ma mgbe afọ abụọ zuru[a], Pọshiọs Festọs nọchiri Feliks n'ọchịchị. Ebe Feliks chọrọ imere ndị Juu amara, ọ hapụrụ Pọl ka e kere ya agbụ.
  to: Ma mgbe afọ abụọ zuru[a], Pọshiọs Festọs nọchiri Feliks. Ebe Feliks chọrọ imere ndị Juu amara, ọ hapụrụ Pọl n'agbụ.
  rationale: E wepụrụ nkọwa agbakwunyere «n'ọchịchị» ma dochie «hapụrụ Pọl ka e kere ya agbụ» anya na «hapụrụ Pọl n'agbụ». Nke a na-echekwa kpọmkwem echiche na Feliks hapụrụ Pọl ka ọ nọgide n'ọnọdụ e kegidere ya, ma na-eji Igbo Izugbe dị eke. Nkọwa ala peeji nke oge ka dị, n'ihi na ọ na-edobe ụzọ ọzọ a pụrụ isi sụgharị Διετίας ... πληρωθείσης.
