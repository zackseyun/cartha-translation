  text: Διετίας δὲ πληρωθείσης ἔλαβεν διάδοχον ὁ Φῆλιξ Πόρκιον Φῆστον· θέλων τε ⸀χάριτα καταθέσθαι τοῖς Ἰουδαίοις ὁ Φῆλιξ κατέλιπε τὸν Παῦλον δεδεμένον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/027.yaml
  text: But when two years had been completed[a], Felix was succeeded by Porcius Festus; and because Felix wanted to lay up favor with the Jews, he left Paul bound.
translation:
  language: ig
  text: Ma mgbe afọ abụọ zuru[a], Pọshiọs Festọs nọchiri Feliks. Ebe Feliks chọrọ imere ndị Juu amara, ọ hapụrụ Pọl n'agbụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “mgbe afọ abụọ gafesịrị.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Διετίας δὲ πληρωθείσης
  choice: Ma mgbe afọ abụọ zuru
  rationale: Nkebiokwu genitive absolute a na-egosi oge; ‘mgbe afọ abụọ zuru’ bụ Igbo nkịtị nke na-echekwa echiche na oge ahụ eruola n'uju.
- source_word: ἔλαβεν διάδοχον
  choice: Pọshiọs Festọs nọchiri Feliks n'ọchịchị
  rationale: Ọ bụ ezie na okwu Grik pụtara n'ụzọ nkịtị na Feliks ‘natara onye nọchiri ya,’ Igbo na-ekwu nke a nke ọma site n'ịsị na Festọs nọchiri ya; ‘n'ọchịchị’ na-eme ka mgbanwe ọkwa ahụ doo anya.
- source_word: Πόρκιον Φῆστον
  choice: Pọshiọs Festọs
  rationale: E degharịrị aha mmadụ ndị a n'ụdị ụda dabara n'usoro edemede Igbo.
- source_word: θέλων
  choice: Ebe Feliks chọrọ
  rationale: Participul a na-egosi ihe kpatara Feliks ji mee ihe sochirinụ; ‘ebe ... chọrọ’ na-egosipụta njikọ ahụ n'ụzọ doro anya.
- source_word: χάριτα καταθέσθαι τοῖς Ἰουδαίοις
  choice: imere ndị Juu amara
  rationale: Akpaalaokwu ahụ nwere ike ịpụta imere ha ihe ọma ma ọ bụ ịchọ inweta ihu ọma ha. Isi ederede họọrọ okwu Igbo dị nfe na nke kwekọrọ n'echiche imere ha amara, ebe nkọwa ala peeji chekwara nghọta ọzọ.
- source_word: κατέλιπε
  choice: ọ hapụrụ
  rationale: Ngwaa a na-egosi na mgbe Feliks kwụsịrị ọchịchị, ọ hapụrụ Pọl n'ọnọdụ ọ nọ na ya.
- source_word: δεδεμένον
  choice: ka e kere ya agbụ
  rationale: Nke a na-echekwa ọnọdụ na-aga n'ihu nke participul perfect passive ahụ, na-akọ na Pọl ka nọ n'agbụ, n'etinyeghị nkọwa sara mbara dịka ‘n'ụlọ mkpọrọ.’
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo Izugbe, nke oge a, dị ùgwù ma dị mfe nghọta. E ji ‘imere ndị Juu amara’ mee isi ederede maka ịdị nfe, ma chekwaa nghọta ọzọ nke χάριτα καταθέσθαι na nkọwa ala peeji.
