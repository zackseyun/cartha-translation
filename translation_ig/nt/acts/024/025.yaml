  source_fidelity: 'Ederede ahụ na-ebuga isi ihe Grik ahụ nke ọma: Pọl na-ekwu maka ezi omume, njide onwe onye, na ikpe na-abịa; Filiks atụwa ụjọ ma gwa ya ka ọ laa, kwuo na ọ ga-akpọ ya ọzọ mgbe o nwetara ohere. Otú ọ dị, μετακαλέσομαί σε pụtara ịkpọ mmadụ ka ọ bịaghachi/ka ọ bịa n’ihu mmadụ karịa naanị “akpọ gị,” nke nwere ike ịbụ ihe na-edoghị anya n’Igbo nke oge a.'
