  variant: Standard Igbo
source:
  edition: SBLGNT
  text: διαλεγομένου δὲ αὐτοῦ περὶ δικαιοσύνης καὶ ἐγκρατείας καὶ τοῦ κρίματος τοῦ ⸀μέλλοντος ἔμφοβος γενόμενος ὁ Φῆλιξ ἀπεκρίθη· Τὸ νῦν ἔχον πορεύου, καιρὸν δὲ μεταλαβὼν μετακαλέσομαί σε·
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/025.yaml
  text: But as he was discussing righteousness and self-control and the coming judgment, Felix became afraid and answered, “For now, go away. When I get an opportunity, I will summon you.”
translation:
  language: ig
  text: Ma mgbe ọ na-ekwu okwu banyere ezi omume, njide onwe onye, na ikpe ahụ na-abịa, egwu jidere Filiks, o wee zaa, sị, “Ka ọ dị ugbu a, pụọ. Mgbe m nwetara ohere, aga m akpọ gị ka ị bịa.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διαλεγομένου
  choice: mgbe ọ na-akparịta ụka
  rationale: Na-egosi na Pọl nọ na-akọwa ma na-atụle ihe ndị a, ọ bụghị nanị ikwu okwu n’elu ha.
- source_word: δικαιοσύνης
  choice: ezi omume
  rationale: Okwu Igbo a na-enye nghọta nke ibi ndụ ziri ezi n’ihu Chineke na mmadụ, n’enweghị ịgbakwụnye nkọwa otu ụka.
- source_word: ἐγκρατείας
  choice: njide onwe onye
  rationale: Na-egosipụta ikike mmadụ ijide ọchịchọ na omume ya.
- source_word: τοῦ κρίματος τοῦ μέλλοντος
  choice: ikpe ahụ nke na-abịa
  rationale: Na-edobe ntụaka doro anya nke Grik banyere ikpe a na-atụ anya ya, na-enweghị ịkọwapụta karịa isi mmalite.
- source_word: ἔμφοβος γενόμενος
  choice: egwu jidere
  rationale: Nke a bụ ụzọ Igbo dị ndụ ma kwekọọ n’echiche na Filiks ghọrọ onye ụjọ jidere.
- source_word: Τὸ νῦν ἔχον πορεύου
  choice: Ugbu a, lawa
  rationale: Na-enye iwu ahụ n’Igbo nkịtị ma na-edobe echiche ‘maka ugbu a’.
- source_word: καιρὸν δὲ μεταλαβὼν
  choice: Mgbe m nwetara ohere
  rationale: Na-egosipụta oge ma ọ bụ ohere kwesịrị ekwesị Filiks kwuru na ọ ga-enweta.
- source_word: μετακαλέσομαί σε
  choice: aga m akpọ gị
  rationale: Na-ebute echiche nke iziga ka a kpọghachite Pọl, n’ụzọ Igbo dị mfe.
theological_decisions:
- issue: Ihe ‘ikpe ahụ nke na-abịa’ pụtara
  choice: ikpe ahụ nke na-abịa
  alternative: ikpe ikpeazụ
  rationale: Edebere okwu isi mmalite n’enweghị ịkpọ ya kpọmkwem ‘ikpe ikpeazụ,’ ka a ghara ịgbakwụnye nkọwa nke ederede ahụ ekwughị n’onwe ya.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ugwu ma dị mfe nghọta. Ahịrịokwu ahụ na-edobe usoro isi echiche atọ Pọl tụlere na mmeghachi omume Filiks.
