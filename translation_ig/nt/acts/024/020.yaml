  text: Or let these men themselves say what wrongdoing they found when I stood before the council,[a]
translation:
  language: ig
  text: Ma ọ bụ ka ndị a n’onwe ha kwuo mmejọ dị aṅaa ha hụrụ mgbe m guzoro n’ihu kansụl ahụ.[a]
  philosophy: optimal-equivalence
  footnotes:
