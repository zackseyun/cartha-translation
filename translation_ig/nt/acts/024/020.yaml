lexical_decisions:
- source_word: ἢ
  choice: Ma ọ bụ
  rationale: Ọ na-ewebata ihe ọzọ Pọl ji ama ndị na-ebo ya ebubo aka; “Ma ọ bụ” na-egosipụta njikọ ahụ n’ụzọ Igbo si ada nke ọma.
- source_word: αὐτοὶ οὗτοι
  choice: ndị ikom a n’onwe ha
  rationale: Nke a na-edobe ma nrụtụ aka dị na οὗτοι ma nkwusi ike dị na αὐτοί.
- source_word: εἰπάτωσαν
  choice: ka ... kwuo
  rationale: Ọ bụ iwu nke onye nke atọ n’okwu ikpe; usoro “ka ... kwuo” bụ ụzọ Igbo doro anya isi gosi ya.
- source_word: τί εὗρον ἀδίκημα
  choice: ajọ omume ha chọpụtara na m mere
  rationale: ἀδίκημα bụ omume na-ezighị ezi ma ọ bụ mmejọ iwu, ọ bụghị naanị mpụ siri ike. Ịsị “na m mere” na-eme ka njikọ ahụ doo anya n’Igbo n’enweghị ime ka ebubo ahụ sie ike karịa Grik.
- source_word: στάντος μου
  choice: mgbe m guzoro
  rationale: Na-egosipụta oge nke participle a n’ụzọ dị mkpirikpi ma kwekọọ n’okwu ikpe.
- source_word: ἐπὶ τοῦ συνεδρίου
  choice: n’ihu ndị kansụl ahụ
  rationale: N’ebe a συνέδριον na-ezo aka n’ọgbakọ ndị ọchịchị ndị Juu; “n’ihu ndị kansụl ahụ” na-egosipụta na Pọl pụtara n’ihu ha, ma nkọwa ala peeji na-enye aha pụrụ iche.
