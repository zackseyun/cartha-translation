revisions:
- from: Mgbe ụbọchị ole na ole gachara, Feliks bịara ya na Drusila, bú nwunye nke ya, onye Juu. O zigara ka a kpọta Pọl, gee ya ntị ka ọ na-ekwu banyere okwukwe e nwere n’ebe Jizọs bú Mezaịa[a] nọ.[b]
  to: Mgbe ụbọchị ole na ole gachara, Feliks bịara ya na Drusila, nwunye ya, onye Juu; o zitere ka a kpọọ Pọl wee gee ya ntị banyere okwukwe e nwere n’ebe Jizọs bụ Mezaịa[a] nọ.[b]
  rationale: 'The revision corrects the idiomatic expression for accompaniment, improves natural Standard Igbo possessive phrasing, and regularizes orthography. It retains the source''s sequence and scope: Felix came with Drusilla, sent for Paul, and listened to him concerning faith in Jesus the Messiah. The two footnotes remain anchored and preserve the stated lexical alternatives without introducing doctrinal interpretation.'
