id: ACT.24.24
reference: Acts 24:24
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Μετὰ δὲ ἡμέρας τινὰς παραγενόμενος ὁ Φῆλιξ σὺν Δρουσίλλῃ τῇ ⸀ἰδίᾳ γυναικὶ οὔσῃ Ἰουδαίᾳ μετεπέμψατο τὸν Παῦλον καὶ ἤκουσεν αὐτοῦ περὶ τῆς εἰς Χριστὸν ⸀Ἰησοῦν πίστεως.
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/024.yaml
  text: After some days[a], Felix came with Drusilla, his own wife, who was Jewish[b], and sent for Paul and heard him concerning faith in Messiah Jesus.
translation:
  language: ig
  text: Mgbe ụbọchị ole na ole gachara, Feliks bịara ya na Drusila, nwunye ya, onye Juu; o zitere ka a kpọọ Pọl wee gee ya ntị banyere okwukwe e nwere n’ebe Jizọs bụ Mezaịa[a] nọ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “Kraịst Jizọs.” Okwu Grik bụ Χριστός, nke pụtara “Mezaịa” ma ọ bụ “Onye E Tere Mmanụ.”
    reason: alternative_rendering
  - marker: b
    text: A pụkwara ịsị, “ntụkwasị obi e nwere n’ebe Jizọs bụ Mezaịa nọ.” Okwu Grik πίστις pụrụ ịpụta “okwukwe” ma ọ bụ “ntụkwasị obi” n’ebe a.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δὲ ἡμέρας τινὰς
  choice: Mgbe ụbọchị ole na ole gachara
  rationale: 'Nke a na-enye nkọwa oge ahụ n’Igbo eke: ‘mgbe ụbọchị ole na ole gachara.’ A naghị etinye okwu pụrụ iche maka δέ n’ihi na usoro ahịrịokwu Igbo na-eburu njikọ akụkọ ahụ nke ọma.'
- source_word: παραγενόμενος
  choice: bịara ya
  rationale: Ngwaa a na-egosi na Feliks bịarutere n’ebe ahụ; ‘bịara ya’ bụ okwu Igbo dị mfe ma dabara n’usoro akụkọ.
- source_word: σὺν Δρουσίλλῃ
  choice: ya na Drusila
  rationale: Ọ na-egosi na Drusila so Feliks bịa.
- source_word: τῇ ἰδίᾳ γυναικὶ
  choice: bú nwunye nke ya
  rationale: ‘Nke ya’ na-echekwa nkwusi ike dị na ἰδίᾳ karịa naanị ‘nwunye ya.’
- source_word: οὔσῃ Ἰουδαίᾳ
  choice: onye Juu
  rationale: Nke a na-akọwa Drusila dị ka nwanyị sitere n’agbụrụ ma ọ bụ okpukpe ndị Juu, n’asụsụ Igbo nke oge a na-enweghị iji okwu ochie ma ọ bụ okwu nlelị.
- source_word: μετεπέμψατο
  choice: zigara ka a kpọta
  rationale: Ngwaa ahụ pụtara iziga mmadụ ka ọ kpọta onye ọzọ; nsụgharị a bụ nke doro anya ma bụrụkwa Igbo eke.
- source_word: ἤκουσεν αὐτοῦ
  choice: gee ya ntị
  rationale: N’ọnọdụ a, ἀκούω tinyere genitive pụtara ige mmadụ ntị, ọ bụghị naanị ịnụ ụda olu ya.
- source_word: περὶ τῆς ... πίστεως
  choice: banyere okwukwe
  rationale: περί na-egosi isiokwu Pọl kwuru banyere ya, ebe πίστις bụ ‘okwukwe’; a hapụrụkwa echiche ‘ntụkwasị obi’ n’okpuru peeji.
- source_word: εἰς Χριστὸν Ἰησοῦν
  choice: n’ebe Jizọs bú Mezaịa nọ
  rationale: εἰς na-egosi onye okwukwe ahụ chere ihu. ‘Jizọs bú Mezaịa’ bụ Igbo eke nke na-edobe Χριστός dị ka utu aha, kama ime ka ọ bụrụ naanị aha ọzọ.
theological_decisions:
- issue: Nsụgharị Χριστός
  choice: Jizọs bú Mezaịa
  alternative: Kraịst Jizọs
  rationale: Χριστός na-arụ ọrụ dị ka utu aha n’ebe a. ‘Jizọs bú Mezaịa’ na-eme ka nke ahụ doo anya n’Igbo, ebe a na-edobe ụdị a maara nke ọma, ‘Kraịst Jizọs,’ n’okpuru peeji.
- issue: Ihe τῆς εἰς Χριστὸν Ἰησοῦν πίστεως pụtara
  choice: okwukwe e nwere n’ebe Jizọs bú Mezaịa nọ
  alternative: ntụkwasị obi e nwere n’ebe Jizọs bú Mezaịa nọ
  rationale: πίστις tinyere εἰς na accusative na-egosikarị okwukwe ma ọ bụ ntụkwasị obi a tụkwasịrị n’ebe mmadụ nọ. ‘Okwukwe’ bụ nhọrọ bụ isi, ma a na-echekwa ‘ntụkwasị obi’ dịka ụzọ ọzọ okwu ahụ pụrụ isi pụta.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu abụọ na-eme ka ogologo usoro Grik ahụ doo anya n’Igbo. E debere nkwusi ike dị na ‘nwunye nke ya,’ ma e zere imechi mgbagwoju anya nke πίστις kpamkpam site n’itinye nhọrọ ‘ntụkwasị obi’ n’okpuru peeji.
