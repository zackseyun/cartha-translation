    text: A pụkwara ịsị, “Kraịst Jizọs.” Okwu Grik bụ Χριστός, nke pụtara “Mezaịa” ma ọ bụ “Onye E Tere Mmanụ.”
    reason: alternative_rendering
  - marker: b
