id: ACT.24.5
reference: Acts 24:5
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εὑρόντες γὰρ τὸν ἄνδρα τοῦτον λοιμὸν καὶ κινοῦντα ⸀στάσεις πᾶσι τοῖς Ἰουδαίοις τοῖς κατὰ τὴν οἰκουμένην πρωτοστάτην τε τῆς τῶν Ναζωραίων αἱρέσεως,
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/005.yaml
  text: For we have found this man to be a plague, stirring up riots among all the Jews throughout the inhabited world, and also a ringleader of the sect of the Nazarenes,
translation:
  language: ig
  text: N’ihi na anyị achọpụtala na nwoke a bụ ihe otiti, onye na-akpalite ọgba aghara n’etiti ndị Juu niile n’ụwa mmadụ bi, bụrụkwa onye ndu nke òtù ndị Nazaret,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λοιμόν
  choice: ajọ ihe otiti
  rationale: Okwu a pụtara ihe otiti ma ọ bụ onye na-eweta nnukwu nsogbu; n’ebe a, ọ bụ okwu ebubo siri ike e ji akọwa Pọl dị ka onye na-emebi ọha mmadụ.
- source_word: κινοῦντα στάσεις
  choice: onye na-akpalite ọgba aghara
  rationale: Nkebi a na-egosi ịkpalite nnupụisi ma ọ bụ ọgba aghara ọha; ntụgharị a doro anya n’Igbo ma ghara ikwubiga ihe akaebe ahụ ókè.
- source_word: οἰκουμένην
  choice: ụwa mmadụ bi
  rationale: N'ụzọ nkịtị, ọ bụ ụwa mmadụ bi; n'ọnọdụ Rom oge ahụ, ọ na-ezo aka n'ụwa a maara ma ọ bụ nke ọchịchị Rom, ma a hapụrụ oke okwu ebubo ahụ ka ọ dị.
- source_word: πρωτοστάτην
  choice: onyeisi
  rationale: Ọ pụtara onye nọ n’ihu ma ọ bụ onye ndu; “onyeisi” bụ okwu Igbo dị mfe ma kwesị ekwesị maka onye a na-ebo ebubo na ọ na-edu òtù ahụ.
- source_word: αἱρέσεως
  choice: òtù okpukpe
  rationale: N’ebe a, okwu ahụ pụtara otu ma ọ bụ ngalaba okpukpe, ọ bụghị ozizi ụgha n’onwe ya; nhọrọ a na-ezere itinye ikpe okpukpe na-adịghị n’ụdị okwu ahụ.
- source_word: Ναζωραίων
  choice: ndị Nazaret
  rationale: Aha a bụ aha ndị mmegide kpọrọ ndị na-eso Jizọs onye Nazaret; e debere njikọ ya na Nazaret n’ụzọ ndị Igbo ga-aghọta.
theological_decisions:
- issue: Ma αἵρεσις ga-apụta “ịrọ òtù,” “ngalaba,” ma ọ bụ “òtù ozizi ụgha”
  choice: òtù okpukpe
  alternative: ngalaba okpukpe / òtù ozizi ụgha
  rationale: Okwu Grik ahụ nwere ike ịpụta òtù ma ọ bụ ngalaba; n'okwu ikpe a ọ bụ aha ebubo, ya mere e kwesịghị iji ntụgharị ahụ kpebie na okwukwe ndị Kraịst bụ ozizi ụgha.
- issue: Ike ebubo dị na λοιμός
  choice: ajọ ihe otiti
  alternative: onye na-enye nnukwu nsogbu
  rationale: E chekwara ihe atụ siri ike nke ihe otiti dị n’akwụkwọ mbụ, ebe ọ bụ okwu onye ọka iwu ji kwutọọ Pọl, ọ bụghị nkwupụta onye dere akwụkwọ banyere àgwà Pọl.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-aga n’ihu dịka akụkụ nke okwu ebubo Tẹtụlọs; akara rikọm n’ọgwụgwụ na-egosi na amaokwu na-esonụ ga-emecha echiche ahụ.
