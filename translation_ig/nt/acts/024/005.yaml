    issue: “ajọ ihe otiti” is redundant and less idiomatic for λοιμός.
    rationale: The source uses the strong metaphor “plague/pest”; “ihe otiti” preserves that image without adding “ajọ,” which is not needed to convey its force.
  - severity: low
    issue: “onyeisi” understates the charged leadership nuance of πρωτοστάτης.
    rationale: “Onye ndu” naturally identifies him as a leading figure; in the forensic context the accusation itself supplies the hostile force comparable to “ringleader.”}],
