  text: δι’ ἐτῶν δὲ πλειόνων ⸂ἐλεημοσύνας ποιήσων εἰς τὸ ἔθνος μου παρεγενόμην⸃ καὶ προσφοράς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/017.yaml
  text: After several years I came to bring alms to my nation[a], and offerings.
translation:
  language: ig
  text: Mgbe ọtụtụ afọ gasịrị, abịara m iwetara mba m onyinye ebere[a] na onyinye.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ihe enyemaka ebere” ma ọ bụ “alụm.” Okwu Grik a na-ezo aka n'onyinye e nyere ndị nọ ná mkpa.
    reason: lexical_alternative
lexical_decisions:
- source_word: δι’ ἐτῶν δὲ πλειόνων
  choice: Mgbe ọtụtụ afọ gasịrị
  rationale: Nkebiokwu a na-egosi na ọtụtụ afọ agafeela tupu ihe a emee. A hapụrụ δέ ka usoro okwu Igbo na njikọ ya na amaokwu ndị gbara ya gburugburu gosipụta ya, ka a ghara ime ka ọ bụrụ ntụgharị siri ike karịa ka ọ dị na Grik.
- source_word: ἐλεημοσύνας
  choice: ihe enyemaka maka ndị ogbenye[a]
  rationale: Okwu a pụtara onyinye ma ọ bụ enyemaka e nyere ndị ogbenye na ndị nọ ná mkpa. Nsụgharị a doro onye Igbo nke oge a anya ma zere okwu ochie ma ọ bụ nke pụrụ iyi okwu ụka pụrụ iche.
- source_word: ποιήσων
  choice: iwetara
  rationale: Ọ bụ ezie na ποιέω na-apụtakarị ‘ime,’ ya na ἐλεημοσύνας bụ akpaala okwu nke pụtara inye ma ọ bụ iweta onyinye ebere. ‘Iwetara’ kwekọrọ na njem Pọl bịara Jerusalem.
- source_word: εἰς τὸ ἔθνος μου
  choice: ndị obodo m
  rationale: ἔθνος n'ebe a na-ezo aka n'ebo Izrel, bụ́ ndị Pọl. ‘Ndị obodo m’ bụ okwu Igbo dị ndụ nke na-egosi ndị nke ya n'ebughị ụzọ kpebie ma ọ bụ naanị ala, agbụrụ, ma ọ bụ ọchịchị ka okwu ahụ pụtara.
- source_word: παρεγενόμην
  choice: abịara m
  rationale: Ngwaa ahụ na-egosi ọbịbịa Pọl n'ebe ahụ. ‘Abịara m’ dị nkenke ma bụrụkwa Igbo nkịtị.
- source_word: προσφοράς
  choice: onyinye
  rationale: Okwu Grik a nwere ike ịpụta onyinye, karịsịa nke metụtara ofufe. E jighị ‘àjà’ mee ya n'ihi na nke ahụ ga-eme ka ụdị onyinye ahụ doo anya karịa ihe odide Grik mere.
theological_decisions:
- issue: Ụdị enyemaka Pọl wetara Jerusalem
  choice: ihe enyemaka maka ndị ogbenye
  alternative: ọrụ ebere; onyinye ebere
  rationale: Mkpebi a bụ nke mkpụrụokwu, ọ bụghị itinye ozizi. Ọ na-eme ka ebumnuche enyemaka ahụ doo anya n'Igbo nke oge a ma na-edebe echiche nke inye ndị nọ ná mkpa ihe.
- issue: Ụdị προσφοράς Pọl wetara
  choice: onyinye
  alternative: àjà; onyinye a na-enye Chineke
  rationale: Ihe odide Grik akọwaghị kpọmkwem ụdị onyinye ndị ahụ. Ya mere, a họọrọ okwu sara mbara ka a ghara ịmanye nghọta banyere àjà ma ọ bụ usoro ofufe pụrụ iche.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. A họọrọ ‘ndị obodo m’ kama ‘mba m’ n'ihi na ọ na-ada ka okwu mmadụ na-ekwu banyere ndị nke ya, ma ọ ka na-edebe echiche nke ἔθνος. E debere ‘onyinye’ n'ụzọ sara mbara iji chekwaa nghọta a na-akọwaghị nke προσφοράς.
