id: ACT.24.26
reference: Acts 24:26
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἅμα καὶ ἐλπίζων ὅτι χρήματα δοθήσεται αὐτῷ ὑπὸ τοῦ ⸀Παύλου· διὸ καὶ πυκνότερον αὐτὸν μεταπεμπόμενος ὡμίλει αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/026.yaml
  text: At the same time he was hoping that money would be given to him by Paul[a]; therefore he also sent for him more often and talked with him.
translation:
  language: ig
  text: N’otu oge ahụkwa, ọ nọ na-atụ anya na Pọl ga-enye ya ego[a]. Ọ bụ ya mere o ji na-akpọ Pọl ka ọ bịa ugboro ugboro karị, na-akparịtakwa ụka na ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n’ụzọ dabara n’ọnọdụ a nke ọma karị, “ọ nọ na-atụ anya ịnata ngarị n’aka Pọl.” Okwu Grik ahụ kwuru naanị “ego.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἅμα καὶ
  choice: N’otu oge ahụkwa
  rationale: Nke a na-egosi na atụmanya ahụ na ihe ndị a kọrọ tupu ya na-aga n’otu oge, ma na-edebekwa echiche nke καί n’ụzọ Igbo na-aga nke ọma.
- source_word: ἐλπίζων
  choice: ọ nọ na-atụ anya
  rationale: Ụdị a na-egosi atụmanya na-aga n’ihu n’oge ihe ndị ọzọ a na-akọ mere.
- source_word: χρήματα
  choice: ego
  rationale: Okwu Grik ahụ pụtara ego n’ozuzu ya. Ọnọdụ akụkọ ahụ na-egosi na ọ pụrụ ịbụ ngarị, ma isi ederede ekwesịghị ime ka okwu ahụ kpọọ ya ngarị ozugbo.
- source_word: δοθήσεται αὐτῷ ὑπὸ τοῦ Παύλου
  choice: Pọl ga-enye ya
  rationale: Igbo na-adịkarị eke karịa mgbe e tinyere onye na-eme ihe n’isi ahịrịokwu. Nke a ka na-edobe Pọl dị ka onye Feliks tụrụ anya na ego ga-esi n’aka ya bịa.
- source_word: διὸ καὶ
  choice: Ọ bụ ya mere ... ji
  rationale: Nke a na-egosi nke ọma na omume Feliks sochiri n’ihi atụmanya ego ahụ; echiche nke καί pụtara site n’usoro omume abụọ jikọrọ ọnụ.
- source_word: πυκνότερον
  choice: ugboro ugboro karị
  rationale: Nke a na-edobe ntụnyere dị n’okwu Grik ahụ, ya bụ, na ọ na-akpọ ya ọtụtụ ugboro karịa ka ọ na-emebu.
- source_word: μεταπεμπόμενος
  choice: na-akpọ Pọl ka ọ bịa
  rationale: Nke a bụ ụzọ Igbo doro anya na eke isi kwuo na Feliks zigara ka a kpọta Pọl n’ebe ọ nọ.
- source_word: ὡμίλει αὐτῷ
  choice: na-akparịtakwa ụka na ya
  rationale: Okwu a na-egosi mkparịta ụka mmadụ na ibe ya, ọ bụghị naanị ikwu okwu n’ihu mmadụ.
theological_decisions:
- issue: Ma a ga-akpọ ego ahụ ‘ngarị’ kpọmkwem n’isi ederede
  choice: Jiri ‘ego’ n’isi ederede, hapụkwa ka ọnọdụ akụkọ ahụ gosi ebumnobi ọjọọ Feliks.
  alternative: ọ nọ na-atụ anya na Pọl ga-enye ya ngarị
  rationale: χρήματα pụtara ‘ego,’ ọ bụghị okwu pụrụ iche maka ‘ngarị.’ Ọ bụ ezie na ọnọdụ ahụ na-egosi ngarị, nsụgharị kwesịrị idebe okwu isi mmalite ma kọwaa nghọta ahụ n’ala ala peeji.
translation_notes:
  register: Asụsụ Igbo izugbe, nke oge a ma dị ùgwù. E ji ‘na-akparịta ụka’ gosi mkparịta ụka a na-eme ugboro ugboro, ma zere okwu chọọchị pụrụ iche ma ọ bụ nkọwa okpukpe e tinyere n’ime ederede.
