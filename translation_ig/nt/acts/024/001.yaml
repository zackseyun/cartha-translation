source:
  edition: SBLGNT
  text: Μετὰ δὲ πέντε ἡμέρας κατέβη ὁ ἀρχιερεὺς Ἁνανίας μετὰ ⸂πρεσβυτέρων τινῶν⸃ καὶ ῥήτορος Τερτύλλου τινός, οἵτινες ἐνεφάνισαν τῷ ἡγεμόνι κατὰ τοῦ Παύλου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/001.yaml
  text: After five days[a], the high priest Ananias came down with some elders and a certain orator named Tertullus, and they brought charges against Paul before the governor.
translation:
  language: ig
  text: Mgbe ụbọchị ise gasịrị, Ananayas, onyeisi nchụàjà, rịdata, ya na ụfọdụ ndị okenye na otu ọkà okwu aha ya bụ Tatọlọs.[a] Ha wee boro Pọl ebubo n’ihu gọvanọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “onye na-ekwuchitere mmadụ n’okwu ikpe aha ya bụ Tatọlọs”; okwu Grik ahụ nwere ike izo aka n’ọkà okwu ọha ma ọ bụ n’onye na-ekwuchitere mmadụ n’okwu ikpe.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δὲ πέντε ἡμέρας
  choice: Mgbe ụbọchị ise gasịrị
  rationale: μετά na accusative na-egosi oge gafere; nsụgharị a bụ Igbo nkịtị ma doo anya. A naghị atụgharị δέ iche n’ebe a, n’ihi na usoro akụkọ ahụ na-egosipụta njikọ ya nke ọma.
- source_word: κατέβη
  choice: si n’ebe ahụ rịdata
  rationale: Na-echekwa ntụziaka ‘ịdata’ dị na καταβαίνω, nke dabara na njem sitere na Jerusalem ruo Sesaria; ‘si n’ebe ahụ’ na-eme ka ahịrịokwu ahụ bụrụ Igbo dị mma n’enweghị itinye ebe a na-akpọghị aha.
- source_word: ὁ ἀρχιερεὺς
  choice: onyeisi nchụàjà
  rationale: Na-egosi ọkwa onye bụ nnukwu onye nchụàjà ndị Juu, ọ bụghị naanị otu n’ime ndị isi nchụàjà.
- source_word: Ἁνανίας
  choice: Ananayas
  rationale: A sụgharịrị aha ahụ n’ụdị mkpọpụta dabara n’usoro ide aha Bible n’Igbo.
- source_word: μετὰ πρεσβυτέρων τινῶν
  choice: ya na ụfọdụ ndị okenye
  rationale: τινῶν bụ ihe na-akọwaghị kpọmkwem; ‘ụfọdụ’ na-echekwa nke ahụ. N’ebe a, ndị okenye bụ ndị ndu Juu.
- source_word: ῥήτορος Τερτύλλου τινός
  choice: otu ọkà n’ikwu okwu n’ụlọikpe aha ya bụ Tatọlọs[a]
  rationale: ῥήτωρ nwere ike ịbụ ọkà okwu ọha ma ọ bụ onye na-ekwuchitere mmadụ n’okwu ikpe. Isi ederede na-eme ka ọnọdụ ikpe pụta ìhè, ebe ndetu ala na-echekwa obosara okwu Grik ahụ.
- source_word: οἵτινες
  choice: Ha wee
  rationale: Na-amalite omume ndị ahụ a kpọrọ aha n’ụzọ akụkọ Igbo dị mfe, ma na-echekwa onye nnọchiaha ọtụtụ.
- source_word: ἐνεφάνισαν
  choice: boo ... ebubo
  rationale: N’ọnọdụ ikpe a, ἐμφανίζω pụtara ime ka ebubo megide mmadụ ruo n’ihu onye ọchịchị; ‘boo ebubo’ bụ okwu Igbo doro anya maka nke a.
- source_word: τῷ ἡγεμόνι
  choice: n’ihu gọvanọ
  rationale: Ọ bụ gọvanọ Rom ka ἡγεμών na-ezo aka; ‘n’ihu’ dabara n’asụsụ ikpe Igbo.
- source_word: κατὰ τοῦ Παύλου
  choice: boo Pọl ebubo
  rationale: κατά na genitive n’okwu ikpe pụtara ‘megide’; nhazi ngwaa Igbo ‘boo Pọl ebubo’ na-ebute otu ihe ahụ n’ụzọ ebumpụta ụwa.
theological_decisions: []
translation_notes:
  register: Standard Igbo dị ugbu a, nke dị ugwu ma dị mfe nghọta. A họọrọ ‘onyeisi nchụàjà,’ ‘ndị okenye,’ na ‘gọvanọ’ maka nghọta ndị na-agụ Bible n’Igbo; e zere okwu ụka pụrụ iche na nkọwa okpukpe a na-etinyeghị na isi mmalite.
