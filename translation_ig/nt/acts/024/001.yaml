revisions:
- from: Mgbe ụbọchị ise gasịrị, Ananayas onyeisi nchụàjà si n’ebe ahụ rịdata, ya na ụfọdụ ndị okenye na otu ọkà n’ikwu okwu n’ụlọikpe aha ya bụ Tatọlọs.[a] Ha wee gaa n’ihu gọvanọ boo Pọl ebubo.
  to: Mgbe ụbọchị ise gasịrị, Ananayas, onyeisi nchụàjà, rịdata, ya na ụfọdụ ndị okenye na otu ọkà okwu aha ya bụ Tatọlọs.[a] Ha wee boro Pọl ebubo n’ihu gọvanọ.
  rationale: Removed additions not expressed in the Greek (“si n’ebe ahụ” and the separate action “gaa”), while retaining the directional force of κατέβη with “rịdata.” Simplified the rendering of ῥήτωρ in the main text and adjusted the footnote so that it preserves the legal-spokesman alternative without adding an explicit representative relationship.
