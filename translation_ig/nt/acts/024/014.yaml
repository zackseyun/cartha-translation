- from: 'Ma nke a ka m na-ekwupụtara gị: dịka Ụzọ ahụ ha na-akpọ òtù[a] si dị, otu ahụ ka m si efe Chineke nna nna anyị[b], na-ekwere ihe niile e dere n’Iwu nakwa n’akwụkwọ Ndị Amụma.'
  to: 'Ma ana m ekwupụtara gị nke a: dịka Ụzọ ahụ, nke ha na-akpọ òtù[a], si dị, otu ahụ ka m si efe Chineke nke nna nna anyị[b], na-ekwere ihe niile e dere n’Iwu nakwa n’akwụkwọ Ndị Amụma.'
