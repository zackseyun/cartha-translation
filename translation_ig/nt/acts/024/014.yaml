id: ACT.24.14
reference: Acts 24:14
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁμολογῶ δὲ τοῦτό σοι ὅτι κατὰ τὴν ὁδὸν ἣν λέγουσιν αἵρεσιν οὕτως λατρεύω τῷ πατρῴῳ θεῷ, πιστεύων πᾶσι τοῖς κατὰ τὸν νόμον καὶ ⸂τοῖς ἐν⸃ τοῖς προφήταις γεγραμμένοις,
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/014.yaml
  text: But I confess this to you[a], that according to the Way, which they call a sect, so I worship the God of our fathers, believing everything written in the Law and in the Prophets[b],
translation:
  language: ig
  text: 'Ma ana m ekwupụtara gị nke a: dịka Ụzọ ahụ, nke ha na-akpọ òtù[a], si dị, otu ahụ ka m si efe Chineke nke nna nna anyị[b], na-ekwere ihe niile e dere n’Iwu nakwa n’akwụkwọ Ndị Amụma.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya ‘ìgwè’ ma ọ bụ ‘otu ndị nwere echiche nke ha.’ Okwu Grik ahụ nwere ike ịpụta òtù ma ọ bụ ìgwè dị n’etiti ndị ọzọ; n’ebe a, ọ pụtaghị kpọmkwem ‘ozizi ụgha.’
    reason: lexical_alternative
  - marker: b
    text: Okwu Grik ahụ pụtara ‘Chineke nna nna’ ma ọ bụ ‘Chineke nke ndị bu ụzọ’; ihe ọ pụtara bụ Chineke ndị nna nna Izrel fere.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁμολογῶ
  choice: ka m na-ekwupụtara gị
  rationale: N’ebe a, okwu ahụ na-egosi na Pọl ji ọnụ ya kwuo hoo haa ihe ọ na-anabata n’ihu Feliks; ‘na-ekwupụtara’ na-edobe ụda okwu ikpe ahụ n’enweghị echiche na ọ kwetara na o mere mpụ.
- source_word: κατὰ τὴν ὁδόν
  choice: dịka Ụzọ ahụ ... si dị
  rationale: ‘Ụzọ ahụ’ bụ aha a na-akpọ ndị na-eso Jizọs n’akwụkwọ Ọrụ Ndị Ozi; mkpụrụedemede ukwu na-egosi na ọ bụ aha pụrụ iche, ebe ‘dịka ... si dị’ na-egosi nkwụkọrịta nke κατά.
- source_word: αἵρεσιν
  choice: òtù
  rationale: N’ọnọdụ a, okwu Grik ahụ pụtara otu ma ọ bụ ìgwè e ji kewaa ndị mmadụ, ọ bụghị ‘ozizi ụgha’ dịka okwu ‘heresy’ si pụta n’oge ndị mechara.
- source_word: οὕτως λατρεύω
  choice: otu ahụ ka m si efe
  rationale: ‘Otu ahụ’ jikọtara ụzọ Pọl si efe Chineke na ‘Ụzọ ahụ’ e kwuru tupu ya; ‘efe’ bụ okwu Igbo doro anya maka ọrụ ofufe a na-enye Chineke.
- source_word: τῷ πατρῴῳ θεῷ
  choice: Chineke nna nna anyị
  rationale: Nke a na-egosi Chineke ndị nna nna Izrel fere ma na-edobe nkwupụta Pọl na ofufe ya na-aga n’ihu n’okwukwe Izrel.
- source_word: πιστεύων πᾶσι τοῖς ... γεγραμμένοις
  choice: na-ekwere ihe niile e dere
  rationale: Nke a na-edobe njikọ participle ahụ na ofufe Pọl ma gosipụta na ọ na-ekwere ihe niile Akwụkwọ Nsọ ahụ kwuru.
- source_word: κατὰ τὸν νόμον καὶ τοῖς ἐν τοῖς προφήταις γεγραμμένοις
  choice: n’Iwu nakwa n’akwụkwọ Ndị Amụma
  rationale: Nsụgharị a na-edobe nkewa Akwụkwọ Nsọ ndị Juu n’etiti Iwu na Ndị Amụma, ma ‘akwụkwọ’ na-eme ka o doo anya na a na-ekwu banyere ihe odide amụma.
theological_decisions:
- issue: Mmekọrịta dị n’etiti Ụzọ ahụ na okwukwe Izrel
  choice: Pọl kwuru na site n’Ụzọ ahụ ka ọ na-efe Chineke nna nna Izrel ma kwere ihe niile dị n’Iwu na n’akwụkwọ Ndị Amụma.
  alternative: Ịkọwa Ụzọ ahụ dịka okpukpe ọzọ e kewapụrụ kpamkpam n’okwukwe ndị Juu.
  rationale: Amaokwu Grik ahụ n’onwe ya jikọtara Ụzọ ahụ, ofufe Chineke nna nna, na nkwenye n’Akwụkwọ Nsọ Izrel; ya mere, a hapụrụ njikọ na esemokwu nkà mmụta okpukpe ahụ ka ha dị.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A hapụrụ ‘Ụzọ ahụ’ dịka aha pụrụ iche n’akụkọ Ọrụ Ndị Ozi. E debere akara nkọwa [a] n’akụkụ ‘òtù’ na [b] n’akụkụ ‘Chineke nna nna anyị,’ ebe ha kwekọrọ n’okwu ndị ha na-akọwa.
