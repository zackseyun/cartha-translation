    text: A pụkwara ịsụ ya, “ebe ị pụrụ inyocha ma mata nke a.”
    reason: lexical_alternative
  revision_rationale: 'The revised wording preserves every source element while improving Standard Igbo idiom: it retains the conventional upward journey to Jerusalem, expresses elapsed time clearly, and uses a natural purpose construction for worship without supplying an object not stated in Greek.'
