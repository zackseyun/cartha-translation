  text: δυναμένου σου ⸀ἐπιγνῶναι, ὅτι οὐ πλείους εἰσίν μοι ἡμέραι ⸀δώδεκα ἀφ’ ἧς ἀνέβην προσκυνήσων ⸀εἰς Ἰερουσαλήμ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/011.yaml
  text: as you are able to ascertain[a], that it has been no more than twelve days since I went up to Jerusalem to worship,
translation:
  language: ig
  text: Dị ka ị pụrụ ịchọpụta[a], ọ dịbeghị ihe karịrị ụbọchị iri na abụọ kemgbe m rịgoro Jerusalem ka m fee ofufe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “ebe ị pụrụ inyocha ma mata nke a.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δυναμένου σου ἐπιγνῶναι
  choice: Dị ka ị pụrụ ịchọpụta
  rationale: Nkebi a na-egosi na Felix nwere ike nyochaa ma mata eziokwu ahụ. “Ịchọpụta” dabara n’ọnọdụ ikpe a, ebe Pọl na-ekwu ihe a pụrụ inyocha.
- source_word: οὐ πλείους εἰσίν μοι ἡμέραι δώδεκα
  choice: o tebeghị ihe karịrị ụbọchị iri na abụọ
  rationale: Nke a na-ebuga echiche nke oge gafere n’Igbo doro anya, ma na-edobe oke ahụ—ọ bụghị ihe karịrị ụbọchị iri na abụọ.
- source_word: ἀφ’ ἧς
  choice: kemgbe
  rationale: “Kemgbe” na-egosi ebe ngụ oge ahụ malitere n’ụzọ ebumpụta ụwa n’Igbo.
- source_word: ἀνέβην
  choice: m gara
  rationale: N’asụsụ Grik, okwu ahụ bụ ụzọ e si ekwu banyere ịga Jerusalem. “M gara” bụ okwu Igbo dị mfe ma doo anya; itinye “rịgoro” ga-ada ka a na-emesi mgbago ugwu ike karịa ebumnuche okwu ahụ.
- source_word: προσκυνήσων
  choice: ife ofufe
  rationale: Partisịpụ nke ọdịnihu na-egosi nzube njem ahụ. “Ife ofufe” na-egosipụta nzube ahụ n’enweghị ịgbakwunye onye a na-efe, ebe e kwughị ya kpọmkwem n’ebe a.
- source_word: εἰς Ἰερουσαλήμ
  choice: Jerusalem
  rationale: A na-eji “gara Jerusalem” egosi ebe njem ahụ jedebere n’Igbo nkịtị.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke ugbu a ma dị ùgwù. E debere ụda okwu Pọl nke ịgbachitere onwe ya, ma mee ka usoro oge ahụ doo onye nkịtị anya.
