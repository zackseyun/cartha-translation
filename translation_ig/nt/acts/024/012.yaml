source:
  edition: SBLGNT
  text: καὶ οὔτε ἐν τῷ ἱερῷ εὗρόν με πρός τινα διαλεγόμενον ἢ ⸀ἐπίστασιν ποιοῦντα ὄχλου οὔτε ἐν ταῖς συναγωγαῖς οὔτε κατὰ τὴν πόλιν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/012.yaml
  text: And they found me neither in the temple arguing with anyone nor stirring up a crowd[b][a], neither in the synagogues nor throughout the city.
translation:
  language: ig
  text: Ha ahụghị m n'ụlọ nsọ ka mụ na onye ọ bụla na-arụrịta ụka[a] ma ọ bụ ka m na-akpalite ìgwè mmadụ[b], ma ọ bụ n'ụlọ nzukọ, ma ọ bụ n'obodo ahụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “na-arụ ụka megide onye ọ bụla,” “na-ekwurịta okwu na onye ọ bụla,” ma ọ bụ “na-atụgharị uche na onye ọ bụla.” Ngwaa Grik a pụrụ ịpụta ikwurịta okwu, iji uche tụlee okwu, ma ọ bụ ịrụrịta ụka.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, “na-eme ka ìgwè mmadụ zukọta.” Nkebiokwu Grik ahụ na-ekwu maka ime ka ìgwè mmadụ gbakọta ma ọ bụ kpalite ọgba aghara n'ihu ọha; ọ dịghị ekwusi ike na ọ ghaghị ịbụ ọgba aghara ukwu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἱερῷ
  choice: n'ụlọ nsọ
  rationale: N'Ọrụ Ndị Ozi, ἱερόν na-ezokarị aka n'ogige na mpaghara ụlọ nsọ dum, ọ bụghị naanị ebe nsọ dị n'ime ya; okwu Igbo a bụ nke nkịtị ma kwe ka nghọta sara mbara ahụ dịgide.
- source_word: εὗρόν με
  choice: Ha ahụghị m
  rationale: N'ihi njikọ ya na οὔτε, ahịrịokwu a na-ekwu na ndị na-ebo Pọl ebubo ahụghị ya ka ọ na-eme ihe ndị ahụ; ntụgharị a bụ Igbo eke ma na-echekwa ọnọdụ ịgbachitere onwe ya n'ụlọikpe.
- source_word: πρός τινα διαλεγόμενον
  choice: ka mụ na onye ọ bụla na-arụrịta ụka
  rationale: διαλέγομαι nwere ike ịpụta ikwurịta, iji uche kọwaa ihe, ma ọ bụ ịrụrịta ụka. N'ọnọdụ ebubo ọgba aghara a, 'ịrụrịta ụka' na-egosi esemokwu n'ekwughị na ọ bụ ime ihe ike.
- source_word: ἐπίστασιν ποιοῦντα ὄχλου
  choice: na-akpalite ìgwè mmadụ
  rationale: Nkebiokwu ahụ na-egosi ime ka ìgwè mmadụ zukọta ma ọ bụ kpalie ọgba aghara. 'Na-akpalite ìgwè mmadụ' doro anya ma ọ naghị eme ka ihe ahụ sie ike ruo n'ókè nke 'nnupụisi' ma ọ bụ 'ọgba aghara ukwu.'
- source_word: ὄχλου
  choice: ìgwè mmadụ
  rationale: Nke a na-anọchi anya crowd n'ụzọ nkịtị, na-enweghị itinye echiche na ha bụ ìgwè na-eme ihe ike.
- source_word: συναγωγαῖς
  choice: ụlọ nzukọ ndị Juu
  rationale: Nke a na-eme ka ebe okpukpe ndị Juu a pụta ìhè nye onye Igbo nke oge a, kama iji okwu mbịarambịa na-adịghị mfe nghọta.
- source_word: κατὰ τὴν πόλιν
  choice: n'ebe ọ bụla n'obodo ahụ
  rationale: κατά na accusative ebe a na-egosi mgbasa n'ime mpaghara ahụ; okwu a na-egosipụta na a hụghị ya ka ọ na-eme ihe ndị ahụ n'akụkụ ọ bụla nke obodo ahụ.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E tinyere 'ndị Juu' n'okwu 'ụlọ nzukọ' iji gbochie mgbagwoju anya. E megharịkwara akụkụ ikpeazụ ntakịrị ('ha ahụghịkwa m ka m na-eme otú ahụ') ka njikọ οὔτε...οὔτε...οὔτε doo anya n'Igbo.
