revisions:
- from: Ha ahụghị m n'ụlọ nsọ ka mụ na onye ọ bụla na-arụrịta ụka[a] ma ọ bụ na-akpalite ìgwè mmadụ[b]; ha ahụghịkwa m ka m na-eme otú ahụ n'ụlọ nzukọ ndị Juu ma ọ bụ n'ebe ọ bụla n'obodo ahụ.
  to: Ha ahụghị m n'ụlọ nsọ ka mụ na onye ọ bụla na-arụrịta ụka[a] ma ọ bụ ka m na-akpalite ìgwè mmadụ[b], ma ọ bụ n'ụlọ nzukọ, ma ọ bụ n'obodo ahụ.
  rationale: The revision restores the source's direct threefold negative coordination, retains the natural modern terms for temple, crowd, and synagogues, and avoids strengthening the city expression. It also makes the lexical note on διαλέγομαι appropriately broad, preserving the source's ambiguity.
