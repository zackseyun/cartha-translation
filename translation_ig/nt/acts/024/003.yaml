translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke ugwu ma dị mfe nghọta. E debere ụdị okwu nkwanye ùgwù nke okwu ikpe ahụ, ma chekwaa ọtụtụ nghọta ἀποδεχόμεθα site n’ihe odide na nkọwa ala peeji.
