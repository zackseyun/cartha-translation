  text: πάντῃ τε καὶ πανταχοῦ ἀποδεχόμεθα, κράτιστε Φῆλιξ, μετὰ πάσης εὐχαριστίας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/003.yaml
  text: In every way and everywhere we acknowledge this[a], most excellent Felix, with all gratitude.
translation:
  language: ig
  text: Anyị na-eji ekele niile anabata nke a[a] n’ụzọ niile na n’ebe niile, Feliks, onye kachasị nsọpụrụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “anyị na-ekweta nke a,” “anyị na-anabata ya,” ma ọ bụ “anyị na-anata ya.” Ngwaa Grik ahụ nwere ike ịpụta ịnabata ma ọ bụ iji obi ụtọ nata ihe; ma n’ebe a, o yikarịrị ka ọ na-ekwu maka ikweta n’ihu ọha uru ndị e kwuru na Feliks wetara.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντῃ
  choice: N’ụzọ niile
  rationale: Ọ na-egosi ‘n’ụzọ ma ọ bụ n’akụkụ niile,’ ọ bụghị naanị oge niile; ọ na-adaba na πανταχοῦ nke na-esochi ya.
- source_word: τε καὶ
  choice: nakwa
  rationale: Ọ na-ejikọta πάντῃ na πανταχοῦ n’ụzọ dị mfe ma bụrụkwa Igbo nkịtị.
- source_word: πανταχοῦ
  choice: n’ebe niile
  rationale: Nke a na-echekwa kpọmkwem echiche nke ebe niile.
- source_word: ἀποδεχόμεθα
  choice: anyị ... na-anabata nke a
  rationale: Ngwaa ahụ nwere ike ịpụta ịnabata, ịnata nke ọma, ma ọ bụ ikweta; ‘na-anabata nke a’ na-echekwa obosara ihe ọ pụtara, ebe ‘nke a’ na-anọchi uru ndị e kwuru na Feliks wetara.
- source_word: κράτιστε
  choice: gị ... dị elu
  rationale: Ọ bụ aha nsọpụrụ a na-eji agwa onye ọchịchị nọ n’ọkwa dị elu; nsụgharị a bụ nke ugwu ma ghara ịgbakwunye echiche okpukpe.
- source_word: Φῆλιξ
  choice: Feliks
  rationale: E dere aha onye ahụ n’ụdị mkpụrụokwu dabara n’Igbo.
- source_word: μετὰ πάσης εὐχαριστίας
  choice: ji ekele niile
  rationale: Ọ na-egosi na ha ji ekele zuru ezu anabata ma ọ bụ kweta ihe a na-ekwu.
