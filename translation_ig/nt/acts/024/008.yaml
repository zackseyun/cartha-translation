revisions:
- from: Ọ bụ n’aka ya[a] ka ị ga-enwe ike ịmata ihe niile ndị a anyị ji ebo ya ebubo, ma gị onwe gị gbaa ya ajụjụ[b].
  to: Site n’aka ya[a] ka gị onwe gị, mgbe ị gbasịrị ya ajụjụ, ga-enwe ike ịmata ihe ndị a niile anyị na-ebo ya ebubo banyere ha.[b]
  rationale: The revision makes the examination of Paul the means/prior circumstance for Felix’s learning, as required by the Greek participial construction, while retaining the emphatic “gị onwe gị,” the future capability, and the legal accusation sense. The footnotes have been made complete, idiomatic, and textually accurate without implying that the disputed longer wording belongs to the SBLGNT text.
