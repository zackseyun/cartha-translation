  text: παρ’ οὗ δυνήσῃ αὐτὸς ἀνακρίνας περὶ πάντων τούτων ἐπιγνῶναι ὧν ἡμεῖς κατηγοροῦμεν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/008.yaml
  text: From him[a], by examining him yourself[b], you will be able to learn about all these things of which we accuse him.
translation:
  language: ig
  text: Site n’aka ya[a] ka gị onwe gị, mgbe ị gbasịrị ya ajụjụ, ga-enwe ike ịmata ihe ndị a niile anyị na-ebo ya ebubo banyere ha.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'N’ụzọ ọzọ: “Site n’aka onye ahụ ka gị onwe gị, mgbe ị nyochachara ya, ga-enwe ike ịchọpụta banyere ihe ndị a niile anyị na-ebo ya ebubo.”'
    reason: lexical_alternative
  - marker: b
    text: Ụfọdụ akwụkwọ aka ochie nwere okwu ọzọ n’amaokwu nke 7 banyere Lisias, onye ọchịagha, bụ́ onye ji ike napụrụ ha Pọl ma nye iwu ka ndị na-ebo ya ebubo bịa n’ihu Feliks. Ihe odide SBLGNT etinyeghị okwu ndị ahụ n’ebe a.
    reason: textual_variant
lexical_decisions:
- source_word: παρ’ οὗ
  choice: Ọ bụ n’aka ya
  rationale: Παρά na genitive na-egosi ebe ozi si abịa. ‘N’aka ya’ bụ ụzọ Igbo dị eke isi kwuo na Felix ga-enweta ihe ọmụma ahụ site n’aka Pọl.
- source_word: δυνήσῃ
  choice: ị ga-enwe ike
  rationale: Oge ọdịnihu nke δύναμαι na-egosi ikike Felix ga-enwe ime nke a.
- source_word: αὐτὸς
  choice: gị onwe gị
  rationale: A hapụrụ nkwusi ike dị na nnọchiaha Grik ahụ, nke na-egosi na Felix n’onwe ya ga-ajụ ajụjụ ahụ.
- source_word: ἀνακρίνας
  choice: ma ... gbaa ya ajụjụ
  rationale: N’ọnọdụ ikpe, ἀνακρίνω pụtara inyocha mmadụ site n’ịjụ ya ajụjụ. Nkebi ọnọdụ ‘ma ...’ na-egosi na ịgba ya ajụjụ bụ ụzọ e si amata ihe ndị ahụ.
- source_word: περὶ πάντων τούτων
  choice: ihe niile ndị a
  rationale: Nke a na-echekwa echiche nke περί na ọtụtụ nke πάντων τούτων n’Igbo dị mfe ma kwekọọ n’ebubo ndị a kpọtụrụ aha.
- source_word: ἐπιγνῶναι
  choice: ịmata
  rationale: N’ọnọdụ a, okwu ahụ pụtara ịbịa mata ma ọ bụ ịchọpụta eziokwu; ‘ịmata’ bụ okwu Igbo doro anya na nke eke.
- source_word: ὧν ἡμεῖς κατηγοροῦμεν αὐτοῦ
  choice: ndị a anyị ji ebo ya ebubo
  rationale: Nke a na-edowe njikọ okwu ahụ na ebubo iwu, ma na-eji ahịrịokwu Igbo a na-asụkarị.
