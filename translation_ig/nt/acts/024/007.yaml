  text: παρελθὼν δὲ Λυσίας ὁ χιλίαρχος μετὰ πολλῆς βίας ἐκ τῶν χειρῶν ἡμῶν ἀπήγαγεν,
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/007.yaml
  text: But[a] Lysias the commander came and took him out of our hands with great force,
translation:
  language: ig
  text: Ma[a] Lisias, ọchịagha ahụ, bịara were oke ike duru ya pụọ n’aka anyị,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Amaokwu a—tinyere ngwụcha amaokwu nke 6 na mmalite amaokwu nke 8—adịghị n’ihe odide Grik ndị kacha ochie, gụnyere Papyrus 74 nke narị afọ nke atọ na Codex Sinaiticus na Codex Vaticanus nke narị afọ nke anọ; ọ dịghịkwa na nsụgharị Kọptik ndị mbụ. Ma ọ dị n’ọdịnala ọtụtụ ihe odide Byzantium, n’ọdịnala Latịn, nakwa n’ihe odide Grik ndị e dere mgbe e mesịrị. O yiri ka ọ bụ mgbakwunye ndị ndezi oge mbụ tinyere iji kọọ banyere otú ọchịagha Rom si tinye aka tupu okwu ahụ erute n’ihu Feliks.
    reason: textual_critical
lexical_decisions:
- source_word: παρελθών (παρέρχομαι)
  choice: bịara
  rationale: N’ebe a, participle aorist a na-egosi na Lisias bịarutere ebe ihe ahụ na-eme; iji ngwaa zuru ezu “bịara” na-eme ka akụkọ ahụ daa nke ọma n’Igbo.
- source_word: χιλίαρχος
  choice: ọchịagha
  rationale: Ọ bụ ọkwa onyeisi ndị agha Rom, n'ụzọ nkịtị onyeisi otu puku ndị agha. “Ọchịagha” bụ okwu Igbo doro ndị na-agụ akwụkwọ taa anya ma na-egosi ọkwa agha ya.
- source_word: μετὰ πολλῆς βίας
  choice: were ike dị ukwuu
  rationale: Nkebiokwu a na-egosi iji ike anụ ahụ dị ukwuu mee ihe, ma ọ dịghị mkpa ka a kọwaa ya ozugbo dị ka ime ihe ike obi ọjọọ.
- source_word: ἐκ τῶν χειρῶν ἡμῶν ἀπήγαγεν
  choice: napụta ya n’aka anyị
  rationale: N’ọnọdụ a, ἀπάγω pụtara iwepụ ma ọ bụ iduru mmadụ pụọ. “Napụta ya n’aka anyị” bụ Igbo ebumpụta ụwa nke na-echekwa onyonyo nke iwepụ ya n’aka ha, ma ọ naghị ekpebi ma ihe Lisias mere ò ziri ezi.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo Izugbe, nke dị ugwu ma doo ndị nkịtị anya. A hapụrụ ahịrịokwu ahụ ka ọ kwụsị na kọma n’ihi na ọ bụ akụkụ nke okwu Tertọlọs nke na-aga n’ihu n’amaokwu na-esote. Akara nkọwa ala peeji [a] dị ozugbo n’ederede.
