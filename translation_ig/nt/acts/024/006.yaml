  text: ὃς καὶ τὸ ἱερὸν ἐπείρασεν βεβηλῶσαι, ὃν καὶ ⸀ἐκρατήσαμεν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/006.yaml
  text: He even tried to defile the temple[a], and we seized him,
translation:
  language: ig
  text: Ọ nwara ọbụna imebi ịdị nsọ nke ụlọ nsọ ahụ[a], anyị wee jide ya,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Akwụkwọ odide ụfọdụ na-agbakwụnye okwu ndị ọzọ n’ebe a, gụnyere na ha chọrọ ikpe Pọl dịka iwu ha si dị, nakwa na Lisia, onyeisi agha, wepụtara ya n’aka ha.
    reason: textual_variant
lexical_decisions:
- source_word: ὃς
  choice: Ọ
  rationale: Nnọchiaha a na-ezo aka na Pọl. “Ọ” na-eme ka okwu ebubo a daa nke ọma n’Igbo karịa ịmalite ya na “onye.”
- source_word: καὶ
  choice: ọbụna
  rationale: 'N’ebe a καὶ na-eme ka ebubo ahụ sie ike: ọ nwara ọbụna ime ihe megide ụlọ nsọ.'
- source_word: τὸ ἱερὸν
  choice: ụlọ nsọ ahụ
  rationale: Ἱερόν na-ezo aka n’ụlọ nsọ na ogige ya niile, ọ bụghị naanị ebe nsọ dị n’ime ya. “Ụlọ nsọ ahụ” bụ okwu Igbo doro anya ma bụrụkwa nke a na-ejikarị eme ihe.
- source_word: ἐπείρασεν
  choice: nwara
  rationale: Okwu a pụtara ịnwa ime ihe; “nwara” dị nkenke ma bụrụ Igbo nkịtị.
- source_word: βεβηλῶσαι
  choice: imerụ … nsọ
  rationale: Βεβηλόω pụtara ime ka ihe dị nsọ ghara ịdị nsọ ma ọ bụ metọọ ya n’ụzọ okpukpe. “Imerụ ụlọ nsọ ahụ nsọ” na-egosi ebubo nke imebi ịdị nsọ ya n’Igbo a na-aghọta ngwa ngwa.
- source_word: ὃν
  choice: ya
  rationale: Nnọchiaha a na-ezo aka na Pọl dịka onye e jidere; “ya” bụ ntụgharị Igbo ebumpụta ụwa.
- source_word: ἐκρατήσαμεν
  choice: anyị wee jide ya
  rationale: Κρατέω n’ebe a pụtara ijide mmadụ ma ghara ịhapụ ya. “Jide” na-echekwa ike dị n’omume ahụ karịa okwu usoro iwu dịka “kpọchie.”
theological_decisions:
- issue: Ụdị ederede Ọrụ Ndị Ozi 24:6 ma e jiri ya tụnyere ogologo ọgụgụ Byzantine
  choice: A tụgharịrị naanị nkebi dị na SBLGNT, nke kwụsịrị na “anyị wee jide ya,”
  alternative: Ụfọdụ ihe odide nwere ogologo okwu na-ekwu na ha chọrọ ikpe Pọl dịka iwu ha si dị, ma Lisias onyeisi agha napụtara ya n’aka ha.
  rationale: Ihe odide Grik e nyere bụ ọgụgụ dị mkpụmkpụ. E tinyeghị okwu ndị ọzọ n’isi ederede, kama e debere ọdịiche ahụ n’ala peeji ka ndị na-agụ ya mara ya.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ugwu ma dịkwa mfe nghọta. Akara [a] dị n’isi ederede ozugbo okwu metụtara ịdị nsọ nke ụlọ nsọ gasịrị; ntụaka ahụ kọwara ogologo ọgụgụ dị n’ụfọdụ ihe odide.
