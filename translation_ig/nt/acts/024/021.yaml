source:
  edition: SBLGNT
  text: ἢ περὶ μιᾶς ταύτης φωνῆς ἧς ἐκέκραξα ⸂ἐν αὐτοῖς ἑστὼς⸃ ὅτι Περὶ ἀναστάσεως νεκρῶν ἐγὼ κρίνομαι σήμερον ⸀ἐφ’ ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/021.yaml
  text: 'or about this one statement that I shouted while standing among them: ‘It is concerning the resurrection of the dead that I am being judged before you today.’[a][b]'
translation:
  language: ig
  text: 'ma ọ bụ banyere otu okwu a kpọmkwem, nke m tiri mkpu mgbe m guzo n’etiti ha, sị: “Ọ bụ banyere mbilite n’ọnwụ nke ndị nwụrụ anwụ ka a na-ekpe m ikpe n’ihu unu taa.”[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị “okwu” dịka “mkpu” ma ọ bụ “olu”; okwu Grik ahụ nwere ike ịpụta ihe e kwuru n'onwe ya ma ọ bụ olu ma ọ bụ mkpu e ji kwuo ya.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “mbilite site n’etiti ndị nwụrụ anwụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: φωνῆς
  choice: okwu
  rationale: N'ebe a, okwu Grik ahụ na-ezo aka n'ihe Pọl kwuru n'olu dara ụda, ọ bụghị naanị n'olu ya; “okwu” bụ asụsụ Igbo doro anya ma dịkwuo mfe.
- source_word: ἐκέκραξα
  choice: m tiri mkpu
  rationale: Nhọrọ a na-egosi na Pọl kwuru okwu ahụ n'olu dara ụda n'ihu ọha.
- source_word: ἐν αὐτοῖς ἑστὼς
  choice: mgbe m guzo n’etiti ha
  rationale: Ọ na-echekwa ma ọnọdụ oge nke participle ahụ ma echiche nke ịnọ n'etiti ndị ahụ.
- source_word: ἀναστάσεως νεκρῶν
  choice: mbilite n’ọnwụ nke ndị nwụrụ anwụ
  rationale: Nke a na-esochi genitive Grik ahụ ma na-ahapụ okwu ahụ ka ọ bụrụ banyere mbilite n'ọnwụ n'ozuzu ya, n'emeghị ka ọ bụrụ naanị mbilite Jizọs.
- source_word: κρίνομαι
  choice: a na-ekpe m ikpe
  rationale: Ọ na-egosi ikpe a na-ekpe Pọl ugbu a ma bụrụkwa okwu ikpe ụlọikpe a na-asụkarị n'Igbo.
- source_word: ἐφ’ ὑμῶν
  choice: n’ihu unu
  rationale: Ọ dabara n'ọnọdụ ụlọikpe ma ghara ikwu hoo haa na ndị na-ege ntị bụ naanị ndị na-ekpe ikpe ahụ.
- source_word: ἢ
  choice: ma ọ bụ
  rationale: Ọ na-ejikọta amaokwu a na ihe Pọl kwuru tupu ya n'enweghị ịgbakwunye nkọwa na-adịghị n'okwu Grik.
- source_word: μιᾶς ταύτης
  choice: otu ... a
  rationale: Ọ na-echekwa nkwusi ike na ọ bụ naanị otu okwu kpọmkwem.
- source_word: σήμερον
  choice: taa
  rationale: Nke a bụ ụzọ nkịtị na nke doro anya e si ekwu oge ahụ n'Igbo.
theological_decisions:
- issue: Ihe bụ isi e ji ebo Pọl ebubo
  choice: E debere okwu ahụ dịka “mbilite n’ọnwụ nke ndị nwụrụ anwụ” n'ozuzu ya.
  alternative: Ịkọwa ya kpọmkwem dịka mbilite Jizọs n'ọnwụ.
  rationale: περὶ ἀναστάσεως νεκρῶν bụ okwu sara mbara. Ọ bụ ezie na Ọrụ Ndịozi jikọtara ozi Pọl na mbilite Jizọs, amaokwu a n'onwe ya ekwughị kpọmkwem na ọ bụ naanị nke ahụ.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E chekwara usoro okwu ikpe ụlọikpe, ike nke mkpu Pọl, na nghọta sara mbara nke okwu banyere mbilite n'ọnwụ.
