source:
  edition: SBLGNT
  text: κληθέντος δὲ αὐτοῦ ἤρξατο κατηγορεῖν ὁ Τέρτυλλος λέγων· Πολλῆς εἰρήνης τυγχάνοντες διὰ σοῦ καὶ ⸀διορθωμάτων γινομένων τῷ ἔθνει τούτῳ διὰ τῆς σῆς προνοίας
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/002.yaml
  text: 'And when he had been summoned[a], Tertullus began to accuse him, saying: “Since through you we are enjoying much peace[b], and reforms are being brought to this nation through your foresight,”'
translation:
  language: ig
  text: 'Mgbe a kpọrọ ya, Tetulọs malitere ibo ya ebubo, sị: “Ebe ọ bụ na site n’aka gị ka anyị na-enwe udo dị ukwuu, na a na-emere mba a ndozigharị[a] site n’amamihe i ji elepụ anya n’ihu[b],”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya ‘mmezi’ ma ọ bụ ‘usoro mmezi.’
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya ‘site n’ezi atụmatụ gị’ ma ọ bụ ‘site na nlekọta gị.’ Okwu Grik a n’ebe a na-ekwu maka ilepụ anya n’ihu ma ọ bụ nhazi nke onye ọchịchị, ọ bụghị nlekọta Chineke kpọmkwem.
    reason: lexical_alternative
lexical_decisions:
- source_word: κληθέντος δὲ αὐτοῦ
  choice: Mgbe a kpọbatara ya
  rationale: Nkebiokwu a na-egosi ọnọdụ mere tupu ihe bụ isi amalite. ‘Kpọbatara’ dabara n’ọnọdụ ikpe a, ebe a kpọrọ Pọl ka ọ bịa n’ihu gọvanọ, ma ọ naghị etinye aha ya n’ebe Grik ji nnọchiaha.
- source_word: ἤρξατο κατηγορεῖν
  choice: malitere ibo ya ebubo
  rationale: Nke a na-egosipụta mmalite nke ebubo ahụ n’asụsụ Igbo doro anya ma na-edobe ọnọdụ iwu dị na okwu Grik.
- source_word: ὁ Τέρτυλλος
  choice: Tetulọs
  rationale: A sụgharịrị aha onye ahụ n’ụdị mkpọpụta dabara n’usoro ide aha n’Igbo.
- source_word: Πολλῆς εἰρήνης τυγχάνοντες διὰ σοῦ
  choice: site n’aka gị ka anyị na-enwe udo dị ukwuu
  rationale: Nke a na-edobe echiche nke inweta ma ọ bụ ịnụ ụtọ udo site n’ọrụ onye ọchịchị, tinyere olu otuto aghụghọ Tetulọs ji kwuo okwu.
- source_word: διορθωμάτων γινομένων τῷ ἔθνει τούτῳ
  choice: a na-emere mba a ndozigharị
  rationale: ‘Ndozigharị’ na-ekpuchi echiche nke usoro mmezi ma ọ bụ mgbanwe a na-eme ka ọnọdụ ka mma; usoro ahịrịokwu ahụ na-egosi na ihe ndị a na-abara mba ahụ uru n’enweghị ịgbakwunye nkọwa onye mere ha.
- source_word: διὰ τῆς σῆς προνοίας
  choice: site n’amamihe i ji elepụ anya n’ihu
  rationale: Nke a na-egosi echiche nke ịtụle ihe tupu oge eruo na ezi nhazi ọchịchị, ma na-ezere ime ka okwu ahụ bụrụ okwu banyere nlekọta Chineke.
theological_decisions:
- issue: Ma πρόνοια ọ̀ na-ekwu maka nlekọta Chineke ka ọ bụ amamihe onye ọchịchị ji atụ atụmatụ
  choice: site n’amamihe i ji elepụ anya n’ihu
  alternative: site na nlekọta gị; site n’ezi atụmatụ gị
  rationale: N’ebe a, Tetulọs na-eto Feliks dịka onye ọchịchị nwere nghọta na ezi nhazi. Nsụgharị a na-edobe ihe okwu ahụ pụtara n’ọnọdụ ọchịchị ma ghara ibubata echiche okpukpe nke nlekọta Chineke.
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E debere usoro okwu dịka mmalite nke okwu ikpe Tetulọs, tinyere olu otuto ọ na-eji agwa onye ọchịchị okwu. Akara nkọwa [a] na [b] dị n’akụkụ okwu ha na-akọwa.
