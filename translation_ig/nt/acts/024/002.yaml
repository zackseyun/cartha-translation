  naturalness: The Igbo is generally clear, modern, and appropriate to Tertullus’s formal, flattering address. «Mgbe a kpọrọ ya» is slightly more direct and idiomatic than the current opening while also being closer to the Greek.
  terminology: «ibo ... ebubo», «udo dị ukwuu», «ndozigharị», and «amamihe i ji elepụ anya n’ihu» appropriately convey the legal, political, and rhetorical terminology. The name «Tetulọs» is retained as supplied. Footnote anchors are correctly attached to «ndozigharị» and the rendering of πρόνοια.
