  text: ἐλπίδα ἔχων εἰς τὸν θεόν, ἣν καὶ αὐτοὶ οὗτοι προσδέχονται, ἀνάστασιν μέλλειν ⸀ἔσεσθαι δικαίων τε καὶ ἀδίκων·
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/015.yaml
  text: having hope in God—which these men themselves also accept—that there is going to be a resurrection of both the righteous and the unrighteous[a].
translation:
  language: ig
  text: na-enwe olileanya n’ebe Chineke nọ—nke ndị a n’onwe ha na-atụkwa anya—na mbilite n’ọnwụ nke ma ndị ezi omume ma ndị ajọ omume ga-adị.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “nke ndị a n’onwe ha na-anabatakwa.” Ngwaa Grik ahụ nwere ike ịpụta “ịtụ anya/ịchere” ma ọ bụ “ịnabata”; n’ebe a, ọ na-egosi na ha na Pọl nwere otu olileanya a ha na-atụ anya ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλπίδα ἔχων εἰς τὸν θεόν
  choice: na-enwe olileanya n’ebe Chineke nọ
  rationale: Nke a na-edobe aha ἐλπίς na njikọ participle ahụ, ma jiri usoro okwu Igbo doro anya gosi na Chineke bụ onye olileanya ahụ dị n’ebe ọ nọ.
- source_word: καὶ αὐτοὶ οὗτοι
  choice: ndị a n’onwe ha na-anabatakwa
  rationale: “Ndị a” na-ezo aka ná ndị nọ ebe ahụ Pọl na-ekwu banyere ha; “n’onwe ha” na-edobe nkwusi ike nke αὐτοὶ, “-kwa” na-egosikwa καί.
- source_word: προσδέχονται
  choice: na-anabata
  rationale: N’ọnọdụ ikpe a, okwu ahụ nwere ike igosi na ha kwetara ma nabata olileanya a. Otú ọ dị, ihe ọ pụtara dịka ‘na-atụ anya/na-echere’ ka edobere na nkọwa ala peeji.
- source_word: ἀνάστασιν
  choice: mbilite n’ọnwụ
  rationale: Nke a bụ okwu Igbo a na-ejikarị eme ihe maka ἀνάστασις n’ọnọdụ nke ndị nwụrụ anwụ ibilite.
- source_word: μέλλειν ἔσεσθαι
  choice: ga-adị
  rationale: Ọ na-egosipụta ihe ga-eme n’ọdịnihu n’ụzọ Igbo sitere n’okike, na-enweghị ime ka ọ pụta na ọ ga-eme ozugbo.
- source_word: δικαίων τε καὶ ἀδίκων
  choice: nke ma ndị ezi omume ma ndị ajọ omume
  rationale: Ọ na-edobe ụzọ τε καὶ si agụnye ìgwè abụọ ahụ nakwa ọdịiche omume dị n’etiti ha.
theological_decisions:
- issue: Ụdị na oke mbilite n’ọnwụ Pọl kwuru banyere ya
  choice: mbilite n’ọnwụ nke ma ndị ezi omume ma ndị ajọ omume
  alternative: mbilite n’ọnwụ izugbe n’enweghị ikwusi ike n’ọdịiche omume
  rationale: Grik ahụ kpọrọ ìgwè abụọ ahụ aha n'ụzọ doro anya. Nsụgharị a na-edobe ha abụọ n’etinyeghị ozizi ọzọ banyere oge ha ga-ebilite ma ọ bụ usoro ikpe.
translation_notes:
  register: Ejiri Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-edobe ọdịdị okwu Pọl dịka akụkụ ahịrịokwu na-aga n’ihu, ebe akara ogologo na-ekewapụta nkọwa gbasara ndị na-ebo ya ebubo.
