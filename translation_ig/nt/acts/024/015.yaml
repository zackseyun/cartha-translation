review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the hope directed to God, the future resurrection, and the inclusion of both righteous and unrighteous. However, προσδέχονται in this context most naturally conveys that the opponents also await/expect this hope, rather than that they merely accept it. The revised wording retains the Greek’s lexical range in a footnote.
  naturalness: “Na-enwe olileanya n’ebe Chineke nọ” and “mbilite n’ọnwụ nke ma ndị ezi omume ma ndị ajọ omume” are clear, dignified Standard Igbo suitable for the continuing syntax of Paul’s speech. “Na-atụkwa anya” is more idiomatic and contextually precise than “na-anabatakwa” for the shared eschatological expectation.
  terminology: “Chineke,” “olileanya,” “mbilite n’ọnwụ,” “ndị ezi omume,” and “ndị ajọ omume” are appropriate established Standard Igbo terms. The footnote preserves “ịnabata” as a possible lexical alternative without making it the primary rendering.
  issues:
  - severity: medium
    issue: The main text renders προσδέχονται as “na-anabatakwa.”
    rationale: 'Although προσδέχομαι can mean receive/accept, in this clause Paul emphasizes an expectation that his interlocutors share: they too await the hope of resurrection. “Na-atụkwa anya” better reflects the immediate context and avoids making the referent sound like a proposition they simply accept.'
  - severity: low
    issue: The footnote presents “na-atụkwa anya” as only an alternative even though it is the more contextually fitting primary rendering.
    rationale: Once the main text is revised to “na-atụkwa anya,” the footnote should instead note “na-anabata” as the lexical alternative.
  revised_text: na-enwe olileanya n’ebe Chineke nọ—nke ndị a n’onwe ha na-atụkwa anya—na mbilite n’ọnwụ nke ma ndị ezi omume ma ndị ajọ omume ga-adị.[a]
  revised_footnotes:
