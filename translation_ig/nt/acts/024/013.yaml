  yaml_path: translation/nt/acts/024/013.yaml
  text: Nor can they prove to you the things of which they are now accusing me[a].
translation:
  language: ig
  text: Ha enweghịkwa ike igosi gị na ihe ndị ha na-ebo m ebubo ugbu a bụ eziokwu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “iwetara gị” ma ọ bụ “ime ka o doo gị anya.” Ngwaa Grik ahụ nwere ike ịpụta iweta ihe n’ihu mmadụ ma ọ bụ ime ka ihe guzosie ike; n’ebe a, ọ na-ekwu maka igosi n’ụlọikpe na ebubo ahụ bụ eziokwu.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδὲ
  choice: Ha enweghịkwa ike
  rationale: “-kwa” na-ejikọta okwu a na ihe Pọl kwuru tupu ya ma na-aga n’ihu n’ịjụ ebubo ahụ.
- source_word: παραστῆσαι
  choice: igosi gị ihe àmà
  rationale: N’ọnọdụ ikpe a, ngwaa ahụ pụtara iweta ma ọ bụ igosi ihe ga-eme ka ebubo guzosie ike; okwu a na-eme ka echiche ahụ doo ndị na-agụ Igbo anya.
- source_word: δύνανταί
  choice: enweghị ike
  rationale: Nke a na-egosipụta enweghị ikike ime ihe ahụ n’ụzọ Igbo dị mfe ma bụrụ nke eke.
- source_word: σοι
  choice: gị
  rationale: Ọ na-ezo aka n’aka Feliks, onye a na-agwa okwu; e tinyere ya na “igosi gị” n’usoro Igbo eke.
- source_word: περὶ ὧν
  choice: banyere ihe ndị
  rationale: Nke a na-edobe ntụaka sara mbara nke Grik banyere okwu ma ọ bụ ihe ndị bụ isi ebubo ahụ, n’etinyeghị nkọwa karịrị ihe odide ahụ.
- source_word: νυνὶ
  choice: ugbu a
  rationale: Ọ na-egosi na ebubo ndị a bụ ndị a na-eweta n’oge ikpe ahụ dị ugbu a.
- source_word: κατηγοροῦσίν μου
  choice: ha na-ebo m ebubo
  rationale: Nke a bụ okwu Igbo doro anya nke na-egosipụta ebubo n’ọnọdụ ikpe, ma na-edobe omume na-aga n’ihu nke ụdị ngwaa Grik ahụ.
