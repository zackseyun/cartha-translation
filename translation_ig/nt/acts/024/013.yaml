  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta mee ntụgharị a. “Igosi gị ihe àmà” na-ebute ike okwu nke ọnọdụ ụlọikpe n’enweghị itinye nkọwa okpukpe ma ọ bụ nke otu ụka.
