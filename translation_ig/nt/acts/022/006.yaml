id: ACT.22.6
reference: Acts 22:6
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἐγένετο δέ μοι πορευομένῳ καὶ ἐγγίζοντι τῇ Δαμασκῷ περὶ μεσημβρίαν ἐξαίφνης ἐκ τοῦ οὐρανοῦ περιαστράψαι φῶς ἱκανὸν περὶ ἐμέ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/006.yaml
  text: It happened that as I was traveling and drawing near to Damascus[a], about noon, suddenly a bright light from heaven flashed around me,
translation:
  language: ig
  text: Ma o mere na, ka m na-eme njem ma na-abịaru Damaskọs nso, n’ihe dị ka etiti ehihie, na mberede, ìhè dị ukwuu[a] si n’eluigwe wee gbaa m gburugburu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ìhè na-enwu nke ukwuu.” Okwu Grik ahụ nwere ike imesi ịdị ukwuu ma ọ bụ ike nchapụta nke ìhè ahụ ike.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δέ μοι
  choice: O wee ruo na
  rationale: Nke a bụ ụzọ Igbo dị mma e si webata ihe mere n’akụkọ, ma na-echekwa njikọ dị nro nke δέ na echiche nke ihe dakwasịrị onye na-ekwu okwu.
- source_word: πορευομένῳ καὶ ἐγγίζοντι τῇ Δαμασκῷ
  choice: ka m na-aga, na-erukwa Damaskọs nso
  rationale: 'Ọ na-egosi omume abụọ na-aga n’ihu n’otu oge: njem Pọl na ịbịaru ya nso n’obodo Damaskọs.'
- source_word: περὶ μεσημβρίαν
  choice: n’ihe dị ka etiti ehihie
  rationale: Ọ na-egosi oge a na-atụghị kpọmkwem, ma jiri okwu oge ndị Igbo nke oge a na-aghọta nke ọma.
- source_word: ἐξαίφνης
  choice: na mberede
  rationale: Ọ na-echekwa ịdị ngwa na enweghị amụma nke ihe ahụ mere.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: si n’eluigwe
  rationale: N’ọnọdụ akụkọ a, ‘eluigwe’ na-echekwa echiche nke isi iyi dị n’elu na nke Chineke karịa naanị ‘mbara igwe.’
- source_word: περιαστράψαι
  choice: gbaa m gburugburu
  rationale: Ngwaa a na-egosi na ìhè ahụ gbara na mberede ma gbaa onye ahụ gburugburu; njikọ ya na ‘ìhè na-egbuke egbuke’ na-eme ka nke a doo anya n’Igbo.
- source_word: φῶς ἱκανὸν
  choice: ìhè na-egbuke egbuke
  rationale: ἱκανόν nwere ike igosi ịdị ukwuu ma ọ bụ ike nke ìhè ahụ. Nsụgharị a na-ekwupụta ike nchapụta ya n’Igbo dị mfe, ebe nkọwa ala peeji na-echekwa nhọrọ nke ‘nnukwu ìhè.’
- source_word: περὶ ἐμέ
  choice: m gburugburu
  rationale: Ọ na-egosi na ìhè ahụ gbara onye na-ekwu okwu gburugburu.
theological_decisions:
- issue: Ihe οὐρανός pụtara n’okwu ἐκ τοῦ οὐρανοῦ
  choice: si n’eluigwe
  alternative: si na mbara igwe
  rationale: Ọnọdụ mkpughe a na ojiji okwu ahụ n’Ọrụ Ndị Ozi na-akwado ‘eluigwe,’ nke na-echekwa echiche nke isi iyi karịrị ihe ikuku nkịtị n’etinyeghị nkọwa ozizi ọzọ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta, dee ya. E debere akara nkọwa [a] ozugbo n’akụkụ okwu ọ na-akọwa, ya bụ φῶς ἱκανὸν, kama itinye ya n’akụkụ Damaskọs.
