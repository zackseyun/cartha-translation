  to: Ma mgbe ha ji eriri akpụkpọ setịa ya, Pọl sịrị ọchịagha narị ahụ guzo n'ebe ahụ, “Iwu ò kwere ka unu tie onye Rom ụtarị mgbe a kpebeghị ya ikpe?”
  rationale: The revision improves idiomatic Standard Igbo while retaining the Greek sequence and legal force. It renders the straps and stretching preparation explicitly, uses a precise idiom for flogging, and keeps “onye Rom,” which reflects the wording of ἄνθρωπον Ῥωμαῖον without imposing an interpretation beyond its legal context.
