  text: ὡς δὲ ⸀προέτειναν αὐτὸν τοῖς ἱμᾶσιν εἶπεν πρὸς τὸν ἑστῶτα ἑκατόνταρχον ὁ Παῦλος· Εἰ ἄνθρωπον Ῥωμαῖον καὶ ἀκατάκριτον ἔξεστιν ὑμῖν μαστίζειν;
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/025.yaml
  text: But when they had stretched him out with the straps[a], Paul said to the centurion standing there, “Is it lawful for you to flog a Roman citizen who is uncondemned?”
translation:
  language: ig
  text: Ma mgbe ha ji eriri akpụkpọ setịa ya, Pọl sịrị ọchịagha narị ahụ guzo n'ebe ahụ, “Iwu ò kwere ka unu tie onye Rom ụtarị mgbe a kpebeghị ya ikpe?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προέτειναν ... τοῖς ἱμᾶσιν
  choice: ji eriri akpụkpọ dọgbuo ya ka ọ gbatịa
  rationale: Nke a na-egosi ma eriri e ji kee ya ma omume ịdọ ya gbatịa iji kwadebe ya maka ịpịa ihe.
- source_word: ἑστῶτα
  choice: guzo n'ebe ahụ
  rationale: Ọ na-akọwa ọchịagha narị ahụ dị nso n'ebe ihe ahụ na-eme.
- source_word: ἑκατόνταρχον
  choice: ọchịagha narị
  rationale: Nke a bụ okwu Igbo doro anya maka onyeisi agha Rom nke ọkwa centurion.
- source_word: ἄνθρωπον Ῥωμαῖον
  choice: onye Rom
  rationale: Okwu a na-edobe ụdị okwu Grik bụ́ ‘onye Rom’; n'ọnọdụ iwu a, ọ na-egosikwa ọnọdụ ya dị ka nwa amaala Rom.
- source_word: ἀκατάκριτον
  choice: mgbe a na-amakpụbeghị ya ikpe
  rationale: Nke a na-egosi kpọmkwem na ụlọikpe amabeghị ya ikpe, kama ịpụta nanị na a tara ya ahụhụ n'enweghị ikpe.
- source_word: ἔξεστιν
  choice: Iwu ò kwere ka unu
  rationale: Ajụjụ ahụ metụtara ihe iwu Rom kwadoro, ya mere ntụgharị a na-edobe isi iwu dị na okwu ahụ.
- source_word: μαστίζειν
  choice: pịa ... ihe
  rationale: ‘Ịpịa ihe’ bụ okwu Igbo dị ugbu a, doro anya, nke na-egosi ntaramahụhụ siri ike e ji ụtarị eme.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo Izugbe dị ugwu ma dị mfe nghọta. A họọrọ ‘onye Rom’ iji debe okwu Grik ma hapụ ọnọdụ iwu n'ahịrịokwu ahụ ka o gosipụta na ihe a na-ekwu bụ ikike nwa amaala Rom.
