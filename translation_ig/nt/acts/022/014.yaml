revisions:
- from: Ọ sịrị, “Chineke nke nna nna anyị họpụtara gị[a] ka ị mara uche ya, hụ Onye Ezi Omume ahụ[b], ma nụ olu si n’ọnụ ya pụta.”
  to: Ọ sịrị, “Chineke nke ndị nna anyị họpụtara gị[a] ka ị mara uche ya, hụ Onye Ziri Ezi ahụ[b], ma nụ olu si n’ọnụ ya pụta.”
  rationale: The revision retains the source’s structure and ambiguity while using more exact Standard Igbo for the title τὸν δίκαιον. It removes the unsupported word “judge” from the footnote alternative and makes the ancestral expression less narrowly grandparental.
