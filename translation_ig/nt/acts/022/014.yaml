id: ACT.22.14
reference: Acts 22:14
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν· Ὁ θεὸς τῶν πατέρων ἡμῶν προεχειρίσατό σε γνῶναι τὸ θέλημα αὐτοῦ καὶ ἰδεῖν τὸν δίκαιον καὶ ἀκοῦσαι φωνὴν ἐκ τοῦ στόματος αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/014.yaml
  text: And he said[a], ‘The God of our fathers has appointed you to know his will, to see the Righteous One[b], and to hear a voice from his mouth,’
translation:
  language: ig
  text: Ọ sịrị, “Chineke nke ndị nna anyị họpụtara gị[a] ka ị mara uche ya, hụ Onye Ziri Ezi ahụ[b], ma nụ olu si n’ọnụ ya pụta.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ahọrọla gị.” Ngwaa Grik ahụ nwere ike ịpụta ịhọrọ mmadụ ma ọ bụ inye ya ọrụ pụrụ iche.
    reason: lexical_alternative
  - marker: b
    text: “Onye Ziri Ezi ahụ” bụ aha e ji akpọ Jizọs; a pụkwara ịsụgharị ya, “Onye Ezi omume ahụ.”
    reason: alternative_reading
lexical_decisions:
- source_word: προεχειρίσατό
  choice: họpụtara gị
  rationale: Ngwaa a na-egosi ịhọrọ mmadụ ma nye ya ọrụ ma ọ bụ ebumnuche. ‘Họpụtara gị’ bụ okwu Igbo doro anya ma kwekọọ n’ihe infinitive atọ na-esochi ya na-akọwa.
- source_word: γνῶναι
  choice: ka ị mara
  rationale: Nke a na-egosipụta ebumnuche nke nhọpụta ahụ n’Igbo nkịtị, ma na-edobe isi echiche nke ‘ịmara’ n’enweghị ịgbakwunye nkọwa.
- source_word: θέλημα
  choice: uche ya
  rationale: ‘Uche’ bụ okwu Igbo a na-ejikarị akọwa ihe Chineke chọrọ ma ọ bụ kpebiri; ọ naghị eme ka ihe okwu Grik ahụ pụtara dị warara karịa ka ọ dị.
- source_word: ἰδεῖν
  choice: hụ
  rationale: ‘Hụ’ bụ ntụgharị kpọmkwem, dị mfe, nke kwekọrọ n’asụsụ Igbo nke oge a.
- source_word: τὸν δίκαιον
  choice: Onye Ezi Omume ahụ
  rationale: Akụkụ okwu a na-arụ ọrụ dị ka aha e ji akọwa Jizọs n’Ọrụ Ndịozi. ‘Onye Ezi Omume ahụ’ na-egosi onye na-eme ihe ziri ezi ma na-edobe ịdị ya ka utu aha.
- source_word: ἀκοῦσαι φωνὴν
  choice: nụ olu
  rationale: ‘Nụ olu’ na-egosi olu a na-ekwu okwu, dịka nkebi na-esote banyere ọnụ ya si gosi, n’agbanyeghị na Grik etinyeghị edemede n’ihu φωνή.
- source_word: ἐκ τοῦ στόματος αὐτοῦ
  choice: si n’ọnụ ya pụta
  rationale: Nke a na-edobe onyinyo doro anya nke Grik—okwu sitere kpọmkwem n’ọnụ ya—n’ụdị Igbo dị ndụ ma bụrụkwa nke nkịtị.
- source_word: Ὁ θεὸς τῶν πατέρων ἡμῶν
  choice: Chineke nke nna nna anyị
  rationale: ‘Nna nna anyị’ na-edobe okwu nketa nke jikọtara Pọl na ndị nna Izrel, ma bụrụ ụzọ ebumpụta ụwa e si ekwu ya n’Igbo.
theological_decisions:
- issue: Ma a ga-ewere τὸν δίκαιον dị ka utu aha Kraịst ma ọ bụ naanị nkọwa mmadụ ezi omume
  choice: A sụgharịrị ya dịka utu aha ‘Onye Ezi Omume ahụ,’ nke na-ezo aka na Jizọs.
  alternative: ‘onye ezi omume ahụ’ ma ọ bụ ‘Onye Ikpe Ziri Ezi ahụ’
  rationale: N’Ọrụ Ndịozi 3:14 na 7:52, okwu a na-arụ ọrụ dịka utu aha e ji mara Jizọs. Ide mkpụrụedemede mbụ n’isi na-egosi ọrụ utu aha ahụ n’enweghị ịgbakwunye ihe ọzọ.
- issue: Ma a ga-eme πατέρων ka ọ bụrụ okwu na-adịghị akọwa nwoke ma ọ bụ nwanyị
  choice: E debere ya dịka ‘nna nna anyị.’
  alternative: ‘ndị nna ochie anyị’ ma ọ bụ ‘ndị bụ nna nna anyị’
  rationale: Grik ahụ kwuru kpọmkwem banyere ndị nna, okwu ahụ nwekwara mkpa n’ịkọwa nketa ọgbụgba ndụ Izrel. ‘Nna nna anyị’ na-edobe nke a n’Igbo dị mfe.
translation_notes:
  register: Asụsụ ahụ bụ Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E ji ‘họpụtara’ mee ka ịhọrọ maka ebumnuche pụta ìhè, ma e zere okwu ochie ma ọ bụ asụsụ otu ụka pụrụ iche.
