    reason: lexical_alternative
  - marker: b
    text: “Onye Ziri Ezi ahụ” bụ aha e ji akpọ Jizọs; a pụkwara ịsụgharị ya, “Onye Ezi omume ahụ.”
    reason: alternative_reading
  revision_rationale: The revision retains the source’s structure and ambiguity while using more exact Standard Igbo for the title τὸν δίκαιον. It removes the unsupported word “judge” from the footnote alternative and makes the ancestral expression less narrowly grandparental.
