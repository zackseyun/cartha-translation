base_translation:
  language: en
  yaml_path: translation/nt/acts/022/013.yaml
  text: He came to me[a], and standing by me said to me, ‘Brother Saul, receive your sight.’ And in that very hour I received my sight and looked at him.
translation:
  language: ig
  text: Ọ bịakwutere m[a], guzoro n'akụkụ m, sị m, “Nwanna Sọl, hụ ụzọ ọzọ.” N'otu oge ahụ kpọmkwem, ahụrụ m ụzọ ọzọ, lekwasịrị m ya anya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ngwaa e ji mee ihe ugboro abụọ n'amaokwu a ka “hụ ọzọ” ma ọ bụ “nwetaghachi ọhụhụ gị.” Ọ nwekwara ike ịpụta “lelie anya elu,” ma n'ihi ikpu ìsì na ọgwụgwọ dị n'akụkụ a, ihe ọ pụtara ebe a bụ ịhụ ụzọ ọzọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθὼν πρὸς ἐμέ
  choice: Ọ bịakwutere m
  rationale: Nke a na-egosipụta ngagharị ọ bịara n'ebe Pọl nọ n'Igbo dị mfe ma bụrụkwa nke akụkọ.
- source_word: ἐπιστάς
  choice: guzo n'akụkụ m
  rationale: Ọ na-egosi na ọ kwụsịrị guzo Pọl nso; usoro a dabara nke ọma n'okwu Igbo.
- source_word: Σαοὺλ ἀδελφέ
  choice: Nwanna Sọl
  rationale: A sụgharịrị aha ahụ dịka ụkpụrụ Igbo si dị, ebe “Nwanna” na-echekwa okwu ịkpọ mmadụ nke na-egosi mmekọrịta.
- source_word: ἀνάβλεψον
  choice: hụ ụzọ ọzọ
  rationale: N'ọnọdụ kpuru ìsì na ọgwụgwọ a, ngwaa ahụ pụtara ịmalite ịhụ ụzọ ọzọ karịa nanị ilelie anya elu.
- source_word: αὐτῇ τῇ ὥρᾳ
  choice: N'otu oge ahụ
  rationale: Nke a na-echekwa nkwusi ike na ihe ahụ mere kpọmkwem n'oge ahụ, n'Igbo nkịtị.
- source_word: ἀνέβλεψα
  choice: ahụrụ m ụzọ ọzọ
  rationale: E ji otu echiche ahụ sụgharịa ngwaa a dịka iwu dị n'ahịrị gara aga, ka mweghachi ọhụhụ pụta ìhè.
- source_word: εἰς αὐτόν
  choice: lekwasị ya anya
  rationale: Nke a na-echekwa ntụziaka ọhụhụ ahụ n'ebe Ananayas nọ, ọ bụghị nanị na Pọl hụrụ ya.
- source_word: κἀγώ
  choice: kwa
  rationale: “Kwa” na-egosipụta njikọ καί na ἐγώ n'ụzọ dị nkenke ma dị ndụ n'Igbo.
