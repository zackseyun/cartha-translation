  to: Ma ọchịagha ahụ zara[a], “Eji m nnukwu ego nweta ikike a ịbụ nwa amaala Rom.” Ma Pọl sịrị[b], “Ma a mụrụ m bụrụ nwa amaala Rom.”
  rationale: The revision clarifies that the tribune acquired the legal privilege/status of Roman citizenship, while preserving the source’s contrast with Paul, who possessed it by birth. It retains accessible Standard Igbo and preserves the original footnote anchors and their functions.
