base_translation:
  language: en
  yaml_path: translation/nt/acts/022/028.yaml
  text: But the tribune answered[a], “I acquired this citizenship for a large sum.” But Paul said[b], “But I was even born with it.”
translation:
  language: ig
  text: Ma ọchịagha ahụ zara[a], “Eji m nnukwu ego nweta ikike a ịbụ nwa amaala Rom.” Ma Pọl sịrị[b], “Ma a mụrụ m bụrụ nwa amaala Rom.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Eji m ego buru ibu nweta ikike a ịbụ nwa amaala Rom.”
    reason: lexical_alternative
  - marker: b
    text: N'ụzọ nkịtị, “Ma a mụọla m,” ebe a ghọtara ịbụ nwa amaala Rom site n'ihe a na-ekwu.
    reason: lexical_alternative
lexical_decisions:
- source_word: χιλίαρχος
  choice: ọchịagha
  rationale: Ọ bụ onyeisi ndị agha Rom nke nọ n'ọkwa dị elu; ‘ọchịagha’ bụ okwu Igbo doro ndị nkịtị anya ma kwekọọ n'ọrụ ya, ebe aha ọkwa Rom kpọmkwem agaghị adịcha mfe nghọta.
- source_word: πολλοῦ κεφαλαίου
  choice: nnukwu ego
  rationale: Nkebiokwu a na-ekwu maka ego buru ibu e ji nweta ọnọdụ ahụ; ‘nnukwu ego’ bụ Igbo dị mfe ma bụrụkwa nke ebumpụta ụwa.
- source_word: τὴν πολιτείαν ταύτην
  choice: ịbụ nwa amaala Rom a
  rationale: N'ebe a πολιτεία pụtara ọnọdụ iwu nke ịbụ nwa amaala Rom. Etinyere ‘Rom’ nke ihe gbara amaokwu ahụ gburugburu na-egosi, ka ihe ọ pụtara doo anya n'Igbo.
- source_word: ἐκτησάμην
  choice: nweta
  rationale: ‘Inweta’ na-echekwa obosara nke ngwaa Grik ahụ n'ebughị ụzọ kwuo hoo haa na ọ bụ ịzụta, ọ bụ ezie na nnukwu ego metụtara ya.
- source_word: καὶ γεγέννημαι
  choice: a mụrụ m dị ka nwa amaala Rom
  rationale: Nke a na-egosi na Pọl nwere ọnọdụ ahụ site n'ọmụmụ. A tụgharịghị καί iche dị ka ‘ọbụna’ n'ihi na usoro ntụnyere ‘Ma a mụrụ m...’ na-ebuga nkwusi ike ahụ n'Igbo n'ụzọ ebumpụta ụwa.
- source_word: δέ
  choice: Ma
  rationale: ‘Ma’ na-egosi ọdịiche dị n'etiti ihe ọchịagha kwuru na nzaghachi Pọl.
- source_word: ἔφη
  choice: sịrị
  rationale: ‘Sịrị’ bụ ụzọ Igbo nkịtị na nke kwesịrị ekwesị isi sụgharịa ngwaa okwu a n'enweghị ịgbakwunye ike na-adịghị na Grik.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo Izugbe, dị ugbu a ma dị ùgwù. A họọrọ ‘ọchịagha’ kama iji aha ọkwa Rom a na-amaghịkarị; a kọwara ọnọdụ nwa amaala dị ka nke Rom n'ihi ihe gbara amaokwu ahụ gburugburu.
