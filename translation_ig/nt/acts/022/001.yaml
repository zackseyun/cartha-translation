  register: Ejiri Igbo Izugbe nke oge a, nke nwere ugwu ma dị mfe nghọta. Okwu mmalite ahụ na-edobe usoro nkwanye ùgwù dị na Grik, ebe “okwu m ji azara onwe m” na-ezere nghọtahie na ọ bụ ịrịọ mgbaghara.
