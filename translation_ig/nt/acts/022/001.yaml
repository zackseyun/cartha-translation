  text: Ἄνδρες ἀδελφοὶ καὶ πατέρες, ἀκούσατέ μου τῆς πρὸς ὑμᾶς νυνὶ ἀπολογίας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/001.yaml
  text: Men[a], brothers and fathers, hear now my defense to you.
translation:
  language: ig
  text: Ndị ikom, ụmụnna na ndị nna, geenụ ntị n’okwu m ji azara onwe m ugbu a nye unu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “geenụ ntị n’okwu m ji azara onwe m nke m na-ekwu nye unu ugbu a.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄνδρες
  choice: Ndị nwoke
  rationale: Ọ bụ okwu a kpọrọ ọtụtụ ndị nwoke ihu na ihu. “Ndị nwoke” bụ Igbo doro anya nke na-edobe nwoke kpọmkwem dịka Grik si kwuo.
- source_word: ἀδελφοὶ
  choice: ụmụnna m
  rationale: N’ụdị okwu a a na-agwa ndị mmadụ n’ihu ọha, “ụmụnna m” na-ada nke ọma n’Igbo ma na-egosipụta mmekọrịta nke “ụmụnna.”
- source_word: πατέρες
  choice: ndị nna m
  rationale: Nke a na-edobe ihe oyiyi “ndị nna” na nkwanye ùgwù e nyere ndị okenye ma ọ bụ ndị a na-asọpụrụ, na-akọwaghị ha dịka ndị okenye nwere ọkwa ọchịchị.
- source_word: ἀκούσατέ
  choice: geenụ ntị
  rationale: Iwu a nyere ọtụtụ mmadụ pụtara ka ha gee ihe a ga-ekwu. “Geenụ ntị” bụ okwu Igbo nkịtị ma sie ike karịa nsụgharị nkịtị nke naanị ịnụ ụda.
- source_word: ἀπολογίας
  choice: okwu m ji azara onwe m
  rationale: N’ebe a, okwu Grik pụtara nkwupụta mmadụ ji agbachitere ma ọ bụ zaa ebubo, ọ bụghị ịrịọ mgbaghara. Nkebiokwu Igbo a na-eme ka ihe ahụ doo onye na-agụ akwụkwọ anya.
- source_word: νυνὶ
  choice: ugbu a
  rationale: “Ugbu a” na-edobe ịdị ngwa na oge nke arịrịọ ahụ.
- source_word: πρὸς ὑμᾶς
  choice: n’ihu unu
  rationale: Nke a bụ ụzọ Igbo dị mma isi kwuo na ọ na-eweta okwu ịgbachitere onwe ya n’ihu ndị na-ege ya ntị, ebe ọ ka na-edobe ntụziaka okwu ahụ n’ebe ha nọ.
