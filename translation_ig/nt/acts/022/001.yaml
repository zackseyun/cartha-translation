  source_fidelity: A chọrọ mmegharị. “Ụmụ nwoke” na-atụkarị aka n’ụmụ okorobịa/boys karịa ἄνδρες, ya mere “Ndị ikom” ka dabara. Ọzọkwa, mgbakwunye “m” na “ụmụnna m” na “ndị nna m” abụghị nke dị na Grik. “N’ihu unu” nwere ike ịpụta ikwu okwu n’ihu ọgbakọ, ma πρὸς ὑμᾶς ebe a na-egosi na agbachitere onwe ya a ka a na-agwa ndị na-ege ntị; “nye unu” na-edobe nke a nke ọma.
