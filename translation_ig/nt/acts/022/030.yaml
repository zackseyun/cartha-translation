  to: Ma n’echi ya, n’ihi na ọ chọrọ ịmata nke ọma ihe ndị Juu[a] na-ebo Pọl ebubo, ọ tọhapụrụ ya, nyekwa iwu ka ndị isi nchụaja na kansụl ahụ dum[b] zukọta. Ọ kpọdatara Pọl, mee ka o guzoro n’ihu ha.
  rationale: Ndozigharị ndị a anaghị agbanwe ihe amaokwu ahụ pụtara. Ha na-eme ka πᾶν τὸ συνέδριον bụrụ “kansụl ahụ dum,” mee ka usoro Igbo bụrụ nke eke, ma wepụ mmegharị okwu na nkọwa ala peeji.
