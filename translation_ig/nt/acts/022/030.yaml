  source_fidelity: 'Isi ihe dị na ntụgharị ahụ ziri ezi: ọ na-edobe usoro omume onyeisi agha ahụ—ịchọ ịmata eziokwu banyere ebubo, ịtọhapụ Pọl, inye iwu ka ndị isi nchụaja na kansụl zukọta, na idobe Pọl n’ihu ha. Otú ọ dị, “ndị kansụl ahụ niile” na-atụgharị πᾶν τὸ συνέδριον dị ka mmadụ niile nọ na kansụl karịa kansụl ahụ dum; “kansụl ahụ dum” ka ọ dabara kpọmkwem.'
