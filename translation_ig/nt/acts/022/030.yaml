id: ACT.22.30
reference: Acts 22:30
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Τῇ δὲ ἐπαύριον βουλόμενος γνῶναι τὸ ἀσφαλὲς τὸ τί κατηγορεῖται ⸀ὑπὸ τῶν Ἰουδαίων ἔλυσεν ⸀αὐτόν, καὶ ἐκέλευσεν ⸀συνελθεῖν τοὺς ἀρχιερεῖς καὶ ⸀πᾶν τὸ ⸀συνέδριον, καὶ καταγαγὼν τὸν Παῦλον ἔστησεν εἰς αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/030.yaml
  text: But on the next day[a], wanting to know for certain what he was being accused of by the Jews, he released him and ordered the chief priests and the whole council to assemble; and bringing Paul down[b], he set him before them.
translation:
  language: ig
  text: Ma n’echi ya, n’ihi na ọ chọrọ ịmata nke ọma ihe ndị Juu[a] na-ebo Pọl ebubo, ọ tọhapụrụ ya, nyekwa iwu ka ndị isi nchụaja na kansụl ahụ dum[b] zukọta. Ọ kpọdatara Pọl, mee ka o guzoro n’ihu ha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya ‘ndị isi Juu’ ma ọ bụ ‘ndị Judia.’ Grik kwuru ‘ndị Juu’; n’ebe a, ọ na-ekwu banyere ndị na-ebo Pọl ebubo, ọ bụghị banyere onye Juu ọ bụla n’enweghị ọdịiche.
    reason: lexical_alternative
  - marker: b
    text: ‘Kansụl’ a bụ Sanhedrin, ya bụ kansụl ọchịchị ndị Juu dị na Jerusalem.
    reason: cultural_note
lexical_decisions:
- source_word: Τῇ δὲ ἐπαύριον
  choice: Ma n’echi ya
  rationale: Nke a na-egosipụta oge, ‘n’echi ya,’ ebe ‘Ma’ na-edobe ntakịrị mgbanwe δέ wetara n’akụkọ ahụ n’enweghị ime ka ọ bụrụ nnukwu mmegide.
- source_word: βουλόμενος γνῶναι τὸ ἀσφαλές
  choice: ebe ọ chọrọ ịmata nke ọma
  rationale: Nkebi a na-egosi ebumnobi onyeisi agha ahụ na ọchịchọ ya inweta ihe a pụrụ ịdabere na ya n’ezie.
- source_word: τὸ τί κατηγορεῖται ὑπὸ τῶν Ἰουδαίων
  choice: ihe ndị Juu na-ebo Pọl ebubo
  rationale: Asụsụ Igbo na-eji usoro a arụ ọrụ karịa passive Grik. E tinyere ‘Pọl’ kama nnọchiaha iji mee ka onye a na-ebo ebubo doo anya n’ahịrịokwu nwere ọtụtụ nnọchiaha. ‘Ndị Juu’ na-edobe okwu Grik n’enweghị ịkọwa ya n’ụzọ dị warara n’ime isi ederede.
- source_word: ἔλυσεν αὐτόν
  choice: ọ tọhapụrụ ya
  rationale: λύω nwere ike ịpụta ịtọpụ ma ọ bụ ịhapụ mmadụ. N’ọnọdụ a, ‘tọhapụrụ’ na-ekwupụta ihe onyeisi agha ahụ mere n’asụsụ Igbo dị mfe ma kwe ka ọnọdụ gbara ya gburugburu gosi na e ji agbụ kee Pọl.
- source_word: ἐκέλευσεν συνελθεῖν
  choice: nyekwa iwu ka ... zukọta
  rationale: Nke a na-egosipụta iwu sitere n’aka onye nwere ikike, ma na-asụkwa nke ọma n’Igbo.
- source_word: τοὺς ἀρχιερεῖς
  choice: ndị isi nchụaja
  rationale: Nke a bụ aha ndị ndu nchụaja, ọ bụghị ikwu na e nwere ọtụtụ ndị isi nchụaja kacha elu na-eje otu ọkwa ahụ n’otu oge.
- source_word: πᾶν τὸ συνέδριον
  choice: ndị kansụl ahụ niile
  rationale: ‘Kansụl’ bụ okwu a na-aghọta n’Igbo ugbu a maka òtù ọchịchị na-ekpebi ihe; ‘niile’ na-egosipụta πᾶν. Ihe odide ala peeji kọwara òtù ahụ kpọmkwem.
- source_word: καταγαγὼν τὸν Παῦλον
  choice: Ọ kpọdatara Pọl
  rationale: ‘Kpọdatara’ na-edobe mmegharị ala nke καταγαγών ma na-aga nke ọma n’usoro akụkọ Igbo.
- source_word: ἔστησεν εἰς αὐτούς
  choice: mee ka o guzoro n’ihu ha
  rationale: Nke a na-egosi na onyeisi agha ahụ mere ka Pọl guzoro n’ihu òtù ahụ maka ịnụrụ okwu ya.
theological_decisions:
- issue: Otú e si sụgharịa Ἰουδαίων n’Ọrụ Ndị Ozi
  choice: ndị Juu
  alternative: ndị isi Juu; ndị Judia
  rationale: Okwu Grik ahụ bụ ‘ndị Juu.’ Isi ederede ahụ na-edobe obosara okwu ahụ, ebe ihe gbara ya gburugburu na-egosi na ọ bụ ndị na-ebo Pọl ebubo ka a na-ekwu, ọ bụghị ndị Juu niile n’enweghị oke.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu abụọ na-enyere onye na-agụ ya aka iso ọtụtụ omume dị n’ahịrịokwu Grik ahụ, n’enweghị iwepụ njikọ ha. E debere akara ihe odide ala peeji [a] n’akụkụ ‘ndị Juu’ na [b] n’akụkụ ‘kansụl,’ ya bụ ebe nkọwa nke ọ bụla metụtara kpọmkwem.
