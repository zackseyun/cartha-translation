  register: Asụsụ Igbo ọkọlọtọ, nke ugbu a ma dị ùgwù. Ahịrịokwu ahụ na-edobe usoro omume atọ na-eme n’otu oge nakwa akara ntụpọ ikpeazụ, ebe ọ bụ nkebi ahịrịokwu na-aga n’ihu n’amaokwu gbara ya gburugburu.
