review_pass:
  verdict: revise
  source_fidelity: The draft correctly retains the three simultaneous crowd actions and the unfinished, participial character of the verse. However, “uwe mwụda” means a skirt/lower garment and does not render Greek ἱμάτια, which denotes garments, especially outer garments. “Aja” can be understood, but “uzuzu” more directly expresses κονιορτός (“dust”) in this context.
  naturalness: The revised wording is idiomatic Standard Igbo, maintains the repeated progressive actions, and preserves the verse-final comma because the sentence continues in the following verse.
  terminology: “Uwe ha” is suitably broad for ἱμάτια and does not introduce the erroneous specificity of “uwe mwụda.” “Uzuzu” accurately conveys dust. The footnote retains the lexical uncertainty over whether the garments were cast away/off or tossed about.
  issues:
  - severity: high
    issue: “uwe mwụda ha” for τὰ ἱμάτια
    rationale: In Standard Igbo, “uwe mwụda” refers to a skirt or lower garment. The Greek refers generally to garments/outer garments, not specifically skirts.
  - severity: medium
    issue: Footnote alternative “na-atụgharị uwe ha”
    rationale: “Ịtụgharị” ordinarily means turn over/turn around and does not naturally communicate tossing garments about. The alternative should state the possible actions more accurately.
  revised_text: Ka ha nọ na-eti mkpu, na-atụpụ uwe ha[a], na-atụbakwa uzuzu n’ikuku,
  revised_footnotes:
