    text: A pụkwara ịsụ ya, “na-atụba uwe ha” ma ọ bụ “na-atụpụ uwe ha n’ahụ.” Okwu Grik ahụ nwere ike ịpụta na ha na-atụba uwe ha ma ọ bụ na-efegharị ha n’ihi oke iwe.
    reason: lexical_alternative
  revision_rationale: The revision replaces the inaccurate, overly specific “uwe mwụda” with the inclusive “uwe ha,” and replaces “aja” with “uzuzu” for the dust being thrown into the air. It also corrects the footnote’s misleading alternative while preserving the Greek verb’s contextual ambiguity.
