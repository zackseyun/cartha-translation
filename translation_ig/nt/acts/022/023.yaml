- from: Ka ha nọ na-eti mkpu, na-atụpụkwa uwe mwụda ha[a], na-efesakwa aja n’ikuku,
  to: Ka ha nọ na-eti mkpu, na-atụpụ uwe ha[a], na-atụbakwa uzuzu n’ikuku,
  rationale: The revision replaces the inaccurate, overly specific “uwe mwụda” with the inclusive “uwe ha,” and replaces “aja” with “uzuzu” for the dust being thrown into the air. It also corrects the footnote’s misleading alternative while preserving the Greek verb’s contextual ambiguity.
  reviewer_model: gpt-5.6-terra
