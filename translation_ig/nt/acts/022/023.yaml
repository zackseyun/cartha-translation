  text: ⸀κραυγαζόντων ⸀τε αὐτῶν καὶ ῥιπτούντων τὰ ἱμάτια καὶ κονιορτὸν βαλλόντων εἰς τὸν ἀέρα,
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/023.yaml
  text: And as they were shouting and throwing off their cloaks and flinging dust into the air,[a]
translation:
  language: ig
  text: Ka ha nọ na-eti mkpu, na-atụpụ uwe ha[a], na-atụbakwa uzuzu n’ikuku,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “na-atụba uwe ha” ma ọ bụ “na-atụpụ uwe ha n’ahụ.” Okwu Grik ahụ nwere ike ịpụta na ha na-atụba uwe ha ma ọ bụ na-efegharị ha n’ihi oke iwe.
    reason: lexical_alternative
lexical_decisions:
- source_word: κραυγαζόντων
  choice: Ka ha nọ na-eti mkpu
  rationale: A na-egosipụta participle nke na-aga n’ihu dịka omume na-eme n’otu oge; ‘na-eti mkpu’ bụ Igbo nkịtị nke na-egosi mkpu ike nke ìgwè mmadụ.
- source_word: τε
  choice: na-…-kwa
  rationale: Njikọ a jikọtara omume mbụ na ndị na-esochi ya; usoro ‘na-…-kwa’ na-eme ka njikọ ahụ daa nke ọma n’Igbo.
- source_word: αὐτῶν
  choice: ha
  rationale: Ọ bụ ezie na okwu Grik dị na genitive, ‘ha’ na-arụ ọrụ dịka isiokwu doro anya nke omume ndị a n’Igbo.
- source_word: ῥιπτούντων
  choice: na-atụpụkwa
  rationale: ‘Ịtụpụ’ na-edobe echiche bụ isi nke ịtụ ma ọ bụ iwepụ ihe n’ike, n’enweghị ikpebi kpamkpam ma ha tụpụrụ uwe ahụ n’ala ka hà na-efegharị ya n’iwe.
- source_word: τὰ ἱμάτια
  choice: uwe mwụda ha
  rationale: Ἱμάτια na-ezokarị aka n’uwe elu ma ọ bụ uwe a na-eyi n’èzí; ‘uwe mwụda’ bụ okwu Igbo a pụrụ ịghọta nke na-egosi ụdị uwe ahụ karịa naanị ‘uwe.’
- source_word: κονιορτόν
  choice: aja
  rationale: N’ọnọdụ a, ‘aja’ bụ okwu Igbo eke maka uzuzu ma ọ bụ ntụ ala mmadụ nwere ike ịtụ n’ikuku.
- source_word: βαλλόντων
  choice: na-efesakwa
  rationale: ‘Ịfesa’ na-egosi ịtụsa aja n’ike n’ikuku ma na-ezere ikwughachi ‘ịtụpụ’ ozugbo.
- source_word: εἰς τὸν ἀέρα
  choice: n’ikuku
  rationale: Nke a bụ ntụgharị Igbo dị mfe ma kwekọọ kpọmkwem n’echiche nke ịtụ ihe banye n’ikuku.
