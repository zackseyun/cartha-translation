revisions:
- from: O wee ruo na mgbe m laghachiri na Jerusalem, ka m nọ na-ekpe ekpere n’ogige ụlọ nsọ[a], m banyere n’ọnọdụ ọhụụ[b],
  to: O wee mee, mgbe m laghachiri na Jerusalem, ka m nọ na-ekpe ekpere n’ụlọ nsọ[a], m banyere n’ọnọdụ ọhụụ[b],
  rationale: The revision uses a more natural Standard Igbo narrative introduction and smooths the temporal clauses. It renders ἱερόν as “ụlọ nsọ,” while the footnote supplies the needed precinct/complex distinction. “M banyere n’ọnọdụ ọhụụ” retains the Greek sense of entering a trance or visionary state without adding an interpretation of its nature. The terminal comma is retained because Paul’s account continues in the following verse.
