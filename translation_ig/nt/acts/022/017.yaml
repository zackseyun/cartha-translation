  text: Ἐγένετο δέ μοι ὑποστρέψαντι εἰς Ἰερουσαλὴμ καὶ προσευχομένου μου ἐν τῷ ἱερῷ γενέσθαι με ἐν ἐκστάσει
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/017.yaml
  text: And it happened to me that[a], after I had returned to Jerusalem and while I was praying in the temple, I fell into a trance[b],
translation:
  language: ig
  text: O wee mee, mgbe m laghachiri na Jerusalem, ka m nọ na-ekpe ekpere n’ụlọ nsọ[a], m banyere n’ọnọdụ ọhụụ[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Okwu Grik ἱερόν na-ezo aka n’ogige na mpaghara ụlọ nsọ dum, ọ bụghị naanị ebe nsọ dị n’ime ya.
    reason: cultural_note
  - marker: b
    text: A pụkwara ịsụgharị ya, “anọ m n’ọnọdụ ọhụụ.” Okwu Grik ahụ pụtara n’ụzọ nkịtị, “ịghọ n’ọnọdụ ọhụụ,” ya bụ, ịbanye n’ọnọdụ pụrụ iche nke ọhụụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δέ μοι
  choice: O wee ruo na
  rationale: Nkebi okwu a na-ewebata ihe ọzọ mere n’akụkọ Pọl. “O wee ruo na” bụ ụzọ Igbo dị ndụ ma dị ùgwù si egosi mgbanwe ahụ n’akụkọ.
- source_word: ὑποστρέψαντι εἰς Ἰερουσαλήμ
  choice: mgbe m laghachiri na Jerusalem
  rationale: Aorist participle ahụ na-egosi na nlọghachi ahụ buru ihe bụ isi n’amaokwu a ụzọ; “mgbe m laghachiri” na-egosipụta usoro oge ahụ nke ọma.
- source_word: καὶ προσευχομένου μου
  choice: ka m nọ na-ekpe ekpere
  rationale: Ụdị okwu Grik a na-egosi omume na-aga n’ihu n’otu oge ahụ. “Ka m nọ na-ekpe ekpere” bụ Igbo e ji eme ihe nke na-edobe mmekọrịta oge ahụ.
- source_word: ἐν τῷ ἱερῷ
  choice: n’ogige ụlọ nsọ
  rationale: ἱερόν na-ezo aka n’ụlọ nsọ dum na ogige ya, ọ bụghị kpọmkwem ebe nsọ dị n’ime. “Ogige ụlọ nsọ” na-eme ka ọdịiche a pụta ìhè n’Igbo nkịtị.
- source_word: γενέσθαι με ἐν ἐκστάσει
  choice: m banyere n’ọnọdụ ọhụụ
  rationale: Ngwakọta γίνομαι na ἐν ἐκστάσει na-egosi ịbanye n’ọnọdụ pụrụ iche nke ọhụụ. Nsụgharị a na-ezere ikwu na mmụọ ya hapụrụ ahụ́ ya ma ọ bụ ịkọwa otú ahụmahụ ahụ si rụọ ọrụ karịa ihe ederede kwuru.
theological_decisions:
- issue: Ụdị ahụmahụ Pọl nwere (ἐκστάσει)
  choice: ọnọdụ ọhụụ
  alternative: ọnọdụ ịtụnanya; ekestasị
  rationale: “Ọnọdụ ọhụụ” na-eme ka onye na-agụ ya ghọta na ọ bụ ọnọdụ pụrụ iche metụtara ịhụ ọhụụ, ma ọ naghị ebubata nkọwa banyere usoro ahụmahụ ahụ ma ọ bụ ọnọdụ mmụọ Pọl nke amaokwu ahụ na-ekwughị.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe ma dị ùgwù mee ihe. A hapụrụ rikoma n’ọgwụgwụ n’ihi na ahịrịokwu Pọl gara n’ihu n’amaokwu na-esote. “Ogige ụlọ nsọ” na-enye nkọwa ziri ezi nke ἱερόν, ebe “ọnọdụ ọhụụ” na-echekwa enweghị nkọwa zuru ezu banyere ọdịdị ahụmahụ ahụ.
