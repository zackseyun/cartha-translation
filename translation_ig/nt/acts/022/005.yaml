id: ACT.22.5
reference: Acts 22:5
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὡς καὶ ὁ ἀρχιερεὺς μαρτυρεῖ μοι καὶ πᾶν τὸ πρεσβυτέριον· παρ’ ὧν καὶ ἐπιστολὰς δεξάμενος πρὸς τοὺς ἀδελφοὺς εἰς Δαμασκὸν ἐπορευόμην ἄξων καὶ τοὺς ἐκεῖσε ὄντας δεδεμένους εἰς Ἰερουσαλὴμ ἵνα τιμωρηθῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/005.yaml
  text: as also the high priest and the whole council of elders can testify for me. From them I also received letters to the brothers in Damascus[a], and I was traveling there to bring also those who were there, bound, to Jerusalem so that they might be punished.
translation:
  language: ig
  text: dịka onyeisi nchụaja na òtù ndị okenye niile nwekwara ike ịgbara m akaebe. Ọ bụkwa n’aka ha ka m natara akwụkwọ ozi e degaara ụmụnna nọ na Damaskọs[a]. Anọ m n’ụzọ na-aga Damaskọs ka m kpọtakwa ndị nọ ebe ahụ, ndị e keere agbụ, Jerusalem, ka e nye ha ntaramahụhụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ụmụnna nwoke na ụmụnna nwanyị.” Okwu Grik ahụ na-ekwu “ụmụnna nwoke,” ma n’ọnọdụ ụfọdụ ọ pụrụ izo aka n’òtù mmadụ sara mbara.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς καὶ
  choice: dịka ... nwekwara
  rationale: Ọ na-ejikọta amaokwu a na ihe Pọl kwuru tupu ya ma na-egosi na ndị a nwekwara ike ịkwado okwu ya.
- source_word: ὁ ἀρχιερεύς
  choice: onyeisi nchụaja
  rationale: Nke a bụ aha Igbo doro anya maka onye nọ n’isi ọrụ nchụaja n’oge ahụ.
- source_word: μαρτυρεῖ μοι
  choice: ike ịgbara m akaebe
  rationale: Ọ na-egosi na onyeisi nchụaja na ndị okenye nwere ike ịkwado eziokwu nke ihe Pọl kwuru.
- source_word: πᾶν τὸ πρεσβυτέριον
  choice: òtù ndị okenye niile
  rationale: πρεσβυτέριον bụ òtù ma ọ bụ nzukọ ndị okenye, ọ bụghị nanị ndị mmadụ merela agadi.
- source_word: παρ’ ὧν
  choice: n’aka ha
  rationale: Nke a na-ezo aka n’ebe onyeisi nchụaja na òtù ndị okenye nọ dị ka ndị nyere Pọl akwụkwọ ozi ahụ.
- source_word: ἐπιστολάς
  choice: akwụkwọ ozi
  rationale: Nke a na-edobe isi ihe okwu Grik pụtara; ọnọdụ akụkọ ahụ na-egosi na ha bụ akwụkwọ ikike ọchịchị.
- source_word: πρὸς τοὺς ἀδελφούς
  choice: e degaara ụmụnna
  rationale: ‘Ụmụnna’ bụ okwu Igbo kwesịrị ekwesị maka ndị otu obodo ma ọ bụ okwukwe, ma ọ ka na-ahapụ ohere gbasara ndị okwu ahụ gụnyere.
- source_word: ἐπορευόμην
  choice: Anọ m n'ụzọ ịga
  rationale: Nke a na-egosipụta omume gara aga nke ka na-aga n’ihu, dịka imperfect Grik si dị.
- source_word: ἄξων
  choice: ka m kpọtakwa
  rationale: Future participle a na-egosi ebumnuche njem Pọl.
- source_word: τοὺς ἐκεῖσε ὄντας
  choice: ndị nọ ebe ahụ
  rationale: Nke a bụ ntụgharị kwụ ọtọ ma dị mfe nghọta nke ndị nọ na Damaskọs.
- source_word: δεδεμένους
  choice: n’agbụ
  rationale: Ọ na-egosi ọnọdụ ha dịka ndị e jidere, na-akọwaghị ụdị agbụ ahụ karịa ihe Grik kwuru.
- source_word: ἵνα τιμωρηθῶσιν
  choice: ka e nye ha ntaramahụhụ
  rationale: Nke a na-egosipụta ebumnuche ikpe na inye ha ahụhụ n’etinyeghị ụdị ntaramahụhụ a na-ekwughị n’akwụkwọ.
theological_decisions:
- issue: Otu a ga-esi tụgharịa ἀδελφοί mgbe ọ pụrụ ịgụnye obodo karịrị ụmụ nwoke naanị
  choice: ụmụnna
  alternative: ụmụnne nwoke; ụmụnna nwoke na ụmụnna nwanyị
  rationale: ‘Ụmụnna’ bụ okwu Igbo ebumpụta ụwa nke pụrụ izo aka n’otu ndị ha na ibe ha nwere mmekọrịta. Ihe e dere n’okpuru na-eme ka onye na-agụ ya mara na okwu Grik bụ ụdị nke na-ekwu ‘ụmụnne nwoke,’ ma na ọ pụrụ ịgụnye obodo sara mbara.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ ‘òtù ndị okenye’ kama okwu ụka pụrụ iche, a hapụkwara obosara ihe ‘ụmụnna’ pụrụ ịpụta ka ihe odide Grik si kwe.
