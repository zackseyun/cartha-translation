- from: dịka onyeisi nchụaja na òtù ndị okenye niile nwekwara ike ịgbara m akaebe. Ọ bụkwa n’aka ha ka m natara akwụkwọ ozi e degaara ụmụnna nọ na Damaskọs[a]. Anọ m n'ụzọ ịga ebe ahụ ka m kpọtakwa ndị nọ ebe ahụ na Jerusalem n’agbụ, ka e nye ha ntaramahụhụ.
  to: dịka onyeisi nchụaja na òtù ndị okenye niile nwekwara ike ịgbara m akaebe. Ọ bụkwa n’aka ha ka m natara akwụkwọ ozi e degaara ụmụnna nọ na Damaskọs[a]. Anọ m n’ụzọ na-aga Damaskọs ka m kpọtakwa ndị nọ ebe ahụ, ndị e keere agbụ, Jerusalem, ka e nye ha ntaramahụhụ.
