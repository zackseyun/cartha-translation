  text: ὡς δὲ οὐκ ἐνέβλεπον ἀπὸ τῆς δόξης τοῦ φωτὸς ἐκείνου, χειραγωγούμενος ὑπὸ τῶν συνόντων μοι ἦλθον εἰς Δαμασκόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/011.yaml
  text: And since I could not see because of the brightness of that light[a], I came into Damascus being led by the hand by those who were with me.
translation:
  language: ig
  text: Ma ebe ọ bụ na enweghị m ike ịhụ ụzọ n’ihi nnukwu mgbukepụ nke ìhè ahụ[a], ndị mụ na ha nọ duuru m n’aka, m wee bata na Damaskọs.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n’ụzọ nkịtị karịa, “n’ihi ebube nke ìhè ahụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνέβλεπον
  choice: enweghị m ike ịhụ ụzọ
  rationale: N’ọnọdụ a, okwu ahụ na-egosi na ìhè ahụ mere ka Pọl ghara ịhụ ụzọ, ọ bụghị naanị na o nweghị ike ilegide ya anya.
- source_word: ἀπὸ τῆς δόξης τοῦ φωτὸς ἐκείνου
  choice: n’ihi ịma mma nke ìhè ahụ
  rationale: N’ebe a, δόξα na-ezo aka n’ìhè na-enwu nnọọ ike. ‘Ịma mma’ na-egosi ebube na mgbukepụ ya n’Igbo dị mfe, ebe nkọwa ala peeji na-echekwa nsụgharị nkịtị ‘ebube.’
- source_word: χειραγωγούμενος
  choice: duuru m n’aka
  rationale: Nke a na-echekwa nkọwa doro anya nke iduzi mmadụ site n’ijide ya n’aka.
- source_word: ὑπὸ τῶν συνόντων μοι
  choice: ndị mụ na ha nọ
  rationale: Ọ na-asụgharị okwu Grik ahụ n’ụzọ kwụ ọtọ, n’etinyeghị echiche na ha bụ ndị otu pụrụ iche.
- source_word: ἦλθον εἰς Δαμασκόν
  choice: m wee bata na Damaskọs
  rationale: ‘Bata na’ na-echekwa echiche mmegharị banye n’obodo ahụ nke εἰς na-egosi.
- source_word: ὡς δὲ
  choice: Ma ebe ọ bụ na
  rationale: Ọ na-aga n’ihu n’akụkọ ahụ ma na-egosikwa ihe kpatara na e duuru ya n’aka.
theological_decisions:
- issue: Nsụgharị δόξα n’ọnọdụ ìhè si n’eluigwe pụta
  choice: ịma mma
  alternative: ebube; mgbukepụ
  rationale: N’ahịrịokwu a, δόξα na-arụ ọrụ dị ka ike na mgbukepụ nke ìhè ahụ nke mere ka ọ ghara ịhụ ụzọ. ‘Ịma mma’ na-enye echiche nke ịdị ebube na-enwu enwu n’asụsụ a na-aghọta ngwa ngwa, ebe nkọwa ala peeji na-echekwa ‘ebube’ nke bụ nsụgharị nkịtị ma nwee ibu okwu okpukpe.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E debere nkọwa ahụ n’usoro akụkọ sitere n’ọnụ onye na-ekwu okwu, ma chekwaa nkọwa doro anya nke iduzi ya n’aka.
