    text: Ma ọ bụ, n’ụzọ nkịtị karịa, “n’ihi ebube nke ìhè ahụ.”
    reason: lexical_alternative
  revision_rationale: The revision replaces “ịma mma” with “nnukwu mgbukepụ” to express the dazzling brightness/splendor of the light, the immediate sense of δόξα in this clause. It retains “ebube” as the literal alternative in a natural Igbo footnote. The remaining phrasing preserves the source’s causal connection and explicit hand-guidance.
