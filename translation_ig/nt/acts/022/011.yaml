  to: Ma ebe ọ bụ na enweghị m ike ịhụ ụzọ n’ihi nnukwu mgbukepụ nke ìhè ahụ[a], ndị mụ na ha nọ duuru m n’aka, m wee bata na Damaskọs.
  rationale: The revision replaces “ịma mma” with “nnukwu mgbukepụ” to express the dazzling brightness/splendor of the light, the immediate sense of δόξα in this clause. It retains “ebube” as the literal alternative in a natural Igbo footnote. The remaining phrasing preserves the source’s causal connection and explicit hand-guidance.
