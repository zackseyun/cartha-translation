  register: Ejiri Standard Igbo nke oge a, nke dị ùgwù ma doo anya. A hapụrụ ọdịdị mkpu ìgwè mmadụ ahụ ka ọ sie ike, ma zere okwu ochie ma ọ bụ nkọwa okpukpe agbakwunyere.
