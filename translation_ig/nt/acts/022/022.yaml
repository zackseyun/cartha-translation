base_translation:
  language: en
  yaml_path: translation/nt/acts/022/022.yaml
  text: They were listening to him up to this statement, and they raised their voices, saying, “Take such a man away from the earth, for it was not fitting for him to live.”
translation:
  language: ig
  text: Ha nọ na-ege ya ntị ruo n'okwu a, ha weliri olu ha, sị, “Wepụ nwoke dị otu a n'elu ụwa[a], n'ihi na ọ bụghị ihe kwesịrị ekwesị ka ọ dị ndụ.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Ka nwoke dị otu a pụọ n'ụwa!”
    reason: lexical_alternative
  - marker: b
    text: Nke a pụtara na ha chọrọ ka e gbuo ya; a pụkwara ịsụgharị ya, “n'ihi na o kwesịghị ịdị ndụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἤκουον
  choice: Ha nọ na-ege ya ntị
  rationale: Ụdị imperfect na-egosi omume gara n'ihu n'oge gara aga; okwu a na-egosipụta na ha nọgidere na-ege ya ntị.
- source_word: ἄχρι τούτου τοῦ λόγου
  choice: ruo n'okwu a
  rationale: λόγος n'ebe a bụ okwu ma ọ bụ isi ihe Pọl kwuru nke kpaliri mmeghachi omume ahụ, ọ bụghị nanị otu mkpụrụokwu.
- source_word: ἐπῆραν τὴν φωνὴν αὐτῶν
  choice: ha weliri olu ha
  rationale: Nke a na-edobe ihe atụ dị n'okwu Grik ma na-egosi na ha tiri mkpu n'olu ike.
- source_word: λέγοντες
  choice: na-asị
  rationale: Ọ na-ewebata kpọmkwem ihe ìgwè mmadụ ahụ kwuru.
- source_word: Αἶρε
  choice: Wepụ
  rationale: N'ọnọdụ iwe a, ngwaa ahụ pụtara iwepụ onye ahụ; iwu dị mkpụmkpụ na Igbo na-egosipụta ike mkpu ahụ.
- source_word: ἀπὸ τῆς γῆς
  choice: n'ụwa
  rationale: γῆ nwere ike ịbụ ala ma ọ bụ ụwa; n'ebe a, 'n'ụwa' na-egosi ọchịchọ ha ka e wepụ Pọl n'etiti ndị dị ndụ.
- source_word: τὸν τοιοῦτον
  choice: ụdị nwoke a
  rationale: Nke a na-echekwa nlelị dị na okwu Grik ma na-ada ka Igbo nke oge a.
- source_word: οὐ γὰρ καθῆκεν αὐτὸν ζῆν
  choice: n'ihi na o kwesịghị ịdị ndụ
  rationale: καθῆκεν na-ekwu banyere ihe kwesịrị ekwesị ma ọ bụ ihe kwesịrị ime; nsụgharị a bụ nke okike n'Igbo ma na-echekwa ike okwu ìgwè ahụ.
