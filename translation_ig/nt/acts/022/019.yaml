source:
  edition: SBLGNT
  text: κἀγὼ εἶπον· Κύριε, αὐτοὶ ἐπίστανται ὅτι ἐγὼ ἤμην φυλακίζων καὶ δέρων κατὰ τὰς συναγωγὰς τοὺς πιστεύοντας ἐπὶ σέ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/019.yaml
  text: And I said[a], ‘Lord[b], they themselves know that in every synagogue I was imprisoning and beating those who believe in you.’
translation:
  language: ig
  text: M wee sị, “Onyenwe anyị, ha onwe ha maara na n’ụlọ nzukọ ọ bụla[a], m na-atụba ndị na-ekwere na gị[b] n’ụlọ mkpọrọ ma na-etikwa ha ihe.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “site n’otu ụlọ nzukọ gaa n’ọzọ”; okwu Grik ahụ na-egosi omume e mere ugboro ugboro n’ụlọ nzukọ dị iche iche.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, “ndị tụkwasịrị gị obi” ma ọ bụ “ndị nwere okwukwe n’ime gị.”
    reason: alternative_reading
lexical_decisions:
- source_word: κἀγὼ εἶπον
  choice: M wee sị
  rationale: “Wee” na-egosi njikọ akụkọ nke καί, ebe “m” na “sị” na-ebuga ἐγώ na εἶπον n’Igbo dị mfe ma dị ndụ.
- source_word: Κύριε
  choice: Onyenwe anyị
  rationale: Ọ bụ okwu a na-akpọ Jizọs kpọmkwem; “Onyenwe anyị” na-echekwa nsọpụrụ na ịdị arọ nke κύριος n’enweghị ịgbakwụnye nkọwa ọzọ.
- source_word: αὐτοὶ ἐπίστανται
  choice: ha onwe ha maara
  rationale: “Ha onwe ha” na-echekwa nkwusi ike dị na αὐτοὶ, “maara” bụkwa ụzọ Igbo nkịtị si kwuo ἐπίστανται.
- source_word: ἤμην φυλακίζων καὶ δέρων
  choice: m na-atụbu ... mkpọrọ ma na-eti ha ihe
  rationale: “Na-atụbu” na-egosi omume gara aga a na-eme ugboro ugboro; “na-eti ha ihe” na-ebuga δέρων n’enweghị ịkọwapụta ụdị ntaramahụhụ ahụ karịa ihe Grik kwuru.
- source_word: κατὰ τὰς συναγωγάς
  choice: n’ụlọ nzukọ ọ bụla
  rationale: 'Nke a na-egosipụta ụzọ nkesa nke κατά na accusative: omume ahụ mere n’ụlọ nzukọ dị iche iche, ọ bụghị nanị n’otu ebe.'
- source_word: τοὺς πιστεύοντας ἐπὶ σέ
  choice: ndị na-ekwere na gị
  rationale: Ụdị “na-ekwere” na-echekwa omume dị ugbu a/nọgide na-adị nke participle, ebe “na gị” na-egosi na okwukwe ahụ lekwasịrị Jizọs anya.
theological_decisions:
- issue: Otú e si sụgharị κύριος mgbe Pọl na-agwa Jizọs okwu
  choice: Onyenwe anyị
  alternative: Nna ukwu
  rationale: “Onyenwe anyị” na-echekwa ma nkwanye ùgwù ma ịdị arọ gbasara onye Jizọs bụ n’akụkọ ahụ, ma ọ naghị amanye nkọwa okpukpe karịrị ihe ederede kwuru.
- issue: Ụdị omume mkpagbu Pọl n’oge gara aga
  choice: m na-atụbu ... mkpọrọ ma na-eti ha ihe
  alternative: m nọ na-atụba ... mkpọrọ ma na-eti ha ihe
  rationale: Ihe owuwu Grik na-egosi omume gara aga nke na-aga n’ihu ma ọ bụ nke a na-eme ugboro ugboro. “Na-atụbu” na-egosipụta omume ọ na-emebu n’Igbo nkịtị; akụkụ nke abụọ nọ n’otu usoro njikọta ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-edobe nkwusi ike nke “ha onwe ha,” omume mkpagbu Pọl ọ na-emebu, na nghọta nkesa nke ụlọ nzukọ dị iche iche. E debere akara ndetu ala ala [a] na [b] n’ebe okwu ndị ha na-akọwa dị.
