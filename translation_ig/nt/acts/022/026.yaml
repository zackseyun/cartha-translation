  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀκούσας δὲ ὁ ἑκατοντάρχης προσελθὼν ⸂τῷ χιλιάρχῳ ἀπήγγειλεν⸃ λέγων· ⸀Τί μέλλεις ποιεῖν; ὁ γὰρ ἄνθρωπος οὗτος Ῥωμαῖός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/026.yaml
  text: When the centurion heard this[a], he went to the commander and reported it, saying[b], “What are you about to do? For this man is a Roman citizen.”
translation:
  language: ig
  text: Mgbe onyeisi ndị agha narị ahụ nụrụ nke a, ọ gakwuuru ọchịagha ahụ ma kọọrọ ya, sị, “Gịnị ka ị na-aga ime[a]? N’ihi na nwoke a bụ nwa amaala Rom[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “Gịnị ka ị chọrọ ime?” Okwu Grik ahụ nwere ike izo aka n’ihe mmadụ na-achọ ime ozugbo ma ọ bụ n’ihe mmadụ bu n’obi ime.
    reason: lexical_alternative
  - marker: b
    text: N’ụzọ nkịtị, “nwoke a bụ onye Rom.” N’ebe a, ihe ọ pụtara bụ na nwoke a nwere ọnọdụ nwa amaala Rom.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσας
  choice: Mgbe ... nụrụ nke a
  rationale: Nkebi a na-egosi ihe mere tupu ngwaa bụ isi; nsụgharị a na-enye usoro oge ahụ n’Igbo dị mfe ma doo anya.
- source_word: ἑκατοντάρχης
  choice: onyeisi ndị agha narị
  rationale: Nke a na-egosipụta ọkwa onyeisi agha Rom nke na-elekọta ihe dị ka ndị agha otu narị, n’enweghị iji aha ọkwa Bekee ma ọ bụ Grik ndị ọtụtụ ndị agaghị aghọta.
- source_word: προσελθὼν
  choice: ọ gakwuuru
  rationale: Okwu a na-egosi na ọ gara bịaruo onyeisi ya nso; “gakwuuru” bụ okwu Igbo ebumpụta ụwa maka mmegharị ahụ.
- source_word: χιλιάρχῳ
  choice: ọchịagha ahụ
  rationale: N’ebe a, χιλίαρχος bụ onyeisi agha Rom dị elu karịa onyeisi ndị agha narị. “Ọchịagha” na-enye echiche ọkwa ahụ n’asụsụ a na-aghọta ngwa ngwa.
- source_word: ἀπήγγειλεν
  choice: kọọrọ ya
  rationale: Ngwaa ahụ pụtara izi ma ọ bụ ịkọrọ onye ọzọ ozi; nhọrọ a dabara n’ọnọdụ akụkọ agha a.
- source_word: λέγων
  choice: sị
  rationale: “Sị” jikọtara ihe ọ kọọrọ ya na okwu ọnụ ya n’Igbo dị nkenke ma bụrụ nke ebumpụta ụwa.
- source_word: Τί μέλλεις ποιεῖν;
  choice: Gịnị ka ị na-aga ime?
  rationale: μέλλω na infinitive nwere ike igosi ihe a na-achọ ime ma ọ bụ ihe na-achọ ime ozugbo. Okwu Igbo a dị mfe ma nwee ike ibu echiche abụọ ahụ.
- source_word: ὁ γὰρ ἄνθρωπος οὗτος
  choice: N’ihi na nwoke a
  rationale: γάρ na-enye ihe kpatara ịdọ aka ná ntị ahụ, ebe ἄνθρωπος na-ezo aka n’otu nwoke a kpọrọ aha n’akụkọ ahụ.
- source_word: Ῥωμαῖός ἐστιν
  choice: bụ nwa amaala Rom
  rationale: N’ọnọdụ iwu a, ihe a na-ekwu bụ na o nwere ikike ịbụ nwa amaala Rom, ọ bụghị nanị na ọ bụ onye si Rom.
theological_decisions: []
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta mee nsụgharị ahụ. A kọwara ọkwa ndị agha n’okwu Igbo kama iji mkpụrụokwu ndị e si n’asụsụ ọzọ webata; e mekwara ka ọdịiche dị n’etiti onyeisi ndị agha narị na ọchịagha dị elu pụta ìhè.
