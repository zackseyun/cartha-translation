  source_fidelity: 'The draft accurately retains the Greek contrast: Paul''s companions saw the light but did not hear the voice of the one speaking to Paul. It does not add ‘men’ or resolve the tension with Acts 9:7 in the main text.'
  naturalness: ‘Ndị ha na m nọ’ is understandable, but it is less idiomatic and can momentarily sound like a locative statement (‘the people who were where I was’) rather than companions. ‘Ndị mụ na ha so’ is a natural Standard Igbo expression for those accompanying someone in this narrative setting.
  terminology: ‘Ìhè,’ ‘olu,’ and ‘na-agwa m okwu’ are appropriate, clear, and suitably neutral. The footnote preserves the possible hearing/understanding nuance without asserting a harmonization as certain.
