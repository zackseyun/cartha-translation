id: ACT.22.9
reference: Acts 22:9
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οἱ δὲ σὺν ἐμοὶ ὄντες τὸ μὲν φῶς ⸀ἐθεάσαντο τὴν δὲ φωνὴν οὐκ ἤκουσαν τοῦ λαλοῦντός μοι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/009.yaml
  text: Those who were with me saw the light[a], but they did not hear the voice of the one speaking to me.
translation:
  language: ig
  text: Ndị mụ na ha so hụrụ ìhè ahụ, ma ha anụghị olu onye ahụ na-agwa m okwu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ha aghọtaghị olu ahụ.” Tulee Ọrụ Ndịozi 9:7, ebe e kwuru na ndị ha na Pọl so nụrụ ụda ma ọ bụ olu; ihe dị iche nwere ike ịbụ ịnụ ụda na ịghọta onye na-ekwu okwu.
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ δὲ σὺν ἐμοὶ ὄντες
  choice: Ndị ha na m nọ
  rationale: Ọ na-asụgharị nkebi participle a n'ụzọ Igbo dị mfe ma ghara ịgbakwụnye ‘ndị ikom,’ nke ederede Grik ekwughị kpọmkwem.
- source_word: τὸ μὲν φῶς
  choice: ìhè ahụ
  rationale: φῶς pụtara ‘ìhè’; μέν na δέ na-egosi ọdịiche nke e gosipụtara site na ‘ma.’ Agbakwụnyeghị ‘na-enwu gbaa’ n’ihi na amaokwu a ekwughị ya.
- source_word: ἐθεάσαντο
  choice: hụrụ
  rationale: θεάομαι nwere echiche nke ịhụ ma ọ bụ ilegide anya; ‘hụrụ’ bụ okwu Igbo nkịtị, doo anya, na-adịghị etinye ebumnuche ile anya nke isi mmalite na-achọghị.
- source_word: τὴν δὲ φωνὴν
  choice: olu
  rationale: φωνή nwere ike ịbụ ‘olu’ ma ọ bụ ‘ụda.’ ‘Olu’ dabara ebe a n’ihi na ihe na-esochi ya na-ekwu maka onye na-ekwu okwu.
- source_word: οὐκ ἤκουσαν
  choice: ha anụghị
  rationale: ἀκούω na-apụtakarị ‘ịnụ’; a hapụrụ ihe ọ pụtara n’ụzọ kwụ ọtọ n’ahịrị bụ isi, ebe a kọwara nhọrọ ‘aghọtaghị’ n’okpuru peeji.
- source_word: τοῦ λαλοῦντός μοι
  choice: onye ahụ na-agwa m okwu
  rationale: Ọ na-echekwa omume na-aga n’ihu nke participle λαλοῦντος, ma na-ada ka Igbo nke oge a.
theological_decisions:
- issue: Ọdịiche yiri ka ọ dị n’etiti Ọrụ Ndịozi 22:9 na 9:7 banyere ma ndị so Pọl hà nụrụ olu ahụ
  choice: ha anụghị olu onye ahụ na-agwa m okwu
  alternative: ha aghọtaghị olu ahụ
  rationale: Ederede Grik ebe a na-ekwu n’ụzọ kwụ ọtọ na ha anụghị olu ahụ. Ma n’ihi na ἀκούω na φωνή nwere obosara echiche, tinyere okwu Ọrụ Ndịozi 9:7, a hapụrụ esemokwu ahụ n’ahịrị bụ isi ma tinye nkọwa nwere ike ịbụ na ha nụrụ ụda ma ha aghọtaghị onye na-ekwu okwu n’okpuru peeji.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E jighị okwu ochie ma ọ bụ okwu nke otu ụka pụrụ iche; a debere nghọtahie dị n’etiti amaokwu ndị yiri ibe ha kama idozi ya n’ahịrị bụ isi.
