id: ACT.22.20
reference: Acts 22:20
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ὅτε ⸀ἐξεχύννετο τὸ αἷμα Στεφάνου τοῦ μάρτυρός σου, καὶ αὐτὸς ἤμην ἐφεστὼς καὶ συνευδοκῶν ⸀καὶ φυλάσσων τὰ ἱμάτια τῶν ἀναιρούντων αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/020.yaml
  text: And when the blood of Stephen your witness was being poured out[a], I myself was standing by and approving, and guarding the cloaks of those who were killing him.
translation:
  language: ig
  text: Mgbe a na-awụpụ ọbara Stivin, onye akaebe gị,[a] mụ onwe m nọ n'ebe ahụ, na-anabata ya, na-echekwa uwe mpụta nke ndị na-egbu ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “onye nwụrụ n’ihi ịgba akaebe ya.” Okwu Gris a pụtara “onye akaebe,” ma n’iji Ndị Kraịst ji ya eme ihe, e mechara jikọta ya karịsịa na onye nwụrụ n’ihi ịgba akaebe ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξεχύννετο
  choice: a na-awụpụ
  rationale: Na-egosi imperfect passive ahụ dị ka ihe na-aga n'ihu, ma na-edokwa ihe atụ doro anya nke ịwụpụ ọbara.
- source_word: αἷμα
  choice: ọbara
  rationale: Ntụgharị kwụ ọtọ na nke a na-ejikarị eme ihe n'Igbo.
- source_word: μάρτυρός
  choice: onye akaebe
  rationale: Nke a na-ebute isi nghọta lexical nke μάρτυς n'ihu, na-enweghị ibubata aha ụka e mesịrị n'ime isi ederede.
- source_word: ἐφεστὼς
  choice: guzoro n'ebe ahụ
  rationale: Na-egosi na Pọl nọ nso ma guzo ebe ihe ahụ na-eme, n'Igbo dị mfe ma kwekọọ n'ọnọdụ ahụ.
- source_word: συνευδοκῶν
  choice: na-ekwenye na nke ahụ
  rationale: Na-egosi nkwenye na nnabata nke ihe a na-eme, ọ bụghị naanị na ọ nọ ebe ahụ.
- source_word: φυλάσσων
  choice: na-echekwa
  rationale: Kwesịrị ekwesị maka ilekọta ma ọ bụ iche uwe ndị ahụ nche.
- source_word: ἱμάτια
  choice: uwe elu
  rationale: Na-ezo aka n'uwe mpụta ndị ndị na-egbu Stivin yipụrụ; nke a kapịrị ọnụ karịa naanị 'uwe.'
- source_word: ἀναιρούντων
  choice: ndị na-egbu
  rationale: Na-enye nghọta kpọmkwem nke igbu mmadụ n'okwu Igbo dị ugbu a, na-agbakwụghị ikpe omume ọzọ na okwu Gris ahụ.
- source_word: αὐτὸς
  choice: mụ onwe m
  rationale: Na-echekwa nkwusi okwu dị na nnọchiaha Gris ahụ.
theological_decisions:
- issue: Ntụgharị μάρτυς mgbe a na-ekwu maka Stivin
  choice: onye akaebe
  alternative: onye nwụrụ n'ihi okwukwe ya
  rationale: μάρτυς pụtara n'ụzọ bụ isi 'onye akaebe.' Ọnọdụ ọnwụ Stivin mere ka okwu ahụ mechaa jikọta na onye nwụrụ n'ihi okwukwe ya, ma isi ederede ekwesịghị ibubata nghọta ụka e mesịrị ma mee ka ọ bụrụ naanị otu nghọta.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. A họọrọ usoro okwu na-aga n'ihu iji gosipụta imperfect na participles nke Gris, ma zere okwu ụka pụrụ iche n'isi ederede.
