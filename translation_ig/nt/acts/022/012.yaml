source:
  edition: SBLGNT
  text: Ἁνανίας δέ τις ἀνὴρ ⸀εὐλαβὴς κατὰ τὸν νόμον μαρτυρούμενος ὑπὸ πάντων τῶν κατοικούντων Ἰουδαίων,
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/012.yaml
  text: A certain man[a], Ananias, devout according to the law, well spoken of by all the Jews living there,
translation:
  language: ig
  text: Otu nwoke aha ya bụ Ananayas, onye na-atụ egwu Chineke dịka Iwu ahụ si dị, onye ndị Juu[a] niile bi n’ebe ahụ na-agba ama ọma banyere ya,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị Judia,” ma ọ bụrụ na a ghọta okwu a dịka aha agbụrụ ma ọ bụ ndị si n’ógbè Judia, karịa dịka aha obodo okpukpe.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἁνανίας
  choice: Ananayas
  rationale: E dere aha onye ahụ n’ụzọ kwekọrọ na mkpọpụta na usoro ide aha Grik n’Igbo.
- source_word: δέ
  choice: —
  rationale: Ọ bụ njikọ akụkọ dị nro; n’ebe a, usoro ahịrịokwu Igbo na-eburu ọrụ ya n’enweghị itinye okwu pụrụ iche.
- source_word: τις ἀνὴρ
  choice: otu nwoke
  rationale: Nke a na-egosi otu nwoke a kapịrị ọnụ nke a na-akọwa ugbu a, ma a kpọpụtaghị ya na mbụ.
- source_word: εὐλαβής
  choice: onye na-atụ egwu Chineke
  rationale: Nke a bụ okwu Igbo dị ndụ nke na-egosi nsọpụrụ Chineke na ịdị uchu n’okpukpe; ihe na-esochi ya kọwara ya n’ihe metụtara Iwu.
- source_word: κατὰ τὸν νόμον
  choice: na-ebi ndụ dịka Iwu ahụ si dị
  rationale: Ọ na-egosi na nsọpụrụ okpukpe Ananayas kwekọrọ n’Iwu Mosis; nsụgharị a bụ nke okike n’Igbo ma doo anya.
- source_word: μαρτυρούμενος
  choice: na-agba ama ọma banyere ya
  rationale: Ọ na-echekwa echiche nke ama ndị ọzọ na-agba banyere ya, nakwa na ama ahụ dị mma.
- source_word: ὑπὸ πάντων
  choice: ndị ... niile
  rationale: Ọ na-echekwa ike zuru ezu nke πάντων.
- source_word: τῶν κατοικούντων Ἰουδαίων
  choice: ndị Juu niile bi n’ebe ahụ
  rationale: κατοικούντων pụtara ndị bi n’ebe ahụ; ‘ebe ahụ’ na-ezo aka Damaskọs site n’okirikiri okwu, ebe ‘ndị Juu’ na-egosi obodo okpukpe na agbụrụ ahụ.
theological_decisions:
- issue: Nsụgharị Ἰουδαίων
  choice: ndị Juu
  alternative: ndị Judia
  rationale: N’ebe a, okwu ahụ na-ezo aka n’obodo ndị Juu bi na Damaskọs, ọ bụghị nanị ndị si n’ógbè Judia. Agbanyeghị, ihe ọzọ ahụ ga-ekwe omume n’ụzọ mkpụrụokwu, ya mere e tinyere ya n’ala ala peeji.
- issue: Ihe εὐλαβής pụtara n’ihe metụtara Iwu
  choice: onye na-atụ egwu Chineke ma na-ebi ndụ dịka Iwu ahụ si dị
  alternative: onye ji Iwu ahụ kpọrọ ihe nke ukwuu
  rationale: Nhọrọ a na-echekwa ma nsọpụrụ okpukpe ma njikọ ya na Iwu, n’emeghị ka amaokwu ahụ kwuo ihe karịrị isi Grik.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A hapụrụ ahịrịokwu ahụ na kọma n’ikpeazụ n’ihi na amaokwu a bụ akụkụ nke ahịrịokwu na-aga n’ihu n’amaokwu na-esote.
