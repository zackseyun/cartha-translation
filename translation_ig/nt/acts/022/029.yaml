    reason: cultural_note
  revision_rationale: The revision corrects the sense of the prospective official examination, removes the unsupported implication of a particular question, and renders the withdrawal more precisely. It retains the accessible military title, the legal force of Roman citizenship, the immediate reaction, and the completed prior act of binding.
