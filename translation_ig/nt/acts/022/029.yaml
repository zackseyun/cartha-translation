  text: εὐθέως οὖν ἀπέστησαν ἀπ’ αὐτοῦ οἱ μέλλοντες αὐτὸν ἀνετάζειν· καὶ ὁ χιλίαρχος δὲ ἐφοβήθη ἐπιγνοὺς ὅτι Ῥωμαῖός ἐστιν καὶ ὅτι ⸂αὐτὸν ἦν⸃ δεδεκώς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/029.yaml
  text: Therefore those who were about to examine him withdrew from him at once[b][a], and the tribune also became afraid when he realized that he was a Roman citizen and that he had bound him.
translation:
  language: ig
  text: Ya mere, ndị dị njikere inyocha ya si n’ebe ọ nọ laghachi azụ ozugbo.[a] Onyeisi ndị agha ahụ[b] tụkwara egwu mgbe ọ matara na Pọl bụ nwa amaala Rom, nakwa na ya kegiderela Pọl.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n’ụzọ dabara kpọmkwem n’ihe a na-ekwu ebe a, “ndị dị njikere iji ụtarị nyochaa ya.” Okwu Grik ahụ pụrụ ịpụta nnyocha ndị ọchịchị na-eme; amaokwu bu ụzọ na-egosi na ha chọrọ iji ụtarị mee ya.
    reason: lexical_alternative
  - marker: b
    text: Okwu Grik ahụ, χιλίαρχος, na-ezo aka n’otu onyeisi ndị agha Rom. Aha ọkwa ya pụtara onyeisi nke otu puku ndị agha, ọ bụ ezie na ọnụ ọgụgụ ndị nọ n’okpuru ya anaghị abụ otu mgbe niile.
    reason: cultural_note
lexical_decisions:
- source_word: εὐθέως οὖν
  choice: Ya mere ... ozugbo
  rationale: “Ya mere” na-egosi njikọ ya na ihe mere n’amaokwu bu ụzọ, ebe “ozugbo” na-egosi na ha mere ihe ahụ n’egbughị oge.
- source_word: ἀπέστησαν ἀπ’ αὐτοῦ
  choice: pụrụ n’ebe ọ nọ
  rationale: Nke a bụ ụzọ Igbo dị mfe ma bụrụkwa eke isi kwuo na ha kwụsịrị ihe ha na-achọ ime ma si n’ebe Pọl nọ laa.
- source_word: οἱ μέλλοντες αὐτὸν ἀνετάζειν
  choice: ndị ahụ na-achọ ịjụ ya ajụjụ ahụ
  rationale: Ọ na-egosi ebumnobi ha dị nso ime nnyocha gọọmenti; nkọwa ala peeji na-eme ka o doo anya na ihe gbara ya gburugburu kwuru banyere iji ụtarị mee ya.
- source_word: χιλίαρχος
  choice: Onyeisi ndị agha ahụ
  rationale: Okwu a na-enye onye Igbo na-agụ ya nghọta ozugbo banyere ọkwa onyeisi agha Rom ahụ, ebe nkọwa ala peeji na-akọwa ọkwa ya nke ọma.
- source_word: ἐφοβήθη
  choice: tụkwara egwu
  rationale: Ọ na-egosi egwu malitere ijide onyeisi agha ahụ mgbe ọ ghọtara ọnọdụ iwu Pọl.
- source_word: ἐπιγνοὺς
  choice: mgbe ọ matara
  rationale: Ọ na-egosi na onyeisi agha ahụ bịara ghọta eziokwu ahụ nke ọma, nke mere ka ụjọ jide ya.
- source_word: Ῥωμαῖός ἐστιν
  choice: Pọl bụ nwa amaala Rom
  rationale: Ihe a na-ekwu banyere ya bụ ọnọdụ Pọl n’iwu Rom, ọ bụghị nanị agbụrụ ya; itinye aha Pọl na-ewepụ mgbagwoju anya nke nnọchiaha n’Igbo.
- source_word: δεδεκώς
  choice: ya ekeela ya agbụ
  rationale: Ụdị a na-egosi ihe onyeisi agha ahụ mecharala nke ka dị mkpa n’iwu; a hapụrụ onye mere ihe ahụ dịka onyeisi agha ahụ n’onwe ya, dịka Grik si kwuo.
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta mee ntụgharị ahụ. A họọrọ “onyeisi ndị agha” kama iji aha ọkwa Rom a na-amaghịkarị, ma tinye nkọwa omenala n’ala peeji. E debere njikọ echiche, ngwa ngwa nke omume ahụ, na ihe iwu nwa amaala Rom pụtara.
