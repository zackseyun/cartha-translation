review_pass:
  verdict: revise
  source_fidelity: The draft preserves the sequence, immediacy, Roman-citizenship issue, and the commander's prior binding of Paul. However, “ndị ahụ na-achọ ịjụ ya ajụjụ ahụ” means people seeking to ask him a particular question, rather than those on the point of conducting an official examination. It also weakens the imminence expressed by μέλλοντες.
  naturalness: Most of the verse is clear Standard Igbo. “Si n’ebe ọ nọ laghachi azụ” is a more idiomatic and precise expression for withdrawing, and “ndị dị njikere inyocha ya” naturally conveys the intended official examination without implying a specific spoken question.
  terminology: “Onyeisi ndị agha” is an acceptable accessible rendering of χιλίαρχος when supplemented by the cultural footnote. “Nwa amaala Rom” correctly expresses the legally relevant sense of Ῥωμαῖος. “Kegiderela” accurately renders the completed prior binding without unnecessarily specifying chains or a method.
  issues:
  - severity: medium
    issue: The phrase “ndị ahụ na-achọ ịjụ ya ajụjụ ahụ” is too narrow and introduces a specific question not present in Greek.
    rationale: ἀνετάζειν denotes official examination/interrogation in this context, and μέλλοντες marks those who were about to do it. The revision uses “ndị dị njikere inyocha ya,” while the footnote retains the scourging-related contextual alternative.
  - severity: low
    issue: “Pụrụ n’ebe ọ nọ” can simply mean that they left, rather than that they drew back from Paul.
    rationale: ἀπέστησαν ἀπ’ αὐτοῦ specifically portrays withdrawal from him. “Si n’ebe ọ nọ laghachi azụ” more clearly preserves that sense.
  revised_text: Ya mere, ndị dị njikere inyocha ya si n’ebe ọ nọ laghachi azụ ozugbo.[a] Onyeisi ndị agha ahụ[b] tụkwara egwu mgbe ọ matara na Pọl bụ nwa amaala Rom, nakwa na ya kegiderela Pọl.
  revised_footnotes:
