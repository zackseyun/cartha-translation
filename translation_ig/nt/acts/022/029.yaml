revisions:
- from: Ya mere, ndị ahụ na-achọ ịjụ ya ajụjụ ahụ pụrụ n’ebe ọ nọ ozugbo.[a] Onyeisi ndị agha ahụ[b] tụkwara egwu mgbe ọ matara na Pọl bụ nwa amaala Rom, nakwa na ya ekeela ya agbụ.
  to: Ya mere, ndị dị njikere inyocha ya si n’ebe ọ nọ laghachi azụ ozugbo.[a] Onyeisi ndị agha ahụ[b] tụkwara egwu mgbe ọ matara na Pọl bụ nwa amaala Rom, nakwa na ya kegiderela Pọl.
  rationale: The revision corrects the sense of the prospective official examination, removes the unsupported implication of a particular question, and renders the withdrawal more precisely. It retains the accessible military title, the legal force of Roman citizenship, the immediate reaction, and the completed prior act of binding.
