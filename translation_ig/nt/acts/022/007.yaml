  text: ἔπεσά τε εἰς τὸ ἔδαφος καὶ ἤκουσα φωνῆς λεγούσης μοι· Σαοὺλ Σαούλ, τί με διώκεις;
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/007.yaml
  text: I fell to the ground and heard a voice saying to me, ‘Saul, Saul, why are you persecuting me?’
translation:
  language: ig
  text: M dara n’ala, m nụkwara otu olu na-asị m, “Sọl, Sọl, gịnị mere i ji na-akpagbu m?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔπεσά
  choice: M wee daa
  rationale: Aorist ahụ na-akọ otu ihe mere n’oge gara aga. “M wee daa” bụ ụzọ Igbo si aga were jikọta ihe omume a na akụkọ bu ya ụzọ, ma na-egosikwa omume ahụ nke ọma.
- source_word: τε
  choice: wee ... -kwa
  rationale: τε na-ejikọta nkebi a na ihe bu ya ụzọ. N’Igbo, usoro “wee” na mgbakwunye “-kwa” na-eme ka njikọ nke ihe omume abụọ ahụ pụta n’ụzọ ebumpụta ụwa, na-enweghị ịtụgharị τε dịka mkpụrụokwu kwụụrụ onwe ya.
- source_word: εἰς τὸ ἔδαφος
  choice: n’ala
  rationale: N’okwu banyere ịda, “daa n’ala” bụ okwu Igbo nkịtị ma doo anya; ọ na-egosipụta ebe ọdịda ahụ rutere.
- source_word: ἤκουσα
  choice: nụkwa
  rationale: Aorist ahụ bụ ihe mere n’oge gara aga. “Nụkwa” na-ejikọta ịnụ olu ahụ na ọdịda ahụ n’usoro akụkọ dị mfe.
- source_word: φωνῆς
  choice: otu olu
  rationale: Genitive ahụ so ἀκούω bụ ihe a nụrụ. “Otu olu” na-egosi olu a na-akọ banyere ya na nke mbụ, ma okwu ndị na-esochi ya gosiri na ọ bụ olu na-ekwu okwu.
- source_word: λεγούσης μοι
  choice: na-asị m
  rationale: Present participle ahụ na-egosi na olu ahụ nọ na-ekwu n’otu oge ahụ Pọl nụrụ ya; “na-asị m” chekwara ma omume ikwu okwu ma μοι, “m.”
- source_word: Σαοὺλ Σαούλ
  choice: Sọl, Sọl
  rationale: E depụtara aha ahụ n’ụdị a na-eji ya n’Igbo, ma chekwaa nkwughachi ya iji gosipụta kpọmkwem ọkpụkpọ ahụ na ike okwu ya.
- source_word: τί
  choice: gịnị mere ... ji
  rationale: N’ajụjụ Igbo, usoro “gịnị mere ... ji” bụ ụzọ ebumpụta ụwa isi jụọ ihe kpatara omume.
- source_word: με
  choice: m
  rationale: E chekwara nnọchiaha onye mbụ dị ka ihe omume ahụ metụtara, n’enweghị nkọwa mgbakwunye.
- source_word: διώκεις
  choice: i ji na-akpagbu
  rationale: N’ọnọdụ a, διώκω pụtara imegide mmadụ ma na-emekpa ya ahụ n’ihi okwukwe. “Na-akpagbu” na-egosipụta omume ahụ na-aga n’ihu dịka present tense Grik si dị.
theological_decisions:
- issue: Mmekọrịta dị n’etiti onye na-ekwu okwu na mkpagbu Sọl na-akpagbu ndị kwere ekwe
  choice: 'E chekwara okwu onye mbụ ahụ kpọmkwem: “m.”'
  alternative: Ịgbasa ya dịka “ndị nke m” ma ọ bụ “ndị na-eso ụzọ m.”
  rationale: Isi ike nkà mmụta okpukpe dị n’amaokwu a bụ na onye na-ekwu okwu kpọrọ mkpagbu a na-akpagbu ndị kwere ekwe mkpagbu a na-akpagbu ya onwe ya. Ntụgharị ahụ ekwesịghị ịkọwapụta ma ọ bụ belata njirimara a.
translation_notes:
  register: Asụsụ Igbo Izugbe nke ugbu a, dị ùgwù ma dị mfe nghọta. A họọrọ “na-akpagbu” maka mkpagbu na mmegide siri ike, ma chekwaa usoro okwu kpọmkwem na nkwughachi aha ahụ.
