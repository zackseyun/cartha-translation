source:
  edition: SBLGNT
  text: εἶπον δέ· Τί ποιήσω, κύριε; ὁ δὲ κύριος εἶπεν πρός με· Ἀναστὰς πορεύου εἰς Δαμασκόν, κἀκεῖ σοι λαληθήσεται περὶ πάντων ὧν τέτακταί σοι ποιῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/010.yaml
  text: Then I said[a], ‘What should I do, Lord?’ And the Lord said to me, ‘Get up and go into Damascus[b], and there you will be told about everything that has been appointed for you to do.’
translation:
  language: ig
  text: M wee sị, “Gịnị ka m ga-eme[a], Onyenwe anyị?” Onyenwe anyị wee sị m, “Bilie, gaa Damaskọs; n’ebe ahụ ka a ga-agwa gị banyere ihe niile e kenyere gị ime.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Gịnị ka m kwesịrị ime, Onyenwe anyị?”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί ποιήσω
  choice: gịnị ka m ga-eme?
  rationale: Ajụjụ a na-arịọ nduzi banyere ihe kwesịrị ịbụ nzọụkwụ ọzọ. Nkebi okwu a bụ Igbo nkịtị ma na-edowe nghọta nke ‘Gịnị ka m ga-eme?’ n’enweghị ịgbakwunye iwu na-adịghị n’ederede.
- source_word: κύριε / ὁ ... κύριος
  choice: Onyenwe anyị / Onyenwe anyị
  rationale: ‘Onyenwe anyị’ bụ okwu Igbo a na-ejikarị asụgharị κύριος n’ọnọdụ a, ma na-edowe ịdị arọ nke aha ahụ n’akụkọ banyere Jizọs kama ime ka ọ bụrụ naanị ‘nna ukwu.’
- source_word: Ἀναστὰς
  choice: Bilie
  rationale: Participụl ahụ na-arụ ọrụ dịka iwu jikọrọ ya na πορεύου. ‘Bilie’ bụ iwu doro anya ma dịkwa nkenke n’Igbo.
- source_word: πορεύου εἰς Δαμασκόν
  choice: gaa Damaskọs
  rationale: N’Igbo, ‘gaa Damaskọs’ na-egosipụta njem ruo n’obodo ahụ n’ụzọ ebumpụta ụwa; ịgbakwunye okwu pụtara ‘banye’ agaghị adị mkpa ebe a.
- source_word: κἀκεῖ
  choice: n’ebe ahụ
  rationale: Nke a na-egosipụta καὶ ἐκεῖ nke ọma ma na-ejikọta ebe ahụ na ihe a ga-agwa Pọl.
- source_word: λαληθήσεται
  choice: a ga-agwa gị
  rationale: Ọdịdị Igbo a na-edowe future passive na onye na-eme ihe a na-akpọghị aha, dịka Grik ahụ si dị.
- source_word: περὶ πάντων
  choice: ihe niile
  rationale: N’usoro Igbo ‘a ga-agwa gị ihe niile...,’ nke a na-egosipụta ọdịnaya nke okwu a ga-agwa ya n’ụzọ doro anya ma dị mfe.
- source_word: τέτακταί σοι ποιῆσαι
  choice: e kenyere gị ime
  rationale: ‘E kenyere’ na-egosipụta ihe e debeere ma ọ bụ e nyere mmadụ ka o mee. Ọ na-edowe passive na echiche nke ọrụ a haziri tupu oge ahụ, ma ọ naghị ebubata nkọwa ozizi siri ike karịa ederede ahụ.
theological_decisions:
- issue: Ike τέτακταί gbasara nduzi Chineke na ọrụ Pọl
  choice: e kenyere gị ime
  alternative: e kpebiri ka i mee
  rationale: ‘E kenyere gị ime’ na-edowe na ọrụ ndị ahụ abụghị naanị nhọrọ Pọl, kama na e doziri ha maka ya. N’otu oge ahụ, ọ naghị ekpebi kpọmkwem ma okwu ahụ na-ekwu banyere iwu, ọkpụkpọ, ma ọ bụ akara aka n’ụzọ usoro ozizi pụrụ iche.
translation_notes:
  register: Asụsụ ahụ bụ Standard Igbo nke oge a, dị mfe ma nwee ugwu. E ji ‘Onyenwe anyị’ mee ihe maka κύριος n’ebe abụọ ahụ iji kwado njikọ dị n’akụkọ ahụ. Akara [a] nọ n’isi ederede dịka achọrọ.
