  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἀκούσαντες δὲ ὅτι τῇ Ἑβραΐδι διαλέκτῳ προσεφώνει αὐτοῖς μᾶλλον παρέσχον ἡσυχίαν. καὶ φησίν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/002.yaml
  text: 'But when they heard that he was addressing them in the Hebrew language[a], they became even more quiet. And he said:'
translation:
  language: ig
  text: 'Ma mgbe ha nụrụ na ọ na-agwa ha okwu n’asụsụ Hibru[a], ha gbachiri nkịtị karị. O wee sị:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma eleghị anya, “n’asụsụ Aramaik.” Grik kwuru “n’asụsụ Hibru,” ma n’ọnọdụ a, okwu ahụ pụrụ izo aka n’asụsụ Semitik a na-asụ n’ógbè Judia.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀκούσαντες δὲ
  choice: Ma mgbe ha nụrụ
  rationale: A sụgharịrị aorist participle ahụ dị ka nkebiokwu oge n’Igbo, ebe δὲ na-egosi ntakịrị mgbanwe n’akụkọ ahụ.
- source_word: τῇ Ἑβραΐδι διαλέκτῳ
  choice: n’asụsụ Hibru
  rationale: Nke a na-edobe okwu Grik ahụ kpọmkwem, bụ́ ‘asụsụ Hibru,’ ma hapụ nkọwa na ọ pụrụ ịbụ Aramaik n’ala ala peeji.
- source_word: προσεφώνει αὐτοῖς
  choice: ọ na-agwa ha okwu
  rationale: Ụdị ngwaa imperfect na-egosi okwu ọ nọ na-ekwu nye ìgwè mmadụ ahụ; ntụgharị a bụ Igbo nkịtị ma doo anya.
- source_word: μᾶλλον παρέσχον ἡσυχίαν
  choice: ha gbachikwara nkịtị karị
  rationale: Akpaalaokwu Grik ahụ pụtara na ha mere ka سکịtị ha bawanye; ‘gbachikwara nkịtị karị’ na-enye echiche ntụnyere ahụ n’Igbo eke.
- source_word: καὶ φησίν
  choice: 'O wee sị:'
  rationale: A sụgharịrị historical present ahụ n’ụdị akụkọ gara aga nke na-adaba n’Igbo; ntụpọ abụọ na-ewebata okwu Pọl.
theological_decisions:
- issue: Ihe ‘asụsụ Hibru’ na-ezo aka na ya
  choice: Idobe ‘Hibru’ n’ahịrịokwu bụ isi
  alternative: Ịsụgharị ya ozugbo dịka ‘Aramaik’
  rationale: Grik kwuru ‘Hibru’ kpọmkwem. Ebe ọ bụ na n’ọnọdụ a okwu ahụ pụrụ izo aka n’asụsụ Semitik ndị Juu na-asụ n’ógbè ahụ, a na-edobe ọdịdị ederede ahụ ma kọwaa ohere ọzọ n’ala ala peeji.
translation_notes:
  register: Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ ‘gbachikwara nkịtị karị’ iji gosipụta na ìgwè mmadụ ahụ mekwuru سکịtị karịa ka ha dị na mbụ.
