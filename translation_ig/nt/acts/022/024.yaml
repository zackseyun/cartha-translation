  to: Onyeisi ndị agha ahụ nyere iwu ka a kpọbata ya n’ụlọ ndị agha[a], na-ekwu ka e jiri ụtarị gbaa ya ajụjụ[b], ka o wee chọpụta ihe kpatara ha ji na-eti mkpu megide ya otu a.
