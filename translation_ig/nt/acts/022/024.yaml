  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐκέλευσεν ⸂ὁ χιλίαρχος εἰσάγεσθαι αὐτὸν⸃ εἰς τὴν παρεμβολήν, ⸀εἴπας μάστιξιν ἀνετάζεσθαι αὐτὸν ἵνα ἐπιγνῷ δι’ ἣν αἰτίαν οὕτως ἐπεφώνουν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/024.yaml
  text: The tribune ordered him to be brought into the barracks[a], saying that he should be examined by scourging[b], so that he might find out for what reason they were shouting against him like this.
translation:
  language: ig
  text: Onyeisi ndị agha ahụ nyere iwu ka a kpọbata ya n’ụlọ ndị agha[a], na-ekwu ka e jiri ụtarị gbaa ya ajụjụ[b], ka o wee chọpụta ihe kpatara ha ji na-eti mkpu megide ya otu a.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, ‘ogige ndị agha’ ma ọ bụ ‘ebe e wusiri ike.’ N’ebe a, okwu ahụ na-ezo aka n’ebe ndị agha Rom bi ma na-arụ ọrụ na Jerusalem.
    reason: cultural_note
  - marker: b
    text: A pụkwara ịsụgharị ya, ‘ka a nyochaa ya site n’ịpịa ya ụtarị.’ Okwu Grik jikọtara ịgba ajụjụ na ụzọ e ji mee ya, ya bụ iji ụtarị.
    reason: lexical_alternative
lexical_decisions:
- source_word: χιλίαρχος
  choice: onyeisi ndị agha
  rationale: Okwu a bụ aha onyeisi ndị agha Rom nọ n’ọkwa dị elu. ‘Onyeisi ndị agha’ bụ okwu doro ndị na-agụ Igbo anya, ma ọ naghị ekwu kpọmkwem ọnụ ọgụgụ ndị agha ọ na-achị, nke nwere ike iduhie n’usoro agha Rom.
- source_word: παρεμβολή
  choice: ụlọ ndị agha
  rationale: N’ebe a, okwu ahụ na-ezo aka n’ebe ndị agha Rom bi ma na-arụ ọrụ na Jerusalem, ya bụ ogige e wusiri ike Antonia. ‘Ụlọ ndị agha’ na-egosi ọrụ ebe ahụ n’Igbo dị mfe nghọta.
- source_word: εἰσάγεσθαι
  choice: ka a kpọbata ya
  rationale: 'Nke a na-edobe ọnọdụ nnara nke ngwaa Grik: ndị ọzọ ga-akpọbata ya n’ime ebe ahụ.'
- source_word: εἴπας
  choice: O nyekwara iwu
  rationale: Ọ bụ ezie na ọdịdị okwu Grik pụtara ‘kwuo,’ ihe a kwuru bụ iwu nke onyeisi ndị agha nyere. Nkebi ahịrịokwu a na-eme ka njikọ ahụ bụrụ nke sitere n’okike n’Igbo.
- source_word: μάστιξιν
  choice: e jiri ụtarị pịa ya
  rationale: Ọtụtụ dative a na-egosi ụzọ e ji eme nchọpụta ahụ. Nsụgharị a na-eme ka o doo anya na ọ bụ ịpịa mmadụ ihe n’ụzọ siri ike, ọ bụghị nanị iyi ya egwu.
- source_word: ἀνετάζεσθαι
  choice: mgbe a na-agba ya ajụjụ
  rationale: Ngwaa ahụ pụtara inyocha ma ọ bụ ịgba mmadụ ajụjụ. Okwu ndị gbara ya gburugburu na-akọwa na a ga-eme nke a site n’ịpịa ya ụtarị.
- source_word: ἐπιγνῷ
  choice: ka o wee chọpụta
  rationale: Nkebi nzube ahụ na-egosi na ebumnuche onyeisi ndị agha bụ ịmata kpọmkwem ihe kpatara mkpu ìgwè mmadụ ahụ.
- source_word: δι’ ἣν αἰτίαν
  choice: ihe mere
  rationale: Nke a na-egosi ihe kpatara omume ahụ n’Igbo sitere n’okike, na-enweghị itinye echiche nke ebubo iwu nke okwu Grik ekwughị kpọmkwem.
- source_word: οὕτως
  choice: otu ahụ
  rationale: Nke a na-edobe ike ngosi nke adverb Grik, nke na-ezo aka n’ụzọ ìgwè mmadụ ahụ si eti mkpu.
- source_word: ἐπεφώνουν αὐτῷ
  choice: ha ji na-eti mkpu megide ya
  rationale: Ọdịdị imperfect na-egosi mkpu na-aga n’ihu, ebe ‘megide ya’ na-egosi na mkpu ahụ bụ nke mmegide, ọ bụghị nanị ịkpọ ya oku.
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo nke dị ugbu a, dị ùgwù, ma dị mfe nghọta mee nsụgharị ahụ. E kewara iwu ahụ ụzọ ahịrịokwu abụọ iji mee ka ọ na-aga nke ọma n’Igbo, ma e debere njikọ nzube ‘ka o wee chọpụta.’ E dezikwara akara nkọwa ụkwụ ka [a] soro ‘ụlọ ndị agha,’ ebe [b] soro ịgba ajụjụ site n’ụtarị, dịka ihe Grik si kwado.
