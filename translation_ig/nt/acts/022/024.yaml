review_pass:
  verdict: revise
  source_fidelity: N'ụzọ bụ isi, nsụgharị ahụ na-ezipụta nke ọma iwu onyeisi ndị agha, ibubata Pọl n’ụlọ ndị agha, na ebumnuche nke ịchọpụta ihe kpatara mkpu ìgwè mmadụ ahụ. Otú ọ dị, «e jiri ụtarị pịa ya mgbe a na-agba ya ajụjụ» nwere ike ikewa ịpịa ya na ịgba ya ajụjụ ka ha bụrụ omume abụọ na-eme n’otu oge, kama ọ na-egosi na ịpịa ụtarị bụ ụzọ e si agba ya ajụjụ dịka μάστιξιν ἀνετάζεσθαι si kwuo.
  naturalness: «Ka e jiri ụtarị gbaa ya ajụjụ» dị mkpụmkpụ, dị ugbu a n’Igbo, ma jikọta nyocha/ịjụ ajụjụ na ụzọ ike e ji eme ya nke ọma. Ijikọta akụkụ abụọ nke iwu ahụ n’otu ahịrịokwu na-eme ka εἴπας («na-ekwu/na-enye iwu») soro nke ọma.
  terminology: «Onyeisi ndị agha», «ụlọ ndị agha», «ụtarị», na «eti mkpu megide ya» kwesịrị ekwesị n’Standard Igbo. A naghị etinye nkọwa ụka ma ọ bụ nkọwa iwu na-adịghị n’asụsụ Grik.
  issues:
  - severity: medium
    issue: Nkebi «e jiri ụtarị pịa ya mgbe a na-agba ya ajụjụ» nwere ike ịpụta na a na-ebu ụzọ ma ọ bụ n’akụkụ ọzọ agba ya ajụjụ, ebe ịpịa ya bụ naanị ihe na-eme n’oge ahụ.
    rationale: 'N’asụsụ Grik, μάστιξιν bụ ụzọ e si eme ἀνετάζεσθαι: a ga-eji ụtarị nyochaa ma ọ bụ gbaa ya ajụjụ. «Ka e jiri ụtarị gbaa ya ajụjụ» na-edobe njikọ a kpọmkwem.'
  - severity: low
    issue: «O nyekwara iwu» mgbe e mechara ahịrịokwu mbụ na-eme ka εἴπας yie iwu nke abụọ kwụụrụ onwe ya.
    rationale: Ebe ọ bụ participle na-ewebata ọdịnaya iwu ahụ, itinye ya n’otu ahịrịokwu na-eme ka njikọ ahụ doo anya karịa, n’agbanyeghị na nsụgharị mbụ anaghị agbanwe isi ihe pụtara.
