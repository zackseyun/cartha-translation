  text: ὅτι ἔσῃ μάρτυς αὐτῷ πρὸς πάντας ἀνθρώπους ὧν ἑώρακας καὶ ἤκουσας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/015.yaml
  text: For you will be a witness for him to all people of what you have seen and heard[a][b].
translation:
  language: ig
  text: N’ihi na ị ga-abụ onye akaebe ya[b] nye mmadụ niile[a] banyere ihe ndị ị hụrụ na ndị ị nụrụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “nye mmadụ niile” nwere ike ịbụ “nye ụmụ mmadụ niile.” Okwu Grik ahụ na-ekwu maka mmadụ niile n’agbanyeghị nwoke ma ọ bụ nwanyị.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ị ga-abụ onye akaebe nye ya” ma ọ bụ “ị ga-abụ onye akaebe n’ihi ya.” Dative Grik a nwere ike inwe nghọta ndị yiri ibe ha.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: N’ihi na
  rationale: N’ọnọdụ a, ὅτι na-enye nkọwa kpatara ọrụ a e nyere Pọl; “N’ihi na” na-egosipụta njikọ nkọwa ahụ n’Igbo nke ọma.
- source_word: ἔσῃ
  choice: ị ga-abụ
  rationale: Ụdị ọdịnihu nke εἰμί bụ amụma dị mfe; “ị ga-abụ” bụ Igbo nkịtị ma doo anya.
- source_word: μάρτυς
  choice: onye akaebe
  rationale: Ọ na-egosi onye na-agba akaebe banyere ihe ọ hụrụ ma ọ bụ nụrụ; okwu a bụ nke ziri ezi ma bụrụ nke ndị Igbo na-aghọta ngwa ngwa.
- source_word: αὐτῷ
  choice: ya
  rationale: Dative a na-ezo aka n’Onyenwe anyị/Jizọs, onye Pọl ga-abụrụ onye akaebe. Igbo “ị ga-abụrụ ya onye akaebe” nwere ike ibu echiche nke ịbụ onye akaebe n’ihi ya ma ọ bụ nye ya, ya mere ọ naghị emechi mgbagwoju anya dị na Grik.
- source_word: πρὸς πάντας ἀνθρώπους
  choice: n’ihu mmadụ niile
  rationale: πρός na-egosi ndị a ga-erute site n’ịgba akaebe. “N’ihu mmadụ niile” bụ okwu Igbo ebumpụta ụwa nke na-egosi ịgba akaebe n’ebe mmadụ niile nọ, ebe “mmadụ” gụnyere mmadụ niile n’agbanyeghị nwoke ma ọ bụ nwanyị.
- source_word: ὧν
  choice: banyere ihe ndị
  rationale: Genitive relative pronoun a na-egosi ihe akaebe ahụ ga-ekwu maka ya; “banyere ihe ndị” na-eme ka njikọ ahụ doo anya n’Igbo.
- source_word: ἑώρακας
  choice: ị hụrụ
  rationale: Ọ bụ ezie na Grik ji perfect, Igbo anaghị egosikarị ọdịiche aspect ahụ n’otu ụdị ngwaa; “ị hụrụ” na-egosi ahụmahụ gara aga nke ka bụ ntọala akaebe ya.
- source_word: καὶ ἤκουσας
  choice: na ihe ndị ị nụrụ
  rationale: Nkwughachi “ihe ndị” na-eme ka ahịrịokwu ahụ bụrụ Igbo doro anya ma na-edobe ụzọ abụọ ahụmahụ ahụ—ịhụ na ịnụ.
theological_decisions:
- issue: Ihe αὐτῷ na-ezo aka na ya na ụdị dative ya
  choice: “ị ga-abụrụ ya onye akaebe,” ebe “ya” na-ezo aka n’Onyenwe anyị/Jizọs
  alternative: “ị ga-agbara ya akaebe” ma ọ bụ “ị ga-abụ onye akaebe n’ihi ya”
  rationale: Ọnọdụ gbara amaokwu ahụ gburugburu na-eme ka “ya” zoo aka n’Onyenwe anyị/Jizọs. Nhazi “ị ga-abụrụ ya onye akaebe” na-edobe ohere pụtara ịbụ onye akaebe nye ya, maka ya, ma ọ bụ banyere ya, n’emeghị ka otu nkọwa mechie ndị ọzọ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “Onye akaebe” bụ okwu a na-amakarị; “mmadụ niile” bụ okwu na-agụnye nwoke na nwanyị. E debere mgbagwoju anya nke αὐτῷ site n’usoro “ị ga-abụrụ ya onye akaebe,” ma kọwaa ya n’ala peeji.
