revisions:
- from: N’ihi na ị ga-abụrụ ya onye akaebe n’ihu mmadụ niile[a] banyere ihe ndị ị hụrụ na ihe ndị ị nụrụ.[b]
  to: N’ihi na ị ga-abụ onye akaebe ya[b] nye mmadụ niile[a] banyere ihe ndị ị hụrụ na ndị ị nụrụ.
  rationale: The revision changes the audience phrase from a locative/public-setting expression to a directional expression corresponding more closely to πρός. It also moves the αὐτῷ footnote marker to “ya” and clarifies the footnote, without resolving the Greek dative more narrowly than the source permits.
  reviewer_model: gpt-5.6-terra
