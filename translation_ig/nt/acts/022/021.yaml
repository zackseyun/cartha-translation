  text: καὶ εἶπεν πρός με· Πορεύου, ὅτι ἐγὼ εἰς ἔθνη μακρὰν ἐξαποστελῶ σε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/021.yaml
  text: And he said to me[a], ‘Go, because I will send you far away to the Gentiles.’
translation:
  language: ig
  text: O sịrị m, “Gaa, n’ihi na m ga-eziga gị n’ebe dị anya, n’ebe ndị mba ọzọ nọ[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’ebe mba ndị ọzọ nọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν πρός με
  choice: O wee sị m
  rationale: Nke a na-egosi okwu a gwara onye kpọmkwem, ma na-aga nke ọma n’usoro akụkọ Igbo.
- source_word: Πορεύου
  choice: Gaa
  rationale: Iwu dị mfe ma doo anya nke na-egosi ịpụ ma ọ bụ ịga.
- source_word: ὅτι
  choice: n’ihi na
  rationale: Ọ na-egosi ihe kpatara e ji nye iwu ahụ.
- source_word: ἐγὼ
  choice: m
  rationale: Onye nke mbụ ka e mere ka ọ pụta ìhè site n’usoro ahịrịokwu ahụ, n’enweghị mgbakwunye nkwusi ike na-adịghị na ederede.
- source_word: εἰς ἔθνη
  choice: ka ị gakwuru ndị mba ọzọ
  rationale: N’ọnọdụ ozi Pọl, ἔθνη na-ezo aka n’ụmụ mmadụ na-abụghị ndị Juu; ntụgharị a bụ nke ndị Igbo taa na-aghọta nke ọma.
- source_word: μακρὰν
  choice: n’ebe dị anya
  rationale: Ọ na-echekwa echiche nke ịdị anya n’ụzọ eke n’Igbo.
- source_word: ἐξαποστελῶ σε
  choice: m ga-eziga gị
  rationale: Ọ na-egosi iziga onye pụọ maka ọrụ, n’enweghị ịgbakwunye nkọwa banyere ọrụ ahụ karịa ihe Grik kwuru.
theological_decisions:
- issue: Ntụgharị ἔθνη n’ọnọdụ ozi e nyere Pọl
  choice: ndị mba ọzọ
  alternative: mba dị iche iche
  rationale: “Ndị mba ọzọ” na-egosi ndị na-abụghị ndị Juu n’ọnọdụ akụkọ a, ebe “mba dị iche iche” ka bụ ihe okwu Grik ahụ nwekwara ike ịpụta; e debere nke ahụ na nkọwa ala peeji.
translation_notes:
  register: Asụsụ Igbo Izugbe dị ugbu a, dị ugwu ma dị mfe nghọta. E ji “O wee sị m” debe usoro akụkọ, ebe “ka ị gakwuru” mere ka ebe a na-eziga Pọl doo anya n’ụzọ eke n’Igbo.
