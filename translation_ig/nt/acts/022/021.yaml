- from: O wee sị m, “Gaa, n’ihi na m ga-eziga gị n’ebe dị anya, ka ị gakwuru ndị mba ọzọ[a].”
  to: O sịrị m, “Gaa, n’ihi na m ga-eziga gị n’ebe dị anya, n’ebe ndị mba ọzọ nọ[a].”
  rationale: The revision keeps the destination phrase directly dependent on “ga-eziga gị,” preserving the Greek construction “I will send you far away to the Gentiles.” It also supplies a closer, natural lexical alternative for ἔθνη without weakening the main text’s contextual reference to Gentiles.
