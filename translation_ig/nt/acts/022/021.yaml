    text: Ma ọ bụ, “n’ebe mba ndị ọzọ nọ.”
    reason: lexical_alternative
  revision_rationale: The revision keeps the destination phrase directly dependent on “ga-eziga gị,” preserving the Greek construction “I will send you far away to the Gentiles.” It also supplies a closer, natural lexical alternative for ἔθνη without weakening the main text’s contextual reference to Gentiles.
