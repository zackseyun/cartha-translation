id: ACT.22.4
reference: Acts 22:4
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὃς ταύτην τὴν ὁδὸν ἐδίωξα ἄχρι θανάτου, δεσμεύων καὶ παραδιδοὺς εἰς φυλακὰς ἄνδρας τε καὶ γυναῖκας,
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/004.yaml
  text: I persecuted this Way to the death[a], binding and delivering both men and women into prisons[b],
translation:
  language: ig
  text: Akpagburu m Ụzọ a[a] ruo n’ókè ọnwụ[b], na-ekekọta ma na-enyefe ma ndị ikom ma ndị inyom n’ụlọ mkpọrọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ụzọ a,” “ije a,” ma ọ bụ “òtù a.” N’asụsụ Grik, ọ bụ “ụzọ a” kpọmkwem; n’Ọrụ Ndị Ozi, a na-ejikarị ya dịka aha e ji amata ndị na-eso Jizọs na okwukwe ha.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ruo n’ọnwụ.” Nkebiokwu a na-egosi na mkpagbu ahụ ruru n’ókè ọnwụ; ọ naghị ekwu kpọmkwem na Pọl ji aka ya gbuo mmadụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ταύτην τὴν ὁδὸν
  choice: Ụzọ a
  rationale: ὁδός pụtara ‘ụzọ’ n’ụzọ nkịtị, ma n’Ọrụ Ndị Ozi ọ na-abụkarị aha e ji amata okwukwe na òtù ndị na-eso Jizọs. ‘Ụzọ a’ na-edobe ma ihe okwu ahụ pụtara kpọmkwem ma ojiji ya dịka aha amaara ama.
- source_word: ἐδίωξα
  choice: Akpagburu m
  rationale: N’ebe a, διώκω bụ ịchụso mmadụ n’obi ọjọọ na imegide ha n’ike; ‘akpagburu m’ na-egosi mkpagbu ahụ nke ọma n’Igbo.
- source_word: ἄχρι θανάτου
  choice: ruo n’ọnwụ
  rationale: Nkebiokwu a na-egosi oke ọnwụ nke mkpagbu ahụ ruru, ma ọ naghị ekpebi kpọmkwem na Pọl ji aka ya gbuo mmadụ; ntụgharị a na-edobe mgbagwoju anya ahụ.
- source_word: δεσμεύων
  choice: na-ekekọta
  rationale: Okwu a pụtara ikekọta mmadụ. Nhọrọ a na-edobe ihe oyiyi doro anya dị n’asụsụ Grik karịa ịsị naanị ‘ijide.’
- source_word: παραδιδοὺς
  choice: na-enyefe
  rationale: N’ebe a, παραδίδωμι pụtara inyefe ndị e jidere n’aka ndị ọchịchị ma ọ bụ n’ụlọ mkpọrọ.
- source_word: εἰς φυλακὰς
  choice: n’ụlọ mkpọrọ
  rationale: Ọ bụ ezie na φυλακάς dị n’ụdị ọtụtụ, ‘ụlọ mkpọrọ’ nwere ike ịrụ ọrụ dịka aha mkpokọta n’Igbo ma ghara ịmanye echiche na a kpọgara onye ọ bụla n’ebe dị iche.
- source_word: ἄνδρας τε καὶ γυναῖκας
  choice: ma ndị ikom ma ndị inyom
  rationale: Usoro a na-edobe nkwusi okwu Grik nke na-egosi na mkpagbu ahụ metụtara ma ndị ikom ma ndị inyom.
theological_decisions:
- issue: Ma a ga-asụgharị ἡ ὁδός dịka aha nkịtị ka ọ bụ dịka aha e ji amata ndị Kraịst na okwukwe ha
  choice: Ụzọ a
  alternative: ije a; òtù a
  rationale: N’Ọrụ Ndị Ozi, ‘Ụzọ’ na-arụkarị ọrụ dịka aha a na-akpọ okwukwe na ndị na-eso Jizọs. Ide ya ‘Ụzọ’ na mkpụrụedemede ukwu na-egosi ojiji ahụ n’etinyeghị aha ụka e mechara nwee.
- issue: Ma ἄχρι θανάτου na-ekwu na Pọl ji aka ya gbuo mmadụ
  choice: ruo n’ọnwụ
  alternative: ruo n’ókè nke igbu ha
  rationale: Grik na-egosi oke dị egwu mkpagbu ahụ ruru, ma ọ naghị akọwa kpọmkwem ọrụ Pọl n’ọnwụ onye ọ bụla. Ya mere, a hapụrụ nghọta ahụ ka ọ ghara ịdị warawara karịa isi mmalite.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta. ‘Akpagburu m’ bụ okwu siri ike ma kwekọọ n’imegide ndị kwere ekwe; ‘na-ekekọta ma na-enyefe’ na-edobe usoro na ihe oyiyi nke participle abụọ dị na Grik.
