- from: Akpagburu m Ụzọ a[a] ruo n’ọnwụ[b], na-ekekọta ma na-enyefe ma ndị ikom ma ndị inyom n’ụlọ mkpọrọ.
  to: Akpagburu m Ụzọ a[a] ruo n’ókè ọnwụ[b], na-ekekọta ma na-enyefe ma ndị ikom ma ndị inyom n’ụlọ mkpọrọ.
  rationale: Only the idiom for ἄχρι θανάτου and its explanatory note have been clarified. The revision keeps the Greek ambiguity concerning precisely how deaths occurred, while expressing the phrase naturally in Standard Igbo. The remaining wording is retained because it faithfully and clearly follows the source.
