review_pass:
  verdict: revise
  source_fidelity: The rendering accurately conveys the rebuke against delay, the two coordinated imperatives, the sins as the object of washing, and the pronoun in “aha ya.” “Ka e mee gị baptizim” is an idiomatic Igbo way to express the middle imperative without assigning a doctrinally specific force. The participial “na-akpọku aha ya” appropriately avoids deciding whether calling on the name is attendant action or means.
  naturalness: 'The verse is clear, modern Standard Igbo and retains the urgent public-address register. The wording of the footnote, however, is slightly imprecise and less natural: “ihe na-eso iwu ndị ahụ” could imply a subsequent action rather than the participle’s grammatical relation to the commands.'
  terminology: “baptizim,” “mmehie,” and “aha ya” are suitable standard ecclesial terms. “Sachapụ mmehie gị” adequately expresses washing sins away in this compact imperative construction.
  issues:
  - severity: low
    issue: Footnote a describes one grammatical option imprecisely.
    rationale: The Greek participle does not primarily indicate an action that follows the commands; its debated force is better described as accompanying the commands or expressing the means by which the washing is understood.
