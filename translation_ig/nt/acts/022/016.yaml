id: ACT.22.16
reference: Acts 22:16
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ νῦν τί μέλλεις; ἀναστὰς βάπτισαι καὶ ἀπόλουσαι τὰς ἁμαρτίας σου ἐπικαλεσάμενος τὸ ὄνομα ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/016.yaml
  text: And now why are you waiting? Rise[a], be baptized, and wash away your sins[b], calling on his name.
translation:
  language: ig
  text: Ugbu a, gịnị mere i ji na-egbu oge? Bilie, ka e mee gị baptizim, sachapụkwa mmehie gị, na-akpọku aha ya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị “na-akpọku aha ya” dịka “site n'ịkpọku aha ya.” Grik ekpebighị nke ọma ma nkebiokwu a na-egosi omume na-esonyere iwu ndị ahụ ka ọ bụ ụzọ e si asachapụ mmehie.
    reason: alternative_reading
lexical_decisions:
- source_word: τί μέλλεις
  choice: gịnị mere i ji na-egbu oge?
  rationale: N'ọnọdụ a, ajụjụ ahụ bụ mba a na-abara onye na-egbu oge, ọ bụghị ajụjụ banyere ihe ọ na-achọ ime n'ọdịnihu.
- source_word: ἀναστὰς
  choice: Bilie
  rationale: Ọ bụ participle aorist nke na-eso iwu ndị na-abịa ya; iwu dị mkpirikpi “Bilie” na-egosipụta ngwa ngwa dị n'okwu Grik.
- source_word: βάπτισαι
  choice: ka e mee gị baptizim
  rationale: Ụdị middle imperative a na-egosi ka onye ahụ nata baptizim; ntụgharị a bụ nke doro anya ma bụrụkwa Igbo e ji eme ihe.
- source_word: ἀπόλουσαι
  choice: sachapụkwa
  rationale: Okwu ahụ pụtara ịsachapụ ma ọ bụ iwepụ site n'ịsa, ma kwekọọ n'ụzọ ebumpụta ụwa na “mmehie gị.”
- source_word: τὰς ἁμαρτίας σου
  choice: mmehie gị
  rationale: Nke a na-edobe nkọwa nkịtị nke ἁμαρτία n'enweghị mgbasawanye nkọwa.
- source_word: ἐπικαλεσάμενος
  choice: na-akpọku
  rationale: Nkebiokwu a na-edobe njikọ participle ahụ na iwu ndị bu ya ụzọ ma ghara ikpebi ma ọ bụ ọnọdụ na-eso ya ka ọ bụ ụzọ e si eme ya.
- source_word: τὸ ὄνομα αὐτοῦ
  choice: aha ya
  rationale: Ihe odide Grik nwere nnọchiaha αὐτοῦ; “aha ya” na-edobe ya n'ekwughị “Onyenweanyị” n'ụzọ doro anya karịa isi mmalite ahụ.
theological_decisions:
- issue: Mmekọrịta dị n'etiti baptizim, ịsachapụ mmehie, na ịkpọku aha ya
  choice: E debere usoro iwu abụọ ahụ na participle nke Grik n'emeghị ka otu n'ime ha bụrụ kpọmkwem ụzọ mmehie si asachapụ.
  alternative: A pụrụ ịghọta baptizim n'onwe ya dị ka ụzọ e si asachapụ mmehie; ma ọ bụ ịkpọku aha ya dị ka ụzọ ahụ, baptizim esoro ya; ma ọ bụ okwu niile ọnụ dị ka usoro mmalite nke ntụgharị uche na okwukwe.
  rationale: Ụtọasụsụ Grik jikọtara iwu ndị ahụ na participle ma ọ naghị amanye onye ntụgharị idozi esemokwu gbasara nkà mmụta okpukpe. “Na-akpọku” na-echekwa esemokwu na mgbagwoju anya ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “Ka e mee gị baptizim” bụ usoro doro anya e ji gosi iwu middle/passive; “na-akpọku” na-echekwa ambiguity nke participle Grik.
