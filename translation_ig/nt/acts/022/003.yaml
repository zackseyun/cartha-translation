revisions:
- from: Abụ m nwoke Juu, onye a mụrụ na Tasọs nke Silisia, ma a zụlitere m n’obodo a n’ụkwụ Gameliel[a]. A zụrụ m nke ọma n’usoro iwu nna nna anyị siri sie ike[b], m na-anụkwa ọkụ n’obi maka Chineke, dịka unu niile na-eme taa.
  to: Abụ m nwoke Juu, onye a mụrụ na Tasọs nke Silisia, ma a zụlitere m n’obodo a n’ụkwụ Gameliel[a]. A zụrụ m n’ịgbaso iwu ndị nna nna anyị n’ụzọ siri ike[b], nwekwaa ọkụ n’obi maka Chineke, dịka unu niile nwere taa.
  rationale: The revision resolves the unclear construction concerning strictness in the ancestral law, preserves Paul’s solidarity with his listeners through “anyị,” and explicitly retains the comparison of zeal for God. The literal teacher-disciple image and its explanatory footnote are retained. No doctrinal interpretation has been added.
