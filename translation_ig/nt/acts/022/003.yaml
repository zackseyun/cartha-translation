    text: N’ụzọ nkịtị, “n’ụkwụ Gameliel.” Nke a bụ okwu e ji egosi na a zụrụ mmadụ ma kụziere ya ihe n’okpuru onye ozizi.
    reason: cultural_note
  - marker: b
    text: A pụkwara ịsụgharị ya, “iwu e ketara n’aka ndị nna nna.”
    reason: lexical_alternative
  revision_rationale: The revision resolves the unclear construction concerning strictness in the ancestral law, preserves Paul’s solidarity with his listeners through “anyị,” and explicitly retains the comparison of zeal for God. The literal teacher-disciple image and its explanatory footnote are retained. No doctrinal interpretation has been added.
