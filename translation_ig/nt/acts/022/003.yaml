id: ACT.22.3
reference: Acts 22:3
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸀Ἐγώ εἰμι ἀνὴρ Ἰουδαῖος, γεγεννημένος ἐν Ταρσῷ τῆς Κιλικίας, ἀνατεθραμμένος δὲ ἐν τῇ πόλει ταύτῃ παρὰ τοὺς πόδας Γαμαλιήλ, πεπαιδευμένος κατὰ ἀκρίβειαν τοῦ πατρῴου νόμου, ζηλωτὴς ὑπάρχων τοῦ θεοῦ καθὼς πάντες ὑμεῖς ἐστε σήμερον,
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/003.yaml
  text: I am a Jewish man[a], born in Tarsus of Cilicia, but brought up in this city at the feet of Gamaliel, educated according to the strictness of the law of our fathers[b], being zealous for God just as all of you are today.
translation:
  language: ig
  text: Abụ m nwoke Juu, onye a mụrụ na Tasọs nke Silisia, ma a zụlitere m n’obodo a n’ụkwụ Gameliel[a]. A zụrụ m n’ịgbaso iwu ndị nna nna anyị n’ụzọ siri ike[b], nwekwaa ọkụ n’obi maka Chineke, dịka unu niile nwere taa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’ụzọ nkịtị, “n’ụkwụ Gameliel.” Nke a bụ okwu e ji egosi na a zụrụ mmadụ ma kụziere ya ihe n’okpuru onye ozizi.
    reason: cultural_note
  - marker: b
    text: A pụkwara ịsụgharị ya, “iwu e ketara n’aka ndị nna nna.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνὴρ Ἰουδαῖος
  choice: nwoke Juu
  rationale: “Nwoke Juu” na-edobe ma ihe ἀνήρ kwuru banyere nwoke toro eto ma njirimara Ἰουδαῖος, n’asụsụ Igbo doro anya.
- source_word: γεγεννημένος ἐν Ταρσῷ τῆς Κιλικίας
  choice: onye a mụrụ na Tasọs nke Silisia
  rationale: Nke a na-egosipụta ebe a mụrụ Pọl ma na-edobe njikọ Tasọs na mpaghara Silisia.
- source_word: ἀνατεθραμμένος δὲ ἐν τῇ πόλει ταύτῃ
  choice: ma a zụlitere m n’obodo a
  rationale: “A zụlitere m” na-ekwu maka ebe o toro na nzụlite ya, ebe “ma” na-egosi ọdịiche dị n’etiti ebe a mụrụ ya na ebe a zụlitere ya.
- source_word: παρὰ τοὺς πόδας Γαμαλιήλ
  choice: n’ụkwụ Gameliel
  rationale: E debere ihe atụ ahụ dị ka ọ dị na Grik; ihe odide ala peeji kọwara na ọ bụ okwu e ji egosi ịmụ ihe n’okpuru onye ozizi.
- source_word: πεπαιδευμένος κατὰ ἀκρίβειαν τοῦ πατρῴου νόμου
  choice: A zụrụ m nke ọma n’usoro iwu nna nna anyị siri sie ike
  rationale: Nke a na-egosi ọzụzụ siri ike na nke ziri ezi n’iwu ndị nna nna, ma na-agụkwa nke ọma n’Igbo nke oge a.
- source_word: ζηλωτὴς ὑπάρχων τοῦ θεοῦ
  choice: m na-anụkwa ọkụ n’obi maka Chineke
  rationale: “Ịnụ ọkụ n’obi” na-egosipụta ịnụ ọkụ n’obi na nraranye ζηλωτής pụtara, n’etinyeghị echiche ndọrọ ndọrọ ọchịchị pụrụ iche.
- source_word: καθὼς πάντες ὑμεῖς ἐστε σήμερον
  choice: dịka unu niile na-eme taa
  rationale: Nke a na-edobe ntụnyere Pọl ji mee ka ya na ndị na-ege ya ntị bụrụ ndị nwere otu ịnụ ọkụ n’obi n’ụbọchị ahụ.
theological_decisions:
- issue: Otu e si sụgharị πατρῴου νόμου ka njikọ Pọl na ndị Juu na-ege ya ntị pụta ìhè
  choice: iwu nna nna anyị
  alternative: iwu e ketara n’aka nna nna
  rationale: “Nna nna anyị” na-egosi ihe nketa ha nwekọrọ ọnụ n’okwu Pọl, n’agbanyeghị na okwu Grik n’onwe ya nwekwara ike ịpụta naanị “nke ndị nna nna.”
- issue: Ma a ga-edobe okwu atụ παρὰ τοὺς πόδας Γαμαλιήλ
  choice: n’ụkwụ Gameliel
  alternative: n’okpuru nkuzi Gameliel
  rationale: Ichekwa okwu atụ ahụ na-edobe onyonyo onye na-amụ ihe nọ n’ụkwụ onye ozizi; nkọwa ala peeji na-eme ka ihe ọ pụtara doo onye na-agụ anya.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke nwere ugwu ma dị mfe nghọta. E debere okwu atụ banyere ụkwụ onye ozizi, ma kọwaa ya n’ala peeji; e zerekwa okwu nwere ike ibubata nkọwa otu okpukpe ma ọ bụ otu ndọrọ ndọrọ ọchịchị.
