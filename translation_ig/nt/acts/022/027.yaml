  text: προσελθὼν δὲ ὁ χιλίαρχος εἶπεν αὐτῷ· Λέγε μοι, ⸀σὺ Ῥωμαῖος εἶ; ὁ δὲ ἔφη· Ναί.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/027.yaml
  text: So the tribune came up and said to him[a], “Tell me, are you a Roman?” And he said[b], “Yes.”
translation:
  language: ig
  text: Onyeisi ndị agha ahụ wee bịakwute ya, sị ya, “Gwa m, ị bụ onye Rom[b]?” Ọ zara, “Ee.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: “Onye Rom” n’ebe a pụtara onye bụ nwaamaala Rom n’iwu, dịka ihe gbara amaokwu a gburugburu na-egosi.
    reason: cultural_note
lexical_decisions:
- source_word: προσελθὼν
  choice: bịakwutere ya
  rationale: Okwu a na-egosi na onyeisi ndị agha ahụ bịara nso Pọl tupu ọ gwa ya okwu; ‘bịakwutere ya’ bụ ụzọ Igbo dị mfe ma kwekọọ n’ihe omume ahụ.
- source_word: δὲ
  choice: Mgbe ahụ
  rationale: N’ebe a, δέ na-akwalite akụkọ gaa n’ihe mere ọzọ, ọ bụghị igosi nnukwu mmegide; ‘Mgbe ahụ’ na-eme ka usoro akụkọ doo anya n’Igbo.
- source_word: χιλίαρχος
  choice: onyeisi ndị agha ahụ
  rationale: N’Ọrụ Ndị Ozi, okwu a bụ utu aha onyeisi ndị agha Rom nke na-achị otu nnukwu ndị agha. ‘Onyeisi ndị agha’ bụ okwu Igbo doro ndị mmadụ anya ma ghara iji utu aha mba ọzọ na-amaghị ama.
- source_word: εἶπεν αὐτῷ
  choice: sị ya
  rationale: Nke a na-edobe onye a gwara okwu, ma bụrụkwa usoro Igbo nkịtị e ji webata okwu mmadụ kwuru kpọmkwem.
- source_word: Λέγε μοι
  choice: Gwa m
  rationale: Nke a na-enye iwu ahụ na onye a na-agwa ya n’ụzọ Igbo dị ndụ ma kpọmkwem.
- source_word: σὺ
  choice: ị̀ bụ
  rationale: Ajụjụ Igbo a na-ejigide ntụgharị uche e tinyere n’ebe onye a na-ajụ nọ n’enweghị mgbakwunye siri ike nke ga-ada ka ihe a manyere amanye.
- source_word: Ῥωμαῖος
  choice: onye Rom
  rationale: Adjective Grik a na-arụ ọrụ dịka aha mmadụ. ‘Onye Rom’ na-edobe ụdị okwu mbụ, ebe ihe gbara amaokwu ahụ gburugburu na-akọwa na ihe a na-ekwu bụ ikike nwaamaala Rom.
- source_word: Ναί
  choice: Ee
  rationale: Ọ bụ azịza nkwenye dị nkenke ma kpọmkwem, n’enweghị ịgbakwunye okwu ndị na-adịghị na Grik.
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta, mee ntụgharị a. A họọrọ ‘onyeisi ndị agha’ ka ọrụ onye ahụ doo anya, ebe nkọwa ala peeji na-echekwa nkọwa akụkọ ihe mere eme nke χιλίαρχος. E debeghị ‘onye Rom’ dịka ‘nwaamaala Rom’ n’ahịrị isi ka ụdị okwu Grik na ntakịrị oghere nkọwa ya dịgide.
