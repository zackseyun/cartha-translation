  text: ἐγὼ δὲ ἀπεκρίθην· Τίς εἶ, κύριε; εἶπέν τε πρὸς ⸀ἐμέ· Ἐγώ εἰμι Ἰησοῦς ὁ Ναζωραῖος ὃν σὺ διώκεις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/008.yaml
  text: And I answered[a], ‘Who are you, Lord?’ And he said to me, ‘I am Jesus the Nazarene[b], whom you are persecuting.’
translation:
  language: ig
  text: M zara, sị, “Onye ka ị bụ, Onyenwe anyị?[a]” Ọ sịkwara m, “Abụ m Jizọs onye Nazaret,[b] onye ị na-akpagbu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “nna ukwu.” Okwu Grik bụ κύριε nwekwara ike ịbụ okwu nkwanye ùgwù e ji akpọ mmadụ, ọ bụghị naanị aha “Onyenwe anyị.”
    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ, “Jizọs onye si Nazaret,” ma ọ bụ “Jizọs onye Nazọrean.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθην
  choice: M wee zaa ya
  rationale: Nke a na-egosipụta azịza Pọl nyere n’asụsụ Igbo nkịtị; ‘wee’ na-ejikọta ya nke ọma na akụkọ a na-akọ.
- source_word: Τίς εἶ
  choice: Ị bụ onye
  rationale: Nke a bụ ụzọ Igbo doro anya si ajụ onye mmadụ bụ.
- source_word: κύριε
  choice: Onyenwe anyị
  rationale: Nke a bụ aha Igbo a na-ejikarị asụgharị κύριος mgbe a na-akpọ mmadụ ‘Onyenwe’; edemede ala peeji na-edobe ohere na ọ bụkwa okwu nkwanye ùgwù n’ebe a.
- source_word: εἶπέν τε πρὸς ἐμέ
  choice: Ọ sịrị m
  rationale: Nke a bụ ntụgharị Igbo dị mkpirikpi ma bụrụkwa nke e ji ekwu okwu n'ụzọ ebumpụta ụwa.
- source_word: Ἐγώ εἰμι
  choice: Abụ m
  rationale: Ọ na-edobe nkwupụta onye ahụ ji akọwa onwe ya n’enweghị mgbakwunye.
- source_word: Ἰησοῦς
  choice: Jizọs
  rationale: E ji ụdị aha a maara nke ọma na Standard Igbo dee aha ahụ.
- source_word: ὁ Ναζωραῖος
  choice: onye Nazaret
  rationale: Ọ na-egosipụta na Jizọs bụ onye sitere Nazaret ma na-anọgide bụrụ okwu njirimara dịka okwu Grik ahụ.
- source_word: ὃν σὺ διώκεις
  choice: onye ị na-akpagbu
  rationale: ‘Na-akpagbu’ na-egosipụta mkpagbu iro na-aga n’ihu, nke bụ ihe διώκω pụtara n’ebe a.
theological_decisions:
- issue: Ntụgharị κύριε n’okwu Sọl
  choice: Onyenwe anyị
  alternative: Nna anyị ukwu; onye nwe m
  rationale: A họọrọ aha a na-ejikarị asụgharị κύριος, ma e doghị anya n’amaokwu ahụ ma Sọl amatala onye na-agwa ya okwu nke ọma. Ya mere, edemede ala peeji na-edobe nghọta nke okwu nkwanye ùgwù.
translation_notes:
  register: Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. E debere usoro mkparịta ụka ahụ n'ụzọ nkịtị, tinyekwa akara edemede ala peeji niile n’ahịrị amaokwu ahụ.
