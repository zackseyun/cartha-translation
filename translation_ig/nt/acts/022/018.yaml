  edition: SBLGNT
  text: καὶ ἰδεῖν αὐτὸν λέγοντά μοι· Σπεῦσον καὶ ἔξελθε ἐν τάχει ἐξ Ἰερουσαλήμ, διότι οὐ παραδέξονταί ⸀σου μαρτυρίαν περὶ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/018.yaml
  text: and I saw him saying to me[a], ‘Hurry and get out of Jerusalem quickly, because they will not accept your testimony about me.’
translation:
  language: ig
  text: ahụkwara m ya ka ọ na-asị m, “Mee ngwa, si na Jerusalem pụọ ọsọ ọsọ, n’ihi na ha agaghị anabata[a] akaebe gị banyere m.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ha agaghị anara akaebe gị banyere m.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδεῖν
  choice: ahụkwara m
  rationale: Ọ bụ ezie na okwu Grik a bụ infinitive n’ụdị ya, ọ na-aga n’ihu n’akụkọ Pọl banyere ọhụụ ahụ. Ịsụ ya dịka ngwaa zuru ezu bụ Igbo ebumpụta ụwa ma na-echekwa echiche nke ịhụ n’ọhụụ.
- source_word: αὐτὸν
  choice: ya
  rationale: Nnọchiaha a na-ezo aka n’Onyenwe anyị a hụrụ n’ọhụụ n’okwu gbara amaokwu a gburugburu. E debeghị aha ma ọ bụ utu aha na-adịghị n’amaokwu Grik a.
- source_word: λέγοντά μοι
  choice: ka ọ na-asị m
  rationale: Nke a na-egosipụta onye a hụrụ ka ọ na-agwa Pọl okwu, ma na-eduga nke ọma n’okwu e kwuru kpọmkwem.
- source_word: Σπεῦσον
  choice: Mee ngwa
  rationale: Iwu a na-egosi na ihe ahụ dị ezigbo mkpa ma kwesị ime ozugbo. ‘Mee ngwa’ bụ okwu Igbo doro anya ma dị ugbu a.
- source_word: ἔξελθε
  choice: si na Jerusalem pụọ
  rationale: Ngwaa ahụ na-egosi ịpụ n’ebe mmadụ nọ; ijikọ ya na ‘si na Jerusalem’ na-echekwa ntụziaka ἐξ nke ọma.
- source_word: ἐν τάχει
  choice: ọsọ ọsọ
  rationale: Nkebiokwu a na-emesi ọsọ ike. Idebe ma ‘Mee ngwa’ ma ‘ọsọ ọsọ’ na-egosipụta nkwusikwu ike ugboro abụọ dị n’asụsụ Grik.
- source_word: ἐξ Ἰερουσαλήμ
  choice: si na Jerusalem pụọ
  rationale: Nke a na-egosi mmegharị isi n’ime obodo ahụ pụta, ọ bụghị naanị ịga ebe ọzọ.
- source_word: διότι
  choice: n’ihi na
  rationale: Ọ na-ewebata ihe kpatara iwu ahụ, nke ‘n’ihi na’ na-egosipụta n’Igbo nkịtị.
- source_word: οὐ παραδέξονταί
  choice: ha agaghị anabata
  rationale: Ngwaa a pụtara ịnabata ihe ma ọ bụ iji obi ọma were ya. ‘Anabata’ bụ okwu Igbo sara mbara nke dabara n’akaebe a na-ekwu maka ya.
- source_word: σου μαρτυρίαν
  choice: akaebe gị
  rationale: ‘Akaebe’ na-echekwa echiche nke ihe mmadụ na-agba akaebe banyere ya ma dabara n’ọnọdụ nkwusa a.
- source_word: περὶ ἐμοῦ
  choice: banyere m
  rationale: Nke a na-egosi onye akaebe ahụ na-ekwu maka ya n’ụzọ Igbo doro anya.
theological_decisions:
- issue: Onye nnọchiaha αὐτόν na-ezo aka na ya n’ọhụụ Pọl
  choice: E debere ya dịka ‘ya.’
  alternative: Ịsụ ya kpọmkwem dịka ‘Onyenwe anyị’ ma ọ bụ ‘Jizọs.’
  rationale: Ihe gbara amaokwu a gburugburu na-eme ka onye ọ bụ doo anya, ma amaokwu Grik n’onwe ya ji nnọchiaha. Idebe nnọchiaha ahụ na-ezere ịtinye aha ma ọ bụ utu aha na-adịghị n’amaokwu a.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. ‘Mee ngwa’ na ‘ọsọ ọsọ’ na-echekwa nkwusikwu ike nke iwu Grik abụọ ahụ; e zere okwu ochie na nkọwa okpukpe agbakwunyere.
