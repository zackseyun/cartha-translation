review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys Peter's corrective response, the imperative to rise, and Peter's shared humanity. However, “weliri ya ọtọ” is less idiomatic here than a standard expression for lifting someone from prostration.
  naturalness: “Pita weliri ya elu” is more natural Standard Igbo for physically raising Cornelius. “Mụ onwe m bụkwa mmadụ” places the emphatic and additive elements smoothly and naturally.
  terminology: “Pita,” “Bilie,” and “mmadụ” are appropriate Standard Igbo forms. The revision preserves the Greek emphasis of καὶ ἐγὼ αὐτὸς without adding “naanị” (“only”).
  issues:
  - severity: low
    issue: The expression “weliri ya ọtọ” is somewhat awkward in this immediate physical context.
    rationale: While understandable, “weliri ya elu” is the more idiomatic Standard Igbo expression for Peter lifting Cornelius up from the ground.
  - severity: low
    issue: Word order in “mụ onwe m kwa bụ mmadụ” is less smooth than necessary.
    rationale: “Mụ onwe m bụkwa mmadụ” naturally carries both the emphatic αὐτός (“myself”) and the additive καί (“also/too”).
  revised_text: Ma Pita weliri ya elu[a], sị, “Bilie[b]; mụ onwe m bụkwa mmadụ.”[c]
