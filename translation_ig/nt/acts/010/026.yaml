  text: ὁ δὲ Πέτρος ⸂ἤγειρεν αὐτὸν⸃ λέγων· Ἀνάστηθι· καὶ ἐγὼ αὐτὸς ἄνθρωπός εἰμι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/026.yaml
  text: But Peter raised him up[a], saying, “Stand up[c][b]; I too am a man.”
translation:
  language: ig
  text: Ma Pita weliri ya elu[a], sị, “Bilie[b]; mụ onwe m bụkwa mmadụ.”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “buliri ya elu,” ma ọ bụ “nyere ya aka ibili.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “Guzoro ọtọ.”
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “Mụ onwe m kwa bụ mmadụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤγειρεν αὐτὸν
  choice: weliri ya ọtọ
  rationale: Nke a na-egosi na Pita mere ka Kọniliọs si n’ọnọdụ ọ dara n’ala bilie, ma ọ naghị akọwa kpọmkwem otú o si nyere ya aka.
- source_word: Ἀνάστηθι
  choice: Bilie
  rationale: Ọ bụ iwu doro anya ka onye ahụ si n’ala bilie; “Bilie” bụ okwu Igbo nkịtị na nke dabara n’ọnọdụ a.
- source_word: καὶ ἐγὼ αὐτὸς
  choice: mụ onwe m kwa
  rationale: 'Nke a na-edobe ma nkwusi ike dị na αὐτός ma echiche nke “kwa”: Pita n’onwe ya sokwa bụrụ mmadụ.'
- source_word: ἄνθρωπός εἰμι
  choice: bụ mmadụ
  rationale: “Bụ mmadụ” bụ ntụgharị kpọmkwem na nke e ji asụ Igbo n’ụzọ ebumpụta ụwa; ọ naghị agbakwụnye echiche “naanị” nke na-adịghị n’ihe Grik.
- source_word: δὲ
  choice: Ma
  rationale: “Ma” na-egosi obere mmegide n’etiti Kọniliọs ịda n’ụkwụ Pita n’amaokwu bu ụzọ na mmeghachi omume Pita.
theological_decisions:
- issue: Mmeghachi omume Pita mgbe Kọniliọs dara n’ụkwụ ya
  choice: E debere okwu Pita dịka ịjụ nsọpụrụ ga-ebuli ya karịa mmadụ ibe ya, ebe ọ na-ekwusi ike na ya onwe ya bụkwa mmadụ.
  alternative: A pụrụ ịghọta ya n’ụzọ pere mpe dịka ngosipụta ịdị umeala n’obi naanị.
  rationale: “Bilie; mụ onwe m kwa bụ mmadụ” na-edobe ihe akụkụ Akwụkwọ Nsọ kwuru n’ụzọ doro anya, ma ọ naghị etinye ozizi sara mbara banyere ofufe nke amaokwu ahụ n’onwe ya na-ekwughị.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ugwu ma dị mfe nghọta. “Weliri ya ọtọ” na “Bilie” na-eme ka ihe ahụ a na-ahụ anya doo anya; “mụ onwe m kwa” na-edobe nkwusi ike nke ihe Grik n’ụzọ Igbo ebumpụta ụwa.
