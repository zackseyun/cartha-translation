review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the temporal setting, Peter’s entrance, Cornelius’s meeting him, falling at his feet, and the reverential act expressed by προσκυνέω. The main rendering appropriately retains the contextual sense of homage/prostration, while the footnote preserves “worship” as a viable lexical alternative.
  naturalness: 'The sequence “Kọniliọs zutere ya, daa n’ụkwụ ya” is not well-formed narrative Igbo: “daa” is left without the connective needed after the finite verb “zutere.” Adding “wee” yields a natural and clear narrative sequence.'
  terminology: “kpọọ ya isiala” is a natural Standard Igbo expression for rendering the act of reverence without prematurely narrowing προσκυνέω to divine worship. The footnote’s “fee ya ofufe” adequately records the stronger lexical alternative. “Pita” and “Kọniliọs” are appropriate established Igbo biblical forms.
