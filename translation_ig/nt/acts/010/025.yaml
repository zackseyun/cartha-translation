    issue: Missing narrative connective before “daa”
    rationale: After “Kọniliọs zutere ya,” the form “daa” requires a connective such as “wee” to express the subsequent action naturally and grammatically in Standard Igbo.
  revised_text: Mgbe Pita banyere, Kọniliọs zutere ya, wee daa n’ụkwụ ya kpọọ ya isiala.[a]
