  to: Mgbe Pita banyere, Kọniliọs zutere ya, wee daa n’ụkwụ ya kpọọ ya isiala.[a]
  rationale: The revision only repairs the Igbo narrative syntax by adding “wee” and makes the object placement in “kpọọ ya isiala” more idiomatic. It preserves the source sequence and the deliberate contextual ambiguity of προσκυνέω; the existing lexical-alternative footnote remains suitable.
