id: ACT.10.25
reference: Acts 10:25
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὡς δὲ ἐγένετο τοῦ εἰσελθεῖν τὸν Πέτρον, συναντήσας αὐτῷ ὁ Κορνήλιος πεσὼν ἐπὶ τοὺς πόδας προσεκύνησεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/025.yaml
  text: And when Peter entered[a], Cornelius met him and fell at his feet and paid him homage.
translation:
  language: ig
  text: Mgbe Pita banyere, Kọniliọs zutere ya, wee daa n’ụkwụ ya kpọọ ya isiala.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “fee ya ofufe.” Okwu Grik ahụ nwere ike ịpụta ife ofufe ma ọ bụ omume ịda n’ala kpọọ isiala nye mmadụ, dabere n’ọnọdụ e ji ya mee ihe.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ ἐγένετο τοῦ εἰσελθεῖν
  choice: Mgbe ... banyere
  rationale: Akpaalaokwu Grik a na-ewebata ọnọdụ oge n’akụkọ. “Mgbe” na-enye echiche oge ahụ n’Igbo nkịtị n’enweghị ịsụgharị usoro Grik ahụ n’ụzọ siri ike.
- source_word: εἰσελθεῖν τὸν Πέτρον
  choice: Pita banyere
  rationale: Aorist infinitive a na-egosi ihe mere dị ka otu ihe omume; ahịrịokwu Igbo nke Pita bụ onye na-eme ihe ahụ doro anya ma dịkwa eke.
- source_word: συναντήσας αὐτῷ
  choice: zutere ya
  rationale: Nke a na-egosi na Kọniliọs zutere Pita. “Zutere ya” dị nkenke ma na-enye ihe participle ahụ pụtara n’ụzọ Igbo kwụ ọtọ.
- source_word: πεσὼν ἐπὶ τοὺς πόδας
  choice: daa n’ụkwụ ya
  rationale: Nkebi a na-egosi Kọniliọs ka ọ dara ala n’ụkwụ Pita n’ọnọdụ iweda onwe ya ala.
- source_word: προσεκύνησεν
  choice: kpọọ isiala nye ya
  rationale: “Ịkpọ isiala” na-egosi omume ịda n’ala na inye nsọpụrụ miri emi, ma ọ naghị ekpebi n’isi ederede ma omume ahụ bụ ofufe Chineke n’ụzọ zuru ezu. E debere nhọrọ “fee ya ofufe” n’okpuru peeji.
theological_decisions:
- issue: Otú e si sụgharịa προσκυνέω mgbe onye a na-eme ya bụ Pita
  choice: kpọọ isiala nye ya
  alternative: fee ya ofufe
  rationale: Okwu Grik ahụ nwere ike ịpụta ịkpọ isiala/inye nsọpụrụ ma ọ bụ ife ofufe, dabere n’ọnọdụ. Ebe Pita jụrụ omume ahụ ozugbo n’amaokwu na-esonụ n’ihi na ya onwe ya bụkwa mmadụ, isi ederede na-echekwa ịdị arọ nke omume ahụ ma ghara ikpebi karịa ihe okwu ahụ n’onwe ya chọrọ; nkọwa ala peeji na-echekwa nhọrọ nke ọzọ.
translation_notes:
  register: Standard Igbo; asụsụ akụkọ dị ugbu a, dị ùgwù, ma dị mfe nghọta. “Kpọọ isiala” bụ okwu Igbo eke maka prostration/homage ma na-echekwa obosara ihe προσκυνέω nwere ike ịpụta.
