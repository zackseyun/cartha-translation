  to: Ka ya na ya na-akparịta ụka[a], ọ banyere wee hụ ọtụtụ ndị gbakọtara.
  rationale: The revision retains the source’s contemporaneous participial action and its historical-present narrative feature while using a more natural reciprocal Igbo expression for conversation. It also replaces the potentially additive -kwa with wee, which clearly coordinates the entry and subsequent finding.
