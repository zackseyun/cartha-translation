  yaml_path: translation/nt/acts/010/027.yaml
  text: And talking with him[a], he entered and found many gathered together.
translation:
  language: ig
  text: Ka ya na ya na-akparịta ụka[a], ọ banyere wee hụ ọtụtụ ndị gbakọtara.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “Mgbe ya na ya na-akparịta ụka, ọ banyere wee hụ ọtụtụ ndị gbakọtara.” N’asụsụ Grik, e ji ụdị ngwaa nke oge ugbu a (“ọ na-ahụ”) kọọ ihe gara aga iji mee ka akụkọ ahụ dị ka ihe na-eme n’ihu onye na-agụ ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνομιλῶν
  choice: Ka ọ na-akparịta ụka
  rationale: Nkebi a na-egosi na mkparịta ụka ahụ nọ na-aga n’otu oge ahụ ọ banyere. “Na-akparịta ụka” na-egosikwa na ha abụọ so na mkparịta ụka ahụ.
- source_word: αὐτῷ
  choice: na ya
  rationale: Dative a na συνομιλέω na-egosi onye ya na ya na-akparịta ụka; “na ya” na-edobe nnọchiaha dị n’asụsụ Grik n’agbanyeghị na onye ahụ doro anya site n’ihe gbara amaokwu ahụ gburugburu.
- source_word: εἰσῆλθεν
  choice: ọ banyere
  rationale: Aorist a bụ isi omume na-esote. “Ọ banyere” bụ Igbo dị nkenke ma doo anya; etinyeghị “ụlọ” n’ihi na okwu ahụ adịghị kpọmkwem n’amaokwu Grik a.
- source_word: εὑρίσκει
  choice: hụkwa
  rationale: Ọ bụ historical present n’asụsụ Grik, ma n’akụkọ Igbo, ụdị omume gara aga a na-aghọta site n’usoro ahịrịokwu ahụ na-eme ka ọgụgụ gaa nke ọma. “Hụkwa” na-ejikọ ihe ọ hụrụ na mbata ya.
- source_word: συνεληλυθότας
  choice: gbakọtara
  rationale: Perfect participle a na-egosi na ndị ahụ abịakọtala ma nọkwa n’ebe ahụ. “Gbakọtara” na-enye ma omume e mechara ma ọnọdụ si na ya pụta.
- source_word: πολλούς
  choice: ọtụtụ ndị
  rationale: Adjective a na-anọchi aha mmadụ. Igbo chọrọ ka e kwuo “ndị” ka ihe ọ na-ezo aka doo anya ma bụrụkwa okwu nkịtị.
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. A hapụrụ nnọchiaha “ya” dịka o si dị n’asụsụ mmalite, ma a gbakwunyeghị “ụlọ,” nke ihe gbara amaokwu ahụ gburugburu na-egosi ma okwu Grik nke amaokwu a ekwughị kpọmkwem.
