  text: καὶ ἐξηγησάμενος ⸂ἅπαντα αὐτοῖς⸃ ἀπέστειλεν αὐτοὺς εἰς τὴν Ἰόππην.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/008.yaml
  text: And after explaining everything to them, he sent them to Joppa.
translation:
  language: ig
  text: Mgbe ọ kọwaachara ha ihe niile, o zipụrụ ha gaa Jọpa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξηγησάμενος
  choice: Mgbe ọ kọwaara
  rationale: Nkebi ngwaa aorist a na-egosi ihe mere tupu ngwaa bụ isi. “Mgbe ọ kọwaara” na-egosipụta usoro oge ahụ ma na-ebupụta echiche nke ịkọwa ihe nke ọma.
- source_word: ἅπαντα
  choice: ihe niile
  rationale: Nnọchiaha neuter plural a pụtara ihe niile n'ụzọ zuru ezu; “ihe niile” bụ okwu Igbo doro anya ma bụrụkwa nke a na-ejikarị eme ihe.
- source_word: αὐτοῖς
  choice: ha
  rationale: “Ha” dị n'ime “kọwaara ha” na-arụ ọrụ dị ka onye a kọwaara ihe, kwekọrọ na dative Greek.
- source_word: ἀπέστειλεν
  choice: o zipụrụ ha
  rationale: “Zipụrụ” bụ ụzọ Igbo nkịtị na nke doro anya isi kwuo na o mere ka ha gaa n'ọrụ ahụ, na-enweghị ịgbakwunye echiche banyere ngwa ngwa.
- source_word: εἰς τὴν Ἰόππην
  choice: ka ha gaa Jọpa
  rationale: Nkebi a na-egosi ebe ha na-aga. “Ka ha gaa Jọpa” bụ usoro Igbo eke nke na-egosipụta njem ruo ebe ahụ.
