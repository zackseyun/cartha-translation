  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀλλ’ ἐν παντὶ ἔθνει ὁ φοβούμενος αὐτὸν καὶ ἐργαζόμενος δικαιοσύνην δεκτὸς αὐτῷ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/035.yaml
  text: but in every nation the one who fears him and does what is righteous is acceptable to him[a][b][c].
translation:
  language: ig
  text: Kama, ná mba ọ bụla, onye na-atụ egwu ya ma na-eme ezi omume bụ onye ọ na-anabata[a][b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ma na-arụ ezi omume” / “ma na-eme omume ziri ezi.”
    reason: lexical_alternative
  - marker: b
    text: Okwu Grik bụ δικαιοσύνην, nke a na-asụgharịkarị “ezi omume”; n'ọnọdụ ụfọdụ, ọ pụkwara ịpụta “ikpe ziri ezi.”
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “Chineke na-anabata ya.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλ’
  choice: Kama
  rationale: Na-egosi ọdịiche dị n'etiti okwu a na nghọta Pita kwuru n'amaokwu bu ya ụzọ na Chineke adịghị ele mmadụ anya n'ihu.
- source_word: ἐν παντὶ ἔθνει
  choice: ná mba ọ bụla
  rationale: Na-egosipụta nkebiokwu ebe a na-ekwu maka ya ma na-edobe echiche nkesa nke παντί; “mba” dabara adaba maka ἔθνος n'ọnọdụ a.
- source_word: ὁ φοβούμενος αὐτὸν
  choice: onye na-atụ egwu ya
  rationale: Na-edobe participle ahụ dịka onye a na-ekwu maka ya, n'etinyeghị oke gbasara nwoke ma ọ bụ nwanyị; “ịtụ egwu” na-eburu echiche nsọpụrụ na egwu Chineke.
- source_word: καὶ ἐργαζόμενος δικαιοσύνην
  choice: ma na-eme ihe ziri ezi
  rationale: Ọ bụ Igbo dị mfe ma bụrụkwa nke okike nke na-egosi omume na-aga n'ihu, dịka ἐργάζομαι na δικαιοσύνην si kwuo.
- source_word: δικαιοσύνην
  choice: ihe ziri ezi
  rationale: N'okwu a, ọ na-egosi ezi omume mmadụ na-eme; nsụgharị a na-ada nke ọma n'Igbo ma ghara ime ka okwu ahụ bụrụ naanị ikpe ziri ezi n'etiti mmadụ.
- source_word: δεκτὸς αὐτῷ ἐστιν
  choice: bụ onye ọ na-anabata
  rationale: Na-egosipụta na onye ahụ dị Chineke mma ịnabata, ma ghara ịgbakwụnye echiche na ezi ọrụ na-eme ka mmadụ rite nzọpụta.
theological_decisions:
- issue: Ma amaokwu a ọ na-akụzi na mmadụ na-enweta nzọpụta site n'ọrụ, ka ọ na-akọwa na Chineke na-anabata ndị na-atụ egwu ya n'agbanyeghị mba ha
  choice: E debere okwu ahụ dịka o siri kwuo na onye na-atụ egwu Chineke ma na-eme ihe ziri ezi bụ onye Chineke na-anabata.
  alternative: A pụrụ ịsụgharị ya n'ụzọ na-egosi na onye ahụ “na-enweta nnabata Chineke site n'ọrụ ya,” ma ọ bụ n'ụzọ na-akọwa ezi omume ya dịka “ihe àmà nke okwukwe na-azọpụta.”
  rationale: Grik na-ekwu maka nnabata Chineke n'ihe metụtara ịtụ egwu ya na ime ezi omume, n'ọnọdụ ebe Pita na-ekwu na Chineke adịghị ele mba anya n'ihu. Nsụgharị ahụ anaghị edozi esemokwu nkà mmụta okpukpe nke amaokwu ahụ n'onwe ya na-akọwaghị.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ugwu ma doo ndị nkịtị anya. A họọrọ “ná mba ọ bụla” iji zere mgbagwoju anya nke “na mba,” a họrọkwara “onye ọ na-anabata” ka ọ bụrụ okwu Igbo sitere n'okike ma debe ohere nghọta dị na δεκτός.
