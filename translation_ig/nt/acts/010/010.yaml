revisions:
- from: Agụụ wee gụọ ya nke ukwuu, ọ chọkwara iri ihe[a]. Ma mgbe ha nọ na-akwadebe ihe oriri, ọnọdụ pụrụ iche nke ọhụụ bịakwasịrị ya[b].
  to: Agụụ gụrụ ya nke ukwuu, ọ chọkwara iri ihe[a]. Ma mgbe ha na-akwadebe nri, ọ dabara n'oke mmụọ[b].
  rationale: The revision uses idiomatic Igbo for intense hunger and replaces the source-expanding phrase for ἔκστασις with “ọ dabara n'oke mmụọ,” an established biblical-register expression for a trance-like or ecstatic state. “Nri” remains a contextually implicit object of the preparation and does not materially over-specify the sense.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T09:16:57Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys Peter's intense hunger, his wish to eat, and the simultaneous preparation of food. However, “ọnọdụ pụrụ iche nke ọhụụ” expands ἔκστασις by explicitly introducing “vision,” whereas the Greek names the altered state and leaves the vision to the following verse. The conventional, comprehensible Igbo expression “ọ dabara n'oke mmụọ” renders the onset and experiential sense without that addition.
  naturalness: “Agụụ wee gụọ ya nke ukwuu” is less idiomatic than the direct Standard Igbo expression “Agụụ gụrụ ya nke ukwuu.” “Ọ dabara n'oke mmụọ” is concise and natural in elevated biblical narrative register.
  terminology: “Oke mmụọ” is an established Igbo biblical expression for an ecstatic or trance-like state. It should not be taken to identify the experience as the Holy Spirit or to settle its precise psychological nature. The phrase avoids the draft's explanatory, source-expanding wording.
  issues:
  - severity: medium
    issue: The rendering “ọnọdụ pụrụ iche nke ọhụụ” adds “of vision” to ἔκστασις.
    rationale: Although a vision follows in the narrative, this verse itself says that an ἔκστασις came upon Peter. The translation should not make the state itself mean a vision.
  - severity: low
    issue: “Agụụ wee gụọ ya nke ukwuu” is stylistically awkward.
    rationale: “Agụụ gụrụ ya nke ukwuu” is the more natural Standard Igbo way to express that he became very hungry.
  - severity: low
    issue: Footnote b paraphrases the state as withdrawal from surroundings rather than supplying a close lexical alternative.
    rationale: A note should preserve the lexical range of ἔκστασις, such as “ecstasy”/an ecstatic state, without adding a stronger claim about Peter's awareness.
  revised_text: Agụụ gụrụ ya nke ukwuu, ọ chọkwara iri ihe[a]. Ma mgbe ha na-akwadebe nri, ọ dabara n'oke mmụọ[b].
