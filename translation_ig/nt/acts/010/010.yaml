    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ọnọdụ mmụọ pụrụ iche.” Okwu Grik ahụ na-ekwu maka ọnọdụ uche gbanwere nke, n’ebe a, jikọrọ na mkpughe ọhụụ.
    reason: lexical_alternative
