  text: ἐγένετο δὲ πρόσπεινος καὶ ἤθελεν γεύσασθαι· παρασκευαζόντων δὲ ⸀αὐτῶν ⸀ἐγένετο ἐπ’ αὐτὸν ἔκστασις,
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/010.yaml
  text: He became very hungry and wanted to eat[a]; but while they were preparing it[b], a trance came over him.
translation:
  language: ig
  text: Agụụ gụrụ ya nke ukwuu, ọ chọkwara iri ihe[a]. Ma mgbe ha na-akwadebe nri, ọ dabara n'oke mmụọ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ịdetụ ihe ire”; ngwaa Grik ahụ pụtara n’ụzọ nkịtị ‘idetụ ire,’ ma n’ebe a ọ na-ezo aka n’iri nri.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ọnọdụ mmụọ pụrụ iche.” Okwu Grik ahụ na-ekwu maka ọnọdụ uche gbanwere nke, n’ebe a, jikọrọ na mkpughe ọhụụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο δὲ πρόσπεινος
  choice: Agụụ wee gụọ ya nke ukwuu
  rationale: Nke a na-egosi mgbanwe ọnọdụ ahụ na ike πρόσπεινος, ya bụ, na agụụ abụghị naanị obere agụụ kama ọ gụrụ ya nke ukwuu. ‘Wee’ na-aga nke ọma n’usoro akụkọ Igbo.
- source_word: ἤθελεν
  choice: ọ chọkwara
  rationale: ‘Chọkwara’ bụ okwu Igbo dị mfe ma bụrụkwa nke a na-eji eme ihe ugbu a maka ọchịchọ ya iri nri.
- source_word: γεύσασθαι
  choice: iri ihe
  rationale: Ọ bụ ezie na ngwaa Grik a nwere ike ịpụta ‘idetụ ihe ọnụ,’ n’ebe a ọ na-ezo aka n’iri nri. ‘Iri ihe’ na-enye nghọta ahụ n’Igbo nkịtị ma na-edobe ụzọ ọzọ na nkọwa ala peeji.
- source_word: παρασκευαζόντων αὐτῶν
  choice: mgbe ha nọ na-akwadebe ihe oriri
  rationale: Nkebiokwu a na-egosi ihe ha na-eme n’otu oge ahụ. Grik ekwughị ihe a na-akwadebe kpọmkwem, ma ọnọdụ akụkọ ahụ na-egosi na ọ bụ ihe oriri; ịkpọ ya aha na-eme ka Igbo doo anya.
- source_word: ἐγένετο ἐπ’ αὐτὸν
  choice: bịakwasịrị ya
  rationale: ‘Bịakwasịrị ya’ na-egosi mbata mberede nke ahụmahụ ahụ n’ahụ Pita ma kwekọọ n’ụzọ okwu Grik si arụ ọrụ.
- source_word: ἔκστασις
  choice: ọnọdụ pụrụ iche nke ọhụụ
  rationale: N’ebe a, okwu ahụ na-egosi ọnọdụ uche gbanwere nke jikọrọ ya na mkpughe a na-ahụ anya, ọ bụghị naanị iju anya. Nhọrọ a na-eme ka onye Igbo nke oge a ghọta ya n’enweghị itinye ozizi pụrụ iche.
theological_decisions:
- issue: Ụdị ọnọdụ Pita nke ἔκστασις na-egosi
  choice: ọnọdụ pụrụ iche nke ọhụụ
  alternative: uche ya pụọ n’ihe ndị gbara ya gburugburu
  rationale: Ihe na-esochi ozugbo bụ ọhụụ mkpughe. Ya mere, ntụgharị a na-egosi ọrụ okwu ahụ n’akụkọ ahụ, ma ọ naghị ekwu na Pita amaghị onwe ya kpamkpam ma ọ bụ tinye nkọwa omimi nke ihe odide ahụ na-ekwughị.
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, nke dị mfe ma nwee ugwu. Usoro ‘Agụụ gụrụ ya’ bụ ụzọ Igbo nkịtị si kwuo hunger, ebe ‘ọnọdụ pụrụ iche nke ọhụụ’ na-akọwa ahụmahụ ahụ n’enweghị okwu ụka nke otu òtù ma ọ bụ nkwubi okwu karịrị ihe Grik kwuru.
