  text: διὸ καὶ ἀναντιρρήτως ἦλθον μεταπεμφθείς πυνθάνομαι οὖν τίνι λόγῳ μετεπέμψασθέ με.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/029.yaml
  text: Therefore I came without objection when I was sent for[a]. So I ask[b], for what reason did you send for me?
translation:
  language: ig
  text: 'N’ihi ya, mgbe e zitere ka a kpọọ m, abịara m n’emeghị mkpesa ọ bụla.[a] Ya mere, ana m ajụ: gịnị kpatara unu ji zitere ka a kpọọ m?[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “n’enweghị ala azụ.” N’asụsụ Grik, ihe ọ pụtara n’ụzọ kpọmkwem karị bụ “n’emeghị mkpesa” ma ọ bụ “n’arụghị ụka.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “Ọ bụ n’ihi ihe kpatara ya ka unu ji zitere ka a kpọọ m?” N’ụzọ kpọmkwem, “n’ihi ihe kpatara gịnị?”
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ καὶ
  choice: N’ihi ya
  rationale: Na-egosi nkwubi okwu sitere n’ihe Pita kọwara tupu nke a. Ike nta nke καὶ dị n’ebe a abanyela n’usoro ahịrịokwu kama ịsụgharị ya n’ụzọ ga-ada arọ n’Igbo.
- source_word: ἀναντιρρήτως
  choice: n’emeghị mkpesa ọ bụla
  rationale: Na-echekwa echiche bụ isi nke emeghị okwu megide, ịrụ ụka, ma ọ bụ iguzogide arịrịọ ahụ; ọ dịkwa mfe nghọta n’Igbo ugbu a.
- source_word: ἦλθον
  choice: abịara m
  rationale: Ọ bụ nsụgharị kwụ ọtọ na nke ebumpụta ụwa nke omume ahụ e mechara eme.
- source_word: μεταπεμφθείς
  choice: mgbe e zitere ka a kpọọ m
  rationale: Na-echekwa ọdịdị nnara-eme nke participle ahụ na echiche nke iziga mmadụ ka ọ kpọta onye ọzọ.
- source_word: πυνθάνομαι οὖν
  choice: Ya mere, ana m ajụ
  rationale: Na-egosi ntụgharị gaa n’ajụjụ Pita ma na-eji okwu Igbo doro anya ma dị ugbu a.
- source_word: τίνι λόγῳ
  choice: ọ bụ n’ihi gịnị
  rationale: Na-enye echiche nke ịjụ ihe kpatara ya n’Igbo ebumpụta ụwa; nkọwa ala peeji na-egosi nsụgharị nke na-agbasochi usoro Grik anya karị.
- source_word: μετεπέμψασθέ με
  choice: unu zitere ka a kpọọ m
  rationale: Na-echekwa echiche nke ‘iziga ka a kpọọ’ ma kwekọọ na otu mgbọrọgwụ okwu ahụ e ji mee ihe na mbụ n’amaokwu ahụ.
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-echekwa njikọ ezi uche dị na διὸ/οὖν, ọdịdị nnara-eme nke μεταπεμφθείς, na nkwughachi echiche ‘iziga ka a kpọọ’ dị na okwu Grik abụọ ahụ.
