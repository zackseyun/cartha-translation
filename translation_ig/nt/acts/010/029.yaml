  to: 'N’ihi ya, mgbe e zitere ka a kpọọ m, abịara m n’emeghị mkpesa ọ bụla.[a] Ya mere, ana m ajụ: gịnị kpatara unu ji zitere ka a kpọọ m?[b]'
  rationale: The main question is recast in idiomatic Standard Igbo without changing its meaning. Footnote a now gives an actual equivalent for ‘without hesitation’ rather than the narrower idea of acting without delay. Footnote b is corrected to give a natural formal alternative and a clear indication of the Greek’s literal ‘for what reason’ phrasing.
