source:
  edition: SBLGNT
  text: καὶ παρήγγειλεν ἡμῖν κηρύξαι τῷ λαῷ καὶ διαμαρτύρασθαι ὅτι ⸀οὗτός ἐστιν ὁ ὡρισμένος ὑπὸ τοῦ θεοῦ κριτὴς ζώντων καὶ νεκρῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/042.yaml
  text: And he commanded us to proclaim to the people and to testify solemnly that this is the one appointed by God as judge of the living and the dead[a].
translation:
  language: ig
  text: O nyere anyị iwu ka anyị kwusaa ozi nye ndị mmadụ ma gbakwaa akaebe n’ụzọ siri ike na ọ bụ ya ka Chineke họpụtara ka ọ bụrụ onye ikpe ndị dị ndụ na ndị nwụrụ anwụ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ọ bụ ya ka Chineke doro ka ọ bụrụ onye ikpe ndị dị ndụ na ndị nwụrụ anwụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: παρήγγειλεν
  choice: nyere anyị iwu
  rationale: Nke a na-egosi iwu e nyere n'ikike, ọ bụghị naanị ndụmọdụ ma ọ bụ ntụziaka dị nro.
- source_word: κηρύξαι
  choice: kwusara ndị mmadụ ozi
  rationale: Nkebiokwu a na-egosi ikwupụta ozi n'ihu ọha, ma na-ezere ime ka ọ bụrụ naanị okwuchukwu n'ụlọ nzukọ.
- source_word: τῷ λαῷ
  choice: ndị mmadụ
  rationale: Ebe a ekwughị ‘Izrel’ kpọmkwem; ya mere, nsụgharị a anaghị etinye nkọwa nke na-adịghị n'amaokwu ahụ.
- source_word: διαμαρτύρασθαι
  choice: gbaakwa akaebe n'ụzọ siri ike
  rationale: Nke a na-echekwa ma echiche ịgba akaebe ma ịdị mkpa na ịdị nsọpụrụ nke akaebe ahụ.
- source_word: οὗτός
  choice: ọ bụ ya
  rationale: Ọ na-arụtụ aka n'ụzọ doro anya na Jizọs a kpọtụrụ aha n'akụkụ okwu ahụ.
- source_word: ὁ ὡρισμένος
  choice: onye ... họpụtara
  rationale: Ụdị okwu Grik ahụ na-egosi onye Chineke họpụtara ma debe n'ọrụ ahụ; ‘họpụtara’ bụ okwu Igbo doro anya ma dị ugbu a.
- source_word: ὑπὸ τοῦ θεοῦ
  choice: Chineke họpụtara
  rationale: A gbanwere usoro passive nke Grik ka ọ bụrụ active n'Igbo n'ụzọ eke, ebe Chineke ka bụ onye mere nhọpụta ahụ.
- source_word: κριτὴς
  choice: onye ikpe
  rationale: Nke a bụ okwu Igbo eke maka onye e nyere ọrụ ikpe ndị ọzọ ikpe.
- source_word: ζώντων καὶ νεκρῶν
  choice: nke ndị dị ndụ na ndị nwụrụ anwụ
  rationale: Ọ na-echekwa oke zuru ụwa ọnụ nke ọrụ ikpe ahụ na ụda okwu siri ike nke isi mmalite.
theological_decisions:
- issue: Ike nhọpụta Chineke nyere Jizọs maka ikpe
  choice: ọ bụ ya ka Chineke họpụtara ịbụ onye ikpe nke ndị dị ndụ na ndị nwụrụ anwụ
  alternative: ọ bụ ya ka Chineke doro ịbụ onye ikpe nke ndị dị ndụ na ndị nwụrụ anwụ
  rationale: 'Nsụgharị a na-ekwu kpọmkwem ihe amaokwu ahụ kwuru: Chineke họpụtara Jizọs ka ọ bụrụ onye ikpe mmadụ niile. Ọ naghị agbakwunye usoro ozizi e mepụtara mgbe e mesịrị.'
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke dị ugbu a ma nwee ugwu. E ji ‘kwusara ndị mmadụ ozi’ mee ka echiche nkwupụta n'ihu ọha doo anya; e jikwa usoro active mee ihe n'ebe passive Grik dị ka ọ na-adị eke n'Igbo.
