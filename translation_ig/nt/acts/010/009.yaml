id: ACT.10.9
reference: Acts 10:9
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Τῇ δὲ ἐπαύριον ὁδοιπορούντων ἐκείνων καὶ τῇ πόλει ἐγγιζόντων ἀνέβη Πέτρος ἐπὶ τὸ δῶμα προσεύξασθαι περὶ ὥραν ἕκτην.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/009.yaml
  text: On the next day[a], while those men were traveling and drawing near to the city, Peter went up on the housetop to pray, about the sixth hour.
translation:
  language: ig
  text: N’echi ya, mgbe ndị ikom ahụ nọ na-aga n’ụzọ ma na-abịaru obodo ahụ nso, Pita rigoro n’elu ụlọ ka o kpee ekpere, ihe dị ka awa nke isii.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ya bụ, ihe dị ka etiti ehihie, dịka usoro ndị Juu si agụ awa nke ehihie.
    reason: cultural_note
lexical_decisions:
- source_word: Τῇ δὲ ἐπαύριον
  choice: N’echi ya
  rationale: Ọ bụ ụzọ Igbo dị mfe ma bụrụkwa nke e ji akọ akụkọ iji kwuo ‘n’ụbọchị sochirinụ.’ A hapụrụ δέ ka usoro akụkọ n’onwe ya gosi njikọ dị nro, n’ihi na ịgbakwunye ‘ma’ ebe a nwere ike ime ka ọdịiche pụta karịa ka isi mmalite siri kwuo.
- source_word: ὁδοιπορούντων ἐκείνων
  choice: mgbe ndị ikom ahụ nọ na-aga n’ụzọ
  rationale: ‘Mgbe ... nọ na-aga’ na-egosi na ihe a na-eme na-aga n’ihu n’otu oge ahụ. ‘Ndị ikom ahụ’ na-ezo aka kpọmkwem n’ụmụ nwoke Kọniliọs zipụrụ, ma na-ada nke ọma n’Igbo.
- source_word: καὶ τῇ πόλει ἐγγιζόντων
  choice: ma na-eru nso n’obodo ahụ
  rationale: Nke a na-ejikọta omume nke abụọ na nke mbụ ma chekwaa echiche ἐγγίζω, ya bụ ịbịaru ebe ahụ nso.
- source_word: ἀνέβη
  choice: rigoro
  rationale: Ngwaa a na-egosi ngagharị ịrị elu n’ụzọ dị mfe ma kwekọọ na ịrị n’elu ụlọ.
- source_word: ἐπὶ τὸ δῶμα
  choice: n’elu ụlọ
  rationale: N’ebe a δῶμα bụ elu ụlọ dị larịị a pụrụ ịrịgo ma nọrọ na ya. ‘N’elu ụlọ’ bụ okwu Igbo nkịtị nke na-enye echiche ahụ n’enweghị nkọwa ụlọ owuwu karịrị isi mmalite.
- source_word: προσεύξασθαι
  choice: ikpe ekpere
  rationale: Infinitive a na-egosi nzube Pita ji rịgoro; ‘ikpe ekpere’ bụ okwu Igbo doro anya ma bụrụ nke a na-ejikarị eme ihe.
- source_word: περὶ ὥραν ἕκτην
  choice: ihe dị ka awa nke isii
  rationale: ‘Ihe dị ka’ chekwara echiche nke περὶ, ebe ‘awa nke isii’ na-edobe usoro ndị Juu si agụ awa ehihie kama iji ‘etiti ehihie’ dochie ya n’ahịrịokwu bụ isi.
theological_decisions: []
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta dee ya. Ahịrịokwu ahụ na-edobe usoro akụkọ na omume abụọ na-aga n’otu oge, ma nkọwa ọdịnala banyere ‘awa nke isii’ dị n’ala peeji kama idozi okwu isi mmalite n’ime ederede.
