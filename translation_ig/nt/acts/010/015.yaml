base_translation:
  language: en
  yaml_path: translation/nt/acts/010/015.yaml
  text: 'And a voice came to him again a second time: “What God has made clean[a], you must not call common.”'
translation:
  language: ig
  text: 'Olu wee gwa ya okwu ọzọ, nke ugboro abụọ, sị: “Ihe Chineke mere ka ọ dị ọcha[a], gị akpọla ya ihe nkịtị.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “akpọla ya ihe na-adịghị ọcha,” ma ọ bụ, “ewela ya dị ka ihe emerụrụ emerụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: φωνὴ
  choice: Olu
  rationale: Aha ahụ enweghị artikel n'okwu Grik; “olu” na-egosi okwu si n'eluigwe bịakwute Pita n'ebughị ụzọ kọwaa onye nwe olu ahụ.
- source_word: πάλιν ἐκ δευτέρου
  choice: ọzọ nke ugboro abụọ
  rationale: Nke a na-edobe ma πάλιν (“ọzọ”) ma ἐκ δευτέρου (“nke ugboro abụọ”), tinyere nkwughachi siri ike dị n'okwu Grik.
- source_word: πρὸς αὐτόν
  choice: bịakwute ya
  rationale: N'Igbo, ikwu na olu “bịakwutere ya” bụ ụzọ ebumpụta ụwa isi gosi na e duziri okwu ahụ n'ebe Pita nọ.
- source_word: Ἃ
  choice: Ihe
  rationale: Nnọchiaha neuter plural a na-achịkọta ihe ndị a na-ekwu maka ha; “Ihe” na-arụ otu ọrụ ahụ n'Igbo n'ụzọ dị mfe.
- source_word: ὁ θεὸς
  choice: Chineke
  rationale: Nke a bụ aha Igbo a na-ejikarị akọwa otu Chineke ahụ, n'enweghị mkpa itinye artikel.
- source_word: ἐκαθάρισεν
  choice: mere ka ọ dị ọcha
  rationale: Ọ na-egosi omume Chineke mezuru nke mere ihe ahụ ka ọ bụrụ nke dị ọcha, ma na-edobe echiche ịdị ọcha n'ihe gbasara iwu ofufe.
- source_word: σὺ
  choice: gị
  rationale: Nnọchiaha e kwuru kpọmkwem n'okwu Grik na-emesi Pita ike; itinye “gị” n'ihu iwu ahụ na-edobe nkwusi ike ahụ.
- source_word: μὴ κοίνου
  choice: akpọla ya ihe rụrụ arụ
  rationale: κοινόω n'ọnọdụ a pụtara ile ihe anya ma ọ bụ ịkpọ ya ihe na-ekwesịghị ịdị nsọ ma ọ bụ ihe merụrụ n'ihe gbasara ịdị ọcha. “Ihe rụrụ arụ” na-ebute ọdịiche dị n'etiti ihe Chineke mere ka ọ dị ọcha na mkpebi Pita banyere ya, ebe nkọwa ndị ọzọ dị n'ala peeji.
theological_decisions:
- issue: Nsụgharị okwu gbasara ịdị ọcha n'ọhụụ Pita
  choice: “akpọla ya ihe rụrụ arụ” ka ọ bụrụ isi okwu
  alternative: “akpọla ya ihe na-adịghị ọcha” ma ọ bụ “emesola ya ka ihe emerụrụ emerụ”
  rationale: κοινόω abụghị kpọmkwem otu okwu ahụ dị ka ἀκάθαρτος (“adịghị ọcha”). “Ihe rụrụ arụ” na-agbalị ichekwa ọdịiche ahụ na esemokwu dị n'etiti καθαρίζω na κοινόω, ebe ihe ndị ọzọ nwere ike ịkọwa ihe ọ pụtara ka edobere n'ala peeji.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-edobe nkwughachi nke okwu Grik na nkwusi ike dị na “gị,” ma zere itinye nkọwa ụka pụrụ iche.
