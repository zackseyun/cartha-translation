id: ACT.10.33
reference: Acts 10:33
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐξαυτῆς οὖν ἔπεμψα πρὸς σέ, σύ τε καλῶς ἐποίησας παραγενόμενος. νῦν οὖν πάντες ἡμεῖς ἐνώπιον τοῦ θεοῦ πάρεσμεν ἀκοῦσαι πάντα τὰ προστεταγμένα σοι ὑπὸ τοῦ ⸀κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/033.yaml
  text: So I sent for you at once[a], and you did well to come. Now then[b], we are all here before God to hear everything that has been commanded to you by the Lord.
translation:
  language: ig
  text: Ya mere, ezitere m ka a kpọọ gị ozugbo[a], gị onwe gị mekwara nke ọma ịbịa. Ugbu a kwa, anyị niile nọ ebe a n’ihu Chineke ka anyị nụ ihe niile Onyenwe[b] nyere gị n’iwu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ngwa ngwa” ma ọ bụ “n’egbughị oge.”
    reason: lexical_alternative
  - marker: b
    text: Grik sịrị, “Onyenwe.” N’ọnọdụ akụkọ a, o yikarịrị ka ọ na-ezo aka na Jizọs, ọ bụ ezie na ụfọdụ na-aghọta ya dịka Chineke n’ozuzu ya.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐξαυτῆς
  choice: ozugbo
  rationale: “Ozugbo” bụ okwu Igbo nkịtị nke na-egosi na Kọniliọs emeghị oge tupu o ziga ozi.
- source_word: οὖν
  choice: Ya mere / Ugbu a kwa
  rationale: Nke mbụ na-egosi ihe si n’ihe e kwuru pụta; nke abụọ na-ebuga okwu ahụ n’ihe mere ha ji gbakọta. A họọrọ ụzọ abụọ dabara n’Igbo n’ọnọdụ nke ọ bụla.
- source_word: ἔπεμψα πρὸς σέ
  choice: ezitere m ozi ka a kpọọ gị
  rationale: N’ọnọdụ a, Kọniliọs zigara ndị ozi ka ha kpọta Pita. Nsụgharị a na-enye nghọta ahụ n’Igbo doro anya, na-enweghị ịgbanwe ebumnuche okwu Grik.
- source_word: καλῶς ἐποίησας παραγενόμενος
  choice: i mekwara nke ọma ịbịa
  rationale: Nke a bụ ụzọ Igbo dị mfe ma bụrụkwa nke ebumpụta ụwa isi kwado ihe mmadụ mere site n’ịbịa ya.
- source_word: πάντες ἡμεῖς ... πάρεσμεν
  choice: anyị niile nọ ebe a
  rationale: Ọ na-echekwa nkwusi ike dị na “anyị niile” ma na-ekwu ịdị ha n’ebe ahụ n’Igbo a na-asụ ugbu a.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: n’ihu Chineke
  rationale: Ọ na-echekwa echiche dị nsọ nke ịnọ n’ebe Chineke nọ na n’okpuru anya ya.
- source_word: ἀκοῦσαι
  choice: ka anyị nụ
  rationale: Nkebiokwu “ka anyị nụ” na-egosi nzube ha ji nọrọ ebe ahụ.
- source_word: πάντα τὰ προστεταγμένα σοι
  choice: ihe niile ... nyere gị n’iwu
  rationale: “Nyere gị n’iwu” na-echekwa ikike na ịdị zuru ezu nke ihe e nyere Pita iwu ikwu.
- source_word: τοῦ κυρίου
  choice: Onyenwe anyị
  rationale: Nke a bụ nsụgharị Igbo a na-ahụkarị maka κύριος ma ọ naghị etinye aha onye okwu Grik ahụ akpọghị kpọmkwem.
theological_decisions:
- issue: Onye “Onyenwe anyị” (τοῦ κυρίου) na-ezo aka na ya
  choice: E debere ya dịka “Onyenwe anyị” n’ahịrị bụ isi.
  alternative: A pụrụ ịghọta ya dịka Jizọs n’ọnọdụ akụkọ a, ma ọ bụ dịka Chineke n’ozuzu ya.
  rationale: Okwu Grik kpọrọ naanị “Onyenwe anyị.” Ọnọdụ akụkọ Ọrụ Ndịozi 10 nwere ike ime ka ọ bụrụ Jizọs, ma nsụgharị ahụ ekwesịghị itinye aha ahụ ebe isi mmalite etinyeghị ya.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe ma dị nsọ, mee nsụgharị ahụ. E debere usoro okwu ka ọ bụrụ nke ndị na-agụ Igbo ga-aghọta ozugbo, ma e chekwara nkwusi ike, ikike iwu, na mgbagwoju anya banyere onye κύριος na-ezo aka na ya.
