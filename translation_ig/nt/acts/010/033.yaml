    text: Grik sịrị, “Onyenwe.” N’ọnọdụ akụkọ a, o yikarịrị ka ọ na-ezo aka na Jizọs, ọ bụ ezie na ụfọdụ na-aghọta ya dịka Chineke n’ozuzu ya.
    reason: alternative_reading
  revision_rationale: The revision retains the source’s discourse transitions, emphasis, purpose, and authoritative command, while making the sending idiom more idiomatic in Standard Igbo. It also replaces the potentially possessive “Onyenwe anyị” with “Onyenwe,” preserving the Greek’s unexpanded ‘the Lord’ and the ambiguity concerning the referent.
