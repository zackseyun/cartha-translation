revisions:
- from: Ya mere, ezitere m ozi ka a kpọọ gị ozugbo[a], i mekwara nke ọma ịbịa. Ugbu a kwa, anyị niile nọ ebe a n’ihu Chineke ka anyị nụ ihe niile Onyenwe anyị[b] nyere gị n’iwu.
  to: Ya mere, ezitere m ka a kpọọ gị ozugbo[a], gị onwe gị mekwara nke ọma ịbịa. Ugbu a kwa, anyị niile nọ ebe a n’ihu Chineke ka anyị nụ ihe niile Onyenwe[b] nyere gị n’iwu.
  rationale: The revision retains the source’s discourse transitions, emphasis, purpose, and authoritative command, while making the sending idiom more idiomatic in Standard Igbo. It also replaces the potentially possessive “Onyenwe anyị” with “Onyenwe,” preserving the Greek’s unexpanded ‘the Lord’ and the ambiguity concerning the referent.
