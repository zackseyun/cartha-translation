  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τοῦτον ὁ θεὸς ἤγειρεν ⸀τῇ τρίτῃ ἡμέρᾳ καὶ ἔδωκεν αὐτὸν ἐμφανῆ γενέσθαι,
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/040.yaml
  text: God raised this one on the third day and granted him to become visible[b][a],
translation:
  language: ig
  text: Onye a[a] ka Chineke kpọlitere n’ọnwụ n’ụbọchị nke atọ, meekwa ka ọ pụta ìhè.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị “ya” ma ọ bụ “nwoke a.” Nnọchiaha ngosi Grik ahụ na-emesi onye ahụ ike.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsị “nyekwa ya ka ọ ghọọ onye a pụrụ ịhụ anya” ma ọ bụ “mee ka a hụ ya.” N’okwu nkịtị, Grik sịrị, “nyere ya ka ọ ghọọ onye a pụrụ ịhụ anya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτον
  choice: Onye a
  rationale: Nnọchiaha ngosi a dị n’ihu ahịrịokwu Grik iji mesie onye a kpọtụrụ aha—Jizọs—ike. “Onye a” na-edobe nrụgide ahụ karịa naanị “ya,” ma bụrụkwa Igbo doro anya.
- source_word: ὁ θεὸς
  choice: Chineke
  rationale: Ọ bụ isiokwu ahịrịokwu ahụ; “Chineke” bụ ntụgharị Igbo kwụ ọtọ na nke e ji eme ihe n’ụzọ nkịtị.
- source_word: ἤγειρεν
  choice: kpọlitere n’ọnwụ
  rationale: N’ebe a okwu ahụ na-ekwu maka mbilite n’ọnwụ. “Kpọlitere n’ọnwụ” na-eme ka ihe a pụtara doo onye Igbo anya n’enweghị ịgbakwụnye nkọwa ozizi ọzọ.
- source_word: τῇ τρίτῃ ἡμέρᾳ
  choice: n’ụbọchị nke atọ
  rationale: Nke a na-egosi oge ihe ahụ mere ma na-edobe okwu Grik n’enweghị ịkọwa usoro a gụrụ ụbọchị ndị ahụ.
- source_word: ἔδωκεν
  choice: meekwa ka
  rationale: N’usoro infinitive a, δίδωμι na-egosi na Chineke nyere ma ọ bụ mere ka ihe ahụ mee. “Meekwa ka” bụ Igbo eke nke na-ezere ahịrịokwu siri ike dịka “nye ya ka.”
- source_word: αὐτὸν
  choice: ọ
  rationale: Nnọchiaha a na-ezo aka na Jizọs; usoro “mee ka ọ…” bụ Igbo nkịtị.
- source_word: ἐμφανῆ
  choice: pụta ìhè
  rationale: ἐμφανής pụtara ịbụ ihe a pụrụ ịhụ ma ọ bụ ihe e mere ka ọ pụta ìhè. Akpaalaokwu Igbo a na-eburu ma echiche nke ịhụ anya ma nke ime ka mmadụ pụta ìhè.
- source_word: γενέσθαι
  choice: ka ọ pụta
  rationale: γίνομαι nwere echiche nke ịghọ ma ọ bụ ịbịa n’ọnọdụ ọhụrụ. “Ka ọ pụta ìhè” na-edobe echiche mgbanwe ahụ n’Igbo eke.
theological_decisions:
- issue: Okwu banyere mbilite n’ọnwụ
  choice: Onye a ka Chineke kpọlitere n’ọnwụ n’ụbọchị nke atọ
  alternative: Chineke mere ka onye a bilie n’ụbọchị nke atọ
  rationale: Nhọrọ ahụ na-ekwupụta omume Chineke n’ụzọ doro anya ma na-edobe nrụgide dị na τοῦτον. “N’ọnwụ” na-akọwa echiche mbilite n’ọnwụ nke ἐγείρω n’ọnọdụ a, n’enweghị ịgbakwụnye ozizi ọzọ.
- issue: Ịpụta ìhè mgbe mbilite n’ọnwụ gasịrị
  choice: meekwa ka ọ pụta ìhè
  alternative: nyekwa ya ka ọ ghọọ onye a pụrụ ịhụ anya
  rationale: Akụkụ ahụ na-ekewa mbilite n’ọnwụ na ime ka Jizọs pụta ìhè. A hapụrụ onye ma ọ bụ ndị hụrụ ya n’akọwaghị n’amaokwu a, ka amaokwu na-esote nwee ike ịkọwa ya.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ usoro mkpụrụokwu nwere nrụgide—“Onye a ka Chineke…”—iji chekwaa ntinye τοῦτον n’ihu. Akpaalaokwu “pụta ìhè” na-eme ka ahịrịokwu ahụ bụrụ nke eke, ebe nkọwa ala peeji na-echekwa ọdịdị okwu Grik nke pụtara ‘ịghọ onye a pụrụ ịhụ anya.’
