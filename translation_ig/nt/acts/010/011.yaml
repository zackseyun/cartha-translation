  text: καὶ θεωρεῖ τὸν οὐρανὸν ἀνεῳγμένον καὶ ⸀καταβαῖνον σκεῦός τι ὡς ὀθόνην μεγάλην τέσσαρσιν ⸀ἀρχαῖς καθιέμενον ἐπὶ τῆς γῆς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/011.yaml
  text: and he sees heaven opened[a], and something like a large sheet descending, being lowered by its four corners to the earth[c][b],
translation:
  language: ig
  text: ọ na-ahụkwa eluigwe e meghere[a], na otu ihe[b] dị ka nnukwu ákwà mbara ka ọ na-agbadata; a na-eji nkuku anọ ya eweda ya ruo n’ụwa[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “mbara igwe e meghere.” Okwu Grik bụ οὐρανός nwere ike ịpụta “eluigwe” ma ọ bụ “mbara igwe.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “otu arịa” ma ọ bụ “otu ihe e ji arụ ọrụ.” Okwu Grik bụ σκεῦός τι ekwughị kpọmkwem ụdị ihe ọ bụ.
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “ka e ji nsọtụ anọ ya eweda ya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: θεωρεῖ
  choice: ọ na-ahụkwa
  rationale: E ji ngwaa oge ugbu a chekwaa ụdị akụkọ dị ndụ Luk ji dee ya; “na-ahụ” bụ okwu Igbo nkịtị ma doo anya.
- source_word: οὐρανὸν ἀνεῳγμένον
  choice: eluigwe ka e meghere ya
  rationale: N’ọhụụ a, “eluigwe” na-egosipụta ebe mkpughe ahụ si abịa nke ọma, ebe usoro “ka e meghere ya” na-egosi ọnọdụ ihe ahụ dị.
- source_word: καταβαῖνον
  choice: ka ọ na-agbadata
  rationale: Nke a na-egosipụta mmegharị ahụ na-aga n’ihu dịka participle Grik ahụ si dị.
- source_word: σκεῦός τι
  choice: otu ihe
  rationale: Okwu a na-ahapụ ụdị ihe ahụ n’amaghị ama, n’ihi na σκεῦος nwere ike ịpụta ihe, arịa, ma ọ bụ ngwa ọrụ dị iche iche.
- source_word: ὡς ὀθόνην μεγάλην
  choice: dị ka nnukwu ákwà mbara
  rationale: “Dị ka” chekwara ntụnyere ahụ, ebe “nnukwu ákwà mbara” na-enye onye na-agụ ya onyinyo doro anya n’etinyeghị ụdị ihe e ji mee ya.
- source_word: τέσσαρσιν ἀρχαῖς
  choice: site na nkuku anọ ya
  rationale: N’ihe yiri ákwà mbara, “nkuku anọ” bụ ụzọ Igbo kachasị mfe isi kwuo nsọtụ anọ ya.
- source_word: καθιέμενον
  choice: a na-ewedata ya
  rationale: Usoro a chekwara olu nnara nke participle Grik ma gosi na e nwere onye na-eme ka ihe ahụ gbadata n’ekwughị onye ahụ.
- source_word: ἐπὶ τῆς γῆς
  choice: n’ụwa
  rationale: “N’ụwa” chekwara nghọta sara mbara nke γῆ ma kwekọọ n’ọdịdị dị elu nke ọhụụ ahụ.
theological_decisions:
- issue: Otu a ga-esi tụgharị οὐρανός n’ọhụụ a
  choice: eluigwe
  alternative: mbara igwe
  rationale: Ebe ihe a bụ ọhụụ mkpughe, “eluigwe” na-echekwa mmetụta nke ebe ihe ahụ si n’elu pụta n’etinyeghị nkọwa ozizi ọzọ. Ma okwu Grik ahụ nwekwara ike izo aka na mbara igwe, ya mere e debere nke ahụ n’okpuru peeji.
translation_notes:
  register: Asụsụ Igbo a bụ nke oge a, dị ùgwù ma dị mfe nghọta. E chekwara ụdị akụkọ oge ugbu a nke Grik, ihe ahụ a na-amaghị kpọmkwem, na ọdịiche nwere ike ịdị n’etiti “eluigwe” na “mbara igwe.”
