id: ACT.10.30
reference: Acts 10:30
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Καὶ ὁ Κορνήλιος ἔφη· Ἀπὸ τετάρτης ἡμέρας μέχρι ταύτης τῆς ὥρας ⸀ἤμην τὴν ⸀ἐνάτην προσευχόμενος ἐν τῷ οἴκῳ μου, καὶ ἰδοὺ ἀνὴρ ἔστη ἐνώπιόν μου ἐν ἐσθῆτι λαμπρᾷ
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/030.yaml
  text: And Cornelius said, “Four days ago, up to this hour, I was praying at the ninth hour in my house, and behold, a man stood before me in bright clothing.”
translation:
  language: ig
  text: Kọniliọs wee sị, “Ụbọchị anọ gara aga ruo n’oge awa a, anọ m n’ụlọ m na-ekpe ekpere n’awa nke itoolu[a]. Lee, otu nwoke yi uwe na-egbuke egbuke guzoro n’ihu m.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ya bụ, n’ihe dị ka elekere atọ nke ehihie.
    reason: cultural_note
lexical_decisions:
- source_word: ἔφη
  choice: wee sị
  rationale: N’akụkọ Igbo, “wee sị” bụ ụzọ dị mma na nke nkịtị isi webata okwu onye kwuru n’oge gara aga.
- source_word: Ἀπὸ τετάρτης ἡμέρας μέχρι ταύτης τῆς ὥρας
  choice: Ụbọchị anọ gara aga, ruo kpọmkwem n’oge awa a
  rationale: Nke a na-edobe ma ụbọchị anọ gara aga ma njikọ ya na otu oge awa a, n’agbanyeghị na akpaokwu Grik ahụ nwere ntakịrị ihe isi ike n’usoro ya.
- source_word: ἤμην ... προσευχόμενος
  choice: anọ m ... na-ekpe ekpere
  rationale: Ụdị a na-egosi omume na-aga n’ihu n’oge gara aga, dịka periphrastic imperfect dị na Grik si eme.
- source_word: τὴν ἐνάτην
  choice: n’awa nke itoolu
  rationale: A hapụrụ usoro oge nke ọdịbendị mbụ n’ahịrịokwu, ebe nkọwa oge nke oge a dị n’okpuru peeji.
- source_word: ἐν τῷ οἴκῳ μου
  choice: n’ụlọ m
  rationale: Nke a bụ ntụgharị kwụ ọtọ ma bụrụkwa okwu Igbo a na-asụkarị maka ebe ahụ.
- source_word: ἰδοὺ
  choice: Lee
  rationale: “Lee” na-edobe ọrụ okwu ahụ nke ịdọrọ uche n’ihe pụtara na mberede ma mee ka akụkọ ahụ doo anya.
- source_word: ἀνὴρ
  choice: otu nwoke
  rationale: Okwu Grik ahụ na-akọwa onye nwoke, ya mere “otu nwoke” bụ ntụgharị doro anya na nke ebumpụta ụwa.
- source_word: ἔστη ἐνώπιόν μου
  choice: guzoro n’ihu m
  rationale: Nke a na-edobe echiche onye ahụ iguzo n’ihu Kọniliọs, kama ịgbanwe ya ka ọ bụrụ nanị “pụtara.”
- source_word: ἐν ἐσθῆτι λαμπρᾷ
  choice: yi uwe na-egbuke egbuke
  rationale: Nke a na-egosipụta uwe ahụ na ìhè ma ọ bụ ebube ya n’Igbo dị mfe ma dị ndụ.
theological_decisions:
- issue: Otú e si tụgharị τὴν ἐνάτην
  choice: n’awa nke itoolu
  alternative: n’ihe dị ka elekere atọ nke ehihie
  rationale: Idobe usoro oge nke ederede mbụ na-egbochi itinye usoro elekere nke oge a n’ahịrịokwu; a kọwara oge kwekọrọ na ya n’okpuru peeji.
- issue: Njikọ oge dị na Ἀπὸ τετάρτης ἡμέρας μέχρι ταύτης τῆς ὥρας
  choice: Ụbọchị anọ gara aga, ruo kpọmkwem n’oge awa a
  alternative: Ụbọchị anọ gara aga n’oge awa a kpọmkwem
  rationale: Nhọrọ e ji mee ihe na-edobe okwu abụọ ahụ, “site” na “ruo,” n’enweghị ịkọwa n’ụzọ siri ike karịa ka Grik si kwuo; ihe ọzọ dị mfe karị ma ọ na-ebelata akụkụ “ruo.”
translation_notes:
  register: E ji Standard Igbo nke oge a, dị nsọ ma dị mfe nghọta mee ihe. “Lee” na-echekwa ịdị ndụ nke akụkọ ahụ, ebe “uwe na-egbuke egbuke” na-ezere okwu ochie ma ọ bụ okwu okpukpe nke nwere nkọwa agbakwunyere.
