  text: καταβὰς δὲ Πέτρος πρὸς τοὺς ἄνδρας εἶπεν· Ἰδοὺ ἐγώ εἰμι ὃν ζητεῖτε· τίς ἡ αἰτία δι’ ἣν πάρεστε;
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/021.yaml
  text: So Peter went down to the men and said[a], “Look, I am the one you are looking for. Why are you here?”
translation:
  language: ig
  text: Pita wee rịdata gakwuru ndị ikom ahụ wee sị, “Lee, ọ bụ m bụ onye unu na-achọ. Gịnị mere unu ji nọrọ ebe a?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Gịnị bụ ihe kpatara unu ji nọ ebe a?”
    reason: lexical_alternative
lexical_decisions:
- source_word: καταβὰς
  choice: ridatara
  rationale: Ngwaa a na-egosi na Pita si n’elu ụlọ rịdata gaa n’ebe ndị ọbịa nọ; ‘ridatara’ na-edobe ntụziaka ahụ n’Igbo nkịtị.
- source_word: δὲ
  choice: Ya mere
  rationale: N’ebe a δέ na-aga n’ihu n’akụkọ ahụ, ọ bụghị igosi nnukwu mmegide; ‘Ya mere’ jikọtara ihe a na ihe bu ya ụzọ n’ụzọ doro anya.
- source_word: πρὸς τοὺς ἄνδρας
  choice: gakwuru ndị ikom ahụ
  rationale: πρός na accusative na-egosi ịgakwuru ndị ahụ; ‘gakwuru’ bụ okwu Igbo e ji ekwu mmegharị gaa n’ebe mmadụ nọ.
- source_word: Ἰδοὺ
  choice: Lee
  rationale: ‘Lee’ bụ okwu nkwupụta Igbo dị ugbu a nke na-adọta uche dịka ἰδού, na-enweghị ụda ochie gabiga ókè.
- source_word: ἐγώ εἰμι ὃν ζητεῖτε
  choice: ọ bụ m bụ onye unu na-achọ
  rationale: Nke a na-akọwapụta Pita dịka onye ha na-achọ, ma na-ada nke ọma n’Igbo a na-asụ ugbu a.
- source_word: τίς ἡ αἰτία δι’ ἣν πάρεστε
  choice: Gịnị mere unu ji nọrọ ebe a?
  rationale: Nkebiokwu a jụrụ ihe kpatara ọnụnọ ha. Nsụgharị a bụ Igbo ebumpụta ụwa ma na-edobe echiche πάρειμι nke ịbụ ndị nọ ebe ahụ.
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo nke dị ugbu a, dị ùgwù ma dị mfe nghọta. ‘Ndị ikom’ na-egosipụta ἄνδρας kpọmkwem, ebe ajụjụ ikpeazụ na-eji usoro Igbo ebumpụta ụwa akọwa ihe kpatara ọnụnọ ha.
