revisions:
- from: Ma Pita sịrị, “Mba, Onyenwe anyị! N’ihi na ọ dịbeghị mgbe m riri ihe ọ bụla a na-ewere dị ka ihe rụrụ arụ na ihe na-adịghị ọcha.”
  to: Ma Pita sịrị, “Mba, Onyenwe anyị! N’ihi na ọ dịbeghị mgbe m riri ihe ọ bụla na-adịghị nsọ na ihe na-adịghị ọcha.”
  rationale: The revision replaces the imprecise and expanded rendering of κοινόν with “na-adịghị nsọ,” preserving its ritual sense and its distinction from “na-adịghị ọcha” for ἀκάθαρτον. It retains the emphatic refusal, the causal connection, and the source’s “and.”
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T09:17:22Z'
review_pass:
  verdict: revise
  source_fidelity: 'The draft correctly conveys Peter’s emphatic refusal, address to the Lord, and lifelong abstention. However, “ihe rụrụ arụ” does not adequately distinguish κοινόν from ἀκάθαρτον: it can suggest moral corruption or general filth, while κοινόν here is the ritual category of what is common/profane (not sacred), set alongside what is unclean. The Greek conjunction καί is appropriately retained as “na.”'
  naturalness: The sentence is generally fluent Standard Igbo, but the repeated explanatory construction “ihe a na-ewere dị ka ihe...” is cumbersome in direct speech. “Ihe na-adịghị nsọ” is clearer and more economical in this ritual context.
  terminology: “Onyenwe anyị” is an established respectful biblical form for κύριε and does not require identifying the speaker further. Rendering κοινόν as “ihe na-adịghị nsọ” and ἀκάθαρτον as “ihe na-adịghị ọcha” preserves their distinct ritual senses without imposing a theological interpretation.
  issues:
  - severity: medium
    issue: The rendering of κοινόν as “ihe rụrụ arụ” is imprecise and overlaps with ἀκάθαρτον.
    rationale: The source deliberately uses two related but distinct ritual terms. “Ihe rụrụ arụ” commonly denotes something vile, corrupt, or dirty and obscures the common/profane category expressed by κοινόν.
  revised_text: Ma Pita sịrị, “Mba, Onyenwe anyị! N’ihi na ọ dịbeghị mgbe m riri ihe ọ bụla na-adịghị nsọ na ihe na-adịghị ọcha.”
  revised_footnotes: []
  revision_rationale: The revision replaces the imprecise and expanded rendering of κοινόν with “na-adịghị nsọ,” preserving its ritual sense and its distinction from “na-adịghị ọcha” for ἀκάθαρτον. It retains the emphatic refusal, the causal connection, and the source’s “and.”
