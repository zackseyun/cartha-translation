  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ δὲ Πέτρος εἶπεν· Μηδαμῶς, κύριε, ὅτι οὐδέποτε ἔφαγον πᾶν κοινὸν ⸀καὶ ἀκάθαρτον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/014.yaml
  text: But Peter said, “By no means, Lord, because I have never eaten anything common and unclean.”
translation:
  language: ig
  text: Ma Pita sịrị, “Mba, Onyenwe anyị! N’ihi na ọ dịbeghị mgbe m riri ihe ọ bụla na-adịghị nsọ na ihe na-adịghị ọcha.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μηδαμῶς
  choice: Mba
  rationale: Nke a na-egosipụta ọjụjụ siri ike Pita jụrụ; mkpu ahụ na-eme ka ike okwu Grik pụta n’Igbo eke.
- source_word: κύριε
  choice: Onyenwe anyị
  rationale: Ọ bụ okwu nkwanye ùgwù a na-eji akpọ onye nwe ma ọ bụ Onyenwe anyị; ebe a, okwu a na-agwa olu nyere Pita iwu.
- source_word: κοινὸν
  choice: ihe a na-ewere dị ka ihe rụrụ arụ
  rationale: N’ọnọdụ iwu gbasara nri, κοινός pụtara ihe a na-ewere dị ka ihe e merụrụ ma ọ bụ nke na-ekwesịghị iri, ọ bụghị naanị ihe mmadụ niile nwekọrọ.
- source_word: ἀκάθαρτον
  choice: ihe na-adịghị ọcha
  rationale: Nke a na-edobe ọdịiche okwu ahụ na κοινός ma na-egosipụta adịghị ọcha dịka iwu okpukpe si dị.
- source_word: ὅτι
  choice: N’ihi na
  rationale: Ọ na-ewebata ihe mere Pita ji jụ, kwekọrọ na njikọ echiche nke amaokwu ahụ.
- source_word: οὐδέποτε ἔφαγον
  choice: ọ dịbeghị mgbe m riri
  rationale: Ọ na-egosipụta n'ụzọ eke na nke doro anya na Pita emeghị nke a n’oge ọ bụla gara aga.
- source_word: πᾶν ... καὶ
  choice: ihe ọ bụla ... na
  rationale: A debere καί dịka “na,” nke nwere ike ijikọ njirimara abụọ ahụ n’otu ihe, kama ịgbanwe ya gaa “ma ọ bụ.”
theological_decisions:
- issue: Njikọ κοινὸν καὶ ἀκάθαρτον
  choice: “ihe ... rụrụ arụ na ihe na-adịghị ọcha”
  alternative: “ihe ... rụrụ arụ ma ọ bụ ihe na-adịghị ọcha”
  rationale: SBLGNT nwere καί (“na”); ntụgharị ahụ na-edobe njikọ ahụ n’agbanyeghị na a pụrụ ịghọta okwu abụọ ahụ dịka ụdị abụọ metụtara iwu ịdị ọcha.
- issue: Onye κύριε na-ezo aka na ya
  choice: “Onyenwe anyị” n’enweghị nkọwa ọzọ
  alternative: “Nna m ukwu” ma ọ bụ ịkọwapụta na ọ bụ Jizọs
  rationale: Akụkụ a n’onwe ya akọwaghị kpọmkwem onye Pita na-akpọ; a hapụrụ ohere ahụ kama ịmanye otu nkọwa.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji “a na-ewere dị ka” gosi na “rụrụ arụ” bụ ọnọdụ e nyere ihe n’ihe gbasara iwu ịdị ọcha, ma ghara ime ka ọ bụrụ naanị unyi nkịtị.
