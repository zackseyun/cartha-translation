    text: Ma ọ bụ, “n’asụsụ.” Okwu Grik a nwere ike ịpụta ire ma ọ bụ asụsụ; a hapụrụ ahịrịokwu a ka ọ ghara ikpebi kpọmkwem ụdị okwu ahụ bụ.
    reason: lexical_alternative
  revision_rationale: Removed the unsupported qualifier “dị iche iche” from both the text and footnote. This preserves the lexical and theological breadth of γλώσσαις while retaining a natural Igbo Christian idiom and the alternative sense in a footnote.
