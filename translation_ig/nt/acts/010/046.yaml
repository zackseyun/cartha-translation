  to: 'N’ihi na ha nọ na-anụ ka ndị ahụ na-ekwu okwu n’ire[a], na-ebulikwa Chineke elu. Mgbe ahụ, Pita zara sị:'
  rationale: Removed the unsupported qualifier “dị iche iche” from both the text and footnote. This preserves the lexical and theological breadth of γλώσσαις while retaining a natural Igbo Christian idiom and the alternative sense in a footnote.
