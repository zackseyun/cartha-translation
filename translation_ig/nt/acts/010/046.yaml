  text: ἤκουον γὰρ αὐτῶν λαλούντων γλώσσαις καὶ μεγαλυνόντων τὸν θεόν. τότε ⸀ἀπεκρίθη Πέτρος·
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/046.yaml
  text: 'For they were hearing them speaking in tongues and magnifying God[a]. Then Peter answered:'
translation:
  language: ig
  text: 'N’ihi na ha nọ na-anụ ka ndị ahụ na-ekwu okwu n’ire[a], na-ebulikwa Chineke elu. Mgbe ahụ, Pita zara sị:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’asụsụ.” Okwu Grik a nwere ike ịpụta ire ma ọ bụ asụsụ; a hapụrụ ahịrịokwu a ka ọ ghara ikpebi kpọmkwem ụdị okwu ahụ bụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤκουον
  choice: ha nọ na-anụ
  rationale: Ụdị imperfect na-egosi ihe na-aga n’ihu; “nọ na-anụ” na-echekwa akụkụ a n’ụzọ Igbo na-aghọta nke ọma.
- source_word: γὰρ
  choice: N’ihi na
  rationale: Ọ na-enye ihe mere okwu dị n’amaokwu bu ụzọ ji bụrụ eziokwu; “N’ihi na” bụ njikọ nkọwa doro anya n’Igbo.
- source_word: αὐτῶν
  choice: ndị ahụ
  rationale: Ọ na-arụtụ aka n’ebe ndị a kpọtụrụ aha na mbụ nọ, n’etinyeghị nkọwa dịka “ndị mba ọzọ” n’ime amaokwu ahụ; ọ na-ezerekwa mgbagwoju anya nke ikwugharị “ha ... ha” n’Igbo.
- source_word: λαλούντων
  choice: na-ekwu okwu
  rationale: Nke a bụ ụzọ Igbo dị ndụ ma kwụ ọtọ si akọwa omume ikwu okwu.
- source_word: γλώσσαις
  choice: n’ire dị iche iche
  rationale: “Ire” na-echekwa ihe oyiyi nke okwu Grik γλῶσσα na akpaalaokwu Akwụkwọ Nsọ, n’ebughị ụzọ kpebie ma okwu ahụ ọ pụtara asụsụ mmadụ ndị a maara ma ọ bụ ụdị okwu ọzọ. E debere “n’asụsụ dị iche iche” n’ala peeji dịka nhọrọ nkọwa.
- source_word: μεγαλυνόντων
  choice: na-ebulikwa Chineke elu
  rationale: Akpaalaokwu Igbo a na-egosi ime ka ịdị ukwuu Chineke pụta ìhè, ya bụ ito ya nke ukwuu, ma na-anọgide nso n’echiche μεγαλύνω.
- source_word: τὸν θεόν
  choice: Chineke
  rationale: Ọ bụ ihe omume μεγαλυνόντων metụtara ozugbo; nke a bụ nsụgharị Igbo a na-ejikarị eme ihe.
- source_word: τότε
  choice: Mgbe ahụ
  rationale: Ọ na-egosi ihe sochiri ihe a ozugbo n’usoro akụkọ.
- source_word: ἀπεκρίθη
  choice: zara sị
  rationale: “Zara” dabara na ἀποκρίνομαι; “sị” na-eme ka ntụpọ abụọ na-esote ya bụrụ nke e ji nwayọọ webata okwu Pita.
- source_word: Πέτρος
  choice: Pita
  rationale: Nke a bụ ụdị aha Πέτρος a nabatara n’Igbo.
theological_decisions:
- issue: Ihe γλώσσαις pụtara n’akụkọ banyere okwu nke Mmụọ Nsọ nyere ike
  choice: n’ire dị iche iche
  alternative: n’asụsụ dị iche iche
  rationale: Okwu Grik ahụ nwere ike ịpụta ire ma ọ bụ asụsụ. Isi ederede ji “ire dị iche iche” chekwaa akpaalaokwu ahụ na obosara ihe ọ pụrụ ịpụta, ebe nkọwa ala peeji na-enye nhọrọ “asụsụ dị iche iche” n’enweghị ikpebi esemokwu banyere ụdị okwu ahụ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. “Nọ na-anụ” na-echekwa omume na-aga n’ihu; “ndị ahụ” na-eme ka ntụaka nnọchiaha doo anya n’etinyeghị njirimara ndị a na-ekwu maka ha; “na-ebuli Chineke elu” bụ akpaalaokwu otuto dị ndụ n’Igbo.
