  yaml_path: translation/nt/acts/010/002.yaml
  text: devout and fearing God with all his household[a], doing many acts of charity for the people and praying to God continually[b],
translation:
  language: ig
  text: Ọ bụ onye na-asọpụrụ Chineke, na-atụkwa Chineke egwu, ya na ndị ụlọ ya niile[a]. Ọ na-enye ndị mmadụ ọtụtụ onyinye ebere[b], na-ekpekwa Chineke ekpere mgbe niile.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “onye na-atụ egwu Chineke.” Okwu a nwekwara ike ịbụ nkọwa a maara nke ọma banyere onye mba ọzọ nke na-efe Chineke Izrel.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ọtụtụ onyinye ebere.” Okwu Grik a na-ezokarị aka kpọmkwem n’onyinye a na-enye ndị nọ ná mkpa.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐσεβὴς
  choice: onye ji obi ya niile efe Chineke
  rationale: Nke a na-egosi nsọpụrụ na nrubeisi a na-ahụ n’otú mmadụ si ebi ndụ okpukpe ya; ọ bụkwa okwu Igbo dị mfe ma dị ùgwù.
- source_word: φοβούμενος τὸν θεὸν
  choice: na-atụkwa Chineke egwu
  rationale: Nke a na-edobe ụdị ngwaa na akpaalaokwu Akwụkwọ Nsọ, ebe ‘egwu’ pụtara nsọpụrụ miri emi, ọ bụghị naanị ịtụ ụjọ.
- source_word: σὺν παντὶ τῷ οἴκῳ αὐτοῦ
  choice: ya na ezinụlọ ya dum
  rationale: οἶκος ebe a bụ ndị niile so n’ezinụlọ ma ọ bụ ụlọ ya, ọ bụghị ụlọ ahụ e wuru ewu.
- source_word: ποιῶν
  choice: Ọ na-emere
  rationale: Ụdị a na-egosi omume ọ na-eme mgbe niile ma na-adaba n’Igbo nkịtị karịa ịsụgharị ya n’ụzọ siri ike dịka participle.
- source_word: ἐλεημοσύνας πολλὰς
  choice: ọtụtụ ọrụ ebere
  rationale: Nke a na-ekwupụta ọtụtụ omume ma ọ bụ onyinye enyere ndị nọ ná mkpa, n’enweghị iji okwu ụka nke ụfọdụ ndị nwere ike ghara ịghọta.
- source_word: τῷ λαῷ
  choice: ndị mmadụ
  rationale: Dative ahụ na-egosi ndị ritere uru n’ọrụ ebere ya; ‘na-emere ndị mmadụ’ na-ekwupụta nke a n’Igbo ebumpụta ụwa.
- source_word: δεόμενος τοῦ θεοῦ
  choice: na-ekpekwa ekpere nye Chineke
  rationale: N’ebe a δέομαι na-egosi ịrịọ Chineke n’ekpere; nsụgharị a doro anya ma bụrụ nke a na-asụkarị.
- source_word: διὰ παντός
  choice: mgbe niile
  rationale: Ọ na-egosi omume na-aga n’ihu ma ọ bụ nke a na-eme ugboro ugboro, na-enweghị ikwu na ọ dịghị mgbe ọ bụla ọ kwụsịrị.
theological_decisions:
- issue: Otú e si akọwa okwu banyere Kọniliọs dị ka onye na-atụ egwu Chineke
  choice: na-atụkwa Chineke egwu
  alternative: onye na-asọpụrụ Chineke / onye na-atụ egwu Chineke
  rationale: Nhọrọ a na-edobe ngwaa Grik na akpaalaokwu Akwụkwọ Nsọ. Ọ na-ahapụkwa ohere ka okwu ahụ gosipụta ma nsọpụrụ Chineke n’ozuzu ya ma nkọwa a pụrụ ịmata nke onye mba ọzọ na-efe Chineke Izrel, n’ebughị ụzọ kpebie nke naanị ya.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E kewara ahịrịokwu ahụ ụzọ abụọ iji mee ka usoro nkọwa participle ndị Grik bụrụ nke na-aga were were n’Igbo. Akara ụkwụokwu [a] na [b] dị n’ederede isi.
