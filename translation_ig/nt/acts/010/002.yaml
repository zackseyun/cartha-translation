    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ọtụtụ onyinye ebere.” Okwu Grik a na-ezokarị aka kpọmkwem n’onyinye a na-enye ndị nọ ná mkpa.
    reason: lexical_alternative
  revision_rationale: The revision removes added meaning from εὐσεβής, clarifies that the household accompanies Cornelius in the description, uses a more precise modern Igbo expression for almsgiving, and corrects the grammatical mismatch in footnote a. It preserves the source’s possible historical God-fearer nuance only in the footnote.
