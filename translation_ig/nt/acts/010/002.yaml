- from: onye ji obi ya niile efe Chineke, ya na ezinụlọ ya dum na-atụkwa Chineke egwu[a]. Ọ na-emere ndị mmadụ ọtụtụ ọrụ ebere[b], na-ekpekwa ekpere nye Chineke mgbe niile.
