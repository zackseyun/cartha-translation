revisions:
- from: Ozi ahụ o zigara ụmụ Izrel[a], mgbe ọ na-ezisa ozi ọma nke udo site n'aka Jizọs bụ Mesaya[b]—onye a bụ Onyenwe ihe niile.[c]
  to: Ozi ahụ o zigara ụmụ Izrel[a], na-ekwusa ozi ọma banyere udo site na Jizọs bụ Mesaya[b]—onye a bụ Onyenwe ihe niile.[c]
  rationale: The revision removes the unintended temporal sense introduced by “mgbe” and renders εὐαγγελιζόμενος as a manner/content participial clause, while retaining the Greek emphasis in “onye a.” It also corrects the explanatory wording in footnote b without changing its meaning.
