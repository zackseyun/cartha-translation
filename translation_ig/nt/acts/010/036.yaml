id: ACT.10.36
reference: Acts 10:36
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τὸν λόγον ⸀ὃν ἀπέστειλεν τοῖς υἱοῖς Ἰσραὴλ εὐαγγελιζόμενος εἰρήνην διὰ Ἰησοῦ Χριστοῦ· οὗτός ἐστιν πάντων κύριος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/036.yaml
  text: the message that he sent to the sons of Israel[c][b][a], proclaiming peace through Jesus the Messiah—he is Lord of all.
translation:
  language: ig
  text: Ozi ahụ o zigara ụmụ Izrel[a], na-ekwusa ozi ọma banyere udo site na Jizọs bụ Mesaya[b]—onye a bụ Onyenwe ihe niile.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “okwu ahụ o zigara ụmụ Izrel.”
    reason: lexical_alternative
  - marker: b
    text: N'asụsụ Grik, “Jizọs Kraịst”; a sụgharịrị ya “Jizọs bụ Mesaya” ebe a n'ihi na Χριστός na-arụ ọrụ dị ka aha ọkwá.
    reason: alternative_reading
  - marker: c
    text: 'A pụkwara ide ya, “ọ bụ Onyenwe ihe niile.” Ma asụsụ Grik ji nnọchiaha ngosi nwere nrụsi ike mee ihe: “onye a bụ Onyenwe ihe niile.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸν λόγον
  choice: Ozi ahụ
  rationale: N'ebe a, λόγος na-ezo aka n'ihe Chineke ziri Izrel, ọ bụghị naanị otu mkpụrụokwu. “Ozi” bụ Igbo doro anya ma kwekọọ n'ọnọdụ a.
- source_word: ὃν ἀπέστειλεν
  choice: o zigara
  rationale: Nke a na-edobe nkebi njikọ ahụ n'ụzọ Igbo dị mfe; onye e zoro aka na ya dị ka onye zitere ozi ahụ bụ Chineke dịka okwu ndị gbara amaokwu a gburugburu si gosi.
- source_word: τοῖς υἱοῖς Ἰσραήλ
  choice: ụmụ Izrel
  rationale: “Ụmụ Izrel” bụ ụzọ Igbo a na-aghọta nke ọma isi kpọọ ụmụ ma ọ bụ ndị Izrel, ma ọ naghị eme ka okwu ahụ bụrụ naanị ụmụ nwoke.
- source_word: εὐαγγελιζόμενος
  choice: mgbe ọ na-ezisa ozi ọma
  rationale: Nkebi a na-egosi na onye zitere ozi ahụ nọkwa na-ezisa ozi ọma. “Na-ezisa ozi ọma” na-eburu echiche nke ikwusa ozi ọma nke ngwaa Grik ahụ.
- source_word: εἰρήνην
  choice: nke udo
  rationale: “Udo” bụ ihe nhata kpọmkwem, ma n'okwu Akwụkwọ Nsọ ọ pụkwara ịgụnye ịdị ná mma na Chineke na ọdịmma zuru ezu.
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: site n'aka Jizọs bụ Mesaya
  rationale: “Site n'aka” na-egosi onye e si n'aka ya weta udo ahụ. Χριστός na-arụ ọrụ dị ka aha ọkwá, ya mere a sụgharịrị ya “Mesaya” kama idegharị ya naanị dị ka aha.
- source_word: οὗτός
  choice: onye a
  rationale: “Onye a” na-edobe nrụsi ike nke nnọchiaha ngosi Grik ahụ karịa iji naanị “ọ.”
- source_word: πάντων κύριος
  choice: Onyenwe ihe niile
  rationale: Nke a na-edobe nkwupụta gbasara ọchịchị zuru ụwa ọnụ n'emeghị ka πάντων bụrụ naanị mmadụ ma ọ bụ naanị ihe.
theological_decisions:
- issue: Nsụgharị Χριστοῦ n'okwu Ἰησοῦ Χριστοῦ
  choice: Mesaya
  alternative: Kraịst
  rationale: N'ebe a Χριστός bụ aha ọkwá nke Jizọs, ya mere “Mesaya” na-eme ka ihe aha ọkwá ahụ pụtara doo onye na-agụ Igbo anya.
- issue: Nsụgharị κύριος n'okwu πάντων κύριος
  choice: Onyenwe
  alternative: Nna ukwu
  rationale: “Onyenwe” na-echekwa ma ikike ma ịdị arọ nke nkwupụta banyere Jizọs; “Nna ukwu” nwere ike ime ka ọ bụrụ naanị mmekọrịta mmadụ na ibe ya.
- issue: Ichekwa nrụsi ike nke οὗτός ἐστιν πάντων κύριος
  choice: onye a bụ Onyenwe ihe niile
  alternative: ọ bụ Onyenwe ihe niile
  rationale: “Onye a” na-eme ka nrụsi ike dị na οὗτός pụta ìhè n'etinyeghị echiche ọzọ na-abụghị nke ederede.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta mee ihe. A hapụrụ amaokwu ahụ dịka nkebi ahịrịokwu na-aga n'ihu n'okwu Pita, dịka usoro Grik si dị. “Ụmụ Izrel” bụ okwu ọdịnala dị ndụ n'Igbo, ebe “onye a” na-echekwa nrụsi ike nke ederede mbụ.
