id: ACT.10.4
reference: Acts 10:4
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ δὲ ἀτενίσας αὐτῷ καὶ ἔμφοβος γενόμενος εἶπεν· Τί ἐστιν, κύριε; εἶπεν δὲ αὐτῷ· Αἱ προσευχαί σου καὶ αἱ ἐλεημοσύναι σου ἀνέβησαν εἰς μνημόσυνον ⸀ἔμπροσθεν τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/004.yaml
  text: But he stared at him[a], and becoming afraid, said, “What is it, Lord?” And he said to him, “Your prayers and your acts of mercy have gone up as a memorial before God.”
translation:
  language: ig
  text: Ma o legidere ya anya nke ọma[a], ụjọ wee jide ya, ọ sị, “Gịnị ka ọ bụ, Onyenwe m?” Ọ sịrị ya, “Ekpere gị na onyinye ebere gị arịgoro dị ka ihe ncheta n’ihu Chineke.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “legidere ya anya.” Okwu Grik ahụ na-egosi ile mmadụ anya kpọmkwem ma tinye uche.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀτενίσας
  choice: legidere ya anya nke ọma
  rationale: Nke a na-egosi ile mmadụ anya kpọmkwem ma tinye uche; ọ bụkwa okwu Igbo doro anya ma dị ndụ.
- source_word: ἔμφοβος γενόμενος
  choice: ụjọ wee jide ya
  rationale: Ọ na-egosi na ọ banyere n’ọnọdụ egwu n’oge ahụ, n’enweghị ikwubiga oke egwu ahụ ókè.
- source_word: Τί ἐστιν
  choice: Gịnị ka ọ bụ?
  rationale: Nke a bụ ụzọ Igbo nkịtị na nke kpọmkwem isi jụọ ihe okwu ahụ bụ n’ọnọdụ a.
- source_word: κύριε
  choice: Onyenwe m
  rationale: Ọ na-echekwa nkwanye ugwu dị n’okwu Grik ahụ, ma ihe gbara ya gburugburu anaghị amanye ka a ghọta ya dị ka nkwupụta zuru ezu banyere Kraịst.
- source_word: προσευχαί
  choice: ekpere
  rationale: Nke a bụ okwu Igbo a na-ejikarị eme ihe maka ekpere.
- source_word: ἐλεημοσύναι
  choice: onyinye ebere
  rationale: Ọ na-akọwa inye ndị nọ ná mkpa ihe n’ihi ebere, ma dị mfe nghọta karịa okwu ochie pụrụ iche.
- source_word: ἀνέβησαν
  choice: arịgoro
  rationale: Ọ na-echekwa onyinyo nke ihe na-arịgo n’ihu Chineke, nke nwere ike icheta ekpere ma ọ bụ àjà.
- source_word: εἰς μνημόσυνον
  choice: dị ka ihe ncheta
  rationale: Ọ na-echekwa echiche nke ihe na-eme ka e cheta mmadụ n’ihu Chineke, n’etinyeghị nkọwa emume àjà karịrị ihe ederede kwuru.
- source_word: ἔμπροσθεν τοῦ θεοῦ
  choice: n’ihu Chineke
  rationale: Nke a bụ ntụgharị Igbo dị nkenke na nke kwesịrị ekwesị maka ịnọ n’ihu ma ọ bụ n’ebe Chineke nọ.
theological_decisions:
- issue: Ike okwu κύριε mgbe Kọniliọs na-agwa onye ozi eluigwe okwu
  choice: Onyenwe m dị ka okwu nkwanye ugwu
  alternative: Nna m ukwu; onye nwe m
  rationale: “Onyenwe m” na-echekwa ịdị elu na nkwanye ugwu nke okwu ahụ, ma a naghị eji ntụgharị ahụ kpebie na Kọniliọs nọ ebe a na-ekwupụta onye ozi ahụ dị ka Jizọs.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke ugbu a, dị ugwu ma dị mfe nghọta. E ji “onyinye ebere” kọwaa inye ndị nọ ná mkpa; e debere onyinyo nke ekpere na ọrụ ebere ‘ịrịgo’ n’ihu Chineke.
