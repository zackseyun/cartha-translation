  source_fidelity: 'Ntụgharị ahụ na-anọchi anya akụkụ ndị bụ isi nke Grik ahụ n’ụzọ ziri ezi: ile anya nke ukwuu, ịba n’egwu, ajụjụ ahụ, okwu nkwanye ugwu κύριε, ekpere na onyinye ebere, na ịrịgo dị ka ihe ncheta n’ihu Chineke. “Ụjọ wee jide ya” na-egosipụta nke ọma echiche ingressive dị na ἔμφοβος γενόμενος n’enweghị ikwubiga oke ókè.'
