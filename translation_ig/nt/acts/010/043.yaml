- from: 'Ndị amụma niile na-agba akaebe banyere ya[a]: onye ọ bụla kwere na ya na-enweta mgbaghara mmehie site n’aha ya.'
  to: 'Ndị amụma niile na-agba akaebe banyere ya[a]: onye ọ bụla na-ekwere na ya na-enweta mgbaghara mmehie site n’aha ya.'
  rationale: The revision preserves the meaning and structure of the Greek while using a present/habitual Igbo verb form for the generic present participle “everyone believing.” The footnote is made idiomatic and continues to offer the alternative “bear witness concerning him” construction without imposing a narrower interpretation.
