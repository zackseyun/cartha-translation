id: ACT.10.43
reference: Acts 10:43
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τούτῳ πάντες οἱ προφῆται μαρτυροῦσιν, ἄφεσιν ἁμαρτιῶν λαβεῖν διὰ τοῦ ὀνόματος αὐτοῦ πάντα τὸν πιστεύοντα εἰς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/043.yaml
  text: All the prophets testify about him that everyone who believes in him receives forgiveness of sins through his name[a].
translation:
  language: ig
  text: 'Ndị amụma niile na-agba akaebe banyere ya[a]: onye ọ bụla na-ekwere na ya na-enweta mgbaghara mmehie site n’aha ya.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Ndị amụma niile na-agba ya akaebe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τούτῳ
  choice: banyere ya
  rationale: Dativ a jikọrọ ya na μαρτυροῦσιν na-egosi onye akaebe ahụ metụtara. “Banyere ya” bụ Igbo doro anya ma bụrụkwa nke sitere n’okwu gbara ya gburugburu, ebe Pita na-ekwu na ndị amụma gbara Jizọs akaebe.
- source_word: πάντες οἱ προφῆται
  choice: Ndị amụma niile
  rationale: Nke a na-edobe echiche zuru ezu nke πάντες ma na-ezo aka n’akaebe nke ndị amụma n’ụzọ Igbo nkịtị.
- source_word: μαρτυροῦσιν
  choice: na-agba akaebe
  rationale: “Ịgba akaebe” na-edobe ike okwu metụtara ịgba akaebe ma bụrụ okwu Igbo a na-aghọta nke ọma.
- source_word: ἄφεσιν ἁμαρτιῶν
  choice: mgbaghara mmehie
  rationale: Nke a bụ ntụgharị Igbo doro anya nke na-egosi ịgbaghara mmehie, na-enweghị ịgbakwụnye nkọwa ozizi ọzọ.
- source_word: λαβεῖν
  choice: na-enweta
  rationale: Infinitiv ahụ na-egosi ihe onye kwere ekwe na-anata. Iji ngwaa zuru ezu “na-enweta” na-eme ka ahịrịokwu ahụ bụrụ Igbo eke ma na-edobe nkwupụta izugbe nke Grik.
- source_word: διὰ τοῦ ὀνόματος αὐτοῦ
  choice: site n’aha ya
  rationale: Nke a na-edobe akpaalaokwu Akwụkwọ Nsọ na echiche nke ụzọ ma ọ bụ onye e si n’aka ya nweta mgbaghara, n’ebughị ụzọ kọwaa “aha” dịka “ikike” naanị.
- source_word: πάντα τὸν πιστεύοντα
  choice: onye ọ bụla kwere
  rationale: Nkebi okwu ahụ bụ nke na-agụnye mmadụ niile n’otu n’otu; “onye ọ bụla” na-egosi oke ya nke ọma, ọ bụghị naanị ụmụ nwoke.
- source_word: εἰς αὐτόν
  choice: na ya
  rationale: Mgbe πιστεύω so εἰς, ọ na-egosi okwukwe ma ọ bụ ntụkwasị obi e tinyere n’ebe mmadụ nọ. “Kwere na ya” bụ ụzọ Igbo kwesịrị ekwesị isi kwuo ya.
theological_decisions:
- issue: Oke na ọnọdụ nke mgbaghara
  choice: Onye ọ bụla kwere na Jizọs na-enweta mgbaghara mmehie site n’aha ya.
  alternative: Ịgbasa okwu a ka ọ kọwaa n’ụzọ zuru ezu usoro nzọpụta ma ọ bụ ụdị okwukwe a na-ekwu maka ya.
  rationale: A hapụrụ njikọ ederede ahụ kwuru n’etiti Jizọs, okwukwe, na mgbaghara ka ọ dị, n’etinyeghị ozizi otu ụka ma ọ bụ nkọwa gafere okwu Grik.
- issue: Partisipul nwoke e ji anọchi anya mmadụ niile
  choice: onye ọ bụla kwere
  alternative: nwoke ọ bụla kwere
  rationale: Ụdị nwoke dị na Grik bụ nke na-anọchi anya mmadụ niile, ọ bụghị nke na-ewepụ ụmụ nwanyị; “onye ọ bụla” na-edobe ebumnuche ahụ.
- issue: Ihe “aha ya” pụtara
  choice: site n’aha ya
  alternative: site n’ikike nke aha ya
  rationale: “Aha ya” nwere ike ịgụnye onye Jizọs bụ na ikike ya, ma ntụgharị ahụ anaghị akpọchi akpaalaokwu ahụ n’otu nkọwa naanị.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. Kọlọm na-ekewa ihe ndị amụma na-agba akaebe banyere Jizọs na ọdịnaya nke akaebe ahụ, ma na-ezere nghọtahie nke usoro “banyere ya na onye…”.
