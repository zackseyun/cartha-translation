review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the prophets’ witness concerning Jesus, forgiveness of sins, its mediation through his name, and the universal scope of those who believe. The perfective form “kwere” can, however, be read primarily as a completed past act, whereas the Greek present participle πιστεύοντα presents the believer characteristically/currently.
  naturalness: The sentence is clear and suitably dignified Standard Igbo. Recasting “onye ọ bụla kwere na ya” as “onye ọ bụla na-ekwere na ya” better reflects an ongoing/general believing relationship in idiomatic Igbo.
  terminology: “Ndị amụma,” “ịgba akaebe,” “mgbaghara mmehie,” and “site n’aha ya” are appropriate and preserve the biblical register without doctrinal expansion. The alternative footnote is adjusted to a natural Igbo formulation that corresponds to “bear witness concerning him.”
  issues:
  - severity: low
    issue: Aspect of “kwere”
    rationale: The Greek πιστεύοντα is a present participle, “the one believing.” Although “onye ọ bụla kwere” can function generally in Igbo, “onye ọ bụla na-ekwere” more directly preserves the ongoing/generic aspect and avoids a predominantly past-completed reading.
  - severity: low
    issue: Footnote wording
    rationale: “Na-agbara ya akaebe” is less natural as an independent alternative in this context. “Ndị amụma niile na-agba ya akaebe” is a natural alternative construction while retaining the source ambiguity of the dative with μαρτυροῦσιν.
  revised_text: 'Ndị amụma niile na-agba akaebe banyere ya[a]: onye ọ bụla na-ekwere na ya na-enweta mgbaghara mmehie site n’aha ya.'
