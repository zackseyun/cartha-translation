revisions:
- from: Mgbe mmụọ ozi ahụ ya na ya na-ekwu okwu lawara, Kọniliọs kpọrọ mmadụ abụọ n’ime ndị na-ejere ya ozi n’ụlọ[a], kpọọkwa otu onye agha ji nsọpụrụ na-efe Chineke, onye so ná ndị na-ejere ya ozi mgbe niile.
  to: Mgbe mmụọ ozi ahụ nke na-agwa Kọniliọs okwu lapụrụ, Kọniliọs kpọrọ mmadụ abụọ n’ime ndị na-ejere ya ozi n’ụlọ[a] na otu onye agha na-asọpụrụ Chineke, onye so n’ime ndị na-anọgide na-ejere ya ozi.
  rationale: The revision makes the referent of the angel’s speech explicit, represents φωνήσας as one summons with two coordinated objects, and improves the lexical-alternative footnote. It preserves the temporal sequence, the heavenly sense of “angel,” the domestic-service setting, the soldier’s devotion, and his membership among Cornelius’s continuing attendants.
