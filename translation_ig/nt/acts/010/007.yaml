id: ACT.10.7
reference: Acts 10:7
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὡς δὲ ἀπῆλθεν ὁ ἄγγελος ὁ λαλῶν ⸀αὐτῷ, φωνήσας δύο τῶν ⸀οἰκετῶν καὶ στρατιώτην εὐσεβῆ τῶν προσκαρτερούντων αὐτῷ
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/007.yaml
  text: When the angel who was speaking to him had gone away[a], he called two of his household servants and a devout soldier from among those attending him.
translation:
  language: ig
  text: Mgbe mmụọ ozi ahụ nke na-agwa Kọniliọs okwu lapụrụ, Kọniliọs kpọrọ mmadụ abụọ n’ime ndị na-ejere ya ozi n’ụlọ[a] na otu onye agha na-asọpụrụ Chineke, onye so n’ime ndị na-anọgide na-ejere ya ozi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “mmadụ abụọ n’ime ndị ohu n’ụlọ ya.” Okwu Grik bụ οἰκέται; ọ na-ezo aka n’ụlọ ndị na-arụ ọrụ dị ka ndị na-eje ozi ma ọ bụ ndị ohu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ ἀπῆλθεν
  choice: Mgbe ... lawara
  rationale: Nkebiokwu a na-egosi na ọpụpụ mmụọ ozi ahụ buru ụzọ mee tupu Kọniliọs akpọọ ndị ahụ; usoro a bụ nke Igbo nkịtị ma doo anya.
- source_word: ὁ ἄγγελος
  choice: mmụọ ozi ahụ
  rationale: N’ọnọdụ a, okwu ahụ na-ezo aka n’onye ozi si n’eluigwe nke pụtara n’ọhụụ Kọniliọs, ọ bụghị naanị onye ozi mmadụ.
- source_word: ὁ λαλῶν αὐτῷ
  choice: ya na ya na-ekwu okwu
  rationale: Nke a na-eme ka a mata na ọ bụ mmụọ ozi ahụ nọ na-agwa Kọniliọs okwu; ọ na-echekwa echiche nke omume nọ na-aga n’ihu.
- source_word: φωνήσας
  choice: Kọniliọs kpọrọ ... kpọọkwa
  rationale: Aha Kọniliọs, nke a ghọtara site n’ihe gbara amaokwu ahụ gburugburu, ka e tinyere ka ntụaka nnọchiaha ghara ịdị mgbagwoju anya n’Igbo. Mmegharị ‘kpọrọ ... kpọọkwa’ na-eme ka ihe abụọ ọ kpọrọ pụta nke ọma.
- source_word: δύο τῶν οἰκετῶν
  choice: mmadụ abụọ n’ime ndị na-ejere ya ozi n’ụlọ[a]
  rationale: Nhọrọ a na-egosi ma mmekọrịta ọrụ ha na Kọniliọs ma ọnọdụ ụlọ ha. Ihe odide ala peeji na-echekwa nkọwa siri ike karị nke nwere ike ịbụ ‘ndị ohu ụlọ.’
- source_word: στρατιώτην εὐσεβῆ
  choice: otu onye agha ji nsọpụrụ na-efe Chineke
  rationale: ‘Otu onye agha’ na-egosipụta otu onye ahụ, ebe nkebiokwu banyere ife Chineke na-enye εὐσεβής n’Igbo dị ndụ n’etinyeghị aha otu ozizi pụrụ iche.
- source_word: τῶν προσκαρτερούντων αὐτῷ
  choice: onye so ná ndị na-ejere ya ozi mgbe niile
  rationale: Nke a na-echekwa echiche partitive—onye agha ahụ bụ otu n’ime ìgwè ndị na-anọgide n’ọrụ n’akụkụ Kọniliọs—na echiche nke ịnọgide na-eje ozi.
theological_decisions:
- issue: Ụdị onye ἄγγελος na-ezo aka na ya
  choice: mmụọ ozi
  alternative: onye ozi
  rationale: Ihe gbara amaokwu a gburugburu na-akọ ọhụụ nke Kọniliọs na onye ozi Chineke si n’eluigwe; ya mere, ‘mmụọ ozi’ bụ ihe ọnọdụ ahụ chọrọ.
- issue: Nkọwa εὐσεβής
  choice: ji nsọpụrụ na-efe Chineke
  alternative: onye na-atụ egwu Chineke
  rationale: Nhọrọ a na-egosipụta nsọpụrụ na ofufe okpukpe, ma ọ naghị eme ka okwu ahụ bụrụ kpọmkwem otu aha e ji akọwa otu ìgwè ndị Juu na-abụghị Juu.
translation_notes:
  register: E ji Igbo izugbe nke oge a, dị ugwu ma dị mfe nghọta. A kpọrọ Kọniliọs aha n’ebe Grik hapụrụ isiokwu ahụ ka nghọta ya sie ike n’Igbo. Akara nkọwa ala peeji [a] dị n’akụkụ okwu ọ na-akọwa.
