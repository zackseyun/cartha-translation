review_pass:
  verdict: revise
  source_fidelity: The draft correctly identifies the angel, Cornelius, two household workers, and one devout soldier drawn from Cornelius’s regular attendants. However, “ya na ya na-ekwu okwu” has an avoidable ambiguous pronoun reference, and the paired verbs “kpọrọ ... kpọọkwa” make the single Greek summoning action sound like two separate calls. The revision retains the source’s one coordinated summons and makes Cornelius the explicit recipient of the angel’s speech.
  naturalness: The revised wording is clear, modern Standard Igbo. “Onye na-agwa Kọniliọs okwu” removes the repeated-pronoun ambiguity, while “n’ime ndị na-anọgide na-ejere ya ozi” naturally conveys the partitive group and the persistent-attendance sense of προσκαρτερούντων.
  terminology: “Mmụọ ozi” is contextually correct for ἄγγελος. “Onye agha na-asọpụrụ Chineke” communicates εὐσεβῆ without turning it into the more technical label “God-fearer.” The footnote preserves the legitimate stronger lexical alternative, “household slaves.”
  issues:
  - severity: medium
    issue: Ambiguous pronoun reference in “mmụọ ozi ahụ ya na ya na-ekwu okwu.”
    rationale: Both pronouns are third person and the phrase does not explicitly identify Cornelius as the person addressed. The Greek αὐτῷ refers to Cornelius.
  - severity: medium
    issue: “kpọrọ ... kpọọkwa” presents two calls rather than one coordinated summoning.
    rationale: φωνήσας governs both “two household servants” and “a devout soldier.” A single “kpọrọ ... na ...” better reflects the syntax and action.
  - severity: low
    issue: Footnote alternative is awkwardly ordered as “ndị ohu ụlọ ya abụọ.”
    rationale: “Mmadụ abụọ n’ime ndị ohu n’ụlọ ya” is clearer Standard Igbo and explicitly corresponds to “two of his household slaves.”
  revised_text: Mgbe mmụọ ozi ahụ nke na-agwa Kọniliọs okwu lapụrụ, Kọniliọs kpọrọ mmadụ abụọ n’ime ndị na-ejere ya ozi n’ụlọ[a] na otu onye agha na-asọpụrụ Chineke, onye so n’ime ndị na-anọgide na-ejere ya ozi.
  revised_footnotes:
