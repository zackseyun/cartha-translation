    text: A pụkwara ịsụgharị ya, “mmadụ abụọ n’ime ndị ohu n’ụlọ ya.” Okwu Grik bụ οἰκέται; ọ na-ezo aka n’ụlọ ndị na-arụ ọrụ dị ka ndị na-eje ozi ma ọ bụ ndị ohu.
    reason: lexical_alternative
  revision_rationale: The revision makes the referent of the angel’s speech explicit, represents φωνήσας as one summons with two coordinated objects, and improves the lexical-alternative footnote. It preserves the temporal sequence, the heavenly sense of “angel,” the domestic-service setting, the soldier’s devotion, and his membership among Cornelius’s continuing attendants.
