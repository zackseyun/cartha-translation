  source_fidelity: 'Nsụgharị ahụ na-egosipụta nke ọma ajụjụ nkwuwa okwu Μήτι nke na-atụ anya azịza na-adịghị mma, yana “igbochi mmiri ahụ” na nzube ya, “ka a ghara ime ndị a baptizim.” Ọ na-edobekwa ezi usoro akụkọ ahụ: ndị a anatala Mmụọ Nsọ tupu e kwe ka e mee ha baptizim mmiri. Nkebi “dịka anyị” na-echekwa ntụnyere ὡς καὶ ἡμεῖς n’enweghị itinye nkọwa ozizi ọzọ.'
  naturalness: “Ọ̀ dị onye pụrụ igbochi mmiri ahụ...?” bụ Igbo ọkọlọtọ, doo anya, ma dabara n’ajụjụ nkwuwa okwu. Ikewa nkebi nkọwa ahụ ka ọ bụrụ “Ha anatawokwa Mmụọ Nsọ dịka anyị” na-agụ nke ọma n’Igbo ma anaghị agbanwe mmekọrịta ya na ajụjụ mbụ.
  terminology: “Mmụọ Nsọ,” “mmiri ahụ,” na “ime ... baptizim” bụ okwu kwesịrị ekwesị n’Igbo ọkọlọtọ maka amaokwu a. “Ndị a” na-anọchi τούτους n’enweghị ịgbakwunye na ndị ahụ bụ naanị ụmụ nwoke. Ihe ndetu a na-enye ụzọ ọzọ ziri ezi maka κωλύω na usoro baptizim.
