id: ACT.10.47
reference: Acts 10:47
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Μήτι τὸ ὕδωρ ⸂δύναται κωλῦσαί⸃ τις τοῦ μὴ βαπτισθῆναι τούτους οἵτινες τὸ πνεῦμα τὸ ἅγιον ἔλαβον ⸀ὡς καὶ ἡμεῖς;
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/047.yaml
  text: Surely no one can withhold the water so that these people should not be baptized[b][a], can they? For they have received the Holy Spirit just as we have.
translation:
  language: ig
  text: “Ọ̀ dị onye pụrụ igbochi mmiri ahụ, ka a ghara ime ndị a baptizim[a]? Ha anatawokwa Mmụọ Nsọ dịka anyị.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “machibido mmiri ahụ,” ma ọ bụ, “gbochie ka e mee ndị a baptizim.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Μήτι
  choice: Ọ̀ dị onye pụrụ ...?
  rationale: Ajụjụ a bụ ajụjụ nkwuwa okwu nke na-atụ anya azịza ‘ọ dịghị onye’; usoro Igbo a na-egosipụta ike ahụ n'ụzọ e kere eke.
- source_word: τὸ ὕδωρ
  choice: mmiri ahụ
  rationale: E debere njirimara okwu Grik ahụ; n’ọnọdụ a, ọ na-ezo aka na mmiri e ji eme baptizim.
- source_word: δύναται κωλῦσαί τις
  choice: ọ dị onye pụrụ igbochi
  rationale: Nke a na-egosipụta ma ikike ime ihe ma echiche nke igbochi ma ọ bụ machibido ihe.
- source_word: τοῦ μὴ βαπτισθῆναι
  choice: ka a ghara ime ... baptizim
  rationale: Ọ na-edobe echiche nke igbochi ihe ka ọ ghara ime, dịka articular infinitive na μή si kwuo.
- source_word: τούτους
  choice: ndị a
  rationale: Ọ bụ ntụaka zuru oke nye ndị ahụ, n’enweghị ịkọwa na ha bụ naanị ụmụ nwoke.
- source_word: οἵτινες
  choice: Ha ...
  rationale: E kewara nkebi ahụ ka Igbo wee dị mfe ma doo anya; ihe kpatara ajụjụ Pita pụtara ìhè site n’usoro ahịrịokwu.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: Mmụọ Nsọ
  rationale: Nke a bụ aha a na-ejikarị eme ihe n’Igbo ugbu a, ma na-edobe ihe okwu Grik pụtara n’ụzọ kwesịrị nsọpụrụ.
- source_word: ἔλαβον
  choice: anatawokwa
  rationale: Ọ na-egosi ihe mezuru nke ka dị mkpa n’arụmụka a; ‘-kwa’ na-ejikọta ndị a na ndị kwere ekwe ndị ọzọ.
- source_word: ὡς καὶ ἡμεῖς
  choice: dịka anyị
  rationale: Ọ na-edobe ntụnyere kpọmkwem n’etiti nnata Mmụọ nke ndị a na nke Pita na ndị ya.
theological_decisions:
- issue: Mmekọrịta dị n’etiti nnata Mmụọ Nsọ na baptizim mmiri
  choice: E kwuru na ndị a anatala Mmụọ Nsọ tupu Pita ekwuo na a gaghị egbochi baptizim mmiri ha.
  alternative: Ịsụgharị ya n’ụzọ ga-ekpuchi na nnata Mmụọ buru baptizim ụzọ n’akụkọ a.
  rationale: 'Usoro na arụmụka Grik doro anya: nnata Mmụọ emeela, nke a bụkwa ihe Pita ji kwado baptizim mmiri ha. Nsụgharị ahụ anaghị etinye ozizi otu ụka pụrụ iche.'
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke oge a, dị mfe nghọta ma nwee ugwu. E jiri ajụjụ nkwuwa okwu mee ka atụmanya azịza na-adịghị mma nke Μήτι pụta ìhè; e zere tag question n’ihi na Igbo anaghị achọ ya ebe a.
