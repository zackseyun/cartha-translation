  yaml_path: translation/nt/acts/010/013.yaml
  text: 'And a voice came to him: “Get up[a], Peter; kill and eat.”'
translation:
  language: ig
  text: Otu olu wee sị ya, “Bilie, Pita; gbuo[a] rie.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “chụọ àjà rie.” Ngwaa a sụgharịrị “gbuo” nwekwara ike ịpụta “chụọ àjà”; ma n’ọhụụ a, o yikarịrị ka ọ na-ekwu maka igbu anụ iji rie ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: wee
  rationale: N’ebe a, γίνομαι na-ewebata ihe mere n’usoro akụkọ. ‘Wee’ na-eme ka ọbịbịa olu ahụ pụta n’Igbo dị mfe ma bụrụ nke nkịtị.
- source_word: φωνὴ
  choice: otu olu
  rationale: N’ọhụụ a, φωνή bụ olu na-ekwu okwu, ọ bụghị naanị ụda; ‘otu olu’ na-edokwa enweghị edemede aha ahụ n’ụzọ dabara n’Igbo.
- source_word: πρὸς αὐτόν
  choice: sị ya
  rationale: Mgbe πρός na-egosi onye a na-agwa okwu, ‘sị ya’ bụ ụzọ Igbo si ekwu ya nke ọma, ma jikọta ntụziaka okwu ahụ na olu ahụ.
- source_word: Ἀναστάς
  choice: Bilie
  rationale: Aorist participle a na-arụ ọrụ dịka iwu tupu iwu ndị na-esote; ‘Bilie’ bụ iwu doro anya, dịkwa nkenke.
- source_word: Πέτρε
  choice: Pita
  rationale: Nke a bụ ụdị vocative nke Πέτρος; ‘Pita’ bụ nsụgharị aha a a na-ejikarị eme ihe n’Igbo.
- source_word: θῦσον
  choice: gbuo
  rationale: N’ọhụụ gbasara anụmanụ na iri nri, ‘gbuo’ na-egosi igbu anụ iji rie ya n’enweghị ịmanye echiche àjà n’ahịrị bụ isi. A hapụrụ ihe ọzọ okwu ahụ nwere ike ịpụta n’okpuru peeji.
- source_word: φάγε
  choice: rie
  rationale: Nke a bụ iwu kpọmkwem sitere na ἐσθίω; ‘rie’ bụ ntụgharị Igbo dị mfe ma zie ezi.
- source_word: καὶ
  choice: wee / rie
  rationale: καί mbụ na-aga n’ihu n’usoro akụkọ, nke ‘wee’ gosiri; nke abụọ jikọtara iwu abụọ ahụ, nke usoro ngwaa ‘gbuo rie’ na-egosi n’Igbo n’enweghị njikọ siri ike.
theological_decisions:
- issue: Ma a ga-eji okwu àjà sụgharịa θῦσον
  choice: E jiri ‘gbuo’ mee ihe n’ahịrị bụ isi.
  alternative: ‘chụọ àjà’ ma ọ bụ ‘gbuo dịka àjà’
  rationale: Ihe gbara amaokwu ahụ gburugburu bụ ọhụụ Pita banyere anụmanụ na iri nri, ọ bụghị iwu ka o mee emume àjà. Ma ebe θύω nwekwara ike ịpụta ịchụ àjà, e debere ohere ahụ n’okpuru peeji ka a ghara ihichapụ mgbagwoju okwu Grik ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. ‘Otu olu wee sị ya’ bụ usoro akụkọ nkịtị; iwu ndị ahụ dị nkenke ma sie ike dịka n’asụsụ Grik. Akara [a] dị ozugbo n’azụ okwu ọ na-akọwa.
