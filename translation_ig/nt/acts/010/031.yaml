id: ACT.10.31
reference: Acts 10:31
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ φησί· Κορνήλιε, εἰσηκούσθη σου ἡ προσευχὴ καὶ αἱ ἐλεημοσύναι σου ἐμνήσθησαν ἐνώπιον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/031.yaml
  text: And he said[a], ‘Cornelius, your prayer has been heard, and your alms have been remembered before God.’
translation:
  language: ig
  text: O wee sị, “Kọniliọs, a nụwo ekpere gị, echetakwara ọrụ ebere gị n’ihu Chineke.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φησί
  choice: O wee sị
  rationale: Ọ bụ historical present n’asụsụ Grik, ma n’akụkọ Igbo, ‘O wee sị’ na-egosi ihe mere n’oge gara aga n’ụzọ dị ndụ ma dịkwa eke.
- source_word: Κορνήλιε
  choice: Kọniliọs
  rationale: E degharịrị aha ahụ ka ụda ya kwekọọ n’usoro odide Igbo.
- source_word: εἰσηκούσθη
  choice: a nụwo
  rationale: Nke a na-edobe passive ahụ ma na-egosi na ekpere ahụ enwetala ntị, ya bụ, a nụla ya.
- source_word: ἡ προσευχὴ
  choice: ekpere gị
  rationale: ‘Ekpere’ bụ okwu Igbo a na-ejikarị akọwa προσευχή; a debere singular nke Grik.
- source_word: αἱ ἐλεημοσύναι
  choice: ọrụ ebere gị
  rationale: Ọ na-agụnye onyinye ma ọ bụ omume ebere e mere maka ndị nọ ná mkpa; ‘ọrụ ebere’ bụ okwu Igbo doro anya ma ghara ime ka ọ bụrụ naanị ego.
- source_word: ἐμνήσθησαν
  choice: echetakwara
  rationale: Nke a na-edobe asụsụ ncheta nke ihe odide ahụ, kama ịkọwa ya nanị dị ka Chineke hụrụ ma ọ bụ mara.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: n’ihu Chineke
  rationale: Nke a bụ ntụgharị Igbo dị nkenke ma kwekọọ n’idiom Grik nke na-egosi ọnụnọ na nlebara anya Chineke.
theological_decisions:
- issue: Ihe ọrụ ebere Kọniliọs pụtara
  choice: ọrụ ebere
  alternative: onyinye ebere
  rationale: Ihe odide ahụ na-ekwu maka omume ma ọ bụ onyinye ebere nye ndị nọ ná mkpa, ma ọ naghị akọwa ya dị ka ihe e ji enweta nzọpụta ma ọ bụ ụgwọ ọrụ ruru mmadụ.
- issue: Asụsụ banyere icheta n’ihu Chineke
  choice: echetakwara ọrụ ebere gị n’ihu Chineke
  alternative: Chineke ahụla ọrụ ebere gị
  rationale: E debere okwu ‘icheta’ nke Grik n’ihi ibu ọ na-ebu n’asụsụ Akwụkwọ Nsọ, na-enweghị ịgbakwunye nkọwa gbasara otú nzọpụta si arụ ọrụ.
translation_notes:
  register: 'Asụsụ Igbo ọkọlọtọ, dị ùgwù ma dị mfe nghọta. A họọrọ ‘ọrụ ebere’ karịa okwu mgbazinye ma ọ bụ okwu ga-egosi naanị inye ego; ahịrịokwu ahụ na-edobe nhazi abụọ nke Grik: a nụwo ekpere, echetakwara ọrụ ebere.'
