id: ACT.10.5
reference: Acts 10:5
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ νῦν πέμψον ⸂ἄνδρας εἰς Ἰόππην⸃ καὶ μετάπεμψαι Σίμωνά ⸂τινα ὃς ἐπικαλεῖται Πέτρος⸃·
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/005.yaml
  text: And now send men to Joppa and summon a certain Simon who is called Peter[a].
translation:
  language: ig
  text: Ugbu a, zipụ ndị ikom gaa Jọpa, zitekwa ka a kpọta otu nwoke aha ya bụ Saịmọn, onye a na-akpọ Pita.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “zite ka a kpọọ otu nwoke aha ya bụ Saịmọn, onye a maara dị ka Pita.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ νῦν
  choice: Ugbu a
  rationale: Nke a na-egosi mgbanwe gaa n’iwu a ga-eme ozugbo. N’Igbo, “Ugbu a” na-aga nke ọma n’okwu a; ịtinye “na” n’isi ahịrịokwu agaghị abụ ihe dị ezigbo eke.
- source_word: πέμψον
  choice: zipụ
  rationale: Ọ bụ iwu e nyere otu onye ka o ziga ndị ọzọ; “zipụ” bụ okwu Igbo doro anya ma bụrụkwa nke a na-ejikarị eme ihe.
- source_word: ἄνδρας
  choice: ndị ikom
  rationale: ἀνήρ bụ kpọmkwem ndị nwoke n’ebe a, ọ bụghị nanị ndị mmadụ n’ozuzu ma ọ bụ ‘ndị ozi,’ nke ga-agbakwụnye nkọwa na-adịghị n’isi mmalite.
- source_word: εἰς Ἰόππην
  choice: gaa Jọpa
  rationale: Nke a na-enye ntụziaka ebe a ga-aga n’Igbo eke. “Jọpa” bụ nsụgharị ụda aha obodo ahụ.
- source_word: μετάπεμψαι
  choice: zitekwa ka a kpọta
  rationale: Okwu Grik ahụ pụtara iziga mmadụ ka ọ gaa kpọọ onye ọzọ bịa. Nhọrọ a na-egosipụta nzube ahụ n’Igbo nke ọma n’etinyeghị echiche nke ịmanye ya.
- source_word: Σίμωνά τινα
  choice: otu nwoke aha ya bụ Saịmọn
  rationale: τινα na-ewebata onye a maara kpọmkwem ma onye a ka na-akọwa. Okwu a dị eke karịa ịsị ‘otu Saịmọn’ n’Igbo.
- source_word: ὃς ἐπικαλεῖται Πέτρος
  choice: onye a na-akpọ Pita
  rationale: Nke a na-echekwa echiche nke aha ọzọ ndị mmadụ ji akpọ Saịmọn, n’enweghị ịkọwa ya dị ka aha nna ma ọ bụ utu aha.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị ugwu ma dị mfe nghọta. E ji usoro okwu eke mee ka iwu abụọ ahụ doo anya, ebe e chekwara nkọwa kpọmkwem nke ndị e zigara dịka ndị ikom. Akara ndetu [a] dị n’isi ederede.
