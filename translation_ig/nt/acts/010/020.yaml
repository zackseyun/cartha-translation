  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀλλὰ ἀναστὰς κατάβηθι καὶ πορεύου σὺν αὐτοῖς μηδὲν διακρινόμενος, ⸀ὅτι ἐγὼ ἀπέσταλκα αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/020.yaml
  text: But get up[a], go down, and go with them, doubting nothing, because I have sent them.
translation:
  language: ig
  text: Kama bilie, rịdata, soro ha gaa n’enweghị obi abụọ ọ bụla,[a] n’ihi na ọ bụ m zitere ha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’emeghị ọdịiche ọ bụla.” Participle Grik a nwere ike ịpụta ịghara inwe obi abụọ ma ọ bụ ịla azụ, ma ọ bụ ịghara ime ọdịiche; nghọta nke abụọ nwere ike ịdaba n’isiokwu isiakwụkwọ a banyere ndị Juu na ndị mba ọzọ.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλὰ
  choice: Kama
  rationale: Ọ na-egosi ntụgharị site ná mgbagwoju anya Pita gaa n’ihe ọ ga-eme ozugbo.
- source_word: ἀναστὰς
  choice: bilie
  rationale: Ọ bụ participle aorist nke na-arụ ọrụ dịka iwu, ma ‘bilie’ bụ Igbo doro anya ma dịkwa nkenke.
- source_word: κατάβηθι
  choice: rịdata
  rationale: Ọ na-echekwa ngagharị ịdata site n’elu ụlọ ebe Pita nọ.
- source_word: πορεύου σὺν αὐτοῖς
  choice: soro ha gaa
  rationale: Nke a bụ ụzọ Igbo si ekwu iso mmadụ jee n’ụzọ n'ụzọ ebumpụta ụwa.
- source_word: μηδὲν διακρινόμενος
  choice: n’enweghị obi abụọ ọ bụla
  rationale: N’ọnọdụ akụkọ dị nso, ọ na-akọwa ka Pita ghara inwe obi abụọ ma ọ bụ laa azụ; ma a na-edebe nghọta ọzọ n’ala peeji.
- source_word: ὅτι
  choice: n’ihi na
  rationale: Ọ na-egosi ihe kpatara Pita ji kwesị irube isi.
- source_word: ἐγὼ ἀπέσταλκα αὐτούς
  choice: ọ bụ m zitere ha
  rationale: Usoro ‘ọ bụ m’ na-egosipụta nkwusi ike dị na nnọchiaha ἐγώ; ‘zitere’ na-ekwupụta omume e mezuru nke nsonaazụ ya ka dị ugbu a.
theological_decisions:
- issue: Ihe μηδὲν διακρινόμενος pụtara gbasara ịnabata ndị mba ọzọ
  choice: n’enweghị obi abụọ ọ bụla
  alternative: n’emeghị ọdịiche ọ bụla
  rationale: Ihe gbara okwu ahụ gburugburu ozugbo na-elekwasị anya ná mgbagwoju anya Pita na iwu Mmụọ nyere ya ka o soro ndị ahụ. Ma isiokwu nke ndị Juu na ndị mba ọzọ n’isi nke a na-eme ka ‘n’emeghị ọdịiche’ bụrụkwa nghọta kwesịrị ekwesị; ya mere a naghị ehichapụ mgbagwoju ihe okwu Grik ahụ nwere.
translation_notes:
  register: Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E ji ‘rịdata’ na ‘soro ha gaa’ mee ka usoro iwu ahụ bụrụ nke e ji ọnụ ekwu n'ụzọ ebumpụta ụwa, ebe ala peeji na-echekwa nghọta abụọ nke διακρινόμενος.
