  text: Ἔτι λαλοῦντος τοῦ Πέτρου τὰ ῥήματα ταῦτα ἐπέπεσε τὸ πνεῦμα τὸ ἅγιον ἐπὶ πάντας τοὺς ἀκούοντας τὸν λόγον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/044.yaml
  text: While Peter was still speaking these words[a], the Holy Spirit fell upon all those hearing the word.
translation:
  language: ig
  text: Mgbe Pita ka na-ekwu okwu ndị a, Mmụọ Nsọ dakwasịrị ndị niile na-ege okwu ahụ ntị.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ịsụ ya: “Mmụọ Nsọ bịakwasịrị ndị niile na-ege okwu ahụ ntị.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔτι λαλοῦντος τοῦ Πέτρου
  choice: Mgbe Pita ka na-ekwu
  rationale: 'Nkebiokwu a na-egosi na omume abụọ ahụ mere n''otu oge: Pita akwụsịbeghị ikwu okwu mgbe Mmụọ Nsọ dakwasịrị ha.'
- source_word: τὰ ῥήματα ταῦτα
  choice: okwu ndị a
  rationale: ῥήματα n'ebe a bụ okwu Pita nọ na-ekwu; nsụgharị a dị nso n'okwu Grik ma bụrụkwa Igbo a na-aghọta nke ọma.
- source_word: ἐπέπεσε
  choice: dakwasịrị
  rationale: Okwu a na-echekwa ike na ihe oyiyi dị na ἐπιπίπτω, nke pụtara 'ịdakwasị,' kama ịkọwa ihe ahụ n'ụzọ otu ozizi pụrụ iche.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: Mmụọ Nsọ
  rationale: Nke a bụ aha Igbo ọkọlọtọ, doro anya, maka Holy Spirit.
- source_word: ἐπὶ πάντας τοὺς ἀκούοντας
  choice: ndị niile na-ege ... ntị
  rationale: Ọ na-egosi mmadụ niile nọ n'ebe ahụ na-ege ntị n'oge ahụ, ma na-asụ ya n'Igbo eke.
- source_word: τὸν λόγον
  choice: okwu ahụ
  rationale: Nke a na-echekwa njikọ okwu λόγος na 'okwu' ma n'ebe a na-ezo aka n'ozi Pita na-ekwusa.
theological_decisions:
- issue: Otu e si sụgharịa omume Mmụọ Nsọ na ἐπέπεσε
  choice: Mmụọ Nsọ dakwasịrị
  alternative: Mmụọ Nsọ bịakwasịrị
  rationale: “Dakwasịrị” na-echekwa okwu Luk nke nwere ike na ihe oyiyi, n'etinyeghị nkọwa otu ụka banyere baptizim nke Mmụọ Nsọ.
- issue: Ihe λόγος pụtara n'okwu nkwusa a
  choice: okwu ahụ
  alternative: ozi ahụ
  rationale: “Okwu ahụ” dị nso na Grik ma ka nwere ike izo aka n'ozi Pita na-ekwusa; “ozi ahụ” bụ nkọwa ọzọ eke n'Igbo.
translation_notes:
  register: Ejiri Igbo ọkọlọtọ nke oge a, dị mfe nghọta ma nwee nsọpụrụ. “Ka na-ekwu” na-echekwa omume na-aga n'ihu; “dakwasịrị” na-echekwa ịdị ndụ nke ngwaa Grik. Akara nkọwa ụkwụ [a] dị n'isiokwu.
