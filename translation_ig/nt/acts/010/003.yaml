  text: εἶδεν ἐν ὁράματι φανερῶς ὡσεὶ ⸀περὶ ὥραν ἐνάτην τῆς ἡμέρας ἄγγελον τοῦ θεοῦ εἰσελθόντα πρὸς αὐτὸν καὶ εἰπόντα αὐτῷ· Κορνήλιε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/003.yaml
  text: He saw clearly in a vision[a], about the ninth hour of the day, an angel of God coming in to him and saying to him[b], “Cornelius.”
translation:
  language: ig
  text: Ọ hụrụ n’ọhụụ n’ụzọ doro anya, n’ihe dị ka awa nke itoolu nke ụbọchị[a], mmụọ ozi Chineke ka ọ banyere n’ebe ọ nọ, na-asị ya[b], “Kọniliọs.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ya bụ, ihe dị ka elekere atọ n’ehihie n’usoro agụta oge nke ugbu a.
    reason: cultural_note
  - marker: b
    text: A pụkwara ịsụ ya, “n’ụzọ pụtara ìhè.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶδεν
  choice: ọ hụrụ
  rationale: Okwu a bụ ngwaa akụkọ mere n’oge gara aga; “ọ hụrụ” na-egosipụta ịhụ ahụ n’ụzọ kwụ ọtọ ma dabara n’ọhụụ ahụ.
- source_word: ἐν ὁράματι
  choice: n’ọhụụ
  rationale: “Ọhụụ” bụ okwu Igbo doro anya maka ihe Chineke ma ọ bụ ihe karịrị mmadụ na-eme ka mmadụ hụ, n’ebughị ụzọ kọwaa ụdị ọnọdụ uche ọ nọ na ya.
- source_word: φανερῶς
  choice: n’ụzọ doro anya
  rationale: Nke a na-egosi na ọhụụ ahụ pụtara ìhè, ọ bụghị ihe na-edochaghị anya.
- source_word: ὡσεὶ περὶ ὥραν ἐνάτην τῆς ἡμέρας
  choice: ihe dị ka awa nke itoolu n’ụbọchị
  rationale: E debere usoro oge nke ederede Gris, ebe “ihe dị ka” na-anọchi ὡσεὶ περὶ; nkọwa ala peeji na-enye oge ya n’usoro oge nke oge a.
- source_word: ἄγγελον τοῦ θεοῦ
  choice: mmụọ ozi Chineke
  rationale: N’ọnọdụ ọhụụ a, ἄγγελος bụ onye ozi si n’eluigwe, ya mere “mmụọ ozi Chineke” bụ ntụgharị Igbo kwesịrị ekwesị.
- source_word: εἰσελθόντα πρὸς αὐτὸν
  choice: ka ọ na-abata n’ebe ọ nọ
  rationale: Nke a na-echekwa echiche nke mmụọ ozi ahụ ịbanye n’ebe Kọniliọs nọ, ma na-ada ka Igbo a na-asụ ugbu a.
- source_word: καὶ εἰπόντα αὐτῷ
  choice: ma na-asị ya
  rationale: 'Ụdị a na-echekwa njikọ participle abụọ ahụ: ọ na-abata ma na-agwa ya okwu.'
- source_word: Κορνήλιε
  choice: Kọniliọs
  rationale: Nke a bụ nsụgharị aha Κορνήλιος n’ụdị a na-aghọta nke ọma n’Igbo; ọnọdụ ịkpọ mmadụ aha pụtara site n’okwu ahụ kpọmkwem.
theological_decisions:
- issue: Ụdị onye ἄγγελος na-ezo aka na ya
  choice: mmụọ ozi si n’aka Chineke
  alternative: onye ozi mmadụ nke Chineke zitere
  rationale: Ọnọdụ ahụ bụ ọhụụ, a kpọkwara ya kpọmkwem “mmụọ ozi Chineke”; nke a na-akwado na ọ bụ onye ozi si n’eluigwe, n’etinyeghị nkọwa ozizi ọzọ n’ime ederede.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E bugara nkebi oge ahụ n’isi ahịrịokwu ka akara nkọwa ala peeji [a] buru ụzọ pụta tupu [b], n’agbanweghị ihe ederede Gris pụtara. E debere “awa nke itoolu” n’ahịrị bụ isi maka iguzosi ike n’usoro oge nke isi mmalite.
