  yaml_path: translation/nt/acts/010/006.yaml
  text: He is lodging with a certain Simon[a], a tanner, whose house is by the sea.
translation:
  language: ig
  text: Ọ na-anọ dị ka ọbịa n’ụlọ otu nwoke aha ya bụ Saịmọn[a], onye na-edozi akpụkpọ anụ; ụlọ nwoke ahụ dị n’akụkụ oke osimiri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Ọ na-anọ n’ụlọ otu nwoke aha ya bụ Saịmọn, onye na-edozi akpụkpọ anụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ξενίζεται
  choice: Ọ na-anọ dị ka ọbịa
  rationale: Okwu a na-egosi na a nabatara ya ka ọ nọrọ dị ka ọbịa; nsụgharị a na-edobe echiche ahụ karịa nanị ‘ọ na-anọ.’
- source_word: παρά τινι
  choice: n’ụlọ otu nwoke aha ya bụ
  rationale: παρά ya na dative na-egosi ịnọnyere mmadụ ma ọ bụ n’ebe onye ahụ bi, ebe τις na-ahapụ onye ahụ n’amaghị ama; nkebi a bụ Igbo doro anya ma dịkwa eke.
- source_word: Σίμωνι
  choice: Saịmọn
  rationale: E dere aha onye ahụ n’ụdị a na-ejikarị ede Simon n’Igbo.
- source_word: βυρσεῖ
  choice: onye na-esiji akpụkpọ anụ
  rationale: βυρσεύς bụ onye na-edozi akpụkpọ anụ anụmanụ ka ọ ghọọ akpụkpọ e ji arụ ihe; nkọwa a ziri ezi ma ndị na-agụ Igbo ga-aghọta ya ngwa ngwa.
- source_word: ᾧ ἐστιν οἰκία
  choice: ụlọ ya dị
  rationale: Nke a na-egosi na ọ bụ Saịmọn nwe ụlọ ahụ ma na-ejikọta okwu ahụ n’ụzọ Igbo dị mfe ma bụrụ nke eke.
- source_word: παρὰ θάλασσαν
  choice: n’akụkụ oke osimiri
  rationale: παρά ya na accusative ebe a na-egosi ịdị nso n’akụkụ mmiri; ‘n’akụkụ oke osimiri’ na-edobe ihe okwu Grik pụtara.
- source_word: οὗτος
  choice: Ọ
  rationale: N’ọnọdụ okwu a, οὗτος na-atụ aka n’ebe Pita nọ; nnọchiaha ‘Ọ’ bụ ụzọ Igbo kachasị eke isi gaa n’ihu n’enweghị itinye aha na-adịghị na amaokwu ahụ.
