review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys Peter’s hosted stay with Simon and the location of Simon’s house near the sea. However, “onye na-esiji akpụkpọ anụ” normally suggests someone who dyes hides/skin, whereas βυρσεύς specifically denotes one who processes/tans hides.
  naturalness: The sentence is clear Standard Igbo. Replacing the occupational expression with “onye na-edozi akpụkpọ anụ” is more idiomatic and semantically precise in this context. “Ụlọ nwoke ahụ” clearly links the final clause back to Simon.
  terminology: Saịmọn is appropriate. “Onye na-edozi akpụkpọ anụ” suitably renders “tanner” without introducing unnecessary technical wording.
  issues:
  - severity: medium
    issue: The rendering of βυρσεῖ is too narrow/inexact.
    rationale: “Na-esiji akpụkpọ anụ” primarily means dyeing leather/hides. A tanner processes hides into leather; “na-edozi akpụkpọ anụ” better represents the occupation.
  revised_text: Ọ na-anọ dị ka ọbịa n’ụlọ otu nwoke aha ya bụ Saịmọn[a], onye na-edozi akpụkpọ anụ; ụlọ nwoke ahụ dị n’akụkụ oke osimiri.
