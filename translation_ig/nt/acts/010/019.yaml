  text: τοῦ δὲ Πέτρου διενθυμουμένου περὶ τοῦ ὁράματος εἶπεν ⸂αὐτῷ τὸ πνεῦμα⸃· Ἰδοὺ ⸀ἄνδρες ⸀ζητοῦντές σε·
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/019.yaml
  text: While Peter was still pondering the vision, the Spirit said to him, “Look, men are seeking you.”
translation:
  language: ig
  text: Mgbe Pita nọ na-atụgharị uche banyere ọhụụ ahụ, Mmụọ ahụ gwara ya, sị, “Lee, ndị ikom na-achọ gị[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “na-achọ ịchọta gị.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διενθυμουμένου
  choice: ka nọ na-atụgharị uche
  rationale: Nke a na-egosi na Pita nọgidere na-echebara ihe ahụ echiche nke ọma; usoro ‘ka nọ na-’ na-egosipụta omume na-aga n’ihu n’ụzọ Igbo si ekwu ya.
- source_word: περὶ τοῦ ὁράματος
  choice: banyere ọhụụ ahụ
  rationale: ‘Banyere’ na-edobe njikọ περὶ n'ụzọ doro anya ma bụrụkwa Igbo nkịtị.
- source_word: τὸ πνεῦμα
  choice: Mmụọ Nsọ
  rationale: N’agbanyeghị na ἅγιον adịghị n’amaokwu a, ihe gbara ya gburugburu n’Ọrụ Ndị Ozi 10 na-egosi na onye na-ekwu okwu bụ Mmụọ Nsọ; Igbo chọrọ nkọwa a iji zere ka ‘mmụọ’ pụta dị ka mmụọ a na-akọwaghị.
- source_word: εἶπεν αὐτῷ
  choice: gwara ya, sị
  rationale: Nke a bụ usoro Igbo dị ndụ ma kwekọọ na ‘ọ gwara ya/ọ sịrị ya.’
- source_word: Ἰδοὺ
  choice: Lee
  rationale: ‘Lee’ bụ okwu Igbo dị nkenke nke na-adọta uche, na-enweghị ịdị ochie ma ọ bụ ịdị arọ karịa ihe Grik kwuru.
- source_word: ἄνδρες
  choice: ndị ikom
  rationale: ἀνήρ na-ezo aka kpọmkwem n’ụmụ nwoke toro eto, ya mere a naghị eme ya okwu na-anọchi mmadụ niile.
- source_word: ζητοῦντές σε
  choice: na-achọ gị
  rationale: ‘Na-achọ gị’ nwere ike ịpụta ịchọ ma ọ bụ ilegharị anya iji chọta mmadụ, ma na-ada ezigbo mma n’Igbo.
theological_decisions:
- issue: Onye τὸ πνεῦμα na-ezo aka na ya
  choice: Mmụọ Nsọ
  alternative: Mmụọ ahụ; mmụọ
  rationale: N’akụkọ Ọrụ Ndị Ozi 10, ọ bụ Mmụọ Chineke na-eduzi Pita. Ịsị ‘Mmụọ Nsọ’ na-eme ka onye a na-ekwu maka ya doo anya n’Igbo, ma ọ naghị atụgharị ya ka ọ bụrụ naanị mkpali dị n’obi.
- issue: Ịsụgharị ἄνδρες n’ihe gbasara okike
  choice: ndị ikom
  alternative: ndị mmadụ; ndị ọbịa
  rationale: Okwu Grik ahụ kpọmkwem bụ maka ụmụ nwoke toro eto; nsụgharị ahụ na-edobe nkọwa a.
translation_notes:
  register: Igbo Ọkọlọtọ nke oge a, dị ùgwù ma dị mfe nghọta. ‘Lee’ na-arụ ọrụ dị ka okwu ịdọta uche; ‘ka nọ na-atụgharị uche’ na-egosipụta echiche miri emi na-aga n’ihu.
