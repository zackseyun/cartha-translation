  text: πέμψον οὖν εἰς Ἰόππην καὶ μετακάλεσαι Σίμωνα ὃς ἐπικαλεῖται Πέτρος· οὗτος ξενίζεται ἐν οἰκίᾳ Σίμωνος βυρσέως παρὰ ⸀θάλασσαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/032.yaml
  text: Therefore send to Joppa and summon Simon[a], who is called Peter. He is lodging in the house of Simon, a tanner[b], by the sea.
translation:
  language: ig
  text: Ya mere, ziga ndị mmadụ na Jọpa ka a kpọta Saịmọn[a], onye a na-akpọ Pita. Ọ na-anọ n’ụlọ Saịmọn, onye na-azụ akpụkpọ anụ[b], dịka ọbịa, n’akụkụ oke osimiri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “ziga ka a kpọọ Saịmọn.” Okwu Grik ahụ pụtara ime ka a kpọọ mmadụ ka ọ bịakwute onye na-akpọ ya.
    reason: lexical_alternative
  - marker: b
    text: Nke a bụ onye ọrụ ya bụ ịkwadebe ma dozie akpụkpọ anụ anụmanụ.
    reason: cultural_clarification
lexical_decisions:
- source_word: πέμψον οὖν εἰς Ἰόππην
  choice: Ya mere, ziga ozi na Jọpa
  rationale: A na-edobe njikọ nkwubi okwu nke οὖν site na “Ya mere,” ebe “ziga ozi na Jọpa” na-egosi iwu iziga ndị ozi n’ebe ahụ n’Igbo dị mfe.
- source_word: μετακάλεσαι
  choice: ka a kpọta
  rationale: Okwu a pụtara ime ka a kpọọ mmadụ ka ọ bịakwute onye na-akpọ ya; “ka a kpọta” na-eburu echiche ahụ nke ọma n’enweghị ụda iwu ọchịchị siri ike.
- source_word: Σίμωνα ὃς ἐπικαλεῖται Πέτρος
  choice: Saịmọn, onye a na-akpọ Pita
  rationale: Nke a na-egosi aha ọzọ e ji mara Saịmọn, ma na-anọkwa nso n’usoro na nghọta Grik.
- source_word: ξενίζεται
  choice: Ọ bụ ọbịa
  rationale: Ụdị okwu Grik a na-egosi na a na-anabata Pita dị ka ọbịa, ọ bụghị naanị na ọ nọ n’ebe ahụ.
- source_word: ἐν οἰκίᾳ Σίμωνος βυρσέως
  choice: n’ụlọ Saịmọn, onye na-edozi akpụkpọ anụ
  rationale: A na-edobe ma ụlọ onye ahụ, aha ya, na ọrụ βυρσεύς. “Onye na-edozi akpụkpọ anụ” bụ nkọwa ọrụ a ga-aghọta n’Igbo nke oge a.
- source_word: παρὰ θάλασσαν
  choice: n’akụkụ osimiri
  rationale: N’Igbo, “osimiri” nwere ike ịpụta nnukwu mmiri/oke osimiri dịka ọnọdụ si dị; okwu a na-egosi na ụlọ ahụ dị n’akụkụ mmiri ahụ.
