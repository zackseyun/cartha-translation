translation_notes:
  register: Asụsụ Igbo zuru ụwa ọnụ, dị ùgwù ma dị mfe nghọta. E ji “Ọ bụ ọbịa” mee ka echiche ξενίζεται banyere nnabata ọbịa pụta ìhè; a zere okwu ụka pụrụ iche.
