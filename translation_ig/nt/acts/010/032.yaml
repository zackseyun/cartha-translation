review_pass:
  verdict: revise
  source_fidelity: The draft preserves the inferential force of οὖν, Joppa, Simon/Peter, and the location by the sea. However, “ziga ozi” normally means “send a message/word,” whereas πέμψον in this context directs Cornelius to send persons. “Ọ bụ ọbịa” identifies Peter as a visitor but does not clearly express the ongoing lodging/hospitality denoted by ξενίζεται. “Oke osimiri” removes the potentially unintended river sense of osimiri alone.
  naturalness: The revision uses idiomatic Standard Igbo while retaining a formal biblical register. “Ọ na-anọ ... dịka ọbịa” naturally conveys that Peter is staying as a guest.
  terminology: “Onye na-azụ akpụkpọ anụ” is the established Standard Igbo expression for a tanner. The explanatory note accurately specifies processing animal hides and does not add interpretive content.
  issues:
  - severity: medium
    issue: “ziga ozi” can mean send a message rather than dispatch people.
    rationale: πέμψον has an unexpressed human object in context; the translation should not reduce the action to sending information.
  - severity: medium
    issue: “Ọ bụ ọbịa” is stative and underrepresents ξενίζεται.
    rationale: The Greek indicates that Peter is being accommodated/lodging as a guest at Simon’s house.
  - severity: low
    issue: “osimiri” without “oke” can be understood as a river.
    rationale: θάλασσαν specifically denotes the sea.
  revised_text: Ya mere, ziga ndị mmadụ na Jọpa ka a kpọta Saịmọn[a], onye a na-akpọ Pita. Ọ na-anọ n’ụlọ Saịmọn, onye na-azụ akpụkpọ anụ[b], dịka ọbịa, n’akụkụ oke osimiri.
  revised_footnotes:
