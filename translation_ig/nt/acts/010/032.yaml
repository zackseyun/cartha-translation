    reason: lexical_alternative
  - marker: b
    text: Nke a bụ onye ọrụ ya bụ ịkwadebe ma dozie akpụkpọ anụ anụmanụ.
    reason: cultural_clarification
  revision_rationale: The revised wording makes clear that people, rather than merely a message, are sent; renders Peter’s present lodging as a guest; uses the conventional Igbo designation for a tanner; and specifies the sea. The two anchors remain correctly placed and their notes match the terms they annotate.
