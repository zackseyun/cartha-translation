source:
  edition: SBLGNT
  text: καὶ ἐξέστησαν οἱ ἐκ περιτομῆς πιστοὶ ⸀ὅσοι συνῆλθαν τῷ Πέτρῳ, ὅτι καὶ ἐπὶ τὰ ἔθνη ἡ δωρεὰ τοῦ ⸂ἁγίου πνεύματος⸃ ἐκκέχυται·
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/045.yaml
  text: And the believers from the circumcision who had come with Peter were astonished[c][b][a], because the gift of the Holy Spirit had been poured out even on the Gentiles.
translation:
  language: ig
  text: Ndị kwere ekwe sitere ná ndị e biri úgwù[a], ndị so Pita bịa, juru anya, n’ihi na a wụsaala[c] onyinye nke Mmụọ Nsọ ọbụna[b] n’ahụ ndị mba ọzọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “ndị kwere ekwe e biri úgwù.” N’ụzọ nkịtị, okwu Grik bụ “ndị kwere ekwe sitere ná ibi úgwù.”
    reason: lexical_alternative
  - marker: b
    text: 'A pụkwara ịsị, “n’ahụ ndị mba ọzọ kwa.” Okwu Grik pụrụ igosi mgbakwunye, ma n’ebe a o yiri ka ọ na-eme ka ihe ijuanya pụta ìhè: “ọbụna n’ahụ ndị mba ọzọ.”'
    reason: lexical_alternative
  - marker: c
    text: A pụkwara ịsị, “a wụsawo.” Perfect Grik na-eme ka o doo anya na omume ahụ emezuola, nsonaazụ ya ka dịkwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξέστησαν
  choice: juru anya
  rationale: Nke a na-egosi oke ihe ijuanya n’Igbo dị ugbu a, na-enweghị iji okwu ga-ada ka mmadụ enweghịzi onwe ya.
- source_word: οἱ ἐκ περιτομῆς πιστοὶ
  choice: ndị kwere ekwe sitere ná ndị e biri úgwù
  rationale: Nke a na-edobe usoro okwu Grik nke na-akọwa ha dị ka ndị so n’òtù ndị e biri úgwù, ya bụ, ndị Juu kwere ekwe.
- source_word: ὅσοι συνῆλθαν τῷ Πέτρῳ
  choice: bụ́ ndị ha na Pita so bịa
  rationale: Nke a bụ ụzọ Igbo doro anya si egosi na ha so Pita bịa, ma na-akọwapụta ndị kwere ekwe a na-ekwu banyere ha.
- source_word: καὶ ἐπὶ τὰ ἔθνη
  choice: ọbụna n’ahụ ndị mba ọzọ
  rationale: N’ebe a καί na-eme ka ihe ijuanya pụta ìhè, ebe ἔθνη na-ezo aka ná ndị na-abụghị ndị Juu.
- source_word: ἡ δωρεὰ
  choice: onyinye
  rationale: ‘Onyinye’ na-egosi ihe e nyere n’efu n’ụzọ dị mfe ma bụrụkwa okwu Igbo nkịtị.
- source_word: τοῦ ἁγίου πνεύματος
  choice: nke Mmụọ Nsọ
  rationale: Nke a bụ nsụgharị kwụ ọtọ ma bụrụkwa okwu Ndị Kraịst Igbo dị iche iche na-aghọta.
- source_word: ἐκκέχυται
  choice: a wụkwasịla
  rationale: Ụdị ‘-la’ na-egosi na omume ahụ emezuola ma na nsonaazụ ya ka dị; ‘wụkwasị ... n’ahụ’ na-ada nke ọma n’Igbo maka ihe a wụsara n’elu mmadụ.
theological_decisions:
- issue: Ihe ἔθνη na-ezo aka na ya n’Akụkọ Ndị Ozi 10
  choice: ndị mba ọzọ
  alternative: mba dị iche iche
  rationale: Ihe dị iche n’ebe a bụ n’etiti ndị Juu kwere ekwe na ndị na-abụghị ndị Juu; ‘ndị mba ọzọ’ na-eme ka nke a doo anya.
- issue: Akụkụ oge na ọnọdụ nke ἐκκέχυται
  choice: a wụkwasịla
  alternative: a wụkwasịrị
  rationale: Perfect Grik na-egosi omume e mechara nke nsonaazụ ya ka dị. ‘A wụkwasịla’ na-edobe echiche abụọ ahụ n’Igbo.
- issue: Mmekọrịta genitive dị na τοῦ ἁγίου πνεύματος
  choice: onyinye nke Mmụọ Nsọ
  alternative: Mmụọ Nsọ bụ́ onyinye
  rationale: Usoro a na-edobe nhịahụ dị n’asụsụ Grik banyere ma Mmụọ Nsọ ọ bụ onyinye ahụ kpọmkwem, ma ọ bụ na ọ bụ onyinye sitere n’aka Mmụọ Nsọ, kama idozi ya n’otu ụzọ n’enweghị mkpa.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-edobe usoro echiche nke Grik, ma jiri njikọ na akpaalaokwu Igbo na-ada nke ọma. E tinyere akara nkọwa ụkwụ n’ebe okwu nke ọ bụla metụtara dị.
