revisions:
- from: Ndị kwere ekwe sitere ná ndị e biri úgwù[a], bụ́ ndị ha na Pita so bịa, juru anya, n’ihi na a wụkwasịla[c] onyinye nke Mmụọ Nsọ ọbụna[b] n’ahụ ndị mba ọzọ.
  to: Ndị kwere ekwe sitere ná ndị e biri úgwù[a], ndị so Pita bịa, juru anya, n’ihi na a wụsaala[c] onyinye nke Mmụọ Nsọ ọbụna[b] n’ahụ ndị mba ọzọ.
  rationale: The revision replaces “a wụkwasịla” with “a wụsaala” to render the source verb’s central imagery of pouring out more directly. It also streamlines the accompanying-believers clause. The word order, the emphatic sense of “ọbụna,” and the noncommittal genitive expression “onyinye nke Mmụọ Nsọ” are retained.
