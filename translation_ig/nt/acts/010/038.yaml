id: ACT.10.38
reference: Acts 10:38
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἰησοῦν τὸν ἀπὸ Ναζαρέθ, ὡς ἔχρισεν αὐτὸν ὁ θεὸς πνεύματι ἁγίῳ καὶ δυνάμει, ὃς διῆλθεν εὐεργετῶν καὶ ἰώμενος πάντας τοὺς καταδυναστευομένους ὑπὸ τοῦ διαβόλου, ὅτι ὁ θεὸς ἦν μετ’ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/038.yaml
  text: 'Jesus of Nazareth: how God anointed him with the Holy Spirit and with power[a]; he went about doing good and healing all who were oppressed by the devil[c][b], because God was with him.'
translation:
  language: ig
  text: 'Jizọs onye si Nazaret: otu Chineke si jiri Mmụọ Nsọ na ike tee ya mmanụ; ọ gagharịrị na-eme ihe ọma, na-agwọkwa ndị niile ekwensu na-emegbu, n’ihi na Chineke nọnyeere ya.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰησοῦν τὸν ἀπὸ Ναζαρέθ
  choice: Jizọs onye Nazaret
  rationale: Nke a bụ ụzọ Igbo dị mfe ma dị ebube isi kọwaa Jizọs site n’obodo ya; ọ na-egosikwa echiche ἀπό nke na-akọ ebe o si.
- source_word: ὡς
  choice: otu ... si
  rationale: N’usoro okwu a, ὡς na-ebute nkọwa banyere ihe Chineke mere Jizọs. “Otu ... si” na-enye echiche “how” n’Igbo n’enweghị ịtụgharị ya ka ọ bụrụ ntụnyere.
- source_word: ἔχρισεν
  choice: tee ya mmanụ
  rationale: Nke a na-edobe ihe χρίω pụtara kpọmkwem na njikọ ya na nhọpụta na inye ike, n’etinyeghị aha “Mezaịa” ebe ọ na-adịghị na amaokwu ahụ.
- source_word: πνεύματι ἁγίῳ καὶ δυνάμει
  choice: jiri Mmụọ Nsọ na ike
  rationale: “Jiri” na-egosipụta ọrụ dative nke ihe Chineke ji tee ya mmanụ. “Mmụọ Nsọ” na-ezo aka n’Onye nke Chineke, ebe “ike” ka dị iche dịka ihe odide Grik si gosi.
- source_word: διῆλθεν
  choice: ọ gagharịrị
  rationale: Okwu a na-egosi ije Jizọs site n’otu ebe ruo ebe ọzọ n’ọrụ ya; “gagharịrị” bụ Igbo nkịtị nke na-egosipụta njem ugboro ugboro.
- source_word: εὐεργετῶν
  choice: na-eme ihe ọma
  rationale: Nke a na-egosipụta ọrụ ọma na uru ọ na-abara ndị ọzọ n'ụzọ doro anya ma ghara ime ka ihe okwu ahụ pụtara dị warara.
- source_word: ἰώμενος
  choice: na-agwọkwa
  rationale: “Na-agwọ” bụ okwu Igbo kpọmkwem maka ịgwọ ọrịa; “-kwa” jikọtara ọrụ a na ime ihe ọma.
- source_word: πάντας τοὺς καταδυναστευομένους ὑπὸ τοῦ διαβόλου
  choice: ndị niile ekwensu na-emegbu
  rationale: “Na-emegbu” na-egosipụta ọchịchị ike na mmegbu na-aga n’ihu nke participle ahụ pụtara. “Ekwensu” bụ aha Igbo a na-ejikarị eme ihe maka διάβολος dịka onye ọjọọ ahụ.
- source_word: ὅτι ὁ θεὸς ἦν μετ’ αὐτοῦ
  choice: n’ihi na Chineke nọnyeere ya
  rationale: “N’ihi na” na-edobe ike causal nke ὅτι, ebe “nọnyeere ya” na-egosipụta na Chineke nọnyere Jizọs n’ọrụ ya.
theological_decisions:
- issue: Mmanụ e tere Jizọs na njikọ ya na onye ọ bụ na ozi ya
  choice: E debere okwu ahụ dịka “tee ya mmanụ.”
  alternative: Ịgbasa ya ka ọ bụrụ “họpụtara ya dịka Mezaịa” ma ọ bụ ime ka ọ bụrụ naanị “nyere ya ike.”
  rationale: Ihe odide ahụ kwuru na Chineke tere Jizọs mmanụ site na Mmụọ Nsọ na ike. Nsụgharị a na-edobe ụda metụtara Mezaịa na inye ike, ma ọ naghị atụkwasị nkọwa ozizi nke amaokwu ahụ ekwughị kpọmkwem.
- issue: Onye “Mmụọ Nsọ” na-ezo aka na ya
  choice: E ji “Mmụọ Nsọ” mee ihe dịka aha nke Mmụọ Chineke.
  alternative: Ịsụgharị ya dịka mmụọ dị nsọ na-abụghị onye, ma ọ bụ ijikọta ya na “ike” dịka otu ihe.
  rationale: N’Ọrụ Ndị Ozi, okwu a na-ezokarị aka na Mmụọ Nsọ. Amaokwu ahụ kpọkwara “Mmụọ Nsọ” na “ike” iche, ya mere e jikọtaghị ha ka ha bụrụ otu ike na-abụghị onye.
- issue: Ihe nkebi “n’ihi na Chineke nọnyeere ya” na-akọwa
  choice: E debere ya dịka ihe kpatara ọrụ ọma na ọgwụgwọ Jizọs ji nwee ike.
  alternative: Ime ka ọ bụrụ naanị okwu na-ekwu na Chineke nọ ya nso, ma ọ bụ iji ya kọwaa ọdịdị Jizọs karịa ihe amaokwu ahụ kwuru.
  rationale: ὅτι na-enye ihe kpatara ọrụ Jizọs. Nsụgharị ahụ na-edobe okwu a n’enweghị ibelata onye Jizọs bụ ma ọ bụ itinye nkọwa Kraịstọlọjị karịrị ihe amaokwu ahụ kwuru.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta mee ihe. Akara colon na semicolon na-eme ka usoro Grik dị mkpụmkpụ doo anya n’Igbo, ebe nnọchiaha “ọ” dochiri relative pronoun iji zere usoro ga-ada arọ. E jiri “Jizọs,” “Nazaret,” “Mmụọ Nsọ,” na “ekwensu” dịka mkpụrụokwu ndị a na-amata nke ọma n’Igbo.
