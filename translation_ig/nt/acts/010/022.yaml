  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οἱ δὲ εἶπαν· Κορνήλιος ἑκατοντάρχης, ἀνὴρ δίκαιος καὶ φοβούμενος τὸν θεὸν μαρτυρούμενός τε ὑπὸ ὅλου τοῦ ἔθνους τῶν Ἰουδαίων, ἐχρηματίσθη ὑπὸ ἀγγέλου ἁγίου μεταπέμψασθαί σε εἰς τὸν οἶκον αὐτοῦ καὶ ἀκοῦσαι ῥήματα παρὰ σοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/022.yaml
  text: They said[a], “Cornelius, a centurion, a righteous man and one who fears God, and who is well spoken of by the whole nation of the Jews[e][d][c][b], was divinely instructed by a holy angel to summon you to his house and to hear words from you.”
translation:
  language: ig
  text: Ha sịrị, “Kọniliọs, onyeisi agha nke narị ndị agha, bụ nwoke ezi omume, onye na-atụ egwu Chineke, onye agbụrụ ndị Juu dum na-agba ezi ama banyere ya.[a] Mmụọ ozi dị nsọ nyere ya ntụziaka sitere n’aka Chineke[b] ka ọ kpọọ gị ka ị bịa n’ụlọ ya,[c] ka o nụkwa okwu sitere n’aka gị.”[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “onye ndị Juu dum na-agba ezi ama banyere ya.” N’ebe a, “agbụrụ” na-atụ aka n’otu ndị mmadụ, ọ bụghị naanị obodo ndọrọ ndọrọ ọchịchị nke oge a.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsị, “natara ozi sitere n’aka Chineke” ma ọ bụ “Chineke dọrọ ya aka ná ntị.” Ngwaa Grik ahụ na-egosi nkwurịta okwu ma ọ bụ ntụziaka sitere n’aka Chineke.
    reason: lexical_alternative
  - marker: c
    text: A pụkwara ịsị, “ka o ziga ka a kpọọ gị bịa n’ụlọ ya” ma ọ bụ “ka o ziga kpọọ gị.”
    reason: lexical_alternative
  - marker: d
    text: N’ụzọ nkịtị, “ka o nụ okwu sitere n’aka gị.” A pụkwara ịsị, “ka o nụ ozi n’aka gị.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑκατοντάρχης
  choice: onyeisi ndị agha narị
  rationale: Ọ na-egosipụta ọkwa onyeisi agha Rom nke na-elekọta ihe dị ka ndị agha narị, n’asụsụ Igbo doro ndị mmadụ anya.
- source_word: ἀνὴρ δίκαιος
  choice: nwoke ezi omume
  rationale: Nke a na-echekwa echiche omume na nke okpukpe dị na δίκαιος n’enweghị itinye nkọwa ozizi ọzọ.
- source_word: φοβούμενος τὸν θεόν
  choice: onye na-atụ egwu Chineke
  rationale: Ọ na-echekwa ụdị okwu ngwaa na akpaalaokwu Akwụkwọ Nsọ, ma ọ naghị ekpebi kpọmkwem ọnọdụ Kọniliọs n’ọgbụgba ndụ.
- source_word: μαρτυρούμενος
  choice: na-agbakwa ama ọma banyere ya
  rationale: Ọ na-egosi na ndị ọzọ na-enye ya akaebe ọma, ya bụ, na o nwere aha ọma n’etiti ha.
- source_word: ὑπὸ ὅλου τοῦ ἔθνους τῶν Ἰουδαίων
  choice: onye mba ndị Juu niile
  rationale: A hapụrụ ‘mba’ iji gosipụta ἔθνος dị ka otu agbụrụ ma ọ bụ ndị mmadụ, ọ bụghị naanị obodo ndọrọ ndọrọ ọchịchị nke oge a.
- source_word: ἐχρηματίσθη
  choice: natara ntụziaka sitere n’aka Chineke
  rationale: N’ebe a ngwaa ahụ na-egosi ozi ma ọ bụ ntụziaka Chineke nyere, ọ bụghị naanị ịdọ aka ná ntị.
- source_word: ἀγγέλου ἁγίου
  choice: site n’ọnụ mmụọ ozi dị nsọ
  rationale: Ọ na-anọchi anya ma onye wetara ozi ahụ ma nkọwa ἁγίου nke kwuru na mmụọ ozi ahụ dị nsọ.
- source_word: μεταπέμψασθαί σε
  choice: ka o ziga kpọọ gị ka ị bịa
  rationale: ‘Ziga kpọọ’ na-egosipụta iziga mmadụ ka ọ kpọta onye ọzọ; ‘ka ị bịa’ na-eme ka ebumnuche ahụ doo anya n’Igbo nkịtị.
- source_word: εἰς τὸν οἶκον αὐτοῦ
  choice: n’ụlọ ya
  rationale: Nke a bụ ụzọ Igbo ebumpụta ụwa si egosi ebe a chọrọ ka Pita bịa.
- source_word: ἀκοῦσαι ῥήματα παρὰ σοῦ
  choice: wee nụ okwu n’ọnụ gị
  rationale: Ọ na-echekwa ‘okwu’ nke ῥήματα na echiche na okwu ahụ ga-esi n’ọnụ Pita pụta, n’enweghị ịkpọ ya okwuchukwu ma ọ bụ ozi pụrụ iche.
theological_decisions:
- issue: Otu e si kọwaa nsọpụrụ Kọniliọs nwere n’ebe Chineke nọ n’etinyeghị ozizi e mechara guzobe
  choice: nwoke ezi omume, onye na-atụ egwu Chineke
  alternative: nwoke ji ofufe Chineke kpọrọ ihe
  rationale: Nhọrọ ahụ na-echekwa otuto omume na nke okpukpe dị na Grik, ma ọ naghị ekpebi ma ọ bụ kọwaa ọnọdụ nzọpụta na ọgbụgba ndụ Kọniliọs karịa ihe amaokwu ahụ kwuru.
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E ji ‘onyeisi ndị agha narị’ kọwaa ọkwa ndị Rom karịa iji okwu mbịarambịa; e jikwa akpaalaokwu Akwụkwọ Nsọ ‘na-atụ egwu Chineke’ chekwaa ụda na nghọta isi mmalite.
