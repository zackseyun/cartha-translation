review_pass:
  verdict: revise
  source_fidelity: The draft conveys the verse’s principal content, including Cornelius’s military rank, moral character, reverence for God, favorable reputation among Jews, angelic instruction, summons, and hearing Peter’s words. However, “onye mba ndị Juu niile” is structurally incomplete and does not naturally convey the passive participle μαρτυρούμενος with its stated group. “site n’ọnụ mmụọ ozi” adds the idiom “from the mouth of,” which is not expressed in Greek and is unnecessary.
  naturalness: Several phrases are understandable but awkward in Standard Igbo, especially “onyeisi ndị agha narị,” “onye mba ndị Juu niile,” and “ka o ziga kpọọ gị ka ị bịa.” The revision uses more idiomatic, clear syntax while retaining the source’s sequence and sense.
  terminology: “nwoke ezi omume” and “onye na-atụ egwu Chineke” appropriately preserve the moral-religious description without adding doctrinal conclusions. “Onyeisi agha nke narị ndị agha” clearly renders centurion. “agbụrụ ndị Juu dum” represents ἔθνος as a people-group, not a modern state. “mmụọ ozi dị nsọ” preserves ἁγίου.
  issues:
  - severity: high
    issue: The phrase “onye mba ndị Juu niile na-agbakwa ama ọma banyere ya” is grammatically and semantically defective.
    rationale: It lacks a natural construction linking Cornelius to the favorable testimony of the whole Jewish people. The Greek μαρτυρούμενος requires that he be the one receiving favorable testimony.
  - severity: medium
    issue: “site n’ọnụ mmụọ ozi dị nsọ” adds an unneeded ‘mouth’ idiom.
    rationale: ὑπὸ ἀγγέλου ἁγίου means that the holy angel is the agent of the divine instruction; it does not mention the angel’s mouth. A direct agent construction is more precise and natural.
  - severity: medium
    issue: The summons clause “ka o ziga kpọọ gị ka ị bịa” is awkward.
    rationale: μεταπέμψασθαί σε is naturally expressed as calling or sending for someone. “ka ọ kpọọ gị ka ị bịa” is idiomatic and preserves the invitation/summons to his house.
  - severity: low
    issue: “onyeisi ndị agha narị” is not the clearest Standard Igbo rank expression.
    rationale: “onyeisi agha nke narị ndị agha” clearly states the sense of ἑκατοντάρχης without asserting an exact modern rank.
  revised_text: Ha sịrị, “Kọniliọs, onyeisi agha nke narị ndị agha, bụ nwoke ezi omume, onye na-atụ egwu Chineke, onye agbụrụ ndị Juu dum na-agba ezi ama banyere ya.[a] Mmụọ ozi dị nsọ nyere ya ntụziaka sitere n’aka Chineke[b] ka ọ kpọọ gị ka ị bịa n’ụlọ ya,[c] ka o nụkwa okwu sitere n’aka gị.”[d]
