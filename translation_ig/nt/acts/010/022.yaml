revisions:
- from: Ha sịrị, “Kọniliọs, onyeisi ndị agha narị, bụ nwoke ezi omume, onye na-atụ egwu Chineke, onye mba ndị Juu niile na-agbakwa ama ọma banyere ya,[a] natara ntụziaka sitere n’aka Chineke site n’ọnụ mmụọ ozi dị nsọ[b] ka o ziga kpọọ gị ka ị bịa n’ụlọ ya,[c] wee nụ okwu n’ọnụ gị.”[d]
  to: Ha sịrị, “Kọniliọs, onyeisi agha nke narị ndị agha, bụ nwoke ezi omume, onye na-atụ egwu Chineke, onye agbụrụ ndị Juu dum na-agba ezi ama banyere ya.[a] Mmụọ ozi dị nsọ nyere ya ntụziaka sitere n’aka Chineke[b] ka ọ kpọọ gị ka ị bịa n’ụlọ ya,[c] ka o nụkwa okwu sitere n’aka gị.”[d]
  rationale: The revision corrects the defective reputation clause, removes an added ‘mouth’ expression, and recasts the instruction and summons clauses in natural Standard Igbo. It retains the Greek passive/divine-communication sense, the explicit holiness of the angel, the people-group force of ἔθνος, and the non-doctrinal description of Cornelius’s piety. Footnote markers remain correctly anchored to the relevant expressions.
