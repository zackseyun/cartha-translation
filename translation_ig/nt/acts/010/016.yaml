id: ACT.10.16
reference: Acts 10:16
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τοῦτο δὲ ἐγένετο ἐπὶ τρίς, καὶ ⸀εὐθὺς ἀνελήμφθη τὸ σκεῦος εἰς τὸν οὐρανόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/016.yaml
  text: This happened three times[b][a], and immediately the vessel was taken up into heaven.
translation:
  language: ig
  text: Ihe a mere ugboro atọ; ozugbo ahụ, e buliri arịa ahụ[a] gaa n’eluigwe[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “akwa ahụ.” Okwu Grik a pụtara arịa, ihe e ji etinye ihe, ma ọ bụ ihe; amaokwu ndị bu ụzọ na-egosi na ihe a dị ka akwa buru ibu.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “na mbara igwe.” Okwu Grik ahụ nwere ike ịpụta “mbara igwe” ma ọ bụ “eluigwe,” ma “eluigwe” dabara nke ọma n’ọnọdụ ọhụụ a.
    reason: alternative_reading
lexical_decisions:
- source_word: τοῦτο
  choice: Ihe a
  rationale: Ọ na-ezo aka n’ihe ahụ dum mere n’ọhụụ ahụ; ‘Ihe a’ bụ ụzọ Igbo kwụ ọtọ ma doo anya isi gosi ntụaka ahụ.
- source_word: δὲ
  choice: kwa
  rationale: δέ bụ njikọ dị nro n’ebe a. ‘Kwa’ na-ejikọta akụkụ abụọ nke akụkọ ahụ n’ụzọ Igbo na-asụkarị, n’enweghị ime ka ọ bụrụ nnukwu mmegide.
- source_word: ἐγένετο
  choice: mere
  rationale: N’ebe a γίνομαι pụtara na ihe ahụ mere; ‘mere’ bụ okwu Igbo dị mfe ma kwekọọ n’akụkọ.
- source_word: ἐπὶ τρίς
  choice: ugboro atọ
  rationale: Nke a na-egosi na ihe ahụ mere ugboro atọ; ‘ugboro atọ’ bụ okwu Igbo nke oge a, doro anya.
- source_word: εὐθὺς
  choice: ozugbo ahụ
  rationale: Ọ na-egosi na ihe sochiri ya mere n’egbughị oge; ‘ozugbo ahụ’ na-echekwa ọsọ mgbanwe dị n’akụkọ Luk.
- source_word: ἀνελήμφθη
  choice: e buliri
  rationale: Ụdị ngwaa ahụ bụ passive ma na-egosi mmegharị ịrị elu; ‘e buliri’ na-echekwa ma passive ahụ ma ntụziaka elu.
- source_word: τὸ σκεῦος
  choice: ihe ahụ dị ka akwa
  rationale: σκεῦος bụ okwu sara mbara maka arịa ma ọ bụ ihe e ji eme ihe, ma ihe ndị gbara amaokwu a gburugburu kọwara ya dị ka akwa buru ibu. Nsụgharị a na-eme ka onye Igbo ghọta ihe a na-ekwu banyere ya n’enweghị ịkpọ ya naanị ‘akwa’; ihe e dere n’ala peeji na-echekwa okwu ọzọ sara mbara.
- source_word: εἰς τὸν οὐρανόν
  choice: baa n’eluigwe
  rationale: εἰς na-egosi mmegharị banye n’ebe ahụ, οὐρανός nwekwara ike ịbụ eluigwe ma ọ bụ mbara igwe. N’ọhụụ a, ‘n’eluigwe’ dabara nke ọma, ebe ‘baa’ na-eme ka ntụziaka ahụ pụta ìhè.
theological_decisions:
- issue: Ihe οὐρανός na-ezo aka na ya n’ọhụụ Pita
  choice: eluigwe
  alternative: mbara igwe
  rationale: Ọ bụ ezie na οὐρανός nwere ike ịpụta ‘mbara igwe,’ ọnọdụ nke ọhụụ ahụ—ihe si n’ebe Chineke nọ rịdata ma laghachi—na-akwado ‘eluigwe.’ E debere ‘mbara igwe’ n’ihe e dere n’ala peeji iji chekwaa nghọta abụọ okwu Grik ahụ nwere.
translation_notes:
  register: Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ ‘ihe ahụ dị ka akwa’ iji jikọta okwu Grik sara mbara na nkọwa ọhụụ dị n’amaokwu ndị gbara ya gburugburu; a zere okwu ochie ma ọ bụ asụsụ nke otu ụka pụrụ iche.
