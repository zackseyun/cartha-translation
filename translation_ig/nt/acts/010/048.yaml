  text: προσέταξεν ⸀δὲ αὐτοὺς ⸂ἐν τῷ ὀνόματι Ἰησοῦ Χριστοῦ βαπτισθῆναι⸃. τότε ἠρώτησαν αὐτὸν ἐπιμεῖναι ἡμέρας τινάς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/048.yaml
  text: So he ordered them to be baptized in the name of Jesus the Messiah[a]. Then they asked him to remain for some days.
translation:
  language: ig
  text: O wee nye iwu ka e mee ha baptizim n’aha Jizọs bụ Mesaya[a]. Mgbe ahụ, ha rịọrọ ya ka ọ nọrọ ụbọchị ụfọdụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, dị ka nsụgharị ọdịnala si kwuo, “Jizọs Kraịst.”
    reason: alternative_reading
lexical_decisions:
- source_word: προσέταξεν
  choice: nyere iwu
  rationale: Nkebiokwu a na-egosi ntụziaka e nyere site n’ikike, ma ọ bụkwa okwu Igbo doro anya ma dị ugbu a.
- source_word: δὲ
  choice: Ya mere
  rationale: N’ebe a, δέ na-akwalite akụkọ n’ihu ma na-ejikọta iwu ahụ na ihe ndị mere tupu ya, ọ bụghị igosi nnukwu mmegide.
- source_word: ἐν τῷ ὀνόματι
  choice: n’aha
  rationale: Ọ na-edobe obosara okwu Grik ahụ, nke pụrụ ịgụnye ikike, nrubeisi na ịkpọku aha, n’enweghị ime ka ọ bụrụ naanị otu nkọwa.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jizọs bụ Mesaya
  rationale: Χριστός bụ utu aha n’ebe a; “bụ Mesaya” na-eme ka nke ahụ doo anya n’Igbo ma ghara ime ya ka ọ dị ka aha ezinụlọ.
- source_word: βαπτισθῆναι
  choice: ka e mee ha baptizim
  rationale: Nke a na-egosipụta infinitive passive ahụ n’ụzọ Igbo sitere n’okike, n’enweghị ịkọwapụta usoro baptizim a na-ekwughị kpọmkwem n’amaokwu ahụ.
- source_word: τότε
  choice: Mgbe ahụ
  rationale: Ọ na-egosi ihe sochiri nke mbụ n’usoro akụkọ.
- source_word: ἠρώτησαν
  choice: rịọrọ
  rationale: N’ọnọdụ a, ngwaa ahụ pụtara ịrịọ mmadụ ka o mee ihe; “rịọrọ” bụ okwu Igbo kwesịrị ekwesị ma ghara ime ka arịrịọ ahụ sie ike karịa ederede.
- source_word: ἐπιμεῖναι
  choice: ka ọ nọnyere ha
  rationale: Ọ na-egosi ịnọgide n’ebe ahụ ruo oge ụfọdụ; itinye “ha” na-eme ka okwu ahụ bụrụ Igbo sitere n’okike n’enweghị ịgbanwe isi ihe.
- source_word: ἡμέρας τινάς
  choice: ụbọchị ole na ole
  rationale: Ọ na-edobe ogologo oge ahụ ka ọ bụrụ nke a na-akọwaghị kpọmkwem ma na-ada nke ọma n’Igbo.
theological_decisions:
- issue: Nsụgharị Χριστοῦ n’okwu baptizim
  choice: Mesaya
  alternative: Kraịst
  rationale: N’ebe a, Χριστός na-arụ ọrụ dị ka utu aha nke Jizọs. “Mesaya” na-egosipụta ihe utu aha ahụ pụtara, ebe e debere ụdị ọdịnala “Kraịst” n’ala ala peeji.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke dị ugbu a, dị ùgwù ma dị mfe nghọta. E jiri “mee ha baptizim” zere ịbanye n’arụmụka ụka banyere usoro baptizim, ebe “Jizọs bụ Mesaya” na-eme ka utu aha ahụ doo anya.
