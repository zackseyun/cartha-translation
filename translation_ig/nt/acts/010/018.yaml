  text: καὶ φωνήσαντες ⸀ἐπυνθάνοντο εἰ Σίμων ὁ ἐπικαλούμενος Πέτρος ἐνθάδε ξενίζεται.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/018.yaml
  text: And they called out and asked whether Simon[a], who is called Peter, was staying here.
translation:
  language: ig
  text: Ha wee kpọọ oku, jụọ ma Saịmọn, onye a na-akpọ Pita, ọ̀ na-anọ n'ebe a dịka ọbịa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “ọ̀ na-anọ n'ebe a nwa oge?” ma ọ bụ “ọ̀ bụ n'ebe a ka a nabatara ya dịka ọbịa?” Okwu Grik ahụ pụtara ịnọ n’ụlọ mmadụ dịka ọbịa.
    reason: lexical_alternative
lexical_decisions:
- source_word: φωνήσαντες
  choice: kpọọ oku
  rationale: Nke a na-egosi na ha weliri olu kpọọ ndị nọ n’ụlọ tupu ha ajụọ ajụjụ ahụ, n’asụsụ Igbo dị mfe ma bụrụkwa nke e ji akọ akụkọ.
- source_word: ἐπυνθάνοντο
  choice: jụọ
  rationale: Ọ bụ ụzọ nkịtị na nke doro anya isi kwuo na ha rịọrọ ka a gwa ha ihe ha chọrọ ịmata; usoro akụkọ ahụ na-egosi na ajụjụ ahụ sochiri oku ahụ.
- source_word: εἰ
  choice: ma
  rationale: “Ma” na-ewebata ajụjụ a na-akọgharị n’ụzọ e si ekwu Igbo nke ọma.
- source_word: Σίμων ὁ ἐπικαλούμενος Πέτρος
  choice: Saịmọn, onye a na-akpọ Pita
  rationale: Nke a na-edobe aha abụọ ahụ na njikọ dị n’etiti ha n’enweghị ịgbakwunye nkọwa ọzọ.
- source_word: ἐνθάδε
  choice: ebe ahụ
  rationale: N’ọnọdụ onye na-akọ akụkọ, “ebe ahụ” na-ezo aka n’ụlọ ahụ ndị ikom ahụ bịarutere, ma na-ada ka Igbo nkịtị karịa “n’ebe a.”
- source_word: ξενίζεται
  choice: nọ ... dị ka ọbịa
  rationale: Nhọrọ a na-egosipụta na ọ bụghị nanị ịnọ n’ebe ahụ ka e kwuru, kama ịnọ n’ụlọ onye ọzọ dị ka ọbịa.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke oge a, dị ùgwù ma dị mfe nghọta. E ji “wee” jikọta omume abụọ ahụ n’usoro akụkọ, ebe “dị ka ọbịa” na-echekwa echiche ile ọbịa dị n’okwu Grik.
