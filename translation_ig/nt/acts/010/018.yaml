review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders the calling out, the indirect inquiry, and Simon Peter’s identification. However, ἐνθάδε is deictic (‘here’), and should not be shifted to ‘there’ in the translation. The present verb ξενίζεται is well conveyed by an ongoing expression of lodging as a guest.
  naturalness: The wording is broadly natural Standard Igbo. Adding a comma between the sequential actions and using ‘na-anọ’ gives a smoother, explicitly ongoing form for the lodging.
  terminology: ‘Saịmọn,’ ‘Pita,’ and ‘onye a na-akpọ’ are appropriate. ‘dịka ọbịa’ preserves the guest/hospitality sense without overinterpreting it.
  issues:
  - severity: medium
    issue: ‘ebe ahụ’ renders ἐνθάδε as ‘there.’
    rationale: The Greek explicitly says ‘here,’ from the perspective of those calling at the house. ‘n'ebe a’ preserves this deictic reference.
  - severity: low
    issue: The main clause lacks punctuation between ‘kpọọ oku’ and ‘jụọ.’
    rationale: A comma clarifies that calling out precedes their inquiry, matching the participial construction.
  revised_text: Ha wee kpọọ oku, jụọ ma Saịmọn, onye a na-akpọ Pita, ọ̀ na-anọ n'ebe a dịka ọbịa.[a]
