source:
  edition: SBLGNT
  text: ὑμεῖς οἴδατε τὸ γενόμενον ῥῆμα καθ’ ὅλης τῆς Ἰουδαίας, ⸀ἀρξάμενος ἀπὸ τῆς Γαλιλαίας μετὰ τὸ βάπτισμα ὃ ἐκήρυξεν Ἰωάννης,
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/037.yaml
  text: You yourselves know the thing that happened throughout all Judea[a], beginning from Galilee after the baptism that John proclaimed[b],
translation:
  language: ig
  text: Unu onwe unu maara ihe ahụ mere n’ala Judia dum[a], nke malitere site na Galili mgbe baptizim ahụ Jọn kwusara gasịrị[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “okwu ma ọ bụ ozi ahụ gbasara n’ala Judia dum.” Okwu Grik bụ ῥῆμα, nke nwere ike ịpụta “okwu,” “ozi,” ma ọ bụ “ihe.”
    reason: lexical_alternative
  - marker: b
    text: N’asụsụ Grik, participle a sụgharịrị “nke malitere” adịghị ejikọta nke ọma n’usoro ahịrịokwu, ma ọ na-egosi n’ụzọ doro anya na Galili bụ ebe ihe ahụ si malite.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς
  choice: Unu onwe unu
  rationale: Nnọchiaha ahụ e dere kpọmkwem na Grik na-emesi ndị a na-agwa okwu ike; ‘unu onwe unu’ na-egosipụta nkwusi ike ahụ n’Igbo eke.
- source_word: οἴδατε
  choice: maara
  rationale: Ọ bụ ezie na ọdịdị okwu Grik bụ perfect, ọ na-arụ ọrụ n’echiche ugbu a; ‘maara’ bụ ntụgharị Igbo doro anya na nke eke.
- source_word: τὸ γενόμενον ῥῆμα
  choice: ihe ahụ mere
  rationale: ῥῆμα nwere ike ịbụ okwu, ozi, ihe, ma ọ bụ okwu metụtara ihe merenụ. N’ebe a, ‘ihe ahụ mere’ na-egosipụta akụkụ ihe omume ahụ n’enweghị ịkagbu ohere nke ozi gbasara ya.
- source_word: καθ’ ὅλης τῆς Ἰουδαίας
  choice: n’ala Judia niile
  rationale: κατά ya na genitive na-egosi mgbasa gafee mpaghara dum; ‘n’ala Judia niile’ bụ Igbo nkịtị nke na-echekwa echiche ahụ.
- source_word: ἀρξάμενος ἀπὸ τῆς Γαλιλαίας
  choice: nke malitere na Galili
  rationale: N’agbanyeghị na participle ahụ adabaghị nke ọma n’usoro okwu Grik, ọ na-egosi na ihe a si Galili bido. Nkebi ahịrịokwu Igbo a na-eme ka nghọta doo anya n’etinyeghị ihe ọhụrụ.
- source_word: μετὰ τὸ βάπτισμα
  choice: mgbe baptizim ahụ ... gasịrị
  rationale: μετά ya na accusative bụ nke oge; usoro a bụ Igbo eke maka ‘mgbe ... gasịrị.’
- source_word: ὃ ἐκήρυξεν Ἰωάννης
  choice: Jọn kwusara
  rationale: κηρύσσω bụ ikwusa ozi n’ihu ọha; ‘kwusara’ na-echekwa ike okwu ahụ karịa okwu ga-ejedebe naanị n’okwuchukwu chọọchị.
theological_decisions:
- issue: Ihe ῥῆμα pụtara na nchịkọta Pita
  choice: ihe ahụ mere
  alternative: okwu ahụ; ozi ahụ
  rationale: Ihe a maara n’ala Judia niile ma malite na Galili yiri usoro ihe omume na ozi gbasara Jizọs. A hapụrụ ụzọ okwu ndị ọzọ na ihe odide ala peeji kama ime ka otu nghọta bụrụ naanị ya.
- issue: Ihe ἀρξάμενος na-ezo aka na ya
  choice: E jikọtara ya na ‘ihe ahụ’ dịka ‘nke malitere na Galili.’
  alternative: Ịsụgharị ya n’ụzọ adverbial dịka ‘malite na Galili’; ma ọ bụ ijikọ ya na onye a na-ekwughị kpọmkwem.
  rationale: Masculine participle ahụ adịghị adaba nke ọma na neuter ῥῆμα, ma ebe mmalite ya doro anya. Nsụgharị ahụ na-eme ka Igbo bụrụ nke a na-aghọta ma ghara ịkọwa ihe Grik na-ekwughị.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E debere aha ebe ‘Judia’ na ‘Galili,’ aha onye ‘Jọn,’ na okwu ụka a maara nke ọma ‘baptizim.’ Akara ala peeji [a] na [b] dị n’ederede isi n’ebe kwesịrị ekwesị.
