id: ACT.10.34
reference: Acts 10:34
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἀνοίξας δὲ Πέτρος τὸ στόμα εἶπεν· Ἐπ’ ἀληθείας καταλαμβάνομαι ὅτι οὐκ ἔστιν προσωπολήμπτης ὁ θεός,
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/034.yaml
  text: Then Peter opened his mouth and said[b][a], “Truly I understand that God is not one who shows partiality,”
translation:
  language: ig
  text: Mgbe ahụ, Pita meghere ọnụ ya wee sị, “N’ezie, aghọtara m na Chineke adịghị ele mmadụ anya n’ihu.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’ụzọ ọzọ, “Chineke anaghị akpa ókè” ma ọ bụ “Chineke anaghị emere onye ọ bụla ihu ọma karịa ibe ya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀνοίξας ... τὸ στόμα
  choice: meghere ọnụ ya kwuo
  rationale: Nke a na-edobe ihe oyiyi dị n’asụsụ Grik ma na-ada nke ọma n’Igbo dịka mmalite okwu dị mkpa.
- source_word: δὲ
  choice: Mgbe ahụ
  rationale: N’ebe a, δέ na-egosi nzọụkwụ ọzọ n’akụkọ; “Mgbe ahụ” na-egosipụta usoro akụkọ ahụ n’Igbo doro anya.
- source_word: Ἐπ’ ἀληθείας
  choice: N’ezie
  rationale: Nkebiokwu a na-emesi ike na ihe Pita na-ekwu bụ nghọta o ji n’aka na ọ bụ eziokwu.
- source_word: καταλαμβάνομαι
  choice: aghọtara m
  rationale: N’ọnọdụ a, okwu ahụ pụtara ịghọta ma ọ bụ ịmata nke ọma; “aghọtara m” bụ Igbo nkịtị ma ghara itinye “ugbu a,” nke na-adịghị n’ederede Grik kpọmkwem.
- source_word: προσωπολήμπτης
  choice: adịghị ele mmadụ anya n’ihu
  rationale: Akpaalaokwu Igbo a na-egosi na Chineke anaghị akpa ókè ma ọ bụ họrọ mmadụ n’ihi ọnọdụ ya; ọ na-enye echiche aha Grik ahụ n’ụzọ ndị na-agụ Igbo ga-aghọta ngwa ngwa.
- source_word: ὁ θεός
  choice: Chineke
  rationale: Nke a bụ nsụgharị Igbo a na-ejikarị eme ihe maka θεός n’ebe a.
theological_decisions:
- issue: Ikwupụta na Chineke anaghị akpa ókè n’etinyeghị nkọwa ozizi e mechara wulite
  choice: Chineke adịghị ele mmadụ anya n’ihu
  alternative: Chineke anaghị akpa ókè
  rationale: Nhọrọ a na-echekwa nkwupụta banyere agwa Chineke ma na-ahapụ ka amaokwu ndị na-esochi ya kọwaa ihe ọ pụtara n’ihe gbasara ndị si ná mba niile.
translation_notes:
  register: Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta. E debere akpaalaokwu “meghere ọnụ ya” n’ihi ibu okwu ya, ebe “ile mmadụ anya n’ihu” na-ekwupụta προσωπολήμπτης n’ụzọ Igbo kwesịrị ekwesị.
