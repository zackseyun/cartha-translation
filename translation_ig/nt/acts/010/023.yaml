revisions:
- from: Ya mere, ọ kpọbatara ha n’ime ụlọ, nye ha ebe ha ga-anọ dịka ndị ọbịa[a]. N’echi ya, o biliri wee soro ha pụọ; ụfọdụ ụmụnna nwoke[b] si Jọpa sokwa ya gaa.
  to: Ya mere, ọ kpọrọ ha bata, nye ha ebe ha ga-anọ dịka ndị ọbịa[a]. N’echi ya, o biliri wee soro ha pụọ; ụfọdụ ụmụnna[b] si Jọpa sooro ya gaa.
  rationale: The revision removes the unsupported specification “house,” improves the natural Igbo rendering of the Christian kinship term, and clarifies the grammatical explanation in the footnote. It retains the source’s narrative connection, hospitality/lodging sense, travel sequence, and the ambiguity regarding the scope of ἀδελφῶν.
