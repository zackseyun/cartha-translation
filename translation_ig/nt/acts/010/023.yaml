review_pass:
  verdict: revise
  source_fidelity: The draft conveys the sequence of welcoming the visitors, lodging them, Peter's departure with them the following day, and accompaniment by believers from Joppa. However, “n’ime ụlọ” specifies a house, whereas εἰσκαλεσάμενος only says that he invited/called them in. “Ụmụnna nwoke” is an unnecessarily restrictive and less idiomatic way to represent the Greek masculine plural in Igbo.
  naturalness: 'The proposed revision uses idiomatic Standard Igbo: “kpọrọ ha bata” avoids the added specification of a house, “nye ha ebe ha ga-anọ dịka ndị ọbịa” clearly expresses lodging, and “ụfọdụ ụmụnna si Jọpa sooro ya gaa” is natural narrative phrasing.'
  terminology: “Ụmụnna” is the established, natural ecclesial term in Igbo. Since Igbo does not mark grammatical masculine plural in this noun, adding “nwoke” can imply that the referents were exclusively male more strongly than the Greek form itself requires. The footnote retains the relevant grammatical and interpretive information without imposing it on the text.
  issues:
  - severity: medium
    issue: “n’ime ụlọ” adds a specific location.
    rationale: The Greek says Peter invited them in, but does not explicitly identify the place as a house. “Kpọrọ ha bata” preserves the action without adding that detail.
  - severity: medium
    issue: “ụmụnna nwoke” is overly restrictive and not the most natural Igbo ecclesial wording.
    rationale: ἀδελφῶν is morphologically masculine plural, but it can denote fellow believers broadly. “Ụmụnna” is natural Standard Igbo and leaves the referential scope appropriately open; the footnote can explain the Greek form.
  - severity: low
    issue: Footnote b’s wording for grammatical gender is imprecise.
    rationale: “Ụdị ọtụtụ nke nwoke” is not a clear grammatical description. “Ụdị ọtụtụ nke aha nwoke” accurately identifies the Greek masculine plural form.
  revised_text: Ya mere, ọ kpọrọ ha bata, nye ha ebe ha ga-anọ dịka ndị ọbịa[a]. N’echi ya, o biliri wee soro ha pụọ; ụfọdụ ụmụnna[b] si Jọpa sooro ya gaa.
  revised_footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “nabatara ha dịka ndị ọbịa” ma ọ bụ “lekọtara ha dịka ndị ọbịa.” Okwu Grik ahụ na-ekwu kpọmkwem banyere ile ọbịa site n’inye mmadụ ebe ọ ga-anọ.
    reason: lexical_alternative
  - marker: b
    text: “Ụmụnna” sụgharịrị ἀδελφῶν, ụdị ọtụtụ nke aha nwoke n’asụsụ Grik. N’otú Ndị Kraịst oge mbụ si eji okwu a eme ihe, ọ pụrụ mgbe ụfọdụ ịpụta ndị kwere ekwe ibe ha n’ozuzu—ya bụ, ụmụnna nwoke na ụmụnna nwanyị.
    reason: lexical_alternative
  revision_rationale: The revision removes the unsupported specification “house,” improves the natural Igbo rendering of the Christian kinship term, and clarifies the grammatical explanation in the footnote. It retains the source’s narrative connection, hospitality/lodging sense, travel sequence, and the ambiguity regarding the scope of ἀδελφῶν.
