id: ACT.10.23
reference: Acts 10:23
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἰσκαλεσάμενος οὖν αὐτοὺς ἐξένισεν. Τῇ δὲ ἐπαύριον ⸀ἀναστὰς ἐξῆλθεν σὺν αὐτοῖς, καί τινες τῶν ἀδελφῶν τῶν ἀπὸ Ἰόππης συνῆλθον αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/023.yaml
  text: So he invited them in and gave them lodging[a]. The next day he got up and went out with them[b], and some of the brothers from Joppa went with him.
translation:
  language: ig
  text: Ya mere, ọ kpọrọ ha bata, nye ha ebe ha ga-anọ dịka ndị ọbịa[a]. N’echi ya, o biliri wee soro ha pụọ; ụfọdụ ụmụnna[b] si Jọpa sooro ya gaa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “nabatara ha dịka ndị ọbịa” ma ọ bụ “lekọtara ha dịka ndị ọbịa.” Okwu Grik ahụ na-ekwu kpọmkwem banyere ile ọbịa site n’inye mmadụ ebe ọ ga-anọ.
    reason: lexical_alternative
  - marker: b
    text: “Ụmụnna” sụgharịrị ἀδελφῶν, ụdị ọtụtụ nke aha nwoke n’asụsụ Grik. N’otú Ndị Kraịst oge mbụ si eji okwu a eme ihe, ọ pụrụ mgbe ụfọdụ ịpụta ndị kwere ekwe ibe ha n’ozuzu—ya bụ, ụmụnna nwoke na ụmụnna nwanyị.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσκαλεσάμενος
  choice: ọ kpọbatara ha n’ime ụlọ
  rationale: Okwu a na-egosi na Pita mere ka ha bata n’ebe ọ nọ. “Kpọbatara ha n’ime ụlọ” bụ Igbo doro anya ma na-egosipụta omume ahụ n’enweghị ịgbakwụnye nkọwa na-adịghị na Grik.
- source_word: οὖν
  choice: Ya mere
  rationale: Ọ na-ejikọta ihe Pita mere na mkparịta ụka bu ya ụzọ dịka ihe si na ya pụta, ma ọ naghị eme ka njikọ ahụ sie ike karịa ka Grik si kwuo.
- source_word: ἐξένισεν
  choice: nye ha ebe ha ga-anọ dịka ndị ọbịa
  rationale: N’ebe a, ngwaa ahụ pụtara ile ndị bịara anya nke ọma site n’inye ha ebe ha ga-anọ. Nsụgharị a na-eme ka ụdị ile ọbịa ahụ pụta ìhè.
- source_word: Τῇ δὲ ἐπαύριον
  choice: N’echi ya
  rationale: Nke a bụ ụzọ Igbo dị nkenke ma bụrụkwa ihe a na-asụkarị iji gosi ụbọchị sochirinụ.
- source_word: ἀναστὰς
  choice: o biliri
  rationale: Ọ na-edobe echiche nkịtị nke ibili, na-etinyeghị echiche ‘ịmalite njem’ nke ga-emegharị ihe ἐξῆλθεν kwuru.
- source_word: ἐξῆλθεν σὺν αὐτοῖς
  choice: wee soro ha pụọ
  rationale: Nke a na-egosipụta ma ọpụpụ ya ma iso ndị ozi ahụ gaa n’ụzọ Igbo na-aga were were.
- source_word: τινες
  choice: ụfọdụ
  rationale: Ọ bụ ihe kwekọrọ n’okwu Grik na-akọwa mmadụ ole na ole a na-akpọghị aha.
- source_word: ἀδελφῶν
  choice: ụmụnna nwoke
  rationale: A họọrọ okwu na-egosi ụdị ọtụtụ nke nwoke dị na Grik. E debere ohere na okwu ahụ pụrụ ịpụta ndị kwere ekwe n’ozuzu ya n’okpuru ala peeji.
- source_word: τῶν ἀπὸ Ἰόππης
  choice: si Jọpa
  rationale: Nkebiokwu a na-egosi ebe ụmụnna ahụ si; ụdị dị nkenke a bụ Igbo ebumpụta ụwa.
- source_word: συνῆλθον αὐτῷ
  choice: sokwa ya gaa
  rationale: N’ọnọdụ akụkọ a, okwu ahụ pụtara na ha sonyeere Pita na njem ahụ. Nsụgharị a na-egosipụta iso mmadụ gaa nke ọma.
theological_decisions:
- issue: Otú a ga-esi sụgharịa ἀδελφῶν n’ọnọdụ ọ pụrụ ịpụta ndị otu okwukwe
  choice: ụmụnna nwoke
  alternative: ụmụnna; ndị kwere ekwe ibe ha
  rationale: Ụdị okwu Grik ahụ bụ ọtụtụ nke nwoke, ya mere isi ederede na-edobe nke a. Ma ebe okwu ahụ na Ndị Kraịst oge mbụ pụrụ mgbe ụfọdụ ịgụnye ndị kwere ekwe n’ozuzu ha, e debere nghọta ahụ dị ka ihe ọzọ n’okpuru ala peeji kama idozi ihe ahụ n’otu ụzọ naanị.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. Ahịrịokwu ahụ na-edobe usoro akụkọ Grik, ma a haziri njikọ okwu ya ka ọ daa nke ọma n’Igbo. E jiri “Jọpa” dee aha obodo ahụ dịka ntụgharị ụda kwesịrị ekwesị.
