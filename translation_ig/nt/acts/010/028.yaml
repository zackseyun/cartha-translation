revisions:
- from: Ọ gwakwara ha, sị, “Unu onwe unu maara na iwu akwadoghị ka nwoke Juu na onye mba ọzọ[a] na-akpakọrịta ma ọ bụ gaa leta ya. Ma Chineke egosila m na agaghị m akpọ mmadụ ọ bụla onye nkịtị[b] ma ọ bụ onye na-adịghị ọcha.”
  to: Ọ gwakwara ha, sị, “Unu onwe unu maara na ọ bụ ihe a machibidoro nwoke Juu iso onye mba ọzọ[a] na-akpakọrịta ma ọ bụ gaa leta ya. Ma Chineke egosila m ka m ghara ịkpọ mmadụ ọ bụla ihe nkịtị[b] ma ọ bụ ihe na-adịghị ọcha.”
  rationale: The revision corrects the grammatical relationship in the first infinitive clause and makes the final two predicates communicate ritual classification rather than an assertion that people are merely ordinary or morally bad. It retains the Greek emphasis in “Unu onwe unu,” the representative masculine “nwoke Juu,” the contrast introduced by “Ma,” and the distinct terms κοινός and ἀκάθαρτος. No disputed textual or doctrinal interpretation has been introduced.
