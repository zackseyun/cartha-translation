id: ACT.10.28
reference: Acts 10:28
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἔφη τε πρὸς αὐτούς· Ὑμεῖς ἐπίστασθε ὡς ἀθέμιτόν ἐστιν ἀνδρὶ Ἰουδαίῳ κολλᾶσθαι ἢ προσέρχεσθαι ἀλλοφύλῳ· κἀμοὶ ὁ θεὸς ἔδειξεν μηδένα κοινὸν ἢ ἀκάθαρτον λέγειν ἄνθρωπον·
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/028.yaml
  text: And he said to them[a], “You yourselves know how unlawful it is for a Jewish man to associate with or visit a foreigner[b]; but God has shown me to call no person common or unclean.”
translation:
  language: ig
  text: Ọ gwakwara ha, sị, “Unu onwe unu maara na ọ bụ ihe a machibidoro nwoke Juu iso onye mba ọzọ[a] na-akpakọrịta ma ọ bụ gaa leta ya. Ma Chineke egosila m ka m ghara ịkpọ mmadụ ọ bụla ihe nkịtị[b] ma ọ bụ ihe na-adịghị ọcha.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “onye Jentaịl” ma ọ bụ “onye si n’agbụrụ ọzọ.” Okwu Grik ahụ, ἀλλοφύλῳ, pụtara n’ụzọ nkịtị onye so n’otu ndị ọzọ.
    reason: lexical_alternative
  - marker: b
    text: “Ihe nkịtị” sụgharịrị κοινόν. Ọ dị iche n’“ihe na-adịghị ọcha” (ἀκάθαρτον); okwu abụọ ahụ na-echekwa ụdị okwu e ji akọwa ịdị ọcha n’etiti ndị Juu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφη τε
  choice: Ọ gwakwara ha, sị
  rationale: “Kwakwara” na-egosi njikọ dị nro nke τέ n’akụkọ ahụ, ebe “sị” bụ ụzọ Igbo si webata okwu kpọmkwem n’ụzọ ebumpụta ụwa.
- source_word: Ὑμεῖς ἐπίστασθε
  choice: Unu onwe unu maara
  rationale: “Onwe unu” na-echekwa nkwusi ike nke nnọchiaha doro anya Ὑμεῖς.
- source_word: ὡς ἀθέμιτόν ἐστιν
  choice: na iwu akwadoghị
  rationale: Nke a na-egosi ihe a na-ewere dị ka ihe a machibidoro ma ọ bụ ihe iwu na omenala na-akwadoghị, ọ bụghị naanị omume na-adịghị mma.
- source_word: ἀνδρὶ Ἰουδαίῳ
  choice: ka nwoke Juu
  rationale: Nke a na-echekwa otu onye e ji anọchi anya ndị ọzọ nakwa ụdị nwoke nke okwu Grik ahụ.
- source_word: κολλᾶσθαι
  choice: na onye ... na-akpakọrịta
  rationale: “Na-akpakọrịta” na-enye echiche nke isonyere mmadụ ma ọ bụ iso ya na-emekọrịta ndụ n’ụzọ Igbo dị mfe nghọta.
- source_word: ἢ προσέρχεσθαι
  choice: ma ọ bụ gaa leta ya
  rationale: N’ọnọdụ a, okwu ahụ na-ezo aka n’ịgakwuru onye mba ọzọ, karịchaa n’ụlọ ya; “gaa leta ya” na-ekwupụta nke a n’ụzọ ebumpụta ụwa.
- source_word: ἀλλοφύλῳ
  choice: onye mba ọzọ
  rationale: Ọ pụtara onye si n’agbụrụ ma ọ bụ n’otu ndị ọzọ. “Onye mba ọzọ” dị nkenke ma ghara ibu ụzọ tinye nkọwa okpukpe nke “onye Jentaịl.”
- source_word: κἀμοὶ ὁ θεὸς ἔδειξεν
  choice: Ma Chineke egosila m
  rationale: “Ma” na-egosi mgbanwe dị n’etiti ihe ha maara na mkpughe Chineke nyere Pita; “egosila m” na-egosi na mkpughe ahụ ka na-achị omume ya ugbu a.
- source_word: μηδένα ... ἄνθρωπον
  choice: mmadụ ọ bụla
  rationale: ἄνθρωπος ebe a gụnyere mmadụ niile, ọ bụghị naanị nwoke.
- source_word: κοινὸν
  choice: onye nkịtị
  rationale: “Onye nkịtị” na-echekwa echiche bụ́ isi nke κοινός ma mee ka ọ dị iche n’ἀκάθαρτος, kama ijikọ ha abụọ n’otu okwu.
- source_word: ἢ ἀκάθαρτον
  choice: ma ọ bụ onye na-adịghị ọcha
  rationale: Nke a bụ okwu Igbo doro anya maka ụdị adịghị ọcha a na-ekwu banyere ya n’iwu ịdị ọcha.
theological_decisions:
- issue: Mmekọrịta dị n’etiti ókè ndị Juu na-etinye n’etiti ha na ndị ọzọ na mkpughe Chineke nyere Pita
  choice: E gosiri okwu Pita dị ka ihe a na-ewere na iwu akwadoghị maka nwoke Juu, ma chekwaa nkwupụta ya na Chineke gosiri ya ka ọ ghara ịkpọ mmadụ ọ bụla onye nkịtị ma ọ bụ onye na-adịghị ọcha.
  alternative: Ịsụgharị ἀθέμιτον naanị dị ka omume na-adịghị mma n’ọha, ma ọ bụ ijikọ κοινός na ἀκάθαρτος ka ha bụrụ otu echiche.
  rationale: 'Amaokwu ahụ ekwesịghị ime ka okwu mbụ ghọọ naanị ihe gbasara omume ọma n’ọha, ma ọ bụ kwuo ihe karịrị ihe Grik kwuru. Ọ dịkwa mkpa ichekwa na Pita tinyere ihe ọhụụ ahụ n’ahụ mmadụ: “mmadụ ọ bụla.”'
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E debere nkwusi ike nke “unu onwe unu,” ụdị nwoke nke “nwoke Juu,” na ọdịiche dị n’etiti “onye nkịtị” na “onye na-adịghị ọcha.”
