revisions:
- from: ọ bụghị mmadụ niile[a], kama ọ bụ ndị akaebe Chineke họpụtara tupu oge eruo—ya bụ, anyị—ndị sooro ya rie ma ṅụọ mgbe o si nʼọnwụ bilie.[b]
  to: Ọ bụghị ndị mmadụ niile, kama ọ bụ ndị akaebe Chineke họpụtara tupu oge eruo—anyị bụ ndị sooro ya rie ma ṅụọ mgbe o si n’ọnwụ bilie.[b]
  rationale: The revision replaces bare “mmadụ niile” with “ndị mmadụ niile” for a more precise and idiomatic rendering of λαῷ, removes the unsupported footnote a and its anchor, and slightly smooths the appositional phrase. Footnote b is retained because it identifies a possible alternative understanding of the resurrection expression while keeping the direct rendering in the main text.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T09:17:44Z'
review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately conveys the restricted audience, the divinely preselected witnesses, shared eating and drinking, and the temporal relation to Jesus’ resurrection. However, λαῷ is better represented by “ndị mmadụ” (“the people”) than by bare “mmadụ” (“people/humans”), and footnote a gives an unsupported alternative: “all Israelites” is an interpretive contextual specification, not a lexical alternative supplied by the Greek.'
  naturalness: The sentence is generally clear, but “ndị mmadụ niile” is more idiomatic and specific for the collective λαός. The apposition is smoother without “ya bụ,” while retaining the emphatic identification of the witnesses as “anyị.”
  terminology: “Ndị akaebe,” “Chineke họpụtara tupu oge eruo,” and “soro ya rie ma ṅụọ” are accurate, natural Standard Igbo renderings. “Si n’ọnwụ bilie” appropriately renders the resurrection idiom without imposing a doctrinally expanded passive.
  issues:
  - severity: medium
    issue: Footnote a states “Ma ọ bụ, ‘ọ bụghị ndị Izrel niile.’”
    rationale: The Greek says “not to all the people” (οὐ παντὶ τῷ λαῷ). In the immediate setting the people are Jewish, but “Israelites” is an interpretive contextual narrowing, not a lexical alternative. The anchor and note should be removed rather than presenting this as an alternative translation.
  - severity: low
    issue: The main text uses bare “mmadụ niile” for τῷ λαῷ.
    rationale: Although understandable, “ndị mmadụ niile” more naturally denotes “all the people” as a defined collective and better preserves the noun’s communal sense.
  revised_text: Ọ bụghị ndị mmadụ niile, kama ọ bụ ndị akaebe Chineke họpụtara tupu oge eruo—anyị bụ ndị sooro ya rie ma ṅụọ mgbe o si n’ọnwụ bilie.[b]
  revised_footnotes:
  - marker: b
    text: Ma ọ bụ, “mgbe e mere ka o si n’ọnwụ bilie.” Grik dị ebe a na-adabara nke ọma na “mgbe o si n’ọnwụ bilie,” ọ bụ ezie na Agba Ọhụrụ na-ejikwa okwu na-egosi na e mere ka o bilie.
    reason: alternative_reading
  revision_rationale: The revision replaces bare “mmadụ niile” with “ndị mmadụ niile” for a more precise and idiomatic rendering of λαῷ, removes the unsupported footnote a and its anchor, and slightly smooths the appositional phrase. Footnote b is retained because it identifies a possible alternative understanding of the resurrection expression while keeping the direct rendering in the main text.
