  text: οὐ παντὶ τῷ λαῷ ἀλλὰ μάρτυσι τοῖς προκεχειροτονημένοις ὑπὸ τοῦ θεοῦ, ἡμῖν, οἵτινες συνεφάγομεν καὶ συνεπίομεν αὐτῷ μετὰ τὸ ἀναστῆναι αὐτὸν ἐκ νεκρῶν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/041.yaml
  text: not to all the people[a], but to witnesses who had been chosen beforehand by God—to us[b], who ate and drank with him after he rose from the dead.
translation:
  language: ig
  text: Ọ bụghị ndị mmadụ niile, kama ọ bụ ndị akaebe Chineke họpụtara tupu oge eruo—anyị bụ ndị sooro ya rie ma ṅụọ mgbe o si n’ọnwụ bilie.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Ma ọ bụ, “mgbe e mere ka o si n’ọnwụ bilie.” Grik dị ebe a na-adabara nke ọma na “mgbe o si n’ọnwụ bilie,” ọ bụ ezie na Agba Ọhụrụ na-ejikwa okwu na-egosi na e mere ka o bilie.
    reason: alternative_reading
lexical_decisions:
- source_word: οὐ παντὶ τῷ λαῷ
  choice: ọ bụghị mmadụ niile
  rationale: Nke a na-egosi na ọ pụtaghị ìhè nye mmadụ niile, ma na-edobe ọdịiche dị n'etiti mmadụ niile na ndị akaebe a họpụtara.
- source_word: μάρτυσι
  choice: ndị akaebe
  rationale: N’Ọrụ Ndịozi, okwu a na-abụkarị ndị na-agba akaebe banyere ihe ha hụrụ; “ndị akaebe” bụ okwu Igbo doro anya ma kwụ ọtọ.
- source_word: τοῖς προκεχειροτονημένοις ὑπὸ τοῦ θεοῦ
  choice: Chineke họpụtara tupu oge eruo
  rationale: Nke a na-edobe ma nhọrọ Chineke mere na mbụ ma mkpa nhọrọ ahụ ka nwere; “họpụta” bụ ihe kwekọrọ nke ọma ebe “kwadoo” ma ọ bụ “kenye” ka nwekwara ike ịdị.
- source_word: ἡμῖν
  choice: ya bụ, anyị
  rationale: Okwu a kọwara kpọmkwem ndị bụ ndị akaebe ahụ. “Ya bụ, anyị” na-eme ka apposition ahụ doo anya n’Igbo.
- source_word: οἵτινες συνεφάγομεν καὶ συνεπίομεν αὐτῷ
  choice: ndị sooro ya rie ma ṅụọ
  rationale: “Soro ya rie ma ṅụọ” na-echekwa echiche nke iso ya kerịta nri na ihe ọṅụṅụ, ma na-egosi n'ụzọ pụtara ìhè mmekọrịta ha na Jizọs mgbe mbilite n’ọnwụ gasịrị.
- source_word: μετὰ τὸ ἀναστῆναι αὐτὸν ἐκ νεκρῶν
  choice: mgbe o si nʼọnwụ bilie
  rationale: Nke a bụ ntụgharị Igbo ebumpụta ụwa nke infinitive a nwere nghọta intransitive, “bilie,” ma na-echekwa okwu mbilite n’ọnwụ ahụ.
theological_decisions:
- issue: Okwu e ji kọwaa mbilite n’ọnwụ na ἀναστῆναι αὐτὸν ἐκ νεκρῶν
  choice: mgbe o si nʼọnwụ bilie
  alternative: mgbe e mere ka o si nʼọnwụ bilie
  rationale: Ụdị Grik dị n’amaokwu a na-adabara nke ọma na “o bilie.” Nke a anaghị agọnahụ na Chineke mere ka o si n’ọnwụ bilie dịka akụkụ Akwụkwọ Nsọ ndị ọzọ si kwuo; ọ na-agbaso naanị ụdị okwu amaokwu a.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta. A họọrọ “ndị akaebe,” “họpụtara tupu oge eruo,” na “soro ya rie ma ṅụọ” iji chekwaa ma izi ezi nke isi mmalite Grik ma ịdị ebumpụta ụwa n’Igbo. E tinyere akara ala ala akwụkwọ [a] na [b] n’ederede isi.
