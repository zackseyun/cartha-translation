  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸂τῇ δὲ⸃ ἐπαύριον ⸀εἰσῆλθεν εἰς τὴν Καισάρειαν. ὁ δὲ Κορνήλιος ἦν προσδοκῶν αὐτοὺς συγκαλεσάμενος τοὺς συγγενεῖς αὐτοῦ καὶ τοὺς ἀναγκαίους φίλους.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/024.yaml
  text: On the next day he entered Caesarea[a]. Now Cornelius was expecting them and had called together his relatives and close friends.
translation:
  language: ig
  text: N’echi ya, ọ banyere na Sizaria.[a] Ma Kọniliọs nọ na-atụ anya ha; ọ kpọkọtalarị ndị ikwu ya na ndị enyi ya chiri anya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ngwaa Grik a sụgharịrị “ọ banyere” dị n’ụdị otu onye, ma nnọchiaha e mesịrị sụgharịa “ha” dị n’ụdị ọtụtụ mmadụ. O yikarịrị ka akụkọ ahụ lekwasịrị anya na Pita dị ka onye bụ isi, ma ọ gụnyekwara ndị so ya n’etiti ndị Kọniliọs nọ na-atụ anya ha.
    reason: textual_variant
lexical_decisions:
- source_word: τῇ δὲ ἐπαύριον
  choice: N’echi ya
  rationale: Nke a bụ ụzọ Igbo nkịtị si egosi ụbọchị sochirinụ n’usoro akụkọ; δέ na-eme njikọ akụkọ dị nro, ọ dịghịkwa mkpa ịsụgharị ya iche n’ebe a.
- source_word: εἰσῆλθεν
  choice: ọ banyere
  rationale: Ngwaa Grik ahụ dị n’otu onye ma pụta ‘ọ banyere.’ E debere otu onye ahụ, ebe a na-elekwasị anya na Pita dị ka onye bụ isi.
- source_word: Καισάρειαν
  choice: Sesaria
  rationale: Nke a bụ nsụgharị ụda aha obodo Καισάρεια n’ụdị dị mfe ma kwekọọ n’usoro mkpọpụta Igbo.
- source_word: ὁ δὲ Κορνήλιος
  choice: Ma Kọniliọs
  rationale: Ma na-egosi mgbanwe dị nro n’ebe akụkọ lekwasịrị anya, n’ebughị echiche nke nnukwu esemokwu.
- source_word: ἦν προσδοκῶν
  choice: nọ na-atụ anya
  rationale: Ọ na-egosipụta omume na-aga n’ihu n’oge gara aga, tinyere echiche na Kọniliọs maara na ha na-abịa ma na-eche ọbịbịa ha.
- source_word: αὐτούς
  choice: ha
  rationale: Nnọchiaha Grik ahụ bụ nke ọtụtụ mmadụ; ya mere, ọ na-ezo aka na Pita na ndị so ya, n’agbanyeghị na ngwaa bu ya ụzọ dị n’otu onye.
- source_word: συγκαλεσάμενος
  choice: ọ kpọkọtawokwa
  rationale: Ọ na-egosi na Kọniliọs akpọkọtala ndị ahụ tupu ma ọ bụ ka ọ nọ na-atụ anya ndị ọbịa ahụ; -wọ- na-egosi na omume ahụ emechala, ebe kwa na-ejikọta ya na ihe ọ na-eme.
- source_word: τοὺς συγγενεῖς αὐτοῦ
  choice: ndị ikwu ya
  rationale: Ndị ikwu ya bụ okwu Igbo doro anya ma dị ugbu a maka ndị ha na ya bụ otu ezinụlọ sara mbara.
- source_word: τοὺς ἀναγκαίους φίλους
  choice: ezigbo ndị enyi ya
  rationale: N’ebe a ἀναγκαίους na-akọwa ndị enyi chiri anya ma bụrụ ndị a tụkwasịrị obi, ọ bụghị ndị ‘dị mkpa’ n’echiche nkịtị; ‘ezigbo ndị enyi’ na-enye echiche ahụ n’Igbo ebumpụta ụwa.
