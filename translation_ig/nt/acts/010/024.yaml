translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. A hapụrụ mgbanwe dị n’etiti ngwaa otu onye na nnọchiaha ọtụtụ mmadụ ka ọ dị n’isi mmalite Grik, ma kọwaa ya n’ala ala peeji.
