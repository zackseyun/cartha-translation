review_pass:
  verdict: revise
  source_fidelity: The draft conveys the referent, setting, name, military rank, and named Roman unit. A small adjustment makes the centurion's relationship to the cohort more direct and preserves the Greek's single-clause linkage without implying merely that he was an ordinary member of the unit.
  naturalness: The wording is generally clear Standard Igbo. “Onyeisi agha nke narị ndị agha” is a more idiomatic and immediately transparent expression for the military office than “ọchịagha ndị agha narị.”
  terminology: “Sesaria,” “Kọniliọs,” and “Ìgwè Ndị Ịtali” are suitable renderings. The military-unit note appropriately identifies the cohort as Roman and retains the historical uncertainty concerning the designation.
  issues:
  - severity: low
    issue: The phrase “onye so n'ìgwè ndị agha” can sound like Cornelius was simply one member of the cohort.
    rationale: ἐκ σπείρης identifies the cohort with which the centurion was affiliated. “nke òtù ndị agha ...” expresses this relationship more directly while retaining the historical unit designation.
  - severity: low
    issue: “Ọchịagha ndị agha narị” is somewhat compressed and less natural than a genitive construction in Standard Igbo.
    rationale: “Onyeisi agha nke narị ndị agha” clearly communicates the rank denoted by ἑκατοντάρχης without adding doctrinal or historical claims.
