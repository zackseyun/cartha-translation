source:
  edition: SBLGNT
  text: Ἀνὴρ δέ ⸀τις ἐν Καισαρείᾳ ὀνόματι Κορνήλιος, ἑκατοντάρχης ἐκ σπείρης τῆς καλουμένης Ἰταλικῆς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/001.yaml
  text: There was a man in Caesarea named Cornelius[a], a centurion from the cohort called the Italian Cohort[b],
translation:
  language: ig
  text: Otu nwoke nọ na Sesaria, aha ya bụ Kọniliọs[a]. Ọ bụ onyeisi agha nke narị ndị agha, nke òtù ndị agha a na-akpọ Ìgwè Ndị Ịtali[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịtụgharị ya, “Otu nwoke nọ na Sesaria.” Okwu Grik ahụ ji okwu na-adịghị akọwapụta kpọmkwem webata onye ọhụrụ n'akụkọ ahụ.
    reason: lexical_alternative
  - marker: b
    text: “Ìgwè ndị agha” bụ otu ngalaba n'ime ndị agha Rom. O yikarịrị ka “Ìgwè Ndị Ịtali” bụ ngalaba e jikọtara na Ịtali, ma ọ bụ nke ndị agha si Ịtali mejupụtara.
    reason: cultural_note
lexical_decisions:
- source_word: Ἀνὴρ δέ τις
  choice: Otu nwoke ... nọ
  rationale: Akụkọ Igbo na-eji “otu nwoke” webata onye ọhụrụ a na-akọ banyere ya n'ụzọ ebumpụta ụwa; “nọ” na-egosipụta ọnọdụ ya na Sesaria. E tinyeghị δέ iche n'okwu n'ihi na ọ bụ njikọ akụkọ dị nro nke usoro ahịrịokwu Igbo na-egosipụtaworị.
- source_word: ἐν Καισαρείᾳ
  choice: na Sesaria
  rationale: Nke a bụ nkebiokwu na-egosi ebe; “Sesaria” bụ ntụgharị mkpụrụokwu aha obodo ahụ kwekọrọ n'usoro Igbo.
- source_word: ὀνόματι Κορνήλιος
  choice: aha ya bụ Kọniliọs
  rationale: Nke a bụ ụzọ Igbo doro anya ma dịkwa mfe isi kwuo na a na-akpọ nwoke ahụ Kọniliọs.
- source_word: ἑκατοντάρχης
  choice: ọchịagha ndị agha narị
  rationale: Nkọwa a na-eme ka ọkwa onyeisi agha Rom ahụ doo onye Igbo nke oge a anya, ma na-edobe echiche bụ isi nke okwu Grik.
- source_word: ἐκ σπείρης
  choice: onye so n'ìgwè ndị agha
  rationale: σπεῖρα bụ otu ngalaba ndị agha Rom; “ìgwè ndị agha” bụ okwu Igbo a na-aghọta ngwa ngwa, ebe ndetu ala na-enye nkọwa omenala.
- source_word: τῆς καλουμένης Ἰταλικῆς
  choice: a na-akpọ Ìgwè Ndị Ịtali
  rationale: Nke a na-edobe καλουμένης (“a na-akpọ”) ma na-egosi na Ἰταλικῆς bụ aha e ji mara ngalaba ndị agha ahụ.
