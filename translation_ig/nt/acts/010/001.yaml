translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke oge a ma dị ùgwù. E kewara ahịrịokwu ahụ ụzọ abụọ ka ọ na-asọ nke ọma n'Igbo, ma e debere ihe niile dị n'usoro Grik na mmekọrịta dị n'etiti ha.
