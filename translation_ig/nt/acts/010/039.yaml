id: ACT.10.39
reference: Acts 10:39
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ⸀ἡμεῖς μάρτυρες πάντων ὧν ἐποίησεν ἔν τε τῇ χώρᾳ τῶν Ἰουδαίων ⸀καὶ Ἰερουσαλήμ· ὃν καὶ ἀνεῖλαν κρεμάσαντες ἐπὶ ξύλου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/039.yaml
  text: And we are witnesses of all that he did both in the land of the Jews and in Jerusalem[a]. They also put him to death by hanging him on a tree.
translation:
  language: ig
  text: Anyị bụkwa ndị akaebe nke ihe niile o mere n’ala ndị Juu nakwa na Jerusalem. Ha gbukwara ya site n’ịkpọgide ya n’osisi[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “n’elu ihe e ji osisi mee”; ma ọ bụ, n’ụzọ nkọwa, “n’obe.” Okwu Grik pụtara “osisi” ma ọ bụ “ihe e ji osisi mee,” ọ ga-abụkwa na ọ na-echetara Diuterọnọmi 21:23.
    reason: lexical_alternative
lexical_decisions:
- source_word: μάρτυρες
  choice: ndị akaebe
  rationale: Nke a bụ okwu Igbo doro anya maka ndị na-agba akaebe banyere ihe ha hụrụ ma ọ bụ mara, ma kwekọọ n’ọrụ ndị ozi dị ka ndị hụrụ ihe ahụ anya.
- source_word: πάντων ὧν ἐποίησεν
  choice: nke ihe niile o mere
  rationale: Ọ na-echekwa ike zuru ezu nke πάντων ma na-ada nke ọma n’Igbo.
- source_word: ἔν τε τῇ χώρᾳ τῶν Ἰουδαίων
  choice: n’ala ndị Juu
  rationale: “Ala” nwere ike ịpụta mpaghara ma ọ bụ obodo mmadụ n’enweghị ịkọwapụta ya kpọmkwem dị ka ógbè Rom a na-akpọ Judia.
- source_word: Ἰουδαίων
  choice: ndị Juu
  rationale: Ọ bụ okwu Standard Igbo a na-aghọta nke ọma maka ndị Juu; nhazi “ala ndị Juu” ka na-edobe nghọta gbasara mpaghara.
- source_word: καὶ Ἰερουσαλήμ
  choice: nakwa na Jerusalem
  rationale: E tinyere “na” n’Igbo ka njikọ ebe abụọ ahụ doo anya ma bụrụ nke e ji asụsụ nkịtị ekwu.
- source_word: ἀνεῖλαν
  choice: gbukwara ya
  rationale: ἀναιρέω n’ebe a pụtara igbu mmadụ; “gburu ya” bụ ntụgharị Igbo kwụ ọtọ, doro anya, na-enweghị ịgbakwunye nkọwa ikpe na-adịghị n’okwu ahụ.
- source_word: κρεμάσαντες
  choice: site n’ịkpọgide ya
  rationale: “Site n’…” na-egosi na participle ahụ na-akọwa ụzọ ha si gbuo ya. “Ịkpọgide” dabara n’ọnọdụ igbu mmadụ n’elu osisi ma na-anọgide n’usoro okwu Greek.
- source_word: ἐπὶ ξύλου
  choice: n’osisi
  rationale: ξύλον nwere ike ịpụta osisi ma ọ bụ ihe e ji osisi mee. “Osisi” na-echekwa nhọrọ okwu Greek na njikọ o nwere ike inwe na Diuterọnọmi 21:23, kama iji “obe” kọwaa ya ozugbo.
theological_decisions:
- issue: Otu e si atụgharị ξύλου n’akụkọ ịkpọgide Jizọs
  choice: n’osisi
  alternative: n’obe; n’elu ihe e ji osisi mee
  rationale: Greek ji ξύλον, ọ bụghị σταυρός. “Osisi” na-echekwa okwu isi mmalite na mgbagwoju nghọta ya, tinyere nkwughachi o nwere ike ịbụ nke Diuterọnọmi 21:23; “obe” ga-akọwa ihe ahụ karịa ka okwu Greek n’onwe ya siri kwuo.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-agbaso usoro akaebe, ebe ọrụ ahụ mere, na ụzọ e si gbuo ya. E debere akara nkọwa ụkwụ [a] ozugbo n’akụkụ “osisi,” okwu nkọwa ahụ metụtara.
