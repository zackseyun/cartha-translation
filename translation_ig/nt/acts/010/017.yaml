revisions:
- from: Mgbe Pita ka nọ na-eche n’ime onwe ya, obi agbagwojuokwa ya anya banyere ihe ọhụụ ahụ ọ hụrụ pụrụ ịpụta[a], lee, ndị ikom ahụ Kọniliọs zitere, mgbe ha jụsịrị ndị mmadụ ụzọ ụlọ Saịmọn[b], bịara guzoro n’ọnụ ụzọ ámá.
  to: Mgbe Pita nọ na-enwe mgbagwoju anya n’ime onwe ya banyere ihe ọhụụ ahụ ọ hụrụ pụrụ ịpụta[a], lee, ndị ikom ahụ Kọniliọs zitere, mgbe ha jụsịrị ebe ụlọ Saịmọn dị, guzoro n’ọnụ ụzọ ámá[b].
  rationale: The revision removes an unsupported explicit reference to people, streamlines the rendering of Peter's continuing internal perplexity, and moves footnote b to the word it actually explains. It preserves the contextual “might mean” rendering while retaining the more literal “might be” in the footnote.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T09:17:27Z'
review_pass:
  verdict: revise
  source_fidelity: 'The central sense is retained: Peter is continuing in inward perplexity over the vision''s possible significance, and Cornelius''s men, after inquiring about Simon''s house, are at the gate. The draft''s explicit addition of “ndị mmadụ” (“people”) is not represented in the Greek and is unnecessary. The proposed wording more directly represents the imperfect ongoing perplexity and the prior inquiry expressed by the aorist participle.'
  naturalness: The opening coordination “na-eche n’ime onwe ya, obi agbagwojuokwa ya anya” is somewhat cumbersome and can suggest two separate actions. “nọ na-enwe mgbagwoju anya n’ime onwe ya” is more idiomatic Standard Igbo for sustained inward perplexity. “jụsịrị ebe ụlọ Saịmọn dị” is natural and does not add an explicit object of inquiry.
  terminology: “ọhụụ,” “lee,” “ndị ikom,” “Kọniliọs,” “Saịmọn,” and “ọnụ ụzọ ámá” are appropriate. The possible literal alternative for τί ἂν εἴη is properly retained in footnote a. Footnote b concerns πυλών and must be anchored to “ọnụ ụzọ ámá,” not to “Saịmọn.”
  issues:
  - severity: medium
    issue: Footnote b is attached to “Saịmọn” rather than to “ọnụ ụzọ ámá.”
    rationale: The footnote explains πυλών (“gate/gateway”), which is rendered by “ọnụ ụzọ ámá”; its present anchor misleadingly appears to qualify Simon or his house.
  - severity: low
    issue: “ndị mmadụ” is added in the rendering of διερωτήσαντες.
    rationale: The Greek states that the men made inquiries about Simon's house but does not specify that they asked people. The addition is avoidable in natural Igbo.
  - severity: low
    issue: The first clause is stylistically awkward and duplicates the internal-reflection/perplexity idea.
    rationale: The Greek has one imperfect verb for Peter's continuing inward perplexity; a more unified Igbo clause is clearer.
  revised_text: Mgbe Pita nọ na-enwe mgbagwoju anya n’ime onwe ya banyere ihe ọhụụ ahụ ọ hụrụ pụrụ ịpụta[a], lee, ndị ikom ahụ Kọniliọs zitere, mgbe ha jụsịrị ebe ụlọ Saịmọn dị, guzoro n’ọnụ ụzọ ámá[b].
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “ihe ọhụụ ahụ ọ hụrụ pụrụ ịbụ.” Nke a bụ nsụgharị ka dị nso n’okwu Grik; n’ebe a, o yikarịrị ka ọ na-ekwu banyere ihe ọhụụ ahụ pụtara ma ọ bụ mkpa ya.
    reason: lexical_alternative
  - marker: b
