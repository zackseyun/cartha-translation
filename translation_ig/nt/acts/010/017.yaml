    reason: lexical_alternative
  revision_rationale: The revision removes an unsupported explicit reference to people, streamlines the rendering of Peter's continuing internal perplexity, and moves footnote b to the word it actually explains. It preserves the contextual “might mean” rendering while retaining the more literal “might be” in the footnote.
