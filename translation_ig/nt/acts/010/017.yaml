id: ACT.10.17
reference: Acts 10:17
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ὡς δὲ ἐν ἑαυτῷ διηπόρει ὁ Πέτρος τί ἂν εἴη τὸ ὅραμα ὃ εἶδεν, ⸀ἰδοὺ οἱ ἄνδρες οἱ ἀπεσταλμένοι ⸀ὑπὸ τοῦ Κορνηλίου διερωτήσαντες τὴν οἰκίαν ⸀τοῦ Σίμωνος ἐπέστησαν ἐπὶ τὸν πυλῶνα,
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/017.yaml
  text: While Peter was inwardly perplexed as to what the vision that he had seen might mean[a], behold, the men who had been sent by Cornelius, having asked directions to Simon’s house[b], stood at the gate.
translation:
  language: ig
  text: Mgbe Pita nọ na-enwe mgbagwoju anya n’ime onwe ya banyere ihe ọhụụ ahụ ọ hụrụ pụrụ ịpụta[a], lee, ndị ikom ahụ Kọniliọs zitere, mgbe ha jụsịrị ebe ụlọ Saịmọn dị, guzoro n’ọnụ ụzọ ámá[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ihe ọhụụ ahụ ọ hụrụ pụrụ ịbụ.” Nke a bụ nsụgharị ka dị nso n’okwu Grik; n’ebe a, o yikarịrị ka ọ na-ekwu banyere ihe ọhụụ ahụ pụtara ma ọ bụ mkpa ya.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “n’ebe e si abanye.” Okwu Grik a nwere ike ịpụta ọnụ ụzọ ámá ma ọ bụ ebe e si abanye n’ụlọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὡς δὲ
  choice: Mgbe ... ka
  rationale: Na-egosi ihe abụọ na-eme n'otu oge ma na-aga n'ihu n'akụkọ ahụ n'Igbo dị larịị.
- source_word: ἐν ἑαυτῷ διηπόρει
  choice: na-eche n’ime onwe ya, obi agbagwojuokwa ya anya
  rationale: Na-echekwa ma echiche dị n'ime Pita ma mgbagwoju anya siri ike nke imperfect διηπόρει na-egosi.
- source_word: τί ἂν εἴη
  choice: ihe ... pụrụ ịpụta
  rationale: N'ọnọdụ a Pita na-achọ ịghọta ihe ọhụụ ahụ pụtara; ndetu ala na-echekwa nsụgharị nkịtị 'ihe ... pụrụ ịbụ.'
- source_word: τὸ ὅραμα ὃ εἶδεν
  choice: ọhụụ ahụ ọ hụrụ
  rationale: Nsụgharị Igbo dị nkenke ma kwekọọ na relative clause Grik.
- source_word: ἰδοὺ
  choice: lee
  rationale: Na-echekwa akara okwu nke na-adọta uche onye na-agụ n'ihe ọhụrụ mere.
- source_word: οἱ ἄνδρες οἱ ἀπεσταλμένοι ὑπὸ τοῦ Κορνηλίου
  choice: ndị ikom ahụ Kọniliọs zitere
  rationale: Na-akọwapụta na ha bụ ndị ikom ma na-enye passive Grik n'ụdị active Igbo dị mma, na-enweghị ịgbanwe onye zitere ha.
- source_word: διερωτήσαντες τὴν οἰκίαν τοῦ Σίμωνος
  choice: mgbe ha jụsịrị ndị mmadụ ụzọ ụlọ Saịmọn
  rationale: Aorist participle na-egosi na ịjụ ụzọ buru ụzọ mee; itinye 'ndị mmadụ' na-eme ka okwu ahụ bụrụ Igbo eke n'enweghị ịgbanwe isi ihe.
- source_word: ἐπέστησαν ἐπὶ τὸν πυλῶνα
  choice: bịara guzoro n’ọnụ ụzọ ámá
  rationale: Na-ejikọta echiche nke ịbịarute na iguzo n'ebe ahụ; 'ọnụ ụzọ ámá' nwere ike ịpụta gate ma ọ bụ entrance area.
theological_decisions:
- issue: Ma τί ἂν εἴη na-ajụ ihe ọhụụ ahụ bụ ma ọ bụ ihe ọ pụtara
  choice: ihe ọhụụ ahụ ... pụrụ ịpụta
  alternative: ihe ọhụụ ahụ ... pụrụ ịbụ
  rationale: Ọnọdụ akụkọ ahụ na-akwado ajụjụ banyere ihe ọhụụ ahụ pụtara, ma Grik n'onwe ya nwere ike ịsụgharị n'ụzọ nkịtị dịka 'ihe ọ pụrụ ịbụ'; e debere nke ahụ na ndetu ala.
translation_notes:
  register: Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ usoro okwu eke n'Igbo, ebe e chekwara ịdị mgbagwoju anya nke τί ἂν εἴη site na ndetu ala. A kpọrọ aha Κορνήλιος 'Kọniliọs' na Σίμων 'Saịmọn' dịka ntụgharị ụda aha ndị ahụ.
