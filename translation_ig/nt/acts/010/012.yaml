translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta mee nsụgharị ahụ. A họọrọ okwu sara mbara maka ἑρπετά ka a ghara ime ka ọ bụrụ naanị otu klas sayensị. Akara ntụaka ukwu abụọ ahụ pụtara n’ederede isi.
