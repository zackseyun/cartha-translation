  yaml_path: translation/nt/acts/010/012.yaml
  text: In it were all the four-footed animals and reptiles of the earth[c][b][a], and birds of the sky.
translation:
  language: ig
  text: N’ime ya, e nwere anụmanụ nwere ụkwụ anọ niile, ihe ndị na-akpụ akpụ nke ụwa,[a] na nnụnụ nke eluigwe.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ihe ndị na-arị arị nke ụwa.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “nnụnụ nke mbara igwe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ᾧ
  choice: N’ime ya
  rationale: Nnọchiaha njikọ a na-ezo aka n’ihe ahụ yiri akwa e kwuru okwu ya n’amaokwu bu ụzọ. “N’ime ya” bụ Igbo nkịtị ma na-edobe echiche nke ịnọ n’ime ihe ahụ.
- source_word: ὑπῆρχεν
  choice: e nwere
  rationale: N’ebe a, ngwaa ahụ na-egosi na ihe ndị ahụ dị n’ime ihe ahụ; “e nwere” na-enye echiche ahụ n’ụzọ doro anya n’Igbo na-enweghị ịgbakwụnye echiche siri ike nke na ihe ahụ ‘jupụtara’ na ha.
- source_word: πάντα
  choice: niile
  rationale: “Niile” na-edobe oke sara mbara nke okwu Grik ahụ, na-enweghị ịkọwa ya dịka “ụdị niile,” nke nwere ike ịbụ echiche gbakwunyere.
- source_word: τὰ τετράποδα
  choice: anụmanụ niile nwere ụkwụ anọ
  rationale: “Anụmanụ nwere ụkwụ anọ” bụ okwu Igbo dị mfe nghọta karịa okwu sayensị pụrụ iche; e jikọtara “niile” ya na aha a dị ka usoro Igbo si adị.
- source_word: ἑρπετὰ τῆς γῆς
  choice: ihe ndị na-akpụ akpụ n’elu ala
  rationale: ἑρπετά nwere ike ịgụnye ihe dị iche iche na-akpụ akpụ, ọ bụghị naanị anụmanụ ndị sayensị kpọrọ reptiles. Nsụgharị a na-edobe obosara okwu ahụ na njikọ ya na ala.
- source_word: πετεινὰ τοῦ οὐρανοῦ
  choice: nnụnụ ndị na-efe n’eluigwe
  rationale: “Nnụnụ” dabara ndepụta anụmanụ a; “ndị na-efe n’eluigwe” na-egosi njikọ ha na mbara elu n’Igbo nkịtị, ọ bụ ezie na οὐρανός nwekwara ike ịbụ “eluigwe.”
- source_word: καὶ ... καὶ
  choice: '..., na ...'
  rationale: Usoro ndepụta Igbo na-eji rikoma na “na” tupu ihe ikpeazụ; nke a na-ebuga njikọ ndị Grik n’ụzọ ebumpụta ụwa.
