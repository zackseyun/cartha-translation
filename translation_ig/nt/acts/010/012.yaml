revisions:
- from: N’ime ya, e nwere anụmanụ niile nwere ụkwụ anọ, ihe ndị na-akpụ akpụ n’elu ala,[a] na nnụnụ ndị na-efe n’eluigwe.[b]
  to: N’ime ya, e nwere anụmanụ nwere ụkwụ anọ niile, ihe ndị na-akpụ akpụ nke ụwa,[a] na nnụnụ nke eluigwe.[b]
  rationale: 'The revision retains the draft’s clear, broad terms for the animal categories, but restores the source’s genitive classifications: creeping things ‘of the earth’ and birds ‘of the sky/heaven.’ The footnote anchors remain attached to the relevant terms, and no disputed or doctrinal interpretation has been added.'
  reviewer_model: gpt-5.6-terra
