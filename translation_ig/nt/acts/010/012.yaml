    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “nnụnụ nke mbara igwe.”
    reason: lexical_alternative
  revision_rationale: 'The revision retains the draft’s clear, broad terms for the animal categories, but restores the source’s genitive classifications: creeping things ‘of the earth’ and birds ‘of the sky/heaven.’ The footnote anchors remain attached to the relevant terms, and no disputed or doctrinal interpretation has been added.'
