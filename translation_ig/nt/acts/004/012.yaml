id: ACT.4.12
reference: Acts 4:12
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ οὐκ ἔστιν ἐν ἄλλῳ οὐδενὶ ἡ σωτηρία, ⸀οὐδὲ γὰρ ὄνομά ἐστιν ἕτερον ⸂ὑπὸ τὸν οὐρανὸν⸃ τὸ δεδομένον ἐν ἀνθρώποις ἐν ᾧ δεῖ σωθῆναι ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/012.yaml
  text: And there is salvation in no one else[a], for there is no other name under heaven given among men by which we must be saved.
translation:
  language: ig
  text: Nzọpụta adịghịkwa n’ime onye ọzọ ọ bụla, n’ihi na ọ dịghị aha ọzọ e nyere n’etiti ụmụ mmadụ n’okpuru eluigwe nke ọ dị mkpa ka e site na ya zọpụta anyị.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σωτηρία
  choice: nzọpụta
  rationale: Okwu a na-egosi nzọpụta ma ọ bụ nnapụta; n’ebe a, “nzọpụta” na-egosipụta nke ọma ma ike okwu ahụ n’ozuzu ya ma ihe ọ pụtara n’okwuchukwu Pita banyere ọrụ pụrụ iche Jizọs nwere n’ịzọpụta.
- source_word: ἐν ἄλλῳ οὐδενί
  choice: n’onye ọ bụla ọzọ
  rationale: Nke a na-echekwa na okwu Grik na-ekwu banyere onye, ma na-egosikwa n’enweghị mgbagwoju anya na nzọpụta adịghị n’onye ọzọ.
- source_word: ὄνομα
  choice: aha
  rationale: E debere ihe oyiyi okwu Grik ahụ kama ịkọwa ya dịka “onye” ma ọ bụ “ikike,” n’ihi na “aha” nwere ike ịgụnye onye ahụ, ikike ya, na njirimara ya.
- source_word: ἕτερον
  choice: ọzọ
  rationale: N’usoro nkwụsi ike a, “aha ọzọ adịghị” bụ Igbo ebumpụta ụwa ma na-echekwa nkwupụta ahụ banyere enweghị onye ọzọ.
- source_word: ὑπὸ τὸν οὐρανόν
  choice: n’okpuru eluigwe
  rationale: Nke a na-echekwa akpaalaokwu Baịbụl na ịdị nsọ nke ụda okwu ahụ, ma na-egosikwa ebe mmadụ niile nọ.
- source_word: δεδομένον ἐν ἀνθρώποις
  choice: nke e nyere n’etiti ụmụ mmadụ
  rationale: “Ụmụ mmadụ” na-egosipụta kpọmkwem na ἀνθρώποις bụ okwu gbasara mmadụ niile; “n’etiti” na-echekwa echiche nke aha ahụ e nyere n’ime ụwa mmadụ, ọ bụghị nanị na e nyere ya mmadụ dịka ndị nnata.
- source_word: ἐν ᾧ
  choice: nke a ga-eji
  rationale: Nke a bụ ụzọ Igbo si egosipụta ihe e ji eme ihe, ebe onye nnọchi anya ahụ na-ezo aka n’“aha.”
- source_word: δεῖ
  choice: a ga-
  rationale: N’usoro “a ga-eji zọpụta anyị,” nke a na-egosipụta mkpa ma ọ bụ iwu dị n’okwu δεῖ n’Igbo dị mfe ma dị ike.
- source_word: σωθῆναι
  choice: zọpụta anyị
  rationale: Ụdị okwu a na-echekwa echiche passive nke ịbụ ndị a zọpụtara n’usoro Igbo ebumpụta ụwa, na-ejikọkwa ya na “nzọpụta” dị na mmalite amaokwu ahụ.
theological_decisions:
- issue: Nanị Jizọs ka nzọpụta dị n’ime ya
  choice: “Nzọpụta adịghịkwa n’onye ọ bụla ọzọ”
  alternative: Ịsụgharị ya n’ụzọ dị nro dịka “ụzọ nzọpụta ọzọ adịghị.”
  rationale: Grik ahụ na-ekwu hoo haa na nzọpụta adịghị n’onye ọ bụla ọzọ, ma kwado ya site n’ikwu na aha ọzọ adịghị. Nsụgharị ahụ echekwala nkwupụta a n’etinyeghị nkọwa ozizi ọzọ.
- issue: Ihe ἀνθρώποις na-ezo aka na ya
  choice: “n’etiti ụmụ mmadụ”
  alternative: “n’etiti mmadụ” ma ọ bụ okwu nwoke pụrụ ime ka ụfọdụ ghọta ya dịka naanị ndị nwoke.
  rationale: N’ebe a, ἀνθρώποις na-ezo aka n’ụmụ mmadụ niile. “Ụmụ mmadụ” bụ Igbo doro anya, ebumpụta ụwa, nke na-echekwa nghọta ahụ n’enweghị mkpa maka nkọwa ala peeji.
- issue: Ike δεῖ
  choice: “nke a ga-eji zọpụta anyị”
  alternative: “nke a pụrụ iji zọpụta anyị.”
  rationale: “A ga-eji” na-echekwa mkpa dị n’okwu δεῖ, ebe “a pụrụ iji” ga-eme ka ọ bụrụ naanị ohere ma mee ka ike okwu Grik ahụ daa.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. A hapụrụ “aha” na “n’okpuru eluigwe” iji chekwaa ihe oyiyi na ụda okwu Grik. E jirila “ụmụ mmadụ” gosipụta n’enweghị mgbagwoju anya na okwu ahụ na-agụnye mmadụ niile; ya mere, ọ dịghị mkpa itinye akara ma ọ bụ nkọwa ala peeji.
