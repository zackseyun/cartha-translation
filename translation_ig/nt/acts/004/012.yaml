revisions:
- from: Nzọpụta adịghịkwa n’onye ọ bụla ọzọ, n’ihi na aha ọzọ adịghị n’okpuru eluigwe nke e nyere n’etiti ụmụ mmadụ, nke a ga-eji zọpụta anyị.
  to: Nzọpụta adịghịkwa n’ime onye ọzọ ọ bụla, n’ihi na ọ dịghị aha ọzọ e nyere n’etiti ụmụ mmadụ n’okpuru eluigwe nke ọ dị mkpa ka e site na ya zọpụta anyị.
  rationale: 'The revision preserves the Greek word order and exclusivist force while explicitly rendering δεῖ as necessity: “ọ dị mkpa ka.” It retains “aha” without reducing it to person or authority, keeps the biblical idiom “n’okpuru eluigwe,” and uses “ụmụ mmadụ” for humanity in general. No textual or lexical ambiguity requires a footnote in Igbo.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T08:27:56Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the verse’s central claim that salvation is found in no one else and retains the imagery of the unique name given among humanity under heaven. However, “a ga-eji zọpụta anyị” only indirectly conveys δεῖ (“it is necessary/must”) and can read as a general future/passive construction rather than the stated necessity. The revised wording explicitly retains that force and makes the instrumental relation to the name clear.
  naturalness: The draft is generally clear Standard Igbo. “N’ime onye ọzọ ọ bụla” is more idiomatic and semantically explicit for salvation being found in a person than “n’onye ọ bụla ọzọ.” Recasting the final relative clause removes possible ambiguity and reads naturally in a formal biblical register.
  terminology: “Nzọpụta,” “aha,” “n’etiti ụmụ mmadụ,” and “n’okpuru eluigwe” are suitable, accurate Standard Igbo choices. “Ụmụ mmadụ” correctly represents generic ἀνθρώποις without requiring a footnote.
  issues:
  - severity: medium
    issue: The force of δεῖ is not explicit in “nke a ga-eji zọpụta anyị.”
    rationale: δεῖ expresses necessity, not merely a future or passive means. “Ọ dị mkpa ka …” directly preserves this element without importing doctrinal explanation.
  - severity: low
    issue: “N’onye ọ bụla ọzọ” is less precise than an explicitly internal/personal construction.
    rationale: The Greek ἐν ἄλλῳ οὐδενί locates salvation in no other person. “N’ime onye ọzọ ọ bụla” conveys this relation more clearly in idiomatic Igbo.
  revised_text: Nzọpụta adịghịkwa n’ime onye ọzọ ọ bụla, n’ihi na ọ dịghị aha ọzọ e nyere n’etiti ụmụ mmadụ n’okpuru eluigwe nke ọ dị mkpa ka e site na ya zọpụta anyị.
  revised_footnotes: []
  revision_rationale: 'The revision preserves the Greek word order and exclusivist force while explicitly rendering δεῖ as necessity: “ọ dị mkpa ka.” It retains “aha” without reducing it to person or authority, keeps the biblical idiom “n’okpuru eluigwe,” and uses “ụmụ mmadụ” for humanity in general. No textual or lexical ambiguity requires a footnote in Igbo.'
