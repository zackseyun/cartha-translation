id: ACT.4.4
reference: Acts 4:4
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: πολλοὶ δὲ τῶν ἀκουσάντων τὸν λόγον ἐπίστευσαν, καὶ ἐγενήθη ⸀ὁ ἀριθμὸς τῶν ἀνδρῶν ⸀ὡς χιλιάδες πέντε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/004.yaml
  text: But many of those who had heard the message believed[b][a], and the number of the men became about five thousand.
translation:
  language: ig
  text: Ma ọtụtụ n’ime ndị nụrụ ozi ahụ[a] kweere; ọnụ ọgụgụ ndị ikom[b] wee bụrụ ihe dị ka puku ise.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “okwu ahụ.” N’ebe a, λόγος na-ezo aka n’ozi ma ọ bụ nkwusa ndịozi.
    reason: lexical_alternative
  - marker: b
    text: Grik kwuru, “ọnụ ọgụgụ ndị ikom.” O nwere ike ịbụ na nke a bụ ọnụ ọgụgụ ndị nwoke, ọ bụghị ọnụ ọgụgụ mmadụ niile—ndị nwoke na ndị nwanyị—nọ n’ìgwè ahụ.
    reason: cultural_note
lexical_decisions:
- source_word: πολλοὶ
  choice: ọtụtụ
  rationale: Nke a na-edobe echiche nke ọnụ ọgụgụ buru ibu ma a na-akọwaghị kpọmkwem ole ha dị.
- source_word: δὲ
  choice: Ma
  rationale: Ọ na-egosi ọdịiche dị n’etiti mmegide na njide e kwuru n’amaokwu ndị bu ụzọ na nzaghachi nke ndị nụrụ ozi ahụ.
- source_word: ἀκουσάντων τὸν λόγον
  choice: ndị nụrụ ozi ahụ
  rationale: “Ozi” na-eme ka o doo anya na λόγος n’ebe a bụ nkwusa ndịozi; “okwu” ka bụ nsụgharị ọzọ kwere omume, ya mere e nyere ya n’ala ala peeji.
- source_word: ἐπίστευσαν
  choice: kweere
  rationale: Ọ bụ nsụgharị dị mfe ma kwụ ọtọ nke πιστεύω, na-etinyeghị nkọwa ozizi karịrị ihe Grik kwuru.
- source_word: ἐγενήθη ὁ ἀριθμὸς
  choice: ọnụ ọgụgụ ... wee bụrụ
  rationale: Nke a na-egosipụta ọnọdụ ọhụrụ ọnụ ọgụgụ ahụ ruru n’ụzọ dị mma n’asụsụ Igbo, n’enweghị ịgbakwunye na ọ bụ naanị mmụba ka e bu n’uche.
- source_word: τῶν ἀνδρῶν
  choice: ndị ikom
  rationale: ἀνήρ na-ezokarị aka n’ebe ndị nwoke nọ, ọ bụghị mmadụ niile n’ozuzu; ya mere, a hapụrụ nkọwa gbasara okike dị n’ihe odide Grik.
- source_word: ὡς χιλιάδες πέντε
  choice: ihe dị ka puku ise
  rationale: “Ihe dị ka” na-edobe echiche approximation nke ὡς tupu ọnụ ọgụgụ.
theological_decisions:
- issue: Ma τῶν ἀνδρῶν ọ̀ bụ naanị ndị nwoke ka a gụrụ
  choice: ndị ikom
  alternative: ndị mmadụ; ndị kwere ekwe
  rationale: Ihe odide Grik ji okwu na-ezokarị aka n’ebe ndị nwoke nọ. Nsụgharị ahụ anaghị ekpebi na ụmụ nwanyị anọghị n’ọgbakọ ahụ; ọ na-edobe naanị otú amaokwu a si kọwaa ndị a gụrụ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. Akara semicolon na-ekewa okwukwe ndị nụrụ ozi ahụ na nsonaazụ ọnụ ọgụgụ ahụ n’enweghị ime ka ha bụrụ ahịrịokwu abụọ na-enweghị njikọ.
