source:
  edition: SBLGNT
  text: οἱ δὲ προσαπειλησάμενοι ἀπέλυσαν αὐτούς, μηδὲν εὑρίσκοντες τὸ πῶς ⸀κολάσωνται αὐτούς, διὰ τὸν λαόν, ὅτι πάντες ἐδόξαζον τὸν θεὸν ἐπὶ τῷ γεγονότι·
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/021.yaml
  text: So after further threatening them[a], they released them, finding no way to punish them because of the people, since everyone was glorifying God for what had happened.
translation:
  language: ig
  text: Ma, mgbe ha yikwuru ha egwu ọzọ[a], ha hapụrụ ha ka ha laa. Ha ahụghị ụzọ ha ga-esi taa ha ahụhụ n’ihi ndị mmadụ, n’ihi na ndị mmadụ niile nọ na-enye Chineke otuto maka ihe ahụ mere.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “mgbe ha yikwara ha egwu ọzọ” ma ọ bụ “mgbe ha tinyekwara iyi egwu.” Okwu Grik προσαπειλησάμενοι na-egosi iyi egwu agbakwunyere ma ọ bụ nke e mere ka ọ sie ike karịa nke e kwuburu.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσαπειλησάμενοι
  choice: mgbe ha yikwuru ha egwu ọzọ
  rationale: “Yikwuru ... egwu ọzọ” na-egosi na ndị ọchịchị tinyekwara iyi egwu n’ihe ha kwuru na mbụ, ma na-ada nke ọma n’Igbo ugbu a.
- source_word: ἀπέλυσαν
  choice: ha hapụrụ ha ka ha laa
  rationale: N’ọnọdụ a, okwu ahụ pụtara ịtọhapụ ndị e jidere; nkebiokwu a bụ Igbo doro anya ma kwekọọ n’ọnọdụ njide ahụ.
- source_word: μηδὲν εὑρίσκοντες τὸ πῶς κολάσωνται αὐτούς
  choice: Ha ahụghị ụzọ ha ga-esi taa ha ahụhụ
  rationale: Nke a na-edobe echiche nke “enweghị ụzọ ha ga-esi” mee ntaramahụhụ, kama ịsụgharị μηδέν n’ụzọ ga-ada mgbagwoju anya n’Igbo.
- source_word: διὰ τὸν λαόν
  choice: n’ihi ndị mmadụ
  rationale: διά na accusative na-egosi ihe kpatara ya; “ndị mmadụ” na-ezo aka n’ọha mmadụ, ọ bụghị naanị ìgwè mmadụ nọ otu ebe.
- source_word: πάντες
  choice: mmadụ niile
  rationale: Nke a na-edobe nghọta zuru ụwa ọnụ nke πάντες n’ime ọnọdụ a.
- source_word: ἐδόξαζον τὸν θεόν
  choice: nọ na-enye Chineke otuto
  rationale: “Inye Chineke otuto” na-echekwa asụsụ nke ịkwanyere Chineke ugwu dị na δοξάζω; “nọ na-” na-egosikwa omume na-aga n’ihu nke imperfect.
- source_word: ἐπὶ τῷ γεγονότι
  choice: maka ihe ahụ mere
  rationale: Nke a bụ ụzọ Igbo sitere n’okike isi gosi na ihe ahụ mere bụ ihe mere ha ji enye Chineke otuto.
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. A họọrọ “taa ha ahụhụ” maka ntaramahụhụ ndị ọchịchị, ebe “nye Chineke otuto” na-echekwa okwu okpukpe nke ederede Grik.
