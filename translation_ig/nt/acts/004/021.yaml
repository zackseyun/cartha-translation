  to: Ma, mgbe ha yikwuru ha egwu ọzọ[a], ha hapụrụ ha ka ha laa. Ha ahụghị ụzọ ha ga-esi taa ha ahụhụ n’ihi ndị mmadụ, n’ihi na ndị mmadụ niile nọ na-enye Chineke otuto maka ihe ahụ mere.
