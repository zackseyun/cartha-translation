  to: Ka unu niile na ndị Izrel niile mara na ọ bụ n’aha Jizọs, bụ Mesaya ahụ, onye Nazaret[a], onye unu kpọgidere n’obe, onye Chineke kpọlitere site n’etiti ndị nwụrụ anwụ—ọ bụ site n’aha a[b] ka nwoke a ji guzo n’ihu unu n’ahụ ike[c].
