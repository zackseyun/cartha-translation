id: ACT.4.10
reference: Acts 4:10
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: γνωστὸν ἔστω πᾶσιν ὑμῖν καὶ παντὶ τῷ λαῷ Ἰσραὴλ ὅτι ἐν τῷ ὀνόματι Ἰησοῦ Χριστοῦ τοῦ Ναζωραίου, ὃν ὑμεῖς ἐσταυρώσατε, ὃν ὁ θεὸς ἤγειρεν ἐκ νεκρῶν, ἐν τούτῳ οὗτος παρέστηκεν ἐνώπιον ὑμῶν ὑγιής.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/010.yaml
  text: let it be known to all of you and to all the people of Israel that in the name of Jesus the Messiah the Nazarene[a], whom you crucified[c][b], whom God raised from the dead—by this name this man stands before you healthy.
translation:
  language: ig
  text: Ka unu niile na ndị Izrel niile mara na ọ bụ n’aha Jizọs, bụ Mesaya ahụ, onye Nazaret[a], onye unu kpọgidere n’obe, onye Chineke kpọlitere site n’etiti ndị nwụrụ anwụ—ọ bụ site n’aha a[b] ka nwoke a ji guzo n’ihu unu n’ahụ ike[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “Jizọs Kraịst onye Nazaret.” Okwu Grik bụ Χριστός; ọ nwere ike ịbụ utu aha “Mesaya” ma ọ bụ bụrụ “Kraịst” mgbe e ji ya dịka akụkụ aha.
    reason: alternative_reading
  - marker: b
    text: A pụkwara ịsụgharị ya, “site n’onye a.” Okwu Grik ahụ nwere ike izo aka na Jizọs n’onwe ya ma ọ bụ kpọmkwem n’aha ya a ka kpọtụrụ.
    reason: lexical_alternative
  - marker: c
    text: A pụkwara ịsụgharị ya, “ahụ ya zuru oke” ma ọ bụ “ahụ adịla ya mma.” Okwu Grik ὑγιής na-egosi ahụ zuru oke ma ọ bụ ahụ e mere ka ọ dịghachi mma.
    reason: lexical_alternative
lexical_decisions:
- source_word: γνωστὸν ἔστω
  choice: Ka ... mara
  rationale: Nke a bụ ụzọ Igbo dị ugbu a si ekwupụta iwu ka ihe bụrụ ihe mmadụ niile maara, ma na-edobe ụda nkwupụta ihu ọha.
- source_word: πᾶσιν ὑμῖν καὶ παντὶ τῷ λαῷ Ἰσραήλ
  choice: unu niile na ndị Izrel niile
  rationale: 'Ọ na-edobe ìgwè abụọ ahụ: ndị Pita na-agwa okwu ozugbo na ndị Izrel n’ozuzu ha.'
- source_word: ἐν τῷ ὀνόματι
  choice: n’aha
  rationale: Ọ na-edobe akpaalaokwu Grik nke na-egosi aha ahụ dịka ụzọ ma ọ bụ ike e ji mee ka ahụ dị nwoke ahụ mma.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jizọs, bụ Mesaya ahụ
  rationale: A sụgharịrị Χριστός dịka utu aha 'Mesaya,' ọ bụghị dịka aha nna, ebe 'bụ ... ahụ' na-eme ka o doo anya ma dịrị Igbo mfe.
- source_word: τοῦ Ναζωραίου
  choice: onye Nazaret
  rationale: Nke a na-egosi onye sitere Nazaret ma na-edobe ọdịdị utu aha nke Ναζωραῖος.
- source_word: ὃν ὑμεῖς ἐσταυρώσατε
  choice: onye unu kpọgidere n’obe
  rationale: Ọ na-edobe ebubo Pita kpọmkwem na ọrụ ndị na-ege ya ntị mere.
- source_word: ὃν ὁ θεὸς ἤγειρεν ἐκ νεκρῶν
  choice: onye Chineke mere ka o si n’etiti ndị nwụrụ anwụ bilie
  rationale: Ọ na-edobe Chineke dịka onye mere ihe ahụ nakwa echiche nke mbilite n’ọnwụ.
- source_word: ἐν τούτῳ
  choice: site n’aha a
  rationale: Ọ na-ejikọta demonstrative ahụ na 'aha' a kpọtụrụla, ma na-egosi ụzọ e si mee ka nwoke ahụ dị mma; a debere nghọta ọzọ na nkọwa ala peeji.
- source_word: οὗτος παρέστηκεν ἐνώπιον ὑμῶν
  choice: nwoke a ji guzo n’ihu unu
  rationale: A gbakwụnyere 'nwoke' iji mee onye demonstrative ahụ na-ezo aka na ya doo anya; 'guzo' na-egosipụta ọnọdụ ọ nọ ugbu a.
- source_word: ὑγιής
  choice: n’ahụ ike
  rationale: Ọ bụ okwu Igbo doro anya maka ahụ a gwọrọ nke dịzi mma ma sie ike.
theological_decisions:
- issue: Ịsụgharị Χριστός dịka utu aha ma ọ bụ dịka akụkụ aha
  choice: Mesaya
  alternative: Kraịst
  rationale: N’ihu ndị isi Izrel, utu aha nke onye e tere mmanụ ka na-arụ ọrụ nke ọma; ya mere a sụgharịrị ihe ọ pụtara kama ime ya naanị akụkụ aha.
- issue: Ihe ἐν τούτῳ na-ezo aka na ya
  choice: site n’aha a
  alternative: site n’onye a
  rationale: Ọ nwere ike ịlaghachi n’aha Jizọs a kpọtụrụla ma ọ bụ n’ebe Jizọs n’onwe ya nọ. Isi ederede họọrọ 'aha a' n’ihi njikọ ya na ἐν τῷ ὀνόματι, ma nkọwa ala peeji na-echekwa ihe ọzọ o nwere ike ịpụta.
- issue: Okwu banyere mbilite n’ọnwụ
  choice: onye Chineke mere ka o si n’etiti ndị nwụrụ anwụ bilie
  alternative: onye Chineke kpọlitere n’ọnwụ
  rationale: Nhọrọ a na-edobe onye mere ihe ahụ, ya bụ Chineke, na okwu Grik ἐκ νεκρῶν n’enweghị ịgbakwunye nkọwa ozizi ọzọ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-edobe ụda nkwupụta Pita na ebubo ya kpọmkwem, ebe akara nkwụsị ogologo na-eme ka okwu ikpeazụ banyere nwoke a gwọrọ pụta ìhè.
