review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the authoritative order and the emphatic comprehensive prohibition. However, “kpọbatara ha” (“brought them in”) adds a movement component not expressed by καλέσαντες; “kpọrọ ha ka ha bịa” more directly represents summoning/calling them. The coordinated negative should also unambiguously prohibit both speaking and teaching, as μηδὲ does.
  naturalness: The revision uses clear, modern Standard Igbo. “Ghara kwa” is a natural negative coordination here and avoids a possible disjunctive reading of “ma ọ bụ.”
  terminology: “N’aha Jizọs” is established Standard Igbo biblical usage and suitably retains the source phrase’s reference/authority range without imposing a narrower interpretation. “Nye ha iwu” appropriately renders the force of παρήγγειλαν.
  issues:
  - severity: medium
    issue: “kpọbatara ha” adds ‘bring in’ to καλέσαντες.
    rationale: The Greek states that they called/summoned them, without itself specifying that they physically brought them in. The surrounding narrative may make this plausible, but the translation should not add it where a direct natural rendering is available.
  - severity: medium
    issue: “ma ọ bụ izi ihe” can be read as an ordinary alternative rather than an emphatic ‘nor’ coordination.
    rationale: μηδὲ prohibits teaching in addition to speaking. “Ghara kwa izi ihe” clearly expresses the coordinated second prohibition in Igbo.
  revised_text: Mgbe ha kpọrọ ha ka ha bịa, ha nyere ha iwu ka ha ghara ikwu okwu ma ọlị, ghara kwa izi ihe n’aha Jizọs.
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “ka ha ghara ikwu ihe ọ bụla ma ọlị, ghara kwa izi ihe n’aha Jizọs.”
    reason: lexical_alternative
  revision_rationale: The revision removes the added ‘bringing in’ sense, renders the summons directly and naturally, and makes the Greek μηδέ coordination explicit. The footnote is retained with matching, structurally sound wording.
