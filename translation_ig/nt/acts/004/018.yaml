revisions:
- from: Mgbe ha kpọbatara ha[a], ha nyere ha iwu ka ha ghara ikwu okwu ma ọlị ma ọ bụ izi ihe n’aha Jizọs.
  to: Mgbe ha kpọrọ ha ka ha bịa, ha nyere ha iwu ka ha ghara ikwu okwu ma ọlị, ghara kwa izi ihe n’aha Jizọs.
  rationale: The revision removes the added ‘bringing in’ sense, renders the summons directly and naturally, and makes the Greek μηδέ coordination explicit. The footnote is retained with matching, structurally sound wording.
  reviewer_model: gpt-5.6-terra
