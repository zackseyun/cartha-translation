id: ACT.4.18
reference: Acts 4:18
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ καλέσαντες αὐτοὺς παρήγγειλαν ⸀τὸ καθόλου μὴ φθέγγεσθαι μηδὲ διδάσκειν ἐπὶ τῷ ὀνόματι τοῦ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/018.yaml
  text: And after calling them in[a], they ordered them not to speak at all nor teach in the name of Jesus.
translation:
  language: ig
  text: Mgbe ha kpọrọ ha ka ha bịa, ha nyere ha iwu ka ha ghara ikwu okwu ma ọlị, ghara kwa izi ihe n’aha Jizọs.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καλέσαντες
  choice: Mgbe ha kpọbatara ha
  rationale: Aorist participle ahụ na-egosi ihe mere tupu ngwaa bụ isi. “Mgbe ha kpọbatara ha” na-egosi ma usoro oge ahụ ma ọnọdụ ikpe ahụ n’Igbo doro anya.
- source_word: παρήγγειλαν
  choice: ha nyere ha iwu
  rationale: Okwu a na-egosi ntụziaka e nyere site n’ike ọchịchị; “nyere ha iwu” bụ okwu Igbo doro anya ma sie ike dịka isi mmalite ahụ.
- source_word: τὸ καθόλου
  choice: ma ọlị
  rationale: Nkebiokwu a na-eme ka mmachibido ahụ gbasaa kpamkpam. “Ma ọlị” na-egosi na a machibidoro ikwu okwu ahụ n’ụzọ zuru ezu.
- source_word: μὴ φθέγγεσθαι
  choice: ka ha ghara ikwu okwu
  rationale: φθέγγομαι pụtara ikwu ma ọ bụ ịkpọpụta okwu. “Ikwu okwu” bụ ntụgharị Igbo dị mfe ma kwekọọ n’ebe a.
- source_word: μηδὲ διδάσκειν
  choice: ma ọ bụ izi ihe
  rationale: μηδέ jikọtara mmachibido nke abụọ na nke mbụ. N’usoro na-adịghị mma nke Igbo, “ma ọ bụ izi ihe” na-egosi na a machibidoro omume abụọ ahụ.
- source_word: ἐπὶ τῷ ὀνόματι τοῦ Ἰησοῦ
  choice: n’aha Jizọs
  rationale: Nkebiokwu a na-ezo aka n’ikwu ma ọ bụ ime ihe gbasara Jizọs ma ọ bụ site n’ikike aha ya. “N’aha Jizọs” bụ ntụgharị Igbo a na-aghọta nke ọma ma na-edobe ohere nghọta ndị ahụ.
- source_word: Ἰησοῦ
  choice: Jizọs
  rationale: A sụgharịrị aha onye ahụ dịka ntụgharị ụda ya si dị n’Igbo ọkọlọtọ.
theological_decisions:
- issue: Ókè mmachibido iwu banyere ịgba ama maka Jizọs
  choice: Iwu ahụ machibidoro ma ikwu okwu ma izi ihe n’aha Jizọs kpamkpam.
  alternative: Ọ pụrụ ịbụ naanị ikwusa ozi n’ihu ọha ka a machibidoro, ọ bụghị ụdị okwu niile.
  rationale: Njikọ τὸ καθόλου na μὴ φθέγγεσθαι μηδὲ διδάσκειν na-egosi mmachibido siri ike metụtara ma ikwu okwu ma izi ihe. A naghị eme ka ihe odide ahụ dị warara karịa ka Grik si kwuo.
translation_notes:
  register: E ji Igbo ọkọlọtọ nke oge a, dị ùgwù ma dị mfe nghọta. “Kpọbatara” dabara n’ọnọdụ ebe a kpọghachiri ndịozi ahụ n’ihu nzukọ ahụ; “nyere ha iwu” na-edobe ike iwu ahụ n’enweghị asụsụ ochie ma ọ bụ nke otu ụka pụrụ iche.
