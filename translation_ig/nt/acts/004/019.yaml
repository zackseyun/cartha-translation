  text: ὁ δὲ Πέτρος καὶ Ἰωάννης ἀποκριθέντες ⸂εἶπον πρὸς αὐτούς⸃· Εἰ δίκαιόν ἐστιν ἐνώπιον τοῦ θεοῦ ὑμῶν ἀκούειν μᾶλλον ἢ τοῦ θεοῦ, κρίνατε,
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/019.yaml
  text: But Peter and John answered and said to them[a], “If it is right in the sight of God to listen to you rather than to God, judge for yourselves.”
translation:
  language: ig
  text: 'Ma Pita na Jọn zara ha, sị: “Ọ bụrụ na ọ ziri ezi n’anya Chineke ige unu ntị karịa ige Chineke ntị, kpebienụ.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ, n''ụzọ na-akọwa ihe okwu ahụ pụtara karịa: “irubere unu isi karịa irubere Chineke isi.” Ngwaa Grik ahụ pụtara kpọmkwem “ịnụ/ige ntị,” ma n’ọnọdụ a ọ gụnyere ịṅa ntị n’iwu na irube isi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ Πέτρος καὶ Ἰωάννης
  choice: Ma Pita na Jọn
  rationale: ‘Ma’ na-egosi mgbanwe nwere ntakịrị mmegide n'okwu, dịka δέ si arụ ọrụ n'ebe a.
- source_word: ἀποκριθέντες ... εἶπον πρὸς αὐτούς
  choice: zara ha, sị
  rationale: Nke a na-egosipụta ma nzaghachi ahụ ma okwu e kwuru, ma na-ada nke ọma n'Igbo karịa ịsụgharị usoro Grik ahụ n'ụzọ siri ike.
- source_word: δίκαιόν
  choice: ihe ziri ezi
  rationale: Nhọrọ a na-egosi ihe kwesịrị ekwesị ma ọ bụ ihe kwụ ọtọ n'ihu ikpe Chineke, n'asụsụ Igbo doro anya.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: n'anya Chineke
  rationale: Akpaalaokwu Igbo a na-echekwa echiche nke ihe Chineke na-ahụ ma na-ekpe ikpe banyere ya.
- source_word: ἀκούειν
  choice: ige ... ntị
  rationale: Nke a na-edebe ihe ngwaa Grik ahụ pụtara kpọmkwem—ịnụ ma ọ bụ ige ntị—ebe ọnọdụ okwu ahụ ka na-egosi ịṅa ntị n'iwu na irube isi.
- source_word: μᾶλλον ἢ
  choice: karịa
  rationale: ‘Karịa’ na-enye ntụnyere doro anya n'etiti ige ndị ọchịchị ntị na ige Chineke ntị.
- source_word: κρίνατε
  choice: Kpebienụ n'onwe unu
  rationale: Imperativ a na-akpọ ndị na-ege ntị ka ha nyochaa okwu ahụ ma mee mkpebi; ‘n'onwe unu’ na-eme ka ịma aka ahụ pụta ìhè.
theological_decisions:
- issue: Ma a ga-asụgharị ἀκούειν dịka ‘irubere isi’ n'ihi na ọnọdụ okwu ahụ metụtara ikike na nrubeisi
  choice: E debere ‘ige ... ntị’ n'ahịrịokwu bụ isi.
  alternative: ‘irubere unu isi karịa irubere Chineke isi’
  rationale: Ọnọdụ okwu ahụ na-egosi nrubeisi, ma Grik ji ngwaa pụtara ‘ịnụ/ige ntị,’ ọ bụghị ngwaa nrubeisi doro anya. Ya mere, ntụgharị ahụ na-echekwa okwu isi mmalite na esemokwu dị n'etiti ige mmadụ ntị na ige Chineke ntị.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. ‘Kpebienụ’ na-egosi na a na-agwa ọtụtụ mmadụ okwu; ‘n'anya Chineke’ bụ akpaalaokwu eke nke na-echekwa akụkụ ikpe na nyocha dị na Grik.
