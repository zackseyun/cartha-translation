  to: 'Ma Pita na Jọn zara ha, sị: “Ọ bụrụ na ọ ziri ezi n’anya Chineke ige unu ntị karịa ige Chineke ntị, kpebienụ.[a]”'
  rationale: 'The revision restores the source order and force: Peter and John place the proposed human-versus-divine hearing under a conditional evaluation and then command their hearers to judge it. It retains the draft’s accurate, idiomatic lexical choices and preserves the contextual-obedience interpretation only in the footnote.'
