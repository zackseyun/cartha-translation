review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the apostles’ powerful, ongoing witness and preserves χάρις as broadly understood favor. However, the placement of n’ọnwụ in “mbilite Onyenwe anyị Jizọs n’ọnwụ” is less clear than the Greek genitive construction; “mbilite n’ọnwụ nke Onyenwe anyị Jizọs” clearly identifies the resurrection as Jesus’ resurrection. The rendering of ἐπὶ πάντας αὐτούς as “n’ahụ ha niile” is not idiomatic for favor or grace resting upon a group.
  naturalness: “Nọgide na-agba akaebe” is natural Standard Igbo and suitably represents the imperfect. “Ihu ọma ... n’ahụ ha niile” sounds physically located on their bodies rather than favor extending over the community. “Dịkwasịrị ha niile” is idiomatic, dignified, and natural in this register.
  terminology: “Onyenwe anyị Jizọs,” “ike dị ukwuu,” “ịgba akaebe,” and “ihu ọma” are suitable. The lexical footnote appropriately retains “amara” as an alternative, but its quoted alternative should use the same idiomatic expression as the corrected main text.
  issues:
  - severity: medium
    issue: Ambiguous word order in the resurrection phrase
    rationale: “Mbilite Onyenwe anyị Jizọs n’ọnwụ” can be understood, but it is syntactically less transparent. Reordering as “mbilite n’ọnwụ nke Onyenwe anyị Jizọs” directly represents τῆς ἀναστάσεως τοῦ κυρίου Ἰησοῦ.
  - severity: medium
    issue: Non-idiomatic rendering of ἐπὶ πάντας αὐτούς
    rationale: “N’ahụ ha niile” ordinarily suggests something on their bodies. For grace or favor resting upon the whole community, “dịkwasịrị ha niile” is the natural Standard Igbo expression and retains the source imagery.
  revised_text: Ndịozi ji ike dị ukwuu nọgide na-agba akaebe banyere mbilite n’ọnwụ nke Onyenwe anyị Jizọs, ihu ọma[a] dị ukwuu dịkwasịrị ha niile.
  revised_footnotes:
