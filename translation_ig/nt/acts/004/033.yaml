  text: καὶ ⸂δυνάμει μεγάλῃ⸃ ἀπεδίδουν τὸ μαρτύριον οἱ ἀπόστολοι ⸂τῆς ἀναστάσεως τοῦ κυρίου Ἰησοῦ⸃, χάρις τε μεγάλη ἦν ἐπὶ πάντας αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/033.yaml
  text: And with great power the apostles were giving their testimony about the resurrection of the Lord Jesus[a], and great favor was upon them all.
translation:
  language: ig
  text: Ndịozi ji ike dị ukwuu nọgide na-agba akaebe banyere mbilite n’ọnwụ nke Onyenwe anyị Jizọs, ihu ọma[a] dị ukwuu dịkwasịrị ha niile.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “amara dị ukwuu dịkwasịrị ha niile.” Okwu Grik χάρις nwere ike ịpụta “amara” ma ọ bụ “ihu ọma”; okwu a nwere ike ịgụnye ma ọnụnọ amara Chineke ma nnabata ọma e nyere ndị kwere ekwe.
    reason: lexical_alternative
lexical_decisions:
- source_word: δυνάμει μεγάλῃ
  choice: ji ike dị ukwuu
  rationale: “Ji” na-egosi ụzọ ma ọ bụ ihe e ji eme ihe dịka dative Grik si arụ ọrụ; “ike dị ukwuu” na-edobe echiche nke ike bara ụba n’ebughị ụzọ kpebie na ọ bụ naanị ọrụ ebube.
- source_word: ἀπεδίδουν
  choice: nọgide na-agba
  rationale: “Nọgide na-” na-egosipụta omume na-aga n’ihu ma ọ bụ na-eme ugboro ugboro nke imperfect Grik, ebe “ịgba akaebe” bụ ụzọ Igbo si ekwu idiom nke inye testimony.
- source_word: τὸ μαρτύριον
  choice: akaebe
  rationale: “Ịgba akaebe” bụ okwu Igbo doro anya ma dịkwa eke maka inye testimony; onye nwe akaebe ahụ pụtara ìhè site na isiokwu “Ndịozi,” ya mere ọ dịghị mkpa itinye okwu ọzọ nke nwere ike ime ka ahịrịokwu sie ike.
- source_word: τῆς ἀναστάσεως
  choice: banyere mbilite ... n’ọnwụ
  rationale: Genitive a na-akọwa ihe akaebe ahụ gbasara. “Banyere” na-eme ka njikọ ọdịnaya ahụ doo onye na-agụ Igbo anya, ebe “mbilite ... n’ọnwụ” na-edobe aha-okwu nke Grik.
- source_word: τοῦ κυρίου Ἰησοῦ
  choice: Onyenwe anyị Jizọs
  rationale: “Onyenwe anyị” bụ nsụgharị Igbo a na-anabata nke κύριος n’ebe a; nhazi “mbilite Onyenwe anyị Jizọs n’ọnwụ” na-egosi na ọ bụ Jizọs ka e mere ka o si n’ọnwụ bilie.
- source_word: χάρις
  choice: ihu ọma
  rationale: “Ihu ọma” nwere ike ịpụta nnabata ma ọ bụ favor n’akọwaghị ma o si n’aka Chineke, n’aka ndị mmadụ, ma ọ bụ na ọ gụnyere ha abụọ. Ihe odide ala peeji na-edobe “amara” dịka ezigbo ụzọ ọzọ.
- source_word: τε
  choice: dịkwa
  rationale: Mgbakwunye “-kwa” na-ejikọta nkebi nke abụọ na nke mbụ n’ụzọ dị nro ma bụrụkwa Igbo eke.
- source_word: ἐπὶ πάντας αὐτούς
  choice: dịkwa n’ahụ ha niile
  rationale: “N’ahụ ha niile” na-edobe ihe oyiyi nke ihe dị n’elu ma ọ bụ dakwasịrị obodo ahụ dum, na-ekwusi ike na ọ metụtara onye ọ bụla n’ime ha.
theological_decisions:
- issue: Ihe χάρις pụtara n’ebe a
  choice: ihu ọma dị n’ahụ obodo ndị kwere ekwe niile
  alternative: amara Chineke n’ụzọ a kapịrị ọnụ, ma ọ bụ nnabata sitere naanị n’aka ndị mmadụ
  rationale: Ihe odide Grik ekwughị kpọmkwem ebe χάρις si bịa. “Ihu ọma” na ihe odide ala peeji nke na-enye “amara” na-echekwa ohere na okwu ahụ nwere ike ịgụnye ma ọnụnọ amara Chineke ma nnabata ndị mmadụ, n’emeghị ka otu nkọwa bụrụ naanị ya.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta, dee ya. “Nọgide na-agba akaebe” na-egosipụta omume na-aga n’ihu; a hapụrụ ebe “ihu ọma/amara” si bịa ka ọ ghara ịbụ ihe a kpebiri karịa ka Grik kwuru.
