revisions:
- from: Ndịozi ji ike dị ukwuu nọgide na-agba akaebe banyere mbilite Onyenwe anyị Jizọs n’ọnwụ, ihu ọma[a] dị ukwuu dịkwa n’ahụ ha niile.
  to: Ndịozi ji ike dị ukwuu nọgide na-agba akaebe banyere mbilite n’ọnwụ nke Onyenwe anyị Jizọs, ihu ọma[a] dị ukwuu dịkwasịrị ha niile.
  rationale: The revision clarifies that the testimony concerns the resurrection of the Lord Jesus and replaces a bodily-sounding locative expression with an idiomatic construction for great favor resting upon the entire group. It does not narrow the ambiguity of χάρις or add a specified source for that favor.
  reviewer_model: gpt-5.6-terra
