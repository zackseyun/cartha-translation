    text: Ma ọ bụ, “amara dị ukwuu dịkwasịrị ha niile.” Okwu Grik χάρις nwere ike ịpụta “amara” ma ọ bụ “ihu ọma”; okwu a nwere ike ịgụnye ma ọnụnọ amara Chineke ma nnabata ọma e nyere ndị kwere ekwe.
    reason: lexical_alternative
