source:
  edition: SBLGNT
  text: ὑπάρχοντος αὐτῷ ἀγροῦ πωλήσας ἤνεγκεν τὸ χρῆμα καὶ ἔθηκεν ⸀παρὰ τοὺς πόδας τῶν ἀποστόλων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/037.yaml
  text: Since he owned a field[b][a], he sold it and brought the money and laid it at the apostles’ feet.
translation:
  language: ig
  text: Ebe ọ bụ na o nwere ubi[a], o rere ya, wetara ego ahụ[b] ma debe ya n’ụkwụ ndịozi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “mgbe o nwere ubi” ma ọ bụ “ebe ubi bụ nke ya.” Grik ji usoro okwu na-enye ọnọdụ ndabere.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ego e nwetara n’ire ya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπάρχοντος αὐτῷ ἀγροῦ
  choice: Ebe o nwere otu ubi
  rationale: Nkebi a bụ genitive absolute nke na-enye ọnọdụ ndabere. “Ebe o nwere” na-egosipụta ọnọdụ ahụ n’Igbo eke, na-enweghị ime ka ihe odide ahụ kwuo kpọmkwem karịa Grik.
- source_word: ἀγροῦ
  choice: otu ubi
  rationale: ἀγρός pụtara ubi ma ọ bụ ala a na-akọ; “ubi” bụ okwu Igbo doro anya ma dịkwa obosara nke ọma n’ebe a.
- source_word: πωλήσας
  choice: o rere ya
  rationale: Aorist participle a na-egosi omume mere tupu iweta ego ahụ. Iji ngwaa zuru ezu mee ya na-eme ka usoro omume ahụ doo anya n’Igbo.
- source_word: ἤνεγκεν
  choice: weta
  rationale: φέρω n’ọnọdụ a pụtara iweta ma ọ bụ iburu ihe gaa ebe mmadụ nọ. “Weta” bụ okwu Igbo kachasị eke ebe a.
- source_word: τὸ χρῆμα
  choice: ego ahụ
  rationale: χρῆμα na-ezo aka n’ego e nwetara n’ire ubi ahụ. “Ego ahụ” na-adị mfe ma ghara ịkọwa karịa ihe Grik kwuru.
- source_word: ἔθηκεν
  choice: dọba
  rationale: τίθημι pụtara itinye ma ọ bụ idọba. “Dọba” na-echekwa omume a hụrụ anya nke itinye ego ahụ n’otu ebe.
- source_word: παρὰ τοὺς πόδας τῶν ἀποστόλων
  choice: n’ụkwụ ndịozi
  rationale: Nsụgharị a na-echekwa ihe oyiyi nkịtị dị na Grik—idọba ego ahụ n’ụkwụ ndịozi—ma ghara ime ka ọ bụrụ naanị “inye ndịozi ego ahụ.”
theological_decisions:
- issue: Ma a ga-echekwa ihe oyiyi nke idọba ego ahụ n’ụkwụ ndịozi
  choice: 'E chekwara okwu nkịtị ahụ: “dọba ya n’ụkwụ ndịozi.”'
  alternative: “nye ya ndịozi”
  rationale: Ihe odide ahụ na-akọ omume a hụrụ anya nke inyefe ego ahụ ka ndịozi lekọta ya. Ichekwa ihe oyiyi ahụ na-edobe ma akụkọ ahụ ma echiche nke inyefe ya n’okpuru nlekọta ha, na-enweghị itinye nkwupụta ụka ọzọ.
translation_notes:
  register: Asụsụ Igbo izugbe, nke oge a ma dị ùgwù. E ji “ndịozi” mee apostles, a hapụkwara ihe oyiyi nkịtị nke “n’ụkwụ” ka ọ dị, ebe nkebi mmalite na-ada n’ụzọ eke nye ndị na-agụ Igbo.
