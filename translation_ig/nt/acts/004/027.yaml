id: ACT.4.27
reference: Acts 4:27
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: συνήχθησαν γὰρ ἐπ’ ἀληθείας ⸂ἐν τῇ πόλει ταύτῃ⸃ ἐπὶ τὸν ἅγιον παῖδά σου Ἰησοῦν, ὃν ἔχρισας, Ἡρῴδης τε καὶ Πόντιος Πιλᾶτος σὺν ἔθνεσιν καὶ λαοῖς Ἰσραήλ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/027.yaml
  text: For truly in this city Herod and Pontius Pilate[a], together with the Gentiles and the peoples of Israel, were gathered against your holy servant Jesus, whom you anointed[b],
translation:
  language: ig
  text: N’ihi na n’ezie, n’obodo a, Herọd na Pọntiọs Paịlet, tinyere ndị mba ọzọ[b] na ndị Izrel, gbakọtara megide ohu gị dị nsọ Jizọs[a], onye i tere mmanụ,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “nwa gị dị nsọ.” Okwu Grik bụ παῖς nwere ike ịpụta “ohu” ma ọ bụ “nwa”; a họọrọ “ohu” ebe a n’ihi na o yiri ka okwu ahụ na-ezo aka n’asụsụ Aịzaya banyere Ohu Onyenwe anyị.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsị, “mba dị iche iche.” Okwu Grik ahụ nwere ike ịpụta “ndị mba ọzọ” ma ọ bụ “mba dị iche iche”; Grik jikwa okwu dị n’ụdị ọtụtụ maka ndị Izrel.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνήχθησαν
  choice: gbakọtara
  rationale: Nke a na-egosi na ha zukọtara dịka otu ìgwè megide Jizọs. Ọ bụ ezie na ụdị Grik ahụ bụ passive, Igbo nkịtị na-egosikarị echiche a nke ọma site n’ụdị ngwaa a na-enweghị ịkọwa onye mere ka ha zukọta.
- source_word: γὰρ
  choice: N’ihi na
  rationale: Ọ na-ejikọta amaokwu a na ekpere na ihe e hotara n’amaokwu ndị bu ya ụzọ, na-enye ihe kpatara okwu ahụ.
- source_word: ἐπ’ ἀληθείας
  choice: n’ezie
  rationale: Ọ bụ okwu Igbo dị mfe ma dị ugwu nke na-echekwa nkwusi ike nke ‘n’eziokwu’ ma ọ bụ ‘n’ezie.’
- source_word: ἐν τῇ πόλει ταύτῃ
  choice: n’obodo a
  rationale: Ọ na-echekwa ntụaka kpọmkwem nke Grik n’obodo ahụ, na-ahapụghị ịkpọ ya Jeruselem ebe ederede ahụ ekwughị aha ya.
- source_word: ἐπὶ τὸν
  choice: megide
  rationale: N’ọnọdụ a, ọ na-egosi iro na mmegide e duziri n’ebe Jizọs nọ.
- source_word: ἅγιον
  choice: dị nsọ
  rationale: Ọ na-egosi na onye ahụ bụ nke Chineke kpọpụtara ma bụrụkwa onye dị nsọ.
- source_word: παῖδά σου
  choice: ohu gị
  rationale: παῖς nwere ike ịpụta ‘ohu’ ma ọ bụ ‘nwa,’ ma asụsụ banyere Ohu Chineke n’Aịzaya na ojiji ya n’Ọrụ Ndị Ozi na-akwado ‘ohu’ ebe a. E debere ihe ọzọ ọ pụrụ ịpụta n’ala ala peeji.
- source_word: Ἰησοῦν
  choice: Jizọs
  rationale: Nke a bụ odide aha ahụ a na-ejikarị eme ihe n’Igbo.
- source_word: ὃν ἔχρισας
  choice: onye i tere mmanụ
  rationale: Ọ na-echekwa ihe χρίω pụtara kpọmkwem na ụda Mesaịa na ọrụ Chineke nyere ya, n’etinyeghị aha ‘Mesaịa’ ebe Grik ji ngwaa.
- source_word: Ἡρῴδης τε καὶ Πόντιος Πιλᾶτος
  choice: Herọd na Pọntiọs Paịlet
  rationale: Aha ndị ahụ ka e dere n’ụdị Igbo, ebe njikọ ‘na’ na-egosi njikọ dị n’etiti ndị ọchịchị abụọ ahụ.
- source_word: σὺν ἔθνεσιν καὶ λαοῖς Ἰσραήλ
  choice: tinyere ndị mba ọzọ na ìgwè dị iche iche nke ndị Izrel
  rationale: ‘Ndị mba ọzọ’ na-eme ka ọdịiche dị n’etiti ndị na-abụghị ndị Juu na Izrel doo anya; ‘ìgwè dị iche iche’ na-echekwa ọtụtụ nke λαοῖς n’ụzọ Igbo ga-aghọta.
theological_decisions:
- issue: Otú e si tụgharịa παῖς mgbe ọ na-ekwu banyere Jizọs
  choice: ohu
  alternative: nwa
  rationale: Ọnọdụ ekpere a na ojiji okwu ahụ n’Ọrụ Ndị Ozi yiri asụsụ Aịzaya banyere Ohu Chineke. ‘Ohu’ na-echekwa njikọ ahụ, ma ihe e dere n’ala ala peeji na-echekwa ezi mgbagwoju okwu Grik ahụ; a zere ‘Ọkpara’ n’ihi na ọ ga-akọwa okwu ahụ karịa ihe ọ kwuru ebe a.
- issue: Otú e si tụgharịa ἔθνεσιν n’ebe e tinyere ya na Izrel
  choice: ndị mba ọzọ
  alternative: mba dị iche iche
  rationale: N’ihi na e jikọtara ya na ìgwè ndị Izrel, ntụnyere ahụ bụ n’etiti ndị na-abụghị ndị Juu na Izrel. ‘Ndị mba ọzọ’ na-eme ka nke a doo anya n’Igbo, ebe ala ala peeji na-echekwa ihe ọzọ okwu Grik ahụ pụrụ ịpụta.
- issue: Mmanụ e tere Jizọs na ụda Mesaịa
  choice: onye i tere mmanụ
  alternative: onye i họpụtara
  rationale: Nsụgharị kpọmkwem na-echekwa ma omume ite mmanụ ma ụda Mesaịa ya, n’ebughị ụzọ dochie ngwaa ahụ na aha ma ọ bụ kọwaa ụdị mmanụ ahụ.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. Ahịrịokwu ahụ na-echekwa usoro ekpere na nkwusi ike nke ‘n’ezie,’ ma na-eji usoro Igbo nkịtị maka nchịkọta ndị mmadụ. E debere rikoma n’ikpeazụ n’ihi na echiche ahụ na-aga n’ihu n’amaokwu na-esonụ.
