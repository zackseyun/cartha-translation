  terminology: «Ohu» maka παῖς dabara n’echiche Ohu dị na Aịzaya, ebe ala ala peeji na-echekwa «nwa» dịka nhọrọ ọzọ. «Ndị mba ọzọ» dabara maka ἔθνεσιν n’iche ya na ndị Izrel. «Onye i tere mmanụ» na-edobe χρίω n’enweghị ịgbakwunye nkọwa. A ga-eme ka nkọwa ala ala peeji b doo anya na λαοῖς anaghị pụta «ìgwè dị iche iche».
