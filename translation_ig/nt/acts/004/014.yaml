  text: τόν ⸀τε ἄνθρωπον βλέποντες σὺν αὐτοῖς ἑστῶτα τὸν τεθεραπευμένον οὐδὲν εἶχον ἀντειπεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/014.yaml
  text: And seeing the man who had been healed standing with them[a], they had nothing to say in reply.
translation:
  language: ig
  text: Mgbe ha hụrụ nwoke ahụ a gwọrọ ka ya na ha guzo, ha enweghị ihe ọ bụla ha ga-ekwu megide ya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ha enweghị ike ikwu ihe ọ bụla megide ihe ahụ,” ma ọ bụ, “ha enweghị ihe ọ bụla ha ga-eji gbaghaa ya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τε
  choice: Mgbe
  rationale: N’Igbo, ịmalite ahịrịokwu a na ‘Mgbe’ jikọtara ịhụ nwoke ahụ na enweghị ihe ha ga-ekwu n’ụzọ dị mma; ike njikọ τε dị n’usoro ahịrịokwu ahụ n’enweghị ịgbakwunye okwu na-adịghị mkpa.
- source_word: ἄνθρωπον
  choice: nwoke ahụ
  rationale: Ọ na-ezo aka n’otu nwoke ahụ a kpọtụrụ aha n’akụkọ gara aga, ya mere ‘nwoke ahụ’ ziri ezi ma doo anya.
- source_word: βλέποντες
  choice: ha hụrụ
  rationale: A sụgharịrị participle ahụ dịka nkebi oge ‘Mgbe ha hụrụ,’ nke bụ Igbo ebumpụta ụwa ma debe na ịhụ ahụ mere n’otu oge ahụ na isi omume.
- source_word: σὺν αὐτοῖς
  choice: n’akụkụ ha
  rationale: N’ebe a, σύν na-egosi na nwoke ahụ nọnyere Pita na Jọn. ‘N’akụkụ ha’ na-egosipụta nke a nke ọma ma kwekọọ na ọnọdụ ya ka o guzo.
- source_word: ἑστῶτα
  choice: ka o guzo
  rationale: Perfect participle a na-akọwa ọnọdụ nwoke ahụ nọ na ya. ‘Ka o guzo’ bụ usoro Igbo dị mfe ma na-egosi ọnọdụ guzo ahụ.
- source_word: τεθεραπευμένον
  choice: a gwọrọ
  rationale: Ụdị perfect passive ahụ na-akọwa nwoke ahụ dịka onye natara ọgwụgwọ mezuru nke nsonaazụ ya ka dị. ‘A gwọrọ’ na-echekwa passive ahụ ma dabara n’akụkọ ọrụ ebube.
- source_word: οὐδὲν
  choice: ihe ọ bụla
  rationale: N’okpuru nkwụghị ‘enweghị,’ ‘ihe ọ bụla’ na-enye echiche zuru ezu nke οὐδέν n’Igbo nkịtị.
- source_word: εἶχον ἀντειπεῖν
  choice: ha enweghị ihe ọ bụla ha ga-ekwu megide ya
  rationale: Nke a na-echekwa ma idiom ἔχω + infinitive ma ike mmegide dị na ἀντειπεῖν. ‘Megide ya’ na-ahapụ ntakịrị nghọta banyere ihe kpọmkwem ‘ya’ na-ezo aka, dịka Greek si dị.
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ usoro nkebi oge iji mee ka participle Greek bụrụ Igbo ebumpụta ụwa, ebe e debere echiche mmegide dị na ἀντειπεῖν na isi ederede.
