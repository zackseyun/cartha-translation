revisions:
- from: Mgbe ha hụrụ nwoke ahụ a gwọrọ ka o guzo n’akụkụ ha, ha enweghị ihe ọ bụla ha ga-ekwu megide ya.[a]
  to: Mgbe ha hụrụ nwoke ahụ a gwọrọ ka ya na ha guzo, ha enweghị ihe ọ bụla ha ga-ekwu megide ya.[a]
  rationale: Only the rendering of σύν αὐτοῖς has been corrected, from the more restrictive ‘beside them’ to ‘with them.’ The temporal participial construction, healing terminology, and deliberately context-dependent opposition phrase are retained.
  reviewer_model: gpt-5.6-terra
