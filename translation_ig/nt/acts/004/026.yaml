  variant: Standard Igbo
source:
  edition: SBLGNT
  text: παρέστησαν οἱ βασιλεῖς τῆς γῆς καὶ οἱ ἄρχοντες συνήχθησαν ἐπὶ τὸ αὐτὸ κατὰ τοῦ κυρίου καὶ κατὰ τοῦ χριστοῦ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/026.yaml
  text: The kings of the earth took their stand[a], and the rulers were gathered together against the Lord and against his Messiah.
translation:
  language: ig
  text: Ndị eze ụwa guzoro, ndị ọchịchị gbakọtara ọnụ imegide Onyenwe anyị na Mesaịa ya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Kraịst ya”; ya bụ, “Onye o tere mmanụ.”
    reason: alternative_reading
lexical_decisions:
- source_word: παρέστησαν
  choice: guzoro n’ọnọdụ ha
  rationale: Nke a na-egosi na ha kpachaara anya guzo n’otu ọnọdụ mmegide, ọ bụghị naanị na ha kwụ ọtọ; ọ na-echekwakwa ụda nke Abụ Ọma 2:2.
- source_word: οἱ βασιλεῖς τῆς γῆς
  choice: ndị eze ụwa
  rationale: “Ndị eze” na-echekwa aha ọchịchị a kapịrị ọnụ, ebe “ụwa” dabara n’echiche sara mbara nke amaokwu a.
- source_word: οἱ ἄρχοντες
  choice: ndị ọchịchị
  rationale: Ọ bụ okwu Igbo doro anya ma dị ugbu a maka ndị nwere ikike ịchị, ọ na-adabakwa n’usoro ya na “ndị eze.”
- source_word: συνήχθησαν ἐπὶ τὸ αὐτό
  choice: gbakọtara ọnụ
  rationale: Ọ na-ekwupụta na ha zukọtara n’otu ebe ma ọ bụ n’otu ebumnobi. Ụdị Igbo a na-ada nke ọma ma ghara ịkọwa onye kpọkọtara ha, dịka Grik na-ahapụghị onye mere ya ka ọ pụta ìhè.
- source_word: κατὰ
  choice: imegide
  rationale: N’ebe abụọ a, okwu ahụ na-egosi mmegide iro n’ụzọ doro anya.
- source_word: τοῦ κυρίου
  choice: Onyenwe anyị
  rationale: Nke a bụ aha nsọpụrụ Igbo a na-aghọta nke ọma maka κύριος mgbe ọ na-ezo aka n’ebe Chineke nọ n’amaokwu Akwụkwọ Nsọ.
- source_word: τοῦ χριστοῦ αὐτοῦ
  choice: Mesaịa ya
  rationale: N’ihi na nke a bụ nhota sitere n’Abụ Ọma 2:2, χριστός na-arụ ọrụ dịka aha ọkwa nke Onye Chineke tere mmanụ. “Mesaịa” na-echekwa echiche ahụ ma bụrụ okwu Ndị Kraịst na-asụ Igbo maara.
theological_decisions:
- issue: Ụzọ e si sụgharịa χριστός n’nhota Abụ Ọma 2
  choice: Mesaịa
  alternative: Kraịst; Onye o tere mmanụ
  rationale: “Mesaịa” na-eme ka ọdịdị aha ọkwa ahụ na njikọ ya na Abụ Ọma 2 pụta ìhè. “Kraịst” nwere ike ịdị ka aha onwe n’ụfọdụ ọnọdụ Agba Ọhụrụ, ebe “Onye o tere mmanụ” bụ nkọwa okwu ahụ kpọmkwem; e debere ha na nkọwa ala peeji ka a ghara izochi njikọ ndị a.
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe dị ugbu a, dị ùgwù ma dị mfe nghọta. A họọrọ “guzoro n’ọnọdụ ha” iji gosi mkpebi siri ike nke mmegide, ebe “gbakọtara ọnụ” na-echekwa echiche nke njikọta n’enweghị ịkpọpụta onye kpọkọtara ha.
