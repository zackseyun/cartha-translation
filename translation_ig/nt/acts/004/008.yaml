  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τότε Πέτρος πλησθεὶς πνεύματος ἁγίου εἶπεν πρὸς αὐτούς· Ἄρχοντες τοῦ λαοῦ καὶ ⸀πρεσβύτεροι,
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/008.yaml
  text: Then Peter, filled with the Holy Spirit, said to them, “Rulers of the people and elders,”
translation:
  language: ig
  text: Mgbe ahụ, Pita, onye jupụtara na Mmụọ Nsọ, sịrị ha, “Ndị na-achị ndị mmadụ na ndị okenye,”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τότε
  choice: Mgbe ahụ
  rationale: Ọ na-egosi ihe mere n’usoro ozugbo nke akụkọ ahụ; nke a bụ ụzọ Igbo nkịtị na nke doro anya si ekwu ya.
- source_word: Πέτρος
  choice: Pita
  rationale: Nke a bụ ụdị aha Πέτρος a na-ejikarị eme ihe n’Igbo.
- source_word: πλησθεὶς
  choice: onye jupụtara
  rationale: Ọ na-enye echiche participle a n’ụzọ Igbo dị mfe ma na-egosi ọnọdụ Pita nọ na ya mgbe ọ malitere ikwu okwu.
- source_word: πνεύματος ἁγίου
  choice: na Mmụọ Nsọ
  rationale: Mgbe e jikọtara ya na ‘jupụtara,’ ‘na’ bụ njikọ Igbo kwesịrị ekwesị; ‘Mmụọ Nsọ’ na-egosi onye okwu a na-ezo aka na ya n’Ọrụ Ndịozi.
- source_word: εἶπεν πρὸς αὐτούς
  choice: sịrị ha
  rationale: Nke a bụ ụzọ Igbo kpọmkwem ma dịkwa mma isi kwuo na ọ gwara ha okwu.
- source_word: Ἄρχοντες
  choice: Ndị na-achị
  rationale: Ọ na-egosi ndị nwere ikike ọchịchị na ikpe n’ọnọdụ a, ọ bụghị naanị ndị ndu n’ozuzu.
- source_word: τοῦ λαοῦ
  choice: ndị mmadụ
  rationale: Ọ na-edobe okwu ahụ n’ozuzu dịka isi mmalite si dị, n’agbanyeghị na n’ọnọdụ akụkọ a ọ na-ezo aka n’ụmụ Izrel.
- source_word: πρεσβύτεροι
  choice: ndị okenye
  rationale: N’ọnọdụ a, okwu ahụ na-ezo aka n’òtù ndị okenye a ma ama nwere ọrụ ọchịchị, ọ bụghị nanị ndị kara nká.
theological_decisions:
- issue: Ntụgharị πνεύματος ἁγίου
  choice: Mmụọ Nsọ
  alternative: mmụọ dị nsọ
  rationale: N’Ọrụ Ndịozi, okwu a na-ezo aka na Mmụọ Nsọ nke Chineke onye nyere Pita ike ikwu okwu; ide ya dịka aha pụrụ iche na-eme ka onye a na-ezo aka na ya doo anya n’enweghị itinye nkọwa ọhụrụ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta, mee ntụgharị a. Ahịrịokwu ahụ na-edobe usoro na esemokwu nke isi mmalite Grik, ma okwu e ji kpọọ ndị ọchịchị ka a haziri n’ụzọ na-ada ka Igbo nkịtị.
