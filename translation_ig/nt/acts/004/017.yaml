id: ACT.4.17
reference: Acts 4:17
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀλλ’ ἵνα μὴ ἐπὶ πλεῖον διανεμηθῇ εἰς τὸν λαόν, ⸀ἀπειλησώμεθα αὐτοῖς μηκέτι λαλεῖν ἐπὶ τῷ ὀνόματι τούτῳ μηδενὶ ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/017.yaml
  text: But so that it may not spread any further among the people, let us warn them not to speak any longer to anyone in this name.
translation:
  language: ig
  text: Ma ka okwu a ghara ịgbasakwu n’etiti ndị mmadụ, ka anyị yie ha egwu[a] ka ha gharakwa ịgwa onye ọ bụla okwu n’aha a.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ka anyị dọọ ha aka ná ntị siri ike.” Ma ngwaa Grik ahụ pụtara iyi egwu ma na-egosi mmanye sitere n’aka ndị ọchịchị.
    reason: lexical_alternative
lexical_decisions:
- source_word: διανεμηθῇ
  choice: ịgbasa
  rationale: N’agbanyeghị na ngwaa a nwere ike ịpụta ikesa ihe, n’ebe a ọ na-ekwu maka ozi ahụ ịgbasa n’etiti ọha mmadụ; “ịgbasa” bụ okwu Igbo doro anya ma kwekọọ n’ọnọdụ a.
- source_word: ἐπὶ πλεῖον
  choice: ịgbasakwu
  rationale: Mgbakwunye “-kwu” na-egosi na ihe ahụ agaghị aga n’ihu ma ọ bụ ruo ebe sara mbara karịa ka ọ dị ugbu a.
- source_word: λαός
  choice: ndị mmadụ
  rationale: N’ebe a ọ na-ezo aka n’ọha mmadụ n’ozuzu, karịsịa ndị Juu nọ gburugburu; “ndị mmadụ” bụ nsụgharị Igbo sara mbara ma dị mfe nghọta.
- source_word: ἀπειλησώμεθα
  choice: ka anyị yie ha egwu
  rationale: Ngwaa Grik a pụtara iyi egwu n’ụzọ doro anya. Nsụgharị a na-echekwa ike ọchịchị na mmanye dị n’okwu ndị kansụl ahụ, kama ime ka ọ bụrụ naanị ndụmọdụ ma ọ bụ ịdọ aka ná ntị dị nro.
- source_word: μηκέτι λαλεῖν
  choice: ka ha gharakwa ... okwu
  rationale: “Gharakwa” na-echekwa echiche nke ịkwụsị site ugbu a gaa n’ihu, ebe “okwu” jikọtara na “ịgwa” na-eme ka ahịrịokwu ahụ bụrụ Igbo eke.
- source_word: ἐπὶ τῷ ὀνόματι τούτῳ
  choice: n’aha a
  rationale: “N’aha a” na-echekwa okwu Grik ahụ ma nwee ike ịpụta ikwu okwu n’ike, n’akwụkwọ ikike, ma ọ bụ n’ihe metụtara aha ahụ, n’enweghị imechi nghọta ya n’otu ụzọ naanị.
- source_word: μηδενὶ ἀνθρώπων
  choice: onye ọ bụla
  rationale: N’usoro ahịrịokwu nwere nkwugide “ghara,” “onye ọ bụla” bụ ụzọ Igbo eke si egosi na a machibidoro ha ịgwa mmadụ ọbụla okwu.
theological_decisions:
- issue: Ike okwu ἀπειλησώμεθα n’omume ndị kansụl
  choice: ka anyị yie ha egwu
  alternative: ka anyị dọọ ha aka ná ntị siri ike
  rationale: Ọnọdụ ahụ bụ nke ndị ọchịchị na-eji ikike amanye ndịozi, ngwaa Grik ahụ kwa pụtara iyi egwu. Ya mere, isi ederede kwesịrị igosi mmanye ahụ kpọmkwem; ndetu ala na-enye nsụgharị dị nro karị nke ka nwere ike ịkọwa okwu ahụ.
- issue: Ihe “n’aha a” pụtara
  choice: chekwaa okwu ahụ dị ka “n’aha a”
  alternative: site n’ike nke aha a / banyere aha a
  rationale: Nkebi Grik ahụ nwere ike ibu echiche nke ikwu okwu n’ike aha ahụ ma ọ bụ n’ihe metụtara ya. Ịhapụ ya dịka “n’aha a” na-echekwa obosara na ntakịrị mgbagwoju anya nke ihe odide mbụ.
translation_notes:
  register: E jiri Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-agbaso usoro echiche Grik, ma a haziri ya n’ụzọ Igbo eke. E debere “n’aha a” iji ghara ịkọwa okwu ahụ karịa ka isi mmalite si kwuo.
