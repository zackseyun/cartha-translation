  variant: Standard Igbo
source:
  edition: SBLGNT
  text: διαπονούμενοι διὰ τὸ διδάσκειν αὐτοὺς τὸν λαὸν καὶ καταγγέλλειν ἐν τῷ Ἰησοῦ τὴν ἀνάστασιν ⸂τὴν ἐκ⸃ νεκρῶν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/002.yaml
  text: being greatly disturbed because they were teaching the people and proclaiming in Jesus the resurrection from the dead,[a]
translation:
  language: ig
  text: Ha were ezigbo iwe n’ihi na ha na-akụziri ndị mmadụ ihe, na-ekwusakwa n’ime Jizọs mbilite n’ọnwụ site n’etiti ndị nwụrụ anwụ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “na-ekwusakwa mbilite n’ọnwụ site n’etiti ndị nwụrụ anwụ dịka e si hụ ya n’ihe banyere Jizọs.” Nkebiokwu Grik a sụgharịrị “n’ime Jizọs” nwere ike izo aka kpọmkwem na mbilite n’ọnwụ dịka mbilite Jizọs n’onwe ya si gosi ya.
    reason: alternative_reading
lexical_decisions:
- source_word: διαπονούμενοι
  choice: Iwe were na-ewe ha nke ukwuu
  rationale: Nkebi a na-egosi oké iwe na mgbakasị ahụ ndị ọchịchị ahụ nwere; okwu a bụ Igbo doro anya ma ghara ime ka mmetụta ahụ dị ntakịrị ma ọ bụ karịa ihe Grik kwuru.
- source_word: διὰ τὸ διδάσκειν
  choice: n’ihi na ha na-akụziri
  rationale: διά na infinitive nwere article na-egosi ihe kpatara ọnọdụ ahụ; nkebiokwu nwere ngwaa zuru ezu na-ada nke ọma n’Igbo ma na-echekwa ihe kpatara ya.
- source_word: αὐτοὺς
  choice: ha
  rationale: Nnọchiaha a na-ezo aka n’ebe ndị na-ekwu okwu a kpọtụrụ aha n’amaokwu gara aga nọ, n’agbanyeghị na amaokwu a akpọghị ha aha ọzọ.
- source_word: τὸν λαὸν
  choice: ndị mmadụ
  rationale: Nke a na-egosi ndị mmadụ dịka otu ìgwè, ọ bụghị naanị igwe mmadụ gbakọrọ na mberede.
- source_word: καταγγέλλειν
  choice: na-ekwusakwa
  rationale: Ngwaa a pụtara ikwupụta ozi n’ihu ọha; “na-ekwusa” dabara n’ọnọdụ a, ebe “-kwa” jikọtara ya na ọrụ izi ihe e kwuru tupu ya.
- source_word: ἐν τῷ Ἰησοῦ
  choice: n’ime Jizọs
  rationale: 'Nsụgharị a na-esochi ἐν nke ọma ma na-ahapụ nghọta ya ghe oghe: mbilite n’ọnwụ ahụ nwere ike ịbụ nke e gosipụtara n’ebe Jizọs nọ ma ọ bụ nke hiwere isi n’ime ya.'
- source_word: ἀνάστασιν
  choice: mbilite n’ọnwụ
  rationale: Nke a bụ okwu Igbo doro anya ma bụrụkwa nke a na-ejikarị egosipụta isi n’ọnwụ bilie.
- source_word: τὴν ἐκ νεκρῶν
  choice: site n’etiti ndị nwụrụ anwụ
  rationale: Okwu a na-egosipụta ἐκ νεκρῶν kpọmkwem dịka isi n’etiti ndị nwụrụ anwụ pụta, ma ka na-ada nke ọma n’Igbo.
theological_decisions:
- issue: Ihe ἐν τῷ Ἰησοῦ pụtara n’ihe gbasara nkwusa mbilite n’ọnwụ
  choice: E debere ya dịka “n’ime Jizọs,” ka o gosi na mbilite n’ọnwụ a na-ekwusa hiwere isi na Jizọs ma ọ bụ pụta ìhè n’ebe ọ nọ.
  alternative: “n’ihe banyere Jizọs” ma ọ bụ “site na Jizọs”
  rationale: ἐν nwere ike ibu ọtụtụ nghọta ndị a na ọnọdụ a. Isi ederede anaghị ekpebi otu nghọta naanị, ebe nkọwa ala peeji na-echekwa nghọta ọzọ dị mkpa.
- issue: Ókè ihe “mbilite n’ọnwụ site n’etiti ndị nwụrụ anwụ” na-ezo aka na ya
  choice: Edebere okwu ahụ ka ọ nwee ike ịgụnye ma mbilite Jizọs n’onwe ya ma olileanya sara mbara banyere mbilite n’ọnwụ nke e gosipụtara n’ime ya.
  alternative: Ịkọwa ya naanị dịka mbilite Jizọs, ma ọ bụ naanị dịka mbilite ikpeazụ nke mmadụ niile
  rationale: Okwu Luk nwere ike ịkpọta echiche abụọ ahụ; nsụgharị ahụ ekwesịghị ime ka ihe Grik hapụrụ ghe oghe bụrụ naanị otu nghọta.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ usoro okwu na-ada nke ọma n’ọnụ ndị Igbo, ebe e chekwara nghọta ghe oghe nke ἐν τῷ Ἰησοῦ. Akara nkọwa ala peeji [a] dị n’isi ederede.
