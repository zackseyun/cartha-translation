review_pass:
  verdict: revise
  source_fidelity: The causal force of διὰ τὸ διδάσκειν, the public-proclamation sense of καταγγέλλειν, and the phrase ἀνάστασιν τὴν ἐκ νεκρῶν are retained. “N’ime Jizọs” follows the Greek ἐν τῷ Ἰησοῦ closely and, with the note, does not settle whether the emphasis is Jesus’ own case or resurrection manifested in/through him.
  naturalness: The draft’s opening, “Iwe were na-ewe ha nke ukwuu,” is redundant and not idiomatic Standard Igbo. “Ha were ezigbo iwe” is natural, clear, and conveys the strong vexation denoted by διαπονούμενοι. The rest of the clause is coherent in contemporary formal Igbo.
  terminology: “Ndị mmadụ,” “na-akụziri … ihe,” “na-ekwusa,” and “mbilite n’ọnwụ” are suitable Standard Igbo biblical terms. The expression “site n’etiti ndị nwụrụ anwụ” appropriately expresses resurrection from among the dead.
  issues:
  - severity: medium
    issue: Redundant opening expression
    rationale: “Iwe were na-ewe ha nke ukwuu” repeats the idea of being angry in a way that is awkward in Standard Igbo. A single idiomatic predicate is needed.
  revised_text: Ha were ezigbo iwe n’ihi na ha na-akụziri ndị mmadụ ihe, na-ekwusakwa n’ime Jizọs mbilite n’ọnwụ site n’etiti ndị nwụrụ anwụ.[a]
