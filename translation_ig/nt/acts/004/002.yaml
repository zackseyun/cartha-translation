revisions:
- from: Iwe were na-ewe ha nke ukwuu n’ihi na ha na-akụziri ndị mmadụ ihe, na-ekwusakwa n’ime Jizọs mbilite n’ọnwụ site n’etiti ndị nwụrụ anwụ.[a]
  to: Ha were ezigbo iwe n’ihi na ha na-akụziri ndị mmadụ ihe, na-ekwusakwa n’ime Jizọs mbilite n’ọnwụ site n’etiti ndị nwụrụ anwụ.[a]
  rationale: Only the idiomatically defective and redundant rendering of διαπονούμενοι has been corrected. The wording and footnote concerning ἐν τῷ Ἰησοῦ are retained so that the Greek expression’s interpretive openness is preserved rather than doctrinally narrowed.
