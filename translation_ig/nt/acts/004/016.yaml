source:
  edition: SBLGNT
  text: λέγοντες· Τί ⸀ποιήσωμεν τοῖς ἀνθρώποις τούτοις; ὅτι μὲν γὰρ γνωστὸν σημεῖον γέγονεν δι’ αὐτῶν πᾶσιν τοῖς κατοικοῦσιν Ἰερουσαλὴμ φανερόν, καὶ οὐ δυνάμεθα ⸀ἀρνεῖσθαι·
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/016.yaml
  text: saying[a], “What should we do with these men? For indeed, a notable sign has happened through them, evident to all who live in Jerusalem, and we cannot deny it.”
translation:
  language: ig
  text: na-asị, “Gịnị ka anyị ga-eme ndị ikom ndị a? N’ihi na n’ezie, ihe ịrịba ama a maara nke ọma[a] emeela site n’aka ha. Ọ pụtara ìhè nye ndị niile bi na Jerusalem, anyị apụghịkwa ịgọnahụ ya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “ihe ịrịba ama a ma ama.” Okwu Grik γνωστόν nwere ike ịpụta ihe a maara ma ọ bụ ihe a maara nke ọma; n’ebe a, ọ na-egosi ihe ịrịba ama nke ndị bi na Jerusalem maara n’ihu ọha.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντες
  choice: na-asị
  rationale: Ọ bụ participle nke na-ewebata ihe ndị kansụl ahụ kwuru ma na-ejikọta amaokwu a na ihe bu ya ụzọ.
- source_word: Τί ποιήσωμεν τοῖς ἀνθρώποις τούτοις
  choice: Gịnị ka anyị ga-eme ndị ikom ndị a?
  rationale: Ajụjụ a na-egosi na ha na-atụle ihe ha ga-eme; “ndị ikom” dabara Pita na Jọn ndị a na-ekwu maka ha.
- source_word: ὅτι μὲν γὰρ
  choice: N’ihi na n’ezie
  rationale: Nke a na-echekwa ma nkọwa ihe kpatara ya ma nkwusi ike dị na okwu Grik.
- source_word: γνωστὸν σημεῖον
  choice: ihe ịrịba ama a ma ama
  rationale: “A ma ama” na-egosi na ọ bụ ihe ọha maara ma kweta na o mere, ebe “ihe ịrịba ama” na-echekwa okwu Luk ji kama ime ka ọ bụrụ naanị ọrụ ebube.
- source_word: γέγονεν δι’ αὐτῶν
  choice: emeela site n’aka ha
  rationale: “Emeela” na-egosi ihe mezuru nke ihe ọ rụpụtara ka dị ugbu a; “site n’aka ha” na-echekwa echiche nke ịbụ ụzọ e si mee ya n’enweghị ikwu na ike ahụ sitere n’onwe ha.
- source_word: πᾶσιν τοῖς κατοικοῦσιν Ἰερουσαλὴμ φανερόν
  choice: Ọ pụtara ìhè nye ndị niile bi na Jerusalem
  rationale: Nke a bụ Igbo doro anya ma na-echekwa na ihe ahụ bụ nke ọha pụrụ ịhụ ma mara.
- source_word: οὐ δυνάμεθα ἀρνεῖσθαι
  choice: anyị apụghịkwa ịgọnahụ ya
  rationale: “Ya” na-eme ka ihe okwu Grik hapụrụ n’amaghị aha pụta ìhè, ya bụ, ihe ịrịba ama ahụ.
theological_decisions:
- issue: Ihe σημεῖον pụtara n’akụkọ ọrụ ebube a
  choice: ihe ịrịba ama
  alternative: ọrụ ebube
  rationale: “Ihe ịrịba ama” na-echekwa okwu Grik na echiche Luk na omume ahụ na-atụ aka n’ihe karịrị naanị ihe ịtụnanya, ebe ọnọdụ akụkọ ahụ ka na-egosi na ọ bụ ọrụ ebube.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. E kewara ahịrịokwu ogologo Grik ahụ ụzọ abụọ ka ọ daa nke ọma n’Igbo, ma e chekwara njikọ echiche ya.
