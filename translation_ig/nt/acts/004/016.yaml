  to: na-asị, “Gịnị ka anyị ga-eme ndị ikom ndị a? N’ihi na n’ezie, ihe ịrịba ama a maara nke ọma[a] emeela site n’aka ha. Ọ pụtara ìhè nye ndị niile bi na Jerusalem, anyị apụghịkwa ịgọnahụ ya.”
