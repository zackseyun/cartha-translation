  text: ἐτῶν γὰρ ἦν πλειόνων τεσσεράκοντα ὁ ἄνθρωπος ἐφ’ ὃν ⸀γεγόνει τὸ σημεῖον τοῦτο τῆς ἰάσεως.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/022.yaml
  text: For the man on whom this sign of healing had happened was more than forty years old[a].
translation:
  language: ig
  text: N’ihi na nwoke ahụ, onye ihe ịrịba ama a nke ọgwụgwọ mere n’ahụ ya, karịrị afọ iri anọ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ihe ịrịba ama ọgwụgwọ a” ma ọ bụ “ọrụ ebube ọgwụgwọ a.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐτῶν ... πλειόνων τεσσεράκοντα
  choice: agafeela afọ iri anọ
  rationale: Nke a bụ ụzọ Igbo si ekwu n'ụzọ ebumpụta ụwa na mmadụ karịrị afọ iri anọ.
- source_word: γὰρ
  choice: N’ihi na
  rationale: Ọ na-egosi na amaokwu a na-enye ihe mere okwu bu ya ụzọ ji bụrụ eziokwu.
- source_word: ὁ ἄνθρωπος
  choice: nwoke ahụ
  rationale: Ọ na-ezo aka n’otu nwoke a marala n’akụkọ ahụ.
- source_word: ἐφ’ ὃν
  choice: n’ahụ ya
  rationale: N’Igbo, nke a na-egosi onye ọgwụgwọ ahụ metụtara n'ụzọ doro anya ma dịkwa ụtọ n’ọnụ.
- source_word: γεγόνει
  choice: mere
  rationale: Ọ na-edobe ihe ahụ dị ka ihe mere, n’etinyeghị onye mere ya n’ime ngwaa ebe Grik na-ekwughị ya kpọmkwem.
- source_word: τὸ σημεῖον τοῦτο
  choice: ihe ịrịba ama a
  rationale: ‘Ihe ịrịba ama’ na-echekwa echiche nke σημεῖον dịka ihe omume nwere ihe ọ na-egosi, kama ịsụgharị ya naanị dịka ọrụ ebube.
- source_word: τῆς ἰάσεως
  choice: ọgwụgwọ
  rationale: ‘Ọgwụgwọ’ bụ okwu Igbo doro anya maka ἴασις n’ebe a, ya bụ ime ka onye ọrịa dị mma.
theological_decisions:
- issue: Nsụgharị σημεῖον n’ọnọdụ ọrụ ebube
  choice: ihe ịrịba ama
  alternative: ọrụ ebube
  rationale: Nke a na-echekwa ịdị ihe ahụ dịka ihe na-egosi ma na-agba akaebe, n’ebughị ụzọ kọwaa ya naanị dịka ihe ịtụnanya.
- issue: Onye mere ihe ahụ dịka γεγόνει si dị
  choice: mere n’ahụ ya
  alternative: e mere ya n’ahụ ya
  rationale: Grik lekwasịrị anya n’ihe mere, ọ naghị akpọ onye mere ya aha n’amaokwu a; nsụgharị a anaghị etinye onye na-eme ihe karịa ihe ederede kwuru.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-edobe njikọ nkọwa nke γάρ ma na-echekwa ‘ihe ịrịba ama’ dịka okwu bụ isi.
