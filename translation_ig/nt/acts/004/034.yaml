review_pass:
  verdict: revise
  source_fidelity: The draft conveys the explanatory γάρ, the emphatic absence of a needy person, the class of land- or house-owners, their repeated selling, and their bringing of the money received. The revision retains these elements while making the distributive force of ὅσοι clearer in Igbo.
  naturalness: “Ọ dịghị ọbụna onye ọ bụla” is needlessly repetitive in Standard Igbo. “Ọbụna otu onye ... adịghị” is more idiomatic and preserves the emphasis. “Ndị niile bụ ndị nwe...” also reads more naturally and clearly than “ndị niile nwere...” in this context.
  terminology: “Nọ ná mkpa,” “ndị nwe,” “ala,” “ụlọ,” and “ego e nwetara” are suitable modern Standard Igbo renderings. The footnote is adjusted so its more literal alternative reflects the Greek present participle, ‘the things being sold,’ without requiring that nuance in the main text.
  issues:
  - severity: low
    issue: Redundant negative expression
    rationale: The phrase “ọ dịghị ọbụna onye ọ bụla” combines two ways of expressing an indefinite negative and is less idiomatic than “ọbụna otu onye ... adịghị.”
  - severity: low
    issue: Owner phrase could be clearer
    rationale: “Ndị niile nwere ala ma ọ bụ ụlọ” can momentarily be read simply as ‘all people have land or houses.’ “Ndị niile bụ ndị nwe ala ma ọ bụ ụlọ” explicitly represents κτήτορες (‘owners’) while retaining ὅσοι (‘all who/as many as’).
  - severity: low
    issue: Footnote’s literal wording does not reflect the participle’s aspect
    rationale: The Greek τῶν πιπρασκομένων is literally ‘of the things being sold’; the revised note states this while leaving the contextual main-text rendering unchanged.
  revised_text: N’ihi na ọbụna otu onye nọ ná mkpa adịghị n’etiti ha; n’ihi na ndị niile bụ ndị nwe ala ma ọ bụ ụlọ na-ere ha, na-ewetakwa ego e nwetara n’ihe ndị e rere.[a]
