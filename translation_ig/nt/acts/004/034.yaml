  text: οὐδὲ γὰρ ἐνδεής τις ⸀ἦν ἐν αὐτοῖς· ὅσοι γὰρ κτήτορες χωρίων ἢ οἰκιῶν ὑπῆρχον, πωλοῦντες ἔφερον τὰς τιμὰς τῶν πιπρασκομένων
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/034.yaml
  text: For there was not even any needy person among them[a], for as many as were owners of fields or houses were selling them and bringing the proceeds of what was sold.
translation:
  language: ig
  text: N’ihi na ọbụna otu onye nọ ná mkpa adịghị n’etiti ha; n’ihi na ndị niile bụ ndị nwe ala ma ọ bụ ụlọ na-ere ha, na-ewetakwa ego e nwetara n’ihe ndị e rere.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'N’ụzọ nkịtị karị: “ọnụahịa ihe ndị a na-ere.” N’ebe a, okwu Grik ahụ pụtara ego e nwetara site n’ire ihe ndị ahụ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνδεής
  choice: onye nọ ná mkpa
  rationale: Nke a na-egosi onye ihe dị ya mkpa ma ọ bụ onye enweghị ihe ga-ezuru ya, n’emeghị ka okwu ahụ bụrụ naanị ịda ogbenye n’ihe gbasara ego.
- source_word: οὐδὲ γὰρ
  choice: N’ihi na ọ dịghị ọbụna
  rationale: “N’ihi na” na-egosi na amaokwu a na-akọwa ihe e kwuru tupu ya, ebe “ọbụna” na-echekwa nkwusi ike nke οὐδέ.
- source_word: τις ἦν ἐν αὐτοῖς
  choice: onye ọ bụla ... n’etiti ha
  rationale: Ọ bụ ụzọ Igbo dị mfe ma bụrụkwa nke okike isi kwuo na onye dị otú ahụ adịghị n’ime obodo ndị kwere ekwe.
- source_word: ὅσοι
  choice: ndị niile
  rationale: Na-egosi mmadụ niile so n’òtù a kọwara—ndị nwere ala ma ọ bụ ụlọ—n’agbasaghị ndị ọzọ.
- source_word: κτήτορες
  choice: ndị ... nwere
  rationale: “Nwere” bụ okwu Igbo doro anya ma dị mfe maka ndị nwe ihe onwunwe.
- source_word: χωρίων
  choice: ala
  rationale: N’ebe a, okwu ahụ na-ezo aka n’ala ma ọ bụ ibé ala; “ala” bụ okwu sara mbara ma dị n’okike n’Igbo.
- source_word: οἰκιῶν
  choice: ụlọ
  rationale: Ọ bụ nsụgharị kpọmkwem, doro anya nke οἰκία n’ọnọdụ a.
- source_word: ὑπῆρχον
  choice: nwere
  rationale: 'E jikọtara ya na κτήτορες n’ụzọ Igbo dị n’okike: “ndị niile nwere.”'
- source_word: πωλοῦντες
  choice: na-ere ha
  rationale: Ụdị ngwaa a na-echekwa omume na-aga n’ihu ma ọ bụ nke a na-eme ugboro ugboro, ma “ha” na-ezo aka n’ala ma ọ bụ ụlọ ndị ahụ.
- source_word: ἔφερον
  choice: na-ewetakwa
  rationale: Ụdị na- na-echekwa imperfect nke na-egosi omume a na-eme ugboro ugboro; “-kwa” jikọtara iwetara ego ahụ na ire ihe onwunwe.
- source_word: τὰς τιμὰς
  choice: ego e nwetara
  rationale: Ọ bụ ụzọ Igbo dị n’okike isi kọwaa ego sitere n’ire ihe, ebe “ọnụahịa” nwere ike ịdị ka naanị ego e kwuru ka ihe ahụ ree.
- source_word: τῶν πιπρασκομένων
  choice: n’ihe ndị e rere
  rationale: Na-echekwa ntụaka sara mbara nye ihe onwunwe ndị e rere, n’etinyeghị nkọwa na-adịghị na Grik.
theological_decisions:
- issue: Ma amaokwu a na-ekwu na onye ọ bụla rere ihe onwunwe ya niile
  choice: E ji “ndị niile nwere ... na-ere ha” chekwaa okwu Grik n’enweghị ikwu na onye ọ bụla rere ihe niile o nwere.
  alternative: “Onye ọ bụla rere ala ya na ụlọ ya niile.”
  rationale: Grik na-akọwa omume ndị nwe ala ma ọ bụ ụlọ, ma ọ naghị ekwu hoo haa na onye ọ bụla rere ihe onwunwe ya niile; ya mere, e kwesịghị ime ka ihe ahụ sie ike karịa isi mmalite.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. A họọrọ usoro ngwaa “na-ere ... na-ewetakwa” iji gosipụta omume a na-eme ugboro ugboro, ma zere okwu iwu ma ọ bụ nke otu ụka pụrụ iche.
