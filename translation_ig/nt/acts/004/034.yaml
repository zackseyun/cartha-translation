revisions:
- from: N’ihi na ọ dịghị ọbụna onye ọ bụla nọ ná mkpa n’etiti ha, n’ihi na ndị niile nwere ala ma ọ bụ ụlọ na-ere ha, na-ewetakwa ego e nwetara n’ihe ndị e rere.[a]
  to: N’ihi na ọbụna otu onye nọ ná mkpa adịghị n’etiti ha; n’ihi na ndị niile bụ ndị nwe ala ma ọ bụ ụlọ na-ere ha, na-ewetakwa ego e nwetara n’ihe ndị e rere.[a]
  rationale: The revision removes an awkward double-indefinite negative, makes the ownership category explicit, and refines the lexical footnote. It does not imply that every member sold all possessions, nor does it alter the repeated/customary sense of the Greek imperfects.
