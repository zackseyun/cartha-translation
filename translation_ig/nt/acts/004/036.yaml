source:
  edition: SBLGNT
  text: ⸀Ἰωσὴφ δὲ ὁ ἐπικληθεὶς Βαρναβᾶς ἀπὸ τῶν ἀποστόλων, ὅ ἐστιν μεθερμηνευόμενον υἱὸς παρακλήσεως, Λευίτης, Κύπριος τῷ γένει,
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/036.yaml
  text: Joseph[a], who was called Barnabas by the apostles—which translated means son of encouragement—a Levite, a native of Cyprus,
translation:
  language: ig
  text: Ma Josef, onye ndị ozi kpọrọ Banabas—nke a, ma a sụgharịa ya, pụtara “nwa nke agbamume”[a]—onye Livaị, onye Saịprọs site n'ọmụmụ,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “nwa nke ndụmọdụ,” “nwa nke nkasi obi,” ma ọ bụ “nwa nke ịkasi obi.” Okwu Grik ahụ nwere ike ịpụta ịgba ume, ịdụ mmadụ ọdụ ka o mee ihe, ma ọ bụ ịkasi obi.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰωσὴφ
  choice: Josef
  rationale: Nsụgharị aha mmadụ a n'ụdị a na-eji n'Igbo, nke na-eme ka aha ahụ doo onye na-agụ ya anya.
- source_word: δὲ
  choice: Ma
  rationale: N'ebe a δέ bụ njikọ dị nro nke na-ebute onye ọhụrụ dịka ihe atụ; “Ma” na-egosi mgbanwe ahụ n'akọghị na e nwere nnukwu esemokwu.
- source_word: ἐπικληθεὶς Βαρναβᾶς ἀπὸ τῶν ἀποστόλων
  choice: onye ndị ozi kpọrọ Banabas
  rationale: Ọ na-egosi na ndị ozi bụ ndị nyere Josef aha ahụ; e tinyeghị “ọzọkwa” n'ihi na okwu Grik ekwughị ya kpọmkwem.
- source_word: ὅ ἐστιν μεθερμηνευόμενον
  choice: nke a, ma a sụgharịa ya, pụtara
  rationale: Ọ na-edobe nkọwa Luk nyere banyere ihe aha Semitik ahụ pụtara mgbe a sụgharịrị ya.
- source_word: υἱὸς παρακλήσεως
  choice: nwa nke agbamume
  rationale: “Agbamume” bụ okwu sara mbara, dị mfe nghọta, nke nwere ike ịgụnye iwusi mmadụ obi na ịkwalite ya ime ihe; e debere nghọta ndị ọzọ n'ala-okwu.
- source_word: Λευίτης
  choice: onye Livaị
  rationale: Nke a bụ aha agbụrụ na ọnọdụ okpukpe ya, a na-ekwukwa ya n'ụzọ Igbo nkịtị.
- source_word: Κύπριος τῷ γένει
  choice: onye Saịprọs site n'ọmụmụ
  rationale: τῷ γένει na-egosi ebe mmadụ si ma ọ bụ ebe a mụrụ ya; nsụgharị a na-edobe echiche ọmụmụ na mbido ya.
theological_decisions:
- issue: Uzo e si aghọta παρακλήσεως n'aha Banabas
  choice: “agbamume” n'ahịrịokwu bụ isi
  alternative: “ndụmọdụ siri ike,” “nkasi obi,” ma ọ bụ “ịkasi obi”
  rationale: παράκλησις nwere ike ịpụta ịgba ume, ịrịọ ma ọ bụ ịdụ mmadụ ọdụ ka o mee ihe, na ịkasi obi. Amaokwu ahụ anaghị amanye naanị otu nghọta, ya mere e jiri okwu sara mbara mee ihe ma debe ndị ọzọ n'ala-okwu.
translation_notes:
  register: Standard Igbo dị ugbu a, dị nsọ ma dị mfe nghọta. E ji “Ma” debe njikọ dị nro nke δέ, ma e zere itinye echiche oge dịka “Ugbu a.” Akara ala-okwu [a] dị n'akụkụ okwu ọ na-akọwa.
