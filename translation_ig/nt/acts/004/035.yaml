  text: καὶ ἐτίθουν παρὰ τοὺς πόδας τῶν ἀποστόλων· διεδίδετο δὲ ἑκάστῳ καθότι ἄν τις χρείαν εἶχεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/035.yaml
  text: and they were laying them at the apostles’ feet[b][a], and it was being distributed to each one according as anyone had need.
translation:
  language: ig
  text: Ha na-etinye ha n’ụkwụ ndị ozi[b][a], a na-ekesakwa ya nye onye ọ bụla dị ka mkpa ya si dị.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’ihu ndị ozi.” Grik kwuru kpọmkwem, “n’akụkụ ụkwụ ndị ozi,” na-echekwa ihe oyiyi nke itinye ihe ha nwetara n’ire ihe n’okpuru nlekọta ndị ozi.
    reason: lexical_alternative
  - marker: b
    text: Ihe “ha na-etinye” na ihe “a na-ekesa” ekwughị aha n’amaokwu a; amaokwu gara aga na-eme ka a ghọta na ọ bụ ihe ha nwetara n’ire ihe ha rere.
    reason: cross_reference
lexical_decisions:
- source_word: ἐτίθουν
  choice: Ha na-edebekwa
  rationale: Ụdị imperfect na-egosi omume a na-eme ugboro ugboro ma ọ bụ na-aga n’ihu. “Na-edebekwa” na-egosipụta nke a n’Igbo, ebe “-kwa” jikọtara ahịrịokwu a na ihe e kwuru n’amaokwu gara aga.
- source_word: παρὰ τοὺς πόδας τῶν ἀποστόλων
  choice: n’ụkwụ ndị ozi
  rationale: Nke a na-echekwa ihe oyiyi Grik nke idowe ihe n’ụkwụ ndị ozi, ma n’otu oge na-egosi na e tinyere ya n’okpuru nlekọta na ikike ha.
- source_word: διεδίδετο
  choice: a na-ekesakwa ya
  rationale: Usoro “a na-” na-echekwa olu mmebere na onye mere nkesa ekwughị kpọmkwem; imperfect na-egosikwa nkesa a na-eme mgbe niile. “Ya” na-ezo aka n’ihe e nwetara n’ire ihe, nke amaokwu gara aga mere ka a ghọta.
- source_word: ἑκάστῳ
  choice: nye onye ọ bụla
  rationale: Nke a na-egosipụta na a na-enye ndị mmadụ n’otu n’otu.
- source_word: καθότι ἄν τις χρείαν εἶχεν
  choice: dị ka mkpa ya si dị
  rationale: Nkebiokwu a na-egosi na ihe onye ọ bụla natara kwekọrọ n’ókè mkpa ya; nsụgharị a bụ Igbo nkịtị ma na-edobe echiche nke ntụnyere ahụ.
- source_word: τις
  choice: onye ọ bụla
  rationale: N’ebe a, okwu a bụ nke na-adịghị akọwa nwoke ma ọ bụ nwaanyị kpọmkwem, ya mere “onye ọ bụla” na-enye echiche izugbe ya.
- source_word: χρείαν
  choice: mkpa
  rationale: “Mkpa” bụ okwu Igbo doro anya ma kwekọọ na echiche nke mkpa ma ọ bụ ihe dị mmadụ mkpa.
theological_decisions:
- issue: Ma a ga-akọwapụta ihe ha na-edowe na ihe a na-ekesa
  choice: E jiri nnọchiaha “ha” na “ya” hapụ ihe ahụ ka amaokwu gara aga kọwaa ya.
  alternative: Ịtinye “ego ahụ” ma ọ bụ “ihe ha nwetara n’ire ihe ahụ” n’ahịrịokwu n’onwe ya.
  rationale: Grik ekwughị ihe ahụ aha n’amaokwu a kama ọ dabere n’ihe e kwuru n’amaokwu 34. Nnọchiaha na-eme ka Igbo doo anya n’enweghị ịgbakwụnye nkọwa karịrị ihe odide ahụ.
- issue: Ihe okwu idowe n’ụkwụ ndị ozi pụtara
  choice: 'E debere ihe oyiyi ahụ kpọmkwem: “n’ụkwụ ndị ozi.”'
  alternative: Ịsụgharị ya naanị dịka “n’ihu ndị ozi,” nke na-eme ka echiche nlekọta ma ọ bụ ikike pụta ìhè.
  rationale: Okwu ahụ nwere ike igosi itinye ihe n’okpuru nlekọta ndị ozi, ma ihe odide Grik ji ihe oyiyi ụkwụ mee ya. Idebe ihe oyiyi ahụ na-egbochi nsụgharị ahụ ịkọwa ihe karịrị akarị.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. Usoro “na-ede” na “a na-ekesa” na-egosipụta omume gara n’ihu ma ọ bụ nke a na-eme ugboro ugboro; e chekwara olu onye-emeghị-ka-a-mara nke διεδίδετο. E tinyere akara nkọwa ala peeji [b][a] ozugbo n’ebe ha metụtara dịka n’usoro ederede nyocha ahụ.
