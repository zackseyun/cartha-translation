  rationale: Replaced “na-edebekwa” with “na-etinye” to render the concrete placing action of ἐτίθουν more naturally and precisely in Standard Igbo. The footnote wording was smoothed while preserving its lexical alternative and the contextual identification of the implicit objects. No theological or interpretive expansion has been added.
