  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ τὰ νῦν, κύριε, ἔπιδε ἐπὶ τὰς ἀπειλὰς αὐτῶν καὶ δὸς τοῖς δούλοις σου μετὰ παρρησίας πάσης λαλεῖν τὸν λόγον σου,
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/029.yaml
  text: And now[a], Lord, look upon their threats and grant your servants to speak your word with all boldness,
translation:
  language: ig
  text: Ma ugbu a, Onyenweanyị, leba anya n’iyi egwu ha, nyekwa ndị na-ejere gị ozi[a] ka ha jiri nkwuwa okwu zuru ezu kwuo okwu gị.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị ohu gị.” Okwu Grik ahụ bụ doulos, nke nwere ike ịpụta onye bụ nke nna ya ukwu ma nọ n’okpuru ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ τὰ νῦν
  choice: Ma ugbu a
  rationale: Ọ bụ ụzọ e si esi n’ihe e kwuru tupu mgbe ahụ banye n’arịrịọ gbasara ọnọdụ dị ugbu a; ọ na-ada nke ọma n’Ejije Ọma nke Igbo.
- source_word: κύριε
  choice: Onyenwe anyị
  rationale: Ọ bụ okwu a na-akpọ Chineke kpọmkwem n’ekpere; “Onyenwe anyị” bụ okwu Igbo doro anya ma dị nsọ maka κύριε n’ebe a.
- source_word: ἔπιδε ἐπὶ
  choice: leba anya n’
  rationale: Ọ na-echekwa arịrịọ ka Chineke tụgharịa uche ya n’ihe ahụ ma hụ ya nke ọma, n’enweghị ịkọwapụta ihe ọ ga-eme banyere ya.
- source_word: ἀπειλὰς
  choice: iyi egwu
  rationale: Nke a bụ okwu Igbo a na-ejikarị akọwa okwu ma ọ bụ omume e ji atụ mmadụ egwu.
- source_word: δὸς
  choice: nyekwa
  rationale: “Nye” na-echekwa ihe imperativu Grik pụtara; “-kwa” na-ejikọta arịrịọ nke abụọ a na nke mbụ n’ụzọ ebumpụta ụwa.
- source_word: τοῖς δούλοις σου
  choice: ndị na-ejere gị ozi
  rationale: N’ọnọdụ ekpere a, okwu a na-egosi ndị nọ n’okpuru Chineke ma na-ejere ya ozi. Nsụgharị a bụ Igbo nke oge a ma dị mfe nghọta, ebe nkọwa ala peeji na-echekwa echiche siri ike nke δοῦλος banyere ịbụ onye nwe ya nwere.
- source_word: μετὰ παρρησίας πάσης
  choice: jiri nkwuwa okwu zuru ezu
  rationale: “Nkwuwa okwu” na-egosi ikwu okwu n’ihu ọha n’atụghị ụjọ, ebe “zuru ezu” na-echekwa ike nke πάσης.
- source_word: λαλεῖν
  choice: kwuo
  rationale: Ọ na-enye kpọmkwem echiche nke ikwu okwu, n’etinyeghị echiche siri ike karịa nke dị na Grik, dị ka “kpọsaa.”
- source_word: τὸν λόγον σου
  choice: okwu gị
  rationale: Ọ na-echekwa akpaala okwu Akwụkwọ Nsọ nke na-ezo aka n’ozi Chineke ha na-ekwu.
theological_decisions:
- issue: Otú e si sụgharịa δοῦλος mgbe a na-ekwu banyere mmekọrịta ndị kwere ekwe na Chineke
  choice: ndị na-ejere gị ozi
  alternative: ndị ohu gị
  rationale: N’ekpere a, isi ihe a na-elekwasị anya bụ nrubeisi na ije ozi nye Chineke. “Ndị na-ejere gị ozi” bụ okwu Igbo ebumpụta ụwa nke na-adịghị eme ka onye na-agụ ya lekwasị anya naanị n’usoro ịgba ohu; ma nkọwa ala peeji na-ekwupụta echiche ọzọ dị n’okwu Grik ahụ.
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, nke dị ugwu ma dị mfe nghọta. Ahịrịokwu ahụ na-echekwa ụda ekpere na arịrịọ abụọ dị na Grik, ma zere ịkọwapụta ihe Chineke ga-eme banyere iyi egwu ahụ.
