source:
  edition: SBLGNT
  text: εἰ ἡμεῖς σήμερον ἀνακρινόμεθα ἐπὶ εὐεργεσίᾳ ἀνθρώπου ἀσθενοῦς, ἐν τίνι οὗτος ⸀σέσωσται,
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/009.yaml
  text: If we are being examined today concerning a good deed done to a sick man[b][a], by what means this man has been healed—
translation:
  language: ig
  text: Ọ bụrụ na a na-enyocha anyị taa n’ihi ezi ihe e meere nwoke na-adịghị ike, n’ụzọ dị aṅaa ka nwoke a si nweta ahụ ike—[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “a zọpụtala nwoke a” ma ọ bụ “nwoke a agbakeela.” Ngwaa Grik a nwere ike ịpụta ịnapụta mmadụ, ịzọpụta ya, ma ọ bụ ime ka ahụ́ dị ya mma. N’ebe a, ihe gbara okwu ahụ gburugburu na-arụtụ aka n’ọgwụgwọ anụ ahụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνακρινόμεθα
  choice: a na-enyocha anyị
  rationale: Nke a na-egosi ajụjụ na nyocha n’ọnọdụ ikpe, ma ọ naghị ekwubiga ya ókè dị ka ikpe zuru ezu.
- source_word: ἐπὶ εὐεργεσίᾳ
  choice: n’ihi ezi ihe e mere
  rationale: Ọ na-egosi ihe ọma e mere nke ghọrọ ihe kpatara ma ọ bụ isiokwu nyocha ahụ, ma na-edobe ihe ijuanya dị n’ịjụ ha ajụjụ maka ọrụ ọma.
- source_word: ἀνθρώπου ἀσθενοῦς
  choice: nye otu nwoke na-adịghị ike
  rationale: ἀσθενής pụtara onye na-adịghị ike ma ọ bụ onye ọrịa; n’ebe a ọ na-ezo aka n’ọnọdụ anụ ahụ nwoke ahụ n’enweghị ịkọwa nkwarụ ya karịa ihe Grik kwuru.
- source_word: ἐν τίνι
  choice: ụzọ e si
  rationale: Nke a na-edobe obosara ajụjụ Grik banyere ụzọ ma ọ bụ onye e ji mee ihe ahụ, kama iburu ụzọ kpọọ onye ahụ tupu azịza amaokwu na-esonụ.
- source_word: σέσωσται
  choice: mee ka ahụ́ dị ... mma
  rationale: N’ọnọdụ a, ngwaa ahụ na-ekwu kpọmkwem banyere mgbake anụ ahụ. Ihe ọ pụkwara ịpụta banyere nzọpụta ka e debere n’akụkụ nkọwa.
theological_decisions:
- issue: Ihe σέσωσται pụtara n’ọnọdụ ọgwụgwọ
  choice: mee ka ahụ́ dị nwoke a mma
  alternative: zọpụta nwoke a; mee ka nwoke a gbakee
  rationale: Ihe gbara amaokwu ahụ gburugburu na-elekwasị anya n’ịgwọ nwoke ahụ n’anụ ahụ, ma ngwaa σῴζω nwekwara ike ịpụta ịzọpụta. Ya mere, ederede bụ isi gosiri mgbake anụ ahụ, ebe nkọwa [a] na-edobe njikọ okwu ahụ na nzọpụta.
translation_notes:
  register: Asụsụ Igbo Izugbe dị ugbu a, dị ùgwù ma doo ndị nkịtị anya. Ahịrịokwu ahụ na-edobe ọdịdị okwu ọnọdụ “Ọ bụrụ na” na akara nkwụsị n’azụ, ebe okwu Pita na-aga n’ihu n’amaokwu na-esonụ.
