- from: Ọ bụrụ na a na-enyocha anyị taa n’ihi ezi ihe e mere nye otu nwoke na-adịghị ike, ya bụ, ụzọ e si mee ka ahụ́ dị nwoke a mma—[a]
  to: Ọ bụrụ na a na-enyocha anyị taa n’ihi ezi ihe e meere nwoke na-adịghị ike, n’ụzọ dị aṅaa ka nwoke a si nweta ahụ ike—[a]
