review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the believers' unity, the emphatic denial that any individual treated possessions as exclusively his or her own, and the communal status of all possessions. A small adjustment makes the final clause more idiomatic while retaining the Greek predicate sense (“all things were common to them”).
  naturalness: The wording is generally clear Standard Igbo. “Ihe niile bụkwa nke ha ọnụ” is more natural and direct than “ihe niile bụ nke ha nwekọrọ ọnụ,” while avoiding an unnecessarily interpretive description of a particular ownership system.
  terminology: “otu obi na otu mkpụrụ obi” appropriately retains both καρδία and ψυχή. “nke ya onwe ya” correctly communicates ἴδιον without implying compulsory abolition of personal property.
  issues:
  - severity: medium
    issue: Footnote a does not give a valid alternative for its anchor.
    rationale: The existing note, “ha dị n’otu kpamkpam,” collapses “heart and soul” into a general statement of unity and does not correspond closely to the anchored Greek expression. It should offer an alternative that preserves both terms.
  - severity: low
    issue: The final communal-possession clause is somewhat awkward.
    rationale: “bụ nke ha nwekọrọ ọnụ” is understandable, but “bụkwa nke ha ọnụ” is a more idiomatic rendering of πάντα κοινά and preserves the Greek’s descriptive copular formulation.
  - severity: low
    issue: Footnote b inaccurately characterizes the singular reference as only “ya.”
    rationale: The Igbo text uses both “o” and “ya” in the relevant expression. The note should identify the singular forms without claiming that Igbo singularity itself directly reproduces the Greek grammatical construction.
  revised_text: Ìgwè ndị ahụ kweere nwere otu obi na otu mkpụrụ obi[a]. N’ime ha, ọ dịghị ọbụna otu onye kwuru na ihe ọ bụla o nwere bụ nke ya onwe ya[b]; kama, ihe niile bụkwa nke ha ọnụ.
