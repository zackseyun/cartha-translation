id: ACT.4.32
reference: Acts 4:32
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Τοῦ δὲ πλήθους τῶν πιστευσάντων ἦν ⸀καρδία καὶ ⸀ψυχὴ μία, καὶ οὐδὲ εἷς τι τῶν ὑπαρχόντων ⸀αὐτῷ ἔλεγεν ἴδιον εἶναι, ἀλλ’ ἦν αὐτοῖς ⸀πάντα κοινά.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/032.yaml
  text: The multitude of those who had believed were of one heart and soul[a], and not even one of them said that anything belonging to him was his own[b], but all things were held in common among them.
translation:
  language: ig
  text: Ìgwè ndị ahụ kweere nwere otu obi na otu mkpụrụ obi[a]. N’ime ha, ọ dịghị ọbụna otu onye kwuru na ihe ọ bụla o nwere bụ nke ya onwe ya[b]; kama, ihe niile bụkwa nke ha ọnụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ: “ha dị n’otu n’obi na mkpụrụ obi.”'
    reason: lexical_alternative
  - marker: b
    text: Okwu ndị dị n’otu, “o” na “ya,” na-ekwu maka onye ọ bụla n’otu n’otu. Nke a kwekọrọ na okwu Grik dị n’otu, “dịịrị ya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πλήθους
  choice: Ìgwè
  rationale: “Ìgwè” na-egosi ọtụtụ mmadụ dị ka otu nnukwu ọgbakọ, n’emeghị ka okwu ahụ bụrụ naanị ọnụ ọgụgụ.
- source_word: τῶν πιστευσάντων
  choice: ndị ahụ kweere
  rationale: Nke a na-edobe πιστευσάντων dị ka omume ha mere tupu nkọwa a banyere ndụ ha ọnụ.
- source_word: καρδία καὶ ψυχὴ μία
  choice: nwere otu obi na otu mkpụrụ obi
  rationale: Nke a na-edobe ma “obi” ma “mkpụrụ obi,” ma na-egosikwa ịdị n’otu n’ime echiche, ọchịchọ, na ndụ ha.
- source_word: οὐδὲ εἷς
  choice: Ọ dịghị ọbụna otu onye n’ime ha
  rationale: “Ọbụna otu onye” na-egosipụta ike nkwusi okwu dị na οὐδὲ εἷς.
- source_word: τι τῶν ὑπαρχόντων αὐτῷ
  choice: ihe ọ bụla o nwere
  rationale: Nke a bụ ụzọ Igbo dị mfe ma doo anya isi kwuo ihe ọ bụla dịịrị onye ahụ ma ọ bụ ihe onwunwe ya.
- source_word: ἔλεγεν ἴδιον εἶναι
  choice: kwuru na ... bụ nke ya onwe ya
  rationale: “Nke ya onwe ya” na-edobe echiche nke ihe mmadụ weere dị ka ihe nke aka ya, n’agbakwụnyeghị na ọ jụrụ ịkekọrịta ya n’ụzọ ọ bụla akọwaghị n’amaokwu ahụ.
- source_word: πάντα κοινά
  choice: ihe niile bụ nke ha nwekọrọ ọnụ
  rationale: Nke a na-edobe usoro ahịrịokwu Grik na echiche na ihe ndị ahụ bụ ihe dịịrị obodo ndị kwere ekwe ọnụ.
theological_decisions:
- issue: Nkọwa banyere ihe onwunwe ndị kwere ekwe na Jerusalem
  choice: A sụgharịrị amaokwu ahụ dị ka akụkọ na-akọ na ha ji afọ ofufo were ihe ha nwere dị ka ihe ha nwekọrọ ọnụ.
  alternative: Ịsụgharị ya ka ọ bụrụ na e wepụrụ ihe onwunwe onye ọ bụla kpamkpam, ma ọ bụ ime ka ịdịkọ ihe ọnụ ahụ yie ihe na-adịghị mkpa.
  rationale: Grik na-ekwu na ọ dịghị onye kpọrọ ihe o nwere nke naanị ya, nakwa na ihe niile bụ ihe ha nwekọrọ ọnụ. Nsụgharị ahụ na-edobe esemokwu echiche abụọ a n’ebugharịghị usoro ndọrọ ndọrọ ọchịchị ma ọ bụ ụkpụrụ otu ụka e mesịrị bịa n’ime amaokwu ahụ.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. A hapụrụ “obi” na “mkpụrụ obi” abụọ ahụ iji chekwaa ihe oyiyi na nrụgide dị na Grik, ebe “nwekọrọ ọnụ” na-akọwa κοινά n’ụzọ mmadụ nkịtị ga-aghọta n’enweghị itinye ozizi pụrụ iche.
