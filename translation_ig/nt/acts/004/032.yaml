revisions:
- from: Ìgwè ndị ahụ kweere nwere otu obi na otu mkpụrụ obi[a]. Ọ dịghị ọbụna otu onye n’ime ha kwuru na ihe ọ bụla o nwere bụ nke ya onwe ya[b]; kama, ihe niile bụ nke ha nwekọrọ ọnụ.
  to: Ìgwè ndị ahụ kweere nwere otu obi na otu mkpụrụ obi[a]. N’ime ha, ọ dịghị ọbụna otu onye kwuru na ihe ọ bụla o nwere bụ nke ya onwe ya[b]; kama, ihe niile bụkwa nke ha ọnụ.
  rationale: The revision retains the source’s emphatic distributive singular and its careful description of communal possessions, without imposing a later economic or ecclesial interpretation. It corrects the anchored alternative note so that it reflects “one heart and soul,” improves the idiom of the final clause, and clarifies the grammatical explanation in note b.
