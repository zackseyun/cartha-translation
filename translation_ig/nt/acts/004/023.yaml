id: ACT.4.23
reference: Acts 4:23
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἀπολυθέντες δὲ ἦλθον πρὸς τοὺς ἰδίους καὶ ἀπήγγειλαν ὅσα πρὸς αὐτοὺς οἱ ἀρχιερεῖς καὶ οἱ πρεσβύτεροι εἶπαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/023.yaml
  text: After they were released[a], they went to their own people and reported all that the chief priests and the elders had said to them.
translation:
  language: ig
  text: Mgbe a tọhapụrụ ha, ha gakwuuru ndị nke ha[a] ma kọọrọ ha ihe niile ndị isi nchụaja na ndị okenye gwara ha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị ibe ha.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπολυθέντες
  choice: Mgbe a tọhapụrụ ha
  rationale: Nkebi participle a dị n'oge aorist ma dịkwa na passive, na-egosi ihe mere tupu ngwaa bụ isi; “Mgbe a tọhapụrụ ha” na-enye echiche ahụ n'Igbo dị mfe ma kwekọọ n'ọnọdụ njide na ntọhapụ.
- source_word: δὲ
  choice: E gosipụtaghị ya iche
  rationale: δέ bụ njikọ dị nro; n'Igbo, nkebi “Mgbe a tọhapụrụ ha” ejirila ụzọ ebumpụta ụwa jikọta amaokwu a na ihe bu ya ụzọ, ya mere itinye “ma” ma ọ bụ “mgbe ahụ” nwere ike ịdị arọ ma ọ bụ gbanwee ntakịrị mmekọrịta okwu.
- source_word: ἦλθον
  choice: ha gakwuuru
  rationale: ἔρχομαι nwere ike ịbụ ‘ịbịa’ ma ọ bụ ‘ịga’ dabere n'echiche onye na-akọ akụkọ. “Gakwuuru” bụ Igbo ebumpụta ụwa maka ịga n'ebe otu ndị nọ.
- source_word: πρὸς τοὺς ἰδίους
  choice: ndị nke ha
  rationale: Nke a na-edobe ụdị okwu Grik ahụ, nke pụtara ndị ha na ha nọ n'otu ma ọ bụ ndị ibe ha, n'emeghị ka ọ bụrụ otu ìgwè akọwapụtara karịa ka isi mmalite siri kwuo.
- source_word: ἀπήγγειλαν
  choice: kọọrọ ha
  rationale: ἀπαγγέλλω pụtara izigara ma ọ bụ ịkọrọ ndị ọzọ akụkọ. “Kọọrọ ha” bụ okwu Igbo doro anya ma dị ugbu a maka ịkọ ihe mere ma ọ bụ ihe e kwuru.
- source_word: ὅσα
  choice: ihe niile
  rationale: “Ihe niile” na-echekwa echiche zuru ezu nke ὅσα.
- source_word: πρὸς αὐτοὺς
  choice: gwara ha
  rationale: Mgbe πρός na λέγω nọkọrọ, ọ na-egosikarị onye a gwara okwu; “gwara ha” bụ usoro Igbo kwụ ọtọ, ọ naghị etinye echiche ‘megide ha’ nke preposition ahụ n'onwe ya na-adịghị amanye.
- source_word: οἱ ἀρχιερεῖς
  choice: ndị isi nchụaja
  rationale: Nke a na-ezo aka n'ụmụnna ọchịchị nchụaja kachasị elu, ọ bụghị n'ọtụtụ ndị ji otu ọkwa nke nnukwu onye nchụaja.
- source_word: οἱ πρεσβύτεροι
  choice: ndị okenye
  rationale: N'ọnọdụ a, okwu ahụ na-ezo aka n'ndị ndu ndị Juu a ma ama; “ndị okenye” bụ okwu Baịbụl Igbo a maara nke ọma ma dabara n'ọrụ ọchịchị ahụ.
- source_word: εἶπαν
  choice: gwara ha
  rationale: Usoro amaokwu ahụ na nkebi oge dị na mmalite na-eme ka o doo anya n'Igbo na okwu ndị isi ahụ kwuru mere tupu Pita na Jọn akọọrọ ndị nke ha ya; a dịghị mkpa iji ụdị past perfect pụrụ iche nke Bekee.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị ugbu a ma nwee ugwu. E ji “ndị nke ha” chekwaa ntakịrị enweghị nkọwa doro anya dị na τοὺς ἰδίους, ebe nkọwa ala peeji na-enye ụdị ọzọ dị mfe nghọta. Akara ala peeji [a] pụtara kpọmkwem n'akụkụ okwu ọ na-akọwa.
