  verdict: revise
  source_fidelity: The draft accurately represents the aorist passive temporal participle ('Mgbe a tọhapụrụ ha'), the movement to their associates, the comprehensive report, and the institutional titles 'ndị isi nchụaja' and 'ndị okenye.' The two occurrences of 'ha' appropriately retain the contextual reference to Peter and John without importing names absent from the verse.
  naturalness: 'One orthographic/usage correction is advisable: Standard Igbo normally writes the directional verb here as ''gakwuru,'' not ''gakwuuru.'' Adding ''ma'' naturally represents the Greek καί between the two coordinated actions.'
  terminology: ‘Ndị isi nchụaja’ accurately conveys οἱ ἀρχιερεῖς as leading priestly authorities, and ‘ndị okenye’ is the established institutional rendering of οἱ πρεσβύτεροι. ‘Ndị nke ha’ preserves the Greek's deliberately compact reference; the footnote supplies the clearer contextual alternative.
  issues:
