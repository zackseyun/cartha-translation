    issue: The verb is written ‘gakwuuru.’
    rationale: Use ‘gakwuru’ for standard modern Igbo orthography and idiom in this sense (‘went to’).
  - severity: low
    issue: The footnote redundantly offers the exact wording of the main text as a ‘more literal’ alternative.
    rationale: Since the main text already has ‘ndị nke ha,’ the footnote should simply give the contextual alternative ‘ndị ibe ha.’
