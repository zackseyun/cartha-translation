- from: ya na Anas, nnukwu onye nchụàjà, na Kayafas, na Jọn, na Alegzanda, na ndị niile sitere n’ezinụlọ nnukwu onye nchụàjà[a],
  to: ya na Anas, onyeisi nchụàjà, na Kaịfas, na Jọn, na Aleksanda, na ndị niile si n’agbụrụ ndịisi nchụàjà pụta,[a]
  rationale: The revision preserves the Greek’s straightforward designation of Annas as high priest and its open-ended reference to all members of the high-priestly lineage. It avoids importing the interpretation “former high priest” and avoids narrowing the lineage to one individual high priest’s household. The footnote retains the main lexical alternatives for γένος.
  reviewer_model: gpt-5.6-terra
