  variant: Standard Igbo
source:
  edition: SBLGNT
  text: (καὶ ⸂Ἅννας ὁ ἀρχιερεὺς καὶ Καϊάφας καὶ Ἰωάννης καὶ Ἀλέξανδρος⸃ καὶ ὅσοι ἦσαν ἐκ γένους ἀρχιερατικοῦ),
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/006.yaml
  text: and Annas the high priest[a], and Caiaphas, and John, and Alexander, and all who were of the high-priestly family,
translation:
  language: ig
  text: ya na Anas, onyeisi nchụàjà, na Kaịfas, na Jọn, na Aleksanda, na ndị niile si n’agbụrụ ndịisi nchụàjà pụta,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị niile sitere n’usoro ọmụmụ ndịisi nchụàjà,” ma ọ bụ “ndị niile bụ ndị ezinụlọ ndịisi nchụàjà.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἅννας
  choice: Anas
  rationale: Ụdị e si ede aha Grik a n’Igbo n’ụzọ doro anya ma kwekọọ n’ịkpọpụta ya.
- source_word: ὁ ἀρχιερεὺς
  choice: nnukwu onye nchụàjà
  rationale: Nke a bụ aha ọkwá ἀρχιερεύς n’Igbo a na-aghọta nke ọma; e debere ya dịka aha e nyere Anas n’ihe odide Grik, n’agbanyeghị ajụjụ banyere onye nọ n’ọkwá ahụ n’oge ahụ.
- source_word: Καϊάφας
  choice: Kayafas
  rationale: Nsụgharị mkpụrụokwu aha mmadụ ahụ n’ụdị dabara n’usoro mkpụrụedemede na mkpọpụta Igbo.
- source_word: Ἰωάννης
  choice: Jọn
  rationale: Ụdị aha a maara nke ọma n’Igbo maka Ἰωάννης.
- source_word: Ἀλέξανδρος
  choice: Alegzanda
  rationale: Nsụgharị mkpụrụokwu aha Grik ahụ n’ụdị dị mfe ndị na-agụ Igbo ịkpọpụta.
- source_word: ὅσοι
  choice: ndị niile
  rationale: Ọ na-egosipụta ndị niile so n’otu ahụ n’Igbo nkịtị ma doo anya.
- source_word: ἦσαν
  choice: sitere
  rationale: N’ụlọokwu ἦσαν ἐκ γένους, Igbo na-ekwu ya nke ọma dịka ‘sitere n’ezinụlọ,’ nke na-egosipụta ịbụ onye otu agbụrụ ma ọ bụ ezinụlọ ahụ.
- source_word: ἐκ γένους ἀρχιερατικοῦ
  choice: sitere n’ezinụlọ nnukwu onye nchụàjà
  rationale: γένος nwere ike ịpụta ezinụlọ, agbụrụ, ma ọ bụ usoro ọmụmụ; okwu a na-egosipụta njikọ ezinụlọ na ndị isi nchụàjà, ọ bụghị naanị ijide ọkwá.
theological_decisions:
- issue: Ịkpọ Anas ‘nnukwu onye nchụàjà’ n’agbanyeghị ajụjụ akụkọ ihe mere eme banyere onye ji ọkwá ahụ n’oge ahụ
  choice: 'E debere aha ọkwá ahụ kpọmkwem: ‘Anas, nnukwu onye nchụàjà.’'
  alternative: ‘Anas, onye bụbu nnukwu onye nchụàjà’ ma ọ bụ ‘Anas, onyeisi ndị nchụàjà.’
  rationale: Ihe odide Grik kpọrọ Anas ὁ ἀρχιερεύς. Ịtinye ‘onye bụbu’ ga-akọwa ma dozie esemokwu ahụ karịa ka isi mmalite siri kwuo ya.
translation_notes:
  register: E ji Igbo ọkọlọtọ nke oge a, dị ùgwù ma dị mfe nghọta. E debere usoro ndepụta nke Grik, ma jiri ‘ezinụlọ’ mee ka echiche γένος pụta n’ụzọ nkịtị; ihe odide nkọwa ala peeji na-echekwa nhọrọ ‘agbụrụ’ na ‘usoro ọmụmụ.’
