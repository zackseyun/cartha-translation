    reason: lexical_alternative
  revision_rationale: The revision preserves the Greek’s straightforward designation of Annas as high priest and its open-ended reference to all members of the high-priestly lineage. It avoids importing the interpretation “former high priest” and avoids narrowing the lineage to one individual high priest’s household. The footnote retains the main lexical alternatives for γένος.
