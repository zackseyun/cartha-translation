review_pass:
  verdict: revise
  source_fidelity: The draft accurately retains the list structure, names, Annas’s explicit title, and the inclusive sense of ὅσοι. However, “ezinụlọ nnukwu onye nchụàjà” can mean the household of one particular high priest, whereas ἐκ γένους ἀρχιερατικοῦ denotes membership in a high-priestly lineage or clan. The revision makes that adjectival/lineage sense clearer without resolving historical questions about Annas’s office.
  naturalness: The revised wording uses natural Standard Igbo title syntax, “onyeisi nchụàjà,” and the more conventional Igbo spelling “Aleksanda.” “Ndị niile si n’agbụrụ ndịisi nchụàjà pụta” is idiomatic for descent from a priestly lineage in this context.
  terminology: “Onyeisi nchụàjà” is a clearer established ecclesial rendering of ἀρχιερεύς than “nnukwu onye nchụàjà.” It preserves the singular title applied to Anas. “Agbụrụ ndịisi nchụàjà” conveys the high-priestly lineage without implying that all those named held the office.
  issues:
  - severity: medium
    issue: The phrase “ezinụlọ nnukwu onye nchụàjà” is overly singular and potentially possessive.
    rationale: 'It may be read as “the family of the high priest,” while Greek ἀρχιερατικοῦ is adjectival: a high-priestly family/lineage, not necessarily the household of a specified officeholder.'
  - severity: low
    issue: The title and Alexander’s name are less idiomatic in the draft.
    rationale: “Onyeisi nchụàjà” is the more natural Standard Igbo biblical title for “high priest,” and “Aleksanda” is the conventional spelling of Alexander.
  revised_text: ya na Anas, onyeisi nchụàjà, na Kaịfas, na Jọn, na Aleksanda, na ndị niile si n’agbụrụ ndịisi nchụàjà pụta,[a]
  revised_footnotes:
