id: ACT.4.11
reference: Acts 4:11
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οὗτός ἐστιν ὁ λίθος ὁ ἐξουθενηθεὶς ὑφ’ ὑμῶν τῶν ⸀οἰκοδόμων, ὁ γενόμενος εἰς κεφαλὴν γωνίας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/011.yaml
  text: This is the stone that was rejected by you[a], the builders, which has become the cornerstone.
translation:
  language: ig
  text: Onye a bụ nkume ahụ ndị na-ewu ụlọ, bụ unu, jụrụ, nke ghọrọla nkume isi nkuku.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “nkume kacha elu”; n'ụzọ nkịtị, “isi nkuku.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτός
  choice: Onye a
  rationale: Okwu ngosi a na-arụtụ aka kpọmkwem na Jizọs, bụ́ mmadụ a kpọtụrụ aha n'amaokwu bu ụzọ. “Onye a” na-egosipụta nrụsi aka ahụ n'Igbo n'ụzọ doro anya.
- source_word: λίθος
  choice: nkume
  rationale: “Nkume” bụ ihe okwu Grik a pụtara n'ụzọ nkịtị, ọ na-echekwakwa ihe atụ ụlọ na ntụaka ahụ e zoro aka na ya n'Abụ Ọma 118:22.
- source_word: ἐξουθενηθεὶς
  choice: jụrụ
  rationale: Okwu ahụ nwere echiche nke ileda ihe anya ma were ya dị ka ihe na-abaghị uru. N'ihe atụ nke ndị na-ewu ụlọ, “jụrụ” na-egosi ihe ndị na-ewu ụlọ mere nkume ahụ n'ụzọ dị mfe ma kwesị ntụkwasị obi.
- source_word: ὑφ’ ὑμῶν
  choice: unu
  rationale: “Unu” na-edobe ebubo ahụ e boro ndị a na-agwa okwu ozugbo, ma na-egosikwa nke ọma na nnọchiaha Grik ahụ bụ ọtụtụ.
- source_word: οἰκοδόμων
  choice: ndị na-ewu ụlọ
  rationale: Nsụgharị a na-edobe ihe atụ ụlọ ahụ ma kwe ka ndị na-agụ ya ghọta na ndị a na-agwa okwu bụ ndị e ji ndị na-ewu ụlọ tụnyere.
- source_word: γενόμενος
  choice: ghọọla
  rationale: 'Ụdị a na-egosi mgbanwe mecharala nke nsonaazụ ya ka dị ugbu a: nkume ahụ a jụrụ ajụ aghọọla nkume a na-asọpụrụ.'
- source_word: κεφαλὴν γωνίας
  choice: nkume isi nkuku ụlọ
  rationale: Nke a bụ okwu Igbo doro anya maka nkume dị mkpa n'akụkụ ụlọ, ma ọ na-edobe ihe atụ ahụ n'enweghị ịkọwa kpọmkwem ebe nkume ahụ dị karịa ihe okwu Grik kwuru.
theological_decisions:
- issue: Otu a ga-esi sụgharịa ihe atụ dị n'Abụ Ọma 118:22
  choice: nkume isi nkuku ụlọ
  alternative: nkume kachasị elu ụlọ; n'ụzọ nkịtị, isi nkuku
  rationale: Isiokwu a na-eme ka Jizọs bụrụ nkume ndị na-ewu ụlọ jụrụ ma Chineke buliri n'ọnọdụ nsọpụrụ. Ebe a ka na-arụrịta ụka ma okwu ahụ ọ na-ezo aka na nkume nkuku dị n'ala ụlọ ka ọ bụ nkume dị n'elu ụlọ, ya mere e debere isi okwu a na-ejikarị eme ihe n'amaokwu ahụ ma tinye ihe ọzọ ọ pụrụ ịpụta n'ala peeji.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe ma dị ùgwù mee ihe. Kọma ndị gbara “ndị na-ewu ụlọ” gburugburu na-egosi na okwu ahụ na-akọwa “unu.” E debere ihe atụ nke nkume na ndị na-ewu ụlọ, tinyere ebubo ahụ e boro “unu” ozugbo.
