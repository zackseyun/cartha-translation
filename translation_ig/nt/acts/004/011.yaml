revisions:
- from: Onye a bụ nkume ahụ unu, ndị na-ewu ụlọ, jụrụ, ma ọ ghọọla nkume isi nkuku ụlọ.[a]
  to: Onye a bụ nkume ahụ ndị na-ewu ụlọ, bụ unu, jụrụ, nke ghọrọla nkume isi nkuku.[a]
  rationale: The revision preserves the Greek’s emphatic identification, the direct plural accusation, and the apposition “you, the builders,” while using natural Standard Igbo syntax. It retains the disputed architectural imagery without resolving it beyond the source and keeps the alternative sense in a footnote.
  reviewer_model: gpt-5.6-terra
