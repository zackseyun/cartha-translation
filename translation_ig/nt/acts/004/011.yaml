    text: Ma ọ bụ, “nkume kacha elu”; n'ụzọ nkịtị, “isi nkuku.”
    reason: lexical_alternative
  revision_rationale: The revision preserves the Greek’s emphatic identification, the direct plural accusation, and the apposition “you, the builders,” while using natural Standard Igbo syntax. It retains the disputed architectural imagery without resolving it beyond the source and keeps the alternative sense in a footnote.
