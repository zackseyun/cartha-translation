review_pass:
  verdict: revise
  source_fidelity: The draft conveys the central stone/builders metaphor and the completed reversal. However, its word order makes the direct agent phrase (ὑφ’ ὑμῶν τῶν οἰκοδόμων, “by you, the builders”) less natural and potentially ambiguous in Igbo. The revised wording explicitly and idiomatically retains both the accusation and the apposition.
  naturalness: “Nkume ahụ unu, ndị na-ewu ụlọ, jụrụ” is awkward in Standard Igbo. Placing “ndị na-ewu ụlọ, bụ unu” before the verb gives a clear, fluent relative construction. “Nkume isi nkuku” is retained without adding “ụlọ,” which is not explicit in the Greek.
  terminology: “Onye a,” “nkume,” “ndị na-ewu ụlọ,” and “isi nkuku” are suitable Standard Igbo equivalents. The footnote is revised so that the alternative for “capstone” is expressed naturally and the literal alternative remains available.
  issues:
  - severity: medium
    issue: Awkward and potentially ambiguous placement of “unu, ndị na-ewu ụlọ”
    rationale: 'The Greek identifies the addressees as the builders: “rejected by you, the builders.” In the draft, “nkume ahụ unu, ndị na-ewu ụlọ, jụrụ” is grammatically strained and can momentarily obscure who performed the rejection.'
  - severity: low
    issue: “ụlọ” is added to the main rendering and the capstone alternative is awkward
    rationale: The source says “head of [the] corner,” not explicitly “of a house.” “Nkume kachasị elu ụlọ” is not a smooth Standard Igbo expression for the debated capstone sense.
  revised_text: Onye a bụ nkume ahụ ndị na-ewu ụlọ, bụ unu, jụrụ, nke ghọrọla nkume isi nkuku.[a]
  revised_footnotes:
