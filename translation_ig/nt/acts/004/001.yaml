id: ACT.4.1
reference: Acts 4:1
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Λαλούντων δὲ αὐτῶν πρὸς τὸν λαὸν ἐπέστησαν αὐτοῖς οἱ ⸀ἱερεῖς καὶ ὁ στρατηγὸς τοῦ ἱεροῦ καὶ οἱ Σαδδουκαῖοι,
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/001.yaml
  text: While they were speaking to the people[a], the priests and the captain of the temple and the Sadducees came upon them[b],
translation:
  language: ig
  text: Mgbe ha na-agwa ndị mmadụ okwu, ndị nchụàjà, onyeisi ndị nche ụlọ nsọ[b], na ndị Sadusii bịakwutere ha[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “bịara n'ebe ha nọ” ma ọ bụ “rutere ha nso.” Ngwaa Grik ahụ nwere ike ịpụta ọbịbịa mberede ma ọ bụ ịbịaru nso; ihe gbara ya gburugburu na-egosi na ndị nwere ọkwa bịara kwụsị ihe ha na-eme.
    reason: lexical_alternative
  - marker: b
    text: “Onyeisi ndị nche ụlọ nsọ” bụ onye ọrụ na-ahụ maka usoro na nchekwa n'ogige ụlọ nsọ.
    reason: cultural_note
lexical_decisions:
- source_word: Λαλούντων δὲ αὐτῶν
  choice: Mgbe ha na-agwa ... okwu
  rationale: A sụgharịrị genitive absolute ahụ dị ka nkebiokwu oge, nke na-ada nke ọma n'Igbo. A naghị atụgharị δέ iche n'ihi na njikọ oge na usoro akụkọ ahụ edochala ọrụ ya.
- source_word: πρὸς τὸν λαὸν
  choice: ndị mmadụ
  rationale: N'ebe a, λαός na-ezo aka n'ụmụ mmadụ gbakọtara n'ụlọ nsọ; “ndị mmadụ” bụ okwu doro anya ma ghara ịkọwa ya karịa ihe Grik kwuru.
- source_word: ἐπέστησαν αὐτοῖς
  choice: bịakwutere ha
  rationale: Nhọrọ a na-egosi na ndị ọchịchị ahụ bịarutere ha ma kwụsị ihe ha na-eme, ma ọ naghị etinye echiche ọgụ ma ọ bụ iro n'ime ngwaa ahụ n'onwe ya.
- source_word: οἱ ἱερεῖς
  choice: ndị nchụàjà
  rationale: Grik kwuru naanị “ndị nchụàjà,” ọ bụghị “ndị isi nchụàjà”; ya mere, e tinyeghị ọkwa na-adịghị na isiokwu mbụ.
- source_word: ὁ στρατηγὸς τοῦ ἱεροῦ
  choice: onyeisi ndị nche ụlọ nsọ
  rationale: στρατηγός bụ onyeisi na-ahụ maka nchekwa na usoro. Nsụgharị a na-eme ka ọrụ ahụ doo onye Igbo nke oge a anya, ebe nkọwa ala peeji na-enye ọdịnala metụtara ọkwa ahụ.
- source_word: οἱ Σαδδουκαῖοι
  choice: ndị Sadusii
  rationale: E jiri ụdị aha otu a nke a na-ahụkarị n'Igbo mee transliteration nke Σαδδουκαῖοι.
theological_decisions:
- issue: Ma ọbịbịa ndị isi ahụ kwesịrị igosi iro ozugbo
  choice: bịakwutere ha
  alternative: bịara buso ha agha; bịara jide ha
  rationale: Ihe ndị sochiri amaokwu a na-egosi mmegide, ma ngwaa dị n'amaokwu a na-ekwu isi ihe banyere ọbịbịa ha. Nsụgharị na-anọpụ iche na-echekwa mgbagwoju na esemokwu akụkọ ahụ n'etinyeghị iro karịrị ihe ngwaa ahụ kwuru.
translation_notes:
  register: 'E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Usoro ahịrịokwu ahụ bụ nke Igbo nkịtị: e buru ụzọ kpọọ ndị bịara, mesịa kwuo na ha bịakwutere ndịozi. E debere akara nkọwa [a] n''akụkụ ngwaa ọ na-akọwa, na [b] n''akụkụ aha ọkwa onye ọrụ ụlọ nsọ.'
