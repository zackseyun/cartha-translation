  yaml_path: translation/nt/acts/004/015.yaml
  text: But after ordering them to go outside the council[a], they began conferring with one another[b],
translation:
  language: ig
  text: Ma mgbe ha nyere ha iwu ka ha pụọ n’ihu kansụl ahụ[a], ha malitere ịkparịta ụka n’etiti onwe ha[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ka ha pụọ n’ihu Sanhedrin ahụ.” Okwu Grik bụ συνέδριον; ọ pụrụ izo aka na kansụl ndị Juu na-achị achị ma ọ bụ na nnọkọ ha.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ha nọ na-ekwurịta okwu n’etiti onwe ha,” ma ọ bụ, “ha nọ na-atụle ihe ọnụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κελεύσαντες
  choice: mgbe ha nyere ha iwu
  rationale: Aorist participle a na-egosi ihe mere tupu ngwaa bụ isi; ntụgharị a na-egosikwa ikike ndị nyere iwu ahụ n’asụsụ Igbo doro anya.
- source_word: δὲ
  choice: Ma
  rationale: Ọ na-egosi obere mgbanwe ma ọ bụ ọdịiche n’akụkọ ahụ, site n’okwu e kwuru n’ihu mmadụ gaa ná mkparịta ụka nzuzo.
- source_word: αὐτοὺς
  choice: ha
  rationale: Ọ na-ezo aka na Pita na Jọn; nnọchiaha nkịtị zuru oke n’ebe a.
- source_word: ἔξω τοῦ συνεδρίου
  choice: pụọ n’ihu ndị kansụl ahụ
  rationale: N’ọnọdụ a, okwu ahụ pụtara ka ha si n’ebe kansụl ahụ gbakọrọ, ma ọ bụ n’ihu ya, pụọ. Nke a bụ Igbo eke karịa ịsị na ha pụọ ‘n’èzí kansụl,’ nke nwere ike ịdị ka kansụl bụ ụlọ.
- source_word: ἀπελθεῖν
  choice: ka ha pụọ
  rationale: Ọ mezuru ihe κελεύσαντες chọrọ ma na-enye echiche ịhapụ ebe ahụ n’ụzọ eke.
- source_word: συνέβαλλον
  choice: ha malitere ịtụkọrịta uche
  rationale: Imperfect na-egosi omume na-aga n’ihu; n’ọnọdụ a, ngwaa ahụ pụtara ikwurịta ma tụlee okwu ọnụ. ‘Malitere ịtụkọrịta uche’ na-egosi mmalite mkparịta ụka ahụ.
- source_word: πρὸς ἀλλήλους
  choice: n’etiti onwe ha
  rationale: Ọ na-egosi na ndị kansụl ahụ na-akparịta okwu ahụ ọnụ n’ime ìgwè ha.
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. ‘Ndị kansụl ahụ’ na-eme ka o doo anya na συνέδριον bụ òtù ndị na-achị achị, ebe nkọwa ala peeji na-echekwa aha ‘Sanhedrin’ na nghọta ọzọ okwu Grik ahụ nwere.
