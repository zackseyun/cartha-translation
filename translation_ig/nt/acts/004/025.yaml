  to: 'Onye[a], site na Mmụọ Nsọ, site n’ọnụ nna anyị Devid, ohu gị, kwuru sị: “Gịnị mere mba dị iche iche ji were oké iwe, ndị mmadụ ji chepụta ihe efu[b]?”'
