id: ACT.4.25
reference: Acts 4:25
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ ⸂τοῦ πατρὸς ἡμῶν⸃ διὰ ⸂πνεύματος ἁγίου⸃ στόματος Δαυὶδ παιδός σου εἰπών· Ἱνατί ἐφρύαξαν ἔθνη καὶ λαοὶ ἐμελέτησαν κενά;
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/025.yaml
  text: 'who[a], through the Holy Spirit, by the mouth of David your servant, said: ‘Why did the nations rage[b], and the peoples devise vain things?’'
translation:
  language: ig
  text: 'Onye[a], site na Mmụọ Nsọ, site n’ọnụ nna anyị Devid, ohu gị, kwuru sị: “Gịnị mere mba dị iche iche ji were oké iwe, ndị mmadụ ji chepụta ihe efu[b]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ụfọdụ akwụkwọ aka ochie anaghị etinye okwu ahụ, “nna anyị.” N’agụmagụ ndị ahụ, mmalite ahụ ga-abụ: “Onye, site na Mmụọ Nsọ, site n’ọnụ Devid, ohu gị, kwuru sị.”'
    reason: textual_variant
  - marker: b
    text: Ma ọ bụ, “na-atụgharị uche banyere ihe efu.” Ngwaa Grik ahụ nwere ike ịpụta “ịtụgharị uche,” ma n’ọnọdụ a, ọ nwekwara ike igosi ịkpa ma ọ bụ ichepụta atụmatụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ⸂τοῦ πατρὸς ἡμῶν⸃
  choice: Onye
  rationale: Ọ na-ejikọta okwu a na Chineke a kpọrọ aha n’amaokwu 24. E debere okwu ederede ụfọdụ nwere, ‘nna anyị,’ n’ihe odide ala peeji kama ịmanye ya n’ahịrị bụ isi.
- source_word: διὰ πνεύματος ἁγίου
  choice: site na Mmụọ Nsọ
  rationale: Nke a na-egosi ụzọ ma ọ bụ onye e ji kwuo okwu ahụ, ma na-edokwa aha Mmụọ Nsọ anya.
- source_word: στόματος Δαυὶδ
  choice: site n’ọnụ Devid
  rationale: Ọ na-edobe akpaalaokwu Akwụkwọ Nsọ nke na-egosi na Chineke ji Devid kwuo okwu.
- source_word: παιδός σου
  choice: ohu gị
  rationale: N’ebe a παῖς na-ezo aka na Devid dịka onye na-ejere Chineke ozi; ‘ohu gị’ bụ okwu Igbo doro anya ma kwekọọ n’usoro Akwụkwọ Nsọ.
- source_word: Ἱνατί
  choice: Gịnị mere
  rationale: Ajụjụ a na-ajụ ihe kpatara omume ahụ; nke a bụ ụzọ Igbo dị ndụ si kwuo ya.
- source_word: ἐφρύαξαν
  choice: bilie n’ọnụma
  rationale: Ngwaa ahụ na-egosi mkpọtụ, iwe, na nnupụisi siri ike; nkebi a na-ebute ike ahụ n’Igbo nkịtị.
- source_word: ἔθνη
  choice: mba dị iche iche
  rationale: Ọ na-ezo aka n’ọtụtụ mba n’ozuzu, ọ bụghị naanị ndị mba ọzọ dịka otu okpukpe.
- source_word: λαοὶ
  choice: ndị dị iche iche
  rationale: E debere ọtụtụ nke okwu Grik ahụ na myirịta abụ ọma ahụ n’asụsụ Igbo sitere n’okike.
- source_word: ἐμελέτησαν
  choice: echepụta
  rationale: N’ọnọdụ mmegide a, okwu ahụ pụtara ịtụgharị uche wee kpaa ma ọ bụ chepụta atụmatụ; ‘echepụta’ na-edobe echiche ahụ, ebe ihe odide ala peeji na-egosi ụzọ ọzọ e nwere ike isi ghọta ya.
- source_word: κενά
  choice: ihe efu
  rationale: Ọ na-egosi ihe tọgbọ chakoo, na-abaghị uru, nke na-agaghị amị mkpụrụ.
theological_decisions:
- issue: Ụdị ederede nke okwu mmeghe tupu nhota ahụ
  choice: E tinyere ‘Onye’ n’ahịrị bụ isi, ma a hapụrụ ‘nna anyị’ n’ihe odide ala peeji.
  alternative: “Onye, site na Mmụọ Nsọ, kwuru okwu site n’ọnụ nna anyị Devid, ohu gị…”
  rationale: Okwu τοῦ πατρὸς ἡμῶν adịghị n’otu akaebe ederede niile, ọnọdụ ya n’ahịrị Grik sikwa ike. Nhọrọ a na-eme ka njikọ ya na Chineke n’amaokwu 24 doo anya n’emebighị ọdịiche ederede ahụ.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji usoro ‘site na Mmụọ Nsọ…site n’ọnụ Devid’ chekwaa ụzọ abụọ e si gosi ọrụ Mmụọ Nsọ na nke Devid. E debeghị ọdịiche ederede na nkọwa abụọ nke ἐμελέτησαν n’ụzọ zoro ezo; e gosiri ha n’ihe odide ala peeji.
