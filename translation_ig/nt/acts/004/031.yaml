id: ACT.4.31
reference: Acts 4:31
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ δεηθέντων αὐτῶν ἐσαλεύθη ὁ τόπος ἐν ᾧ ἦσαν συνηγμένοι, καὶ ἐπλήσθησαν ἅπαντες ⸂τοῦ ἁγίου πνεύματος⸃, καὶ ἐλάλουν τὸν λόγον τοῦ θεοῦ μετὰ παρρησίας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/031.yaml
  text: And when they had prayed[a], the place in which they were gathered was shaken[b], and they were all filled with the Holy Spirit and were speaking the word of God with boldness.
translation:
  language: ig
  text: Mgbe ha kpesịrị ekpere, ebe ha zukọrọ ọnụ[a] mara jijiji. Ha niile wee jupụta na Mmụọ Nsọ, ha nọkwa na-ekwu okwu Chineke n’atụghị egwu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ebe a kpọkọtara ha ọnụ.” Okwu Grik ahụ na-egosi na ha nọ n’ọnọdụ nke ndị zukọrọ ọnụ.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “site n’obi ike” ma ọ bụ “n’ezoghị ọnụ.” Okwu ahụ na-ekwu maka ikwu okwu n’ihu ọha n’enweghị egwu.
    reason: lexical_alternative
lexical_decisions:
- source_word: δεηθέντων αὐτῶν
  choice: Mgbe ha kpesịrị ekpere
  rationale: Nkebi a na-enye ihe mere tupu ihe ndị ọzọ emee. Nsụgharị a bụ Igbo ebumpụta ụwa ma na-egosikwa na ha buru ụzọ kpee ekpere.
- source_word: ἐσαλεύθη
  choice: mara jijiji
  rationale: Nke a na-egosi na ebe ahụ jijiji n’ụzọ a pụrụ ịhụ ma ọ bụ nwee mmetụta, ọ bụghị naanị na ihe gbanwere n’ụzọ ihe atụ.
- source_word: ὁ τόπος
  choice: ebe ahụ
  rationale: Ọ na-ezo aka kpọmkwem n’ebe ndị kwere ekwe nọ n’otu nzukọ.
- source_word: ἐν ᾧ ἦσαν συνηγμένοι
  choice: ha zukọrọ
  rationale: Ọ na-akọwa na ha nọ n’ebe ahụ dị ka otu ndị zukọrọ ọnụ. Ihe odide ala peeji na-edebe echiche ọzọ nke ịbụ ndị a kpọkọtara ọnụ.
- source_word: ἐπλήσθησαν
  choice: jupụta
  rationale: Nke a na-edebe okwu Luk ji akọ banyere mmadụ ịbụ onye Mmụọ Nsọ jupụtara, n’enweghị ịgbakwụnye nkọwa okpukpe pụrụ iche.
- source_word: ἅπαντες
  choice: ha niile
  rationale: Ọ na-ekwusi ike na ọ dịghị onye n’ime ndị ahụ fọdụrụ.
- source_word: τοῦ ἁγίου πνεύματος
  choice: na Mmụọ Nsọ
  rationale: N’Igbo, ‘jupụta na Mmụọ Nsọ’ na-egosipụta ihe nkebi Grik ahụ pụtara n’ụzọ doro anya ma kwesị ekwesị.
- source_word: ἐλάλουν
  choice: ha nọkwa na-ekwu
  rationale: Ụdị ngwaa Grik ahụ na-egosi omume na-aga n’ihu; ‘nọ na-ekwu’ na-edebe nghọta ahụ.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: okwu Chineke
  rationale: Nke a na-edebe akpaala okwu Akwụkwọ Nsọ maka ozi sitere n’aka Chineke nke ha na-ekwusa.
- source_word: μετὰ παρρησίας
  choice: na-eji nkwuwa okwu
  rationale: ‘Nkwuwa okwu’ na-egosi ikwu okwu n’ihu ọha n’atụghị egwu ma ghara izochi ihe, n’Igbo dị ugwu ma dị mfe nghọta.
theological_decisions:
- issue: Okwu banyere Mmụọ Nsọ ijupụta mmadụ
  choice: ha niile wee jupụta na Mmụọ Nsọ
  alternative: Mmụọ Nsọ wee jupụta ha niile
  rationale: Nhọrọ a na-agbaso usoro okwu Luk ma na-ekwupụta ike sitere n’aka Chineke n’enweghị ikpebi ma amaokwu a na-akụzi otu ahụmahụ okpukpe pụrụ iche dị iche n’ihe ndị ọzọ.
- issue: Ụdị omume dị na ἐλάλουν
  choice: ha nọkwa na-eji nkwuwa okwu ekwu
  alternative: ha wee jiri nkwuwa okwu kwuo
  rationale: Nhọrọ a na-egosipụta na ikwu okwu ahụ gara n’ihu, kama ime ka ọ bụrụ naanị otu omume mere n’otu ntabi anya.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta, dee ya. E debere usoro ihe omume ahụ, omume na-aga n’ihu nke ikwu okwu, na ike okwu παρρησία; e zere okwu ụka pụrụ iche ma ọ bụ nkọwa nke otu òtù okpukpe.
