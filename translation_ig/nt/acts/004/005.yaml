revisions:
- from: N’echi ya, ndị ọchịchị ha, ndị okenye, na ndị odeakwụkwọ zukọtara na Jerusalem.[a]
  to: O wee bụrụ n’echi ya na a kpọkọtara ndị ọchịchị ha, ndị okenye, na ndị odeakwụkwọ na Jerusalem.[a]
  rationale: The revision restores the event-introducing force of Ἐγένετο δὲ and uses a natural Igbo impersonal passive for συναχθῆναι. It retains the ambiguity of αὐτῶν as 'ha' and preserves the source's institutional terms and location.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T08:27:54Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the following-day setting, the three leadership groups, the relational pronoun αὐτῶν ('ha'), and Jerusalem. However, it omits the narrative event formula Ἐγένετο δὲ ('O wee bụrụ' / 'O mere'), and its active wording 'zukọtara' does not represent the passive συναχθῆναι as closely as Standard Igbo can.
  naturalness: The revised wording is natural, clear Standard Igbo with an appropriately formal narrative register. 'A kpọkọtara ... ọnụ' is an idiomatic impersonal passive construction and does not require supplying an agent.
  terminology: '''Ndị ọchịchị,'' ''ndị okenye,'' and ''ndị odeakwụkwọ'' suitably retain the institutional categories of ἄρχοντες, πρεσβύτεροι, and γραμματεῖς without importing a narrower interpretation. ''Jerusalem'' is retained as the established biblical place name.'
  issues:
  - severity: medium
    issue: The narrative formula Ἐγένετο δὲ is not represented.
    rationale: '''N’echi ya'' translates ἐπὶ τὴν αὔριον, but it does not convey that an event occurred. Adding ''O wee bụrụ ... na'' preserves the Greek narrative progression without unnatural literalism.'
  - severity: medium
    issue: The main text renders passive συναχθῆναι with active 'zukọtara.'
    rationale: Although an active collective verb is possible in Igbo, the source explicitly uses a passive infinitive. The impersonal passive 'a kpọkọtara ... ọnụ' naturally preserves this feature; the alternatives can remain in the footnote.
  revised_text: O wee bụrụ n’echi ya na a kpọkọtara ndị ọchịchị ha, ndị okenye, na ndị odeakwụkwọ na Jerusalem.[a]
  revised_footnotes:
