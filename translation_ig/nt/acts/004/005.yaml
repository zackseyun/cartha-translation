  text: Ἐγένετο δὲ ἐπὶ τὴν αὔριον συναχθῆναι αὐτῶν τοὺς ἄρχοντας καὶ ⸀τοὺς πρεσβυτέρους καὶ ⸁τοὺς γραμματεῖς ⸀ἐν Ἰερουσαλήμ
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/005.yaml
  text: And it happened that on the next day their rulers and elders and scribes were gathered together in Jerusalem,[a]
translation:
  language: ig
  text: O wee bụrụ n’echi ya na a kpọkọtara ndị ọchịchị ha, ndị okenye, na ndị odeakwụkwọ na Jerusalem.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “zukọtara” ma ọ bụ “bịakọtara ọnụ.” Ngwaa Grik dị n’ụdị nnara; “a kpọkọtara ha ọnụ” na-egosipụta ụdị ahụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: N’echi ya
  rationale: Usoro okwu a na-akwalite akụkọ gaa n’ihe mere n’echi ya. N’Igbo, ịghara ịtụgharị Ἐγένετο δὲ n’ụzọ mkpụrụokwu n’okwu na-eme ka ahịrịokwu bụrụ nke e ji eme ihe ugbu a ma ghara iwepụ ọrụ akụkọ ya.
- source_word: ἐπὶ τὴν αὔριον
  choice: N’echi ya
  rationale: Nke a bụ ụzọ Igbo nkịtị si ekwu ‘n’ụbọchị sochirinụ,’ ma na-ejikọta oge ahụ nke ọma na ihe ndị bu ya ụzọ.
- source_word: συναχθῆναι
  choice: zukọtara
  rationale: ‘Zukọtara’ na-enye echiche nke ndị bịakọtara n’otu ebe. Ọ bụ ezie na ngwaa Grik dị n’ụdị nnara, Igbo na-ekwukarị ihe a n’ụdị ọrụ; ihe odide ala peeji na-echekwa ọdịiche ahụ.
- source_word: αὐτῶν
  choice: ha
  rationale: ‘Ha’ na-echekwa nnọchiaha njikọ dị na Grik n’akọwaghị kpọmkwem ndị ọ na-arụtụ aka karịa ka amaokwu ahụ kwuru.
- source_word: τοὺς ἄρχοντας
  choice: ndị ọchịchị
  rationale: N’ebe a, okwu ahụ na-ezo aka ná ndị nwere ikike ọchịchị n’etiti ndị Juu; ‘ndị ọchịchị’ bụ okwu doro anya ma saa mbara nke ọma.
- source_word: τοὺς πρεσβυτέρους
  choice: ndị okenye
  rationale: N’ọnọdụ a, ọ bụ ndị ndu obodo a na-akwanyere ùgwù, ọ bụghị nanị ndị merela agadi.
- source_word: τοὺς γραμματεῖς
  choice: ndị odeakwụkwọ
  rationale: Nhọrọ a na-edobe aha òtù ndị ọkachamara n’iwu na Akwụkwọ Nsọ kama ịgbasa ya ozugbo ka ọ bụrụ nkọwa ọrụ ha.
- source_word: ἐν Ἰερουσαλήμ
  choice: na Jerusalem
  rationale: Nke a bụ ntụgharị ebe dị mfe ma bụrụkwa nke e ji eme ihe n’Igbo.
theological_decisions:
- issue: Ihe αὐτῶν na-arụtụ aka na ya n’ahịrịokwu banyere ndị isi zukọtara
  choice: E debere ya dịka ‘ha.’
  alternative: Ịhapụ nnọchiaha ahụ, ma ọ bụ ịkọwa ya kpọmkwem dịka ‘ndị ọchịchị ndị Juu.’
  rationale: Grik nwere nnọchiaha ahụ, ma amaokwu a n’onwe ya akọwaghị kpọmkwem ndị ọ na-arụtụ aka na ha. ‘Ha’ na-echekwa njikọ ahụ n’etinyeghị nkọwa karịrị ihe ederede kwuru.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ usoro okwu sitere n’okike Igbo kama ịgbaso nhazi Grik n’ụzọ siri ike; e chekwara ụdị nnara nke συναχθῆναι n’ihe odide ala peeji.
