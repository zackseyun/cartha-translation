id: ACT.4.28
reference: Acts 4:28
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ποιῆσαι ὅσα ἡ χείρ σου καὶ ἡ ⸀βουλὴ προώρισεν γενέσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/028.yaml
  text: to do whatever your hand and your purpose had predestined to happen[a].
translation:
  language: ig
  text: ime ihe niile aka gị na nzube gị buru ụzọ kpebie ka ha mee[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “kara aka,” ma ọ bụ “kpebiri tupu oge eruo.” Okwu Grik ahụ na-egosi mkpebi e mere tupu oge eruo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιῆσαι
  choice: ime
  rationale: Ọ bụ infinitiv aorist nke na-aga n’ihu n’ahịrịokwu sitere n’amaokwu bu ụzọ; “ime” na-edobe okwu ahụ n’ụzọ kwụ ọtọ ma dị mfe.
- source_word: ὅσα
  choice: ihe niile
  rationale: Nnọchiaha a na-egosi ihe niile so n’ókè okwu ahụ; “ihe niile” bụ Igbo doro anya nke na-egosipụta obosara ya.
- source_word: χείρ
  choice: aka
  rationale: A sụgharịrị ya dịka “aka” iji chekwaa ihe atụ Baịbụl nke na-anọchi anya ike na ọrụ Chineke, kama ịkọwa ya ozugbo dịka “ike.”
- source_word: βουλή
  choice: nzube
  rationale: “Nzube” na-egosi ebumnuche e chepụtara nke ọma, ma dịkwa mfe nghọta karịa okwu ndị nwere ike ịdị ka asụsụ nka.
- source_word: προώρισεν
  choice: kpebiri tupu oge eruo
  rationale: Nkebiokwu a na-egosipụta mkpebi e mere tupu ihe ahụ emee, na-enweghị ibubata okwu nkà mmụta okpukpe nke nwere ike ime ka otu nkọwa ụka karịa ndị ọzọ pụta ìhè.
- source_word: γενέσθαι
  choice: na ha ga-eme
  rationale: N’ebe a γίνομαι na-ekwu banyere ihe ndị ga-emezu ma ọ bụ ga-ewere ọnọdụ; ntụgharị a bụ Igbo eke ma na-ejikọta ya nke ọma na “ihe niile.”
theological_decisions:
- issue: Otú e si sụgharịa προώρισεν n’ebe ọchịchị Chineke na ibu ọrụ mmadụ na-emetụta
  choice: kpebiri tupu oge eruo
  alternative: kara aka; buru ụzọ kpebie
  rationale: Okwu Grik ahụ na-egosi mkpebi siri ike e mere tupu oge eruo. “Kpebiri tupu oge eruo” na-edobe ike na usoro oge nke okwu ahụ, ma ọ naghị edozi esemokwu nkà mmụta okpukpe nke amaokwu ahụ n’aha otu ọdịnala ụka.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke oge a, dị ùgwù ma dị mfe nghọta. E debere “aka” dịka ihe atụ Baịbụl, ebe “nzube” na “kpebiri tupu oge eruo” na-ezere okwu pụrụ iche nke otu ụka ma na-echekwa ike nke isi mmalite Grik.
