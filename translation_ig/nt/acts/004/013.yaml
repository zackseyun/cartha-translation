id: ACT.4.13
reference: Acts 4:13
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Θεωροῦντες δὲ τὴν τοῦ Πέτρου παρρησίαν καὶ Ἰωάννου καὶ καταλαβόμενοι ὅτι ἄνθρωποι ἀγράμματοί εἰσιν καὶ ἰδιῶται, ἐθαύμαζον, ἐπεγίνωσκόν τε αὐτοὺς ὅτι σὺν τῷ Ἰησοῦ ἦσαν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/013.yaml
  text: As they observed the boldness of Peter and John[a], and realized that they were uneducated and ordinary men, they were astonished, and they recognized that they had been with Jesus.
translation:
  language: ig
  text: Mgbe ha hụrụ obi ike Pita na Jọn n’ikwu okwu, ma ghọta na ha bụ ndị na-enweghị ọzụzụ n’akwụkwọ na ndị nkịtị[a], o juru ha anya; ha wee mata na ha na Jizọs nọbu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịtụgharị ya, “ndị a na-amụghị akwụkwọ na ndị nkịtị,” ma ọ bụ, “ndị na-enweghị ọzụzụ pụrụ iche na ndị na-abụghị ndị ọkachamara.” Okwu Grik ndị a na-ekwu maka ndị na-enweghị ọzụzụ agụmakwụkwọ nke ndị ọkà mmụta na ndị na-enweghị ọkwa ọrụ pụrụ iche; ọ pụtaghị n’ụzọ dị mkpa na ha amaghị ịgụ ma ọ bụ ide.
    reason: lexical_alternative
lexical_decisions:
- source_word: Θεωροῦντες
  choice: Mgbe ha hụrụ
  rationale: Nke a na-egosi na ndị isi ahụ lere ihe ha na-eme anya nke ọma wee si na ya ruo ná nkwubi okwu; ‘Mgbe ha hụrụ’ dị mfe ma bụrụ Igbo e ji eme ihe ugbu a.
- source_word: παρρησίαν
  choice: na-ekwu okwu n’atụghị egwu
  rationale: N’Ọrụ Ndịozi, okwu a na-ezo aka n’ikwu okwu n’ihu ọha n’atụghị egwu ma n’ezoghị ọnụ. Nkebiokwu a na-egosipụta ma obi ike ma nkwuwa okwu ahụ.
- source_word: καταλαβόμενοι
  choice: ma ghọta
  rationale: Ọ na-egosi na ha bịara ghọta ọnọdụ Pita na Jọn, ọ bụghị nanị na ha hụrụ ya anya.
- source_word: ἀγράμματοί
  choice: ndị na-agụghị akwụkwọ
  rationale: N’ebe a, okwu ahụ na-ezo karịsịa n’ịghara inwe ọzụzụ iwu na akwụkwọ okpukpe nke ndị odeakwụkwọ, ọ bụghị na ha amaghị ịgụ ma ọ bụ ide; ihe odide ala peeji na-akọwa nke a.
- source_word: ἰδιῶται
  choice: ndị nkịtị
  rationale: Nke a na-egosi ndị na-enweghị ọkwa ma ọ bụ ọzụzụ ọrụ pụrụ iche n’etiti ndị ọkachamara n’okpukpe, n’ebughị echiche na ha enweghị ọgụgụ isi.
- source_word: ἐθαύμαζον
  choice: o juru ha anya
  rationale: Nke a bụ ụzọ Igbo doro anya ma bụrụkwa nke e ji eme ihe maka mmeghachi omume nke ịtụnanya siri ike.
- source_word: ἐπεγίνωσκόν
  choice: ha wee mata
  rationale: Ngwaa a na-egosi ịmata ma ọ bụ ịchọpụta onye ma ọ bụ njikọ mmadụ nwere; ‘mata’ na-ekwupụta nke ahụ nke ọma.
- source_word: σὺν τῷ Ἰησοῦ ἦσαν
  choice: ha na Jizọs nọbu
  rationale: ‘Nọbu’ na-egosi na mkpakọrịta ha na Jizọs mere tupu oge ndị isi ahụ ji amata ya.
theological_decisions:
- issue: Otú e si kọwaa ọnọdụ Pita na Jọn n’ọha mmadụ
  choice: ndị na-agụghị akwụkwọ na ndị nkịtị
  alternative: ndị na-enweghị ọzụzụ akwụkwọ pụrụ iche na ndị na-abụghị ndị ọkachamara
  rationale: Okwu Grik ahụ na-egosi otú Sanhedrin si hụ ha dịka ndị na-enwetaghị ọzụzụ ndị odeakwụkwọ na ndị na-enweghị ọkwa ọrụ okpukpe. Nsụgharị a na-edebe ọdịiche ahụ ma ghara ịkpọ ha ndị nzuzu ma ọ bụ ndị na-enweghị ọgụgụ isi.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta, dee ya. A gbanwere aha-noun παρρησία ka ọ bụrụ nkebiokwu omume ‘na-ekwu okwu n’atụghị egwu’ iji mee ka Igbo daa nke ọma ma debe echiche nke nkwuwa okwu n’ihu ọha. Semicolon na-ekewa ihe ndị isi ahụ chọpụtara na mmeghachi omume ha.
