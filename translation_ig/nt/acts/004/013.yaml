revisions:
- from: Mgbe ha hụrụ na Pita na Jọn na-ekwu okwu n’atụghị egwu, ma ghọta na ha bụ ndị na-agụghị akwụkwọ na ndị nkịtị[a], o juru ha anya; ha wee mata na ha na Jizọs nọbu.
  to: Mgbe ha hụrụ obi ike Pita na Jọn n’ikwu okwu, ma ghọta na ha bụ ndị na-enweghị ọzụzụ n’akwụkwọ na ndị nkịtị[a], o juru ha anya; ha wee mata na ha na Jizọs nọbu.
  rationale: The revision directly renders the observed παρρησία as Peter’s and John’s courage in speaking, preserves the realization expressed by καταλαβόμενοι, and avoids equating ἀγράμματοι with literal illiteracy. It retains the source’s restrained description of their lack of formal training and official status, as well as the retrospective sense of their having been with Jesus.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T08:28:02Z'
review_pass:
  verdict: revise
  source_fidelity: The draft preserves the verse’s sequence of observation, realization, astonishment, and recognition. However, “hụrụ na Pita na Jọn na-ekwu okwu n’atụghị egwu” renders the object as an ongoing act of speaking rather than directly rendering τὴν ... παρρησίαν, their boldness/frankness in speaking. A direct Igbo nominal expression is more faithful.
  naturalness: The proposed revision uses idiomatic Standard Igbo. “Obi ike ... n’ikwu okwu” naturally expresses courageous openness in speech, and “ndị na-enweghị ọzụzụ n’akwụkwọ” avoids the unnecessarily strong implication that Peter and John could not read or write.
  terminology: Pita, Jọn, and Jizọs are appropriate Standard Igbo biblical names. “Ndị nkịtị” suitably conveys ἰδιῶται in contrast to educated or official religious specialists. The footnote retains the needed qualification concerning formal scholarly training and nonprofessional status.
  issues:
  - severity: medium
    issue: The rendering of παρρησίαν is indirect and shifts the grammatical focus.
    rationale: “Hụrụ na ... na-ekwu okwu n’atụghị egwu” means that they saw Peter and John speaking fearlessly. The Greek says they observed Peter’s and John’s boldness/frankness. “Obi ike Pita na Jọn n’ikwu okwu” retains the source focus while remaining natural.
  - severity: medium
    issue: “Ndị na-agụghị akwụkwọ” may be read as strictly illiterate.
    rationale: Although the footnote qualifies it, ἀγράμματοι in this setting principally concerns lack of formal scholarly or scribal/rabbinic training. “Ndị na-enweghị ọzụzụ n’akwụkwọ” better avoids a misleading claim while preserving the social and educational contrast.
  - severity: low
    issue: The footnote’s wording is somewhat awkward and can state the lexical nuance more clearly.
    rationale: The revised footnote distinguishes formal scholarly training from literacy and explains the nonofficial/nonprofessional sense of ἰδιῶται without adding interpretive doctrine.
  revised_text: Mgbe ha hụrụ obi ike Pita na Jọn n’ikwu okwu, ma ghọta na ha bụ ndị na-enweghị ọzụzụ n’akwụkwọ na ndị nkịtị[a], o juru ha anya; ha wee mata na ha na Jizọs nọbu.
