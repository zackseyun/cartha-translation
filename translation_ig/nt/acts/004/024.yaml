id: ACT.4.24
reference: Acts 4:24
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οἱ δὲ ἀκούσαντες ὁμοθυμαδὸν ἦραν φωνὴν πρὸς τὸν θεὸν καὶ εἶπαν· Δέσποτα, ⸀σὺ ὁ ποιήσας τὸν οὐρανὸν καὶ τὴν γῆν καὶ τὴν θάλασσαν καὶ πάντα τὰ ἐν αὐτοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/024.yaml
  text: When they heard this[a], they lifted their voices together to God and said, “Master, you are the one who made heaven and earth and sea[b], and everything in them,”
translation:
  language: ig
  text: Mgbe ha nụrụ nke a, ha ji otu obi[a] welie olu ha nye Chineke, sị, “Nna Ukwu[b], ọ bụ gị kere eluigwe na ụwa na oké osimiri, na ihe niile dị n’ime ha,”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “n’otu uche.”
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsị, “Onye Ọchịchị Kasị Elu.” Okwu Grik bụ Δέσποτα, aha e ji akpọ onye nwere ikike zuru oke; ọ dị iche na κύριος, nke a na-asụgharịkarị “Onyenwe anyị” mgbe a na-agwa Chineke okwu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσαντες
  choice: Mgbe ha nụrụ nke a
  rationale: Aorist participle has temporal force here. “Nke a” makes explicit in natural Igbo what they had just heard from Peter and John.
- source_word: ὁμοθυμαδόν
  choice: ji otu obi
  rationale: This natural Igbo expression conveys their united disposition and action without suggesting a formal vote or mere simultaneous speech.
- source_word: ἦραν φωνήν
  choice: welie olu ha
  rationale: Retains the source image of raising the voice while using the ordinary Igbo way of referring to a group’s voices in united prayer.
- source_word: πρὸς τὸν θεόν
  choice: kpọkuo Chineke
  rationale: In this prayer context, the phrase indicates speech directed to God. “Kpọkuo Chineke” expresses that function naturally rather than spatially rendering πρός.
- source_word: Δέσποτα
  choice: Nna Ukwu
  rationale: An established Igbo title for a master or one in supreme authority; it avoids simply equating δεσπότης with κύριος, commonly rendered “Onyenwe anyị.”
- source_word: σὺ ὁ ποιήσας
  choice: ọ bụ gị kere
  rationale: 'The cleft construction naturally preserves the emphatic identification: God is the one who made all that follows.'
- source_word: τὸν οὐρανὸν καὶ τὴν γῆν καὶ τὴν θάλασσαν
  choice: eluigwe na ụwa na oké osimiri
  rationale: Uses the familiar, dignified Igbo creation formula while preserving all three coordinated realms.
- source_word: πάντα τὰ ἐν αὐτοῖς
  choice: ihe niile dị n’ime ha
  rationale: A direct and natural comprehensive expression for everything contained in the three created realms.
theological_decisions:
- issue: Rendering Δέσποτα as a divine title
  choice: Nna Ukwu
  alternative: Onye Ọchịchị Kasị Elu; Onyenwe anyị
  rationale: “Nna Ukwu” communicates a master’s supreme authority and preserves a meaningful distinction from κύριος. “Onye Ọchịchị Kasị Elu” emphasizes sovereignty more interpretively, while “Onyenwe anyị” risks collapsing the two Greek titles.
translation_notes:
  register: Standard Igbo in a natural, dignified oral register suitable for public Scripture reading. The wording keeps the corporate unity of the prayer, preserves the creation formula, and avoids denominational terminology.
