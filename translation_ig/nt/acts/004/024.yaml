- from: Mgbe ha nụrụ nke a, ha ji otu obi[a] welie olu ha kpọkuo Chineke, sị, “Nna Ukwu[b], ọ bụ gị kere eluigwe na ụwa na oké osimiri, na ihe niile dị n’ime ha,”
  to: Mgbe ha nụrụ nke a, ha ji otu obi[a] welie olu ha nye Chineke, sị, “Nna Ukwu[b], ọ bụ gị kere eluigwe na ụwa na oké osimiri, na ihe niile dị n’ime ha,”
  rationale: The revision removes the added invocation nuance in “kpọkuo Chineke” and renders the direction of the collective address directly as “nye Chineke.” It also makes the lexical explanation of Δέσποτα and κύριος more precise. No disputed textual or theological matter is introduced.
