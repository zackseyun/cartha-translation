  text: For we are not able not to speak about what we have seen and heard[a].
translation:
  language: ig
  text: N’ihi na anyị enweghị ike ịghara ikwu banyere ihe anyị hụrụ ma nụ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ, n’ụzọ Igbo si ekwu ya n’ụzọ dị mfe: “N’ihi na anyị enweghị ike ịgbachi nkịtị banyere ihe anyị hụrụ ma nụ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ δυνάμεθα
  choice: anyị enweghị ike
  rationale: Nke a na-egosipụta enweghị ike ime ihe, ọ bụghị naanị enweghị ọchịchọ ime ya.
- source_word: γὰρ
  choice: N’ihi na
  rationale: Ọ na-ejikọta amaokwu a na okwu bu ya ụzọ dịka ihe kpatara ya.
- source_word: ἡμεῖς
  choice: anyị
  rationale: Nnochiaha ahụ e dere n’asụsụ Grik na-eme ka ndị na-ekwu okwu pụta ìhè; “anyị” na-enye nghọta ahụ n’Igbo n’enweghị ime ka nkwusi okwu ahụ gafee ókè.
- source_word: ἃ
  choice: ihe ndị
  rationale: Nke a na-anọchi anya ọtụtụ ihe bụ ọdịnaya nke ihe ndịozi jiri anya ha hụ ma jiri ntị ha nụ.
- source_word: εἴδαμεν καὶ ἠκούσαμεν
  choice: anyị hụrụ ma nụ
  rationale: Oge gara aga dị mfe bụ ụzọ ebumpụta ụwa n’Igbo isi kọwaa akaebe nke ihe ha jiri anya hụ na nke ha jiri ntị nụ.
- source_word: μὴ λαλεῖν
  choice: ịghara ikwu banyere
  rationale: Nke a na-echekwa usoro echiche Grik nke na-ekwu na ha enweghị ike ịghara ikwu; “banyere” na-eme ka o doo anya na ihe ha hụrụ ma nụ bụ isiokwu okwu ha.
theological_decisions:
- issue: Okwu ndịozi a ọ̀ na-egosi enweghị ike ịgbachi nkịtị ka ọ̀ bụ naanị mkpebi siri ike?
  choice: E debere ya dịka enweghị ike ịghara ikwu.
  alternative: A pụrụ ịsụgharị ya dịka mkpebi siri ike, dịka “anyị agaghị akwụsị ikwu.”
  rationale: Usoro οὐ δυνάμεθα ... μὴ λαλεῖν na-egosipụta kpọmkwem na ha enweghị ike ịghara ikwu. Nsụgharị a anaghị eme ka ọ bụrụ naanị enweghị ọchịchọ ma ọ bụ mkpebi.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. A hapụrụ usoro “enweghị ike ịghara” n’isi amaokwu iji chekwaa nrụgide na mgbagwoju okwu dị n’asụsụ Grik; ihe odide ala ala peeji nyere ụzọ e si ekwu ya n’ụzọ Igbo na-aga were were.
