source:
  edition: SBLGNT
  text: καὶ στήσαντες αὐτοὺς ἐν ⸀τῷ μέσῳ ἐπυνθάνοντο· Ἐν ποίᾳ δυνάμει ἢ ἐν ποίῳ ὀνόματι ἐποιήσατε τοῦτο ὑμεῖς;
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/007.yaml
  text: And after setting them in the midst[a], they began asking, “By what power or in what name did you do this?”
translation:
  language: ig
  text: Mgbe ha mechara mee ka ha guzo n’etiti ha, ha malitere ịjụ ha, sị, “Ọ bụ n’ike dị aṅaa, ma ọ bụ n’aha dị aṅaa, ka unu ji mee nke a?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ha nọ na-ajụ ha” ma ọ bụ “ha jụrụ ha ajụjụ.” Oge imperfect n’asụsụ Grik nwere ike imesi ajụjụ na-aga n’ihu ike kama igosi mmalite ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: στήσαντες
  choice: Mgbe ha mesịrị ka ha guzo
  rationale: Nkebi okwu a dị n’aorist participle ma na-egosi ihe mere tupu ajụjụ ahụ; nsụgharị a na-egosi usoro oge ahụ n’Igbo eke.
- source_word: ἐν τῷ μέσῳ
  choice: n’etiti ha
  rationale: Nke a na-edebe echiche nkịtị nke ịbụ n’etiti ndị nzukọ ahụ, n’emeghị ka ọ bụrụ naanị ‘n’ihu ha.’
- source_word: ἐπυνθάνοντο
  choice: ha malitere ịjụ ha
  rationale: Imperfect ahụ nwere ike igosi mmalite ma ọ bụ omume na-aga n’ihu; isi ederede na-ahọrọ echiche mmalite, ebe nkọwa ala peeji na-echekwa nhọrọ nke ọzọ.
- source_word: Ἐν ποίᾳ δυνάμει
  choice: Ọ bụ n’ike dị aṅaa
  rationale: ‘Ike’ bụ ihe kwekọrọ kpọmkwem na δύναμις, ma ọ naghị agbanwe ya ka ọ bụrụ ‘ikike’ ma ọ bụ ‘ọchịchị.’
- source_word: ἢ ἐν ποίῳ ὀνόματι
  choice: ma ọ bụ n’aha dị aṅaa
  rationale: Nke a na-echekwa akpaalaokwu Akwụkwọ Nsọ nke ime ihe ‘n’aha’ mmadụ, nke nwere echiche nnọchite anya na ikike.
- source_word: ἐποιήσατε τοῦτο
  choice: ka unu ji mee nke a
  rationale: Ọ na-enye aorist dị ka omume gara aga ma na-ahapụ ‘nke a’ ka ọ rụtụ aka n’ọgwụgwọ ahụ na-enweghị ịgbakwunye nkọwa.
- source_word: ὑμεῖς
  choice: unu
  rationale: ‘Unu’ na-egosi plural na onye a na-ajụ kpọmkwem; ọnọdụ ajụjụ ahụ na-eburu nrụgide dị na nnọchiaha Grik ahụ.
theological_decisions:
- issue: Ma a ga-asụgharị δύναμις dịka ‘ike’ ka a ga-akọwa ya dịka ‘ikike’
  choice: ike
  alternative: ikike
  rationale: δύναμις pụtara ‘ike’ n’ụzọ bụ isi, ebe okwu jikọrọ ya, ‘n’aha dị aṅaa,’ eburuola echiche ikike nnọchite anya. Nke a na-echekwa ọdịiche dị n’etiti ike na aha.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. ‘N’etiti ha’ na-echekwa ọnọdụ nyocha ahụ; ‘n’ike’ na ‘n’aha’ na-edebe usoro na ọdịiche nke okwu Grik.
