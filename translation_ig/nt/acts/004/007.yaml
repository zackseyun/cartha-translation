  to: Mgbe ha mechara mee ka ha guzo n’etiti ha, ha malitere ịjụ ha, sị, “Ọ bụ n’ike dị aṅaa, ma ọ bụ n’aha dị aṅaa, ka unu ji mee nke a?”[a]
  rationale: The revision corrects only the unclear rendering of στήσαντες. The causative construction “mee ka ha guzo” conveys that the officials made the two men stand, and “Mgbe ha mechara” marks this as preceding the questioning. The remaining wording faithfully preserves the Greek question’s power/name distinction, plural address, and unspecified “this.”
