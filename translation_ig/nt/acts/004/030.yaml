  text: ἐν τῷ τὴν χεῖρά ⸀σου ἐκτείνειν σε εἰς ἴασιν καὶ σημεῖα καὶ τέρατα γίνεσθαι διὰ τοῦ ὀνόματος τοῦ ἁγίου παιδός σου Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/030.yaml
  text: while you stretch out your hand for healing[a], and signs and wonders are done through the name of your holy servant Jesus.
translation:
  language: ig
  text: mgbe ị na-esetị aka gị maka ọgwụgwọ, a na-emekwa ihe ịrịba ama na ihe ebube site n’aha Jizọs, ohu gị dị nsọ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “Jizọs, nwa gị dị nsọ.” Okwu Grik bụ *pais* nwere ike ịpụta “nwa” ma ọ bụ “ohu.” N’ebe a, a họọrọ “ohu” n’ihi njikọ okwu a nwere na Ohu e kwuru okwu ya n’Aịzaya.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν τῷ ... ἐκτείνειν
  choice: mgbe ị na-esetị
  rationale: Ọ na-egosi ihe na-eme n’otu oge; “mgbe ị na-” bụ usoro Igbo doro anya ma dịkwa mma n’ekpere a.
- source_word: τὴν χεῖρά σου
  choice: aka gị
  rationale: Nke a na-edobe okwu ihe atụ nke Akwụkwọ Nsọ gbasara ike Chineke na ọrụ ya n’etinyeghị nkọwa ọzọ.
- source_word: εἰς ἴασιν
  choice: iji gwọọ ndị ọrịa
  rationale: Ọ na-egosi nzube nke ịsetị aka ahụ. N’Igbo nkịtị, ikwu ndị a na-agwọ na-eme ka echiche ọgwụgwọ doo anya, n’agbanyeghị na a hapụrụ ndị ọrịa n’ime okwu Grik ka a ghọta ha n’onwe ha.
- source_word: σημεῖα καὶ τέρατα
  choice: ihe ịrịba ama na ihe ebube
  rationale: Nke a bụ ụzọ Igbo doro anya isi debe okwu abụọ ahụ na njikọ ha a na-ahụkarị n’Ọrụ Ndịozi.
- source_word: γίνεσθαι
  choice: a na-emekwa
  rationale: Ọ na-egosi na ihe ịrịba ama na ihe ebube na-abịa na mmezu, ma kwekọọ n’usoro ekpere Igbo.
- source_word: διὰ τοῦ ὀνόματος
  choice: site n’aha
  rationale: “Site n’aha” na-edobe echiche Grik banyere ụzọ ma ọ bụ onye e ji mee ihe, n’akọwaghị “aha” naanị dị ka ikike.
- source_word: τοῦ ἁγίου παιδός σου Ἰησοῦ
  choice: Jizọs, ohu gị dị nsọ
  rationale: παῖς nwere ike ịpụta nwa ma ọ bụ ohu/onye na-eje ozi. “Ohu” na-edobe njikọ a na Ohu ahụ dị n’Aịzaya; e debere nhọrọ “nwa” n’ala ala peeji.
theological_decisions:
- issue: Otú e si sụgharịa παῖς mgbe ọ na-ekwu banyere Jizọs
  choice: ohu gị dị nsọ
  alternative: nwa gị dị nsọ
  rationale: Ọ bụ ezie na okwu ahụ nwere nghọta abụọ, otú e si jiri ya mee ihe n’Ọrụ Ndịozi 3:13, 3:26 na ebe a na-egosi njikọ ya na Ohu ahụ dị n’Aịzaya. Ihe odide ala ala peeji na-echekwa nghọta ọzọ kama ikpochapụ mgbagwoju anya dị n’okwu Grik.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta. E ji “Jizọs, ohu gị dị nsọ” mee ka njikọ nkebiokwu ahụ doo anya ma zere usoro okwu siri ike; a hapụrụ okwu ọdịnala “ihe ịrịba ama na ihe ebube” n’ihi mkpa ha n’Ọrụ Ndịozi.
