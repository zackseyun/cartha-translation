  text: καὶ ἐπέβαλον αὐτοῖς τὰς χεῖρας καὶ ἔθεντο εἰς τήρησιν εἰς τὴν αὔριον, ἦν γὰρ ἑσπέρα ἤδη.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/003.yaml
  text: And they laid hands on them and put them in custody until the next day[b][a], for it was already evening.
translation:
  language: ig
  text: Ha wee jide ha[a], tinye ha n’ụlọ nche[b] ruo n’echi ya, n’ihi na mgbede eruolarị.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’ụzọ nkịtị, ‘tukwasị ha aka.’ N’ebe a, akpaalaokwu Grik ahụ pụtara ijide ha n’ike.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsị, ‘dobe ha n’okpuru nche’ ma ọ bụ ‘tinye ha n’ụlọ mkpọrọ.’ Okwu Grik ahụ na-ekwu na e debere ha n’okpuru nche, ma ọ naghị akọwa kpọmkwem ụdị ebe ahụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέβαλον ... τὰς χεῖρας
  choice: jide ha
  rationale: Nkebi okwu Grik a pụtara n'ụzọ nkịtị ‘tukwasị ha aka,’ ma n’ọnọdụ mmegide na iwu ebe a ọ pụtara ijide mmadụ n’ike. ‘Jide ha’ bụ Igbo doro anya ma dịkwa mma n’akụkọ a; ihe e dere n’ala peeji na-echekwa akpaalaokwu ahụ.
- source_word: αὐτοῖς
  choice: ha
  rationale: Nnọchiaha a na-ezo aka na Pita na Jọn; ‘ha’ bụ ntụgharị Igbo kwesịrị ekwesị.
- source_word: ἔθεντο εἰς τήρησιν
  choice: tinye ha n’ụlọ nche
  rationale: τήρησις na-egosi idebe mmadụ n’okpuru nche. ‘Ụlọ nche’ na-egosi njide gọọmenti n’ebughị ụzọ kwuo kpọmkwem na ọ bụ ụlọ mkpọrọ.
- source_word: εἰς τὴν αὔριον
  choice: ruo n’echi ya
  rationale: Nke a na-egosi oge ha ga-anọ n’okpuru nche; ‘ruo n’echi ya’ bụ Igbo akụkọ dị mfe ma kwekọọ n’echiche Grik.
- source_word: ἦν γὰρ ἑσπέρα ἤδη
  choice: n’ihi na chi ejirilarị
  rationale: Nkebi a na-akọwa ihe mere e ji yigharị okwu ahụ. ‘Chi ejirilarị’ bụ ụzọ Igbo si ekwu n’ụzọ ebumpụta ụwa na mgbede eruola.
theological_decisions: []
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. A họọrọ ‘jide ha’ kama ntụgharị nkịtị nke akpaalaokwu Grik n’ihi na ọ bụ ya na-ada nke ọma n’Igbo; a kọwara ọdịdị nkịtị ya n’ala peeji. E zere ịkọwa τήρησις kpọmkwem dịka ụlọ mkpọrọ, ebe Grik ekwughị ụdị ụlọ e tinyere ha.
