  verdict: revise
  source_fidelity: The draft accurately conveys the hostile apprehension (ἐπέβαλον ... τὰς χεῖρας), official custody (ἔθεντο εἰς τήρησιν), and postponement until the following day. However, “chi ejirilarị” is less explicit than the Greek ἑσπέρα, which specifically states that it was already evening.
  naturalness: “Ha wee jide ha” and “ruo n’echi ya” are natural Standard Igbo narrative phrasing. Replacing “chi ejirilarị” with “mgbede eruolarị” is clearer and more idiomatic for the stated time of day.
  terminology: “ụlọ nche” suitably represents custody without requiring that the location was a prison. The notes preserve the literal Greek hand-idiom and appropriately distinguish custody from a specified jail.
  issues:
