id: ACT.23.4
reference: Acts 23:4
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οἱ δὲ παρεστῶτες εἶπαν· Τὸν ἀρχιερέα τοῦ θεοῦ λοιδορεῖς;
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/004.yaml
  text: Those standing nearby said[a], “Are you insulting God’s high priest?”
translation:
  language: ig
  text: Ndị guzo nso n’ebe ahụ sịrị, “Ị na-akparị nnukwu onye nchụàjà nke Chineke?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ δὲ παρεστῶτες
  choice: Ndị guzo nso n’ebe ahụ
  rationale: Nkebi okwu a na-ezo aka ná ndị nọ n’akụkụ Pọl. Nsụgharị a bụ Igbo doro anya ma na-echekwa echiche nke ịnọ ma ọ bụ iguzo nso.
- source_word: εἶπαν
  choice: sịrị
  rationale: Ngwaa a dị n’oge aorist ma na-akwalite akụkọ ahụ n’ihu; “sịrị” bụ ụzọ Igbo nkịtị si kwuo ya.
- source_word: ἀρχιερέα
  choice: nnukwu onye nchụàjà
  rationale: N’ọnọdụ a, okwu Grik ahụ na-ezo aka n’onyeisi ndị nchụàjà ndị Juu; “nnukwu onye nchụàjà” bụ aha ọkwa ahụ a na-aghọta nke ọma n’Igbo.
- source_word: τοῦ θεοῦ
  choice: nke Chineke
  rationale: Ọ na-egosi njikọ onye nọ n’ọkwa nnukwu onye nchụàjà na Chineke, n’ebughị echiche ọzọ banyere nkwado Chineke nye omume onye ahụ.
- source_word: λοιδορεῖς
  choice: Ị na-akparị
  rationale: Okwu a pụtara iji okwu mkparị ma ọ bụ okwu ọjọọ wakpo mmadụ. “Ị na-akparị” bụ asụsụ Igbo nke oge a, dị mfe nghọta, ma dabara n’ajụjụ ịba mba a.
theological_decisions:
- issue: Ike okwu τοῦ θεοῦ mgbe ọ na-akọwa nnukwu onye nchụàjà
  choice: nke Chineke
  alternative: nnukwu onye nchụàjà Chineke
  rationale: Nsụgharị a na-egosi na ọkwa ahụ nwere njikọ na Chineke, ma ọ naghị agbakwụnye na Chineke kwadoro omume onye nọ n’ọkwa ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke nwere ugwu ma dị mfe nghọta, sụgharịa amaokwu ahụ. A họọrọ “na-akparị” kama okwu ochie ma ọ bụ nke siri ike karị iji gosipụta mkparị e kwuru n’ọnụ.
