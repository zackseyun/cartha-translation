id: ACT.23.31
reference: Acts 23:31
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Οἱ μὲν οὖν στρατιῶται κατὰ τὸ διατεταγμένον αὐτοῖς ἀναλαβόντες τὸν Παῦλον ἤγαγον ⸀διὰ νυκτὸς εἰς τὴν Ἀντιπατρίδα·
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/031.yaml
  text: So the soldiers[a], according to what had been ordered them[b], took Paul and brought him by night to Antipatris.
translation:
  language: ig
  text: Ya mere, ndị agha ahụ, dịka ihe e nyere ha n’iwu si dị, kpọọrọ Pọl gaa Antipatris n’abalị.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οἱ μὲν οὖν στρατιῶται
  choice: Ya mere, ndị agha ahụ
  rationale: “Ya mere” na-egosipụta ọganihu na njikọ akụkọ nke οὖν; a sụgharịghị μέν iche n’ihi na ọ na-ahazi okwu maka ihe ga-esochi, nke Igbo na-egosipụta nke ọma site n’usoro akụkọ.
- source_word: κατὰ τὸ διατεταγμένον αὐτοῖς
  choice: dịka ihe e nyere ha n’iwu si dị
  rationale: 'Nke a na-echekwa ọdịdị nnara-ihe nke participle zuru oke: ihe ahụ e nyere ha n’iwu tupu oge ahụ.'
- source_word: ἀναλαβόντες
  choice: kpọọrọ Pọl
  rationale: N’okwu a, ngwaa ahụ na-egosi na ha kpọọrọ Pọl were gawa ya; “kpọọrọ” bụ Igbo ebumpụta ụwa ma ghara itinye echiche ọzọ na-adịghị n’isi mmalite.
- source_word: ἤγαγον
  choice: gaa
  rationale: E jikọtara ya na “kpọọrọ” ka okwu Igbo bụrụ “kpọọrọ Pọl gaa,” nke na-egosipụta iduga ma ọ bụ ibuga mmadụ n’ebe a kpọrọ aha.
- source_word: διὰ νυκτός
  choice: n’abalị
  rationale: Nke a na-egosi na njem ahụ mere n’oge abalị, na-enweghị ịsị na ọ ga-abụrịrị na ha gara njem ahụ abalị ahụ dum.
- source_word: Ἀντιπατρίδα
  choice: Antipatris
  rationale: E dere aha obodo ahụ n’ụdị ntụgharị mkpụrụokwu a na-amata nke ọma.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị ùgwù ma doo ndị nkịtị anya. E debere usoro akụkọ ahụ nkenke ma dị larịị, na-enweghị ịgbakwunye nkọwa okpukpe ma ọ bụ echiche na-adịghị n’ederede Grik.
