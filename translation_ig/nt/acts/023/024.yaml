  text: κτήνη τε παραστῆσαι ἵνα ἐπιβιβάσαντες τὸν Παῦλον διασώσωσι πρὸς Φήλικα τὸν ἡγεμόνα,
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/024.yaml
  text: and provide mounts[a], so that they may put Paul on them and bring him safely to Felix the governor[b],
translation:
  language: ig
  text: kwadobekwa anụmanụ ndị a ga-agba[a], ka ha kpọkwasị Pọl n’elu ha ma kpọga ya n’enweghị nsogbu ruo n’ebe gọvanọ Feliks nọ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “anụmanụ” ma ọ bụ “anụmanụ ndị e ji ebu ibu.” Okwu Grik ahụ ekwughị kpọmkwem ụdị anụmanụ ọ bụ.
    reason: lexical_alternative
  - marker: b
    text: 'A pụkwara ịsụgharị ya: “ka ha, mgbe ha kpọkwasịrị Pọl n’elu ha, kpọga ya n’enweghị nsogbu ruo n’ebe gọvanọ Feliks nọ.”'
    reason: previous_rendering
lexical_decisions:
- source_word: κτήνη
  choice: anụmanụ ndị a ga-agba
  rationale: Okwu Grik a na-ezo aka n’anụmanụ a na-agba ma ọ bụ nke e ji ebu ibu, ma ọ naghị ekwu kpọmkwem ụdị anụmanụ ọ bụ. Nsụgharị a na-egosi ọrụ ha n’ahịrịokwu a n’etinyeghị ‘ịnyịnya’ n’ebe isi mmalite na-ekwughị ya.
- source_word: τε
  choice: -kwa
  rationale: Mgbakwunye ‘-kwa’ jikọtara iwu a na iwu ndị bu ya ụzọ n’ụzọ Igbo si ada nke ọma.
- source_word: παραστῆσαι
  choice: kwadobekwa
  rationale: N’ọnọdụ iwu a, okwu ahụ pụtara ime ka anụmanụ ndị ahụ dị njikere maka njem.
- source_word: ἵνα
  choice: ka
  rationale: ‘Ka’ na-egosi nzube nke ịkwadebe anụmanụ ndị ahụ.
- source_word: ἐπιβιβάσαντες
  choice: ha nyịnye Pọl n’elu ha
  rationale: Nke a na-egosi na ndị agha ga-enyere Pọl aka ịnọ n’elu anụmanụ ndị ahụ; e jikọtara ya na ngwaa na-esochi ya ka Igbo wee na-aga were were.
- source_word: διασώσωσι
  choice: kpọga ya n’enweghị nsogbu
  rationale: Okwu ahụ na-emesi ike na a ga-echebe Pọl n’ụzọ ma mee ka o ruo ebe a na-aga n’enweghị ihe mere ya.
- source_word: πρὸς
  choice: ruo n’ebe ... nọ
  rationale: N’ebe a, πρός na-egosi ịgakwuru mmadụ; usoro a bụ Igbo doro anya nke na-egosi ebe njem ahụ kwụsịrị.
- source_word: ἡγεμόνα
  choice: gọvanọ
  rationale: Ọ bụ aha ọkwá onye na-achị ógbè n’okpuru ọchịchị Rom, ‘gọvanọ’ bụkwa okwu Igbo a na-aghọta nke ọma maka ọkwá ahụ.
theological_decisions: []
translation_notes:
  register: E ji Igbo Izugbe dị ugbu a, dị ugwu ma dị mfe nghọta. Ahịrịokwu ahụ nọgidere bụrụ akụkụ nke iwu malitere n’amaokwu bu ya ụzọ; ‘-kwa’ na-egosi njikọ ahụ. E zere ịkpọ anụmanụ ndị ahụ ịnyịnya n’ihi na isi mmalite akọwaghị ụdị ha.
