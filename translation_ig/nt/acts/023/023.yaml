source:
  edition: SBLGNT
  text: Καὶ προσκαλεσάμενός ⸂τινας δύο⸃ τῶν ἑκατονταρχῶν εἶπεν· Ἑτοιμάσατε στρατιώτας διακοσίους ὅπως πορευθῶσιν ἕως Καισαρείας, καὶ ἱππεῖς ἑβδομήκοντα καὶ δεξιολάβους διακοσίους, ἀπὸ τρίτης ὥρας τῆς νυκτός,
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/023.yaml
  text: And calling two of the centurions to him[a], he said, “Prepare two hundred soldiers to go as far as Caesarea, and seventy horsemen and two hundred spearmen[b], at the third hour of the night.”
translation:
  language: ig
  text: O wee kpọọ mmadụ abụọ n’ime ndị ọchịagha na-achị otu narị ndị agha, sị ha, “Kwadebenụ ndị agha narị abụọ ka ha gaa ruo Sesaria, tinyere ndị agha iri asaa na-agba ịnyịnya na ndị agha narị abụọ ji ube[a], malite n’elekere atọ nke abalị[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị nche aka nri narị abụọ.” Amaghị nke ọma kpọmkwem ihe okwu Grik a dị ụkọ pụtara.
    reason: lexical_alternative
  - marker: b
    text: Ya bụ, ihe dị ka awa atọ mgbe abalị malitere, nke ga-abụ ihe dị ka elekere itoolu nke abalị n’usoro oge ndị Juu.
    reason: cultural_note
lexical_decisions:
- source_word: προσκαλεσάμενός
  choice: kpọọ ... sị ha
  rationale: A sụgharịrị participle a dị ka ịkpọ ndị ahụ bịakwute ya tupu o nye ha iwu; nke a bụ ụzọ Igbo dị mfe ma na-edobe usoro omume ahụ.
- source_word: τινας δύο τῶν ἑκατονταρχῶν
  choice: mmadụ abụọ n’ime ndị ọchịagha na-achị otu narị ndị agha
  rationale: τινας abụọ na-egosi mmadụ abụọ a na-akpọghị aha; nkọwa ọkwa agha ahụ na-eme ka ihe ἑκατοντάρχης pụtara doo onye Igbo nke oge a anya.
- source_word: Ἑτοιμάσατε
  choice: Kwadebenụ
  rationale: Ọ bụ iwu e nyere ọtụtụ mmadụ, ya mere ụdị ọtụtụ mmadụ nke ngwaa ahụ kwesịrị ekwesị ma dịkwa ugwu.
- source_word: στρατιώτας διακοσίους
  choice: narị ndị agha abụọ
  rationale: Nke a na-enye ọnụ ọgụgụ na ụdị ndị ahụ n'ụzọ Igbo a na-aghọta nke ọma.
- source_word: ὅπως πορευθῶσιν
  choice: ka ha gaa
  rationale: “Ka” na-edobe nzube nke ὅπως tinyere subjunctive n’ụzọ Igbo sitere n’okike.
- source_word: ἕως Καισαρείας
  choice: ruo Sesaria
  rationale: “Ruo” na-edobe echiche nke njem ga-eru ebe ahụ, nke ἕως na-egosi.
- source_word: ἱππεῖς ἑβδομήκοντα
  choice: ndị agha iri asaa na-agba ịnyịnya
  rationale: Nkọwa a doro ndị na-agụ Igbo nke oge a anya ma na-egosi na ha bụ ndị agha nọ n’elu ịnyịnya.
- source_word: δεξιολάβους διακοσίους
  choice: narị ndị agha abụọ ji ube
  rationale: Okwu Grik a dị ụkọ, ihe ọ pụtara kpọmkwem ejighị n’aka. “Ndị agha ji ube” dabara n’ọnọdụ agha ahụ, ebe e debere ejighị n’aka ahụ na nkọwa ala peeji.
- source_word: ἀπὸ τρίτης ὥρας τῆς νυκτός
  choice: Ha ga-apụ n’elekere atọ nke abalị
  rationale: ἀπό na-egosi oge ha ga-amalite ịga; ịkpọpụta ọpụpụ ahụ na-eme ka njikọ ya na njem doo anya, ma na-edobe usoro ịgụ oge oge ochie.
