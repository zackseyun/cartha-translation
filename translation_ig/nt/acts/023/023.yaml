  verdict: revise
  source_fidelity: 'Ederede ahụ na-atụgharị akụkụ ndị bụ isi nke Grik ahụ nke ọma: ịkpọ ndị ọchịagha abụọ, ọnụ ọgụgụ ndị agha, Sesaria, ndị na-agba ịnyịnya, na oge abalị. Otú ọ dị, “Ha ga-apụ” na-atụgharị iwu ahụ ka ọ bụrụ nkwupụta n’ọdịnihu ma na-agbakwụnye ‘ịpụ,’ nke ederede Grik ekwughị kpọmkwem. ἀπό τρίτης ὥρας kwesịrị ịkọwa oge a ga-amalite ịkwadebe ndị agha n’iwu ahụ.'
  naturalness: “Ndị agha narị abụọ” bụ usoro Igbo ka mma karịa “narị ndị agha abụọ.” Ijikọta nkebi oge ahụ n’otu iwu, “malite n’elekere atọ nke abalị,” dịkwa n’usoro Igbo ma na-ezere nkwupụta ‘Ha ga-apụ’ nke na-adịghị mkpa.
  terminology: “Ndị ọchịagha na-achị otu narị ndị agha” na-akọwa centurion nke ọma. “Ndị agha ji ube” bụ ntụgharị nwere ezi uche maka δεξιολάβους, ma nkọwa ala peeji ga-ekwupụta n’enweghị mgbagwoju anya na ihe okwu ahụ pụtara kpọmkwem amaghị nke ọma; “ndị nche aka nri” ka mma karịa “ndị nche ... na-echebe aka nri,” nke na-agbakwụnye omume na-adịghị n’okwu Grik.
