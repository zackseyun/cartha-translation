    rationale: Grik nwere iwu Ἑτοιμάσατε, ebe ἀπὸ τρίτης ὥρας τῆς νυκτός na-akọwa oge mmalite. Okwu ahụ ekwughị ngwaa pụrụ iche pụtara ‘apụ.’
  - severity: low
