translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. A kọwara ọkwa centurion kama iji okwu agbaziri nke nwere ike ghara ido ọtụtụ ndị anya; a hapụrụ usoro oge oge ochie n’amaokwu ma kọwaa ya n’ala peeji.
