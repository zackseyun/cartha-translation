    rationale: N’ihi na δεξιολάβος bụ okwu agha dị ụkọ nke ihe ọ pụtara na-arụrịta ụka, nkọwa ọzọ kwesịrị ịdị nso n’okwu ahụ ma ghara ịkọwa ọrụ a na-amaghị n’aka.
