  to: O wee kpọọ mmadụ abụọ n’ime ndị ọchịagha na-achị otu narị ndị agha, sị ha, “Kwadebenụ ndị agha narị abụọ ka ha gaa ruo Sesaria, tinyere ndị agha iri asaa na-agba ịnyịnya na ndị agha narị abụọ ji ube[a], malite n’elekere atọ nke abalị[b].”
  rationale: A dozigharịrị usoro ọnụ ọgụgụ ahụ ka ọ bụrụ Igbo eke. A dochiri “Ha ga-apụ” anya site n’itinye oge ahụ n’ime iwu a na-enye, ka a ghara ịgbanwe ụdị iwu Grik ma ọ bụ tinye ngwaa ‘ịpụ’ n’enweghị isi iyi. A mekwara nkọwa ala peeji maka δεξιολάβους ka ọ ghara ịgbakwụnye ọrụ agha na-adịghị n’ederede.
