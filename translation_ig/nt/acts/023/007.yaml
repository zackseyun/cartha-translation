- from: Mgbe ọ ka na-ekwu ihe a, esemokwu bilitere n’etiti ndị Farisii na ndị Sadusii, ndị ahụ gbakọtara wee kewaa abụọ.
  to: Ka ọ na-ekwu ihe a, esemokwu bilitere n’etiti ndị Farisii na ndị Sadusii, ìgwè mmadụ ahụ kewara.
  rationale: The revision retains the draft’s accurate rendering of the temporal participial construction and of the dispute, while rendering τὸ πλῆθος directly as “ìgwè mmadụ ahụ” and preserving the unelaborated passive sense of ἐσχίσθη as “kewara.” No footnotes are needed because the translation contains no disputed or materially obscured element requiring an anchor.
