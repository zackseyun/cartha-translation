  text: τοῦτο δὲ αὐτοῦ ⸀λαλοῦντος ἐγένετο στάσις τῶν Φαρισαίων ⸂καὶ Σαδδουκαίων⸃, καὶ ἐσχίσθη τὸ πλῆθος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/007.yaml
  text: And as he was saying this[a], a dispute arose between the Pharisees and Sadducees[b], and the assembly was divided.
translation:
  language: ig
  text: Ka ọ na-ekwu ihe a, esemokwu bilitere n’etiti ndị Farisii na ndị Sadusii, ìgwè mmadụ ahụ kewara.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῦτο δὲ αὐτοῦ λαλοῦντος
  choice: Mgbe ọ ka na-ekwu ihe a
  rationale: Nkebi ahịrịokwu a bụ genitive absolute nwere present participle; “ka na-ekwu” na-egosi na esemokwu ahụ bilitere mgbe okwu ya ka na-aga n’ihu.
- source_word: ἐγένετο
  choice: bilitere
  rationale: N’ebe a, okwu ahụ na-egosi na esemokwu malitere ma ọ bụ pụtara na mberede; “bilitere” bụ ụzọ Igbo si ekwu ya nke ọma.
- source_word: στάσις
  choice: esemokwu
  rationale: Okwu Grik a nwere ike ịpụta esemokwu, ọgba aghara, ma ọ bụ nkewa n’etiti òtù. “Esemokwu” dabara n’arụmụka bilitere n’ebe a ma doo onye na-agụ anya.
- source_word: τῶν Φαρισαίων καὶ Σαδδουκαίων
  choice: n’etiti ndị Farisii na ndị Sadusii
  rationale: Ọ bụ ezie na Grik ji genitive mee ya, “n’etiti” na-egosi nke ọma n’Igbo na òtù abụọ ahụ na-emegide ibe ha.
- source_word: ἐσχίσθη
  choice: wee kewaa abụọ
  rationale: Passive nke σχίζω pụtara ịgbawa ma ọ bụ ikewa. N’ọnọdụ mmekọrịta mmadụ a, ọ na-egosi na ndị ahụ gbakọtara kewara gaa n’akụkụ abụọ.
- source_word: τὸ πλῆθος
  choice: ndị ahụ gbakọtara
  rationale: N’ebe a ọ na-ezo aka n’ìgwè mmadụ nọ n’ọgbakọ ikpe ahụ. “Ndị ahụ gbakọtara” bụ okwu dị mfe ma gosi na ọ bụghị naanị ìgwè mmadụ na-enweghị usoro.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E debere omume ndị ahụ dị n’otu oge site n’okwu “ka na-ekwu,” ma gosipụta nkewa nke ọgbakọ ahụ n’enweghị ịgbakwunye nkọwa okpukpe.
