  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἀκούσας δὲ ὁ υἱὸς τῆς ἀδελφῆς Παύλου ⸂τὴν ἐνέδραν⸃ παραγενόμενος καὶ εἰσελθὼν εἰς τὴν παρεμβολὴν ἀπήγγειλεν τῷ Παύλῳ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/016.yaml
  text: But when Paul’s sister’s son heard of the ambush[c][b][a], he came and entered the barracks and reported it to Paul.
translation:
  language: ig
  text: Ma mgbe nwa nwoke nke nwanne nwanyị Pọl nụrụ banyere izo ụzọ ahụ[a], ọ bịara banye n'ogige ndị agha[b] ma kọọrọ Pọl ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “banyere nkata ahụ” ma ọ bụ “banyere izu ọjọọ ahụ.” Okwu Grik ahụ na-ezo kpọmkwem n'izo ụzọ, ya bụ, ịnọ na-eche ka e wee wakpo mmadụ.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ụlọ ndị agha.” N'ebe a, o yikarịrị ka okwu ahụ na-ezo aka n'ebe ndị agha Rom nọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀκούσας
  choice: mgbe ... nụrụ
  rationale: Aorist participle a na-egosi ihe mere tupu ngwaa bụ isi; usoro ‘mgbe ... nụrụ’ bụ Igbo ebumpụta ụwa ma na-edobe njikọ oge ahụ.
- source_word: δὲ
  choice: Ma
  rationale: 'δέ na-egosi ngbanwe n''akụkọ nwere ntakịrị ọdịiche: atụmatụ ahụ dị, ma onye a nụrụ ya.'
- source_word: ὁ υἱὸς τῆς ἀδελφῆς Παύλου
  choice: nwa nwoke nwanne nwanyị Pọl
  rationale: Nke a na-edobe kpọmkwem mmekọrịta ezinụlọ Grik kwuru—ọ bụ nwa nwoke nke nwanne nwanyị Pọl—kama iji naanị okwu sara mbara maka nwa nwanne.
- source_word: τὴν ἐνέδραν
  choice: ndị ahụ zoro n'ụzọ iche ya nche
  rationale: ἐνέδρα na-ezo kpọmkwem n'izobe na-eche onye a ga-awakpo, ọ bụghị naanị atụmatụ izugbe. Nsụgharị a na-eme ka echiche ahụ doo ndị na-agụ Igbo anya.
- source_word: παραγενόμενος
  choice: ọ bịara
  rationale: Participle a na-egosi ọbịbịa ya tupu ọ banye; ‘ọ bịara’ na-enye usoro omume ahụ n'Igbo doro anya.
- source_word: εἰσελθὼν εἰς τὴν παρεμβολὴν
  choice: banye n'ogige ndị agha
  rationale: παρεμβολή nwere ike ịbụ ogige ndị agha ma ọ bụ ụlọ ndị agha. N'ebe a ọ bụ ebe ndị agha Rom nọ na-eche Pọl; ‘ogige ndị agha’ bụ okwu Igbo doro anya ma na-ahapụ nkọwa ụlọ kpọmkwem n'ihe odide ala peeji.
- source_word: ἀπήγγειλεν
  choice: kọọrọ ... ya
  rationale: ἀπαγγέλλω pụtara izigara mmadụ ozi ma ọ bụ ịkọrọ ya ihe a chọpụtara. ‘kọọrọ Pọl ya’ dabara n'ọnọdụ a.
- source_word: τῷ Παύλῳ
  choice: Pọl
  rationale: Dative a bụ onye a gwara ozi; usoro ngwaa Igbo ‘kọọrọ Pọl’ na-egosi nke ahụ ozugbo.
theological_decisions: []
translation_notes:
  register: 'Ejiri Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. A kọwara ἐνέδρα n''ụzọ ebumpụta ụwa kama ịmepụta okwu na-edochaghị anya; usoro ahịrịokwu ahụ na-edobe omume ndị sochiri ibe ha: ịnụ, ịbịa, ịbanye, na ịkọrọ.'
