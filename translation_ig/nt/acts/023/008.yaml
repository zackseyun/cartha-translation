  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Σαδδουκαῖοι ⸀μὲν γὰρ λέγουσιν μὴ εἶναι ἀνάστασιν ⸀μήτε ἄγγελον μήτε πνεῦμα, Φαρισαῖοι δὲ ὁμολογοῦσιν τὰ ἀμφότερα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/008.yaml
  text: For the Sadducees say there is no resurrection[a], nor angel nor spirit, but the Pharisees acknowledge both.
translation:
  language: ig
  text: N’ihi na ndị Sadusii na-ekwu na mbilite n’ọnwụ adịghị, mmụọ ozi adịghịkwa, mmụọ adịghịkwa; ma ndị Farisii na-ekweta na ha abụọ dị.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị Farisii na-ekweta n’ihe atọ ahụ niile”—ya bụ, mbilite n’ọnwụ, mmụọ ozi, na mmụọ. Grik kwuru “ha abụọ,” nke n’ụzọ kachasị kpọmkwem na-ezo aka na “mmụọ ozi” na “mmụọ”; ma ụfọdụ na-aghọta ya n’ụzọ sara mbara site n’ọnọdụ okwu ahụ.
    reason: alternative_reading
lexical_decisions:
- source_word: Σαδδουκαῖοι
  choice: ndị Sadusii
  rationale: Aha a na-akpọ òtù ndị Juu ahụ n’asụsụ Igbo; e dere ya dịka ụda aha Grik si dị kama ịsụgharị ihe aha ahụ pụtara.
- source_word: μὲν γὰρ
  choice: N’ihi na
  rationale: Na-egosi na ahịrịokwu a na-akọwa ihe kpatara esemokwu e kwuru okwu ya n’amaokwu bu ụzọ.
- source_word: λέγουσιν
  choice: na-ekwu
  rationale: Okwu dị mfe nke na-akọ nkwenkwe ha na-ekwupụta mgbe niile.
- source_word: μὴ εἶναι
  choice: adịghị
  rationale: Ọ bụ ụzọ Igbo dị nkenke ma kwekọọ n’usoro asụsụ e si gọnahụ ịdị adị.
- source_word: ἀνάστασιν
  choice: mbilite n’ọnwụ
  rationale: Okwu Igbo a na-ahụkarị maka ἀνάστασις, ya bụ isi n’ọnwụ bilie.
- source_word: μήτε ἄγγελον μήτε πνεῦμα
  choice: mmụọ ozi adịghịkwa, mmụọ adịghịkwa
  rationale: Na-echekwa ịgọnahụ ihe abụọ ahụ n’otu n’otu, nakwa ọdịiche dị n’etiti mmụọ ozi na mmụọ.
- source_word: Φαρισαῖοι
  choice: ndị Farisii
  rationale: Aha a na-akpọ òtù ndị Juu ahụ n’Igbo, nke sitere n’ịkpọgharị aha ahụ dịka ụda ya si dị.
- source_word: ὁμολογοῦσιν
  choice: na-ekweta
  rationale: N’ebe a ọ pụtara ịnabata ma ọ bụ ikwupụta na ihe ahụ bụ eziokwu, ọ bụghị ikwupụta mmehie.
- source_word: τὰ ἀμφότερα
  choice: na ha abụọ dị
  rationale: Na-edowe kpọmkwem echiche Grik nke ‘ha abụọ’ ma mee ka ahịrịokwu ahụ doo anya n’Igbo, n’agbanyeghị na ihe atọ pụtara n’ahịrịokwu dum.
theological_decisions:
- issue: Ihe okwu τὰ ἀμφότερα (‘ha abụọ’) na-ezo aka na ya
  choice: E debere ‘ha abụọ’ n’isi ederede, nke kacha nso na-ezo aka na mmụọ ozi na mmụọ.
  alternative: 'A pụrụ ịghọta ya dị ka na ndị Farisii na-ekweta n’ihe atọ ahụ niile: mbilite n’ọnwụ, mmụọ ozi, na mmụọ.'
  rationale: Grik kwuru ‘ha abụọ,’ ọ bụghị ‘ha atọ’ ma ọ bụ ‘ha niile.’ Ihe abụọ e jikọrọ ozugbo tupu ya bụ mmụọ ozi na mmụọ. Ma n’ihi na ọnọdụ okwu ahụ nwekwara mbilite n’ọnwụ, e debere nghọta sara mbara n’ala ala peeji kama idozi esemokwu ahụ n’isi ederede.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke dị ugbu a, kwanyere ugwu, ma dị mfe nghọta. E ji ‘mbilite n’ọnwụ’ mee ihe dịka okwu Baịbụl a maara nke ọma; e zere okwu ụka pụrụ iche nke otu denominashọn.
