  text: τῇ δὲ ἐπαύριον ἐάσαντες τοὺς ἱππεῖς ⸀ἀπέρχεσθαι σὺν αὐτῷ ὑπέστρεψαν εἰς τὴν παρεμβολήν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/032.yaml
  text: But on the next day[a], after letting the horsemen go on with him, they returned to the barracks.
translation:
  language: ig
  text: Ma n’echi ya, ha hapụrụ ndị agha na-agba ịnyịnya ka ha soro ya pụọ, wee laghachi n’ụlọ ndị agha[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’ogige ndị agha.” Okwu Grik a nwere ike ịpụta ogige ndị agha ma ọ bụ ebe ndị agha na-anọ; n’ebe a, o yiri ka ọ na-ezo aka n’ụlọ ndị agha Rom ma ọ bụ ebe e wusiri ike na Jerusalem.
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ δὲ ἐπαύριον
  choice: Ma n’echi ya
  rationale: Nkebiokwu a pụtara ‘n’ụbọchị sochirinụ.’ A sụgharịrị δέ dịka ‘Ma’ iji gosi ntakịrị mgbanwe n’akụkọ ahụ n’enweghị ime ka ọ bụrụ nnukwu mmegide.
- source_word: ἐάσαντες
  choice: ha hapụrụ ... ka
  rationale: N’ebe a, ἐάω pụtara ikwe ma ọ bụ ịhapụ mmadụ ka o mee ihe. Usoro ‘hapụrụ ... ka’ bụ Igbo nkịtị nke na-egosi na nke a mere tupu ha alaghachi.
- source_word: τοὺς ἱππεῖς
  choice: ndị agha na-agba ịnyịnya
  rationale: Nke a na-akọwa kpọmkwem ndị agha na-eji ịnyịnya aga, ma doo ndị na-agụ Igbo nke oge a anya karịa okwu agha a gbazitere.
- source_word: ἀπέρχεσθαι σὺν αὐτῷ
  choice: ka ha na ya gaa n’ihu
  rationale: N’ọnọdụ njem nche a, okwu ahụ na-egosi na ndị agha ịnyịnya gara n’ihu soro Pọl, ebe ndị ọzọ laghachiri.
- source_word: ὑπέστρεψαν
  choice: wee laghachi
  rationale: ὑποστρέφω pụtara ịlaghachi ma ọ bụ ịtụgharị azụ; ‘laghachi’ bụ okwu akụkọ doro anya ma dịkwa n’Igbo nkịtị.
- source_word: εἰς τὴν παρεμβολήν
  choice: n’ụlọ ndị agha[a]
  rationale: παρεμβολή nwere ike ịpụta ogige ndị agha ma ọ bụ ebe ndị agha na-anọ. N’ọnọdụ a, ọ ga-abụ ụlọ ma ọ bụ ebe ndị agha Rom nọ na Jerusalem; e tinyere nkọwa ọzọ n’ala peeji iji chekwaa obosara okwu Grik ahụ.
theological_decisions: []
translation_notes:
  register: 'E ji Igbo Izugbe nke oge a, nke dị ugwu ma dị mfe nghọta, dee amaokwu ahụ. A họọrọ ‘ndị agha na-agba ịnyịnya’ kama okwu agha pụrụ iche, ma debe usoro omume nke Grik: ha kwere ka ndị ahụ gaa n’ihu, emesịa ha laghachi.'
