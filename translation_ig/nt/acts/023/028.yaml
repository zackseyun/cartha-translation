  register: Asụsụ Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta. E jiri ‘kansụl’ mee ka ụdị nzukọ ahụ doo anya, ebe nkọwa ala peeji na-edebe aha ọdịnala ‘Sanhedrin.’
