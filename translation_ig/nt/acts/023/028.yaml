  text: βουλόμενός ⸀τε ⸀ἐπιγνῶναι τὴν αἰτίαν δι’ ἣν ἐνεκάλουν αὐτῷ, ⸀κατήγαγον εἰς τὸ συνέδριον αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/028.yaml
  text: And wanting to know the charge for which they were accusing him[a], I brought him down to their council.
translation:
  language: ig
  text: N’ịchọ ịmata ebubo ha na-ebo ya, akpọdatara m ya n’ihu kansụl ha.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βουλόμενός τε
  choice: Ebe m chọrọ
  rationale: Na-egosi ebumnuche Lisiọs ma jikọta ya n'ụzọ dị nro n’ihe o kwuru tupu nke a; ụdị a bụ Igbo dị ndụ ma doo anya.
- source_word: ἐπιγνῶναι
  choice: ịmata kpọmkwem
  rationale: Na-echekwa echiche nke inweta ezi ihe ọmụma zuru ezu banyere okwu ahụ, n’enweghị ime ka okwu ahụ sie ike karịa ihe Grik kwuru.
- source_word: τὴν αἰτίαν δι’ ἣν
  choice: ebubo ha ji
  rationale: N’ọnọdụ ikpe a, αἰτία bụ ihe ndabere nke ebubo ahụ; usoro Igbo a na-egosi nke ọma ihe ha ji ebo ya ebubo.
- source_word: ἐνεκάλουν αὐτῷ
  choice: ha ji na-ebo ya
  rationale: Na-egosi omume ebubo ahụ na-aga n’ihu dịka imperfect Grik si dị, ma na-adabara usoro okwu Igbo.
- source_word: κατήγαγον
  choice: akpọdatara m ya
  rationale: Na-echekwa ma omume iduga onye ahụ ma nkọwa mmegharị ‘rịdata’ dị na ngwaa Grik.
- source_word: εἰς τὸ συνέδριον αὐτῶν
  choice: n’ihu ndị kansụl ha
  rationale: ‘N’ihu ndị kansụl’ bụ ụzọ Igbo sitere n’okike isi kwuo na a kpọgara ya ka ọ pụta n’ihu nzukọ ikpe ahụ; ‘ha’ na-echekwa nnọchiaha Grik.
