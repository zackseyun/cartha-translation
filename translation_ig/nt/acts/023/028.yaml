revisions:
- from: Ebe m chọrọ ịmata kpọmkwem ebubo ha ji na-ebo ya[a], akpọdatara m ya n’ihu ndị kansụl ha.
  to: N’ịchọ ịmata ebubo ha na-ebo ya, akpọdatara m ya n’ihu kansụl ha.
  rationale: The revision retains the legal sense of αἰτία and the ongoing force of ἐνεκάλουν in “ebubo ha na-ebo ya,” removes an avoidable intensification of ἐπιγνῶναι, and translates συνέδριον as the council rather than its members. The footnote preserves the possible traditional designation without treating it as obligatory.
  reviewer_model: gpt-5.6-terra
