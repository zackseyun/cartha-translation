id: ACT.23.1
reference: Acts 23:1
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀτενίσας δὲ ⸂ὁ Παῦλος τῷ συνεδρίῳ⸃ εἶπεν· Ἄνδρες ἀδελφοί, ἐγὼ πάσῃ συνειδήσει ἀγαθῇ πεπολίτευμαι τῷ θεῷ ἄχρι ταύτης τῆς ἡμέρας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/001.yaml
  text: And Paul[a], looking intently at the council, said, “Brothers, I have lived before God with an entirely good conscience up to this day.”
translation:
  language: ig
  text: Pọl legidere nzukọ ikpe ahụ anya, sị, “Ụmụnna, ebiwo m n’ihu Chineke jiri ezi akọ na uche ruo taa.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀτενίσας
  choice: legidere ... anya
  rationale: Nkebiokwu a na-egosi ile mmadụ ma ọ bụ ihe anya nke ọma, na-elepụghị anya ọzọ; ọ na-edobe ike dị na ἀτενίζω n’Igbo dị ndụ.
- source_word: δὲ
  choice: (ejikọghị ya n’okwu pụrụ iche)
  rationale: δέ bụ njikọ dị nro n’ebe a. Usoro ahịrịokwu Igbo na-aga n’ihu nke ọma n’enweghị ịtinye ‘ma’ ma ọ bụ ‘mgbe ahụ,’ nke nwere ike inye njikọ ahụ ike ọ na-enweghị.
- source_word: τῷ συνεδρίῳ
  choice: ndị òtù nzukọ ikpe ahụ
  rationale: N’ọnọdụ a, συνέδριον bụ ndị òtù nzukọ ndị Juu na-achị ma na-ekpe ikpe. Nsụgharị a doro onye Igbo nkịtị anya ma ghara iji aha mbinye ‘Sanhedrin’ dochie okwu nkịtị Grik.
- source_word: Ἄνδρες ἀδελφοί
  choice: Ụmụnna m
  rationale: Nke a bụ ụzọ Igbo e si akpọ ndị mmadụ ibe ya okwu n’ụzọ nkwanye ùgwù na mmekọrịta. Ọ dabara ndị nwoke nọ n’ihu Pọl n’ọnọdụ a n’agbanyeghị na okwu Igbo ahụ nwekwara ike ịgụnye ụmụnne n’ozuzu.
- source_word: πάσῃ συνειδήσει ἀγαθῇ
  choice: jiri akọ na uche dị ọcha kpamkpam
  rationale: ‘Jiri’ na-egosi ụzọ o si bie ndụ, ‘dị ọcha’ na-ekwupụta akọ na uche ọma n’Igbo ebumpụta ụwa, ‘kpamkpam’ na-echekwa ike πάσῃ.
- source_word: πεπολίτευμαι
  choice: ebiwo m
  rationale: Perfect ahụ na-eleghachi anya n’ụzọ ndụ Pọl ruo oge ọ na-ekwu okwu. ‘Ebiwo m’ dị mfe ma dị ebumpụta ụwa, na-enweghị ịgbakwụnye echiche ndọrọ ndọrọ ọchịchị n’isiokwu bụ isi; nkọwa ala peeji na-echekwa ndò okwu gbasara omume nwa amaala.
- source_word: τῷ θεῷ
  choice: n’ihu Chineke
  rationale: Nke a na-egosi na ndụ ahụ dị n’ihu Chineke, n’okpuru anya na ikpe ya; ọ bụkwa okwu Igbo dabara nke ọma na ‘akọ na uche.’
- source_word: ἄχρι ταύτης τῆς ἡμέρας
  choice: ruo taa
  rationale: Ọ na-echekwa mgbatị oge ahụ site n’oge gara aga ruo ụbọchị ahụ n’ụzọ Igbo dị nkenke ma doo anya.
theological_decisions:
- issue: Ihe πεπολίτευμαι pụtara n’okwu Pọl banyere onwe ya
  choice: E gosiri ya dị ka nkwupụta banyere otú Pọl siri bie n’ihu Chineke ruo ụbọchị ahụ.
  alternative: A pụrụ ịsụgharị ya, ‘akpaawo m àgwà dị ka nwa amaala n’ihu Chineke,’ iji mee ka ndò okwu gbasara ịbụ nwa amaala pụta ìhè.
  rationale: Ngwaa ahụ nwere ike ibu ndò okwu nke ndụ nwa amaala, ma n’ọnọdụ a isi okwu ya bụ omume Pọl na akọ na uche ya n’ihu Chineke. Nsụgharị ahụ anaghị eme ka o kwuo na o nweghị mmehie ọ bụla, ọ naghịkwa ehichapụ nkwupụta siri ike banyere akọ na uche ọma.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. ‘Nzukọ ikpe’ na-akọwa ọrụ òtù ahụ n’enweghị okwu mbinye; ‘Ụmụnna m’ bụ oku okwu ebumpụta ụwa. E tinyere akara ala peeji [a] ozugbo n’akụkụ ngwaa ọ na-akọwa.
