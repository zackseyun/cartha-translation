revisions:
- from: Pọl legidere ndị òtù nzukọ ikpe ahụ anya, sị, “Ụmụnna m, ebiwo m[a] n’ihu Chineke jiri akọ na uche dị ọcha kpamkpam ruo taa.”
  to: Pọl legidere nzukọ ikpe ahụ anya, sị, “Ụmụnna, ebiwo m n’ihu Chineke jiri ezi akọ na uche ruo taa.”
  rationale: The revision preserves the source’s collective term for the council, removes the unexpressed possessive from the address, and streamlines the alternative rendering for πεπολίτευμαι. The main text remains natural Standard Igbo and does not overstate Paul’s claim beyond a good conscience before God. The footnote marker remains attached to “ebiwo m.”
  reviewer_model: gpt-5.6-terra
