source:
  edition: SBLGNT
  text: οἵτινες προσελθόντες τοῖς ἀρχιερεῦσιν καὶ τοῖς πρεσβυτέροις εἶπαν· Ἀναθέματι ἀνεθεματίσαμεν ἑαυτοὺς μηδενὸς γεύσασθαι ἕως οὗ ἀποκτείνωμεν τὸν Παῦλον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/014.yaml
  text: These men came to the chief priests and the elders and said[a], “We have bound ourselves under a curse to taste nothing until we kill Paul.”
translation:
  language: ig
  text: Ndị ikom a bịakwutere ndị isi nchụàjà na ndị okenye wee sị[a], “Anyị ejirila ọbụbụ ọnụ ṅụọ iyi na anyị agaghị edetụ ihe ọ bụla ọnụ ruo mgbe anyị ga-egbu Pọl.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ, n’ụzọ na-esochikwu okwu Grik: “Anyị etinyela onwe anyị n’okpuru ọbụbụ ọnụ.” Okwu Grik ahụ na-egosi iyi nke ndị na-aṅụ ya ji ọbụbụ ọnụ ga-adakwasị onwe ha ma ha emezughị ya.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἵτινες
  choice: Ndị ikom a
  rationale: Ọ na-arụtụ aka n’ìgwè ndị gbara izu n’amaokwu bu ụzọ; ịkpọ ha ‘ndị ikom a’ na-eme ka onye a na-ekwu maka ya doo anya n’Igbo.
- source_word: προσελθόντες
  choice: bịakwutere
  rationale: Aorist participle a na-egosi ihe ha mere tupu ha ekwuo okwu; ‘bịakwutere’ bụ okwu akụkọ dị mma ma doo anya.
- source_word: ἀρχιερεῦσιν
  choice: ndị isi nchụàjà
  rationale: Nke a bụ aha a na-akpọ ìgwè ndị ndu nchụàjà n’ọnọdụ ndị Juu nke oge ahụ.
- source_word: πρεσβυτέροις
  choice: ndị okenye
  rationale: N’ebe a okwu ahụ pụtara ndị ndu a ma ama, ọ bụghị naanị ndị kara nká.
- source_word: Ἀναθέματι ἀνεθεματίσαμεν ἑαυτοὺς
  choice: Anyị ejirila ọbụbụ ọnụ kee onwe anyị nkwa
  rationale: Nkwupụta a na-echekwa ike nke iyi nke mmadụ ji ọbụbụ ọnụ ga-adakwasị onwe ya ma ọ bụrụ na o mezughị ya, n’ejighị okwu ụka nke oge e mesịrị.
- source_word: μηδενὸς γεύσασθαι
  choice: anyị agaghị atọ ihe ọ bụla ọnụ
  rationale: Nke a na-agbasochi ihe γεύομαι pụtara, bụ́ ‘itọ ọnụ’ ma ọ bụ ‘iri,’ ma na-echekwa nkwusi ike dị na μηδενός.
- source_word: ἕως οὗ
  choice: ruo mgbe
  rationale: Ọ na-egosi ókè oge iyi ahụ ga-eru.
- source_word: ἀποκτείνωμεν
  choice: anyị ga-egbu
  rationale: Ọ na-egosi ihe ha bu n’obi ime; ‘igbu’ na-enye nkọwa kpọmkwem n’etinyeghị ikpe iwu ọzọ dị ka ‘igbu ọchụ.’
- source_word: τὸν Παῦλον
  choice: Pọl
  rationale: Ọ bụ nsụgharị aha Παῦλος n’ụdị a na-eji n’Igbo.
theological_decisions:
- issue: Nsụgharị usoro iyi Ἀναθέματι ἀνεθεματίσαμεν ἑαυτοὺς
  choice: Anyị ejirila ọbụbụ ọnụ kee onwe anyị nkwa
  alternative: Anyị etinyela onwe anyị n’okpuru ọbụbụ ọnụ; Anyị ejirila iyi siri ike kee onwe anyị
  rationale: Nhọrọ a na-egosi na ọ bụ iyi mmadụ na-aṅụ nke gụnyere ọbụbụ ọnụ ga-adakwasị ya ma ọ daa iyi ahụ; ọ naghị ebubata ihe okwu ‘anathema’ bịara ịpụta n’ozizi ụka oge e mesịrị.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. ‘Ndị isi nchụàjà’ na ‘ndị okenye’ bụ okwu ndu ndị Juu; ‘atọ ihe ọ bụla ọnụ’ na-echekwa ihe oyiyi okwu Grik n’ụzọ Igbo na-aghọta.
