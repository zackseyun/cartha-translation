revisions:
- from: Ndị ikom a bịakwutere ndị isi nchụàjà na ndị okenye wee sị[a], “Anyị ejirila ọbụbụ ọnụ kee onwe anyị nkwa na anyị agaghị atọ ihe ọ bụla ọnụ ruo mgbe anyị ga-egbu Pọl.”
  to: Ndị ikom a bịakwutere ndị isi nchụàjà na ndị okenye wee sị[a], “Anyị ejirila ọbụbụ ọnụ ṅụọ iyi na anyị agaghị edetụ ihe ọ bụla ọnụ ruo mgbe anyị ga-egbu Pọl.”
  rationale: The revision makes the oath formula idiomatic in Standard Igbo while retaining its self-imprecatory severity. It also replaces a less usual expression for tasting with the natural modern expression «idetụ ... ọnụ». No doctrinal interpretation has been added.
