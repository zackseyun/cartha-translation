  source_fidelity: 'A na-ewepụta ihe ndị dị mkpa n’asụsụ Grik nke ọma: Pọl kpọrọ otu centurion, nye ya iwu ka ọ kpọga nwa okorobịa ahụ n’ebe χιλίαρχος nọ, n’ihi na nwa okorobịa ahụ nwere ihe ọ ga-akọrọ ya. Otú ọ dị, “Ya mere” na-enye δέ nkọwa kpatara omume nke na-adịghị apụta n’okwu Grik; njikọ mmegharị akụkọ dị ka “Mgbe ahụ” ka dabara. A na-emezikwa aha ọkwa centurion ka ọ ghara ịdị mgbagwoju anya na χιλίαρχος.'
