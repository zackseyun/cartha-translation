base_translation:
  language: en
  yaml_path: translation/nt/acts/023/017.yaml
  text: So Paul called one of the centurions and said[a], “Take this young man to the commander, for he has something to report to him.”
translation:
  language: ig
  text: Mgbe ahụ, Pọl kpọrọ otu n’ime ndị isi agha na-ahụ maka narị ndị agha, sị ya, “Kpọrọ nwa okorobịa a gakwuru ọchịagha ahụ, n’ihi na nwa okorobịa a nwere ihe ọ ga-akọrọ ya.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ihe ọ ga-agwa ya.” Ngwaa Grik a nwere ike ịpụta ịkọrọ mmadụ ihe, ikwupụta ya, ma ọ bụ ịgwa ya; a họọrọ “ịkọrọ” n’ihi na n’ebe a ọ na-ezisa ozi dị mkpa.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: kpọrọ
  rationale: Okwu a na-egosi na Pọl kpọrọ onye ahụ ka ọ bịakwute ya tupu ya agwa ya okwu; ‘kpọrọ’ bụ okwu Igbo doro anya ma dịkwa n'ụzọ nkịtị.
- source_word: δὲ
  choice: Ya mere
  rationale: N’ebe a δέ na-eme ka akụkọ gaa n’ihu, ọ bụghị igosi nnukwu esemokwu; ‘Ya mere’ jikọtara omume a na ihe ndị bu ya ụzọ.
- source_word: ἕνα τῶν ἑκατονταρχῶν
  choice: otu n’ime ndị ọchịagha narị ndị agha
  rationale: ἑκατοντάρχης bụ ọkwa onyeisi ndị agha Rom nke na-achị ihe dị ka otu narị ndị agha; ntụgharị a na-eme ka ọrụ ya doo onye Igbo nke oge a anya.
- source_word: ἔφη
  choice: sị ya
  rationale: φημί bụ ngwaa nkịtị e ji ewebata okwu mmadụ kwuru; ‘sị ya’ dabara n’akụkọ Igbo ma na-egosi onye a gwara okwu.
- source_word: νεανίαν
  choice: nwa okorobịa
  rationale: νεανίας na-ezo aka n’ebe nwoke na-eto eto nọ; ‘nwa okorobịa’ bụ okwu Igbo nkịtị, doro anya.
- source_word: ἄπαγε
  choice: Kpọrọ ... gakwuru
  rationale: Iwu a pụtara iduru ma ọ bụ ịkpọrọ mmadụ gaa n’ebe onye ọzọ nọ; usoro Igbo a na-egosipụta iduru ya gaa kpọmkwem.
- source_word: πρὸς τὸν χιλίαρχον
  choice: gakwuru ọchịagha ahụ
  rationale: χιλίαρχος bụ onyeisi agha dị elu, ya bụ tribune ndị Rom n’akụkọ a. ‘Ọchịagha ahụ’ dị mfe nghọta, ebe ‘ahụ’ na-egosi onyeisi a maralarị n’akụkọ ahụ.
- source_word: ἔχει γὰρ ἀπαγγεῖλαί τι αὐτῷ
  choice: n’ihi na o nwere ihe ọ ga-akọrọ ya
  rationale: Usoro ἔχει na infinitive na-egosi na o nwere ihe ọ ga-ekwu ma ọ bụ mee; ἀπαγγέλλω nwere ike ịbụ ịkọrọ, ịgwa, ma ọ bụ izisa ozi. ‘Ihe ọ ga-akọrọ ya’ dabara na iziga ozi dị mkpa n’ọnọdụ a.
