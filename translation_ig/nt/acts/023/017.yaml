translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A kọwara ọkwa ἑκατοντάρχης n’ụzọ ọrụ ya ga-esi doo anya, ma a zere okwu agha ndị Rom nke ga-adị arọ nye ọtụtụ ndị na-agụ akwụkwọ.
