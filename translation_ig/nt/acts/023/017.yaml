  to: Mgbe ahụ, Pọl kpọrọ otu n’ime ndị isi agha na-ahụ maka narị ndị agha, sị ya, “Kpọrọ nwa okorobịa a gakwuru ọchịagha ahụ, n’ihi na nwa okorobịa a nwere ihe ọ ga-akọrọ ya.”[a]
  rationale: E dochiela njikọ nke na-egosi nsonaazụ (“Ya mere”) site na njikọ mmegharị akụkọ (“Mgbe ahụ”). E meela ka aha centurion bụrụ Igbo doro anya, ma akọwapụtala onye nwere ozi ahụ site n’ikwughachi “nwa okorobịa a.” Mgbanwe ndị a anaghị agbakwunye nkọwa akụkọ ma na-echekwa ihe okwu Grik kwuru.
