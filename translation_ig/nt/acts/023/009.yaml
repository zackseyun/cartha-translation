id: ACT.23.9
reference: Acts 23:9
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐγένετο δὲ κραυγὴ μεγάλη, καὶ ἀναστάντες ⸂τινὲς τῶν γραμματέων⸃ τοῦ μέρους τῶν Φαρισαίων διεμάχοντο λέγοντες· Οὐδὲν κακὸν εὑρίσκομεν ἐν τῷ ἀνθρώπῳ τούτῳ· εἰ δὲ πνεῦμα ἐλάλησεν αὐτῷ ἢ ⸀ἄγγελος—
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/009.yaml
  text: Then a great outcry arose[a], and some of the scribes of the party of the Pharisees stood up and contended, saying, “We find nothing wrong in this man[b]. But if a spirit or an angel has spoken to him—”
translation:
  language: ig
  text: Mgbe ahụ, oke mkpu bilitere, ụfọdụ ndị odeakwụkwọ sitere n’òtù ndị Farisii biliri ma malite ịrụrịta ụka kpụ ọkụ n’ọnụ, na-ekwu, “Anyị ahụghị ihe ọjọọ ọ bụla n’ebe nwoke a nọ. Ma ọ bụrụ na mmụọ[a] ma ọ bụ mmụọ ozi agwala ya okwu—”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Mmụọ” nwekwara ike ịpụta mmụọ ma ọ bụ ihe mmụọ n’ozuzu ya. Ụfọdụ na-aghọta ya dịka “Mmụọ Nsọ,” ma ijikọta ya na “mmụọ ozi” na-akwado nghọta sara mbara n’ebe a.
    reason: alternative_reading
  - marker: b
    text: Ahịrịokwu a kwụsịrị na mberede n’ihe odide Grik.
    reason: textual_note
lexical_decisions:
- source_word: κραυγὴ μεγάλη
  choice: nnukwu mkpu
  rationale: Na-egosi oke mkpọtụ na iti mkpu nke esemokwu ahụ n’Igbo doro anya.
- source_word: ἀναστάντες
  choice: biliri ọtọ
  rationale: Na-echekwa omume anụ ahụ nke ibili iji kwuo okwu n’ọgbakọ.
- source_word: τινὲς τῶν γραμματέων
  choice: ụfọdụ ndị odeakwụkwọ
  rationale: “Ndị odeakwụkwọ” bụ okwu Igbo a na-ejikarị akọwa ndị ọkachamara n’Iwu n’ọnọdụ ndị Juu.
- source_word: τοῦ μέρους τῶν Φαρισαίων
  choice: so n’otu ndị Farisii
  rationale: Na-egosi na ha bụ ndị otu ma ọ bụ akụkụ ndị Farisii n’ime nzukọ ahụ.
- source_word: διεμάχοντο
  choice: na-arụrịta ụka ike
  rationale: Na-egosi esemokwu siri ike ma na-aga n’ihu, dịka imperfect Grik si dị.
- source_word: Οὐδὲν κακὸν εὑρίσκομεν
  choice: Anyị ahụghị ihe ọjọọ ọ bụla
  rationale: Ọ bụ ụzọ Igbo dị nkenke na nke e ji ekwu okwu n’ọnọdụ ikpe, na-enweghị ime κακόν ka ọ bụrụ naanị ajọ omume ime mmụọ.
- source_word: ἐν τῷ ἀνθρώπῳ τούτῳ
  choice: n’ime nwoke a
  rationale: Na-agbaso ihe odide ahụ kpọmkwem ma na-ezo aka n’ebe Pọl nọ.
- source_word: εἰ δὲ
  choice: Ma ọ bụrụ na
  rationale: Na-echekwa usoro nkwupụta nwere ọnọdụ na njikọ “ma” nke Grik, karịchaa ebe ahịrịokwu ahụ kwụsịrị na mberede.
- source_word: πνεῦμα
  choice: mmụọ
  rationale: Edeghị ya ka ọ bụrụ Mmụọ Nsọ; ntụnyere ya na mmụọ ozi na-akwado nghọta sara mbara nke ihe mmụọ.
- source_word: ἐλάλησεν αὐτῷ
  choice: agwala ya okwu
  rationale: Na-egosi omume ikwu okwu nke mere eme ma ka bara uru n’arụmụka ahụ.
- source_word: ἄγγελος
  choice: mmụọ ozi
  rationale: N’ọnọdụ a, ọ bụ onye ozi nke eluigwe, ọ bụghị naanị onye ozi mmadụ.
theological_decisions:
- issue: Ihe πνεῦμα pụtara mgbe e tinyere ya n’akụkụ ἄγγελος
  choice: mmụọ, n’echiche sara mbara nke ihe dị ndụ nke mmụọ
  alternative: Mmụọ Nsọ
  rationale: Ihe odide ahụ ekwughị hoo haa na ọ bụ Mmụọ Nsọ; “mmụọ ma ọ bụ mmụọ ozi” na-echekwa enweghị mkpebi doro anya nke akụkọ ahụ.
- issue: Ahịrịokwu ikpeazụ a na-emechaghị
  choice: Idowe akara ogologo (—) iji gosi na okwu ahụ kwụsịrị na mberede
  alternative: 'Ime ya ajụjụ zuru ezu: “Gịnị ma ọ bụrụ na mmụọ ma ọ bụ mmụọ ozi agwala ya okwu?”'
  rationale: SBLGNT kwụsịrị okwu ahụ n’enweghị mmezu. Ịhapụ ya otú ahụ na-echekwa esemokwu na ụdị okwu Grik kama ịgbakwunye mmechi a na-eche naanị n’uche.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke oge a ma nwee ugwu. E ji “ndị odeakwụkwọ” mee ihe dịka okwu Baịbụl a maara nke ọma maka ndị ọkachamara n’Iwu; ahịrịokwu ikpeazụ ka e hapụrụ n’enweghị mmezu iji soro ihe odide Grik.
