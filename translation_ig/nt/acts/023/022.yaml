  yaml_path: translation/nt/acts/023/022.yaml
  text: So the commander dismissed the young man[a], instructing him, “Tell no one that you have reported these things to me.”
translation:
  language: ig
  text: Ya mere, ọchịagha ahụ hapụrụ nwa okorobịa ahụ ka ọ laa, ma nye ya iwu, sị, “Agwala onye ọ bụla na ị kọọrọ m[a] ihe ndị a.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “na i mere ka m mara ihe ndị a,” ma ọ bụ, “na i kpughere m ihe ndị a.”
    reason: lexical_alternative
lexical_decisions:
- source_word: χιλίαρχος
  choice: ọchịagha
  rationale: Okwu a na-ezo aka n’otu onyeisi ndị agha Rom nwere ọkwa dị elu. “Ọchịagha” bụ okwu Igbo doro anya nke na-egosi ikike ya n’enweghị iji aha ọkwa Rom nke ọtụtụ ndị na-agụ akwụkwọ taa agaghị aghọta ngwa ngwa.
- source_word: ἀπέλυσε
  choice: hapụrụ ... ka ọ laa
  rationale: N’ebe a, onyeisi agha ahụ kwụsịrị mkparịta ụka ha ma zipụ nwa okorobịa ahụ. Okwu a dị n’Igbo nkịtị, ọ naghịkwa enye echiche na a tọhapụrụ ya n’ụlọ mkpọrọ.
- source_word: νεανίσκον
  choice: nwa okorobịa
  rationale: Ọ na-egosi nwoke ka na-eto eto. “Nwa okorobịa” bụ okwu nkwanye ùgwù, nke ndị Igbo taa na-aghọta nke ọma.
- source_word: παραγγείλας
  choice: nye ya iwu
  rationale: Nsonye a na-egosi ntụziaka siri ike sitere n’aka onye nwere ikike. “Nye ya iwu” na-eme ka ọnọdụ ọchịchị agha dị n’akụkọ a pụta ìhè.
- source_word: μηδενὶ ἐκλαλῆσαι
  choice: Agwala onye ọ bụla
  rationale: Nkebiokwu a machibidoro ya ikpughere onye ọ bụla ozi ahụ. Nsụgharị a dị nkenke ma bụrụkwa Igbo e ji ekwu okwu ugbu a.
- source_word: ἐνεφάνισας
  choice: ị kọọrọ m
  rationale: Ngwaa a pụtara ime ka onye ọzọ mara ihe, ọkachasị ịkọrọ onye nwere ikike otu okwu. “Ị kọọrọ m” dabara n’ọnọdụ nwa okorobịa ahụ wetara onyeisi agha ozi, ebe ihe odide ala peeji na-echekwa ụzọ ndị ọzọ e nwere isi ghọta ya.
- source_word: ταῦτα
  choice: ihe ndị a
  rationale: Nke a na-echekwa ụdị ọtụtụ nke okwu Grik ahụ ma na-ezo aka n’ozi niile nwa okorobịa ahụ kwuru.
- source_word: πρὸς ἐμέ
  choice: m
  rationale: Mgbe e jikọtara ya na “kọọrọ,” nnọchiaha “m” na-egosi na ozi ahụ rutere n’aka onyeisi agha, dịka πρός ἐμέ si arụ ọrụ n’ebe a.
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị mfe ma dị ugwu. Ahịrịokwu ahụ na-echekwa usoro ihe omume na ụda iwu nke ihe odide Grik. E tinyere akara [a] n’akụkụ “kọọrọ m,” ebe ọdịiche mkpụrụokwu ἐνεφάνισας dị, kama itinye ya n’akụkụ “nwa okorobịa.”
