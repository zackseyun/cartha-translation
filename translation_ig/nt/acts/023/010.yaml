- from: Mgbe nnukwu esemokwu biliri[a], onyeisi ndị agha ahụ tụrụ egwu na ha nwere ike ịdọkasị Pọl[b]. Ya mere, o nyere ndị agha iwu ka ha rịdata, napụ ya n’etiti ha n’ike, durukwa ya banye n’ụlọ ndị agha[c].
  to: Mgbe nnukwu esemokwu biliri[a], onyeisi ndị agha ahụ, n’egwu na ha nwere ike ịdọkasị Pọl[b], nyere ndị agha iwu ka ha rịdata, napụ ya n’etiti ha n’ike, ma duru ya banye n’ụlọ ndị agha[c].
  rationale: The revision removes an unnecessary explicit inference, restores the Greek participial motive in a natural Igbo form, and improves the coordinated final verb. It retains all source elements, the potential sense of the feared violence, the forceful removal, and all existing footnote anchors and notes.
