  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: πολλῆς δὲ ⸀γινομένης στάσεως ⸀φοβηθεὶς ὁ χιλίαρχος μὴ διασπασθῇ ὁ Παῦλος ὑπ’ αὐτῶν ἐκέλευσεν τὸ στράτευμα ⸀καταβὰν ἁρπάσαι αὐτὸν ἐκ μέσου αὐτῶν, ἄγειν ⸀τε εἰς τὴν παρεμβολήν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/010.yaml
  text: And when a great dispute arose[a], the commander, fearing that Paul might be torn apart by them, ordered the troops to go down, seize him from among them[c][b], and bring him into the barracks.
translation:
  language: ig
  text: Mgbe nnukwu esemokwu biliri[a], onyeisi ndị agha ahụ, n’egwu na ha nwere ike ịdọkasị Pọl[b], nyere ndị agha iwu ka ha rịdata, napụ ya n’etiti ha n’ike, ma duru ya banye n’ụlọ ndị agha[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “nnukwu nkewa” ma ọ bụ “nnukwu ọgbaaghara.” Okwu Grik στάσις nwere ike ịpụta esemokwu siri ike n’etiti ndị mmadụ, mgbe ụfọdụkwa ọ na-ezo aka n’ọgbaaghara nke ọha.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “na ha nwere ike ịdọrisị Pọl iberibe.” Nke a na-egosipụta n’ụzọ pụtara ìhè ike dị n’okwu Grik διασπασθῇ.
    reason: lexical_alternative
  - marker: c
    text: “Ụlọ ndị agha” sụgharịrị okwu Grik παρεμβολή, nke pụkwara ịpụta “ogige.” N’ebe a, ọ na-ezo aka n’ebe ndị agha Rom bi ma na-arụ ọrụ na Jeruselem.
    reason: cultural_note
lexical_decisions:
- source_word: πολλῆς ... γινομένης στάσεως
  choice: Mgbe nnukwu esemokwu biliri
  rationale: Nkebi a na-egosi ọnọdụ mere n’otu oge ahụ. “Nnukwu esemokwu” na-egosipụta πολλῆς na στάσις n’ọnọdụ a, ebe esemokwu ahụ na-akawanye njọ ma na-eru n’ọgbaaghara.
- source_word: φοβηθεὶς
  choice: tụrụ egwu
  rationale: Nke a na-egosi ihe kpaliri onyeisi ndị agha ahụ inye iwu, n’asụsụ Igbo dị mfe ma bụrụkwa nke ebumpụta ụwa.
- source_word: χιλίαρχος
  choice: onyeisi ndị agha ahụ
  rationale: Okwu Grik a na-ezo aka n’ọchịagha ndị Rom nke nọ n’ọkwa dị elu. Nhọrọ a doro onye na-agụ akwụkwọ anya ma zere iji aha ọkwa ndị Rom nke ga-achọ nkọwa ọzọ.
- source_word: μὴ διασπασθῇ ὁ Παῦλος ὑπ’ αὐτῶν
  choice: na ha nwere ike ịdọkasị Pọl
  rationale: “Nwere ike” na-echekwa echiche nke ihe onyeisi ahụ tụrụ egwu na ọ pụrụ ime, ebe “ịdọkasị” na-edobe ike na ihe egwu dị n’okwu διασπάω.
- source_word: ἐκέλευσεν
  choice: nyere ... iwu
  rationale: Nke a bụ ụzọ Igbo doro anya isi kwuo iwu e nyere n’ọnọdụ agha.
- source_word: τὸ στράτευμα
  choice: ndị agha
  rationale: Ọ na-ezo aka n’ìgwè ndị agha nọ n’okpuru iwu onyeisi ahụ; “ndị agha” bụ okwu nkịtị ma doo anya n’Igbo.
- source_word: καταβὰν
  choice: ka ha rịdata
  rationale: Ọ na-echekwa ngagharị ha si n’ebe dị elu gbadata n’ebe nzukọ ahụ nọ.
- source_word: ἁρπάσαι αὐτὸν ἐκ μέσου αὐτῶν
  choice: napụ ya n’etiti ha n’ike
  rationale: “Napụ ... n’ike” na-egosipụta mwepụ ngwa ngwa na nke ike dị na ἁρπάζω, ma “n’etiti ha” na-echekwa nkọwa ọnọdụ ahụ.
- source_word: ἄγειν τε
  choice: durukwa ya banye
  rationale: Nhọrọ a na-egosi na ndị agha ga-eduru Pọl gaa ebe a kpọrọ aha, ma jikọta omume a na iwu ndị bu ya ụzọ.
- source_word: παρεμβολήν
  choice: ụlọ ndị agha
  rationale: N’ebe a, okwu ahụ na-ezo aka n’ebe ndị agha Rom bi ma na-arụ ọrụ na Jeruselem. “Ụlọ ndị agha” na-enye nghọta ahụ nke ọma karịa “ogige,” nke pụrụ ime ka onye na-agụ ya chee maka ogige dị n’èzí obodo.
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ ahịrịokwu abụọ iji mee ka usoro ihe mere doo anya, ma njikọ “Ya mere” na-echekwa na egwu onyeisi ndị agha ahụ bụ ihe kpaliri iwu ya. E debere ike nke omume ahụ n’okwu “napụ ... n’ike,” ma e chekwara na ịdọkasị Pọl bụ naanị ihe a tụrụ egwu na ọ pụrụ ime.
