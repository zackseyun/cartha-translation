revisions:
- from: Ma Pọl matara na otu akụkụ n’ime ha bụ ndị Sadusii, akụkụ nke ọzọ abụrụ ndị Farisii. Ya mere, o tiri mkpu n’ime nzukọ ndị isi ahụ[a], sị, “Ụmụ nwoke, ụmụnna m, abụ m onye Farisii, nwa ndị Farisii[b]. Ọ bụ banyere olileanya na mbilite n’ọnwụ nke ndị nwụrụ anwụ[c] ka a na-ekpe m ikpe.”
  to: Ma Pọl, ebe ọ matara na otu akụkụ n’ime ha bụ ndị Sadusii, akụkụ nke ọzọ bụ ndị Farisii, tiri mkpu n’ime nzukọ ndị isi ahụ[a], sị, “Ndị ikom, ụmụnna, abụ m onye Farisii, nwa ndị Farisii[b]. Ọ bụ banyere olileanya na mbilite n’ọnwụ nke ndị nwụrụ anwụ[c] ka a na-ekpe m ikpe.”
  rationale: Emeziri njikọ na-adịghị n’isi Grik, mezie copula Igbo ka ọ bụrụ nke eke, wepụ possessive a gbakwụnyere n’ekele Pọl, ma dozie nkọwa c ka ọ na-anọgide na-egosi “banyere” kama ịkọwa περί dịka naanị ihe kpatara ikpe. A hapụrụ “nwa ndị Farisii” na nhazi “olileanya na mbilite n’ọnwụ” ka ha ghara ikpebi nghọta ndị Grik ka na-ahapụ ghe oghe.
