id: ACT.23.6
reference: Acts 23:6
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Γνοὺς δὲ ὁ Παῦλος ὅτι τὸ ἓν μέρος ἐστὶν Σαδδουκαίων τὸ δὲ ἕτερον Φαρισαίων ⸀ἔκραζεν ἐν τῷ συνεδρίῳ· Ἄνδρες ἀδελφοί, ἐγὼ Φαρισαῖός εἰμι, υἱὸς ⸀Φαρισαίων· περὶ ἐλπίδος καὶ ἀναστάσεως νεκρῶν ⸀ἐγὼ κρίνομαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/006.yaml
  text: But Paul[a], knowing that one part were Sadducees and the other Pharisees, cried out in the council, “Men, brothers, I am a Pharisee, a son of Pharisees[c][b]. It is concerning the hope and resurrection of the dead that I am being judged.”
translation:
  language: ig
  text: Ma Pọl, ebe ọ matara na otu akụkụ n’ime ha bụ ndị Sadusii, akụkụ nke ọzọ bụ ndị Farisii, tiri mkpu n’ime nzukọ ndị isi ahụ[a], sị, “Ndị ikom, ụmụnna, abụ m onye Farisii, nwa ndị Farisii[b]. Ọ bụ banyere olileanya na mbilite n’ọnwụ nke ndị nwụrụ anwụ[c] ka a na-ekpe m ikpe.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’ime Sanhedrin.” Okwu Grik a nwere ike izo aka kpọmkwem na nzukọ ndị isi ọchịchị ndị Juu.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “nwa nne na nna bụ ndị Farisii,” ma ọ bụ “onye sitere n’ezinụlọ ndị Farisii.”
    reason: alternative_reading
  - marker: c
    text: Ma ọ bụ, “Ọ bụ banyere olileanya nke mbilite n’ọnwụ nke ndị nwụrụ anwụ ka a na-ekpe m ikpe.”
    reason: alternative_reading
lexical_decisions:
- source_word: Γνοὺς
  choice: matara
  rationale: Okwu a na-egosi ihe Pọl ghọtara tupu o kwuo okwu; “matara” bụ ụzọ Igbo doro anya ma dị nkenke isi gosipụta nke ahụ.
- source_word: τὸ ἓν μέρος ... τὸ δὲ ἕτερον
  choice: otu akụkụ ... akụkụ nke ọzọ
  rationale: Nke a na-edobe ihe oyiyi nke akụkụ abụọ dị n’ime otu nzukọ, dịka okwu Grik si kwuo.
- source_word: Σαδδουκαίων / Φαρισαίων
  choice: ndị Sadusii / ndị Farisii
  rationale: Ndị a bụ aha a na-ejikarị akpọ òtù abụọ ndị Juu ahụ n’Igbo.
- source_word: ἔκραζεν
  choice: o tiri mkpu
  rationale: Nhọrọ a na-egosi na Pọl kwuru okwu n’olu dara ụda n’ihu ọha, ọ bụghị naanị na o kwuru ya nkịtị.
- source_word: ἐν τῷ συνεδρίῳ
  choice: n’ime nzukọ ndị isi ahụ
  rationale: Ọ na-enye onye na-agụ ya nghọta ozugbo na ọ bụ ọgbakọ ọchịchị; a hapụrụ “Sanhedrin” dịka nkọwa ọzọ n’ala peeji.
- source_word: Ἄνδρες ἀδελφοί
  choice: Ụmụ nwoke, ụmụnna m
  rationale: Nke a na-edobe akụkụ abụọ nke okwu ịkpọ ndị mmadụ nke dị na Grik, ma mee ka ọ bụrụ okwu Igbo mmadụ nwere ike ikwu n’ihu ọha.
- source_word: Φαρισαῖός εἰμι
  choice: abụ m onye Farisii
  rationale: Nke a bụ nkwupụta onwe onye n’oge dị ugbu a, dịka Grik si dị.
- source_word: υἱὸς Φαρισαίων
  choice: nwa ndị Farisii
  rationale: A na-edobe akpaalaokwu ezinụlọ na ụdị ọtụtụ nke “ndị Farisii” n’ebughị ụzọ kpebie ma ọ na-ekwu kpọmkwem banyere nne na nna ya, ndị nna nna ya, ma ọ bụ njikọ òtù.
- source_word: περὶ ἐλπίδος καὶ ἀναστάσεως νεκρῶν
  choice: banyere olileanya na mbilite n’ọnwụ nke ndị nwụrụ anwụ
  rationale: A na-edobe “olileanya” na “mbilite n’ọnwụ” dịka ihe abụọ e jikọtara na “na,” dịka Grik si hazie ha, n’emeghị ka ha bụrụ naanị otu echiche.
- source_word: κρίνομαι
  choice: a na-ekpe m ikpe
  rationale: Nke a na-egosi na ikpe Pọl ka na-aga n’oge ọ na-ekwu okwu, ma bụrụkwa okwu ikpe ụlọikpe nke doro anya n’Igbo.
theological_decisions:
- issue: Ihe “υἱὸς Φαρισαίων” pụtara
  choice: nwa ndị Farisii
  alternative: nwa nne na nna bụ ndị Farisii; onye si n’agbụrụ ndị Farisii
  rationale: Okwu Grik nwere ike ịpụta nne na nna, usoro ndị nna nna, ma ọ bụ njikọ siri ike n’òtù ahụ. Isiokwu bụ isi na-edobe akpaalaokwu ahụ n’ebughị nkọwa dị warara n’ime ya.
- issue: Mmekọrịta dị n’etiti “olileanya” na “mbilite n’ọnwụ”
  choice: olileanya na mbilite n’ọnwụ nke ndị nwụrụ anwụ
  alternative: olileanya nke mbilite n’ọnwụ nke ndị nwụrụ anwụ
  rationale: Grik ji “na” jikọta aha abụọ ahụ. Nsụgharị bụ isi na-edobe ha otu ahụ, ebe nkọwa n’ala peeji na-egosi na a pụkwara ịghọta ya dịka otu olileanya nke gbadoro ụkwụ na mbilite n’ọnwụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta, sụgharịa amaokwu a. A zere okwu pụrụ iche nke otu ụka, ma debe nghọtahie ziri ezi dị na okwu banyere “nwa ndị Farisii” na njikọ dị n’etiti olileanya na mbilite n’ọnwụ.
