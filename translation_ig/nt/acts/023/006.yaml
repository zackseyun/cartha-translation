  verdict: revise
  source_fidelity: 'Isi nsụgharị ahụ na-esochi SBLGNT nke ọma n’ozuzu ya: ọ na-edobe nkewa abụọ ahụ, olu dara ụda Pọl, njirimara ya dịka onye Farisii na nwa ndị Farisii, na njikọ na-enweghị ịkọwa nke ọma n’etiti olileanya na mbilite n’ọnwụ. Otú ọ dị, “Ya mere” na-agbakwụnye njikọ nsonaazụ nke Grik ekwughị n’ụzọ doro anya, a ga-ewepụkwa ya.'
  naturalness: “akụkụ nke ọzọ abụrụ ndị Farisii” adịghị adaba n’asụsụ Standard Igbo n’ebe a; “akụkụ nke ọzọ bụ ndị Farisii” bụ ihe okike ma kwekọọ na nkebi mbụ. “Ndị ikom, ụmụnna” na-edobe vocative abụọ ahụ n’enweghị mgbakwunye “m,” nke na-adịghị na Grik.
  terminology: Aha Sadusii, Farisii, Sanhedrin, olileanya, mbilite n’ọnwụ, na ikpe dabara adaba. “Nzukọ ndị isi ahụ” na-enye συνεδρίῳ nke ọma; nkọwa ala peeji na-echekwa nhọrọ “Sanhedrin.” Nkọwa c kwesịrị iji “banyere” kama “n’ihi,” ka ọ ghara ịgbanwe περί gaa n’ihe kpatara ya n’ụzọ siri ike.
  issues:
