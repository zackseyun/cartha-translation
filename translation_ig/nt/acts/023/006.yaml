  - severity: low
    issue: “Ụmụ nwoke, ụmụnna m”
    rationale: Possessive “m” adịghị na Ἄνδρες ἀδελφοί. “Ndị ikom, ụmụnna” na-edobe akụkụ abụọ nke ekele ahụ ma zere mgbakwunye.
  - severity: medium
    issue: Nkọwa ala peeji c ji “n’ihi” sụgharịa περί
