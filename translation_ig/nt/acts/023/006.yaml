    issue: “Ya mere”
    rationale: Okwu Grik na-ejikọta participle Γνοὺς na ἔκραζεν, ma ọ naghị etinye njikọ nsonaazụ pụrụ iche dịka “therefore/ya mere.” Mwepụ ya na-echekwa njikọ ahụ n’enweghị mgbakwunye.
  - severity: medium
