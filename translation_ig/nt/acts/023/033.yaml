  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οἵτινες εἰσελθόντες εἰς τὴν Καισάρειαν καὶ ἀναδόντες τὴν ἐπιστολὴν τῷ ἡγεμόνι παρέστησαν καὶ τὸν Παῦλον αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/033.yaml
  text: When they entered Caesarea and delivered the letter to the governor[b][a], they also presented Paul to him.
translation:
  language: ig
  text: Mgbe ha banyere na Sesaria ma nye gọvanọ ahụ akwụkwọ ozi ahụ, ha kpọbatakwara Pọl n’ihu ya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ha kpọpụtara Pọl n’ihu ya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἵτινες
  choice: ha
  rationale: Ọ na-ezo aka n’òtù ndị agha kpọ Pọl site n’amaokwu bu ụzọ; ‘ha’ bụ ụzọ Igbo si kwuo ya n’ụzọ doro anya ma dị mfe.
- source_word: εἰσελθόντες
  choice: mgbe ha banyere
  rationale: Nkebiokwu oge a na-egosi na mbata ha na Sesaria mere tupu omume ndị bụ isi sochirinụ.
- source_word: Καισάρειαν
  choice: Sesaria
  rationale: Nke a bụ nsụgharị mkpụrụokwu aha obodo ahụ nke a na-ejikarị n’Igbo.
- source_word: ἀναδόντες
  choice: nye
  rationale: N’ebe a, okwu ahụ pụtara inyefe akwụkwọ ozi n’aka onye ọchịchị; ‘nye’ bụ okwu Igbo doro anya ma kwekọọ n’ọnọdụ ahụ.
- source_word: ἐπιστολήν
  choice: akwụkwọ ozi
  rationale: Nke a bụ okwu Igbo nkịtị na nke ziri ezi maka ozi e dere ede.
- source_word: ἡγεμόνι
  choice: gọvanọ ahụ
  rationale: Ọ na-ezo aka n’onye ọchịchị ógbè Rom, ya bụ Feliks; ‘gọvanọ’ bụ okwu a na-aghọta nke ọma n’Igbo ugbu a.
- source_word: παρέστησαν
  choice: kpọnyekwara ... n’ihu
  rationale: N’ọnọdụ iwu na ọchịchị a, okwu ahụ pụtara ịkpọbata mmadụ ka o guzoro n’ihu onye ọchịchị; ntụgharị a na-edobe echiche ahụ n’Igbo eke.
- source_word: καὶ
  choice: kwara
  rationale: Mgbakwunye ‘-kwara’ na-egosi na, e wezụga inye akwụkwọ ozi ahụ, ha kpọnyekwara Pọl n’ihu gọvanọ.
- source_word: Παῦλον
  choice: Pọl
  rationale: Nke a bụ ụdị aha Παῦλος a na-ejikarị n’Igbo.
- source_word: αὐτῷ
  choice: n’ihu ya
  rationale: Nnọchiaha a na-ezo aka n’ebe gọvanọ nọ; ya na ‘kpọnye n’ihu’ na-enye okwu Igbo zuru oke.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị ugbu a, dị ugwu ma dị mfe nghọta. A họọrọ ‘kpọnyekwara Pọl n’ihu ya’ iji gosipụta ọnọdụ ọchịchị na ikpe dị na παρέστησαν, ebe nkọwa ala peeji na-edobe ụzọ ọzọ nke na-akấnye echiche inyefe mmadụ n’aka onye ọchịchị.
