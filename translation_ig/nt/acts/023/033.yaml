  to: Mgbe ha banyere na Sesaria ma nye gọvanọ ahụ akwụkwọ ozi ahụ, ha kpọbatakwara Pọl n’ihu ya.[a]
  rationale: The revised wording retains the source sequence and additive force of καί while using a natural formal Igbo expression for presenting Paul before the governor. The footnote has been replaced with a genuine alternative that does not add the unsupported idea of handing Paul over.
