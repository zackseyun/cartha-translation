id: ACT.23.12
reference: Acts 23:12
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Γενομένης δὲ ἡμέρας ποιήσαντες ⸂συστροφὴν οἱ Ἰουδαῖοι⸃ ἀνεθεμάτισαν ἑαυτοὺς λέγοντες μήτε φαγεῖν μήτε πιεῖν ἕως οὗ ἀποκτείνωσιν τὸν Παῦλον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/012.yaml
  text: When day came[a], the Jews formed a conspiracy and bound themselves under a curse[b], saying that they would neither eat nor drink until they had killed Paul.
translation:
  language: ig
  text: Mgbe chi bọrọ, ndị Juu[a] gbakọrọ gbaa izu, wee tinye onwe ha n’okpuru ọbụbụ ọnụ[b], na-asị na ha agaghị eri ihe ma ha agaghịkwa aṅụ ihe ọ bụla ruo mgbe ha gburu Pọl.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’asụsụ Grik, e dere “ndị Juu.” N’ebe a, okwu ahụ na-ezo aka n’otu ìgwè kpọmkwem n’etiti ndị Juu sonyere n’izu ọjọọ a, ọ bụghị ndị Juu niile.
    reason: cultural_note
  - marker: b
    text: A pụkwara ịsụgharị ya, “were ọbụbụ ọnụ kee onwe ha.” Nke a bụ nkwa ha ji aka ha mee, nke ha kpọkuru ikpe ka ọ dakwasị ha ma ọ bụrụ na ha emezughị ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: Γενομένης δὲ ἡμέρας
  choice: Mgbe chi bọrọ
  rationale: Nkebiokwu a na-egosi mgbanwe oge. “Mgbe chi bọrọ” bụ ụzọ Igbo dị ndụ ma doo anya isi kwuo na ụbọchị abịala.
- source_word: ποιήσαντες συστροφὴν
  choice: gbakọrọ gbaa izu
  rationale: N’ebe a, okwu ahụ na-egosi na ha jikọtara aka hazie atụmatụ nzuzo. “Gbakọrọ gbaa izu” na-egosipụta ma njikọ aka ha ma ebumnuche izu ọjọọ ahụ, na-enweghị ime ka ọ bụrụ naanị ìgwè ọgba aghara.
- source_word: οἱ Ἰουδαῖοι
  choice: ndị Juu
  rationale: Nke a na-agbaso aha doro anya dị n’ihe odide Grik. Ihe e dere n’ala ala peeji na-akọwa na n’ọnọdụ a ọ bụ otu ìgwè kpọmkwem n’etiti ndị Juu, ọ bụghị ndị Juu niile.
- source_word: ἀνεθεμάτισαν ἑαυτοὺς
  choice: tinye onwe ha n’okpuru ọbụbụ ọnụ
  rationale: Ngwaa ahụ pụtara na ha ji ọbụbụ ọnụ kee onwe ha n’ihe ha kwere ime, ka ikpe dakwasị ha ma ha mebie nkwa ahụ. Nhọrọ a na-echekwa ma echiche ọbụbụ ọnụ ma ike nkwa ahụ.
- source_word: λέγοντες μήτε φαγεῖν μήτε πιεῖν
  choice: na-asị na ha agaghị eri ihe ma ha agaghịkwa aṅụ ihe ọ bụla
  rationale: 'Ụdị a bụ Igbo nkịtị nke na-echekwa njikọ mmegide abụọ ahụ: ha agaghị eri, ha agaghịkwa aṅụ.'
- source_word: ἕως οὗ ἀποκτείνωσιν τὸν Παῦλον
  choice: ruo mgbe ha gburu Pọl
  rationale: Nkebiokwu a na-egosi ihe ga-eme tupu mmachibido iri na ịṅụ akwụsị. Ụdị Igbo a dị nkenke ma na-edobe igbu Pọl dịka njedebe ha tinyere ná nkwa ahụ.
theological_decisions: []
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. “Gbakọrọ gbaa izu” na-enye echiche nke njikọ aka nzuzo, ebe “tinye onwe ha n’okpuru ọbụbụ ọnụ” na-echekwa ike okwu Grik n’enweghị okwu ụka pụrụ iche ma ọ bụ nkọwa otu okwukwe.
