- from: Ọ sịrị, “M ga-anụ okwu ikpe gị[a] mgbe ndị na-ebo gị ebubo bịakwara.” O wee nye iwu ka e debe ya n'okpuru nche n'ụlọ ọchịchị Herọd.[b]
  to: Ọ sịrị, “M ga-anụ okwu ikpe gị[a] mgbe ndị na-ebo gị ebubo bịakwara.” O nyekwara iwu ka e debe ya n’ụlọ praetọrịọm Herọd n'okpuru nche.[b]
  rationale: The revision retains the draft’s accurate legal idiom while replacing the overly broad rendering of πραιτώριον with a transliterated historical-administrative term. The footnote supplies the necessary explanation without narrowing the term beyond the Greek. Footnote [a] has been made more idiomatic and avoids making the debated ‘fully’ nuance mandatory in the main translation.
