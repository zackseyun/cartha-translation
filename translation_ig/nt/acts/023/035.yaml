  register: E ji Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta. E tinyere akara ala peeji [a] ozugbo n'akụkụ okwu gbasara ịnụ ikpe, ebe [b] dị n'akụkụ aha ụlọ ọchịchị ọ na-akọwa.
