  text: Διακούσομαί σου, ἔφη, ὅταν καὶ οἱ κατήγοροί σου παραγένωνται· ⸀κελεύσας ἐν τῷ πραιτωρίῳ ⸀τοῦ Ἡρῴδου φυλάσσεσθαι ⸀αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/035.yaml
  text: “I will hear your case,” he said[b][a], “when your accusers also arrive.” And he ordered that he be kept under guard in Herod’s praetorium.
translation:
  language: ig
  text: Ọ sịrị, “M ga-anụ okwu ikpe gị[a] mgbe ndị na-ebo gị ebubo bịakwara.” O nyekwara iwu ka e debe ya n’ụlọ praetọrịọm Herọd n'okpuru nche.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “M ga-anụcha okwu gị.” Ngwaa Grik ahụ pụrụ ịpụta ige mmadụ ntị ruo n'ọgwụgwụ; n'ọnọdụ ikpe a, “ịnụ okwu ikpe gị” na-egosi ihe a na-ekwu.
    reason: lexical_alternative
  - marker: b
    text: “Ụlọ praetọrịọm” bụ ụlọ obibi ma ọ bụ isi ụlọ ọrụ gọvanọ Rom; n'ebe a, o nwere ike ịbụ obí Herọd dị na Sesaria.
    reason: cultural_note
lexical_decisions:
- source_word: Διακούσομαί σου
  choice: M ga-anụ okwu ikpe gị
  rationale: διακούω n'ọnọdụ ikpe a pụtara ịnụ onye a na-ekpe ikpe ma ọ bụ okwu ikpe ya nke ọma ruo n'ókè kwesịrị ekwesị. ‘Ịnụ okwu ikpe gị’ bụ ụzọ Igbo si ekwu ya n'ụzọ iwu ma ghara ịgbakwunye mkpebi na-adịghị na Grik.
- source_word: ὅταν καὶ οἱ κατήγοροί σου παραγένωνται
  choice: mgbe ndị na-ebo gị ebubo bịakwara
  rationale: ὅταν tinyere subjunctive na-egosi ihe a na-atụ anya n'ọdịnihu; καί na-egosi na ndị na-ebo ebubo ga-abịakwa, παραγίνομαι pedigokwa ‘ịbịa/ịrutere.’
- source_word: κελεύσας
  choice: O wee nye iwu
  rationale: A tụgharịrị participle aorist ahụ ka ọ bụrụ ngwaa zuru ezu iji mee ka akụkọ ahụ daa nke ọma n'Igbo ma chekwaa usoro ihe ndị mere.
- source_word: ἐν τῷ πραιτωρίῳ τοῦ Ἡρῴδου
  choice: n'ụlọ ọchịchị Herọd
  rationale: πραιτώριον bụ ụlọ obibi ma ọ bụ isi ụlọ ọrụ gọvanọ Rom. ‘Ụlọ ọchịchị’ na-enye onye Igbo nghọta ọrụ ụlọ ahụ, ebe nkọwa ala peeji na-akọwa ọnọdụ ya kpọmkwem.
- source_word: φυλάσσεσθαι αὐτόν
  choice: ka e debe ya n'okpuru nche
  rationale: Passive infinitive ahụ na-egosi idebe Pọl n'aka ndị nche; okwu a anaghị eme ka ọ bụrụrịrị ntaramahụhụ ụlọ mkpọrọ.
