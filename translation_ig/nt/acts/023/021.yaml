id: ACT.23.21
reference: Acts 23:21
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: σὺ οὖν μὴ πεισθῇς αὐτοῖς, ἐνεδρεύουσιν γὰρ αὐτὸν ἐξ αὐτῶν ἄνδρες πλείους τεσσεράκοντα, οἵτινες ἀνεθεμάτισαν ἑαυτοὺς μήτε φαγεῖν μήτε πιεῖν ἕως οὗ ἀνέλωσιν αὐτόν, καὶ νῦν ⸂εἰσιν ἕτοιμοι⸃ προσδεχόμενοι τὴν ἀπὸ σοῦ ἐπαγγελίαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/021.yaml
  text: So do not be persuaded by them, for more than forty men from among them are lying in ambush for him, who have bound themselves under a curse neither to eat nor to drink until they have killed him. And now they are ready, waiting for the promise from you.
translation:
  language: ig
  text: Ya mere, ekwela ka ha mee ka i kweta n'ihe ha na-arịọ, n'ihi na ndị ikom karịa iri anọ si n'etiti ha na-eche ya n'ebe zoro ezo ka ha wakpo ya. Ha ejirila ọbụbụ ọnụ[a] kee onwe ha ka ha ghara iri ihe ọ bụla ma ọ bụ ṅụọ ihe ọ bụla ruo mgbe ha gburu ya. Ugbu a, ha dị njikere, na-eche nkwa ga-esi n'aka gị[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ha ejirila iyi kee onwe ha”; okwu Grik a gụnyere echiche nke ịkpọ ọbụbụ ọnụ dakwasị onwe ha ma ọ bụrụ na ha emezughị ihe ha kwere.
    reason: lexical_alternative
  - marker: b
    text: Ya bụ, ha na-eche ka i kweta n'arịrịọ ha ma ọ bụ nye ha ikike.
    reason: lexical_alternative
lexical_decisions:
- source_word: πεισθῇς
  choice: ekwela ka ha mee ka i kweta n'ihe ha na-arịọ
  rationale: Na-egosipụta iwu a jụrụ ajụ nke ngwaa passive ahụ—ka arịrịọ ha ghara ime ka onyeisi agha kwenye—n'Igbo doro anya.
- source_word: ἐνεδρεύουσιν
  choice: na-echere ya n'ebe zoro ezo ka ha wakpo ya
  rationale: Na-echekwa echiche doro anya nke izobe onwe ha na nchere iji wakpo mmadụ, kama ịsụgharị ya naanị dị ka ịgba izu.
- source_word: ἐξ αὐτῶν
  choice: si n'etiti ha
  rationale: Na-egosi na ndị ikom ahụ sitere n'ime ìgwè ahụ a kpọtụrụ aha.
- source_word: ἄνδρες πλείους τεσσεράκοντα
  choice: ihe karịrị ndị ikom iri anọ
  rationale: Nsụgharị Igbo kwụ ọtọ nke ọnụ ọgụgụ ahụ na ntụnyere ya.
- source_word: ἀνεθεμάτισαν ἑαυτοὺς
  choice: etinyela onwe ha n'okpuru ọbụbụ ọnụ
  rationale: Na-echekwa ma nkwa siri ike ahụ ma echiche nke ọbụbụ ọnụ ha kpọkwasịrị onwe ha ma ọ bụrụ na ha emezughị ya.
- source_word: μήτε φαγεῖν μήτε πιεῖν
  choice: ha agaghị eri ihe ma ọ bụ ṅụọ ihe ọ bụla
  rationale: Na-enye usoro mmachibido abụọ ahụ n'Igbo eke ma doo anya.
- source_word: ἕως οὗ ἀνέλωσιν αὐτόν
  choice: ruo mgbe ha gburu ya
  rationale: ἀναιρέω n'ọnọdụ a pụtara igbu mmadụ; ahịrịokwu ahụ na-edobe ebumnobi ha n'ọdịnihu.
- source_word: εἰσιν ἕτοιμοι
  choice: ha adịla njikere
  rationale: Nsụgharị dị mkpirikpi ma bụrụ nke Igbo eke.
- source_word: προσδεχόμενοι
  choice: na-eche
  rationale: Na-egosipụta nchere nwere atụmanya.
- source_word: τὴν ἀπὸ σοῦ ἐπαγγελίαν
  choice: nkwa ga-esi n'aka gị
  rationale: Na-edobe okwu nkịtị 'nkwa' na isi ya sitere n'aka onyeisi agha, ebe nkọwa ala peeji na-akọwa ihe ọ pụtara n'ọnọdụ a.
theological_decisions: []
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji nkọwa 'n'ebe zoro ezo ka ha wakpo ya' mee ka ihe oyiyi nke ambush pụta ìhè; e debere 'nkwa' n'ahịrị bụ isi ma kọwaa ihe ọ pụtara n'ọnọdụ a n'ala peeji.
