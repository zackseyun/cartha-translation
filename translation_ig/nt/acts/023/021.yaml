  verdict: revise
  source_fidelity: 'N''ụzọ ka ukwuu, ederede ahụ na-esochi Grik nke ọma: ọ na-edobe ịdọ aka ná ntị ka ọ ghara ikwere arịrịọ ha, ndị ikom karịrị iri anọ nọ nzo, iyi nke nwere ọbụbụ ọnụ, mmachi iri na ịṅụ, na nchere nkwa onyeisi agha. Otú ọ dị, «ihe karịrị ndị ikom iri anọ» abụghị usoro Igbo kacha kwụ ọtọ maka ‘more than forty men.’'
  naturalness: Asụsụ ahụ dị mfe nghọta ma dabara na Standard Igbo. A ga-eme ka ọnụọgụ ahụ bụrụ «ndị ikom karịa iri anọ», ma kwuo nkwa ọbụbụ ọnụ ahụ n’ụzọ Igbo na-egosi nke ọma na ha ji ọbụbụ ọnụ kee onwe ha.
