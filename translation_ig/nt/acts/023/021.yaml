revisions:
- from: Ya mere, ekwela ka ha mee ka i kweta n'ihe ha na-arịọ, n'ihi na ihe karịrị ndị ikom iri anọ si n'etiti ha na-echere ya n'ebe zoro ezo ka ha wakpo ya. Ha etinyela onwe ha n'okpuru ọbụbụ ọnụ[a] na ha agaghị eri ihe ma ọ bụ ṅụọ ihe ọ bụla ruo mgbe ha gburu ya. Ugbu a, ha adịla njikere, na-eche nkwa ga-esi n'aka gị[b].
  to: Ya mere, ekwela ka ha mee ka i kweta n'ihe ha na-arịọ, n'ihi na ndị ikom karịa iri anọ si n'etiti ha na-eche ya n'ebe zoro ezo ka ha wakpo ya. Ha ejirila ọbụbụ ọnụ[a] kee onwe ha ka ha ghara iri ihe ọ bụla ma ọ bụ ṅụọ ihe ọ bụla ruo mgbe ha gburu ya. Ugbu a, ha dị njikere, na-eche nkwa ga-esi n'aka gị[b].
