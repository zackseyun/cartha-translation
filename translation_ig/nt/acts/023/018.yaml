translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E debere usoro akụkọ ahụ n’ụdị eke n’Igbo, ma zere okwu agha Rom nke ga-esiri ọtụtụ ndị ike ma kọwaa ya n’ala peeji.
