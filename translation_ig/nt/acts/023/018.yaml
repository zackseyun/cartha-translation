  text: ὁ μὲν οὖν παραλαβὼν αὐτὸν ἤγαγεν πρὸς τὸν χιλίαρχον καὶ φησίν· Ὁ δέσμιος Παῦλος προσκαλεσάμενός με ἠρώτησεν τοῦτον τὸν ⸀νεανίαν ἀγαγεῖν πρὸς σέ, ἔχοντά τι λαλῆσαί σοι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/018.yaml
  text: So he took him and brought him to the commander and said[a], “The prisoner Paul called me to him and asked me to bring this young man to you[b], because he has something to say to you.”
translation:
  language: ig
  text: Ya mere, onye agha ahụ kpọọrọ ya duga ya n’ebe ọchịagha nọ wee sị, “Pọl onye mkpọrọ kpọrọ m ka m bịakwute ya, rịọkwa m ka m kpọta nwa okorobịa a n’ebe ị nọ, n’ihi na o nwere ihe ọ ga-agwa gị.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Okwu Grik a sụgharịrị “ọchịagha” bụ χιλίαρχος, ya bụ, onyeisi agha Rom; a na-akpọkwa ya “tribune.”
    reason: cultural_note
lexical_decisions:
- source_word: παραλαβὼν αὐτὸν ἤγαγεν
  choice: kpọọrọ ya gaa n’ihu
  rationale: Nkebi a na-egosi na onyeisi ndị agha ahụ duuru nwa okorobịa ahụ gaa ebe ọchịagha nọ; ‘kpọọrọ ... gaa n’ihu’ bụ okwu Igbo doro anya maka iduru mmadụ bịakwute onye nọ n’ọkwa.
- source_word: χιλίαρχον
  choice: ọchịagha
  rationale: Ọ bụ onyeisi ndị agha Rom nọ n’ọkwa dị elu. ‘Ọchịagha’ bụ okwu Igbo dị mfe ma ghara iji aha ọkwa Rom nke ọtụtụ ndị na-agụ akwụkwọ agaghị aghọta; nkọwa dị n’ala peeji na-akọwa ya.
- source_word: φησίν
  choice: wee sị
  rationale: Ọ bụ historical present n’asụsụ Grik, ma n’akụkọ Igbo, oge gara aga ‘wee sị’ na-aga nke ọma ma debe usoro akụkọ ahụ.
- source_word: δέσμιος
  choice: onye mkpọrọ
  rationale: N’ebe a, okwu ahụ pụtara onye e ji eji ma ọ bụ onye nọ n’okpuru nche; ‘onye mkpọrọ’ bụ okwu Igbo nkịtị ma doo anya.
- source_word: προσκαλεσάμενός με
  choice: kpọrọ m ka m bịakwute ya
  rationale: Nke a na-egosi na Pọl kpọrọ onyeisi ndị agha ahụ ka ọ bịakwute ya; nsụgharị a na-eme ka ụzọ ọkpụkpọ ahụ doo anya.
- source_word: ἠρώτησεν
  choice: rịọkwa m
  rationale: Ἐρωτάω n’ebe a bụ arịrịọ, ọ bụghị ịjụ ajụjụ; ‘rịọkwa m’ na-egosipụta nke ahụ nke ọma.
- source_word: νεανίαν
  choice: nwa okorobịa
  rationale: Okwu a na-ezo aka n’ nwoke na-eto eto; ‘nwa okorobịa’ bụ okwu Igbo eke ma doro anya.
- source_word: ἔχοντά τι λαλῆσαί σοι
  choice: o nwere ihe ọ chọrọ ịgwa gị
  rationale: Nkebi participle a na-akọwa nwa okorobịa ahụ na ihe mere e ji kpọta ya. Nsụgharị a bụ Igbo eke ma debe isi echiche na o nwere ihe ọ ga-agwa ọchịagha ahụ.
