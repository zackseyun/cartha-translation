revisions:
- from: Pọl wee sị, “Ụmụnna m, amaghị m na ọ bụ nnukwu onye nchụàjà; n’ihi na e dere ya, sị, ‘Ekwula okwu ọjọọ banyere onye na-achị ndị gị.’[a]”
  to: Pọl wee sị, “Ụmụnna m, amaghị m na ọ bụ onyeisi nchụàjà; n’ihi na e dere, sị, ‘Ekwula okwu ọjọọ banyere onye na-achị ndị gị.’[a]”
  rationale: The revision distinguishes the high priest’s specific office, makes the conventional Scripture-citation formula idiomatic and source-faithful, and supplies a footnote alternative that more accurately reflects “revile/speak abusively” without narrowing the main text.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T09:22:33Z'
review_pass:
  verdict: revise
  source_fidelity: The draft conveys Paul's denial of knowledge, his address to the council, the citation formula, and the prohibition. However, “nnukwu onye nchụàjà” can mean a great/important priest rather than the established office of ἀρχιερεύς; “onyeisi nchụàjà” identifies the high-priestly office more precisely. The impersonal perfect citation formula is more faithfully and naturally expressed as “e dere, sị,” without the unnecessary object “ya.”
  naturalness: The wording is generally clear Standard Igbo. “Pọl wee sị” and “Ụmụnna m, amaghị m” are natural in a formal narrative. “E dere, sị” is smoother than “e dere ya, sị.”
  terminology: Use “onyeisi nchụàjà” for “high priest,” an established ecclesial/historical title without adding interpretation. “Ndị gị” suitably renders “your people.” The alternative footnote should retain the sense of abusive/reviling speech rather than potentially implying a curse.
  issues:
  - severity: medium
    issue: The high-priest title is rendered “nnukwu onye nchụàjà.”
    rationale: This may be understood descriptively as “a great priest” and does not consistently mark the specific office denoted by ἀρχιερεύς. “Onyeisi nchụàjà” is more precise and natural for the office.
  - severity: low
    issue: The citation formula reads “e dere ya, sị.”
    rationale: The Greek γέγραπται is impersonal (“it is written”). In Igbo, “e dere, sị” preserves that formula naturally; “ya” is unnecessary and can sound as though a particular object has just been mentioned.
  - severity: low
    issue: The footnote alternative “Akọchala” is semantically less exact.
    rationale: It can suggest cursing rather than speaking abusively or reviling. “Ekwula okwu mkparị banyere ...” better represents the lexical alternative while retaining the quoted command’s scope.
  revised_text: Pọl wee sị, “Ụmụnna m, amaghị m na ọ bụ onyeisi nchụàjà; n’ihi na e dere, sị, ‘Ekwula okwu ọjọọ banyere onye na-achị ndị gị.’[a]”
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “Ekwula okwu mkparị banyere onye na-achị ndị gị.”
    reason: lexical_alternative
  revision_rationale: The revision distinguishes the high priest’s specific office, makes the conventional Scripture-citation formula idiomatic and source-faithful, and supplies a footnote alternative that more accurately reflects “revile/speak abusively” without narrowing the main text.
