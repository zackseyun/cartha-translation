  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἔφη τε ὁ Παῦλος· Οὐκ ᾔδειν, ἀδελφοί, ὅτι ἐστὶν ἀρχιερεύς· γέγραπται γὰρ ⸀ὅτι Ἄρχοντα τοῦ λαοῦ σου οὐκ ἐρεῖς κακῶς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/005.yaml
  text: And Paul said, “I did not know, brothers, that he is the high priest; for it is written, ‘You shall not speak evil of a ruler of your people.’”
translation:
  language: ig
  text: Pọl wee sị, “Ụmụnna m, amaghị m na ọ bụ onyeisi nchụàjà; n’ihi na e dere, sị, ‘Ekwula okwu ọjọọ banyere onye na-achị ndị gị.’[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Ekwula okwu mkparị banyere onye na-achị ndị gị.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφη τε
  choice: Pọl wee sị
  rationale: ‘Wee’ na-egosi njikọ akụkọ dị nro nke τέ, ebe ‘sị’ na-ewebata okwu Pọl kwuru kpọmkwem.
- source_word: Οὐκ ᾔδειν
  choice: amaghị m
  rationale: Nke a bụ ụzọ Igbo nkịtị ma doo anya isi kwuo na Pọl enweghị ihe ọmụma ahụ.
- source_word: ἀδελφοί
  choice: Ụmụnna m
  rationale: Ọ bụ okwu a na-eji akpọ ụmụ nwoke ibe mmadụ ma ọ bụ ndị otu ya; n’ọnọdụ a Pọl na-agwa ndị kansụl ahụ okwu.
- source_word: ὅτι ἐστὶν ἀρχιερεύς
  choice: na ọ bụ nnukwu onye nchụàjà
  rationale: ‘Ọ bụ’ na-anọchi ọnọdụ dị ugbu a nke ἐστίν n’ụzọ Igbo si ekwu ya, ebe ‘nnukwu onye nchụàjà’ na-egosi ọkwa ahụ.
- source_word: γέγραπται γὰρ
  choice: n’ihi na e dere ya, sị
  rationale: Nke a na-echekwa usoro e ji ewebata ihe e dere n’Akwụkwọ Nsọ, ma na-ada ka Igbo dị ndụ.
- source_word: Ἄρχοντα
  choice: onye na-achị
  rationale: Nhọrọ a na-egosi onye ọchịchị n’ozuzu ya n’enweghị itinye nkọwa ọzọ n’ihe Grik kwuru.
- source_word: τοῦ λαοῦ σου
  choice: ndị gị
  rationale: Nke a bụ ụzọ Igbo dị nkenke ma bụrụ nke ebumpụta ụwa isi kwuo λαός σου, ya bụ ndị mmadụ onye ahụ so na ha.
- source_word: οὐκ ἐρεῖς κακῶς
  choice: Ekwula okwu ọjọọ banyere
  rationale: Future indicative ahụ na-arụ ọrụ dịka iwu machibidoro omume; okwu a na-edobe obosara kaκῶς ma ghara ime ka ọ pụta naanị dịka ịkọcha.
theological_decisions:
- issue: Ma a ga-asụgharị ἀδελφοί n’ụzọ gụnyere nwoke na nwanyị
  choice: Ụmụnna m
  alternative: Ụmụnna nwoke na ụmụnna nwanyị
  rationale: N’ebe a Pọl na-agwa òtù ọchịchị ndị nwoke okwu; ‘Ụmụnna m’ kwekọrọ n’okwu Grik ma bụrụkwa okwu Igbo kwesịrị ekwesị.
- issue: Otu e si ewebata ihe Pọl hotara n’Akwụkwọ Nsọ
  choice: n’ihi na e dere ya, sị
  alternative: n’ihi na Akwụkwọ Nsọ kwuru, sị
  rationale: Nhọrọ a na-echekwa usoro passive zuru oke γέγραπται ma ghara ịgbakwunye ‘Akwụkwọ Nsọ’ n’ahịrị ebe Grik ekwughị ya kpọmkwem.
- issue: Ma a ga-edobe oge dị ugbu a na ἐστὶν
  choice: na ọ bụ nnukwu onye nchụàjà
  alternative: na ọ bụ ya bụ nnukwu onye nchụàjà n’oge ahụ
  rationale: Igbo ‘ọ bụ’ na-edobe ihe Grik kwuru n’enweghị ịgbanwe ya ka ọ bụrụ naanị ọnọdụ gara aga ma ọ bụ ịkọwa ihe mere Pọl ji kwuo ya.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A zere okwu ochie na nkọwa ụka pụrụ iche. Akara [a] dị n’isiokwu ahụ ma na-enye ụzọ ọzọ siri ike maka κακῶς.
