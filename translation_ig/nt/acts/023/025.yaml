  yaml_path: translation/nt/acts/023/025.yaml
  text: He wrote a letter having this form:[a]
translation:
  language: ig
  text: O wee dee akwụkwọ ozi n’ụdị a:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n’ụzọ Igbo eke karịa, “O wee dee akwụkwọ ozi dịka ndị a.”
    reason: lexical_alternative
lexical_decisions:
- source_word: γράψας
  choice: O dekwara
  rationale: Ọ bụ aorist participle nke γράφω. N’Igbo, iji ngwaa zuru ezu na njikọ “-kwara” na-eme ka akụkọ na-aga nke ọma ma jikọta omume a na ihe onye ahụ mere n’amaokwu gara aga.
- source_word: ἐπιστολήν
  choice: akwụkwọ ozi
  rationale: Nke a bụ okwu Igbo doro anya ma bụrụkwa nke a na-ejikarị eme ihe maka ozi e dere ede; ọ ka kwekọọ n’akụkọ a karịa okwu ụka pụrụ iche.
- source_word: ἔχουσαν
  choice: nke dị
  rationale: Ọ na-akọwa akwụkwọ ozi ahụ. “Nke dị” na-enye Igbo eke maka echiche nke akwụkwọ ozi ahụ nwere ụdị a, n’enweghị ịgbasa ihe okwu Grik kwuru.
- source_word: τύπον
  choice: ụdị
  rationale: τύπος n’ebe a nwere ike ịpụta ọdịdị, usoro, ma ọ bụ mkpụrụokwu akwụkwọ ozi ahụ. “Ụdị” na-edobe obosara na ntakịrị mgbagwoju anya nke okwu Grik ahụ.
- source_word: τοῦτον
  choice: a
  rationale: Ihe ngosi a na-atụ aka n’ihu, n’ihe e dere n’amaokwu ndị na-esote. “A” bụ ụzọ Igbo ziri ezi isi gosi ya.
theological_decisions: []
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta. E debere “ụdị” iji ghara ime ka τύπος bụrụ naanị ‘mkpụrụokwu’ ma ọ bụ naanị ‘ihe dị n’ime’ akwụkwọ ozi ahụ.
