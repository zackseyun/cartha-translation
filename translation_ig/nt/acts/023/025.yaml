- from: O dekwara akwụkwọ ozi nke dị n’ụdị a:[a]
  to: O wee dee akwụkwọ ozi n’ụdị a:[a]
  rationale: The revision removes the unsupported additive sense in «dekwara» and uses a natural narrative equivalent for the participle. «n’ụdị a» closely represents τὸν τύπον τοῦτον and appropriately introduces the letter that follows. The footnote offers an idiomatic content-oriented alternative without making it the sole interpretation in the main text.
