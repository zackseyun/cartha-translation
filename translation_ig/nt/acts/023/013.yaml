revisions:
- from: Ndị ahụ gbara izu ọjọọ a karịrị mmadụ iri anọ.[a]
  to: Ndị gbara izu ọjọọ a dị ihe karịrị mmadụ iri anọ.[a]
  rationale: The revision preserves every element of the Greek while using the more idiomatic Igbo expression for a group numbering more than forty. Removing “ahụ” also allows the substantival participle to stand naturally as “those who had formed,” without adding demonstrative emphasis beyond what is needed.
