  text: ἦσαν δὲ πλείους τεσσεράκοντα οἱ ταύτην τὴν συνωμοσίαν ⸀ποιησάμενοι·
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/013.yaml
  text: There were more than forty who had formed this conspiracy[a].
translation:
  language: ig
  text: Ndị gbara izu ọjọọ a dị ihe karịrị mmadụ iri anọ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “karịa mmadụ iri anọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πλείους τεσσεράκοντα
  choice: karịrị mmadụ iri anọ
  rationale: Nkebiokwu ntụnyere a na-egosi na ọnụ ọgụgụ ha gafere iri anọ. Ịtinye “mmadụ” na-eme ka Igbo bụrụ nke doro anya ma bụrụkwa nke e ji ekwu okwu n'ụzọ nkịtị, n’agbanyeghị na Grik ekwughị aha ahụ kpọmkwem.
- source_word: συνωμοσίαν
  choice: izu ọjọọ
  rationale: “Izu ọjọọ” bụ okwu Igbo doro anya maka nkwekọrịta nzuzo e mere iji mee ihe ọjọọ; ọ dabara n’ọnọdụ a n’etinyeghị nkọwa banyere iyi iyi nke okwu a n’onwe ya na-ekwughị.
- source_word: ποιησάμενοι
  choice: gbara
  rationale: N’Igbo, a na-ejikọta “ịgba” na “izu” n’ụzọ ebumpụta ụwa iji gosipụta imepụta ma ọ bụ ịkwado izu ahụ; ọ na-eburu echiche nke participle aorist ahụ nke ọma.
- source_word: ἦσαν δὲ
  choice: Ndị ahụ ... karịrị
  rationale: Kama ịsụgharị usoro ịdị adị Grik ahụ n’okwu n’okwu, a haziri ahịrịokwu ahụ dịka Igbo si adịkarị, ebe isiokwu bụ ndị sonyere n’izu ahụ. δέ bụ njikọ dị nro, ọnọdụ ahịrịokwu ahụ na-eburu ya n’enweghị okwu njikọ ọzọ.
- source_word: οἱ ταύτην τὴν συνωμοσίαν ποιησάμενοι
  choice: Ndị ahụ gbara izu ọjọọ a
  rationale: A sụgharịrị article na participle nke ji ọrụ dịka aha site n’iji “Ndị ahụ...” mee ka ọ bụrụ Igbo eke ma chekwaa ntụaka ya kpọmkwem nye ndị mere izu a.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị mfe nghọta ma nwee ugwu. A họọrọ “ịgba izu ọjọọ” dịka nkebiokwu Igbo ebumpụta ụwa maka ime nkwekọrịta nzuzo a; e zere ịgbakwunye echiche nke iyi iyi sitere n’amaokwu ndị gbara ya gburugburu.
