translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta mee ntụgharị a. A họọrọ ‘ndị kansụl ahụ’ iji kọwaa συνεδρίον n’enweghị okwu ụka pụrụ iche; a hapụrụ aghụghọ dị na ὡς μέλλοντας ka ọ pụta ìhè n’ụzọ nkịtị.
