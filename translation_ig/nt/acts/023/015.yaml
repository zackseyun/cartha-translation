revisions:
- from: Ya mere, ugbu a, unu na ndị kansụl ahụ mee ka ọchịagha mara ka o kpọdata ya bịakwute unu[a], dị ka à ga-asị na unu chọrọ inyocha okwu metụtara ya nke ọma karị[b]. Ma anyị adịla njikere igbu ya tupu ọ bịaruo nso[c].
  to: Ugbu a, ya mere, unu na ndị kansụl ahụ mee ka ọchịagha mara ka o kpọdata ya n’ebe unu nọ, dị ka à ga-asị na unu ga-enyocha ihe ndị metụtara ya nke ọma karị[b][a]. Ma anyị dị njikere igbu ya tupu ọ bịaruo nso[c].
  rationale: 'E megharịala usoro okwu iji mee ka ọ bụrụ Standard Igbo dị ndụ, ma debe ihe dị mkpa n’asụsụ Grik: mbelata/ịkpọdata, nyocha e mere ka ọ yie eziokwu, ntụnyere dị na “nke ọma karị,” na ọnọdụ ugbu a nke ịdị njikere. E wepụla nkọwa na-enweghị nkwado na ndetu a banyere ebe dị elu.'
