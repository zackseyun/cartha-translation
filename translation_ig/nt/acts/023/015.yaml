id: ACT.23.15
reference: Acts 23:15
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: νῦν οὖν ὑμεῖς ἐμφανίσατε τῷ χιλιάρχῳ σὺν τῷ συνεδρίῳ ⸀ὅπως ⸂καταγάγῃ αὐτὸν εἰς⸃ ὑμᾶς ὡς μέλλοντας διαγινώσκειν ἀκριβέστερον τὰ περὶ αὐτοῦ· ἡμεῖς δὲ πρὸ τοῦ ἐγγίσαι αὐτὸν ἕτοιμοί ἐσμεν τοῦ ἀνελεῖν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/015.yaml
  text: Now therefore[a], you, together with the council, make it known to the commander so that he may bring him down to you, as though you were about to examine more carefully the things concerning him[c][b]. But we are ready to kill him before he comes near.
translation:
  language: ig
  text: Ugbu a, ya mere, unu na ndị kansụl ahụ mee ka ọchịagha mara ka o kpọdata ya n’ebe unu nọ, dị ka à ga-asị na unu ga-enyocha ihe ndị metụtara ya nke ọma karị[b][a]. Ma anyị dị njikere igbu ya tupu ọ bịaruo nso[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “ka o kpọta ya n’ihu unu.” Ngwaa Grik ahụ gụnyere echiche nke ịkpọdata mmadụ.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsị, “dị ka à ga-asị na unu na-aga inyocha ikpe ya nke ọma karị.” Okwu a na-egosi na nyocha ọzọ ahụ bụ ihe e mere ka ọ yie eziokwu.
    reason: lexical_alternative
  - marker: c
    text: A pụkwara ịsị, “tupu ọ bịarute.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμφανίσατε
  choice: mee ka ọchịagha mara
  rationale: Nke a na-egosi ime ka onye ọchịchị mara ihe n’ụzọ doro anya, n’etinyeghị n’amaokwu ahụ na ọ bụ naanị arịrịọ.
- source_word: χιλιάρχῳ
  choice: ọchịagha
  rationale: Ọ bụ onyeisi ndị agha Rom; ‘ọchịagha’ bụ okwu Igbo doro ndị na-agụ akwụkwọ taa anya karịa aha ọkwa Rom pụrụ iche.
- source_word: σὺν τῷ συνεδρίῳ
  choice: unu na ndị kansụl ahụ
  rationale: Nke a na-edobe echiche nke iso nzukọ ọchịchị ndị Juu a maara ama mee ihe, ma ghara itinye aha teknụzụ nke nwere ike ghara ido onye ọ bụla anya.
- source_word: καταγάγῃ αὐτὸν εἰς ὑμᾶς
  choice: o kpọdata ya bịakwute unu
  rationale: ‘Kpọdata’ na-echekwa echiche ntụgharị ala dị na κατάγω, ebe ‘bịakwute unu’ na-eme ka ebe a na-akpọga ya doo anya n’Igbo.
- source_word: ὡς μέλλοντας
  choice: dị ka à ga-asị na unu chọrọ
  rationale: Usoro a na-egosi ebumnuche ha ga-eme ka ọ dị ka ha nwere, ma na-ahapụ aghụghọ dị n’okwu ahụ ka ọ pụta ìhè n’enweghị ịgbakwụnye nkọwa gabigara isi mmalite.
- source_word: διαγινώσκειν ἀκριβέστερον
  choice: inyocha ... nke ọma karị
  rationale: ‘Inyocha’ dabara n’ọnọdụ ikpe a, ‘nke ọma karị’ na-echekwa ntụnyere nke ἀκριβέστερον n’Igbo dị mfe nghọta.
- source_word: τὰ περὶ αὐτοῦ
  choice: okwu metụtara ya
  rationale: Nke a bụ ụzọ Igbo dị ndụ isi kwuo ihe niile gbasara ya, n’akpọghị ya kpọmkwem ‘ikpe ya,’ nke ga-abụ nkọwa sara karịa Grik.
- source_word: πρὸ τοῦ ἐγγίσαι αὐτόν
  choice: tupu ọ bịaruo nso
  rationale: Nke a na-echekwa ma oge bu ụzọ ma echiche nke ịbịaru nso dị na ἐγγίζω.
- source_word: τοῦ ἀνελεῖν αὐτόν
  choice: igbu ya
  rationale: Ọ bụ ntụgharị kwụ ọtọ ma doo anya; ọ naghị agbakwụnye okwu ikpe omume dịka ‘igbu ọchụ’ n’agbanyeghị na atụmatụ ahụ bụ ajọ omume.
