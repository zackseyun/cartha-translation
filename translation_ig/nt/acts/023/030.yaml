  variant: Standard Igbo
source:
  edition: SBLGNT
  text: μηνυθείσης δέ μοι ἐπιβουλῆς εἰς τὸν ⸀ἄνδρα ἔσεσθαι ⸀ἐξαυτῆς ἔπεμψα πρὸς σέ, παραγγείλας καὶ τοῖς κατηγόροις ⸀λέγειν πρὸς αὐτὸν ἐπὶ ⸀σοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/030.yaml
  text: And when I was informed that there would be a plot against the man[a], I sent him to you at once, also ordering his accusers to state their case before you.
translation:
  language: ig
  text: Mgbe a gwara m na a ga-akpa izu imegide nwoke ahụ, ezigara m gị ya ozugbo, nyekwa ndị na-ebo ya ebubo iwu ka ha kwupụta ebubo ha megide ya n’ihu gị.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ka ha weta ebubo ha megide ya n’ihu gị.” N’asụsụ Grik, ọ pụtara n’ụzọ nkịtị, “ka ha gwa ya okwu n’ihu gị”; n’ọnọdụ ikpe a, ọ na-ekwu maka ikwupụta ebubo megide ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: μηνυθείσης
  choice: Mgbe a gwara m
  rationale: Nkebiokwu a na-egosi oge ma nọkwa n’ụdị nnara; nsụgharị a bụ Igbo nkịtị ma doo anya.
- source_word: ἐπιβουλῆς
  choice: a na-agba izu
  rationale: Ọ na-egosi atụmatụ nzuzo e ji achọ imerụ mmadụ ahụ; ahịrịokwu a anaghị akpọchi ya naanị n’echiche nke mgbochi n’ụzọ.
- source_word: εἰς τὸν ἄνδρα
  choice: imegide nwoke ahụ
  rationale: ‘Imegide’ na-egosi ntụgharị iro ahụ n’ebe nwoke ahụ nọ, ebe ‘nwoke ahụ’ na-edobe aha e ji kpọọ Pọl n’akwụkwọ ozi ahụ.
- source_word: ἔσεσθαι
  choice: na a na-agba
  rationale: N’okwu a kọrọ, ọ na-egosi na izu ọjọọ ahụ na-abịa ma ọ bụ na-aga ime; Igbo a na-agụ nke ọma n’usoro ahịrịokwu ahụ.
- source_word: ἐξαυτῆς
  choice: ozugbo
  rationale: Ọ na-edobe echiche nke ime ihe n’enweghị oge furu efu.
- source_word: ἔπεμψα πρὸς σέ
  choice: ezitere m ya ozugbo ka ọ bịakwute gị
  rationale: E tinyere ‘ya’ site n’ihe gbara amaokwu ahụ gburugburu, ya bụ Pọl; ‘ka ọ bịakwute gị’ bụ ụzọ Igbo doro anya isi kwupụta ntụziaka iziga ahụ.
- source_word: παραγγείλας
  choice: Enyekwara m ... iwu
  rationale: Ọ na-egosi iwu ọzọ so n’ime ihe onye dere akwụkwọ ozi ahụ mere.
- source_word: κατηγόροις
  choice: ndị na-ebo ya ebubo
  rationale: Nke a bụ okwu Igbo doro anya maka ndị na-eweta ebubo n’okwu ikpe.
- source_word: λέγειν πρὸς αὐτὸν
  choice: ka ha kwuo ebubo ha megide ya
  rationale: A sụgharịrị asụsụ ụlọikpe ahụ n’ụzọ na-egosi ikwu okwu megide onye ahụ, n’enweghị ime ka ọ pụta ihe karịrị Grik.
- source_word: ἐπὶ σοῦ
  choice: n’ihu gị
  rationale: N’ọnọdụ ikpe a, ọ pụtara ikwu okwu n’ihu onye ọchịchị nwere ikike ikpe okwu ahụ.
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. E debere ụda akwụkwọ ozi ọchịchị na okwu ikpe, ma zere okwu ụka pụrụ iche.
