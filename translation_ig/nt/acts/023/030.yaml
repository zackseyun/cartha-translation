review_pass:
  verdict: revise
  source_fidelity: A ghọtara izu ọjọọ ahụ, iziga Pọl ozugbo, na ntụziaka e nyere ndị na-ebo ebubo. Otú ọ dị, “a na-agba izu” na-egosi omume na-aga n’ihu karịa ihe Grik na-atụ anya na ọ ga-eme n’ọdịnihu; “a ga-akpa izu” na-edobe ọdịnihu ahụ. “Ezitere m ya ... ka ọ bịakwute gị” adịghị edo anya dịka ụzọ e si eziga mmadụ n’ebe onye ọzọ nọ; a gbanwere ya ka o doo anya na e zigara ya n’ebe onye nnata akwụkwọ ozi nọ.
  naturalness: 'Nsụgharị a gbanwere ka ọ bụrụ Standard Igbo dị mfe ma kwekọọ n’usoro akwụkwọ ozi ọchịchị: “ezigara m gị ya ozugbo” na “nyere ... iwu” bụ okwu nkịtị ma doo anya.'
  terminology: “Izu” na “ndị na-ebo ya ebubo” dabara n’ọnọdụ ikpe a. “Kwupụta ebubo ha” na-egosi ọrụ iwu dị na λέγειν πρὸς αὐτόν n’enweghị ịgbakwunye nkọwa okpukpe ma ọ bụ iwu karịrị ihe ederede kwuru.
  issues:
