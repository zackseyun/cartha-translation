  text: εἶπεν δὲ ὅτι Οἱ Ἰουδαῖοι συνέθεντο τοῦ ἐρωτῆσαί σε ὅπως αὔριον ⸂τὸν Παῦλον καταγάγῃς εἰς τὸ συνέδριον⸃ ὡς ⸀μέλλον τι ἀκριβέστερον πυνθάνεσθαι περὶ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/020.yaml
  text: He said[a], “The Jews have agreed to ask you to bring Paul down to the Sanhedrin tomorrow[b], as though they were going to inquire more accurately about him.”
translation:
  language: ig
  text: Ọ sịrị, “Ndị Juu ekwekọrịtala ịrịọ gị ka i kpọdata Pọl n’ihu Sanhedrin echi, dị ka a ga-asị na ha ga-achọ ịmata ihe banyere ya n’ụzọ ziri ezi karị.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνέθεντο
  choice: ekwekọrịtala
  rationale: Okwu a na-egosi na ha jikọrọ ọnụ kwekọrịta n’ihe ha ga-eme; ọ naghị eme ka echiche nke izu ọjọọ bụrụ akụkụ pụtara ìhè n’okwu ahụ n’onwe ya.
- source_word: τοῦ ἐρωτῆσαί σε
  choice: ịrịọ gị
  rationale: N’ebe a, infinitive ahụ na-egosi ihe ha kwekọrịtara ime, ya bụ ịrịọ onyeisi agha arịrịọ.
- source_word: καταγάγῃς
  choice: i mee ka a kpọdata Pọl
  rationale: Nke a na-echekwa echiche nke ime ka e si n’ebe dị elu kpọdata Pọl, ma na-adabara eziokwu ahụ na onye a na-agwa ga-enye iwu ka e kpọta ya.
- source_word: συνέδριον
  choice: ndị Sanhedrin
  rationale: N’ọnọdụ akụkọ a, okwu Grik a na-ezo aka n’òtù ọchịchị na ikpe ndị Juu nọ na Jerusalem, nke a maara dị ka Sanhedrin.
- source_word: ὡς
  choice: dị ka à ga-asị na
  rationale: Nke a na-egosi na ihe ha kwuru na ha chọrọ ime bụ ihe ngọpụ, n’enweghị ịgbakwunye nkọwa karịrị nke isi mmalite.
- source_word: μέλλον τι ἀκριβέστερον πυνθάνεσθαι περὶ αὐτοῦ
  choice: ha chọrọ ịjụjụtakwu banyere ya nke ọma
  rationale: Nsụgharị a na-ejigide echiche nke ebumnuche ha kwuru na ha nwere, nke ịjụ ajụjụ iji mata ihe n’ụzọ zuru ezu na nke ziri ezi karị.
- source_word: Οἱ Ἰουδαῖοι
  choice: Ndị Juu
  rationale: Nke a bụ nsụgharị kpọmkwem nke okwu Grik ahụ. Ihe gbara amaokwu ahụ gburugburu na-egosi na ọ bụ ndị Juu ahụ so n’atụmatụ a, ọ bụghị ndị Juu niile.
theological_decisions:
- issue: Ndị okwu ahụ bụ Οἱ Ἰουδαῖοι na-ezo aka na ha n’akụkọ esemokwu a
  choice: E debere ya dịka “Ndị Juu.”
  alternative: “Ndị ndu ndị Juu” ma ọ bụ “ndị Juu ahụ”
  rationale: Isi mmalite ahụ ekwughị kpọmkwem “ndị ndu.” Ya mere, nsụgharị ahụ anaghị eme ka ndị a na-ekwu maka ha dị warara karịa ihe Grik kwuru, ebe ihe gbara amaokwu ahụ gburugburu na-egosi otu ndị ahụ sonyere n’atụmatụ igbu Pọl.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ugwu ma dị mfe nghọta. A hapụrụ aha ụlọ ọchịchị ahụ dịka “Sanhedrin,” ma tinye “ndị” ka ọ pụta ìhè na ọ bụ òtù mmadụ. E tinyụghị akara ntụaka ụkwụ n’ihi na enweghị nkọwa ụkwụ dị mkpa maka ederede Igbo a.
