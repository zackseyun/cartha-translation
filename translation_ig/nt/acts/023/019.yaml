  text: ἐπιλαβόμενος δὲ τῆς χειρὸς αὐτοῦ ὁ χιλίαρχος καὶ ἀναχωρήσας κατ’ ἰδίαν ἐπυνθάνετο· Τί ἐστιν ὃ ἔχεις ἀπαγγεῖλαί μοι;
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/019.yaml
  text: So the commander took him by the hand and[a], drawing aside in private, began asking[b], “What is it that you have to report to me?”
translation:
  language: ig
  text: Ọchịagha ahụ jidere ya n’aka, kpọọrọ ya gaa n’akụkụ n’ime nzuzo, wee jụọ ya, sị, “Gịnị bụ ihe i nwere ịkọrọ m?”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Ma ọ bụ, “Gịnị ka i nwere ịgwa m?”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιλαβόμενος ... τῆς χειρὸς αὐτοῦ
  choice: jidere ya n’aka
  rationale: Nke a na-egosipụta omume doro anya nke ijide onye ahụ n’aka, n’asụsụ Igbo dị mfe, n’etinyeghị echiche na ọ jidere ya n’ike.
- source_word: δὲ
  choice: Ya mere
  rationale: N’ebe a, δέ na-eme ka akụkọ gaa n’ihu. “Ya mere” na-ejikọta ihe a na ihe mere tupu ya n’ụzọ eke.
- source_word: ὁ χιλίαρχος
  choice: ọchịagha ahụ
  rationale: χιλίαρχος bụ onyeisi ndị agha Rom. “Ọchịagha” bụ okwu Igbo a na-aghọta ngwa ngwa, ebe “onyeisi otu puku ndị agha” nwere ike ime ka aha ọkwa ahụ yie nkọwa ọnụọgụ kpọmkwem karịa ka ọnọdụ a chọrọ.
- source_word: ἀναχωρήσας κατ’ ἰδίαν
  choice: wezuga onwe ya na ya naanị ha
  rationale: Nke a na-egosipụta ma isi n’etiti ndị ọzọ pụọ ma ịnọ naanị ha, na-agbasoghị ya na nkọwa na-adịghị n’ihe odide Grik.
- source_word: ἐπυνθάνετο
  choice: wee malite ịjụ ya
  rationale: Ụdị imperfect ahụ nwere ike igosi mmalite ma ọ bụ omume na-aga n’ihu; “malite ịjụ” na-echekwa echiche ahụ n’Igbo nkịtị.
- source_word: Τί ἐστιν ὃ ἔχεις ἀπαγγεῖλαί μοι
  choice: Gịnị bụ ihe i nwere ịkọrọ m?
  rationale: “Ịkọrọ m” na-egosipụta izigara onyeisi ahụ ozi e nwere, ma na-anọgide bụrụ ajụjụ Igbo sitere n’ọnụ mmadụ.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta. E ji “ọchịagha” mee ka ọkwa agha ahụ doo onye nkịtị anya; e debere omume ijide ya n’aka na ọnọdụ ịnọ naanị ha iche dịka ha dị n’ihe odide Grik.
