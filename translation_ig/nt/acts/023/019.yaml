revisions:
- from: Ya mere, ọchịagha ahụ jidere ya n’aka, wezuga onwe ya na ya naanị ha[a], wee malite ịjụ ya, sị, “Gịnị bụ ihe i nwere ịkọrọ m?”[b]
  to: Ọchịagha ahụ jidere ya n’aka, kpọọrọ ya gaa n’akụkụ n’ime nzuzo, wee jụọ ya, sị, “Gịnị bụ ihe i nwere ịkọrọ m?”[b]
  rationale: The revision removes an unnecessarily causal rendering of δέ, replaces the awkward expression for private withdrawal with idiomatic Standard Igbo, and uses a natural past-tense reporting verb for the Greek imperfect without losing the sense of inquiry. Footnote a is removed because the revised wording already explicitly and naturally expresses taking him aside privately; footnote b remains a valid alternative for ἀπαγγεῖλαί μοι.
