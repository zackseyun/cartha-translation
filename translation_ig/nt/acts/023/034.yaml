  text: ἀναγνοὺς ⸀δὲ καὶ ἐπερωτήσας ἐκ ποίας ⸀ἐπαρχείας ἐστὶν καὶ πυθόμενος ὅτι ἀπὸ Κιλικίας,
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/034.yaml
  text: After reading it and asking what province he was from[a], and learning that he was from Cilicia,
translation:
  language: ig
  text: Mgbe ọ gụchara akwụkwọ ozi ahụ, ọ jụrụ ya ógbè ọchịchị ọ si, ma mgbe ọ matara na o si Silisia,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναγνοὺς
  choice: Mgbe ọ gụchara akwụkwọ ozi ahụ
  rationale: Aorist participle a na-egosi ihe o mere tupu ọ jụọ ajụjụ. E tinyere ‘akwụkwọ ozi ahụ’ site n'ihe gbara amaokwu a gburugburu ka Igbo wee doo anya ma dị mfe.
- source_word: δὲ
  choice: —
  rationale: N'ebe a δέ bụ njikọ dị nro; usoro ahịrịokwu Igbo na-egosipụta njikọ ahụ nke ọma n'enweghị okwu pụrụ iche maka ya.
- source_word: καὶ ... καὶ
  choice: ọ ... ma mgbe
  rationale: Njikọ ndị a na-ahazi omume ndị so ibe ha; ‘ma mgbe’ na-eme ka usoro ahụ bụrụ Igbo eke n'enweghị ime ka καί bụrụ mmegide siri ike.
- source_word: ἐπερωτήσας
  choice: ọ jụrụ
  rationale: Ọ na-egosi ịjụ ajụjụ kpọmkwem; ‘ọ jụrụ’ bụ okwu Igbo nkịtị ma doo anya.
- source_word: ἐκ ποίας ἐπαρχείας ἐστίν
  choice: ógbè ọchịchị onye ahụ si
  rationale: ἐπαρχία bụ ógbè nchịkwa Rom. ‘Ógbè ọchịchị’ na-echekwa echiche nchịkwa ahụ, ebe ‘onye ahụ’ na-ezo aka n'okwu gbara ya gburugburu.
- source_word: πυθόμενος
  choice: mgbe ọ matara
  rationale: Middle participle a pụtara inweta ma ọ bụ ịchọpụta ozi; ‘mgbe ọ matara’ na-egosipụta na ihe ọmụma a bịara mgbe ajụjụ ahụ gasịrị.
- source_word: ὅτι ἀπὸ Κιλικίας
  choice: na o si Silisia
  rationale: ἀπό tinyere aha ebe na-egosi ebe mmadụ si. A tụgharịrị ya n'ụzọ kpọmkwem ma bụrụkwa Igbo eke.
- source_word: Κιλικίας
  choice: Silisia
  rationale: Nke a bụ ntụgharị mkpụrụedemede aha ógbè Rom ahụ n'ụdị dabara n'usoro mkpọpụta na ide Igbo.
theological_decisions: []
translation_notes:
  register: Ejiri Standard Igbo dị ugbu a, dị ugwu ma dị mfe nghọta. Nsụgharị ahụ na-edebe usoro omume atọ dị na participle Grik, ma na-eme ka onye a na-ekwu banyere ya na ihe a gụrụ doo anya site n'okwu gbara amaokwu ahụ gburugburu. Akara ndetu [a] dị n'ahụ amaokwu ahụ.
