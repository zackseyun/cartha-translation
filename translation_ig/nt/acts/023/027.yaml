  to: Ndị Juu[a] jidere nwoke a, ọ fọrọ nke nta ka ha gbuo ya; mụ na ndị agha wee bịarute napụta ya, mgbe m matara na ọ bụ onye Rom.
  rationale: A safe correction is needed to represent the Greek construction μέλλοντα ἀναιρεῖσθαι as an imminent event rather than merely a hostile intention. The coordination remains non-contrastive, and the temporal participle μαθών is retained as 'mgbe m matara.' No doctrinal or historical harmonization has been introduced.
