id: ACT.23.27
reference: Acts 23:27
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τὸν ἄνδρα τοῦτον συλλημφθέντα ὑπὸ τῶν Ἰουδαίων καὶ μέλλοντα ἀναιρεῖσθαι ὑπ’ αὐτῶν ἐπιστὰς σὺν τῷ στρατεύματι ⸀ἐξειλάμην, μαθὼν ὅτι Ῥωμαῖός ἐστιν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/027.yaml
  text: This man was seized by the Jews and was about to be killed by them[a], and I came with the troops and rescued him, having learned that he is a Roman.
translation:
  language: ig
  text: Ndị Juu[a] jidere nwoke a, ọ fọrọ nke nta ka ha gbuo ya; mụ na ndị agha wee bịarute napụta ya, mgbe m matara na ọ bụ onye Rom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Ndị Judia.” Okwu Grik a nwere ike ịpụta ndị Juu n'echiche agbụrụ na okpukpe, ma ọ bụ ndị Judia n'echiche mpaghara. N'ebe a, o yikarịrị ka ọ na-ekwu banyere ìgwè ndị Juu, ndị na-emegide Pọl na Jerusalem.
    reason: lexical_alternative
lexical_decisions:
- source_word: συλλημφθέντα
  choice: jidere
  rationale: N'ọnọdụ a, okwu ahụ na-egosi ijide mmadụ n'ike. “Jidere” bụ okwu Igbo doro anya nke na-adịghị eme ka o yie na ọ bụ njide iwu kwadoro.
- source_word: Ἰουδαίων
  choice: Ndị Juu
  rationale: Nke a bụ nsụgharị a na-ejikarị eme ihe maka ndị Juu n'echiche agbụrụ na okpukpe; ihe odide a na-ekwu banyere ìgwè ndị Juu nọ na Jerusalem na-emegide Pọl. E debere “ndị Judia” dị ka nhọrọ ọzọ n'ala ala peeji.
- source_word: μέλλοντα ἀναιρεῖσθαι
  choice: ha na-achọkwa igbu ya
  rationale: Nkebi okwu a na-egosi na igbu ya dị nso. Nsụgharị a bụ Igbo nkịtị ma doo anya, n'agbanyeghị na ọ nwekwara ike igosi ebumnobi ha site n'ọnọdụ ahụ.
- source_word: ἐπιστὰς
  choice: wee bịarute
  rationale: Okwu a na-egosi ọbịbịa ma ọ bụ itinye aka na mberede. “Wee bịarute” na-aga nke ọma n'usoro akụkọ Igbo ma na-eduga n'omume ịnapụta ya.
- source_word: σὺν τῷ στρατεύματι
  choice: mụ na ndị agha
  rationale: στράτευμα bụ ndị agha ma ọ bụ otu ndị agha; “ndị agha” na-enye nghọta agha ahụ n'enweghị ịkọwapụta ọnụ ọgụgụ ma ọ bụ ngalaba ha.
- source_word: ἐξειλάμην
  choice: napụta ya
  rationale: N'ebe a, okwu ahụ pụtara ịzọpụta mmadụ n'ihe ize ndụ ma ọ bụ n'aka ndị ọzọ. “Napụta ya” dabara n'ihe ize ndụ nke igbu ya.
- source_word: μαθὼν
  choice: mgbe m matara
  rationale: Nke a na-egosi na onye na-ekwu okwu matara ihe ahụ. Nsụgharị ahụ na-edobe njikọ ọ na-ekwu na ọ dị n'etiti ịmata na ịnapụta, n'agbanyeghị esemokwu ya na nkọwa sara mbara nke akụkọ ahụ.
- source_word: Ῥωμαῖός ἐστιν
  choice: ọ bụ onye Rom
  rationale: Nke a bụ nsụgharị kpọmkwem nke na-egosi na ọ bụ onye Rom; n'ọnọdụ iwu a, ịbụ nwa amaala Rom dị n'ime nghọta ya, ma e tinyeghị nkọwa ahụ n'ahịrị isi.
theological_decisions:
- issue: Otú ọchịagha ahụ si kọwaa ihe mere n'akwụkwọ ozi ya
  choice: A sụgharịrị okwu ọchịagha ahụ kpọmkwem dịka nkwupụta ya, na-emeghị ka ọ kwekọọ n'ike na nkọwa zuru ezu dị n'Ọrụ Ndị Ozi 21–22.
  alternative: Ịgbanwe usoro okwu ahụ ma ọ bụ tinye nkọwa iji mee ka o doo anya na ọ matara na Pọl bụ onye Rom mgbe ọ napụtachara ya.
  rationale: Amaokwu a na-akọ ihe Klọdiọs Lisias n'onwe ya dere, nke na-egosi omume ya n'ụzọ dị mma. Nsụgharị ekwesịghị idozi esemokwu dị n'akụkọ ahụ site n'ịgbakwunye ma ọ bụ ịgbanwe ihe odide Grik.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta, mee nsụgharị ahụ. E debere njikọ ahịrịokwu ahụ n'ụdị akụkọ Igbo ebumpụta ụwa, ma e tinyeghị ihe megidere ma ọ bụ nkọwa nke na-adịghị na Grik.
