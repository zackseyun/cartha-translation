  verdict: revise
  source_fidelity: The draft weakens μέλλοντα ἀναιρεῖσθαι ('was about to be killed') by rendering it as 'ha na-achọkwa igbu ya' ('they were seeking/wanting to kill him'). The revision restores the explicit imminence while retaining the letter's own favorable presentation of the tribune's action.
  naturalness: The revised wording is natural, clear Standard Igbo in a formal narrative register. 'Ọ fọrọ nke nta ka ha gbuo ya' idiomatically expresses imminent killing, and 'mgbe m matara' retains the temporal relation of the Greek participle without attempting to reconcile the claim with the wider narrative.
  terminology: '''Ndị Juu,'' ''ndị agha,'' ''napụta ya,'' and ''onye Rom'' are suitable and consistent. The footnote preserves the contextual lexical alternative for Ἰουδαίων and clarifies its geographic sense more naturally.'
  issues:
  - severity: medium
    issue: Imminence of the threatened killing is not represented.
    rationale: '''Ha na-achọkwa igbu ya'' indicates an intention or attempt to kill, whereas μέλλοντα ἀναιρεῖσθαι states that he was on the point of being killed.'
