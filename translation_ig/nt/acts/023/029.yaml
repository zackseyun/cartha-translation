translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị ùgwù ma doo anya. E ji okwu ikpe a na-aghọta ngwa ngwa, ma debe ọdịiche dị n’etiti ebubo na ikpe ọmụma.
