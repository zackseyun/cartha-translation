base_translation:
  language: en
  yaml_path: translation/nt/acts/023/029.yaml
  text: I found that he was being accused concerning questions of their law[b][a], but charged with nothing deserving death or imprisonment.
translation:
  language: ig
  text: Achọpụtara m na a na-ebo ya ebubo banyere okwu ndị a na-arụrịta ụka n’iwu ha[a], ma ọ dịghị ebubo megide ya nke kwesịrị ọnwụ ma ọ bụ mkpọrọ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “metụtara ajụjụ banyere iwu ha.”
    reason: lexical_alternative
  - marker: b
    text: N’ụzọ nkịtị, “ọ dịghị ihe kwesịrị ọnwụ ma ọ bụ agbụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εὗρον
  choice: Achọpụtara m
  rationale: Ọ na-egosi ihe ọchịagha ahụ chọpụtara mgbe o nyochachara okwu ahụ, ma na-edobe onye mbụ dị n’asụsụ Grik.
- source_word: ἐγκαλούμενον
  choice: ebubo a na-ebo ya
  rationale: Nhọrọ a na-edobe ọdịdị nnara na echiche na a na-ewetara ya ebubo, n’etinyeghị na a mara ya ikpe.
- source_word: περὶ ζητημάτων
  choice: metụtara okwu ndị a na-arụrịta ụka
  rationale: ζητήματα nwere ike ịpụta ajụjụ ma ọ bụ ihe a na-arụrịta ụka; nsụgharị a na-eme ka akụkụ esemokwu ahụ doo anya n’Igbo nkịtị.
- source_word: τοῦ νόμου αὐτῶν
  choice: n’iwu ha
  rationale: Ọ na-edobe αὐτῶν, ya bụ echiche onye ọchịchị Rom banyere iwu nke ndị Juu.
- source_word: μηδὲν ... ἄξιον θανάτου ἢ δεσμῶν
  choice: ọ dịghị ... nke kwesịrị ọnwụ ma ọ bụ ịtụ ya mkpọrọ
  rationale: ‘Ịtụ ya mkpọrọ’ na-ebute echiche ikpe nke δεσμῶν n’Igbo nke oge a; nkọwa ala peeji na-edobe ihe oyiyi nkịtị nke agbụ.
- source_word: ἔχοντα ἔγκλημα
  choice: ebubo e boro ya
  rationale: Ọ na-egosi na ihe a na-ekwu bụ ebubo megide ya, ọ bụghị nkwupụta na ikpe mara ya.
