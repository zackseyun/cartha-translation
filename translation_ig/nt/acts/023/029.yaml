  to: Achọpụtara m na a na-ebo ya ebubo banyere okwu ndị a na-arụrịta ụka n’iwu ha[a], ma ọ dịghị ebubo megide ya nke kwesịrị ọnwụ ma ọ bụ mkpọrọ[b].
