  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τότε ὁ Παῦλος πρὸς αὐτὸν εἶπεν· Τύπτειν σε μέλλει ὁ θεός, τοῖχε κεκονιαμένε· καὶ σὺ κάθῃ κρίνων με κατὰ τὸν νόμον, καὶ παρανομῶν κελεύεις με τύπτεσθαι;
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/003.yaml
  text: Then Paul said to him[a], “God is about to strike you, you whitewashed wall! And do you sit judging me according to the law, and yet in violation of the law command me to be struck?”
translation:
  language: ig
  text: Mgbe ahụ, Pọl sịrị ya, “Chineke na-aga iti gị ihe[a], gị mgbidi e tere nzu! Ị nọ ọdụ na-ekpe m ikpe dịka iwu si dị, ma ị na-emebi iwu mgbe ị na-enye iwu ka e tie m ihe?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Chineke ga-eti gị ihe.” N’asụsụ Grik, ihe e kwuru n’ụzọ nkịtị bụ, “Chineke na-aga iti gị ihe,” nke nwere ike imesi ike na ihe ahụ dị nso ime.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τύπτειν σε μέλλει ὁ θεός
  choice: Chineke na-aga iti gị ihe
  rationale: Nkebiokwu μέλλει tinyere infinitive na-egosi ihe na-abịanụ ma ọ bụ ihe dị nso ime. ‘Na-aga iti gị ihe’ na-egosipụta nke a n’Igbo n’enweghị ime ya ka ọ bụrụ arịrịọ ma ọ bụ ọchịchọ.
- source_word: τοῖχε κεκονιαμένε
  choice: gị mgbidi e tere nzu
  rationale: Nke a na-edobe ihe atụ doro anya nke mgbidi e ji nzu kpuchie, nke nwere ike iyi ihe dị ọcha n’èzí ma zoo ihe dị n’ime. Ọ na-egosipụtakwa ọnọdụ nke perfect participle κεκονιαμένε.
- source_word: κάθῃ
  choice: nọ ọdụ
  rationale: A hapụrụ ihe omume nkịtị nke ịnọ ọdụ ka ike ajụjụ ịba mba Pọl ghara ịla n’iyi.
- source_word: κρίνων με κατὰ τὸν νόμον
  choice: na-ekpe m ikpe dịka iwu si dị
  rationale: ‘Dịka iwu si dị’ na-egosi na iwu bụ ụkpụrụ e kwuru na a na-agbaso mgbe a na-ekpe ikpe ahụ.
- source_word: παρανομῶν
  choice: ị na-emebi iwu
  rationale: Nke a na-egosi ime ihe megidere iwu ma na-eme ka ọdịiche dị n’etiti ikpe ‘dịka iwu si dị’ na imebi iwu pụta ìhè.
- source_word: κελεύεις με τύπτεσθαι
  choice: ị na-enye iwu ka e tie m ihe
  rationale: Nsụgharị a na-edobe ma echiche nke inye iwu ma ụdị passive nke τύπτεσθαι, ya bụ, ka onye ọzọ tie Pọl ihe.
- source_word: τότε ὁ Παῦλος πρὸς αὐτὸν εἶπεν
  choice: Mgbe ahụ, Pọl sịrị ya
  rationale: Ọ bụ mmeghe akụkọ dị mfe ma kwekọọ n’usoro na ihe Grik kwuru.
theological_decisions:
- issue: Ụdị okwu Pọl kwuru, ‘Chineke na-aga iti gị ihe’
  choice: E gosipụtara ya dịka nkwupụta na Chineke ga-eme ihe ahụ n’oge na-abịanụ, na-enweghị ime ka ike ya daa mbà ma ọ bụ ịgbatị nkọwa ya.
  alternative: ‘Ka Chineke tie gị ihe,’ nke ga-eme ya ka ọ bụrụ arịrịọ ma ọ bụ ọbụbụ ọnụ.
  rationale: Ụdị Grik μέλλει + infinitive na-egosikarị ihe na-aga ime, ọ bụghị ọchịchọ. Nsụgharị ahụ anaghị ekpebi ma okwu Pọl ò ziri ezi n’omume; ọ na-ahapụ esemokwu nkà mmụta okpukpe dị n’amaokwu ahụ ka ọ dị.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma doo ndị nkịtị anya. A hapụrụ ajụjụ ịba mba ahụ ka ọ dị nkọ, tinyere ihe atụ ‘mgbidi e tere nzu’ na ọdịiche dị n’etiti ikpe dịka iwu si dị na imebi iwu.
