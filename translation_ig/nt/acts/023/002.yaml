base_translation:
  language: en
  yaml_path: translation/nt/acts/023/002.yaml
  text: But the high priest Ananias ordered those standing by him to strike him on the mouth[a].
translation:
  language: ig
  text: Ma onyeisi nchụaja ahụ, bụ́ Ananayas, nyere ndị guzo ya nso iwu ka ha tie ya n’ọnụ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ka ha maa ya ụra aka n’ọnụ.” Okwu Grik ahụ nwere ike ịpụta ịkụ mmadụ n’ozuzu ya; “ịma ụra aka” ga-ekwe omume n’ebe a, ma ọ na-akọwa ụdị ịkụ ahụ kpọmkwem karịa okwu Grik ahụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Ma
  rationale: Ọ na-egosi mmeghachi omume mberede megide okwu Pọl kwuru tupu nke a, n’emeghị ka ọdịiche ahụ sie ike karịa ka Grik si kwuo.
- source_word: ἀρχιερεὺς
  choice: nnukwu onye nchụaja
  rationale: Nke a bụ okwu Igbo a na-aghọta nke ọma maka ọkwá onyeisi nchụaja ahụ.
- source_word: Ἁνανίας
  choice: Ananayas
  rationale: A sụgharịghị aha mmadụ; e dere ya n’ụdị kwekọrọ n’usoro ụda Igbo.
- source_word: ἐπέταξεν
  choice: nyere ... iwu
  rationale: Ọ na-egosi iwu onye nwere ikike nyere, ma bụrụkwa okwu Igbo dị ugbu a ma doo anya.
- source_word: τοῖς παρεστῶσιν αὐτῷ
  choice: ndị guzo ya nso
  rationale: Ọ na-echekwa echiche gbasara ndị nọ n’akụkụ Ananayas, n’etinyeghị echiche pụrụ iche na ha bụ ndị na-ejere ya ozi.
- source_word: τύπτειν
  choice: ka ha tie ... ihe
  rationale: Nke a na-echekwa nghọta sara mbara nke ịkụ mmadụ, n’akọwaghị kpọmkwem na ọ bụ ịma ụra aka.
- source_word: αὐτοῦ τὸ στόμα
  choice: Pọl ihe n’ọnụ
  rationale: Aha Pọl mere ka onye a ga-akụ doo anya n’Igbo, ebe ‘n’ọnụ’ na-egosi akụkụ ahụ a ga-akụ.
theological_decisions: []
translation_notes:
  register: E jiri Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. A họọrọ ‘nnukwu onye nchụaja’ maka aha ọkwá ahụ, tinyekwa aha ‘Pọl’ iji zere mgbagwoju anya nke nnọchiaha abụọ dị n’ahịrịokwu ahụ. Akara ndetu ala [a] dị n’isiokwu ahụ dịka achọrọ.
