- from: Ma nnukwu onye nchụaja ahụ, bụ́ Ananayas, nyere ndị guzo ya nso iwu ka ha tie Pọl ihe n’ọnụ.[a]
  to: Ma onyeisi nchụaja ahụ, bụ́ Ananayas, nyere ndị guzo ya nso iwu ka ha tie ya n’ọnụ.[a]
  rationale: The revision removes the non-idiomatic “ihe,” retains the Greek pronoun rather than unnecessarily replacing it with Paul’s name, and uses the conventional title “onyeisi nchụaja.” The lexical footnote remains anchored to the action of striking and preserves the Greek verb’s nonspecific force.
