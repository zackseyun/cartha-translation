  source_fidelity: The personal names, the official title, the honorific force of κρατίστῳ, and the epistolary sense of χαίρειν are represented accurately. However, the draft's explicit verbal phrase and bare “akwụkwọ” unnecessarily recast the Greek letter-heading formula and can suggest ‘a book’ rather than a letter.
  naturalness: '“na-edegara ... akwụkwọ: Ekele” is awkward in this formal heading and is less idiomatic than a concise sender-recipient salutation. A nominal letter-heading is natural in Standard Igbo and reflects the source''s nominal syntax.'
  terminology: “gọvanọ,” “a na-akwanyere ùgwù nke ukwuu,” and “Ekele” are suitable modern Standard Igbo equivalents. The honorific is correctly kept distinct from Felix’s name and office.
  issues:
