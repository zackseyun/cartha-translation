  text: Claudius Lysias[a], to the most excellent governor Felix, greetings.
translation:
  language: ig
  text: 'Klọdiọs Lisias, nye Gọvanọ Feliks a na-akwanyere ùgwù nke ukwuu: Ekele.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ịsụgharị ya, “Klọdiọs Lisias, nye Gọvanọ Feliks, Onye A Na-akwanyere Ùgwù Ukwuu: Ekele.” Okwu Grik κρατίστῳ bụ aha nsọpụrụ e ji agwa onye nọ n’ọkwa dị elu okwu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Κλαύδιος Λυσίας
  choice: Klọdiọs Lisias
  rationale: E dere aha mmadụ ndị a n’ụdị dabara n’ụda na usoro odide Igbo, kama ịsụgharị ihe aha ha pụtara.
- source_word: τῷ κρατίστῳ
  choice: a na-akwanyere ùgwù nke ukwuu
  rationale: κρατίστῳ bụ okwu nsọpụrụ dị elu e ji agwa onye nọ n’ọkwa ọchịchị okwu n’akwụkwọ gọọmenti. Nhọrọ a na-edobe nkwanye ùgwù ahụ n’Igbo dị mfe ma dị ùgwù.
- source_word: ἡγεμόνι
  choice: gọvanọ
  rationale: N’ọnọdụ ọchịchị Rom a, ἡγεμών na-ezo aka n’onye na-achị ógbè. “Gọvanọ” bụ okwu Igbo nke oge a nke doro anya, ebe aha ọkwa pụrụ iche dịka “prefect” ga-akọwa ya kpọmkwem karịa ihe okwu Grik kwuru.
- source_word: Φήλικι
  choice: Feliks
  rationale: E dere aha mmadụ a n’ụdị dabara n’ụda na usoro odide Igbo.
- source_word: χαίρειν
  choice: Ekele
  rationale: N’isi mmalite akwụkwọ ozi, χαίρειν bụ ekele a na-ejikarị amalite akwụkwọ ozi, ọ bụghị iwu ka onye ahụ ṅụrịa. “Ekele” na-egosipụta ọrụ ya n’ụzọ ebumpụta ụwa n’Igbo.
theological_decisions: []
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe nke oge a, dị ùgwù ma kwekọọ n’ụdị akwụkwọ ozi ọchịchị. A kọwara usoro onye na-ezigara onye ọzọ akwụkwọ n’ụzọ Igbo ga-aghọta ngwa ngwa, ebe e debere nkwanye ùgwù nke κρατίστῳ na ekele ọdịnala nke χαίρειν.
