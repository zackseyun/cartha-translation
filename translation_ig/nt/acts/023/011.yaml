id: ACT.23.11
reference: Acts 23:11
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Τῇ δὲ ἐπιούσῃ νυκτὶ ἐπιστὰς αὐτῷ ὁ κύριος εἶπεν· ⸀Θάρσει, ὡς γὰρ διεμαρτύρω τὰ περὶ ἐμοῦ εἰς Ἰερουσαλὴμ οὕτω σε δεῖ καὶ εἰς Ῥώμην μαρτυρῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/011.yaml
  text: But on the following night[a], the Lord stood by him and said, “Take courage, for just as you have testified about me in Jerusalem[b], so you must also testify in Rome.”
translation:
  language: ig
  text: Ma n'abalị sochirinụ, Onyenwe anyị guzoro n'akụkụ ya wee sị, “Nwee obi ike[a], n'ihi na dịka i siri gbaa àmà banyere m na Jerusalem, otu a ka ọ dị mkpa ka ị gbaa àmà na Rom kwa[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “Ka obi sie gị ike.”
    reason: lexical_alternative
  - marker: b
    text: Okwu ndị a sụgharịrị “ịgba àmà” n'ebe abụọ ahụ sitere n'otu ezinụlọ okwu Grik nke pụtara ịgba àmà ma ọ bụ ịkọ ihe mmadụ maara.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τῇ δὲ ἐπιούσῃ νυκτί
  choice: Ma n'abalị sochirinụ
  rationale: “N'abalị sochirinụ” na-egosi abalị na-esote; “Ma” na-eburu njikọ δέ n'ụzọ dị nro n'ime akụkọ ahụ.
- source_word: ἐπιστὰς αὐτῷ
  choice: guzoro n'akụkụ ya
  rationale: Nke a na-echekwa echiche nke Onyenwe anyị ịbịa guzo ya nso, kama ịkọwa ya naanị dịka ọhụụ.
- source_word: ὁ κύριος
  choice: Onyenwe anyị
  rationale: Ọ bụ aha Igbo a na-ejikarị akọwa κύριος dịka “Onyenwe anyị”; etinyeghị “Jizọs” n'ahịrị ahụ, n'ihi na isiokwu Grik kwuru naanị “Onyenwe anyị.”
- source_word: Θάρσει
  choice: Nwee obi ike
  rationale: Ọ bụ iwu agbamume doro anya ma bụrụ okwu Igbo ndị mmadụ na-aghọta nke ọma.
- source_word: διεμαρτύρω ... μαρτυρῆσαι
  choice: i siri gbaa àmà ... ka ị gbaa àmà
  rationale: Iji “gbaa àmà” n'ebe abụọ ahụ na-eme ka njikọ dị n'etiti okwu Grik abụọ sitere n'otu ezinụlọ nke ịgba àmà pụta ìhè.
- source_word: τὰ περὶ ἐμοῦ
  choice: banyere m
  rationale: Ọ na-eburu nkọwa okwu ahụ n'ụzọ nkịtị ma dị mfe, na-enweghị ịgbakwunye ihe ndị ọzọ.
- source_word: εἰς Ἰερουσαλὴμ ... εἰς Ῥώμην
  choice: na Jerusalem ... na Rom
  rationale: N'okwu a, εἰς na aha obodo na-egosi ebe a gbara ma ọ bụ a ga-agba àmà; “na” bụ ụzọ Igbo si kwuo ya nke ọma.
- source_word: οὕτω
  choice: otu ahụ
  rationale: Ọ na-egosi myirịta dị n'etiti àmà Pọl gbara na Jerusalem na nke ọ ga-agba na Rom.
- source_word: σε δεῖ
  choice: ọ dịkwa mkpa ka ị
  rationale: Nke a na-echekwa ọdịdị impersonal na echiche nke necessity dị na δεῖ, na-akọwaghị ya dịka akara aka a na-apụghị izere ezere.
theological_decisions:
- issue: Onye ὁ κύριος na-ezo aka na ya
  choice: Onyenwe anyị
  alternative: Onyenwe anyị Jizọs
  rationale: N'ime Ọrụ Ndịozi, okwu onye ahụ kwuru banyere ịgba àmà “banyere m” na-egosi Jizọs bilitere n'ọnwụ; ma ntụgharị ahụ anaghị agbakwunye aha “Jizọs,” ebe ederede Grik kwuru naanị ὁ κύριος.
- issue: Ike okwu δεῖ
  choice: ọ dị mkpa ka ị
  alternative: ị ga-agbarịrị
  rationale: Nhọrọ a na-egosi mkpa dị n'okpuru nzube Chineke ma ghara ime ka okwu ahụ bụrụ nkuzi siri ike banyere akara aka.
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe dị ugbu a, dị nsọ ma dịkwa mfe nghọta. E ji “Onyenwe anyị” na “ịgba àmà” mee ihe dịka okwu Ndị Kraịst maara nke ọma, ma a zere okwu ụka pụrụ iche na nkọwa karịrị ihe ederede kwuru.
