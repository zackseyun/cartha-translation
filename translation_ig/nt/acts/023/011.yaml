  to: Ma n'abalị sochirinụ, Onyenwe anyị guzoro n'akụkụ ya wee sị, “Nwee obi ike[a], n'ihi na dịka i siri gbaa àmà banyere m na Jerusalem, otu a ka ọ dị mkpa ka ị gbaa àmà na Rom kwa[b].”
  rationale: 'The revision makes one limited adjustment: it moves the sense of ''also'' to ''na Rom kwa,'' where the Greek places it, while retaining the impersonal necessity expressed by δεῖ. Footnote b is lightly normalized so that its quoted expression matches both occurrences without implying that the surrounding verbal forms are identical.'
