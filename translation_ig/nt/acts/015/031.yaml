translation:
  language: ig
  text: Mgbe ha gụchara ya[a], ha ṅụrịrị ọṅụ n’ihi agbamume ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ịsụgharị ya: “ha ṅụrịrị ọṅụ n’ihi agbamume ahụ.” Okwu Grik a sụgharịrị “agbamume” nwekwara ike ịpụta “ndụmọdụ” ma ọ bụ “nkasi obi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναγνόντες
  choice: Mgbe ha gụchara ya
  rationale: Aorist participle a na-egosi ihe mere tupu ngwaa bụ isi. ‘Ya’ na-ezo aka n’akwụkwọ ozi a kpọrọ aha n’amaokwu bu ụzọ, ma okwu a na-ada nke ọma n’Igbo oge a.
- source_word: δὲ
  choice: njikọ ahụ pụtara site n’usoro ahịrịokwu, na-enweghị okwu ọzọ
  rationale: δέ bụ njikọ dị nro. N’Igbo, ‘Mgbe’ na usoro ahịrịokwu a ejikọtala echiche ahụ nke ọma; ịgbakwunye ‘ma’ nwere ike ime ka o yie ihe na-emegide ihe bu ụzọ.
- source_word: ἐχάρησαν
  choice: ha ṅụrịrị ọṅụ
  rationale: Nke a na-egosipụta ọṅụ siri ike nke χαίρω karịa naanị ịsị na obi dị ha ụtọ.
- source_word: ἐπὶ
  choice: n’ihi
  rationale: ἐπί ya na dative n’ebe a na-egosi ihe kpatara ọṅụ ahụ; ‘n’ihi’ na-akọwa mmekọrịta a n’Igbo doro anya.
- source_word: τῇ παρακλήσει
  choice: agbamume dị n’ime ya
  rationale: παράκλησις nwere ike ịbụ agbamume, ndụmọdụ siri ike, ma ọ bụ nkasi obi. N’ọnọdụ a, ‘agbamume’ na-ejide mmetụta akwụkwọ ozi ahụ nke iwusi ndị kwere ekwe obi, ebe ‘dị n’ime ya’ na-eme ka o doo anya na ọ sitere n’ozi dị n’akwụkwọ ahụ.
theological_decisions: []
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, dị mfe ma dị nsọ. E chekwara ihe okwu παράκλησις nwere ike ịpụta site n’ihe odide ala ala peeji kama imechi ya naanị n’otu nkọwa.
