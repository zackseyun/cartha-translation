  text: Μετὰ ταῦτα ἀναστρέψω καὶ ἀνοικοδομήσω τὴν σκηνὴν Δαυὶδ τὴν πεπτωκυῖαν καὶ τὰ ⸀κατεσκαμμένα αὐτῆς ἀνοικοδομήσω καὶ ἀνορθώσω αὐτήν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/016.yaml
  text: After these things I will return[a], and I will rebuild the fallen tent of David; I will rebuild its ruins, and I will restore it[b],
translation:
  language: ig
  text: Mgbe ihe ndị a gasịrị, m ga-alọghachi; m ga-ewughachi ụlọikwuu Devid ahụ dara ada; m ga-ewughachi mkpọmkpọ ebe ya, meekwa ka ọ guzoro ọtọ ọzọ[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: “Ụlọikwuu Devid” bụ ihe atụ amụma nke nwere ike izo aka na mweghachi metụtara usoro eze ma ọ bụ alaeze Devid.
    reason: cross_reference
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: Mgbe ihe ndị a gasịrị
  rationale: Nke a na-edobe ọtụtụ ihe dị na ταῦτα ma na-egosipụta mgbanwe oge ahụ n'Igbo doro anya.
- source_word: ἀναστρέψω
  choice: m ga-alọghachi
  rationale: N'ọnọdụ a, ngwaa ahụ pụtara ịlọghachi; ntụgharị a na-edobekwa nkwa onye mbụ nke Chineke.
- source_word: ἀνοικοδομήσω
  choice: m ga-ewughachi
  rationale: Ọ na-egosi iwu ihe ọzọ mgbe ọ dara ma ọ bụ mgbe e bibiri ya; “wughachi” bụ okwu Igbo dị mkpirikpi ma doo anya.
- source_word: σκηνὴν Δαυὶδ
  choice: ụlọikwuu Devid
  rationale: σκηνή pụtara ụlọikwuu ma nwee ike izo aka n'ụlọikwuu ofufe. A hapụrụ ihe atụ amụma ahụ dịka ọ dị kama ịkọwa ya ozugbo dịka usoro eze ma ọ bụ alaeze Devid.
- source_word: τὴν πεπτωκυῖαν
  choice: ahụ dara ada
  rationale: Perfect participle ahụ na-egosi na ụlọikwuu ahụ adawo ma ka nọ n'ọnọdụ ọdịda; “dara ada” na-enye echiche ahụ n'Igbo nkịtị.
- source_word: τὰ κατεσκαμμένα αὐτῆς
  choice: ebe ya ndị e bibiri ebibi
  rationale: Nke a na-anọchi ihe ma ọ bụ akụkụ ya ndị a kwaturu; okwu a na-egosi mbibi ahụ n'ụzọ ndị na-agụ Igbo ga-aghọta nke ọma.
- source_word: ἀνορθώσω
  choice: meekwa ka o guzosie ike ọzọ
  rationale: Ngwaa ahụ nwere echiche ime ka ihe kwụrụ ọtọ ọzọ ma ọ bụ iweghachi ya. Nhọrọ a na-echekwa ihe oyiyi nke iweli ụlọikwuu dara ada, ọ bụghị naanị echiche izugbe nke mweghachi.
- source_word: αὐτήν
  choice: o
  rationale: Nnọchiaha ahụ na-ezo aka n'ụlọikwuu Devid; “o” bụ nnọchiaha Igbo kwesịrị ekwesị n'ọnọdụ a.
theological_decisions:
- issue: Ihe atụ dị n'okwu “ụlọikwuu Devid”
  choice: E debere ihe atụ ahụ dịka “ụlọikwuu Devid.”
  alternative: usoro eze Devid; alaeze Devid; ụlọ Devid
  rationale: Ọ bụ ezie na amụma ahụ nwere ike izo aka na mweghachi metụtara agbụrụ eze ma ọ bụ alaeze Devid, Grik ahụ n'onwe ya ji ihe oyiyi ụlọikwuu. Ịhapụ ya otu a na-echekwa nghọta na esemokwu dị n'amụma ahụ n'enweghị ịmanye otu nkọwa.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ “ụlọikwuu” iji debe ihe oyiyi Grik ahụ, ebe “meekwa ka o guzosie ike ọzọ” na-egosipụta nke ọma ihe oyiyi nke iweli ihe dara ada.
