revisions:
- from: Mgbe ihe ndị a gasịrị, m ga-alọghachi, wughachikwa ụlọikwuu Devid ahụ dara ada[a]. M ga-ewughachi ebe ya ndị e bibiri ebibi, meekwa ka o guzosie ike ọzọ[b],
  to: Mgbe ihe ndị a gasịrị, m ga-alọghachi; m ga-ewughachi ụlọikwuu Devid ahụ dara ada; m ga-ewughachi mkpọmkpọ ebe ya, meekwa ka ọ guzoro ọtọ ọzọ[b],
  rationale: The revision replaces an inaccurate reference to destroyed “places” with an idiomatic rendering of the tent’s ruins, and it makes the final verb’s image of raising the fallen structure upright more explicit. The source’s metaphor, repeated rebuilding, future promises, and sentence-final comma are retained. Footnote a is not anchored in the supplied text and is therefore omitted; the remaining footnote anchor is retained and its explanation is appropriately qualified.
