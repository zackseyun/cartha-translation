review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately represents the principal Greek elements: a subset of Pharisees who had believed, their rising/speaking, the stated necessity of circumcision, and observance of Moses’ law. However, “nyekwa ha iwu” is not well integrated under “Ọ dị mkpa ka …” and can read as an imperative-like/additive formulation rather than the second infinitive governed by δεῖ.'
  naturalness: The wording is generally clear Standard Igbo. Recasting the second demanded action with “ka e nye ha iwu ka ha debe” produces a natural, parallel construction and keeps the unnamed agents implicit, as in Greek.
  terminology: “òtù ndị Farisii,” “bie ha úgwù,” and “Iwu Mosis” are suitable. The note appropriately guards against importing the later technical sense of αἵρεσις. “òtù okpukpe” is a serviceable alternative, though “sekịtị” need not be introduced.
  issues:
  - severity: medium
    issue: The coordinated phrase “nyekwa ha iwu” lacks the passive/impersonal framing and syntactic parallelism of the preceding “ka e bie ha úgwù.”
    rationale: Greek has two infinitives, περιτέμνειν and παραγγέλλειν, both governed by δεῖ; the latter takes αὐτούς as the people commanded to keep the law. “ka e nye ha iwu ka ha debe” clearly conveys this relationship without adding an explicit commander.
  revised_text: Ma ụfọdụ n’ime ndị si n’òtù ndị Farisii[a], bụ́ ndị kweere, biliri kwuo, sị, “Ọ dị mkpa ka e bie ha úgwù, na ka e nye ha iwu ka ha debe Iwu Mosis.”
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “òtù okpukpe ndị Farisii.” Okwu Grik e ji mee ihe n’ebe a pụtara òtù ma ọ bụ ụlọ akwụkwọ echiche a maara nke ọma; ọ pụtaghị kpọmkwem “ozizi ụgha” n’echiche pụrụ iche e nyere ya n’oge e mesịrị.
    reason: lexical_alternative
  revision_rationale: The revision changes only the second infinitival demand into idiomatic, parallel Standard Igbo. It preserves the source’s unspecified authority, the force of the claimed necessity, and the command that the same people keep Moses’ law. The existing footnote marker remains directly attached to the phrase it explains.
