id: ACT.15.5
reference: Acts 15:5
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐξανέστησαν δέ τινες τῶν ἀπὸ τῆς αἱρέσεως τῶν Φαρισαίων πεπιστευκότες, λέγοντες ὅτι δεῖ περιτέμνειν αὐτοὺς παραγγέλλειν τε τηρεῖν τὸν νόμον Μωϋσέως.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/005.yaml
  text: But some of those from the party of the Pharisees who had believed stood up[a], saying that it is necessary to circumcise them and to command them to keep the law of Moses.
translation:
  language: ig
  text: Ma ụfọdụ n’ime ndị si n’òtù ndị Farisii[a], bụ́ ndị kweere, biliri kwuo, sị, “Ọ dị mkpa ka e bie ha úgwù, na ka e nye ha iwu ka ha debe Iwu Mosis.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “òtù okpukpe ndị Farisii.” Okwu Grik e ji mee ihe n’ebe a pụtara òtù ma ọ bụ ụlọ akwụkwọ echiche a maara nke ọma; ọ pụtaghị kpọmkwem “ozizi ụgha” n’echiche pụrụ iche e nyere ya n’oge e mesịrị.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξανέστησαν
  choice: biliri
  rationale: Ọ na-egosi na ha biliri n’ọgbakọ ahụ ka ha kwuo okwu; nsụgharị a na-edobe omume akụkọ ahụ n’etinyeghị nkọwa karịrị ihe Grik kwuru.
- source_word: τινες
  choice: ụfọdụ
  rationale: Nnọchiaha a na-ekwu naanị banyere ụfọdụ ndị, ọ naghị agbakwụnye nwoke ma ọ bụ nkọwa ọzọ na-adịghị na Grik.
- source_word: τῶν ἀπὸ τῆς αἱρέσεως τῶν Φαρισαίων
  choice: ndị si n’òtù ndị Farisii
  rationale: N’ebe a αἵρεσις pụtara òtù ma ọ bụ ụlọ akwụkwọ echiche a maara nke ọma, ọ bụghị ‘ozizi ụgha’ n’echiche e nyere okwu ahụ n’oge e mesịrị.
- source_word: πεπιστευκότες
  choice: bụ́ ndị kweere
  rationale: Nke a na-edobe participle perfect dị ka omume okwukwe nke mere eme ma ọnọdụ ya ka na-adị, ma ghara ikpochapụ esemokwu dị n’akụkọ ahụ.
- source_word: λέγοντες
  choice: kwuo, sị
  rationale: Ụzọ Igbo a bụ nke ebumpụta ụwa iji webata kpọmkwem ihe ndị ahụ kwuru, n’enweghị ime ka olu ha sie ike karịa Grik.
- source_word: δεῖ
  choice: Ọ dị mkpa
  rationale: Ọ na-egosipụta mkpa a na-ekwu na ọ dị, ma hapụ onye ma ọ bụ ihe mere ya ji bụrụ iwu n’amaghị ama dịka Grik si mee.
- source_word: περιτέμνειν αὐτούς
  choice: ka e bie ha úgwù
  rationale: Ụdị a na-ada nke ọma n’Igbo ma na-edobe ha dị ka ndị a ga-ebiri úgwù.
- source_word: παραγγέλλειν
  choice: nyekwa ha iwu
  rationale: ‘Nye iwu’ na-edobe ikike na ịdị ike nke ngwaa ahụ; ‘kụziere’ ga-eme ka ọ dị nro karịa isi mmalite.
- source_word: τε τηρεῖν
  choice: ka ha debe
  rationale: ‘Debe’ bụ okwu Igbo doro anya maka idebe ma ọ bụ irubere iwu isi, ma njikọ ahụ na-ejikọta ya na inye iwu.
- source_word: τὸν νόμον Μωϋσέως
  choice: Iwu Mosis
  rationale: Ọ bụ nsụgharị genitive ahụ n’ụzọ Igbo dị mkpirikpi ma doo anya, na-ezo aka n’Iwu e jikọtara na Mosis.
theological_decisions:
- issue: Nsụgharị αἵρεσις n’ihe gbasara òtù ndị Farisii
  choice: òtù
  alternative: òtù okpukpe
  rationale: ‘Òtù’ na-egosi njikọ ha na otu a maara n’etiti ndị Juu, n’ebughị ụzọ maa ha ikpe dị ka ndị ozizi ụgha; e debere nhọrọ nke ‘òtù okpukpe’ n’okpuru ala peeji.
- issue: Ike na oge nke πεπιστευκότες
  choice: bụ́ ndị kweere
  alternative: bụ́ ndị kwere ekwe
  rationale: 'Ụdị ngwaa a na-egosi na ha ekwereworị ma ka na-anọ n’ọnọdụ ahụ. Ọ na-ahapụ esemokwu nkà mmụta okpukpe dị n’amaokwu ahụ: ha kweere, ma ha ka na-achọ ka ndị mba ọzọ bie úgwù ma debe Iwu Mosis.'
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke nwere ugwu ma dị mfe nghọta, dee ya. A tinyere akara ala peeji [a] ozugbo n’akụkụ okwu ọ na-akọwa. A họọrọ usoro okwu na-aga nke ọma n’Igbo, ebe a ka na-edobe mkpa, ikike, na esemokwu dị na isi Grik.
