revisions:
- from: Ma ụfọdụ n’ime ndị si n’òtù ndị Farisii[a], bụ́ ndị kweere, biliri kwuo, sị, “Ọ dị mkpa ka e bie ha úgwù, nyekwa ha iwu ka ha debe Iwu Mosis.”
  to: Ma ụfọdụ n’ime ndị si n’òtù ndị Farisii[a], bụ́ ndị kweere, biliri kwuo, sị, “Ọ dị mkpa ka e bie ha úgwù, na ka e nye ha iwu ka ha debe Iwu Mosis.”
  rationale: The revision changes only the second infinitival demand into idiomatic, parallel Standard Igbo. It preserves the source’s unspecified authority, the force of the claimed necessity, and the command that the same people keep Moses’ law. The existing footnote marker remains directly attached to the phrase it explains.
