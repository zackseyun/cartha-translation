  text: ἀνθρώποις παραδεδωκόσι τὰς ψυχὰς αὐτῶν ὑπὲρ τοῦ ὀνόματος τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/026.yaml
  text: men who have given up their lives for the name of our Lord Jesus the Messiah[a][b].
translation:
  language: ig
  text: ndị ikom tinyeworo ndụ ha n’ihe ize ndụ[a] n’ihi aha Onyenwe anyị Jizọs, bụ́ Mesaya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị nyefeworo ndụ ha”; n’ụzọ nkịtị, Grik kwuru “ndị nyefeworo ndụ ha.” Nke a bụ akpaalaokwu nke pụtara itinye onwe ha n’ihe ize ndụ nke ọnwụ.
    reason: lexical_alternative
  - marker: b
    text: Grik kwuru “Jizọs Kraịst”; a sụgharịrị Χριστός dịka “Mesaya” n’ebe a n’ihi na ọ bụ utu aha pụtara Onye e Tere Mmanụ.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνθρώποις
  choice: ndị ikom
  rationale: Ọ na-arụtụ aka kpọmkwem n’ebe Banabas na Pọl nọ; ya mere, ‘ndị ikom’ dabara karịa okwu izugbe dịka ‘ndị mmadụ.’
- source_word: παραδεδωκόσι
  choice: nyefere … n’ihe ize ndụ
  rationale: Perfect participle nke παραδίδωμι pụtara n’ụzọ nkịtị ‘ndị nyefere’; mgbe e jikọtara ya na ‘ndụ ha,’ ọ na-egosi na ha tinyere ndụ ha n’ihe ize ndụ nke ọnwụ, ọ bụghị na ha anwụọlarị.
- source_word: τὰς ψυχὰς αὐτῶν
  choice: ndụ ha
  rationale: N’ebe a ψυχή pụtara ndụ mmadụ, ọ bụghị mkpụrụobi dị ka akụkụ ime mmụọ.
- source_word: ὑπὲρ
  choice: n’ihi
  rationale: N’ebe a ὑπέρ na-egosi ihe kpatara ha ji tinye ndụ ha n’ihe ize ndụ, ya bụ, n’ihi aha ahụ na ihe ọ na-anọchi anya ya.
- source_word: τοῦ ὀνόματος
  choice: aha
  rationale: E debere ‘aha’ iji chekwaa nghọta Akwụkwọ Nsọ nke na-agụnye onye ahụ, ikike ya, na nsọpụrụ ya.
- source_word: τοῦ κυρίου ἡμῶν
  choice: Onyenwe anyị
  rationale: Nke a bụ okwu Igbo a na-ejikarị asụ κύριος n’ebe ọ bụ utu aha Kraịst.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jizọs, bụ́ Mesaya
  rationale: Jizọs bụ aha; Χριστός bụ utu aha pụtara Mesaya. ‘Bụ́’ na-eme ka usoro ahụ bụrụ Igbo doro anya ma dịkwa mfe ọgụgụ.
theological_decisions:
- issue: Ụzọ e si asụ Χριστοῦ n’usoro utu aha κυρίου ἡμῶν Ἰησοῦ Χριστοῦ
  choice: Mesaya
  alternative: Kraịst
  rationale: N’ebe a Χριστός ka na-arụ ọrụ dịka utu aha nke pụtara Onye E Tere Mmanụ; ‘Mesaya’ na-egosipụta ihe okwu Grik ahụ pụtara kama iji naanị ụdị e deregharị edegharị.
- issue: Ma παραδεδωκόσι τὰς ψυχὰς αὐτῶν ọ̀ pụtara ọnwụ emeelarị
  choice: Ha tinyere ndụ ha n’ihe ize ndụ nke ọnwụ
  alternative: Ha ahapụla ma ọ bụ chụọla ndụ ha n’àjà n’ezie
  rationale: Akpaalaokwu ahụ siri ike, ma ọnọdụ ahụ anaghị ekwu na Banabas na Pọl anwụọla. Ya mere, e chekwara echiche nke inyefe ndụ n’ọnọdụ nwere ike iweta ọnwụ n’akwụsịghị ya dịka ọnwụ emeelarị.
translation_notes:
  register: Igbo ọkọlọtọ, dị ùgwù ma bụrụkwa nke ndị na-agụ akwụkwọ taa ga-aghọta. E ji ‘n’ihe ize ndụ’ kọwaa ike akpaalaokwu Grik ahụ n’enweghị ikwu na ndị ahụ anwụọlarị; a hapụrụ ‘aha’ dịka okwu Akwụkwọ Nsọ sara mbara.
