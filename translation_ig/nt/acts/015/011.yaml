  text: ἀλλὰ διὰ τῆς χάριτος τοῦ κυρίου Ἰησοῦ πιστεύομεν σωθῆναι καθ’ ὃν τρόπον κἀκεῖνοι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/011.yaml
  text: But through the grace of the Lord Jesus we believe that we will be saved[b][a], just as they also will be.
translation:
  language: ig
  text: Kama, anyị kwenyere na a ga-azọpụta anyị site n’amara Onyenwe anyị Jizọs, dị nnọọ ka a ga-azọpụtakwa ha.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'N’ụzọ na-agbaso usoro okwu Grik nso: “anyị kwenyere na a ga-azọpụta anyị site n’amara Onyenwe anyị Jizọs, n’otu ụzọ ahụ ha kwa (ga-adị).”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Kama
  rationale: Okwu a na-egosi mgbanwe siri ike megide echiche e kwuru n’amaokwu bu ya ụzọ; “Kama” na-eweta ike mgbagha ahụ n’Igbo doro anya.
- source_word: διὰ τῆς χάριτος
  choice: site n’amara
  rationale: διά na genitive na-egosi ụzọ ma ọ bụ ihe e ji eme ihe; “site n’amara” bụ ụzọ Igbo si ekwu ya nke ọma.
- source_word: χάριτος
  choice: amara
  rationale: “Amara” bụ okwu Igbo a na-ejikarị akọwa ihu ọma Chineke nke mmadụ na-erughị eru inweta, ma dabara n’ọnọdụ nzọpụta a.
- source_word: τοῦ κυρίου Ἰησοῦ
  choice: Onyenwe anyị Jizọs
  rationale: Aha nsọpụrụ a bụ usoro Igbo a maara nke ọma maka κύριος Ἰησοῦ; genitive ahụ jikọtara amara ahụ na Jizọs.
- source_word: πιστεύομεν
  choice: anyị kwenyere
  rationale: N’ebe a, πιστεύομεν na-egosi nkwenye siri ike banyere ihe a na-ekwu n’okwu na-esochi ya.
- source_word: σωθῆναι
  choice: na a ga-azọpụta anyị
  rationale: Infinitive passive ahụ na-adabakarị n’Igbo dịka nkebiokwu zuru ezu; “a ga-azọpụta anyị” na-egosi atụmanya nzọpụta dị n’okwu a n’enweghị ịgbakwunye usoro ozizi ọzọ.
- source_word: καθ’ ὃν τρόπον
  choice: dị nnọọ ka
  rationale: Nke a na-egosipụta ntụnyere ụzọ ma ọ bụ otu ihe si mee n’Igbo dị mfe ma kwekọọ na idiom Grik ahụ.
- source_word: κἀκεῖνοι
  choice: a ga-azọpụtakwa ha
  rationale: καὶ dị n’ime κἀκεῖνοι ka e chekwara site na “-kwa,” ebe “ha” na-ezo aka ná ndị mba ọzọ; e tinyere ngwaa a ghọtara site na nkebiokwu mbụ iji mee ka Igbo zuo oke.
theological_decisions:
- issue: Akụkụ ntụnyere Pita kwuru na-eche ihu na ya
  choice: 'E debere “anyị” dịka ndị a na-atụnyere “ha”: a ga-azọpụta ndị Juu kwere ekwe dị nnọọ ka a ga-azọpụta ndị mba ọzọ.'
  alternative: Ịtụgharị ntụnyere ahụ ka ọ bụrụ na a ga-azọpụta ndị mba ọzọ dịka a ga-azọpụta ndị Juu.
  rationale: Usoro okwu Grik malitere na “anyị kwenyere na a ga-azọpụta anyị” ma mesịa kwuo “dị ka ha kwa.” Nke a dị mkpa n’ọnọdụ ahụ, n’ihi na ọ naghị eme ka ndị mba ọzọ buru ụzọ ghọọ ndị Juu.
- issue: Nzọpụta site n’amara
  choice: E kwuru naanị na nzọpụta sitere n’amara Onyenwe anyị Jizọs, dịka amaokwu ahụ si kwuo.
  alternative: Ịgbakwunye nkọwa dịka “site n’amara naanị” ma ọ bụ usoro ozizi zuru ezu banyere okwukwe na ọrụ.
  rationale: Amaokwu ahụ kpọrọ amara na nkwenye aha, ma ọ naghị ekwupụta usoro ozizi ndị ọzọ; nsụgharị ahụ ekwesịghị itinye ihe ederede na-ekwughị.
- issue: Oge nke σωθῆναι
  choice: A sụgharịrị ya “a ga-azọpụta anyị,” nke na-egosi atụmanya nzọpụta n’ọnọdụ okwu ahụ.
  alternative: “Ka a zọpụta anyị” ma ọ bụ “ịbụ ndị a zọpụtara,” nke na-esochi infinitive Grik ahụ nso ma ghara ịkọwapụta oge.
  rationale: Aorist infinitive Grik ahụ anaghị egosi ọdịnihu n’onwe ya dịka finite future, ma nkwenye na ọnọdụ okwu ahụ na-akwado ntụgharị ọdịnihu n’Igbo. E debere ụdị nke na-esochi Grik nso na nkọwa ala peeji.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ “Kama” maka mgbagha siri ike, “site n’amara” maka ụzọ nzọpụta, ma chekwaa ntụnyere nke na-eme ka “anyị” (ndị Juu kwere ekwe) soro ụzọ e si azọpụta “ha” (ndị mba ọzọ).
