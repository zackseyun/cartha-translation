revisions:
- from: Ya mere, mgbe e zipụrụ ha ka ha laa[a], ha rịdara[b] gaa Antiọk. Mgbe ha kpọkọtara ìgwè ndị ahụ[c], ha nyefere ha akwụkwọ ozi ahụ.
  to: Ya mere, mgbe a zilatara ha ka ha laa[a], ha gbadara[b] gaa Antiọk. Mgbe ha kpọkọtara ìgwè mmadụ ahụ[c], ha nyefere ha akwụkwọ ozi ahụ.
  rationale: The revision makes the directional verb and reference to the gathered multitude idiomatic in Standard Igbo, and repairs the geographical wording in footnote b. It retains the source's aorist sequence, the contextual but nonexclusive sense of ἀπολυθέντες, and the ambiguity of τὸ πλῆθος.
