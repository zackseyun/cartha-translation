source:
  edition: SBLGNT
  text: Οἱ μὲν οὖν ἀπολυθέντες ⸀κατῆλθον εἰς Ἀντιόχειαν, καὶ συναγαγόντες τὸ πλῆθος ἐπέδωκαν τὴν ἐπιστολήν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/030.yaml
  text: So[a], after being sent off, they went down to Antioch, and after gathering the multitude[c][b], they delivered the letter.
translation:
  language: ig
  text: Ya mere, mgbe a zilatara ha ka ha laa[a], ha gbadara[b] gaa Antiọk. Mgbe ha kpọkọtara ìgwè mmadụ ahụ[c], ha nyefere ha akwụkwọ ozi ahụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “mgbe a hapụrụ ha ka ha laa” ma ọ bụ “mgbe a sịrị ha laa.” Okwu Grik ahụ pụrụ ịpụta iziga mmadụ ka ọ laa ma ọ bụ ịhapụ ya n’ụzọ iwu kwadoro.
    reason: lexical_alternative
  - marker: b
    text: “Ha gbadara” na-egosipụta ntụziaka dị n’okwu Grik ahụ; o yikarịrị ka ọ na-ezo aka n’ịgbada site na Jerusalem, nke dị elu, gaa Antiọk.
    reason: cultural_note
  - marker: c
    text: A pụkwara ịsụgharị ya, “nzukọ ahụ” ma ọ bụ “ọgbakọ ahụ.” Ọ na-ezo aka n’ìgwè ndị gbakọtara n’Antiọk.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπολυθέντες
  choice: mgbe e zipụrụ ha ka ha laa
  rationale: Nkebi okwu a na-egosi na e nyere ha ikike ka ha pụọ ma ziga ha n'ụzọ; ntụgharị a dabara n'ọnọdụ ahụ ma na-ada nke ọma n'Igbo.
- source_word: κατῆλθον
  choice: ha rịdara gaa
  rationale: Nke a na-echekwa echiche ntụziaka dị na ngwaa Grik, ya bụ isi n'ebe dị elu dị ka Jerusalem rịdata gaa Antiọk.
- source_word: συναγαγόντες
  choice: mgbe ha kpọkọtara
  rationale: Ọ na-egosi omume e mere tupu inyefe akwụkwọ ozi ahụ ma na-echekwa usoro ihe omume dị n'amaokwu ahụ.
- source_word: τὸ πλῆθος
  choice: ìgwè ndị ahụ
  rationale: Okwu a na-ezo aka n'ọtụtụ ndị gbakọtara n'Antiọk n'ebughị ụzọ kpebie na ọ bụ aha nzukọ ụka e ji eme ihe n'ụzọ iwu kwadoro.
- source_word: ἐπέδωκαν
  choice: ha nyefere ha
  rationale: ‘Nyefere’ na-egosi inyefe akwụkwọ ozi ahụ n'ụzọ doro anya nye ìgwè ahụ.
- source_word: ἐπιστολήν
  choice: akwụkwọ ozi ahụ
  rationale: Nke a bụ okwu Igbo nkịtị, nke oge a, maka akwụkwọ ozi ahụ e dere zigara ndị Antiọk.
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta mee ntụgharị ahụ. E debere usoro omume na nghọta ntụziaka nke Grik, ma zere okwu ụka pụrụ ime ka ihe τὸ πλῆθος pụtara dị warara karịa ka isi mmalite si kwuo.
