- from: Chineke[a], onye maara obi mmadụ, gbara ha akaebe site n’inye ha Mmụọ Nsọ, dị nnọọ ka o nyere anyị ya.
  to: Chineke[a], onye maara obi mmadụ niile, gbara ha akaebe site n’inye ha Mmụọ Nsọ, dịka o nyekwara anyị.
  rationale: The revision clarifies that God knows the inner hearts of people, reflecting καρδιογνώστης, and smooths the final comparison in Standard Igbo. It preserves the unspecified referent of “ha,” the evidentiary sense of ἐμαρτύρησεν, and the means expressed by “site n’inye.”
