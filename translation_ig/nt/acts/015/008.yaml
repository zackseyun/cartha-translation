  text: καὶ ὁ καρδιογνώστης θεὸς ἐμαρτύρησεν αὐτοῖς ⸀δοὺς τὸ πνεῦμα τὸ ἅγιον καθὼς καὶ ἡμῖν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/008.yaml
  text: And God[a], who knows the heart, bore witness to them by giving them the Holy Spirit just as he did to us,
translation:
  language: ig
  text: Chineke[a], onye maara obi mmadụ niile, gbara ha akaebe site n’inye ha Mmụọ Nsọ, dịka o nyekwara anyị.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Chineke, onye maara obi mmadụ niile.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καρδιογνώστης
  choice: onye maara obi mmadụ
  rationale: Ngwakọta okwu Grik a pụtara onye maara obi, ya bụ, ihe dị n’ime mmadụ. Nkebi ahịrịokwu a bụ Igbo kwụ ọtọ ma na-edobe ya dị ka àgwà Chineke.
- source_word: θεὸς
  choice: Chineke
  rationale: Nke a bụ ntụgharị Igbo a na-ejikarị eme θεός n’ebe a.
- source_word: ἐμαρτύρησεν αὐτοῖς
  choice: gbara ha akaebe
  rationale: Nke a na-edobe echiche nke ịgba akaebe ma na-agbaso ụzọ e si ekwu ya n’Igbo. ‘Ha’ ka bụ nnọchiaha dịka ọ dị na Grik; ihe gbara amaokwu ahụ gburugburu na-egosi ndị ọ na-ekwu maka ha.
- source_word: δοὺς
  choice: site n’inye
  rationale: 'Ọ na-egosi ụzọ Chineke si gbaa ha akaebe: ọ bụ site n’inye ha Mmụọ Nsọ.'
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: Mmụọ Nsọ
  rationale: Nke a bụ aha a na-ejikarị eme Mmụọ Nsọ n’Igbo nke oge a.
- source_word: καθὼς καὶ ἡμῖν
  choice: dị nnọọ ka o nyere anyị ya
  rationale: Grik hapụrụ ngwaa ahụ ka a ghọta ya site n’ihe e kwuru tupu ya. Igbo chọrọ ka e kwughachi echiche nke inye; ‘ya’ na-ezo aka na Mmụọ Nsọ.
theological_decisions:
- issue: Onyinye Mmụọ Nsọ dị ka akaebe Chineke nyere ha n’otu ụzọ ahụ o si nye ndịozi na ndị ha na ha nọ
  choice: E debere ‘ha’ na ‘anyị’ dịka Grik si kwuo, n’etinyeghị ‘ndị mba ọzọ’ n’ime amaokwu ahụ.
  alternative: A gaara asị ‘ndị mba ọzọ’ kama ‘ha.’
  rationale: Nnọchiaha αὐτοῖς n’onwe ya apụtaghị ‘ndị mba ọzọ’; amaokwu ndị gbara ya gburugburu na-eme ka ndị ọ na-ezo aka na ha doo anya. Nke a na-ezere itinye nkọwa n’ime ederede ahụ.
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E ji ‘onye maara obi mmadụ’ mee ka okwu ngwakọta Grik dị ụkọ bụrụ okwu Igbo eke, ebe nkọwa ala peeji na-edobe ntụgharị ọzọ nke dị nso n’usoro okwu Grik.
