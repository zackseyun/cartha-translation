    text: Ma ọ bụ, “ụmụnna nwoke na nwanyị.” Okwu Grik ahụ pụtara “ụmụnna nwoke,” ma o yikarịrị ka ọ na-ezo aka n’ọgbakọ ndị kwere ekwe niile, tinyere nwoke na nwanyị.
    reason: lexical_alternative
  revision_rationale: 'The revision corrects the conditional-negative form to idiomatic Standard Igbo and slightly smooths the narrative flow. It does not alter the meaning: certain people came down from Judea and kept teaching that circumcision according to Mosaic custom was required for salvation.'
