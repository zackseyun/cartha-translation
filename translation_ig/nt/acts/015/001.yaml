  to: Ụfọdụ ndị si Judia rịdata, ha na-akụziri ụmụnna[a] sị, “Ọ bụrụ na e bighị unu úgwù dịka omenala Mosis si dị, a pụghị ịzọpụta unu.”
  rationale: 'The revision corrects the conditional-negative form to idiomatic Standard Igbo and slightly smooths the narrative flow. It does not alter the meaning: certain people came down from Judea and kept teaching that circumcision according to Mosaic custom was required for salvation.'
