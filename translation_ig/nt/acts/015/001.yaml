id: ACT.15.1
reference: Acts 15:1
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Καί τινες κατελθόντες ἀπὸ τῆς Ἰουδαίας ἐδίδασκον τοὺς ἀδελφοὺς ὅτι Ἐὰν μὴ ⸀περιτμηθῆτε τῷ ἔθει ⸀τῷ Μωϋσέως, οὐ δύνασθε σωθῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/001.yaml
  text: And some men came down from Judea and were teaching the brothers[a], “Unless you are circumcised according to the custom of Moses, you cannot be saved.”
translation:
  language: ig
  text: Ụfọdụ ndị si Judia rịdata, ha na-akụziri ụmụnna[a] sị, “Ọ bụrụ na e bighị unu úgwù dịka omenala Mosis si dị, a pụghị ịzọpụta unu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ụmụnna nwoke na nwanyị.” Okwu Grik ahụ pụtara “ụmụnna nwoke,” ma o yikarịrị ka ọ na-ezo aka n’ọgbakọ ndị kwere ekwe niile, tinyere nwoke na nwanyị.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καί
  choice: wee
  rationale: Njikọ a na-edobe usoro akụkọ Luk n'ụzọ Igbo si ada nke ọma, n’enweghị ịgbakwunye nkọwa ọhụrụ.
- source_word: τινες
  choice: Ụfọdụ ndị
  rationale: Ọ na-egosi ụfọdụ mmadụ a na-akpọghị aha. ‘Ndị’ bụ okwu Igbo dị mfe ma ghara ịkọwa karịa ihe Grik kwuru.
- source_word: κατελθόντες ἀπὸ τῆς Ἰουδαίας
  choice: si Judia rịdata
  rationale: Ọ na-edobe echiche mmegharị nke ‘ịrịdata’ site na Judia gaa ebe akụkọ ahụ nọ.
- source_word: ἐδίδασκον
  choice: na-akụziri
  rationale: Ụdị ngwaa a na-egosi omume gara n’ihu ma ọ bụ nke a na-eme ugboro ugboro; ‘na-akụziri’ na-edobe akụkụ ahụ.
- source_word: τοὺς ἀδελφοὺς
  choice: ụmụnna
  rationale: ‘Ụmụnna’ bụ okwu Igbo kwesịrị ekwesị maka ndị otu okwukwe, ma nwee ike ịgụnye nwoke na nwanyị dịka ọnọdụ a siri dị; nkọwa ala peeji na-eme ka ọdịdị okwu Grik doo anya.
- source_word: Ἐὰν μὴ περιτμηθῆτε
  choice: Ọ bụrụ na e bieghị unu úgwù
  rationale: Nke a bụ ụzọ Igbo doro anya isi kwuo ọnọdụ na-adịghị mma ahụ ma debe ọdịdị nnara-eme nke ngwaa Grik.
- source_word: τῷ ἔθει τῷ Μωϋσέως
  choice: dịka omenala Mosis si dị
  rationale: ἔθος bụ omenala ma ọ bụ omume e guzobere; ntụgharị a anaghị agbakwunye na Mosis nyefere ya n’onwe ya.
- source_word: οὐ δύνασθε σωθῆναι
  choice: a pụghị ịzọpụta unu
  rationale: Ọ na-egosi enweghị ike ịnata nzọpụta, ma debe σωθῆναι n’echiche nzọpụta nke esemokwu a.
theological_decisions:
- issue: Ihe σωθῆναι pụtara n’esemokwu banyere ibi úgwù
  choice: ịzọpụta unu
  alternative: ịnapụta unu
  rationale: Ọnọdụ Kansụl Jerusalem metụtara ma ibi úgwù ọ̀ bụ ihe dị mkpa maka nzọpụta. ‘Ịzọpụta’ na-edobe ike okwu ahụ gbasara nzọpụta n’enweghị itinye ozizi otu chọọchị.
- issue: Otu e si tụgharịa ἀδελφοὺς
  choice: ụmụnna
  alternative: ụmụnna nwoke na nwanyị / ndị kwere ekwe
  rationale: Okwu Grik bụ aha ọtụtụ nke nwoke, ma n’ebe a o nwere ike ịnọchite anya ọgbakọ ndị kwere ekwe niile. ‘Ụmụnna’ bụ okwu Igbo sitere n’okwu ahụ nke na-arụkwa ọrụ n’ụzọ gụnyere ọgbakọ; nkọwa ala peeji na-echekwa ihe dị n’asụsụ Grik.
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe nke oge a, dị mfe ma dị ùgwù. E ji ‘úgwù’ mee ihe maka ibi úgwù, ‘Mosis’ maka Μωϋσῆς, na ‘Judia’ maka Ἰουδαία. Ahịrịokwu ahụ na-edobe omume izi ihe nke na-aga n’ihu na nkwupụta siri ike nke ndị si Judia.
