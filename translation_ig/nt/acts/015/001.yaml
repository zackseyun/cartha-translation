review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the movement from Judea, the ongoing teaching, circumcision according to Mosaic custom, and the salvation-language of σωθῆναι. “a pụghị ịzọpụta unu” is an acceptable Igbo impersonal passive expression for “you cannot be saved.”
  naturalness: The sentence is generally clear and suitably modern in Standard Igbo. In the conditional clause, however, “e bieghị unu úgwù” is less idiomatic than the standard conditional-negative form “e bighị unu úgwù.” Removing “wee” also yields a smoother representation of the Greek participle followed by the imperfect main verb.
  terminology: “Judia,” “Mosis,” “úgwù,” “omenala,” and “ụmụnna” are appropriate. “Ụmụnna” naturally serves for the believing community in this context; the footnote appropriately identifies the more explicit inclusive alternative without making it the main text.
  issues:
  - severity: medium
    issue: Conditional negative verb form
    rationale: In Standard Igbo, the clause after “Ọ bụrụ na” is more naturally and grammatically expressed as “e bighị unu úgwù,” rather than “e bieghị unu úgwù.” This correction retains the source’s negative condition and passive sense.
  - severity: low
    issue: Narrative linkage
    rationale: “ha wee na-akụziri” is understandable, but “ha na-akụziri” is smoother after the initial motion clause and more directly reflects the Greek imperfect “were teaching.”
  revised_text: Ụfọdụ ndị si Judia rịdata, ha na-akụziri ụmụnna[a] sị, “Ọ bụrụ na e bighị unu úgwù dịka omenala Mosis si dị, a pụghị ịzọpụta unu.”
  revised_footnotes:
