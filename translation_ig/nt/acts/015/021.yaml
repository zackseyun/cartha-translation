id: ACT.15.21
reference: Acts 15:21
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Μωϋσῆς γὰρ ἐκ γενεῶν ἀρχαίων κατὰ πόλιν τοὺς κηρύσσοντας αὐτὸν ἔχει ἐν ταῖς συναγωγαῖς κατὰ πᾶν σάββατον ἀναγινωσκόμενος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/021.yaml
  text: For from ancient generations Moses has had those who proclaim him in every city[a], being read in the synagogues every Sabbath.
translation:
  language: ig
  text: N’ihi na kemgbe ọgbọ ndị mgbe ochie, Mozis enweela ndị na-ekwusa ya n’obodo ọ bụla[a], a na-agụkwa ya n’ụlọ nzukọ kwa Ụbọchị Izuike.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'N’ụzọ nkịtị, ọ bụ: “Mozis ... ndị na-ekwusa ya ... a na-agụ ya.” N’ebe a, aha “Mozis” na-anọchi anya ihe odide ya ma ọ bụ iwu e jikọtara ya na ya.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μωϋσῆς
  choice: Mozis
  rationale: Ọ bụ ụdị aha a na-ejikarị eme ihe n’Igbo; a hapụrụ aha onye ahụ dịka ọ dị n’isi mmalite.
- source_word: γὰρ
  choice: N’ihi na
  rationale: Ọ na-egosi na amaokwu a na-enye ihe mere e ji kwuo mkpebi dị n’amaokwu bu ya ụzọ.
- source_word: ἐκ γενεῶν ἀρχαίων
  choice: kemgbe ọgbọ ndị mgbe ochie
  rationale: Nke a na-egosi ihe malitere ogologo oge gara aga ma na-aga n’ihu; ọ na-echekwa echiche nke ọtụtụ ọgbọ.
- source_word: κατὰ πόλιν
  choice: n’obodo ọ bụla
  rationale: Ọ na-egosipụta nkesa ahụ n’ụzọ Igbo dị mfe ma doo anya.
- source_word: τοὺς κηρύσσοντας αὐτὸν
  choice: ndị na-ekwusa ya
  rationale: A chekwara okwu onye nke isi mmalite ji mee ihe, n’agbanyeghị na ‘Mozis’ na-anọchi anya ihe odide ma ọ bụ iwu ya.
- source_word: ἔχει
  choice: enweela
  rationale: Ụdị a na-egosi ọnọdụ malitere n’oge ochie ma ruo ugbu a.
- source_word: ἐν ταῖς συναγωγαῖς
  choice: n’ụlọ nzukọ
  rationale: Nke a bụ okwu Igbo dị mfe maka ebe ndị Juu na-ezukọ maka ofufe na ịgụ Akwụkwọ Nsọ, na-enweghị itinye nkọwa ahụ n’ahịrị isi.
- source_word: κατὰ πᾶν σάββατον
  choice: kwa Ụbọchị Izuike
  rationale: Ọ na-egosi omume a na-eme ugboro ugboro n’Ụbọchị Izuike ọ bụla.
- source_word: ἀναγινωσκόμενος
  choice: a na-agụkwa ya
  rationale: Ụdị enweghị onye kpọmkwem na-eme ihe na-echekwa passive nke Grik; njikọ ‘-kwa’ na-eme ka ahịrịokwu ahụ bụrụ Igbo eke n’etinyeghị causal nuance na-adịghị doo anya n’isi mmalite.
theological_decisions:
- issue: Aha ‘Mozis’ e ji anọchi anya ihe odide ya
  choice: E debere ‘Mozis’ na ‘ya’ n’ahịrị isi.
  alternative: Iwu Mozis enweela ndị na-ekwusa ya; a na-agụkwa ihe odide Mozis.
  rationale: Grik kpọrọ Mozis aha kpọmkwem ma jiri nnọchiaha onye mee ihe. Idebe ya otú ahụ na-echekwa metonymy na esemokwu asụsụ nke isi mmalite kama ịkọwa ya n’ahịrị isi.
- issue: Mmekọrịta nke ἀναγινωσκόμενος na nkebi bu ya ụzọ
  choice: a na-agụkwa ya
  alternative: ebe a na-agụ ya; n’ihi na a na-agụ ya
  rationale: Participle ahụ nwere ike ịkọwa ọnọdụ ma ọ bụ ihe ndabere nke nkwusa ahụ. Nsụgharị a anaghị amanye causal reading nke ‘n’ihi na’ ma na-echekwa eziokwu bụ́ na a na-agụ Mozis kwa Ụbọchị Izuike.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. ‘Kemgbe ... enweela’ na-enye ogologo oge omume ahụ dị, ebe ‘a na-agụkwa ya’ na-eme ka ahịrịokwu ahụ bụrụ Igbo eke ma ghara ịgbakwunye causal nuance na-adịghị kpọmkwem na Grik.
