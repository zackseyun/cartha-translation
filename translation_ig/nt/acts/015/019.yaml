id: ACT.15.19
reference: Acts 15:19
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: διὸ ἐγὼ κρίνω μὴ παρενοχλεῖν τοῖς ἀπὸ τῶν ἐθνῶν ἐπιστρέφουσιν ἐπὶ τὸν θεόν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/019.yaml
  text: Therefore I judge that we should not trouble those from among the Gentiles who are turning to God[b][a],
translation:
  language: ig
  text: Ya mere, mkpebi m bụ ka anyị ghara ịkpatara ndị si n’etiti ndị mba ọzọ na-echigharịkwute Chineke nsogbu[b][a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị si n’etiti mba dị iche iche.” Okwu Grik ahụ pụrụ ịpụta “mba dị iche iche,” ma n’ebe a ọ na-ezo aka ná ndị na-abụghị ndị Juu na-echigharịkwute Chineke.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ana m ekpebi ka anyị ghara ịkpatara ha nsogbu,” ma ọ bụ, “ọ bụ mkpebi m ka a ghara ịkpatara ha nsogbu.”
    reason: alternative_reading
lexical_decisions:
- source_word: διὸ
  choice: Ya mere
  rationale: Ọ na-egosi nkwubi okwu Jemis sitere n’ihe o kwuru tupu nke a; okwu Igbo a na-egosipụta njikọ ahụ nke ọma.
- source_word: ἐγὼ κρίνω
  choice: mkpebi m bụ
  rationale: Ọ na-edobe onye mbụ nke ἐγώ ma na-egosi na nke a bụ mkpebi Jemis tụlere nke ọma, ọ bụghị naanị echiche na-enweghị ibu.
- source_word: μὴ παρενοχλεῖν
  choice: ka anyị ghara ịkpatara ... nsogbu
  rationale: Ọ na-egosi ihe dị n’ime mkpebi ahụ ma na-ebunye echiche nke ịkpatara mmadụ ihe isi ike ma ọ bụ ọgba aghara n’Igbo dị mfe nghọta.
- source_word: τοῖς ἀπὸ τῶν ἐθνῶν
  choice: ndị si n’etiti ndị mba ọzọ
  rationale: Ọ na-ezo aka n’ụfọdụ mmadụ sitere n’etiti ndị na-abụghị ndị Juu, ma na-edobe nghọta nke ἀπό.
- source_word: ἐπιστρέφουσιν
  choice: na-echigharịkwute
  rationale: Ọ na-edobe ihe oyiyi nke mmadụ ịtụgharị ụzọ ya chee ihu n’ebe Chineke nọ, nakwa omume nke na-aga n’ihu.
- source_word: ἐπὶ τὸν θεόν
  choice: Chineke
  rationale: Mgbe e jikọtara ya na ‘na-echigharịkwute,’ ọ na-egosi ebe ntụgharị ahụ na-aga n’ụzọ Igbo na-ada nke ọma.
theological_decisions:
- issue: Ma a ga-egosi okwu a dịka naanị echiche onwe Jemis ka ọ bụ dịka mkpebi ọ na-atụ aro ka nzukọ ahụ soro
  choice: “mkpebi m bụ ka anyị ghara…”
  alternative: “ana m ekpebi ka a ghara…” ma ọ bụ “uche m bụ ka a ghara…”
  rationale: Asụsụ Grik kwuru onye mbụ n’otu n’ụzọ doro anya, ma infinitive ahụ na-egosi mkpebi bara uru nye ọgbakọ dum. Nsụgharị a na-edobe ma olu onwe Jemis ma mmetụta mkpebi ahụ n’ebe ha niile nọ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “Ndị mba ọzọ” bụ okwu a na-aghọta nke ọma maka ndị na-abụghị ndị Juu n’ọnọdụ a; ihe odide ala ala peeji na-edobe ntụgharị nkịtị “mba dị iche iche.”
