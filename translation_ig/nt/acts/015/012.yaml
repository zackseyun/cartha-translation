    text: Ma ọ bụ, “n’etiti mba dị iche iche.” N’ebe a, okwu Grik ἔθνεσιν na-ezo aka kpọmkwem n’ebe ndị na-abụghị ndị Juu nọ, n’ọnọdụ nzukọ Jeruselem a.
    reason: lexical_alternative
