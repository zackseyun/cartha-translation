id: ACT.15.12
reference: Acts 15:12
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἐσίγησεν δὲ πᾶν τὸ πλῆθος, καὶ ἤκουον Βαρναβᾶ καὶ Παύλου ἐξηγουμένων ὅσα ἐποίησεν ὁ θεὸς σημεῖα καὶ τέρατα ἐν τοῖς ἔθνεσιν δι’ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/012.yaml
  text: And the whole assembly fell silent[a], and they listened to Barnabas and Paul as they related what signs and wonders God had done among the Gentiles through them.
translation:
  language: ig
  text: Ọgbakọ ahụ dum wee gbachi nkịtị, ha wee na-ege Banabas na Pọl ntị ka ha na-akọ ihe ịrịba ama na ọrụ ebube niile Chineke mere n’etiti ndị mba ọzọ site n’aka ha.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’etiti mba dị iche iche.” N’ebe a, okwu Grik ἔθνεσιν na-ezo aka kpọmkwem n’ebe ndị na-abụghị ndị Juu nọ, n’ọnọdụ nzukọ Jeruselem a.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐσίγησεν
  choice: wee gbachi nkịtị
  rationale: Aorist ahụ na-egosi na ọgbakọ ahụ si n’ịkpọtụrụ okwu banye n’ịgbachi nkịtị; okwu a bụ nke e ji ekwu Igbo nke ọma ma na-echekwa mmegharị ahụ.
- source_word: πᾶν τὸ πλῆθος
  choice: ọgbakọ ahụ dum
  rationale: N’ọnọdụ nzukọ Jeruselem a, πλῆθος bụ ndị niile gbakọrọ maka mkparịta ụka ahụ, ọ bụghị naanị igwe mmadụ nọ n’ebe ọ bụla.
- source_word: ἤκουον
  choice: ha wee gee ... ntị
  rationale: Ụdị imperfect na-egosi na ha nọgidere na-ege ntị nke ọma; ‘ige ntị’ na-egosi nlebara anya karịa nanị ịnụ ihe.
- source_word: Βαρναβᾶ καὶ Παύλου
  choice: Banabas na Pọl
  rationale: E dere aha ndị a n’ụdị a na-ejikarị eme ihe n’Igbo.
- source_word: ἐξηγουμένων
  choice: ka ha na-akọ
  rationale: Okwu a pụtara ịkọ akụkọ ma ọ bụ inye nkọwa zuru ezu banyere ihe mere; ‘na-akọ’ dabara n’akụkọ a ma ghara ịgbakwunye echiche nke ịkọwa ozizi.
- source_word: ὅσα ... σημεῖα καὶ τέρατα
  choice: ihe ịrịba ama na ọrụ ebube niile
  rationale: ‘Niile’ na-egosipụta ὅσα nke na-akọwa ọnụ ọgụgụ ihe ịrịba ama na ọrụ ebube ha kọrọ.
- source_word: ἐποίησεν ὁ θεὸς
  choice: Chineke ... mee
  rationale: Nhazi ahịrịokwu Grik mere Chineke onye rụrụ ọrụ ndị ahụ; ntụgharị a na-echekwa ịbụ onye isi na-eme ihe ahụ.
- source_word: σημεῖα καὶ τέρατα
  choice: ihe ịrịba ama na ọrụ ebube
  rationale: Nke a bụ ụzọ doro anya ma bụrụkwa nke ndị na-agụ Akwụkwọ Nsọ n’Igbo maara maka okwu abụọ Luk jikọtara ọnụ.
- source_word: ἐν τοῖς ἔθνεσιν
  choice: n’etiti ndị mba ọzọ
  rationale: N’ọnọdụ Ọrụ Ndị Ozi 15, okwu a na-ezo aka n’ebe ndị na-abụghị ndị Juu nọ; ‘ndị mba ọzọ’ na-enye nghọta ahụ nke ọma, ebe ‘mba dị iche iche’ ka bụkwa nkọwa okwu nwere ike ịdị.
- source_word: δι’ αὐτῶν
  choice: ji ha mee
  rationale: διά ya na genitive na-egosi na Chineke bụ onye na-eme ihe, ebe Banabas na Pọl bụ ndị o ji rụọ ya; ‘ji ha mee’ na-echekwa ọdịiche a n’Igbo.
theological_decisions:
- issue: Chineke bụ onye na-arụ ọrụ n’ozi ndị ozi
  choice: E gosiri Chineke dịka onye mere ihe ịrịba ama na ọrụ ebube, ebe ọ bụ Banabas na Pọl ka o ji mee ha.
  alternative: Ikwu ya dịka a ga-asị na Banabas na Pọl bụ ndị bụ isi mere ọrụ ebube ndị ahụ.
  rationale: ὁ θεὸς bụ isiokwu nke ἐποίησεν, ebe δι’ αὐτῶν na-egosi ndị Chineke ji rụọ ọrụ. ‘Chineke ji ha mee’ na-echekwa nke a n’enweghị iwelata ezi òkè ndị ozi ahụ nwere.
translation_notes:
  register: E ji Igbo Izugbe dị ugbu a, nke dị ùgwù ma dị mfe nghọta. ‘Ọgbakọ ahụ dum,’ ‘gbachi nkịtị,’ na ‘gee ... ntị’ na-eme ka ahịrịokwu ahụ bụrụ nke okike n’Igbo, ebe ‘Chineke ji ha mee’ na-echekwa nhazi na isi okwu nke Grik.
