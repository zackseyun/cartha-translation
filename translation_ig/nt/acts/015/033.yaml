review_pass:
  verdict: revise
  source_fidelity: The draft conveys the sequence and the peaceful departure, but “ụmụnna ji udo zilaga ha” leaves the Greek passive ἀπελύθησαν and the relation “from the brothers” less precise. A direct, natural passive construction better represents that the delegates were sent off by the community.
  naturalness: “Mgbe ha nọrọtụrụ oge” is less idiomatic than “Mgbe ha nọsịrị oge.” “E zipụrụ ha n’udo site n’aka ụmụnna” is clear Standard Igbo and naturally expresses a communal send-off.
  terminology: “Ụmụnna” is appropriate for ἀδελφοί. The footnote should identify the inclusive contextual sense without making “ụmụ nwoke na ụmụ nwanyị ndị kwere ekwe” sound like a strict lexical equivalent.
  issues:
  - severity: medium
    issue: The departure clause is syntactically and semantically imprecise.
    rationale: 'The wording “ụmụnna ji udo zilaga ha” makes the brothers an unmarked subject and uses a less clear verb form. The Greek has a passive: they were sent away, with ἀπό marking their departure from the brothers. “E zipụrụ ha n’udo site n’aka ụmụnna” renders this clearly.'
  - severity: low
    issue: “Nọrọtụrụ oge” is awkward in this narrative context.
    rationale: “Mgbe ha nọsịrị oge” is a more natural Standard Igbo expression for having spent some time.
  - severity: low
    issue: The footnote’s proposed alternative is overly expanded and may be read as the lexical meaning of ụmụnna.
    rationale: The note should retain “ụmụnna” as the Greek wording while explaining that it likely denotes the whole community of believers in context.
  revised_text: Mgbe ha nọsịrị oge, e zipụrụ ha n’udo site n’aka ụmụnna[a] ka ha gakwuru ndị zitere ha.
  revised_footnotes:
