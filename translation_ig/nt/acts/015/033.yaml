id: ACT.15.33
reference: Acts 15:33
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ποιήσαντες δὲ χρόνον ἀπελύθησαν μετ’ εἰρήνης ἀπὸ τῶν ἀδελφῶν πρὸς τοὺς ⸂ἀποστείλαντας αὐτούς⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/033.yaml
  text: And after spending some time there[a], they were sent off in peace from the brothers to those who had sent them.
translation:
  language: ig
  text: Mgbe ha nọsịrị oge, e zipụrụ ha n’udo site n’aka ụmụnna[a] ka ha gakwuru ndị zitere ha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị kwere ekwe, nwoke na nwanyị.” Okwu Grik bụ “ụmụnna,” ma n’ebe a o yikarịrị ka ọ na-ezo aka n’ọgbakọ ndị kwere ekwe niile.
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιήσαντες ... χρόνον
  choice: Mgbe ha nọrọtụrụ oge n’ebe ahụ
  rationale: Akpaalaokwu Grik a pụtara ịnọ ma ọ bụ iwepụta oge ruo oge ụfọdụ. “N’ebe ahụ” adịghị kpọmkwem n’ederede Grik, ma a gbakwụnyere ya n’ụzọ doro anya site n’ọnọdụ akụkọ ahụ n’Antiọk.
- source_word: δὲ
  choice: Mgbe
  rationale: δὲ bụ njikọ dị nro nke na-aga n’ihu n’akụkọ; n’Igbo, nhazi ahịrịokwu ahụ site na “Mgbe” na-eme ka njikọ ahụ bụrụ ihe sitere n’okike n’enweghị ịgbakwunye nkwusi ike.
- source_word: ἀπελύθησαν
  choice: zilaga ha
  rationale: N’ọnọdụ a, okwu ahụ na-egosi na ọgbakọ ahụ kwere ka ndị ozi ahụ laa ma zipụ ha n’udo, ọ bụghị ịtọhapụ ha n’agbụ ma ọ bụ ịchụpụ ha.
- source_word: μετ’ εἰρήνης
  choice: ji udo
  rationale: Nke a na-echekwa echiche nke izipu mmadụ n’udo na ezi ọchịchọ, ma bụrụkwa okwu Igbo sitere n’okike.
- source_word: ἀπὸ τῶν ἀδελφῶν
  choice: ụmụnna[a]
  rationale: “Ụmụnna” bụ okwu Igbo kwesịrị ekwesị maka ἀδελφοί, ma ọ pụkwara ịgụnye ndị kwere ekwe niile dịka otu obodo. Ihe odide ala peeji na-eme ka nghọta a doo anya.
- source_word: πρὸς τοὺς ἀποστείλαντας αὐτούς
  choice: nye ndị ahụ zitere ha
  rationale: Nkebi a na-ezo aka n’ebe ndị nyere ha ọrụ ma zite ha nọ. Agbakwụnyeghị okwu pụtara “azụ” n’ụzọ pụrụ iche, n’ihi na ọ bụ ihe ọnọdụ akụkọ na-egosi, ọ bụghị okwu dị kpọmkwem na Grik.
theological_decisions:
- issue: Inclusive force of ἀδελφοί
  choice: ụmụnna[a]
  alternative: ụmụ nwoke na ụmụ nwanyị ndị kwere ekwe; ndị kwere ekwe
  rationale: Ọ dịghị esemokwu ozizi pụrụ iche ebe a. “Ụmụnna” na-edobe oyiyi okwu Grik ma n’Igbo nwekwara ike ịrụ ọrụ dịka aha obodo nke gụnyere ndị nwoke na ndị nwanyị; ihe odide ala peeji na-echekwa nghọta ahụ n’ụzọ doro anya.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị mfe ma nwee ugwu. “Nọrọtụrụ oge” na “ji udo zilaga ha” na-enye okwu sitere n’okike ma na-edobe usoro na echiche nke Grik.
