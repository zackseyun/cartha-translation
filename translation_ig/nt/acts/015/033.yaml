revisions:
- from: Mgbe ha nọrọtụrụ oge n’ebe ahụ, ụmụnna[a] ji udo zilaga ha nye ndị ahụ zitere ha.
  to: Mgbe ha nọsịrị oge, e zipụrụ ha n’udo site n’aka ụmụnna[a] ka ha gakwuru ndị zitere ha.
  rationale: The revision uses an idiomatic perfective temporal clause and a passive send-off construction that preserves the source’s ἀπελύθησαν, μετ’ εἰρήνης, and ἀπὸ τῶν ἀδελφῶν. It retains the destination clause without adding “back,” which is contextual rather than explicit. The inclusive-community footnote is retained in a more natural and lexically cautious form.
