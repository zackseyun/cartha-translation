  to: Ma Pọl siri ọnwụ na ha ekwesịghị ịkpọrọ nwoke a[a], onye si na Pamfilịa hapụ ha, onye na-esoghịkwa ha gaa n’ọrụ ahụ.
  rationale: E degharịrị naanị “si n’ebe ha nọ laa na Pamfilịa” ka o wee ghara ịsị na ọ gara Pamfilịa. “si na Pamfilịa hapụ ha” na-egosi na ọ hapụrụ ha mgbe ọ nọ na/si Pamfilịa, ma na-echekwa nkwupụta na-adịghị kpebie n’isi okwu na o ‘gbahapụrụ’ ha. A mekwara ka nkọwa ala ala peeji bụrụ nke doro anya ma bụrụ Igbo okike.
