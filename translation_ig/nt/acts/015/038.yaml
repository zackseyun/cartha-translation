  text: Παῦλος δὲ ἠξίου, τὸν ἀποστάντα ἀπ’ αὐτῶν ἀπὸ Παμφυλίας καὶ μὴ συνελθόντα αὐτοῖς εἰς τὸ ἔργον, μὴ ⸀συμπαραλαμβάνειν τοῦτον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/038.yaml
  text: But Paul insisted that they should not take along this man[a], who had withdrawn from them from Pamphylia and had not gone with them to the work.
translation:
  language: ig
  text: Ma Pọl siri ọnwụ na ha ekwesịghị ịkpọrọ nwoke a[a], onye si na Pamfilịa hapụ ha, onye na-esoghịkwa ha gaa n’ọrụ ahụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “onye gbahapụrụ ha na Pamfilịa.” Okwu Grik ahụ nwere ike inwe echiche siri ike karịa, ma isi okwu ahọpụtala okwu na-adịghị etinye nkọwa karịrị nke e kwuru.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠξίου
  choice: siri ọnwụ
  rationale: N’ọnọdụ esemokwu a, imperfect nke ἀξιόω na-egosi mkpebi siri ike ma ọ bụ nkwụsi ike Pọl, ọ bụghị naanị echiche dị nro.
- source_word: ἀποστάντα
  choice: si n’ebe ha nọ laa
  rationale: Nke a na-egosi ikewapụ onwe ya ma ọ bụ ịhapụ ha, ma ọ naghị ekpebi n’isiokwu bụ́ isi na ọ gbahapụrụ ha n’ụzọ aghụghọ.
- source_word: ἀπ’ αὐτῶν ἀπὸ Παμφυλίας
  choice: si n’ebe ha nọ laa na Pamfilịa
  rationale: Nkebiokwu a na-egosi na ọ kewapụrụ onwe ya n’ebe ha nọ, ebe ihe ahụ mere bụ na Pamfilịa; Igbo a bụ nke okike ma doo anya.
- source_word: μὴ συνελθόντα αὐτοῖς
  choice: onye na-esoghịkwa ha gaa
  rationale: Ọ na-egosi na nwoke ahụ esoghị ha gaa n’ihu na njem ọrụ ahụ.
- source_word: εἰς τὸ ἔργον
  choice: n’ọrụ ahụ
  rationale: Ọ na-echekwa isi ihe nke okwu Grik ahụ na article ya, na-enweghị ịkọwa ya kpọmkwem dị ka ‘ozi ala ọzọ.’
- source_word: μὴ συμπαραλαμβάνειν τοῦτον
  choice: na ha ekwesịghị ịkpọrọ nwoke a
  rationale: ‘Ịkpọrọ’ na-egosi iwere mmadụ soro ha gaa, ebe ‘nwoke a’ na-echekwa ike demonstrative nke τοῦτον.
theological_decisions: []
translation_notes:
  register: Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. A họọrọ ‘si n’ebe ha nọ laa’ iji chekwaa nghọta sara mbara nke ἀποστάντα; e tinyere nhọrọ siri ike karị n’ala ala peeji.
