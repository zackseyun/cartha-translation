  text: Βαρναβᾶς δὲ ⸀ἐβούλετο συμπαραλαβεῖν ⸀καὶ τὸν Ἰωάννην τὸν καλούμενον Μᾶρκον·
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/037.yaml
  text: But Barnabas wanted to take along also John[a], who was called Mark.
translation:
  language: ig
  text: Ma Banabas chọrọ ịkpọrọkwa Jọn[a], onye a na-akpọ Mak.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Jọn, onye a na-akpọkwa Mak.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Βαρναβᾶς
  choice: Banabas
  rationale: A sụgharịrị aha onye ahụ n’ụdị a na-ejikarị ede ya n’Igbo.
- source_word: δὲ
  choice: Ma
  rationale: Ọ na-egosi obere ntụgharị ma ọ bụ ọdịiche n’ihe a na-akọ, n’ụzọ dabara n’ihe gbara amaokwu ahụ gburugburu.
- source_word: ἐβούλετο
  choice: chọrọ
  rationale: Ọ na-egosi ọchịchọ Banabas n’akụkọ a, n’ejighị okwu ga-eme ka ọ pụta na o meela mkpebi siri ike karịa ihe Grik kwuru.
- source_word: συμπαραλαβεῖν
  choice: ịkpọrọ
  rationale: Ọ pụtara ịkpọrọ mmadụ ka o soro ndị ọzọ gaa; okwu a bụ nke nkịtị ma doo anya n’Igbo.
- source_word: καὶ
  choice: -kwa
  rationale: Mgbakwunye -kwa e jikọrọ na ngwaa na-egosipụta echiche nke ‘ọzọkwa/also’ n’Igbo n’enweghị ime ka ahịrịokwu sie ike.
- source_word: Ἰωάννην
  choice: Jọn
  rationale: Nke a bụ ụdị aha ahụ a na-ejikarị eme ihe n’Igbo.
- source_word: τὸν καλούμενον Μᾶρκον
  choice: onye a na-akpọ Mak
  rationale: Ọ na-egosipụta nkebi okwu participle nke na-akọwa aha ọzọ e ji mara Jọn, n’enweghị ịtinye ‘kwa’ nke Grik na-achọghị kpọmkwem n’ebe a.
- source_word: Μᾶρκον
  choice: Mak
  rationale: Nke a bụ ụdị aha ahụ a na-ejikarị ede ya n’Igbo.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke oge a, dị mfe nghọta ma nwee ugwu. E debere ‘Ma’ maka ọdịiche dị nro, tinyekwa akara nkọwa [a] ozugbo n’aha Jọn.
