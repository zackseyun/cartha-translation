revisions:
- from: Mgbe e nwesịrị ọtụtụ arụmụka, Pita biliri gwa ha, sị, “Ụmụnna nwoke,[a] unu maara na site n’oge mbụ[b] Chineke họọrọ n’etiti unu ka ndị mba ọzọ[c] site n’ọnụ m nụ okwu oziọma ahụ, kwerekwa.”
  to: Mgbe ọtụtụ arụmụka gasịrị, Pita biliri gwa ha, sị, “Ụmụnna m,[a] unu maara na site n’ụbọchị ndị mbụ[b] Chineke họọrọ n’etiti unu ka ndị mba ọzọ[c] nụ okwu oziọma ahụ site n’ọnụ m ma kwere.”
  rationale: 'E degharịrị ahịrị ahụ naanị ebe a chọrọ mmezi dị nchebe maka Igbo ebumpụta ụwa na maka obosara nke ἀφ’ ἡμερῶν ἀρχαίων. A chebere usoro na ihe okwu Grik pụtara: mgbe arụmụka gasịrị, Pita biliri kwuo; Chineke họọrọ ya n’etiti ha; ndị mba ọzọ ga-anụ oziọma ahụ site n’ọnụ ya ma kwere. Nkọwa ala peeji edoziri ka ọ kwado nhọrọ ndị dị n’ahịrị isi ma debe ụzọ ntụgharị ndị ọzọ.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T09:19:24Z'
review_pass:
  verdict: revise
  source_fidelity: 'Ihe odide ahụ na-atụgharị akụkụ ndị bụ isi nke Grik nke ọma: ọtụtụ ntụle, Pita ibili, Chineke ịhọrọ, ndị na-abụghị ndị Juu ịnụ oziọma site n’ọnụ Pita, na ikwere. Otú ọ dị, “site n’oge mbụ” dị ntakịrị warara karịa ἀφ’ ἡμερῶν ἀρχαίων, nke na-ekwu maka ‘site n’ụbọchị ndị mbụ/oge mbụ gara aga’; a gbanwere ya ka ọ nọgide n’obosara nke Grik.'
  naturalness: “Mgbe e nwesịrị ọtụtụ arụmụka” adịghị ada nke ọma n’Igbo n’ọnọdụ a; “Mgbe ọtụtụ arụmụka gasịrị” bụ usoro dị mfe ma bụrụ nke nkịtị. “Ụmụnna nwoke” na-ada ugboro ugboro n’Igbo, n’ihi na “ụmụnna” bụ okwu ịkpọ oku a na-ejikarị eme ihe. “Ụmụnna m” na-adị ùgwù, bụrụkwa nke ebumpụta ụwa, ebe nkọwa ala peeji na-edobe ụdị Grik kpọmkwem.
  terminology: A chebere “oziọma,” “ndị mba ọzọ,” na “site n’ọnụ m.” “Ndị mba ọzọ” dabara na τὰ ἔθνη n’ọnọdụ a, a na-akọwakwa nhọrọ ‘mba dị iche iche’ n’ala peeji. Nkọwa maka Ἄνδρες ἀδελφοί ka mma ma ọ bụrụ na ọ kọwaa na Igbo enweghị akara nwoke n’okwu “ụmụnna,” kama ịkpọ “ụmụnna nwoke” okwu bụ isi.
  issues:
  - severity: medium
    issue: “Mgbe e nwesịrị ọtụtụ arụmụka”
    rationale: Ụdị a nwere ike ịpụta na mmadụ ‘mechara’ arụmụka; genitive absolute ahụ na-ekwu naanị na ọtụtụ arụmụka emeela/took place. “Mgbe ọtụtụ arụmụka gasịrị” bụ Igbo nkịtị ma kwụsie ike.
  - severity: medium
    issue: “Ụmụnna nwoke” dịka okwu ịkpọ oku
    rationale: Nke a abụghị okwu ịkpọ oku Igbo na-adịkarị ebumpụta ụwa, ma na-emegharị echiche ‘brothers’ na ‘male’ ugboro abụọ. “Ụmụnna m” na-ebuga ụda mmekọrịta na nsọpụrụ nke vocative ahụ; nkọwa ala peeji nwere ike ịkọwa “Ndị ikom, ụmụnna m” dịka ntụgharị kpọmkwem.
  - severity: low
    issue: “site n’oge mbụ”
    rationale: Ọ pụrụ ịpụta naanị oge mbụ kpọmkwem. “site n’ụbọchị ndị mbụ” na-esochi ἡμερῶν ἀρχαίων nke ọma ma na-ahapụ oge a na-ekwu ka ọ bụrụ oge gara aga sara mbara.
