  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: πολλῆς δὲ ⸀ζητήσεως γενομένης ἀναστὰς Πέτρος εἶπεν πρὸς αὐτούς· Ἄνδρες ἀδελφοί, ὑμεῖς ἐπίστασθε ὅτι ἀφ’ ἡμερῶν ἀρχαίων ⸂ἐν ὑμῖν ἐξελέξατο ὁ θεὸς⸃ διὰ τοῦ στόματός μου ἀκοῦσαι τὰ ἔθνη τὸν λόγον τοῦ εὐαγγελίου καὶ πιστεῦσαι,
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/007.yaml
  text: And after much debate had taken place[a], Peter stood up and said to them, “Brothers[c][b], you know that from ancient days God chose among you that through my mouth the Gentiles should hear the word of the gospel and believe.”
translation:
  language: ig
  text: Mgbe ọtụtụ arụmụka gasịrị, Pita biliri gwa ha, sị, “Ụmụnna m,[a] unu maara na site n’ụbọchị ndị mbụ[b] Chineke họọrọ n’etiti unu ka ndị mba ọzọ[c] nụ okwu oziọma ahụ site n’ọnụ m ma kwere.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Ndị ikom, ụmụnna m.” Okwu Grik e ji kpọọ ha dị n’ụdị nwoke na nke ọtụtụ. “Ụmụnna m” bụ okwu ịkpọ oku Igbo nkịtị; o nwere ike ịbụ okwu omenala e ji kpọọ ọgbakọ dum.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “site n’oge mbụ gara aga.”
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “mba dị iche iche.” N’ebe a ọ na-ezo aka n’ndị na-abụghị ndị Juu.
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλῆς ... ζητήσεως γενομένης
  choice: Mgbe e nwesịrị ọtụtụ arụmụka
  rationale: Nkebi genitive absolute a na-egosi ihe mere tupu Pita ebilie. “Ọtụtụ arụmụka” na-egosipụta mkparịta ụka siri ike na esemokwu echiche n’enweghị ime ka ọ bụrụ ọgụ.
- source_word: ἀναστὰς
  choice: biliri
  rationale: Nke a bụ okwu Igbo dị mfe ma kwekọọ n’omume Pita mere tupu o kwuo okwu.
- source_word: Ἄνδρες ἀδελφοί
  choice: Ụmụnna nwoke
  rationale: Ọ na-echekwa ma ụdị nwoke dị n’asụsụ Grik ma mmetụta nke mmekọrịta ezinụlọ dị n’okwu ịkpọ oku ahụ.
- source_word: ἐπίστασθε
  choice: unu maara
  rationale: Ọ na-egosi ihe ndị na-ege ntị marala ma bụrụkwa ụzọ Igbo nkịtị si kwuo ya.
- source_word: ἀφ’ ἡμερῶν ἀρχαίων
  choice: site n’oge mbụ
  rationale: N’ebe a ọ na-arụtụ aka n’oge gara aga n’akụkọ nzukọ ahụ, ọ bụghị n’oge ochie dị anya; “oge mbụ” bụ Igbo doro anya ma na-echekwa nghọta ahụ.
- source_word: ἐν ὑμῖν
  choice: n’etiti unu
  rationale: Ọ na-egosi nhọrọ e mere n’ime ndị nọ n’otu ahụ ma ghara ịgbakwunye nkọwa karịrị ihe Grik kwuru.
- source_word: ἐξελέξατο
  choice: họọrọ
  rationale: Nke a bụ ntụgharị kpọmkwem na nke ebumpụta ụwa nke ngwaa pụtara ịhọrọ.
- source_word: διὰ τοῦ στόματός μου
  choice: site n’ọnụ m
  rationale: Ọ na-echekwa ihe atụ doro anya nke Pita ịbụ onye Chineke ji kwuo okwu kama ime ka ọ bụrụ naanị “site n’aka m.”
- source_word: τὰ ἔθνη
  choice: ndị mba ọzọ
  rationale: N’ọnọdụ Ọrụ Ndịozi 15, okwu a na-ezo aka n’ndị na-abụghị ndị Juu; okwu Igbo a na-eme ka ọdịiche ahụ doo anya.
- source_word: τὸν λόγον τοῦ εὐαγγελίου
  choice: okwu oziọma ahụ
  rationale: Ọ na-echekwa ma λόγος (“okwu/ozi”) ma εὐαγγέλιον (“oziọma”), n’asụsụ Igbo a na-aghọta nke ọma.
- source_word: πιστεῦσαι
  choice: kwerekwa
  rationale: Ọ na-ejikọta omume nke ịnụ na ikwere dịka infinitive abụọ Grik si jikọta ha, na-enweghị itinye usoro nkà mmụta okpukpe ọzọ.
theological_decisions:
- issue: Okwu ịkpọ oku nke nwoke Ἄνδρες ἀδελφοί n’ihu ọgbakọ nwere ike ịnọchite anya ọtụtụ ndị
  choice: Ụmụnna nwoke
  alternative: Ụmụnna; Ụmụnna nwoke na ụmụnna nwanyị
  rationale: A na-echekwa ụdị nwoke dị n’ihe odide Grik n’ahịrị bụ isi. Ihe odide ahụ ekwughị kpọmkwem “ụmụnna nwanyị,” ya mere a naghị agbakwunye ya, ebe nkọwa ala peeji na-akọwa ojiji omenala nke okwu ahụ.
- issue: Ihe τὰ ἔθνη pụtara n’ọnọdụ akụkọ nzọpụta a
  choice: ndị mba ọzọ
  alternative: mba dị iche iche
  rationale: Nzukọ Jerusalem na-atụle ndị kwere ekwe na-abụghị ndị Juu; “ndị mba ọzọ” na-egosipụta onye okwu ahụ na-ezo aka na ya ma ka na-edebe ọdịiche dị n’etiti ndị Juu na ndị mba ọzọ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ “oziọma” dịka okwu Ndị Kraịst maara nke ọma; e chekwara ihe atụ “site n’ọnụ m” na usoro nke ịnụ ma kwere.
