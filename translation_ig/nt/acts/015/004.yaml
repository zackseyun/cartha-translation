  text: παραγενόμενοι δὲ εἰς ⸀Ἱεροσόλυμα ⸀παρεδέχθησαν ⸀ἀπὸ τῆς ἐκκλησίας καὶ τῶν ἀποστόλων καὶ τῶν πρεσβυτέρων, ἀνήγγειλάν τε ὅσα ὁ θεὸς ἐποίησεν μετ’ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/004.yaml
  text: When they arrived in Jerusalem[a], they were welcomed by the church and the apostles and the elders, and they reported all that God had done with them.
translation:
  language: ig
  text: Mgbe ha rutere Jerusalem, ọgbakọ ahụ, ndịozi na ndị okenye nabatara ha; ha kọkwara ihe niile Chineke so ha mee.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ihe niile Chineke mere site n’aka ha,” ma ọ bụ “ihe niile Chineke mere n’etiti ha.” N’asụsụ Grik, e dere, “ya na ha.”
    reason: alternative_reading
lexical_decisions:
- source_word: παραγενόμενοι δὲ εἰς Ἱεροσόλυμα
  choice: Mgbe ha rutere Jerusalem
  rationale: Nkebiokwu a na-egosi ihe mere tupu ngwaa ndị bụ isi. “Mgbe ha rutere” bụ Igbo doro anya ma dịkwa n’usoro oge nke aorist participle; ọrụ njikọ dị nro nke δέ dị n’ime nhazi a.
- source_word: παρεδέχθησαν
  choice: nabatara ha
  rationale: N’ọnọdụ a, ngwaa a pụtara ịnabata ndị bịara n’ụzọ ọma. Igbo na-eji usoro active a eme ihe n’ụzọ ebumpụta ụwa ebe onye nabatara na onye a nabatara doro anya.
- source_word: ἀπὸ τῆς ἐκκλησίας καὶ τῶν ἀποστόλων καὶ τῶν πρεσβυτέρων
  choice: ọgbakọ ahụ, ndịozi na ndị okenye
  rationale: ἀπό na passive a na-egosi ndị mere nnabata ahụ. “Ọgbakọ” na-egosi obodo ndị kwere ekwe gbakọrọ ọnụ n’etinyeghị echiche otu ụka pụrụ iche; “ndị okenye” na-egosi ndị ndu a matara, ọ bụghị naanị ndị kara nka.
- source_word: ἀνήγγειλάν τε
  choice: ha kọkwara
  rationale: “Kọọrọ” na-egosi na ha nyere akụkọ banyere ihe mere, ebe -kwa na-anọchi njikọ τε n’ụzọ Igbo dị mma.
- source_word: ὅσα ὁ θεὸς ἐποίησεν
  choice: ihe niile Chineke ... mee
  rationale: “Ihe niile” na-eburu oke nke ὅσα, ebe “mee” na-edobe obosara nke ποιέω n’etinyeghị nkọwa ọzọ.
- source_word: μετ’ αὐτῶν
  choice: Chineke so ha mee
  rationale: Usoro “so ha mee” na-edobe echiche bụ isi nke μετά na genitive, ya bụ, Chineke mere ihe ahụ mgbe ya na ha nọ n’ọrụ. Ọ naghị agbanwe ya ozugbo ka ọ bụrụ naanị ‘site n’aka ha’ ma ọ bụ ‘n’etiti ha.’
theological_decisions:
- issue: Ụzọ e si ghọta òkè ndị ozi n’ọrụ Chineke na μετ’ αὐτῶν
  choice: ihe niile Chineke so ha mee
  alternative: ihe niile Chineke mere site n’aka ha; ma ọ bụ ihe niile Chineke mere n’etiti ha
  rationale: Nhọrọ bụ isi na-edobe Chineke dịka onye na-eme ihe ma na-egosikwa na ndị ozi sonyere ya, n’emeghị ka ederede kwuo kpọmkwem ma ha bụ naanị ngwá ọrụ ya ma ọ bụ na ihe ndị ahụ mere n’etiti ha.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ugwu ma dị mfe nghọta, mee ntụgharị a. “Ọgbakọ” na-ezere ime ka ἐκκλησία bụrụ ụlọ ma ọ bụ otu denomination; “nd ndịozi” na “ndị okenye” bụ okwu ndị a na-aghọta nke ọma maka ọrụ ndu ndị a.
