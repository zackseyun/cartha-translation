id: ACT.15.28
reference: Acts 15:28
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἔδοξεν γὰρ τῷ ⸂πνεύματι τῷ ἁγίῳ⸃ καὶ ἡμῖν μηδὲν πλέον ἐπιτίθεσθαι ὑμῖν βάρος πλὴν ⸂τούτων τῶν ἐπάναγκες⸃,
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/028.yaml
  text: For it seemed good to the Holy Spirit and to us to place on you no greater burden than these necessary things:[a][b]
translation:
  language: ig
  text: N’ihi na ọ dị Mmụọ Nsọ mma, dịkwa anyị mma, ka anyị ghara ibikwasị unu ibu ọzọ karịa ihe ndị a dị mkpa:[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “Mmụọ Nsọ na anyị kpebiri.” Nkebiokwu Grik ahụ nwekwara ike ịbụ usoro e ji ekwupụta mkpebi.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, “ihe ndị a kachasị mkpa” ma ọ bụ “ihe ndị a a chọrọ n’ezie.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔδοξεν
  choice: ọ dị ... mma
  rationale: Nkebiokwu Igbo a na-egosipụta echiche nke ihe a hụrụ na ọ dị mma mgbe e nwesịrị ntụle. Ọ na-edobe ụda mkpebi dị n’okwu Grik n’ebughị ụzọ mee ya ka ọ bụrụ naanị mmasị mmadụ.
- source_word: τῷ πνεύματι τῷ ἁγίῳ
  choice: Mmụọ Nsọ
  rationale: Dative a na-esonye na ἔδοξεν, ya bụ, ‘ọ dị Mmụọ Nsọ mma.’ Aha a na-egosi Mmụọ Nsọ dị ka onye na-eme ihe, ọ bụghị dị ka ike na-enweghị onye bụ ya.
- source_word: καὶ ἡμῖν
  choice: na anyị
  rationale: A jikọtara ‘anyị’ na ‘Mmụọ Nsọ’ n’otu usoro, ya mere nsụgharị ahụ na-edobe nkwenye ha abụọ n’ụzọ doro anya.
- source_word: μηδὲν πλέον
  choice: ibu ọ bụla ọzọ
  rationale: N’ihi na okwu a jikọrọ βάρος, ọ na-egosi na a gaghị atụkwasị ha ibu ọzọ ma ọ bụ ibu karịrị nke a kpọrọ aha.
- source_word: ἐπιτίθεσθαι
  choice: ibikwasị
  rationale: ‘Ibikwasị’ bụ okwu Igbo doro anya maka ịtụkwasị ihe n’elu onye, ma na-edobekwa ihe atụ nke ibu.
- source_word: ὑμῖν
  choice: unu
  rationale: Ọ na-akọwa ndị a gaara ebikwasị ibu ahụ, ya bụ ndị a na-agwa okwu.
- source_word: βάρος
  choice: ibu
  rationale: ‘Ibu’ na-edobe ihe atụ Grik nke ọrụ ma ọ bụ iwu a na-atụkwasị mmadụ.
- source_word: πλὴν
  choice: ma e wezụga
  rationale: N’usoro okwu a, πλὴν na-ewebata ihe ndị a na-ewepụ n’okwu na a gaghị atụkwasị ha ibu ọzọ.
- source_word: τούτων τῶν ἐπάναγκες
  choice: ihe ndị a dị mkpa
  rationale: Nsụgharị a na-anọ Grik nso ma na-atụ aka n’ihe ndị a ga-edepụta n’amaokwu na-esonụ, n’akọwaghị ụdị mkpa ha karịa ihe ederede kwuru.
theological_decisions:
- issue: Mmekọrịta Mmụọ Nsọ na mkpebi nzukọ ahụ
  choice: E debere usoro okwu ahụ dị ka ‘ọ dị Mmụọ Nsọ na anyị mma,’ nke na-egosi nkwenye Mmụọ Nsọ na nke ndị ozi ọnụ.
  alternative: ‘Mmụọ Nsọ na anyị kpebiri.’
  rationale: Nke a na-echekwa usoro okwu Grik na ọrụ onwe onye nke Mmụọ Nsọ, n’emeghị okwu ahụ ka ọ bụrụ naanị mkpebi mmadụ ma ọ bụ mee ka Mmụọ Nsọ bụrụ ike na-enweghị onye bụ ya.
- issue: Ike mkpebi ahụ nwere n’ebe ndị kwere ekwe si ná mba ọzọ nọ
  choice: A sịrị na a gaghị ebikwasị ha ibu ọ bụla ọzọ ma e wezụga ihe ndị a dị mkpa.
  alternative: Ịsị na a jụrụ ọrụ niile kpamkpam, ma ọ bụ na e tinyere Iwu Mosis niile n’ahụ ha.
  rationale: Nhọrọ a na-edobe oke mkpebi ahụ dị ka ederede siri kwuo ya, n’etinyeghị usoro ozizi e mesịrị banyere iwu na amara.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. ‘Ọ dị ... mma’ na-echekwa usoro okwu Grik, ebe ‘ibikwasị ... ibu’ na-edobe ihe atụ dị na ya. E jiri ‘ka a ghara’ mee ka okwu ahụ bụrụ nke dị larịị n’Igbo ma ghara itinye onye na-eme ihe nke Grik ekwughị kpọmkwem.
