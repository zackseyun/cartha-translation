id: ACT.15.29
reference: Acts 15:29
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀπέχεσθαι εἰδωλοθύτων καὶ αἵματος καὶ ⸀πνικτῶν καὶ πορνείας· ἐξ ὧν διατηροῦντες ἑαυτοὺς εὖ πράξετε. ἔρρωσθε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/029.yaml
  text: to abstain from food sacrificed to idols[a], from blood, from what has been strangled, and from sexual immorality. If you keep yourselves from these things, you will do well[d][c][b]. Farewell.
translation:
  language: ig
  text: ka unu zere ihe ndị a chụrụ n’àjà nye arụsị[a], na ọbara, na ihe ndị e nyagburu[b], na omume rụrụ arụ n’ihe gbasara mmekọahụ[c]. Ọ bụrụ na unu echebe onwe unu pụọ n’ihe ndị a, unu ga-eme nke ọma. Ka ahụ dị unu mma.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “nri ndị a chụrụ n’àjà nye arụsị.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “anụ e gburu site n’ịnyagbu ya” ma ọ bụ “ihe e nyagburu.”
    reason: lexical_alternative
  - marker: c
    text: Okwu Grik a sụgharịrị “omume rụrụ arụ n’ihe gbasara mmekọahụ” nwere ike ịpụta ọtụtụ ụdị mmehie mmekọahụ; ma ụfọdụ ndị na-aghọta ya n’ebe a dịka ihe ndị a machibidoro iwu kpọmkwem n’akwụkwọ Levitikọs.
    reason: alternative_reading
  - marker: d
    text: Ma ọ bụ, “Nọọnụ nke ọma.” Okwu Grik a bụ usoro a na-ejikarị mechie akwụkwọ ozi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέχεσθαι
  choice: ka unu zere
  rationale: Ọ na-egosi ihe e nyere ha iwu ka ha ghara ime; ‘zere’ bụ okwu Igbo dị mfe ma doo anya nke na-eburu echiche nke ịhapụ ihe ndị ahụ kpamkpam.
- source_word: εἰδωλοθύτων
  choice: ihe ndị a chụrụ n’àjà nye arụsị
  rationale: Nke a na-edobe obosara nke okwu Grik, nke nwere ike ịpụta ihe, karịsịa nri ma ọ bụ anụ, e ji chụọrọ arụsị àjà.
- source_word: αἵματος
  choice: ọbara
  rationale: Okwu Grik ahụ kwuru naanị ‘ọbara’; nsụgharị ahụ anaghị etinye nkọwa karịrị ihe isi mmalite kwuru.
- source_word: πνικτῶν
  choice: ihe ndị a nyagburu anyagbu
  rationale: Adjective ahụ e jiri dịka aha na-ezo aka n’ihe e gburu site n’ịnyagbu ya; nsụgharị a na-edobe ya n’obosara dịka ihe odide Grik si dị.
- source_word: πορνείας
  choice: omume rụrụ arụ n’ihe gbasara mmekọahụ
  rationale: Nke a bụ okwu Igbo nke oge a, doro anya, nke na-adịghị eme ka πορνεία bụrụ naanị otu ụdị mmehie mmekọahụ.
- source_word: ἐξ ὧν
  choice: pụọ n’ihe ndị a
  rationale: Ọ na-ezoghachi n’ihe niile e depụtara ma na-ada n’Igbo n’ụzọ nkịtị.
- source_word: διατηροῦντες ἑαυτούς
  choice: Ọ bụrụ na unu echebe onwe unu
  rationale: Ọ bụ participle n’asụsụ Grik, ma n’ebe a ọ na-arụ ọrụ dịka ọnọdụ; ịsụgharị ya n’ụdị ‘ọ bụrụ na’ na-eme ka njikọ echiche ahụ doo anya n’Igbo.
- source_word: εὖ πράξετε
  choice: unu ga-eme nke ọma
  rationale: Nke a na-eburu idiom Grik ahụ dịka ime ihe ziri ezi ma kwesịkwa ekwesị, na-enweghị ịgbanwe ya ka ọ bụrụ nkwa akụnụba.
- source_word: ἔρρωσθε
  choice: Ka ahụ dị unu mma
  rationale: N’akwụkwọ ozi, okwu a bụ usoro e ji mechie akwụkwọ ozi; nkebi Igbo a na-arụkwa otu ọrụ ahụ ma ka na-egosipụta echiche nke ịdị mma.
theological_decisions:
- issue: Ihe πορνεία pụtara n’iwu ndịozi a
  choice: omume rụrụ arụ n’ihe gbasara mmekọahụ
  alternative: ịkwa iko; alụmdi na nwunye a machibidoro iwu ma ọ bụ mmebi iwu Levitikọs 18
  rationale: Amaokwu ahụ akọwaghị kpọmkwem otu ụdị mmehie mmekọahụ. Ya mere, isi okwu ahụ na-edobe nghọta sara mbara, ebe ihe e dere n’ala ala peeji na-egosi na ụfọdụ na-aghọta ya n’ụzọ kpọmkwem karị n’ihi ọnọdụ Levitikọs.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E debere usoro ndepụta na nkenke nke isi mmalite ahụ, ma jiri ụdị ọnọdụ mee participle ahụ ka njikọ ya doo anya. Okwu mmechi ahụ bụ usoro akwụkwọ ozi a na-anụ nke ọma n’Igbo.
