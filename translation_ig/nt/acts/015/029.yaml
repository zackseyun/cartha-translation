  to: ka unu zere ihe ndị a chụrụ n’àjà nye arụsị[a], na ọbara, na ihe ndị e nyagburu[b], na omume rụrụ arụ n’ihe gbasara mmekọahụ[c]. Ọ bụrụ na unu echebe onwe unu pụọ n’ihe ndị a, unu ga-eme nke ọma. Ka ahụ dị unu mma.[d]
