    text: Ma ọ bụ, “ndị ikom na-edu n’etiti ụmụnna.”
    reason: lexical_alternative
  - marker: b
    text: “Ụmụnna” n’ebe a nwere ike na-ezo aka n’ọgbakọ ndị kwere ekwe n’ozuzu ha, gụnyere ụmụ nwanyị.
    reason: cultural_note
  revision_rationale: 'The revision corrects grammar, idiom, and the corrupted word while preserving the Greek syntax and sense: the apostles, elders, and whole church jointly judge the selection and sending of male delegates; Judas Barsabbas and Silas are identified as recognized leaders among the believers. It does not impose a church-polity interpretation beyond the text.'
