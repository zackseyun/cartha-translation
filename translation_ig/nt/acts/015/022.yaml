revisions:
- from: 'Mgbe ahụ, ọ dị ndịozi na ndị okenye mma, ha na nzukọ Kraịst dum, ịhọrọ ndị ikom n''etiti ha ma ziga ha Antiọk ha na Pọl na Banabas: Judas, onye a na-akpọ Basabas, na Saịlas, ndị ikom na-edu nd兄nna ha.[a][b]'
  to: 'Mgbe ahụ, ndịozi na ndị okenye, ya na ọgbakọ dum, hụrụ na ọ dị mma ịhọrọ ụfọdụ ndị ikom n’etiti ha ma ziga ha Antiọk ka ha soro Pọl na Banabas: Judas, onye a na-akpọ Basabas, na Saịlas, ndị ikom bụ ndị ndú n’etiti ụmụnna.[a][b]'
  rationale: 'The revision corrects grammar, idiom, and the corrupted word while preserving the Greek syntax and sense: the apostles, elders, and whole church jointly judge the selection and sending of male delegates; Judas Barsabbas and Silas are identified as recognized leaders among the believers. It does not impose a church-polity interpretation beyond the text.'
  reviewer_model: gpt-5.6-terra
