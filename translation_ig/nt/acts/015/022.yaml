id: ACT.15.22
reference: Acts 15:22
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Τότε ἔδοξε τοῖς ἀποστόλοις καὶ τοῖς πρεσβυτέροις σὺν ὅλῃ τῇ ἐκκλησίᾳ ἐκλεξαμένους ἄνδρας ἐξ αὐτῶν πέμψαι εἰς Ἀντιόχειαν σὺν ⸀τῷ Παύλῳ καὶ Βαρναβᾷ, Ἰούδαν τὸν ⸀καλούμενον Βαρσαββᾶν καὶ Σιλᾶν, ἄνδρας ἡγουμένους ἐν τοῖς ἀδελφοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/022.yaml
  text: 'Then it seemed good to the apostles and the elders, together with the whole church, to choose men from among them and send them to Antioch with Paul and Barnabas: Judas, who was called Barsabbas, and Silas, men who were leading among the brothers.'
translation:
  language: ig
  text: 'Mgbe ahụ, ndịozi na ndị okenye, ya na ọgbakọ dum, hụrụ na ọ dị mma ịhọrọ ụfọdụ ndị ikom n’etiti ha ma ziga ha Antiọk ka ha soro Pọl na Banabas: Judas, onye a na-akpọ Basabas, na Saịlas, ndị ikom bụ ndị ndú n’etiti ụmụnna.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị ikom na-edu n’etiti ụmụnna.”
    reason: lexical_alternative
  - marker: b
    text: “Ụmụnna” n’ebe a nwere ike na-ezo aka n’ọgbakọ ndị kwere ekwe n’ozuzu ha, gụnyere ụmụ nwanyị.
    reason: cultural_note
lexical_decisions:
- source_word: ἔδοξε
  choice: ọ dị ... mma
  rationale: Akpaala okwu Igbo a na-egosipụta mkpebi ha ji ezi uche kwado, n'emeghị ka ọ bụrụ iwu gọọmentị ma ọ bụ iwu e nyere n'ike.
- source_word: τοῖς ἀποστόλοις καὶ τοῖς πρεσβυτέροις
  choice: ndịozi na ndị okenye
  rationale: “Ndịozi” na “ndị okenye” bụ okwu Igbo doro anya ma bụrụkwa okwu ndị a na-ejikarị eme ihe n'ọnọdụ nzukọ ndị kwere ekwe.
- source_word: σὺν ὅλῃ τῇ ἐκκλησίᾳ
  choice: ha na nzukọ Kraịst dum
  rationale: Nke a na-egosi na ọgbakọ ndị kwere ekwe niile so ndịozi na ndị okenye mee ihe ahụ; “nzukọ Kraịst” na-eme ka ihe ἐκκλησία pụtara n'ebe a doo anya.
- source_word: ἐκλεξαμένους ἄνδρας ἐξ αὐτῶν
  choice: ịhọrọ ndị ikom n'etiti ha
  rationale: Ọ na-echekwa na ndị a họpụtara bụ ndị ikom, nakwa na e si n'ime ọgbakọ ahụ họpụta ha.
- source_word: πέμψαι εἰς Ἀντιόχειαν σὺν τῷ Παύλῳ καὶ Βαρναβᾷ
  choice: ziga ha Antiọk ha na Pọl na Banabas
  rationale: Nsụgharị a na-egosipụta iziga ndị nnọchiteanya ahụ na ebe ha na-aga, tinyere ndị ha na ha ga-eso.
- source_word: καλούμενον Βαρσαββᾶν
  choice: onye a na-akpọ Basabas
  rationale: Ọ na-echekwa ọdịdị nkọwa nke participle Grik ma na-ada ka Igbo ebumpụta ụwa.
- source_word: ἄνδρας ἡγουμένους ἐν τοῖς ἀδελφοῖς
  choice: ndị ikom na-edu n'etiti ụmụnna ha
  rationale: Ọ na-echekwa participle nke na-egosi idu ndú a maara ama, n'emeghị ya aha ọkwa pụrụ iche.
- source_word: ἀδελφοῖς
  choice: ụmụnna ha
  rationale: “Ụmụnna” bụ okwu Igbo ebumpụta ụwa maka ndị otu okwukwe; ihe odide Grik ji ụdị nwoke ọtụtụ, ma n'ọnọdụ a okwu ahụ nwere ike ịgụnye ndị kwere ekwe niile.
theological_decisions:
- issue: Oke òkè ọgbakọ dum nwere na mkpebi ahụ
  choice: E tinyere nzukọ Kraịst dum na ndịozi na ndị okenye n'ịkwado ịhọrọ na iziga ndị nnọchiteanya ahụ.
  alternative: Ọ bụ naanị ndịozi na ndị okenye mere mkpebi ahụ, ebe ọgbakọ ahụ nọ naanị dịka ndị bịara ya.
  rationale: σὺν ὅλῃ τῇ ἐκκλησίᾳ na-ejikọta ọgbakọ dum na ndịozi na ndị okenye n'omume ahụ, ma nsụgharị ahụ anaghị etinye usoro ọchịchị ụka pụrụ iche n'ihe odide ahụ.
- issue: Ihe ἀδελφοῖς na-agụnye
  choice: E ji “ụmụnna ha” n'ahịrị bụ isi, tinyere nkọwa ala peeji na ọ nwere ike ịgụnye ndị inyom.
  alternative: “Ndị kwere ekwe” ma ọ bụ “ụmụnna nwoke na nwanyị.”
  rationale: Nke a na-echekwa ọdịdị okwu Grik nke nwoke ọtụtụ, ma na-ekwupụtakwa nghọta sara mbara nke okwu ahụ n'ọnọdụ ọgbakọ Ndị Kraịst.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji “nzukọ Kraịst” mee ka ἐκκλησία pụta ìhè dịka ọgbakọ ndị kwere ekwe, ma zere itinye usoro ọchịchị ụka nke otu denomination.
