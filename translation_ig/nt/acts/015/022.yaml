review_pass:
  verdict: revise
  source_fidelity: The draft broadly follows the Greek, but its phrase for accompaniment ('ha na Pọl') is unidiomatic and unclear, and the final word contains a character-corruption error. The revision retains the collective deliberative sense of ἔδοξε, the participation of the whole church, the masculine reference of ἄνδρας, and the recognized leadership sense of ἡγουμένους.
  naturalness: ‘Ọ dị ... mma’ is natural Igbo when constructed with all participants in the dative-style frame. ‘Ndịozi na ndị okenye, ya na ọgbakọ dum, hụrụ na ọ dị mma...’ is clear, contemporary Standard Igbo. ‘Ziga ha Antiọk ka ha soro Pọl na Banabas’ clearly expresses sending the delegates with Paul and Barnabas.
  terminology: ‘Ọgbakọ dum’ is a more natural and less interpretively narrowed rendering of ὅλῃ τῇ ἐκκλησίᾳ than ‘nzukọ Kraịst dum.’ ‘Ndị ikom bụ ndị ndú n’etiti ụmụnna’ accurately conveys ἄνδρας ἡγουμένους ἐν τοῖς ἀδελφοῖς without treating leadership as a formal title. The footnote preserves the broader contextual reference of ‘ụmụnna.’
  issues:
  - severity: medium
    issue: The phrase ‘ha na nzukọ Kraịst dum’ is grammatically awkward after ‘ọ dị ... mma’ and ‘nzukọ Kraịst’ unnecessarily narrows ἐκκλησία.
    rationale: The Greek includes the whole church with the apostles and elders. ‘Ya na ọgbakọ dum’ gives a natural, non-sectarian rendering and preserves the participatory sense.
  - severity: medium
    issue: ‘ziga ha Antiọk ha na Pọl na Banabas’ is unclear and not idiomatic Standard Igbo.
    rationale: The Greek says the selected men were sent to Antioch with Paul and Barnabas. ‘Ziga ha Antiọk ka ha soro Pọl na Banabas’ expresses both destination and accompaniment clearly.
  - severity: high
    issue: The main text contains the corrupted string ‘nd兄nna’.
    rationale: This is not valid Igbo orthography and must be restored to ‘ụmụnna.’
  - severity: low
    issue: The possessive ‘ụmụnna ha’ adds a possessive nuance not explicit in the Greek.
    rationale: ‘N’etiti ụmụnna’ is sufficient and more closely reflects ἐν τοῖς ἀδελφοῖς.
  revised_text: 'Mgbe ahụ, ndịozi na ndị okenye, ya na ọgbakọ dum, hụrụ na ọ dị mma ịhọrọ ụfọdụ ndị ikom n’etiti ha ma ziga ha Antiọk ka ha soro Pọl na Banabas: Judas, onye a na-akpọ Basabas, na Saịlas, ndị ikom bụ ndị ndú n’etiti ụmụnna.[a][b]'
  revised_footnotes:
