  text: ἔδοξεν ἡμῖν γενομένοις ὁμοθυμαδὸν ⸀ἐκλεξαμένοις ἄνδρας πέμψαι πρὸς ὑμᾶς σὺν τοῖς ἀγαπητοῖς ἡμῶν Βαρναβᾷ καὶ Παύλῳ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/025.yaml
  text: it seemed good to us[a], having come to one accord, to choose men and send them to you with our beloved Barnabas and Paul[b],
translation:
  language: ig
  text: Mgbe anyị ruru otu uche[a], o yiri anyị ka ọ dị mma ịhọrọ ndị ikom[b] ma ziga ha ka ha na Banabas na Pọl, ndị anyị hụrụ n’anya, bịakwute unu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “mgbe anyị dị n’otu uche” ma ọ bụ “mgbe anyị niile kwekọrịtara.”
    reason: lexical_alternative
  - marker: b
    text: Ya bụ, ndị nnọchiteanya bụ ụmụ nwoke; okwu Grik kwuru kpọmkwem “ndị ikom.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔδοξεν ἡμῖν
  choice: anyị hụrụ na ọ dị mma
  rationale: Nke a bụ ụzọ Igbo si ekwu mkpebi otu ìgwè nke ha lere anya hụ na ọ dabara adaba, n’emeghị ka okwu ahụ sie ike karịa otú Grik si kwuo ya.
- source_word: γενομένοις ὁμοθυμαδόν
  choice: Mgbe anyị niile bịaruru otu uche
  rationale: Ọ na-egosi na ìgwè ahụ rutere n’ịdị n’otu n’uche. ‘Bịaruru’ na-echekwa echiche nke usoro e si ruo na nkwekọrịta ahụ.
- source_word: ἐκλεξαμένοις
  choice: ịhọrọ
  rationale: E jikọtara participle a na πέμψαι n’usoro ebumnuche abụọ—ịhọrọ na iziga—ka ahịrịokwu ahụ bụrụ Igbo doro anya ma dị mfe.
- source_word: ἄνδρας
  choice: ndị ikom
  rationale: ἀνήρ n’ebe a na-ekwu kpọmkwem maka ụmụ nwoke toro eto; amaokwu ndị gbara ya gburugburu na-akọwa ha dị ka Judas na Saịlas.
- source_word: πέμψαι πρὸς ὑμᾶς
  choice: ziga ha ka ha bịakwute unu
  rationale: Nke a bụ okwu Igbo nkịtị maka iziga mmadụ n’ebe ndị ọzọ nọ; ‘ha’ sitere n’ụzọ doro anya na ‘ndị ikom’ e kwuru tupu ya.
- source_word: σὺν
  choice: ha na
  rationale: Ọ na-egosi iso mmadụ gaa, ya bụ, ndị ikom ahụ ga-eso Banabas na Pọl.
- source_word: τοῖς ἀγαπητοῖς ἡμῶν
  choice: ndị anyị hụrụ n’anya
  rationale: Nke a na-echekwa ịhụnanya na nsọpụrụ dị n’okwu ἀγαπητοῖς n’Igbo dị ugbu a.
- source_word: Βαρναβᾷ καὶ Παύλῳ
  choice: Banabas na Pọl
  rationale: E dere aha ndị ahụ dịka usoro nsụpe aha ndị a na-ejikarị n’Igbo.
theological_decisions:
- issue: Ụda mkpebi ọnụ nke akwụkwọ ozi Jerusalem
  choice: anyị hụrụ na ọ dị mma
  alternative: anyị kpebiri
  rationale: Usoro δοκέω na-egosi nkwenye ma ọ bụ ikpe ọnụ nke ìgwè ahụ. ‘Anyị kpebiri’ nwere ike ime ka ikike iwu dị n’okwu ahụ sie ike karịa ihe nkebi ahịrịokwu Grik kwuru.
translation_notes:
  register: Ejiri Igbo Izugbe dị ugbu a, nke dị ùgwù ma dị mfe nghọta. A haziri ahịrịokwu ahụ ka o kwekọọ n’usoro okwu Igbo, ebe a ka chekwara echiche nke iru otu uche, ịhọrọ ndị ozi, na iziga ha ka ha soro Banabas na Pọl.
