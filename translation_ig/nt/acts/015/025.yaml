- from: Mgbe anyị niile bịaruru otu uche[a], anyị hụrụ na ọ dị mma ịhọrọ ndị ikom[b] ma ziga ha ka ha bịakwute unu, ha na ndị anyị hụrụ n’anya, bụ Banabas na Pọl.
  to: Mgbe anyị ruru otu uche[a], o yiri anyị ka ọ dị mma ịhọrọ ndị ikom[b] ma ziga ha ka ha na Banabas na Pọl, ndị anyị hụrụ n’anya, bịakwute unu.
  rationale: The revision is limited to a more source-near expression for the deliberative formula and a clearer Igbo ordering of the accompaniment phrase. It preserves the source’s participial sense of reaching unity, the explicit male reference, and the warm designation of Barnabas and Paul. Footnote anchors remain attached to the corresponding expressions.
