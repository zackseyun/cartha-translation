review_pass:
  verdict: revise
  source_fidelity: The draft preserves the rhetorical question, the yoke image, its placement on the disciples’ necks, and the contrast between earlier generations and the speakers. However, the present-tense force of πειράζετε is better represented by “na-etinye ... n’ule,” and the English loanword “yok” should be replaced with the established Igbo word “ibo.”
  naturalness: “Ibo” and “itinye Chineke n’ule” are natural, intelligible Standard Igbo in this register. The revised relative clause also makes the shared inability of both the ancestors and the speakers clear without an awkward negative construction.
  terminology: Use “ibo” for ζυγός, retaining the biblical metaphor without interpreting it as law or obligation in the main text. “Ndị na-eso ụzọ” suitably renders μαθητῶν. “Ndị nna ochie anyị” communicates the ancestral sense of οἱ πατέρες ἡμῶν; “ndị nna anyị” remains a literal lexical alternative.
  issues:
  - severity: medium
    issue: The main text uses “yok.”
    rationale: “Yok” is an untranslated English form rather than Standard Igbo. “Ibo” is the appropriate Igbo term for a yoke and preserves the source metaphor.
  - severity: low
    issue: “Anwa Chineke” is less precise in the main text for πειράζετε.
    rationale: “Itinye Chineke n’ule” directly expresses testing/putting God to the test and clearly reflects the present action; “anwa Chineke” can be retained as an alternative.
  - severity: low
    issue: The existing wording of the final relative clause is somewhat awkward.
    rationale: Recasting it as “nke ma ndị nna ochie anyị ma anyị onwe anyị enweghị ike ibu” clearly applies the inability to both groups and preserves the yoke-bearing image.
  revised_text: Ya mere, ugbu a, gịnị mere unu ji etinye Chineke[a] n’ule site n’itinye ibo[b] n’olu ndị na-eso ụzọ—ibo nke ma ndị nna ochie anyị[c] ma anyị onwe anyị enweghị ike ibu?
