  variant: Standard Igbo
source:
  edition: SBLGNT
  text: νῦν οὖν τί πειράζετε τὸν θεόν, ἐπιθεῖναι ζυγὸν ἐπὶ τὸν τράχηλον τῶν μαθητῶν ὃν οὔτε οἱ πατέρες ἡμῶν οὔτε ἡμεῖς ἰσχύσαμεν βαστάσαι;
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/010.yaml
  text: Now then[c][b][a], why are you testing God by putting a yoke on the neck of the disciples that neither our fathers nor we have been able to bear?
translation:
  language: ig
  text: Ya mere, ugbu a, gịnị mere unu ji etinye Chineke[a] n’ule site n’itinye ibo[b] n’olu ndị na-eso ụzọ—ibo nke ma ndị nna ochie anyị[c] ma anyị onwe anyị enweghị ike ibu?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “anwa Chineke.”
    reason: lexical_alternative
  - marker: b
    text: “Ibo” bụ ihe atụ nke ibu ọrụ a na-amanye mmadụ; n’ebe a, ọ na-ezo aka n’ihe ndị a chọrọ ka ndị na-eso ụzọ mee.
    reason: cultural_note
  - marker: c
    text: Ma ọ bụ, “ndị nna anyị.”
    reason: lexical_alternative
lexical_decisions:
- source_word: νῦν οὖν
  choice: Ya mere, ugbu a
  rationale: Nke a na-egosipụta ma nkwubi okwu sitere n’ihe e kwuru tupu ya ma ntụgharị gaa n’ajụjụ Pita na-ajụ ugbu a.
- source_word: τί πειράζετε τὸν θεόν
  choice: gịnị mere unu ji anwa Chineke
  rationale: Ajụjụ a bụ ajụjụ nkwupụta; ‘anwa Chineke’ na-edobe echiche nke ịnwale ma ọ bụ itinye Chineke n’ule n’enweghị ịkọwa ebumnuche ahụ karịa ihe Grik kwuru.
- source_word: ἐπιθεῖναι
  choice: site n’ịtụkwasị
  rationale: Ọ na-egosi ụzọ ha si anwa Chineke, ma na-adaba nke ọma na ihe atụ nke ịtụkwasị yok n’olu.
- source_word: ζυγὸν
  choice: yok
  rationale: E debere ihe atụ doro anya nke ngwá a na-etinye n’olu anụmanụ kama ịgbanwe ya ozugbo ka ọ bụrụ ‘ibu ọrụ’ ma ọ bụ ‘iwu.’
- source_word: ἐπὶ τὸν τράχηλον τῶν μαθητῶν
  choice: n’olu ndị na-eso ụzọ
  rationale: Nsụgharị a na-edobe onyonyo nke ihe e tinyere n’olu ma jiri okwu Igbo a na-aghọta nke ọma maka μαθηταί.
- source_word: οὔτε οἱ πατέρες ἡμῶν οὔτε ἡμεῖς
  choice: ma ndị nna nna anyị ma anyị onwe anyị
  rationale: N’usoro na-adịghị mma nke ‘enweghị ike,’ nhazi ‘ma ... ma ...’ na-egosi na ọ metụtara ìgwè abụọ ahụ; ‘ndị nna nna’ na-ezo aka n’ọgbọ ndị gara aga.
- source_word: ἰσχύσαμεν βαστάσαι
  choice: enweghị ike ibu
  rationale: Nke a na-egosipụta enweghị ike, ma ‘ibu’ na-aga n’ihu na ihe atụ nke yok a na-ebu.
theological_decisions:
- issue: Ihe ‘yok’ pụtara n’ihe atụ a
  choice: E debere ‘yok’ dịka ihe atụ nke ihe a na-amanye ndị na-eso ụzọ ka ha mee, n’akọwaghị ya kpọmkwem karịa amaokwu a.
  alternative: Ịkọwa ya n’ederede dịka Iwu Mosis dum, ma ọ bụ naanị ibi úgwù na iwu ndị metụtara ya.
  rationale: Ọnọdụ gbara amaokwu ahụ gburugburu metụtara ihe a chọrọ ka ndị mba ọzọ kwere ekwe mee, ma amaokwu a n’onwe ya ji ihe atụ kwuo okwu. Ya mere, nsụgharị ahụ anaghị ekpebi n’ederede isi ihe ozizi amaokwu ahụ na-akọwaghị kpọmkwem.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. A hapụrụ ihe atụ ‘yok’ n’ederede, tinyekwa nkọwa dị mkpirikpi n’ala peeji. Akara nkọwa [a], [b], na [c] niile dị n’ebe okwu ha na-akọwa pụtara.
