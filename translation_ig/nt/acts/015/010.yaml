- from: Ya mere, ugbu a, gịnị mere unu ji anwa Chineke[a] site n’ịtụkwasị yok[b] n’olu ndị na-eso ụzọ—yok nke ma ndị nna nna anyị[c] ma anyị onwe anyị enweghị ike ibu?
