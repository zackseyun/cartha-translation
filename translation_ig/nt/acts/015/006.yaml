  yaml_path: translation/nt/acts/015/006.yaml
  text: So the apostles and the elders gathered together to consider this matter[a][b].
translation:
  language: ig
  text: Ndịozi na ndị okenye wee zukọta ọnụ[a] ka ha tụlee okwu a[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “kpọkọtara onwe ha” ma ọ bụ “bịakọrọ ọnụ.” N’asụsụ Grik, ngwaa ahụ dị n’ụdị passive (“a kpọkọtara ha”), ma n’ọnọdụ a ọ na-apụtakarị na ìgwè ahụ zukọrọ.
    reason: lexical_alternative
  - marker: b
    text: N'ụzọ nkịtị, “ka ha hụ banyere okwu a.” N’ebe a, “okwu” pụtara ihe ma ọ bụ okwu esemokwu a na-atụle.
    reason: lexical_alternative
lexical_decisions:
- source_word: Συνήχθησάν
  choice: zukọrọ
  rationale: Okwu a bụ aorist passive n'ụdị ya, ma n'ọnọdụ a ọ na-arụ ọrụ dị ka ngwaa na-egosi na ìgwè ahụ bịakọrọ n'otu ebe. “Zukọrọ” bụ Igbo nkịtị ma doo anya.
- source_word: τε
  choice: Ya mere
  rationale: Akụkụokwu τε na-ejikọta amaokwu a n'ụzọ dị nro na esemokwu e kwuru n'amaokwu bu ya ụzọ; “Ya mere” na-egosi usoro akụkọ ahụ na ihe mere nzukọ ahụ ji soro.
- source_word: ἀπόστολοι
  choice: ndịozi
  rationale: N'Ọrụ Ndịozi, okwu a na-ezo aka n'ebe ndị ndu a maara dị ka ndịozi nọ; “ndịozi” bụ okwu Igbo a nabatara nke ọma.
- source_word: πρεσβύτεροι
  choice: ndị okenye
  rationale: N'ebe a, ọ na-egosi ndị ndu obodo ndị kwere ekwe, ọ bụghị naanị ụmụ nwoke merela agadi. “Ndị okenye” na-edobe nghọta akụkọ ahụ n'etinyeghị usoro ọchịchị ụka nke oge ndị mechara.
- source_word: ἰδεῖν
  choice: ka ha tụlee
  rationale: Ọ bụ ezie na isi nghọta ya bụ “ịhụ,” infinitive a na-egosi nzube nke inyocha na ịtụle ihe a na-ekwu. “Ka ha tụlee” bụ Igbo doro anya ma ọ naghị ekwu na e kpebiela okwu ahụ tupu oge eruo.
- source_word: περὶ τοῦ λόγου τούτου
  choice: okwu a
  rationale: λόγος nwere ike ịpụta okwu, ozi, ma ọ bụ ihe a na-atụle. N'ọnọdụ nzukọ a, “okwu a” na-ezo aka n'okwu esemokwu ahụ, ma na-edobekwa ntakịrị obosara nke okwu Grik ahụ.
theological_decisions:
- issue: Ọnọdụ ndị πρεσβύτεροι na nzukọ Jerusalem
  choice: ndị okenye
  alternative: ndị presbịta dịka ọkwa ụka e guzobere n'oge ndị mechara
  rationale: Amaokwu ahụ na-akọwa ndị ndu a maara n'ọgbakọ Jerusalem, ma ọ naghị amanye usoro ọchịchị ụka nke òtù ọ bụla ma ọ bụ nke oge ndị mechara.
- issue: Nzube ntụle nke nzukọ ahụ
  choice: ka ha tụlee okwu a
  alternative: ka ha kpebie okwu a
  rationale: ἰδεῖν na-egosi na ha malitere inyocha okwu ahụ. “Tụlee” anaghị ebu ụzọ kwuo ihe mkpebi ga-abụ ma ọ bụ na mkpebi ahụ adịlarị.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. “Ndịozi” na “ndị okenye” bụ okwu ụka ndị mmadụ maara, ma e zere ịtinye nkọwa pụrụ iche nke òtù okpukpe ọ bụla.
