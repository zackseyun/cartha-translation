- from: Ebe anyị nụrụ na ụfọdụ ndị si n’etiti anyị pụọ jiri okwu ha kpasuo unu ọgba aghara, na-eme ka obi ghara iru unu ala[a], ma anyị enyeghị ha ntụziaka ọ bụla[b],
  to: Ebe anyị nụrụ na ụfọdụ ndị si n’etiti anyị pụọ jiri okwu kpasuo unu ọgba aghara, na-akpaghasị mkpụrụ obi unu[a], ndị anyị na-enyeghị ntụziaka ọ bụla[b],
  rationale: The revision restores the source expression “your souls” in the main text, retains an idiomatic Igbo alternative in the footnote, and replaces the added adversative connector with a relative clause that directly identifies the men who received no instruction. It otherwise preserves the draft’s clear, modern Standard Igbo wording and the source’s ambiguity-free denial of authorization.
