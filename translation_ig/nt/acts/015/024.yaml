  text: ἐπειδὴ ἠκούσαμεν ὅτι τινὲς ἐξ ἡμῶν ⸀ἐξελθόντες ἐτάραξαν ὑμᾶς λόγοις ἀνασκευάζοντες τὰς ψυχὰς ⸀ὑμῶν οἷς οὐ διεστειλάμεθα,
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/024.yaml
  text: Since we have heard that some went out from us and troubled you with words[a], unsettling your souls, to whom we gave no instructions[b],
translation:
  language: ig
  text: Ebe anyị nụrụ na ụfọdụ ndị si n’etiti anyị pụọ jiri okwu kpasuo unu ọgba aghara, na-akpaghasị mkpụrụ obi unu[a], ndị anyị na-enyeghị ntụziaka ọ bụla[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'N’ụzọ ọzọ: “na-eme ka obi ghara iru unu ala.” Akpaokwu Grik ahụ, “mkpụrụ obi unu,” na-ekwu maka mmadụ n’ime ya dum, ọ bụghị naanị mmetụta uche.'
    reason: lexical_alternative
  - marker: b
    text: 'N’ụzọ ọzọ: “ndị anyị na-enyeghị iwu ọ bụla.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπειδὴ
  choice: Ebe
  rationale: Ọ na-egosi ihe mere e ji kwuo ihe na-esochi; ‘Ebe anyị nụrụ’ bụ ụzọ Igbo dị mfe ma bụrụkwa nke dabara n’akwụkwọ ozi.
- source_word: ἠκούσαμεν
  choice: anyị nụrụ
  rationale: Oge gara aga dị mfe n’Igbo na-egosi na akụkọ ahụ erutela ha ma ka dị mkpa ugbu a.
- source_word: τινὲς ἐξ ἡμῶν ἐξελθόντες
  choice: ụfọdụ ndị si n’etiti anyị pụọ
  rationale: Nke a na-echekwa ma mmalite ha n’etiti ndị dere akwụkwọ ozi ahụ ma ọpụpụ ha.
- source_word: ἐτάραξαν ὑμᾶς λόγοις
  choice: jiri okwu ha kpasuo unu ọgba aghara
  rationale: Ọ na-egosi na okwu ndị ahụ bụ ụzọ e si weta nchekasị na mgbagwoju anya, n’enweghị ịkọwapụta ọdịnaya ha karịa Grik.
- source_word: ἀνασκευάζοντες τὰς ψυχὰς ὑμῶν
  choice: na-eme ka obi ghara iru unu ala
  rationale: N’ọnọdụ a, ψυχή na-ezo aka n’ime mmadụ dum; akpaokwu Igbo a na-egosi mmegharị na ọgba aghara dị n’ime, ọ bụghị naanị mmetụta uche.
- source_word: οἷς οὐ διεστειλάμεθα
  choice: ma anyị enyeghị ha ntụziaka ọ bụla
  rationale: Ọ na-eme ka onye nnọchiaha ahụ doo anya n’Igbo ma chekwaa nkwupụta na ndị ahụ anataghị ikike ma ọ bụ ntụziaka n’aka ha.
theological_decisions:
- issue: Ma a ga-eme ka o doo anya na ndị kpatara ọgba aghara ahụ enweghị ikike n’aka ndị ozi na ndị okenye
  choice: ma anyị enyeghị ha ntụziaka ọ bụla
  alternative: ndị anyị na-enyeghị iwu ọ bụla
  rationale: Grik na-agọnahụ na e nyere ndị ahụ ntụziaka. Nsụgharị a na-echekwa isi ihe ahụ n’enweghị itinye okwu nkwenye ụka ọzọ; ‘ma’ jikọtara ya n’ụzọ Igbo nkịtị n’enweghị ime ka ọ bụrụ nkebi concessive siri ike.
translation_notes:
  register: Igbo ọkọlọtọ, nke ugbu a ma dị ùgwù. A họọrọ akpaokwu ndị mmadụ na-aghọta ngwa ngwa, ma e chekwara njikọ okwu na nghọta dị n’akwụkwọ Grik. Ama ntụaka ụkwụ [a] na [b] pụtara n’ederede isi.
