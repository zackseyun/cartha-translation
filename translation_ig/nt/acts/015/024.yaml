review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the causal opening, the departure of certain persons from the Jerusalem group, their troubling speech, and the denial that they had received authorization. However, “na-eme ka obi ghara iru unu ala” is more idiomatic than source-specific and does not retain the explicit reference to “your souls” (τὰς ψυχὰς ὑμῶν). The adversative “ma” also recasts the Greek relative clause as a contrastive statement.
  naturalness: “Ebe anyị nụrụ” and “ụfọdụ ndị si n’etiti anyị pụọ” are natural Standard Igbo. “Jiri okwu kpasuo unu ọgba aghara” is understandable and appropriately conveys disturbance caused by speech. “Na-akpaghasị mkpụrụ obi unu” is a natural enough formal/biblical-register rendering and better matches the Greek expression.
  terminology: Use “mkpụrụ obi unu” in the main text so that the rendering and its lexical footnote correspond to ψυχὰς ὑμῶν. Render οἷς as “ndị,” rather than adding “ma,” thereby retaining the Greek relative-clause connection and clearly identifying the unauthorized persons.
  issues:
  - severity: medium
    issue: The main text omits the explicit “souls” terminology.
    rationale: The source says “unsettling your souls.” The current idiom conveys inward distress but shifts away from the stated lexical referent, while the footnote discusses a phrase not present in the main text.
  - severity: low
    issue: “Ma anyị enyeghị ha...” introduces an adversative linkage.
    rationale: The Greek has a relative clause, “whom we did not instruct,” not an explicit “but/however” construction. “Ndị anyị na-enyeghị...” is both clear and structurally closer.
  revised_text: Ebe anyị nụrụ na ụfọdụ ndị si n’etiti anyị pụọ jiri okwu kpasuo unu ọgba aghara, na-akpaghasị mkpụrụ obi unu[a], ndị anyị na-enyeghị ntụziaka ọ bụla[b],
  revised_footnotes:
