revisions:
- from: Ya mere, anyị ezitela[a] Judas na Saịlas; ha onwe ha ga-ejikwa okwu ọnụ[b] gwa unu otu ihe ndị ahụ.
  to: Ya mere, anyị ezitela[a] Judas na Saịlas; ha onwe ha ga-ekwuputa ihe ndị ahụ kwa n’ọnụ[b].
  rationale: The revision removes the unstated recipient added by “gwa unu,” renders the plural τὰ αὐτά more clearly as “ihe ndị ahụ kwa,” and preserves the emphasis that Judas and Silas themselves will orally communicate the same matters. The perfect “anyị ezitela,” the names, and the logical connection “Ya mere” are retained.
