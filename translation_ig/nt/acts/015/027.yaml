base_translation:
  language: en
  yaml_path: translation/nt/acts/015/027.yaml
  text: Therefore we have sent Judas and Silas[b][a], who themselves will report the same things by word of mouth.
translation:
  language: ig
  text: Ya mere, anyị ezitela[a] Judas na Saịlas; ha onwe ha ga-ekwuputa ihe ndị ahụ kwa n’ọnụ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “anyị zigara.” Ma “anyị ezitela” na-egosi na e mezuworị iziga ha nakwa na ihe ahụ ka metụtara ọnọdụ dị ugbu a.
    reason: lexical_alternative
  - marker: b
    text: N’ụzọ nkịtị, “site n’okwu”; ya bụ, n’ọnụ, na mgbakwunye n’akwụkwọ ozi ahụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεστάλκαμεν
  choice: anyị ezitela
  rationale: Ngwaa mmecha “ezitela” na-egosi na e mezuworị iziga ha, ma ihe omume ahụ ka metụtara ọnọdụ dị ugbu a; nke a na-echekwa isi ike nke perfect Grik n’Igbo dị eke.
- source_word: οὖν
  choice: Ya mere
  rationale: Ọ na-egosi nkwubi okwu sitere ná mkpebi ndị kansụl kwuru tupu nke a.
- source_word: Ἰούδαν καὶ Σιλᾶν
  choice: Judas na Saịlas
  rationale: E dere aha ndị ahụ n’ụdị ntụgharị-olu dabara n’ọdịdị Standard Igbo.
- source_word: αὐτοὺς
  choice: ha onwe ha
  rationale: 'Nke a na-echekwa nkwusi ike dị na nnọchiaha Grik: ndị ozi ahụ n’onwe ha ga-akwado ihe dị n’akwụkwọ ozi ahụ.'
- source_word: διὰ λόγου
  choice: jiri okwu ọnụ
  rationale: N’ebe a, okwu ahụ na-egosi nkwurịta okwu e kwuru n’ọnụ, nke dị iche n’akwụkwọ ozi e dere.
- source_word: ἀπαγγέλλοντας
  choice: ga-agwa unu
  rationale: Ọ bụ ezie na nke a bụ participle n’asụsụ Grik, n’ahịrịokwu a ọ na-akọ ihe Judas na Saịlas ga-eme mgbe ha rutere; ọdịnihu doro anya ma dịkwa eke n’Igbo.
- source_word: τὰ αὐτά
  choice: otu ihe ndị ahụ
  rationale: Nke a na-ezo aka kpọmkwem n’ihe ndị ahụ dị n’ozi kansụl, na-enweghị ịgbanwe ya ka ọ bụrụ naanị otu ‘ozi’.
