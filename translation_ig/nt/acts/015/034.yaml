translation:
  language: ig
  text: Ma ọ dị Saịlas mma ịnọgide n'ebe ahụ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Amaokwu a adịghị n’ihe odide Grik ndị kacha ochie, gụnyere Papịrọs 74 nke narị afọ nke atọ, na Sinaitikọs na Vatikanọs nke narị afọ nke anọ; ọ dịghịkwa n’ọtụtụ nsụgharị Kọptik ndị mbụ. Ọ dị n’ọtụtụ ihe odide nke ọdịnala Baịzantịn, n’ụfọdụ ihe odide Aleksandria na nke Ọdịda Anyanwụ ndị e dere mgbe e mesịrị, nakwa n’ọdịnala Latịn na Siriak. O yikarịrị ka ode akwụkwọ oge e mesịrị gbakwunyere ya iji kọwaa otú Saịlas si ka nọ n’Antiọk wee soro Pọl n’amaokwu 40, n’agbanyeghị na amaokwu 33 kwuru na ya na Judas apụọla.
    reason: textual_critical
lexical_decisions:
- source_word: ἔδοξε ... τῷ Σίλᾳ
  choice: Saịlas chere na ọ dị mma
  rationale: 'Nke a na-egosipụta ojiji δοκέω nke na-esochi onye nọ na dative: ihe ahụ yiri onye ahụ ihe dị mma, ya bụ, o kpebiri ime ya. Ọ na-edobe ọdịdị na ịdị nro nke okwu Grik karịa ịsị naanị ‘Saịlas kpebiri.’'
- source_word: ἐπιμεῖναι
  choice: ka ọ nọgide
  rationale: ‘Ịnọgide’ na-egosi ịnọ n'otu ebe gaa n'ihu, nke kwekọrọ n'ἐπιμένω n'ọnọdụ a.
- source_word: αὐτοῦ
  choice: n'ebe ahụ
  rationale: N'ebe a αὐτοῦ bụ adverb na-egosi ebe, na-ezo aka n'Antiọk.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị ùgwù ma doo ndị nkịtị anya. A họọrọ ‘chere na ọ dị mma’ iji debe usoro na nghọta okwu Grik, ebe ‘nọgide n'ebe ahụ’ na-enye nghọta doro anya nke ọnọdụ ahụ.
