id: ACT.15.2
reference: Acts 15:2
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: γενομένης ⸀δὲ στάσεως καὶ ζητήσεως οὐκ ὀλίγης τῷ Παύλῳ καὶ τῷ Βαρναβᾷ πρὸς αὐτοὺς ἔταξαν ἀναβαίνειν Παῦλον καὶ Βαρναβᾶν καί τινας ἄλλους ἐξ αὐτῶν πρὸς τοὺς ἀποστόλους καὶ πρεσβυτέρους εἰς Ἰερουσαλὴμ περὶ τοῦ ζητήματος τούτου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/002.yaml
  text: And after no small dissension and debate had arisen between Paul and Barnabas and them[c][b][a], they appointed Paul and Barnabas and some others from among them to go up to the apostles and elders in Jerusalem about this issue.
translation:
  language: ig
  text: Mgbe esemokwu na arụmụka dị ukwuu[a] bilitere n’etiti Pọl na Banabas na ndị ahụ, ha họpụtara Pọl na Banabas na ụfọdụ ndị ọzọ site n’etiti ha ka ha rigoo[b] Jerusalem, gakwuru ndịozi na ndị okenye banyere okwu a[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’ụzọ nkịtị, ‘na-abụghị nke nta.’ Grik ji ụzọ okwu a mesie ike na esemokwu na arụmụka ahụ dị ukwuu.
    reason: lexical_alternative
  - marker: b
    text: ‘Ịrịgo’ bụ ụzọ okwu Grik a na-ejikarị ekwu maka njem ịga Jerusalem.
    reason: cultural_note
  - marker: c
    text: A pụkwara ịsụgharị ya, ‘banyere ihe a’ ma ọ bụ ‘banyere ajụjụ a.’
    reason: lexical_alternative
lexical_decisions:
- source_word: γενομένης δὲ
  choice: Mgbe ... bilitere
  rationale: Nke a na-egosipụta ọnọdụ nke mere tupu isi omume ahụ amalite, ma na-ada nke ọma n’Igbo.
- source_word: στάσεως καὶ ζητήσεως
  choice: esemokwu na arụmụka
  rationale: “Esemokwu” na-egosipụta mmegide siri ike, ebe “arụmụka” na-egosipụta ịrụrịta ụka ọnụ; njikọ ha na-echekwa ọdịiche dị n’okwu Grik abụọ ahụ.
- source_word: οὐκ ὀλίγης
  choice: dị ukwuu
  rationale: Nke a na-enye Igbo doro anya na nke e ji eme ihe taa maka litotes Grik ahụ, bụ́ “na-abụghị nke nta,” nke na-emesi ịdị ukwuu nke esemokwu ahụ ike.
- source_word: τῷ Παύλῳ καὶ τῷ Βαρναβᾷ πρὸς αὐτούς
  choice: n’etiti Pọl na Banabas na ndị ahụ
  rationale: Nke a na-akọwa ndị sonyere n’esemokwu ahụ n’enweghị itinye echiche mmegide karịrị ihe Grik kwuru. “Ndị ahụ” na-ezo aka n’ụmụ nwoke si Judia n’amaokwu bu ụzọ.
- source_word: ἔταξαν
  choice: ha họpụtara
  rationale: N’ebe a, okwu ahụ na-egosi na e kewapụtara ndị nnọchiteanya maka njem ahụ, ọ bụghị naanị na e mere mkpebi banyere njem.
- source_word: ἀναβαίνειν
  choice: ka ha rigoo
  rationale: E debere okwu njem nke pụtara ‘ịrịgo,’ bụ́ ụzọ a na-ejikarị ekwu maka ịga Jerusalem.
- source_word: τινας ἄλλους ἐξ αὐτῶν
  choice: ụfọdụ ndị ọzọ n’etiti ha
  rationale: Nke a na-egosi na a họpụtara ndị nnọchiteanya ndị ọzọ site n’otu obodo ahụ n’etinyeghị nkọwa na-adịghị na Grik.
- source_word: τοὺς ἀποστόλους καὶ πρεσβυτέρους
  choice: ndịozi na ndị okenye
  rationale: A na-eji aha ndị a maara nke ọma n’akwụkwọ Ọrụ Ndịozi, ma ha na-egosipụta ndị otu abụọ a kpọrọ aha n’isi mmalite.
- source_word: περὶ τοῦ ζητήματος τούτου
  choice: banyere okwu a
  rationale: “Okwu a” bụ Igbo nkịtị ma doo anya maka ihe a na-arụrịta ụka banyere ya; ọ naghị ekpebi ihe esemokwu ahụ n’ụzọ karịrị isi mmalite.
theological_decisions:
- issue: Ndị nọ n’akụkụ abụọ nke esemokwu ahụ
  choice: A sụgharịrị ya dị ka esemokwu dị n’etiti Pọl na Banabas na ‘ndị ahụ,’ bụ́ ndị si Judia e kwuru okwu ha n’amaokwu bu ụzọ.
  alternative: A pụrụ ịsụgharị ya, ‘Pọl na Banabas na ha nwere nnukwu esemokwu na arụmụka.’
  rationale: Nhọrọ a na-agbaso njikọ ahịrịokwu Grik na ihe e kwuru ozugbo n’amaokwu bu ụzọ, n’etinyeghị nkọwa ụka ma ọ bụ ozizi pụrụ iche.
- issue: Ihe ἔταξαν na-egosi banyere nhọpụta ndị nnọchiteanya
  choice: A họọrọ ‘ha họpụtara’ iji gosi na obodo ahụ kewapụtara ndị ga-anọchi anya ha.
  alternative: ‘ha kpebiri’ ma ọ bụ ‘ha haziri’
  rationale: Nke a na-egosipụta usoro obodo ahụ gbasoro, ma ọ naghị ekwu na usoro ọchịchị ụka pụrụ iche dị ebe ahụ karịa ihe ederede kwuru.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị mfe nghọta ma nwee ugwu, dee amaokwu ahụ. A họọrọ okwu ndị mmadụ na-ejikarị eme ihe dịka ‘esemokwu,’ ‘arụmụka,’ na ‘okwu a.’ E debere ‘rigoo’ iji chekwaa ụzọ okwu njem e ji mara Jerusalem, ebe nkọwa ala ala peeji na-eme ka ihe ọ pụtara doo anya.
