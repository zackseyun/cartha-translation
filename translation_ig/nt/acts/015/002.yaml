    text: A pụkwara ịsụgharị ya, ‘banyere ihe a’ ma ọ bụ ‘banyere ajụjụ a.’
    reason: lexical_alternative
  revision_rationale: The revision removes the added ‘go and see’ sense and renders the destination with “gakwuru,” which follows πρὸς more closely. It also clarifies that the other delegates were selected from among the local group. The source’s wording, level of seriousness, institutional restraint, and ambiguity concerning the appointing group are preserved.
