revisions:
- from: Mgbe esemokwu na arụmụka dị ukwuu[a] bilitere n’etiti Pọl na Banabas na ndị ahụ, ha họpụtara Pọl na Banabas na ụfọdụ ndị ọzọ n’etiti ha ka ha rigoo[b] Jerusalem gaa hụ ndịozi na ndị okenye banyere okwu a[c].
  to: Mgbe esemokwu na arụmụka dị ukwuu[a] bilitere n’etiti Pọl na Banabas na ndị ahụ, ha họpụtara Pọl na Banabas na ụfọdụ ndị ọzọ site n’etiti ha ka ha rigoo[b] Jerusalem, gakwuru ndịozi na ndị okenye banyere okwu a[c].
  rationale: The revision removes the added ‘go and see’ sense and renders the destination with “gakwuru,” which follows πρὸς more closely. It also clarifies that the other delegates were selected from among the local group. The source’s wording, level of seriousness, institutional restraint, and ambiguity concerning the appointing group are preserved.
  reviewer_model: gpt-5.6-terra
