  text: καὶ ⸀οὐθὲν διέκρινεν μεταξὺ ἡμῶν τε καὶ αὐτῶν, τῇ πίστει καθαρίσας τὰς καρδίας αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/009.yaml
  text: And he made no distinction between us and them[a], having cleansed their hearts by faith.
translation:
  language: ig
  text: Ọ meghịkwa ọdịiche ọ bụla n’etiti anyị na ha, mgbe o ji okwukwe sachara obi ha.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ, “site n’okwukwe.” Ụdị dative nke Grik nwere ike igosi ụzọ e si eme ihe ma ọ bụ ihe e ji eme ihe.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐθὲν διέκρινεν
  choice: o meghịkwa ọdịiche ọ bụla
  rationale: Nkebi okwu a na-egosi na Chineke ekewaghị ìgwè abụọ ahụ ma ọ bụ mesoo ha n’ụzọ dị iche; ntụgharị a bụ Igbo doro anya ma na-edobe ike nke nkwupụta Grik ahụ.
- source_word: μεταξὺ ἡμῶν τε καὶ αὐτῶν
  choice: n’etiti anyị na ha
  rationale: Nke a bụ ụzọ Igbo nkịtị si egosipụta mmekọrịta dị n’etiti ìgwè abụọ ahụ; τε ... καὶ achọghị ka e tinye okwu ọzọ pụrụ iche n’Igbo.
- source_word: τῇ πίστει
  choice: ji okwukwe
  rationale: Dative ahụ nwere ike igosi ihe e ji mee ihe. ‘Ji okwukwe’ bụ okwu Igbo ebumpụta ụwa nke na-edobe ‘okwukwe’ dịka ihe Chineke ji sachaa obi ha.
- source_word: καθαρίσας
  choice: ebe o ... sachaa
  rationale: Nke a na-edobe participle ahụ ka ọ bụrụ omume jikọrọ ya na isi ngwaa, n’ebughị ụzọ kpebie kpamkpam ma ọ bụ omume mere tupu ya ma ọ bụ nke so ya.
- source_word: τὰς καρδίας αὐτῶν
  choice: obi ha
  rationale: ‘Obi’ bụ okwu Igbo a na-ejikarị akọwa mmadụ ime, ọ bụghị naanị mmetụta uche, ma ọ na-edobe okwu ihe oyiyi nke καρδία.
theological_decisions:
- issue: Ntụgharị πίστις
  choice: okwukwe
  alternative: ntụkwasị obi
  rationale: N’ebe a πίστις na-ezo aka n’okwukwe dịka ụzọ Chineke si mee ka obi ha dị ọcha. ‘Okwukwe’ bụ okwu sara mbara ma bụrụkwa nke a na-ahụkarị n’Igbo, n’enweghị itinye nkọwa otu ụka pụrụ iche.
- issue: Mmekọrịta τῇ πίστει na καθαρίσας
  choice: ji okwukwe sachaa
  alternative: site n’okwukwe sachaa
  rationale: A ghọtara dative ahụ dịka ihe e ji mee ihe, ma e debere ụzọ okwu ọzọ kwe omume na nkọwa ala peeji ka a ghara imechi obere ọdịiche dị n’ụzọ e si akọwa ya.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. ‘Ọdịiche ọ bụla’ na ‘n’etiti anyị na ha’ bụ okwu nkịtị; ‘obi ha’ na ‘okwukwe’ na-edobe ihe oyiyi na okwu nkà mmụta okpukpe nke isi mmalite ahụ.
