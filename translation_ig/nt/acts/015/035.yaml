  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Παῦλος δὲ καὶ Βαρναβᾶς διέτριβον ἐν Ἀντιοχείᾳ διδάσκοντες καὶ εὐαγγελιζόμενοι μετὰ καὶ ἑτέρων πολλῶν τὸν λόγον τοῦ κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/035.yaml
  text: But Paul and Barnabas stayed in Antioch[a], teaching and proclaiming the good news of the word of the Lord[c][b], with many others also.
translation:
  language: ig
  text: Ma Pọl na Banabas nọgidere n’Antiọk[a], ebe ha na ọtụtụ ndị ọzọ na-akụzi ma na-ekwusa ozi ọma[b], bụ okwu Onyenwe anyị[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “nọrọ oge ụfọdụ n’Antiọk.” Ngwaa Grik ahụ nwere ike imesi ịnọ n’ebe ahụ ruo oge ụfọdụ ike.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “na-ezisa ozi ọma.” Ngwaa Grik ahụ pụtara ikwupụta ma ọ bụ ikwusa ozi ọma.
    reason: lexical_alternative
  - marker: c
    text: “Okwu Onyenwe anyị” bụ ahịrịokwu a na-ahụkarị n’Ọrụ Ndị Ozi maka ozi Onyenwe anyị; a pụkwara ịsụgharị ya “ozi Onyenwe anyị.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διέτριβον
  choice: nọrọ
  rationale: Oge imperfect na-egosi na ha nọgidere n’Antiọk ruo oge ụfọdụ; “nọrọ” bụ okwu Igbo dị mfe ma na-edobe echiche nke ịnọgide ebe ahụ.
- source_word: διδάσκοντες
  choice: na-akụzi
  rationale: Ọ na-egosi ọrụ nkuzi ha nọ na-eme mgbe ha nọ n’Antiọk.
- source_word: εὐαγγελιζόμενοι
  choice: na-ekwusa ozi ọma
  rationale: Nkebi a na-egosi ikwupụta ozi ọma; ntụgharị a doro ndị Igbo nke oge a anya ma na-edobe ike nke nkwusa.
- source_word: μετὰ καὶ ἑτέρων πολλῶν
  choice: ha na ọtụtụ ndị ọzọ
  rationale: Nke a na-egosi na ọtụtụ ndị ọzọ sokwa Pọl na Banabas rụọ ọrụ ahụ; “na” ebe a na-egosi iso ha mee ya.
- source_word: λόγον
  choice: okwu
  rationale: λόγος nwere ike ịbụ “okwu” ma ọ bụ “ozi.” E debere “okwu” iji chekwaa ahịrịokwu Luk na-ejikarị eme ihe, “okwu Onyenwe anyị.”
- source_word: κυρίου
  choice: Onyenwe anyị
  rationale: A sụgharịrị κύριος dịka aha nsọpụrụ “Onyenwe anyị,” n’enweghị ịkọwapụta onye a na-ekwu maka ya karịa otú Grik si kwuo.
theological_decisions:
- issue: Onye “Onyenwe anyị” na-ezo aka na ya n’ahịrịokwu “okwu Onyenwe anyị”
  choice: E debere ya dịka “Onyenwe anyị” n’enweghị nkọwa ọzọ.
  alternative: “okwu Onyenwe anyị Jizọs” ma ọ bụ “ozi nke sitere n’aka Chineke.”
  rationale: N’Ọrụ Ndị Ozi, “Onyenwe anyị” nwere ike izokarị aka na Jizọs, ma Grik ebe a ekwughị aha ahụ kpọmkwem. Ntụgharị ahụ anaghị edozi ihe odide ahụ hapụrụ n’ụzọ sara mbara.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. Nhazi “ha na ọtụtụ ndị ọzọ” na-eme ka o doo anya na ndị ọzọ sokwa ha na-akụzi ma na-ekwusa, ebe e chekwara njikọ “okwu Onyenwe anyị” na-enweghị ịgbakwunye nkọwa okpukpe na-adịghị n’odide Grik.
