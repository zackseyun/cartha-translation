  variant: Standard Igbo
source:
  edition: SBLGNT
  text: μετὰ δὲ τὸ σιγῆσαι αὐτοὺς ἀπεκρίθη Ἰάκωβος λέγων· Ἄνδρες ἀδελφοί, ἀκούσατέ μου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/013.yaml
  text: And after they became silent[a], James answered, saying, “Brothers[b], listen to me.”
translation:
  language: ig
  text: Mgbe ha kwụsịrị ikwu okwu[a], Jemis zara, sị, “Ụmụ nwoke, ụmụnna[b], geenụ m ntị.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “Mgbe ha gbachiri nkịtị.” Okwu Grik ahụ na-egosi na Jemis kwuru okwu mgbe ndị kwuru okwu tupu ya kwụsịrị ikwu okwu.
    reason: lexical_alternative
  - marker: b
    text: N’asụsụ Grik, okwu ịkpọ ha bụ kpọmkwem “Ụmụ nwoke, ụmụnna.” Ọ bụ ụzọ nkwanye ùgwù e si akpọ ụmụ nwoke na ụmụnna okwu n’ọha.
    reason: cultural_note
lexical_decisions:
- source_word: μετὰ δὲ τὸ σιγῆσαι αὐτοὺς
  choice: Mgbe ha kwụsịrị ikwu okwu
  rationale: Μετά na infinitive nwere article na-egosi oge sochiri ihe gara aga; σιγάω n’ebe a pụtara ịkwụsị ikwu okwu ma ọ bụ ịgbachi nkịtị. Nsụgharị a bụ Igbo dị mfe ma doo usoro ihe mere anya.
- source_word: ἀπεκρίθη
  choice: zara
  rationale: Okwu a pụtara ịza ma ọ bụ imeghachi okwu; “zara” dabara n’usoro akụkọ na ọnọdụ mkparịta ụka ahụ.
- source_word: Ἰάκωβος
  choice: Jemis
  rationale: A gbasoro ụdị aha a na-ejikarị n’ọtụtụ nsụgharị Baịbụl Igbo maka onye a maara dị ka James n’asụsụ Bekee.
- source_word: λέγων
  choice: sị
  rationale: Participial λέγων na-ewebata okwu onye ahụ kwuru kpọmkwem; “sị” bụ ụzọ Igbo ebumpụta ụwa si eme nke a.
- source_word: Ἄνδρες ἀδελφοί
  choice: Ụmụ nwoke, ụmụnna m
  rationale: 'E chekwara vocative abụọ dị na Grik: ἄνδρες bụ ụmụ nwoke, ἀδελφοί bụ ụmụnna nwoke. “Ụmụnna m” na-eme ka ịkpọ ndị mmadụ okwu dịrị ndụ n’Igbo, ebe ihe odide na ndetu ala na-echekwa ọdịdị nwoke nke okwu ahụ.'
- source_word: ἀκούσατέ μου
  choice: geenụ m ntị
  rationale: Imperative a na-akpọ ndị na-ege ntị ka ha gee ya ntị nke ọma; “geenụ m ntị” bụ okwu Igbo nkịtị ma na-echekwa ike iwu ahụ.
theological_decisions:
- issue: Okwu ịkpọ ndị nọ ná nzukọ nke nwere ọdịdị nwoke
  choice: E debere “Ụmụ nwoke, ụmụnna m” n’ihe odide bụ isi.
  alternative: “Ụmụnna m” naanị ya, ma ọ bụ “Ụmụnna nwoke na nwanyị.”
  rationale: Grik nwere vocative nwoke abụọ, ἄνδρες na ἀδελφοί. Ide ha abụọ na-echekwa ụdị na ike okwu mbụ, n’enweghị ịgbasa ya ka ọ kpọọ ụmụnna nwanyị aha kpọmkwem; ndetu ala na-akọwa ọnọdụ nzukọ ahụ.
translation_notes:
  register: E ji Igbo izugbe nke oge a, dị ùgwù ma dị mfe nghọta. “Sị” na “geenụ m ntị” na-eme ka ahịrịokwu ahụ daa ka okwu Igbo ebumpụta ụwa, ebe “Ụmụ nwoke, ụmụnna m” na-echekwa ihe abụọ dị na vocative Grik.
