    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “site n’etiti mba dị iche iche.”
    reason: lexical_alternative
  - marker: c
    text: Ya bụ, otu ndị bụ nke Chineke, ndị e ji aha ya mara.
    reason: cultural_note
  revision_rationale: The revision removes the unsupported future nuance, renders λαβεῖν directly as “were,” and uses “otu ndị maka aha ya” for “a people for his name.” This is faithful to the Greek, idiomatic in modern Standard Igbo, and retains the source’s theological and covenantal wording.
