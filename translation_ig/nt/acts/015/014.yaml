id: ACT.15.14
reference: Acts 15:14
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Συμεὼν ἐξηγήσατο καθὼς πρῶτον ὁ θεὸς ἐπεσκέψατο λαβεῖν ἐξ ἐθνῶν ⸀λαὸν τῷ ὀνόματι αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/014.yaml
  text: Simeon has recounted how God first visited the Gentiles to take from them a people for his name[a][b][c].
translation:
  language: ig
  text: Simiọn[a] akọwala otú Chineke siri buru ụzọ leta ndị mba ọzọ[b], ka o wee si n’etiti ha were otu ndị maka aha ya[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Saịmọn.” Jemis ji ụdị aha ahụ bụ “Simiọn” mee ihe n’ebe a.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “site n’etiti mba dị iche iche.”
    reason: lexical_alternative
  - marker: c
    text: Ya bụ, otu ndị bụ nke Chineke, ndị e ji aha ya mara.
    reason: cultural_note
lexical_decisions:
- source_word: Συμεὼν
  choice: Simiọn
  rationale: E degharịrị ụdị aha ahụ dị n’asụsụ Grik, ‘Simeon,’ kama ime ka ọ bụrụ ụdị aha a na-ahụkarị, ‘Saịmọn.’
- source_word: ἐξηγήσατο
  choice: akọwala
  rationale: Okwu a pụtara ịkọ ma ọ bụ ịkọwa akụkọ. ‘Akọwala’ dabara n’ọnọdụ a, ebe Jemis na-achịkọta ihe Simiọn ka kwuchara.
- source_word: καθὼς
  choice: otú ... si
  rationale: N’azụ ngwaa nke ịkọ akụkọ, okwu a na-ewebata ihe a kọrọ na ụzọ o si mee; ‘otú ... si’ bụ Igbo doro anya ma kwekọọ n’usoro ahụ.
- source_word: πρῶτον
  choice: buru ụzọ
  rationale: Nke a na-egosi na ihe Chineke mere bụ mmalite nke omume ya n’etiti ndị mba ọzọ.
- source_word: ἐπεσκέψατο
  choice: leta
  rationale: ‘Leta’ na-echekwa okwu ihe atụ nke isi mmalite, nke nwere echiche banyere Chineke ilebara ndị mmadụ anya ma mee ihe n’ihi ha, n’akọwaghị ya gabiga ókè.
- source_word: λαβεῖν
  choice: iji ... nweta
  rationale: Infinitive a na-egosi nzube. ‘Nweta’ na-enye echiche nke iwere ndị ahụ ka ha bụrụ ndị nke Chineke n’ụzọ Igbo na-ada nke ọma, n’enweghị ịgbakwụnye echiche nke na-adịghị na isi mmalite.
- source_word: ἐξ ἐθνῶν
  choice: site n’etiti ndị mba ọzọ
  rationale: N’Ọrụ Ndịozi 15, okwu a na-ezo aka n’ebe ndị na-abụghị ndị Juu nọ. ‘Site n’etiti ndị mba ọzọ’ na-echekwa ma echiche ahụ ma ike nke preposition ἐξ.
- source_word: λαὸν
  choice: ndị ga-abụ ndị
  rationale: N’Igbo, ikwughachi ‘ndị’ n’usoro a na-egosipụta otu ìgwè mmadụ a họpụtara ka ha bụrụ ndị Chineke, ma na-ezere okwu na-adịghị eke dịka ‘otu ndị mmadụ.’
- source_word: τῷ ὀνόματι αὐτοῦ
  choice: ndị nke aha ya
  rationale: Nhọrọ a na-echekwa njikọ nke ndị ahụ na aha Chineke, ma na-egosi na ha bụ nke ya n’enweghị ime ka okwu ahụ bụrụ naanị ‘maka onwe ya.’
theological_decisions:
- issue: Ma a ga-asụgharị ἐξ ἐθνῶν dịka ‘ndị mba ọzọ’ ka ọ bụ ‘mba dị iche iche’
  choice: ndị mba ọzọ
  alternative: mba dị iche iche
  rationale: N’ọnọdụ Ọrụ Ndịozi 15, okwu ahụ na-ekwu kpọmkwem banyere ndị na-abụghị ndị Juu na nnabata ha n’etiti ndị Chineke.
- issue: Ma a ga-akọwa τῷ ὀνόματι αὐτοῦ naanị dịka ‘maka onwe ya’
  choice: ndị nke aha ya
  alternative: ndị nke ya
  rationale: ‘Ndị nke aha ya’ na-echekwa asụsụ ọgbụgba ndụ nke isi mmalite na njikọ dị n’etiti aha Chineke, ịbụ nke ya, na njirimara ndị ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta, mee ihe. E chekwara okwu ihe atụ banyere Chineke ‘ileta’ ndị mba ọzọ na okwu banyere ‘aha ya,’ ebe nkọwa dị mkpa banyere ha dị n’ala peeji.
