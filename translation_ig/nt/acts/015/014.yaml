revisions:
- from: Simiọn[a] akọwala otú Chineke si buru ụzọ leta ndị mba ọzọ[b], iji site n’etiti ha nweta ndị ga-abụ ndị nke aha ya[c].
  to: Simiọn[a] akọwala otú Chineke siri buru ụzọ leta ndị mba ọzọ[b], ka o wee si n’etiti ha were otu ndị maka aha ya[c].
  rationale: The revision removes the unsupported future nuance, renders λαβεῖν directly as “were,” and uses “otu ndị maka aha ya” for “a people for his name.” This is faithful to the Greek, idiomatic in modern Standard Igbo, and retains the source’s theological and covenantal wording.
  reviewer_model: gpt-5.6-terra
