    text: Okwu Grik ahụ bụ “ụmụnna” n’ụdị nwoke, ma n’ebe a ọ pụrụ ịgụnye ndị kwere ekwe niile, ma ndị nwoke ma ndị nwanyị.
    reason: lexical_alternative
  revision_rationale: A gbanwere naanị nkọwa ala peeji ka ọ kọwaa nke ọma na ἀδελφοί bụ okwu Grik dị n’ụdị nwoke nke pụrụ ịnọchite anya ọgbakọ ndị kwere ekwe dum; e debere ederede isi n’ihi na ọ na-esochi isi mmalite ma bụrụ Igbo eke.
