id: ACT.15.36
reference: Acts 15:36
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Μετὰ δέ τινας ἡμέρας εἶπεν ⸂πρὸς Βαρναβᾶν Παῦλος⸃· Ἐπιστρέψαντες δὴ ἐπισκεψώμεθα τοὺς ⸀ἀδελφοὺς κατὰ ⸂πόλιν πᾶσαν⸃ ἐν αἷς κατηγγείλαμεν τὸν λόγον τοῦ κυρίου, πῶς ἔχουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/036.yaml
  text: After some days[a], Paul said to Barnabas, “Let us return now and visit the brothers in every city where we proclaimed the word of the Lord, and see how they are.”
translation:
  language: ig
  text: Mgbe ụbọchị ụfọdụ gachara, Pọl gwara Banabas, “Ka anyị laghachi ugbu a gaa leta ụmụnna[a] nọ n’obodo ọ bụla anyị kwusara okwu Onyenwe anyị na ya, hụkwa otú ha dị.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Okwu Grik ahụ bụ “ụmụnna” n’ụdị nwoke, ma n’ebe a ọ pụrụ ịgụnye ndị kwere ekwe niile, ma ndị nwoke ma ndị nwanyị.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δέ τινας ἡμέρας
  choice: Mgbe ụbọchị ụfọdụ gachara
  rationale: Nke a na-egosi oge sochirinụ ma na-ahapụ ogologo oge ahụ ka ọ bụrụ nke a na-akọwaghị kpọmkwem.
- source_word: εἶπεν πρὸς Βαρναβᾶν Παῦλος
  choice: Pọl gwara Banabas
  rationale: ‘Gwara’ bụ ụzọ Igbo si ekwu okwu mmadụ gwara onye ọzọ n'ụzọ dị mfe ma doo anya.
- source_word: Ἐπιστρέψαντες δὴ ἐπισκεψώμεθα
  choice: Ka anyị laghachi ugbu a gaa leta
  rationale: Nke a jikọtara participle ahụ na hortatory subjunctive n’Igbo dị ire, ma ‘ugbu a’ na-eburu ike δὴ nke na-akpali ka e mee ya.
- source_word: τοὺς ἀδελφοὺς
  choice: ụmụnna
  rationale: ‘Ụmụnna’ na-edebe ihe atụ ezinụlọ dị n’okwu Grik ahụ, ma n’Igbo ọ pụkwara ịgụnye ndị nwoke na ndị nwanyị; e tinyere nkọwa n’ala peeji maka ụdị okwu nwoke dị na Grik.
- source_word: κατὰ πόλιν πᾶσαν
  choice: n’obodo ọ bụla
  rationale: 'Nke a na-egosipụta nkesa ahụ: obodo nke ọ bụla ha jere ozi na ya.'
- source_word: ἐν αἷς κατηγγείλαμεν
  choice: anyị kwusara ... na ya
  rationale: ‘Kwusara’ na-egosi nkwupụta ozi n’ihu ọha, ebe usoro ‘na ya’ na-eme ka njikọ obodo ahụ bụrụ Igbo ebumpụta ụwa.
- source_word: τὸν λόγον τοῦ κυρίου
  choice: okwu Onyenwe anyị
  rationale: Nke a na-edebe ma ‘okwu/ozi’ ahụ ma aha nsọpụrụ κύριος n’ụdị a na-aghọta nke ọma n’Igbo.
- source_word: πῶς ἔχουσιν
  choice: hụkwa otú ha dị
  rationale: Akpaalaokwu a na-ajụ maka ọnọdụ ha; nsụgharị a dị mfe ma ghara ịgbakwụnye nkọwa na-adịghị n’ederede.
theological_decisions:
- issue: Ma ἀδελφοί ọ na-ezo aka naanị n’ebe ụmụ nwoke nọ ka ọ bụ n’ọgbakọ ndị kwere ekwe dum
  choice: ụmụnna
  alternative: ụmụnna nwoke na ụmụnna nwanyị; ndị kwere ekwe
  rationale: A họọrọ okwu ezinụlọ ‘ụmụnna’ iji debe ihe oyiyi nke isi mmalite. N’Igbo, ọ pụrụ ịgụnye ma nwoke ma nwanyị, ebe nkọwa n’ala peeji na-eme ka ọdịdị okwu Grik ahụ doo anya n’enweghị mkpebi karịrị ihe ederede kwuru.
- issue: Nsụgharị κύριος
  choice: Onyenwe anyị
  alternative: Nna ukwu
  rationale: ‘Onyenwe anyị’ bụ aha nsọpụrụ Igbo a na-ejikarị eme ihe maka κύριος n’Agba Ọhụrụ, ma ọ na-edebe ịdị arọ nke okwu ahụ n’ebe a.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Usoro ‘Ka anyị laghachi ... gaa leta’ na-ada ka ndụmọdụ nkịtị n’Igbo, ebe ‘hụkwa otú ha dị’ na-edebe njikọ omume abụọ dị na Grik.
