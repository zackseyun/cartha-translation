review_pass:
  verdict: revise
  source_fidelity: The verse accurately conveys the sequence, Paul’s proposal to return, the distributive reference to every city, the proclamation of the Lord’s word, and the inquiry into the believers’ condition. “Ụmụnna” is a suitable source-shaped rendering of ἀδελφοί in this context.
  naturalness: The Igbo is natural, clear Standard Igbo with an appropriate dignified biblical register. “Ka anyị laghachi ugbu a gaa leta …, hụkwa otú ha dị” idiomatically expresses the Greek hortatory proposal and its two coordinated purposes.
  terminology: Pọl, Banabas, ụmụnna, and Onyenwe anyị are appropriate established biblical terminology. The footnote, however, should not say that the Greek simply “means male brothers,” since ἀδελφοί is grammatically masculine but may refer representatively to a mixed group.
  issues:
  - severity: medium
    issue: The footnote defines the Greek term as “ụmụnna nwoke” without qualification.
    rationale: This risks presenting a grammatical masculine form as though its referent must be exclusively male. In this setting, the term can encompass the wider community of believers; the note should distinguish grammatical form from possible inclusive reference.
  revised_text: Mgbe ụbọchị ụfọdụ gachara, Pọl gwara Banabas, “Ka anyị laghachi ugbu a gaa leta ụmụnna[a] nọ n’obodo ọ bụla anyị kwusara okwu Onyenwe anyị na ya, hụkwa otú ha dị.”
  revised_footnotes:
