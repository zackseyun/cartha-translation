revisions:
- from: kama ka e degara ha akwụkwọ ka ha zere ihe ndị e ji arụsị merụọ[a], na omume rụrụ arụ nke mmekọahụ[b], na anụmanụ a nyagburu anyagbu[c], na ọbara.
  to: kama ka e degara ha akwụkwọ ka ha zere ihe ndị e ji arụsị merụọ[a], na omume rụrụ arụ nke mmekọahụ[b], na ihe a nyagburu anyagbu[c], na ọbara.
  rationale: Only the rendering of τοῦ πνικτοῦ and its explanatory note are revised. The change removes the added specification “animal” while retaining the culturally understood food context in a footnote. All other wording faithfully reflects the Greek and appropriately preserves interpretive ambiguity.
