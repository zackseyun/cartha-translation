id: ACT.15.20
reference: Acts 15:20
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀλλὰ ἐπιστεῖλαι αὐτοῖς τοῦ ⸀ἀπέχεσθαι τῶν ἀλισγημάτων τῶν εἰδώλων καὶ τῆς πορνείας καὶ ⸀τοῦ πνικτοῦ καὶ τοῦ αἵματος·
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/020.yaml
  text: but to write to them to abstain from the pollutions of idols[a], and from sexual immorality, and from what has been strangled[c][b], and from blood.
translation:
  language: ig
  text: kama ka e degara ha akwụkwọ ka ha zere ihe ndị e ji arụsị merụọ[a], na omume rụrụ arụ nke mmekọahụ[b], na ihe a nyagburu anyagbu[c], na ọbara.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ihe mmetọ ndị metụtara arụsị.” Ụfọdụ ntụgharị na-eme ka ọ bụrụ naanị “nri a chụrụ n’àjà nye arụsị,” ma okwu Grik e ji mee ihe n’ebe a sara mbara karịa nke ahụ.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, “ịkwa iko.” Okwu Grik ahụ nwere ike ịpụta omume mmekọahụ rụrụ arụ n’ozuzu ya; ụfọdụ na-aghọta ya n’ebe a dị ka mmekọrịta nwoke na nwanyị ndị a machibidoro iwu.
    reason: alternative_reading
  - marker: c
    text: N’ụzọ nkịtị, “ihe a nyagburu anyagbu”; ọ na-ezo n’ebe a n’ihe oriri sitere n’anụmanụ e gburu n’ụzọ a na-awụpụghị ọbara ya nke ọma.
    reason: cultural_note
lexical_decisions:
- source_word: ἐπιστεῖλαι
  choice: ka e degara ha akwụkwọ
  rationale: N’ọnọdụ nzukọ Jerusalem na akwụkwọ ozi sochiri ya, okwu a pụtara izigara ha ntụziaka e dere ede. Nhọrọ a na-egosi idegara mmadụ akwụkwọ n’Igbo nkịtị.
- source_word: ἀπέχεσθαι
  choice: ka ha zere
  rationale: “Izere” na-egosi ịhapụ ma ọ bụ ịghara itinye aka n’ihe ndị e depụtara, ma bụrụkwa okwu doro ndị na-agụ Igbo taa anya.
- source_word: ἀλισγημάτων τῶν εἰδώλων
  choice: ihe ndị e ji arụsị merụọ
  rationale: Nke a na-edobe echiche nke mmetọ sitere n’arụsị ma ọ bụ nke metụtara arụsị, na-emeghị ka ọ bụrụ naanị nri a chụrụ n’àjà nye arụsị.
- source_word: πορνείας
  choice: omume rụrụ arụ nke mmekọahụ
  rationale: Nhọrọ a na-ekpuchi omume mmekọahụ megidere ụkpụrụ n’ụzọ sara mbara, n’ebughị ụzọ kpebie ma ebe a ọ na-ekwu kpọmkwem banyere ụdị mmekọrịta a machibidoro iwu.
- source_word: τοῦ πνικτοῦ
  choice: anụmanụ a nyagburu anyagbu
  rationale: Ọ bụ ihe e gburu site n’ịnyagbu ya, nke mere na a wụpụghị ọbara ya nke ọma. Ịkpọ anụmanụ aha na-eme ka okwu ahụ doo anya n’Igbo, ebe Grik ji adjective mee noun.
- source_word: τοῦ αἵματος
  choice: ọbara
  rationale: A hapụrụ ya ka ọ bụrụ “ọbara” n’enweghị nkọwa agbakwunyere banyere iri ya, ka ntụgharị ghara ịkọwapụta ihe karịrị ihe Grik kwuru.
theological_decisions:
- issue: Oke ihe a machibidoro nke metụtara arụsị
  choice: ihe ndị e ji arụsị merụọ
  alternative: nri a chụrụ n’àjà nye arụsị
  rationale: ἀλισγημάτων τῶν εἰδώλων sara mbara karịa okwu kpọmkwem maka nri a chụrụ n’àjà nye arụsị; ya mere ntụgharị ahụ na-edobe ohere nghọta nke ihe niile mmetọ arụsị metụtara.
- issue: Ihe πορνεία pụtara n’iwu ndịozi a
  choice: omume rụrụ arụ nke mmekọahụ
  alternative: ịkwa iko; mmekọrịta nwoke na nwanyị a machibidoro iwu
  rationale: Okwu Grik ahụ nwere ike ịpụta omume mmekọahụ rụrụ arụ n’ozuzu ya, ebe ụfọdụ na-ewere ya n’ebe a dị ka mmekọrịta ndị iwu machibidoro. Isi ederede anaghị ekpebi esemokwu ahụ n’ụzọ dị warara.
- issue: Ogologo oge na nzube nke iwu ndị a
  choice: E depụtara ha naanị dị ka ihe a ga-ezere
  alternative: iwu nwa oge maka ịdị n’otu n’etiti ndị Juu na ndị mba ọzọ; iwu na-adịgide adịgide nye ndị kwere ekwe niile
  rationale: Amaokwu a ekwughị ma iwu ndị a bụ nke nwa oge ma ọ bụ nke na-adịgide adịgide; ntụgharị ahụ anaghị etinye mkpebi okpukpe n’ihe ederede na-akọwaghị.
translation_notes:
  register: Standard Igbo nke dị ugbu a, dị ugwu ma dị mfe nghọta. E ji “kama” jikọta amaokwu a na echiche bu ya ụzọ. Usoro ndepụta na esemokwu nkọwa dị na Grik ka edobere, a zerekwa okwu pụrụ iche nke otu ụka.
