  text: ἐγένετο ⸀δὲ παροξυσμὸς ὥστε ἀποχωρισθῆναι αὐτοὺς ἀπ’ ἀλλήλων, τόν τε Βαρναβᾶν παραλαβόντα τὸν Μᾶρκον ἐκπλεῦσαι εἰς Κύπρον,
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/039.yaml
  text: And there arose such a sharp disagreement that they separated from one another[a], and Barnabas took Mark and sailed away to Cyprus,
translation:
  language: ig
  text: Esemokwu kpụ ọkụ n’ọnụ wee bilite n’etiti ha, nke mere ka ha kewapụrịta[a]. Banabas kpọọrọ Mak, jiri ụgbọ mmiri gawa Saịprọs,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ọgụ okwu siri ike.” Okwu Grik a nwekwara ike ịpụta mkpasu iwe siri ike ma ọ bụ esemokwu kpụ ọkụ n’ọnụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο δὲ
  choice: wee bilite
  rationale: Nke a bụ ụzọ Igbo si akọ na ọnọdụ ọhụrụ malitere n’usoro akụkọ; ‘wee’ na-ejide njikọ dị nro nke δέ n’etinyeghị mmegide karịrị ihe odide Grik kwuru.
- source_word: παροξυσμὸς
  choice: esemokwu kpụ ọkụ n’ọnụ
  rationale: Nkebiokwu a na-egosi esemokwu siri ike na nke jupụtara n’ọnụma, ọ bụghị nanị iwe mmadụ nwere n’obi; ọ bụkwa okwu Igbo nke oge a ndị mmadụ na-aghọta nke ọma.
- source_word: ὥστε ἀποχωρισθῆναι αὐτοὺς ἀπ’ ἀλλήλων
  choice: nke mere ka ha kewapụ onwe ha n’ebe ibe ha nọ
  rationale: Ọ na-egosipụta ihe esemokwu ahụ rụpụtara ma na-echekwa echiche mmekọrịta nke ἀπ’ ἀλλήλων, ya bụ, na ha kewapụrụ n’ebe ibe ha nọ.
- source_word: τόν τε Βαρναβᾶν
  choice: Banabas
  rationale: τε na-amalite ịkọ ihe otu onye n’ime ha mere mgbe ha kewara; usoro ahịrịokwu Igbo ekwesịghị itinye okwu nkwubi okwu ọzọ ebe a, ebe ngwaa ndị na-esochi na-aga n’ihu n’usoro akụkọ.
- source_word: παραλαβόντα τὸν Μᾶρκον
  choice: kpọọrọ Mak
  rationale: ‘Kpọọrọ’ na-egosi nke ọma na Banabas kpọọrọ Mak ka o soro ya, ma na-edebe aha ahụ dịka ‘Mak’ dị n’ihe odide Grik.
- source_word: ἐκπλεῦσαι εἰς Κύπρον
  choice: jiri ụgbọ mmiri gawa Saịprọs
  rationale: Nke a na-egosipụta ma njem n’oké osimiri ma ebe njem ahụ na-aga, n’Igbo dị mfe ma bụrụkwa nke ebumpụta ụwa.
theological_decisions:
- issue: Otú akụkọ ahụ si kọwaa esemokwu dị n’etiti ndị ọrụ ozi ibe ha
  choice: Esemokwu kpụ ọkụ n’ọnụ
  alternative: Ọgụ okwu siri ike
  rationale: A sụgharịrị esemokwu ahụ n’ụzọ doro anya ma dị ike, n’emeghị ka ọ dị mfe karịa ihe Grik kwuru, ma ọ bụ tinye ikpe omume na-adịghị n’amaokwu ahụ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ ‘esemokwu kpụ ọkụ n’ọnụ’ iji chekwaa ịdị ike nke okwu Grik n’enweghị okwu ochie ma ọ bụ ịkọwa onye ikpe mara. Akara rịkọm ikpeazụ na-edebe njikọ ahịrịokwu a na amaokwu na-esote.
