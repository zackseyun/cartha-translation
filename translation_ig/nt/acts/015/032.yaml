  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἰούδας τε καὶ Σιλᾶς, καὶ αὐτοὶ προφῆται ὄντες, διὰ λόγου πολλοῦ παρεκάλεσαν τοὺς ἀδελφοὺς καὶ ἐπεστήριξαν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/032.yaml
  text: Judas and Silas[a], who were themselves prophets, encouraged the brothers at length and strengthened them.
translation:
  language: ig
  text: Judas na Saịlas, ebe ha onwe ha bụkwa ndị amụma, ji ọtụtụ okwu gbaa ụmụnna[a] ume ma mee ka ha guzosie ike.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Okwu Grik ahụ pụtara “ụmụnna,” ma n’ebe a ọ pụrụ izo aka n’ọgbakọ ndị kwere ekwe niile, gụnyere ndị nwanyị.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰούδας
  choice: Judas
  rationale: Aha a na-ejikarị akpọ onye a n’Agba Ọhụrụ n’Igbo; ọ na-ekewapụtakwa ya nke ọma n’aha Juda.
- source_word: τε καὶ
  choice: na
  rationale: Njikọ dị mfe ma bụrụ nke e ji ekwu okwu n’Igbo, nke jikọtara Judas na Saịlas ọnụ.
- source_word: Σιλᾶς
  choice: Saịlas
  rationale: Nsụgharị ụda aha Grik ahụ n’ụdị aha a maara nke ọma n’Igbo.
- source_word: καὶ αὐτοὶ προφῆται ὄντες
  choice: ebe ha onwe ha bụkwa ndị amụma
  rationale: “Ha onwe ha” na-egosipụta nkwusi ike nke αὐτοὶ, “bụkwa” na-echekwa καὶ, ebe “ebe” na-enye nkebi participle ahụ dị ka nkọwa ndabere n’Igbo eke.
- source_word: προφῆται
  choice: ndị amụma
  rationale: Nke a bụ okwu Igbo doro anya ma bụrụkwa nke a na-ejikarị sụgharịpụta ọrụ προφήτης n’Akwụkwọ Nsọ.
- source_word: διὰ λόγου πολλοῦ
  choice: ji ọtụtụ okwu
  rationale: Ọ na-anọ nso n’ụdị okwu Grik, “site n’okwu dị ukwuu/ọtụtụ,” ma n’Igbo ọ na-egosi na ha kwuru ọtụtụ ihe ruo ogologo oge.
- source_word: παρεκάλεσαν
  choice: gbaa ... ume
  rationale: N’ọnọdụ a, ọ na-egosi ịgba ndị kwere ekwe ume na ịdụ ha ọdụ; okwu Igbo a bụ nke eke ma dị mfe nghọta.
- source_word: τοὺς ἀδελφοὺς
  choice: ụmụnna
  rationale: “Ụmụnna” na-asụgharị mmekọrịta ezinụlọ nke ἀδελφοί, ma n’Igbo ọ pụkwara ịgụnye ndị nwoke na ndị nwanyị n’otu ndị kwere ekwe; ndetu ala na-eme ka obosara a doo anya.
- source_word: ἐπεστήριξαν
  choice: mee ka ha guzosie ike
  rationale: Ọ na-echekwa echiche ime ka mmadụ sie ike ma kwụsie ike n’okwukwe, ma na-ekewapụ omume a na “ịgba ume.”
theological_decisions:
- issue: Ma τοὺς ἀδελφοὺς ọ na-ezo aka naanị n’ụmụ nwoke ka ọ bụ n’ọgbakọ ndị kwere ekwe niile
  choice: ụmụnna
  alternative: ụmụnna ndị nwoke na ndị nwanyị; ndị kwere ekwe
  rationale: Aha Grik ahụ bụ nke nwoke n’ụdị ọtụtụ, ma n’iji okwu Ndị Kraịst oge mbụ eme ihe, ọ na-ezokarị aka n’ọgbakọ dum. “Ụmụnna” na-echekwa ihe atụ ezinụlọ ma nwee ike ịgụnye mmadụ niile n’Igbo; ndetu ahụ na-echekwa nkọwa a n’enweghị ịmanye ya n’ahịrị isi.
translation_notes:
  register: 'Asụsụ Igbo ọkọlọtọ, nke dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji “ebe” mee ka nkebi participle bụrụ nkọwa ndabere eke; e zere asụsụ ụka siri ike ma chekwaa okwu “ndị amụma” na ihe abụọ dị iche iche: ịgba ume na ime ka ha guzosie ike.'
