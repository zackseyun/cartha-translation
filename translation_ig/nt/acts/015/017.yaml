id: ACT.15.17
reference: Acts 15:17
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὅπως ἂν ἐκζητήσωσιν οἱ κατάλοιποι τῶν ἀνθρώπων τὸν κύριον, καὶ πάντα τὰ ἔθνη ἐφ’ οὓς ἐπικέκληται τὸ ὄνομά μου ἐπ’ αὐτούς, λέγει ⸀κύριος ποιῶν ⸀ταῦτα
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/017.yaml
  text: so that the remnant of mankind may seek the Lord[a], even all the Gentiles on whom my name has been called, says the Lord[c][b], who does these things
translation:
  language: ig
  text: ka ndị fọdụrụ n’etiti ụmụ mmadụ wee chọọ Onyenwe anyị, ya na ndị mba ọzọ niile[a] ndị a kpọkwasịrị aha m n’ahụ ha[b], ka Onyenwe anyị na-ekwu, bụ onye na-eme ihe ndị a.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “mba niile.” Okwu Greek bụ ἔθνη nwere ike ịpụta “mba” ma ọ bụ “ndị na-abụghị ndị Juu”; ebe a, a họọrọ “ndị mba ọzọ” n’ihi na nzukọ Jerusalem na-atụle nnabata ndị na-abụghị ndị Juu.
    reason: alternative_reading
  - marker: b
    text: A pụkwara ịsụgharị ya, “ndị a na-akpọ ndị nke aha m.” N’ụzọ nkịtị, akpaalaokwu Greek ahụ bụ “ndị a kpọkwasịrị aha m n’ahụ ha.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπως ἂν
  choice: ka ... wee
  rationale: Usoro a bụ ụzọ Igbo si egosi nzube ma ọ bụ ihe a tụrụ anya na ọ ga-esi na ya pụta, n’enweghị ịgbakwunye nkwubi okwu siri ike karịa nke Greek.
- source_word: ἐκζητήσωσιν
  choice: chọọ
  rationale: Ọ na-enye echiche bụ isi nke ịchọ; e tinyeghị okwu na-eme ka ike ya bawanye, ka a ghara ịsụgharị ihe karịrị ihe akụkụ Akwụkwọ Nsọ a chọrọ.
- source_word: οἱ κατάλοιποι τῶν ἀνθρώπων
  choice: ndị fọdụrụ n’ime ụmụ mmadụ
  rationale: “Ndị fọdụrụ” na-echekwa echiche nke ndị ka dị, ebe “ụmụ mmadụ” na-egosi mmadụ niile n’ozuzu, ọ bụghị naanị ụmụ nwoke.
- source_word: τὸν κύριον
  choice: Onyenwe anyị
  rationale: Nke a bụ aha nsọpụrụ a na-ejikarị asụgharị κύριος n’Igbo, ọ dịkwa mma n’usoro okwu amụma a.
- source_word: πάντα τὰ ἔθνη
  choice: mba ọzọ niile
  rationale: N’ọnọdụ nzukọ Jerusalem a, okwu ahụ na-arụtụ aka n’ebe ndị na-abụghị ndị Juu nọ. Ihe ọzọ ọ pụrụ ịpụta, “mba niile,” dị n’ala ala peeji.
- source_word: ἐφ’ οὓς ἐπικέκληται τὸ ὄνομά μου ἐπ’ αὐτούς
  choice: ndị a kpọkwasịrị aha m n’ahụ ha
  rationale: Nke a na-anọ nso n’usoro akpaalaokwu Greek ahụ ma na-echekwa echiche nke ndị e ji aha Chineke mara dị ka ndị nke ya.
- source_word: λέγει κύριος
  choice: Otu a ka Onyenwe anyị kwuru
  rationale: Ọ bụ usoro okwu amụma sitere n’Akwụkwọ Nsọ. “Kwuru” bụ ụzọ Igbo dị ụtọ isi gosi onye kwuru okwu e hotara.
- source_word: ποιῶν ταῦτα
  choice: bụ onye na-eme ihe ndị a
  rationale: Ọ na-eme ka o doo anya na nkebi a na-akọwa Onyenwe anyị, ma na-echekwa ọrụ Chineke nke participle dị ugbu a na-egosi.
theological_decisions:
- issue: Ihe ἔθνη pụtara n’okwu gbasara nnabata ndị na-abụghị ndị Juu
  choice: mba ọzọ
  alternative: mba niile
  rationale: Isi okwu dị n’Ọrụ Ndịozi 15 bụ nnabata ndị na-abụghị ndị Juu. Ma ebe ọ bụ na okwu Greek ahụ nwekwara ike ịpụta “mba,” e debere nke ahụ n’ala ala peeji kama ikpochapụ nghọta ya sara mbara.
- issue: Asụsụ mmadụ niile dị na οἱ κατάλοιποι τῶν ἀνθρώπων
  choice: ndị fọdụrụ n’ime ụmụ mmadụ
  alternative: ndị nwoke fọdụrụ
  rationale: ἀνθρώπων ebe a na-ekwu maka mmadụ n’ozuzu, ọ bụghị nwoke naanị; ya mere “ụmụ mmadụ” na-ezere ịtụgharị ya ka ọ bụrụ nke metụtara nwoke naanị.
- issue: Akpaalaokwu nke ịkpọkwasị aha Chineke n’ahụ ndị mmadụ
  choice: ndị a kpọkwasịrị aha m n’ahụ ha
  alternative: ndị a na-akpọ ndị nke aha m
  rationale: 'Nsụgharị a na-echekwa ihe oyiyi na esemokwu dị n’usoro Greek ahụ: aha Onyenwe anyị ka a kpọkwasịrị n’ahụ ha, nke na-egosi njirimara na ịbụ ndị nke ya, n’enweghị ịkọwa ozizi karịa ederede.'
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta mee ihe. “Ka ... wee” na-eme ka njikọ nzube pụta ihe; “mba ọzọ” bụ okwu ndị nkịtị ga-aghọta maka ndị na-abụghị ndị Juu, ebe ala ala peeji na-echekwa “mba niile.” E debere akpaalaokwu gbasara aha Chineke nso n’ụdị Greek iji ghara iwepụ ụda ọgbụgba ndụ ya.
