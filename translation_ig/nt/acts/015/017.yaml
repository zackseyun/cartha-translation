revisions:
- from: ka ndị fọdụrụ n’ime ụmụ mmadụ wee chọọ Onyenwe anyị, nakwa mba ọzọ niile[a] ndị a kpọkwasịrị aha m n’ahụ ha[b]. Otu a ka Onyenwe anyị kwuru[c], bụ onye na-eme ihe ndị a.
  to: ka ndị fọdụrụ n’etiti ụmụ mmadụ wee chọọ Onyenwe anyị, ya na ndị mba ọzọ niile[a] ndị a kpọkwasịrị aha m n’ahụ ha[b], ka Onyenwe anyị na-ekwu, bụ onye na-eme ihe ndị a.
  rationale: The revision corrects the tense and force of the prophetic citation formula, removes an added demonstrative expression, improves one phrase for natural Igbo, and clarifies the cross-reference note’s divine-name idiom. It otherwise preserves the draft’s contextual rendering of ἔθνη and its stated ambiguity in the footnote.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T09:19:28Z'
review_pass:
  verdict: revise
  source_fidelity: The draft retains the purpose clause, the remnant motif, the Lord, the inclusion of the Gentiles/nations, the divine-name idiom, and the concluding participial description. However, “Otu a ka Onyenwe anyị kwuru” introduces “thus” and changes the present λέγει (“says”) to a past form. The revision restores the prophetic present without adding material.
  naturalness: “Otu a ka … kwuru” is natural Igbo in many citation contexts, but it is not the closest rendering here because of the tense and added demonstrative formula. “ka Onyenwe anyị na-ekwu” is both clear and appropriately close. “n’etiti ụmụ mmadụ” is also more idiomatic for the remaining people among humankind.
  terminology: “ndị mba ọzọ niile” clearly conveys ἔθνη as non-Jewish peoples in this context while the footnote preserves “mba niile.” The divine-name expression is retained close to the Greek without doctrinal expansion.
  issues:
  - severity: medium
    issue: The rendering of λέγει κύριος is shifted to a past-tense, expanded formula.
    rationale: Greek has the present prophetic formula “says the Lord.” “Otu a ka Onyenwe anyị kwuru” means approximately “Thus the Lord said,” adding “otu a” and replacing the present with past tense.
  - severity: low
    issue: The cross-reference footnote uses “ndị na-aza aha Onyenwe anyị.”
    rationale: That wording can suggest answering to the Lord’s name rather than the source idiom of the Lord’s name being called upon them. The note should preserve the identification/bearing-name sense.
  revised_text: ka ndị fọdụrụ n’etiti ụmụ mmadụ wee chọọ Onyenwe anyị, ya na ndị mba ọzọ niile[a] ndị a kpọkwasịrị aha m n’ahụ ha[b], ka Onyenwe anyị na-ekwu, bụ onye na-eme ihe ndị a.
  revised_footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “mba niile.” Okwu Greek bụ ἔθνη nwere ike ịpụta “mba” ma ọ bụ “ndị na-abụghị ndị Juu”; ebe a, a họọrọ “ndị mba ọzọ” n’ihi na nzukọ Jerusalem na-atụle nnabata ndị na-abụghị ndị Juu.
    reason: alternative_reading
  - marker: b
    text: A pụkwara ịsụgharị ya, “ndị a na-akpọ ndị nke aha m.” N’ụzọ nkịtị, akpaalaokwu Greek ahụ bụ “ndị a kpọkwasịrị aha m n’ahụ ha.”
    reason: lexical_alternative
  - marker: c
    text: Ahịrịokwu a na-ekwughachi Amọs 9:12 dịka ọ dị n’Akwụkwọ Nsọ Greek, ebe e mesiri mba dị iche iche, ma ọ bụ ndị na-abụghị ndị Juu, ndị a kpọkwasịrị aha Onyenwe anyị n’ahụ ha ike.
    reason: cross_reference
  revision_rationale: The revision corrects the tense and force of the prophetic citation formula, removes an added demonstrative expression, improves one phrase for natural Igbo, and clarifies the cross-reference note’s divine-name idiom. It otherwise preserves the draft’s contextual rendering of ἔθνη and its stated ambiguity in the footnote.
