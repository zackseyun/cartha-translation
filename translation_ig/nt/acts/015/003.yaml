  to: Ya mere, mgbe ọgbakọ dupụrụ ha n’ụzọ, ha gafere ma Fonisia ma Sameria, na-akọ akụkọ zuru ezu banyere nchigharị ndị mba ọzọ[a]; ha wee mee ka ụmụnna niile nwee nnukwu ọṅụ[b].
