id: ACT.15.3
reference: Acts 15:3
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οἱ μὲν οὖν προπεμφθέντες ὑπὸ τῆς ἐκκλησίας διήρχοντο τήν ⸀τε Φοινίκην καὶ Σαμάρειαν ἐκδιηγούμενοι τὴν ἐπιστροφὴν τῶν ἐθνῶν, καὶ ἐποίουν χαρὰν μεγάλην πᾶσι τοῖς ἀδελφοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/003.yaml
  text: So then[a], having been sent on their way by the church, they passed through both Phoenicia and Samaria, describing in detail the conversion of the Gentiles[b], and they brought great joy to all the brothers.
translation:
  language: ig
  text: Ya mere, mgbe ọgbakọ dupụrụ ha n’ụzọ, ha gafere ma Fonisia ma Sameria, na-akọ akụkọ zuru ezu banyere nchigharị ndị mba ọzọ[a]; ha wee mee ka ụmụnna niile nwee nnukwu ọṅụ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “ntụgharị nke ndị mba ọzọ.”
    reason: lexical_alternative
  - marker: b
    text: “Ụmụnna” n’ebe a nwere ike izo aka n’ebe ndị kwere ekwe niile nọ, gụnyere ụmụ nwanyị.
    reason: lexical_clarification
lexical_decisions:
- source_word: προπεμφθέντες
  choice: mgbe nzukọ ndị kwere ekwe nyechara ha aka ka ha gaa n’ihu n’ụzọ ha
  rationale: Nke a na-egosipụta na ọgbakọ ahụ zipụrụ ha ma nyere ha aka ịga n’ihu na njem, n’ebughị ụzọ kwuo kpọmkwem na ha duuru ha ruo ebe dị anya.
- source_word: ἐκκλησίας
  choice: nzukọ ndị kwere ekwe
  rationale: N’ebe a okwu ahụ na-ezo aka n’ọgbakọ Ndị Kraịst, ọ bụghị ụlọ ofufe; nsụgharị a doro ndị na-agụ Igbo taa anya.
- source_word: διήρχοντο
  choice: ha gafere
  rationale: Ọ na-enye echiche nke njem ha na-aga n’ime ógbè ndị ahụ, dịka imperfect Grik si gosi.
- source_word: τε ... καὶ
  choice: ma ... ma
  rationale: Usoro a jikọtara ógbè abụọ ahụ ọnụ dịka correlative Grik τε ... καί si eme.
- source_word: Φοινίκην
  choice: Fonisia
  rationale: Nke a bụ ide aha ógbè Phoenicia n’ụzọ dabara n’usoro ụda na mkpụrụedemede Igbo.
- source_word: Σαμάρειαν
  choice: Sameria
  rationale: Nke a bụ ụdị aha Samaria a na-aghọta nke ọma n’Igbo.
- source_word: ἐκδιηγούμενοι
  choice: na-akọwa nke ọma
  rationale: Ngwaa Grik ahụ na-egosi ịkọ akụkọ n’uju ma ọ bụ n’ụzọ zuru ezu, ọ bụghị naanị ịkpọtụ ya aha.
- source_word: ἐπιστροφὴν
  choice: otú ... si chigharịkwute Chineke
  rationale: N’ọnọdụ a, okwu ahụ pụtara nchigharị ndị mba ọzọ n’ebe Chineke nọ. Itinye ‘Chineke’ na-eme ka ihe a na-ekwu doo anya n’Igbo ma ghara ime ka ọ bụrụ naanị mgbanwe echiche nkịtị.
- source_word: τῶν ἐθνῶν
  choice: ndị mba ọzọ
  rationale: N’Ọrụ Ndịozi 15 okwu ahụ na-ezo aka n’ebe ndị na-abụghị ndị Juu nọ; ‘ndị mba ọzọ’ na-ewepụta ọdịiche ahụ n’ụzọ a na-aghọta taa.
- source_word: ἐποίουν χαρὰν μεγάλην
  choice: nke a wee wetara ... nnukwu ọṅụ
  rationale: Nke a bụ ụzọ Igbo dị ire nke na-echekwa echiche causative nke akpaokwu Grik ahụ.
- source_word: ἀδελφοῖς
  choice: ụmụnna
  rationale: ‘Ụmụnna’ na Igbo nwere ike ịgụnye ma nwoke ma nwanyị ndị ha na ha bụ otu ndị kwere ekwe, ma ọ ka na-echekwa ihe oyiyi mmekọrịta ezinụlọ dị n’okwu Grik.
theological_decisions:
- issue: Ihe ἐπιστροφή pụtara gbasara ịnabata ndị mba ọzọ
  choice: otú ndị mba ọzọ si chigharịkwute Chineke
  alternative: nchigharị nke ndị mba ọzọ
  rationale: Nsụgharị ahọrọ na-egosi mmegharị ha n’ebe Chineke nọ n’enweghị itinye nkọwa ozizi e mesịrị n’ime okwu ahụ. Ihe ọzọ ahụ na-esochi ọdịdị aha Grik nso karịa, ma ọ naghị ada ka Igbo nkịtị.
- issue: Oke ndị ἀδελφοί na-ezo aka na ha
  choice: ụmụnna
  alternative: ụmụnna nwoke
  rationale: N’ebe a o yikarịrị ka okwu ahụ na-ezo aka n’ebe ndị kwere ekwe niile nọ, gụnyere ụmụ nwanyị. ‘Ụmụnna’ bụ okwu Igbo sitere n’ezinụlọ nke nwere ike iburu oke ahụ n’enweghị ihichapụ ihe oyiyi nke okwu Grik.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta. Ahịrịokwu ahụ na-echekwa usoro njem, akụkọ zuru ezu banyere nchigharị ndị mba ọzọ, na nnukwu ọṅụ nke akụkọ ahụ kpatara. E tinyere akara ndetu ala ala [a] na [b] n’isiokwu dịka a chọrọ.
