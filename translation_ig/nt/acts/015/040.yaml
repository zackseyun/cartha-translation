    text: N’ebe a, ‘ụmụnna’ nwere ike ịpụta ọgbakọ ndị kwere ekwe niile, gụnyere ụmụ nwanyị, dịka ọnọdụ siri dị.
    reason: cultural_note
  revision_rationale: The revision supplies the idiomatic complement ‘n’aka’ to express entrusting Paul to the Lord’s grace, while retaining ‘amara,’ the passive/community sense, and the source’s unqualified ‘Onyenwe anyị.’ The cultural note is adjusted from ‘town’ language to natural church-community language. Footnote markers remain attached to the relevant final clause and the complete footnote set is retained.
