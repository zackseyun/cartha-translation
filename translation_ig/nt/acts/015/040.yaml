source:
  edition: SBLGNT
  text: Παῦλος δὲ ἐπιλεξάμενος Σιλᾶν ἐξῆλθεν παραδοθεὶς τῇ χάριτι τοῦ ⸀κυρίου ὑπὸ τῶν ἀδελφῶν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/040.yaml
  text: But Paul chose Silas and departed[b][a], having been commended by the brothers to the grace of the Lord.
translation:
  language: ig
  text: Ma Pọl họọrọ Saịlas wee pụọ, mgbe ụmụnna nyefere ya n’aka amara nke Onyenwe anyị.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, ‘mgbe ụmụnna tinyere ya n’aka amara nke Onyenwe anyị.’
    reason: lexical_alternative
  - marker: b
    text: N’ebe a, ‘ụmụnna’ nwere ike ịpụta ọgbakọ ndị kwere ekwe niile, gụnyere ụmụ nwanyị, dịka ọnọdụ siri dị.
    reason: cultural_note
lexical_decisions:
- source_word: δὲ
  choice: Ma
  rationale: Ọ na-egosi obere ọdịiche dị n’etiti ọpụpụ Pọl na nke Banabas n’amaokwu bu ụzọ.
- source_word: ἐπιλεξάμενος
  choice: họọrọ
  rationale: Ọ na-egosi na Pọl n’onwe ya họpụtara Saịlas tupu ọ pụọ, n’Igbo doro anya ma dịkwa mma.
- source_word: Σιλᾶν
  choice: Saịlas
  rationale: E dere aha onye ahụ n’ụzọ kwekọrọ n’usoro mkpọpụta aha n’Igbo.
- source_word: ἐξῆλθεν
  choice: wee pụọ
  rationale: N’akụkọ njem, okwu a pụtara ịpụ ma ọ bụ ibido njem; ‘wee pụọ’ bụ asụsụ Igbo ebumpụta ụwa.
- source_word: παραδοθεὶς
  choice: mgbe ... nyefere ya
  rationale: N’ebe a, ọ pụtara inyefe mmadụ nlekọta na ihu ọma Chineke. A hapụrụ echiche ‘inyefe’ ka o doo anya ma ghara imechi ihe okwu ahụ nwere ike ịpụta.
- source_word: τῇ χάριτι
  choice: n’amara
  rationale: ‘Amara’ na-echekwa aha nkà mmụta okpukpe χάρις, ebe ‘n’—’ na-egosi na e tinyere ya n’amara na nlekọta Onyenwe anyị.
- source_word: τοῦ κυρίου
  choice: nke Onyenwe anyị
  rationale: Ọ na-echekwa utu aha κύριος n’emeghị mkpebi ma ọ̀ na-ezo aka kpọmkwem n’ebe Jizọs nọ ka ọ bụ n’ebe Chineke nọ.
- source_word: ὑπὸ τῶν ἀδελφῶν
  choice: ụmụnna
  rationale: ‘Ụmụnna’ bụ okwu Igbo ebumpụta ụwa maka ndị otu ezinụlọ okwukwe, ma ọ nwekwara ike ịgụnye ndị nwoke na ndị nwanyị dịka ọnọdụ siri dị.
theological_decisions:
- issue: Onye ‘Onyenwe anyị’ na-ezo aka na ya
  choice: Onyenwe anyị
  alternative: Onyenwe anyị Jizọs; Chineke
  rationale: Ihe odide Grik ekwughị kpọmkwem onye ọ bụ; ntụgharị ahụ na-echekwa ogo nkọwa nke isi mmalite.
- issue: Ndị okwu ‘ụmụnna’ gụnyere
  choice: ụmụnna, tinyere nkọwa n’ala peeji
  alternative: ụmụnna nwoke na ụmụnna nwanyị; ndị kwere ekwe
  rationale: ἀδελφῶν dị n’ụdị oke, ma n’ọgbakọ Ndị Kraịst ọ pụrụ ịpụta obodo ndị kwere ekwe niile. ‘Ụmụnna’ na Igbo na-echekwa njikọ ezinụlọ ma nwee ike ịdị obosara dịka ọnọdụ siri dị.
- issue: Ike okwu παραδοθεὶς
  choice: nyefere ya n’amara
  alternative: jaara ya mma n’amara; tinyere ya n’aka amara
  rationale: ‘Nyefere’ na-echekwa echiche bụ isi nke παραδίδωμι, gụnyere itinye Pọl n’aka amara na nlekọta Onyenwe anyị, n’emeghị ka otu nkọwa naanị bụrụ nke a manyere.
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe nke oge a, dị mfe nghọta ma nwee ugwu. A họọrọ ‘wee pụọ’ maka usoro akụkọ ebumpụta ụwa, ebe ‘nyefere ya n’amara’ na-echekwa ma ọdịdị okwu Grik ma echiche nke itinye mmadụ n’okpuru nlekọta Chineke.
