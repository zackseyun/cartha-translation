  variant: Standard Igbo
source:
  edition: SBLGNT
  text: διήρχετο δὲ τὴν Συρίαν καὶ ⸀τὴν Κιλικίαν ἐπιστηρίζων τὰς ἐκκλησίας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/041.yaml
  text: And he went through Syria and Cilicia, strengthening the churches.
translation:
  language: ig
  text: Ọ nọ na-agafe Siria na Silisia, na-eme ka ọgbakọ ndị ahụ sie ike.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διήρχετο
  choice: Ọ gafere
  rationale: Ngwaa imperfect a na-egosi njem ọ nọ na-eme site n’otu mpaghara gaa n’ọzọ; ‘gafere’ na-enye echiche nke ịgagharị n’ime mpaghara ndị ahụ n’Igbo dị mfe.
- source_word: δὲ
  choice: —
  rationale: Njikọ a dị nro ma na-aga n’ihu n’akụkọ ahụ. N’Igbo, njikọ ahụ pụtara nke ọma site n’usoro ahịrịokwu, ya mere ịghara itinye ‘ma’ ma ọ bụ ‘mgbe ahụ’ na-eme ka okwu daa nke ọma n’enweghị ịgbanwe echiche ya.
- source_word: Συρίαν
  choice: Siria
  rationale: Nke a bụ nsụgharị aha mpaghara Syria kwekọrọ n’usoro mkpọpụta na odide Igbo.
- source_word: Κιλικίαν
  choice: Silisia
  rationale: Nke a bụ nsụgharị aha mpaghara Cilicia kwekọrọ n’usoro mkpọpụta na odide Igbo.
- source_word: ἐπιστηρίζων
  choice: na-eme ka ... sie ike
  rationale: 'Nkebi participle a na-akọ ihe ọ na-eme n’oge njem ahụ: ọ na-akwado ndị kwere ekwe ka ha guzosie ike. Okwu a sara mbara karịa naanị ịgba ume n’obi.'
- source_word: ἐκκλησίας
  choice: ọgbakọ ndị ahụ
  rationale: N’ebe a, okwu ahụ na-ezo aka n’ọgbakọ Ndị Kraịst dị iche iche n’obodo ndị ahụ. ‘Ọgbakọ’ bụ okwu Igbo doro anya nke na-ezere ime ka ihe a na-ekwu bụrụ ụlọ ofufe kama ịbụ ndị mmadụ zukọrọ.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo Izugbe dị ugbu a, dị mfe ma dị ùgwù. E debere omume njem na nke ime ka ọgbakọ sie ike dịka omume na-aga n’otu oge, n’enweghị ịgbakwunye nkọwa gbasara ụzọ e si mee ka ha sie ike.
