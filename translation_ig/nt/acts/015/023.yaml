    reason: lexical_alternative
  revision_rationale: The revision corrects the reference of the Greek ‘through their hand’ by making the delegates the agents of delivery. It also renders the contested sender designation in the more conventional contextual sense while preserving the alternative in a footnote. The salutation χαίρειν is naturally conveyed by “na-eziga ... ekele.”
