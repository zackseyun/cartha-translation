id: ACT.15.23
reference: Acts 15:23
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: γράψαντες διὰ χειρὸς ⸀αὐτῶν· Οἱ ἀπόστολοι καὶ οἱ ⸀πρεσβύτεροι ἀδελφοὶ τοῖς κατὰ τὴν Ἀντιόχειαν καὶ Συρίαν καὶ Κιλικίαν ἀδελφοῖς τοῖς ἐξ ἐθνῶν χαίρειν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/023.yaml
  text: 'Having written by their hand: “The apostles and the elder brothers[a], to the brothers from among the Gentiles in Antioch and Syria and Cilicia[c][b], greetings.”'
translation:
  language: ig
  text: Ha dere akwụkwọ ozi a ma ziga ya site n’aka ha:[a] “Ndịozi na ndị okenye, bú ụmụnna,[b] na-eziga ụmụnna[c] ndị sitere n’etiti ndị mba ọzọ nọ n’Antiọk, Siria na Silisia ekele.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’asụsụ Grik, ọ bụ kpọmkwem, ‘site n’aka ha.’ N’ebe a, okwu a na-egosi na e zigara ma ọ bụ nyefere akwụkwọ ozi a site n’aka ndị a họpụtara.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịghọta okwu Grik a dịka, ‘ụmụnna ndị okenye.’ Ọtụtụ ndị na-atụgharị ya dịka, ‘ndị okenye, ụmụnna’; usoro okwu Grik anaghị ewepụ kpamkpam ụzọ ọgụgụ nke ọzọ.
    reason: alternative_reading
  - marker: c
    text: N’ebe a, ‘ụmụnna’ nwere ike ịgụnye ndị niile kwere ekwe, ma ndị nwoke ma ndị nwanyị.
    reason: lexical_alternative
lexical_decisions:
- source_word: γράψαντες
  choice: Ha dere akwụkwọ a
  rationale: Oge aorist participle na-egosi ihe ha mere tupu e kwuo ihe dị n’akwụkwọ ozi ahụ. Igbo sitere n’okike na-eji ngwaa zuru ezu ebe a karịa ịmanye usoro participle Grik.
- source_word: διὰ χειρὸς αὐτῶν
  choice: site n’aka ha
  rationale: Nke a na-edobe okwu ihe atụ Grik, ‘site n’aka ha,’ ma n’ọnọdụ a ọ pụtara na e ji ndị ozi ahụ zipụ ma ọ bụ nyefee akwụkwọ ozi ahụ.
- source_word: ἀπόστολοι
  choice: Ndịozi
  rationale: Nke a bụ okwu Igbo a na-amakarị maka ndị e zigara ozi ma bụrụkwa ndị ndu a kpọrọ aha n’ebe a.
- source_word: πρεσβύτεροι ἀδελφοὶ
  choice: ụmụnna ndị okenye
  rationale: Nke a na-edobe njikọ okwu Grik nke na-egosi na ‘ụmụnna’ na-akọwa ndị okenye, kama ime ka ọ bụrụ otu nke atọ n’enweghị ihe ederede kwuru hoo haa.
- source_word: ἀδελφοῖς
  choice: ụmụnna
  rationale: ‘Ụmụnna’ bụ okwu Igbo sitere n’okike nke nwere ike ịgụnye ndị nwoke na ndị nwanyị nọ n’otu okwukwe, ma ọ ka na-anọ nso n’ụdị okwu Grik.
- source_word: τοῖς ἐξ ἐθνῶν
  choice: ndị sitere n’etiti ndị mba ọzọ
  rationale: Ọ na-egosipụta ἐξ na echiche na ndị nnata ahụ sitere n’etiti mba ndị na-abụghị ndị Juu.
- source_word: χαίρειν
  choice: na-ekele
  rationale: N’isi akwụkwọ ozi, χαίρειν bụ ekele a na-enye ndị a na-edegara akwụkwọ, ọ bụghị iwu ka ha ṅụrịa ọṅụ.
- source_word: κατὰ τὴν Ἀντιόχειαν καὶ Συρίαν καὶ Κιλικίαν
  choice: ndị nọ n’Antiọk, Siria na Silisia
  rationale: ‘Ndị nọ’ na-enye n’Igbo echiche ọnọdụ na mgbasa ndị nnata n’ebe atọ ahụ n’enweghị ntụgharị siri ike nke κατά.
theological_decisions:
- issue: Ma ἀδελφοί ọ na-agụnye ọgbakọ niile, gụnyere ụmụ nwanyị
  choice: ụmụnna
  alternative: ụmụnna nwoke na ụmụnna nwanyị
  rationale: ‘Ụmụnna’ n’Igbo nwere ike ịrụ ọrụ n’ụzọ gụnyere mmadụ niile n’otu ezinụlọ okwukwe. Ihe odide Grik ji ụdị ọtụtụ nwoke, ebe ọnọdụ ahụ nwere ike ịgụnye ọgbakọ dum; nkọwa ala peeji na-eme ka nke a doo anya n’enweghị ịgbakwunye okwu n’ahịrị bụ isi.
- issue: Njikọ πρεσβύτεροι ἀδελφοὶ
  choice: ụmụnna ndị okenye
  alternative: ndị okenye, bụ́ ụmụnna unu
  rationale: Enweghị article ọzọ tupu ἀδελφοί na-akwado ịgụ okwu ahụ dịka nkọwa nke πρεσβύτεροι. A hapụrụ ụzọ ọgụgụ ọzọ n’ala peeji ka esemokwu dị n’usoro okwu ahụ ghara izochi.
translation_notes:
  register: Ejiri Standard Igbo dị ugwu ma dị mfe nghọta. Ahịrị bụ isi na-agbaso usoro ekele akwụkwọ ozi n’ụzọ sitere n’okike n’Igbo, ebe ala peeji na-echekwa akpaalaokwu Grik na mgbagwoju anya dị na πρεσβύτεροι ἀδελφοί.
