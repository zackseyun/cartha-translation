revisions:
- from: Ha dere akwụkwọ a site n’aka ha:[a] “Ndịozi na ụmụnna ndị okenye[b] na-ekele ụmụnna[c] ndị sitere n’etiti ndị mba ọzọ, ndị nọ n’Antiọk, Siria na Silisia.”
  to: Ha dere akwụkwọ ozi a ma ziga ya site n’aka ha:[a] “Ndịozi na ndị okenye, bú ụmụnna,[b] na-eziga ụmụnna[c] ndị sitere n’etiti ndị mba ọzọ nọ n’Antiọk, Siria na Silisia ekele.”
  rationale: The revision corrects the reference of the Greek ‘through their hand’ by making the delegates the agents of delivery. It also renders the contested sender designation in the more conventional contextual sense while preserving the alternative in a footnote. The salutation χαίρειν is naturally conveyed by “na-eziga ... ekele.”
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T09:19:42Z'
review_pass:
  verdict: revise
  source_fidelity: 'The draft''s opening, “Ha dere akwụkwọ a site n’aka ha,” naturally says that the writers themselves wrote it by their own hands. In Greek διὰ χειρὸς αὐτῶν refers to agency/delivery through the selected delegates, not handwriting by the Jerusalem leaders. Also, πρεσβύτεροι ἀδελφοί is better represented without making “elder brothers” the sole reading: the ordinary contextual construal is “the elders, brothers,” though the compact Greek permits the alternative noted in a footnote.'
  naturalness: The revised wording uses a normal Igbo letter formula, “na-eziga ... ekele,” and explicitly expresses dispatch through the delegates. “Ndị okenye, bú ụmụnna” is more idiomatic and less misleading than “ụmụnna ndị okenye.”
  terminology: “Ndịozi,” “ndị okenye,” “ụmụnna,” and “ndị mba ọzọ” are suitable Standard Igbo terms here. The footnote on ụmụnna appropriately notes the likely inclusive reference without replacing the source’s masculine plural in the text.
  issues:
  - severity: high
    issue: “site n’aka ha” is attached to “Ha dere,” yielding the sense that they wrote with their own hands.
    rationale: The Greek idiom διὰ χειρὸς αὐτῶν identifies the delegates as the means by whom the letter was sent/conveyed. The translation should make that relationship clear.
  - severity: medium
    issue: “ụmụnna ndị okenye” makes one debated construal of πρεσβύτεροι ἀδελφοί appear certain.
    rationale: In this address, “the elders, brothers” is the more contextually conventional reading. The alternative may be retained in a footnote rather than imposed in the main text.
  - severity: low
    issue: Footnote b adds “unu” (‘your’), which is absent from the Greek.
    rationale: The note should describe the syntactic alternatives without adding a possessive not present in the source.
  revised_text: Ha dere akwụkwọ ozi a ma ziga ya site n’aka ha:[a] “Ndịozi na ndị okenye, bú ụmụnna,[b] na-eziga ụmụnna[c] ndị sitere n’etiti ndị mba ọzọ nọ n’Antiọk, Siria na Silisia ekele.”
