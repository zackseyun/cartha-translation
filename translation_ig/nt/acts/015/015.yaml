  text: καὶ τούτῳ συμφωνοῦσιν οἱ λόγοι τῶν προφητῶν, καθὼς γέγραπται·
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/015.yaml
  text: 'And with this the words of the prophets agree[a], just as it is written:'
translation:
  language: ig
  text: 'Na okwu ndị amụma kwekọrọ n’ihe a, dị ka e dere, sị:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: —
  rationale: E gosipụtara njikọ ahụ n'ụzọ ebumpụta ụwa site n'ịga n'ihu n'okwu ahụ; ịmalite n'“Na” agaghị adị mma n'Igbo ebe a.
- source_word: τούτῳ
  choice: na nke a
  rationale: Nnọchiaha a na-arụtụ aka n'ihe e kwuru tupu ya n'ebughị ụzọ kọwaa kpọmkwem ihe ọ bụ; nke a na-edobe obosara ihe Grik ahụ nwere ike ịpụta.
- source_word: συμφωνοῦσιν
  choice: kwekọrọ
  rationale: “Kwekọrọ” na-egosi na okwu amụma ndị ahụ dabara n'ihe a kpọtụrụ aha, ma ọ bụ na ha na ya dị n'otu.
- source_word: οἱ λόγοι
  choice: Okwu
  rationale: Ọ na-ezo aka n'okwu ndị amụma kwuru nke e dekwara ede; “okwu” bụ nsụgharị doro anya ma dịkwa mma n'Igbo.
- source_word: τῶν προφητῶν
  choice: ndị amụma
  rationale: Usoro “okwu ndị amụma” na-egosi na okwu ahụ sitere n'aka ndị amụma ma bụrụkwa nke ha.
- source_word: καθὼς
  choice: dị nnọọ ka
  rationale: Ọ na-egosi na ihe e kwuru kwekọrọ kpọmkwem n'ihe e dere n'Akwụkwọ Nsọ.
- source_word: γέγραπται
  choice: e dere ya
  rationale: Nke a bụ usoro a na-ejikarị ewebata ihe e hotara n'Akwụkwọ Nsọ; ọ na-edobe echiche nke ihe e dere nke ka dị ire.
theological_decisions:
- issue: Ihe τούτῳ na-arụtụ aka na ya n'okwu Jemis
  choice: E jiri “nke a” mee ka ọ rụtụ aka n'ihe ma ọ bụ okwu dị n'ihu ya n'enweghị nkọwa ọzọ.
  alternative: Ịkọwa ya kpọmkwem dị ka ntụgharị ndị mba ọzọ, okwu Pita, ma ọ bụ atụmatụ Chineke.
  rationale: Grik akọwaghị otu ihe ahụ kpọmkwem. Nsụgharị ahụ na-edobe nghọta sara mbara na esemokwu nkọwa ahụ kama ikpebiri onye na-agụ ya otu nkọwa.
translation_notes:
  register: Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ “kwekọrọ na” dịka okwu ebumpụta ụwa maka συμφωνέω na dativ; akara [a] dị n'ederede isi dịka a chọrọ.
