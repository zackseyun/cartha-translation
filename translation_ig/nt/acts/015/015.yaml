revisions:
- from: 'Okwu ndị amụma kwekọrọ na nke a,[a] dị nnọọ ka e dere ya, sị:'
  to: 'Na okwu ndị amụma kwekọrọ n’ihe a, dị ka e dere, sị:'
  rationale: The revision retains the broad, unspecified referent of τούτῳ and the present agreement of the prophetic words, while explicitly rendering καί and using an idiomatic impersonal Igbo citation formula for γέγραπται. The unnecessary footnote is removed because it does not preserve a genuine source-level ambiguity in Standard Igbo.
  reviewer_model: gpt-5.6-terra
