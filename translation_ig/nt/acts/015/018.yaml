translation:
  language: ig
  text: Ihe ndị a maara kemgbe oge ochie.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ụfọdụ akwụkwọ odide gụrụ ya n''ụzọ zuru ezu karị: “ihe ndị a maara site n''oge ebighị ebi,” ma ọ bụ “onye na-eme ka a mara ihe ndị a kemgbe oge ochie.”'
    reason: textual_variant
lexical_decisions:
- source_word: γνωστὰ
  choice: nke a maara
  rationale: Okwu a bụ adjective e ji mee predicate n'ahịrịokwu na-enweghị ngwaa; “nke a maara” na-egosipụta ya ozugbo, n'etinyeghị echiche “nke e mere ka a mara” ma ọ bụ “nke a maara nke ọma.”
- source_word: ἀπ’
  choice: kemgbe
  rationale: N'ebe a ἀπό na-egosi mmalite n'oge; “kemgbe” bụ ụzọ Igbo nkịtị si kwupụta oge malitere n'oge gara aga.
- source_word: αἰῶνος
  choice: oge ochie
  rationale: N'usoro okwu oge a, αἰών nwere ike ịpụta ogologo oge gara aga ma ọ bụ mgbe ochie. “Oge ochie” na-edobe echiche ahụ n'ebughị ya gaa n'echiche siri ike nke ebighị ebi.
theological_decisions:
- issue: Ogologo oge ihe ọmụma Chineke gbasara n'ahịrịokwu a dị mkpirikpi
  choice: A sụgharịrị ya dị ka ihe ndị a maara kemgbe oge ochie, n'agbasaghị ya ka ọ bụrụ nkọwa ozizi banyere ịma ihe site na mgbe ebighị ebi.
  alternative: nke a maara site na mgbe ebighị ebi; ma ọ bụ, onye na-eme ka a mara ihe ndị a kemgbe oge ochie
  rationale: 'Ihe odide SBLGNT dị nnọọ mkpirikpi: γνωστὰ ἀπ’ αἰῶνος. Nsụgharị ahụ kwesịkwara ịdị mkpirikpi ma ghara ịgbakwunye okwu sitere n''ụdị ihe odide ndị toro ogologo ma ọ bụ na nkwubi okwu nkà mmụta okpukpe. Ihe odide ala peeji na-echekwa ụdị ndị ọzọ.'
translation_notes:
  register: Standard Igbo dị mfe, dị ùgwù, ma dị mkpirikpi dịka Grik. Akara ntụaka [a] dị n'isiokwu ahụ.
