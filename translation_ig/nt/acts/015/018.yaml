  verdict: revise
  source_fidelity: The SBLGNT is a compressed verbless clause, γνωστὰ ἀπ’ αἰῶνος, literally expressing that certain matters are known from ancient time. The draft correctly avoids importing the longer textual reading into the main text, but its singular demonstrative “nke a” does not represent the neuter plural γνωστά as well as “ihe ndị a.”
  naturalness: “Ihe ndị a maara kemgbe oge ochie” is concise, natural Standard Igbo, and retains the source's compressed register. The footnote is clearer with “akwụkwọ odide” for manuscripts and “site n'oge ebighị ebi” for the eternity alternative.
  terminology: The rendering preserves the temporal modesty of αἰῶνος as “kemgbe oge ochie” in the main text. The textual-variant footnote retains, without endorsing, both the stronger eternal-time alternative and the expanded reading.
  issues:
  - severity: medium
    issue: Singular wording in the main text
    rationale: “nke a maara” is singular, whereas γνωστά is neuter plural. “Ihe ndị a maara” reflects the Greek plurality without expanding its meaning.
  - severity: low
    issue: Footnote wording for manuscripts and eternity
    rationale: “Akwụkwọ odide” is the more idiomatic term for manuscript witnesses. “Site n'oge ebighị ebi” is clearer and more natural than “site na mgbe ebighị ebi.”
