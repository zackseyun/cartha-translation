id: ACT.28.24
reference: Acts 28:24
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ οἱ μὲν ἐπείθοντο τοῖς λεγομένοις οἱ δὲ ἠπίστουν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/024.yaml
  text: And some were persuaded by what was being said[a], but others disbelieved.
translation:
  language: ig
  text: Ụfọdụ n’ime ha kwetara n’ihe ndị a na-ekwu, ma ndị ọzọ ekweghị.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπείθοντο
  choice: kwetara
  rationale: Okwu a na-egosi na ihe a na-ekwu mere ka ụfọdụ kwenye; ụdị ngwaa imperfect na-egosikwa nzaghachi na-aga n’ihu n’oge Pọl na-ekwu. ‘Kwetara’ bụ Igbo nkịtị nke na-adịghị amanye echiche nke okwukwe nzọpụta zuru ezu.
- source_word: τοῖς λεγομένοις
  choice: n’ihe ndị a na-ekwu
  rationale: Nke a na-egosi ọdịnaya nke okwu ahụ na-aga n’ihu, ma na-edebe echiche dị n’ụdị present passive participle.
- source_word: ἠπίστουν
  choice: ekweghị
  rationale: ‘Ekweghị’ na-egosi na ndị ọzọ anabataghị ma ọ bụ ekwenyeghị n’ozi ahụ, n’etinyeghị echiche siri ike nke ịma ụma jụ nke okwu Grik ahụ n’onwe ya na-agaghị emerịrị.
- source_word: οἱ μὲν ... οἱ δὲ
  choice: Ụfọdụ n’ime ha ... ma ndị ọzọ
  rationale: Usoro a na-egosi nkewa dị n’etiti otu ndị ahụ, yana ọdịiche doro anya n’etiti nzaghachi abụọ ahụ.
- source_word: καὶ
  choice: —
  rationale: E tinyebeghị njikọ ahụ iche n’Igbo n’ihi na amaokwu a na-aga nke ọma dị ka ihe na-esote akụkọ gara aga; itinye ‘na’ n’isi ahịrịokwu ga-ada arọ n’Igbo. Njikọ akụkọ ahụ ka ọnọdụ amaokwu ahụ na-egosi.
theological_decisions:
- issue: Ụdị ọdịiche dị n’etiti nzaghachi ndị ahụ
  choice: Amaokwu ahụ na-ekwu naanị na ụfọdụ kwetara n’ozi Pọl, ebe ndị ọzọ ekweghị.
  alternative: Ịkọwa ndị kwetara dị ka ndị nwere okwukwe nzọpụta zuru ezu, ma kpọọ ndị ọzọ ndị obi ha kpọrọ nkụ.
  rationale: Okwu Grik ahụ na-egosi nzaghachi abụọ dị iche n’ozi a kpọsara, ma ọ naghị akọwa ọnọdụ ime mmụọ ikpeazụ nke onye ọ bụla.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị mfe ma nwee ugwu. A họọrọ ‘kwetara’ na ‘ekweghị’ iji debe ọdịiche nke Grik n’enweghị ịgbakwunye nkọwa okpukpe na-adịghị n’amaokwu ahụ.
