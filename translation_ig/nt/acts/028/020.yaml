  text: διὰ ταύτην οὖν τὴν αἰτίαν παρεκάλεσα ὑμᾶς ἰδεῖν καὶ προσλαλῆσαι, ἕνεκεν γὰρ τῆς ἐλπίδος τοῦ Ἰσραὴλ τὴν ἅλυσιν ταύτην περίκειμαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/020.yaml
  text: For this reason[a], therefore, I asked to see you and to speak with you, for it is because of the hope of Israel that I am wearing this chain.
translation:
  language: ig
  text: 'Ọrụ Ndị Ozi 28:20


    Ọ bụ ya mere m ji kpọọ unu ka m hụ unu ma gwa unu okwu; n’ihi na ọ bụ n’ihi olileanya Izrel[a] ka m ji buru agbụ ígwè a.


    [a] Ma ọ bụ, “olileanya nke Izrel.” O yiri ka nke a na-ezo aka n’olileanya sitere ná nkwa ọgbụgba ndụ Chineke nakwa n’olileanya mbilite n’ọnwụ nke Pọl na-ekwusa.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “olileanya nke Izrel.” O yiri ka nke a na-ezo aka n’olileanya sitere ná nkwa ọgbụgba ndụ Chineke nakwa n’olileanya mbilite n’ọnwụ nke Pọl na-ekwusa.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ ταύτην οὖν τὴν αἰτίαν
  choice: Ọ bụ ya mere
  rationale: Nke a na-egosipụta ma ihe kpatara okwu ahụ ma njikọ nkwubi okwu nke οὖν, n’ụzọ Igbo dị nkenke ma bụrụkwa nke e ji eme ihe kwa ụbọchị.
- source_word: παρεκάλεσα ὑμᾶς
  choice: m ji kpọọ unu
  rationale: N’ọnọdụ a, Pọl mere ka ndị ndu ndị Juu bịa hụ ya. “Kpọọ unu” na-egosi arịrịọ ahụ n’ụzọ Igbo na-ada nke ọma, n’enweghị ime ka ọ bụrụ okwu ikpe.
- source_word: ἰδεῖν καὶ προσλαλῆσαι
  choice: ka m hụ unu ma gwa unu okwu
  rationale: “Hụ unu” na-edobe ihe ἰδεῖν pụtara kpọmkwem; “gwa unu okwu” na-egosi mkparịta ụka ihu na ihu nke προσλαλῆσαι na-ekwu maka ya.
- source_word: ἕνεκεν γὰρ
  choice: n’ihi na ọ bụ n’ihi
  rationale: Nhazi a na-edobe ma nkọwa γάρ na-enye ma ike nke ἕνεκεν nke na-ekwu kpọmkwem ihe kpatara agbụ ahụ.
- source_word: τῆς ἐλπίδος τοῦ Ἰσραήλ
  choice: olileanya Izrel
  rationale: Nke a na-edobe njikọ genitiv ahụ nkenke, ghara ikpebi ma ọ bụ olileanya Izrel nwere, nke e kwere Izrel ná nkwa, ma ọ bụ nke metụtara Izrel.
- source_word: τὴν ἅλυσιν ταύτην περίκειμαι
  choice: ka m ji nọ n’agbụ ígwè a
  rationale: “Agbụ ígwè a” na-edobe aha ahụ n’otu na ihe anụ ahụ ọ na-egosi. “Nọ n’agbụ” bụ ụzọ Igbo doro anya e si kwuo na a tụrụ mmadụ mkpọrọ ma kee ya agbụ, ọ bụ ezie na ọ naghị edobe ihe oyiyi ‘iyi’ agbụ n’ụzọ mkpụrụokwu.
theological_decisions:
- issue: Ihe “olileanya Izrel” pụtara
  choice: E debere ya dịka “olileanya Izrel” n’enweghị nkọwa agbakwunyere n’ahụ amaokwu.
  alternative: olileanya e kwere Izrel ná nkwa; olileanya Izrel banyere mbilite n’ọnwụ; olileanya Izrel banyere Mesaịa
  rationale: Okwu Grik ahụ dị nkenke ma nwee ike ịgụnye nkwa ọgbụgba ndụ, Mesaịa, na mbilite n’ọnwụ. Ịhapụ ya nkenke na-echekwa obosara ya na esemokwu nkà mmụta okpukpe dị na ya.
translation_notes:
  register: E jiri Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ “agbụ ígwè” iji mee ka ihe ἅλυσις na-ezo aka na ya doo anya, ebe a na-ezere ịgbasa “olileanya Izrel” ka ọ bụrụ naanị otu nkọwa nkà mmụta okpukpe.
