  to: 'Ọrụ Ndị Ozi 28:20


    Ọ bụ ya mere m ji kpọọ unu ka m hụ unu ma gwa unu okwu; n’ihi na ọ bụ n’ihi olileanya Izrel[a] ka m ji buru agbụ ígwè a.


    [a] Ma ọ bụ, “olileanya nke Izrel.” O yiri ka nke a na-ezo aka n’olileanya sitere ná nkwa ọgbụgba ndụ Chineke nakwa n’olileanya mbilite n’ọnwụ nke Pọl na-ekwusa.'
  rationale: “Ka m ji buru agbụ ígwè a” retains the singular demonstrative chain and Paul’s concrete bodily restraint more closely than “nọ n’agbụ ígwè,” while remaining idiomatic. The hope phrase and its non-dogmatic explanatory note are retained without narrowing its allusive scope.
