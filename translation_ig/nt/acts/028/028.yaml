  source_fidelity: Ntụgharị ahụ na-edobe nke ọma nkwubi okwu οὖν, nkwupụta γνωστὸν ἔστω ὑμῖν, olu nnara nke ἀπεστάλη, na ntụaka ἔθνη dịka ndị na-abụghị ndị Juu. “Nzọpụta a nke Chineke” na-edobe obosara genitive τοῦ θεοῦ n’enweghị nkọwa karịrị akarị. “Ha onwe ha ga-egekwa ntị” na-egosipụta nkwusi ike αὐτοὶ καί ma na-anọgide n’ókè nke “receptive hearing,” ọ bụghị nkwupụta doro anya banyere ntụgharị okwukwe.
