id: ACT.28.28
reference: Acts 28:28
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: γνωστὸν οὖν ⸂ἔστω ὑμῖν⸃ ὅτι τοῖς ἔθνεσιν ἀπεστάλη ⸀τοῦτο τὸ σωτήριον τοῦ θεοῦ· αὐτοὶ καὶ ⸀ἀκούσονται.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/028.yaml
  text: Therefore let it be known to you that this salvation of God has been sent to the Gentiles[b][a]; they also will listen.
translation:
  language: ig
  text: Ya mere, ka unu mara na e zigara ndị mba ọzọ nzọpụta a nke Chineke[a]; ha onwe ha ga-egekwa ntị.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “nzọpụta a sitere n'aka Chineke.” Njikọ okwu Grik ahụ nwere ike ịpụta ihe karịrị otu n'ime nghọta ndị a yiri ibe ha.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ha onwe ha ga-anụkwa.” Okwu Grik ahụ nwere ike ịpụta “ịnụ” ma ọ bụ “ige ntị/ịnabata,” dịka ọnọdụ okwu siri dị.
    reason: lexical_alternative
lexical_decisions:
- source_word: γνωστὸν οὖν ἔστω ὑμῖν
  choice: Ya mere, ka unu mara
  rationale: Nke a na-egosipụta nkwubi okwu οὖν na iwu nkwupụta γνωστὸν ἔστω ὑμῖν n'Igbo dị ndụ ma dịkwa ugwu.
- source_word: τοῖς ἔθνεσιν
  choice: ndị mba ọzọ
  rationale: N'ọnọdụ esemokwu dị n'etiti ndị Juu na ndị na-abụghị ndị Juu n'Ọrụ Ndịozi, okwu a na-ezo aka n'ụzọ doro anya n'ebe ndị na-abụghị ndị Juu nọ.
- source_word: ἀπεστάλη
  choice: e zigara
  rationale: Ụdị a na-edobe olu nnara nke aorist ma na-egosi na iziga ahụ emezuola, n'ejighị okwu Igbo na-adịghị eke.
- source_word: τοῦτο τὸ σωτήριον τοῦ θεοῦ
  choice: nzọpụta a nke Chineke
  rationale: A sụgharịrị σωτήριον dịka 'nzọpụta,' ebe 'nke Chineke' na-ahapụ njikọ genitive ahụ ka ọ nọgide nwee nghọta ndị metụtara ịbụ nke Chineke ma ọ bụ isi n'aka Chineke bịa.
- source_word: αὐτοὶ καὶ ἀκούσονται
  choice: ha onwe ha ga-egekwa ntị
  rationale: '''Ha onwe ha'' na-ebupụta nkwusi ike nke αὐτοί, ''kwa'' na-anọchi καί, ebe ''ige ntị'' na-egosi ịnụrụ nke nwere nnabata n''ọnọdụ a.'
theological_decisions:
- issue: Ihe σωτήριον pụtara n'ọnọdụ a
  choice: nzọpụta
  alternative: ozi nzọpụta
  rationale: Okwu Grik n'onwe ya pụtara nzọpụta; itinye 'ozi' ga-akọwa ya karịa ihe ederede kwuru ma belata obosara nke ọrụ nzọpụta Chineke.
- issue: Ike nke ἀκούσονται
  choice: ga-ege ntị
  alternative: ga-anụ
  rationale: Ọnọdụ ahụ na-atụnyere ọjụjụ ụfọdụ ndị Juu na nnabata a na-atụ anya n'aka ndị mba ọzọ. 'Ga-ege ntị' na-egosi nnabata ahụ n'ekwughị karịa na ha ga-echegharị ma ọ bụ kwere.
- issue: Njikọ genitive dị na τοῦ θεοῦ
  choice: nke Chineke
  alternative: sitere n'aka Chineke
  rationale: '''Nke Chineke'' na-edobe mgbagwoju anya ziri ezi nke Grik: nzọpụta ahụ nwere ike ịbụ nke Chineke, nke Ọ na-eweta, ma ọ bụ nke sitere n''aka Ya.'
translation_notes:
  register: Standard Igbo; okwu dị ugbu a, dị ugwu, ma dị mfe nghọta. E ji 'ndị mba ọzọ' mee ka ntụnyere ndị Juu na ndị na-abụghị ndị Juu doo anya. Akara nkọwa ala peeji [a] na [b] pụtara n'ederede n'usoro ha.
