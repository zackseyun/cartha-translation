id: ACT.28.6
reference: Acts 28:6
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οἱ δὲ προσεδόκων αὐτὸν μέλλειν πίμπρασθαι ἢ καταπίπτειν ἄφνω νεκρόν. ἐπὶ πολὺ δὲ αὐτῶν προσδοκώντων καὶ θεωρούντων μηδὲν ἄτοπον εἰς αὐτὸν γινόμενον, ⸀μεταβαλόμενοι ἔλεγον ⸂αὐτὸν εἶναι θεόν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/006.yaml
  text: But they were expecting him to swell up or suddenly fall down dead. But after they had waited a long time and saw that nothing unusual was happening to him[a], they changed their minds and began saying that he was a god.
translation:
  language: ig
  text: Ma ha nọ na-atụ anya na ahụ ya ga-aza, ma ọ bụ na ọ ga-ada n’ala nwụọ na mberede. Mgbe ha chere ogologo oge ma hụ na ọ dịghị ihe pụrụ iche na-eme n’ahụ ya[a], ha gbanwere echiche ha wee malite ikwu na ọ bụ chi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ọ dịghị ihe dị iche na nke a na-ahụkarị” ma ọ bụ “ọ dịghị ihe na-adịghị mma” na-eme n’ahụ ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσεδόκων
  choice: ha nọ na-atụ anya
  rationale: Na-egosipụta atụmanya na-aga n’ihu, dịka imperfect Grik si dị.
- source_word: πίμπρασθαι
  choice: ahụ ya ga-aza
  rationale: N’ọnọdụ aru agwọ, okwu ahụ na-ezo aka n’ọzịza ahụ, ọ bụghị n’ọkụ nkịtị.
- source_word: καταπίπτειν ἄφνω νεκρόν
  choice: ọ ga-ada na mberede nwụọ
  rationale: Na-echekwa echiche nke ọdịda mberede nke ọnwụ so ya.
- source_word: ἐπὶ πολὺ
  choice: Mgbe ha chere ogologo oge
  rationale: Na-egosipụta ogologo oge ha jiri na-eche ma na-ele ya anya.
- source_word: θεωρούντων
  choice: hụ
  rationale: Ọ bụ ịhụ sitere n’ilegide anya nke ọma; ‘hụ’ bụ okwu Igbo doro anya ma kwekọọ n’ọnọdụ a.
- source_word: μηδὲν ἄτοπον
  choice: ọ dịghị ihe pụrụ iche
  rationale: Na-echekwa obosara nghọta nke ihe na-abụghị nke a na-ahụkarị, n’akọwaghị ya kpọmkwem dịka ihe ọjọọ ma ọ bụ ihe emerụ ahụ.
- source_word: μεταβαλόμενοι
  choice: ha gbanwere echiche ha
  rationale: Na-egosipụta mgbanwe n’otú ha si kpebie ihe banyere Pọl.
- source_word: ἔλεγον
  choice: wee malite ikwu
  rationale: Na-egosipụta mmalite nke okwu ha na-aga n’ihu, dịka imperfect ahụ nwere ike isi pụta.
- source_word: θεόν
  choice: otu chi
  rationale: N’ọnọdụ ndị na-efe ọtụtụ chi, nke a na-egosi na ha chere na Pọl bụ otu n’ime chi, ọ bụghị Chineke onye naanị ya.
theological_decisions:
- issue: Otu e si sụgharịa αὐτὸν εἶναι θεόν n’enweghị itinye nkwupụta Ndị Kraịst banyere ọnọdụ Pọl
  choice: na ọ bụ otu chi
  alternative: na ọ bụ Chineke; na ọdịdị ya bụ nke chi
  rationale: Akụkọ ahụ na-akọ nkwubi okwu na-ezighị ezi nke ndị bi n’agwaetiti ahụ. N’ihi θεόν na-enweghị article nakwa ọnọdụ ofufe ọtụtụ chi, ‘otu chi’ na-egosi nke ọma ihe ha bu n’obi ma ghara ime ka a ghọta na ha kpọrọ Pọl Chineke onye naanị ya.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ ‘ahụ ya ga-aza’ ka ihe a na-ekwu doo anya n’ọnọdụ aru agwọ, ma ‘otu chi’ na-echekwa ọnọdụ echiche ndị na-efe ọtụtụ chi.
