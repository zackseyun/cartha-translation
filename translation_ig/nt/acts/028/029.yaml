source:
  edition: robinson-pierpont-2005-byzantine
  text: Καὶ ταῦτα αὐτοῦ εἰπόντος, ἀπῆλθον οἱ Ἰουδαῖοι, πολλὴν ἔχοντες ἐν ἑαυτοῖς συζήτησιν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/029.yaml
  text: And when he had [a]said these things, the Jews departed, having a great dispute among themselves.
translation:
  language: ig
  text: Mgbe o kwusịrị ihe ndị a,[a] ndị Juu ahụ pụrụ, na-enwe nnukwu arụmụka n’etiti onwe ha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Amaokwu a dum adịghị n’ihe odide Grik ndị kacha ochie, gụnyere Papyrus 74 nke narị afọ nke atọ, Codex Sinaiticus nke narị afọ nke anọ, na Codex Vaticanus nke narị afọ nke anọ; ọ dịghịkwa na nsụgharị Coptic ndị mbụ. Ma ọ dị n’ọtụtụ ihe odide nke ọdịnala Byzantine, nakwa na nsụgharị Latin na Syriac ndị mbụ. O yikarịrị ka onye odeakwụkwọ mechara gbakwụnye ya iji mechie akụkọ banyere ọpụpụ ndị Juu ahụ.
    reason: textual_critical
lexical_decisions:
- source_word: συζήτησις
  choice: ịrụrịta ụka
  rationale: Okwu Grik a nwere ike ịpụta mkparịta ụka, arụmụka, ma ọ bụ esemokwu n’okwu. N’ebe a, “ịrụrịta ụka” na-egosi ịdị ike nke nghọtahie dị n’etiti ha n’enweghị ime ka ọ bụrụ ọgụ.
- source_word: ἀπέρχομαι
  choice: pụ
  rationale: “Pụ” bụ okwu Igbo doro anya ma bụrụkwa nke a na-ejikarị akọ na ha hapụrụ ebe ahụ; ọ na-edobe ihe ngwaa Grik pụtara n'ụzọ eke.
- source_word: πολλὴν ἔχοντες ἐν ἑαυτοῖς
  choice: na-arụrịta ụka nke ukwuu n’etiti onwe ha
  rationale: Nhazi a na-egosi na arụmụka ahụ siri ike nakwa na ọ bụ n’etiti ndị Juu ahụ n’onwe ha ka ọ dị.
theological_decisions: []
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-agbaso usoro akụkọ eke n’Igbo, ma na-edobe ike dị na πολλήν na echiche nke esemokwu dị n’etiti ha.
