  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οἵ ⸀τε βάρβαροι παρεῖχον οὐ τὴν τυχοῦσαν φιλανθρωπίαν ἡμῖν, ⸀ἅψαντες γὰρ πυρὰν προσελάβοντο πάντας ἡμᾶς διὰ τὸν ὑετὸν τὸν ἐφεστῶτα καὶ διὰ τὸ ψῦχος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/002.yaml
  text: And the local people showed us extraordinary kindness[b][a], for they lit a fire and welcomed all of us because of the rain that had set in and because of the cold.
translation:
  language: ig
  text: Ndị obodo ahụ meere anyị obiọma pụrụ iche[b][a]; n’ihi na ha mụnyere ọkụ, nabatakwa anyị niile n’ihi mmiri ozuzo ahụ nọ na-ezo na n’ihi oyi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Okwu Grik bụ βάρβαροι na-ezo aka n’ndị na-asụghị Grik. N'ebe a, ọ na-ezo aka ná ndị obodo agwaetiti ahụ; ọ pụtaghị na ha bụ ndị ọhịa ma ọ bụ ndị obi tara mmiri.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, “meere anyị obiọma na-abụghị nke nkịtị.”
    reason: lexical_alternative
lexical_decisions:
- source_word: βάρβαροι
  choice: ndị obodo ahụ
  rationale: N'ebe a, okwu Grik a na-ezo aka ná ndị bi n'agwaetiti ahụ, karịchaa ndị na-asụghị Grik; ọ pụtaghị na ha bụ ndị obi tara mmiri. Nhọrọ a bụ Igbo dị ugbu a nke na-ezere mkparị.
- source_word: οὐ τὴν τυχοῦσαν φιλανθρωπίαν
  choice: obiọma pụrụ iche
  rationale: Akpaalaokwu Grik ahụ pụtara obiọma na-abụghị nke nkịtị, ya bụ, obiọma karịrị akarị. Nke a na-ekwupụta echiche ahụ n'Igbo doro anya.
- source_word: παρεῖχον
  choice: meere anyị
  rationale: Mgbe e jikọtara ya na φιλανθρωπία, ọ pụtara igosi ma ọ bụ imere mmadụ obiọma; 'meere anyị obiọma' bụ okwu Igbo e ji ekwu ya nke ọma.
- source_word: ἅψαντες
  choice: mụnyere
  rationale: Okwu a na πυρά pụtara ịmụnye ọkụ; ụdị a na-egosikwa ihe ha mere tupu ma ọ bụ mgbe ha na-anabata ndị ahụ.
- source_word: πυρὰν
  choice: ọkụ
  rationale: Ọ pụtara ọkụ a mụnyere, ikekwe nnukwu ọkụ, ma 'ọkụ' anaghị etinye nkọwa karịrị nke isi mmalite kwuru.
- source_word: προσελάβοντο
  choice: nabatakwa
  rationale: N'ebe a ọ bụ ịnabata mmadụ n'ụzọ ile ọbịa, ọ bụghị naanị ịkpọbata ya n'ụlọ.
- source_word: πάντας ἡμᾶς
  choice: anyị niile
  rationale: Nke a na-echekwa nkwusi okwu Grik ahụ na ọ bụ onye ọ bụla n'ime ha ka a nabatara.
- source_word: διὰ τὸν ὑετὸν τὸν ἐφεστῶτα
  choice: n’ihi mmiri ozuzo ahụ nọ na-ezo
  rationale: Partisịpụ Grik ahụ na-egosi mmiri ozuzo bịara ma na-aga n'ihu n'oge ahụ; nsụgharị a na-ekwupụta ọnọdụ ahụ n'Igbo eke.
- source_word: διὰ τὸ ψῦχος
  choice: n’ihi oyi
  rationale: Nke a bụ ụzọ kwụ ọtọ, dịkwa mfe nghọta, isi sụgharịa ọnọdụ oyi ahụ.
- source_word: οἵ τε
  choice: Ndị ... ahụ
  rationale: τε na-ejikọta ahịrịokwu a na akụkọ gara aga; n'Igbo, njikọ ahụ pụtara ìhè site n'ịga n'ihu n'akụkọ, ebe 'ahụ' na-ezo aka ná ndị e kwuru banyere ha n'ọnọdụ ahụ.
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta mee ihe. A họọrọ 'ndị obodo ahụ' iji zere nghọta mkparị nke 'ndị ọhịa,' ma e debere nkọwa ethnolinguistic nke βάρβαροι n'ala ala peeji. E tinyere akara ala ala peeji abụọ ahụ n'isi ederede n'usoro [b][a], kwekọrọ n'okwu ha na-akọwa.
