id: ACT.28.27
reference: Acts 28:27
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐπαχύνθη γὰρ ἡ καρδία τοῦ λαοῦ τούτου, καὶ τοῖς ὠσὶν βαρέως ἤκουσαν, καὶ τοὺς ὀφθαλμοὺς αὐτῶν ἐκάμμυσαν· μήποτε ἴδωσιν τοῖς ὀφθαλμοῖς καὶ τοῖς ὠσὶν ἀκούσωσιν καὶ τῇ καρδίᾳ συνῶσιν καὶ ἐπιστρέψωσιν, καὶ ἰάσομαι αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/027.yaml
  text: For the heart of this people has become dull[a], and with their ears they heard heavily, and they closed their eyes; otherwise they might see with their eyes and hear with their ears and understand with their heart and turn back[b], and I would heal them.
translation:
  language: ig
  text: N’ihi na obi ndị mmadụ a aghọọla ihe dị arọ; ọ dịrị ha ike iji ntị ha nụ ihe, ha mechikwara anya ha. Ma ọ bụghị ya[a], ha gaara eji anya ha hụ, jiri ntị ha nụ, jiri obi ha ghọta, laghachi[b], m gaara agwọ ha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ịsụgharị ya: “ka ha ghara iji anya ha hụ ... jiri ntị ha nụ ... jiri obi ha ghọta ... laghachi, m wee gwọọ ha.” Njikọ okwu Grik a nwere ike inwe echiche siri ike karị nke “ka ha ghara” n’okwu a e hotara n’Aịzaya.'
    reason: alternative_reading
  - marker: b
    text: A pụkwara ịsụgharị “laghachi” dịka “tụgharịa” ma ọ bụ “laghachi azụ”; n’ọnọdụ a, ọ pụkwara ịpụta “chegharịa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπαχύνθη
  choice: adịla arọ
  rationale: Nke a na-edobe ihe atụ Grik nke obi ghọrọ ihe dị arọ ma ọ bụ nke na-adịghị anabata ihe nke ọma, n’emeghị ka ọ bụrụ naanị nkọwa banyere uche.
- source_word: καρδία
  choice: obi
  rationale: “Obi” bụ okwu Akwụkwọ Nsọ a na-aghọta nke ọma n’Igbo, ọ na-edobekwa njikọ ya na “jiri obi ha ghọta” n’ahịrịokwu sochirinụ.
- source_word: βαρέως ἤκουσαν
  choice: ọ na-esiri ha ike iji ntị ha anụ ihe
  rationale: Nke a bụ Igbo dị ndụ nke na-egosi na ha nụrụ n’ụzọ dị arọ ma ọ bụ siri ike, kama iji usoro okwu Grik nke ga-ada ka asụsụ a sụgharịrị n’ụzọ isiokwu n’isiokwu.
- source_word: ἐκάμμυσαν
  choice: ha mechikwara anya ha
  rationale: Ọ na-egosi omume ha mere n’onwe ha—imechi anya—n’ụzọ doro anya ma dịkwa mfe nghọta.
- source_word: μήποτε
  choice: Ma ọ bụghị ya
  rationale: Nke a na-enye echiche nke “otherwise” n’Igbo dị mfe, ma na-ahapụ esemokwu dị n’etiti ịdọ aka ná ntị, ihe si na ya pụta, na ebumnuche ikpe Chineke ka ọ dị; e debere nghọta siri ike nke “ka ha ghara” n’okpuru peeji.
- source_word: ἐπιστρέψωσιν
  choice: tụgharịa laghachi azụ
  rationale: Ọ na-edobe ihe atụ nke ntụgharị na nlọghachi n’enweghị ime ka okwu ahụ bụrụ naanị “chegharịa” ma ọ bụ tinye nkọwa ụka pụrụ iche.
- source_word: ἰάσομαι
  choice: m wee gwọọ ha
  rationale: N’usoro ahịrịokwu a, “wee” jikọtara ọgwụgwọ ahụ na ịhụ, ịnụ, ịghọta, na ịtụgharị; ọ na-egosi ihe ga-esochi ya n’enweghị ịgbanwe ya ka ọ bụrụ ihe mere n’oge gara aga.
theological_decisions:
- issue: Ebumnuche Chineke n’okwu e hotara n’Aịzaya
  choice: Ma ọ bụghị ya
  alternative: ka ha ghara
  rationale: Isi okwu ahụ na-ahapụ esemokwu dị n’etiti ikpe Chineke na ibu ọrụ mmadụ. Nsụgharị bụ isi anaghị ekwu kpọmkwem na Chineke mere ka ha ghara ikwere, ebe nkọwa ala peeji na-echekwa ike okwu Grik nke pụrụ igosi ebumnuche ma ọ bụ igbochi ihe.
- issue: Ihe ἐπιστρέψωσιν pụtara
  choice: tụgharịa laghachi azụ
  alternative: tụgharịa; laghachi; chegharịa
  rationale: Nhọrọ a na-echekwa echiche ntụgharị nke nwere ike ịgụnye ịlaghachikwuru Chineke, ma ọ naghị amanye okwu nkà mmụta okpukpe nke isi okwu Grik ekwughị kpọmkwem.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta, mee ihe. A họọrọ usoro okwu Igbo sitere n’okike karịa ịgbaso nhazi Grik n’ụzọ ga-ada arọ, ma e debere ihe atụ “obi” na “arọ,” njikọ anya–ntị–obi, na esemokwu nkà mmụta okpukpe dị na μήποτε.
