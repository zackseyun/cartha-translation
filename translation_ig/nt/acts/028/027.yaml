revisions:
- from: N’ihi na obi ndị a adịla arọ; ọ na-esiri ha ike iji ntị ha anụ ihe, ha mechikwara anya ha. Ma ọ bụghị ya[a], ha pụrụ iji anya ha hụ, jiri ntị ha nụ, jiri obi ha ghọta, tụgharịa laghachi azụ[b], m wee gwọọ ha.
  to: N’ihi na obi ndị mmadụ a aghọọla ihe dị arọ; ọ dịrị ha ike iji ntị ha nụ ihe, ha mechikwara anya ha. Ma ọ bụghị ya[a], ha gaara eji anya ha hụ, jiri ntị ha nụ, jiri obi ha ghọta, laghachi[b], m gaara agwọ ha.
  rationale: The revision restores the explicit referent “this people,” maintains the past assertion about their hearing, and makes the final healing prospective and contingent rather than past. It also removes redundant wording for return while retaining the source’s conversion-oriented metaphor. The footnote continues to preserve the stronger possible μήποτε nuance without settling its theological interpretation.
