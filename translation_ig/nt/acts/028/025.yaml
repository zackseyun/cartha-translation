  terminology: “Mmụọ Nsọ,” “Aịzaya onye amụma,” na “Pọl” dabara n’usoro Igbo nke Akwụkwọ Nsọ. A gbanwere “site n’ọnụ” ka ọ bụrụ “site n’aka” n’ihi na Grik na-ekwu naanị na okwu ahụ bịara site n’aka Aịzaya, ọ bụghị kpọmkwem “ọnụ” ya.
