  text: ἀσύμφωνοι δὲ ὄντες πρὸς ἀλλήλους ἀπελύοντο, εἰπόντος τοῦ Παύλου ῥῆμα ἓν ὅτι Καλῶς τὸ πνεῦμα τὸ ἅγιον ἐλάλησεν διὰ Ἠσαΐου τοῦ προφήτου πρὸς τοὺς πατέρας ⸀ὑμῶν
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/025.yaml
  text: 'And since they were disagreeing with one another, they were leaving after Paul had said one final word: “The Holy Spirit spoke rightly through Isaiah the prophet to your fathers'
translation:
  language: ig
  text: 'Ebe ha na-enweghị nkwekọrịta n’etiti onwe ha, ha malitere ịla mgbe Pọl kwuchara otu okwu ikpeazụ[a], sị: “Mmụọ Nsọ kwuru nke ọma site n’aka Aịzaya onye amụma gwa ndị nna unu[b],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “otu okwu” ma ọ bụ “otu nkwupụta.” N’asụsụ Grik, ọ bụ “otu okwu”; n’ebe a, ọ bụ okwu mmechi.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya “ndị nna ochie unu.” Okwu Grik ahụ bụ “ndị nna unu,” na-ezo aka ná ndị nna ochie Izrel.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσύμφωνοι δὲ ὄντες πρὸς ἀλλήλους
  choice: Ebe ha na-ekwekọrịtaghị n’etiti onwe ha
  rationale: Nke a na-egosi ọnọdụ ha nke enweghị nkwekọrịta n’etiti onwe ha, n’Igbo dị mfe ma kwekọọ n’usoro participle nke Grik.
- source_word: ἀπελύοντο
  choice: ha malitere ịla
  rationale: Imperfect a na-egosi na ìgwè ahụ nọ na-ekewa ma na-amalite ịpụ, ọ bụghị na a chụpụrụ ha.
- source_word: εἰπόντος τοῦ Παύλου
  choice: mgbe Pọl kwuchara
  rationale: Genitive absolute ahụ dabara nke ọma dị ka ahịrịokwu oge; εἰπόντος pụtara ‘kwuru,’ ọ bụghị okwu pụrụ iche maka ikwu amụma.
- source_word: ῥῆμα ἓν
  choice: otu okwu ikpeazụ
  rationale: N'ụzọ nkịtị ọ bụ ‘otu okwu,’ ma n’ebe a ọ na-arụ ọrụ dị ka okwu mmechi.
- source_word: Καλῶς
  choice: kwuru ezi okwu
  rationale: Nkebiokwu a na-egosi na ihe Mmụọ Nsọ kwuru ziri ezi; nsụgharị a bụ Igbo nkịtị nke na-edobe ike nyocha dị na καλῶς.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: Mmụọ Nsọ
  rationale: Nke a bụ aha Igbo a na-ejikarị eme ihe maka definite Greek phrase ahụ, nke na-ezo aka n’Onye Chineke.
- source_word: ἐλάλησεν διὰ Ἠσαΐου τοῦ προφήτου
  choice: kwuru ... site n’ọnụ Aịzaya onye amụma
  rationale: ‘Site n’ọnụ’ na-egosi na Mmụọ Nsọ bụ isi mmalite okwu ahụ, ebe Aịzaya bụ onye e si n’aka ya kwuo ya.
- source_word: πρὸς τοὺς πατέρας ὑμῶν
  choice: gwa ndị nna nna unu
  rationale: ‘Ndị nna nna’ na-edobe ihe oyiyi ezinụlọ nke πατέρες ma na-egosi ndị nna ochie Izrel, kama ịpụta nanị nna mụrụ mmadụ.
theological_decisions:
- issue: Onye kwuru okwu amụma na ụzọ e si kwuo ya
  choice: Mmụọ Nsọ kwuru ezi okwu site n’ọnụ Aịzaya onye amụma
  alternative: Mmụọ Nsọ kwuru nke ọma site n’aka Aịzaya onye amụma
  rationale: Nhọrọ ahụ na-edobe nkwupụta doro anya na Mmụọ Nsọ kwuru okwu ahụ, Aịzaya bụrụ onye e si n’ọnụ ya zie ya, ma ọ naghị akọwa karịa ihe ederede kwuru.
- issue: Ndị okwu ‘ndị nna unu’ na-ezo aka na ha
  choice: ndị nna nna unu
  alternative: ndị nna ochie unu
  rationale: Grik ji πατέρες, ya mere ‘ndị nna nna’ na-echekwa okwu nwoke na njikọ ezinụlọ ya, ebe ọ na-egosikwa n’ụzọ nkịtị na ọ bụ ndị nna ochie Izrel.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ ‘malitere ịla’ iji gosipụta imperfect process, ‘site n’ọnụ’ iji mee ka prophetic mediation doo anya, ma debe akara ukwu abụọ n’ebe okwu ha na-akọwa dị.
