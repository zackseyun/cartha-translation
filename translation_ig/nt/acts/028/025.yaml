  verdict: revise
  source_fidelity: 'A na-edobe usoro isiokwu ahụ nke ọma n’ozuzu ya: enweghị nkwekọrịta n’etiti ha, ịla ha, na okwu mmechi Pọl. Otú ọ dị, “kwuru ezi okwu” nwere ike ịpụta na Mmụọ Nsọ kwuru okwu ndị bụ eziokwu, karịa na o kwuru n’ụzọ ziri ezi (Καλῶς). Ọzọkwa, “ndị nna nna unu” na-akọwa referent ahụ n’ụzọ ziri ezi mana ọ naghị edobe πατέρας (“ndị nna”) n’ụzọ dị nso dịka o kwesịrị.'
