  text: συστρέψαντος δὲ τοῦ Παύλου φρυγάνων ⸀τι πλῆθος καὶ ἐπιθέντος ἐπὶ τὴν πυράν, ἔχιδνα ⸀ἀπὸ τῆς θέρμης ⸀ἐξελθοῦσα καθῆψε τῆς χειρὸς αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/003.yaml
  text: But when Paul had gathered a bundle of sticks and put them on the fire[b][a], a viper came out because of the heat and fastened onto his hand.
translation:
  language: ig
  text: Ma mgbe Pọl chịkọtara otu ùkwù nkụ ma tụkwasị ya n’ọkụ, otu ajụala pụtara n’ihi okpomọkụ ahụ[a] wee rapara n’aka ya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ, “site n’okpomọkụ ahụ.” Okwu Grik a pụrụ ịsụgharị ya otu a n’ụzọ nkịtị, ọ bụ ezie na n’ebe a o yikarịrị ka ọ na-egosi ihe kpatara ajụala ahụ ji pụta: okpomọkụ ọkụ ahụ.'
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “jidesiri aka ya ike” ma ọ bụ “tara ya n’aka.” Ngwaa Grik ahụ pụtara n’ụzọ sara mbara “ịrapara n’ihe” ma ọ bụ “ijide ihe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: συστρέψαντος
  choice: chịkọtara
  rationale: Ngwaa a na-egosi na Pọl chịkọtara ihe ndị ahụ ọnụ. N’ebe a, ‘chịkọtara’ bụ Igbo doro anya ma kwekọọ n’ịchịkọta nkụ karịa ntụgharị nkịtị nke pụrụ ịpụta ịtụkọta ihe ọnụ.
- source_word: φρυγάνων τι πλῆθος
  choice: otu ùkwù nkụ
  rationale: φρύγανα bụ ụmụ osisi kpọrọ nkụ ma ọ bụ nkụ a na-etinye n’ọkụ; τι πλῆθος na-egosi oke a na-akọwaghị kpọmkwem. ‘Otu ùkwù nkụ’ na-enye ihe oyiyi doro anya ma bụrụkwa okwu Igbo e ji ekwu nkụ a chịkọtara ọnụ.
- source_word: ἐπιθέντος ἐπὶ τὴν πυράν
  choice: tụkwasị ya n’ọkụ
  rationale: Nke a na-egosi na Pọl tinyere ùkwù nkụ ahụ n’elu ọkụ. ‘Tụkwasị ya n’ọkụ’ bụ okwu Igbo dị mfe ma na-aga were were.
- source_word: ἔχιδνα
  choice: otu ajụala
  rationale: ἔχιδνα bụ ụdị agwọ e weere dị ka ajụala, ọ bụghị naanị aha izugbe maka agwọ. ‘Ajụala’ na-echekwa nkọwa ahụ n’Igbo.
- source_word: ἀπὸ τῆς θέρμης
  choice: n’ihi okpomọkụ ahụ
  rationale: ἀπό nwere ike ịpụta ‘site na,’ ma n’akụkọ a ọ ga-abụ na ọ na-egosi ihe kpatara ajụala ahụ ji pụta. E debere ntụgharị nkịtị ya n’okpuru peeji iji chekwaa nghọta abụọ ahụ.
- source_word: ἐξελθοῦσα
  choice: si ebe ahụ pụta
  rationale: Nke a na-egosi na ajụala ahụ siri n’ebe ọ nọ pụta. ‘Si ebe ahụ pụta’ na-ezere ịgbakwụnye ebe kpọmkwem ederede Grik na-akpọghị aha.
- source_word: καθῆψε τῆς χειρὸς αὐτοῦ
  choice: raparakwa ya n’aka
  rationale: καθάπτω pụtara ijidesi ihe ike ma ọ bụ ịrapara n’ihe. ‘Rapara ya n’aka’ na-echekwa obosara okwu ahụ n’ekwughị hoo haa na ọ tara ya, n’agbanyeghị na nke ahụ pụrụ ịbụ ihe e bu n’obi.
