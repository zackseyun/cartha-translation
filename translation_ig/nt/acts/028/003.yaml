revisions:
- from: Ma mgbe Pọl chịkọtara otu ùkwù nkụ ma tụkwasị ya n’ọkụ, otu ajụala si ebe ahụ pụta n’ihi okpomọkụ ahụ[a], raparakwa ya n’aka[b].
  to: Ma mgbe Pọl chịkọtara otu ùkwù nkụ ma tụkwasị ya n’ọkụ, otu ajụala pụtara n’ihi okpomọkụ ahụ[a] wee rapara n’aka ya[b].
  rationale: The revision removes the added locative element, corrects the Igbo expression for the viper’s attachment to Paul’s hand, and refines the related footnote while preserving the source text’s lexical breadth and the causal reading retained in the English audit trail.
