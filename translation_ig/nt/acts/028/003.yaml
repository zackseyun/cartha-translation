  register: E ji Igbo Izugbe dị ugbu a, dị ùgwù ma dị mfe nghọta. Nhazi ahịrịokwu ahụ na-echekwa usoro omume dị na Grik, ebe ihe odide ndị dị n’okpuru peeji na-echekwa mgbagwoju anya dị na ἀπό na καθάπτω.
