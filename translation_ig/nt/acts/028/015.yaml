revisions:
- from: Site n’ebe ahụ, mgbe ụmụnna[a] nụrụ banyere anyị, ha bịara izute anyị ruo n’Ọma Ahịa Apiọs na Ụlọ Ezumike Atọ. Mgbe Pọl hụrụ ha, o kelere Chineke, obi siekwa ya ike.
  to: Ma site n’ebe ahụ, mgbe ụmụnna[a] nụrụ banyere anyị, ha bịara izute anyị ruo Fọrum Apiọs na Ụlọ Ọbịa Atọ. Mgbe Pọl hụrụ ha, o nyere Chineke ekele, obi siekwa ya ike.
  rationale: The revision retains the source’s syntax and sense while removing ambiguity in Paul’s act of thanksgiving, preserving the opening connective, using natural Standard Igbo, and clarifying the lexical footnote. The place names remain recognizable names rather than being over-interpreted as descriptions.
