  variant: Standard Igbo
source:
  edition: SBLGNT
  text: κἀκεῖθεν οἱ ἀδελφοὶ ἀκούσαντες τὰ περὶ ἡμῶν ⸀ἦλθαν εἰς ἀπάντησιν ἡμῖν ἄχρι Ἀππίου Φόρου καὶ Τριῶν Ταβερνῶν, οὓς ἰδὼν ὁ Παῦλος εὐχαριστήσας τῷ θεῷ ἔλαβε θάρσος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/015.yaml
  text: And from there the brothers[a], when they heard about us, came to meet us as far as Appius Forum and Three Taverns. When Paul saw them, he gave thanks to God and took courage.
translation:
  language: ig
  text: Ma site n’ebe ahụ, mgbe ụmụnna[a] nụrụ banyere anyị, ha bịara izute anyị ruo Fọrum Apiọs na Ụlọ Ọbịa Atọ. Mgbe Pọl hụrụ ha, o nyere Chineke ekele, obi siekwa ya ike.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ụmụnna nwoke na ụmụnna nwanyị.” N’asụsụ Grik, e dere “ụmụnna,” okwu a na-ejikarị akọwa ndị kwere ekwe ibe ha, nke n’ọnọdụ a pụrụ ịgụnyekwa ụmụ nwanyị.
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀκεῖθεν
  choice: Site n’ebe ahụ
  rationale: Na-egosi mgbanwe ebe n’akụkọ njem ahụ ma na-aga n’ihu n’ụzọ Igbo dị mfe.
- source_word: οἱ ἀδελφοὶ
  choice: ụmụnna
  rationale: “Ụmụnna” bụ okwu Igbo nkịtị e ji akpọ ndị otu okwukwe; ọ na-edobe ihe Greek kwuru ma nwee ike ịgụnye ndị inyom dịka ọnọdụ si dị.
- source_word: ἀκούσαντες τὰ περὶ ἡμῶν
  choice: mgbe ... nụrụ banyere anyị
  rationale: Na-egosipụta participle ahụ dịka ihe mere tupu ha abịa, na-enweghị ịgbakwunye “ozi” nke na-adịghị kpọmkwem na Greek.
- source_word: ἦλθαν εἰς ἀπάντησιν ἡμῖν
  choice: ha bịara izute anyị
  rationale: Nke a bụ ntụgharị Igbo eke nke akpaalaokwu Greek maka ịbịa izute mmadụ.
- source_word: ἄχρι Ἀππίου Φόρου καὶ Τριῶν Ταβερνῶν
  choice: ruo n’Ọma Ahịa Apiọs na Ụlọ Ezumike Atọ
  rationale: “Ruo” na-edobe echiche oke ebe nke ἄχρι; aha ebe ndị ahụ ka a sụgharịrị n’ụzọ ga-enyere onye Igbo ghọta ha.
- source_word: εὐχαριστήσας τῷ θεῷ
  choice: o kelere Chineke
  rationale: Na-enye participle ahụ dị ka ngwaa n’usoro akụkọ, n’Igbo dị nkenke ma dị ùgwù.
- source_word: ἔλαβε θάρσος
  choice: obi siekwa ya ike
  rationale: Akpaalaokwu Igbo a na-egosi na Pọl nwetara ume na nkwuwa, nke kwekọrọ n’echiche Greek “natara obi ike.”
theological_decisions:
- issue: Ma οἱ ἀδελφοὶ ọ̀ na-ezo naanị aka n’ụmụ nwoke ma ọ bụ n’òtù ndị kwere ekwe niile
  choice: ụmụnna
  alternative: ụmụnna nwoke na ụmụnna nwanyị; ndị kwere ekwe
  rationale: A hapụrụ okwu ezinụlọ nke Greek n’isi ederede. Ihe odide ala peeji kọwara na n’ọnọdụ a ọ pụrụ ịgụnye ụmụ nwanyị, na-enweghị ịgbanwe ya gaa n’okwu nkọwa sara mbara.
translation_notes:
  register: Standard Igbo dị ugbu a, dị mfe ma dị ùgwù. E ji “Ọma Ahịa Apiọs” na “Ụlọ Ezumike Atọ” mee ka aha ebe ndị Rom pụta ìhè nye onye na-agụ Igbo; e debere marker [a] ozugbo n’akụkụ “ụmụnna.”
