id: ACT.28.12
reference: Acts 28:12
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ καταχθέντες εἰς Συρακούσας ἐπεμείναμεν ἡμέρας τρεῖς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/012.yaml
  text: And after putting in at Syracuse[a], we stayed there three days.
translation:
  language: ig
  text: Mgbe ụgbọ mmiri anyị kwụsịrị na Sirakụs[a], anyị nọrọ ụbọchị atọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “Mgbe anyị ji ụgbọ mmiri rute Sirakụs,” ma ọ bụ, “Mgbe anyị rutere n’ala na Sirakụs.” Okwu Grik e ji mee ihe ebe a nwere echiche njem ụgbọ mmiri.
    reason: lexical_alternative
lexical_decisions:
- source_word: καταχθέντες
  choice: mgbe anyị banyere n’ọdụ ụgbọ mmiri
  rationale: N’ọnọdụ njem ụgbọ mmiri a, okwu a pụtara ịbanye n’ọdụ ụgbọ mmiri ma ọ bụ iru n’ụsọ mmiri. Nhọrọ a na-eme ka echiche ụgbọ mmiri dị n’okwu Grik doo anya n’Igbo nkịtị.
- source_word: εἰς Συρακούσας
  choice: dị na Sirakụs
  rationale: εἰς na-egosi ebe ha rutere; n’Igbo, ijikọ ya na ‘ọdụ ụgbọ mmiri dị na Sirakụs’ bụ ụzọ ebumpụta ụwa isi kwuo na ụgbọ mmiri ahụ banyere n’ọdụ ụgbọ mmiri obodo ahụ.
- source_word: ἐπεμείναμεν
  choice: anyị nọrọ
  rationale: Okwu a pụtara ịnọgide ma ọ bụ ịnọ ebe ahụ. ‘Anyị nọrọ’ bụ Igbo dị mfe ma dabara n’ọnọdụ a.
- source_word: ἡμέρας τρεῖς
  choice: ụbọchị atọ
  rationale: Ọ bụ ebubo oge na-egosi ogologo oge; ‘ụbọchị atọ’ na-enye nghọta ahụ nke ọma mgbe ọ gbasoro ‘anyị nọrọ.’
- source_word: Συρακούσας
  choice: Sirakụs
  rationale: E depụtara aha obodo Grik ahụ n’ụdị ụda dabara n’usoro mkpụrụokwu Igbo.
theological_decisions: []
translation_notes:
  register: Asụsụ ahụ bụ Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A kọwara echiche nke ịbanye n’ọdụ ụgbọ mmiri n'ụzọ doro anya, ebe ndetu ala na-echekwa ụzọ ọzọ e nwere ike isi tụgharị okwu Grik ahụ.
