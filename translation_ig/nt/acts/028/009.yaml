id: ACT.28.9
reference: Acts 28:9
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τούτου ⸀δὲ γενομένου καὶ οἱ λοιποὶ οἱ ⸂ἐν τῇ νήσῳ ἔχοντες ἀσθενείας⸃ προσήρχοντο καὶ ἐθεραπεύοντο,
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/009.yaml
  text: And after this happened[a], the rest of those on the island who had diseases also came and were healed.
translation:
  language: ig
  text: Mgbe nke a mere, ndị ọzọ nọ n’agwaetiti ahụ bụ́ ndị nwere ọrịa[a] bịakwara, a gwọọkwa ha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị na-arịa ọrịa.” N’asụsụ Grik, ọ pụtara n’ụzọ nkịtị “ndị nwere ọrịa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τούτου δὲ γενομένου
  choice: Mgbe nke a mere
  rationale: Nkebiokwu a na-egosi oge ma na-ebuga akụkọ ahụ n’ihe sochirinụ; nsụgharị a bụ Igbo nkịtị ma na-edobe ihe ọ pụtara, ‘mgbe nke a mere.’
- source_word: οἱ λοιποί
  choice: ndị ọzọ
  rationale: Ọ na-ezo aka n’ọdị ndị ọzọ e wezụga onye ahụ a gwọrọ ọrịa na mbụ; ‘ndị ọzọ’ doro anya ma bụrụkwa okwu Igbo e ji eme ihe kwa ụbọchị.
- source_word: οἱ ἐν τῇ νήσῳ
  choice: ndị ... nọ n’agwaetiti ahụ
  rationale: Nke a na-akọwa ndị ahụ dị n’agwaetiti Malta; ‘nọ n’agwaetiti ahụ’ bụ ụzọ ebumpụta ụwa e si kwuo ya n’Igbo.
- source_word: ἔχοντες ἀσθενείας
  choice: ndị nwere ọrịa
  rationale: Nke a na-edobe ihe participle Grik ahụ pụtara n’ụzọ dị nso, ya bụ, ndị nwere ọrịa, n’enweghị ịkọwa ụdị ọrịa ahụ.
- source_word: προσήρχοντο
  choice: bịakwara
  rationale: Imperfect ahụ nwere ike igosi na ndị mmadụ nọgidere na-abịa; n’akụkọ Igbo, ‘bịakwara’ na-egosi nke ọma na ha bịakwara n’ihi ihe mere tupu ya, n’etinyeghị ‘bịakwutere ya,’ nke na-apụtaghị kpọmkwem na Grik.
- source_word: ἐθεραπεύοντο
  choice: a gwọọkwa ha
  rationale: Nke a na-edobe olu nnara nke Grik ma na-ekwu n’Igbo doro anya na e mere ka ha gbakee.
- source_word: καὶ
  choice: -kwara / -kwa
  rationale: Mgbakwunye ‘-kwara/-kwa’ na ‘bịakwara’ na ‘gwọọkwa’ na-egosi njikọ na ihe mere na mbụ nakwa na ndị ọzọ sonyekwara.
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta, dee amaokwu ahụ. E tinyere akara nkọwa ụkwụ [a] n’akụkụ okwu ọ na-akọwa, ἔχοντες ἀσθενείας, kama n’akụkụ nkebiokwu mmalite.
