  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta, dee ya. E debere usoro oge nke τότε site na ‘mgbe ahụ,’ ma zere ịkpọ onye mere nnapụta ahụ aha ebe Grik na-akpọghị ya aha.
