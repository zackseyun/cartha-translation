revisions:
- from: Mgbe a zọpụtasịrị anyị n’udo[a][d], mgbe ahụ ka anyị matara na a na-akpọ agwaetiti ahụ Malta[b][c].
  to: Ọ bụ mgbe a zọpụtasịrị anyị n’ihe ize ndụ ka anyị matara na a na-akpọ agwaetiti ahụ Malta[b][c].
  rationale: The text replaces the potentially misleading “n’udo” with “n’ihe ize ndụ,” which expresses the deliverance-through-peril sense of διασωθέντες, and removes redundant temporal wording while retaining the sequence marked by τότε. The footnote set is retained and corrected, including a literal note that accurately represents Μελίτη.
