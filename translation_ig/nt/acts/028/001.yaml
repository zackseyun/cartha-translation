  text: Καὶ διασωθέντες τότε ⸀ἐπέγνωμεν ὅτι ⸀Μελίτη ἡ νῆσος καλεῖται.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/001.yaml
  text: After we had been brought safely through[d][c][b][a], we then learned that the island was called Malta.
translation:
  language: ig
  text: Ọ bụ mgbe a zọpụtasịrị anyị n’ihe ize ndụ ka anyị matara na a na-akpọ agwaetiti ahụ Malta[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: N’asụsụ Grik, aha ahụ bụ Melitē; a na-amata agwaetiti a kemgbe ogologo oge dịka Malta.
    reason: cultural_note
  - marker: c
    text: N’ụzọ kpọmkwem, Grik sịrị, “a na-akpọ agwaetiti ahụ Melitē.” Ọ na-eji ngwaa nnara nke oge ugbu a eme ihe.
    reason: lexical_alternative
lexical_decisions:
- source_word: διασωθέντες
  choice: mgbe a zọpụtasịrị anyị n’udo
  rationale: Nkebi a na-egosi na nnapụta ahụ mere tupu ha amata aha agwaetiti ahụ. Okwu ‘zọpụta’ na-edobe echiche nke ịgafe ihe ize ndụ wee lanarị, ebe usoro ‘a zọpụtasịrị anyị’ na-echekwa olu nnara nke Grik n’emeghị ka onye napụtara ha bụrụ onye a kpọrọ aha.
- source_word: τότε
  choice: mgbe ahụ
  rationale: Ọ bụ okwu oge na-egosi usoro ihe mere; ‘mgbe ahụ’ bụ Igbo doro anya ma kwekọọ n’akụkọ a.
- source_word: ἐπέγνωμεν
  choice: anyị matara
  rationale: N’ebe a, ngwaa ahụ pụtara na ha nwetara ozi ha na-amaghị na mbụ. ‘Anyị matara’ na-ekwupụta nke a n’ụzọ Igbo nkịtị.
- source_word: Μελίτη
  choice: Malta
  rationale: ‘Malta’ bụ aha a na-eji akpọ agwaetiti ahụ n’Igbo nke oge a; ọ dabara na njirimara ọdịnala nke Μελίτη.
- source_word: ἡ νῆσος
  choice: agwaetiti ahụ
  rationale: ‘Agwaetiti ahụ’ bụ okwu Igbo kpọmkwem ma na-ezo aka n’ala ahụ ndị nọ n’akụkọ ahụ rutere.
- source_word: καλεῖται
  choice: a na-akpọ … Malta
  rationale: 'Usoro a na-echekwa olu nnara na oge ugbu a dị na Grik: nke bụ aha a na-akpọ agwaetiti ahụ, ọ bụghị naanị aha e nyere ya otu mgbe gara aga.'
