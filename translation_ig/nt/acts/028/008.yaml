id: ACT.28.8
reference: Acts 28:8
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐγένετο δὲ τὸν πατέρα τοῦ Ποπλίου πυρετοῖς καὶ ⸀δυσεντερίῳ συνεχόμενον κατακεῖσθαι, πρὸς ὃν ὁ Παῦλος εἰσελθὼν καὶ προσευξάμενος ἐπιθεὶς τὰς χεῖρας αὐτῷ ἰάσατο αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/008.yaml
  text: It happened that the father of Publius was lying sick with fevers and dysentery. Paul went in to him[a], and after praying and laying his hands on him, healed him.
translation:
  language: ig
  text: 'O wee bụrụ na nna Pọbliọs nọ dina n’ọrịa, ahụ ọkụ na ọnyụnyụ ọbara na-emekpa ya ahụ.[a] Pọl banyere n’ebe ọ nọ; mgbe o kpesịrị ekpere, o bikwasịrị ya aka abụọ, wee gwọọ ya.


    [a] A pụkwara ịsụgharị ya, “ahụ ọkụ na ọnyụnyụ ọbara jidere ya.” Okwu Grik e ji mee ihe na-egosi na ọrịa ndị a na-emekpa ya ahụ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ahụ ọkụ na ọnyụnyụ ọbara jidere ya.” Okwu Grik e ji mee ihe na-egosi na ọrịa ndị a na-emekpa ya ahụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο δὲ
  choice: O wee ruo na
  rationale: Ọ bụ ụzọ e si ewebata ihe ọzọ mere n’akụkọ; nsụgharị a na-ada ka Igbo nkịtị ma na-ejigide njikọ akụkọ ahụ.
- source_word: πατέρα τοῦ Ποπλίου
  choice: nna Pọbliọs
  rationale: Nke a bụ usoro Igbo dị mfe ma doo anya maka njikọ genitiv nke Grik.
- source_word: πυρετοῖς
  choice: ahụ ọkụ
  rationale: Igbo na-ejikarị aha a dịka aha na-adịghị agụta agụta. Ọ bụ ya mere e ji ghara ịmanye ọtụtụ nke Grik n’ụdị Igbo na-adịghị eke; ihe odide ala peeji kọwara ịdị arọ nke ọnọdụ ahụ.
- source_word: δυσεντερίῳ
  choice: ọnyụnyụ ọbara
  rationale: Ọ bụ okwu Igbo ndị mmadụ na-aghọta nke ọma maka dysentery, karịsịa afọ ọsịsa nwere ọbara.
- source_word: συνεχόμενον
  choice: na-enye ya nsogbu
  rationale: Ọ na-egosi na ọrịa ndị ahụ nọgidere na-emekpa ya ahụ. Ihe odide ala peeji debere ihe atụ siri ike karị, ‘jidere ya.’
- source_word: κατακεῖσθαι
  choice: dina n’ọrịa
  rationale: Ọ na-egosi ma ọnọdụ idina ala ma eziokwu ahụ na ọ na-arịa ọrịa, n’agbanyeghị na ọ naghị ekwu hoo haa na ọ pụghị isi n’àkwà bilie.
- source_word: πρὸς ὃν ... εἰσελθὼν
  choice: banyere n’ebe ọ nọ
  rationale: Ọ na-egosi na Pọl banyere n’ụlọ ma ọ bụ n’ebe nwoke ahụ na-arịa ọrịa nọ, n’ụzọ Igbo dị larịị.
- source_word: προσευξάμενος
  choice: mgbe o kpesịrị ekpere
  rationale: Ọ na-egosi na ekpere ahụ buru ụzọ tupu ọgwụgwọ e kwuru n’isi ngwaa.
- source_word: ἐπιθεὶς τὰς χεῖρας αὐτῷ
  choice: o bikwasịrị ya aka ya abụọ
  rationale: Ọ na-edebe omume ịbikwasị aka na ọtụtụ nke okwu Grik ‘aka.’
- source_word: ἰάσατο αὐτόν
  choice: wee gwọọ ya
  rationale: Ọ bụ nsụgharị kpọmkwem ma doo anya nke ọgwụgwọ ahụ, na-agbakwụghị nkọwa banyere otú o si mee.
theological_decisions:
- issue: Ụdị ọgwụgwọ Pọl mere
  choice: E gosipụtara usoro ahụ dịka ikpe ekpere, ibikwasị aka, na ịgwọ nwoke ahụ.
  alternative: Ịkpọ ya ọrụ ebube hoo haa ma ọ bụ ịkọwa ya dịka ọgwụgwọ ahụike nkịtị.
  rationale: Amaokwu ahụ kwuru na Pọl gwọrọ ya mgbe o kpesịrị ekpere ma bikwasị ya aka, ma o tinyeghị aha nkọwa pụrụ iche banyere ọsọ ọgwụgwọ ahụ, usoro sayensị ya, ma ọ bụ ihe ọ pụtara n’usoro okpukpe.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E dere aha ndị mmadụ dịka Pọbliọs na Pọl. E tinyere akara [a] ozugbo n’akụkụ nkebi okwu ọ na-akọwa, kama itinye ya n’akụkụ ‘ebe ọ nọ.’
