  to: 'O wee bụrụ na nna Pọbliọs nọ dina n’ọrịa, ahụ ọkụ na ọnyụnyụ ọbara na-emekpa ya ahụ.[a] Pọl banyere n’ebe ọ nọ; mgbe o kpesịrị ekpere, o bikwasịrị ya aka abụọ, wee gwọọ ya.


    [a] A pụkwara ịsụgharị ya, “ahụ ọkụ na ọnyụnyụ ọbara jidere ya.” Okwu Grik e ji mee ihe na-egosi na ọrịa ndị a na-emekpa ya ahụ.'
  rationale: The revision improves idiomatic Standard Igbo and represents the sustained affliction expressed by συνεχόμενον without overstating its severity. It preserves the Greek plural ‘hands,’ the sequence of prayer, laying on of hands, and healing, and the existing footnote anchor remains correctly placed after the illness description.
