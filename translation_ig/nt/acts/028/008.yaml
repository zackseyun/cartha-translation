- from: 'O wee ruo na nna Pọbliọs dina n’ọrịa, ahụ ọkụ na ọnyụnyụ ọbara na-enye ya nsogbu.[a] Pọl banyere n’ebe ọ nọ; mgbe o kpesịrị ekpere, o bikwasịrị ya aka ya abụọ, wee gwọọ ya.


