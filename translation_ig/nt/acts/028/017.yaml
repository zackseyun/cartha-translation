id: ACT.28.17
reference: Acts 28:17
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἐγένετο δὲ μετὰ ἡμέρας τρεῖς συγκαλέσασθαι ⸀αὐτὸν τοὺς ὄντας τῶν Ἰουδαίων πρώτους· συνελθόντων δὲ αὐτῶν ἔλεγεν πρὸς αὐτούς· ⸂Ἐγώ, ἄνδρες ἀδελφοί⸃, οὐδὲν ἐναντίον ποιήσας τῷ λαῷ ἢ τοῖς ἔθεσι τοῖς πατρῴοις δέσμιος ἐξ Ἱεροσολύμων παρεδόθην εἰς τὰς χεῖρας τῶν Ῥωμαίων,
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/017.yaml
  text: It happened that after three days he called together the leading men of the Jews[a]. And when they had come together, he said to them, “I, brothers, though I had done nothing against the people or the customs of our fathers[d][c][b], was delivered as a prisoner from Jerusalem into the hands of the Romans.”
translation:
  language: ig
  text: Mgbè ụbọchị atọ gasịrị, ọ kpọkọtara ndị isi ndị Juu[a]. Mgbe ha zukọtara, ọ sịrị ha, “Ụmụnna m[b], ọ bụ ezie na emeghị m ihe ọ bụla megide ndị mmadụ ma ọ bụ omenala ndị nna nna[c], e nyefere m dị ka onye mkpọrọ site na Jeruselem n’aka ndị Rom[d].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị ndu ndị Juu,” ma ọ bụ “ndị a ma ama n’etiti ndị Juu.”
    reason: lexical_alternative
  - marker: b
    text: “Ụmụnna m” sụgharịrị okwu Grik ἀδελφοί e ji kpọọ mmadụ okwu. N’ebe a, Pọl na-agwa ndị ikom ndị isi Juu ọ kpọkọtara okwu.
    reason: cultural_note
  - marker: c
    text: Ma ọ bụ, “omenala e ketara n’aka ndị nna nna.”
    reason: lexical_alternative
  - marker: d
    text: Ma ọ bụ, “e nyefere m ... nye ndị Rom.” N’asụsụ Grik, okwu ya n’ụzọ nkịtị bụ “e nyefere m n’aka ndị Rom.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ μετὰ ἡμέρας τρεῖς
  choice: Mgbe ụbọchị atọ gasịrị
  rationale: Ọ na-egosipụta oge na mgbanwe akụkọ ahụ n’Igbo dị ire, n’etinyeghị okwu ọhụrụ kwekọrọ na ‘ugbu a’ nke na-adịghị n’isi mmalite.
- source_word: συγκαλέσασθαι αὐτὸν
  choice: ọ kpọkọtara
  rationale: ‘Kpọkọtara’ na-egosipụta ịkpọ ọtụtụ mmadụ ka ha zukọta, ya mere ọ na-echekwa echiche nke συν-.
- source_word: τοὺς ὄντας τῶν Ἰουδαίων πρώτους
  choice: ndị isi ndị Juu
  rationale: πρώτους na-ekwu maka ndị a ma ama ma ọ bụ ndị ndu n’etiti ndị Juu, ọ bụghị ndị mbụ n’usoro oge.
- source_word: συνελθόντων δὲ αὐτῶν
  choice: Mgbe ha zukọtara
  rationale: A tụgharịrị genitive absolute ahụ ka ọ bụrụ nkebiokwu oge nke na-ada nke ọma n’Igbo.
- source_word: Ἐγώ, ἄνδρες ἀδελφοί
  choice: Ụmụnna m
  rationale: Ọ bụ ụzọ nkwanye ùgwù na nke mmekọrịta e ji agwa ndị ikom Juu nọ ebe ahụ okwu; ‘m’ na-eme ka okwu ahụ bụrụ nke Igbo dị ire ma gosi njikọ Pọl na ha.
- source_word: οὐδὲν ἐναντίον ποιήσας
  choice: ọ bụ ezie na emeghị m ihe ọ bụla megide
  rationale: 'Ọ na-echekwa ike concessive nke participle ahụ: n’agbanyeghị na Pọl emeghị ihe megidere ha, e nyefere ya.'
- source_word: τῷ λαῷ
  choice: ndị anyị
  rationale: N’ebe a λαός bụ ndị Juu; ‘ndị anyị’ na-eme ka njikọ ahụ doo anya n’Igbo ma kwekọọ n’otú Pọl si were onwe ya dịka otu n’ime ha.
- source_word: τοῖς ἔθεσι τοῖς πατρῴοις
  choice: omenala ndị nna nna anyị
  rationale: Ọ na-egosipụta omenala e ketara n’aka ndị nna ochie ma chekwaa okwu njikọ Pọl na omenala ndị Juu.
- source_word: δέσμιος
  choice: dị ka onye mkpọrọ
  rationale: Ọ na-akọwa ọnọdụ Pọl mgbe e nyefere ya, n’ebughị ụzọ kwuo kpọmkwem na agbụ dị ya n’ahụ.
- source_word: ἐξ Ἱεροσολύμων
  choice: site na Jerusalem
  rationale: Ọ na-egosipụta ebe mbufe ahụ si malite.
- source_word: παρεδόθην εἰς τὰς χεῖρας τῶν Ῥωμαίων
  choice: e nyefere m ... n’aka ndị Rom
  rationale: Ọ na-echekwa passive nke iwu na ihe oyiyi ‘n’aka’ dị n’asụsụ Grik, ma bụrụkwa okwu Igbo a na-aghọta nke ọma.
theological_decisions:
- issue: Ntụgharị ἀδελφοί n’okwu a kpọrọ ndị mmadụ kpọmkwem
  choice: Ụmụnna m
  alternative: Ụmụnna nwoke
  rationale: Ndị a Pọl kpọkọtara bụ ndị ikom ndị ndu Juu. ‘Ụmụnna m’ bụ okwu Igbo nkịtị nke na-echekwa ịdị n’otu na nkwanye ùgwù, ebe nkọwa ala peeji na-eme ka ndị ọ na-agwa doo anya.
- issue: Ike nke participle οὐδὲν ἐναντίον ποιήσας
  choice: ọ bụ ezie na emeghị m ihe ọ bụla megide
  alternative: ebe m na-emeghị ihe ọ bụla megide
  rationale: 'Nke a na-echekwa esemokwu dị n’akụkọ ahụ: n’agbanyeghị nkwupụta Pọl na o nweghị ihe ọjọọ o mere, e nyefere ya n’aka ndị Rom, na-agbakwụnyeghị nkọwa ozizi.'
translation_notes:
  register: Standard Igbo; asụsụ dị ugbu a, dị nsọpụrụ ma dị mfe nghọta. E ji ‘ndị isi ndị Juu’ na ‘omenala ndị nna nna anyị’ mee ka echiche akụkọ na mmekọrịta Pọl na ndị ọ na-agwa pụta ìhè n’enweghị ịtinye ozizi otu ụka.
