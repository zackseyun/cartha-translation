  to: Mgbè ụbọchị atọ gasịrị, ọ kpọkọtara ndị isi ndị Juu[a]. Mgbe ha zukọtara, ọ sịrị ha, “Ụmụnna m[b], ọ bụ ezie na emeghị m ihe ọ bụla megide ndị mmadụ ma ọ bụ omenala ndị nna nna[c], e nyefere m dị ka onye mkpọrọ site na Jeruselem n’aka ndị Rom[d].”
