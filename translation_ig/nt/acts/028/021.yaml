  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οἱ δὲ πρὸς αὐτὸν εἶπαν· Ἡμεῖς οὔτε γράμματα περὶ σοῦ ἐδεξάμεθα ἀπὸ τῆς Ἰουδαίας, οὔτε παραγενόμενός τις τῶν ἀδελφῶν ἀπήγγειλεν ἢ ἐλάλησέν τι περὶ σοῦ πονηρόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/021.yaml
  text: But they said to him[a], “We have received no letters from Judea about you[b], nor has any of the brothers who came reported or spoken anything evil about you.”
translation:
  language: ig
  text: Ma ha sịrị ya, “Anyị anataghị akwụkwọ ozi ọ bụla si Judia nke gbasara gị, ọ dịghịkwa onye ọ bụla n’ime ụmụnna ndị bịara kọọ ma ọ bụ kwuo ihe ọjọọ ọ bụla gbasara gị.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ δὲ ... εἶπαν
  choice: Ma ha sịrị ya
  rationale: A sụgharịrị δέ dịka “Ma” iji gosi nzaghachi na mkparịta ụka ahụ n’etinyeghị mmegide siri ike.
- source_word: γράμματα
  choice: akwụkwọ ozi
  rationale: N’ebe a, okwu ahụ pụtara ozi e dere ede, ọ bụghị Akwụkwọ Nsọ ma ọ bụ mmụta.
- source_word: οὔτε ... οὔτε
  choice: anataghị ... ọ dịghịkwa
  rationale: Usoro a na-echekwa njikọ nkwụsi ike abụọ nke Grik n’ụzọ Igbo na-ada nke ọma.
- source_word: ἀπὸ τῆς Ἰουδαίας
  choice: si Judia
  rationale: Nke a bụ nsụgharị dị mfe ma doo anya nke aha mpaghara ahụ.
- source_word: παραγενόμενός τις τῶν ἀδελφῶν
  choice: onye ọ bụla n’ime ụmụnna si ebe ahụ bịa
  rationale: “Bịa” na-egosi ọbịbịa onye ahụ; “si ebe ahụ” na-ejikọta njem ahụ na Judia dịka ọnọdụ okwu ahụ si gosi, n’agbanyeghị na okwu ahụ abụghị akụkụ doro anya nke participle n’onwe ya.
- source_word: ἀπήγγειλεν ἢ ἐλάλησέν τι
  choice: kọọ ma ọ bụ kwuo ihe ọ bụla
  rationale: A hapụrụ obere ọdịiche dị n’etiti iweta akụkọ na ikwu okwu nkịtị.
- source_word: πονηρόν
  choice: ihe ọjọọ
  rationale: Nke a na-echekwa ike na obosara okwu Grik; ọ nwere ike ịpụta ihe ọjọọ ma ọ bụ ihe na-adịghị mma e kwuru banyere Pọl.
theological_decisions:
- issue: Ihe “ụmụnna” (τῶν ἀδελφῶν) na-ezo aka na ya
  choice: A hapụrụ ya dịka “ụmụnna” n’akọwaghị na ha bụ Ndị Kraịst.
  alternative: ndị Juu ibe anyị; ụmụnna Ndị Kraịst
  rationale: Ndị na-ekwu okwu bụ ndị ndú ndị Juu nọ na Rom, ya mere okwu ahụ nwere ike izo aka n’ebe ndị Juu ibe ha si Judia nọ. Ihe odide ahụ ekwughị hoo haa na ha bụ ndị kwere ekwe na Kraịst.
translation_notes:
  register: Igbo ọkọlọtọ, nke oge a ma dị ùgwù. E ji “akwụkwọ ozi,” “kọọ,” na “ihe ọjọọ” mee ka amaokwu ahụ doo ndị nkịtị anya ma nọgide nso n’usoro na nghọta Grik.
