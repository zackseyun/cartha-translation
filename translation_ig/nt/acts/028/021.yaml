  to: Ma ha sịrị ya, “Anyị anataghị akwụkwọ ozi ọ bụla si Judia nke gbasara gị, ọ dịghịkwa onye ọ bụla n’ime ụmụnna ndị bịara kọọ ma ọ bụ kwuo ihe ọjọọ ọ bụla gbasara gị.”
  rationale: Removed “si ebe ahụ” because it assigns Judea as the brothers’ origin although the Greek only identifies them as brothers who had come. The revised construction keeps the participial sense while remaining natural in Standard Igbo. The footnote anchor remains on “ụmụnna.”
  reviewer_model: gpt-5.6-terra
