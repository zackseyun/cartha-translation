id: ACT.28.4
reference: Acts 28:4
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὡς δὲ εἶδον οἱ βάρβαροι κρεμάμενον τὸ θηρίον ἐκ τῆς χειρὸς αὐτοῦ, ⸂πρὸς ἀλλήλους ἔλεγον⸃· Πάντως φονεύς ἐστιν ὁ ἄνθρωπος οὗτος ὃν διασωθέντα ἐκ τῆς θαλάσσης ἡ δίκη ζῆν οὐκ εἴασεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/004.yaml
  text: When the islanders saw the creature hanging from his hand[a], they said to one another, “Surely this man is a murderer, whom Justice has not allowed to live[d][c][b], though he was brought safely from the sea.”
translation:
  language: ig
  text: Mgbe ndị bi n’agwaetiti ahụ[a] hụrụ anụ ahụ ka ọ kwụgidere n’aka ya, ha na-agwa ibe ha sị, “N’ezie, nwoke a bụ ogbu mmadụ. N’agbanyeghị na a zọpụtara ya n’oké osimiri, Ikpe Ziri Ezi[b] ekweghị ka ọ dị ndụ.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị obodo ahụ”; n’ụzọ nkịtị, “ndị barbara”—ya bụ, ndị obodo na-adịghị asụ Grik. Okwu Grik a abụghị ịkatọ agwa ha.
    reason: lexical_alternative
  - marker: b
    text: “Ikpe Ziri Ezi” bụ nsụgharị okwu Grik dikē. N’ebe a, o yiri ka ndị agwaetiti ahụ na-ekwu maka ikpe nkwụghachi dịka onye ma ọ bụ ike na-ata ndị ọjọọ ahụhụ; ọ pụkwara ịbụ echiche ha banyere chi nwanyị.
    reason: cultural_note
lexical_decisions:
- source_word: βάρβαροι
  choice: ndị bi n’agwaetiti ahụ
  rationale: N’ebe a okwu Grik ahụ na-ezo aka ná ndị obodo ahụ na-asụghị Grik, ọ bụghị na ọ na-akpọ ha ndị obi tara mmiri. Nsụgharị a na-egosi ndị a na-ekwu maka ha n’Igbo doro anya.
- source_word: κρεμάμενον
  choice: ka ọ kwụgidere
  rationale: Ọ na-egosi anụ ahụ ka ọ nọgidere n’aka Pọl, na-enweghị ịkọwa kpọmkwem otú o si jide ya karịa ihe Grik kwuru.
- source_word: τὸ θηρίον
  choice: anụ ahụ
  rationale: Aha Grik a bụ okwu izugbe maka anụ ma ọ bụ ihe e kere eke; ọ bụ ezie na amaokwu bu ya ụzọ kpọrọ ya agwọ ọjọọ, a hapụrụ okwu nke amaokwu a ka ọ bụrụ izugbe.
- source_word: πρὸς ἀλλήλους ἔλεγον
  choice: ha na-agwa ibe ha sị
  rationale: Ụdị ngwaa gara aga na-aga n’ihu gosiri mkparịta ụka ha na-aga n’etiti onwe ha; okwu Igbo a na-eburu echiche ahụ nke ọma.
- source_word: Πάντως
  choice: N’ezie
  rationale: Ọ na-egosi nkwenye siri ike ha nwetara site n’ihe ha hụrụ.
- source_word: φονεύς
  choice: ogbu mmadụ
  rationale: Nke a bụ okwu Igbo doro anya maka onye gburu mmadụ n’ụzọ mpụ.
- source_word: διασωθέντα
  choice: o ... pụta n’udo
  rationale: Ọ na-egosi na nwoke ahụ gafere ihe ize ndụ nke oké osimiri wee lanarị, na-enweghị itinye nkọwa nzọpụta nke okpukpe.
- source_word: ἡ δίκη
  choice: Ikpe Ziri Ezi
  rationale: E dere ya dị ka aha iji gosipụta na ndị agwaetiti ahụ mere ikpe nkwụghachi ahụ ka ọ bụrụ onye ma ọ bụ ike na-eme ihe, ma a kpọghị ya chi nwanyị kpọmkwem.
- source_word: ζῆν οὐκ εἴασεν
  choice: ekweghị ka ọ dị ndụ
  rationale: Nke a na-egosipụta n’ụzọ Igbo nkịtị na ikpe ahụ, dịka ha chere, ekweghị ka ọ nọgide na-adị ndụ.
- source_word: ἐκ τῆς θαλάσσης
  choice: si n’oké osimiri pụta
  rationale: ἐκ na-egosi isi n’ime ma ọ bụ site n’oké osimiri pụta; ya na ngwaa διασῴζω, okwu a na-egosi na ọ lanarịrị ihe ize ndụ nke oké osimiri.
theological_decisions:
- issue: Ime δίκη ka ọ bụrụ onye na-eme ihe
  choice: Ikpe Ziri Ezi
  alternative: ikpe ziri ezi; Ịbọ Ọbọ; chi nwanyị Ikpe Ziri Ezi
  rationale: Isi mkpụrụedemede ukwu na-egosi na ndị na-ekwu okwu weere ikpe nkwụghachi dịka ike ma ọ bụ onye na-eme ihe. Ọ naghị ekwu na onye dere akụkọ ahụ kwadoro nkwenkwe ha, ọ naghịkwa ekpebi na ha na-ekwu kpọmkwem banyere otu chi nwanyị.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ “ndị bi n’agwaetiti ahụ” iji zere echiche ọjọọ okwu nkịtị maka “barbarian” nwere ike iweta. Nhazi ahịrịokwu nke abụọ bụ nke Igbo sitere n’okike, ma ọ na-echekwa mgbagwoju anya banyere ma δίκη bụ ikpe e mere ka ọ bụrụ onye ma ọ bụ echiche banyere chi nwanyị.
