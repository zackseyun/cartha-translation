  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ okwu metụtara ikpe n’ụzọ ndị mmadụ nkịtị ga-aghọta, ma e chekwara na αἰτία nwere ike ịpụta ma ihe ndabere ikpe ma ebubo.
