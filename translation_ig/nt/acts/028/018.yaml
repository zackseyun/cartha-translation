  text: who[a], after examining me, wanted to release me because there was no basis for the death penalty in my case.
translation:
  language: ig
  text: Ha, mgbe ha jụsịrị m ajụjụ, chọrọ ịtọhapụ m, n’ihi na ọ dịghị ihe ndabere e ji maa m ikpe ọnwụ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’ihi na ha ahụghị ebubo ọ bụla e boro m nke kwesịrị ọnwụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἵτινες
  choice: Ndị ahụ
  rationale: Ọ na-ejikọta ndị a kpọtụrụ aha n’amaokwu bu ụzọ na ihe ha mere; ‘Ndị ahụ’ bụ ụzọ Igbo doro anya ma dị mfe isi nọchite nnọchiaha njikọ a.
- source_word: ἀνακρίναντές με
  choice: mgbe ha nyochachara okwu m
  rationale: Ọ na-egosi na nyocha ikpe ahụ mere tupu ha achọọ ịhapụ Pọl. Ịsị ‘nyochachara okwu m’ na-eme ka ọnọdụ ikpe pụta ìhè n’Igbo, n’enweghị itinye nkọwa na-adịghị na isi mmalite.
- source_word: ἐβούλοντο
  choice: chọrọ
  rationale: Ọ na-egosi ọchịchọ ma ọ bụ mkpebi ha nwere n’oge gara aga; ‘chọrọ’ bụ okwu Igbo nkịtị ma dabara n’akụkọ a.
- source_word: ἀπολῦσαι
  choice: ịhapụ m
  rationale: N’ọnọdụ ikpe, okwu a pụtara ịtọpụ onye e jidere ma ọ bụ ịhapụ ya ka ọ laa; ‘ịhapụ m’ bụ okwu dị mfe ma doo anya.
- source_word: διὰ τὸ ... ὑπάρχειν
  choice: n’ihi na ọ dịghị
  rationale: Usoro okwu Grik a na-egosi ihe kpatara ha ji chọọ ịhapụ ya; ‘n’ihi na’ na-echekwa njikọ ihe kpatara ya n’Igbo eke.
- source_word: μηδεμίαν αἰτίαν θανάτου
  choice: ọ dịghị ihe mere e ji kwesị ikpe m ọnwụ
  rationale: αἰτία n’ebe a bụ ihe ndabere ma ọ bụ ebubo iwu nke ga-eme ka e kpee mmadụ ọnwụ. Nsụgharị a na-enye echiche ikpe ahụ n’Igbo doro anya ma na-ezere nghọta nke ‘ọnwụ’ dị ka ọnwụ nkịtị naanị.
- source_word: ἐν ἐμοί
  choice: e ji kwesị ikpe m
  rationale: N’ọnọdụ ikpe a, ‘n’ime m’ pụtara ihe a hụrụ n’okwu Pọl ma ọ bụ megide ya. E tinyere echiche ahụ n’usoro Igbo eke kama ịsụgharị ya n’ụzọ osisi.
