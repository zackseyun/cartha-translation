  to: N’ógbè gbara ebe ahụ gburugburu, e nwere ala ndị bụ nke onyeisi agwaetiti ahụ[a][b], onye aha ya bụ Pọbliọs. Ọ nabatara anyị ma jiri obiọma lee anyị ọbịa ụbọchị atọ.[c]
