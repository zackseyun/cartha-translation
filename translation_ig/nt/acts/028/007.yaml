  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἐν δὲ τοῖς περὶ τὸν τόπον ἐκεῖνον ὑπῆρχεν χωρία τῷ πρώτῳ τῆς νήσου ὀνόματι Ποπλίῳ, ὃς ἀναδεξάμενος ἡμᾶς ⸂τρεῖς ἡμέρας⸃ φιλοφρόνως ἐξένισεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/007.yaml
  text: In the area around that place there were lands belonging to the chief man of the island[a], named Publius[c][b], who welcomed us and hosted us courteously for three days.
translation:
  language: ig
  text: N’ógbè gbara ebe ahụ gburugburu, e nwere ala ndị bụ nke onyeisi agwaetiti ahụ[a][b], onye aha ya bụ Pọbliọs. Ọ nabatara anyị ma jiri obiọma lee anyị ọbịa ụbọchị atọ.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị “ala ndị o nwere.” Okwu Grik χωρία na-ezo aka n’ala ma ọ bụ ihe onwunwe ala dị n’ógbè ahụ.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “onye nọ n’ọkwa mbụ n’agwaetiti ahụ.” Okwu Grik τῷ πρώτῳ τῆς νήσου yiri ka ọ na-egosi onye ndu ma ọ bụ onye nọ n’ọkwa kachasị elu n’agwaetiti ahụ.
    reason: alternative_reading
  - marker: c
    text: Ma ọ bụ, “Ọ nabatara anyị ma jiri obiọma lekọta anyị dị ka ndị ọbịa ụbọchị atọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν δὲ τοῖς περὶ τὸν τόπον ἐκεῖνον
  choice: N’ógbè gbara ebe ahụ gburugburu
  rationale: Nke a na-egosipụta ógbè dị n’akụkụ ebe ahụ n’Igbo doro anya. A naghị atụgharị δέ ka ọ bụrụ okwu oge, ebe ọ bụ naanị njikọ akụkọ dị nro n’ebe a.
- source_word: ὑπῆρχεν χωρία
  choice: e nwere ala ndị
  rationale: “Ala ndị” na-echekwa echiche nke ihe onwunwe ala dị n’ụbara, na-enweghị ikwu kpọmkwem ma ha bụ ubi, obodo nta, ma ọ bụ nnukwu ala mmadụ nwere.
- source_word: τῷ πρώτῳ τῆς νήσου
  choice: onyeisi agwaetiti ahụ
  rationale: πρῶτος n’ebe a na-egosi onye nọ n’ọkwa kachasị elu ma ọ bụ onye ndu. “Onyeisi” bụ okwu Igbo dị mfe ma kwanyere ugwu, n’enweghị ịmanye aha otu ọkwa ọchịchị a na-amaghị kpọmkwem.
- source_word: ὀνόματι Ποπλίῳ
  choice: onye aha ya bụ Pọbliọs
  rationale: Nke a bụ ụzọ Igbo nkịtị si webata aha mmadụ; “Pọbliọs” na-asụgharị ụda aha Πόπλιος n’usoro mkpụrụokwu Igbo.
- source_word: ἀναδεξάμενος ἡμᾶς
  choice: Ọ nabatara anyị
  rationale: Okwu a na-egosi na Pọbliọs ji obi nnabata were ha dịka ndị ọbịa.
- source_word: τρεῖς ἡμέρας
  choice: ruo ụbọchị atọ
  rationale: Nke a na-egosipụta ogologo oge ha nọrọ n’ile ọbịa ahụ n’Igbo ebumpụta ụwa.
- source_word: φιλοφρόνως ἐξένισεν
  choice: jirikwa obiọma lekọta anyị dị ka ndị ọbịa
  rationale: Nke a na-ejikọta omume ile ọbịa nke ξενίζω na omume ọma na enyi nke φιλοφρόνως, n’enweghị ime ka ọ pụta naanị inye ebe ihi ụra.
theological_decisions:
- issue: Ma τῷ πρώτῳ τῆς νήσου bụ aha ọkwa ọchịchị kpọmkwem ka ọ bụ naanị nkọwa onye kacha pụta ìhè
  choice: onyeisi agwaetiti ahụ
  alternative: onye nọ n’ọkwa mbụ n’agwaetiti ahụ
  rationale: Nsụgharị isi na-egosi ịbụ onye ndu ma ghara ịkpọ ya aha ọkwa ọchịchị a na-ejighị n’aka. Ihe odide ala peeji na-echekwa ụzọ ọzọ e si ghọta okwu Grik ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke doro anya ma kwanyere ugwu, dee ya. Ahịrịokwu abụọ na-eme ka ogologo usoro Grik ahụ dị mfe nghọta, ma na-echekwa njikọ echiche ya. E zere okwu ọchịchị teknụzụ a na-apụghị igosi n’ụzọ doro anya site n’ihe odide Grik.
