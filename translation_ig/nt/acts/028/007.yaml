  naturalness: The wording is generally clear Standard Igbo. "jiri obiọma lee anyị ọbịa ụbọchị atọ" is more idiomatic and more directly expresses φιλοφρόνως ἐξένισεν than "jirikwa obiọma lekọta anyị dị ka ndị ọbịa ruo ụbọchị atọ."
  terminology: '"onyeisi agwaetiti ahụ" suitably renders the nontechnical, potentially titular πρῶτος without asserting a specific governmental office. "Pọbliọs" is an acceptable Igbo-form rendering of Ποπλίῳ.'
