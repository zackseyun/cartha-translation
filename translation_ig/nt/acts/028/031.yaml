    text: 'Ma ọ bụ: “Kraịst.” Okwu Grik Χριστός nwere ike ịrụ ọrụ dịka aha ọkwa, “Mesaya,” ma ọ bụ, n’ọnọdụ ụfọdụ, dịka aha a na-akpọ mmadụ, “Kraịst.”'
    reason: alternative_reading
