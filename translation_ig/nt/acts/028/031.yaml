id: ACT.28.31
reference: Acts 28:31
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: κηρύσσων τὴν βασιλείαν τοῦ θεοῦ καὶ διδάσκων τὰ περὶ τοῦ κυρίου Ἰησοῦ Χριστοῦ μετὰ πάσης παρρησίας ἀκωλύτως.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/031.yaml
  text: proclaiming the kingdom of God and teaching the things concerning the Lord Jesus the Messiah with all boldness[a], unhindered.
translation:
  language: ig
  text: na-ekwusa alaeze Chineke ma na-akụzi ihe banyere Onyenwe anyị Jizọs, bụ Mesaya ahụ[a], n’atụghị egwu ọ bụla, n’enweghị ihe mgbochi ọ bụla.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ: “Kraịst.” Okwu Grik Χριστός nwere ike ịrụ ọrụ dịka aha ọkwa, “Mesaya,” ma ọ bụ, n’ọnọdụ ụfọdụ, dịka aha a na-akpọ mmadụ, “Kraịst.”'
    reason: alternative_reading
lexical_decisions:
- source_word: κηρύσσων
  choice: na-ekwusa
  rationale: Na-egosi nkwusa a na-eme n’ihu ọha ma na-aga n’ihu, n’emeghị ka ọ bụrụ naanị ikwusa okwuchukwu n’usoro ofufe.
- source_word: βασιλείαν τοῦ θεοῦ
  choice: alaeze Chineke
  rationale: Nke a bụ okwu Igbo a na-ejikarị eme ihe, ma ọ ka na-eburu echiche banyere ọchịchị Chineke na mpaghara ọ na-achị.
- source_word: διδάσκων
  choice: na-akụzikwa
  rationale: Ọ na-egosi ọrụ ịkụzi nke na-aga n’ihu, e jikọtara ya na ọrụ ikwusa.
- source_word: τὰ περὶ
  choice: ihe ndị metụtara
  rationale: Ọ bụ ụzọ Igbo doro anya ma dịkwa eke isi gosipụta ihe niile gbasara onye ahụ, n’akọwaghị ya karịa ihe Grik kwuru.
- source_word: κυρίου
  choice: Onyenwe anyị
  rationale: Ọ bụ aha nsọpụrụ Kraịst a maara nke ọma n’Igbo, dabara adaba karịa okwu pụrụ ịpụta naanị ‘nna ukwu.’
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jizọs, bú Mesaya
  rationale: A sụgharịrị Χριστός dị ka aha ọkwa ‘Mesaya,’ ebe ‘bú’ na-eme ka usoro okwu ahụ bụrụ Igbo eke ma doo anya na ọ bụ Jizọs bụ Mesaya ahụ.
- source_word: μετὰ πάσης παρρησίας
  choice: n’atụghị egwu ọ bụla
  rationale: N’ọnọdụ a, παρρησία na-egosi nkwuwa okwu n’ihu ọha n’atụghị egwu; nsụgharị a bụ nke onye Igbo nkịtị ga-aghọta ngwa ngwa.
- source_word: ἀκωλύτως
  choice: n’enweghị onye na-egbochi ya
  rationale: 'Ọ na-echekwa ike nke okwu ikpeazụ nke akwụkwọ ahụ: ọ dịghị onye na-egbochi ọrụ nkwusa na nkuzi Pọl.'
theological_decisions:
- issue: Otu e si sụgharịa Χριστός n’usoro aha nsọpụrụ Kraịst
  choice: Mesaya
  alternative: Kraịst
  rationale: N’ebe a, Χριστός ka nwere ike ịrụ ọrụ dị ka aha ọkwa nke pụtara Onye E Tere Mmanụ. E debere ‘Kraịst’ n’ala ala peeji n’ihi na n’ụfọdụ ọnọdụ okwu Grik ahụ na-adị ka aha nke mmadụ.
translation_notes:
  register: Igbo ọkọlọtọ, nke oge a, dị ugwu ma dị mfe nghọta. E ji ‘na-ekwusa … na-akụzikwa’ chekwaa participle abụọ na-aga n’ihu. Akara [a] dị n’ahịrị isi ma na-edekọ ma ọdịiche ‘Mesaya/Kraịst’ ma ndò okwu παρρησία.
