  text: ἀξιοῦμεν δὲ παρὰ σοῦ ἀκοῦσαι ἃ φρονεῖς, περὶ μὲν γὰρ τῆς αἱρέσεως ταύτης γνωστὸν ⸂ἡμῖν ἐστιν⸃ ὅτι πανταχοῦ ἀντιλέγεται.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/022.yaml
  text: But we consider it proper to hear from you what you think[a], for concerning this sect it is known to us that it is spoken against everywhere.
translation:
  language: ig
  text: Ma anyị chere na o kwesịrị ekwesị ka anyị nụ n’aka gị ihe echiche gị bụ; n’ihi na, banyere òtù a[a], anyị maara na a na-ekwu megide ya n’ebe niile.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “otu” ma ọ bụ “mmegharị”; okwu Grik bụ αἵρεσις apụtaghịghị “ozizi ụgha” n’echiche teknịkal e nyere ya n’oge e mesịrị.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀξιοῦμεν
  choice: anyị chere na o kwesịrị ekwesị
  rationale: Nke a na-egosi na ndị na-ekwu okwu ahụ lere ịnụ Pọl anya dị ka ihe kwesịrị ekwesị, ma na-edobekwa ụda nkwanye ùgwù nke okwu Grik ahụ.
- source_word: παρὰ σοῦ ἀκοῦσαι
  choice: ka anyị nụ n’ọnụ gị
  rationale: “Nụ n’ọnụ gị” bụ ụzọ Igbo dị mfe e si gosi na ha chọrọ ịnụ echiche ahụ site n’aka Pọl n’onwe ya.
- source_word: ἃ φρονεῖς
  choice: ihe i chere
  rationale: Ọ na-egosi echiche ma ọ bụ echiche mmadụ nwere n’ụzọ doro anya ma bụrụkwa Igbo a na-asụ ugbu a.
- source_word: αἱρέσεως
  choice: òtù
  rationale: N’ebe a, okwu ahụ na-ezo aka n’otu ndị okpukpe ma ọ bụ mmegharị, ọ bụghị n’ozizi ụgha n’echiche teknịkal nke oge ndị sochirinụ.
- source_word: γνωστὸν ἡμῖν ἐστιν
  choice: anyị maara
  rationale: Nke a bụ ụzọ Igbo sitere n’okike e si kwuo na ihe ahụ bụ nke ha maara, na-enweghị ịgbanwe ihe okwu Grik pụtara.
- source_word: πανταχοῦ
  choice: n’ebe niile
  rationale: Ọ na-ebute kpọmkwem echiche gbasara ebe niile.
- source_word: ἀντιλέγεται
  choice: a na-ekwu okwu megide ya
  rationale: Ụdị a na-edobe olu nnara nke Grik ma gosipụta na ndị mmadụ na-ekwu okwu megide òtù ahụ, ọ bụghị naanị na ha anaghị akwado ya.
theological_decisions:
- issue: Nsụgharị αἵρεσις
  choice: òtù
  alternative: ozizi ụgha
  rationale: Ndị na-ekwu okwu ahụ ji okwu a kọwaa mmegharị Ndị Kraịst dị ka otu a maara ama. Ịsụgharị ya “ozizi ụgha” ga-ebubata echiche teknịkal nke malitere ike n’oge e mesịrị, nke ihe gbara amaokwu a gburugburu anaghị akwado.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ugwu ma dịkwa mfe nghọta. “Nụ n’ọnụ gị” na-eme ka isi iyi kpọmkwem pụta ìhè, ebe “òtù” na-ezere ịmanye echiche ụka nke oge e mesịrị n’ime ederede ahụ.
