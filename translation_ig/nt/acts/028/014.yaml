  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οὗ εὑρόντες ἀδελφοὺς παρεκλήθημεν ⸀παρ’ αὐτοῖς ἐπιμεῖναι ἡμέρας ἑπτά· καὶ οὕτως εἰς τὴν Ῥώμην ἤλθαμεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/014.yaml
  text: There we found brothers, and we were invited to stay with them seven days. And so we came to Rome.
translation:
  language: ig
  text: N’ebe ahụ, anyị hụrụ ụmụnna[a], a rịọkwara anyị ka anyị na ha nọrọ ụbọchị asaa. N’ụzọ dị otu a ka anyị siri rute Rom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ụmụnna nwoke na ndị nwanyị.” Okwu Grik ahụ bụ “ụmụnna nwoke,” ma n’ebe a o yikarịrị ka ọ na-ezo aka n’ụmụnna ndị kwere ekwe n’ozuzu.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗ
  choice: N’ebe ahụ
  rationale: Ọ bụ okwu na-egosi ebe, na-atụ aka n’ebe a kpọtụrụ aha tupu ya, ya bụ Puteoli; nke a bụ ụzọ Igbo si ekwu ya nke ọma.
- source_word: εὑρόντες
  choice: anyị hụrụ
  rationale: A gbanwere participle a ka ọ bụrụ ngwaa zuru ezu n’Igbo, ma usoro ihe ndị mere ka dị otu ahụ.
- source_word: ἀδελφοὺς
  choice: ụmụnna
  rationale: N’ebe a, okwu ahụ na-ezo aka n’ụmụnna ndị kwere ekwe. “Ụmụnna” na-edobe ihe okwu Grik pụtara ma na-ada nke ọma n’Igbo.
- source_word: παρεκλήθημεν
  choice: a rịọkwara anyị
  rationale: Passive nke παρακαλέω n’ọnọdụ nnabata a pụtara na ndị nọ ebe ahụ rịọrọ ha ka ha nọrọ; usoro a na-edobe passive ahụ n’Igbo.
- source_word: παρ’ αὐτοῖς
  choice: na ha
  rationale: Ọ na-egosi ịnọ n’ụlọ ma ọ bụ n’etiti ha; “na ha” bụ okwu Igbo dị mfe ma kwekọọ n’ọnọdụ ahụ.
- source_word: ἐπιμεῖναι
  choice: ka anyị ... nọrọ
  rationale: N’akụkọ njem na nnabata, ngwaa a pụtara ịnọgide n’ebe ahụ ruo oge ụfọdụ.
- source_word: ἡμέρας ἑπτά
  choice: ụbọchị asaa
  rationale: Ọ bụ accusative nke na-egosi ogologo oge; n’Igbo, “ụbọchị asaa” na-egosi oge ahụ nke ọma.
- source_word: καὶ οὕτως
  choice: Ọ bụkwa otu a ka
  rationale: Nke a na-edobe echiche nke ‘n’ụzọ dị otu a’ ma na-eme ka njikọ akụkọ ahụ bụrụ nke e ji asụsụ Igbo nkịtị dee.
- source_word: εἰς τὴν Ῥώμην ἤλθαμεν
  choice: anyị si bịarute Rom
  rationale: ἔρχομαι tinyere εἰς na-egosi iru ebe a na-aga; “bịarute Rom” na-egosipụta nke ahụ kpọmkwem.
theological_decisions:
- issue: Onye ἀδελφοὺς na-ezo aka na ya
  choice: ụmụnna ndị kwere ekwe n’obodo ahụ
  alternative: ụmụnne nwoke n’anụ ahụ, ma ọ bụ ndị Juu ibe ha n’ozuzu
  rationale: N’Ọrụ Ndị Ozi, n’ụdị akụkọ njem a, “ụmụnna” na-ezokarị aka n’ebe ndị Kraịst ibe ha nọ. Arịrịọ ka ha nọrọ na nnabata ha na-akwado nghọta a, ma ihe odide bụ isi anaghị agbakwụnye nkọwa karịrị okwu ahụ.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E ji “a rịọkwara anyị” debe olu passive, e jikwa “ụmụnna” hapụ obosara ihe okwu ahụ nwere n’ọnọdụ Ndị Kraịst.
