  to: N’ebe ahụ, anyị hụrụ ụmụnna[a], a rịọkwara anyị ka anyị na ha nọrọ ụbọchị asaa. N’ụzọ dị otu a ka anyị siri rute Rom.
  rationale: The text is revised only for a more natural and source-close rendering of καὶ οὕτως and to correct the Igbo footnote’s referential wording. No theological interpretation is added; “ụmụnna” remains in the main text, while the note presents the contextual inclusive sense as an alternative.
