review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders the imperatives, collective addressee, emphatic negations, and the contrast between hearing/understanding and seeing/perceiving. However, “ilekwa anya ... ga-ele anya” shifts βλέπω toward intentional looking rather than the source’s repeated seeing-language. The final “ahụta” is less direct and less natural here than “ahụ,” while the contextual contrast can remain unexplicated in the text.
  naturalness: “Gaa n’ebe ndị a nọ” is more idiomatic Standard Igbo for movement toward a group than “Gakwuru ndị a.” “N’ịnụ” and “n’ịhụ anya” retain the marked prophetic repetition in a readable formal register.
  terminology: “aghọta” suitably renders συνῆτε. “ahụ” preserves the lexical seeing motif of ἴδητε without prematurely resolving whether the failure is physical sight or inward perception. No doctrinally loaded wording is introduced.
  issues:
  - severity: medium
    issue: The rendering “ilekwa anya, unu ga-ele anya n’ezie” uses an idiom for looking rather than seeing.
    rationale: βλέποντες βλέψετε repeats the verb-family for seeing. In this prophetic contrast, “ile anya” can imply deliberate observation and weakens the close lexical correspondence with the final verb.
  - severity: low
    issue: “Gakwuru ndị a” is somewhat compressed for the directional imperative.
    rationale: “Gaa n’ebe ndị a nọ” is more natural Standard Igbo while clearly retaining the command to go to the people.
  - severity: low
    issue: “ahụta” is not the clearest idiomatic form for the final seeing verb in this construction.
    rationale: “Agaghị ahụ ma ọlị” is direct, natural, and preserves the source’s sight-language and its contextual ambiguity.
