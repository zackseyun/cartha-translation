  text: ⸀λέγων· Πορεύθητι πρὸς τὸν λαὸν τοῦτον καὶ εἰπόν· Ἀκοῇ ἀκούσετε καὶ οὐ μὴ συνῆτε, καὶ βλέποντες βλέψετε καὶ οὐ μὴ ἴδητε·
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/026.yaml
  text: 'saying[a], ‘Go to this people and say: You will indeed hear, but you will never understand; and seeing, you will indeed see[b], but you will never perceive.’'
translation:
  language: ig
  text: 'na-asị[a], “Gaa n’ebe ndị a nọ, sị ha: ‘N’ịnụ, unu ga-anụ n’ezie, ma unu agaghị aghọta ma ọlị; n’ịhụ anya, unu ga-ahụ n’ezie[b], ma unu agaghị ahụ ma ọlị.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’asụsụ Grik, okwu a bụ participle nke pụtara “na-asị,” nke jikọtara ya na ihe e kwuru n’amaokwu bu nke a ụzọ.
    reason: grammatical_linkage
  - marker: b
    text: N’ụzọ nkịtị, “n’ịhụ anya, unu ga-ahụ n’ezie, ma unu agaghị ahụ ma ọlị.” Okwu Grik na-ekwughachi okwu banyere ịhụ anya; n’ebe a, ngwaa ikpeazụ nwekwara ike ịpụta ịghọta ihe a hụrụ.
    reason: alternative_reading
lexical_decisions:
- source_word: λέγων
  choice: na-asị
  rationale: Ọ bụ participle nke oge dị ugbu a nke na-ejikọta okwu a na nkebi bu ya ụzọ; ‘na-asị’ na-edobe njikọ ahụ n’ụzọ e ji asụ Igbo nke ọma.
- source_word: Πορεύθητι πρὸς τὸν λαὸν τοῦτον
  choice: Gakwuru ndị a
  rationale: Imperative a na-enye iwu ịga bịakwute otu ndị ahụ. ‘Ndị a’ bụ ụzọ Igbo nkịtị si akọwa λαὸν τοῦτον dịka otu ìgwè mmadụ, na-enweghị okwu siri ike dịka ‘agbụrụ’.
- source_word: καὶ εἰπόν
  choice: sị ha
  rationale: ‘Sị ha’ bụ ụzọ doro anya ma dị ndụ n’Igbo isi webata ihe a gwara onye ahụ ka o kwuo.
- source_word: Ἀκοῇ ἀκούσετε
  choice: Ịnụ, unu ga-anụ n’ezie
  rationale: Nkwughachi aha na ngwaa sitere n’otu mgbọrọgwụ bụ usoro Hibru e chekwara na Grik iji mesie okwu ike; nkwughachi Igbo a na-edobe ọdịdị amụma ahụ ma ‘n’ezie’ na-eme ka ike ya doo anya.
- source_word: οὐ μὴ συνῆτε
  choice: unu agaghị aghọta ma ọlị
  rationale: οὐ μή na subjunctive bụ ngọnarị siri ike; ‘agaghị ... ma ọlị’ na-ebupụta ike ahụ n’Igbo.
- source_word: βλέποντες βλέψετε
  choice: ilekwa anya, unu ga-ele anya n’ezie
  rationale: A na-edobe nkwughachi okwu ịhụ anya na myirịta ya na nkebi banyere ịnụ; ‘-kwa’ na-ejikọta akụkụ abụọ ahụ.
- source_word: οὐ μὴ ἴδητε
  choice: unu agaghị ahụta ma ọlị
  rationale: ‘Ịhụta’ pụrụ ịpụta ịhụ ihe n’anya ma ọ bụ ịghọta ihe a hụrụ, ya mere ọ na-echekwa mgbagwoju anya dị na ἴδητε karịa ịkọwa ya naanị dịka nghọta ime mmụọ.
theological_decisions:
- issue: Okwu amụma Aịzaya na-eji ịnụ na ịhụ anya akọwa enweghị nghọta dị n’ime
  choice: Jiri ‘aghọta’ maka συνῆτε, ma jiri ‘ahụta’ maka ἴδητε.
  alternative: Jiri ‘ghọta’ ma ọ bụ ‘mata’ n’ahịrị ikpeazụ kwa.
  rationale: ‘Aghọta’ na-egosi ihe συνίημι pụtara nke ọma. N’ahịrị ikpeazụ, ‘ahụta’ na-edobe asụsụ nke ịhụ anya nakwa ohere nke nghọta dị n’ime, na-enweghị idozi esemokwu ahụ kpamkpam.
translation_notes:
  register: Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E ji ‘unu’ mee ka o doo anya na adreesị ahụ bụ ọtụtụ mmadụ. E chekwara nkwughachi amụma nke Grik, ma zere okwu ụka pụrụ iche.
