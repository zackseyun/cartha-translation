  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀντιλεγόντων δὲ τῶν Ἰουδαίων ἠναγκάσθην ἐπικαλέσασθαι Καίσαρα, οὐχ ὡς τοῦ ἔθνους μου ἔχων τι ⸀κατηγορεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/019.yaml
  text: But because the Jews objected[b][a], I was compelled to appeal to Caesar—not because I had anything to accuse my nation of.
translation:
  language: ig
  text: Ma n’ihi na ndị Juu megidere m[a][b], a manyere m ịrịọ Siza—ọ bụghị n’ihi na enwere m ihe ọ bụla m ga-eji bo mba m ebubo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “mgbe ndị Juu na-emegide m,” ma ọ bụ, “n’ihi na ndị Juu na-agọnahụ okwu m.”
    reason: lexical_alternative
  - marker: b
    text: “Ndị Juu” n’ebe a na-ezo aka ná ndị Juu na-emegide Pọl n’okwu ikpe a, ọ bụghị ndị Juu niile n’ozuzu ha.
    reason: cultural_note
lexical_decisions:
- source_word: ἀντιλεγόντων
  choice: mgbe ndị Juu jụrụ ya
  rationale: Nke a na-egosi mmegide ndị Juu megide ihe Pọl kwuru ma ọ bụ mkpebi metụtara ya; ‘jụrụ ya’ bụ Igbo dị mfe ma dabara n’ọnọdụ ikpe, ebe nkọwa ala peeji na-echekwa ụzọ ndị ọzọ e si aghọta participle a.
- source_word: δὲ
  choice: Ma
  rationale: Ọ na-egosi obere ntụgharị ma ọ bụ ọdịiche n’ihe Pọl na-akọ.
- source_word: τῶν Ἰουδαίων
  choice: ndị Juu
  rationale: Nke a na-asụgharị okwu Grik ahụ kpọmkwem n’enweghị ịgbakwụnye na ọ bụ naanị ndị ndú; ihe gbara amaokwu ahụ gburugburu na-egosi na ọ bụ ndị Juu na-emegide Pọl n’okwu ikpe a.
- source_word: ἠναγκάσθην
  choice: a manyere m
  rationale: Ụdị passive ahụ na-egosi na ọnọdụ mere ka Pọl ghara inwe nhọrọ ọzọ.
- source_word: ἐπικαλέσασθαι Καίσαρα
  choice: ịrịọ Siza ka o kpee okwu m
  rationale: Nke a na-ekwupụta arịrịọ ikpe ebugara eze ukwu n’Igbo doro anya, ma na-edowe aha-ọrụ ‘Siza’ dị na Grik.
- source_word: οὐχ ὡς
  choice: ọ bụghị n’ihi na
  rationale: Ọ na-eme ka nkọwa Pọl banyere ihe kpaliri ya doo anya, n’Igbo nkịtị.
- source_word: τοῦ ἔθνους μου
  choice: mba m
  rationale: Ọ na-echekwa echiche nke ndị Pọl dị ka otu mba ma ọ bụ agbụrụ, kama ime ya naanị ‘ndị m.’
- source_word: ἔχων τι κατηγορεῖν
  choice: enwere m ihe ọ bụla m ga-eji bo ... ebubo
  rationale: Nke a na-echekwa echiche iwu nke inwe ihe ndabere a ga-eji bo onye ebubo.
theological_decisions:
- issue: Ihe ‘ndị Juu’ na-ezo aka na ya n’okwu nwere ike imetụta agbụrụ na okpukpe
  choice: E debere ‘ndị Juu’ n’ahịrị isi dịka nsụgharị τῶν Ἰουδαίων.
  alternative: ndị ndú Juu; ndị Judia
  rationale: Grik ahụ ekwughị kpọmkwem ‘ndị ndú.’ N’ọnọdụ a, okwu ahụ na-ezo aka n’ebe ndị Juu na-emegide Pọl n’okwu ikpe nọ, ọ bụghị n’ebe ndị Juu niile nọ; e mere ka nke a doo anya n’ala peeji kama ịgbanwe ahịrị isi.
translation_notes:
  register: Igbo ọkọlọtọ, nke oge a ma dị ùgwù. A họọrọ okwu ikpe ndị mmadụ ga-aghọta nke ọma; e zere okwu ụka pụrụ iche na nkọwa karịrị ihe Grik kwuru.
