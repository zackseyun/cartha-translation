    reason: lexical_alternative
  - marker: b
    text: “Ndị Juu” n’ebe a na-ezo aka ná ndị Juu na-emegide Pọl n’okwu ikpe a, ọ bụghị ndị Juu niile n’ozuzu ha.
    reason: cultural_note
  revision_rationale: The causal reading is made explicit with “n’ihi na,” and “megidere m” supplies the contextual object of the Jews’ opposition without changing or narrowing the Greek referent. The appeal is rendered simply as “ịrịọ Siza,” avoiding the added assertion that Caesar would hear the case. Both original footnote anchors are retained and the lexical alternative is corrected to refer to Paul rather than to an undefined pronoun.
