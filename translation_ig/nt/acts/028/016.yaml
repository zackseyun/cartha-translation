  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ὅτε δὲ ⸀εἰσήλθομεν εἰς Ῥώμην, ⸂ἐπετράπη τῷ Παύλῳ⸃ μένειν καθ’ ἑαυτὸν σὺν τῷ φυλάσσοντι αὐτὸν στρατιώτῃ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/016.yaml
  text: When we entered Rome[a], Paul was permitted to stay by himself with the soldier guarding him.
translation:
  language: ig
  text: Mgbe anyị banyere Rom, e kwere ka Pọl nọrọ iche, ya na onye agha ahụ na-eche ya nche.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “E kwere ka Pọl biri naanị ya, ya na otu onye agha na-eche ya nche.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅτε δὲ
  choice: Mgbe
  rationale: Ὅτε na-egosi oge ihe mere; δὲ bụ njikọ dị nro nke na-adịghị mkpa ka a sụgharịa ya iche n’Igbo ebe a.
- source_word: εἰσήλθομεν εἰς Ῥώμην
  choice: anyị banyere Rom
  rationale: Nke a na-edobe echiche mmegharị dị na εἰσέρχομαι na εἰς, ma bụrụkwa okwu Igbo doro anya ma dị mfe.
- source_word: ἐπετράπη τῷ Παύλῳ
  choice: e kwere ka Pọl
  rationale: Ụdị a na-egosi na e nyere Pọl ikike, ma na-ada nke ọma n’Igbo karịa ịgbaso usoro passive Grik n’ụzọ siri ike.
- source_word: μένειν
  choice: nọrọ
  rationale: N’ọnọdụ a, μένειν pụtara ịnọgide ma ọ bụ ibi n’otu ebe; “nọrọ” na-ejide echiche ahụ n’enweghị ịkọwa ya gabiga ihe ederede kwuru.
- source_word: καθ’ ἑαυτόν
  choice: nọrọ iche
  rationale: “Nọrọ iche” na-egosi na Pọl nọ n’ebe dị iche n’ebe ndị mkpọrọ ndị ọzọ nọ, ma ọ naghị ekwu na ọ dịghị onye ọzọ ya na ya nọ, ebe onye agha nọ na-eche ya nche.
- source_word: σὺν τῷ φυλάσσοντι αὐτὸν στρατιώτῃ
  choice: ya na onye agha ahụ na-eche ya nche
  rationale: σύν na-egosi onye ya na ya nọ; participle φυλάσσοντι na-akọwa ọrụ onye agha ahụ. “Onye agha ahụ” na-egosipụta article Grik nke na-atụ aka n’aka onye nche a họpụtara.
theological_decisions: []
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. “Nọrọ iche” na-ezere nghọtahie nke “naanị ya” pụrụ iweta, ebe amaokwu ahụ kwuru ozugbo na onye agha nọnyere ya; ihe odide ala peeji na-edobe ụzọ ọzọ e nwere ike isi ghọta μένειν καθ’ ἑαυτόν.
