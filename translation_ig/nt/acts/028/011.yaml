  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Μετὰ δὲ τρεῖς μῆνας ⸀ἀνήχθημεν ἐν πλοίῳ παρακεχειμακότι ἐν τῇ νήσῳ Ἀλεξανδρίνῳ, παρασήμῳ Διοσκούροις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/011.yaml
  text: After three months we set sail in an Alexandrian ship that had wintered on the island[a], with the Dioscuri as its figurehead.
translation:
  language: ig
  text: Mgbe ọnwa atọ gachara, anyị ji otu ụgbọ mmiri si Aleksandria pụọ n’ụsọ mmiri. Ụgbọ ahụ nọrọ oge oyi n’agwaetiti ahụ, ihe nnọchianya ya bụ Chi Ejima[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ya bụ, Castor na Pollux, ụmụ ejima Zeus n’akụkọ chi ndị Gris na ndị Rom.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δὲ τρεῖς μῆνας
  choice: Mgbe ọnwa atọ gachara
  rationale: μετά na nrụaka oge pụtara mgbe oge a kpọrọ aha gafesịrị; δέ bụ njikọ dị nro nke a na-adịghị mkpa ịsụgharị iche n'Igbo.
- source_word: ἀνήχθημεν
  choice: anyị ... pụọ n’ụsọ mmiri
  rationale: N'okwu njem ụgbọ mmiri, ἀνάγω pụtara ịhapụ ụsọ mmiri gawa n'oké osimiri; okwu a bụ Igbo doro anya ma kwekọọ n'ọnọdụ ahụ.
- source_word: ἐν πλοίῳ ... Ἀλεξανδρίνῳ
  choice: anyị ji otu ụgbọ mmiri si Aleksandria
  rationale: πλοῖον bụ ụgbọ mmiri, ebe Ἀλεξανδρίνῳ na-egosi ebe ụgbọ ahụ si ma ọ bụ njikọ ya na Aleksandria. 'Ji ... ụgbọ mmiri' bụ usoro Igbo ebumpụta ụwa maka ụzọ e si mee njem.
- source_word: παρακεχειμακότι ἐν τῇ νήσῳ
  choice: Ụgbọ ahụ nọrọ oge oyi n’agwaetiti ahụ
  rationale: Perfect participle παρακεχειμακότι na-egosi na ụgbọ ahụ anọọla n'ebe ahụ ruo oge oyi; nkebi ahịrịokwu a na-egosipụta nke ahụ n'Igbo doro anya.
- source_word: παρασήμῳ
  choice: ihe nnọchianya ya bụ
  rationale: παράσημος nwere ike ịbụ akara pụrụ iche, emblem, ma ọ bụ ihe oyiyi dị n'ụgbọ. Nsụgharị a anaghị ekpebi n'ụzọ na-enweghị isi na ọ bụ kpọmkwem ihe oyiyi dị n'ọnụ ụgbọ.
- source_word: Διοσκούροις
  choice: Chi Ejima
  rationale: Aha Grik a na-ezo aka n'ejima Castor na Pollux ndị a na-ewere dị ka chi. 'Chi Ejima' na-eme ka onye Igbo ghọta ọdịdị akara ahụ, ebe nkọwa ala peeji na-edobe aha ndị ahụ.
theological_decisions:
- issue: Otu e si asụgharị akara okpukpe ndị ọgọ mmụọ, Διοσκούροις
  choice: Chi Ejima
  alternative: Ndị Dioscuri; Castor na Pollux
  rationale: Akụkọ ahụ na-akọ naanị akara e tinyere n'ụgbọ, ọ naghị akwado ofufe ahụ. 'Chi Ejima' na-egosipụta ihe okwu Grik na-ezo aka na ya, ebe nkọwa ala peeji na-enye aha omenala ha.
translation_notes:
  register: Ejiri Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. E kewara ahịrịokwu ahụ ụzọ abụọ iji gbochie mgbagwoju anya ma mee ka njikọ participle Grik pụta nke ọma; e debere ntụpọ nkọwa [a] ozugbo n'akụkụ 'Chi Ejima'.
