  yaml_path: translation/nt/acts/028/030.yaml
  text: And he stayed for two whole years in his own rented lodging[a], and he welcomed all who came in to him[b],
translation:
  language: ig
  text: Ọ nọrọ afọ abụọ zuru ezu n’ụlọ mgbazinye nke ya[a], na-anabatakwa ndị niile na-abata n’ebe ọ nọ[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “n’ebe obibi ọ gbazitere.” Okwu Grik bụ μίσθωμα na-ezo aka n’ebe obibi e ji ụgwọ gbazite.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsị, “ndị niile na-abịakwute ya.” N’ụzọ nkịtị karị, okwu Grik ahụ na-ekwu banyere ndị na-abata n’ebe ọ nọ, ikekwe n’ebe obibi ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐνέμεινεν
  choice: Ọ nọrọ
  rationale: Nke a na-egosi na ọ gara n’ihu ịnọ n’otu ebe ruo oge ahụ niile; “Ọ nọrọ” bụ Igbo dị mfe ma kwekọọ n’akụkọ ahụ.
- source_word: δὲ
  choice: Asụgharịghị ya iche
  rationale: δὲ bụ njikọ dị nro n’ebe a. Ọdịdị ahịrịokwu Igbo anaghị achọ ka e jiri “ma” ma ọ bụ “na” malite ya, ebe nke ahụ pụrụ igosi ọdịiche ma ọ bụ njikọ siri ike karịa nke Grik.
- source_word: διετίαν ὅλην
  choice: afọ abụọ zuru ezu
  rationale: Nke a na-echekwa ma ogologo oge ahụ ma nkwusi ike nke ὅλην.
- source_word: ἐν ἰδίῳ μισθώματι
  choice: n’ụlọ ọ gbazitere
  rationale: μίσθωμα na-ezo aka n’ebe obibi e ji ụgwọ gbazite. “Ụlọ ọ gbazitere” bụ okwu Igbo nkịtị ma na-egosikwa na ọ bụ ebe obibi o mere ndokwa maka ya.
- source_word: ἀπεδέχετο
  choice: na-anabatakwa
  rationale: Oge ngwaa Grik na-egosi omume ọ na-eme ugboro ugboro ma ọ bụ na-aga n’ihu; “na-anabatakwa” na-egosikwa nnabata ọma.
- source_word: πάντας τοὺς εἰσπορευομένους πρὸς αὐτόν
  choice: ndị niile na-abịakwute ya
  rationale: Nke a bụ Igbo ebumpụta ụwa maka ndị na-abịa ịhụ ya. Nkọwa ala peeji na-echekwa echiche doro anya karị nke ịbanye n’ebe obibi ya.
