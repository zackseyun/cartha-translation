translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke oge a, dị ùgwù ma dị mfe nghọta. E ji ‘bulie arịlịka’ chekwaa nkọwa njem ụgbọ mmiri, ebe nkọwa ọzọ dị n’okpuru peeji na-echekwa obosara ihe okwu Grik ahụ pụrụ ịpụta.
