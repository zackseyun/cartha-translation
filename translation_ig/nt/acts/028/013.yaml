  to: Site n'ebe ahụ[a], mgbe anyị bulisịrị arịlịka, anyị rutere Regium. Mgbe otu ụbọchị gachara, ifufe ndịda bilitere; n’ụbọchị nke abụọ, anyị rutere Puteoli.
