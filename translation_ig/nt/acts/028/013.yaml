  text: ὅθεν ⸀περιελόντες κατηντήσαμεν εἰς Ῥήγιον. καὶ μετὰ μίαν ἡμέραν ἐπιγενομένου νότου δευτεραῖοι ἤλθομεν εἰς Ποτιόλους,
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/013.yaml
  text: From there[a], after weighing anchor, we came to Rhegium. And after one day, when a south wind came up, on the second day we came to Puteoli,
translation:
  language: ig
  text: Site n'ebe ahụ[a], mgbe anyị bulisịrị arịlịka, anyị rutere Regium. Mgbe otu ụbọchị gachara, ifufe ndịda bilitere; n’ụbọchị nke abụọ, anyị rutere Puteoli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “mgbe anyị si ebe ahụ jiri ụgbọ mmiri pụọ.” Okwu Grik περιελόντες bụ okwu ndị ọkwọ ụgbọ mmiri ji eme ihe; ọ pụrụ ịpụta kpọmkwem ibuli arịlịka, ma ọ bụ n’ozuzu ya ịmalite njem n’ụgbọ mmiri.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅθεν
  choice: Anyị si ebe ahụ
  rationale: Ọ bụ ụzọ Igbo dị mfe ma doo anya isi gosi ebe njem ahụ si malite.
- source_word: περιελόντες
  choice: bulie arịlịka
  rationale: N’ọnọdụ njem ụgbọ mmiri a, okwu ahụ nwere ike ịpụta iwepụ ihe ji ụgbọ ahụ ka ọ ghara ịga, ya bụ ibuli arịlịka; e debere nghọta sara mbara karị n’okpuru peeji.
- source_word: κατηντήσαμεν
  choice: wee ruo
  rationale: Nke a na-egosi iru ebe a na-aga ma na-aga nke ọma n’akụkọ njem Igbo.
- source_word: Ῥήγιον
  choice: Regium
  rationale: E dere aha obodo ochie ahụ n’ụdị dabara n’usoro mkpụrụedemede na mkpọpụta Igbo.
- source_word: μετὰ μίαν ἡμέραν
  choice: Mgbe otu ụbọchị gafere
  rationale: Ọ na-echekwa oge Greek ahụ kwuru ma bụrụkwa Igbo e ji eme ihe ugbu a.
- source_word: ἐπιγενομένου νότου
  choice: ifufe ndịda malitere ife
  rationale: Ọ na-egosi ọnọdụ ọhụrụ bilitere—ifufe si ndịda malitere—n’asụsụ Igbo doro anya.
- source_word: δευτεραῖοι
  choice: n’ụbọchị nke abụọ
  rationale: Ọ na-echekwa kpọmkwem ntụaka Greek banyere ụbọchị nke abụọ kama ịgbanwe ya naanị ka ọ bụrụ ‘echi ya.’
- source_word: ἤλθομεν
  choice: anyị wee ruo
  rationale: N’ebe a, ngwaa ngagharị ahụ na-egosi na ha rutere ebe a kpọrọ aha.
- source_word: Ποτιόλους
  choice: Puteoli
  rationale: E debere aha obodo ochie ahụ n’ụdị ntụgharị mkpụrụedemede a maara.
