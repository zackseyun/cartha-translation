  - severity: medium
    issue: Nkọwa ala peeji “anyị si ebe ahụ banye n’ụgbọ mmiri gawa” na-agbakwunye omume nke isi Grik anaghị akọ.
    rationale: περιελόντες nwere ike ịpụta ịpụ ụgbọ mmiri/ịmalite ịga n’ụgbọ mmiri, ma ọ naghị ekwu na ha banyere n’ụgbọ mmiri. Ekwesịrị iwepụ mgbakwunye ahụ.
