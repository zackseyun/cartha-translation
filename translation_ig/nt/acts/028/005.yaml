  text: So he[a], after shaking the creature off into the fire, suffered no harm.
translation:
  language: ig
  text: Ma ya onwe ya, mgbe ọ mapụsịrị anụmanụ ahụ[a] n’ọkụ, ọ dịghị ihe ọjọọ ọ bụla mere ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya ‘anụ ọhịa.’ Okwu Grik ahụ bụ aha izugbe maka anụmanụ, ọ bụ ezie na ihe gbara ya gburugburu na-egosi na ọ bụ agwọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ μὲν οὖν
  choice: Ya mere, ... ọ
  rationale: Akụkụokwu a na-ezo aka na Pọl ma na-aga n’ihu n’akụkọ ahụ. ‘Ya mere’ na nnọchiaha ‘ọ’ na-egosipụta nke a n’Igbo dị ire n’enweghị ịgbatị ike ụmụokwu Grik ahụ.
- source_word: ἀποτινάξας
  choice: mgbe ọ kụpụsịrị
  rationale: Okwu a na-egosi na o buru ụzọ maa jijiji kụpụ anụmanụ ahụ tupu ihe e kwuru n’isi ngwaa emee. Nhazi ‘mgbe ... -sịrị’ na-egosipụta usoro ihe ndị ahụ nke ọma n’Igbo.
- source_word: τὸ θηρίον
  choice: anụmanụ ahụ
  rationale: θηρίον bụ aha izugbe maka anụmanụ, karịchaa anụ ọhịa; ọ bụghị okwu Grik kpọmkwem maka agwọ. ‘Anụmanụ ahụ’ na-echekwa izugbe okwu mmalite ahụ, ebe ihe gbara ya gburugburu na-eme ka o doo anya na ọ bụ agwọ.
- source_word: εἰς τὸ πῦρ
  choice: n’ime ọkụ
  rationale: Nke a na-egosipụta ngagharị banye n’ọkụ n’ụzọ doro anya ma bụrụkwa Igbo nkịtị.
- source_word: ἔπαθεν οὐδὲν κακόν
  choice: ọ dịghị ihe ọjọọ ọ bụla mere ya
  rationale: Nke a bụ ụzọ Igbo dị mma isi kwuo na ọ hụghị mmerụ ahụ ma ọ bụ mmetụta ọjọọ ọ bụla, na-edobe isi echiche nke πάσχω tinyere οὐδὲν κακόν.
