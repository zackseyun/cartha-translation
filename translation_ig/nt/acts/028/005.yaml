    reason: lexical_alternative
  revision_rationale: The revision improves the idiomatic rendering of the participial action and preserves εἰς (‘into’) through the natural verb-and-complement construction “mapụsịrị ... n’ọkụ.” It retains the source’s lexical generality for θηρίον and the meaning that no harm came to him.
