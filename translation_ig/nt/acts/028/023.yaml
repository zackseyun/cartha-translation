id: ACT.28.23
reference: Acts 28:23
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ταξάμενοι δὲ αὐτῷ ἡμέραν ⸀ἧκον πρὸς αὐτὸν εἰς τὴν ξενίαν πλείονες, οἷς ἐξετίθετο διαμαρτυρόμενος τὴν βασιλείαν τοῦ θεοῦ πείθων τε ⸀αὐτοὺς περὶ τοῦ Ἰησοῦ ἀπό τε τοῦ νόμου Μωϋσέως καὶ τῶν προφητῶν ἀπὸ πρωῒ ἕως ἑσπέρας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/023.yaml
  text: After they had arranged a day with him[a], more of them came to him at his lodging. To them he was explaining, solemnly testifying about the kingdom of God and persuading them concerning Jesus from both the Law of Moses and the Prophets[c][b], from morning until evening.
translation:
  language: ig
  text: Mgbe ha na ya kwekọrịtachara otu ụbọchị, ọtụtụ n’ime ha bịakwutere ya n’ebe obibi ya[a]. Ọ nọ na-akọwara ha[b], na-agba ama ike banyere alaeze Chineke, na-emekwa ka ha kwenye[c] banyere Jizọs site n’Iwu Mosis na Ndị Amụma, malite n’ụtụtụ ruo ná mgbede.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’ụlọ ọbịa ya” ma ọ bụ “n’ebe o bi nwa oge.” Okwu Grik ahụ na-ezo aka n’ebe obibi ma ọ bụ ebe a nabatara onye ọbịa.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “na-akọwapụtara ha” ma ọ bụ “na-esetịpụtara ha.”
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “na-achọ ime ka ha kwenye.” Okwu Grik ahụ na-akọwa ọrụ ime ka ha kwenye; ọ naghị ekpebi n’onwe ya ma ha niile kwenyere.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταξάμενοι ... αὐτῷ ἡμέραν
  choice: Mgbe ha na ya kwekọrịtachara otu ụbọchị
  rationale: Na-egosi na ha na Pọl gbara izute n’otu ụbọchị a họpụtara, n’Igbo dị mfe ma kwekọọ n’usoro okwu Grik.
- source_word: ἧκον πρὸς αὐτὸν
  choice: ha bịakwutere ya
  rationale: Ọ bụ okwu njem dị mfe nke na-egosi na ha bịara ebe Pọl nọ.
- source_word: εἰς τὴν ξενίαν
  choice: n’ebe ọ nọ na-anọ
  rationale: ξενία pụtara ebe obibi nwa oge ma ọ bụ ebe ọbịa nọ; nhọrọ a bụ Igbo nkịtị nke na-anaghị ekpebi kpọmkwem ụdị ụlọ ahụ.
- source_word: πλείονες
  choice: ọtụtụ n’ime ha
  rationale: Na-egosi ọnụ ọgụgụ ka ukwuu n’ime ndị a kpọtụrụla aha, kama naanị ikwu na ha dị ọtụtụ.
- source_word: ἐξετίθετο
  choice: Ọ kọwaara ha okwu
  rationale: Imperfect ahụ na-egosi nkọwa gara n’ihu ogologo oge; okwu Igbo a bụ nke doro ndị nkịtị anya.
- source_word: διαμαρτυρόμενος
  choice: na-agba ama siri ike banyere
  rationale: Na-echekwa ịdị mkpa na ịdị uchu dị n’omume ịgba ama ahụ, n’ejighị okwu na-ada ka asụsụ iwu.
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: alaeze Chineke
  rationale: Ọ bụ ntụgharị kwụ ọtọ ma bụrụkwa okwu Baịbụl ndị Igbo maara nke ọma.
- source_word: πείθων τε αὐτοὺς
  choice: na-agbalịkwa ime ka ha kwenye
  rationale: Na-egosi ọrụ ime ka ndị na-ege ntị kwenye, ma ghara ikwu na ha niile kwenyere n’ezie.
- source_word: περὶ τοῦ Ἰησοῦ
  choice: n’ihe banyere Jizọs
  rationale: Na-echekwa nghọta sara mbara nke περὶ ma na-ada nke ọma n’Igbo.
- source_word: ἀπό τε τοῦ νόμου Μωϋσέως καὶ τῶν προφητῶν
  choice: site n’Iwu Mosis na akwụkwọ ndị amụma
  rationale: ἀπό na-egosi isi mmalite nke ihe akaebe; ịgbakwunye ‘akwụkwọ’ na-eme ka o doo anya na ọ na-ekwu banyere akụkụ Akwụkwọ Nsọ a na-akpọ Ndị Amụma.
- source_word: ἀπὸ πρωῒ ἕως ἑσπέρας
  choice: malite n’ụtụtụ ruo ná mgbede
  rationale: Na-enye oge ahụ kpọmkwem n’Igbo dị mfe, n’akọwaghị πρωῒ dị ka chi ọbụbọ kpọmkwem.
theological_decisions:
- issue: Mmekọrịta dị n’etiti alaeze Chineke na ihe banyere Jizọs
  choice: E debere ha dịka akụkụ abụọ jikọrọ ọnụ n’otu nkọwa Pọl nyere site n’Akwụkwọ Nsọ Izrel.
  alternative: Ịkọwa ha dịka isiokwu abụọ kewapụrụ onwe ha kpamkpam.
  rationale: Usoro okwu Grik jikọtara ịgba ama banyere alaeze Chineke na ime ka ha kwenye n’ihe banyere Jizọs, ma amaokwu ahụ akọwaghị usoro nkà mmụta okpukpe zuru ezu.
- issue: Ma πείθων na-egosi ihe ịga nke ọma ma ọ bụ mgbalị
  choice: na-agbalịkwa ime ka ha kwenye
  alternative: na-emekwa ka ha kwenye
  rationale: Amaokwu na-esonụ na-egosi na ọ bụghị mmadụ niile kwenyere; nhọrọ a na-echekwa echiche nke mgbalị ime ka ha kwenye n’emeghị ka participle ahụ kwuo ihe karịrị ya.
translation_notes:
  register: Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. E ji ‘Jizọs,’ ‘Mosis,’ na ‘alaeze Chineke’ dịka ụdị okwu Baịbụl Igbo a na-amata. E zere okwu ụka nke otu ọgbakọ pụrụ iche, ma debe ahịrịokwu ahụ n’ụdị akụkọ na-aga were were.
