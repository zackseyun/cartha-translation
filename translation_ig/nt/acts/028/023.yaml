    text: Ma ọ bụ, “na-achọ ime ka ha kwenye.” Okwu Grik ahụ na-akọwa ọrụ ime ka ha kwenye; ọ naghị ekpebi n’onwe ya ma ha niile kwenyere.
    reason: lexical_alternative
