source:
  edition: SBLGNT
  text: οἳ καὶ πολλαῖς τιμαῖς ἐτίμησαν ἡμᾶς καὶ ἀναγομένοις ἐπέθεντο τὰ πρὸς ⸂τὰς χρείας⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/010.yaml
  text: They also honored us greatly[a], and when we were setting sail[c][b], they put on board what we needed.
translation:
  language: ig
  text: Ha nyekwara anyị nnukwu nsọpụrụ,[a] mgbe anyị na-akwọ ụgbọ mmiri pụọ,[b] ha bukwasịrị n’ụgbọ mmiri ihe ndị dị anyị mkpa.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'N’ụzọ dabara nso n’usoro okwu Grik: “Ha ji ọtụtụ nsọpụrụ sọpụrụ anyị.”'
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “mgbe anyị na-amalite njem n’oké osimiri.” Okwu Grik a bụ okwu a na-eji maka ịmalite njem ụgbọ mmiri.
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “ha nyere anyị ihe ndị dị anyị mkpa.” N’ụzọ dabara nso n’okwu Grik, ha “bukwasịrị ihe ndị ga-egbo mkpa n’ụgbọ mmiri.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλαῖς τιμαῖς ἐτίμησαν
  choice: Ha nyekwara anyị nnukwu nsọpụrụ
  rationale: Nke a na-egosi n'ụzọ Igbo dị mfe ma kwanyere ugwu na ha gosiri ndị njem ahụ nsọpụrụ dị ukwuu. Ọ naghị emepụtaghachi otu mgbọrọgwụ okwu Grik ugboro abụọ n’ụzọ ga-ada arọ n’Igbo.
- source_word: ἀναγομένοις
  choice: mgbe anyị na-akwadebe ịbanye n’ụgbọ mmiri pụọ
  rationale: N’okwu njem mmiri, ἀνάγω pụtara ịmalite njem ụgbọ mmiri ma ọ bụ ịpụ n’ụsọ mmiri. Nsụgharị a mere ọnọdụ njem mmiri ahụ ka o doo anya.
- source_word: ἐπέθεντο
  choice: ha bukwasịrị n’ụgbọ mmiri
  rationale: Okwu ahụ na-egosi ịtụkwasị ma ọ bụ ibukwasị ihe n’elu ihe ọzọ; ebe a, ihe a na-aghọta bụ ụgbọ mmiri. E mere ụgbọ mmiri ahụ ka ọ pụta ìhè maka nghọta dị mfe.
- source_word: τὰ πρὸς τὰς χρείας
  choice: ihe ndị dị anyị mkpa
  rationale: Nkebiokwu a na-ezo aka n’ihe ndị ga-egbo mkpa ndị njem. Igbo a bụ nke eke, ma ọ ka na-echekwa echiche nke ihe ndị dị mkpa.
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ nkebiokwu ndị na-ada nke ọma n’Igbo, ebe nkọwa ala peeji na-echekwa usoro okwu Grik nke dị nso karị.
