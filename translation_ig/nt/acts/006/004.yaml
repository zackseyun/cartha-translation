review_pass:
  verdict: revise
  source_fidelity: The draft accurately retains the contrastive «Ma», the explicit and emphatic «anyị onwe anyị», the two coordinated spheres of activity, and the future sense. «Ije ozi nke okwu ahụ» is semantically possible for διακονία τοῦ λόγου, but it is not the clearest or most natural Standard Igbo expression for the apostles’ continuing service in proclamation.
  naturalness: «Ga-anọgidesi ike n’ekpere na n’ije ozi» is understandable, but «ga-adịgide n’ekpere na n’ọrụ ikwusa okwu ahụ» is more idiomatic and clearly expresses sustained commitment. It also avoids the somewhat opaque genitive sequence «ije ozi nke okwu ahụ».
  terminology: «Ekpere» is appropriate. Rendering λόγος as «okwu ahụ» preserves the source’s idiom without prematurely identifying it as a titled divine name. «Ọrụ ikwusa okwu ahụ» naturally represents service/ministry directed to the proclaimed word and does not imply a clergy–laity distinction.
  issues:
  - severity: medium
    issue: The phrase «ije ozi nke okwu ahụ» is awkward and potentially unclear in Standard Igbo.
    rationale: Although literally shaped like the Greek genitive, it may be heard as service rendered to a “word,” rather than the service consisting in proclaiming the message. A clearer idiomatic construction is needed.
  - severity: low
    issue: The footnote’s alternative should correspond to the revised main-text construction.
    rationale: Once διακονία τοῦ λόγου is rendered as «ọrụ ikwusa okwu ahụ», the note should state the lexical alternative without suggesting that the two English-like Igbo phrases are interchangeable in precisely the same syntax.
  revised_text: Ma anyị onwe anyị ga-adịgide n’ekpere na n’ọrụ ikwusa okwu ahụ[a].
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “ije ozi metụtara okwu ahụ.” Okwu Grik ahụ (diakonia) nwere ike ịpụta “ije ozi” ma ọ bụ “ọrụ.”
    reason: lexical_alternative
  revision_rationale: The revision retains the explicit contrast and emphasis of ἡμεῖς δέ, the future ongoing force of προσκαρτερήσομεν, and both prayer and word-related ministry. «Ọrụ ikwusa okwu ahụ» is a natural Igbo expression that makes the intended relationship of διακονία to λόγος intelligible without adding a denominational office or a doctrinal interpretation.
