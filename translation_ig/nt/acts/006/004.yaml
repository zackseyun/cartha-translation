  yaml_path: translation/nt/acts/006/004.yaml
  text: But we will devote ourselves to prayer and to the ministry of the word[a].
translation:
  language: ig
  text: Ma anyị onwe anyị ga-adịgide n’ekpere na n’ọrụ ikwusa okwu ahụ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ije ozi metụtara okwu ahụ.” Okwu Grik ahụ (diakonia) nwere ike ịpụta “ije ozi” ma ọ bụ “ọrụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμεῖς
  choice: anyị onwe anyị
  rationale: Nnọchiaha ahụ pụtara ìhè na Grik ma na-emesi ndị na-ekwu okwu ike, na-ekewakwa ọrụ ha na ọrụ ndị a họpụtara ịrụ.
- source_word: δὲ
  choice: Ma
  rationale: Ọ na-egosi ọdịiche dị n’etiti ọrụ ndịozi ga-anọgidesi ike na ya na ọrụ e kwuru banyere ya n’amaokwu ndị bu ụzọ.
- source_word: τῇ προσευχῇ
  choice: n’ekpere
  rationale: Ụdị dative a na-egosi ihe ha ga-etinye onwe ha na ya; ‘n’ekpere’ bụ Igbo doro anya ma dịkwa ebumpụta ụwa.
- source_word: διακονίᾳ
  choice: ije ozi
  rationale: Okwu ahụ nwere ike ịpụta ije ozi ma ọ bụ ọrụ a na-arụ maka ndị ọzọ. ‘Ije ozi’ na-egosi ọrụ metụtara ikwusa okwu ahụ n’enweghị itinye nkewa pụrụ iche n’etiti ndị ụkọchukwu na ndị nkịtị.
- source_word: τοῦ λόγου
  choice: nke okwu ahụ
  rationale: Nke a na-edobe okwu Grik λόγος n’ụzọ pụtara ìhè, ebe ihe ndị gbara amaokwu ahụ gburugburu na-egosi na ọ bụ okwu a na-ekwusa.
- source_word: προσκαρτερήσομεν
  choice: ga-anọgidesi ike
  rationale: Ọ na-egosi mkpebi maka ịnọgide na-eme ihe mgbe niile na nraranye, ọ bụghị nanị ịga n’ihu n’ụzọ nkịtị.
theological_decisions:
- issue: Otu e si sụgharịa διακονία mgbe e jiri ya tụnyere ije ozi na tebụl n’amaokwu ndị bu ụzọ
  choice: ije ozi nke okwu ahụ
  alternative: ọrụ nke okwu ahụ
  rationale: ‘Ije ozi’ na-egosi na ikwusa okwu ahụ bụkwa ọrụ e ji ejere ndị ọzọ ozi, ma ọ naghị ebubata echiche na ndịozi bụ otu ndị ọrụ okpukpe dị iche n’ụzọ isiokwu ahụ na-ekwughị.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta, dee ya. ‘Anyị onwe anyị’ na-echekwa nkwusi ike dị na Grik; ‘ga-anọgidesi ike’ na-egosipụta nraranye na ịdịgide adịgide.
