revisions:
- from: Ma anyị onwe anyị ga-anọgidesi ike n’ekpere na n’ije ozi nke okwu ahụ[a].
  to: Ma anyị onwe anyị ga-adịgide n’ekpere na n’ọrụ ikwusa okwu ahụ[a].
  rationale: The revision retains the explicit contrast and emphasis of ἡμεῖς δέ, the future ongoing force of προσκαρτερήσομεν, and both prayer and word-related ministry. «Ọrụ ikwusa okwu ahụ» is a natural Igbo expression that makes the intended relationship of διακονία to λόγος intelligible without adding a denominational office or a doctrinal interpretation.
  reviewer_model: gpt-5.6-terra
