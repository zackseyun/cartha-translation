id: ACT.6.12
reference: Acts 6:12
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: συνεκίνησάν τε τὸν λαὸν καὶ τοὺς πρεσβυτέρους καὶ τοὺς γραμματεῖς, καὶ ἐπιστάντες συνήρπασαν αὐτὸν καὶ ἤγαγον εἰς τὸ συνέδριον,
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/012.yaml
  text: So they stirred up the people and the elders and the scribes[a], and coming upon him, they seized him and brought him before the Sanhedrin,
translation:
  language: ig
  text: Ha kpaliri ndị mmadụ, ndị okenye na ndị odeakwụkwọ; ha dakwasịrị ya na mberede, jidere ya, kpọga ya n’ihu Sanhedrin[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “ọgbakọ.” Okwu Grik συνέδριον nwere ike ịpụta ọgbakọ n’ozuzu ya, ma n’ebe a o yikarịrị ka ọ na-ezo kpọmkwem na Sanhedrin, bụ́ ọgbakọ ọchịchị na ikpe ndị Juu.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνεκίνησάν
  choice: kpaliri
  rationale: Okwu a na-egosi ime ka ndị mmadụ bilie n’obi ma ọ bụ kpalie ha ime ihe; “kpaliri” na-edobe echiche ahụ n’enweghị ịgbakwunye na ọ bụ ime ihe ike kpọmkwem.
- source_word: τε
  choice: Ya mere
  rationale: τέ bụ njikọ dị nro n’akụkọ a; “Ya mere” na-egosi njikọ nke ihe a na ihe ndị bu ya ụzọ n’ụzọ Igbo na-asụ nke ọma.
- source_word: τὸν λαὸν
  choice: ndị mmadụ
  rationale: Nke a bụ nsụgharị sara mbara ma kwekọọ na λαός n’ebe a, n’ebughị ụzọ mee ka ọ bụrụ naanị ìgwè mmadụ gbakọtara.
- source_word: τοὺς πρεσβυτέρους
  choice: ndị okenye
  rationale: N’ọnọdụ ikpe na ọchịchị ndị Juu, okwu a na-ezo aka n’ebe ndị ndu a ma ama nọ, ọ bụghị naanị ndị kara nká.
- source_word: τοὺς γραμματεῖς
  choice: ndị odeakwụkwọ Iwu
  rationale: Nke a na-edobe echiche nke ndị odeakwụkwọ ma na-eme ka o doo onye Igbo nke oge a anya na ha bụ ndị maara Akwụkwọ Nsọ na Iwu nke ọma.
- source_word: ἐπιστάντες
  choice: ha bịakwutere Stivin na mberede
  rationale: Nkebi okwu a na-egosi ịbịakwasị mmadụ na mberede; etinyere aha Stivin ka ntụaka “ya” ghara ịgba ọchịchịrị n’Igbo.
- source_word: συνήρπασαν
  choice: jide ya
  rationale: “Jide ya” na-egosi ijide mmadụ n’ike n’ụzọ dị nkenke ma bụrụkwa Igbo ebumpụta ụwa.
- source_word: ἤγαγον
  choice: kpọrọ ya gaa
  rationale: N’ihi na e jirila okwu “jide” gosi mmanye, “kpọrọ ya gaa” na-enye usoro omume ahụ n’ụzọ doro anya.
- source_word: τὸ συνέδριον
  choice: Sanhedrin
  rationale: N’ọnọdụ Jerusalem a, okwu ahụ na-ezo kpọmkwem n’ọgbakọ ọchịchị na ikpe ndị Juu; aha akụkọ ihe mere eme ahụ na-edobe nkọwa ụlọ ọrụ ahụ.
theological_decisions:
- issue: Nsụgharị συνέδριον
  choice: Sanhedrin
  alternative: ọgbakọ ikpe
  rationale: Nke a bụ njirimara ụlọ ọrụ akụkọ ihe mere eme karịa okwu ozizi. Ebe ndị okenye na ndị odeakwụkwọ Iwu nọ n’ọnọdụ Jerusalem, ihe a na-ekwu bụ ọgbakọ ọchịchị na ikpe ndị Juu; ihe odide ala peeji na-echekwa nsụgharị sara mbara.
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-edobe ọsọ nke akụkọ Grik na ike nke omume ndị ahụ, ma ọ naghị eme ka ha sie ike karịa ihe isi mmalite kwuru.
