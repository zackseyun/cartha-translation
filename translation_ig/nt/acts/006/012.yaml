revisions:
- from: Ya mere, ha kpaliri ndị mmadụ, ndị okenye na ndị odeakwụkwọ Iwu; ha bịakwutere Stivin na mberede, jide ya, kpọrọ ya gaa n’ihu Sanhedrin[a].
  to: Ha kpaliri ndị mmadụ, ndị okenye na ndị odeakwụkwọ; ha dakwasịrị ya na mberede, jidere ya, kpọga ya n’ihu Sanhedrin[a].
  rationale: The revision removes an overly strong rendering of the connective, avoids an unnecessary explanatory addition to “scribes,” and renders the sudden approach, seizure, and presentation before the council in fluent Standard Igbo. The historical specificity of Sanhedrin and the lexical alternative are retained.
  reviewer_model: gpt-5.6-terra
