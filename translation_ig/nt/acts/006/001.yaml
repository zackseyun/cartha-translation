id: ACT.6.1
reference: Acts 6:1
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἐν δὲ ταῖς ἡμέραις ταύταις πληθυνόντων τῶν μαθητῶν ἐγένετο γογγυσμὸς τῶν Ἑλληνιστῶν πρὸς τοὺς Ἑβραίους ὅτι παρεθεωροῦντο ἐν τῇ διακονίᾳ τῇ καθημερινῇ αἱ χῆραι αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/001.yaml
  text: In those days[a], as the disciples were increasing in number, a complaint arose from the Hellenists against the Hebrews[b], because their widows were being overlooked in the daily distribution.
translation:
  language: ig
  text: N’ụbọchị ndị ahụ, mgbe ọnụ ọgụgụ ndị na-eso ụzọ na-amụba, mkpesa sitere n’aka ndị Juu na-asụ Grik[a] bilitere megide ndị Hibru, n’ihi na a na-eleghara ụmụ nwanyị di ha nwụrụ n’etiti ha anya n’ọrụ nkesa a na-eme kwa ụbọchị.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ya bụ, o yikarịrị ka ha bụ ndị Juu na-asụ Grik, n’adịghị ka “ndị Hibru,” ndị o yikarịrị ka ha na-asụ Arameik ma ọ bụ Hibru.
    reason: cultural_note
  - marker: b
    text: A pụkwara ịsụgharị ya, “a naghị elekọta ha nke ọma n’ọrụ a na-arụ kwa ụbọchị.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν δὲ ταῖς ἡμέραις ταύταις
  choice: N’ụbọchị ndị ahụ
  rationale: Na-edobe ọnọdụ oge ahụ; a naghị etinye okwu ọzọ dịka “ugbu a” ebe Grik enweghị okwu oge doro anya nke pụtara ya.
- source_word: πληθυνόντων τῶν μαθητῶν
  choice: mgbe ọnụ ọgụgụ ndị na-eso ụzọ na-amụba
  rationale: Na-egosipụta ọnọdụ ndabere nke genitive absolute nakwa mmụba n’ọnụ ọgụgụ n’Igbo dị mfe nghọta.
- source_word: ἐγένετο γογγυσμός
  choice: malitere ime mkpesa
  rationale: Na-enye echiche nke mkpesa ma ọ bụ ntamu bilitere, n’asụsụ Igbo dị ndụ ma kwekọọ na esemokwu a kọwara.
- source_word: τῶν Ἑλληνιστῶν
  choice: ndị Juu na-asụ Grik
  rationale: N’Igbo, nkọwa a na-eme ka ndị na-agụ ghọta otu ndị ahụ ozugbo, ma na-edobe nghọta akụkọ ihe mere eme kachasị yie eziokwu.
- source_word: πρὸς τοὺς Ἑβραίους
  choice: megide ndị Hibru
  rationale: “Megide” na-egosi ndị mkpesa ahụ chere ihu; “ndị Hibru” na-edobe aha otu nke ihe odide Grik ji.
- source_word: παρεθεωροῦντο
  choice: a na-eleghara ... anya
  rationale: Na-egosipụta omume na-aga n’ihu nke imperfect passive, n’ebughị ụzọ kpebie na e mere ya ụma.
- source_word: ἐν τῇ διακονίᾳ τῇ καθημερινῇ
  choice: n’òkè a na-ekesa kwa ụbọchị
  rationale: Ọnọdụ ụmụ nwanyị di ha nwụrụ na amaokwu ndị na-esote na-akwado nkesa ihe enyemaka, ebe ndetu na-edobe nghọta sara mbara nke ọrụ ije ozi.
- source_word: αἱ χῆραι αὐτῶν
  choice: ụmụ nwanyị di ha nwụrụ
  rationale: Na-egosi ndị inyom di ha nwụrụ nọ n’etiti otu ndị Juu na-asụ Grik; n’Igbo, okwu a bụ nke doro anya ma nwee nsọpụrụ.
theological_decisions:
- issue: Njirimara otu ndị Ἑλληνισταί na Ἑβραῖοι
  choice: “ndị Juu na-asụ Grik” na “ndị Hibru,” tinyere nkọwa n’ala peeji
  alternative: 'Iji mkpụrụokwu transliteration abụọ: “ndị Helenist” na “ndị Hibru”'
  rationale: Ἑλληνισταί n’ebe a yikarịrị ka ọ bụ ndị Juu na-asụ Grik, ma aha Ἑβραῖοι nwere ike ịgụnye njirimara asụsụ na omenala. Nsụgharị ahụ na-eme ka nke mbụ doo anya, ebe ndetu na-echekwa ọdịiche ahụ na ntakịrị ejighị n’aka.
- issue: Ụdị mmejọ dị na παρεθεωροῦντο
  choice: “a na-eleghara ... anya”
  alternative: “a naghị elekọta ... nke ọma”
  rationale: Nhọrọ ahụ na-echekwa omume a na-eme ugboro ugboro ma ghara ikwu na eleghara ha anya n’ụma.
translation_notes:
  register: Standard Igbo; asụsụ dị ugbu a, kwụ ọtọ ma nwee ugwu. E ji “ndị na-eso ụzọ” maka μαθηταί, “ụmụ nwanyị di ha nwụrụ” maka χῆραι, ma zere okwu ụka pụrụ iche. Akara ndetu [a] na [b] dị n’ederede bụ isi.
