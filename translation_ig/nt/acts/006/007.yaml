id: ACT.6.7
reference: Acts 6:7
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Καὶ ὁ λόγος τοῦ θεοῦ ηὔξανεν, καὶ ἐπληθύνετο ὁ ἀριθμὸς τῶν μαθητῶν ἐν Ἰερουσαλὴμ σφόδρα, πολύς τε ὄχλος τῶν ἱερέων ὑπήκουον τῇ πίστει.
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/007.yaml
  text: And the word of God kept increasing[a], and the number of the disciples in Jerusalem kept multiplying greatly, and a large crowd of the priests were becoming obedient to the faith.
translation:
  language: ig
  text: Okwu Chineke nọgidere na-eto, ọnụ ọgụgụ ndị na-eso ụzọ nọkwa na-amụba nke ukwuu na Jerusalem; ìgwè buru ibu nke ndị nchụàjà nọkwa na-erubere okwukwe ahụ isi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “na-erubere okwukwe isi” ma ọ bụ “na-aghọ ndị na-erubere okwukwe isi.” Akpaokwu Grik a nwere ike ịpụta na ha na-erubere ozi nke okwukwe isi, ọ bụghị naanị na ha na-enwe okwukwe n’ime obi ha.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ λόγος τοῦ θεοῦ
  choice: Okwu Chineke
  rationale: Nke a na-edobe akpaalaokwu Akwụkwọ Nsọ ahụ ma na-ahapụ λόγος ka ọ nwee ike ịpụta okwu Chineke a na-ekwusa ma ọ bụ ozi sitere n’aka Chineke, n’emeghị ka ihe ọ pụtara dị warara.
- source_word: ηὔξανεν
  choice: nọgidere na-eto
  rationale: Oge imperfect na-egosi uto na-aga n’ihu; ‘nọgidere na-eto’ na-edobekwa ihe atụ Grik ahụ nke na-ekwu na okwu ahụ na-eto.
- source_word: ἐπληθύνετο
  choice: nọkwa na-amụba
  rationale: Nke a na-egosi mmụba na-aga n’ihu ma na-edobe ọdịiche dị n’etiti ngwaa a na ηὔξανεν.
- source_word: ὁ ἀριθμὸς τῶν μαθητῶν
  choice: ọnụ ọgụgụ ndị na-eso ụzọ
  rationale: ‘Ọnụ ọgụgụ’ na-anọchi usoro Grik ahụ nke ọma, ebe ‘ndị na-eso ụzọ’ bụ okwu Igbo doro anya ma kwekọọ na μαθηταί.
- source_word: ἐν Ἰερουσαλὴμ
  choice: na Jerusalem
  rationale: Nsụgharị kpọmkwem nke ebe ihe ahụ mere.
- source_word: σφόδρα
  choice: nke ukwuu
  rationale: Okwu Igbo dị ugbu a, dị mfe nghọta, nke na-egosi ike mmụba ahụ.
- source_word: πολύς τε ὄχλος
  choice: ìgwè buru ibu
  rationale: Nke a na-echekwa echiche nke nnukwu ìgwè mmadụ, ọ bụghị naanị ọnụ ọgụgụ a na-akọ n’ụzọ nkịtị.
- source_word: τῶν ἱερέων
  choice: nke ndị nchụàjà
  rationale: Ọ na-ezo aka kpọmkwem n’ebe ndị nchụàjà ndị Juu na-eje ozi n’ụlọ nsọ nọ.
- source_word: ὑπήκουον
  choice: nọkwa na-erubere ... isi
  rationale: Usoro a na-egosi omume na-aga n’ihu ma na-asụgharị echiche nke nrubeisi dị na ὑπακούω n’Igbo nkịtị.
- source_word: τῇ πίστει
  choice: okwukwe ahụ
  rationale: Mkpụrụokwu nrụtụaka dị na Grik na-akwado nghọta nke okwukwe dị ka ozi ma ọ bụ nkwupụta ndị Kraịst kwenyere; ‘okwukwe ahụ’ na-echekwa nghọta a n’agbanyeghị na ọ ka nwere ike ịpụta okwukwe n’ozuzu ya.
theological_decisions:
- issue: Ihe πίστις pụtara na τῇ πίστει
  choice: okwukwe ahụ
  alternative: okwukwe; ozi nke okwukwe
  rationale: Nrụtụaka ahụ na usoro okwu ‘irubere okwukwe isi’ nwere ike igosi ihe a na-ekwere—ozi na nkwupụta ndị Kraịst—ọ bụghị naanị ntụkwasị obi dị n’ime mmadụ. Nsụgharị a na-edobe mgbagwoju anya ahụ, ebe nkọwa ala peeji na-eme ka ụzọ nghọta ndị ọzọ pụta ìhè.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta, dee ya. E ji ‘nọgidere’ na usoro ‘na-’ gosi omume ndị na-aga n’ihu dị na imperfect Grik. E debere ‘Okwu Chineke’ na ‘okwukwe ahụ’ iji ghara ime ka ihe odide ahụ kọwaa karịa ihe Grik kwuru.
