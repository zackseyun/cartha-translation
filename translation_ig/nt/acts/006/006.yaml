  text: οὓς ἔστησαν ἐνώπιον τῶν ἀποστόλων, καὶ προσευξάμενοι ἐπέθηκαν αὐτοῖς τὰς χεῖρας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/006.yaml
  text: These they set before the apostles[a], and after praying[b], they laid their hands on them.
translation:
  language: ig
  text: Ha mere ka ndị a guzo n’ihu ndịozi,[a] mgbe ha kpechara ekpere, ha bikwasịrị ha aka.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Ha kpọpụtara ndị a n’ihu ndịozi.”
    reason: lexical_alternative
  - marker: b
    text: Ibikwasị mmadụ aka nwere ike igosi ime ka ọha mara na e kenyere ya ọrụ ma ọ bụ ịgọzi ya; ma Grik kpọrọ naanị omume ahụ aha, ọ kọwaghị kpọmkwem ihe ọ pụtara n’usoro ụka n’ebe a.
    reason: cultural_note
lexical_decisions:
- source_word: οὓς
  choice: ndị a
  rationale: Nnọchiaha njikọ a na-ezo aka n’ụmụ nwoke asaa a kpọrọ aha n’amaokwu gara aga. “Ndị a” na-eme ka njikọ ahụ doo anya n’Igbo n’enweghị ịgbakwunye nkọwa na-adịghị na Grik.
- source_word: ἔστησαν
  choice: kpọtara
  rationale: N’ebe a ἵστημι pụtara ime ka mmadụ guzoro ma ọ bụ iweta ya n’ihu ndị ọzọ. “Kpọtara ... n’ihu” bụ ụzọ Igbo dị ndụ si egosi na e mere ka ha bịa guzo n’ihu ndịozi.
- source_word: ἐνώπιον τῶν ἀποστόλων
  choice: n’ihu ndịozi
  rationale: Nke a na-egosi ịnọ n’ihu ma ọ bụ n’ebe ndịozi nọ; “n’ihu ndịozi” bụ ntụgharị dị mkpirikpi ma kwekọọ n’Igbo.
- source_word: προσευξάμενοι
  choice: mgbe ha kpechara ekpere
  rationale: Aorist participle ahụ na-egosi ihe ha buru ụzọ mee tupu isi ngwaa; okwu a na-egosi usoro ahụ n’Igbo nke ọma.
- source_word: ἐπέθηκαν αὐτοῖς τὰς χεῖρας
  choice: ha bikwasịrị ha aka
  rationale: Nke a bụ akpaokwu Igbo kwekọrọ n’omume ịtụkwasị mmadụ aka, ma ọ naghị akọwa n’onwe ya ma ọ bụ echichi, iziga n’ozi, ma ọ bụ ngọzi.
theological_decisions:
- issue: Ihe omume ibikwasị aka pụtara
  choice: E depụtara ya naanị dị ka “ha bikwasịrị ha aka.”
  alternative: “ha chiri ha echichi” ma ọ bụ “ha zigara ha n’ozi”
  rationale: Grik kpọrọ omume ahụ aha ma akọwaghị kpọmkwem ihe ọ pụtara n’usoro ọchịchị ụka. Ya mere, ntụgharị ahụ anaghị etinye nkọwa otu ụka pụrụ iche.
translation_notes:
  register: Standard Igbo dị ugbu a, dị nsọ ma dị mfe nghọta. E ji “ndịozi” mee aha otu ndị ahụ n’Ọrụ Ndịozi; e zere okwu ga-ekpebi na omume ahụ bụ echichi ma ọ bụ usoro ụka pụrụ iche.
