revisions:
- from: Ha kpọtara ndị a n’ihu ndịozi,[a] mgbe ha kpechara ekpere, ha bikwasịrị ha aka.[b]
  to: Ha mere ka ndị a guzo n’ihu ndịozi,[a] mgbe ha kpechara ekpere, ha bikwasịrị ha aka.[b]
  rationale: Replaced “kpọtara” (“brought”) with “mere ka … guzo n’ihu” (“made … stand before”) to represent the causative-presentational force of ἔστησαν. The prayer sequence, apostolic terminology, and deliberately noncommittal rendering of the laying on of hands are retained. Footnote a is adjusted so that it supplies a genuine lexical alternative rather than duplicating the revised main sense.
