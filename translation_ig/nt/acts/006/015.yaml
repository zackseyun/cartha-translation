revisions:
- from: Ndị niile nọ ọdụ n’ọgbakọ ndị ikpe[a] legidere ya anya nke ọma, wee hụ na ihu ya dị ka ihu mmụọ ozi.
  to: Ndị niile nọ ọdụ n’ụlọikpe[a] legidere ya anya nke ọma, wee hụ ihu ya dị ka ihu mmụọ ozi.
  rationale: The revision retains the focused gaze, universal scope, judicial-council setting, and deliberately unspecified angelic comparison. It removes the added “saw that” construction so that the object seen remains Stephen’s face, as in the Greek.
  reviewer_model: gpt-5.6-terra
