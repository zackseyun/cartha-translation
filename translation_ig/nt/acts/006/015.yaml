  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἀτενίσαντες εἰς αὐτὸν ⸀πάντες οἱ καθεζόμενοι ἐν τῷ συνεδρίῳ εἶδον τὸ πρόσωπον αὐτοῦ ὡσεὶ πρόσωπον ἀγγέλου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/015.yaml
  text: And all who were sitting in the council[a], fixing their eyes on him, saw his face like the face of an angel.
translation:
  language: ig
  text: Ndị niile nọ ọdụ n’ụlọikpe[a] legidere ya anya nke ọma, wee hụ ihu ya dị ka ihu mmụọ ozi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “Sanhedrin.” Okwu Grik a na-ezo aka n’ọgbakọ ọchịchị ndị Juu na-ekpe ikpe.
    reason: cultural_note
lexical_decisions:
- source_word: ἀτενίσαντες
  choice: legidere ya anya nke ọma
  rationale: Nke a na-egosi ilegide mmadụ anya nke ukwuu na nke na-adịgide, ọ bụghị naanị ile ya otu ntabi anya.
- source_word: πάντες οἱ καθεζόμενοι
  choice: Ndị niile nọ ọdụ
  rationale: Ọ na-echekwa ma echiche nke mmadụ niile dị n’ebe ahụ ma ọnọdụ ha, ya bụ na ha nọ ọdụ.
- source_word: συνεδρίῳ
  choice: ọgbakọ ndị ikpe
  rationale: N’ọnọdụ a, okwu ahụ na-ezo aka n’ọgbakọ ndị ọchịchị okpukpe ndị Juu na-ekpe ikpe. Nsụgharị a na-eme ka ọrụ ọgbakọ ahụ doo onye Igbo nke oge a anya, ebe e debere aha Sanhedrin n’ala peeji.
- source_word: πρόσωπον
  choice: ihu
  rationale: N’ebe a, okwu ahụ pụtara ihu Stivin a na-ahụ anya; “ihu” bụ okwu Igbo doro anya ma bụrụkwa nke a na-eji kwa ụbọchị.
- source_word: ὡσεὶ
  choice: dị ka
  rationale: Ọ na-egosi ntụnyere ma ọ bụ myirịta n’enweghị ịkọwa kpọmkwem ihe mere ihu ahụ ji yie nke mmụọ ozi.
- source_word: ἀγγέλου
  choice: mmụọ ozi
  rationale: N’akụkọ a, okwu Grik ahụ na-ezo aka n’ihe e kere eke nke eluigwe, ọ bụghị naanị onye na-ezisa ozi.
theological_decisions:
- issue: Ụdị myirịta dị n’okwu “dị ka ihu mmụọ ozi”
  choice: E debere ya dịka ntụnyere nke ihu Stivin na ihu mmụọ ozi, n’akọwaghị kpọmkwem ihe myirịta ahụ bụ.
  alternative: Ịkọwa ya kpọmkwem dịka ìhè ebube, ịdị jụụ na ịdị ọcha, ma ọ bụ ikike sitere n’eluigwe.
  rationale: Grik na-ekwu naanị na e nwere myirịta; ọ naghị ekwu ma ihe a hụrụ bụ ìhè, ịdị jụụ, ịdị ebube, ma ọ bụ ngwakọta ha. Nsụgharị ahụ ekwesịghị idozi ihe ederede hapụrụ ghe oghe.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-edobe usoro akụkọ n'ụzọ ebumpụta ụwa, na-enweghị ịgbakwunye nkọwa banyere ihe kpọmkwem mere ihu Stivin ji yie ihu mmụọ ozi.
