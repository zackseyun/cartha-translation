revisions:
- from: Ya mere, Ndị Iri na Abụọ kpọkọtara ìgwè ndị niile na-eso ụzọ ahụ[a], sị, “Ọ bụghị ihe kwesịrị ekwesị[b] ka anyị hapụ okwu Chineke wee na-eje ozi na tebụl[c].”
  to: Ya mere, Ndị Iri na Abụọ kpọkọtara ìgwè ndị na-eso ụzọ ahụ dum[a], sị, “Ọ bụghị ihe kwesịrị ekwesị[b] ka anyị hapụ okwu Chineke ka anyị jee ozi na tebụl[c].”
  rationale: The revision corrects the non-idiomatic expression for the whole assembly of disciples, smooths the verbal construction for table service, and makes the explanatory note’s reference to the believers’ community natural in Standard Igbo. It retains the source’s restrained wording “tebụl” in the main text and does not imply that practical service is inferior in worth.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T08:28:32Z'
review_pass:
  verdict: revise
  source_fidelity: 'The draft conveys the verse’s central contrast accurately: the Twelve convene the disciples and state that they should not leave God’s word in order to perform table service. “Ya mere” is a defensible contextual rendering of δέ, and “okwu Chineke” appropriately retains the breadth of τὸν λόγον τοῦ θεοῦ. The wording for the assembled body, however, is grammatically awkward and does not clearly express πλῆθος as the entire body.'
  naturalness: “Ìgwè ndị niile na-eso ụzọ ahụ” is not idiomatic Standard Igbo; “ìgwè ndị na-eso ụzọ ahụ dum” naturally expresses “the whole body/group of the disciples.” The main clause is made more idiomatic by using the simple coordinated verbal form “jee ozi” rather than the progressive “na-eje ozi.”
  terminology: “Ndị Iri na Abụọ,” “ndị na-eso ụzọ,” “okwu Chineke,” and “tebụl” are suitable Standard Igbo renderings. The cultural note should refer to the fellowship/community of believers (otu ndị kwere ekwe), not “obodo,” which normally denotes a town, village, or country.
  issues:
  - severity: medium
    issue: Awkward rendering of τὸ πλῆθος τῶν μαθητῶν
    rationale: “Ìgwè ndị niile na-eso ụzọ ahụ” has an unnatural modifier sequence in Standard Igbo. “Ìgwè ndị na-eso ụzọ ahụ dum” clearly and naturally preserves the collective and comprehensive force of πλῆθος.
  - severity: low
    issue: Cultural footnote uses “obodo ndị kwere ekwe” for the believing community
    rationale: “Obodo” is not the appropriate ordinary term here for the Christian community. “Otu ndị kwere ekwe” is clearer and does not imply a geographic settlement.
  - severity: low
    issue: Progressive wording for διακονεῖν is less direct
    rationale: “Wee na-eje ozi” can suggest continuing action. “Ka anyị jee ozi” gives a more direct infinitival-equivalent expression while retaining the contrast of responsibilities.
  revised_text: Ya mere, Ndị Iri na Abụọ kpọkọtara ìgwè ndị na-eso ụzọ ahụ dum[a], sị, “Ọ bụghị ihe kwesịrị ekwesị[b] ka anyị hapụ okwu Chineke ka anyị jee ozi na tebụl[c].”
  revised_footnotes:
