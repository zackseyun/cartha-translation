id: ACT.6.2
reference: Acts 6:2
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: προσκαλεσάμενοι δὲ οἱ δώδεκα τὸ πλῆθος τῶν μαθητῶν εἶπαν· Οὐκ ἀρεστόν ἐστιν ἡμᾶς καταλείψαντας τὸν λόγον τοῦ θεοῦ διακονεῖν τραπέζαις·
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/002.yaml
  text: So the Twelve called together the whole group of the disciples and said[c][b][a], “It is not right for us to abandon the word of God to serve tables.”
translation:
  language: ig
  text: Ya mere, Ndị Iri na Abụọ kpọkọtara ìgwè ndị na-eso ụzọ ahụ dum[a], sị, “Ọ bụghị ihe kwesịrị ekwesị[b] ka anyị hapụ okwu Chineke ka anyị jee ozi na tebụl[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ọnụọgụ ndị na-eso ụzọ ahụ niile” ma ọ bụ “ọtụtụ ndị na-eso ụzọ ahụ.”
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, “Ọ bụghị ihe a ga-anabata” ma ọ bụ “Ọ dịghị mma n’anya.”
    reason: lexical_alternative
  - marker: c
    text: Ya bụ, ilekọta nkesa nri na ihe ndị ọzọ otu ndị kwere ekwe ji ebi ndụ.
    reason: cultural_note
lexical_decisions:
- source_word: προσκαλεσάμενοι
  choice: kpọkọtara
  rationale: Okwu a na-egosi na Ndị Iri na Abụọ kpọrọ ndị na-eso ụzọ ka ha zukọta; “kpọkọtara” bụ ụzọ Igbo doro anya ma dịkwa n’usoro akụkọ.
- source_word: δὲ
  choice: Ya mere
  rationale: N’ebe a, δέ na-ebuga akụkọ n’ihu site ná mkpesa e kwuru n’amaokwu bu ụzọ ruo ná nzaghachi Ndị Iri na Abụọ; “Ya mere” na-egosi njikọ ahụ n’enweghị ime ka ọ bụrụ nnukwu mmegide.
- source_word: οἱ δώδεκα
  choice: Ndị Iri na Abụọ
  rationale: A hapụrụ ya dị ka aha a maara ìgwè ahụ, n’etinyeghị “ndịozi,” n’ihi na okwu ahụ adịghị kpọmkwem na Grik.
- source_word: τὸ πλῆθος τῶν μαθητῶν
  choice: ìgwè ndị niile na-eso ụzọ ahụ
  rationale: Nke a na-egosi nzukọ ahụ dum ma jiri asụsụ Igbo nke oge a dị mfe nghọta; nkọwa ala peeji na-echekwa nhọrọ ndị ọzọ nke πλῆθος.
- source_word: Οὐκ ἀρεστόν ἐστιν
  choice: Ọ bụghị ihe kwesịrị ekwesị
  rationale: ἀρεστόν nwere ike ịpụta ihe dị mma n’anya ma ọ bụ ihe a nabatara; n’ebe a, ọ na-ekwu banyere ihe dabara n’ọrụ e nyere ha, ya mere okwu a na-egosipụta ịdị mma ma ọ bụ ịdị dabara n’enweghị ikwubiga ikpe omume ókè.
- source_word: ἡμᾶς καταλείψαντας
  choice: ka anyị hapụ
  rationale: “Hapụ” na-echekwa echiche nke ịhapụ ọrụ okwu Chineke n’azụ, ma ọ naghị agbakwụnye echiche nke nleghara anya nke na-adịghị n’okwu ahụ kpọmkwem.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: okwu Chineke
  rationale: Nke a bụ nsụgharị doro anya nke na-echekwa ma echiche ozi a na-ekwusa ma ịdị arọ nke okwu ahụ n’ihe gbasara Chineke.
- source_word: διακονεῖν
  choice: na-eje ozi
  rationale: “Ije ozi” bụ okwu Igbo nkịtị maka ọrụ enyemaka a, n’etinyeghị ọkwa ụka e mesịrị n’ihe okwu Grik pụtara.
- source_word: τραπέζαις
  choice: na tebụl
  rationale: A hapụrụ ihe atụ “tebụl” nke Grik n’ahịrị bụ isi; nkọwa ala peeji na-akọwa ọrụ nkesa nri na ihe ndị obodo ji ebi ndụ nke ọnọdụ akụkọ ahụ na-atụ aro.
theological_decisions:
- issue: Ụzọ e si ghọta ibu ụzọ Ndị Iri na Abụọ nyere okwu Chineke karịa ọrụ tebụl
  choice: 'E gosipụtara ya dị ka ajụjụ banyere ọrụ dabara n’ọkpụkpọ ha: “Ọ bụghị ihe kwesịrị ekwesị ka anyị hapụ okwu Chineke...”'
  alternative: A pụrụ ịsụgharị ya, “Ọ dịghị mma n’anya ka anyị hapụ okwu Chineke...”
  rationale: Amaokwu ahụ na-ekewa ọrụ dị iche iche na ibu ọrụ ha, ọ bụghị na ọ na-ekwu na ije ozi na tebụl enweghị ugwu. Nsụgharị a na-echekwa ịdị arọ nke ibu ụzọ ha nyere okwu Chineke n’emeghị ka ọrụ enyemaka dị ka ihe dị ala.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-eso usoro akụkọ Igbo eke, ma na-echekwa okwu “tebụl” na nghọta abụọ ọ pụrụ ibu kama idozi ya kpamkpam n’ahịrị bụ isi.
