    text: A pụkwara ịsụgharị ya, “Ọ bụghị ihe a ga-anabata” ma ọ bụ “Ọ dịghị mma n’anya.”
    reason: lexical_alternative
  - marker: c
    text: Ya bụ, ilekọta nkesa nri na ihe ndị ọzọ otu ndị kwere ekwe ji ebi ndụ.
    reason: cultural_note
  revision_rationale: The revision corrects the non-idiomatic expression for the whole assembly of disciples, smooths the verbal construction for table service, and makes the explanatory note’s reference to the believers’ community natural in Standard Igbo. It retains the source’s restrained wording “tebụl” in the main text and does not imply that practical service is inferior in worth.
