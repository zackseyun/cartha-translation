base_translation:
  language: en
  yaml_path: translation/nt/acts/006/008.yaml
  text: Stephen[a], full of grace and power, was doing great wonders and signs among the people.
translation:
  language: ig
  text: Stivin[a], onye jupụtara n’amara na ike, nọ na-eme ọrụ ebube na ihe ịrịba ama dị ukwuu n’etiti ndị mmadụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ụfọdụ akwụkwọ aka ochie na-ekwu, “onye jupụtara n’okwukwe na ike,” kama, “onye jupụtara n’amara na ike.”
    reason: textual_variant
lexical_decisions:
- source_word: δὲ
  choice: Ma
  rationale: Ọ bụ njikọ dị nro na-aga n’ihu n’akụkọ ahụ; “Ma” na-ejikọta amaokwu a na ihe bu ya ụzọ n’enweghị ime ka ọ bụrụ nnukwu mmegide.
- source_word: πλήρης χάριτος καὶ δυνάμεως
  choice: onye jupụtara n’amara na ike
  rationale: Nke a na-egosi na amara na ike bụ ihe jupụtara na Stivin ma bụrụ àgwà pụtara ìhè n’ime ya.
- source_word: χάριτος
  choice: amara
  rationale: Ọ na-asụgharị χάριτος nke dị na SBLGNT kpọmkwem ma na-echekwa echiche banyere amara ma ọ bụ ihu ọma Chineke.
- source_word: δυνάμεως
  choice: ike
  rationale: “Ike” bụ okwu Igbo doro anya ma kwesị ekwesị maka ike Chineke nke na-apụta ìhè n’ọrụ ebube.
- source_word: ἐποίει
  choice: nọ na-eme
  rationale: Ụdị ngwaa imperfect na-egosi omume na-aga n’ihu ma ọ bụ nke a na-eme ugboro ugboro n’oge gara aga; “nọ na-eme” na-echekwa akụkụ a.
- source_word: τέρατα καὶ σημεῖα
  choice: ọrụ ebube na ihe ịrịba ama
  rationale: “Ọrụ ebube” na-egosi ihe ndị na-akpali ịtụnanya, ebe “ihe ịrịba ama” na-echekwa ọrụ ha dị ka ihe na-egosi ihe ọzọ; ya mere, ọdịiche dị n’okwu Grik abụọ ahụ anaghị efu kpamkpam.
- source_word: μεγάλα
  choice: nnukwu
  rationale: “Nnukwu” na-akọwa ma ọrụ ebube ma ihe ịrịba ama n’ụzọ dị mfe, n’enweghị itinye nkọwa ọzọ na-adịghị na isi mmalite.
- source_word: ἐν τῷ λαῷ
  choice: n’etiti ndị mmadụ
  rationale: Nke a bụ Igbo nkịtị maka ihe a na-eme n’etiti ọha mmadụ ahụ.
theological_decisions:
- issue: Ọdịiche ederede na χάριτος/πίστεως
  choice: amara
  alternative: okwukwe
  rationale: Isi mmalite SBLGNT e nyere nwere χάριτος (“amara”), ya mere isi ederede na-eso ya. E debere ọgụgụ πίστεως (“okwukwe”) nke ụfọdụ akwụkwọ aka ochie nwere n’okpuru ala ka e wee ghara izochi ọdịiche nwere mkpa n’ịkọwa ihe.
translation_notes:
  register: Igbo ọkọlọtọ, nke dị ugwu ma dị mfe nghọta nye ndị na-agụ akwụkwọ taa. A họọrọ “Stivin” dị ka nsụpe Igbo a na-aghọta nke ọma maka aha Στέφανος. Akara [a] dị n’isi ederede ma kwekọọ na nkọwa ala.
