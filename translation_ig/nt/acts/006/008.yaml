  rationale: The revision removes a potentially adversative rendering of the mild Greek connective and relocates the adjective so that it plainly qualifies both “ọrụ ebube” and “ihe ịrịba ama.” It otherwise preserves the source reading, aspect, register, name form, and textual-variant anchor.
