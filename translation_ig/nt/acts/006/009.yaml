source:
  edition: SBLGNT
  text: ἀνέστησαν δέ τινες τῶν ἐκ τῆς συναγωγῆς τῆς λεγομένης Λιβερτίνων καὶ Κυρηναίων καὶ Ἀλεξανδρέων καὶ τῶν ἀπὸ Κιλικίας καὶ Ἀσίας συζητοῦντες τῷ Στεφάνῳ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/009.yaml
  text: But some of those from the synagogue called the Synagogue of the Freedmen[a], and of the Cyrenians and Alexandrians, and of those from Cilicia and Asia[b], stood up and began arguing with Stephen.
translation:
  language: ig
  text: Ma ụfọdụ n’ime ndị si n’ụlọ nzukọ a na-akpọ nke Ndị A Tọhapụrụ n’Ohu[a], na ndị Kurini, ndị Aleksandria, na ndị si Silisia na Eshia[b], biliri soro Stivin rụọrịta ụka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “Ndị Libertini.” Okwu Grik a na-ezo aka ná ndị a tọhapụrụ n’ohu—ikekwe ndị bụbu ohu ma ọ bụ ndị sitere n’ezinụlọ ha.
    reason: lexical_alternative
  - marker: b
    text: “Eshia” n’ebe a bụ ógbè Rom nke dị n’ọdịda anyanwụ Eshia Maịnọ, ọ bụghị kọntinent Eshia nke oge a.
    reason: cultural_note
lexical_decisions:
- source_word: ἀνέστησαν
  choice: biliri
  rationale: Ọ na-edobe ihe oyiyi nkịtị nke ‘ibili’ ma n’ebe a na-egosikwa na ha pụtara imegide Stivin.
- source_word: δέ
  choice: Ma
  rationale: Ọ na-egosi ntụgharị dị nro site n’ọrụ Stivin a kọwara tupu nke a gaa ná mmegide bilitere.
- source_word: τινες τῶν ἐκ τῆς συναγωγῆς
  choice: ụfọdụ n’ime ndị si n’ụlọ nzukọ ndị Juu ahụ
  rationale: Nke a na-egosi nke ọma na ọ bụ naanị ụfọdụ ndị so n’ụlọ nzukọ ahụ, ma mee ka ‘synagogue’ doo onye Igbo nke oge a anya.
- source_word: τῆς λεγομένης
  choice: a na-akpọ
  rationale: Ọ bụ ụzọ Igbo dị mfe ma kwekọọ n’aha e ji mara ụlọ nzukọ ahụ.
- source_word: Λιβερτίνων
  choice: Ndị A Tọhapụrụ n’Ohu
  rationale: Okwu ahụ na-ezo aka ná ndị e mere onwe ha mgbe ha bụbu ndị ohu, ma ọ bụ ụmụ ụmụ ha; nsụgharị a na-ezere echiche ọgbara ọhụrụ na-eduhie eduhie nke ‘Libertines.’
- source_word: Κυρηναίων καὶ Ἀλεξανδρέων
  choice: ndị si na Kurini na Aleksandria
  rationale: Igbo na-ekwukarị aha ndị obodo ndị a n’ụzọ eke dịka ‘ndị si na’ ebe ndị ahụ.
- source_word: τῶν ἀπὸ Κιλικίας καὶ Ἀσίας
  choice: ndị si na Silisia na Eshia
  rationale: ἀπό na-egosi ebe ha si; a hapụrụ ‘Eshia’ n’ahụ amaokwu ma kọwaa ógbè ahụ n’ala ala peeji.
- source_word: συζητοῦντες
  choice: malite ịrụrịta ụka megide
  rationale: N’ọnọdụ a, ọ bụghị mkparịta ụka nkịtị kama ọ bụ esemokwu ọnụ megide Stivin; ‘malite’ na-eme ka participle ahụ soro ‘biliri’ gaa nke ọma n’Igbo.
- source_word: τῷ Στεφάνῳ
  choice: Stivin
  rationale: Aha onye ahụ bụ ihe nnara nke ngwaa συζητέω; ‘megide Stivin’ na-egosipụta mmekọrịta ahụ n’Igbo eke.
theological_decisions: []
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. ‘Ụlọ nzukọ ndị Juu’ na-eme ka συναγωγή doo ndị na-agụ akwụkwọ nkịtị anya. A họọrọ ‘ịrụrịta ụka megide’ iji gosipụta mmegide dị na ọnọdụ ahụ n’enweghị itinye nkọwa karịrị isi mmalite.
