    text: A pụkwara ịsụgharị ya “Ndị Libertini.” Okwu Grik a na-ezo aka ná ndị a tọhapụrụ n’ohu—ikekwe ndị bụbu ohu ma ọ bụ ndị sitere n’ezinụlọ ha.
    reason: lexical_alternative
  - marker: b
    text: “Eshia” n’ebe a bụ ógbè Rom nke dị n’ọdịda anyanwụ Eshia Maịnọ, ọ bụghị kọntinent Eshia nke oge a.
    reason: cultural_note
  revision_rationale: Removed the added adjective “ndị Juu,” smoothed the Igbo clause, and rendered the verbal dispute as “soro Stivin rụọrịta ụka,” which is natural and does not overstate the force of συζητοῦντες. The grouped syntax remains close to the Greek and does not impose a disputed organizational interpretation. Footnote a now represents descendants without restricting them to grandchildren.
