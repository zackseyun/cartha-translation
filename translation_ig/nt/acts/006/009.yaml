revisions:
- from: Ma ụfọdụ n’ime ndị si n’ụlọ nzukọ ndị Juu ahụ a na-akpọ Ụlọ Nzukọ Ndị A Tọhapụrụ n’Ohu[a], tinyere ndị si na Kurini na Aleksandria, na ndị si na Silisia na Eshia[b], biliri malite ịrụrịta ụka megide Stivin.
  to: Ma ụfọdụ n’ime ndị si n’ụlọ nzukọ a na-akpọ nke Ndị A Tọhapụrụ n’Ohu[a], na ndị Kurini, ndị Aleksandria, na ndị si Silisia na Eshia[b], biliri soro Stivin rụọrịta ụka.
  rationale: Removed the added adjective “ndị Juu,” smoothed the Igbo clause, and rendered the verbal dispute as “soro Stivin rụọrịta ụka,” which is natural and does not overstate the force of συζητοῦντες. The grouped syntax remains close to the Greek and does not impose a disputed organizational interpretation. Footnote a now represents descendants without restricting them to grandchildren.
