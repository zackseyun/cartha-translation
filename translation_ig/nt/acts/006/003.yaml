  verdict: revise
  source_fidelity: A chọrọ ka ọgbakọ ahụ họpụta mmadụ asaa, ọ bụghị naanị ịchọpụta ha. “Chọpụtanụ” na-egosi ịmata ma ọ bụ ịchọpụta, ma ọ naghị egosipụta nke ọma iwu nhọrọ dị na ἐπισκέψασθε. “Họpụtanụ” na-enye echiche a nke ọma. Nkebiokwu ndị ọzọ na-edobe ἄνδρας, àmà ọma a na-agba banyere ndị a họpụtara, ịdị juputara na Mmụọ na amamihe, na nhọpụta ndịozi maka ọrụ ahụ.
  naturalness: Ewezuga “chọpụtanụ,” ederede ahụ bụ Standard Igbo doro anya ma dị n’usoro kwesịrị ekwesị. “Ndị a na-agbara ezi àmà” bụ ihe a pụrụ ịghọta, ma “ndị a na-agba ezi àmà banyere ha” doro anya karịa ma bụrụkwa ụzọ Igbo nkịtị e si akọwa àmà ọma ndị ọzọ na-agba banyere mmadụ.
  terminology: “Ụmụnna,” “ndị ikom,” “Mmụọ,” na “amamihe” dabara n’ụdị na nkọwa Grik. Ide “Mmụọ” n’isi mkpụrụedemede ukwu, na-ahapụghị “Nsọ” n’ahịrị bụ isi, na-echekwa okwu Grik ahụ na nkọwa Luk–Ọrụ Ndịozi. Ihe odide ala peeji na-echekwa nhọrọ “Mmụọ Nsọ” n’enweghị ịmanye ya.
