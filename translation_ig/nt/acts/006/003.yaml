  text: ἐπισκέψασθε ⸀δέ, ἀδελφοί, ἄνδρας ἐξ ὑμῶν μαρτυρουμένους ἑπτὰ πλήρεις ⸀πνεύματος καὶ σοφίας, οὓς ⸀καταστήσομεν ἐπὶ τῆς χρείας ταύτης·
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/003.yaml
  text: But brothers[a], select from among yourselves seven men who are well attested, full of the Spirit and wisdom[d][c][b], whom we will appoint over this duty.
translation:
  language: ig
  text: Ma, ụmụnna[b], họpụtanụ n’etiti unu ndị ikom asaa ndị a na-agba ezi àmà banyere ha[a], ndị jupụtara na Mmụọ[c] na amamihe, ndị anyị ga-ahọpụta ka ha lekọta ọrụ a[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị nwere ezi aha.”
    reason: lexical_alternative
  - marker: b
    text: Ụdị okwu Grik a sụgharịrị “ụmụnna” bụ nke nwoke; ma okwu a e ji kpọọ ha nwere ike ịgụnye ọgbakọ ndị kwere ekwe n’ozuzu ya.
    reason: cultural_note
  - marker: c
    text: Ma ọ bụ, “ndị jupụtara na Mmụọ Nsọ na amamihe.” Grik sịrị, “ndị jupụtara na Mmụọ na amamihe.”
    reason: alternative_reading
  - marker: d
    text: “Ọrụ a” na-ezo aka n’ihe metụtara ikesa ihe kwa ụbọchị, nke a kpọtụrụ aha n’amaokwu ndị gbara ya gburugburu.
    reason: cross_reference
lexical_decisions:
- source_word: ἐπισκέψασθε
  choice: chọpụtanụ
  rationale: Okwu a na-akpọ ọgbakọ ka ha nyochaa ma họpụta ndị kwesịrị ekwesị n’etiti ha; “chọpụtanụ” na-egosipụta ịchọpụta ndị ahụ n’ụzọ Igbo dị mma.
- source_word: δέ
  choice: Ma
  rationale: N’ebe a, δέ na-akpọga okwu ahụ n’ihe ndịozi chọrọ ka ọgbakọ mee; “Ma” na-edobe ntụgharị dị nro nke okwu Grik ahụ n’enweghị ime ka ọ bụrụ nkwubi okwu siri ike.
- source_word: ἀδελφοί
  choice: ụmụnna
  rationale: “Ụmụnna” bụ ụzọ nkwanye ùgwù na nke a na-asụkarị n’Igbo iji kpọọ ndị otu okwukwe; ihe e dere n’okpuru na-akọwa na ụdị okwu Grik ahụ bụ nke nwoke, ma o nwere ike ịgụnye ọgbakọ ndị kwere ekwe n’ozuzu.
- source_word: ἄνδρας
  choice: ndị ikom
  rationale: ἀνήρ na-ezo aka kpọmkwem n’ụmụ nwoke toro eto, ya mere “ndị ikom” na-edobe nkọwa ahụ.
- source_word: ἐξ ὑμῶν
  choice: n’etiti unu
  rationale: Nke a na-egosi na a ga-ahọrọ ha n’ime ọgbakọ ahụ n’onwe ya.
- source_word: μαρτυρουμένους
  choice: ndị a na-agbara ezi àmà
  rationale: Nhọrọ a na-edobe echiche bụ isi nke ndị ọzọ na-agba ama ọma banyere ha, kama ime ka ọ bụrụ naanị aha ọma n’ozuzu.
- source_word: ἑπτὰ
  choice: asaa
  rationale: A sụgharịrị ọnụọgụ ahụ kpọmkwem.
- source_word: πλήρεις πνεύματος καὶ σοφίας
  choice: ndị jupụtara na Mmụọ na amamihe
  rationale: Nke a na-edobe usoro na njikọ dị n’okwu Grik. E ji mkpụrụedemede ukwu dee “Mmụọ” n’ihi na ihe gbara okwu ahụ gburugburu n’akwụkwọ Luk na Ọrụ Ndịozi na-egosi Mmụọ Chineke, ma etinyeghị “Nsọ” n’ahịrị bụ isi n’ihi na ọ dịghị na Grik.
- source_word: καταστήσομεν
  choice: anyị ga-ahọpụta
  rationale: “Ga-ahọpụta” na-egosi nhọpụta n’ọkwa ọrụ nke ndịozi ga-eme, nke dị iche na ọrụ ọgbakọ nke ịchọpụta ndị kwesịrị ekwesị.
- source_word: ἐπὶ τῆς χρείας ταύτης
  choice: ka ha lekọta ọrụ a
  rationale: Nkebiokwu a na-egosi inyefe ha ọrụ ma ọ bụ mkpa a kpọtụrụ aha; “ka ha lekọta ọrụ a” bụ Igbo ebumpụta ụwa nke na-egosi ibu ọrụ ahụ.
theological_decisions:
- issue: Ma πνεύματος ọ na-ezo aka na mmụọ n’ozuzu ya ka ọ bụ Mmụọ Nsọ
  choice: Mmụọ
  alternative: mmụọ; Mmụọ Nsọ
  rationale: Ihe gbara okwu ahụ gburugburu na ojiji Luk na Ọrụ Ndịozi na-akwado na ọ bụ Mmụọ Chineke ka a na-ekwu maka ya. Ma ebe Grik na-ekwu naanị “Mmụọ,” ahịrị bụ isi anaghị atụkwasị okwu “Nsọ”; ihe e dere n’okpuru na-echekwa nhọrọ nkọwa ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dịkwa mfe nghọta, mee ntụgharị a. A hapụrụ ọdịiche dị n’etiti ịchọpụta ndị kwesịrị ekwesị site n’aka ọgbakọ na nhọpụta ha site n’aka ndịozi. E debeghị nkọwa ụka pụrụ iche n’ime okwu ahụ.
