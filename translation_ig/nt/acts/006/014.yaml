    reason: lexical_alternative
  - marker: b
    text: “Ebe a” na-ezo aka n’ụlọ nsọ ukwu.
    reason: cultural_note
  - marker: c
    text: Ma ọ bụ, “omenala ndị Mozis nyere anyị.”
    reason: lexical_alternative
