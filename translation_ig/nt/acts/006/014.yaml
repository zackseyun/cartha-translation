id: ACT.6.14
reference: Acts 6:14
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀκηκόαμεν γὰρ αὐτοῦ λέγοντος ὅτι Ἰησοῦς ὁ Ναζωραῖος οὗτος καταλύσει τὸν τόπον τοῦτον καὶ ἀλλάξει τὰ ἔθη ἃ παρέδωκεν ἡμῖν Μωϋσῆς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/014.yaml
  text: For we heard him saying that this Jesus the Nazarene will destroy this place and will change the customs that Moses handed down to us[a][b][c].
translation:
  language: ig
  text: N’ihi na anyị anụwo na ọ sịrị na Jizọs onye Nazaret a[a] ga-ebibi ebe a[b], nakwa na ọ ga-agbanwe omenala ndị Mozis nyefere anyị.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Jizọs nke Nazaret a.”
    reason: lexical_alternative
  - marker: b
    text: “Ebe a” na-ezo aka n’ụlọ nsọ ukwu.
    reason: cultural_note
  - marker: c
    text: Ma ọ bụ, “omenala ndị Mozis nyere anyị.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκηκόαμεν
  choice: anyị anụwo
  rationale: Ụdị perfect nke ἀκούω na-egosi ihe ha nụrụ nke ka dị mkpa n’oge ebubo ahụ; “anyị anụwo” na-edobe nke a n’Igbo dị mfe.
- source_word: γὰρ
  choice: N’ihi na
  rationale: Ọ na-egosi na okwu a bụ ihe na-akọwa ma na-akwado ebubo e kwuru n’amaokwu bu ụzọ.
- source_word: αὐτοῦ λέγοντος
  choice: ka ọ na-ekwu
  rationale: Nke a na-egosi na ha sịrị na ha nụrụ ya kpọmkwem mgbe ọ na-ekwu okwu ahụ.
- source_word: Ἰησοῦς ὁ Ναζωραῖος οὗτος
  choice: Jizọs onye Nazaret a
  rationale: “Onye Nazaret” na-egosipụta aha nkọwa Ναζωραῖος, ebe “a” na-edobe ike ngosipụta nke οὗτος na ụda ebubo ahụ.
- source_word: καταλύσει
  choice: ga-ebibi
  rationale: N’ihe gbasara ebe a, ya bụ ụlọnsọ ukwu, καταλύω pụtara ịkwatu ma ọ bụ ibibi; “ga-ebibi” bụ okwu doro anya ma kwekọọ n’ebubo ahụ.
- source_word: τὸν τόπον τοῦτον
  choice: ebe a
  rationale: A sụgharịrị τόπος n’ụzọ nkịtị dịka “ebe,” na-ahapụghị ihe okwu ahụ na-ezo aka na ya—ụlọnsọ ukwu—ka ọ pụta ìhè karịa Greek.
- source_word: ἀλλάξει
  choice: gbanweekwa
  rationale: “Gbanwee” bụ ntụgharị Igbo kwụ ọtọ nke ἀλλάσσω; “-kwa” jikọtara omume nke abụọ a na nke mbụ.
- source_word: τὰ ἔθη
  choice: omenala ndị
  rationale: ἔθη na-ezo aka n’omume na usoro obodo na-eketa; “omenala” na-egosipụta echiche a n’Igbo nkịtị na-enweghị ime ya ka ọ bụrụ naanị iwu ma ọ bụ ozizi.
- source_word: ἃ παρέδωκεν ἡμῖν Μωϋσῆς
  choice: ndị Mozis nyefere anyị
  rationale: “Nyefere anyị” na-egosipụta echiche παραδίδωμι nke inyefe ihe n’aka ọgbọ ma ọ bụ ndị ọzọ ka ha nata ma debe ya.
theological_decisions:
- issue: Ihe “ebe a” na-ezo aka na ya
  choice: E debere “ebe a” n’ahịrị isi.
  alternative: ụlọ nsọ a; ebe nsọ a
  rationale: Greek kwuru “ebe a.” Ọ bụ ezie na ihe a na-ezo aka na ya bụ ụlọnsọ ukwu, ide ya kpọmkwem n’ahịrị isi ga-akọwa karịa okwu ndị boro Stivin ebubo.
- issue: Ụda ebubo e ji kpọọ Jizọs aha
  choice: Jizọs onye Nazaret a
  alternative: Jizọs onye Nazaret; Jizọs nke Nazaret
  rationale: Ngosipụta “a” na-edobe οὗτος na ụda okwu ndị na-ebo ebubo, n’etinyeghị mkparị ọzọ na-adịghị na Greek.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe ma dị ugwu. Ahịrịokwu ahụ na-edobe usoro ebubo ahụ, ike ngosipụta dị na οὗτος, na ntakịrị nghọta abụọ dị na “ebe” na ἔθη, ebe nkọwa ala peeji na-enye ụzọ okwu ndị ọzọ.
