id: ACT.6.5
reference: Acts 6:5
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἤρεσεν ὁ λόγος ἐνώπιον παντὸς τοῦ πλήθους, καὶ ἐξελέξαντο Στέφανον, ἄνδρα ⸀πλήρης πίστεως καὶ πνεύματος ἁγίου, καὶ Φίλιππον καὶ Πρόχορον καὶ Νικάνορα καὶ Τίμωνα καὶ Παρμενᾶν καὶ Νικόλαον προσήλυτον Ἀντιοχέα,
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/005.yaml
  text: And the proposal pleased the whole multitude[a], and they chose Stephen, a man full of faith and of the Holy Spirit, Philip, Prochorus, Nicanor, Timon, Parmenas, and Nicolaus[c][b], a proselyte of Antioch.
translation:
  language: ig
  text: Aro ahụ masịrị ìgwè mmadụ ahụ niile, ha wee họrọ Stifan, nwoke nke jupụtara n’okwukwe[a] na Mmụọ Nsọ, na Filip, Prokoro, Nikanọ, Timọn, Pamenas, na Nikolaọs[b], onye Antiọk nke ghọrọ onye Juu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ikwesị ntụkwasị obi.” Okwu Grik a nwere ike ịpụta okwukwe, ntụkwasị obi, ma ọ bụ ikwesị ntụkwasị obi.
    reason: lexical_alternative
  - marker: b
    text: “Onye ghọrọ onye Juu” bụ onye mba ọzọ nabatara okpukpe ndị Juu.
    reason: cultural_note
lexical_decisions:
- source_word: ὁ λόγος
  choice: ihe ndị ahụ kwuru
  rationale: N'ebe a, λόγος na-ezo aka n'ihe ndịozi ka kwuchara, ya bụ aro ha nyere, ọ bụghị naanị ‘okwu’ n'echiche sara mbara. Nsụgharị a bụ Igbo dị mfe ma na-ejikọta ya na amaokwu bu ụzọ.
- source_word: ἤρεσεν ... ἐνώπιον παντὸς τοῦ πλήθους
  choice: masịrị ìgwè mmadụ ahụ niile
  rationale: N'agbanyeghị na ἐνώπιον pụtara n'ụzọ nkịtị ‘n'ihu,’ ya na ἀρέσκω ebe a na-egosi na ihe ahụ nwetara nkwado ìgwè ahụ niile.
- source_word: ἐξελέξαντο
  choice: ha wee họrọ
  rationale: Nke a na-enye ihe ἐκλέγομαι pụtara n'ụzọ doro anya ma bụrụ Igbo a na-asụ ugbu a.
- source_word: ἄνδρα πλήρης πίστεως καὶ πνεύματος ἁγίου
  choice: nwoke jupụtara n'okwukwe na Mmụọ Nsọ
  rationale: ‘Nwoke’ na-edobe nkọwa nwoke nke ἀνήρ; ‘jupụtara’ na-egosipụta πλήρης; ‘okwukwe’ bụ isi nsụgharị πίστις ebe a, ebe ‘Mmụọ Nsọ’ na-ezo aka na Mmụọ Chineke.
- source_word: Στέφανον, Φίλιππον, Πρόχορον, Νικάνορα, Τίμωνα, Παρμενᾶν, Νικόλαον
  choice: Stivin, Filip, Prokọrọs, Nikanọ, Timọn, Pamenas, na Nikolaọs
  rationale: A haziri aha ndị ahụ n'ụdị mkpọpụta dabara n'Igbo ma debe ha dị ka otu ndepụta mmadụ asaa.
- source_word: προσήλυτον Ἀντιοχέα
  choice: onye Antiọk nke ghọrọ onye Juu
  rationale: προσήλυτος n'ebe a bụ onye mba ọzọ nabatara okpukpe ndị Juu; nsụgharị nkọwa a ka okwu teknịkal dịka ‘proselyte’ doo ndị Igbo nke oge a anya.
theological_decisions:
- issue: Ihe πίστις pụtara n'okwu e ji kọwaa Stivin
  choice: okwukwe
  alternative: ikwesị ntụkwasị obi
  rationale: πίστις nwere ike ịpụta okwukwe, ntụkwasị obi, ma ọ bụ ikwesị ntụkwasị obi. N'ebe a ‘okwukwe’ bụ nghọta kachasị kwekọọ n'otú akwụkwọ Ọrụ Ndịozi si akọwa Stivin, ma ihe ọzọ ahụ ka edebere na nkọwa ala peeji.
- issue: Ihe πνεύματος ἁγίου na-ezo aka na ya
  choice: Mmụọ Nsọ
  alternative: mmụọ dị nsọ
  rationale: N'ime Ọrụ Ndịozi, okwu a na-ezokarị aka na Mmụọ Nsọ nke Chineke, ọ bụghị naanị àgwà ime mmụọ nke mmadụ.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. A sụgharịrị aro ndịozi ahụ dịka ‘ihe ndị ahụ kwuru’ iji zere okwu siri ike ma debe njikọ ya na ihe ndịozi kwuru n'amaokwu bu ụzọ. E mekwara ndepụta ahụ ka ọ daa nke ọma n'Igbo, ma e debeghị footnote nke English gbasara nhazi ndepụta n'ihi na nke ahụ bụ nsogbu nsụgharị Bekee, ọ bụghị ezigbo nghọtahie dị n'ihe Grik.
