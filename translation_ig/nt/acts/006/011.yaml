  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τότε ὑπέβαλον ἄνδρας λέγοντας ὅτι Ἀκηκόαμεν αὐτοῦ λαλοῦντος ῥήματα βλάσφημα εἰς Μωϋσῆν καὶ τὸν θεόν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/011.yaml
  text: Then they secretly induced men to say[a], “We have heard him speaking blasphemous words against Moses and God.”
translation:
  language: ig
  text: Mgbe ahụ, ha ji nzuzo kpalie ndị ikom ka ha kwuo,[a] “Anyị anụla ka ọ na-ekwu okwu nkwulu megide Mosis na Chineke.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ha kpaliri ndị ikom na nzuzo”; ma ọ bụ, “ha gbara ndị ikom ume na nzuzo ka ha kwuo.” Ngwaa Grik ahụ na-egosi ịkpalite mmadụ ime ihe n’ụzọ zoro ezo ma ọ bụ n’ụzọ aghụghọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Mgbe ahụ
  rationale: Ọ bụ njikọ oge dị mfe nke na-ewebata ihe ọzọ mere n’akụkọ ahụ.
- source_word: ὑπέβαλον
  choice: ha ji nzuzo kpalie
  rationale: Nhọrọ a na-egosi ma ime ka ndị ahụ kwuo okwu ahụ ma ụzọ aghụghọ na nke zoro ezo e si mee ya.
- source_word: ἄνδρας
  choice: ụfọdụ ndị ikom
  rationale: ἀνήρ na-ezo kpọmkwem aka n’ụmụ nwoke; ‘ụfọdụ’ na-eme ka okwu Igbo bụrụ nke eke n’agbanyeghị na ọ bụghị okwu dị iche n’asụsụ Grik.
- source_word: λέγοντας
  choice: ka ha kwuo
  rationale: A sụgharịrị participle ahụ n’ụzọ Igbo si ekwu ihe onye ọzọ kpaliri mmadụ ime.
- source_word: Ἀκηκόαμεν
  choice: Anyị anụla
  rationale: Ụdị perfect na-egosi ihe ha nụrụ nke ka dị mkpa ugbu a; ‘anụla’ na-echekwa echiche ahụ.
- source_word: αὐτοῦ λαλοῦντος
  choice: ka ọ na-ekwu
  rationale: Nke a bụ ụzọ Igbo dị mma isi kwuo na ha nụrụ ya mgbe ọ na-ekwu okwu.
- source_word: ῥήματα βλάσφημα
  choice: okwu nkwulu
  rationale: Ọ na-echekwa ọdịdị na ike ebubo okpukpe dị n’okwu Grik ahụ n’enweghị ime ka ebubo ahụ bụrụ eziokwu.
- source_word: εἰς Μωϋσῆν καὶ τὸν θεόν
  choice: megide Mosis na Chineke
  rationale: N’ọnọdụ ebubo a, εἰς na-egosi na okwu ahụ chere ihu megide ha.
theological_decisions:
- issue: Ụdị ebubo e boro Stivin
  choice: E depụtara ya dị ka ebubo na ọ kwuru ‘okwu nkwulu megide Mosis na Chineke.’
  alternative: ‘okwu nkwutọ megide Mosis na Chineke’
  rationale: ‘Okwu nkwulu’ na-echekwa ike okwu βλάσφημα n’ihe gbasara iwu na okpukpe, ebe akụkọ ahụ ka na-egosi na ọ bụ ihe ndị a kpaliri ndị ikom ahụ ikwu, ọ bụghị nkwenye onye ntụgharị na ebubo ahụ bụ eziokwu.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị ùgwù ma doo onye nkịtị anya. ‘Ji nzuzo kpalie’ na-ebupụta aghụghọ dị na ngwaa Grik; ‘okwu nkwulu’ na-echekwa ịdị arọ nke ebubo ahụ.
