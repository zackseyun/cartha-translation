  yaml_path: translation/nt/acts/006/010.yaml
  text: And they were not able to withstand the wisdom and the Spirit by which he was speaking[a].
translation:
  language: ig
  text: Ha enweghị ike iguzogide amamihe na Mmụọ nke o ji na-ekwu okwu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “amamihe na mmụọ nke o ji na-ekwu okwu,” ma ọ bụrụ na πνεύματι na-ezo aka na mmụọ nke Stivin n'onwe ya, ọ bụghị Mmụọ Nsọ.
    reason: alternative_reading
lexical_decisions:
- source_word: ἴσχυον
  choice: ha enweghị ike
  rationale: Oge imperfect nke ἰσχύω n'ebe a na-egosi enweghị ike na-aga n'ihu; nkebi a bụ Igbo doro anya ma kwekọọ n'echiche Grik.
- source_word: ἀντιστῆναι
  choice: iguzogide
  rationale: Ọ na-egosi iguzosi ike megide onye ma ọ bụ ihe, karịchaa n'arụmụka; “iguzogide” bụ okwu Igbo kwesịrị ekwesị n'ọnọdụ a.
- source_word: σοφίᾳ
  choice: amamihe
  rationale: Ọ na-ezo aka n'amamihe pụtara ìhè n'okwu Stivin; Igbo anaghị achọ ka e tinye okwu ọzọ iji gosipụta article Grik ebe a.
- source_word: πνεύματι
  choice: Mmụọ ahụ
  rationale: Ihe gbara amaokwu a gburugburu, karịchaa Ọrụ Ndị Ozi 6:5, na-akwado na ọ bụ Mmụọ Nsọ; mkpụrụedemede ukwu na “ahụ” na-egosi onye a kapịrị ọnụ, ma e debere ohere nke mmụọ Stivin n'okpuru peeji.
- source_word: ᾧ ἐλάλει
  choice: o ji na-ekwu okwu
  rationale: “Ji” na-egosipụta dative nke ụzọ ma ọ bụ onye na-enye ike, ebe “na-ekwu okwu” na-echekwa omume na-aga n'ihu nke imperfect ἐλάλει.
theological_decisions:
- issue: Ma πνεύματι ọ na-ezo aka na Mmụọ Nsọ ka ọ bụ mmụọ nke Stivin n'onwe ya
  choice: Mmụọ ahụ
  alternative: mmụọ ya
  rationale: Akwụkwọ Ọrụ Ndị Ozi akọwalarị Stivin dị ka onye jupụtara na Mmụọ Nsọ, njikọ amamihe na Mmụọ na-akwadokwa nghọta a. Ma ebe okwu Grik n'onwe ya anaghị emechi nghọta ọzọ kpamkpam, e debere ya n'okpuru peeji.
translation_notes:
  register: Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ “iguzogide” maka esemokwu nke okwu na arụmụka, ma chekwaa mgbagwoju anya dị na πνεύματι site n'okpuru peeji.
