  verdict: revise
  source_fidelity: A chọrọ mgbanwe abụọ iji kwekọọ nke ọma na Grik. καὶ bụ njikọ na-aga n'ihu, ọ bụghị njikọ mmegide; ya mere “Ma” na-agbakwunye ọdịiche na-adịghị na amaokwu a. Ọzọkwa, “Mmụọ nke o ji na-ekwu okwu” na-ejikọta ᾧ n'ụzọ doro anya na πνεύματι ma na-echekwa imperfect nke ἐλάλει site na “na-ekwu okwu.”
  naturalness: “Ha enweghị ike iguzogide amamihe na Mmụọ nke o ji na-ekwu okwu” bụ Standard Igbo eke ma doo anya. Iwepu “ahụ” na-eme ka nkebiokwu ikwu okwu ghara iyi ka ọ na-arụtụ aka n’ihe e kwuburu kpọmkwem, ebe nnukwu mkpụrụedemede na-egosi ọgụgụ a họpụtara.
  terminology: “amamihe,” “iguzogide,” na “Mmụọ” dabara adaba. E kwesịghị ịsụgharị πνεύματι kpọmkwem dịka “Mmụọ Nsọ” n’ahịrị isi, n’ihi na ụdị okwu Grik ka na-ahapụ ohere maka mmụọ Stivin; a na-echekwa nke a n’okpuru peeji.
