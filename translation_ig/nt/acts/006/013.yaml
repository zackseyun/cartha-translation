id: ACT.6.13
reference: Acts 6:13
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἔστησάν τε μάρτυρας ψευδεῖς λέγοντας· Ὁ ἄνθρωπος οὗτος οὐ παύεται ⸂λαλῶν ῥήματα⸃ κατὰ τοῦ τόπου τοῦ ⸀ἁγίου καὶ τοῦ νόμου,
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/013.yaml
  text: They also set up false witnesses who said[c][b][a], “This man does not stop speaking against this holy place and the law,”
translation:
  language: ig
  text: Ha kpọpụtakwara ndị akaebe ụgha, ndị kwuru sị, “Nwoke a anaghị akwụsị[b] ikwu okwu[c] megide ebe nsọ a[a] na Iwu ahụ.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ebe nsọ ahụ.” N’ọnọdụ a, okwu Grik ahụ na-ezo kpọmkwem n’ụlọ nsọ.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “adịghị akwụsị ikwu.”
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “ikwu” ma ọ bụ “ikwu ihe” megide ebe nsọ a na Iwu ahụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔστησάν
  choice: kpọpụtara
  rationale: N’ọnọdụ ikpe a, okwu ahụ pụtara ime ka ndị akaebe pụta n’ihu ma ọ bụ iweta ha ka ha gbaa akaebe. “Kpọpụtara” na-egosi iweta ha n’ihu n’enweghị ịgbakwụnye nkọwa na-adịghị n’ihe odide ahụ.
- source_word: τε
  choice: -kwara
  rationale: Mgbakwunye “-kwara” na-egosi na nke a bụkwa ihe ọzọ ha mere n’usoro ihe ndị a kọrọ.
- source_word: μάρτυρας ψευδεῖς
  choice: ndị akaebe ụgha
  rationale: Nke a bụ okwu Igbo doro anya maka ndị na-agba akaebe na-abụghị eziokwu, ma na-edobe echiche nke ọnọdụ ikpe.
- source_word: λέγοντας
  choice: ndị kwuru sị
  rationale: Nkebiokwu a na-ada nke ọma n’Igbo ma na-ejikọta ndị akaebe ahụ na ihe ha kwuru.
- source_word: Ὁ ἄνθρωπος οὗτος
  choice: Nwoke a
  rationale: Ọ na-enye ntụaka kpọmkwem nke okwu Grik ahụ n’ụzọ dị mfe ma dịkwa ugwu, n’enweghị ime ka nlelị dị n’okwu ahụ sie ike karịa ka o kwesịrị.
- source_word: οὐ παύεται
  choice: anaghị akwụsị
  rationale: Ọ na-egosi omume na-aga n’ihu mgbe niile, dịka ọdịdị ngwaa Grik ahụ si dị.
- source_word: λαλῶν ῥήματα
  choice: ikwu okwu
  rationale: “Ikwu okwu” bụ ụzọ Igbo ebumpụta ụwa si egosipụta akpaalaokwu Grik ahụ; ọ na-eburu echiche nke ikwu ihe n’enweghị literalism na-adịghị eke.
- source_word: κατὰ
  choice: megide
  rationale: N’ebo ebubo iro a, okwu ahụ pụtara okwu a na-ekwu n’ụzọ na-emegide ebe nsọ na Iwu ahụ.
- source_word: τοῦ τόπου τοῦ ἁγίου
  choice: ebe nsọ a
  rationale: Ọ bụ ezie na Grik ji mkpụrụokwu njirimara mee ihe, ndị na-ebo ebubo ahụ na-ekwu maka ebe nsọ dị ha n’ihu, ya bụ ụlọ nsọ dị na Jerusalem. “Ebe nsọ a” na-egosipụta ntụaka ahụ n’ụzọ Igbo na-ada nke ọma.
- source_word: νόμου
  choice: Iwu ahụ
  rationale: N’ọnọdụ ndị Juu a, okwu ahụ na-ezo aka n’Iwu Mosis. Mkpụrụedemede ukwu na-enyere onye na-agụ aka ịhụ na ọ bụghị iwu nkịtị ka a na-ekwu maka ya.
theological_decisions:
- issue: Ihe “ebe nsọ” na “Iwu” na-ezo aka na ya
  choice: Ebo ebubo ahụ metụtara ụlọ nsọ dị na Jerusalem na Iwu Mosis.
  alternative: Iwere ya dịka ebe nsọ na usoro iwu n’ozuzu ha.
  rationale: Ọnọdụ akụkọ dị nso na-ekwu maka ebubo e boro Stivin gbasara ụlọ nsọ na Mosis. Nsụgharị ahụ anaghị akọwasa ihe ndị a n’ime amaokwu ahụ karịa okwu ndị na-ebo ebubo ahụ.
- issue: Ụdị olu e ji boo ebubo
  choice: Idobe olu ikpe na iro dị n’okwu ahụ n’enweghị ime ka ebubo ahụ sie ike karịa Grik.
  alternative: Iji okwu nkọwa dịka “ikwulu Chineke” ma ọ bụ “ikwutọ.”
  rationale: Ọ bụ ezie na ndị akaebe ahụ bụ ndị ụgha, okwu Grik nke ebubo ha bụ “ikwu okwu megide,” ọ bụghị okwu ọzọ siri ike nke onye nsụgharị ga-etinye.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị mfe ma dịkwa ugwu, dee ya. “Ndị akaebe ụgha” na “kpọpụtara” na-edobe ọnọdụ ikpe ahụ; “ikwu okwu megide” na-edobe ike ebubo ahụ n’enweghị ịgbakwụnye nkọwa okpukpe na-adịghị n’ihe odide Grik.
