- from: 'N’abalị[a], ọhụụ pụtara Pọl: otu nwoke Masedonia[b] guzo, na-arịọsi ya ike, sị, “Gafeta bata na Masedonia[c], nyere anyị aka.”'
  to: 'N’abalị[a], ọhụụ pụtara Pọl: otu nwoke, onye Masedonia[b], nọ na-eguzo, na-arịọsi ya ike, sị, “Gafee bịa na Masedonia[c], nyere anyị aka.”'
  rationale: 'The revision improves idiomatic Standard Igbo and corrects the participial footnote while retaining every source element: the nighttime setting, the vision''s appearance to Paul, an indefinite Macedonian man standing, his earnest appeal, the crossing/coming to Macedonia, and the request for help. It does not specify the phenomenology of the vision.'
