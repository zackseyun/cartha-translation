id: ACT.16.9
reference: Acts 16:9
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ὅραμα ⸀διὰ νυκτὸς ⸂τῷ Παύλῳ ὤφθη⸃, ἀνὴρ ⸂Μακεδών τις ἦν⸃ ἑστὼς ⸀καὶ παρακαλῶν αὐτὸν καὶ λέγων· Διαβὰς εἰς Μακεδονίαν βοήθησον ἡμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/009.yaml
  text: 'And a vision appeared to Paul in the night: a certain Macedonian man was standing and urging him[a], saying[c][b], “Come over into Macedonia and help us.”'
translation:
  language: ig
  text: 'N’abalị[a], ọhụụ pụtara Pọl: otu nwoke, onye Masedonia[b], nọ na-eguzo, na-arịọsi ya ike, sị, “Gafee bịa na Masedonia[c], nyere anyị aka.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “n’oge abalị” ma ọ bụ “mgbe chi jiri.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ “otu nwoke si Masedonia.”
    reason: lexical_alternative
  - marker: c
    text: N’asụsụ Grik, ọ bụ “gafee bịa na Masedonia, nyere anyị aka”; “gafee bịa” na-egosipụta ike idiomatic nke participle ahụ na imperative.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅραμα
  choice: ọhụụ
  rationale: “Ọhụụ” bụ okwu Igbo doro anya maka ihe e gosiri mmadụ n’ụzọ pụrụ iche; ọ naghị ekpebi ma ahụmahụ ahụ bụ nrọ, echiche dị n’ime obi, ka ọ bụ ọdịdị a hụrụ anya.
- source_word: διὰ νυκτός
  choice: n’abalị
  rationale: Nke a na-egosi oge ọhụụ ahụ mere n’ụzọ dị mfe ma bụrụkwa Igbo a na-asụ ugbu a.
- source_word: τῷ Παύλῳ ὤφθη
  choice: pụtara Pọl
  rationale: 'Ụdị a na-enye ihe passive nke ὤφθη n’Igbo eke: ọhụụ ahụ pụtara ya, kama ịsụgharị ya n’ụzọ siri ike dịka “Pọl hụrụ ya.”'
- source_word: ἀνὴρ Μακεδών τις
  choice: otu nwoke Masedonia
  rationale: “Nwoke” na-edebe kpọmkwem okike ἀνήρ, “otu” na-egosikwa indefiniteness nke τις; “Masedonia” na-akọwa onye nwoke ahụ bụ.
- source_word: ἑστώς
  choice: guzo
  rationale: Nke a na-echekwa ọnọdụ nwoke ahụ n’ọhụụ ahụ n’enweghị itinye ihe ọzọ ederede na-ekwughị.
- source_word: παρακαλῶν
  choice: na-arịọsi ya ike
  rationale: Nke a na-egosi arịrịọ siri ike dị na παρακαλέω, ma ọ naghị eme ka ọ bụrụrịrị ịrịọ arịrịọ n’ụzọ oke mwute.
- source_word: λέγων
  choice: sị
  rationale: “Sị” bụ ụzọ Igbo eke na nkenke isi webata okwu e kwuru kpọmkwem.
- source_word: Διαβάς
  choice: Gafeta bata
  rationale: Aorist participle ahụ jikọtara na imperative na-egosi ịgafe bịa; “gafeta bata” na-egosipụta ma ịgafe ókè ma ije bata n’ebe Masedonia dị.
- source_word: εἰς Μακεδονίαν
  choice: na Masedonia
  rationale: Mgbe “bata” gachara, “na Masedonia” na-egosipụta ije banye n’ime mpaghara ahụ n’Igbo eke.
- source_word: βοήθησον ἡμῖν
  choice: nyere anyị aka
  rationale: Nke a bụ arịrịọ iwu kpọmkwem, dị mfe ma doo anya n’Igbo ugbu a.
theological_decisions:
- issue: Ụdị ahụmahụ ὅραμα na ὤφθη na-akọwa
  choice: Ịsụgharị ya dị ka ọhụụ pụtara Pọl, n’akọwaghị usoro ahụmahụ ahụ karịa ihe ederede kwuru.
  alternative: Ịkpọ ya nrọ, mmetụta e tinyere n’obi, ma ọ bụ ọdịdị anụ ahụ pụtara ìhè.
  rationale: Ederede ahụ kpọrọ ya ọhụụ ma kwuo na ọ pụtara Pọl n’abalị. Nsụgharị a na-edebe ọdịdị mkpughe ahụ, ma ọ naghị amanye nkọwa banyere otu Pọl si hụ ya.
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-edebe ọdịdị ọhụụ ahụ na arịrịọ siri ike nke nwoke ahụ, ma na-ezere okwu chọọchị pụrụ iche ma ọ bụ nkọwa okpukpe ederede na-ekwughị.
