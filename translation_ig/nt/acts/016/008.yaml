- from: Ya mere, mgbe ha gafere Misia[a], ha rịdara gaa Troas.
  to: Ha gafere Misia[a], gbadaa gaa Troas.
  rationale: The revision removes the unwarranted causal force of “Ya mere,” uses a more natural Igbo travel expression for “went down,” and revises the note to preserve the limited ambiguity of παρελθόντες without overstating the narrative implication.
