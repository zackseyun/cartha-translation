  text: παρελθόντες δὲ τὴν Μυσίαν κατέβησαν εἰς Τρῳάδα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/008.yaml
  text: So[a], passing by Mysia, they went down to Troas.
translation:
  language: ig
  text: Ha gafere Misia[a], gbadaa gaa Troas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “mgbe ha gafere Misia,” “ka ha na-agafe Misia,” ma ọ bụ “ka ha na-agafe Misia n’akụkụ.” Okwu Grik a pụrụ ịghọta dịka ịgafe ógbè ahụ ma ọ bụ ịgabiga ya n’akụkụ; ọ naghị akọwa nke ọma ma hà kwụsịrị n’ebe ahụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρελθόντες
  choice: mgbe ha gafere
  rationale: Nkebi a na-egosi na ha gara n’ihu gafee ógbè Misia kama ịnọ ebe ahụ. Okwu Igbo a na-ada nke ọma ma na-edobekwa ohere nke ịghọta ya dị ka ịgafe n’ime ógbè ahụ ma ọ bụ ịgafe ya n’akụkụ.
- source_word: δὲ
  choice: Ya mere,
  rationale: δὲ bụ njikọ dị nro n’akụkọ a. “Ya mere” na-ejikọta ihe a na amaokwu bu ya ụzọ n’ụzọ nkịtị, na-enweghị ime ka ọ bụrụ nnukwu mmegide.
- source_word: Μυσίαν
  choice: Misia
  rationale: A sụgharịghị aha ógbè ahụ; e dere ya dịka ụda ya si kwekọọ n’usoro mkpụrụedemede Igbo.
- source_word: κατέβησαν
  choice: ha rịdara
  rationale: Nke a na-echekwa ntụgharị mmegharị nke καταβαίνω, nke pụtara isi n’elu gaa n’ala ma ọ bụ ịga ebe dị ala.
- source_word: εἰς
  choice: gaa
  rationale: N’ebe aha obodo bụ ebe njem na-aga, “gaa” na-egosipụta ebe ha na-aga n’Igbo eke.
- source_word: Τρῳάδα
  choice: Troas
  rationale: E debere aha ebe ahụ n’ụdị a na-ahụkarị ná nsụgharị Baịbụl Igbo.
theological_decisions: []
translation_notes:
  register: E ji Igbo ọkọlọtọ, nke dị ugbu a ma dị ùgwù, dee ya. A họọrọ ahịrịokwu dị mfe nghọta, ebe e debere nghọtahie dị n’okwu Grik n’ihe odide ala peeji.
