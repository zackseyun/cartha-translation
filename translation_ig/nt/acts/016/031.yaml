  text: οἱ δὲ εἶπαν· Πίστευσον ἐπὶ τὸν κύριον ⸀Ἰησοῦν, καὶ σωθήσῃ σὺ καὶ ὁ οἶκός σου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/031.yaml
  text: And they said[a], “Believe in the Lord Jesus[b], and you will be saved—you and your household.”
translation:
  language: ig
  text: Ha wee sị, “Kwere n’Onyenwe anyị Jizọs[a], a ga-azọpụta gị—gị na ezinaụlọ gị[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Tụkwasị Onyenwe anyị Jizọs obi.”
    reason: lexical_alternative
  - marker: b
    text: “Ezinụlọ gị” na-ezo aka n’ụlọ mmadụ dị ka otu ndị mmadụ, ọ bụghị ụlọ ahụ dị ka ihe owuwu.
    reason: cultural_note
lexical_decisions:
- source_word: οἱ δὲ εἶπαν
  choice: Ha wee sị
  rationale: δέ bụ njikọ dị nro n’akụkọ a; “wee” na-eme ka akụkọ ahụ na-aga nke ọma n’Igbo n’etinyeghị echiche nke nnukwu esemokwu.
- source_word: Πίστευσον
  choice: Kwere
  rationale: Okwu iwu a na-akpọ onye nche ụlọ mkpọrọ ka o jiri mkpebi zaghachi. “Kwere” bụ okwu Igbo doro anya ma kwekọọ na asụsụ Agba Ọhụrụ banyere okwukwe.
- source_word: ἐπὶ τὸν
  choice: na
  rationale: Mgbe “kwere” sochiri ya, “na” na-egosi onye okwukwe ahụ chere ihu; “kwere na” bụ ụzọ Igbo dị mma isi kwuo ya.
- source_word: κύριον Ἰησοῦν
  choice: Onyenwe anyị Jizọs
  rationale: “Onyenwe anyị” na-echekwa nsọpụrụ na ibu nkà mmụta okpukpe nke κύριος, ebe “Jizọs” bụ nsụgharị aha ahụ a na-ejikarị n’Igbo.
- source_word: σωθήσῃ
  choice: a ga-azọpụta gị
  rationale: Nke a na-echekwa ọdịdị ọdịnihu na nke nnara nke ngwaa Grik ahụ, ma hapụkwa obosara nke nzọpụta n’ọnọdụ a n’enweghị ime ka ọ bụrụ naanị nnapụta anụ ahụ.
- source_word: σὺ καὶ ὁ οἶκός σου
  choice: gị na ndị ezinụlọ gị
  rationale: οἶκος na-ezo aka ná ndị mejupụtara ụlọ ahụ, ọ bụghị ụlọ ahụ dị ka ihe owuwu. “Ndị ezinụlọ gị” bụ okwu Igbo a na-aghọta nke ọma maka ndị nọ n’otu ụlọ na mmekọrịta ezinụlọ.
theological_decisions:
- issue: Ókè nkwa ahụ gbasara “gị na ndị ezinụlọ gị”
  choice: E debere okwu ahụ n’ụzọ kwụ ọtọ n’emeghị ka o kwuo na okwukwe otu onye na-azọpụta ndị ọzọ ozugbo.
  alternative: Ịkọwa ya dị ka nzọpụta ndị ụlọ ahụ niile site naanị n’okwukwe onye nche ụlọ mkpọrọ, ma ọ bụ ime ka okwu ahụ metụta naanị ya n’onwe ya.
  rationale: Grik ahụ tinyere ya na ndị ezinụlọ ya n’okwu nkwa ahụ, ma amaokwu a naanị ya akọwaghị ụzọ onye ọ bụla n’ime ha si enweta nzọpụta. Nsụgharị ahụ na-ahapụ esemokwu nkà mmụta okpukpe ahụ ka ọ dị.
translation_notes:
  register: E ji Standard Igbo nke dị ugbu a, dị ùgwù ma dị mfe nghọta. Akara ụkwụ [a] dị n’akụkụ “Kwere,” ebe [b] dị n’akụkụ “ndị ezinụlọ gị,” ka nke ọ bụla kwekọọ n’ezi nkọwa ya.
