revisions:
- from: Ha wee sị, “Kwere[a] na Onyenwe anyị Jizọs, a ga-azọpụta gị—gị na ndị ezinụlọ gị[b].”
  to: Ha wee sị, “Kwere n’Onyenwe anyị Jizọs[a], a ga-azọpụta gị—gị na ezinaụlọ gị[b].”
  rationale: The revision corrects the faith-object construction by changing “na” to “n’,” retains the conventional respectful title for Jesus without adding material absent from the Greek, and renders οἶκος with the singular collective “ezinaụlọ.” The cultural note is adjusted to explain household as people rather than a building and to avoid implying a narrower family-only group.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T09:20:05Z'
review_pass:
  verdict: revise
  source_fidelity: A safe revision is needed. The draft’s “Kwere na” normally introduces what one believes (e.g., ‘believe that’), whereas πιστεύω ἐπὶ here directs faith toward the Lord Jesus. “Kwere n’…” preserves that construction. “Ezinụlọ” is also a closer singular collective equivalent for οἶκος than the plural “ndị ezinụlọ,” while retaining the household scope without specifying its mechanism of salvation.
  naturalness: “Kwere n’Onyenwe anyị Jizọs” is natural, dignified Standard Igbo Christian usage. “Gị na ezinaụlọ gị” is concise and idiomatic. The revised note explains the social sense without the awkward shift from second-person “gị” to third-person “ya.”
  terminology: “Onyenwe anyị Jizọs” is retained as established Igbo Christian title usage for κύριον Ἰησοῦν; no absent title such as “Kraịst” is added. “A ga-azọpụta gị” appropriately retains the future passive sense of σωθήσῃ. The wording leaves unresolved how the household promise relates to each household member’s faith.
  issues:
  - severity: medium
    issue: The main text uses “Kwere na Onyenwe anyị Jizọs.”
    rationale: In Standard Igbo, “kwere na” commonly means ‘believe that,’ rather than ‘believe in/on’ a person. The prepositional contraction “n’” is needed to represent πιστεύω ἐπὶ τὸν as faith directed toward the Lord Jesus.
  - severity: low
    issue: “Ndị ezinụlọ gị” and its footnote are less precise than a collective household expression.
    rationale: οἶκος is singular and denotes the household unit, potentially broader than relatives alone. “Ezinụlọ gị” is a natural collective expression, and the note should consistently refer to the addressee’s household.
  revised_text: Ha wee sị, “Kwere n’Onyenwe anyị Jizọs[a], a ga-azọpụta gị—gị na ezinaụlọ gị[b].”
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “Tụkwasị Onyenwe anyị Jizọs obi.”
    reason: lexical_alternative
  - marker: b
    text: “Ezinụlọ gị” na-ezo aka n’ụlọ mmadụ dị ka otu ndị mmadụ, ọ bụghị ụlọ ahụ dị ka ihe owuwu.
    reason: cultural_note
  revision_rationale: The revision corrects the faith-object construction by changing “na” to “n’,” retains the conventional respectful title for Jesus without adding material absent from the Greek, and renders οἶκος with the singular collective “ezinaụlọ.” The cultural note is adjusted to explain household as people rather than a building and to avoid implying a narrower family-only group.
