revisions:
- from: Ya mere, mgbe anyị si Troas banye n’ụgbọ mmiri, anyị ji ụgbọ mmiri gaa kpọmkwem Samotraki, n’echi ya kwa, anyị eruo Neapolis.
  to: Ya mere, anyị ji ụgbọ mmiri hapụ Troas, gaa kpọmkwem Samotraki; n’echi ya, anyị gara Neapolis.
  rationale: The revision renders the nautical departure explicitly and idiomatically, retains the direct course specifically to Samothrace, and expresses the next day’s onward journey in natural Standard Igbo. The semicolon reflects the sequential itinerary without imposing an interpretation beyond the Greek.
  reviewer_model: gpt-5.6-terra
