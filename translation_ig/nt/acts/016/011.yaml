id: ACT.16.11
reference: Acts 16:11
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἀναχθέντες ⸀οὖν ⸀ἀπὸ Τρῳάδος εὐθυδρομήσαμεν εἰς Σαμοθρᾴκην, τῇ ⸀δὲ ἐπιούσῃ εἰς ⸂Νέαν Πόλιν⸃,
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/011.yaml
  text: So[a], after putting out to sea from Troas, we sailed straight to Samothrace, and on the following day to Neapolis,
translation:
  language: ig
  text: Ya mere, anyị ji ụgbọ mmiri hapụ Troas, gaa kpọmkwem Samotraki; n’echi ya, anyị gara Neapolis.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀναχθέντες
  choice: mgbe anyị si Troas banye n’ụgbọ mmiri
  rationale: N’ọnọdụ njem n’oké osimiri, ἀνάγω pụtara ịbanye ụgbọ mmiri wee pụọ. Nsụgharị a na-egosi mmalite njem mmiri ahụ n’Igbo dị mfe ma na-edobe usoro nke participle ahụ.
- source_word: οὖν
  choice: Ya mere
  rationale: οὖν na-ejikọta ihe a na akụkọ gara aga ma na-akwalite akụkọ ahụ n’ihu. “Ya mere” bụ njikọ doro anya ma dị ùgwù n’Igbo.
- source_word: ἀπὸ Τρῳάδος
  choice: si Troas
  rationale: ἀπό na-egosi ebe njem ahụ malitere; e dekwara aha obodo Τρῳάς dịka Troas kama ịsụgharị ya.
- source_word: εὐθυδρομήσαμεν
  choice: anyị ji ụgbọ mmiri gaa kpọmkwem
  rationale: Okwu a pụtara iji ụgbọ mmiri soro ụzọ kwụ ọtọ ruo ebe a na-aga. “Gaa kpọmkwem” na-edobe echiche nke njem na-enweghị ịgbagọ ụzọ n’asụsụ Igbo nke oge a.
- source_word: εἰς Σαμοθρᾴκην
  choice: Samotraki
  rationale: εἰς na-egosi ebe a na-aga; a sụgharịghị aha ebe ahụ, kama e dere ya n’ụdị dabara n’ụda na mkpụrụedemede Igbo.
- source_word: τῇ δὲ ἐπιούσῃ
  choice: n’echi ya kwa
  rationale: Nkebiokwu dative a pụtara n’ụbọchị sochirinụ. “N’echi ya kwa” bụ ụzọ Igbo e si akọ usoro njem, ebe “kwa” na-anọchi ọrụ δέ nke ịga n’ihu n’akụkọ.
- source_word: εἰς Νέαν Πόλιν
  choice: anyị eruo Neapolis
  rationale: εἰς na-egosi ebe njem ahụ na-aga. A hapụrụ Νέα Πόλις dịka aha obodo a maara, Neapolis; itinye “anyị eruo” na-eme ka ahịrịokwu ahụ zuo oke n’Igbo ma na-eweta ngwaa njem ahụ site n’akụkụ mbụ.
theological_decisions: []
translation_notes:
  register: Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E debere ụdị onye mbụ ọtụtụ (“anyị”) nke akụkọ njem ahụ, a hapụkwara aha obodo dịka aha pụrụ iche. Enweghị ihe mgbagwoju anya metụtara nkà mmụta okpukpe n’amaokwu a.
