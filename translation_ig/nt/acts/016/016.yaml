revisions:
- from: O wee ruo na mgbe anyị na-aga n'ebe a na-ekpe ekpere, otu nwa agbọghọ ohu nke nwere mmụọ Paitọn[a] zutere anyị. Ọ na-ewetara ndị nwe ya nnukwu uru site n'ịgba afa.[b]
  to: O wee mee na, mgbe anyị na-aga n'ebe a na-ekpe ekpere, otu nwa agbọghọ ohu nke nwere mmụọ Paitọn[a] zutere anyị. Ọ na-ewetara ndị nwe ya nnukwu uru site n'ịgba afa.[b]
  rationale: The revision retains the draft's faithful rendering of the source while improving the narrative idiom and removing an interpretive addition from footnote b. It preserves the culturally specific wording for πνεῦμα πύθωνα in the main text and gives a restrained alternative in the footnote.
