id: ACT.16.16
reference: Acts 16:16
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἐγένετο δὲ πορευομένων ἡμῶν εἰς ⸀τὴν προσευχὴν παιδίσκην τινὰ ἔχουσαν πνεῦμα ⸀πύθωνα ⸀ὑπαντῆσαι ἡμῖν, ἥτις ἐργασίαν πολλὴν παρεῖχεν τοῖς κυρίοις αὐτῆς μαντευομένη·
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/016.yaml
  text: And it happened that, as we were going to the place of prayer, a certain servant girl who had a python spirit met us, and she was bringing much profit to her masters by fortune-telling.
translation:
  language: ig
  text: O wee mee na, mgbe anyị na-aga n'ebe a na-ekpe ekpere, otu nwa agbọghọ ohu nke nwere mmụọ Paitọn[a] zutere anyị. Ọ na-ewetara ndị nwe ya nnukwu uru site n'ịgba afa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “mmụọ ịgba afa.” Grik kwuru kpọmkwem “mmụọ Paitọn,” okwu omenala pụrụ iche nke metụtara ịgba afa.
    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ, “site n’ịgba amụma.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: O wee ruo na
  rationale: Ọ bụ ụzọ Igbo dị ugwu ma dịkwa mfe isi webata ihe ọhụrụ mere n’akụkọ, na-enweghị iji okwu ochie gabiga ókè.
- source_word: πορευομένων ἡμῶν
  choice: mgbe anyị na-aga
  rationale: Ọ na-egosi na ịga ahụ ka na-aga n’ihu mgbe ihe ọzọ mere.
- source_word: εἰς τὴν προσευχὴν
  choice: n'ebe a na-ekpe ekpere
  rationale: N’ebe a, okwu Grik ahụ nwere ike izo aka n’ebe a maara nke e ji ekpe ekpere, ọ bụghị naanị n’omume ikpe ekpere.
- source_word: παιδίσκην τινά
  choice: otu nwa agbọghọ ohu
  rationale: Ọ na-egosi ma na ọ bụ nwa agbọghọ ma na ọ nọ n’ọnọdụ ohu; ndị nwe ya na-eritekwa uru n’ọrụ ya.
- source_word: ἔχουσαν πνεῦμα πύθωνα
  choice: nke nwere mmụọ Paitọn
  rationale: Nke a na-edobe aha omenala pụrụ iche dị n’asụsụ Grik kama ịgbanwe ya ozugbo ka ọ bụrụ naanị nkọwa banyere ịgba afa.
- source_word: ὑπαντῆσαι ἡμῖν
  choice: zutere anyị
  rationale: Ọ bụ nsụgharị Igbo doro anya ma kwekọọ n’ihe infinitive ahụ pụtara n’usoro akụkọ a.
- source_word: ἐργασίαν πολλὴν παρεῖχεν
  choice: na-ewetara ... nnukwu uru
  rationale: Ọ na-egosi uru akụ na ụba dị ukwuu ọ na-ewetara ha mgbe niile, dịka imperfect Grik ahụ si gosi.
- source_word: τοῖς κυρίοις αὐτῆς
  choice: ndị nwe ya
  rationale: N’ọnọdụ a, κύριοι bụ ndị nwere ikike nwe ohu ahụ, ọ bụghị aha nsọ ‘Onyenweanyị.’
- source_word: μαντευομένη
  choice: site n'ịgba afa
  rationale: ‘Ịgba afa’ bụ okwu Igbo a na-aghọta nke ọma maka omume ikwu ihe site n’ịjụ mmụọ ma ọ bụ ụzọ amụma nzuzo.
theological_decisions:
- issue: Otu e si asụgharị πνεῦμα πύθωνα, okwu omenala metụtara amụma na ịgba afa
  choice: mmụọ Paitọn
  alternative: mmụọ na-eme ka mmadụ gbaa afa
  rationale: Isi ederede na-edobe okwu omenala pụrụ iche nke Grik ma tinye nkọwa ya n’ala peeji, ka a ghara idozi ihe okwu ahụ pụtara n’otu ụzọ naanị.
- issue: Ma παιδίσκη kwesịrị igosi ọnọdụ ohu nwa agbọghọ ahụ
  choice: nwa agbọghọ ohu
  alternative: nwa agbọghọ na-eje ozi
  rationale: Ebe ndị nwe ya na-enweta uru site n’aka ya na-eme ka ọnọdụ ịbụ ohu pụta ìhè; ‘na-eje ozi’ nwere ike ime ka njide na mmegbu ahụ ghara ịpụta nke ọma.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, dị ugwu ma dị mfe nghọta. ‘Nwa agbọghọ ohu’ na-eme ka ọnọdụ mmekọrịta mmadụ na ibe ya pụta ìhè; ‘mmụọ Paitọn’ na-edobe ọdịdị pụrụ iche nke okwu Grik, ebe nkọwa ala peeji na-enyere onye na-agụ ya aka.
