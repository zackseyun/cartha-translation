id: ACT.16.37
reference: Acts 16:37
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ δὲ Παῦλος ἔφη πρὸς αὐτούς· Δείραντες ἡμᾶς δημοσίᾳ ἀκατακρίτους, ἀνθρώπους Ῥωμαίους ὑπάρχοντας, ἔβαλαν εἰς φυλακήν· καὶ νῦν λάθρᾳ ἡμᾶς ἐκβάλλουσιν; οὐ γάρ, ἀλλὰ ἐλθόντες αὐτοὶ ⸀ἡμᾶς ἐξαγαγέτωσαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/037.yaml
  text: But Paul said to them[a], “After beating us publicly without trial, though we are Roman citizens, they threw us into prison; and now are they sending us out secretly? No indeed! Rather[c][b], let them come themselves and lead us out.”
translation:
  language: ig
  text: Ma Pọl gwara ha, “Ha tiri anyị ihe n’ihu ọha n’ekpeghị anyị ikpe[a], anyị bụ ụmụ amaala Rom[b], wee tụba anyị n’ụlọ mkpọrọ; ugbu a kwa, ha na-achụpụ anyị na nzuzo? Mba! Kama, ka ha onwe ha bịa kpọpụta anyị[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “a maghị anyị ikpe.”
    reason: lexical_alternative
  - marker: b
    text: N’asụsụ Grik, “ndị ikom bụ ndị Rom”; ihe ọ pụtara n’ebe a bụ na ha bụ ụmụ amaala Rom, ndị iwu Rom na-echebe.
    reason: cultural_note
  - marker: c
    text: A pụkwara ịsị, “dupụta anyị” ma ọ bụ “kpọrọ anyị pụta.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφη πρὸς αὐτούς
  choice: gwara ha
  rationale: Nke a bụ ụzọ Igbo dị mfe ma bụrụkwa nke nkịtị isi kọwaa okwu Pọl gwara ndị ahụ.
- source_word: Δείραντες
  choice: Ha tiri anyị ihe
  rationale: Ọ na-egosi iti ihe e mere tupu a tụba ha n’ụlọ mkpọrọ, n’enweghị ịkọwa ụdị ntaramahụhụ karịa ihe okwu Grik kwuru.
- source_word: δημοσίᾳ
  choice: n’ihu ọha
  rationale: Ọ na-egosipụta n'ụzọ Igbo doro anya na e mere ihe ahụ n’ebe mmadụ niile pụrụ ịhụ ya.
- source_word: ἀκατακρίτους
  choice: n’ekpeghị anyị ikpe
  rationale: Okwu ahụ pụtara na ụlọikpe amaghị ha ikpe; ntụgharị a na-edobe isi iwu ya ma ghara ikwu kpọmkwem na e nweghị usoro ikpe ọ bụla.
- source_word: ἀνθρώπους Ῥωμαίους ὑπάρχοντας
  choice: ọ bụ ezie na anyị bụ ụmụ amaala Rom
  rationale: N’ọnọdụ a, ịbụ ndị Rom bụ ọnọdụ ụmụ amaala nwere nchebe iwu; usoro nkwenye a dabara n’Igbo ma gosipụta esemokwu dị n’okwu Pọl.
- source_word: ἔβαλαν εἰς φυλακήν
  choice: tụbakwa anyị n’ụlọ mkpọrọ
  rationale: ‘Tụba’ na-edobe ike dị na βάλλω karịa ‘tinye,’ ma bụrụkwa okwu Igbo nkịtị.
- source_word: λάθρᾳ
  choice: na nzuzo
  rationale: Nke a bụ ihe kwekọrọ kpọmkwem na ime ihe n’enweghị ka ọha mara.
- source_word: ἐκβάλλουσιν
  choice: ha chọrọ ịchụpụ anyị
  rationale: Ọ na-egosipụta mmegharị a na-eme ugbu a na àgwà ịchụ ha pụọ, kama ịbụ naanị ịhapụ ha.
- source_word: οὐ γάρ
  choice: Mba, ọ gaghị ekwe omume!
  rationale: Nke a na-eburu nkwụsi ike nke ajụjụ Pọl n’Igbo eke.
- source_word: ἐλθόντες αὐτοὶ ἡμᾶς ἐξαγαγέτωσαν
  choice: ka ha onwe ha bịa kpọpụta anyị
  rationale: ‘Ha onwe ha’ na-edobe nkwusi ike dị na αὐτοὶ; ‘kpọpụta’ na-egosi na ha ga-abịa n’onwe ha wepụta ha n’ụlọ mkpọrọ.
theological_decisions:
- issue: Ike iwu dị n’ịbụ ndị Rom
  choice: ụmụ amaala Rom
  alternative: ndị Rom
  rationale: Ihe Pọl na-ekwu bụ ikike iwu ha nwere n’ihi ọnọdụ ụmụ amaala ha; ‘ụmụ amaala Rom’ na-eme ka nke a doo anya n’enweghị ịgbakwunye ozizi.
- issue: Nkọwa ἀκατακρίτους
  choice: n’ekpeghị anyị ikpe
  alternative: n’amaghị anyị ikpe
  rationale: Isi okwu Grik bụ na a maghị ha ikpe tupu e taa ha ahụhụ. Nhọrọ bụ isi na-ada nke ọma n’Igbo ma na-edobe obosara okwu ahụ; e nyere ụzọ nke ọzọ n’okpuru peeji.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-edobe olu Pọl siri ike, ọnọdụ iwu nke mkpesa ya, na ọdịiche dị n’etiti iti ha ihe n’ihu ọha na ịchụpụ ha na nzuzo.
