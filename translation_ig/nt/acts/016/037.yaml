revisions:
- from: Ma Pọl gwara ha, “Ha tiri anyị ihe n’ihu ọha, n’ekpeghị anyị ikpe[a], ọ bụ ezie na anyị bụ ụmụ amaala Rom[b], tụbakwa anyị n’ụlọ mkpọrọ; ugbu a kwa, ha chọrọ ịchụpụ anyị na nzuzo? Mba, ọ gaghị ekwe omume! Kama, ka ha onwe ha bịa kpọpụta anyị[c].”
  to: Ma Pọl gwara ha, “Ha tiri anyị ihe n’ihu ọha n’ekpeghị anyị ikpe[a], anyị bụ ụmụ amaala Rom[b], wee tụba anyị n’ụlọ mkpọrọ; ugbu a kwa, ha na-achụpụ anyị na nzuzo? Mba! Kama, ka ha onwe ha bịa kpọpụta anyị[c].”
  rationale: The revision preserves the legal and rhetorical force of the Greek while removing added meaning. It renders the present-tense ἐκβάλλουσιν as an ongoing proposed release/expulsion, reduces the refusal to the force actually expressed by οὐ γάρ, and corrects the lexical alternative for ἀκατακρίτους.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T09:20:06Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the public beating, lack of judicial condemnation, Roman citizenship, imprisonment, and Paul’s demand that the authorities personally bring them out. However, “ha chọrọ ịchụpụ anyị” means “they want to drive/send us out” and weakens the Greek present action ἐκβάλλουσιν (“are they sending/putting us out?”). “Ọ gaghị ekwe omume!” adds an assertion of impossibility beyond the emphatic refusal οὐ γάρ.
  naturalness: The revised wording is fluent Standard Igbo and retains Paul’s indignant rhetorical force. “Ha na-achụpụ anyị na nzuzo?” is natural in this prison-release context and represents the present-tense rhetorical question directly.
  terminology: “Ụmụ amaala Rom” appropriately communicates the civic-legal force of Ῥωμαίους. “N’ekpeghị anyị ikpe” suitably represents ἀκατακρίτους without narrowing it to a specific courtroom procedure. The alternative in footnote a is corrected because “n’amaghị anyị ikpe” can suggest that the authorities did not know the defendants rather than that no judgment was rendered.
  issues:
  - severity: medium
    issue: The expression “ha chọrọ ịchụpụ anyị” does not preserve the present action of ἐκβάλλουσιν.
    rationale: The Greek asks whether they are now sending them out secretly, not whether they merely desire or intend to do so.
  - severity: medium
    issue: “Ọ gaghị ekwe omume!” overstates οὐ γάρ.
    rationale: Paul’s words are an emphatic refusal (“No!”), not specifically a claim that the proposed action is impossible.
  - severity: medium
    issue: Footnote a’s alternative “n’amaghị anyị ikpe” is semantically misleading.
    rationale: It may be understood as “without knowing us/judging us by acquaintance,” whereas the Greek concerns absence of a judicial verdict or condemnation.
  revised_text: Ma Pọl gwara ha, “Ha tiri anyị ihe n’ihu ọha n’ekpeghị anyị ikpe[a], anyị bụ ụmụ amaala Rom[b], wee tụba anyị n’ụlọ mkpọrọ; ugbu a kwa, ha na-achụpụ anyị na nzuzo? Mba! Kama, ka ha onwe ha bịa kpọpụta anyị[c].”
  revised_footnotes:
  - marker: a
    text: A pụkwara ịsị, “a maghị anyị ikpe.”
    reason: lexical_alternative
  - marker: b
    text: N’asụsụ Grik, “ndị ikom bụ ndị Rom”; ihe ọ pụtara n’ebe a bụ na ha bụ ụmụ amaala Rom, ndị iwu Rom na-echebe.
    reason: cultural_note
  - marker: c
    text: A pụkwara ịsị, “dupụta anyị” ma ọ bụ “kpọrọ anyị pụta.”
    reason: lexical_alternative
  revision_rationale: The revision preserves the legal and rhetorical force of the Greek while removing added meaning. It renders the present-tense ἐκβάλλουσιν as an ongoing proposed release/expulsion, reduces the refusal to the force actually expressed by οὐ γάρ, and corrects the lexical alternative for ἀκατακρίτους.
