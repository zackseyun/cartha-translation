  text: ὃς ἐμαρτυρεῖτο ὑπὸ τῶν ἐν Λύστροις καὶ Ἰκονίῳ ἀδελφῶν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/002.yaml
  text: He was well spoken of by the brothers in Lystra and Iconium[a].
translation:
  language: ig
  text: Ụmụnna ndị nọ na Listra na Aịkoniọm na-agba ya ezi àmà[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Okwu ahụ “Ụmụnna” pụkwara ịgụnye ụmụnna nwoke na ụmụnna nwanyị, ya bụ, ndị kwere ekwe ibe ha nọ n’ebe ndị ahụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς
  choice: ya
  rationale: Nnọchiaha a na-ezo aka na Timoti a kpọrọ aha n’amaokwu nke mbụ; n’usoro okwu Igbo, a na-etinye ya dị ka nnọchiaha ihe e mere n’ahịrịokwu a.
- source_word: ἐμαρτυρεῖτο
  choice: gbaara ya ezi àmà
  rationale: Ngwaa a dị n’ụdị na-egosi na ndị ọzọ na-agba akaebe ọma banyere àgwà na aha Timoti. Akpaokwu Igbo a bụ nke e ji eme ihe n'ụzọ ebumpụta ụwa ma na-echekwa echiche nke àmà ọma.
- source_word: ὑπὸ
  choice: Ụmụnna ... gbaara ya
  rationale: N’asụsụ Grik, ὑπό na-egosi ndị mere ihe ahụ n’ahịrịokwu passive. Igbo na-egosipụta otu njikọ ahụ n'ụzọ doro anya site n’ime ka “Ụmụnna” bụrụ ndị mere omume ahụ.
- source_word: τῶν ἐν Λύστροις καὶ Ἰκονίῳ
  choice: ndị nọ na Listra na Aịkọniọm
  rationale: Nke a na-akọwa ụmụnna ndị bi ma ọ bụ nọ n’obodo abụọ ahụ, na-enweghị ịgbakwunye echiche na ha si ebe ahụ pụta.
- source_word: ἀδελφῶν
  choice: Ụmụnna
  rationale: “Ụmụnna” bụ okwu Igbo kwesịrị ekwesị maka ndị otu okwukwe. Ọ pụrụ ịgụnye ma ndị nwoke ma ndị nwanyị; nkọwa ala peeji mere nke a ka o doo anya.
theological_decisions:
- issue: Ma ἀδελφῶν ọ na-ezo naanị aka n’ụmụ nwoke ka ọ bụ n’ọgbakọ ndị kwere ekwe niile
  choice: Ụmụnna
  alternative: Ụmụnna nwoke na ụmụnna nwanyị; ndị kwere ekwe ibe ya
  rationale: Ụdị okwu Grik ahụ bụ masculine plural, ma n’ojiji ọgbakọ Ndị Kraịst ọ na-ejikarị ezo aka n’ebe ndị kwere ekwe niile nọ. Isi ederede na-eji okwu Igbo “Ụmụnna,” nke na-echekwa ihe oyiyi ezinụlọ ahụ ma nwee ike ịgụnye mmadụ niile; nkọwa ala peeji na-eme nkọwa ahụ ka o doo anya.
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe nke dị mfe, dị ugwu, ma bụrụ nke ndị mmadụ na-asụ taa. “Gbaara ya ezi àmà” na-enye echiche nke aha ọma Timoti n’enweghị ịgbatị ihe Grik kwuru.
