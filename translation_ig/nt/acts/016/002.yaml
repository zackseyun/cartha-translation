- from: Ụmụnna ndị nọ na Listra na Aịkọniọm gbaara ya ezi àmà[a].
  to: Ụmụnna ndị nọ na Listra na Aịkoniọm na-agba ya ezi àmà[a].
  rationale: The revision preserves the source’s favorable testimony and its imperfect aspect more closely by changing “gbaara” to “na-agba.” It also regularizes the rendering of Iconium as “Aịkoniọm.” The footnote retains the legitimate broader Christian-community sense of ἀδελφῶν while leaving the family-language term “Ụmụnna” in the main text.
  reviewer_model: gpt-5.6-terra
