  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ παραλαβὼν αὐτοὺς ἐν ἐκείνῃ τῇ ὥρᾳ τῆς νυκτὸς ἔλουσεν ἀπὸ τῶν πληγῶν, καὶ ἐβαπτίσθη αὐτὸς καὶ οἱ αὐτοῦ ⸀πάντες παραχρῆμα,
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/033.yaml
  text: And taking them in that hour of the night[a], he washed their wounds, and he was baptized at once[c][b], he and all his household.
translation:
  language: ig
  text: N’oge ahụ n’abalị, o kpọọrọ ha, saa ọnyá ha. E baptiziri ya ozugbo, ya na ndị niile nke ụlọ ya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ya na ndị nke ya niile.” Okwu Grik a na-ekwu maka ndị niile so n’ụlọ ya ma ọ bụ n’okirikiri ụlọ ya; ọ bụghị naanị ndị ikwu ya.
    reason: alternative_reading
lexical_decisions:
- source_word: παραλαβὼν
  choice: kpọrọ ha ... gaa
  rationale: Aorist participle na-egosi ihe onye nche ahụ mere tupu ọ saa ha; ntụgharị a na-egosi usoro omume ahụ n’Igbo nkịtị n’etinyeghị ebe ọ kpọgara ha.
- source_word: ἐν ἐκείνῃ τῇ ὥρᾳ τῆς νυκτός
  choice: n’otu oge ahụ n’abalị
  rationale: Nke a na-echekwa echiche banyere oge abalị ahụ kpọmkwem nakwa otú o si mee ngwa ngwa.
- source_word: ἔλουσεν ... ἀπὸ τῶν πληγῶν
  choice: saa ọnyá ha
  rationale: Ọ bụ ụzọ Igbo doro anya si kwuo na ọ sachara ebe mmerụ ahụ ha; ntụgharị nkịtị 'saa ha site n’ọnyá' agaghị ada ka Igbo e ji eme ihe.
- source_word: ἐβαπτίσθη
  choice: e mere ya ... baptizim
  rationale: Na-echekwa olu nnara nke ngwaa Grik ma ghara ikpebi ụzọ e si mee baptizim.
- source_word: οἱ αὐτοῦ πάντες
  choice: ndị niile nọ n’ezinụlọ ya
  rationale: Nke a sara mbara karịa naanị ndị ikwu ya, ma na-ezo aka n’ụmụ mmadụ niile nọ n’okirikiri ụlọ ya.
- source_word: παραχρῆμα
  choice: Ozugbo ahụ
  rationale: Na-egosi na baptizim ahụ mere n’egbughị oge ma na-echekwa ike akụkọ ahụ.
theological_decisions:
- issue: Ókè ndị οἱ αὐτοῦ πάντες gụnyere na baptizim
  choice: ndị niile nọ n’ezinụlọ ya
  alternative: ezinụlọ ya niile; ndị nke ya niile
  rationale: Amaokwu ahụ ekwughị afọ ndụ ha, ụdị nkwupụta okwukwe onye ọ bụla mere, ma ọ bụ ụzọ e si mee baptizim. Ya mere, ntụgharị ahụ anaghị ekpebi esemokwu ụka ndị mechara bilie.
translation_notes:
  register: Igbo Izugbe nke oge a, dị mfe nghọta ma dịkwa ugwu. E kewara ahịrịokwu ahụ ụzọ abụọ ka usoro omume doo anya. E tinyere akara [a] kpọmkwem n’isiokwu ọ na-akọwa.
