  variant: Standard Igbo
source:
  edition: SBLGNT
  text: αἰτήσας δὲ φῶτα εἰσεπήδησεν καὶ ἔντρομος γενόμενος προσέπεσεν τῷ Παύλῳ καὶ ⸀τῷ Σιλᾷ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/029.yaml
  text: Then[a], asking for lights, he rushed in, and trembling with fear he fell down before Paul and Silas[c][b],
translation:
  language: ig
  text: Mgbe ahụ, ọ rịọrọ ka e weta ọkụ, wee gbaba n'ime ngwa ngwa. N'ịma jijiji n'ihi ụjọ, ọ dara n'ihu Pọl na Saịlas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Enwere ike ịsụgharị ya, “ọ dara n'ihu Pọl na Saịlas.” Okwu Grik ahụ na-egosi ịda n'ihu mmadụ n'ihi egwu, arịrịọ, ma ọ bụ nsọpụrụ; ọ pụtaghị n'ike na ọ na-efe ha ofufe.
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: Mgbe ahụ
  rationale: N'ebe a, δέ na-akwalite akụkọ gaa n'ihu, ọ bụghị igosi nnukwu mmegide.
- source_word: αἰτήσας
  choice: ọ rịọrọ ka e weta
  rationale: Aorist participle na-egosi ihe o mere tupu ọ gbaba; ntụgharị a na-egosipụta usoro omume ahụ n'Igbo dị mfe.
- source_word: φῶτα
  choice: ọkụ
  rationale: φῶτα bụ ọtụtụ n'asụsụ Grik ma na-ezo aka n'ihe ndị na-enye ìhè n'ozuzu; 'ọkụ' n'Igbo nwere ike ịbụ aha anaghị agụ ọnụ ma ghara ịkọwa ma ha bụ oriọna ka ha bụ ọwa.
- source_word: εἰσεπήδησεν
  choice: wee jiri ọsọ gbaba n'ime
  rationale: Okwu ahụ na-egosi ịbanye na mberede na n'ike; 'jiri ọsọ gbaba n'ime' bụ Igbo eke nke na-egosipụta ngwa ngwa na ike ahụ.
- source_word: ἔντρομος γενόμενος
  choice: Ka ụjọ na-eme ka ọ maa jijiji
  rationale: Nkebiokwu a na-egosi na ụjọ jidere ya ruo n'ókè nke ịma jijiji; ntụgharị a na-echekwa ma mmetụta ụjọ ma mmegharị ahụ.
- source_word: προσέπεσεν
  choice: ọ dara n'ala n'ihu
  rationale: Ngwaa ahụ pụtara ịda n'ihu mmadụ n'ihi egwu, arịrịọ, ma ọ bụ nsọpụrụ; ọ naghị ekwu n'onwe ya na ọ bụ ofufe.
- source_word: τῷ Παύλῳ καὶ τῷ Σιλᾷ
  choice: n'ihu Pọl na Saịlas
  rationale: Dative ndị a na προσέπεσεν na-egosi ndị ọ dara n'ihu ha, na-enweghị ịgbakwụnye na ọ dara kpọmkwem n'ụkwụ ha.
theological_decisions:
- issue: Ụdị omume onye nche ụlọ mkpọrọ mere n'ihu Pọl na Saịlas
  choice: A sụgharịrị ya dị ka 'ọ dara n'ala n'ihu Pọl na Saịlas,' nke na-egosi egwu na nrubeisi ma ọ bụ arịrịọ.
  alternative: Ọ kpọrọ isiala nye Pọl na Saịlas dịka ofufe; ma ọ bụ ọ tọgbọ onwe ya kpamkpam n'ala n'ihu ha.
  rationale: προσέπεσεν nwere ike igosi ịda n'ihu mmadụ n'ọnọdụ egwu, arịrịọ, ma ọ bụ nsọpụrụ, ma ọ naghị achọ ka a ghọta ya dịka ofufe. A hapụrụ ihe ahụ n'obosara nke asụsụ mmalite.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji 'ọkụ' mee ihe n'echiche nke ihe ndị na-enye ìhè n'ozuzu, n'agbanyeghị na okwu Grik dị n'ụdị ọtụtụ. A na-edebe akara edemede ngwụcha kama rikoma nke bụ akụkụ nke amaokwu na-esote.
