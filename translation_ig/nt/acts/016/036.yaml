review_pass:
  verdict: revise
  source_fidelity: 'Most of the verse closely reflects the Greek: the jailer relays the message to Paul, the civic magistrates have sent an order, release is passive, and the paired commands are retained. However, “labanụ” ordinarily means “return/go back,” whereas πορεύεσθε here directs the prisoners to depart. It should be replaced with “jeenụ” (or an equivalent departure verb).'
  naturalness: 'The wording is clear Standard Igbo. “Ugbu a” is placed initially in the revision to give the transition a smoother imperative sequence: “Ugbu a, pụtanụ, jeenụ n’udo.”'
  terminology: “Onye nche ụlọ mkpọrọ” accurately identifies δεσμοφύλαξ. “Ndị ọchịchị obodo” is an understandable nontechnical rendering of στρατηγοί in Philippi and does not overstate a specific Roman title. “N’udo” appropriately renders ἐν εἰρήνῃ.
  issues:
  - severity: medium
    issue: “labanụ” renders πορεύεσθε inaccurately in this context.
    rationale: λάβanụ means “return/go back,” but the Greek imperative tells Paul and Silas to depart after coming out of the prison. “Jeenụ” communicates the required direction without adding interpretation.
