  to: Onye nche ụlọ mkpọrọ ahụ wee kọọrọ Pọl okwu ndị a, sị, “Ndị ọchịchị obodo ezipụla ozi ka a tọhapụ unu. Ugbu a, pụtanụ, jeenụ n’udo.”
