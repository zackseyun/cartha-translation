  text: ἀπήγγειλεν δὲ ὁ δεσμοφύλαξ τοὺς λόγους ⸀τούτους πρὸς τὸν Παῦλον, ὅτι Ἀπέσταλκαν οἱ στρατηγοὶ ἵνα ἀπολυθῆτε· νῦν οὖν ἐξελθόντες πορεύεσθε ἐν εἰρήνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/036.yaml
  text: 'And the jailer reported these words to Paul: “The magistrates have sent word that you may be released[a]. So now[b], come out and go in peace.”'
translation:
  language: ig
  text: Onye nche ụlọ mkpọrọ ahụ wee kọọrọ Pọl okwu ndị a, sị, “Ndị ọchịchị obodo ezipụla ozi ka a tọhapụ unu. Ugbu a, pụtanụ, jeenụ n’udo.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπήγγειλεν
  choice: kọọrọ
  rationale: Ọ na-egosi izigara mmadụ ozi ma ọ bụ ịkọrọ ya ihe e kwuru; “kọọrọ” dabara n’akụkọ a ma bụrụkwa Igbo nkịtị.
- source_word: δεσμοφύλαξ
  choice: onye nche ụlọ mkpọrọ
  rationale: Ọ bụ onye na-elekọta ụlọ mkpọrọ kpọmkwem, ọ bụghị naanị onye nche n’ozuzu.
- source_word: τοὺς λόγους τούτους
  choice: okwu ndị a
  rationale: Nke a na-esochi usoro okwu Grik nke ọma ma ka na-ada ka Igbo e ji eme ihe.
- source_word: Ἀπέσταλκαν
  choice: ezipụla ozi
  rationale: Perfect ahụ na-egosi ihe e merela nke ka metụtara ọnọdụ ugbu a. E tinyere “ozi” iji mee ka ihe a na-ezipụ, nke Grik hapụrụ n’amaghị aha, doo anya n’Igbo.
- source_word: οἱ στρατηγοὶ
  choice: ndị ọchịchị obodo
  rationale: N’ógbè Filipai okwu a na-ezo aka n’aka ndị isi ọchịchị obodo Rom; nsụgharị a doro ndị na-agụ akwụkwọ taa anya karịa aha ọrụ Rom pụrụ iche.
- source_word: ἵνα ἀπολυθῆτε
  choice: ka a tọhapụ unu
  rationale: Ọ na-echekwa passive ahụ ma gosipụta iwu ma ọ bụ ikike e nyere ka ha pụọ n'ụlọ mkpọrọ.
- source_word: νῦν οὖν
  choice: Ya mere ... ugbu a
  rationale: “Ya mere” na-echekwa nkwubi okwu οὖν, ebe “ugbu a” na-echekwa νῦν n’usoro na-ada nke ọma n’Igbo.
- source_word: ἐξελθόντες
  choice: pụtanụ
  rationale: Ọ bụ participle nke jikọrọ na iwu na-esote, ya mere a sụgharịrị ya dị ka iwu nke mbụ n’usoro omume abụọ ahụ.
- source_word: πορεύεσθε
  choice: labanụ
  rationale: N’ọnọdụ a ọ pụtara ịpụ gawa ma ọ bụ ịla; “labanụ” bụ Igbo dị mfe ma kwekọọ na onye nọ n’ụlọ mkpọrọ na-agwa ha ka ha pụọ.
- source_word: ἐν εἰρήνῃ
  choice: n’udo
  rationale: Nke a bụ ụzọ Igbo nkịtị si ekwu ịla n’enweghị esemokwu ma ọ bụ nsogbu.
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ “ndị ọchịchị obodo” kama okwu teknụzụ Rom, ma echekwara ozi iwu ahụ na usoro “ka a tọhapụ unu.”
