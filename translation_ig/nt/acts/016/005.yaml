review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the transitional force, the ongoing strengthening and numerical growth, and the daily progression. However, “nzukọ Kraịst” is not an idiomatic or suitably precise Standard Igbo equivalent for plural ἐκκλησίαι; it can sound like “Christ’s meeting” rather than local Christian congregations. Rendering the article in τῇ πίστει as “n’okwukwe ahụ” appropriately reflects the likely communal/objective sense while the note retains the broader alternative.
  naturalness: The clause “a nọ na-eme ka … sie ike” is natural for the Greek imperfect passive. Replacing “nzukọ Kraịst ndị ahụ” with “ọgbakọ ndị kwere ekwe” gives an idiomatic plural reference to Christian congregations without implying buildings or using an unnatural possessive construction.
  terminology: “Ọgbakọ ndị kwere ekwe” is a clear, modern, and ecclesially neutral term for the local communities denoted by ἐκκλησίαι. “Okwukwe ahụ” reflects the article and the contextual sense of the shared Christian faith; the footnote preserves the possible more general sense without doctrinal overstatement.
  issues:
  - severity: medium
    issue: “nzukọ Kraịst ndị ahụ” is unnatural and potentially imprecise for ἐκκλησίαι.
    rationale: In Standard Igbo, this expression can be understood as a meeting belonging to Christ rather than plural local communities of believers. “Ọgbakọ ndị kwere ekwe” naturally identifies the referent without adding denominational content.
  - severity: low
    issue: The main text does not reflect the Greek article in τῇ πίστει.
    rationale: Although “n’okwukwe” is possible, “n’okwukwe ahụ” better represents the contextual likelihood that the phrase refers to the shared Christian faith. The alternative broader sense should remain in a note.
  revised_text: Ya mere, a nọ na-eme ka ọgbakọ ndị kwere ekwe sie ike n’okwukwe ahụ, ọnụ ọgụgụ ha na-amụbakwa kwa ụbọchị.[a]
  revised_footnotes:
