revisions:
- from: Ya mere, a nọ na-eme ka nzukọ Kraịst ndị ahụ sie ike n’okwukwe, ọnụ ọgụgụ ha na-amụbakwa kwa ụbọchị.[a]
  to: Ya mere, a nọ na-eme ka ọgbakọ ndị kwere ekwe sie ike n’okwukwe ahụ, ọnụ ọgụgụ ha na-amụbakwa kwa ụbọchị.[a]
  rationale: The revision replaces an unnatural rendering of “churches” with a natural Standard Igbo expression for congregations of believers. It also uses “okwukwe ahụ” in the text to represent the likely sense of the Greek article, while preserving the legitimate alternative “n’okwukwe” in the footnote. The imperfect passive and active senses, numerical growth, and distributive daily phrase are retained.
  reviewer_model: gpt-5.6-terra
