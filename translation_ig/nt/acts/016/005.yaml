    text: A pụkwara ịghọta ya dị ka “n’okwukwe.” Nkebiokwu Grik ahụ nwere ike ịpụta na a na-eme ka ha sie ike n’okwukwe Ndị Kraịst ha na-ekekọrịta—ihe ha kweere na ụzọ ndụ ha—ma ọ bụ, n’ụzọ sara mbara, na a na-eme ka ha sie ike n’okwukwe.
    reason: alternative_reading
  revision_rationale: The revision replaces an unnatural rendering of “churches” with a natural Standard Igbo expression for congregations of believers. It also uses “okwukwe ahụ” in the text to represent the likely sense of the Greek article, while preserving the legitimate alternative “n’okwukwe” in the footnote. The imperfect passive and active senses, numerical growth, and distributive daily phrase are retained.
