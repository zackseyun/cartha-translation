base_translation:
  language: en
  yaml_path: translation/nt/acts/016/005.yaml
  text: So the churches were being strengthened in the faith and were increasing in number day by day[a].
translation:
  language: ig
  text: Ya mere, a nọ na-eme ka ọgbakọ ndị kwere ekwe sie ike n’okwukwe ahụ, ọnụ ọgụgụ ha na-amụbakwa kwa ụbọchị.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịghọta ya dị ka “n’okwukwe.” Nkebiokwu Grik ahụ nwere ike ịpụta na a na-eme ka ha sie ike n’okwukwe Ndị Kraịst ha na-ekekọrịta—ihe ha kweere na ụzọ ndụ ha—ma ọ bụ, n’ụzọ sara mbara, na a na-eme ka ha sie ike n’okwukwe.
    reason: alternative_reading
lexical_decisions:
- source_word: αἱ μὲν οὖν
  choice: Ya mere
  rationale: Ngwakọta ụmụokwu a na-eme nchịkọta ma jikọta amaokwu a na ihe ndị bu ya ụzọ; “Ya mere” bụ Igbo nkịtị nke na-egosi njikọ ahụ n’enweghị ịgbatị μέν karịa ihe ọ pụtara ebe a.
- source_word: ἐκκλησίαι
  choice: nzukọ Kraịst ndị ahụ
  rationale: N’Ọrụ Ndịozi, okwu a na-ezo aka n’ọgbakọ ndị kwere na Kraịst nọ n’ebe dị iche iche. Nhọrọ a na-eme ka ihe ọ pụtara doo ndị na-agụ Igbo nke oge a anya ma zere ka a ghọta ya naanị dị ka ụlọ ụka.
- source_word: ἐστερεοῦντο
  choice: a nọ na-eme ka ... sie ike
  rationale: Ụdị imperfect passive na-egosi omume a na-aga n’ihu n’oge gara aga. Nkebiokwu Igbo a na-echekwa ma ihe omume na-aga n’ihu ma olu nnara.
- source_word: τῇ πίστει
  choice: n’okwukwe
  rationale: Nke a na-egosi akụkụ ma ọ bụ ọnọdụ e ji eme ka nzukọ ndị ahụ sie ike. “Okwukwe” nwere ike ịgụnye okwukwe Ndị Kraịst ha niile na-ekekọrịta nakwa ntụkwasị obi ha nwere, ya mere a naghị emechi nghọta abụọ ahụ n’isiokwu.
- source_word: ἐπερίσσευον
  choice: na-amụbakwa
  rationale: Imperfect active na-egosi mmụba na-aga n’ihu. “Na-amụba” bụ okwu Igbo dị mfe ma kwekọọ na mmụba nke ọnụ ọgụgụ.
- source_word: τῷ ἀριθμῷ
  choice: ọnụ ọgụgụ ha
  rationale: Dative a na-akọwa ihe mmụba ahụ metụtara. Ịsị “ọnụ ọgụgụ ha” na-eme ka njikọ ya na ndị nọ na nzukọ ndị ahụ doo anya n’Igbo.
- source_word: καθ’ ἡμέραν
  choice: kwa ụbọchị
  rationale: Nkebiokwu a na-egosi mmụba na-eme ugboro ugboro, ụbọchị ruo ụbọchị; “kwa ụbọchị” bụ ụzọ Igbo nkịtị si kwuo ya.
theological_decisions:
- issue: Ihe πίστις nwere artikel pụtara
  choice: “n’okwukwe,” nke nwere ike ibu ụzọ zoo aka n’okwukwe Ndị Kraịst ha na-ekekọrịta
  alternative: okwukwe dị ka ntụkwasị obi nke onye ọ bụla nwere
  rationale: Artikel ahụ na ọnọdụ metụtara nzukọ Kraịst na-akwado nghọta okwukwe a na-ekekọrịta, ma okwu Igbo “n’okwukwe” anaghị ewepụ nghọta nke ntụkwasị obi onwe onye. Ihe e dere n’ala peeji na-echekwa mgbagwoju anya dị n’asụsụ Grik.
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E ji “nzukọ Kraịst” mee ka o doo anya na ἐκκλησίαι bụ obodo ndị kwere ekwe, ọ bụghị ụlọ; usoro “a nọ na-eme ... na-amụbakwa” na-echekwa omume abụọ na-aga n’ihu.
