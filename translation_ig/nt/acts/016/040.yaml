  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐξελθόντες δὲ ⸀ἀπὸ τῆς φυλακῆς εἰσῆλθον πρὸς τὴν Λυδίαν, καὶ ἰδόντες ⸂παρεκάλεσαν τοὺς ἀδελφοὺς⸃ καὶ ἐξῆλθαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/040.yaml
  text: After they came out of the prison[a], they went to Lydia, and when they saw the brothers, they encouraged them and departed.
translation:
  language: ig
  text: Mgbe ha si n’ụlọ mkpọrọ pụta, ha gara hụ Lidia; mgbe ha hụrụ ụmụnna[a], ha gbara ha ume ma pụọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’ebe a, “ụmụnna” pụrụ ịgụnye ụmụnna nwoke na ụmụnna nwanyị. Okwu Grik a dị n’ụdị ọtụtụ nke nwoke, ma ọ pụrụ izo aka n’ìgwè ndị kwere ekwe nke ndị nwoke na ndị nwanyị nọ na ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθόντες ἀπὸ τῆς φυλακῆς
  choice: Mgbe ha si n’ụlọ mkpọrọ pụta
  rationale: Nkebiokwu oge a na-egosi na ọpụpụ ha n’ụlọ mkpọrọ buru ụzọ mee; nsụgharị a bụ Igbo dị mfe ma doo anya.
- source_word: εἰσῆλθον πρὸς τὴν Λυδίαν
  choice: ha gara hụ Lidia
  rationale: N’ebe a, εἰσέρχομαι πρός na-egosi ịgakwuru mmadụ ileta ya. ‘Gara hụ Lidia’ na-enye nghọta ahụ n’Igbo n’etinyeghị ‘ụlọ’ nke na-adịghị kpọmkwem n’amaokwu Grik.
- source_word: ἰδόντες
  choice: Mgbe ha hụkwara
  rationale: A sụgharịrị participle a dị ka nkebiokwu oge, nke na-eme ka usoro akụkọ ahụ gaa were were.
- source_word: παρεκάλεσαν
  choice: ha gbara ha ume
  rationale: παρακαλέω nwere ike ịpụta ịgba ume, ịdụ ọdụ, ma ọ bụ ịkasi obi. ‘Gbara ha ume’ na-edobe obosara ihe okwu ahụ pụtara n’ọnọdụ a.
- source_word: τοὺς ἀδελφούς
  choice: ụmụnna
  rationale: ‘Ụmụnna’ bụ okwu Igbo ebumpụta ụwa maka ndị otu okwukwe, ọ pụkwara ịgụnye nwoke na nwanyị dịka okwu Grik a pụrụ isi mee n’ọnọdụ a.
- source_word: ἐξῆλθαν
  choice: mesịa pụọ
  rationale: ‘Pụọ’ na-egosi ọpụpụ ikpeazụ ahụ; ‘mesịa’ na-eme ka usoro ihe ndị mere doo anya ma na-ezere nkwughachi na-adịghị ụtọ.
theological_decisions:
- issue: Ma τοὺς ἀδελφούς ọ na-ezo aka naanị n’ụmụ nwoke ka ọ bụ n’ìgwè ndị kwere ekwe nke nwere ike ịgụnye nwoke na nwanyị
  choice: ụmụnna[a]
  alternative: ụmụnna nwoke; ndị kwere ekwe
  rationale: ‘Ụmụnna’ na-edobe ihe oyiyi ezinụlọ nke okwu Grik ahụ ma na-ekwe ka ọ gụnye ndị kwere ekwe nwoke na nwanyị. Ihe odide ala ala na-eme ka nghọta a doo anya n’enweghị ịmanye otu nghọta n’isiokwu ahụ.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. ‘Gara hụ Lidia’ bụ ụzọ Igbo ebumpụta ụwa si kwuo ịgakwuru mmadụ ileta ya, ebe ‘ụmụnna’ na-echekwa okwu ezinụlọ nke nzukọ Ndị Kraịst.
