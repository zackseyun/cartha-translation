- from: N’ụbọchị izu ike, anyị si n’ọnụ ụzọ ámá pụọ gaa n’akụkụ osimiri, ebe anyị chere na e nwere ebe a na-ekpe ekpere[a]. Mgbe anyị nọdụrụ ala, anyị malitere ịgwa ndị inyom gbakọtara n’ebe ahụ okwu.
  to: N’ụbọchị izu ike, anyị si n’ọnụ ụzọ ámá pụọ gaa n’akụkụ osimiri, ebe anyị chere na e nwere ebe a na-ekpe ekpere[a]. Mgbe anyị nọdụrụ ala, anyị na-agwa ndị inyom ndị zukọrọ n’ebe ahụ okwu.
