  text: τῇ τε ἡμέρᾳ τῶν σαββάτων ἐξήλθομεν ἔξω τῆς ⸀πύλης παρὰ ποταμὸν οὗ ⸂ἐνομίζομεν προσευχὴν⸃ εἶναι, καὶ καθίσαντες ἐλαλοῦμεν ταῖς συνελθούσαις γυναιξίν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/013.yaml
  text: On the Sabbath day we went outside the gate beside the river[a], where we supposed there was a place of prayer, and after sitting down we were speaking to the women who had gathered there.
translation:
  language: ig
  text: N’ụbọchị izu ike, anyị si n’ọnụ ụzọ ámá pụọ gaa n’akụkụ osimiri, ebe anyị chere na e nwere ebe a na-ekpe ekpere[a]. Mgbe anyị nọdụrụ ala, anyị na-agwa ndị inyom ndị zukọrọ n’ebe ahụ okwu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ebe anyị chere na ekpere dị.” Okwu Grik a nwere ike ịpụta ekpere n’onwe ya ma ọ bụ ebe e kewapụrụ maka ekpere; ọnọdụ akụkọ a na-akwado “ebe a na-ekpe ekpere.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ τε ἡμέρᾳ τῶν σαββάτων
  choice: N’ụbọchị izu ike
  rationale: Nkebiokwu Grik a bụ ụzọ e si ekwu ụbọchị izu ike n’oge ahụ; nsụgharị a bụ nke Igbo doro anya ma dịkwa mfe.
- source_word: ἐξήλθομεν ἔξω τῆς πύλης
  choice: anyị si n’ọnụ ụzọ ámá pụọ
  rationale: Ọ na-egosi ịgafe ọnụ ụzọ ámá pụọ n’èzí, na-agbakwụnyeghị ‘obodo,’ nke na-adịghị kpọmkwem n’ihe odide Grik.
- source_word: παρὰ ποταμόν
  choice: gaa n’akụkụ osimiri
  rationale: παρά na accusative ebe a na-egosi ịga n’ebe dị n’akụkụ osimiri.
- source_word: οὗ ἐνομίζομεν προσευχὴν εἶναι
  choice: ebe anyị chere na e nwere ebe a na-ekpe ekpere
  rationale: νομίζω pụtara iche ma ọ bụ were ya na ọ dị otú ahụ; προσευχή nwere ike ịbụ ekpere n’onwe ya ma ọ bụ ebe e debere maka ekpere. Ọnọdụ akụkọ a na-akwado nghọta nke ebe ekpere.
- source_word: καὶ καθίσαντες
  choice: Mgbe anyị nọdụrụ ala
  rationale: Aorist participle na-egosi ihe mere tupu omume nke ngwaa bụ isi; nsụgharị a na-eme usoro ihe omume ahụ ka o doo anya.
- source_word: ἐλαλοῦμεν
  choice: anyị malitere ịgwa ... okwu
  rationale: Imperfect na-egosi omume na-aga n’ihu; ‘malitere ịgwa ... okwu’ na-ekwupụta mmalite nke mkparịta ụka gara n’ihu n’ụzọ Igbo dị ndụ.
- source_word: ταῖς συνελθούσαις γυναιξίν
  choice: ndị inyom gbakọtara n’ebe ahụ
  rationale: Ọ na-ezo aka n’ụmụ nwanyị ndị bịakọtara ọnụ tupu a gwa ha okwu; ‘n’ebe ahụ’ sitere n’ọnọdụ a kọwara ozugbo.
theological_decisions:
- issue: Ihe προσευχή pụtara n’ọnọdụ a
  choice: ebe a na-ekpe ekpere
  alternative: ‘ekpere’ dị ka omume naanị ya; ma ọ bụ ‘ụlọ nzukọ ndị Juu’
  rationale: Akụkọ ahụ na-ekwu banyere ebe dị n’akụkụ osimiri ụmụ nwanyị zukọrọ, προσευχή nwekwara ike ịpụta ebe e debere maka ekpere n’okwu ndị Juu nke oge ahụ. A sịghị ‘ụlọ nzukọ ndị Juu’ n’ihi na nke ahụ ga-agbakwụnye nkọwa ụlọ ọrụ na-adịghị n’okwu Grik; ihe ọzọ nwere ike ịpụta ka edere n’ala ala peeji.
translation_notes:
  register: Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E jiri ‘ụbọchị izu ike’ mee Sabbath n’enweghị itinye nkọwa otu ụka; e chekwara mgbagwoju anya dị na προσευχή site n’ala ala peeji.
