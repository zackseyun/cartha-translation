revisions:
- from: Pọl chọrọ ka onye a soro ya pụọ[a]. O wee kpọrọ ya bie ya úgwù n’ihi ndị Juu[b] nọ n’ebe ndị ahụ, n’ihi na ha niile maara na nna ya bụ onye Gris[c].
  to: Pọl chọrọ ka onye a soro ya pụọ[a]. Pọl kpọrọ ya, wee bie ya úgwù n’ihi ndị Juu[b] nọ n’ebe ndị ahụ, n’ihi na ha niile maara na nna ya bụ onye Gris[c].
  rationale: The revision preserves the Greek demonstrative, travel idiom, explanatory γάρ clause, and the narrative motive without resolving its theological implications. It clarifies the participial-to-main-verb relationship in natural Standard Igbo and improves the wording of footnote c. Footnote markers remain anchored to their respective expressions.
