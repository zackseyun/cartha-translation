id: ACT.16.3
reference: Acts 16:3
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τοῦτον ἠθέλησεν ὁ Παῦλος σὺν αὐτῷ ἐξελθεῖν, καὶ λαβὼν περιέτεμεν αὐτὸν διὰ τοὺς Ἰουδαίους τοὺς ὄντας ἐν τοῖς τόποις ἐκείνοις, ᾔδεισαν γὰρ ἅπαντες ⸂ὅτι Ἕλλην ὁ πατὴρ αὐτοῦ⸃ ὑπῆρχεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/003.yaml
  text: Paul wanted him to go out with him[a], and after taking him, he circumcised him because of the Jews who were in those places[c][b], for they all knew that his father was a Greek.
translation:
  language: ig
  text: Pọl chọrọ ka onye a soro ya pụọ[a]. Pọl kpọrọ ya, wee bie ya úgwù n’ihi ndị Juu[b] nọ n’ebe ndị ahụ, n’ihi na ha niile maara na nna ya bụ onye Gris[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ka ya na ya soro gaa njem.” N’asụsụ Grik, ọ bụ “ka ya na ya soro pụọ,” nke nwekwara ike ịpụta ịmalite njem.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, “n’ihi ọdịmma ndị Juu” ma ọ bụ “n’ihi ihe gbasara ndị Juu.”
    reason: lexical_alternative
  - marker: c
    text: N’asụsụ Grik, ọ bụ “onye Gris.” N’ebe a, o yiri ka okwu ahụ na-egosi na nna Timoti abụghị onye Juu.
    reason: cultural_note
lexical_decisions:
- source_word: τοῦτον
  choice: onye a
  rationale: Nnọchiaha ngosi a na-arụtụ aka na Timoti, onye a kpọtụrụ aha n’amaokwu bu ụzọ. “Onye a” na-edebe ngosipụta dị na Grik n’enweghị itinye aha ọzọ n’ime ederede.
- source_word: ἠθέλησεν
  choice: chọrọ
  rationale: Okwu a na-egosi ọchịchọ ma ọ bụ ebumnuche Pọl n’asụsụ Igbo dị mfe ma bụrụkwa nke oge a.
- source_word: σὺν αὐτῷ ἐξελθεῖν
  choice: ka ... soro ya pụọ
  rationale: Nke a na-edebe onyinyo okwu Grik nke ‘ịpụ’ ma na-enye nghọta na onye ahụ ga-eso Pọl gawa.
- source_word: λαβὼν
  choice: O wee kpọrọ ya
  rationale: “Wee” na-egosi na omume a sochiri ọchịchọ ahụ, ebe “kpọrọ ya” na-anọchi participle ahụ n’ụzọ Igbo na-asụkarị.
- source_word: περιέτεμεν
  choice: bie ya úgwù
  rationale: Nke a bụ okwu Igbo doro anya maka ibi nwoke úgwù; e zoghị ihe omume ahụ n’okwu mgbagwoju anya.
- source_word: διὰ τοὺς Ἰουδαίους
  choice: n’ihi ndị Juu
  rationale: διά ya na accusative na-egosi ihe kpatara omume ahụ ma ọ bụ ihe kwaliri ya; “n’ihi” na-ahapụ oke nghọta ahụ ka ọ dị.
- source_word: τοὺς ὄντας ἐν τοῖς τόποις ἐκείνοις
  choice: ndị Juu ... nọ n’ebe ndị ahụ
  rationale: Nke a na-anọ nso n’usoro na ihe τόποις pụtara, n’enweghị ịgbanwe ya ka ọ bụrụ mpaghara buru ibu.
- source_word: ᾔδεισαν γὰρ ἅπαντες
  choice: n’ihi na ha niile maara
  rationale: “N’ihi na” na-egosi nkọwa γάρ nyere, “ha niile” kwa na-edebe ike ἅπαντες.
- source_word: Ἕλλην
  choice: onye Gris
  rationale: Nke a na-asụgharị aha agbụrụ na omenala ahụ kpọmkwem; a gbanweghị ya ozugbo ka ọ bụrụ okwu sara mbara dịka ‘onye mba ọzọ.’
- source_word: ὁ πατὴρ αὐτοῦ ὑπῆρχεν
  choice: nna ya bụ
  rationale: Nke a bụ ụzọ Igbo kachasị eke isi kwuo ọnọdụ nna ya, n’enweghị itinye echiche ọzọ na ὑπῆρχεν.
theological_decisions:
- issue: Ihe mere Pọl ji bie Timoti úgwù n’ihe metụtara ndị Juu
  choice: E kwuru naanị na Pọl mere ya n’ihi ndị Juu nọ ebe ahụ, ebe ha niile maara na nna Timoti bụ onye Gris.
  alternative: Ịkọwa omume ahụ dị ka ihe na-egosi na ibi úgwù dị mkpa maka nzọpụta, ma ọ bụ ikwu hoo haa na ọ bụ naanị atụmatụ ọrụ mgbasa ozi.
  rationale: Amaokwu ahụ kwuru ihe kwaliri omume Pọl, ma ọ kọwaghị ozizi sara mbara banyere mkpa ibi úgwù. Nsụgharị ahụ na-edebe esemokwu dị na akụkọ ahụ n’enweghị idozi ya site n’ozizi e tinyere n’èzí.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ “onye a” iji debe nrụtụ aka τοῦτον, “soro ya pụọ” iji chekwaa ilu njem nke Grik, na “bie ya úgwù” dịka okwu doro anya a na-asụkarị. Akara ntụaka [a], [b], na [c] niile dị n’ederede n’ebe ha metụtara.
