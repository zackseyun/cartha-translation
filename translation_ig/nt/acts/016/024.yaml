    reason: cultural_note
  revision_rationale: The revision retains the draft’s faithful treatment of the jailer, the official order, and the forceful imprisonment, while making the location phrase more idiomatic and rendering the securing of the feet more accurately. The footnote anchors remain attached to the corresponding terms, and the note on ξύλον preserves its literal sense while explaining its contextual function.
