  text: ὃς παραγγελίαν τοιαύτην ⸀λαβὼν ἔβαλεν αὐτοὺς εἰς τὴν ἐσωτέραν φυλακὴν καὶ τοὺς πόδας ⸂ἠσφαλίσατο αὐτῶν⸃ εἰς τὸ ξύλον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/024.yaml
  text: He[a], having received such an order[b], threw them into the inner prison and secured their feet in the stocks.
translation:
  language: ig
  text: Onye nche ụlọ mkpọrọ ahụ, mgbe ọ natara iwu dị otú ahụ, tụbara ha n’ụlọ mkpọrọ dị n’ime[a], kpọchiekwa ụkwụ ha n’osisi e ji akpọchi ụkwụ ndị mkpọrọ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “n’ụlọ mkpọrọ nke kachasị n’ime.”
    reason: lexical_alternative
  - marker: b
    text: N’ụzọ nkịtị, “n’osisi.” N’ebe a, ọ na-ezo aka n’ihe e ji osisi mee nke a na-etinye ụkwụ onye mkpọrọ n’ime ya ka ọ ghara ịgagharị.
    reason: cultural_note
lexical_decisions:
- source_word: ὃς
  choice: onye nche ụlọ mkpọrọ ahụ
  rationale: Nnochiaha ahụ na-ezo aka n’onye nche ụlọ mkpọrọ a kpọtụrụ aha n’amaokwu bu ụzọ; ikwughachi aha ọrụ ya na-eme ka Igbo doo anya n’enweghị ịgbakwunye onye ọhụrụ.
- source_word: παραγγελίαν τοιαύτην
  choice: iwu dị otú ahụ
  rationale: παραγγελία bụ iwu ma ọ bụ ntụziaka sitere n’aka onye nwere ikike; “iwu” bụ okwu Igbo dị nkenke ma kwekọọ n’ọnọdụ a.
- source_word: λαβὼν
  choice: Mgbe ... natara
  rationale: Aorist participle ahụ na-egosi ihe mere tupu ngwaa bụ isi; usoro “Mgbe ... natara” bụ Igbo eke nke na-edobe njikọ oge ahụ.
- source_word: ἔβαλεν
  choice: ọ tụbara
  rationale: βάλλω nwere ike ịpụta ịtụba ma ọ bụ itinye; “tụbara” na-echekwa ike na obi ọjọọ nke omume ahụ n’akụkọ a.
- source_word: ἐσωτέραν φυλακήν
  choice: n’ime ime ụlọ mkpọrọ
  rationale: ἐσωτέραν na-egosi akụkụ ụlọ mkpọrọ nke dịkwuru n’ime; okwu a na-echekwa echiche ahụ n’Igbo.
- source_word: ἠσφαλίσατο
  choice: kechiekwa ... nke ọma
  rationale: ἀσφαλίζω pụtara ime ka ihe sie ike ma ghara ịpụ; n’ihe gbasara ụkwụ na ngwa mgbochi, “kechie ... nke ọma” bụ okwu Igbo doro anya.
- source_word: τοὺς πόδας αὐτῶν
  choice: ụkwụ ha
  rationale: πούς pụtara ụkwụ, ya mere nsụgharị kpọmkwem ma bụrụkwa nke eke bụ “ụkwụ ha.”
- source_word: εἰς τὸ ξύλον
  choice: n’osisi e ji egbochi ndị mkpọrọ
  rationale: ξύλον pụtara osisi ma ọ bụ ihe e ji osisi mee; n’ọnọdụ ụlọ mkpọrọ a, ọ bụ ngwa osisi e ji jide ụkwụ. Nsụgharị nkọwa a na-eme ka ihe a na-ekwu doo onye Igbo nke oge a anya ma na-edobe “osisi.”
theological_decisions: []
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, nke dị ugwu ma dị mfe nghọta. A họọrọ usoro ahịrịokwu eke n’Igbo, ma e chekwara ike ngwaa ἔβαλεν na nkọwa kpọmkwem nke ξύλον site n’isiokwu na nkọwa ala peeji.
