  text: Κατὰ δὲ τὸ μεσονύκτιον Παῦλος καὶ Σιλᾶς προσευχόμενοι ὕμνουν τὸν θεόν, ἐπηκροῶντο δὲ αὐτῶν οἱ δέσμιοι·
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/025.yaml
  text: About midnight Paul and Silas were praying and singing hymns to God[a], and the prisoners were listening to them.
translation:
  language: ig
  text: N’ihe dị ka etiti abalị, Pọl na Saịlas nọ na-ekpe ekpere, na-abụkwa Chineke abụ otuto; ndị mkpọrọ ahụ na-egekwa ha ntị nke ọma.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ndị mkpọrọ ahụ na-egekwa ha ntị.” Ngwaa Grik ahụ nwere ike igosi ige ntị nke ọma ma ọ bụ ige ntị n’ịnụ ọkụ n’obi.
    reason: lexical_alternative
lexical_decisions:
- source_word: Κατὰ δὲ τὸ μεσονύκτιον
  choice: N’ihe dị ka etiti abalị
  rationale: κατά na ebubo oge na-egosi oge dị ihe dịka etiti abalị, ọ bụghị na ọ ga-abụrịrị kpọmkwem n’oge ahụ; δέ bụ njikọ dị nro, nke a gosipụtara n’usoro ahịrịokwu ahụ.
- source_word: Παῦλος καὶ Σιλᾶς
  choice: Pọl na Saịlas
  rationale: A sụgharịghị aha ndị ahụ; e dere ha n’ụdị a na-anụkarị ma kwekọọ n’usoro ụda Igbo.
- source_word: προσευχόμενοι
  choice: nọ na-ekpe ekpere
  rationale: Participu dị ugbu a na-egosi omume na-aga n’ihu n’otu oge ahụ abụ otuto na-aga n’ihu.
- source_word: ὕμνουν
  choice: na-abụ abụ otuto
  rationale: ὑμνέω pụtara ịbụ abụ e ji eto onye, karịsịa Chineke; ‘abụ otuto’ na-edobe nkọwa ahụ n’Igbo dị mfe ma dị nsọpụrụ.
- source_word: τὸν θεόν
  choice: nye Chineke
  rationale: N’Igbo, ‘ịbụ abụ otuto nye Chineke’ na-egosi nke ọma na Chineke bụ onye a na-eto.
- source_word: ἐπηκροῶντο
  choice: nọkwa na-ege ha ntị nke ọma
  rationale: Ngwaa imperfect middle a na-egosi ige ntị na-aga n’ihu, ma nwee ike ịpụta ige ntị nke ọma ma ọ bụ nke miri emi; a gosipụtara nuance ahụ n’isiokwu.
- source_word: οἱ δέσμιοι
  choice: ndị mkpọrọ ahụ
  rationale: δέσμιοι bụ ndị a tụrụ mkpọrọ ma ọ bụ ndị nọ n’agbụ; ‘ndị mkpọrọ’ bụ okwu Igbo kacha doo anya n’akụkọ a.
