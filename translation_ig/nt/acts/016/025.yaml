translation_notes:
  register: Asụsụ Igbo Izugbe dị ugbu a, dị mfe nghọta ma nwee ugwu. E debere omume abụọ ahụ dị ka ihe na-aga n’ihu n’etiti abalị, ma e gosipụtara ike okwu ἐπηκροῶντο n’isiokwu ma debe ụzọ dị nro na nkọwa ala peeji.
