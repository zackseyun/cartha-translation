id: ACT.16.18
reference: Acts 16:18
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τοῦτο δὲ ἐποίει ἐπὶ πολλὰς ἡμέρας. διαπονηθεὶς ⸀δὲ Παῦλος καὶ ἐπιστρέψας τῷ πνεύματι εἶπεν· Παραγγέλλω σοι ⸀ἐν ὀνόματι Ἰησοῦ Χριστοῦ ἐξελθεῖν ἀπ’ αὐτῆς· καὶ ἐξῆλθεν αὐτῇ τῇ ὥρᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/018.yaml
  text: And she kept doing this for many days[a]. But Paul, becoming greatly troubled, turned to the spirit and said[b], “I command you in the name of Jesus the Messiah to come out of her.” And it came out that very hour.
translation:
  language: ig
  text: Nwaanyị ahụ nọgidere na-eme nke a ruo ọtụtụ ụbọchị. Ma Pọl, ebe obi ya wutere nke ukwuu, tụgharịrị gwa mmụọ ahụ okwu, sị, “Ana m enye gị iwu n’aha Jizọs bụ́ Mesaya[a] ka i si n’ime ya pụta.” Mmụọ ahụ wee si n’ime ya pụta n’oge ahụ kpọmkwem.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “n’aha Jizọs Kraịst.” Okwu Grik bụ Χριστός bụ aha ọkwa pụtara “Mesaya,” ya bụ, Onye E Tere Mmanụ.
    reason: alternative_reading
  - marker: b
    text: “N’oge ahụ kpọmkwem” na-egosi na mmụọ ahụ pụtara ozugbo n’oge ahụ.
    reason: idiom_clarification
lexical_decisions:
- source_word: ἐποίει ἐπὶ πολλὰς ἡμέρας
  choice: na-eme nke a ruo ọtụtụ ụbọchị
  rationale: Ụdị imperfect na-egosi omume gara n’ihu ma ọ bụ nke a na-eme ugboro ugboro; “na-eme ... ruo ọtụtụ ụbọchị” na-egosipụta nke a n’Igbo nkịtị.
- source_word: διαπονηθεὶς
  choice: mgbe obi malitere ịsọ Pọl ezigbo njọ
  rationale: Okwu a na-egosi na ihe ahụ nyere Pọl nnukwu nsogbu ma kpasuo ya iwe n’obi; nsụgharị a karịrị nanị obere iwe ma ọ naghị eme ka ọ bụrụ ọnụma.
- source_word: ἐπιστρέψας
  choice: ọ tụgharịrị
  rationale: Ọ na-egosi na Pọl tụgharịrị onwe ya tupu o kwuo okwu.
- source_word: τῷ πνεύματι
  choice: gwa mmụọ ahụ
  rationale: Grik kwuru naanị “mmụọ ahụ,” n’enweghị mgbakwunye “ọjọọ” ma ọ bụ “mmụọ ọjọọ”; ihe gbara amaokwu ahụ gburugburu na-eme ka onye a na-ekwu maka ya doo anya.
- source_word: Παραγγέλλω σοι
  choice: Ana m enye gị iwu
  rationale: Nke a na-egosipụta iwu e nyere n’ike na ikike, ma bụrụkwa okwu Igbo doro anya.
- source_word: ἐν ὀνόματι Ἰησοῦ Χριστοῦ
  choice: n’aha Jizọs, bụ́ Mesaya
  rationale: “N’aha” na-egosi ikike e ji enye iwu ahụ; “Mesaya” na-echekwa Χριστός dịka aha ọkwa, ọ bụghị dịka aha ezinụlọ.
- source_word: ἐξελθεῖν ἀπ’ αὐτῆς
  choice: ka i si n’ime ya pụta
  rationale: Nke a bụ ụzọ Igbo doro anya isi kwuo na e nyere mmụọ iwu ka ọ hapụ nwaanyị ahụ.
- source_word: ἐξῆλθεν αὐτῇ τῇ ὥρᾳ
  choice: O wee pụta n’ime ya n’otu oge ahụ
  rationale: Nke a na-echekwa mmụọ ahụ dịka isiokwu e zoro ezo ma na-egosi na iwu ahụ mezuru ozugbo n’oge ahụ.
theological_decisions:
- issue: Otu e si sụgharịa Χριστοῦ n’okwu iwu ahụ
  choice: Mesaya
  alternative: Kraịst
  rationale: Χριστός bụ aha ọkwa nke pụtara Onye E Tere Mmanụ; “Mesaya” na-echekwa ọrụ ya dịka aha ọkwa n’ebe a, ebe ndetu na-enye ụdị a maara nke ọma “Kraịst.”
- issue: Ma a ga-akpọ πνεῦμα “mmụọ ọjọọ” n’ahịrị bụ isi
  choice: mmụọ ahụ
  alternative: mmụọ ọjọọ ahụ
  rationale: Amaokwu Grik n’onwe ya etinyeghị okwu pụtara “ọjọọ”; ya mere, a hapụrụ nkọwa ahụ ka ihe gbara amaokwu ahụ gburugburu nye ya.
- issue: Oge ọpụpụ mmụọ ahụ
  choice: n’otu oge ahụ
  alternative: ozugbo ahụ
  rationale: Nhọrọ bụ isi na-echekwa ihe oyiyi αὐτῇ τῇ ὥρᾳ (“n’oge ahụ kpọmkwem”), ebe ndetu na-akọwa na ọ pụtara ozugbo.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A hapụrụ “mmụọ ahụ” n’enweghị “ọjọọ” iji ghara itinye ihe Grik ekwughị kpọmkwem; a kọwara Χριστός dịka “Mesaya,” tinyekwa “Kraịst” na ndetu.
