id: ACT.16.34
reference: Acts 16:34
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀναγαγών τε αὐτοὺς εἰς τὸν ⸀οἶκον παρέθηκεν τράπεζαν καὶ ⸀ἠγαλλιάσατο πανοικεὶ πεπιστευκὼς τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/034.yaml
  text: And after bringing them up into the house[a], he set a meal before them and rejoiced greatly with his whole household[b], having believed in God.
translation:
  language: ig
  text: Mgbe o kpọgoro ha n'ụlọ ahụ, o doziere ha nri[a]. Ya na ndị ụlọ ya niile wee ṅụrịa ọṅụ nke ukwuu[b], ebe o kweworo na Chineke.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “o dobere ha tebụl”; akpaalaokwu Grik a pụtara na o nyere ha nri.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịghọta okwu Grik ahụ dị ka nke na-emesi ike na ndị ụlọ ya niile sonyere n'ọṅụ ahụ; ụfọdụ na-ewerekwa nkebiokwu ahụ dị ka nke na-egosi na ndị ụlọ ahụ sokwara kwere.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀναγαγών
  choice: Mgbe o kpọgoro ha
  rationale: “Kpọgoro” na-egosi na o si n'ebe dị ala kpọga ha n'elu, ebe “mgbe” na-eme ka usoro omume participle ahụ doo anya n'Igbo.
- source_word: οἶκον
  choice: n'ụlọ ahụ
  rationale: Artịkụl Grik ahụ na-arụtụ aka n'ụlọ a maara site n'ihe gbara amaokwu ahụ gburugburu, ya bụ ụlọ onye nche ahụ, n'ebughị ụzọ tinye nnọchiaha nwe ihe na-adịghị n'okwu Grik.
- source_word: παρέθηκεν τράπεζαν
  choice: o doziere ha nri
  rationale: Nke a na-enye nkọwa ebumpụta ụwa nke akpaalaokwu Grik banyere idobere mmadụ tebụl, nke pụtara inye ya nri na ile ọbịa.
- source_word: ἠγαλλιάσατο
  choice: ṅụrịa ọṅụ nke ukwuu
  rationale: Nkebiokwu a na-egosipụta ọṅụ siri ike nke ngwaa Grik ahụ na-egosi, ma bụrụkwa Igbo dị mfe ma dị ùgwù.
- source_word: πανοικεὶ
  choice: ya na ndị ụlọ ya niile
  rationale: Nke a na-echekwa echiche nke ndị niile nọ n'ezinụlọ ma ọ bụ n'ụlọ ahụ, n'emeghị ka okwu ahụ bụrụ naanị banyere ezinụlọ nuklia.
- source_word: πεπιστευκὼς τῷ θεῷ
  choice: ebe o kweworo na Chineke
  rationale: “Kweworo” na-egosipụta omume mezuru nke nsonaazụ ya ka dị, dị ka perfect participle ahụ si dị; “ebe” na-ahapụ njikọ participle ahụ ntakịrị oghe karịa ịsụgharị ya naanị dị ka ihe kpatara ọṅụ ahụ.
theological_decisions:
- issue: Ma ọṅụ na okwukwe ahụ metụtara onye nche naanị ya ka ọ bụ ndị ụlọ ya niile
  choice: Isi ederede na-ekwu na onye nche ahụ na ndị ụlọ ya niile ṅụrịrị ọṅụ, ma participle nke okwukwe ahụ ka dị n'ụdị otu onye.
  alternative: A pụrụ ịghọta ya na ndị ụlọ ya niile sokwara kwere na Chineke, ma ọ bụ na ọ ṅụrịrị ọṅụ n'ihi na ụlọ ya dum ekwere.
  rationale: πανοικεὶ nwere ike ịkọwa ọṅụ nke ụlọ ahụ dum, ebe πεπιστευκώς bụ otu nwoke ma na-arụtụ aka ozugbo n'onye nche ahụ. Ya mere, ederede anaghị ekwu hoo haa na naanị ya kwere, ọ naghịkwa amanye echiche na onye ọ bụla n'ụlọ ahụ kwere.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe ma dị ùgwù, dee ya. “Ndị ụlọ ya niile” na-ekpuchi ezinụlọ na ndị ọzọ bi n'ụlọ ahụ, ebe “ebe o kweworo” na-echekwa ọdịdị participle na nghọtahie nwere ike ịdị na njikọ ya na ọṅụ ahụ.
