  text: καὶ καταγγέλλουσιν ἔθη ἃ οὐκ ἔξεστιν ἡμῖν παραδέχεσθαι οὐδὲ ποιεῖν Ῥωμαίοις οὖσιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/021.yaml
  text: and they are proclaiming customs that it is not lawful for us to accept or practice[a], since we are Romans.
translation:
  language: ig
  text: Ha na-ekwupụta omenala ndị iwu na-adịghị ekwe ka anyị nabata ma ọ bụ mee, ebe anyị bụ ndị Rom.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “dịka ndị Rom” ma ọ bụ “n’ihi na anyị bụ ndị Rom.” Nkebi okwu Grik ahụ na-egosi ihe ndị na-ebo ebubo nyere dịka ihe kpatara ha ji jụ omenala ndị a.
    reason: lexical_alternative
lexical_decisions:
- source_word: καταγγέλλουσιν
  choice: na-ekwusakwa
  rationale: Okwu a na-egosi ikwusa ma ọ bụ ime ka ihe mara n'ihu ọha. Ụdị na-aga n'ihu dabara n'ebubo a, ebe ‘-kwa’ jikọtara ya na ebubo dị n'amaokwu bu ụzọ.
- source_word: ἔθη
  choice: omenala
  rationale: ‘Omenala’ na-egosi usoro na omume ndị otu mmadụ nabatara, nke dabara n'ebubo gbasara ndụ obodo na okpukpe.
- source_word: οὐκ ἔξεστιν
  choice: iwu na-akwadoghị
  rationale: Nke a na-edobe ụda iwu nke ebubo ahụ, kama ime ka ọ bụrụ nanị ihe na-ekwesịghị ekwesị.
- source_word: παραδέχεσθαι
  choice: ka anyị nabata
  rationale: ‘Nabata’ na-ekpuchi ịnakwere omenala ndị ahụ dị ka ihe ziri ezi ma ọ bụ ihe mmadụ ga-agbaso, n'ebughị ụzọ mee ka ọ pụta nanị ‘ịmalite ime ha.’
- source_word: οὐδὲ ποιεῖν
  choice: ma ọ bụ na-eme
  rationale: N'okwu gbasara omenala, ‘ime’ pụtara itinye ha n'omume; nhazi a bụkwa nke nkịtị n'Igbo.
- source_word: Ῥωμαίοις οὖσιν
  choice: ebe anyị bụ ndị Rom
  rationale: ‘Ebe’ na-egosi ihe kpatara ndị na-ebo ebubo ji sị na iwu akwadoghị ya, ma na-ahapụ ntakịrị oghere dị n'ụdị nkebi okwu participle Grik.
theological_decisions:
- issue: Ụdị mmachibido iwu dị n'ebubo ahụ
  choice: 'E gosipụtara ya dịka ebubo metụtara iwu: ‘iwu na-akwadoghị ka anyị...’'
  alternative: ‘ọ dịghị mma ka anyị...’
  rationale: Ihe a bụ okwu ndị na-ebo ebubo kwuru, ọ bụghị nkwenye onye ode akwụkwọ na iwu Rom machibidoro omenala ndị ahụ n'ezie. Nsụgharị ahụ na-edobe ụda iwu ahụ n'ebughị nkọwa ọzọ.
- issue: Mmekọrịta Ῥωμαίοις οὖσιν na mmachibido ahụ
  choice: ‘ebe anyị bụ ndị Rom’ dịka ihe kpatara ebubo ahụ
  alternative: ‘dịka ndị Rom’ ma ọ bụ ‘anyị bụ ndị Rom’
  rationale: Nkebi okwu participle ahụ na-enye ihe ndị na-ebo ebubo ji kwado ịjụ omenala ndị ahụ; ihe odide ala peeji na-edobe ụzọ ndị ọzọ e nwere isi ghọta ma sụgharịa ya.
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. ‘Omenala,’ ‘nabata,’ na ‘ime’ bụ okwu ndị nkịtị ma na-edobe ọdịiche dị n'etiti ịnakwere omenala na itinye ya n'omume. Akara ihe odide ala peeji [a] dị n'ederede isi.
