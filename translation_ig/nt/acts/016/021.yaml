    issue: The phrase ‘ka anyị nabata ma ọ bụ na-eme’ has mismatched verbal forms.
    rationale: The Greek has two coordinated infinitives, ‘to accept’ and ‘to do/practice.’ In Standard Igbo, ‘ka anyị nabata ma ọ bụ mee’ supplies parallel forms and correctly expresses the second action.
  - severity: low
    issue: The footnote marker is attached to ‘na-eme,’ although its note concerns ‘ebe anyị bụ ndị Rom.’
    rationale: Move the anchor to the Roman-identity phrase so that the note is attached to the expression it explains.
