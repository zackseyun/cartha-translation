- from: Ha na-ekwusakwa omenala ndị iwu na-akwadoghị ka anyị nabata ma ọ bụ na-eme[a], ebe anyị bụ ndị Rom.
  to: Ha na-ekwupụta omenala ndị iwu na-adịghị ekwe ka anyị nabata ma ọ bụ mee, ebe anyị bụ ndị Rom.[a]
  rationale: The revision corrects the nonparallel verb construction, preserves the present public charge and legal-civic register, and relocates the footnote anchor to the Greek participial phrase (Ῥωμαίοις οὖσιν) that the note discusses. It does not imply that the accusers’ legal assertion is true.
