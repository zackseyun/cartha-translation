id: ACT.16.17
reference: Acts 16:17
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: αὕτη ⸀κατακολουθοῦσα τῷ Παύλῳ καὶ ἡμῖν ἔκραζεν λέγουσα· Οὗτοι οἱ ἄνθρωποι δοῦλοι τοῦ θεοῦ τοῦ ὑψίστου εἰσίν, οἵτινες καταγγέλλουσιν ⸀ὑμῖν ὁδὸν σωτηρίας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/017.yaml
  text: She kept following Paul and us and crying out[a], saying, “These men are servants of the Most High God, who are proclaiming to you the way of salvation.”
translation:
  language: ig
  text: Ọ nọgidere na-eso Pọl na anyị, na-eti mkpu sị, “Ndị ikom a bụ ndị ohu nke Chineke Kasị Elu, ndị na-ekwusara unu ụzọ nzọpụta[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịghọta ya dịka “otu ụzọ nzọpụta” ma ọ bụ “ụzọ nzọpụta ahụ.” N’asụsụ Grik, okwu “ụzọ” enweghị article n’ebe a; ya mere, okwu ahụ anaghị akọwa ma ụzọ ahụ bụ nke a kapịrị ọnụ ma ọ bụ na ọ bụghị.
    reason: alternative_reading
lexical_decisions:
- source_word: κατακολουθοῦσα
  choice: nọgidere na-eso
  rationale: Ọ na-egosi omume nke gara n’ihu ma ọ bụ nke a na-eme ugboro ugboro; ‘nọgidere na-eso’ na-enye echiche ahụ n’Igbo nkịtị.
- source_word: ἔκραζεν
  choice: na-eti mkpu
  rationale: Oge ngwaa Grik a na-egosi mkpu siri ike nke gara n’ihu ma ọ bụ nke a na-eme ugboro ugboro, n’enweghị ịkọwapụta ụdị mmetụta uche ya.
- source_word: δοῦλοι
  choice: ndị ohu
  rationale: ‘Ndị ohu’ na-echekwa echiche nke ịbụ ndị nwe ha bụ Chineke, ọ bụghị naanị ndị na-arụrụ ya ọrụ n’efu.
- source_word: τοῦ θεοῦ τοῦ ὑψίστου
  choice: nke Chineke Onye Kachasị Elu
  rationale: Nke a bụ aha nsọpụrụ Chineke; nsụgharị a bụ Igbo doro anya ma na-echekwa echiche nke ὕψιστος.
- source_word: καταγγέλλουσιν
  choice: na-ekwusara
  rationale: Okwu a pụtara ikwupụta ozi n’ihu ọha; ‘na-ekwusara’ na-egosikwa omume dị ugbu a.
- source_word: ὑμῖν
  choice: unu
  rationale: Ọ na-egosi ndị a na-agwa ozi ahụ; ‘na-ekwusara unu’ bụ usoro okwu Igbo dị eke.
- source_word: ὁδὸν σωτηρίας
  choice: ụzọ nzọpụta
  rationale: 'Igbo anaghị eji mkpụrụokwu dịka article Bekee n’ebe a, ya mere ‘ụzọ nzọpụta’ na-echekwa ohere nghọta Grik ahụ: ọ pụrụ ịbụ ‘otu ụzọ nzọpụta’ ma ọ bụ ‘ụzọ nzọpụta ahụ,’ dabere n’ọnọdụ.'
theological_decisions:
- issue: Ma ὁδὸν σωτηρίας bụ nke a kapịrị ọnụ ma ọ bụ na ọ bụghị
  choice: ụzọ nzọpụta
  alternative: otu ụzọ nzọpụta; ụzọ nzọpụta ahụ
  rationale: ὁδόν enweghị article na Grik. ‘Ụzọ nzọpụta’ bụ Igbo dị eke nke na-adịghị amanye otu n’ime nghọta abụọ ahụ, ya mere ọ na-echekwa mgbagwoju anya dị n’isiokwu ahụ kama idozi ya n’ụzọ ozizi.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. ‘Ndị ohu’ na-echekwa ike okwu δοῦλοι, ebe ‘ụzọ nzọpụta’ na-ahapụ nghọta nke definiteness ka ọ dị na Grik.
