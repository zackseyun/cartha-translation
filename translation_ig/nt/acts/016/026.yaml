  to: Na mberede, oké ala ọma jijiji mere, nke mere ka ntọala ụlọ mkpọrọ[a] maa jijiji. Ozugbo ahụ, ọnụ ụzọ niile meghere, agbụ onye ọ bụla tọpụkwara[b].
