id: ACT.16.26
reference: Acts 16:26
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἄφνω δὲ σεισμὸς ἐγένετο μέγας ὥστε σαλευθῆναι τὰ θεμέλια τοῦ δεσμωτηρίου, ἠνεῴχθησαν ⸀δὲ παραχρῆμα αἱ θύραι πᾶσαι, καὶ πάντων τὰ δεσμὰ ἀνέθη.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/026.yaml
  text: Suddenly there was a great earthquake[a], so that the foundations of the prison were shaken; and immediately all the doors were opened[b], and everyone's chains were unfastened.
translation:
  language: ig
  text: Na mberede, oké ala ọma jijiji mere, nke mere ka ntọala ụlọ mkpọrọ[a] maa jijiji. Ozugbo ahụ, ọnụ ụzọ niile meghere, agbụ onye ọ bụla tọpụkwara[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya “ụlọ nga.” Okwu Grik δεσμωτήριον pụtara ebe a na-ejide ndị mkpọrọ.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ihe e ji kee onye ọ bụla tọpụkwara.” Okwu Grik δεσμά nwere ike ịpụta “agbụ” ma ọ bụ “ihe e ji kee mmadụ”; ἀνέθη pụkwara ịpụta “atọpụkwara” ma ọ bụ “wepụpụtara.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄφνω
  choice: Na mberede
  rationale: Nke a na-egosi na ihe ahụ mere na-atụghị anya ya ma na mberede; ọ bụkwa okwu Igbo nkịtị dabara n’akụkọ.
- source_word: σεισμὸς ἐγένετο μέγας
  choice: oké ala ọma jijiji mere
  rationale: “Oké” na-echekwa μέγας n’enweghị ịkọwa ya karịa ihe Grik kwuru, ebe “ala ọma jijiji mere” bụ ụzọ Igbo si ekwu na earthquake occurred.
- source_word: ὥστε σαλευθῆναι
  choice: nke mere ka ... maa jijiji
  rationale: Nke a na-egosipụta nsonaazụ nke ὥστε ma na-asụ ya n’ụzọ doro anya ma dị ndụ n’Igbo.
- source_word: τὰ θεμέλια τοῦ δεσμωτηρίου
  choice: ntọala ụlọ mkpọrọ
  rationale: “Ntọala” na-ezo aka n’akụkụ ụlọ e wuru n’ala, ebe “ụlọ mkpọrọ” bụ okwu Standard Igbo a na-aghọta nke ọma maka ebe a na-ejide ndị mkpọrọ.
- source_word: ἠνεῴχθησαν ... αἱ θύραι πᾶσαι
  choice: ọnụ ụzọ niile meghere
  rationale: Nhazi a bụ Igbo eke ma na-echekwa echiche na ọnụ ụzọ niile ghọrọ ndị mepere emepe, n’agbanyeghị na Grik ji ụdị ngwaa passive.
- source_word: παραχρῆμα
  choice: Ozugbo ahụ
  rationale: Ọ na-egosi na ihe ahụ mere n’otu ntabi anya, na-esochi ala ọma jijiji ahụ.
- source_word: πάντων
  choice: mmadụ niile
  rationale: N’ọnọdụ a, ọ na-ezo aka n’agbụ ndị niile nọ n’ụlọ mkpọrọ; “mmadụ niile” na-enye echiche nke mmadụ ọ bụla n’ụzọ Igbo dị mfe.
- source_word: τὰ δεσμὰ
  choice: agbụ
  rationale: δεσμά nwere ike ịbụ ihe e ji kee mmadụ ma ọ bụ agbụ kpọmkwem; “agbụ” dabara nke ọma n’ọnọdụ ụlọ mkpọrọ ma ka na-edebe ihe a na-ahụ anya nke okwu ahụ.
- source_word: ἀνέθη
  choice: tọpụkwara
  rationale: Nke a na-egosi na ihe e ji kee ha ghọrọ ihe tọpụụrụ, n’enweghị ịgbakwunye na ndị mkpọrọ ahụ agbapụla ma ọ bụ na a tọhapụrụ ha kpamkpam.
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. E kewara amaokwu ahụ n’ahịrịokwu abụọ ka akụkọ ahụ na-aga nke ọma n’Igbo, ma e chekwara njikọ nsonaazụ dị na ὥστε. A doziri akara nkọwa ala ka ha soro okwu ha na-akọwa kpọmkwem.
