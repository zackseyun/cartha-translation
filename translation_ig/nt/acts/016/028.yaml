  text: ἐφώνησεν δὲ ⸂φωνῇ μεγάλῃ ὁ Παῦλος⸃ λέγων· Μηδὲν πράξῃς σεαυτῷ κακόν, ἅπαντες γάρ ἐσμεν ἐνθάδε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/028.yaml
  text: But Paul shouted with a loud voice[a], saying, “Do not do yourself any harm, for we are all here.”
translation:
  language: ig
  text: Ma Pọl tiri mkpu n’oké olu, sị, “Emerụla onwe gị ahụ, n’ihi na anyị niile nọ n’ebe a.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐφώνησεν ... φωνῇ μεγάλῃ
  choice: tiri mkpu n’olu dara ụda
  rationale: N’ọnọdụ mberede a, nkebiokwu a na-egosi na Pọl kpọrọ oku n’ike ka onye nche nụ ya ozugbo. Nsụgharị a na-edobe ma omume iti mkpu ma ịdị ukwuu nke olu ahụ.
- source_word: δὲ
  choice: Ma
  rationale: 'Ọ na-egosi mgbanwe nwere obere mmegide: Pọl kwụsịrị ihe onye nche ahụ chọrọ ime.'
- source_word: λέγων
  choice: sị
  rationale: Nke a bụ ụzọ Igbo dị mfe ma kwekọọ n’okike isi webata okwu Pọl kwuru.
- source_word: Μηδὲν πράξῃς σεαυτῷ κακόν
  choice: Emerụla onwe gị ahụ
  rationale: Nke a bụ iwu mgbochi doro anya ma bụrụkwa okwu Igbo sitere n’okike. Ọ na-echekwa ntụaka reflexive nye ihe onye nche ahụ chọrọ ime onwe ya, n’enweghị ịkọwa ụzọ mmerụ ahụ ahụ kpọmkwem.
- source_word: ἅπαντες
  choice: anyị niile
  rationale: Ọ na-emesi ike na ọ dịghị onye n’ime ndị mkpọrọ ahụ na-efu.
- source_word: γάρ
  choice: n’ihi na
  rationale: Ọ na-egosi ihe mere onye nche ahụ na-ekwesịghị imerụ onwe ya ahụ.
- source_word: ἐνθάδε
  choice: n’ebe a
  rationale: Nke a bụ ụzọ Igbo sitere n’okike isi gosi ebe ha nọ.
- source_word: ὁ Παῦλος
  choice: Pọl
  rationale: E ji ụdị aha a na-ejikarị na Standard Igbo dee aha Παῦλος.
