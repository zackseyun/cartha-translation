translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji “Emerụla onwe gị ahụ” mee ka okwu ahụ bụrụ nke sitere n’okike ma ghara ibubata nkọwa karịrị ọnọdụ na ederede Grik.
