- from: Mgbe ha tisịrị ha ọtụtụ ihe[a], ha tụbara ha n’ụlọ mkpọrọ[b], nyezie onye nche ụlọ mkpọrọ iwu ka o chekwaa ha nke ọma.
  to: Mgbe ha tisịrị ha ọtụtụ ntị[a], ha tụbara ha n’ụlọ mkpọrọ[b], ma nye onye nche ụlọ mkpọrọ iwu ka o debe ha n’oké nche.
  rationale: The revision removes ambiguity in the rendering of “many blows,” improves the natural connective structure, and renders the jailer’s duty as secure detention rather than general protection. It retains the vivid force of “tùbara” and does not over-specify the instrument used for the beating.
