translation_notes:
  register: Standard Igbo dị ugbu a, nke kwanyere ugwu ma dị mfe nghọta. “Ịti ihe,” “ụlọ mkpọrọ,” na “onye nche ụlọ mkpọrọ” bụ okwu ndị nkịtị ga-aghọta ozugbo; ahịrịokwu ahụ na-echekwa usoro oge na ike nke akụkọ Grik.
