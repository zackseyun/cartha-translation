review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the sequence of beating, imprisonment, and an order to the prison official. However, “ọtụtụ ihe” is lexically broad and can be heard simply as “many things,” rather than clearly denoting blows. “chekwaa ha nke ọma” can suggest protecting or caring for them, whereas ἀσφαλῶς τηρεῖν here requires secure custody that prevents escape.
  naturalness: The overall sentence is understandable Standard Igbo, but “nyezie” is less natural in this construction. “ma nye ... iwu” is smoother. “Debe ha n’oké nche” is a natural custodial expression and makes the intended sense of secure confinement explicit.
  terminology: “ụlọ mkpọrọ” and “onye nche ụlọ mkpọrọ” are clear, appropriate renderings of φυλακή and δεσμοφύλαξ. The revision retains the non-specific character of πληγαί by using “ọtụtụ ntị,” an established expression for blows/beatings, without specifying lashes or an instrument.
  issues:
  - severity: medium
    issue: “ọtụtụ ihe” is ambiguous for πληγάς.
    rationale: Although the idiom ịta mmadụ ihe can mean beat someone, the noun phrase “ọtụtụ ihe” can readily be understood as “many things.” “ọtụtụ ntị” identifies the referent as blows while not specifying their instrument.
  - severity: medium
    issue: “chekwaa ha nke ọma” does not adequately express secure custody.
    rationale: Chekwaa commonly carries the sense protect, save, or look after. The Greek adverb emphasizes keeping the prisoners under secure guard. “debe ha n’oké nche” clearly communicates that custodial sense.
  - severity: low
    issue: “nyezie” is stylistically awkward.
    rationale: The plain connective construction “ma nye ... iwu” naturally renders the accompanying participle παραγγείλαντες.
  revised_text: Mgbe ha tisịrị ha ọtụtụ ntị[a], ha tụbara ha n’ụlọ mkpọrọ[b], ma nye onye nche ụlọ mkpọrọ iwu ka o debe ha n’oké nche.
