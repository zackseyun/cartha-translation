  text: πολλάς ⸀τε ἐπιθέντες αὐτοῖς πληγὰς ἔβαλον εἰς φυλακήν, παραγγείλαντες τῷ δεσμοφύλακι ἀσφαλῶς τηρεῖν αὐτούς·
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/023.yaml
  text: And after they had inflicted many blows on them[a], they threw them into prison[b], ordering the jailer to keep them securely.
translation:
  language: ig
  text: Mgbe ha tisịrị ha ọtụtụ ntị[a], ha tụbara ha n’ụlọ mkpọrọ[b], ma nye onye nche ụlọ mkpọrọ iwu ka o debe ha n’oké nche.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “ọtụtụ ụtarị” ma ọ bụ “ịta ha ihe ọtụtụ ugboro.” Okwu Grik ahụ na-ekwu maka ọtụtụ ihe a tiri ha, ma ọ kọwaghị kpọmkwem ihe e ji tie ha n’ebe a.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ebe mkpọrọ.” Okwu Grik ahụ nwere ike ịpụta ebe a na-edebe mmadụ n’okpuru njide n’ụzọ zuru ezu.
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλάς ... πληγὰς
  choice: ọtụtụ ihe
  rationale: N'okwu a, “ịti mmadụ ihe” bụ ụzọ Igbo si akọwa iti mmadụ ọtụtụ ugboro, n'ekwughị ụdị ngwá e ji tie ya; “ọtụtụ” na-egosipụta πολλάς.
- source_word: τε
  choice: —
  rationale: Njikọ ya na akụkọ bu ụzọ pụtara ìhè site n'usoro ahịrịokwu Igbo; itinye “na” ná mmalite ga-eme ka okwu ghara ịdị nnọọ eke.
- source_word: ἐπιθέντες
  choice: Mgbe ha tisịrị
  rationale: A sụgharịrị participle ahụ dị ka omume mere tupu isi omume ahụ; ya na πληγάς, ọ pụtara iti mmadụ ihe.
- source_word: ἔβαλον εἰς φυλακήν
  choice: ha tụbara ha n’ụlọ mkpọrọ
  rationale: “Tụbara” na-echekwa ike dị na βάλλω karịa okwu dị larịị dịka “tinye,” ebe “ụlọ mkpọrọ” na-egosi ebe a kpọchiri ha.
- source_word: φυλακήν
  choice: ụlọ mkpọrọ
  rationale: N'ebe a, φυλακή na-ezo aka n'ebe a na-edebe ndị mkpọrọ, ọ bụghị naanị ọnọdụ nke ịnọ n'okpuru nche.
- source_word: παραγγείλαντες
  choice: nyezie ... iwu
  rationale: Nke a na-egosi iwu nwere ikike e nyere onye na-elekọta ụlọ mkpọrọ, ma jikọta ya nke ọma na isi omume ahụ.
- source_word: δεσμοφύλακι
  choice: onye nche ụlọ mkpọrọ
  rationale: Ọ bụ aha doro ndị na-agụ Igbo nke ọma anya maka onye ọrụ ya bụ ilekọta ndị mkpọrọ.
- source_word: ἀσφαλῶς
  choice: nke ọma
  rationale: N'usoro “chekwaa ha nke ọma,” okwu a na-egosi ka e debe ha n'ụzọ siri ike ka ha ghara ịgbapụ, ọ bụghị ichebe ha pụọ n'ihe ize ndụ.
- source_word: τηρεῖν
  choice: ka o chekwaa
  rationale: N'ọnọdụ ụlọ mkpọrọ, “chekwaa” pụtara ile ha anya ma debe ha n'okpuru njide.
- source_word: αὐτούς
  choice: ha
  rationale: Ọ na-ezo aka na Pọl na Saịlas, ma dịka ndị a tụbara n'ụlọ mkpọrọ ma dịka ndị a ga-echekwa.
