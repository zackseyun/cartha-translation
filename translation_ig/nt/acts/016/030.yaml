review_pass:
  verdict: revise
  source_fidelity: The sequence ('after bringing them outside'), respectful plural address, necessity question, and passive 'be saved' are otherwise represented faithfully. However, “Ndị nna m ukwu” adds 'fathers' (nna), which is not present in Κύριοι and is not an apt ordinary Igbo rendering of this social address.
  naturalness: “Mgbè ọ kpọpụtasịrị ha n’èzí, ọ sịrị” and “gịnị ka m ga-eme ka a zọpụta m?” are clear, modern Standard Igbo. “Ndị nwe m” is a more idiomatic respectful plural address than “Ndị nna m ukwu.”
  terminology: Use “Ndị nwe m” for the human respectful address here, avoiding both the added sense in “nna” and the divine connotation of “Onyenwe anyị.” “a zọpụta m” suitably preserves the passive wording without narrowing the sense to a particular doctrinal formulation.
  issues:
  - severity: medium
    issue: “Ndị nna m ukwu” introduces an unwarranted element and is stylistically unsuitable for Κύριοι.
    rationale: The Greek vocative plural is a courteous address equivalent to 'Sirs'; it does not contain a term meaning 'father.' “Ndị nwe m” is the established natural respectful form in this context.
  revised_text: Mgbè ọ kpọpụtasịrị ha n’èzí, ọ sịrị, “Ndị nwe m,[a] gịnị ka m ga-eme ka a zọpụta m?”
