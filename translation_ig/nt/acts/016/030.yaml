  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ προαγαγὼν αὐτοὺς ἔξω ἔφη· Κύριοι, τί με δεῖ ποιεῖν ἵνα σωθῶ;
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/030.yaml
  text: And after bringing them outside[a], he said, “Sirs[b], what must I do so that I may be saved?”
translation:
  language: ig
  text: Mgbè ọ kpọpụtasịrị ha n’èzí, ọ sịrị, “Ndị nwe m,[a] gịnị ka m ga-eme ka a zọpụta m?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ndị nwe m” bụ okwu nkwanye ùgwù e ji agwa mmadụ abụọ okwu n’ebe a; ọ na-asụgharị okwu Grik bụ kyrioi, ọ bụghị aha nsọ “Onyenwe anyị.”
    reason: lexical_alternative
lexical_decisions:
- source_word: προαγαγὼν
  choice: Mgbe ọ kpọpụtasịrị
  rationale: Aorist participle a na-egosi omume mere tupu okwu ahụ; nkebi a na-asụ nke ọma n’Igbo ma debe usoro ihe mere.
- source_word: αὐτοὺς ἔξω
  choice: ha n’èzí
  rationale: Nke a na-egosi na ọ kpọpụtara ha gaa n’ebe dị n’èzí.
- source_word: ἔφη
  choice: ọ sịrị
  rationale: Ọ bụ ụzọ Igbo nkịtị na nke doro anya isi webata okwu mmadụ kwuru n’akụkọ.
- source_word: Κύριοι
  choice: Ndị nna m ukwu
  rationale: Vocative plural a bụ okwu nkwanye ùgwù a kpọrọ Pọl na Saịlas, ọ bụghị aha nsọ Chineke bụ ‘Onyenwe anyị.’
- source_word: τί με δεῖ ποιεῖν
  choice: gịnị ka m ga-eme
  rationale: N’ọnọdụ a, ‘ga-eme’ na-egosipụta ihe dị mkpa ma bụrụkwa ajụjụ a na-asụ n’ụzọ ebumpụta ụwa n’Igbo.
- source_word: ἵνα σωθῶ
  choice: ka a zọpụta m
  rationale: Nke a na-edebe nkebi nzube/ntụpụta na olu nnara nke σωθῶ, n’ebughị ụzọ kọwaa onye na-eme nzọpụta ahụ.
theological_decisions:
- issue: Ihe σωθῶ pụtara n’ajụjụ onye nche ụlọ mkpọrọ
  choice: ka a zọpụta m
  alternative: ka m nwee nzọpụta; ka a napụta m
  rationale: N’Ọrụ Ndịozi, σώζω pụrụ ịpụta ịnapụta mmadụ n’ihe ize ndụ ma ọ bụ nzọpụta n’ụzọ ime mmụọ. Ihe gbara amaokwu a gburugburu, karịchaa azịza dị n’amaokwu 31, na-akwado ‘zọpụta,’ ma okwu a ka na-echekwa obosara nghọta ya n’etinyeghị ozizi otu ụka.
- issue: Otú e si ghọta Κύριοι
  choice: okwu nkwanye ùgwù nye mmadụ abụọ
  alternative: Onyenwe anyị / ndị nwe m
  rationale: Ọ bụ vocative plural a gwara Pọl na Saịlas; ya mere, ọ bụghị aha nsọ e ji akpọ Chineke.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. A họọrọ ‘kpọpụtasịrị’ iji gosi omume mere tupu o kwuo okwu, ‘ka a zọpụta m’ iji debe olu nnara, na okwu nkwanye ùgwù nke plural iji gosi na ọ na-agwa Pọl na Saịlas okwu.
