revisions:
- from: Mgbe ọ kpọpụtasịrị ha n’èzí, ọ sịrị, “Ndị nna m ukwu,[a] gịnị ka m ga-eme ka a zọpụta m?”
  to: Mgbè ọ kpọpụtasịrị ha n’èzí, ọ sịrị, “Ndị nwe m,[a] gịnị ka m ga-eme ka a zọpụta m?”
  rationale: The revision replaces the inaccurate and less natural “Ndị nna m ukwu” with “Ndị nwe m,” which conveys the jailer’s respectful address to Paul and Silas without adding meaning. The remaining wording is retained because it accurately reflects the Greek syntax and passive sense.
  reviewer_model: gpt-5.6-terra
