  text: καὶ ἐλάλησαν αὐτῷ τὸν λόγον τοῦ ⸀κυρίου ⸀σὺν πᾶσι τοῖς ἐν τῇ οἰκίᾳ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/032.yaml
  text: And they spoke the word of the Lord to him[c][b][a], together with all who were in his house.
translation:
  language: ig
  text: Ha gwara ya[c] na ndị niile nọ n’ụlọ ya[b] okwu nke Onyenwe anyị[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ozi gbasara Onyenwe anyị.” Nkebiokwu Grik ahụ, “okwu nke Onyenwe anyị,” nwere ike ịpụta ozi bụ nke Onyenwe anyị, nke sitere n’aka ya, ma ọ bụ nke gbasara ya.
    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ, “ya na ndị ezinụlọ ya niile.”
    reason: lexical_alternative
  - marker: c
    text: 'A pụkwara ịhazi ahịrịokwu a otú a: “Ha gwara ya, ya na ndị niile nọ n’ụlọ ya, okwu nke Onyenwe anyị.”'
    reason: previous_rendering
lexical_decisions:
- source_word: ἐλάλησαν
  choice: Ha gwara … okwu
  rationale: Nkebiokwu Igbo a na-egosi ịgwa mmadụ okwu n’ụzọ doro anya ma kwekọọ n’omume aorist nke λαλέω; ọ naghị etinye echiche nke nkwusa ihu ọha nke okwu Grik ahụ ekwughị kpọmkwem.
- source_word: αὐτῷ
  choice: ya
  rationale: Nnochiaha a na-ezo aka n’onye nche ụlọ mkpọrọ; n’usoro ‘ịgwa mmadụ okwu,’ ‘ya’ bụ ụzọ Igbo si egosi onye a gwara okwu.
- source_word: τὸν λόγον
  choice: okwu
  rationale: N’ebe a λόγος bụ ozi Ndị Kraịst e kwuru ọnụ. ‘Okwu’ na-edobe akpaalaokwu Agba Ọhụrụ ma na-eme ka njikọ ya na ‘nke Onyenwe anyị’ pụta ìhè.
- source_word: τοῦ κυρίου
  choice: nke Onyenwe anyị
  rationale: ‘Onyenwe anyị’ bụ nsụgharị kwesịrị ekwesị nke κύριος. ‘Nke’ na-edobe obosara nghọta genitive ahụ kama ikpebi ma okwu ahụ si n’aka Onyenwe anyị, bụ nke ya, ma ọ bụ gbasara ya.
- source_word: σὺν πᾶσι τοῖς ἐν τῇ οἰκίᾳ αὐτοῦ
  choice: ya na ndị niile nọ n’ụlọ ya
  rationale: ‘Ya na’ na-egosipụta σύν (‘tinyere/ya na’) ma na-egosi na ndị ọzọ niile nọ n’ụlọ ahụ sokwa n’ọnọdụ a na-agwa okwu.
- source_word: οἰκίᾳ
  choice: ụlọ
  rationale: ‘Ụlọ’ na-edobe ihe οἰκία kwuru kpọmkwem, ebe ihe gbara ya gburugburu na-egosi na a na-ekwu maka ndị nọ n’ebe ahụ; ‘ezinụlọ’ ka bụ nghọta ọzọ kwere omume.
theological_decisions:
- issue: Ihe ‘okwu nke Onyenwe anyị’ pụtara kpọmkwem
  choice: E debere ya dịka ‘okwu nke Onyenwe anyị’ n’akọwaghị ụdị njikọ genitive ahụ.
  alternative: ozi gbasara Onyenwe anyị; ozi sitere n’aka Onyenwe anyị
  rationale: Nkebiokwu Grik ahụ nwere ike ịpụta okwu nke Onyenwe anyị, nke sitere n’aka ya, ma ọ bụ nke gbasara ya. Nsụgharị bụ isi na-edobe obosara na esemokwu nghọta ahụ kama ịmanye naanị otu nkọwa.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. ‘Ha gwara … okwu’ bụ usoro Igbo eke; ‘Onyenwe anyị’ na-edobe aha nsọpụrụ κύριος n’enweghị itinye nkọwa ụka pụrụ iche. Akara [a], [b], na [c] niile dị n’ederede bụ isi.
