    reason: previous_rendering
  revision_rationale: The revision places both recipient groups together in the normal Igbo construction “ịgwa mmadụ na mmadụ okwu,” making clear that the message was spoken to the jailer and to everyone in his house. It neither converts σύν into a doctrinally loaded claim nor narrows the flexible genitive in “okwu nke Onyenwe anyị.” The alternate, more source-order-sensitive phrasing is retained in footnote c.
