id: ACT.16.20
reference: Acts 16:20
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ προσαγαγόντες αὐτοὺς τοῖς στρατηγοῖς εἶπαν· Οὗτοι οἱ ἄνθρωποι ἐκταράσσουσιν ἡμῶν τὴν πόλιν Ἰουδαῖοι ὑπάρχοντες,
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/020.yaml
  text: And after bringing them before the magistrates[a], they said, “These men are disturbing our city[b], being Jews,”
translation:
  language: ig
  text: Mgbe ha kpọpụtara ha n’ihu ndị isi ọchịchị obodo[a], ha sịrị, “Ndị ikom a na-akpaghasị obodo anyị; ha bụ ndị Juu[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị praetọ,” ya bụ, ndị isi ọchịchị Rom n’obodo ọchịchị ndị Rom dịka Filipaị.
    reason: cultural_note
  - marker: b
    text: Ma ọ bụ, “ndị Judia.” Okwu Grik ahụ nwere ike ịpụta ndị Juu n’ozuzu ha ma ọ bụ ndị si Judia; n’ebe a, “ndị Juu” kacha daba n’ebubo metụtara agbụrụ na okpukpe.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσαγαγόντες
  choice: Mgbe ha kpọtaara ha
  rationale: Nkebi aorist a na-egosi ihe mere tupu ngwaa bụ́ isi; ‘Mgbe ha kpọtaara ha’ na-egosipụta usoro ahụ n’Igbo dị mfe ma kwekọọ n’isi mmalite.
- source_word: στρατηγοῖς
  choice: ndị ọkaikpe obodo
  rationale: N’Filipaị, okwu a na-ezo aka n’ụlọọrụ ọchịchị obodo Rom. ‘Ndị ọkaikpe obodo’ bụ okwu doro onye Igbo nke oge a anya, ebe nkọwa ala peeji na-echekwa aha teknụzụ ahụ.
- source_word: ἐκταράσσουσιν
  choice: na-akpaghasị
  rationale: Okwu a na-egosi ịkpata nnukwu ọgba aghara ma ọ bụ nsogbu. ‘Na-akpaghasị’ na-echekwa ebubo na-aga n’ihu n’enweghị ịgbatị ihe ọ pụtara.
- source_word: ἡμῶν τὴν πόλιν
  choice: obodo anyị
  rationale: Nke a na-echekwa mmetụta nke nkwupụta nwe obodo dị n’okwu ndị na-ebo ebubo.
- source_word: Ἰουδαῖοι
  choice: ndị Juu
  rationale: N’ọnọdụ a, okwu ahụ kacha yie ka ọ na-egosi njirimara agbụrụ na okpukpe Pọl na Saịlas n’ebe obodo Rom nọ; ‘ndị Juu’ bụ ntụgharị Igbo a na-aghọta nke ọma.
- source_word: ὑπάρχοντες
  choice: ha bụ
  rationale: Nke a na-echekwa njikọ dị mkpụmkpụ nke nkebi participle ahụ na ebubo ahụ, n’enweghị itinye okwu dịka ‘n’ihi na’ nke ga-ekpebi kpọmkwem otú njikọ ahụ si arụ ọrụ.
- source_word: Οὗτοι οἱ ἄνθρωποι
  choice: Ndị ikom a
  rationale: Okwu Grik ahụ bụ ọtụtụ nwoke ma na-ezo kpọmkwem aka na Pọl na Saịlas; ‘Ndị ikom a’ ziri ezi ma bụrụ Igbo nkịtị.
theological_decisions:
- issue: Ịsụgharị Ἰουδαῖοι n’ebubo metụtara agbụrụ na okpukpe
  choice: ndị Juu
  alternative: ndị Judia
  rationale: Amaokwu a na-akọ okwu mmegide nke ndị na-ebo Pọl na Saịlas ebubo; ọ bụghị ikpe onye ode akwụkwọ mara ndị Juu niile. N’Filipaị, ‘ndị Juu’ kacha dabara na njirimara agbụrụ na okpukpe, ebe ‘ndị Judia’ nwere ike ime ka ọ bụrụ naanị ebe mmadụ si.
- issue: Njikọ ὑπάρχοντες na ebubo ahụ
  choice: ha bụ ndị Juu
  alternative: n’ihi na ha bụ ndị Juu
  rationale: ‘Ha bụ’ na-echekwa nghọta na okwu Grik ahụ nwere ike ịbụ ọnọdụ so ebubo ma ọ bụ ihe ndị na-ebo ebubo jiri kwado ya; ịsụgharị ya ‘n’ihi na’ ga-eme ka ihe kpatara ebubo ahụ sie ike karịa ka isi mmalite kwuru.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Akara ntụaka [a] na [b] dị n’ahịrị isi n’ebe okwu ha na-akọwa nọ. Semicolon na-echekwa njikọ dị mkpụmkpụ ma na-edoghị anya kpamkpam n’etiti ịkpaghasị obodo na ịbụ ndị Juu.
