revisions:
- from: Mgbe ha kpọtaara ha n’ihu ndị ọkaikpe obodo[a], ha sịrị, “Ndị ikom a na-akpaghasị obodo anyị; ha bụ ndị Juu[b].”
  to: Mgbe ha kpọpụtara ha n’ihu ndị isi ọchịchị obodo[a], ha sịrị, “Ndị ikom a na-akpaghasị obodo anyị; ha bụ ndị Juu[b].”
  rationale: 'The revision corrects the official title so that it reflects the broader civic office denoted by στρατηγοί, while preserving all other source-level features: the prior act of bringing Paul and Silas forward, the present accusation of causing public disturbance, the accusers’ rhetoric of “our city,” and the compact designation “being Jews.” The revised cultural note identifies Philippi as a Roman colony without adding interpretive content.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T09:19:55Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately retains the preceding-action participle, the ongoing accusation that the city is being disturbed, the possessive force of “our city,” and the ethnic-religious designation “Jews.” However, “ndị ọkaikpe obodo” narrows στρατηγοί to judges. In this Philippian colonial setting the term denotes the city’s chief civic magistrates, whose role was broader than judicial.
  naturalness: The wording is clear Standard Igbo. “Ndị isi ọchịchị obodo” is a more natural and semantically broader designation for the officials in this context. The compact final clause preserves the Greek participial linkage without over-specifying causation.
  terminology: Retain “ndị Juu” for Ἰουδαῖοι. Replace the technical footnote form “ndị preeto” with the more recognizable borrowed designation “ndị praetọ,” while clarifying that these were Roman civic magistrates in a colony such as Filipaị.
  issues:
  - severity: medium
    issue: “ndị ọkaikpe obodo” is too narrowly judicial for στρατηγοῖς.
    rationale: The στρατηγοί at Philippi were Roman colonial civic magistrates (often termed praetors), not merely courtroom judges. A broader civic-administrative term better represents the source.
  - severity: low
    issue: Footnote a describes Philippi imprecisely and uses an unclear technical form.
    rationale: Philippi was a Roman colony; “ndị praetọ” and “ndị isi ọchịchị Rom” communicate the historical referent more clearly than calling it simply an “obodo ọchịchị Rom.”
  revised_text: Mgbe ha kpọpụtara ha n’ihu ndị isi ọchịchị obodo[a], ha sịrị, “Ndị ikom a na-akpaghasị obodo anyị; ha bụ ndị Juu[b].”
  revised_footnotes:
