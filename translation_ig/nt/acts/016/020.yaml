    text: Ma ọ bụ, “ndị praetọ,” ya bụ, ndị isi ọchịchị Rom n’obodo ọchịchị ndị Rom dịka Filipaị.
    reason: cultural_note
  - marker: b
    text: Ma ọ bụ, “ndị Judia.” Okwu Grik ahụ nwere ike ịpụta ndị Juu n’ozuzu ha ma ọ bụ ndị si Judia; n’ebe a, “ndị Juu” kacha daba n’ebubo metụtara agbụrụ na okpukpe.
    reason: lexical_alternative
  revision_rationale: 'The revision corrects the official title so that it reflects the broader civic office denoted by στρατηγοί, while preserving all other source-level features: the prior act of bringing Paul and Silas forward, the present accusation of causing public disturbance, the accusers’ rhetoric of “our city,” and the compact designation “being Jews.” The revised cultural note identifies Philippi as a Roman colony without adding interpretive content.'
