revisions:
- from: Site n’ebe ahụ gaa Filipaị[a], bụ́ otu n’ime obodo ndị a ma ama n’ógbè Masedonia, bụrụkwa obodo ndị Rom nyere ọnọdụ pụrụ iche[b]. Anyị nọrọ ụbọchị ole na ole n’obodo a.
  to: Site n’ebe ahụ, anyị gara Filipaị[a], nke bụ otu obodo pụtara ìhè n’ógbè Masedonia, bụrụkwa obodo koloni nke ndị Rom[b]. Anyị nọrọ ụbọchị ole na ole n’obodo a.
  rationale: The revision renders πρώτη with “otu obodo pụtara ìhè,” retaining the singular description and the likely sense of prominence while the footnote preserves “first” as a live alternative. It retains κολωνία directly as “obodo koloni” and explains its Roman status in a concise note. An explicit travel verb has been supplied for grammatical, modern Standard Igbo.
