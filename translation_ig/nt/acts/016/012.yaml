  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸀κἀκεῖθεν εἰς Φιλίππους, ἥτις ἐστὶν ⸂πρώτη τῆς μερίδος⸃ Μακεδονίας πόλις, κολωνία. ἦμεν δὲ ἐν ⸀ταύτῃ τῇ πόλει διατρίβοντες ἡμέρας τινάς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/012.yaml
  text: and from there to Philippi[a], which is a leading city of the district of Macedonia, a Roman colony[b]. And we stayed in this city for some days.
translation:
  language: ig
  text: Site n’ebe ahụ, anyị gara Filipaị[a], nke bụ otu obodo pụtara ìhè n’ógbè Masedonia, bụrụkwa obodo koloni nke ndị Rom[b]. Anyị nọrọ ụbọchị ole na ole n’obodo a.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “obodo mbụ n’ógbè Masedonia.” Akpaokwu Grik a siri ike ịkọwa; “mbụ” nwere ike izo aka n’ọkwa obodo ahụ, ịdị mkpa ya, ma ọ bụ ọnọdụ ya n’usoro.
    reason: alternative_reading
  - marker: b
    text: Ya bụ, obodo nwere ọnọdụ koloni n’okpuru ọchịchị Rom.
    reason: cultural_note
lexical_decisions:
- source_word: κἀκεῖθεν εἰς Φιλίππους
  choice: Site n’ebe ahụ gaa Filipaị
  rationale: Nke a na-ejigide njikọ njem dị n’akụkọ ahụ n’etinyeghị ngwaa ọhụrụ n’ahịrịokwu Grik; “Filipaị” bụ nsụgharị ụda aha obodo ahụ.
- source_word: πρώτη τῆς μερίδος Μακεδονίας πόλις
  choice: otu n’ime obodo ndị a ma ama n’ógbè Masedonia
  rationale: πρώτη nwere ike igosi ọkwa, ịbụ onye a ma ama, ma ọ bụ ịbụ nke mbụ n’usoro. Nhọrọ a na-egosipụta echiche nke ịbụ obodo pụtara ìhè n’enweghị ikwu hoo haa na ọ bụ isi obodo.
- source_word: κολωνία
  choice: obodo ndị Rom nyere ọnọdụ pụrụ iche
  rationale: κολωνία na-ekwu maka obodo nwere ọnọdụ iwu pụrụ iche n’okpuru ọchịchị Rom. Nsụgharị nkọwa a ga-edo anya nye ndị na-agụ Igbo taa karịa iji naanị okwu mgbazinye dịka “koloni.”
- source_word: ἦμεν ... διατρίβοντες
  choice: Anyị nọrọ
  rationale: Ọ na-egosipụta ịnọgide n’otu ebe ruo oge ụfọdụ, ma bụrụkwa ụzọ Igbo si ekwu ya n’ụzọ eke.
- source_word: ἡμέρας τινάς
  choice: ụbọchị ole na ole
  rationale: Ọ na-egosi oge a na-akọwaghị kpọmkwem ma dị mkpirikpi, n’enweghị ịkọ ọnụ ọgụgụ ụbọchị.
theological_decisions:
- issue: Ihe πρώτη pụtara n’otú e si kọwaa Filipaị
  choice: otu n’ime obodo ndị a ma ama
  alternative: obodo mbụ n’ógbè Masedonia
  rationale: Okwu Grik ahụ siri ike ịkọwa ma ọ pụkwara izo aka n’ọkwa, ama obodo ahụ, ma ọ bụ usoro njem. A hapụrụ nkọwa ọzọ n’ala ala peeji kama ime ka otu echiche yie ihe doro anya kpamkpam.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị nsọ ma dịkwa mfe nghọta. A kọwara ọnọdụ colonia n’ụzọ nkịtị kama iji okwu mgbazinye nwere ike ghara ido ndị nkịtị anya; e debere mgbagwoju anya nke πρώτη na ndetu ala peeji.
