id: ACT.16.10
reference: Acts 16:10
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὡς δὲ τὸ ὅραμα εἶδεν, εὐθέως ἐζητήσαμεν ἐξελθεῖν ⸀εἰς Μακεδονίαν, συμβιβάζοντες ὅτι προσκέκληται ἡμᾶς ὁ ⸀θεὸς εὐαγγελίσασθαι αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/010.yaml
  text: And when he had seen the vision[a], we immediately sought to go on into Macedonia[c][b], concluding that God had called us to proclaim the good news to them.
translation:
  language: ig
  text: Mgbe ọ hụchara ọhụụ ahụ, ozugbo ahụ anyị gbalịrị ịpụ gaa Masedonia, ebe anyị kwubiri na Chineke akpọọla anyị ka anyị kwusaara ha ozi ọma.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡς δὲ
  choice: Mgbe
  rationale: Na-ejikọta ihe omume a na nke bu ya ụzọ ma gosipụta oge n'ụzọ dị mfe ma bụrụkwa Igbo eke.
- source_word: τὸ ὅραμα
  choice: ọhụụ ahụ
  rationale: “Ọhụụ” bụ okwu Igbo doro anya maka ihe e gosiri mmadụ n'ụzọ pụrụ iche; “ahụ” na-egosipụta okwu njirimara Grik.
- source_word: εἶδεν
  choice: ọ hụchara
  rationale: Ụdị a na-egosi na ịhụ ọhụụ ahụ mezuru tupu ihe ndị otu ahụ mere ozugbo.
- source_word: εὐθέως
  choice: ozugbo ahụ
  rationale: Na-echekwa echiche nke ime ihe n'egbughị oge.
- source_word: ἐζητήσαμεν
  choice: anyị gbalịrị
  rationale: N'ọnọdụ a, ζητέω pụtara ịgbalị ma ọ bụ ịmalite ime ndokwa; “anyị gbalịrị” bụ Igbo eke karịa nsụgharị nkịtị dịka “anyị chọọrọ.”
- source_word: ἐξελθεῖν εἰς Μακεδονίαν
  choice: ịga Makẹdọnịa
  rationale: Na-enye ebumnuche njem ahụ n'Igbo eke. Ọ bụ ezie na ἐξέρχομαι nwere echiche nke ‘ịpụ,’ ebe a ọ na-arụ ọrụ n'okwu njem gaa Makẹdọnịa.
- source_word: συμβιβάζοντες
  choice: ebe anyị kwubiri
  rationale: Na-egosi na ha chịkọtara ihe ọhụụ ahụ pụtara wee ruo ná nkwubi okwu.
- source_word: προσκέκληται
  choice: akpọọla anyị
  rationale: 'Na-echekwa ike nke perfekt Grik: Chineke akpọọla ha, ọkpụkpọ ahụ ka dịkwa mkpa n''oge ahụ.'
- source_word: ὁ θεὸς
  choice: Chineke
  rationale: Ọ bụ nsụgharị Igbo a na-ejikarị eme ihe maka θεός n'ebe a.
- source_word: εὐαγγελίσασθαι αὐτούς
  choice: ka anyị zie ha ozi ọma
  rationale: “Izi ha ozi ọma” bụ okwu Igbo doro anya, nke na-ebute omume ikwusara ndị ahụ ozi ọma n'enweghị asụsụ ụka siri ike.
theological_decisions:
- issue: Mgbanwe gaa n'onye mbụ n'ụbara, ἐζητήσαμεν (‘anyị’)
  choice: anyị gbalịrị
  alternative: Iji okwu na-enweghị onye kpọmkwem mee ka ‘anyị’ ghara ịpụta
  rationale: Grik gbanwere n'ụzọ doro anya gaa na ‘anyị’; nsụgharị ahụ na-echekwa njirimara akụkọ a n'etinyeghị echiche ọ bụla banyere onye dere akwụkwọ ahụ.
- issue: Ọkpụkpọ Chineke na προσκέκληται ἡμᾶς ὁ θεὸς
  choice: Chineke akpọọla anyị
  alternative: Chineke na-edu anyị ma ọ bụ kpọrọ anyị òkù
  rationale: προσκαλέομαι pụtara ịkpọ mmadụ ka ọ bịa ma ọ bụ ka ọ rụọ ọrụ; “akpọọla” na-echekwa mmalite na ikike nke omume Chineke karịa okwu ndị dị nro.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E tinyghị akara nkọwa ụkwụ n'ihi na amaokwu Igbo a achọghị nkọwa ọzọ iji chekwaa nghọta ma ọ bụ mgbagwoju anya dị n'isi Grik.
