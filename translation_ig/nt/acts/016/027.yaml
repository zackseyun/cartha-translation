id: ACT.16.27
reference: Acts 16:27
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἔξυπνος δὲ γενόμενος ὁ δεσμοφύλαξ καὶ ἰδὼν ἀνεῳγμένας τὰς θύρας τῆς φυλακῆς σπασάμενος ⸀τὴν μάχαιραν ἤμελλεν ἑαυτὸν ἀναιρεῖν, νομίζων ἐκπεφευγέναι τοὺς δεσμίους.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/027.yaml
  text: When the jailer woke up and saw the prison doors standing open[a], he drew his sword and was about to kill himself[b], supposing that the prisoners had escaped.
translation:
  language: ig
  text: Mgbe onye nche ụlọ mkpọrọ ahụ tetara ma hụ na ọnụ ụzọ ụlọ mkpọrọ ahụ ghe oghe[a], ọ mịpụtara mma agha ya, ọ fọrọ nke nta ka o gbuo onwe ya[b], n’ihi na o chere na ndị mkpọrọ ahụ agbapụla.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ịsụgharị ya n’ụzọ na-agbaso usoro okwu Grik karịa: “hụ na e meghere ọnụ ụzọ ụlọ mkpọrọ ahụ.” Participle perfect nke Grik na-elekwasị anya n’ọnọdụ ọnụ ụzọ ndị ahụ: ha ghe oghe.'
    reason: lexical_alternative
  - marker: b
    text: Okwu Grik μάχαιρα nwere ike ịpụta mma agha ma ọ bụ ngwa ọgụ dị mkpụmkpụ, dịka daga. E ji “mma agha” sụgharị ya ebe a dịka nsụgharị a na-ahụkarị n’ọnọdụ a.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔξυπνος ... γενόμενος
  choice: tetara
  rationale: Nke a na-egosi na ọ si n’ụra bata n’ọnọdụ ịmụrụ anya; “tetara” bụ ụzọ Igbo nkịtị na nke doro anya si kwuo ya.
- source_word: δεσμοφύλαξ
  choice: onye nche ụlọ mkpọrọ
  rationale: Ọ bụ onye e nyere ọrụ ilekọta ndị mkpọrọ, ọ bụghị naanị onye nche n’ozuzu.
- source_word: ἰδὼν ἀνεῳγμένας τὰς θύρας τῆς φυλακῆς
  choice: hụ na ọnụ ụzọ ụlọ mkpọrọ ahụ ghe oghe
  rationale: “Ghe oghe” na-egosipụta ọnọdụ ọnụ ụzọ ndị ahụ nọ na ya mgbe ọ hụrụ ha, kwekọọkwa na participle perfect passive nke Grik.
- source_word: σπασάμενος τὴν μάχαιραν
  choice: ọ mịpụtara mma agha ya
  rationale: Ngwakọta okwu Grik a pụtara ịmịpụta ngwa ọgụ maka iji ya; “mma agha” bụ nsụgharị zuru ezu na nke a na-ahụkarị maka μάχαιρα n’ebe a.
- source_word: ἤμελλεν ἑαυτὸν ἀναιρεῖν
  choice: na-achọkwa igbu onwe ya
  rationale: Ọ na-egosi na omume ahụ dị nso ime; ahịrịokwu Igbo a na-egosi nzube ahụ na ịdị nso ya n’ime ihe ahụ.
- source_word: νομίζων
  choice: n’ihi na o chere
  rationale: Participle a na-enye ihe kpatara omume ya ma na-egosi nkwubi okwu o mere, ọ bụghị ihe ọ maara n’ezie.
- source_word: ἐκπεφευγέναι
  choice: agbapụla
  rationale: Ụdị perfect infinitive na-egosi na, dịka echiche ya si dị, mgbapụ ahụ emechaala.
- source_word: τοὺς δεσμίους
  choice: ndị mkpọrọ
  rationale: N’ọnọdụ a, okwu ahụ na-ezo aka kpọmkwem n’ebe ndị a tụrụ mkpọrọ nọ.
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dịkwa mfe nghọta, mee ihe. “Onye nche ụlọ mkpọrọ” na-akọwa ọrụ δεσμοφύλαξ n’enweghị okwu pụrụ iche nke nwere ike ghara ido ọtụtụ ndị anya. E debere nghọtahie dị na μάχαιρα n’ala ala peeji.
