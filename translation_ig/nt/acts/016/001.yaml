id: ACT.16.1
reference: Acts 16:1
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Κατήντησεν δὲ ⸀καὶ εἰς Δέρβην καὶ ⸀εἰς Λύστραν. καὶ ἰδοὺ μαθητής τις ἦν ἐκεῖ ὀνόματι Τιμόθεος, υἱὸς ⸀γυναικὸς Ἰουδαίας πιστῆς, πατρὸς δὲ Ἕλληνος,
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/001.yaml
  text: He also came to Derbe and to Lystra[a]. And behold, a certain disciple was there named Timothy, the son of a believing Jewish woman, but of a Greek father[b],
translation:
  language: ig
  text: Ọ bịakwara na Debe nakwa Listra. Lee, otu onye na-eso ụzọ nọ n’ebe ahụ[a], aha ya bụ Timoti. Ọ bụ nwa nwanyị Juu, onye kwere ekwe[b], ma nna ya bụ onye Gris.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ịsụ ya: “E nwere otu onye na-eso ụzọ n’ebe ahụ, aha ya bụ Timoti.”'
    reason: previous_rendering
  - marker: b
    text: Ma ọ bụ, “onye kwesịrị ntụkwasị obi.” Okwu Grik ahụ nwere ike ịpụta ma “onye kwere ekwe” ma “onye kwesịrị ntụkwasị obi”; ma n’Ọrụ Ndịozi, “onye kwere ekwe” ka o yikarịrị ka ọ pụtara n’ebe a.
    reason: lexical_alternative
lexical_decisions:
- source_word: Κατήντησεν δὲ καὶ
  choice: Ọ bịakwara
  rationale: “Bịakwara” na-egosi na ọ bịarutere ebe ndị a ma na-ejigidekwa ike mgbakwunye dị na δὲ καὶ n’Igbo dị mfe.
- source_word: εἰς Δέρβην καὶ εἰς Λύστραν
  choice: na Debe nakwa Listra
  rationale: N’akụkọ njem, “na” na aha ebe na-egosi ịbịarute ebe ahụ; “nakwa” na-ejigide njikọ na mgbakwunye dị n’ahịrị Grik.
- source_word: καὶ ἰδοὺ
  choice: Lee
  rationale: “Lee” bụ akara akụkọ na-adọta uche onye na-agụ n’ihe na-esote, dịka ἰδού si eme.
- source_word: μαθητής τις
  choice: otu onye na-eso ụzọ
  rationale: “Otu onye” na-egosi onye a kapịrị ọnụ nke a ka na-ewebata, ebe “onye na-eso ụzọ” bụ okwu Igbo doro anya maka μαθητής.
- source_word: ἦν ἐκεῖ
  choice: nọ n’ebe ahụ
  rationale: Nke a na-egosi kpọmkwem na onye ahụ nọ ebe ahụ, ma zere nkwughachi na-adịghị eke n’Igbo.
- source_word: ὀνόματι Τιμόθεος
  choice: aha ya bụ Timoti
  rationale: Nke a bụ ụzọ Igbo dị ugbu a ma dị mfe isi kwuo na a na-akpọ ya Timoti.
- source_word: υἱὸς γυναικὸς Ἰουδαίας πιστῆς
  choice: nwa otu nwanyị Juu nke kwere ekwe
  rationale: Nhazi a na-egosi na nne Timoti bụ nwanyị Juu ma bụrụkwa onye kwere ekwe; ọ bụ nghọta kacha kwekọọ n’iji πιστός eme ihe n’Ọrụ Ndịozi.
- source_word: πατρὸς δὲ Ἕλληνος
  choice: ma nna ya bụ onye Gris
  rationale: Grik hapụrụ ngwaa n’ihi na a ghọtara ya site n’ihe bu ụzọ; Igbo chọrọ ahịrịokwu zuru ezu a iji mee ka ọdịiche nke δέ doo anya ma bụrụ ihe e ji ọnụ ekwu.
- source_word: Ἕλληνος
  choice: onye Gris
  rationale: Ἕλλην ebe a na-egosi onye Gris n’agbụrụ ma ọ bụ omenala, ọ bụghị naanị aha sara mbara maka onye mba ọzọ.
theological_decisions:
- issue: Ihe πιστῆς pụtara mgbe ọ na-akọwa nne Timoti
  choice: nke kwere ekwe
  alternative: onye kwesịrị ntụkwasị obi
  rationale: N’ụzọ Luk si eji πιστός eme ihe n’Ọrụ Ndịozi nakwa n’ọnọdụ a, o yikarịrị ka ọ na-akọwa ya dịka onye kweere. Agbanyeghị, ihe okwu ahụ nwere ike ịpụta ọzọ ka edebere n’ala peeji kama ikpochapụ mgbagwoju ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. “Lee” na-echekwa ịdị nkọ nke akara akụkọ Grik; “onye na-eso ụzọ” na “onye kwere ekwe” bụ okwu Ndị Kraịst a maara nke ọma na-enweghị itinye nkọwa otu ụka pụrụ iche.
