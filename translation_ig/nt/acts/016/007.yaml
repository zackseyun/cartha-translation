id: ACT.16.7
reference: Acts 16:7
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐλθόντες ⸀δὲ κατὰ τὴν Μυσίαν ἐπείραζον ⸀εἰς τὴν Βιθυνίαν ⸀πορευθῆναι καὶ οὐκ εἴασεν αὐτοὺς τὸ πνεῦμα ⸀Ἰησοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/007.yaml
  text: But when they came to Mysia[a], they were trying to go into Bithynia, and the Spirit of Jesus did not permit them.
translation:
  language: ig
  text: Ma mgbe ha rutere Mysia[a], ha nọ na-agbalị ịbanye na Bitinia, ma Mmụọ Jizọs ekweghị ka ha banye na Bitinia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n'akụkụ Mysia” ma ọ bụ “n'akụkụ ókèala Mysia.” Okwu Grik ahụ nwere ike ịpụta na ha rutere mpaghara dị n'akụkụ ókèala Mysia.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθόντες
  choice: mgbe ha rutere
  rationale: Aorist participle ahụ nwere ọrụ oge n'okwu a; nsụgharị a na-egosi usoro ihe ndị mere n'Igbo dị mfe ma doo anya.
- source_word: δὲ
  choice: Ma
  rationale: δέ na-egosi ntakịrị mgbanwe ma ọ bụ ọdịiche n'akụkọ ahụ; “Ma” na-egosipụta nke a n'ụzọ ebumpụta ụwa.
- source_word: κατὰ τὴν Μυσίαν
  choice: rutere Mysia[a]
  rationale: κατά tinyere accusative n'okwu gbasara ebe nwere ike ịpụta iru n'akụkụ, n'akụkụ ókè, ma ọ bụ n'ebe Mysia dị. Isi okwu dị mfe na footnote na-echekwa mgbagwoju anya ahụ.
- source_word: ἐπείραζον
  choice: ha nọ na-agbalị
  rationale: Imperfect ahụ na-egosi mgbalị na-aga n'ihu; “nọ na-agbalị” na-echekwa akụkụ a.
- source_word: εἰς τὴν Βιθυνίαν πορευθῆναι
  choice: ịbanye na Bitinia
  rationale: εἰς na-egosi ngagharị banye n'ime mpaghara ahụ, ebe πορευθῆναι na-egosi njem ha chọrọ ime.
- source_word: οὐκ εἴασεν αὐτοὺς
  choice: ekweghị ka ha gaa
  rationale: ἐάω pụtara ikwe ma ọ bụ inye ohere; nsụgharị a bụ Igbo nkịtị ma ọ naghị eme ka okwu ahụ sie ike karịa Grik.
- source_word: τὸ πνεῦμα Ἰησοῦ
  choice: Mmụọ Jizọs
  rationale: Nke a na-echekwa ahịrịokwu pụrụ iche nke Grik, “Mmụọ Jizọs,” kama ịgbanwe ya ka ọ bụrụ naanị “Mmụọ Nsọ.”
theological_decisions:
- issue: Nsụgharị τὸ πνεῦμα Ἰησοῦ nke metụtara Kraịst
  choice: Mmụọ Jizọs
  alternative: Mmụọ Nsọ; Mmụọ ahụ
  rationale: Grik kpọrọ Jizọs aha kpọmkwem. Idebe ya na-echekwa ọdịdị okwu ahụ na njikọ ya na Kraịst n'emeghị nkọwa ozizi ọzọ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A hapụrụ aha mpaghara dịka Mysia na Bitinia n'ụdị a na-amata ngwa ngwa; e chekwara okwu pụrụ iche “Mmụọ Jizọs.”
