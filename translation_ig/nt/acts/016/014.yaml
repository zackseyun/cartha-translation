    text: A pụkwara ịsụgharị ya, “onye na-asọpụrụ Chineke.” Nkebiokwu a nwere ike ịpụta onye mba ọzọ raara onwe ya nye ife Chineke Izrel.
    reason: lexical_alternative
  revision_rationale: The revision restores the Greek narrative connective καί with idiomatic “Ma” and adds punctuation to make the identifying apposition easier to read. All other wording is retained because it faithfully communicates the Greek and is natural Standard Igbo. The existing footnote anchor and explanatory note remain correctly attached to “onye na-efe Chineke.”
