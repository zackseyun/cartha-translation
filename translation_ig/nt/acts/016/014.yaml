id: ACT.16.14
reference: Acts 16:14
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καί τις γυνὴ ὀνόματι Λυδία, πορφυρόπωλις πόλεως Θυατείρων σεβομένη τὸν θεόν, ἤκουεν, ἧς ὁ κύριος διήνοιξεν τὴν καρδίαν προσέχειν τοῖς λαλουμένοις ὑπὸ ⸀τοῦ Παύλου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/014.yaml
  text: And a certain woman named Lydia[a], a seller of purple cloth from the city of Thyatira, who worshiped God, was listening; the Lord opened her heart to pay attention to what was being spoken by Paul.
translation:
  language: ig
  text: Ma, otu nwanyị, aha ya bụ Lidia, onye si n’obodo Tiatira na-ere akwa pọpụl, onye na-efe Chineke[a], nọ na-ege ntị. Onyenwe anyị meghere obi ya ka o tinye uche n’ihe Pọl na-ekwu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “onye na-asọpụrụ Chineke.” Nkebiokwu a nwere ike ịpụta onye mba ọzọ raara onwe ya nye ife Chineke Izrel.
    reason: lexical_alternative
lexical_decisions:
- source_word: καί τις γυνὴ
  choice: Otu nwanyị
  rationale: Nke a na-egosipụta na a na-akpọbata otu nwanyị n’akụkọ ahụ, ma na-ada ka Igbo dị ugbu a karịa nsụgharị siri ike nke ga-abụ ‘otu nwanyị ụfọdụ.’
- source_word: ὀνόματι Λυδία
  choice: aha ya bụ Lidia
  rationale: Nke a bụ ụzọ Igbo nkịtị si ekwu aha mmadụ n'ụzọ doro anya.
- source_word: πορφυρόπωλις
  choice: onye na-ere akwa pọpụl
  rationale: Okwu Grik a na-ezo aka n’onye na-azụ ma na-ere akwa ma ọ bụ ihe e ji ụcha pọpụl tee. ‘Akwa pọpụl’ doro onye na-agụ akwụkwọ ugbu a anya n’etinyeghị ụdị uwe a na-ekwughị n’amaokwu ahụ.
- source_word: πόλεως Θυατείρων
  choice: onye si n’obodo Tiatira
  rationale: Nke a na-egosipụta ebe Lidia si n’ụzọ Igbo na-asụkarị.
- source_word: σεβομένη τὸν θεόν
  choice: onye na-efe Chineke
  rationale: Nke a na-ebute echiche nke ịsọpụrụ na ife Chineke n’asụsụ Igbo dị mfe. Ihe odide ala peeji na-echekwa ohere na okwu ahụ nwere ike ịbụ nkọwa a na-eji akọwa onye mba ọzọ raara onwe ya nye Chineke Izrel.
- source_word: ἤκουεν
  choice: nọ na-ege ntị
  rationale: Ụdị a na-egosipụta omume na-aga n’ihu nke dị na ngwaa Grik imperfect.
- source_word: ὁ κύριος
  choice: Onyenwe anyị
  rationale: Nke a bụ okwu Igbo a na-ejikarị asụgharị κύριος n’ụzọ nsọpụrụ, na-akọwaghị kpọmkwem ma ọ bụ Chineke ka ọ bụ Jizọs ebe Grik n’onwe ya na-ekwu naanị ‘Onyenwe anyị.’
- source_word: διήνοιξεν τὴν καρδίαν
  choice: meghere obi ya
  rationale: E debere ihe atụ dị n’ime okwu Grik n’ihi na ọ bụkwa ụzọ Igbo doro anya si akọwa ime ka mmadụ nwee nghọta na nnabata.
- source_word: προσέχειν
  choice: ka o tinye uche
  rationale: Nke a na-egosi ilekwasị anya nke ọma n’ihe a na-ekwu, n’agbanweghị ya ka ọ bụrụ ‘ịza’ ma ọ bụ ‘ikwere,’ nke ga-akọwa karịa ihe okwu ahụ kwuru.
- source_word: τοῖς λαλουμένοις ὑπὸ τοῦ Παύλου
  choice: n’ihe ndị Pọl na-ekwu
  rationale: Nke a bụ Igbo dị ndụ nke na-echekwa ọdịnaya okwu ahụ, onye na-ekwu ya, na omume ahụ na-aga n’ihu, ọ bụ ezie na e jiri usoro active mee ka ọ bụrụ nke eke n’Igbo.
theological_decisions:
- issue: Onye ‘Onyenwe anyị’ na-ezo aka na ya n’okwu ὁ κύριος
  choice: E dere naanị ‘Onyenwe anyị.’
  alternative: ‘Onyenwe anyị Jizọs’ ma ọ bụ ‘Chineke’
  rationale: Ihe odide Grik akọwaghị onye ahụ karịa ὁ κύριος. Ya mere, nsụgharị ahụ echekwala ohere dị n’okwu ahụ kama ịgbakwunye Jizọs ma ọ bụ Chineke n’ebe ihe odide ahụ na-emeghị otú ahụ.
- issue: Ihe okwu σεβομένη τὸν θεόν pụtara n’ọnọdụ okpukpe Lidia
  choice: onye na-efe Chineke
  alternative: onye na-asọpụrụ Chineke; onye mba ọzọ raara onwe ya nye Chineke Izrel
  rationale: Isi ederede na-eji okwu onye ọ bụla ga-aghọta, ebe ihe odide ala peeji na-egosi na nkebiokwu ahụ nwekwara ike ịbụ nkọwa pụrụ iche maka onye mba ọzọ na-efe Chineke Izrel. Nke a ezere ime ka nkọwa pụrụ iche ahụ bụrụ ihe doro anya karịa Grik.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị mfe ma nwee ugwu, dee amaokwu ahụ. E jiri ‘pọpụl’ mee ihe iji zere mgbagwoju anya nke aha ụcha ndị ọzọ n’Igbo. E debere akara ihe odide ala peeji [a] ozugbo n’akụkụ nkebiokwu ọ na-akọwa.
