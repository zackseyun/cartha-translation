  to: Ma, otu nwanyị, aha ya bụ Lidia, onye si n’obodo Tiatira na-ere akwa pọpụl, onye na-efe Chineke[a], nọ na-ege ntị. Onyenwe anyị meghere obi ya ka o tinye uche n’ihe Pọl na-ekwu.
