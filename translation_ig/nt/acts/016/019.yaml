translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. Nhazi ahịrịokwu ahụ bụ nke nkịtị n’Igbo, ebe e chekwara ihe oyiyi nke olileanya ‘ịpụ’ na ọdịiche dị n’etiti okwu izugbe ἄρχοντες na aha ọrụ kapịrị ọnụ dị n’amaokwu na-esonụ.
