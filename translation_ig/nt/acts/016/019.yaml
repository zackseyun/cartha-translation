  text: Ἰδόντες δὲ οἱ κύριοι αὐτῆς ὅτι ἐξῆλθεν ἡ ἐλπὶς τῆς ἐργασίας αὐτῶν ἐπιλαβόμενοι τὸν Παῦλον καὶ τὸν Σιλᾶν εἵλκυσαν εἰς τὴν ἀγορὰν ἐπὶ τοὺς ἄρχοντας,
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/019.yaml
  text: But when her masters saw that their hope of profit had gone out[a], they seized Paul and Silas and dragged them into the marketplace before the rulers[b],
translation:
  language: ig
  text: Ma mgbe ndị nwe ya hụrụ na olileanya ha nwere inweta uru apụla[a], ha jidere Pọl na Saịlas, dọkpụrụ ha gaa n’ahịa ukwu n’ihu ndị ọchịchị[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “olileanya ha nwere irite ego.” N’okwu Grik, nkebiokwu a pụtara n’ụzọ nkịtị “olileanya nke uru ma ọ bụ ego ha na-enweta.”
    reason: lexical_alternative
  - marker: b
    text: Okwu a sụgharịrị “ndị ọchịchị” bụ okwu izugbe maka ndị isi obodo; amaokwu na-esonụ ji aha ọrụ ọzọ kapịrị ọnụ, nke a na-asụgharịkarị “ndị magistret obodo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ κύριοι αὐτῆς
  choice: ndị nwe ya
  rationale: N’ọnọdụ a, okwu ahụ na-ezo aka ná ndị nwere nwaanyị ahụ dị ka ohu ma na-achịkwa ya maka uru ego; “ndị nwe ya” na-eme ka ọnọdụ nke ịbụ ihe onwunwe na mmegbu akụ na ụba pụta ìhè.
- source_word: ἐξῆλθεν
  choice: apụla
  rationale: Nke a na-echekwa ihe oyiyi Grik nke ihe ‘ịpụ,’ ma n’Igbo ọ na-egosi na ụzọ ha si atụ anya uru akwụsịla kpamkpam.
- source_word: ἡ ἐλπὶς τῆς ἐργασίας αὐτῶν
  choice: olileanya ha nwere inweta uru
  rationale: “Olileanya” na-anọchite ἐλπίς, ebe “inweta uru” na-egosi na ἐργασία ebe a bụ ego ma ọ bụ uru ha na-enweta site n’ọrụ nwaanyị ahụ, ọ bụghị naanị ọrụ n’ozuzu.
- source_word: ἐπιλαβόμενοι
  choice: ha jidere
  rationale: “Jidere” na-egosi ijide mmadụ n’ike n’ọnọdụ iro, ma na-ada nke ọma n’Igbo nke oge a.
- source_word: εἵλκυσαν
  choice: dọkpụrụ
  rationale: Okwu a na-egosi ịdọ mmadụ n’ike, kwekọọkwa na omume mmegide ahụ.
- source_word: ἀγορὰν
  choice: ahịa ukwu
  rationale: ἀγορά bụ ebe ahịa na ebe ọha na eze na-ezukọ maka ihe metụtara ọchịchị; “ahịa ukwu” bụ okwu Igbo doro anya ma dị ndụ maka ebe dị otu a.
- source_word: ἐπὶ τοὺς ἄρχοντας
  choice: n’ihu ndị ọchịchị
  rationale: ἄρχοντες bụ okwu sara mbara maka ndị isi obodo ma ọ bụ ndị nwere ikike. “Ndị ọchịchị” na-echekwa izugbe ya, ghara ịkpọ ha aha ọrụ pụrụ iche nke amaokwu na-esonụ ji.
