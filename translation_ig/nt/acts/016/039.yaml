translation_notes:
  register: Standard Igbo; okwu dị ugwu ma dị mfe nghọta. E jiri aha Pọl na Saịlas dochie nnọchiaha mbụ iji gbochie mgbagwoju anya banyere ndị 'ha' dị iche iche. Akara nkọwa ala ala [a] na [b] dị n'isi ederede.
