revisions:
- from: Ha bịara rịọ Pọl na Saịlas arịrịọ[a]. Mgbe ha kpọpụtasịrị ha, ha nọ na-arịọ ha ka ha si n’obodo ahụ pụọ.[b]
  to: Ndị isi obodo ahụ bịara kpekuo Pọl na Saịlas[a]. Mgbe ha kpọpụtachara Pọl na Saịlas, ha nọ na-arịọ ha ka ha hapụ obodo ahụ.[b]
  rationale: The revision replaces an unidiomatic redundant phrase with “kpekuo,” which preserves the broad, conciliatory force of παρακαλέω without asserting that the officials apologized. It also clarifies referents in a verse containing several pronouns, retains the temporal sequence of ἐξαγαγόντες, and preserves the imperfect nuance of ἠρώτων.
