  text: καὶ ἐλθόντες παρεκάλεσαν αὐτούς, καὶ ἐξαγαγόντες ἠρώτων ⸂ἀπελθεῖν ἀπὸ⸃ τῆς πόλεως.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/039.yaml
  text: And they came and appealed to them[a], and after leading them out[b], they asked them to leave the city.
translation:
  language: ig
  text: Ndị isi obodo ahụ bịara kpekuo Pọl na Saịlas[a]. Mgbe ha kpọpụtachara Pọl na Saịlas, ha nọ na-arịọ ha ka ha hapụ obodo ahụ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “rịọ ha nke ukwuu” ma ọ bụ “gwa ha okwu n’ụzọ dị nro.” Okwu Grik a nwekwara ike ịpụta “kasie obi” n’ebe ndị ọzọ, ma n’ebe a o yikarịrị ka ọ na-ekwu maka ịrịọ ha n’ụzọ ime udo mgbe ndị isi obodo mesịrị Pọl na Saịlas ihe ọjọọ.
    reason: lexical_alternative
  - marker: b
    text: N’asụsụ Grik, ngwaa a sụgharịrị “ha nọ na-arịọ” dị n’ụdị nwere ike igosi na arịrịọ ahụ gara n’ihu ma ọ bụ na ha rịọrọ ugboro ugboro.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθόντες
  choice: Ha bịara
  rationale: Aorist participle a na-egosi ihe ndị isi obodo mere tupu ha arịọ ha; nkebi ahịrịokwu kwụụrụ onwe ya bụ ụzọ Igbo si ekwu ya nke ọma ma debe usoro ihe omume.
- source_word: παρεκάλεσαν
  choice: rịọ ... arịrịọ
  rationale: N'ebe a, παρακαλέω pụtara ịrịọ n'ụzọ dị nro iji mee ka iwe dajụọ mgbe e mesịrị Pọl na Saịlas ihe ọjọọ; ọ bụghị nkasi obi n'echiche nke nlekọta ime mmụọ.
- source_word: αὐτούς
  choice: Pọl na Saịlas
  rationale: Ịkpọ aha ndị nnọchiaha a na-ezo aka na ha na-eme ka Igbo doo anya, ebe ọtụtụ nnọchiaha 'ha' n'otu ahịrịokwu nwere ike ịkpata mgbagwoju anya.
- source_word: ἐξαγαγόντες
  choice: Mgbe ha kpọpụtasịrị ha
  rationale: Nke a na-egosi na ndị isi obodo kpọpụtara Pọl na Saịlas tupu arịrịọ ka ha pụọ n'obodo, ma na-edebe usoro nke aorist participle.
- source_word: ἠρώτων
  choice: ha nọ na-arịọ
  rationale: Imperfect Greek nwere ike igosi arịrịọ na-aga n'ihu ma ọ bụ a na-arịọ ugboro ugboro; usoro Igbo a na-egosipụta akụkụ ahụ n'ụzọ ebumpụta ụwa.
- source_word: ἀπελθεῖν ἀπὸ τῆς πόλεως
  choice: ka ha si n’obodo ahụ pụọ
  rationale: Nke a bụ ụzọ Igbo dị ugbu a na nke doro anya isi kwuo ihe arịrịọ ahụ bụ, ya bụ ka ha hapụ obodo ahụ.
