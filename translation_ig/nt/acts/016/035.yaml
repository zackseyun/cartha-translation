id: ACT.16.35
reference: Acts 16:35
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἡμέρας δὲ γενομένης ἀπέστειλαν οἱ στρατηγοὶ τοὺς ῥαβδούχους λέγοντες· Ἀπόλυσον τοὺς ἀνθρώπους ἐκείνους.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/035.yaml
  text: And when day came[a], the magistrates sent the rod-bearers, saying, “Release those men.”
translation:
  language: ig
  text: Ma mgbe chi bọrọ, ndị isi ọchịchị obodo ahụ zigara ndị na-ebu mkpara[a], na-asị, “Hapụ ndị ikom ahụ ka ha laa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịkpọ ha “ndị liktọ,” ya bụ, ndị ọrụ pụrụ iche na-eso ndị isi ọchịchị Rom ma na-ebu mkpara dịka akara ikike ha.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἡμέρας δὲ γενομένης
  choice: Ma mgbe chi bọrọ
  rationale: Nke a na-egosi mgbanwe oge site n’ahịrịokwu genitive absolute; “mgbe chi bọrọ” bụ Igbo doro anya ma dịkwa ndụ, ebe “Ma” na-echekwa njikọ δέ.
- source_word: ἀπέστειλαν
  choice: zigara
  rationale: 'Okwu a na-enye ihe ἀποστέλλω pụtara n’ụzọ dị mfe: iziga ndị ozi n’ebe onye ọzọ nọ.'
- source_word: στρατηγοὶ
  choice: ndị isi ọchịchị obodo ahụ
  rationale: N’ọnọdụ Filipaị, okwu a na-ezo aka n’ụmụọrụ ọchịchị obodo ndị Rom, ọ bụghị ndị ọchịagha agha; nhọrọ a doro onye Igbo nke oge a anya.
- source_word: ῥαβδούχους
  choice: ndị na-ebu mkpara[a]
  rationale: Nke a na-echekwa ihe okwu Grik ahụ kwuru kpọmkwem—ndị ọrụ ọchịchị na-ebu mkpara dịka akara ikike—ma nkọwa ala peeji na-enye aha ọrụ Rom ahụ.
- source_word: λέγοντες
  choice: na-asị
  rationale: Ọ na-echekwa njikọ participle ahụ ma webata ozi e nyere n’ụzọ Igbo na-aga were were.
- source_word: Ἀπόλυσον
  choice: Hapụ
  rationale: Imperative a bụ iwu a gwara otu onye ka ọ tọhapụ ndị mkpọrọ; “Hapụ ... ka ha laa” na-egosipụta ntọhapụ ahụ n’ụzọ eke n’Igbo.
- source_word: τοὺς ἀνθρώπους ἐκείνους
  choice: ndị ikom ahụ
  rationale: N’ebe a, okwu ahụ na-ezo kpọmkwem aka na Pọl na Saịlas, ndị bụ ụmụ nwoke abụọ.
theological_decisions: []
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, nke dị ugwu ma dị mfe nghọta. A họọrọ “ndị isi ọchịchị obodo” kama okwu nwere ike ime ka a ghọta ha dịka ndị ọchịagha, ma debe ihe oyiyi nkịtị nke ndị na-ebu mkpara.
