translation_notes:
  register: Asụsụ Igbo izugbe, dị ugbu a ma nwee ugwu. E ji “ndị na-ebu mkpara” chekwaa ihe oyiyi nke ῥαβδοῦχοι; e tinyeghị nkọwa ụkwụ pụrụ iche maka ya n'ihi na isi ederede n'onwe ya doro anya.
