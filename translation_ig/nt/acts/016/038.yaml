  text: ⸀ἀπήγγειλαν δὲ τοῖς στρατηγοῖς οἱ ῥαβδοῦχοι τὰ ῥήματα ταῦτα· ⸂ἐφοβήθησαν δὲ⸃ ἀκούσαντες ὅτι Ῥωμαῖοί εἰσιν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/038.yaml
  text: So the rod-bearers reported these words to the magistrates[a], and they were afraid when they heard that they were Romans[c][b],
translation:
  language: ig
  text: Ndị na-ebu mkpara[c] wee kọọrọ ndị isi ọchịchị obodo[a] okwu ndị a. Mgbe ndị isi ọchịchị obodo ahụ nụrụ na ha bụ ndị Rom[b], ụjọ tụrụ ha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ndị isi ọchịchị obodo” na-atụgharị στρατηγοί, ya bụ, ndị isi ọchịchị obodo Filipị.
    reason: cultural_note
  - marker: b
    text: Okwu Grik kwuru “ndị Rom.” N'ọnọdụ iwu a, ọ na-ezo aka n'ọnọdụ ha dị ka ụmụ amaala Rom, ndị nwere nchebe iwu pụrụ iche.
    reason: lexical_alternative
  - marker: c
    text: “Ndị na-ebu mkpara” bụ ndị na-ejere ndị isi ọchịchị obodo ozi; a na-akpọ ha lictors n'asụsụ Latịn.
    reason: cultural_note
lexical_decisions:
- source_word: ἀπήγγειλαν
  choice: kọọrọ
  rationale: Okwu a na-egosi izigara ndị isi ozi ma ọ bụ ịkọrọ ha ihe e kwuru; “kọọrọ” dabara n'ọnọdụ ọrụ ọchịchị a.
- source_word: στρατηγοῖς
  choice: ndị ọkaikpe obodo
  rationale: N'ógbè Filipị nke ndị Rom na-achị, okwu a na-ezo aka ná ndị isi ọchịchị obodo. Nhọrọ a doro onye Igbo nke oge a anya karịa iji aha ọrụ Rom pụrụ iche.
- source_word: ῥαβδοῦχοι
  choice: ndị na-ebu mkpara
  rationale: 'Nke a na-edobe ihe oyiyi nkịtị dị n''okwu Grik: ndị na-ejere ndị isi obodo ozi, bụ́ ndị ji mkpara dịka akara ikike ha.'
- source_word: τὰ ῥήματα ταῦτα
  choice: okwu ndị a
  rationale: Ntụgharị a na-edobe ụdị okwu Grik ma na-atụ aka n'ozi e kwuru n'amaokwu gara aga.
- source_word: ἐφοβήθησαν
  choice: ụjọ tụrụ ha
  rationale: Nke a bụ ụzọ Igbo dị mma ma bụrụkwa nke nkịtị isi kwuo na ha malitere ịtụ egwu n'ihi ihe ha nụrụ.
- source_word: ἀκούσαντες
  choice: Mgbe ha nụrụ
  rationale: Ọ na-egosi oge na ihe kpatara mmeghachi omume ha n'ụzọ Igbo doro anya.
- source_word: Ῥωμαῖοί
  choice: ndị Rom
  rationale: Grik kwuru kpọmkwem “ndị Rom.” N'ọnọdụ iwu a, ọ pụtara ndị nwere ọnọdụ ụmụ amaala Rom, ma isi ederede na-edobe okwu ahụ n'ụzọ sara mbara.
