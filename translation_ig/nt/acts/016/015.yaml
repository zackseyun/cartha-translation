review_pass:
  verdict: revise
  source_fidelity: The temporal clause, household sense of οἶκος, earnest invitation, and the Lord-title are substantially represented. However, “e mechara ... baptizim” means ‘after baptism was done to ...’ rather than the source’s ‘when ... were baptized,’ and the final wording adds the explicit result ‘until we agreed,’ which is not stated. The invitation also requires a clearer rendering of both ‘enter’ and ‘stay.’
  naturalness: Several expressions are understandable but not idiomatic Standard Igbo in this context. “batanụ n’ụlọ m nọrọ” lacks the necessary coordination/complement for the plural invitation. “Mgbe e mechara ... baptizim” is awkward and semantically shifted. The revision uses natural imperative coordination and a direct passive baptism expression.
  terminology: “Onyenwe anyị” appropriately renders κύριος. “ndị ezinụlọ ya” correctly distinguishes the household from the physical dwelling, rendered “ụlọ m.” “onye kwesịrị ntụkwasị obi n’ebe Onyenwe anyị nọ” retains the main sense of πιστή without forcing the alternative ‘believer’; the footnote preserves that lexical possibility.
  issues:
  - severity: medium
    issue: The baptism clause is inaccurately phrased.
    rationale: “Mgbe e mechara ya na ndị ezinụlọ ya baptizim” naturally suggests ‘after baptism had been performed for them,’ whereas ὡς ... ἐβαπτίσθη states that she and her household were baptized.
  - severity: high
    issue: The invitation clause is grammatically incomplete/unnatural.
    rationale: “batanụ n’ụlọ m nọrọ” does not clearly express the two actions εἰσελθόντες ... μένετε (‘come into my house and stay’).
  - severity: medium
    issue: The final clause overstates the source by adding ‘ruo mgbe anyị kwetara.’
    rationale: παρεβιάσατο ἡμᾶς says she strongly pressed/prevailed upon them; it does not explicitly state ‘until we agreed.’
  revised_text: Mgbe e mere ya na ndị ezinụlọ ya baptizim, ọ rịọrọ anyị nke ukwuu, sị, “Ọ bụrụ na unu ekpebiela na m bụ onye kwesịrị ntụkwasị obi n’ebe Onyenwe anyị nọ[a], batanụ n’ụlọ m, nọrọkwanụ.” O wee kwagide anyị.
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “na m bụ onye kwere na Onyenwe anyị.” Okwu Grik a nwekwara ike ịpụta “onye kwesịrị ntụkwasị obi,” “onye na-eguzosi ike,” ma ọ bụ “onye kwere ekwe.”
    reason: lexical_alternative
  revision_rationale: The revision corrects the passive temporal baptism clause, renders the paired invitation idiomatically as ‘come into my house, and stay,’ and removes the unstated result ‘until we agreed.’ It keeps the household/house distinction, the respectful register, and the lexical openness of πιστή through the footnote.
