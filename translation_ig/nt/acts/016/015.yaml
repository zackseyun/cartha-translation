revisions:
- from: Mgbe e mechara ya na ndị ezinụlọ ya baptizim, ọ rịọrọ anyị nke ukwuu, sị, “Ọ bụrụ na unu ekpebiela na m kwesịrị ntụkwasị obi nye Onyenwe anyị[a], batanụ n’ụlọ m nọrọ.” O wee rụgide anyị ruo mgbe anyị kwetara.
  to: Mgbe e mere ya na ndị ezinụlọ ya baptizim, ọ rịọrọ anyị nke ukwuu, sị, “Ọ bụrụ na unu ekpebiela na m bụ onye kwesịrị ntụkwasị obi n’ebe Onyenwe anyị nọ[a], batanụ n’ụlọ m, nọrọkwanụ.” O wee kwagide anyị.
  rationale: The revision corrects the passive temporal baptism clause, renders the paired invitation idiomatically as ‘come into my house, and stay,’ and removes the unstated result ‘until we agreed.’ It keeps the household/house distinction, the respectful register, and the lexical openness of πιστή through the footnote.
  reviewer_model: gpt-5.6-terra
