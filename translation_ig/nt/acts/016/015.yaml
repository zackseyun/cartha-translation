id: ACT.16.15
reference: Acts 16:15
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὡς δὲ ἐβαπτίσθη καὶ ὁ οἶκος αὐτῆς, παρεκάλεσεν λέγουσα· Εἰ κεκρίκατέ με πιστὴν τῷ κυρίῳ εἶναι, εἰσελθόντες εἰς τὸν οἶκόν μου ⸀μένετε· καὶ παρεβιάσατο ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/015.yaml
  text: And when she and her household were baptized[a], she urged us, saying, “If you have judged me to be faithful to the Lord, come into my house and stay.” And she prevailed upon us.
translation:
  language: ig
  text: Mgbe e mere ya na ndị ezinụlọ ya baptizim, ọ rịọrọ anyị nke ukwuu, sị, “Ọ bụrụ na unu ekpebiela na m bụ onye kwesịrị ntụkwasị obi n’ebe Onyenwe anyị nọ[a], batanụ n’ụlọ m, nọrọkwanụ.” O wee kwagide anyị.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “na m bụ onye kwere na Onyenwe anyị.” Okwu Grik a nwekwara ike ịpụta “onye kwesịrị ntụkwasị obi,” “onye na-eguzosi ike,” ma ọ bụ “onye kwere ekwe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ
  choice: Mgbe
  rationale: Nke a na-egosi oge na usoro ihe mere n’ụzọ Igbo si ada nke ọma, n’ebughị njikọ δέ ibu karịa ka o kwesịrị.
- source_word: ἐβαπτίσθη καὶ ὁ οἶκος αὐτῆς
  choice: e mechara ya na ndị ezinụlọ ya baptizim
  rationale: Ọ bụ ezie na ngwaa Grik dị n’otu, okwu so ya tinyere Lidia na ndị ezinụlọ ya n’ihe e mere. Usoro a na-egosi ha abụọ n’ụzọ doro anya ma ghara ikwu ndị mejupụtara ezinụlọ ahụ.
- source_word: ὁ οἶκος αὐτῆς
  choice: ndị ezinụlọ ya
  rationale: N’ebe a, οἶκος pụtara ndị bi n’otu ụlọ ma ọ bụ ezinụlọ, ọ bụghị ụlọ ahụ n’onwe ya.
- source_word: παρεκάλεσεν
  choice: ọ rịọrọ anyị nke ukwuu
  rationale: παρακαλέω n’ebe a bụ arịrịọ ma ọ bụ ọkpụkpọ òkù siri ike; mgbakwunye ‘nke ukwuu’ na-egosi ịdị uchu ya n’ụzọ Igbo dị mfe.
- source_word: Εἰ κεκρίκατέ με πιστὴν τῷ κυρίῳ εἶναι
  choice: Ọ bụrụ na unu ekpebiela na m kwesịrị ntụkwasị obi nye Onyenwe anyị
  rationale: ‘Ekpebiela’ na-egosipụta echiche perfect nke κεκρίκατε, ya bụ, mkpebi ha ruru ugbua. ‘Kwesịrị ntụkwasị obi’ na-edobe echiche ikwesị ntụkwasị obi na ntụkwasị obi dị na πιστή.
- source_word: πιστὴν
  choice: kwesịrị ntụkwasị obi
  rationale: Nhọrọ a na-edobe ohere okwu ahụ nwere ịpụta onye kwesịrị ntụkwasị obi, onye na-eguzosi ike, ma ọ bụ onye kwere ekwe; nkọwa ala peeji na-egosi ụzọ ọzọ.
- source_word: τῷ κυρίῳ
  choice: nye Onyenwe anyị
  rationale: 'Dative a na-egosi mmekọrịta: ikwesị ntụkwasị obi nye Onyenwe anyị.'
- source_word: εἰσελθόντες εἰς τὸν οἶκόν μου μένετε
  choice: batanụ n’ụlọ m nọrọ
  rationale: Participial construction ahụ na-arụ ọrụ dịka iwu ma ọ bụ òkù. N’ebe a οἶκος bụ ụlọ obibi n’onwe ya, ya mere ‘ụlọ m’ dabara.
- source_word: παρεβιάσατο ἡμᾶς
  choice: O wee rụgide anyị ruo mgbe anyị kwetara
  rationale: παραβιάζομαι na-egosi nrụgide siri ike nke mere ka ha kwenye, ma ọ naghị achọ ka a ghọta ya dịka mmanye ike.
theological_decisions:
- issue: Ihe ụfọdụ nwere ike isi n’okwu banyere baptizim ndị ezinụlọ ya pụta
  choice: A kọwara ihe akụkọ ahụ kwuru kpọmkwem, n’ekwughị afọ ma ọ bụ ọnọdụ okwukwe nke onye ọ bụla n’ezinụlọ ahụ.
  alternative: Ịsụgharị ya ka ọ kwado baptizim ụmụ ọhụrụ, ma ọ bụ ka ọ pụta na ọ bụ naanị ndị kwupụtara okwukwe ka e mere baptizim.
  rationale: Amaokwu ahụ ekwughị ndị mejupụtara ezinụlọ Lidia ma ọ bụ ọnọdụ okwukwe nke onye ọ bụla; ya mere ntụgharị ahụ anaghị edozi arụmụka okpukpe e mesịrị.
- issue: Ihe πιστὴν pụtara n’okwu Lidia
  choice: kwesịrị ntụkwasị obi nye Onyenwe anyị
  alternative: onye kwere na Onyenwe anyị
  rationale: Adjective Grik ahụ nwere ike igosi ma okwukwe ma ikwesị ntụkwasị obi. Isi ntụgharị na nkọwa ala peeji na-edobe ohere abụọ ahụ kama ịhọrọ otu n’enweghị ihe zuru ezu.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta, dee ya. E kewapụrụ ‘ndị ezinụlọ’ na ‘ụlọ’ iji gosipụta ọdịiche dị n’etiti mmadụ ndị mejupụtara οἶκος na ụlọ obibi. E debeghị echiche ụka pụrụ iche n’okwu baptizim ma ọ bụ n’ihe πιστή pụtara.
