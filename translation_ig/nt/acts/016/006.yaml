id: ACT.16.6
reference: Acts 16:6
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸀Διῆλθον δὲ τὴν Φρυγίαν ⸀καὶ Γαλατικὴν χώραν, κωλυθέντες ὑπὸ τοῦ ἁγίου πνεύματος λαλῆσαι τὸν λόγον ἐν τῇ Ἀσίᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/006.yaml
  text: And they passed through the region of Phrygia and Galatia[b][a], having been forbidden by the Holy Spirit to speak the word in Asia.
translation:
  language: ig
  text: Ha wee gafere n’ógbè Frijia na Galetia[b], ebe Mmụọ Nsọ gbochiri ha ikwu okwu ahụ n’Eshia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ya bụ, ógbè Rom a na-akpọ Eshia, nke dị n’ọdịda anyanwụ Eshia Maịnọ; ọ bụghị kọntinent Eshia nke oge a.
    reason: cultural_note
  - marker: b
    text: 'Ma eleghị anya: “ógbè Frijia na Galetia.” Usoro okwu Grik ahụ nwekwara ike ịpụta otu aha ógbè jikọtara Frijia na Galetia.'
    reason: alternative_reading
lexical_decisions:
- source_word: Διῆλθον
  choice: Ha wee gafee
  rationale: “Gafee” na-egosipụta njem site n’otu ógbè gafee, ebe “wee” na-ejikọ akụkọ ahụ n’ụzọ Igbo si aga nke ọma.
- source_word: δὲ
  choice: wee
  rationale: N’ebe a δέ bụ njikọ dị nro nke na-eme ka akụkọ gaa n’ihu; “wee” bụ ụzọ nkịtị e si eme nke a n’Igbo.
- source_word: τὴν Φρυγίαν καὶ Γαλατικὴν χώραν
  choice: n’ógbè Frijia na Galeshia
  rationale: “Ógbè” na-anọchi χώρα nke ọma. Nsụgharị a dị mfe nghọta, ebe ndetu [b] na-echekwa ohere na okwu Grik nwere ike ịpụta otu ógbè nwere njirimara abụọ.
- source_word: κωλυθέντες
  choice: ebe ... gbochiri ha
  rationale: A na-asụ nke a n’Igbo eke karịa ịtụgharị participle ahụ kpọmkwem; ọ na-echekwa echiche na e nyere ha mgbochi ime ihe ahụ.
- source_word: ὑπὸ τοῦ ἁγίου πνεύματος
  choice: Mmụọ Nsọ
  rationale: Nke a bụ aha Igbo a na-ejikarị eme ihe maka Mmụọ dị nsọ nke Chineke, ma usoro ahịrịokwu ahụ na-egosi na ọ bụ ya mere omume ahụ.
- source_word: λαλῆσαι
  choice: ikwu
  rationale: “Ikwu” na-anọgide nso na ihe λαλέω pụtara n’ozuzu ya, na-agbakwụnyeghị echiche pụrụ iche nke ikwusa ozi ọma.
- source_word: τὸν λόγον
  choice: okwu ahụ
  rationale: “Okwu ahụ” na-echekwa okwu Luk ji eme ihe ma na-ahapụ ihe gbara ya gburugburu ka ọ kọwaa na ọ bụ ozi Ndị Kraịst.
- source_word: ἐν τῇ Ἀσίᾳ
  choice: n’Eshia
  rationale: A na-echekwa aha ebe ahụ n’isiokwu, ebe ndetu [a] na-akọwa na ọ bụ ógbè Rom oge ochie, ọ bụghị kọntinent Eshia nke oge a.
theological_decisions:
- issue: Onye mere ka a ghara ikwu okwu ahụ, na ụdị onye Mmụọ ahụ bụ
  choice: Mmụọ Nsọ gbochiri ha
  alternative: mmụọ gbochiri ha
  rationale: τοῦ ἁγίου πνεύματος nwere article na adjective, usoro Luk ji arụtụ aka n’ebe Mmụọ Nsọ nọ. Usoro Igbo a na-echekwa ọrụ ya dịka onye mere omume ahụ n’etinyeghị nkọwa ozizi ọzọ.
translation_notes:
  register: Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. E jiri “ógbè” mee ka ọdịdị ala doo anya; a hapụrụ mgbagwoju anya dị n’usoro okwu Grik n’ime ndetu. E tinyere akara ndetu niile n’isiokwu, n’usoro [b] na [a] dịka ebe ha metụtara.
