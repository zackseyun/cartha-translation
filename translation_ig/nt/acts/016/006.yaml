  rationale: The revision corrects the Igbo past-tense verb, regularizes the rendering of Galatia, and clarifies the alternative syntactic reading. It retains the source's broad «speak the word» rather than narrowing it to preaching, preserves the Holy Spirit as the agent of the prohibition, and keeps the historically necessary Asia note.
