id: ACT.16.4
reference: Acts 16:4
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὡς δὲ διεπορεύοντο τὰς πόλεις, ⸀παρεδίδοσαν αὐτοῖς φυλάσσειν τὰ δόγματα τὰ κεκριμένα ὑπὸ τῶν ἀποστόλων ⸀καὶ πρεσβυτέρων τῶν ἐν ⸀Ἱεροσολύμοις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/004.yaml
  text: As they went through the cities[a], they delivered to them for observance the decrees that had been decided by the apostles and elders in Jerusalem.
translation:
  language: ig
  text: Ka ha na-agafe obodo dị iche iche, ha na-enyefe ha iwu ndị ahụ ndịozi na ndị okenye nọ na Jerusalem kpebirila, ka ha debe ha.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διεπορεύοντο
  choice: na-agafe obodo dị iche iche
  rationale: Ụdị imperfect na-egosi njem ha nọgidere na-eme site n’otu obodo gaa n’obodo ọzọ; okwu a bụ Igbo dị mfe ma na-edebe echiche ahụ.
- source_word: παρεδίδοσαν
  choice: na-enyefe
  rationale: Okwu a na-egosi inyefe ihe e nyere mmadụ n’aka ka o zie ndị ọzọ; ọ dabara n’inyefe mkpebi ndị nwere ikike.
- source_word: αὐτοῖς
  choice: ha
  rationale: E debeere nnọchiaha dị n’asụsụ Grik kama ịtinye ‘ndị kwere ekwe’ ma ọ bụ ‘ọgbakọ’ n’amaokwu ahụ.
- source_word: φυλάσσειν
  choice: ka ha debe ha
  rationale: ‘Idebe’ n’ebe a pụtara ịgbaso mkpebi ndị ahụ nke ọma, ọ bụghị naanị ichekwa ha dịka ihe.
- source_word: δόγματα
  choice: mkpebi ndị ahụ
  rationale: N’ọnọdụ a, okwu ahụ na-ezo aka ná mkpebi ndị ọchịchị ọgbakọ dị na Jerusalem mere. ‘Mkpebi’ bụ okwu Igbo doro anya nke na-ezere echiche banyere dogma nke oge e mesịrị.
- source_word: κεκριμένα
  choice: kpebiri
  rationale: Ọ na-egosi na e meela mkpebi ndị ahụ, ha ka nwekwara ike; nhazi ahịrịokwu Igbo na-eme ka onye mere mkpebi ahụ doo anya.
- source_word: ἀποστόλων καὶ πρεσβυτέρων
  choice: ndị ozi na ndị okenye
  rationale: Ndị a bụ aha Igbo ndị a na-ejikarị akọwa ndịozi na ndị ndu a kpọrọ ndị okenye n’Ọrụ Ndị Ozi.
- source_word: τῶν ἐν Ἱεροσολύμοις
  choice: nọ na Jerusalem
  rationale: Ọ na-egosi na ma ndị ozi ma ndị okenye ahụ nọ na Jerusalem, n’enweghị itinye nkọwa ọzọ.
- source_word: ὡς δὲ
  choice: Ka
  rationale: Ọ na-enye ntụgharị oge dị larịị ma jikọta ihe a na akụkọ na-aga n’ihu.
theological_decisions:
- issue: Ikike mkpebi ndị e mere na Jerusalem
  choice: mkpebi ndị ahụ
  alternative: iwu ndị ahụ
  rationale: ‘Mkpebi’ na-egosi ihe ndị ozi na ndị okenye kpebiri n’Ọrụ Ndị Ozi 15, ma ọ naghị ewebata echiche ụka nke oge e mesịrị. Ihe gbara amaokwu ahụ gburugburu ka na-egosi na mkpebi ndị a nwere ikike ma bụrụ ihe a ga-edebe.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E debere omume na-aga n’ihu site n’iji ‘na-agafe’ na ‘na-enyefe,’ ma e debeghị nkọwa òtù ụka pụrụ iche n’ime amaokwu ahụ.
