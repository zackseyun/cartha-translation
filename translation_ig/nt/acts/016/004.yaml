revisions:
- from: Ka ha na-agafe obodo dị iche iche, ha na-enyefe ha mkpebi ndị ahụ[a] ka ha debe ha—mkpebi ndị ozi na ndị okenye nọ na Jerusalem kpebiri.
  to: Ka ha na-agafe obodo dị iche iche, ha na-enyefe ha iwu ndị ahụ ndịozi na ndị okenye nọ na Jerusalem kpebirila, ka ha debe ha.
  rationale: The revision uses the established title “ndịozi,” represents δόγματα as authoritative rulings (“iwu”), and retains the completed prior decision in “kpebirila.” The relative clause avoids the draft’s repetitive apposition without adding doctrinal interpretation. The footnote marker remains anchored immediately after “iwu ndị ahụ.”
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T09:19:49Z'
review_pass:
  verdict: revise
  source_fidelity: The draft preserves the ongoing travel and transmission, the pronominal recipient, the purpose of observance, and the Jerusalem location. However, “ndị ozi” can be read as ordinary messengers rather than the established title for ἀπόστολοι, and the repeated “mkpebi ... mkpebi ... kpebiri” is needlessly heavy in Igbo.
  naturalness: The sentence is understandable, but its final apposition repeats the same noun and verb in a way that is less natural than a single relative construction. “Ndịozi” is the normal compact Standard Igbo biblical form.
  terminology: Use “iwu” for δόγματα here, conveying enacted rulings/decrees to be kept; the footnote retains “mkpebi” as a viable lexical alternative. Render ἀπόστολοι as “ndịozi,” while retaining “ndị okenye” for πρεσβύτεροι.
  issues:
  - severity: medium
    issue: “ndị ozi” is used for ἀποστόλων.
    rationale: Written separately, it may naturally mean “messengers.” “Ndịozi” is the conventional Standard Igbo rendering of the apostolic title and better preserves the source term’s established referent.
  - severity: low
    issue: The wording repeats “mkpebi” and “kpebiri” in close succession.
    rationale: The Greek does express both decrees and their prior determination, but Igbo can preserve that relationship more naturally by using “iwu” with a relative clause containing “kpebirila.”
  revised_text: Ka ha na-agafe obodo dị iche iche, ha na-enyefe ha iwu ndị ahụ ndịozi na ndị okenye nọ na Jerusalem kpebirila, ka ha debe ha.
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “mkpebi ndị ahụ.” Okwu Grik bụ dogmata; ọ na-ezo aka n’iwu e kpebiri na nzukọ dị na Jerusalem.
    reason: lexical_alternative
  revision_rationale: The revision uses the established title “ndịozi,” represents δόγματα as authoritative rulings (“iwu”), and retains the completed prior decision in “kpebirila.” The relative clause avoids the draft’s repetitive apposition without adding doctrinal interpretation. The footnote marker remains anchored immediately after “iwu ndị ahụ.”
