revisions:
- from: Ìgwè mmadụ ahụ sokwa bilie imegide ha[a]. Ndị ọkaikpe obodo ahụ dọkapụrụ uwe Pọl na Saịlas, nọkwa na-enye iwu ka e jiri mkpara tie ha[b].
  to: Ìgwè mmadụ ahụ sokwa bilie imegide ha[a]. Ndị ọchịchị obodo ahụ, mgbe ha dọkapụsịrị Pọl na Saịlas uwe ha, nọ na-enye iwu ka e jiri mkpara tie ha[b].
  rationale: Replaced the overly judicial designation “ndị ọkaikpe obodo” with “ndị ọchịchị obodo,” which more faithfully represents the Roman civic magistrates designated by στρατηγοί. The revised first clause of the second sentence also makes the prior stripping/tearing-off of Paul and Silas's clothing explicit while retaining the Greek sequence.
  reviewer_model: gpt-5.6-terra
