  text: καὶ συνεπέστη ὁ ὄχλος κατ’ αὐτῶν, καὶ οἱ στρατηγοὶ περιρήξαντες αὐτῶν τὰ ἱμάτια ἐκέλευον ῥαβδίζειν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/022.yaml
  text: And the crowd rose up together against them[a], and the magistrates, after tearing off their garments, were ordering them to be beaten with rods[b],
translation:
  language: ig
  text: Ìgwè mmadụ ahụ sokwa bilie imegide ha[a]. Ndị ọchịchị obodo ahụ, mgbe ha dọkapụsịrị Pọl na Saịlas uwe ha, nọ na-enye iwu ka e jiri mkpara tie ha[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “sonyere n'ịwakpo ha.” Ngwaa Grik ahụ na-emesi ike na ìgwè mmadụ ahụ jikọrọ aka n'omume iro a.
    reason: lexical_alternative
  - marker: b
    text: “Ndị ọchịchị obodo” bụ ndị ọchịchị Rom nke obodo Filipaị; n'okwu teknụzụ, a na-akpọ ha “praetors.”
    reason: cultural_note
lexical_decisions:
- source_word: συνεπέστη
  choice: sokwa bilie imegide
  rationale: Nke a na-egosipụta ma imekọ ọnụ nke ìgwè mmadụ ahụ ma omume iro ha, n'Igbo dị mfe ma dị ndụ.
- source_word: ὄχλος
  choice: ìgwè mmadụ
  rationale: Ọ bụ okwu Igbo a na-aghọta nke ọma maka ọtụtụ mmadụ gbakọrọ ọnụ; 'ìgwè ndị ọgbaaghara' ga-etinyekwu nkọwa karịa ihe okwu Grik ahụ n'onwe ya kwuru.
- source_word: κατ’ αὐτῶν
  choice: imegide ha
  rationale: Nke a na-egosipụta nke ọma echiche iro nke κατά na genitive n'ebe a.
- source_word: στρατηγοὶ
  choice: ndị ọkaikpe obodo
  rationale: N'ebe Filipaị nọ, okwu ahụ na-ezo aka n ndị ọchịchị obodo Rom. Nhọrọ a doro onye Igbo taa anya, ebe nkọwa ala peeji na-enye aha teknụzụ ya.
- source_word: περιρήξαντες
  choice: dọkapụrụ
  rationale: Okwu a na-egosipụta iji ike dọwa ma yipụ uwe ahụ tupu e nye iwu iti ha.
- source_word: αὐτῶν τὰ ἱμάτια
  choice: uwe Pọl na Saịlas
  rationale: Ikwughachi aha ndị a na-ewepụ mgbagwoju anya nke nnọchiaha αὐτῶν, ebe ọ bụ uwe ndị a ga-eti ka ndị ọchịchị dọkapụrụ, ọ bụghị uwe ndị ọchịchị ahụ.
- source_word: ἐκέλευον
  choice: nọkwa na-enye iwu
  rationale: Usoro a na-echekwa akụkụ imperfect nke ngwaa Grik ahụ, ya bụ iwu a nọ na-enye n'oge ihe omume ahụ na-aga n'ihu.
- source_word: ῥαβδίζειν
  choice: ka e jiri mkpara tie ha
  rationale: Nke a na-akọwa kpọmkwem ụdị ntaramahụhụ ahụ—iji mkpara tie mmadụ—na-enweghị ime ka a ghọta ya dị ka iti ụtarị.
