    text: A pụkwara ịsụgharị ya, “sonyere n'ịwakpo ha.” Ngwaa Grik ahụ na-emesi ike na ìgwè mmadụ ahụ jikọrọ aka n'omume iro a.
    reason: lexical_alternative
  - marker: b
    text: “Ndị ọchịchị obodo” bụ ndị ọchịchị Rom nke obodo Filipaị; n'okwu teknụzụ, a na-akpọ ha “praetors.”
    reason: cultural_note
  revision_rationale: Replaced the overly judicial designation “ndị ọkaikpe obodo” with “ndị ọchịchị obodo,” which more faithfully represents the Roman civic magistrates designated by στρατηγοί. The revised first clause of the second sentence also makes the prior stripping/tearing-off of Paul and Silas's clothing explicit while retaining the Greek sequence.
