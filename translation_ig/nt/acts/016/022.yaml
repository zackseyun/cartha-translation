translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu abụọ na-eme ka usoro ihe omume doo anya, a kọwakwara ndị nwe uwe ahụ aha iji gbochie mgbagwoju anya dị n'Igbo.
