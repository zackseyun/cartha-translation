review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the crowd's collective hostile action, the continuing force of the magistrates' command (imperfect ἐκέλευον), and beating with rods. However, στρατηγοί denotes Philippi's civic magistrates/officials, not specifically judicial officers; “ndị ọkaikpe obodo” can misleadingly identify them primarily as judges.
  naturalness: The wording is generally clear Standard Igbo. “Ndị ọchịchị obodo” is both more idiomatic and more accurate for the officials in view. The sequence expressed by “mgbe ha dọkapụsịrị ... uwe ha” naturally reflects the antecedent participle.
  terminology: “Ìgwè mmadụ,” “imegide ha,” and “mkpara” are suitable. “Ndị ọchịchị obodo” avoids narrowing στρατηγοί to courtroom judges. The note retains the technical Roman title without requiring it in the main text.
  issues:
  - severity: medium
    issue: “Ndị ọkaikpe obodo” narrows στρατηγοί.
    rationale: The στρατηγοί at Philippi were Roman colonial civic magistrates (often styled praetors), not merely judges. “Ndị ọchịchị obodo” preserves the broader administrative-magisterial sense.
  revised_text: Ìgwè mmadụ ahụ sokwa bilie imegide ha[a]. Ndị ọchịchị obodo ahụ, mgbe ha dọkapụsịrị Pọl na Saịlas uwe ha, nọ na-enye iwu ka e jiri mkpara tie ha[b].
  revised_footnotes:
