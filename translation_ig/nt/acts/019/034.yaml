  source_fidelity: 'The Igbo accurately represents the Greek sequence and sense: recognition of his Jewish identity, the unified response from the whole crowd, the approximate two-hour duration, and the acclamation to Artemis. “ha niile ji otu olu tie mkpu” idiomatically conveys φωνὴ ἐγένετο μία ἐκ πάντων while retaining the collective single-voice emphasis.'
