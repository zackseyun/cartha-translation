id: ACT.19.34
reference: Acts 19:34
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐπιγνόντες δὲ ὅτι Ἰουδαῖός ἐστιν φωνὴ ἐγένετο μία ἐκ πάντων ⸀ὡς ἐπὶ ὥρας δύο κραζόντων· Μεγάλη ἡ Ἄρτεμις Ἐφεσίων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/034.yaml
  text: But when they recognized that he was a Jew[a], one voice arose from them all, crying out for about two hours, “Great is Artemis of the Ephesians!”
translation:
  language: ig
  text: Ma mgbe ha matara na ọ bụ onye Juu[a], ha niile ji otu olu tie mkpu ruo ihe dị ka awa abụọ, sị, “Atemis nke ndị Efesọs dị ukwuu!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “onye Judia.” Okwu Grik ahụ pụrụ ịpụta ma onye Juu ma onye si Judia; n’ebe a, ihe o yikarịrị ka ọ pụtara bụ njirimara agbụrụ na okpukpe sara mbara.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιγνόντες
  choice: mgbe ha matara
  rationale: Na-egosi ihe ha chọpụtara tupu mkpu ahụ amalite; okwu a bụkwa Igbo nkịtị ma doo anya.
- source_word: δὲ
  choice: Ma
  rationale: Na-egosi mgbanwe nwere mmegide n’ihe na-aga n’ihu n’amaokwu ndị gbara ya gburugburu.
- source_word: Ἰουδαῖός
  choice: onye Juu
  rationale: N’ọnọdụ Efesọs a, ọ pụtara njirimara agbụrụ na okpukpe karịa naanị onye si Judia.
- source_word: φωνὴ ἐγένετο μία ἐκ πάντων
  choice: ha niile ji otu olu tie mkpu
  rationale: Nke a na-ebuga echiche nke ìgwè mmadụ niile jikọrọ ọnụ n’otu mkpu n’Igbo dị ndụ ma na-edebe ‘otu olu.’
- source_word: ὡς ἐπὶ ὥρας δύο
  choice: ruo ihe dị ka awa abụọ
  rationale: ‘Ihe dị ka’ na-echekwa echiche nke oge e mere atụmatụ, ọ bụghị awa abụọ kpọmkwem.
- source_word: κραζόντων
  choice: tie mkpu ... sị
  rationale: Na-egosi mkpu siri ike nke gara n’ihu; nhazi ahịrịokwu Igbo na-ejikọta ya n'ụzọ nkịtị na ogologo oge ahụ.
- source_word: Μεγάλη ἡ Ἄρτεμις Ἐφεσίων
  choice: Atemis nke ndị Efesọs dị ukwuu!
  rationale: Na-echekwa aha chi nwanyị ahụ, njikọ ya na ndị Efesọs, na ụdị nkwupụta otuto siri ike.
theological_decisions:
- issue: Ntụgharị Ἰουδαῖος
  choice: onye Juu
  alternative: onye Judia
  rationale: N’ebe a, mmeghachi omume ìgwè mmadụ ahụ metụtara njirimara Aleksanda dịka onye otu ndị Juu n’obodo mba ọzọ; ‘onye Juu’ dabara karịa ebe amụrụ ya, ma ndetu ala peeji na-echekwa nhọrọ ọzọ.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E jiri ‘ji otu olu tie mkpu’ mee ka akpaalaokwu Grik daa n’ụzọ nkịtị n’Igbo, ebe a ka na-echekwa ịdị n’otu nke olu ìgwè mmadụ ahụ.
