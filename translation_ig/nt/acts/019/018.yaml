  text: πολλοί τε τῶν πεπιστευκότων ἤρχοντο ἐξομολογούμενοι καὶ ἀναγγέλλοντες τὰς πράξεις αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/018.yaml
  text: And many of those who had believed were coming[a], confessing and disclosing their practices.
translation:
  language: ig
  text: Ọtụtụ n’ime ndị bu ụzọ kweere nọ na-abịa, na-ekwupụta ma na-ekpughe omume ha.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ọrụ ha” ma ọ bụ “ihe ndị ha mere.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοί
  choice: Ọtụtụ
  rationale: Nke a bụ ụzọ Igbo nkịtị na nke dị nkenke si egosi ọnụ ọgụgụ buru ibu.
- source_word: τε
  choice: -kwa
  rationale: Mgbakwunye “-kwa” jikọtara amaokwu a na akụkọ gara aga ma gosipụta obere ike njikọ nke τέ n’ụzọ Igbo sitere n’okike.
- source_word: τῶν πεπιστευκότων
  choice: n’ime ndị ahụ kweere
  rationale: Nke a na-egosi na ha eburu ụzọ kwere, ma okwukwe ahụ ka metụtara ọnọdụ ha ugbu a; ọ naghị eme ka okwu ahụ ghọọ aha otu okpukpe pụrụ iche.
- source_word: ἤρχοντο
  choice: na-abịa
  rationale: Ụdị a na-egosi omume gara n’ihu ma ọ bụ nke na-eme ugboro ugboro, kwekọrọ n’aspekt imperfect nke Grik, n’enweghị ikwubiga ugboro ole ọ mere ókè.
- source_word: ἐξομολογούμενοι
  choice: na-ekwupụta
  rationale: “Na-ekwupụta” na-enye echiche nkwupụta ma ọ bụ ikweta n’ihu ọha, ma ọ naghị akọwapụta ihe a na-ekwupụta karịa ka Grik mere.
- source_word: ἀναγγέλλοντες
  choice: na-ekpughe
  rationale: N’ọnọdụ a, okwu a na-egosi ime ka ihe e zoro ezo mara; “na-ekpughe” dị iche nke ọma na “na-ekwupụta” ma kwekọọ na gburugburu akụkọ ahụ.
- source_word: τὰς πράξεις αὐτῶν
  choice: omume ha
  rationale: “Omume” nwere ike ịpụta ihe mmadụ na-eme, ọrụ ya, ma ọ bụ omume ọ na-eme mgbe niile; ya mere, ọ na-echekwa obosara πρᾶξις ma dabara n’okwu gbasara anwansi gbara amaokwu a gburugburu.
theological_decisions:
- issue: Ma a ga-asụgharị πεπιστευκότων dị ka aha otu kwụsiri ike, ka ọ bụ dị ka ndị eburu ụzọ kwere.
  choice: ndị ahụ kweere
  alternative: ndị kwere ekwe
  rationale: Perfect participle ahụ na-atụ aka n’okwukwe malitere tupu oge a ma ka nwere mkpa. Nhọrọ a na-echekwa nke ahụ n’ebughị ụzọ tinye aha teknụzụ nke otu nzukọ.
- issue: Ma τὰς πράξεις αὐτῶν ọ̀ pụtara mmehie, omume anwansi, ka ọ bụ omume n’ozuzu ya.
  choice: omume ha
  alternative: ọrụ ha; ihe ndị ha mere; mmehie ha
  rationale: Gburugburụ amaokwu ahụ na-atụ aka n’omume anwansi, ma okwu Grik ahụ sara mbara karịa “mmehie.” “Omume ha” na-edebe njikọ ahụ n’enweghị imechi ihe okwu ahụ pụtara.
translation_notes:
  register: E ji Igbo ọkọlọtọ, nke dị ugbu a ma dị ùgwù, dee ya. Usoro “na-abịakwa, na-ekwupụta ma na-ekpughe” na-echekwa omume ndị na-aga n’ihu n’akụkọ ahụ, ebe “omume ha” na-ahapụ obosara na ntakịrị mgbagwoju anya nke okwu Grik.
