  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἐπιθέντος αὐτοῖς τοῦ ⸀Παύλου χεῖρας ἦλθε τὸ πνεῦμα τὸ ἅγιον ἐπ’ αὐτούς, ἐλάλουν τε γλώσσαις καὶ ἐπροφήτευον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/006.yaml
  text: And when Paul laid his hands on them[a], the Holy Spirit came upon them, and they began speaking in tongues and prophesying.
translation:
  language: ig
  text: Mgbe Pọl bikwasịrị ha aka, Mmụọ Nsọ bịakwasịrị ha; ha wee na-asụ n’ire[a] ma na-ebu amụma.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’asụsụ.” Okwu Grik ahụ nwere ike ịpụta “ire” ma ọ bụ “asụsụ”; ederede bụ isi na-edobe mgbagwoju anya ahụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιθέντος ... τοῦ Παύλου χεῖρας
  choice: Mgbe Pọl bikwasịrị ha aka
  rationale: A sụgharịrị genitive absolute nke a dị ka nkebiokwu oge, nke bụ ụzọ doro anya ma bụrụkwa Igbo ebumpụta ụwa; “bikwasịrị ha aka” na-edobe ihe okwu Grik ahụ pụtara.
- source_word: ἦλθε ... ἐπ’ αὐτούς
  choice: bịakwasịrị ha
  rationale: “Bịakwasịrị” na-egosipụta ma ọbịbịa ahụ ma ntụziaka dị na ἐπί, n’Igbo dị mfe ma kwụ ọtọ.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: Mmụọ Nsọ
  rationale: Nke a bụ aha Igbo ọkọlọtọ, nke doro anya ma dị ùgwù, maka Onye Mmụọ Nsọ.
- source_word: ἐλάλουν
  choice: ha wee na-asụ
  rationale: Nhazi “wee na-asụ” na-egosi na omume ahụ sochiri ihe mere tupu ya ma na-aga n’ihu, n’etinyeghị okwu “malite” nke na-adịghị n’ụdị okwu Grik ahụ kpọmkwem.
- source_word: γλώσσαις
  choice: n’ire dị iche iche
  rationale: “Ire” na-edobe ihe oyiyi na obosara ihe γλῶσσα nwere ike ịpụta, kama imechi ya naanị n’asụsụ mmadụ ndị a maara.
- source_word: ἐπροφήτευον
  choice: na-ebu amụma
  rationale: Nke a bụ ụzọ Igbo ọkọlọtọ si egosipụta ikwu okwu amụma; akara omume na-aga n’ihu kwekọrọ n’imperfect Grik.
- source_word: τε ... καί
  choice: ma
  rationale: “Ma” jikọtara omume abụọ ahụ n’ụzọ Igbo dị larịị ma na-egosi na ha abụọ mere.
theological_decisions:
- issue: Ụdị okwu γλώσσαις n’Ọrụ Ndị Ozi 19:6
  choice: n’ire dị iche iche
  alternative: n’asụsụ dị iche iche
  rationale: Okwu Grik ahụ nwere ike ịpụta “ire” ma ọ bụ “asụsụ.” Isiokwu a na-edobe ohere abụọ ahụ n’emeghị ka amaokwu a kpebie ma ọ bụ asụsụ mmadụ ndị a maara ka ọ bụ ụdị okwu ọzọ sitere n’ike Mmụọ Nsọ.
- issue: Ọbịbịa Mmụọ Nsọ bịakwasị ha
  choice: Mmụọ Nsọ bịakwasịrị ha
  alternative: Mmụọ Nsọ bịakwutere ha
  rationale: “Bịakwasịrị ha” na-edobe ἐπ’ αὐτούς ma na-akọ ihe mere n’etinyeghị nkọwa ụka pụrụ iche banyere usoro, sakrament, ma ọ bụ ihe kpatara ya.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Nhazi ahịrịokwu ahụ na-edobe usoro akụkọ Luk, ebe “wee na-asụ … ma na-ebu” na-egosipụta omume abụọ na-aga n’ihu n’enweghị ịgbakwunye nkọwa ozizi.
