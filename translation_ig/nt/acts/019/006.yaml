revisions:
- from: Mgbe Pọl bikwasịrị ha aka, Mmụọ Nsọ bịakwasịrị ha; ha wee na-asụ n’ire dị iche iche[a] ma na-ebu amụma.
  to: Mgbe Pọl bikwasịrị ha aka, Mmụọ Nsọ bịakwasịrị ha; ha wee na-asụ n’ire[a] ma na-ebu amụma.
  rationale: Removed the unsupported qualifier “dị iche iche” while retaining the conventional Igbo expression “na-asụ n’ire,” which preserves the Greek term’s ambiguity. Revised the footnote for accurate, natural Standard Igbo and to make explicit that the main text retains the ambiguity.
