    reason: alternative_reading
  - marker: b
    text: A pụkwara ịhazi ya, “Pọl kpebiri n’ime Mmụọ, mgbe ọ gafesịrị Masedonia na Akaịa, ịga Jerusalem.”
    reason: previous_rendering
  revision_rationale: The revised wording preserves the Greek’s order—through Macedonia and Achaia, then to Jerusalem—and replaces a phrase that could imply merely passing through the place with one expressing Paul’s having been there. The alternate syntactic rendering remains available in a footnote without making a theological judgment about “Mmụọ.”
