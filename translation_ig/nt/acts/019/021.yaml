id: ACT.19.21
reference: Acts 19:21
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ὡς δὲ ἐπληρώθη ταῦτα, ἔθετο ὁ Παῦλος ἐν τῷ πνεύματι διελθὼν τὴν Μακεδονίαν καὶ Ἀχαΐαν πορεύεσθαι εἰς ⸀Ἱεροσόλυμα, εἰπὼν ὅτι Μετὰ τὸ γενέσθαι με ἐκεῖ δεῖ με καὶ Ῥώμην ἰδεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/021.yaml
  text: After these things were completed[a], Paul resolved in the Spirit to go to Jerusalem after passing through Macedonia and Achaia, saying, “After I have been there[b], I must also see Rome.”
translation:
  language: ig
  text: Mgbe e mechara ihe ndị a, Pọl kpebiri n’ime Mmụọ[a] ịgafe Masedonia na Akaịa, mesịa gaa Jerusalem.[b] Ọ sịrị, “Mgbe m nọsịrị ebe ahụ, aghaghị m ịhụkwa Rom.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’ime mmụọ ya.” Okwu Grik ahụ pụrụ izo aka ma ná mkpebi sitere n’ime Pọl n’onwe ya ma ná nduzi Mmụọ Nsọ.
    reason: alternative_reading
  - marker: b
    text: A pụkwara ịhazi ya, “Pọl kpebiri n’ime Mmụọ, mgbe ọ gafesịrị Masedonia na Akaịa, ịga Jerusalem.”
    reason: previous_rendering
lexical_decisions:
- source_word: ἐπληρώθη
  choice: e mechara
  rationale: N’ebe a, okwu ahụ na-egosi na ihe ndị a na-ekwu banyere ha eruola ná njedebe, ọ bụghị na amụma mezuru.
- source_word: ἔθετο
  choice: kpebiri
  rationale: Ọ na-egosi mkpebi siri ike Pọl mere n’ime onwe ya, ma bụrụkwa okwu Igbo doro anya ma dị ndụ.
- source_word: ἐν τῷ πνεύματι
  choice: n’ime Mmụọ
  rationale: E ji mkpụrụedemede ukwu gosi na ọ pụrụ ịbụ Mmụọ Nsọ, dịka ihe ndị Luk na-emesi ike banyere nduzi Mmụọ; ma a hapụrụ ihe ọzọ okwu Grik ahụ pụrụ ịpụta n’ala ala peeji.
- source_word: διελθὼν τὴν Μακεδονίαν καὶ Ἀχαΐαν
  choice: na ya ga-esi na Masedonia na Akaịa gafee
  rationale: N’ọnọdụ a, nkebi a na-akọ ụzọ Pọl zubere isi tupu ọ gaa Jerusalem; nsụgharị a na-eme ka usoro njem ahụ doo anya n’Igbo.
- source_word: πορεύεσθαι εἰς Ἱεροσόλυμα
  choice: gaa Jerusalem
  rationale: Nke a bụ ụzọ Igbo dị mfe ma kwekọọ n’okwu Grik nke pụtara ịga ebe ahụ.
- source_word: Μετὰ τὸ γενέσθαι με ἐκεῖ
  choice: Mgbe m gachara ebe ahụ
  rationale: Ọ na-egosi na Pọl ga-ebu ụzọ ruo ma nọrọ ebe ahụ tupu nzọụkwụ ọzọ; okwu a na-ada nke ọma n’Igbo.
- source_word: δεῖ με
  choice: aghaghị m
  rationale: Ọ na-echekwa ike nke mkpa ma ọ bụ iwu dị n’okwu δεῖ, nke na-enwekarị echiche nke nzube Chineke n’akwụkwọ Luk na Ọrụ Ndị Ozi.
- source_word: Ῥώμην ἰδεῖν
  choice: ịhụkwa Rom
  rationale: A họọrọ ‘ịhụ’ iji debe okwu Grik kpọmkwem, n’agbanyeghị na n’ọnọdụ njem ọ pụkwara ịpụta ileta.
theological_decisions:
- issue: Ihe ἐν τῷ πνεύματι na-ezo aka na ya
  choice: n’ime Mmụọ
  alternative: n’ime mmụọ ya
  rationale: Okwu Grik ahụ enweghị okwu na-egosi kpọmkwem na ọ bụ mmụọ Pọl, ya mere ọ pụrụ izo aka na mkpebi dị n’ime Pọl ma ọ bụ na nduzi Mmụọ Nsọ. Isi nsụgharị họọrọ Mmụọ Nsọ, ma ala ala peeji chekwara mgbagwoju anya ahụ n’enweghị idozi ya n’ụzọ nkwenkwe otu ụka.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E debere aha ebe dịka Masedonia, Akaịa, Jerusalem, na Rom. A haziri usoro njem ahụ n’ụzọ na-ada nke ọma n’Igbo, ebe ala ala peeji na-echekwa nhazi ọzọ nke ahịrịokwu Grik.
