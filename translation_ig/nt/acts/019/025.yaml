review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the sequential participle, the assembly of the relevant workers, the male address, the hearers' prior knowledge, and the claim that their wealth/prosperity derives from this commercial activity. ‘Ọrụ azụmahịa’ is understandable, but ‘azụmahịa’ more directly and naturally represents ἐργασία in this context without the slightly redundant phrasing.
  naturalness: The wording is generally fluent Standard Igbo. ‘Mgbe ọ kpọkọtara ha na ndị ọrụ na-arụ ụdị ihe ndị ahụ’ is clear; adding ‘ndị’ before the relative clause improves parsing of ‘workers engaged in such things.’ ‘Akụnụba anyị si n’azụmahịa a abịa’ is idiomatic and compact.
  terminology: ‘Ndị nwoke’ appropriately preserves the explicitly male vocative Ἄνδρες. ‘Ụdị ihe ndị ahụ’ suitably retains the Greek’s nonspecific reference. The existing footnote’s ‘ọrụ aka’ is narrower than the lexical alternative supported by the audit trail; a trade/business alternative is preferable.
  issues:
  - severity: low
    issue: The footnote gives ‘ọrụ aka’ as the alternative for ἐργασία.
    rationale: Although artisanal work is the narrative context, ἐργασία itself is broader—work, trade, or business. The English audit trail specifically identifies ‘trade’ as the alternative. Revising the note avoids unnecessarily narrowing the lexical range.
  - severity: low
    issue: ‘ọrụ azụmahịa’ is mildly redundant.
    rationale: ‘Azụmahịa’ alone naturally expresses the commercial enterprise meant here and preserves the sense without adding ‘ọrụ.’
  revised_text: Mgbe ọ kpọkọtara ha na ndị ọrụ ndị na-arụ ụdị ihe ndị ahụ, ọ sịrị, “Ndị nwoke, unu maara na akụnụba anyị si n’azụmahịa a abịa.[a]”
