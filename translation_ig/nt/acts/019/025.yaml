  yaml_path: translation/nt/acts/019/025.yaml
  text: After gathering them together[a], along with the workmen occupied with such things, he said, “Men, you know that from this business we have our prosperity.
translation:
  language: ig
  text: Mgbe ọ kpọkọtara ha na ndị ọrụ ndị na-arụ ụdị ihe ndị ahụ, ọ sịrị, “Ndị nwoke, unu maara na akụnụba anyị si n’azụmahịa a abịa.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Ọ bụ n’azụmahịa a ka anyị si enweta akụnụba anyị.”
    reason: lexical_alternative
lexical_decisions:
- source_word: συναθροίσας
  choice: Mgbe ọ kpọkọtara
  rationale: Aorist participle a na-egosi ihe mere tupu ngwaa bụ isi; nkebiokwu a na-asụ Igbo nke ọma ma na-edobe echiche nke ịkpọkọta ndị mmadụ.
- source_word: τοὺς περὶ τὰ τοιαῦτα ἐργάτας
  choice: ndị ọrụ na-arụ ụdị ihe ndị ahụ
  rationale: Nke a na-edobe okwu Grik sara mbara maka ndị ọrụ na ihe ndị yiri nke a, n’etinyeghị nkọwa pụrụ iche karịrị ihe ederede kwuru.
- source_word: Ἄνδρες
  choice: Ndị nwoke
  rationale: Okwu a bụ ịkpọku ndị nwoke nọ n’ebe ahụ kpọmkwem; ‘Ndị nwoke’ na-egosipụta nke ahụ n’Igbo doro anya.
- source_word: ἐπίστασθε
  choice: unu maara
  rationale: Ngwaa ahụ na-ekwu maka ihe ha maralarị; nke a bụ ụzọ Igbo kacha mfe ma kpọmkwem isi kwuo ya.
- source_word: ἐκ ταύτης τῆς ἐργασίας
  choice: si n’ọrụ azụmahịa a
  rationale: N’ọnọdụ a, ἐργασία bụ ọrụ a na-azụ ahịa ma na-erite uru na ya; ‘ọrụ azụmahịa’ na-eme ka ọnọdụ ahụ doo anya n’enweghị imechi ohere pụtara ‘ọrụ aka.’
- source_word: ἡ εὐπορία ἡμῖν ἐστιν
  choice: akụnụba anyị ... abịa
  rationale: εὐπορία na-egosi akụnụba ma ọ bụ ịdị mma n’ihe gbasara ego; usoro a bụ Igbo ebumpụta ụwa ma na-edobe echiche na ebe akụnụba ha si apụta.
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A hapụrụ ‘ụdị ihe ndị ahụ’ ka ọ dị sara mbara dịka okwu Grik, kama ịkọwapụta ya naanị dị ka ịkpụ ụlọ arụsị. E tinyere akara ala ala [a] n’ebe nkọwa ọzọ banyere ἐργασία na εὐπορία metụtara.
