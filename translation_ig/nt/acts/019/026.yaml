id: ACT.19.26
reference: Acts 19:26
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ θεωρεῖτε καὶ ἀκούετε ὅτι οὐ μόνον Ἐφέσου ἀλλὰ σχεδὸν πάσης τῆς Ἀσίας ὁ Παῦλος οὗτος πείσας μετέστησεν ἱκανὸν ὄχλον, λέγων ὅτι οὐκ εἰσὶν θεοὶ οἱ διὰ χειρῶν γινόμενοι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/026.yaml
  text: And you see and hear that not only in Ephesus but in almost all of Asia[a], this Paul has persuaded and turned away a considerable crowd[b], saying that gods made by hands are not gods.
translation:
  language: ig
  text: Unu na-ahụ ma na-anụ na ọ bụghị naanị n’Efesọ kamakwa n’ihe fọrọ nke nta ka ọ bụrụ Eshịa[a] dum, Pọl onye a emewo ka ìgwè mmadụ buru ibu kwenye ma tụgharịa, mgbe ọ na-ekwu na chi ndị e ji aka mee[b] abụghị chi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Eshịa n’ebe a bụ ógbè Rom a na-akpọ Eshịa, ọ bụghị kọntinent Eshịa dum.
    reason: geographical_note
  - marker: b
    text: N’ụzọ nkịtị, “ndị e ji aka mee”; nke a na-ekwu maka chi ma ọ bụ arụsị ndị mmadụ ji nkà aka rụọ.
    reason: cultural_note
lexical_decisions:
- source_word: θεωρεῖτε καὶ ἀκούετε
  choice: Unu na-ahụkwa, na-anụkwa
  rationale: Na-edobe arịrịọ abụọ ahụ Demetriọs ji kpọkuo ihe ndị na-ege ya ntị na-ahụ ma na-anụ n’oge ahụ, n’ụzọ Igbo doro anya.
- source_word: οὐ μόνον Ἐφέσου ἀλλὰ σχεδὸν πάσης τῆς Ἀσίας
  choice: ọ bụghị naanị n’Efesọ, kama n’ihe fọrọ nke nta ka ọ bụrụ Eshịa dum
  rationale: A tụgharịrị genitive ahụ dị ka ebe ihe a na-eme, ebe σχεδόν ghọrọ akpaokwu Igbo nkịtị, ‘n’ihe fọrọ nke nta ka ọ bụrụ.’
- source_word: ὁ Παῦλος οὗτος
  choice: Pọl onye a
  rationale: Na-echekwa nrụtụ aka οὗτος na ụda nlelị dị nro dị n’okwu Demetriọs, n’etinyeghị mkparị ọzọ.
- source_word: πείσας μετέστησεν
  choice: mere ka ... kwenye ma tụgharịa
  rationale: Na-egosi ma ime ka ndị mmadụ kwenye ma ime ka ha si n’ọnọdụ ha nọ tụgharịa, na-akọwaghị kpọmkwem ihe ha tụgharịrị hapụ karịa ka Grik kwuru.
- source_word: ἱκανὸν ὄχλον
  choice: ìgwè mmadụ buru ibu
  rationale: ἱκανός n’ebe a na-egosi ọnụ ọgụgụ dị ukwuu ma dị mkpa; akpaokwu a bụ Igbo dị mfe ma kwekọọ na ya.
- source_word: οὐκ εἰσὶν θεοὶ
  choice: abụghị chi
  rationale: Na-edobe nkwupụta doro anya nke na-agọnahụ na ihe ndị ahụ bụ chi, n’agbakwụnyeghị okwu dịka ‘n’ezie.’
- source_word: οἱ διὰ χειρῶν γινόμενοι
  choice: ihe ndị e ji aka mmadụ mee
  rationale: Na-eme ka akpaokwu Grik ahụ doo anya n’Igbo dịka ihe mmadụ rụrụ, ma na-echekwa njikọ ya na arụsị ndị a na-arụ n’aka.
theological_decisions:
- issue: Otu e si kwuo nkwupụta Pọl megide arụsị n’etinyeghị nkọwa nkà mmụta okpukpe ọzọ
  choice: ihe ndị e ji aka mmadụ mee abụghị chi
  alternative: chi ndị e ji aka mmadụ mee abụghị chi
  rationale: Nhọrọ ahụ na-agbaso usoro Grik, nke na-ekwu na ihe ndị e ji aka mee abụghị chi. Ọ na-echekwa ike nkwupụta ahụ ma zere itinye okwu dịka ‘abụghị chi n’ezie.’
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke dị ùgwù ma dị mfe nghọta. E debere ụda okwu Demetriọs na nrụtụ aka ‘Pọl onye a,’ ma zere okwu okpukpe pụrụ iche nke òtù ọ bụla.
