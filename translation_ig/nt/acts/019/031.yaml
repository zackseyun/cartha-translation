base_translation:
  language: en
  yaml_path: translation/nt/acts/019/031.yaml
  text: And even some of the Asiarchs[a], being his friends[c][b], sent word to him and urged him not to venture into the theater.
translation:
  language: ig
  text: Ọzọkwa, ọbụna ụfọdụ n’ime ndị isi Eshia[a], bụ́ ndị enyi ya, zigara ya ozi, rịọsie ya ike ka ọ ghara ịbanye n'ụlọ ihe nkiri ahụ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ndị isi Eshia” bụ aha e ji mara ụfọdụ ndị a ma ama n’ógbè Rom a na-akpọ Eshia.
    reason: cultural_note
  - marker: b
    text: 'N''ụzọ nkịtị: “ka ọ ghara inye onwe ya n''ụlọ ihe nkiri ahụ”; a pụkwara ịsụgharị ya, “ka ọ ghara igosi onwe ya n''ụlọ ihe nkiri ahụ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: τινὲς δὲ καὶ
  choice: Ọzọkwa, ọbụna ụfọdụ
  rationale: “Ụfọdụ” na-edobe na ọ bụ naanị akụkụ ndị ahụ a na-akọwaghị kpọmkwem; “ọzọkwa” na-egosi njikọ akụkọ nke δέ, ebe “ọbụna” na-egosipụta nkwusikwu okwu dị na καί.
- source_word: τῶν Ἀσιαρχῶν
  choice: ndị isi Eshia
  rationale: Nke a na-enye aha ọkwá ahụ n’Igbo n’ụzọ ndị na-agụ akwụkwọ ga-aghọta, ebe nkọwa ala ala peeji na-egosi na Eshia a bụ ógbè Rom nakwa na okwu Grik bụ aha pụrụ iche e ji mara ndị isi a ma ama.
- source_word: ὄντες αὐτῷ φίλοι
  choice: bụ́ ndị enyi ya
  rationale: Nke a na-edobe nkọwa ndabere nke participle ahụ na mmekọrịta φίλοι n’ụzọ dị nkenke ma dịkwa eke n’Igbo.
- source_word: πέμψαντες πρὸς αὐτὸν
  choice: zigara ya ozi
  rationale: Ihe e zigara adịghị n’ahịrịokwu Grik, ma ihe okwu a pụtara n’ebe a bụ na ha mere ka ozi ruo ya; ịsị “zigara ya ozi” bụ Igbo eke nke na-eme ka ihe e zoro ezo doo anya n’enweghị ịgbanwe ihe omume ahụ.
- source_word: παρεκάλουν
  choice: rịọsie ya ike
  rationale: Imperfect ahụ na-egosi arịrịọ siri ike ma ọ bụ nke a nọgidere na-eme; “rịọsie ya ike” na-egosipụta ike nke παρακαλέω n’ọnọdụ a.
- source_word: μὴ δοῦναι ἑαυτὸν εἰς τὸ θέατρον
  choice: ka ọ ghara ịbanye n'ụlọ ihe nkiri ahụ
  rationale: N’ọnọdụ akụkọ a, akpaalaokwu ahụ pụtara ka Pọl ghara itinye onwe ya n’etiti ìgwè mmadụ nọ n’ebe ihe nkiri ahụ. Nsụgharị a bụ nke eke n’Igbo ma na-edobe ebumnuche mmegharị εἰς.
theological_decisions: []
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. “Ụlọ ihe nkiri” ebe a na-ezo aka n’ebe ọha na-ezukọ ma na-ekiri ihe nkiri n’obodo oge ochie, ọ bụghị kpọmkwem sinima nke oge a. E debere aha Pọl n’ụdị nnọchiaha “ya,” dịka ederede Grik si mee.
