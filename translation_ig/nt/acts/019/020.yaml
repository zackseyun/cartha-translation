    issue: Attachment of “jiri ike”
    rationale: In “si jiri ike na-eto ma na-emeri,” “jiri ike” most readily attaches to “na-eto” and may suggest instrumental or intentional use of strength. The Greek κατὰ κράτος qualifies the whole assertion of growing and prevailing.
  - severity: low
    issue: Footnote wording
    rationale: The existing note is understandable but can be expressed more idiomatically while retaining the lexical alternative and its purpose.
