  text: οὕτως κατὰ κράτος ⸂τοῦ κυρίου ὁ λόγος⸃ ηὔξανεν καὶ ἴσχυεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/020.yaml
  text: So the word of the Lord was growing mightily and prevailing[a].
translation:
  language: ig
  text: Otu a ka okwu Onyenwe anyị si na-eto ma na-emeri n’ike[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “na-eto n’ụzọ dị ike ma na-emeri.” Akpaalaokwu Grik κατὰ κράτος nwere ike ịkọwa omume ahụ dịka “n’ike” ma ọ bụ “n’ụzọ dị ike.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως
  choice: Otu a ka ... si
  rationale: Ọ na-egosi ihe si n’ihe ndị mere tupu nke a pụta; usoro a bụ Igbo e ji ekwu ihe n'ụzọ ebumpụta ụwa.
- source_word: κατὰ κράτος
  choice: jiri ike
  rationale: Akpaalaokwu a na-egosi ike na mmetụta dị ukwuu. ‘Jiri ike’ na-edobe echiche nke κράτος ma na-agụkwa nke ọma n'Igbo.
- source_word: τοῦ κυρίου
  choice: Onyenwe anyị
  rationale: A hapụrụ aha nsọpụrụ ahụ dịka ọ dị na Grik, n'agbanyeghị na ọnọdụ okwu ahụ na-egosi na ọ bụ Onyenwe anyị Jizọs ka a na-ekwu maka ya.
- source_word: ὁ λόγος
  choice: okwu
  rationale: N'ebe a, λόγος bụ ozi a na-ekwusa; ‘okwu’ na-edobe usoro okwu Luk ji eme ihe ugboro ugboro n'Ọrụ Ndị Ozi.
- source_word: ηὔξανεν
  choice: na-eto
  rationale: Ụdị imperfect na-egosi uto na-aga n'ihu; ‘na-eto’ na-egosipụta nke a n'ụzọ doro anya.
- source_word: ἴσχυεν
  choice: na-emeri
  rationale: N'ọnọdụ a, okwu ahụ na-egosi na ozi ahụ na-enwe ike ma na-aga n'ihu n'agbanyeghị ihe na-egbochi ya; ‘na-emeri’ na-egosipụta mmetụta a.
theological_decisions:
- issue: Onye ‘Onyenwe anyị’ na-ezo aka na ya na τοῦ κυρίου
  choice: Onyenwe anyị
  alternative: Onyenwe anyị Jizọs
  rationale: Ọnọdụ akwụkwọ Ọrụ Ndị Ozi na-egosi na o yikarịrị ka ọ bụ Jizọs ka a na-ekwu maka ya, ma Grik kwuru naanị ‘Onyenwe anyị.’ Ya mere, nsụgharị ahụ agbakwụnyeghị aha na-adịghị n'ahịrịokwu ahụ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị nsọpụrụ ma dị mfe nghọta. Ahịrịokwu ahụ na-edobe uto na mmeri dịka omume abụọ na-aga n'ihu.
