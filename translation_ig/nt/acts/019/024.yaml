id: ACT.19.24
reference: Acts 19:24
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Δημήτριος γάρ τις ὀνόματι, ἀργυροκόπος, ποιῶν ναοὺς ἀργυροῦς Ἀρτέμιδος παρείχετο τοῖς τεχνίταις ⸂οὐκ ὀλίγην ἐργασίαν⸃,
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/024.yaml
  text: For a certain man named Demetrius[a], a silversmith who made silver shrines of Artemis[b], was providing the craftsmen with no small business.
translation:
  language: ig
  text: N’ihi na otu nwoke aha ya bụ Demetriọs, onye na-arụ ọrụ ọlaọcha, nke na-akpụ ụlọ arụsị ọlaọcha nke Atemis[a], na-enye ndị omenkà ahụ azụmahịa na-adịghị nta[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ụlọ nsọ ọlaọcha nke Atemis” ma ọ bụ “obere ihe oyiyi nke ụlọ nsọ Atemis.” Okwu Grik bụ naous (“ụlọ nsọ” ma ọ bụ “ebe nsọ”), ma eleghị anya ọ na-ezo aka n’obere ihe a kpụrụ akpụ e ji efe Atemis.
    reason: lexical_alternative
  - marker: b
    text: N’asụsụ Grik, “azụmahịa na-adịghị nta.” Nke a bụ ụzọ e si ekwu na azụmahịa ahụ buru ibu ma ọ bụ na ọ na-eweta nnukwu uru.
    reason: lexical_alternative
lexical_decisions:
- source_word: γάρ
  choice: N’ihi na
  rationale: Ọ na-egosi na amaokwu a na-akọwa ihe kpatara ọgba aghara ahụ e kwuru okwu ya tupu nke a.
- source_word: Δημήτριος
  choice: Demetriọs
  rationale: A sụgharịghị aha onye ahụ; e dere ya n’ụzọ dabara n’usoro mkpọpụta na odide Igbo.
- source_word: ἀργυροκόπος
  choice: onye na-eji ọlaọcha akpụ ihe
  rationale: Nke a na-egosi onye ọrụ aka nke ọrụ ya bụ iji ọlaọcha emepụta ihe, n’asụsụ Igbo doro anya.
- source_word: ναοὺς ἀργυροῦς Ἀρτέμιδος
  choice: obere ụlọ arụsị ọlaọcha nke Atemis
  rationale: ναός pụtara ụlọ nsọ ma ọ bụ ebe nsọ; n’ebe a, ihe a na-ekwu nwere ike ịbụ obere ihe ndị e ji ọlaọcha mee maka ofufe Atemis. Mgbakwunye ‘obere’ na-eme ka ọnọdụ ahịa a doo anya, ebe nkọwa ala peeji na-edobe ụzọ nghọta ndị ọzọ.
- source_word: Ἀρτέμιδος
  choice: Atemis
  rationale: E dere aha chi nwanyị Grik ahụ dịka aha Grik, kama iji aha Rom bụ Daiana dochie ya.
- source_word: παρείχετο
  choice: na-ewetara
  rationale: Ụdị ngwaa imperfect na-egosi ihe Demetriọs na-eme mgbe niile ma ọ bụ na-aga n’ihu ime.
- source_word: τοῖς τεχνίταις
  choice: ndị ọrụ aka
  rationale: Ọ na-ezo aka n’ebe ndị nwere nka n’ọrụ imepụta ihe nọ; okwu a bụ nke nkịtị ma doo ndị na-agụ Igbo anya.
- source_word: οὐκ ὀλίγην ἐργασίαν
  choice: ahịa na-adịghị nta
  rationale: Nke a na-edobe okwu nleda anya nke Grik (‘ọ bụghị obere’) ma na-egosi nnukwu azụmahịa ma ọ bụ uru ọrụ ahụ na-eweta.
theological_decisions: []
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. E debere njikọ nkọwa γάρ na okwu nleda anya οὐκ ὀλίγην, ma jiri nkọwa ala peeji chekwaa ejighị n’aka banyere ụdị ihe ọlaọcha ahụ kpọmkwem.
