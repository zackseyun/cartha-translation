base_translation:
  language: en
  yaml_path: translation/nt/acts/019/036.yaml
  text: Therefore[a], since these things are undeniable[c][b], it is necessary for you to remain calm and to do nothing rash.
translation:
  language: ig
  text: Ya mere, ebe ọ bụ na a pụghị ịgbagha ihe ndị a[a], ọ dị mkpa ka unu nọrọ jụụ[b], gharakwa ime ihe ọ bụla n’echeghị echiche nke ọma[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ihe ndị a enweghị mgbagha.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ka obi unu dajụọ” ma ọ bụ “ka unu nọrọ nwayọọ.”
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “n’ike ọkụ” ma ọ bụ “n’ọsọ ọsọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναντιρρήτων
  choice: a pụghị ịgbagha
  rationale: Nkebi okwu a na-egosi na ihe ndị ahụ abụghị ihe mmadụ pụrụ ịjụ ma ọ bụ kwuo okwu megide n'ụzọ nwere isi; ọ na-edokwa ike okwu Grik ahụ n’Igbo e ji eme ihe taa.
- source_word: οὖν
  choice: Ya mere
  rationale: Ọ na-egosi nkwubi okwu odeakwụkwọ obodo ahụ wepụtara site n’ihe o kwuru tupu nke a.
- source_word: ὄντων τούτων
  choice: ebe ọ bụ na ... ihe ndị a
  rationale: A tụgharịrị genitive absolute ahụ dị ka nkebiokwu na-egosi ihe kpatara ndụmọdụ sochirinụ, n’ụzọ dabara n’usoro okwu Igbo.
- source_word: δέον ἐστίν
  choice: ọ dị mkpa
  rationale: Nke a na-egosi mkpa ma ọ bụ ihe a chọrọ ka e mee, n’ebughị ụzọ mee ka ọ bụrụ naanị ndụmọdụ.
- source_word: κατεσταλμένους ὑπάρχειν
  choice: nọrọ jụụ
  rationale: Ọ na-akọwa ịnọ n’ọnọdụ obi jụrụ na nke a chịkọtara achịkọta, ọ bụghị naanị ịkwụsị ikwu okwu.
- source_word: μηδὲν προπετὲς πράσσειν
  choice: ghara ime ihe ọ bụla n’ike ọkụ
  rationale: ‘N’ike ọkụ’ na-egosi ime ihe ngwa ngwa n’enweghị ezigbo ntụle, nke kwekọrọ n’ịdọ aka ná ntị dị n’okwu Grik ahụ.
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo nke dị mfe nghọta ma dịkwa ùgwù mee ihe. Ahịrịokwu ahụ na-edobe usoro nkwubi okwu, ihe kpatara ndụmọdụ ahụ, na ịdọ aka ná ntị megide ime ihe ọkụ ọkụ. E debere akara nkọwa ụkwụ n’ebe okwu nke ọ bụla ha na-akọwa dị.
