id: ACT.19.12
reference: Acts 19:12
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὥστε καὶ ἐπὶ τοὺς ἀσθενοῦντας ⸀ἀποφέρεσθαι ἀπὸ τοῦ χρωτὸς αὐτοῦ σουδάρια ἢ σιμικίνθια καὶ ἀπαλλάσσεσθαι ἀπ’ αὐτῶν τὰς νόσους, τά τε πνεύματα τὰ πονηρὰ ⸀ἐκπορεύεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/012.yaml
  text: so that even handkerchiefs or work aprons were carried away from his body to the sick[a], and the diseases left them[b], and the evil spirits went out.
translation:
  language: ig
  text: Nke a mere ka a na-eburu ọbụna ákwà e ji ehicha ọsụsọ ma ọ bụ ákwà ọrụ e ji eke n’úkwù site n’akpụkpọ ahụ ya[a] wegara ndị ọrịa; ọrịa ndị ahụ wee hapụ ha, mmụọ ọjọọ ndị ahụ sikwa n’ime ha pụọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “site n’ahụ ya.” N’asụsụ Grik, ihe e kwuru n’ụzọ nkịtị bụ “site n’akpụkpọ ahụ ya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: Nke a mere ka
  rationale: Na-egosi ihe si n’ọrụ ebube pụrụ iche ndị a kpọrọ aha n’amaokwu bu ụzọ pụta, ma na-ada nke ọma n’Igbo.
- source_word: ἐπὶ τοὺς ἀσθενοῦντας
  choice: wegara ndị ọrịa
  rationale: Na-egosipụta ndị na-arịa ọrịa dịka ebe e buru ihe ndị ahụ gaa.
- source_word: ἀποφέρεσθαι
  choice: buru ... wegara
  rationale: Ngwakọta ngwaa a na-egosi ma iwepụ ihe ndị ahụ n’ebe Pọl nọ ma iburu ha gakwuru ndị ọrịa.
- source_word: ἀπὸ τοῦ χρωτὸς αὐτοῦ
  choice: si n’akpụkpọ ahụ ya
  rationale: Na-echekwa ihe χρώς pụtara n’ụzọ kacha nso, ya bụ elu ahụ ma ọ bụ akpụkpọ ahụ; ihe ọzọ nwere ike ịbụ ‘n’ahụ ya,’ nke e tinyere n’okpuru peeji.
- source_word: σουδάρια
  choice: ákwà e ji ehicha ọsụsọ
  rationale: Okwu a na-ezo aka n’obere ákwà e ji ehicha ihu ma ọ bụ ọsụsọ; nkọwa a doro onye Igbo nke oge a anya karịa mbinye okwu na-edoghị anya.
- source_word: σιμικίνθια
  choice: ákwà ndị ọrụ na-eke n’úkwù
  rationale: Na-egosipụta ákwà mkpuchi ndị na-arụ ọrụ aka na-eyi, na-enweghị ime ka ọ bụrụ naanị otu ụdị uwe.
- source_word: ἀπαλλάσσεσθαι
  choice: hapụ ha
  rationale: Mgbe ọrịa bụ isiokwu, ‘hapụ ha’ na-enye echiche nke ọrịa isi n’ahụ ndị ahụ pụọ n’Igbo ebumpụta ụwa.
- source_word: νόσους
  choice: ọrịa ndị ahụ
  rationale: Na-echekwa ọtụtụ na nkọwa doro anya nke ọrịa ndị metụtara ndị ahụ, n’etinyeghị nkọwa ọzọ.
- source_word: πνεύματα τὰ πονηρά
  choice: mmụọ ọjọọ ndị ahụ
  rationale: Na-echekwa nkọwa mmụọ ndị na-emegide mmadụ nakwa article ndị dị n’asụsụ Grik.
- source_word: ἐκπορεύεσθαι
  choice: wee pụọ
  rationale: Ọ bụ okwu Igbo dị mfe ma bụrụkwa nke a na-eji ekwu na mmụọ si n’ime mmadụ pụọ.
theological_decisions:
- issue: Ụdị ọgwụgwọ na ịchụpụ mmụọ ọjọọ nke metụtara ákwà ndị si n’ahụ Pọl
  choice: A sụgharịrị ihe mere dịka akụkọ si kwuo ya, n’etinyeghị nkọwa banyere ịsọpụrụ ihe nsọ, usoro sakrament, ma ọ bụ nkwenkwe ụgha.
  alternative: Ịsụgharị ya n’ụzọ ga-egosi na amaokwu ahụ na-akụzi ịsọpụrụ ihe ndị e ji dịka relic, ma ọ bụ belata ọrụ ebube ahụ ka ọ bụrụ naanị ihe atụ.
  rationale: Luk kọwara ọrụ ebube ndị a n’ụzọ kwụ ọtọ. Nsụgharị kwesịrị ịhapụ ihe ahụ dịka akụkọ si kwuo ya, ghara ịgbakwunye ozizi e mechara nwee ma ọ bụ iwepụ ihe karịrị mmadụ nke ederede kwuru.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A kọwara ụdị ákwà abụọ ahụ n’okwu ndị onye nkịtị ga-aghọta, ebe e chekwara nkọwa kpọmkwem nke χρώς na isi ederede ma nye nhọrọ sitere n’okpuru peeji.
