revisions:
- from: 'Nke a mere ka e si n’akpụkpọ ahụ ya[a] buru ọbụna ákwà e ji ehicha ọsụsọ ma ọ bụ ákwà ndị ọrụ na-eke n’úkwù[b] wegara ndị ọrịa; ọrịa ndị ahụ wee hapụ ha, mmụọ ọjọọ ndị ahụ wee pụọ.


    [a] A pụkwara ịsụgharị ya, “n’ahụ ya.” N’asụsụ Grik, ihe e kwuru n’ụzọ nkịtị bụ “n’akpụkpọ ahụ ya.”

    [b] Okwu Grik a na-ezo aka n’ákwà ndị mmadụ na-eke n’úkwù mgbe ha na-arụ ọrụ, ma ọ bụ ákwà mkpuchi ndị ọrụ.'
  to: Nke a mere ka a na-eburu ọbụna ákwà e ji ehicha ọsụsọ ma ọ bụ ákwà ọrụ e ji eke n’úkwù site n’akpụkpọ ahụ ya[a] wegara ndị ọrịa; ọrịa ndị ahụ wee hapụ ha, mmụọ ọjọọ ndị ahụ sikwa n’ime ha pụọ.
  rationale: The revision retains the source’s meaning and narrative register while improving Standard Igbo flow. It keeps the literal rendering of χρώς in the text, supplies a faithful broader alternative in the footnote, and clarifies that the evil spirits went out from the same afflicted people already indicated in the Greek.
  reviewer_model: gpt-5.6-terra
