revisions:
- from: Mgbe ha nụrụ nke a, e mere ha baptizim ịbanye n’aha Onyenwe anyị Jizọs.[a]
  to: Mgbe ha nụrụ nke a, e mere ha baptizim n’aha Onyenwe anyị Jizọs.
  rationale: The revision retains the temporal sequence, passive baptismal action, and the title and name of Jesus. It replaces a calqued and awkward attempt to convey εἰς with the established Igbo baptismal expression “n’aha,” which naturally conveys identification with or baptism under the name of the Lord Jesus in context. The now-redundant footnote is removed.
  reviewer_model: gpt-5.6-terra
