  text: ἀκούσαντες δὲ ἐβαπτίσθησαν εἰς τὸ ὄνομα τοῦ κυρίου Ἰησοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/005.yaml
  text: And when they heard this[a], they were baptized in the name of the Lord Jesus.
translation:
  language: ig
  text: Mgbe ha nụrụ nke a, e mere ha baptizim n’aha Onyenwe anyị Jizọs.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀκούσαντες
  choice: Mgbe ha nụrụ nke a
  rationale: Aorist participle ahụ na-arụ ọrụ nke oge. A gbakwụnyere “nke a” dị ka ihe a na-aghọta site n’okwu Pọl kwuru tupu amaokwu a, ka Igbo wee doo anya ma na-aga nke ọma.
- source_word: δὲ
  choice: ejikọtaghị ya n’okwu pụrụ iche
  rationale: δέ bụ njikọ dị nro nke na-aga n’ihu n’akụkọ; usoro “Mgbe …” na njikọ ahịrịokwu ahụ eburula ọrụ ya n’Igbo, ya mere ịgbakwunye “ma” ma ọ bụ “na” nwere ike ime ka ahịrịokwu ghara ịdị eke.
- source_word: ἐβαπτίσθησαν
  choice: e mere ha baptizim
  rationale: Nke a na-echekwa olu nnara nke ngwaa Grik ma bụrụkwa okwu Igbo a na-aghọta nke ọma.
- source_word: εἰς τὸ ὄνομα
  choice: ịbanye n’aha
  rationale: εἰς nwere ntụgharị gaa n’ime ma ọ bụ njikọ/ịmata onye; “ịbanye n’aha” na-echekwa ike ntụgharị ahụ nke ọma karịa naanị “n’aha,” n’agbanyeghị na nke ikpeazụ bụ okwu ọdịnala a maara nke ọma.
- source_word: τοῦ κυρίου
  choice: Onyenwe anyị
  rationale: N’ebe a κύριος bụ aha nsọpụrụ e ji mara Jizọs; “Onyenwe anyị” bụ ntụgharị Igbo dị ùgwù ma bụrụ nke a na-ahụkarị.
- source_word: Ἰησοῦ
  choice: Jizọs
  rationale: Nke a bụ ụdị aha Ἰησοῦς a na-eji n’Igbo Standard.
theological_decisions:
- issue: Okwu e ji kọwaa baptizim na εἰς τὸ ὄνομα
  choice: ịbanye n’aha Onyenwe anyị Jizọs
  alternative: n’aha Onyenwe anyị Jizọs
  rationale: Nhọrọ bụ isi na-echekwa ntụgharị na njikọ dị na εἰς ma ghara ime ka okwu Luk kwekọọ n’ụzọ a manyere amanye n’usoro emume e mesịrị. E debere ụdị ọdịnala, “n’aha,” n’ala ala peeji.
translation_notes:
  register: Igbo Standard nke oge a, dị ùgwù ma doo ndị nkịtị anya. A họọrọ “e mere ha baptizim” iji chekwaa olu nnara; “ịbanye n’aha” na-egosipụta εἰς n’enweghị ịmanye nkọwa ụka pụrụ iche.
