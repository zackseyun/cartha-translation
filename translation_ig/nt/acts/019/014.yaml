  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἦσαν δέ ⸀τινος Σκευᾶ Ἰουδαίου ἀρχιερέως ἑπτὰ ⸀υἱοὶ τοῦτο ποιοῦντες.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/014.yaml
  text: There were seven sons of a Jewish chief priest named Sceva doing this[a].
translation:
  language: ig
  text: E nwere ụmụ nwoke asaa nke otu onyeisi nchụàjà[a] Juu, aha ya bụ Skeva, ndị na-eme nke a.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “nnukwu onye nchụàjà.” Okwu Grik ahụ nwere ike ịpụta nnukwu onye nchụàjà, ma ọ bụ, n’ụzọ sara mbara, onyeisi nchụàjà ma ọ bụ onye so n’ezinụlọ ndị isi nchụàjà.
    reason: alternative_reading
lexical_decisions:
- source_word: ἦσαν δέ
  choice: dị / na-eme
  rationale: A haziri ahịrịokwu ahụ n’ụzọ Igbo dị ire, ebe echiche nke ịdị adị pụtara site n’ịkpọ ụmụ nwoke asaa ahụ aha na ikwu ihe ha na-eme; δέ bụ njikọ akụkọ dị nro, ya mere a naghị eme ka ọ bụrụ ihe na-egosi mmegide siri ike.
- source_word: τινος Σκευᾶ
  choice: nke otu ... aha ya bụ Skeva
  rationale: “Otu” na-echekwa na onye ahụ abụghị onye a kọwara nke ọma, ebe “aha ya bụ Skeva” bụ ụzọ Igbo nkịtị si webata aha mmadụ.
- source_word: Ἰουδαίου
  choice: ndị Juu
  rationale: N’ebe a okwu ahụ na-egosi njirimara agbụrụ na okpukpe, ọ bụghị naanị onye si Judia.
- source_word: ἀρχιερέως
  choice: onyeisi nchụaja
  rationale: Nhọrọ a na-egosi onye nọ n’ọkwa dị elu n’etiti ndị nchụaja n’ebughị ụzọ kwuo na Skeva bụ naanị Nnukwu Onye Nchụaja nke ụlọ nsọ.
- source_word: ἑπτὰ υἱοὶ
  choice: ụmụ nwoke asaa
  rationale: Nke a na-egosi kpọmkwem na ha bụ ụmụ ya ndị nwoke ma na-echekwa ọnụọgụ asaa.
- source_word: τοῦτο ποιοῦντες
  choice: na-eme nke a
  rationale: Ọ na-ezo aka n’omume a kpọtụrụ aha ozugbo n’amaokwu bu ụzọ, ma na-egosikwa omume ha na-aga n’ihu.
theological_decisions:
- issue: Ihe ἀρχιερεύς pụtara mgbe e ji ya kọwaa Skeva
  choice: onyeisi nchụaja
  alternative: Nnukwu Onye Nchụaja
  rationale: Okwu Grik ahụ nwere ike ịpụta Nnukwu Onye Nchụaja ma ọ bụ onyeisi n’etiti ndị nchụaja. Ebe a maghị Skeva dị ka onye jidere otu ọkwa pụrụ iche nke Nnukwu Onye Nchụaja na Jerusalem, “onyeisi nchụaja” na-ezere ikwu ihe akụkọ ihe mere eme na-akwadoghị ma na-echekwa obosara okwu Grik ahụ.
translation_notes:
  register: Standard Igbo nke oge a, dị mfe nghọta ma nwee ugwu. A họọrọ “onyeisi nchụaja” iji chekwaa nghọta sara mbara nke okwu Grik; e tinyere ụzọ ọzọ n’okpuru ala. Akara ndetu [a] dị n’isiokwu ahụ.
