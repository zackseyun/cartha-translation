- from: Chineke nọkwa na-eme ọrụ ebube ndị pụrụ iche site n'aka Pọl.[a]
  to: Chineke na-emekwa ọrụ ebube ndị pụrụ iche site n'aka Pọl.[a]
  rationale: The revision preserves divine agency, Paul’s instrumental role, and the imperfect aspect, while using a smoother Standard Igbo verbal construction. The note is adjusted to represent the Greek phrase “not ordinary/common” more closely without overstating a single literal equivalent.
