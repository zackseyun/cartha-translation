  text: Δυνάμεις τε οὐ τὰς τυχούσας ⸂ὁ θεὸς ἐποίει⸃ διὰ τῶν χειρῶν Παύλου,
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/011.yaml
  text: And God was doing extraordinary miracles through the hands of Paul,[a]
translation:
  language: ig
  text: Chineke na-emekwa ọrụ ebube ndị pụrụ iche site n'aka Pọl.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N'ụzọ nkịtị, “ọrụ ike ndị na-adịghị adịkarị.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Δυνάμεις
  choice: ọrụ ebube
  rationale: N'ebe a, ọtụtụ δύναμις na-ezo aka n'omume ndị gosipụtara ike Chineke, ọ bụghị n'ike dị ka echiche nkịtị; “ọrụ ebube” na-eme ka nke a doo onye Igbo nke oge a anya.
- source_word: τε
  choice: nọkwa
  rationale: Akụkụ “-kwa” jikọtara okwu a na akụkọ bu ya ụzọ n'ụzọ dị nro ma kwekọọ n'ọrụ njikọ nke τε.
- source_word: οὐ τὰς τυχούσας
  choice: ndị pụrụ iche
  rationale: Nkebiokwu a pụtara na ọrụ ebube ndị ahụ abụghị nke a na-ahụkarị. “Ndị pụrụ iche” na-egosipụta isi okwu ahụ n'Igbo dị mfe, ebe nkọwa ala peeji na-echekwa ọdịdị okwu Grik ahụ.
- source_word: ὁ θεὸς
  choice: Chineke
  rationale: Chineke bụ onye isiokwu Grik kpọrọ aha, ya mere nsụgharị ahụ mere ka o doo anya na ọ bụ Chineke rụrụ ọrụ ndị ahụ.
- source_word: ἐποίει
  choice: nọ na-eme
  rationale: Ụdị imperfect na-egosi omume gara n'ihu ma ọ bụ nke a na-eme ugboro ugboro n'oge gara aga; “nọ na-eme” na-echekwa akụkụ ahụ.
- source_word: διὰ τῶν χειρῶν Παύλου
  choice: site n'aka Pọl
  rationale: Nke a bụ akpaala okwu Igbo sitere n'okike nke na-echekwa echiche nke “aka” ma na-egosi na Pọl bụ onye Chineke si n'aka ya rụọ ọrụ.
- source_word: Παύλου
  choice: Pọl
  rationale: A sụgharịrị aha ahụ n'ụdị a na-ejikarị ede ya n'Igbo.
theological_decisions:
- issue: Onye na-arụ ọrụ ebube
  choice: Chineke bụ onye na-eme ọrụ ebube ndị ahụ, ọ na-emekwa ha site n'aka Pọl.
  alternative: Ikwu na Pọl n'onwe ya bụ onye rụrụ ọrụ ebube ndị ahụ.
  rationale: ὁ θεὸς bụ isiokwu doro anya nke ἐποίει, ebe διὰ τῶν χειρῶν Παύλου gosiri na Pọl bụ ụzọ ma ọ bụ onye ọrụ Chineke ji mee ha. Nsụgharị ahụ echekwala ọdịiche a.
translation_notes:
  register: Igbo Izugbe dị ugbu a, dị ùgwù ma dị mfe nghọta. “Site n'aka Pọl” bụ akpaala okwu nkịtị nke na-echekwa ihe oyiyi nke aka n'okwu Grik, ebe “ndị pụrụ iche” na-ezere ahịrịokwu siri ike ma ọ bụ nke na-adịghị ada ka Igbo sitere n'okike.
