  text: ἱκανοὶ δὲ τῶν τὰ περίεργα πραξάντων συνενέγκαντες τὰς βίβλους κατέκαιον ἐνώπιον πάντων· καὶ συνεψήφισαν τὰς τιμὰς αὐτῶν καὶ εὗρον ἀργυρίου μυριάδας πέντε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/019.yaml
  text: And many of those who had practiced magic arts brought their books together and were burning them in front of everyone[b][a]; and they totaled up their value and found it to be fifty thousand pieces of silver.
translation:
  language: ig
  text: Ọtụtụ n’ime ndị na-emebu ihe anwansi[a] kpọkọtara akwụkwọ ha, na-esure ha ọkụ n’ihu mmadụ niile. Ha wee gbakọọ ọnụ ahịa akwụkwọ ndị ahụ, chọpụta na ọ ruru puku iri ise n’ọlaọcha.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “omume nzuzo metụtara anwansi.” Okwu Grik ahụ pụtara n'ụzọ nkịtị ihe ndị “pụrụ iche” ma ọ bụ “na-akpali mmasị,” ma n'ebe a ọ na-ezo aka n'omume anwansi.
    reason: lexical_alternative
  - marker: b
    text: N'ụzọ nkịtị, “myriad ise n’ọlaọcha,” ya bụ, puku iri ise n’ọlaọcha. E kwughị kpọmkwem ụdị mkpụrụ ego ahụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἱκανοὶ
  choice: Ọtụtụ
  rationale: N'ebe a, okwu ahụ na-egosi ọnụ ọgụgụ buru ibu, ọ bụghị naanị izu oke; “Ọtụtụ” bụ Igbo doro anya ma kwekọọ n'akụkọ ahụ.
- source_word: τὰ περίεργα πραξάντων
  choice: ndị na-emebu anwansi
  rationale: N'ọnọdụ a—akwụkwọ anwansi, ndị na-achụ mmụọ, na mmụọ ọjọọ—akpaokwu Grik ahụ na-ezo aka n'omume anwansi, ọ bụghị nanị ihe ndị pụrụ iche ma ọ bụ ihe na-akpali mmasị. “Na-emebu” na-egosi omume ha mere tupu ha ebibie akwụkwọ ndị ahụ.
- source_word: συνενέγκαντες τὰς βίβλους
  choice: chịkọtara akwụkwọ ha
  rationale: Nke a na-egosi na ha butere ma chịkọta ihe odide ndị ahụ n'otu ebe. “Akwụkwọ” bụ okwu sara mbara nke na-adịghị ekpebi ma ha bụ akwụkwọ mpịakọta ma ọ bụ ụdị akwụkwọ ọzọ.
- source_word: κατέκαιον
  choice: na-erekwa ha ọkụ
  rationale: Ụdị imperfect Grik na-egosi omume ọkụ ahụ ka ọ na-aga n'ihu; nsụgharị a na-echekwa akụkụ ahụ ma na-ada nke ọma n'Igbo.
- source_word: ἐνώπιον πάντων
  choice: n’ihu mmadụ niile
  rationale: Nke a na-eme ka o doo anya na ha mere ya n'ihu ọha ebe mmadụ niile na-ahụ ya.
- source_word: συνεψήφισαν τὰς τιμὰς αὐτῶν
  choice: Ha wee gbakọọ ọnụ ahịa akwụkwọ ndị ahụ
  rationale: Ngwaa ahụ pụtara ịgbakọta ọnụ ọgụgụ iji nweta ngụkọta; ikwughachi “akwụkwọ ndị ahụ” na-ewepụ mgbagwoju anya nke nnọchiaha n'Igbo.
- source_word: ἀργυρίου μυριάδας πέντε
  choice: puku iri ise n’ego ọlaọcha
  rationale: “Myriad ise” bụ puku iri ise. Grik ekwughị kpọmkwem ụdị mkpụrụ ego ahụ, ya mere “ego ọlaọcha” na-echekwa izugbe nke okwu ahụ.
theological_decisions:
- issue: Ihe τὰ περίεργα pụtara n'ọnọdụ Efesọs
  choice: anwansi
  alternative: omume nzuzo / ihe ndị pụrụ iche
  rationale: Akụkụ gbara amaokwu ahụ gburugburu na-ekwu maka ịchụ mmụọ, mmụọ ọjọọ, na akwụkwọ dị oké ọnụ ahịa e ji eme ihe ndị a. “Anwansi” na-egosipụta ihe akụkọ ahụ na-ekwu n'ụzọ doro anya, n'etinyeghị nkọwa okpukpe nke otu ụka.
translation_notes:
  register: Standard Igbo; natural, dignified narrative prose for ordinary modern readers. The wording preserves the public setting, the progressive force of the imperfect burning verb, and the unspecified silver denomination.
