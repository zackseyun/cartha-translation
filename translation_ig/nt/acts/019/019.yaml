revisions:
- from: Ọtụtụ n’ime ndị na-emebu anwansi[a] chịkọtara akwụkwọ ha, na-erekwa ha ọkụ n’ihu mmadụ niile. Ha wee gbakọọ ọnụ ahịa akwụkwọ ndị ahụ, chọpụta na ọ ruru puku iri ise n’ego ọlaọcha.[b]
  to: Ọtụtụ n’ime ndị na-emebu ihe anwansi[a] kpọkọtara akwụkwọ ha, na-esure ha ọkụ n’ihu mmadụ niile. Ha wee gbakọọ ọnụ ahịa akwụkwọ ndị ahụ, chọpụta na ọ ruru puku iri ise n’ọlaọcha.[b]
