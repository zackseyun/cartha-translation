source:
  edition: SBLGNT
  text: ἠγάγετε γὰρ τοὺς ἄνδρας τούτους οὔτε ἱεροσύλους οὔτε βλασφημοῦντας τὴν θεὸν ⸀ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/037.yaml
  text: For you have brought these men here who are neither temple robbers nor blasphemers of our goddess[a].
translation:
  language: ig
  text: N’ihi na unu kpọtara ndị ikom ndị a, ndị na-adịghị apụnara ụlọ nsọ ihe, ndị na-adịghịkwa ekwulu chi nwanyị anyị.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’asụsụ Grik, okwu ngosipụta nwanyị “τὴν” na-egosi na a na-ekwu maka chi nwanyị; onye ahụ bụ Atemis.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠγάγετε
  choice: unu akpọtala
  rationale: Aorist ἄγω na-ekwu banyere omume e mezuru nke ka metụtara ọnọdụ nzukọ ahụ; “akpọtala” bụ okwu Igbo dị ndụ maka ịkpọta mmadụ n’ebe a.
- source_word: γὰρ
  choice: N’ihi na
  rationale: Ọ na-ewebata ihe mere okwu onye odeakwụkwọ obodo kwuru ji bụrụ eziokwu.
- source_word: τοὺς ἄνδρας τούτους
  choice: ndị ikom a n’ebe a
  rationale: ἀνήρ pụtara ndị ikom, ebe “a n’ebe a” na-eme ka ntụaka τούτους n’ihu ọgbakọ ahụ doo anya.
- source_word: οὔτε ... οὔτε
  choice: ọ bụ ezie na ha abụghị ... ha adịghịkwa
  rationale: Usoro a na-edobe nkwụpụ abụọ nke Grik n’Igbo ebumpụta ụwa, n’agbanyeghị na njikọ ya na ahịrịokwu gara aga chọrọ ka e gosipụta uru nkwenye ahụ.
- source_word: ἱεροσύλους
  choice: ndị na-apụnara ụlọ nsọ ihe
  rationale: Okwu ahụ kpọmkwem na-ezo aka n’ịpụnara ụlọ nsọ ma ọ bụ ihe nsọ; nsụgharị a doro ndị na-agụ akwụkwọ anya.
- source_word: βλασφημοῦντας
  choice: ekwulu
  rationale: “Ikwulu” na-egosi okwu mkparị ma ọ bụ nkwulu a na-ekwu megide chi, dabara n’ọnọdụ okpukpe na ikpe a.
- source_word: τὴν θεὸν ἡμῶν
  choice: chi nwanyị anyị
  rationale: Ihe a na-ekwu maka ya bụ Atemis, chi nwanyị ndị Efesọs; “chi nwanyị” na-egosi onye ahụ n'ụzọ doro anya n’Igbo.
theological_decisions:
- issue: Nsụgharị θεὸν ἡμῶν nke na-ezo aka na Atemis
  choice: chi nwanyị anyị
  alternative: chi anyị
  rationale: Onye ọrụ obodo Efesọs na-ekwu maka Atemis, ọ bụghị Chineke. Ịsị “chi nwanyị” na-echekwa ihe okwu ahụ pụtara n’ọnọdụ ya, n’enweghị ịkwado ofufe ahụ.
translation_notes:
  register: Ejiri Igbo ọkọlọtọ, nke ugbu a, dị nsọpụrụ ma dị mfe nghọta. “Ụlọ nsọ” na “ikwulu” na-edobe ọnọdụ okpukpe na ikpe nke amaokwu ahụ.
