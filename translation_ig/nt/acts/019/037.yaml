revisions:
- from: N’ihi na unu akpọtala ndị ikom a n’ebe a, ọ bụ ezie na ha abụghị ndị na-apụnara ụlọ nsọ ihe, ha adịghịkwa ekwulu chi nwanyị anyị.[a]
  to: N’ihi na unu kpọtara ndị ikom ndị a, ndị na-adịghị apụnara ụlọ nsọ ihe, ndị na-adịghịkwa ekwulu chi nwanyị anyị.[a]
  rationale: The revision restores the explanatory force of γάρ without adding a concession, retains the paired negation of οὔτε ... οὔτε, and corrects the footnote so that it reflects the feminine grammatical marking and the contextual referent, Artemis.
