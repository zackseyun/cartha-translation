  text: ⸂Παύλου δὲ⸃ βουλομένου εἰσελθεῖν εἰς τὸν δῆμον οὐκ εἴων αὐτὸν οἱ μαθηταί·
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/030.yaml
  text: But when Paul wanted to go in among the assembly[a], the disciples would not let him.
translation:
  language: ig
  text: Ma mgbe Pọl chọrọ ịbanye n’etiti nzukọ ahụ[a], ndị na-eso ụzọ ekweghị ka ọ banye.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ịbanye ná nzukọ ahụ,” ma ọ bụ, “ịbanye n’etiti ìgwè mmadụ ahụ.” Okwu Grik ahụ bụ δῆμος pụrụ izo aka n’ọha zukọrọ dịka otu nzukọ n’ọnọdụ ọchịchị obodo a.
    reason: lexical_alternative
lexical_decisions:
- source_word: Παύλου
  choice: Pọl
  rationale: Ụdị aha Παῦλος a na-ede n’Igbo dịka Pọl.
- source_word: δὲ
  choice: Ma
  rationale: Ọ na-egosi obere ntụgharị ma ọ bụ ọdịiche n’ihe akụkọ ahụ na-aga ikwu.
- source_word: βουλομένου
  choice: mgbe Pọl chọrọ
  rationale: Genitive absolute a na-egosi ọchịchọ ma ọ bụ ebumnuche Pọl; nkebiokwu a bụ Igbo nkịtị ma doo anya.
- source_word: εἰσελθεῖν
  choice: ịbanye
  rationale: Ọ na-egosi imegharị banye n’ebe ndị ahụ zukọrọ.
- source_word: εἰς τὸν δῆμον
  choice: n’etiti nzukọ ahụ
  rationale: δῆμος n’ọnọdụ obodo Efesọs a pụrụ ịpụta ọha zukọrọ dịka otu nzukọ, ma ọ bụ ìgwè mmadụ; ‘n’etiti nzukọ ahụ’ na-echekwa echiche ịbanye n’etiti ndị zukọrọ.
- source_word: οὐκ εἴων
  choice: ekweghị ka ọ banye
  rationale: Imperfect εἴων na-egosi na ndị na-eso ụzọ jụrụ ma gbochie ya; ikwughachi ‘banye’ na-eme ka Igbo doo anya.
- source_word: οἱ μαθηταί
  choice: ndị na-eso ụzọ
  rationale: Nke a na-echekwa echiche μαθηταί dịka ndị na-amụta ihe ma na-eso ụzọ, n’etinyeghị ‘ya,’ nke Grik ekwughị.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo Izugbe, nke oge a ma nwee ugwu. A họọrọ ‘nzukọ’ iji gosipụta ọha zukọrọ n’ọnọdụ obodo ahụ, ebe nkọwa ala peeji na-echekwa ohere nke ‘ìgwè mmadụ.’
