id: ACT.19.9
reference: Acts 19:9
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὡς δέ τινες ἐσκληρύνοντο καὶ ἠπείθουν κακολογοῦντες τὴν ὁδὸν ἐνώπιον τοῦ πλήθους, ἀποστὰς ἀπ’ αὐτῶν ἀφώρισεν τοὺς μαθητάς, καθ’ ἡμέραν διαλεγόμενος ἐν τῇ σχολῇ ⸀Τυράννου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/009.yaml
  text: But when some became hardened and disobedient[a], speaking evil of the Way before the crowd, he withdrew from them and set apart the disciples[c][b], reasoning daily in the lecture hall of Tyrannus.
translation:
  language: ig
  text: Ma mgbe ụfọdụ n’ime ha na-esiwanye ike n’obi, na-ajụ irube isi[a], na-ekwujọ Ụzọ ahụ[b] n’ihu ìgwè mmadụ, Pọl hapụrụ ha, wee kewapụ ndị na-eso ụzọ ahụ. Kwa ụbọchị, ọ na-akparịta ụka n’ụlọ nkuzi[c] Tiranọs.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ha ekweghị,” ma ọ bụ, “ha jụrụ ka e kwenye ha.”
    reason: lexical_alternative
  - marker: b
    text: “Ụzọ ahụ” bụ otu n’ime aha ndị mmadụ ji mara òtù ndị na-eso Jizọs n’oge mbụ n’akwụkwọ Ọrụ Ndịozi.
    reason: cultural_note
  - marker: c
    text: A pụkwara ịsụgharị ya, “n’ụlọ akwụkwọ Tiranọs.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσκληρύνοντο
  choice: obi ụfọdụ n’ime ha nọ na-esi ike
  rationale: Nke a na-egosi ọnọdụ na-aga n’ihu nke obi na-esi ike, dịka imperfect si dị, ma ọ naghị ekpebi ma ọ bụ ha mere onwe ha otu a ma ọ bụ na e mere ha otu a.
- source_word: ἠπείθουν
  choice: ha na-enupụkwa isi
  rationale: Nke a na-echekwa akụkụ omume na mkpebi mmadụ nke ἀπειθέω; ihe odide ala peeji na-egosikwa na okwu ahụ nwere ike ịpụta ekweghị ekwe ma ọ bụ ịjụ ka e kwenye mmadụ.
- source_word: κακολογοῦντες
  choice: na-ekwujọ
  rationale: ‘Na-ekwujọ’ na-enye echiche nke ikwu okwu ọjọọ megide ihe ahụ n’ihu ọha, n’etinyeghị nkọwa iwu pụrụ iche dịka ebubo ụgha.
- source_word: τὴν ὁδὸν
  choice: Ụzọ ahụ
  rationale: E ji mkpụrụedemede ukwu gosi na ‘Ụzọ ahụ’ bụ aha e ji mara ndị na-eso Jizọs na akwụkwọ Ọrụ Ndịozi, ọ bụghị naanị ụzọ nkịtị.
- source_word: ἐνώπιον τοῦ πλήθους
  choice: n’ihu ìgwè mmadụ
  rationale: Nke a na-echekwa echiche nke mmegide e mere n’ihu ọha.
- source_word: ἀποστὰς ἀπ’ αὐτῶν
  choice: Pọl si n’etiti ha pụọ
  rationale: Nke a na-egosi mkpebi Pọl mere ịhapụ ndị na-emegide ozi ahụ. E tinyere aha Pọl iji mee ka onye a na-ekwu maka ya doo anya n’Igbo.
- source_word: ἀφώρισεν τοὺς μαθητάς
  choice: kewapụkwa ndị na-eso ụzọ ahụ
  rationale: Nke a na-egosi na Pọl kpachaara anya kewapụ ndị na-eso ụzọ n’ebe ndị mmegide nọ, ma jiri okwu Igbo a na-aghọta nke ọma maka μαθηταί.
- source_word: καθ’ ἡμέραν
  choice: Kwa ụbọchị
  rationale: Nke a na-egosi omume a na-eme ụbọchị niile mgbe niile.
- source_word: διαλεγόμενος
  choice: ọ na-atụle okwu ahụ
  rationale: Nke a na-egosi mkparịta ụka na ntụgharị uche nwere ezi ihe kpatara ya, na-emeghị ka ọ bụrụ naanị esemokwu.
- source_word: ἐν τῇ σχολῇ Τυράννου
  choice: n’ụlọ nkuzi Tiranọs
  rationale: ‘Ụlọ nkuzi’ na-egosi ebe a na-akụzi ihe ma ọ bụ na-atụle okwu, ebe ‘Tiranọs’ bụ nsụgharị ụda nke aha Grik ahụ.
theological_decisions:
- issue: Ịsụgharị τὴν ὁδὸν dịka aha e ji mara otu ndị Kraịst oge mbụ
  choice: Ụzọ ahụ
  alternative: ụzọ ahụ dịka ụzọ ma ọ bụ ozizi n’ozuzu ya
  rationale: N’Ọrụ Ndịozi, okwu a na-arụ ọrụ dịka aha a maara nke ọma e ji akpọ òtù ndị na-eso Jizọs. Mkpụrụedemede ukwu na-enyere onye na-agụ aka ịhụ nke a n’etinyeghị ozizi ụka pụrụ iche.
- issue: Ịchekwa ọtụtụ nghọta ἠπείθουν nwere ike inwe
  choice: ha na-enupụkwa isi
  alternative: ha ekweghị; ha jụrụ ka e kwenye ha
  rationale: Okwu Grik ahụ nwere ike ịpụta nnupụisi, ekweghị ekwe, ma ọ bụ ịjụ nkwenye. Isi ederede na-echekwa akụkụ omume ya, ebe ihe odide ala peeji na-egosi ụzọ nghọta ndị ọzọ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta, dee ya. Ahịrịokwu abụọ na-eme ka usoro ihe omume doo anya. E chekwara ihe mgbagwoju anya dị na ἐσκληρύνοντο site n’ịsị na obi ha ‘nọ na-esi ike,’ kama ikwu kpọmkwem onye mere ka o sie ike.
