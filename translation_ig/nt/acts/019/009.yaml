revisions:
- from: Ma mgbe obi ụfọdụ n’ime ha nọ na-esi ike, ha na-enupụkwa isi[a], na-ekwujọ Ụzọ ahụ[b] n’ihu ìgwè mmadụ, Pọl si n’etiti ha pụọ, kewapụkwa ndị na-eso ụzọ ahụ. Kwa ụbọchị, ọ na-atụle okwu ahụ n’ụlọ nkuzi[c] Tiranọs.
  to: Ma mgbe ụfọdụ n’ime ha na-esiwanye ike n’obi, na-ajụ irube isi[a], na-ekwujọ Ụzọ ahụ[b] n’ihu ìgwè mmadụ, Pọl hapụrụ ha, wee kewapụ ndị na-eso ụzọ ahụ. Kwa ụbọchị, ọ na-akparịta ụka n’ụlọ nkuzi[c] Tiranọs.
  rationale: The revision corrects the subject and improves idiomatic Standard Igbo for the ongoing hardening, while preserving the Greek ambiguity about agency. It also renders ἠπείθουν with an ongoing volitional expression and replaces the added-object phrasing for διαλεγόμενος with a natural expression for reasoned discussion. Footnote markers and their corresponding notes remain complete and correctly anchored.
