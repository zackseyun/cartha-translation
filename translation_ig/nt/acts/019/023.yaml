  to: N’oge ahụ, ọgbaaghara na-adịghị ntakịrị bilitere banyere Ụzọ ahụ.[a]
  rationale: The revision retains the draft’s sound rendering of the event and the title-like use of “Ụzọ,” while restoring the Greek litotes with “na-adịghị ntakịrị.” The footnote remains anchored to the capitalization/lexical alternative and explains the Acts usage in more direct, non-institutional language.
  reviewer_model: gpt-5.6-terra
