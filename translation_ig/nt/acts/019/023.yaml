  text: Ἐγένετο δὲ κατὰ τὸν καιρὸν ἐκεῖνον τάραχος οὐκ ὀλίγος περὶ τῆς ὁδοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/023.yaml
  text: At that time there arose no small disturbance concerning the Way[a].
translation:
  language: ig
  text: N’oge ahụ, ọgbaaghara na-adịghị ntakịrị bilitere banyere Ụzọ ahụ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ụzọ ahụ.” N’ebe a, ọ na-ezo aka n’ndị na-eso ụzọ Jisọs Kraịst; n’Ọrụ Ndịozi, a na-akpọ ha aha a ugboro ugboro.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο
  choice: bilitere
  rationale: N’ebe a, γίνομαι na-egosi na ihe omume malitere ịdị; “bilitere” bụ okwu Igbo dị mfe ma na-edowe ike nke ihe ahụ mere.
- source_word: δὲ
  choice: (asụgharịghị ya iche)
  rationale: δέ bụ njikọ akụkọ dị nro. N’Igbo, usoro ahịrịokwu a na-ebuga akụkọ n’ihu nke ọma na-enweghị ịgbakwunye “ma” ma ọ bụ “ugbu a,” nke nwere ike ime ka ọdịiche ma ọ bụ oge pụta karịa ka isi mmalite kwuru.
- source_word: κατὰ τὸν καιρὸν ἐκεῖνον
  choice: N’oge ahụ
  rationale: Nke a na-enye ntụaka oge ahụ n'ụzọ dị mkpirikpi na nke e ji eme ihe n’Igbo.
- source_word: τάραχος
  choice: ọgbaaghara
  rationale: “Ọgbaaghara” na-egosi ọgba aghara ma ọ bụ mkpọtụ ọha na eze n’ebughị ụzọ kọwaa ya kpọmkwem dị ka nnupụisi.
- source_word: οὐκ ὀλίγος
  choice: nnukwu
  rationale: Okwu Grik bụ litotes, n'ụzọ nkịtị “ọ bụghị obere.” N’Igbo nke oge a, “nnukwu” na-ebute otu ike ahụ n'ụzọ eke karịa “ọ bụghị obere ọgbaaghara.”
- source_word: περὶ
  choice: banyere
  rationale: “Banyere” na-egosi okwu ma ọ bụ ihe kpatara ọgbaaghara ahụ nke ọma.
- source_word: τῆς ὁδοῦ
  choice: Ụzọ ahụ
  rationale: N’Ọrụ Ndịozi, okwu a bụ aha e ji amata òtù ndị na-eso Kraịst. Mkpụrụedemede ukwu na-enyere onye na-agụ aka ịmata ojiji pụrụ iche a, ebe “ahụ” na-edowe article Grik.
theological_decisions:
- issue: Ịsụgharị τῆς ὁδοῦ dị ka aha e ji amata otu okpukpe
  choice: Ụzọ ahụ
  alternative: ụzọ ahụ
  rationale: N’Ọrụ Ndịozi, “Ụzọ” bụ aha a na-akpọgharị òtù ndị na-eso Kraịst. Ide ya na mkpụrụedemede ukwu na-eme ka ntụaka ahụ doo anya n’etinyeghị nkọwa ozizi ọzọ.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke oge a, dị ugwu ma dị mfe nghọta. A họọrọ usoro okwu eke n’Igbo; a gbanwere litotes Grik ka ọ bụrụ “nnukwu” iji zere ntụgharị siri ike na-adịghị ada ka Igbo nkịtị.
