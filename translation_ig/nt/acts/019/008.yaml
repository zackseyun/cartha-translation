  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Εἰσελθὼν δὲ εἰς τὴν συναγωγὴν ἐπαρρησιάζετο ἐπὶ μῆνας τρεῖς διαλεγόμενος καὶ ⸀πείθων περὶ τῆς βασιλείας τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/008.yaml
  text: And entering the synagogue[a], he spoke boldly for three months[b], reasoning and persuading them about the kingdom of God.
translation:
  language: ig
  text: Ọ banyere n’ụlọ nzukọ ndị Juu, ma jiri obi ike na-ekwu okwu n’ime ọnwa atọ, na ya na ha na-atụle okwu ma na-eme ka ha kwenye banyere alaeze Chineke.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εἰσελθὼν
  choice: Ọ banyere
  rationale: Aorist participle a na-egosi ihe o mere tupu isi omume ahụ; usoro a bụ Igbo doro anya ma debe njikọ nke omume abụọ ahụ.
- source_word: συναγωγήν
  choice: ụlọ nzukọ ndị Juu
  rationale: Nke a na-akọwa kpọmkwem ebe ndị Juu na-ezukọ, n’asụsụ Igbo ndị nkịtị ga-aghọta ngwa ngwa.
- source_word: ἐπαρρησιάζετο
  choice: jiri nkwuwa okwu na-ekwu okwu
  rationale: Imperfect ahụ na-egosi na o mere nke a ugboro ugboro ma ọ bụ na-aga n’ihu; “jiri nkwuwa okwu” na-egosikwa ikwu okwu n’atụghị egwu.
- source_word: ἐπὶ μῆνας τρεῖς
  choice: ruo ọnwa atọ
  rationale: Ọ na-egosi ogologo oge omume ahụ gara n’ihu; nke a bụ usoro Igbo dị mfe ma kwekọọ n’echiche Grik.
- source_word: διαλεγόμενος
  choice: ya na ha na-atụle okwu ahụ
  rationale: Okwu ahụ gụnyere mkparịta ụka, ịkọwa ihe, na iji echiche kwado okwu; “na-atụle okwu” na-ezere ụda esemokwu siri ike nke “na-arụrịta ụka” nwere ike inwe.
- source_word: πείθων
  choice: na-agbalị ime ka ha kwenye
  rationale: Nke a na-egosi ọrụ ọ na-arụ iji dọta ndị na-ege ya ntị n’ikweta, ma ọ naghị ekwu na ha niile kwetara n’ezie.
- source_word: περὶ τῆς βασιλείας τοῦ θεοῦ
  choice: n’ihe banyere alaeze Chineke
  rationale: “N’ihe banyere” na-egosipụta περί na genitive, ebe “alaeze Chineke” bụ okwu doro anya ma bụrụkwa ụzọ a na-amakarị isi sụgharịa nkebiokwu a.
theological_decisions:
- issue: 'Ihe πείθων pụtara: mgbalị ime ka mmadụ kwenye ka ọ bụ ihe ịga nke ọma n’ime ka ha kwenye'
  choice: na-agbalị ime ka ha kwenye
  alternative: na-eme ka ha kwenye
  rationale: Participial ahụ na-akọwa ọrụ Pọl na-arụ, ma amaokwu ahụ ekwughị na ndị niile nụrụ ya kwetara. Isi ederede na-ezere ikwu na mgbalị ahụ rụzuru n’ebe mmadụ niile nọ, ebe nkọwa ala peeji na-edebe nsụgharị dị nkenke karị.
- issue: βασιλεία τοῦ θεοῦ
  choice: alaeze Chineke
  alternative: ọchịchị Chineke
  rationale: “Alaeze Chineke” na-edebe okwu bụ isi a na-eji n’Agba Ọhụrụ ma hapụ obosara echiche βασιλεία, nke nwere ike ịgụnye ọchịchị ma ọ bụ ógbè ọchịchị.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. E ji “ụlọ nzukọ ndị Juu” kama okwu mbinye a na-amaghị nke ọma, ma debe “alaeze Chineke” dị ka okwu nkà mmụta okpukpe a na-amakarị.
