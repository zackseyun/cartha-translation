  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἄλλοι μὲν οὖν ἄλλο τι ἔκραζον, ἦν γὰρ ἡ ἐκκλησία συγκεχυμένη, καὶ οἱ πλείους οὐκ ᾔδεισαν τίνος ἕνεκα συνεληλύθεισαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/032.yaml
  text: So then some were shouting one thing and some another[a], for the assembly was in confusion, and most of them did not know why they had come together.
translation:
  language: ig
  text: Ya mere, ụfọdụ nọ na-eti mkpu otu ihe, ndị ọzọ ana-eti ihe ọzọ, n’ihi na ọgbakọ ahụ[a] nọ n’ọgba aghara, ọtụtụ n’ime ha amaghịkwa ihe mere ha ji gbakọta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “nzukọ ahụ” ma ọ bụ “ìgwè mmadụ ahụ.” Okwu Grik e ji mee ihe bụ ἐκκλησία; n’ebe a, ọ pụtara ọgbakọ ọha obodo, ọ bụghị nzukọ ndị Kraịst.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλοι μὲν οὖν ἄλλο τι ἔκραζον
  choice: Ya mere, ụfọdụ nọ na-eti mkpu otu ihe, ndị ọzọ ana-eti ihe ọzọ
  rationale: Nke a na-egosipụta ọdịiche distributive nke ἄλλοι ... ἄλλο τι, ebe ‘nọ na-eti mkpu’ na-egosi omume na-aga n’ihu nke imperfect ἔκραζον. ‘Ya mere’ na-enye μὲν οὖν n’ụzọ Igbo dị ire.
- source_word: ἐκκλησία
  choice: ọgbakọ
  rationale: N’ọnọdụ a, okwu ahụ na-ezo aka n’ọgbakọ ọha obodo, ọ bụghị nzukọ ndị Kraịst. ‘Ọgbakọ’ na-echekwa echiche nke ndị zukọrọ, ma ihe odide ala peeji na-akọwa kpọmkwem ụdị ọgbakọ ọ bụ.
- source_word: συγκεχυμένη
  choice: nọ n’ọgba aghara
  rationale: Perfect participle ahụ na-egosi ọnọdụ mgbagwoju anya na enweghị usoro nke ọgbakọ ahụ nọ na ya; ‘nọ n’ọgba aghara’ bụ Igbo doro anya ma kwekọọ n’ọnọdụ mkpọtụ ahụ.
- source_word: οἱ πλείους
  choice: ọtụtụ n’ime ha
  rationale: Nke a na-egosi ihe ka ọtụtụ n’ime ndị bịara, ma na-ezo aka n’ụzọ doro anya nye ndị nọ n’ọgbakọ ahụ.
- source_word: τίνος ἕνεκα
  choice: ihe mere
  rationale: Akpaokwu a pụtara ‘n’ihi gịnị’ ma ọ bụ ‘n’ihi ihe kpatara ya’; nhazi ‘ihe mere ha ji’ bụ ụzọ Igbo nkịtị e si ajụ ma ọ bụ kwuo ihe kpatara omume.
- source_word: συνεληλύθεισαν
  choice: ha ji gbakọta
  rationale: ‘Gbakọta’ na-egosipụta συνέρχομαι nke ọma. N’usoro Igbo a, ihe mere n’oge gara aga tupu ọnọdụ a pụtara nke ọma site n’ihe gbara ya gburugburu, n’enweghị iwu ka e tinye akara pluperfect pụrụ iche.
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta, dee amaokwu ahụ. A họọrọ ‘ọgbakọ’ iji chekwaa njikọ ya na ἐκκλησία, ebe ihe odide ala peeji na-egbochi nghọtahie na ọ bụ ụka. Nhazi ahịrịokwu ahụ na-edobe mkpọtụ na mgbagwoju anya dị n’isi mmalite Grik.
