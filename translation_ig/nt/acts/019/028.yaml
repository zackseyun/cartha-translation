  text: Ἀκούσαντες δὲ καὶ γενόμενοι πλήρεις θυμοῦ ἔκραζον λέγοντες· Μεγάλη ἡ Ἄρτεμις Ἐφεσίων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/028.yaml
  text: When they heard this and became full of wrath[a], they were crying out, saying, “Great is Artemis of the Ephesians!”
translation:
  language: ig
  text: Mgbe ha nụrụ ihe a ma jupụta n’iwe[a], ha nọ na-eti mkpu, na-asị, “Artemis nke ndị Efesọs dị ukwuu!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “iwe juru ha nke ukwuu,” “ha jupụtara n’ọnụma,” ma ọ bụ “oke iwe were ha.” N’ụzọ nkịtị, okwu Grik ahụ sịrị na ha “ghọrọ ndị jupụtara na θυμός,” ya bụ iwe ma ọ bụ ọnụma siri ike.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀκούσαντες
  choice: Mgbe ha nụrụ ihe a
  rationale: Aorist participle na-egosi ọnọdụ mere tupu isi omume ahụ; ‘ihe a’ na-eme ka ihe a nụrụ, nke gbara ama n'okwu ndị bu ụzọ, doo anya n'Igbo.
- source_word: δὲ
  choice: wee
  rationale: N'ebe a, δέ bụ njikọ dị nro. ‘Wee’ na-ejikọta ihe ha nụrụ na iwe jupụtara ha n'ụzọ Igbo na-asụkarị.
- source_word: γενόμενοι πλήρεις θυμοῦ
  choice: iwe wee ju ha obi
  rationale: Nke a na-echekwa echiche nkịtị nke ịbụ ndị θυμός jupụtara, ma na-ada ka Igbo nkịtị ma dịkwa ike.
- source_word: ἔκραζον
  choice: ha nọ na-eti mkpu
  rationale: Ọdịdị imperfect na-egosi omume gara n'ihu ma ọ bụ e mere ugboro ugboro; ‘nọ na-eti mkpu’ na-egosipụta nke ahụ.
- source_word: λέγοντες
  choice: na-asị
  rationale: Ọ na-ewebata kpọmkwem ihe ha nọ na-eti mkpu.
- source_word: Μεγάλη ἡ Ἄρτεμις Ἐφεσίων
  choice: Artemis nke ndị Efesọs dị ukwuu!
  rationale: Ọ na-echekwa nkwupụta otuto nke ìgwè mmadụ ahụ na njikọ genitive nke Artemis na ndị Efesọs, n'usoro okwu Igbo doro anya.
- source_word: Ἄρτεμις
  choice: Artemis
  rationale: A hapụrụ aha chi nwanyị ahụ dị ka aha nke aka ya.
- source_word: Ἐφεσίων
  choice: ndị Efesọs
  rationale: Ọ bụ genitive plural na-ezo aka n'ụmụ amaala Efesọs, ọ bụghị naanị n'obodo ahụ.
theological_decisions:
- issue: Ikwupụta otuto e nyere chi arụsị n'emeghị ka nsụgharị ahụ kwado ya
  choice: “Artemis nke ndị Efesọs dị ukwuu!”
  alternative: “Artemis nke Efesọs dị ukwuu!”
  rationale: E debere okwu ahụ dịka mkpu kpọmkwem nke ìgwè mmadụ ahụ. ‘Nke ndị Efesọs’ na-esochi ụdị Greek nke na-ezo kpọmkwem n'ebe ndị ahụ nọ, na-enweghị itinye nkwenye onye nsụgharị.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. A họọrọ ‘iwe wee ju ha obi’ iji chekwaa ihe atụ nke njupụta dị n'okwu Grik, ebe ‘ha nọ na-eti mkpu’ na-egosipụta omume na-aga n'ihu.
