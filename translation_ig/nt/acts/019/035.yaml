revisions:
- from: Ma mgbe odeakwụkwọ obodo ahụ mere ka ìgwè mmadụ ahụ daa jụụ, ọ sịrị, “Ndị ikom Efesọs, ònye n’etiti ụmụ mmadụ na-amaghị na obodo ndị Efesọs bụ onye na-elekọta ụlọ nsọ nke Atemis ukwu[a] na ihe oyiyi ahụ si n’eluigwe daa[b]?”
  to: Ma mgbe odeakwụkwọ obodo ahụ mere ka ìgwè mmadụ ahụ daa jụụ, ọ sịrị, “Ndị ikom Efesọs, ònye n’etiti ụmụ mmadụ na-amaghị na obodo ndị Efesọs bụ onye na-elekọta ụlọ nsọ nke Atemis ukwu[a] na nke ihe ahụ e kwuru na o si n’eluigwe daa[b]?”
  rationale: The revision retains the likely cultic reference while avoiding making “image” an unqualified element of the Greek text. Adding “e kwuru na” makes clear that this is the city clerk’s reported cultic claim, without denying or expanding it. The revised note preserves the broader lexical sense and treats the image identification as contextual likelihood.
