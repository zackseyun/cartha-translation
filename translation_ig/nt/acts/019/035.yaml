id: ACT.19.35
reference: Acts 19:35
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καταστείλας δὲ ⸂ὁ γραμματεὺς τὸν ὄχλον⸃ φησίν· Ἄνδρες Ἐφέσιοι, τίς γάρ ἐστιν ⸀ἀνθρώπων ὃς οὐ γινώσκει τὴν Ἐφεσίων πόλιν νεωκόρον οὖσαν τῆς ⸀μεγάλης Ἀρτέμιδος καὶ τοῦ διοπετοῦς;
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/035.yaml
  text: But after the city clerk had quieted the crowd, he said, “Men of Ephesus, for what man is there who does not know that the city of the Ephesians is temple-keeper of the great Artemis and of the image fallen from heaven?”
translation:
  language: ig
  text: Ma mgbe odeakwụkwọ obodo ahụ mere ka ìgwè mmadụ ahụ daa jụụ, ọ sịrị, “Ndị ikom Efesọs, ònye n’etiti ụmụ mmadụ na-amaghị na obodo ndị Efesọs bụ onye na-elekọta ụlọ nsọ nke Atemis ukwu[a] na nke ihe ahụ e kwuru na o si n’eluigwe daa[b]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “onye nche ụlọ nsọ nke Atemis ukwu.” Okwu Grik ahụ na-akọwa obodo a nabatara dị ka onye na-elekọta ụlọ nsọ ma ọ bụ òtù ofufe.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ihe ahụ si n’eluigwe daa.” Okwu Grik ahụ na-ezo aka n’ihe e kwenyere na o si na mbara igwe daa; n’ebe a, o yikarịrị ka ọ na-ekwu maka ihe oyiyi ofufe e jikọtara na Atemis.
    reason: lexical_alternative
lexical_decisions:
- source_word: καταστείλας
  choice: mere ka ìgwè mmadụ ahụ daa jụụ
  rationale: Nke a na-egosi na o buru ụzọ mee ka ọgba aghara ahụ dajụọ tupu o kwuo okwu; okwu Igbo a bụ nke doro anya ma bụrụkwa nke e ji eme ihe taa.
- source_word: ὁ γραμματεὺς
  choice: odeakwụkwọ obodo
  rationale: N’ọnọdụ a, okwu ahụ na-ezo aka n’otu onyeisi ọchịchị obodo, ọ bụghị odeakwụkwọ okpukpe; ntụgharị a na-egosi ọrụ ọchịchị ya.
- source_word: τὸν ὄχλον
  choice: ìgwè mmadụ ahụ
  rationale: Nke a bụ ntụgharị Igbo kwụ ọtọ ma dị ndụ maka ìgwè mmadụ gbakọrọ n’ọgba aghara.
- source_word: Ἄνδρες Ἐφέσιοι
  choice: Ndị ikom Efesọs
  rationale: A hapụrụ ụdị ịkpọ ndị nwoke kpọmkwem dị na Grik kama ime ya ka ọ ghọọ okwu na-enweghị njirimara nwoke.
- source_word: τίς γάρ ἐστιν ἀνθρώπων ὃς οὐ γινώσκει
  choice: ònye n’etiti ụmụ mmadụ na-amaghị
  rationale: Nke a na-edobe ajụjụ nkwupụta nke Grik n’ụdị Igbo sitere n’okike, nke pụtara na onye ọ bụla maara ihe a.
- source_word: τὴν Ἐφεσίων πόλιν
  choice: obodo ndị Efesọs
  rationale: Nke a na-edobe njikọ genitiv nke Grik, ‘obodo nke ndị Efesọs,’ n’ụdị Igbo dị mfe nghọta.
- source_word: νεωκόρον
  choice: onye na-elekọta ụlọ nsọ
  rationale: Okwu ahụ bụ utu aha e ji akọwa obodo a nabatara dị ka onye nlekọta ụlọ nsọ ma ọ bụ ofufe; n’Igbo, iji ‘onye’ maka obodo bụ nnọchianya okwu a na-aghọta nke ọma.
- source_word: τῆς μεγάλης Ἀρτέμιδος
  choice: nke Atemis ukwu
  rationale: A sụgharịrị aha Ἄρτεμις dịka ‘Atemis’ ma debe aha nsọpụrụ ‘ukwu’ nke ndị Efesọs ji akpọ ya.
- source_word: τοῦ διοπετοῦς
  choice: ihe oyiyi ahụ si n’eluigwe daa
  rationale: διοπετές pụtara ihe e kwenyere na o si n’eluigwe daa. N’ọnọdụ a, o yikarịrị ka ọ bụ ihe oyiyi ofufe, ma ndetu ala na-echekwa ntụgharị sara mbara karị.
theological_decisions:
- issue: Okwu onye ọchịchị obodo banyere Atemis na ihe ahụ si n’eluigwe daa
  choice: 'E gosipụtara nkwupụta ahụ dịka okwu onye ahụ kwuru, n’enweghị ịkwado na ọ bụ eziokwu: ‘onye na-elekọta ụlọ nsọ nke Atemis ukwu na ihe oyiyi ahụ si n’eluigwe daa.’'
  alternative: ‘onye nche ụlọ nsọ nke Atemis ukwu na nke ihe ahụ si n’eluigwe daa’
  rationale: Amaokwu a na-akọ nkwenkwe na nganga okpukpe ndị ọgọ mmụọ, ọ bụghị nkwenye nke onye dere akwụkwọ. Nsụgharị ahụ kwesịrị ikwu nkwupụta ahụ nke ọma ma hapụ ndị na-agụ ya ka ha mata na ọ bụ okwu e hotara.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. ‘Odeakwụkwọ obodo’ na-egosi ọrụ ọchịchị, ebe ‘onye na-elekọta ụlọ nsọ’ na-eme ka utu aha obodo ahụ doo anya n’enweghị itinye nkọwa otu ụka.
