source:
  edition: SBLGNT
  text: τοῦτο δὲ ἐγένετο ἐπὶ ἔτη δύο, ὥστε πάντας τοὺς κατοικοῦντας τὴν Ἀσίαν ἀκοῦσαι τὸν λόγον τοῦ ⸀κυρίου, Ἰουδαίους τε καὶ Ἕλληνας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/010.yaml
  text: This continued for two years[a], so that all who lived in Asia heard the word of the Lord, both Jews and Greeks.
translation:
  language: ig
  text: Nke a gara n’ihu afọ abụọ, nke mere na ndị niile bi na Eshia[a] nụrụ okwu Onyenweanyị, ma ndị Juu ma ndị Grik.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ya bụ, ógbè ọchịchị Rom a na-akpọ Eshia, nke dị n’ebe ọdịda anyanwụ Eshia Nta; ọ bụghị kọntinent Eshia nke oge a.
    reason: cultural_note
lexical_decisions:
- source_word: τοῦτο δὲ ἐγένετο
  choice: Ihe a gara n’ihu
  rationale: N’ebe a, okwu ahụ na-ezo aka n’ọrụ izi ihe a kọwara n’amaokwu bu ya ụzọ, nke dịgidere ruo oge a kpọrọ aha. “Gara n’ihu” na-egosi ịdịgide ya nke ọma n’Igbo nkịtị.
- source_word: ἐπὶ ἔτη δύο
  choice: ruo afọ abụọ
  rationale: N’ebe a, ἐπί na-egosi ogologo oge ihe ahụ dịgidere. “Ruo afọ abụọ” bụ ụzọ doro anya ma dịkwa mma e si kwuo ya n’Igbo.
- source_word: ὥστε
  choice: nke mere na
  rationale: Nkebiokwu a na-egosi ihe si n’ọrụ ahụ pụta, dị ka ὥστε si eme n’asụsụ Grik.
- source_word: πάντας τοὺς κατοικοῦντας τὴν Ἀσίαν
  choice: ndị niile bi n’ógbè Eshia
  rationale: Nke a na-echekwa mkpokọta πάντας ma na-akọwa κατοικοῦντας n’Igbo dị mfe. E tinyere “ógbè” iji nyere onye na-agụ aka ịghọta na Eshia a bụ mpaghara ọchịchị Rom, ọ bụghị kọntinent Eshia nke oge a.
- source_word: ἀκοῦσαι
  choice: nụrụ
  rationale: Nke a bụ ntụgharị kpọmkwem nke ngwaa ahụ n’usoro okwu na-akọ ihe si n’ihe gara aga pụta.
- source_word: τὸν λόγον
  choice: okwu
  rationale: “Okwu” na-echekwa okwu Luk na-eji ugboro ugboro maka ozi a na-ekwusa, n’ebughị ụzọ kọwaa ya karịa ihe odide Grik kwuru.
- source_word: τοῦ κυρίου
  choice: Onyenwe anyị
  rationale: Nke a bụ okwu Igbo a na-ejikarị akọwa κύριος dị ka aha nsọpụrụ; njikọ ya na “okwu” na-enye “okwu Onyenwe anyị.”
- source_word: Ἰουδαίους τε καὶ Ἕλληνας
  choice: ma ndị Juu ma ndị Grik
  rationale: Usoro “ma… ma…” na-egosi nke ọma na e tinyere ìgwè abụọ ahụ ọnụ, dịka τε καὶ si mee.
theological_decisions:
- issue: Ihe “Eshia” pụtara
  choice: Eshia bụ ógbè ọchịchị Rom dị n’ebe ọdịda anyanwụ Eshia Nta.
  alternative: Kọntinent Eshia nke oge a.
  rationale: N’akwụkwọ Ọrụ Ndịozi, Ἀσία na-ezokarị aka n’ógbè ọchịchị Rom. E debere aha ahụ n’ahụ amaokwu ma kọwaa ya n’okpuru peeji iji zere nghọtahie nke oge a.
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, nke dị mfe ma nwee ugwu. A họọrọ usoro okwu na-agụ were were, ma e chekwara okwu Luk bụ “okwu Onyenwe anyị” na mkpokọta nke ndị Juu na ndị Grik.
