id: ACT.19.2
reference: Acts 19:2
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἶπέν ⸀τε πρὸς αὐτούς· Εἰ πνεῦμα ἅγιον ἐλάβετε πιστεύσαντες; οἱ ⸀δὲ πρὸς αὐτόν· Ἀλλ’ οὐδ’ εἰ πνεῦμα ἅγιον ἔστιν ἠκούσαμεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/002.yaml
  text: And he said to them[a], “Did you receive the Holy Spirit when you believed?” And they said to him, “No[b], we have not even heard that there is a Holy Spirit.”
translation:
  language: ig
  text: Ọ sịrị ha[a], “Ùnu natara Mmụọ Nsọ mgbe unu kwere?” Ha sịrị ya, “Mba[b], anyị anụbeghịdị na Mmụọ Nsọ dị.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Ùnu natara Mmụọ Nsọ mgbe unu kwerechara?” Participle Grik ahụ nwere ike inwe obere ọdịiche n’ihe banyere oge.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “anyị anụbeghịdị ma Mmụọ Nsọ ọ̀ dị”; ma ọ bụ, n’ụzọ nkọwa karịa, “anyị anụbeghịdị na e nyela Mmụọ Nsọ.”
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπέν τε πρὸς αὐτούς
  choice: Ọ sịrị ha
  rationale: A sụgharịrị λέγω n'ụzọ kwụ ọtọ dị ka ‘sịrị’; τε bụ njikọ dị nro na akụkọ gara aga, nke usoro ahịrịokwu Igbo nwere ike ibu n’enweghị ịgbakwunye okwu njikọ siri ike.
- source_word: Εἰ ... ἐλάβετε πιστεύσαντες
  choice: Ùnu natara ... mgbe unu kwere?
  rationale: ‘Mgbe unu kwere’ na-egosi njikọ oge dị n’etiti participle aorist πιστεύσαντες na ἐλάβετε, ma ọ naghị amanye nghọta na ọ bụ kpọmkwem mgbe ahụ ma ọ bụ mgbe e mesịrị.
- source_word: πνεῦμα ἅγιον
  choice: Mmụọ Nsọ
  rationale: N’ebe a okwu ahụ na-ezo aka n’ụzọ onwe onye nye Mmụọ Nsọ nke Chineke; ‘Mmụọ Nsọ’ bụ okwu Igbo doro anya ma bụrụkwa nke ndị mmadụ maara.
- source_word: οἱ δὲ πρὸς αὐτόν
  choice: Ha sịrị ya
  rationale: δέ bụ njikọ ma ọ bụ ntakịrị ọdịiche; Igbo nkịtị na-eburu mmegharị mkparịta ụka ahụ nke ọma n’enweghị ‘ma’ nke nwere ike ime ka ọdịiche ahụ sie ike karịa Grik.
- source_word: Ἀλλ’ οὐδ’
  choice: Mba, ... anụdịbeghị
  rationale: ‘Mba’ na-egosipụta nzaghachi ịjụ ajụjụ ahụ, ebe ‘-dị-’ na ‘anụdịbeghị’ na-eburu ike nke οὐδέ, ‘ọbụnadị ...ghị.’
- source_word: οὐδ’ εἰ πνεῦμα ἅγιον ἔστιν ἠκούσαμεν
  choice: anyị anụdịbeghị na Mmụọ Nsọ dị
  rationale: Nke a na-agbaso nghọta kpọmkwem nke οὐδὲ εἰ dị ka ‘anyị anụbeghịdị na ... dị,’ ma ghara ịgbakwunye echiche na a ‘nyela’ Mmụọ Nsọ, nke na-adịghị n’okwu Grik n’onwe ya.
theological_decisions:
- issue: Njikọ oge dị n’etiti ikwere na ịnata Mmụọ Nsọ
  choice: mgbe unu kwere
  alternative: mgbe unu kwerechara; n’oge unu kwere
  rationale: πιστεύσαντες nwere ike igosi oge ma ọ naghị ekpebi n’onwe ya ma nnata ahụ sochiri okwukwe n’oge ọzọ ma ọ bụ dabara n’otu oge ahụ. Isiokwu na nkọwa ala peeji na-echekwa mgbagwoju anya ahụ.
- issue: Ihe ndị na-eso ụzọ ahụ na-amaghị banyere Mmụọ Nsọ
  choice: anyị anụdịbeghị na Mmụọ Nsọ dị
  alternative: anyị anụdịbeghị ma Mmụọ Nsọ ọ̀ dị; anyị anụdịbeghị na e nyela Mmụọ Nsọ
  rationale: Okwu Grik ahụ dị nkenke, ọ pụkwara ịpụta na ha anụbeghịdị ‘na’ ma ọ bụ ‘ma’ Mmụọ Nsọ dị. Nsụgharị bụ isi na-agbaso nghọta kacha kwụ ọtọ; nkọwa ala peeji na-echekwa nhọrọ ndị ọzọ n’etinyeghị nkọwa ozizi n’ime amaokwu ahụ.
translation_notes:
  register: Standard Igbo, n’ụdị asụsụ dị ugbu a, dị ùgwù ma dị mfe nghọta. E jiri ụda ajụjụ ‘Ùnu’ na ‘ọ̀’ mee ka ajụjụ doo anya; a zere okwu ndị pụrụ ikpebi esemokwu ozizi banyere oge a na-anata Mmụọ Nsọ.
