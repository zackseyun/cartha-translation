    text: Ma ọ bụ, “Ùnu natara Mmụọ Nsọ mgbe unu kwerechara?” Participle Grik ahụ nwere ike inwe obere ọdịiche n’ihe banyere oge.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “anyị anụbeghịdị ma Mmụọ Nsọ ọ̀ dị”; ma ọ bụ, n’ụzọ nkọwa karịa, “anyị anụbeghịdị na e nyela Mmụọ Nsọ.”
    reason: alternative_reading
  revision_rationale: 'Only the position of the Igbo emphatic particle has been revised in the verse and its footnote alternatives: “anụbeghịdị” transparently expresses ‘not even heard,’ matching οὐδ’ more precisely. The temporal flexibility of πιστεύσαντες and the disputed nuance of οὐδὲ εἰ remain preserved.'
