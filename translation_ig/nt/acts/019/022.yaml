  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀποστείλας δὲ εἰς τὴν Μακεδονίαν δύο τῶν διακονούντων αὐτῷ, Τιμόθεον καὶ Ἔραστον, αὐτὸς ἐπέσχεν χρόνον εἰς τὴν Ἀσίαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/022.yaml
  text: So after sending into Macedonia two of those who were ministering to him—Timothy and Erastus—he himself stayed for a time in Asia[a].
translation:
  language: ig
  text: Mgbe o zigachara Timoti na Erastọs, mmadụ abụọ n’ime ndị na-ejere ya ozi, gaa Masedonia, ya onwe ya nọrọ nwa oge n’Eshia[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nke a bụ ógbè Eshia nke ndị Rom na-achị, nke dị n’ọdịda anyanwụ Eshia Nta; ọ bụghị kọntinent Eshia nke oge a.
    reason: cultural_note
lexical_decisions:
- source_word: ἀποστείλας
  choice: mgbe o zigachara
  rationale: Ngwaa a dị n’ụdị aorist participle ma na-egosi ihe mere tupu ngwaa bụ isi; “mgbe o zigachara” na-eme ka usoro ihe ndị ahụ doo anya n’Igbo.
- source_word: δὲ
  choice: Ya mere
  rationale: N’ebe a, δέ bụ njikọ dị nro nke na-aga n’ihu n’akụkọ ahụ, ọ bụghị nnukwu ntụnyere; “Ya mere” na-enye usoro okwu dị mma n’Igbo.
- source_word: εἰς τὴν Μακεδονίαν
  choice: gaa Masedonia
  rationale: εἰς na-egosi ebe a na-aga; n’Igbo, “gaa Masedonia” bụ ụzọ eke e si gosipụta njem ruo n’ógbè ahụ.
- source_word: δύο τῶν διακονούντων αὐτῷ
  choice: mmadụ abụọ n’ime ndị na-ejere ya ozi
  rationale: Nhọrọ a na-echekwa echiche nke ije ozi n’enweghị ime ka okwu ahụ bụrụ aha ọkwa pụrụ iche ma ọ bụ naanị “ndị enyemaka.”
- source_word: Τιμόθεον καὶ Ἔραστον
  choice: Timoti na Erastọs
  rationale: E dere aha ndị a n’ụdị a na-ejikarị eme ka aha Grik kwekọọ n’usoro ụda na odide Igbo.
- source_word: αὐτὸς
  choice: ya onwe ya
  rationale: Okwu nnọchiaha ahụ nwere nkwusi ike ma na-egosi ọdịiche dị n’etiti Pọl na mmadụ abụọ ahụ o zigara.
- source_word: ἐπέσχεν χρόνον
  choice: nọrọ nwa oge
  rationale: Nkebiokwu a pụtara ịnọgide n’otu ebe ruo oge ụfọdụ; “nọrọ nwa oge” bụ Igbo doro anya ma dị ugbu a.
- source_word: εἰς τὴν Ἀσίαν
  choice: n’Eshia
  rationale: Ọ bụ ezie na εἰς na-apụtakarị ebe a na-aga, ya na ἐπέσχεν χρόνον ọ na-arụ ọrụ n’echiche ebe mmadụ nọ. “Eshia” na-anọgide n’ahịrị isi, ebe nkọwa ala dị n’okpuru.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo zuruoke, nke oge a ma dị ùgwù. A họọrọ okwu ndị nkịtị ga-edo ndị na-agụ akwụkwọ anya, ebe e chekwara nkwusi ike nke “ya onwe ya” na usoro omume dị n’asụsụ Grik.
