id: ACT.19.17
reference: Acts 19:17
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τοῦτο δὲ ἐγένετο γνωστὸν πᾶσιν Ἰουδαίοις τε καὶ Ἕλλησιν τοῖς κατοικοῦσιν τὴν Ἔφεσον, καὶ ⸀ἐπέπεσεν φόβος ἐπὶ πάντας αὐτούς, καὶ ἐμεγαλύνετο τὸ ὄνομα τοῦ κυρίου Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/017.yaml
  text: And this became known to all the Jews and Greeks living in Ephesus[a], and fear fell upon them all[b], and the name of the Lord Jesus was being magnified.
translation:
  language: ig
  text: Ihe a wee ruo ndị Juu niile na ndị Grik niile bi n’Efesọs ntị. Egwu wee dakwasị ha niile,[a] a na-ebulikwa aha Onyenwe anyị Jizọs elu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “egwu bịakwasịrị ha niile.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “a na-enyekwa aha Onyenwe anyị Jizọs nnukwu nsọpụrụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο
  choice: Ihe a
  rationale: Nnọchiaha ngosi a na-arụtụ aka n’ihe mere tupu amaokwu a; “Ihe a” doro anya ma bụrụkwa Igbo nkịtị.
- source_word: ἐγένετο γνωστὸν
  choice: wee ruo ... ntị
  rationale: Akpaalaokwu Igbo a na-egosi na ihe ahụ ghọrọ ihe ndị mmadụ matara. Ọ na-ezere ntụgharị siri ike ma na-echekwa nghọta mmalite dị na ἐγένετο.
- source_word: πᾶσιν Ἰουδαίοις τε καὶ Ἕλλησιν
  choice: ndị Juu niile na ndị Grik niile
  rationale: E gosipụtara πᾶσιν n’otu abụọ ahụ n'ụzọ doro anya, ebe τε καὶ jikọtara ndị Juu na ndị Grik.
- source_word: τοῖς κατοικοῦσιν τὴν Ἔφεσον
  choice: bi n’Efesọs
  rationale: “Bi” bụ okwu Igbo dị mfe ma kwekọọ na κατοικέω, ya bụ ibi ma ọ bụ ịnọgide n’otu ebe.
- source_word: ἐπέπεσεν φόβος ἐπὶ πάντας αὐτούς
  choice: Egwu wee dakwasị ha niile
  rationale: “Dakwasị” na-echekwa onyonyo siri ike nke ἐπιπίπτω, ebe “egwu” na-ahapụ ohere ihe φόβος pụtara n’etinyeghị naanị ụjọ dị egwu ma ọ bụ nsọpụrụ.
- source_word: ἐμεγαλύνετο
  choice: a nọgidekwara na-ebuli ... elu
  rationale: Usoro a na-egosi omume na-aga n’ihu nke imperfect passive, ma chekwaa onyonyo nke ime ka ihe dị ukwuu ma ọ bụ bulie ya elu.
- source_word: τὸ ὄνομα
  choice: aha
  rationale: A hapụrụ “aha” dịka ederede Grik si kwuo, n’ihi na ọ nwere ike ịgụnye ugwu, ikike, na onye ahụ n’onwe ya karịa naanị “aha ọma.”
- source_word: τοῦ κυρίου Ἰησοῦ
  choice: Onyenwe anyị Jizọs
  rationale: “Onyenwe anyị” na-asụgharị κύριος dịka utu aha Kraịst, ebe usoro Igbo a bụ nke e ji eme ihe n'ụzọ dị ugwu ma doo anya.
theological_decisions:
- issue: Otú a ga-esi sụgharịa κύριος mgbe ọ na-arụtụ aka na Jizọs
  choice: Onyenwe anyị
  alternative: Nna Ukwu
  rationale: “Onyenwe anyị” na-echekwa κύριος dịka utu aha Kraịst ma ghara ibelata ya ka ọ bụrụ naanị onyeisi mmadụ.
- issue: Ma a ga-asụgharị τὸ ὄνομα dịka “aha” ka ọ bụ kọwaa ya dịka “aha ọma”
  choice: aha Onyenwe anyị Jizọs
  alternative: aha ọma Onyenwe anyị Jizọs
  rationale: “Aha” na-echekwa ibu okwu ahụ nwere n’Akwụkwọ Nsọ, gụnyere ugwu na ikike Jizọs, na-enweghị ime ka ihe ọ pụtara dị warara.
- issue: Udị egwu φόβος na-egosi
  choice: egwu
  alternative: oke nsọpụrụ
  rationale: Ọnọdụ ahụ nwere ike ịgụnye ụjọ na egwu jupụtara na nsọpụrụ. “Egwu” bụ nhọrọ sara mbara nke na-adịghị ekpebi otu akụkụ naanị.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe ma dị ugwu dee ya. Akpaalaokwu “ruo ... ntị” na-eme ka okwu ahụ bụrụ nke mmadụ nkịtị ga-aghọta, ebe “dakwasị” na “ebuli ... elu” na-echekwa onyonyo ndị dị n’asụsụ Grik. E debere akara nkọwa [a] na [b] n’ebe okwu nke ọ bụla ha na-akọwa dị.
