id: ACT.19.1
reference: Acts 19:1
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἐγένετο δὲ ἐν τῷ τὸν Ἀπολλῶ εἶναι ἐν Κορίνθῳ Παῦλον διελθόντα τὰ ἀνωτερικὰ μέρη ⸀ἐλθεῖν εἰς Ἔφεσον καὶ ⸀εὑρεῖν τινας μαθητάς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/001.yaml
  text: It happened that while Apollos was in Corinth[a], Paul passed through the inland regions and came to Ephesus and found some disciples[b],
translation:
  language: ig
  text: O mere na mgbe Apọlọs nọ na Kọrịnt, Pọl gafere ógbè ndị dị n'ime ime ala[a], rutere Efesọs, wee chọta ụfọdụ ndị na-eso ụzọ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “ógbè ndị dị n'elu” ma ọ bụ “ógbè ndị dị n'ime ala.” O yikarịrị ka okwu a na-ekwu maka ụzọ dị n'ime ime ala nke na-agafe ebe ndị dị elu, kama ụzọ dị n'akụkụ osimiri.
    reason: lexical_alternative
  - marker: b
    text: N'ebe a, a kọwaghị kpọmkwem onye ndị “na-eso ụzọ” a na-eso. Amaokwu ndị na-esote na-egosi na ha nwere njikọ na baptizim Jọn.
    reason: cross_reference
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: O mere na
  rationale: Nke a na-egosipụta usoro Luk ji akwaga akụkọ gaa n'ihu, n'Igbo dị mfe, n'etinyeghị okwu oge dịka “ugbu a” nke na-adịghị n'okwu Grik.
- source_word: ἐν τῷ τὸν Ἀπολλῶ εἶναι ἐν Κορίνθῳ
  choice: mgbe Apọlọs nọ na Kọrịnt
  rationale: Usoro infinitive a na-egosi na ihe abụọ na-eme n'otu oge; “mgbe ... nọ” bụ Igbo nkịtị ma doo anya.
- source_word: διελθόντα τὰ ἀνωτερικὰ μέρη
  choice: gafere ógbè ndị dị n'ime ime ala
  rationale: “Gafere” na-echekwa echiche nke ịga site n'ebe dị iche iche; “ime ime ala” na-egosi ụzọ dị n'ime obodo ma na-ahapụ nkọwa ọzọ nke “elu ugwu” n'ihe odide ala peeji.
- source_word: ἐλθεῖν εἰς Ἔφεσον
  choice: bịaruo Efesọs
  rationale: Nke a na-egosi njem Pọl ruo n'obodo Efesọs n'Igbo dị nkenke ma bụrụkwa nke okike.
- source_word: καὶ εὑρεῖν τινας μαθητάς
  choice: ma hụ ụfọdụ ndị na-eso ụzọ
  rationale: “Ụfọdụ” na-echekwa ọdịdị a na-akọwaghị nke τινας; “ndị na-eso ụzọ” bụ okwu zuru oke maka μαθητάς n'ekwughị onye ha na-eso tupu amaokwu ndị na-esote akọwaa ya.
theological_decisions:
- issue: Ndị μαθητάς bụ ndị na-eso ụzọ onye?
  choice: ụfọdụ ndị na-eso ụzọ
  alternative: ụfọdụ ndị na-eso ụzọ Jọn; ụfọdụ ndị na-eso ụzọ Jizọs
  rationale: Okwu Grik akọwaghị onye ha na-eso. Ya mere, isi ederede ekwesịghị ibu ụzọ kpebie ihe amaokwu 2–3 ga-eme ka o doo anya banyere njikọ ha na baptizim Jọn.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A debere usoro akụkọ Luk n'ụzọ dị mkpirikpi; a tinyere akara [a] n'akụkụ okwu ọ na-akọwa, ya bụ “ógbè ndị dị n'ime ime ala,” ma hapụ njirimara ndị na-eso ụzọ ahụ ka ọ ghara ịbụ nke a kpebiri tupu ọnọdụ gbara ya gburugburu akọwaa ya.
