revisions:
- from: O mere na mgbe Apọlọs nọ na Kọrịnt, Pọl gafere ógbè ndị dị n'ime ime ala[a], bịaruo Efesọs, ma hụ ụfọdụ ndị na-eso ụzọ[b].
  to: O mere na mgbe Apọlọs nọ na Kọrịnt, Pọl gafere ógbè ndị dị n'ime ime ala[a], rutere Efesọs, wee chọta ụfọdụ ndị na-eso ụzọ[b].
  rationale: The revision corrects the verbs for arrival and finding, removes a potentially adversative connector, and repairs the geographical alternative in footnote a. It preserves the source’s narrative sequence and leaves μαθητάς unspecified in the main text.
