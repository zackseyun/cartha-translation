  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta, mee ihe. A hapụrụ ọdịiche dị n’etiti ὄχλος na δῆμος, ma a kọwaghị mmegharị aka ahụ karịa ihe ederede Grik kwuru.
