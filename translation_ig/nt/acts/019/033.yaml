  text: ἐκ δὲ τοῦ ὄχλου ⸀συνεβίβασαν Ἀλέξανδρον προβαλόντων αὐτὸν τῶν Ἰουδαίων, ὁ δὲ Ἀλέξανδρος κατασείσας τὴν χεῖρα ἤθελεν ἀπολογεῖσθαι τῷ δήμῳ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/033.yaml
  text: And from the crowd they brought forward Alexander[a], since the Jews had pushed him forward; and Alexander, motioning with his hand[b], wanted to make a defense to the assembly.
translation:
  language: ig
  text: N’ime igwe mmadụ ahụ, ha kpọpụtara Aleksanda[a], ebe ndị Juu kpọpụtara ya n’ihu. Aleksanda fere aka ya, chọọ ịza ọnụ nye ọha mmadụ ahụ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Ha kpọpụtara Aleksanda ... mgbe ndị Juu kpọpụtara ya n’ihu.” N’asụsụ Grik, e ji ngwaa abụọ nwere echiche yiri ibe ha kọwaa iweta Aleksanda n’ihu ọha.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “nye ndị obodo.” Okwu Grik a na-ekwu maka ọha ndị obodo ma ọ bụ nzukọ ọha, ọ dịkwa iche n’okwu a sụgharịrị “igwe mmadụ” ná mmalite amaokwu a.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνεβίβασαν
  choice: kpọpụtara
  rationale: N’ọnọdụ a, okwu ahụ na-egosi ịkpọpụta Alegzanda site n’etiti igwe mmadụ ka ọ pụta n’ihu ọha, ọ bụghị ịkụziri ya ihe.
- source_word: προβαλόντων αὐτὸν τῶν Ἰουδαίων
  choice: ebe ndị Juu kpaliri ya gaa n’ihu
  rationale: Nke a na-egosi na ndị Juu mere ka ọ pụta n’ihu ọha, ma okwu Igbo a anaghị ekwu kpọmkwem na ha ji ike mee ya.
- source_word: κατασείσας τὴν χεῖρα
  choice: were aka ya mee ha ihe ịrịba ama
  rationale: Nke a na-edobe mmegharị aka ahụ n’ozuzu ya, n’agbanyeghị na o yikarịrị ka ebumnuche ya bụ ime ka ndị mmadụ gee ntị ma ọ bụ daa jụụ.
- source_word: ἤθελεν ἀπολογεῖσθαι
  choice: na-achọ ịgbachitere onwe ya
  rationale: Okwu a na-egosi ọchịchọ ma ọ bụ ebumnuche ime nkw دفاع n’ihu ọha, ọ bụghị na o mechara kwuo okwu ahụ.
- source_word: τῷ δήμῳ
  choice: n’ihu ọha mmadụ
  rationale: ‘Ọha mmadụ’ na-egosipụta ìgwè ndị obodo gbakọtara n’ihu ọha ma na-ekewapụ ya n’‘igwe mmadụ’ nke e ji sụgharịa ὄχλος.
- source_word: ὄχλου
  choice: igwe mmadụ
  rationale: Nke a bụ okwu Igbo doro anya maka ìgwè mmadụ buru ibu ma bụrụkwa nke dị iche na δῆμος e mesịrị.
- source_word: Ἀλέξανδρον / Ἀλέξανδρος
  choice: Alegzanda
  rationale: A sụgharịrị aha ahụ n’usoro mkpọpụta na odide aha ndị mmadụ nke Igbo.
