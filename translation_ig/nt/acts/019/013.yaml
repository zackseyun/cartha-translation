revisions:
- from: Ma ụfọdụ n’ime ndị Juu na-achụpụ mmụọ ọjọọ, bú ndị na-ejegharị site n’otu ebe ruo n’ebe ọzọ, nwara ịkpọku aha Onyenwe anyị Jizọs n’ahụ́ ndị nwere mmụọ ọjọọ[a], na-asị, “Ana m eji Jizọs ahụ Pọl na-ekwusa enye unu iwu siri ike[b].”
  to: Ma ọbụna ụfọdụ n’ime ndị Juu na-achụpụ mmụọ ọjọọ, bụ ndị na-agagharị, nwara ịkpọku aha Onyenwe anyị Jizọs n’ahụ ndị nwere mmụọ ọjọọ[a], na-asị, “Ana m eji Jizọs ahụ Pọl na-ekwusa enye unu iwu[b].”
  rationale: The revision removes the unsupported intensifier “siri ike” while maintaining the formal exorcistic adjuration expressed by ὁρκίζω. It also replaces the footnote’s misleading “iwu dị nsọ” with alternatives that preserve the oath-bound or solemn-charge sense. The remaining phrasing is retained because it faithfully and naturally represents the Greek without doctrinal overstatement.
  reviewer_model: gpt-5.6-terra
