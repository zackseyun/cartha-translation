id: ACT.19.13
reference: Acts 19:13
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐπεχείρησαν δέ τινες ⸀καὶ τῶν περιερχομένων Ἰουδαίων ἐξορκιστῶν ὀνομάζειν ἐπὶ τοὺς ἔχοντας τὰ πνεύματα τὰ πονηρὰ τὸ ὄνομα τοῦ κυρίου Ἰησοῦ λέγοντες· ⸀Ὁρκίζω ὑμᾶς τὸν Ἰησοῦν ⸀ὃν Παῦλος κηρύσσει.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/013.yaml
  text: But some also of the itinerant Jewish exorcists attempted to invoke the name of the Lord Jesus over those who had evil spirits[a], saying, “I adjure you by Jesus[d][c][b], whom Paul proclaims.”
translation:
  language: ig
  text: Ma ọbụna ụfọdụ n’ime ndị Juu na-achụpụ mmụọ ọjọọ, bụ ndị na-agagharị, nwara ịkpọku aha Onyenwe anyị Jizọs n’ahụ ndị nwere mmụọ ọjọọ[a], na-asị, “Ana m eji Jizọs ahụ Pọl na-ekwusa enye unu iwu[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’ụzọ nkịtị, “ndị nwere mmụọ ọjọọ”; ya bụ, ndị nọ n’okpuru mmetụta mmụọ ọjọọ.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, “Ana m eji Jizọs ahụ Pọl na-ekwusa agba unu iyi,” ma ọ bụ, “Ana m eji Jizọs ahụ Pọl na-ekwusa enye unu iwu n’iyi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεχείρησαν
  choice: nwara
  rationale: Okwu a na-egosi na ha nwara ime ihe ahụ, ma ọ naghị ekwu na mbọ ha gara nke ọma.
- source_word: τινες καὶ τῶν περιερχομένων Ἰουδαίων ἐξορκιστῶν
  choice: ụfọdụ n’ime ndị Juu na-achụpụ mmụọ ọjọọ, bú ndị na-ejegharị site n’otu ebe ruo n’ebe ọzọ
  rationale: Nke a na-egosipụta τινες dị ka “ụfọdụ,” καὶ dị ka mgbakwunye n’akụkọ ahụ, na περιερχομένων dị ka ịgagharị n’ebe dị iche iche; nkọwa ọrụ ha doro ndị na-agụ Igbo anya karịa otu aha nka siri ike.
- source_word: ὀνομάζειν ἐπὶ ... τὸ ὄνομα
  choice: ịkpọku aha ... n’ahụ́
  rationale: N’ọnọdụ a, ọ bụghị nanị ịkpọ aha ka e bu n’obi, kama ọ bụ iji aha ahụ mee usoro ịchụpụ mmụọ; “ịkpọku aha” na-edobe echiche a n’Igbo nkịtị.
- source_word: τοὺς ἔχοντας τὰ πνεύματα τὰ πονηρά
  choice: ndị nwere mmụọ ọjọọ
  rationale: Nke a na-esochi okwu Grik ahụ nke ọma ma zere ime ka “ndị mmụọ ọjọọ ji” bụrụ ihe doro anya karịa ka isi mmalite siri kwuo.
- source_word: τὸ ὄνομα τοῦ κυρίου Ἰησοῦ
  choice: aha Onyenwe anyị Jizọs
  rationale: “Onyenwe anyị” bụ ụzọ Igbo a na-anabata nke ọma isi sụgharị κύριος n’aha nsọpụrụ a, ma na-echekwa ịdị arọ nke utu aha ahụ.
- source_word: Ὁρκίζω ὑμᾶς τὸν Ἰησοῦν
  choice: Ana m eji Jizọs ... enye unu iwu siri ike
  rationale: ὁρκίζω bụ inye iwu ma ọ bụ ịdọ aka ná ntị n’ụzọ e ji onye ọzọ gbaa iyi. Nsụgharị a na-eme ka usoro okwu ahụ bụrụ Igbo a ghọtara nke ọma ma na-echekwa ụda iwu dị arọ.
- source_word: ὃν Παῦλος κηρύσσει
  choice: ahụ Pọl na-ekwusa
  rationale: κηρύσσει pụtara ikwusa ozi n’ihu ọha; “na-ekwusa” na-ejide echiche ahụ n’enweghị ime ka ọ bụrụ nanị nkwusa n’ụlọ ụka.
theological_decisions:
- issue: Otu e si sụgharị κύριος n’okwu τοῦ κυρίου Ἰησοῦ
  choice: Onyenwe anyị
  alternative: Nna ukwu
  rationale: N’ebe a κύριος bụ utu aha Jizọs nwere ma nsọpụrụ ma ịdị arọ n’okwukwe; “Onyenwe anyị” bụ okwu Igbo kwesịrị ekwesị ma ghara ibubata nkọwa otu ụka.
- issue: Ma a ga-ekwu kpọmkwem na mmụọ ọjọọ ji ndị ahụ
  choice: ndị nwere mmụọ ọjọọ
  alternative: ndị mmụọ ọjọọ ji
  rationale: Grik kwuru n’ụzọ nkịtị “ndị nwere mmụọ ọjọọ.” Nhọrọ a na-echekwa oke ihe isi mmalite kwuru, kama ikwusi ọnọdụ njide mmụọ ike karịa ya.
- issue: Ihe ὁρκίζω pụtara n’usoro ịchụpụ mmụọ
  choice: iji Jizọs enye iwu siri ike
  alternative: iji Jizọs gbaa unu iyi
  rationale: Okwu ahụ nwere echiche nke ịmanye site n’iyi ma ọ bụ inye iwu dị nsọ. N’Igbo, “iji ... enye iwu siri ike” na-egosi ihe a na-eme n’enweghị echiche na ndị mmụọ ahụ onwe ha na-aṅụ iyi.
translation_notes:
  register: Ejiri Igbo Standard nke oge a, nke dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-edobe ọdịdị akụkọ na ụda usoro ịchụpụ mmụọ, ma zere okwu nka a na-apụghị ịghọta ngwa ngwa na nkọwa siri ike karịa Grik.
