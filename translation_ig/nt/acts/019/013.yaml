review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the itinerant Jewish exorcists, their attempt, the invocation of the Lord Jesus’ name over people described literally as having evil spirits, and Paul’s proclamation. However, “enye unu iwu siri ike” adds ‘strict’/‘severe,’ which is not expressed by ὁρκίζω. A formulation with ‘eji ... enye unu iwu’ preserves the adjurational force without that addition.
  naturalness: The revised wording uses clear, contemporary Standard Igbo. “Ndị na-agagharị” naturally conveys itinerancy, and the direct-speech formula is idiomatic while retaining its formal tone.
  terminology: “Onyenwe anyị Jizọs,” “mmụọ ọjọọ,” and “na-ekwusa” are appropriate and consistent with the Greek. The description “ndị nwere mmụọ ọjọọ” retains the source’s wording without strengthening it to an explicit claim of possession.
  issues:
  - severity: medium
    issue: The main text renders ὁρκίζω as “enye unu iwu siri ike.”
    rationale: The adjective “siri ike” adds a degree of strictness not present in the Greek. Ὁρκίζω denotes an adjuration or solemn charge made by Jesus’ name; “eji ... enye unu iwu” communicates this without importing the added qualifier.
  - severity: low
    issue: The footnote’s alternative “enye unu iwu dị nsọ” is not a suitable gloss.
    rationale: The Greek concerns an oath-bound or solemn adjuration, not an instruction characterized as ‘holy.’ The footnote should offer alternatives that reflect oath/solemn-charge language.
  revised_text: Ma ọbụna ụfọdụ n’ime ndị Juu na-achụpụ mmụọ ọjọọ, bụ ndị na-agagharị, nwara ịkpọku aha Onyenwe anyị Jizọs n’ahụ ndị nwere mmụọ ọjọọ[a], na-asị, “Ana m eji Jizọs ahụ Pọl na-ekwusa enye unu iwu[b].”
  revised_footnotes:
