  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἰ δέ τι ⸀περαιτέρω ἐπιζητεῖτε, ἐν τῇ ἐννόμῳ ἐκκλησίᾳ ἐπιλυθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/039.yaml
  text: But if you seek anything further[a], it will be settled in the lawful assembly.
translation:
  language: ig
  text: Ma ọ bụrụ na unu na-achọ ihe ọzọ[a], a ga-edozi ya n’ọgbakọ e hiwere n’ụzọ iwu kwadoro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “n’ọgbakọ iwu kwadoro” ma ọ bụ “n’ọgbakọ a na-enwe dịka usoro si dị.” Okwu Grik a na-ezo aka n’ọgbakọ obodo e hiwere dịka iwu si dị, ọ bụghị ụka.
    reason: lexical_alternative
lexical_decisions:
- source_word: περαιτέρω
  choice: ọzọ
  rationale: Ọ na-egosi ihe gbakwunyere n’ihe a na-ekwu ugbu a; ‘ihe ọzọ’ bụ ụzọ Igbo si ekwu ya n'ụzọ doro anya ma dịkwa mfe.
- source_word: ἐπιζητεῖτε
  choice: unu na-achọ
  rationale: Ngwaa a nwere ike ịpụta ịchọ ma ọ bụ ịgbaso otu okwu. N'ọnọdụ iwu obodo a, ‘na-achọ’ na-edobe obosara ihe ọ pụtara n'emeghị ka ọ bụrụ okwu ikpe pụrụ iche.
- source_word: ἐννόμῳ
  choice: e hiwere n’ụzọ iwu kwadoro
  rationale: Ọ na-egosi ihe kwekọrọ n'iwu. N'ịkọwa ọgbakọ obodo, okwu a na-eme ka o doo anya na ọ bụ nzukọ a kpọrọ ma guzobe dịka iwu si dị.
- source_word: ἐκκλησίᾳ
  choice: ọgbakọ
  rationale: N'ebe a okwu ahụ na-ezo aka n'ọgbakọ obodo Efesọs, ọ bụghị nzukọ ndị Kraịst. ‘Ọgbakọ’ na-ejide echiche nke ndị gbakọtara n'ebubataghị echiche ụka.
- source_word: ἐπιλυθήσεται
  choice: a ga-edozi ya
  rationale: Ọdịdị ọdịnihu nke nnara-omume na-egosi na a ga-eme ka okwu ahụ nweta ngwọta. ‘A ga-edozi ya’ bụ Igbo nkịtị dabara n'okwu esemokwu ma ọ bụ usoro obodo.
- source_word: τι
  choice: ihe
  rationale: N'ahịrịokwu ọnọdụ a, ‘ihe’ jikọtara na ‘ọzọ’ na-enye echiche nke okwu ọ bụla ọzọ a pụrụ ịchọ ka e lebara anya.
theological_decisions:
- issue: Nsụgharị ἐκκλησία n'ọnọdụ ọgbakọ obodo na-abụghị nke Ndị Kraịst
  choice: ọgbakọ
  alternative: ụka; nzukọ
  rationale: Ihe gbara amaokwu a gburugburu na-egosi na odeakwụkwọ obodo na-ekwu maka ọgbakọ obodo e guzobere dịka iwu si dị, ọ bụghị ndị Kraịst. Ya mere, ‘ọgbakọ’ na-ezere ịkpata nghọtahie nke ụka ma na-edobe isi echiche nke otu ndị kpọkọtara ọnụ.
translation_notes:
  register: Igbo ọkọlọtọ, nke oge a ma dị ùgwù. E ji ‘ọgbakọ’ mee ihe ka a ghara ịghọta ἐκκλησία dịka ụka; nkebi ‘e hiwere n’ụzọ iwu kwadoro’ na-akọwa ọnọdụ iwu nke ọgbakọ ahụ n'ụzọ ndị na-agụ Igbo ga-aghọta ngwa ngwa.
