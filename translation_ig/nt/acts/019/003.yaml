id: ACT.19.3
reference: Acts 19:3
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἶπέν ⸀τε· Εἰς τί οὖν ἐβαπτίσθητε; οἱ δὲ εἶπαν· Εἰς τὸ Ἰωάννου βάπτισμα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/003.yaml
  text: And he said[a], “Into what then were you baptized?” And they said, “Into John's baptism.”
translation:
  language: ig
  text: O wee sị, “N’ime gịnịzi ka e mere unu baptizim?” Ha sịrị, “N’ime baptizim nke Jọn.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶπέν τε
  choice: O wee sị
  rationale: “Sị” na-asụgharị λέγω n’ụzọ kwụ ọtọ; “wee” na-egosi njikọ dị nro nke τε na ihe e kwuru tupu nke a, n’asụsụ Igbo na-aga were were.
- source_word: Εἰς τί
  choice: N’ime gịnị
  rationale: “N’ime” na-echekwa echiche nke εἰς na njikọ ya na azịza ahụ, kama ịgbanwe ajụjụ ahụ ka ọ bụrụ naanị ajụjụ banyere ụdị ma ọ bụ nzube baptizim.
- source_word: οὖν
  choice: -zi
  rationale: Mgbakwunye “-zi” dị n’okwu “gịnịzi” na-egosi nzọụkwụ nke nkwubi okwu ma ọ bụ ihe sochiri ihe Pọl nụrụ, n’ụzọ dị ndụ n’Igbo.
- source_word: ἐβαπτίσθητε
  choice: e mere unu baptizim
  rationale: Nke a na-echekwa olu nnara nke ngwaa Grik ahụ ma jiri okwu a maara nke ọma maka emume baptizim.
- source_word: Εἰς τὸ Ἰωάννου βάπτισμα
  choice: N’ime baptizim Jọn
  rationale: E megharịrị “n’ime” dịka e mere n’ajụjụ ahụ iji chekwaa nhazi okwu na myirịta nke Grik; “baptizim Jọn” na-egosi na baptizim ahụ bụ nke metụtara Jọn.
- source_word: βάπτισμα
  choice: baptizim
  rationale: “Baptizim” bụ okwu Igbo a na-ejikarị eme ihe nke na-akpọ emume ahụ aha n’enweghị ịkọwa ya n’ụzọ ga-etinye echiche okpukpe ọzọ n’ime ederede.
theological_decisions:
- issue: Ma a ga-echekwa εἰς ugboro abụọ n’ajụjụ na n’azịza
  choice: Jiri “n’ime” n’ebe abụọ ahụ
  alternative: “Ọ bụ baptizim dị aṅaa ka e mere unu?” / “Baptizim Jọn.”
  rationale: Ikwughachi “n’ime” na-echekwa myirịta na nghọta nke okwu Grik—“N’ime gịnị...?” / “N’ime baptizim Jọn”—n’enweghị itinye nkọwa otu ụka banyere ihe baptizim pụtara.
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. A hapụrụ ntakịrị ịdị iche nke okwu “n’ime baptizim” iji chekwaa okwu εἰς na myirịta ajụjụ na azịza dị n’asụsụ Grik.
