  text: ἀποκριθὲν δὲ τὸ πνεῦμα τὸ πονηρὸν εἶπεν ⸀αὐτοῖς· ⸀Τὸν Ἰησοῦν γινώσκω καὶ τὸν Παῦλον ἐπίσταμαι, ὑμεῖς δὲ τίνες ἐστέ;
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/015.yaml
  text: But the evil spirit answered them[a], “Jesus I know, and Paul I recognize—but who are you?”
translation:
  language: ig
  text: Ma mmụọ ọjọọ ahụ zara ha[a] sị, “Amaara m Jizọs, amakwaara m Pọl; ma ndịe ka unu bụ?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ịtụgharị ya, “Amaara m Jizọs, amakwaara m banyere Pọl.” Grik ji ngwaa abụọ dị iche iche mee ihe: γινώσκω (“ịma”) na ἐπίσταμαι (“ịma banyere” ma ọ bụ “ịmata”). Nke a pụrụ igosi ọdịiche nta n’ihe ha pụtara.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθὲν δὲ ... εἶπεν αὐτοῖς
  choice: Ma ... zara ha sị
  rationale: Njikọ a bụ ụzọ Grik si webata nzaghachi. ‘Zara ha sị’ bụ Igbo nkịtị nke na-edobe echiche nke ịza okwu, ebe ‘Ma’ na-egosi ntụgharị megidere ihe ndị ahụ gbalịrị ime.
- source_word: τὸ πνεῦμα τὸ πονηρόν
  choice: mmụọ ọjọọ ahụ
  rationale: Nke a na-egosi mmụọ dị ndụ nke bụ ajọ onye; ‘mmụọ ọjọọ’ bụ okwu Igbo doro anya ma bụrụkwa nke a na-ejikarị eme ihe.
- source_word: Τὸν Ἰησοῦν γινώσκω
  choice: Amaara m Jizọs
  rationale: γινώσκω pụtara ịma ma ọ bụ ịmata onye. Itinye ‘Jizọs’ n'ihu akụkụ okwu ahụ n'asụsụ Grik na-enye ya ike; nhazi Igbo a ka na-eme ka aha ahụ bụrụ isi ihe a na-ekwu maka ya.
- source_word: τὸν Παῦλον ἐπίσταμαι
  choice: marakwa m onye Pọl bụ
  rationale: ἐπίσταμαι dị iche na γινώσκω. ‘Marakwa m onye Pọl bụ’ na-echekwa ọdịiche ahụ n'Igbo n'ebughị ụzọ kwuo ihe karịrị ihe Grik kwuru.
- source_word: ὑμεῖς δὲ τίνες ἐστέ
  choice: ma unu onwe unu bụ ndị?
  rationale: ‘Unu’ na-egosi ọtụtụ mmadụ, ‘onwe unu’ na-echekwa nkwusi ike dị na ὑμεῖς, ebe ‘ma’ na-egosi ọdịiche dị n'etiti ha na Jizọs na Pọl.
theological_decisions:
- issue: Ọdịiche dị n'etiti γινώσκω na ἐπίσταμαι n'okwu mmụọ ọjọọ ahụ
  choice: “Amaara m Jizọs, marakwa m onye Pọl bụ”
  alternative: “Amaara m Jizọs, amakwaara m banyere Pọl” ma ọ bụ “Amaara m Jizọs, amakwaara m Pọl”
  rationale: Okwu Grik ahụ ji ngwaa abụọ dị iche iche mee ihe, ikekwe maka mmetụta okwu. Nsụgharị a na-egosi ọdịiche ahụ ma ọ naghị ekpebi ma mmụọ ahụ maara otu onye karịa onye ọzọ n'ụzọ nkà mmụta okpukpe.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe ma nwee ugwu mee ihe. ‘Unu onwe unu’ na-eme ka nkwusi ike nke okwu Grik pụta ìhè, ebe akara [a] dị n'akụkụ isiokwu ọ na-akọwa.
