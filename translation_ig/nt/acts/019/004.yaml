review_pass:
  verdict: revise
  source_fidelity: A ga-ewepụ “ndị mmadụ” dị ka ihe Jọn baptiziri. N’asụsụ Grik, τῷ λαῷ so na λέγων (“na-agwa ndị mmadụ”), ọ bụghị ihe e depụtara kpọmkwem dịka onye e mere baptizim. Nsụgharị e degharịrị na-echekwa baptizim nke nchegharị na oku a kpọrọ ka ha kwere n’Onye na-abịa n’azụ Jọn.
  naturalness: “Jọn ji baptizim nke nchegharị mee baptizim” na-adị ntakịrị ugboro ugboro, ma ọ bụ nkwughachi a ma ama n’ihi njikọ ngwaa na aha dị na Grik; ọ na-ada nke ọma n’Igbo nke oge a. “Na-agwa ndị mmadụ” na-etinye onye ozi Jọn kpọrọ n’ebe kwesịrị ekwesị.
  terminology: “Nchegharị,” “baptizim,” “kwere na,” “Pọl,” “Jọn,” na “Jizọs” dabara n’Igbo Izugbe ma na-echekwa aha na okwu ndị bụ isi. “Ya bụ” na-akọwa, kama ọ naghị atụkwasị aha Kraịst/Mesaya nke na-adịghị na Grik.
  issues:
  - severity: medium
    issue: “ndị mmadụ” ka etinyere dịka ihe e mere baptizim n’ahịrịokwu bụ isi.
    rationale: 'τῷ λαῷ na-adabere na λέγων: Pọl kwuru na Jọn baptiziri baptizim nke nchegharị, na-agwa ndị mmadụ ka ha kwere. Ihe odide ahụ ekwughị kpọmkwem n’amaokwu a na ọ bụ “ndị mmadụ” ka Jọn mere baptizim.'
  - severity: low
    issue: Ihe odide ala ala a chọrọ ịkọwa usoro Grik nso karị, ma “Jọn mere baptizim nke nchegharị” anaghị egosipụta nkwughachi cognate ἐβάπτισεν βάπτισμα.
    rationale: A ga-eji “Jọn baptiziri baptizim nke nchegharị” mee ka nhọrọ ọzọ ahụ gosipụta njikọ ngwaa na aha nke Grik n’enweghị ịgbanwe ihe pụtara.
