source:
  edition: SBLGNT
  text: εἶπεν δὲ Παῦλος· ⸀Ἰωάννης ἐβάπτισεν βάπτισμα μετανοίας, τῷ λαῷ λέγων εἰς τὸν ἐρχόμενον μετ’ αὐτὸν ἵνα πιστεύσωσιν, τοῦτ’ ἔστιν εἰς ⸀τὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/004.yaml
  text: And Paul said[a], “John baptized with a baptism of repentance, telling the people to believe in the one coming after him—that is, in Jesus.”
translation:
  language: ig
  text: Pọl wee sị, “Jọn ji baptizim nke nchegharị mee baptizim, na-agwa ndị mmadụ ka ha kwere na onye ahụ na-abịa n’azụ ya, ya bụ, na Jizọs.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐβάπτισεν βάπτισμα μετανοίας
  choice: ji baptizim nke nchegharị mee ndị mmadụ baptizim
  rationale: Nke a na-echekwa njikọ dị n’etiti ngwaa na aha ‘baptizim,’ ma jiri usoro okwu Igbo dị mfe nghọta gosi na baptizim ahụ bụ nke metụtara nchegharị.
- source_word: τῷ λαῷ
  choice: ndị mmadụ
  rationale: Ọ bụ aha mkpokọta maka ndị Jọn na-agwa okwu; a gbakwụnyeghị ‘ndị Izrel’ n’ihi na okwu Grik ahụ ekwughị ya kpọmkwem n’ebe a.
- source_word: λέγων
  choice: na-agwa ha
  rationale: Ọ na-egosi ozi Jọn nọ na-ezi n’otu oge ahụ ọ na-eme baptizim, ma mee ka njikọ ya na ‘ka ha kwere’ bụrụ nke sitere n’okike n’Igbo.
- source_word: εἰς τὸν ἐρχόμενον μετ’ αὐτὸν
  choice: na onye ahụ na-abịa n’azụ ya
  rationale: ‘Kwere na’ na-egosi onye okwukwe ahụ lekwasịrị anya, ebe ‘na-abịa n’azụ ya’ na-echekwa echiche nke onye ga-esochi Jọn.
- source_word: ἵνα πιστεύσωσιν
  choice: ka ha kwere
  rationale: Usoro a na-egosi ihe Jọn gwara ndị mmadụ ka ha mee, na-enweghị ikpebi n’ụzọ gabigara ihe odide ahụ ma ọ bụ nzube ma ọ bụ ọdịnaya ka ukwuu.
- source_word: τοῦτ’ ἔστιν
  choice: ya bụ
  rationale: Nke a bụ usoro Igbo nkịtị e ji kọwaa onye a kpọrọ ‘onye ahụ na-abịa n’azụ ya.’
- source_word: εἰς τὸν Ἰησοῦν
  choice: na Jizọs
  rationale: Ngwaa ‘kwere’ ka a ghọtara site n’ahịrịokwu gara aga; a kpọrọ naanị aha Jizọs dịka Grik si dị, n’etinyeghị ‘Kraịst’ ma ọ bụ ‘Mesaya.’
theological_decisions:
- issue: Mmekọrịta dị n’etiti baptizim Jọn na okwukwe na Jizọs
  choice: E gosiri baptizim Jọn dịka baptizim nke nchegharị, ya na ozi ọ na-ezi ka ndị mmadụ kwere na onye na-abịa n’azụ ya, onye a kọwara dịka Jizọs.
  alternative: Ịsị na baptizim Jọn n’onwe ya mere ka okwukwe Ndị Kraịst pụta, ma ọ bụ ịhapụ onye na-abịa n’azụ ya n’amaghị onye ọ bụ.
  rationale: Nhazi okwu Grik kewara ime baptizim Jọn na ozi o ji ya na-ezi, ma okwu ‘ya bụ, na Jizọs’ kọwara onye ahụ na-abịa n’azụ ya kpọmkwem. Nsụgharị ahụ anaghị etinye ozizi ọzọ ihe odide ahụ na-ekwughị.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. ‘Pọl,’ ‘Jọn,’ na ‘Jizọs’ bụ ụdị aha ndị a na-ejikarị eme ihe n’Igbo. A hapụrụ nkwughachi okwu ‘baptizim’ iji gosipụta njikọ okwu dị na Grik, ma jiri ‘ji … mee’ mee ka ọ daa nke ọma n’Igbo.
