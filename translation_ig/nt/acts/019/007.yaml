lexical_decisions:
- source_word: ἦσαν
  choice: bụ
  rationale: N'okwu a, ngwaa ahụ na-egosi ọnụ ọgụgụ ndị nọ n'ìgwè ahụ; ‘bụ’ bụ ụzọ dị mfe ma bụrụkwa nke Igbo nkịtị si ekwu ya.
- source_word: δὲ
  choice: —
  rationale: δὲ bụ njikọ dị nro nke na-adịghị egosi nnukwu mmegide n'ebe a; ịhapụ ya na-eme ka Igbo dị larịị n'enweghị mfu ihe ọ pụtara.
- source_word: οἱ πάντες
  choice: Ha niile
  rationale: Nke a na-achịkọta ìgwè ahụ dum, ya mere ‘Ha niile’ na-echekwa ike nchịkọta nke okwu Grik.
- source_word: ἄνδρες
  choice: ndị ikom
  rationale: ἀνήρ na-ezo kpọmkwem aka n'ụmụ nwoke, ọ bụghị mmadụ niile n'ozuzu; ‘ndị ikom’ na-echekwa nkọwa okike ahụ.
- source_word: ὡσεὶ
  choice: ihe dị ka
  rationale: Okwu a na-egosi na ọnụ ọgụgụ ahụ bụ nke a tụrụ nso, ọ bụghị ọnụ ọgụgụ e kwuru n'ụzọ siri ike.
- source_word: δώδεκα
  choice: iri na abụọ
  rationale: Nke a bụ ntụgharị nkịtị na kpọmkwem nke nọmba ahụ n'Igbo.
