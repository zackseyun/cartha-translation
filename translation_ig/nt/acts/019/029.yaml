  text: καὶ ἐπλήσθη ἡ ⸀πόλις τῆς συγχύσεως, ὥρμησάν τε ὁμοθυμαδὸν εἰς τὸ θέατρον συναρπάσαντες Γάϊον καὶ Ἀρίσταρχον Μακεδόνας, συνεκδήμους Παύλου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/029.yaml
  text: And the city was filled with confusion[a], and they rushed together into the theater, dragging along Gaius and Aristarchus, Macedonians who were Paul’s traveling companions.
translation:
  language: ig
  text: Obodo ahụ jupụtara n’ọgbaaghara[a], ha wee jiri otu obi gbaba n’ụlọ ihe nkiri ahụ, mgbe ha jidesịrị Gayọs na Aristakọs n’ike, dọkpụrọ ha; ndị Masedonia, ndị so Pọl eme njem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “mgbagwoju anya” ma ọ bụ “ọgba aghara.” Okwu Grik ahụ nwere ike ịpụta ọnọdụ ọgbaaghara, mkpọtụ, na enweghị usoro.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπλήσθη ἡ πόλις τῆς συγχύσεως
  choice: Ọgbaaghara wee juputa n’obodo ahụ
  rationale: Nke a na-egosipụta na ọgbaaghara jupụtara n’obodo ahụ, na-enweghị ịkọ onye kpatara ya; usoro Igbo a dịkwa eke ma doo anya.
- source_word: ὥρμησάν
  choice: wee ... gbaba
  rationale: “Gbaba” na-egosi ngagharị mberede na nke siri ike gaa n’ime ebe ahụ.
- source_word: ὁμοθυμαδόν
  choice: ha niile ... jiri otu mmụọ
  rationale: N’ọnọdụ ọgbaaghara a, okwu ahụ na-egosi na ìgwè mmadụ ahụ mere otu ihe n’otu nzube, ọ bụghị ịdị n’udo ma ọ bụ nkwekọrịta ime mmụọ.
- source_word: θέατρον
  choice: ụlọ ihe nkiri
  rationale: Nke a bụ okwu Igbo doro anya maka ebe ọha na-ekiri ihe nkiri; a naghị etinye nkọwa pụrụ iche karịa ihe Grik kwuru.
- source_word: συναρπάσαντες
  choice: na-adọkpụrụ
  rationale: Okwu a na-echekwa echiche nke ijide mmadụ n’ike ma buru ya n’otu ngagharị ahụ; nkọwa ala peeji na-egosi ụzọ ntụgharị ndị ọzọ.
- source_word: Γάϊον καὶ Ἀρίσταρχον
  choice: Gayọs na Aristakọs
  rationale: A sụgharịrị aha ndị ahụ n’ụdị mkpụrụokwu kwekọrọ na ụda ha ma dị mfe ọgụgụ n’Igbo.
- source_word: Μακεδόνας
  choice: ndị Masedonia
  rationale: Ọ na-egosi na mmadụ abụọ ahụ si Masedonia.
- source_word: συνεκδήμους Παύλου
  choice: ha na Pọl so eme njem
  rationale: Nke a na-egosipụta n’Igbo eke na ha bụ ndị enyi Pọl na njem.
