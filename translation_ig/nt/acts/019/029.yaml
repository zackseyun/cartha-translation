  rationale: 'E degharịrị ahịrịokwu ahụ iji soro usoro na ihe isi Grik pụtara: obodo ahụ bụ ihe jupụtara n’ọgbaaghara; ìgwè ahụ gbara ọsọ dịka otu; ha jidere mmadụ abụọ ahụ n’ike ma dọpụta ha. Mmezi ndị a anaghị agbakwunye nkọwa okpukpe ma ọ bụ agwa ndị isi Grik ekwughị.'
