id: ACT.19.27
reference: Acts 19:27
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οὐ μόνον δὲ τοῦτο κινδυνεύει ἡμῖν τὸ μέρος εἰς ἀπελεγμὸν ἐλθεῖν, ἀλλὰ καὶ τὸ τῆς μεγάλης θεᾶς ⸂Ἀρτέμιδος ἱερὸν⸃ εἰς οὐθὲν λογισθῆναι, μέλλειν ⸀τε καὶ καθαιρεῖσθαι ⸂τῆς μεγαλειότητος⸃ αὐτῆς, ἣν ὅλη ἡ Ἀσία καὶ ἡ οἰκουμένη σέβεται.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/027.yaml
  text: And not only is this trade of ours in danger of coming into disrepute, but also the temple of the great goddess Artemis may be counted as nothing, and even her majesty—whom all Asia and the world worships—may be brought down.
translation:
  language: ig
  text: Ọ bụghị naanị na ọrụ azụmahịa anyị a nọ n’ihe ize ndụ nke ịdaba n’aha ọjọọ, kamakwa na e nwekwara ihe ize ndụ na a ga-agụ ụlọ nsọ nke nnukwu chi nwanyị Atemis dịka ihe na-adịghị mkpa, nakwa na a ga-eweda ịdị ebube[b] Atemis, bụ chi nwanyị nke Eshia dum na ụwa[a] na-efe ofufe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ụwa mmadụ bi na ya.” Okwu Grik a na-ezokarị aka n’ụwa mmadụ bi na ya, karịsịa mba ndị dị n’okpuru ọchịchị Rom.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ịma mma ya” ma ọ bụ “ịdị ukwuu ya.” Okwu Grik ahụ na-ezo aka n’ọnọdụ dị elu, ugwu, ma ọ bụ ịma mma Atemis nke a pụrụ iweda.
    reason: lexical_alternative
lexical_decisions:
- source_word: κινδυνεύει
  choice: nọ n’ihe ize ndụ
  rationale: Nke a na-egosipụta ịnọ n’ihe egwu ma na-edobe echiche nke ngwaa ahụ n’oge ugbu a.
- source_word: τὸ μέρος
  choice: ụdị ahịa anyị a
  rationale: N’ọnọdụ a, okwu ahụ na-ezo aka n’ọrụ azụmahịa ma ọ bụ ngalaba ọrụ ndị omenkà ahụ, ọ bụghị naanị ‘akụkụ.’
- source_word: εἰς ἀπελεγμὸν ἐλθεῖν
  choice: nke ịbụ ihe a na-elelị
  rationale: Nke a na-egosipụta ịdaba n’ọnọdụ enweghị ugwu ma ọ bụ aha ọjọọ n’asụsụ Igbo dị mfe nghọta.
- source_word: ἱερὸν
  choice: ụlọ nsọ
  rationale: Ọ na-ezo aka n’ebe nsọ ma ọ bụ temple Atemis dị n’Efesọs; ‘ụlọ nsọ’ bụ okwu Igbo doro anya.
- source_word: εἰς οὐθὲν λογισθῆναι
  choice: ile ... anya dị ka ihe na-abaghị uru
  rationale: Nke a na-edobe echiche nke ịgụ ihe dị ka ihe efu ma ọ bụ ihe na-enweghị uru, n’ebughị nkọwa gafee ihe Grik kwuru.
- source_word: μέλλειν τε καὶ καθαιρεῖσθαι
  choice: a ga-ewepụkwa
  rationale: Usoro Grik ahụ na-egosi ọdịda ma ọ bụ mwepụ dị nso; ntụgharị a na-ejikọta ya nke ọma na ‘ịdị ebube ya’ n’Igbo.
- source_word: τῆς μεγαλειότητος αὐτῆς
  choice: ịdị ebube ya
  rationale: Ọ na-egosipụta nnukwu ugwu, ọnọdụ dị elu, ma ọ bụ ịma mma a na-enye Atemis, na-edobekwa ohere nghọta okwu ahụ nwere.
- source_word: ὅλη ἡ Ἀσία
  choice: Eshia dum
  rationale: Ọ na-ezo aka n’ógbè Rom a na-akpọ Eshia ma na-edobe ikwubiga okwu nke onye na-ekwu okwu.
- source_word: ἡ οἰκουμένη
  choice: ụwa
  rationale: ‘Ụwa’ bụ ntụgharị Igbo kwekọrọ n’okwu kwa ụbọchị; nkọwa ala peeji na-egosi na Grik nwere ike ịpụta ụwa mmadụ bi na ya.
- source_word: σέβεται
  choice: na-efe ofufe
  rationale: N’ọnọdụ okpukpe a, ngwaa ahụ na-egosi nsọpụrụ ofufe, ya mere ‘na-efe ofufe’ dabara nke ọma.
theological_decisions:
- issue: Ikwupụta okwu ofufe arụsị n’emeghị ka ọ dị nro ma ọ bụ kwado ya
  choice: nnukwu chi nwanyị Atemis ... onye Eshia dum na ụwa na-efe ofufe
  alternative: chi nwanyị a na-akpọ nnukwu, bụ́ Atemis ... onye Eshia dum na ụwa na-asọpụrụ
  rationale: Amaokwu ahụ bụ okwu Demetriọs. A sụgharịrị nkwupụta ya dịka ọ dị n’enweghị itinye okwu ga-eme ka onye ntụgharị kewapụ onwe ya n’echiche ahụ, ebe Grik emeghị otú ahụ.
translation_notes:
  register: Ejiri Igbo Izugbe dị ugbu a, dị ùgwù ma dị mfe nghọta. A hapụrụ okwu ahụ dịka nkwupụta Demetriọs, ma debe mgbagwoju anya dị na usoro Grik banyere iweda ma ọ bụ iwepụ ịdị ebube Atemis. Ihe nrịbama [a] na [b] dị n’ahịrị isi.
