revisions:
- from: Ọ bụghị naanị na ụdị ahịa anyị a nọ n’ihe ize ndụ nke ịbụ ihe a na-elelị, kama a pụkwara ile ụlọ nsọ nke nnukwu chi nwanyị Atemis anya dị ka ihe na-abaghị uru; a ga-ewepụkwa ịdị ebube[b] ya—onye Eshia dum na ụwa[a] na-efe ofufe.
  to: Ọ bụghị naanị na ọrụ azụmahịa anyị a nọ n’ihe ize ndụ nke ịdaba n’aha ọjọọ, kamakwa na e nwekwara ihe ize ndụ na a ga-agụ ụlọ nsọ nke nnukwu chi nwanyị Atemis dịka ihe na-adịghị mkpa, nakwa na a ga-eweda ịdị ebube[b] Atemis, bụ chi nwanyị nke Eshia dum na ụwa[a] na-efe ofufe.
  rationale: The revision corrects the sense of the craftsmen's trade, retains the danger that governs each consequence, and resolves the ambiguous Igbo attachment of the final relative clause. It uses “iweda” for the feared bringing down of Artemis's grandeur without imposing an interpretation beyond the Greek.
  reviewer_model: gpt-5.6-terra
