review_pass:
  verdict: revise
  source_fidelity: The draft broadly conveys the commercial danger, the threatened loss of standing for Artemis's temple, and the threatened diminishment of Artemis's grandeur. However, “ụdị ahịa” means a type/kind of trade rather than Demetrius's particular trade or line of business, and “a pụkwara” weakens the single danger construction that governs the following infinitival clauses. The final relative phrase is also grammatically liable to attach to “ịdị ebube” rather than to Artemis.
  naturalness: Several phrases are understandable but less idiomatic or precise in Standard Igbo. “ọrụ azụmahịa anyị a” is clearer for the group's trade/business. Recasting the coordinated threats with “e nwekwara ihe ize ndụ na...” makes the Greek linkage natural without implying mere permission or possibility.
  terminology: “ụlọ nsọ,” “nnukwu chi nwanyị Atemis,” “Eshia dum,” “ụwa,” and “na-efe ofufe” are appropriate. “ịdị ebube” suitably renders μεγαλειότης. The revision explicitly identifies Artemis as the one worshiped, avoiding an unintended antecedent for “onye.”
  issues:
  - severity: medium
    issue: “ụdị ahịa anyị a”
    rationale: This normally denotes a kind or category of trade. τὸ μέρος in context is their own trade/business sector; “ọrụ azụmahịa anyị a” is more faithful and natural.
  - severity: medium
    issue: “a pụkwara ile ... anya”
    rationale: The Greek has κινδυνεύει governing both the trade's disrepute and the temple's being counted as nothing. “Pụrụ” introduces bare possibility rather than the stated danger; the revision retains the threatened sense.
  - severity: medium
    issue: “ịdị ebube[b] ya—onye Eshia dum na ụwa[a] na-efe ofufe”
    rationale: The immediately preceding noun is the abstract “ịdị ebube,” so “onye” can be read as modifying the wrong antecedent. Naming Atemis in the final clause preserves the Greek relative reference unambiguously.
  - severity: low
    issue: “a ga-ewepụ ... ịdị ebube”
    rationale: “Iwepụ” can suggest simple removal. “Iweda” better represents καθαιρεῖσθαι, the bringing down or stripping away of grandeur/status, while preserving the source's compressed ambiguity.
  revised_text: Ọ bụghị naanị na ọrụ azụmahịa anyị a nọ n’ihe ize ndụ nke ịdaba n’aha ọjọọ, kamakwa na e nwekwara ihe ize ndụ na a ga-agụ ụlọ nsọ nke nnukwu chi nwanyị Atemis dịka ihe na-adịghị mkpa, nakwa na a ga-eweda ịdị ebube[b] Atemis, bụ chi nwanyị nke Eshia dum na ụwa[a] na-efe ofufe.
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “ụwa mmadụ bi na ya.” Okwu Grik a na-ezokarị aka n’ụwa mmadụ bi na ya, karịsịa mba ndị dị n’okpuru ọchịchị Rom.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ịma mma ya” ma ọ bụ “ịdị ukwuu ya.” Okwu Grik ahụ na-ezo aka n’ọnọdụ dị elu, ugwu, ma ọ bụ ịma mma Atemis nke a pụrụ iweda.
    reason: lexical_alternative
  revision_rationale: The revision corrects the sense of the craftsmen's trade, retains the danger that governs each consequence, and resolves the ambiguous Igbo attachment of the final relative clause. It uses “iweda” for the feared bringing down of Artemis's grandeur without imposing an interpretation beyond the Greek.
