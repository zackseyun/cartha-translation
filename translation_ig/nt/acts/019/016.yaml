id: ACT.19.16
reference: Acts 19:16
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ⸀ἐφαλόμενος ⸂ὁ ἄνθρωπος ἐπ’ αὐτοὺς⸃ ἐν ᾧ ἦν τὸ πνεῦμα τὸ πονηρὸν ⸂κατακυριεύσας ἀμφοτέρων⸃ ἴσχυσεν κατ’ αὐτῶν, ὥστε γυμνοὺς καὶ τετραυματισμένους ἐκφυγεῖν ἐκ τοῦ οἴκου ἐκείνου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/016.yaml
  text: And the man in whom the evil spirit was leaped on them[a], and after overpowering both of them, prevailed against them[c][b], so that they fled out of that house naked and wounded.
translation:
  language: ig
  text: Nwoke ahụ, onye mmụọ ọjọọ bi n’ime ya, wụkwasịrị ha[a], merie ha abụọ[b], wee dị ike karịa ha; nke mere ha ji si n’ụlọ ahụ gbapụ, gba ọtọ ma merụọ ahụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “dakwasịrị ha” ma ọ bụ “maliri ha elu.”
    reason: lexical_alternative
  - marker: b
    text: Grik kwuru, “ha abụọ.” Ọ bụ ezie na akụkụ akụkọ gbara amaokwu a gburugburu kwuru ọtụtụ ụmụ Sceva, ihe odide ebe a kwuru kpọmkwem “ha abụọ”; ya mere, ntụgharị a hapụrụ okwu ahụ otú ahụ.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐφαλόμενος
  choice: wụkwasịrị ha
  rationale: Na-egosi mwakpo mberede nke mmadụ ahụ wụkwasịrị ha; ọ bụ okwu Igbo doro anya ma dị ndụ n’akụkọ a.
- source_word: ὁ ἄνθρωπος
  choice: nwoke ahụ
  rationale: Aha Grik a bụ nwoke n’ụdị na n’ọnọdụ akụkọ a.
- source_word: ἐν ᾧ ἦν τὸ πνεῦμα τὸ πονηρόν
  choice: mmụọ ọjọọ ahụ bi n’ime ya
  rationale: Na-edobe echiche isi mmalite na mmụọ ahụ dị n’ime nwoke ahụ, n’enweghị itinye okwu nkà mmụta okpukpe ọzọ.
- source_word: τὸ πνεῦμα τὸ πονηρόν
  choice: mmụọ ọjọọ ahụ
  rationale: Nke a bụ okwu Igbo a na-aghọta nke ọma maka mmụọ dị njọ n’ọnọdụ ịchụ mmụọ.
- source_word: κατακυριεύσας
  choice: meriekwa
  rationale: Na-egosi na nwoke ahụ nwetara ike ma chịa ha n’ọgụ ahụ; ọ na-aga nke ọma n’Igbo na-enweghị ịgbatị okwu.
- source_word: ἀμφοτέρων
  choice: ha abụọ
  rationale: Na-edobe kpọmkwem ọnụọgụ abụọ dị na Grik, ọbụna mgbe ọnọdụ gbara ya gburugburu kwuru ọtụtụ ụmụ nwoke.
- source_word: ἴσχυσεν κατ’ αὐτῶν
  choice: wee dị ike karịa ha
  rationale: Na-edobe ya iche na ‘meriekwa,’ ma na-egosi na o gosipụtara na ike ya karịrị nke ha.
- source_word: γυμνούς
  choice: gba ọtọ
  rationale: Na-ekwupụta ọnọdụ ha kpọmkwem dịka Grik si kwuo, kama ịkọwa otú uwe ha si pụọ.
- source_word: τετραυματισμένους
  choice: bụrụkwa ndị e merụrụ ahụ
  rationale: Na-egosi na e merụọla ha, na mmerụ ahụ ahụ ka dịkwa ha n’ahụ mgbe ha gbapụrụ.
- source_word: ἐκφυγεῖν
  choice: ha gbapụrụ
  rationale: Na-egosi mgbapụ na nnapụta site n’ihe ize ndụ n’asụsụ Igbo nkịtị.
- source_word: ἐκ τοῦ οἴκου ἐκείνου
  choice: n’ụlọ ahụ
  rationale: N’usoro ya na ‘gbapụrụ,’ nke a na-egosi na ha si n’ụlọ ahụ pụọ n’ụzọ Igbo na-aga were were.
theological_decisions:
- issue: Okwu e ji kọwaa mmụọ ọjọọ nọ n’ime mmadụ
  choice: mmụọ ọjọọ ahụ bi n’ime ya
  alternative: nwoke ahụ mmụọ ọjọọ ji
  rationale: Nhọrọ a na-anọ nso n’usoro echiche Grik nke na-ekwu na mmụọ ahụ dị n’ime nwoke ahụ, n’etinyeghị nkọwa nkà mmụta okpukpe ọzọ.
- issue: Oke ἀμφοτέρων n’ihe gbasara ìgwè ka ukwuu
  choice: ha abụọ
  alternative: ha niile
  rationale: Grik kwuru kpọmkwem ‘ha abụọ.’ A hapụrụ esemokwu dị n’etiti nke a na akụkọ gbara ya gburugburu kama idozi ya n’ime ntụgharị.
translation_notes:
  register: Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E ji ‘wụkwasịrị ha’ mee ka mwakpo mberede pụta ìhè; e kewapụrụ ‘meriekwa ha abụọ’ na ‘dị ike karịa ha’ iji chekwaa nzọụkwụ abụọ nke κατακυριεύσας na ἴσχυσεν κατ’ αὐτῶν. Akara ndetu ala peeji niile dị n’ederede bụ [a] na [b].
