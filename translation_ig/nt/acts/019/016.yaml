  source_fidelity: 'Ntụgharị ahụ chebere ihe ndị bụ isi n’asụsụ Grik: nwoke ahụ nwere mmụọ ọjọọ n’ime ya wakporo ha, o meriri mmadụ abụọ, o wee dị ike karịa ha; ha si n’ụlọ ahụ gbapụ gba ọtọ ma merụọ ahụ. Otú ọ dị, nhazi okwu mbụ nwere ike ime ka njikọ dị n’etiti “nwoke ahụ” na nkebiokwu “mmụọ ọjọọ ... bi n’ime ya” ghara ịdị mfe ọgụgụ. A haziri ya ka ọ doo anya. E mekwara ka nkebi nsonaazụ ὥστε pụta kpọmkwem karịa.'
  naturalness: “Nwoke ahụ, onye mmụọ ọjọọ bi n’ime ya,” bụ usoro Standard Igbo dị mfe nghọta karịa “Nwoke ahụ mmụọ ọjọọ ahụ bi n’ime ya.” “Nke mere ha ji si n’ụlọ ahụ gbapụ” na-egosi nsonaazụ ahụ n’ụzọ sitere n’okike. “Merụọ ahụ” na-arụ ọrụ nke ọma maka ọnọdụ e merụrụ ha.
