translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E debere usoro iwu nke amaokwu ahụ, ọtụtụ nke “ndị prokọnsul,” na ntakịrị enweghị nkọwa gbasara ihe ọtụtụ ahụ pụtara; nkọwa ọzọ dị n’ala peeji.
