  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἰ μὲν οὖν Δημήτριος καὶ οἱ σὺν αὐτῷ τεχνῖται ἔχουσιν πρός τινα λόγον, ἀγοραῖοι ἄγονται καὶ ἀνθύπατοί εἰσιν, ἐγκαλείτωσαν ἀλλήλοις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/038.yaml
  text: If[a], then, Demetrius and the craftsmen with him have a complaint against anyone, court sessions are being held and there are proconsuls[b]; let them bring charges against one another.
translation:
  language: ig
  text: Ya mere, ọ bụrụ na Demetriọs na ndị omenkà ndị ya na ha nọ nwere mkpesa megide onye ọ bụla, a na-enwe nnọkọ ụlọikpe[a], ndị prokọnsul nọkwa[b]; ka ha bo ibe ha ebubo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ụlọikpe na-ekpe ikpe.” Okwu Grik ahụ bụ ἀγοραῖοι ἄγονται na-ezo aka na nnọkọ ikpe ndị ọchịchị kpọkọtara n’ụzọ iwu kwadoro.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ndị prokọnsul nọ” ma ọ bụ “ndị prokọnsul dị njikere.” Ọtụtụ nke okwu ahụ nwere ike na-ezo aka n’ọkwá ọchịchị mpaghara ahụ n’ozuzu ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ μὲν οὖν
  choice: Ya mere, ọ bụrụ na
  rationale: Nke a na-egosipụta ma njikọ nkwubi okwu nke οὖν ma ọnọdụ nke εἰ n’Igbo dị mfe; a naghị atụgharị μέν iche n’ihi na ọrụ ya dị n’usoro ahịrịokwu ahụ.
- source_word: Δημήτριος
  choice: Demetriọs
  rationale: E depụtara aha Grik a n’ụzọ na-eme ka onye Igbo nwee ike ịkpọ ya nke ọma, ma debe ụda aha mbụ ya.
- source_word: οἱ σὺν αὐτῷ τεχνῖται
  choice: ndị omenkà ya na ha nọ
  rationale: “Ndị omenkà” na-egosi ndị ọrụ nwere nka, ebe “ya na ha nọ” na-edebe echiche σὺν αὐτῷ n’emeghị ka mmekọrịta ha bụrụ nke akọwapụtara karịa ihe Grik kwuru.
- source_word: ἔχουσιν πρός τινα λόγον
  choice: nwere mkpesa megide onye ọ bụla
  rationale: 'Nkebiokwu a nwere nghọta gbasara iwu: inwe okwu ma ọ bụ ikpe megide mmadụ. “Mkpesa megide” na-eme ka nke ahụ doo onye na-agụ Igbo anya.'
- source_word: τινα
  choice: onye ọ bụla
  rationale: Ọ na-egosi onye a na-akọwaghị aha n’ụkpụrụ iwu a n’ozuzu ya.
- source_word: ἀγοραῖοι ἄγονται
  choice: a na-enwe nnọkọ ụlọikpe
  rationale: Nke a na-ezo aka n’oge ma ọ bụ nnọkọ ikpe ndị ọchịchị kpọkọtara n’ụzọ iwu kwadoro; ntụgharị a na-edebekwa ọdịdị nnara nke okwu Grik ahụ.
- source_word: ἀνθύπατοί εἰσιν
  choice: ndị prokọnsul dịkwa
  rationale: “Prokọnsul” bụ aha ọkwá ọchịchị Rom kwekọrọ n’ἀνθύπατος. E debere ọtụtụ nke dị n’asụsụ Grik kama ịgbanwe ya ka ọ bụrụ otu onye.
- source_word: ἐγκαλείτωσαν
  choice: ka ha bo ... ebubo
  rationale: Ngwaa a pụtara iweta ebubo megide mmadụ n’usoro ikpe; “ibo ebubo” bụ okwu Igbo doro anya ma kwekọọ n’ọnọdụ ụlọikpe.
- source_word: ἀλλήλοις
  choice: ibe ha
  rationale: N’ihi njikọ ya na “ibo ebubo,” okwu nzaghachi a pụtara na ndị otu metụtara okwu ahụ ga-eweta ebubo ha megide ibe ha site n’usoro iwu.
