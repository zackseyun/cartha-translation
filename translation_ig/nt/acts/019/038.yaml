revisions:
- from: Ya mere, ọ bụrụ na Demetriọs na ndị omenkà ya na ha nọ nwere mkpesa megide onye ọ bụla, a na-enwe nnọkọ ụlọikpe[a], ndị prokọnsul dịkwa[b]; ka ha bo ibe ha ebubo.
  to: Ya mere, ọ bụrụ na Demetriọs na ndị omenkà ndị ya na ha nọ nwere mkpesa megide onye ọ bụla, a na-enwe nnọkọ ụlọikpe[a], ndị prokọnsul nọkwa[b]; ka ha bo ibe ha ebubo.
  rationale: 'The revision improves Standard Igbo syntax and idiom while retaining every material element of the Greek: Demetrius and the craftsmen with him, a possible legal grievance against an unspecified person, officially held court sessions, the Greek plural “proconsuls,” and reciprocal legal accusation. The footnote preserves rather than resolves the administrative ambiguity of the plural.'
