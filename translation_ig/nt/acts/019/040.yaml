id: ACT.19.40
reference: Acts 19:40
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ γὰρ κινδυνεύομεν ἐγκαλεῖσθαι στάσεως περὶ τῆς σήμερον μηδενὸς αἰτίου ὑπάρχοντος περὶ οὗ οὐ δυνησόμεθα ⸀ἀποδοῦναι λόγον ⸀περὶ τῆς συστροφῆς ταύτης. καὶ ταῦτα εἰπὼν ἀπέλυσεν τὴν ἐκκλησίαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/040.yaml
  text: For indeed we are in danger of being charged with rioting over what happened today[a], since there is no cause for it, and we will not be able to give an account for this commotion. And after saying these things[c][b], he dismissed the assembly.
translation:
  language: ig
  text: N’ihi na anyị nọ n’ihe ize ndụ nke ịbụ ndị a ga-ebo ebubo maka ọgbaaghara banyere ihe mere taa[a], ebe ọ bụ na o nweghị ihe kpatara nnọkọ a anyị ga-enwe ike ịkọwa[b]. Mgbe o kwusịrị ihe ndị a, ọ chụsasịrị nzukọ ahụ[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “nnupụisi” ma ọ bụ “ịgba ọchịchị mgba okpuru.” Okwu Grik ahụ nwere ike ịpụta ọgbaaghara obodo dị ukwuu, ma n’ebe a “ọgbaaghara” dabara nke ọma n’ihe ìgwè mmadụ ahụ mere.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “mkpọtụ a” ma ọ bụ “ìgwè ọgbaaghara a.” Okwu Grik ahụ na-ezo aka n’ìgwè mmadụ a zukọtara n’ọgbaaghara, ọ dịkwa iche n’okwu a sụgharịrị “nzukọ” n’ikpeazụ amaokwu ahụ.
    reason: lexical_alternative
  - marker: c
    text: Okwu Grik a sụgharịrị “nzukọ” bụkwa okwu a na-ejikarị asụgharị “ụka” n’ebe ndị ọzọ, ma n’ebe a ọ na-ezo aka ná nzukọ obodo Efesọs.
    reason: cross_reference
lexical_decisions:
- source_word: κινδυνεύομεν
  choice: anyị nọ n’ihe ize ndụ
  rationale: Na-egosi ihe ize ndụ dị ugbu a, n’Igbo doro anya ma dịkwa eke.
- source_word: ἐγκαλεῖσθαι
  choice: nke ịbụ ndị a ga-ebo ebubo
  rationale: Na-echekwa nghọta iwu na ikpe dị n’okwu Grik ahụ.
- source_word: στάσεως
  choice: na anyị kpalitere ọgbaaghara
  rationale: Na-egosi ọgbaaghara ọha nke nwere ike iweta ebubo n’aka ọchịchị, n’ebughị ụzọ mee ka ọ bụrụ nnupụisi ndọrọ ndọrọ ọchịchị kpọmkwem.
- source_word: περὶ τῆς σήμερον
  choice: n’ihi ihe mere taa
  rationale: Ọ bụ ụzọ Igbo dị eke isi kọwaa ntụaka ahụ e zoro ezo banyere ihe omume nke ụbọchị ahụ.
- source_word: μηδενὸς αἰτίου ὑπάρχοντος
  choice: ebe ọ bụ na o nweghị ezi ihe kpatara ya
  rationale: Na-egosi na ọ dịghị ihe ziri ezi ga-akwado ọgbaaghara ahụ, ma na-echekwa ụda okwu nke iwu.
- source_word: ἀποδοῦναι λόγον
  choice: ịkọwa ihe kpatara
  rationale: Na-egosi ịza ajụjụ ma ọ bụ inye nkọwa n’ihu ndị ọchịchị.
- source_word: συστροφῆς
  choice: nnọkọ ọgbaaghara
  rationale: Na-ejikọta echiche nke ìgwè mmadụ zukọrọ na nke ọgbaaghara, ma na-amata ọdịiche ya na ἐκκλησία.
- source_word: ἐκκλησίαν
  choice: nzukọ ahụ
  rationale: N’ebe a, ọ pụtara nzukọ obodo, ọ bụghị chọọchị; ‘nzukọ’ bụ okwu Igbo sara mbara ma kwekọọ n’ọnọdụ ahụ.
- source_word: ἀπέλυσεν
  choice: ọ gbasara
  rationale: N’ọnọdụ nzukọ, nke a bụ ụzọ Igbo dị nkenke ma dị eke isi kwuo na o kwụsịrị nzukọ ahụ ma zipụ ndị bịara ya.
- source_word: καὶ γὰρ
  choice: N’ezie
  rationale: Na-echekwa ike nkwenye nke njikọ ahụ n’Igbo dị eke; ọrụ nkọwa ya ka ọnọdụ amaokwu ahụ na-egosi.
theological_decisions:
- issue: Ihe ἐκκλησία pụtara n’ebe a
  choice: nzukọ obodo, ọ bụghị chọọchị
  alternative: ụka/chọọchị
  rationale: Ọnọdụ obodo Efesọs na omume onye odeakwụkwọ obodo gosiri na okwu ahụ na-ezo aka n’ìgwè mmadụ zukọrọ, ọ bụghị ọgbakọ ndị Kraịst.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. E debere ụda ịdọ aka ná ntị nke iwu, ma kewapụ ‘nnọkọ ọgbaaghara’ na ‘nzukọ’ ka ọdịiche dị n’etiti συστροφή na ἐκκλησία pụta ìhè.
