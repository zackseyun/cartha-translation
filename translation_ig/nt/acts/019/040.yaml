    text: A pụkwara ịsụgharị ya, “nnupụisi” ma ọ bụ “ịgba ọchịchị mgba okpuru.” Okwu Grik ahụ nwere ike ịpụta ọgbaaghara obodo dị ukwuu, ma n’ebe a “ọgbaaghara” dabara nke ọma n’ihe ìgwè mmadụ ahụ mere.
