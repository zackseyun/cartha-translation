  terminology: “Mesaya” appropriately translates the titular Χριστός, while the footnote supplies the traditional alternative “Kraịst.” “N’aha” rightly retains the source expression without narrowing its range to authority alone. “Onye Nazaret” is a natural Igbo rendering of “the Nazarene,” and the lexical-alternative footnote is properly anchored.
