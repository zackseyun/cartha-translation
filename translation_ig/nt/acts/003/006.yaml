id: ACT.3.6
reference: Acts 3:6
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἶπεν δὲ Πέτρος· Ἀργύριον καὶ χρυσίον οὐχ ὑπάρχει μοι, ὃ δὲ ἔχω τοῦτό σοι δίδωμι· ἐν τῷ ὀνόματι Ἰησοῦ Χριστοῦ τοῦ Ναζωραίου ⸀περιπάτει.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/006.yaml
  text: 'But Peter said[a], “Silver and gold I do not have, but what I do have, this I give to you: in the name of Jesus the Messiah the Nazarene[b], walk.”'
translation:
  language: ig
  text: 'Ma Pita sịrị, “Ọlaọcha na ọlaedo enweghị m; ma ihe m nwere, nke ahụ ka m na-enye gị: n’aha Jizọs bụ́ Mesaya[a], onye Nazaret[b], jee ije.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “Kraịst.” Okwu Grik bụ Χριστός, nke pụtara “Mesaya.”
    reason: alternative_reading
  - marker: b
    text: A pụkwara ịsị, “onye si Nazaret.” Okwu Grik ahụ pụtara n’ụzọ kpọmkwem karị, “onye Nazaret.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀργύριον καὶ χρυσίον
  choice: Ọlaọcha na ọlaedo
  rationale: A sụgharịrị aha ọla abụọ ahụ kpọmkwem iji chekwaa njikọ Grik nke na-anọchi anya ego na akụnụba.
- source_word: οὐχ ὑπάρχει μοι
  choice: enweghị m
  rationale: Nke a bụ ụzọ Igbo dị mfe ma bụrụkwa nke ebumpụta ụwa isi gosipụta na Pita enweghị ihe ndị ahụ.
- source_word: ὃ δὲ ἔχω τοῦτό σοι δίδωμι
  choice: ma ihe m nwere, nke ahụ ka m na-enye gị
  rationale: “Nke ahụ ka” na-echekwa nkwusi ike dị na τοῦτο ma na-eme ka ọdịiche dị n’etiti ihe Pita na-enweghị na ihe o nwere pụta ìhè.
- source_word: ἐν τῷ ὀνόματι
  choice: n’aha
  rationale: Ọ na-echekwa okwu Grik ahụ na nghọta ya banyere ikike e ji aha ahụ mee ihe, n’ebughị ụzọ kọwaa naanị otu akụkụ nke ihe ọ pụtara.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jizọs bụ́ Mesaya
  rationale: Χριστός bụ utu aha nke pụtara Mesaya; “bụ́” na-eme ka apposition ahụ bụrụ Igbo dị mma ma doo anya na Mesaya bụ utu aha.
- source_word: τοῦ Ναζωραίου
  choice: onye Nazaret
  rationale: Nke a bụ ụzọ Igbo ebumpụta ụwa isi kwuo onye sitere Nazaret ma na-echekwa njirimara dị n’okwu Ναζωραῖος.
- source_word: περιπάτει
  choice: jee ije
  rationale: Ọ bụ iwu doro anya ka nwoke ahụ gaa ije; nsụgharị a anaghị agbakwụnye “bilie” nke na-adịghị n’amaokwu Grik a.
theological_decisions:
- issue: Nsụgharị Χριστοῦ n’usoro aha a
  choice: Mesaya
  alternative: Kraịst
  rationale: E ji “Mesaya” mee ka ihe utu aha Χριστός pụtara pụta ìhè n’ebe a; e debere “Kraịst” n’ala peeji dị ka okwu ọdịnala ọzọ.
- issue: Ike dị n’okwu ἐν τῷ ὀνόματι
  choice: n’aha
  alternative: site n’ikike nke
  rationale: “N’aha” na-echekwa ma usoro okwu Grik ma oghere nghọta ya gbasara nnọchite anya na ikike, kama imechi ya n’otu nkọwa.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. A hapụrụ usoro nkwusi ike nke ahịrịokwu Grik, ma zere okwu ndị ga-agbakwụnye omume na-adịghị na isi mmalite, dịka “bilie.”
