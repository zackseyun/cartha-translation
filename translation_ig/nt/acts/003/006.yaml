  source_fidelity: 'The translation accurately conveys the Greek contrast: Peter lacks silver and gold but gives what he has. “N’aha Jizọs bụ́ Mesaya, onye Nazaret” preserves the name formula, including Χριστός as a title and τοῦ Ναζωραίου as “the Nazarene.” “Jee ije” is a direct singular imperative and does not add “rise,” which is absent from this verse.'
