  text: ὃς ἰδὼν Πέτρον καὶ Ἰωάννην μέλλοντας εἰσιέναι εἰς τὸ ἱερὸν ἠρώτα ἐλεημοσύνην ⸀λαβεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/003.yaml
  text: When he saw Peter and John about to go into the temple, he began asking to receive alms.
translation:
  language: ig
  text: Mgbe ọ hụrụ Pita na Jọn ka ha na-aga ịbanye n'ụlọ nsọ[a], ọ nọ na-arịọ ka o nweta onyinye ebere.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Okwu Grik bụ ἱερόν na-ezo aka n’ogige na mkpokọta ụlọ nsọ, ọ bụghị kpọmkwem n’ebe nsọ dị n’ime ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς ἰδὼν
  choice: Mgbe ọ hụrụ
  rationale: A sụgharịrị nkebi participle a dị ka nkebi oge n'Igbo, ebe nnọchiaha ahụ na-ezo aka n nwoke ahụ a kpọrọ aha n'amaokwu bu ụzọ.
- source_word: Πέτρον καὶ Ἰωάννην
  choice: Pita na Jọn
  rationale: Ndị a bụ ụdị aha ndị ahụ a na-ejikarị ede n'Igbo.
- source_word: μέλλοντας εἰσιέναι
  choice: ka ha na-aga ịbanye
  rationale: Nke a na-egosi na ịbanye ha dị nso ime, ma ọ dịghị amanye echiche na ọ bụ naanị ebumnuche dị ha n'obi.
- source_word: εἰς τὸ ἱερόν
  choice: n'ụlọ nsọ[a]
  rationale: “Ụlọ nsọ” bụ okwu doro ndị na-agụ Igbo anya; ihe odide ala peeji kọwara na ἱερόν pụtara ogige ụlọ nsọ dum, ọ bụghị naanị ebe nsọ dị n'ime ya.
- source_word: ἠρώτα
  choice: ọ nọ na-arịọ ha
  rationale: Ụdị imperfect ahụ na-egosi omume na-aga n'ihu ma ọ bụ nke a na-eme ugboro ugboro. “Ọ nọ na-arịọ” na-echekwa nke a n'Igbo n'ebughị ụzọ kwuo na omume ahụ malitere n'oge ahụ kpọmkwem.
- source_word: ἐλεημοσύνην λαβεῖν
  choice: ka ha nye ya onyinye ebere
  rationale: N'Igbo, nke a bụ ụzọ ebumpụta ụwa isi kwuo na ọ rịọrọ ka o nweta ihe e nyere onye ogbenye n'ebere; ọ na-echekwa ma onyinye ahụ ma onye natara ya.
