translation_notes:
  register: E ji asụsụ Igbo Izugbe nke dị ugbu a, dị ùgwù, ma dị mfe nghọta. A họọrọ “onyinye ebere” kama okwu ochie ma ọ bụ nke pụrụ ime ka a ghọta na ọ bụ naanị ego ka a na-ekwu.
