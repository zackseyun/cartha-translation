id: ACT.3.21
reference: Acts 3:21
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὃν δεῖ οὐρανὸν μὲν δέξασθαι ἄχρι χρόνων ἀποκαταστάσεως πάντων ὧν ἐλάλησεν ὁ θεὸς διὰ ⸀στόματος τῶν ἁγίων ⸂ἀπ’ αἰῶνος αὐτοῦ προφητῶν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/021.yaml
  text: whom heaven must receive until the times of the restoration of all things that God spoke through the mouth of his holy prophets from of old.
translation:
  language: ig
  text: Onye eluigwe aghaghị ịnabata ruo n’oge mweghachi nke ihe niile Chineke kwuru kemgbe ụwa site n’ọnụ ndị amụma ya dị nsọ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δεῖ ... δέξασθαι
  choice: ga-anabatarịrị
  rationale: Na-egosipụta mkpa dị n’okwu Grik—ọ bụghị nanị ihe ga-eme, kama ihe a na-apụghị ịgbanahụ—ma na-edebe eluigwe dị ka onye na-anabata ya.
- source_word: ἄχρι χρόνων
  choice: ruo n’oge
  rationale: Ọ bụ ntụgharị Igbo dị mma maka ókè oge ahụ; otu ‘oge’ nwere ike ịgụnye usoro ma ọ bụ oge ndị ahụ n’enweghị asụsụ siri ike.
- source_word: ἀποκαταστάσεως πάντων
  choice: mweghachi nke ihe niile
  rationale: Na-edebe nghọta sara mbara na esemokwu dị na nkebiokwu Grik ahụ, n’enweghị ịkọwa kpọmkwem ụdị ma ọ bụ oke mweghachi ahụ.
- source_word: διὰ στόματος
  choice: site n’ọnụ
  rationale: Na-echekwa ihe atụ Grik nke na-egosi na Chineke kwuru okwu site n’ọnụ ndị amụma.
- source_word: ἀπ’ αἰῶνος
  choice: kemgbe ụwa
  rationale: Ọ bụ akpaokwu Igbo a na-aghọta nke ọma maka ihe sitere n’oge ochie nke ukwuu.
theological_decisions:
- issue: Oke ‘mweghachi nke ihe niile’
  choice: 'E debere ya n’ụdị sara mbara: ‘mweghachi nke ihe niile.’'
  alternative: Ịkọwa ya dịka mweghachi nke ihe e kere eke niile, Izrel, ma ọ bụ naanị ihe ndị amụma buru n’amụma.
  rationale: Amaokwu ahụ n’onwe ya akọwaghị oke ya n’ụzọ ga-eme ka otu nkọwa bụrụ naanị nke ziri ezi; ya mere, e zere itinye ozizi otu ụka.
- issue: Mmekọrịta ὧν na πάντων
  choice: ‘ihe niile Chineke kwuru’
  alternative: ‘ihe niile Chineke kwuru banyere ha’
  rationale: Nke a na-agbasochi njikọ okwu Grik anya ma na-echekwa obere mgbagwoju anya ya, kama ịgbakwunye ‘banyere’ nke na-akọwa mmekọrịta ahụ karịa ka ederede si kwuo.
- issue: Eluigwe dịka isiokwu nke δέξασθαι
  choice: ‘onye eluigwe ga-anabatarịrị’
  alternative: ‘onye a na-aghaghị ịnọ n’eluigwe’
  rationale: Nhọrọ a na-edebe usoro na ihe oyiyi nke ederede Grik, ebe eluigwe bụ isiokwu na-anabata onye ahụ.
translation_notes:
  register: Asụsụ ahụ bụ Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. E ji ‘ndị amụma ya dị nsọ’ mee ka njikọ ‘ya’ na Chineke doo anya, ma e chekwara usoro ahịrịokwu ahụ dịka akụkụ na-aga n’ihu site n’amaokwu bu ya ụzọ.
