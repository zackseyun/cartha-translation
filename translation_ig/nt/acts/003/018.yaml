  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ δὲ θεὸς ἃ προκατήγγειλεν διὰ στόματος πάντων τῶν ⸀προφητῶν παθεῖν τὸν χριστὸν ⸀αὐτοῦ ἐπλήρωσεν οὕτως.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/018.yaml
  text: But God thus fulfilled what he had announced beforehand through the mouth of all the prophets[b][a], that his Messiah would suffer.
translation:
  language: ig
  text: 'Ma Chineke si otú a mezuo ihe o buru ụzọ kwupụtara site n''ọnụ ndị amụma niile[a]: na Mesaya ya[b] ga-ata ahụhụ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “site n'aka ndị amụma niile.” N'okwu Grik kpọmkwem, ọ bụ “site n'ọnụ ndị amụma niile.”
    reason: lexical_alternative
  - marker: b
    text: N'okwu Grik, “Kraịst ya”; a sụgharịrị ya “Mesaya ya” n'ebe a n'ihi na Χριστός bụ utu aha.
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: Ma
  rationale: Ọ na-egosi ọdịiche dị n'etiti ihe ndị mmadụ mere n'amaokwu gara aga na ihe Chineke mezuru.
- source_word: προκατήγγειλεν
  choice: buru ụzọ kwupụta
  rationale: Ọ na-echekwa ma echiche nke ikwu ihe tupu oge ya eruo ma echiche nke nkwupụta doro anya.
- source_word: διὰ στόματος πάντων τῶν προφητῶν
  choice: ji ọnụ ndị amụma niile
  rationale: Ọ na-echekwa akpaalaokwu Grik nke pụtara na Chineke kwuru site n'ọnụ ndị amụma, n'Igbo doro anya ma dị ebube.
- source_word: παθεῖν
  choice: ga-ata ahụhụ
  rationale: Ọ na-egosi ọdịnaya nke ihe e buru ụzọ kwupụta n'etinyeghị echiche nke iwu ma ọ bụ mkpa n'ụzọ siri ike karịa infinitive Grik.
- source_word: τὸν χριστὸν αὐτοῦ
  choice: Mesaya ya
  rationale: Χριστός bụ utu aha n'ebe a; “Mesaya” na-echekwa ọnọdụ ndị Juu nke okwu Pita, ebe “ya” na-egosi onye Chineke họpụtara.
- source_word: ἐπλήρωσεν
  choice: mezuo
  rationale: Nke a bụ okwu Igbo nkịtị ma ziri ezi maka mmezu nke ihe e buru ụzọ kwuo.
- source_word: οὕτως
  choice: si otú a
  rationale: Ọ na-egosi ụzọ Chineke si mezuo amụma ahụ, ya bụ, site n'ahụhụ ahụ a kọwara.
theological_decisions:
- issue: Nsụgharị Χριστός
  choice: Mesaya
  alternative: Kraịst; Onye E Tere Mmanụ
  rationale: Okwu ahụ na-arụ ọrụ dị ka utu aha ebe a, ya mere “Mesaya” na-eme ka ọnọdụ Mesaya nke okwu Pita pụta ìhè n'enweghị ịgbakwunye ozizi otu ụka.
- issue: Ike modal nke παθεῖν
  choice: na Mesaya ya ga-ata ahụhụ
  alternative: na Mesaya ya aghaghị ịta ahụhụ; ka Mesaya ya taa ahụhụ
  rationale: “Ga-ata ahụhụ” na-ekwupụta ihe amụma ahụ kwuru n'etinyeghị echiche nke ‘aghaghị’ nke ụdị Grik a n'onwe ya ekwughị hoo haa.
- issue: Njikọ αὐτοῦ
  choice: Mesaya ya
  alternative: Mesaya ahụ
  rationale: E were αὐτοῦ dịka okwu nwe nke jikọrọ ya na χριστόν, ya bụ Mesaya nke Chineke ma ọ bụ onye Chineke họpụtara.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E chekwara akpaalaokwu Akwụkwọ Nsọ “ji ọnụ” ma tinye nkọwa n'ala peeji; ahịrịokwu ahụ na-eji kọlọn mee ka ọdịnaya amụma ahụ doo anya.
