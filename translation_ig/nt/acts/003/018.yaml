  to: 'Ma Chineke si otú a mezuo ihe o buru ụzọ kwupụtara site n''ọnụ ndị amụma niile[a]: na Mesaya ya[b] ga-ata ahụhụ.'
  rationale: The sole revision replaces “ji ọnụ” with “site n'ọnụ,” the direct and idiomatic Standard Igbo equivalent of the Greek phrase “through the mouth of.” The sentence’s meaning, register, ambiguity, title “Mesaya,” and both footnote anchors are retained.
