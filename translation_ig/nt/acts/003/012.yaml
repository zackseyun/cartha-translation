  to: Ma mgbe Pita hụrụ nke a, ọ zara ndị mmadụ, sị, “Ndị ikom Izrel, gịnị mere ihe a ji eju unu anya? Ma ọ bụ gịnị mere unu ji legide anyị anya[a], dị ka a ga-asị na ọ bụ site n’ike nke anyị ma ọ bụ n’ịsọpụrụ Chineke anyị[b] ka anyị ji mee ka nwoke a jee ije?”
