id: ACT.3.12
reference: Acts 3:12
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἰδὼν δὲ ⸀ὁ Πέτρος ἀπεκρίνατο πρὸς τὸν λαόν· Ἄνδρες Ἰσραηλῖται, τί θαυμάζετε ἐπὶ τούτῳ, ἢ ἡμῖν τί ἀτενίζετε ὡς ἰδίᾳ δυνάμει ἢ εὐσεβείᾳ πεποιηκόσιν τοῦ περιπατεῖν αὐτόν;
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/012.yaml
  text: But when Peter saw it[a], he answered the people, “Men of Israel, why do you marvel at this[b], or why do you stare at us as though by our own power or godliness we had made him walk?”
translation:
  language: ig
  text: Ma mgbe Pita hụrụ nke a, ọ zara ndị mmadụ, sị, “Ndị ikom Izrel, gịnị mere ihe a ji eju unu anya? Ma ọ bụ gịnị mere unu ji legide anyị anya[a], dị ka a ga-asị na ọ bụ site n’ike nke anyị ma ọ bụ n’ịsọpụrụ Chineke anyị[b] ka anyị ji mee ka nwoke a jee ije?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “na-ele anyị anya nke ọma.” Ngwaa Grik ahụ na-egosi ilegide mmadụ anya ruo oge ụfọdụ.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsị, “n’ịdị nsọpụrụ Chineke anyị.” Pita na-agọnarị na ọgwụgwọ nwoke ahụ sitere n’ịsọpụrụ Chineke ma ọ bụ àgwà ime mmụọ nke ndịozi n’onwe ha.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν δὲ ὁ Πέτρος
  choice: Ma mgbe Pita hụrụ nke a
  rationale: A kọwara participle aorist ἰδών dị ka ihe mere tupu Pita ekwuo okwu; “nke a” na-ezo aka n’ihe ọ hụrụ n’ọnọdụ gbara amaokwu a gburugburu.
- source_word: ἀπεκρίνατο πρὸς τὸν λαόν
  choice: ọ gwara ndị mmadụ
  rationale: N’agbanyeghị na ajụjụ doro anya adịghị tupu ya, ἀποκρίνομαι pụtara nzaghachi nye ọnọdụ ahụ; “ọ gwara” bụ Igbo ebumpụta ụwa n’okwu a.
- source_word: Ἄνδρες Ἰσραηλῖται
  choice: Ndị ikom Izrel
  rationale: Nke a na-echekwa ụdị ịkpọ ndị nwoke okwu nke dị na ἄνδρες, ma na-anọgide bụrụ okwu Igbo doro anya.
- source_word: τί θαυμάζετε ἐπὶ τούτῳ
  choice: gịnị mere ihe a ji eju unu anya?
  rationale: θαυμάζω na-egosi oke iju anya; ahịrịokwu a bụ ụzọ Igbo dị mfe ma kwụsie ike isi kwuo ya.
- source_word: ἢ ἡμῖν τί ἀτενίζετε
  choice: Gịnịkwa mere unu ji legide anyị anya
  rationale: “Legide ... anya” na-egosipụta ile mmadụ anya nke ọma ma nọgide na-ele ya, dịka ἀτενίζω si pụta.
- source_word: ἰδίᾳ δυνάμει
  choice: site n’ike nke aka anyị
  rationale: Nkebi a na-egosi ike nke ha onwe ha; okwu Igbo “nke aka anyị” na-eme ka nkw否 ahụ doo anya.
- source_word: εὐσεβείᾳ
  choice: n’ịdị uchu anyị n’ofufe Chineke
  rationale: εὐσέβεια bụ nsọpụrụ na nrubeisi okpukpe nye Chineke. Nhọrọ a na-ezere ime ka okwu ahụ bụrụ naanị ịdị nsọ n’omume ma ọ bụ ozizi pụrụ iche banyere uru mmadụ ritere.
- source_word: πεποιηκόσιν τοῦ περιπατεῖν αὐτόν
  choice: ka anyị ji mee ka nwoke a jee ije
  rationale: Nke a na-egosipụta echiche ụgha ndị mmadụ nwere na Pita na Jọn bụ ndị mere ka nwoke ahụ nwee ike ịga ije.
theological_decisions:
- issue: Ma εὐσεβείᾳ ọ̀ na-ekwu na ọrụ ebube ahụ sitere n’uru ime mmụọ nke ndịozi
  choice: n’ịdị uchu anyị n’ofufe Chineke
  alternative: n’ịdị nsọ anyị
  rationale: Pita na-agọnarị na ọgwụgwọ ahụ sitere n’ike ha ma ọ bụ àgwà ofufe nke ha. Nsụgharị ahụ na-echekwa nkw否 a n’etinyeghị ozizi ọzọ banyere uru ma ọ bụ ịdị nsọ nke mmadụ.
- issue: Ụdị nwoke dị na Ἄνδρες Ἰσραηλῖται
  choice: Ndị ikom Izrel
  alternative: Ndị Izrel
  rationale: A hapụrụ ụdị nwoke nke okwu Grik ahụ ka ọ dị, kama ime ya okwu na-anọpụ iche n’ihe gbasara nwoke na nwanyị.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta mee ihe. E tinyere akara ndetu ala ala [a] na [b] kpọmkwem n’ebe okwu ndị ha na-akọwa dị, iji zere mgbagwoju anya dị na nhazi akara nke consultation layer.
