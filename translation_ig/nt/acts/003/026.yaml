id: ACT.3.26
reference: Acts 3:26
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὑμῖν πρῶτον ⸂ἀναστήσας ὁ θεὸς⸃ τὸν παῖδα ⸀αὐτοῦ ἀπέστειλεν αὐτὸν εὐλογοῦντα ὑμᾶς ἐν τῷ ἀποστρέφειν ἕκαστον ἀπὸ τῶν πονηριῶν ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/026.yaml
  text: To you first[a], God, having raised up his servant[b], sent him to bless you by turning each of you from your wicked ways.
translation:
  language: ig
  text: Chineke mere ka ohu ya[b] bilie[a], wee buru ụzọ zigara unu ya ka ọ gọzie unu site n’ime ka onye ọ bụla n’ime unu hapụ omume ọjọọ ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “mgbe Chineke mere ka ohu ya pụta” ma ọ bụ “mgbe Chineke họpụtara ohu ya.” Okwu a apụtaghị na ọ ga-abụrịrị ịkpọlite ya n’ọnwụ.
    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ, “nwa ya.” Okwu Grik bụ παῖς, nke nwere ike ịpụta “ohu” ma ọ bụ “nwa”; “ohu” yikarịrị ka ọ na-egosipụta ndabere nke Ohu ahụ e kwuru banyere ya n’Aịzaya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμῖν πρῶτον
  choice: ọ bụ unu ka o buru ụzọ zigara ya
  rationale: Nke a na-egosi na ndị Pita na-agwa okwu bụ ndị Chineke buru ụzọ zigara Ohu ya, ma na-echekwa echiche nke ịbụ ndị mbụ n’usoro akụkọ nzọpụta.
- source_word: ἀναστήσας
  choice: mere ka ... bilie
  rationale: 'Nkebiokwu a na-echekwa ohere abụọ dị n’okwu Grik: Chineke ime ka Ohu ya pụta ma ọ bụ guzo dịka onye a họpụtara, nakwa ịkpọlite ya n’ọnwụ. Ihe odide bụ isi anaghị ekpebi otu n’ime ha naanị.'
- source_word: τὸν παῖδα αὐτοῦ
  choice: Ohu ya
  rationale: “Ohu” dabara n’echiche Ohu nke Onyenweanyị dị n’Aịzaya, nke okwu a yikarịrị ka ọ na-ezo aka na ya. Ọ naghị etinye okwu “Ọkpara,” nke ga-akọwa ihe karịrị okwu Grik n’ebe a.
- source_word: ἀπέστειλεν αὐτόν
  choice: zigara ya
  rationale: Nke a bụ ụzọ Igbo doro anya si kwuo na Chineke zitere onye ahụ n’ebe ndị a na-agwa okwu nọ.
- source_word: εὐλογοῦντα ὑμᾶς
  choice: ka ọ gọzie unu
  rationale: A tụgharịrị participle ahụ dịka ebumnuche ma ọ bụ ihe si n’iziga ya pụta, n’Igbo dị ire.
- source_word: ἐν τῷ ἀποστρέφειν ἕκαστον
  choice: site n’ime ka onye ọ bụla n’ime unu hapụ
  rationale: “Site n’ime ka” na-egosi ụzọ ngọzi ahụ si arụ ọrụ; “onye ọ bụla n’ime unu” na-echekwa ike nkesa nke ἕκαστον.
- source_word: ἀπὸ τῶν πονηριῶν ὑμῶν
  choice: ajọ omume ya
  rationale: “Ajọ omume” na-egosi ụdị ihe ọjọọ mmadụ na-eme, ma ọ bụ ụzọ ọjọọ ya, n’asụsụ Igbo nkịtị ma dịkwa nsọpụrụ.
theological_decisions:
- issue: Ihe ἀναστήσας pụtara banyere Jizọs
  choice: E ji “mere ka ... bilie” mee ka ihe odide bụ isi ghara ikpebi ma ọ bụ mbilite n’ọnwụ ka a na-ekwu kpọmkwem, ma ọ bụ ime ka Ohu ahụ pụta/guzoro dịka onye Chineke họpụtara.
  alternative: “kpọlitere ya n’ọnwụ” ma ọ bụ “mere ka Ohu ya pụta/họpụta ya”
  rationale: Okwu Grik ahụ nwere ike ime ka a nụ echiche mbilite n’ọnwụ, ma ọ nwekwara ike ịkpọghachi nkwa banyere Chineke ime ka onye amụma ma ọ bụ Ohu ya pụta. A hapụrụ mgbagwoju ahụ ka ọ dị.
- issue: Nkọwa banyere Kraịst dị n’okwu παῖς
  choice: Ohu ya
  alternative: nwa ya; Ọkpara ya
  rationale: “Ohu” na-echekwa ndabere nke Ohu Aịzaya. “Nwa” bụ ihe okwu ahụ nwekwara ike ịpụta, ma “Ọkpara” ga-etinye nkọwa banyere mmekọrịta Nna na Ọkpara nke okwu Grik a n’onwe ya ekwughị kpọmkwem n’amaokwu a.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe nghọta ma dịkwa nsọpụrụ. A họọrọ “hapụ ajọ omume ya” dịka ụzọ dị ire isi kwuo nchigharị pụọ n’ihe ọjọọ, ebe “site n’ime ka” na-echekwa na Ohu ahụ na-akpata nchigharị ahụ.
