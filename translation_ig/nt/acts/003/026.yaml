revisions:
- from: Mgbe Chineke mere ka Ohu ya[b] bilie[a], ọ bụ unu ka o buru ụzọ zigara ya ka ọ gọzie unu site n’ime ka onye ọ bụla n’ime unu hapụ ajọ omume ya.
  to: Chineke mere ka ohu ya[b] bilie[a], wee buru ụzọ zigara unu ya ka ọ gọzie unu site n’ime ka onye ọ bụla n’ime unu hapụ omume ọjọọ ya.
  rationale: The revision makes the priority directed to the audience explicit (“buru ụzọ zigara unu ya”), while preserving the Greek ambiguity of “mere ka ohu ya bilie.” It retains the means relation of ἐν τῷ ἀποστρέφειν, the individualizing force of ἕκαστον, and the concrete plural sense of πονηριῶν through a natural Igbo expression. Footnote anchors remain attached to the relevant terms.
