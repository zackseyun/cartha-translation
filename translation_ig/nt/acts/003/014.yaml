  text: ὑμεῖς δὲ τὸν ἅγιον καὶ δίκαιον ἠρνήσασθε καὶ ᾐτήσασθε ἄνδρα φονέα χαρισθῆναι ὑμῖν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/014.yaml
  text: But you denied the Holy and Righteous One[a], and asked for a murderer to be granted to you,
translation:
  language: ig
  text: Ma unu gọrọ Onye Nsọ na Onye Ezi Omume ahụ, rịọkwa ka e nye unu otu nwoke bụ onye ogbu mmadụ[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, dịka ọnọdụ akụkọ a na-egosi nke ọma, “ka a tọhapụrụ ya nye unu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς δὲ
  choice: Ma unu
  rationale: “Ma” na-egosi ọdịiche dị n’okwu bu ụzọ, ebe “unu” nke e kwuru kpọmkwem na-edobe nkwusi ike nke ebubo ahụ n’ụzọ Igbo dị mma.
- source_word: τὸν ἅγιον καὶ δίκαιον
  choice: Onye Nsọ na Onye Ezi Omume ahụ
  rationale: Adjective abụọ a na-arụ ọrụ dị ka aha e ji amata Jizọs. “Onye” na-eme ka nke a doo anya n’Igbo, ebe mkpụrụedemede ukwu na-egosi ịdị ka utu aha.
- source_word: ἠρνήσασθε
  choice: jụrụ
  rationale: “Jụrụ” na-egosi ịjụ, ịgọnahụ, ma ọ bụ ịhapụ ịnakwere onye ahụ; ọ dabara n’ebubo Pita na-ekwu n’ebe a n’enweghị ịgbakwunye nkọwa na-adịghị n’ederede.
- source_word: ᾐτήσασθε
  choice: rịọkwa
  rationale: “Rịọ” na-anọchi arịrịọ e nyere onye ọchịchị; “-kwa” na-ejikọta omume a na ịjụ Jizọs dịka καί si eme.
- source_word: ἄνδρα φονέα
  choice: onye ogbu mmadụ
  rationale: N’Igbo, “onye ogbu mmadụ” bụ ụzọ nkịtị ma doo anya isi kwuo nwoke e ji igbu mmadụ mara; ọ na-eburu echiche nke ἄνδρα φονέα n’enweghị okwu arọ na-adịghị mkpa.
- source_word: χαρισθῆναι ὑμῖν
  choice: ka e nye unu
  rationale: Nke a na-edobe nghọta sara mbara nke inye mmadụ ihe dịka amara ma ọ bụ ihe a kwadoro. N’ọnọdụ akụkọ a, ọ pụtara ịhapụrụ ha onye ahụ, nke e depụtara n’ala peeji.
theological_decisions:
- issue: Ike nke “τὸν ἅγιον καὶ δίκαιον” dịka aha e ji akọwa Kraịst
  choice: Onye Nsọ na Onye Ezi Omume ahụ
  alternative: onye ahụ dị nsọ ma bụrụ onye ezi omume
  rationale: Nhazi Grik na-eji adjective abụọ ahụ dị ka aha e ji amata Jizọs. Nsụgharị a na-echekwa ịdị ka utu aha n’etinyeghị ozizi ọzọ n’ederede.
- issue: Nghọta ikpe nke χαρισθῆναι
  choice: ka e nye unu
  alternative: ka a hapụụrụ unu ya
  rationale: Ngwaa Grik ahụ sara mbara karịa naanị ịhapụ onye mkpọrọ, ọ bụ ezie na n’ọnọdụ a ọ bụ ntọhapụ Barabas ka a na-ekwu. Isi ederede na-edobe obosara okwu ahụ, ebe nkọwa ala peeji na-enye nghọta kpọmkwem nke ọnọdụ ahụ.
translation_notes:
  register: E ji Standard Igbo nke dị ugbu a, dị ùgwù ma dị mfe nghọta mee ihe. Ahịrịokwu ahụ na-edobe ụda ebubo Pita, ọdịiche dị n’etiti Jizọs na onye ogbu mmadụ, nakwa ntakịrị obosara dị na χαρισθῆναι.
