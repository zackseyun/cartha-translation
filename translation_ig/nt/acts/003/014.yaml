review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves the adversative address, the paired titular description of Jesus, the request, and the passive sense of granting. However, “jụrụ” primarily means ‘refused’ and is less precise for ἀρνέομαι, which here means denying or disowning. Also, “onye ogbu mmadụ” conveys ‘murderer’ but leaves unrepresented the explicit ἄνδρα (‘man’); a natural Igbo phrasing can retain both elements.
  naturalness: The revised wording is idiomatic Standard Igbo. “Gọrọ” supplies the required repudiation sense, while “otu nwoke bụ onye ogbu mmadụ” is clear and natural without flattening the source phrase. The revised footnote states the contextual judicial sense more directly.
  terminology: “Onye Nsọ na Onye Ezi Omume ahụ” suitably treats the paired substantival adjectives as a weighty, Jesus-referential designation without adding doctrine. “Onye Ezi Omume” is an established and intelligible rendering of ‘Righteous One.’
  issues:
  - severity: medium
    issue: “jụrụ” is not the most accurate equivalent of ἠρνήσασθε.
    rationale: In this context ἀρνέομαι denotes denial or disowning, not merely refusing. “Gọrọ” better retains Peter’s accusatory sense.
  - severity: low
    issue: The explicit ἄνδρα is not represented in “onye ogbu mmadụ.”
    rationale: Although ‘murderer’ captures φονέα, the Greek expressly calls him a man. “Otu nwoke bụ onye ogbu mmadụ” preserves this detail idiomatically.
  - severity: low
    issue: The footnote’s “hapụụrụ unu ya” is less explicit than necessary about release.
    rationale: “Ka a tọhapụrụ ya nye unu” clearly expresses the contextual judicial alternative, while leaving the main text’s broader ‘grant’ wording intact.
  revised_text: Ma unu gọrọ Onye Nsọ na Onye Ezi Omume ahụ, rịọkwa ka e nye unu otu nwoke bụ onye ogbu mmadụ[a],
  revised_footnotes:
