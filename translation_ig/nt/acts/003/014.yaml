    text: Ma ọ bụ, dịka ọnọdụ akụkọ a na-egosi nke ọma, “ka a tọhapụrụ ya nye unu.”
    reason: lexical_alternative
  revision_rationale: The revision replaces a less exact verb of refusal with an Igbo verb for denial/disowning, retains the source’s explicit reference to a man as well as his being a murderer, and makes the contextual-release footnote unambiguous. It preserves the Greek ambiguity of χαρισθῆναι in the main text and does not introduce interpretive or doctrinal material.
