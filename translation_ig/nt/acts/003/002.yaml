id: ACT.3.2
reference: Acts 3:2
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καί τις ἀνὴρ χωλὸς ἐκ κοιλίας μητρὸς αὐτοῦ ὑπάρχων ἐβαστάζετο, ὃν ἐτίθουν καθ’ ἡμέραν πρὸς τὴν θύραν τοῦ ἱεροῦ τὴν λεγομένην Ὡραίαν τοῦ αἰτεῖν ἐλεημοσύνην παρὰ τῶν εἰσπορευομένων εἰς τὸ ἱερόν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/002.yaml
  text: And a certain man[a], lame from his mother’s womb, was being carried, whom they would place every day at the gate of the temple called Beautiful, to ask for alms from those entering into the temple[c][b],
translation:
  language: ig
  text: A na-ebu otu nwoke, onye ngwọrọ site n’afọ nne ya, onye ndị mmadụ na-edobe kwa ụbọchị n’ọnụ ụzọ ámá ogige ụlọ nsọ a na-akpọ “Ọmarịcha,” ka ọ rịọ n’aka ndị na-abanye n’ogige ụlọ nsọ onyinye ebere.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τις ἀνὴρ
  choice: otu nwoke
  rationale: Nke a na-egosi nwoke a na-akọ banyere ya dị ka otu onye a kapịrị ọnụ, ma ọ bụghị onye a kpọrọ aha; ọ bụkwa ụzọ Igbo si ekwu ya nke ọma.
- source_word: χωλὸς
  choice: onye ngwọrọ
  rationale: “Onye ngwọrọ” bụ okwu Igbo doro anya maka onye ụkwụ ya anaghị arụ ọrụ nke ọma nke na ọ naghị aga ije dịka ndị ọzọ.
- source_word: ἐκ κοιλίας μητρὸς αὐτοῦ
  choice: site n’afọ nne ya
  rationale: Nke a na-edebe onyinyo okwu Grik ahụ, nke pụtara na ọnọdụ ya malitere tupu ma ọ bụ mgbe a mụrụ ya; e tinyere “kemgbe a mụrụ ya” dịka nkọwa ọzọ n’ala peeji.
- source_word: ἐβαστάζετο
  choice: A na-ebukwa
  rationale: Ụdị ngwaa a na-egosi omume a na-eme ugboro ugboro n’oge gara aga; “na-ebu” na njikọ akụkọ a na-enye nghọta ahụ n’Igbo.
- source_word: ἐτίθουν καθ’ ἡμέραν
  choice: Kwa ụbọchị, ndị mmadụ na-edobe ya
  rationale: Nke a na-egosi omume ndị ahụ na-eme kwa ụbọchị. “Ndị mmadụ” na-anọchi onye-eme ihe a na-akpọghị aha n’ụdị ngwaa Grik nke ọtụtụ.
- source_word: θύραν τοῦ ἱεροῦ
  choice: ọnụ ụzọ ogige ụlọ nsọ
  rationale: N’ebe ọha na-abata, θύρα bụ ọnụ ụzọ ámá, ἱερόν bụkwa ogige ụlọ nsọ dum, ọ bụghị naanị ebe nsọ dị n’ime.
- source_word: τὴν λεγομένην Ὡραίαν
  choice: nke a na-akpọ “Ọnụ Ụzọ Mara Mma”
  rationale: A tụgharịrị aha ọnụ ụzọ ahụ n’ụzọ Igbo ga-aghọta ozugbo, ma debe echiche Ὡραίαν, “mara mma.”
- source_word: τοῦ αἰτεῖν ἐλεημοσύνην
  choice: ka ọ rịọ ... onyinye ebere
  rationale: “Ka ọ rịọ” na-egosi ebumnuche nke infinitive Grik; “onyinye ebere” na-akọwa ego ma ọ bụ ihe a na-enye ndị ogbenye n'ụzọ doro anya.
- source_word: παρὰ τῶν εἰσπορευομένων εἰς τὸ ἱερόν
  choice: ndị na-abanye n’ogige ụlọ nsọ
  rationale: Nke a na-edebe echiche ndị nọ n’omume ịbanye n’ogige ụlọ nsọ ahụ.
theological_decisions: []
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta, dee amaokwu ahụ. E kewara ahịrịokwu ahụ ụzọ abụọ iji zere ogologo usoro nkebiokwu na-adịghị eke n’Igbo, ma debe usoro akụkọ, omume a na-eme ugboro ugboro, na ebumnuche dị n’akwụkwọ Grik.
