revisions:
- from: A na-ebukwa otu nwoke, onye ngwọrọ site n’afọ nne ya[b]. Kwa ụbọchị, ndị mmadụ na-edobe ya n’ọnụ ụzọ ogige ụlọ nsọ[a] nke a na-akpọ “Ọnụ Ụzọ Mara Mma”[c], ka ọ rịọ ndị na-abanye n’ogige ụlọ nsọ onyinye ebere.
  to: A na-ebu otu nwoke, onye ngwọrọ site n’afọ nne ya, onye ndị mmadụ na-edobe kwa ụbọchị n’ọnụ ụzọ ámá ogige ụlọ nsọ a na-akpọ “Ọmarịcha,” ka ọ rịọ n’aka ndị na-abanye n’ogige ụlọ nsọ onyinye ebere.
  rationale: 'Removed the unsupported -kwa from the carrying verb, retained the Greek imperfective/habitual scene through the narrative construction and ‘kwa ụbọchị,’ used ‘ọnụ ụzọ ámá’ for the temple gate, rendered its name idiomatically as ‘Ọmarịcha,’ and added n’aka to translate παρὰ (‘from’). Footnote anchors remain attached to their relevant terms: [b] to congenital lameness, [a] to the temple precinct, and [c] to the gate name.'
  reviewer_model: gpt-5.6-terra
