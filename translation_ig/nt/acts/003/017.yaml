review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys Peter’s knowledge, the ignorance qualifying the action, and the parallel with the audience’s rulers. However, “Ma ugbu a” is adversative (“But now”), whereas Καὶ νῦν retains a connective better rendered here without an adversative. “ụmụnna m” also adds the possessive “my,” which is not present in ἀδελφοί. The explicit “ihe ahụ” is a permissible contextual completion but is not needed in Igbo and may be avoided to retain the source’s broad, implicit object.
  naturalness: The revised wording is clear, idiomatic Standard Igbo, and retains a dignified public-address register. “Ugbu a, ụmụnna” works naturally as a discourse transition, while “unu mere ya n’amaghị ama” is fluent and lets “ya” refer to the immediately preceding matter without specifying more than the Greek does.
  terminology: “Ụmụnna” is an appropriate rendering of the vocative ἀδελφοί without importing a possessive. “N’amaghị ama” suitably expresses action done in ignorance without implying exoneration. “Ndị na-achị unu” appropriately renders the authorities/rulers (οἱ ἄρχοντες ὑμῶν) in modern Standard Igbo.
  issues:
  - severity: medium
    issue: “Ma ugbu a” renders an adversative contrast.
    rationale: Καὶ νῦν means “And now/Now,” not δέ (“but”). Although a contrast may be inferred from the discourse, it should not be made explicit in the translation.
  - severity: low
    issue: “Ụmụnna m” adds “my.”
    rationale: The Greek vocative ἀδελφοί does not include a first-person possessive pronoun. Igbo can directly address the hearers as “ụmụnna” without this addition.
  - severity: low
    issue: The footnote’s alternative repeats the added possessive.
    rationale: The note should describe the Greek lexical form accurately and offer an Igbo alternative that does not add “m.”
  revised_text: Ugbu a, ụmụnna,[a] ama m na unu mere ya n’amaghị ama, dịka ndị na-achị unu mekwara.
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “ụmụnne nwoke na ụmụnne nwanyị.” Okwu Grik ahụ kwuru “ụmụnne nwoke,” ma o nwere ike ịbụ okwu e ji akpọ ìgwè ahụ dum, ma ndị nwoke ma ndị nwanyị.
    reason: lexical_alternative
  revision_rationale: The revision removes the unsupported adversative and possessive, while preserving the source’s transition, direct address, acknowledgment of ignorance, and comparison with the rulers. The pronoun “ya” naturally represents the implicit object of ἐπράξατε in its immediate context without narrowing or elaborating it.
