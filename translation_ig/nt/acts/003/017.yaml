source:
  edition: SBLGNT
  text: Καὶ νῦν, ἀδελφοί, οἶδα ὅτι κατὰ ἄγνοιαν ἐπράξατε, ὥσπερ καὶ οἱ ἄρχοντες ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/017.yaml
  text: And now[a], brothers, I know that you acted in ignorance, just as your rulers also did.
translation:
  language: ig
  text: Ugbu a, ụmụnna,[a] ama m na unu mere ya n’amaghị ama, dịka ndị na-achị unu mekwara.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ụmụnne nwoke na ụmụnne nwanyị.” Okwu Grik ahụ kwuru “ụmụnne nwoke,” ma o nwere ike ịbụ okwu e ji akpọ ìgwè ahụ dum, ma ndị nwoke ma ndị nwanyị.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ νῦν
  choice: Ma ugbu a
  rationale: “Ma ugbu a” na-egosi ntụgharị okwu sitere n’ihe Pita kwuru na mbụ gaa n’arịrịọ ọ na-achọ ịrịọ ugbu a, ma na-edebekwa njikọ καί na oge νῦν n’ụzọ Igbo si ada nke ọma.
- source_word: ἀδελφοί
  choice: ụmụnna m
  rationale: “Ụmụnna m” bụ ụzọ nkwanye ùgwù na nke mmadụ na ibe ya si akpọ ndị ya n’Igbo. Ọ dabara n’okwu Pita gwara ụmụ Izrel, ma ihe odide ala peeji kọwara na okwu Grik ahụ pụtara “ụmụnne nwoke” n’ụzọ nkịtị ma nwee ike ịnọchite anya ìgwè nwoke na nwanyị.
- source_word: οἶδα
  choice: ama m
  rationale: Nke a bụ ntụgharị kpọmkwem na nke a na-asụkarị maka nkwupụta Pita na ọ maara ihe mere.
- source_word: κατὰ ἄγνοιαν
  choice: n’amaghị ama
  rationale: Nkebi okwu a na-egosi na ihe ha mere sitere n’amaghị ihe nke ọma. Ọ naghị ekwu n’onwe ya na ikpe adịghị ha, ya mere ọ na-echekwa esemokwu dị n’etiti amaghị ama ha na oku e mesịrị ka ha chegharịa.
- source_word: ἐπράξατε
  choice: unu mere ihe ahụ
  rationale: Ngwaa Grik ahụ na-ekwu n’ụzọ sara mbara banyere omume ha mere Jizọs. Igbo chọrọ ihe a na-ezo aka na ya ka ahịrịokwu ahụ daa nke ọma; “ihe ahụ” na-ezo azụ n’ihe a kọwara n’amaokwu ndị bu ụzọ n’etinyeghị nkọwa ọhụrụ.
- source_word: ὥσπερ καὶ
  choice: dịka ... mekwara
  rationale: 'Usoro a na-echekwa ma ntụnyere ahụ ma echiche nke “kwa”: ndị mmadụ mere ya n’amaghị ama, ndị na-achị ha mekwara otu ahụ.'
- source_word: οἱ ἄρχοντες ὑμῶν
  choice: ndị na-achị unu
  rationale: Nke a na-egosi ndị ndu nwere ikike n’ebe ahụ n’ụzọ doro anya ma bụrụkwa Igbo e ji eme ihe ugbu a, n’enweghị ịmachi ya naanị n’ọchịchị obodo ma ọ bụ naanị n’okpukpe.
theological_decisions:
- issue: Ma a ga-asụ okwu Pita banyere amaghị ama n’ụzọ ga-eme ka o yie na ikpe adịghị ndị ahụ
  choice: A hapụrụ ya dịka “n’amaghị ama,” n’enweghị ime ka ikpe ha dị nro ma ọ bụ kwuo na ha enweghị mmehie.
  alternative: “n’ihi na ha amaghị ihe ha na-eme,” nke nwere ike ịdị ka ọ na-agbaghara ha kpamkpam
  rationale: Amaokwu ahụ kwuru na amaghị ama so n’ihe kpatara omume ha, ma gburugburu ya ka na-akpọ ha ka ha chegharịa (amaokwu 19). Ya mere, ntụgharị ahụ echekwaghị otu akụkụ ma kpochapụ nke ọzọ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe nghọta ma nwee ugwu, dee ya. “Ụmụnna m” na-eme ka ọkpụkpọ oku ahụ bụrụ nke sitere n’ezinụlọ na nke na-ekpo ọkụ; “ndị na-achị unu” na-ezere okwu nwere ike ime ka ndị na-agụ ya chee naanị banyere ndị ndọrọ ndọrọ ọchịchị nke oge a.
