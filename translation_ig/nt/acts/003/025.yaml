id: ACT.3.25
reference: Acts 3:25
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὑμεῖς ἐστε ⸀οἱ υἱοὶ τῶν προφητῶν καὶ τῆς διαθήκης ἧς ⸂διέθετο ὁ θεὸς⸃ πρὸς τοὺς πατέρας ⸀ὑμῶν, λέγων πρὸς Ἀβραάμ Καὶ ἐν τῷ σπέρματί σου ⸀ἐνευλογηθήσονται πᾶσαι αἱ πατριαὶ τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/025.yaml
  text: You are the sons of the prophets and of the covenant that God made with your fathers[a], saying to Abraham[b], ‘And in your offspring all the families of the earth will be blessed.’
translation:
  language: ig
  text: Unu bụ ụmụ ndị amụma na ụmụ nke ọgbụgba ndụ ahụ Chineke na nna ochie unu gbara, mgbe ọ sịrị Ebreham, “N’ime mkpụrụ gị[b] ka a ga-agọzi ezinụlọ niile nke ụwa.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Okwu Grik bụ kpọmkwem “ụmụ nwoke.” N’ebe a, ọ na-ekwu maka ndị nketa ma ọ bụ ndị so n’ọgbụgba ndụ ahụ.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ “ụmụ ụmụ gị.” Okwu Grik ahụ nwere ike ịpụta ụmụ ụmụ Ebreham n’ozuzu ha, ma ọ pụkwara ịdị na-ezo n’otu onye na-anọchite anya ha.
    reason: alternative_reading
lexical_decisions:
- source_word: υἱοὶ
  choice: ụmụ
  rationale: Okwu a na-egosi ndị nọ n’ọnọdụ ụmụ na ndị nketa. N’Igbo, “ụmụ” bụ okwu ebumpụta ụwa nke na-anaghị ekwu na ha bụ naanị ụmụ nwoke, ma ọ na-edobe echiche nke ịbụ ndị nketa.
- source_word: προφητῶν
  choice: ndị amụma
  rationale: “Ụmụ ndị amụma” ebe a na-egosi ndị so n’usoro nkwa ndị amụma, ọ bụghị nanị ụmụ ha mụrụ n’anụ ahụ.
- source_word: διαθήκης
  choice: ọgbụgba ndụ
  rationale: N’ọnọdụ a nke nkwa Chineke nyere Ebreham na nna nna Izrel, “ọgbụgba ndụ” bụ okwu Igbo ziri ezi ma doo anya.
- source_word: διέθετο
  choice: gbara
  rationale: Nkwupụta Igbo “ịgba ọgbụgba ndụ” na-egosi ime ma ọ bụ iguzobe ọgbụgba ndụ n’ụzọ dị mfe ma kwekọọ n’ihe Grik pụtara.
- source_word: πρὸς τοὺς πατέρας ὑμῶν
  choice: na nna nna unu
  rationale: “Na” na-enye echiche mmekọrịta dị n’ịgba ọgbụgba ndụ, ebe “nna nna unu” na-ezo aka ná ndị nna ochie ha, ọ bụghị nanị ndị mụrụ ha ozugbo.
- source_word: σπέρματί
  choice: mkpụrụ gị
  rationale: “Mkpụrụ” na-edobe ihe atụ nke okwu Grik ma nwee ike ịgụnye ma ụmụ ụmụ Ebreham n’ozuzu ha ma otu onye nnọchiteanya, n’ebughị ụzọ kpebie otu n’ime ha.
- source_word: ἐνευλογηθήσονται
  choice: a ga-agọzi
  rationale: Nke a na-egosipụta ọdịnihu na olu nnara nke ngwaa Grik n’ụzọ Igbo doro anya.
- source_word: πατριαὶ
  choice: ezinụlọ
  rationale: “Ezinụlọ” bụ okwu ndị mmadụ na-aghọta nke ọma, ma n’ebe a ọ gbasara ìgwè ezinụlọ na agbụrụ dị iche iche, ọ bụghị naanị otu ụlọ.
- source_word: γῆς
  choice: ụwa
  rationale: Nkwa ahụ ruru mmadụ niile n’ụwa; “ụwa” ka mma karịa okwu ga-eme ka ọ yie naanị otu ala.
theological_decisions:
- issue: Asụsụ nwoke nnọchiteanya dị na υἱοὶ
  choice: ụmụ
  alternative: ụmụ nwoke
  rationale: Ọ bụ ezie na Grik kwuru kpọmkwem “ụmụ nwoke,” ihe a na-ekwu bụ ọnọdụ ndị nketa nke ọgbụgba ndụ. “Ụmụ” bụ asụsụ Igbo ebumpụta ụwa nke na-etinye ndị niile nkwa ahụ metụtara, ebe nkọwa ala peeji na-echekwa ụdị okwu Grik.
- issue: Uche abụọ dị n’okwu σπέρμα
  choice: mkpụrụ gị
  alternative: ụmụ ụmụ gị; otu nwa gị
  rationale: “Mkpụrụ” anaghị amanye nkọwa naanị n’ebe ọtụtụ ụmụ ụmụ Ebreham nọ, ọ naghịkwa amanye nkọwa naanị n’ebe otu onye nnọchiteanya nọ; ya mere ọ na-echekwa esemokwu na obosara echiche nke okwu mbụ.
- issue: Ụzọ ngọzi si abịa n’okwu ἐν τῷ σπέρματί σου
  choice: site ná mkpụrụ gị
  alternative: n’ime mkpụrụ gị
  rationale: “Site ná” bụ Igbo ebumpụta ụwa nke na-egosi na ngọzi ahụ na-abịara ezinụlọ ụwa site n’aka mkpụrụ Ebreham, n’enweghị ịkọwa kpọmkwem otú mmekọrịta ahụ si arụ ọrụ.
translation_notes:
  register: Asụsụ a bụ Igbo Izugbe dị ugbu a, dị ùgwù ma dị mfe nghọta. E jiri “nna nna unu” gosi ndị nna ochie, ma jiri usoro “ụmụ ndị amụma” na “ụmụ ọgbụgba ndụ” chekwaa ihe oyiyi nke ndị nketa dị n’amaokwu Grik.
