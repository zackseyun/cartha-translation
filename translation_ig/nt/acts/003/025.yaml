    text: Okwu Grik bụ kpọmkwem “ụmụ nwoke.” N’ebe a, ọ na-ekwu maka ndị nketa ma ọ bụ ndị so n’ọgbụgba ndụ ahụ.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ “ụmụ ụmụ gị.” Okwu Grik ahụ nwere ike ịpụta ụmụ ụmụ Ebreham n’ozuzu ha, ma ọ pụkwara ịdị na-ezo n’otu onye na-anọchite anya ha.
    reason: alternative_reading
  revision_rationale: The revision restores the syntactic connection between the covenant and the Abraham quotation, removes unsupported emphasis, uses a more idiomatic expression for the ancestors, and retains the source's ambiguity concerning Abraham's seed/offspring. The [a] anchor is placed at the end of the sentence because it comments on the opening phrase “ụmụ”; the [b] anchor remains immediately after “mkpụrụ gị.”
