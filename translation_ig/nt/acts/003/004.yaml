id: ACT.3.4
reference: Acts 3:4
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀτενίσας δὲ Πέτρος εἰς αὐτὸν σὺν τῷ Ἰωάννῃ εἶπεν· Βλέψον εἰς ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/004.yaml
  text: And Peter[a], together with John, fixed his gaze on him and said, “Look at us.”
translation:
  language: ig
  text: Pita na Jọn lekwasịrị nwoke ahụ anya nke ọma, Pita wee sị ya, “Lee anyị anya.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀτενίσας
  choice: lekwasịrị ... anya nke ọma
  rationale: Nkebiokwu a na-egosi ile mmadụ anya nke ọma, n'ụzọ siri ike ma lekwasị ya anya; ọ karịrị ile mmadụ anya nkịtị.
- source_word: δὲ
  choice: wee
  rationale: N'ebe a, δέ bụ njikọ dị nro nke na-eme ka akụkọ gaa n'ihu, ọ bụghị ihe na-egosi nnukwu mmegide.
- source_word: σὺν τῷ Ἰωάννῃ
  choice: Pita na Jọn
  rationale: Nke a na-egosi na Jọn so Pita mee ihe ahụ; nhazi Igbo a na-eme ka ihe ahụ doo anya ma daa n'olu nkịtị.
- source_word: εἶπεν
  choice: sị ya
  rationale: Nke a bụ ụzọ Igbo kwụ ọtọ na nke ebumpụta ụwa isi kọwaa okwu e kwuru nye nwoke ahụ.
- source_word: Βλέψον
  choice: Lee
  rationale: Ọ bụ iwu dị mkpirikpi, nke kpọmkwem, ka nwoke ahụ tụgharịa uche na anya ya n'ebe ha nọ.
- source_word: εἰς ἡμᾶς
  choice: anyị anya
  rationale: N'okwu Igbo ‘lee anyị anya,’ ntụziaka nke ile anya n'ebe ha nọ pụtara ìhè n'ụzọ ebumpụta ụwa.
- source_word: εἰς αὐτόν
  choice: nwoke ahụ anya
  rationale: Nke a na-akọwa onye Pita na Jọn lekwasịrị anya n'ụzọ doro anya ma kwekọọ na ojiji Igbo.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị mfe nghọta ma nwee ugwu. E tinyere Pita na Jọn dịka isiokwu ọnụ iji gosipụta na ha abụọ lekwasịrị nwoke ahụ anya, ebe Pita bụ onye kwuru okwu ahụ.
