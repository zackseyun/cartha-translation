  text: καὶ εἶδεν ⸂πᾶς ὁ λαὸς αὐτὸν⸃ περιπατοῦντα καὶ αἰνοῦντα τὸν θεόν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/009.yaml
  text: And all the people saw him walking and praising God,
translation:
  language: ig
  text: Ndị mmadụ niile hụkwara ya ka ọ na-eje ije ma na-eto Chineke.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: -kwara
  rationale: Ihe mgbakwunye a jikọtara omume a na akụkọ bu ya ụzọ n'ụzọ Igbo dị ụtọ, n'etinyeghị ike oge nke na-adịghị na Grik.
- source_word: εἶδεν
  choice: hụrụ
  rationale: Okwu a na-akọ na ndị mmadụ ji anya ha hụ nwoke ahụ a gwọrọ; ‘hụrụ’ bụ okwu Igbo nkịtị dabara kpọmkwem.
- source_word: πᾶς ὁ λαὸς
  choice: ndị mmadụ niile
  rationale: Ọ na-egosi ndị ahụ niile dịka otu ìgwè; nsụgharị a bụ nke doro anya ma bụrụkwa Igbo a na-asụ ugbu a.
- source_word: αὐτὸν
  choice: ya
  rationale: Nnọchiaha a na-arụtụ aka n nwoke ahụ a gwọrọ n'amaokwu ndị bu ụzọ.
- source_word: περιπατοῦντα
  choice: ka ọ na-eje ije
  rationale: Ọnọdụ omume na-aga n'ihu na-egosi ihe ndị ahụ hụrụ, ma na-eme ka eziokwu banyere ọgwụgwọ ahụ pụta ìhè.
- source_word: καὶ αἰνοῦντα
  choice: ma na-eto
  rationale: ‘Na-eto’ na-egosi otuto a na-enye Chineke, ma jikọta omume abụọ ahụ n'Igbo dị mfe.
- source_word: τὸν θεόν
  choice: Chineke
  rationale: Ọ bụ onye a na-eto; ‘Chineke’ bụ aha kwesịrị ekwesị na Standard Igbo.
theological_decisions: []
