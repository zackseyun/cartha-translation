id: ACT.3.7
reference: Acts 3:7
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ πιάσας αὐτὸν τῆς δεξιᾶς χειρὸς ἤγειρεν ⸀αὐτόν· παραχρῆμα δὲ ἐστερεώθησαν ⸂αἱ βάσεις αὐτοῦ⸃ καὶ τὰ ⸀σφυδρά,
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/007.yaml
  text: And taking him by the right hand[a], he raised him up; and immediately his feet and ankles were strengthened.
translation:
  language: ig
  text: O wee jide ya n’aka nri, bulie ya elu; ozugbo ahụ, ụkwụ ya na nkwonkwo ụkwụ ya[a] nwetara ike.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ọkpụkpụ nkwonkwo ụkwụ ya.”
    reason: Okwu Grik σφυδρά nwere ike izo aka n’ozuzu ya na nkwonkwo ụkwụ ma ọ bụ, n’ụzọ akọwapụtara karị, n’ọkpụkpụ ndị dị n’akụkụ nkwonkwo ụkwụ.
lexical_decisions:
- source_word: πιάσας
  choice: jide
  rationale: Okwu a na-egosi na o ji aka ya kpọrọ nwoke ahụ aka tupu o welie ya; “jide” bụ okwu Igbo doro anya nke na-adịghị enye omume ahụ echiche ike ma ọ bụ ihe ike na-adịghị na ọnọdụ a.
- source_word: τῆς δεξιᾶς χειρός
  choice: n’aka nri
  rationale: Nke a bụ ụzọ Igbo si ekwu n'ụzọ ebumpụta ụwa na a jidere mmadụ n’aka nri; onye nwe aka ahụ pụtara ìhè site n’ọnọdụ okwu ahụ n’agbanyeghị na Grik ekwughị nnọchiaha nwe kpọmkwem.
- source_word: ἤγειρεν αὐτόν
  choice: welie ya ọtọ
  rationale: “Welie ya ọtọ” na-egosi omume anụ ahụ nke ime ka nwoke ahụ bilie, ma ọ naghị atụkwasị nkọwa ọzọ banyere otú ọgwụgwọ ahụ si mee.
- source_word: παραχρῆμα
  choice: ozugbo ahụ
  rationale: Ọ na-egosi na mgbanwe ahụ mere n’otu ntabi anya; “ozugbo ahụ” bụ okwu Igbo nkịtị, kpọmkwem, ma kwekọọ n’akụkọ ahụ.
- source_word: ἐστερεώθησαν
  choice: nwetara ike
  rationale: Nhọrọ a na-egosi na akụkụ ụkwụ ndị ahụ ghọrọ ndị siri ike ma nwee ike ịrụ ọrụ, na-enweghị ịkpọ onye mere ka ha sie ike aha n’ahịrịokwu a.
- source_word: αἱ βάσεις αὐτοῦ
  choice: ụkwụ ya
  rationale: βάσεις bụ akụkụ ndị ahụ na-akwado mmadụ mgbe ọ na-eguzo; “ụkwụ ya” bụ ntụgharị Igbo kachasị doo anya ma bụrụ nke ebumpụta ụwa n’ọnọdụ ahụ.
- source_word: τὰ σφυδρά
  choice: nkwonkwo ụkwụ ya
  rationale: Okwu Grik ahụ na-ezo aka n’akụkụ ma ọ bụ nkwonkwo ụkwụ dị n’etiti ụkwụ na okpuru ụkwụ; “nkwonkwo ụkwụ” doro anya, ebe nkọwa “ọkpụkpụ” ga-adị kpọmkwem karịa ihe okwu ahụ chọrọ.
theological_decisions:
- issue: Ụdị nkọwa ọgwụgwọ ahụ
  choice: Kọwaa ya dị ka inweta ike ozugbo n’ụkwụ na nkwonkwo ụkwụ, n’enweghị ịgbakwụnye otú ọrụ ebube ahụ si mee ma ọ bụ onye mere ya n’ahịrịokwu a.
  alternative: Ịsị kpọmkwem na “a gwọrọ ya” ma ọ bụ ịkpọ Chineke aha dịka onye nyere ike ahụ.
  rationale: 'Grik na-akọ ihe mere n’ahụ nwoke ahụ kpọmkwem: ụkwụ na nkwonkwo ụkwụ ya nwetara ike. Ọnọdụ gbara amaokwu ahụ gburugburu na-egosi ọrụ ebube ahụ, ya mere ntụgharị ekwesịghị itinye nkọwa nkà mmụta okpukpe nke ahịrịokwu ahụ n’onwe ya na-ekwughị.'
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta mee ihe. Usoro “O wee…” na-edebe njikọ akụkọ ahụ, ebe “welie ya ọtọ” na “nwetara ike” na-enye okwu ahụ ọdịdị ebumpụta ụwa n’Igbo n’enweghị ịgbakwunye nkọwa na-adịghị na Grik.
