id: ACT.3.13
reference: Acts 3:13
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ θεὸς Ἀβραὰμ καὶ ⸂Ἰσαὰκ καὶ⸃ Ἰακώβ, ὁ θεὸς τῶν πατέρων ἡμῶν, ἐδόξασεν τὸν παῖδα αὐτοῦ Ἰησοῦν, ὃν ὑμεῖς ⸀μὲν παρεδώκατε καὶ ⸀ἠρνήσασθε κατὰ πρόσωπον Πιλάτου, κρίναντος ἐκείνου ἀπολύειν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/013.yaml
  text: The God of Abraham and Isaac and Jacob[a], the God of our fathers, has glorified his servant Jesus, whom you handed over and denied before Pilate, when he had decided to release him.
translation:
  language: ig
  text: Chineke nke Ebraham na Aịzik na Jekọb, Chineke nke ndị nna nna anyị, enyela Jizọs, bụ́ ohu ya, otuto. Unu nyefere ya ma gọnarị ya n'ihu Paịlet, mgbe Paịlet kpebiri ịhapụ ya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ θεὸς Ἀβραὰμ καὶ Ἰσαὰκ καὶ Ἰακώβ
  choice: Chineke nke Ebraham na Aịzik na Jekọb
  rationale: E debere njikọ ‘na’ ugboro ugboro iji chekwaa usoro ọgbụgba ndụ ahụ dị na Grik na nkwughachi ya nke Ọpụpụ 3:6.
- source_word: ὁ θεὸς τῶν πατέρων ἡμῶν
  choice: Chineke nke ndị nna nna anyị
  rationale: ‘Ndị nna nna anyị’ bụ okwu Igbo doro anya ma dị ebube maka ndị nna ochie/ndị nna nna, ma na-echekwa ụda akụkọ ọgbụgba ndụ ahụ.
- source_word: ἐδόξασεν
  choice: enyela ... otuto
  rationale: Nke a na-egosipụta omume Chineke nke inye Jizọs otuto, na-ahapụkwa mkpa omume ahụ ka ọ dị ruo ugbu a n'Igbo nkịtị.
- source_word: τὸν παῖδα αὐτοῦ Ἰησοῦν
  choice: Jizọs, bụ́ ohu ya
  rationale: παῖς nwere ike ịbụ nwa ma ọ bụ ohu, ma ‘ohu’ kacha kwekọọ na nkwughachi asụsụ Ohu Onyenwe anyị dị n'Aịzaya; e tinyere nhọrọ ọzọ n'ala peeji.
- source_word: παρεδώκατε
  choice: unu nyefere
  rationale: ‘Nyefere’ na-egosi inyefe Jizọs n'aka ndị ọchịchị, n'etinyeghị echiche nkọwa ọzọ nke ‘ịrara mmadụ nye.’
- source_word: ἠρνήσασθε
  choice: jụ
  rationale: ‘Jụ’ bụ okwu Igbo eke nke na-egosi na ha ekwetaghị ma ọ bụ nabata Jizọs n'ihu Paịlet.
- source_word: κατὰ πρόσωπον Πιλάτου
  choice: n'ihu Paịlet
  rationale: Nke a bụ ụzọ Igbo nkịtị isi kwuo na ihe ahụ mere n'ọnụnọ Paịlet, kwekọrọ na akpaalaokwu Grik.
- source_word: κρίναντος ἐκείνου ἀπολύειν
  choice: mgbe Paịlet kpebiri ịhapụ ya
  rationale: A kpọrọ Paịlet aha ọzọ iji wepụ mgbagwoju anya nke nnọchiaha n'Igbo; ‘mgbe’ na-echekwa nghọta oge nke nkebi ahụ n'enweghị ịgbakwunye nkwenye concessive ‘ọ bụ ezie na.’
theological_decisions:
- issue: Nsụgharị παῖς mgbe ọ na-ekwu maka Jizọs
  choice: ohu
  alternative: nwa
  rationale: ‘Ohu’ na-echekwa njikọ a pụrụ ịhụ n'asụsụ Ohu Onyenwe anyị nke Aịzaya, ma a naghị ezobe nghọta ‘nwa’ nke okwu Grik nwere ike inwe; e gosiri ya n'ala peeji.
- issue: Oge/aspekt nke ἐδόξασεν
  choice: enyela ... otuto
  alternative: nyere ... otuto
  rationale: Ụdị a na-eme ka omume gara aga nke Chineke na mkpa ya dị ugbu a pụta ìhè, n'agbanyeghị na aorist Grik n'onwe ya anaghị amanye ụdị perfect.
- issue: Mmekọrịta nkebi κρίναντος ἐκείνου ἀπολύειν
  choice: mgbe Paịlet kpebiri ịhapụ ya
  alternative: ọ bụ ezie na Paịlet kpebiri ịhapụ ya
  rationale: E debere njikọ ahụ dịka nke oge, n'ihi na participle Grik anaghị ekwu hoo haa na ọ bụ concessive; otú a ka a na-echekwa obere mgbagwoju anya nke isi mmalite.
translation_notes:
  register: Standard Igbo; asụsụ dị ugbu a, kwụ ọtọ ma dị ùgwù. E ji ‘bụ́’ mee nkọwa appositional nke ọma, kpọọkwa Paịlet aha na nkebi ikpeazụ ka nnọchiaha ghara ịdị mgbagwoju anya.
