  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸂Πέτρος δὲ⸃ καὶ Ἰωάννης ἀνέβαινον εἰς τὸ ἱερὸν ἐπὶ τὴν ὥραν τῆς προσευχῆς τὴν ἐνάτην,
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/001.yaml
  text: Peter and John were going up to the temple at the hour of prayer[a], the ninth hour.
translation:
  language: ig
  text: Pita na Jọn nọ na-arịgo n'ụlọ nsọ n'oge ekpere[a], n'awa nke itoolu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ya bụ, ihe dị ka elekere atọ nke ehihie n'usoro oge anyị nke oge a.
    reason: cultural_note
lexical_decisions:
- source_word: δέ
  choice: E gosipụtaghị ya iche n'Igbo
  rationale: N'ebe a, δέ bụ njikọ dị nro na-aga n'ihu n'akụkọ ahụ, ọ bụghị okwu na-egosi nnukwu mmegide. Igbo sitere n'usoro ahịrịokwu na ọnọdụ ya eme ka njikọ ahụ doo anya n'enweghị itinye “Ugbu a,” nke pụrụ iyi ka ọ na-ekwu banyere oge.
- source_word: ἀνέβαινον
  choice: nọ na-arịgo
  rationale: Ụdị imperfect na-egosi omume nọ na-aga n'ihu n'oge gara aga. “Nọ na-arịgo” na-echekwa akụkụ a, ma “rịgoro” naanị agaghị egosipụta ya nke ọma. “Arịgo” na-echekwakwa echiche nke ịrịgo Jeruselem/ụlọ nsọ.
- source_word: ἱερόν
  choice: ụlọ nsọ
  rationale: ἱερόν na-ezo aka n'ogige na mpaghara ụlọ nsọ dum, ọ bụghị naanị ebe nsọ dị n'ime (ναός). “Ụlọ nsọ” bụ okwu Igbo doro anya ma bụrụkwa nke a na-ejikarị eme ihe.
- source_word: ἐπὶ τὴν ὥραν
  choice: n'oge
  rationale: N'okwu a banyere oge a kara aka, “n'oge” bụ ụzọ Igbo ebumpụta ụwa si egosi na ha na-aga ebe ahụ maka oge ahụ.
- source_word: τῆς προσευχῆς
  choice: ekpere
  rationale: '“N''oge ekpere” na-enye ihe genitive ahụ pụtara n''Igbo dị mfe ma doo anya: oge a kara aka maka ekpere.'
- source_word: τὴν ἐνάτην
  choice: n'awa nke itoolu
  rationale: A hapụrụ usoro oge ndị Juu dị n'ihe odide ahụ kama iji oge nke oge a dochie ya n'ahịrịokwu bụ isi; nkọwa oge nke oge a dị n'okpuru peeji.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo Izugbe, nke dị ugwu ma dị mfe nghọta. “Pita na Jọn nọ na-arịgo” na-ada nke ọma n'Igbo ma na-echekwa omume na-aga n'ihu; “ụlọ nsọ” bụ okwu a maara nke ọma, ebe nkọwa oge dị na ntụaka ala peeji.
