revisions:
- from: Onye ọ bụla nke na-agaghị ege onye amụma ahụ ntị, a ga-ebibicha ya site n’etiti ndị ahụ[a].
  to: Onye ọ bụla nke na-adịghị ege onye amụma ahụ ntị, a ga-ebibi ya kpamkpam site n’etiti ndị mmadụ[a].
  rationale: The revision makes the indefinite warning idiomatic in Standard Igbo, clarifies the communal-removal phrase, and expresses the verb’s intensive force naturally. It retains the source’s ambiguity concerning the nature and timing of the judgment.
  reviewer_model: gpt-5.6-terra
