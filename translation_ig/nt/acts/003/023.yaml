  text: ἔσται δὲ πᾶσα ψυχὴ ἥτις ⸀ἂν μὴ ἀκούσῃ τοῦ προφήτου ἐκείνου ἐξολεθρευθήσεται ἐκ τοῦ λαοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/023.yaml
  text: And every person who does not listen to that prophet will be utterly destroyed from among the people[a].
translation:
  language: ig
  text: Onye ọ bụla nke na-adịghị ege onye amụma ahụ ntị, a ga-ebibi ya kpamkpam site n’etiti ndị mmadụ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “a ga-ebipụ ya site n’etiti ndị mmadụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶσα ψυχὴ
  choice: Onye ọ bụla
  rationale: N’akpaala okwu a, ψυχή na-ezo aka n’otu onye, ọ bụghị naanị ‘mkpụrụ obi’ dị ka akụkụ mmadụ. ‘Onye ọ bụla’ bụ Igbo doro anya ma bụrụkwa nke e ji eme ihe taa.
- source_word: ἥτις ἂν μὴ ἀκούσῃ
  choice: nke na-agaghị ege ... ntị
  rationale: Nkebiokwu a na-egosi onye ọ bụla jụrụ ịnụrụ ma rubere onye amụma ahụ isi. ‘Ige ... ntị’ na-echekwa echiche nke ịnụrụ okwu ya nke ọma ma nabata ya, n’enweghị ime ka nkọwa ahụ gabiga ihe Grik kwuru.
- source_word: τοῦ προφήτου ἐκείνου
  choice: onye amụma ahụ
  rationale: Ọ na-atụ aka n’onye amụma ahụ e kwuru okwu ya n’amaokwu ndị bu ụzọ. E meghị ya aha-ọkwa pụrụ iche n’ụzọ ga-etinye nkọwa ọzọ na Grik.
- source_word: ἐξολεθρευθήσεται
  choice: a ga-ebibicha ya
  rationale: Ngwaa a siri ike karịa naanị ‘ibibi’; ọ na-egosi mbibi ma ọ bụ iwepụ kpamkpam. ‘A ga-ebibicha ya’ na-echekwa ike ahụ n’Igbo dị mfe nghọta.
- source_word: ἐκ τοῦ λαοῦ
  choice: site n’etiti ndị ahụ
  rationale: ἐκ na-egosi iwepụ mmadụ n’ime ndị ahụ. ‘Site n’etiti ndị ahụ’ na-echekwa echiche nke iwepụ ya n’obodo ahụ, n’etinyeghị nnọchiaha nwe nke na-adịghị na Grik.
theological_decisions:
- issue: Ụdị ikpe a na-eyi onye jụrụ ige onye amụma ahụ ntị egwu
  choice: E gosipụtara ya dị ka mbibi ma ọ bụ iwepụ n’etiti ndị ahụ, n’akọwaghị oge ya ma ọ bụ kpọmkwem ụdị ikpe ahụ.
  alternative: Ịchụpụ n’obodo ọgbụgba ndụ naanị, ma ọ bụ ikpe ikpeazụ nke Chineke naanị.
  rationale: Amaokwu ahụ na-ekwupụta ikpe siri ike, ma ọ kọwaghị ma ọ bụ ikpe n’oge ndụ a, iwepụ n’obodo ọgbụgba ndụ, ka ọ bụ ikpe ikpeazụ. Nsụgharị ahụ hapụrụ esemokwu nkà mmụta okpukpe a ka ọ dị.
translation_notes:
  register: Igbo ọkọlọtọ nke oge a, dị ugwu ma dị mfe nghọta. E ji ‘onye ọ bụla’ zere nghọtahie nke ‘mkpụrụ obi ọ bụla,’ ma e ji ‘ebibicha’ chekwaa ịdị ike nke ngwaa Grik.
