id: ACT.3.16
reference: Acts 3:16
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ⸀ἐπὶ τῇ πίστει τοῦ ὀνόματος αὐτοῦ τοῦτον ὃν θεωρεῖτε καὶ οἴδατε ἐστερέωσεν τὸ ὄνομα αὐτοῦ, καὶ ἡ πίστις ἡ δι’ αὐτοῦ ἔδωκεν αὐτῷ τὴν ὁλοκληρίαν ταύτην ἀπέναντι πάντων ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/016.yaml
  text: And on the basis of faith in his name[a], his name itself has made strong this man whom you see and know[c][b]; and the faith that is through him has given him this wholeness in the presence of all of you.
translation:
  language: ig
  text: Ọ bụ n’ihi okwukwe n’aha ya[a] ka aha ya n’onwe ya mere ka nwoke a, onye unu na-ahụ ma na-amata, sie ike[c]; okwukwe ahụ nke dị site n’aka ya[d] enyela ya ahụ ike zuru oke a[b] n’ihu unu niile.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ntụkwasị obi n’aha ya.” Okwu Grik bụ pistis nwere ike ịpụta “okwukwe,” “ntụkwasị obi,” ma ọ bụ, n’ọnọdụ ụfọdụ, “ikwesị ntụkwasị obi.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ahụ ike zuru ezu” ma ọ bụ “ahụ ike zuru oke.”
    reason: lexical_alternative
  - marker: c
    text: A pụkwara ịsụ ya, “aha ya emeela ka nwoke a sie ike.”
    reason: previous_rendering
  - marker: d
    text: “Nke dị site n’aka ya” nwekwara ike ịpụta okwukwe nke Jizọs na-eweta ma ọ bụ nke a na-enweta site n’aka ya. Grik ekwughị kpọmkwem onye mmadụ nwere okwukwe ahụ.
    reason: theological_ambiguity
lexical_decisions:
- source_word: ἐπὶ τῇ πίστει
  choice: na ndabere nke okwukwe
  rationale: ἐπί ya na dative nwere ike igosi ihe e ji mere ntọala ma ọ bụ ihe kpatara ihe. “Na ndabere nke okwukwe” na-edobe echiche ahụ nke ọma karịa naanị “site n’okwukwe.”
- source_word: πίστει
  choice: okwukwe
  rationale: N’ebe a πίστις pụtara ịtụkwasị Jizọs obi. “Okwukwe” bụ okwu Igbo a na-ejikarị eme ihe n’ụzọ doro anya; e debere “ntụkwasị obi” dị ka ụzọ ọzọ n’okpuru ala.
- source_word: τοῦ ὀνόματος αὐτοῦ
  choice: n’aha ya
  rationale: Genitive a na-akọwa ihe okwukwe ahụ lekwasịrị anya na ya. N’Ọrụ Ndịozi, “aha” na-anọchikarị onye Jizọs bụ na ikike ya, ma a hapụrụ okwu ahụ dịka ọ dị n’asụsụ Grik.
- source_word: ἐστερέωσεν
  choice: mee ka … sie ike
  rationale: Ngwaa ahụ pụtara ime ka ihe guzosie ike ma ọ bụ sie ike; nsụgharị a dabara n’ahụ nwoke ahụ a gwọrọ.
- source_word: θεωρεῖτε καὶ οἴδατε
  choice: unu na-ahụ ma marakwa
  rationale: Nke a na-edobe ma ịhụ nwoke ahụ anya ma ịmata onye ọ bụ, nke na-egosi na ọgwụgwọ ahụ mere n’ihu ọha.
- source_word: τὸ ὄνομα αὐτοῦ
  choice: aha ya n’onwe ya
  rationale: A nọgidere na-ekwughachi “aha ya” dịka Grik si mee. “N’onwe ya” na-eme ka nkwughachi ahụ doo anya ma mesie isiokwu ahịrịokwu ahụ ike.
- source_word: ἡ πίστις ἡ δι’ αὐτοῦ
  choice: okwukwe ahụ nke sitere n’aka ya
  rationale: Nke a na-asụ Igbo nke ọma ma na-egosi njikọ okwukwe ahụ na Jizọs. Ihe odide Grik anaghị akọwa kpọmkwem ma ọ bụ okwukwe Jizọs na-ebute, nke a na-enweta site n’aka ya, ma ọ bụ nke ọ bụ onye ogbugbo ya; a kọwara nghọta ndị ahụ n’okpuru ala.
- source_word: ἔδωκεν αὐτῷ
  choice: enyela ya
  rationale: Ụdị a na-egosi omume e mere nke nsonaazụ ya ka dị ugbu a ma bụrụ ihe ndị niile nọ ebe ahụ na-ahụ.
- source_word: ὁλοκληρίαν
  choice: ahụ ike zuru oke
  rationale: N’ọnọdụ ọgwụgwọ anụ ahụ a, okwu ahụ na-egosi ịdị mma na izu oke nke ahụ. “Ahụ ike zuru oke” bụ okwu Igbo doro anya ma dị ndụ.
- source_word: ἀπέναντι πάντων ὑμῶν
  choice: n’ihu unu niile
  rationale: Nke a na-edobe echiche na ọgwụgwọ ahụ mere n’ihu ọha, ebe ndị niile na-ege ntị hụrụ ya.
theological_decisions:
- issue: Onye nwere okwukwe ahụ na ụzọ okwukwe ahụ si metụta ọgwụgwọ
  choice: E kwughị onye mmadụ nwere okwukwe ahụ; a hapụrụ ya ka o jikọọ na aha Jizọs ma sikwa n’aka ya.
  alternative: Ọ bụ okwukwe nwoke a gwọrọ; ọ bụ okwukwe Pita na Jọn; ma ọ bụ Jizọs n’onwe ya mere ka okwukwe ahụ dịrị.
  rationale: Grik kpọrọ “okwukwe n’aha ya” na “okwukwe nke sitere n’aka ya,” ma ọ kpọghị onye mmadụ nwere okwukwe ahụ. Nsụgharị ahụ ekwesịghị idozi ihe ederede ahụ hapụrụ ghe oghe.
- issue: “Aha” dịka ihe na-anọchi anya onye na ikike ya
  choice: E debere “aha ya” n’ahịrịokwu bụ isi.
  alternative: Jizọs n’onwe ya; ike nke aha Jizọs.
  rationale: Luk mesiri aha Jizọs ike ma kwughachi ya. Idebe “aha” na-echekwa ụzọ o si kwuo okwu na ibu nkà mmụta okpukpe dị na ya.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta, dee ya. Ahịrịokwu ahụ na-edobe nkwughachi “aha ya” na nrụgide okwu Grik, ma jiri “aha ya n’onwe ya” mee ka usoro ahụ bụrụ nke a na-anụ nke ọma n’Igbo. E tinyere akara nkọwa ala niile [a]–[d] n’ahịrịokwu bụ isi.
