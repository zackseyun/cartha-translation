revisions:
- from: Ọ bụkwa na ndabere nke okwukwe n’aha ya[a] ka aha ya n’onwe ya ji mee ka nwoke a unu na-ahụ ma marakwa sie ike[c]; okwukwe ahụ nke sitere n’aka ya[d] enyela ya ahụ ike zuru oke a[b] n’ihu unu niile.
  to: Ọ bụ n’ihi okwukwe n’aha ya[a] ka aha ya n’onwe ya mere ka nwoke a, onye unu na-ahụ ma na-amata, sie ike[c]; okwukwe ahụ nke dị site n’aka ya[d] enyela ya ahụ ike zuru oke a[b] n’ihu unu niile.
  rationale: The revision repairs the opening clause into idiomatic Standard Igbo, retains the emphatic repetition of “aha ya,” and adjusts the second faith clause to represent δι’ αὐτοῦ as mediation without resolving the disputed agency or ownership of the faith. The health footnote is also made semantically precise and natural.
