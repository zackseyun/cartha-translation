base_translation:
  language: en
  yaml_path: translation/nt/acts/003/019.yaml
  text: Therefore repent and turn back[a], so that your sins may be wiped away,
translation:
  language: ig
  text: Ya mere, chegharịanụ, laghachinụ, ka e wee hichapụ mmehie unu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ka e wee kpochapụ mmehie unu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μετανοήσατε
  choice: chegharịanụ
  rationale: Okwu iwu a na-akpọ ndị na-ege ntị ka ha mee mkpebi doro anya ịgbanwe obi na ụzọ ha. “Chegharịanụ” bụ okwu Igbo a na-aghọta nke ọma maka nchegharị, ọ dịghịkwa eme ka okwu ahụ bụrụ naanị mgbanwe echiche.
- source_word: οὖν
  choice: Ya mere
  rationale: Ọ na-egosi nkwubi okwu sitere n’ihe Pita kwuru tupu nke a; “Ya mere” na-egosipụta njikọ ahụ n’Igbo eke.
- source_word: ἐπιστρέψατε
  choice: laghachikwutekwa Chineke
  rationale: Ọ na-egosi ịtụgharị ma laghachikwute onye a hapụrụ. Etinyere “Chineke” iji mee ka ebe ntụgharị ahụ na-aga doo anya n’Igbo, dịka ihe gbara amaokwu ahụ gburugburu si gosi, ma ghara iji okwu nwere ike ịpụta ihe a na-eme mmadụ n’amaghị onwe ya.
- source_word: πρὸς τὸ ἐξαλειφθῆναι
  choice: ka e wee hichapụ
  rationale: Usoro a na-echekwa nghọta nke nzube ma ọ bụ ihe ga-esi na ya pụta, n’enweghị ịkọwa usoro nkà mmụta okpukpe karịrị ihe ederede kwuru.
- source_word: ἐξαλειφθῆναι
  choice: hichapụ
  rationale: “Hichapụ” na-echekwa onyinyo nke iwepụ ihe e dere ma ọ bụ akara ruo mgbe ọ na-adịkwaghị, ma bụrụkwa okwu Igbo nke oge a dị mfe nghọta.
- source_word: ἁμαρτίας
  choice: mmehie
  rationale: “Mmehie” bụ ntụgharị Igbo kwụ ọtọ ma zuru ezu maka ọtụtụ omume mmehie e kwuru n’ụdị ọtụtụ.
theological_decisions:
- issue: Mmekọrịta dị n’etiti nchegharị, ịlaghachikwute Chineke, na mgbaghara mmehie
  choice: ka e wee hichapụ mmehie unu
  alternative: maka ihichapụ mmehie unu
  rationale: Nsụgharị ahụ na-edobe njikọ nke ederede mere n’etiti iwu abụọ ahụ na ihichapụ mmehie, ma ọ naghị akọwa kpọmkwem usoro nzọpụta ma ọ bụ tinye ozizi otu chọọchị n’ime amaokwu ahụ.
translation_notes:
  register: 'E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. A na-eji ụdị ọtụtụ na-asọpụrụ ihe odide Grik: “chegharịanụ,” “laghachikwutenụ,” na “unu.” E debere akara nkọwa ụkwụ ozugbo n’akụkụ okwu “hichapụ mmehie unu,” bụ́ ebe nhọrọ okwu ahụ metụtara.'
