source:
  edition: SBLGNT
  text: καὶ πάντες δὲ οἱ προφῆται ἀπὸ Σαμουὴλ καὶ τῶν καθεξῆς ὅσοι ἐλάλησαν καὶ κατήγγειλαν τὰς ἡμέρας ταύτας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/024.yaml
  text: And all the prophets from Samuel and those after him[a], as many as spoke[c][b], also announced these days.
translation:
  language: ig
  text: Ndị amụma niile, malite na Samuel na ndị sochiri ya[a]—ndị niile kwuru okwu—kwupụtakwara[c] banyere ụbọchị ndị a[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị bịara n’usoro mgbe ọ gasịrị.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “oge ndị a.” Okwu a na-ezo aka n’oge mmezu dị ugbu a n’okwu Pita.
    reason: alternative_reading
  - marker: c
    text: Ma ọ bụ, “kpọsakwara”; n’ụzọ nkọwa karịa, “buru amụma banyere ya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντες δὲ οἱ προφῆται
  choice: Ndị amụma niile
  rationale: A hapụrụ δέ n’enweghị okwu pụrụ iche n’ihi na ọ bụ njikọ dị nro ebe a; “ndị amụma niile” na-egosipụta πάντες οἱ προφῆται nke ọma n’Igbo eke.
- source_word: ἀπὸ Σαμουὴλ
  choice: malite na Samuel
  rationale: ἀπό na-egosi ebe usoro ahụ si bido; “malite na Samuel” doro anya ma bụrụkwa Igbo eke.
- source_word: τῶν καθεξῆς
  choice: ndị sochiri ya
  rationale: καθεξῆς na-egosi ndị bịara n’usoro mgbe Samuel gasịrị; ntụgharị a na-edobe echiche nke succession n’enweghị nkọwa agbakwunyere.
- source_word: ὅσοι ἐλάλησαν
  choice: ndị niile kwuru okwu
  rationale: ὅσοι nwere nghọta nke ndị niile ruru n’ókè ahụ, ebe ἐλάλησαν bụ “kwuru okwu”; ntụgharị a bụ nke nkịtị ma na-edobe obosara okwu ahụ.
- source_word: καὶ κατήγγειλαν
  choice: kwupụtakwara banyere
  rationale: καταγγέλλω pụtara ikwupụta ma ọ bụ ịkpọsa; “kwupụtakwara banyere” na-ejikọta ngwaa ahụ na ihe e kwupụtara n’Igbo doro anya, na-enweghị ịkọwa ya kpọmkwem dị ka ibu amụma tupu oge eruo.
- source_word: τὰς ἡμέρας ταύτας
  choice: ụbọchị ndị a
  rationale: Nke a bụ ntụgharị kpọmkwem nke ahịrịokwu Grik ma na-ahapụ nghọta gbasara oge mmezu dị ugbu a ka ihe gbara ya gburugburu kọwaa ya.
theological_decisions:
- issue: Oge ndị amụma kwupụtara nke metụtara mmezu dị ugbu a n’okwu Pita
  choice: ụbọchị ndị a
  alternative: oge ndị a
  rationale: “Ụbọchị ndị a” na-edobe ihe oyiyi oge nke Grik, ma ọ naghị eme ka nkọwa banyere oge Mesaịa doo anya karịa ka ederede n’onwe ya mere.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji akara nkwụsị kewaa ahịrịokwu mgbakwunye ahụ iji mee ka usoro Grik doo anya n’Igbo. Akara nkọwa ala ala niile dị n’ederede isi.
