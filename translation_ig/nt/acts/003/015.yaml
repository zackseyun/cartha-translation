  text: τὸν δὲ ἀρχηγὸν τῆς ζωῆς ἀπεκτείνατε, ὃν ὁ θεὸς ἤγειρεν ἐκ νεκρῶν, οὗ ἡμεῖς μάρτυρές ἐσμεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/015.yaml
  text: but you killed the Author of life[a], whom God raised from the dead[b], of which we are witnesses.
translation:
  language: ig
  text: Ma unu gburu Onyeisi nke ndụ[a], onye Chineke mere ka o si ná ndị nwụrụ anwụ bilie; anyị bụ ndị akaebe banyere nke a.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịtụgharị ya, “Onye Ndú nke ndụ,” “Onye Malitere ndụ,” ma ọ bụ “Onye bụ Isi Iyi nke ndụ.” Okwu Grik ἀρχηγός nwere ike ịpụta onye ihe si n'aka ya malite, onye ndú, ma ọ bụ onye nọ n'isi.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịtụgharị ya, “anyị bụ ndị akaebe ya.” Okwu Grik nwere ike izo aka ma n'onye ahụ Chineke mere ka o bilie ma n'eziokwu nke mbilite n'ọnwụ ya.
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: Ma
  rationale: 'N''ebe a δέ na-ejikọta okwu a na ebubo bu ya ụzọ ma na-egosikwa ntụgharị dị ike: ha họọrọ onye na-egbu mmadụ, ma gbuo onye metụtara ndụ n''onwe ya.'
- source_word: ἀρχηγὸν τῆς ζωῆς
  choice: Onye Isi Iyi nke ndụ
  rationale: ἀρχηγός nwere ike ịpụta onye malitere ihe, onye ndu, ma ọ bụ onye nọ n'isi. “Onye Isi Iyi nke ndụ” na-eme ka echiche mmalite na inye ndụ pụta ìhè n'Igbo dị mfe nghọta, ebe nkọwa ala peeji na-echekwa echiche ndị ọzọ dị n'okwu Grik.
- source_word: ἀπεκτείνατε
  choice: unu gburu
  rationale: Nke a na-ekwu omume ahụ kpọmkwem n'asụsụ Igbo nkịtị, n'etinyeghị echiche iwu ọzọ nke ngwaa Grik ekwughị.
- source_word: ἤγειρεν ἐκ νεκρῶν
  choice: mere ka o si ná ndị nwụrụ anwụ bilie
  rationale: Nke a bụ ụzọ Igbo doro anya isi kwuo na Chineke mere ka ọ bilie n'ọnwụ, ma na-echekwa ἐκ, ya bụ isi n'etiti ndị nwụrụ anwụ pụta.
- source_word: οὗ ἡμεῖς μάρτυρές ἐσμεν
  choice: anyị bụkwa ndị akaebe banyere nke a
  rationale: “Nke a” nwere ike ịtụ aka n'ihe e kwuru ozugbo—mbilite n'ọnwụ ya—ma nkọwa ala peeji na-echekwa ohere ụtọasụsụ nke ịtụ aka n'onye ahụ n'onwe ya.
theological_decisions:
- issue: Nkọwa ἀρχηγός dị ka aha Kraịst
  choice: Onye Isi Iyi nke ndụ
  alternative: Onye Ndú nke ndụ; Onye Malitere ndụ; Onyeisi nke ndụ
  rationale: Okwu Grik ahụ jikọtara echiche nke mmalite, idu ndú, na ịdị n'isi. Nhọrọ a na-eme ka ihe ijuanya dị n'amaokwu ahụ doo anya—ha gburu onye bụ isi iyi nke ndụ—ma footnote na-edebe obosara okwu ahụ.
- issue: Ihe οὗ na-ezo aka na ya
  choice: anyị bụkwa ndị akaebe banyere nke a
  alternative: anyị bụkwa ndị akaebe ya
  rationale: Grik nwere ike izo aka n'onye ahụ e mere ka o bilie ma ọ bụ n'eziokwu nke mbilite n'ọnwụ. Isi okwu na-ahọrọ ihe omume ahụ dị ka ihe dị nso, ma anaghị ezobe nhọrọ nke ọzọ.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji “unu” mee ka ebubo Pita kpọmkwem pụta; e zere okwu ụka pụrụ iche. A tinyere akara ala peeji [a] na [b] n'ahịrị bụ isi.
