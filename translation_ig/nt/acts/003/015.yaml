revisions:
- from: Ma unu gburu Onye Isi Iyi nke ndụ[a], onye Chineke mere ka o si ná ndị nwụrụ anwụ bilie; anyị bụkwa ndị akaebe banyere nke a.[b]
  to: Ma unu gburu Onyeisi nke ndụ[a], onye Chineke mere ka o si ná ndị nwụrụ anwụ bilie; anyị bụ ndị akaebe banyere nke a.[b]
  rationale: The revised title replaces a restrictive source-image with the more idiomatic and semantically broader “Onyeisi nke ndụ.” The footnote retains the originative, leadership, and source-related alternatives. The witness clause removes an unrepresented additive particle while preserving the draft’s legitimate event-reference and its ambiguity note.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T08:27:48Z'
review_pass:
  verdict: revise
  source_fidelity: The main clause and resurrection statement accurately convey ἀπεκτείνατε and ἤγειρεν ἐκ νεκρῶν. The rendering of οὗ as “banyere nke a” responsibly adopts the event-reference while retaining the personal-reference alternative in a note. However, “Onye Isi Iyi nke ndụ” makes Christ the ‘source/headwaters’ of life, a narrower and less direct sense than ἀρχηγός, whose relevant range is originator, leader, or prince.
  naturalness: The text is clear Standard Igbo. “Onyeisi nke ndụ” is a more established and idiomatic title than “Onye Isi Iyi nke ndụ.” Removing the added enclitic -kwa from the witness clause more closely follows the uncoordinated Greek relative clause without harming Igbo flow.
  terminology: “Onyeisi nke ndụ” preserves the leadership/preeminence sense of ἀρχηγός and is supported by the footnote’s alternatives for its originative sense. “Ndị akaebe” and “si ná ndị nwụrụ anwụ bilie” are natural, accurate terms.
  issues:
  - severity: medium
    issue: “Onye Isi Iyi nke ndụ” is used for ἀρχηγὸν τῆς ζωῆς.
    rationale: ‘Isi iyi’ normally denotes a source or spring. It over-specifies an origin/source sense and does not adequately retain the leader/prince dimension of ἀρχηγός. “Onyeisi nke ndụ” is a more natural title and leaves the broader lexical range available in the note.
  - severity: low
    issue: The witness clause has “anyị bụkwa ndị akaebe.”
    rationale: The Greek clause has no coordinating καί corresponding to -kwa. The addition is not seriously misleading, but omitting it gives a closer and smoother rendering.
  revised_text: Ma unu gburu Onyeisi nke ndụ[a], onye Chineke mere ka o si ná ndị nwụrụ anwụ bilie; anyị bụ ndị akaebe banyere nke a.[b]
  revised_footnotes:
