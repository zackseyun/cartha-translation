id: ACT.3.20
reference: Acts 3:20
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὅπως ἂν ἔλθωσιν καιροὶ ἀναψύξεως ἀπὸ προσώπου τοῦ κυρίου καὶ ἀποστείλῃ τὸν προκεχειρισμένον ὑμῖν χριστὸν Ἰησοῦν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/020.yaml
  text: so that times of refreshing may come from the presence of the Lord[a], and that he may send the Messiah appointed for you, Jesus,
translation:
  language: ig
  text: ka oge ume ọhụrụ wee si n’ihu Onyenwe anyị bịa, ka o zitekwaa Mesaya ahụ ọ họpụtara maka unu, bụ Jizọs.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “ọ họpụtara nye unu,” ma ọ bụ, “ọ họpụtaburu maka unu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπως ἂν
  choice: ka ... wee ... ka ... kwa
  rationale: Usoro a na-egosi nzube ma ọ bụ ihe ga-esi n’ọkpụkpọ oku nchegharị dị n’amaokwu bu ụzọ pụta, ma ọ naghị eme ka ihe ahụ bụrụ nkwenye a na-apụghị ịgbanwe agbanwe.
- source_word: ἔλθωσιν
  choice: wee ... bịa
  rationale: Nke a na-anọchi aorist subjunctive n'ụzọ Igbo dị ndụ ma na-edebe njikọ ya na nkebi nzube ahụ.
- source_word: καιροὶ
  choice: oge
  rationale: “Oge” nwere ike ịpụta oge ma ọ bụ mkpụrụ oge pụrụ iche n’enweghị ịkọwapụta karịa ihe Grik kwuru.
- source_word: ἀναψύξεως
  choice: ume ọhụrụ
  rationale: Nkebi a na-ekwupụta inweta ume, enyemaka, ma ọ bụ ịdị ọhụrụ; “ume ọhụrụ” na-edebe ihe atụ ahụ ma bụrụ okwu ndị mmadụ na-aghọta.
- source_word: ἀπὸ προσώπου τοῦ κυρίου
  choice: si n’ihu Onyenwe anyị
  rationale: “N’ihu” na-edebe ihe oyiyi nkịtị nke πρόσωπον ma na Igbo nwekwara nghọta nke ọnụnọ mmadụ, ya mere ọ naghị ewepụ njikọ dị n’etiti “ihu” na “ọnụnọ.”
- source_word: ἀποστείλῃ
  choice: ka o zitekwaa
  rationale: Subjunctive nke abụọ jikọrọ na nke mbụ; “ka” na-edebe njikọ nzube ahụ, “kwa” na-egosi njikọ ya na nkebi gara aga.
- source_word: προκεχειρισμένον
  choice: ọ họpụtara
  rationale: Okwu a na-egosi ịhọpụta ma ọ bụ ịkwadebe mmadụ tupu oge ahụ; isi ederede jiri “họpụtara” mee ka ahịrịokwu ahụ bụrụ nke nkịtị, ebe nkọwa ala peeji na-edebe echiche nke ịhọpụta tupu oge eruo.
- source_word: ὑμῖν
  choice: maka unu
  rationale: Dative a nwere ike ịbụ “maka unu” ma ọ bụ “nye unu”; “maka unu” dabara na onye a họpụtara n’ihi ha ma ọ bụ maka ọdịmma ha.
- source_word: χριστὸν
  choice: Mesaya
  rationale: N’ebe a χριστός bụ utu aha ahụ e kwere ná nkwa, ọ bụghị naanị akụkụ aha mmadụ; “Mesaya” na-edebe ọnọdụ ndị Juu na ihe utu aha ahụ pụtara.
- source_word: Ἰησοῦν
  choice: Jizọs
  rationale: Nke a bụ nsụgharị aha Ἰησοῦς a na-ejikarị eme ihe na Standard Igbo.
theological_decisions:
- issue: Ma a ga-asụgharị χριστὸν dị ka utu aha ka ọ bụ jiri ụdị ọdịnala “Kraịst.”
  choice: Mesaya
  alternative: Kraịst
  rationale: χριστός na-arụ ọrụ dị ka utu aha n’ebe a; “Mesaya” na-eme ka ihe utu aha ahụ pụtara doo anya ma na-edebe ọnọdụ okwu Pita.
- issue: Ihe προκεχειρισμένον ὑμῖν pụtara
  choice: ọ họpụtara maka unu
  alternative: ọ họpụtara nye unu; ọ họpụtaburu maka unu
  rationale: “Maka unu” bụ nghọta dative dabara adaba, ebe participle ahụ nwekwara echiche nke ịhọpụta tupu oge eruo. Isi ederede adịghị ebufe okwu karịa ka ọ dị mkpa, ma nkọwa ala peeji na-edebe nghọta ndị ọzọ.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. “Si n’ihu Onyenwe anyị” na-edebe ma ihe oyiyi “ihu” ma echiche nke ọnụnọ Chineke. E debere usoro nzube/ntule nke Grik site n’iji “ka ... wee” kama ime ka nsonaazụ ahụ bụrụ ihe doro anya na ọ ga-emerịrị.
