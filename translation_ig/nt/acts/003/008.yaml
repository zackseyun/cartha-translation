  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἐξαλλόμενος ἔστη καὶ περιεπάτει, καὶ εἰσῆλθεν σὺν αὐτοῖς εἰς τὸ ἱερὸν περιπατῶν καὶ ἁλλόμενος καὶ αἰνῶν τὸν θεόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/008.yaml
  text: And leaping up, he stood and began to walk, and he entered the temple with them, walking and jumping and praising God.
translation:
  language: ig
  text: Ọ wụliri elu, guzo ọtọ, malite ije. Ọ sokwa ha banye n’ụlọ nsọ, na-eje ije, na-awụli elu, na-etokwa Chineke.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξαλλόμενος
  choice: Ọ maliri elu
  rationale: Na-egosipụta mmali mbụ o mere mgbe a gwọrọ ya, ma na-edobe echiche nke isi n’otu ọnọdụ malie elu.
- source_word: περιεπάτει / περιπατῶν
  choice: malitekwa ije / na-eje ije
  rationale: Oge ngwaa Grik nke mbụ na-egosi na ọ malitere ma nọgide na-eje ije; nke abụọ na-akọwa ihe ọ nọ na-eme mgbe ọ na-abanye.
- source_word: τὸ ἱερόν
  choice: ụlọnsọ ukwu
  rationale: N’ebe a, okwu Grik na-ezo aka n’ogige na gburugburu ụlọ nsọ dum, ọ bụghị naanị ebe nsọ dị n’ime ya.
- source_word: ἁλλόμενος
  choice: na-awụlikwa elu
  rationale: Na-enye mmegharị ugboro ugboro mgbe ọ na-aga, ma na-eme ka ọ dị iche n’ije nkịtị.
- source_word: αἰνῶν τὸν θεόν
  choice: na-etokwa Chineke
  rationale: Nsụgharị kwụ ọtọ ma bụrụkwa okwu Igbo e ji ekwupụta otuto a na-enye Chineke.
