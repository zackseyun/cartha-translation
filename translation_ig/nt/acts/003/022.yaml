revisions:
- from: Mosis kwuru n’ezie, sị, “Onyenwe anyị Chineke ga-eme ka otu onye amụma bilie nye unu site n’etiti ụmụnna unu[a], dị ka m[b]. Unu ga-ege ya ntị n’ihe niile ọ ga-agwa unu.”
  to: Mosis kwuru n’ezie, sị, “Onyenwe Chineke ga-eme ka otu onye amụma si n’etiti ụmụnna unu[a] bilie maka unu, dị ka m[b]. Unu ga-ege ya ntị n’ihe niile ọ ga-agwa unu.”
  rationale: The revision removes the unsupported possessive pronoun from the divine title in both the text and the cross-reference footnote. It otherwise preserves the draft’s faithful rendering and its noninterpretive treatment of the Deuteronomy citation.
