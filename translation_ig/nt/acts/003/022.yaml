id: ACT.3.22
reference: Acts 3:22
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Μωϋσῆς ⸀μὲν εἶπεν ὅτι Προφήτην ὑμῖν ἀναστήσει κύριος ὁ ⸀θεὸς ἐκ τῶν ἀδελφῶν ὑμῶν ὡς ἐμέ· αὐτοῦ ἀκούσεσθε κατὰ πάντα ὅσα ἂν λαλήσῃ πρὸς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/022.yaml
  text: Moses indeed said[a], ‘The Lord God will raise up for you a prophet from among your brothers, like me[b]. You shall listen to him in everything he says to you.’
translation:
  language: ig
  text: Mosis kwuru n’ezie, sị, “Onyenwe Chineke ga-eme ka otu onye amụma si n’etiti ụmụnna unu[a] bilie maka unu, dị ka m[b]. Unu ga-ege ya ntị n’ihe niile ọ ga-agwa unu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ndị Izrel ibe unu.” Okwu Grik ahụ bụ “ụmụnna unu”; ọ bụ aha ikwu nwoke, ma n’ebe a ọ na-anọchite anya ndị ha na ha nọ n’otu ọgbụgba ndụ.
    reason: lexical_alternative
  - marker: b
    text: N’ebe a, Ọrụ Ndịozi kpọrọ Diuterọnọmi 18:15 n’okwu dịtụ iche. Karịsịa, ihe odide Grik nke Ọrụ Ndịozi kwuru “Onyenwe Chineke,” ọ bụghị “Onyenwe Chineke unu.”
    reason: cross_reference
lexical_decisions:
- source_word: Μωϋσῆς
  choice: Mosis
  rationale: Ọ bụ nsụgharị aha a a na-ejikarị eme ihe n’Igbo.
- source_word: μὲν
  choice: n’ezie
  rationale: Ọ na-egosipụta nkwusi ike na mmepe okwu ahụ n’ụzọ Igbo doro anya.
- source_word: εἶπεν ὅτι
  choice: kwuru, sị, “...”
  rationale: Usoro a bụ ụzọ ebumpụta ụwa e si ebido okwu a kpọọrọ kpọmkwem n’Igbo.
- source_word: Προφήτην
  choice: otu onye amụma
  rationale: Ọ na-edebe aha ahụ n’enweghị artikel dịka onye amụma, ghara itinye ‘Mesaya’ ma ọ bụ mee ya utu aha pụrụ iche.
- source_word: ἀναστήσει
  choice: ga-eme ka ... bilie
  rationale: Ọ na-edebe echiche nke Chineke ime ka onye amụma ahụ bilie ma ọ bụ pụta, n’etinyeghị mbilite n’ọnwụ dịka isi ihe okwu a pụtara.
- source_word: κύριος ὁ θεὸς
  choice: Onyenwe anyị Chineke
  rationale: Ọ na-agbaso okwu Grik nke Ọrụ Ndịozi, nke na-ekwu ‘Onyenwe anyị Chineke’ ma na-enweghị ‘unu.’
- source_word: ἐκ τῶν ἀδελφῶν ὑμῶν
  choice: site n’etiti ụmụnna unu
  rationale: Ọ na-egosipụta ἐκ (‘site n’etiti’) ma debe okwu ikwu maka ndị ikwu nọ n’ọgbụgba ndụ ahụ.
- source_word: ὡς ἐμέ
  choice: dị ka m
  rationale: Ọ na-edebe ntụnyere doro anya n’etiti onye amụma ahụ na Mosis.
- source_word: αὐτοῦ ἀκούσεσθε
  choice: Unu ga-ege ya ntị
  rationale: ‘Ige ntị’ na-egosipụta ịnụrụ na irube isi, nke dabara n’ike iwu dị n’ụdị ọdịnihu a.
- source_word: κατὰ πάντα ὅσα ἂν λαλήσῃ πρὸς ὑμᾶς
  choice: n’ihe niile ọ ga-agwa unu
  rationale: Ọ na-egosipụta na ha ga-ege ya ntị n’ihe niile o kwuru, n’Igbo dị mfe ma zuru oke.
theological_decisions:
- issue: Amụma sitere na Diuterọnọmi 18 na njikọ ya na Mesaya
  choice: E debere ‘otu onye amụma’ dịka okwu amụma ahụ si dị.
  alternative: Ịsụgharị ya ‘Onye Amụma ahụ’ ma ọ bụ itinye ‘Mesaya’ kpọmkwem.
  rationale: Pita na-etinye okwu a n’ahụ Jizọs n’Ọrụ Ndịozi, ma okwu Grik n’amaokwu a ka na-ekwu ‘onye amụma’; nsụgharị ahụ ekwesịghị ịgbakwunye nkọwa ahụ n’ime okwu a kpọọrọ.
- issue: Ihe ἀδελφῶν pụtara n’ebe a
  choice: ụmụnna unu
  alternative: ndị Izrel ibe unu
  rationale: Okwu Grik bụ aha nwoke n’ọnụọgụ, ma ọ na-arụ ọrụ dịka okwu ndị ikwu n’ọgbụgba ndụ; ‘ụmụnna’ na-edebe ihe oyiyi ezinụlọ ahụ, ebe nkọwa ala peeji na-egosi ihe ọzọ a pụrụ ịsụgharị ya.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E debere usoro okwu amụma ahụ na nkwusi ike ya, ma zere ịgbakwunye nkọwa ụka ọ bụla n’ime amaokwu ahụ.
