id: ACT.3.10
reference: Acts 3:10
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐπεγίνωσκον ⸀δὲ αὐτὸν ὅτι ⸀οὗτος ἦν ὁ πρὸς τὴν ἐλεημοσύνην καθήμενος ἐπὶ τῇ Ὡραίᾳ Πύλῃ τοῦ ἱεροῦ, καὶ ἐπλήσθησαν θάμβους καὶ ἐκστάσεως ἐπὶ τῷ συμβεβηκότι αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/010.yaml
  text: And they recognized him[a], that this was the man who used to sit for alms at the Beautiful Gate of the temple[b], and they were filled with amazement and astonishment at what had happened to him.
translation:
  language: ig
  text: Ha matara ya[a] na ọ bụ nwoke ahụ na-anọdụbu ala n’Ọnụ Ụzọ Mara Mma nke ụlọ nsọ[b] iji nata onyinye ebere. Ha jupụtara n’ịtụnanya na n’oke mgbagwoju anya n’ihi ihe mere ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’ụzọ ka nso n’ụdị okwu Grik, “onye ahụ nọ ọdụ maka onyinye ebere.” “Na-anọdụbu ala” na-egosi na nke a bụ ihe ọ na-emebu.
    reason: lexical_alternative
  - marker: b
    text: Okwu Grik ἱερόν pụtara ogige ụlọ nsọ ahụ dum, ọ bụghị naanị ebe nsọ dị n’ime ya, nke a na-akpọ ναός.
    reason: cultural_note
lexical_decisions:
- source_word: ἐπεγίνωσκον
  choice: Ha matakwara ya
  rationale: Ngwaa imperfect a na-egosi na ndị mmadụ bịara mata ma chọpụta onye ọ bụ; “matakwara” dabara n'usoro akụkọ Igbo ma jikọta ahịrịokwu ahụ nke ọma.
- source_word: δὲ
  choice: -kwara
  rationale: δὲ bụ njikọ dị nro na-aga n'ihu n'akụkọ; mgbakwunye “-kwara” na ngwaa na-eweta njikọ ahụ n'Igbo n'enweghị ime ka ọ bụrụ mmegide.
- source_word: οὗτος ἦν
  choice: na ọ bụ ya bụ nwoke ahụ
  rationale: Nke a na-edobe nkwusi ike nke οὗτος, na-akọwapụta na onye a gwọrọ bụ otu nwoke ahụ ha maara.
- source_word: ὁ πρὸς τὴν ἐλεημοσύνην καθήμενος
  choice: nwoke ahụ na-anọbu ... arịọ ebere
  rationale: “Na-anọbu” na-egosi omume ọ na-emebu, ebe “arịọ ebere” na-akọwa ebumnobi ịnọdụ ya n'ụzọ ndị Igbo nke oge a ga-aghọta ngwa ngwa.
- source_word: ἐλεημοσύνην
  choice: ebere
  rationale: N'okwu “arịọ ebere,” “ebere” na-ezo aka n'onyinye a na-enye ogbenye; ọ bụ okwu ebumpụta ụwa karịa ntụgharị siri ike dịka “onyinye ebere.”
- source_word: ἐπὶ τῇ Ὡραίᾳ Πύλῃ
  choice: n'Ọnụ Ụzọ Ama Mma
  rationale: A sụgharịrị aha ọnụ ụzọ ahụ n'ụzọ pụtara ìhè ma jiri mkpụrụedemede ukwu gosi na ọ bụ aha a maara ya.
- source_word: τοῦ ἱεροῦ
  choice: nke ụlọ nsọ
  rationale: “Ụlọ nsọ” bụ ntụgharị Igbo a na-aghọta nke ọma; nkọwa ala peeji na-eme ka o doo anya na ἱερόν pụtara ogige ụlọ nsọ n'ozuzu ya.
- source_word: ἐπλήσθησαν
  choice: jukwara ha ... meekwa ka ha
  rationale: A haziri ihe a dịka akpaalaokwu Igbo dị ndụ, na-edobe echiche nke mmetụta abụọ ahụ juputara n'ime ha.
- source_word: θάμβους
  choice: anya
  rationale: N'okwu “ihe ... jukwara ha anya,” ọ na-egosi oke ịtụnanya sitere n'ihe mmadụ hụrụ.
- source_word: ἐκστάσεως
  choice: tụgharịa uche n'oke ihe ijuanya
  rationale: N'ebe a okwu ahụ na-egosi oke ịtụnanya nke mere ka mmadụ ghara ịma onwe ya, ọ bụghị ọnọdụ mmụọ omimi; ahịrịokwu a na-agbalị idobe ike ya ma kewapụ ya na θάμβος.
- source_word: ἐπὶ τῷ συμβεβηκότι αὐτῷ
  choice: Ihe mere ya
  rationale: Nke a na-edobe ihe omume mere nwoke ahụ na nsonaazụ ya ka dị ugbu a, dịka perfect participle si gosi.
theological_decisions: []
translation_notes:
  register: Standard Igbo dị ugbu a, nke kwesịrị ekwesị ma dị mfe nghọta. E jiri “na-anọbu” gosipụta omume nwoke ahụ na-emebu, ma zere okwu ụka nke otu ụka pụrụ iche.
