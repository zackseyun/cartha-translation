revisions:
- from: Mgbe ọ na-ejidesi Pita na Jọn ike[a], mmadụ niile, bụ́ ndị ihe ahụ juru anya nke ukwuu, gbara ọsọ gbakọta n’ebe ha nọ n’Ụlọ Mbata Solomọn[b].
  to: Mgbe ọ ka jidesiri Pita na Jọn ike[a], ndị mmadụ niile gbara ọsọ zukọta n’ebe Pita na Jọn nọ, n’usoro ogidi a na-akpọ nke Solomọn[b], n’oke ijuanya.
  rationale: The revision makes the movement explicitly toward Peter and John, replaces an entrance-oriented term with one that accurately represents a covered colonnade, and renders the concluding participial description as natural Igbo without adding an explicit cause of the astonishment. The genitive absolute’s contemporaneous sense and the physical force of κρατέω are retained.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T08:27:45Z'
review_pass:
  verdict: revise
  source_fidelity: The draft conveys the healed man's continued physical hold, the people's rapid convergence, and their intense astonishment. However, “n’ebe ha nọ” means “where they were” and does not clearly preserve the directional sense “to/toward them”; it also leaves the referent less precise than the Greek context. “Ụlọ Mbata” ordinarily suggests an entrance structure rather than a covered colonnade (στοά).
  naturalness: “Mgbe ọ ka jidesiri Pita na Jọn ike” and “gbara ọsọ zukọta” are natural Standard Igbo. “N’oke ijuanya” idiomatically expresses the strong astonishment without adding “ihe ahụ,” which is not explicit in the Greek.
  terminology: Use “usoro ogidi” for the temple στοά, clarifying it in the cultural footnote as a roofed colonnade. Retain the established Igbo biblical names Pita, Jọn, and Solomọn.
  issues:
  - severity: medium
    issue: Directional reference is weakened in “n’ebe ha nọ.”
    rationale: πρὸς αὐτούς denotes movement toward Peter and John. “n’ebe Pita na Jọn nọ” clearly expresses both direction and the intended referents.
  - severity: medium
    issue: “Ụlọ Mbata” is not an accurate primary rendering of στοά.
    rationale: A στοά is a covered colonnade/portico, not specifically an entrance building. “usoro ogidi” is a safer Igbo rendering, with the architectural detail supplied in a note.
  - severity: low
    issue: “ndị ihe ahụ juru anya” supplies “that thing/event.”
    rationale: The Greek simply describes the people as astonished. “n’oke ijuanya” retains the intensity while avoiding an unnecessary supplied object.
  revised_text: Mgbe ọ ka jidesiri Pita na Jọn ike[a], ndị mmadụ niile gbara ọsọ zukọta n’ebe Pita na Jọn nọ, n’usoro ogidi a na-akpọ nke Solomọn[b], n’oke ijuanya.
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “Ka ọ na-arapara Pita na Jọn.” Okwu Grik ahụ pụrụ igosi ijidesi ike ma ọ bụ ịrapara mmadụ n’ahụ.
    reason: lexical_alternative
  - marker: b
    text: “Usoro ogidi” bụ ebe elu ụlọ kpuchiri, nke ahịrị ogidi gbara gburugburu ma ọ bụ kwado, n’ogige ụlọnsọ ukwu. A maara ebe a dịka Usoro Ogidi Solomọn.
    reason: cultural_note
  revision_rationale: The revision makes the movement explicitly toward Peter and John, replaces an entrance-oriented term with one that accurately represents a covered colonnade, and renders the concluding participial description as natural Igbo without adding an explicit cause of the astonishment. The genitive absolute’s contemporaneous sense and the physical force of κρατέω are retained.
