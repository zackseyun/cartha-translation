  text: Κρατοῦντος δὲ ⸀αὐτοῦ τὸν Πέτρον καὶ ⸀τὸν Ἰωάννην συνέδραμεν ⸂πᾶς ὁ λαὸς πρὸς αὐτοὺς⸃ ἐπὶ τῇ στοᾷ τῇ καλουμένῃ Σολομῶντος ἔκθαμβοι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/011.yaml
  text: While he was holding on to Peter and John[a], all the people, utterly astonished[b], ran together to them at the portico called Solomon’s.
translation:
  language: ig
  text: Mgbe ọ ka jidesiri Pita na Jọn ike[a], ndị mmadụ niile gbara ọsọ zukọta n’ebe Pita na Jọn nọ, n’usoro ogidi a na-akpọ nke Solomọn[b], n’oke ijuanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Ka ọ na-arapara Pita na Jọn.” Okwu Grik ahụ pụrụ igosi ijidesi ike ma ọ bụ ịrapara mmadụ n’ahụ.
    reason: lexical_alternative
  - marker: b
    text: “Usoro ogidi” bụ ebe elu ụlọ kpuchiri, nke ahịrị ogidi gbara gburugburu ma ọ bụ kwado, n’ogige ụlọnsọ ukwu. A maara ebe a dịka Usoro Ogidi Solomọn.
    reason: cultural_note
lexical_decisions:
- source_word: Κρατοῦντος δὲ αὐτοῦ
  choice: Mgbe ọ na-ejidesi ... ike
  rationale: Nke a na-egosi omume na-aga n’ihu n’otu oge ahụ, ma na-echekwa echiche nke ijide mmadụ aka ike ma ọ bụ ịrapara n’ahụ ya.
- source_word: τὸν Πέτρον καὶ τὸν Ἰωάννην
  choice: Pita na Jọn
  rationale: A sụgharịrị aha ndị ahụ n’ụdị a na-ejikarị ede ha n’Igbo.
- source_word: συνέδραμεν
  choice: gbara ọsọ gbakọta
  rationale: Nkebiokwu a na-echekwa ma echiche ịgba ọsọ ma nke ọtụtụ mmadụ isi ebe dị iche iche zukọta ngwa ngwa.
- source_word: πᾶς ὁ λαὸς
  choice: mmadụ niile
  rationale: Nke a na-egosipụta ndị niile nọ n’ebe ahụ n’enweghị ịkọwa ha naanị dị ka ìgwè mmadụ.
- source_word: πρὸς αὐτούς
  choice: n’ebe ha nọ
  rationale: Ọ bụ ụzọ Igbo si ekwu n’ụzọ ebumpụta ụwa na ndị ahụ gbara ọsọ bịakwute Pita, Jọn, na nwoke ahụ.
- source_word: ἐπὶ τῇ στοᾷ τῇ καλουμένῃ Σολομῶντος
  choice: n’Ụlọ Mbata Solomọn
  rationale: “Ụlọ Mbata” na-enye echiche nke ebe dị n’ogige ụlọnsọ ukwu nke elu ụlọ kpuchiri, nke ogidi kwadoro; “Solomọn” na-echekwa aha ebe ahụ.
- source_word: ἔκθαμβοι
  choice: bụ́ ndị ihe ahụ juru anya nke ukwuu
  rationale: Nke a na-echekwa ike dị n’okwu Grik, nke pụtara ọ bụghị naanị ihe ijuanya nkịtị kama nnukwu ihe ijuanya.
theological_decisions: []
translation_notes:
  register: 'E ji asụsụ Igbo ọkọlọtọ, nke dị ugwu ma dị mfe nghọta, dee amaokwu ahụ. A haziri usoro okwu ya ka ọ daa nke ọma n’Igbo, ebe a ka chekwara omume atọ dị na Grik: nwoke ahụ ijidesi ndịozi ike, ndị mmadụ ịgba ọsọ gbakọta, na nnukwu ihe ijuanya ha nwere.'
