revisions:
- from: Ya mere, o lekwasịrị ha anya[a], na-atụ anya na ọ ga-anata ihe n’aka ha.
  to: O wee legide ha anya[a], na-atụ anya inweta ihe n'aka ha.
  rationale: The revision removes an unwarranted causal implication from the connective, uses a natural Igbo expression for sustained attentive looking, and renders the expectation infinitive directly and idiomatically. It retains the original ambiguity concerning the unspecified thing he expected to receive.
