  text: ὁ δὲ ἐπεῖχεν αὐτοῖς προσδοκῶν τι παρ’ αὐτῶν λαβεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/005.yaml
  text: So he fixed his attention on them[a], expecting to receive something from them.
translation:
  language: ig
  text: O wee legide ha anya[a], na-atụ anya inweta ihe n'aka ha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “o lebara ha anya” / “o legidere ha anya nke ọma.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ
  choice: Ya mere, o
  rationale: δέ bụ njikọ dị nro na-aga n’ihu n’akụkọ a; “Ya mere” na-egosi nzaghachi nwoke ahụ n’ihe e nyere ya n’iwu, ebe “o” na-ezo aka n’ebe nwoke ahụ ngwụrọ nọ.
- source_word: ἐπεῖχεν
  choice: lekwasịrị ... anya
  rationale: N’ọnọdụ a, okwu ahụ pụtara itinye uche n’ebe mmadụ nọ. Nkebiokwu Igbo a na-egosi ile ha anya nke ọma na itinye uche n’ihe ha ga-eme; usoro gara n’ihu nke Grik ahụ na-enweta nkwado site n’ọnọdụ akụkọ ahụ.
- source_word: αὐτοῖς
  choice: ha
  rationale: Ọ na-ezo aka na Pita na Jọn, bụrụkwa mmeju nke “lekwasịrị ... anya.”
- source_word: προσδοκῶν
  choice: na-atụ anya
  rationale: Ọ na-egosi olileanya ma ọ bụ atụmanya so omume ilekwasị ha anya na-aga.
- source_word: τι
  choice: ihe
  rationale: Ọ bụ ihe a na-akọwaghị kpọmkwem; “ihe” na-edobe enweghị nkọwa ahụ n’etinyeghị “onyinye” ma ọ bụ “ego” n’ahịrịokwu.
- source_word: παρ’ αὐτῶν
  choice: n’aka ha
  rationale: παρά tinyere genitive na-egosi isi ebe ihe si abịa; “n’aka ha” bụ ụzọ Igbo sitere n’okike isi kwuo na ọ ga-enweta ihe site n’ebe ha nọ.
- source_word: λαβεῖν
  choice: na ọ ga-anata
  rationale: Infinitive ahụ na-akọwa ihe ọ na-atụ anya ya. “Ịnata” dabara n’ọnọdụ nke onye na-atụ anya ka e nye ya ihe ma zere echiche nke iji aka ya were ihe.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E debere ihe a na-atụ anya ya dịka “ihe” ka a ghara itinye onyinye ebere ma ọ bụ ego n’ahịrịokwu ebe Grik ekwughị ya kpọmkwem.
