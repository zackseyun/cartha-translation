revisions:
- from: 'Ha wee họpụta mmadụ abụọ: Josef, onye a na-akpọ Basabas[a], onye a na-akpọkwa Jọstọs, na Matayas.'
  to: 'Ha wee wepụta mmadụ abụọ: Josef, onye a na-akpọ Basabas, onye a kpọkwara Jọstọs, na Matayas.'
  rationale: Changed “họpụtara” to “wepụtara” so that the verse presents Joseph and Matthias as candidates rather than as men already selected. Smoothed the second naming clause and revised the footnote to state the candidate-presenting sense accurately and idiomatically.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T08:27:09Z'
review_pass:
  verdict: revise
  source_fidelity: The draft renders ἔστησαν as “họpụtara” (“selected/chose”), which can imply that the final choice had already been made. In context the verb means setting forward or presenting two men as candidates; the actual selection follows by lot in the next verse. “Wepụtara” retains the procedural sense without prematurely stating the outcome.
  naturalness: The revised wording is natural, clear Standard Igbo. “Onye a kpọkwara Jọstọs” is a smoother parallel expression for Joseph’s further name than repeating the present-tense passive construction.
  terminology: The established Igbo-style forms Josef, Basabas, Jọstọs, and Matayas are retained. No theological terminology is involved.
  issues:
  - severity: medium
    issue: “họpụtara” overstates the action of ἔστησαν.
    rationale: It commonly means choosing/selecting, whereas the Greek describes presenting two candidates before the group, not deciding which one would replace Judas.
  revised_text: 'Ha wee wepụta mmadụ abụọ: Josef, onye a na-akpọ Basabas, onye a kpọkwara Jọstọs, na Matayas.'
  revised_footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “Ha wee mee ka mmadụ abụọ guzo n’ihu ìgwè ahụ,” ma ọ bụ, “Ha wee kpọpụta mmadụ abụọ.” Okwu Grik ahụ nwere ike ịpụta idowe ndị mmadụ n’ihu otu ìgwè; n’ebe a, o yiri ka ọ na-ekwu maka iwepụta ha dị ka ndị a tụrụ aro ịhọrọ.
    reason: lexical_alternative
  revision_rationale: Changed “họpụtara” to “wepụtara” so that the verse presents Joseph and Matthias as candidates rather than as men already selected. Smoothed the second naming clause and revised the footnote to state the candidate-presenting sense accurately and idiomatically.
