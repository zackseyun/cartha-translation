  text: καὶ ἔστησαν δύο, Ἰωσὴφ τὸν καλούμενον Βαρσαββᾶν, ὃς ἐπεκλήθη Ἰοῦστος, καὶ Μαθθίαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/023.yaml
  text: 'And they put forward two: Joseph called Barsabbas[a], who was also called Justus, and Matthias.'
translation:
  language: ig
  text: 'Ha wee wepụta mmadụ abụọ: Josef, onye a na-akpọ Basabas, onye a kpọkwara Jọstọs, na Matayas.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔστησαν
  choice: họpụta
  rationale: N’ọnọdụ a a na-ahọrọ onye ga-anọchi Judas, okwu a pụtara ime ka mmadụ guzo n’ihu ọgbakọ dị ka onye a tụrụ aro, ọ bụghị nanị ime ka ọ kwụrụ ọtọ. ‘Họpụta’ na-egosi ịkpọpụta ha dị ka ndị a ga-ahọrọ, ma ọ naghị ekwu na e kenyelarị ha ọrụ ahụ.
- source_word: δύο
  choice: mmadụ abụọ
  rationale: Ọnụọgụ ahụ na-ezo aka n’ụmụ nwoke abụọ e kpọpụtara; itinye ‘mmadụ’ na-eme ka Igbo doo anya ma bụrụkwa nke eke.
- source_word: καλούμενον
  choice: onye a na-akpọ
  rationale: Nkebi a na-egosi aha ọzọ e ji mara Josef.
- source_word: Βαρσαββᾶν
  choice: Basabas
  rationale: E degharịrị aha onye a n’ụdị mkpọpụta dabara n’Igbo.
- source_word: ἐπεκλήθη
  choice: onye a na-akpọkwa
  rationale: Okwu a na-eweta aha ọzọ e ji akpọ Josef; ‘-kwa’ na-egosi na ọ bụ aha ọzọ n’ime aha ndị ahụ.
- source_word: Ἰοῦστος
  choice: Jọstọs
  rationale: E degharịrị aha ahụ n’ụdị mkpọpụta dabara n’Igbo.
- source_word: Μαθθίαν
  choice: Matayas
  rationale: E degharịrị aha ahụ n’ụdị mkpọpụta dabara n’Igbo.
- source_word: καὶ ... καὶ
  choice: Ha wee ... na
  rationale: ‘Wee’ na-ejikọta ihe a mere na akụkọ gara n’ihu, ebe ‘na’ jikọtara mmadụ abụọ ahụ.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke oge a, dị ùgwù ma dị mfe nghọta. A hapụrụ usoro aha atọ Josef ji bụrụ onye a maara nke ọma, ma zere ịkọwa ἔστησαν dị ka inye mmadụ ọkwa n’ụzọ kwụsiri ike.
