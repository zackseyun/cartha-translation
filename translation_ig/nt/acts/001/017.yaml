source:
  edition: SBLGNT
  text: ὅτι κατηριθμημένος ἦν ⸀ἐν ἡμῖν καὶ ἔλαχεν τὸν κλῆρον τῆς διακονίας ταύτης.—
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/017.yaml
  text: For he was numbered among us and received a share in this ministry[a].
translation:
  language: ig
  text: N’ihi na e gụkọrọ ya na anyị, ọ nwetakwara òkè n’ozi a[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “o nwetara nza, ya bụ, òkè e kenyere ya n’ozi a.” Okwu Grik bụ κλῆρος, nke nwere ike ịpụta “nza” ma ọ bụ “òkè e kenyere mmadụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: N’ihi na
  rationale: N’ebe a, okwu ahụ na-enye ihe kpatara Pita ji ekwu banyere Judas; ‘N’ihi na’ na-egosipụta njikọ nkọwa a nke ọma n’Igbo.
- source_word: κατηριθμημένος ἦν
  choice: a gụrụ ya dịka otu onye
  rationale: Nke a na-echekwa echiche passive nke ịbụ onye a gụnyere n’otu ìgwè, ma na-ada nke ọma ma doo anya n’Igbo ugbu a.
- source_word: ἐν ἡμῖν
  choice: n’ime anyị
  rationale: Nkebi okwu a na-egosi na Judas so n’otu ndị ahụ n’ezie, ọ bụghị naanị na ọ nọ ha nso.
- source_word: ἔλαχεν
  choice: ọ natakwara
  rationale: Ngwaa Grik ahụ nwere ike ịpụta inweta ihe e kenyere mmadụ ma ọ bụ ihe sitere n’ịtụ nza. ‘Natara’ na-egosi na ọrụ ahụ bịara bụrụ nke ya, ebe nkọwa ala peeji na-echekwa echiche nke nza ma ọ bụ òkè e kenyere.
- source_word: τὸν κλῆρον
  choice: òkè
  rationale: ‘Òkè’ na-egosi oke Judas nwere n’ọrụ ahụ n’Igbo doro anya. Ebe κλῆρος nwekwara ike ịpụta ‘nza’ ma ọ bụ ‘òkè e kenyere,’ e debere nhọrọ ndị ahụ na nkọwa ala peeji.
- source_word: τῆς διακονίας ταύτης
  choice: n’ozi a
  rationale: ‘Ozi’ bụ okwu Igbo dabara adaba maka διακονία n’ebe a, ebe ọ na-ekwu maka ọrụ ndị ozi ahụ na-eje.
theological_decisions:
- issue: Ụdị mmekọrịta Judas na ndị ozi na ọrụ ha
  choice: Amaokwu ahụ kwuru na a gụnyere Judas n’etiti ha nakwa na o nwere òkè n’ozi ha.
  alternative: Ịsụgharị ya dịka naanị na Judas na ndị ahụ na-akpakọrịta, n’enweghị ịbụ onye e tinyere n’otu ha n’ezie.
  rationale: Okwu Grik ahụ na-egosi n'ụzọ doro anya na Judas bụ onye a gụrụ n’ime ha nakwa na o nwetara òkè n’ozi ahụ. Nsụgharị ahụ anaghị agbakwunye ma nke a pụtara na a kwadoro omume ya ma ọ bụ na ọ nọgidere ruo ọgwụgwụ.
translation_notes:
  register: Ejiri Standard Igbo dị mfe, dị ùgwù, ma bụrụ nke ndị na-agụ akwụkwọ taa ga-aghọta. ‘A gụrụ ya dịka otu onye n’ime anyị’ na-echekwa echiche nke ịbụ onye e tinyere n’ọnụ ọgụgụ ha, ebe ‘òkè n’ozi a’ na-enye nghọta nkịtị ma hapụ nkọwa ‘nza/òkè e kenyere’ n’ala peeji.
