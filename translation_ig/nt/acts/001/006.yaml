id: ACT.1.6
reference: Acts 1:6
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Οἱ μὲν οὖν συνελθόντες ⸀ἠρώτων αὐτὸν λέγοντες· Κύριε, εἰ ἐν τῷ χρόνῳ τούτῳ ἀποκαθιστάνεις τὴν βασιλείαν τῷ Ἰσραήλ;
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/006.yaml
  text: So when they had come together[a], they asked him, saying, “Lord, is it at this time that you are restoring the kingdom to Israel?”
translation:
  language: ig
  text: Ya mere, mgbe ha zukọtara, ha jụrụ ya, sị, “Onyenwe anyị, ọ̀ bụ n’oge a ka ị na-eweghachi alaeze ahụ nye Izrel[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “maka Izrel.” Dative Grik a nwere ike ịpụta uru—“maka Izrel”—ma ọ bụ, n’ụzọ ka kwụ ọtọ, iweghachi alaeze ahụ “nye Izrel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἱ μὲν οὖν συνελθόντες
  choice: Ya mere, mgbe ha zukọtara
  rationale: “Mgbe ha zukọtara” na-egosi na συνελθόντες bụ nkebiokwu oge; “Ya mere” na-ebute ajụjụ ahụ n’ụzọ dị mfe ma na-anọchi njikọ okwu μὲν οὖν n’asụsụ Igbo nkịtị.
- source_word: ἠρώτων αὐτὸν λέγοντες
  choice: ha jụrụ ya, sị
  rationale: Ọ bụ ụzọ Igbo dị ndụ isi webata ajụjụ e kwuru kpọmkwem. Ọ naghị amanye imperfect ἠρώτων ka ọ bụrụ omume a na-eme ugboro ugboro ma ọ bụ na-aga n’ihu.
- source_word: Κύριε
  choice: Onyenwe anyị
  rationale: Aha a na-ejikarị asọpụrụ ma kpọọ Jizọs dịka κύριος; ọ na-echekwa ịdị arọ nke utu aha ahụ karịa “Nna ukwu.”
- source_word: ἐν τῷ χρόνῳ τούτῳ
  choice: n’oge a
  rationale: Ọ na-egosi oge ma ọ bụ ọnọdụ oge a na-ekwu maka ya, ọ bụghị naanị otu ntabi anya.
- source_word: ἀποκαθιστάνεις
  choice: ị na-eweghachi
  rationale: “Iweghachi” na-egosi ime ka ihe laghachi n’ọnọdụ mbụ ya, nke bụ isi echiche ἀποκαθίστημι; usoro “na-” na-egosikwa ajụjụ banyere ihe a na-eme n’oge a.
- source_word: τὴν βασιλείαν
  choice: alaeze ahụ
  rationale: “Alaeze” na-echekwa echiche βασιλεία n’ebe a, tinyere olileanya ndị na-eso ụzọ banyere Izrel, n’enweghị ịkọwa ya naanị dịka ọchịchị ndọrọ ndọrọ ọchịchị ma ọ bụ nke ime mmụọ.
- source_word: τῷ Ἰσραήλ
  choice: nye Izrel
  rationale: “Nye Izrel” na-egosipụta dative Grik ahụ n’ụzọ kwụ ọtọ dịka ihe a na-eweghachiri Izrel, ebe a na-edebe “maka Izrel” n’ala ala peeji dịka nghọta ọzọ nwere ike ịdị.
theological_decisions:
- issue: Ụdị olileanya ndị na-eso ụzọ nwere banyere alaeze Izrel
  choice: E depụtara ajụjụ ahụ dịka iweghachi alaeze ahụ nye Izrel.
  alternative: Iweghachi alaeze ahụ maka Izrel; ma ọ bụ ịkọwa ya naanị dịka ọchịchị ndọrọ ndọrọ ọchịchị ma ọ bụ nke ime mmụọ.
  rationale: Amaokwu a na-akọ ajụjụ ndị na-eso ụzọ jụrụ; ọ naghị ekwu n’ebe a na Jizọs kwadoro ma ọ bụ gbaghaa echiche niile dị n’ajụjụ ahụ. Ya mere, nsụgharị ahụ na-echekwa esemokwu nkà mmụta okpukpe dị na ya kama idozi ya site na nkọwa agbakwunyere.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. “Sị” bụ ụzọ okwu Igbo nkịtị isi webata okwu e hotara. E debere akara ụda olu n’ajụjụ “ọ̀ bụ” iji mee ka ajụjụ ahụ doo anya. Akara ala ala peeji [a] dị n’akụkụ “Izrel,” ebe nghọta ọzọ nke τῷ Ἰσραήλ metụtara kpọmkwem.
