id: ACT.1.21
reference: Acts 1:21
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: δεῖ οὖν τῶν συνελθόντων ἡμῖν ἀνδρῶν ἐν παντὶ χρόνῳ ⸀ᾧ εἰσῆλθεν καὶ ἐξῆλθεν ἐφ’ ἡμᾶς ὁ κύριος Ἰησοῦς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/021.yaml
  text: Therefore[a], it is necessary that one of the men who accompanied us during all the time in which the Lord Jesus went in and out among us[b],
translation:
  language: ig
  text: Ya mere, ọ dị mkpa ka otu n’ime ndị ikom ndị soro anyị nọ n’oge niile Onyenwe anyị Jizọs na-abata ma na-apụ n’etiti anyị,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δεῖ
  choice: ọ dị mkpa
  rationale: Nke a na-egosipụta mkpa a na-apụghị izere ezere, ma hapụkwa ihe ga-emejupụta ahịrịokwu ahụ ka ọ gaa n’ihu n’amaokwu na-esonụ.
- source_word: οὖν
  choice: Ya mere
  rationale: Ọ na-egosi nkwubi okwu Pita wepụtara site n’ihe ndị o kwuru tupu nke a.
- source_word: τῶν συνελθόντων ἡμῖν ἀνδρῶν
  choice: ndị ikom ahụ ha na anyị na-anọkọ
  rationale: Ọ na-echekwa kpọmkwem na ἀνδρῶν bụ ndị ikom, ma na-egosikwa mkpakọrịta ha na ndịozi ruo ogologo oge n’Igbo na-ada nke ọma.
- source_word: ἐν παντὶ χρόνῳ
  choice: n’oge niile
  rationale: Ọ na-ezo aka n’ogologo oge niile Jizọs nọ n’etiti ha, ọ bụghị nanị n’oge ụfọdụ dị iche iche.
- source_word: ᾧ
  choice: n’oge
  rationale: E jikọtara nnọchiaha ahụ n'ụzọ ebumpụta ụwa na nkebiokwu oge n’Igbo, kama ịsụgharị ya n’ụzọ siri ike dịka ‘nke’.
- source_word: εἰσῆλθεν καὶ ἐξῆλθεν
  choice: na-abata ma na-apụ
  rationale: Ọ na-echekwa oyiyi okwu Grik ahụ na echiche nke ndụ na ọrụ Jizọs na-aga n’ihu n’etiti ndị na-eso ụzọ ya.
- source_word: ἐφ’ ἡμᾶς
  choice: n’etiti anyị
  rationale: Nke a dabara n’omume na mkpakọrịta Jizọs n’etiti ìgwè ndị na-eso ụzọ ya.
- source_word: ὁ κύριος Ἰησοῦς
  choice: Onyenwe anyị Jizọs
  rationale: ‘Onyenwe anyị’ bụ nsụgharị Igbo a na-aghọta nke ọma maka κύριος dịka aha nsọpụrụ na aha Kraịst n’ebe a.
theological_decisions:
- issue: Nsụgharị κύριος dịka aha Kraịst
  choice: Onyenwe anyị Jizọs
  alternative: Nna Ukwu Jizọs
  rationale: ‘Onyenwe anyị’ na-echekwa ịdị arọ nke aha nsọpụrụ na nke okpukpe dị na κύριος; ‘Nna Ukwu’ agaghị egosipụta ojiji Agba Ọhụrụ nke ọma.
- issue: Nkọwa nwoke dị na ἀνδρῶν
  choice: ndị ikom
  alternative: ndị mmadụ
  rationale: ἀνήρ na-ezo kpọmkwem n’ebe a n’ụmụ nwoke; ya mere, e kwesịghị ime ka okwu ahụ ghọọ nke na-enweghị njirimara nwoke.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E chekwara nhazi ahịrịokwu na-ezughị ezu n’amaokwu a n’ihi na echiche ahụ na-aga n’ihu n’amaokwu 22; akara rikoma ikpeazụ na-egosi njikọ ahụ.
