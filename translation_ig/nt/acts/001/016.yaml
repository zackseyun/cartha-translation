revisions:
- from: Ụmụ nwoke, ụmụnna m, ọ dị mkpa ka okwu Akwụkwọ Nsọ ahụ mezuo—okwu ahụ Mmụọ Nsọ buru ụzọ kwuo[a] site n’ọnụ Devid[b] banyere Judas, onye ghọrọ onye na-edu ndị jidere Jizọs[c] ụzọ.
  to: Ndị ikom, ụmụnna, ọ dị mkpa ka okwu Akwụkwọ Nsọ ahụ mezuo, nke Mmụọ Nsọ buru ụzọ kwuo[a] site n’ọnụ Devid[b] banyere Judas, onye ghọrọ onye na-edu ndị jidere Jizọs[c] ụzọ.
  rationale: The revision removes an unsupported possessive, streamlines the Scripture relative clause, places footnote a at the word it explains, and replaces the force-implying alternative in footnote c with a neutral rendering of “seized.” It retains the source’s formal address and its ambiguity concerning the nature of the necessity and Judas’s role.
