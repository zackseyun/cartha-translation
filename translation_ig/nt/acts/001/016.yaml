id: ACT.1.16
reference: Acts 1:16
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἄνδρες ἀδελφοί, ἔδει πληρωθῆναι τὴν ⸀γραφὴν ἣν προεῖπε τὸ πνεῦμα τὸ ἅγιον διὰ στόματος Δαυὶδ περὶ Ἰούδα τοῦ γενομένου ὁδηγοῦ τοῖς συλλαβοῦσιν ⸀Ἰησοῦν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/016.yaml
  text: Men[a], brothers, it was necessary for the Scripture to be fulfilled, which the Holy Spirit spoke beforehand through the mouth of David concerning Judas, who became a guide to those who arrested Jesus[c][b],
translation:
  language: ig
  text: Ndị ikom, ụmụnna, ọ dị mkpa ka okwu Akwụkwọ Nsọ ahụ mezuo, nke Mmụọ Nsọ buru ụzọ kwuo[a] site n’ọnụ Devid[b] banyere Judas, onye ghọrọ onye na-edu ndị jidere Jizọs[c] ụzọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “kwuru tupu oge eruo.” Ngwaa ahụ nwekwara ike ịpụta “buru amụma.”
    reason: lexical_alternative
  - marker: b
    text: N’ụzọ nkịtị, “site n’ọnụ Devid”; nke a bụ ụzọ e si ekwu na Mmụọ Nsọ kwuru okwu site n’aka Devid dịka onye mmadụ.
    reason: cultural_note
  - marker: c
    text: Ma ọ bụ, “ndị nwụdere Jizọs.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄνδρες ἀδελφοί
  choice: Ụmụ nwoke, ụmụnna m
  rationale: 'Nke a na-echekwa okwu abụọ ahụ kpọmkwem: ἄνδρες bụ ‘ụmụ nwoke,’ ἀδελφοί bụkwa ‘ụmụnna.’ Ịtinye ‘m’ na-eme ka oku ahụ daa nke ọma n’Igbo, n’enweghị ịgbanwe ndị a na-akpọ.'
- source_word: ἔδει
  choice: ọ dị mkpa
  rationale: Ọ na-egosi mkpa ihe ahụ ga-eme, ma ọ naghị akọwa kpọmkwem otú mkpa ahụ si malite ma ọ bụ usoro Chineke ji mee ya.
- source_word: πληρωθῆναι
  choice: ka ... mezuo
  rationale: ‘Mezuo’ bụ okwu Igbo doro anya maka mmezu nke okwu Akwụkwọ Nsọ, ma na-echekwa ọdịdị nnara nke ngwaa Grik ahụ.
- source_word: τὴν γραφὴν
  choice: okwu Akwụkwọ Nsọ ahụ
  rationale: N’ebe a γραφή na-ezo aka n’okwu dị nsọ, ọ bụghị naanị ihe ọ bụla e dere. ‘Okwu Akwụkwọ Nsọ ahụ’ bụ ụzọ Igbo si ekwu ya nke ọma ma na-echekwa otu ihe e dere a na-ekwu maka ya.
- source_word: προεῖπε
  choice: buru ụzọ kwuo
  rationale: Nke a na-enye kpọmkwem echiche nke ikwu ihe tupu oge ya, n’etinyeghị okwu amụma pụrụ iche karịa ihe ngwaa ahụ n’onwe ya kwuru.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: Mmụọ Nsọ
  rationale: Nke a bụ aha Igbo a na-ejikarị eme ihe maka Mmụọ Nsọ, onye ahịrịokwu Grik ahụ mere onye kwuru okwu ahụ.
- source_word: διὰ στόματος Δαυὶδ
  choice: site n’ọnụ Devid
  rationale: Nke a na-echekwa ihe atụ doro anya nke Grik, na-egosikwa na Mmụọ Nsọ kwuru okwu site n’aka Devid dị ka onye mmadụ o ji kwuo ya.
- source_word: περὶ Ἰούδα
  choice: banyere Judas
  rationale: ‘Banyere’ na-egosi nke ọma na Judas bụ onye okwu Akwụkwọ Nsọ ahụ na-ekwu maka ya.
- source_word: τοῦ γενομένου ὁδηγοῦ
  choice: onye ghọrọ onye na-edu ... ụzọ
  rationale: ‘Ghọrọ’ na-echekwa γενομένου, ebe ‘onye na-edu ... ụzọ’ na-enye echiche ὁδηγός n’Igbo nkịtị, n’emeghị ka ọ bụrụ ‘onye ndu ahụ’ kpọmkwem.
- source_word: τοῖς συλλαβοῦσιν Ἰησοῦν
  choice: ndị jidere Jizọs
  rationale: N’ọnọdụ a συλλαμβάνω pụtara ijide mmadụ ma ọ bụ ịkpọchie ya. ‘Jidere’ doro anya ma na-ahapụkwa ike okwu ‘seized’ nwere.
theological_decisions:
- issue: Ụdị mkpa dị na mmezu Akwụkwọ Nsọ
  choice: ọ dị mkpa ka ... mezuo
  alternative: ọ ghaghị ime n’ihi na Chineke kara aka ka ọ dị otú ahụ
  rationale: Amaokwu ahụ kwuru na mmezu ahụ dị mkpa, ma ọ kọwaghị usoro nke kara aka, amụma, na ọrụ mmadụ. Nsụgharị ahụ anaghị edozi esemokwu nkà mmụta okpukpe karịa ihe ederede kwuru.
- issue: Onye kwuru okwu na onye e si n’aka ya kwuo ya
  choice: Mmụọ Nsọ ... site n’ọnụ Devid
  alternative: Devid kwuru ya site na Mmụọ Nsọ
  rationale: Usoro Grik ahụ mere Mmụọ Nsọ onye kwuru okwu, Devid abụrụ onye mmadụ e si n’ọnụ ya kwuo ya. Nsụgharị ahụ na-echekwa ọrụ abụọ ahụ n’usoro ahụ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E chekwara ọdịdị okwu Pita ji kpọọ ndị na-ege ya ntị, okwu mmezu Akwụkwọ Nsọ, na njikọ dị n’etiti Mmụọ Nsọ na Devid. Akara nkọwa [a], [b], na [c] dị n’ebe okwu ha na-akọwa pụtara n’ahịrịokwu.
