  text: Τὸν μὲν πρῶτον λόγον ἐποιησάμην περὶ πάντων, ὦ Θεόφιλε, ὧν ἤρξατο ⸀ὁ Ἰησοῦς ποιεῖν τε καὶ διδάσκειν
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/001.yaml
  text: In the first account[a], O Theophilus, I wrote about all that Jesus began both to do and to teach,
translation:
  language: ig
  text: N’akụkọ mbụ ahụ[a], Teofịlọs, edere m banyere ihe niile Jizọs malitere ime na izi ihe,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, ‘n’akụkọ gara aga,’ ma ọ bụ ‘n’akwụkwọ mbụ ahụ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: Τὸν μὲν πρῶτον λόγον
  choice: N’akụkọ mbụ ahụ
  rationale: N’ebe a, λόγος pụtara akụkọ e dere ede, ọ bụghị naanị ‘okwu.’ ‘Akụkọ mbụ ahụ’ na-ezo aka n’akwụkwọ Luk gara aga ma na-edobe echiche nke πρῶτον; μέν na-akwalite njikọ ya na akụkọ na-aga n’ihu n’Ọrụ Ndịozi.
- source_word: ἐποιησάμην
  choice: edere m
  rationale: Mgbe ποιέω so λόγος n’ụdị a, ọ pụtara ide ma ọ bụ ịchịkọta akwụkwọ; ‘edere m’ bụ Igbo doro anya ma bụrụ nke e ji eme ihe n’ụzọ ebumpụta ụwa.
- source_word: περὶ πάντων ... ὧν
  choice: banyere ihe niile
  rationale: Nkebiokwu a na-egosi ihe e dere banyere ya. ‘Banyere ihe niile’ na-ejikọta ya nke ọma na nkebiokwu na-esochi, n’enweghị ikwu na akụkọ ahụ kọwara ihe ọ bụla n’ụzọ zuru ezu.
- source_word: ὦ Θεόφιλε
  choice: Teofịlọs
  rationale: Aha a n’onwe ya, nke e tinyere n’etiti ahịrịokwu, na-egosi ịkpọ onye ahụ okwu n’Igbo; ịgbakwunye okwu dịka ‘onye m hụrụ n’anya’ ga-etinye echiche na-adịghị na Grik.
- source_word: ἤρξατο
  choice: malitere
  rationale: ‘Malitere’ na-edobe ihe ngwaa Grik kwuru kpọmkwem, tinyere ohere nke echiche na ọrụ Jizọs gara n’ihu n’Ọrụ Ndịozi, ma ọ naghị akọwapụta echiche ahụ karịa ederede.
- source_word: ὁ Ἰησοῦς
  choice: Jizọs
  rationale: Nke a bụ ụdị aha ahụ a na-ejikarị eme ihe n’Igbo ọkọlọtọ.
- source_word: ποιεῖν τε καὶ διδάσκειν
  choice: ime na izi ihe
  rationale: ‘Ime na izi ihe’ na-edobe akụkụ abụọ ahụ—ọrụ Jizọs na nkuzi ya. Njikọ ‘na’ bụ ụzọ Igbo dị mfe ma kwekọọ n’ọrụ τε καί n’ebe a.
theological_decisions:
- issue: Ihe ἤρξατο (‘malitere’) pụrụ ịpụta banyere ịga n’ihu nke ọrụ Jizọs n’Ọrụ Ndịozi
  choice: E debere ‘malitere’ n’ederede bụ isi n’enweghị nkọwa agbakwunyere.
  alternative: Ịsụgharị ya ‘ihe niile Jizọs mere ma kụzie,’ ma ọ bụ ịgbakwunye na ọ gara n’ihu ime ha site n’aka ndịozi ya.
  rationale: Grik kwuru ‘malitere’ n’ụzọ doro anya. Ọ pụrụ igosi na Ọrụ Ndịozi bụ akụkọ banyere ọrụ Jizọs gara n’ihu, ma nsụgharị ekwesịghị idozi ma ọ bụ gbasaa echiche ahụ site n’ịkọwakwuru ya.
translation_notes:
  register: E ji Igbo ọkọlọtọ nke oge a, dị ugwu ma dị mfe nghọta. A kpọrọ Teofịlọs okwu site n’itinye aha ya n’etiti ahịrịokwu, nke bụ ụzọ ebumpụta ụwa n’Igbo karịa ịsụgharị ὦ site n’okwu pụrụ iyi ihe ochie. Akara ntụaka [a] dị n’ederede bụ isi.
