source:
  edition: SBLGNT
  text: Καὶ ἐν ταῖς ἡμέραις ταύταις ἀναστὰς Πέτρος ἐν μέσῳ τῶν ⸀ἀδελφῶν εἶπεν (ἦν τε ὄχλος ὀνομάτων ἐπὶ τὸ αὐτὸ ⸀ὡς ἑκατὸν εἴκοσι)·
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/015.yaml
  text: And in those days Peter stood up in the midst of the brothers and said (the number of names together was about one hundred twenty),[a]
translation:
  language: ig
  text: 'N’ụbọchị ndị ahụ, Pita guzoro n’etiti ụmụnna[a] wee sị (ma ọnụ ọgụgụ ndị nọkọtara ọnụ dị ihe dị ka mmadụ otu narị na iri abụọ):'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Okwu Grik a sụgharịrị “ụmụnna” nwere ụdị nwoke; ma n’ọgbakọ ndị kwere ekwe a, ọ pụrụ ịgụnye ụmụnna nwoke na ụmụnna nwanyị.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστὰς
  choice: biliri ọtọ
  rationale: N’ọnọdụ a, nkebi a na-egosi na Pita guzoro ka o kwuo okwu; “biliri ọtọ” bụ Igbo doro anya ma na-echekwa omume ahụ kpọmkwem.
- source_word: ἐν μέσῳ
  choice: n’etiti
  rationale: Nke a na-echekwa echiche Pita ịnọ n’ime ìgwè ndị ahụ, ma bụrụkwa okwu Igbo a na-asụkarị.
- source_word: ἀδελφῶν
  choice: ụmụnna
  rationale: “Ụmụnna” bụ okwu Igbo kwesịrị ekwesị maka ndị otu okwukwe ma nwee ike ịgụnye nwoke na nwanyị. Ihe odide Grik ji ụdị okwu nwoke, ya mere e tinyere nkọwa n’ala peeji.
- source_word: ὄχλος ὀνομάτων
  choice: ọnụ ọgụgụ ndị
  rationale: N'ụzọ nkịtị, okwu Grik ahụ bụ “ìgwè aha,” ma ọ bụ akpaala okwu na-ezo aka n’ọnụ ọgụgụ mmadụ. “Ọnụ ọgụgụ ndị” na-enye nghọta ahụ n’Igbo ekeghị eke na-enweghị ịtụgharị “aha” n’ụzọ ga-agbagwoju onye na-agụ anya.
- source_word: ἐπὶ τὸ αὐτό
  choice: gbakọtara ọnụ
  rationale: Nkebi a na-egosi na ndị ahụ nọkọtara ọnụ dị ka otu nzukọ; “gbakọtara ọnụ” bụ nsụgharị Igbo doro anya.
- source_word: ὡς ἑκατὸν εἴκοσι
  choice: ihe dị ka otu narị mmadụ na iri abụọ
  rationale: ὡς n’ihu ọnụ ọgụgụ na-egosi na ọ bụ ihe a tụrụ atụ, ọ bụghị ọnụ ọgụgụ e kwuru na ọ bụ kpọmkwem.
theological_decisions:
- issue: Ma ἀδελφῶν ọ na-ezo naanị aka n’ebe ụmụ nwoke nọ, ka ọ na-agụnyekwa ndị inyom kwere ekwe
  choice: Jiri “ụmụnna” n’ahịrịokwu, tinyekwa nkọwa na ihe odide Grik ji “ụmụnne nwoke.”
  alternative: “ụmụnne nwoke na ụmụnne nwanyị” ma ọ bụ “ndị kwere ekwe”
  rationale: “Ụmụnna” bụ okwu dị ùgwù ma dị eke n’Igbo maka ndị otu okwukwe, o nwekwara ike ịgụnye nwoke na nwanyị. Nkọwa ala peeji na-echekwa ụdị okwu Grik na enweghị mkpuchi banyere ókè ndị a na-ekwu maka ha.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E chekwara nkwụsị okwu nke na-eduga n’okwu Pita n’amaokwu na-esote, tinyekwa ozi banyere ọnụ ọgụgụ ndị nọ ebe ahụ n’ime akara mkpọchi dịka ọ dị n’isi mmalite.
