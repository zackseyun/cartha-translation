  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ὡς ἀτενίζοντες ἦσαν εἰς τὸν οὐρανὸν πορευομένου αὐτοῦ, καὶ ἰδοὺ ἄνδρες δύο παρειστήκεισαν αὐτοῖς ἐν ⸂ἐσθήσεσι λευκαῖς⸃,
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/010.yaml
  text: And as they were gazing intently into heaven while he was going[a], behold, two men stood by them in white clothing[b],
translation:
  language: ig
  text: Mgbe ha nọ na-elegide eluigwe anya ka ọ na-aga[a], lee, ndị ikom abụọ yi uwe ọcha[b] guzo n’akụkụ ha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “na mbara igwe.” Okwu Grik ahụ nwere ike ịpụta “eluigwe” ma ọ bụ “mbara igwe”; a họọrọ “eluigwe” n’ebe a n’ihi na akụkọ a gbasara nrịgo Jizọs.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “n’uwe ọcha” ma ọ bụ “n’akwa ọcha.” Okwu Grik ahụ na-ekwu maka uwe n’ozuzu ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀτενίζοντες
  choice: na-ele anya nke ọma
  rationale: Nke a na-egosi ilegide anya n’ụzọ siri ike ma na-aga n’ihu, ọ bụghị ile anya naanị otu ntabi anya.
- source_word: οὐρανόν
  choice: n’eluigwe
  rationale: Okwu Grik a nwere ike ịpụta eluigwe ma ọ bụ mbara igwe; n’akụkọ banyere nrịgo Jizọs, “eluigwe” dabara nke ọma, ma e debere nhọrọ ọzọ n’akwụkwọ nkọwa.
- source_word: πορευομένου αὐτοῦ
  choice: ka ọ na-aga
  rationale: Nkebi a na-egosi na ọpụpụ ya na ilegide anya ha na-eme n’otu oge, n’agbakwụnyeghị nkọwa na-adịghị n’ọrụ Grik.
- source_word: ἰδοὺ
  choice: lee
  rationale: “Lee” bụ akara okwu na-adọta uche onye na-agụ n’ihe na-esote ma na-echekwa ike akụkọ ahụ n’Igbo dị ugbu a.
- source_word: ἄνδρες δύο
  choice: ndị ikom abụọ
  rationale: Okwu Grik ahụ kpọmkwem bụ ndị ikom abụọ; amaokwu a n’onwe ya akpọghị ha ndị mmụọ ozi.
- source_word: παρειστήκεισαν
  choice: guzoro n’akụkụ ha
  rationale: Nke a na-egosi na ndị ikom ahụ nọ n’akụkụ ha; ọ naghị agbakwụnye echiche na ha “pụtara” n’ụzọ ọrụ Grik ahụ na-ekwughị kpọmkwem.
- source_word: ἐσθήσεσι λευκαῖς
  choice: yi uwe ọcha
  rationale: “Uwe” bụ okwu Igbo sara mbara ma dị mfe nghọta nke na-adịghị akọwapụta ụdị uwe karịa ihe okwu Grik kwuru.
theological_decisions:
- issue: Nsụgharị οὐρανός n’akụkọ nrịgo Jizọs
  choice: eluigwe
  alternative: mbara igwe
  rationale: Ọnọdụ akụkọ a na-akwado “eluigwe,” ma okwu Grik ahụ nwekwara ike ịpụta “mbara igwe”; ya mere e chekwara mgbagwoju a n’akwụkwọ nkọwa kama idozi ya kpamkpam.
- issue: Ndị ndị ikom abụọ ahụ bụ
  choice: ndị ikom abụọ
  alternative: ndị mmụọ ozi abụọ
  rationale: Ihe odide Grik kwuru “ndị ikom abụọ,” ọ bụghị “ndị mmụọ ozi abụọ.” Nsụgharị ahụ hapụrụ onye na-agụ ka ọ ghọta njirimara ha site n’akụkọ gbara ya gburugburu.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, dị ugwu ma dị mfe nghọta. Ahịrịokwu ahụ na-echekwa mmegharị na-aga n’ihu nke ilegide anya na nke ịga, yana okwu ndọta uche “lee.” E zere ịkpọ ndị ikom ahụ ndị mmụọ ozi ebe amaokwu ahụ n’onwe ya na-akpọ ha naanị ndị ikom.
