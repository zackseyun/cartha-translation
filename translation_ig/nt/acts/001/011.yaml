revisions:
- from: Ha kwukwara, “Ndị ikom Galili, gịnị mere unu ji guzo na-ele anya n’eluigwe? Jizọs a[a], onye e si n’etiti unu welie gaa n’eluigwe, ga-abịa n’otu ụzọ ahụ unu si hụ ya ka ọ na-aga n’eluigwe.”
  to: Ha sịrị, “Ndị ikom Galili, gịnị mere unu ji guzo na-ele eluigwe anya? Jizọs a[a], onye e si n’etiti unu welie gaa n’eluigwe, ga-abịa n’otu aka ahụ unu hụrụ ya ka ọ na-aga n’eluigwe.”
  rationale: The revision clarifies that the disciples are looking heavenward, improves the Igbo expression of the comparison of manner, and corrects the footnote so that it represents the traditional interpretive expansion without placing it in the main text. It preserves the source’s wording and ambiguity without adding doctrinal claims.
