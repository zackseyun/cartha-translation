id: ACT.1.11
reference: Acts 1:11
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οἳ καὶ εἶπαν· Ἄνδρες Γαλιλαῖοι, τί ἑστήκατε ⸀βλέποντες εἰς τὸν οὐρανόν; οὗτος ὁ Ἰησοῦς ὁ ἀναλημφθεὶς ἀφ’ ὑμῶν εἰς τὸν οὐρανὸν οὕτως ἐλεύσεται ὃν τρόπον ἐθεάσασθε αὐτὸν πορευόμενον εἰς τὸν οὐρανόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/011.yaml
  text: They also said[a], “Men of Galilee, why do you stand looking into heaven? This Jesus, who was taken up from you into heaven, will come in the same way that you saw him going into heaven.”
translation:
  language: ig
  text: Ha sịrị, “Ndị ikom Galili, gịnị mere unu ji guzo na-ele eluigwe anya? Jizọs a[a], onye e si n’etiti unu welie gaa n’eluigwe, ga-abịa n’otu aka ahụ unu hụrụ ya ka ọ na-aga n’eluigwe.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, dị ka nsụgharị ọdịnala si kwuo, “Jizọs a bụ otu Jizọs ahụ.” Grik kwuru “Jizọs a”; okwu “otu Jizọs ahụ” bụ mgbakwunye nkọwa e ji mesie ike na ọ bụ otu onye ahụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄνδρες Γαλιλαῖοι
  choice: Ndị ikom Galili
  rationale: Nke a na-edobe ụdị nwoke dị na ἄνδρες ma na-eme ka okwu a e ji akpọ ndị a kpọmkwem daa nke ọma n’Igbo.
- source_word: τί ἑστήκατε βλέποντες
  choice: gịnị mere unu ji guzo na-ele anya
  rationale: ἑστήκατε na-egosi ọnọdụ ha nọ ugbu a, ebe βλέποντες na-akọwa ihe ha nọ na-eme; nsụgharị a na-edobe akụkụ abụọ ahụ n’Igbo nkịtị.
- source_word: εἰς τὸν οὐρανόν
  choice: n’eluigwe / gaa n’eluigwe
  rationale: N’akụkọ nrịgo Jizọs a, οὐρανός pụtara eluigwe karịa naanị mbara igwe; ‘gaa n’eluigwe’ na-egosikwa ntụziaka εἰς.
- source_word: οὗτος ὁ Ἰησοῦς
  choice: Jizọs a
  rationale: Nke a na-asụgharị demonstrative οὗτος kpọmkwem n’enweghị ịgbakwụnye okwu pụtara ‘otu onye ahụ,’ nke na-adịghị n’ederede Grik.
- source_word: ὁ ἀναλημφθεὶς ἀφ’ ὑμῶν
  choice: onye e si n’etiti unu welie gaa n’eluigwe
  rationale: ‘Welie gaa’ na-egosipụta nrịgo dị na ἀναλημφθείς, ebe ‘si n’etiti unu’ na-ekwupụta nkewapụ ya n’ebe ndị na-eso ụzọ nọ n’ụzọ Igbo doro anya.
- source_word: οὕτως ἐλεύσεται ὃν τρόπον
  choice: ga-abịa n’otu ụzọ ahụ
  rationale: Akụkụ Grik abụọ a na-atụnyere ụzọ ọ ga-esi abịa na ụzọ ha hụrụ ya ka ọ na-aga; okwu Igbo a na-edobe ntụnyere ahụ n’enweghị nkwughachi na-adịghị eke.
- source_word: ἐθεάσασθε
  choice: unu si hụ
  rationale: ‘Hụ’ bụ okwu Igbo doro anya nke na-enye isi ihe θεάομαι pụtara ebe a n’enweghị ime ka ilegide anya sie ike karịa ka isi mmalite kwuru.
- source_word: πορευόμενον
  choice: ka ọ na-aga
  rationale: Nke a na-egosipụta mmegharị Jizọs n’ụzọ dị mfe ma kwekọọ na participle Grik.
theological_decisions:
- issue: Ihe οὐρανός pụtara n’akụkọ nrịgo na nlọghachi Jizọs
  choice: eluigwe
  alternative: mbara igwe
  rationale: Ọ bụ ezie na οὐρανός nwekwara ike ịpụta mbara igwe a na-ahụ anya, ọnọdụ nrịgo Jizọs na nkwa ọ ga-alọghachi na-akwado ‘eluigwe,’ ma nke a adịghị agbakwụnye ozizi gafere ederede ahụ.
- issue: Ma a ga-asụgharị οὗτος ὁ Ἰησοῦς dị ka ‘Jizọs a’ ka ọ bụ ‘Jizọs a kpọmkwem’
  choice: Jizọs a
  alternative: Jizọs a kpọmkwem
  rationale: Grik nwere demonstrative pụtara ‘a,’ ma o nweghị okwu ọzọ pụtara ‘kpọmkwem’ ma ọ bụ ‘otu onye ahụ.’ Ya mere, e debere nsụgharị kpọmkwem n’ahụ amaokwu, tinyezie nsụgharị ọdịnala ahụ n’ala ala peeji.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta, dee ya. ‘Ndị ikom Galili’ na-edobe kpọmkwem ụdị nwoke na olu ọkpụkpọ nke isi mmalite; ‘si n’etiti unu’ na-eme ka nkewapụ pụta nke ọma n’Igbo nkịtị.
