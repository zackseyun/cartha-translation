  rationale: E degharịrị okwu mbụ ka ọ soro n'ụzọ ziri ezi na γνωστὸν ἐγένετο, ya bụ, na ihe ahụ ghọrọ ihe a maara n’etiti ndị bi na Jerusalem, ọ bụghị naanị na e kwuru na onye ọ bụla matara ya. E tinyere H n’aha ahụ iji soro Ἁκελδαμάχ, ma dozie ebe akara ala peeji b dị ka o wee kpọtụrụ διάλεκτος. A hapụrụ «ala» na «Ala Ọbara» ka χωρίον na gloss ya kwekọọ.
