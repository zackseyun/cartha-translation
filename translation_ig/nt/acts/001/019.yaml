source:
  edition: SBLGNT
  text: καὶ γνωστὸν ἐγένετο πᾶσι τοῖς κατοικοῦσιν Ἰερουσαλήμ, ὥστε κληθῆναι τὸ χωρίον ἐκεῖνο τῇ ⸀ἰδίᾳ διαλέκτῳ αὐτῶν Ἁκελδαμάχ, τοῦτ’ ἔστιν Χωρίον Αἵματος.—
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/019.yaml
  text: And it became known to all those living in Jerusalem[a], so that in their own language that field was called Akeldamach, that is[b], Field of Blood.
translation:
  language: ig
  text: Ihe a bịara bụrụ ihe ndị niile bi na Jerusalem maara, nke mere na a kpọrọ ala ahụ Hakeldamak[a] n’asụsụ nke ha,[b] ya bụ, Ala Ọbara.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Aha Grik e dere ebe a bụ Ἁκελδαμάχ (Hakeldamach); n’ọtụtụ nsụgharị, a na-edekwa ya “Akeldama.”
    reason: alternative_reading
  - marker: b
    text: A pụkwara ịsị, “n’olumba nke ha.” Okwu Grik διάλεκτος nwere ike ịpụta olumba mpaghara ma ọ bụ asụsụ n’ozuzu ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: γνωστὸν ἐγένετο
  choice: matara ihe a
  rationale: Ihe owuwu Grik a na-egosi na okwu a bịara bụrụ ihe ndị mmadụ maara; Igbo eke na-ekwu ya nke ọma dịka ‘matara ihe a’.
- source_word: πᾶσι τοῖς κατοικοῦσιν Ἰερουσαλήμ
  choice: Ndị niile bi na Jerusalem
  rationale: Nke a na-edobe ‘ndị niile’ na echiche nke ndị na-ebi n’obodo ahụ n’asụsụ Igbo doro anya.
- source_word: ὥστε
  choice: nke mere na
  rationale: Ọ na-egosi ihe si n’ịmata okwu ahụ pụta, ọ bụghị naanị nkwubi okwu ezi uche.
- source_word: κληθῆναι
  choice: a kpọrọ
  rationale: Ụdị a na-edobe olu nnara nke Grik ma bụrụkwa okwu Igbo a na-ejikarị ekwu aha a kpọrọ ebe.
- source_word: τὸ χωρίον ἐκεῖνο
  choice: ala ahụ
  rationale: χωρίον nwere ike ịbụ ubi, ibé ala, ma ọ bụ ebe; ‘ala ahụ’ bụ okwu sara mbara ma kwekọọ na ebe e nyere aha.
- source_word: τῇ ἰδίᾳ διαλέκτῳ αὐτῶν
  choice: n’asụsụ nke ha
  rationale: διάλεκτος nwere ike ịpụta asụsụ ma ọ bụ olumba; ‘asụsụ’ bụ okwu Igbo eke, ebe nkọwa ala peeji na-echekwa nhọrọ ‘olumba’.
- source_word: Ἁκελδαμάχ
  choice: Akeldamak
  rationale: A tụgharịrị ụda aha Grik ahụ n’usoro mkpụrụedemede Igbo, jiri k nọchi ụda ikpeazụ χ.
- source_word: τοῦτ’ ἔστιν
  choice: ya bụ
  rationale: Nke a bụ usoro Igbo dị mkpirikpi ma bụrụ eke maka iwebata nkọwa aha.
- source_word: Χωρίον Αἵματος
  choice: Ala Ọbara
  rationale: Ọ na-edobe nkọwa aha ebe ahụ n’ụzọ kpọmkwem; ‘Ala’ kwekọrọ na χωρίον e jiri mee ihe tupu ya.
theological_decisions: []
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. E debere njikọ nsonaazụ nke ὥστε, ma chekwaa mgbagwoju anya dị n’etiti ‘asụsụ’ na ‘olumba’ n’ala peeji. Ihe nrịbama ala peeji abụọ pụtara n’ahịrịokwu bụ isi.
