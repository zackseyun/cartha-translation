review_pass:
  verdict: revise
  source_fidelity: 'A na-edobe isi ihe nke amaokwu ahụ, ma «Ndị niile bi na Jerusalem matara ihe a» na-eme ka ọ dị ka onye ọ bụla n''otu n''otu matara ya.  γνωστὸν ἐγένετο bụ okwu na-enweghị onye na-arụ ya kpọmkwem: ihe ahụ ghọrọ ihe a maara n’ebe ndị bi na Jerusalem nọ. Ntọala aha «Hakeldamak» na-egosikwa ume siri ike mbụ dị na Ἁκελδαμάχ karịa «Akeldamak».'
  naturalness: «Ihe a bịara bụrụ ihe ndị niile bi na Jerusalem maara» bụ Standard Igbo doro anya ma na-edobe echiche ‘became known.’ «N’ asụsụ nke ha» adịghị mkpa oghere mgbe apostrofi gasịrị; a na-ede ya «n’asụsụ nke ha».
  terminology: «Ala ahụ» na «Ala Ọbara» na-adaba nke ọma na χωρίον, ebe «ya bụ» na-akọwa gloss ahụ n’enweghị ịgbakwunye nkọwa. «Asụsụ» bụ nhọrọ eke maka διάλεκτος; nkọwa ala peeji na-echekwa nhọrọ «olumba».
  issues:
  - severity: medium
    issue: A sụgharịrị γνωστὸν ἐγένετο dịka «Ndị niile ... matara ihe a.»
    rationale: Nke a na-agbanwe ntakịrị okwu Grik na-enweghị onye na-arụ ya kpọmkwem ka ọ bụrụ nkwupụta na onye ọ bụla matara ya. Ekwesịrị igosi na ihe ahụ ghọrọ ihe a maara n’etiti ndị bi n’obodo ahụ.
  - severity: medium
    issue: Aha ebe ahụ n’ahịrịokwu bụ «Akeldamak», ebe ala peeji na-ekwu «Hakeldamakh».
    rationale: Ἁκελδαμάχ nwere rough breathing mbụ; «Hakeldamak» na-eme ka nsụgharị Igbo kwekọọ n’ụdị Grik e nyere ma kwekọọkwa na nkọwa ala peeji.
  - severity: low
    issue: Akara ala peeji b dị na «Ala Ọbara» kama ịbụ na «asụsụ».
    rationale: Nkọwa b na-atụle διάλεκτος (‘asụsụ/olumba’), ya mere akara ya kwesịrị iso «n’asụsụ nke ha» ka njikọ ya doo anya.
