revisions:
- from: N’ihi na Jọn ji mmiri mee unu baptizim, ma a ga-eme unu baptizim n’ime Mmụọ Nsọ[a] mgbe ụbọchị ole na ole gachara.
  to: N’ihi na Jọn ji mmiri mee baptizim, ma a ga-eme unu baptizim n’ime Mmụọ Nsọ[a] n’ime ụbọchị ole na ole.
  rationale: The revision removes an object not present in the Greek from the generic statement about John's baptism, preserves the future passive and the interpretive openness of ἐν, and renders the imminent negative time expression naturally without implying a completed waiting period.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T08:27:04Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately retains the causal/explanatory opening, the water/Spirit contrast, and the future passive for the disciples. However, adding "unu" to John's clause makes John explicitly baptize the present addressees, whereas the Greek states generically that John baptized with water. The final temporal phrase, "mgbe ụbọchị ole na ole gachara," more naturally means “after a few days” and does not adequately convey “not many days from now.”
  naturalness: The baptism formula is understandable and suitably formal in Standard Igbo. Omitting the unnecessary object from John's generic statement improves precision and flow. "n'ime ụbọchị ole na ole" is idiomatic for the imminent time reference.
  terminology: '"baptizim," "Mmụọ Nsọ," and the retained contrast between "ji mmiri" and "n''ime Mmụọ Nsọ" are appropriate. The footnote should identify ἐν specifically as the Greek preposition whose sense may be rendered in either way.'
  issues:
  - severity: medium
    issue: The object "unu" is supplied in John's clause.
    rationale: ἐβάπτισεν has no stated object in the source. The supplied object narrows the generic statement about John's baptism to the immediate audience.
  - severity: medium
    issue: '"mgbe ụbọchị ole na ole gachara" does not clearly express the source''s negative temporal idiom.'
    rationale: It normally means “after a few days,” while οὐ μετὰ πολλὰς ταύτας ἡμέρας means that the event will occur within no many days from the present point.
  - severity: low
    issue: The footnote refers vaguely to "Okwu Grik a."
    rationale: Naming the preposition ἐν makes clear what element has the alternative rendering.
  revised_text: N’ihi na Jọn ji mmiri mee baptizim, ma a ga-eme unu baptizim n’ime Mmụọ Nsọ[a] n’ime ụbọchị ole na ole.
  revised_footnotes:
  - marker: a
    text: A pụkwara ịsị, “jiri Mmụọ Nsọ.” Enwere ike ịghọta mkpụrụokwu Grik ἐν dịka “n’ime” ma ọ bụ “jiri.”
    reason: alternative_reading
  revision_rationale: The revision removes an object not present in the Greek from the generic statement about John's baptism, preserves the future passive and the interpretive openness of ἐν, and renders the imminent negative time expression naturally without implying a completed waiting period.
