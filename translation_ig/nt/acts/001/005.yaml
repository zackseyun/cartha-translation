id: ACT.1.5
reference: Acts 1:5
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὅτι Ἰωάννης μὲν ἐβάπτισεν ὕδατι, ὑμεῖς δὲ ⸂ἐν πνεύματι βαπτισθήσεσθε⸃ ἁγίῳ οὐ μετὰ πολλὰς ταύτας ἡμέρας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/005.yaml
  text: For John baptized with water[a], but you will be baptized in the Holy Spirit not many days from now.
translation:
  language: ig
  text: N’ihi na Jọn ji mmiri mee baptizim, ma a ga-eme unu baptizim n’ime Mmụọ Nsọ[a] n’ime ụbọchị ole na ole.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “jiri Mmụọ Nsọ.” Enwere ike ịghọta mkpụrụokwu Grik ἐν dịka “n’ime” ma ọ bụ “jiri.”
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: N’ihi na
  rationale: N’ọnọdụ a, okwu ahụ na-enye nkọwa ma ọ bụ ihe ndabere maka okwu Jizọs kwuru tupu ya; “N’ihi na” na-eme nke a n’Igbo n’ụzọ doro anya.
- source_word: ἐβάπτισεν
  choice: mee unu baptizim
  rationale: Okwu a na-echekwa okwu okpukpe a maara nke ọma, ma ọ naghị ekpebi kpọmkwem etu e si etinye mmadụ na mmiri.
- source_word: ὕδατι
  choice: ji mmiri
  rationale: Dative ahụ nwere ike igosi ihe e ji mee ihe; “ji mmiri” bụ okwu Igbo ebumpụta ụwa ma na-egosipụta ọdịiche dị n’etiti mmiri na Mmụọ Nsọ.
- source_word: ἐν πνεύματι ἁγίῳ
  choice: n’ime Mmụọ Nsọ
  rationale: “N’ime” na-egosipụta ἐν nke ọma ma na-ahapụ ohere ma a na-ekwu maka ọnọdụ mmadụ batara n’ime ya ka ọ bụ ihe e ji mee baptizim; a kọwara nhọrọ ọzọ n’okpuru peeji.
- source_word: βαπτισθήσεσθε
  choice: a ga-eme unu baptizim
  rationale: Nke a na-echekwa ọdịnihu na olu nnabata nke Grik, na-ahapụ onye ga-eme ya n’ekwughị aha dịka isi mmalite ahụ si mee.
- source_word: οὐ μετὰ πολλὰς ταύτας ἡμέρας
  choice: mgbe ụbọchị ole na ole gachara
  rationale: Nke a bụ ụzọ Igbo dị mfe ma bụrụkwa nke ebumpụta ụwa isi kwuo na ihe ahụ ga-eme n’oge na-adịghị anya.
theological_decisions:
- issue: Ntụgharị ἐν πνεύματι ἁγίῳ n’okwu banyere baptizim nke Mmụọ Nsọ
  choice: n’ime Mmụọ Nsọ
  alternative: jiri Mmụọ Nsọ
  rationale: ἐν nwere ike ịpụta ọnọdụ ma ọ bụ ihe e ji eme ihe. “N’ime Mmụọ Nsọ” na-echekwa esemokwu nkọwa ahụ nke ọma, ebe ihe odide ala peeji na-enye ntụgharị ọzọ n’enweghị ịkwado ozizi otu ụka.
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. “Mee baptizim” bụ okwu a maara n’ọgbakọ Ndị Kraịst, ma ọ naghị amanye otu nkọwa gbasara usoro baptizim. Akara [a] dị n’isi okwu dịka achọrọ.
