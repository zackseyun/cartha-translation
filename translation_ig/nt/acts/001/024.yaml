  text: καὶ προσευξάμενοι εἶπαν Σὺ κύριε καρδιογνῶστα πάντων, ἀνάδειξον ὃν ἐξελέξω, ἐκ τούτων τῶν δύο ἕνα,
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/024.yaml
  text: And after praying[a], they said, “You, Lord, knower of the hearts of all[b], show which one of these two you have chosen,”
translation:
  language: ig
  text: Mgbe ha kpechara ekpere, ha sịrị, “Gị, Onyenweanyị[b], onye maara obi mmadụ niile, gosi[a] onye ị họọrọ n’ime mmadụ abụọ ndị a.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “mee ka a mata,” “gosi n’ihu ọha,” ma ọ bụ “họpụta.” Ngwaa Greek a pụrụ ịpụta ime ka a mata ma ọ bụ igosi onye a họọrọ n’ihu ọha.
    reason: lexical_alternative
  - marker: b
    text: A pụrụ ịghọta na a na-agwa Chineke n’ozuzu ya okwu, ma ọ bụ na a na-agwa Jizọs kpọmkwem; Greek ahụ ekwughị onye ọ bụ hoo haa n’ebe a.
    reason: alternative_reading
lexical_decisions:
- source_word: προσευξάμενοι
  choice: Mgbe ha kpechara ekpere
  rationale: Aorist participle a na-egosi ihe mere tupu ngwaa bụ isi; nsụgharị a bụ Igbo sitere n’ọnụ ma na-echekwa usoro ahụ.
- source_word: Σὺ κύριε
  choice: Gị, Onyenwe anyị
  rationale: “Gị” na-echekwa nkwusi okwu dị na nnọchiaha Greek ahụ, ebe “Onyenwe anyị” bụ okwu nkwanye ugwu a na-ejikarị sụgharịa κύριος.
- source_word: καρδιογνῶστα πάντων
  choice: onye maara obi mmadụ niile
  rationale: Nke a na-egosipụta aha ahụ pụtara onye maara ihe dị n’obi mmadụ niile, n’ụzọ doro ndị na-agụ Igbo anya.
- source_word: ἀνάδειξον
  choice: gosi anyị
  rationale: “Gosi anyị” na-adaba n’arịrịọ ka Onyenwe anyị mee ka ha mata onye ọ họọrọ, n’ebughị ụzọ kpebie na ngwaa ahụ pụtara nhọpụta n’ọkwa n’onwe ya.
- source_word: ὃν ἐξελέξω
  choice: onye ị họọrọ
  rationale: Ọ na-egosi na nhọrọ ahụ bụ nke Onyenwe anyị mewororị, ebe ndị na-ekpe ekpere na-arịọ ka e mee ka ha mata ya.
- source_word: ἐκ τούτων τῶν δύο ἕνα
  choice: n’ime mmadụ abụọ ndị a
  rationale: Nke a na-egosi nhọrọ otu onye n’etiti mmadụ abụọ ahụ; “mmadụ” kwekọrọ n’ebe a ma ghara ịkọwapụta ha karịa ihe odide ahụ.
theological_decisions:
- issue: Onye a na-akpọ “Onyenwe anyị” n’ekpere ahụ
  choice: E debere naanị “Onyenwe anyị” n’akọwaghị ma ọ bụ Chineke n’ozuzu ya ka a na-agwa, ma ọ bụ Jizọs kpọmkwem.
  alternative: Ịkọwa ya kpọmkwem dị ka Chineke Nna ma ọ bụ Jizọs ahụ bilitere n’ọnwụ.
  rationale: Greek ahụ anaghị akpọ onye a kpọrọ aha karịa κύριε; ya mere nsụgharị kwesịrị ichekwa mgbagwoju nghọta ahụ kama idozi ya n’ụzọ nke otu ozizi.
translation_notes:
  register: Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. E ji “onye maara obi mmadụ niile” dochie okwu ngwakọta Greek n’ụzọ sitere n’ọnụ, ma e chekwara nkwusi okwu nke Σὺ site na “Gị.”
