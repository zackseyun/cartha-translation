review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the prior prayer, the emphatic direct address, God/Lord as knower of hearts, and the request to identify the already chosen candidate. However, “Onyenwe anyị” introduces the possessive “our,” and “gosi anyị” introduces “us,” neither of which is expressed in the Greek. The revised wording avoids both additions while retaining the intended sense.
  naturalness: “Mgbe ha kpechara ekpere” and “onye maara obi mmadụ niile” are clear, natural Standard Igbo. “Gị, Onyenweanyị” gives a respectful direct address without the unintended first-person plural possessive. “Gosi onye ị họọrọ n’ime mmadụ abụọ ndị a” is idiomatic and sufficiently represents the imperative and its object.
  terminology: “Onyenweanyị” is used as the established Igbo title for “Lord,” without resolving whether the referent is God generally or Jesus specifically. The descriptive rendering of καρδιογνῶστα preserves its sense without imposing a theological interpretation.
  issues:
  - severity: medium
    issue: “Onyenwe anyị” adds a first-person plural possessive.
    rationale: The Greek vocative κύριε is simply “Lord”; it contains no equivalent of “our.” Using the lexical title “Onyenweanyị” avoids this added possessive.
  - severity: medium
    issue: “gosi anyị” adds an indirect object.
    rationale: ἀνάδειξον takes the person to be indicated as its expressed object; the Greek does not say “show us.” The imperative “gosi” preserves the request without supplying an unexpressed recipient.
  - severity: low
    issue: Footnote a is anchored at the end rather than at the verb it explains.
    rationale: The lexical-alternative note concerns “gosi” (ἀνάδειξον), so its marker should directly follow that word. The referent note should be anchored to “Onyenweanyị.”
