revisions:
- from: Mgbe ọ tara ahụhụ, o gosikwara onwe ya nye ha na ọ dị ndụ site n'ọtụtụ ihe akaebe[a]. N'ime oge dị ụbọchị iri anọ[b], ọ nọ na-apụta n'ihu ha ma na-agwa ha ihe ndị metụtara alaeze Chineke.
  to: Mgbe ọ tara ahụhụ, o gosikwara ha onwe ya dị ndụ site n'ọtụtụ ihe akaebe[a]. N'ime ụbọchị iri anọ[b], ọ nọ na-apụta n'ihu ha ma na-agwa ha ihe ndị metụtara alaeze Chineke.
  rationale: A small syntactic revision makes Jesus’ post-suffering state as “alive” directly modify him, as ζῶντα does in Greek. The footnote’s temporal alternative is refined so that it conveys appearances across the forty-day period rather than an endpoint. No theological or interpretive expansion has been added.
