review_pass:
  verdict: revise
  source_fidelity: The draft preserves the core sense of παρουσιάζω with the reflexive, Jesus’ being alive after suffering, the evidential phrase, the forty-day span, appearances, and teaching about God’s kingdom. However, “o gosikwara onwe ya nye ha na ọ dị ndụ” can be read as “he showed himself to them that he is alive,” rather than directly predicating “alive” of himself. The revised wording makes ζῶντα unambiguous.
  naturalness: The revised sentence order and wording are more idiomatic Standard Igbo while retaining the formal biblical register. “O gosikwara ha onwe ya dị ndụ” naturally expresses that he showed himself to them alive. “N’ime ụbọchị iri anọ” conveys the temporal span without suggesting uninterrupted appearances.
  terminology: “Ihe akaebe” suitably renders τεκμήρια without importing “infallible.” “Alaeze Chineke” is the established, suitably broad rendering of βασιλεία τοῦ θεοῦ. The footnote alternatives are retained, with the temporal alternative adjusted to avoid the potentially misleading “ruo ụbọchị iri anọ.”
  issues:
  - severity: medium
    issue: Ambiguity in the rendering of ζῶντα
    rationale: In “o gosikwara onwe ya nye ha na ọ dị ndụ,” the clause “na ọ dị ndụ” may be understood as the content of what he showed them, instead of the Greek predicate participle describing him as alive. Recasting it as “o gosikwara ha onwe ya dị ndụ” directly and naturally modifies “onwe ya.”
  - severity: low
    issue: Temporal footnote alternative “ruo ụbọchị iri anọ”
    rationale: “Ruo” can imply an endpoint (“until forty days”) and is less precise for διά with the genitive, which denotes appearances distributed through a forty-day period. “N’ime ụbọchị iri anọ” or “n’ofe ụbọchị iri anọ” better preserves the source sense.
  revised_text: Mgbe ọ tara ahụhụ, o gosikwara ha onwe ya dị ndụ site n'ọtụtụ ihe akaebe[a]. N'ime ụbọchị iri anọ[b], ọ nọ na-apụta n'ihu ha ma na-agwa ha ihe ndị metụtara alaeze Chineke.
  revised_footnotes:
