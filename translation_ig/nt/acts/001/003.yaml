id: ACT.1.3
reference: Acts 1:3
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οἷς καὶ παρέστησεν ἑαυτὸν ζῶντα μετὰ τὸ παθεῖν αὐτὸν ἐν πολλοῖς τεκμηρίοις, δι’ ἡμερῶν τεσσεράκοντα ὀπτανόμενος αὐτοῖς καὶ λέγων τὰ περὶ τῆς βασιλείας τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/003.yaml
  text: To them he also presented himself alive after he had suffered[a], by many proofs[b], appearing to them over forty days and speaking about the kingdom of God.
translation:
  language: ig
  text: Mgbe ọ tara ahụhụ, o gosikwara ha onwe ya dị ndụ site n'ọtụtụ ihe akaebe[a]. N'ime ụbọchị iri anọ[b], ọ nọ na-apụta n'ihu ha ma na-agwa ha ihe ndị metụtara alaeze Chineke.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “site n'ọtụtụ ihe akaebe siri ike.” Okwu Grik a na-ezo aka n’ihe akaebe na-eme ka e jide n’aka.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, “n’ofe ụbọchị iri anọ” ma ọ bụ “n'ime ụbọchị iri anọ.” Nkebiokwu ahụ na-egosi na ọ pụtara nye ha n’oge dị iche iche n’ofe oge ahụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἷς
  choice: nye ha
  rationale: Nnọchiaha a na-ezo aka n’ebe ndịozi a kpọtụrụ aha n’amaokwu bu ụzọ nọ. A hapụrụ ya dị ka “ha” n’ihi na okwu Grik ahụ n’onwe ya etinyeghị okwu pụtara “ndị ikom.”
- source_word: παρέστησεν ἑαυτὸν ζῶντα
  choice: o gosikwara onwe ya nye ha na ọ dị ndụ
  rationale: Nke a na-egosipụta na Jizọs mere ka ha hụ ya n’onwe ya dị ndụ mgbe ahụhụ ya gasịrị, n’asụsụ Igbo doro anya ma dịkwa ugwu.
- source_word: μετὰ τὸ παθεῖν αὐτὸν
  choice: mgbe ọ tara ahụhụ
  rationale: 'Μετά tinyere infinitive a na-egosi oge: ihe a mere mgbe ahụhụ ya gasịrị. “Tara ahụhụ” bụ okwu Igbo nkịtị nke na-adịghị agbakwụnye nkọwa karịrị isi mmalite ahụ.'
- source_word: ἐν πολλοῖς τεκμηρίοις
  choice: site n'ọtụtụ ihe akaebe
  rationale: τεκμήριον bụ ihe akaebe na-eme ka e nwee nkwenye siri ike. “Ihe akaebe” na-echekwa ike okwu ahụ n’etinyeghị nkọwa ọzọ n’ahịrị isi.
- source_word: δι’ ἡμερῶν τεσσεράκοντα
  choice: n'ime oge dị ụbọchị iri anọ
  rationale: Nkebiokwu ahụ na-egosi na ọ pụtara nye ha ugboro ugboro n’ofe oge ahụ, ọ bụghị na ọdịdị ahụ gara n’ihu n’enweghị nkwụsị ruo ụbọchị iri anọ.
- source_word: ὀπτανόμενος αὐτοῖς
  choice: ọ nọ na-apụta n'ihu ha
  rationale: Ụdị participle a na-egosi ọdịdị ndị mere n’oge ahụ. Okwu a bụ Igbo eke maka mmadụ ịpụta ka ndị ọzọ hụ ya.
- source_word: λέγων τὰ περὶ τῆς βασιλείας τοῦ θεοῦ
  choice: na-agwa ha ihe ndị metụtara alaeze Chineke
  rationale: τὰ περὶ pụtara ihe ndị metụtara otu isiokwu. “Alaeze Chineke” na-echekwa okwu ọdịnala na obosara βασιλεία, nke pụrụ ịgụnye ọchịchị na alaeze.
theological_decisions:
- issue: Mbilite n’ọnwụ na ike nke ihe akaebe
  choice: E kwuru hoo haa na Jizọs gosiri onwe ya na ọ dị ndụ mgbe ọ tara ahụhụ, site n'ọtụtụ ihe akaebe.
  alternative: Ịsụgharị τεκμήρια dị ka “ihe akaebe ndị na-apụghị ịgbagha agbagha.”
  rationale: Isi Grik na-ekwusi ike na e nwere ihe akaebe na-eme ka e jide n’aka, ma ahịrị isi adịghị agbakwụnye adjective nke pụrụ ime ka nsụgharị ahụ sie ike karịa usoro okwu mbụ.
- issue: Onye οἷς na-ezo aka na ya
  choice: “nye ha”
  alternative: “nye ndị ikom ndị a”
  rationale: Ọ bụ ndịozi ahụ ka okwu a na-ezo aka na ha, ma οἷς n’onwe ya ekwughị “ndị ikom.” Ya mere, “ha” bụ nke kacha nso n’ụdị isi mmalite ahụ ma ihe gbara ya gburugburu na-eme ka ndị a bụ doo anya.
- issue: Uche gbasara βασιλεία τοῦ θεοῦ
  choice: “alaeze Chineke”
  alternative: “ọchịchị Chineke”
  rationale: βασιλεία pụrụ ịpụta ọchịchị eze ma ọ bụ alaeze. “Alaeze Chineke” na-echekwa ambiguiti na njikọ okwu Akwụkwọ Nsọ a na-ahụkarị n’Igbo n’akọwaghị ya naanị dị ka ọchịchị.
translation_notes:
  register: E ji Standard Igbo nke oge a, doro anya ma dị ugwu. A zere okwu ụka nke otu denomination na-asụ naanị ya, ma debe “alaeze Chineke” n’ihi na ọ bụ okwu Akwụkwọ Nsọ a maara nke ọma ma na-echekwa obosara nke βασιλεία.
