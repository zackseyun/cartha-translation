review_pass:
  verdict: revise
  source_fidelity: The temporal span, passive ‘was taken up,’ carried-over necessity from v. 21, and resurrection-witness role are retained. Revising ‘isonyere anyị’ to ‘iso anyị bụrụ’ better represents σὺν ἡμῖν γενέσθαι without suggesting merely that the candidate joins the group.
  naturalness: The revised wording is more idiomatic Standard Igbo. ‘Malite site na ... ruo ...’ clearly marks the source’s temporal range, while ‘aghaghị iso anyị bụrụ onye akaebe’ reads naturally as becoming a witness together with the existing apostles.
  terminology: ‘Baptizim Jọn,’ ‘e buliri ya elu,’ ‘onye akaebe,’ and ‘mbilite n’ọnwụ’ are appropriate, clear biblical-register terms. ‘Banyere mbilite n’ọnwụ ya’ is a natural Igbo rendering of the genitive and does not impose a theological interpretation.
  issues:
  - severity: low
    issue: ‘isonyere anyị bụrụ’ can imply simply joining the group.
    rationale: σὺν ἡμῖν qualifies becoming a witness alongside the existing witnesses. ‘Iso anyị bụrụ’ expresses this relationship more directly and naturally.
  - severity: low
    issue: The temporal opener lacks the explicit prepositional force of ἀπό.
    rationale: Adding ‘site na’ gives a clear ‘from ... until’ span while preserving the participial, verse-continuing form.
  revised_text: malite site na baptizim Jọn[a] ruo n’ụbọchị e buliri ya elu pụọ n’ebe anyị nọ, otu onye n’ime ndị a aghaghị iso anyị bụrụ onye akaebe banyere mbilite n’ọnwụ ya.[b]
