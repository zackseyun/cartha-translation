id: ACT.1.22
reference: Acts 1:22
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀρξάμενος ἀπὸ τοῦ βαπτίσματος Ἰωάννου ἕως τῆς ἡμέρας ἧς ἀνελήμφθη ἀφ’ ἡμῶν, μάρτυρα τῆς ἀναστάσεως αὐτοῦ ⸂σὺν ἡμῖν γενέσθαι⸃ ἕνα τούτων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/022.yaml
  text: beginning from the baptism of John until the day when he was taken up from us[b][a], one of these must become a witness with us of his resurrection.
translation:
  language: ig
  text: malite site na baptizim Jọn[a] ruo n’ụbọchị e buliri ya elu pụọ n’ebe anyị nọ, otu onye n’ime ndị a aghaghị iso anyị bụrụ onye akaebe banyere mbilite n’ọnwụ ya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “malite n’oge Jọn na-eme baptizim.”
    reason: lexical_alternative
  - marker: b
    text: 'N’ụzọ dị nso n’okwu Grik: “onye akaebe nke mbilite n’ọnwụ ya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀρξάμενος ἀπὸ τοῦ βαπτίσματος Ἰωάννου
  choice: malite na baptizim Jọn
  rationale: Nke a na-edobe echiche nke mmalite oge ahụ na usoro ‘site na ... ruo ...’. ‘Baptizim Jọn’ na-ahapụ njikọ genitiv nke Grik ka ọ ghara ịkọwa ya karịa ihe ederede kwuru.
- source_word: ἕως τῆς ἡμέρας ἧς
  choice: ruo n’ụbọchị
  rationale: Ọ bụ ụzọ Igbo dị mfe ma bụrụkwa nke ebumpụta ụwa isi gosi njedebe oge nke ahịrịokwu Grik ahụ.
- source_word: ἀνελήμφθη ἀφ’ ἡμῶν
  choice: e buliri ya elu pụọ n’ebe anyị nọ
  rationale: ‘E buliri ya elu’ na-echekwa olu nnara na echiche ịrịgo elu dị na okwu Grik ahụ; ‘pụọ n’ebe anyị nọ’ na-egosikwa ἀφ’ ἡμῶν n’enweghị ịgbakwunye ebe e buliri ya gaa.
- source_word: μάρτυρα τῆς ἀναστάσεως αὐτοῦ
  choice: onye akaebe banyere mbilite n’ọnwụ ya
  rationale: ‘Onye akaebe’ bụ okwu Igbo doro anya maka μάρτυς, ebe ‘banyere’ na-eme ka njikọ genitiv ahụ bụrụ nke ebumpụta ụwa n’Igbo n’enweghị ịgbanwe ihe a na-agba akaebe banyere ya.
- source_word: σὺν ἡμῖν γενέσθαι
  choice: isonyere anyị bụrụ
  rationale: Nke a na-egosi ma ịbanye n’otu ndị akaebe ahụ (‘soro anyị’) ma ịghọ onye akaebe, n’usoro Igbo dị mma.
- source_word: ἕνα τούτων
  choice: otu onye n’ime ndị a
  rationale: ‘Otu onye’ na-eme ka nrụtụ aka ahụ doo anya n’Igbo, ebe ‘n’ime ndị a’ na-esochi okwu Grik ahụ n’etinyeghị nkọwa ọzọ na-adịghị na amaokwu a.
theological_decisions:
- issue: Iwetara amaokwu a echiche nke δεῖ sitere n’amaokwu gara aga
  choice: aghaghị
  alternative: ịbụ naanị infinitive ‘ịghọ/ịbụ’ n’enweghị okwu na-egosi mkpa
  rationale: Amaokwu 22 dabere n’ụtọasụsụ na δεῖ nke amaokwu 21. ‘Aghaghị’ na-eme ka ike nke ahịrịokwu zuru ezu pụta n’Igbo n’etinyeghị echiche ọhụrụ.
- issue: Okwu gbasara mbuli Jizọs elu
  choice: e buliri ya elu pụọ n’ebe anyị nọ
  alternative: ọ rịgoro n’eluigwe
  rationale: Nhọrọ a na-edobe olu nnara na echiche ịdị elu nke ἀνελήμφθη, ma ọ naghị agbakwunye ‘n’eluigwe,’ nke na-adịghị n’amaokwu a.
- issue: Njikọ onye akaebe na mbilite n’ọnwụ
  choice: onye akaebe banyere mbilite n’ọnwụ ya
  alternative: onye akaebe nke mbilite n’ọnwụ ya
  rationale: ‘Banyere’ bụ Igbo dị ndụ ma doo anya; ọ na-egosi isiokwu nke akaebe ahụ ma ghara idozi genitiv Grik ahụ n’ụzọ ozizi pụrụ iche.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta, dee ya. E chekwara usoro oge ‘malite ... ruo ...’, olu nnara nke mbuli elu, na ndabere amaokwu a na iwu mkpa dị n’amaokwu 21. A hapụrụ ‘baptizim Jọn’ n’ụdị nwere ntakịrị mgbagwoju anya dịka genitiv Grik ahụ, ma kọwaa ụzọ ọzọ n’okpuru peeji.
