id: ACT.1.18
reference: Acts 1:18
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Οὗτος μὲν οὖν ἐκτήσατο χωρίον ἐκ μισθοῦ τῆς ἀδικίας, καὶ πρηνὴς γενόμενος ἐλάκησεν μέσος, καὶ ἐξεχύθη πάντα τὰ σπλάγχνα αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/018.yaml
  text: So this man acquired a field with the wages of unrighteousness[a], and falling headlong he burst open in the middle[c][b], and all his intestines spilled out.
translation:
  language: ig
  text: Ya mere, nwoke a ji ụgwọ ọrụ nke ajọ omume nweta otu ubi[a][c], mgbe ọ dara isi n’ala[b], afọ ya gbawara n’etiti, akụkụ ime afọ ya niile wee wụpụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ịsụgharị ya: “site n’ụgwọ ajọ omume.” Okwu Grik nwere ike ịpụta ụgwọ, ụgwọ ọrụ, ma ọ bụ uru e nwetara site n’omume ọjọọ.'
    reason: lexical_alternative
  - marker: b
    text: 'Ma ọ bụ: “mgbe ọ dara ihu n’ala.” Okwu Grik na-egosi ọnọdụ ihu ma ọ bụ isi chere ala, ma o nwere ike ịkọwa ọdịda isi buru ụzọ.'
    reason: lexical_alternative
  - marker: c
    text: Okwu Grik kwuru na nwoke a “nwetara” ubi ahụ; nke a apụtaghị n’ụzọ ga-ewepụ obi abụọ na ọ bụ ya ji aka ya zụta ya. O nwere ike ịkọwa ubi e nwetara site n’ego metụtara Judas.
    reason: alternative_reading
lexical_decisions:
- source_word: Οὗτος μὲν οὖν
  choice: Ya mere, nwoke a
  rationale: “Nwoke a” na-ezo aka na Judas; “Ya mere” na-egosipụta njikọ na ntụgharị okwu nke μέν οὖν n’Igbo dị mfe ma kwụ ọtọ.
- source_word: ἐκτήσατο
  choice: nwetara
  rationale: “Nwetara” na-egosi inweta ma ọ bụ ịbanye n’ọchịchị ihe, n’emeghị ka ihe odide ahụ kwuo hoo haa na Judas n’onwe ya zụtara ubi ahụ.
- source_word: χωρίον
  choice: otu ubi
  rationale: “Ubi” bụ okwu Igbo doro anya maka ala ma ọ bụ ibé ala a na-ekwu maka ya ebe a.
- source_word: ἐκ μισθοῦ τῆς ἀδικίας
  choice: ji ụgwọ ọrụ ajọ omume
  rationale: “Ụgwọ ọrụ” na-anọchi μισθός, “ajọ omume” ana-egosikwa ἀδικία n’asụsụ Igbo nke ndị mmadụ na-aghọta; “ji” na-egosi na ego ahụ bụ ụzọ e si nweta ubi ahụ.
- source_word: πρηνὴς γενόμενος
  choice: mgbe ọ dara isi n’ala
  rationale: Nke a na-egosi ọdịda ihu ma ọ bụ isi buru ụzọ, ma na-ezere nkọwa siri ike karịa ihe okwu Grik n’onwe ya kwuru.
- source_word: ἐλάκησεν μέσος
  choice: afọ ya gbawara n’etiti
  rationale: “Gbawara n’etiti” na-egosipụta λακάω na μέσος n’ụzọ doro anya ma bụrụkwa Igbo eke; “afọ ya” na-akọwapụta etiti ahụ n’ụzọ kwekọrọ n’ọpụpụ akụkụ ime afọ ya.
- source_word: ἐξεχύθη
  choice: wụpụ
  rationale: “Wụpụ” bụ okwu Igbo e ji akọwa ihe dị n’ime nke si n’ebe ọ nọ pụta n’ike.
- source_word: πάντα τὰ σπλάγχνα αὐτοῦ
  choice: akụkụ afọ ya niile
  rationale: Nke a bụ okwu nghọta sara mbara maka akụkụ ime afọ/eriri afọ, na-ejigide ihe oyiyi anụ ahụ n’enweghị okwu ochie ma ọ bụ nke siri ike nghọta.
theological_decisions:
- issue: Mmekọrịta Judas na inweta ubi ahụ
  choice: A sụgharịrị ἐκτήσατο dịka “nwetara,” ọ bụghị “zụtara.”
  alternative: “Judas zụtara ubi ahụ” ma ọ bụ “e ji ego ya zụta ubi ahụ n’aha ya.”
  rationale: Okwu Grik na-ekwu na ọ nwetara ubi ahụ, ma ọ kọwaghị kpọmkwem usoro e si zụta ya. Nhọrọ a na-edobe esemokwu dị n’etiti akụkọ a na Matiu 27:5–8 kama idozi ya n’ime nsụgharị.
translation_notes:
  register: Standard Igbo dị ugbu a, nke nwere ugwu ma dị mfe nghọta. E ji “nwetara” chekwaa oghere nkọwa nke ἐκτήσατο; e jighị okwu okpukpe pụrụ iche ma ọ bụ nkọwa na-eme ka ihe odide ahụ kwekọọ n’ike na Matiu. Akara nkọwa ala peeji [a], [b], na [c] niile dị n’ahịrị isi.
