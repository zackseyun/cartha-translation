revisions:
- from: Ya mere, nwoke a ji ụgwọ ọrụ ajọ omume nweta otu ubi[a], mgbe ọ dara isi n’ala[b], afọ ya gbawara n’etiti[c], akụkụ afọ ya niile wee wụpụ.
  to: Ya mere, nwoke a ji ụgwọ ọrụ nke ajọ omume nweta otu ubi[a][c], mgbe ọ dara isi n’ala[b], afọ ya gbawara n’etiti, akụkụ ime afọ ya niile wee wụpụ.
  rationale: The only necessary substantive correction is relocating [c] to “ubi,” where it accurately annotates ἐκτήσατο. The small wording adjustment to “ụgwọ ọrụ nke ajọ omume” makes the possessive relationship in ἐκ μισθοῦ τῆς ἀδικίας more explicit while retaining the draft’s appropriate instrumental sense with “ji.” No theological tension is resolved or imported.
