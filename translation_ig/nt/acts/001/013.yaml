id: ACT.1.13
reference: Acts 1:13
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ὅτε εἰσῆλθον, ⸂εἰς τὸ ὑπερῷον ἀνέβησαν⸃ οὗ ἦσαν καταμένοντες, ὅ τε Πέτρος καὶ ⸂Ἰωάννης καὶ Ἰάκωβος⸃ καὶ Ἀνδρέας, Φίλιππος καὶ Θωμᾶς, Βαρθολομαῖος καὶ Μαθθαῖος, Ἰάκωβος Ἁλφαίου καὶ Σίμων ὁ ζηλωτὴς καὶ Ἰούδας Ἰακώβου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/013.yaml
  text: 'And when they had entered[a], they went up to the upstairs room where they were staying: Peter, John, James, and Andrew; Philip and Thomas; Bartholomew and Matthew; James the son of Alphaeus, and Simon the Zealot, and Judas the son of James.'
translation:
  language: ig
  text: Mgbe ha banyere, ha rịgoro n’ọnụ ụlọ dị n’elu ebe ha na-anọ. Ndị nọ n’ebe ahụ bụ Pita, Jọn, Jemis na Andru; Filip na Tọmọs; Batolomiu na Matiu; Jemis nwa Alfiọs; Saimọn onye a na-akpọ Zelọt; na Judas nwa Jemis.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “Judas nwanne Jemis.” Grik kwuru naanị “Judas nke Jemis,” ma o kwughị kpọmkwem ụdị mmekọrịta ha.
    reason: alternative_reading
lexical_decisions:
- source_word: εἰσῆλθον
  choice: Mgbe ha banyere
  rationale: Aorist dị n’ahịrịokwu oge na-egosi ihe mere tupu ha arịgoro. Igbo na-egosipụta usoro ahụ nke ọma site na “Mgbe ha banyere,” na-enweghị ịmanye ụdị pluperfect nke Bekee.
- source_word: εἰς τὸ ὑπερῷον ἀνέβησαν
  choice: ha rịgoro n’ọnụ ụlọ dị n’elu
  rationale: “Rịgoro” na-echekwa ngagharị elu, ebe “ọnụ ụlọ dị n’elu” na-enye echiche ụlọ ahụ n’asụsụ Igbo doro anya ma ghara ibubata njikọ ụka pụrụ iche.
- source_word: οὗ ἦσαν καταμένοντες
  choice: ebe ha nọ na-anọ
  rationale: Nkebi a na-egosipụta ịnọgide ma ọ bụ ibi nwa oge n’ebe ahụ; “ebe ha nọ na-anọ” bụ okwu Igbo dị mfe ma na-echekwa echiche na omume ahụ gara n’ihu.
- source_word: ὅ τε Πέτρος καὶ Ἰωάννης καὶ Ἰάκωβος καὶ Ἀνδρέας, Φίλιππος καὶ Θωμᾶς, Βαρθολομαῖος καὶ Μαθθαῖος
  choice: Ndị nọ n’ebe ahụ bụ Pita, Jọn, Jemis na Andru; Filip na Tọmọs; Batolomiu na Matiu
  rationale: E ji ahịrịokwu mmeghe kọwaa na ihe na-esochi bụ aha ndị ahụ. Akara semicolon na-echekwa nhazi na njikọ aha ndị ahụ n’enweghị ikwughachi “na” n’ụzọ na-adịghị eke n’Igbo.
- source_word: Ἰάκωβος Ἁλφαίου
  choice: Jemis nwa Alfiọs
  rationale: Genitive a bụ ihe a na-aghọtakarị dị ka patronymic n’usoro aha ndị ozi; “nwa Alfiọs” bụ ụzọ Igbo doro anya isi mata Jemis a.
- source_word: Σίμων ὁ ζηλωτὴς
  choice: Saimọn onye a na-akpọ Zelọt
  rationale: Nsụgharị a na-edebe okwu ahụ dị ka aha e ji amata Saimọn, ma ghara ikpebi kpamkpam ma ọ na-ekwu naanị banyere ịnụ ọkụ n’obi ya ka ọ bụ njikọ ya na otu a maara dị ka ndị Zelọt.
- source_word: Ἰούδας Ἰακώβου
  choice: Judas nwa Jemis
  rationale: N’usoro aha ndị nwoke e ji aha nna ha amata, “nwa Jemis” bụ nghọta kacha kwe omume. Ma ebe Grik kwuru naanị “Judas nke Jemis,” e debere nghọta ọzọ n’okpuru peeji.
theological_decisions:
- issue: Mmekọrịta Judas na Jemis n’okwu Ἰούδας Ἰακώβου
  choice: Judas nwa Jemis
  alternative: Judas nwanne Jemis
  rationale: Genitive Grik ahụ ekwughị kpọmkwem ma Judas bụ nwa Jemis ka ọ bụ nwanne ya. Usoro patronymic dị n’ahịrịokwu ahụ na-akwado “nwa Jemis,” ma e debere nghọta “nwanne Jemis” n’okpuru peeji iji ghara ihichapụ mgbagwoju anya dị n’isi mmalite.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. A họọrọ ụdị aha ndị mmadụ a na-amakarị n’Igbo. E zere polysyndeton Grik na-adịghị eke n’Igbo, ma semicolon na-echekwa nhazi aha abụọ abụọ. Akara footnote [a] dị ozugbo n’ebe okwu ọ na-akọwa nọ.
