    issue: Footnote b contains an ambiguous alternative rendering.
    rationale: “Ọrụ onye nlekọta ya” may imply ‘the work of his overseer.’ Replacing it with “ọrụ ilekọta ihe” supplies a clear nontechnical alternative that retains the semantic range of ἐπισκοπή.
