id: ACT.1.20
reference: Acts 1:20
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: γέγραπται γὰρ ἐν βίβλῳ ψαλμῶν· Γενηθήτω ἡ ἔπαυλις αὐτοῦ ἔρημος καὶ μὴ ἔστω ὁ κατοικῶν ἐν αὐτῇ, καί· Τὴν ἐπισκοπὴν αὐτοῦ ⸀λαβέτω ἕτερος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/020.yaml
  text: For it is written in the book of Psalms[a], ‘Let his dwelling place become desolate, and let there be no one dwelling in it,’ and[c][b], ‘Let another take his office.’
translation:
  language: ig
  text: 'N’ihi na e dere ya n’akwụkwọ Abụ Ọma, sị:


    “Ka ebe obibi ya ghọọ ebe tọgbọrọ n’efu,


    ka onye ọ bụla ghara ibi n’ime ya,”[a]


    ọzọkwa, sị:


    “Ka onye ọzọ were ọrụ nlekọta ya.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ akụkụ ikpeazụ a, “ka onye ọ bụla ghara ịbụ onye bi n’ime ya,” ma ọ bụ, “ka ọ ghara inwe onye bi n’ime ya.”
    reason: lexical_alternative
  - marker: b
    text: “Ọrụ nlekọta” sụgharịrị ἐπισκοπή. A pụkwara ịsụ ya “ọkwa ya” ma ọ bụ “ọrụ ilekọta ihe.” Okwu Greek ahụ n’ebe a na-ezo aka n’ọrụ ma ọ bụ ibu ọrụ, ọ bụghị iwu na ọ bụ ọkwa ụka teknụzụ nke oge e mesịrị.
    reason: alternative_reading
lexical_decisions:
- source_word: γέγραπται
  choice: e dere ya
  rationale: Nke a bụ ụzọ Igbo dị mfe ma bụrụkwa nke a na-ejikarị ewebata ihe e dere n’Akwụkwọ Nsọ; ọ na-egosipụta ọnọdụ perfect passive dị ka ihe e dere nke ka dị ire.
- source_word: βίβλῳ ψαλμῶν
  choice: n’akwụkwọ Abụ Ọma
  rationale: Ọ na-akọwa akwụkwọ Akwụkwọ Nsọ a kpọrọ aha n'ụzọ doro anya ma kwekọọ n’Igbo ọkọlọtọ.
- source_word: Γενηθήτω
  choice: Ka ... ghọọ
  rationale: Ọ na-echekwa ike jussive nke aorist imperative n’okwu e hotara.
- source_word: ἔπαυλις
  choice: ebe obibi
  rationale: Ọ bụ okwu sara mbara ma kwekọọ na habitation ma ọ bụ dwelling place, n’enweghị ime ka ọ bụrụ ụdị ụlọ a kapịrị ọnụ.
- source_word: ἔρημος
  choice: ebe tọgbọrọ n’efu
  rationale: N’ọnọdụ a, ọ pụtara ebe a hapụrụ nke onye na-ebighị; okwu a na-enye ụda siri ike nke abụ ahụ ma bụrụkwa Igbo a na-aghọta nke ọma.
- source_word: μὴ ἔστω ὁ κατοικῶν ἐν αὐτῇ
  choice: ka onye ọ bụla ghara ibi n’ime ya
  rationale: 'Ọ na-enye ihe Greek ahụ pụtara n’Igbo eke: ka ọ ghara inwe onye bi n’ebe ahụ.'
- source_word: ἐπισκοπή
  choice: ọrụ nlekọta
  rationale: Ọ na-egosipụta ọrụ ma ọ bụ ibu ọrụ nke ilekọta ihe n’akwụghị ya ka ọ bụrụ ọkwa ụka teknụzụ nke oge e mesịrị.
- source_word: λαβέτω ἕτερος
  choice: Ka onye ọzọ were
  rationale: Ọ na-echekwa iwu/jussive ahụ na echiche nke onye ọzọ ịnara ọrụ ahụ.
theological_decisions:
- issue: Nkọwa ἐπισκοπή n’ihe gbasara ọrụ Judas hapụrụ
  choice: ọrụ nlekọta
  alternative: ọkwa ya; ọrụ onye nlekọta ya
  rationale: “Ọrụ nlekọta” na-egosipụta ọrụ ma ọ bụ ibu ọrụ a ga-enyefe onye ọzọ, ma ọ naghị ebubata usoro ọchịchị ụka nke oge e mesịrị. E debere nhọrọ ndị ọzọ n’ala peeji maka nghọta na nyocha.
translation_notes:
  register: Ejiri Igbo ọkọlọtọ nke oge a, nke dị ùgwù ma dị mfe nghọta. E kewara amaokwu abụọ ahụ e hotara ka ọdịdị abụ ha pụta ìhè. “Ebe obibi,” “ebe tọgbọrọ n’efu,” na “ọrụ nlekọta” na-echekwa ụda Akwụkwọ Nsọ n’enweghị okwu ochie ma ọ bụ nkọwa nke otu ụka.
