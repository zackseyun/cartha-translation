language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οὗτοι πάντες ἦσαν προσκαρτεροῦντες ὁμοθυμαδὸν τῇ ⸀προσευχῇ σὺν γυναιξὶν καὶ ⸀Μαριὰμ τῇ μητρὶ τοῦ Ἰησοῦ καὶ ⸀σὺν τοῖς ἀδελφοῖς αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/014.yaml
  text: All of these were continually devoting themselves with one accord to prayer[a], together with the women, and Mary the mother of Jesus[c][b], and with his brothers.
translation:
  language: ig
  text: Ndị a niile nọgidere n'ekpe ekpere n'otu obi[a], tinyere ụmụ nwanyị[b], Meri, nne Jizọs, na ụmụnne ya ndị nwoke[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “n'otu uche” ma ọ bụ “n'ịdị n'otu.” Okwu Grik a na-emesi otu ebumnobi ha ike, ọ bụghị naanị na ha zukọrọ n'otu ebe.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụ ya, “ụmụ nwanyị ahụ.” N'asụsụ Grik, e nweghị mkpụrụokwu na-egosi “ahụ,” ma okwu a nwere ike na-ekwu maka otu ụmụ nwanyị ndị na-eso ụzọ ahụ maara nke ọma.
    reason: lexical_alternative
  - marker: c
    text: Okwu Grik a sụgharịrị “ụmụnne ... ndị nwoke” bụ adelphoi. Ụfọdụ na-aghọta ya n'ụzọ sara mbara dịka ndị ikwu chiri anya; ebe a, ederede ahụ akọwaghị ụdị mmekọrịta ahụ karịa.
    reason: alternative_reading
lexical_decisions:
- source_word: οὗτοι πάντες
  choice: Ndị a niile
  rationale: Nke a na-edobe ma nrụtụ aka dị na οὗτοι ma echiche nke mmadụ niile dị na πάντες, n'Igbo nkịtị ma doo anya.
- source_word: ἦσαν προσκαρτεροῦντες
  choice: nọgidere ... na-ekpe
  rationale: Ụdị ngwaa a na participle ya na-egosi omume gara n'ihu ruo oge ụfọdụ; “nọgidere ... na-” na-egosipụta ịnọgide na-eme ihe ahụ n'esepụghị aka.
- source_word: ὁμοθυμαδόν
  choice: jiri otu obi
  rationale: Ọ na-egosi ịdị n'otu n'ebumnobi na n'uche, ọ bụghị nanị ịnọkọ n'otu ebe.
- source_word: τῇ προσευχῇ
  choice: na-ekpe ekpere
  rationale: Nke a bụ ụzọ Igbo dị ndụ si kwuo ịnọgide n'ekpere; a naghị amanye article Grik ahụ n'Igbo.
- source_word: σὺν γυναιξίν
  choice: ha na ụmụ nwanyị
  rationale: Ọ na-edobe σύν dịka isonyere ndị ọzọ. E tinyebeghị ihe na-egosi kpọmkwem ‘ụmụ nwanyị ahụ’ n'ahịrị bụ isi n'ihi na article adịghị na Grik.
- source_word: Μαριὰμ τῇ μητρὶ τοῦ Ἰησοῦ
  choice: Meri nne Jizọs
  rationale: Aha ndị a bụ ụdị a na-ahụkarị n'Igbo; nkọwa apposition ahụ na-akọwa Meri kpọmkwem n'ụzọ dị mfe.
- source_word: σὺν τοῖς ἀδελφοῖς αὐτοῦ
  choice: nakwa ụmụnne ya ndị nwoke
  rationale: “Ụmụnne ... ndị nwoke” na-egosipụta plural nwoke nke ἀδελφοί, ma okwu “ụmụnne” n'onwe ya anaghị ekpebi ụdị mmekọrịta ezinụlọ ahụ n'ụzọ ga-ebute ozizi otu ụka.
theological_decisions:
- issue: Ụdị mmekọrịta ndị a kpọrọ ἀδελφοί na Jizọs nwere
  choice: ụmụnne ya ndị nwoke
  alternative: ndị ikwu ya; ụmụnne ya
  rationale: ἀδελφοί na-apụtakarị ụmụnne nwoke, ma arụmụka dị n'ọdịnala Ndị Kraịst banyere ma hà bụ ụmụnne ya site n'ọmụmụ, ụmụnne sitere n'aka nne ma ọ bụ nna ọzọ, ma ọ bụ ndị ikwu ya. Nsụgharị ahụ na-egosi na ha bụ ndị nwoke ma hapụ ụdị mmekọrịta ahụ ka ederede si hapụ ya.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị nsọ ma dị mfe nghọta. Ahịrịokwu ahụ na-asọ nke ọma n'ọnụ, na-edobe omume na-aga n'ihu, ịdị n'otu ndị ahụ, na mgbagwoju anya gbasara ἀδελφοί n'ebughị ozizi pụrụ iche nke otu ụka.
