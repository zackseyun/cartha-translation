  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ συναλιζόμενος παρήγγειλεν αὐτοῖς ἀπὸ Ἱεροσολύμων μὴ χωρίζεσθαι, ἀλλὰ περιμένειν τὴν ἐπαγγελίαν τοῦ πατρὸς ἣν ἠκούσατέ μου·
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/004.yaml
  text: And while staying with them[a], he ordered them not to depart from Jerusalem, but to wait for the promise of the Father, which you heard from me.
translation:
  language: ig
  text: Mgbe ya na ha nọkọrọ[a], o nyere ha iwu ka ha ghara isi na Jerusalem pụọ, kama ka ha chere nkwa nke Nna ahụ, nke unu nụrụ n’aka m.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Mgbe ya na ha zukọrọ”; ụfọdụ na-aghọta okwu a dị ka, “Mgbe ya na ha na-eri nri.”
    reason: lexical_alternative
lexical_decisions:
- source_word: συναλιζόμενος
  choice: Mgbe ya na ha nọkọrọ
  rationale: Okwu Grik a siri ike n’ụzọ mkpụrụokwu ya. Nsụgharị a na-egosi n’Igbo dị mfe ma doo anya na Jizọs na ndịozi ya nọkọrọ, n’agbanyeghị ma ihe a pụtara bụ izukọ ọnụ ma ọ bụ irikọ nri.
- source_word: παρήγγειλεν
  choice: o nyere ha iwu
  rationale: Nke a na-echekwa echiche nke ntụziaka e nyere n’ike, kama ime ka ọ daa nro dịka naanị ndụmọdụ.
- source_word: ἀπὸ Ἱεροσολύμων μὴ χωρίζεσθαι
  choice: ka ha ghara isi na Jerusalem pụọ
  rationale: N’ebe a, okwu ahụ pụtara ka ha ghara ịhapụ obodo Jerusalem; nsụgharị a bụ Igbo e ji eme ihe ma doo anya.
- source_word: περιμένειν
  choice: ka ha chere
  rationale: “Chere” na-egosi ịnọgide na-atụ anya ihe a ga-emezu, dịka ngwaa Grik ahụ si dị.
- source_word: τὴν ἐπαγγελίαν τοῦ πατρὸς
  choice: nkwa nke Nna ahụ
  rationale: Nsụgharị a na-esochi njikọ okwu Grik ahụ ma ghara ịkọwa ya karịa ihe ederede kwuru, ma ọ bụ nkwa Nna ahụ kwere ma ọ bụ ihe e kwere ná nkwa nke sitere n’aka ya.
- source_word: ἣν ἠκούσατέ μου
  choice: nke unu nụrụ n’ọnụ m
  rationale: Nke a bụ ụzọ Igbo kwụ ọtọ na nke kwesịrị ekwesị isi kwuo na ha nụrụ ya site n’ihe Jizọs kwuru.
theological_decisions:
- issue: Ihe συναλιζόμενος pụtara gbasara ihe Jizọs mere mgbe o si n’ọnwụ bilie
  choice: A sụgharịrị ya n’ozuzu dịka ya na ndịozi ya ịnọkọ, n’ejighị n’aka kwuo na ha nọ na-eri nri.
  alternative: “Mgbe ya na ha zukọrọ” ma ọ bụ “Mgbe ya na ha na-eri nri.”
  rationale: Ụdị okwu Grik a nwere nghọta dị iche iche. Nsụgharị bụ isi na-echekwa ihe doro anya n’akụkọ ahụ—na Jizọs na ha nọkọrọ—ebe nkọwa ala peeji na-edebe nghọta ndị ọzọ ka a ghara idozi esemokwu mkpụrụokwu ahụ n’amaghị ama.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “O nyere ha iwu” na-echekwa ike nke ntụziaka ahụ; “nkwa nke Nna ahụ” na-echekwakwa nghọta sara mbara nke okwu mbụ ahụ n’etinyeghị nkọwa okpukpe pụrụ iche.
