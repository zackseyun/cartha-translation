  text: εἶπεν ⸀δὲ πρὸς αὐτούς· Οὐχ ὑμῶν ἐστιν γνῶναι χρόνους ἢ καιροὺς οὓς ὁ πατὴρ ἔθετο ἐν τῇ ἰδίᾳ ἐξουσίᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/007.yaml
  text: But he said to them[b][a], “It is not for you to know times or seasons that the Father has set by his own authority.”
translation:
  language: ig
  text: Ma ọ sịrị ha, “Ọ bụghị unu ka ọ dịịrị ịmata oge ma ọ bụ oge a kara aka[a] ndị Nna ahụ debere n'ime ikike nke ya.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ịsụgharị ya, “oge ma ọ bụ oge e kenyere.” Okwu Grik abụọ a dị iche: nke mbụ na-ekwu maka oge ma ọ bụ akụkụ oge, nke abụọ maka oge a kara aka.'
    reason: lexical_alternative
  - marker: b
    text: N'ụzọ nkịtị, “n'ime ikike nke ya.” Nke a na-egosi na Nna ahụ debere oge ndị a n'okpuru ikike nke ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Ma
  rationale: Ọ na-egosi ntakịrị mgbanwe na ihe megidere ajụjụ ndị na-eso ụzọ jụrụ, n'ụzọ Igbo dị mfe ma bụrụkwa nke okike.
- source_word: Οὐχ ὑμῶν ἐστιν γνῶναι
  choice: Ọ bụghị unu ka ọ dịịrị ịmata
  rationale: Nkebiokwu a na-egosi na ịmata ihe ndị a abụghị ihe e nyere ndị na-eso ụzọ ikike ma ọ bụ ọrụ ịmata; nsụgharị a bụ Igbo nkịtị ma ghara ịgbakwunye nkọwa.
- source_word: χρόνους
  choice: oge dị iche iche
  rationale: χρόνος nwere ike ịpụta oge n'ogologo ya ma ọ bụ akụkụ oge; okwu a na-ekewapụ ya n'ụzọ dị nro na καιρός.
- source_word: καιροὺς
  choice: oge a kara aka
  rationale: καιρός na-ezokarị aka n'oge kwesịrị ekwesị ma ọ bụ oge e kenyere; nsụgharị a na-echekwa ọdịiche dị n'etiti okwu Grik abụọ ahụ n'emeghị ka ha bụrụ usoro nkà mmụta siri ike.
- source_word: ὁ πατὴρ
  choice: Nna ahụ
  rationale: Grik kwuru ‘Nna ahụ,’ ọ bụghị ‘Nna m’; e chekwara aha nsọpụrụ ahụ dịka o si dị na isi mmalite.
- source_word: ἔθετο
  choice: debe
  rationale: τίθημι n'ebe a pụtara ido, ịhọpụta, ma ọ bụ ịtọ ihe; ‘debe’ dabara n'echiche na Nna ahụ edobela oge ndị a n'okpuru ikike ya.
- source_word: ἐν τῇ ἰδίᾳ ἐξουσίᾳ
  choice: ji ikike nke aka ya
  rationale: Nke a na-eme ka o doo anya n'Igbo na Nna ahụ mere ya site n'ikike nke ya, ma ka na-anọ nso n'echiche nke okwu Grik nke pụtara ‘n'ime ikike nke ya.’
theological_decisions:
- issue: Nsụgharị χρόνους / καιρούς
  choice: oge dị iche iche ma ọ bụ oge a kara aka
  alternative: oge ma ọ bụ oge pụrụ iche
  rationale: Nhọrọ a na-echekwa okwu abụọ yiri ibe ha ma dịtụ iche, na-enweghị ịmanye nkọwa amụma ma ọ bụ usoro oge nke amaokwu ahụ ekwughị.
- issue: Ihe ἐξουσία pụtara gbasara Nna ahụ
  choice: ji ikike nke aka ya
  alternative: n'ime ikike nke aka ya
  rationale: Ọ na-egosipụta na mkpebi banyere oge ndị ahụ dị n'ikike Nna ahụ, na-enweghị itinye ozizi ọzọ nke adịghị n'amaokwu ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. ‘Bụ́’ na-eme ka njikọ dị n'etiti ‘oge’ na nkebiokwu na-esochi ya doo anya; akara ụda dị mkpa ka e debere.
