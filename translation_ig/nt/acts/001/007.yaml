revisions:
- from: Ma ọ sịrị ha, “Ọ bụghị unu ka ọ dịịrị ịmata oge dị iche iche ma ọ bụ oge a kara aka[a], bụ́ ndị Nna ahụ ji ikike nke aka ya debe.[b]”
  to: Ma ọ sịrị ha, “Ọ bụghị unu ka ọ dịịrị ịmata oge ma ọ bụ oge a kara aka[a] ndị Nna ahụ debere n'ime ikike nke ya.[b]”
  rationale: The revision removes an added nuance from χρόνους, retains the Greek distinction between χρόνοι and καιροί in natural modern Igbo, and renders the Father’s exclusive authority more closely. The footnotes are also revised for grammatical clarity and to state the lexical alternatives without expanding the verse’s theological claim.
