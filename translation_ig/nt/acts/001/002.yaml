  text: ἄχρι ἧς ἡμέρας ἐντειλάμενος τοῖς ἀποστόλοις διὰ πνεύματος ἁγίου οὓς ἐξελέξατο ἀνελήμφθη·
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/002.yaml
  text: until the day when[a], after giving commands through the Holy Spirit to the apostles whom he had chosen, he was taken up.
translation:
  language: ig
  text: ruo ụbọchị ahụ[a] mgbe, site na Mmụọ Nsọ, o nyesịrị ndịozi ndị ọ họọrọ iwu, e weliri ya elu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịtụgharị ya, ‘mgbe o ji Mmụọ Nsọ nye ndịozi ndị ọ họọrọ iwu.’ Okwu Grik ahụ pụrụ igosi ụzọ e si nye iwu ahụ ma ọ bụ ikike e ji nye ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄχρι ἧς ἡμέρας
  choice: ruo n’ụbọchị ahụ mgbe
  rationale: Nke a na-egosi ụbọchị akụkọ ahụ kwụsịrị na ya; okwu a bụ Igbo dị mfe ma na-edobe usoro oge dị na Grik.
- source_word: ἐντειλάμενος
  choice: mgbe o nyesịrị ... iwu
  rationale: Nke a na-egosi na inye iwu ahụ mere tupu e welie ya elu. ‘Iwu’ na-egosipụta ike ἐντέλλομαι karịa okwu dị nro dịka ‘ntụziaka.’
- source_word: τοῖς ἀποστόλοις
  choice: ndịozi
  rationale: ‘Ndịozi’ bụ okwu Igbo a nabatara maka ndị Jizọs họpụtara ma zipụ, karịchaa dịka otu ndị a maara ama n’akwụkwọ Luk na Ọrụ Ndịozi.
- source_word: διὰ πνεύματος ἁγίου
  choice: site na Mmụọ Nsọ
  rationale: διά tinyere genitive nwere ike igosi ụzọ e si mee ihe ma ọ bụ onye e ji mee ya. ‘Site na’ na-edobe ohere abụọ ahụ n’enweghị ịkọwa ya karịa ihe Grik kwuru.
- source_word: οὓς ἐξελέξατο
  choice: ọ họọrọ
  rationale: Nkebiokwu a na-akọwapụta ndịozi dị ka ndị Jizọs họọrọ tupu e welie ya elu; Igbo anaghị achọ ụdị pluperfect pụrụ iche ebe usoro okwu ahụ emeela ka oge doo anya.
- source_word: ἀνελήμφθη
  choice: e weliri ya elu
  rationale: Nke a na-edobe passive na isi echiche nke ‘iweli elu’ n’etinyeghị ‘gaa n’eluigwe,’ nke amaokwu a ekwughị kpọmkwem.
theological_decisions:
- issue: Mmekọrịta dị n’etiti iwu Jizọs nyere na Mmụọ Nsọ
  choice: Jizọs nyere ndịozi iwu site na Mmụọ Nsọ tupu e welie ya elu.
  alternative: Jizọs nyere ndịozi iwu site n’aka Mmụọ Nsọ.
  rationale: Usoro okwu Grik na-ejikọta διὰ πνεύματος ἁγίου na ἐντειλάμενος. ‘Site na Mmụọ Nsọ’ na-egosi ụzọ ma ọ bụ agency ma ghara idozi ambiguity ahụ n’ụzọ siri ike.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke oge a, dị ùgwù ma dị mfe nghọta. E ji ‘nd ndịozi’ mee okwu otu ndị Jizọs họọrọ, ma zere itinye ‘n’eluigwe’ ebe isi mmalite ahụ ekwughị ya.
