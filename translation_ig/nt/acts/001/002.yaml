revisions:
- from: ruo n’ụbọchị ahụ[a] mgbe o nyesịrị ndịozi ọ họọrọ iwu site na Mmụọ Nsọ, e weliri ya elu.
  to: ruo ụbọchị ahụ[a] mgbe, site na Mmụọ Nsọ, o nyesịrị ndịozi ndị ọ họọrọ iwu, e weliri ya elu.
  rationale: The revision improves idiomatic Standard Igbo and makes clear that ‘site na Mmụọ Nsọ’ qualifies Jesus’ giving of commands. It preserves the Greek temporal sequence, passive ascension wording, and the lexical ambiguity of διά with the genitive, without adding theological detail.
