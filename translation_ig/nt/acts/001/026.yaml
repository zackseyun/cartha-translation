revisions:
- from: Ha wee tụọrọ ha abụọ nza[a]; nza ahụ wee dakwasị Matayas, a gụkọọkwara ya na ndịozi iri na otu ahụ[b].
  to: Ha wee tụọ nza maka ha[a]; nza ahụ wee dakwasị Mataias, a gụkọọkwara ya na ndịozi iri na otu ahụ[b].
  rationale: The revision removes the unsupported specification that there were two recipients while retaining the plural reference naturally. It also regularizes the name to the conventional Standard Igbo biblical form, Mataias. No theological or procedural inference beyond the Greek text has been added.
