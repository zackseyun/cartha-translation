  text: καὶ ἔδωκαν κλήρους ⸀αὐτοῖς, καὶ ἔπεσεν ὁ κλῆρος ἐπὶ Μαθθίαν, καὶ συγκατεψηφίσθη μετὰ τῶν ἕνδεκα ἀποστόλων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/026.yaml
  text: And they cast lots for them[a], and the lot fell to Matthias[b], and he was counted with the eleven apostles.
translation:
  language: ig
  text: Ha wee tụọ nza maka ha[a]; nza ahụ wee dakwasị Mataias, a gụkọọkwara ya na ndịozi iri na otu ahụ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’ụzọ nkịtị, “Ha nyere ha nza.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “a gụnyere ya n’ọnụọgụ ndịozi iri na otu ahụ,” ma ọ bụ, “a gbakwụnyere ya na ndịozi iri na otu ahụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔδωκαν κλήρους αὐτοῖς
  choice: Ha wee tụọrọ ha abụọ nza
  rationale: N’agbanyeghị na okwu Grik ahụ pụtara n’ụzọ nkịtị ‘ha nyere ha nza,’ ‘ịtụ nza’ bụ ụzọ Igbo si akọ usoro e ji nza ahọpụta mmadụ. ‘Ha abụọ’ na-eme ka onye nnọchiaha αὐτοῖς doo anya dị ka ndị abụọ ahụ a họpụtara n’amaokwu bu ụzọ.
- source_word: κλήρους / ὁ κλῆρος
  choice: nza / nza ahụ
  rationale: N’akụkọ a, κλῆρος bụ nza e ji eme nhọrọ, ọ bụghị oke ihe nketa. ‘Nza’ na-echekwa ihe usoro ahụ bụ n’enweghị ịkọwa ya gabiga ihe ederede kwuru.
- source_word: ἔπεσεν ὁ κλῆρος ἐπὶ Μαθθίαν
  choice: nza ahụ wee dakwasị Matayas
  rationale: Nke a na-echekwa ihe atụ dị n’okwu Grik, ya bụ na nza ahụ ‘dakwasịrị’ Matayas, ma bụrụkwa okwu Igbo a pụrụ ịghọta nke ọma n’ọnọdụ a.
- source_word: Μαθθίαν
  choice: Matayas
  rationale: E depụtara aha onye ahụ n’ụdị mkpụrụokwu kwekọrọ n’olu Igbo.
- source_word: συγκατεψηφίσθη
  choice: a gụkọọkwara ya na
  rationale: Ngwaa ahụ pụtara na a gụrụ mmadụ ọnụ ma ọ bụ tinyere ya n’ọnụọgụ otu ìgwè. Nhọrọ a dị nso n’asụsụ Grik ma ọ naghị etinye nkwupụta ọzọ banyere ụdị nhọpụta ahụ.
- source_word: μετὰ τῶν ἕνδεκα ἀποστόλων
  choice: na ndịozi iri na otu ahụ
  rationale: μετά ya na genitive pụtara ‘na/nyere,’ ebe ‘ndịozi iri na otu ahụ’ na-akọ ìgwè ndị dịbu iri na otu tupu a gụọ Matayas na ha.
theological_decisions:
- issue: Ma a ga-asụgharị συγκατεψηφίσθη n’ụzọ ga-egosi nhọpụta Chineke karịrị ihe akụkọ ahụ kwuru
  choice: a gụkọọkwara ya na ndịozi iri na otu ahụ
  alternative: a gbakwụnyere ya na ndịozi iri na otu ahụ
  rationale: Amaokwu ahụ na-akọ ọnọdụ Matayas mgbe nza dakwasịrị ya. ‘A gụkọọkwara ya na’ na-echekwa ihe ngwaa Grik kwuru n’etinyeghị nkwupụta ụka ma ọ bụ usoro nsọ ọzọ n’ime ya.
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E ji ‘ịtụ nza’ mee ka usoro nhọrọ ahụ doo anya; e chekwara ihe atụ nke nza ‘ịdakwasị’ mmadụ. Akara ntụaka [a] na [b] dị n’ederede isi ma kwekọọ na nkọwa ala peeji.
