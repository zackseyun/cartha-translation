review_pass:
  verdict: revise
  source_fidelity: The added phrase “ha abụọ” is not stated in Acts 1:26. Although the preceding context identifies two candidates, the Greek αὐτοῖς simply retains the plural reference and should not be made more explicit in the verse itself. The remainder accurately represents the lot falling upon Matthias and his being counted with the eleven apostles.
  naturalness: “Ha wee tụọ nza maka ha” is idiomatic, modern Standard Igbo and preserves the plural reference without adding “both.” “Nza ahụ wee dakwasị Mataias” and “a gụkọọkwara ya na ndịozi iri na otu ahụ” are clear and suitably formal.
  terminology: Nza appropriately renders κλῆρος in its selection-by-lot sense. “Ndịozi” is the established term for apostles. “Mataias” is the conventional Standard Igbo biblical form of Μαθθίας and should replace “Matayas.”
  issues:
  - severity: medium
    issue: The main text adds “ha abụọ” (“the two of them”).
    rationale: The source has only αὐτοῖς (“them”); the number two is recoverable from the prior context but is not expressed in this verse. Optimal-equivalence translation should retain the source’s less explicit wording.
  - severity: low
    issue: The personal name is rendered “Matayas.”
    rationale: “Mataias” is the conventional Standard Igbo biblical form for Matthias and better maintains established name usage.
  revised_text: Ha wee tụọ nza maka ha[a]; nza ahụ wee dakwasị Mataias, a gụkọọkwara ya na ndịozi iri na otu ahụ[b].
