    reason: lexical_alternative
  revision_rationale: The revision removes the unsupported specification that there were two recipients while retaining the plural reference naturally. It also regularizes the name to the conventional Standard Igbo biblical form, Mataias. No theological or procedural inference beyond the Greek text has been added.
