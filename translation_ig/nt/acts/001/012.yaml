  text: Τότε ὑπέστρεψαν εἰς Ἰερουσαλὴμ ἀπὸ ὄρους τοῦ καλουμένου Ἐλαιῶνος, ὅ ἐστιν ἐγγὺς Ἰερουσαλὴμ σαββάτου ἔχον ὁδόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/012.yaml
  text: Then they returned to Jerusalem from the mount called Olivet[a], which is near Jerusalem[b], a Sabbath day’s journey away.
translation:
  language: ig
  text: Mgbe ahụ, ha sitere n’Ugwu a na-akpọ Oliv[a] laghachi na Jerusalem. Ugwu ahụ dị Jerusalem nso, n’ebe dị anya hà ka ogologo njem ụbọchị Izu Ike.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “Ugwu Osisi Oliv.”
    reason: lexical_alternative
  - marker: b
    text: “Ogologo njem ụbọchị Izu Ike” bụ ogologo ụzọ ndị Juu na-ewere dị ka nke mmadụ nwere ike ịga n’ụbọchị Izu Ike.
    reason: cultural_note
lexical_decisions:
- source_word: Τότε
  choice: Mgbe ahụ
  rationale: Ọ bụ njikọ oge na-egosi ihe sochiri ihe a kọrọ tupu ya; “Mgbe ahụ” bụ ụzọ Igbo nkịtị ma doo anya si kwuo ya.
- source_word: ὑπέστρεψαν εἰς Ἰερουσαλὴμ
  choice: ha ... laghachi na Jerusalem
  rationale: Ngwaa a pụtara ịlaghachi ma ọ bụ ịga azụ; nhazi a bụ nke sitere n’okike n’akụkọ Igbo.
- source_word: ἀπὸ ὄρους
  choice: si n’ugwu
  rationale: ἀπό na-egosi ebe ha si bịa, ebe ὄρος pụtara ugwu.
- source_word: τοῦ καλουμένου Ἐλαιῶνος
  choice: a na-akpọ Ugwu Oliv
  rationale: A họọrọ aha ebe a maara nke ọma n’Igbo, ma ihe okwu Grik ahụ pụtara n’ụzọ nkịtị na ụzọ ọzọ e si asụ ya ka e debere n’ala ala peeji.
- source_word: ὅ ἐστιν ἐγγὺς Ἰερουσαλὴμ
  choice: Ugwu ahụ dị Jerusalem nso
  rationale: E kewara ahịrịokwu ahụ ụzọ abụọ ka ọ bụrụ Igbo dị mfe ma doo anya, n’enweghị ịgbanwe ihe nkebi njikọ ahụ na-ekwu banyere ugwu ahụ.
- source_word: σαββάτου ἔχον ὁδόν
  choice: naanị ogologo njem ụbọchị Izu Ike
  rationale: Nke a na-echekwa akpaala okwu ndị Juu gbasara ogologo njem e ji atụ anya ụzọ, ma ihe ọ pụtara n’omenala ka akọwara n’ala ala peeji.
theological_decisions:
- issue: Akpaala okwu ndị Juu σαββάτου ἔχον ὁδόν
  choice: naanị ogologo njem ụbọchị Izu Ike
  alternative: ebe e nwere ike iji njem e kwere n’ụbọchị Izu Ike ruo
  rationale: Akpaala okwu a bụ ihe gbasara omenala na etu e si atụ anya ụzọ, ọ bụghị nkwupụta na ndị ahụ ji otu ụbọchị dum mee njem. A hapụrụ ụdị okwu ahụ n’ahịrịokwu ma kọwaa ya n’ala ala peeji ka a ghara idozi ihe odide ahụ karịa ka o kwuru.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E kewara okwu Grik ahụ gaa n’ahịrịokwu abụọ iji mee ka onye “nke dị nso na Jerusalem” na-ezo aka na ya doo anya, ebe a ka na-echekwa akpaala okwu omenala nke “njem ụbọchị Izu Ike.”
