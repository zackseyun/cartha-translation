revisions:
- from: Mgbe ahụ, ha si n’ugwu a na-akpọ Ugwu Oliv[a] laghachi na Jerusalem. Ugwu ahụ dị Jerusalem nso, naanị ogologo njem ụbọchị Izu Ike.[b]
  to: Mgbe ahụ, ha sitere n’Ugwu a na-akpọ Oliv[a] laghachi na Jerusalem. Ugwu ahụ dị Jerusalem nso, n’ebe dị anya hà ka ogologo njem ụbọchị Izu Ike.[b]
  rationale: The revision removes the added restrictive force of “naanị” and uses an idiomatic Igbo distance construction for σαββάτου ἔχον ὁδόν. It preserves the source’s approximate cultural-distance idiom without assigning a precise measurement or doctrinal interpretation. The revised lexical footnote reflects the mountain designation in context.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T08:27:10Z'
review_pass:
  verdict: revise
  source_fidelity: Draft accurately renders the sequence, return to Jerusalem, the Mount/Olivet designation, and proximity to Jerusalem. However, “naanị ogologo njem ụbọchị Izu Ike” adds an unwarranted restrictive sense (“only”) and is syntactically incomplete as a rendering of the distance idiom.
  naturalness: The first sentence is clear. The final phrase is not a complete, natural Igbo expression of distance; recasting it as a relative location/distance phrase makes the verse flow naturally while retaining the source idiom.
  terminology: “Ugwu Oliv” is an acceptable established-style rendering for the named mount. “Ogologo njem ụbọchị Izu Ike” suitably retains the Jewish cultural idiom. The lexical footnote should offer “Ugwu Osisi Oliv,” rather than introducing “Ubi Osisi Oliv,” which is less secure in this verse’s construction with ὄρους.
  issues:
  - severity: medium
    issue: “naanị” (‘only’) in the final clause
    rationale: The Greek σαββάτου ἔχον ὁδόν identifies the distance as a Sabbath-day journey; it does not explicitly express restriction or minimization.
  - severity: medium
    issue: Final distance expression is incomplete/awkward Igbo
    rationale: “naanị ogologo njem ụbọchị Izu Ike” lacks a natural locative or distance construction. The revision explicitly states that the mount is at approximately that distance.
  - severity: low
    issue: Footnote a includes “Ubi Osisi Oliv”
    rationale: Although Ἐλαιών can be associated with an olive grove, here it is the name applied to a mountain. “Ugwu Osisi Oliv” is the appropriate transparent alternative.
  revised_text: Mgbe ahụ, ha sitere n’Ugwu a na-akpọ Oliv[a] laghachi na Jerusalem. Ugwu ahụ dị Jerusalem nso, n’ebe dị anya hà ka ogologo njem ụbọchị Izu Ike.[b]
  revised_footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “Ugwu Osisi Oliv.”
    reason: lexical_alternative
  - marker: b
    text: “Ogologo njem ụbọchị Izu Ike” bụ ogologo ụzọ ndị Juu na-ewere dị ka nke mmadụ nwere ike ịga n’ụbọchị Izu Ike.
    reason: cultural_note
  revision_rationale: The revision removes the added restrictive force of “naanị” and uses an idiomatic Igbo distance construction for σαββάτου ἔχον ὁδόν. It preserves the source’s approximate cultural-distance idiom without assigning a precise measurement or doctrinal interpretation. The revised lexical footnote reflects the mountain designation in context.
