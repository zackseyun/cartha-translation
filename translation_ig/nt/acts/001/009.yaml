  text: καὶ ταῦτα εἰπὼν βλεπόντων αὐτῶν ἐπήρθη καὶ νεφέλη ὑπέλαβεν αὐτὸν ἀπὸ τῶν ὀφθαλμῶν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/009.yaml
  text: And after he said these things[a], as they were watching, he was lifted up[c][b], and a cloud took him out of their sight.
translation:
  language: ig
  text: Mgbe o kwusịrị ihe ndị a, e buliri ya elu ka ha na-ele anya[a], igwe ojii[b] wee buru ya pụọ n’anya ha[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “e weere ya elu.”
    reason: lexical_alternative
  - marker: b
    text: N’akụkọ ụfọdụ dị n’Akwụkwọ Nsọ, igwe ojii na-egosi ọnụnọ Chineke. O nwere ike ịbụ na okwu a na-eme ka a cheta akụkọ ndị ahụ, ma amaokwu a ekwughị nke ahụ hoo haa.
    reason: cross_reference
  - marker: c
    text: Ma ọ bụ, “igwe ojii wepụrụ ya n’anya ha.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Mgbe
  rationale: Ejikọtara njikọ akụkọ a na nkebi oge sochirinụ ka ahịrịokwu ahụ daa nke ọma n’Igbo; ọ ka na-egosi na ihe a mere ozugbo okwu Jizọs gasịrị, n’etinyeghị nkọwa ọzọ.
- source_word: ταῦτα
  choice: ihe ndị a
  rationale: Nnọchiaha ngosi a dị n’ụdị ọtụtụ ma na-ezo aka n’okwu ndị Jizọs kwuru tupu nke a.
- source_word: εἰπὼν
  choice: o kwuchara
  rationale: Ụdị a na-egosi na o buru ụzọ kwuo okwu ndị ahụ tupu e bulie ya; ọ bụkwa ụzọ Igbo sitere n’okike si kwupụta usoro oge ahụ.
- source_word: βλεπόντων αὐτῶν
  choice: ka ha nọ na-ele anya
  rationale: Nke a na-egosi ihe ha nọ na-eme n’otu oge ahụ, na-enweghị itinye ihe karịrị ihe Grik kwuru.
- source_word: ἐπήρθη
  choice: e buliri ya elu
  rationale: Okwu Grik bụ passive ma na-egosi mmegharị ịrị elu a hụrụ anya. Nsụgharị a anaghị akpọ kpọmkwem onye buliri ya elu.
- source_word: νεφέλη
  choice: igwe ojii
  rationale: Aha ahụ dị n’otu ma enweghị article; nsụgharị ahụ anaghị eme ka ọ bụrụ igwe ojii pụrụ iche n’ahịrịokwu bụ isi.
- source_word: ὑπέλαβεν
  choice: buru ya pụọ
  rationale: N’ọnọdụ a, ngwaa ahụ pụtara na igwe ojii weere ma ọ bụ nabata ya nke mere na ndị na-ekiri ya ahụkwaghị ya. ‘Buru ya pụọ’ bụ Igbo doro anya ma na-edobe igwe ojii dị ka onye na-eme ihe n’usoro ahịrịokwu ahụ.
- source_word: ἀπὸ τῶν ὀφθαλμῶν αὐτῶν
  choice: n’anya ha
  rationale: Nke a bụ ụzọ Igbo sitere n’okike si kwuo na ihe apụọla n’ebe mmadụ pụrụ ịhụ ya.
theological_decisions:
- issue: Ma a ga-eji usoro okwu ọdịnala nke na-akọwa nrịgo Jizọs karịa ihe ἐπήρθη kwuru
  choice: e buliri ya elu
  alternative: e weere ya laa n’elu
  rationale: Nhọrọ a na-edobe passive nke Grik na mmegharị ịrị elu a hụrụ anya, ma ọ naghị etinye usoro nkwenkwe e mepụtara mgbe e mesịrị n’ime ahịrịokwu ahụ.
- issue: Ma a ga-akọwa νεφέλη ozugbo dị ka ihe ngosi ọnụnọ Chineke
  choice: igwe ojii
  alternative: igwe ojii nke ọnụnọ Chineke
  rationale: N’ebe ndị ọzọ n’Akwụkwọ Nsọ, igwe ojii pụrụ igosi ọnụnọ Chineke, ma amaokwu a ekwughị nke ahụ hoo haa. Ya mere, e debere echiche ahụ n’okpuru ala kama itinye ya n’ahịrịokwu bụ isi.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ usoro okwu na-aga nke ọma n’ọnụ Igbo, ma e chekwara passive nke ἐπήρθη, ọrụ igwe ojii dị ka isiokwu nke ὑπέλαβεν, na enweghị nkwupụta doro anya banyere ihe igwe ojii ahụ nọchiri anya ya.
