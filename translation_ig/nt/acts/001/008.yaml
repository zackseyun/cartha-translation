id: ACT.1.8
reference: Acts 1:8
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀλλὰ λήμψεσθε δύναμιν ἐπελθόντος τοῦ ἁγίου πνεύματος ἐφ’ ὑμᾶς, καὶ ἔσεσθέ ⸀μου μάρτυρες ἔν τε Ἰερουσαλὴμ καὶ ἐν πάσῃ τῇ Ἰουδαίᾳ καὶ Σαμαρείᾳ καὶ ἕως ἐσχάτου τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/008.yaml
  text: But you will receive power when the Holy Spirit has come upon you[a], and you will be my witnesses in Jerusalem, and in all Judea and Samaria, and to the end of the earth.
translation:
  language: ig
  text: Ma unu ga-anata ike mgbe Mmụọ Nsọ bịakwasịrị unu, unu ga-abụkwa ndị akaebe m na Jerusalem, na Judia niile na Sameria, ruo na nsọtụ ụwa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “ruo na nsọtụ dị iche iche nke ụwa.” Okwu Grik ahụ dị n’ọnụọgụ otu, “ruo na nsọtụ ụwa,” ma dịka akpaalaokwu ọ pụtara ruo n’ebe ụwa kasị anya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Ma
  rationale: Na-egosi ọdịiche dị n’etiti ihe a na ihe e kwuru n’amaokwu nke 7, n’ụzọ Igbo na-ada nke ọma.
- source_word: λήμψεσθε
  choice: unu ga-anata
  rationale: Ọ na-egosi ịnata ihe e nyere, ọ bụghị iji aka mmadụ were ya n’onwe ya.
- source_word: δύναμιν
  choice: ike
  rationale: “Ike” na-eburu echiche sara mbara nke ikike na enyemaka Mmụọ Nsọ na-enye, n’emeghị ka ọ bụrụ naanị ume anụ ahụ.
- source_word: ἐπελθόντος ... ἐφ’ ὑμᾶς
  choice: mgbe ... bịakwasịrị unu
  rationale: A tụgharịrị genitive absolute ahụ dịka nkebiokwu oge; “bịakwasịrị” na-egosi ọbịbịa Mmụọ Nsọ n’ebe ha nọ.
- source_word: τοῦ ἁγίου πνεύματος
  choice: Mmụọ Nsọ
  rationale: Nke a bụ aha Igbo a na-ejikarị eme ihe maka onye Chineke ahụ a na-ekwu banyere ya.
- source_word: ἔσεσθέ
  choice: unu ga-abụkwa
  rationale: Na-asụgharị ọdịnihu nke εἰμί n’ụzọ kwụ ọtọ; “-kwa” jikọtara nkwa nke abụọ na nke mbụ.
- source_word: μου μάρτυρες
  choice: ndị akaebe m
  rationale: Na-echekwa njikọ genitive nke “m” na ọrụ ha dịka ndị na-agba akaebe banyere Jizọs, n’ebughị ụzọ tinye echiche ịnwụ n’ihi okwukwe.
- source_word: ἔν τε Ἰερουσαλὴμ
  choice: na Jerusalem
  rationale: Na-amalite usoro ebe ndị ahụ n’ụzọ dị mfe ma doo anya n’Igbo.
- source_word: ἐν πάσῃ τῇ Ἰουδαίᾳ
  choice: na Judia niile
  rationale: Na-echekwa oke mpaghara ahụ dum nke πάσῃ na-egosi.
- source_word: καὶ Σαμαρείᾳ
  choice: na Sameria
  rationale: Ebe a ka preposition ἐν gara aga na-achịkwa; ikwughachi “na” na-eme ka Igbo doo anya.
- source_word: ἕως ἐσχάτου τῆς γῆς
  choice: ruo na nsọtụ ụwa
  rationale: Na-echekwa ụdị otu ihe dị na Grik ma na-egosikwa ebe kasị anya n’ụwa n’ụzọ Igbo na-aghọta.
theological_decisions:
- issue: Ịsụgharị πνεῦμα dịka onye Chineke a na-ekwu banyere ya
  choice: Mmụọ Nsọ
  alternative: mmụọ nsọ
  rationale: Ọnọdụ okwu ahụ na-ezo aka n’ebe Mmụọ Nsọ nọ dịka onye Chineke; mkpụrụedemede ukwu na-egosi aha ahụ n’enweghị ịgbakwunye nkọwa ozizi n’ime amaokwu.
- issue: Oke ọrụ ịgba akaebe
  choice: Ebe ndị a kpọrọ aha na-agbasa site na Jerusalem ruo na nsọtụ ụwa
  alternative: Ịghọta ebe ndị ahụ naanị dịka ihe atụ ime mmụọ
  rationale: Amaokwu ahụ kpọrọ ezigbo ebe ala aha ma mechie ya na oke zuru ụwa ọnụ; ntụgharị ahụ na-echekwa nke a n’ebughị ozizi gbasara usoro ụka n’ime ya.
translation_notes:
  register: Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ “bịakwasịrị” maka ọbịbịa Mmụọ Nsọ, “ndị akaebe” maka ọrụ ịgba akaebe, na “nsọtụ ụwa” iji chekwaa ma ụdị otu ihe nke Grik ma akpaalaokwu ya.
