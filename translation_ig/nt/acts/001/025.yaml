id: ACT.1.25
reference: Acts 1:25
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: λαβεῖν τὸν ⸀τόπον τῆς διακονίας ταύτης καὶ ἀποστολῆς, ⸀ἀφ’ ἧς παρέβη Ἰούδας πορευθῆναι εἰς τὸν τόπον τὸν ἴδιον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/025.yaml
  text: to take the place of this ministry and apostleship[b][a], from which Judas turned aside to go to his own place.
translation:
  language: ig
  text: ka ọ were ọnọdụ n’ije ozi a na n’ọrụ onyeozi a, nke Judas siri na ya pụọ gaa n’ebe nke ya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λαβεῖν
  choice: ka ọ were
  rationale: 'N’ọnọdụ ekpere a, infinitive a na-egosi ihe onye a họpụtara ga-eme: iwere ọrụ ahụ a hapụrụ oghere.'
- source_word: τόπον
  choice: ọnọdụ
  rationale: N’ebe a, τόπος bụ ihe atụ maka ọnọdụ ma ọ bụ ọrụ e nyere mmadụ; “ọnọdụ” na-ada nke ọma n’Igbo ma na-egosi ọrụ ahụ nke ọma.
- source_word: διακονίας
  choice: ozi
  rationale: διακονία pụtara ije ozi ma ọ bụ ozi e nyere mmadụ; “ozi” dabara n’ọrụ ndịozi a na-ekwu maka ya.
- source_word: ἀποστολῆς
  choice: ọrụ onyeozi
  rationale: ἀποστολή ebe a na-ezo aka n’ọrụ ma ọ bụ ọkwa onyeozi, ọ bụghị nanị njem ozi n’ozuzu.
- source_word: ἀφ’ ἧς
  choice: nke ... si na ya
  rationale: Nke a na-ejikọta Judas na ozi na ọrụ onyeozi ahụ ọ hapụrụ, dịka preposition na relative pronoun Grik si eme.
- source_word: παρέβη
  choice: wezuga onwe ya
  rationale: Nhọrọ a na-egosi isi n’ọrụ ahụ pụọ ma ọ bụ ịhapụ ya, n’ebughị ụzọ kpebie ma okwu ahụ bụ mmebi iwu n’ụzọ teknụzụ.
- source_word: πορευθῆναι
  choice: gaa
  rationale: “Gaa” na-enye ihe πορεύομαι pụtara n’ụzọ dị mfe ma kpọmkwem.
- source_word: εἰς τὸν τόπον τὸν ἴδιον
  choice: n’ebe nke ya
  rationale: Nkebiokwu a na-edobe okwu Grik ahụ dị mkpụmkpụ ma dị omimi, na-akọwaghị ebe ahụ dịka ili ma ọ bụ ebe ikpe.
theological_decisions:
- issue: Ihe “ebe nke ya” pụtara banyere ebe Judas gara
  choice: 'E debere okwu na-enweghị ịkọwa kpọmkwem: “ebe nke ya.”'
  alternative: Ọ pụrụ izo aka n’ọnwụ ma ọ bụ ili, n’ebe ikpe, ma ọ bụ n’ebe kwesịrị Judas.
  rationale: Grik ahụ akọwaghị ebe ahụ kpọmkwem; ya mere nsụgharị ahụ na-edobe mgbagwoju anya na ibu okwu ahụ kama ịmanye otu nkọwa ozizi.
translation_notes:
  register: Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E ji “ozi” na “ọrụ onyeozi” kewaa διακονία na ἀποστολή, ma debe okwu banyere ebe Judas gara n’amaghị kpọmkwem dịka isi Grik si dị.
