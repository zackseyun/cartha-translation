revisions:
- from: ka ọ were ọnọdụ n’ozi a na ọrụ onyeozi a, nke Judas si na ya wezuga onwe ya[a], gaa n’ebe nke ya[b].
  to: ka ọ were ọnọdụ n’ije ozi a na n’ọrụ onyeozi a, nke Judas siri na ya pụọ gaa n’ebe nke ya.
  rationale: 'The revision preserves the Greek structure and ambiguity: the chosen person takes the vacant place in the ministry and apostleship; Judas departed from it and went to his own place. It replaces an unnatural reflexive expression with idiomatic Standard Igbo and clarifies διακονία as “ije ozi,” while retaining the noncommittal wording concerning Judas’s destination.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T08:27:16Z'
review_pass:
  verdict: revise
  source_fidelity: The draft conveys the basic sense, including Judas’s departure from the apostolic role and the deliberately ambiguous destination. However, “wezuga onwe ya” is less idiomatic for παρέβη in this context, and the paired expressions for διακονία and ἀποστολή can be made clearer and more natural.
  naturalness: “Ọnọdụ n’ozi a na ọrụ onyeozi a” is understandable, but “ije ozi” and “ọrụ onyeozi” are clearer Standard Igbo expressions in this ecclesial context. “Judas siri na ya pụọ” is a natural rendering of departure from the role and flows well with “gaa n’ebe nke ya.”
  terminology: “Ije ozi” suitably renders διακονία, and “ọrụ onyeozi” renders ἀποστολή as an apostolic office/work without importing a denominational interpretation. “Ebe nke ya” rightly retains the ambiguity of τὸν τόπον τὸν ἴδιον.
  issues:
  - severity: medium
    issue: The expression “Judas si na ya wezuga onwe ya” is awkward and overly reflexive in Standard Igbo.
    rationale: παρέβη here denotes departure/deviation from the ministry and apostleship. “Judas siri na ya pụọ” communicates this naturally without imposing the stronger sense of apostasy or a technical transgression.
  - severity: low
    issue: “Ozi” by itself can be broad or suggest a message/news.
    rationale: Using “ije ozi” makes the service/ministry sense of διακονία explicit and distinguishes it more clearly from “ọrụ onyeozi.”
  revised_text: ka ọ were ọnọdụ n’ije ozi a na n’ọrụ onyeozi a, nke Judas siri na ya pụọ gaa n’ebe nke ya.
  revised_footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “hapụ ya” ma ọ bụ “si na ya dapụ.” Ngwaa Grik ahụ nwere ike ịpụta isi n’ije ozi na ọrụ onyeozi ahụ pụọ ma ọ bụ ịhapụ ya.
    reason: lexical_alternative
  - marker: b
    text: “Ebe nke ya” nwere ike ịpụta nanị ebe ruru Judas, ma ọ bụ, n’ụzọ siri ike karị, ebe ikpe kwesịrị ya.
    reason: alternative_reading
  revision_rationale: 'The revision preserves the Greek structure and ambiguity: the chosen person takes the vacant place in the ministry and apostleship; Judas departed from it and went to his own place. It replaces an unnatural reflexive expression with idiomatic Standard Igbo and clarifies διακονία as “ije ozi,” while retaining the noncommittal wording concerning Judas’s destination.'
