- from: Okwu Onyenwe anyị nọkwa na-agbasa n’ala ahụ niile.[a]
  to: A nọ na-agbasa okwu Onyenwe anyị n’ógbè ahụ niile.[a]
  rationale: The revision uses an impersonal progressive construction to reflect the Greek imperfect passive without unnatural passive morphology in Igbo. It also replaces ‘ala’ with ‘ógbè’ to represent χώρα as the whole surrounding region. The lexical alternative footnote remains correctly anchored and unchanged in meaning.
