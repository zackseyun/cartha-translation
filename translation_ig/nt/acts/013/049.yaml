  yaml_path: translation/nt/acts/013/049.yaml
  text: And the word of the Lord was being spread throughout the whole region[a].
translation:
  language: ig
  text: A nọ na-agbasa okwu Onyenwe anyị n’ógbè ahụ niile.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Ozi Onyenwe anyị.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διεφέρετο
  choice: nọ na-agbasa
  rationale: Ụdị imperfect passive na-egosi ihe gara n’ihu n’oge gara aga. N’Igbo, “nọ na-agbasa” na-enye echiche ahụ nke mgbasa na-aga n’ihu; okwu gbara ya gburugburu na-egosikwa na ndị mmadụ na-agbasa ya.
- source_word: δὲ
  choice: -kwa
  rationale: N’ebe a δέ bụ njikọ dị nro nke na-eme ka akụkọ gaa n’ihu. Mgbakwunye “-kwa” bụ ụzọ Igbo si jikọta ahịrịokwu a n’ụzọ eke n’enweghị ime ka ọ bụrụ nnukwu mmegide.
- source_word: ὁ λόγος
  choice: Okwu
  rationale: “Okwu” na-echekwa akpaokwu Luk ji ugboro ugboro, ma n’ebe a ọ pụtara ozi a na-ekwusa. E debere ihe ọzọ kwe omume na nkọwa ala peeji.
- source_word: τοῦ κυρίου
  choice: Onyenwe anyị
  rationale: “Onyenwe anyị” bụ nsụgharị Igbo a na-aghọta nke ọma maka κύριος, ma na-echekwa ịdị arọ nke aha ahụ n’akwụkwọ Ọrụ Ndị Ozi.
- source_word: δι’ ὅλης
  choice: niile
  rationale: “Niile” tinyere “n’ala ahụ” na-egosi na mgbasa ahụ ruru n’akụkụ niile nke ebe ahụ.
- source_word: τῆς χώρας
  choice: ala ahụ
  rationale: N’ebe a χώρα na-ezo aka n’ógbè gbara ha gburugburu, ọ bụghị mba nke oge a. “Ala ahụ” bụ okwu Igbo dị mfe ma bụrụkwa nke eke n’akụkọ a.
theological_decisions:
- issue: Nsụgharị κύριος
  choice: Onyenwe anyị
  alternative: Onye nwe ha
  rationale: “Onyenwe anyị” na-echekwa aha nsọpụrụ na ụda Kraịst dị n’akpaokwu “okwu Onyenwe anyị,” n’emeghị ka ọ bụrụ naanị okwu gbasara ikike onyeisi.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-echekwa mmegharị akụkọ, omume na-aga n’ihu, na akpaokwu Luk bụ “okwu Onyenwe anyị.”
