  text: ὁ δὲ θεὸς ἤγειρεν αὐτὸν ἐκ νεκρῶν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/030.yaml
  text: But God raised him from the dead.
translation:
  language: ig
  text: Ma Chineke mere ka o si nʼọnwụ bilie.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: Ma
  rationale: N'ebe a, δέ na-egosi ọdịiche dị n'etiti ihe ụmụ mmadụ mere na ihe Chineke mere; “Ma” na-egosipụta ọdịiche ahụ n'Igbo nkịtị.
- source_word: θεὸς
  choice: Chineke
  rationale: Aha a na-ezo aka kpọmkwem n'ebe Chineke nọ, onye mere ihe ahụ.
- source_word: ἤγειρεν
  choice: mere ka ... bilie
  rationale: N'okwu gbasara mbilite n'ọnwụ, ἐγείρω pụtara ime ka onye nwụrụ anwụ bilie. Usoro a bụ Igbo doro anya ma dịkwa mma karịa nsụgharị nkịtị nke nwere ike ịpụta naanị ibili ọtọ.
- source_word: αὐτὸν
  choice: o
  rationale: Nnochiaha a na-ezo aka na Jizọs; n'usoro okwu Igbo “mere ka o ... bilie,” a na-egosipụta ya n'ụzọ ebumpụta ụwa dị ka “o.”
- source_word: ἐκ νεκρῶν
  choice: si nʼọnwụ
  rationale: Akpaokwu a bụ okwu a na-ejikarị ekwu mbilite n'ọnwụ. “Si nʼọnwụ” na-egosi na o sitere n'ọnọdụ ọnwụ bilie, n'Igbo dị mfe ma doo anya.
theological_decisions:
- issue: Okwu e ji kọwaa mbilite n'ọnwụ
  choice: Ma Chineke mere ka o si nʼọnwụ bilie.
  alternative: Ma Chineke kpọlitere ya nʼọnwụ.
  rationale: Nhọrọ a na-ekwu hoo haa na Chineke bụ onye mere ka Jizọs bilie, ma na-egosikwa isi n'ọnwụ pụta. Ọ naghị etinye nkọwa ozizi ọzọ na-adịghị n'okwu Grik. Nhọrọ ọzọ bụkwa ezi Igbo, ma “mere ka o si nʼọnwụ bilie” na-eme ka ọrụ Chineke na isi n'ọnwụ bilie pụta ìhè.
translation_notes:
  register: Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E ji “Ma” chekwaa ọdịiche dị n'amaokwu ahụ; e jighị okwu ụka pụrụ iche ma ọ bụ nkọwa agbakwunyere.
