  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καί, ὡς τεσσερακονταετῆ χρόνον ἐτροποφόρησεν αὐτοὺς ἐν τῇ ἐρήμῳ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/018.yaml
  text: And for about forty years he put up with them in the wilderness[a].
translation:
  language: ig
  text: Ọzọkwa, ruo ihe dị ka afọ iri anọ, ọ nagidere ha n’ọzara.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ụfọdụ ihe odide na-agụ, “o lekọtara ha,” kama, “ọ nagidere ha.”
    reason: textual_variant
lexical_decisions:
- source_word: καί
  choice: (ejikọtara ya n’usoro akụkọ site n’ịmalite ‘Ruo…’)
  rationale: καί na-aga n’ihu n’akụkọ ahụ; n’Igbo, njikọ a pụtara nke ọma site n’usoro ahịrịokwu na okwu oge, n’achọghị itinye ‘Na’ nke ga-adị arọ.
- source_word: ὡς
  choice: ihe dị ka
  rationale: N’ihu oge a tụrụ atụ, ọ na-egosi na ọnụ ọgụgụ ahụ bụ nke a na-eme atụmatụ, ọ bụghị ọnụ ọgụgụ a na-ekwusi ike na ọ bụ kpọmkwem.
- source_word: τεσσερακονταετῆ χρόνον
  choice: afọ iri anọ
  rationale: Nke a bụ ụzọ Igbo nkịtị na nke doro anya si ekwu oge ruru afọ iri anọ.
- source_word: ἐτροποφόρησεν
  choice: o diri omume ha
  rationale: Ọ na-ebute echiche nke ịnagide ma ọ bụ ịtachi obi n’omume ndị ahụ, dịka ọgụgụ SBLGNT si dị, n’enweghị ime ka ọ bụrụ naanị ilekọta ha.
- source_word: αὐτοὺς
  choice: ha
  rationale: Nnọchiaha ọtụtụ na-ezo aka n’ụmụ Izrel.
- source_word: ἐν τῇ ἐρήμῳ
  choice: n’ọzara
  rationale: ‘Ọzara’ bụ okwu Igbo doro anya maka ebe ahụ ndị Izrel gagharịrị, ma na-echekwa njikọ ya na akụkọ Akwụkwọ Nsọ.
theological_decisions:
- issue: Ihe Chineke mere n’ebe Izrel nọ n’ọzara
  choice: o diri omume ha
  alternative: o lekọtara ha
  rationale: Ihe odide Grik e nyere, ἐτροποφόρησεν, kwadoro echiche nke ịnagide omume ha. E debere ọgụgụ ọzọ nke ọdịnala ihe odide, nke pụtara ilekọta ha, n’ala ala peeji ka ọdịiche ahụ ghara izo ezo.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. ‘Diri omume ha’ na-ada ka Igbo eke ma na-echekwa echiche nke ịnagide mmejọ ha; akara [a] dị n’isiokwu dịka a chọrọ.
