revisions:
- from: N’ụbọchị Izuike ahụ na-abịa[a], ihe fọrọ nke nta ka ọ bụrụ obodo ahụ dum zukọtara ịnụ okwu Onyenwe anyị.[b]
  to: N’Ụbọchị Izuike nke na-abịa[a], ihe fọrọ nke nta ka ọ bụrụ obodo ahụ dum zukọtara ịnụ okwu Onyenwe anyị.[b]
  rationale: The revision removes the unnecessary demonstrative ahụ and uses the more idiomatic relative construction nke na-abịa. It retains the temporal sense of ἐρχομένῳ, the deliberately broad “nearly the whole city,” and the lexical and theological ambiguity of “okwu Onyenwe anyị.” Footnote markers remain attached to their relevant expressions.
