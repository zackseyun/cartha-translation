id: ACT.13.44
reference: Acts 13:44
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Τῷ ⸀δὲ ἐρχομένῳ σαββάτῳ σχεδὸν πᾶσα ἡ πόλις συνήχθη ἀκοῦσαι τὸν λόγον τοῦ ⸀κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/044.yaml
  text: On the coming Sabbath[b][a], nearly the whole city gathered together to hear the word of the Lord.
translation:
  language: ig
  text: N’Ụbọchị Izuike nke na-abịa[a], ihe fọrọ nke nta ka ọ bụrụ obodo ahụ dum zukọtara ịnụ okwu Onyenwe anyị.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “N’Ụbọchị Izuike na-esote” ma ọ bụ “N’Ụbọchị Izuike sochirinụ.”
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịghọta “okwu Onyenwe anyị” dịka “ozi Onyenwe anyị” ma ọ bụ, dịka ọnọdụ okwu a si dị, “ozi gbasara Onyenwe anyị.”
    reason: alternative_reading
lexical_decisions:
- source_word: Τῷ δὲ ἐρχομένῳ σαββάτῳ
  choice: N’ụbọchị Izuike ahụ na-abịa
  rationale: Nkebiokwu dative a na-egosi oge, ya bụ ụbọchị Izuike na-abịa ma ọ bụ nke na-esote. Nsụgharị a na-agbasochi okwu Grik anya ma bụrụkwa Igbo dị mfe nghọta.
- source_word: σχεδὸν
  choice: ihe fọrọ nke nta ka ọ bụrụ
  rationale: Nke a na-egosi na ọ dị nnọọ nso ịbụ ihe niile, ma ọ bụghị ikwu hoo haa na ọ bụ onye ọ bụla n’enweghị onye fọdụrụ.
- source_word: πᾶσα ἡ πόλις
  choice: obodo ahụ dum
  rationale: Ọ bụ ụzọ okwu sara mbara e ji ezo aka n’ihe fọrọ nke nta ka ọ bụrụ ndị obodo niile; ‘obodo ahụ dum’ na-edobe ike okwu mbụ ahụ.
- source_word: συνήχθη
  choice: zukọtara
  rationale: Ụdị ngwaa a nwere nghọta nke ndị mmadụ ịgbakọta n’otu ebe. ‘Zukọtara’ bụ okwu Igbo ebumpụta ụwa ma doo anya.
- source_word: ἀκοῦσαι
  choice: ịnụ
  rationale: Infinitive a na-egosi ebumnuche ha ji zukọta. ‘Ịnụ’ bụ nsụgharị kacha nso ma na-ekwe ka ọnọdụ ahụ gụnye ige ntị.
- source_word: τὸν λόγον
  choice: okwu
  rationale: λόγος nwere ike ịbụ ‘okwu’ ma ọ bụ ‘ozi.’ ‘Okwu’ na-edobe okwu Luk na-eji ugboro ugboro maka ozi a na-ekwusa.
- source_word: τοῦ κυρίου
  choice: Onyenwe anyị
  rationale: A sụgharịrị κύριος dịka ‘Onyenwe anyị,’ okwu Igbo a na-ejikarị akọwa ‘Lord.’ Genitive ahụ ka dị n’ụdị na-adịghị ekpebi ma ọ bụ okwu sitere n’aka ya, nke bụ nke ya, ma ọ bụ nke gbasara ya.
theological_decisions:
- issue: Nsụgharị κύριος
  choice: Onyenwe anyị
  alternative: Nna ukwu
  rationale: ‘Onyenwe anyị’ bụ nsụgharị Igbo a nabatara nke ọma maka κύριος n’okwu nkwusa Ndị Kraịst, ma ọ naghị amanye nkọwa ọzọ banyere onye okwu ahụ na-ezo aka na ya.
- issue: Ihe ‘okwu Onyenwe anyị’ pụtara
  choice: E debere nkebiokwu ọdịnala ahụ n’enweghị ịkọwa ya karịa ihe odide Grik kwuru.
  alternative: ozi Onyenwe anyị; ozi gbasara Onyenwe anyị
  rationale: 'Genitive Grik ahụ nwere ike ịgụnye nghọta ndị na-adịkọ ọnụ: okwu nke Onyenwe anyị, ozi sitere n’aka ya, ma ọ bụ ozi gbasara ya. Idebe ‘okwu Onyenwe anyị’ na-echekwa nghọta sara mbara na esemokwu nkà mmụta okpukpe ahụ.'
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta mee nsụgharị ahụ. ‘Ụbọchị Izuike’ na-enye nkọwa doro anya maka Sabbath; ‘zukọtara’ na-ada ka Igbo ebumpụta ụwa. E debere usoro na nghọta sara mbara nke ‘okwu Onyenwe anyị’ kama ịkọwa genitive ahụ n’otu ụzọ naanị.
