  to: Mgbe ahụ[a], mgbe ha buchara ọnụ ma kpee ekpere, ha bikwasịrị ha aka ma hapụ ha ka ha laa.
  rationale: 'Only a safe idiomatic correction is made: “ha bikwasịrị ha aka” replaces “ha bikwasịrị ha aka n’ahụ.” This retains the descriptive wording of ἐπιθέντες τὰς χεῖρας αὐτοῖς, avoids theological interpretation, and is more natural Standard Igbo. No change is made to the rendering of ἀπέλυσαν or its lexical-alternative footnote.'
