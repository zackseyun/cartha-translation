id: ACT.13.3
reference: Acts 13:3
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τότε νηστεύσαντες καὶ προσευξάμενοι καὶ ἐπιθέντες τὰς χεῖρας αὐτοῖς ἀπέλυσαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/003.yaml
  text: Then[a], after fasting and praying and laying their hands on them, they sent them off.
translation:
  language: ig
  text: Mgbe ahụ[a], mgbe ha buchara ọnụ ma kpee ekpere, ha bikwasịrị ha aka ma hapụ ha ka ha laa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “Ha tọhapụrụ ha,” ma ọ bụ, “Ha hapụrụ ha ka ha pụọ.” N’ọnọdụ akụkọ a, ihe ọ pụtara bụ na e kwere ka Banabas na Sọl gawa ozi ahụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Mgbe ahụ
  rationale: 'Na-egosi usoro ihe mere: nke a sochiri ntụziaka Mmụọ Nsọ e kwuru n’amaokwu bu ụzọ.'
- source_word: νηστεύσαντες
  choice: mgbe ha buchara ọnụ
  rationale: Na-egosi na ibu ọnụ bu ụzọ mee tupu isi ngwaa; ‘buchara’ na-eme ka usoro ahụ doo anya n’Igbo nkịtị.
- source_word: προσευξάμενοι
  choice: ma kpee ekpere
  rationale: E jikọtara ya na ibu ọnụ dịka omume nkwadebe, n’asụsụ Igbo dị mfe ma kwanyere ugwu.
- source_word: ἐπιθέντες τὰς χεῖρας αὐτοῖς
  choice: ha bikwasịrị ha aka n’ahụ
  rationale: Na-echekwa omume a kọwara n’ụzọ doro anya, n’ebughị ụzọ kọwaa ya dịka echichi, ngọzi, ma ọ bụ emume sakrament.
- source_word: ἀπέλυσαν
  choice: hapụ ha ka ha laa
  rationale: Na-echekwa isi echiche nke ịtọhapụ ma ọ bụ ikwe ka ha pụọ; n’ọnọdụ a, ọ bụ ịhapụ Banabas na Sọl ka ha gawa ozi ahụ.
- source_word: αὐτοῖς
  choice: ha
  rationale: Na-ezo aka na Banabas na Sọl dịka ndị a bikwasịrị aka n’ahụ ma hapụ ka ha laa.
theological_decisions:
- issue: Ihe ibikwasị aka n’ahụ pụtara
  choice: A kọwara omume ahụ nanị dịka ibikwasị aka n’ahụ, n’etinyeghị nkọwa ụka pụrụ iche.
  alternative: Ịkpọ ya echichi, ngọzi, ma ọ bụ inyefe ọrụ n’emume iwu kwadoro.
  rationale: Amaokwu ahụ kọwara ibu ọnụ, ekpere, ibikwasị aka n’ahụ, na ịhapụ ha ka ha laa, ma ọ kọwaghị kpọmkwem ọnọdụ ụka ma ọ bụ ihe sakrament omume ahụ pụtara.
- issue: Uche dị na ἀπέλυσαν
  choice: hapụ ha ka ha laa
  alternative: zipụrụ ha; chụpụrụ ha; tọhapụrụ ha
  rationale: Ngwaa Grik ahụ nwere ike ịpụta ịtọhapụ ma ọ bụ ịchụpụ/dismiss. N’ebe a, ọnọdụ akụkọ na-egosi na e kwere ka Banabas na Sọl gawa ozi, ma nsụgharị na nkọwa ala peeji na-echekwa obosara okwu ahụ.
translation_notes:
  register: Standard Igbo; asụsụ dị ugbu a, dị ùgwù, ma dị mfe nghọta. A họọrọ ‘buchara ọnụ’ iji gosi na ibu ọnụ bu ụzọ mee, ebe e debere ibikwasị aka n’ahụ n’enweghị nkọwa okpukpe otu ụka pụrụ iche.
