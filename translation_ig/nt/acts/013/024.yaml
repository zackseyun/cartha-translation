  variant: Standard Igbo
source:
  edition: SBLGNT
  text: προκηρύξαντος Ἰωάννου πρὸ προσώπου τῆς εἰσόδου αὐτοῦ βάπτισμα μετανοίας ⸂παντὶ τῷ λαῷ⸃ Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/024.yaml
  text: before his coming[b][a], John had proclaimed to all the people of Israel a baptism of repentance.
translation:
  language: ig
  text: Tupu ọ bịarute[a], Jọn kwusaara ndị Izrel niile ozi banyere baptizim nke nchegharị[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Tupu mbata ya.” N’asụsụ Grik, okwu ahụ pụtara n’ụzọ nkịtị, “n’ihu mbata ya,” ya bụ, ibute ọbịbịa ya ụzọ.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “baptizim maka nchegharị.”
    reason: lexical_alternative
lexical_decisions:
- source_word: προκηρύξαντος
  choice: ekwusala
  rationale: Ọ na-egosi na Jọn kwusara ozi ahụ n’ihu ọha tupu onye a na-ekwu maka ya abịa; ụdị ngwaa a na-egosikwa na nkwusa ahụ eburu ụzọ mee.
- source_word: πρὸ προσώπου τῆς εἰσόδου αὐτοῦ
  choice: Tupu ọ bịarute
  rationale: Nke a na-asụgharị akpaalaokwu Grik nke pụtara ibute ọbịbịa mmadụ ụzọ n’Igbo dị mfe ma bụrụkwa nke e ji eme ihe ugbu a.
- source_word: εἰσόδου
  choice: bịarute
  rationale: Ọ bụ ezie na okwu ahụ nwere ike ịpụta ‘mbata,’ n’ebe a ọ na-ekwu maka ọbịbịa onye ahụ.
- source_word: βάπτισμα μετανοίας
  choice: baptizim nke nchegharị
  rationale: Ọ na-edobe njikọ genitive dị na Grik ma hapụkwa ohere maka ma nchegharị ọ bụ ihe e ji mara baptizim ahụ ma ọ bụ ihe baptizim ahụ na-achọ.
- source_word: παντὶ τῷ λαῷ Ἰσραήλ
  choice: ndị Izrel niile
  rationale: Nke a bụ okwu Igbo e ji eme ihe nke ọma maka ndị Izrel dum, ma na-edobe echiche πᾶς na λαός.
- source_word: Ἰωάννου
  choice: Jọn
  rationale: Nke a bụ ụdị aha ahụ a na-ejikarị ede n’Igbo.
theological_decisions:
- issue: Onye nnọchiaha ‘ọ’ na-ezo aka na ya n’okwu ‘Tupu ọ bịarute’
  choice: E debere ya dị ka nnọchiaha nke na-ezo aka na Jizọs, Onye Nzọpụta sitere n’agbụrụ Devid, dịka amaokwu ndị gbara ya gburugburu si gosi.
  alternative: Ịkpọ Jizọs aha kpọmkwem n’amaokwu a.
  rationale: Amaokwu Grik a ekwughị aha Jizọs kpọmkwem; nnọchiaha ahụ na-edobe usoro okwu mbụ, ebe Ọrụ Ndị Ozi 13:23–25 na-eme ka onye ọ na-ezo aka na ya doo anya.
- issue: Mmekọrịta dị n’etiti baptizim na nchegharị
  choice: baptizim nke nchegharị
  alternative: baptizim maka nchegharị
  rationale: Genitive Grik nwere ike ibu ihe karịrị otu nghọta; ‘nke nchegharị’ na-edobe mgbagwoju anya ahụ kama ikpebi na baptizim ahụ bụ naanị maka iweta nchegharị.
translation_notes:
  register: Asụsụ Igbo izugbe, nke dị mfe ma dị ùgwù. E ji ‘ekwusala’ gosi nkwusa n’ihu ọha nke mere tupu ọbịbịa ahụ; e zere ntụgharị akpaalaokwu Grik n’ụzọ osisi nke na-agaghị ada ka Igbo nkịtị.
