revisions:
- from: Ọ pụtara n’ihu ha ruo ọtụtụ ụbọchị[a]—ndị ahụ so ya si Galili rigoro Jerusalem. Ha bụzi ndị na-agbara ya àmà n’ihu ndị mmadụ.[b]
  to: Ọ pụtara n’ihu ndị ha na ya siri Galili rigoro Jerusalem ruo ọtụtụ ụbọchị[a], ndị bụzi ndị na-agbara ya àmà nye ndị mmadụ.[b]
  rationale: The revision retains the draft’s faithful rendering of the resurrection appearance and the journey from Galilee to Jerusalem, while changing the audience relation from “n’ihu ndị mmadụ” to “nye ndị mmadụ.” It also joins the clauses so that the people who accompanied Jesus are explicitly and smoothly identified as those who are now his witnesses. Footnote anchors and their content are retained.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T09:18:49Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly identifies Jesus as the subject, preserves the duration of the appearances, the Galilee-to-Jerusalem journey, the present role of the witnesses, and the unexpanded wording of τὸν λαόν. However, “n’ihu ndị mmadụ” can most naturally mean ‘before people/in public’ in Igbo, whereas πρὸς τὸν λαόν marks the audience to whom the witness is directed. “Nye ndị mmadụ” more precisely expresses this relation.
  naturalness: The draft is generally clear and uses appropriate Standard Igbo. Recasting the sentence as one integrated clause avoids the slightly abrupt dash construction and makes the relative relationship of the travel companions and present witnesses clearer.
  terminology: “Ndị na-agbara ya àmà” is a natural and accurate rendering of μάρτυρες αὐτοῦ. “Pụtara n’ihu” suitably renders the resurrection-appearance language without forcing the more formal passive construction. The note appropriately preserves “A hụrụ ya” as an alternative.
  issues:
  - severity: medium
    issue: “n’ihu ndị mmadụ” for πρὸς τὸν λαόν
    rationale: This phrase may suggest that the witnesses stand physically or publicly before the people. The Greek πρός here indicates the people as the recipients/audience of their testimony. “Nye ndị mmadụ” is more direct and idiomatic.
  - severity: low
    issue: The dash-separated wording weakens the direct syntactic link between the appearance recipients and the ones who are now witnesses.
    rationale: The Greek identifies the recipients of the appearances as the very people who are now witnesses. A single relative construction makes this connection clearer in Standard Igbo.
  revised_text: Ọ pụtara n’ihu ndị ha na ya siri Galili rigoro Jerusalem ruo ọtụtụ ụbọchị[a], ndị bụzi ndị na-agbara ya àmà nye ndị mmadụ.[b]
  revised_footnotes:
