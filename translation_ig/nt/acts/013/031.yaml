  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὃς ὤφθη ἐπὶ ἡμέρας πλείους τοῖς συναναβᾶσιν αὐτῷ ἀπὸ τῆς Γαλιλαίας εἰς Ἰερουσαλήμ, οἵτινες ⸀νῦν εἰσὶ μάρτυρες αὐτοῦ πρὸς τὸν λαόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/031.yaml
  text: He appeared for many days to those who had gone up with him from Galilee to Jerusalem[b][a], who are now his witnesses to the people.
translation:
  language: ig
  text: Ọ pụtara n’ihu ndị ha na ya siri Galili rigoro Jerusalem ruo ọtụtụ ụbọchị[a], ndị bụzi ndị na-agbara ya àmà nye ndị mmadụ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “A hụrụ ya ruo ọtụtụ ụbọchị.” N’ebe a, a pụkwara ịsụgharị ngwaa Grik ahụ n’ụzọ a, karịchaa mgbe a na-ekwu maka mpụta mgbe mbilite n’ọnwụ.
    reason: lexical_alternative
  - marker: b
    text: O yikarịrị ka “ndị mmadụ” n’ebe a na-ezo kpọmkwem aka ná ndị Juu, ya bụ, ndị Izrel.
    reason: cultural_note
lexical_decisions:
- source_word: ὃς
  choice: Ọ
  rationale: Nnọchiaha a na-ezo aka na Jizọs e kwuru okwu ya n’amaokwu bu ụzọ; ‘Ọ’ na-amalite ahịrịokwu ahụ n’ụzọ Igbo si ada nke ọma.
- source_word: ὤφθη
  choice: pụtara n’ihu ha
  rationale: N’akụkọ mbilite n’ọnwụ, ngwaa a na-egosi na Jizọs mere ka ndị ahụ hụ ya, ya bụ, ọ pụtara n’ihu ha. Nke a bụ Igbo doro anya ma ghara ịkọwa ọdịdị mpụta ahụ karịa ihe Grik kwuru.
- source_word: ἐπὶ ἡμέρας πλείους
  choice: ruo ọtụtụ ụbọchị
  rationale: Nkebiokwu a na-egosi ogologo oge; nsụgharị a na-egosi na mpụta ndị ahụ gara n’ihu n’ime ọtụtụ ụbọchị.
- source_word: τοῖς συναναβᾶσιν αὐτῷ
  choice: ndị ahụ so ya ... rigoro
  rationale: ‘So ya’ na-egosi na ha bụ ndị njem ibe ya, ebe ‘rigoro’ na-edobe echiche njem mgbago a na-ekwu maka ịga Jerusalem.
- source_word: ἀπὸ τῆς Γαλιλαίας εἰς Ἰερουσαλήμ
  choice: si Galili rigoro Jerusalem
  rationale: Nke a na-edobe ebe njem ahụ siri malite na ebe ọ kwụsịrị, ma na-ada ka Igbo e ji akọ njem.
- source_word: οἵτινες νῦν εἰσὶ μάρτυρες αὐτοῦ
  choice: Ha bụzi ndị na-agbara ya àmà
  rationale: ‘Bụzi’ na-egosipụta νῦν, ebe akpaalaokwu ‘ịgbara mmadụ àmà’ na-egosi ọrụ ha dị ka ndị akaebe banyere Jizọs.
- source_word: πρὸς τὸν λαόν
  choice: n’ihu ndị mmadụ
  rationale: Nke a na-egosi ndị ha na-agwa àmà ahụ. A hapụrụ ‘ndị mmadụ’ n’enweghị ịgbasa ya kpọmkwem ka ọ bụrụ Izrel, dị ka okwu Grik ahụ si dị.
theological_decisions:
- issue: Ụdị asụsụ e ji kọwaa mpụta Jizọs mgbe mbilite n’ọnwụ
  choice: Ọ pụtara n’ihu ha
  alternative: A hụrụ ya
  rationale: Nhọrọ bụ isi na-ada nke ọma n’Igbo ma na-egosi mpụta Jizọs nye ndị akaebe; ihe odide ala peeji na-echekwa ụdị ntụgharị nke na-agbasochi passive Grik anya.
- issue: Ndị okwu ‘τὸν λαόν’ na-ezo aka na ha
  choice: ndị mmadụ
  alternative: ndị Izrel
  rationale: Ihe gbara amaokwu a gburugburu na-egosi na o yikarịrị ka ọ bụ ndị Juu, ya bụ Izrel, ka a na-ekwu maka ha. Ma ebe Grik kwuru naanị ‘ndị ahụ/ndị mmadụ,’ e tinyeghị ‘Izrel’ n’ahịrịokwu bụ isi.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. ‘Rigoro Jerusalem’ na-edobe ụzọ ndị Juu si ekwu maka njem ịga Jerusalem, ebe ‘na-agbara ya àmà’ bụ akpaalaokwu Igbo nkịtị maka ọrụ ndị akaebe.
