    text: O yikarịrị ka “ndị mmadụ” n’ebe a na-ezo kpọmkwem aka ná ndị Juu, ya bụ, ndị Izrel.
    reason: cultural_note
  revision_rationale: The revision retains the draft’s faithful rendering of the resurrection appearance and the journey from Galilee to Jerusalem, while changing the audience relation from “n’ihu ndị mmadụ” to “nye ndị mmadụ.” It also joins the clauses so that the people who accompanied Jesus are explicitly and smoothly identified as those who are now his witnesses. Footnote anchors and their content are retained.
