  text: ⸂ὡς ἔτεσι τετρακοσίοις καὶ πεντήκοντα. καὶ μετὰ ταῦτα⸃ ἔδωκεν κριτὰς ἕως Σαμουὴλ ⸀τοῦ προφήτου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/020.yaml
  text: For about four hundred and fifty years[a]. And after these things he gave judges until Samuel the prophet.
translation:
  language: ig
  text: Ihe dị ka afọ narị anọ na iri ise[a]. Mgbe ihe ndị a gasịrị, o nyere ndị ikpe ruo n’oge Samuel onye amụma.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ, ụfọdụ nsụgharị na-ejikọ okwu oge ahụ n’ụzọ ọzọ: “o nyere ndị ikpe ihe dị ka afọ narị anọ na iri ise, ruo n’oge Samuel onye amụma.” A ka na-arụrịta ụka banyere nhazi okwu na akara edemede Grik n’ebe a.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὡς
  choice: Ihe dị ka
  rationale: N’ihu ọnụọgụgụ, ὡς na-egosi na ọnụ ọgụgụ ahụ bụ ihe a tụrụ atụ, ọ bụghị ọnụ ọgụgụ kpọmkwem.
- source_word: ἔτεσι τετρακοσίοις καὶ πεντήκοντα
  choice: narị afọ anọ na iri ise
  rationale: Nke a na-egosipụta ogologo oge nke afọ 450 n’ụzọ zuru ezu ma bụrụkwa Igbo nkịtị.
- source_word: καὶ μετὰ ταῦτα
  choice: Mgbe ihe ndị a gasịrị
  rationale: Ọ na-egosi usoro ihe mere eme ma na-echekwa echiche nke ọtụtụ ihe dị na ταῦτα; ịmalite ahịrịokwu ọhụrụ na-enweghị ‘Na’ bụ Igbo dị mma.
- source_word: ἔδωκεν
  choice: o nyere ha
  rationale: ‘Nyere’ na-echekwa isi echiche δίδωμι, ebe ‘ha’ na-eme ka onye natara ndị ikpe doo anya n’Igbo site n’ihe gbara amaokwu ahụ gburugburu.
- source_word: κριτὰς
  choice: ndị ikpe
  rationale: Ọ bụ aha akụkọ ihe mere eme nke ndị ndu Izrel tupu ọchịchị ndị eze, ma ọ bụghị naanị ndị ọkaikpe nke ụlọikpe.
- source_word: ἕως
  choice: ruo n’oge
  rationale: Ọ na-egosi njedebe oge n'ụzọ doro anya ma dịkwa eke tupu aha Samuel.
- source_word: Σαμουὴλ τοῦ προφήτου
  choice: Samuel onye amụma
  rationale: Nke a na-akọwa Samuel site n’ọrụ ya ma na-agbaso usoro okwu Igbo dị mfe.
theological_decisions:
- issue: Ebe e kwesịrị ijikọ okwu ‘ihe dị ka narị afọ anọ na iri ise’ n’amaokwu a siri ike n’ihe gbasara ederede na nhazi okwu
  choice: E debere ya dị ka nkwupụta oge nke kwụụrụ onwe ya, tupu ‘Mgbe ihe ndị a gasịrị, o nyere ha ndị ikpe ruo n’oge Samuel onye amụma.’
  alternative: 'Ijikọ afọ 450 ahụ na oge ndị ikpe: ‘o nyere ha ndị ikpe ihe dị ka narị afọ anọ na iri ise, ruo n’oge Samuel onye amụma.’'
  rationale: Ederede Grik e nyere debere okwu afọ 450 tupu καὶ μετὰ ταῦτα. A naghị edozi esemokwu ahụ n’amaghị ama; a na-agbaso ederede ahụ ma debe ụzọ ọzọ na nkọwa ala peeji.
translation_notes:
  register: Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E ji ‘ndị ikpe’ chekwaa aha oge akụkọ Izrel; e zere ịkọwa kpọmkwem njikọ afọ 450 ahụ ebe Grik nwere mgbagwoju anya.
