    issue: The duration expression is ordered as “narị afọ anọ na iri ise.”
    rationale: Although understandable, “afọ narị anọ na iri ise” is the clearer, more conventional Igbo expression for 450 years and avoids a possible initial reading as “four centuries.”
  - severity: low
    issue: The main text adds “ha” (“them”) after “o nyere.”
    rationale: The recipients are contextually inferable, but they are not expressed in the supplied Greek. Omitting the pronoun more closely preserves the concise source wording without harming Igbo naturalness.
