revisions:
- from: Ndị ha na Pọl nọ[b] ji ụgbọ mmiri si Pafọs pụọ[a], rute Pega nke dị na Pamfilia. Ma Jọn si n’etiti ha pụọ, laghachi na Jerusalem.
  to: Ndị ha na Pọl so[b] ji ụgbọ mmiri si Pafọs pụọ[a], rute Peega nke dị na Pamfilia. Ma Jọn si n’etiti ha pụọ, laghachi Jerusalem.
  rationale: The revision corrects the rendering of Perga to the established Standard Igbo form “Peega” and replaces a less natural expression for Paul's associated group with idiomatic Standard Igbo. It preserves the maritime sense of ἀναχθέντες, the group-oriented force of οἱ περὶ Παῦλον, and the source's neutral reporting of John's departure. Footnote anchors and their lexical functions remain correctly attached.
