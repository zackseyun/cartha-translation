source:
  edition: SBLGNT
  text: Ἀναχθέντες δὲ ἀπὸ τῆς Πάφου οἱ ⸀περὶ Παῦλον ἦλθον εἰς Πέργην τῆς Παμφυλίας· Ἰωάννης δὲ ἀποχωρήσας ἀπ’ αὐτῶν ὑπέστρεψεν εἰς Ἱεροσόλυμα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/013.yaml
  text: After setting sail from Paphos[a], those with Paul came to Perga in Pamphylia; but John, departing from them[b], returned to Jerusalem.
translation:
  language: ig
  text: Ndị ha na Pọl so[b] ji ụgbọ mmiri si Pafọs pụọ[a], rute Peega nke dị na Pamfilia. Ma Jọn si n’etiti ha pụọ, laghachi Jerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “malitere njem n’oké osimiri.”
    reason: lexical_alternative
  - marker: b
    text: N’ụzọ nkịtị, “ndị gbara Pọl gburugburu”; a pụkwara ịsụgharị ya, “Pọl na ndị ya na ha na-eme njem.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀναχθέντες
  choice: ji ụgbọ mmiri ... pụọ
  rationale: N’akụkọ njem, ἀνάγω na-egosi isi n’ọdụ ụgbọ mmiri banye n’oké osimiri. Nhọrọ a na-eme ka echiche njem mmiri doo anya n’Igbo dị mfe ma dịkwa mma.
- source_word: οἱ περὶ Παῦλον
  choice: ndị ha na Pọl nọ
  rationale: Akpaalaokwu οἱ περὶ + aha na-ezo aka n’ìgwè ndị ha na onye ndu nọ. Nsụgharị a na-edebe Pọl dị ka onye a na-akọwa ìgwè ahụ site n’aka ya, n’etinyeghị ihe ọzọ n’ihe odide ahụ.
- source_word: ἦλθον
  choice: rute
  rationale: N’ebe a, ἔρχομαι na-akọ njedebe njem. ‘Rute’ bụ okwu Igbo ebumpụta ụwa nke na-egosi na ha bịarutere Pega, n’agbanyeghị na isi okwu Grik nwekwara ike ịbụ ‘bịa’ ma ọ bụ ‘gaa.’
- source_word: Πέργην τῆς Παμφυλίας
  choice: Pega nke dị na Pamfilia
  rationale: Genitive ahụ na-egosi mpaghara ebe Pega dị. ‘Nke dị na Pamfilia’ na-eme njikọ ebe ahụ ka o doo anya n’Igbo.
- source_word: ἀποχωρήσας ἀπ’ αὐτῶν
  choice: si n’etiti ha pụọ
  rationale: Okwu ahụ pụtara isi n’ebe mmadụ nọ pụọ ma ọ bụ ịhapụ ìgwè. Nhọrọ a na-akọ naanị ihe Jọn mere, n’ekpeghị ebumnobi ya ikpe.
- source_word: ὑπέστρεψεν
  choice: laghachi
  rationale: ὑποστρέφω pụtara ịlaghachi. ‘Laghachi’ bụ nsụgharị Igbo doro anya ma dị nkenke.
- source_word: Ἱεροσόλυμα
  choice: Jerusalem
  rationale: Nke a bụ ụdị aha obodo ahụ a maara nke ọma n’Igbo.
theological_decisions:
- issue: Ihe ọ pụrụ ịpụta na Jọn hapụrụ ìgwè ahụ
  choice: si n’etiti ha pụọ
  alternative: gbahapụ ha
  rationale: Amaokwu a kwuru naanị na Jọn siri n’etiti ha pụọ ma laghachi Jerusalem; ọ kọwaghị ihe kpatara ya ma ọ bụ maa ya ikpe. Ya mere, a zere ‘gbahapụ,’ nke pụrụ igosi mmejọ ma ọ bụ enweghị ntụkwasị obi.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ ahịrịokwu njem dị nkenke ma bụrụ nke ebumpụta ụwa. E debere ihe Jọn mere n’ụzọ na-anọpụ iche, n’etinyeghị nkọwa banyere ebumnobi ya.
