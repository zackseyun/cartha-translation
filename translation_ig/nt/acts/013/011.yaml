revisions:
- from: 'Ma ugbu a, lee[a], aka Onyenwe anyị[c] dị n’ahụ gị. Ị ga-abụ onye ìsì, ị gaghị ahụ anyanwụ ruo oge ụfọdụ.[b] Ozugbo ahụ, alụlụ na ọchịchịrị dakwasịrị ya; ka ọ na-agagharị, ọ nọ na-achọ ndị ga-ejide ya n’aka duru ya.


    [a] A pụkwara ịsụ ya, “Ma ugbu a, mara nke a.”

    [b] Ma ọ bụ, “ruo oge a kara aka.”

    [c] “Aka Onyenwe anyị” bụ akpaalaokwu Akwụkwọ Nsọ nke na-egosi ike Onyenwe anyị na-arụ ọrụ; n’ebe a, ọ bụ n’ikpe.'
  to: 'Ma ugbu a, lee, aka Onyenwe anyị dịkwasịrị gị. Ị ga-adị ìsì, ị gaghị ahụ anyanwụ ruo oge ụfọdụ. Ozugbo ahụ, alụlụ na ọchịchịrị dakwasịrị ya, ka ọ na-agagharị na-achọ ndị ga-ejide ya n’aka duru ya.


