  rationale: The revision corrects the Igbo rendering of the idiom “the hand of the Lord is upon you,” makes the temporary state of blindness idiomatic, and removes two misleading lexical-alternative notes. The source ambiguity regarding the unspecified duration remains intact, while the biblical metaphor and the concrete hand-leading imagery are preserved.
