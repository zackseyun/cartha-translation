id: ACT.13.11
reference: Acts 13:11
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ νῦν ἰδοὺ χεὶρ κυρίου ἐπὶ σέ, καὶ ἔσῃ τυφλὸς μὴ βλέπων τὸν ἥλιον ἄχρι καιροῦ. παραχρῆμα ⸀δὲ ⸀ἔπεσεν ἐπ’ αὐτὸν ἀχλὺς καὶ σκότος, καὶ περιάγων ἐζήτει χειραγωγούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/011.yaml
  text: And now[a], behold, the hand of the Lord is upon you, and you will be blind, not seeing the sun for a time. Immediately a mist and darkness fell upon him, and going about[c][b], he was seeking people to lead him by the hand.
translation:
  language: ig
  text: 'Ma ugbu a, lee, aka Onyenwe anyị dịkwasịrị gị. Ị ga-adị ìsì, ị gaghị ahụ anyanwụ ruo oge ụfọdụ. Ozugbo ahụ, alụlụ na ọchịchịrị dakwasịrị ya, ka ọ na-agagharị na-achọ ndị ga-ejide ya n’aka duru ya.


    [c] “Aka Onyenwe anyị” bụ akpaalaokwu Akwụkwọ Nsọ nke na-egosi ike Onyenwe anyị na-arụ ọrụ; n’ebe a, ọ bụ n’ikpe.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: c
    text: “Aka Onyenwe anyị” bụ akpaalaokwu Akwụkwọ Nsọ nke na-egosi ike Onyenwe anyị na-arụ ọrụ; n’ebe a, ọ bụ n’ikpe.
    reason: cultural_note
lexical_decisions:
- source_word: ἰδοὺ
  choice: lee
  rationale: “Lee” bụ okwu Igbo dị ndụ nke na-akpọ uche onye a na-agwa ka ọ ṅaa ntị, ma ọ naghị eme ka ederede bụrụ nke ochie.
- source_word: χεὶρ κυρίου
  choice: aka Onyenwe anyị
  rationale: E debere ihe atụ dị n’asụsụ Grik kama ịkọwa ya ozugbo dị ka ntaramahụhụ; ihe gbara ya gburugburu na-egosi na ọ bụ ọrụ ikpe Chineke.
- source_word: κύριος
  choice: Onyenwe anyị
  rationale: Nke a bụ ụzọ a na-ejikarị asụ aha nsọpụrụ κύριος n’Igbo mgbe ọ na-ezo aka n’Onyenwe Chineke.
- source_word: ἔσῃ τυφλὸς
  choice: Ị ga-abụ onye ìsì
  rationale: Nke a na-egosipụta ọdịnihu nke εἰμί na nkọwa τυφλός n’ụzọ doro anya ma bụrụkwa Igbo nkịtị.
- source_word: μὴ βλέπων τὸν ἥλιον
  choice: ị gaghị ahụ anyanwụ
  rationale: E debere “anyanwụ” kpọmkwem dịka isi mmalite si kwuo, kama ịgbanwe ya ka ọ bụrụ naanị “ìhè.”
- source_word: ἄχρι καιροῦ
  choice: ruo oge ụfọdụ
  rationale: Nke a na-egosi na ọnọdụ ahụ bụ nwa oge, ma ọ naghị ekpebi ogologo oge a na-ekwughị n’isi mmalite.
- source_word: παραχρῆμα
  choice: Ozugbo ahụ
  rationale: Ọ na-egosi na ihe ahụ mere n’enweghị oge gafere.
- source_word: ἀχλὺς
  choice: alụlụ
  rationale: “Alụlụ” na-echekwa onyinyo nke ihe kpuchiri anya ma mee ka ọhụhụ daa mbà.
- source_word: σκότος
  choice: ọchịchịrị
  rationale: Nke a bụ okwu Igbo kwụ ọtọ maka ọchịchịrị ma na-echekwakwa ụda egwu dị n’ahịrịokwu ahụ.
- source_word: περιάγων
  choice: ka ọ na-agagharị
  rationale: Nke a na-anọ nso n’echiche nke ịgagharị ebe dị iche iche, n’etinyeghị echiche “ịtụgharị aka n’ọchịchịrị” nke ngwaa Grik ekwughị kpọmkwem.
- source_word: ἐζήτει χειραγωγούς
  choice: ọ nọ na-achọ ndị ga-ejide ya n’aka duru ya
  rationale: 'Nkọwa a na-echekwa ihe χειραγωγός pụtara kpọmkwem: ndị na-ejide onye ọzọ n’aka wee na-edu ya.'
theological_decisions:
- issue: Ihe “aka Onyenwe anyị” pụtara
  choice: E debere akpaalaokwu ahụ dịka “aka Onyenwe anyị,” ma kọwaa ya n’ala peeji dịka ike Onyenwe anyị na-arụ ọrụ n’ikpe.
  alternative: “ikpe Onyenwe anyị adakwasịla gị” ma ọ bụ “Onyenwe anyị na-eti gị ihe”
  rationale: Isi mmalite na-egosi n’ụzọ doro anya na Chineke na-eme ihe ikpe, ma ntụgharị ekwesịghị iwepụ ihe atụ Akwụkwọ Nsọ ahụ ma ọ bụ kọwaa ya karịa ihe e dere.
- issue: Ogologo oge ìsì ahụ ga-adị
  choice: “ruo oge ụfọdụ”
  alternative: “ruo oge a kara aka”
  rationale: καιρός nwere ike ịpụta oge ma ọ bụ oge a kara aka. E debere enweghị nkọwa doro anya banyere ogologo oge ahụ, ebe e nyere ụzọ ọzọ n’ala peeji.
translation_notes:
  register: E jiri Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E debere akpaalaokwu “aka Onyenwe anyị” na ihe oyiyi “anyanwụ,” “alụlụ,” na “ọchịchịrị.” A haziri akara ala peeji n’ebe okwu nke ọ bụla metụtara dị, n’agbanyeghị na usoro ha n’ahịrịokwu bụ [a], [c], [b].
