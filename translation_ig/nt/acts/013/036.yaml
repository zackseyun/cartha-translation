id: ACT.13.36
reference: Acts 13:36
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Δαυὶδ μὲν γὰρ ἰδίᾳ γενεᾷ ὑπηρετήσας τῇ τοῦ θεοῦ βουλῇ ἐκοιμήθη καὶ προσετέθη πρὸς τοὺς πατέρας αὐτοῦ καὶ εἶδεν διαφθοράν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/036.yaml
  text: For David[a], after serving God's purpose in his own generation[d][c][b], fell asleep and was gathered to his fathers and saw decay.
translation:
  language: ig
  text: N’ihi na Devid, mgbe o jesịrị nzube Chineke ozi n’ọgbọ nke ya[d], dara n’ụra[a], e tinyekwara ya na ndị nna nna ya[b], ahụ ya wee ree ure[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ịdaba n’ụra” bụ akpaalaokwu Akwụkwọ Nsọ e ji ekwu ọnwụ.
    reason: cultural_note
  - marker: b
    text: 'N’ụzọ nkịtị: “e tinyekwara ya na ndị nna ya”; nke a bụ akpaalaokwu Hibru nke pụtara na o sonyeere ndị nna nna ya n’ọnwụ.'
    reason: lexical_alternative
  - marker: c
    text: Ya bụ, ahụ ya rere ure; lee ọdịiche e mere n’amaokwu na-esote.
    reason: cross_reference
  - marker: d
    text: 'O nwekwara ike ịpụta: “mgbe o jesịrị ọgbọ nke ya ozi dịka nzube Chineke si dị.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδίᾳ γενεᾷ
  choice: n’ọgbọ nke ya
  rationale: Nke a na-egosi oge na gburugburu ndị Devid biri n’etiti ha, n’etinyeghị echiche na ọ bụ naanị maka abamuru ọgbọ ahụ.
- source_word: ὑπηρετήσας
  choice: mgbe o jesịrị ... ozi
  rationale: Nkebi a bu ụzọ mee tupu ngwaa ndị bụ isi; okwu a bụ asụsụ Igbo doro anya maka ije ozi n’enweghị ụda pụrụ iche nke ọrụ ụka.
- source_word: τῇ τοῦ θεοῦ βουλῇ
  choice: nzube Chineke
  rationale: βουλή n’ebe a pụtara nzube, atụmatụ, ma ọ bụ ndụmọdụ; “nzube Chineke” bụ okwu Igbo dị ugbu a nke na-egosi ebumnobi Chineke n’amanyeghị nkọwa okpukpe karịrị ihe ederede kwuru.
- source_word: ἐκοιμήθη
  choice: dara n’ụra
  rationale: E chekwara ihe atụ dị n’asụsụ mmalite, nke ji ụra kwuo ọnwụ n’ụzọ dị nro.
- source_word: προσετέθη πρὸς τοὺς πατέρας αὐτοῦ
  choice: e tinyekwara ya n’ebe ndị nna nna ya nọ
  rationale: Nke a na-edobe ọdịdị akpaalaokwu Semitic ahụ ma mee ka ọ ghọta na Devid sonyeere ndị nna nna ya n’ọnwụ.
- source_word: εἶδεν διαφθοράν
  choice: ahụ ya wee ree ure
  rationale: N’agbanyeghị na okwu Grik ahụ kwuru n’ụzọ nkịtị ‘hụrụ ire ure,’ ihe ọ pụtara n’ebe a bụ na ahụ Devid rere ure. Ntụgharị a bụ nke okike n’Igbo ma na-edobe ihe dị iche na amaokwu na-esote.
theological_decisions:
- issue: Akpaalaokwu ụra maka ọnwụ Devid
  choice: dara n’ụra
  alternative: nwụrụ
  rationale: A hapụrụ ihe atụ κοιμάομαι dịka ọ dị ka e wee ghara ime ka okwu ahụ dị larịị ma ọ bụ tinye nkwenkwe ọzọ na-adịghị na ya.
- issue: Ihe βουλή na-ekwu banyere ebumnobi Chineke
  choice: nzube Chineke
  alternative: atụmatụ Chineke; ndụmọdụ Chineke
  rationale: “Nzube” na-egosi ebumnobi Chineke nke ọma n’asụsụ Igbo a na-asụ taa, ma ọ naghị amanye usoro nkà mmụta okpukpe pụrụ iche.
- issue: Onye ma ọ bụ ihe ἰδίᾳ γενεᾷ jikọrọ ya na ya
  choice: 'jikọrọ ya na ije ozi Devid: “mgbe o jesịrị nzube Chineke ozi n’ọgbọ nke ya”'
  alternative: “mgbe o jesịrị ọgbọ nke ya ozi dịka nzube Chineke si dị”
  rationale: 'Nhazi okwu Grik nwere nghọta abụọ: Devid nwere ike ịbụ onye jere nzube Chineke ozi n’ọgbọ ya, ma ọ bụ onye jere ọgbọ ya ozi dịka nzube Chineke si dị. Isi ederede na-agbaso nghọta temporal/sphere, ebe a kọwara nke ọzọ na ntụaka ụkwụ.'
translation_notes:
  register: Asụsụ Igbo izugbe, dị ugbu a ma dị nsọ n’ụda. E zere okwu ụka pụrụ iche. A gbanwere “hụrụ ire ure” ka ọ bụrụ “ahụ ya wee ree ure” maka nghọta doro anya; e debere ihe atụ ‘ụra’ na akpaalaokwu banyere ndị nna nna. Ọ dị mkpa ka akara [d] pụta n’isi ederede iji kwekọọ na ntụaka ụkwụ.
