base_translation:
  language: en
  yaml_path: translation/nt/acts/013/008.yaml
  text: But Elymas the magician opposed them—for that is how his name is translated—seeking to turn the proconsul away from the faith[a][b].
translation:
  language: ig
  text: Ma Elimas, onye mgbaasị ahụ, guzogidere ha—n’ihi na ọ bụ otú a ka a na-akọwa aha ya[b]—na-achọ idọpụ onye ọchịchị mpaghara Rom ahụ, bụ proconsul, n’okwukwe[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ: “n’ime ka ọ ghara ikwere.” Akụkụ okwu Grik a nwere ike ịpụta ịdọpụ ya n’okwukwe Ndị Kraịst kpọmkwem, ma ọ bụ igbochi nzaghachi ya nke ikwere n’ozi ahụ.'
    reason: alternative_reading
  - marker: b
    text: A kọwara “Elimas” ebe a dị ka aha a sụgharịrị ma ọ bụ a kọwara; amaghị kpọmkwem ebe aha ahụ si malite.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνθίστατο
  choice: guzogidere
  rationale: Ọ na-egosi mmegide na-aga n’ihu n’oge ahụ; “guzogidere” bụ okwu Igbo doro anya nke na-echekwa echiche nke iguzogide mmadụ.
- source_word: Ἐλύμας
  choice: Elimas
  rationale: E depụtara aha Grik ahụ n’ụdị dabara n’usoro mkpụrụokwu na mkpọpụta Igbo.
- source_word: ὁ μάγος
  choice: onye dibịa anwansi
  rationale: μάγος nwere ike ịpụta onye anwansi, onye na-eme mgbaasị, ma ọ bụ magus; okwu a bụ nke ndị Igbo nke oge a ga-aghọta, ma ọ naghị etinye nkọwa ọjọọ karịrị nke isi mmalite kwuru.
- source_word: οὕτως γὰρ μεθερμηνεύεται τὸ ὄνομα αὐτοῦ
  choice: n’ihi na ọ bụ otú a ka a na-asụgharị aha ya
  rationale: Nke a na-echekwa nkọwa nneokwu ahụ na-enye banyere ntụgharị ma ọ bụ nkọwa aha ahụ, n’agbanyeghị na mmalite kpọmkwem nke aha ahụ edoghị anya.
- source_word: ζητῶν
  choice: na-achọ
  rationale: Ọ na-egosi ebumnuche nke so mmegide ya; “na-achọ” dị mfe ma na-echekwa njikọ nke participle ahụ.
- source_word: διαστρέψαι ... ἀπό
  choice: ime ka ... hapụ
  rationale: Ebe ihe a na-ekwu maka ya bụ mmadụ a chọrọ ịdọpụ n’okwukwe, “ime ka ... hapụ” na-enye echiche nke ịtụgharị mmadụ pụọ n’ihe n’Igbo eke.
- source_word: τὸν ἀνθύπατον
  choice: onyeisi ọchịchị Rom ahụ
  rationale: ἀνθύπατος bụ ọkwa ọchịchị Rom a na-akpọ proconsul; ntụgharị nkọwa a na-eme ka onye na-agụ Igbo ghọta na ọ bụ ọkwa Rom pụrụ iche, ọ bụghị naanị onye ọchịchị n’ozuzu.
- source_word: ἀπὸ τῆς πίστεως
  choice: hapụ okwukwe
  rationale: “Okwukwe” bụ ntụgharị kwesịrị ekwesị nke πίστις. N’ọnọdụ a, isiokwu ahụ na ihe gbara amaokwu ahụ gburugburu nwere ike izo aka n’okwukwe Ndị Kraịst, ma a hapụrụ nghọta sara mbara n’ihe odide ala peeji.
theological_decisions:
- issue: Nghọta nke πίστις
  choice: okwukwe
  alternative: ikwere
  rationale: Akụkụ Grik ahụ nwere ike ịpụta okwukwe Ndị Kraịst kpọmkwem ma ọ bụ nzaghachi nke ikwere n’ozuzu. Isi ederede jiri “okwukwe,” ebe ihe odide ala peeji na-echekwa nghọta nke ọzọ.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E jiri akara ogologo kwụchie nkọwa etiti ahụ; e tinyere akara ihe odide ala peeji niile n’isi ederede.
