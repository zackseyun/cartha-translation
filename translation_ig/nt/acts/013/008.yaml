revisions:
- from: Ma Elimas, onye dibịa anwansi, guzogidere ha—n’ihi na ọ bụ otú a ka a na-asụgharị aha ya[b]—na-achọ ime ka onyeisi ọchịchị Rom ahụ hapụ okwukwe[a].
  to: Ma Elimas, onye mgbaasị ahụ, guzogidere ha—n’ihi na ọ bụ otú a ka a na-akọwa aha ya[b]—na-achọ idọpụ onye ọchịchị mpaghara Rom ahụ, bụ proconsul, n’okwukwe[a].
  rationale: The revision preserves the source’s adversative action and purposive participle, uses a natural Igbo designation for μάγος, and retains the technical sense of ἀνθύπατος by describing it as a Roman provincial official and supplying “proconsul.” The footnotes remain anchored at the relevant phrases and preserve the lexical and contextual ambiguity.
