revisions:
- from: Ma mgbe ndị Juu[a] hụrụ igwe mmadụ ahụ, ekworo[b] jupụtara ha, ha amalitekwa ikwu okwu megide ihe Pọl na-ekwu[c], na-ekwulu Chineke.
  to: Ma mgbe ndị Juu[a] hụrụ igwe mmadụ ahụ, ekworo[b] jupụtara ha; ha amalitekwa ikwu okwu megide ihe ndị Pọl na-ekwu[c], na-ekwu okwu nkwulu.
  rationale: The correction removes the added object “Chineke” so that the translation preserves the Greek participle’s unstated object and does not impose a narrower theological interpretation. The wording for Paul’s speech is adjusted to plural “ihe ndị” for closer correspondence with τοῖς ... λαλουμένοις, while remaining idiomatic Standard Igbo. Footnote markers and their content remain structurally sound.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T09:18:52Z'
review_pass:
  verdict: revise
  source_fidelity: The temporal rendering, local narrative reference of “ndị Juu,” crowds, jealousy, and ongoing contradiction are substantially faithful. However, “na-ekwulu Chineke” specifies God as the object of βλασφημοῦντες, whereas the Greek leaves the object unstated and can denote abusive/reviling speech in this context. This must remain non-specific. The proposed correction also more directly reflects the passive expression “the things being spoken by Paul.”
  naturalness: The revised sentence uses natural, modern Standard Igbo while retaining a dignified biblical register. “na-ekwu okwu nkwulu” naturally conveys the accompanying abusive speech without requiring an object.
  terminology: “ekworo” is appropriate here for ζῆλος in its negative sense. “ndị Juu” properly retains the source designation, with the contextual footnote preventing an unwarranted universal reading. Replacing “na-ekwulu Chineke” with “na-ekwu okwu nkwulu” preserves the breadth of βλασφημοῦντες.
  issues:
  - severity: high
    issue: The draft identifies God as the object of βλασφημοῦντες.
    rationale: βλασφημοῦντες has no expressed object in the Greek. Although blasphemy may in some contexts concern God, this verse does not state that directly; the translation should not resolve this ambiguity by adding “Chineke.”
  - severity: low
    issue: “ihe Pọl na-ekwu” does not explicitly reflect the passive wording governed by ὑπό (“by Paul”).
    rationale: It is intelligible and broadly equivalent, but “ihe ndị Pọl na-ekwu” more fully represents the plural substantive participle and the ongoing speech in a natural Igbo form.
  revised_text: Ma mgbe ndị Juu[a] hụrụ igwe mmadụ ahụ, ekworo[b] jupụtara ha; ha amalitekwa ikwu okwu megide ihe ndị Pọl na-ekwu[c], na-ekwu okwu nkwulu.
  revised_footnotes:
  - marker: a
    text: Nke a bụ otu ndị Juu nọ n’ebe ahụ bụ ndị na-emegide Pọl n’ihe a na-akọ, ọ bụghị ndị Juu niile.
    reason: cultural_note
  - marker: b
    text: Ma ọ bụ, “ịnụ ọkụ n’obi”; n’ebe a, ihe ndị gbara okwu ahụ gburugburu na-akwado echiche ọjọọ bụ “ekworo.”
    reason: lexical_alternative
  - marker: c
    text: N’ụzọ nkịtị, “ihe ndị Pọl na-ekwu.”
    reason: lexical_alternative
