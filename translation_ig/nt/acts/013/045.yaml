language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἰδόντες δὲ οἱ Ἰουδαῖοι τοὺς ὄχλους ἐπλήσθησαν ζήλου καὶ ἀντέλεγον τοῖς ⸀ὑπὸ Παύλου ⸀λαλουμένοις ⸀βλασφημοῦντες.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/045.yaml
  text: But when the Jews saw the crowds[a], they were filled with jealousy and began contradicting what was spoken by Paul[c][b], blaspheming.
translation:
  language: ig
  text: Ma mgbe ndị Juu[a] hụrụ igwe mmadụ ahụ, ekworo[b] jupụtara ha; ha amalitekwa ikwu okwu megide ihe ndị Pọl na-ekwu[c], na-ekwu okwu nkwulu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nke a bụ otu ndị Juu nọ n’ebe ahụ bụ ndị na-emegide Pọl n’ihe a na-akọ, ọ bụghị ndị Juu niile.
    reason: cultural_note
  - marker: b
    text: Ma ọ bụ, “ịnụ ọkụ n’obi”; n’ebe a, ihe ndị gbara okwu ahụ gburugburu na-akwado echiche ọjọọ bụ “ekworo.”
    reason: lexical_alternative
  - marker: c
    text: N’ụzọ nkịtị, “ihe ndị Pọl na-ekwu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδόντες
  choice: mgbe ... hụrụ
  rationale: A sụgharịrị aorist participle ahụ dị ka nkebiokwu oge n’Igbo, iji gosi njikọ ya na omume bụ isi n’asụsụ na-aga were were.
- source_word: δὲ
  choice: Ma
  rationale: Ọ na-egosi mgbanwe na obere mmegide megide nnabata ọma a kọwara n’amaokwu ndị bu ụzọ.
- source_word: οἱ Ἰουδαῖοι
  choice: ndị Juu
  rationale: Nke a na-edobe aha otu ndị ahụ dịka Grik si kwuo ya, n’emeghị ka ọ bụrụ naanị ndị ndu; ihe odide ala ala na-akọwa na ọ bụ ndị Juu nọ n’ebe ahụ bụ ndị na-emegide Pọl.
- source_word: τοὺς ὄχλους
  choice: igwe mmadụ ahụ
  rationale: Ọ bụ ụzọ Igbo nkịtị si akọwa ìgwè mmadụ buru ibu; ọ bụ ezie na Grik ji ọtụtụ mee ihe, otu okwu mkpokọta a na-ada nke ọma n’Igbo.
- source_word: ἐπλήσθησαν ζήλου
  choice: ekworo jupụtara ha
  rationale: ζῆλος nwere ike ịbụ ịnụ ọkụ n’obi ma ọ bụ ekworo; omume mmegide sochiri ya na-akwado echiche ọjọọ bụ ‘ekworo,’ ebe usoro okwu ahụ ka na-egosipụta ‘jupụtara.’
- source_word: ἀντέλεγον
  choice: ha amalitekwa ikwu okwu megide
  rationale: Nke a na-egosipụta imperfect ahụ dịka omume malitere ma na-aga n’ihu, ma na-ada nke ọma n’Igbo.
- source_word: τοῖς ὑπὸ Παύλου λαλουμένοις
  choice: ihe Pọl na-ekwu
  rationale: A na-enye articular passive participle ahụ n’Igbo dịka ihe Pọl nọ na-ekwu; nke a bụ usoro okike ma na-edobe echiche nke okwu ya.
- source_word: βλασφημοῦντες
  choice: na-ekwulu Chineke
  rationale: ‘Ikwulu Chineke’ na-eburu ịdị arọ nke βλασφημέω n’Igbo Akwụkwọ Nsọ ma na-egosi omume nke sonyere n’ịrụrịta ụka ha; a naghị akọwapụta kpọmkwem otú nkwulu ahụ si metụta ozi ahụ.
theological_decisions:
- issue: Ịghọta οἱ Ἰουδαῖοι dịka ikpe megide ndị Juu niile
  choice: ndị Juu[a]
  alternative: ndị ndu Juu; ndị Judia
  rationale: Ihe odide ahụ kwuru naanị ‘ndị Juu,’ ya mere a naghị etinye ‘ndị ndu’ na-enweghị ihe akaebe. Ma akara ala ala na-egbochi ịgbasa okwu a ka ọ bụrụ ikpe megide ndị Juu niile.
- issue: Ihe βλασφημοῦντες na-ezo aka na ya
  choice: na-ekwulu Chineke
  alternative: na-ekwu okwu mkparị; na-ekwutọ
  rationale: Okwu Grik ahụ nwere ike ịpụta nkwulu megide Chineke ma ọ bụ okwu mkparị siri ike. N’ọnọdụ mgbasa ozi Chineke a, ‘ikwulu Chineke’ na-eburu ike okwu ahụ, ma a naghị agbakwunye onye ma ọ bụ ihe kpọmkwem ha kwuluru karịa nke Igbo chọrọ.
translation_notes:
  register: Igbo ọkọlọtọ, nke oge a ma dị ùgwù. Ahịrịokwu ahụ ji usoro okwu dị mfe ndị nkịtị ga-aghọta, ma debe mgbanwe akụkọ, ịdị arọ nke nkwulu, na nghọta abụọ ζῆλος nwere ike inwe.
