base_translation:
  language: en
  yaml_path: translation/nt/acts/013/019.yaml
  text: And after destroying seven nations in the land of Canaan[a], he gave them their land as an inheritance.
translation:
  language: ig
  text: Mgbe o bibisịrị mba asaa n’ala Kenan, o nyere ụmụ Izrel ala mba ndị ahụ ka ọ bụrụ ihe nketa ha.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “o kesara ụmụ Izrel ala mba ndị ahụ dịka ihe nketa.” Okwu Grik ahụ pụrụ imesi echiche nke ikesa ma ọ bụ ikenye ala dịka ihe nketa ike.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθελὼν
  choice: mgbe o bibisịrị
  rationale: Nkebi a na-egosi ihe Chineke mere mba Kenan tupu o nye Izrel ala ahụ. “Bibisịrị” na-enye ike okwu καθαιρέω n’ụzọ doro anya ma dịkwa mfe nghọta n’Igbo.
- source_word: ἔθνη ἑπτὰ
  choice: mba asaa
  rationale: “Mba” bụ okwu Igbo nkịtị ma kwesị ekwesị maka ἔθνη n’akụkọ banyere ndị bi n’ala Kenan.
- source_word: ἐν γῇ Χανάαν
  choice: n’ala Kenan
  rationale: Nsụgharị a debere γῇ, “ala,” kama ikwu naanị “na Kenan.”
- source_word: κατεκληρονόμησεν
  choice: o nyere ha ... ka ọ bụrụ ihe nketa ha
  rationale: Okwu a nwere echiche nke ikesa ma ọ bụ inye ala dịka ihe nketa. Nsụgharị ahụ na-eme ka onye natara ya—Izrel—pụta ìhè site n’ọnọchiaha “ha,” dịka ihe gbara amaokwu ahụ gburugburu si egosi.
- source_word: τὴν γῆν αὐτῶν
  choice: ala mba ndị ahụ
  rationale: αὐτῶν na-ezo aka na mba asaa ahụ. Ikwughachi “mba ndị ahụ” na-ewepụ mgbagwoju anya nke ọnọchiaha abụọ “ha” gaara akpata n’Igbo.
theological_decisions:
- issue: Onye mere omume ndị ahụ na ndị natara ala ahụ
  choice: Chineke bụ onye bibiri mba ndị ahụ ma nye Izrel ala ha dịka ihe nketa.
  alternative: Chineke kesara ala mba ndị ahụ, n’ekwughị kpọmkwem ndị natara ya.
  rationale: Ihe gbara amaokwu ahụ gburugburu na-akọ ọrụ Chineke n’akụkọ Izrel. Grik ekwughị onye natara ala ahụ kpọmkwem, ma ihe akụkọ ahụ pụtara bụ na Izrel natara ya; “ha” bụ nkọwa asụsụ dị mkpa, ọ bụghị mgbakwunye ozizi.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ “ala mba ndị ahụ” iji zere mgbagwoju anya gbasara ndị “ha” na-ezo aka na ha; akara ndetu ala peeji [a] dị n’isiokwu ahụ.
