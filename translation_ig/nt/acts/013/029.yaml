  text: ὡς δὲ ἐτέλεσαν πάντα τὰ περὶ αὐτοῦ γεγραμμένα, καθελόντες ἀπὸ τοῦ ξύλου ἔθηκαν εἰς μνημεῖον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/029.yaml
  text: And when they had carried out all that had been written concerning him[a], they took him down from the tree and laid him in a tomb.
translation:
  language: ig
  text: Mgbe ha mezuchara ihe niile e dere banyere ya, ha si n'osisi[a] wedata ya ma tinye ya n'ili.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “obe”; n'ụzọ nkịtị, “osisi.” Okwu Grik bụ ξύλον; a na-ejikwa ya akọwa ngwá osisi e ji egbu mmadụ, ọ pụkwara ịbụ ntụaka na Diuterọnọmi 21:23.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ
  choice: Mgbe
  rationale: Ọ na-ewebata ihe mere n'oge sochirinụ; ‘Mgbe’ bụ ụzọ Igbo dị mfe ma kwekọọ n'usoro akụkọ.
- source_word: ἐτέλεσαν
  choice: mezuchara
  rationale: Ọ pụtara imezu ma ọ bụ iweta ihe ruo n'ọgwụgwụ; ụdị a na-egosikwa na omume ahụ buru ụzọ mee tupu e wedata ya.
- source_word: πάντα τὰ περὶ αὐτοῦ γεγραμμένα
  choice: ihe niile e dere banyere ya
  rationale: Nke a na-edobe nghọta zuru ezu nke πάντα na ọnọdụ ihe ndị e dere tupu mgbe ahụ, n'Igbo dị eke.
- source_word: καθελόντες
  choice: ha wepụtara ya n'elu
  rationale: A sụgharịrị participle ahụ dịka omume sochiri nke mbụ; ‘wepụtara ... n'elu’ na-egosi iwepụ ozu ahụ n'ihe e kokwasịrị ya.
- source_word: ἀπὸ τοῦ ξύλου
  choice: n'elu osisi
  rationale: ξύλον pụtara osisi ma ọ bụ ihe e ji osisi rụọ; ‘osisi’ na-echekwa okwu Grik ahụ na njikọ o nwere ike inwe na Diuterọnọmi 21:23, kama itinye ‘obe’ ozugbo n'ahịrị isi.
- source_word: ἔθηκαν εἰς μνημεῖον
  choice: lie ya n'ili
  rationale: N'ọnọdụ olili ozu, okwu Igbo a bụ ụzọ dị eke isi kwuo na ha tinyere ya n'ebe a na-eli ozu, ọ bụ ezie na Grik n'onwe ya ji ngwaa sara mbara nke pụtara ‘tinye’.
theological_decisions:
- issue: Otu e si sụgharịa ξύλον n'akụkọ ahụhụ na ọnwụ Jizọs
  choice: osisi
  alternative: obe
  rationale: Grik ji ξύλον, ọ bụghị σταυρός. ‘Osisi’ na-echekwa ụdị okwu ahụ na mgbagwoju anya ya, tinyere njikọ ọ pụrụ inwe na okwu gbasara onye a kpọgidere n'osisi; ‘obe’ bụ nkọwa ọnọdụ a na-ahụkarị, ya mere e tinyere ya n'ala peeji.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. A họọrọ ‘lie ya n’ili’ maka ịdị eke n'Igbo, ebe e debere ‘osisi’ n'ahịrị isi iji kwanyere nhọrọ okwu Grik ùgwù.
