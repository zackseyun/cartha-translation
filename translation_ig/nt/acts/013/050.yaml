  to: Ma ndị Juu kpaliri ụmụ nwanyị na-efe Chineke, ndị a na-akwanyere ùgwù[a], na ndị ikom bụ ndị isi obodo ahụ; ha kpalitekwara mkpagbu megide Pọl na Banabas, chụpụkwa ha pụọ n’ókèala ha[b].
