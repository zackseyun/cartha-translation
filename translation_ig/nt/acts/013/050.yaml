id: ACT.13.50
reference: Acts 13:50
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οἱ δὲ Ἰουδαῖοι παρώτρυναν τὰς σεβομένας ⸀γυναῖκας τὰς εὐσχήμονας καὶ τοὺς πρώτους τῆς πόλεως καὶ ἐπήγειραν διωγμὸν ἐπὶ τὸν Παῦλον ⸀καὶ Βαρναβᾶν, καὶ ἐξέβαλον αὐτοὺς ἀπὸ τῶν ὁρίων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/050.yaml
  text: But the Jews stirred up the devout women of high standing and the leading men of the city[b][a], and stirred up persecution against Paul and Barnabas and drove them out of their district.
translation:
  language: ig
  text: Ma ndị Juu kpaliri ụmụ nwanyị na-efe Chineke, ndị a na-akwanyere ùgwù[a], na ndị ikom bụ ndị isi obodo ahụ; ha kpalitekwara mkpagbu megide Pọl na Banabas, chụpụkwa ha pụọ n’ókèala ha[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ụmụ nwanyị na-atụ egwu Chineke.” Okwu Grik ahụ nwere ike ịpụta ụmụ nwanyị na-efe Chineke nke Izrel, ikekwe ndị mba ọzọ na-akpakọrịta na ụlọ nzukọ ndị Juu.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “site na mpaghara ha” ma ọ bụ “site n’ókèala ha.” Okwu Grik ahụ nwere ike ịpụta oke ala ma ọ bụ mpaghara dị n’ime oke ahụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ Ἰουδαῖοι
  choice: Ma ndị Juu
  rationale: “Ma” na-egosi ntụgharị megidere ihe ọma a kọrọ n’amaokwu bu ụzọ, ebe “ndị Juu” na-edobe onye isiokwu ahụ dịka Grik si kwuo.
- source_word: παρώτρυναν
  choice: kpaliri
  rationale: Na-egosi na ha mere ka ndị ọzọ bilie mee ihe, n’enweghị ịkọwa kpọmkwem ụzọ ha si mee ya.
- source_word: σεβομένας γυναῖκας
  choice: ụmụ nwanyị na-efe Chineke
  rationale: Na-egosipụta ofufe na nsọpụrụ okpukpe dị na participle ahụ, ma ọ naghị ekpebi kpamkpam ma ụmụ nwanyị ahụ bụ ndị mba ọzọ jikọrọ onwe ha na ụlọ nzukọ ndị Juu.
- source_word: εὐσχήμονας
  choice: ndị a na-akwanyere ùgwù
  rationale: Na-ejikọta nkwanye ùgwù ọha na ọnọdụ dị elu n’asụsụ Igbo dị mfe ma dị ebube.
- source_word: τοὺς πρώτους τῆς πόλεως
  choice: ndị ikom bụ ndị isi obodo ahụ
  rationale: Na-edobe ntụaka nwoke dị na Grik ma na-egosi na ha bụ ndị nọ n’ọkwa ọchịchị ma ọ bụ ọha kachasị elu n’obodo ahụ.
- source_word: ἐπήγειραν διωγμὸν
  choice: ha kpalitekwara mkpagbu
  rationale: Na-egosi na ha mere ka mkpagbu bilie, ma na-edobe njikọ okwu na “kpaliri” nke mbụ.
- source_word: ἐπὶ τὸν Παῦλον καὶ Βαρναβᾶν
  choice: megide Pọl na Banabas
  rationale: “Megide” na-egosi n’ụzọ doro anya na mkpagbu ahụ chere ha ihu dị ka ndị iro.
- source_word: ἐξέβαλον
  choice: chụpụkwa
  rationale: Na-egosi mmanye siri ike nke ịchụ mmadụ pụọ, n’asụsụ Igbo nkịtị.
- source_word: ἀπὸ τῶν ὁρίων αὐτῶν
  choice: n’ókèala ha
  rationale: “Ókèala” nwere ike ịgụnye mpaghara dị n’ime oke ahụ ma ka na-edobe echiche nke oke ala dị na ὅρια.
theological_decisions:
- issue: Ọnọdụ okpukpe nke σεβομένας γυναῖκας
  choice: ụmụ nwanyị na-efe Chineke
  alternative: ụmụ nwanyị na-atụ egwu Chineke
  rationale: Nhọrọ bụ isi na-egosi nsọpụrụ na ofufe Chineke n’enweghị ime ka okwu ahụ bụrụ aha teknụzụ doro anya maka ndị mba ọzọ sonyere n’ofufe ndị Juu.
- issue: Idobe ntụaka nwoke na τοὺς πρώτους τῆς πόλεως
  choice: ndị ikom bụ ndị isi obodo ahụ
  alternative: ndị isi obodo ahụ
  rationale: Grik kwuru kpọmkwem banyere ndị nwoke nọ n’ọkwa dị elu; ntụgharị ahụ na-edobe nkọwa a kama ime ka ọ bụrụ nke na-enweghị okike.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ugwu ma dị mfe nghọta. E ji “ụmụ nwanyị na-efe Chineke” zere imechi nghọta nke participle ahụ n’otu nkọwa teknụzụ; e ji “ndị ikom” debe ntụaka nwoke nke ederede Grik. E debere akara ndetu [a] na [b] ozugbo n’ebe okwu ndị ha na-akọwa dị.
