review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the three imperatives, the emphatic first-person subject, the warning of ruin, and the emphatic denial of belief. However, the temporal phrase should reflect the plural «in your days» more clearly, and the address can mark the Greek plural imperative more naturally.
  naturalness: The verse is generally clear Standard Igbo. “Leenụ” is a more natural plural summons than “Lee,” “ndị na-elelị” is less cumbersome than “ndị na-eleda ihe anya,” and removing -kwa from “laakwa n’iyi” avoids an unintended additive nuance.
  terminology: “ọrụ,” “mụ onwe m na-arụ,” “juọnụ anya,” and “laa n’iyi” are suitable and maintain the solemn prophetic register without importing doctrinal interpretation.
  issues:
  - severity: medium
    issue: “n’ụbọchị unu” does not clearly represent the plural ταῖς ἡμέραις.
    rationale: The Greek explicitly says “in your days.” “n’ụbọchị ndị unu” retains the plural temporal reference.
  - severity: low
    issue: “Lee” does not overtly mark the plural address, and “laakwa” may imply “go also.”
    rationale: The source uses plural imperatives. “Leenụ” naturally addresses a group, while “laanụ n’iyi” conveys the imperative warning without the potentially additive -kwa.
  - severity: low
    issue: “unu ndị na-eleda ihe anya” is somewhat heavy and leaves the object of contempt unspecified in an awkward way.
    rationale: “Unu ndị na-elelị” is a natural nominal expression for the addressed contemptuous people and preserves the source’s broad wording.
  revised_text: “Leenụ, unu ndị na-elelị[a], juọnụ anya, laanụ n’iyi[b]; n’ihi na mụ onwe m na-arụ otu ọrụ n’ụbọchị ndị unu—ọrụ unu na-agaghị ekwere, ma ọ bụrụ na mmadụ akọọrọ unu ya[c].”
