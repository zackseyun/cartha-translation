id: ACT.13.41
reference: Acts 13:41
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἴδετε, οἱ καταφρονηταί, καὶ θαυμάσατε καὶ ἀφανίσθητε, ὅτι ἔργον ⸂ἐργάζομαι ἐγὼ⸃ ἐν ταῖς ἡμέραις ὑμῶν, ⸀ἔργον ὃ οὐ μὴ πιστεύσητε ἐάν τις ἐκδιηγῆται ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/041.yaml
  text: Look[a], you scoffers, and marvel, and perish; for I am doing a work in your days[c][b], a work that you will certainly not believe if someone tells it to you.
translation:
  language: ig
  text: “Leenụ, unu ndị na-elelị[a], juọnụ anya, laanụ n’iyi[b]; n’ihi na mụ onwe m na-arụ otu ọrụ n’ụbọchị ndị unu—ọrụ unu na-agaghị ekwere, ma ọ bụrụ na mmadụ akọọrọ unu ya[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “unu ndị na-akparị.” Okwu Grik ahụ na-ezo aka ná ndị ji nlelị ele ihe anya ma na-ajụ ya.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsị, “pụọnụ n’anya” ma ọ bụ “bụrụnụ ndị e bibiri.” Ihe a e hotara na-esochi Habakọk 1:5 n’asụsụ Grik ma buru ịdọ aka ná ntị siri ike banyere mbibi.
    reason: alternative_reading
  - marker: c
    text: Okwu Grik ahụ nwere ike ịpụta “kọọrọ unu ya n’uju” ma ọ bụ “kọwaara unu ya nke ọma.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἴδετε
  choice: Lee
  rationale: Ọ bụ iwu e nyere ọtụtụ mmadụ ka ha tụgharịa uche ha n’ihe a na-ekwu. “Lee” bụ okwu Igbo doro anya ma dị ndụ.
- source_word: καταφρονηταί
  choice: unu ndị na-eleda ihe anya
  rationale: Nhọrọ a na-egosi ile ihe anya dị ka ihe na-abaghị uru na iji nlelị jụ ya; ọ naghị amachi okwu ahụ nanị n’ịkwa emo ọnụ.
- source_word: θαυμάσατε
  choice: juọnụ anya
  rationale: Nke a na-ebute ike nke iwu ahụ nke na-akpọ ha ka ihe ahụ tụ ha n’anya, ma na-edobekwa ụda amụma siri ike.
- source_word: ἀφανίσθητε
  choice: laakwa n’iyi
  rationale: Okwu a nwere ike ịpụta ịpụ n’anya ma ọ bụ ibibi; “laa n’iyi” na-egosi ịdaba ná mbibi n’ụzọ sitere n’okwu ikpe dị n’amaokwu a.
- source_word: ἔργον
  choice: ọrụ
  rationale: “Ọrụ” bụ okwu sara mbara ma kwekọọ n’omume pụrụ iche Chineke na-arụ, n’etinyeghị nkọwa karịrị isi mmalite.
- source_word: ἐργάζομαι ἐγώ
  choice: mụ onwe m na-arụ
  rationale: “Mụ onwe m” na-echekwa nkwusi ike nke nnọchiaha ἐγώ, ebe “na-arụ” na-egosi omume na-aga n’ihu.
- source_word: ἐν ταῖς ἡμέραις ὑμῶν
  choice: n’ụbọchị unu
  rationale: Nke a na-echekwa ntụaka oge na ịdị nso nke ịdọ aka ná ntị ahụ nye ndị na-ege ntị.
- source_word: οὐ μὴ πιστεύσητε
  choice: unu na-agaghị ekwere
  rationale: Usoro ọdịnihu na-adịghị mma a na Igbo na-enye nkwenye siri ike na ha agaghị ekwere, dị ka οὐ μή si mee.
- source_word: ἐάν τις ἐκδιηγῆται ὑμῖν
  choice: ma ọ bụrụ na mmadụ akọọrọ unu ya
  rationale: “Akọọrọ” na-egosi ịkọ ihe mere; nnọchiaha “ya” na-ezo aka n’ọrụ ahụ. Ihe okwu Grik pụtara banyere ịkọzu ihe dị na nkọwa ala peeji.
theological_decisions:
- issue: Ike ịdọ aka ná ntị nke okwu amụma e hotara na Habakọk
  choice: Jiri “laakwa n’iyi” ma debe nkwusi ike na ha agaghị ekwere.
  alternative: Jiri “pụọnụ n’anya” nke na-esochi ọdịdị okwu Grik nso karịa ma ọ bụ okwu dị nro banyere iju anya.
  rationale: N’ọnọdụ a, ihe Pọl hotara bụ ịdọ aka ná ntị siri ike megide ileda ọrụ Chineke anya. “Laa n’iyi” na-echekwa echiche mbibi n’emeghị ka e dozie kpọmkwem ụdị ikpe ahụ karịa ka isi mmalite kwuru.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E debere usoro iwu atọ nke ahịrịokwu amụma ahụ, nkwusi ike nke “mụ onwe m,” na ike nke agọnarị ahụ; e zere okwu ochie na nkọwa ụka pụrụ iche.
