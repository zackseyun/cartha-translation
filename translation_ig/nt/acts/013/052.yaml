revisions:
- from: Ndị na-eso ụzọ ahụ nọgidekwara na-ejupụta n'ọṅụ na Mmụọ Nsọ.[a]
  to: Ndị na-eso ụzọ ahụ jupụtakwara n'ọṅụ na Mmụọ Nsọ.[a]
  rationale: The revision retains the verse’s twofold content—joy and the Holy Spirit—and its link to the preceding account, while replacing an overexplicit, less natural verbal construction with idiomatic Standard Igbo. The footnote preserves the imperfect’s possible ongoing or repeated nuance without forcing it into the main text.
  reviewer_model: gpt-5.6-terra
