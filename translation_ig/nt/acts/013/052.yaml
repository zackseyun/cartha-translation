  yaml_path: translation/nt/acts/013/052.yaml
  text: And the disciples were filled with joy and the Holy Spirit[a].
translation:
  language: ig
  text: Ndị na-eso ụzọ ahụ jupụtakwara n'ọṅụ na Mmụọ Nsọ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ngwaa Grik ahụ dị n’ụdị imperfect; ọ pụrụ igosi na a nọ na-emeju ha, ma ọ bụ na a na-emeju ha ugboro ugboro, n’oge gara aga.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἵ τε
  choice: Ndị ... ahụ ...kwara
  rationale: τε na-ejikọta ahịrịokwu a na akụkọ bu ya ụzọ. Mgbakwunye -kwara na Igbo na-egosi njikọ na ịga n'ihu n'ụzọ eke.
- source_word: μαθηταὶ
  choice: ndị na-eso ụzọ
  rationale: Nke a bụ okwu Igbo a na-ejikarị akọwa ndị na-amụta ihe n'aka onye nkuzi ma na-eso ya; n'ebe a, ọ bụ ndị kwere ekwe nọ n'ógbè ahụ.
- source_word: ἐπληροῦντο
  choice: nọgidere na-ejupụta
  rationale: Ọ bụ imperfect passive, nke nwere ike igosi omume gara n'ihu ma ọ bụ mere ugboro ugboro. Nsụgharị a na-echekwa echiche ahụ nke ọma n'Igbo.
- source_word: χαρᾶς
  choice: n'ọṅụ
  rationale: Nke a bụ ụzọ Igbo dị nkenke ma bụrụ nke eke isi gosipụta ihe jupụtara n'ime ha.
- source_word: πνεύματος ἁγίου
  choice: Mmụọ Nsọ
  rationale: N'Ọrụ Ndịozi, nkebiokwu a na-ezo aka na Mmụọ Nsọ nke Chineke. Aha a bụkwa usoro Igbo doro anya ma guzosie ike.
theological_decisions:
- issue: Ma πνεύματος ἁγίου ọ na-ezo aka n'ọnọdụ ime mmụọ n'ozuzu ya ka ọ bụ Mmụọ Nsọ nke Chineke
  choice: Mmụọ Nsọ
  alternative: mmụọ nsọ
  rationale: N'ime Ọrụ Ndịozi, πνεῦμα ἅγιον na-ezokarị aka na Mmụọ Nsọ nke Chineke nke na-arụ ọrụ n'ozi chọọchị. Ihe gbara amaokwu a gburugburu na-akwado nghọta a.
- issue: Ma imperfect ἐπληροῦντο bụ otu mmeju naanị ka ọ bụ ọnọdụ/omume na-aga n'ihu ma ọ bụ na-eme ugboro ugboro
  choice: nọgidere na-ejupụta
  alternative: jupụtara
  rationale: Ụdị imperfect ahụ na-enye echiche nke ịga n'ihu ma ọ bụ ime ugboro ugboro; isiokwu ala na ndetu ala na-echekwa ihe a na-enweghị imechi ụzọ maka nsụgharị dị mfe.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji “ndị na-eso ụzọ” mee ihe kama okwu ochie ma ọ bụ nke otu ụka pụrụ iche; “nọgidere na-ejupụta” na-eme ka akụkụ imperfect pụta ìhè n'ụzọ eke.
