  text: βλέπετε οὖν μὴ ⸀ἐπέλθῃ τὸ εἰρημένον ἐν τοῖς προφήταις·
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/040.yaml
  text: 'Therefore watch out[a], lest what has been spoken in the prophets come upon you:'
translation:
  language: ig
  text: 'Ya mere, lezienụ anya ka ihe e kwuru n’akwụkwọ ndị amụma[a] ghara ịdakwasị unu:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “nke ndị amụma kwuru.” N’asụsụ Grik, ọ bụ “n’ime ndị amụma,” ma eleghị anya ọ na-arụtụ aka n’akwụkwọ amụma dịka ebe e dere ịdọ aka ná ntị a.
    reason: lexical_alternative
lexical_decisions:
- source_word: βλέπετε
  choice: lezienụ anya
  rationale: Ọ bụ iwu e nyere ọtụtụ mmadụ nke na-adọ ha aka ná ntị. “Lezienụ anya” bụ Igbo dị ugbu a ma na-egosipụta ịmụrụ anya na ịkpachara anya.
- source_word: οὖν
  choice: Ya mere
  rationale: Ọ na-ejikọta ịdọ aka ná ntị a na nkwubi okwu sitere n’ihe Pọl kwuru tupu ya.
- source_word: μὴ ἐπέλθῃ
  choice: ka ... ghara ịdakwasị unu
  rationale: Usoro a na-egosipụta ịdọ aka ná ntị banyere ihe a na-atụ egwu na ọ pụrụ ime. “Ịdakwasị unu” na-egosipụta ihe na-abịakwasị mmadụ, karịsịa ikpe ma ọ bụ ọdachi.
- source_word: τὸ εἰρημένον
  choice: ihe e kwuru
  rationale: Nke a na-asụgharị participle ahụ e ji dịka aha n’ụzọ eke n’Igbo, na-enweghị ịgbakwunye onye kwuru ya.
- source_word: ἐν τοῖς προφήταις
  choice: n’akwụkwọ ndị amụma
  rationale: N’ebe a, okwu ahụ na-arụtụ aka n’ihe dị n’otu akụkụ Akwụkwọ Nsọ a na-akpọ Ndị Amụma, ebe ọ bụ na amaokwu na-esote ga-ehota Habakọk. Itinye “akwụkwọ” na-eme ka ihe a pụtara doo onye Igbo anya.
theological_decisions:
- issue: Ihe “ndị amụma” na-arụtụ aka na ya
  choice: akwụkwọ amụma dị n’Akwụkwọ Nsọ dịka otu nchịkọta
  alternative: ndị amụma dịka ndị mmadụ kwuru okwu ahụ
  rationale: Ihe gbara amaokwu a gburugburu na nkwupụta Habakọk na-esote na-akwado ntụaka nye ihe e dere n’akwụkwọ amụma. Ihe odide isi na-edebe nke a, ebe nkọwa ala peeji na-egosi ụzọ ọzọ e nwere ike isi ghọta okwu Grik ahụ.
translation_notes:
  register: Asụsụ ahụ bụ Standard Igbo, dị ùgwù ma dị mfe nghọta. E ji ụdị ọtụtụ mmadụ “lezienụ” na “unu” chekwaa ntụaka nke Grik. E ji “n’akwụkwọ ndị amụma” mee ka okwu metụtara nchịkọta Akwụkwọ Nsọ doo anya, ma e debere nghọta nke ọzọ na nkọwa ala peeji.
