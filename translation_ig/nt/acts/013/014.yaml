  text: αὐτοὶ δὲ διελθόντες ἀπὸ τῆς Πέργης παρεγένοντο εἰς Ἀντιόχειαν ⸂τὴν Πισιδίαν⸃, καὶ ⸀εἰσελθόντες εἰς τὴν συναγωγὴν τῇ ἡμέρᾳ τῶν σαββάτων ἐκάθισαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/014.yaml
  text: But they went on from Perga and came to Antioch in Pisidia[a], and on the Sabbath day they entered the synagogue and sat down.
translation:
  language: ig
  text: Ma ha si Pega gaa n’ihu wee rute Antiọk dị na Pisidia[a]. N’ụbọchị Sabat, ha banyere n’ụlọ nzukọ ma nọdụ ala.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “Antiọk nke Pisidia.” Grik kwuru, “Antiọk dị na Pisidia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτοὶ δὲ
  choice: Ma ha
  rationale: δέ na-aga n’ihu n’akụkọ ahụ ma nwee obere ntụgharị; Igbo anaghị achọ ikwusi αὐτοί ike ebe a ma ọ bụrụ na a sịghị ‘ha onwe ha,’ nke ga-emebiga nkwusi ike ókè.
- source_word: διελθόντες ἀπὸ τῆς Πέργης
  choice: ha si Pega gafee
  rationale: N’akụkọ njem a, διέρχομαι na-egosi na ha gara n’ihu site na Pega; ‘si Pega gafee’ bụ Igbo ebumpụta ụwa nke na-egosi ịga n’ihu n’ụzọ.
- source_word: παρεγένοντο
  choice: rute
  rationale: παραγίνομαι n’okwu njem pụtara ịbịarute ebe; ‘rute’ kọwara nke a nkenke ma doo anya.
- source_word: Ἀντιόχειαν τὴν Πισιδίαν
  choice: Antiọk nke dị na Pisidia
  rationale: Nhọrọ a na-egosipụta kpọmkwem na ọ bụ Antiọk dị n’ógbè Pisidia, ma na-ezere ime ka njikọ ahụ pụta karịa otú Grik si kwuo ya.
- source_word: εἰσελθόντες εἰς τὴν συναγωγήν
  choice: ha banyere n’ụlọ nzukọ ndị Juu
  rationale: A gbanwere participle ahụ ka ọ bụrụ ngwaa zuru ezu maka Igbo dị mfe. ‘Ụlọ nzukọ ndị Juu’ na-eme ka συναγωγή doo ndị na-agụ akwụkwọ taa anya.
- source_word: τῇ ἡμέρᾳ τῶν σαββάτων
  choice: N’ụbọchị izu ike
  rationale: Ọ bụ akpaala okwu Grik maka ụbọchị izu ike ndị Juu; otu mkpụrụ okwu n’Igbo na-enye echiche oge ahụ n’ụzọ ebumpụta ụwa.
- source_word: ἐκάθισαν
  choice: nọdụ ala
  rationale: Nke a na-egosi omume dị mfe nke ịnọdụ ala, kwekọọkwa na aorist Grik.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo Izugbe dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji ‘ụlọ nzukọ ndị Juu’ kọwaa synagogue n’enweghị itinye nkọwa okpukpe nke otu ụka. Akara nkọwa ala peeji [a] dị n’ederede isi.
