id: ACT.13.7
reference: Acts 13:7
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὃς ἦν σὺν τῷ ἀνθυπάτῳ Σεργίῳ Παύλῳ, ἀνδρὶ συνετῷ. οὗτος προσκαλεσάμενος Βαρναβᾶν καὶ Σαῦλον ἐπεζήτησεν ἀκοῦσαι τὸν λόγον τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/007.yaml
  text: who was with the proconsul Sergius Paulus[a], an intelligent man[b]. This man summoned Barnabas and Saul and sought to hear the word of God.
translation:
  language: ig
  text: onye ya na prokọnsul ahụ, Sajịọs Pọlọs, nọ. Sajịọs Pọlọs bụ nwoke nwere nghọta[a]. Ọ kpọrọ Banabas na Sọl ka ha bịakwute ya, ọ chọkwara ịnụ okwu Chineke[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “nwoke nwere ọgụgụ isi” ma ọ bụ “nwoke nwere akọ.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ozi Chineke.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνθυπάτῳ
  choice: prokọnsul
  rationale: E ji aha ọkwa ọchịchị Rom kpọmkwem mee ihe kama iji okwu izugbe dịka “onye ọchịchị,” ka ụdị ọkwa ahụ pụta ìhè.
- source_word: σὺν
  choice: ya na ... nọ
  rationale: Nke a bụ ụzọ Igbo si ekwu n'ụzọ doro anya na onye ahụ nọnyere prokọnsul ahụ.
- source_word: ἀνδρὶ συνετῷ
  choice: nwoke nwere nghọta
  rationale: Nke a na-egosi ọgụgụ isi na ikike ịghọta ihe n'etinyeghị echiche na ọ bụ otuto banyere ezi omume ya.
- source_word: οὗτος
  choice: Sajịọs Pọlọs
  rationale: Ikwughachi aha ahụ na-eme ka onye οὗτος na-ezo aka na ya doo anya n'Igbo ma na-edebe nrụtụ aka siri ike nke okwu ngosi ahụ.
- source_word: προσκαλεσάμενος
  choice: Ọ kpọrọ ... ka ha bịakwute ya
  rationale: Nke a na-egosi na ọ kpọrọ ha ka ha bịa n'ebe ọ nọ, dịka ụdị etiti nke participle Grik si dị.
- source_word: ἐπεζήτησεν
  choice: na-achọsi ike
  rationale: Okwu a na-egosi ọchịchọ siri ike ma ọ bụ mbọ ịchọ ihe, ọ bụghị nanị ọchịchọ dị mfe.
- source_word: ἀκοῦσαι
  choice: ịnụ
  rationale: Nke a bụ ntụgharị kwụ ọtọ ma bụrụkwa okwu Igbo dabara adaba maka ịnara ozi a na-ekwusa.
- source_word: λόγον τοῦ θεοῦ
  choice: okwu Chineke
  rationale: Nke a na-edebe usoro okwu Grik na okwu Akwụkwọ Nsọ a maara nke ọma, ebe ọ ka nwere ike ịpụta ozi sitere n'aka Chineke.
- source_word: Σεργίῳ Παύλῳ
  choice: Sajịọs Pọlọs
  rationale: A sụgharịghị aha mmadụ; e dere ya n'ụdị ụda dabara n'Igbo.
- source_word: Βαρναβᾶν καὶ Σαῦλον
  choice: Banabas na Sọl
  rationale: A sụgharịghị aha ndị mmadụ; e dere ha n'ụdị a na-ejikarị eme ihe n'Igbo.
theological_decisions:
- issue: Otú e si sụgharịa λόγον τοῦ θεοῦ
  choice: okwu Chineke
  alternative: ozi Chineke
  rationale: “Okwu Chineke” na-agbasochi mkpụrụokwu Grik anya ma na-ahapụkwa obosara ihe λόγος nwere ike ịpụta n'ọnọdụ a; nkọwa ọzọ na-egosi na ihe a na-ekwu bụ ozi sitere n'aka Chineke.
- issue: Ihe συνετῷ pụtara n'ịkọwa Sajịọs Pọlọs
  choice: nwoke nwere nghọta
  alternative: nwoke nwere ọgụgụ isi; nwoke nwere akọ
  rationale: Nhọrọ a na-egosi nghọta ma ọ bụ ọgụgụ isi n'ebughị ụzọ kpebie na okwu ahụ na-ekwu banyere ịdị mma nke omume ya.
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe dị ugbu a, dị ùgwù ma dị mfe nghọta. E debere “prokọnsul” dịka aha ọkwa ọchịchị Rom kpọmkwem. E tinyere akara [a] n'akụkụ nkọwa συνετός, tinyekwa [b] n'akụkụ λόγον τοῦ θεοῦ, ka akara ndị ahụ kwekọọ n'ezie na nkọwa ala peeji.
