id: ACT.13.6
reference: Acts 13:6
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: διελθόντες δὲ ⸀ὅλην τὴν νῆσον ἄχρι Πάφου εὗρον ⸀ἄνδρα τινὰ μάγον ψευδοπροφήτην Ἰουδαῖον ᾧ ὄνομα ⸀Βαριησοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/006.yaml
  text: And after they had gone through the whole island as far as Paphos[a], they found a certain man, a magician, a false prophet, a Jew, whose name was Bar-Jesus.
translation:
  language: ig
  text: Mgbe ha gafesịrị agwaetiti ahụ dum ruo Pafọs, ha hụrụ otu nwoke, onye na-eme anwansi, onye amụma ụgha, onye Juu, aha ya bụ Bar-Jizọs.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ide Bar-Jizọs dịka Barjizọs. O yiri ka aha ahụ sitere n’asụsụ Semitic, ma nwee ike ịpụta “nwa Jizọs” ma ọ bụ “nwa Jọshụa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διελθόντες
  choice: Mgbe ha gafesịrị
  rationale: Aorist participle a na-egosi ihe mere tupu ngwaa bụ isi; ‘mgbe ha gafesịrị’ na-edobe usoro ahụ ma na-egosi na ha gara site n’otu akụkụ gaa n’ọzọ.
- source_word: δὲ
  choice: (egosighị ya iche)
  rationale: δέ bụ njikọ dị nro na-aga n’ihu n’akụkọ. N’Igbo, usoro ahịrịokwu ahụ n’onwe ya na-eme ka njikọ ahụ doo anya; itinye ‘ma’ nwere ike igosi ọdịiche siri ike nke Grik na-achọghị.
- source_word: ὅλην τὴν νῆσον
  choice: agwaetiti ahụ dum
  rationale: Nke a na-egosi na ha gafere agwaetiti ahụ n’ogologo ya; okwu a bụ nke doro anya ma bụrụ Igbo a na-asụ ugbu a.
- source_word: ἄχρι Πάφου
  choice: ruo Pafọs
  rationale: ἄχρι na-egosi ebe njem ahụ jedebere; ‘ruo’ bụ ụzọ Igbo ebumpụta ụwa si kwuo ya.
- source_word: εὗρον
  choice: ha hụrụ
  rationale: Nke a na-edobe ngwaa akụkọ dị mfe, n’etinyeghị echiche ọzọ dịka na ha zutere ya na mberede.
- source_word: ἄνδρα τινὰ
  choice: otu nwoke
  rationale: ‘Otu nwoke’ na-egosipụta indefiniteness na ntakịrị individuating force nke τινά n’ụzọ Igbo dị mfe ma kwe nghọta.
- source_word: μάγον
  choice: onye na-eme anwansi
  rationale: N’ebe a μάγος na-ezo aka n’onye na-arụ ọrụ anwansi. Nkebiokwu a doro ndị na-agụ Igbo anya karịa ntụgharị mkpụrụedemede ‘magọs,’ ma ọ naghị agbakwụnye nkọwa karịrị ihe odide ahụ.
- source_word: ψευδοπροφήτην
  choice: onye amụma ụgha
  rationale: Nke a na-edobe ma nkwupụta ịbụ onye amụma ma ikpe ederede ahụ na amụma ya bụ ụgha.
- source_word: Ἰουδαῖον
  choice: onye Juu
  rationale: N’ebe a okwu ahụ na-akọwa nwoke ahụ dịka onye Juu; ihe gbara ya gburugburu anaghị achọ ka a kọwaa ya naanị dịka onye si Judia.
- source_word: ᾧ ὄνομα Βαριησοῦ
  choice: Aha ya bụ Ba-Jizọs
  rationale: A tụgharịghị aha ahụ kama e dere ya dịka ụda ya si dị n’Igbo. Akara njikọ na-enyere onye na-agụ aka ịhụ akụkụ patronymic ‘Ba-’.
theological_decisions:
- issue: Otu e si dee aha Βαριησοῦ
  choice: Ba-Jizọs
  alternative: Bajizọs; nwa Jizọs/nwa Joshua
  rationale: E debere ya dịka aha mmadụ kama ịtụgharị ihe aha ahụ nwere ike ịpụta. Nke a na-echekwa ọrụ ya n’amaokwu ahụ ma ghara ikpebi ma akụkụ nke abụọ kwekọrọ na ‘Jizọs’ ka ọ bụ ‘Joshua.’
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. E haziri ọtụtụ nkọwa banyere nwoke ahụ n’usoro Igbo ebumpụta ụwa, ma e chekwara apposition nke Grik na-enweghị itinye nkọwa ụka pụrụ iche.
