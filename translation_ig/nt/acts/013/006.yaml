  rationale: The revision corrects the transliteration of Βαριησοῦ from Ba-Jizọs to Bar-Jizọs and corrects the corresponding footnote. It retains the source’s sequence of appositional descriptions, the antecedent action of the participle, and the source ambiguity concerning the name’s possible meaning.
