revisions:
- from: Mgbe Jọn nọ na-emecha ozi ya[a], ọ nọgidere na-asị, “Gịnị ka unu chere na m bụ? Ọ bụghị m bụ onye ahụ. Ma lee, otu onye na-abịa n’azụ m[b], onye m na-erughị eru ịtọpụ akpụkpọ ụkwụ dị n’ụkwụ ya.”
  to: Mgbe Jọn nọ na-emecha ije ya[a], ọ nọgidere na-asị, “Gịnị ka unu chere na m bụ? Ọ bụghị m bụ onye ahụ. Ma lee, otu onye na-abịa n’azụ m[b], onye m na-erughị eru ịtọpụ akpụkpọ ụkwụ dị n’ụkwụ ya.”
  rationale: The sole main-text revision replaces the interpretive ‘ozi ya’ with ‘ije ya,’ which preserves the Greek δρόμος metaphor while remaining natural in Standard Igbo. The identity denied remains unnamed, as in Greek, and the footnote about a sandal strap remains confined to the textual-variant note rather than being imported into the verse.
