id: ACT.13.25
reference: Acts 13:25
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὡς δὲ ἐπλήρου ⸀Ἰωάννης τὸν δρόμον, ἔλεγεν· ⸂Τί ἐμὲ⸃ ὑπονοεῖτε εἶναι; οὐκ εἰμὶ ἐγώ· ἀλλ’ ἰδοὺ ἔρχεται μετ’ ἐμὲ οὗ οὐκ εἰμὶ ἄξιος τὸ ὑπόδημα τῶν ποδῶν λῦσαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/025.yaml
  text: And as John was completing his course[a], he kept saying, ‘What do you suppose me to be? I am not he. But look, one is coming after me[b], the sandals of whose feet I am not worthy to untie.’
translation:
  language: ig
  text: Mgbe Jọn nọ na-emecha ije ya[a], ọ nọgidere na-asị, “Gịnị ka unu chere na m bụ? Ọ bụghị m bụ onye ahụ. Ma lee, otu onye na-abịa n’azụ m[b], onye m na-erughị eru ịtọpụ akpụkpọ ụkwụ dị n’ụkwụ ya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘Ije ya’ bụ okwu atụ maka ọrụ ma ọ bụ ozi e kenyere ya.
    reason: alternative_reading
  - marker: b
    text: Ụfọdụ ihe odide ochie na ụfọdụ nsụgharị kwuru ya kpọmkwem dịka “ịtọpụ eriri akpụkpọ ụkwụ ya,” ma ihe odide Grik e biri ebe a kwuru nanị “ịtọpụ akpụkpọ ụkwụ dị n’ụkwụ ya.”
    reason: textual_variant
lexical_decisions:
- source_word: ἐπλήρου ... τὸν δρόμον
  choice: nọ na-emecha ozi ya
  rationale: Nkebiokwu Grik a na-ekwu banyere imecha ụzọ ma ọ bụ ọrụ e kenyere mmadụ. ‘Ozi ya’ na-eme ka ihe a pụtara doo onye Igbo nke oge a anya n’enweghị itinye ihe karịrị ihe ọnọdụ ahụ na-egosi; ‘nọ na-emecha’ na-egosikwa imperfect.
- source_word: ἔλεγεν
  choice: ọ nọgidere na-asị
  rationale: Imperfect a nwere ike igosi okwu ọ na-ekwu ugboro ugboro ma ọ bụ na-aga n’ihu; nkebiokwu a na-egosipụta nke ahụ n’Igbo nkịtị.
- source_word: Τί ἐμὲ ὑπονοεῖτε εἶναι;
  choice: Gịnị ka unu chere na m bụ?
  rationale: ὑπονοεῖτε bụ iche ma ọ bụ were mmadụ dịka ihe ụfọdụ; ntụgharị a bụ Igbo ebumpụta ụwa ma na-edobe τί dịka ‘Gịnị.’
- source_word: οὐκ εἰμὶ ἐγώ
  choice: Ọ bụghị m bụ onye ahụ
  rationale: Grik hapụrụ onye a na-agọnahụ aha ya n’ekwughị ya kpọmkwem, ebe ἐγώ nwere nkwusi ike. Igbo a na-edobe ma nkwusi ike ahụ ma ihe e zoro ezo.
- source_word: ἀλλ’ ἰδοὺ
  choice: Ma lee
  rationale: ‘Lee’ bụ ụzọ dị ugbu a, dịkwa ùgwù, isi gosipụta akara okwu ἰδού nke na-adọta uche.
- source_word: ἔρχεται μετ’ ἐμὲ
  choice: otu onye na-abịa n’azụ m
  rationale: A gbakwụnyere ‘otu onye’ dịka isiokwu a ghọtara n’ọnọdụ ahụ; present ‘na-abịa’ na-edobe mmetụta nke ọbịbịa na-eru nso.
- source_word: οὗ ... τὸ ὑπόδημα τῶν ποδῶν λῦσαι
  choice: onye ... ịtọpụ akpụkpọ ụkwụ dị n’ụkwụ ya
  rationale: ‘Akpụkpọ ụkwụ’ bụ okwu Igbo nkịtị maka ὑπόδημα, ‘ịtọpụ’ dabara na λύω n’ọnọdụ a. E tinyeghị ‘eriri’ n’ahịrị bụ isi n’ihi na aha ahụ adịghị na SBLGNT.
- source_word: ἄξιος
  choice: ruru eru
  rationale: ‘Ruru eru’ na-egosipụta echiche nke ἄξιος banyere ịbụ onye kwesịrị ekwesị ma ọ bụ tozuru ime ihe.
theological_decisions:
- issue: Onye Jọn na-agọnahụ na ọ bụ ya na οὐκ εἰμὶ ἐγώ
  choice: Ọ bụghị m bụ onye ahụ
  alternative: Ọ bụghị m bụ Kraịst ahụ
  rationale: Ọnọdụ okwu ahụ na-atụ aka n’ebe Mesaya nọ, ma Grik akpọghị ya aha kpọmkwem. Ahịrị bụ isi na-edobe ihe ahụ e zoro ezo, ebe nkọwa ala peeji na-akọwa onye o yiri ka a na-ekwu maka ya.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe nghọta ma dị ùgwù. A zere okwu ochie na nkọwa ụka pụrụ iche; a hapụrụ njirimara onye Jọn na-agọnahụ ka ọ bụrụ nke e zoro ezo dịka ọ dị na Grik.
