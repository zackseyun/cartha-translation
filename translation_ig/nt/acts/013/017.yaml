  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ θεὸς τοῦ λαοῦ τούτου ⸀Ἰσραὴλ ἐξελέξατο τοὺς πατέρας ἡμῶν, καὶ τὸν λαὸν ὕψωσεν ἐν τῇ παροικίᾳ ἐν γῇ ⸀Αἰγύπτου, καὶ μετὰ βραχίονος ὑψηλοῦ ἐξήγαγεν αὐτοὺς ἐξ αὐτῆς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/017.yaml
  text: The God of this people Israel chose our fathers[a], and made the people great during their sojourn in the land of Egypt[d][c][b], and with an uplifted arm he led them out from it.
translation:
  language: ig
  text: Chineke nke ndị a, bụ Izrel, họpụtara ndị nna anyị[a], mee ka ndị ahụ dị ukwuu mgbe ha bi dị ka ndị ọbịa n’ala Ijipt[b], jirikwa ogwe aka e weliri elu[c] kpọpụta ha n’ebe ahụ[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “ndị nna ochie anyị.” N’asụsụ Grik, ọ bụ “ndị nna anyị.”
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụ, “buliri ndị ahụ elu” ma ọ bụ “mee ka ndị ahụ baa ụba.”
    reason: lexical_alternative
  - marker: c
    text: N’okwu nkịtị, “jiri ogwe aka dị elu”; nke a bụ akpaala okwu sitere n’akụkọ Ọpụpụ nke na-egosi nzọpụta Chineke ji ike mee.
    reason: cultural_note
  - marker: d
    text: A pụkwara ịsụ ya, “dupụta ha n’ebe ahụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ θεὸς τοῦ λαοῦ τούτου Ἰσραήλ
  choice: Chineke nke ndị Izrel a
  rationale: Ọ na-egosipụta Chineke dị ka Chineke nke ndị a, bụ́ Izrel, n’ụzọ Igbo na-ada nke ọma, ma na-edebe aha Izrel.
- source_word: ἐξελέξατο
  choice: họpụtara
  rationale: Nke a bụ okwu Igbo doro anya maka omume Chineke nke ịhọrọ; ọ dịghị mkpa ime ka ụda middle pụta iche.
- source_word: τοὺς πατέρας ἡμῶν
  choice: ndị nna nna anyị
  rationale: Ọ na-edebe ntụaka nwoke nke πατέρες ma na-ada n’Igbo dịka ndị nna ochie nke agbụrụ.
- source_word: ὕψωσεν
  choice: mee ka ndị ahụ dị ukwuu
  rationale: Ọ na-echekwa obosara nghọta nke nwere ike ịgụnye ịba ụba na ibuli ọnọdụ ha, n’ebughị ụzọ mechie ya n’otu naanị.
- source_word: ἐν τῇ παροικίᾳ ἐν γῇ Αἰγύπτου
  choice: mgbe ha bi dị ka ndị ọbịa n’ala Ijipt
  rationale: Ọ na-akọwa παροικία n’Igbo nkịtị dịka ibi n’ala ọzọ dị ka ndị ọbịa, ma na-edebe 'ala Ijipt.'
- source_word: μετὰ βραχίονος ὑψηλοῦ
  choice: jiri ogwe aka e weliri elu
  rationale: Ọ na-edebe ihe atụ nke Greek na ụda akụkọ Ọpụpụ, kama ịgbanwe ya ozugbo ka ọ bụrụ naanị 'ike.'
- source_word: ἐξήγαγεν αὐτοὺς ἐξ αὐτῆς
  choice: kpọpụta ha n’ebe ahụ
  rationale: ‘Kpọpụta’ na-egosipụta ime ka ha pụta; ‘n’ebe ahụ’ na-ezo aka n’Ijipt n’ụzọ Igbo sitere n’okike.
theological_decisions:
- issue: Ndị nna Izrel
  choice: ndị nna nna anyị
  alternative: ndị nna ochie anyị
  rationale: Nhọrọ ahụ na-edebe okwu nwoke nke Greek ma na-egosi ndị nna nke agbụrụ na akụkọ ọgbụgba ndụ.
- issue: Ihe ὕψωσεν pụtara n’Ijipt
  choice: mee ka ndị ahụ dị ukwuu
  alternative: buliri ndị ahụ elu; mee ka ndị ahụ baa ụba
  rationale: Greek nwere ike ịtụ aka n’ịba ụba ma ọ bụ n’ịkwalite ha. Nsụgharị a na-ahapụ obosara ahụ ka ọ dị.
- issue: Ogwe aka e weliri elu
  choice: jiri ogwe aka e weliri elu
  alternative: jiri ogwe aka dị ike
  rationale: A hapụrụ ihe atụ ahụ n’akwụkwọ nsọ ka ọ gosipụta nzọpụta Chineke nke ike, n’emeghị ka nkọwa ya dochie okwu ahụ.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị ùgwù ma dị mfe nghọta. E ji ‘ndị nna nna’ na ‘ogwe aka e weliri elu’ debe agba akụkọ Akwụkwọ Nsọ, ebe ‘bi dị ka ndị ọbịa’ na-eme ka echiche παροικία doo onye na-agụ taa anya.
