revisions:
- from: Chineke nke ndị Izrel a họpụtara ndị nna nna anyị[a], mee ka ndị ahụ dị ukwuu mgbe ha bi dị ka ndị ọbịa n’ala Ijipt[b], jirikwa ogwe aka e weliri elu[c] kpọpụta ha n’ebe ahụ[d].
  to: Chineke nke ndị a, bụ Izrel, họpụtara ndị nna anyị[a], mee ka ndị ahụ dị ukwuu mgbe ha bi dị ka ndị ọbịa n’ala Ijipt[b], jirikwa ogwe aka e weliri elu[c] kpọpụta ha n’ebe ahụ[d].
  rationale: The revision clarifies the apposition ‘this people, Israel’ in idiomatic Standard Igbo and replaces a potentially over-specific kinship expression with the direct equivalent of the Greek ‘our fathers.’ The remaining wording and all footnote anchors retain the draft’s source-faithful sense.
