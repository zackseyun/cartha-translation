revisions:
- from: Mgbe nzukọ ahụ e mere n’ụlọ nzukọ ndị Juu gbasasịrị[a], ọtụtụ n’ime ndị Juu na ndị ji nsọpụrụ na-efe Chineke, bụ́ ndị tọghatara n’okpukpe ndị Juu, sooro Pọl na Banabas. Pọl na Banabas wee na-agwa ha okwu, na-agba ha ume[b] ka ha nọgide n’amara Chineke.
  to: Mgbe nzukọ ahụ e mere n’ụlọ nzukọ ndị Juu gbasasịrị[a], ọtụtụ n’ime ndị Juu na ndị tọghatara n’okpukpe ndị Juu, ndị na-atụ egwu Chineke, sooro Pọl na Banabas. Pọl na Banabas wee na-agwa ha okwu, na-agba ha ume[b] ka ha nọgide n’amara Chineke.
