id: ACT.13.43
reference: Acts 13:43
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: λυθείσης δὲ τῆς συναγωγῆς ἠκολούθησαν πολλοὶ τῶν Ἰουδαίων καὶ τῶν σεβομένων προσηλύτων τῷ Παύλῳ καὶ τῷ Βαρναβᾷ, οἵτινες προσλαλοῦντες ⸀αὐτοῖς ἔπειθον· αὐτοὺς ⸀προσμένειν τῇ χάριτι τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/043.yaml
  text: After the synagogue had been dismissed[a], many of the Jews and devout proselytes followed Paul and Barnabas, who, speaking with them[c][b], were urging them to continue in the grace of God.
translation:
  language: ig
  text: Mgbe nzukọ ahụ e mere n’ụlọ nzukọ ndị Juu gbasasịrị[a], ọtụtụ n’ime ndị Juu na ndị tọghatara n’okpukpe ndị Juu, ndị na-atụ egwu Chineke, sooro Pọl na Banabas. Pọl na Banabas wee na-agwa ha okwu, na-agba ha ume[b] ka ha nọgide n’amara Chineke.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịtụgharị ya, “Mgbe a gbasasịrị ndị zukọrọ n’ụlọ nzukọ ndị Juu.” Okwu Gris a na-ekwu banyere njedebe nke nzukọ ahụ, ọ bụghị na a gbasara ụlọ ahụ.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịtụgharị ya, “na-eme ka ha kwenye ịnọgide n’amara Chineke.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λυθείσης ... τῆς συναγωγῆς
  choice: Mgbe nzukọ ahụ e mere n’ụlọ nzukọ ndị Juu gbasasịrị
  rationale: N’ebe a, συναγωγή na-ezo aka karịsịa ná nzukọ ndị mmadụ zukọrọ, ọ bụghị naanị ụlọ ahụ. “Gbasasịrị” na-egosipụta njedebe nke nzukọ ahụ n’Igbo dị mfe ma kwekwa ka e nwee nghọta nke na a hapụrụ ndị bịara nzukọ ahụ ka ha lawa.
- source_word: ἠκολούθησαν
  choice: sooro
  rationale: “Sooro” na-egosipụta na ha sochiri Pọl na Banabas mgbe nzukọ ahụ gasịrị, n’enweghị ịkpebi ma ọ bụ iso nanị n’ụzọ anụ ahụ ma ọ bụ ịmalite ịgbaso ozizi ha.
- source_word: τῶν σεβομένων προσηλύτων
  choice: ndị ji nsọpụrụ na-efe Chineke, bụ́ ndị tọghatara n’okpukpe ndị Juu
  rationale: προσήλυτοι bụ ndị batara n’okpukpe ndị Juu, ọ bụghị naanị ndị nwere mmasị na ya; σεβόμενοι na-egosipụta nsọpụrụ na ofufe ha. Nsụgharị a na-edobe akụkụ abụọ ahụ n’Igbo doro anya.
- source_word: προσλαλοῦντες αὐτοῖς
  choice: wee na-agwa ha okwu
  rationale: Na-egosipụta okwu Pọl na Banabas na-aga n’ihu ma na-echekwa mmekọrịta nke okwu ahụ na ndị sooro ha.
- source_word: ἔπειθον
  choice: na-agba ha ume
  rationale: Ụdị imperfect na-egosi omume na-aga n’ihu. N’ọnọdụ a, okwu ahụ bụ agbamume siri ike, ọ bụ ezie na πείθω nwekwara ike ịpụta ime ka mmadụ kwenye.
- source_word: αὐτοὺς προσμένειν
  choice: ka ha nọgide
  rationale: προσμένω na-egosi ịnọgide, ịrapara, ma ọ bụ ịga n’ihu n’ihe. “Nọgide” bụ okwu Igbo dị nkenke ma dabara n’ebe a.
- source_word: τῇ χάριτι τοῦ θεοῦ
  choice: n’amara Chineke
  rationale: Na-echekwa okwu Gris n’ụzọ na-adịghị akọwa “amara” naanị dị ka ihu ọma Chineke ma ọ bụ naanị dị ka ozi ọma banyere amara.
theological_decisions:
- issue: Ihe “ịnọgide n’amara Chineke” pụtara
  choice: E debere okwu ahụ dịka “ka ha nọgide n’amara Chineke.”
  alternative: “ka ha nọgide n’ihu ọma Chineke” ma ọ bụ “ka ha nọgide n’ozi banyere amara Chineke”
  rationale: τῇ χάριτι τοῦ θεοῦ nwere ike ịgụnye ma ọrụ ebere Chineke na ndụ nke amara ahụ na-achị. Ịhapụ ya n’ụdị sara mbara na-echekwa mgbagwoju anya na ịdị arọ nke okwu ahụ n’enweghị itinye nkọwa ozizi pụrụ iche.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A kpọpụtara “ụlọ nzukọ ndị Juu” iji zere ka “synagogue” bụrụ okwu mbịarambịa na-edoghị anya; a kọwakwara “proselytes” dịka ndị tọghatara n’okpukpe ndị Juu. Ikwughachi “Pọl na Banabas” n’ahịrịokwu nke abụọ na-ewepụ mgbagwoju anya nke nnọchiaha Igbo.
