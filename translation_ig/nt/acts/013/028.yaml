  text: καὶ μηδεμίαν αἰτίαν θανάτου εὑρόντες ᾐτήσαντο Πιλᾶτον ἀναιρεθῆναι αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/028.yaml
  text: And though they found no basis for a death sentence[b][a], they asked Pilate to have him executed.
translation:
  language: ig
  text: Ọ bụ ezie na ha ahụghị ihe ndabere ọ bụla iji maa ya ikpe ọnwụ[a], ha rịọrọ Paịlet ka e gbuo ya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ebubo ọ bụla kwesịrị ka a maa ya ikpe ọnwụ,” ma ọ bụ, “ihe ndabere iwu ọ bụla maka ikpe ọnwụ.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ka e tinye ya n’ọnwụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Ma
  rationale: 'N''ebe a, καί na-aga n''ihu n''akụkọ ahụ, ma “Ma” na-ejikọkwa amaokwu a nke ọma na esemokwu dị n''ahịrịokwu ahụ: ha ahụghị ihe ga-akwado ọnwụ, ma ha ka rịọrọ ka e gbuo ya.'
- source_word: μηδεμίαν αἰτίαν θανάτου
  choice: ihe ọ bụla ga-eme ka a maa ya ikpe ọnwụ
  rationale: N'ọnọdụ ikpe a, αἰτία pụtara ihe ndabere, ihe kpatara ya, ma ọ bụ ebubo nke ga-akwado ntaramahụhụ ọnwụ. Nsụgharị a na-ekwupụta echiche iwu ahụ n'Igbo dị mfe ma ghara ime ka a ghọta ya dị ka ihe kpatara mmadụ ji nwụọ.
- source_word: εὑρόντες
  choice: ọ bụ ezie na ha ahụghị
  rationale: 'Ọ bụ participle aorist nke mere tupu ngwaa bụ isi; n''ọnọdụ a, ọ nwekwara echiche nkwenye megidere ihe sochiri ya: n''agbanyeghị na ha ahụghị ihe ndabere ahụ, ha rịọrọ ka e gbuo ya.'
- source_word: ᾐτήσαντο
  choice: ha rịọrọ
  rationale: “Rịọrọ” bụ okwu Igbo kwesịrị ekwesị maka arịrịọ e nyere onye ọchịchị, ma ọ naghị etinye ike ọzọ na-adịghị na αἰτέω.
- source_word: Πιλᾶτον
  choice: Paịlet
  rationale: A sụgharịghị aha onye ahụ; e dere ya dịka usoro mkpọpụta aha a na-ejikarị n'Igbo.
- source_word: ἀναιρεθῆναι αὐτόν
  choice: ka e gbuo ya
  rationale: N'ọnọdụ ikpe a, ἀναιρέω pụtara iwepụ mmadụ site n'igbu ya, ya bụ, ime ka e nye ya ọnwụ. “Ka e gbuo ya” bụ Igbo doro anya ma dịkwa ebube, na-edobe passive infinitive nke Grik.
theological_decisions:
- issue: Ma a ga-eme ka echiche nkwenye megidere ihe sochiri ya pụta ìhè n'ịsụgharị participle εὑρόντες
  choice: ọ bụ ezie na ha ahụghị
  alternative: mgbe ha ahụghị / ebe ha ahụghị
  rationale: 'Ụdị Grik ahụ n''onwe ya bụ participle nke ọnọdụ ma ọ bụ oge, ma ihe gbara ya gburugburu na-egosi esemokwu doro anya: ha rịọrọ ka e gbuo ya n''agbanyeghị na ha ahụghị ihe ga-akwado ikpe ọnwụ. “Ọ bụ ezie” na-edobe esemokwu omume na akụkọ ahụ n''etinyeghị ozizi ọzọ.'
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe ma dịkwa ebube, dee ya. “Ihe ọ bụla ga-eme ka a maa ya ikpe ọnwụ” na-eme ka ọnọdụ iwu doo anya nye ndị na-agụ akwụkwọ nkịtị; “ka e gbuo ya” na-ezere okwu iwu siri ike ma na-edobe ihe Grik kwuru kpọmkwem.
