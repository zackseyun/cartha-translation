id: ACT.13.26
reference: Acts 13:26
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἄνδρες ἀδελφοί, υἱοὶ γένους Ἀβραὰμ καὶ οἱ ἐν ὑμῖν φοβούμενοι τὸν θεόν, ⸀ἡμῖν ὁ λόγος τῆς σωτηρίας ταύτης ⸀ἐξαπεστάλη.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/026.yaml
  text: Brothers[a], sons of the family of Abraham, and those among you who fear God[c][b], to us the message of this salvation has been sent.
translation:
  language: ig
  text: Ụmụnna[a], unu ụmụ nwoke nke agbụrụ Ebreham, na ndị nọ n’etiti unu na-atụ Chineke egwu[b], e zitere anyị ozi nzọpụta a[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “Ndị ikom, ụmụnna.” Okwu Grik ahụ kpọmkwem nwere ọdịdị nwoke, ma oku a nwere ike ịgụnye ndị ọzọ niile gbakọrọ n'ebe ahụ.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịghọta nke a dịka “ndị na-atụ egwu Chineke nọ n’etiti unu,” ikekwe ndị mba ọzọ na-efe Chineke Izrel ma na-esonyere ndị Juu n’ụlọ nzukọ.
    reason: cultural_note
  - marker: c
    text: A pụkwara ịsị, “okwu nke nzọpụta a.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄνδρες ἀδελφοί
  choice: Ụmụnna m
  rationale: Nke a bụ ụzọ Igbo dị ire na nke nkwanye ùgwù si akpọ ndị a na-agwa okwu dịka ụmụnna. Ọ naghị ada ka ntụgharị okwu n’otu n’otu, ma ndetu ala peeji na-egosi na okwu Grik ahụ kpọmkwem bụ nke nwoke.
- source_word: υἱοὶ γένους Ἀβραὰμ
  choice: unu ụmụ ndị ikom si n'agbụrụ Ebreham pụta
  rationale: “Ụmụ ndị ikom” na-echekwa ọdịdị nwoke nke υἱοί, ebe “agbụrụ” na-egosipụta usoro ọmụmụ na otu ndị mmadụ nke γένος.
- source_word: οἱ ἐν ὑμῖν φοβούμενοι τὸν θεόν
  choice: ndị nọ n'etiti unu na-atụ egwu Chineke
  rationale: A tụgharịrị ya dịka nkọwa doro anya kama ime ya aha otu pụrụ iche; nke a na-ahapụ ohere ma maka egwu nsọpụrụ Chineke ma maka ọnọdụ akụkọ ihe mere eme nke ndị mba ọzọ na-eso ofufe n'ụlọ nzukọ.
- source_word: ἡμῖν
  choice: ọ bụ anyị ka
  rationale: 'Usoro a na-emesi onye natara ihe e zitere ike ma na-echekwa ntụziaka nke dative Grik: e zitere ya ‘nye anyị.’'
- source_word: ὁ λόγος
  choice: ozi
  rationale: N'ọnọdụ nkwusa a, “ozi” na-enye echiche λόγος n'Igbo nke oge a n'ụzọ doro anya karịa “okwu,” ma ndetu ala peeji na-echekwa nhọrọ ahụ kpọmkwem.
- source_word: τῆς σωτηρίας ταύτης
  choice: nke nzọpụta a
  rationale: Nke a na-echekwa njikọ genitive dị n'etiti ozi ahụ na nzọpụta a, n'emeghị ka o doo anya karịa Grik ma ọ bụ naanị ọdịnaya ozi ka ọ bụ ozi na-eweta nzọpụta.
- source_word: ἐξαπεστάλη
  choice: e ziteere
  rationale: Ụdị a bụ passive zuru oke n'echiche n'Igbo, ma na-egosi na e zigara ozi ahụ nye ndị a kpọrọ aha n'enweghị ịkpọ onye zitere ya aha.
theological_decisions:
- issue: Njirimara ndị a kpọrọ οἱ ... φοβούμενοι τὸν θεόν
  choice: ndị nọ n'etiti unu na-atụ egwu Chineke
  alternative: ndị na-atụ egwu Chineke nọ n'etiti unu dịka aha otu ndị mba ọzọ na-eso ofufe ndị Juu
  rationale: Nkọwa nkịtị ahụ na-echekwa ihe okwu Grik kwuru ma ghara ịmanye onye na-agụ ya ka ọ were ya naanị dịka aha teknụzụ nke otu akụkọ ihe mere eme.
- issue: Asụsụ nwoke dị na Ἄνδρες ἀδελφοί na υἱοί
  choice: Jiri “Ụmụnna m” n'okwu mbido, ma chekwaa “ụmụ ndị ikom” n'ahịrị agbụrụ Ebreham.
  alternative: Ndị ikom, ụmụnna m; ma ọ bụ ụmụ Ebreham niile
  rationale: Nke a na-eme ka okwu ahụ bụrụ Igbo ebumpụta ụwa ma ghara ihichapụ ọdịdị nwoke nke υἱοί. Ndetu na-akọwa na oku mbụ nwere ụdị nwoke n'asụsụ Grik ma o nwere ike ịgụnye ọgbakọ sara mbara.
- issue: Njikọ λόγος na σωτηρία
  choice: ozi nke nzọpụta a
  alternative: okwu nke nzọpụta a; ozi banyere nzọpụta a
  rationale: “Nke” na-ahapụ njikọ ahụ ka ọ dị obosara dịka genitive Grik si dị, n'emeghị ka ọ bụrụ naanị ozi ‘banyere’ nzọpụta.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu “ọ bụ anyị ka” na-enye ἡμῖν ike o nwere n'usoro Grik. E dere aha Ἀβραάμ dịka “Ebreham,” nke bụ ụdị a maara nke ọma n'Igbo Akwụkwọ Nsọ.
