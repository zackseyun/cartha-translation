    text: A pụkwara ịsị, “Ndị ikom, ụmụnna.” Okwu Grik ahụ kpọmkwem nwere ọdịdị nwoke, ma oku a nwere ike ịgụnye ndị ọzọ niile gbakọrọ n'ebe ahụ.
