id: ACT.13.4
reference: Acts 13:4
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸀Αὐτοὶ μὲν οὖν ἐκπεμφθέντες ὑπὸ τοῦ ⸂ἁγίου πνεύματος⸃ κατῆλθον ⸀εἰς Σελεύκειαν, ἐκεῖθέν ⸀τε ἀπέπλευσαν ⸁εἰς Κύπρον,
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/004.yaml
  text: So they[a], having been sent out by the Holy Spirit, went down to Seleucia, and from there sailed away to Cyprus.
translation:
  language: ig
  text: Ya mere, ebe Mmụọ Nsọ[a] zipụrụ ha, ha gbadara Seleukia; sitekwa n’ebe ahụ, ha jiri ụgbọ mmiri pụọ gaa Saịprọs.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “mmụọ nsọ.” N’asụsụ Grik, nkebiokwu ahụ bụ “mmụọ nsọ”; ma n’Ọrụ Ndịozi, ọ na-arụtụ aka n’onye na-arụ ọrụ n’aha Chineke, nke a na-akpọkarị “Mmụọ Nsọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Αὐτοὶ μὲν οὖν
  choice: Ya mere, ... ha
  rationale: “Ya mere” na-egosi nzọụkwụ akụkọ na ihe si n’ọrụ inyefe ha ozi tupu nke a pụta; “ha” na-anọchi nnọchiaha doro anya Αὐτοὶ n'ụzọ Igbo na-asụkarị.
- source_word: ἐκπεμφθέντες
  choice: ebe ... zipụrụ ha
  rationale: Nkebiokwu a na-edebe omume izipu ahụ dị ka ihe mere tupu ha agbadaa, ma na-egosikwa na ọ bụ onye ọzọ zipụrụ ha.
- source_word: ὑπὸ τοῦ ἁγίου πνεύματος
  choice: Mmụọ Nsọ
  rationale: ὑπό tinyere genitive na-egosi onye mere omume ahụ. “Mmụọ Nsọ” bụ aha Igbo a na-ejikarị akọwa onye ọrụ Chineke a n’Ọrụ Ndịozi.
- source_word: κατῆλθον
  choice: ha gbadara
  rationale: “Gbadara” na-echekwa echiche mmegharị ịrịdata, ikekwe site n’ime ala ruo n’ụsọ mmiri.
- source_word: εἰς Σελεύκειαν
  choice: Seleukia
  rationale: A sụgharịghị aha obodo ahụ kama e dere ya ka ụda Grik ya si dị n’usoro mkpụrụedemede Igbo.
- source_word: ἐκεῖθέν τε
  choice: sitekwa n’ebe ahụ
  rationale: Nkebiokwu a na-egosi ebe ha si pụọ ma jikọta njem mmiri ahụ na ihe gara aga.
- source_word: ἀπέπλευσαν
  choice: ha ji ụgbọ mmiri gawa
  rationale: Nke a na-egosi ma njem n’oké osimiri ma ịpụ ebe ahụ, n’Igbo eke karịa nsụgharị mkpụrụokwu n’otu n’otu.
- source_word: εἰς Κύπρον
  choice: gawa Saịprọs
  rationale: “Gawa” na-egosi ebe njem ahụ na-aga; “Saịprọs” bụ ntụgharị mkpụrụedemede aha agwaetiti Κύπρος dabara n’ụda Igbo.
theological_decisions:
- issue: Nsụgharị ἁγίου πνεύματος
  choice: Mmụọ Nsọ
  alternative: mmụọ nsọ
  rationale: N’Ọrụ Ndịozi, nkebiokwu a na-arụtụ aka n’ọrụ onye nwere ikike nke izipu ndị ozi. E dere ya dị ka aha pụrụ iche, ma ihe odide ahụ n’onwe ya ka na-egosi ọrụ ya site n’okwu “zipụrụ.”
translation_notes:
  register: Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E ji “ebe ... zipụrụ ha” mee ka participle Grik bụrụ nke eke n’Igbo, ma debe usoro oge na onye mere omume ahụ. E tinyere akara ntụaka [a] ozugbo e kwuchara ahịrịokwu metụtara ya.
