id: ACT.13.12
reference: Acts 13:12
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τότε ἰδὼν ὁ ἀνθύπατος τὸ γεγονὸς ἐπίστευσεν ἐκπλησσόμενος ἐπὶ τῇ διδαχῇ τοῦ κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/012.yaml
  text: Then[a], when the proconsul saw what had happened, he believed[b], being astonished at the teaching of the Lord.
translation:
  language: ig
  text: Mgbe ahụ, mgbe prokọnsul ahụ hụrụ ihe merenụ[a], o kweere n’ihi na ozizi nke Onyenwe anyị[b] juru ya anya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “ihe ahụ mere.”
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsị, “ozizi Onyenwe anyị” ma ọ bụ “ozizi banyere Onyenwe anyị.” Njikọ okwu Grik a nwere ike ịpụta ihe karịrị otu ụzọ.
    reason: alternative_reading
lexical_decisions:
- source_word: τότε
  choice: Mgbe ahụ
  rationale: Ọ na-egosi na ihe a mere n’usoro ozugbo ihe ndị a kọrọ tupu ya gasịrị.
- source_word: ἰδὼν
  choice: mgbe ... hụrụ
  rationale: E ji nkebiokwu oge kpọpụta participle a n’Igbo n’ụzọ doro anya ma dịkwa ụtọ n’ọnụ.
- source_word: ὁ ἀνθύπατος
  choice: prokọnsul ahụ
  rationale: A hapụrụ aha ọkwa ọchịchị Rom a kpọmkwem kama iji aha izugbe dịka ‘onye ọchịchị,’ ka izi ezi nke akụkọ ihe mere eme ghara ifu.
- source_word: τὸ γεγονός
  choice: ihe merenụ
  rationale: Nke a na-egosi ihe ahụ mezuru eme nke ọ hụrụ, n’ụzọ Igbo na-adị mfe nghọta.
- source_word: ἐπίστευσεν
  choice: o kweere
  rationale: E tinyeghị ihe ọ kweere na ya, n’ihi na Grik ekwughị ya kpọmkwem; ihe gbara amaokwu ahụ gburugburu na-enye aka ịghọta ya.
- source_word: ἐκπλησσόμενος
  choice: juru ya anya
  rationale: Okwu a na-egosi na ozizi ahụ mere ka o nwee nnukwu ihe ijuanya, dịka ọnọdụ so okwukwe ya.
- source_word: ἐπὶ τῇ διδαχῇ
  choice: ozizi ... juru ya anya
  rationale: Usoro a bụ Igbo nkịtị nke na-egosi ihe kpatara ma ọ bụ ihe mere o ji ju ya anya, n’etinyeghị nkọwa karịrị isi Grik.
- source_word: τοῦ κυρίου
  choice: nke Onyenwe anyị
  rationale: Ụdị ‘nke’ na-edebe obosara njikọ genitive ahụ, ma ọ bụ ozizi sitere n’aka Onyenwe anyị, nke ya, ma ọ bụ nke gbasara ya.
theological_decisions:
- issue: Ihe ἐπίστευσεν pụtara mgbe a kpọghị ihe e kweere na ya
  choice: o kweere
  alternative: o kweere na Onyenwe anyị; o kweere ozi ahụ
  rationale: Ọ bụ ezie na ihe gbara amaokwu ahụ gburugburu na-egosi okwukwe Ndị Kraịst, Grik ahapụghị ihe e kweere na ya n’ihu ọha; nsụgharị ahụ anaghị atụkwasị ihe ederede na-ekwughị.
- issue: Ụzọ e si aghọta τοῦ κυρίου n’ahịrịokwu ‘ozizi nke Onyenwe anyị’
  choice: ozizi nke Onyenwe anyị
  alternative: ozizi sitere n’aka Onyenwe anyị; ozizi banyere Onyenwe anyị
  rationale: Genitive Grik nwere ike igosi onye nwe ozizi ahụ, onye sitere n’aka ya, ma ọ bụ onye ozizi ahụ gbasara. A hapụrụ njikọ ahụ ka ọ ghara ịmanye naanị otu nkọwa.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E debere ‘prokọnsul’ dịka aha ọkwa ọchịchị Rom kpọmkwem. Usoro ‘ozizi nke Onyenwe anyị’ na-edebe mgbagwoju anya dị n’ụdị genitive Grik.
