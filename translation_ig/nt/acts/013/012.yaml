  to: Mgbe ahụ, mgbe prokọnsul ahụ hụrụ ihe merenụ[a], o kweere n’ihi na ozizi nke Onyenwe anyị[b] juru ya anya.
  rationale: The revision retains all of the draft’s faithful lexical choices while making the proconsul explicitly the experiencer of the astonishment, as required by the Greek participle. The genitive ambiguity in “ozizi nke Onyenwe anyị” and the unstated object of “o kweere” remain preserved. Footnote anchors and content remain valid.
  reviewer_model: gpt-5.6-terra
