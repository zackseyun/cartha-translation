id: ACT.13.33
reference: Acts 13:33
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὅτι ταύτην ὁ θεὸς ἐκπεπλήρωκεν τοῖς τέκνοις ⸀ἡμῶν ἀναστήσας Ἰησοῦν, ὡς καὶ ἐν τῷ ⸂ψαλμῷ γέγραπται τῷ δευτέρῳ⸃· Υἱός μου εἶ σύ, ἐγὼ σήμερον γεγέννηκά σε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/033.yaml
  text: 'that God has fulfilled this for our children by raising up Jesus[a], as it is also written in the second Psalm: ‘You are my Son[b]; today I have begotten you.’'
translation:
  language: ig
  text: 'na Chineke emezuwo nke a nye ụmụ anyị[a] site n’ịkpọlite Jizọs[b], dị ka e dekwara n’Abụ Ọma nke abụọ, sị:


    “Ị bụ Nwa m;

    taa ka m mụrụ gị.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “nye anyị, bụ́ ụmụ ha.” Ụfọdụ ihe odide nwere “nye ụmụ anyị,” ebe ndị ọzọ na-akwado “nye anyị, bụ́ ụmụ ha.”
    reason: textual_variant
  - marker: b
    text: Ma ọ bụ, “site n’ịkpọlite Jizọs n’ọnwụ.” Okwu Grik ahụ nwekwara ike ịpụta ịkpọlite ma ọ bụ ịkpọpụta mmadụ ka ọ pụta ìhè rụọ ọrụ.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκπεπλήρωκεν
  choice: emezuwo
  rationale: Ọ na-egosi na Chineke emezuola ihe o kwere ná nkwa, nakwa na mmezu ahụ ka dị mkpa ugbu a; nke a dabara n’ike nke perfect tense Grik.
- source_word: ταύτην
  choice: nke a
  rationale: A hapụrụ nnọchiaha ahụ dịka ọ dị na Grik; ọ na-ezo aka ná nkwa a kpọrọ aha n’amaokwu bu ụzọ, n’etinyeghị aha ọzọ n’amaokwu a.
- source_word: τοῖς τέκνοις ἡμῶν
  choice: nye ụmụ anyị
  rationale: Nke a na-esochi ederede SBLGNT e nyere. ‘Ụmụ’ nwekwara ike ịpụta ụmụ ụmụ ma ọ bụ ndị si n’ọgbọ mmadụ pụta; ọdịiche ederede ka akọwara n’ala ala peeji.
- source_word: ἀναστήσας Ἰησοῦν
  choice: site n’ịkpọlite Jizọs
  rationale: ‘Ịkpọlite’ na Igbo nwere ike ịpụta ime ka onye bilie, ma ọ bụ ịkpọpụta onye ka ọ rụọ ọrụ pụrụ iche; ya mere ọ naghị ekpebi ozugbo ma okwu a bụ naanị banyere mbilite n’ọnwụ ka ọ bụ banyere Chineke ịkpọpụta Jizọs.
- source_word: γέγραπται
  choice: e dekwara
  rationale: Nke a bụ ụzọ Igbo dị mfe ma dị ugwu isi webata ihe e dere n’Akwụkwọ Nsọ; ‘kwara’ na-egosipụta καί dị n’ederede Grik.
- source_word: ψαλμῷ ... τῷ δευτέρῳ
  choice: n’Abụ Ọma nke abụọ
  rationale: Ọ na-esochi usoro okwu Grik ma bụrụkwa okwu doro anya nye onye Igbo nke oge a.
- source_word: Υἱός μου εἶ σύ
  choice: Ị bụ Ọkpara m
  rationale: ‘Ọkpara’ bụ okwu Igbo a na-ejikarị akọwa Kraịst dịka Ọkpara Chineke, ma usoro ahịrịokwu a na-edobe nkwupụta ahụ kpọmkwem.
- source_word: σήμερον γεγέννηκά σε
  choice: taa ka m mụrụ gị
  rationale: ‘Mụrụ gị’ bụ ntụgharị kpọmkwem ma kwe nghọta nke γεννάω; nhazi ‘taa ka’ na-enye ‘taa’ ibu okwu o nwere na Grik n’enweghị nkọwa ozizi agbakwunyere.
theological_decisions:
- issue: Ihe ἀναστήσας Ἰησοῦν pụtara n’ebe a
  choice: A sụgharịrị ya ‘ịkpọlite Jizọs’ ka e chekwaa ohere abụọ dị n’okwu ahụ.
  alternative: ‘ịkpọlite Jizọs n’ọnwụ’ ma ọ bụ ‘ịkpọpụta/họpụta Jizọs’
  rationale: Amaokwu ndị gbara ya gburugburu na-ekwu maka mbilite n’ọnwụ, ma Akwụkwọ Ọrụ Ndị Ozi na-ejikwa ἀνίστημι maka Chineke ịkpọpụta onye ndu ma ọ bụ onye nzọpụta. Ya mere, e zere imechi ajụjụ ahụ n’isi ederede.
- issue: Ike okwu Kraịst dị na ‘taa ka m mụrụ gị’
  choice: E debere okwu Abụ Ọma 2:7 kpọmkwem n’enweghị nkọwa ozizi agbakwunyere.
  alternative: Ịkọwa ya n’ime amaokwu dịka nchịkwasa eze, nnabata dịka nwa, ma ọ bụ nkwado site na mbilite n’ọnwụ.
  rationale: Ntụgharị ekwesịghị ikpebi arụmụka banyere otú ‘taa’ na ‘mụrụ gị’ si metụta Kraịst; ọ ga-ahapụ okwu e hotara ka ọ kwuo ihe o kwuru.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. E debere usoro nkwupụta nke Akwụkwọ Nsọ n’enweghị okwu ụka pụrụ iche agbakwunyere. Akara nkọwa ala ala peeji [a] na [b] dị n’ebe okwu ha na-akọwa nọ kpọmkwem.
