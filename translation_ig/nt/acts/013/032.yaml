base_translation:
  language: en
  yaml_path: translation/nt/acts/013/032.yaml
  text: And we ourselves proclaim to you the good news of the promise made to the fathers,[a]
translation:
  language: ig
  text: Anyị onwe anyị na-ekwusara unu ozi ọma banyere nkwa ahụ e kwere ndị nna nna,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị nna ochie.” Grik kwuru “ndị nna”; nke a na-ezo aka ná ndị nna nna Izrel n’akụkọ ọgbụgba ndụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: na-
  rationale: E jikọtara ya na ngwaa dị ka “na-ekwusara” n’usoro Igbo ebumpụta ụwa; njikọ a na-aga n’ihu n’echiche sitere n’okwu bu ụzọ.
- source_word: ἡμεῖς
  choice: anyị onwe anyị
  rationale: Nnọchiaha Greek ahụ pụtara ìhè, ya mere o nwere nkwusi ike; “anyị onwe anyị” na-echekwa nkwusi ike ahụ n’Igbo.
- source_word: ὑμᾶς
  choice: unu
  rationale: N’usoro “na-ekwusara unu,” ọ bụ ndị a na-agwa ozi ahụ.
- source_word: εὐαγγελιζόμεθα
  choice: na-ekwusara ... ozi ọma
  rationale: Nke a na-egosipụta omume ikwusa ma ọ bụ iweta ozi ọma n’asụsụ Igbo doro anya, na-enweghị ịdabere n’okwu ụka pụrụ iche.
- source_word: τὴν ... ἐπαγγελίαν
  choice: banyere nkwa ahụ
  rationale: “Nkwa ahụ” na-ezo aka ná nkwa Chineke a maara n’ọnọdụ okwu a; “banyere” na-eme ka mmekọrịta ya na ozi ọma doo anya n’Igbo.
- source_word: πρὸς τοὺς πατέρας
  choice: ndị nna nna anyị
  rationale: “Ndị nna nna” na-echekwa okwu ezinụlọ nwoke na echiche ndị nna ochie Izrel. Agbakwunyere “anyị” dịka ụzọ Igbo ebumpụta ụwa isi kọwaa njikọ agbụrụ nke ọnọdụ ahụ, ọ bụ ezie na nnọchiaha nwe adịghị kpọmkwem na Greek.
- source_word: γενομένην
  choice: e kwere
  rationale: N’Igbo, a na-asịkarị “ikwe nkwa”; nke a na-egosipụta nkwa e mere, ọ naghị ebu ụzọ tinye echiche mmezu nke amaokwu na-esote.
theological_decisions:
- issue: Ntụgharị πατέρες
  choice: ndị nna nna anyị
  alternative: ndị nna ochie
  rationale: “Ndị nna nna” na-echekwa ụdị okwu nwoke nke Greek na njikọ ọgbụgba ndụ ya na ndị nna ochie Izrel. “Ndị nna ochie” ga-adị sara mbara karị ma belata ihe oyiyi ezinụlọ dị n’isiokwu ahụ.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị ugbu a ma dị nsọ n’ụzọ kwesịrị ekwesị. Ahịrịokwu ahụ na-eji usoro Igbo ebumpụta ụwa ma na-echekwa nkwusi ike dị na ἡμεῖς na ihe πατέρες pụtara n’akụkọ ọgbụgba ndụ.
