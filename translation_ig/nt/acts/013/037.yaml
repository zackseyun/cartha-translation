id: ACT.13.37
reference: Acts 13:37
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὃν δὲ ὁ θεὸς ἤγειρεν οὐκ εἶδεν διαφθοράν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/037.yaml
  text: But the one whom God raised up did not see decay[a].
translation:
  language: ig
  text: Ma onye ahụ Chineke mere ka o si n’ọnwụ bilie ahụghị ire ure[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “ahụghị mmebi.” Okwu Grik ahụ nwere ike ịpụta ire ure ma ọ bụ mmebi ahụ́; “mmebi” na-echekwakwu usoro okwu e kwughachiri site n’Abụ Ọma 16:10 n’Akwụkwọ Nsọ Grik.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃν
  choice: onye ahụ ...
  rationale: Nnọchiaha njikọ a na-arụtụ aka n’onye a na-ekwu maka ya, ya bụ Jizọs; ‘onye ahụ’ na-eme ka ntụaka ahụ doo anya n’Igbo nkịtị.
- source_word: δὲ
  choice: Ma
  rationale: Ọ na-egosi ọdịiche dị n’etiti Devid, onye hụrụ ire ure, na onye Chineke mere ka o si n’ọnwụ bilie.
- source_word: ὁ θεὸς
  choice: Chineke
  rationale: Nke a bụ ụzọ Igbo zuru oke si akpọ θεός mgbe ọ bụ isiokwu nke ahịrịokwu.
- source_word: ἤγειρεν
  choice: mere ka o si n’ọnwụ bilie
  rationale: N’ebe a, ihe gbara okwu ahụ gburugburu na-egosi mbilite n’ọnwụ, ọ bụghị nanị ịhọpụta mmadụ ma ọ bụ ime ka ọ pụta ìhè.
- source_word: οὐκ εἶδεν
  choice: ahụghị
  rationale: Nke a na-edobe akpaalaokwu Grik ‘ịhụ’ ma na-echekwa njikọ ya na Abụ Ọma 16 n’asụsụ Grik.
- source_word: διαφθοράν
  choice: ire ure
  rationale: ‘Ire ure’ bụ okwu Igbo doro anya maka mmebi ahụ́ onye nwụrụ anwụ, ma dabara n’arụmụka nke amaokwu ndị gbara ya gburugburu.
theological_decisions:
- issue: Ihe ἤγειρεν pụtara n’ebe a
  choice: Chineke mere ka Jizọs si n’ọnwụ bilie
  alternative: Chineke mere ka ọ pụta ma ọ bụ họpụta ya
  rationale: N’ọnọdụ a, a na-atụnyere Devid, onye nwụrụ ma hụ ire ure, na Jizọs, onye Chineke mere ka o bilie ma ghara ịhụ ire ure; ya mere ihe a na-ekwu bụ mbilite n’ọnwụ.
- issue: Akpaalaokwu ‘ịhụ ire ure’
  choice: E debere ‘ahụghị ire ure’
  alternative: ahụ́ ya ereghị ure / ọ gabigaghị mmebi ahụ́
  rationale: Ụdị a na-echekwa mgbagwoju okwu na ụda nke amaokwu e hotara n’Abụ Ọma 16, n’agbanyeghị na ihe ọ pụtara n’ọnọdụ a bụ mmebi ahụ́ n’ili.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. ‘Si n’ọnwụ bilie’ na-eme ka ọnọdụ mbilite n’ọnwụ doo anya, ebe ‘ahụghị ire ure’ na-edobe akpaalaokwu na njikọ ya na Abụ Ọma.
