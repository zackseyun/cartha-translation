id: ACT.13.5
reference: Acts 13:5
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ γενόμενοι ἐν Σαλαμῖνι κατήγγελλον τὸν λόγον τοῦ θεοῦ ἐν ταῖς συναγωγαῖς τῶν Ἰουδαίων· εἶχον δὲ καὶ Ἰωάννην ὑπηρέτην.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/005.yaml
  text: And when they arrived at Salamis[a], they proclaimed the word of God in the synagogues of the Jews[b]; and they also had John as an assistant.
translation:
  language: ig
  text: Mgbe ha rutere Salamis[a], ha kwusara okwu Chineke n’ụlọ nzukọ ndị Juu; ha nwekwara Jọn dịka onye enyemaka[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Mgbe ha bịara na Salamis.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “dịka onye na-enyere ha aka” ma ọ bụ “dịka onye na-ejere ha ozi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: γενόμενοι ἐν Σαλαμῖνι
  choice: Mgbe ha rutere Salamis
  rationale: N’ọnọdụ a, γενόμενοι ya na nkọwa ebe ἐν Σαλαμῖνι na-egosi iru ma ọ bụ ịbata n’otu ebe. Nsụgharị a na-egosipụta echiche oge nke participle ahụ n’Igbo doro anya.
- source_word: Σαλαμῖνι
  choice: Salamis
  rationale: E debere aha ebe ahụ n’ụdị transliteration a na-amata nke ọma.
- source_word: κατήγγελλον
  choice: ha kwusara
  rationale: καταγγέλλω pụtara ikwupụta ozi n’ihu ọha. ‘Kwusara’ na-egosipụta nke a n’enweghị ime ka ọ bụrụ naanị ikwusa okwuchukwu.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: okwu Chineke
  rationale: Nke a na-edebe njikọ nke λόγος na θεός ma na-ahapụ ‘okwu’ ka ọ gụnye ozi na mkpughe Chineke n’enweghị ịkọwa ya gabiga ihe odide ahụ kwuru.
- source_word: ἐν ταῖς συναγωγαῖς τῶν Ἰουδαίων
  choice: n’ụlọ nzukọ ndị Juu
  rationale: ‘Ụlọ nzukọ ndị Juu’ bụ okwu Igbo doro anya maka synagogue n’ọnọdụ a, ebe Ἰουδαίων na-ezo aka n’òtù ndị Juu nke okpukpe na agbụrụ, ọ bụghị naanị ndị si Judia.
- source_word: εἶχον δὲ καὶ
  choice: ha nwekwara
  rationale: ‘Nwekwara’ na-egosipụta ma mgbanwe dị nro nke δέ ma echiche mgbakwunye nke καί n’ụzọ dị nkenke ma bụrụkwa Igbo nkịtị.
- source_word: Ἰωάννην
  choice: Jọn
  rationale: Nke a bụ ụdị aha Ἰωάννης a na-ejikarị eme ihe n’Igbo.
- source_word: ὑπηρέτην
  choice: dịka onye enyemaka
  rationale: N’ebe a ὑπηρέτης bụ onye na-enyere ndị ọzọ aka n’ọrụ ma ọ bụ na-ejere ha ozi. ‘Onye enyemaka’ dabara n’ọnọdụ njem ozi a ma zere ịtụgharị ya ka ọ bụrụ ohu.
theological_decisions: []
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta, mee nsụgharị ahụ. E tinyere akara [b] n’akụkụ ‘onye enyemaka,’ ebe ọ bụ okwu ὑπηρέτην ka nkọwa ụkwụ ahụ metụtara.
