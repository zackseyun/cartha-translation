  source_fidelity: 'Nsụgharị ahụ na-anọchi anya Greek nke ọma: ‘Mgbe ha rutere Salamis’ na-ewepụta participle γενόμενοι n’ọrụ oge; ‘ha kwusara’ dabara na κατήγγελλον; ‘okwu Chineke,’ ‘n’ụlọ nzukọ ndị Juu,’ na ‘Jọn dịka onye enyemaka’ na-edobe ihe akụkụ ndị fọdụrụ pụtara. ‘Ha nwekwara’ na-ejigide mgbakwunye dị n’εἶχον δὲ καὶ.'
  naturalness: Igbo ahụ bụ Igbo Izugbe doro anya, na-agụ nke ọma, ma na-enwe ụda kwesịrị ekwesị maka akụkọ Akwụkwọ Nsọ. ‘Ụlọ nzukọ ndị Juu’ na ‘onye enyemaka’ bụ nhọrọ a na-aghọta n’enweghị ịgbakwunye nkọwa na-adịghị na isi mmalite.
  terminology: Aha Salamis na Jọn dabara n’ụdị aha a na-ejikarị n’Igbo. ‘Okwu Chineke’ na-ezere ịkọwa λόγος gabiga ókè, ebe ‘onye enyemaka’ na-anọgide n’ọkwa sara mbara nke ὑπηρέτης. Akara [a] na [b] nọ n’ebe okwu ndị nkọwa ụkwụ ha metụtara, na nkọwa ụkwụ ndị ahụ na-enye nhọrọ ziri ezi.
