id: ACT.13.1
reference: Acts 13:1
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἦσαν ⸀δὲ ἐν Ἀντιοχείᾳ κατὰ τὴν οὖσαν ἐκκλησίαν προφῆται καὶ διδάσκαλοι ὅ τε Βαρναβᾶς καὶ Συμεὼν ὁ καλούμενος Νίγερ, καὶ Λούκιος ὁ Κυρηναῖος, Μαναήν τε Ἡρῴδου τοῦ τετραάρχου σύντροφος καὶ Σαῦλος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/001.yaml
  text: 'In Antioch[a], in the church there, there were prophets and teachers: Barnabas, Simeon who was called Niger, Lucius the Cyrenian, Manaen, a close companion of Herod the tetrarch[c][b], and Saul.'
translation:
  language: ig
  text: 'N’Antiọk, n’ọgbakọ dị n’ebe ahụ, e nwere ndị amụma na ndị ozizi: Banabas, Simiọn onye a na-akpọ Niger[a], Lushọs, onye si Saịrini[b], Manaen, onye mmekọ chiri anya nke Herọd, onye na-achị otu ụzọ n’ụzọ anọ[c], na Sọl.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Niger” bụ aha Latịn nke pụtara “ojii.” E debere ya ebe a dị ka aha mmadụ kama ịsụgharị ya.
    reason: lexical_alternative
  - marker: b
    text: Ya bụ, Lushọs si Saịrini, obodo dị n’ugwu Afrịka.
    reason: cultural_note
  - marker: c
    text: A pụkwara ịsụgharị ya, “nwanne Herọd, onye na-achị otu ụzọ n’ụzọ anọ, e kuchiri,” ma ọ bụ “onye a zụlitere ya na Herọd, onye na-achị otu ụzọ n’ụzọ anọ.”
    reason: alternative_reading
lexical_decisions:
- source_word: Ἦσαν δὲ
  choice: e nwere
  rationale: A sụgharịrị ngwaa ahụ dị ka okwu na-egosi ịdị adị; a hapụrụ δέ dị nro n’enweghị okwu pụrụ iche ka Igbo wee daa nke ọma ma ghara ime ka ọ bụrụ mmegide siri ike.
- source_word: ἐν Ἀντιοχείᾳ κατὰ τὴν οὖσαν ἐκκλησίαν
  choice: N’Antiọk, n’ime chọọchị dị n’ebe ahụ
  rationale: Nke a na-egosi ma obodo ahụ ma ọgbakọ ndị Kraịst nọ n’ebe ahụ n’ụzọ doro anya ma bụrụ Igbo a na-asụ ugbu a.
- source_word: προφῆται καὶ διδάσκαλοι
  choice: ndị amụma na ndị ozizi
  rationale: Okwu ndị a na-akọwa ọrụ ndị ahụ kpọmkwem n’etinyeghị usoro ọchịchị ụka nke oge ọzọ.
- source_word: Συμεὼν ὁ καλούμενος Νίγερ
  choice: Simiọn onye a na-akpọ Naịja
  rationale: E debere Νίγερ dị ka aha mmadụ kama ịsụgharị ya dị ka nkọwa; ndetu ala peeji na-enye ihe aha Latịn ahụ pụtara.
- source_word: Λούκιος ὁ Κυρηναῖος
  choice: Lushọs onye Saịrini
  rationale: ὁ Κυρηναῖος pụtara onye si Saịrini; usoro a bụ nke doro anya ma dị ndụ n’Igbo.
- source_word: Ἡρῴδου τοῦ τετραάρχου
  choice: Herọd onye ọchịchị otu ụzọ n’ụzọ anọ
  rationale: A sụgharịrị aha ọchịchị τετραάρχης n’ụzọ nkịtị, n’etinyeghị aha Antipas nke Grik ekwughị.
- source_word: σύντροφος
  choice: onye ya na ... tolitere
  rationale: Okwu a nwere ike igosi onye a zụlitere ya na onye ọzọ; nsụgharị a na-echekwa echiche ahụ ma ghara ikwu kpọmkwem na ha bụ ụmụnne e kuchiri.
theological_decisions:
- issue: Ụdị ọrụ ndị amụma na ndị ozizi n’Antiọk
  choice: ndị amụma na ndị ozizi
  alternative: Iwere ha dị ka ọkwa ọchịchị ụka e guzobere n’usoro teknụzụ nke oge e mesịrị
  rationale: Amaokwu ahụ kpọrọ ọrụ ha aha, ma ọ kọwaghị usoro ọkwa ụka; nsụgharị ahụ anaghị ebubata ozizi otu ụka.
- issue: Mmekọrịta Manaen na Herọd nke σύντροφος na-egosi
  choice: onye ya na Herọd ... tolitere
  alternative: nwanne Herọd e kuchiri; ezigbo enyi Herọd
  rationale: Okwu Grik nwere ike ịpụta onye e zụlitere na Herọd, ma ụdị mmekọrịta iwu ma ọ bụ ezinụlọ ha abụghị ihe amaokwu ahụ kọwara kpọmkwem.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E jiri “chọọchị” maka ἐκκλησία n’ihi na ebe a ọ na-ekwu banyere ọgbakọ ndị Kraịst. E tinyere akara ndetu [a], [b], na [c] ozugbo n’ebe okwu ha na-akọwa dị.
