id: ACT.13.46
reference: Acts 13:46
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: παρρησιασάμενοί ⸀τε ὁ Παῦλος καὶ ὁ Βαρναβᾶς εἶπαν· Ὑμῖν ἦν ἀναγκαῖον πρῶτον λαληθῆναι τὸν λόγον τοῦ θεοῦ· ⸀ἐπειδὴ ἀπωθεῖσθε αὐτὸν καὶ οὐκ ἀξίους κρίνετε ἑαυτοὺς τῆς αἰωνίου ζωῆς, ἰδοὺ στρεφόμεθα εἰς τὰ ἔθνη·
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/046.yaml
  text: So Paul and Barnabas spoke boldly and said[a], “It was necessary that the word of God be spoken first to you. Since you are rejecting it and judging yourselves unworthy of eternal life, look, we are turning to the Gentiles.”
translation:
  language: ig
  text: Ya mere, Pọl na Banabas ji nkwuwa okwu sị, “Ọ dị mkpa ka e buru ụzọ gwa unu okwu Chineke. N’ihi na unu na-ajụ ya ma na-ekpe onwe unu ikpe na unu erughị eru inweta ndụ ebighị ebi, leenụ, anyị na-atụgharị gaa n’ebe ndị mba ọzọ nọ.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “mba dị iche iche.” N’ebe a, okwu ahụ na-ezo aka n’ebe ndị na-abụghị ndị Juu nọ, n’ụzọ dị iche na ndị nọ n’ụlọ nzukọ ahụ; ya mere e ji “ndị mba ọzọ” mee ihe n’ahịrịokwu.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρρησιασάμενοί
  choice: ji nkwuwa okwu sị
  rationale: Nke a na-egosi ikwu okwu n’atụghị egwu na n’ezoghị ọnụ; njikọ ya na “sị” na-eme ka Igbo bụrụ nke e kere eke ma chekwaa otú e si kwuo okwu ahụ.
- source_word: τέ
  choice: Ya mere
  rationale: Mkpụrụokwu a na-ejikọ ihe a na ihe mere tupu ya n’ụzọ dị nro; “Ya mere” na-egosi njikọ akụkọ ahụ n’Igbo.
- source_word: Ὑμῖν
  choice: unu
  rationale: Ọ na-egosi ndị e bu ụzọ gwa ozi ahụ, ya bụ ndị nọ n’ụlọ nzukọ ahụ.
- source_word: ἀναγκαῖον
  choice: Ọ dị mkpa
  rationale: Nke a na-egosi na ihe ahụ kwesịrị ime, ma na-adịghị etinye echiche ọzọ karịrị nke Grik.
- source_word: πρῶτον
  choice: buru ụzọ
  rationale: Ọ na-echekwa usoro nke izi ndị Juu ozi tupu echigharịkwuru ndị mba ọzọ.
- source_word: λαληθῆναι
  choice: gwa unu
  rationale: 'Ụdị a na-enye passive Grik ahụ n’Igbo dị mfe nghọta: okwu Chineke bụ ihe e kwesịrị ibu ụzọ gwa ha.'
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: okwu Chineke
  rationale: Nke a bụ nkebi okwu Baịbụl a maara nke ọma, nke pụtara ozi ma ọ bụ okwu sitere n’aka Chineke.
- source_word: ἐπειδὴ
  choice: ebe
  rationale: N’usoro “Ma ebe unu…,” ọ na-egosi ihe kpatara ha ji echigharịkwuru ndị mba ọzọ.
- source_word: ἀπωθεῖσθε
  choice: na-ajụ ya
  rationale: Ọ na-egosi na ndị ahụ na-achụpụ ma na-ajụ ozi ahụ ugbu a; okwu a doro ndị na-agụ Igbo anya.
- source_word: αὐτὸν
  choice: ya
  rationale: Ọ na-alaghachi n’“okwu Chineke,” na-ahapụghị onye ọ na-ezo aka n’ebe ọzọ.
- source_word: οὐκ ἀξίους κρίνετε ἑαυτοὺς
  choice: na-ekpe onwe unu ikpe na unu erughị eru
  rationale: 'Nke a na-echekwa ma echiche ikpe dị na κρίνετε ma ike reflexive nke ἑαυτούς: ha na-ekpe onwe ha ikpe site n’ọjụjụ ha.'
- source_word: τῆς αἰωνίου ζωῆς
  choice: inweta ndụ ebighị ebi
  rationale: “Iru eru inweta” bụ ụzọ Igbo si ekwu njikọ a nke ọma, ma na-echekwa ndụ ebighị ebi dịka ihe a na-ekwu maka ya.
- source_word: ἰδοὺ
  choice: leenụ
  rationale: Ọ bụ oku ka ndị na-ege ntị ṅaa ntị n’ihe dị mkpa na-esote.
- source_word: στρεφόμεθα εἰς τὰ ἔθνη
  choice: anyị na-echigharịkwuru ndị mba ọzọ
  rationale: Ọ na-egosi mgbanwe ebe ozi ha na-aga, site n’ebe ndị nọ n’ụlọ nzukọ ahụ nọ gaa n’ebe ndị na-abụghị ndị Juu nọ.
theological_decisions:
- issue: Ihe τὰ ἔθνη pụtara n’ọnọdụ akụkọ nzọpụta a
  choice: ndị mba ọzọ
  alternative: mba dị iche iche
  rationale: Ihe dị iche n’ebe a bụ ndị nọ n’ụlọ nzukọ ndị Juu na ndị na-abụghị ndị Juu. “Ndị mba ọzọ” na-egosipụta ọdịiche ahụ, ebe nkọwa ala ala peeji na-echekwa ihe ọzọ Grik ahụ nwekwara ike ịpụta.
- issue: Ike nke οὐκ ἀξίους κρίνετε ἑαυτοὺς τῆς αἰωνίου ζωῆς
  choice: unu na-ekpe onwe unu ikpe na unu erughị eru inweta ndụ ebighị ebi
  alternative: Pọl na-ekpe ha ikpe na ha erughị eru inweta ndụ ebighị ebi
  rationale: Grik ahụ kwuru kpọmkwem na ndị na-ege ntị na-ekpe onwe ha ikpe. Nsụgharị ahụ echekwaghị ya dịka ikpe Pọl kpebiri n’onwe ya, ma ọ bụ tinye nkwubi okwu nkà mmụta okpukpe ọzọ.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke nwere ugwu ma dịkwa mfe nghọta. “Ji nkwuwa okwu,” “buru ụzọ,” na “echigharịkwuru” na-echekwa ike na usoro nke Grik n’enweghị asụsụ siri ike ma ọ bụ nkwupụta ụka pụrụ iche.
