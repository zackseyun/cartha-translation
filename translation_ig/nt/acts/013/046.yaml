revisions:
- from: Ya mere, Pọl na Banabas ji nkwuwa okwu sị, “Ọ dị mkpa ka e buru ụzọ gwa unu okwu Chineke. Ma ebe unu na-ajụ ya ma na-ekpe onwe unu ikpe na unu erughị eru inweta ndụ ebighị ebi, leenụ, anyị na-echigharịkwuru ndị mba ọzọ.[a]”
  to: Ya mere, Pọl na Banabas ji nkwuwa okwu sị, “Ọ dị mkpa ka e buru ụzọ gwa unu okwu Chineke. N’ihi na unu na-ajụ ya ma na-ekpe onwe unu ikpe na unu erughị eru inweta ndụ ebighị ebi, leenụ, anyị na-atụgharị gaa n’ebe ndị mba ọzọ nọ.[a]”
  rationale: The revision removes a non-source adversative connector and replaces a potentially iterative verb with a direct equivalent of the Greek directional expression, while retaining the draft’s sound rendering of the reflexive judgment and the contextual sense of τὰ ἔθνη.
