  variant: Standard Igbo
source:
  edition: SBLGNT
  text: γνωστὸν οὖν ἔστω ὑμῖν, ἄνδρες ἀδελφοί, ὅτι διὰ τούτου ὑμῖν ἄφεσις ἁμαρτιῶν καταγγέλλεται, καὶ ἀπὸ πάντων ὧν οὐκ ἠδυνήθητε ⸀ἐν νόμῳ Μωϋσέως δικαιωθῆναι
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/038.yaml
  text: Therefore let it be known to you[a], brothers, that through this one forgiveness of sins is proclaimed to you, and from all the things from which you could not be justified by the law of Moses[c][b], everyone who believes is justified.
translation:
  language: ig
  text: Ya mere, ụmụnna[a], ka unu mara na ọ bụ site n’Onye a[b] ka a na-ekwusara unu mgbaghara mmehie, nakwa n’ihe niile nke unu na-enweghị ike ịbụ ndị a gụrụ ná ndị ezi omume[c] site n’iwu Mosis—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’ụdị okwu Grik, nke a bụ “ndị nwoke, ụmụnna”; “ụmụnna” nwekwara ike ịkpọ ndị niile gbakọtara, ma nwoke ma nwaanyị.
    reason: lexical_alternative
  - marker: b
    text: Ya bụ, Jizọs, Onye a kpọtụrụ aha n’okwu ndị bu ụzọ.
    reason: cross_reference
  - marker: c
    text: Ma ọ bụ, “ndị a kpọrọ ndị ezi omume.”
    reason: lexical_alternative
lexical_decisions:
- source_word: γνωστὸν οὖν ἔστω ὑμῖν
  choice: Ya mere, ... ka unu mara
  rationale: Nke a na-egosipụta οὖν na ike nke iwu γνωστὸν ... ἔστω n’ụzọ Igbo dị ndụ ma dị ùgwù.
- source_word: ἄνδρες ἀδελφοί
  choice: ụmụnna m
  rationale: Nke a bụ ụzọ Igbo nkịtị e si akpọ ndị otu okwukwe ma ọ bụ ndị otu agbụrụ; ọ na-ezere ntụgharị siri ike nke ‘ndị nwoke, ụmụnna.’ E debere nkọwa gbasara oke nwoke na nwaanyị n’ala peeji.
- source_word: διὰ τούτου
  choice: site n’Onye a
  rationale: ‘Onye a’ na-edebe nnọchiaha ngosi nke nwoke, ma na-ezo aka n’ebe Jizọs nọ n’okwu bu ụzọ; ‘site na’ na-egosipụta διὰ na genitive.
- source_word: ἄφεσις ἁμαρτιῶν
  choice: mgbaghara mmehie
  rationale: Nke a bụ okwu Igbo doro anya ma bụrụkwa nke a na-ejikarị ekwu maka ịgbaghara mmehie.
- source_word: καταγγέλλεται
  choice: a na-ekwusara unu
  rationale: Ụdị a na-egosipụta present passive na omume ikwusa ozi n’ihu ọha.
- source_word: ἀπὸ πάντων ὧν
  choice: n’ihe niile
  rationale: N’usoro ahịrịokwu a, Igbo eke anaghị achọ ikwughachi preposition ahụ ugboro abụọ; okwu a ka na-edebe echiche nke ihe niile onye chọrọ ka a tọhapụ ya na ha.
- source_word: οὐκ ἠδυνήθητε
  choice: unu na-enweghị ike
  rationale: Nke a na-edebe onye nke abụọ plural na enweghị ike nke dị n’ọrụ δύναμαι, kama ịtụgharị ya ka ọ bụrụ na iwu ahụ bụ isiokwu.
- source_word: ἐν νόμῳ Μωϋσέως
  choice: site n’iwu Mosis
  rationale: ‘Site na’ na-egosipụta ụzọ ma ọ bụ ngwa ọrụ e bu n’obi n’ἐν n’ebe a, n’Igbo doro anya.
- source_word: δικαιωθῆναι
  choice: ịbụ ndị a gụrụ ná ndị ezi omume
  rationale: Nke a na-edebe passive na echiche ikpe nke δικαιόω—ịgụ ma ọ bụ ịkpọ mmadụ onye ezi omume—na-enweghị ime ka ọ bụrụ naanị mgbanwe omume n’ime mmadụ.
theological_decisions:
- issue: Ihe δικαιωθῆναι pụtara n’ihe metụtara iwu Mosis
  choice: ịbụ ndị a gụrụ ná ndị ezi omume
  alternative: ịbụ ndị a kpọrọ ndị ezi omume
  rationale: Nhọrọ a na-echekwa echiche ikpe na nkwupụta ikpe ziri ezi, ma ọ naghị ekpebi na okwu ahụ pụtara naanị mgbanwe omume. E tinyere ụzọ ọzọ kwe omume n’ala peeji.
- issue: Oke ndị ἄνδρες ἀδελφοί na-akpọ
  choice: ụmụnna m
  alternative: ụmụnna nwoke m
  rationale: ‘Ụmụnna m’ bụ okwu ịkpọ mmadụ eke n’Igbo ma nwee ike ịgụnye ọgbakọ niile; ala peeji na-egosi na ụdị Grik ahụ bụ masculine ka e wee ghara izochi mgbagwoju anya ahụ.
- issue: Ókè amaokwu na ahịrịokwu na-aga n’ihu
  choice: E ji ogologo akara nkwụsị mechie akụkụ a iji gosi na ahịrịokwu ahụ ezughị ezu
  alternative: Ịgbakwunye ‘onye ọ bụla kwere ekwe ka a na-agụ ná ndị ezi omume’ site n’amaokwu na-esonụ
  rationale: Ihe odide Grik e nyere maka ACT.13.38 kwụsịrị na δικαιωθῆναι. Ya mere, a naghị atụkwasị nkebiokwu Grik a na-enyeghị, ọ bụ ezie na ahịrịokwu ahụ na-aga n’ihu n’amaokwu na-esonụ.
translation_notes:
  register: Asụsụ ahụ bụ Standard Igbo nke oge a, dị mfe nghọta ma dịkwa ùgwù. E jiri ‘Mosis’ mee aha Μωϋσέως. E zere okwu ụka pụrụ iche na nkọwa na-emechi mgbagwoju anya nke δικαιόω. E mechiri ederede ahụ na ogologo akara nkwụsị n’ihi na isi mmalite e nyere kwụsịrị n’etiti ahịrịokwu nke na-aga n’ihu n’amaokwu na-esonụ.
