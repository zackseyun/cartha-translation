id: ACT.13.23
reference: Acts 13:23
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τούτου ὁ θεὸς ἀπὸ τοῦ σπέρματος κατ’ ἐπαγγελίαν ἤγαγεν τῷ Ἰσραὴλ ⸂σωτῆρα Ἰησοῦν⸃,
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/023.yaml
  text: From this man's offspring[a], God has brought to Israel a Savior, Jesus[b], according to promise.
translation:
  language: ig
  text: Site n’ụmụ ya, Chineke ewetala Onye Nzọpụta, bụ Jizọs, nye Izrel, dịka e kwere ná nkwa[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “dịka nkwa ahụ si dị” ma ọ bụ “n’imezu nkwa.” “Ụmụ ya” n’ebe a pụtara ndị sitere n’agbụrụ Devid.
    reason: lexical_alternative
lexical_decisions:
- source_word: τούτου
  choice: nwoke a
  rationale: Nnọchiaha ngosi a na-ezo aka n’ebe Devid nọ n’amaokwu bu ụzọ. ‘Nwoke a’ na-eme ka onye a na-ekwu banyere ya doo anya n’Igbo n’etinyeghị aha Devid n’amaokwu ahụ.
- source_word: ἀπὸ τοῦ σπέρματος
  choice: site ná mkpụrụ
  rationale: ‘Mkpụrụ’ na-edobe ihe oyiyi nke σπέρμα ma n’ebe a ọ pụtara ụmụ sitere n’agbụrụ Devid. Ihe odide ala peeji na-eme ka ihe ọmụmụ agbụrụ ahụ doo anya.
- source_word: κατ’ ἐπαγγελίαν
  choice: dịka e kwere ná nkwa
  rationale: Nke a na-egosi na ihe Chineke mere kwekọrọ ná nkwa e kwere, ma ọ naghị etinye nkọwa ọzọ banyere nkwa ahụ ma ọ bụ onye e kwere ya.
- source_word: ἤγαγεν
  choice: ewetala
  rationale: Ngwaa a na-egosipụta isi echiche ἄγω, ya bụ ‘iweta.’ Oge ngwaa Igbo a na-egosi ihe Chineke mezuru nke ka nwere mkpa n’okwu Pọl.
- source_word: τῷ Ἰσραήλ
  choice: nye Izrel
  rationale: ‘Nye Izrel’ na-egosipụta dative ahụ ma na-ahapụkwa echiche na Onye Nzọpụta ahụ bụ maka ọdịmma Izrel.
- source_word: σωτῆρα
  choice: Onye Nzọpụta
  rationale: Nke a bụ aha nsọpụrụ Igbo doro anya maka onye na-azọpụta ma dabara n’ọrụ σωτήρ n’ebe a.
- source_word: Ἰησοῦν
  choice: Jizọs
  rationale: E dere aha ahụ n’ụdị a na-ejikarị ede ya n’Igbo.
theological_decisions:
- issue: Mmekọrịta Jizọs na nkwa e nyere banyere agbụrụ Devid
  choice: E kwuru na Chineke wetara Jizọs site ná mkpụrụ Devid dịka e kwere ná nkwa, n’etinyeghị nkọwa karịrị okwu Grik.
  alternative: A pụrụ ịsụgharị ya n’ụzọ sara mbara dịka ‘iji mezuo nkwa o kwere Devid.’
  rationale: Ihe odide Grik jikọtara ọmụmụ Jizọs n’agbụrụ Devid na nkwa Chineke, ma ọ kpọghị Devid aha n’akụkụ nkwa ahụ ma ọ bụ kọwaa nkwa ahụ n’uju.
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E debere ‘mkpụrụ’ iji chekwaa ihe oyiyi na nghọta ọmụmụ agbụrụ dị na Grik, ebe ihe odide ala peeji kọwara ya. E tinyere akara [a] n’akụkụ okwu nkwa na [b] n’akụkụ okwu mkpụrụ ka akara nke ọ bụla kwekọọ n’ezi nkọwa ya.
