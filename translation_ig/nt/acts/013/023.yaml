revisions:
- from: Site ná mkpụrụ nwoke a[b], Chineke ewetala Onye Nzọpụta, bụ Jizọs, nye Izrel, dịka e kwere ná nkwa[a].
  to: Site n’ụmụ ya, Chineke ewetala Onye Nzọpụta, bụ Jizọs, nye Izrel, dịka e kwere ná nkwa[a].
  rationale: The revision removes the ambiguous and potentially misleading expression “mkpụrụ nwoke a” and uses the idiomatic collective expression “ụmụ ya,” whose antecedent is David in the preceding verse. The footnote preserves the lineage sense and gives restrained alternatives for κατ’ ἐπαγγελίαν. The verse retains the Greek order of thought and does not expand the promise beyond the source text.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T09:18:46Z'
review_pass:
  verdict: revise
  source_fidelity: 'The draft correctly represents God as the agent, Jesus as the Savior, Israel as the recipient, and the promise-qualified fulfillment. However, “mkpụrụ nwoke a” is unsafe: in ordinary modern Igbo, mkpụrụ nwoke commonly denotes male semen rather than a man’s descendants, and so does not clearly convey the collective genealogical sense of σπέρμα.'
  naturalness: The sentence structure and the terms “Onye Nzọpụta,” “Jizọs,” and “Izrel” are natural and appropriately formal for Standard Igbo. Replacing “mkpụrụ nwoke a” with “ụmụ ya” yields a clearer, idiomatic expression in context, where David is the immediately established antecedent.
  terminology: “Onye Nzọpụta” faithfully renders σωτῆρα as a title. “dịka e kwere ná nkwa” is a suitable rendering of κατ’ ἐπαγγελίαν and does not overidentify the promise. “ụmụ ya” conveys the collective descendant sense intended by σπέρμα without the misleading sexual sense of “mkpụrụ nwoke.”
  issues:
  - severity: medium
    issue: “mkpụrụ nwoke a” is semantically misleading in contemporary Igbo.
    rationale: Although σπέρμα can be rendered literally as “seed,” the collocation mkpụrụ nwoke normally refers to semen. Here the Greek refers collectively to David’s offspring/descendants. The existing footnote’s alternative “ụmụ ụmụ nwoke a” is also incorrect, since it means this man’s male children/grandsons rather than descendants generally.
  revised_text: Site n’ụmụ ya, Chineke ewetala Onye Nzọpụta, bụ Jizọs, nye Izrel, dịka e kwere ná nkwa[a].
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “dịka nkwa ahụ si dị” ma ọ bụ “n’imezu nkwa.” “Ụmụ ya” n’ebe a pụtara ndị sitere n’agbụrụ Devid.
    reason: lexical_alternative
  revision_rationale: The revision removes the ambiguous and potentially misleading expression “mkpụrụ nwoke a” and uses the idiomatic collective expression “ụmụ ya,” whose antecedent is David in the preceding verse. The footnote preserves the lineage sense and gives restrained alternatives for κατ’ ἐπαγγελίαν. The verse retains the Greek order of thought and does not expand the promise beyond the source text.
