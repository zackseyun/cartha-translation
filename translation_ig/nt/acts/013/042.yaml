  text: Ἐξιόντων δὲ ⸀αὐτῶν ⸀παρεκάλουν εἰς τὸ μεταξὺ σάββατον λαληθῆναι αὐτοῖς τὰ ῥήματα ⸀ταῦτα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/042.yaml
  text: As they were going out[b][a], they were urging that these words be spoken to them on the next Sabbath.
translation:
  language: ig
  text: Mgbe ha na-apụ[b][a], ha nọ na-arịọsi ike ka a gwa ha okwu ndị a n’ụbọchị izu ike na-esote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’ụfọdụ ihe odide aka ochie, e dere ya n’ụzọ doro anya karị, “Mgbe Pọl na Banabas na-apụ, ndị mmadụ nọ na-arịọsi ike ka a gwa ha okwu ndị a n’ụbọchị izu ike na-esote.”
    reason: textual_variant
  - marker: b
    text: Ma ọ bụ, “Mgbe ha na-ahapụ ebe ahụ, ha nọ na-arịọ ka a gwa ha ihe ndị a n’ụbọchị izu ike na-abịa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐξιόντων
  choice: Mgbe ha na-apụ
  rationale: Nkebiokwu a na participle dị ugbu a na-arụ ọrụ dị ka nkebiokwu oge. “Mgbe ha na-apụ” na-egosi omume ahụ ka ọ na-aga n’ihu ma ghara ịkọwa kpọmkwem ebe ha na-ahapụ.
- source_word: δὲ
  choice: Mgbe
  rationale: N’ebe a, δέ bụ njikọ dị nro n’ime nkebiokwu oge; asụsụ Igbo na-etinye ọrụ ya n’ime “Mgbe” kama ịgbakwunye njikọ ọzọ.
- source_word: αὐτῶν
  choice: ha
  rationale: Aha nnọchi a anaghị akọwa ndị ọ na-ekwu maka ha n’ụzọ doro anya. “Ha” na-echekwa enweghị ido anya ahụ kama ịkpọ Pọl na Banabas ma ọ bụ ndị mmadụ aha n’amaokwu bụ isi.
- source_word: παρεκάλουν
  choice: ha nọ na-arịọsi ike
  rationale: Imperfect ahụ na-egosi arịrịọ na-aga n’ihu ma ọ bụ a na-eme ugboro ugboro. “Na-arịọsi ike” na-egosi ịdị uchu nke παρακαλέω n’ebe a, ọ bụghị nkasi obi ma ọ bụ ndụmọdụ.
- source_word: εἰς τὸ μεταξὺ σάββατον
  choice: n’ụbọchị izu ike na-esote
  rationale: Nkebiokwu Grik a na-ezo aka n’ụbọchị izu ike na-abịa, ya bụ nke na-esote. Nsụgharị a bụ Igbo nkịtị ma na-echekwa echiche oge ahụ.
- source_word: λαληθῆναι
  choice: ka a gwa
  rationale: Ụdị passive infinitive a pụtara ka e kwuo ma ọ bụ gwa ha ihe. Usoro “ka a gwa” bụ ụzọ Igbo dị ndụ si kwuo passive a n’enweghị ịkpọ onye ga-ekwu ya aha.
- source_word: αὐτοῖς
  choice: ha
  rationale: Dative a bụ ndị a ga-agwa okwu ahụ; n’Igbo, “gwa ha” na-egosi nke a n’ụzọ kwesịrị ekwesị.
- source_word: τὰ ῥήματα ταῦτα
  choice: okwu ndị a
  rationale: ῥήματα na-ezo aka n’okwu e kwuru. “Okwu ndị a” dị nso n’usoro isi mmalite ma na-ezo aka n’ihe Pọl kwuru n’ụlọ nzukọ.
theological_decisions:
- issue: Ndị aha nnọchi “ha” na-ezo aka na ha
  choice: E ji “ha” mee ihe n’amaokwu bụ isi n’akọwaghị kpọmkwem ndị na-apụ ma ọ bụ ndị na-arịọ.
  alternative: A pụrụ ịkọwa ya dịka ndị mmadụ na-arịọ Pọl na Banabas, ma ọ bụ dịka Pọl na Banabas na-arịọ ndị mmadụ.
  rationale: Ihe odide Grik nke e nyere nwere aha nnọchi kama aha ndị ahụ, ma e nwekwara ọdịiche n’ihe odide aka ochie. Ịhapụ “ha” na-echekwa mgbagwoju anya dị n’isi mmalite kama idozi ya site n’echiche otu onye ntụgharị.
translation_notes:
  register: E ji asụsụ Igbo izugbe, nke oge a ma dị ugwu mee ihe. “Na-arịọsi ike” na-egosi arịrịọ siri ike n’enweghị ụda arịrịọ oke; “ka a gwa ha” bụ passive eke n’Igbo. E debere akara nkọwa ala peeji [b] na [a] ozugbo n’ebe okwu metụtara ha dị.
