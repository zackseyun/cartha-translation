  text: ὅτι δὲ ἀνέστησεν αὐτὸν ἐκ νεκρῶν μηκέτι μέλλοντα ὑποστρέφειν εἰς διαφθοράν, οὕτως εἴρηκεν ὅτι Δώσω ὑμῖν τὰ ὅσια Δαυὶδ τὰ πιστά.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/034.yaml
  text: 'And that he raised him from the dead, no longer about to return to decay, he has spoken in this way: ‘I will give you the holy and sure blessings of David.’'
translation:
  language: ig
  text: 'Ma na o mere ka ọ si n’ọnwụ bilie, ka ọ ghara ịlaghachi ọzọ n’ire ure, o kwuru otu a: “Aga m enye unu nkwa nsọ na nke a pụrụ ịtụkwasị obi nke Devid.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “ebere Devid ndị a pụrụ ịtụkwasị obi.” Akpaokwu Grik a na-ekwughachi Aịzaya 55:3; ọ na-ezo aka na nkwa ọgbụgba ndụ dị nsọ, ndị a pụrụ ịtụkwasị obi, nke metụtara Devid.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνέστησεν αὐτὸν ἐκ νεκρῶν
  choice: o mere ka o si ná ndị nwụrụ anwụ bilie
  rationale: Nke a na-egosipụta omume Chineke nke ime ka onye ahụ bilie nʼọnwụ, ma na-edobe okwu nnọchiaha dị nʼamaokwu Grik kama itinye aha na-adịghị nʼahịrịokwu ahụ.
- source_word: μηκέτι μέλλοντα ὑποστρέφειν
  choice: ka ọ ghara ịlaghachi ọzọ
  rationale: Ọ na-egosipụta na ịlaghachi ahụ agaghị eme ọzọ; nke a bụ Igbo dị mma ma na-edobe ntụziaka ọdịnihu nke participle na infinitive ahụ.
- source_word: διαφθοράν
  choice: ire ure
  rationale: Nʼọnọdụ mbilite nʼọnwụ a, okwu ahụ na-ekwu maka ahụ ịre ure, ọ bụghị omume rụrụ arụ.
- source_word: οὕτως εἴρηκεν
  choice: o kwuwo otu a
  rationale: Ụdị ngwaa zuru oke na-egosi okwu e kwurula nke ka dị irè, ebe “otu a” na-ebute ihe e hotara.
- source_word: Δώσω ὑμῖν
  choice: Aga m enye unu
  rationale: Nke a bụ nkwa ọdịnihu doro anya e nyere ọtụtụ mmadụ.
- source_word: τὰ ὅσια Δαυὶδ τὰ πιστά
  choice: ngọzi nsọ na ndị e ji nʼaka nke Devid
  rationale: Akpaokwu Grik ahụ dị mkpirikpi ma sie ike ịkọwa kpọmkwem. “Ngọzi” na-eme ka ihe ọma ndị dị nsọ metụtara nkwa ọgbụgba ndụ Devid doo onye Igbo anya; “ndị e ji nʼaka” na-egosipụta na ha kwụsiri ike ma bụrụ ndị a pụrụ ịtụkwasị obi.
theological_decisions:
- issue: Ihe τὰ ὅσια Δαυὶδ τὰ πιστά pụtara nʼokwu e hotara nʼAịzaya 55:3
  choice: ngọzi nsọ na ndị e ji nʼaka nke Devid
  alternative: ebere ndị e ji nʼaka nke Devid; ihe nsọ nke Devid, bụ́ ndị kwesịrị ntụkwasị obi
  rationale: Nhọrọ a na-edobe njikọ ya na nkwa dị nsọ, nke na-adịgide adịgide, metụtara Devid, nʼetinyeghị nkọwa ozizi karịrị ihe ederede kwuru. Ihe odide ala peeji na-echekwa nsụgharị ọdịnala ọzọ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta. E debere usoro arụmụka na nkwughachi Akwụkwọ Nsọ ahụ, ma zere okwu nwere ike ime ka “ire ure” bụrụ mmehie omume kama ịbụ ire ure nke ahụ.
