  to: 'Ma na o mere ka ọ si n’ọnwụ bilie, ka ọ ghara ịlaghachi ọzọ n’ire ure, o kwuru otu a: “Aga m enye unu nkwa nsọ na nke a pụrụ ịtụkwasị obi nke Devid.[a]”'
  rationale: 'Edereziri ahịrị ahụ n’Igbo Izugbe ka ọ bụrụ nke eke ma na-edobe ọdịnaya Grik: mbilite n’ọnwụ, enweghị ịlaghachi n’ire ure, na nkwughachi nkwa Aịzaya. A dochiri “ngọzi” na nhazi okwu ya na-adịghị edo anya anya site na “nkwa,” n’ihi na n’ọnọdụ a τὰ ὅσια Δαυὶδ τὰ πιστά na-ekwu maka nkwa ọgbụgba ndụ Devid. Ihe odide ala peeji na-edobe nhọrọ ọdịnala “ebere,” ma na-enweghị nhazi okwu na-adịghị mma.'
