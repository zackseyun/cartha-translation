  source_fidelity: 'Isi nsụgharị ahụ ziri ezi n’ozuzu ya: ọ na-ekwu maka Chineke ime ka ya bilie site n’ọnwụ na enweghị ịlaghachi ọzọ n’ire ure. Otú ọ dị, “ngọzi nsọ na ndị e ji n’aka” anaghị arụ ọrụ n’ụtọasụsụ Igbo, n’ihi na “ndị” na-anọchi mmadụ n’ụzọ a ma mebie njikọ nke ihe a na-akọwa. A gbanwere ya ka ọ kpọọ nkwa/ngọzi Devid ndị dị nsọ ma bụrụ ndị a pụrụ ịtụkwasị obi, na-enweghị ime ka nkọwa ahụ bụrụ ozizi sara mbara karịa ederede.'
  naturalness: “Ma banyere na” na “ka ọ ghara ịlaghachi ọzọ” na-ada ntakịrị arọ n’ebe a. “Ma na … ọ gaghị alaghachi ọzọ” bụ Igbo Izugbe doro anya ma kwekọọ na nkwupụta Pọl na-eme. “O kwuru otu a” bụkwa ụzọ nkịtị e si ewebata nkwughachi Akwụkwọ Nsọ.
  terminology: “Ire ure” dabara nke ọma maka διαφθοράν n’ọnọdụ mbilite n’ọnwụ. “Nkwa nsọ na nke a pụrụ ịtụkwasị obi nke Devid” na-egosipụta ihe ὅσια na πιστά pụtara n’ọnọdụ Aịzaya 55:3 karịa ngwakọta na-adịghị edo anya nke “ngọzi … ndị e ji n’aka.” A hapụrụ “ebere Devid” n’ala peeji dị ka nsụgharị ọdịnala, ma dozie ya ka ọ bụrụ Igbo ziri ezi.
