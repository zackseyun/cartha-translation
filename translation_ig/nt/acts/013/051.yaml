review_pass:
  verdict: revise
  source_fidelity: The draft retains the narrative contrast, the symbolic action directed against the opponents, and the journey to Iconium. However, “fepụrụ” is not the clearest Standard Igbo verb here for deliberately shaking dust off; “kpupụrụ” expresses the physical gesture more directly. “Ájá n’ụkwụ ha” naturally conveys dust on/off their feet in this construction.
  naturalness: The revised wording is concise, modern, and idiomatic for narrative Standard Igbo. It avoids the potentially ambiguous sense of “fepụrụ,” which can suggest flying or blowing away rather than the agents’ deliberate shaking-off action.
  terminology: “Megide ha” accurately preserves ἐπ’ αὐτούς without importing a judgment formula. “Ikoniọm” is retained as the established Igbo-form city name. The cultural note explains the conventional force of the act without making that explanation part of the verse itself.
  issues:
  - severity: medium
    issue: The verb “fepụrụ” is not the most precise rendering of ἐκτιναξάμενοι in this context.
    rationale: The Greek denotes shaking dust off/out as an intentional gesture. “Kpupụrụ” more clearly conveys shaking something off in Standard Igbo and prevents an unintended association with flying or merely blowing dust away.
  revised_text: Ma ha kpupụrụ ájá n’ụkwụ ha megide ha, gaa Ikoniọm.[a]
