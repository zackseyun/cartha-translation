  text: οἱ δὲ ἐκτιναξάμενοι τὸν κονιορτὸν τῶν ⸀ποδῶν ἐπ’ αὐτοὺς ἦλθον εἰς Ἰκόνιον,
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/051.yaml
  text: But they shook off the dust from their feet against them and went to Iconium[a].
translation:
  language: ig
  text: Ma ha kpupụrụ ájá n’ụkwụ ha megide ha, gaa Ikoniọm.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ịkpupụ ájá n’ụkwụ bụ omume ihe atụ nke igosi na mmadụ ekewapụla onwe ya n’ebe ndị jụrụ ozi ahụ nọ, bụrụkwa ihe akaebe megide ha.
    reason: cultural_note
lexical_decisions:
- source_word: οἱ δὲ
  choice: Ma ha
  rationale: δέ na-egosi ntakịrị ọdịiche ma ọ bụ ntụgharị n’akụkọ; “Ma” na “ha” na-ezo aka na Pọl na Banabas n'ụzọ doro anya ma dịkwa eke n’Igbo.
- source_word: ἐκτιναξάμενοι
  choice: fepụrụ
  rationale: Okwu a pụtara ịma jijiji ma ọ bụ ifepụ ihe n’ike ka ọ pụọ; “fepụrụ” na-egosipụta omume iwepụ ájá n’ụkwụ nke ọma.
- source_word: τὸν κονιορτὸν τῶν ποδῶν
  choice: ájá dị n’ụkwụ ha
  rationale: κονιορτός bụ ájá, ebe genitive τῶν ποδῶν na-egosi ájá nke rapara ma ọ bụ dị n’ụkwụ ha; nsụgharị a bụ Igbo eke ma doo anya.
- source_word: ἐπ’ αὐτοὺς
  choice: megide ha
  rationale: ἐπί na accusative n’ebe a nwere nghọta nke omume a tụgharịrị megide ndị ahụ; okwu a na-echekwa ike nke ihe odide ahụ n’agbakwụnyeghị nkọwa ya n’ahịrị bụ isi.
- source_word: ἦλθον
  choice: gaa
  rationale: Ọ bụ ezie na ἔρχομαι nwere ike ịbụ “bịa,” njem e mere ruo ebe a kpọrọ aha na-achọ “gaa” n’Igbo site n’echiche onye na-akọ akụkọ.
- source_word: εἰς Ἰκόνιον
  choice: Ikoniọm
  rationale: εἰς na-egosi ebe njem ahụ na-aga; n’Igbo, “gaa Ikoniọm” bụ ụzọ dị nkenke ma dị eke isi kwuo njem ruo obodo ahụ.
theological_decisions:
- issue: Omume ihe atụ nke ifepụ ájá n’ụkwụ
  choice: E debere ya n’ahịrị bụ isi dịka omume e mere “megide ha,” na-enweghị ịkọwa kpọmkwem ihe ọ pụtara.
  alternative: Ịsụgharị ya dịka “ka ọ bụrụ ihe akaebe megide ha” ma ọ bụ “dịka akara ikpe megide ha.”
  rationale: Ihe odide Grik kwuru naanị omume ahụ na ndị e mere ya megide. Ihe omume ahụ nwere ihe ọ pụtara n’omenala na n’Akwụkwọ Nsọ, ma ịgbakwunye “ihe akaebe” ma ọ bụ “ikpe” n’ahịrị bụ isi ga-akọwa karịa ihe e kwuru kpọmkwem; ya mere e tinyere nkọwa ahụ n’ala peeji.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-edebe usoro akụkọ dị nkenke nke Grik, ebe nkọwa omenala dị n’ala peeji.
