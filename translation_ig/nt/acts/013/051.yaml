revisions:
- from: Ma ha fepụrụ ájá dị n’ụkwụ ha megide ha, gaa Ikoniọm.[a]
  to: Ma ha kpupụrụ ájá n’ụkwụ ha megide ha, gaa Ikoniọm.[a]
  rationale: The revision changes only the verb for the dust-shaking action, improving lexical precision and naturalness while preserving the Greek participle’s action, its direction against the opponents, and the concise narrative style. The footnote remains an appropriately limited cultural explanation.
