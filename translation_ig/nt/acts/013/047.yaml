source:
  edition: SBLGNT
  text: οὕτως γὰρ ἐντέταλται ἡμῖν ὁ κύριος· Τέθεικά σε εἰς φῶς ἐθνῶν τοῦ εἶναί σε εἰς σωτηρίαν ἕως ἐσχάτου τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/047.yaml
  text: 'For so the Lord has commanded us: ‘I have set you as a light for the nations[b][a], so that you may be for salvation to the end of the earth.’'
translation:
  language: ig
  text: 'N’ihi na Onyenwe anyị enyela anyị iwu otu a, sị:


    “Emewo m gị ka ị bụrụ ìhè nye mba dị iche iche[a],

    ka ị bụrụ nzọpụta ruo na nsọtụ ụwa[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ìhè nye ndị mba ọzọ.” Okwu Grik ἐθνῶν pụrụ ịpụta “mba dị iche iche” ma ọ bụ, n’ọtụtụ ọnọdụ, “ndị mba ọzọ.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ruo n’ebe kachasị anya n’ụwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως
  choice: otu a
  rationale: Ọ na-egosi ụzọ ma ọ bụ ihe ndabere nke iwu ahụ; “otu a” bụ okwu Igbo doro anya ma kwekọọ na ike okwu Grik.
- source_word: ἐντέταλται
  choice: nyere anyị iwu
  rationale: Oge perfect nke ngwaa Grik na-egosi iwu e nyere nke ka dị irè. Usoro a bụ Igbo e ji ekwu okwu n'ụzọ ebumpụta ụwa.
- source_word: ὁ κύριος
  choice: Onyenwe anyị
  rationale: Nke a bụ aha nsọpụrụ a na-ejikarị asụgharị κύριος mgbe ọ na-ezo aka n’ebe Chineke nọ, ma na-echekwa ikike nke onye kwuru okwu n’Akwụkwọ Nsọ.
- source_word: Τέθεικά σε
  choice: Emewo m gị ka ị bụrụ
  rationale: Perfect a na-egosi nhọpụta e mere nke ka na-adịgide. Usoro Igbo a na-enye echiche nke ime mmadụ ka ọ nọrọ n’ọrụ a họpụtara ya.
- source_word: εἰς φῶς ἐθνῶν
  choice: ka ị bụrụ ìhè nye mba dị iche iche
  rationale: “Ìhè” na-echekwa ihe atụ ahụ, “nye” na-egosi ndị ọrụ ahụ metụtara, ebe “mba dị iche iche” na-echekwa nghọta sara mbara nke ἐθνῶν.
- source_word: ἐθνῶν
  choice: mba dị iche iche
  rationale: Ọ pụrụ ịpụta mba niile ma ọ bụ ndị Jentaịl. N’isi okwu e hotara n’Aịzaya, “mba dị iche iche” na-echekwa nghọta sara mbara; e debere “ndị mba ọzọ” n’ala peeji.
- source_word: τοῦ εἶναί σε
  choice: ka ị bụrụ
  rationale: Articular infinitive a na-egosi ebumnuche ma ọ bụ ihe ga-esi na ya pụta. “Ka ị bụrụ” na-ekwupụta nke a n’Igbo n’enweghị ịgbakwunye nkọwa.
- source_word: εἰς σωτηρίαν
  choice: maka nzọpụta
  rationale: Nhọrọ a na-echekwa mkpụmkpụ na mgbagwoju anya nke Grik banyere ma onye ahụ ọ bụ nzọpụta n’onwe ya ka ọ bụ ụzọ nzọpụta si abịa, kama ịsụgharị ya dị ka “iweta nzọpụta.”
- source_word: ἕως ἐσχάτου τῆς γῆς
  choice: ruo na nsọtụ ụwa
  rationale: Ọ na-agbasochi ụdị otu ọnụọgụ nke Grik ma na-egosi ebe kachasị anya n’ụwa.
theological_decisions:
- issue: Onye okwu e hotara n’Aịzaya na-ezo aka na ya, na otú Pọl na Banabas si tinye ya n’ozi ha
  choice: E debere “gị” dị ka otu onye n’okwu Chineke e hotara, n’enweghị ịkọwa onye ahụ kpọmkwem ma ọ bụ otú e si tinye okwu ahụ n’ọrụ ndịozi.
  alternative: Ịgbanwe ya ka ọ bụrụ ọtụtụ mmadụ, ma ọ bụ ịkọwa n’ahịrịokwu ahụ na okwu ahụ na-ekwu kpọmkwem banyere Pọl na Banabas.
  rationale: Grik hotara Akwụkwọ Nsọ ozugbo ma hapụ njikọ dị n’etiti ohu ahụ na ozi ndịozi ka onye na-agụ ya tụlee. Idebe otu onye na-echekwa esemokwu nkà mmụta okpukpe dị na ya.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ugwu ma dị mfe nghọta, dee ya. E debere nhazi uri nke okwu Akwụkwọ Nsọ e hotara. “Maka nzọpụta” bụ usoro dịtụ nkenke, ma a họọrọ ya iji ghara ịkọwa karịa ihe Grik kwuru.
