  to: Mgbe a gụchara Iwu na Ndị Amụma, ndị isi ụlọ nzukọ zigaara ha ozi, sị, “Ndị ikom, ụmụnna,[a] ọ bụrụ na e nwere n’etiti unu okwu agbamume[b] ọ bụla maka ndị mmadụ, kwuonụ.”
