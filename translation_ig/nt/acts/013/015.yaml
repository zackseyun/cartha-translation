id: ACT.13.15
reference: Acts 13:15
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: μετὰ δὲ τὴν ἀνάγνωσιν τοῦ νόμου καὶ τῶν προφητῶν ἀπέστειλαν οἱ ἀρχισυνάγωγοι πρὸς αὐτοὺς λέγοντες· Ἄνδρες ἀδελφοί, εἴ ⸀τίς ἐστιν ⸂ἐν ὑμῖν λόγος⸃ παρακλήσεως πρὸς τὸν λαόν, λέγετε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/015.yaml
  text: After the reading of the Law and the Prophets[a], the synagogue rulers sent word to them, saying, “Brothers, if there is among you any word of encouragement for the people[b], speak.”
translation:
  language: ig
  text: Mgbe a gụchara Iwu na Ndị Amụma, ndị isi ụlọ nzukọ zigaara ha ozi, sị, “Ndị ikom, ụmụnna,[a] ọ bụrụ na e nwere n’etiti unu okwu agbamume[b] ọ bụla maka ndị mmadụ, kwuonụ.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’asụsụ Grik, “Ndị ikom, ụmụnna,” bụ ụzọ nkwanye ùgwù na nke mmekọrịta ezinụlọ e ji akpọ ndị a na-agwa okwu.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụ ya “okwu ndụmọdụ” ma ọ bụ “okwu ịdọ aka ná ntị.” Okwu Grik ahụ nwere ike ịpụta ma ịgba ume ma ịgba mmadụ ume ka o mee ihe.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνάγνωσιν
  choice: a gụchara
  rationale: N’ọnọdụ ofufe ụlọ nzukọ ndị Juu, nke a na-ekwu maka ịgụ Akwụkwọ Nsọ n’ihu ọha. ‘A gụchara’ na-egosi ma omume ịgụ ahụ ma na ọ bụ mgbe e mechara ya ka ihe na-esonụ mere.
- source_word: νόμου καὶ τῶν προφητῶν
  choice: Iwu na Ndị Amụma
  rationale: Aha ndị a na-arụtụ aka n’akụkụ abụọ a maara nke ọma nke Akwụkwọ Nsọ ndị Juu; mkpụrụedemede ukwu na-eme ka nke ahụ doo anya.
- source_word: ἀρχισυνάγωγοι
  choice: ndị isi ụlọ nzukọ ndị Juu
  rationale: Ọ bụ ọtụtụ ndị na-ahụ maka usoro ihe omume n’ụlọ nzukọ ahụ, ọ bụghị ndị ọchịchị obodo. Nkọwa ‘ndị Juu’ na-eme ka ‘ụlọ nzukọ’ ghara ịdị mgbagwoju anya nye onye Igbo nke oge a.
- source_word: ἀπέστειλαν ... πρὸς αὐτοὺς
  choice: zigaara ha ozi
  rationale: N’okwu a, ihe e zigara bụ ozi ma ọ bụ arịrịọ nke okwu e hotara na-esochi; ntụgharị a bụ Igbo nkịtị ma na-echekwa ihe okwu ahụ pụtara.
- source_word: Ἄνδρες ἀδελφοί
  choice: Ụmụnna nwoke
  rationale: Nke a na-echekwa ma mmetụta mmekọrịta ezinụlọ nke ‘ụmụnna’ ma ụdị nwoke nke okwu Grik, ebe ọ bụ ndị ọbịa nwoke ka a kpọrọ ka ha kwuo okwu.
- source_word: εἴ τίς ἐστιν ἐν ὑμῖν
  choice: ọ bụrụ na e nwere n’etiti unu ... ọ bụla
  rationale: Nke a na-echekwa nhazi okwu Grik nke na-ekwu n’ụzọ na-abụghị kpọmkwem banyere onye nwere ozi ahụ.
- source_word: λόγος παρακλήσεως
  choice: okwu agbamume
  rationale: παράκλησις nwere ike ịbụ ịgba ume ma ọ bụ ịdọ aka ná ntị/ịgba mmadụ ume ka o mee ihe. ‘Okwu agbamume’ bụ okwu Igbo dị mfe nke na-ahapụ obosara echiche ahụ, ebe nkọwa ala peeji na-egosi ụzọ ọzọ.
- source_word: πρὸς τὸν λαόν
  choice: maka ndị mmadụ
  rationale: Nkebiokwu a na-egosi ndị ozi ahụ bụ maka ha; ‘maka ndị mmadụ’ na-ada nke ọma n’Igbo ma ghara imechi ohere na ọ bụ okwu a ga-agwa ha.
- source_word: λέγετε
  choice: kwuonụ
  rationale: Ụdị iwu ọtụtụ mmadụ a bụ òkù ka Pọl na ndị ya na ha nọ kwuo okwu n’ihu ọgbakọ.
theological_decisions:
- issue: Ụdị nwoke dị n’okwu a kpọrọ ndị ọbịa
  choice: Ụmụnna nwoke
  alternative: Ụmụnna nwoke na ụmụnna nwanyị
  rationale: Ἄνδρες ἀδελφοί bụ okwu a kpọrọ ndị nwoke kpọmkwem, ya mere a hapụghị ụdị nwoke ahụ ma ọ bụ gbasaa ya ruo ụmụ nwanyị.
- issue: Obosara ihe παράκλησις pụtara
  choice: okwu agbamume
  alternative: okwu ịdọ aka ná ntị
  rationale: Ihe gbara amaokwu ahụ gburugburu anaghị amanye naanị nkasi obi ma ọ bụ naanị ndụmọdụ siri ike. Isi okwu na nkọwa ala peeji na-echekwa ma agbamume ma ndụmọdụ/ịdọ aka ná ntị.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta. ‘Ụlọ nzukọ ndị Juu’ na-akọwa synagogue n’enweghị okwu agbaziri agbaziri, ebe usoro ahịrịokwu ahụ ka na-esochi isi mmegharị na mgbagwoju anya nke Grik.
