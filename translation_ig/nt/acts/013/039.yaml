- from: N’ime ya, a na-agụ onye ọ bụla kwere ekwe n’onye ezi omume[a].
  to: N’ime ya ka a na-agụ onye ọ bụla kwere ekwe dịka onye ezi omume[a].
  rationale: The revision keeps the draft’s sound contextual identification of Jesus and its forensic rendering of δικαιοῦται, while making the reckoning expression more idiomatic in Standard Igbo. The footnote continues to signal the Greek phrase’s viable instrumental rendering and does not treat that ambiguity as doctrinally settled beyond the immediate context.
