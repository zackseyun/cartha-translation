  text: ἐν τούτῳ πᾶς ὁ πιστεύων δικαιοῦται.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/039.yaml
  text: In him everyone who believes is justified[a].
translation:
  language: ig
  text: N’ime ya ka a na-agụ onye ọ bụla kwere ekwe dịka onye ezi omume[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Site n’onye a ka a na-agụ onye ọ bụla kwere ekwe dịka onye ezi omume.” A pụrụ ịsụgharị okwu Grik ἐν τούτῳ n’ụzọ kpọmkwem dịka “n’ime onye a” ma ọ bụ “site n’onye a”; n’ọnọdụ a, ọ na-ezo aka na Jizọs.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: N’ime ya
  rationale: Ndị okwu gbara amaokwu a gburugburu na-arụtụ aka na Jizọs; “N’ime ya” na-egosipụta njikọ ahụ n’Igbo dị mfe ma na-edobe usoro okwu Grik ahụ. Ihe e dere n’ala peeji na-egosikwa na e nwere ike ịghọta ya n’ụzọ na-akọwa onye ahụ dịka ụzọ e si eme ihe.
- source_word: πᾶς ὁ πιστεύων
  choice: onye ọ bụla kwere ekwe
  rationale: Nke a bụ ụzọ Igbo nkịtị si akọwa participle ahụ e ji mee aha, nke na-ezo aka n’ozuzu onye ọ bụla nwere okwukwe.
- source_word: δικαιοῦται
  choice: a na-agụ … n’onye ezi omume
  rationale: Nhọrọ a na-edobe echiche ikpe nke ngwaa Grik δικαιόω—ịgụ ma ọ bụ ikwupụta mmadụ dịka onye ezi omume—n’emeghị ka ọ bụrụ mgbanwe omume n’ime mmadụ.
theological_decisions:
- issue: Onye ἐν τούτῳ na-ezo aka na ya
  choice: “N’ime ya,” nke na-ezo aka na Jizọs
  alternative: “Site n’onye a”
  rationale: Amaokwu ndị dị ya nso kwuru banyere Jizọs dịka onye e si n’aka ya na-ekwusa mgbaghara mmehie. Ma ebe preposishọn Grik ahụ nwekwara ike igosi ụzọ e si eme ihe, e debere nke ahụ n’ihe e dere n’ala peeji.
- issue: Ihe δικαιοῦται pụtara n’okwu Pọl
  choice: “a na-agụ … n’onye ezi omume”
  alternative: “a na-eme ka … bụrụ onye ezi omume”
  rationale: Nhọrọ a na-edobe akụkụ metụtara ikpe na nkwupụta ikpe ziri ezi, ma zere ime ka okwu ahụ pụta naanị mgbanwe omume ma ọ bụ agwa.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma doo anya, dee ya. “A na-agụ … n’onye ezi omume” bụ okwu nghọta nke na-echekwa ụda ikpe dị na ngwaa Grik ahụ, ebe “onye ọ bụla kwere ekwe” bụ okwu nkịtị ndị na-agụ Igbo ga-aghọta ngwa ngwa.
