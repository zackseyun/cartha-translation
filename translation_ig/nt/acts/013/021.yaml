  text: κἀκεῖθεν ᾐτήσαντο βασιλέα, καὶ ἔδωκεν αὐτοῖς ὁ θεὸς τὸν Σαοὺλ υἱὸν Κίς, ἄνδρα ἐκ φυλῆς Βενιαμίν, ἔτη τεσσεράκοντα·
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/021.yaml
  text: And from there they asked for a king[a], and God gave them Saul son of Kish, a man from the tribe of Benjamin[b], for forty years.
translation:
  language: ig
  text: Mgbe ahụ gasịrị, ha rịọrọ ka e nye ha eze[a], Chineke wee nye ha Sọl, nwa Kish, nwoke sitere n’ebo Benjamin, ka ọ bụrụ eze afọ iri anọ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Site n’ebe ahụ, ha rịọrọ ka e nye ha eze.” Okwu mmalite ahụ nwekwara ike ịrụ ọrụ dịka njikọ na-egosi ihe sochirinụ n’usoro akụkọ.
    reason: lexical_alternative
  - marker: b
    text: Ụfọdụ na-ahụ na “afọ iri anọ” nwere ike ịkpalite ajụjụ gbasara usoro afọ ma e jiri ya tụnyere ihe ndekọ Agba Ochie; nsụgharị a na-edobe okwu Luk dịka o si dị.
    reason: cross_reference
lexical_decisions:
- source_word: κἀκεῖθεν
  choice: Site n’ebe ahụ gaa
  rationale: Okwu a jikọtara akụkọ a na usoro akụkọ gara aga. Nsụgharị a na-edobe echiche nke isi n’ebe ahụ gaa n’ihu, ma na-arụkwa ọrụ dị ka njikọ n’usoro oge.
- source_word: ᾐτήσαντο βασιλέα
  choice: ha rịọrọ ka e nye ha eze
  rationale: Ụdị ngwaa ahụ na-egosi na ndị ahụ rịọrọ ihe maka onwe ha. Nke a bụ Igbo nkịtị ma ghara ime ka arịrịọ ahụ sie ike karịa ka Grik si kwuo.
- source_word: ἔδωκεν αὐτοῖς ὁ θεὸς
  choice: Chineke wee nye ha
  rationale: A na-edobe Chineke dịka onye mere ihe ahụ, tinyekwa ngwaa nkịtị ‘nye’ kama ịkọwa ya n’ụzọ ga-eme ka ihe ọ pụtara dị warara.
- source_word: τὸν Σαοὺλ υἱὸν Κίς
  choice: Sọl nwa Kish
  rationale: Nke a na-eji ụdị aha mmadụ na nke nna ya a na-ejikarị eme ihe n’Igbo.
- source_word: ἄνδρα ἐκ φυλῆς Βενιαμίν
  choice: nwoke si n’ebo Benjamin
  rationale: ‘Nwoke’ na-egosipụta ἀνήρ n’ụzọ ziri ezi, ebe ‘si n’ebo’ na-edobe ike nke ἐκ, ya bụ ebe o si pụta.
- source_word: ἔτη τεσσεράκοντα
  choice: ka ọ bụrụ eze afọ iri anọ
  rationale: Akpaokwu a na-egosi ogologo oge. Ịkpọghachi ọrụ eze n’Igbo na-eme ka njikọ ya na Sọl doo anya ma na-edobe afọ iri anọ nke ederede ahụ kwuru.
theological_decisions:
- issue: Ihe ἔτη τεσσεράκοντα (‘afọ iri anọ’) na-akọwa
  choice: 'E jikọtara ya na oge Sọl bụ eze: ‘ka ọ bụrụ eze afọ iri anọ.’'
  alternative: A pụrụ ịghọta ya n’ụzọ sara mbara dịka akụkụ nke nchịkọta akụkọ ahụ, ọ bụ ezie na ọ na-akpalite ajụjụ gbasara usoro afọ n’ihe ndekọ Agba Ochie.
  rationale: N’usoro ahịrịokwu Grik, okwu oge ahụ kacha dabara n’ihe e kwuru ozugbo banyere Chineke inye ha Sọl. Nsụgharị ahụ anaghị anwa idozi ma ọ bụ ime ka ajụjụ usoro afọ kwekọọ n’ụzọ na-adịghị n’ederede.
translation_notes:
  register: Ejiri Standard Igbo dị ugbu a, nke ugwu na ịdị mfe ya kwekọrọ n’ọgụgụ Akwụkwọ Nsọ. ‘Rịọrọ ka e nye ha eze’ bụ okwu doro anya nye ndị nkịtị; ‘ebo Benjamin’ na-edobe okwu agbụrụ Akwụkwọ Nsọ. E tinyere ‘ka ọ bụrụ eze’ iji mee ka njikọ afọ iri anọ doo anya n’Igbo, n’enweghị idozi esemokwu usoro afọ.
