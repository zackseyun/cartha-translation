revisions:
- from: Site n’ebe ahụ gaa, ha rịọrọ ka e nye ha eze[a], Chineke wee nye ha Sọl nwa Kish, nwoke si n’ebo Benjamin, ka ọ bụrụ eze afọ iri anọ.[b]
  to: Mgbe ahụ gasịrị, ha rịọrọ ka e nye ha eze[a], Chineke wee nye ha Sọl, nwa Kish, nwoke sitere n’ebo Benjamin, ka ọ bụrụ eze afọ iri anọ.[b]
  rationale: The revision replaces an unnatural, overly directional rendering of κἀκεῖθεν with an idiomatic sequential expression. It retains the explicit kingly function as a contextually necessary clarification in Igbo, without attempting to harmonize the forty-year statement, and improves the phrasing of Saul’s Benjaminite origin.
  reviewer_model: gpt-5.6-terra
