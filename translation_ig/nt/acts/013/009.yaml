  text: Σαῦλος δέ, ὁ καὶ Παῦλος, πλησθεὶς πνεύματος ⸀ἁγίου ἀτενίσας εἰς αὐτὸν
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/009.yaml
  text: But Saul[a], who was also called Paul, filled with the Holy Spirit, looked intently at him
translation:
  language: ig
  text: Ma Sọl[a], onye a na-akpọkwa Pọl, jupụtara na Mmụọ Nsọ, legidere ya anya nke ọma.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Sọl, onye bụkwa Pọl.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Σαῦλος
  choice: Sọl
  rationale: E depụtara aha Hibru a n’ụdị a na-ejikarị ya ede n’Igbo.
- source_word: δέ
  choice: Ma
  rationale: Ọ na-egosi obere ntụgharị ma ọ bụ ihe dịtụ iche n’ihe akụkọ ahụ kwuru tupu ya.
- source_word: ὁ καὶ Παῦλος
  choice: onye a na-akpọkwa Pọl
  rationale: Ọ na-akọwa na Sọl nwekwara aha ọzọ, Pọl; nsụgharị a bụ Igbo nkịtị ma ọ naghị ekwu ihe mere e ji nwee aha abụọ ahụ.
- source_word: πλησθεὶς
  choice: jupụtara
  rationale: Ọ na-egosipụta ọnọdụ sitere n’omume e mere Sọl, ma na-adaba n’usoro okwu Igbo.
- source_word: πνεύματος ἁγίου
  choice: na Mmụọ Nsọ
  rationale: N’ọnọdụ a n’Ọrụ Ndịozi, okwu ahụ na-ezo aka na Mmụọ Nsọ nke Chineke.
- source_word: ἀτενίσας
  choice: legidere ... anya nke ọma
  rationale: Ọ na-egosi ile mmadụ anya n’ụzọ siri ike ma nọgide na-ele ya.
- source_word: εἰς αὐτόν
  choice: ya
  rationale: N’usoro ya na ‘legidere anya,’ ọ na-egosi onye Sọl tụkwasịrị anya, ya bụ Elimas.
theological_decisions:
- issue: Nsụgharị πνεύματος ἁγίου
  choice: Mmụọ Nsọ
  alternative: mmụọ dị nsọ
  rationale: Ojiji Luk na ọnọdụ nke inye ike n’Ọrụ Ndịozi na-egosi na nke a bụ Mmụọ Nsọ nke Chineke, ọ bụghị naanị mmụọ a na-akọwa dị ka onye dị nsọ.
- issue: Mmekọrịta aha Sọl na Pọl
  choice: onye a na-akpọkwa Pọl
  alternative: onye bụkwa Pọl
  rationale: Nsụgharị a na-echekwa echiche na otu onye ahụ nwere aha abụọ, n’etinyeghị nkọwa banyere mgbanwe aha ma ọ bụ ihe kpatara aha ndị ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. ‘Legidere ya anya nke ọma’ na-enye ike ἀτενίσας n’enweghị okwu siri ike ma ọ bụ nke ochie.
