source:
  edition: SBLGNT
  text: ἀναστὰς δὲ Παῦλος καὶ κατασείσας τῇ χειρὶ εἶπεν· Ἄνδρες Ἰσραηλῖται καὶ οἱ φοβούμενοι τὸν θεόν, ἀκούσατε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/016.yaml
  text: So Paul stood up[a], and motioning with his hand said, “Men of Israel and you who fear God, listen.”
translation:
  language: ig
  text: Pọl biliri, fefere aka ya, sị, “Ndị ikom Izrel na unu ndị na-atụ egwu Chineke[a], geenụ ntị.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịghọta okwu a dịka aha a na-akpọ “ndị na-atụ egwu Chineke.” O yikarịrị ka ọ na-ezo aka n’ebe a ná ndị Jentaịl na-efe Chineke, ndị na-esonyere ndị Juu n’ụlọ nzukọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστὰς
  choice: biliri ọtọ
  rationale: Nke a na-egosi n'ụzọ doro anya na Pọl si n'ọnọdụ ọ nọ bilie ọtọ tupu o kwuo okwu.
- source_word: δὲ
  choice: Ya mere
  rationale: N'ebe a, δέ na-aga n'ihu n'akụkọ ahụ, ọ naghị egosi nnukwu mmegide; ‘Ya mere’ na-eme ka okwu ahụ gaa were were n'Igbo.
- source_word: κατασείσας τῇ χειρὶ
  choice: were aka ya mee ihe ịrịba ama
  rationale: Nke a na-egosi mmegharị aka e ji adọta uche ndị mmadụ ma ọ bụ gwa ha ka ha nọrọ jụụ, na-enweghị ịkọwa ụdị mmegharị ahụ karịa ihe Grik kwuru.
- source_word: εἶπεν
  choice: sị
  rationale: ‘Sị’ bụ ụzọ Igbo dị nkenke ma bụrụkwa nke a na-ejikarị webata okwu mmadụ kwuru kpọmkwem.
- source_word: Ἄνδρες Ἰσραηλῖται
  choice: Ndị ikom Izrel
  rationale: Nke a na-echekwa ịkpọ ndị nwoke kpọmkwem nke dị na ἄνδρες, tinyekwa njirimara ha dị ka ndị Izrel.
- source_word: οἱ φοβούμενοι τὸν θεόν
  choice: unu ndị na-atụ egwu Chineke
  rationale: Nke a na-echekwa ọdịdị ngwaa nke okwu Grik ahụ ma ghara ime ya aha otu pụrụ iche n'ahịrịokwu bụ isi.
- source_word: ἀκούσατε
  choice: geenụ ntị
  rationale: Nke a bụ iwu a gwara ọtụtụ mmadụ ka ha gee ntị nke ọma; ọ bụ okwu Igbo nkịtị ma kwesịkwa ekwesị n'ọnọdụ a.
theological_decisions:
- issue: Okwu a gwara ndị Izrel na ìgwè nke abụọ na-atụ egwu Chineke n'ụlọ nzukọ
  choice: “Ndị ikom Izrel na unu ndị na-atụ egwu Chineke”
  alternative: “Ndị ikom Izrel na unu ndị a na-akpọ ndị na-atụ egwu Chineke”
  rationale: Grik kewara ndị Izrel na ìgwè nke abụọ a kọwara dị ka ndị na-atụ egwu Chineke. Nsụgharị a na-echekwa ọdịiche ahụ, ma ọ naghị ekpebi n'ahịrịokwu bụ isi na okwu ahụ bụ aha teknịkal maka otu ndị Jentaịl.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. ‘Ndị ikom’ na-echekwa na okwu Grik kpọrọ ndị nwoke kpọmkwem; ‘unu ndị na-atụ egwu Chineke’ na-anọgide n'ụzọ nkọwa kama iji aha teknịkal n'ahịrịokwu bụ isi.
