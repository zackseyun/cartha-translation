revisions:
- from: Mgbe ha na-ejere Onyenwe anyị ozi[a] ma na-ebu ọnụ, Mmụọ Nsọ kwuru, “Ugbu a, kewapụtanụ Banabas na Sọl nye m maka ọrụ ahụ m kpọrọ ha ịrụ.”
  to: Mgbe ha na-ejere Onyenwe anyị ozi[a] ma na-ebu ọnụ, Mmụọ Nsọ kwuru, “Kewapụtanụ Banabas na Sọl iche maka m, maka ọrụ ahụ m kpọrọ ha ka ha rụọ.”
  rationale: The revision removes the unnecessary temporal force introduced by “Ugbu a,” uses a natural Igbo expression for setting people apart for the Spirit’s purpose, and clarifies the footnote while preserving the source’s service-and-worship nuance. It retains the ambiguity of λειτουργούντων and does not add ecclesial or doctrinal specification.
