id: ACT.13.2
reference: Acts 13:2
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: λειτουργούντων δὲ αὐτῶν τῷ κυρίῳ καὶ νηστευόντων εἶπεν τὸ πνεῦμα τὸ ἅγιον· Ἀφορίσατε δή μοι τὸν Βαρναβᾶν ⸀καὶ Σαῦλον εἰς τὸ ἔργον ὃ προσκέκλημαι αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/002.yaml
  text: While they were ministering to the Lord and fasting[a], the Holy Spirit said, “Set apart for me Barnabas and Saul for the work to which I have called them.”
translation:
  language: ig
  text: Mgbe ha na-ejere Onyenwe anyị ozi[a] ma na-ebu ọnụ, Mmụọ Nsọ kwuru, “Kewapụtanụ Banabas na Sọl iche maka m, maka ọrụ ahụ m kpọrọ ha ka ha rụọ.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Mgbe ha na-efe Onyenwe anyị.” Okwu Grik a nwekwara ike izo aka n’ijere Onyenwe anyị ozi n’ụzọ nwere mmetụta ofufe ma ọ bụ emume nsọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: λειτουργούντων
  choice: na-ejere Onyenwe anyị ozi
  rationale: Nkebiokwu a na-egosi ijere onye ozi, ma okwu Grik ahụ nwekwara nghọta nke ofufe ma ọ bụ ọrụ emume. Nsụgharị a na-edobe ma akụkụ ọrụ ma akụkụ nsọpụrụ n’enweghị ime ka ọ bụrụ naanị emume chọọchị.
- source_word: τῷ κυρίῳ
  choice: Onyenwe anyị
  rationale: Nke a bụ ụzọ doro anya, dịkwa ugwu e si asụ κύριος n’Igbo; ọ na-egosikwa na ọ bụ Onyenwe anyị ka ozi ha na-ejere dịịrị.
- source_word: νηστευόντων
  choice: na-ebu ọnụ
  rationale: Nke a bụ okwu Igbo a na-ejikarị eme ihe maka izere nri n’ihi ekpere ma ọ bụ ofufe; usoro ‘na-’ na-egosi na omume abụọ ahụ na-aga n’otu oge.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: Mmụọ Nsọ
  rationale: Nke a bụ aha a na-ejikarị eme ihe n’Igbo ugbu a, ma ọ na-edobe Mmụọ Nsọ dị ka onye kwuru okwu ahụ.
- source_word: Ἀφορίσατε
  choice: kewapụtanụ
  rationale: Okwu a na-egosi iwepụta ndị ahụ iche maka nzube pụrụ iche. Ọ naghị etinye echiche nke echichi n’ọkwa chọọchị nke okwu Grik ahụ ekwughị kpọmkwem.
- source_word: δή
  choice: Ugbu a
  rationale: δή na-enye iwu ahụ ume na ngwa ngwa. ‘Ugbu a’ na-egosipụta nke a n’Igbo n’ụzọ kwụ ọtọ ma bụrụkwa nke sitere n’ihe odide Grik.
- source_word: μοι
  choice: nye m
  rationale: Ọ na-egosi na ọ bụ maka Mmụọ Nsọ na nzube ya ka a ga-ekewapụ ha.
- source_word: Βαρναβᾶν καὶ Σαῦλον
  choice: Banabas na Sọl
  rationale: A sụgharịrị aha ndị a dịka usoro mkpọpụta a maara nke ọma n’Igbo.
- source_word: εἰς τὸ ἔργον
  choice: maka ọrụ ahụ
  rationale: ‘Ọrụ’ na-edobe obosara nke ἔργον n’enweghị imechi ya n’okwu nka dịka ọkwa, ozi chọọchị, ma ọ bụ echichi.
- source_word: ὃ προσκέκλημαι αὐτούς
  choice: m kpọrọ ha ịrụ
  rationale: Ọ na-egosi na ọkpụkpọ ahụ adịlarị ma ka na-emetụta ọrụ a ugbu a; usoro a bụkwa Igbo dị mfe ma doo anya.
theological_decisions:
- issue: Ihe λειτουργούντων pụtara n’ọnọdụ ofufe, ibu ọnụ, na iziga mmadụ n’ozi
  choice: na-ejere Onyenwe anyị ozi
  alternative: na-efe Onyenwe anyị
  rationale: Okwu Grik ahụ nwere ike ịgụnye ofufe ma ọ bụ ọrụ metụtara emume, ma ọ bụghị iwu na ọ pụtara nanị ofufe. Isi nsụgharị ahụ na-edobe obosara ya, ebe nkọwa ala peeji na-egosi ụzọ ọzọ e nwere ike isi ghọta ya.
- issue: Mmụọ Nsọ dịka onye kwuru okwu
  choice: Mmụọ Nsọ kwuru
  alternative: Enweghị ọzọ etinyere
  rationale: Asụsụ Grik mere Mmụọ Nsọ onye mere omume ikwu okwu; nsụgharị ahụ na-edobe nke a kpọmkwem, ọ dịghịkwa eme ka Mmụọ Nsọ bụrụ naanị ike na-enweghị onye bụ ya.
- issue: Ụdị ikewapụ Banabas na Sọl maka ọrụ
  choice: kewapụtanụ ... maka ọrụ ahụ
  alternative: họpụtaanụ ... maka ozi chọọchị
  rationale: Amaokwu ahụ na-ekwu maka ikewapụ ha maka ọrụ Chineke kpọrọ ha, ma ọ kpọghị ya echichi ma ọ bụ ọkwa pụrụ iche n’usoro chọọchị. Ya mere, a hapụrụ okwu ahụ ka ọ dị obosara.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. ‘Na-ejere ... ozi’ bụ usoro nkịtị nke na-edobe nghọta ọrụ na ofufe; ‘kewapụtanụ’ na-ezere itinye echiche echichi ma ọ bụ ọkwa chọọchị n’ebe ihe odide ahụ na-ekwughị ya.
