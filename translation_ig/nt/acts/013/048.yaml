  text: ἀκούοντα δὲ τὰ ἔθνη ⸀ἔχαιρον καὶ ἐδόξαζον τὸν λόγον τοῦ ⸀κυρίου, καὶ ἐπίστευσαν ὅσοι ἦσαν τεταγμένοι εἰς ζωὴν αἰώνιον·
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/048.yaml
  text: When the Gentiles heard this[a], they began rejoicing and glorifying the word of the Lord, and all who had been appointed for eternal life believed.
translation:
  language: ig
  text: 'Mgbe ndị mba ọzọ nụrụ nke a, ha malitere ịṅụrị ọṅụ na inye okwu Onyenwe anyị otuto; ndị niile e debere maka ndụ ebighị ebi[a] wee kwere.


    [a] Ma ọ bụ, “ndị niile obi ha dị njikere maka ndụ ebighị ebi.” A pụrụ ịghọta participle Grik a n''ụzọ dị iche iche, ma nghọta kacha doo anya n''ebe a bụ “ndị e debere.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị niile obi ha dị njikere maka ndụ ebighị ebi.” A pụrụ ịghọta participle Grik a n'ụzọ dị iche iche, ma nghọta kacha doo anya n'ebe a bụ “ndị e debere.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἀκούοντα
  choice: Mgbe ... nụrụ nke a
  rationale: E ji nkebiokwu oge mee ka participle ahụ bụrụ Igbo eke; a gbakwụnyere “nke a” site n’ihe e kwuru n’amaokwu ndị bu ụzọ.
- source_word: τὰ ἔθνη
  choice: ndị mba ọzọ
  rationale: N’ebe a ọ na-ezo aka ná ndị na-abụghị ndị Juu, ọ bụghị naanị mba dị iche iche.
- source_word: ἔχαιρον καὶ ἐδόξαζον
  choice: ha malitere ịṅụrị ọṅụ na ito
  rationale: “Malitere” na-egosipụta ike inceptive nke imperfect abụọ ahụ, ebe “ito” bụ ụzọ Igbo doro anya isi kwuo inye okwu ahụ otuto.
- source_word: τὸν λόγον τοῦ κυρίου
  choice: okwu Onyenwe anyị
  rationale: “Okwu” na-echekwa akpaalaokwu Akwụkwọ Nsọ na ihe ọ pụtara dịka ozi a kpọsara; “Onyenwe anyị” bụ nsụgharị ọkọlọtọ nke κύριος.
- source_word: ἐπίστευσαν
  choice: wee kwere
  rationale: Simple past nke Igbo na-egosipụta omume aorist ahụ n’enweghị mgbasawanye nkọwa.
- source_word: ὅσοι
  choice: ndị niile
  rationale: Nke a na-enye quantitative force nke ὅσοι n’Igbo eke.
- source_word: τεταγμένοι
  choice: e debere
  rationale: Perfect passive participle nke τάσσω na-egosi ọnọdụ sitere n’ịhọpụta ma ọ bụ idobe ha; “e debere” na-echekwa passive ahụ n’enweghị itinye ozizi sara mbara karịa amaokwu ahụ.
- source_word: εἰς ζωὴν αἰώνιον
  choice: maka ndụ ebighị ebi
  rationale: “Maka” na-egosipụta ntụziaka ma ọ bụ ebumnuche nke εἰς n’Igbo dị mfe nghọta.
theological_decisions:
- issue: Ihe τεταγμένοι pụtara banyere idobe mmadụ na nzaghachi okwukwe ya
  choice: ndị niile e debere maka ndụ ebighị ebi
  alternative: ndị niile obi ha dị njikere maka ndụ ebighị ebi
  rationale: Ụdị passive nke participle ahụ na-akwado “e debere” dịka nghọta kacha kwụ ọtọ. Nsụgharị ahụ anaghị akọwa onye mere idobe ahụ ma ọ bụ wulite ozizi zuru ezu banyere akara aka; e debere nghọta ọzọ n’ala peeji iji chekwaa esemokwu nkọwa dị n’ederede.
translation_notes:
  register: Standard Igbo dị ugbu a, dị nsọ ma dị mfe nghọta. E ji “ndị mba ọzọ” mee ka ọdịiche dị n’etiti ndị Juu na ndị na-abụghị ndị Juu doo anya; e zere okwu ụka pụrụ iche na nkọwa ozizi agbakwunyere.
