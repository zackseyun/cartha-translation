    text: Ma ọ bụ, “onye iro nke ikpe ziri ezi ọ bụla.” Okwu Grik a nwere ike ịpụta ezi omume ma ọ bụ ikpe ziri ezi, dị ka ọnọdụ okwu si dị.
    reason: lexical_alternative
