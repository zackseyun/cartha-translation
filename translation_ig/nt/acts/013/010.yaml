id: ACT.13.10
reference: Acts 13:10
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἶπεν· Ὦ πλήρης παντὸς δόλου καὶ πάσης ῥᾳδιουργίας, υἱὲ διαβόλου, ἐχθρὲ πάσης δικαιοσύνης, οὐ παύσῃ διαστρέφων τὰς ⸀ὁδοὺς κυρίου τὰς εὐθείας;
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/010.yaml
  text: And he said[a], “You who are full of every kind of deceit and every kind of villainy, son of the devil, enemy of all righteousness, will you not stop twisting the straight ways of the Lord?”
translation:
  language: ig
  text: Ọ sịrị, “Gị onye jupụtara n’aghụghọ niile na ajọ omume niile, nwa Ekwensu, onye iro nke ezi omume niile, ị̀ gaghị akwụsị ịgbagọ ụzọ ziri ezi nke Onyenwe anyị?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πλήρης παντὸς δόλου
  choice: onye aghụghọ dị iche iche ... jupụtara n’ime ya
  rationale: Nke a na-egosi na ụdị aghụghọ niile jupụtara n’onye ahụ, ma na-asụkwa ya n’ụzọ Igbo nke oge a na-ada nke ọma.
- source_word: πάσης ῥᾳδιουργίας
  choice: arụrụala dị iche iche
  rationale: “Arụrụala” na-egosi omume ọjọọ nke enweghị akọ na uche, ọ bụghị naanị ihe ọjọọ n’ozuzu; “dị iche iche” na-eburu ike nke πάσης.
- source_word: υἱὲ διαβόλου
  choice: nwa Ekwensu
  rationale: “Nwa” na-edobe ihe υἱέ pụtara kpọmkwem nakwa ike nke mba ahụ; okwu ahụ na-egosi onye yiri Ekwensu n’omume ma ọ bụ onye nọ n’akụkụ ya.
- source_word: ἐχθρὲ πάσης δικαιοσύνης
  choice: onye iro ezi omume niile
  rationale: “Ezi omume” na-egosi ịdị n’ezi na ime ihe ziri ezi, ebe “niile” na-edobe nghọta zuru ezu nke πάσης. A na-edobe “ikpe ziri ezi” dị ka ihe ọzọ n’okpuru amaokwu.
- source_word: οὐ παύσῃ
  choice: ị̀ gaghị akwụsị
  rationale: Ajụjụ a na-ada ka mba siri ike n’Igbo ma na-edobe ọdịdị ajụjụ nke Grik n’etinyeghị “mgbe ọ bụla,” nke ga-eme ka okwu ahụ sie ike karịa isi mmalite.
- source_word: διαστρέφων
  choice: ịgbagọ
  rationale: “Ịgbagọ” na-edobe ihe atụ nke ime ka ihe kwụ ọtọ gbagọọ, ya mere o kwekọrọ n’ụzọ ndị a kpọrọ ndị kwụ ọtọ.
- source_word: τὰς ὁδοὺς κυρίου τὰς εὐθείας
  choice: ụzọ Onyenwe anyị ndị kwụ ọtọ
  rationale: “Ụzọ” nwere ike ịpụta ụzọ a na-aga na ụzọ e si ebi ndụ; “ndị kwụ ọtọ” na-edobe ihe atụ na nkwusi ike nke τὰς εὐθείας.
- source_word: Ὦ
  choice: Gị onye
  rationale: Nke a na-eburu oku ihu na ihu nke Ὦ n’Igbo dị ugbu a n’enweghị ụdị okwu ochie na-adịghị eke.
theological_decisions:
- issue: Nsụgharị δικαιοσύνη
  choice: ezi omume
  alternative: ikpe ziri ezi
  rationale: N’ebe a, okwu ahụ na-elekwasị anya n’ihe niile dị mma, ziri ezi, ma kwụ ọtọ. Otú ọ dị, δικαιοσύνη nwekwara ike ịpụta ikpe ziri ezi, ya mere e debere nke ahụ n’okpuru amaokwu kama ikpochapụ nghọta abụọ ahụ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma doo ndị nkịtị anya. Usoro “Gị onye...” na-enye mba ahụ ike n’enweghị okwu ochie; e debekwara ihe atụ nke ịgbagọ ụzọ ndị kwụ ọtọ.
