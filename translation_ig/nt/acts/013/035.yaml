source:
  edition: SBLGNT
  text: ⸀διότι καὶ ἐν ἑτέρῳ λέγει· Οὐ δώσεις τὸν ὅσιόν σου ἰδεῖν διαφθοράν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/035.yaml
  text: Therefore he also says in another psalm[c][b][a], ‘You will not let your Holy One see decay.’
translation:
  language: ig
  text: N’ihi ya, ọ na-ekwukwa n’Abụ Ọma ọzọ[a], “Ị gaghị ekwe ka Onye Nsọ gị[b] hụ ire ere[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’ebe ọzọ” ma ọ bụ “n’akụkụ Akwụkwọ Nsọ ọzọ”; n’asụsụ Grik, ihe e kwuru bụ naanị “n’ọzọ.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “onye kwesịrị ntụkwasị obi nke gị.”
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “mmebi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διότι
  choice: N’ihi ya
  rationale: N’ebe a okwu ahụ na-egosi ihe e si n’ihe e kwuru tupu ya kwubie, ya mere ‘N’ihi ya’ na-egosipụta njikọ ahụ nke ọma n’Igbo.
- source_word: καὶ
  choice: -kwa
  rationale: Mgbakwunye ‘-kwa’ na ngwaa ‘na-ekwu’ na-egosi na nke a bụ amaokwu Akwụkwọ Nsọ ọzọ e tinyere iji kwado arụmụka ahụ.
- source_word: ἐν ἑτέρῳ
  choice: n’abụ ọma ọzọ
  rationale: N’asụsụ Grik, aha na-eso ‘ọzọ’ adịghị, ma ihe e hotara sitere n’Abụ Ọma 16. Ịtinye ‘abụ ọma’ na-eme ka okwu ahụ doo onye na-agụ ya anya n’enweghị ịgbanwe ihe ọ pụtara; e debere nhọrọ ndị ọzọ n’ala peeji.
- source_word: λέγει
  choice: ọ na-ekwu
  rationale: E jigidere oge ugbu a nke usoro e ji ewebata ihe Akwụkwọ Nsọ kwuru. Nnọchiaha ahụ na-ahapụkwa ohere ka onye na-agụ ya ghọta onye na-ekwu okwu site n’ihe gbara amaokwu ahụ gburugburu.
- source_word: Οὐ δώσεις
  choice: Ị gaghị ekwe ka
  rationale: N’agbanyeghị na δίδωμι pụtara ‘inye’ n’ụzọ nkịtị, mgbe infinitive so ya n’usoro a, ọ pụtara ikwe ma ọ bụ ịhapụ ka ihe mee.
- source_word: τὸν ὅσιόν σου
  choice: Onye Nsọ gị
  rationale: ὅσιος nwere ike ịpụta onye dị nsọ, onye ji obi ya niile fee Chineke, ma ọ bụ onye kwesịrị ntụkwasị obi. ‘Onye Nsọ gị’ na-echekwa isi echiche ahụ ma kwekọọ n’otú Pọl si tinye amaokwu a n’ọrụ banyere Jizọs.
- source_word: ἰδεῖν
  choice: hụ
  rationale: Nke a bụ ntụgharị kpọmkwem nke ὁράω, usoro ‘hụ ire ere’ na-arụkwa ọrụ n’Igbo n’enweghị ịkọwa ihe karịrị isi mmalite ahụ.
- source_word: διαφθοράν
  choice: ire ere
  rationale: N’arụmụka banyere mbilite n’ọnwụ, okwu a na-ezo aka n’ire ere nke ahụ. ‘Ire ere’ bụ okwu Igbo doro anya ma dị ugbu a; ‘mmebi’ ka e nyere dị ka nhọrọ ọzọ.
theological_decisions:
- issue: Onye Abụ Ọma ahụ na-ezo aka na ya n’otú Pọl si kọwaa ya
  choice: Onye Nsọ gị
  alternative: onye gị na-eguzosi ike n’ihe
  rationale: N’Ọrụ Ndị Ozi 13, Pọl na-etinye okwu Abụ Ọma a n’ọrụ kpọmkwem banyere mbilite n’ọnwụ Jizọs. ‘Onye Nsọ’ na-echekwa echiche ịdị nsọ ahụ, ebe mkpụrụedemede ukwu na-egosi onye okwu a na-ezo aka na ya n’ebe a, ọ bụghị ịgbakwunye nkụzi ọhụrụ.
- issue: Aha a ghọtara ma a kpọghị aha ya mgbe ἐν ἑτέρῳ gasịrị
  choice: abụ ọma ọzọ
  alternative: ebe ọzọ; akụkụ Akwụkwọ Nsọ ọzọ
  rationale: Ihe e hotara bụ Abụ Ọma 16, ihe ndị gbara ya gburugburu bụkwa usoro ihe e hotara n’Akwụkwọ Nsọ. Ịkpọ ya ‘abụ ọma’ na-eme ka okwu e zoro ezo doo anya, ma ala peeji na-echekwa ọdịdị na-edochaghị anya nke Grik.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe ma nwee ugwu, dee ya. E jigidere usoro okwu amaokwu e hotara, ma jiri ‘ire ere’ mee ka ihe gbasara ahụ nwụrụ anwụ doo anya. Akara ala peeji [a], [b], na [c] niile pụtara n’ederede isi.
