id: ACT.13.22
reference: Acts 13:22
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ μεταστήσας αὐτὸν ἤγειρεν ⸂τὸν Δαυὶδ αὐτοῖς⸃ εἰς βασιλέα, ᾧ καὶ εἶπεν μαρτυρήσας· Εὗρον Δαυὶδ τὸν τοῦ Ἰεσσαί, ἄνδρα κατὰ τὴν καρδίαν μου, ὃς ποιήσει πάντα τὰ θελήματά μου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/022.yaml
  text: And after removing him[a], he raised up David for them as king, to whom he also bore witness and said, ‘I have found David the son of Jesse, a man according to my heart[b], who will do all my will.’
translation:
  language: ig
  text: Mgbe o wepụsịrị ya, o welitere Devid ka ọ bụrụ eze ha. Ọ gbakwara ama banyere ya, sị, “Achọtala m Devid nwa Jesi, nwoke kwekọrọ n’obi m[a], onye ga-eme ihe niile m chọrọ[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’asụsụ Grik, okwu a pụtara n’ụzọ nkịtị, “nwoke dịka obi m si chọọ,” ya bụ, nwoke kwekọrọ n’obi m.
    reason: lexical_alternative
  - marker: b
    text: Okwu Grik e ji “ihe a chọrọ” mee ebe a dị n’ụdị ọtụtụ; ọ na-ezo aka n’ihe niile dị iche iche Chineke chọrọ ma ọ bụ zubere.
    reason: lexical_alternative
lexical_decisions:
- source_word: μεταστήσας
  choice: mgbe o wepụsịrị ya
  rationale: Nke a na-egosi na Chineke wepụrụ Sọl n’ọkwa eze, na-etinyeghị nkọwa ndọrọ ndọrọ ọchịchị karịrị ihe okwu Grik kwuru.
- source_word: ἤγειρεν … εἰς βασιλέα
  choice: o welitere Devid ka ọ bụrụ eze
  rationale: “Welitere” na-echekwa akpaalaokwu Akwụkwọ Nsọ nke ἐγείρω, ebe “ka ọ bụrụ eze” na-eme ka o doo anya na ọ bụ iweta ma họpụta onye ọchịchị, ọ bụghị mbilite n’ọnwụ.
- source_word: αὐτοῖς
  choice: eze ha
  rationale: Ijikọta dativ ahụ na ọrụ eze bụ ụzọ Igbo dị ire ụtọ isi kwupụta na Chineke welitere Devid maka ndị Izrel ka ọ bụrụ eze ha.
- source_word: ᾧ καὶ εἶπεν μαρτυρήσας
  choice: Ọ gbakwara ama banyere ya, sị
  rationale: N’agbanyeghị ụdị dativ nke nnọchiaha Grik, ihe ọ pụtara n’ọnọdụ a bụ na Chineke gbara ama banyere Devid; nsụgharị a bụ Igbo ebumpụta ụwa.
- source_word: Εὗρον
  choice: Achọtala m
  rationale: Ụdị perfect Igbo a na-egosi ihe e mezuru nke ka nwere uru n’okwu Chineke ugbu a.
- source_word: τὸν τοῦ Ἰεσσαί
  choice: Devid nwa Jesi
  rationale: Nke a bụ ụzọ Igbo kwụ ọtọ na nke ebumpụta ụwa isi gosipụta mmekọrịta nna na nwa.
- source_word: ἄνδρα κατὰ τὴν καρδίαν μου
  choice: nwoke kwekọrọ n’obi m
  rationale: “Nwoke” na-edebe nkọwa nwoke nke ἀνήρ, ebe “kwekọrọ n’obi m” na-egosipụta κατά n’enweghị ime ka okwu ahụ bụrụ nanị mmetụta ịhụnanya.
- source_word: ὃς ποιήσει πάντα τὰ θελήματά μου
  choice: onye ga-eme ihe niile m chọrọ
  rationale: Nke a na-edebe ọdịnihu nke ποιήσει ma na-anọchi plural θελήματα n’Igbo ebumpụta ụwa site n’ịsị “ihe niile,” ya bụ, ihe dị iche iche Chineke chọrọ.
theological_decisions:
- issue: Nkọwa e ji mara Devid
  choice: nwoke kwekọrọ n’obi m
  alternative: nwoke dịka obi m si chọọ
  rationale: Nhọrọ a na-echekwa echiche nke ikwekọ n’obi na nzube Chineke, ma na-ezere nghọtahie na okwu ahụ bụ naanị mmetụta ịhụnanya Chineke nwere n’ebe Devid nọ.
- issue: Ihe “welitere” pụtara
  choice: o welitere Devid ka ọ bụrụ eze
  alternative: o họpụtara Devid ka ọ bụrụ eze
  rationale: “Welitere” na-echekwa okwu na ụda Akwụkwọ Nsọ, ebe nkebi na-esochi ya na-akọwa na ihe a na-ekwu bụ iweta Devid n’ọkwa eze, ọ bụghị ime ka o si n’ọnwụ bilie.
- issue: Plural nke θελήματα
  choice: ihe niile m chọrọ
  alternative: ọchịchọ m niile
  rationale: Nhọrọ a na-egosipụta ọtụtụ ihe Chineke chọrọ n’Igbo dị mfe, ma ghara ime ka plural ahụ ghọọ otu uche na-enweghị nkọwa.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta, dee amaokwu ahụ. A hapụrụ akpaalaokwu “welitere” n’ihi njikọ ya na asụsụ Akwụkwọ Nsọ, ma nkebi “ka ọ bụrụ eze” na-egbochi nghọtahie. Akara ukwu ala [a] na [b] pụtara n’ebe kwesịrị ekwesị n’isiokwu.
