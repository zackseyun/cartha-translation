id: ACT.13.27
reference: Acts 13:27
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οἱ γὰρ κατοικοῦντες ἐν Ἰερουσαλὴμ καὶ οἱ ἄρχοντες αὐτῶν τοῦτον ἀγνοήσαντες καὶ τὰς φωνὰς τῶν προφητῶν τὰς κατὰ πᾶν σάββατον ἀναγινωσκομένας κρίναντες ἐπλήρωσαν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/027.yaml
  text: For those who live in Jerusalem and their rulers[a], because they did not recognize this one and by condemning him fulfilled the voices of the prophets that are read every Sabbath[b],
translation:
  language: ig
  text: N’ihi na ndị bi na Jerusalem na ndị ọchịchị ha, ebe ha na-amataghị Onye a, site n’ịma ya ikpe mezuru olu ndị amụma ndị a na-agụ kwa ụbọchị Sabat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ: “okwu ndị amụma.” N’okwu nkịtị, Grik nwere “olu ndị amụma.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατοικοῦντες ἐν Ἰερουσαλήμ
  choice: ndị bi na Jerusalem
  rationale: Nke a na-egosipụta òtù ndị ahụ participle ahụ na-anọchi anya ya n’Igbo dị mfe ma kwekọọ na κατοικέω.
- source_word: οἱ ἄρχοντες αὐτῶν
  choice: ndị ọchịchị ha
  rationale: “Ndị ọchịchị” na-echekwa echiche nke ndị nwere ikike ọchịchị na ikpe n’ọnọdụ a.
- source_word: τοῦτον
  choice: Onye a
  rationale: Ngosipụta “Onye a” na-echekwa ike demonstrative Grik ahụ nke na-arụtụ aka kpọmkwem na Jizọs, kama iji naanị nnọchiaha.
- source_word: ἀγνοήσαντες
  choice: amataghị
  rationale: N’ọnọdụ a, okwu ahụ na-egosi na ha aghọtaghị ma ọ bụ amataghị onye Jizọs bụ, ọ bụghị nanị na ha anụbeghị banyere ya.
- source_word: τὰς φωνὰς τῶν προφητῶν
  choice: olu ndị amụma
  rationale: “Olu” na-echekwa ihe φωνάς pụtara kpọmkwem na ihe atụ doro anya nke àmà amụma a na-anụ mgbe a na-agụ Akwụkwọ Nsọ.
- source_word: τὰς κατὰ πᾶν σάββατον ἀναγινωσκομένας
  choice: bụ́ ndị a na-agụ kwa Ụbọchị Izu Ike
  rationale: Nkebi a na-ejikọta n’ụzọ nghọta na “olu ndị amụma,” ma na-egosi omume a na-eme n’Ụbọchị Izu Ike ọ bụla.
- source_word: κρίναντες
  choice: ha wee maa ya ikpe, si otú ahụ
  rationale: “Maa ya ikpe” na-egosi ikpe ọmụma e kpebiri megide Jizọs; “si otú ahụ” na-eme ka ụzọ omume ahụ si mezuo amụma pụta ìhè n’Igbo.
- source_word: ἐπλήρωσαν
  choice: mezuo
  rationale: “Mezuo” bụ okwu Igbo doro anya maka mmezu nke ihe Akwụkwọ Nsọ buru ụzọ kwuo.
- source_word: γὰρ
  choice: N’ihi na
  rationale: Ọ na-echekwa njikọ nkọwa γάρ nwere na amaokwu bu ụzọ.
theological_decisions:
- issue: Ụdị amaghị ha amaghi Jizọs
  choice: amataghị Onye a
  alternative: ha amaghị ya
  rationale: Nhọrọ a na-egosi ọdịda ha n’ịmata onye Jizọs bụ n’ezie, na-ekwughị na ha amaghị na ọ dị adị; ọ na-echekwa esemokwu nkà mmụta okpukpe dị n’ederede ahụ.
- issue: Mmekọrịta ikpe ha na mmezu amụma
  choice: ha wee maa ya ikpe, si otú ahụ mezuo
  alternative: mgbe ha mara ya ikpe, ha mezuru
  rationale: Nke a na-egosi na ikpe ha mara ya bụ ụzọ e si mezuo ihe ndị amụma kwuru, n’enweghị ikwu karịa ihe ederede Grik kwuru.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E debere “Onye a” iji chekwaa demonstrative Grik ahụ; e debekwara “olu ndị amụma,” ma kọwaa ya n’ala peeji ka ọ ghara ịdị mgbagwoju anya. E ji mkpụrụedemede ukwu dee “Onye” dịka ntụaka doro anya nye Jizọs, ma nke ahụ anaghị etinye nkọwa ụka pụrụ iche.
