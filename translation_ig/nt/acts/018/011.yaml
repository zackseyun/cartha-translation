  source_fidelity: The duration, ongoing teaching, social sense of ἐν αὐτοῖς, and τὸν λόγον τοῦ θεοῦ are conveyed accurately. However, «Ya mere» (“therefore/so”) makes δέ more inferential than its mild connective force warrants. A simple narrative connective is preferable.
