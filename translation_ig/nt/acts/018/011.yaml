  yaml_path: translation/nt/acts/018/011.yaml
  text: So he stayed there a year and six months, teaching the word of God among them.
translation:
  language: ig
  text: O wee nọrọ n’ebe ahụ otu afọ na ọnwa isii, na-ezi okwu Chineke n’etiti ha.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκάθισεν
  choice: ọ nọrọ n’ebe ahụ
  rationale: N’agbanyeghị na ngwaa a nwere ike ịpụta ‘ịnọdụ,’ n’ọnọdụ akụkọ a ọ pụtara ịnọgide n’otu ebe ruo oge a kpọrọ aha. ‘Ọ nọrọ n’ebe ahụ’ bụ Igbo nkịtị ma doo anya.
- source_word: δὲ
  choice: Ya mere
  rationale: δέ bụ njikọ dị nro. N’ebe a, ọ na-ejikọta ihe Pọl mere na agbamume Chineke dị n’amaokwu ndị bu ụzọ, n’enweghị ime ka ọdịiche pụta karịa ka isi mmalite si gosi.
- source_word: ἐνιαυτὸν καὶ μῆνας ἓξ
  choice: otu afọ na ọnwa isii
  rationale: Nke a na-egosi ogologo oge kpọmkwem; ntụgharị a bụ nke doro anya ma bụrụkwa Igbo e ji eme ihe ugbu a.
- source_word: διδάσκων
  choice: na-ezi
  rationale: Ụdị participle a na-egosi ọrụ ọ nọgidere na-arụ n’oge niile ọ nọ n’ebe ahụ. ‘Na-ezi’ na-echekwa echiche nke omume na-aga n’ihu.
- source_word: ἐν αὐτοῖς
  choice: n’etiti ha
  rationale: N’ebe a ἐν na-egosi ọnọdụ n’etiti ndị mmadụ. ‘N’etiti ha’ na-egosi na Pọl na-ezi ihe n’ime obodo ahụ, ọ bụghị ‘n’ime ha’ n’ụzọ anụ ahụ.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: okwu Chineke
  rationale: λόγος n’Ọrụ Ndịozi na-ezokarị aka n’ozi sitere n’aka Chineke. ‘Okwu Chineke’ na-echekwa okwu Baịbụl a maara nke ọma na ịdị arọ ya, ma ka na-aghọta ya ngwa ngwa.
theological_decisions: []
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị mfe nghọta ma nwee ugwu. Ahịrịokwu ahụ na-echekwa usoro akụkọ na omume izi ihe nke gara n’ihu, n’etinyeghị nkọwa ụka pụrụ iche.
