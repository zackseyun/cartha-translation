  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: μέλλοντος δὲ τοῦ Παύλου ἀνοίγειν τὸ στόμα εἶπεν ὁ Γαλλίων πρὸς τοὺς Ἰουδαίους· Εἰ ⸀μὲν ἦν ἀδίκημά τι ἢ ῥᾳδιούργημα πονηρόν, ὦ Ἰουδαῖοι, κατὰ λόγον ἂν ἀνεσχόμην ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/014.yaml
  text: But as Paul was about to open his mouth[a], Gallio said to the Jews, “If it were some wrongdoing or a serious crime, O Jews[c][b], I would reasonably put up with you.
translation:
  language: ig
  text: Ma ka Pọl na-achọ ikwu okwu[a], Galio gwara ndị Juu sị, “A sị na ọ bụ mmejọ ụfọdụ megidere iwu ma ọ bụ ajọ mpụ[b], unu ndị Juu, m ga-enwe ezi ihe mere m ji nagide unu[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ka Pọl na-achọ imeghe ọnụ ya.” Grik kwuru ya n’ụzọ nkịtị dị ka “imeghe ọnụ,” bụ́ akpaalaokwu pụtara ịmalite ikwu okwu.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “mpụ ọjọọ” ma ọ bụ “mmejọ e ji obi ọjọọ mee.” Nkebiokwu Grik ahụ jikọtara okwu maka omume mpụ na nkọwa pụtara “ọjọọ” ma ọ bụ “ajọ.”
    reason: lexical_alternative
  - marker: c
    text: N’ụzọ nkịtị, “m ga-enwe ezi ihe mere m ji nagide unu.” Okwu ahụ pụtara na Galio ga-enwe ezi ihe mere o ji anabata ma ọ bụ nagide mkpesa ha ma ọ bụrụ na ọ bụ banyere mmejọ n’ezie ma ọ bụ mpụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: μέλλοντος ... τοῦ Παύλου ἀνοίγειν τὸ στόμα
  choice: mgbe Pọl na-achọ imeghe ọnụ ya
  rationale: Ọ na-egosi na Pọl nọ nnọọ na njikere ịmalite ikwu okwu, ma na-edobekwa akpaalaokwu Grik nke pụtara ‘imeghe ọnụ.’
- source_word: δὲ
  choice: Ma
  rationale: 'Ọ na-egosi obere ntụgharị na ihe mere: Pọl chọrọ ikwu okwu, ma Galio buru ya ụzọ kwuo.'
- source_word: Γαλλίων
  choice: Galio
  rationale: E degharịrị aha onye ahụ n’ụdị dabara n’usoro mkpụrụokwu Igbo.
- source_word: πρὸς τοὺς Ἰουδαίους
  choice: gwara ndị Juu
  rationale: Nke a na-egosipụta okwu a gwara ndị Juu kpọmkwem, n’etinyeghị nkọwa ọzọ dịka ‘ndị boro ya ebubo.’
- source_word: Εἰ μὲν ἦν
  choice: A sị na ... bụ
  rationale: Ụdị a na-egosipụta ọnọdụ echiche nke Galio na-ekwu banyere ya n’Igbo dị mfe ma bụrụkwa nke e ji ekwu okwu ugbu a.
- source_word: ἀδίκημά τι
  choice: ajọ omume ụfọdụ
  rationale: Ọ na-ekpuchi echiche nke mmejọ ma ọ bụ omume megidere iwu n’enweghị ime ka ụdị mmejọ ahụ doo anya karịa ihe Grik kwuru.
- source_word: ῥᾳδιούργημα πονηρόν
  choice: mpụ jọgburu onwe ya
  rationale: Ọ na-egosipụta ma akụkụ iwu nke ‘mpụ’ ma ịdị njọ na ajọ ọdịdị nke πονηρόν.
- source_word: ὦ Ἰουδαῖοι
  choice: unu ndị Juu
  rationale: Nke a bụ ụzọ ebumpụta ụwa e si egosipụta ịkpọ ndị a na-agwa okwu aha n’Igbo, ma na-echekwa ụda okwu kpọmkwem ahụ.
- source_word: κατὰ λόγον
  choice: ọ ga-abụ ihe ziri ezi
  rationale: Akpaalaokwu a pụtara na Galio ga-enwe ezi ihe mere o ji mee otú ahụ, ma ọ bụ na ime ya ga-adaba n’ezi uche.
- source_word: ἀνεσχόμην ὑμῶν
  choice: ka m gee unu ntị
  rationale: N’ọnọdụ ụlọikpe a, ihe ọ pụtara bụ ịnagide ịnụrụ mkpesa ha. Nhọrọ a na-ada nke ọma n’Igbo, ebe nkọwa ala peeji na-echekwa echiche ‘ịnagide unu.’
