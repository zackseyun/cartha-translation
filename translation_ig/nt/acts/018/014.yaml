translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. A hapụrụ ụda Galio nke na-egosi na ọ naghị achọ ịnụ okwu ha, ma e mere ahịrịokwu ahụ ka ọ bụrụ nke ndị na-agụ Igbo ga-aghọta ozugbo. Ihe nrịbama ala peeji [a], [b], na [c] niile dị n’ederede.
