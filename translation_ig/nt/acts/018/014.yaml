    reason: lexical_alternative
  - marker: c
    text: N’ụzọ nkịtị, “m ga-enwe ezi ihe mere m ji nagide unu.” Okwu ahụ pụtara na Galio ga-enwe ezi ihe mere o ji anabata ma ọ bụ nagide mkpesa ha ma ọ bụrụ na ọ bụ banyere mmejọ n’ezie ma ọ bụ mpụ.
    reason: lexical_alternative
