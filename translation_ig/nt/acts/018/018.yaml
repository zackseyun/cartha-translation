id: ACT.18.18
reference: Acts 18:18
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ὁ δὲ Παῦλος ἔτι προσμείνας ἡμέρας ἱκανὰς τοῖς ἀδελφοῖς ἀποταξάμενος ἐξέπλει εἰς τὴν Συρίαν, καὶ σὺν αὐτῷ Πρίσκιλλα καὶ Ἀκύλας, κειράμενος ⸂ἐν Κεγχρεαῖς τὴν κεφαλήν⸃, εἶχεν γὰρ εὐχήν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/018.yaml
  text: After Paul had remained many more days[a], he said farewell to the brothers and sailed away for Syria, and with him were Priscilla and Aquila. In Cenchreae he had his head shaved[e][d][c][b], for he had a vow.
translation:
  language: ig
  text: Mgbe Pọl nọgidere ọtụtụ ụbọchị ọzọ, ọ sịrị ụmụnna ahụ ka ha dịrị nke ọma, wee jiri ụgbọ mmiri gawa Siria; Priskila na Akwịla sokwa ya. Na Kenkrea, o kpụrụ ntutu isi ya[a], n’ihi na o nwere nkwa[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “o kpachara isi ya.” Okwu Grik ahụ nwere ike ịpụta ịkpụ ntutu ma ọ bụ ịkpacha ya; ọ pụtaghị na e wepụrụ ntutu niile.
    reason: lexical_alternative
  - marker: b
    text: Ụfọdụ na-ewere na ọ bụ Akwịla kpụrụ ntutu isi ya n’ihi nkwa ahụ, ma usoro asụsụ Grik na-ezo n’ụzọ kacha mma na Pọl.
    reason: alternative_reading
  - marker: c
    text: Ihe odide ahụ kwuru naanị “nkwa.” Ọtụtụ ndị na-ejikọta ya na nkwa yiri nke onye Naziraịt, ma ekwughị nke ahụ kpọmkwem n’amaokwu a.
    reason: cultural_note
lexical_decisions:
- source_word: προσμείνας ἡμέρας ἱκανὰς
  choice: nọgidere ọtụtụ ụbọchị ọzọ
  rationale: “Nọgidere” na-egosi ịnọgide ebe ahụ, “ọtụtụ ụbọchị” na-egosi ἱκανὰς, ebe “ọzọ” na-echekwa echiche nke ἔτι.
- source_word: τοῖς ἀδελφοῖς
  choice: ụmụnna ahụ
  rationale: “Ụmụnna” bụ okwu ezinụlọ dị mma n’Igbo maka ndị kwere ekwe; ọ pụkwara ịgụnye ndị nwoke na ndị nwanyị dịka ọnọdụ okwu si dị.
- source_word: ἀποταξάμενος
  choice: ọ sịrị ụmụnna ahụ ka ha nọdụ nke ọma
  rationale: Nke a bụ ụzọ Igbo dị ndụ na nke a na-aghọta ngwa ngwa isi kwuo na ọ gwara ha okwu ịla.
- source_word: ἐξέπλει εἰς τὴν Συρίαν
  choice: jiri ụgbọ mmiri gawa Siria
  rationale: Ọ na-egosi ma ụzọ njem ahụ—ụgbọ mmiri—ma ebe ọ na-aga.
- source_word: καὶ σὺν αὐτῷ Πρίσκιλλα καὶ Ἀκύλας
  choice: Priskila na Akwịla sokwa ya
  rationale: Nke a na-egosipụta n’Igbo doro anya na ha bụ ndị so Pọl na njem ahụ.
- source_word: κειράμενος ... τὴν κεφαλήν
  choice: o kpụrụ ntutu isi ya
  rationale: κείρω nwere ike ịpụta ịkpụ ma ọ bụ ịkpacha ntutu; “kpụụrụ ntutu isi ya” na-echekwa obosara ahụ karịa ikwu kpọmkwem na ọ kpachapụrụ isi ya niile.
- source_word: ἐν Κεγχρεαῖς
  choice: Na Kenkrea
  rationale: A tụgharịrị aha obodo ahụ n’ụdị dabara na mkpọpụta na odide Igbo.
- source_word: εἶχεν γὰρ εὐχήν
  choice: n’ihi na o nwere nkwa
  rationale: Nke a na-esochi okwu Grik nso ma ghara ịkọwa ụdị nkwa ahụ karịa ihe amaokwu ahụ kwuru.
theological_decisions:
- issue: Onye κειράμενος na-ezo aka na ya
  choice: Pọl
  alternative: Akwịla
  rationale: Nkebi okwu ahụ bụ nke nwoke otu onye, ma n’usoro asụsụ ọ na-ezo n’ụzọ kacha mma n’isiokwu bụ Pọl. E debere echiche ọzọ n’ala peeji n’ihi na ụfọdụ na-ewere ya dị ka Akwịla.
- issue: Ụdị nkwa εὐχή bụ
  choice: nkwa, n’enweghị ịkọwa ụdị ya
  alternative: nkwa onye Naziraịt
  rationale: Ihe odide ahụ kwuru naanị “nkwa”; ọ kpọghị ya nkwa onye Naziraịt, ya mere nsụgharị ahụ etinyeghị nkọwa ọdịnala a n’ahịrị isi.
translation_notes:
  register: Igbo ọkọlọtọ, nke oge a, dị ùgwù ma dị mfe nghọta. E ji “ụmụnna” mee ihe dịka okwu ezinụlọ maka ọgbakọ ndị kwere ekwe; n’ọnọdụ a ọ pụrụ ịgụnye ndị nwoke na ndị nwanyị. E kewara ogologo ahịrịokwu Grik ahụ ụzọ abụọ iji mee ka Igbo na-aga were were, ma njikọ echiche ya ka dị.
