- from: Mgbe Pọl nọgidere ọtụtụ ụbọchị ọzọ, ọ sịrị ụmụnna ahụ ka ha nọdụ nke ọma, wee jiri ụgbọ mmiri gawa Siria; Priskila na Akwịla sokwa ya. Na Kenkrea, o kpụrụ ntutu isi ya[a], n’ihi na o nwere nkwa[b][c].
  to: Mgbe Pọl nọgidere ọtụtụ ụbọchị ọzọ, ọ sịrị ụmụnna ahụ ka ha dịrị nke ọma, wee jiri ụgbọ mmiri gawa Siria; Priskila na Akwịla sokwa ya. Na Kenkrea, o kpụrụ ntutu isi ya[a], n’ihi na o nwere nkwa[b][c].
