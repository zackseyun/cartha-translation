id: ACT.18.26
reference: Acts 18:26
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οὗτός τε ἤρξατο παρρησιάζεσθαι ἐν τῇ συναγωγῇ· ἀκούσαντες δὲ αὐτοῦ ⸂Πρίσκιλλα καὶ Ἀκύλας⸃ προσελάβοντο αὐτὸν καὶ ἀκριβέστερον αὐτῷ ἐξέθεντο τὴν ⸂ὁδὸν τοῦ θεοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/026.yaml
  text: And he began to speak boldly in the synagogue. But when Priscilla and Aquila heard him[a], they took him aside and explained the way of God to him more accurately.
translation:
  language: ig
  text: Ọ malitekwara ikwu okwu n’atụghị egwu n’ụlọ nzukọ ndị Juu. Ma mgbe Priskila na Akwịla nụrụ ka ọ na-ekwu okwu, ha kpọọrọ ya iche[a] ma kọwaara ya ụzọ Chineke n’ụzọ ziri ezi karị.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ha kpọọrọ ya soro ha,” ma ọ bụ, “ha nabatara ya.” Ngwaa Greek ahụ nwere ike ịpụta ịnabata mmadụ nakwa ịkpọrọ ya iche.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτός τε
  choice: Ọ ...kwara
  rationale: Οὗτος na-ezo aka n’Apọlọs a kpọrọ aha n’amaokwu ndị bu ụzọ; nnọchiaha “Ọ” bụ Igbo nkịtị. Mgbakwunye “-kwara” na-egosipụta njikọ dị nro nke τέ.
- source_word: ἤρξατο
  choice: malitere
  rationale: Ụdị a ya na ngwaa na-esochi ya pụtara ịmalite ime ihe.
- source_word: παρρησιάζεσθαι
  choice: ikwu okwu n’atụghị egwu
  rationale: Nke a na-egosipụta ikwu okwu n’ihu ọha n’enweghị ụjọ, jiri obi ike na nnwere onwe kwuo ihe.
- source_word: ἐν τῇ συναγωγῇ
  choice: n’ụlọ nzukọ ndị Juu
  rationale: Nke a bụ okwu Igbo doro anya maka synagogue ma na-egosi ebe ndị Juu na-ezukọ.
- source_word: ἀκούσαντες δὲ αὐτοῦ
  choice: Ma mgbe ... nụrụ ka ọ na-ekwu okwu
  rationale: Participle ahụ na-egosi oge ihe mere, δέ na-egosi ntụgharị dị nro, ebe nsụgharị a na-eme ka ihe ha nụrụ doo anya n’Igbo.
- source_word: Πρίσκιλλα καὶ Ἀκύλας
  choice: Priskila na Akwịla
  rationale: Ndị a bụ ntụgharị mkpụrụokwu aha Greek Πρίσκιλλα na Ἀκύλας n’usoro ụda na odide Igbo.
- source_word: προσελάβοντο αὐτὸν
  choice: ha kpọọrọ ya iche
  rationale: N’ọnọdụ a, nkọwa ahụ sochiri ya na-akwado echiche na ha kpọọrọ ya n’akụkụ ka ha gwa ya okwu. E tinyere ihe e dere n’ala peeji iji chekwaa nghọta ndị ọzọ ngwaa Greek ahụ nwere ike inwe.
- source_word: ἀκριβέστερον
  choice: n’ụzọ ziri ezi karị
  rationale: 'Nke a na-echekwa ike ntụnyere nke adverb ahụ: nkọwa ha nyere zuru oke ma zie ezi karịa nghọta o nwere na mbụ.'
- source_word: ἐξέθεντο
  choice: kọwaara
  rationale: N’ebe a, ἐκτίθημι n’olu etiti pụtara ịkọwapụta ihe nye mmadụ; “kọwaara” bụ Igbo dị mfe ma kpọmkwem.
- source_word: τὴν ὁδὸν τοῦ θεοῦ
  choice: ụzọ Chineke
  rationale: Nsụgharị a na-edebe okwu ihe atụ nke Greek ahụ n’enweghị ịkọwa ya karịa ihe amaokwu ahụ kwuru.
- source_word: αὐτῷ
  choice: ya
  rationale: N’ime “kọwaara ya,” “ya” na-arụ ọrụ dị ka onye a kọwaara ihe, kwekọrọ na dative Greek ahụ.
theological_decisions:
- issue: Ụdị ihe Priskila na Akwịla mere Apọlọs
  choice: Ha kpọọrọ ya iche ka ha kọwaara ya ihe nke ọma karị.
  alternative: Ha kpọọrọ ya soro ha, ma ọ bụ ha nabatara ya.
  rationale: Ihe a na-ekwu ozugbo banyere ịkọwa ụzọ Chineke na-akwado mkparịta ụka pụrụ iche, ma ngwaa Greek ka nwere ike ịpụta ịkpọrọ mmadụ soro onwe ha ma ọ bụ ịnabata ya. Ihe e dere n’ala peeji na-echekwa nghọta ndị ahụ ma ghara ime ka ọ dị ka ha baara ya mba n’ihu ọha.
- issue: Ihe “ụzọ Chineke” pụtara
  choice: E debere okwu ahụ dịka “ụzọ Chineke.”
  alternative: Ozi nzọpụta Chineke, ụkpụrụ omume Chineke, ma ọ bụ aha pụrụ iche maka okwukwe Ndị Kraịst dum.
  rationale: N’ọnọdụ a, o yikarịrị ka okwu ahụ na-ezo aka n’ozi na ụzọ Chineke nke Apọlọs maara n’otu akụkụ; ma amaokwu ahụ akọwaghị oke ihe ọ pụtara, ya mere nsụgharị ahụ echekwala obosara na esemokwu dị n’okwu mbụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “Ụlọ nzukọ ndị Juu” na-akọwa synagogue n’ụzọ onye Igbo nkịtị ga-aghọta; ahịrịokwu ahụ na-aga were were ma na-edebe ntụnyere dị na “karị” na mgbagwoju anya dị na προσελάβοντο.
