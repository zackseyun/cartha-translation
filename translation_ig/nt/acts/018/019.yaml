- from: Ha bịarutere Efesọs[a], Pọl wee hapụ ha n’ebe ahụ[b]. Ma ya onwe ya banyere n’ụlọ nzukọ ndị Juu, soro ha tụgharịa uche n’ihe ndị ahụ[c].
  to: Ha bịarutere Efesọs[a], ọ hapụrụ ha ebe ahụ[b]; ma ya onwe ya banyere n’ụlọ nzukọ ndị Juu, ya na ndị Juu kparịta ụka[c].
  rationale: The revision removes the added phrase “n’ihe ndị ahụ,” repeats “ndị Juu” to preserve a clear referent, and replaces an unsuitable footnote alternative. It retains the source’s contrast (“ma ya onwe ya”), location (“ebe ahụ”), and the conversational, reasoned force of διελέξατο.
