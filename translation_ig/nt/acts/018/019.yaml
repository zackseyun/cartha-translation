  text: ⸀κατήντησαν δὲ εἰς Ἔφεσον, κἀκείνους κατέλιπεν αὐτοῦ, αὐτὸς δὲ εἰσελθὼν εἰς τὴν συναγωγὴν ⸀διελέξατο τοῖς Ἰουδαίοις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/019.yaml
  text: They came to Ephesus[a], and he left them there[c][b]; but he himself entered into the synagogue and reasoned with the Jews.
translation:
  language: ig
  text: Ha bịarutere Efesọs[a], ọ hapụrụ ha ebe ahụ[b]; ma ya onwe ya banyere n’ụlọ nzukọ ndị Juu, ya na ndị Juu kparịta ụka[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “Ha rutere Efesọs.”
    reason: lexical_alternative
  - marker: b
    text: Ya bụ, ọ hapụrụ ndị ya na ha so n’ebe ahụ—Prisila na Akwịla, ndị a kpọrọ aha n’amaokwu gara aga.
    reason: cross_reference
  - marker: c
    text: A pụkwara ịsụgharị ya, “ya na ndị Juu kwurịtara okwu” ma ọ bụ “ya na ndị Juu tụlere okwu.” Okwu Grik ahụ na-egosi mkparịta ụka e ji echiche na ihe akaebe eme.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατήντησαν
  choice: bịarutere
  rationale: Ngwaa a pụtara iru ma ọ bụ bịarute n’ebe a na-aga; “bịarutere Efesọs” bụ Igbo doro anya ma kwekọọ n’usoro akụkọ ahụ.
- source_word: δὲ
  choice: wee / Ma
  rationale: Nke mbụ na-aga n’ihu n’akụkọ ahụ, ya mere e ji “wee”; nke abụọ na-egosi ọdịiche dị n’etiti ndị ọ hapụrụ na ihe ya onwe ya mere, ya mere e ji “Ma.”
- source_word: κἀκείνους
  choice: ha
  rationale: Okwu a na-ezo aka ná ndị ya na ha so e kwuru n’amaokwu gara aga. Nnọchiaha “ha” na-edobe ụzọ Grik si kwuo ya n’etinyeghị aha ndị ahụ n’ahụ amaokwu.
- source_word: κατέλιπεν
  choice: hapụ
  rationale: Ọ pụtara ịhapụ ndị mmadụ n’otu ebe; njikọ ya na “n’ebe ahụ” na-egosipụta echiche ahụ nke ọma.
- source_word: αὐτοῦ
  choice: n’ebe ahụ
  rationale: N’ebe a ọ na-egosi ọnọdụ, ya bụ, na Efesọs.
- source_word: αὐτὸς
  choice: ya onwe ya
  rationale: Nnọchiaha ahụ nwere nkwusi ike ma na-egosi ọdịiche dị n’etiti Pọl na ndị ọ hapụrụ.
- source_word: εἰσελθὼν
  choice: banyere
  rationale: Ọ bụ omume na-eduga n’omume bụ isi. Igbo “banyere” na-egosi ịbanye n’ụlọ nzukọ ahụ n’ụzọ ebumpụta ụwa.
- source_word: συναγωγήν
  choice: ụlọ nzukọ ndị Juu
  rationale: N’ọnọdụ a, okwu ahụ na-ezo aka n’ebe ndị Juu na-ezukọ maka ofufe na ọmụmụ.
- source_word: διελέξατο
  choice: soro ha tụgharịa uche n’ihe ndị ahụ
  rationale: Ngwaa ahụ na-egosi mkparịta ụka e ji echiche na ihe akaebe eme, ọ bụghị naanị esemokwu. Nsụgharị a bụ Igbo a na-aghọta nke na-edobe echiche nke mkparịta ụka nwere ntụgharị uche.
- source_word: τοῖς Ἰουδαίοις
  choice: ndị Juu / ha
  rationale: “Ndị Juu” bụ ntụgharị kpọmkwem; “ha” n’akụkụ ngwaa na-ezoghachi n’ụzọ doro anya ná ndị Juu nọ n’ụlọ nzukọ ahụ.
theological_decisions: []
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. A kpọrọ Pọl aha iji mee ka onye “ya onwe ya” na-ezo aka na ya doo anya n’Igbo, ebe a hapụrụ ndị ọzọ dị ka “ha” ka ntụgharị ahụ ghara itinye aha ndị sitere n’amaokwu gara aga n’ahụ amaokwu a. A haziri akara nkọwa ala peeji dịka [a], [b], [c], ma tinye nke ọ bụla ozugbo n’akụkụ okwu ọ na-akọwa.
