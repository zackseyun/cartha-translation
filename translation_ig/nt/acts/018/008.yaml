revisions:
- from: Ma Krispọs, onyeisi ụlọ nzukọ ndị Juu, ya na ndị niile nọ n’ezinụlọ ya kweere n’Onyenwe anyị. Ọtụtụ n’ime ndị Kọrịnt kwa, ka ha na-anụ, nọ na-ekwere, a na-emekwa ha baptizim.[a]
  to: Ma Krispọs, onyeisi ụlọ nzukọ ndị Juu, kweere n’Onyenwe anyị, ya na ezinụlọ ya niile; ọtụtụ n’ime ndị Kọrịnt, ka ha na-anụ, na-ekwere, a na-emekwa ha baptizim.[a]
  rationale: The revision preserves the Greek’s singular subject for Crispus and σύν phrase for his household by moving the household phrase after the main verb. It also slightly smooths the imperfective wording in the second clause, without flattening the ongoing response or passive baptismal action. The footnote remains structurally valid and accurately explains the more idiomatic alternative.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T09:20:30Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents Crispus, his synagogue role, belief in the Lord, the household phrase, the partitive sense of ‘many of the Corinthians,’ and the ongoing/passive force of the final clauses. However, placing ‘ya na ndị niile nọ n’ezinụlọ ya’ before ‘kweere’ makes the household too readily the coordinated grammatical subject, whereas the Greek explicitly makes Crispus the subject and adds the household as accompanying him.
  naturalness: Most wording is clear Standard Igbo. Reordering the household phrase after the verb makes the sentence more natural and tracks the Greek syntax more closely. ‘na-ekwere’ is smoother than ‘nọ na-ekwere’ here while still allowing the imperfect’s ongoing or repeated portrayal.
  terminology: ‘Krispọs,’ ‘onyeisi ụlọ nzukọ ndị Juu,’ ‘Onyenwe anyị,’ ‘ezinụlọ,’ and ‘baptizim’ are appropriate, intelligible renderings. No doctrinal expansion is introduced.
  issues:
  - severity: medium
    issue: The household phrase is positioned as though Crispus and all his household are the direct compound subject of ‘kweere.’
    rationale: Greek has singular ἐπίστευσεν with Κρίσπος as its subject, followed by σὺν (‘with/together with’) his whole household. Reordering preserves this syntax without deciding how the household’s faith should be construed.
  - severity: low
    issue: ‘nọ na-ekwere’ is somewhat heavy in this coordinated narrative clause.
    rationale: ‘na-ekwere’ is idiomatic Standard Igbo and can convey the imperfective portrayal in context, especially alongside ‘a na-emekwa ha baptizim.’
  revised_text: Ma Krispọs, onyeisi ụlọ nzukọ ndị Juu, kweere n’Onyenwe anyị, ya na ezinụlọ ya niile; ọtụtụ n’ime ndị Kọrịnt, ka ha na-anụ, na-ekwere, a na-emekwa ha baptizim.[a]
  revised_footnotes:
  - marker: a
    text: 'A pụkwara ikwu ya n’ụzọ Igbo dị mfe karị: “ọtụtụ n’ime ndị Kọrịnt, mgbe ha nụrụ, kwere, e meekwa ha baptizim.” Otú ngwaa Grik si dị na-egosi na nzaghachi a nọ na-aga n’ihu n’etiti ọtụtụ mmadụ.'
    reason: lexical_alternative
  revision_rationale: The revision preserves the Greek’s singular subject for Crispus and σύν phrase for his household by moving the household phrase after the main verb. It also slightly smooths the imperfective wording in the second clause, without flattening the ongoing response or passive baptismal action. The footnote remains structurally valid and accurately explains the more idiomatic alternative.
