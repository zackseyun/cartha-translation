id: ACT.18.8
reference: Acts 18:8
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Κρίσπος δὲ ὁ ἀρχισυνάγωγος ἐπίστευσεν τῷ κυρίῳ σὺν ὅλῳ τῷ οἴκῳ αὐτοῦ, καὶ πολλοὶ τῶν Κορινθίων ἀκούοντες ἐπίστευον καὶ ἐβαπτίζοντο.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/008.yaml
  text: But Crispus[a], the synagogue ruler, believed in the Lord together with his whole household, and many of the Corinthians, hearing, were believing and were being baptized.
translation:
  language: ig
  text: Ma Krispọs, onyeisi ụlọ nzukọ ndị Juu, kweere n’Onyenwe anyị, ya na ezinụlọ ya niile; ọtụtụ n’ime ndị Kọrịnt, ka ha na-anụ, na-ekwere, a na-emekwa ha baptizim.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ikwu ya n’ụzọ Igbo dị mfe karị: “ọtụtụ n’ime ndị Kọrịnt, mgbe ha nụrụ, kwere, e meekwa ha baptizim.” Otú ngwaa Grik si dị na-egosi na nzaghachi a nọ na-aga n’ihu n’etiti ọtụtụ mmadụ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Κρίσπος
  choice: Krispọs
  rationale: A kpọgharịrị aha onye a n’ụzọ dabara n’usoro mkpụrụokwu na ụda asụsụ Igbo.
- source_word: ἀρχισυνάγωγος
  choice: onyeisi ụlọ nzukọ ndị Juu
  rationale: Nke a na-egosi onye ndu ma ọ bụ onye ọrụ kacha dị mkpa n’ụlọ nzukọ ndị Juu, n’enweghị ịkọwa usoro ọchịchị ya karịa ihe Grik kwuru.
- source_word: ἐπίστευσεν τῷ κυρίῳ
  choice: kweere n’Onyenwe anyị
  rationale: Nke a bụ ụzọ Igbo si ekwu nkwenye e tinyere n’Onyenwe anyị; a hapụrụ aha nsọpụrụ κύριος dịka ọ dị, n’etinyeghị ‘Jizọs’ n’amaokwu ahụ.
- source_word: σὺν ὅλῳ τῷ οἴκῳ αὐτοῦ
  choice: ya na ndị niile nọ n’ezinụlọ ya
  rationale: ‘Ezinụlọ’ na-egosi ndị mejupụtara household, ọ bụghị ụlọ e wuru; ‘ndị niile’ na-echekwa echiche ὅλῳ.
- source_word: πολλοὶ τῶν Κορινθίων
  choice: ọtụtụ n’ime ndị Kọrịnt
  rationale: '‘N’ime’ na-echekwa partitive genitive: ọtụtụ ndị sitere n’etiti ndị Kọrịnt.'
- source_word: ἀκούοντες
  choice: ka ha na-anụ
  rationale: Usoro a na-egosi omume na-aga n’ihu ma na-eme n’otu oge na nzaghachi ndị sochiri ya; a hapụrụ ihe ha nụrụ n’enweghị aha dịka Grik mere.
- source_word: ἐπίστευον
  choice: nọ na-ekwere
  rationale: Imperfect a na-egosi na ọtụtụ mmadụ nọgidere na-abata na nkwenye, kama ime ka ọ bụrụ naanị otu ihe mere n’otu ntabi anya.
- source_word: ἐβαπτίζοντο
  choice: a na-emekwa ha baptizim
  rationale: Nke a na-echekwa olu nnabata na ọdịdị omume na-aga n’ihu nke imperfect passive.
theological_decisions:
- issue: Oke nkwenye dị n’okwu ‘ya na ndị niile nọ n’ezinụlọ ya’
  choice: A sụgharịrị ya dịka nkwupụta gbasara Krispọs na ezinụlọ ya niile, n’akọwaghị otú onye ọ bụla si gosipụta nkwenye ahụ.
  alternative: Ikwupụta hoo haa na onye ọ bụla n’ezinụlọ ahụ ji aka ya kweere n’otu ụzọ ahụ.
  rationale: Grik kwuru na Krispọs kweere ya na ezinụlọ ya niile, ma ọ kọwaghị usoro nkwenye onye ọ bụla; nsụgharị ahụ ezere itinye nkwubi okwu otu ụka banyere okwukwe ma ọ bụ baptizim ezinụlọ.
- issue: Onye okwu ‘Onyenwe anyị’ na-ezo aka na ya
  choice: Onyenwe anyị
  alternative: Onyenwe anyị Jizọs
  rationale: N’akụkọ Ọrụ Ndị Ozi, ihe gbara amaokwu ahụ gburugburu na-egosi Jizọs, ma ihe odide Grik ebe a kwuru naanị κύριος; ya mere, a gbasaghị aha ahụ karịa isi mmalite.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. ‘Ụlọ nzukọ ndị Juu’ na-eme ka ‘synagogue’ doo onye nkịtị anya; usoro ‘ka ha na-anụ, nọ na-ekwere, a na-emekwa ha baptizim’ na-echekwa ọdịdị omume na-aga n’ihu nke Grik, ebe nkọwa ala peeji na-enye ụzọ dị mfe karị.
