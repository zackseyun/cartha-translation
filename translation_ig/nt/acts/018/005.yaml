  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ὡς δὲ κατῆλθον ἀπὸ τῆς Μακεδονίας ὅ τε Σιλᾶς καὶ ὁ Τιμόθεος, συνείχετο τῷ ⸀λόγῳ ὁ Παῦλος, διαμαρτυρόμενος τοῖς Ἰουδαίοις ⸀εἶναι τὸν χριστὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/005.yaml
  text: But when Silas and Timothy came down from Macedonia[a], Paul was occupied with the word[b], solemnly testifying to the Jews that Jesus is the Messiah.
translation:
  language: ig
  text: Ma mgbe Saịlas na Timoti si Masedonia gbadata, Pọl nọ na-arụsi ọrụ ike n’ikwusa okwu ahụ[a], na-agba ndị Juu akaebe n’ụzọ siri ike na Jizọs bụ Mesaya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “okwu ahụ na-akwagide Pọl” ma ọ bụ “Pọl tinyere uche ya dum n’ozi ahụ.” Ngwaa Grik ahụ nwere ike ịpụta na ihe jidere mmadụ, na-akwagide ya, ma ọ bụ na o tinyere onwe ya dum na ya.
    reason: lexical_alternative
  - marker: b
    text: N’asụsụ Grik, “Kraịst.” N’ebe a, okwu ahụ bụ aha ọkwa, ya mere e ji “Mesaya” mee ka echiche nke Onye E Tere Mmanụ ahụ doo anya.
    reason: alternative_reading
lexical_decisions:
- source_word: Ὡς δὲ
  choice: Ma mgbe
  rationale: Ọ na-egosi mgbanwe n’akụkọ ahụ ma na-ewebata oge ihe sochirinụ mere; “Ma mgbe” na-eburu ọrụ δέ na ὡς n’Igbo doro anya.
- source_word: κατῆλθον ἀπὸ τῆς Μακεδονίας
  choice: si Masedonia gbadata
  rationale: Nke a na-echekwa okwu njem Luk ji mee ihe, bụ́ ‘gbadata,’ n’agbanyeghị na ọ bụkwa ụzọ nkịtị isi kwuo na ha si Masedonia bịa.
- source_word: ὅ τε Σιλᾶς καὶ ὁ Τιμόθεος
  choice: Saịlas na Timoti
  rationale: Ọ na-egosi mmadụ abụọ ahụ ọnụ n’Igbo dị mfe ma dịkwa mma.
- source_word: συνείχετο
  choice: jidere ... nke ukwuu
  rationale: Ihe oyiyi nke ‘ijide’ na-egosi na okwu ahụ weghaara uche Pọl ma ọ bụ kpalie ya nke ukwuu, na-ahapụghị nghọta ahụ naanị n’otu akụkụ.
- source_word: τῷ λόγῳ
  choice: okwu ahụ
  rationale: Ọ na-echekwa λόγος n’ụzọ pụtara ìhè; n’ebe a ọ na-ezo aka n’ozi ọma Pọl na-ekwusa.
- source_word: διαμαρτυρόμενος
  choice: na-agbara ... akaebe siri ike
  rationale: Nke a na-echekwa echiche nke ịgba akaebe ma na-egosikwa ike na ịdị mkpa dị na ngwaa Grik ahụ.
- source_word: τοῖς Ἰουδαίοις
  choice: ndị Juu
  rationale: N’ebe a okwu ahụ na-ezo aka n’ìgwè ndị Juu n’ihe gbasara agbụrụ na okpukpe, ọ bụghị nanị ndị si Judia.
- source_word: εἶναι τὸν χριστὸν Ἰησοῦν
  choice: na Jizọs bụ Mesaya
  rationale: Χριστός bụ aha ọkwa n’ahịrịokwu a, karịchaa n’akaebe a na-agbara ndị Juu; “Mesaya” na-echekwa echiche nke Onye E Tere Mmanụ ahụ e kwere ná nkwa.
theological_decisions:
- issue: Ma a ga-asụgharị Χριστός dị ka aha ọkwa ka ọ bụ dị ka akụkụ aha mmadụ
  choice: Mesaya
  alternative: Kraịst
  rationale: Χριστός nwere article ma bụrụ ihe e kwuru banyere Jizọs n’ọkwa nkwupụta ahụ; ya mere, ‘Mesaya’ na-egosipụta nke ọma na Pọl na-ekwu na Jizọs bụ Onye ahụ e kwere ná nkwa.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. “Okwu ahụ jidere Pọl nke ukwuu” na-echekwa ihe oyiyi na obosara nghọta nke συνείχετο n’enweghị ịkọwa kpọmkwem ma ọ bụ nrụgide ime mmụọ, mkpali, ka ọ bụ itinye uche dum. E debere akara nkọwa [a] n’ebe okwu Grik a dị, na [b] n’ebe “Mesaya” dị.
