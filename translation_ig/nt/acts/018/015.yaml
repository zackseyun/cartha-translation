id: ACT.18.15
reference: Acts 18:15
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἰ δὲ ⸀ζητήματά ἐστιν περὶ λόγου καὶ ὀνομάτων καὶ νόμου τοῦ καθ’ ὑμᾶς, ὄψεσθε αὐτοί· ⸀κριτὴς ἐγὼ τούτων οὐ βούλομαι εἶναι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/015.yaml
  text: But if these are questions about a word and names and your own law[a], you yourselves will see to it; I do not want to be a judge of these things.
translation:
  language: ig
  text: Ma ọ bụrụ na ọ bụ ajụjụ ndị metụtara okwu[a], aha, na iwu nke unu, unu onwe unu ga-ahụ maka ha; achọghị m ịbụ onyeikpe n’ihe ndị a.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “ozi” ma ọ bụ “nkuzi.” Okwu Grik bụ λόγος nwere nghọta sara mbara, ọ pụkwara izo aka n’okwu a na-arụrịta ụka banyere ya, ozi, ma ọ bụ nkuzi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ζητήματά
  choice: ajụjụ
  rationale: Okwu a na-egosi ihe a na-enyocha ma ọ bụ ihe a na-arụrịta ụka. “Ajụjụ” na-edobe ụda okwu metụtara ikpe n’ebughị ụzọ kọwaa ya dị ka esemokwu kpụ ọkụ n’ọnụ.
- source_word: περὶ λόγου
  choice: banyere okwu
  rationale: λόγος nwere ọtụtụ nghọta, gụnyere okwu, ozi, ma ọ bụ nkuzi. “Okwu” dị obosara n’Igbo ma na-edobe nghọta dị iche iche nke okwu Grik ahụ.
- source_word: ὀνομάτων
  choice: aha
  rationale: “Aha” bụ nsụgharị kwụ ọtọ nke na-ahapụghị ma ihe a na-ekwu bụ aha mmadụ, utu aha, ma ọ bụ aha e ji akọwa ihe.
- source_word: νόμου τοῦ καθ’ ὑμᾶς
  choice: iwu nke unu
  rationale: Nke a na-egosi iwu metụtara ndị Gallio na-agwa okwu, ma gosikwa na o weere ya dị ka ihe na-abụghị okwu ikpe Rom.
- source_word: ὄψεσθε αὐτοί
  choice: unu onwe unu ga-ahụ maka ha
  rationale: Nkebiokwu a na-arụ ọrụ dị ka iwu ka ha jiri aka ha lekọta ihe ndị ahụ. “Unu onwe unu” na-edobe nkwusi ike dị na αὐτοί, ebe “ga-ahụ maka ha” na-edobe ọdịdị ọdịnihu nke ngwaa ahụ.
- source_word: κριτὴς
  choice: onyeikpe
  rationale: “Onyeikpe” dabara n’ọnọdụ ikpe ahụ ma na-egosi ọrụ Gallio jụrụ ịrụ.
- source_word: τούτων
  choice: n’ihe ndị a
  rationale: Nke a na-ezo azụ n’ajụjụ ndị a kpọtụrụ aha, n’ụzọ sara mbara dịka okwu Grik ahụ.
- source_word: οὐ βούλομαι εἶναι
  choice: achọghị m ịbụ
  rationale: Nke a na-egosi ọchịchọ Gallio na enweghị njikere ya, n’asụsụ Igbo dị mfe ma dị ugbu a.
theological_decisions:
- issue: Ókè nghọta λόγος n’okwu Gallio
  choice: okwu
  alternative: ozi; nkuzi
  rationale: Amaokwu ahụ akọwaghị kpọmkwem ma λόγος bụ otu okwu, ozi, ma ọ bụ nkuzi. “Okwu” na-edobe obosara na mgbagwoju anya ahụ kama ikpebi otu nghọta okpukpe kpọmkwem.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe ma dị ùgwù mee ihe. Ahịrịokwu ahụ na-edobe ụda nkwụsị ikpe nke Gallio, nkwusi ike dị na “unu onwe unu,” na obosara nghọta nke λόγος.
