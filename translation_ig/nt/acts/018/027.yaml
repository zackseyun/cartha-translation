id: ACT.18.27
reference: Acts 18:27
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: βουλομένου δὲ αὐτοῦ διελθεῖν εἰς τὴν Ἀχαΐαν προτρεψάμενοι οἱ ἀδελφοὶ ἔγραψαν τοῖς μαθηταῖς ἀποδέξασθαι αὐτόν· ὃς παραγενόμενος συνεβάλετο πολὺ τοῖς πεπιστευκόσιν διὰ τῆς χάριτος·
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/027.yaml
  text: And when he wanted to go across to Achaia[a], the brothers encouraged him and wrote to the disciples to welcome him. When he arrived[b], he greatly helped those who had believed through grace.
translation:
  language: ig
  text: Mgbe ọ chọrọ ịgafe gaa Akaịa, ụmụnna[a] gbara ya ume, degara ndị na-eso ụzọ akwụkwọ ka ha nabata ya. Mgbe ọ rutere, o nyeere ndị kwere ekwe site n’amara[b] aka nke ukwuu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Okwu Grik a sụgharịrị “ụmụnna” dị n’ụdị nwoke, ma n’ọgbakọ ndị Kraịst oge mbụ, ọ pụrụ izo aka n’obodo ndị kwere ekwe n’ozuzu ya, tinyere ụmụ nwanyị.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, “site n’amara, o nyeere ndị kwere ekwe aka nke ukwuu.” Okwu Grik “site n’amara” pụrụ ịkọwa enyemaka Apọlọs nyere kama ịkọwa ụzọ ndị ahụ si kwere ekwe.
    reason: alternative_reading
lexical_decisions:
- source_word: βουλομένου ... αὐτοῦ
  choice: Mgbe ọ chọrọ
  rationale: Nkebi a na-egosi ọchịchọ Apọlọs n’ụzọ doro anya ma bụrụkwa Igbo a na-asụ ugbu a.
- source_word: διελθεῖν εἰς τὴν Ἀχαΐαν
  choice: ịgafe gaa Akaịa
  rationale: “Ịgafe gaa” na-edowe echiche njem ịgafe site n’Efesọs ruo n’ógbè Akaịa, kama ikwu naanị “ịga.”
- source_word: προτρεψάμενοι
  choice: gbara ya ume
  rationale: Nke a na-egosi nkwado na agbamume ụmụnna nyere ya, n’enweghị ike okwu siri ike karịa ihe ọnọdụ a chọrọ.
- source_word: οἱ ἀδελφοὶ
  choice: ụmụnna
  rationale: “Ụmụnna” bụ okwu Igbo kwesịrị ekwesị maka ndị otu okwukwe; ọ na-edowe ọdịdị okwu Grik ma nwee ike, n’ọnọdụ ọgbakọ, ịgụnye ndị obodo ndị kwere ekwe n’ozuzu ha.
- source_word: ἔγραψαν τοῖς μαθηταῖς
  choice: dekwara ndị na-eso ụzọ akwụkwọ
  rationale: Nke a na-enye kpọmkwem echiche nke idegara ndị na-eso ụzọ akwụkwọ, n’asụsụ Igbo dị mfe nghọta.
- source_word: ἀποδέξασθαι αὐτόν
  choice: ka ha nabata ya
  rationale: “Nabata” na-egosi ịnabata Apọlọs nke ọma na omume nnabata ndị ọbịa.
- source_word: ὃς παραγενόμενος
  choice: Mgbe ọ rutere
  rationale: Nke a na-ewepụta oge ihe sochirinụ mere ma na-aga nke ọma n’usoro okwu Igbo.
- source_word: συνεβάλετο πολὺ
  choice: o nyeere ... aka nke ukwuu
  rationale: Akpaala okwu Igbo “inyere aka” na-egosi nnukwu enyemaka Apọlọs nyere ndị ahụ.
- source_word: τοῖς πεπιστευκόσιν
  choice: ndị ahụ kweere ekwe
  rationale: Nke a na-egosi ndị bịarala n’okwukwe ma nọgide na ya, dịka participle perfect nke Grik si dị.
- source_word: διὰ τῆς χάριτος
  choice: site n’amara
  rationale: Nke a na-edowe okwu Grik n’enweghị ịgbakwunye “nke Chineke,” nke na-adịghị kpọmkwem n’ahịrịokwu ahụ.
theological_decisions:
- issue: Ebe διὰ τῆς χάριτος (“site n’amara”) jikọrọ
  choice: 'E jikọtara ya na “ndị ahụ kweere ekwe”: “ndị ahụ kweere ekwe site n’amara.”'
  alternative: 'Ọ pụrụ ijikọ n’enyemaka Apọlọs: “site n’amara, o nyeere ndị ahụ kweere ekwe aka nke ukwuu.”'
  rationale: Usoro okwu na ọnọdụ ahụ na-akwado ka nkebi a kọwaa ụzọ ha si kwere ekwe, ma Grik ka nwere ezi mgbagwoju anya; ya mere e debere nghọta nke ọzọ n’okpuru peeji.
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta. A họọrọ “ndị na-eso ụzọ” maka μαθηταί, “ịgafe gaa” iji chekwaa echiche njem ahụ, na “ụmụnna” iji ghara ihichapụ ọdịdị okwu isi mmalite. E tinyere akara nkọwa [a] na [b] kpọmkwem n’ebe okwu ndị ha na-akọwa dị.
