revisions:
- from: Mgbe ọ chọrọ ịgafe gaa Akaịa, ụmụnna[a] gbara ya ume, dekwara ndị na-eso ụzọ akwụkwọ ka ha nabata ya. Mgbe ọ rutere, o nyeere ndị ahụ kweere ekwe site n’amara aka nke ukwuu.[b]
  to: Mgbe ọ chọrọ ịgafe gaa Akaịa, ụmụnna[a] gbara ya ume, degara ndị na-eso ụzọ akwụkwọ ka ha nabata ya. Mgbe ọ rutere, o nyeere ndị kwere ekwe site n’amara[b] aka nke ukwuu.
  rationale: The revision makes only idiomatic and anchoring corrections. It retains the travel nuance of διελθεῖν, the encouraging force of προτρεψάμενοι, and the Greek ambiguity concerning διὰ τῆς χάριτος. The main text continues to take “site n’amara” with the believers’ faith, while footnote b preserves the viable alternative without resolving it doctrinally.
