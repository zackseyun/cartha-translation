source:
  edition: SBLGNT
  text: διότι ἐγώ εἰμι μετὰ σοῦ καὶ οὐδεὶς ἐπιθήσεταί σοι τοῦ κακῶσαί σε, διότι λαός ἐστί μοι πολὺς ἐν τῇ πόλει ταύτῃ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/010.yaml
  text: because I am with you[a], and no one will attack you to harm you[b], because I have many people in this city.
translation:
  language: ig
  text: 'n’ihi na mụ onwe m nọnyere gị, ọ dịghịkwa onye ga-awakpo gị[a] iji merụọ gị ahụ, n’ihi na enwere m ọtụtụ ndị n’obodo a.[b]


    [a] A pụkwara ịsụgharị ya, “ọ dịghị onye ga-ebikwasị gị aka iji merụọ gị ahụ.”


    [b] Okwu a, “enwere m ọtụtụ ndị n’obodo a,” yiri ka ọ na-ekwu banyere ọtụtụ ndị nọ na Kọrịnt bụ ndị nke Onyenwe anyị, tinyere ndị ka ga-ekwere.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ọ dịghị onye ga-ebikwasị gị aka iji merụọ gị ahụ.”
    reason: lexical_alternative
  - marker: b
    text: Okwu a, “enwere m ọtụtụ ndị n’obodo a,” yiri ka ọ na-ekwu banyere ọtụtụ ndị nọ na Kọrịnt bụ ndị nke Onyenwe anyị, tinyere ndị ka ga-ekwere.
    reason: cross_reference
lexical_decisions:
- source_word: διότι
  choice: n’ihi na
  rationale: Ọ na-egosi ihe kpatara iwu dị n’amaokwu bu ụzọ, ma mesịa gosi ihe kpatara nkwa ahụ. “N’ihi na” bụ okwu Igbo doro anya nke na-echekwa njikọ nke ihe kpatara ihe.
- source_word: ἐγώ εἰμι μετὰ σοῦ
  choice: mụ na gị nọ
  rationale: Nke a bụ ụzọ Igbo nkịtị na nke siri ike e si ekwe mmadụ nkwa na onye na-ekwu okwu nọnyere ya. “Mụ” na-eburu nkwusi ike dị na ἐγώ n’enweghị itinye okwu na-adịghị mkpa.
- source_word: οὐδεὶς
  choice: ọ dịghị onye
  rationale: Nke a bụ ntụgharị Igbo kpọmkwem na nke e ji eme ihe kwa ụbọchị maka onye ọ bụla n’ọnọdụ njụ.
- source_word: ἐπιθήσεταί σοι
  choice: ga-ebuso gị agha
  rationale: N’ebe a, ngwaa ahụ na-egosi ime ihe ike megide Pọl. “Ibuso mmadụ agha” na-enye echiche nke mwakpo n’ụzọ doro anya, ebe e debere “ibikwasị mmadụ aka” dị ka nhọrọ ọzọ n’okpuru.
- source_word: τοῦ κακῶσαί σε
  choice: iji merụọ gị ahụ
  rationale: Infinitive ahụ na-egosi ebumnuche ma ọ bụ ihe mwakpo ahụ ga-eweta. Okwu a na-ekpuchi imerụ mmadụ n’anụ ahụ ma ọ bụ n’ụzọ ọzọ n’enweghị ime ka ihe ọ pụtara dị warara.
- source_word: λαός
  choice: ọtụtụ ndị
  rationale: N’usoro okwu a, λαός na-ezo aka n’ìgwè mmadụ metụtara onye na-ekwu okwu. “Ọtụtụ ndị” bụ ụzọ Igbo sitere n’ọnụ ma dị mfe nghọta.
- source_word: ἐστί μοι
  choice: enwere m
  rationale: Dative μοι tinyere εἰμί na-egosi inwe ihe. “Enwere m” bụ ụzọ Igbo ebumpụta ụwa si kwuo nke a.
- source_word: πολὺς
  choice: ọtụtụ
  rationale: Ọ na-egosi ọnụ ọgụgụ buru ibu ma na-akọwa λαός; “ọtụtụ” bụ ntụgharị kachasị mfe na kpọmkwem.
- source_word: ἐν τῇ πόλει ταύτῃ
  choice: n’obodo a
  rationale: “Obodo” dabara n’ebe ndị bi dị ka Kọrịnt, ebe “a” na-echekwa demonstrative ταύτῃ.
theological_decisions:
- issue: Ihe “ọtụtụ ndị” nọ n’obodo ahụ pụtara
  choice: E debere okwu bụ “enwere m ọtụtụ ndị n’obodo a” n’isiokwu ahụ n’enweghị ịkọwa ya karịa ihe Grik kwuru.
  alternative: Ịsụgharị ya kpọmkwem dị ka ndị nọ na Kọrịnt bụ ndị nke Onyenwe anyị, gụnyere ndị ka ga-ekwere; ma ọ bụ ndị na-akwado Pọl n’obodo ahụ.
  rationale: N’Ọrụ Ndịozi, mgbe Chineke kwuru na o nwere “ndị” ya, ọ pụrụ igosi ndị bụ nke ya, gụnyere ndị ga-abịa n’okwukwe. Ma isiokwu Grik akọwaghị oge ha ga-ekwere ma ọ bụ ọnọdụ ha kpọmkwem. Ya mere, isiokwu ahụ na-echekwa ohere na esemokwu nkà mmụta okpukpe ahụ, ebe nkọwa ala peeji na-enye nghọta kachasị yie ka ọ bụ ya.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị ugwu ma dị mfe nghọta. E tinyere akara [a] n’akụkụ okwu mwakpo nke ọ na-akọwa, na [b] n’akụkụ “ọtụtụ ndị,” ka njikọ nke akara na nkọwa ya doo anya. E chekwara ọdịdị amaokwu ahụ dị ka nkebi ahịrịokwu na-aga n’ihu site n’amaokwu bu ụzọ.
