  text: εἶπεν δὲ ὁ κύριος ⸂ἐν νυκτὶ δι’ ὁράματος⸃ τῷ Παύλῳ· Μὴ φοβοῦ, ἀλλὰ λάλει καὶ μὴ σιωπήσῃς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/009.yaml
  text: And the Lord said to Paul in the night through a vision[a], “Do not be afraid, but keep speaking and do not be silent,”
translation:
  language: ig
  text: Onyenwe anyị wee gwa Pọl n'abalị site n'ọhụụ[a], sị, “Atụla egwu, kama nọgide na-ekwu okwu, agbachila nkịtị.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n'ọhụụ.” N'okwu Grik, ọ pụtara kpọmkwem “site n'ọhụụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ κύριος
  choice: Onyenwe anyị
  rationale: Nke a bụ aha a na-ejikarị asụgharị κύριος n'Igbo mgbe ọ bụ aha nsọpụrụ Chineke ma ọ bụ Kraịst. Ọ na-edobe ihe odide ahụ kwuru n'ekwughị kpọmkwem ‘Jizọs.’
- source_word: ἐν νυκτὶ
  choice: n'abalị
  rationale: Ọ bụ ụzọ Igbo dị mfe ma bụrụkwa nke e ji eme ihe taa iji gosi oge ihe ahụ mere.
- source_word: δι’ ὁράματος
  choice: site n'ọhụụ
  rationale: ‘Site na’ na-egosipụta echiche nke διά ya na genitive dịka ụzọ e si zie Pọl ozi ahụ; ‘ọhụụ’ bụ okwu Igbo kwesịrị ekwesị maka ὅραμα.
- source_word: Μὴ φοβοῦ
  choice: Atụla egwu
  rationale: Nke a bụ iwu mgbochi doro anya ma bụrụkwa okwu Igbo a na-asụkarị maka ịgwa mmadụ ka ọ ghara ịtụ egwu.
- source_word: ἀλλὰ λάλει
  choice: kama nọgide na-ekwu okwu
  rationale: ‘Nọgide na-ekwu okwu’ na-egosipụta omume na-aga n'ihu nke present imperative λάλει.
- source_word: καὶ μὴ σιωπήσῃς
  choice: agbachịkwala nkịtị
  rationale: Nke a na-egosipụta iwu ka Pọl ghara ịgbachi nkịtị, ma na-ejikọta ya nke ọma na iwu ka ọ nọgide na-ekwu okwu.
theological_decisions:
- issue: Onye ‘Onyenwe anyị’ na-ezo aka na ya
  choice: E debere aha ahụ dịka ‘Onyenwe anyị.’
  alternative: ‘Onyenwe anyị Jizọs’
  rationale: N'agbanyeghị na akụkọ Ọrụ Ndị Ozi na-egosi na o yikarịrị ka ọ bụ Jizọs bilitere n'ọnwụ na-ekwu okwu, Grik kwuru naanị ὁ κύριος. Ịghara ịgbakwunye ‘Jizọs’ na-edobe oke ihe ederede ahụ kwuru na ịdị arọ nke aha ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta mee ihe. Ahịrịokwu ahụ na-edobe usoro akụkọ, aha ‘Onyenwe anyị,’ na ọdịiche dị n'etiti ịnọgide na-ekwu okwu na ịghara ịgbachi nkịtị.
