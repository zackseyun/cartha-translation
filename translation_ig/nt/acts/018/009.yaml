  terminology: “Onyenwe anyị” is an established Igbo biblical rendering of ὁ κύριος and appropriately retains the source title without adding “Jizọs.” “ọhụụ” is suitable for ὅραμα. The footnote accurately presents the alternative locative rendering while retaining the instrumental main-text translation.
