  source_fidelity: 'The temporal and instrumental phrases are accurately represented by “n''abalị site n''ọhụụ,” and “Atụla egwu” faithfully renders the prohibition. “Nọgide na-ekwu okwu” appropriately conveys the ongoing force of λάλει. The final clause should be adjusted: “agbachịkwala nkịtị” is not the most natural or precise Standard Igbo negative imperative for μὴ σιωπήσῃς.'
