  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Γαλλίωνος δὲ ⸂ἀνθυπάτου ὄντος⸃ τῆς Ἀχαΐας κατεπέστησαν ⸂ὁμοθυμαδὸν οἱ Ἰουδαῖοι⸃ τῷ Παύλῳ καὶ ἤγαγον αὐτὸν ἐπὶ τὸ βῆμα,
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/012.yaml
  text: But while Gallio was proconsul of Achaia[a], the Jews rose up together against Paul and brought him before the tribunal[b],
translation:
  language: ig
  text: Ma mgbe Galio bụ prokọnsụl Akaịa, ndị Juu ji otu obi bilie megide Pọl, duru ya gaa n’ihu oche ikpe[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “n’ihu ebe ikpe.” Okwu Grik ahụ na-ezo aka n’oche ma ọ bụ n’elu ikpo okwu ọchịchị ebe a na-ekpe ikpe.
    reason: lexical_alternative
lexical_decisions:
- source_word: Γαλλίωνος
  choice: Galio
  rationale: E dere aha onye a n’ụzọ kwekọrọ na mkpọpụta ya ma dị mfe nye ndị na-agụ Igbo.
- source_word: δὲ
  choice: Ma
  rationale: Ọ na-egosi ntughari akụkọ nwere obere ọdịiche, tupu a kọwaa mmegide bilitere.
- source_word: ἀνθυπάτου ὄντος
  choice: mgbe ... bụ prokọnsụl
  rationale: Ọ na-egosi oge ọnọdụ a mere, n’Igbo dị mfe ma na-edobe ike nke genitive absolute.
- source_word: ἀνθύπατος
  choice: prokọnsụl
  rationale: Nke a bụ kpọmkwem ọkwa ọchịchị Rom; ịkpọ ya naanị ‘gọvanọ’ agaghị ezucha oke.
- source_word: Ἀχαΐας
  choice: Akaịa
  rationale: A sụgharịghị aha mpaghara Rom a; e depụtara ya dịka mkpọpụta Grik si dị.
- source_word: κατεπέστησαν
  choice: bilie megide
  rationale: Ọ na-egosi imegide Pọl n’ụzọ siri ike, ma ọ naghị agbakwunye echiche na ha tiri ya ihe.
- source_word: ὁμοθυμαδὸν
  choice: ji otu obi
  rationale: Ọ na-egosi na ha jikọrọ aka na otu nzube, karịa nanị ịnọkọ ọnụ.
- source_word: οἱ Ἰουδαῖοι
  choice: ndị Juu nọ n’ebe ahụ
  rationale: ‘Ndị Juu’ na-edobe okwu Grik; ‘nọ n’ebe ahụ’ na-eme ka ihe okwu a na-ezo aka na ya doo anya n’akụkọ a, n’enweghị ime ka ọ bụrụ ndị Juu niile.
- source_word: τῷ Παύλῳ
  choice: megide Pọl
  rationale: N’usoro okwu a, dative ahụ bụ onye e megidere; Igbo chọrọ ‘megide’ iji mee njikọ ahụ doo anya.
- source_word: ἤγαγον αὐτὸν
  choice: kpọrọ ya gaa
  rationale: Nke a na-egosi na ha duuru ma ọ bụ butere ya n’ebe a na-ekpe ikpe, n’agbakwunyeghị echiche nke ịdọkpụrụ ya n’ike.
- source_word: ἐπὶ τὸ βῆμα
  choice: n’ihu oche ikpe
  rationale: Ọ na-egosi ebe onye ọchịchị nọ ekpe ikpe; ọ bụ okwu doro ndị Igbo anya ma na-edobe ihe βῆμα pụtara n’ọnọdụ a.
theological_decisions:
- issue: Otú e si sụgharịa οἱ Ἰουδαῖοι n’akụkọ esemokwu
  choice: ndị Juu nọ n’ebe ahụ
  alternative: ndị Juu; ndị isi ndị Juu
  rationale: Grik kwuru kpọmkwem ‘ndị Juu,’ ọ bụghị naanị ndị isi ha. N’otu aka ahụ, gburugburu akụkọ a na-ekwu maka otu ndị Juu obodo ahụ mere ihe megide Pọl, ọ bụghị agbụrụ ma ọ bụ ndị Juu niile n’ụwa.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke oge a ma dị ugwu. A họọrọ ‘prokọnsụl’ iji chekwaa kpọmkwem ọkwa ọchịchị Rom, ebe ‘oche ikpe’ na-eme ka ọnọdụ ikpe ahụ doo onye nkịtị anya.
