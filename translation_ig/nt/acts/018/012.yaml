    reason: lexical_alternative
  - marker: b
    text: N’asụsụ Grik, ọ bụ “ndị Juu.” N’ebe a, ọ na-ezo aka n’otu ndị Juu obodo ahụ mere ihe megide Pọl, ọ bụghị ndị Juu niile n’ebe niile.
    reason: cultural_note
