review_pass:
  verdict: revise
  source_fidelity: A chọrọ mmezigharị. «na-atụrụ ... uche» pụtara ịdụ ndị mmadụ ọdụ ma ọ bụ inye ha ndụmọdụ, ọ bụghị διελέγετο, nke na-ekwu maka ikwurịta okwu ma ọ bụ ịrụ ụka e ji ezi uche eme. «Sabat ọ bụla» na-echekwa aha na nkesa nke κατὰ πᾶν σάββατον karịa «kwa ụbọchị izuike», nke nwere ike ịpụta ụbọchị izuike n'ozuzu ya.
  naturalness: «Ọ na-akparịta ụka n’ụlọ nzukọ ndị Juu» bụ Igbo Izugbe nke oge a ma kwekọọ n’ọnọdụ okwu n’ụlọ nzukọ. A hazikwara nkọwa ala peeji c ka ọ bụrụ nke doro anya ma ghara ikwu karịa ihe ederede ahụ kwuru.
  terminology: E debere «ndị Juu» na «ndị Gris». «Ụlọ nzukọ ndị Juu» bụ nkọwa ezi uche dị na ya maka συναγωγή n’ọnọdụ a, ebe «Sabat» na-echekwa okwu a kapịrị ọnụ. «na-achọ ime ka ... kwenye» na-egosi mbọ na-aga n'ihu nke imperfect n’enweghị ikwu na e mepụtara nkwenye.
