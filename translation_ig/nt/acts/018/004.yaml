    issue: «na-atụrụ ndị nọ n'ụlọ nzukọ ndị Juu uche»
    rationale: Nkebi a gbanwere διελέγετο ka ọ bụrụ inye ndụmọdụ ndị nọ ebe ahụ; Grik ahụ ekwughị «ndị nọ» ma na-ekwu maka omume ịkparịta ụka/ịrụ ụka e ji ezi uche eme.
  - severity: medium
    issue: «kwa ụbọchị izuike»
    rationale: O nwere ike ịdị ka «every day of rest» ma ọ bụ ụbọchị izuike n’ozuzu ya. «Sabat ọ bụla» na-enye kpọmkwem echiche «every Sabbath».
  - severity: low
