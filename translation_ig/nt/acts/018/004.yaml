  text: And he was reasoning in the synagogue every Sabbath and persuading Jews and Greeks[a][b][c].
translation:
  language: ig
  text: Ọ na-akparịta ụka n’ụlọ nzukọ ndị Juu Sabat ọ bụla, na-achọkwa ime ka ndị Juu na ndị Gris kwenye.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “Ọ na-atụle okwu” ma ọ bụ “Ọ na-arụrịta ụka.” Ngwaa Grik ahụ nwere ike ịpụta mkparịta ụka ma ọ bụ arụmụka e ji ezi uche eme.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, “na-eme ka ha kwenye.” Ọdịdị ngwaa Grik ahụ nwere ike imesi mbọ na-aga n'ihu ike, ya bụ, “na-achọ ime ka ha kwenye.”
    reason: lexical_alternative
  - marker: c
    text: N’ọnọdụ ụlọ nzukọ a, ụfọdụ na-ekwu na «ndị Gris» pụrụ izo aka n’ndị Gris ndị na ụlọ nzukọ ndị Juu na-emekọrịta ihe; ụfọdụ na-aghọta ya n’ụzọ sara mbara dị ka «ndị mba ọzọ».
    reason: alternative_reading
lexical_decisions:
- source_word: διελέγετο
  choice: na-atụrụ ndị nọ ... uche
  rationale: Ngwaa a na-egosi mkparịta ụka e ji ezi uche na arụmụka eme; ọdịdị imperfect na-egosikwa omume a na-eme ugboro ugboro.
- source_word: δὲ
  choice: Ọ
  rationale: δὲ bụ njikọ dị nro ebe a; n'Igbo, ịga n'ihu ozugbo site n'isiokwu bụ ụzọ ebumpụta ụwa karịa ịmanye njikọ pụrụ iche.
- source_word: ἐν τῇ συναγωγῇ
  choice: n'ụlọ nzukọ ndị Juu
  rationale: Nke a na-egosi ebe ihe ahụ mere; nkọwa 'ndị Juu' na-eme ka okwu Igbo doo onye nkịtị anya.
- source_word: κατὰ πᾶν σάββατον
  choice: kwa ụbọchị izuike
  rationale: κατά nwere echiche nkesa ebe a, ya bụ, n'ụbọchị izuike ọ bụla; ọ dabara n'omume a na-eme ugboro ugboro.
- source_word: ἔπειθέν
  choice: na-agbalịkwa ime ka ... kwenye
  rationale: Imperfect na-egosi mbọ na-aga n'ihu, na-enweghị ikwu na onye ọ bụla kwenyere n'ezie.
- source_word: τε
  choice: -kwa
  rationale: Mgbakwunye -kwa jikọtara omume nke abụọ na nke mbụ n'ụzọ Igbo dị mfe.
- source_word: Ἰουδαίους
  choice: ndị Juu
  rationale: Ọ na-ezo aka n'òtù ndị Juu n'ụzọ agbụrụ na okpukpe, ọ bụghị naanị ndị bi na Judia.
- source_word: Ἕλληνας
  choice: ndị Gris
  rationale: A na-echekwa aha kpọmkwem nke ederede Grik kama ịgbasa ya bụrụ 'ndị mba ọzọ.'
theological_decisions:
- issue: Ndị Ἕλληνας bụ ndị dị aṅaa n'ọnọdụ ụlọ nzukọ ndị Juu?
  choice: ndị Gris
  alternative: ndị mba ọzọ; ndị Gris na-atụ egwu Chineke
  rationale: Amaokwu ahụ kpọrọ ha ndị Gris, ma o kwughị kpọmkwem na ha bụ ndị na-atụ egwu Chineke. Ya mere, nsụgharị ahụ anaghị etinye nkọwa okpukpe nke ederede ahụ na-ekwughị.
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. 'Ụbọchị izuike' na-ezere ntụgharị mkpụrụokwu a gbaziri agbaziri, ebe 'ụlọ nzukọ ndị Juu' na-eme ka ọnọdụ ahụ doo anya. E debere ihe nrịbama nkọwa ala peeji niile n'ederede.
