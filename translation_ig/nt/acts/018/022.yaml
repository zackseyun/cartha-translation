revisions:
- from: Mgbe ọ rịdara na Sesaria[a], ọ rịgoro kelee nzukọ ahụ, mesịa rịdata gaa Antiọk.
  to: Mgbe ọ rịdara gaa Sesaria[a], ọ rịgoro kelee ọgbakọ ahụ, mesịa rịdata gaa Antiọk.
  rationale: The revision clarifies that Caesarea is the destination of the first descent and uses a more contextually precise term for the church, while retaining the Greek text’s unstated destination of «ọ rịgoro». The footnote preserves the interpretive possibility without presenting it as explicit in the source.
  reviewer_model: gpt-5.6-terra
