  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ κατελθὼν εἰς Καισάρειαν, ἀναβὰς καὶ ἀσπασάμενος τὴν ἐκκλησίαν, κατέβη εἰς Ἀντιόχειαν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/022.yaml
  text: And after going down to Caesarea[a], he went up and greeted the church, then went down to Antioch.
translation:
  language: ig
  text: Mgbe ọ rịdara gaa Sesaria[a], ọ rịgoro kelee ọgbakọ ahụ, mesịa rịdata gaa Antiọk.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O yikarịrị ka ọ bụ ọgbakọ dị na Jerusalem; ọtụtụ nsụgharị kpọrọ Jerusalem aha kpọmkwem n’ebe a, ma ederede Grik akpọghị ya aha.
    reason: alternative_reading
lexical_decisions:
- source_word: κατελθὼν
  choice: Mgbe ọ rịdara
  rationale: Na-egosi ihe mere tupu ngwaa bụ isi, ma na-echekwa ụzọ Luk si ekwu maka ịrịda n’ụzọ njem na ọnọdụ ala.
- source_word: Καισάρειαν
  choice: Sesaria
  rationale: Ọ bụ nsụgharị aha ebe ahụ a na-ejikarị n’Igbo; ihe gbara amaokwu ahụ gburugburu na-egosi Sesaria dị n’akụkụ osimiri.
- source_word: ἀναβὰς
  choice: ọ rịgoro
  rationale: Na-echekwa echiche ntụziaka dị n’asụsụ Grik n’etinyeghị Jerusalem n’ahịrịokwu, ebe ọ bụ na akpọghị ya aha n’ihe odide Grik.
- source_word: ἀσπασάμενος
  choice: kelee
  rationale: Na-enye ihe ngwaa ahụ pụtara kpọmkwem n’ụzọ dị mfe ma kwekọọ n’akụkọ njem a.
- source_word: τὴν ἐκκλησίαν
  choice: nzukọ ahụ
  rationale: N’ebe a, ọ na-ezo aka n’ọgbakọ ndị kwere ekwe. “Nzukọ ahụ” bụ okwu Igbo doro anya ma na-ezere ịkọwa ya dị ka ụlọ.
- source_word: κατέβη
  choice: rịdata gaa
  rationale: Na-echekwa ntụziaka ‘ịrịda’ nke Luk ji kọwaa njem ahụ, ma na-eme ka ahịrịokwu Igbo na-aga nke ọma.
- source_word: Ἀντιόχειαν
  choice: Antiọk
  rationale: Ọ bụ ọdịdị aha ebe ahụ a na-ejikarị n’Igbo; ebe a ọ na-ezo aka Antiọk nke Siria, ma ihe odide Grik etinyeghị nkọwa ahụ.
theological_decisions:
- issue: Ma a ga-akpọ Jerusalem aha dịka ebe ọ rịgoro
  choice: Ahapụrụ ebe ahụ n’amaghị aha n’ahịrịokwu bụ isi
  alternative: Ịsụgharị ya, “ọ rịgoro Jerusalem”
  rationale: Usoro njem ahụ na okwu banyere ikele nzukọ ahụ na-eme ka o yie nnọọ ka Jerusalem bụ ebe ahụ. Ma ebe ihe odide Grik na-akpọghị Jerusalem aha, nsụgharị ahụ echekwala ihe a na-egosipụta n’ekwughị ya hoo haa.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. E chekwara okwu ntụziaka ‘rịdata/rịgoro’ iji nọgide n’ụzọ Luk si akọ njem. Akara nkọwa ala ala [a] dị n’ahịrịokwu bụ isi.
