id: ACT.18.1
reference: Acts 18:1
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸀Μετὰ ταῦτα ⸀χωρισθεὶς ἐκ τῶν Ἀθηνῶν ἦλθεν εἰς Κόρινθον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/001.yaml
  text: After this[a], he left Athens and went to Corinth.
translation:
  language: ig
  text: Mgbe ihe ndị a gasịrị, ọ hapụrụ Atens gaa Kọrịnt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: Mgbe ihe ndị a gasịrị
  rationale: Nke a na-egosipụta usoro oge n’akụkọ ma na-edobe ụdị ọtụtụ nke ταῦτα (‘ihe ndị a’) n’ụzọ Igbo dị mma.
- source_word: χωρισθεὶς
  choice: ọ hapụrụ
  rationale: Ọ bụ participle aorist passive nke χωρίζω, ma n’ebe a ọ na-arụ ọrụ n’ụzọ akpaala okwu nke pụtara isi n’otu ebe pụọ; ‘ọ hapụrụ’ bụ Igbo doro anya ma dịkwuo ndụ karịa ịmanye passive.
- source_word: ἐκ τῶν Ἀθηνῶν
  choice: Atens
  rationale: ἐκ na-egosi ebe e si pụọ. N’Igbo, ngwaa ‘hapụrụ’ na-anabata aha ebe ahụ ozugbo, ya mere ‘ọ hapụrụ Atens’ na-ebute otu ihe ahụ n’ụzọ eke.
- source_word: ἦλθεν
  choice: gaa
  rationale: Ọ bụ ezie na ἔρχομαι nwere ike ịpụta ‘bịa,’ n’akụkọ njem site n’Atens ruo obodo ọzọ, ‘gaa’ bụ okwu Igbo kwesịrị ekwesị site n’ọnọdụ onye na-akọ akụkọ.
- source_word: εἰς Κόρινθον
  choice: Kọrịnt
  rationale: 'εἰς na-egosi ebe njem ahụ na-aga. Tinyere ‘gaa,’ aha obodo ahụ na-abịa ozugbo n’Igbo: ‘gaa Kọrịnt.’'
theological_decisions: []
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị mfe ma nwee ugwu. A họọrọ ‘Mgbe ihe ndị a gasịrị’ iji nọgide nso n’ụdị Grik, ebe usoro ‘ọ hapụrụ Atens gaa Kọrịnt’ na-ada nke ọma n’Igbo nkịtị.
