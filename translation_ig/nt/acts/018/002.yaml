    issue: “Ọ hụkwara” maka εὑρών
    rationale: Ngwaa ahụ pụtara ‘ọ chọtara,’ ọ bụghị ‘ọ hụkwara.’ Ọzọkwa, mgbakwunye -kwa (‘also’) enweghị nkwado doro anya n’amaokwu a.
  - severity: low
    issue: 'Nkọwa ala peeji: “ka ndị Juu kewapụ onwe ha na Rom”'
    rationale: ‘Kewapụ onwe ha’ na-etinye echiche mmegharị onwe onye. Grik χωρίζεσθαι ebe a na-ekwu maka ikewapụ/isi Rom pụọ n’ihi iwu Klọdịọs; a ga-eji okwu na-echekwa nke a.
