id: ACT.18.2
reference: Acts 18:2
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ εὑρών τινα Ἰουδαῖον ὀνόματι Ἀκύλαν, Ποντικὸν τῷ γένει, προσφάτως ἐληλυθότα ἀπὸ τῆς Ἰταλίας καὶ Πρίσκιλλαν γυναῖκα αὐτοῦ διὰ τὸ ⸀διατεταχέναι Κλαύδιον χωρίζεσθαι πάντας τοὺς Ἰουδαίους ⸀ἀπὸ τῆς Ῥώμης, προσῆλθεν αὐτοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/002.yaml
  text: And he found a Jew named Aquila[a], a native of Pontus, who had recently come from Italy with Priscilla his wife because Claudius had ordered all the Jews to leave Rome; and he went to them.
translation:
  language: ig
  text: Ọ chọtara otu nwoke Juu aha ya bụ Akwịla, onye si Pọntọs, onye ya na nwunye ya Prisila si Ịtali bịa n’oge na-adịbeghị anya, n’ihi na Klọdịọs nyere iwu ka ndị Juu niile si na Rom pụọ.[a] Ọ gakwuuru ha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ka a chụpụ ndị Juu niile na Rom.” N’ụzọ nkịtị karị, okwu Grik na-ekwu maka ka e kewapụ ndị Juu niile na Rom; ahịrị isi jiri okwu Igbo nkịtị, “si na Rom pụọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εὑρών
  choice: Ọ hụkwara
  rationale: Aorist participle a na-ebute ihe Pọl mere ọzọ. “Ọ hụkwara” na-ejikọta amaokwu a na akụkọ bu ya ụzọ ma na-enye echiche nke ịhụ ma ọ bụ ịchọta mmadụ.
- source_word: τινα Ἰουδαῖον
  choice: otu nwoke Juu
  rationale: τις na-egosi otu onye a na-akọwa ọhụrụ, ebe Ἰουδαῖον na-egosi njirimara ya dị ka onye Juu. Nke a bụ okwu Igbo doro anya ma dịkwa ebube.
- source_word: ὀνόματι Ἀκύλαν
  choice: aha ya bụ Akwịla
  rationale: Nke a bụ ụzọ Igbo nkịtị si ewebata aha mmadụ, ma ọ na-anọgide nso n’idiom Grik.
- source_word: Ποντικὸν τῷ γένει
  choice: onye si Pọntọs
  rationale: Nkebiokwu ahụ na-egosi ebe onye ahụ sitere ma ọ bụ ebe amụrụ ya. “Onye si Pọntọs” bụ Igbo dị mfe ma ọ naghị ekpebi kpọmkwem ma ọ bụ ebe ọmụmụ ka ọ bụ agbụrụ.
- source_word: προσφάτως ἐληλυθότα ἀπὸ τῆς Ἰταλίας
  choice: si Ịtali bịa n’oge na-adịbeghị anya
  rationale: Perfect participle na-egosi ọbịbịa mere obere oge tupu ihe a na-akọ, nke ka nwere mkpa n’oge ahụ.
- source_word: καὶ Πρίσκιλλαν γυναῖκα αὐτοῦ
  choice: ya na nwunye ya Prisila
  rationale: καί na-ejikọta Prisila, nwunye Akwịla, na ọbịbịa ahụ. “Ya na” na-eme ka njikọ a doo anya n’Igbo n’enweghị ikwubiga ihe odide ahụ ókè.
- source_word: διὰ τὸ διατεταχέναι Κλαύδιον
  choice: n’ihi na Klọdịọs nyere iwu
  rationale: διά na articular infinitive na-egosi ihe kpatara ya, ebe διατάσσω bụ inye iwu n’ụzọ ọchịchị.
- source_word: χωρίζεσθαι πάντας τοὺς Ἰουδαίους ἀπὸ τῆς Ῥώμης
  choice: ka ndị Juu niile si na Rom pụọ
  rationale: χωρίζεσθαι na ἀπό na-enye echiche nke ikewapụ onwe ha na Rom. “Si na Rom pụọ” bụ okwu Igbo nkịtị nke na-egosi nsonaazụ iwu ahụ, n’agbanyeghị na “ka a chụpụ ha” bụkwa nkọwa nwere ike ịdị.
- source_word: προσῆλθεν αὐτοῖς
  choice: Ọ gakwuuru ha
  rationale: προσέρχομαι pụtara ịgakwuru ma ọ bụ ịbịakwute mmadụ. “Ọ gakwuuru ha” dabara na ngagharị akụkọ ahụ.
theological_decisions:
- issue: Nkọwa Ἰουδαῖον / Ἰουδαίους
  choice: nwoke Juu / ndị Juu
  alternative: onye Judia / ndị Judia
  rationale: N’ebe a, okwu ahụ na-ezo aka n’ìgwè ndị Juu bi na Rom, ọ bụghị naanị ndị si n’ógbè Judia. Ya mere “Juu” kacha egosipụta njirimara agbụrụ na okpukpe dị n’amaokwu ahụ.
- issue: Ike iwu Klọdịọs pụtara
  choice: ka ndị Juu niile si na Rom pụọ
  alternative: ka a chụpụ ndị Juu niile na Rom
  rationale: Grik χωρίζεσθαι na-ekwu kpọmkwem maka ikewapụ ma ọ bụ isi ebe pụọ; ọ naghị eji ngwaa pụtara kpọmkwem “ịchụpụ.” E debere nkọwa siri ike karị n’ala peeji kama ịmanye ya n’ahịrị isi.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe ma dị ùgwù. A họọrọ “onye si Pọntọs” iji chekwaa ohere nkọwa dị n’etiti ebe ọmụmụ na ebe onye sitere, ma a zere okwu ụka pụrụ iche.
