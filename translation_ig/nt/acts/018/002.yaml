  source_fidelity: 'A chọrọ mmezi n’ọrụ εὑρών: “Ọ hụkwara” pụtara ‘he also saw,’ ma okwu Grik ebe a pụtara ‘having found/found.’ “Ọ chọtara” na-asụgharị ya n’ụzọ ziri ezi. Ihe ndị ọzọ—Akwịla onye Pọntọs, ọbịbịa ọhụrụ sitere Ịtali ya na Prisila, iwu Klọdịọs, na ịgakwuru ha—na-adị nso n’ihe Grik kwuru.'
  naturalness: 'Mgbanwe ahụ na-eme ka mmalite amaokwu ahụ bụrụ Igbo nkịtị ma doo anya: “Ọ chọtara otu nwoke Juu...” Ihe fọdụrụ n’ahịrịokwu ahụ na-agụ nke ọma n’usoro Standard Igbo.'
  terminology: “Nwoke Juu/ndị Juu,” “Pọntọs,” “Prisila,” “Klọdịọs,” na “si na Rom pụọ” dabara adaba. E meziekwara nkọwa ala peeji ka ọ ghara ikwu na ndị Juu ‘kewapụ onwe ha,’ nke nwere ike ịpụta omume afọ ofufo karịa ka usoro Grik chọrọ.
  issues:
