id: ACT.18.6
reference: Acts 18:6
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀντιτασσομένων δὲ αὐτῶν καὶ βλασφημούντων ἐκτιναξάμενος τὰ ἱμάτια εἶπεν πρὸς αὐτούς· Τὸ αἷμα ὑμῶν ἐπὶ τὴν κεφαλὴν ὑμῶν· καθαρὸς ἐγώ· ἀπὸ τοῦ νῦν εἰς τὰ ἔθνη πορεύσομαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/006.yaml
  text: But when they opposed and reviled him, he shook out his garments and said to them, “Your blood be on your own heads. I am innocent. From now on I will go to the Gentiles.”
translation:
  language: ig
  text: Ma mgbe ha guzogidere ma kwuo okwu nkwulu[a], ọ kwapụsịrị uwe ya, sị ha, “Ọbara unu dị n’isi unu[b]. Aka m dị ọcha. Site ugbu a gaa n’ihu, aga m agakwuru ndị mba ọzọ[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “kwulu Chineke.” Ngwaa Grik ahụ nwere ike ịpụta ikwu okwu nkwulu ma ọ bụ okwu mkparị; ebe a, ọ pụrụ ịpụta okwu mmegide siri ike.
    reason: lexical_alternative
  - marker: b
    text: “Ọbara unu dị n’isi unu” bụ akpaalaokwu pụtara na ọ bụ unu ga-aza ajụjụ maka ihe ga-esi na omume unu pụta.
    reason: cultural_note
  - marker: c
    text: A pụkwara ịsụgharị ya, “mba dị iche iche”; n’ebe a, ọ na-ezo aka ná ndị na-abụghị ndị Juu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀντιτασσομένων
  choice: ha guzogidere ya
  rationale: Okwu a na-egosi na ha ji aka ha guzogide Pọl na ozi ọ na-ezisa; ntụgharị a bụ asụsụ Igbo doro anya nke na-echekwa ike nke mmegide ahụ.
- source_word: βλασφημούντων
  choice: kwuo okwu mkparị
  rationale: Ngwaa Grik a nwere ike ịpụta ikwulu Chineke ma ọ bụ ikwu okwu mkparị na nke na-akparị mmadụ ma ọ bụ ozi; ebe ọ bụ na e kwughị onye okwu ahụ metụtara kpọmkwem, a gbakwụnyeghị “ya.”
- source_word: ἐκτιναξάμενος τὰ ἱμάτια
  choice: ọ fechara uwe ya
  rationale: 'Nke a na-anọgide nso n’omume ihe atụ e kwuru na Grik: Pọl fechara uwe ya iji gosi na ọ kewapụrụ onwe ya n’ọrụ dịịrị ha.'
- source_word: Τὸ αἷμα ὑμῶν ἐπὶ τὴν κεφαλὴν ὑμῶν
  choice: Ka ọbara unu dịkwasị n’isi unu
  rationale: E chekwara akpaalaokwu siri ike na nke dị nsọ, nke na-etinye ibu ọrụ maka ihe ga-esi na mkpebi ha pụta n’ahụ ha onwe ha.
- source_word: καθαρὸς ἐγώ
  choice: Aka m dị ọcha
  rationale: Akpaalaokwu Igbo a na-egosi na Pọl enweghị ikpe ma ọ bụ ibu ọrụ n’ihe ga-esi na ya pụta, ma na-echekwa ihe oyiyi nke καθαρός, ‘dị ọcha.’
- source_word: ἀπὸ τοῦ νῦν
  choice: Site ugbu a gaa n’ihu
  rationale: Nke a na-egosi mgbanwe doro anya malite n’oge ahụ gaa n’ihu.
- source_word: εἰς τὰ ἔθνη
  choice: agakwuru ndị mba ọzọ
  rationale: N’ọnọdụ a, τὰ ἔθνη na-ezo aka n’ebe ndị na-abụghị ndị Juu nọ, ọ bụghị naanị mba dị iche iche dịka mpaghara ndọrọ ndọrọ ọchịchị.
- source_word: πορεύσομαι
  choice: aga m agakwuru
  rationale: Nke a na-egosi mkpebi Pọl ịga n’ebe otu ndị ahụ nọ maka ozi ya, n’asụsụ Igbo na-aga were were.
theological_decisions:
- issue: Ihe usoro okwu “Ka ọbara unu dịkwasị n’isi unu” pụtara
  choice: E chekwara ya dịka nkwupụta siri ike na ibu ọrụ maka ihe ga-esi n’ịjụ ozi ahụ pụta dịịrị ndị nụrụ ya, ọ bụghị Pọl.
  alternative: Ịghọta ya dịka ọbụbụ ọnụ kpọmkwem nke Pọl na-akpọkwasị ha.
  rationale: Usoro okwu ahụ kwekọrọ n’asụsụ Akwụkwọ Nsọ banyere onye nche na ibu ọrụ. Ọ na-ekwupụta na Pọl arụzuola ọrụ ịgba ama ya, ma ntụgharị ahụ anaghị eme ka ọ bụrụ ọbụbụ ọnụ karịa ihe Grik kwuru.
- issue: Onye ma ọ bụ ihe βλασφημούντων metụtara
  choice: E hapụrụ onye okwu mkparị ahụ metụtara n’amaghị ama, dịka Grik si mee.
  alternative: Ịsị na ha kparịrị Pọl, ozi ya, ma ọ bụ kwulu Chineke kpọmkwem.
  rationale: Grik etinyeghị ihe nnata n’ebe a. Ịghara ịgbakwunye “ya” ma ọ bụ “Chineke” na-echekwa mgbagwoju anya dị n’ederede mbụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị nsọ ma dị mfe nghọta. “Aka m dị ọcha” bụ akpaalaokwu Igbo sitere n’echiche ịdị ọcha na enweghị ikpe; e zere ịgbakwunye onye βλασφημούντων metụtara, ma e debere nkọwa ọzọ n’ala peeji.
