- from: Ma mgbe ha guzogidere ya ma kwuo okwu mkparị[a], ọ fechara uwe ya, sị ha, “Ka ọbara unu dịkwasị n’isi unu[b]. Aka m dị ọcha. Site ugbu a gaa n’ihu, aga m agakwuru ndị mba ọzọ[c].”
  to: Ma mgbe ha guzogidere ma kwuo okwu nkwulu[a], ọ kwapụsịrị uwe ya, sị ha, “Ọbara unu dị n’isi unu[b]. Aka m dị ọcha. Site ugbu a gaa n’ihu, aga m agakwuru ndị mba ọzọ[c].”
  rationale: The revision makes the blood-on-the-heads formula declarative rather than optative, avoiding an unwarranted curse sense, and uses a clearer verb for shaking out/off the garments. It also removes the added specification “megide Pọl na ozi ya” from the lexical footnote so that the unspecified object of βλασφημούντων remains appropriately open, as in the Greek.
