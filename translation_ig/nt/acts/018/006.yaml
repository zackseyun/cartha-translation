  naturalness: The revised Standard Igbo is clear and maintains a solemn biblical register. “Ọbara unu dị n’isi unu” and “Aka m dị ọcha” are natural idiomatic expressions in this register.
  terminology: “Ndị mba ọzọ” appropriately renders τὰ ἔθνη in this Jewish/Gentile contrast, with the footnote clarifying the contextual sense. “Okwu nkwulu” retains the semantic breadth of βλασφημέω without supplying an unstated object.
  issues:
