    issue: “Ka ọbara unu dịkwasị n’isi unu” may be heard as a curse or wish.
    rationale: Greek Τὸ αἷμα ὑμῶν ἐπὶ τὴν κεφαλὴν ὑμῶν is a verbless responsibility formula. A declarative Igbo form better preserves its force without strengthening it into an imprecation.
