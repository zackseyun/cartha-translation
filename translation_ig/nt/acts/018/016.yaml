translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe ma nwee ugwu. “Chụpụ” na-echekwa omume siri ike nke ngwaa Grik; “oche ikpe” na-eme ka ọnọdụ ụlọikpe doo anya.
