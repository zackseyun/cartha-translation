  verdict: revise
  source_fidelity: The draft correctly conveys the authoritative expulsion (ἀπήλασεν) and retains the contextual pronoun “ha.” However, “n’ebe oche ikpe ahụ dị” primarily identifies the location where the seat is, rather than explicitly marking removal away from the judicial platform, which is expressed by ἀπό.
  naturalness: “O wee chụpụ ha pụọ n’ebe oche ikpe ahụ dị” is clear, idiomatic Standard Igbo narrative prose and makes the directional force explicit without overtranslating.
  terminology: “Oche ikpe” is a suitable established rendering for βῆμα in this judicial context. The note should describe it as a judicial seat or platform, rather than “oche ọchịchị,” which is broader and less precise.
  issues:
  - severity: medium
    issue: The directional force of ἀπὸ is underrepresented.
    rationale: The wording “n’ebe oche ikpe ahụ dị” can mean simply ‘at the place where the judgment seat is.’ Adding “pụta” makes clear that he expelled them away from that judicial setting.
  - severity: low
    issue: The footnote’s definition includes an imprecise alternative description.
    rationale: “Oche ọchịchị” can suggest a governmental/administrative chair generally. In Acts 18:16 βῆμα specifically denotes the magistrate’s judicial seat or tribunal platform.
