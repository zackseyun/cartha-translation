  text: καὶ ἀπήλασεν αὐτοὺς ἀπὸ τοῦ βήματος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/016.yaml
  text: And he drove them away from the judgment seat[a].
translation:
  language: ig
  text: O wee chụpụ ha pụọ n’ebe oche ikpe ahụ dị[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “n’ụlọikpe ahụ” ma ọ bụ “n’ihu oche onyeikpe ahụ”; okwu Grik βῆμα na-ekwu maka oche ikpe ma ọ bụ ikpo okwu ụlọikpe ebe onyeikpe na-anọ ekpe ikpe.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: O wee
  rationale: N’akụkọ Igbo, “O wee” na-ejikọta ihe omume a na nke bu ya ụzọ n'ụzọ eke, na-enweghị ịgbakwụnye nkọwa ọzọ.
- source_word: ἀπήλασεν
  choice: chụpụ
  rationale: “Chụpụ” na-egosi iji ikike mee ka ha pụọ, ma na-echekwa ike dị n’okwu Grik karịa okwu dị nro dịka “zilaga.”
- source_word: αὐτοὺς
  choice: ha
  rationale: Nnọchiaha “ha” na-ahapụ ndị a na-ekwu maka ha ka ama ha site n’ihe gbara amaokwu ahụ gburugburu, dịka ọ dị na Grik.
- source_word: ἀπὸ τοῦ βήματος
  choice: n’ebe oche ikpe ahụ dị
  rationale: N’ọnọdụ ikpe a, βῆμα bụ oche ma ọ bụ ikpo okwu ọchịchị ebe onye ikpe na-anọ ekpe ikpe. Nsụgharị a na-egosi na a chụpụrụ ha n’ebe ikpe ahụ na-aga, ọ bụghị naanị n’ihu Galio.
