  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εὐτόνως γὰρ τοῖς Ἰουδαίοις διακατηλέγχετο δημοσίᾳ ἐπιδεικνὺς διὰ τῶν γραφῶν εἶναι τὸν χριστὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/028.yaml
  text: For he powerfully refuted the Jews in public[b][a], demonstrating through the Scriptures that Jesus is the Messiah.
translation:
  language: ig
  text: N’ihi na o ji ike na-agbagha ndị Juu n’ihu ọha, na-egosi site n’Akwụkwọ Nsọ na Jizọs bụ Mesaya.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “na Mesaya ahụ bụ Jizọs.” Nhazi okwu Grik nwere ike ịkwado usoro abụọ ahụ.
    reason: lexical_alternative
  - marker: b
    text: N’asụsụ Grik, “Kraịst”; n’ebe a, a sụgharịrị ya “Mesaya” n’ihi na ọ bụ utu aha.
    reason: alternative_reading
lexical_decisions:
- source_word: εὐτόνως
  choice: na-eji ike
  rationale: Ọ na-egosi ịdị uchu na ike dị n’arụmụka Apọlọs, ma bụrụkwa okwu Igbo dị mfe nghọta.
- source_word: διακατηλέγχετο
  choice: ọ nọgidere ... agbagha
  rationale: Ngwaa a pụtara ịgbagha ndị ọzọ nke ọma ma gosi na ihe ha kwuru ezighị ezi; ‘ọ nọgidere’ na-egosipụta omume na-aga n’ihu nke imperfect Greek.
- source_word: τοῖς Ἰουδαίοις
  choice: ndị Juu
  rationale: Nke a bụ nsụgharị kwụ ọtọ; n’ọnọdụ a, ọ na-ezo aka n’ebe ndị Juu ya na ha na-arụrịta ụka nọ.
- source_word: δημοσίᾳ
  choice: n’ihu ọha
  rationale: Ọ na-egosi na arụmụka ahụ mere n’ebe ọhaneze nọ, ọ bụghị na nzuzo.
- source_word: ἐπιδεικνὺς
  choice: na-egosi
  rationale: Ọ na-egosipụta ihe akaebe na nkọwa doro anya, n’enweghị ime ka okwu ahụ sie ike karịa isi Greek.
- source_word: διὰ τῶν γραφῶν
  choice: na-esite n’Akwụkwọ Nsọ
  rationale: διά na genitive na-egosi ụzọ ma ọ bụ ihe e ji mee ihe; Akwụkwọ Nsọ bụ ihe akaebe o ji kwado okwu ya.
- source_word: τὸν χριστὸν
  choice: Mesaya
  rationale: Χριστός na-arụ ọrụ dị ka utu aha nke Onye E Tere Mmanụ ahụ n’arụmụka sitere n’Akwụkwọ Nsọ.
- source_word: Ἰησοῦν
  choice: Jizọs
  rationale: Ụdị aha a bụ nke a na-ejikarị eme ihe n’Igbo ọkọlọtọ.
- source_word: εἶναι τὸν χριστὸν Ἰησοῦν
  choice: na Jizọs bụ Mesaya
  rationale: Usoro a bụ nke kachasị eke n’Igbo, ma Greek nwekwara ike ịghọta ya dị ka ‘na Mesaya ahụ bụ Jizọs’; e debere nke ahụ n’ala peeji.
theological_decisions:
- issue: Nsụgharị Χριστός
  choice: Mesaya
  alternative: Kraịst
  rationale: N’ebe a, okwu ahụ bụ utu aha e kwere ná nkwa n’Akwụkwọ Nsọ, ya mere ‘Mesaya’ na-eme ka ọnọdụ Juu na arụmụka Apọlọs pụta ìhè.
- issue: Usoro okwu n’ahịrị infinitive εἶναι τὸν χριστὸν Ἰησοῦν
  choice: na Jizọs bụ Mesaya
  alternative: na Mesaya ahụ bụ Jizọs
  rationale: Nhazi Greek nwere ike ikwe ka e tinye okwu abụọ ahụ n’usoro ọ bụla n’asụsụ nnata; isi ederede jiri usoro Igbo kachasị eke, ebe ala peeji chekwara nke ọzọ.
translation_notes:
  register: E ji Igbo ọkọlọtọ nke oge a, dị ùgwù ma dị mfe nghọta. ‘Ọ nọgidere’ na-ebute akụkụ imperfect n’Igbo; ‘na-esite n’Akwụkwọ Nsọ’ na-egosi ụzọ o si nye ihe akaebe. E debere akara ala peeji abụọ ahụ n’isi ederede.
