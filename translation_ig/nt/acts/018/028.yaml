    text: A pụkwara ịsụgharị ya, “na Mesaya ahụ bụ Jizọs.” Nhazi okwu Grik nwere ike ịkwado usoro abụọ ahụ.
    reason: lexical_alternative
  - marker: b
    text: N’asụsụ Grik, “Kraịst”; n’ebe a, a sụgharịrị ya “Mesaya” n’ihi na ọ bụ utu aha.
    reason: alternative_reading
  revision_rationale: The revision removes an unwarranted explicit ‘continued’ sense while retaining the Greek imperfect through Igbo imperfective wording. It also improves the expression of the scriptural means and standardizes the footnote language. The alternative word order and the title rendering of χριστός remain properly anchored and preserve the source ambiguity.
