  text: λέγοντες ὅτι Παρὰ τὸν νόμον ⸂ἀναπείθει οὗτος⸃ τοὺς ἀνθρώπους σέβεσθαι τὸν θεόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/013.yaml
  text: saying[b][a], “This man is persuading people to worship God contrary to the law.”
translation:
  language: ig
  text: na-ekwu sị[a][b], “Nwoke a na-eme ka ndị mmadụ kwenye ife Chineke n'ụzọ megidere iwu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “megide iwu” ma ọ bụ “n'ụzọ na-emebi iwu.”
    reason: lexical_alternative
  - marker: b
    text: O yikarịrị ka ndị na-ebo ebubo na-ekwu maka iwu ndị Juu, ọ bụ ezie na asụsụ Grik kwuru naanị “iwu.”
    reason: cultural_note
lexical_decisions:
- source_word: λέγοντες ὅτι
  choice: na-asị, “...”
  rationale: Ngwaa nkọwa a na-ewebata ihe ndị ahụ boro Pọl ebubo; n'Igbo, okwu e kwuru kpọmkwem na-ada nke ọma ma na-edobe usoro okwu Grik.
- source_word: Παρὰ τὸν νόμον
  choice: n'ụzọ megidere iwu
  rationale: παρά ya na nnara aha na-egosi ime ihe megidere ma ọ bụ ịda iwu; nsụgharị a na-edobe ụda ikpe dị n'ebubo ahụ.
- source_word: ἀναπείθει
  choice: na-eme ka ... kweta
  rationale: Oge ugbu a na-egosi omume na-aga n'ihu nke ime ka mmadụ kwenye; nhọrọ a anaghị etinye echiche siri ike nke iduhie mmadụ nke okwu Grik anaghị achọ kpọmkwem.
- source_word: οὗτος
  choice: Nwoke a
  rationale: Ọ na-edobe ike ngosipụta nke okwu ahụ n'ime ebubo ahụ n'enweghị ịgbakwunye mkparị.
- source_word: τοὺς ἀνθρώπους
  choice: ndị mmadụ
  rationale: ἄνθρωποι ebe a na-ezo aka n'ebe mmadụ niile nọ, ọ bụghị naanị ụmụ nwoke.
- source_word: σέβεσθαι τὸν θεόν
  choice: ife Chineke
  rationale: N'ọnọdụ okpukpe a, σέβομαι pụtara ịsọpụrụ Chineke site n'ofufe; ‘ife Chineke’ bụ okwu Igbo doro anya ma bụrụkwa nke nkịtị.
- source_word: τὸν νόμον
  choice: iwu
  rationale: Grik kwuru naanị ‘iwu’; etinyeghị ‘iwu ndị Juu’ ma ọ bụ ‘iwu anyị,’ ka a ghara ịkọwapụta ihe isi mmalite ahụ hapụrụ n'ụzọ sara mbara.
theological_decisions:
- issue: Ihe ‘iwu’ na-ezo aka na ya n'ebubo ahụ
  choice: Debe naanị ‘iwu’ n'ahịrịokwu bụ isi.
  alternative: iwu ndị Juu; iwu anyị
  rationale: O yikarịrị ka ndị na-ebo ebubo na-ekwu maka iwu ndị Juu, ma Grik kwuru naanị τὸν νόμον. Ihe odide bụ isi na-edobe nke a; nkọwa dị n'okpuru na-enye ihe gbasara ọnọdụ ahụ.
- issue: Nsụgharị ἀνθρώπους nke na-ezo aka n'ebe mmadụ niile nọ
  choice: ndị mmadụ
  alternative: ụmụ nwoke
  rationale: Ụdị ọtụtụ nke nwoke ebe a abụghị naanị maka nwoke; ‘ndị mmadụ’ na-ezipụta ebumnuche ahụ nke ọma n'Igbo nke oge a.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke oge a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-edobe ụda ebubo iwu, na-ahapụghị nghọta sara mbara nke okwu Grik. E tinyere akara nkọwa [a] na [b] ozugbo n'ahịrịokwu bụ isi.
