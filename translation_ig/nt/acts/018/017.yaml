- from: Mgbe ahụ, ha niile jidere Sọstinis[a], onyeisi ụlọ nzukọ ndị Juu, na-eti ya ihe n’ihu oche ikpe. Ma Galio eleghị ihe ndị a anya.
  to: Mgbe ahụ, ha niile jidere Sọstenes[a], onyeisi ụlọ nzukọ ndị Juu, na-eti ya ihe n’ihu oche ikpe. Ma Galio enweghị mmasị n’ihe ndị a.
  rationale: The revision retains the source text’s ambiguity about who “all” were and retains the imperfect sense of the beating. It standardizes Sosthenes’ name and uses a more direct idiomatic expression for Gallio’s lack of concern. No doctrinal or group identification has been introduced.
