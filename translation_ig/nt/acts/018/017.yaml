  text: ἐπιλαβόμενοι δὲ ⸀πάντες Σωσθένην τὸν ἀρχισυνάγωγον ἔτυπτον ἔμπροσθεν τοῦ βήματος· καὶ οὐδὲν τούτων τῷ Γαλλίωνι ⸀ἔμελεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/017.yaml
  text: Then they all seized Sosthenes[a], the synagogue ruler, and beat him in front of the tribunal. But Gallio paid no attention to these things.
translation:
  language: ig
  text: Mgbe ahụ, ha niile jidere Sọstenes[a], onyeisi ụlọ nzukọ ndị Juu, na-eti ya ihe n’ihu oche ikpe. Ma Galio enweghị mmasị n’ihe ndị a.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ụfọdụ ihe odide na-agụ, “ndị Grik niile,” kama naanị “ha niile.” Ihe odide ndị kacha ochie dị nkenke karị, ọ kpọghịkwa ìgwè ahụ aha.
    reason: textual_variant
lexical_decisions:
- source_word: ἐπιλαβόμενοι
  choice: jidere
  rationale: Ọ na-egosi ijide mmadụ n’ike; okwu a dị mfe ma kwekọọ n’ihe ike sochiri ya.
- source_word: πάντες
  choice: ha niile
  rationale: Ọ na-edobe echiche nke mmadụ niile metụtara ya, ma ọ naghị ekwu ndị ha bụ ebe Grik ahụ na-ekwughị ya.
- source_word: ἀρχισυνάγωγον
  choice: onyeisi ụlọ nzukọ ndị Juu
  rationale: Ọ na-akọwa onyeisi na-ahụ maka ụlọ nzukọ ndị Juu n’ụzọ onye Igbo nke oge a ga-aghọta.
- source_word: ἔτυπτον
  choice: na-eti ya ihe
  rationale: Ụdị imperfect Grik na-egosi iti ihe na-aga n’ihu ma ọ bụ ugboro ugboro; usoro Igbo a na-ebupụta nke ahụ.
- source_word: ἔμπροσθεν τοῦ βήματος
  choice: n’ihu oche ikpe
  rationale: βῆμα bụ ebe gọvanọ nọ ekpe ikpe; ‘oche ikpe’ na-enye ọnọdụ iwu ahụ n’ụzọ doro anya ma dị nkenke.
- source_word: οὐδὲν τούτων ... ἔμελεν
  choice: eleghị ihe ndị a anya
  rationale: Nke a bụ ụzọ Igbo sitere n’okike isi kwuo na Galio enyeghị ihe ndị ahụ uche ma ọ bụ na ha abụghị ihe gbasara ya.
- source_word: δέ
  choice: Mgbe ahụ
  rationale: Ọ na-egosi ọganihu n’akụkọ ahụ.
- source_word: καί
  choice: Ma
  rationale: Ọ na-eme ka ọdịiche dị n’etiti ihe ike ìgwè mmadụ ahụ mere na enweghị mmasị Galio pụta ìhè.
theological_decisions:
- issue: Ndị πάντες (‘ha niile’) na-ezo aka na ha
  choice: A hapụrụ ndị ha bụ n’amaghị ama dịka ‘ha niile.’
  alternative: Ndị Grik niile; ma ọ bụ ndị Juu niile
  rationale: Ihe odide Grik a họọrọ kwuru naanị πάντες, ọ kpọghị ìgwè ahụ aha. Ya mere, nsụgharị ahụ ekwesịghị ikpebi ihe isi mmalite ahụ na-ekpebighị; nkọwa ala peeji na-egosi ọdịiche dị n’ihe odide ụfọdụ.
translation_notes:
  register: Standard Igbo dị ugbu a, kwanyere ùgwù ma dị mfe nghọta. E debere mgbagwoju anya banyere ndị ‘ha niile’ bụ, tinyekwa akara nkọwa [a] n’ebe kwesịrị ekwesị.
