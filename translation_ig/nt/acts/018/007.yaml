id: ACT.18.7
reference: Acts 18:7
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ μεταβὰς ἐκεῖθεν ⸀εἰσῆλθεν εἰς οἰκίαν τινὸς ὀνόματι ⸀Τιτίου Ἰούστου σεβομένου τὸν θεόν, οὗ ἡ οἰκία ἦν συνομοροῦσα τῇ συναγωγῇ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/007.yaml
  text: And after leaving there[a], he entered the house of a man named Titius Justus, who worshiped God[b], whose house was next to the synagogue.
translation:
  language: ig
  text: Mgbe o si ebe ahụ pụọ, ọ banyere n'ụlọ otu nwoke aha ya bụ Titiọs Jọstọs, onye na-efe Chineke[a]. Ụlọ ya dị kpọmkwem n'akụkụ ụlọ nzukọ ahụ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “onye na-atụ egwu Chineke” ma ọ bụ “onye na-asọpụrụ Chineke.” Okwu Grik a na-akọwa onye na-abụghị onye Juu nke raara onwe ya nye ife Chineke Izrel.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, “ụlọ ya dịdebere ụlọ nzukọ ahụ” ma ọ bụ “ụlọ ya na ụlọ nzukọ ahụ nwere otu ókè.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μεταβὰς ἐκεῖθεν
  choice: Mgbe ọ hapụrụ ebe ahụ
  rationale: Ọ na-egosi na ọ si n'ebe ahụ pụọ tupu ihe omume bụ isi emee; nhazi a bụ Igbo doro anya ma na-edobe usoro ihe omume ahụ.
- source_word: εἰσῆλθεν εἰς οἰκίαν τινὸς
  choice: ọ banyere n'ụlọ otu nwoke
  rationale: “Banyere n'ụlọ” na-enye kpọmkwem echiche nke ịbanye, ebe “otu nwoke” na-egosipụta nnọchiaha na-akọwaghị onye ahụ kpọmkwem.
- source_word: ὀνόματι Τιτίου Ἰούστου
  choice: aha ya bụ Titiọs Jọstọs
  rationale: Nke a bụ ụzọ Igbo nkịtị si ewebata aha mmadụ, ebe a na-asụgharị ụda aha Grik ahụ n'ụzọ kwekọrọ n'usoro edemede Igbo.
- source_word: σεβομένου τὸν θεόν
  choice: onye na-efe Chineke
  rationale: Ọ na-akọwa ofufe na nsọpụrụ ọ na-enye Chineke n'enweghị itinye ya n'otu òtù okpukpe pụrụ iche nke ederede ahụ na-akpọghị aha.
- source_word: οὗ ἡ οἰκία ἦν συνομοροῦσα τῇ συναγωγῇ
  choice: Ụlọ nwoke ahụ dịdebere ụlọ nzukọ ahụ
  rationale: “Dịdebere” na-egosi na ụlọ abụọ ahụ dị n'akụkụ ibe ha, ọbụna na ha nwere ike ịkekọrịta ókè; ikewa ya dịka ahịrịokwu nke abụọ na-eme ka Igbo ya bụrụ ihe a na-agụ nke ọma.
theological_decisions:
- issue: Nkọwa σεβόμενος τὸν θεόν banyere Titiọs Jọstọs
  choice: onye na-efe Chineke
  alternative: onye na-atụ egwu Chineke
  rationale: Nhọrọ a na-edobe ya dịka nkọwa banyere ofufe ya kama ime ka okwu ahụ bụrụ aha otu pụrụ iche. Ihe ọzọ a pụrụ ịsụgharị ya bụ “onye na-atụ egwu Chineke,” ya mere e debere nke ahụ n'ala ala peeji.
translation_notes:
  register: E ji Igbo Ọkọlọtọ nke oge a, nke dị ùgwù ma dị mfe nghọta. E kewara nkebi ikpeazụ ka njikọ nnọchiaha ghara ịdị arọ n'Igbo, ma e chekwara ihe niile dị n'ahịrịokwu Grik.
