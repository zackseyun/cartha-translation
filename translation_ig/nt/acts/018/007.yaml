- from: Mgbe ọ hapụrụ ebe ahụ, ọ banyere n'ụlọ otu nwoke aha ya bụ Titiọs Jọstọs, onye na-efe Chineke[a]. Ụlọ nwoke ahụ dịdebere ụlọ nzukọ ahụ[b].
  to: Mgbe o si ebe ahụ pụọ, ọ banyere n'ụlọ otu nwoke aha ya bụ Titiọs Jọstọs, onye na-efe Chineke[a]. Ụlọ ya dị kpọmkwem n'akụkụ ụlọ nzukọ ahụ[b].
