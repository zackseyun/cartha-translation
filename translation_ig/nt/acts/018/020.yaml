  text: But when they asked him to stay for a longer time[a], he did not consent,
translation:
  language: ig
  text: Ma mgbe ha rịọrọ ya ka ọ nọrọkwuo oge[a], o kwenyeghị,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “o kweghị” ma ọ bụ “ọ jụrụ arịrịọ ahụ.” Okwu Grik ahụ pụtara ikweta ma ọ bụ inye nkwenye n’arịrịọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐρωτώντων
  choice: mgbe ha rịọrọ ya
  rationale: Genitive absolute ahụ na-egosi ọnọdụ oge; “mgbe ha rịọrọ ya” bụ Igbo ebumpụta ụwa ma gosipụta na nke a bụ arịrịọ, ọ bụghị naanị ajụjụ.
- source_word: δὲ
  choice: Ma
  rationale: '“Ma” na-egosi obere ntụgharị ma ọ bụ ọdịiche n’akụkọ ahụ: ha rịọrọ ya, ma ọ kwadoghị arịrịọ ahụ.'
- source_word: αὐτῶν
  choice: ha / ya
  rationale: N’ọnọdụ a, nnọchiaha ahụ na-ezo aka n’ụmụ mmadụ nọ n’Efesọs; asụsụ Igbo chọrọ ka e kwuo onye ha rịọrọ, ya bụ “ya.”
- source_word: ἐπὶ πλείονα χρόνον
  choice: ogologo oge karịa
  rationale: Nhọrọ a na-echekwa echiche ntụnyere dị na πλείονα, ya bụ ịnọ karịa oge ahụ o bu n’obi ịnọ.
- source_word: μεῖναι
  choice: ka ọ nọrọ
  rationale: “Ịnọ” bụ ụzọ doro anya ma dịkwa ebumpụta ụwa isi kwuo ịnọgide n’otu ebe n’akụkọ njem.
- source_word: οὐκ ἐπένευσεν
  choice: o kwenyeghị
  rationale: ἐπινεύω pụtara ikweta ma ọ bụ inye nkwenye n’arịrịọ; “o kwenyeghị” na-echekwa nke ahụ n’enweghị ime ka ọ bụrụ ọjụjụ siri ike karịa ihe Grik kwuru.
