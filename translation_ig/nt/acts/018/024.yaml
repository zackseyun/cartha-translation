base_translation:
  language: en
  yaml_path: translation/nt/acts/018/024.yaml
  text: A certain Jew named Apollos[a], an Alexandrian by birth, an eloquent man, arrived in Ephesus, being mighty in the Scriptures.
translation:
  language: ig
  text: Otu onye Juu aha ya bụ Apọlọs[a], onye Aleksandria, bụ nwoke maara ikwu okwu nke ọma, bịarutere Efesọs ebe ọ bụ onye maara Akwụkwọ Nsọ nke ukwuu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “bụ nwoke gụrụ akwụkwọ nke ukwuu.” Okwu Grik bụ λόγιος pụrụ ịkọwa onye maara ikwu okwu nke ọma ma ọ bụ onye gụrụ akwụkwọ nke ukwuu.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰουδαῖος
  choice: onye Juu
  rationale: N'ebe a okwu ahụ na-akọ agbụrụ na okpukpe Apọlọs, ọ bụghị naanị onye si Judia.
- source_word: δέ τις
  choice: Otu
  rationale: Otu na-ewebata onye ọhụrụ a na-akọ banyere ya ma na-egosipụta ntakịrị nghọta nke τις; a hapụrụ njikọ δέ ka usoro ahịrịokwu Igbo wee bụrụ nke e kere eke.
- source_word: Ἀπολλῶς ὀνόματι
  choice: aha ya bụ Apọlọs
  rationale: Nke a bụ ụzọ Igbo nke oge a si ekwu n'ụzọ doro anya na aha nwoke ahụ bụ Apọlọs.
- source_word: Ἀλεξανδρεὺς τῷ γένει
  choice: onye Aleksandria site n'ọmụmụ
  rationale: Nke a na-egosi obodo o si ma ọ bụ ebe e si mụọ ya, na-enweghị itinye echiche agbụrụ nke okwu ahụ anaghị achọ.
- source_word: ἀνὴρ λόγιος
  choice: bụ nwoke maara ikwu okwu nke ọma[a]
  rationale: ἀνήρ na-egosi nwoke kpọmkwem; λόγιος nwere ike ịpụta onye na-ekwu okwu nke ọma ma ọ bụ onye gụrụ akwụkwọ. Isi ederede họọrọ nghọta nke ikwu okwu nke ọma, ebe e debere nke ọzọ n'okpuru peeji.
- source_word: κατήντησεν εἰς Ἔφεσον
  choice: Ọ bịarutere Efesọs
  rationale: Ngwaa ahụ pụtara iru ebe a na-aga; bịarutere bụ okwu Igbo doro anya ma kwekọọ n'ụzọ e si ekwu ebe mmadụ rutere.
- source_word: δυνατὸς ὢν ἐν ταῖς γραφαῖς
  choice: bụrụkwa onye maara Akwụkwọ Nsọ nke ukwuu
  rationale: Nke a na-egosipụta ike na nghọta miri emi Apọlọs nwere n'ihe gbasara Akwụkwọ Nsọ n'Igbo sitere n'okike, kama iji okwu ga-ada ka ike anụ ahụ.
theological_decisions: []
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, nke dị ugwu ma dị mfe nghọta. E kewara ahịrịokwu Grik ahụ ụzọ abụọ iji mee ka ọ na-aga nke ọma n'Igbo, ma e chekwara nkọwa ya na nghọta abụọ dị na λόγιος.
