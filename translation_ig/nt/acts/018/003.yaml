  text: καὶ διὰ τὸ ὁμότεχνον εἶναι ἔμενεν παρ’ αὐτοῖς καὶ ⸀ἠργάζετο, ἦσαν γὰρ σκηνοποιοὶ ⸂τῇ τέχνῃ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/003.yaml
  text: And because he was of the same trade[a], he stayed with them and worked, for they were tentmakers by trade.
translation:
  language: ig
  text: N’ihi na ọrụ aka ya na nke ha bụ otu, ọ nọnyere ha ma na-arụ ọrụ, n’ihi na ọrụ aka ha bụ ịkwa ụlọikwuu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma eleghị anya, ‘ndị na-arụ ọrụ akpụkpọ anụ’; okwu Grik a nwekwara ike ịpụta n’ụzọ sara mbara ndị na-akwa ụlọikwuu ma ọ bụ ndị na-arụ ọrụ aka metụtara ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τὸ ὁμότεχνον εἶναι
  choice: Ebe ọ bụkwa na ọrụ aka ya na nke ha bụ otu
  rationale: διά tinyere articular infinitive na-egosi ihe kpatara ya. Nsụgharị a na-egosi na Pọl na ha nwere otu ụdị ọrụ aka, ma ọ naghị akpọpụta ụdị ọrụ ahụ tupu akụkụ ikpeazụ nke amaokwu ahụ.
- source_word: ἔμενεν παρ’ αὐτοῖς
  choice: ọ nọdụrụ n’ụlọ ha
  rationale: μένω pụtara ịnọ ma ọ bụ ịnọgide. N’ọnọdụ akụkọ a, okwu a na-egosi na Pọl biri n’ebe ha nọ; ‘n’ụlọ ha’ bụ ụzọ Igbo doro anya si kwuo ya.
- source_word: ἠργάζετο
  choice: na-arụkọ ọrụ
  rationale: ἐργάζομαι na-ekwu maka ịrụ ọrụ aka. Akara ‘na-’ na-egosipụta omume na-aga n’ihu nke imperfect, ebe ‘-kọ’ na-eme ka o doo anya na ọ rụrụ ọrụ n’ebe ha nọ n’otu ọrụ ahụ.
- source_word: σκηνοποιοὶ
  choice: ndị na-akwa ụlọikwuu
  rationale: Nke a bụ isi nghọta a na-anabata nke ọma maka σκηνοποιός. A na-eji ‘ịkwa ụlọikwuu’ mee ka ọrụ imepụta ya doo anya n’Igbo, ebe e debere nghọta sara mbara nke ndị na-arụ akpụkpọ anụ n’ala peeji.
- source_word: τῇ τέχνῃ
  choice: ọrụ aka ha bụ
  rationale: τέχνη ebe a na-egosi akaọrụ ma ọ bụ ọrụ mmadụ ji ebi ndụ. Usoro a bụ nke Igbo nkịtị ma na-egosi na ịkwa ụlọikwuu bụ ọrụ ha.
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta mee ihe. A họọrọ ‘ọrụ aka’ iji gosipụta τέχνη/ὁμότεχνος n’enweghị ịgbakwụnye nkọwa okpukpe. Akara ala peeji [a] dị n’isi ederede ma na-echekwa ihe okwu Grik ahụ nwekwara ike ịpụta.
