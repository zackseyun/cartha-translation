id: ACT.18.21
reference: Acts 18:21
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸂ἀλλὰ ἀποταξάμενος καὶ⸃ ⸀εἰπών· ⸀Πάλιν ἀνακάμψω πρὸς ὑμᾶς τοῦ θεοῦ θέλοντος ἀνήχθη ἀπὸ τῆς Ἐφέσου,
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/021.yaml
  text: but after taking leave and saying[a], “I will return to you again[b], if God wills,” he set sail from Ephesus.
translation:
  language: ig
  text: Ma, mgbe ọ sịrị ha ka ọ dị, sị[a], “M ga-alọghachikwute unu ọzọ[b], ma Chineke chọrọ,” o ji ụgbọ mmiri si n’Efesọ pụọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ụfọdụ ihe odide ochie enweghị okwu ndị a: ‘ma sị, “M ga-alọghachikwute unu ọzọ, ma Chineke chọrọ.”’'
    reason: textual_variant
  - marker: b
    text: 'Ma ọ bụ: ‘Chineke kwere.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Ma
  rationale: Na-egosi ọdịiche dị n’etiti arịrịọ ha ka ọ nọrọ ogologo oge na mkpebi ya ịpụ.
- source_word: ἀποταξάμενος
  choice: mgbe ọ hapụrụ ha
  rationale: Na-egosi na ọ gwara ha nke ọma na ya na-apụ; okwu a bụ nke dị mfe ma kwekọọ n’usoro omume dị na Grik.
- source_word: καὶ εἰπών
  choice: ma kwuo sị
  rationale: Na-echekwa omume nke abụọ so n’ịhapụ ha, ma na-ada nke ọma n’Igbo.
- source_word: Πάλιν
  choice: ọzọ
  rationale: Na-enye echiche nke imeghachi omume ahụ ọzọ.
- source_word: ἀνακάμψω
  choice: M ga-alọghachikwute
  rationale: Na-egosi ịlaghachikwuru ndị a na-agwa okwu, dịka πρός na-egosi.
- source_word: πρὸς ὑμᾶς
  choice: unu
  rationale: E tinyere ntụziaka ahụ n’ime ngwaa ‘alọghachikwute,’ nke bụ ụzọ ebumpụta ụwa isi kwuo ya n’Igbo.
- source_word: τοῦ θεοῦ θέλοντος
  choice: ma ọ bụrụ na Chineke achọọ
  rationale: Na-echekwa ọnọdụ nke atụmatụ Pọl dabere n’ọchịchọ Chineke, ma kpọọ Chineke aha dịka Grik si mee.
- source_word: ἀνήχθη
  choice: o ... banye n’ụgbọ mmiri
  rationale: N’akụkọ njem, ngwaa a na-egosi ịbanye n’ụgbọ mmiri wee pụọ n’oké osimiri; ntụgharị a doro ndị na-agụ Igbo anya.
- source_word: ἀπὸ τῆς Ἐφέσου
  choice: si n’Efesọ
  rationale: Na-egosi ebe njem ụgbọ mmiri ahụ malitere, jiri ụdị aha obodo a na-ahụkarị n’Igbo.
theological_decisions:
- issue: Nkwupụta na atụmatụ njem Pọl dabere n’ọchịchọ Chineke
  choice: ma ọ bụrụ na Chineke achọọ
  alternative: ọ bụrụ uche Chineke
  rationale: Grik kpọrọ θεός, ‘Chineke,’ aha ma gosipụta ọnọdụ; ntụgharị a echekwaghị ya ka ọ ghara ịgbanwe ya ka ọ bụrụ ‘Onyenwe anyị’ ma ọ bụ mee ka ọnọdụ ahụ ghara ịdị ike.
translation_notes:
  register: Standard Igbo; asụsụ dị ugwu ma dị mfe nghọta. E ji ‘n’Efesọ’ mee elision kwesịrị ekwesị, ma zere okwu ụka pụrụ iche na nkọwa na-adịghị na isi mmalite.
