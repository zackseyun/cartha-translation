    reason: textual_variant
  - marker: b
    text: 'Ma ọ bụ: ‘Chineke kwere.’'
    reason: lexical_alternative
  revision_rationale: The revision preserves the Greek participial sequence in idiomatic Igbo, retains the explicit reference to God and the conditional force of the genitive absolute, and corrects the maritime departure verb. The textual-variant footnote remains anchored to the introductory speech and continues to identify the disputed words without resolving the textual question beyond the supplied audit trail.
