  text: καὶ ποιήσας χρόνον τινὰ ἐξῆλθεν, διερχόμενος καθεξῆς τὴν Γαλατικὴν χώραν καὶ Φρυγίαν, ⸀στηρίζων πάντας τοὺς μαθητάς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/023.yaml
  text: And after spending some time there[a], he departed and traveled from place to place through the Galatian region and Phrygia, strengthening all the disciples.
translation:
  language: ig
  text: Mgbe ọ nọrọ ebe ahụ nwa oge, ọ hapụrụ ebe ahụ, na-agafe n'usoro n'ógbè Galetia na Frijia, ma na-eme ka ndị na-eso ụzọ niile sie ike.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “na-agafe site n'otu ebe gaa n'ebe ọzọ” ma ọ bụ “na-agafe ebe ndị ahụ n'otu n'otu” n'ógbè Galetia na Frijia.
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιήσας χρόνον τινά
  choice: Mgbe ọ nọsịrị ebe ahụ nwa oge
  rationale: Nkebi okwu a pụtara ịnọ ma ọ bụ iwepụta oge n'otu ebe. “Ebe ahụ” sitere n'ọnọdụ akụkọ ahụ ma mee ka Igbo doo anya nke ọma.
- source_word: ἐξῆλθεν
  choice: ọ hapụrụ ebe ahụ
  rationale: N'akụkọ njem, okwu a na-egosi isi n'otu ebe pụọ. Nsụgharị a bụ Igbo nkịtị ma doo anya.
- source_word: διερχόμενος
  choice: na-agafe
  rationale: Ọ na-egosi njem na-aga n'ihu site n'ógbè dị iche iche, na-enweghị itinye nkọwa ọzọ na-adịghị n'okwu Grik.
- source_word: καθεξῆς
  choice: site n'otu ebe ruo n'ọzọ
  rationale: Ọ na-egosi na ọ gara n'ebe ndị ahụ n'usoro, otu ebe soro ibe ya. Nke a bụ ụzọ Igbo dị mfe ma bụrụkwa nke e ji ekwu okwu taa.
- source_word: τὴν Γαλατικὴν χώραν
  choice: n'ógbè Galetia
  rationale: χώρα bụ ógbè, ala, ma ọ bụ mpaghara. “Ógbè Galetia” anaghị ekpebi na ọ bụ naanị ógbè ọchịchị Rom ka a na-ekwu maka ya.
- source_word: καὶ Φρυγίαν
  choice: na Frijia
  rationale: E dere aha ebe ahụ n'ụdị kwekọrọ n'Igbo; echiche “ógbè” nke dị na nkebi okwu bu ya ụzọ metụtakwara ya.
- source_word: στηρίζων
  choice: na-eme ka ... sie ike
  rationale: στηρίζω pụtara ime ka mmadụ guzosie ike ma ọ bụ sikwuo ike. Nhọrọ a na-echekwa echiche nkwado ndị na-eso ụzọ n'etinyeghị nkọwa okpukpe ọzọ.
- source_word: πάντας τοὺς μαθητάς
  choice: ndị niile na-eso ụzọ ahụ
  rationale: “Ndị na-eso ụzọ” bụ okwu Igbo doro anya maka μαθηταί n'Ọrụ Ndị Ozi, ebe “niile” na-echekwa πάντας.
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta, sụgharịa amaokwu ahụ. E debere akara [a] n'akụkụ okwu καθεξῆς nke nkọwa ala peeji ahụ metụtara, kama idowe ya n'akụkụ “ebe ahụ.”
