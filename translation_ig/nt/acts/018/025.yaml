  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οὗτος ἦν κατηχημένος τὴν ὁδὸν τοῦ κυρίου, καὶ ζέων τῷ πνεύματι ἐλάλει καὶ ἐδίδασκεν ἀκριβῶς τὰ περὶ τοῦ ⸀Ἰησοῦ, ἐπιστάμενος μόνον τὸ βάπτισμα Ἰωάννου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/025.yaml
  text: This man had been instructed in the way of the Lord[a], and being fervent in spirit, he was speaking and teaching accurately the things concerning Jesus, knowing only the baptism of John.
translation:
  language: ig
  text: Nwoke a anatala ntụziaka n’ụzọ Onyenwe anyị. Ọ na-anụ ọkụ n’ime mmụọ[a], na-ekwu ma na-akụzi nke ọma ihe banyere Jizọs, ebe ọ maara naanị baptizim Jọn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “na-anụ ọkụ n’ime Mmụọ Nsọ.” Nke a pụrụ izo aka na Mmụọ Nsọ karịa mmụọ ime Apọlọs.
    reason: alternative_reading
lexical_decisions:
- source_word: κατηχημένος
  choice: A kụziiri
  rationale: Na-egosi na ọ natara nkuzi na mbụ, nke mmetụta ya ka dị; okwu a bụ Igbo nkịtị ma ọ naghị ebubata echiche teknụzụ ụka e mesịrị.
- source_word: τὴν ὁδὸν τοῦ κυρίου
  choice: ụzọ Onyenwe anyị
  rationale: Na-echekwa akpaalaokwu Ndị Kraịst oge mbụ banyere ‘ụzọ’ ma na-asụgharị κύριος dịka ‘Onyenwe anyị.’
- source_word: ζέων τῷ πνεύματι
  choice: na-anụ ọkụ n’ime mmụọ
  rationale: ‘Na-anụ ọkụ’ na-eburu ihe oyiyi nke ζέων—ịgba ọkụ ma ọ bụ ịnụ ọkụ n’obi. ‘Mmụọ’ na-ahapụ ohere ma ọ̀ bụ mmụọ ime Apọlọs ma ọ bụ Mmụọ Nsọ.
- source_word: ἐλάλει καὶ ἐδίδασκεν
  choice: ọ na-ekwu ma na-akụzikwa
  rationale: Ụdị ‘ọ na-’ na-egosi omume na-aga n’ihu ma ọ bụ nke a na-eme ugboro ugboro, dịka imperfect Grik ahụ.
- source_word: ἀκριβῶς
  choice: n’ụzọ ziri ezi
  rationale: Na-egosi izi ezi nke ihe ọ na-ekwu na-akụzi, n’Igbo dị mfe ma doo anya.
- source_word: τὰ περὶ τοῦ Ἰησοῦ
  choice: ihe banyere Jizọs
  rationale: Na-echekwa obosara nke okwu Grik ahụ n’enweghị ịkọwapụta karịa ihe ederede kwuru.
- source_word: ἐπιστάμενος μόνον τὸ βάπτισμα Ἰωάννου
  choice: ma ọ maara naanị baptizim Jọn
  rationale: Na-egosipụta oke ihe ọ maara n’ụzọ Igbo sitere n’okike; ‘ma’ na-eme ka ọdịiche dị na nkọwa ahụ pụta ìhè n’enweghị ime ka ọ bụrụ nkwupụta ozizi ọzọ.
theological_decisions:
- issue: Ihe τῷ πνεύματι pụtara na ζέων τῷ πνεύματι
  choice: mmụọ ime mmadụ / ịnụ ọkụ n’obi
  alternative: Mmụọ Nsọ
  rationale: Grik ahụ nwere ike izo aka na mmụọ ime Apọlọs ma ọ bụ na Mmụọ Nsọ. Isi ederede anaghị ekpebi ya kpamkpam; ihe odide ala peeji na-echekwa nghọta nke ọzọ.
translation_notes:
  register: Igbo Izugbe dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji ‘baptizim’ mee ihe dịka okwu Baịbụl a maara nke ọma; e zere okwu teknụzụ ụka na nkọwa na-ekpebi nghọta nke πνεῦμα.
