revisions:
- from: O wee setịpụrụ ya aka ya[a], kulite ya; mgbe ahụ, ọ kpọrọ ndị nsọ na ndị inyom di ha nwụrụ, chee ya n’ihu ha ná ndụ.
  to: O nyere ya aka, mee ka o bilie[a]; mgbe ahụ, ọ kpọrọ ndị nsọ na ndị inyom di ha nwụrụ, ma gosi ha ya dị ndụ.
  rationale: 'The revision uses idiomatic Standard Igbo while retaining the source sequence: Peter gives her his hand, causes her to rise, summons the saints and widows, and presents her to them alive. The note is moved to the translated ἀνέστησεν and retains the resurrection-related lexical resonance without making a doctrinal claim beyond the narrative.'
