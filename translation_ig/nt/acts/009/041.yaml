review_pass:
  verdict: revise
  source_fidelity: The draft preserves the basic sequence and all principal referents, but its rendering of παρέστησεν is not idiomatic or sufficiently clear in Igbo. The hand gesture and the causative sense of ἀνέστησεν also need a more natural formulation.
  naturalness: “O wee setịpụrụ ya aka ya” is awkward and redundantly phrased. “Chee ya n’ihu ha ná ndụ” is not natural Standard Igbo; “gosi ha ya dị ndụ” clearly conveys that Peter presented her to the summoned people alive.
  terminology: “Ndị nsọ” appropriately retains τοὺς ἁγίους, and “ndị inyom di ha nwụrụ” clearly renders τὰς χήρας. “Dị ndụ” is the idiomatic predicative expression for ζῶσαν.
  issues:
  - severity: medium
    issue: Awkward rendering of δοὺς ... χεῖρα
    rationale: “Setịpụrụ ya aka ya” is not idiomatic and repeats “aka.” “O nyere ya aka” is natural Igbo for extending/giving a hand in assistance.
  - severity: high
    issue: Unnatural and unclear rendering of παρέστησεν αὐτὴν ζῶσαν
    rationale: “Chee ya n’ihu ha ná ndụ” is not a natural Igbo construction. The Greek means that he presented/showed her to them as alive; “ma gosi ha ya dị ndụ” communicates this accurately.
  - severity: low
    issue: Footnote anchor does not match the word discussed
    rationale: The note explains ἀνέστησεν but the marker follows “aka,” which represents χεῖρα. It should follow the rendering of the raising/causing-to-rise verb.
  revised_text: O nyere ya aka, mee ka o bilie[a]; mgbe ahụ, ọ kpọrọ ndị nsọ na ndị inyom di ha nwụrụ, ma gosi ha ya dị ndụ.
  revised_footnotes:
