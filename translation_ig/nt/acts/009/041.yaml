id: ACT.9.41
reference: Acts 9:41
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: δοὺς δὲ αὐτῇ χεῖρα ἀνέστησεν αὐτήν, φωνήσας δὲ τοὺς ἁγίους καὶ τὰς χήρας παρέστησεν αὐτὴν ζῶσαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/041.yaml
  text: And giving her his hand[a], he raised her up; then he called the saints and the widows and presented her alive.
translation:
  language: ig
  text: O nyere ya aka, mee ka o bilie[a]; mgbe ahụ, ọ kpọrọ ndị nsọ na ndị inyom di ha nwụrụ, ma gosi ha ya dị ndụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “kulite ya” ma ọ bụ “mee ka o guzoro ọtọ.” Ngwaa Grik ahụ nwere ike ịpụta ime ka mmadụ bilie ma ọ bụ guzoro ọtọ; n’ebe a, ọ na-enwekwa ụda okwu metụtara mbilite n’ọnwụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: δοὺς ... χεῖρα
  choice: setịpụrụ ya aka ya
  rationale: Nke a na-egosipụta omume Pita nke ịgbatị ya aka iji nyere ya aka, ma na-anọkwa nso n’usoro okwu Grik.
- source_word: ἀνέστησεν
  choice: kulite ya
  rationale: “Kulite ya” nwere ike ịpụta ime ka mmadụ bilie ma ọ bụ guzoro; n’ọnọdụ a, ọ na-ejidekwa ụda okwu metụtara mbilite n’ọnwụ n’akụkọ ahụ.
- source_word: φωνήσας
  choice: ọ kpọrọ
  rationale: Nke a bụ ụzọ Igbo dị mfe ma doo anya isi kwuo na ọ kpọkọtara ndị ahụ tupu o chee ya n’ihu ha.
- source_word: τοὺς ἁγίους
  choice: ndị nsọ
  rationale: “Ndị nsọ” bụ ntụgharị kwụ ọtọ nke aha Agba Ọhụrụ ji akọwa ndị Chineke doro nsọ, na-enweghị ịgbanwe ya ka ọ bụrụ naanị “ndị kwere ekwe.”
- source_word: τὰς χήρας
  choice: ndị inyom di ha nwụrụ
  rationale: Okwu a doro ndị na-agụ Igbo nke oge a anya ma na-edobe ndị otu a iche dịka ederede Grik si mee.
- source_word: παρέστησεν
  choice: chee ya n’ihu ha
  rationale: N’ebe a, ngwaa ahụ pụtara iweta ma ọ bụ iche mmadụ n’ihu ndị ọzọ; ntụgharị a na-egosipụta omume ahụ nke ọma.
- source_word: ζῶσαν
  choice: ná ndụ
  rationale: 'Ọ na-akọ ọnọdụ ya mgbe Pita cheere ya n’ihu ha: ọ dị ndụ. Nke a bụ okwu Igbo eke ma sie ike n’akụkọ banyere nlọghachi ya na ndụ.'
theological_decisions:
- issue: Ụzọ e si tụgharị ἀνέστησεν n’akụkọ metụtara mbilite n’ọnwụ
  choice: kulite ya
  alternative: nyere ya aka ka o bilie / mee ka o guzoro ọtọ
  rationale: “Kulite ya” dabara n’omume ahụ Pita mere ozugbo ma na-echekwa ụda okwu metụtara mbilite n’ọnwụ, n’ebughị ihe karịrị ihe ederede kwuru.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. E debere “ndị nsọ” maka izi ezi nke okwu Agba Ọhụrụ, ma kọwaa “ndị inyom di ha nwụrụ” n’ụzọ doro ndị mmadụ anya.
