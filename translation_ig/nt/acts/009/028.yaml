  source_fidelity: 'A chọrọ imezi mmalite ahịrịokwu ahụ: “Ya na ha nọ” nwere ike ịpụta “ya na ha [ha abụọ/òtù ahụ] nọ,” ya mere ọ naghị akọwapụta nke ọma na Sọl nọnyere ha. “Ọ nọnyere ha” na-egosipụta ἦν μετ’ αὐτῶν n’enweghị itinye echiche ibi ma ọ bụ ịnọ ogologo oge. “Na-abanye ma na-apụ” na-edobe ụzọ okwu Grik abụọ ahụ nke ọma karịa “na-abata ma na-apụ apụ.”'
  naturalness: Ntụgharị e degharịrị dị mma n’Igbo Izugbe ugbu a ma na-agụ nke ọma. A hapụrụ usoro participle atọ ahụ ka ọ na-egosi omume na-aga n’ihu.
