  text: καὶ ἦν μετ’ αὐτῶν εἰσπορευόμενος ⸂καὶ ἐκπορευόμενος⸃ εἰς ⸀Ἰερουσαλήμ, παρρησιαζόμενος ἐν τῷ ὀνόματι τοῦ ⸀κυρίου,
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/028.yaml
  text: And he was with them in Jerusalem, going in and going out, speaking boldly in the name of the Lord.
translation:
  language: ig
  text: Ọ nọnyere ha na Jerusalem, na-abanye ma na-apụ, na-ekwu okwu n’atụghị egwu n’aha Onyenwe anyị.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἦν μετ’ αὐτῶν
  choice: Ya na ha nọ
  rationale: Nke a na-egosipụta mkpakọrịta ha na-aga n'ihu, n'etinyeghị echiche siri ike karịa nke ịnọnyere ha.
- source_word: εἰσπορευόμενος καὶ ἐκπορευόμενος
  choice: na-abata ma na-apụ apụ
  rationale: Ọ na-echekwa ụzọ okwu abụọ ahụ si egosi ịgagharị na mkpakọrịta n'enweghị mgbochi; nkwughachi dị na “apụ apụ” na-eme ka omume na-aga n'ihu doo anya n'Igbo.
- source_word: εἰς Ἰερουσαλήμ
  choice: na Jeruselem
  rationale: N'ebe a, Jeruselem bụ ebe omume ahụ na-eme, ọ bụghị na ọ na-abanye n'obodo ahụ ugboro ugboro.
- source_word: παρρησιαζόμενος
  choice: na-ekwukwa okwu n'atụghị egwu
  rationale: Nke a na-egosi ikwu okwu n'ihu ọha n'enweghị ụjọ, ma jiri okwu Igbo dị mfe nghọta.
- source_word: ἐν τῷ ὀνόματι
  choice: n'aha
  rationale: Ọ na-echekwa akpaala okwu Akwụkwọ Nsọ nke nwere ike ịgụnye ikike, nnọchiteanya, na nkwupụta, n'emeghị ka ọ bụrụ naanị otu n'ime ha.
- source_word: τοῦ κυρίου
  choice: Onyenwe anyị
  rationale: A tụgharịrị κύριος dị ka utu aha, kama dochie ya n'aha Jizọs; “Onyenwe anyị” bụ ụzọ e si akọwa utu aha a n'Igbo Akwụkwọ Nsọ n'ụzọ dị ùgwù.
theological_decisions:
- issue: Onye okwu ahụ bụ “Onyenwe anyị” na-ezo aka na ya
  choice: E debere utu aha ahụ dịka “Onyenwe anyị”; n'ọnọdụ akụkọ a, ọ na-ezo aka na Jizọs.
  alternative: Ịsụgharị ya kpọmkwem dịka “Jizọs.”
  rationale: Ihe odide Grik nwere κυρίου, ọ bụghị Ἰησοῦ. Idebe utu aha ahụ na-echekwa okwu isi mmalite na mkpa utu aha a nwere n'akwụkwọ Luk na Ọrụ Ndị Ozi.
translation_notes:
  register: 'Asụsụ Igbo Izugbe dị ugbu a, dị mfe ma dị ùgwù. Nhazi ahịrịokwu ahụ na-edebe omume atọ na-aga n''ihu: ịnọnyere ndị na-eso ụzọ, ịbata na ịpụ apụ, na ikwu okwu n''atụghị egwu.'
