  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐλάλει τε καὶ συνεζήτει πρὸς τοὺς Ἑλληνιστάς· οἱ δὲ ἐπεχείρουν ⸂ἀνελεῖν αὐτόν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/029.yaml
  text: And he was speaking and debating with the Hellenists[a], but they were attempting to kill him.
translation:
  language: ig
  text: Ọ nọ na-ekwu okwu ma na-arụrịta ụka na ndị Juu na-asụ Grik[a], ma ha na-achọ igbu ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịkpọ ha, “ndị Helenist.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλάλει
  choice: Ọ nọ na-agwa ... okwu
  rationale: Oge imperfect na-egosi omume na-aga n’ihu ma ọ bụ nke a na-eme ugboro ugboro; usoro a na-egosipụta nke ahụ n’Igbo dị mfe.
- source_word: τε καὶ
  choice: ma
  rationale: Ọ na-ejikọta omume abụọ Saịlọs nọ na-eme n’ụzọ dabara adaba n’Igbo.
- source_word: συνεζήτει
  choice: na-arụrịta ụka
  rationale: Okwu Grik a na-egosi mkparịta ụka siri ike ma ọ bụ esemokwu, ọ bụghị naanị mkparịta ụka nkịtị.
- source_word: πρὸς τοὺς Ἑλληνιστάς
  choice: na ndị Juu na-asụ Grik ... na ha
  rationale: πρός n’ebe a na-egosi mmekọrịta n’etiti ndị na-arụrịta ụka; Ἑλληνισταί bụ ndị Juu na-asụ Grik.
- source_word: Ἑλληνιστάς
  choice: ndị Juu na-asụ Grik
  rationale: Nsụgharị nkọwa a na-eme ka ndị na-agụ akwụkwọ taa ghọta otu ndị ahụ ozugbo, ma ndetu ala na-echekwa aha otu ahụ e si na Grik nweta.
- source_word: οἱ δὲ
  choice: ma ha
  rationale: δέ na-egosi mgbanwe nke na-emegide ihe Saịlọs na-eme.
- source_word: ἐπεχείρουν
  choice: ha nọ na-achọ ụzọ ha ga-esi
  rationale: Ọ na-egosipụta mgbalị ha nọgidere na-eme, kwekọrọ n’imperfect Grik.
- source_word: ἀνελεῖν αὐτόν
  choice: gbuo ya
  rationale: N’ọnọdụ a ἀναιρέω pụtara igbu mmadụ; nke a bụ okwu Igbo doro anya ma bụrụkwa nke nkịtị.
theological_decisions:
- issue: Ndị Ἑλληνισταί bụ ndị ndị?
  choice: ndị Juu na-asụ Grik
  alternative: Ndị Helenist; ndị Grik; ndị na-asụ Grik
  rationale: Ojiji okwu a n’Ọrụ Ndị Ozi, karịsịa 6:1, na-egosi otu ndị Juu e ji asụsụ Grik mara, ọ bụghị ndị mba ọzọ n’ozuzu ha.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ugwu ma doo ndị nkịtị anya. A kọwara ‘Hellenists’ n’ahịrị bụ isi ka onye na-agụ ghọta ya ozugbo, ebe ndetu ala nyere aha otu ahụ e si na Grik nweta.
