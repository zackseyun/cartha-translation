  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἠγέρθη δὲ ⸀Σαῦλος ἀπὸ τῆς γῆς, ἀνεῳγμένων ⸀δὲ τῶν ὀφθαλμῶν αὐτοῦ ⸀οὐδὲν ἔβλεπεν· χειραγωγοῦντες δὲ αὐτὸν εἰσήγαγον εἰς Δαμασκόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/008.yaml
  text: But Saul got up from the ground[a], and though his eyes were open, he saw nothing. So they led him by the hand and brought him into Damascus.
translation:
  language: ig
  text: Ma Sọl si n’ala bilie. Mgbe anya ya meghere, ọ hụghị ihe ọ bụla.[a] Ha duuru ya n’aka banye Damaskọs.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ, n’ụzọ dabara n’usoro okwu Grik karịa, “ebe anya ya meghere, ọ hụghị ihe ọ bụla.” Nhazi okwu Grik ahụ na-eme ka ọdịiche ahụ pụta ìhè: anya ya meghere, ma ọ hụghị ihe ọ bụla.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠγέρθη
  choice: bilie
  rationale: 'N’akụkọ a, ụdị ngwaa a na-arụ ọrụ dị ka ngwaa na-enweghị ihe a na-eme ya: Sọl si n’ala bilie. “Bilie” bụ okwu Igbo doro anya ma bụrụkwa nke a na-ejikarị eme ihe.'
- source_word: ἀπὸ τῆς γῆς
  choice: si n’ala
  rationale: N’ebe a, γῆ pụtara ala Sọl dara n’elu ya, ọ bụghị ụwa dum ma ọ bụ otu mpaghara ala.
- source_word: ἀνεῳγμένων ... τῶν ὀφθαλμῶν αὐτοῦ
  choice: Ọ bụ ezie na anya ya meghere emeghe
  rationale: 'Nkebiokwu a na-egosi ọnọdụ so ihe ahụ mee ma na-eme ka ọdịiche ahụ pụta ìhè: anya ya ghe oghe, ma ọ ka ahụghị ihe.'
- source_word: οὐδὲν ἔβλεπεν
  choice: ọ hụghị ihe ọ bụla
  rationale: Nke a na-egosi n’ụzọ kwụ ọtọ na Sọl enweghị ike ịhụ ihe ọbụla, ma na-anọkwa nso n’usoro okwu Grik.
- source_word: χειραγωγοῦντες
  choice: ha duuru ya n’aka
  rationale: χειραγωγέω pụtara iduru mmadụ n’aka, karịchaa onye chọrọ onye ga-eduzi ya; ntụgharị a na-edobe onyinyo ahụ kpọmkwem.
- source_word: εἰσήγαγον εἰς Δαμασκόν
  choice: kpọbata ya na Damaskọs
  rationale: εἰσάγω pụtara ịkpọbata ma ọ bụ iduba n’ime ebe. Ebe e kwuburu otu ha si duru ya, “kpọbata” na-ezere ikwughachi “duru” ma na-egosi mbata n’obodo ahụ.
- source_word: δὲ
  choice: Ma / Ya mere
  rationale: δὲ na-akwalite akụkọ ahụ ma na-egosikwa obere ọdịiche. “Ma” na mmalite na-ejikọta amaokwu a na ihe gara aga, ebe “Ya mere” na-egosi ihe ha mere n’ihi na Sọl ahụghị ụzọ.
- source_word: Σαῦλος
  choice: Sọl
  rationale: E dere aha onye ahụ n’ụdị a maara nke ọma n’Igbo.
- source_word: Δαμασκόν
  choice: Damaskọs
  rationale: E dere aha obodo ahụ n’ụdị translitereeshọn dabara n’usoro ụda na odide Igbo.
theological_decisions: []
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta, dee ya. E debere ọdịiche dị n’etiti anya ghe oghe na enweghị ike ịhụ ụzọ, tinyekwara ihe oyiyi doro anya nke iduru Sọl n’aka.
