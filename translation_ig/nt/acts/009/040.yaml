    text: Ma ọ bụ, “Kulie.” Okwu iwu Grik a nwere ike ịpụta “bilie” ma ọ bụ “kulie.”
    reason: lexical_alternative
  revision_rationale: The revision corrects the Igbo narrative construction and replaces an awkward final clause with an idiomatic equivalent, while maintaining the source’s order, referents, and restrained wording. The footnote remains anchored to “bilie” and now gives a precise lexical alternative.
