  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐκβαλὼν δὲ ἔξω πάντας ὁ Πέτρος ⸀καὶ θεὶς τὰ γόνατα προσηύξατο, καὶ ἐπιστρέψας πρὸς τὸ σῶμα εἶπεν· Ταβιθά, ἀνάστηθι. ἡ δὲ ἤνοιξεν τοὺς ὀφθαλμοὺς αὐτῆς, καὶ ἰδοῦσα τὸν Πέτρον ἀνεκάθισεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/040.yaml
  text: But Peter put them all outside[a], knelt down and prayed, and turning toward the body said, “Tabitha, arise.” Then she opened her eyes, and when she saw Peter, she sat up.
translation:
  language: ig
  text: Ma Pita mere ka ha niile pụọ; o wee gbuo ikpere n’ala kpee ekpere. Mgbe ahụ, ọ tụgharịrị chee ahụ nwanyị ahụ ihu, sị, “Tabita, bilie[a].” Nwanyị ahụ meghere anya ya; mgbe ọ hụrụ Pita, ọ nọdụ ọdụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Kulie.” Okwu iwu Grik a nwere ike ịpụta “bilie” ma ọ bụ “kulie.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκβαλὼν ... ἔξω πάντας
  choice: zipụrụ ha niile n’èzí
  rationale: Nke a na-egosi na Pita mere ka ndị niile nọ ebe ahụ pụọ n’ụlọ ahụ, n’ebughị echiche ike dị n’okwu dịka ‘chụpụsịrị’.
- source_word: θεὶς τὰ γόνατα
  choice: gbuo ikpere n’ala
  rationale: Nke a bụ ụzọ Igbo si ekwu omume ikpere n’ala, karịsịa mgbe mmadụ na-ekpe ekpere.
- source_word: προσηύξατο
  choice: kpee ekpere
  rationale: Ọ bụ nsụgharị doro anya na nke a na-ejikarị eme ihe maka omume ikpe ekpere.
- source_word: ἐπιστρέψας πρὸς τὸ σῶμα
  choice: ọ tụgharịrị chee ahụ Tabita ihu
  rationale: Ọ na-edobe ntụgharị ahụ Pita mere na okwu σῶμα, ‘ahụ,’ ma aha Tabita na-eme ka onye a na-ekwu maka ya doo anya n’Igbo.
- source_word: Ταβιθά
  choice: Tabita
  rationale: E degharịrị aha Aramaik ahụ n’ụdị mkpụrụedemede na mkpọpụta dabara n’Igbo.
- source_word: ἀνάστηθι
  choice: bilie
  rationale: ‘Bilie’ bụ iwu nkịtị ma dịkwa nsọpụrụ n’ọnọdụ a; ọ nwere ike ịpụta ibili ma ọ bụ ik उठि/get up n’enweghị ịtinye nkọwa ozizi ọzọ.
- source_word: ἤνοιξεν τοὺς ὀφθαλμοὺς αὐτῆς
  choice: meghere anya ya
  rationale: Nke a bụ nsụgharị kpọmkwem, nke na-ada nke ọma n’Igbo.
- source_word: ἰδοῦσα τὸν Πέτρον
  choice: mgbe ọ hụrụ Pita
  rationale: Nkebi oge a na-egosi usoro ihe mere n’ụzọ dị mfe nghọta n’Igbo.
- source_word: ἀνεκάθισεν
  choice: o kuliri onwe ya nọdụ ọdụ
  rationale: Nke a na-egosi na onye dina ala weliri elu nọdụ ọdụ, kama ịsị naanị na ọ ‘nọdụrụ ala,’ nke nwere ike ịpụta na o si n’ọnọdụ iguzo nọdụ.
- source_word: δὲ
  choice: Ma / Nwanyị ahụ
  rationale: ‘Ma’ na-egosi mgbanwe sitere n’ihe ndị bu ụzọ; n’ebe nke abụọ, a kọwara isiokwu ahụ dịka ‘Nwanyị ahụ’ iji mee ka akụkọ ahụ gaa n’ihu n’Igbo eke.
theological_decisions:
- issue: Otu e si sụgharịa iwu metụtara nbilite
  choice: bilie
  alternative: kulie onwe gị; kwụrụ ọtọ
  rationale: ‘Bilie’ na-echekwa ma iwu dị mfe ma ụda okwu metụtara iweghachi ndụ, ma ọ naghị ekpebi karịa ihe okwu Grik ἀνάστηθι n’onwe ya kwuru.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe ma nwee ugwu. A zere okwu ochie na ụdị okwu ụka pụrụ iche. Akara nkọwa [a] dị n’ebe okwu ἀνάστηθι pụtara, n’ihi na nkọwa ahụ metụtara iwu ahụ, ọ bụghị izipụ ndị mmadụ n’èzí.
