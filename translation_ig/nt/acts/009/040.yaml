- from: Ma Pita zipụrụ ha niile n’èzí, gbuo ikpere n’ala kpee ekpere. Mgbe ahụ, ọ tụgharịrị chee ahụ Tabita ihu, sị, “Tabita, bilie[a].” Nwanyị ahụ meghere anya ya; mgbe ọ hụrụ Pita, o kuliri onwe ya nọdụ ọdụ.
  to: Ma Pita mere ka ha niile pụọ; o wee gbuo ikpere n’ala kpee ekpere. Mgbe ahụ, ọ tụgharịrị chee ahụ nwanyị ahụ ihu, sị, “Tabita, bilie[a].” Nwanyị ahụ meghere anya ya; mgbe ọ hụrụ Pita, ọ nọdụ ọdụ.
