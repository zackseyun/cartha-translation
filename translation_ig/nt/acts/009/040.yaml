review_pass:
  verdict: revise
  source_fidelity: The draft conveys the sequence and core actions accurately. However, the narrative verb forms after Pita are not well formed without a connective, and the final expression is unnecessarily awkward. The revised wording retains σώμα as “ahụ nwanyị ahụ” and preserves the straightforward imperative ἀνάστηθι.
  naturalness: “Pita ... gbuo ikpere n’ala kpee ekpere” is not natural as an unmarked past narrative sequence. Adding “o wee” makes the action sequence idiomatic. “O kuliri onwe ya nọdụ ọdụ” is cumbersome; “ọ nọdụ ọdụ” naturally communicates sitting up in this context.
  terminology: Pita and Tabita are appropriate Standard Igbo forms. “Bilie” is a suitable, nonsectarian rendering of ἀνάστηθι. The footnote is revised because “Kulie onwe gị” introduces a reflexive element not present in the Greek and its explanation was imprecise.
  issues:
  - severity: medium
    issue: Unnatural narrative verb sequence after the subject Pita
    rationale: The forms “gbuo ... kpee” need an appropriate narrative linker in this context. “O wee gbuo ikpere n’ala kpee ekpere” is clear, natural Standard Igbo and preserves the Greek sequence.
  - severity: medium
    issue: Awkward rendering of ἀνεκάθισεν
    rationale: “O kuliri onwe ya nọdụ ọdụ” is redundant and stylistically strained. In the immediate context, “ọ nọdụ ọdụ” naturally means that she sat up from where she had been lying.
  - severity: low
    issue: Footnote alternative adds reflexivity and has unclear wording
    rationale: The Greek imperative does not explicitly include “onwe gị.” A concise alternative, “Kulie,” accurately reflects the available idiomatic rendering without adding an element.
  revised_text: Ma Pita mere ka ha niile pụọ; o wee gbuo ikpere n’ala kpee ekpere. Mgbe ahụ, ọ tụgharịrị chee ahụ nwanyị ahụ ihu, sị, “Tabita, bilie[a].” Nwanyị ahụ meghere anya ya; mgbe ọ hụrụ Pita, ọ nọdụ ọdụ.
  revised_footnotes:
