id: ACT.9.15
reference: Acts 9:15
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἶπεν δὲ πρὸς αὐτὸν ὁ κύριος· Πορεύου, ὅτι σκεῦος ἐκλογῆς ⸂ἐστίν μοι⸃ οὗτος τοῦ βαστάσαι τὸ ὄνομά μου ἐνώπιον ⸀ἐθνῶν ⸀τε καὶ βασιλέων υἱῶν τε Ἰσραήλ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/015.yaml
  text: But the Lord said to him[a], “Go[b], because this man is a chosen instrument of mine to carry my name before the Gentiles and kings and the sons of Israel,”
translation:
  language: ig
  text: Ma Onyenwe anyị sịrị ya, “Gaa, n’ihi na nwoke a bụ ngwá ọrụ m họpụtara ka o buru aha m n’ihu ndị mba ọzọ[a], ndị eze, na ụmụ Izrel[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “mba dị iche iche.”
    reason: lexical_alternative
  - marker: b
    text: “Ụmụ Izrel” bụ akpaalaokwu ọdịnala nke Akwụkwọ Nsọ nke pụtara “ndị Izrel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριος
  choice: Onyenwe anyị
  rationale: Ọ bụ nsụgharị Igbo a na-ejikarị asụ κύριος dị ka utu aha; n’akụkọ a, ọ na-ezo aka n’ebe Jizọs bilitere n’ọnwụ nọ.
- source_word: Πορεύου
  choice: Gaa
  rationale: Iwu a dị nkenke ma bụrụkwa okwu Igbo nkịtị nke na-echekwa ike dị n’iwu Grik ahụ.
- source_word: σκεῦος
  choice: ngwá ọrụ
  rationale: Ọ bụ ezie na okwu ahụ nwere ike ịpụta arịa, e ji ya mee ihe atụ n’ebe a maka onye a họpụtara iji rụọ otu nzube; “ngwá ọrụ” na-eme ka ihe atụ ahụ doo anya n’Igbo ugbu a.
- source_word: ἐκλογῆς / ἐστίν μοι
  choice: ngwá ọrụ m họpụtara
  rationale: Nke a na-egosi ma nhọrọ Chineke mere ma mmekọ onye ahụ na Onyenwe anyị, n’enweghị itinye ozizi e mechara wulite banyere nhọpụta n’ime amaokwu ahụ.
- source_word: τοῦ βαστάσαι
  choice: ka o buru
  rationale: “Ka” na-egosi nzube nke infinitive ahụ, ebe “buru” na-echekwa ihe oyiyi nke iburu aha.
- source_word: τὸ ὄνομά μου
  choice: aha m
  rationale: A hapụrụ “aha” kpọmkwem ka echiche nke nnọchite anya, ikike, na nkwupụta n’ihu ọha dịgide.
- source_word: ἐνώπιον
  choice: n’ihu
  rationale: Ọ na-egosipụta ịnọ n’ihu ma ọ bụ n’ebe ndị a kpọrọ aha nọ n’ụzọ dị mfe ma kwekọọ n’ọnọdụ ịgba àmà.
- source_word: ἐθνῶν
  choice: ndị mba ọzọ
  rationale: N’ihi na e kewapụtara ha na ụmụ Izrel n’amaokwu a, okwu a na-ezo n’ụzọ kachasị doo anya n’ebe ndị na-abụghị ndị Juu nọ; e debere “mba dị iche iche” n’ala peeji dị ka nhọrọ sara mbara karị.
- source_word: βασιλέων
  choice: ndị eze
  rationale: Nke a bụ nsụgharị kpọmkwem, doro anya, ma dịkwa mfe nghọta.
- source_word: υἱῶν Ἰσραήλ
  choice: ụmụ Izrel
  rationale: Ọ na-echekwa akpaalaokwu ezinụlọ nke Akwụkwọ Nsọ ma na-ada nke ọma n’Igbo; ihe ọ pụtara n’otu bụ ndị Izrel.
- source_word: τε ... καὶ ... τε
  choice: ndị mba ọzọ, ndị eze, na ụmụ Izrel
  rationale: Ndepụta Igbo nwere njikọ “na” tupu ihe ikpeazụ na-ahazi ìgwè atọ ahụ n’ụzọ ebumpụta ụwa n’etinyeghị mkpụrụokwu ndị na-adịghị mkpa.
theological_decisions:
- issue: Enwere ike ịgụ ἐκλογῆς dị ka nkwado otu ozizi pụrụ iche banyere nhọpụta.
  choice: ngwá ọrụ m họpụtara
  alternative: arịa nhọpụta m
  rationale: Amaokwu ahụ na-ekwu hoo haa na Onyenwe anyị họpụtara nwoke a maka ozi, ma ọ naghị akọwapụta usoro ozizi sara mbara banyere nhọpụta. Nsụgharị a na-echekwa nkwupụta ahụ n’enweghị idozi esemokwu nkà mmụta okpukpe nke amaokwu ahụ n’onwe ya na-adịghị edozi.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta mee ihe. E debere ihe oyiyi “ngwá ọrụ,” “iburu aha,” na akpaalaokwu “ụmụ Izrel,” ebe a kọwara nhọrọ okwu ndị nwere ike ghara ido anya n’ala peeji.
