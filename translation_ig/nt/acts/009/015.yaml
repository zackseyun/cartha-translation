    rationale: “Ụmụ Izrel” bụ akpaalaokwu ọdịnala nke Akwụkwọ Nsọ pụtara ndị Izrel is not the most natural Standard Igbo formulation. Recasting it as “nke pụtara ‘ndị Izrel’” clearly explains the idiom without changing its sense.
