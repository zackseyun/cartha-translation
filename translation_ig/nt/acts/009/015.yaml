  naturalness: 'The main translation is fluent Standard Igbo and maintains an appropriate biblical register. The wording of footnote b needs a small grammatical and stylistic correction: an expression does not naturally “pụta ndị Izrel” in this construction; it should say that it means or refers to “ndị Izrel.”'
  terminology: “Onyenwe anyị,” “ngwá ọrụ,” “aha m,” “ndị mba ọzọ,” “ndị eze,” and “ụmụ Izrel” are suitable and consistent renderings. “Ndị mba ọzọ” appropriately represents ἐθνῶν in its contrast with Israel, while the footnote preserves the broader lexical option.
