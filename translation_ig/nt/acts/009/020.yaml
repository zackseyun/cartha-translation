  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ εὐθέως ἐν ταῖς συναγωγαῖς ἐκήρυσσεν τὸν ⸀Ἰησοῦν ὅτι οὗτός ἐστιν ὁ υἱὸς τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/020.yaml
  text: And immediately in the synagogues he began proclaiming Jesus[b][a], that he is the Son of God.
translation:
  language: ig
  text: Ozugbo ahụ, ọ nọ na-ekwusa Jisọs[a] n’ụlọ nzukọ ndị Juu, na Onye a bụ Nwa Chineke.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ọ malitere ikwusa Jisọs,” ma ọ bụ, “ọ kwusara Jisọs.” Ngwaa Grik ahụ na-ekwu maka ikwupụta ozi n’ihu ọha.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθέως
  choice: Ozugbo ahụ
  rationale: Na-egosipụta na Sọl mere ihe a n’egbughị oge, ma na-edobe ike akụkọ ahụ n’Igbo dị ugbu a.
- source_word: ἐν ταῖς συναγωγαῖς
  choice: n’ụlọ nzukọ ndị Juu
  rationale: Na-edobe ọnọdụ na ọnụọgụ ọtụtụ nke okwu Grik; nkọwa ‘ndị Juu’ na-eme ka ụdị ụlọ nzukọ a doo onye Igbo anya.
- source_word: ἐκήρυσσεν
  choice: ọ malitere ikwusa
  rationale: ‘Ikwusa’ na-egosipụta nkwupụta n’ihu ọha; ‘malitere’ na-enye n’Igbo nghọta mmalite omume nke ọnọdụ akụkọ a na-egosi, ebe imperfect nwekwara ike ịpụta omume na-aga n’ihu.
- source_word: τὸν Ἰησοῦν
  choice: Jizọs
  rationale: E debere Jizọs dịka kpọmkwem ihe e ji ngwaa ahụ mee, n’etinyeghị ‘banyere,’ ka okwu ahụ nọgide bụrụ nke siri ike ma gbadoro ụkwụ na Kraịst.
- source_word: ὅτι
  choice: na-ekwu na
  rationale: Na-ewebata ọdịnaya nke nkwusa ahụ n’ụzọ doro anya ma bụrụkwa Igbo ebumpụta ụwa.
- source_word: οὗτός
  choice: Onye a
  rationale: Na-echekwa ike nrụtụ aka nke demonstrative Grik karịa nnọchiaha nkịtị, ma na-ezo aka n’ebe Jizọs nọ n’enweghị mgbakwunye nkọwa.
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: Ọkpara Chineke
  rationale: Nke a bụ ntụgharị Igbo doro anya nke aha Kraịst ahụ, na-echekwa njikọ nwa na Chineke na ibu okwu ahụ nwere.
theological_decisions:
- issue: Aha Kraịst dị na nkwusa Sọl
  choice: Ọkpara Chineke
  alternative: Nwa Chineke
  rationale: ‘Ọkpara Chineke’ na-echekwa aha pụrụ iche na ibu Kraịst nke ὁ υἱὸς τοῦ θεοῦ n’enweghị ịgbasa nkọwa karịa ihe Luk kwuru; ‘Nwa Chineke’ ga-ekwe omume mana ọ naghị egosipụta otu ike aha ahụ n’usoro a.
- issue: Ike nrụtụ aka nke οὗτός
  choice: Onye a
  alternative: ọ bụ
  rationale: '‘Onye a’ na-edobe nkwusi okwu Grik na njirimara ahụ: Jizọs a a na-ekwusa bụ Ọkpara Chineke. ‘Ọ bụ’ ga-adị mfe karịa, ma ọ ga-ebelata ike demonstrative ahụ.'
translation_notes:
  register: Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta. E ji ‘ụlọ nzukọ ndị Juu’ mee ka synagogue doo anya; e jikwa ‘Onye a’ chekwaa nkwusi nke οὗτός. Akara nkọwa ala ala [a] dị n’isiokwu ahụ.
