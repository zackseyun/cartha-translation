    text: A pụkwara ịsụgharị ya, “ọ malitere ikwusa Jisọs,” ma ọ bụ, “ọ kwusara Jisọs.” Ngwaa Grik ahụ na-ekwu maka ikwupụta ozi n’ihu ọha.
    reason: lexical_alternative
  revision_rationale: The revision removes the unsupported ‘firstborn/eldest’ implication of Ọkpara and uses Nwa Chineke, which faithfully renders the Greek title. It also represents the imperfect proclamation with a progressive construction while documenting viable contextual alternatives. The demonstrative ‘Onye a’ is retained to preserve the emphasis of οὗτός.
