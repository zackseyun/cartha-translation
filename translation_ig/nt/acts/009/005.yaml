base_translation:
  language: en
  yaml_path: translation/nt/acts/009/005.yaml
  text: And he said[a], “Who are you, Lord?” And he said, “I am Jesus, whom you are persecuting.”
translation:
  language: ig
  text: Ọ sịrị, “Ị bụ onye, Onyenweanyị[a]?” Onye ahụ sịrị, “Abụ m Jizọs, onye ị na-akpagbu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “nna ukwu.” Okwu Grik κύριε nwere ike ịbụ ụzọ nkwanye ùgwù e si akpọ mmadụ; n’ebe a, a sụgharịrị ya “Onyenweanyị” n’ihi ọnọdụ mkpughe ahụ na ojiji a na-ejikarị eme κύριος.
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπεν
  choice: Ọ sịrị
  rationale: Aorist nke λέγω bụ ngwaa nkọwa akụkọ dị mfe; Igbo chọrọ nnọchiaha isiokwu ka ahịrịokwu wee bụrụ nke eke.
- source_word: δέ
  choice: (ejighị okwu pụrụ iche sụgharịa ya)
  rationale: δέ bụ njikọ akụkọ dị nro n’ebe a. Usoro ahịrịokwu Igbo n’onwe ya na-egosi ngagharị ahụ nke ọma; itinye “ma” ga-eme ka ọdịiche dị ike karịa nke Grik.
- source_word: Τίς εἶ
  choice: Ị bụ onye
  rationale: Nke a bụ ajụjụ Igbo doro anya ma bụrụkwa nke a na-asụkarị maka ịmata onye na-ekwu okwu.
- source_word: κύριε
  choice: Onyenwe anyị
  rationale: Nke a bụ nsụgharị Igbo a na-ejikarị eme κύριος mgbe ọ bụ okwu ịkpọ onye ùgwù dị ka ‘Lord’; ihe odide ala na-echekwa ohere ọ pụtara naanị okwu nkwanye ùgwù n’oge Sọl na-ajụ ajụjụ ahụ.
- source_word: Ἐγώ εἰμι
  choice: Abụ m
  rationale: Ọ bụ ụzọ Igbo dị mkpirikpi ma bụrụ nke eke isi kwuo njirimara onwe onye ahụ, na-enweghị ịgbakwunye nkọwa nkà mmụta okpukpe ọzọ.
- source_word: Ἰησοῦς
  choice: Jizọs
  rationale: Aha ahụ gbasoro ụdị mkpọpụta na mkpoputa a na-ejikarị n’Igbo.
- source_word: ὃν σὺ διώκεις
  choice: onye ị na-akpagbu
  rationale: “Onye” na-ezo aka na Jizọs dịka onye omume ahụ rutere; “ị na-akpagbu” na-egosi omume iro na-aga n’ihu dịka present διώκεις si mee.
theological_decisions:
- issue: Ihe κύριε pụtara n’okwu Sọl tupu onye na-ekwu okwu akọwaa onwe ya
  choice: Onyenwe anyị
  alternative: nna anyị ukwu / onye ukwu
  rationale: κύριε nwere ike ịbụ okwu nkwanye ùgwù naanị, ma ọnọdụ mkpughe eluigwe na ojiji κύριος n’akụkọ a kwadoro “Onyenwe anyị.” Ihe odide ala na-echekwa nghọta ọzọ ka a ghara ime ka ajụjụ Sọl bụrụ nkwupụta okwukwe zuru ezu tupu mkpughe ahụ.
translation_notes:
  register: Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E jiri usoro mkparịta ụka eke mee ya, ma chekwaa mgbagwoju anya dị na κύριε site n’ihe odide ala.
