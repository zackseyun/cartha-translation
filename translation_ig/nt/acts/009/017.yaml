id: ACT.9.17
reference: Acts 9:17
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀπῆλθεν δὲ Ἁνανίας καὶ εἰσῆλθεν εἰς τὴν οἰκίαν, καὶ ἐπιθεὶς ἐπ’ αὐτὸν τὰς χεῖρας εἶπεν· Σαοὺλ ἀδελφέ, ὁ κύριος ἀπέσταλκέν με, ⸀Ἰησοῦς ὁ ὀφθείς σοι ἐν τῇ ὁδῷ ᾗ ἤρχου, ὅπως ἀναβλέψῃς καὶ πλησθῇς πνεύματος ἁγίου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/017.yaml
  text: So Ananias went and entered the house, and laying his hands on him he said, “Brother Saul, the Lord has sent me—Jesus, the one who appeared to you on the road by which you were coming—so that you may regain your sight and be filled with the Holy Spirit.”
translation:
  language: ig
  text: Ya mere, Ananayas gara banye n’ụlọ ahụ. O bikwasịrị ya aka wee sị, “Nwanna Sọl, Onyenwe anyị ezitela m—ya bụ Jizọs, onye pụtara n’ihu gị n’ụzọ ahụ i si na-abịa[a]—ka i wee hụ ụzọ ọzọ[b] ma jupụta na Mmụọ Nsọ.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’ụzọ ahụ ị nọ na-eme njem.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ka i wee nwetaghachi ọhụ ụzọ gị.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπῆλθεν δὲ
  choice: Ya mere, Ananayas gara
  rationale: δέ na-akwalite akụkọ n’ihu ma na-ejikọta omume Ananayas na iwu e nyere ya; “Ya mere” na “gara” na-enye nke a n’Igbo nkịtị.
- source_word: εἰσῆλθεν εἰς τὴν οἰκίαν
  choice: banye n’ụlọ ahụ
  rationale: Nke a bụ ụzọ Igbo si ekwu ịbanye n’ụlọ a kpọtụrụla aha.
- source_word: ἐπιθεὶς ἐπ’ αὐτὸν τὰς χεῖρας
  choice: O bikwasịrị ya aka ya abụọ
  rationale: Ọ na-egosi omume ahụ n’onwe ya, ma ọtụtụ “aka” dị na Grik pụtara aka abụọ Ananayas.
- source_word: Σαοὺλ ἀδελφέ
  choice: Nwanna Sọl
  rationale: “Nwanna” na-echekwa okwu nnabata na mmekọrịta dị n’ụdị ọkpụkpọ aha ahụ.
- source_word: ὁ κύριος ἀπέσταλκέν με
  choice: Onyenwe anyị ezitela m
  rationale: “ezitela” na-egosipụta iziga ahụ mere eme nke ihe ọ rụpụtara ka dị ugbu a.
- source_word: Ἰησοῦς ὁ ὀφθείς σοι
  choice: ya bụ Jizọs, onye ahụ mere ka ị hụ ya
  rationale: Jizọs na-akọwa onye “Onyenwe anyị” bụ; usoro a na-edebe ntụgharị uche nke okwu Grik ma na-egosi na Jizọs mere ka Sọl hụ ya, ọ bụghị naanị na Sọl lere ya anya.
- source_word: ἐν τῇ ὁδῷ ᾗ ἤρχου
  choice: n’ụzọ ahụ i si na-abịa
  rationale: Ọ na-echekwa ụzọ nkịtị na omume na-aga n’ihu nke imperfect ἤρχου.
- source_word: ἀναβλέψῃς
  choice: i wee malite ịhụ ụzọ ọzọ
  rationale: N’ọnọdụ ọgwụgwọ a, okwu ahụ pụtara inwetaghachi ike ịhụ ụzọ.
- source_word: πλησθῇς πνεύματος ἁγίου
  choice: ka Mmụọ Nsọ jukwa gị afọ
  rationale: Akpaalaokwu Igbo a na-egosi na Mmụọ Nsọ ga-ejupụta onye ahụ; “-kwa” jikọtara ebumnuche abụọ ahụ.
theological_decisions:
- issue: Njirimara “Onyenwe anyị” na Jizọs n’usoro ahịrịokwu ahụ
  choice: “Onyenwe anyị ezitela m—ya bụ Jizọs...”
  alternative: “Onyenwe anyị Jizọs ... ezitela m”
  rationale: Usoro ahọrọ na-edebe ọdịdị nke Grik, ebe “Jizọs” na-abịa dị ka nkọwa onye Onyenwe anyị bụ, n’emeghị ka ihe ahụ a na-akọwapụta ghọọ usoro dị mfe karịa nke isi mmalite.
- issue: πνεύματος ἁγίου enweghị article na Grik
  choice: “Mmụọ Nsọ”
  alternative: “mmụọ nsọ”
  rationale: N’Ọrụ Ndịozi, okwu a na-ezo aka n’Mmụọ Chineke; aha ukwu n’Igbo na-egosi njirimara ahụ n’etinyeghị article nke Igbo na-achọghị.
- issue: Ihe ἀδελφέ pụtara n’okwu Ananayas
  choice: “Nwanna Sọl”
  alternative: “Sọl, nwanne m”
  rationale: “Nwanna Sọl” bụ ọkpụkpọ aha doro anya nke na-echekwa nnabata na mmekọrịta okwu ahụ na-egosi, ma ọ naghị amanye nkọwa ụka karịrị ihe ederede kwuru.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke dị ugwu ma dị mfe nghọta. E ji “Onyenwe anyị,” “Mmụọ Nsọ,” na “Nwanna Sọl” mee ka okwu Akwụkwọ Nsọ bụrụ nke a maara nke ọma, ma zere okwu otu ụka pụrụ iche. Akara [a] na [b] dị n’ahịrịokwu ebe ntụgharị ọzọ metụtara.
