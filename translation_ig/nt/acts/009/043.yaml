translation_notes:
  register: Standard Igbo dị ugbu a, dị ugwu ma dị mfe nghọta. E jiri “onye na-edozi akpụkpọ anụ” kọwaa ọrụ tanner n’ụzọ ziri ezi ma doo ndị nkịtị anya; e chekwara enweghị nkọwa zuru ezu dị na παρά site n’ala ala peeji.
