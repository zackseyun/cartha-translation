base_translation:
  language: en
  yaml_path: translation/nt/acts/009/043.yaml
  text: And he stayed in Joppa for many days with a certain Simon[a], a tanner.
translation:
  language: ig
  text: Ọ nọrọ na Jọpa ọtụtụ ụbọchị, ya na otu nwoke aha ya bụ Saịmọn[a], onye na-edozi akpụkpọ anụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’ụlọ otu nwoke aha ya bụ Saịmọn.” Okwu mmalite Grik ahụ nwekwara ike igosi na ọ biri n’ụlọ onye ahụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο ... μεῖναι
  choice: Ọ nọrọ
  rationale: Ihe owuwu ἐγένετο tinyere infinitive bụ akpaalaokwu Grik; ime μεῖναι ka ọ bụrụ ngwaa bụ isi na-enye Igbo doro anya ma bụrụkwa nke e ji eme ihe.
- source_word: δὲ
  choice: Ejighị okwu njikọ pụrụ iche tụgharịa ya
  rationale: δέ bụ njikọ dị nro na-aga n’ihu n’akụkọ. N’ebe a, usoro ahịrịokwu Igbo na-eburu njikọ ahụ nke ọma n’enweghị ịgbakwụnye “ma” nke nwere ike igosi mmegide na-adịghị n’isi mmalite.
- source_word: ἡμέρας ἱκανὰς
  choice: ọtụtụ ụbọchị
  rationale: N’okwu oge, ἱκανός na-egosi oge dị ukwuu ma ọ bụ ọtụtụ; “ọtụtụ ụbọchị” bụ Igbo nkịtị ma na-echekwa ogologo oge ahụ.
- source_word: ἐν Ἰόππῃ
  choice: na Jọpa
  rationale: A sụgharịghị aha obodo ahụ; e dere ya n’ụzọ kwekọrọ n’ụda na mkpuruedemede Igbo.
- source_word: παρά τινι Σίμωνι
  choice: ya na otu nwoke aha ya bụ Saịmọn[a]
  rationale: παρά na dative nwere ike ịpụta ịnọnyere mmadụ ma ọ bụ ịnọ n’ụlọ ya; τινι na-egosi onye a na-akọwapụtaghị kpọmkwem. Nsụgharị a bụ Igbo eke, ebe nkọwa ebe obibi ahụ dị n’ala ala peeji.
- source_word: βυρσεῖ
  choice: onye na-edozi akpụkpọ anụ
  rationale: βυρσεύς bụ onye na-arụ ọrụ ịkwadebe ma ọ bụ ịgwọ akpụkpọ anụ. Nkebiokwu a na-enye ndị na-agụ Igbo taa ihe okwu ahụ pụtara karịa iji aha ọrụ na-adịghị ama ama.
