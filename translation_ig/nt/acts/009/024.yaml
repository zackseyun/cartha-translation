revisions:
- from: Ma Sọl bịara mata izu ọjọọ ha. Ha nọkwa na-eche ọnụ ụzọ ámá[a] ehihie na abalị ka ha wee gbuo ya.
  to: Ma Sọl matara izu ọjọọ ha. Ha nọkwa na-elezi ọnụ ụzọ ámá[a] anya ehihie na abalị ka ha wee gbuo ya.
  rationale: The revision retains the source’s passive/agent-unspecified sense in a natural Igbo formulation («Sọl matara»), while changing only the surveillance verb so that the imperfect παρετηροῦντο is represented more precisely as continual close watching. The purpose clause, temporal expression, and footnote anchor are retained.
