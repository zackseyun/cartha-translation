  text: ἐγνώσθη δὲ τῷ Σαύλῳ ἡ ἐπιβουλὴ αὐτῶν. ⸂παρετηροῦντο δὲ καὶ⸃ τὰς πύλας ἡμέρας τε καὶ νυκτὸς ὅπως αὐτὸν ἀνέλωσιν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/024.yaml
  text: But their plot became known to Saul[a]. They were also watching the gates day and night so that they might kill him.
translation:
  language: ig
  text: Ma Sọl matara izu ọjọọ ha. Ha nọkwa na-elezi ọnụ ụzọ ámá[a] anya ehihie na abalị ka ha wee gbuo ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ọnụ ụzọ ámá obodo ahụ.” Grik kwuru naanị “ọnụ ụzọ ámá”; a ghọtara na ọ bụ nke obodo ahụ site n’ọnọdụ akụkọ a.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγνώσθη
  choice: bịara mata
  rationale: Nke a na-egosi na izu ahụ bịara ruo n’ọmụma Sọl, n’emeghị ka a mata onye gwara ya.
- source_word: ἐπιβουλή
  choice: izu ọjọọ
  rationale: Okwu a na-ezo aka n’atụmatụ nzuzo e mere iji merụọ mmadụ ahụ; ‘izu ọjọọ’ bụ okwu Igbo doro anya ma kwekọọ n’ebumnuche igbu ya.
- source_word: παρετηροῦντο
  choice: nọkwa na-eche
  rationale: Ụdị imperfect na-egosi omume ha nọgidere na-eme; ebe a, ‘na-eche’ pụtara ilegide ụzọ ndị ahụ anya ka ọ ghara isi na ha gbapụ.
- source_word: πύλας
  choice: ọnụ ụzọ ámá
  rationale: Nke a bụ ntụgharị kpọmkwem nke okwu Grik; ihe gbara ama na ọnọdụ akụkọ ahụ bụ na ọ bụ ọnụ ụzọ ámá obodo Damaskọs.
- source_word: ἡμέρας τε καὶ νυκτός
  choice: ehihie na abalị
  rationale: Nkebiokwu Igbo a na-egosi na ha nọ na nche mgbe niile, ma n’ehihie ma n’abalị.
- source_word: ὅπως
  choice: ka ha wee
  rationale: Nke a na-egosipụta ebumnuche ha n’ụzọ e ji ekwu Igbo nke ọma.
- source_word: ἀνέλωσιν
  choice: gbuo ya
  rationale: N’ọnọdụ a, ngwaa ahụ pụtara iwepụ ndụ mmadụ; ‘gbuo ya’ doro anya ma kpọmkwem.
- source_word: δὲ
  choice: Ma
  rationale: 'Ọ na-egosi ntakịrị mgbanwe na ọdịiche: ha gbara izu, ma Sọl bịara mata ya.'
- source_word: καὶ
  choice: kwa
  rationale: A gbakwụnyere na ịgba izu ha bụkwa ilegide ọnụ ụzọ ámá anya.
