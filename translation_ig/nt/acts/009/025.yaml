revisions:
- from: Ma n'abalị, ndị na-eso ụzọ ya kpọọrọ ya, tinye ya n'ime nnukwu nkata, wee si n'ahụ́ mgbidi ahụ budata ya[a][b].
  to: Ma ndị na-eso ụzọ ya kpọọrọ ya n'abalị, si na mgbidi ahụ budata ya n'ime nnukwu nkata[a][b].
  rationale: Replaced the unnatural “si n'ahụ́ mgbidi ahụ” with concise, idiomatic “si na mgbidi ahụ,” while retaining the source’s literal ambiguity in the main text and explaining the likely aperture in footnote a. Corrected footnote b’s inaccurate implication that Paul was allowed to fall, and clarified that the Greek uses two semantically overlapping lowering expressions.
  reviewer_model: gpt-5.6-terra
