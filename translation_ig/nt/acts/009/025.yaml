  text: λαβόντες δὲ ⸂οἱ μαθηταὶ αὐτοῦ⸃ νυκτὸς ⸂διὰ τοῦ τείχους καθῆκαν αὐτὸν⸃ χαλάσαντες ἐν σπυρίδι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/025.yaml
  text: But his disciples took him by night and lowered him through the wall in a large basket[a][b].
translation:
  language: ig
  text: Ma ndị na-eso ụzọ ya kpọọrọ ya n'abalị, si na mgbidi ahụ budata ya n'ime nnukwu nkata[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịtụgharị ya, “site n'oghere dị na mgbidi ahụ.” Okwu Grik ahụ pụtara kpọmkwem, “site na mgbidi ahụ”; o yikarịrị ka ọ na-ekwu maka oghere ma ọ bụ windo dị na mgbidi obodo ahụ.
    reason: lexical_alternative
  - marker: b
    text: 'Okwu Grik ji okwu abụọ metụtara ibudata mee ihe: otu pụtara “budata,” nke ọzọ pụtakwara “wedata.” Nke a na-emesi ụzọ e si budata ya n''ime nkata ike.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λαβόντες
  choice: kpọọrọ ya
  rationale: N'ebe a, participle a na-egosi na ndị na-eso ụzọ ya kpọọrọ ya iji nyere ya aka gbapụ; ‘kpọọrọ ya’ bụ Igbo nkịtị ma doo anya.
- source_word: δὲ
  choice: Ma
  rationale: δὲ na-egosi ntakịrị mgbanwe ma ọ bụ ihe megidere izu ọjọọ a kpọtụrụ aha n'amaokwu bu ụzọ.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: ndị na-eso ụzọ ya
  rationale: Nke a na-egosipụta μαθηταί na possessive αὐτοῦ n'ụzọ doro anya ma bụrụ okwu Igbo a na-aghọta nke ọma.
- source_word: νυκτός
  choice: n'abalị
  rationale: Genitive nke oge a pụtara na ihe ahụ mere n'abalị; nke a bụ ụzọ Igbo dị mfe ma bụrụ ihe e ji eme ihe ugbu a.
- source_word: διὰ τοῦ τείχους
  choice: si n'ahụ́ mgbidi ahụ
  rationale: διά na genitive na-egosi ịgafe site n'ebe ahụ. Okwu Grik ekwughị ‘oghere’ kpọmkwem, ya mere a naghị etinye ya n'ahịrị bụ isi.
- source_word: καθῆκαν αὐτόν
  choice: budata ya
  rationale: καθίημι n'ebe a bụ ibudata mmadụ site n'ebe dị elu; ‘budata ya’ bụ okwu Igbo doro anya ma dị ndụ.
- source_word: χαλάσαντες
  choice: tinye ya n'ime nnukwu nkata, wee ... budata ya
  rationale: Participle a na-akọ ụzọ e si budata ya. Nhazi Igbo a na-edobe nkata dịka ihe e ji mee mgbapụ ahụ, ebe ndetu [b] na-akọwa nkwughachi dị n'okwu Grik.
- source_word: ἐν σπυρίδι
  choice: n'ime nnukwu nkata
  rationale: σπυρίς bụ nkata, ọtụtụ mgbe nke buru ibu; ‘nnukwu nkata’ dabara n'ọnọdụ ibudata mmadụ.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo Standard nke oge a, dị ùgwù ma dị mfe nghọta. E debere ‘site ná mgbidi’ n'ahịrị bụ isi n'agbanyeghị na Igbo na-achọkarị ‘site n'oghere dị na mgbidi’; ndetu [a] na-eme ka nke ahụ doo anya. Akara ụda dị na ‘ahụ́’ na-egbochi ịgụ ya dịka ‘ahụ’ (body).
