id: ACT.9.13
reference: Acts 9:13
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀπεκρίθη δὲ Ἁνανίας· Κύριε, ⸀ἤκουσα ἀπὸ πολλῶν περὶ τοῦ ἀνδρὸς τούτου, ὅσα κακὰ ⸂τοῖς ἁγίοις σου ἐποίησεν⸃ ἐν Ἰερουσαλήμ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/013.yaml
  text: But Ananias answered[a], “Lord, I have heard from many about this man, how much evil he has done to your saints in Jerusalem.”
translation:
  language: ig
  text: Ma Ananayas zara, sị, “Onyenwe anyị, anụla m n’ọnụ ọtụtụ mmadụ banyere nwoke a, na ọtụtụ ihe ọjọọ o mere ndị nsọ gị na Jerusalem.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη δὲ
  choice: Ma Ananayas zara, sị
  rationale: “Ma” na-egosipụta ntakịrị mmegide dị n’azịza Ananayas, ebe “zara, sị” bụ ụzọ Igbo nkịtị si webata okwu a zara n’akụkọ.
- source_word: Κύριε
  choice: Onyenwe anyị
  rationale: Nke a bụ aha a na-ejikarị asụgharị κύριος n’okwu a na-agwa Jizọs, ma na-echekwa nkwanye ùgwù na ibu mmụta okpukpe ya.
- source_word: ἤκουσα ἀπὸ πολλῶν
  choice: anụla m n’ọnụ ọtụtụ mmadụ
  rationale: Ụdị perfect Igbo na-egosi na Ananayas natara akụkọ ahụ ma na ọ ka metụtara ọnọdụ ugbu a; “n’ọnụ ọtụtụ mmadụ” na-eme ka isi mmalite akụkọ doo anya n’Igbo eke.
- source_word: περὶ τοῦ ἀνδρὸς τούτου
  choice: banyere nwoke a
  rationale: Ọ bụ nsụgharị kwụ ọtọ ma bụrụkwa okwu Igbo dị ugbu a nke na-echekwa ike nke τούτου.
- source_word: ὅσα κακὰ
  choice: na ọtụtụ ihe ọjọọ
  rationale: Nke a na-echekwa echiche nke ọtụtụ na ịdị ukwuu nke omume ọjọọ ahụ n’enweghị ime ka Igbo sie ike.
- source_word: τοῖς ἁγίοις σου
  choice: ndị nsọ gị
  rationale: “Ndị nsọ” na-echekwa aha Agba Ọhụrụ e ji akọwa ndị kwere ekwe na njikọ nke nnọchiaha “gị.”
- source_word: ἐποίησεν
  choice: o mere
  rationale: “Mere” bụ ihe kwekọrọ n’ụzọ sara mbara na ποιέω ma dịkwa eke n’Igbo.
- source_word: ἐν Ἰερουσαλήμ
  choice: na Jerusalem
  rationale: Ọ bụ ụdị ọnọdụ ebe a na-ejikarị eme ihe n’Igbo.
theological_decisions:
- issue: Onye Κύριε na-ezo aka na ya na ike aha ahụ
  choice: Okwu a na-agwa Jizọs kpọmkwem dịka “Onyenwe anyị”
  alternative: “Nna ukwu” dịka naanị okwu nkwanye ùgwù
  rationale: N’akụkụ akụkọ a, Ananayas na-aza Jizọs ahụ bilitere n’ọnwụ n’ọhụụ; “Onyenwe anyị” dabara n’akụkọ ahụ ma na-echekwa ibu okwu ahụ n’enweghị itinye nkọwa ọzọ.
translation_notes:
  register: Asụsụ Igbo Izugbe dị ugbu a, dị ùgwù ma dị mfe nghọta. Ahọpụtara “Ananayas” na “Jerusalem” dịka ụdị aha ndị a maara nke ọma; ahịrịokwu ahụ na-echekwa ntakịrị mmegide Ananayas n’ihu iwu Onyenwe anyị.
