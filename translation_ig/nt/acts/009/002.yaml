  to: Ọ rịọrọ ya akwụkwọ ozi e degara ụlọ nzukọ ndị Juu dị na Damaskọs, ka, ọ bụrụ na ọ hụ onye ọ bụla so n’Ụzọ ahụ[a], ma ndị ikom ma ndị inyom, o wee kpọga ha n’agbụ na Jerusalem.
