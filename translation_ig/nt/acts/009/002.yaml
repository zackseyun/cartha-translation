id: ACT.9.2
reference: Acts 9:2
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ᾐτήσατο παρ’ αὐτοῦ ἐπιστολὰς εἰς Δαμασκὸν πρὸς τὰς συναγωγάς, ὅπως ἐάν τινας εὕρῃ τῆς ὁδοῦ ὄντας, ἄνδρας τε καὶ γυναῖκας, δεδεμένους ἀγάγῃ εἰς Ἰερουσαλήμ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/002.yaml
  text: and asked him for letters to the synagogues in Damascus[a], so that if he found any belonging to the Way, both men and women, he might bring them bound to Jerusalem.
translation:
  language: ig
  text: Ọ rịọrọ ya akwụkwọ ozi e degara ụlọ nzukọ ndị Juu dị na Damaskọs, ka, ọ bụrụ na ọ hụ onye ọ bụla so n’Ụzọ ahụ[a], ma ndị ikom ma ndị inyom, o wee kpọga ha n’agbụ na Jerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “ndị nke Ụzọ ahụ” ma ọ bụ “ndị na-eso Ụzọ ahụ.” Okwu Grik a bụ otu n’ime aha mbụ e ji mara òtù Ndị Kraịst.
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾐτήσατο παρ’ αὐτοῦ
  choice: ọ rịọkwara ya
  rationale: Ngwaa a pụtara ịrịọ mmadụ ihe. Ụdị a bụ Igbo nkịtị ma na-egosi na ọ bụ n’aka onye ahụ ka ọ rịọrọ akwụkwọ ozi ndị ahụ.
- source_word: ἐπιστολὰς
  choice: akwụkwọ ozi
  rationale: Nke a na-asụgharị aha Grik ahụ kpọmkwem n’enweghị ịgbakwụnye na ha bụ akwụkwọ ikike, ọ bụ ezie na ọnọdụ akụkọ ahụ na-egosi na ha nwere ọrụ dị otú ahụ.
- source_word: εἰς Δαμασκὸν πρὸς τὰς συναγωγάς
  choice: ọ ga-ewegara ụlọ nzukọ ndị Juu dị na Damaskọs
  rationale: Nke a na-egosi n’Igbo doro anya na ndị a na-ezigara akwụkwọ ozi ahụ bụ ụlọ nzukọ dị na Damaskọs. A kọwara συναγωγή dị ka ụlọ nzukọ ndị Juu iji zere mgbagwoju anya.
- source_word: ὅπως ἐάν
  choice: ka ọ bụrụ na
  rationale: Nke a na-echekwa ma ebumnuche nke ὅπως ma ọnọdụ a na-ejighị n’aka nke ἐάν.
- source_word: τινας
  choice: onye ọ bụla
  rationale: N’ahịrịokwu nwere ọnọdụ, nke a bụ ụzọ Igbo dị mfe isi gosi mmadụ ọ bụla ọ pụrụ ịchọta.
- source_word: τῆς ὁδοῦ ὄντας
  choice: so n’Ụzọ ahụ
  rationale: Nke a na-echekwa ‘Ụzọ ahụ’ dị ka aha e ji mara òtù Ndị Kraịst oge mbụ, ma na-eme ka njikọ genitive ahụ bụrụ Igbo sitere n’okike.
- source_word: ἄνδρας τε καὶ γυναῖκας
  choice: ma ndị ikom ma ndị inyom
  rationale: A na-edobe kpọmkwem na ihe ahụ metụtara ma ndị ikom ma ndị inyom.
- source_word: δεδεμένους ἀγάγῃ
  choice: o nwee ike kee ha agbụ kpọga ha
  rationale: ‘Kee ha agbụ’ na-egosi ọnọdụ ndị e kere eke nke participle perfect passive, ebe ‘kpọga’ dabara n’ije a na-aga Jerusalem.
- source_word: εἰς Ἰερουσαλήμ
  choice: na Jerusalem
  rationale: N’Igbo, ‘kpọga ... na Jerusalem’ bụ usoro okwu sitere n’okike maka ebe a na-aga.
theological_decisions:
- issue: Nsụgharị τῆς ὁδοῦ
  choice: Ụzọ ahụ
  alternative: ndị na-eso ụzọ nke okwukwe ahụ
  rationale: A na-edobe okwu akụkọ ihe mere eme e ji mara òtù Ndị Kraịst oge mbụ, n’enweghị itinye nkọwa okpukpe karịrị ihe Grik kwuru.
- issue: Ịkpọ ndị ikom na ndị inyom aha n’otu n’otu
  choice: ma ndị ikom ma ndị inyom
  alternative: ndị mmadụ
  rationale: Grik kpọrọ nwoke na nwanyị aha kpọmkwem iji gosi oke njide Sọl zubere; ya mere, a naghị ekpokọta ha n’okwu izugbe.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta. E ji ‘ụlọ nzukọ ndị Juu’ mee ka συναγωγή doo onye na-agụ akwụkwọ anya; e debere ‘Ụzọ ahụ’ dị ka aha pụrụ iche.
