  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Σαῦλος δὲ μᾶλλον ἐνεδυναμοῦτο καὶ ⸀συνέχυννεν ⸀τοὺς Ἰουδαίους τοὺς κατοικοῦντας ἐν Δαμασκῷ, συμβιβάζων ὅτι οὗτός ἐστιν ὁ χριστός.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/022.yaml
  text: But Saul kept gaining strength all the more and was confounding the Jews living in Damascus[a], proving that this one is the Messiah.
translation:
  language: ig
  text: Ma Sọl nọgidere na-esikwu ike, na-agbagwoju ndị Juu bi na Damaskọs anya site n’igosipụta na onye a bụ Mezaya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Kraịst.” N’ebe a, utu aha Grik bụ Χριστός pụtara Onye E Tere Mmanụ ahụ, ya bụ Mezaya ndị Juu na-atụ anya ya.
    reason: alternative_reading
lexical_decisions:
- source_word: μᾶλλον ἐνεδυναμοῦτο
  choice: nọgidere na-esikwu ike
  rationale: Nke a na-egosipụta omume na-aga n’ihu nke imperfect ahụ na mmụba nke μᾶλλον, n’enweghị ikpebi ma ike ahụ sitere n’ime Sọl ka ọ bụ na Chineke nyere ya.
- source_word: συνέχυννεν
  choice: na-agbagwoju ... anya
  rationale: Ọ na-enye echiche nke ime ka ndị na-emegide ya ghara ịma ihe ha ga-aza n’arụmụka, ma na-ada ka Igbo a na-asụ ugbu a.
- source_word: τοὺς Ἰουδαίους τοὺς κατοικοῦντας ἐν Δαμασκῷ
  choice: ndị Juu bi na Damaskọs
  rationale: Ntụgharị a doro anya na ọ bụ ndị Juu nọ n’obodo Damaskọs ka amaokwu ahụ na-ekwu maka ha, ọ bụghị ndị Juu niile.
- source_word: συμβιβάζων
  choice: site n’igosipụta
  rationale: Ọ na-egosipụta ụzọ Sọl si jikọta ihe akaebe ọnụ iji mee ka nkwubi okwu ya doo anya; ọ naghị ekwubiga ihe okwu ahụ pụtara ókè.
- source_word: οὗτός
  choice: onye a
  rationale: Ọ na-echekwa ike nrụtụ aka nke demonstrative Grik ahụ karịa iji naanị nnọchiaha.
- source_word: ὁ χριστός
  choice: Mezaya
  rationale: N’ebe a Χριστός bụ utu aha nke Onye E Tere Mmanụ ahụ ndị Juu na-atụ anya ya; “Mezaya” na-echekwa nghọta ahụ n’Igbo.
theological_decisions:
- issue: Ntụgharị Χριστός dịka utu aha
  choice: Mezaya
  alternative: Kraịst
  rationale: N’ahịrịokwu a, okwu ahụ bụ utu aha na-ekwupụta na Jizọs bụ Onye E Tere Mmanụ ahụ e kwere ná nkwa, ọ bụghị naanị aha a na-akpọ ya.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe ma nwee ugwu. “Na-agbagwoju ... anya” bụ okwu nkịtị nke na-eburu ike arụmụka dị na συνέχυννεν; “site n’igosipụta” jikọtara participle ahụ na ụzọ Sọl si mee ka nkwubi okwu ya doo anya.
