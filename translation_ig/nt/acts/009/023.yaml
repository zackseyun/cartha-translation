id: ACT.9.23
reference: Acts 9:23
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ὡς δὲ ἐπληροῦντο ἡμέραι ἱκαναί, συνεβουλεύσαντο οἱ Ἰουδαῖοι ἀνελεῖν αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/023.yaml
  text: When many days had passed[c][b][a], the Jews conspired to kill him.
translation:
  language: ig
  text: Mgbe ọtụtụ ụbọchị gafere[b], ndị Juu[a] gbara izu igbu ya.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Grik sịrị, “ndị Juu.” N’ebe a, okwu a na-ezo aka n’otu ndị na-emegide Sọl, ọ bụghị ndị Juu niile n’enweghị onye a hapụrụ.
    reason: cultural_note
  - marker: b
    text: Ma ọ bụ, “Mgbe ọtụtụ ụbọchị zuru” ma ọ bụ “Mgbe ọtụtụ ụbọchị mezuru.”
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “jikọrọ aka gbaa izu igbu ya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὡς δὲ
  choice: Mgbe
  rationale: Ọ na-ewebata mgbanwe oge; “Mgbe” bụ ụzọ Igbo dị mfe ma kwekọọ n’echiche ahụ, na-enweghị ịgbakwụnye ihe δέ na-adịghị ekwu kpọmkwem.
- source_word: ἐπληροῦντο
  choice: gafere
  rationale: Mgbe isiokwu ya bụ “ụbọchị,” ngwaa a na-egosi na oge na-agafe ma ọ bụ na-ezu. “Gafere” bụ okwu Igbo nkịtị ma doo anya.
- source_word: ἡμέραι ἱκαναί
  choice: ọtụtụ ụbọchị
  rationale: ἱκαναί n’ebe a pụtara oge buru ibu, ọ bụghị naanị ụbọchị zuru ezu; “ọtụtụ ụbọchị” na-ejide echiche ahụ nke ọma.
- source_word: συνεβουλεύσαντο
  choice: gbakọrọ izu
  rationale: Ọ na-egosi na ha jikọrọ aka chepụta ihe ọjọọ. “Gbakọrọ izu” bụ okwu Igbo sitere n’okwu ndụ nke na-egosi izu nzuzo e jikọrọ aka gbaa.
- source_word: οἱ Ἰουδαῖοι
  choice: ndị Juu
  rationale: Nke a na-echekwa okwu Grik n’enweghị ime ka ọ bụrụ naanị ndị isi ma ọ bụ ndị Judia, nke amaokwu ahụ n’onwe ya na-akọwaghị.
- source_word: ἀνελεῖν
  choice: igbu
  rationale: N’ebe a, okwu ahụ pụtara iwepụ ndụ mmadụ. “Igbu” bụ okwu kwụ ọtọ, doro anya, nke na-adịghị agbakwụnye nkọwa iwu ọzọ.
- source_word: αὐτόν
  choice: ya
  rationale: Nnọchiaha a na-ezo aka na Sọl dịka ihe gbara amaokwu ahụ gburugburu si gosi.
theological_decisions:
- issue: Otú e si sụgharịa οἱ Ἰουδαῖοι n’akụkọ ebe ụfọdụ na-emegide Sọl
  choice: ndị Juu
  alternative: ndị Judia; ndị isi ndị Juu
  rationale: A hapụrụ okwu ahụ n’ogo sara mbara nke Grik nyere, kama ịkọwa ya dịka naanị ndị isi. Ihe odide gbara ya gburugburu na-egosi na ọ bụ otu ndị na-emegide Sọl, ọ bụghị ndị Juu niile; a kọwara nke a n’ala ala peeji.
translation_notes:
  register: Asụsụ Igbo Ọkọlọtọ dị ugbu a, dị ùgwù ma dị mfe nghọta. A họọrọ “gbakọrọ izu” iji mee ka atụmatụ ha jikọrọ aka mee pụta ìhè, ebe a hapụrụ “ndị Juu” n’ederede ma jiri nkọwa ala peeji gbochie nghọta na-ezighị ezi nke ga-emetụta ndị Juu niile.
