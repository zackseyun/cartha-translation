  to: Mgbe ọtụtụ ụbọchị gafere[b], ndị Juu[a] gbara izu igbu ya.[c]
  rationale: The revision replaces a less idiomatic collocation with the natural Standard Igbo idiom “gbara izu.” It retains the source’s ambiguity about the precise group designated by οἱ Ἰουδαῖοι and preserves the temporal and hostile-planning senses. Footnote a is clarified without changing its interpretive restraint.
