  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐγὼ γὰρ ὑποδείξω αὐτῷ ὅσα δεῖ αὐτὸν ὑπὲρ τοῦ ὀνόματός μου παθεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/016.yaml
  text: For I will show him how much he must suffer for my name[a].
translation:
  language: ig
  text: N’ihi na mụ onwe m ga-egosi ya oke ahụhụ ọ na-aghaghị ịta n’ihi aha m.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “maka aha m.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγὼ
  choice: mụ onwe m
  rationale: E ji ‘mụ onwe m’ debe nkwusi ike dị n’aha nnọchiaha Greek ahụ, ebe ngwaa n’Igbo n’onwe ya gaara egosikwa onye na-ekwu okwu.
- source_word: γὰρ
  choice: N’ihi na
  rationale: Ọ na-ejikọta okwu a na nke bu ya ụzọ dịka nkọwa ma ọ bụ ihe mere e ji kwuo ya.
- source_word: ὑποδείξω
  choice: ga-egosi
  rationale: 'Ọ na-egosi ihe a ga-eme n’ọdịnihu: ime ka onye ahụ mata ma ọ bụ hụ ihe dị n’ihu ya.'
- source_word: ὅσα
  choice: oke ahụhụ
  rationale: N’usoro okwu a, ὅσα na-egosi ịdị ukwuu ma ọ bụ ókè ihe a ga-ata ahụhụ, ọ bụghị nanị ndepụta ihe dị iche iche.
- source_word: δεῖ
  choice: ọ na-aghaghị
  rationale: Nke a na-egosipụta mkpa siri ike dị na δεῖ, ma ọ naghị akọwa kpọmkwem ma mkpa ahụ ò sitere ná nhọpụta, n’usoro Chineke, ma ọ bụ n’ụzọ ọzọ.
- source_word: ὑπὲρ
  choice: n’ihi
  rationale: N’ebe a ọ na-egosi ihe kpatara ahụhụ ahụ ma ọ bụ onye/ọrụ a na-ata ya n’ihi ya; a hapụrụ nkọwa ndị ọzọ na ndetu ala peeji.
- source_word: τοῦ ὀνόματός μου
  choice: aha m
  rationale: E debere ‘aha m’ dịka ihe odide Greek si dị, n’ihi na ‘aha’ nwere ike ịgụnye onye ahụ, ikike ya, na ikwupụta na mmadụ bụ nke ya.
- source_word: παθεῖν
  choice: ịta ahụhụ
  rationale: Nke a bụ ụzọ Igbo nkịtị ma doo anya si ekwu ‘suffer.’
theological_decisions:
- issue: Ụdị mkpa δεῖ na-egosi
  choice: ọ na-aghaghị
  alternative: e kpebiela na ọ ga
  rationale: ‘Ọ na-aghaghị’ na-edobe ịdị mkpa okwu Greek ahụ na-enweghị itinye echiche siri ike karị na e burula ụzọ kpebie ihe niile n’ụzọ okwu ahụ n’onwe ya na-akọwaghị.
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe dị ugbu a, dị ùgwù ma dị mfe nghọta. ‘Mụ onwe m’ na-edobe nkwusi ike; ‘oke ahụhụ ọ na-aghaghị ịta’ na-eme ka ὅσα δεῖ…παθεῖν daa nke ọma n’Igbo, ebe ndetu ala peeji na-echekwa obosara ihe ὑπὲρ nwere ike ịpụta.
