  text: καὶ εἶδαν αὐτὸν πάντες οἱ κατοικοῦντες Λύδδα καὶ τὸν ⸀Σαρῶνα, οἵτινες ἐπέστρεψαν ἐπὶ τὸν κύριον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/035.yaml
  text: And all those living in Lydda and Sharon saw him[b][a], and they turned to the Lord.
translation:
  language: ig
  text: Ndị niile bi na Lida na Sharọn[a] hụrụ ya, ha atụgharịa n'ebe Onyenweanyị nọ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ala dị larịị nke Sharọn.”
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị “tụgharịrị n'ebe Onyenweanyị nọ” dị ka “laghachikwuru Onyenweanyị,” ma ọ bụ, n’ụzọ nkọwa karịa, “ghọrọ ndị kwere ekwe n’Onyenweanyị.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶδαν
  choice: hụrụ
  rationale: 'Okwu a pụtara ịhụ anya n’ụzọ dị mfe n’ebe a: ndị bi n’ógbè ahụ hụrụ nwoke ahụ mgbe a gwọchara ya.'
- source_word: πάντες οἱ κατοικοῦντες
  choice: Ndị niile bi
  rationale: Nke a na-egosipụta ndị niile bi n’ebe ndị a n’Igbo dị mfe ma dịkwuo eke.
- source_word: Λύδδα
  choice: Lida
  rationale: E depụtara aha ebe ahụ n’ụdị dabara n’usoro ụda Igbo.
- source_word: τὸν Σαρῶνα
  choice: Sharọn
  rationale: Aha a na-ezo aka n’ógbè ma ọ bụ ala dị larịị nke Sharọn; isi ederede debere ya dị ka aha ebe, ebe nkọwa ala ahụ dị n’okpuru.
- source_word: οἵτινες
  choice: ha wee
  rationale: Nke a na-enye usoro akụkọ ahụ nke ọma n’Igbo, na-ejikọta ịhụ nwoke ahụ na nzaghachi ndị ahụ.
- source_word: ἐπέστρεψαν ἐπὶ τὸν κύριον
  choice: chigharịkwuru Onyenwe anyị
  rationale: “Chigharịkwuru” na-echekwa echiche nke ịtụgharị uche na okwukwe gaa n’ebe Onyenwe anyị nọ, n’ebughị ụzọ kpebie na ha laghachiri mgbe ha si n’ebe ahụ pụọ ma ọ bụ jiri okwu nkà mmụta okpukpe siri ike.
- source_word: κύριον
  choice: Onyenwe anyị
  rationale: Nke a bụ aha nsọpụrụ Igbo a na-ejikarị sụgharị κύριος; a gbakwụnyeghị “Jizọs” n’ihi na ọ dịghị n’ederede Grik.
theological_decisions:
- issue: Onye okwu “Onyenwe anyị” na-ezo aka na ya
  choice: Onyenwe anyị
  alternative: Onyenwe anyị Jizọs
  rationale: Ihe gbara amaokwu ahụ gburugburu na-egosi na ọ na-ezo aka na Jizọs, ma Grik kwuru naanị “Onyenwe anyị”; ya mere, nsụgharị ahụ echekwala ihe ederede kwuru n’enweghị mgbakwunye.
- issue: Ike okwu ἐπέστρεψαν
  choice: chigharịkwuru
  alternative: laghachikwuru; ghọrọ ndị kwere ekwe n’Onyenwe anyị
  rationale: “Chigharịkwuru” na-echekwa nghọta nke nchegharị na okwukwe, ma ọ naghị ekwu n’amaghị ama na ha bụbu ndị nke Onyenwe anyị ma ọ bụ jiri nkọwa okpukpe sara mbara dochie okwu ahụ.
translation_notes:
  register: Igbo Izugbe nke oge a, dị mfe nghọta ma nwee ùgwù. E ji “wee” mee ka usoro akụkọ ahụ gaa nke ọma; e debere ekwughị kpọmkwem ma Sharọn bụ aha ógbè ma ọ bụ ala dị larịị, nakwa ma ἐπέστρεψαν pụtara ịtụgharị ma ọ bụ ịlaghachi.
