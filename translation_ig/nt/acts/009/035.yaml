revisions:
- from: Ndị niile bi na Lida na Sharọn[a] hụrụ ya, ha wee chigharịkwuru Onyenwe anyị.[b]
  to: Ndị niile bi na Lida na Sharọn[a] hụrụ ya, ha atụgharịa n'ebe Onyenweanyị nọ.[b]
  rationale: The revision substitutes a neutral, idiomatic expression for turning to the Lord in place of wording that can overstate a return sense, and it uses the conventional Standard Igbo biblical title Onyenweanyị. It retains the direct object “ya,” the collective scope of all inhabitants, the regional-name ambiguity in footnote a, and the interpretive alternatives in footnote b.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T09:17:15Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the people of Lydda and Sharon seeing Aeneas and their consequent turning to the Lord. However, “chigharịkwuru” normally carries a more explicit ‘turn back/return’ sense than is warranted in the main text; Greek ἐπέστρεψαν can bear that sense but does not require it. A less presuppositional Igbo expression better retains the source ambiguity.
  naturalness: “Ndị niile bi na Lida na Sharọn hụrụ ya” is clear, natural Standard Igbo. “Tụgharịrị n'ebe Onyenweanyị nọ” is an idiomatic and suitably reverent way to express turning to the Lord. The conventional fused biblical form “Onyenweanyị” is preferable to the ordinary possessive phrase “Onyenwe anyị.”
  terminology: Lida and Sharọn are acceptable Igbo forms of the place names. “Onyenweanyị” preserves the established Igbo biblical title for κύριος without adding “Jizọs.” The Sharon note appropriately identifies the regional/plain sense without making it mandatory in the main text.
  issues:
  - severity: medium
    issue: The main-text verb “chigharịkwuru” can imply returning rather than simply turning.
    rationale: The prefix and usual force of chigharị more readily suggest a return. Although ‘returned’ is a possible interpretation of ἐπέστρεψαν, the Greek context does not establish a prior relationship from which these people returned. “Tụgharịrị n'ebe ... nọ” keeps the conversion-oriented turn while leaving the question open.
  - severity: low
    issue: “Onyenwe anyị” is written as an ordinary possessive phrase rather than the conventional biblical title.
    rationale: “Onyenweanyị” is the established Standard Igbo scriptural form for ‘Lord.’ It reads as a title and avoids unnecessary emphasis on the possessive sense of anyị (‘our’).
  revised_text: Ndị niile bi na Lida na Sharọn[a] hụrụ ya, ha atụgharịa n'ebe Onyenweanyị nọ.[b]
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “ala dị larịị nke Sharọn.”
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị “tụgharịrị n'ebe Onyenweanyị nọ” dị ka “laghachikwuru Onyenweanyị,” ma ọ bụ, n’ụzọ nkọwa karịa, “ghọrọ ndị kwere ekwe n’Onyenweanyị.”
    reason: lexical_alternative
  revision_rationale: The revision substitutes a neutral, idiomatic expression for turning to the Lord in place of wording that can overstate a return sense, and it uses the conventional Standard Igbo biblical title Onyenweanyị. It retains the direct object “ya,” the collective scope of all inhabitants, the regional-name ambiguity in footnote a, and the interpretive alternatives in footnote b.
