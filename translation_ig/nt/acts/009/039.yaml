revisions:
- from: Ya mere, Pita biliri soro ha gaa. Mgbe o rutere, ha kpọgara ya n’ụlọ elu. Ụmụ nwaanyị niile di ha nwụrụ guzoro n’akụkụ ya[a], na-akwa ákwá ma na-egosi ya uwe ime na uwe elu[b] niile Dọkas[c] na-adụ mgbe ya na ha nọ.
  to: Ya mere, Pita biliri soro ha gaa. Mgbe o rutere, ha kpọgara ya n’ụlọ elu. Ụmụ nwanyị niile di ha nwụrụ guzoro n’akụkụ ya[a], na-akwa ákwá ma na-egosi ya uwe ime na uwe elu[b] niile Dọkas[c] na-eme mgbe ya na ha nọ.
  rationale: The revision removes the unwarranted implication that Dorcas sewed the garments, using “na-eme” for the Greek imperfect ἐποίει. It also makes the plural expression for the widows more standard and corrects the footnote’s translation-language phrasing. No theological or interpretive change is introduced.
