id: ACT.9.39
reference: Acts 9:39
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀναστὰς δὲ Πέτρος συνῆλθεν αὐτοῖς· ὃν παραγενόμενον ἀνήγαγον εἰς τὸ ὑπερῷον, καὶ παρέστησαν αὐτῷ πᾶσαι αἱ χῆραι κλαίουσαι καὶ ἐπιδεικνύμεναι χιτῶνας καὶ ἱμάτια ὅσα ἐποίει μετ’ αὐτῶν οὖσα ἡ Δορκάς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/039.yaml
  text: So Peter got up and went with them[a]. When he arrived, they took him up to the upper room, and all the widows stood beside him[c][b], weeping and showing the tunics and garments that Dorcas made while she was with them.
translation:
  language: ig
  text: Ya mere, Pita biliri soro ha gaa. Mgbe o rutere, ha kpọgara ya n’ụlọ elu. Ụmụ nwanyị niile di ha nwụrụ guzoro n’akụkụ ya[a], na-akwa ákwá ma na-egosi ya uwe ime na uwe elu[b] niile Dọkas[c] na-eme mgbe ya na ha nọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịtụgharị ya, “guzoro n’ihu ya.” Okwu Grik ahụ nwere ike ịpụta na ha guzoro nso Pita ma ọ bụ n’ihu ya.
    reason: lexical_alternative
  - marker: b
    text: “Uwe ime na uwe elu” na-anọchi anya okwu Grik abụọ dị iche iche maka uwe a na-eyi n’ime na uwe a na-eyi n’elu.
    reason: cultural_note
  - marker: c
    text: Dọkas bụ aha Grik ya; n’Ọrụ Ndịozi 9:36, a kpọkwara ya Tabita.
    reason: cross_reference
lexical_decisions:
- source_word: ἀναστὰς
  choice: biliri
  rationale: Ọ na-egosi na Pita biliri iji mee ihe ndị ozi ahụ rịọrọ ya; okwu a dị mfe ma bụrụkwa Igbo nkịtị.
- source_word: συνῆλθεν αὐτοῖς
  choice: soro ha gaa
  rationale: N’ọnọdụ a, ngwaa ahụ pụtara na Pita sooro ndị ozi ahụ gaa, ọ bụghị naanị na ha zukọrọ.
- source_word: παραγενόμενον
  choice: Mgbe o rutere
  rationale: Ọ na-egosi oge ihe ọzọ mere, ya bụ, mgbe Pita bịarutere.
- source_word: ἀνήγαγον εἰς τὸ ὑπερῷον
  choice: ha kpọgara ya n’ụlọ elu
  rationale: Nke a na-edobe echiche nke ịkpọga Pita n’ọnụ ụlọ dị n’elu ụlọ.
- source_word: παρέστησαν αὐτῷ
  choice: guzoro n’akụkụ ya
  rationale: Ọ na-egosi na ụmụ nwaanyị ahụ bịara guzoro nso Pita; ihe odide Grik nwekwara ike ịpụta na ha guzoro n’ihu ya.
- source_word: πᾶσαι αἱ χῆραι
  choice: Ụmụ nwaanyị niile di ha nwụrụ
  rationale: Nke a bụ ụzọ doro anya ma dị ùgwù e si akọwa ndị inyom di ha nwụrụ n’Igbo nke oge a.
- source_word: κλαίουσαι
  choice: na-akwa ákwá
  rationale: Ọ na-egosi na ha nọgidere na-eru uju n’oge ahụ.
- source_word: ἐπιδεικνύμεναι
  choice: na-egosi ya
  rationale: Nke a na-egosi na ha na-ewetara Pita uwe ndị ahụ ka ọ hụ ha.
- source_word: χιτῶνας καὶ ἱμάτια
  choice: uwe ime na uwe elu
  rationale: 'Nke a na-edobe ọdịiche dị n’etiti ụdị uwe abụọ ahụ: nke a na-eyi n’ime na nke a na-eyi n’elu ya.'
- source_word: ὅσα ἐποίει
  choice: niile Dọkas na-adụ
  rationale: Ụdị ngwaa Grik na-egosi ọrụ na-aga n’ihu ma ọ bụ nke a na-eme ugboro ugboro n’oge gara aga; “na-adụ” na-egosipụta nke a n’ụzọ e ji asụ Igbo.
- source_word: μετ’ αὐτῶν οὖσα
  choice: mgbe ya na ha nọ
  rationale: Nke a na-edobe okwu isi mmalite banyere oge Dọkas ka nọ n’etiti ha.
theological_decisions: []
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke doro anya ma dị ùgwù, dee ya. A họọrọ “ụmụ nwaanyị di ha nwụrụ” kama okwu nwere ike ịdị ochie ma ọ bụ sie ndị nkịtị ike. E debere ọdịiche uwe abụọ ahụ na nke na-aga n’ihu n’ụdị ngwaa ἐποίει, ma e dozighị nghọta abụọ nke παρέστησαν αὐτῷ n’ụzọ zoro ezo.
