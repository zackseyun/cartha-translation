revisions:
- from: Onyenwe anyị wee sị ya, “Bilie gaa n’okporo ámá a na-akpọ Kwụ Ọtọ; n’ụlọ Judas, chọọ otu nwoke aha ya bụ Sọl, onye Tasọs[a], n’ihi na lee, ọ nọ na-ekpe ekpere.”
  to: Onyenwe anyị wee sị ya, “Bilie gaa n’okporo ámá a na-akpọ Kwụ Ọtọ; n’ụlọ Judas, chọọ otu nwoke aha ya bụ Sọl, onye si Tasọs, n’ihi na, lee, ọ nọ na-ekpe ekpere.”
  rationale: The revision retains the source meaning and the draft’s register while making the Tarsian designation explicit in idiomatic Standard Igbo, punctuating the discourse marker naturally, and replacing the footnote’s faulty introductory wording. The footnote preserves the legitimate more literal alternative without changing the passage’s meaning.
