id: ACT.9.11
reference: Acts 9:11
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ δὲ κύριος πρὸς αὐτόν· ⸀Ἀναστὰς πορεύθητι ἐπὶ τὴν ῥύμην τὴν καλουμένην Εὐθεῖαν καὶ ζήτησον ἐν οἰκίᾳ Ἰούδα Σαῦλον ὀνόματι Ταρσέα, ἰδοὺ γὰρ προσεύχεται,
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/011.yaml
  text: And the Lord said to him[a], “Get up and go to the street called Straight, and in the house of Judas look for a man named Saul, from Tarsus, for behold, he is praying.”
translation:
  language: ig
  text: Onyenwe anyị wee sị ya, “Bilie gaa n’okporo ámá a na-akpọ Kwụ Ọtọ; n’ụlọ Judas, chọọ otu nwoke aha ya bụ Sọl, onye si Tasọs, n’ihi na, lee, ọ nọ na-ekpe ekpere.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κύριος
  choice: Onyenwe anyị
  rationale: Ọ bụ nsụgharị Igbo a na-ejikarị maka aha-ọkwa ‘Onyenwe anyị’; ọ na-echekwa ikike onye na-ekwu okwu ma ghara ịgbakwunye ‘Jizọs,’ nke adịghị n’ahịrịokwu Grik a.
- source_word: Ἀναστὰς πορεύθητι
  choice: Bilie gaa
  rationale: 'Ọ na-enye iwu abụọ ahụ n’ụzọ Igbo doro anya ma dịkwa nkenke: ibili wee gawa.'
- source_word: ῥύμην τὴν καλουμένην Εὐθεῖαν
  choice: okporo ámá a na-akpọ Kwụ Ọtọ
  rationale: ‘Okporo ámá’ na-egosi ụzọ dị n’obodo, ebe ‘Kwụ Ọtọ’ na-echekwa ihe aha Grik Εὐθεῖαν pụtara ma na-arụ ọrụ dịka aha ụzọ.
- source_word: ἐν οἰκίᾳ Ἰούδα
  choice: n’ụlọ Judas
  rationale: Ọ na-echekwa ebe a ga-achọ Sọl ma bụrụkwa okwu Igbo nkịtị.
- source_word: ζήτησον
  choice: chọọ
  rationale: Ọ pụtara ịchọ mmadụ; ọ naghị ekwu hoo haa na a chọtala ya, dịka ‘chọta’ gaara egosi.
- source_word: Σαῦλον ὀνόματι Ταρσέα
  choice: otu nwoke aha ya bụ Sọl, onye Tasọs
  rationale: ‘Aha ya bụ Sọl’ na-egosi aha ya, ebe ‘onye Tasọs’ na-akọwa obodo o si pụta, dịka adjective Grik Ταρσέα si eme.
- source_word: ἰδοὺ γὰρ
  choice: n’ihi na lee
  rationale: ‘N’ihi na’ na-enye ihe kpatara iwu ahụ, ‘lee’ na-adọtakwa uche n’ihe na-esochi.
- source_word: προσεύχεται
  choice: ọ nọ na-ekpe ekpere
  rationale: Ọ na-egosi ihe Sọl na-eme ugbu a n’oge ahụ.
theological_decisions:
- issue: Onye κύριος na-ezo aka na ya
  choice: Onyenwe anyị
  alternative: Onyenwe anyị Jizọs
  rationale: Akụkọ gbara amaokwu ahụ gburugburu na-egosi onye na-ekwu okwu, ma amaokwu a n’onwe ya kwuru naanị κύριος. Ya mere, nsụgharị ahụ etinyeghị ‘Jizọs’ n’ebe ederede Grik na-etinyeghị ya.
translation_notes:
  register: 'Asụsụ ahụ bụ Igbo Izugbe nke oge a: ọ dị ugwu ma dị mfe nghọta. E ji ‘wee sị’ mee ka akụkọ ahụ na-aga n’ihu n’ụzọ Igbo ebumpụta ụwa; e chekwara ‘lee’ iji gosipụta nrụtụ aka dị na ἰδού.'
