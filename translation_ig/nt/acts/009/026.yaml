id: ACT.9.26
reference: Acts 9:26
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Παραγενόμενος δὲ ⸀εἰς Ἰερουσαλὴμ ⸀ἐπείραζεν κολλᾶσθαι τοῖς μαθηταῖς· καὶ πάντες ἐφοβοῦντο αὐτόν, μὴ πιστεύοντες ὅτι ἐστὶν μαθητής.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/026.yaml
  text: And when he came to Jerusalem[a], he was trying to join the disciples, but they were all afraid of him, not believing that he was a disciple.
translation:
  language: ig
  text: 'Mgbe ọ bịarutere Jeruselem, ọ nọ na-agbalị isonyere[a] ndị na-eso ụzọ ahụ, ma ha niile na-atụ ya egwu, n’ihi na ha ekweghị na ọ bụ onye na-eso ụzọ.


    [a] Ma ọ bụ, “ijikọta onwe ya na ndị na-eso ụzọ ahụ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ijikọta onwe ya na ndị na-eso ụzọ ahụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Παραγενόμενος
  choice: Mgbe ọ bịarutere
  rationale: Nkebi aorist a na-egosi ọnọdụ mere tupu omume bụ isi amalite. “Mgbe ọ bịarutere” bụ Igbo dị mfe ma na-edobe ihe oge ahụ pụtara.
- source_word: δὲ
  choice: —
  rationale: A hapụrụ njikọ dị nro a n’enweghị okwu pụrụ iche n’Igbo, n’ihi na “Mgbe” na-ebute akụkọ ọhụrụ ahụ nke ọma; itinye “ma” n’isi amaokwu ga-eme ka ọdịiche dị ike karịa nke Grik.
- source_word: εἰς Ἰερουσαλήμ
  choice: Jeruselem
  rationale: Aha obodo ahụ na okwu “bịarutere” na-egosi ntụgharị ije gaa Jeruselem n’ụzọ Igbo si ekwu ya.
- source_word: ἐπείραζεν
  choice: ọ nọ na-agbalị
  rationale: Ụdị imperfect na-egosi mgbalị na-aga n’ihu. “Ọ nọ na-agbalị” na-edobe akụkụ ahụ, ọ pụtaghị ọnwụnwa.
- source_word: κολλᾶσθαι
  choice: isonyere
  rationale: N’ọnọdụ mmekọrịta mmadụ a, okwu ahụ pụtara ịbanye n’etiti ha ka ya na ha nwee mmekọrịta chiri anya. “Ison yere” na-ekwupụta ya n’Igbo nkịtị n’enweghị echiche banyere usoro nnabata chọọchị e guzobere mgbe e mesịrị.
- source_word: τοῖς μαθηταῖς
  choice: ndị na-eso ụzọ ahụ
  rationale: Nke a na-ezo aka n’òtù ndị na-eso ụzọ a marala ama nọ na Jeruselem. “Ahụ” na-egosipụta article Grik n’ụzọ dabara n’Igbo.
- source_word: καὶ πάντες ἐφοβοῦντο αὐτόν
  choice: ma ha niile na-atụ ya egwu
  rationale: N’agbanyeghị na καί bụ njikọ nkịtị, ebe a ihe na-esote na-emegide mgbalị Sọl, ya mere “ma” bụ njikọ Igbo kwesịrị ekwesị. “Na-atụ ya egwu” na-edobe ọnọdụ egwu na-aga n’ihu nke imperfect.
- source_word: μὴ πιστεύοντες
  choice: ebe ha na-ekweghị
  rationale: Nkebi participle a na-akọwa ihe kpatara egwu ha. “Ebe” na-edobe njikọ ahụ n’enweghị ime ya ka ọ bụrụ ahịrịokwu nọọrọ onwe ya.
- source_word: ὅτι ἐστὶν μαθητής
  choice: na ọ bụ onye na-eso ụzọ
  rationale: Igbo anaghị achọ ịgbanwe “ọ bụ” gaa n’oge gara aga dị ka Bekee si eme n’okwu a kọrọ; nke a na-esokwa present ἐστίν nke Grik nso.
- source_word: μαθητής
  choice: onye na-eso ụzọ
  rationale: Nke a bụ okwu Igbo doro anya maka onye na-amụta ihe n’aka onye nkụzi ma na-eso ya, ma ọ bụkwa okwu a maara nke ọma n’akụkọ Jizọs na Ndịozi.
theological_decisions:
- issue: Ụdị mmekọrịta Sọl chọrọ iso ndị kwere ekwe nọ na Jeruselem nwee
  choice: A sụgharịrị κολλᾶσθαι dị ka “isonyere,” ya bụ ka a nabata ya n’etiti ndị na-eso ụzọ.
  alternative: “ijikọta onwe ya na” ma ọ bụ “ịrapara n’ahụ”
  rationale: Ihe odide ahụ na-ekwu banyere mgbalị Sọl ịbanye n’etiti ha ka ya na ha na-akpakọrịta; ọ naghị akọwa emume chọọchị ma ọ bụ usoro ịbụ onye otu. Nhọrọ a na-edobe ihe gbasara obodo ndị kwere ekwe n’enweghị ịtinye usoro e guzobere mgbe e mesịrị.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. A na-eji “onye na-eso ụzọ” maka μαθητής, ebe a na-edobe ụdị omume na-aga n’ihu site n’okwu “ọ nọ na-agbalị” na “na-atụ ya egwu.” E debere akara ndetu [a] ozugbo n’akụkụ okwu κολλᾶσθαι ọ na-akọwa.
