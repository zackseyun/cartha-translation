id: ACT.9.4
reference: Acts 9:4
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ πεσὼν ἐπὶ τὴν γῆν ἤκουσεν φωνὴν λέγουσαν αὐτῷ Σαοὺλ Σαούλ, τί με διώκεις;
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/004.yaml
  text: And falling to the ground, he heard a voice saying to him, “Saul, Saul, why are you persecuting me?”
translation:
  language: ig
  text: Mgbe ọ dara n’ala, ọ nụrụ otu olu na-asị ya, “Sọl, Sọl, gịnị mere i ji na-akpagbu m?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πεσὼν
  choice: Mgbe ọ dara
  rationale: Aorist participle ahụ na-egosi ihe mere tupu ịnụ olu ahụ n’usoro akụkọ. Nkebiokwu oge a na-asụ nke ọma n’Igbo ma ọ naghị agbakwụnye ihe na-adịghị na isi mmalite.
- source_word: ἐπὶ τὴν γῆν
  choice: n’ala
  rationale: Nke a bụ ụzọ Igbo doro anya ma kwekọọ n’ọnọdụ a si kwuo na mmadụ dara ruo n’elu ala.
- source_word: ἤκουσεν φωνὴν
  choice: ọ nụrụ otu olu
  rationale: Ebe okwu ndị a na-aghọta na-esochi, φωνή pụtara ‘olu’ karịa naanị ụda. ‘Otu’ na-egosi olu a na-akọ banyere ya n'ụzọ nkịtị n’Igbo.
- source_word: λέγουσαν αὐτῷ
  choice: na-asị ya
  rationale: Nke a na-egosipụta participle nke λέγω n’Igbo dị ugbu a ma na-eduga ozugbo n’okwu e kwuru.
- source_word: Σαοὺλ Σαούλ
  choice: Sọl, Sọl
  rationale: A sụgharịghị aha ahụ kama e dere ya n’ụdị a na-eji n’Igbo; e chekwara nkwughachi ahụ maka ike na mmesi okwu ya.
- source_word: τί
  choice: gịnị mere ... ji
  rationale: τί na-arụ ọrụ dịka ajụjụ ihe kpatara ya ebe a; ‘gịnị mere ... ji’ bụ usoro ajụjụ Igbo kachasị eke maka ‘n’ihi gịnị?’
- source_word: με
  choice: m
  rationale: E chekwara nnọchiaha onye mbụ dịka kpọmkwem ihe a na-akpagbu, na-enweghị ịkọwa ya dịka ‘ndị nke m’ ma ọ bụ ‘ndị na-eso ụzọ m.’
- source_word: διώκεις
  choice: na-akpagbu
  rationale: Present indicative na-egosi omume na-aga n’ihu. N’ọnọdụ Ọrụ Ndị Ozi, ‘ịkpagbu’ na-egosipụta ịchụ na ime ndị kwere ekwe ihe ike karịa okwu sara mbara dịka ‘ịchụso.’
theological_decisions:
- issue: Onye na-ekwu okwu ji onwe ya tụnyere ndị Sọl na-awakpo
  choice: E debere okwu kpọmkwem ‘m.’
  alternative: Ịgbasa ya dịka ‘ndị nke m’ ma ọ bụ ‘ndị na-eso ụzọ m.’
  rationale: Isiokwu Grik n’onwe ya na-ekwu na onye ahụ na-akpagbu ‘m.’ Idebe ya otú ahụ na-echekwa njikọ nkà mmụta okpukpe dị n’etiti onye na-ekwu okwu na obodo a na-akpagbu, na-enweghị itinye nkọwa onye ntụgharị n’ime ederede.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị mfe nghọta ma dị ùgwù. A họọrọ usoro ahịrịokwu eke n’Igbo kama iṅomi participle Grik n’ụzọ siri ike.
