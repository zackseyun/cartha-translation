id: ACT.9.14
reference: Acts 9:14
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ὧδε ἔχει ἐξουσίαν παρὰ τῶν ἀρχιερέων δῆσαι πάντας τοὺς ἐπικαλουμένους τὸ ὄνομά σου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/014.yaml
  text: And here he has authority from the chief priests to bind all who call on your name[a].
translation:
  language: ig
  text: N’ebe a kwa, o nwere ikike o nwetara n’aka ndị isi nchụaja ka o kee ndị niile na-akpọku aha gị[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị niile na-akpọ aha gị.” Okwu Grik a bụ akpaalaokwu Akwụkwọ Nsọ a na-ejikarị akọwa ịkpọku ma ọ bụ ịrịọ mmadụ arịrịọ, ọtụtụ mgbe n’ekpere.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὧδε
  choice: n’ebe a
  rationale: Ọ bụ okwu na-egosi ebe; n’ọnọdụ a, ọ na-ezo aka na Damaskọs, ebe Ananayas nọ.
- source_word: ἐξουσίαν
  choice: ikike
  rationale: Nke a na-egosi ikike e nyere mmadụ ime ihe n’usoro ọchịchị ma ọ bụ iwu, ọ bụghị naanị ike anụ ahụ.
- source_word: παρὰ τῶν ἀρχιερέων
  choice: o nwetara n’aka ndị isi nchụaja
  rationale: παρά ya na genitive na-egosi ebe ikike ahụ si; ‘ndị isi nchụaja’ na-ezo aka n’òtù ndị ndu nchụaja nọ na Jerusalem.
- source_word: δῆσαι
  choice: ka o kee
  rationale: A họọrọ okwu pụtara ‘ike agbụ’ kpọmkwem iji chekwaa ihe oyiyi dị na Grik, ọ bụ ezie na ebumnuche ya bụ ijide ha.
- source_word: πάντας τοὺς ἐπικαλουμένους
  choice: ndị niile na-akpọku
  rationale: Ọ na-ezo aka n’ụmụ mmadụ niile na-akpọku mmadụ, karịsịa n’ekpere; nsụgharị a na-echekwa akpaalaokwu Akwụkwọ Nsọ ahụ.
- source_word: τὸ ὄνομά σου
  choice: aha gị
  rationale: Nsụgharị kpọmkwem na-echekwa akpaalaokwu ahụ, ebe ‘aha’ nwekwara ike ịnọchite anya onye ahụ na ikike ya.
theological_decisions:
- issue: Ihe okwu ‘na-akpọku aha gị’ pụtara mgbe a na-agwa Jizọs okwu
  choice: E debere akpaalaokwu ahụ dịka ‘na-akpọku aha gị.’
  alternative: ndị niile na-ekpegara gị ekpere; ndị niile na-akpọku ikike gị
  rationale: N’Akwụkwọ Nsọ na n’okwu Ndị Kraịst mbụ, akpaalaokwu a na-egosikarị ịkpọku mmadụ n’ekpere na iguzosi ike n’ebe ọ nọ. Ebe Ananayas na-agwa Jizọs okwu ozugbo, nsụgharị ahụ na-echekwa ịdị arọ nke okwu ahụ n’enweghị ịgbakwụnye nkọwa ozizi na-adịghị na Grik.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. ‘Ka o kee’ na-echekwa ihe oyiyi nke Grik, ebe ‘na-akpọku aha gị’ na-echekwa ma nghọta ya banyere ekpere ma ihe gbasara nrube isi na-adịghị mkpa ka e dozie n’otu ụzọ naanị.
