review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately represents all principal Greek elements: ὧδε (''n’ebe a''), delegated ἐξουσία from the chief priests, the literal sense of δῆσαι (''kee''), and the substantival participle referring to all who invoke Jesus’ name. The direct-address possessive ''gị'' is correctly retained.'
  naturalness: The verse is clear and suitably formal in Standard Igbo. 'Ka o kee' is a defensible literal rendering of δῆσαι, though its practical arrest context remains implicit, as in the Greek. The proposed footnote alternative 'na-arịọku aha gị,' however, is not an idiomatic or sufficiently precise Igbo equivalent for 'invoking your name.'
  terminology: '''Ndị isi nchụaja,'' ''ikike,'' and ''na-akpọku aha gị'' are appropriate and consistent with biblical register. The footnote should explain the idiom without making a lexical alternative that can suggest requesting the name itself.'
  issues:
  - severity: medium
    issue: The footnote’s alternative, “ndị niile na-arịọku aha gị,” is imprecise and unnatural in this context.
    rationale: Ịrịọku aha mmadụ can be understood as making a request concerning a name, rather than invoking the person named. The Greek ἐπικαλεῖσθαι τὸ ὄνομα is better represented by the existing main-text idiom 'ịkpọku aha' or, as a close alternative, 'ịkpọ aha.'
  revised_text: N’ebe a kwa, o nwere ikike o nwetara n’aka ndị isi nchụaja ka o kee ndị niile na-akpọku aha gị[a].
