lexical_decisions:
- source_word: λαβὼν τροφὴν
  choice: Mgbe o richara nri
  rationale: Nkebi a na-egosi na ọ natara ma rie nri tupu ike alọghachikwute ya; ntụgharị a bụ Igbo nkịtị ma debe usoro ihe ndị mere.
- source_word: ἐνίσχυσεν
  choice: ike lọghachikwutere ya
  rationale: N'ọnọdụ a, Sọl adịghị ike n'ihi na o righị nri ruo ụbọchị atọ. Okwu a na-egosi na ọ nwetaghachiri ike, ma e nwerekwa ike ịghọta ya dị ka ‘e mere ka o sie ike.’
- source_word: Ἐγένετο δὲ
  choice: Ya ... nọrọ
  rationale: N'ebe a, ἐγένετο δὲ bụ ụzọ e si aga n'ihu n'akụkọ ahụ; Igbo dị mfe adịghị achọ ka a sụgharịa ya kpọmkwem dị ka ‘o wee ruo na.’
- source_word: μετὰ τῶν ἐν Δαμασκῷ μαθητῶν
  choice: Ya na ndị na-eso ụzọ nọ na Damaskọs
  rationale: μετά na genitive na-egosi ịnọnyere ndị ọzọ, ebe ἐν Δαμασκῷ na-akọwa ebe ndị na-eso ụzọ ahụ nọ.
- source_word: ἡμέρας τινάς
  choice: ụbọchị ụfọdụ
  rationale: Accusative a na-egosi ogologo oge a nọrọ; ‘ụbọchị ụfọdụ’ na-edebe oge ahụ ka ọ bụrụ nke a na-akọwaghị kpọmkwem.
