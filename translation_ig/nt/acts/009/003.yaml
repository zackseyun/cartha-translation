id: ACT.9.3
reference: Acts 9:3
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐν δὲ τῷ πορεύεσθαι ἐγένετο αὐτὸν ἐγγίζειν τῇ Δαμασκῷ, ⸂ἐξαίφνης τε αὐτὸν περιήστραψεν⸃ φῶς ⸀ἐκ τοῦ οὐρανοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/003.yaml
  text: As he was traveling[a], it happened that he was drawing near to Damascus, and suddenly a light from heaven flashed around him.
translation:
  language: ig
  text: Ka ọ na-aga, o mere na ọ na-abịaru Damaskọs nso; na mberede, ìhè si n'eluigwe[a] mụkwasịrị ya gburugburu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “si na mbara igwe.” Okwu Grik οὐρανός nwere ike ịpụta “eluigwe” ma ọ bụ “mbara igwe,” ọ bụ ezie na n'ọnọdụ a, “eluigwe” yiri ka ọ na-egosi na ìhè ahụ sitere n'aka Chineke.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν δὲ τῷ πορεύεσθαι
  choice: Ka ọ na-aga n'ụzọ
  rationale: 'Nkebiokwu a na-egosi ihe na-eme n''otu oge: ‘ka/mgbe ọ na-aga.’ ‘Ka ọ na-aga n''ụzọ’ bụ Igbo nkịtị ma doo anya, ebe δέ bụ njikọ akụkọ dị nro nke na-adịghị mkpa ka a sụgharịa ya iche n''ebe a.'
- source_word: ἐγένετο
  choice: o mere na
  rationale: E debere usoro akụkọ Luk ji, nke na-egosi na otu ihe mere, n'agbanyeghị na Igbo a ka na-ada nke ọma.
- source_word: αὐτὸν ἐγγίζειν
  choice: ọ na-abịaru ... nso
  rationale: 'Ụdị na-aga n''ihu na-echekwa echiche nke present infinitive: ọ nọ n''usoro ịbịaru ebe ahụ nso.'
- source_word: τῇ Δαμασκῷ
  choice: Damaskọs
  rationale: Aha obodo ahụ ka e dere n'ụdị a na-anụkarị n'Igbo; ‘ịbịaru ... nso’ na-egosi na ọ nọ nso n'obodo ahụ, ọ bụghị na ọ banyelarị.
- source_word: ἐξαίφνης τε
  choice: na mberede
  rationale: Nke a na-egosi na ihe ahụ bịara na-atụghị anya ya; njikọ ‘na’ na-ejikọkwa ya na ihe gara aga.
- source_word: περιήστραψεν
  choice: nwukwasịrị ya gburugburu
  rationale: Nhọrọ a na-egosi ìhè nke mụnyere onye ahụ n'akụkụ niile, ma na-ejikọta nke ọma na ‘na mberede.’
- source_word: φῶς
  choice: ìhè
  rationale: ‘Ìhè’ bụ okwu Igbo kpọmkwem ma dị mfe maka φῶς.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: si n'eluigwe
  rationale: N'ọnọdụ mkpughe a, ‘eluigwe’ na-echekwa echiche na isi iyi ìhè ahụ bụ nke Chineke, ebe okwu Grik nwekwara ike ịpụta mbara igwe.
theological_decisions:
- issue: Ihe οὐρανός pụtara n'ọnọdụ mkpughe a
  choice: si n'eluigwe
  alternative: si na mbara igwe
  rationale: Akụkọ ahụ bụ nke nzute sitere n'aka Chineke, ya mere ‘eluigwe’ kacha kwekọọ na ihe okwu ahụ yiri ka ọ pụtara ebe a, n'agbanyeghị na e debere nhọrọ ọzọ n'ala ala peeji.
translation_notes:
  register: Asụsụ Igbo zuruọha, nke oge a ma dị ugwu. E tinyere akara ala ala peeji [a] ozugbo n'azụ ‘eluigwe,’ ebe ọ bụ okwu οὐρανός ka nkọwa ahụ metụtara.
