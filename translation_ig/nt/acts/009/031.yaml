id: ACT.9.31
reference: Acts 9:31
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸂Ἡ μὲν οὖν ἐκκλησία καθ’ ὅλης τῆς Ἰουδαίας καὶ Γαλιλαίας καὶ Σαμαρείας εἶχεν εἰρήνην οἰκοδομουμένη, καὶ πορευομένη τῷ φόβῳ τοῦ κυρίου καὶ τῇ παρακλήσει τοῦ ἁγίου πνεύματος ἐπληθύνετο⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/031.yaml
  text: So then the church throughout all Judea and Galilee and Samaria had peace and was being built up[a]; and walking in the fear of the Lord and in the encouragement of the Holy Spirit[b], it was multiplying.
translation:
  language: ig
  text: Ya mere, ụka ahụ n’ofe Judia, Galili, na Sameria niile nwere udo, a na-ewulikwa ya elu[a]. Ka ọ na-aga n’ihu n’ịtụ egwu Onyenwe anyị na n’agbamume nke Mmụọ Nsọ[b], ọ na-amụbakwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ụfọdụ ihe odide na-agụ, “ụka dị iche iche,” kama “ụka ahụ.”
    reason: textual_variant
  - marker: b
    text: Ma ọ bụ, “nkasi obi” ma ọ bụ “ndụmọdụ” nke Mmụọ Nsọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκκλησία
  choice: ụka ahụ
  rationale: A họọrọ otu aha dịka ederede SBLGNT si dị; ọ na-ezo aka n’ụka dịka otu ìgwè gafee ógbè atọ ahụ. A debere ọgụgụ ọtụtụ n’ala ala peeji.
- source_word: καθ’ ὅλης τῆς Ἰουδαίας καὶ Γαλιλαίας καὶ Σαμαρείας
  choice: n’ógbè Judia niile, nakwa na Galili na Sameria
  rationale: Nke a na-egosi na ụka ahụ gbasara n’ógbè ndị a niile, ma na-ezere usoro okwu Igbo nke ga-adị arọ.
- source_word: εἶχεν εἰρήνην
  choice: nwere udo
  rationale: Nke a na-esochi okwu Grik ahụ nke ọma, na-egosikwa ọnọdụ nke enweghị mkpagbu ma ọ bụ ọgba aghara n’enweghị ibelata ya ka ọ bụrụ naanị izu ike.
- source_word: οἰκοδομουμένη
  choice: a nọkwa na-ewuli ya elu
  rationale: Nke a na-echekwa ihe atụ nke iwu ụlọ, ma na-egosi na iwulite na ime ka ụka sie ike nọ na-aga n’ihu.
- source_word: πορευομένη
  choice: Ka ọ na-eje ije
  rationale: E chekwara ihe atụ nke ije, nke ebe a pụtara ụzọ ụka ahụ si ebi ndụ ma na-akpa àgwà.
- source_word: τῷ φόβῳ τοῦ κυρίου
  choice: n’ịtụ egwu Onyenwe anyị
  rationale: Okwu a na-echekwa akpaalaokwu Akwụkwọ Nsọ nke na-egosi nsọpụrụ miri emi na nrube isi, ọ bụghị naanị ụjọ na-eyi egwu.
- source_word: κυρίου
  choice: Onyenwe anyị
  rationale: Nke a bụ ụzọ Igbo a na-ejikarị asụ κύριος dịka aha nsọpụrụ, n’ebughị ụzọ kpebie onye a na-ekwu kpọmkwem karịa ka Grik siri kwuo ya.
- source_word: τῇ παρακλήσει τοῦ ἁγίου πνεύματος
  choice: n’agbamume nke Mmụọ Nsọ
  rationale: “Agbamume” dabara n’ọnọdụ nke iwulite ụka na mmụba ya, ma a hapụrụ nghọta ndị ọzọ dị ka nkasi obi na ndụmọdụ n’ala ala peeji.
- source_word: ἐπληθύνετο
  choice: ọ nọ na-amụba
  rationale: Nke a na-egosi mmụba na-aga n’ihu, ma na-edobe ngwaa otu ọnụ nke kwekọrọ na “ụka ahụ.”
theological_decisions:
- issue: Ọnụọgụ na ihe ἐκκλησία na-ezo aka na ya
  choice: ụka dịka otu ahụ gafee ógbè ndị ahụ
  alternative: ụka dị iche iche n’ọtụtụ ọnụ
  rationale: Ederede SBLGNT nyere ἐκκλησία na ngwaa ndị so ya n’otu ọnụ. Agbanyeghị, ọgụgụ ọtụtụ bụ ọdịiche ederede dị mkpa, ya mere e tinyere ya n’ala ala peeji.
- issue: Ihe “ịtụ egwu Onyenwe anyị” pụtara
  choice: ịsọpụrụ Onyenwe anyị nke ukwuu na irubere ya isi
  alternative: ịtụ ya egwu dịka onye na-eyi egwu
  rationale: E debere akpaalaokwu ahụ n’ụdị ya sara mbara ka a ghara imechi nghọta Akwụkwọ Nsọ ya n’otu nkọwa naanị.
- issue: Uche παράκλησις n’ọrụ Mmụọ Nsọ
  choice: agbamume
  alternative: nkasi obi ma ọ bụ ndụmọdụ
  rationale: Okwu Grik ahụ nwere echiche ndị a niile. “Agbamume” kacha daba n’ọnọdụ a, ma e debere ndị ọzọ n’ala ala peeji iji ghara ihichapụ nghọta ya sara mbara.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. A họọrọ “ụka” kama okwu mbinye “chọọchị,” ma chekwaa ihe atụ ndị dị n’okwu Grik, ya bụ iwuli elu na ije ije.
