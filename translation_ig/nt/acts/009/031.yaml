revisions:
- from: Ya mere, ụka ahụ n’ógbè Judia niile, nakwa na Galili na Sameria, nwere udo, a nọkwa na-ewuli ya elu[a]. Ka ọ na-eje ije n’ịtụ egwu Onyenwe anyị na n’agbamume nke Mmụọ Nsọ[b], ọ nọ na-amụba.
  to: Ya mere, ụka ahụ n’ofe Judia, Galili, na Sameria niile nwere udo, a na-ewulikwa ya elu[a]. Ka ọ na-aga n’ihu n’ịtụ egwu Onyenwe anyị na n’agbamume nke Mmụọ Nsọ[b], ọ na-amụbakwa.
  rationale: The revision clarifies that the church’s peace extended throughout Judea, Galilee, and Samaria, improves the idiom of the passive edification clause, and renders the conduct sense of πορευομένη more naturally in Standard Igbo. It preserves the collective singular church, the ongoing verbal aspect, the established biblical expression “ịtụ egwu Onyenwe anyị,” and the lexical ambiguity of παράκλησις in the footnote.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T09:17:17Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly follows the SBLGNT singular ἐκκλησία and singular verbal forms, retains the three regions, peace, ongoing edification, reverent fear of the Lord, the Holy Spirit’s παράκλησις, and ongoing numerical growth. However, “n’ógbè Judia niile, nakwa na Galili na Sameria” most naturally places “niile” only with Judea and weakens the source’s scope across all three regions. The proposed wording makes the distributive regional scope explicit.
  naturalness: “A nọkwa na-ewuli ya elu” is understandable but impersonal and somewhat stiff following a singular collective subject. “A na-ewulikwa ya elu” is more natural Standard Igbo. “Ka ọ na-eje ije” can sound like literal physical walking; “ka ọ na-aga n’ihu” idiomatically expresses the continuing manner of life/conduct intended by πορευομένη without adding doctrinal interpretation.
  terminology: “Ụka ahụ,” “udo,” “Onyenwe anyị,” “Mmụọ Nsọ,” and “agbamume” are suitable contemporary Standard Igbo terms. The lexical footnote’s “ndụmọdụ” is a defensible, though somewhat narrower, rendering for exhortation; retaining it alongside “nkasi obi” adequately signals the semantic range.
  issues:
  - severity: medium
    issue: Regional scope of “niile” is unclear
    rationale: The Greek καθ’ ὅλης governs the coordinated regions Judea, Galilee, and Samaria. In the draft, “Judia niile, nakwa na Galili na Sameria” can be read as ‘all Judea, and also in Galilee and Samaria,’ rather than throughout all three regions.
  - severity: low
    issue: Edification clause is unnecessarily impersonal/stiff
    rationale: “A nọkwa na-ewuli ya elu” is grammatical but less idiomatic than “a na-ewulikwa ya elu” for an ongoing passive process.
  - severity: low
    issue: Literal ‘walking’ risks a physical sense
    rationale: For πορευομένη, “ka ọ na-aga n’ihu” naturally conveys the church’s continuing conduct in this context while retaining the ongoing aspect.
  revised_text: Ya mere, ụka ahụ n’ofe Judia, Galili, na Sameria niile nwere udo, a na-ewulikwa ya elu[a]. Ka ọ na-aga n’ihu n’ịtụ egwu Onyenwe anyị na n’agbamume nke Mmụọ Nsọ[b], ọ na-amụbakwa.
  revised_footnotes:
  - marker: a
    text: Ụfọdụ ihe odide na-agụ, “ụka dị iche iche,” kama “ụka ahụ.”
    reason: textual_variant
  - marker: b
    text: Ma ọ bụ, “nkasi obi” ma ọ bụ “ndụmọdụ” nke Mmụọ Nsọ.
    reason: lexical_alternative
  revision_rationale: The revision clarifies that the church’s peace extended throughout Judea, Galilee, and Samaria, improves the idiom of the passive edification clause, and renders the conduct sense of πορευομένη more naturally in Standard Igbo. It preserves the collective singular church, the ongoing verbal aspect, the established biblical expression “ịtụ egwu Onyenwe anyị,” and the lexical ambiguity of παράκλησις in the footnote.
