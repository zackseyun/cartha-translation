    reason: lexical_alternative
  revision_rationale: The revision retains every source element and the draft’s neutral theological register. It clarifies that Saul recovered his sight, uses a natural completed passive for baptism, and corrects the footnote so that its alternative wording and explanation both preserve the Greek comparison.
