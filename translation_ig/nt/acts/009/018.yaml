  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ εὐθέως ἀπέπεσαν ⸂αὐτοῦ ἀπὸ τῶν ὀφθαλμῶν⸃ ⸀ὡς λεπίδες, ἀνέβλεψέν τε καὶ ἀναστὰς ἐβαπτίσθη,
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/018.yaml
  text: And immediately something like scales fell from his eyes[a], and he regained his sight; then he got up and was baptized,
translation:
  language: ig
  text: Ozugbo ahụ, ihe dị ka akpịrịkpa si n’anya ya dapụ[a], ọ malitekwara ịhụ ụzọ ọzọ; mgbe ahụ, o biliri, e meekwa ya baptizim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “dị ka akpịrịkpa, ihe si n’anya ya dapụ.” Grik ji ntụnyere mee ihe, na-akọwa otú ihe ahụ yiri, ọ bụghị ikwu hoo haa na ọ bụ akpịrịkpa n’ezie.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθέως
  choice: Ozugbo ahụ
  rationale: Nke a na-egosi na ihe ahụ mere n’otu ntabi anya, n’asụsụ Igbo dị ugbu a ma doo anya.
- source_word: ἀπέπεσαν
  choice: dapụ
  rationale: Ngwaa a na-egosi na ihe ahụ si n’ebe ọ nọ kewapụ wee daa; ‘dapụ’ na-eburu ma ọdịda ma nkewapụ ahụ n’ụzọ ebumpụta ụwa n’Igbo.
- source_word: αὐτοῦ ἀπὸ τῶν ὀφθαλμῶν
  choice: si n’anya ya
  rationale: Nke a bụ ụzọ Igbo si ekwu n’ụzọ nkịtị na ihe ahụ kewapụrụ n’anya ya.
- source_word: ὡς λεπίδες
  choice: ihe dị ka akpịrịkpa
  rationale: ‘Dị ka’ na-echekwa ntụnyere nke ὡς, ebe ‘akpịrịkpa’ na-echekwa oyiyi doro anya nke λεπίδες; a naghị ekwu na ihe ahụ bụ akpịrịkpa n’ezie.
- source_word: ἀνέβλεψεν
  choice: ọ hụkwara ụzọ ọzọ
  rationale: N’ọnọdụ ọgwụgwọ a, ngwaa ahụ pụtara na onye kpuru ìsì malitere ịhụ ụzọ ọzọ, ọ bụghị nanị na o leliri anya elu.
- source_word: τε καὶ
  choice: -kwara; mgbe ahụ
  rationale: Usoro a jikọtara ihe ndị mere ma mee ka usoro omume ha doo anya n’Igbo na-enweghị ịsụgharị ụmụokwu njikọ Grik ahụ n’ụzọ siri ike.
- source_word: ἀναστάς
  choice: o biliri
  rationale: Nke a na-enye omume sochirinụ nke participle ahụ n’ụzọ dị mfe ma bụrụ Igbo ebumpụta ụwa.
- source_word: ἐβαπτίσθη
  choice: e mee ya baptizim
  rationale: Nke a na-echekwa ụdị passive nke ngwaa Grik ahụ ma ghara ịkọwa otu e si mee baptizim ahụ karịa ihe amaokwu ahụ kwuru.
theological_decisions:
- issue: Ịsụgharị βαπτίζω n’ụzọ kwesịrị ntụkwasị obi nke na-akwadoghị otu ụka kpọmkwem
  choice: e mee ya baptizim
  alternative: e mikpuru ya n’ime mmiri
  rationale: Amaokwu ahụ kwuru na e mere ya baptizim ma ọ kọwaghị usoro e ji mee ya. Nhọrọ a na-ezere ịtinye nkọwa banyere ụdị baptizim nke Grik ebe a na-ekwughị hoo haa.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe nghọta ma dịkwa ugwu mee ihe. ‘Akpịrịkpa’ na-echekwa ihe atụ a na-ahụ anya, ebe ‘ihe dị ka’ na-echekwa enweghị nkwubi okwu doro anya dị na ntụnyere Grik.
