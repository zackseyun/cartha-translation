source:
  edition: SBLGNT
  text: καὶ εἶδεν ⸂ἄνδρα ἐν ὁράματι Ἁνανίαν ὀνόματι⸃ εἰσελθόντα καὶ ἐπιθέντα αὐτῷ ⸀χεῖρας ὅπως ἀναβλέψῃ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/012.yaml
  text: and he has seen in a vision a man named Ananias coming in and laying his hands on him so that he might regain his sight[a][b].
translation:
  language: ig
  text: ọ hụla n'ọhụ otu nwoke aha ya bụ Ananayas ka ọ na-abata, na-etinye aka ya abụọ n'ahụ ya, ka o wee hụ ọzọ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ka o wee nwetaghachi ịhụ ụzọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶδεν
  choice: ọ hụkwala
  rationale: Aorist ahụ na-ekwu banyere ihe Sọl hụburu, ma nganiihu -kwala na Igbo na-egosi na ọhụ ahụ emeela ma ka dị mkpa n'okwu a, n'emeghị ka ọ bụrụ naanị usoro tense Bekee.
- source_word: ἐν ὁράματι
  choice: n'ọhụ̀
  rationale: “Ọhụ̀” bụ okwu Igbo dị nkenke ma doo anya maka ọhụụ e nyere mmadụ, ọ bụghị ịhụ ihe nkịtị.
- source_word: ἄνδρα ... Ἁνανίαν ὀνόματι
  choice: otu nwoke aha ya bụ Ananayas
  rationale: Nke a na-edobe nwoke dị ka onye nwoke toro eto ma na-asụgharị akpaalaokwu aha ahụ n'Igbo eke.
- source_word: εἰσελθόντα
  choice: ka ọ na-abata
  rationale: Ụdị a na-egosi omume Ananayas n'ime ọhụ ahụ n'ụzọ Igbo na-aga were were, na-enweghị ịmanye usoro oge karịa nke participle Grik kwuru.
- source_word: ἐπιθέντα αὐτῷ χεῖρας
  choice: na-ebikwasị ya aka
  rationale: Nke a bụ akpaalaokwu Igbo a na-eji maka itinye aka n'ahụ́ mmadụ; ọ na-edobe omume ahụ n'emeghị nkọwa banyere ụdị emume ma ọ bụ ụzọ ọgwụgwọ.
- source_word: ὅπως
  choice: ka o wee
  rationale: Ọ na-egosi ebumnuche nke omume ahụ n'Igbo eke.
- source_word: ἀναβλέψῃ
  choice: hụ ụzọ ọzọ
  rationale: N'ọnọdụ ọgwụgwọ a, okwu ahụ pụtara inwetaghachi ike ịhụ ụzọ; “hụ ụzọ ọzọ” bụ okwu Igbo doro anya ma na-edobekwa echiche nke ịhụ ọzọ.
theological_decisions:
- issue: Ma a ga-akọwa ibikwasị aka dịka emume ụka ma ọ bụ ụzọ pụrụ iche e si agwọ ọrịa
  choice: na-ebikwasị ya aka
  alternative: na-etinye aka ya n'ahụ́ ya
  rationale: Grik ahụ kwuru naanị omume anụ ahụ ahụ, ọ kọwaghị ya dịka oriri nsọ, echichi, ma ọ bụ usoro ọgwụgwọ nke otu nkwenkwe; ya mere nsụgharị ahụ anaghị etinye nkọwa otu ụka.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji “Ananayas” mee ntụgharị mkpụrụokwu aha Ἁνανίας. E debere ahịrịokwu ahụ dịka akụkụ na-aga n'ihu site n'amaokwu bu ya ụzọ; akara ụkwụ [a] dị n'isiokwu dịka iwu si dị.
