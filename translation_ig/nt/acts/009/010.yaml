    rationale: N'Igbo ọ pụrụ ịpụta “look at me.” “Lee, anọ m ebe a” na-ebuga nzaghachi nke nnọkọrịta na ịdị njikere dị na Ἰδοὺ ἐγώ n'ụzọ doro anya karịa.
