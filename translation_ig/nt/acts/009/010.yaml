id: ACT.9.10
reference: Acts 9:10
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἦν δέ τις μαθητὴς ἐν Δαμασκῷ ὀνόματι Ἁνανίας, καὶ εἶπεν πρὸς αὐτὸν ⸂ἐν ὁράματι ὁ κύριος⸃· Ἁνανία. ὁ δὲ εἶπεν· Ἰδοὺ ἐγώ, κύριε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/010.yaml
  text: There was a disciple in Damascus named Ananias, and the Lord said to him in a vision, “Ananias.” And he said, “Here I am, Lord.”
translation:
  language: ig
  text: Otu onye na-eso ụzọ nọ na Damaskọs, aha ya bụ Ananayas. Onyenweanyị gwara ya n'ọhụụ, sị, “Ananayas!” Ọ zara, “Lee, anọ m ebe a, Onyenwe m.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἦν δέ
  choice: Otu ... nọ
  rationale: E ji nke a webata onye ọhụrụ n'akụkọ ahụ. Usoro Igbo a na-ada nke ọma n'akụkọ ma na-egosipụta mgbanwe dị nro nke δέ n'enweghị itinye okwu oge na-adịghị na Grik.
- source_word: τις μαθητὴς
  choice: Otu onye na-eso ụzọ Jizọs
  rationale: τις na-egosi onye a na-akọwabeghị; “otu onye” bụ ụzọ Igbo si webata ya. “Onye na-eso ụzọ Jizọs” na-eme ka ihe μαθητής pụtara doo onye nkịtị anya n'ọnọdụ a.
- source_word: ἐν Δαμασκῷ
  choice: na Damaskọs
  rationale: Nke a bụ ntụgharị ebe kpọmkwem; e dere aha obodo ahụ n'ụdị a na-anụkarị n'Igbo.
- source_word: ὀνόματι Ἁνανίας
  choice: aha ya bụ Ananayas
  rationale: Ọ bụ ụzọ Igbo dị mfe ma bụrụkwa nke ebumpụta ụwa e si ekwu aha onye.
- source_word: ἐν ὁράματι
  choice: n'ọhụụ
  rationale: Na-egosi ọnọdụ ma ọ bụ ụzọ Onyenwe anyị si gwa Ananayas okwu.
- source_word: ὁ κύριος
  choice: Onyenwe anyị
  rationale: Ọ bụ ntụgharị Igbo a na-anabata nke κύριος n'aha nsọpụrụ, ma n'ọnọdụ a ọ na-arụtụ aka n'Onyenwe anyị ahụ bilitere n'ọnwụ.
- source_word: εἶπεν πρὸς αὐτόν
  choice: gwara ya ... sị
  rationale: Nke a bụ usoro okwu Igbo ebumpụta ụwa nke na-edobe okwu a gwara ya kpọmkwem.
- source_word: Ἁνανία
  choice: Ananayas
  rationale: Aha a nọ n'ụdị ịkpọ onye okwu; nsụgharị mkpụrụedemede Igbo a na-eme ka mkpọpụta ya doo anya.
- source_word: Ἰδοὺ ἐγώ
  choice: Lee m
  rationale: Ọ bụ nzaghachi Igbo dị mkpirikpi nke na-egosi na onye ahụ nọ ya ma dị njikere ige ntị; ọ na-echekwa ụda ἰδού karịa ịsị naanị “Anọ m ebe a.”
- source_word: κύριε
  choice: Onyenwe m
  rationale: N'ọnọdụ ọhụụ a, ọ bụ okwu Ananayas ji kpọọ onye na-agwa ya okwu dị ka Onyenwe ya, ọ bụghị naanị “nna m ukwu.”
theological_decisions:
- issue: Onye ὁ κύριος / κύριε na-arụtụ aka na ya n'ọhụụ ahụ
  choice: A tụgharịrị ha dị ka aha nsọpụrụ nke Onyenwe anyị bilitere n'ọnwụ
  alternative: Ịghọta κύριε dị ka okwu nkwanye ùgwù nkịtị, “nna m ukwu”
  rationale: Ihe gbara amaokwu a gburugburu n'Ọrụ Ndị Ozi 9 na-egosi na onye na-ekwu okwu bụ Jizọs bilitere n'ọnwụ. “Onyenwe anyị” na “Onyenwe m” na-echekwa ihe Kraịst pụtara n'ebe a n'etinyeghị aha Jizọs n'okwu Grik n'onwe ya.
translation_notes:
  register: Standard Igbo; asụsụ dị ugbu a, dị ùgwù, ma dị mfe nghọta. E jiri “gwara ya ... sị” mee ka okwu a na-akọ na nke e kwuru kpọmkwem na-aga nke ọma n'Igbo. Enweghị akara nkọwa ala peeji n'ihi na ọdịiche ndị dị ebe a achọghị nkọwa nye onye na-agụ ya.
