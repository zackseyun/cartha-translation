id: ACT.9.36
reference: Acts 9:36
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἐν Ἰόππῃ δέ τις ἦν μαθήτρια ὀνόματι Ταβιθά, ἣ διερμηνευομένη λέγεται Δορκάς· αὕτη ἦν πλήρης ⸂ἔργων ἀγαθῶν⸃ καὶ ἐλεημοσυνῶν ὧν ἐποίει.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/036.yaml
  text: In Joppa there was a disciple named Tabitha[a], which translated is called Dorcas. She was full of good works and acts of mercy that she was doing.
translation:
  language: ig
  text: Na Jọpa, e nwere otu nwanyị na-eso ụzọ aha ya bụ Tabita[a]. Mgbe a sụgharịrị aha ya, a na-akpọ ya Dọkas. Ọ jupụtara n’ezi ọrụ na n’omume ebere ndị ọ na-eme.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dọkas bụ aha Grik kwekọrọ na Tabita; aha ahụ pụtara “ele.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μαθήτρια
  choice: otu nwanyị na-eso ụzọ Jizọs
  rationale: Aha Grik a bụ nke nwanyị kpọmkwem. Igbo enweghị otu aha dị mkpirikpi nke na-egosi ma ịbụ onye na-eso ụzọ ma ịbụ nwanyị, ya mere e mere ka ihe abụọ ahụ pụta ìhè n'ụzọ ebumpụta ụwa; itinye “Jizọs” na-eme ka njirimara onye ọ na-eso doo anya n'Igbo.
- source_word: ὀνόματι Ταβιθά
  choice: aha ya bụ Tabita
  rationale: Nke a bụ ụzọ Igbo dị mfe ma bụrụkwa nke a na-asụkarị iji webata aha mmadụ.
- source_word: διερμηνευομένη λέγεται Δορκάς
  choice: ma a sụgharịa aha ahụ, a na-akpọ ya Dọkas
  rationale: Nke a na-echekwa ma nkọwa banyere nsụgharị aha ahụ ma usoro ịkpọ ya aha Grik kwekọrọ na ya.
- source_word: πλήρης ἔργων ἀγαθῶν
  choice: O juputara n’ezi ọrụ
  rationale: “Juputara” na-egosi ụba na omume a na-ahụkarị; “ezi ọrụ” na-edebe njikọ kpọmkwem na ἔργα ἀγαθά ma bụrụ Igbo a na-aghọta nke ọma.
- source_word: ἐλεημοσυνῶν
  choice: omume ebere
  rationale: Okwu a nwere ike ịpụta inye ndị nọ ná mkpa onyinye ebere, ma “omume ebere” na-echekwa obosara ya n'amaokwu a n'enweghị ime ka ọ bụrụ naanị ego.
- source_word: ὧν ἐποίει
  choice: ndị ọ nọ na-eme
  rationale: “Nọ na-eme” na-egosipụta imperfect ἐποίει dịka omume na-aga n'ihu ma ọ bụ nke ọ na-eme mgbe niile.
- source_word: δέ
  choice: ma
  rationale: A na-eji “ma” jikọta ozi ọhụrụ a na akụkọ gara aga n'ụzọ dị nro, n'enweghị ịgbakwunye akara oge na-adịghị na isi okwu ahụ.
- source_word: Ἐν Ἰόππῃ
  choice: Na Jọpa
  rationale: Nke a bụ ntụgharị locative dị nkenke na nke ebumpụta ụwa, jiri mkpụrụedemede Igbo dee aha ebe ahụ.
theological_decisions:
- issue: Igosipụta ụdị nwanyị nke μαθήτρια
  choice: otu nwanyị na-eso ụzọ Jizọs
  alternative: otu onye na-eso ụzọ Jizọs
  rationale: Isi okwu Grik na-egosi kpọmkwem na onye ahụ bụ nwanyị. Nhọrọ a na-eme ka ozi ahụ ghara ifu n'Igbo, ma ọ naghị etinye echiche ụka pụrụ iche.
- issue: Oke ihe ἐλεημοσυνῶν pụtara
  choice: omume ebere
  alternative: inye onyinye ebere
  rationale: “Omume ebere” na-ahapụ ohere maka ọrụ ebere dị iche iche dịka okwu ahụ na ọnọdụ ya si kwe, ebe “inye onyinye ebere” nwere ike ime ka ihe ọ pụtara bụrụ naanị onyinye a na-enye.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke oge a, dị ùgwù ma dị mfe nghọta. E dere aha ndị ahụ dịka Tabita na Dọkas, ebe Joppa ghọrọ Jọpa. A zere okwu ụka siri ike na okwu ochie; e chekwara ọdịiche dị n’etiti aha Arameik na aha Grik site na ihe odide na nkọwa ala peeji.
