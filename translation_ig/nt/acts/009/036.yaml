review_pass:
  verdict: revise
  source_fidelity: The draft correctly identifies Tabitha as a woman disciple, retains the explanatory Greek equivalent name Dorcas, and conveys her abundance of good works and merciful deeds. However, “Jizọs” is not present in the Greek and should not be supplied. The connective “ma” before the name explanation can misleadingly imply contrast rather than functioning as the source's explanatory transition.
  naturalness: 'The revised wording uses natural Standard Igbo: “nwanyị na-eso ụzọ” explicitly reflects the feminine μαθήτρια without unnecessary expansion, and “Ọ jupụtara n’ezi ọrụ na n’omume ebere ndị ọ na-eme” is idiomatic while retaining the ongoing force of the imperfect.'
  terminology: “omume ebere” is an appropriate broad rendering of ἐλεημοσύναις, without restricting it to monetary almsgiving. Tabita and Dọkas are suitable Igbo-form spellings, and the footnote accurately gives the lexical sense of the name.
  issues:
  - severity: medium
    issue: The main text adds “Jizọs” in “nwanyị na-eso ụzọ Jizọs.”
    rationale: μαθήτρια means a female disciple, but Acts 9:36 does not explicitly state “of Jesus.” The addition is plausible from context but exceeds the wording of this verse.
  - severity: low
    issue: “ma” introduces the explanatory naming clause.
    rationale: δέ opens the verse as a mild narrative connective; the clause concerning Dọkas is an explanation, not a contrast. Recasting it avoids a potentially adversative reading.
  revised_text: Na Jọpa, e nwere otu nwanyị na-eso ụzọ aha ya bụ Tabita[a]. Mgbe a sụgharịrị aha ya, a na-akpọ ya Dọkas. Ọ jupụtara n’ezi ọrụ na n’omume ebere ndị ọ na-eme.
  revised_footnotes:
  - marker: a
    text: Dọkas bụ aha Grik kwekọrọ na Tabita; aha ahụ pụtara “ele.”
    reason: lexical_alternative
  revision_rationale: Removed the unsupported addition “Jizọs,” retained the explicitly female sense of μαθήτρια, and recast the name explanation as an explanatory sentence rather than a contrast. The final sentence preserves both the fullness of her good works and charitable acts and the imperfect's habitual/ongoing sense.
