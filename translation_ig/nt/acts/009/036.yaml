- from: Na Jọpa, e nwere otu nwanyị na-eso ụzọ Jizọs aha ya bụ Tabita[a]; ma a sụgharịa aha ahụ, a na-akpọ ya Dọkas. O juputara n’ezi ọrụ na omume ebere ndị ọ nọ na-eme.
  to: Na Jọpa, e nwere otu nwanyị na-eso ụzọ aha ya bụ Tabita[a]. Mgbe a sụgharịrị aha ya, a na-akpọ ya Dọkas. Ọ jupụtara n’ezi ọrụ na n’omume ebere ndị ọ na-eme.
  rationale: Removed the unsupported addition “Jizọs,” retained the explicitly female sense of μαθήτρια, and recast the name explanation as an explanatory sentence rather than a contrast. The final sentence preserves both the fullness of her good works and charitable acts and the imperfect's habitual/ongoing sense.
