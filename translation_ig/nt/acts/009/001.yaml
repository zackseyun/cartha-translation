id: ACT.9.1
reference: Acts 9:1
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ὁ δὲ Σαῦλος ἔτι ἐμπνέων ἀπειλῆς καὶ φόνου εἰς τοὺς μαθητὰς τοῦ κυρίου, προσελθὼν τῷ ἀρχιερεῖ
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/001.yaml
  text: But Saul[a], still breathing threats and murder against the disciples of the Lord, came to the high priest
translation:
  language: ig
  text: Ma Sọl ka nọ na-ekupụta iyi egwu na igbu ọchụ[a] megide ndị na-eso ụzọ Onyenwe anyị; ọ gakwuuru nnukwu onye nchụàjà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị “igbu ọchụ” dị ka “ogbugbu.” Okwu Grik φόνος nwere ike ịpụta igbu mmadụ ma ọ bụ igbu ọchụ; a họọrọ “igbu ọchụ” iji gosipụta ịdị njọ ya n'omume.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Ma
  rationale: Ọ na-egosi ntughari akụkọ nwere obere ọdịiche, ebe akụkọ ahụ laghachiri n'ihe gbasara Sọl.
- source_word: ἔτι
  choice: ka nọ
  rationale: Ọ na-egosi na ọnọdụ iro Sọl sitere n'akụkọ gara aga ka na-aga n'ihu.
- source_word: ἐμπνέων
  choice: na-ekupụta
  rationale: 'Nke a na-edobe ihe atụ doro anya nke okwu Grik ahụ: iyi egwu na igbu ọchụ dị ka ihe Sọl na-ekupụta n''ume ya.'
- source_word: ἀπειλῆς
  choice: iyi egwu
  rationale: Nke a bụ okwu Igbo nkịtị ma doo anya maka okwu na omume e ji atụ ndị ọzọ egwu.
- source_word: φόνου
  choice: igbu ọchụ
  rationale: Ọ na-egosi igbu mmadụ n'ụzọ jọgburu onwe ya ma na-edobe ibu omume dị n'okwu Grik ahụ.
- source_word: εἰς τοὺς μαθητὰς
  choice: megide ndị na-eso ụzọ
  rationale: N'ọnọdụ iro a, εἰς na-egosi na iyi egwu na ọchịchọ igbu mmadụ ahụ chere ndị na-eso ụzọ ihu.
- source_word: μαθητὰς
  choice: ndị na-eso ụzọ
  rationale: Nke a bụ nsụgharị Igbo doro anya ma bụrụkwa okwu a na-ejikarị akọwa ndị na-amụ ihe n'aka onye nkụzi ma na-eso ya.
- source_word: τοῦ κυρίου
  choice: Onyenwe anyị
  rationale: Ọ bụ ụzọ Igbo a na-anabata nke ọma isi sụgharị κύριος dị ka utu aha; genitive ahụ na-egosi na ndị na-eso ụzọ ahụ bụ nke Onyenwe anyị.
- source_word: προσελθὼν
  choice: ọ gakwuuru
  rationale: Ọ na-egosi mmegharị Sọl bịaruru onye isi nchụàjà nso, ma mee ka ahịrịokwu nke kwụsịrị na participle kwụsie ike n'Igbo.
- source_word: τῷ ἀρχιερεῖ
  choice: nnukwu onye nchụàjà
  rationale: Nke a bụ aha Igbo doro anya maka onye isi kachasị elu n'etiti ndị nchụàjà n'okwu a.
theological_decisions:
- issue: Nsụgharị κύριος n'okwu τοῦ κυρίου
  choice: Onyenwe anyị
  alternative: Nna ukwu
  rationale: N'ebe a, κύριος na-ezo aka n'usoro Luke–Ọrụ Ndịozi nye Jizọs dị ka Onyenwe; “Onyenwe anyị” na-edobe utu aha ahụ n'enweghị itinye nkọwa otu ụka pụrụ iche.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A hapụrụ ihe atụ nke “ikupụta” iji chekwaa ike na ndụ dị n'okwu Grik, ebe e mere usoro participle ikpeazụ ka ọ bụrụ ahịrịokwu zuru oke n'Igbo.
