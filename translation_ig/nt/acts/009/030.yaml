source:
  edition: SBLGNT
  text: ἐπιγνόντες δὲ οἱ ἀδελφοὶ κατήγαγον αὐτὸν εἰς Καισάρειαν καὶ ἐξαπέστειλαν αὐτὸν εἰς Ταρσόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/030.yaml
  text: When the brothers learned this[a], they brought him down to Caesarea and sent him off to Tarsus.
translation:
  language: ig
  text: Mgbe ụmụnna matara nke a[a], ha kpọdara ya gaa Sesaria, zipụkwa ya gaa Tasọs.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, ‘ụmụnna nwoke na nwanyị.’ Okwu Grik ahụ pụtara ‘ụmụnna nwoke,’ ma n’ebe a ọ pụrụ izo aka n’ọgbakọ ndị kwere ekwe n’ozuzu ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιγνόντες
  choice: mgbe … matara nke a
  rationale: Ụdị ngwaa a na-egosi ọnọdụ kpaliri ihe ndị sochirinụ. E kwughị ihe ha matara kpọmkwem n’amaokwu a, ma ọ na-ezo aka n’ihe e kwuru n’amaokwu bu ya ụzọ; ya mere, ‘nke a’ na-eme ka Igbo doo anya n’enweghị ịgbakwunye nkọwa ọhụrụ.
- source_word: οἱ ἀδελφοὶ
  choice: ụmụnna
  rationale: ‘Ụmụnna’ bụ okwu Igbo dị mfe ma dị ùgwù maka ndị e jikọrọ dịka ụmụnne, a na-ejikwa ya n’etiti ndị kwere ekwe. O nwere ike ịgụnye ọgbakọ ndị kwere ekwe n’ozuzu ya; e debere nghọta ahụ n’okpuru peeji.
- source_word: κατήγαγον
  choice: kpọdara ya gaa
  rationale: ‘Kpọdara’ na-echekwa echiche nke iduga mmadụ gbadaa, nke kwekọrọ na njem ahụ ruo n’akụkụ osimiri, karịa naanị ‘kpọgara.’
- source_word: Καισάρειαν
  choice: Sesaria
  rationale: Nke a bụ nsụgharị ụda aha obodo ahụ n’ụdị dị mfe ma kwekọọ n’usoro mkpụrụokwu Igbo.
- source_word: ἐξαπέστειλαν
  choice: zipụkwa ya gaa
  rationale: ‘Zipụ’ na-egosi na ha mere ka ọ pụọ gaa ebe ọzọ; ‘-kwa’ na-ejikọta omume a na nke bu ya ụzọ n’ụzọ Igbo na-asụkarị.
- source_word: Ταρσόν
  choice: Tasọs
  rationale: Nke a bụ nsụgharị ụda aha obodo ahụ n’ụdị kwekọrọ na mkpọpụta na usoro mkpụrụokwu Igbo.
theological_decisions:
- issue: Ma οἱ ἀδελφοὶ na-ezo naanị aka n’ụmụ nwoke ka ọ bụ n’ọgbakọ ndị kwere ekwe n’ozuzu ya
  choice: ụmụnna
  alternative: ụmụnna nwoke na nwanyị; ndị kwere ekwe ibe ha
  rationale: E debere okwu ezinụlọ nke Greek n’isiokwu kama iji nkọwa dochie ya. N’Igbo, ‘ụmụnna’ nwere ike ịpụta ndị e jikọrọ dịka ụmụnne ma nwee ohere ịgụnye obodo ndị kwere ekwe; ihe odide ala peeji na-eme ka nghọta abụọ ahụ pụta ìhè n’enweghị idozi ihe isi mmalite hapụrụ ka ọ nwee obosara.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe ma dị ùgwù. Ahịrịokwu ahụ na-agbaso usoro akụkọ Igbo nke ọma, ma okwu ‘kpọdara’ na-echekwa ntụziaka mgbada dị n’asụsụ Grik.
