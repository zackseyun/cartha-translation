id: ACT.9.34
reference: Acts 9:34
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτῷ ὁ Πέτρος· Αἰνέα, ἰᾶταί σε Ἰησοῦς ⸀Χριστός· ἀνάστηθι καὶ στρῶσον σεαυτῷ· καὶ εὐθέως ἀνέστη.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/034.yaml
  text: And Peter said to him[a], “Aeneas, Jesus the Messiah heals you[b]. Get up and make your bed.” And immediately he got up.
translation:
  language: ig
  text: Pita wee sị ya, “Ainias, Jizọs, bụ Mesaya, na-agwọ gị.[a] Bilie, gbasara onwe gị ihe ndina.”[b] O wee bilie ozugbo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “Jizọs Kraịst na-agwọ gị.” Okwu Grik Χριστός bụ utu aha nke pụtara “Mesaya.”
    reason: alternative_reading
  - marker: b
    text: 'N’ụzọ nkịtị: “gbasara onwe gị ihe ndina.”'
    reason: translation_clarity
lexical_decisions:
- source_word: ἰᾶταί
  choice: na-agwọ gị
  rationale: Okwu Grik a dị n’ụdị ugbu a. “Na-agwọ gị” na-egosipụta nkwupụta Pita na Jizọs bụ onye na-eme ọgwụgwọ ahụ, n’agbanyeghị na ihe a na-emezu ozugbo.
- source_word: Χριστός
  choice: Mesaya
  rationale: N’ebe a, Χριστός bụ utu aha e nyere Jizọs, ọ bụghị aha ezinụlọ; “Mesaya” na-echekwa ihe utu aha ahụ pụtara.
- source_word: ἀνάστηθι
  choice: Bilie
  rationale: Nke a bụ iwu ka nwoke ahụ nọ n’ihe ndina bilie; “Bilie” bụ okwu Igbo doro anya ma kwekọọkwa n’omume e kwuru na njedebe amaokwu ahụ.
- source_word: στρῶσον σεαυτῷ
  choice: doziere onwe gị ihe ndina gị
  rationale: “Dozie ihe ndina” na-enye echiche nke ịgbasa ma ọ bụ ịkwadebe ihe a na-edina, ebe “onwe gị” na-echekwa nrụtụ aka nke σεαυτῷ n’ike nwoke ahụ e weghachiri.
- source_word: εὐθέως
  choice: ozugbo
  rationale: “Ozugbo” bụ okwu Igbo nkịtị nke na-egosi na ọ dịghị oge gafere tupu o bilie.
- source_word: ἀνέστη
  choice: o wee bilie
  rationale: Nke a na-akọ mmezu iwu ahụ, ma “bilie” na-ejikọta ya n'ụzọ doro anya na iwu “Bilie.”
- source_word: Αἰνέα
  choice: Ainias
  rationale: A sụgharịrị aha onye ahụ n’ụda dabara n’usoro mkpọpụta na odide Igbo.
theological_decisions:
- issue: Nsụgharị Χριστός n’okwu nkwupụta ọgwụgwọ a
  choice: Jizọs bụ Mesaya
  alternative: Jizọs Kraịst
  rationale: “Mesaya” na-eme ka o doo anya na Χριστός bụ utu aha, ma ọ naghị etinye nkọwa ụka pụrụ iche n’amaokwu ahụ.
- issue: Oge ọgwụgwọ ahụ n’okwu ἰᾶταί
  choice: na-agwọ gị
  alternative: agwọọla gị
  rationale: Edebere ụdị ugbu a nke Grik kama ịgbanwe ya ka ọ bụrụ nkwupụta na ọgwụgwọ ahụ emechaala; ihe na-esote na-egosi na ọgwụgwọ ahụ rụpụtara ozugbo.
translation_notes:
  register: Ejiri Igbo Izugbe dị ugbu a, dị ùgwù ma dị mfe nghọta. “Wee” na-ejikọta akụkọ ahụ n’ụzọ e ji akọ akụkọ n’Igbo, ebe okwu iwu na nzaghachi ya dị mkpirikpi iji chekwaa ngwa ngwa dị n’amaokwu ahụ.
