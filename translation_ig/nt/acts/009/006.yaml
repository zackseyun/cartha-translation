  text: ἀλλὰ ἀνάστηθι καὶ εἴσελθε εἰς τὴν πόλιν, καὶ λαληθήσεταί σοι ⸂ὅ τί⸃ σε δεῖ ποιεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/006.yaml
  text: But get up and enter the city[a], and you will be told what you must do.
translation:
  language: ig
  text: Ma bilie, banye n’obodo ahụ[a], a ga-agwa gị ihe ị ga-emerịrị.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n’ụzọ nkịtị, “a ga-ekwuọrọ gị ihe dị mkpa ka i mee.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Ma
  rationale: Ọ na-egosi ntụgharị site n’ajụjụ Sọl gaa n’iwu e nyere ya; “Ma” bụ ụzọ dị mkpirikpi ma bụrụkwa nke e ji eme ihe n’Igbo.
- source_word: ἀνάστηθι
  choice: bilie
  rationale: Iwu a gwara otu onye ka o si n’ala bilie; “bilie” bụ okwu Igbo doro anya ma kwekọọ n’ọnọdụ ahụ.
- source_word: εἴσελθε εἰς τὴν πόλιν
  choice: banye n’obodo ahụ
  rationale: “Banye” na-egosipụta ịbanye n’ime ebe, ebe “obodo ahụ” na-edobe nrụtụ aka doro anya nke τὴν πόλιν.
- source_word: λαληθήσεταί σοι
  choice: a ga-agwakwa gị
  rationale: Nrụpụta a na-edobe olu nnabata nke Grik n’enyeghị onye ga-ekwu okwu aha, ma na-ada nke ọma n’Igbo.
- source_word: ὅ τί
  choice: ihe
  rationale: N’usoro Igbo a, “ihe” na-ebute ọdịnaya a ga-agwa Sọl n’ụzọ ebumpụta ụwa.
- source_word: σε δεῖ ποιεῖν
  choice: ị ga-emerịrị
  rationale: “Ga-emerịrị” na-egosipụta mkpa na ọrụ dị ike nke δεῖ, ọ bụghị naanị ihe mmadụ nwere ike ịhọrọ ime.
theological_decisions:
- issue: Ike δεῖ n’ọnọdụ nduzi sitere n’aka Chineke
  choice: ị ga-emerịrị
  alternative: ihe dị mkpa ka i mee
  rationale: Nhọrọ a na-edobe ike nke mkpa ma ọ bụ ọrụ dị na δεῖ, ma ọ naghị akọwapụta karịa ihe odide ahụ onye mere ka ọ bụrụ ihe dị mkpa.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke dị ugbu a, dị ugwu ma dị mfe nghọta. E debere ahịrịokwu ahụ nkenke dịka iwu dị n’isi mmalite, ma chekwaa na onye ga-agwa Sọl ihe ahụ ekwughị aha.
