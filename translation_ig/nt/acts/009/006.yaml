review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders the imperatives, destination, future passive communication, and the necessity expressed by δεῖ. However, the enclitic -kwa in “a ga-agwakwa gị” adds ‘also’/‘too,’ which is not expressed by καί here; the conjunction simply joins the commands and the following assurance.
  naturalness: “Ma bilie, banye n’obodo ahụ, a ga-agwa gị ihe ị ga-emerịrị” is clear, idiomatic Standard Igbo, and retains the concise, dignified register. The impersonal passive construction naturally represents the Greek future passive without supplying a speaker.
  terminology: “Bilie,” “banye,” “obodo ahụ,” and “ị ga-emerịrị” are appropriate Standard Igbo choices. “Ị ga-emerịrị” preserves the strong necessity of δεῖ without identifying a theological source for that necessity.
  issues:
  - severity: low
    issue: The word “agwakwa” adds an unexpressed additive sense.
    rationale: The suffix -kwa ordinarily conveys ‘also/too.’ Greek καί here is adequately represented by the clause sequence and does not require an additive particle in the passive clause.
  - severity: low
    issue: The English audit-trail footnote anchor and its lexical-alternative note are absent.
    rationale: Retaining the [a] anchor and a localized note preserves the supplied POB audit trail while distinguishing the more literal passive expression from the idiomatic main text.
