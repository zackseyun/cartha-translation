  text: Ἐγένετο δὲ Πέτρον διερχόμενον διὰ πάντων κατελθεῖν καὶ πρὸς τοὺς ἁγίους τοὺς κατοικοῦντας Λύδδα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/032.yaml
  text: As Peter was passing through all of them, he also went down to the saints living in Lydda.
translation:
  language: ig
  text: O wee bụrụ na, mgbe Pita na-agagharị n’etiti ha niile, ọ gbadakwara gakwuru ndị nsọ bi na Lida.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διερχόμενον διὰ πάντων
  choice: na-agagharị n’etiti ha niile
  rationale: Okwu a na-egosi na Pita na-agafe n’etiti mmadụ ma ọ bụ ìgwè ndị e kwuru okwu ha na gburugburu akụkọ ahụ; nsụgharị a na-edobe nnọchiaha ahụ n’enweghị ịkọwapụta ihe Grik ekwughị kpọmkwem.
- source_word: κατελθεῖν καὶ πρὸς
  choice: ọ gbadakwara gaa hụ
  rationale: κατελθεῖν pụtara ịgbada ma ọ bụ ịga ebe ahụ; πρὸς τοὺς ἁγίους na-egosi ịgakwuru ha. “Gaa hụ” bụ ụzọ Igbo si ekwu nke ọma na ọ gara leta ha, ebe “gbadakwara” na-edobe ntụziaka dị na isi mmalite.
- source_word: τοὺς ἁγίους
  choice: ndị nsọ
  rationale: Nke a bụ aha Agba Ọhụrụ ji akpọ ndị kwere ekwe dịka ndị e doro nye Chineke; “ndị nsọ” bụ okwu Igbo a maara nke ọma ma na-edobe ọdịdị nke okwu Grik.
- source_word: Λύδδα
  choice: Lida
  rationale: E dere aha obodo ahụ n’ụdị dabara n’ụda Igbo.
theological_decisions:
- issue: Ihe nnọchiaha πάντων na-ezo aka na ya
  choice: ha niile
  alternative: ebe niile / ndị kwere ekwe niile
  rationale: Isi mmalite hapụrụ ihe πάντων na-ezo aka na ya n’ụzọ na-adịghị kpọmkwem. A hapụrụ nnọchiaha ahụ ka nsụgharị ghara ịgbakwunye nkọwa nke ederede ekwughị.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị mfe ma dị ùgwù. A naghị etinye “Ugbu a” n’isi amaokwu, n’ihi na δέ ebe a bụ njikọ akụkọ, ọ bụghị okwu oge pụtara ‘now’.
