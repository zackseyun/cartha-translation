- from: Mgbe Pita na-agagharị n’etiti ha niile, ọ gbadakwara gaa hụ ndị nsọ bi na Lida.
  to: O wee bụrụ na, mgbe Pita na-agagharị n’etiti ha niile, ọ gbadakwara gakwuru ndị nsọ bi na Lida.
  rationale: The revision preserves the source ambiguity concerning πάντων, retains the descent, restores a natural equivalent for Ἐγένετο δέ, and replaces the added sense “go and see” with the source-faithful “go to.”
