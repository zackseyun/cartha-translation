source:
  edition: SBLGNT
  text: ἐγγὺς δὲ οὔσης Λύδδας τῇ Ἰόππῃ οἱ μαθηταὶ ἀκούσαντες ὅτι Πέτρος ἐστὶν ἐν αὐτῇ ἀπέστειλαν ⸂δύο ἄνδρας⸃ πρὸς αὐτὸν παρακαλοῦντες· Μὴ ⸀ὀκνήσῃς διελθεῖν ἕως ⸀ἡμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/038.yaml
  text: Since Lydda was near Joppa[a], the disciples, hearing that Peter was there, sent two men to him, urging, “Do not delay to come to us.”
translation:
  language: ig
  text: Ebe ọ bụ na Lida dị nso na Jopa, mgbe ndị na-eso ụzọ nụrụ na Pita nọ n’ebe ahụ, ha zigara ya ndị ikom abụọ ka ha rịọ ya, sị, “Egbula oge ịbịakwute anyị.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Ala azụla ịbịakwute anyị.” Ngwaa Grik ahụ nwere ike ịpụta ịla azụ ma ọ bụ igbu oge; isi ederede họọrọ ihe kacha daba n’arịrịọ a chọrọ ka e mee ngwa ngwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγγὺς δὲ οὔσης Λύδδας τῇ Ἰόππῃ
  choice: Ebe ọ bụ na Lida dị nso na Jopa
  rationale: Genitive absolute ahụ na-enye ọnọdụ ndabere nke nwekwara echiche ihe kpatara ihe sochiri ya; nsụgharị a bụ Igbo nkịtị ma doo anya.
- source_word: Λύδδας / Ἰόππῃ
  choice: Lida / Jopa
  rationale: E ji ọdịdị aha ndị a si na Grik wee dee ha n’ụzọ dabara n’usoro ụda na mkpụrụedemede Igbo.
- source_word: οἱ μαθηταί
  choice: ndị na-eso ụzọ Jizọs
  rationale: N’Igbo nke oge a, nke a na-eme ka o doo anya na μαθηταί bụ ndị na-eso ụzọ Jizọs, ọ bụghị nanị ụmụ akwụkwọ.
- source_word: ἀκούσαντες ὅτι Πέτρος ἐστὶν ἐν αὐτῇ
  choice: mgbe ... nụrụ na Pita nọ n’ebe ahụ
  rationale: Aorist participle ahụ bụ ọnọdụ mere tupu iziga ndị ikom ahụ; ‘n’ebe ahụ’ na-ezo aka na Lida n’ụzọ Igbo si ekwu ya.
- source_word: ἀπέστειλαν δύο ἄνδρας πρὸς αὐτόν
  choice: ha zigara ya ndị ikom abụọ
  rationale: Nke a na-edobe ngwaa, ndị e zigara, na onye a zigara ha n’ụzọ doro anya ma dịkwa eke n’Igbo.
- source_word: παρακαλοῦντες
  choice: ka ha rịọ ya
  rationale: N’ebe a okwu ahụ pụtara arịrịọ siri ike; ‘rịọ’ na-egosipụta ya n’enweghị ime ka mmetụta ahụ sie ike karịa ihe Grik kwuru.
- source_word: Μὴ ὀκνήσῃς διελθεῖν ἕως ἡμῶν
  choice: Egbula oge ịbịakwute anyị
  rationale: ὀκνέω nwere ike ịpụta igbu oge ma ọ bụ ịla azụ n’obi. N’arịrịọ njem a, ‘Egbula oge’ dabara nke ọma, ebe ‘ịbịakwute anyị’ na-egosipụta njem ahụ site n’echiche ndị na-arịọ ya.
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. A kọwara ‘ndị na-eso ụzọ’ dịka ‘ndị na-eso ụzọ Jizọs’ iji gbochie nghọtahie n’Igbo. Akara ntụaka [a] dị n’isi ederede ma kwekọọ na nkọwa ala peeji.
