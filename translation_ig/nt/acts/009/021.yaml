  source_fidelity: A na-echekwa ajụjụ nkwenye abụọ ahụ, ‘aha a,’ na ebumnuche nke iweta ndị ahụ e kekọtara n’aka ndị isi nchụàjà. Otú ọ dị, ‘n’agbụ’ na-akọwapụta δέω karịa ihe Grik kwuru, ebe ọ pụrụ ịpụta naanị ịbụ ndị e kere eke; ‘gaa n’ihu’ na-agbakwụnye echiche ikpé nke ἐπί πρὸς τοὺς ἀρχιερεῖς anaghị ekwupụta n’ụzọ doro anya. ‘N’ụzọ dị egwu’ bụkwa mgbakwunye na-adịghị mkpa iji gosi ike πορθέω.
