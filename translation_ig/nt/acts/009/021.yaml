id: ACT.9.21
reference: Acts 9:21
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐξίσταντο δὲ πάντες οἱ ἀκούοντες καὶ ἔλεγον· Οὐχ οὗτός ἐστιν ὁ πορθήσας ⸀ἐν Ἰερουσαλὴμ τοὺς ἐπικαλουμένους τὸ ὄνομα τοῦτο, καὶ ὧδε εἰς τοῦτο ἐληλύθει ἵνα δεδεμένους αὐτοὺς ἀγάγῃ ἐπὶ τοὺς ἀρχιερεῖς;
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/021.yaml
  text: And all who heard him were amazed and were saying[a], “Isn’t this the man who devastated in Jerusalem those who call on this name? And had he not come here for this purpose[b], that he might bring them bound to the chief priests?”
translation:
  language: ig
  text: Ndị niile nụrụ ya juru anya, na-ekwu sị, “Ọ bụghị nwoke a bụ onye kpagburu nke ukwuu ndị na-akpọku aha a[a] na Jerusalem? Ọ bụghịkwa maka nke a ka ọ bịara ebe a—ka o wee kpọga ha, bụ ndị e kekọtara, n’aka ndị isi nchụàjà?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “ndị na-arịọ enyemaka site n’aha a.” Okwu “na-akpọku aha a” na-echekwa akpaalaokwu Akwụkwọ Nsọ nke ịrịọ enyemaka ma ọ bụ ikwupụta okwukwe n’aha Jizọs.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξίσταντο
  choice: juru anya
  rationale: Ọ na-egosi na ndị na-ege ntị nọgidere n'ọnọdụ oke ihe ijuanya; okwu a bụ Igbo nkịtị ma doo anya.
- source_word: πάντες οἱ ἀκούοντες
  choice: Ndị niile nụrụ okwu ya
  rationale: E tinyere ihe a na-anụ, ya bụ okwu Sọl, ka ahịrịokwu ahụ bụrụ Igbo eke, ebe ihe gbara ya gburugburu na-eme ka onye a na-ekwu maka ya doo anya.
- source_word: πορθήσας
  choice: kpagburu ... n'ụzọ dị egwu
  rationale: Ngwaa Grik a siri ike karịa nanị ‘kpagburu’; mgbakwunye ‘n'ụzọ dị egwu’ na-egosi mbibi na ime ihe ike ya n'Igbo eke n'ebughị nkọwa ọhụrụ bata.
- source_word: ἐν Ἰερουσαλήμ
  choice: na Jerusalem
  rationale: Ntụgharị ebe kpọmkwem.
- source_word: τοὺς ἐπικαλουμένους τὸ ὄνομα τοῦτο
  choice: ndị na-akpọku aha a
  rationale: ‘Na-akpọku’ na-echekwa akpaalaokwu Akwụkwọ Nsọ nke ịrịọ enyemaka na ikwupụta ntụkwasị obi n'aha ahụ.
- source_word: τὸ ὄνομα τοῦτο
  choice: aha a
  rationale: E chekwara ngosipụta Grik ahụ kama ịkọwapụta ya dịka ‘aha Jizọs’; ihe gbara ya gburugburu na-egosi onye a na-ekwu maka ya.
- source_word: εἰς τοῦτο
  choice: maka nke a
  rationale: Ọ bụ ụzọ Igbo dị nkenke ma bụrụ eke isi gosi ebumnuche.
- source_word: ἐληλύθει
  choice: ọ bịara
  rationale: N'Igbo, oge na ọnọdụ ahịrịokwu ahụ na-egosi na ọbịbịa ahụ eburu ụzọ mee; ịmanye usoro pluperfect pụrụ ime ka okwu ghara ịdị eke.
- source_word: δεδεμένους
  choice: n'agbụ
  rationale: Ọ na-egosi ọnọdụ ịbụ onye e kere agbụ; n'ọnọdụ a ọ bụ okwu Igbo eke maka ndị mkpọrọ, n'agbanyeghị na Grik ekwughị kpọmkwem ụdị ihe e ji kee ha.
- source_word: ἀγάγῃ ἐπὶ τοὺς ἀρχιερεῖς
  choice: kpụrụ ha ... gaa n'ihu ndị isi nchụàjà
  rationale: ‘Kpụụrụ’ na-egosi iduga ma ọ bụ iweta ha, ‘gaa n'ihu’ na-echekwa echiche nke iweta ha n'ihu ndị ọchịchị maka ikpe.
- source_word: ἀρχιερεῖς
  choice: ndị isi nchụàjà
  rationale: Nke a na-ezo aka n'òtù ndị ọchịchị nchụàjà, ọ bụghị ọtụtụ ndị isi nchụàjà kacha elu nọ n'ọkwa otu oge.
theological_decisions:
- issue: Ma a ga-akọwapụta ‘aha a’ dịka ‘aha Jizọs’
  choice: E debere ‘aha a’
  alternative: aha Jizọs
  rationale: Grik hapụrụ onye nwe aha ahụ ka ihe gbara okwu ahụ gburugburu gosi ya; nke a na-echekwa ike nkwanye ùgwù na ajụjụ ahụ.
- issue: Ike okwu πορθήσας banyere ihe Sọl mere ndị kwere ekwe
  choice: kpagburu ... n'ụzọ dị egwu
  alternative: bibiri; kpagburu
  rationale: Nke a anaghị eme ka ime ihe ike dị n'ngwaa Grik ahụ dị nro, ma ọ naghịkwa ekwu na Sọl gburu ma ọ bụ kpochapụ ha niile.
- issue: Ụdị okwu ajụjụ nke akụkụ nke abụọ
  choice: Ọ bụghịkwa maka nke a ka ọ bịara ebe a—ka o wee...?”
  alternative: Ọ bịara ebe a maka nke a—ka o wee...
  rationale: Ọdịdị Grik na-aga n'ihu n'ajụjụ nkwenye malitere na Οὐχ; Igbo a na-echekwa ajụjụ ahụ na ihe ndị na-ekwu okwu tụrụ anya ka a kweta.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A hapụrụ ‘aha a’ n'ahịrị isi ka ọ dị na Grik. Akara [a] dị n'ahịrị isi ma kwekọọ na nkọwa ala peeji. E ji akara ogologo—kewaa nkọwa ebumnuche n'ụzọ a na-agụ nke ọma.
