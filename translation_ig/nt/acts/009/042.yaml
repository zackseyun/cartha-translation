id: ACT.9.42
reference: Acts 9:42
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: γνωστὸν δὲ ἐγένετο καθ’ ὅλης ⸀τῆς Ἰόππης, καὶ ⸂ἐπίστευσαν πολλοὶ⸃ ἐπὶ τὸν κύριον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/042.yaml
  text: And it became known throughout all Joppa, and many believed in the Lord.
translation:
  language: ig
  text: A bịara mara ya n’obodo Jọpa dum, ọtụtụ mmadụ wee kwere na Onyenweanyị.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γνωστὸν ... ἐγένετο
  choice: ọ wee bụrụ ihe a maara
  rationale: Nke a na-egosipụta owuwu na-enweghị onye a kpọrọ aha dị ka onye mere ka a mara ya, ma na-echekwa echiche nke ihe ahụ ịghọ ihe a maara.
- source_word: δὲ
  choice: O wee
  rationale: N’ebe a, δέ bụ njikọ dị nro nke na-aga n’ihu n’akụkọ; “wee” bụ ụzọ Igbo si ejikọta ihe omume n’usoro n’enweghị igosi nnukwu mmegide.
- source_word: καθ’ ὅλης τῆς Ἰόππης
  choice: n’obodo Jọpa niile
  rationale: Nke a na-enye echiche nke ihe ahụ gbasara ebe niile n’ime Jọpa, ma na-ada nke ọma n’Igbo ugbu a.
- source_word: Ἰόππης
  choice: Jọpa
  rationale: A sụgharịghị aha ebe ahụ; e dere ya dịka ụda ya si kwekọọ n’usoro odide Igbo.
- source_word: ἐπίστευσαν
  choice: kwere
  rationale: “Kwere” bụ okwu Igbo dị mfe ma bụrụkwa nke a na-ejikarị akọwa omume nke ikwere; aorist ahụ na-akọ ihe mere n’akụkọ.
- source_word: πολλοὶ
  choice: ọtụtụ mmadụ
  rationale: Ịtinye “mmadụ” na-eme ka adjective e ji dịka noun doo anya ma bụrụ Igbo eke, n’agbanyeghị na okwu Grik ahụ n’onwe ya pụtara naanị “ọtụtụ.”
- source_word: ἐπὶ τὸν κύριον
  choice: na Onyenwe anyị
  rationale: Mgbe “kwere” so “na,” ọ na-egosi onye a tụkwasịrị obi n’Igbo nke oge a, na-enweghị itinye nkọwa ozizi karịrị isi mmalite.
- source_word: κύριον
  choice: Onyenwe anyị
  rationale: Nke a bụ ntụgharị Igbo a na-ahụkarị maka κύριος dịka aha nsọpụrụ nke Jizọs, ma na-echekwa ịdị arọ ya n’ihe gbasara Kraịst.
theological_decisions:
- issue: Nsụgharị πιστεύω + ἐπί τὸν κύριον
  choice: kwere na Onyenwe anyị
  alternative: tụkwasịrị Onyenwe anyị obi
  rationale: “Kwere na Onyenwe anyị” na-echekwa okwu isi mmalite nke ikwere n’Onyenwe anyị ma ghara ime ka nkọwa ahụ bụrụ naanị otu ụdị nkọwa ozizi. Nhọrọ nke “tụkwasịrị ... obi” ga-eme ka akụkụ ntụkwasị obi pụta ìhè karịa, ma ọ bụkwa nkọwa sara mbara karị.
- issue: Nsụgharị κύριος
  choice: Onyenwe anyị
  alternative: Nna Ukwu
  rationale: “Onyenwe anyị” na-echekwa aha nsọpụrụ na ịdị arọ gbasara Kraịst nke κύριος nwere n’Ọrụ Ndị Ozi; “Nna Ukwu” adịghị egosipụta ojiji a nke ọma.
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe nke oge a, dị mfe ma dị ùgwù. E ji usoro “wee” mee ka akụkọ na-aga n’ihu n’ụzọ Igbo eke. Enweghị akara nkọwa ala peeji n’ihi na amaokwu a achọghị nkọwa ọzọ iji chekwaa mgbagwoju anya ma ọ bụ ọdịiche ederede dị mkpa.
