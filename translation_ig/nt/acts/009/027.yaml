id: ACT.9.27
reference: Acts 9:27
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Βαρναβᾶς δὲ ἐπιλαβόμενος αὐτὸν ἤγαγεν πρὸς τοὺς ἀποστόλους, καὶ διηγήσατο αὐτοῖς πῶς ἐν τῇ ὁδῷ εἶδεν τὸν κύριον καὶ ὅτι ἐλάλησεν αὐτῷ καὶ πῶς ἐν Δαμασκῷ ἐπαρρησιάσατο ἐν τῷ ὀνόματι ⸀τοῦ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/027.yaml
  text: But Barnabas took hold of him and brought him to the apostles, and told them how on the road he had seen the Lord, and that he had spoken to him, and how in Damascus he had spoken boldly in the name of Jesus.
translation:
  language: ig
  text: Ma Banabas jidere ya kpọga ya n’ebe ndịozi nọ, kọọrọ ha otú o si hụ Onyenwe anyị n’ụzọ, na Onyenwe anyị gwara ya okwu, nakwa otú o si kwuo okwu n’atụghị egwu na Damaskọs n’aha Jizọs.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιλαβόμενος
  choice: jidere ya
  rationale: Ọ na-echekwa echiche bụ ‘ijide’ ma n’ọnọdụ a na-egosi enyemaka Banabas nyere Sọl, ọ bụghị ijide ya n’ike dị ka onye iro.
- source_word: ἤγαγεν πρὸς τοὺς ἀποστόλους
  choice: kpọga ya n’ebe ndịozi nọ
  rationale: Nke a bụ ụzọ Igbo dị mfe ma doo anya isi kwuo na Banabas duuru ma kpọrọ Sọl gaa hụ ndịozi.
- source_word: διηγήσατο
  choice: kọọrọ ha
  rationale: Ngwaa a pụtara ịkọwa ma ọ bụ ịkọ ihe mere; ‘kọọrọ ha’ bụ Igbo nkịtị nke na-eburu nkọwa ahụ.
- source_word: πῶς ἐν τῇ ὁδῷ
  choice: otú o si ... n’ụzọ
  rationale: ‘N’ụzọ’ na-ezo aka n’ụzọ njem Damaskọs, ọ bụghị aha e ji mara ndị otu Kraịst.
- source_word: εἶδεν τὸν κύριον
  choice: o si hụ Onyenwe anyị
  rationale: ‘Hụ’ na-anọchi aorist ahụ n’ụzọ eke n’Igbo; ‘Onyenwe anyị’ na-echekwa aha nsọ κύριος na ihe ọ pụtara banyere Jizọs onye biliri n’ọnwụ.
- source_word: ὅτι ἐλάλησεν αὐτῷ
  choice: na otú Onyenwe anyị si gwa ya okwu
  rationale: Ikwughachi ‘Onyenwe anyị’ na-eme ka onye kwuru okwu doo anya n’Igbo, ebe nnọchiaha Grik nwere ike ịdịtụ mgbagwoju anya mgbe a sụgharịrị ya kpọmkwem.
- source_word: ἐπαρρησιάσατο
  choice: o si jiri nkwuwa okwu kwuo okwu
  rationale: Nke a na-echekwa echiche ikwu okwu n’atụghị egwu ma ọ bụ n’ezoghị ọnụ, n’etinyeghị okwu kpọmkwem dịka ‘kwusaa ozi ọma’ nke ngwaa ahụ n’onwe ya ekwughị.
- source_word: ἐν τῷ ὀνόματι τοῦ Ἰησοῦ
  choice: n’aha Jizọs
  rationale: Ọ na-echekwa akpaalaokwu Akwụkwọ Nsọ nke na-egosi ikwu okwu n’ike, ikike, na njikọ ya na Jizọs.
- source_word: Ἰησοῦ
  choice: Jizọs
  rationale: Nke a bụ nsụgharị aha Jesus a na-ejikarị eme ihe n’Igbo Standard.
theological_decisions:
- issue: Onye ‘Onyenwe anyị’ na-ezo aka na ya n’ihe mere n’ụzọ
  choice: ‘Onyenwe anyị’ na-ezo aka na Jizọs
  alternative: Iwere ya dị ka aha Chineke n’ozuzu ya n’akọwaghị kpọmkwem na ọ bụ Jizọs
  rationale: Ihe ndị gbara amaokwu a gburugburu n’Ọrụ Ndịozi 9 na-akọ na onye Sọl zutere bụ Jizọs onye biliri n’ọnwụ; njedebe amaokwu ahụ, ‘n’aha Jizọs,’ na-akwado njikọ ahụ. Otú ọ dị, a ka chekwara utu aha κύριος dịka ‘Onyenwe anyị.’
translation_notes:
  register: E jiri Igbo Standard nke oge a, dị ùgwù ma dị mfe nghọta. Nhazi ‘kpọga ya n’ebe ndịozi nọ’ na ‘jiri nkwuwa okwu kwuo okwu’ na-ada eke n’Igbo ma na-anọgide nso n’ihe Grik kwuru. Enweghị akara nkọwa ala peeji n’ihi na ọ dịghị ihe dị mkpa chọrọ footnote n’amaokwu a.
