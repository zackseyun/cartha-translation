revisions:
- from: Ma Banabas jidere ya, kpọga ya n’ebe ndịozi nọ, kọọrọ ha otú o si hụ Onyenwe anyị n’ụzọ, na otú Onyenwe anyị si gwa ya okwu, nakwa otú o si jiri nkwuwa okwu kwuo okwu n’aha Jizọs na Damaskọs.
  to: Ma Banabas jidere ya kpọga ya n’ebe ndịozi nọ, kọọrọ ha otú o si hụ Onyenwe anyị n’ụzọ, na Onyenwe anyị gwara ya okwu, nakwa otú o si kwuo okwu n’atụghị egwu na Damaskọs n’aha Jizọs.
  rationale: The revision preserves the Greek clause structure, retains the established biblical terms and names, and uses idiomatic modern Standard Igbo. No textual ambiguity or variant in this verse requires a footnote.
