source:
  edition: SBLGNT
  text: ἐγένετο δὲ ἐν ταῖς ἡμέραις ἐκείναις ἀσθενήσασαν αὐτὴν ἀποθανεῖν· λούσαντες δὲ ⸂ἔθηκαν αὐτὴν⸃ ἐν ὑπερῴῳ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/037.yaml
  text: In those days it happened that she became sick and died. After washing her[a], they laid her in an upstairs room.
translation:
  language: ig
  text: N’ụbọchị ndị ahụ, o mere na ọ dara ọrịa wee nwụọ. Mgbe ha sachara ya, ha debere ya n’otu ọnụ ụlọ dị n’ala elu ụlọ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’ọnụ ụlọ elu.” Okwu Grik ahụ na-ezo naanị aka n’ọnụ ụlọ dị n’ala elu ụlọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: o mere na
  rationale: Ọ bụ usoro e ji webata ihe mere n’akụkọ; ‘o mere na’ na-edobe ọrụ ahụ n’Igbo dị ugbu a n’enweghị okwu ochie.
- source_word: ἐν ταῖς ἡμέραις ἐκείναις
  choice: N’ụbọchị ndị ahụ
  rationale: Nke a bụ ntụgharị doro anya ma bụrụkwa ụzọ Igbo nkịtị si egosi oge ahụ.
- source_word: ἀσθενήσασαν
  choice: ọ dara ọrịa
  rationale: N’ebe a, okwu ahụ na-egosi na ọrịa jidere ya tupu ọ nwụọ; ‘dara ọrịa’ bụ okwu Igbo doro anya.
- source_word: ἀποθανεῖν
  choice: wee nwụọ
  rationale: Njikọ ‘wee’ na-egosi na ọnwụ sochiri ọrịa ahụ, ma na-eme ka ahịrịokwu ahụ bụrụ Igbo ebumpụta ụwa.
- source_word: λούσαντες
  choice: Mgbe ha sachara ya
  rationale: Aorist participle ahụ na-egosi ihe e mere tupu ha edowe ya; n’ọnọdụ a, ọ bụ ịsa ahụ ya mgbe ọ nwụsịrị.
- source_word: ἔθηκαν αὐτὴν
  choice: ha tọgbọrọ ya
  rationale: ‘Tọgbọrọ’ dabara n’ịdọba ozu n’ebe ọ ga-anọ karịa okwu sara mbara dịka ‘tinyere.’
- source_word: ἐν ὑπερῴῳ
  choice: n’otu ọnụ ụlọ dị n’ala elu ụlọ
  rationale: ὑπερῷον na-ezo aka n’ọnụ ụlọ dị n’akụkụ elu nke ụlọ; ntụgharị a doro anya ma ghara ime ka onye na-agụ ya chee na ọ bụ otu ọnụ ụlọ ama ama kpọmkwem.
theological_decisions:
- issue: Ma a ga-asụgharị ὑπερῴῳ dịka ọnụ ụlọ elu a maara kpọmkwem, ka ọ bụ dịka nkọwa ebe ọnụ ụlọ ahụ dị
  choice: n’otu ọnụ ụlọ dị n’ala elu ụlọ
  alternative: n’ọnụ ụlọ elu
  rationale: Okwu Grik ahụ enweghị akara na-egosi otu ọnụ ụlọ a maara kpọmkwem; ọ na-egosi naanị ọnụ ụlọ dị n’ala elu. Ya mere, ntụgharị a na-edobe nkọwa sara mbara nke isi mmalite ahụ.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. A hapụrụ δὲ ka usoro akụkọ na njikọ ahịrịokwu gosipụta ya, kama itinye okwu ntụgharị siri ike na-adịghị mkpa. E debere akara nkọwa ụkwụ [a] n’ebe ọ metụtara ὑπερῴῳ.
