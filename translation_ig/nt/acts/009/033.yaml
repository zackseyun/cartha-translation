- from: N'ebe ahụ, ọ hụrụ otu nwoke aha ya bụ Ainias. Nwoke ahụ anọọla n'àkwà ọrịa afọ asatọ[a], ahụ ya kpọnwụkwara akpọnwụ.
  to: N'ebe ahụ, ọ hụrụ otu nwoke aha ya bụ Ainias, onye dinaworo n'elu àkwà nta kemgbe afọ asatọ ma kpọnwụrụ akpọnwụ[a].
  rationale: The revision replaces the interpretive “àkwà ọrịa” with “àkwà nta,” which more directly represents κράβαττος without adding a sickbed association. It also expresses the continuing posture and eight-year extent with “dinaworo ... kemgbe afọ asatọ,” while preserving the separate assertion that Ainias was paralyzed. The footnote is updated to give the remaining principal lexical alternative.
