  text: εὗρεν δὲ ἐκεῖ ἄνθρωπόν τινα ⸂ὀνόματι Αἰνέαν⸃ ἐξ ἐτῶν ὀκτὼ κατακείμενον ἐπὶ ⸀κραβάττου, ὃς ἦν παραλελυμένος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/033.yaml
  text: And there he found a certain man named Aeneas[a], bedridden for eight years, who was paralyzed.
translation:
  language: ig
  text: N'ebe ahụ, ọ hụrụ otu nwoke aha ya bụ Ainias, onye dinaworo n'elu àkwà nta kemgbe afọ asatọ ma kpọnwụrụ akpọnwụ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ute.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εὗρεν δὲ ἐκεῖ
  choice: N'ebe ahụ, ọ hụrụ
  rationale: A sụgharịrị njikọ akụkọ δέ n'ụzọ dị mfe site n'usoro ahịrịokwu Igbo; “n'ebe ahụ” na-egosi ἐκεῖ, “ọ hụrụ” na-egosikwa εὗρεν n'ụzọ doro anya.
- source_word: ἄνθρωπόν τινα
  choice: otu nwoke
  rationale: “Otu nwoke” bụ ụzọ Igbo dị mma isi webata onye a kpọtụbeghị aha, ma na-echekwa ọrụ τις n'akụkọ ahụ.
- source_word: ὀνόματι Αἰνέαν
  choice: aha ya bụ Ainias
  rationale: Nke a bụ usoro Igbo ebumpụta ụwa maka ịkpọ aha mmadụ; “Ainias” bụ ntụgharị mkpụrụokwu aha Grik Αἰνέας.
- source_word: ἐξ ἐτῶν ὀκτὼ κατακείμενον ἐπὶ κραβάττου
  choice: anọọla n'àkwà ọrịa afọ asatọ
  rationale: Nkebi a na-egosi na ọ nọgidere dina n'ihi ọrịa ruo afọ asatọ. “Àkwà ọrịa” na-ekwupụta ọnọdụ ahụ n'Igbo doro anya, ebe nkọwa ala peeji na-echekwa ihe oyiyi ute ma ọ bụ àkwà nta dị na κράβαττος.
- source_word: ὃς ἦν παραλελυμένος
  choice: ahụ ya kpọnwụkwara akpọnwụ
  rationale: Nke a bụ okwu Igbo a na-aghọta nke ọma maka ọnọdụ ahụ mkpọnwụ παραλελυμένος na-egosi, na-enweghị ịgbakwunye ihe kpatara ya.
theological_decisions: []
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E kewara nkọwa ahụ ụzọ ahịrịokwu abụọ ka ọ daa nke ọma n'Igbo, ma e chekwara usoro ozi na nkọwa niile dị n'asụsụ Grik.
