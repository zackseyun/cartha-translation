  text: And for three days he was without sight[a], and he neither ate nor drank.
translation:
  language: ig
  text: Ọ nọrọ ụbọchị atọ na-adịghị ahụ ụzọ[a], ọ righị ihe ọ bụla, ọ ṅụghịkwa ihe ọ bụla.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n’ụzọ nkịtị karị, “na-adịghị ahụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν ἡμέρας τρεῖς
  choice: Ọ nọrọ ụbọchị atọ
  rationale: Akuzativ a na-egosi ogologo oge; ‘ụbọchị atọ’ na ‘nọrọ’ na-enye Igbo doro anya ma kwekọọ n’ọnọdụ ahụ, n’agbanyeghị na ἦν bụ n’ụzọ nkịtị ‘ọ bụ/ọ nọ.’
- source_word: μὴ βλέπων
  choice: n’enweghị ike ịhụ ụzọ
  rationale: βλέπω pụtara ‘ịhụ.’ Okwu a bụ n’ụzọ nkịtị ‘na-adịghị ahụ,’ ma nsụgharị a na-egosi na Sọl enweghị ike ịhụ ụzọ n’etinyeghị okwu siri ike karị bụ ‘kpuru ìsì’ n’amaokwu bụ isi.
- source_word: οὐκ ἔφαγεν
  choice: o righịkwa nri
  rationale: ἔφαγεν pụtara ‘rị,’ ma n’Igbo, ịgbakwunye ‘nri’ na-eme ka okwu ahụ bụrụ nke eke ma doo anya.
- source_word: οὐδὲ ἔπιεν
  choice: ọ ṅụghịkwa ihe ọṅụṅụ
  rationale: οὐδὲ jikọtara omume nke abụọ a jụrụ na nke mbụ; ‘ọ ṅụghịkwa’ na-edobe njikọ ahụ n’Igbo dị mfe nghọta.
theological_decisions: []
translation_notes:
  register: Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta. E debere nkọwa nke μὴ βλέπων n’enweghị iji ‘kpuru ìsì,’ ka a ghara ime ka okwu Grik sie ike karịa ka ọ dị.
