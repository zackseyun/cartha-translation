  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οἱ δὲ ἄνδρες οἱ συνοδεύοντες αὐτῷ εἱστήκεισαν ἐνεοί, ἀκούοντες μὲν τῆς φωνῆς μηδένα δὲ θεωροῦντες.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/007.yaml
  text: The men traveling with him stood speechless[a], hearing the voice but seeing no one.
translation:
  language: ig
  text: Ndị ikom ndị sooro ya na-eme njem guzoro, okwu atụfuola ha; ha na-anụ olu ahụ[a], ma ha ahụghị onye ọ bụla.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ụda ahụ.” Okwu Grik a nwere ike ịpụta “olu” ma ọ bụ “ụda”; tulee Ọrụ Ndị Ozi 22:9.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ ἄνδρες
  choice: Ndị ikom
  rationale: “Ndị ikom” na-asụgharị οἱ ἄνδρες n'ụzọ doro anya. A hapụrụ δέ ka njikọ dị nro nke usoro ahịrịokwu Igbo na-egosipụta, kama ịgbakwunye okwu oge dịka “ugbu a.”
- source_word: οἱ συνοδεύοντες αὐτῷ
  choice: ha na ya so na-eme njem
  rationale: Nke a na-egosipụta na ndị ahụ so ya na-aga njem, ọ bụghị nanị na ha nọ ya nso.
- source_word: εἱστήκεισαν
  choice: guzoro
  rationale: Pluperfect a nwere ike ịkọ ọnọdụ ha nọ na ya; “guzoro” bụ ụzọ Igbo dị mfe ma kwekọọ na akụkọ ahụ.
- source_word: ἐνεοί
  choice: okwu atụfuola ha
  rationale: Akpaokwu Igbo a na-egosi na ha enweghị ike ikwu okwu n’ihi ihe juru ha anya, nke kwekọrọ na ἐνεοί karịa nanị ịsị na ha gbara nkịtị.
- source_word: ἀκούοντες μὲν τῆς φωνῆς
  choice: ha na-anụ olu ahụ[a]
  rationale: φωνή nwere ike ịbụ olu mmadụ ma ọ bụ ụda. “Olu” bụ nhọrọ kacha nso n’ebe a, ebe e debere “ụda” n’ihe odide ala peeji iji ghara ikpochapụ nghọta abụọ ahụ.
- source_word: μηδένα δὲ θεωροῦντες
  choice: ma ha ahụghị onye ọ bụla
  rationale: 'Nke a na-asụgharị ọdịiche δέ na nkwupụta μηδένα n’Igbo nkịtị: ọ dịghị onye ha hụrụ.'
theological_decisions:
- issue: Ihe yiri ka ọ bụ esemokwu n’etiti Ọrụ Ndị Ozi 9:7 na 22:9 banyere ihe ndị ha na Sọl so nụrụ
  choice: Jiri “olu” n’ahịrị bụ isi, ma gosi “ụda” dịka nghọta ọzọ n’ihe odide ala peeji.
  alternative: Jiri “ụda” n’ahịrị bụ isi iji mee ka ọ dị iche n’ịnụ ma ọ bụ ịghọta olu onye na-ekwu okwu.
  rationale: φωνή n’onwe ya nwere nghọta abụọ ahụ. Ide “olu” na ederede ma debe “ụda” dịka nhọrọ ọzọ na-anọgide nso na okwu Grik ma hapụkwa esemokwu dị n’etiti amaokwu abụọ ahụ ka onye na-agụ ya hụ, kama idozi ya n’amaghị ama.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Akpaokwu “okwu atụfuola ha” na-enye echiche nke enweghị ike ikwu okwu n’ihi ihe ijuanya, na-enweghị ịgbakwunye nkọwa ozizi.
