    issue: The expression “ha na ya so na-eme njem” is slightly less natural as a noun-modifying description of the accompanying men.
    rationale: Using the relative construction “ndị sooro ya na-eme njem” clearly identifies the men who were accompanying him and retains the journey sense of συνοδεύοντες.
