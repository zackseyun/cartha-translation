id: ACT.25.9
reference: Acts 25:9
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ Φῆστος δὲ ⸂θέλων τοῖς Ἰουδαίοις⸃ χάριν καταθέσθαι ἀποκριθεὶς τῷ Παύλῳ εἶπεν· Θέλεις εἰς Ἱεροσόλυμα ἀναβὰς ἐκεῖ περὶ τούτων ⸀κριθῆναι ἐπ’ ἐμοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/009.yaml
  text: But Festus[a], wanting to do the Jews a favor, answered Paul and said[c][b], “Do you want to go up to Jerusalem and there be judged before me concerning these things?”
translation:
  language: ig
  text: Ma Festọs, n’ịchọ imere ndị Juu[a] amara, zara Pọl, sị, “Ị chọrọ ịrịgo Jeruselem ka e kpee gị ikpe n’ebe ahụ n’ihu m banyere ihe ndị a?”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’ebe a, “ndị Juu” na-ekwu kpọmkwem maka ndị Juu na-ebo Pọl ebubo, ma ọ bụ ndị ndu ha na-akwado ikpe ahụ; ọ pụtaghị ndị Juu niile n’enweghị ịkpa ókè.
    reason: cultural_note
  - marker: b
    text: A pụkwara ịsụ ya, “ka a nụrụ okwu ikpe gị n’ihu m” ma ọ bụ “ka e kpebie ikpe gị n’ihu m.”
    reason: lexical_alternative
lexical_decisions:
- source_word: θέλων
  choice: ebe ọ chọrọ
  rationale: Na-egosipụta ebumnuche Festọs nke participle dị ugbu a, n’ụzọ Igbo dị mfe ma bụrụkwa ihe a na-asụ taa.
- source_word: τοῖς Ἰουδαίοις
  choice: ndị Juu
  rationale: Nke a na-edobe okwu sara mbara nke Grik; ihe gbara amaokwu ahụ gburugburu na-egosi na ọ bụ ndị na-ebo Pọl ebubo na ndị ndu ha ka a na-ekwu maka ha.
- source_word: χάριν καταθέσθαι
  choice: imere ... amara
  rationale: Akpaokwu a pụtara imere mmadụ ihe ga-atọ ya ụtọ ma ọ bụ nweta ihu ọma ya. Nhọrọ a bụ Igbo ebumpụta ụwa, ọ naghịkwa etinye ebumnuche aghụghọ nke Grik ekwughị hoo haa.
- source_word: ἀποκριθεὶς ... εἶπεν
  choice: zara ... sị
  rationale: Ụzọ Igbo nkịtị e si webata azịza e kwuru ọnụ; ọ na-anọchi usoro okwu Grik ahụ n’enweghị ikwughachi ihe na-adịghị mkpa n’Igbo.
- source_word: Θέλεις
  choice: Ị chọrọ
  rationale: Ajụjụ kpọmkwem banyere ihe Pọl chọrọ; ọ naghị eme ka okwu ahụ bụrụ nanị ma Pọl ò kwetara.
- source_word: εἰς Ἱεροσόλυμα ἀναβὰς
  choice: ịrịgo Jeruselem
  rationale: Na-edobe echiche nke ‘ịga elu’ gaa Jeruselem, dịka ọdịdị ala na omenala okwu nke oge ahụ si dị.
- source_word: περὶ τούτων
  choice: banyere ihe ndị a
  rationale: Na-edobe ntụaka sara mbara nke Grik, kama ịkọwapụta ya dịka ebubo mgbe okwu Grik n’onwe ya ekwughị nke ahụ.
- source_word: κριθῆναι
  choice: ka e kpee gị ikpe
  rationale: N’ọnọdụ ikpe iwu a, κρίνω na-egosi ikpe mmadụ ikpe ma ọ bụ ịnụrụ okwu ikpe ya. Nke a bụ okwu Igbo doro anya ma kwekọọ n’ọnọdụ ahụ.
- source_word: ἐπ’ ἐμοῦ
  choice: n’ihu m
  rationale: Na-egosipụta na Festọs ga-anọ dịka onye ọchịchị na-elekọta ikpe ahụ, n’enweghị ikwusi ike na ọ bụ naanị ya ga-ekpebi ya.
theological_decisions:
- issue: Okwu “ndị Juu” nwere ike ịkpata nghọta na-ezighị ezi megide ndị Juu niile
  choice: E debere “ndị Juu” n’ahịrị bụ isi, ma kọwaa n’ala peeji na ebe a ọ na-arụtụ aka n’ụzọ pụrụ iche n’ebe ndị Juu na-ebo Pọl ebubo ma ọ bụ ndị ndu na-akwado ikpe ahụ nọ.
  alternative: ndị ndu Juu; ndị Juu na-ebo ya ebubo
  rationale: Nke a na-asọpụrụ okwu sara mbara nke isi mmalite Grik ma na-egbochi ịgụ ya dịka ebubo a na-ebo ndị Juu niile n’enweghị ịkpa oke.
- issue: Ma κριθῆναι pụtara ikpebi ikpe ma ọ bụ ịnụrụ okwu ikpe
  choice: ka e kpee gị ikpe
  alternative: ka a nụrụ okwu ikpe gị; ka e nyochaa ikpe gị
  rationale: Okwu Grik nwere nghọta ikpe iwu sara mbara. Isi ederede jiri okwu Igbo nkịtị, ebe nkọwa ala peeji na-echekwa nhọrọ ndị ọzọ.
translation_notes:
  register: Standard Igbo nke oge a, nwere ugwu ma dị mfe nghọta. E jiri “imere ... amara” gosipụta akpaokwu ndọrọ ndọrọ ọchịchị ahụ n’enweghị ịgbakwunye echiche aghụghọ; e jikwa “n’ihu m” chekwaa ntakịrị obosara nke ọrụ Festọs n’ikpe ahụ.
