  to: Ma Festọs, n’ịchọ imere ndị Juu[a] amara, zara Pọl, sị, “Ị chọrọ ịrịgo Jeruselem ka e kpee gị ikpe n’ebe ahụ n’ihu m banyere ihe ndị a?”[b]
  rationale: The revision preserves the Greek syntax and legal ambiguity while improving Standard Igbo flow and ensuring that both footnotes accurately express their intended contextual and lexical information. Footnote markers remain correctly anchored after ‘ndị Juu’ and the judicial clause.
