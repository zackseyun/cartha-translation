  text: Διατρίψας δὲ ἐν αὐτοῖς ἡμέρας ⸂οὐ πλείους ὀκτὼ⸃ ἢ δέκα, καταβὰς εἰς Καισάρειαν, τῇ ἐπαύριον καθίσας ἐπὶ τοῦ βήματος ἐκέλευσεν τὸν Παῦλον ἀχθῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/006.yaml
  text: After spending among them no more than eight or ten days[a], he went down to Caesarea, and on the next day, after taking his seat on the tribunal, he ordered Paul to be brought in.
translation:
  language: ig
  text: Mgbe ọ nọsịrị n’etiti ha ụbọchị ọ dịghị karịa asatọ ma ọ bụ iri, ọ gbadara gaa Sizaria. N’echi ya, mgbe ọ nọdụsịrị n’oche ikpe, o nyere iwu ka e bute Pọl.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διατρίψας δὲ ἐν αὐτοῖς
  choice: Mgbe ọ nọnyere ha
  rationale: Ọ na-egosi na Festọs nọrọ n’etiti ndị a kpọtụrụ aha, ma mee ka participle nke Grik bụrụ ahịrịokwu oge nke na-ada nke ọma n’Igbo.
- source_word: ἡμέρας οὐ πλείους ὀκτὼ ἢ δέκα
  choice: ụbọchị na-erughị asatọ ma ọ bụ iri
  rationale: Nhọrọ a na-echekwa ntụnyere a jụrụ ajụ nke Grik na ọnụọgụ abụọ ahụ n’enweghị ime ka ha bụrụ otu ọnụọgụ kpọmkwem.
- source_word: καταβὰς εἰς Καισάρειαν
  choice: ọ rịdara gaa Sizaria
  rationale: ‘Rịdara’ na-echekwa okwu ntụziaka njem ahụ site na Jerusalem ruo Sizaria; ‘Sizaria’ bụ nsụgharị aha obodo ahụ n’ụdị Igbo a na-aghọta.
- source_word: τῇ ἐπαύριον
  choice: N’echi ya
  rationale: Nke a bụ ụzọ Igbo dị nkenke ma doo anya isi kwuo ụbọchị sochirinụ.
- source_word: καθίσας ἐπὶ τοῦ βήματος
  choice: ọ nọrọ n’oche ikpe
  rationale: βῆμα n’ebe a bụ oche ma ọ bụ ebe onye ọchịchị na-anọ kpee ikpe; ‘oche ikpe’ na-eme ka ọnọdụ iwu ahụ doo onye na-agụ akwụkwọ anya.
- source_word: ἐκέλευσεν
  choice: nyezie iwu
  rationale: Ọ na-egosi iwu ọchịchị e nyere n’usoro ikpe ma na-ejikọta usoro omume ahụ nke ọma n’Igbo.
- source_word: τὸν Παῦλον ἀχθῆναι
  choice: ka a kpọbata Pọl
  rationale: Passive infinitive ahụ na-ekwu ka e bute Pọl n’ebe a na-ekpe ikpe; ‘kpọbata’ na-egosi iwebata ya n’ime ebe ahụ n’ụzọ ebumpụta ụwa.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke ugbu a, dị ùgwù ma dị mfe nghọta. E kewara ahịrịokwu ahụ ụzọ abụọ ka usoro ihe mere doo anya, ma e chekwara okwu njem na okwu ikpe nke Grik.
