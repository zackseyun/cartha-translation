- from: Mgbe ọ nọnyere ha ụbọchị na-erughị asatọ ma ọ bụ iri[a], ọ rịdara gaa Sizaria. N’echi ya, ọ nọrọ n’oche ikpe, nyezie iwu ka a kpọbata Pọl.
  to: Mgbe ọ nọsịrị n’etiti ha ụbọchị ọ dịghị karịa asatọ ma ọ bụ iri, ọ gbadara gaa Sizaria. N’echi ya, mgbe ọ nọdụsịrị n’oche ikpe, o nyere iwu ka e bute Pọl.
