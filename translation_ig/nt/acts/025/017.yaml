  text: συνελθόντων ⸀οὖν ἐνθάδε ἀναβολὴν μηδεμίαν ποιησάμενος τῇ ἑξῆς καθίσας ἐπὶ τοῦ βήματος ἐκέλευσα ἀχθῆναι τὸν ἄνδρα·
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/017.yaml
  text: So when they had come together here[a], I made no delay, but on the next day I sat on the judgment seat and ordered the man to be brought.
translation:
  language: ig
  text: Ya mere, mgbe ha bịarutere n’ebe a, egbughị m oge ọ bụla; n’echi ya, m nọdụụrụ n’oche ikpe[a] ma nye iwu ka a kpọta nwoke ahụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịtụgharị ya, “m nọdụụrụ n’oche ụlọikpe.” Okwu Grik βῆμα na-ezo aka n’oche ọchịchị onye ikpe ma ọ bụ n’ikpo okwu ụlọikpe.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνελθόντων
  choice: mgbe ha zukọtara
  rationale: Ọ bụ nkebiokwu participle nke na-egosi oge ndị na-ebo ebubo zukọtara; nsụgharị a bụ Igbo doro anya ma debe echiche nke ịgbakọta.
- source_word: οὖν
  choice: Ya mere
  rationale: Ọ na-ejikọta ihe Festọs na-ekwu ugbu a na ihe o kwuru tupu ya, ma na-egosi ihe si na ya pụta.
- source_word: ἐνθάδε
  choice: n’ebe a
  rationale: Nke a na-enye kpọmkwem echiche adverb nke ebe, ‘ebe a.’
- source_word: ἀναβολὴν μηδεμίαν ποιησάμενος
  choice: emeghị m ihe ọ bụla iji yigharịa okwu ahụ
  rationale: Akpaalaokwu Grik a pụtara na Festọs eyigharịghị ikpe ahụ. Nsụgharị a bụ Igbo eke ma debe ọnọdụ ọrụ ụlọikpe ahụ.
- source_word: τῇ ἑξῆς
  choice: N’echi ya
  rationale: Ọ na-ezo aka n’ụbọchị sochirinụ, ya bụ, ụbọchị na-esote.
- source_word: καθίσας ἐπὶ τοῦ βήματος
  choice: anọrọ m n’oche ikpe
  rationale: βῆμα n’ebe a bụ oche ma ọ bụ ikpo okwu ọchịchị e ji edu ikpe; ‘oche ikpe’ na-egosi ọrụ iwu ya n’enweghị ịgbasa ihe odide ahụ.
- source_word: ἐκέλευσα
  choice: nye iwu
  rationale: Ngwaa a na-egosi iwu ọchịchị Festọs nyere n’ọnọdụ ikpe ahụ.
- source_word: ἀχθῆναι
  choice: ka a kpọta
  rationale: Passive infinitive nke ἄγω na-egosi ka e wetara nwoke ahụ n’ihu onye ikpe; ‘kpọta’ bụ Igbo dị nkenke na nke eke.
- source_word: τὸν ἄνδρα
  choice: nwoke ahụ
  rationale: Ọ na-ezo aka n’otu nwoke ahụ, bụ Pọl, n’etinyeghị nkọwa ‘onye e boro ebubo’ nke na-adịghị kpọmkwem n’okwu Grik.
