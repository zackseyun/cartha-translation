    reason: lexical_alternative
  revision_rationale: The revision retains the source’s temporal and judicial sequence while removing an unstated object, correcting the verbs for ‘sat’ and ‘ordered,’ and improving the footnote’s idiomatic Standard Igbo. The wording does not identify the man beyond what the Greek states.
