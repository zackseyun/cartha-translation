translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke kwanyeere ọnọdụ ụlọikpe ugwu ma dịkwa mfe nghọta. E tinyere akara nkọwa [a] ozugbo n’akụkụ ‘oche ikpe,’ bụ okwu nkọwa ahụ na-akọwa.
