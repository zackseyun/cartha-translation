translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E kewara ogologo ahịrịokwu Grik ahụ ụzọ atọ ka o wee na-aga were were n’Igbo, ma a ka debere usoro ihe ndị mere na mmekọrịta ha. Ihe nrịba ama ukwu [a] na [b] dị n’ederede isi.
