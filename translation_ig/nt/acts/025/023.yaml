  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Τῇ οὖν ἐπαύριον ἐλθόντος τοῦ Ἀγρίππα καὶ τῆς Βερνίκης μετὰ πολλῆς φαντασίας καὶ εἰσελθόντων εἰς τὸ ἀκροατήριον σύν ⸀τε χιλιάρχοις καὶ ἀνδράσιν τοῖς κατ’ ⸀ἐξοχὴν τῆς πόλεως καὶ κελεύσαντος τοῦ Φήστου ἤχθη ὁ Παῦλος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/023.yaml
  text: So on the next day, Agrippa and Bernice came with great pomp and entered the audience hall with both the military tribunes and the prominent men of the city, and at Festus's command Paul was brought in.
translation:
  language: ig
  text: Ya mere, n’echi ya, Agrịpa na Berenis ji n’oke ngosi[a] bịa, ha na ndị isi agha nakwa ndị a ma ama n’obodo ahụ[b] wee banye n’ụlọ nzukọ a na-anụ okwu. Mgbe Festọs nyere iwu, a kpọbatara Pọl.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “n’oke mmemme” ma ọ bụ “n’oke ngosi.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ndị ikom a ma ama n’obodo ahụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τῇ οὖν ἐπαύριον
  choice: Ya mere, n’echi ya
  rationale: Nke a na-egosipụta ma njikọ akụkọ οὖν ma oge ἐπαύριον n’Igbo dị mfe ma dị ugbu a.
- source_word: ἐλθόντος
  choice: bịa
  rationale: Ọ bụ ezie na okwu Grik a bụ participle dị n’usoro genitive absolute, iji ngwaa zuru ezu bụ ụzọ ebumpụta ụwa n’Igbo.
- source_word: Ἀγρίππα ... Βερνίκης
  choice: Agrịpa na Berenis
  rationale: E dere aha ndị a n’ụdị dabara n’usoro mkpụrụokwu na mkpọpụta Igbo.
- source_word: μετὰ πολλῆς φαντασίας
  choice: ji oké ngosi
  rationale: N’ebe a φαντασία pụtara nnukwu ngosi ọha na eze ma ọ bụ emume a haziri iji gosi ùgwù na ebube; ‘oké ngosi’ anaghị agbakwụnye ikpe omume na-adịghị n’ederede.
- source_word: εἰσελθόντων εἰς τὸ ἀκροατήριον
  choice: wee banye n’ụlọ a na-anọ anụ okwu
  rationale: ἀκροατήριον bụ ụlọ e ji anụ okwu n’ihu ndị ọchịchị. Nsụgharị a na-edobe ọrụ ụlọ ahụ n’emeghị ka o doo anya karịa Grik na ọ bụ kpọmkwem ụlọ ikpe.
- source_word: σύν τε χιλιάρχοις
  choice: Ha na ndị ọchịagha dị elu
  rationale: χιλίαρχοι bụ ndị isi agha nọ n’ọkwa dị elu. Okwu a na-enye onye Igbo nke oge a nghọta ọrụ ha karịa ibufe aha ọkwa Rom n’onwe ya.
- source_word: ἀνδράσιν τοῖς κατ’ ἐξοχὴν τῆς πόλεως
  choice: ndị a ma ama n’obodo ahụ
  rationale: κατ’ ἐξοχήν na-egosi ndị nwere ọkwá ma ọ bụ ndị pụtara ìhè. ‘Ndị a ma ama’ bụ okwu Igbo doro anya ma dị ebumpụta ụwa.
- source_word: κελεύσαντος τοῦ Φήστου
  choice: Mgbe Festọs nyere iwu
  rationale: A gbanwere genitive absolute ka ọ bụrụ nkebiokwu oge n’Igbo, na-edobe ikike dị n’iwu Festọs.
- source_word: ἤχθη ὁ Παῦλος
  choice: a kpọbatara Pọl
  rationale: Ụdị passive a na-egosi na e duuru ma ọ bụ kpọbata Pọl n’ụlọ ahụ; ‘a kpọbatara’ na-ekwu nke a n’Igbo ebumpụta ụwa.
