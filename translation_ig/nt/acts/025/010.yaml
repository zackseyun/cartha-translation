  to: Ma Pọl kwuru, “Eguzo m[b] n’ihu oche ikpe Siza[a], ebe e kwesịrị ikpe m ikpe. Emejọbeghị m ndị Juu n’ụzọ ọ bụla[c], dị ka gị onwe gị maara nke ọma.”
