  text: εἶπεν δὲ ὁ Παῦλος· ⸂Ἐπὶ τοῦ βήματος Καίσαρος ἑστώς⸃ εἰμι, οὗ με δεῖ κρίνεσθαι. Ἰουδαίους οὐδὲν ⸀ἠδίκησα, ὡς καὶ σὺ κάλλιον ἐπιγινώσκεις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/010.yaml
  text: But Paul said[a], “I am standing before Caesar’s tribunal, where I ought to be judged. I have done no wrong to the Jews[c][b], as you yourself know very well.”
translation:
  language: ig
  text: Ma Pọl kwuru, “Eguzo m[b] n’ihu oche ikpe Siza[a], ebe e kwesịrị ikpe m ikpe. Emejọbeghị m ndị Juu n’ụzọ ọ bụla[c], dị ka gị onwe gị maara nke ọma.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ụlọikpe Siza.” Okwu Grik βῆμα na-ezo aka n’oche ọchịchị e ji ekpe ikpe ma ọ bụ n’ụlọikpe.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “Anọ m n’ihu oche ikpe Siza.” N’asụsụ Grik, a na-eji nkebiokwu na-egosi na Pọl nọ ugbu a n’ọnọdụ iwu n’ihu ụlọikpe ahụ.
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “O nweghị ihe ọjọọ ọbụla m mere ndị Juu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: βῆμα
  choice: oche ikpe
  rationale: N’ebe a, okwu ahụ na-ezo aka n’oche ọchịchị e ji ekpe ikpe, ya bụ ụlọikpe ma ọ bụ ikike ikpe Rom; “oche ikpe” bụ okwu Igbo doro anya nke na-echekwakwa ihe oyiyi dị n’okwu Grik.
- source_word: Καίσαρος
  choice: Siza
  rationale: Aha-ọrụ eze ukwu Rom ka okwu a bụ n’ebe a. “Siza” na-echekwa ọnọdụ akụkọ ihe mere eme na nke iwu Rom.
- source_word: ἑστώς εἰμι
  choice: Anọ m
  rationale: Nkebiokwu Grik a na-emesi ọnọdụ Pọl nọ ugbu a n’ihu ụlọikpe ike. “Anọ m n’ihu” na-ada ka Igbo ebumpụta ụwa ma na-egosi ọnọdụ iwu ya ugbu a.
- source_word: οὗ
  choice: ebe
  rationale: Ọ na-alaghachi n’oche ikpe Siza dịka ebe kwesịrị ekwesị a ga-ekpe Pọl ikpe.
- source_word: δεῖ
  choice: e kwesịrị
  rationale: Ọ na-egosi mkpa ma ọ bụ ihe iwu na usoro ikpe chọrọ, ọ bụghị naanị ọchịchọ onwe onye.
- source_word: κρίνεσθαι
  choice: ikpe m ikpe
  rationale: N’ọnọdụ iwu a, ngwaa ahụ pụtara ka e kpee mmadụ ikpe ma ọ bụ ka a nụ ikpe ya; nsụgharị a na-esochi Grik nso ma doo anya n’Igbo.
- source_word: Ἰουδαίους
  choice: ndị Juu
  rationale: Ọ na-ezo aka n’ebe a n’ebe ndị Juu Pọl sị na ya emejọghị nọ, ọ bụghị nanị ndị si Judia.
- source_word: οὐδὲν ἠδίκησα
  choice: O nweghị ihe ọjọọ m mere
  rationale: Nke a na-ebute ma echiche imejọ mmadụ ma ike okwu ahụ n’ihe gbasara iwu, n’asụsụ Igbo doro anya.
- source_word: ὡς καὶ σὺ κάλλιον ἐπιγινώσκεις
  choice: dị ka gị onwe gị makwara nke ọma
  rationale: “Gị onwe gị” na-egosipụta nkwusi ike dị na καὶ σὺ, ebe “makwara nke ọma” na-enye echiche nke ịma nke ọma dị na ἐπιγινώσκεις na κάλλιον n’ụzọ Igbo si ekwu ya.
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. “Oche ikpe” na-echekwa ihe oyiyi Grik ma ihe odide ala peeji na-akọwa echiche ụlọikpe. E zere ime ka “ndị Juu” bụrụ naanị ndị isi okpukpe, n’ihi na okwu Grik n’onwe ya ekwughị nke ahụ kpọmkwem.
