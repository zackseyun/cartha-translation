  to: Ma mgbe Pọl rịọrọ ka e debe ya n’okpuru njide maka mkpebi Eze Ukwu[a], m nyere iwu ka e debe ya n’okpuru njide ruo mgbe m ga-ezigara Siza.
  rationale: E degharịrị akụkụ metụtara διάγνωσιν ka ọ bụrụ “maka mkpebi Eze Ukwu,” iji chekwaa na arịrịọ Pọl bụ ka a debe ya n’ụlọ mkpọrọ maka mkpebi ahụ. E tinyere “ruo mgbe” naanị n’ọrụ iziga ya na Siza, dịka ἕως οὗ ἀναπέμψω αὐτὸν πρὸς Καίσαρα si dị. A chekwara okwu njide n’ebe abụọ ahụ na ọdịiche akụkọ ihe mere eme dị n’etiti Eze Ukwu na Siza.
