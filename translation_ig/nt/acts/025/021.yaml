translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E deziri ahịrịokwu ahụ n’usoro okwu Igbo nkịtị, ma e chekwara ọnọdụ iwu Rom na ọdịiche dị n’etiti “Eze Ukwu” na “Siza.”
