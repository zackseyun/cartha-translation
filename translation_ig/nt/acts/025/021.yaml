  text: τοῦ δὲ Παύλου ἐπικαλεσαμένου τηρηθῆναι αὐτὸν εἰς τὴν τοῦ Σεβαστοῦ διάγνωσιν, ἐκέλευσα τηρεῖσθαι αὐτὸν ἕως οὗ ⸀ἀναπέμψω αὐτὸν πρὸς Καίσαρα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/021.yaml
  text: But when Paul appealed to be kept in custody for the decision of the Emperor[a], I ordered that he be kept in custody until I send him to Caesar.
translation:
  language: ig
  text: Ma mgbe Pọl rịọrọ ka e debe ya n’okpuru njide maka mkpebi Eze Ukwu[a], m nyere iwu ka e debe ya n’okpuru njide ruo mgbe m ga-ezigara Siza.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’asụsụ Grik, aha ahụ bụ “Onye A Na-asọpụrụ” (Σεβαστός), aha nsọpụrụ eze ukwu Rom nke kwekọrọ na “Augustọs.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπικαλεσαμένου
  choice: rịọrọ
  rationale: N’ọnọdụ ikpe ndị Rom a, okwu a na-ezo aka n’arịrịọ iwu e mere ka onye ọchịchị ka elu kpee ikpe ahụ. Ahịrịokwu gbara ya gburugburu na-eme ka ọdịdị arịrịọ ahụ doo anya n’Igbo.
- source_word: τηρηθῆναι / τηρεῖσθαι
  choice: ka e jide ya n’ụlọ mkpọrọ / ka e jide ya n’ụlọ mkpọrọ
  rationale: τηρέω ebe a pụtara ijide mmadụ n’okpuru nche ọchịchị, ọ bụghị naanị ichebe ya. Nsụgharị a na-egosipụta ọnọdụ njide ahụ ma na-edokwa otu okwu n’ebe abụọ ahụ.
- source_word: διάγνωσιν
  choice: ga-ekpebi okwu ya
  rationale: διάγνωσις na-ezo aka ná mkpebi ikpe. Usoro okwu a bụ Igbo dị n’usoro ma ghara ime ka ọ bụrụ naanị ịnụrụ ikpe ma ọ bụ ikpe ọmụma.
- source_word: Σεβαστοῦ
  choice: Eze Ukwu
  rationale: Σεβαστός bụ aha nsọpụrụ nke eze ukwu Rom, nke kwekọrọ na Augustus. “Eze Ukwu” na-enye onye Igbo nke oge a nghọta doro anya; ihe odide ala peeji na-echekwa ọdịdị aha Grik ahụ.
- source_word: ἀναπέμψω
  choice: m ga-eziga
  rationale: Okwu a pụtara iziga Pọl gaa n’aka onye ọchịchị ka elu. “Ga-eziga” bụ okwu Igbo nkịtị ma doo anya n’ebe a.
- source_word: πρὸς Καίσαρα
  choice: na Siza
  rationale: Καῖσαρ na-arụ ọrụ dị ka aha ma ọ bụ utu aha eze ukwu Rom. “Siza” na-echekwa okwu akụkọ ihe mere eme ahụ.
