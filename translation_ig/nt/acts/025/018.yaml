  naturalness: “Banyere ya, mgbe ndị na-ebo ya ebubo guzoro” bụ Igbo Izugbe dị eke ma doo usoro ahịrịokwu Grik anya. “Guzoro” zuru ezu maka σταθέντες n’ọnọdụ ikpe; ọ dịghị mkpa ịgbakwunye “ikwu okwu.”
  terminology: “Ndị na-ebo ya ebubo,” “ebubo,” na “ihe ọjọọ” dabara n’olu ikpe na n’obosara κατήγοροι, αἰτία, na πονηρῶν. “Ihe ọjọọ” ekwesịghị ịtụgharị ka “mpụ” n’ederede n’onwe ya, n’ihi na πονηρῶν sara mbara karịa mpụ iwu akọwapụtara.
