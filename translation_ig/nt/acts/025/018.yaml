source:
  edition: SBLGNT
  text: περὶ οὗ σταθέντες οἱ κατήγοροι οὐδεμίαν αἰτίαν ⸀ἔφερον ὧν ⸂ἐγὼ ὑπενόουν⸃ ⸀πονηρῶν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/018.yaml
  text: Concerning him[a], when the accusers stood up, they brought no charge of the evil things that I was suspecting,
translation:
  language: ig
  text: Banyere ya, mgbe ndị na-ebo ya ebubo guzoro, ha ewetaghị ebubo ọ bụla banyere ihe ọjọọ ndị m chere na ọ mere.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “ha ewetaghị ebubo ọ bụla banyere mpụ ndị m chere na o mere.” Okwu Grik ahụ sịrị “ihe ọjọọ,” nke nwere ike ịpụta ajọ omume n'ozuzu ya, ọ bụghị naanị mpụ ndị iwu kọwara kpọmkwem.
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ οὗ
  choice: banyere ya
  rationale: Nkebiokwu a na-ezo aka n'okwu gbasara Pọl; “banyere ya” bụ Igbo nkịtị nke na-edobe ntụaka ahụ.
- source_word: σταθέντες
  choice: Mgbe ... biliri ikwu okwu
  rationale: Aorist participle ahụ na-egosi oge ndị na-ebo ebubo guzoro iji kwupụta ikpe ha. Ịgbakwụnye “ikwu okwu” na-eme ka ọnọdụ ụlọikpe doo anya n'Igbo n'ebughị echiche ọhụrụ dị mkpa.
- source_word: οἱ κατήγοροι
  choice: ndị na-ebo ya ebubo
  rationale: Nke a bụ okwu Igbo doro anya maka ndị wetara ebubo n'ọnọdụ ikpe, ma ọ naghị akpọchi ha n'ọrụ ndị ọka iwu gọọmenti.
- source_word: οὐδεμίαν αἰτίαν ἔφερον
  choice: ha ewetaghị ebubo ọ bụla
  rationale: “Iweta ebubo” na-egosipụta akpaalaokwu ikpe nke isi mmalite ahụ n'ụzọ dị mfe ma doo anya.
- source_word: ὧν ἐγὼ ὑπενόουν
  choice: banyere ... ndị m chere na ọ mere
  rationale: Nhazi a jikọtara ụdị ihe ndị a tụrụ anya ha na ebubo ahụ. “M chere” na-enye echiche Festọs nwere tupu ọ nụ ikpe ahụ, ma zere Igbo na-adịghị eke nke ntụgharị imperfect kpọmkwem.
- source_word: πονηρῶν
  choice: ihe ọjọọ
  rationale: “Ihe ọjọọ” na-edobe obosara okwu Grik ahụ, nke pụrụ ịpụta ajọ omume n'ozuzu, kama ịkọwa ya naanị dịka mpụ iwu kwadoro.
theological_decisions:
- issue: Ma πονηρῶν ọ̀ pụtara mpụ akọwapụtara n'iwu ka ọ bụ ajọ omume n'ozuzu
  choice: ihe ọjọọ
  alternative: mpụ
  rationale: Isi okwu Grik ahụ sara mbara karịa “mpụ,” ọ bụ ezie na ọnọdụ ahụ bụ nke ụlọikpe. A na-edobe esemokwu a n'ederede na nkọwa ala peeji.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E ji okwu ndị mmadụ na-ejikarị eme ihe n'okwu ikpe, ma zere okwu iwu siri ike na ntụgharị nke ga-adị ka nke e si n'asụsụ ọzọ dọpụta ozugbo.
