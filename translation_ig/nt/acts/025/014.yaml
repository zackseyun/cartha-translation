source:
  edition: SBLGNT
  text: ὡς δὲ πλείους ἡμέρας ⸀διέτριβον ἐκεῖ, ὁ Φῆστος τῷ βασιλεῖ ἀνέθετο τὰ κατὰ τὸν Παῦλον λέγων· Ἀνήρ τίς ἐστιν καταλελειμμένος ὑπὸ Φήλικος δέσμιος,
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/014.yaml
  text: And as they stayed there many days[a], Festus laid before the king the matters concerning Paul, saying[b], “There is a certain man left behind by Felix as a prisoner,”
translation:
  language: ig
  text: Mgbe ha nọrọ ọtụtụ ụbọchị n’ebe ahụ, Festọs kpọgara eze okwu gbasara Pọl[a], sị, “E nwere otu nwoke Feliks hapụrụ n’azụ dịka onye mkpọrọ.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “Festọs wetara eze okwu ikpe Pọl.” Okwu Grik ahụ nwere ike izo aka kpọmkwem n’ọnọdụ ikpe Pọl; ngwaa ahụ na-egosi iweta okwu n’ihu onye ọzọ ka ọ tụlee ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: πλείους ἡμέρας
  choice: ọtụtụ ụbọchị
  rationale: N’ọnọdụ a, nkebiokwu ntụnyere a na-arụ ọrụ dịka okwu oge pụtara ọtụtụ ụbọchị ma ọ bụ ụbọchị ole na ole; ‘ọtụtụ ụbọchị’ na-egosi na ọnụnọ ahụ dịtụ ogologo.
- source_word: διέτριβον
  choice: ha nọrọ
  rationale: Ngwaa a pụtara ịnọ ma ọ bụ iwepụta oge n’otu ebe; ‘ha nọrọ’ bụ Igbo doro anya ma kwekọọ na isiokwu ọtụtụ.
- source_word: ἀνέθετο
  choice: kọwaara eze
  rationale: Ụdị etiti nke ngwaa a na-egosi iweta ma ọ bụ ịkọwa okwu n’ihu onye ọzọ ka o tụlee ya; ‘kọwaara eze’ na-egosipụta ihe karịrị nanị iziga ozi.
- source_word: τὰ κατὰ τὸν Παῦλον
  choice: ihe banyere Pọl
  rationale: Nkebiokwu a na-ezo aka n’ihe niile metụtara Pọl, karịchaa ọnọdụ ikpe ya, ma nsụgharị a anaghị akọwapụta karịa Grik.
- source_word: Ἀνήρ τίς ἐστιν
  choice: E nwere otu nwoke
  rationale: Nke a na-ewebata otu nwoke a maara kpọmkwem ma a kpọghị aha ya; okwu Igbo a bụ ihe e ji ekwu ya n’ụzọ nkịtị.
- source_word: καταλελειμμένος
  choice: hapụrụ
  rationale: Perfect passive participle ahụ na-egosi na Feliks hapụrụ nwoke ahụ, ọnọdụ ahụ ka na-adịgidekwa; ọnọdụ onye mkpọrọ dị n’ahịrịokwu ahụ na-eme ka nke a doo anya.
- source_word: δέσμιος
  choice: ka ọ bụrụ onye mkpọrọ
  rationale: Okwu ahụ pụtara onye mkpọrọ; ‘ka ọ bụrụ onye mkpọrọ’ na-egosi ọnọdụ o nọ na ya mgbe Feliks hapụrụ ya.
- source_word: βασιλεῖ
  choice: eze
  rationale: Grik kwuru naanị ‘eze,’ ọ bụghị aha Agrịpa ọzọ n’amaokwu a; nsụgharị ahụ na-edobe aha ọkwá ahụ dịka isi mmalite si dị.
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ ‘Festọs,’ ‘Feliks,’ na ‘Pọl’ dịka nsụgharị aha ndị a na-ejikarị n’Igbo. E jikọtara nghọta abụọ yiri ibe ha nke ἀνέθετο na τὰ κατὰ τὸν Παῦλον n’otu nkọwa ala peeji, ma etinye akara [a] n’ebe o metụtara na ederede.
