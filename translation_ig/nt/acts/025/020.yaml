  text: ἀπορούμενος δὲ ἐγὼ τὴν περὶ ⸀τούτων ζήτησιν ἔλεγον εἰ βούλοιτο πορεύεσθαι εἰς ⸀Ἱεροσόλυμα κἀκεῖ κρίνεσθαι περὶ τούτων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/020.yaml
  text: And since I was at a loss about the investigation concerning these matters[b][a], I asked whether he wanted to go to Jerusalem and be judged there concerning them.
translation:
  language: ig
  text: Ma ebe ọ bụ na amaghị m otu m ga-esi lebara esemokwu a banyere okwu ndị a anya,[a] ajụrụ m ya ma ọ chọrọ ịga Jerusalem ka e kpee ya ikpe n'ebe ahụ banyere ha.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ebe arụmụka banyere okwu ndị a gbagwojuru m anya.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ma ọ dị njikere ịga Jerusalem ka e kpee ya ikpe n'ebe ahụ banyere okwu ndị a.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπορούμενος
  choice: ebe ọ gbagwojuru m anya
  rationale: Na-egosi na Festọs amaghị nke ọma ihe ọ ga-eme ma ọ bụ otú ọ ga-esi dozie okwu ahụ; njikọ “ebe” na-egosikwa ihe kpatara ajụjụ ya.
- source_word: ζήτησιν
  choice: nnyocha
  rationale: N'ọnọdụ ikpe a, okwu ahụ na-ezo aka n'ịtụle na nyocha okwu e wetara n'ihu onye ọchịchị, ma ọ pụkwara ịpụta arụmụka.
- source_word: περὶ τούτων
  choice: banyere ... okwu ndị a / banyere ha
  rationale: “Okwu ndị a” dabara n'ọnọdụ iwu; n'ugboro nke abụọ, “ha” na-ezere nkwughachi na-adịghị mkpa ma na-edobe otu ntụaka ahụ.
- source_word: ἔλεγον
  choice: ajụrụ m ya
  rationale: Ọ bụ ezie na ngwaa ahụ pụtara n'ụzọ nkịtị “m kwuru,” ajụjụ na-apụtachaghị ìhè nke εἰ webatara na-eme ka “ajụrụ m ya” bụrụ Igbo doro anya.
- source_word: εἰ βούλοιτο
  choice: ma ọ chọrọ
  rationale: Na-egosipụta ajụjụ Festọs banyere ọchịchọ Pọl; “ma ọ dị njikere” ka bụkwa ihe okwu ahụ nwere ike ịpụta.
- source_word: πορεύεσθαι
  choice: ịga
  rationale: Nke a bụ nsụgharị Igbo kacha mfe ma kwekọọ n'echiche njem ahụ.
- source_word: Ἱεροσόλυμα
  choice: Jerusalem
  rationale: Aha obodo a na-ejikarị eme ihe n'Igbo.
- source_word: κἀκεῖ
  choice: n'ebe ahụ
  rationale: Na-edobe ntụaka doro anya na Jerusalem dịka ebe ikpe ahụ ga-adị.
- source_word: κρίνεσθαι
  choice: ka e kpee ya ikpe
  rationale: Na-egosi ikpe iwu n'ụzọ eke n'Igbo, ma ghara ime ka okwu Grik ahụ dị warara karịa ka ọ dị.
theological_decisions: []
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ debere olu Festọs n'onwe ya, ọnọdụ iwu nke akụkọ ahụ, na nghọta abụọ ζήτησις nwere ike inwe—nnyocha ma ọ bụ arụmụka.
