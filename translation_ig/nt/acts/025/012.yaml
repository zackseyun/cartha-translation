review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents the sequence, Festus’s consultation, and the future outcome. However, its main clause renders the destination/legal result as “before Caesar,” while the Greek wording most directly says that Paul will go to Caesar; the English audit likewise retains “to Caesar” in the text and places “before Caesar” in a note. “Siza kpee ikpe gị” also somewhat over-specifies Caesar as the direct judge rather than preserving the formal legal appeal to his authority.
  naturalness: The sentence is generally clear Standard Igbo. “Ndị kansụl” is understandable but is an unnecessary English-derived administrative term where “ndị ndụmọdụ ahụ” is natural and clear. “Ị kpọkuola Siza ka ọ kpee ikpe gị” is a suitably formal, intelligible way to express the legal appeal in context.
  terminology: Keep “Festọs” and “Siza.” Use wording that retains the legal force of ἐπικαλέω without turning it into a mere request, and use “ị ga-agakwuru Siza” for the primary sense of ἐπὶ Καίσαρα πορεύσῃ. The footnote may give the tribunal-oriented alternative, “ị ga-aga n’ihu Siza.”
  issues:
  - severity: medium
    issue: The main text makes “before Caesar” primary and the footnote gives an inaccurate alternative.
    rationale: ἐπὶ Καίσαρα with πορεύσῃ directly expresses going to Caesar, in the setting of an appeal. “Before Caesar” is a legitimate legal-contextual alternative, but it should not displace the more direct reading. The current footnote, “Ọ bụ na nke Siza ka ị ga-aga,” is not idiomatic and does not accurately state that alternative.
  - severity: medium
    issue: “Ị rịọla ka Siza kpee ikpe gị” narrows the legal appeal.
    rationale: The perfect middle ἐπικέκλησαι denotes an appeal/invocation of Caesar’s jurisdiction. The draft’s wording can imply simply asking Caesar personally to judge the case. “Ị kpọkuola Siza ka ọ kpee ikpe gị” better retains the formal appeal language while remaining comprehensible.
  - severity: low
    issue: “ndị kansụl ahụ” is avoidable code-switching.
    rationale: “Ndị ndụmọdụ ahụ” naturally conveys the deliberative advisory group without changing the sense.
  revised_text: Mgbe ahụ, Festọs, mgbe ya na ndị ndụmọdụ ahụ kwurịtachara okwu, zara, sị, “Ị kpọkuola Siza ka ọ kpee ikpe gị; ọ bụkwuru Siza ka ị ga-agakwuru.”[a]
  revised_footnotes:
