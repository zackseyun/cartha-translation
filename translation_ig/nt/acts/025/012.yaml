    text: A pụkwara ịsụ ya, “Ọ bụ n’ihu Siza ka ị ga-aga.” Nkebiokwu Grik ahụ nwere nghọta iwu nke ịga n’ihu ụlọikpe eze ukwu mgbe mmadụ kpọkuchara ikike Siza n’ikpe.
    reason: alternative_reading
  revision_rationale: The revision restores the direct movement sense, “to Caesar,” to the main text and reserves the tribunal-oriented “before Caesar” sense for the note. It also expresses the legal appeal more precisely and replaces an unnecessary borrowed term with natural Standard Igbo. The footnote marker remains attached to the relevant saying.
