translation_notes:
  register: Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. E ji ‘ndị kansụl’ kọwaa òtù ndụmọdụ n’usoro ọchịchị Rom, ma e chekwara ụda iwu nke okwu Festọs. Akara nkọwa ala peeji [a] dị n’isiokwu ahụ.
