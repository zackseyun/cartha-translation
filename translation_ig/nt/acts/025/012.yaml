revisions:
- from: Mgbe ahụ, Festọs, mgbe ya na ndị kansụl ahụ kwurịtachara okwu, zara, sị, “Ị rịọla ka Siza kpee ikpe gị; ọ bụ n’ihu Siza ka ị ga-aga.”[a]
  to: Mgbe ahụ, Festọs, mgbe ya na ndị ndụmọdụ ahụ kwurịtachara okwu, zara, sị, “Ị kpọkuola Siza ka ọ kpee ikpe gị; ọ bụkwuru Siza ka ị ga-agakwuru.”[a]
  rationale: The revision restores the direct movement sense, “to Caesar,” to the main text and reserves the tribunal-oriented “before Caesar” sense for the note. It also expresses the legal appeal more precisely and replaces an unnecessary borrowed term with natural Standard Igbo. The footnote marker remains attached to the relevant saying.
  reviewer_model: gpt-5.6-terra
