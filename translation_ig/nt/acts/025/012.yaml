  text: τότε ὁ Φῆστος συλλαλήσας μετὰ τοῦ συμβουλίου ἀπεκρίθη· Καίσαρα ἐπικέκλησαι, ἐπὶ Καίσαρα πορεύσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/012.yaml
  text: Then Festus[a], after conferring with the council, answered, “You have appealed to Caesar; to Caesar you will go.”
translation:
  language: ig
  text: Mgbe ahụ, Festọs, mgbe ya na ndị ndụmọdụ ahụ kwurịtachara okwu, zara, sị, “Ị kpọkuola Siza ka ọ kpee ikpe gị; ọ bụkwuru Siza ka ị ga-agakwuru.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “Ọ bụ n’ihu Siza ka ị ga-aga.” Nkebiokwu Grik ahụ nwere nghọta iwu nke ịga n’ihu ụlọikpe eze ukwu mgbe mmadụ kpọkuchara ikike Siza n’ikpe.
    reason: alternative_reading
lexical_decisions:
- source_word: τότε
  choice: Mgbe ahụ
  rationale: Ọ na-egosi usoro oge n’akụkọ ahụ n’ụzọ doro anya ma bụrụkwa Igbo nkịtị.
- source_word: συλλαλήσας
  choice: mgbe ya na ... kwurịtachara okwu
  rationale: Ọ na-egosi na Festọs buru ụzọ soro ndị ahụ tụlee okwu tupu ọ zaa; ụdị a na-ebupụta echiche aorist participle n’Igbo eke.
- source_word: μετὰ τοῦ συμβουλίου
  choice: ya na ndị kansụl ahụ
  rationale: συμβούλιον n’ebe a bụ òtù ndị na-enye ndụmọdụ ma na-atụle okwu ọchịchị; e tinyeghị ‘nke ya’ n’ihi na nke ahụ apụtaghị kpọmkwem n’asụsụ Grik.
- source_word: ἀπεκρίθη
  choice: zara
  rationale: Okwu a bụ ụzọ Igbo dị mfe ma dị ugwu isi kọwaa nzaghachi n’ọnọdụ ikpe.
- source_word: Καίσαρα
  choice: Siza
  rationale: E debere aha-ọkwa eze ukwu Rom n’ụdị transliteration Igbo a maara nke ọma.
- source_word: ἐπικέκλησαι
  choice: Ị rịọla ka ... kpee ikpe gị
  rationale: Perfect middle a nwere nghọta iwu nke ịkpọku ikike Siza site n’ịrịọ ka e bugara ya ikpe; nsụgharị a na-eme ka nghọta ahụ doo onye Igbo anya.
- source_word: ἐπὶ Καίσαρα
  choice: n’ihu Siza
  rationale: N’ọnọdụ iwu a, nkebiokwu ahụ nwere ike igosi ịga n’ihu ụlọikpe ma ọ bụ ikike Siza, ọ bụghị naanị njem gaa ebe ọ nọ.
- source_word: πορεύσῃ
  choice: ị ga-aga
  rationale: Ọ na-edobe future middle dị ka mmegharị nke onye ahụ, na-agbanweghị ya ka ọ bụrụ passive ‘a ga-eziga gị.’
