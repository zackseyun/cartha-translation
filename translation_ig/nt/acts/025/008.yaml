base_translation:
  language: en
  yaml_path: translation/nt/acts/025/008.yaml
  text: 'Paul made his defense: “I have sinned in nothing against either the law of the Jews[a], or the temple, or Caesar.”'
translation:
  language: ig
  text: Pọl gbachitere onwe ya, sị, “Emehị m ihe ọ bụla megide iwu ndị Juu[a], ma ọ bụ megide ụlọ nsọ, ma ọ bụ megide Siza.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Emehị m mmejọ ọ bụla megide iwu ndị Juu, ụlọ nsọ, ma ọ bụ Siza.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπολογουμένου
  choice: zara ọnụ n’ịgbachitere onwe ya
  rationale: Nke a na-egosipụta nzaghachi Pọl n’ụlọikpe na ọdịdị okwu ahụ nke ịgbachitere onwe onye, n’Igbo dị mfe ma kwesịkwa ekwesị.
- source_word: ὅτι
  choice: sị,
  rationale: ὅτι na-ewebata ihe Pọl kwuru; n’Igbo, ‘sị’ na akara okwu kpọmkwem bụ ụzọ ebumpụta ụwa isi gosi ya.
- source_word: νόμον τῶν Ἰουδαίων
  choice: iwu ndị Juu
  rationale: Nke a na-edobe njikọ genitiv nke Grik ma ghara ikpebi karịa ihe ederede kwuru ma ọ bụ agbụrụ, okpukpe, ma ọ bụ ógbè ka e mesiri ike.
- source_word: ἱερὸν
  choice: ụlọnsọ ukwu
  rationale: ἱερόν na-ezo aka n’ụlọ nsọ ahụ n’ozuzu ya, ọ bụghị naanị ebe nsọ kachasị n’ime ya.
- source_word: Καίσαρά
  choice: Siza
  rationale: A na-edobe aha/utu aha onye ọchịchị Rom dị ka ọ dị n’omenala nsụgharị Akwụkwọ Nsọ Igbo.
- source_word: τι
  choice: ihe ọ bụla
  rationale: N’okpuru nkwubi okwu na-adịghị mma, okwu a na-emesi ike na Pọl agaghị ekweta na o mejọrọ n’ụzọ ọ bụla.
- source_word: ἥμαρτον
  choice: m mejọrọ
  rationale: N’ọnọdụ ikpe a, ‘mejọ’ nwere ike ibu ma echiche mmehie ma echiche ime ihe megidere iwu, ya mere ọ naghị eme ka okwu Grik bụrụ naanị okwu iwu.
- source_word: οὔτε ... οὔτε ... οὔτε
  choice: megide ... ma ọ bụ megide ... ma ọ bụ megide
  rationale: Mgbe ‘ọ dịghị ihe ọ bụla’ malitere nkwubi okwu ahụ, usoro ‘ma ọ bụ ... ma ọ bụ’ na-enye ndepụta atọ ahụ n’Igbo doro anya.
theological_decisions:
- issue: Echiche iwu na nke omume dị na ἥμαρτον
  choice: m mejọrọ
  alternative: emeghị m mmehie ọ bụla; emeghị m iwu ọ bụla
  rationale: ‘M mejọrọ’ na-echekwa ohere nke echiche omume/mmehie nke ἁμαρτάνω, ma n’otu oge ahụ dabara na ọnọdụ ikpe; ọ naghị eme ka okwu ahụ bụrụ naanị mmebi iwu ma ọ bụ mee ka ọ bụrụ naanị okwu okpukpe.
translation_notes:
  register: Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. ‘Zara ọnụ n’ịgbachitere onwe ya’ na-edobe ọnọdụ ụlọikpe; ‘ụlọnsọ ukwu’ bụ okwu Akwụkwọ Nsọ a na-aghọta nke ọma. Akara nkọwa [a] dị n’ederede isi.
