  text: ἐνεφάνισάν ⸀τε αὐτῷ ⸂οἱ ἀρχιερεῖς⸃ καὶ οἱ πρῶτοι τῶν Ἰουδαίων κατὰ τοῦ Παύλου, καὶ παρεκάλουν αὐτὸν
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/002.yaml
  text: So the chief priests and the leading men of the Jews presented their case against Paul to him[a], and they urged him,
translation:
  language: ig
  text: Ndị isi nchụàjà na ndị a ma ama n’etiti ndị Juu wetara ya okwu megide Pọl[a], ha nọgidere na-arịọ ya,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “mere ka ọ mara banyere Pọl” ma ọ bụ “wetara ebubo megide Pọl n’ihu ya.” Ngwaa Grik ahụ nwere ike ịpụta ime ka a mara otu okwu; n’ebe a, o yikarịrị ka ọ nwere echiche metụtara ikpe.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνεφάνισάν
  choice: wetara ya okwu ha nwere megide
  rationale: N’ọnọdụ ikpe a, ngwaa a pụtara ime ka onye ọchịchị mara ihe ma ọ bụ iweta okwu n’ihu ya. Nhọrọ a na-egosipụta ọnọdụ iwu ahụ n’enweghị itinye echiche nke ebubo e dere n’usoro iwu, nke Grik ekwughị kpọmkwem.
- source_word: τε
  choice: Ya mere
  rationale: Ọ bụ mkpụrụokwu njikọ na-ejikọta amaokwu a na ihe mere tupu ya; “Ya mere” na-eme ka usoro akụkọ ahụ gaa were were n’Igbo.
- source_word: αὐτῷ
  choice: ya
  rationale: Nnọchiaha a na-ezo aka na Festọs, bụ́ onye ha wetara okwu ahụ n’ihu ya.
- source_word: οἱ ἀρχιερεῖς
  choice: ndị isi nchụàjà
  rationale: Nke a bụ okwu Igbo doro anya maka ìgwè ndị ndu nchụàjà nọ na Jerusalem.
- source_word: οἱ πρῶτοι τῶν Ἰουδαίων
  choice: ndị a ma ama n’etiti ndị Juu
  rationale: πρῶτοι ebe a na-egosi ndị nwere ọkwá na mmetụta n’etiti ndị Juu. Nsụgharị a na-echekwa echiche nke ịbụ ndị kachasị pụta ìhè n’etiti ha.
- source_word: κατὰ τοῦ Παύλου
  choice: megide Pọl
  rationale: κατά ya na genitive ebe a na-egosi mmegide ma ọ bụ okwu ebubo, ọ bụghị nanị okwu banyere Pọl.
- source_word: παρεκάλουν
  choice: ha nọgidekwara na-arịọ ya
  rationale: Imperfect na-egosi arịrịọ na-aga n’ihu ma ọ bụ nke a na-eme ugboro ugboro. “Nọgidekwara na-arịọ” na-echekwa akụkụ a n’Igbo, ma dabara n’ọnọdụ ndọrọ ndọrọ ọchịchị na ikpe.
- source_word: αὐτόν
  choice: ya
  rationale: Nnọchiaha a na-ezo ọzọ aka na Festọs dịka onye ha na-arịọ.
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. A hapụrụ rikọm n’ọgwụgwụ n’ihi na ahịrịokwu ahụ na-aga n’ihu n’amaokwu na-esote. Akara nkọwa ala ala [a] dị ozugbo n’ebe okwu nwere ọtụtụ ụzọ ziri ezi isi ghọta ya dị.
