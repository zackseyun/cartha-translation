  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἡμερῶν δὲ διαγενομένων τινῶν Ἀγρίππας ὁ βασιλεὺς καὶ Βερνίκη κατήντησαν εἰς Καισάρειαν ἀσπασάμενοι τὸν Φῆστον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/013.yaml
  text: After some days had passed[a], King Agrippa and Bernice arrived at Caesarea to greet Festus.
translation:
  language: ig
  text: Mgbe ụbọchị ụfọdụ gasịrị, Eze Agripa na Berenis[a] bịarutere Sesaria ịkele Festọs.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ide aha Berenis dịka “Berenike,” nke dị nso n’ụdị Grik.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἡμερῶν δὲ διαγενομένων τινῶν
  choice: Mgbe ụbọchị ụfọdụ gasịrị
  rationale: Nkebiokwu a bụ genitive absolute nke na-egosi oge ihe sochirinụ mere. “Mgbe ... gasịrị” bụ Igbo doro anya ma dị mma; a hapụrụ δέ ka usoro akụkọ na-egosi njikọ ya n’ihi na ịgbakwunye “ma” ebe a ga-adị arọ.
- source_word: Ἀγρίππας ὁ βασιλεὺς
  choice: Eze Agripa
  rationale: E debere βασιλεύς dịka ezigbo utu aha, tinyekwa ya n’ihu aha onye ahụ dịka usoro Igbo si adịkarị.
- source_word: Βερνίκη
  choice: Berenis
  rationale: Nke a bụ ụdị aha ahụ ndị na-agụ Igbo nwere ike ịmata ngwa ngwa; e nyere ụdị ntụgharị mkpụrụedemede nke dị nso na Grik n’okpuru peeji.
- source_word: κατήντησαν εἰς Καισάρειαν
  choice: bịarutere Sesaria
  rationale: καταντάω n’ebe njem a pụtara iru ebe a na-aga; “bịarutere” na-egosi nke ahụ n’Igbo nkịtị. Sesaria bụ ntụgharị aha Καισάρεια.
- source_word: ἀσπασάμενοι τὸν Φῆστον
  choice: ịkele Festọs
  rationale: Participle a na-egosi ihe ha bịara ime ma ọ bụ ihe so mbata ha; “ịkele” na-edebe nghọta ahụ n’etinyeghị echiche pụrụ iche dịka ịsọpụrụ onye ọchịchị.
- source_word: Φῆστον
  choice: Festọs
  rationale: Ụdị a na-eme ka aha Rom ahụ kwekọọ n’usoro ụda na odide Igbo.
theological_decisions: []
translation_notes:
  register: E ji Igbo ọkọlọtọ nke oge a, nke dị mfe ma nwee ugwu, dee ya. A nọgidere na-edebe usoro akụkọ na nzube nke participle ahụ n’enweghị ịgbakwunye nkọwa gbasara emume eze ma ọ bụ mmekọrịta ndị a kpọrọ aha.
