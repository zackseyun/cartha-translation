id: ACT.25.27
reference: Acts 25:27
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἄλογον γάρ μοι δοκεῖ πέμποντα δέσμιον μὴ καὶ τὰς κατ’ αὐτοῦ αἰτίας σημᾶναι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/027.yaml
  text: For it seems unreasonable to me[a], when sending a prisoner, not also to indicate the charges against him.
translation:
  language: ig
  text: N’ihi na ọ dị m ka ọ bụ ihe na-enweghị ezi uche iziga onye mkpọrọ ma ghara igosikwa ebubo ndị e boro ya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “kọwapụta ebubo ndị e boro ya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλογον
  choice: ihe na-enweghị ezi uche
  rationale: Nkebi okwu a na-egosi ihe na-enweghị ezi echiche ma ọ bụ ezi ihe kpatara ya; ọ dabara n’ọnọdụ mkpebi ọchịchị Festọs ma dịkwa mfe nghọta n’Igbo ugbu a.
- source_word: δοκεῖ μοι
  choice: ọ dị m ka
  rationale: Nke a na-edobe ọdịdị okwu Grik nke na-egosi echiche onye na-ekwu okwu n’ụzọ na-adịghị ekwusi ike gabiga ókè.
- source_word: πέμποντα
  choice: iziga
  rationale: Infinitive Igbo a na-arụ ọrụ nke ọma n’usoro ahịrịokwu a ma na-egosi ọnọdụ nke iziga onye ahụ.
- source_word: δέσμιον
  choice: onye mkpọrọ
  rationale: Nke a bụ okwu Igbo doro anya maka onye e ji n’okpuru ikike iwu.
- source_word: μὴ καὶ
  choice: ma ghara igosikwa
  rationale: 'Mgbakwunye -kwa na-echekwa ike mgbakwunye nke καί: ọ bụghị naanị iziga onye mkpọrọ, kama igosikwa ebubo ya.'
- source_word: τὰς κατ’ αὐτοῦ αἰτίας
  choice: ebubo ndị e boro ya
  rationale: Nke a bụ okwu iwu sitere n’okike n’Igbo maka ebubo e kwuru megide mmadụ.
- source_word: σημᾶναι
  choice: igosipụta
  rationale: Ọ na-egosi ime ka ihe mara ma ọ bụ ikwupụta ya n’akwụkwọ/usoro ọchịchị, na-enweghị ịmanye nkọwa siri ike nke ‘ịdepụta kpọmkwem.’
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo izugbe, nke ugwu na nke doro ndị na-agụ akwụkwọ taa anya. E debere ụda mkpebi ọchịchị na obere ịdị nro dị na δοκεῖ μοι.
