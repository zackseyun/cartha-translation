  source_fidelity: 'The Igbo accurately represents the Greek sense: Festus judges it unreasonable to send a prisoner while failing also to state the charges against him. The personal, tentative force of δοκεῖ μοι is retained in “ọ dị m ka,” and “-kwa” appropriately conveys the additive force of καί.'
