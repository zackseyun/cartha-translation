  text: περὶ οὗ γενομένου μου εἰς Ἱεροσόλυμα ἐνεφάνισαν οἱ ἀρχιερεῖς καὶ οἱ πρεσβύτεροι τῶν Ἰουδαίων, αἰτούμενοι κατ’ αὐτοῦ ⸀καταδίκην·
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/015.yaml
  text: Concerning him[a], when I arrived in Jerusalem, the chief priests and the elders of the Jews informed me, asking for a sentence of condemnation against him.
translation:
  language: ig
  text: Mgbe m rutere Jerusalem, ndị isi nchụàjà na ndị okenye ndị Juu wetara okwu banyere ya n’ihu m, na-arịọ ka e maa ya ikpe ọmụma[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “na-arịọ ka a maa ya ikpe” ma ọ bụ “na-arịọ ka e kpebie na ikpe mara ya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ οὗ
  choice: Banyere ya
  rationale: Nkebi okwu a na-ezo aka na Pọl ma na-ebute okwu a na-ekwu banyere ya; “Banyere ya” bụ Igbo doro anya ma dị nso n'usoro Grik.
- source_word: γενομένου μου εἰς Ἱεροσόλυμα
  choice: mgbe m rutere na Jerusalem
  rationale: Genitive absolute a na γίνομαι tinyere εἰς na-egosi oge onye ahụ rutere n'ebe ahụ.
- source_word: ἐνεφάνισαν
  choice: kọọrọ m okwu ya
  rationale: N'ọnọdụ iwu na ọchịchị a, okwu ahụ pụtara ime ka onye ọchịchị mara ebubo ma ọ bụ okwu metụtara mmadụ; ntụgharị a na-asụ Igbo nke ọma ma ghara ịgbakwunye nkọwa karịrị isi mmalite.
- source_word: οἱ ἀρχιερεῖς
  choice: ndị isi nchụàjà
  rationale: Nke a bụ aha a na-ejikarị maka ndị ndu nchụàjà, ọ bụghị naanị otu nnukwu onye nchụàjà.
- source_word: οἱ πρεσβύτεροι τῶν Ἰουδαίων
  choice: ndị okenye ndị Juu
  rationale: Ọ na-egosi ndị okenye nke ndị Juu, n'ụzọ dị mfe ma bụrụ Igbo nkịtị.
- source_word: αἰτούμενοι
  choice: na-arịọ ka
  rationale: Ọ na-egosi arịrịọ ha mere n'otu oge ahụ ha wetara okwu ahụ n'ihu Festọs.
- source_word: κατ’ αὐτοῦ
  choice: e nye ya
  rationale: N'usoro “inye mmadụ ikpe ọmụma,” Igbo na-egosi na mkpebi ahụ megidere onye ahụ n'ụzọ eke, na-enweghị ikwughachi “megide ya” n'ụzọ siri ike.
- source_word: καταδίκην
  choice: ikpe ọmụma
  rationale: Ọ na-echekwa echiche nke mkpebi ụlọikpe na-ekwu na mmadụ mara ikpe, ọ bụghị naanị ịkatọ mmadụ n'ozuzu.
theological_decisions: []
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. E debere usoro “Banyere ya” iji gosipụta περὶ οὗ nke ọma, ebe okwu ikpe dị na ngwụcha ahịrịokwu na-echekwa ọnọdụ iwu nke amaokwu ahụ.
