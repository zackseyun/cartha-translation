- from: Banyere ya[a], mgbe m rutere na Jerusalem, ndị isi nchụàjà na ndị okenye ndị Juu kọọrọ m okwu ya, na-arịọ ka e nye ya ikpe ọmụma.
  to: Mgbe m rutere Jerusalem, ndị isi nchụàjà na ndị okenye ndị Juu wetara okwu banyere ya n’ihu m, na-arịọ ka e maa ya ikpe ọmụma[a].
  rationale: The revision removes the duplicated rendering of περὶ οὗ, gives ἐνεφάνισαν an idiomatic formal Igbo expression, and makes the requested καταδίκη explicitly condemnatory. It also relocates the footnote anchor to the judicial-request phrase that the note explains.
