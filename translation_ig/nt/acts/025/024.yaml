reference: Acts 25:24
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καί φησιν ὁ Φῆστος· Ἀγρίππα βασιλεῦ καὶ πάντες οἱ συμπαρόντες ἡμῖν ἄνδρες, θεωρεῖτε τοῦτον περὶ οὗ ⸀ἅπαν τὸ πλῆθος τῶν Ἰουδαίων ⸀ἐνέτυχόν μοι ἔν τε Ἱεροσολύμοις καὶ ἐνθάδε, ⸀βοῶντες μὴ δεῖν ⸂αὐτὸν ζῆν⸃ μηκέτι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/024.yaml
  text: And Festus says[a], “King Agrippa, and all the men present with us, you see this man, about whom the whole body of the Jews petitioned me, both in Jerusalem and here[b], shouting that he ought no longer to live.”
translation:
  language: ig
  text: Festọs wee sị[a], “Eze Agrịpa, na ndị ikom niile nọnyere anyị, unu na-ahụ nwoke a. Ọ bụ banyere ya ka ìgwè mmadụ ndị Juu dum gbara m arịrịọ, ma na Jerusalem ma n’ebe a, na-eti mkpu na o kwesịghị ịdị ndụ ọzọ[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'N’asụsụ Grik, ngwaa a dị n’oge ugbu a: “Festọs na-asị.” A na-eji ụdị a eme ka akụkọ dị ndụ.'
    reason: historical_present
  - marker: b
    text: A pụkwara ịsụgharị ya, “na o kwesịghị ịnọgide na-adị ndụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: φησιν
  choice: wee sị
  rationale: Igbo narrative naturally uses the consecutive past form here; retaining a literal historical present would sound less natural without adding meaningful force.
- source_word: συμπαρόντες ἡμῖν ἄνδρες
  choice: ndị ikom niile nọnyere anyị
  rationale: This preserves the explicitly male address and the sense of being present together with Festus.
- source_word: θεωρεῖτε τοῦτον
  choice: unu na-ahụ nwoke a
  rationale: A natural direct address that draws the assembly’s attention to Paul.
- source_word: ἅπαν τὸ πλῆθος τῶν Ἰουδαίων
  choice: ìgwè ndị Juu niile
  rationale: Ìgwè conveys a collective body or multitude, while niile preserves Festus’s sweeping rhetoric without requiring that every individual Jew be meant.
- source_word: ἐνέτυχόν μοι
  choice: bịakwutere m
  rationale: In context this means approaching Festus with a request or case; the surrounding clause supplies the force of their demand more naturally than a technical loanword would.
- source_word: ἔν τε Ἱεροσολύμοις καὶ ἐνθάδε
  choice: ma na Jerusalem ma n’ebe a
  rationale: The paired ma...ma construction naturally preserves Greek both...and.
- source_word: βοῶντες
  choice: na-eti mkpu
  rationale: This vividly represents loud, insistent crying out.
- source_word: μὴ δεῖν αὐτὸν ζῆν μηκέτι
  choice: na o kwesịghị ịdị ndụ ọzọ
  rationale: This preserves the modal force of δεῖν and the sense that, in their claim, he should no longer remain alive.
theological_decisions:
- issue: Reference to the Jews in a hostile legal context
  choice: ìgwè ndị Juu niile
  alternative: ndị ndú ndị Juu; ndị Juu niile
  rationale: The Greek explicitly names the Jews and uses a collective expression. The translation therefore neither narrows the referent to leaders nor turns the statement into an unqualified assertion about every Jewish individual.
translation_notes:
  register: Standard Igbo; natural, dignified courtroom narration. Names are rendered in familiar Igbo forms, and the sentence preserves Festus’s formal public address and the opposition’s forceful demand.
