  to: Festọs wee sị[a], “Eze Agrịpa, na ndị ikom niile nọnyere anyị, unu na-ahụ nwoke a. Ọ bụ banyere ya ka ìgwè mmadụ ndị Juu dum gbara m arịrịọ, ma na Jerusalem ma n’ebe a, na-eti mkpu na o kwesịghị ịdị ndụ ọzọ[b].”
