- from: Banyere nwoke a, enweghị m ihe doro anya m ga-edegara onyenwe m[a]. Ọ bụ ya mere m ji kpọpụta ya n’ihu unu niile, karịsịa n’ihu gị, Eze Agrịpa, ka, mgbe e nyochachara okwu ya[b], m nwee ihe m ga-ede.
  to: Banyere ya, enweghị m ihe ọ bụla doro anya m ga-ede degara eze ukwu[a]. Ọ bụ ya mere m ji kpọpụta ya n’ihu unu niile, karịsịa n’ihu gị, Eze Agrịpa, ka, mgbe emechara nnyocha ahụ[b], m nwee ihe m ga-ede.
