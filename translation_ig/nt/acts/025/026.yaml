id: ACT.25.26
reference: Acts 25:26
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: περὶ οὗ ἀσφαλές τι γράψαι τῷ κυρίῳ οὐκ ἔχω· διὸ προήγαγον αὐτὸν ἐφ’ ὑμῶν καὶ μάλιστα ἐπὶ σοῦ, βασιλεῦ Ἀγρίππα, ὅπως τῆς ἀνακρίσεως γενομένης σχῶ τί ⸀γράψω·
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/026.yaml
  text: Concerning him I have nothing definite to write to my lord[a]. Therefore I have brought him before you all, and especially before you, King Agrippa, so that, after the examination has taken place[b], I may have something to write.
translation:
  language: ig
  text: Banyere ya, enweghị m ihe ọ bụla doro anya m ga-ede degara eze ukwu[a]. Ọ bụ ya mere m ji kpọpụta ya n’ihu unu niile, karịsịa n’ihu gị, Eze Agrịpa, ka, mgbe emechara nnyocha ahụ[b], m nwee ihe m ga-ede.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’ụzọ nkịtị, “nye onyenwe m.” N’ọnọdụ ọchịchị Rom a, okwu Grik ahụ na-ezo aka n’eze ukwu.
    reason: alternative_reading
  - marker: b
    text: A pụkwara ịsụgharị ya “mgbe emechara ịnụ okwu ikpe ahụ” ma ọ bụ “mgbe emechara nchọpụta ahụ.” Ọ na-ezo aka na nyocha nke ikpe Pọl.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσφαλές τι
  choice: ihe doro anya
  rationale: N’ọnọdụ ọchịchị na ikpe a, okwu ahụ pụtara ihe siri ike ma doo anya nke a pụrụ ide n’akwụkwọ; nsụgharị a bụ Igbo nkịtị ma debe echiche ahụ.
- source_word: γράψαι
  choice: m ga-edegara
  rationale: Ọ na-egosi idegara onye a kpọrọ aha akwụkwọ ma ọ bụ akụkọ ọchịchị.
- source_word: τῷ κυρίῳ
  choice: onyenwe m
  rationale: Nke a na-edebe ụdị okwu Grik bụ ‘onye nwe/onyeisi,’ ebe ihe odide gbara ya gburugburu na-egosi na ọ bụ eze ukwu Rom ka a na-ekwu maka ya.
- source_word: διὸ
  choice: Ọ bụ ya mere
  rationale: Ọ na-egosi nsonaazụ sitere n’ihe Festọs kwuru tupu ya.
- source_word: προήγαγον
  choice: m ji kpọpụta ya
  rationale: Ngwaa ahụ pụtara ịkpọpụta ma ọ bụ iweta onye n’ihu ọgbakọ maka ilebara okwu ya anya.
- source_word: ἐφ’ ὑμῶν
  choice: n’ihu unu niile
  rationale: ‘Unu’ na-egosipụta na nnọchiaha Grik bụ ọtụtụ mmadụ, ma ‘niile’ na-eme ka ọdịiche ya na Agrịpa onye a kpọrọ kpọmkwem doo anya.
- source_word: μάλιστα ἐπὶ σοῦ
  choice: karịsịa n’ihu gị
  rationale: Ọ na-eme ka Agrịpa bụrụ onye Festọs lekwasịrị anya karịa ndị ọzọ nọ ebe ahụ.
- source_word: βασιλεῦ Ἀγρίππα
  choice: Eze Agrịpa
  rationale: A sụgharịrị aha ọrụ na aha onye ahụ kpọmkwem n’usoro Igbo kwesịrị ekwesị.
- source_word: ὅπως
  choice: ka
  rationale: ‘Ka’ na-egosipụta nzube n'ụzọ dị nkenke ma bụrụkwa Igbo ebumpụta ụwa.
- source_word: τῆς ἀνακρίσεως γενομένης
  choice: mgbe e nyochachara okwu ya
  rationale: Ọ na-egosipụta nyocha metụtara ikpe nke a ga-eme tupu Festọs enweta ihe ọ ga-ede.
- source_word: σχῶ τί γράψω
  choice: m nwee ihe m ga-ede
  rationale: Nke a na-edebe nkọwa okwu Grik n’ụzọ doro anya ma dị mfe n’Igbo.
theological_decisions:
- issue: Nsụgharị κύριος n’ọnọdụ ọchịchị na-abụghị aha Chineke
  choice: onyenwe m
  alternative: eze ukwu
  rationale: ‘Onyenwe m’ na-edebe okwu Grik n’ahịrị bụ isi n’agbanyeghị na ebe a ọ na-ezo aka n’eze ukwu Rom, ọ bụghị Chineke ma ọ bụ Kraịst. Ihe odide ala peeji na-eme ka onye a na-ezo aka na ya doo anya.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ ‘onyenwe m’ iji debe ụdị okwu Grik, tinyekwa nkọwa ala peeji maka eze ukwu. A sụgharịrị usoro iwu dị mgbagwoju anya n’ụzọ Igbo ebumpụta ụwa na-enweghị iwepụ ụda ikpe na ọchịchị.
