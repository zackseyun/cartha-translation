id: ACT.25.16
reference: Acts 25:16
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: πρὸς οὓς ἀπεκρίθην ὅτι οὐκ ἔστιν ἔθος Ῥωμαίοις χαρίζεσθαί τινα ⸀ἄνθρωπον πρὶν ἢ ὁ κατηγορούμενος κατὰ πρόσωπον ἔχοι τοὺς κατηγόρους τόπον τε ἀπολογίας λάβοι περὶ τοῦ ἐγκλήματος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/016.yaml
  text: To them I answered that it is not the custom of the Romans to hand over any man before the accused has the accusers face to face and receives an opportunity for a defense concerning the charge[a][b].
translation:
  language: ig
  text: Azara m ha na ọ bụghị omenala ndị Rom inyefe onye ọ bụla n’aka ndị na-ebo ya ebubo tupu onye ahụ a na-ebo ebubo ezute ndị na-ebo ya ebubo ihu na ihu, nwetaakwa ohere ịgbachitere onwe ya banyere ebubo ahụ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “inye onye ọ bụla dị ka amara.” Ngwaa Grik ahụ nwere ike ịpụta inyefe mmadụ iji mezuo arịrịọ onye na-ebo ya ebubo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔθος
  choice: omenala
  rationale: Ọ na-egosi usoro ma ọ bụ omume ndị mmadụ guzosiri ike; “omenala” dabara n’ọnọdụ iwu a ma bụrụkwa okwu ndị mmadụ na-aghọta.
- source_word: Ῥωμαίοις
  choice: ndị Rom
  rationale: Dative plural a na-ezo aka n’usoro ikpe nke ndị Rom n’ozuzu, ọ bụghị naanị otu ndị ọchịchị kpọmkwem.
- source_word: χαρίζεσθαί
  choice: inyefe onye ... n’aka ndị na-ebo ya ebubo
  rationale: N’ọnọdụ a, ngwaa ahụ pụtara inyefe mmadụ iji mezuo arịrịọ ndị na-ebo ya ebubo; ntụgharị a na-eme ka ihe gbasara ikpe doo anya.
- source_word: τινα ἄνθρωπον
  choice: onye ọ bụla
  rationale: N’Igbo, “onye ọ bụla” bụ ụzọ nkịtị na nke gụnyere nwoke ma ọ bụ nwaanyị isi kwuo okwu Grik a e ji mee ihe n’ozuzu.
- source_word: ὁ κατηγορούμενος
  choice: onye ahụ a na-ebo ebubo
  rationale: Nke a na-egosi kpọmkwem onye e boro ebubo n’enweghị iji okwu iwu siri ike nghọta.
- source_word: κατὰ πρόσωπον
  choice: ihu na ihu
  rationale: Ọ na-echekwa ike nke akpaalaokwu Grik nke pụtara izute ndị na-ebo mmadụ ebubo n’onwe ha.
- source_word: τόπον ... ἀπολογίας
  choice: ohere ịzọ onwe ya
  rationale: τόπος bụ ohere n’ebe a, ἀπολογία abụrụkwa ịza ebubo ma ọ bụ ịgbachitere onwe onye n’ụlọikpe; okwu a bụ nke ebumpụta ụwa n’Igbo.
- source_word: ἐγκλήματος
  choice: ebubo ahụ
  rationale: Ọ bụ ebubo iwu e boro onye ahụ; “ebubo” doro anya ma ghara ịdị oke teknịkal.
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo nke dị ugwu ma dị mfe nghọta mee ntụgharị ahụ. E mere ahịrịokwu ahụ ka ọ na-aga nke ọma n’Igbo, ma e chekwara usoro iwu dị na Grik. E tinyeghị nkọwa nwoke na footnote dị iche, n’ihi na “onye ọ bụla” n’Igbo enweghị akara okike ma na-anọchi anya mmadụ ọ bụla n’ụzọ ebumpụta ụwa.
