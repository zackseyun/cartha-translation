  text: Φῆστος οὖν ἐπιβὰς τῇ ἐπαρχείᾳ μετὰ τρεῖς ἡμέρας ἀνέβη εἰς Ἱεροσόλυμα ἀπὸ Καισαρείας,
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/001.yaml
  text: So Festus[a], after arriving in the province, went up from Caesarea to Jerusalem after three days,
translation:
  language: ig
  text: Ya mere, mgbe Festọs batara n’ógbè ọchịchị ahụ[a], ụbọchị atọ ka e mesịrị, o si Sesaria rịgoro Jerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Enwere ike ịtụgharị ya, “mgbe ọ banyere n’ógbè ọchịchị ahụ,” ma ọ bụ “mgbe ọ malitere ịchị ógbè ahụ.” Okwu Grik ahụ nwere ike igosi mbata Festọs n’ógbè ọ na-achị, nke nwekwara ike ime ka a ghọta na ọ malitere ọrụ ọchịchị ya n’ebe ahụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Φῆστος
  choice: Festọs
  rationale: E dere aha onye ahụ n’ụzọ dabara n’usoro mkpọpụta na odide Igbo.
- source_word: οὖν
  choice: Ya mere
  rationale: Ọ na-ejikọ akụkọ a na ihe ndị bu ya ụzọ ma na-egosi nzọụkwụ akụkọ na-esote.
- source_word: ἐπιβὰς τῇ ἐπαρχείᾳ
  choice: mgbe ... batara n’ógbè ọchịchị ahụ
  rationale: Nke a na-edobe echiche participle nke ịbanye ma ọ bụ iru n’ógbè Rom a na-achị, n’ebughị ụzọ kpebie na okwu ahụ pụtara kpọmkwem ịmalite ọrụ ọchịchị.
- source_word: ἐπαρχείᾳ
  choice: ógbè ọchịchị
  rationale: Ọ na-egosi ógbè nchịkwa Rom, ma okwu Igbo a na-eme ka ihe ahụ doo onye na-agụ taa anya.
- source_word: μετὰ τρεῖς ἡμέρας
  choice: ụbọchị atọ ka e mesịrị
  rationale: Ọ na-egosi na njem ahụ mere mgbe ụbọchị atọ gafere, ma ọ bụkwa okwu Igbo dị mfe ma bụrụ nke ebumpụta ụwa.
- source_word: ἀνέβη
  choice: rịgoro
  rationale: Ọ na-edobe okwu njem a na-ejikarị maka ịga Jerusalem, nke dị n’ebe dị elu.
- source_word: ἀπὸ Καισαρείας ... εἰς Ἱεροσόλυμα
  choice: si Sesaria ... Jerusalem
  rationale: Ọ na-egosi nke ọma ebe njem ahụ malitere na ebe ọ na-aga, n’usoro okwu dị mma n’Igbo.
theological_decisions: []
translation_notes:
  register: E ji Igbo ọkọlọtọ nke oge a, dị ùgwù ma dị mfe nghọta. A hapụrụ nghọta abụọ dị n’okwu ἐπιβὰς ka nkọwa ala peeji kọwaa ha, kama itinye otu nkọwa n’amaokwu ahụ dịka a ga-asị na ọ bụ naanị ya.
