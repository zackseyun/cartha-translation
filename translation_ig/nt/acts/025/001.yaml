  verdict: revise
  source_fidelity: 'Amaokwu ahụ n’onwe ya na-ekwuputara ihe Grik ahụ nke ọma: οὖν dị ka njikọ akụkọ, ἐπιβὰς τῇ ἐπαρχείᾳ dị ka mbata n’ógbè ọchịchị, μετὰ τρεῖς ἡμέρας dị ka oge sochirinụ, na ἀνέβη ... ἀπὸ Καισαρείας εἰς Ἱεροσόλυμα dị ka ịrịgo site na Sesaria gaa Jerusalem. Otú ọ dị, akara nkọwa ala peeji etinyere n’aha Festọs, ebe nkọwa ahụ na-akọwa ‘batara n’ógbè ọchịchị’; a ga-etinye ya n’akụkụ nkebi okwu ahụ.'
  naturalness: Igbo amaokwu ahụ bụ Igbo ọkọlọtọ a na-agụ nke ọma. ‘Ụbọchị atọ ka e mesịrị’ na ‘o si Sesaria rịgoro Jerusalem’ na-arụ ọrụ nke ọma n’usoro akụkọ a. E degharịrị nkọwa ala peeji ka o bụrụ Igbo eke karịa.
  terminology: ‘Ógbè ọchịchị’ na-egosi ἐπαρχεία n’ụzọ ziri ezi n’ọdịnaya ọchịchị Rom. ‘Festọs,’ ‘Sesaria,’ na ‘Jerusalem’ kwesịrị ekwesị. Nkọwa ala peeji ahụ na-edobe ohere pụtara ‘ịbata’ na nke pụtara ibido ọrụ ọchịchị, n’enweghị ịkpebi otu n’ime ha dịka naanị ihe okwu ahụ pụtara.
