revisions:
- from: Agrịpa wee sị Festọs, “Mụ onwe m ga-achọ ịnụ nwoke ahụ.”[a] Ọ na-ekwu, “Echi, ị ga-anụ ya.”[b][c]
  to: Agrịpa wee sị Festọs, “Mụ onwe m, ọ ga-adị m mma ịnụ nwoke ahụ.”[a] Ọ na-ekwu, “Echi, ị ga-anụ ya.”[b][c]
  rationale: Replaced “ga-achọ” with the more idiomatic courteous-desiderative expression “ọ ga-adị m mma ịnụ,” which corresponds well to Ἐβουλόμην (“I would like/wished to hear”) and avoids a misleading future reading. The emphasis of καὶ αὐτός is retained in “Mụ onwe m,” while the possible additive nuance remains documented in footnote a. The historical present and the alternative sense of ἀκούσῃ αὐτοῦ are preserved with their anchors.
