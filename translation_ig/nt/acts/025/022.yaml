base_translation:
  language: en
  yaml_path: translation/nt/acts/025/022.yaml
  text: Then Agrippa said to Festus[a], “I myself would like to hear the man.” “Tomorrow,” he says[c][b], “you will hear him.”
translation:
  language: ig
  text: Agrịpa wee sị Festọs, “Mụ onwe m, ọ ga-adị m mma ịnụ nwoke ahụ.”[a] Ọ na-ekwu, “Echi, ị ga-anụ ya.”[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “Mụ kwa chọrọ ịnụ nwoke ahụ,” ma ọ bụrụ na a ghọta καὶ αὐτός dịka ihe na-agbakwụnye echiche ‘mụ kwa,’ ọ bụghị naanị dịka nkwusi ike ‘mụ onwe m.’
    reason: lexical_alternative
  - marker: b
    text: 'Grik ji oge ugbu a nke akụkọ mee ihe: “ọ na-ekwu.” Ụfọdụ nsụgharị na-eme ka nke a bụrụ, “ọ sịrị.”'
    reason: lexical_alternative
  - marker: c
    text: A pụkwara ịsụ ya, “ị ga-anụ ihe si n’ọnụ ya.” Okwu Grik ahụ nwere ike ịpụta ịnụ onye ahụ ka ọ na-ekwu okwu n’onwe ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀγρίππας
  choice: Agrịpa
  rationale: E depụtara aha onye ahụ n’ụdị dabara n’usoro mkpọpụta na odide Igbo.
- source_word: δὲ
  choice: wee
  rationale: N’ebe a, δέ na-eme ka akụkọ gaa n’ihu; ‘wee’ na-enye usoro ahụ n’Igbo n’enweghị ime ka ọdịiche ya sie ike karịa ka o kwesịrị.
- source_word: πρὸς τὸν Φῆστον
  choice: sị Festọs
  rationale: N’ọnọdụ okwu a, πρός na-egosi onye a gwara okwu; ‘sị Festọs’ bụ ụzọ Igbo dị mfe ma bụrụkwa nke a na-anụkarị.
- source_word: Ἐβουλόμην
  choice: ga-achọ
  rationale: N’ọnọdụ a, imperfect nke βούλομαι na-egosi ọchịchọ e ji nkwanye ùgwù kwuo. ‘Ga-achọ’ na-enye echiche ‘would like’ n’Igbo nke oge a, kama ịtụgharị ya dịka naanị ọchịchọ gara aga.
- source_word: καὶ αὐτὸς
  choice: Mụ onwe m
  rationale: Nke a na-edobe nkwusi ike dị n’αὐτός n’ahịrịokwu ahụ. Enwerekwa ike ịghọta καί dịka ‘kwa,’ ya mere e debere nhọrọ ahụ n’okpuru peeji.
- source_word: τοῦ ἀνθρώπου
  choice: nwoke ahụ
  rationale: ἄνθρωπος ebe a na-arụtụ aka n’otu nwoke a maara, ya bụ Pọl, ọ bụghị mmadụ niile n’ozuzu.
- source_word: ἀκοῦσαι
  choice: ịnụ
  rationale: ‘Ịnụ’ na-edobe okwu Grik n’ụzọ dị mkpirikpi ma na-ekwe ka ọnọdụ ikpe ahụ gosi na ihe Agrịpa chọrọ bụ ịnụ nwoke ahụ ka ọ na-ekwu okwu.
- source_word: Αὔριον
  choice: Echi
  rationale: Nke a bụ ntụgharị kpọmkwem ma bụrụkwa okwu Igbo nkịtị maka oge a kpọrọ aha.
- source_word: φησίν
  choice: Ọ na-ekwu
  rationale: Grik ji historical present mee ka akụkọ ahụ dị ndụ; ‘Ọ na-ekwu’ na-edobe present ahụ kama ịgbanwe ya kpamkpam gaa n’oge gara aga.
- source_word: ἀκούσῃ αὐτοῦ
  choice: ị ga-anụ ya
  rationale: Genitive nke onye e ji ἀκούω soro nwere ike ịpụta ịnụ onye ahụ n’onwe ya ka ọ na-ekwu, ma ọ bụ ịnụ ihe si n’ọnụ ya; isi ederede na-edobe okwu dị mfe ma sara mbara.
