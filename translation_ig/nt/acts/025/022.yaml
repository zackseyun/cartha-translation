translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta, dee ya. A họọrọ ‘Mụ onwe m ga-achọ’ iji gosi ọchịchọ e kwuru n’ụzọ nkwanye ùgwù, ma e debere nghọta ọzọ nke καὶ αὐτός n’okpuru peeji. A hapụrụ historical present nke φησίν ka ọ bụrụ ‘Ọ na-ekwu,’ ọ bụ ezie na ‘ọ sịrị’ ga-adịkarị mfe n’akụkọ Igbo.
