  variant: Standard Igbo
source:
  edition: SBLGNT
  text: παραγενομένου δὲ αὐτοῦ περιέστησαν ⸀αὐτὸν οἱ ἀπὸ Ἱεροσολύμων καταβεβηκότες Ἰουδαῖοι, πολλὰ καὶ βαρέα αἰτιώματα ⸀καταφέροντες ἃ οὐκ ἴσχυον ἀποδεῖξαι,
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/007.yaml
  text: And when he arrived[a], the Jews who had come down from Jerusalem stood around him[b], bringing many serious charges that they were not able to prove.
translation:
  language: ig
  text: Mgbe ọ bịarutere, ndị Juu[b] ndị si Jerusalem rịdata guzoro ya gburugburu[a], na-ebo ya ọtụtụ ebubo dị oké njọ nke ha na-enweghị ike igosi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “gbara ya gburugburu.” Ngwaa Grik ahụ na-egosi iguzo mmadụ gburugburu ma ọ bụ ịgba ya gburugburu.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụ ya, “ndị Judia ndị si Jerusalem rịdata.” N’ebe a, a họọrọ “ndị Juu” n’ihi na okwu ahụ na-ezo aka ná ndị Juu si Jerusalem bịa ibo ebubo, ọ bụghị nanị ndị bi na Judia.
    reason: lexical_alternative
lexical_decisions:
- source_word: παραγενομένου δὲ αὐτοῦ
  choice: Mgbe ọ bịarutere
  rationale: Nkebi a bụ genitive absolute nke na-egosi oge ihe mere. Nsụgharị a bụ Igbo nkịtị ma na-edobe nnọchiaha ahụ dị ka ọ dị n’asụsụ mbụ.
- source_word: περιέστησαν αὐτὸν
  choice: guzoro ya gburugburu
  rationale: Ngwaa Grik ahụ pụtara iguzo mmadụ gburugburu ma ọ bụ ịgba ya gburugburu. Nhọrọ a na-egosi ọnọdụ ahụ n’ụlọikpe n’emeghị ka mmegide ha sie ike karịa ihe ederede kwuru.
- source_word: οἱ ἀπὸ Ἱεροσολύμων καταβεβηκότες Ἰουδαῖοι
  choice: ndị Juu ndị si Jerusalem rịdata
  rationale: Ἰουδαῖοι nwere ike ịpụta ‘ndị Juu’ ma ọ bụ ‘ndị Judia.’ N’ebe a, ọ na-ekwu banyere ndị Juu bụ́ ndị na-ebo ebubo, ndị si Jerusalem bịa; ‘ndị Juu’ kacha doo anya n’Igbo, ebe okwu ‘si Jerusalem’ egosilarị ebe ha si.
- source_word: πολλὰ καὶ βαρέα αἰτιώματα
  choice: ọtụtụ ebubo dị oké njọ
  rationale: αἰτιώματα bụ ebubo iwu, ebe βαρέα na-egosi na ebubo ndị ahụ dị arọ ma dị njọ. Okwu a doro anya ma daba n’ọnọdụ ikpe.
- source_word: καταφέροντες
  choice: na-ebo ya
  rationale: N’ọnọdụ ikpe, participle a na-egosi iweta ma ọ bụ ịkpọgide mmadụ ebubo. ‘Na-ebo ya’ bụ ụzọ Igbo si ekwu ya n’ụzọ kwụ ọtọ ma doo anya.
- source_word: ἃ οὐκ ἴσχυον ἀποδεῖξαι
  choice: bụ́ ndị ha na-enweghị ike igosi na ha bụ eziokwu
  rationale: ἰσχύω tinyere infinitive na-egosi inwe ike, ebe ἀποδείκνυμι pụtara igosi ma ọ bụ gosi ihe àmà. Nsụgharị a na-eme ka o doo anya na ha enweghị ike iji ihe àmà kwado ebubo ndị ahụ.
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta, sụgharịa amaokwu ahụ. E debere nnọchiaha ‘ọ’ ka a ghara itinye aha Pọl ebe ederede Grik n’onwe ya ji nnọchiaha. E tinyere akara nkọwa ụkwụ n’akụkụ okwu ndị ha na-akọwa, n’agbanyeghị na ọnọdụ akara ndị ahụ n’akwụkwọ ntụaka Bekee adabaghị na ọdịnaya nkọwa ya.
