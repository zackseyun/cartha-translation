revisions:
- from: Ya mere[a], ka ndị nọ n’etiti unu nwere ikike soro m gbadaa; ọ bụrụkwa na e nwere ihe ọjọọ ọ bụla n’ime nwoke ahụ, ka ha bo ya ebubo.[b]
  to: Ya mere[a], ka ndị nọ n’etiti unu nwere ikike soro m gbadaa; ọ bụrụkwa na e nwere ihe ọ bụla na-adịghị ekwesị n’ebe nwoke ahụ nọ, ka ha bo ya ebubo[b].
  rationale: The revision avoids overstating the broad Greek adjective ἄτοπον and replaces a literal but unnatural Igbo locative expression with an idiomatic one that maintains the source’s reference to fault in connection with the man. It also places the second footnote marker at its proper lexical anchor. The rendering of δυνατοί remains deliberately open, with alternatives supplied in the footnote.
