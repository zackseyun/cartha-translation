  text: Οἱ οὖν ⸂ἐν ὑμῖν, φησίν, δυνατοὶ⸃ συγκαταβάντες εἴ τί ἐστιν ἐν τῷ ἀνδρὶ ⸀ἄτοπον κατηγορείτωσαν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/005.yaml
  text: Therefore[a], let those among you who are able go down with me, and if there is anything wrong in the man[b], let them accuse him.
translation:
  language: ig
  text: Ya mere[a], ka ndị nọ n’etiti unu nwere ikike soro m gbadaa; ọ bụrụkwa na e nwere ihe ọ bụla na-adịghị ekwesị n’ebe nwoke ahụ nọ, ka ha bo ya ebubo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ka ndị isi nọ n’etiti unu,” ma ọ bụ “ka ndị nọ n’etiti unu nwere ike ime nke a.” Okwu Grik δυνατοί nwere ike ịpụta ndị dị ike, ndị a ma ama, ndị nwere ikike, ma ọ bụ ndị nwere ike ime ihe.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị okwu ikpeazụ ahụ, “ka ha wetara ya ebubo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἱ οὖν
  choice: Ya mere, ka ...
  rationale: οὖν na-egosi ihe na-esite n’okwu gara aga ma ọ bụ ihe a ga-eme n’ihi ya; “Ya mere” na-ebute echiche ahụ n’ụzọ Igbo dị mma.
- source_word: ἐν ὑμῖν ... δυνατοὶ
  choice: ndị nọ n’etiti unu nwere ikike
  rationale: δυνατοί nwere ike ịpụta ndị nwere ike ime ihe, ndị dị ike, ndị a ma ama, ma ọ bụ ndị nwere ikike. N’ọnọdụ ọchịchị na ikpe a, “ndị ... nwere ikike” na-egosi ndị ruru eru iso Festọs gaa, ma ihe a ka nwere nghọta ọzọ nke e dere n’ala ala peeji.
- source_word: φησίν
  choice: ahapụrụ ya n’ahịrị okwu
  rationale: φησίν bụ okwu nne na nna pụtara “ka ọ na-ekwu”; ebe amaokwu a na-aga n’ihu n’okwu Festọs kpọmkwem, ịhapụ ya na-eme ka Igbo bụrụ nke sitere n’ọnụ mmadụ ma ghara ịgbanwe onye na-ekwu okwu.
- source_word: συγκαταβάντες
  choice: soro m gbadaa
  rationale: Okwu a pụtara iso onye gbadaa. “Soro m” na-egosipụta σύν, “gbadaa” na-echekwa ụzọ e si akọ njem site na Jerusalem gaa Sesaria.
- source_word: εἴ τί ἐστιν
  choice: ọ bụrụ na e nwere ... ọ bụla
  rationale: Nke a na-echekwa ọnọdụ a na-ejighị n’aka na ike indefinit nke τί.
- source_word: ἐν τῷ ἀνδρὶ
  choice: n’ime nwoke ahụ
  rationale: Nke a na-echekwa ἐν n’ụzọ kwụ ọtọ ma na-egosi ihe ọjọọ a pụrụ ịhụ n’ime ya, kama ịgbanwe ya ozugbo ka ọ bụrụ naanị ebubo e nwere megide ya.
- source_word: ἄτοπον
  choice: ihe ọjọọ
  rationale: ἄτοπον bụ ihe na-ekwesịghị ekwesị, ihe na-adịghị mma, ma ọ bụ ihe ọjọọ. Nhọrọ a sara mbara, ya mere ọ naghị ekwubiga ya ókè dị ka “mpụ.”
- source_word: κατηγορείτωσαν αὐτοῦ
  choice: ka ha bo ya ebubo
  rationale: Nke a bụ ụzọ Igbo nkịtị si kwuo ịkatọ mmadụ n’ụlọ ikpe ma ọ bụ iweta ebubo megide ya.
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ “ndị ... nwere ikike” maka ọnọdụ ọchịchị na ikpe ahụ, ma e debere nghọta ndị ọzọ nke δυνατοί n’ala ala peeji ka a ghara imechi mgbagwoju anya dị n’isi mmalite. Akara [a] na [b] abụọ dị n’ahịrị amaokwu.
