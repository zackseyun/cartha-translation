base_translation:
  language: en
  yaml_path: translation/nt/acts/025/003.yaml
  text: asking a favor against him[a], that he would have him brought to Jerusalem, while setting an ambush to kill him on the way.
translation:
  language: ig
  text: na-arịọ ya ka o meere ha ihu ọma megide Pọl[a], ka o mee ka e bute ya gaa Jerusalem, mgbe ha na-echere ya n’ụzọ na nzuzo ka ha gbuo ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ka o meere ha ihu ọma banyere ya.” N’ọnọdụ a, okwu Grik ahụ na-egosi na ihu ọma ha rịọrọ ga-emegide Pọl.
    reason: lexical_alternative
lexical_decisions:
- source_word: αἰτούμενοι χάριν κατ’ αὐτοῦ
  choice: na-arịọ ya ka o meere ha amara megide Pọl
  rationale: Nke a na-egosipụta arịrịọ maka ihu ọma ma na-edobe ike mmegide dị na κατ’ αὐτοῦ. A kpọrọ Pọl aha iji mee ka onye nnọchiaha doo anya n'Igbo, ebe amaokwu bu ụzọ nyere onye a na-ekwu maka ya.
- source_word: ὅπως μεταπέμψηται αὐτὸν
  choice: ka o mee ka a kpọta ya
  rationale: Ọ na-enye ọdịnaya na nzube arịrịọ ahụ, ma na-egosipụta na Festọs ga-ahazi ka e si kpọta Pọl, kama ịsị na ọ ga-akpọta ya n'onwe ya.
- source_word: εἰς Ἰερουσαλήμ
  choice: na Jerusalem
  rationale: N'Igbo a na-ejikarị 'na' egosi ebe a na-aga ma ọ bụ ebe a nọ; ebe a, ọ pụtara ka a kpọta ya ruo Jerusalem.
- source_word: ἐνέδραν ποιοῦντες
  choice: ebe ha na-akwadebe izobe n’ụzọ
  rationale: Nkebi a na-egosi ihe ha nọ na-eme n'otu oge ahụ. 'Ịkwadebe izobe n'ụzọ' bụ okwu Igbo doro anya maka ịhazi mwakpo nzuzo.
- source_word: ἀνελεῖν αὐτὸν
  choice: gbuo ya
  rationale: Ọ na-enye ihe ἀναιρέω pụtara n'ọnọdụ a n'ụzọ kwụ ọtọ, na-etinyeghị nkọwa ikpe ma ọ bụ ụka ọzọ.
- source_word: κατὰ τὴν ὁδόν
  choice: n’ụzọ
  rationale: Nke a bụ ụzọ Igbo dị mfe ma bụrụ nke ebumpụta ụwa isi kwuo na ihe ahụ ga-eme n'oge njem.
