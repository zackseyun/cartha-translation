id: ACT.25.19
reference: Acts 25:19
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ζητήματα δέ τινα περὶ τῆς ἰδίας δεισιδαιμονίας εἶχον πρὸς αὐτὸν καὶ περί τινος Ἰησοῦ τεθνηκότος, ὃν ἔφασκεν ὁ Παῦλος ζῆν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/019.yaml
  text: Rather[a], they had certain disputes with him about their own religion and about a certain Jesus who had died, whom Paul claimed to be alive.
translation:
  language: ig
  text: Kama nke ahụ,[a] ha na ya nwere esemokwu ụfọdụ banyere okpukpe nke ha, nakwa banyere otu onye aha ya bụ Jizọs, onye nwụrụ, onye Pọl na-ekwu na ọ dị ndụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “banyere nkwenkwe ụgha nke ha.” Okwu Grik a pụrụ ịpụta “okpukpe” n’enweghị nlelị, ma ọ bụ “nkwenkwe ụgha” n’ụzọ nlelị, karịsịa n’ọnụ onye na-esighị n’okpukpe ahụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ζητήματα
  choice: esemokwu ụfọdụ
  rationale: Okwu a na-egosi ihe ndị a na-arụrịta ụka, ọ bụghị naanị ajụjụ ndị a na-ajụ iji nweta ihe ọmụma.
- source_word: δέ
  choice: Kama nke ahụ
  rationale: N'okwu ndị gbara amaokwu a gburugburu, ọ na-egosi ọdịiche dị n'etiti ebubo mpụ Festọs tụrụ anya ya na ihe ndị ha kpọpụtara n'ezie.
- source_word: περὶ τῆς ἰδίας δεισιδαιμονίας
  choice: banyere okpukpe nke ha
  rationale: δεισιδαιμονία nwere ike ịpụta okpukpe n'ụzọ na-anọghị n'akụkụ ọ bụla ma ọ bụ nkwenkwe ụgha n'ụzọ nlelị. 'Okpukpe nke ha' doro anya ma na-echekwa anya onye mba ọzọ Festọs ji lee okwu ahụ.
- source_word: εἶχον πρὸς αὐτόν
  choice: ha na ya nwere
  rationale: Usoro a na-egosi na ha na Pọl nwere ihe ndị ha na-arụrịta ụka; ntụgharị a bụ Igbo ebumpụta ụwa ma ọ naghị etinye nkọwa iwu karịrị nke Grik.
- source_word: καὶ περί τινος Ἰησοῦ
  choice: nakwa banyere otu nwoke a na-akpọ Jizọs
  rationale: τινος na-egosi otú Festọs si kwuo banyere Jizọs dị ka onye ọ na-amachaghị. N'Igbo, nke a na-ebute ịdị anya ahụ n'ụzọ eke karịa ntụgharị mkpụrụokwu nke 'otu Jizọs.'
- source_word: τεθνηκότος
  choice: onye nwụrụ anwụ
  rationale: Perfect participle ahụ na-egosi ọnọdụ sitere n'ọnwụ, ma mekwaa ka ọdịiche ya na nkwupụta na ọ dị ndụ pụta ìhè.
- source_word: ὃν ἔφασκεν ὁ Παῦλος ζῆν
  choice: ma Pọl na-ekwu na ọ dị ndụ
  rationale: φάσκω na-akọ nkwupụta Pọl n'ọnụ Festọs n'enweghị nkwenye Festọs n'onwe ya. 'Na-ekwu' na-echekwa ọnọdụ onye na-akọ akụkọ n'enweghị mkpebi megide eziokwu nke mbilite n'ọnwụ.
theological_decisions:
- issue: Ntụgharị δεισιδαιμονία n'okwu Festọs
  choice: okpukpe
  alternative: nkwenkwe ụgha
  rationale: Okwu Grik ahụ nwere ike ịbụ nke na-anọghị n'akụkụ ọ bụla ma ọ bụ nwee ntakịrị nlelị. 'Okpukpe' anaghị ebubata mkparị siri ike karịa ihe isi mmalite chọrọ; ihe ọzọ dị na nkọwa ala peeji na-echekwa nghọta abụọ ahụ.
- issue: Otú e si kọwaa nkwupụta banyere ịdị ndụ Jizọs
  choice: Pọl na-ekwu na ọ dị ndụ
  alternative: Pọl na-ekwusi ike na ọ dị ndụ
  rationale: Nke a na-egosi na Festọs na-akọ ihe Pọl kwuru, ọ bụghị na onye na-ede akwụkwọ na-eme nkwupụta ozugbo n'ahịrịokwu a. Ọ naghịkwa agọnahụ eziokwu nke mbilite n'ọnwụ e kwadoro n'ebe ndị ọzọ.
translation_notes:
  register: Asụsụ Igbo Izugbe, nke oge a, dị ùgwù ma dị mfe nghọta. E ji 'otu nwoke a na-akpọ Jizọs' mee ka ịdị anya Festọs pụta n'ụzọ Igbo ebumpụta ụwa; e chekwara mgbagwoju anya dị na δεισιδαιμονία site na nkọwa ala peeji.
