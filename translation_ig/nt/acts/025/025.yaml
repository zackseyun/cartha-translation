  to: Ma achọpụtara m na ọ dịghị ihe ọ bụla o mere nke kwesịrị ọnwụ; ma ebe ọ bụ na ya onwe ya rịọrọ ka Eze Ukwu[a] kpee ikpe ya, ekpebiri m iziga ya.
  rationale: The revision retains the source's first-person judicial finding, the emphatic "ya onwe ya," the causal circumstance of the appeal, and Festus's decision. It replaces an ambiguous expression for appealing with an idiomatic Igbo legal request and repairs the footnote's phrasing.
