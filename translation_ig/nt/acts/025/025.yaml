  text: ἐγὼ δὲ ⸀κατελαβόμην μηδὲν ἄξιον ⸂αὐτὸν θανάτου⸃ πεπραχέναι, ⸀αὐτοῦ δὲ τούτου ἐπικαλεσαμένου τὸν Σεβαστὸν ἔκρινα ⸀πέμπειν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/025.yaml
  text: But I found that he had done nothing deserving death; and because he himself appealed to the Emperor[a], I decided to send him.
translation:
  language: ig
  text: Ma achọpụtara m na ọ dịghị ihe ọ bụla o mere nke kwesịrị ọnwụ; ma ebe ọ bụ na ya onwe ya rịọrọ ka Eze Ukwu[a] kpee ikpe ya, ekpebiri m iziga ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya ‘Ọgọstọs.’ Utu aha Grik bụ Σεβαστός na-ezo aka n'ebe a n'Eze Ukwu Rom.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατελαβόμην
  choice: achọpụtara m
  rationale: N'ọnọdụ ikpe a, okwu a na-egosi ihe Festọs chọpụtara ma ọ bụ kwubiri mgbe o nyochachara okwu ahụ; ‘achọpụtara m’ bụ Igbo doro anya nke na-adịghị eme ka ọ bụrụ mkpebi ikpe ikpeazụ.
- source_word: μηδὲν ἄξιον ... θανάτου
  choice: o nweghị ihe ọ bụla o mere nke kwesịrị ọnwụ
  rationale: Nke a na-egosi na ọ dịghị omume onye ahụ mere nke kwesịrị ka e gbuo ya, ma ọ naghị etinye nkọwa iwu karịrị nke Grik kwuru.
- source_word: αὐτὸν θανάτου πεπραχέναι
  choice: o mere ... nke kwesịrị ọnwụ
  rationale: Usoro accusative na infinitive nke Grik ghọrọ nkebiokwu ọdịnaya n'Igbo, nke na-asụpụta echiche ahụ n'ụzọ ebumpụta ụwa.
- source_word: πεπραχέναι
  choice: o mere
  rationale: ‘O mere’ na-edobe obosara nke πράσσω ma kwekọọ n'ọnọdụ ikpe ahụ.
- source_word: αὐτοῦ δὲ τούτου ἐπικαλεσαμένου
  choice: ebe ọ bụ na ya onwe ya kpọrọ oku
  rationale: ‘Ebe ọ bụ na’ na-egosi ọnọdụ nwere ike ịbụ ihe kpatara mkpebi Festọs, ‘ya onwe ya’ na-edobekwa nkwusi ike dị na Grik.
- source_word: ἐπικαλεσαμένου
  choice: kpọrọ oku ka ... kpee ikpe ya
  rationale: N'ọnọdụ iwu Rom, okwu a pụtara ịrịọ ka ọchịchị eze ukwu nụ ikpe ahụ; nsụgharị a na-eme ka echiche nke ịrịọ ikpe dị elu doo onye Igbo anya.
- source_word: τὸν Σεβαστόν
  choice: Eze Ukwu
  rationale: Σεβαστός bụ utu aha nke eze ukwu Rom n'ebe a, ọ bụghị aha Kesọ Ọgọstọs onye mbụ; ‘Eze Ukwu’ na-egosi onye e zoro aka na ya nke ọma.
- source_word: ἔκρινα
  choice: ekpebiri m
  rationale: Okwu a na-egosi mkpebi ọchịchị Festọs mere, ‘ekpebiri m’ bụkwa okwu Igbo dị mfe ma kwesị ekwesị.
- source_word: πέμπειν
  choice: iziga ya
  rationale: A tinyere ‘ya’ n'ihi na ihe a na-ezo aka na ya doro anya site n'ọnọdụ okwu ahụ, dịka ụtọasụsụ Igbo chọrọ.
theological_decisions: []
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ debere olu onye mbụ nke Festọs, nkwusi ike dị na ‘ya onwe ya,’ na njikọ dị n'etiti arịrịọ Pọl na mkpebi iziga ya.
