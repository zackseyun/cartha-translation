  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ μὲν οὖν Φῆστος ἀπεκρίθη τηρεῖσθαι τὸν Παῦλον ⸂εἰς Καισάρειαν⸃, ἑαυτὸν δὲ μέλλειν ἐν τάχει ἐκπορεύεσθαι·
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/004.yaml
  text: Festus therefore answered that Paul was being kept in Caesarea, and that he himself was about to leave shortly.
translation:
  language: ig
  text: Ya mere, Festọs zara na a na-edebe Pọl na Sizaria, nakwa na ya onwe ya ga-apụ n’oge na-adịghị anya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τηρεῖσθαι
  choice: a na-edebe
  rationale: Na-egosipụta infinitive dị n’ụdị passive, nke pụtara na a na-ejide ma ọ bụ na-eche Pọl nche, n’agbanyeghị na e kwughị kpọmkwem onye na-eme ya.
- source_word: εἰς Καισάρειαν
  choice: na Sesaria
  rationale: N’agbanyeghị na εἰς na-abụkarị ‘banye na,’ n’ebe a ọ na-arụ ọrụ dị ka ihe na-egosi ebe a na-edebe Pọl; ‘na Sesaria’ bụ Igbo eke ma kwekọọ n’ihe okwu ahụ pụtara n’ọnọdụ a.
- source_word: ἑαυτὸν
  choice: ya onwe ya
  rationale: 'Na-echekwa nkwusi ike nke reflexive pronoun ahụ: Festọs kwuru banyere onwe ya n’onwe ya.'
- source_word: ἐν τάχει
  choice: n’oge na-adịghị anya
  rationale: Na-enye echiche nke ime ihe ngwa ngwa ma ọ bụ n’oge dị nso n’ụzọ doro ndị na-agụ Igbo anya.
- source_word: ἐκπορεύεσθαι
  choice: ga-apụ ebe ahụ
  rationale: Na-egosipụta ọpụpụ Festọs n’ebe ọ nọ, n’agbanyeghị na amaokwu a ekwughị ebe ọ nọ kpọmkwem.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo izugbe, dị ugbu a ma nwee ugwu. Ahịrịokwu ahụ na-edobe usoro akụkọ nke Grik, ma jiri njikọ ‘nakwa na’ mee ka okwu abụọ Festọs zara doo anya.
