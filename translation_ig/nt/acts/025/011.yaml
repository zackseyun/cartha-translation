id: ACT.25.11
reference: Acts 25:11
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἰ μὲν ⸀οὖν ἀδικῶ καὶ ἄξιον θανάτου πέπραχά τι, οὐ παραιτοῦμαι τὸ ἀποθανεῖν· εἰ δὲ οὐδέν ἐστιν ὧν οὗτοι κατηγοροῦσίν μου, οὐδείς με δύναται αὐτοῖς χαρίσασθαι· Καίσαρα ἐπικαλοῦμαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/011.yaml
  text: If[a], then, I am doing wrong and have done anything deserving death, I do not refuse to die. But if there is nothing to the things these men are accusing me of, no one can hand me over to them as a favor. I appeal to Caesar.
translation:
  language: ig
  text: Ya mere, ọ bụrụ na m na-eme ihe ọjọọ, ma emewokwa m ihe ọ bụla kwesịrị ọnwụ, anaghị m ajụ ịnwụ. Ma ọ bụrụ na ihe ndị a na-ebo m ebubo enweghị ihe ndabere, ọ dịghị onye pụrụ inyefe m n’aka ha iji meere ha amara.[a] Ana m arịọ Siza ka o kpee m ikpe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “inyefe m n’aka ha iji mee ha obi ụtọ.” Ngwaa Grik ahụ gụnyere echiche nke inye ma ọ bụ inyefe mmadụ dịka amara a na-emere onye ọzọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀδικῶ
  choice: m na-eme ihe ọjọọ
  rationale: Ụdị ngwaa dị ugbu a na-egosi omume ma ọ bụ ọnọdụ na-aga n’ihu; okwu a na-edobekwa ma akụkụ omume ọma na akụkụ iwu dị na ya.
- source_word: ἄξιον θανάτου
  choice: kwesịrị ọnwụ
  rationale: Nke a na-egosi na ihe ahụ ruru ntaramahụhụ ọnwụ, ma ọ naghị akọwapụta karịa ihe okwu Grik kwuru.
- source_word: πέπραχά τι
  choice: meekwa ihe ọ bụla
  rationale: Ọ na-edobe obosara nke τι ma na-egosipụta omume e mere nke ka dị mkpa n’ikpe ahụ ugbu a.
- source_word: οὐ παραιτοῦμαι τὸ ἀποθανεῖν
  choice: anaghị m ajụ ịnwụ
  rationale: Nke a na-egosipụta nke ọma na Pọl adịghị agbanahụ ọnwụ ma ọ bụrụ na ikpe ọnwụ ahụ ziri ezi.
- source_word: οὐδέν ἐστιν ὧν οὗτοι κατηγοροῦσίν μου
  choice: ihe ndị ndị a na-ebo m ebubo enweghị isi
  rationale: Akpaalaokwu Igbo a na-egosi na ebubo ndị ahụ enweghị ihe ndabere, n’etinyeghị okwu ọzọ dịka ‘abụghị eziokwu’ n’ime ederede.
- source_word: χαρίσασθαι
  choice: inyefe m n’aka ha iji meere ha amara
  rationale: Ọ na-ejikọta inyefe mmadụ na ime ndị ọzọ amara, bụ isi echiche dị n’okwu Grik n’ọnọdụ ikpe a.
- source_word: Καίσαρα ἐπικαλοῦμαι
  choice: Ana m arịọ ka Siza kpee ikpe m
  rationale: Nke a na-eme ka arịrịọ iwu a ka e kpegharịa ikpe n’ihu eze ukwu doo onye Igbo nke oge a anya.
- source_word: μὲν οὖν ... δὲ
  choice: Ya mere, ọ bụrụ na ... Ma ọ bụrụ na
  rationale: 'Ọ na-edobe usoro arụmụka ahụ: ọnọdụ nke mbụ, emesịa ọnọdụ nke abụọ na-emegide ya.'
theological_decisions:
- issue: Ihe okwu Pọl banyere ọnwụ na ịrịọ Siza pụtara n’usoro ikpe
  choice: Pọl kwuru n’ụzọ nwere ọnọdụ na ọ gaghị ajụ ọnwụ ma ọ bụrụ na o mere ihe kwesịrị ya, ma jụ ka e nyefe ya n’aka ndị na-ebo ya ebubo ma ebubo ha enweghị isi.
  alternative: Iwere okwu ya dịka nanị ụzọ o si ekwu okwu n’arụghị ụka na usoro ikpe nwere ike ịbụ nke ziri ezi.
  rationale: Ederede ahụ bụ okwu metụtara ikpe n’ụzọ bụ isi. Nsụgharị a na-edobe ọnọdụ Pọl kwuru na esemokwu dị n’etiti ịnakwere ikpe ziri ezi na ịjụ inyefe ya n’ụzọ na-ezighị ezi, n’enweghị itinye ozizi sara mbara banyere ntaramahụhụ ọnwụ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta. A họọrọ ‘enweghị isi’ maka ebubo na-enweghị ihe ndabere, ebe ‘inyefe m n’aka ha’ na-eme ka ọnọdụ iwu na ihe ize ndụ dị na ya pụta ìhè.
