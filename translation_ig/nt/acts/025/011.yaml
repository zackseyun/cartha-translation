revisions:
- from: Ya mere, ọ bụrụ na m na-eme ihe ọjọọ, meekwa ihe ọ bụla kwesịrị ọnwụ, anaghị m ajụ ịnwụ. Ma ọ bụrụ na ihe ndị ndị a na-ebo m ebubo enweghị isi, ọ dịghị onye pụrụ inyefe m n’aka ha iji meere ha amara.[a] Ana m arịọ ka Siza kpee ikpe m.
  to: Ya mere, ọ bụrụ na m na-eme ihe ọjọọ, ma emewokwa m ihe ọ bụla kwesịrị ọnwụ, anaghị m ajụ ịnwụ. Ma ọ bụrụ na ihe ndị a na-ebo m ebubo enweghị ihe ndabere, ọ dịghị onye pụrụ inyefe m n’aka ha iji meere ha amara.[a] Ana m arịọ Siza ka o kpee m ikpe.
  rationale: The revision keeps the source’s conditional legal argument intact, clarifies that the accusations lack substantiation rather than merely sounding senseless, and makes the appeal explicitly directed to Caesar. No doctrinal interpretation has been added.
