id: ACT.2.19
reference: Acts 2:19
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ δώσω τέρατα ἐν τῷ οὐρανῷ ἄνω καὶ σημεῖα ἐπὶ τῆς γῆς κάτω, αἷμα καὶ πῦρ καὶ ἀτμίδα καπνοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/019.yaml
  text: 'And I will give wonders in the heaven above and signs on the earth below: blood and fire and a cloud of smoke.'
translation:
  language: ig
  text: 'M ga-enye ihe ịtụnanya n’eluigwe n’elu na ihe ịrịba ama n’ụwa n’okpuru: ọbara na ọkụ na alụlụ anwụrụ ọkụ.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “igwe ojii anwụrụ ọkụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δώσω
  choice: M ga-enye
  rationale: Nke a na-asụgharị ọdịnihu nke δίδωμι ozugbo dị ka ‘M ga-enye,’ ma na-edobe ụda amụma nke Chineke na-enye ma ọ bụ na-eme ka ihe ịrịba ama pụta.
- source_word: τέρατα
  choice: ihe ịtụnanya
  rationale: Okwu a na-egosi ihe pụrụ iche na-akpalite egwu na ịtụnanya; ‘ihe ịtụnanya’ sara mbara karịa ‘ọrụ ebube’ ma dabara n’ihe ịrịba ama ndị metụtara eluigwe na ụwa.
- source_word: ἐν τῷ οὐρανῷ ἄνω
  choice: n’eluigwe n’elu
  rationale: Nke a na-edobe ma οὐρανός ma ἄνω, tinyekwa ya n’ụzọ doro anya megide ‘n’ụwa n’okpuru.’
- source_word: σημεῖα
  choice: ihe ịrịba ama
  rationale: ‘Ihe ịrịba ama’ na-egosi ihe nwere ihe ọ na-akọwa ma ọ bụ na-atụ aka na ya, ọ bụghị naanị ihe dị ịtụnanya.
- source_word: ἐπὶ τῆς γῆς κάτω
  choice: n’ụwa n’okpuru
  rationale: N’ihi na okwu a na-emegide ‘eluigwe n’elu,’ γῆ bụ ‘ụwa’ ebe a, ọ bụghị naanị ala otu obodo ma ọ bụ ala a na-azọ ụkwụ.
- source_word: αἷμα
  choice: ọbara
  rationale: Nsụgharị kpọmkwem nke na-edobe oyiyi amụma ahụ.
- source_word: πῦρ
  choice: ọkụ
  rationale: Nsụgharị kpọmkwem nke na-edobe oyiyi doro anya nke amaokwu ahụ.
- source_word: ἀτμίδα καπνοῦ
  choice: alụlụ anwụrụ ọkụ
  rationale: ἀτμίς pụtara alụlụ ma ọ bụ uzuoku. ‘Alụlụ anwụrụ ọkụ’ na-esochi okwu Grik nso ma bụrụkwa okwu Igbo a pụrụ ịghọta nke ọma.
theological_decisions:
- issue: Ebe ihe ịrịba ama ndị a dị n’amụma Joel
  choice: eluigwe n’elu … ụwa n’okpuru
  alternative: mbara igwe n’elu … ala n’okpuru
  rationale: Njikọ a na-egosi ọdịiche zuru ụwa ọnụ n’etiti eluigwe na ụwa ma na-edobe obosara nke oyiyi amụma ahụ, na-enweghị ime ka ọ bụrụ naanị ihe metụtara ihu igwe ma ọ bụ otu ala.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta, dee ya. E debere nkwughachi ‘n’eluigwe n’elu’ na ‘n’ụwa n’okpuru’ n’ihi nhazi na nkwusi ike dị n’asụsụ Grik.
