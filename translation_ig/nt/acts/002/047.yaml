  text: αἰνοῦντες τὸν θεὸν καὶ ἔχοντες χάριν πρὸς ὅλον τὸν λαόν. ὁ δὲ κύριος προσετίθει τοὺς σῳζομένους καθ’ ἡμέραν ⸂ἐπὶ τὸ αὐτό⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/047.yaml
  text: praising God and having favor with all the people[a]. And the Lord was adding day by day those who were being saved to them.
translation:
  language: ig
  text: na-eto Chineke, na-enwetakwa ihu ọma n’aka ndị mmadụ niile. Onyenwe anyị na-agbakwụnyekwa kwa ụbọchị ndị a na-azọpụta n’ime otu ha[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’ọnụ” ma ọ bụ “n’otu ebe.” Okwu Grik ἐπὶ τὸ αὐτό nwere ike ịpụta ịgbakwụnye ha n’ime otu ahụ, ịnọ n’ọnụ, ma ọ bụ ịnọ n’otu ebe; e kwesịghị izochi nghọta ndị ọzọ ndị a.
    reason: alternative_reading
lexical_decisions:
- source_word: αἰνοῦντες
  choice: na-eto
  rationale: Na-egosi omume otuto ahụ na-aga n’ihu, dịka participle dị na present si kwuo.
- source_word: τὸν θεόν
  choice: Chineke
  rationale: Ọ bụ onye a na-eto; nke a bụ ntụgharị Igbo kwụ ọtọ ma bụrụkwa nke a na-ejikarị eme ihe.
- source_word: ἔχοντες χάριν πρὸς ὅλον τὸν λαόν
  choice: na-enwetakwa ihu ọma n’aka ndị mmadụ niile
  rationale: Akpaalaokwu a pụtara na ndị mmadụ niile nwere obi ọma n’ebe ha nọ; ‘inweta ihu ọma n’aka’ na-egosipụta nke ahụ n’Igbo doro anya n’emeghị ka ọ pụta na ha bụ ndị na-emere ndị mmadụ amara.
- source_word: ὁ δὲ κύριος
  choice: Onyenwe anyị
  rationale: Aha a na-asọpụrụ nke a na-ejikarị sụgharị κύριος n’Igbo; njikọ dị na δέ pụtara site na usoro ahịrịokwu.
- source_word: προσετίθει
  choice: na-agbakwụnyekwa
  rationale: Ụdị imperfect na-egosi omume na-aga n’ihu ma ọ bụ na-eme ugboro ugboro; ‘na-agbakwụnye’ na-echekwa akụkụ ahụ.
- source_word: τοὺς σῳζομένους
  choice: ndị a na-azọpụta
  rationale: 'Na-echekwa present passive participle: a na-ele nzọpụta anya dịka ihe a na-eme ha, n’akọwaghị ya naanị dịka ọnọdụ e mechara.'
- source_word: καθ’ ἡμέραν
  choice: kwa ụbọchị
  rationale: Ọ bụ ụzọ Igbo e si egosi omume na-eme ụbọchị ruo ụbọchị.
- source_word: ἐπὶ τὸ αὐτό
  choice: n’otu ha
  rationale: N’ọnọdụ a, ọ dabara n’omume ịgbakwụnye mmadụ n’otu ndị kwere ekwe, ma ọ naghị etinye okwu ‘ọnụ ọgụgụ’ nke na-adịghị n’asụsụ Grik. E debere nghọta ndị ọzọ n’ala peeji.
theological_decisions:
- issue: Akụkụ na nkà mmụta okpukpe nke nzọpụta na τοὺς σῳζομένους
  choice: ndị a na-azọpụta
  alternative: ndị a zọpụtara; ndị a zọpụtarala
  rationale: Present passive participle na-egosi nzọpụta dịka omume a na-eme ndị ahụ. Ntugharị a anaghị ekpebi esemokwu ụka banyere usoro nzọpụta, kama ọ na-echekwa ọdịdị okwu Grik.
- issue: Ihe ἐπὶ τὸ αὐτό na-ezo aka na ya
  choice: n’otu ha
  alternative: ọnụ; n’otu ebe ahụ
  rationale: N’ihi προσετίθει, ihe kacha kwekọọ n’ọnọdụ a bụ na Onyenwe anyị na-agbakwụnye ha n’otu ahụ. Ma okwu Grik nwekwara ike ịpụta ‘ọnụ’ ma ọ bụ ‘n’otu ebe ahụ,’ ya mere e chekwara nghọta ndị ahụ n’ala peeji.
translation_notes:
  register: Asụsụ Igbo izugbe, nke ugbu a ma dị ùgwù. E ji usoro ‘na-’ chekwaa omume ndị na-aga n’ihu, ma zere okwu ụka pụrụ iche nke otu denominashọn.
