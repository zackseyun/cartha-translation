review_pass:
  verdict: revise
  source_fidelity: 'Isi ntụgharị ahụ na-esochi Grik nke ọma: participle ndị mbụ na-egosi omume na-aga n’ihu, ‘ihu ọma n’aka ndị mmadụ niile’ na-enye ntụziaka πρὸς... nke ọma, ‘ndị a na-azọpụta’ na-echekwa present passive, ‘kwa ụbọchị’ na-egosi καθ’ ἡμέραν. Ma ‘n’otu ha’ adịghị edo anya nke ọma n’Igbo dịka ebe/otu a na-agbakwunye mmadụ; ‘n’ime otu ha’ na-ekwu nke a n’ụzọ doro anya, ebe ala peeji na-echekwa nghọta ndị ọzọ nke ἐπὶ τὸ αὐτό.'
  naturalness: Asụsụ ahụ bụ Igbo izugbe ma kwekọọ na ndekọ Akwụkwọ Nsọ. ‘N’ime otu ha’ dịkwuo eke ma doo anya karịa ‘n’otu ha’ mgbe ngwaa bụ ‘na-agbakwụnye.’ E degharịkwara ala peeji ka ‘ọnụ’ ghara ịdị ka ‘ọnụ ọgụgụ’ kama ọ pụta n’echiche ‘together.’
  terminology: ‘Chineke,’ ‘Onyenwe anyị,’ ‘ihu ọma,’ na ‘nzọpụta’ bụ okwu kwesịrị ekwesị. ‘Onyenwe anyị’ bụ aha nsọpụrụ Igbo a na-ejikarị maka κύριος n’ọnọdụ a; ọ naghị agbakwunye nkọwa ozizi.
  issues:
  - severity: medium
    issue: ‘n’otu ha’ adịghị eke nke ọma ma nwekwaa mgbagwoju anya n’ọnọdụ a.
    rationale: Ọ nwere ike ịpụta ịdị n’otu, ọ bụghị ịbanye n’ìgwè obodo a na-agbakwụnye mmadụ. ‘n’ime otu ha’ na-enye ihe προσετίθει chọrọ n’Igbo n’emeghị ka ‘ọnụ ọgụgụ’ bụrụ okwu a na-ahụghị n’Grik.
  - severity: low
    issue: Nkọwa ala peeji ‘ọnụ’ chọrọ ka e doo ya anya.
    rationale: Naanị ‘ọnụ’ nwere ike ịghọta dịka ọnụ ọgụgụ. ‘n’ọnụ’ na-eme ka nghọta ‘together’ pụta nke ọma ma debe ‘n’otu ebe’ dịka nhọrọ ọzọ.
  revised_text: na-eto Chineke, na-enwetakwa ihu ọma n’aka ndị mmadụ niile. Onyenwe anyị na-agbakwụnyekwa kwa ụbọchị ndị a na-azọpụta n’ime otu ha[a].
