  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἦσαν δὲ ⸀ἐν Ἰερουσαλὴμ κατοικοῦντες Ἰουδαῖοι, ἄνδρες εὐλαβεῖς ἀπὸ παντὸς ἔθνους τῶν ὑπὸ τὸν οὐρανόν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/005.yaml
  text: There were Jews living in Jerusalem[b][a], devout men from every nation under heaven.
translation:
  language: ig
  text: E nwere ndị Juu[a] bi na Jerusalem—ndị ikom na-atụ egwu Chineke, ndị si na mba niile dị n’okpuru eluigwe[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị “ndị Juu” dị ka “ndị Judia.” Ma n’ebe a, ihe gbara okwu ahụ gburugburu na-akwado nghọta sara mbara nke agbụrụ na okpukpe, n’ihi na e kwuru na ha si na mba niile dị n’okpuru eluigwe.
    reason: alternative_reading
  - marker: b
    text: “N’okpuru eluigwe” bụ akpaalaokwu Akwụkwọ Nsọ nke pụtara n’ụwa niile.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἦσαν δὲ
  choice: E nwere
  rationale: Nke a na-egosi na ndị ahụ nọ ebe ahụ ma na-eme ka akụkọ gaa n’ihu n’ụzọ Igbo si ada nke ọma, n’etinyeghị okwu oge na-adịghị na Grik.
- source_word: ἐν Ἰερουσαλὴμ κατοικοῦντες
  choice: bi na Jerusalem
  rationale: “Bi” na-egosi ibi n’ebe ahụ, ọ bụghị naanị ịnọ nwa oge; “Jerusalem” bụ aha obodo a na-ejikarị.
- source_word: Ἰουδαῖοι
  choice: ndị Juu
  rationale: N’ebe a okwu ahụ na-ezo aka n’ìgwè ndị Juu n’ụzọ agbụrụ na okpukpe, ebe ọ bụ na ha si na mba dị iche iche, ọ bụghị naanị ndị bi na Judia.
- source_word: ἄνδρες
  choice: ndị ikom
  rationale: Okwu Grik a kpọmkwem pụtara ndị nwoke, ya mere e chekwara nkọwa nwoke dị na isi mmalite.
- source_word: εὐλαβεῖς
  choice: ji nsọpụrụ na-efe Chineke
  rationale: Nkebiokwu a na-egosi nsọpụrụ miri emi na ndụ ofufe n’asụsụ Igbo doro anya ma dị ugwu.
- source_word: ἀπὸ παντὸς ἔθνους
  choice: ndị si na mba niile
  rationale: “Mba niile” na-egosipụta oke zuru ụwa ọnụ nke okwu Luk, na-enweghị ịsụ na onye ọ bụla n’ime mba niile ga-anọrịrị ebe ahụ.
- source_word: τῶν ὑπὸ τὸν οὐρανόν
  choice: dị n’okpuru eluigwe
  rationale: A hapụrụ akpaalaokwu Akwụkwọ Nsọ ahụ n’ụdị Igbo a ga-aghọta, ebe nkọwa ala peeji na-akọwa ihe ọ pụtara.
theological_decisions:
- issue: Ihe Ἰουδαῖοι pụtara
  choice: ndị Juu
  alternative: ndị si Judia
  rationale: Ndị a bi na Jerusalem ma si “na mba niile dị n’okpuru eluigwe”; ya mere ihe gbara ya gburugburu kwadoro nghọta agbụrụ na okpukpe sara mbara karịa naanị ndị obodo Judia.
- issue: Ichekwa nwoke dị na ἄνδρες
  choice: ndị ikom
  alternative: ndị mmadụ
  rationale: ἄνδρες bụ okwu akọwapụtara maka ndị nwoke; ịsụgharị ya “ndị mmadụ” ga-ewepụ nkọwa dị n’isi mmalite.
- issue: Onye a na-asọpụrụ n’okwu εὐλαβεῖς
  choice: ji nsọpụrụ na-efe Chineke
  alternative: ndị ji okpukpe kpọrọ ihe
  rationale: Ọ bụ ezie na εὐλαβεῖς ekwughị θεός kpọmkwem, n’ọnọdụ a ọ na-akọwa nsọpụrụ okpukpe nke ndị Juu. Nsụgharị a na-eme ka Igbo doo anya n’etinyeghị ozizi otu ụka.
translation_notes:
  register: Ejiri Standard Igbo dị ugbu a, nke dị mfe nghọta ma dị ugwu. Ahịrị ogologo ahụ nwere akara ogologo iji kewaa nkọwa banyere ndị Juu n’ụzọ na-agụ nke ọma. E tinyere akara ala peeji [a] ozugbo n’akụkụ “ndị Juu,” na [b] n’akụkụ akpaalaokwu “n’okpuru eluigwe.”
