revisions:
- from: A ga-eme ka anyanwụ ghọọ ọchịchịrị, meekwa ka ọnwa ghọọ ọbara, tupu nnukwu ụbọchị Onyenwe anyị ahụ nke pụtara ìhè[a] abịa.
  to: A ga-eme ka anyanwụ ghọọ ọchịchịrị, a ga-emekwa ka ọnwa ghọọ ọbara, tupu nnukwu ụbọchị Onyenwe anyị ahụ nke pụtara ìhè[a] abịa.
  rationale: The revision changes only the coordination of the parallel future clauses for clearer Standard Igbo grammar and refines one lexical alternative in the footnote. It preserves the source’s imagery, ambiguity in ἐπιφανῆ, biblical register, and theological terminology.
