id: ACT.2.20
reference: Acts 2:20
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ ἥλιος μεταστραφήσεται εἰς σκότος καὶ ἡ σελήνη εἰς αἷμα πρὶν ⸀ἢ ⸀ἐλθεῖν ἡμέραν κυρίου τὴν μεγάλην καὶ ἐπιφανῆ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/020.yaml
  text: The sun will be turned into darkness[a], and the moon into blood, before the great and glorious day of the Lord comes.
translation:
  language: ig
  text: A ga-eme ka anyanwụ ghọọ ọchịchịrị, a ga-emekwa ka ọnwa ghọọ ọbara, tupu nnukwu ụbọchị Onyenwe anyị ahụ nke pụtara ìhè[a] abịa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “nke dị ebube” ma ọ bụ “nke a ma ama.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μεταστραφήσεται
  choice: A ga-eme ka ... ghọọ
  rationale: Usoro a na-egosi mgbanwe e mere n’ụzọ kwekọrọ na future passive nke Grik, ma na-ada nke ọma n’Igbo ugbu a.
- source_word: εἰς σκότος
  choice: ghọọ ọchịchịrị
  rationale: Ọ na-egosi ọnọdụ ọhụrụ ihe ahụ ghọrọ, dị ka εἰς si egosi n’ebe a.
- source_word: εἰς αἷμα
  choice: ghọọ ọbara
  rationale: A hapụrụ ihe atụ amụma ahụ n’ụzọ siri ike ma kwụ ọtọ, kama ịkọwa ya dịka naanị ụcha ọbara.
- source_word: πρὶν ἢ ἐλθεῖν
  choice: tupu ... abịa
  rationale: Nke a bụ ụzọ Igbo doro anya ma dị ndụ si egosi na otu ihe ga-ebu ụzọ mee tupu nke ọzọ abịa.
- source_word: ἡμέραν κυρίου
  choice: ụbọchị Onyenwe anyị
  rationale: Ọ na-echekwa akpaokwu amụma Akwụkwọ Nsọ ma na-ezere ime ka a ghọta ya dịka aha ụbọchị izu.
- source_word: μεγάλην
  choice: nnukwu
  rationale: “Nnukwu” bụ okwu Igbo nkịtị na nke kwesịrị ekwesị maka μέγας n’ọnọdụ a.
- source_word: ἐπιφανῆ
  choice: nke pụtara ìhè
  rationale: Nhọrọ a na-echekwa isi echiche nke ihe doro anya, nke a na-ahụ nke ọma, ma ọ bụ nke pụrụ iche, n’agbanyeghị na okwu Grik ahụ nwekwara ike ibu echiche nke ịdị ebube.
theological_decisions:
- issue: Ịsụgharị ἡμέραν κυρίου n’amaokwu amụma Joel nke Pita hotara
  choice: ụbọchị Onyenwe anyị
  alternative: ụbọchị nke Onyenwe anyị
  rationale: Akpaokwu a na-echekwa echiche Akwụkwọ Nsọ banyere ụbọchị pụrụ iche nke Onyenwe anyị ga-abịa mee ihe, n’enweghị ịtụgharị ya ka ọ bụrụ aha ụbọchị izu.
- issue: Ịsụgharị ἐπιφανῆ n’ọnọdụ banyere ụbọchị Onyenwe anyị
  choice: nke pụtara ìhè
  alternative: nke dị ebube; nke pụrụ iche
  rationale: Okwu Grik ahụ nwere ike ịpụta ihe a na-ahụ nke ọma ma ọ bụ ihe mara mma ma dị ebube. E debere echiche nke ịdị pụta ìhè n’ahịrị amaokwu, tinyekwa nhọrọ ndị ọzọ n’okpuru ala ka a ghara ikpochapụ obosara ihe okwu ahụ pụtara.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ugwu ma dị mfe nghọta. Akpaokwu “A ga-eme ka” na-echekwa ọdịdị passive nke Grik n’ụzọ Igbo na-anabata nke ọma; “ọnwa ghọọ ọbara” na-echekwakwa ihe atụ amụma ahụ n’enweghị ịkọwa ya gabiga ihe ederede kwuru.
