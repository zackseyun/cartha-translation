- from: 'Ebe ọ hụrụ nke a tupu oge eruo, o kwuru banyere mbilite n’ọnwụ nke Mezaya[b]: na a hapụghị ya n’ala ndị nwụrụ anwụ[a][c], anụ ahụ ya ahụghịkwa ire ere[d].'
  to: 'N’ịhụ ihe a tupu oge eruo, o kwuru banyere mbilite n’ọnwụ nke Mesaịa[b]: na a hapụghị ya n’ala ndị nwụrụ anwụ[a][c], anụ ahụ ya ahụghịkwa ire ere[d].'
  rationale: The revision preserves the Greek syntax and its deliberately paired negative assertions, while improving Standard Igbo idiom and regularizing the title Messiah as “Mesaịa.” The notes have been revised for grammatical Igbo and for precise handling of εἰς and Hades, without imposing a doctrinal interpretation.
