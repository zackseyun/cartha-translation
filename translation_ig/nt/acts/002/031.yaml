id: ACT.2.31
reference: Acts 2:31
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: προϊδὼν ἐλάλησεν περὶ τῆς ἀναστάσεως τοῦ χριστοῦ ὅτι ⸂οὔτε ἐγκατελείφθη⸃ εἰς ⸀ᾅδην ⸀οὔτε ἡ σὰρξ αὐτοῦ εἶδεν διαφθοράν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/031.yaml
  text: 'Foreseeing this[a], he spoke about the resurrection of the Messiah: that he was neither abandoned to Hades[d][c][b], nor did his flesh see decay.'
translation:
  language: ig
  text: 'N’ịhụ ihe a tupu oge eruo, o kwuru banyere mbilite n’ọnwụ nke Mesaịa[b]: na a hapụghị ya n’ala ndị nwụrụ anwụ[a][c], anụ ahụ ya ahụghịkwa ire ere[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “a hapụghị ya ka ọ dịrị n’ala ndị nwụrụ anwụ.” Grik εἰς pụtara n'ụzọ kpọmkwem “nye” ma ọ bụ “banyere n’ime”; n’akpaalaokwu a, isi ihe bụ na a gbahapụghị ya n’ebe ndị nwụrụ anwụ.
    reason: lexical_alternative
  - marker: b
    text: Okwu Grik ahụ bụ Christos; ebe a, a sụgharịrị ya “Mesaịa” n’ihi na echiche aha ọkwá ahụ pụtara ìhè n’otu Pita si eji Akwụkwọ Nsọ arụ ụka. Nsụgharị ọdịnala bụ “Kraịst.”
    reason: alternative_reading
  - marker: c
    text: “Ala ndị nwụrụ anwụ” bụ Hedis, ya bụ, ebe ndị nwụrụ anwụ; ọ bụghị kpọmkwem ebe ikpe ikpeazụ.
    reason: cultural_note
  - marker: d
    text: A pụkwara ịsụgharị ya, “anụ ahụ ya ahụghịkwa mbibi.” N’ebe a, okwu ahụ na-ekwu maka ire ere nke anụ ahụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: προϊδὼν
  choice: Ebe ọ hụrụ nke a tupu oge eruo
  rationale: Ọ na-egosi na Devid buru ụzọ ghọta ihe ga-eme n’ọdịnihu tupu o kwuo okwu ahụ. E tinyere “nke a” site n’ihe gbara amaokwu ahụ gburugburu ka okwu Igbo wee bụrụ nke doro anya.
- source_word: ἐλάλησεν
  choice: o kwuru
  rationale: N’Igbo nkịtị, “o kwuru” na-egosi ikwu okwu banyere otu isiokwu nke ọma ma kwekọọ n’ọrụ λαλέω n’ebe a.
- source_word: περὶ τῆς ἀναστάσεως
  choice: banyere mbilite n’ọnwụ
  rationale: περί tinyere genitive pụtara “banyere,” ebe ἀνάστασις n’ebe a bụ isi n’ọnwụ bilie.
- source_word: τοῦ χριστοῦ
  choice: nke Mezaya
  rationale: Χριστός na-arụ ọrụ dị ka aha ọkwá nke Onye E Tere Mmanụ ahụ Devid buru amụma banyere ya; “Mezaya” na-eme ka echiche aha ọkwá ahụ pụta ìhè.
- source_word: οὔτε ἐγκατελείφθη
  choice: a hapụghị ya
  rationale: Ụdị passive a pụtara na a gbahapụghị ya ma ọ bụ na a hapụghị ya n’ebe ahụ. Okwu a dị mfe ma dịkwa ike n’Igbo.
- source_word: εἰς ᾅδην
  choice: n’ala ndị nwụrụ anwụ
  rationale: ᾅδης bụ ebe ma ọ bụ ọchịchị ndị nwụrụ anwụ, ọ bụghị kpọmkwem ebe ikpe ikpeazụ. “N’ala ndị nwụrụ anwụ” na-enye onye Igbo nke oge a nghọta ahụ n’enweghị ịgwakọta ya na ọkụ ala mmụọ.
- source_word: ἡ σὰρξ αὐτοῦ
  choice: anụ ahụ ya
  rationale: σάρξ n’ebe a na-ekwu kpọmkwem banyere akụkụ ahụ nke mmadụ, ọ bụghị banyere ọchịchọ mmehie. “Anụ ahụ ya” na-echekwa ike okwu Grik ahụ ma bụrụkwa Igbo doro anya.
- source_word: εἶδεν διαφθοράν
  choice: ahụghịkwa ire ere
  rationale: Nke a na-echekwa akpaalaokwu Grik “ịhụ ire ere” ma na-ekwu maka ire ere nke ozu n’ụzọ ndị mmadụ na-aghọta ngwa ngwa.
theological_decisions:
- issue: Nsụgharị Χριστός
  choice: Mezaya
  alternative: Kraịst
  rationale: N’arụmụka Pita sitere n’Akwụkwọ Nsọ, okwu ahụ bụ aha ọkwá nke Onye E Tere Mmanụ e kwere ná nkwa, ya mere “Mezaya” na-eme ka ọrụ aha ọkwá ahụ pụta ìhè.
- issue: Nsụgharị ᾅδης
  choice: ala ndị nwụrụ anwụ
  alternative: Hedis
  rationale: Nhọrọ a na-egosi ebe ndị nwụrụ anwụ n’ozuzu ya ma zere ịkọwa okwu ahụ dị ka ebe ikpe ikpeazụ.
- issue: Nsụgharị σάρξ
  choice: anụ ahụ
  alternative: ahụ
  rationale: Ọnọdụ a bụ banyere ahụ nkịtị nke Mezaya na ire ere ya, ọ bụghị banyere ọdịdị mmehie; “anụ ahụ” na-echekwa ọdịdị okwu mbụ ahụ.
- issue: Mmekọrịta εἰς na ngwaa passive
  choice: n’ala ndị nwụrụ anwụ
  alternative: nye ala ndị nwụrụ anwụ
  rationale: εἰς nwere ike igosi “n’ime/ruo,” ma n’okwu e hotara ebe a, isi ihe bụ na a hapụghị ya ka ọ nọgide n’ebe ndị nwụrụ anwụ. Nsụgharị ahụ anaghị ekpebi ihe karịrị ihe ederede kwuru.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ugwu ma dị mfe nghọta, dee ya. Ahịrịokwu ahụ na-echekwa usoro amụma, mbilite n’ọnwụ, na ihe abụọ a jụrụ—ịhapụ ya n’ala ndị nwụrụ anwụ na ire ere nke anụ ahụ—n’enweghị itinye nkọwa otu ụka pụrụ iche.
