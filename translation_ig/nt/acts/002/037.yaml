  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἀκούσαντες δὲ κατενύγησαν ⸂τὴν καρδίαν⸃, εἶπόν τε πρὸς τὸν Πέτρον καὶ τοὺς λοιποὺς ἀποστόλους· Τί ⸀ποιήσωμεν, ἄνδρες ἀδελφοί;
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/037.yaml
  text: When they heard this[a], they were pierced to the heart, and they said to Peter and the rest of the apostles, “What should we do[b], brothers?”
translation:
  language: ig
  text: Mgbe ha nụrụ ihe a, a dụrụ ha n’obi[a], ha wee sị Pita na ndịozi ndị ọzọ, “Ụmụnna[b], gịnị ka anyị kwesịrị ime?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “obi ha mapụrụ ha.” Okwu Grik a na-akọwa mmetụta miri emi, dị ka ihe dị nkọ kụrụ mmadụ n’obi.
    reason: lexical_alternative
  - marker: b
    text: N’asụsụ Grik, “ndị nwoke, ụmụnna.” Nke a bụ usoro e ji akpọ ndị mmadụ okwu; dabere n’ọnọdụ, ọ pụrụ ịpụta “ụmụnna” ma ọ bụ “ụmụnna nwoke na nwanyị.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀκούσαντες
  choice: Mgbe ha nụrụ ihe a
  rationale: Nkebi a na-egosi oge mmeghachi omume ha malitere mgbe ha nụrụ okwu Pita; “ihe a” na-ezo aka n’okwu ahụ e kwuru tupu amaokwu a.
- source_word: δὲ
  choice: —
  rationale: N’ebe a δέ na-akwalite akụkọ n’ihu, ọ bụghị nnukwu ntụnyere. Usoro ahịrịokwu Igbo na-egosi njikọ ahụ nke ọma n’enweghị ịgbakwunye “ugbu a.”
- source_word: κατενύγησαν τὴν καρδίαν
  choice: a dụrụ ha n’obi
  rationale: Nke a na-edobe ihe atụ Grik nke ihe dị nkọ mapụrụ ma ọ bụ dụọ mmadụ n’ime obi, ma na-egosi mwute na amamikpe siri ike.
- source_word: εἶπόν τε
  choice: ha wee sị
  rationale: “Wee” jikọtara ihe ha kwuru na mmetụta batara ha n’obi, ebe “sị” na-asụgharị λέγω n’enweghị ịgbanwe ya ka ọ bụrụ naanị ‘jụọ.’
- source_word: πρὸς τὸν Πέτρον καὶ τοὺς λοιποὺς ἀποστόλους
  choice: sị Pita na ndịozi ndị ọzọ
  rationale: N’Igbo, usoro “sị mmadụ” bụ ụzọ ebumpụta ụwa isi kwuo onye a gwara okwu; “ndị ọzọ” na-egosi ndịozi ndị fọdụrụ ma e wezụga Pita.
- source_word: Τί ποιήσωμεν
  choice: gịnị ka anyị kwesịrị ime?
  rationale: Nke a na-egosi ajụjụ ntụgharị uche banyere ihe kwesịrị ekwesị ha ga-eme, dịka subjunctive Grik si dị.
- source_word: ἄνδρες ἀδελφοί
  choice: Ụmụnna
  rationale: “Ụmụnna” bụ okwu nkwanye ùgwù na nke mmekọrịta mmadụ na ibe ya n’Igbo; ọ na-ezere ikwughachi okwu abụọ n’ụzọ na-adịghị ada ụtọ, ebe ndetu ala na-echekwa ụdị okwu Grik kpọmkwem.
theological_decisions:
- issue: Okwu a kpọrọ ndị a na-agwa okwu nke nwere akara nwoke
  choice: Ụmụnna
  alternative: Ndị nwoke, ụmụnna; ụmụnna nwoke na nwanyị
  rationale: Grik ji okwu abụọ dị n’ụdị nwoke, ma ọ bụkwa usoro e ji akpọ ndị mmadụ okwu nke pụrụ ịgụnye ọgbakọ dum dabere n’ọnọdụ. Isi ederede na-eji “ụmụnna,” ebe ndetu ala na-echekwa ma ụdị Grik kpọmkwem ma ohere nghọta sara mbara.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. E debere ihe atụ nke ịdụ mmadụ n’obi kama ịkọwa ya naanị dịka amamikpe, ma e tinyere akara ndetu ozugbo n’akụkụ okwu ndị ndetu ahụ metụtara.
