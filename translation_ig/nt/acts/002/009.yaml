id: ACT.2.9
reference: Acts 2:9
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Πάρθοι καὶ Μῆδοι καὶ Ἐλαμῖται, καὶ οἱ κατοικοῦντες τὴν Μεσοποταμίαν, Ἰουδαίαν τε καὶ Καππαδοκίαν, Πόντον καὶ τὴν Ἀσίαν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/009.yaml
  text: Parthians and Medes and Elamites[a], and those living in Mesopotamia, Judea and Cappadocia, Pontus and Asia[b],
translation:
  language: ig
  text: Ndị Patia, ndị Midia na ndị Elam, na ndị bi na Mesopotemia, Judia na Kapadosia[a], Pọntọs na Eshia[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “ndị bi na Mesopotemia ... na Judia nakwa Kapadosia.” Okwu Grik τε καί nwere ike ịbụ naanị “na,” ma ọ bụ nwee obere echiche nke ịgbakwụnye ihe ọzọ.
    reason: lexical_alternative
  - marker: b
    text: Nke a bụ ógbè Rom a na-akpọ Eshia, nke dị n’ebe ọdịda anyanwụ Eshia Maịnọ; ọ bụghị kọntinent Eshia nke oge a.
    reason: cultural_note
lexical_decisions:
- source_word: Πάρθοι
  choice: Ndị Patia
  rationale: A sụgharịrị aha agbụrụ a n’ụdị e si ede ya n’Igbo, tinyekwa “Ndị” iji gosi na ọ bụ ndị mmadụ.
- source_word: Μῆδοι
  choice: ndị Midia
  rationale: Nke a bụ aha ndị si Media; ụdị “Midia” dabara n’usoro mkpọpụta na ide aha mba n’Igbo.
- source_word: Ἐλαμῖται
  choice: ndị Elam
  rationale: E debere Elam dị ka aha ebe na agbụrụ, ebe “ndị” na-eme ka ihe ọ na-ezo aka na ya doo anya.
- source_word: οἱ κατοικοῦντες
  choice: ndị bi na
  rationale: Nkebi a na-ezo aka ná ndị na-ebi n’ebe ndị a; “ndị bi na” bụ Igbo dị mfe ma na-edebe echiche participle ahụ.
- source_word: τὴν Μεσοποταμίαν
  choice: Mesopotemia
  rationale: E ji ụdị aha ala a a na-aghọta n’Igbo mee ihe, na-enweghị ịsụgharị aha ahụ n’ụzọ nkọwa.
- source_word: Ἰουδαίαν
  choice: Judia
  rationale: E debere ya dị ka aha ógbè Judia, ọ bụghị dị ka nkọwa gbasara agbụrụ ma ọ bụ okpukpe.
- source_word: τε καὶ
  choice: na
  rationale: “Na” na-ejikọta Judia na Kapadosia n’Igbo n’ụzọ ebumpụta ụwa; obere echiche mgbakwunye dị na τε καί nwere ike ịpụta dịka “nakwa,” nke e debere na nkọwa ala peeji.
- source_word: Καππαδοκίαν
  choice: Kapadosia
  rationale: Nke a bụ ụdị mkpọpụta Igbo kwesịrị ekwesị maka aha ógbè ahụ.
- source_word: Πόντον
  choice: Pọntọs
  rationale: A haziri aha ógbè ahụ ka ọ kwekọọ na ụda na mkpụrụedemede Igbo.
- source_word: τὴν Ἀσίαν
  choice: Eshia
  rationale: E debere aha a n’ahịrị bụ isi, ma nkọwa ala peeji na-akọwa na ọ bụ ógbè Rom oge ahụ, ọ bụghị kọntinent Eshia nke oge a.
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta mee ihe. E tinyere “Ndị” n’aha agbụrụ atọ mbụ, ma debe aha ógbè ndị ọzọ n’ụdị e si akpọ ha n’Igbo. E doziri akara nkọwa ala peeji ka nke ọ bụla guzoro n’akụkụ okwu ọ na-akọwa.
