  source_fidelity: 'Ndepụta agbụrụ na ógbè ahụ na-agbaso Grik SBLGNT nke ọma: ndị Patia, Midia, Elam; ndị bi na Mesopotemia; Judia na Kapadosia; Pọntọs na Eshia. “Ndị bi na” na-anọchi anya οἱ κατοικοῦντες n’enweghị mgbakwunye nkọwa. “Na” n’etiti Judia na Kapadosia bụ ntụgharị kwesịrị ekwesị nke τε καί, na-enweghị ịmanye nuansi ya karịa ka Igbo si achọ.'
