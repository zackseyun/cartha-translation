  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὃν ὁ θεὸς ἀνέστησεν λύσας τὰς ὠδῖνας τοῦ θανάτου, καθότι οὐκ ἦν δυνατὸν κρατεῖσθαι αὐτὸν ὑπ’ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/024.yaml
  text: whom God raised up[a], having loosed the pains of death[b], because it was not possible for him to be held by it.
translation:
  language: ig
  text: Onye ahụ ka Chineke mere ka o si n’ọnwụ bilie, site n’ịtọpụ ihe mgbu nke ọnwụ[a], n’ihi na ọ gaghị ekwe omume ka ọnwụ jide ya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “mgbu ịmụ nwa nke ọnwụ”; okwu Greek ahụ nwere ike ịpụta mgbu ịmụ nwa, si otú a na-edobe ihe atụ nke imebi njide ọnwụ.
    reason: lexical_alternative
  - marker: b
    text: N’ụzọ nkịtị, “ka ihe ahụ jide ya.” Nnọchiaha ahụ yikarịrị ka ọ na-ezo aka n’ọnwụ, ya bụ, “ka ọnwụ jide ya.”
    reason: alternative_reading
lexical_decisions:
- source_word: ὃν
  choice: Onye ahụ ka
  rationale: Ọ na-ezo aka na Jizọs a kpọrọ aha n’amaokwu bu ụzọ ma na-edobe njikọ nke nnọchiaha mmekọrịta ahụ n’ụzọ Igbo dị mma.
- source_word: ἀνέστησεν
  choice: mere ka o si n’ọnwụ bilie
  rationale: N’ebe a, okwu ahụ pụtara na Chineke mere ka Jizọs si n’ọnwụ bilie; ntụgharị a doro anya n’Igbo ma ghara itinye okwu nkà mmụta okpukpe karịrị ihe ederede kwuru.
- source_word: λύσας
  choice: site n’ịtọpụ
  rationale: “Ịtọpụ” na-edobe ihe atụ pụtara ìhè nke λύω—ịtọpụ ma ọ bụ ịhapụ—ebe “site n’” na-egosi otú omume a si soro ime ka o bilie.
- source_word: τὰς ὠδῖνας τοῦ θανάτου
  choice: ihe mgbu nke ọnwụ
  rationale: ὠδίν nwere ike ịpụta oké ihe mgbu, karịchaa mgbu ịmụ nwa. “Ihe mgbu nke ọnwụ” bụ okwu Igbo doro anya ma na-ahapụ nkọwa nke mgbu ịmụ nwa maka nkọwa ala peeji.
- source_word: καθότι
  choice: n’ihi na
  rationale: Ọ na-ewebata ihe kpatara omume Chineke, ma nke a bụ ụzọ nkịtị na nke doro anya e si kwuo ya n’Igbo.
- source_word: οὐκ ἦν δυνατὸν
  choice: ọ gaghị ekwe omume
  rationale: Ọ na-edobe nkwupụta Greek na ihe ahụ agaghị ekwe omume, n’asụsụ Igbo dị ugbu a.
- source_word: κρατεῖσθαι
  choice: jide ya
  rationale: κρατέω ebe a na-egosi ijide mmadụ n’ike ma ọ bụ idebe ya n’okpuru ọchịchị; “jide ya” dị nkenke ma na-edobe ihe atụ ahụ.
- source_word: ὑπ’ αὐτοῦ
  choice: ka ọnwụ jide ya
  rationale: Nnọchiaha Greek ahụ na-ezo aka n’ọnwụ. Ikwughachi “ọnwụ” na-eme ka Igbo doo anya, ebe nkọwa ala peeji na-egosi ọdịdị nkịtị nke Greek.
theological_decisions:
- issue: Ihe ὑπ’ αὐτοῦ na-ezo aka na ya
  choice: Ọ na-ezo aka n’ọnwụ.
  alternative: A pụrụ ịsụgharị ya n’ụdị nkịtị dịka “ka ọ jide ya,” ma nke ahụ nwere ike ime ka onye “ọ” na-anọchi anya ya ghara ido anya n’Igbo.
  rationale: 'θανάτου bụ okwu kacha nso ma kwekọọ nke ọma n’echiche: ọnwụ enweghị ike ịnọgide na-ejide Jizọs. Ikwughachi “ọnwụ” na-eme ka nke a doo anya n’Igbo n’enweghị itinye ozizi ọzọ.'
- issue: Ihe ὠδῖνας pụtara
  choice: ihe mgbu
  alternative: mgbu ịmụ nwa
  rationale: Okwu Greek ahụ nwere ike ịpụta mgbu ịmụ nwa, ma n’ebe a “ihe mgbu nke ọnwụ” dabara n’okwu na-esote banyere ọnwụ ijide ya. E debere ezi ohere nke ihe atụ mgbu ịmụ nwa na nkọwa ala peeji.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. A hapụrụ ihe atụ “ịtọpụ ihe mgbu” n’agbanyeghị na ọ bụghị akpaalaokwu Igbo a na-ahụkarị, ka ike na ihe mgbagwoju anya dị na okwu Greek ghara ịla n’iyi. E tinyere akara nkọwa ala peeji [a] na [b] kpọmkwem n’ebe okwu ndị ha na-akọwa dị.
