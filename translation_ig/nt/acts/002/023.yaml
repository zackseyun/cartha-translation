revisions:
- from: Nwoke a, onye e nyefere dị ka atụmatụ Chineke kpebisiri ike na ihe ọ maara tupu oge eruo si dị, unu kpọgidere ya n’obe site n’aka ndị na-enweghị iwu, wee gbuo ya.[a]
  to: Nwoke a, onye e nyefere dịka atụmatụ Chineke e kpebiri na ihe Chineke buru ụzọ mara si dị, unu sitere n’aka ndị na-enweghị iwu kpọgide ya n’obe wee gbuo ya.[a]
  rationale: The revision makes God explicitly the one whose foreknowledge is in view, gives the coordinated phrase a more natural Igbo structure, and places the mediated-agency phrase where it clearly modifies the audience's actions. It retains the Greek's deliberate tension between God's determined plan and foreknowledge and the hearers' culpability. The footnote now offers a genuine idiomatic alternative for ἀνείλατε rather than a causative paraphrase that can shift the emphasis.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T08:27:29Z'
review_pass:
  verdict: revise
  source_fidelity: 'The draft preserves the principal referents and both elements of the Greek: Jesus was handed over in keeping with God''s settled purpose and foreknowledge, while the audience is held responsible for his death. However, the wording for God''s foreknowledge is syntactically awkward, and the placement of “site n’aka ndị na-enweghị iwu” can momentarily attach it only to the nailing rather than clearly expressing the mediated agency of the whole action.'
  naturalness: '“atụmatụ Chineke kpebisiri ike na ihe ọ maara tupu oge eruo si dị” is not fully natural Standard Igbo: the subject of “ọ maara” is recoverable but unnecessarily unclear, and the final “si dị” governs a cumbersome coordinated phrase. A more direct formulation is clear, idiomatic, and retains the source relationship.'
  terminology: “onye e nyefere,” “atụmatụ ... e kpebiri,” “ndị na-enweghị iwu,” “kpọgide ... n’obe,” and “gbuo” are suitable. “Ihe Chineke buru ụzọ mara” communicates πρόγνωσις accurately in contemporary Igbo without importing a doctrinally loaded formulation.
  issues:
  - severity: medium
    issue: The phrase for divine foreknowledge is awkward and has an unclear pronoun antecedent.
    rationale: In “ihe ọ maara tupu oge eruo,” “ọ” must refer to Chineke, but the coordinated construction is heavy and less precise than the Greek's explicit genitive, τοῦ θεοῦ, governing both “plan” and “foreknowledge.”
  - severity: low
    issue: The agency phrase is placed after the nailing expression.
    rationale: Although understandable, moving “site n’aka ndị na-enweghị iwu” before the coordinated actions better reflects διὰ χειρὸς ἀνόμων and avoids a momentary ambiguity in attachment.
  revised_text: Nwoke a, onye e nyefere dịka atụmatụ Chineke e kpebiri na ihe Chineke buru ụzọ mara si dị, unu sitere n’aka ndị na-enweghị iwu kpọgide ya n’obe wee gbuo ya.[a]
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “unu wepụrụ ndụ ya.”
    reason: lexical_alternative
  revision_rationale: The revision makes God explicitly the one whose foreknowledge is in view, gives the coordinated phrase a more natural Igbo structure, and places the mediated-agency phrase where it clearly modifies the audience's actions. It retains the Greek's deliberate tension between God's determined plan and foreknowledge and the hearers' culpability. The footnote now offers a genuine idiomatic alternative for ἀνείλατε rather than a causative paraphrase that can shift the emphasis.
