  text: τοῦτον τῇ ὡρισμένῃ βουλῇ καὶ προγνώσει τοῦ θεοῦ ⸀ἔκδοτον διὰ ⸀χειρὸς ἀνόμων προσπήξαντες ἀνείλατε,
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/023.yaml
  text: this man[a], delivered up according to the determined plan and foreknowledge of God[b], you killed by nailing him to a cross through the hands of lawless men.
translation:
  language: ig
  text: Nwoke a, onye e nyefere dịka atụmatụ Chineke e kpebiri na ihe Chineke buru ụzọ mara si dị, unu sitere n’aka ndị na-enweghị iwu kpọgide ya n’obe wee gbuo ya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “unu wepụrụ ndụ ya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτον
  choice: Nwoke a
  rationale: Nnọchiaha nrụtụ aka a na-ezo aka na Jizọs; “Nwoke a” bụ Igbo doro anya nke na-echekwa ike nrụtụ aka ahụ.
- source_word: τῇ ὡρισμένῃ βουλῇ
  choice: dị ka atụmatụ Chineke kpebisiri ike ... si dị
  rationale: Nkebi a na-egosi na ihe ahụ kwekọrọ n’atụmatụ e doziri ma kpebisie ike; nhazi a bụ Igbo eke ma na-echekwa ebumnuche Chineke.
- source_word: καὶ προγνώσει τοῦ θεοῦ
  choice: na ihe ọ maara tupu oge eruo
  rationale: Nke a na-enye πρόγνωσις n’Igbo nkịtị ma doo anya, na-enweghị ibubata okwu nkà mmụta okpukpe nke nwere ike ikpuchi ihe okwu Grik pụtara.
- source_word: ἔκδοτον
  choice: onye e nyefere
  rationale: Ọ na-echekwa echiche nke ịbụ onye e nyefere ma ghara ịkpọpụta onye mere nnyefe ahụ karịa ka amaokwu ahụ kwuru.
- source_word: διὰ χειρὸς ἀνόμων
  choice: site n’aka ndị na-enweghị iwu
  rationale: “Site n’aka” bụ akpaala okwu Igbo eke nke na-egosi ndị e ji mee ihe; “ndị na-enweghị iwu” na-echekwa njikọ ἄνομος na iwu kama ịtụgharị ya naanị dịka “ndị ajọ omume.”
- source_word: προσπήξαντες
  choice: unu kpọgidere ya n’obe
  rationale: N’ọnọdụ a ngwaa ahụ na-ezo aka n’ịkpọgide n’obe; ntụgharị a na-eme ihe e kwuru doo anya n’Igbo.
- source_word: ἀνείλατε
  choice: wee gbuo ya
  rationale: Ọ na-enye ebubo Pita n’ụzọ kpọmkwem ma sie ike, dị ka ngwaa Grik si dị.
theological_decisions:
- issue: Mmekọrịta dị n’etiti ọchịchị Chineke na ibu ọrụ mmadụ
  choice: E chekwara ma atụmatụ na ihe Chineke maara tupu oge eruo, ma ebubo kpọmkwem ahụ bụ́ “unu ... gbuo ya.”
  alternative: Ime ka mkpebi Chineke dị nro, ma ọ bụ ikwu ka a ga-asị na ọ bụ naanị ndị na-enweghị iwu nwere ibu ọrụ.
  rationale: Grik na-ekwupụta akụkụ abụọ ahụ ọnụ; ntụgharị ahụ anaghị edozi esemokwu a n’ụzọ ga-akwado otu usoro ozizi pụrụ iche.
translation_notes:
  register: Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta. E ji usoro ahịrịokwu eke mee ka ogologo nkebi Grik doo anya, ma e chekwara ebubo siri ike na esemokwu nkà mmụta okpukpe dị n’amaokwu ahụ.
