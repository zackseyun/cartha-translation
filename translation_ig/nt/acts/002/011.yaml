  text: Ἰουδαῖοί τε καὶ προσήλυτοι, Κρῆτες καὶ Ἄραβες, ἀκούομεν λαλούντων αὐτῶν ταῖς ἡμετέραις γλώσσαις τὰ μεγαλεῖα τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/011.yaml
  text: both Jews and proselytes[a], Cretans and Arabs—we hear them speaking in our own languages the mighty works of God.
translation:
  language: ig
  text: ma ndị Juu ma ndị nabatara okpukpe ndị Juu, ndị Krit na ndị Arab—anyị na-anụ ka ha na-ekwu ihe ukwu Chineke mere n’asụsụ nke anyị[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “ire.” Okwu Grik a nwere ike ịpụta “ire” ma ọ bụ “asụsụ”; n’ebe a, ihe gbara ya gburugburu na-egosi asụsụ mmadụ ndị a pụrụ ịmata.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰουδαῖοί
  choice: ndị Juu
  rationale: N'ebe a, okwu ahụ na-ezo aka n’ụmụ Juu nọ n’etiti ìgwè ndị si mba dị iche iche, ọ bụghị naanị ndị bi na Judia.
- source_word: τε καὶ
  choice: ma ... ma
  rationale: Usoro a na-egosi njikọ nke ìgwè abụọ ahụ n’ụzọ Igbo na-ada nke ọma.
- source_word: προσήλυτοι
  choice: ndị nabatara okpukpe ndị Juu
  rationale: Nke a kọwara ndị na-abụghị ụmụ Juu site n'ọmụmụ ma nabatara okpukpe ndị Juu, n’asụsụ ndị mmadụ taa ga-aghọta ngwa ngwa.
- source_word: Κρῆτες
  choice: ndị Krit
  rationale: Nke a bụ aha ndị bi na Krit n’ụdị dabara n’Igbo.
- source_word: Ἄραβες
  choice: ndị Arab
  rationale: Nke a bụ aha ndị Arab n’ụdị Igbo a na-eji ugbu a.
- source_word: ἀκούομεν λαλούντων αὐτῶν
  choice: anyị na-anụ ka ha ... na-ekwu
  rationale: Nke a na-echekwa echiche nke ndị na-ekwu okwu nke ndị na-ege ntị na-anụ ozugbo.
- source_word: ταῖς ἡμετέραις γλώσσαις
  choice: ji asụsụ nke anyị dị iche iche
  rationale: N’akụkọ Pentikọst a, γλώσσαις na-ezo aka n’asụsụ mmadụ ndị ìgwè ahụ maara; ‘nke anyị’ na-echekwa nkwusi ike nke ἡμετέραις.
- source_word: τὰ μεγαλεῖα τοῦ θεοῦ
  choice: ọrụ ukwu Chineke rụrụ
  rationale: Nke a na-egosi nnukwu ihe ndị sitere n’aka Chineke n’Igbo doro anya ma dịkwa nkenke.
theological_decisions:
- issue: Ihe γλώσσαις pụtara n’akụkọ Pentikọst
  choice: asụsụ mmadụ ndị a pụrụ ịmata
  alternative: okwu mmụọ a na-apụghị ịmata dị ka asụsụ mmadụ
  rationale: Ihe gbara amaokwu a gburugburu na-ekwusi ike na ndị si mba dị iche iche nụrụ ihe ahụ n’asụsụ nke ha. Nsụgharị a na-agbaso ihe akụkọ ahụ na-egosi n’ebe a n’etinyeghị ozizi e si n’ebe ọzọ weta.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A kọwara προσήλυτοι kama iji okwu mbinye pụrụ ịdị ndị na-agụ ya taa mgbagwoju anya.
