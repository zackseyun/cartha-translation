revisions:
- from: N’ihi na nkwa ahụ bụ maka unu na ụmụ unu, nakwa maka ndị niile nọ n’ebe dị anya[a]—ya bụ, ndị niile Onyenwe anyị, bụ́ Chineke anyị, ga-akpọ[b].
  to: N’ihi na nkwa ahụ bụ maka unu na ụmụ unu, nakwa maka ndị niile nọ n’ebe dị anya[a], dịka ọnụ ọgụgụ ndị Onyenwe anyị, bụ́ Chineke anyị, ga-akpọ[b].
  rationale: The revision removes the added explicative “ya bụ” and represents the indefinite-comprehensive force of ὅσους ἂν with “dịka ọnụ ọgụgụ ndị ... ga-akpọ.” It retains the source’s ambiguity about those who are far off and does not define the nature of God’s calling. Footnote b is revised so that its statement about the Greek is accurate.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T08:27:36Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly renders the promise, the hearers and their children, and the broad category of those at a distance. However, “ya bụ” (‘that is’) turns the final relative clause into an explanatory restatement rather than retaining its Greek qualifying force, and the wording should more directly reflect ὅσους ἂν, ‘as many as ... may call.’
  naturalness: The Igbo is generally clear and appropriately formal. Recasting the final clause with “dịka ọnụ ọgụgụ ndị ... ga-akpọ” is natural enough in formal Standard Igbo and avoids the overly explicative “ya bụ.”
  terminology: “nkwa ahụ,” “ụmụ unu,” “ndị niile nọ n’ebe dị anya,” and “Onyenwe anyị, bụ́ Chineke anyị” are suitable. The phrase for those far off remains appropriately open to geographic and covenantal senses. The revised footnote b corrects its inaccurate claim that its prior wording was a literal Greek reproduction.
  issues:
  - severity: medium
    issue: “ya bụ” adds an explicative/equative relation not expressed by the Greek.
    rationale: ὅσους ἂν προσκαλέσηται qualifies the scope (‘as many as the Lord our God may call’); it is not introduced as ‘that is.’ The addition can make ‘those far off’ and ‘those called’ sound like a simple definition rather than preserving the Greek construction.
  - severity: medium
    issue: Footnote b describes “ndị niile ... ga-akpọ” as the exact Greek wording.
    rationale: The Greek has ὅσους ἂν (‘as many as/whomever’) plus an aorist subjunctive, not literally the stated Igbo phrase. The note should present the construction accurately without importing a theological account of the calling.
  revised_text: N’ihi na nkwa ahụ bụ maka unu na ụmụ unu, nakwa maka ndị niile nọ n’ebe dị anya[a], dịka ọnụ ọgụgụ ndị Onyenwe anyị, bụ́ Chineke anyị, ga-akpọ[b].
  revised_footnotes:
