id: ACT.2.39
reference: Acts 2:39
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὑμῖν γάρ ἐστιν ἡ ἐπαγγελία καὶ τοῖς τέκνοις ὑμῶν καὶ πᾶσι τοῖς εἰς μακρὰν ὅσους ἂν προσκαλέσηται κύριος ὁ θεὸς ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/039.yaml
  text: For the promise is for you and for your children and for all who are far off[b][a], as many as the Lord our God calls.
translation:
  language: ig
  text: N’ihi na nkwa ahụ bụ maka unu na ụmụ unu, nakwa maka ndị niile nọ n’ebe dị anya[a], dịka ọnụ ọgụgụ ndị Onyenwe anyị, bụ́ Chineke anyị, ga-akpọ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ndị niile dị anya.” Okwu a nwere ike ịpụta ndị bi n’ebe dị anya, ndị dị anya n’ọgbụgba ndụ Chineke, ma ọ bụ ha abụọ.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, “onye ọ bụla Onyenwe anyị, bụ́ Chineke anyị, ga-akpọ.” N’asụsụ Grik, okwu ahụ pụtara, “dịka ọnụ ọgụgụ ndị Onyenwe anyị, bụ́ Chineke anyị, pụrụ ịkpọ.”
    reason: alternative_reading
lexical_decisions:
- source_word: γάρ
  choice: N’ihi na
  rationale: Ọ na-ejikọta amaokwu a na oku Pita kpọrọ ha n’amaokwu bu ya ụzọ, ma na-egosi ihe mere ha ji kwesị ime ihe ahụ.
- source_word: ἐπαγγελία
  choice: nkwa ahụ
  rationale: Okwu Grik pụtara ‘nkwa’ n’onwe ya; ọ naghị akpọ ya ‘onyinye ahụ,’ ọ bụ ezie na ihe gbara ya gburugburu na-ekwu maka onyinye Mmụọ Nsọ.
- source_word: τέκνοις
  choice: ụmụ unu
  rationale: Nke a bụ ụzọ Igbo si ekwu okwu ezinụlọ n’ụzọ nkịtị, ọ pụkwara ịgụnye ụmụ na ụmụ ụmụ n’enweghị ịmanye nkọwa gbasara afọ ndụ.
- source_word: πᾶσι τοῖς εἰς μακράν
  choice: ndị niile nọ n’ebe dị anya
  rationale: Nsụgharị a na-edobe echiche nke ịdị anya ma ghara ikpebi ma ọ bụ naanị ịdị anya n’ebe mmadụ nọ, ịdị anya n’ọgbụgba ndụ, ka ọ bụ ha abụọ.
- source_word: ὅσους ἂν προσκαλέσηται
  choice: ndị niile ... ga-akpọ
  rationale: ‘Ndị niile’ na-egosipụta ìgwè a na-akọwaghị ókè ya ma na-agụnye onye ọ bụla Chineke ga-akpọ; ‘ga-akpọ’ na-edobe mmetụta nke ụdị subjunctive Grik n’enweghị ịgbakwunye ‘kpọrọ bịakwute onwe ya,’ nke na-apụtaghị kpọmkwem n’ederede.
- source_word: κύριος ὁ θεὸς ἡμῶν
  choice: Onyenwe anyị, bụ́ Chineke anyị
  rationale: Nke a na-edobe utu aha ‘Onyenwe anyị’ na nkọwa nke na-eme ka o doo anya na ọ bụ Chineke anyị ka a na-ekwu maka ya.
theological_decisions:
- issue: Ndị ‘nọ n’ebe dị anya’ bụ ndị dị aṅaa?
  choice: E debere ya n’obosara dị ka ‘ndị niile nọ n’ebe dị anya.’
  alternative: Ndị Juu nọ ná mba ọzọ naanị; ndị mba ọzọ naanị; ma ọ bụ ndị dị anya ma n’ebe obibi ma n’ọgbụgba ndụ.
  rationale: Amaokwu ahụ anaghị amanye otu n’ime nkọwa ndị a. Ya mere, nsụgharị ahụ na-edobe ohere na esemokwu nkọwa dị n’okwu Grik.
- issue: Ihe ‘ịkpọ’ Chineke pụtara n’usoro nzọpụta
  choice: E kwuru naanị na Onyenwe anyị ga-akpọ ha, n’enweghị ịkọwa usoro oku ahụ.
  alternative: Oku na-arụpụta nzọpụta n’ụzọ a na-apụghị iguzogide, ma ọ bụ ọkpụkpọ/òkù zuru mmadụ niile ọnụ.
  rationale: Ederede ahụ na-ekwu na nkwa ahụ bụ maka ndị Chineke ga-akpọ, ma ọ naghị akọwa ebe a otú oku ahụ si arụ ọrụ. Nsụgharị ahụ anaghị etinye ozizi pụrụ iche nke otu ụka.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. A họọrọ ‘nkwa ahụ’ kama ịkọwa ya dị ka ‘onyinye e kwere ná nkwa,’ ma e debere ‘ndị nọ n’ebe dị anya’ na ‘ga-akpọ’ n’ụzọ na-adịghị amanye nkọwa okpukpe pụrụ iche. Akara ntụaka ụkwụ [a] na [b] pụtara n’ederede isi.
