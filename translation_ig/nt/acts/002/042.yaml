  verdict: revise
  source_fidelity: The four coordinated objects in the Greek are retained, and the broad renderings of κοινωνία and κλάσις τοῦ ἄρτου appropriately avoid resolving disputed interpretive questions. The ongoing, steadfast force of ἦσαν ... προσκαρτεροῦντες is better expressed by an imperfect habitual form in the revision.
  naturalness: The draft is intelligible, but “Ha nọgidere na-arara onwe ha nye” is somewhat heavy and redundantly combines continuance with a progressive form. “Ha na-anọgidesi ike n’...” is more idiomatic Standard Igbo for persistent devotion to these practices.
  terminology: “Ozizi ndịozi,” “mmekọrịta,” “ịnyawa achịcha,” and “ekpere” are suitable, non-sectarian equivalents. The footnotes retain lexical and interpretive breadth without making the Lord’s Supper or a financial sense mandatory.
