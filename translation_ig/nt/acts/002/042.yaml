  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἦσαν δὲ προσκαρτεροῦντες τῇ διδαχῇ τῶν ἀποστόλων καὶ τῇ ⸀κοινωνίᾳ, τῇ κλάσει τοῦ ἄρτου καὶ ταῖς προσευχαῖς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/042.yaml
  text: And they were devoting themselves to the apostles' teaching and the fellowship[c][b][a], to the breaking of bread and the prayers.
translation:
  language: ig
  text: Ha na-anọgidesi ike n’ozizi ndịozi, na mmekọrịta[a], n’ịnyawa achịcha[b], na n’ekpere[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “ịkekọrịta ihe,” “isonye ọnụ,” ma ọ bụ “ịdị n’otu.”
    reason: lexical_alternative
  - marker: b
    text: “Ịnyawa achịcha” nwere ike ịpụta iri nri ọnụ n’ozuzu ya; ma ọtụtụ ndị ghọtara na n’ebe a ọ gụnyere Oriri Nsọ.
    reason: alternative_reading
  - marker: c
    text: Ma ọ bụ “ekpere ndị a kara aka”; okwu mbido dị na Grik nwere ike igosi oge ma ọ bụ usoro ekpere ndị a maara ama.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦσαν δὲ προσκαρτεροῦντες
  choice: Ha nọgidere na-arara onwe ha nye
  rationale: Nke a na-egosipụta omume gara n’ihu n’oge gara aga, tinyere nkwụsi ike na itinye obi dum nke προσκαρτερέω pụtara.
- source_word: τῇ διδαχῇ τῶν ἀποστόλων
  choice: ozizi ndịozi
  rationale: “Ozizi” bụ okwu Igbo dị ugbu a ma doo anya maka διδαχή; “ndịozi” na-egosi na ọ bụ ha nyere ozizi ahụ, ọ bụghị nanị ozizi banyere ha.
- source_word: τῇ κοινωνίᾳ
  choice: mmekọrịta
  rationale: “Mmekọrịta” na-edobe obosara κοινωνία—ịkekọ ndụ, isonye ọnụ, na inwe ihe jikọrọ mmadụ—n’etinyeghị ya naanị n’ịkekọ akụ ma ọ bụ n’emume okpukpe.
- source_word: τῇ κλάσει τοῦ ἄρτου
  choice: ịnyawa achịcha
  rationale: Nke a na-edobe akpaokwu Grik ahụ n’enweghị ime ka o doo anya karịa isi mmalite ma ọ bụ nri nkịtị a na-erikọ ọnụ ka ọ bụ Oriri Nsọ.
- source_word: ταῖς προσευχαῖς
  choice: ekpere
  rationale: “Ekpere” bụ nsụgharị nkịtị ma dị mma n’Igbo. Ebe Igbo na-adịghị egosipụta mkpụrụokwu njirimara Grik n’otu ụzọ ahụ, e debere ohere na ọ na-ekwu maka ekpere ndị a maara ama n’okpuru peeji.
theological_decisions:
- issue: Ma κλάσει τοῦ ἄρτου ò kwesịrị ịkpọ kpọmkwem Oriri Nsọ
  choice: ịnyawa achịcha
  alternative: Oriri Nsọ; nri ndị kwere ekwe na-erikọ ọnụ nke gụnyere Oriri Nsọ
  rationale: Akpaokwu ahụ nwere ike izo aka na nri a na-erikọ ọnụ, ma n’ọnọdụ Ndị Kraịst ọ pụkwara ịgụnye nri ncheta Onyenwe anyị. Ebe amaokwu ahụ na-ekwughị nke ahụ hoo haa, nsụgharị ahụ anaghị amanye nkọwa otu ụka.
- issue: Ma κοινωνία ò kwesịrị ịbụ naanị ịkekọ ihe onwunwe ma ọ bụ Oriri Nsọ
  choice: mmekọrịta
  alternative: ịkekọrịta ihe; isonye ọnụ; mmekọrịta n’Oriri Nsọ
  rationale: Okwu Grik ahụ sara mbara ma nwee ike ịgụnye ndụ ha jikọrọ ọnụ n’ụzọ ime mmụọ na nke ihe onwunwe. “Mmekọrịta” na-ahapụ obosara ahụ ka ọ dị.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-edobe usoro omume anọ dị na Grik, ma zere okwu ụka nke ga-eme ka ihe isi mmalite hapụrụ ghe oghe bụrụ otu nkọwa kpọmkwem.
