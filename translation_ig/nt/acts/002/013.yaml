  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἕτεροι δὲ ⸀διαχλευάζοντες ἔλεγον ὅτι Γλεύκους μεμεστωμένοι εἰσίν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/013.yaml
  text: But others[a], mocking, were saying, “They are filled with sweet wine.”
translation:
  language: ig
  text: Ma ndị ọzọ nọ na-akwa ha emo na-asị, “Ha ejula mmanya ụtọ[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “mmanya ọhụrụ.” Okwu Grik γλεῦκος na-ezo aka na mmanya ọhụrụ na-atọ ụtọ; “mmanya ọhụrụ” bụkwa ntụgharị enwere ike iji.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕτεροι
  choice: ndị ọzọ
  rationale: Ọ na-ezo aka n’òtù ọzọ dị n’etiti ìgwè mmadụ ahụ; nke a bụ ụzọ Igbo doro anya ma dịkwa eke si kwuo ya.
- source_word: δὲ
  choice: Ma
  rationale: Ọ na-egosi ọdịiche dị n’etiti mmeghachi omume a na ihe ndị bu ya ụzọ.
- source_word: διαχλευάζοντες
  choice: na-akwa ha emo
  rationale: Nkebiokwu a na-egosi ịkwa mmadụ emo n’ụzọ nlelị, ma bụrụkwa okwu Igbo ndị mmadụ na-aghọta ngwa ngwa.
- source_word: ἔλεγον
  choice: na-asị
  rationale: Ụdị ngwaa ahụ na-egosi okwu na-aga n’ihu ma ọ bụ nke a na-ekwu ugboro ugboro; ‘na-asị’ na-echekwa echiche ahụ n’Igbo eke.
- source_word: ὅτι
  choice: “Mmanya ụtọ…
  rationale: E ji okwu e kwuru kpọmkwem mee ka ebubo ha doo anya ma na-aga nke ọma n’Igbo.
- source_word: Γλεύκους
  choice: Mmanya ụtọ
  rationale: γλεῦκος bụ mmanya ọhụrụ dị ụtọ ma ọ bụ mmanya mkpụrụ vaịn ụtọ; ‘mmanya ụtọ’ na-egosipụta ihe bụ isi okwu ahụ pụtara karịa naanị ‘mmanya ọhụrụ.’
- source_word: μεμεστωμένοι
  choice: ejuola ha
  rationale: Ụdị perfect passive participle ahụ na-akọwa ọnọdụ ha nọ na ya n’ihi na mmanya ejupụtala ha; ‘ejuola ha’ na-echekwa ma ọnọdụ ahụ ma ihe merela tupu ya.
- source_word: εἰσίν
  choice: ejuola ha
  rationale: N’Igbo, a na-ejikọta copula na participle nke okwu Grik ahụ n’otu ngwaa zuru ezu, ‘ejuola ha.’
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. ‘Na-akwa ha emo na-asị’ na-egosipụta omume ịkwa emo na okwu a nọ na-ekwu n’oge ahụ; a hapụrụ ebubo ndị ahụ dịka okwu ha kwuru, n’enweghị ịkọwa ya dịka eziokwu.
