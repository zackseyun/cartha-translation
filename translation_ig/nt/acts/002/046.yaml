id: ACT.2.46
reference: Acts 2:46
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καθ’ ἡμέραν τε προσκαρτεροῦντες ὁμοθυμαδὸν ἐν τῷ ἱερῷ, κλῶντές τε κατ’ οἶκον ἄρτον, μετελάμβανον τροφῆς ἐν ἀγαλλιάσει καὶ ἀφελότητι καρδίας,
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/046.yaml
  text: And day by day[a], continuing together with one purpose in the temple courts, and breaking bread from house to house, they were sharing meals with gladness and simplicity of heart[d][c][b],
translation:
  language: ig
  text: 'Kwa ụbọchị, ha ji otu obi nọgide na-anọkọ n’ogige ụlọ nsọ[a]; ha na-anyawa achịcha[b] n’ụlọ dị iche iche, na-erikọkwa nri[c] n’ọṅụ na ịdị mfe nke obi[d].


    [a] Okwu Grik ahụ na-ekwu maka mpaghara ụlọ nsọ dum, ọ bụghị kpọmkwem ebe nsọ dị n’ime ya.


    [b] “Ịnyawa achịcha” nwere ike ịpụta irikọ nri nkịtị; ma ụfọdụ na-aghọta na ọ pụkwara ịgụnye Nri Anyasị nke Onyenwe anyị.


    [c] Ma ọ bụ, “na-ekere òkè na nri.”


    [d] Ma ọ bụ, “n’ezi obi” ma ọ bụ “n’obi na-emesapụ aka.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Okwu Grik ahụ na-ekwu maka mpaghara ụlọ nsọ dum, ọ bụghị kpọmkwem ebe nsọ dị n’ime ya.
    reason: cultural_note
  - marker: b
    text: “Ịnyawa achịcha” nwere ike ịpụta irikọ nri nkịtị; ma ụfọdụ na-aghọta na ọ pụkwara ịgụnye Nri Anyasị nke Onyenwe anyị.
    reason: alternative_reading
  - marker: c
    text: Ma ọ bụ, “na-ekere òkè na nri.”
    reason: lexical_alternative
  - marker: d
    text: Ma ọ bụ, “n’ezi obi” ma ọ bụ “n’obi na-emesapụ aka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καθ’ ἡμέραν
  choice: Kwa ụbọchị
  rationale: Nke a na-egosipụta ihe a na-eme ugboro ugboro, ụbọchị ruo ụbọchị, n’ụzọ Igbo na-ada nke ọma.
- source_word: προσκαρτεροῦντες
  choice: nọgide na-anọkọ
  rationale: Ọnọdụ participle dị ugbu a na-egosi omume ha nọ na-eme n’esepụghị aka; okwu a na-ejikọkwa ya nke ọma na ebe ha nọ na-ezukọ.
- source_word: ὁμοθυμαδόν
  choice: ji otu obi
  rationale: Akpaokwu Igbo a na-egosipụta ịdị n’otu na inwe otu nzube, n’enweghị iji okwu ochie ma ọ bụ nke siri ike nghọta.
- source_word: ἐν τῷ ἱερῷ
  choice: n’ogige ụlọ nsọ
  rationale: ἱερόν na-ezo aka n’ụlọ nsọ ahụ dum, karịchaa ogige ya, ọ bụghị naanị ebe nsọ dị n’ime (ναός).
- source_word: κλῶντές ... ἄρτον
  choice: na-anyawa achịcha
  rationale: E debere akpaokwu ahụ dịka ilu iri nri ọnụ, ka ọ ghara ikpebi ma ọ bụ naanị nri nkịtị ka ọ bụkwa Nri Anyasị nke Onyenwe anyị.
- source_word: κατ’ οἶκον
  choice: n’ụlọ dị iche iche
  rationale: 'Nke a na-egosipụta nkesa nke κατά: a na-eme ya n’ụlọ ndị dị iche iche, ọ bụghị nanị n’otu ụlọ.'
- source_word: μετελάμβανον τροφῆς
  choice: na-erikọkwa nri
  rationale: Imperfect ahụ na-egosi omume na-aga n’ihu; “erikọ nri” na-egosipụta ma iri nri ma mmekọrịta nke obodo ahụ.
- source_word: ἐν ἀγαλλιάσει
  choice: n’ọṅụ
  rationale: Nke a bụ okwu Igbo doro anya ma dị ùgwù nke na-eburu echiche nke ọṅụ dị ukwuu n’enweghị ikwubiga ihe ókè.
- source_word: ἀφελότητι καρδίας
  choice: ịdị mfe nke obi
  rationale: Nhọrọ a na-anọ nso n’obosara okwu Grik ahụ, nke pụrụ igosi obi na-enweghị aghụghọ, ezi obi, ma ọ bụ obi na-emesapụ aka, kama imechi ya n’otu nkọwa.
theological_decisions:
- issue: Ma “ịnyawa achịcha” ọ̀ bụ naanị nri nkịtị ka ọ bụ Nri Anyasị nke Onyenwe anyị
  choice: E debere akpaokwu sara mbara “na-anyawa achịcha” n’ahịrị bụ isi.
  alternative: Ịsụgharị ya hoo haa dị ka iri nri nkịtị naanị, ma ọ bụ dị ka Nri Anyasị nke Onyenwe anyị.
  rationale: N’akwụkwọ Luk na Ọrụ Ndịozi, akpaokwu ahụ nwere ike ịpụta iri nri ọnụ, ma o nwekwara ike iburu echiche nke omume ncheta Ndị Kraịst. Ebe a kpọkwara τροφή (“nri”) na-akwado nri obodo, ma ọ dịghị akagbu echiche nke Nri Anyasị Onyenwe anyị; ya mere e chekwara esemokwu ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “Ji otu obi” na “n’ụlọ dị iche iche” bụ akpaokwu ndị nkịtị ga-aghọta ngwa ngwa. E debere “ịnyawa achịcha” iji chekwaa mgbagwoju echiche dị n’isi mmalite, ebe nkọwa ala peeji na-eme ka nhọrọ ndị ọzọ doo anya.
