  naturalness: 'The verse is clear Standard Igbo. A small adjustment to the temple footnote makes its wording more idiomatic and more exact: ἱερόν denotes the temple precinct/complex, without suggesting indiscriminately every part of the building.'
  terminology: 'Key terms are well handled: ‘ji otu obi’ retains united purpose, ‘ogige ụlọ nsọ’ suitably conveys the precincts, and ‘ịnyawa achịcha’ preserves the deliberate ambiguity. ‘ịdị mfe nke obi’ is an acceptable close rendering of ἀφελότης καρδίας, with the alternatives appropriately supplied.'
