review_pass:
  verdict: revise
  source_fidelity: The draft accurately retains the introductory future formula, universal conditional scope, the biblical idiom of calling on the Lord’s name, and the future passive promise of salvation. However, “kpọkuru” normally reads as completed/past action in this relative clause, whereas the Greek aorist subjunctive governed by ἐὰν has prospective, indefinite conditional force here.
  naturalness: The wording is generally clear and suitably elevated for a scriptural quotation. Using “ga-akpọku” makes the conditional sense unambiguously prospective in natural Standard Igbo. “Onyenwe anyị” is an established, respectful biblical rendering.
  terminology: “aha Onyenwe anyị” appropriately preserves the source idiom without deciding whether the referent is YHWH or Jesus. “a ga-azọpụta” adequately represents the future passive and preserves the salvation/deliverance breadth.
  issues:
  - severity: medium
    issue: The verb “kpọkuru” can be understood as past or completed (“has called/called”).
    rationale: In Acts 2:21, ὃς ἐὰν ἐπικαλέσηται expresses whoever may/will call upon the Lord’s name, not specifically one who has already called. “ga-akpọku” clearly conveys the prospective indefinite condition.
  revised_text: Ọ ga-abụkwa na onye ọ bụla nke ga-akpọku aha Onyenwe anyị ka a ga-azọpụta.[a]
