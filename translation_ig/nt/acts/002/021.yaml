  text: καὶ ἔσται πᾶς ὃς ⸀ἐὰν ἐπικαλέσηται τὸ ὄνομα κυρίου σωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/021.yaml
  text: And it shall be that everyone who calls on the name of the Lord will be saved[a].
translation:
  language: ig
  text: Ọ ga-abụkwa na onye ọ bụla nke ga-akpọku aha Onyenwe anyị ka a ga-azọpụta.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, ‘onye ọbụla ga-akpọku aha Onyenwe anyị.’ Nkebiokwu a na-ekwughachi Joel 2:32, ebe ‘Onyenwe anyị’ na-ezo aka na YHWH; n’Ọrụ Ndị Ozi, Pita ji okwu ahụ mee ihe n’ime nkwusa ya banyere Jizọs.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔσται
  choice: Ọ ga-abụ
  rationale: Oge ọdịnihu nke εἰμί; ntụgharị a na-edebe usoro mmeghe nke amụma ahụ n'Igbo doro anya ma dịkwa nsọpụrụ.
- source_word: πᾶς ὃς ἐὰν
  choice: onye ọ bụla nke
  rationale: Nkebiokwu a na-egosi ọnọdụ zuru ụwa ọnụ nke na-akọwaghị otu onye kpọmkwem; ‘onye ọ bụla nke’ na-edebe obosara ya.
- source_word: ἐπικαλέσηται
  choice: kpọkuru
  rationale: N'okwu a, ọ pụtara ịkpọku ma ọ bụ ịrịọ Onye nwe aha ahụ n'olileanya na ofufe; ‘kpọkuru’ bụ okwu Igbo kwesịrị ekwesị maka idiom Akwụkwọ Nsọ a.
- source_word: τὸ ὄνομα
  choice: aha
  rationale: E debere ya kpọmkwem n'ihi na ‘ịkpọku aha’ bụ usoro okwu Akwụkwọ Nsọ nke nwere echiche ofufe na ịdabere n'Onye ahụ.
- source_word: κυρίου
  choice: Onyenwe anyị
  rationale: A sụgharịrị κύριος dịka ‘Onyenwe anyị,’ aha nsọpụrụ a na-ejikarị eme ihe n'Igbo, n'emeghị ka onye okwu ahụ na-ezo aka na ya bụrụ naanị otu nkọwa.
- source_word: σωθήσεται
  choice: a ga-azọpụta
  rationale: Ọ bụ ọdịnihu n'ụdị nnabata; ‘a ga-azọpụta’ na-edebe ma echiche nnapụta ma nke nzọpụta dị n'okwu ahụ.
theological_decisions:
- issue: Onye ‘Onyenwe anyị’ na-ezo aka na ya n'okwu Joel dịka e ji ya mee ihe n'Ọrụ Ndị Ozi
  choice: E debere ‘Onyenwe anyị’ n'ahịrị bụ isi n'akọwaghị onye ọ bụ kpọmkwem.
  alternative: N'ọnọdụ mbụ ya na Joel, ọ na-ezo aka na YHWH; n'okwu Pita n'Ọrụ Ndị Ozi, e tinyere ya n'ime nkwusa ya banyere Jizọs.
  rationale: Grik kwuru κύριος, ya bụ ‘Onyenwe anyị.’ Ịhapụ ya otu a na-edebe okwu ahụ na esemokwu nkà mmụta okpukpe dị n'etiti ọnọdụ Joel na etu Pita si jiri ya mee ihe, kama idozi ya n'ime ntụgharị.
translation_notes:
  register: Igbo Izugbe nke oge a, dị mfe nghọta ma nwee ùgwù kwesịrị ekwesị maka nhota amụma Akwụkwọ Nsọ. E jighị okwu chọọchị pụrụ iche nke otu òtù okpukpe mee ihe.
