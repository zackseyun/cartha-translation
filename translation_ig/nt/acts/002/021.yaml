    reason: alternative_reading
  revision_rationale: The sole revision changes “kpọkuru” to “ga-akpọku” in the main text and aligns the alternative wording in the footnote. This preserves the Greek’s future-oriented, open universal condition and avoids implying completed action. The ambiguous designation “Onyenwe anyị” is retained unchanged.
