revisions:
- from: Ya mere, ebe ọ bụ onye amụma, marakwa na Chineke ji iyi ṅụọrọ ya iyi na ọ ga-eme ka otu onye sitere na mkpụrụ úkwù ya[a] nọdụ n’ocheeze ya,
  to: Ya mere, ebe ọ bụ onye amụma, marakwa na Chineke ji iyi ṅụọrọ ya iyi na ọ ga-eme ka otu onye sitere na mkpụrụ nke úkwù ya[a] nọdụ n’ocheeze ya,
  rationale: The revision corrects the alternative rendering so that it denotes descendants generally rather than grandchildren specifically, and regularizes the literal idiom as “mkpụrụ nke úkwù ya.” No theological interpretation has been added, and the source's dynastic and enthronement language remains intact.
