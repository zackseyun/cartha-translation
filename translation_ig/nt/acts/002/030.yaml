  text: προφήτης οὖν ὑπάρχων, καὶ εἰδὼς ὅτι ὅρκῳ ὤμοσεν αὐτῷ ὁ θεὸς ἐκ καρποῦ τῆς ὀσφύος ⸀αὐτοῦ καθίσαι ἐπὶ ⸂τὸν θρόνον⸃ αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/030.yaml
  text: Therefore[a], being a prophet and knowing that God had sworn to him with an oath to seat one from the fruit of his loins on his throne,
translation:
  language: ig
  text: Ya mere, ebe ọ bụ onye amụma, marakwa na Chineke ji iyi ṅụọrọ ya iyi na ọ ga-eme ka otu onye sitere na mkpụrụ nke úkwù ya[a] nọdụ n’ocheeze ya,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “otu n’ime ụmụ ndị ga-esi n’agbụrụ ya pụta.” N’ụzọ nkịtị, “sitere na mkpụrụ nke úkwù ya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: προφήτης
  choice: onye amụma
  rationale: Nke a bụ okwu Igbo a na-ejikarị akọwa onye na-ekwu okwu sitere ná mkpughe Chineke.
- source_word: οὖν
  choice: Ya mere
  rationale: Ọ na-egosi nkwubi okwu sitere n’ihe e kwuru banyere Devid tupu amaokwu a.
- source_word: ὑπάρχων
  choice: ebe ọ bụ
  rationale: Ọ na-egosipụta ọnọdụ nwere ike ịbụkwa ihe kpatara ihe sochirinụ, ma na-ada nke ọma n’Igbo.
- source_word: εἰδὼς
  choice: marakwa
  rationale: Ọ na-ejikọta ịma Devid maara na ọnọdụ ya dị ka onye amụma, na-edobekwa usoro participle ahụ n’ụzọ Igbo dị ndụ.
- source_word: ὅρκῳ ὤμοσεν
  choice: ji iyi ṅụọrọ ya iyi
  rationale: Ntughari a na-edobe nkwusi ike dị n’iji ma aha ‘iyi’ ma ngwaa ‘ṅụọ iyi’ mee ihe.
- source_word: ἐκ καρποῦ τῆς ὀσφύος αὐτοῦ
  choice: otu onye sitere na mkpụrụ úkwù ya
  rationale: Ọ na-edobe ihe atụ anụ ahụ na-emesi usoro ọmụmụ ike; ihe e ji ya akọwa n’ụzọ dị mfe ka e tinyere n’ala ala peeji.
- source_word: καθίσαι
  choice: ọ ga-eme ka ... nọdụ
  rationale: 'Ọ na-egosipụta causative: ọ bụ Chineke ga-eme ka onye ahụ nọdụ, ọ bụghị naanị na onye ahụ ga-anọdụ n’onwe ya.'
- source_word: ἐπὶ τὸν θρόνον αὐτοῦ
  choice: n’ocheeze ya
  rationale: Nke a bụ ụzọ Igbo doro anya e si akọwa ịchị eze; ‘ya’ na-ezo aka n’ocheeze Devid dịka nkwa ahụ si dị.
theological_decisions:
- issue: Nkwa Chineke nyere Devid banyere eze ga-esi n’agbụrụ ya pụta
  choice: E debere okwu gbasara onye si n’ahụ Devid pụta na ịnọdụ n’ocheeze ya n’enweghị itinye aha ‘Mezaịa’ n’amaokwu a.
  alternative: Ịsụgharị ya dịka ‘Mezaịa ga-anọdụ n’ocheeze ya.’
  rationale: Ọ bụ ezie na okwu Pita gbara amaokwu a gburugburu na-etinye nkwa ahụ n’ahụ Jizọs, amaokwu a n’onwe ya kwuru ya dịka nkwa banyere onye ga-esi n’agbụrụ Devid pụta. Ntughari ahụ na-ahapụ ka amaokwu ndị gbara ya gburugburu kọwaa mmezu ya.
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, nke dị ugwu ma dị mfe nghọta. E debere ihe atụ ‘mkpụrụ úkwù’ n’ahịrị isi iji chekwaa oyiyi na nkwusi ike nke Grik, ma kọwaa ya n’ala ala peeji.
