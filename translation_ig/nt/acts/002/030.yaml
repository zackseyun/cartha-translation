review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys Peter's inference, David's status as prophet, God's oath, physical/dynastic descent, and God's causative act of enthronement. The two pronouns in the final clause are appropriately understood as referring to David. However, the footnote's proposed alternative, “otu n’ime ụmụ ụmụ ya,” means “one of his grandchildren,” not “one of his descendants,” and thus is too narrow for the Greek idiom.
  naturalness: The main text is generally clear Standard Igbo. Adding the connective particle in “mkpụrụ nke úkwù ya” makes the literal expression grammatically more natural. The oath expression and the causative “ọ ga-eme ka ... nọdụ” are suitable in this elevated biblical register.
  terminology: “Onye amụma,” “iyi,” and “ocheeze” are appropriate established terms. “Mkpụrụ nke úkwù ya” preserves the Greek's concrete genealogical idiom; the footnote supplies a natural nonliteral alternative without reducing it to grandchildren.
  issues:
  - severity: medium
    issue: The footnote translates “descendants” as “ụmụ ụmụ ya.”
    rationale: In Standard Igbo, “ụmụ ụmụ ya” normally denotes grandchildren, whereas ἐκ καρποῦ τῆς ὀσφύος αὐτοῦ denotes a descendant from David's own bodily line and is not restricted to grandchildren.
  - severity: low
    issue: The literal phrase lacks the genitive linker in “mkpụrụ úkwù ya.”
    rationale: “Mkpụrụ nke úkwù ya” is the more grammatically transparent and natural Standard Igbo form while retaining the literal imagery.
  revised_text: Ya mere, ebe ọ bụ onye amụma, marakwa na Chineke ji iyi ṅụọrọ ya iyi na ọ ga-eme ka otu onye sitere na mkpụrụ nke úkwù ya[a] nọdụ n’ocheeze ya,
  revised_footnotes:
