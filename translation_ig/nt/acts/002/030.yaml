    text: Ma ọ bụ, “otu n’ime ụmụ ndị ga-esi n’agbụrụ ya pụta.” N’ụzọ nkịtị, “sitere na mkpụrụ nke úkwù ya.”
    reason: lexical_alternative
  revision_rationale: The revision corrects the alternative rendering so that it denotes descendants generally rather than grandchildren specifically, and regularizes the literal idiom as “mkpụrụ nke úkwù ya.” No theological interpretation has been added, and the source's dynastic and enthronement language remains intact.
