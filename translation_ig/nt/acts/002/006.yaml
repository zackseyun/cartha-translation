source:
  edition: SBLGNT
  text: γενομένης δὲ τῆς φωνῆς ταύτης συνῆλθε τὸ πλῆθος καὶ συνεχύθη, ὅτι ⸀ἤκουον εἷς ἕκαστος τῇ ἰδίᾳ διαλέκτῳ λαλούντων αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/006.yaml
  text: And when this sound occurred[a], the crowd came together and was bewildered[b], because each one was hearing them speaking in his own dialect.
translation:
  language: ig
  text: Mgbe ụda a dara, ìgwè mmadụ ahụ gbakọtara, ha gbagwojuru anya, n’ihi na onye ọ bụla n’ime ha na-anụ ka ha na-ekwu okwu n’olumba nke ya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’asụsụ nke ya.” Okwu Grik ahụ nwere ike ịpụta asụsụ n’ozuzu ya, ọ bụ ezie na “olumba” na-egosipụta okwu Luk ji mee ihe nke ọma karị.
    reason: lexical_alternative
lexical_decisions:
- source_word: γενομένης ... τῆς φωνῆς ταύτης
  choice: Mgbe ụda a dapụtara
  rationale: Nkebi okwu genitive absolute a na-egosi oge ihe mere. N'ebe a, φωνή pụtara ụda a nụrụ, ya mere “ụda” anaghị ekpebi ma ọ bụ olu mmadụ ma ọ bụ mkpọtụ.
- source_word: συνῆλθε τὸ πλῆθος
  choice: ìgwè mmadụ ahụ gbakọtara
  rationale: “Ìgwè mmadụ” bụ okwu Igbo doro anya maka πλῆθος, ebe “gbakọtara” na-egosi na ha bịara n'otu ebe dịka συνῆλθε si kwuo.
- source_word: συνεχύθη
  choice: obi gbagwojukwara ha anya
  rationale: Akpaalaokwu Igbo a na-egosi mgbagwoju anya na ndabere uche nke ngwaa ahụ pụtara n'ọnọdụ a.
- source_word: ἤκουον εἷς ἕκαστος
  choice: onye ọ bụla n’ime ha nọ na-anụ
  rationale: “Onye ọ bụla” na-edobe ike nkesa nke εἷς ἕκαστος, ebe “nọ na-anụ” na-egosi omume na-aga n'ihu nke imperfect ἤκουον.
- source_word: τῇ ἰδίᾳ διαλέκτῳ
  choice: n’olumba nke ya
  rationale: “Olumba” na-egosipụta nke ọma διάλεκτος dịka ụdị asụsụ mmadụ ma ọ bụ obodo ya na-asụ, ma na-edobekwa ụdị otu-onye nke okwu Grik.
- source_word: λαλούντων αὐτῶν
  choice: ka ha na-asụ
  rationale: Nke a na-edobe ndị na-ekwu okwu dịka “ha” n'enweghị ịgbakwunye na ha bụ nanị ndịozi, ihe amaokwu ahụ n'onwe ya na-ekwughị.
theological_decisions:
- issue: Onye φωνή na-ezo aka na ya
  choice: ụda
  alternative: olu; mkpọtụ
  rationale: “Ụda” na-ahapụ ntụaka ahụ ka ọ bụrụ ihe a nụrụ na Pentikọst n'enweghị ikwu kpọmkwem na ọ bụ olu mmadụ ma ọ bụ mkpọtụ.
- issue: Ụdị otu-onye na nkesa nke εἷς ἕκαστος ... ἰδίᾳ
  choice: onye ọ bụla n’ime ha ... n’olumba nke ya
  alternative: ha niile ... n’olumba nke ha
  rationale: Nhọrọ a na-echekwa nkwusiri ike nke Grik na onye ọ bụla n'otu n'otu nụrụ okwu ahụ n'olumba nke ya.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta mee ihe. Akpaalaokwu “obi gbagwoju anya” bụ nke sitere n'okike n'Igbo; e debere “olumba” iji chekwaa nkọwa okwu διάλεκτος. E debere naanị otu akara nkọwa ala peeji [a], ebe ọ na-akọwa ezigbo nhọrọ okwu dị n'okwu Grik.
