id: ACT.2.1
reference: Acts 2:1
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Καὶ ἐν τῷ συμπληροῦσθαι τὴν ἡμέραν τῆς πεντηκοστῆς ἦσαν ⸂πάντες ὁμοῦ⸃ ἐπὶ τὸ αὐτό,
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/001.yaml
  text: And when the day of Pentecost had fully come[a], they were all together in one place.
translation:
  language: ig
  text: Mgbe ụbọchị Pentikọst na-eru n’uju[a], ha niile nọkọtara ọnụ n’otu ebe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “mgbe ụbọchị Pentikọst ruru n’uju.”
    reason: Ọ bụ ụzọ ọzọ e si egosipụta συμπληροῦσθαι, nke nwere ike ilekwasị anya n’ụbọchị ahụ iru n’uju karịa n’usoro ọ na-aga n’ihu.
lexical_decisions:
- source_word: συμπληροῦσθαι
  choice: na-eru n’uju
  rationale: Nhọrọ a na-egosi ihe na-aga n’ihu ruo n’uju, kwekọrọ n’infinitive dị na present passive n’usoro oge ἐν τῷ, ma na-adakwa nke ọma n’Igbo.
- source_word: πεντηκοστῆς
  choice: Pentikọst
  rationale: Nke a bụ aha a maara nke ọma n’Igbo maka emume ndị Juu a kpọrọ Πεντηκοστή n’asụsụ Grik.
- source_word: πάντες
  choice: niile
  rationale: Ọ na-egosi na ọ dịghị onye fọdụrụ n’ìgwè ahụ e kwuru okwu ya n’akụkụ bu ụzọ.
- source_word: ὁμοῦ
  choice: nọkọtara ọnụ
  rationale: Ọ na-egosi na ha nọkọrọ ọnụ dịka otu ìgwè.
- source_word: ἐπὶ τὸ αὐτό
  choice: n’otu ebe
  rationale: Ọ na-echekwa echiche banyere ebe ha nọ, ma ghara ikwughachi naanị echiche nke ịnọkọ ọnụ.
theological_decisions:
- issue: Ndị okwu ahụ bụ “ha” na-ezo aka na ha
  choice: ha niile
  alternative: mmadụ niile ahụ
  rationale: Grik ekwughachighị onye isiokwu ahụ bụ; a na-amata ya site n’ihe e kwuru tupu amaokwu a. “Ha” na-eme ka Igbo doo anya n’etinyeghị nkọwa okwukwe ọzọ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta. “Na-eru n’uju” na-echekwa nghọta nke usoro na-aga n’ihu; “nọkọtara ọnụ n’otu ebe” na-edobe ma ịdịkọ ọnụ ma ebe ha nọ.
