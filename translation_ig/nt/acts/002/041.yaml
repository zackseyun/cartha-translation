id: ACT.2.41
reference: Acts 2:41
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οἱ μὲν ⸀οὖν ἀποδεξάμενοι τὸν λόγον αὐτοῦ ἐβαπτίσθησαν, καὶ προσετέθησαν ⸀ἐν τῇ ἡμέρᾳ ἐκείνῃ ψυχαὶ ὡσεὶ τρισχίλιαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/041.yaml
  text: So those who received his word were baptized[a], and about three thousand souls were added on that day.
translation:
  language: ig
  text: Ya mere, e mere ndị nabatara okwu ya baptizim; a gbakwụnyekwara ihe dị ka puku mkpụrụ obi atọ n’ụbọchị ahụ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “mmadụ” ma ọ bụ “ndị mmadụ.” Okwu Grik a sụgharịrị “mkpụrụ obi” bụ ụzọ a na-ejikarị agụ mmadụ ọnụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ μὲν οὖν
  choice: Ya mere, ... ndị
  rationale: “Ya mere” na-egosi njikọ na ihe Pita kwusara tupu amaokwu a ma na-eme ka akụkọ ahụ gaa n’ihu n’ụzọ doro anya.
- source_word: ἀποδεξάμενοι
  choice: ndị nabatara
  rationale: “Nabatara” na-egosi na ha ji obi ọma kweta ịnara ozi ahụ, na-agbakwụghị nkọwa karịrị ihe ngwaa Grik pụtara.
- source_word: τὸν λόγον αὐτοῦ
  choice: okwu ya
  rationale: “Okwu ya” na-anọ nso n’okwu Grik ma n’ebe a ọ na-ezo aka n’ozi Pita kwusara.
- source_word: ἐβαπτίσθησαν
  choice: e mere ... baptizim
  rationale: Nhazi a na-edowe ngwaa ahụ n’ụdị nnara dịka Grik si dị, n’etinyeghị echiche otu ụka banyere ụzọ e si eme baptizim ma ọ bụ ihe ọ na-arụpụta.
- source_word: προσετέθησαν
  choice: a gbakwụnyere
  rationale: Nke a na-edowe ụdị nnara nke Grik ma hapụ onye ma ọ bụ ìgwè a gbakwụnyere ha na ya n’ekwughị ya, dịka ederede si mee.
- source_word: ψυχαὶ
  choice: mkpụrụ obi
  rationale: “Mkpụrụ obi” bụ nsụgharị doro anya nke okwu Grik ahụ. Ihe odide ala peeji na-akọwa na n’ebe a ọ bụ ụzọ a na-ejikarị agụ mmadụ ọnụ, ka a ghara ịghọta ya dị ka nkwupụta pụrụ iche banyere ọdịdị mmadụ.
- source_word: ὡσεὶ τρισχίλιαι
  choice: ihe dị ka puku ... atọ
  rationale: “Ihe dị ka” na-egosi na ọnụ ọgụgụ ahụ bụ nke a tụrụ nso, dịka ὡσεὶ si pụta.
- source_word: ἐν τῇ ἡμέρᾳ ἐκείνῃ
  choice: n’ụbọchị ahụ
  rationale: Nke a bụ ụzọ Igbo nkịtị na nke ziri ezi si egosi oge e kwuru okwu ya.
theological_decisions:
- issue: Onye ma ọ bụ ìgwè a gbakwụnyere ndị ahụ na ya
  choice: 'A hapụrụ ya n’ekwughị ya: “a gbakwụnyere”'
  alternative: “a gbakwụnyere ha na ndị kwere ekwe” ma ọ bụ “a gbakwụnyere ha n’ọgbakọ”
  rationale: Ọnọdụ okwu na-egosi na e tinyere ha n’etiti ndị kwere ekwe, ma amaokwu Grik ahụ akpọghị ihe a gbakwụnyere ha na ya aha. Ya mere, nsụgharị ahụ anaghị etinye nkọwa ụka nke ederede ekwughị kpọmkwem.
- issue: Ihe ψυχαί pụtara mgbe a na-agụ ọnụ ọgụgụ
  choice: “mkpụrụ obi” n’ahịrị isi, tinyere nkọwa ala peeji
  alternative: “mmadụ” ma ọ bụ “ndị mmadụ”
  rationale: A na-edowe okwu Grik ahụ n’ụzọ pụtara ìhè, ma nkọwa ala peeji na-echebe onye na-agụ ya ka ọ ghara iche na amaokwu a na-akụzi kpọmkwem banyere akụkụ ime mmụọ nke mmadụ kama ịgụ mmadụ ọnụ.
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, nke nwere ugwu ma dị mfe nghọta. Ahịrịokwu ahụ na-edowe ụdị nnara nke ngwaa abụọ ahụ ma na-ezere okwu ndị pụrụ ibubata ozizi otu ụka. E tinyere akara nkọwa [a] ozugbo n’akụkụ “mkpụrụ obi atọ,” bụ okwu nkọwa ahụ metụtara.
