revisions:
- from: Ya mere, e mere ndị nabatara okwu ya baptizim; n’ụbọchị ahụkwa, a gbakwụnyere ihe dị ka puku mkpụrụ obi atọ[a].
  to: Ya mere, e mere ndị nabatara okwu ya baptizim; a gbakwụnyekwara ihe dị ka puku mkpụrụ obi atọ n’ụbọchị ahụ[a].
  rationale: 'The revision only relocates the temporal expression and uses -kwa with the coordinated passive verb, yielding a clearer and more natural correspondence to the Greek sequence: baptism, then the addition of approximately three thousand on that day. It preserves the source’s unstated object of “were added,” its approximation, and the footnote’s protection against reading “mkpụrụ obi” as a technical anthropological claim.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T08:27:33Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately reflects the positive reception of Peter’s word, baptism, the approximate number, and the idiomatic counting sense of ψυχαί. However, the placement of “n’ụbọchị ahụkwa” is less direct than the Greek, where the temporal phrase modifies the adding of the approximately three thousand. A small reordering makes this relation clearer while retaining the passive and leaving the implied object of “were added” unstated.
  naturalness: “E mere ndị nabatara okwu ya baptizim” is understandable and acceptable Standard Igbo. Placing the temporal phrase after the number in the added clause is smoother and more immediately clear. The retained biblical-register expression “mkpụrụ obi” is adequately clarified by the footnote.
  terminology: “Okwu ya,” “baptizim,” “a gbakwụnyere,” and “mkpụrụ obi” are suitable. “Mkpụrụ obi” can suggest a theological sense in contemporary Igbo, so the footnote is important and correctly gives “mmadụ/ndị mmadụ” as the contextual alternative.
  issues:
  - severity: low
    issue: Temporal phrase placement
    rationale: The draft’s “n’ụbọchị ahụkwa” precedes the added number. Reordering it to follow the number makes it clearer that it qualifies the addition, matching ἐν τῇ ἡμέρᾳ ἐκείνῃ, without changing the meaning.
  revised_text: Ya mere, e mere ndị nabatara okwu ya baptizim; a gbakwụnyekwara ihe dị ka puku mkpụrụ obi atọ n’ụbọchị ahụ[a].
  revised_footnotes:
