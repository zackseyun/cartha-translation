id: ACT.2.33
reference: Acts 2:33
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τῇ δεξιᾷ οὖν τοῦ θεοῦ ὑψωθεὶς τήν τε ἐπαγγελίαν τοῦ ⸂πνεύματος τοῦ ἁγίου⸃ λαβὼν παρὰ τοῦ πατρὸς ἐξέχεεν τοῦτο ⸀ὃ ⸀ὑμεῖς βλέπετε καὶ ἀκούετε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/033.yaml
  text: Therefore[a], having been exalted to the right hand of God, and having received from the Father the promise of the Holy Spirit[b], he has poured out this that you yourselves are seeing and hearing.
translation:
  language: ig
  text: Ya mere[a], ebe e buliri ya elu n’aka nri Chineke, mgbe ọ natara n’aka Nna ahụ nkwa nke Mmụọ Nsọ[b], ọ wụsara ihe a nke unu onwe unu na-ahụ ma na-anụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Ya mere, ebe e ji aka nri Chineke bulie ya elu.” Dative Greek ahụ nwere ike igosi ọnọdụ—“n’aka nri Chineke”—ma ọ bụ ihe e ji mee ihe—“site n’aka nri Chineke.”
    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ, “Mmụọ Nsọ ahụ e kwere ná nkwa.” Greek ahụ nwere ike ịpụta na Mmụọ Nsọ n’onwe ya bụ onyinye e kwere ná nkwa, ma ọ bụ na ọ bụ nkwa gbasara Mmụọ Nsọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ δεξιᾷ τοῦ θεοῦ
  choice: n’aka nri Chineke
  rationale: Nke a bụ ụzọ Igbo si egosipụta ọnọdụ nsọpụrụ n’aka nri Chineke; ihe e dere n’ala peeji na-echekwa nghọta ọzọ nke dative ahụ, ya bụ na e ji aka nri Chineke bulie ya elu.
- source_word: οὖν
  choice: Ya mere
  rationale: Ọ na-egosi nkwubi okwu sitere n’ihe Pita kwuru tupu nke a, ọ bụghị naanị usoro ihe mere.
- source_word: ὑψωθεὶς
  choice: ebe e buliri ya elu
  rationale: 'Ọ na-echekwa aorist passive ahụ: onye ọzọ, ya bụ Chineke, buliri Jizọs elu; okwu ahụ na-egosikwa ibuli ya n’ọnọdụ nsọpụrụ.'
- source_word: τὴν ἐπαγγελίαν τοῦ πνεύματος τοῦ ἁγίου
  choice: nkwa nke Mmụọ Nsọ
  rationale: 'Nsụgharị a na-agbasochi usoro Greek ma na-echekwa nghọta abụọ: Mmụọ Nsọ nwere ike ịbụ onyinye e kwere ná nkwa, ma ọ bụ nkwa ahụ nwere ike ịbụ nke gbasara Mmụọ Nsọ.'
- source_word: λαβὼν παρὰ τοῦ πατρὸς
  choice: ebe ọ natakwara n’aka Nna ahụ
  rationale: ‘N’aka’ na-egosi isi mmalite nke ihe a natara; ‘Nna ahụ’ na-eji aha nkwanye ugwu ahụ eme ihe n’ụzọ doro anya.
- source_word: ἐξέχεεν
  choice: ọ wụsara
  rationale: Okwu a na-egosi ihe e mere emechaala, nke ihe ndị mmadụ na-ahụ ma na-anụ bụ ihe àmà ya ugbu a.
- source_word: τοῦτο
  choice: ihe a
  rationale: Ọ na-ahapụ ihe demonstrative ahụ n’ụzọ sara mbara dịka Greek si mee, n’ebughị ụzọ kọwaa ya kpọmkwem dịka ‘Mmụọ a’ ma ọ bụ ‘onyinye a.’
- source_word: ὑμεῖς βλέπετε καὶ ἀκούετε
  choice: unu onwe unu na-ahụ ma na-anụ
  rationale: ‘Unu onwe unu’ na-echekwa nkwusi ike dị na pronoun Greek, ebe present tense na-egosi ihe ha na-ahụ ma na-anụ n’oge ahụ.
theological_decisions:
- issue: Ma τῇ δεξιᾷ τοῦ θεοῦ ọ pụtara na e buliri Jizọs ‘n’aka nri Chineke’ ka ọ bụ na e ji ‘aka nri Chineke’ bulie ya elu
  choice: n’aka nri Chineke
  alternative: site n’aka nri Chineke / site n’ike aka nri Chineke
  rationale: Ọnọdụ okwu gbara amaokwu a gburugburu, tinyere ntụaka e nyere Abụ Ọma 110, na-akwado echiche nke ibuli Jizọs n’ọnọdụ ọchịchị na nsọpụrụ n’aka nri Chineke. Ma ebe dative Greek nwere ike ịbụ instrumental, e debere nghọta nke abụọ n’ala peeji.
- issue: Ma τὴν ἐπαγγελίαν τοῦ πνεύματος τοῦ ἁγίου ọ bụ ‘Mmụọ Nsọ e kwere ná nkwa’ ka ọ bụ ‘nkwa nke/banyere Mmụọ Nsọ’
  choice: nkwa nke Mmụọ Nsọ
  alternative: Mmụọ Nsọ ahụ e kwere ná nkwa
  rationale: Genitive Greek ahụ nwere ike ịkọwa Mmụọ Nsọ dịka onyinye e kwere ná nkwa ma ọ bụ ihe nkwa ahụ gbasara. Nsụgharị isi na-anọgide nso na usoro Greek ma hapụ esemokwu ahụ ka ọ dị; nkọwa ala peeji na-eme ka nghọta abụọ ahụ pụta ìhè.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị nsọpụrụ ma dị mfe nghọta, mee ihe. A họọrọ ‘Ya mere’ maka njikọ echiche, ‘Nna ahụ’ maka titular ὁ πατήρ, na ‘unu onwe unu’ iji chekwaa nkwusi ike. E zere ịgbakwunye nkọwa ụka ma ọ bụ idozi ihe Greek hapụrụ ka o nwee nghọta abụọ.
