    text: Ma ọ bụ, “Ya mere, ebe e ji aka nri Chineke bulie ya elu.” Dative Greek ahụ nwere ike igosi ọnọdụ—“n’aka nri Chineke”—ma ọ bụ ihe e ji mee ihe—“site n’aka nri Chineke.”
    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ, “Mmụọ Nsọ ahụ e kwere ná nkwa.” Greek ahụ nwere ike ịpụta na Mmụọ Nsọ n’onwe ya bụ onyinye e kwere ná nkwa, ma ọ bụ na ọ bụ nkwa gbasara Mmụọ Nsọ.
    reason: lexical_alternative
  revision_rationale: The revision supplies “nke” to render the Greek relative pronoun ὃ explicitly and make the sentence natural and complete in Standard Igbo. It also varies the second participial linker for smoother idiom, without altering sequence, agency, theological terminology, or either preserved ambiguity.
