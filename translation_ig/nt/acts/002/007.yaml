  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐξίσταντο ⸀δὲ καὶ ἐθαύμαζον ⸀λέγοντες· ⸀Οὐχ ἰδοὺ ⸀πάντες οὗτοί εἰσιν οἱ λαλοῦντες Γαλιλαῖοι;
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/007.yaml
  text: And they were astonished and amazed[a], saying, “Look, are not all these who are speaking Galileans?”
translation:
  language: ig
  text: Ha tụrụ n’anya nke ukwuu, ọ jụkwara ha anya, na-ekwu sị, “Lee[a], ndị a niile na-ekwu okwu, hà abụghị ndị Galili?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Lekwa” ma ọ bụ “Hụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξίσταντο
  choice: Ọnụ tụrụ ha nke ukwuu
  rationale: Nkebi okwu a na-egosipụta na ihe ahụ tụrụ ha n’anya nke ukwuu, nke kwekọrọ n’ike ἐξίσταντο ma bụrụkwa Igbo nkịtị nke a na-aghọta nke ọma.
- source_word: δὲ
  choice: ejikọtara ya na usoro akụkọ n’enweghị okwu njikọ pụrụ iche
  rationale: δέ bụ njikọ dị nro na-aga n’ihu n’akụkọ ahụ. N’ebe a, ịmalite ahịrịokwu ozugbo bụ ụzọ Igbo si aga were were, n’enweghị ịgbakwunye ọdịiche nke ‘ma’ nwere ike iweta.
- source_word: καὶ
  choice: ihe ahụ jukwara ha anya
  rationale: Ụdị ‘-kwara’ na-ejikọta mmeghachi omume nke abụọ na nke mbụ ma chekwaa echiche nchịkọta nke καὶ.
- source_word: ἐθαύμαζον
  choice: ihe ahụ jukwara ha anya
  rationale: Nke a bụ ụzọ Igbo doro anya isi kwuo na ha nọ na-atụ n’anya ma na-eju anya n’ihe ha hụrụ.
- source_word: λέγοντες
  choice: Ha sịrị
  rationale: Ọ bụ nsụgharị Igbo sitere n’okike nke participle na-ebute okwu ha kwuru, n’enweghị ịgbanwe ọdịnaya ya.
- source_word: Οὐχ
  choice: hà abụghị
  rationale: Ajụjụ n'ụdị ‘hà abụghị...?’ na-egosi na a na-atụ anya azịza nkwenye, dịka οὐχ si arụ ọrụ n'ebe a.
- source_word: ἰδοὺ
  choice: Lee
  rationale: ‘Lee’ bụ oku e ji adọta uche nke dị ugbu a, dị nkenke, ma kwekọọ na ἰδού.
- source_word: πάντες οὗτοί
  choice: ndị a niile
  rationale: Nke a na-ezo aka n’ìgwè ahụ dum n’enweghị ịgbakwunye na ha bụ ụmụ nwoke, ihe Grik ekwughị kpọmkwem.
- source_word: οἱ λαλοῦντες
  choice: na-ekwu okwu
  rationale: Nke a na-egosi omume ikwu okwu na-aga n’ihu ma jikọta ya nke ọma na ‘ndị a niile.’
- source_word: Γαλιλαῖοι
  choice: ndị Galili
  rationale: Nke a bụ aha mpaghara e ji amata ndị si Galili, ma ọ naghị agbakwunye nkọwa banyere agụmakwụkwọ, olu, ma ọ bụ ọnọdụ ha.
theological_decisions:
- issue: Ihe mmekọrịta mmadụ na mpaghara nke okwu ‘ndị Galili’ nwere ike ịpụta
  choice: E debere naanị ‘ndị Galili.’
  alternative: ndị Galili na-agụghị akwụkwọ / ndị Galili si n’ebe ugwu
  rationale: Amaokwu ahụ na-egosi na ebe ha si juru ndị mmadụ anya, ma ọ kọwaghị ihe mere o ji ju ha anya. Ya mere, nsụgharị ahụ etinyeghị nkọwa gbasara agụmakwụkwọ, olu, ma ọ bụ ọkwá mmadụ.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị nsọpụrụ ma dị mfe nghọta. E chekwara mmeghachi omume abụọ dị na Grik n’agbanyeghị na ha yiri ibe ha, ma e ji ahịrịokwu abụọ mee ka okwu ahụ daa nke ọma n’Igbo.
