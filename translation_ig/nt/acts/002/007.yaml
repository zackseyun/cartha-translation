revisions:
- from: Ọnụ tụrụ ha nke ukwuu, ihe ahụ jukwara ha anya. Ha sịrị, “Lee[a], ndị a niile na-ekwu okwu hà abụghị ndị Galili?”
  to: Ha tụrụ n’anya nke ukwuu, ọ jụkwara ha anya, na-ekwu sị, “Lee[a], ndị a niile na-ekwu okwu, hà abụghị ndị Galili?”
  rationale: The revision keeps the paired reactions of ἐξίσταντο and ἐθαύμαζον without supplying “ihe ahụ” as an explicit object. It also renders λέγοντες as an accompanying participial expression and preserves the question’s expected affirmative answer, the attention particle, and the neutral term “ndị Galili.”
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T08:27:19Z'
review_pass:
  verdict: revise
  source_fidelity: The draft retains both imperfect reactions, the affirmative-expecting negative question, the attention particle, and the unembellished regional designation “ndị Galili.” However, “ihe ahụ” (“that thing”) introduces an explicit referent not present in the Greek, and the independent “Ha sịrị” somewhat weakens the close connection of λέγοντες with the reactions.
  naturalness: “Ọnụ tụrụ ha nke ukwuu” and “juru ha anya” are natural Standard Igbo expressions. A single integrated sentence with “na-ekwu sị” better reflects the Greek flow and reads naturally. Placing a comma before the question makes the quoted question easier to follow.
  terminology: “ndị Galili” is correct and suitably neutral for Γαλιλαῖοι. “Lee” is an appropriate modern attention-getter for ἰδού; the lexical-alternative footnote remains appropriate.
  issues:
  - severity: medium
    issue: “ihe ahụ” adds an explicit object to the second reaction.
    rationale: ἐθαύμαζον simply says that they were marveling/amazed. Although the referent is readily inferred in context, “ihe ahụ” makes it more explicit than the source. Recasting the clause with the implicit pronoun avoids this addition.
  - severity: low
    issue: The participial “λέγοντες” is rendered as a separate finite sentence (“Ha sịrị”).
    rationale: This does not change the meaning, but “na-ekwu sị” more closely preserves the participle’s connection to the preceding astonishment while remaining idiomatic Igbo.
  revised_text: Ha tụrụ n’anya nke ukwuu, ọ jụkwara ha anya, na-ekwu sị, “Lee[a], ndị a niile na-ekwu okwu, hà abụghị ndị Galili?”
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “Lekwa” ma ọ bụ “Hụ.”
    reason: lexical_alternative
