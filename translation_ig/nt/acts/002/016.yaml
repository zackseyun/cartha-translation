  yaml_path: translation/nt/acts/002/016.yaml
  text: But this is what was spoken through the prophet Joel:[a]
translation:
  language: ig
  text: Kama, nke a bụ ihe e kwuru site n’aka onye amụma Joel:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịtụgharị ya, “nke onye amụma Joel kwuru.” Okwu Grik ahụ nwere ike igosi onye mere ihe ahụ, ma “site n’aka” na-echekwa ọrụ Joel dị ka onye e si n’aka ya zie ozi amụma ahụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Kama
  rationale: Ọ na-egosi mmezi megide nghọtahie ìgwè mmadụ ahụ n'okwu ndị bu ụzọ; “Kama” bụ njikọ Igbo dị mma maka ntụgharị okwu a.
- source_word: τοῦτό
  choice: nke a
  rationale: Ọ na-ezo aka n'ihe ahụ na-eme ugbu a, n'ụzọ doro anya ma bụrụkwa Igbo nkịtị.
- source_word: ἐστιν
  choice: bụ
  rationale: A hapụrụ ya dịka ngwaa njikọ nkịtị, n'etinyeghị nkọwa sara mbara dịka “pụtara.”
- source_word: τὸ εἰρημένον
  choice: ihe e kwuru
  rationale: Nke a na-egosipụta participle passive e ji dị ka aha n'Igbo eke, ma chekwaa na e kwuru okwu ahụ.
- source_word: διὰ
  choice: site n’ọnụ
  rationale: N'ọnọdụ onye amụma na-ebuga ozi, akpaalaokwu Igbo a na-egosi onye e si n'aka ya kwuo okwu ahụ, ma ghara ime Joẹl ka ọ bụrụ isi mmalite ikpeazụ nke ozi ahụ.
- source_word: τοῦ προφήτου
  choice: onye amụma
  rationale: Ọ na-echekwa ọrụ Joẹl dị ka onye amụma na onye e si n'aka ya zie ozi ahụ.
- source_word: Ἰωήλ
  choice: Joẹl
  rationale: Nke a bụ nsụgharị mkpụrụedemede aha ahụ nke a na-amakarị n'Igbo.
theological_decisions:
- issue: Ịbụ onye mgbasa ozi amụma n'okwu διὰ τοῦ προφήτου Ἰωήλ
  choice: site n’ọnụ onye amụma Joẹl
  alternative: onye amụma Joẹl kwuru
  rationale: Nhọrọ a na-echekwa echiche Grik nke onye amụma dị ka ụzọ e si kwuo ozi ahụ, n'ekwughị karịa ihe ederede kwuru banyere otú mkpali amụma si arụ ọrụ.
translation_notes:
  register: Standard Igbo; okwu dị ugbu a, dị ùgwù, dịkwa mfe nghọta. E ji “site n’ọnụ” mee ka echiche onye na-ebuga ozi bụrụ Igbo eke, ma e debere akara ntụaka [a] n'ahịrị isi.
