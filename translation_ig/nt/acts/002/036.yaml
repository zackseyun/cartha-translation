id: ACT.2.36
reference: Acts 2:36
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀσφαλῶς οὖν γινωσκέτω πᾶς οἶκος Ἰσραὴλ ὅτι καὶ κύριον ⸂αὐτὸν καὶ χριστὸν⸃ ⸂ἐποίησεν ὁ θεός⸃, τοῦτον τὸν Ἰησοῦν ὃν ὑμεῖς ἐσταυρώσατε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/036.yaml
  text: Therefore let all the house of Israel know for certain that God has made him both Lord and Messiah—this Jesus whom you crucified[a][b].
translation:
  language: ig
  text: Ya mere, ka ụlọ Izrel niile mara nke ọma na Chineke emeela Jizọs a, onye unu kpọgidere n’obe, ka ọ bụrụ ma Onyenwe anyị ma Mezaya.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “Kraịst.” Okwu Grik bụ Χριστός (Christos); e ji “Mezaya” sụgharịa ya ebe a iji gosi na ọ bụ aha ọkwa n’okwu Pita gwara Izrel.
    reason: alternative_reading
  - marker: b
    text: Okwu Grik ahụ bụ “emewo ya ma Onyenwe anyị ma Mezaya.” N’ọnọdụ okwu Pita kwuru tupu nke a, okwu ahụ metụtara Chineke ibuli Jizọs elu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσφαλῶς
  choice: nke ọma
  rationale: N’usoro okwu a, “mara nke ọma” na-egosi ịmata ihe n’enweghị obi abụọ, ma na-ada n’ụzọ ebumpụta ụwa n’Igbo.
- source_word: οὖν
  choice: Ya mere
  rationale: Ọ na-egosi nkwubi okwu sitere n’arụmụka Pita kwuru tupu nke a banyere mbilite n’ọnwụ na ibuli Jizọs elu.
- source_word: γινωσκέτω
  choice: ka ... mara
  rationale: Nke a na-echekwa ike iwu nke third-person imperative ahụ ma na-agwa Izrel dịka otu ìgwè.
- source_word: πᾶς οἶκος Ἰσραήλ
  choice: ụlọ Izrel niile
  rationale: Ọ na-echekwa akpaalaokwu Akwụkwọ Nsọ nke na-ezo aka n’Izrel niile dịka ndị ọgbụgba ndụ.
- source_word: κύριον
  choice: Onyenwe anyị
  rationale: Aha a na-egosi ikike dị elu nke Jizọs, ma kwekọọ na ojiji Akwụkwọ Nsọ ndị Igbo maara.
- source_word: Χριστόν
  choice: Mezaya
  rationale: N’ebe a ọ bụ aha ọkwa nke Onye E Tere Mmanụ nke Izrel na-atụ anya ya, ọ bụghị naanị aha nke ghọrọ akụkụ aha Jizọs.
- source_word: ἐποίησεν
  choice: emeela ... ka ọ bụrụ
  rationale: Nke a na-echekwa isi echiche nke ‘mere’ ma na-egosi omume Chineke zuru ezu nke nwere mmetụta ugbu a, n’Igbo doro anya.
- source_word: τοῦτον τὸν Ἰησοῦν
  choice: Jizọs a
  rationale: Ọ na-echekwa nrụgide demonstrative nke na-arụtụ aka n’otu Jizọs ahụ kpọmkwem.
- source_word: ὃν ὑμεῖς ἐσταυρώσατε
  choice: onye unu kpọgidere n’obe
  rationale: Nsụgharị a kpọmkwem ma doo anya, na-echekwakwa ebubo Pita boro ndị na-ege ya ntị.
theological_decisions:
- issue: Ihe okwu ‘Chineke emeela ... ka ọ bụrụ ma Onyenwe anyị ma Mezaya’ pụtara banyere onye Jizọs bụ
  choice: E chekwara okwu ahụ dịka nkwupụta banyere ibuli Jizọs elu na ime ka ọ pụta ìhè n’ọkwa ndị a n’akụkọ nzọpụta.
  alternative: Ịsụgharị ya ka ọ pụta na Jizọs gbanwere n’ụdị chi ya, ma ọ bụ na ọ bụ naanị mgbe ahụ ka ọ malitere ịbụ Mezaya.
  rationale: ἐποίησεν nwere ike ịsụgharị dịka ‘mere,’ ya mere e kwesịghị ime ka ike okwu ahụ daa; ma ọnọdụ ya na-ekwu maka mbilite n’ọnwụ na ibuli Jizọs elu, ọ bụghị ịgbanwe ọdịdị ya.
- issue: Nsụgharị Χριστός
  choice: Mezaya
  alternative: Kraịst
  rationale: Pita na-agwa ‘ụlọ Izrel,’ ya mere echiche nke aha ọkwa ahụ—Onye E Tere Mmanụ ahụ—pụtara ìhè karịa ojiji ya dịka aha nkịtị.
translation_notes:
  register: Ejiri Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. “Ụlọ Izrel niile” na-echekwa akpaalaokwu Akwụkwọ Nsọ; “Onyenwe anyị” na “Mezaya” na-echekwa aha ọkwa ndị dị mkpa. E doziri usoro nkebiokwu ka ọ bụrụ nke ebumpụta ụwa n’Igbo n’enweghị iwepụ nrụgide dị na “Jizọs a” na “onye unu kpọgidere n’obe.”
