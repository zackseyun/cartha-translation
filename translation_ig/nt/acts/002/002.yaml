  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἐγένετο ἄφνω ἐκ τοῦ οὐρανοῦ ἦχος ὥσπερ φερομένης πνοῆς βιαίας καὶ ἐπλήρωσεν ὅλον τὸν οἶκον οὗ ἦσαν καθήμενοι,
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/002.yaml
  text: And suddenly there came from heaven a sound like that of a violent rushing wind[a], and it filled the whole house where they were sitting.
translation:
  language: ig
  text: Na mberede, ụda sitere n’eluigwe bịara, dị ka nke oké ifufe na-efe n’ike[a]; ụda ahụ wee jupụta ụlọ ahụ dum ebe ha nọ ọdụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ụda dị ka nke ifufe dị ike a na-ebugharị.” Okwu Grik ji ụda ahụ tụnyere ikuku na-agagharị n’ike; o kwughị hoo haa na ifufe n’onwe ya nọ ebe ahụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: bịa
  rationale: N’usoro a, “bịa” bụ ụzọ Igbo si akọ na ụda malitere na mberede, n’enweghị ntụgharị siri ike dịka “o mere.”
- source_word: ἄφνω
  choice: Na mberede
  rationale: Ọ na-egosi na ihe ahụ mere na-atụghị anya ya ma na-edobe olu dị ùgwù ma doo anya.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: sitere n’eluigwe
  rationale: “Eluigwe” na-egosi ebe ụda ahụ si bịa ma kwe ka nghọta banyere isi mmalite ya nke eluigwe dịgide; “mbara igwe” ga-eme ka ọ bụrụ naanị ihe gbasara ikuku.
- source_word: ἦχος
  choice: ụda
  rationale: “Ụda” bụ okwu sara mbara ma kwekọọ nke ọma; ọ naghị etinye echiche na ọ bụ mkpọtụ na-adịghị mma ma ọ bụ mbigbọ kpọmkwem.
- source_word: ὥσπερ
  choice: dị ka ụda
  rationale: Nke a na-eme ka o doo anya na e ji ụda ahụ tụnyere ụda ifufe, ọ bụghị na amaokwu ahụ kwuru hoo haa na ifufe n’onwe ya nọ ebe ahụ.
- source_word: φερομένης πνοῆς βιαίας
  choice: oké ifufe na-efe n’ike
  rationale: Nkebi a na-egosi ikuku na-agagharị n’ike. Nsụgharị a bụ Igbo e ji eme ihe nke na-ejide ma ngagharị ma ike ya.
- source_word: ἐπλήρωσεν
  choice: ụda ahụ wee jupụta
  rationale: Ikwughachi “ụda ahụ” na-eme ka onye na-agụ ya mara nke ọma na, n’usoro ahịrịokwu Grik, ọ bụ ụda ahụ jupụtara ụlọ ahụ.
- source_word: ὅλον τὸν οἶκον
  choice: ụlọ ahụ dum
  rationale: Ọ na-echekwa echiche nke ụlọ ahụ niile n’asụsụ Igbo dị mfe ma bụrụkwa nke eke.
- source_word: οὗ ἦσαν καθήμενοι
  choice: ebe ha nọ ọdụ
  rationale: Ọ bụ ụzọ Igbo doro anya ma dị ugbu a isi kọwaa ọnọdụ ha nọ n’oge ahụ.
theological_decisions:
- issue: Ma ihe ahụ a kọwara ọ̀ bụ ifufe n’onwe ya ka ọ̀ bụ ụda e ji tụnyere ifufe
  choice: 'E debere ntụnyere ahụ: “ụda ... dị ka ụda oké ifufe na-efe n’ike.”'
  alternative: Ịsị na oké ifufe n’onwe ya jupụtara ụlọ ahụ.
  rationale: Okwu Grik ὥσπερ na-egosi ntụnyere. Ya mere, nsụgharị ahụ anaghị ekwu ihe karịrị ihe ederede kwuru banyere ma ifufe nkịtị ọ̀ nọ ebe ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị mfe nghọta ma dịkwa ùgwù. Akara nkewapụ ahịrịokwu na-enyere aka ijide njikọ nke akụkọ Grik ahụ, ebe ikwughachi “ụda ahụ” na-ewepụ mgbagwoju anya banyere ihe jupụtara ụlọ ahụ.
