  rationale: 'The revision corrects the unnatural spatial expression while retaining every source element: emphatic inclusion, both sexes among the enslaved/servant class, the temporal phrase, divine outpouring, and prophesying. It preserves the ἀπό nuance in a properly worded footnote and keeps the translation in clear modern Standard Igbo.'
