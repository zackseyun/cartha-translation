  text: καί γε ἐπὶ τοὺς δούλους μου καὶ ἐπὶ τὰς δούλας μου ἐν ταῖς ἡμέραις ἐκείναις ἐκχεῶ ἀπὸ τοῦ πνεύματός μου, καὶ προφητεύσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/018.yaml
  text: Even on my male servants and my female servants in those days I will pour out from my Spirit[b][a], and they will prophesy.
translation:
  language: ig
  text: Ọbụna n’elu ndị ohu m[b], ma ndị nwoke ma ndị nwanyị, n’ụbọchị ndị ahụ, aga m awụpụ Mmụọ m[a]; ha ga-ebu amụma.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “aga m awụpụ site na Mmụọ m.” N’asụsụ Grik, e kwuru kpọmkwem, “site na Mmụọ m.”
    reason: lexical_alternative
  - marker: b
    text: Okwu Grik ndị e ji mee ihe n’ebe a nwere ike ịpụta ndị ohu ma ọ bụ ndị na-eje ozi; “ndị ohu” na-eme ka ọnọdụ dị ala ha n’obodo pụta ìhè.
    reason: lexical_alternative
lexical_decisions:
- source_word: καί γε
  choice: Ọbụna
  rationale: Ọ na-egosipụta nkwusi ike na ihe a na-ekwu metụtakwara ndị nọ n’ọnọdụ dị ala n’obodo.
- source_word: ἐπὶ τοὺς δούλους μου καὶ ἐπὶ τὰς δούλας μου
  choice: n’ahụ ndị ohu m ndị nwoke, nakwa n’ahụ ndị ohu m ndị nwanyị
  rationale: “Ndị ohu” na-echekwa ọnọdụ mmekọrịta mmadụ na ibe ya nke δοῦλος/δούλη, ebe “ndị nwoke” na “ndị nwanyị” na-egosipụta ọdịiche nwoke na nwanyị dị n’asụsụ Grik.
- source_word: ἐν ταῖς ἡμέραις ἐκείναις
  choice: n’ụbọchị ndị ahụ
  rationale: Nke a bụ nsụgharị doro anya ma bụrụkwa okwu a na-asụkarị n’Igbo.
- source_word: ἐκχεῶ ἀπὸ τοῦ πνεύματός μου
  choice: aga m awụpụ Mmụọ m
  rationale: Nke a na-echekwa ihe atụ nke ịwụpụ n’ụzọ Igbo dị mfe nghọta; nkọwa ala peeji na-egosi na Grik kwuru kpọmkwem “site na Mmụọ m.”
- source_word: προφητεύσουσιν
  choice: ha ga-ebukwa amụma
  rationale: “Ibu amụma” bụ ụzọ Igbo doro anya ma kwanyere ugwu isi kwuo ikwu okwu amụma.
theological_decisions:
- issue: Nsụgharị δοῦλος/δούλη n’ebe a na-ekwusi ike banyere ndị nọ n’ọnọdụ dị ala
  choice: ndị ohu m ndị nwoke / ndị ohu m ndị nwanyị
  alternative: ndị na-ejere m ozi, ma ndị nwoke ma ndị nwanyị
  rationale: “Ndị ohu” na-echekwa ọnọdụ agbụ na ịdị ala n’obodo nke okwu Grik ndị a nwere ike igosi, ma nsụgharị ahụ anaghị etinye ozizi ọzọ n’ime amaokwu ahụ.
- issue: Ihe ἀπὸ τοῦ πνεύματός μου pụtara
  choice: awụpụ Mmụọ m, tinyere nkọwa na Grik sịrị “site na Mmụọ m”
  alternative: awụpụ ihe si na Mmụọ m
  rationale: Isi nsụgharị ahụ bụ Igbo eke ma ghara ime ka onye na-agụ ya chee na a na-awụpụ naanị otu akụkụ nke Mmụọ; nkọwa ala peeji na-echekwa preposition ἀπό na mgbagwoju anya ya.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe nghọta ma dịkwa ùgwù mee ihe. E chekwara nkwusi ike nke “ọbụna,” ọdịiche nwoke na nwanyị, na ihe atụ nke ịwụpụ Mmụọ, ebe nkọwa ala peeji na-edebe ụzọ okwu Grik si dị kpọmkwem.
