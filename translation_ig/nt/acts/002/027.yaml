  to: n’ihi na ị gaghị ahapụ mkpụrụ obi m n’Hedis[a], ị gaghịkwa ekwe ka Onye Nsọ gị[b] hụ ire ure[c].
  rationale: The revision gives the Greek term ᾅδης a direct Igbo transliteration in the verse and moves the Hebrew-background term Sheol to the footnote. It also clarifies the lexical alternative for ὅσιος without altering the Christological contextual capitalization of the main rendering. All footnote markers remain anchored in the verse.
