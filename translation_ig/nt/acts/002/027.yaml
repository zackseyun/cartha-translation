  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὅτι οὐκ ἐγκαταλείψεις τὴν ψυχήν μου εἰς ⸀ᾅδην, οὐδὲ δώσεις τὸν ὅσιόν σου ἰδεῖν διαφθοράν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/027.yaml
  text: because you will not abandon my soul to Hades[c][b][a], nor will you let your Holy One see decay.
translation:
  language: ig
  text: n’ihi na ị gaghị ahapụ mkpụrụ obi m n’Hedis[a], ị gaghịkwa ekwe ka Onye Nsọ gị[b] hụ ire ure[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “na Sheol,” dịka ihe odide Hibru nke Abụ Ọma a e hotara si kwuo; ihe odide Grik ebe a nwere “Hedis.”
    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ, “onye gị na-eguzosi ike n’ihe.”
    reason: lexical_alternative
  - marker: c
    text: Ya bụ, ire ure ma ọ bụ mmebi nke anụ ahụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγκαταλείψεις
  choice: ị gaghị ahapụ
  rationale: “Ịhapụ” bụ okwu Igbo doro anya ma kwekọọ n’echiche nke ịhapụ mmadụ n’ọnọdụ ma ọ bụ n’ebe ahụ.
- source_word: ψυχήν
  choice: mkpụrụ obi m
  rationale: “Mkpụrụ obi” na-echekwa ọdịdị okwu e hotara n’Abụ Ọma na ibu echiche mmadụ dị na ψυχή, n’agbanyeghị na okwu ahụ nwekwara ike ịpụta ndụ ma ọ bụ mmadụ n’onwe ya.
- source_word: εἰς ᾅδην
  choice: n’Ụwa Ndị Nwụrụ Anwụ
  rationale: Nke a na-egosi ógbè ndị nwụrụ anwụ n’enweghị itinye echiche nke ọkụ ala mmụọ n’amaokwu ahụ. Ọ na-enye onye Igbo nkọwa pụtara ìhè karịa ibugharị aha Grik ahụ naanị.
- source_word: δώσεις ... ἰδεῖν
  choice: ị gaghịkwa ekwe ka ... hụ
  rationale: Ọ bụ ezie na δώσεις pụtara n’ụzọ nkịtị “ị ga-enye,” ya na infinitive ebe a bụ akpaalaokwu nke pụtara ikwe ka ihe mee.
- source_word: τὸν ὅσιόν σου
  choice: Onye Nsọ gị
  rationale: “Onye Nsọ” na-echekwa ma echiche ịdị nsọ ma ntụaka Kraịst nke Pita na-eme n’akụkụ Akwụkwọ Nsọ a.
- source_word: διαφθοράν
  choice: ire ure
  rationale: “Ire ure” na-egosi mmebi anụ ahụ nke ọma ma na-ezere nghọtahie gbasara nrụrụ omume.
theological_decisions:
- issue: Nsụgharị ᾅδης n’okwu gbasara mbilite n’ọnwụ
  choice: Ụwa Ndị Nwụrụ Anwụ
  alternative: Hedis; Sheol; ili
  rationale: Nhọrọ a na-egosi ebe ma ọ bụ ógbè ndị nwụrụ anwụ, ghara ime ka okwu ahụ bụrụ ọkụ ala mmụọ ma ọ bụ naanị otu ili. Ihe odide Hibru dị n’azụ okwu a nwere “Sheol,” nke e debere n’ala peeji.
- issue: Njirimara Kraịst dị na τὸν ὅσιόν σου
  choice: Onye Nsọ gị
  alternative: onye gị kwesịrị ntụkwasị obi; onye gị ji ofufe Chineke kpọrọ ihe
  rationale: Ọrụ Ndịozi 2 ji okwu Abụ Ọma a kọwaa Jizọs. “Onye Nsọ” na-echekwa nghọta ahụ n’ebughị ozizi ọzọ etinye n’ihe odide ahụ.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E jiri “Ụwa Ndị Nwụrụ Anwụ” kọwaa ᾅδης n’ụzọ nkịtị nye ndị na-agụ Igbo, ebe ndetu ala peeji na-echekwa aha “Hedis” na ndabere Hibru “Sheol.” Akara ndetu [a], [b], na [c] niile dị n’ahịrị amaokwu ahụ.
