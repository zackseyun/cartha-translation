source:
  edition: SBLGNT
  text: ἑτέροις τε λόγοις πλείοσιν διεμαρτύρατο, καὶ παρεκάλει ⸀αὐτοὺς λέγων· Σώθητε ἀπὸ τῆς γενεᾶς τῆς σκολιᾶς ταύτης.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/040.yaml
  text: And with many other words he solemnly testified and kept urging them[a], saying, “Be saved from this crooked generation.”
translation:
  language: ig
  text: O jikwa ọtụtụ okwu ndị ọzọ gbaa ha àmà siri ike, ọ nọgidekwara na-arịọ ha ike, sị, “Ka e zọpụta unu pụọ n’ọgbọ a gbagọrọ agbagọ.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἑτέροις τε λόγοις πλείοσιν
  choice: jikwa ọtụtụ okwu ndị ọzọ
  rationale: Nke a na-edobe ma echiche ‘okwu ndị ọzọ’ ma ụbara ha, n’ụzọ Igbo na-aga were were.
- source_word: διεμαρτύρατο
  choice: gbaa ha àmà siri ike
  rationale: ‘Gbaa àmà’ na-egosi ịgba akaebe, ebe ‘siri ike’ na-ebute ịdị arọ na nkwusi ike dị na ngwaa Grik ahụ n’enweghị ịgbanwe ya ka ọ bụrụ naanị ịdọ aka ná ntị.
- source_word: παρεκάλει
  choice: na-arịọsikwa ha ike
  rationale: Ụdị ‘na-arịọsi ... ike’ na-egosi omume gara n’ihu ma ọ bụ e mere ugboro ugboro, ma na-ebukwa echiche nke ịgba ume na ịrịọ arịrịọ siri ike.
- source_word: αὐτοὺς
  choice: ha
  rationale: Ọ na-ezo aka n’ebe ndị Pita na-agwa okwu nọ.
- source_word: Σώθητε
  choice: Ka a zọpụta unu
  rationale: Nke a na-edobe olu nnara nke ngwaa Grik ahụ ma ka na-anụkwa dị ka oku e nyere ndị na-ege ntị ka ha meghachi omume.
- source_word: ἀπὸ
  choice: n’
  rationale: N’ahịrịokwu ‘zọpụta unu n’...’, nke a na-egosi ikewapụ ma ọ bụ ịnapụta site n’otu ihe.
- source_word: γενεᾶς
  choice: ọgbọ
  rationale: ‘Ọgbọ’ bụ ihe kwekọrọ n’ụzọ doro anya na γενεά ma na-ezo aka n’ụmụ mmadụ bi n’oge ahụ.
- source_word: σκολιᾶς
  choice: gbagọrọ agbagọ
  rationale: Nke a na-edobe ihe atụ nke ihe gbagọrọ agbagọ ma na-egosikwa nrụrụ omume n’Igbo dị ndụ ma doo anya.
theological_decisions:
- issue: Olu na onye na-eme ihe na Σώθητε
  choice: Ka a zọpụta unu
  alternative: Zọpụtanụ onwe unu n’ọgbọ a gbagọrọ agbagọ.
  rationale: Ngwaa Grik dị n’olu nnara; nsụgharị bụ isi na-edobe nke ahụ ka ọ ghara ime ka ọ dị ka mmadụ ji ike onwe ya zọpụta onwe ya. Ma n’ihi na ọ bụ iwu, ọ ka bụ ezigbo oku ka ndị na-ege ntị zaghachi.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. ‘Na-arịọsikwa ha ike’ na-egosi omume gara n’ihu; ‘Ka a zọpụta unu’ na-echekwa olu nnara na esemokwu gbasara nzaghachi mmadụ na onye na-eweta nzọpụta.
