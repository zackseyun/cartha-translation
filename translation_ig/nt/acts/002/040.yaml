revisions:
- from: O jikwa ọtụtụ okwu ndị ọzọ gbaa ha àmà siri ike, na-arịọsikwa ha ike[a] sị, “Ka a zọpụta unu n’ọgbọ a gbagọrọ agbagọ.”
  to: O jikwa ọtụtụ okwu ndị ọzọ gbaa ha àmà siri ike, ọ nọgidekwara na-arịọ ha ike, sị, “Ka e zọpụta unu pụọ n’ọgbọ a gbagọrọ agbagọ.”
  rationale: The revision makes the passive imperative idiomatic in Standard Igbo and explicitly renders the separative force of ἀπό. It also better represents the imperfect aspect of παρεκάλει as continuing past action. The wording retains the source’s witness-bearing and exhortational register, its reference to “this” generation, and the ambiguity concerning the hearers’ response and divine agency.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T08:27:37Z'
review_pass:
  verdict: revise
  source_fidelity: 'The draft conveys the major components of the Greek: Peter’s additional words, emphatic testimony, continued urging, and the passive imperative to be saved from the present crooked generation. However, the main verb sequence can more clearly reflect the completed testimony followed by ongoing urging, and the preposition should explicitly communicate separation from the generation.'
  naturalness: “Ka e zọpụta unu” is the more idiomatic Standard Igbo impersonal/passive imperative than “Ka a zọpụta unu.” “Pụọ n’ọgbọ a” makes the separative force natural and unambiguous. “Na-arịọsikwa ha ike” is understandable, but “ọ nọgidekwara na-arịọ ha ike” more naturally expresses the imperfect’s continuing force in a past narrative.
  terminology: “Gbaa ha àmà” appropriately preserves witness/testimony, “ọgbọ” accurately renders γενεά, and “gbagọrọ agbagọ” preserves the metaphor of σκολιά. The revision retains the passive form of Σώθητε without importing a theological explanation beyond the Greek.
  issues:
  - severity: medium
    issue: The main text uses “Ka a zọpụta unu n’ọgbọ a,” which is less idiomatic than Standard Igbo “Ka e zọpụta unu” and leaves the separative sense of ἀπό less explicit.
    rationale: The Greek is a passive imperative plus ἀπό (“from”). “Ka e zọpụta unu pụọ n’ọgbọ a” is idiomatic, retains the passive voice, and clearly expresses rescue/separation from the generation.
  - severity: low
    issue: “na-arịọsikwa ha ike” does not as clearly mark the past, ongoing action of παρεκάλει in this narrative.
    rationale: Adding “ọ nọgidekwara” naturally expresses Peter’s continued urging while keeping the exhortative sense.
  revised_text: O jikwa ọtụtụ okwu ndị ọzọ gbaa ha àmà siri ike, ọ nọgidekwara na-arịọ ha ike, sị, “Ka e zọpụta unu pụọ n’ọgbọ a gbagọrọ agbagọ.”
  revised_footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “Zọpụtanụ onwe unu n’ọgbọ a gbagọrọ agbagọ.” Ngwaa Grik ahụ dị n’olu nnara (“ka e zọpụta unu”), ma ụfọdụ nsụgharị na-eji olu omume egosi nzaghachi a chọrọ n’aka ndị na-ege ntị.
    reason: alternative_reading
  revision_rationale: The revision makes the passive imperative idiomatic in Standard Igbo and explicitly renders the separative force of ἀπό. It also better represents the imperfect aspect of παρεκάλει as continuing past action. The wording retains the source’s witness-bearing and exhortational register, its reference to “this” generation, and the ambiguity concerning the hearers’ response and divine agency.
