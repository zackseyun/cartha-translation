- from: I mere ka m mata ụzọ nke ndụ[a]; ị ga-eme ka ọṅụ jupụta m mgbe mụ na gị nọ[b].
  to: I mere ka m mata ụzọ nke ndụ[a]; I ga-emeju m n'ọṅụ n'ihu gị[b].
  rationale: 'The revision replaces the temporal phrase “mgbe mụ na gị nọ” with “n''ihu gị,” which faithfully represents the Greek face/presence idiom. It also uses the direct transitive expression “I ga-emeju m n''ọṅụ” to retain the Greek subject-action structure: “you will fill me with gladness.” Footnote anchors remain correctly attached to the lexical alternative for “paths/ways” and the presence idiom.'
