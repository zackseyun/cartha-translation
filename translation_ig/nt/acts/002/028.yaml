base_translation:
  language: en
  yaml_path: translation/nt/acts/002/028.yaml
  text: You made known to me the paths of life[b][a]; you will fill me with gladness with your presence.
translation:
  language: ig
  text: I mere ka m mata ụzọ nke ndụ[a]; I ga-emeju m n'ọṅụ n'ihu gị[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ụzọ ndụ.”
    reason: lexical_alternative
  - marker: b
    text: N'ụzọ nkịtị, “ya na ihu gị”; ya bụ, n'ihu gị, n'ọnụnọ gị.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγνώρισάς μοι
  choice: I mere ka m mata
  rationale: 'Nke a na-egosipụta echiche causative nke γνωρίζω na onye nnata nke dative μοι n''Igbo eke: Chineke mere ka onye na-ekwu mata.'
- source_word: ὁδοὺς ζωῆς
  choice: ụzọ nke ndụ
  rationale: “Ụzọ” nwere ike ịbụ otu ụdị okwu n'Igbo ma ọ na-anọchi otu ụzọ ma ọ bụ ọtụtụ ụzọ dabere n'ọnọdụ; “nke ndụ” na-edobe njikọ genitive ahụ n'ebughị ụzọ kpebie ma ha bụ ụzọ e ji ebi ndụ ma ọ bụ ụzọ na-eduga ná ndụ.
- source_word: πληρώσεις με εὐφροσύνης
  choice: ị ga-eme ka ọṅụ jupụta m
  rationale: Nke a na-edobe future πληρώσεις na echiche nke mmadụ ijupụta n'ọṅụ, ma bụrụkwa Igbo dị mfe ma kwekọọ n'usoro okwu ahụ.
- source_word: μετὰ τοῦ προσώπου σου
  choice: mgbe mụ na gị nọ
  rationale: N'ụzọ nkịtị ọ bụ “ya na ihu gị,” ma okwu ahụ pụtara ịnọ n'ihu Chineke ma ọ bụ n'ebe ọ nọ. Nsụgharị a na-eme ka okwu ahụ doo ndị na-agụ Igbo anya, ma ihe odide ala na-echekwa ihe oyiyi “ihu” dị na isi mmalite.
theological_decisions:
- issue: Okwu gbasara ịnọ n'ihu Chineke n'ahịrị Abụ Ọma a Pita hotara
  choice: mgbe mụ na gị nọ
  alternative: n'ihu gị / ya na ihu gị
  rationale: Nhọrọ a na-egosi ọṅụ nke sitere n'ịnọnyere Chineke n'ụzọ doro anya ma dị eke n'Igbo. Ọ naghị etinye nkọwa ozizi ọzọ n'okwu ahụ; ihe odide ala na-edobe ntụgharị nkịtị na ihe oyiyi nke “ihu.”
translation_notes:
  register: Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E ji “I” buru ibu gosi onye a na-agwa okwu, bụ Chineke. E debere ahịrị ahụ n'ụdị okwu uri, ma zere okwu ụka pụrụ iche.
