  text: καὶ τὰ κτήματα καὶ τὰς ὑπάρξεις ἐπίπρασκον καὶ διεμέριζον αὐτὰ πᾶσιν καθότι ἄν τις χρείαν εἶχεν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/045.yaml
  text: And they were selling their property and possessions and distributing them to all[a], as anyone had need.
translation:
  language: ig
  text: Ha na-erekwa ihe onwunwe ha na ngwongwo ha, na-ekesakwa ihe ndị ahụ n'etiti mmadụ niile[a], dịka mkpa onye ọ bụla si dị.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ, “ala na ihe mmadụ nwere.” Okwu Grik abụọ a nwere ike ịdị iche n’ụdị ihe mmadụ nwere: nke mbụ na-ezokarị aka n’ihe onwunwe ma ọ bụ ala mmadụ nwere, ebe nke abụọ na-ezo aka n’ihe mmadụ nwere n’ozuzu ya.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κτήματα
  choice: ala
  rationale: N'ọnọdụ a, okwu Grik a na-egosikarị ihe onwunwe dị ka ala ma ọ bụ ebe mmadụ nwere; “ala” na-eme ka ọ dị iche na ὑπάρξεις.
- source_word: ὑπάρξεις
  choice: ihe onwunwe
  rationale: Okwu a na-ezo aka n'ihe mmadụ nwere n'ozuzu ya, karịchaa ngwongwo; “ihe onwunwe” bụ okwu Igbo doro anya ma sara mbara.
- source_word: ἐπίπρασκον
  choice: nọkwa na-ere
  rationale: Ụdị imperfect na-egosi omume na-aga n'ihu ma ọ bụ a na-eme ugboro ugboro, ọ bụghị naanị otu ire ere e mechara otu mgbe.
- source_word: διεμέριζον
  choice: na-ekesara
  rationale: Ọ na-egosi ikesa ihe n'etiti ndị otu ahụ n'ụzọ kwekọrọ ná mkpa ha, n'ebughị ụzọ kọwaa usoro nkesa karịa ihe ederede kwuru.
- source_word: αὐτά
  choice: ya
  rationale: Nnọchiaha ahụ na-alaghachi n'ala na ihe onwunwe ahụ, ma ọ bụ n'ihe e nwetara site n'ire ha; “ya” na-echekwa nkenke na nghọta sara mbara nke Grik.
- source_word: πᾶσιν
  choice: mmadụ niile
  rationale: Ọ na-egosi ndị niile bụ ndị a na-ekesara ihe n'ime ọnọdụ obodo ndị kwere ekwe.
- source_word: καθότι ἄν τις χρείαν εἶχεν
  choice: dị ka mkpa onye ọ bụla si dị
  rationale: Nke a na-egosi na a na-ekesa ihe n'ogo kwekọrọ ná mkpa onye nke ọ bụla, ma na-ada nke ọma n'Igbo ugbu a.
theological_decisions:
- issue: Ụdị nkekọrịta ihe onwunwe nke ndị kwere ekwe
  choice: 'Amaokwu ahụ na-akọ omume ha na-eme ugboro ugboro: ha na-ere ala na ihe onwunwe ma na-ekesa ya dị ka mkpa onye ọ bụla si dị.'
  alternative: Ịghọta ya dịka iwu na ndị Kraịst niile ga-akwụsịrịrị inwe ihe nke onwe ha ma mee ka ihe niile bụrụ nke obodo.
  rationale: Ngwaa imperfect na-egosi omume na-aga n'ihu ma ọ bụ ugboro ugboro. Ederede ahụ akọwaghị na ihe onwunwe nke onwe kwụsịrị kpamkpam, ma ọ bụ na e nyere nke a dịka iwu zuru ụwa ọnụ; ya mere nsụgharị ahụ na-akọ naanị ihe ederede kwuru.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị nsọ ma dị mfe nghọta. “Nọkwa na-ere” na “na-ekesara” na-echekwa echiche nke omume na-aga n'ihu ma ọ bụ nke a na-eme ugboro ugboro. E tinyere akara nkọwa ala peeji [a] ozugbo n'isi ederede.
