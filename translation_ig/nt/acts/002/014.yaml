id: ACT.2.14
reference: Acts 2:14
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Σταθεὶς δὲ ⸀ὁ Πέτρος σὺν τοῖς ἕνδεκα ἐπῆρεν τὴν φωνὴν αὐτοῦ καὶ ἀπεφθέγξατο αὐτοῖς· Ἄνδρες Ἰουδαῖοι καὶ οἱ κατοικοῦντες Ἰερουσαλὴμ ⸀πάντες, τοῦτο ὑμῖν γνωστὸν ἔστω καὶ ἐνωτίσασθε τὰ ῥήματά μου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/014.yaml
  text: 'But Peter[a], standing with the eleven, raised his voice and declared to them: “Men of Judea and all who dwell in Jerusalem, let this be known to you[b], and give ear to my words.”'
translation:
  language: ig
  text: 'Ma Pita guzoro, ya na ndị iri na otu ahụ, weliri olu ya elu gwa ha okwu, sị: “Unu ndị ikom Judia[a], na unu niile bi na Jerusalem, ka unu mara nke a, geenụ ntị n’okwu m.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Unu ndị ikom ndị Juu.”
    reason: Ἰουδαῖοι nwere ike ịpụta ndị si Judia ma ọ bụ ndị Juu dị ka otu agbụrụ na okpukpe.
  - marker: b
    text: N’ụzọ nkịtị, “tinye okwu m n’ntị unu.”
    reason: ἐνωτίσασθε bụ iwu ka ndị na-ege ntị gee okwu Pita ntị nke ọma.
lexical_decisions:
- source_word: Σταθεὶς
  choice: guzoro ọtọ
  rationale: Ọ na-egosi na Pita biliri ma guzo were malite ikwu okwu n’ihu ọha; nsụgharị a bụ Igbo doro anya nke na-adịghị agbakwụnye nkọwa ọzọ.
- source_word: δὲ
  choice: Ma
  rationale: Ọ na-egosi ntụgharị na mmegide n’etiti ebubo ndị na-akwa emo n’amaokwu gara aga na nzaghachi Pita.
- source_word: σὺν τοῖς ἕνδεκα
  choice: ya na mmadụ iri na otu ahụ
  rationale: Ọ na-egosi na ndịozi iri na otu ahụ so Pita guzo.
- source_word: ἐπῆρεν τὴν φωνὴν αὐτοῦ
  choice: welie olu ya elu
  rationale: Nke a na-egosipụta akpaalaokwu Grik nke pụtara ikwu okwu n’olu dara ụda ka ọha mmadụ nụ.
- source_word: ἀπεφθέγξατο
  choice: kwupụtaara ha
  rationale: Okwu a na-egosi ikwu okwu n’ihu ọha n’ụzọ siri ike ma dị mkpa, ma ọ naghị etinye ozizi banyere mmụọ nsọ nke ngwaa ahụ naanị ya ekwughị kpọmkwem.
- source_word: Ἄνδρες Ἰουδαῖοι
  choice: Unu ndị ikom Judia
  rationale: Ọ na-edobe ụdị ịkpọ ndị nwoke okwu nke ἄνδρες nakwa nghọta mpaghara nke Ἰουδαῖοι; e tinyere nghọta ọzọ, ‘ndị Juu,’ n’ala peeji.
- source_word: οἱ κατοικοῦντες Ἰερουσαλὴμ πάντες
  choice: unu niile bi na Jerusalem
  rationale: Ọ bụ Igbo dị ndụ ma doo anya maka ndị niile bi n’obodo ahụ.
- source_word: τοῦτο ὑμῖν γνωστὸν ἔστω
  choice: ka unu mara nke a
  rationale: Ọ na-edobe ike nke iwu na nkwupụta ahụ n’ụzọ Igbo na-aga were were.
- source_word: ἐνωτίσασθε τὰ ῥήματά μου
  choice: geenụkwa okwu m ntị nke ọma
  rationale: Ọ na-egosi ọ bụghị naanị ịnụ ihe, kama ige okwu ahụ ntị nke ọma.
theological_decisions:
- issue: Ma Ἰουδαῖοι ọ pụtara ndị Judia ka ọ bụ ndị Juu
  choice: ndị ikom Judia
  alternative: ndị ikom ndị Juu
  rationale: N’ọnọdụ Jerusalem a, nghọta mpaghara dabara adaba, ma okwu Grik ahụ nwekwara ike ịkọwa njirimara ndị Juu. E debeghị nghọta nke ọzọ n’ụzọ zoro ezo; e gosiri ya n’ala peeji.
- issue: Ma a ga-eme ka ἀπεφθέγξατο kwuo kpọmkwem na okwu ahụ sitere n’ike Mmụọ Nsọ
  choice: kwupụtaara ha
  alternative: gwa ha okwu sitere n’ike Mmụọ Nsọ
  rationale: Ọ bụ ezie na ngwaa ahụ nwere ike ịpụta okwu dị arọ ma ọ bụ nke sitere n’ike mmụọ n’ọnọdụ ụfọdụ, amaokwu a anaghị etinye nkọwa ahụ kpọmkwem n’ime ngwaa ahụ; ya mere, a zere ịgbakwụnye ozizi n’ahịrịokwu bụ isi.
- issue: Idobe oke nwoke dị na ἄνδρες
  choice: ndị ikom
  alternative: ndị mmadụ
  rationale: Ἄνδρες kpọrọ ndị nwoke aha kpọmkwem, ya mere ‘ndị ikom’ na-edobe nkọwa ahụ kama ime ka ọ bụrụ okwu na-anọpụ iche n’ihe gbasara nwoke na nwanyị.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ugwu ma dị mfe nghọta, dee ya. ‘Welie olu ya elu’ na ‘geenụ okwu m ntị nke ọma’ bụ akpaalaokwu ndị na-adị ndụ n’Igbo ma na-edobe ọdịdị okwu ihu ọha nke amaokwu ahụ.
