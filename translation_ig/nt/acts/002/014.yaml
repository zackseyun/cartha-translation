review_pass:
  verdict: revise
  source_fidelity: 'A na-edobe usoro na isi okwu nke Grik nke ọma n’ozuzu ya: Pita guzoro ya na ndị iri na otu, welie olu ya, gwa ọha mmadụ okwu, wee kpọọ ndị ikom Judia na ndị bi na Jerusalem ka ha mara ihe ma gee ntị. Otú ọ dị, “welie” bụ ụdị iwu ugbu a, ebe ἐπῆρεν bụ omume gara aga n’akụkọ; ya mere a ghaghị iji “weliri.” “Kwupụtaara ha” anaghị ada nke ọma n’ọrụ ngwaa Igbo a na n’usoro ahịrịokwu a.'
  naturalness: 'Nsụgharị a chọrọ ntakịrị mmezi ka Standard Igbo bụrụ nke sitere n’okwu eke: “Pita guzoro, ya na ndị iri na otu ahụ” na “weliri olu ya elu” na-aga nke ọma karịa nhazi mbụ. “Ndị ikom Judia, na unu niile bi na Jerusalem” na-eme ka akụkụ abụọ nke kpọmkwem ndị a kpọrọ oku pụta ìhè.'
  terminology: “Ndị ikom Judia” na-edobe nwoke kpọmkwem dị na ἄνδρες ma na-ahapụ nghọta mpaghara nke Ἰουδαῖοι; ala peeji na-echekwa nghọta ọzọ, “ndị Juu,” n’enweghị ikpebi okwu ahụ karịa ihe ederede kwere. “Gee ntị n’okwu m” bụ ụzọ Igbo dị ndụ maka ἐνωτίσασθε τὰ ῥήματά μου, na-enweghị itinye nkọwa karịrị akarị.
