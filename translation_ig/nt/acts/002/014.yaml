  rationale: E mezie oge ngwaa akụkọ (“weliri”), gbanwee okwu na-adịghị ada nke ọma (“kwupụtaara ha”) ka ọ bụrụ “gwa ha okwu,” ma dozie okwu “gee ntị” na nkọwa ala peeji ya. Mmezi ndị a na-edobe ihe Grik kwuru, ndegharị okwu ihu ọha, nwoke dị na ἄνδρες, na amaghị ama dị na Ἰουδαῖοι.
