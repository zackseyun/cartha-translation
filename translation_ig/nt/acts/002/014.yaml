    issue: “welie olu ya elu”
    rationale: “Welie” bụ ụdị iwu (imperative) n’Igbo, ma Grik ἐπῆρεν bụ aorist indicative nke na-akọ ihe Pita mere. “Weliri olu ya elu” na-enye oge akụkọ ziri ezi.
  - severity: medium
    issue: “kwupụtaara ha”
    rationale: Ụdị a adịghị eke nke ọma ebe a maka ἀπεφθέγξατο. “Gwa ha okwu” bụ okwu Igbo kwụ ọtọ maka ịgwa ọha mmadụ okwu, ma ọ naghị agbakwunye echiche mmụọ ma ọ bụ ozizi.
  - severity: low
    issue: Nkọwa ala peeji b kwuru “tinyekwanụ okwu m na ntị.”
    rationale: Nke a abụghị ụzọ Igbo eke, ọ na-enwekwa “ntị” n’enweghị onye nwe ya. A ga-ekwu “tinye okwu m n’ntị unu” ma ọ bụrụ na a chọrọ nkọwa nkịtị.
