review_pass:
  verdict: revise
  source_fidelity: The draft accurately identifies all the believers and their being together. However, “ha nwekwara ihe niile n’otu” is not a clear or idiomatic way to convey ἅπαντα κοινά and can be read merely as having everything ‘as one,’ rather than holding possessions in common/shared.
  naturalness: “Ndị niile kwere ekwe nọkọtara ọnụ” is natural Standard Igbo. Revising the final clause to “ha nwekọrịtakwara ihe niile” gives a clear, modern and natural expression of shared possession.
  terminology: “Ndị kwere ekwe” is appropriate for οἱ πιστεύοντες. “Nwekọrịta” preserves the descriptive communal-sharing sense without presenting the statement as a command or prescribing an economic system.
  issues:
  - severity: medium
    issue: The phrase “ihe niile n’otu” insufficiently and unnaturally renders ἅπαντα κοινά.
    rationale: The Greek says that all things were common/shared among them. The proposed wording does not explicitly express mutual/shared possession and is open to misunderstanding.
  revised_text: Ndị niile kwere ekwe nọkọtara ọnụ[a], ha nwekọrịtakwara ihe niile.
