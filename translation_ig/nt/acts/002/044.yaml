  text: πάντες δὲ οἱ ⸀πιστεύοντες ⸂ἦσαν ἐπὶ τὸ αὐτὸ καὶ⸃ εἶχον ἅπαντα κοινά,
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/044.yaml
  text: And all the believers were together and had all things in common,[a]
translation:
  language: ig
  text: Ndị niile kwere ekwe nọkọtara ọnụ[a], ha nwekọrịtakwara ihe niile.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “nọ n’otu ebe.” Akpaalaokwu Grik a nwere ike ịpụta na ha nọkọrọ ọnụ ma ọ bụ zukọrọ n’otu ebe.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντες
  choice: ndị niile
  rationale: Nke a na-echekwa echiche nke ‘niile’ ka ọ na-akọwa ndị kwere ekwe dum.
- source_word: δὲ
  choice: (ejikọtara ya n’usoro akụkọ n’enweghị mkpụrụokwu pụrụ iche)
  rationale: δὲ ebe a bụ njikọ dị nro na-aga n’ihu n’akụkọ; usoro ahịrịokwu Igbo na-egosi njikọ ahụ nke ọma n’enweghị ịgbakwunye echiche mmegide.
- source_word: οἱ πιστεύοντες
  choice: ndị kwere ekwe
  rationale: Nke a bụ okwu Igbo a na-eji kpọọ ìgwè ndị nwere okwukwe, ma na-egosipụta participle ahụ e ji mee aha otu.
- source_word: ἦσαν ἐπὶ τὸ αὐτό
  choice: nọkọtara ọnụ
  rationale: Akpaalaokwu a nwere ike ịpụta ịnọkọ ọnụ ma ọ bụ ịgbakọta n’otu ebe; ‘nọkọtara ọnụ’ bụ Igbo eke nke na-edobe echiche obodo ahụ n’enweghị ịkọwapụta ebe karịa ihe Grik kwuru.
- source_word: εἶχον
  choice: ha nwekwara
  rationale: Oge gara aga dị mfe dabara n’akụkọ Igbo, ebe ihe gbara ya gburugburu na-egosi ọnọdụ na-aga n’ihu.
- source_word: ἅπαντα κοινά
  choice: ihe niile n’otu
  rationale: Nke a na-egosi na ihe ha nwere bụ nke ha na-ejikọ ọnụ, ma zere ịgbakwunye usoro akụ na ụba a na-enye iwu nke ederede ahụ ekwughị.
theological_decisions:
- issue: Ụdị ndụ nkekọrịta nke obodo ndị kwere ekwe
  choice: A sụgharịrị amaokwu ahụ dị ka nkọwa banyere ndị kwere ekwe nwere ihe ha n’otu.
  alternative: Ịghọta ya dị ka iwu nke na-enye ọgbakọ Ndị Kraịst niile otu usoro akụ na ụba.
  rationale: Grik na-akọ ihe ndị kwere ekwe ahụ na-eme; ọ naghị enye iwu doro anya ma ọ bụ ụkpụrụ zuru ụwa ọnụ. Ya mere, nsụgharị ahụ na-anọgide na nkọwa, na-etinyeghị ozizi ndọrọ ndọrọ ọchịchị ma ọ bụ nke ụka n’ime ya.
translation_notes:
  register: Standard Igbo dị ugbu a, dị mfe nghọta ma nwee ugwu. E ji ‘nọkọtara ọnụ’ chekwaa nghọta mmekọrịta na nke ịgbakọta, ebe nkọwa ala ala peeji na-edobe nhọrọ nke ‘ịnọ n’otu ebe.’
