id: ACT.2.17
reference: Acts 2:17
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Καὶ ἔσται ἐν ταῖς ἐσχάταις ἡμέραις, λέγει ὁ θεός, ἐκχεῶ ἀπὸ τοῦ πνεύματός μου ἐπὶ πᾶσαν σάρκα, καὶ προφητεύσουσιν οἱ υἱοὶ ὑμῶν καὶ αἱ θυγατέρες ὑμῶν, καὶ οἱ νεανίσκοι ὑμῶν ὁράσεις ὄψονται, καὶ οἱ πρεσβύτεροι ὑμῶν ⸀ἐνυπνίοις ἐνυπνιασθήσονται·
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/017.yaml
  text: And it will be in the last days[a], says God, that I will pour out from my Spirit on all flesh, and your sons and your daughters will prophesy, and your young men will see visions[b], and your old men will dream dreams.
translation:
  language: ig
  text: “Ọ ga-abụkwa n’ụbọchị ikpeazụ,” ka Chineke na-ekwu, “na m ga-awụpụ site na Mmụọ m[a] n’elu mmadụ niile[b]. Ụmụ unu ndị nwoke na ụmụ unu ndị nwanyị ga-ebu amụma; ụmụ okorobịa unu ga-ahụ ọhụụ, ndị ikom unu ndị mere agadi ga-arọ nrọ.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Grik kwuru n’ụzọ nkịtị, “site na Mmụọ m,” ọ bụghị naanị “Mmụọ m.”
    reason: lexical_alternative
  - marker: b
    text: Grik kwuru n’ụzọ nkịtị, “n’elu anụ ahụ niile”; nke a bụ akpaala okwu amụma nke pụtara mmadụ niile.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ταῖς ἐσχάταις ἡμέραις
  choice: n’ụbọchị ikpeazụ
  rationale: Ọ bụ ụzọ Igbo kwụ ọtọ ma bụrụ nke a na-aghọta nke ọma iji gosipụta oge ikpeazụ ahụ, n’etinyeghị nkọwa ọzọ banyere ogologo oge ya.
- source_word: λέγει ὁ θεός
  choice: ka Chineke na-ekwu
  rationale: Ọ na-edobe usoro okwu amụma nke dị n’oge ugbu a, dịka Grik si kwuo ya.
- source_word: ἐκχεῶ
  choice: m ga-awụpụ
  rationale: Ọ na-echekwa ihe atụ doro anya nke ịwụpụ ihe, ma bụrụkwa okwu Igbo dị mfe ma dị ebube.
- source_word: ἀπὸ τοῦ πνεύματός μου
  choice: site na Mmụọ m
  rationale: “Site na” na-egosipụta ἀπό, ebe “Mmụọ” e dere n’isi mkpụrụedemede na-egosi na ihe a na-ekwu bụ Mmụọ Chineke.
- source_word: ἐπὶ πᾶσαν σάρκα
  choice: n’ahụ mmadụ niile
  rationale: N’Igbo, nke a na-ebute echiche okwu amụma ahụ nke metụtara mmadụ niile, ma okwu “n’ahụ” ka na-echekwa ihe oyiyi nke okwu Grik; nkọwa ala peeji na-enye nsụgharị nkịtị ya.
- source_word: προφητεύσουσιν
  choice: ga-ebu amụma
  rationale: Nke a bụ okwu Igbo a na-ahụkarị maka ikwu okwu amụma, na-emeghị ka ihe okwu ahụ pụtara belata.
- source_word: οἱ υἱοὶ ὑμῶν καὶ αἱ θυγατέρες ὑμῶν
  choice: ụmụ unu ndị nwoke na ụmụ unu ndị nwanyị
  rationale: Ọ na-edobe ma ụdị nwoke ma ụdị nwanyị, tinyere nkwughachi nke “ụmụ unu” dị na Grik.
- source_word: οἱ νεανίσκοι ὑμῶν
  choice: ụmụ okorobịa unu
  rationale: Ọ na-egosi kpọmkwem ụmụ nwoke na-eto eto, dịka aha nwoke dị na Grik si dị.
- source_word: ὁράσεις ὄψονται
  choice: ga-ahụ ọhụụ
  rationale: Nke a bụ ụzọ Igbo ebumpụta ụwa si ekwu ihe ahụ ma na-echekwa ma “ịhụ” ma “ọhụụ.”
- source_word: οἱ πρεσβύτεροι ὑμῶν
  choice: ndị ikom unu mere agadi
  rationale: N’ebe a, okwu ahụ na-emegide ụmụ okorobịa n’ihe banyere afọ ndụ; ntụgharị a na-ezere ime ka a ghọta ya dịka ọkwá ndị okenye n’ọgbakọ.
- source_word: ἐνυπνίοις ἐνυπνιασθήσονται
  choice: ga-arọkwa nrọ
  rationale: Nke a bụ usoro okwu Igbo ebumpụta ụwa nke na-echekwa nkwughachi echiche dị n’okwu Grik banyere nrọ.
theological_decisions:
- issue: Ogologo mpụtara nke ἐπὶ πᾶσαν σάρκα (“n’ahụ anụ ahụ niile”)
  choice: n’ahụ mmadụ niile
  alternative: n’ahụ anụ ahụ niile
  rationale: Nke a na-eme ka akpaala okwu amụma ahụ doo onye Igbo anya dịka ihe metụtara mmadụ n’ozuzu ha, ebe nkọwa ala peeji na-echekwa ọdịdị okwu nkịtị na njikọ ya na amụma Jọel.
- issue: Ihe πνεῦμα na-ezo aka na ya n’ịwụpụ Chineke
  choice: Mmụọ m
  alternative: mmụọ m
  rationale: N’ọnọdụ a, onye na-ekwu okwu bụ Chineke, ya mere “Mmụọ m” na-ezo aka na Mmụọ Chineke; ide ya n’isi mkpụrụedemede na-eme ka nke a doo anya n’etinyeghị ozizi ọzọ.
- issue: Mmekọrịta dị n’etiti ἀπό na Mmụọ Chineke
  choice: site na Mmụọ m
  alternative: Mmụọ m
  rationale: A họọrọ “site na” iji chekwaa preposition Grik ἀπό na-enweghị ikwu na a kewara Mmụọ Chineke ụzọ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta, dee ya. E chekwara usoro yiri ibe ya nke ụmụ nwoke/ụmụ nwanyị na ụmụ okorobịa/ndị ikom mere agadi. E tinyere akara nkọwa ala peeji n’ebe okwu ndị ha na-akọwa dị kpọmkwem, kama iso ọnọdụ akara ndị na-adabaghị na English consultation layer.
