review_pass:
  verdict: revise
  source_fidelity: A safe revision is needed for ἐπὶ πᾶσαν σάρκα. The draft’s “n’ahụ mmadụ niile” is awkward and can suggest location within/on each person’s body rather than the recipients of the outpouring. “n’elu mmadụ niile” naturally expresses ἐπί with the outpouring verb, while the footnote preserves the literal prophetic idiom “anụ ahụ niile.” The remaining clauses accurately represent the Greek sequence, future force, gendered categories, and age contrast.
  naturalness: The revised wording uses idiomatic Standard Igbo. “n’elu mmadụ niile” is clearer than “n’ahụ mmadụ niile,” and “ndị ikom unu ndị mere agadi” is smoother than “ndị ikom unu mere agadi.”
  terminology: “Mmụọ m” appropriately represents God’s Spirit in this context. “ga-ebu amụma,” “ọhụụ,” and “ga-arọ nrọ” are suitable, natural renderings. The literal ‘all flesh’ is retained in a footnote rather than forced into an unnatural main-text expression.
  issues:
  - severity: medium
    issue: The main-text rendering of ἐπὶ πᾶσαν σάρκα is potentially misleading and unnatural.
    rationale: “n’ahụ mmadụ niile” may be read bodily or locatively. With “awụpụ,” Igbo more naturally uses “n’elu mmadụ niile” for the people upon whom something is poured out. A note can preserve the Greek’s literal ‘all flesh.’
  - severity: low
    issue: The expression for the old men is somewhat stiff.
    rationale: Adding the relative qualifier in “ndị ikom unu ndị mere agadi” improves Standard Igbo flow while maintaining the explicitly male, age-based contrast with “ụmụ okorobịa.”
  revised_text: “Ọ ga-abụkwa n’ụbọchị ikpeazụ,” ka Chineke na-ekwu, “na m ga-awụpụ site na Mmụọ m[a] n’elu mmadụ niile[b]. Ụmụ unu ndị nwoke na ụmụ unu ndị nwanyị ga-ebu amụma; ụmụ okorobịa unu ga-ahụ ọhụụ, ndị ikom unu ndị mere agadi ga-arọ nrọ.”
  revised_footnotes:
  - marker: a
    text: Grik kwuru n’ụzọ nkịtị, “site na Mmụọ m,” ọ bụghị naanị “Mmụọ m.”
    reason: lexical_alternative
  - marker: b
    text: Grik kwuru n’ụzọ nkịtị, “n’elu anụ ahụ niile”; nke a bụ akpaala okwu amụma nke pụtara mmadụ niile.
    reason: lexical_alternative
  revision_rationale: The revision corrects the recipient/location phrase governing the divine outpouring and aligns the literal footnote with that revised preposition. It also makes the final age-category phrase more idiomatic without altering its meaning. No doctrinal interpretation has been added.
