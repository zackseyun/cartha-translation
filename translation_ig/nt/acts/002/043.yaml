  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸀Ἐγίνετο δὲ πάσῃ ψυχῇ φόβος, πολλά ⸀τε τέρατα καὶ σημεῖα διὰ τῶν ἀποστόλων ἐγίνετο.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/043.yaml
  text: And fear came upon every soul[a], and many wonders and signs were being done through the apostles.
translation:
  language: ig
  text: Ụjọ wee dakwasị onye ọ bụla[a], a na-emekwa ọtụtụ ihe ịtụnanya na ihe ịrịba ama site n'aka ndịozi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Ịtụ egwu jupụtara n’ịtụnanya wee dakwasị mmadụ niile.” N’asụsụ Grik, ọ bụ n’ụzọ nkịtị, “Ụjọ wee dakwasị mkpụrụ obi ọ bụla.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγίνετο ... φόβος
  choice: Ụjọ wee dakwasị
  rationale: Nkebi a na-egosi na ụjọ malitere ma jide ndị mmadụ. “Wee dakwasị” na-asụ Igbo nke ọma ma na-echekwa echiche nke ihe bịara n’ahụ ha.
- source_word: δὲ
  choice: wee
  rationale: N’ebe a, δέ na-aga n’ihu n’akụkọ ahụ, ọ bụghị igosi nnukwu mmegide. “Wee” na-eme ka akụkọ ahụ na-aga were were n’Igbo.
- source_word: πάσῃ ψυχῇ
  choice: onye ọ bụla
  rationale: Ọ bụ ezie na okwu Grik ahụ pụtara n’ụzọ nkịtị “mkpụrụ obi ọ bụla,” “onye ọ bụla” bụ ụzọ doro anya na nke e ji asụ Igbo ugbu a ekwu mmadụ niile; ihe odide ala peeji na-echekwa ọdịdị okwu Grik ahụ.
- source_word: φόβος
  choice: ụjọ
  rationale: “Ụjọ” bụ ntụgharị kpọmkwem nke na-ahapụ ohere ka okwu ahụ gụnye ma egwu ma oke ịtụnanya n’ihu ọrụ Chineke, n’ebughị ụzọ kpebie naanị otu nghọta.
- source_word: πολλά
  choice: ọtụtụ
  rationale: “Ọtụtụ” bụ okwu Igbo nkịtị na nke ziri ezi maka ọnụ ọgụgụ buru ibu.
- source_word: τέρατα
  choice: ihe ịtụnanya
  rationale: Okwu a na-elekwasị anya n’otú ọrụ ndị ahụ si eju ndị mmadụ anya; “ihe ịtụnanya” na-echekwa ọdịiche ya na “ihe ịrịba ama.”
- source_word: σημεῖα
  choice: ihe ịrịba ama
  rationale: “Ihe ịrịba ama” na-egosi na ọrụ ndị ahụ nwere ihe ha na-egosi ma ọ bụ na-agba akaebe banyere ya.
- source_word: διὰ τῶν ἀποστόλων
  choice: site n'aka ndịozi
  rationale: “Site n'aka” na-egosi na ndịozi bụ ndị e ji rụọ ọrụ ndị a, n’emeghị ka ha bụrụ isi mmalite ikpeazụ nke ike ahụ.
- source_word: ἐγίνετο
  choice: a na-eme
  rationale: Ụdị a na-egosi na ọrụ ndị ahụ nọ na-aga n’ihu, ma ọ naghị akpọpụta onye bụ isi na-eme ha karịa ka okwu Grik si mee.
theological_decisions:
- issue: Ihe φόβος pụtara mgbe ndị mmadụ hụrụ ọrụ ndị e si n'aka ndịozi mee
  choice: ụjọ
  alternative: oke nsọpụrụ na ịtụ egwu
  rationale: “Ụjọ” na-echekwa ike na esemokwu dị n’okwu Grik ahụ, ka onye na-agụ ya nwee ike ịnụ ma egwu ma ịtụnanya jupụtara na nsọpụrụ n’ebughị ka ntụgharị ahụ họrọ naanị otu n’ime ha.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe ma dị ùgwù, dee ya. “Ndịozi,” “ihe ịtụnanya,” na “ihe ịrịba ama” na-enye okwu ndị bụ isi ọdịiche doro anya, ebe “site n'aka” na-egosi ọrụ ndịozi dị ka ụzọ e si mee ihe ndị ahụ.
