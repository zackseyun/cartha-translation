- from: Ụjọ wee dakwasị onye ọ bụla[a], a na-esikwa n'aka ndịozi na-eme ọtụtụ ihe ịtụnanya na ihe ịrịba ama.
  to: Ụjọ wee dakwasị onye ọ bụla[a], a na-emekwa ọtụtụ ihe ịtụnanya na ihe ịrịba ama site n'aka ndịozi.
  rationale: The revision corrects the second clause so that the ongoing occurrence of the wonders and signs and their performance through the apostles are expressed in idiomatic Standard Igbo. It retains the draft’s appropriate rendering of φόβος and retains the footnote’s literal Greek expression while giving a non-doctrinal lexical alternative for its awe-related nuance.
