  text: καὶ πῶς ἡμεῖς ἀκούομεν ἕκαστος τῇ ἰδίᾳ διαλέκτῳ ἡμῶν ἐν ᾗ ἐγεννήθημεν;
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/008.yaml
  text: And how is it that each of us hears in our own native language?[a]
translation:
  language: ig
  text: Oleezi otú onye ọ bụla n’ime anyị si anụ n’asụsụ nke ya, bụ́ asụsụ a mụrụ ya na ya?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’olumba nke ya, bụ́ olumba a mụrụ ya na ya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πῶς
  choice: Oleezi otú
  rationale: Ajụjụ a na-egosi ihe ijuanya; “Oleezi otú” na-egosipụta nke a n’Igbo dị ugbu a.
- source_word: ἡμεῖς ... ἕκαστος
  choice: onye ọ bụla n’ime anyị
  rationale: Nke a na-echekwa echiche nkesa dị na ἕκαστος ma na-etinyekwa nkwusi okwu nke ἡμεῖς n’ụzọ Igbo si ekwu ya nke ọma.
- source_word: ἀκούομεν
  choice: si anụ okwu ha
  rationale: “Anụ” na-edebe isi echiche nke ịnụ ihe. Etinyere “okwu ha” dịka ihe a na-aghọta site n’ọnọdụ okwu ahụ, ka ahịrịokwu ahụ bụrụ nke doro anya ma dịkwa eke n’Igbo.
- source_word: τῇ ἰδίᾳ διαλέκτῳ ἡμῶν
  choice: n’asụsụ nke ya
  rationale: διάλεκτος nwere ike ịbụ asụsụ ma ọ bụ olumba. “Asụsụ” bụ okwu sara mbara, nke ndị na-agụ akwụkwọ taa ga-aghọta ngwa ngwa; “nke ya” na-egosipụta ἰδίᾳ.
- source_word: ἐν ᾗ ἐγεννήθημεν
  choice: bụ́ asụsụ a mụrụ ya na ya
  rationale: Nke a na-edebe nkebi ahịrịokwu Grik nke na-akọwa asụsụ ahụ dịka nke metụtara ọmụmụ na nzụlite onye ahụ, kama ime ka ọ bụrụ naanị okwu “asụsụ nne.”
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo dị mfe, dị ugwu, ma kwekọọ n’ụzọ ndị mmadụ si ekwu okwu taa. E debere ajụjụ ijuanya ahụ na ọdịiche dị n’etiti ‘asụsụ’ na ‘olumba’ site n’ihe e dere n’ala ala peeji.
