    issue: The phrase “okwu ha” has been added after “anụ.”
    rationale: ἀκούομεν has no stated object in Acts 2:8. The object is inferable from the prior context, but an optimal-equivalence rendering should retain the verse’s ellipsis rather than add “their speech.”
