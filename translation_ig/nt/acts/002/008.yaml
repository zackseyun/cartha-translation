  verdict: revise
  source_fidelity: The draft accurately conveys the astonished question, the distributive sense of ἕκαστος with ἡμεῖς, and διάλεκτος as “asụsụ.” However, “okwu ha” (“their words/speech”) is not expressed in this verse. Though its object is supplied by the surrounding context, adding it makes the translation more explicit than the Greek wording.
  naturalness: “Oleezi otú onye ọ bụla n’ime anyị si anụ ...” is natural Standard Igbo and preserves the rhetorical force. The birth-associated relative clause is also understandable in this distributive construction.
  terminology: “Asụsụ” is an appropriate primary rendering for διάλεκτος here. The footnote rightly preserves “olumba” as a lexical alternative. “Nke ya” appropriately represents the individual/distributive force of “our own” in this context.
