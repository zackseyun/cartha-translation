  text: διὰ τοῦτο ηὐφράνθη ⸂ἡ καρδία μου⸃ καὶ ἠγαλλιάσατο ἡ γλῶσσά μου, ἔτι δὲ καὶ ἡ σάρξ μου κατασκηνώσει ἐπ’ ἐλπίδι·
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/026.yaml
  text: Because of this my heart was glad[a], and my tongue rejoiced; moreover, even my flesh will dwell in hope.
translation:
  language: ig
  text: N’ihi nke a, obi m ṅụriri ọṅụ, ire m ṅụrịakwa ọṅụ; ọzọkwa, ọbụna anụ ahụ m ga-ebi n’olileanya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ahụ m ga-ezu ike n’olileanya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: N’ihi nke a
  rationale: Nke a na-egosipụta ihe kpatara ihe e kwuru, ọ bụghị naanị nkwubi okwu.
- source_word: ηὐφράνθη ἡ καρδία μου
  choice: obi m ṅụrịrị ọṅụ
  rationale: Ọ na-echekwa akpaalaokwu Akwụkwọ Nsọ nke na-eji ‘obi’ akọwa onye dị n’ime, ma kwupụta ọṅụ ahụ n’Igbo doro anya.
- source_word: ἠγαλλιάσατο ἡ γλῶσσά μου
  choice: ire m wee ṅụrịa ọṅụ
  rationale: A hapụrụ ‘ire’ dịka ihe Grik kwuru, kama ịgbanwe ya ka ọ bụrụ ‘ọnụ’; okwu ahụ na-egosi ọṅụ a na-ekwupụta n’olu.
- source_word: ἔτι δὲ καὶ
  choice: ọzọkwa, ọbụna
  rationale: Ngwakọta a na-aga n’ihu n’okwu ahụ ma mesie ihe na-esote ike.
- source_word: ἡ σάρξ μου
  choice: anụ ahụ m
  rationale: N’ebe a σάρξ na-ekwu maka ịdị adị mmadụ n’anụ ahụ, ọ bụghị ‘ọdịdị mmehie’; ‘anụ ahụ’ na-echekwa okwu ahụ n’ụzọ nkịtị.
- source_word: κατασκηνώσει
  choice: ga-anọ
  rationale: ‘Ga-anọ’ na-echekwa echiche nke ịnọ ma ọ bụ ibi n’ebe nwere nchebe, na-enweghị ịkọwa ya naanị dịka izu ike.
- source_word: ἐπ’ ἐλπίδι
  choice: n’olileanya
  rationale: Nke a bụ ụzọ Igbo sitere n’okike si egosipụta ọnọdụ ma ọ bụ ntọala nke olileanya.
theological_decisions:
- issue: Nkọwa σάρξ n’okwu metụtara mbilite n’ọnwụ
  choice: anụ ahụ m
  alternative: ahụ m
  rationale: E ji okwu ahụ mee ihe n’ụzọ nkịtị banyere mmadụ n’anụ ahụ. Nsụgharị a anaghị atụgharị ya ka ọ bụrụ ‘ọdịdị mmehie,’ ma ọ bụ tinye mbilite n’ọnwụ kpọmkwem n’okwu amaokwu ahụ.
- issue: Ihe κατασκηνώσει ἐπ’ ἐλπίδι pụtara
  choice: ga-anọ n’olileanya
  alternative: ga-ezu ike n’olileanya
  rationale: ‘Ga-anọ’ na-edobe onyinyo nke ibi ma ọ bụ ịnọ n’udo na nchebe, ma hapụ ka amaokwu ndị gbara ya gburugburu kọwaa ihe nke a metụtara.
translation_notes:
  register: E ji Igbo Izugbe dị ugbu a, dị ùgwù ma dị mfe nghọta. E chekwara usoro uri nke ahịrịokwu ahụ na nkwughachi okwu ọṅụ, tinyere ihe atụ nke ‘obi,’ ‘ire,’ na ‘anụ ahụ.’
