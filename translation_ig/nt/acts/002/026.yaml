  rationale: The revision retains the Greek’s causal relation, poetic body-part imagery, and emphasis, while using idiomatic completed verbal form for the aorist and a more precise Igbo equivalent for the future verb of dwelling. It does not resolve the verse’s resurrection implications beyond the wording of the source.
