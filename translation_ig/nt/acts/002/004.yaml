revisions:
- from: Ha niile jupụtara na Mmụọ Nsọ, ha wee malite ikwu okwu n’asụsụ ndị ọzọ[a], dị ka Mmụọ Nsọ si na-enye ha ike ikwupụta okwu.
  to: Ha niile jupụtara na Mmụọ Nsọ, ha wee malite ikwu okwu n’asụsụ ndị ọzọ[a], dịka Mmụọ ahụ na-eme ka ha nwee ike ikwu okwu.
  rationale: The revision retains the draft’s accurate wording for being filled, the collective scope, and other languages. It recasts the final clause so that the Spirit’s continuing enablement (ἐδίδου) and the act of speaking (ἀποφθέγγεσθαι) are conveyed naturally in Igbo without adding an independent concept of ‘power.’ The existing footnote anchor and lexical-alternative note remain valid.
