id: ACT.2.4
reference: Acts 2:4
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἐπλήσθησαν ⸀πάντες πνεύματος ἁγίου, καὶ ἤρξαντο λαλεῖν ἑτέραις γλώσσαις καθὼς τὸ πνεῦμα ἐδίδου ⸂ἀποφθέγγεσθαι αὐτοῖς⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/004.yaml
  text: And they were all filled with the Holy Spirit and began to speak in other tongues[a], as the Spirit was giving them utterance.
translation:
  language: ig
  text: Ha niile jupụtara na Mmụọ Nsọ, ha wee malite ikwu okwu n’asụsụ ndị ọzọ[a], dịka Mmụọ ahụ na-eme ka ha nwee ike ikwu okwu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ire ndị ọzọ.” Okwu Grik ahụ nwere ike ịpụta “ire” ma ọ bụ “asụsụ”; ihe ndị na-esochi n’akụkọ a na-egosi na ndị na-ege ntị ghọtara okwu ahụ dị ka asụsụ mmadụ n’ezie.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπλήσθησαν
  choice: jupụtara
  rationale: Okwu a na-egosi na Mmụọ Nsọ mere ka ha juputa n’ike na nduzi ya; “jupụtara” bụ ụzọ Igbo dị nkenke ma dịkwa mma isi kwuo ya.
- source_word: πάντες
  choice: niile
  rationale: Ọ na-egosi na ihe a metụtara ndị otu ahụ dum.
- source_word: πνεύματος ἁγίου
  choice: na Mmụọ Nsọ
  rationale: N’Ọrụ Ndị Ozi 2, okwu a na-ezo aka kpọmkwem n’ebe Mmụọ Nsọ nke Chineke nọ, onye nyere ha ike ikwu okwu.
- source_word: ἤρξαντο λαλεῖν
  choice: wee malite ikwu okwu
  rationale: “Malite” na-echekwa mmalite omume ahụ, ebe “wee” na-ejikọta ya n’ụzọ ebumpụta ụwa na akụkọ Igbo.
- source_word: ἑτέραις γλώσσαις
  choice: n’asụsụ ndị ọzọ
  rationale: γλῶσσα nwere ike ịpụta “ire” ma ọ bụ “asụsụ.” “Asụsụ ndị ọzọ” bụ okwu Igbo doro anya ma kwekọọ n’ihe ndị na-ege ntị ghọtara n’amaokwu ndị na-esochi; ihe odide ala na-echekwa ụzọ ọzọ e nwere isi ghọta okwu Grik ahụ.
- source_word: καθὼς
  choice: dị ka … si
  rationale: Usoro a bụ ụzọ Igbo ebumpụta ụwa isi gosipụta otú ma ọ bụ ókè Mmụọ Nsọ si mee ka okwu ahụ kwe omume.
- source_word: ἐδίδου
  choice: si na-enye ha ike
  rationale: “Na-enye” na-egosipụta omume na-aga n’ihu nke ngwaa imperfect ahụ; “ike” na-eme ka ebumnuche nke inye ha ikike ikwu pụta ìhè n’Igbo.
- source_word: ἀποφθέγγεσθαι
  choice: ikwupụta okwu
  rationale: Okwu Grik a pụtara ikwuputa ma ọ bụ ikwu okwu n’olu doro anya, karịsịa n’ihu ọha; “ikwupụta okwu” anaghị amachi ya naanị n’amụma.
theological_decisions:
- issue: Ma πνεύματος ἁγίου ọ̀ bụ Mmụọ Nsọ nke Chineke ka ọ bụ naanị mmụọ dị nsọ n’ozuzu.
  choice: Mmụọ Nsọ
  alternative: mmụọ dị nsọ
  rationale: Akụkọ Ọrụ Ndị Ozi 2 na-egosi na onye a bụ Mmụọ Nsọ ahụ e kwere ná nkwa, onye na-arụ ọrụ ma na-enye ha ike ikwu okwu.
- issue: Ma γλώσσαις kwesịrị ịbụ “ire” ka ọ bụ “asụsụ.”
  choice: asụsụ ndị ọzọ
  alternative: ire ndị ọzọ
  rationale: Okwu Grik ahụ nwere ụzọ abụọ a e si aghọta ya. “Asụsụ” bụ Igbo nkịtị ma doo anya, ebe ọnọdụ dị n’Ọrụ Ndị Ozi 2:6–11 gosiri na ndị na-ege ntị matara ihe a na-ekwu dị ka asụsụ ha. Ihe odide ala ka na-egosi nhọrọ “ire” ka a ghara izochi obosara ihe okwu Grik ahụ nwere ike ịpụta.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ugwu ma dị mfe nghọta, dee ya. Ahịrịokwu ahụ na-aga n’usoro akụkọ ebumpụta ụwa, ma okwu ndị e ji mee ya anaghị etinye nkọwa ụka ọ bụla na-adịghị n’ihe odide Grik.
