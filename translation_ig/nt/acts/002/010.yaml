lexical_decisions:
- source_word: Φρυγίαν τε καὶ Παμφυλίαν
  choice: Frijia na Pamfilia
  rationale: A sụgharịghị aha mpaghara ndị a, kama e dere ha n'ụdị dabara na mkpọpụta na mkpụrụedemede Igbo; τε καὶ na-ejikọta ha n'usoro n'ụzọ nkịtị.
- source_word: Αἴγυπτον
  choice: Ijipt
  rationale: Nke a bụ aha obodo ahụ a na-ejikarị eme ihe n'Igbo.
- source_word: τὰ μέρη τῆς Λιβύης
  choice: akụkụ Libya
  rationale: ‘Akụkụ’ na-echekwa echiche nkịtị nke μέρη dị ka akụkụ ma ọ bụ mpaghara, ma na-ada nke ọma n'Igbo.
- source_word: τῆς κατὰ Κυρήνην
  choice: nke chere ihu na Kurini
  rationale: Nkebiokwu a na-egosi akụkụ Libya a na-akọwa site n'ọnọdụ ya n'ebe Kurini dị; ‘chere ihu na’ na-echekwa nghọta ntụziaka ahụ n'ebughị ụzọ kọwaa ókè ndọrọ ndọrọ ọchịchị.
- source_word: οἱ ἐπιδημοῦντες Ῥωμαῖοι
  choice: ndị Rom bịara nleta
  rationale: ἐπιδημοῦντες na-egosi ndị nọ n'ebe ahụ dị ka ndị ọbịa ma ọ bụ ndị nọ nwa oge; okwu a adịghị ekwu na ha bụ ndị bi ebe ahụ na-adịgide adịgide.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị ùgwù ma dị mfe nghọta. E ji aha ebe ndị a dee n'ụdị ntụgharị-mkpọpụta dabara na Igbo. E tinyere naanị otu nkọwa ala peeji n'ihi na isi ihe na-edochaghị anya n'amaokwu Grik a bụ ma οἱ ἐπιδημοῦντες ọ pụtara ndị bịara nleta ka ọ bụ ndị nọ ebe ahụ nwa oge.
