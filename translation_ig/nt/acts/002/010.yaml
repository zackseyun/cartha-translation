  rationale: The revision corrects the awkward geographic expression, uses an established Igbo form of the place name Cyrene, and renders the participial description of the Romans as their temporary status rather than merely their arrival. It preserves the list structure, its continuing comma, and the lexical ambiguity noted in the footnote.
