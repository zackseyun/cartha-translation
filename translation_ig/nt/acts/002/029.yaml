  to: Ndị ikom[a], ụmụnna, ekwere m iji nkwuwa okwu gwa unu banyere nna ochie Devid na ọ nwụrụ, e liekwa ya, ili ya ka dịkwa n’etiti anyị ruo taa.
  rationale: E wepụrụ nnọchiaha ndị na-adịghị n’ederede Grik (“m,” “anyị”), dochie “nna nna” nke nwere ike ịpụta grandfather anya na “nna ochie” maka πατριάρχης, ma mee ka ἐξόν pụta ìhè dịka ikwe mmadụ ikwu okwu. A chekwara usoro na mgbagwoju anya nke isi mmalite, tinyere okwu ịkpọ mmadụ abụọ ahụ na akara ihe odide ala peeji.
