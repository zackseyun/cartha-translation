id: ACT.2.29
reference: Acts 2:29
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἄνδρες ἀδελφοί, ἐξὸν εἰπεῖν μετὰ παρρησίας πρὸς ὑμᾶς περὶ τοῦ πατριάρχου Δαυίδ, ὅτι καὶ ἐτελεύτησεν καὶ ἐτάφη, καὶ τὸ μνῆμα αὐτοῦ ἔστιν ἐν ἡμῖν ἄχρι τῆς ἡμέρας ταύτης·
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/029.yaml
  text: Men[a], brothers, I may speak to you with boldness about the patriarch David, that he both died and was buried, and his tomb is among us to this day.
translation:
  language: ig
  text: Ndị ikom[a], ụmụnna, ekwere m iji nkwuwa okwu gwa unu banyere nna ochie Devid na ọ nwụrụ, e liekwa ya, ili ya ka dịkwa n’etiti anyị ruo taa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Ụmụnna.” N’asụsụ Grik, ọ pụtara kpọmkwem, “Ndị ikom, ụmụnna,” bụ ụzọ nsọpụrụ e si akpọ ndị Izrel ibe ha gbakọrọ ọnụ okwu.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄνδρες ἀδελφοί
  choice: Ụmụ nwoke, ụmụnna m
  rationale: 'E gosipụtara okwu ịkpọ mmadụ abụọ ahụ n’ụzọ doro anya ma dịkwa n’Igbo nkịtị: “ụmụ nwoke” na-echekwa ụdị nwoke nke ἄνδρες, ebe “ụmụnna m” na-enye ἀδελφοί dị ka okwu mmekọrịta a na-eji akpọ ndị mmadụ okwu.'
- source_word: ἐξὸν εἰπεῖν
  choice: enwere m ike ... gwa
  rationale: Nke a na-egosi nnwere onwe ma ọ bụ ikike ikwu okwu, ọ bụghị naanị ikike anụ ahụ ime ihe; ahịrịokwu Igbo a bụ nke sitere n’okwu nkịtị.
- source_word: μετὰ παρρησίας
  choice: iji nkwuwa okwu
  rationale: “Nkwuwa okwu” na-egosipụta ikwu okwu n’atụghị egwu, n’ụzọ ghe oghe na nke nwere obi ike.
- source_word: περὶ τοῦ πατριάρχου Δαυίδ
  choice: banyere nna nna anyị Devid
  rationale: “Nna nna” bụ ụzọ Igbo a na-aghọta nke ọma isi gosi onyeisi nna ochie; “anyị” na-eme ka mmekọrịta Devid na ndị Izrel doo anya n’asụsụ Igbo, dị ka ọnọdụ okwu ahụ si gosi.
- source_word: καὶ ἐτελεύτησεν καὶ ἐτάφη
  choice: ọ nwụrụ, e liekwa ya
  rationale: A chekwara nkwusioru ihe abụọ nke καὶ ... καὶ site na “-kwa,” n’Igbo dị mfe ma kpọmkwem.
- source_word: τὸ μνῆμα αὐτοῦ
  choice: ili ya
  rationale: “Ili” bụ okwu Igbo nkịtị maka ebe e liri mmadụ, ọ dabara n’ebe a na-ekwu maka ebe a maara nke Devid.
- source_word: ἔστιν ἐν ἡμῖν
  choice: dịkwa n’etiti anyị
  rationale: Nke a na-echekwa echiche nke ebe ili ahụ dị n’etiti obodo na ndị na-ege ntị, kama ịkọwa ya naanị dị ka ihe ha nwere.
- source_word: ἄχρι τῆς ἡμέρας ταύτης
  choice: ruo taa
  rationale: Nke a bụ ụzọ Igbo dị nkenke ma bụrụ nke nkịtị maka okwu oge ahụ.
theological_decisions:
- issue: Otu e si sụgharịa okwu ịkpọ mmadụ nke nwoke n’isi amaokwu ahụ
  choice: Ụmụ nwoke, ụmụnna m
  alternative: Ụmụnna m
  rationale: Grik nwere okwu ịkpọ mmadụ abụọ, ἄνδρες na ἀδελφοί, ha abụọ dị n’ụdị nwoke. Isi ederede chekwara ha abụọ; ihe odide ala peeji na-egosi ụzọ Igbo dị nkenke nke nwere ike iburu ọrụ okwu ahụ n’ọnọdụ a.
- issue: Aha Devid dị ka πατριάρχης
  choice: nna nna anyị Devid
  alternative: nna ochie Devid
  rationale: Ebumnuche bụ igosi Devid dị ka nnukwu nna ochie nke mba ahụ n’asụsụ ndị nkịtị ga-aghọta, na-enweghị itinye nkọwa otu ụka. Ọ bụ ezie na “anyị” adịghị ka nnọchiaha pụrụ iche n’ahịrị Grik, echiche mmekọrịta obodo ahụ dị n’aha ahụ na ọnọdụ okwu Pita.
translation_notes:
  register: Asụsụ Igbo Izugbe, dị ugbu a ma nwee nsọpụrụ; e ji usoro okwu dị mfe maka ịgụpụta n’ihu ọha. Akara [a] dị n’isi ederede dịka achọrọ.
