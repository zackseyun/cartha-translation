    issue: “nna nna anyị Devid”
    rationale: πατριάρχου Δαυίδ enweghị “anyị,” ebe “nna nna” n’Igbo na-apụtakarị grandfather. “Nna ochie Devid” na-egosi patriarch nke ọma karịa, n’enweghị mgbakwunye.
  - severity: medium
    issue: “ụmụnna m”
    rationale: Ederede Grik e nyere nwere ἀδελφοί, ọ bụghị ἀδελφοί μου. E kwesịghị itinye “m” n’isi ederede.
  - severity: low
    issue: “enwere m ike”
    rationale: Ọ pụrụ ịpụta ike ma ọ bụ ikike. “Ekwere m” na-edobe nke ọma echiche ἐξόν—ikike ma ọ bụ nnwere onwe ikwu okwu.
