revisions:
- from: Pita wee sị ha, “Chegharịanụ, ka e meekwa onye ọ bụla n’ime unu baptizim n’aha Jizọs, bụ́ Mesaya ahụ[a], maka mgbaghara mmehie unu[b]; unu ga-anatakwa onyinye nke Mmụọ Nsọ.”
  to: Pita wee sị ha, “Chegharịanụ, ka e mee onye ọ bụla n’ime unu baptizim n’aha Jizọs, bụ́ Mesaya ahụ[a], maka mgbaghara mmehie unu[b]; unu ga-anatakwa onyinye nke Mmụọ Nsọ.”
  rationale: A single stylistic correction removes the nonessential additive -kwa from the passive baptismal imperative. The revision preserves the Greek imperative coordination and distributive singular, while improving natural modern Standard Igbo. No theological interpretation has been added or removed.
