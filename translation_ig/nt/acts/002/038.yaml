id: ACT.2.38
reference: Acts 2:38
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Πέτρος δὲ ⸂πρὸς αὐτούς· Μετανοήσατε⸃, καὶ βαπτισθήτω ἕκαστος ὑμῶν ⸀ἐπὶ τῷ ὀνόματι Ἰησοῦ Χριστοῦ εἰς ἄφεσιν ⸀τῶν ἁμαρτιῶν ⸀ὑμῶν, καὶ λήμψεσθε τὴν δωρεὰν τοῦ ἁγίου πνεύματος·
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/038.yaml
  text: And Peter said to them[a], “Repent, and let each of you be baptized in the name of Jesus the Messiah for the forgiveness of your sins[b], and you will receive the gift of the Holy Spirit.”
translation:
  language: ig
  text: Pita wee sị ha, “Chegharịanụ, ka e mee onye ọ bụla n’ime unu baptizim n’aha Jizọs, bụ́ Mesaya ahụ[a], maka mgbaghara mmehie unu[b]; unu ga-anatakwa onyinye nke Mmụọ Nsọ.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “Jizọs Kraịst.” Okwu Grik Χριστός nwere ike ịbụ “Mesaya” ma ọ bụ “Kraịst”; e jiri “Mesaya” ebe a mee ka ihe aha ọkwa ahụ pụtara n’okwuchukwu Pita pụta ìhè.
    reason: alternative_reading
  - marker: b
    text: “Maka mgbaghara mmehie unu” na-asụgharị okwu Grik ahụ ozugbo. Ndị na-akọwa Akwụkwọ Nsọ nwere nghọta dị iche iche banyere otú baptizim si metụta mgbaghara n’ebe a; ntụgharị a adịghị edozi esemokwu ahụ karịa ihe okwu ahụ n’onwe ya kwuru.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετανοήσατε
  choice: Chegharịanụ
  rationale: Okwu a bụ iwu e nyere ọtụtụ mmadụ ka ha mee mkpebi doro anya nke ịgbanwe uche na ụzọ ndụ; “Chegharịanụ” na-ejide ma mgbanwe nke obi ma ịlaghachikwuru Chineke n’asụsụ Igbo dị nkenke.
- source_word: βαπτισθήτω ἕκαστος ὑμῶν
  choice: ka e meekwa onye ọ bụla n’ime unu baptizim
  rationale: Ụdị a na-echekwa olu nnabata nke ngwaa Grik na nkesa nke “onye ọ bụla,” ma na-ada nke ọma n’Igbo ugbu a.
- source_word: ἐπὶ τῷ ὀνόματι
  choice: n’aha
  rationale: “N’aha” bụ akpaalaokwu Igbo doro anya nke na-ahapụghị ajụjụ ma ihe a na-emesi ike bụ ikike, ntọala, ma ọ bụ nkwupụta okwukwe.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jizọs, bụ́ Mesaya ahụ
  rationale: Χριστός ka bụ aha ọkwa n’okwuchukwu Pita ebe a. “Mesaya” na-echekwa ihe aha ọkwa ahụ pụtara, ebe usoro apposition a na-eme ka ọ bụrụ Igbo eke.
- source_word: εἰς ἄφεσιν τῶν ἁμαρτιῶν ὑμῶν
  choice: maka mgbaghara mmehie unu
  rationale: Nke a na-asụgharị okwu ahụ ozugbo ma na-echekwa njikọ ebumnuche/ntụzịaka nke εἰς n’ebughị ụzọ kpebie kpọmkwem otú baptizim na mgbaghara si metụta.
- source_word: λήμψεσθε τὴν δωρεὰν τοῦ ἁγίου πνεύματος
  choice: unu ga-anatakwa onyinye nke Mmụọ Nsọ
  rationale: Ọ na-echekwa nkwa n’ọdịnihu na okwu “onyinye,” ma na-edobe genitive Grik n’ụzọ na-adịghị amanye nkọwa karịa ihe ederede kwuru.
theological_decisions:
- issue: Njikọ dị n’etiti baptizim na mgbaghara n’okwu εἰς ἄφεσιν τῶν ἁμαρτιῶν ὑμῶν
  choice: maka mgbaghara mmehie unu
  alternative: ka e wee gbaghara mmehie unu; n’ihi na a gbagharala mmehie unu
  rationale: “Maka” na-esochi okwu Grik nso ma na-ahapụ esemokwu nkà mmụta okpukpe banyere ụzọ, usoro oge, ma ọ bụ ihe baptizim na-anọchi anya ka ọ dị, kama idozi ya n’ime ntụgharị.
- issue: Ntụgharị Χριστοῦ dịka aha ọkwa
  choice: Mesaya
  alternative: Kraịst
  rationale: N’ọnọdụ okwuchukwu a, okwu ahụ ka na-arụ ọrụ dịka aha ọkwa nke onye Chineke tere mmanụ; “Mesaya” na-eme ka ihe ọ pụtara pụta ìhè n’enweghị itinye ozizi otu ụka.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “Ka e meekwa onye ọ bụla” na-enye iwu passive ahụ n’ụzọ Igbo eke; “bụ́ Mesaya ahụ” na-egosi aha ọkwa ahụ n’enweghị iji “Kraịst” dị ka naanị aha mmadụ. Akara ụda dị na “bụ́” bụ maka iwepụ mgbagwoju anya.
