  text: ἐξίσταντο δὲ πάντες καὶ ⸀διηπόρουν, ἄλλος πρὸς ἄλλον λέγοντες· Τί ⸀θέλει τοῦτο εἶναι;
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/012.yaml
  text: And they all were amazed and perplexed[a], saying to one another, “What does this mean?”
translation:
  language: ig
  text: Ha niile nọ na-eju anya, ihe ahụ agbagwojuokwa ha anya[a]. Ha na-ajụ ibe ha, sị, “Gịnị ka ihe a pụtara?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’ụzọ sọrọ okwu Grik nso karị, a pụrụ ịsụ ya, “Gịnị ka ihe a chọrọ ịbụ?” Ọ bụ akpaalaokwu pụtara, “Gịnị ka ihe a pụtara?” ma ọ bụ, “Gịnị bụ ihe ihe a pụtara?”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξίσταντο
  choice: nọ na-eju anya
  rationale: Nkebi a na-egosi na ha nọgidere n’ọnọdụ oke ijuanya; okwu a bụ Igbo dị mfe ma doo anya, n’enweghị echiche na uche adịghị ha mma.
- source_word: δὲ
  choice: —
  rationale: N’ebe a δέ bụ njikọ dị nro na-aga n’ihu n’akụkọ ahụ. A naghị asụgharị ya iche n’Igbo ka ahịrịokwu ahụ wee na-aga nke ọma, na-enweghị itinye mmegide siri ike na-adịghị na Grik.
- source_word: πάντες
  choice: Ha niile
  rationale: Nke a na-echekwa nkwusi ike nke πάντες na-etinye n’ebe ndị niile nọ ahụ dị.
- source_word: διηπόρουν
  choice: ihe ahụ agbagwojuokwa ha anya
  rationale: Nke a na-egosi na ha amaghị ihe ha ga-eche banyere ihe ahụ ma ọ bụ otu ha ga-esi kọwaa ya; ụdị ngwaa ahụ na-egosikwa ọnọdụ gara n’ihu.
- source_word: ἄλλος πρὸς ἄλλον
  choice: ibe ha
  rationale: “Ibe ha” bụ ụzọ Igbo nkịtị si egosi na ndị ahụ na-agwa ma ọ bụ na-ajụrịta ibe ha okwu.
- source_word: λέγοντες
  choice: na-ajụ ... sị
  rationale: Ọ bụ ezie na λέγοντες pụtara “na-ekwu,” ihe so ya bụ ajụjụ kpọmkwem; “na-ajụ ... sị” na-eweta ọrụ okwu ahụ n’Igbo n'ụzọ eke, na-agbanweghị ọdịnaya ya.
- source_word: Τί θέλει τοῦτο εἶναι;
  choice: Gịnị ka ihe a pụtara?
  rationale: Nke a bụ akpaalaokwu Grik nke na-ajụ ihe ihe omume ahụ pụtara ma ọ bụ uru ihe ọ na-egosi; nsụgharị a na-enye nghọta ya n’Igbo nke oge a.
theological_decisions: []
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E kewara mmeghachi omume ha na ajụjụ ha ụzọ abụọ ka okwu ahụ na-asọ nke ọma n’Igbo. Akara nkọwa ala [a] dị n’isiokwu ahụ ma na-echekwa ọdịdị pụrụ iche nke akpaalaokwu Grik.
