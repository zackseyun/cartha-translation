id: ACT.2.22
reference: Acts 2:22
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἄνδρες Ἰσραηλῖται, ἀκούσατε τοὺς λόγους τούτους. Ἰησοῦν τὸν Ναζωραῖον, ἄνδρα ⸂ἀποδεδειγμένον ἀπὸ τοῦ θεοῦ⸃ εἰς ὑμᾶς δυνάμεσι καὶ τέρασι καὶ σημείοις οἷς ἐποίησεν δι’ αὐτοῦ ὁ θεὸς ἐν μέσῳ ὑμῶν, ⸀καθὼς αὐτοὶ οἴδατε,
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/022.yaml
  text: 'Men of Israel[a], hear these words: Jesus the Nazarene, a man attested to you by God with miracles and wonders and signs that God did through him in your midst[b], just as you yourselves know—'
translation:
  language: ig
  text: '“Ụmụ nwoke Izrel, geenụ ntị n’okwu ndị a: Jizọs onye Nazaret[a], bụ nwoke Chineke ji ọrụ ebube[b], ihe ịtụnanya, na ihe ịrịba ama ndị Chineke mere site na ya n’etiti unu gosi unu, dị ka unu onwe unu maara—”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “Jizọs onye si Nazaret” ma ọ bụ “Jizọs onye Nazọrean.” Okwu Grik Ναζωραῖος bụ aha njirimara e jikọtara Jizọs na Nazaret.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya “ọrụ ike.” N’ebe a, okwu Grik δυνάμεσι na-ekwu maka ọrụ ndị na-egosipụta ike pụrụ iche.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄνδρες Ἰσραηλῖται
  choice: Ụmụ nwoke Izrel
  rationale: Okwu a na-akpọ ndị a na-agwa okwu kpọmkwem ma na-edebe ụdị nwoke dị na ἄνδρες, tinyere aha agbụrụ Ἰσραηλῖται.
- source_word: ἀκούσατε τοὺς λόγους τούτους
  choice: geenụ okwu ndị a
  rationale: “Geenụ” bụ iwu ka ha tinye uche gee ntị; “okwu ndị a” na-anọ nso na λόγους τούτους n’enweghị ịkọwa ya karịa ka isi mmalite si kwuo.
- source_word: Ἰησοῦν τὸν Ναζωραῖον
  choice: Jizọs onye Nazaret
  rationale: Ọ bụ ụzọ Igbo doro anya ma dịrị ndụ isi gosi aha a jikọtara Jizọs na Nazaret, n’enweghị ịmanye ma ọ bụ naanị aha ebe ọmụmụ ka okwu Grik ahụ pụtara.
- source_word: ἄνδρα ἀποδεδειγμένον ἀπὸ τοῦ θεοῦ εἰς ὑμᾶς
  choice: bụ nwoke Chineke ji … mee ka unu mata
  rationale: “Nwoke” na-edebe ἄνδρα kpọmkwem. Usoro “Chineke ji … mee ka unu mata” na-egosi na Chineke bụ onye mere ka ihe banyere Jizọs pụta ìhè nye ndị na-ege ntị, ma ọ naghị etinye nkọwa ụka ọzọ n’ime okwu ahụ.
- source_word: δυνάμεσι καὶ τέρασι καὶ σημείοις
  choice: ọrụ ebube, ihe ịtụnanya na ihe ịrịba ama
  rationale: Usoro okwu atọ a na-ekwupụta omume ike pụrụ iche, ihe na-akpata ịtụnanya, na ihe na-arụ ọrụ dị ka akara. “Ọrụ ebube” bụ Igbo a na-aghọta ngwa ngwa n’ebe a.
- source_word: οἷς ἐποίησεν δι’ αὐτοῦ ὁ θεὸς
  choice: Chineke sitere n’aka ya rụọ ihe ndị a
  rationale: Nke a na-edebe Chineke dịka onye mere ihe ndị ahụ, Jizọs abụrụkwa onye Chineke sitere n’aka ya mee ha, dịka usoro okwu Grik si dị.
- source_word: ἐν μέσῳ ὑμῶν
  choice: n’etiti unu
  rationale: Ọ bụ ntụgharị Igbo nkịtị nke na-egosi na ihe ndị ahụ mere n’ebe ha nọ, n’ihu obodo ha.
- source_word: καθὼς αὐτοὶ οἴδατε
  choice: dị ka unu onwe unu makwaara
  rationale: “Unu onwe unu” na-edebe nkwusi ike nke αὐτοὶ; “makwaara” na-egosi na ndị ahụ amaworị ihe a na-ekwu.
theological_decisions:
- issue: Ikwupụta mmadụ Jizọs bụ n’okwu ἄνδρα
  choice: Edebere “nwoke” n’ahịrị bụ isi.
  alternative: “onye” ma ọ bụ okwu na-anọpụ iche n’ihe gbasara nwoke na nwaanyị
  rationale: Isi mmalite kpọrọ Jizọs ἄνδρα, ya bụ “nwoke.” Idebe ya na-ekwupụta ezi mmadụ ya n’enweghị ịgọnahụ ihe ndị ọzọ Agba Ọhụrụ na-akụzi banyere ya.
- issue: Onye bụ isi onye mere ọrụ ebube ndị ahụ
  choice: 'E mere Chineke isiokwu nke ahịrịokwu ahụ: “Chineke sitere n’aka ya rụọ ihe ndị a.”'
  alternative: “ihe ndị Jizọs mere n’etiti unu”
  rationale: N’asụsụ Grik, ὁ θεὸς bụ onye mere ihe ndị ahụ, ebe δι’ αὐτοῦ na-egosi na o sitere n’aka Jizọs mee ha. A hapụrụ esemokwu nkà mmụta okpukpe nke okwu ahụ nwere ka ọ dị.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị nsọ ma dị mfe nghọta. A kewara ogologo usoro okwu Grik ahụ ụzọ abụọ ka ọ na-aga nke ọma n’Igbo, ma e debeghị ihe ọ bụla ga-agbanwe Chineke dịka onye mere ọrụ ndị ahụ site n’aka Jizọs. Akara [a] na [b] dị n’ahịrị bụ isi n’ebe okwu ha na-akọwa dị.
