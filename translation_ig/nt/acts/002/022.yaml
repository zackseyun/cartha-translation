  verdict: revise
  source_fidelity: Draft ahụ na-edobe kpọmkwem oku a na-agwa “Ụmụ nwoke Izrel,” iwu “geenụ,” mmadụ Jizọs, usoro atọ nke ọrụ ebube, na nkwubiokwu “dị ka unu onwe unu maara.” Ma “Chineke ji ... mee ka unu mata” anaghị egosi Jizọs nke ọma dịka onye Chineke gosipụtara/kwadoro n’ihu ha; ahịrị “Chineke sitere n’aka ya rụọ” adịghị ekwupụta δι’ αὐτοῦ n’Igbo eke nke ọma. Ndozigharị ahụ mere Chineke onye na-eme ihe ndị ahụ, ma gosi Jizọs dị ka onye e ji ọrụ ndị ahụ gosi ndị na-ege ntị.
  naturalness: “Chineke mere ... site na ya” bụ Standard Igbo doro anya ma bụrụkwa ụzọ eke isi sụgharị agency/mediation ahụ. “Chineke ji ... gosi unu” na-agụ nke ọma ma na-ejikọta “nwoke” na ἀποδεδειγμένον n’enweghị mgbagwoju anya.
  terminology: “Ụmụ nwoke Izrel,” “Jizọs onye Nazaret,” “nwoke,” “ọrụ ebube, ihe ịtụnanya, na ihe ịrịba ama,” na “n’etiti unu” dabara n’usoro nsọ na Standard Igbo. A doziri nkọwa ala peeji nke a ka ọ nye nhọrọ ntụgharị n’ezie, kama ikwughachi ihe fọrọ nke nta ka ọ bụrụ otu okwu ahụ.
