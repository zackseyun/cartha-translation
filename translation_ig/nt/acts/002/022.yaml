  to: '“Ụmụ nwoke Izrel, geenụ ntị n’okwu ndị a: Jizọs onye Nazaret[a], bụ nwoke Chineke ji ọrụ ebube[b], ihe ịtụnanya, na ihe ịrịba ama ndị Chineke mere site na ya n’etiti unu gosi unu, dị ka unu onwe unu maara—”'
  rationale: E megharịrị ahịrịokwu ahụ ka Jizọs bụrụ onye Chineke ji ọrụ ndị a gosi ndị na-ege ntị, dịka ἀποδεδειγμένον ... εἰς ὑμᾶς si dị. E weghachikwara Chineke n’ụzọ doro anya dịka isiokwu nke “mere,” ebe “site na ya” na-asụgharị δι’ αὐτοῦ. A debeghị nkọwa okpukpe ọzọ karịa ihe ederede Grik na-ekwu, a debekwara akara ala peeji n’ebe aha Nazaret na “ọrụ ebube” dị.
  reviewer_model: gpt-5.6-terra
