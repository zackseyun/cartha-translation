  text: οὐ γὰρ ὡς ὑμεῖς ὑπολαμβάνετε οὗτοι μεθύουσιν, ἔστιν γὰρ ὥρα τρίτη τῆς ἡμέρας,
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/015.yaml
  text: For these are not drunk[a], as you suppose, for it is the third hour of the day.
translation:
  language: ig
  text: N’ihi na ndị a adịghị aṅụbiga mmanya ókè[a], dịka unu chere, n’ihi na ọ bụ elekere nke atọ nke ụbọchị.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ya bụ, ihe dị ka elekere itoolu nke ụtụtụ dịka usoro ndị Juu si agụ oge.
    reason: cultural_note
lexical_decisions:
- source_word: οὐ γὰρ
  choice: N’ihi na ... adịghị
  rationale: “N’ihi na” na-egosipụta ọrụ nkọwa na arụmụka nke γάρ, ebe “adịghị” na-egosipụta ngọnarị οὐ.
- source_word: ὡς ὑμεῖς ὑπολαμβάνετε
  choice: dịka unu chere
  rationale: Nke a bụ okwu Igbo dị mfe ma bụrụkwa nke e ji eme ihe taa maka echiche nke ‘dịka unu na-eche/na-atụ anya,’ ma na-edobe ịkpọ ndị na-ege ntị okwu ozugbo.
- source_word: οὗτοι
  choice: ndị a
  rationale: “Ndị a” na-ezo aka kpọmkwem n’ìgwè ahụ n’etinyeghị ‘ndị ikom’ ma ọ bụ nkọwa ọzọ na-adịghị n’asụsụ Grik.
- source_word: μεθύουσιν
  choice: adịghị aṅụbiga mmanya ókè
  rationale: N’okwu a, ahịrịokwu a na-ekwu na ha anọghị n’ọnọdụ mmanya na-egbu; okwu Igbo a na-ekwupụta ebubo ahụ n’ụzọ doro anya ma dị otú e si ekwu ya.
- source_word: ἔστιν γὰρ ὥρα τρίτη τῆς ἡμέρας
  choice: n’ihi na ọ bụ naanị elekere nke atọ nke ụbọchị
  rationale: E debere okwu oge ndị Juu n’ahịrịokwu bụ isi, ebe “naanị” na-eme ka ihe kpatara Pita ji jụ ebubo ahụ pụta nke ọma n’Igbo.
- source_word: ὥρα τρίτη
  choice: elekere nke atọ
  rationale: Nke a na-edobe usoro ịgụ oge dị n’asụsụ Grik; a kọwara oge ya n’usoro nke oge anyị na nkọwa ala peeji.
