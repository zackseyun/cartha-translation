review_pass:
  verdict: revise
  source_fidelity: The draft correctly renders the emphatic object ('Jizọs a'), God as the explicit agent, resurrection, and the collective witness statement. However, the enclitic 'bụkwa' adds an unexpressed 'also/too' not present in the Greek.
  naturalness: ‘Chineke mere ka Jizọs a si n’ọnwụ bilie’ is clear, natural Standard Igbo for resurrection. Separating the witness clause with a semicolon improves the formal public-reading register.
  terminology: ‘Chineke,’ ‘Jizọs,’ ‘ndị akaebe,’ and ‘mbilite n’ọnwụ’ are appropriate, recognizable Standard Igbo biblical terms. ‘Banyere ya’ naturally conveys the relative-genitive witness relationship without overstating it.
  issues:
  - severity: low
    issue: The word ‘bụkwa’ introduces an additional connective sense.
    rationale: Greek reads ἐσμεν μάρτυρες, ‘we are witnesses,’ without καί or another particle corresponding to Igbo -kwa (‘also/too’). Removing it more closely preserves the source wording.
  revised_text: Chineke mere ka Jizọs a si n’ọnwụ bilie[a]; anyị niile bụ ndị akaebe banyere ya.
