revisions:
- from: Chineke mere ka Jizọs a si nʼọnwụ bilie[a], anyị niile bụkwa ndị akaebe banyere ya.
  to: Chineke mere ka Jizọs a si n’ọnwụ bilie[a]; anyị niile bụ ndị akaebe banyere ya.
  rationale: The revision removes only the unrepresented additive force of ‘-kwa.’ It retains the demonstrative emphasis in ‘Jizọs a,’ the explicit divine agency, the resurrection sense of ἀνέστησεν, and the statement that all the speakers are witnesses concerning him. The footnote’s alternative is adjusted to idiomatic Igbo resurrection wording.
