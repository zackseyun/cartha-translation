  text: τοῦτον τὸν Ἰησοῦν ἀνέστησεν ὁ θεός, οὗ πάντες ἡμεῖς ἐσμεν μάρτυρες.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/032.yaml
  text: God raised up this Jesus[a], of whom we all are witnesses.
translation:
  language: ig
  text: Chineke mere ka Jizọs a si n’ọnwụ bilie[a]; anyị niile bụ ndị akaebe banyere ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “Chineke kpọlitere Jizọs a n’ọnwụ.” N’ebe a, ngwaa Grik ahụ na-ekwu banyere mbilite n’ọnwụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτον τὸν Ἰησοῦν
  choice: Jizọs a
  rationale: Ndị a na-edebe ike ngosipụta nke τοῦτον ma na-arụkwa ọrụ nke ọma nʼusoro okwu Igbo, na-atụ aka kpọmkwem nʼebe Jizọs ahụ a kpọtụrụ aha nọ.
- source_word: ἀνέστησεν
  choice: mere ka ... si nʼọnwụ bilie
  rationale: Nʼọnọdụ a, ngwaa ahụ na-ekwu kpọmkwem banyere mbilite nʼọnwụ. Nsụgharị a na-egosi na Chineke bụ onye mere ya ma na-eme ka ihe okwu ahụ pụtara doo onye na-agụ Igbo anya.
- source_word: ὁ θεός
  choice: Chineke
  rationale: A hapụrụ Chineke dịka isiokwu doro anya nke mere ka Jizọs bilie.
- source_word: οὗ
  choice: banyere ya
  rationale: Nke a na-egosi na Jizọs bụ onye ha na-agba akaebe banyere ya, kama ịhapụ ‘ndị akaebe ya’ ka ọ dị ka ọ bụ naanị ndị akaebe nwe ya.
- source_word: πάντες ἡμεῖς
  choice: anyị niile
  rationale: Nke a na-echekwa nkwusi ike dị na ngwakọta πάντες ἡμεῖς nʼIgbo nkịtị.
- source_word: ἐσμεν μάρτυρες
  choice: bụkwa ndị akaebe
  rationale: A na-edebe aha μάρτυρες dịka ‘ndị akaebe,’ ọ bụghị ịgbanwe ya ka ọ bụrụ naanị ngwaa.
theological_decisions:
- issue: Okwu banyere mbilite nʼọnwụ
  choice: Chineke mere ka Jizọs a si nʼọnwụ bilie
  alternative: Chineke kpọlitere Jizọs a
  rationale: Nhọrọ a na-ekwu hoo haa na Chineke mere ka Jizọs bilie nʼọnwụ, dịka ọnọdụ okwu Grik si gosi, nʼetinyeghị nkọwa ozizi ọzọ.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. ‘Jizọs a’ na-echekwa nkwusi ike nke ngosipụta ahụ; ‘si nʼọnwụ bilie’ na-eme ka ihe ngwaa ahụ pụtara nʼọnọdụ a doo anya.
