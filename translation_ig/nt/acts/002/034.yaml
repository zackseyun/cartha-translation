- from: N’ihi na Devid arịgoghị n’eluigwe[a], kama ya onwe ya na-ekwu, sị, “Onyenwe anyị gwara Onyenwe m, ‘Nọdụ ala n’aka nri m,’”
  to: N’ihi na Devid arịgoghị n’eluigwe[a], ma ya onwe ya na-ekwu, sị, “Onyenwe anyị gwara Onyenwe m, ‘Nọdụ ala n’aka nri m,’”
  rationale: 'The revision makes one limited source-sensitive adjustment: ‘ma’ renders the mild contrast of δέ more precisely than ‘kama’. The footnote is retained, with a minor idiomatic refinement, because it correctly identifies the Hebrew YHWH underlying the first ‘Lord’ without importing it into the Greek-based main text.'
