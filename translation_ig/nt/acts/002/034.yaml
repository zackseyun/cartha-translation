id: ACT.2.34
reference: Acts 2:34
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οὐ γὰρ Δαυὶδ ἀνέβη εἰς τοὺς οὐρανούς, λέγει δὲ αὐτός· Εἶπεν ⸀ὁ κύριος τῷ κυρίῳ μου· Κάθου ἐκ δεξιῶν μου,
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/034.yaml
  text: For David did not ascend into the heavens[a], but he himself says, ‘The Lord said to my Lord, “Sit at my right hand,”’
translation:
  language: ig
  text: N’ihi na Devid arịgoghị n’eluigwe[a], ma ya onwe ya na-ekwu, sị, “Onyenwe anyị gwara Onyenwe m, ‘Nọdụ ala n’aka nri m,’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Abụ Ọma 110:1. N’edemede Hibru, “Onyenwe anyị” nke mbụ nọchiri aha Chineke bụ́ YHWH; tulee, “YHWH gwara Onyenwe m.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνέβη
  choice: rịgoghị
  rationale: Okwu a na-egosi ịrịgo n’elu; n’ebe a, ọ pụtara ịrịgo n’eluigwe. Ọ na-edobe ihe aorist ahụ kwuru dị ka ihe mere eme.
- source_word: τοὺς οὐρανούς
  choice: n’eluigwe
  rationale: Ọ bụ ezie na okwu Grik ahụ dị n’ụdị ọtụtụ, Igbo nkịtị na-eji “eluigwe” akọwa mpaghara eluigwe ahụ n’enweghị ịmanye ụdị ọtụtụ nke ga-ada ka ihe na-abụghị Igbo ebumpụta ụwa.
- source_word: λέγει δὲ αὐτός
  choice: kama ya onwe ya na-ekwu
  rationale: “Kama” na-egosi obere ọdịiche nke δέ, “ya onwe ya” na-edobe nkwusi ike nke αὐτός, ebe “na-ekwu” na-edobe oge ugbu a e ji webata okwu Akwụkwọ Nsọ.
- source_word: ὁ κύριος
  choice: Onyenwe anyị
  rationale: Nke a bụ nsụgharị Igbo kwụ chịm maka κύριος mgbe ọ na-ezo aka n’Onyenwe Chineke. Ihe odide Hibru dị n’azụ okwu a nwere aha Chineke YHWH; a kọwara nke ahụ n’ala peeji.
- source_word: τῷ κυρίῳ μου
  choice: Onyenwe m
  rationale: Ọ na-edobe otu okwu “Onyenwe” e ji sụgharịa κύριος, ma “m” na-egosipụta μου nke ọma, n’enweghị ịgbanwe ya ka ọ bụrụ naanị “nna ukwu m.”
- source_word: Κάθου
  choice: Nọdụ ala
  rationale: Nke a bụ iwu doro anya ma bụrụkwa ụzọ Igbo nkịtị si ekwu ka mmadụ nọdụ.
- source_word: ἐκ δεξιῶν μου
  choice: n’aka nri m
  rationale: Nke a bụ ụzọ Igbo ebumpụta ụwa si kwuo ọnọdụ nsọpụrụ na ikike dị n’aka nri mmadụ.
theological_decisions:
- issue: Otu e si sụgharịa κύριος ugboro abụọ n’okwu e hotara n’Abụ Ọma 110:1
  choice: 'E ji “Onyenwe” mee ha abụọ n’ahịrịokwu bụ isi: “Onyenwe anyị gwara Onyenwe m.”'
  alternative: “YHWH gwara Onyenwe m,” iji mee ka aha Chineke dị n’ihe odide Hibru pụta ìhè.
  rationale: Ihe odide Grik e nyere ji κύριος mee ha abụọ. Ya mere, ahịrịokwu bụ isi na-agbaso Grik ahụ, ebe nkọwa ala peeji na-echekwa eziokwu ahụ na nke mbụ nọchiri YHWH n’ihe odide Hibru.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. Usoro okwu ahụ na-edobe nkwusi ike dị na “ya onwe ya” na ọdịiche dị n’etiti Devid na okwu Devid hotara.
