    reason: lexical_alternative
  revision_rationale: The revision renders αὐτοῖς as “nye ha,” keeps γλῶσσαι as “ire,” and expresses διαμεριζόμεναι as a modifier of the tongues. It preserves the simile in ὡσεὶ πυρός and retains the source’s notable singular ἐκάθισεν through the collective expression “otu ihe ahụ,” without forcing a disputed explanation of the phenomenon.
