  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ὤφθησαν αὐτοῖς διαμεριζόμεναι γλῶσσαι ὡσεὶ πυρός, ⸂καὶ ἐκάθισεν⸃ ἐφ’ ἕνα ἕκαστον αὐτῶν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/003.yaml
  text: And tongues like fire appeared to them, being divided, and it came to rest on each one of them[a].
translation:
  language: ig
  text: Ire ndị dị ka ọkụ, ndị na-ekewa ekewa, pụtara ìhè nye ha; otu ihe ahụ wee nọkwasị onye ọ bụla n’ime ha[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “ire ndị kewara ekewa, dị ka ọkụ,” ma ọ bụ “ire, dị ka a ga-asị na ọ bụ ọkụ.” Usoro okwu Grik na-emesi ma ihe ahụ pụtara ìhè anya ma nkesa ya n’etiti ha ike.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὤφθησαν αὐτοῖς
  choice: pụtara ìhè n’ihu ha
  rationale: Nke a na-egosi na ihe ahụ ghọrọ ihe ha pụrụ ịhụ. Okwu a bụ Igbo dị mfe ma na-edobe echiche nke ngosipụta anya.
- source_word: διαμεριζόμεναι
  choice: ha nọ na-ekewa ekewa
  rationale: Ntụgharị a na-edobe ọdịdị participle nke ugbu a na nghọtahie ziri ezi banyere ma ire ndị ahụ hà nọ na-ekewa, ka a hà na-ekesa ha n’etiti ndị nọ ebe ahụ.
- source_word: γλῶσσαι
  choice: ire
  rationale: “Ire” na-edobe ihe oyiyi a hụrụ anya ma na-ahapụkwa njikọ okwu ahụ na ikwu okwu na asụsụ n’amaokwu ndị na-esote; “ire ọkụ” naanị ya pụrụ ime ka a ghọta ya dịka ọkụ nkịtị.
- source_word: ὡσεὶ πυρός
  choice: ndị yiri ọkụ
  rationale: “Yiri” na-egosi ntụnyere, ọ bụghị na ihe ahụ bụ ọkụ n’ezie.
- source_word: ἐκάθισεν
  choice: otu ihe ahụ wee bịakwasị
  rationale: Ngwaa Grik dị n’otu, ya mere “otu ihe ahụ” na-edobe otu-ọnụọgụ ahụ ma na-enye Igbo doro anya. “Bịakwasị” dabara n’ihe ngosipụta dakwasịrị mmadụ n’enweghị iji okwu nkịtị nke ịnọdụ ala.
- source_word: ἐφ’ ἕνα ἕκαστον αὐτῶν
  choice: onye ọ bụla n’ime ha
  rationale: 'Nke a na-edobe ike nkesa nke ahịrịokwu ahụ: ihe ngosipụta ahụ bịakwasịrị onye nke ọ bụla.'
theological_decisions:
- issue: Ụdị ihe ngosipụta Pentikọst
  choice: “Ire ndị yiri ọkụ”
  alternative: “ire ọkụ” ma ọ bụ “asụsụ ndị yiri ọkụ”
  rationale: Nke a na-edobe ma aha γλῶσσαι ma ntụnyere ὡσεὶ, ghara ikwu na ọ bụ ọkụ nkịtị ma ọ bụ kọwaa ya tupu oge eruo dịka naanị asụsụ a na-asụ.
- issue: Otu-ọnụọgụ nke ἐκάθισεν
  choice: “otu ihe ahụ wee bịakwasị”
  alternative: “ha wee bịakwasị”
  rationale: Isi mmalite nwere ngwaa otu-ọnụọgụ mgbe “ire” dị n’ọtụtụ. Ntụgharị ahụ na-echekwa esemokwu ụtọasụsụ a kama idozi ya n’ọtụtụ n’enweghị ihe akaebe.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E jiri “pụtara ìhè n’ihu ha” mee ka ngosipụta anya doo anya; e zere “ire ọkụ” nke pụrụ ime ka ntụnyere ahụ ghọọ njirimara kpọmkwem. Akara nkọwa ala [a] dị n’ederede isi.
