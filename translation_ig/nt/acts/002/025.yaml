source:
  edition: SBLGNT
  text: Δαυὶδ γὰρ λέγει εἰς αὐτόν· Προορώμην τὸν κύριον ἐνώπιόν μου διὰ παντός, ὅτι ἐκ δεξιῶν μού ἐστιν ἵνα μὴ σαλευθῶ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/025.yaml
  text: For David says concerning him, ‘I kept seeing the Lord before me continually, because he is at my right hand, so that I may not be shaken.’
translation:
  language: ig
  text: N’ihi na Devid kwuru banyere ya, sị, “M na-ahụ Onyenwe anyị n’ihu m mgbe niile,[a] n’ihi na ọ nọ n’akụkụ aka nri m, ka a ghara ime ka m maa jijiji.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “Ahụrụ m Onyenwe anyị n’ihu m mgbe niile,” ma ọ bụ, “M buru ụzọ hụ Onyenwe anyị n’ihu m.” Okwu Grik ahụ nwere ike ịpụta ịhụ ihe tupu oge eruo n’ebe ụfọdụ, ma okwu ndị gbara ya gburugburu ebe a na-akwado echiche nke ịhụ ma ọ bụ idowe Onyenwe anyị n’ihu onwe onye mgbe niile.
    reason: lexical_alternative
  - marker: b
    text: Pita na-ehota Abụ Ọma 16:8. N’ederede Hibru nke Abụ Ọma ahụ, okwu dị n’ebe a bụ aha Chineke pụrụ iche, nke a na-asụgharịkarị “ONYENWE ANYỊ.”
    reason: cross_reference
lexical_decisions:
- source_word: λέγει εἰς αὐτόν
  choice: kwuru banyere ya
  rationale: N’usoro e si webata ihe e hotara ebe a, εἰς αὐτόν pụtara ikwu banyere onye ahụ, ọ bụghị ịgwa ya okwu kpọmkwem.
- source_word: Προορώμην
  choice: Ana m ahụ
  rationale: Ụdị imperfect na-egosi omume na-aga n’ihu ma ọ bụ nke a na-eme mgbe niile; “Ana m ahụ” jikọtara ya na “mgbe niile” n’ụzọ Igbo dị ndụ ma ghara ime ka ọ bụrụ amụma banyere ihe ga-eme n’ọdịnihu.
- source_word: κύριον
  choice: Onyenwe anyị
  rationale: Nke a bụ ntụgharị Igbo a na-anabata nke κύριος n’aha nsọ, ma ọ naghị akọwapụta onye ọ na-ezo aka na ya karịa ka ederede Grik mere.
- source_word: ἐνώπιόν μου διὰ παντός
  choice: n’ihu m mgbe niile
  rationale: Ọ na-echekwa ihe atụ nke ịnọ n’ihu mmadụ na echiche nke ịdịgide mgbe niile, n’Igbo doro anya.
- source_word: ἐκ δεξιῶν μού
  choice: n’aka nri m
  rationale: Ọ bụ ụzọ Igbo dị mfe isi kwuo ọnọdụ n’akụkụ aka nri, nke nwekwara ike igosi nkwado ma ọ bụ nchebe n’ime okwu a.
- source_word: ἵνα μὴ σαλευθῶ
  choice: ka a ghara ime ka m maa jijiji
  rationale: Ọ na-echekwa njikọ nzube/ntụpụta nke ἵνα na olu nnara nke σαλευθῶ, tinyere ihe atụ nke ịbụ onye e mere ka ọ maa jijiji ma ọ bụ pụọ n’ọnọdụ siri ike.
theological_decisions:
- issue: Onye “Onyenwe anyị” na-ezo aka na ya n’ihe e hotara n’Abụ Ọma
  choice: E debere “Onyenwe anyị” n’ahịrịokwu ahụ n’enweghị nkọwa ọzọ.
  alternative: “Yahweh” ma ọ bụ “Mesaịa ahụ”
  rationale: Pita ji Abụ Ọma 16 kọwaa Kraịst, ma okwu Grik e hotara n’onwe ya bụ κύριον. Ịhapụ “Onyenwe anyị” na-echekwa esemokwu na njikọ nkà mmụta okpukpe dị n’ederede kama ikpebi ya n’ime ntụgharị.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke nwere ugwu ma dị mfe nghọta. Ahịrịokwu ahụ na-edobe uda okwu e hotara n’Abụ Ọma, ma zere okwu ochie ma ọ bụ nkọwa ụka pụrụ iche.
