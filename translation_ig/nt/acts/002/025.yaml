    text: Pita na-ehota Abụ Ọma 16:8. N’ederede Hibru nke Abụ Ọma ahụ, okwu dị n’ebe a bụ aha Chineke pụrụ iche, nke a na-asụgharịkarị “ONYENWE ANYỊ.”
