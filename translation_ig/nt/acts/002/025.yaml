revisions:
- from: N’ihi na Devid kwuru banyere ya, sị, “Ana m ahụ Onyenwe anyị n’ihu m mgbe niile,[a] n’ihi na ọ nọ n’aka nri m, ka a ghara ime ka m maa jijiji.[b]”
  to: N’ihi na Devid kwuru banyere ya, sị, “M na-ahụ Onyenwe anyị n’ihu m mgbe niile,[a] n’ihi na ọ nọ n’akụkụ aka nri m, ka a ghara ime ka m maa jijiji.[b]”
  rationale: The revision corrects the right-side idiom, retains the ongoing/habitual force of the Greek verb in natural Psalm-style Igbo, and improves the precision and readability of both footnotes. It leaves “Onyenwe anyị” uninterpreted, as the Greek citation does.
