  text: until I make your enemies a footstool for your feet[a][b].
translation:
  language: ig
  text: ruo mgbe m ga-eme ka ndị iro gị bụrụ ihe mgbakwasị ụkwụ maka ụkwụ gị.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n’ụzọ ka nso n’okwu Grik, “ruo mgbe m ga-etinye ndị iro gị dị ka ihe mgbakwasị ụkwụ maka ụkwụ gị.”
    reason: lexical_alternative
  - marker: b
    text: Ahịrịokwu a na-ekwughachi Abụ Ọma 110:1, bụ abụ banyere eze/Mesaịa a na-anọkwasị n’ocheeze.
    reason: cross_reference
lexical_decisions:
- source_word: ἕως ἂν
  choice: ruo mgbe
  rationale: Nkebiokwu a na-egosi oge dị n’ọdịnihu nke ihe e kwuru n’amaokwu bu ụzọ ga-adịgide ruo na ya; “ruo mgbe” bụ ụzọ Igbo doro anya ma bụrụkwa nke e ji ekwu okwu taa.
- source_word: θῶ
  choice: m ga-eme ka ... bụrụ
  rationale: Ọ bụ ezie na τίθημι pụtara n'ụzọ nkịtị “itinye,” n’usoro okwu a, ebe e nwere aha na-akọ ihe ndị iro ga-aghọ, “ime ka ... bụrụ” na-enye nghọta ahụ n’Igbo n’enweghị ịkọwa ihe atụ ahụ gabiga ókè.
- source_word: τοὺς ἐχθρούς σου
  choice: ndị iro gị
  rationale: Nke a na-asụgharị ma echiche nke iro onwe onye ma nke mmegide eze dị n’okwu Abụ Ọma ahụ n'ụzọ kwụ ọtọ.
- source_word: ὑποπόδιον
  choice: ihe mgbakwasị ụkwụ
  rationale: Okwu a na-egosi ihe a na-adọba ụkwụ n’elu ya ma na-echekwa ihe atụ nke imeri na iweda ndị iro n’okpuru ọchịchị.
- source_word: τῶν ποδῶν σου
  choice: ụkwụ gị
  rationale: Mgbe e jikọtara ya na “ihe mgbakwasị ụkwụ,” okwu a na-ada nke ọma n’Igbo ma na-edebe ihe oyiyi dị n’asụsụ Grik.
theological_decisions:
- issue: Ihe oyiyi eze na-emeri ndị iro n’okwu e si n’Abụ Ọma 110:1 kpọpụta
  choice: E debere ihe oyiyi doro anya nke ime ndị iro “ihe mgbakwasị ụkwụ” kama ịkọwa ya dị ka imeri ha kpamkpam.
  alternative: ruo mgbe m ga-emeri ndị iro gị kpamkpam ma dọba ha n’okpuru ụkwụ gị
  rationale: Idebe ihe atụ ahụ na-echekwa njikọ ya na Abụ Ọma 110:1 na ike ọ nwere gbasara eze na Mesaịa, n’etinyeghị nkọwa okpukpe sara mbara n’ime isiokwu amaokwu ahụ.
translation_notes:
  register: E ji Standard Igbo nke dị ugbu a, dị ùgwù, ma dị mfe nghọta mee ntụgharị ahụ. “Ihe mgbakwasị ụkwụ” na-edebe ihe atụ mbụ n’enweghị ịgbasa ya ka ọ bụrụ nkọwa ozizi.
