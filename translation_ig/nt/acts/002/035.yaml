  source_fidelity: Isi ntụgharị ahụ na-anọchi anya ἕως ἂν, θῶ, na ihe oyiyi ὑποπόδιον τῶν ποδῶν σου nke ọma. Agbanyeghị, itinye “maka” na-eme ka njikọ dị n’etiti ihe mgbakwasị ụkwụ na “ụkwụ gị” doo anya karịa, ma ghara ịgbanwe ihe oyiyi ahụ.
  naturalness: “Ruo mgbe m ga-eme ka ndị iro gị bụrụ ihe mgbakwasị ụkwụ maka ụkwụ gị” bụ Standard Igbo doro anya ma na-ada n’ụzọ nkịtị. N’ala ala, “ihe mgbakwasị ụkwụ gị” nwere ike ịdị ntakịrị mgbagwoju anya banyere onye ihe ahụ bụ nke ya; “maka ụkwụ gị” na-ewepu nke a.
