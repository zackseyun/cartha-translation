    text: Ma ọ bụ, “n’ihi Onyenwe anyị Jizọs.” Ma Grik ahụ kwuru kpọmkwem “aha,” nke bụ ụzọ Akwụkwọ Nsọ si ezo aka na Jizọs n’onwe ya, ikike ya, na ọrụ e ji ya mara.
    reason: lexical_alternative
