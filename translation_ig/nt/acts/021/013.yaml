id: ACT.21.13
reference: Acts 21:13
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸂τότε ἀπεκρίθη⸃ ὁ Παῦλος· Τί ποιεῖτε κλαίοντες καὶ συνθρύπτοντές μου τὴν καρδίαν; ἐγὼ γὰρ οὐ μόνον δεθῆναι ἀλλὰ καὶ ἀποθανεῖν εἰς Ἰερουσαλὴμ ἑτοίμως ἔχω ὑπὲρ τοῦ ὀνόματος τοῦ κυρίου Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/013.yaml
  text: Then Paul answered[a], “What are you doing[b], weeping and breaking my heart? For I am ready not only to be bound but even to die in Jerusalem for the name of the Lord Jesus.”
translation:
  language: ig
  text: Mgbe ahụ Pọl zara, sị, “Gịnị ka unu na-eme, na-ebe akwa ma na-agbawa obi m[a]? N’ihi na adị m njikere ọ bụghị naanị ka e kee m agbụ, kama ka m nwụọkwa na Jerusalem n’ihi aha Onyenwe anyị Jizọs[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “na-etipịa obi m.” Ngwaa Grik a siri ike karịa igosi mwute nkịtị; ọ na-enye onyinyo nke obi a na-etipịa n’ime mmadụ.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “n’ihi Onyenwe anyị Jizọs.” Ma Grik ahụ kwuru kpọmkwem “aha,” nke bụ ụzọ Akwụkwọ Nsọ si ezo aka na Jizọs n’onwe ya, ikike ya, na ọrụ e ji ya mara.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: zara ha, sị
  rationale: Nke a bụ ụzọ Igbo si ebido okwu onye zara n’akụkọ n’ụzọ dị ire ma doo anya; “ha” pụtara ndị Pọl na-agwa okwu, ọ bụ ezie na ọ dịghị dị ka okwu kpọmkwem n’asụsụ Grik.
- source_word: Τί ποιεῖτε
  choice: Gịnị ka unu na-eme
  rationale: Ọ na-edebe ajụjụ ahụ kpọmkwem na mkpesa mmetụta uche Pọl n’etinyeghị nkọwa ọzọ dịka “Gịnị mere unu ji eme nke a?”
- source_word: κλαίοντες
  choice: na-ebe akwa
  rationale: Ọ bụ okwu Igbo dị ugbu a ma dị ùgwù nke na-egosi omume na-aga n’ihu n’oge ha na-agbawa Pọl obi.
- source_word: συνθρύπτοντές μου τὴν καρδίαν
  choice: na-agbawa m obi
  rationale: Akpaalaokwu Igbo a na-ebuga ihe atụ nke obi a na-agbaji na oke mwute n’ụzọ ndị nkịtị ga-aghọta.
- source_word: δεθῆναι
  choice: ka e kee m agbụ
  rationale: Ọ na-edebe ụda nnara nke ngwaa Grik na echiche kpọmkwem nke ike mmadụ agbụ, kama ịkọwa ya naanị dị ka ịtụ mkpọrọ.
- source_word: ἀποθανεῖν
  choice: ịnwụ
  rationale: Ntụgharị kpọmkwem, dị nkenke, ma bụrụ Igbo ebumpụta ụwa.
- source_word: εἰς Ἰερουσαλὴμ
  choice: na Jerusalem
  rationale: N’ebe a, Igbo na-egosi Jerusalem dịka ebe a ga-ekekọta ya agbụ ma ọ bụ ebe ọ ga-anwụ; “na” na-ebuga echiche ahụ n’ụzọ ebumpụta ụwa.
- source_word: ἑτοίμως ἔχω
  choice: adị m njikere
  rationale: Ọ bụ ụzọ Igbo doro anya ma dị ire isi kwuo na mmadụ kwadebere onwe ya maka ihe ga-eme.
- source_word: ὑπὲρ τοῦ ὀνόματος
  choice: n’ihi aha
  rationale: Ọ na-echekwa akpaalaokwu Akwụkwọ Nsọ banyere “aha” kama ime ka ọ bụrụ naanị nkọwa banyere onye ahụ ma ọ bụ aha ọma ya.
- source_word: κυρίου Ἰησοῦ
  choice: Onyenwe anyị Jizọs
  rationale: “Onyenwe anyị” na-echekwa κύριος dịka aha nsọpụrụ Kraịst, ebe “Jizọs” bụ nsụgharị aha ahụ n’Igbo nke oge a.
theological_decisions:
- issue: Nsụgharị κύριος mgbe ọ na-ezo aka na Jizọs
  choice: Onyenwe anyị Jizọs
  alternative: Nna ukwu Jizọs
  rationale: N’ebe a κύριος bụ aha nsọpụrụ nwere ibu okwu gbasara onye Jizọs bụ; “Onyenwe anyị” na-echekwa ibu ahụ ma ghara ime ka ọ daa ogbenye.
- issue: Ichekwa akpaalaokwu “aha”
  choice: n’ihi aha Onyenwe anyị Jizọs
  alternative: n’ihi Onyenwe anyị Jizọs
  rationale: Isi okwu Grik kwuru kpọmkwem banyere “aha,” nke nwere ike ịgụnye onye Jizọs bụ, ikike ya, na ozi e ji ya mara. Ntụgharị ahụ echekwaghị naanị otu akụkụ nke ihe ndị a.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-echekwa mkpesa mmetụta uche Pọl, ihe atụ nke obi na-agbawa, na akpaalaokwu nkà mmụta okpukpe banyere “aha.” E debere akara ntụaka [a] n’akụkụ okwu banyere obi, na [b] n’akụkụ okwu banyere aha, ka nke ọ bụla kwekọọ na nkọwa ala peeji ya.
