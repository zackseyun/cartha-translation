    text: A pụkwara ịsụgharị ya, “na-etipịa obi m.” Ngwaa Grik a siri ike karịa igosi mwute nkịtị; ọ na-enye onyinyo nke obi a na-etipịa n’ime mmadụ.
    reason: lexical_alternative
