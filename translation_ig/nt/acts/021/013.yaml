revisions:
- from: Mgbe ahụ Pọl zara ha, sị, “Gịnị ka unu na-eme, na-ebe akwa ma na-agbawa m obi[a]? N’ihi na adị m njikere, ọ bụghị naanị ka e kee m agbụ, kama ọbụna ịnwụ na Jerusalem n’ihi aha Onyenwe anyị Jizọs[b].”
  to: Mgbe ahụ Pọl zara, sị, “Gịnị ka unu na-eme, na-ebe akwa ma na-agbawa obi m[a]? N’ihi na adị m njikere ọ bụghị naanị ka e kee m agbụ, kama ka m nwụọkwa na Jerusalem n’ihi aha Onyenwe anyị Jizọs[b].”
  rationale: The revision removes an unnecessary supplied object, improves the parallel construction of Paul’s readiness to be bound and to die, and repairs footnote b so it offers a meaningful alternative while explicitly preserving and explaining the source’s “name” idiom. The theological title and the source ambiguity are retained without interpretive narrowing.
