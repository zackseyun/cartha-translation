  text: ἠκολούθει γὰρ τὸ πλῆθος τοῦ λαοῦ ⸀κράζοντες· Αἶρε αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/036.yaml
  text: For the crowd of the people was following[a], shouting, “Take him away!”
translation:
  language: ig
  text: N’ihi na ìgwè mmadụ ahụ nọ na-eso ya, na-eti mkpu, sị, “Wepụ ya!”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἠκολούθει
  choice: nọ na-eso ya
  rationale: Oge imperfect na-egosi omume gara n’ihu n’oge gara aga; okwu a na-egosipụta na ìgwè ahụ nọgidere na-eso ya.
- source_word: γὰρ
  choice: N’ihi na
  rationale: Na-edobe njikọ nkọwa nke amaokwu a na ihe e kwuru n’amaokwu bu ya ụzọ.
- source_word: τὸ πλῆθος τοῦ λαοῦ
  choice: ìgwè mmadụ ahụ
  rationale: Nke a bụ ụzọ Igbo nkịtị ma doo anya isi kwuo nnukwu ìgwè ndị mmadụ, n’etinyeghị echiche mkparị nke okwu dịka ‘ọgbaaghara mmadụ’ nwere ike ibute.
- source_word: κράζοντες
  choice: na-eti mkpu
  rationale: Na-egosi mkpu siri ike nke ha na-eti ka ha na-eso ya, n’asụsụ Igbo dị ndụ ma kwanyere ugwu.
- source_word: Αἶρε αὐτόν
  choice: Wepụnụ ya!
  rationale: N’ebe a αἴρω bụ iwu ka e wepụ onye ahụ, ọ bụghị nanị ka e bulie ya elu; ụdị ọtụtụ ‘-nụ’ dabara n’ìgwè ahụ a na-agwa.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị mfe nghọta ma dịkwa ùgwù. E jigidere usoro nkọwa nke γὰρ na mmegharị na-aga n’ihu nke imperfect. Enweghị nkọwa ụka agbakwunyere.
