  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τί οὖν ἐστιν; πάντως ⸀ἀκούσονται ὅτι ἐλήλυθας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/022.yaml
  text: What then is to be done? They will certainly hear that you have come[a].
translation:
  language: ig
  text: Gịnịzi ka a ga-eme? Ha ga-anụrịrị na ị bịala.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n'ụzọ nkịtị karị, “Gịnịzi ka ọ bụ?” Akpaokwu Grik a na-ajụ ihe e kwesịrị ime n'ihi ọnọdụ ahụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: τί οὖν ἐστιν;
  choice: Gịnịzi ka a ga-eme?
  rationale: N'ụzọ nkịtị, okwu Grik a bụ ‘Gịnịzi ka ọ bụ?’ Ma n'ọnọdụ a, ọ bụ ajụjụ banyere ihe kwesịrị ime n'ihi ọnọdụ dị ugbu a. Nsụgharị a na-egosipụta ọrụ okwu ahụ n'Igbo doro anya ma ghara ịgbasa ihe ọ pụtara gabiga ókè.
- source_word: πάντως
  choice: ga-anụrịrị
  rationale: Mgbakwunye ‘-rịrị’ na-egosi nnọọ na ihe ahụ ga-eme, kwekọọ na ike πάντως nwere n'amụma a.
- source_word: ἀκούσονται
  choice: Ha ga-anụ
  rationale: Ọ bụ ngwaa ọdịnihu nke pụtara ‘ha ga-anụ.’ Onye ‘ha’ na-anọchi anya ya adịghị n'okwu Grik n'onwe ya ma a ghọtara ya site n'ọnọdụ gbara amaokwu ahụ gburugburu.
- source_word: ὅτι
  choice: na
  rationale: ‘Na’ na-ewebata ọdịnaya nke ihe ha ga-anụ, ọ bụghị ihe kpatara ya.
- source_word: ἐλήλυθας
  choice: ị bịala
  rationale: Ụdị ngwaa zuru ezu na Grik na-egosi na onye ahụ abịawo ma nọkwa ebe ahụ ugbu a. ‘Ị bịala’ na-echekwa echiche ahụ n'Igbo karịa ‘ị bịara.’
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe nghọta ma nwee ugwu. ‘Gịnịzi’ na-ejikọta ajụjụ ahụ na ihe e kwuru tupu ya; ‘ga-anụrịrị’ na-egosipụta nkwenye siri ike nke πάντως.
