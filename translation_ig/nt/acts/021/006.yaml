  text: ⸂ἀπησπασάμεθα ἀλλήλους, καὶ⸃ ⸀ἐνέβημεν εἰς τὸ πλοῖον, ἐκεῖνοι δὲ ὑπέστρεψαν εἰς τὰ ἴδια.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/006.yaml
  text: After we had said farewell to one another[a], we boarded the ship[b], and they returned to their own homes.
translation:
  language: ig
  text: Mgbe anyị sịrịta ibe anyị ka e mesịa[a], anyị banyere n’ụgbọ mmiri, ha laghachiri n’ụlọ ha.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “anyị kelere ibe anyị ekele nkewa.” Okwu Grik ahụ pụrụ ịpụta ikele mmadụ mgbe a hụrụ ya ma ọ bụ mgbe a na-ekewa; n’ihi na ha na-apụ, ọ pụtara ịsị ibe ha ka e mesịa n’ebe a.
    reason: lexical_alternative
  - marker: b
    text: N’ụzọ nkịtị, “n’ihe ma ọ bụ n’ebe nke ha”; nke a bụ akpaokwu pụtara “n’ụlọ ha” ma ọ bụ “n’ebe nke ha.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπησπασάμεθα ἀλλήλους
  choice: anyị kwuchara ibe anyị ka ọ dị
  rationale: N’ọnọdụ a nke nkewa na ọpụpụ, okwu Grik a na-egosi na ha keleere ibe ha ekele nkewa. Akpaokwu Igbo a bụ ụzọ ebumpụta ụwa e si ekwu na ndị mmadụ sịrị ibe ha gaa nke ọma.
- source_word: ἐνέβημεν
  choice: anyị banyere
  rationale: Ngwaa a pụtara ịbanye ma ọ bụ ịrị n’ụgbọ; ‘anyị banyere n’ụgbọ mmiri’ bụ okwu Igbo doro anya ma dịkwa mfe.
- source_word: πλοῖον
  choice: ụgbọ mmiri
  rationale: Okwu Grik ahụ nwere ike ịpụta ụgbọ mmiri nta ma ọ bụ nnukwu ụgbọ mmiri; ‘ụgbọ mmiri’ na-edobe nghọta sara mbara ahụ n’Igbo.
- source_word: ὑπέστρεψαν
  choice: ha laghachiri
  rationale: Nke a na-enye kpọmkwem echiche nke ịlaghachi ebe mmadụ si bịa.
- source_word: εἰς τὰ ἴδια
  choice: n’ụlọ ha
  rationale: Akpaokwu Grik ahụ pụtara ihe ma ọ bụ ebe nke ha; n’ọnọdụ a, ọ na-ezo aka n’ụlọ ha ma ọ bụ ebe nke ha.
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị mfe ma nwee ugwu, mee nsụgharị ahụ. A họọrọ ‘kwuchara ibe anyị ka ọ dị’ maka ekele nkewa, ebe ‘n’ụlọ ha’ na-eme ka akpaokwu Grik doo anya n’enweghị ịgbakwunye nkọwa na-adịghị na ọnọdụ ahụ.
