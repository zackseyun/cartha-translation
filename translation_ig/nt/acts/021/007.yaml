  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἡμεῖς δὲ τὸν πλοῦν διανύσαντες ἀπὸ Τύρου κατηντήσαμεν εἰς Πτολεμαΐδα, καὶ ἀσπασάμενοι τοὺς ἀδελφοὺς ἐμείναμεν ἡμέραν μίαν παρ’ αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/007.yaml
  text: We[a], having finished the voyage from Tyre, arrived at Ptolemais, and after greeting the brothers, we stayed with them one day.
translation:
  language: ig
  text: Anyị, mgbe anyị mechara njem ụgbọ mmiri anyị si Taya, rutere Ptolemais. Mgbe anyị kelechara ụmụnna[a], anyị nọrọnyere ha otu ụbọchị.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịghọta ya dịka “ụmụnna nwoke na ụmụnna nwanyị.” Okwu Grik ahụ dị n’ụdị ọtụtụ nke nwoke, ma n’ebe a ọ pụrụ izo aka n’ebe ndị kwere ekwe n’ozuzu ha nọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἡμεῖς δὲ
  choice: anyị
  rationale: Nnọchiaha ahụ e kwuru hoo haa na-egosi ndị na-akọ akụkọ dịka isiokwu; δέ na-aga n’ihu n’akụkọ, nke usoro ahịrịokwu Igbo na-egosipụta nke ọma n’enweghị ịgbakwunye njikọ na-adịghị mkpa.
- source_word: τὸν πλοῦν διανύσαντες
  choice: rụchaa njem anyị n’oké osimiri
  rationale: διανύω pụtara imecha njem, ebe πλοῦς bụ njem mmiri; nsụgharị a na-eme ka o doo onye Igbo anya na ọ bụ njem ụgbọ mmiri e mechara.
- source_word: ἀπὸ Τύρου
  choice: si Taya
  rationale: ἀπό na-egosi ebe njem ahụ siri malite; “si Taya” bụ ụzọ Igbo si ekwu ya n’ụzọ nkịtị.
- source_word: κατηντήσαμεν εἰς Πτολεμαΐδα
  choice: anyị rutere Ptolemais
  rationale: καταντάω n’ihe gbasara njem pụtara iru ebe a na-aga, εἰς egosikwa ebe ahụ.
- source_word: ἀσπασάμενοι
  choice: Mgbe anyị kelechara
  rationale: ἀσπάζομαι pụtara ikele; usoro “mgbe ... kelechara” na-echekwa na e buru ụzọ kelee ha tupu ha anọrọ.
- source_word: τοὺς ἀδελφοὺς
  choice: ụmụnna
  rationale: “Ụmụnna” bụ okwu Igbo ebumpụta ụwa maka ndị e lere anya dịka ụmụnne ma ọ bụ ndị otu okwukwe; ọ naghị amanye nkọwa nwoke naanị, ya mere e tinyere nkọwa ala peeji maka obosara ojiji Grik.
- source_word: ἐμείναμεν ἡμέραν μίαν παρ’ αὐτοῖς
  choice: anyị na ha nọrọ otu ụbọchị
  rationale: μένω bụ ịnọgide ma ọ bụ ịnọ; παρά ya na dative na-egosi ịnọnyere ndị ahụ, ebe ἡμέραν μίαν na-egosi ogologo oge ahụ.
theological_decisions:
- issue: Otú e si sụgharịa ἀδελφοὺς n’etiti ndị Kraịst
  choice: ụmụnna
  alternative: ụmụnna nwoke; ndị kwere ekwe
  rationale: Aha Grik ahụ bụ ụdị ọtụtụ nke nwoke, ma n’ojiji Ndị Kraịst oge mbụ ọ pụrụ ịgụnye ndị kwere ekwe n’ozuzu ha, ma ndị nwoke ma ndị nwanyị. “Ụmụnna” na-asụ nke ọma n’Igbo ma na-echekwa okwu ezinụlọ ahụ; nkọwa ala peeji na-edebe nghọta nke ụdị Grik na obosara ọ pụrụ inwe.
translation_notes:
  register: 'E ji Standard Igbo dị ugbu a, nke dị ugwu ma dị mfe nghọta. E kewara ahịrịokwu ahụ ụzọ abụọ ka usoro omume doo anya, ma e debere usoro ihe mere: imecha njem mmiri, iru obodo ahụ, ikele ụmụnna, na ịnọnyere ha otu ụbọchị.'
