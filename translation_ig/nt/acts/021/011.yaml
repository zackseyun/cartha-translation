id: ACT.21.11
reference: Acts 21:11
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἐλθὼν πρὸς ἡμᾶς καὶ ἄρας τὴν ζώνην τοῦ Παύλου δήσας ⸀ἑαυτοῦ τοὺς πόδας καὶ τὰς χεῖρας εἶπεν· Τάδε λέγει τὸ πνεῦμα τὸ ἅγιον Τὸν ἄνδρα οὗ ἐστιν ἡ ζώνη αὕτη, οὕτως δήσουσιν ἐν Ἰερουσαλὴμ οἱ Ἰουδαῖοι καὶ παραδώσουσιν εἰς χεῖρας ἐθνῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/011.yaml
  text: 'And coming to us[a], and taking Paul’s belt, he bound his own feet and hands and said[b], “Thus says the Holy Spirit: ‘In this way the Jews in Jerusalem will bind the man to whom this belt belongs and will hand him over into the hands of the Gentiles.’”'
translation:
  language: ig
  text: 'Ọ bịakwutere anyị, were eriri Pọl yi n’ukwu kee onwe ya n’ụkwụ na n’aka, sị, “Otu a ka Mmụọ Nsọ kwuru: ‘Ọ bụ otu a ka ndị Juu nọ na Jeruselem ga-esi kee nwoke nke eriri a bụ nke ya, nyefee ya n’aka ndị mba ọzọ.’”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ζώνην
  choice: eriri ukwu
  rationale: N’ebe a, ζώνη bụ eriri ma ọ bụ ákwà a na-eke n’ukwu; “eriri ukwu” bụ okwu Igbo doro anya nke na-adabara ihe Pọl yi.
- source_word: δήσας ἑαυτοῦ τοὺς πόδας καὶ τὰς χεῖρας
  choice: kee ụkwụ na aka nke ya
  rationale: δέω pụtara ike ma ọ bụ ịtụgide ihe n’agbụ; “nke ya” na-egosi nke ọma na Agabọs kere onwe ya, ọ bụghị Pọl.
- source_word: Τάδε λέγει
  choice: Otu a ka ... kwuru
  rationale: Nke a na-echekwa usoro nkwupụta amụma dị nsọ ma bụrụkwa Igbo e ji eme ihe n’ụzọ ebumpụta ụwa.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: Mmụọ Nsọ
  rationale: Nke a bụ aha Igbo a na-ejikarị eme ihe maka τὸ πνεῦμα τὸ ἅγιον, n’asụsụ dị ugbu a ma dị ùgwù.
- source_word: Τὸν ἄνδρα
  choice: nwoke
  rationale: ἀνήρ n’ebe a na-ezo aka kpọmkwem n’otu nwoke toro eto, ya bụ Pọl; “nwoke” anaghị etinye nkọwa ọzọ na-adịghị na Grik.
- source_word: οὗ ἐστιν ἡ ζώνη αὕτη
  choice: nwe eriri ukwu a
  rationale: Nke a na-enye mmekọrịta onye nwe ihe nke οὗ n’Igbo dị nkenke ma doo anya.
- source_word: οὕτως
  choice: Ọ bụ otu a
  rationale: Okwu a na-ejikọta ihe atụ Agabọs mere na ihe a ga-eme Pọl, ma na-eme ka ike ngosi nke οὕτως pụta ìhè.
- source_word: οἱ Ἰουδαῖοι
  choice: ndị Juu
  rationale: Grik kwuru “ndị Juu” n’enweghị ime ka ọ bụrụ naanị ndị ndu; nsụgharị ahụ na-edebe oke okwu isi mmalite.
- source_word: παραδώσουσιν
  choice: ga-... nyefee ya
  rationale: παραδίδωμι n’ebe a pụtara inyefe mmadụ n’aka ndị ọzọ ma ọ bụ n’ike ha; “nyefee” bụ Igbo dị ugbu a ma dabara n’ọnọdụ a.
- source_word: εἰς χεῖρας ἐθνῶν
  choice: n’aka ndị mba ọzọ
  rationale: “N’aka” na-echekwa ihe atụ nke ịbụ onye e tinyere n’ike ndị ọzọ; “ndị mba ọzọ” n’ebe a bụ ndị na-abụghị ndị Juu.
theological_decisions:
- issue: Usoro okwu amụma dịka okwu sitere n’aka Mmụọ Nsọ
  choice: Otu a ka Mmụọ Nsọ kwuru
  alternative: Nke a bụ ihe Mmụọ Nsọ kwuru
  rationale: Nhọrọ a na-echekwa ụda nkwupụta ndị amụma nke Grik na ikike e nyere okwu ahụ, n’etinyeghị nkọwa ozizi ọzọ.
- issue: Onye ἑαυτοῦ na-ezo aka na ya
  choice: Agabọs kere ụkwụ na aka nke ya
  alternative: Agabọs kere ụkwụ na aka Pọl
  rationale: Nnochiaha ntụgharị ἑαυτοῦ na-ezo aka n’isiokwu nke participle, ya bụ Agabọs; nke a na-echekwa omume ihe ịrịba ama amụma ahụ.
translation_notes:
  register: Ejiri Standard Igbo dị ugbu a, doro anya ma dị ùgwù. E debere usoro ihe omume na nkwupụta amụma nke Grik, tinyere njikọ dị n’etiti ikekọta onwe Agabọs na amụma banyere Pọl. Enweghị akara nkọwa ala n’ihi na nkọwa ala Bekee e nyere adabaghị n’ebe akara ya dị na ederede, ebe ihe ndị ahụ nwere ike ịpụta nke ọma n’Igbo n’enweghị nkọwa ọzọ.
