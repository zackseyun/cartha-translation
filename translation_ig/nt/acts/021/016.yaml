id: ACT.21.16
reference: Acts 21:16
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: συνῆλθον δὲ καὶ τῶν μαθητῶν ἀπὸ Καισαρείας σὺν ἡμῖν, ἄγοντες παρ’ ᾧ ξενισθῶμεν Μνάσωνί τινι Κυπρίῳ, ἀρχαίῳ μαθητῇ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/016.yaml
  text: And some of the disciples from Caesarea also went with us, bringing us to Mnason, a certain Cypriot, an early disciple, with whom we were to stay.
translation:
  language: ig
  text: Ụfọdụ n’ime ndị na-eso ụzọ si Sesaria sokwa anyị gaa, na-eduru anyị gaa n’ebe otu nwoke a na-akpọ Mnason, onye Saịprọs bụ́ onye na-eso ụzọ kemgbe ogologo oge,[a] nọ, ka anyị nọrọ n’ụlọ ya dịka ndị ọbịa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “onye na-eso ụzọ kemgbe oge mbụ.” Okwu Grik ahụ pụrụ ịpụta na Mnason anọwo na-eso ụzọ ogologo oge, ma ọ bụ na ọ malitere iso ụzọ n’oge mbụ.
    reason: lexical_alternative
  - marker: b
    text: 'A pụkwara ịghọta nkebi a dịka: “ha kpọrọ otu nwoke a na-akpọ Mnason ... onye anyị ga-anọ n’ụlọ ya soro anyị.” Nhazi okwu Grik ahụ na-ekwe nghọta abụọ ndị a, ha abụọ metụtara Mnason na ebe obibi ndị ọbịa.'
    reason: syntactical_alternative
lexical_decisions:
- source_word: συνῆλθον ... σὺν ἡμῖν
  choice: sokwa anyị gaa
  rationale: N’ọnọdụ njem a, ngwakọta okwu ndị a pụtara iso ndị ọzọ gaa; nsụgharị a bụ Igbo nkịtị ma doo anya.
- source_word: τῶν μαθητῶν
  choice: ụfọdụ n’ime ndị na-eso ụzọ
  rationale: Ụdị genitive a na-egosi akụkụ nke ìgwè ahụ, ya bụ, ọ bụghị ndị na-eso ụzọ niile.
- source_word: ἀπὸ Καισαρείας
  choice: si Sesaria
  rationale: Ọ na-egosi ebe ndị ahụ si bịa.
- source_word: ἄγοντες παρ’ ᾧ ξενισθῶμεν
  choice: Ha duuru anyị gaa n’ụlọ ... bụ́ onye anyị ga-anọ n’ụlọ ya
  rationale: Nke a na-eme ka nzube njem ahụ—ịga n’ebe onye ga-anabata ha ka ha biri dị ka ndị ọbịa—pụta nke ọma n’Igbo, n’agbanyeghị na nhazi okwu Grik nwere ike ikwe ka e jikọta nkebi ndị ahụ n’ụzọ dịtụ iche.
- source_word: Μνάσωνί τινι
  choice: Mnason
  rationale: τινι na-ewebata onye a na-ekwubeghị banyere ya; n’Igbo, aha ahụ n’onwe ya na-arụ ọrụ a nke ọma, ebe ‘otu onye a na-akpọ’ ga-adị arọ n’ahịrịokwu a.
- source_word: Κυπρίῳ
  choice: onye Saịprọs
  rationale: Ọ na-akọwa Mnason dị ka onye si n’agwaetiti Saịprọs.
- source_word: ἀρχαίῳ μαθητῇ
  choice: onye so ụzọ kemgbe oge mbụ
  rationale: 'Nhọrọ a na-echekwa echiche abụọ jikọrọ ọnụ: na ọ malitere iso ụzọ n’oge mbụ nakwa na ọ bụ onye so ụzọ ogologo oge, na-ekwughị na ọ bụ otu n’ime ndị mbụ kpọmkwem.'
theological_decisions:
- issue: Ihe ἀρχαίῳ μαθητῇ pụtara
  choice: onye so ụzọ kemgbe oge mbụ
  alternative: onye bụla onye na-eso ụzọ kemgbe ogologo oge; otu n’ime ndị mbụ soro ụzọ
  rationale: Okwu Grik ahụ nwere ike ịrụtụ aka n’oge mbụ ọ malitere ịbụ onye na-eso ụzọ ma ọ bụ n’ogologo oge ọ nọworo ya. Nsụgharị a echekwala nghọta oge ahụ n’ekwughị ihe karịrị ihe odide ahụ kwuru.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. E kewara ahịrịokwu Grik ahụ ụzọ abụọ iji mee ka ọ na-aga were were n’Igbo, ma e chekwara njikọ dị n’etiti ndị si Sesaria iso ha gaa na iduru ha n’ebe ha ga-anọ. Akara nkọwa [a] dị n’isiokwu ahụ.
