  text: Ὡς δὲ ἔμελλον αἱ ἑπτὰ ἡμέραι συντελεῖσθαι, οἱ ἀπὸ τῆς Ἀσίας Ἰουδαῖοι θεασάμενοι αὐτὸν ἐν τῷ ἱερῷ συνέχεον πάντα τὸν ὄχλον καὶ ἐπέβαλον ⸂ἐπ’ αὐτὸν τὰς χεῖρας⸃,
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/027.yaml
  text: As the seven days were about to be completed[a], the Jews from Asia, seeing him in the temple, stirred up the whole crowd and laid hands on him[c][b],
translation:
  language: ig
  text: Mgbe ụbọchị asaa ahụ fọrọ nke nta ka ha gwụ, ndị Juu si n’ógbè Eshia[a], mgbe ha hụrụ Pọl n’ogige ụlọ nsọ ahụ[b], kpaliri igwe mmadụ ahụ dum ma jide ya n’ike.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Eshia” n’ebe a bụ ógbè ọchịchị Rom n’oge ahụ, ọ bụghị kọntinent Eshia dum.
    reason: cultural_note
  - marker: b
    text: Okwu Grik a na-ezo aka n’ogige na gburugburu ụlọ nsọ ahụ dum, ọ bụghị naanị ebe nsọ dị n’ime ụlọ ahụ.
    reason: cultural_note
  - marker: c
    text: 'N’ụzọ mkpụrụokwu si dị: “tukwasị ya aka”; nke a bụ akpaalaokwu pụtara ijide mmadụ n’ike.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὡς δὲ ἔμελλον αἱ ἑπτὰ ἡμέραι συντελεῖσθαι
  choice: Mgbe ụbọchị asaa ahụ na-achọ ịgwụ
  rationale: Nke a na-egosipụta na oge ụbọchị asaa ahụ fọrọ nke nta ka o ruo ná njedebe, ma ghara ịkọwa ihe ụbọchị ndị ahụ bụ karịa ihe Grik kwuru.
- source_word: οἱ ἀπὸ τῆς Ἀσίας Ἰουδαῖοι
  choice: ndị Juu si n’ógbè Eshia
  rationale: “Ógbè Eshia” na-eme ka o doo anya na okwu a bụ maka ógbè Rom oge ahụ, ọ bụghị kọntinent Eshia niile nke oge a.
- source_word: θεασάμενοι αὐτὸν
  choice: hụrụ Pọl
  rationale: A kpọghachiri onye nnọchiaha ahụ dị ka “Pọl” ka amaokwu ahụ doo anya n’Igbo; participle ahụ jikọtara ịhụ ya na omume sochirinụ.
- source_word: ἐν τῷ ἱερῷ
  choice: n’ogige ụlọnsọ ukwu ahụ
  rationale: ἱερόν na-ezo aka n’ogige na gburugburu ụlọ nsọ dum, ọ bụghị naanị ebe nsọ dị n’ime ya. “Ogige ụlọnsọ ukwu” na-enye nghọta ahụ n’Igbo nkịtị.
- source_word: συνέχεον πάντα τὸν ὄχλον
  choice: kpalie igwe mmadụ ahụ dum n’ọgba aghara
  rationale: συγχέω nwere ike ịpụta ịkpalite mmadụ ma ọ bụ ịtụ ha n’ọgba aghara. Nhọrọ a na-edobe ma mkpali ha mere ma ọgba aghara si na ya pụta.
- source_word: ἐπέβαλον ἐπ’ αὐτὸν τὰς χεῖρας
  choice: jide ya n’ike
  rationale: Akpaalaokwu Grik ahụ pụtara ijide mmadụ n’ike. Nsụgharị a bụ nke doro onye Igbo nke oge a anya ma na-egosi omume ike dị n’okwu ahụ.
theological_decisions: []
translation_notes:
  register: Ejiri Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. “Ụlọnsọ ukwu” na-ekewa ụlọ nsọ dị na Jerusalem na ụlọ ofufe nkịtị; “igwe mmadụ” bụ okwu nkịtị maka ìgwè mmadụ buru ibu. E debere nghọta abụọ dị na συνέχεον site n’okwu “kpalie ... n’ọgba aghara.”
