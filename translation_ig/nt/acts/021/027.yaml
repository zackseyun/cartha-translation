revisions:
- from: Mgbe ụbọchị asaa ahụ na-achọ ịgwụ, ndị Juu si n’ógbè Eshia[a] hụrụ Pọl n’ogige ụlọnsọ ukwu ahụ[b], kpalie igwe mmadụ ahụ dum n’ọgba aghara, ma jide ya n’ike.[c]
  to: Mgbe ụbọchị asaa ahụ fọrọ nke nta ka ha gwụ, ndị Juu si n’ógbè Eshia[a], mgbe ha hụrụ Pọl n’ogige ụlọ nsọ ahụ[b], kpaliri igwe mmadụ ahụ dum ma jide ya n’ike.[c]
  rationale: The revision uses an unambiguous past narrative sequence, renders the imminence of the seven days’ completion naturally, and gives συνέχεον a broad, source-faithful Igbo rendering without unnecessarily resolving its lexical nuance. It also uses the more natural term “ụlọ nsọ” while retaining “ogige” and the note to distinguish the precincts from the inner sanctuary.
  reviewer_model: gpt-5.6-terra
