- from: O nwere ụmụ ya nwanyị anọ na-alụbeghị di[a], ndị na-ebu amụma.
  to: O nwere ụmụ ya nwanyị anọ ndị na-amaghị nwoke[a], ndị na-ebu amụma.
  rationale: The revision restores the primary lexical sense of παρθένοι while preserving the draft’s natural Igbo syntax and its noninterpretive rendering of the daughters’ prophetic activity. The footnote records the socially contextual alternative without making it the sole sense of the text.
