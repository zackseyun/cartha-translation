  text: τούτῳ δὲ ἦσαν θυγατέρες ⸂τέσσαρες παρθένοι⸃ προφητεύουσαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/009.yaml
  text: He had four unmarried daughters who were prophesying.
translation:
  language: ig
  text: O nwere ụmụ ya nwanyị anọ ndị na-amaghị nwoke[a], ndị na-ebu amụma.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị na-alụbeghị di.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τούτῳ
  choice: O
  rationale: Nnọchiaha a na-ezo aka na Filip onye a kpọrọ aha n'amaokwu ndị gbara ya gburugburu; Igbo nkịtị na-eji “O” mee ya isiokwu.
- source_word: δὲ
  choice: —
  rationale: Ọ bụ njikọ dị nro na-aga n'ihu n'akụkọ ahụ; usoro ahịrịokwu Igbo na-egosi njikọ ahụ nke ọma n'enweghị okwu ọzọ.
- source_word: ἦσαν
  choice: nwere
  rationale: 'Ihe owuwu Grik nke pụtara n''ụzọ nkịtị ‘ụmụ nwanyị dịịrị ya’ na-ada nke ọma n''Igbo dịka ihe mmadụ nwere: “o nwere ụmụ ya nwanyị.”'
- source_word: θυγατέρες
  choice: ụmụ ya nwanyị
  rationale: Nke a na-egosi kpọmkwem na ha bụ ụmụ nwanyị Filip, ọ bụghị naanị ụmụ agbọghọ nọ ya nso.
- source_word: τέσσαρες
  choice: anọ
  rationale: Ọ bụ ọnụọgụgụ kpọmkwem nke na-akọwa ụmụ ya nwanyị.
- source_word: παρθένοι
  choice: na-alụbeghị di
  rationale: N'okwu a, ọ na-egosi ụmụ nwanyị na-alụbeghị di, ma okwu Grik nwekwara ihe ọ pụtara kpọmkwem bụ ndị na-amaghị nwoke; e debere nke ahụ n'ala peeji.
- source_word: προφητεύουσαι
  choice: ndị na-ebu amụma
  rationale: Nkebiokwu a na-akọwa ụmụ nwanyị ahụ dịka ndị ọrụ ha bụ ibu amụma; “na-ebu amụma” na-egosikwa omume na-aga n'ihu ma ọ bụ nke a maara ha ji eme.
theological_decisions:
- issue: Otu e si sụgharịa παρθένοι n'ebe ụmụ nwanyị na-ebu amụma nọ
  choice: na-alụbeghị di
  alternative: na-amaghị nwoke
  rationale: Amaokwu ahụ na-ekwu ma ọnọdụ alụmdi na nwunye ha ma ọrụ ibu amụma ha, ma ọ naghị akọwa njikọ nkà mmụta okpukpe dị n'etiti ha. Nhọrọ a na-asụ Igbo nke ọma ma na-ezere itinye ozizi e mechara nwee banyere ịnọ n'amaghị nwoke; ala peeji na-echekwa ihe okwu Grik pụtara kpọmkwem.
translation_notes:
  register: Asụsụ Igbo Izugbe dị mfe ma dị nsọ. “Ibu amụma” bụ okwu a na-aghọta nke ọma n'okwu Akwụkwọ Nsọ; e zere ịkọwa ụdị amụma ahụ ma ọ bụ ihe ọ pụtara n'ọrụ ụmụ nwanyị.
