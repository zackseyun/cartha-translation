source:
  edition: SBLGNT
  text: κατηχήθησαν δὲ περὶ σοῦ ὅτι ἀποστασίαν διδάσκεις ἀπὸ Μωϋσέως τοὺς κατὰ τὰ ἔθνη πάντας Ἰουδαίους, λέγων μὴ περιτέμνειν αὐτοὺς τὰ τέκνα μηδὲ τοῖς ἔθεσιν περιπατεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/021.yaml
  text: But they have been informed about you that you are teaching all the Jews among the Gentiles to forsake Moses[c][b][a], telling them not to circumcise their children nor to walk according to the customs.
translation:
  language: ig
  text: Ma a gwala ha banyere gị na ị na-akụziri ndị Juu niile bi n’etiti mba ndị ọzọ ka ha hapụ Mosis[a][b], na-agwa ha ka ha ghara ibi ụmụ ha úgwù, ka ha gharakwa ịgbaso omenala.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, ‘na ị na-akụzi ịhapụ ụzọ Mosis.’ Okwu Grik bụ ἀποστασία, nke pụtara ịhapụ ma ọ bụ ịgbahapụ ihe mmadụ na-agbasobu.
    reason: lexical_alternative
  - marker: b
    text: ‘Mosis’ n’ebe a na-anọchi anya iwu Mosis na omenala ndị Juu ketara n’aka nna nna ha.
    reason: cultural_note
  - marker: c
    text: A pụkwara ịsụgharị ya, ‘ka ha gharakwa ibi ndụ dịka omenala si dị.’
    reason: lexical_alternative
lexical_decisions:
- source_word: κατηχήθησαν
  choice: a gwala ha
  rationale: Ọdịdị nnara a na-egosi na e nyela ha akụkọ banyere Pọl; ‘a gwala ha’ bụ Igbo nkịtị ma na-echekwa na ihe a bụ akụkọ ha natara.
- source_word: ἀποστασίαν ... ἀπὸ Μωϋσέως
  choice: ka ha hapụ Mosis
  rationale: Nke a na-egosipụta echiche nke ịgbahapụ ma ọ bụ isi n’ụzọ Mosis pụọ, n’enweghị ime ‘apostasy’ ka ọ bụrụ okwu nkà mmụta okpukpe pụrụ iche.
- source_word: τοὺς κατὰ τὰ ἔθνη πάντας Ἰουδαίους
  choice: ndị Juu niile bi n’etiti ndị mba ọzọ
  rationale: Ọ na-egosi ndị Juu bi n’etiti mba dị iche iche, ma na-ada nke ọma n’Igbo.
- source_word: λέγων
  choice: na-agwa ha
  rationale: Nkebi a kọwara ihe e boro Pọl na ọ na-akụzi, ya mere ‘na-agwa ha’ jikọtara ya nke ọma na ndị Juu ahụ.
- source_word: μὴ περιτέμνειν αὐτοὺς τὰ τέκνα
  choice: ka ha ghara ibi ụmụ ha úgwù
  rationale: ‘Ibi úgwù’ bụ ụzọ Igbo doro anya isi kwuo ibi ugwu; ‘ụmụ ha’ na-echekwa τέκνα n’ebughị ụzọ mee ya ‘ụmụ nwoke’.
- source_word: μηδὲ τοῖς ἔθεσιν περιπατεῖν
  choice: ka ha gharakwa ibi ndụ dịka omenala ndị ahụ si dị
  rationale: περιπατεῖν bụ ihe atụ maka omume ndụ. ‘Ibi ndụ’ bụ Igbo eke ma na-enye ihe okwu Grik ahụ pụtara n’ebe a; ἔθεσιν bụ omenala ndị Juu e ketara n’aka nna nna.
theological_decisions:
- issue: Ụdị ebubo e boro Pọl banyere Mosis
  choice: 'E dere ya dịka akụkọ banyere ebubo ahụ: ‘ị na-akụziri ... ka ha hapụ Mosis.’'
  alternative: ‘ị na-akụzi nnupụisi megide Mosis’ ma ọ bụ ‘ka ha gbahapụ iwu Mosis.’
  rationale: Amaokwu ahụ na-akọ ihe a gwara ndị ọzọ banyere Pọl; ọ naghị ekwu na ebubo ahụ bụ eziokwu. Nsụgharị ahụ na-echekwa ike ebubo ahụ n’etinyeghị mkpebi nkà mmụta okpukpe nke ederede ahụ ekwughị.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. ‘Hapụ Mosis’ na-echekwa metonimi nke Grik, ebe nkọwa ala peeji na-eme ka njikọ ya na iwu na omenala ndị Juu doo anya. E ji ‘ibi ndụ’ kama ịsụgharị περιπατεῖν n’ụzọ nkịtị dịka ‘ije ije,’ n’ihi na nke ahụ bụ okwu Igbo eke maka omume mmadụ.
