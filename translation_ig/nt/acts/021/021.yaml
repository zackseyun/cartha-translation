revisions:
- from: Ma a gwala ha banyere gị na ị na-akụziri ndị Juu niile bi n’etiti ndị mba ọzọ ka ha hapụ Mosis[a][b], na-agwa ha ka ha ghara ibi ụmụ ha úgwù, ka ha gharakwa ibi ndụ dịka omenala ndị ahụ si dị.[c]
  to: Ma a gwala ha banyere gị na ị na-akụziri ndị Juu niile bi n’etiti mba ndị ọzọ ka ha hapụ Mosis[a][b], na-agwa ha ka ha ghara ibi ụmụ ha úgwù, ka ha gharakwa ịgbaso omenala.[c]
  rationale: The revision removes an unrepresented demonstrative from the final clause and uses ‘ịgbaso omenala’ for living in accordance with customary practices. It retains the reported nature of the accusation, the metonymic reference to Moses, and the source’s broad term ‘children.’
