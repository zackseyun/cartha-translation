translation_notes:
  register: Standard Igbo; asụsụ dị ugwu ma dị mfe nghọta. E ji “nọ na-eti mkpu” gosipụta omume na-aga n’ihu, jiri “ọgba aghara” gosipụta mkpọtụ na enweghị usoro, ma zere okwu ụka pụrụ iche.
