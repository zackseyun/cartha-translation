base_translation:
  language: en
  yaml_path: translation/nt/acts/021/034.yaml
  text: But some in the crowd were shouting one thing[a], and others another. Since he was not able to learn the facts because of the uproar[b], he ordered him to be brought into the barracks.
translation:
  language: ig
  text: Ma ụfọdụ n’ime ìgwè mmadụ ahụ nọ na-eti mkpu otu ihe, ndị ọzọkwa na-eti mkpu ihe ọzọ. Ebe ọ bụ na ọ pụghị ịchọpụta ihe doro anya[a] n’ihi ọgba aghara ahụ, o nyere iwu ka e duru ya gaa n’ụlọ ndị agha[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ihe bụ eziokwu banyere okwu ahụ” ma ọ bụ “ihe e ji n’aka.”
    reason: lexical_alternative
  - marker: b
    text: “Ụlọ ndị agha” na-ezo aka n’ebe ndị agha Rom bi ma na-arụ ọrụ, ikekwe n’ime ebe e wusiri ike nke dị n’akụkụ ụlọ nsọ ahụ.
    reason: cultural_note
lexical_decisions:
- source_word: ἄλλοι δὲ ἄλλο τι ἐπεφώνουν
  choice: ụfọdụ ... nọ na-eti mkpu na-ekwu otu ihe, ndị ọzọkwa na-ekwu ihe ọzọ
  rationale: Nke a na-egosipụta ọdịiche dị n’etiti ihe ìgwè abụọ ahụ na-ekwu, ma na-edobekwa omume na-aga n’ihu nke imperfect ἐπεφώνουν.
- source_word: ἐν τῷ ὄχλῳ
  choice: ndị nọ n’ìgwè mmadụ ahụ
  rationale: “Ìgwè mmadụ” bụ okwu Igbo doro anya ma na-anọpụ iche; ọ naghị etinye echiche nke ìgwè na-eme ihe ike karịa ihe Grik kwuru.
- source_word: μὴ δυναμένου δὲ αὐτοῦ γνῶναι
  choice: Ebe ọ bụ na ... ekweghị ka ọ mata
  rationale: Usoro a na-egosipụta ihe kpatara iwu ahụ n’Igbo eke, ebe γνῶναι pụtara ịchọpụta ma ọ bụ ịmata ozi a pụrụ ịdabere na ya.
- source_word: τὸ ἀσφαλές
  choice: ihe bụ eziokwu
  rationale: Nke a na-egosipụta ihe e ji n’aka ma ọ bụ akụkọ a pụrụ ịdabere na ya, na-ahapụghị echiche ahụ ka ọ bụrụ naanị “ozi” n’ozuzu.
- source_word: διὰ τὸν θόρυβον
  choice: n’ihi ọgba aghara ahụ
  rationale: θόρυβος n’ebe a bụ mkpọtụ na ọgba aghara nke ìgwè mmadụ, ọ bụghị naanị ụda olu.
- source_word: ἐκέλευσεν ἄγεσθαι αὐτὸν
  choice: o nyere iwu ka a kpọbata ya
  rationale: Ọ na-echekwa iwu doro anya nke aorist ahụ na ụdị passive nke infinitive ahụ, n’etinyeghị ndị mere ya n’ime ederede.
- source_word: εἰς τὴν παρεμβολήν
  choice: n’ogige ndị agha
  rationale: N’ọnọdụ a, παρεμβολή na-ezo aka n’ebe ndị agha Rom bi ma na-arụ ọrụ; “ogige ndị agha” bụ okwu ndị na-agụ Igbo ga-aghọta n’enweghị echiche na ọ bụ naanị ụlọ mkpọrọ.
