id: ACT.21.26
reference: Acts 21:26
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τότε ὁ Παῦλος παραλαβὼν τοὺς ἄνδρας τῇ ἐχομένῃ ἡμέρᾳ σὺν αὐτοῖς ἁγνισθεὶς εἰσῄει εἰς τὸ ἱερόν, διαγγέλλων τὴν ἐκπλήρωσιν τῶν ἡμερῶν τοῦ ἁγνισμοῦ ἕως οὗ προσηνέχθη ὑπὲρ ἑνὸς ἑκάστου αὐτῶν ἡ προσφορά.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/026.yaml
  text: Then Paul took the men[a], and on the next day, having purified himself with them, he entered the temple, giving notice of the completion of the days of purification[b], until the offering was presented for each one of them.
translation:
  language: ig
  text: Mgbe ahụ, Pọl kpọọrọ ndị ikom ahụ; n’echi ya, mgbe ya na ha mechara emume nsacha, ọ banyere n’ụlọ nsọ[a], na-ekwupụta na ụbọchị nsacha ahụ ga-ezu, ruo mgbe e wetara onyinye maka onye ọ bụla n’ime ha[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Okwu Grik ἱερόν na-ezo aka n’ogige ụlọ nsọ dum, ọ bụghị naanị ime ụlọ nsọ dị nsọ.
    reason: lexical_alternative
  - marker: b
    text: “Onyinye” nwekwara ike ịbụ “àjà” n’ọnọdụ emume ụlọ nsọ a.
    reason: lexical_alternative
lexical_decisions:
- source_word: παραλαβὼν
  choice: kpọọrọ
  rationale: Ọ na-egosi na Pọl kpọọrọ ndị ikom ahụ soro ya; okwu a bụ nke nkịtị ma doo anya n’Igbo.
- source_word: τῇ ἐχομένῃ ἡμέρᾳ
  choice: N’echi ya
  rationale: Nke a bụ ụzọ Igbo nkịtị si ekwu ụbọchị sochirinụ.
- source_word: σὺν αὐτοῖς ἁγνισθεὶς
  choice: mgbe ya na ha sachara onwe ha dịka iwu si dị
  rationale: Ọ na-egosi na Pọl sonyere ha n’emume nsacha okpukpe, ma nkọwa ‘dịka iwu si dị’ na-eme ka o doo anya na ọ bụghị ịsa ahụ nkịtị.
- source_word: εἰσῄει
  choice: ọ banyere
  rationale: Ọ bụ ezie na imperfect nwere ike igosi omume na-aga n’ihu ma ọ bụ a na-eme ugboro ugboro, simple past bụ ụzọ Igbo kachasị eke n’akụkọ a, na-enweghị imechi ohere ahụ n’ụzọ nkọwa ozizi.
- source_word: τὸ ἱερόν
  choice: ogige ụlọnsọ ukwu
  rationale: ἱερόν na-ezo aka n’ụlọ nsọ dum na ogige ya, ọ bụghị kpọmkwem ime ụlọ nsọ (ναός).
- source_word: διαγγέλλων
  choice: gwa ndị na-elekọta ya
  rationale: N’ọnọdụ a, ọ bụ ime ka ndị metụtara usoro ụlọ nsọ mara n’ụzọ gọọmenti; e tinyere onye a gwara n’ụzọ a na-aghọta n’Igbo, ọ bụ ezie na Greek ekwughị ya kpọmkwem.
- source_word: τὴν ἐκπλήρωσιν τῶν ἡμερῶν τοῦ ἁγνισμοῦ
  choice: mgbe ụbọchị nsacha ahụ ga-agwụ
  rationale: Nke a na-enye n’Igbo eke isi okwu banyere iru ngwụcha oge nsacha e nyere n’iwu.
- source_word: ἕως οὗ
  choice: ruo mgbe
  rationale: Ọ na-egosi njedebe oge ahụ n’ụzọ doro anya.
- source_word: προσηνέχθη
  choice: e chụụrụ ... aja
  rationale: N’ọnọdụ àjà, passive a pụtara na e wetara ma ọ bụ chụọ onyinye ahụ; ‘chụọ aja’ bụ okwu Igbo eke maka omume a.
- source_word: ὑπὲρ ἑνὸς ἑκάστου αὐτῶν
  choice: onye ọ bụla n’ime ha
  rationale: Ọ na-edobe echiche na e mere onyinye ahụ maka onye nke ọ bụla n’ime ndị ikom ahụ.
- source_word: ἡ προσφορά
  choice: aja
  rationale: ‘Aja’ bụ okwu Igbo doro anya n’ọnọdụ ofufe ụlọ nsọ, ma ndetu na-egosi na Greek bụ okwu sara mbara karịa ‘sacrifice’ naanị.
theological_decisions:
- issue: Ihe omume Pọl n’emume nsacha ndị Juu
  choice: A kọwara ya dịka ihe mere n’akụkọ, na-enweghị ịsị na ọ kwadoro ma ọ bụ jụ ịdịgide nke emume ndị ahụ nye Ndị Kraịst.
  alternative: Ịsụgharị ya n’ụzọ ga-egosi na Pọl kwadoro ma ọ bụ katọọ Iwu Mozis na usoro ụlọ nsọ.
  rationale: Amaokwu ahụ na-akọ ihe Pọl mere; ọ naghị edozi esemokwu ozizi gbasara iwu, ọgbụgba ndụ, ma ọ bụ emume ụlọ nsọ.
- issue: Aspect nke εἰσῄει
  choice: Jiri ‘ọ banyere’ maka Igbo eke.
  alternative: ‘ọ nọ na-abanye’ ma ọ bụ okwu ga-egosi omume na-aga n’ihu/ugboro ugboro.
  rationale: Imperfect Greek nwere ezigbo mgbanwe aspect, ma n’Igbo ‘ọ nọ na-abanye’ nwere ike ịdị ka ihe omume kwụsịrị n’etiti. Simple past na-eburu akụkọ ahụ nke ọma n’enweghị itinye nkọwa na-adịghị n’amaokwu.
- issue: Mmekọrịta ἕως οὗ na nkebi bu ya ụzọ
  choice: Debe ‘ruo mgbe’ ka ọ na-ejikọta oge nsacha na iweta/chụ àjà.
  alternative: Ịkọwa ya dịka Pọl nọgidere na-abanye ụlọ nsọ ugboro ugboro ruo ụbọchị àjà ahụ.
  rationale: Nhazi ahịrịokwu Greek nwere ụfọdụ mgbagwoju anya; nsụgharị a na-edobe njikọ oge ahụ n’enweghị ime ka otu nkọwa bụrụ naanị nke kwere omume.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E jiri ‘ụlọnsọ ukwu’ maka temple, ‘nsacha dịka iwu si dị’ maka ritual purification, ma zere okwu ụka nke otu denomination. Akara ndetu [a] na [b] dị n’ederede isi.
