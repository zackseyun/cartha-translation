  text: ἐπιτρέψαντος δὲ αὐτοῦ ὁ Παῦλος ἑστὼς ἐπὶ τῶν ἀναβαθμῶν κατέσεισε τῇ χειρὶ τῷ λαῷ, πολλῆς δὲ σιγῆς γενομένης ⸀προσεφώνησεν τῇ Ἑβραΐδι διαλέκτῳ λέγων
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/040.yaml
  text: 'And when he had given permission[a], Paul, standing on the steps, motioned with his hand to the people. And when a great silence had come, he addressed them in the Hebrew language, saying:'
translation:
  language: ig
  text: 'Mgbe ọchịagha ahụ nyere ya ikike, Pọl guzoro n’elu steepụ ahụ, were aka ya mee ndị mmadụ ihe ịrịba ama. Mgbe nnukwu juu dara, ọ gwara ha okwu n’asụsụ Hibru[a], sị:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma eleghị anya, “n’asụsụ Aramaik.” Grik kwuru, “n’asụsụ/olumba Hibru,” ma n’ọnọdụ a, o nwere ike izo aka n’asụsụ Semitik nke a na-asụ n’ógbè ahụ, nke a na-akpọkarị Aramaik.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιτρέψαντος δὲ αὐτοῦ
  choice: Mgbe ọchịagha ahụ nyere ya ikike
  rationale: Nkebi a bụ genitive absolute nke na-ezo aka n’ọchịagha ahụ a kpọtụrụ aha n’amaokwu ndị bu ụzọ. Ịkpọ ya ‘ọchịagha ahụ’ na-eme ka onye nnọchiaha Grik doo anya n’Igbo n’enweghị ịgbanwe ihe ọ pụtara.
- source_word: ἑστὼς ἐπὶ τῶν ἀναβαθμῶν
  choice: Pọl guzoro n’elu ihe mgbago ahụ
  rationale: Perfect participle a na-akọ ebe Pọl nọ. ‘Ihe mgbago’ bụ okwu Igbo dị mfe nke nwere ike ịpụta steepụ ma ọ bụ ụzọ mgbago ahụ na-eduga n’ogige ndị agha.
- source_word: κατέσεισε τῇ χειρὶ τῷ λαῷ
  choice: were aka ya mee ndị mmadụ ihe ịrịba ama
  rationale: Nkebi a na-egosi na Pọl ji aka nye ndị mmadụ ihe ịrịba ama, ikekwe ka ha daa jụụ. Nsụgharị ahụ na-edebe omume ahụ n’ebughị nzube a na-eche n’ime isi ederede.
- source_word: τῷ λαῷ
  choice: ndị mmadụ
  rationale: Nke a na-anọchi anya λαός n'ụzọ kpọmkwem ma kwekọọ na ìgwè mmadụ gbakọrọ n’ebe ahụ.
- source_word: πολλῆς δὲ σιγῆς γενομένης
  choice: Mgbe ha niile dara nnọọ jụụ
  rationale: Nke a na-egosipụta mmalite nke nnukwu juu ahụ n’Igbo eke. ‘Ha niile’ na-eme ka ọnọdụ ìgwè mmadụ doo anya, ebe ‘nnọọ jụụ’ na-eburu ike πολλῆς.
- source_word: προσεφώνησεν
  choice: ọ gwara ha okwu
  rationale: Ngwaa a pụtara ịgwa ndị mmadụ okwu n’ihu ọha. Nkebi Igbo a bụ nke eke ma doo anya.
- source_word: τῇ Ἑβραΐδι διαλέκτῳ
  choice: n’asụsụ Hibru[a]
  rationale: Isi ederede na-edebe okwu Grik ahụ n’ụzọ pụtara ‘asụsụ/olumba Hibru,’ ebe nkọwa ala peeji na-egosi na n’ọnọdụ a ọ pụrụ izo aka n’Aramaik.
- source_word: λέγων
  choice: 'sị:'
  rationale: Nke a bụ ụzọ Igbo dị nkenke ma bụrụkwa nke eke iji webata okwu kpọmkwem ga-esochi.
theological_decisions: []
translation_notes:
  register: E ji Igbo ọkọlọtọ nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ ahịrịokwu ndị na-ada ka Igbo eke, ma e debere mgbagwoju anya dị n’okwu ‘asụsụ Hibru’ site n’itinye nkọwa [a].
