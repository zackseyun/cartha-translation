base_translation:
  language: en
  yaml_path: translation/nt/acts/021/017.yaml
  text: When we arrived in Jerusalem[a], the brothers welcomed us gladly.
translation:
  language: ig
  text: Mgbe anyị rutere Jeruselem, ụmụnna[a] ji ọṅụ nabata anyị.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ụmụnna nwoke na ụmụnna nwanyị.” Okwu Grik ahụ bụ “ụmụnna,” nke nwekwara ike izo aka n’ìgwè ndị kwere ekwe n’ozuzu ha.
    reason: lexical_alternative
lexical_decisions:
- source_word: Γενομένων δὲ ἡμῶν
  choice: Mgbe anyị rutere
  rationale: Nkebiokwu genitive absolute a na-egosi oge na ọnọdụ nke nrute; ntụgharị a bụ Igbo eke ma na-echekwa echiche ahụ.
- source_word: εἰς Ἱεροσόλυμα
  choice: Jeruselem
  rationale: εἰς na-egosi ebe ha na-aga; mgbe e jiri ‘rutere’ mee ihe n’Igbo, ịkpọ aha ebe ahụ ozugbo bụ usoro okwu eke.
- source_word: ἀσμένως
  choice: ji ọṅụ
  rationale: Nke a na-egosi obi ụtọ na ịnụ ọkụ n’obi e ji nabata mmadụ; ‘ji ọṅụ’ na-enye echiche ahụ n’Igbo doro anya.
- source_word: ἀπεδέξαντο
  choice: nabata
  rationale: N’ebe a ἀποδέχομαι pụtara ịnabata ndị bịara n’ụzọ ọma, ọ bụghị naanị ikweta ma ọ bụ ịnakwere ihe.
- source_word: οἱ ἀδελφοί
  choice: ụmụnna
  rationale: ‘Ụmụnna’ na-echekwa ihe atụ ezinụlọ dị na okwu Grik, ma n’ọgbakọ Ndị Kraịst ọ pụkwara izo aka n’ebe ndị kwere ekwe n’ozuzu ha nọ.
theological_decisions:
- issue: Ma οἱ ἀδελφοί ọ na-ezo aka naanị n’ụmụ nwoke ka ọ bụ n’ọgbakọ ndị kwere ekwe n’ozuzu ha
  choice: ụmụnna
  alternative: ụmụnna nwoke na ụmụnna nwanyị; ndị kwere ekwe
  rationale: Okwu Grik ahụ bụ aha nwoke n’ọnụọgụ ọtụtụ, ma ojiji Ndị Kraịst oge mbụ nwere ike ịgụnye ụmụ nwanyị. Isiokwu ahụ na-echekwa okwu ezinụlọ nke isi mmalite, ebe nkọwa ala peeji na-egosi oke nghọta ya.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị mfe ma nwee ugwu mee ihe. ‘Ji ọṅụ nabata’ na-ada eke ma na-echekwa echiche nke nnabata obi ụtọ; ‘ụmụnna’ na-edobe ihe atụ ezinụlọ nke ederede Grik.
