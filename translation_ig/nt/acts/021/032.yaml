  to: Ozugbo, ọ kpọọrọ ndị agha na ndị ọchịagha na-achị otu narị ndị agha soro ya, gbadaa ọsọ gaa n’ebe ha nọ. Mgbe ha hụrụ ọchịagha ukwu ahụ[a] na ndị agha, ha kwụsịrị iti Pọl ihe.
