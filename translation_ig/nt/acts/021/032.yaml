  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὃς ἐξαυτῆς παραλαβὼν στρατιώτας καὶ ἑκατοντάρχας κατέδραμεν ἐπ’ αὐτούς, οἱ δὲ ἰδόντες τὸν χιλίαρχον καὶ τοὺς στρατιώτας ἐπαύσαντο τύπτοντες τὸν Παῦλον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/032.yaml
  text: He immediately took soldiers and centurions and ran down to them[a], and when they saw the tribune and the soldiers, they stopped beating Paul.
translation:
  language: ig
  text: Ozugbo, ọ kpọọrọ ndị agha na ndị ọchịagha na-achị otu narị ndị agha soro ya, gbadaa ọsọ gaa n’ebe ha nọ. Mgbe ha hụrụ ọchịagha ukwu ahụ[a] na ndị agha, ha kwụsịrị iti Pọl ihe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị “ọchịagha ndị Rom” ma ọ bụ “onyeisi ndị agha.” Okwu Grik bụ χιλίαρχος, ya bụ, onyeisi na-achị otu ìgwè ndị agha Rom a na-akpọ cohort.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξαυτῆς
  choice: ozugbo
  rationale: “Ozugbo” na-egosi na o mere ihe ahụ n’egbughị oge, ma bụrụkwa okwu Igbo a na-aghọta ngwa ngwa.
- source_word: παραλαβὼν
  choice: O were
  rationale: N’ebe a, ọ pụtara na ọ kpọọrọ ndị agha na ndị isi ha soro ya; “were” na-enye nke a n’ụzọ dị nkenke ma kwekọọ na usoro ahịrịokwu Igbo.
- source_word: στρατιώτας
  choice: ndị agha
  rationale: Nke a bụ okwu Igbo nkịtị na nke ziri ezi maka ndị agha n’otu n’otu.
- source_word: ἑκατοντάρχας
  choice: ndị ọchịagha na-achị otu narị ndị agha
  rationale: Nkọwa a na-egosipụta ọkwa ndị Rom ahụ n'ụzọ onye Igbo nke oge a ga-aghọta, n’enweghị ịdabere n’okwu mbịarambịa.
- source_word: κατέδραμεν ἐπ’ αὐτούς
  choice: gbadara ọsọ gaa n’ebe ha nọ
  rationale: Nke a na-echekwa ma ngwangwa ahụ ma mgbada o si n’ebe dị elu gbadata, n’etinyeghị echiche na ọ wakporo ha.
- source_word: χιλίαρχον
  choice: ọchịagha ukwu ahụ
  rationale: Okwu a na-egosi onyeisi ndị agha nọ n’ọkwa dị elu karịa ndị isi otu narị; nkọwa ala peeji na-akọwapụta kpọmkwem ọnọdụ ya n’usuu ndị agha Rom.
- source_word: ἐπαύσαντο
  choice: ha kwụsịrị
  rationale: Nke a bụ ụzọ Igbo doro anya na nke e ji eme ihe ugbu a isi kwuo na ha akwụsịla omume ahụ.
- source_word: τύπτοντες
  choice: iti Pọl ihe
  rationale: Akpaalaokwu Igbo a na-egosi iti mmadụ ọtụtụ ugboro, ya mere ọ na-echekwa omume ime ihe ike nke na-aga n’ihu.
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị ugwu ma dịrị ndị nkịtị mfe nghọta. A kọwara ọkwa ndị agha Rom n’ụzọ doro anya n’ahịrịokwu, ebe nkọwa ala peeji na-echekwa aha na ọnọdụ akụkọ ihe mere eme nke χιλίαρχος.
