review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the transition, the Gentiles who have come to faith, the implicit-object verb ‘we sent,’ the prior decision, and all four prohibitions. ‘Anụmanụ a nyagburu anyagbu’ identifies the referent of πνικτόν adequately, but the Greek substantival adjective is less specific in form (‘what is strangled’); a less narrowed Igbo expression better preserves this.
  naturalness: The sentence is generally clear Standard Igbo. ‘Ndị mba ọzọ kweere ekwe’ is understandable, but ‘ndị mba ọzọ bụ ndị kwere ekwe’ is more idiomatic and avoids the awkward appearance of repeated verbal forms. ‘Ihe e nyagburu anyagbu’ is a clearer, more natural expression in the coordinated list.
  terminology: ‘Ihe a chụrụ n’àjà nye arụsị,’ ‘ọbara,’ and ‘omume rụrụ arụ nke mmekọahụ’ appropriately retain the scope and register of the Greek without doctrinal expansion. The cultural note appropriately explains πνικτόν without making its explanatory detail part of the verse.
  issues:
  - severity: low
    issue: The phrase ‘ndị mba ọzọ kweere ekwe’ is stylistically awkward.
    rationale: Although it intends to express the perfect participle πεπιστευκότων, ‘ndị mba ọzọ bụ ndị kwere ekwe’ is more natural Standard Igbo and retains the reference to Gentiles who are believers.
  - severity: low
    issue: ‘Anụmanụ a nyagburu anyagbu’ makes the Greek expression more explicitly ‘animal’ than its substantival wording.
    rationale: πνικτόν denotes what has been strangled, understood contextually as food/meat. ‘Ihe e nyagburu anyagbu’ preserves the Greek form while the note supplies the cultural explanation.
  revised_text: Ma banyere ndị mba ọzọ bụ ndị kwere ekwe, anyị ziri ozi, ebe anyị kpebiri na ha kwesịrị izere ihe a chụrụ n'àjà nye arụsị, na ọbara, na ihe e nyagburu anyagbu[a], na omume rụrụ arụ nke mmekọahụ.
  revised_footnotes:
  - marker: a
    text: Ya bụ, anụmanụ e gburu site n'ịnyagbu ya, nke mere na a wụpụghị ọbara ya.
    reason: cultural_note
  revision_rationale: The revision improves idiomatic Standard Igbo for ‘the Gentiles who have believed’ and avoids unnecessarily specifying ‘animal’ in the main text for πνικτόν. The footnote retains the necessary historical-cultural clarification. No theological interpretation has been added.
