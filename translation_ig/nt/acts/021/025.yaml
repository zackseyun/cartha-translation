id: ACT.21.25
reference: Acts 21:25
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: περὶ δὲ τῶν πεπιστευκότων ἐθνῶν ἡμεῖς ⸀ἀπεστείλαμεν ⸀κρίναντες φυλάσσεσθαι αὐτοὺς τό τε εἰδωλόθυτον ⸀καὶ αἷμα καὶ πνικτὸν καὶ πορνείαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/025.yaml
  text: But concerning the Gentiles who have believed[a], we sent word, having decided that they should keep themselves from what is sacrificed to idols, and from blood, and from what is strangled[c][b], and from sexual immorality.
translation:
  language: ig
  text: Ma banyere ndị mba ọzọ bụ ndị kwere ekwe, anyị ziri ozi, ebe anyị kpebiri na ha kwesịrị izere ihe a chụrụ n'àjà nye arụsị, na ọbara, na ihe e nyagburu anyagbu[a], na omume rụrụ arụ nke mmekọahụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ya bụ, anụmanụ e gburu site n'ịnyagbu ya, nke mere na a wụpụghị ọbara ya.
    reason: cultural_note
lexical_decisions:
- source_word: περὶ δὲ
  choice: Ma banyere
  rationale: “Banyere” na-ewebata isiokwu a na-ekwu maka ya, ebe “ma” na-egosi ntakịrị mgbanwe ma ọ bụ ọdịiche n'ihe e kwuru banyere ndị Juu kwere ekwe.
- source_word: τῶν πεπιστευκότων ἐθνῶν
  choice: ndị mba ọzọ kweere ekwe
  rationale: N'ọnọdụ a, ἐθνῶν pụtara ndị na-abụghị ndị Juu; ụdị perfect nke πεπιστευκότων na-egosi ndị bịara n'okwukwe ma nọgide na ya.
- source_word: ἡμεῖς
  choice: anyị
  rationale: Aha nnọchiaha ahụ pụtara ìhè na Grik ma na-enye ndị mere mkpebi ahụ ntakịrị nkwusi ike.
- source_word: ἀπεστείλαμεν
  choice: anyị ziri ozi
  rationale: Ngwaa Grik ahụ hapụrụ ihe e zigara n'ekwughị ya kpọmkwem. “Ziri ozi” bụ Igbo dị mma nke na-echekwa oghere ahụ, ebe ọnọdụ gbara amaokwu ahụ gburugburu na-ezo aka n'akwụkwọ ozi e zigara na Ọrụ Ndịozi 15.
- source_word: κρίναντες
  choice: ebe anyị kpebiri
  rationale: Nke a na-egosi mkpebi e mere tupu ma jikọta ya na iziga ozi ahụ, n'asụsụ Igbo doro anya.
- source_word: φυλάσσεσθαι αὐτοὺς
  choice: na ha kwesịrị izere
  rationale: “Izere” na-ebupụta echiche nke idebe onwe ha pụọ n'ihe ndị a machibidoro, n'ụzọ dị mfe ma bụrụ nke e ji eme ihe n'Igbo ugbu a.
- source_word: τό τε εἰδωλόθυτον
  choice: ihe a chụrụ n'àjà nye arụsị
  rationale: Nke a na-eso okwu Grik nke ọma ma ghara ime ka ọ bụrụ naanị otu ụdị nri, ọ bụ ezie na ọnọdụ ahụ gbasara nri e jikọtara ya na àjà arụsị.
- source_word: αἷμα
  choice: ọbara
  rationale: Nsụgharị kpọmkwem nke okwu Grik; amaokwu ahụ n'onwe ya akọwaghị ya karịa nke a.
- source_word: πνικτόν
  choice: anụmanụ a nyagburu anyagbu
  rationale: Okwu ahụ na-ezo aka n'anụmanụ e gburu site n'ịnyagbu ya, nke mere na a wụpụghị ọbara ya; ịkpọ “anụmanụ” aha na-eme ka Igbo doo anya.
- source_word: πορνείαν
  choice: omume rụrụ arụ nke mmekọahụ
  rationale: Nke a na-egosi obosara nke πορνεία dịka omume mmekọahụ iwu Chineke na-akwadoghị, kama imechi ya naanị n'otu ụdị mmehie mmekọahụ.
theological_decisions:
- issue: Ụdị na ogologo oge iwu ndịozi anọ a dị
  choice: E depụtara ihe anọ a machibidoro n'ụzọ kwụ ọtọ, n'ekpebighị ma ha bụ iwu na-adịgide adịgide ma ọ bụ ndokwa maka mmekọrịta n'etiti ndị Juu na ndị mba ọzọ.
  alternative: Ịkọwa ha dịka naanị ndokwa nwa oge maka iri nri ọnụ, ma ọ bụ dịka iwu zuru ụwa ọnụ na-adịgide adịgide.
  rationale: Amaokwu ahụ na-akọ ihe dị n'ime mkpebi e mere, ma ọ kọwaghị ihe ndabere ya niile ma ọ bụ ogologo oge ọ ga-adị; ya mere nsụgharị ahụ na-echekwa esemokwu nkà mmụta okpukpe ahụ.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke ugbu a, dị ùgwù ma dị mfe nghọta. A họọrọ “ziri ozi” kama “ziri akwụkwọ ozi” n'ihi na ihe e zigara adịghị kpọmkwem na Grik, ọ bụ ezie na ọnọdụ ahụ na-ezo aka n'akwụkwọ ozi nke Ọrụ Ndịozi 15.
