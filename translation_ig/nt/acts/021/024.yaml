id: ACT.21.24
reference: Acts 21:24
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τούτους παραλαβὼν ἁγνίσθητι σὺν αὐτοῖς καὶ δαπάνησον ἐπ’ αὐτοῖς ἵνα ⸀ξυρήσονται τὴν κεφαλήν, καὶ ⸀γνώσονται πάντες ὅτι ὧν κατήχηνται περὶ σοῦ οὐδέν ἐστιν, ἀλλὰ στοιχεῖς καὶ αὐτὸς ⸂φυλάσσων τὸν νόμον⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/024.yaml
  text: Take these men[a], purify yourself along with them, and pay their expenses so that they may shave their heads. Then everyone will know that there is nothing to the things they have been told about you[b], but that you yourself also are living in observance of the law.
translation:
  language: ig
  text: Kpọrọ ndị ikom a soro gị, soro ha mee emume ịdị ọcha, kwụọkwa ụgwọ emume ha, ka ha wee kpụọ isi ha. Mgbe ahụ, mmadụ niile ga-amara na ihe a kọrọ ha banyere gị[a] enweghị ihe ndabere, kama na gị onwe gị kwa na-ebi ndụ n’usoro[b], na-edebe Iwu ahụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ihe ndị a kụziiri ha banyere gị.” Okwu Grik ahụ nwere ike ịpụta “ịkụziri” ma ọ bụ, n’ụzọ sara mbara, “ịgwa mmadụ ihe.” N’ebe a, ọ na-ezo aka n’akụkọ ndị na-agagharị banyere Pọl.
    reason: lexical_alternative
  - marker: b
    text: N’ụzọ nkịtị, “na-aga n’ahịrị,” ya bụ, na-ebi ndụ kwekọrọ n’idebe Iwu ahụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: τούτους παραλαβὼν
  choice: Kpọrọ ndị ikom a soro gị
  rationale: Ihe a pụtara n’ọnọdụ a bụ ịkpọrọ mmadụ ka o soro gị. E tinyere “ndị ikom” site n’ihe e kwuru n’amaokwu bu ụzọ banyere ndị ikom anọ, iji mee ka onye a na-ekwu maka ya doo anya.
- source_word: ἁγνίσθητι σὺν αὐτοῖς
  choice: gị na ha meekwa emume ịdị ọcha
  rationale: Okwu ahụ na-ekwu maka ịdị ọcha dịka emume okpukpe, ọ bụghị nanị ịdị ọcha nke ahụ. Nsụgharị a na-egosi na Pọl ga-esonyere ha n’emume ahụ.
- source_word: δαπάνησον ἐπ’ αὐτοῖς
  choice: kwụkwara ha ụgwọ ihe niile dị ha mkpa
  rationale: Nkebiokwu Grik a pụtara iburu ma ọ bụ ịkwụ ụgwọ n’ihi ha, ya bụ ụgwọ metụtara nkwa na emume ahụ.
- source_word: ἵνα ξυρήσονται τὴν κεφαλήν
  choice: ka ha wee kpụọ isi ha
  rationale: ἵνα na-egosi ebumnuche ma ọ bụ ihe a tụrụ anya ya. “Isi” dị n’otu n’asụsụ Grik n’ụzọ nkesa, ma Igbo na-eji ya otu a n’ụzọ ebumpụta ụwa.
- source_word: γνώσονται πάντες
  choice: Mgbe ahụ, mmadụ niile ga-amara
  rationale: Oge ọdịnihu nke γινώσκω pụtara na mmadụ niile ga-amata ihe ga-esi n’omume ahụ pụta. “Mgbe ahụ” na-eme ka njikọ nke ihe kpatara ya na ihe ga-esi na ya pụta doo anya.
- source_word: ὧν κατήχηνται περὶ σοῦ
  choice: ihe ndị a kọọrọ ha banyere gị
  rationale: κατηχέω nwere ike ịpụta ịkụziri ma ọ bụ ịgwa mmadụ ihe. N’ebe a, ọ na-ezo aka n’akụkọ ndị na-agagharị banyere Pọl, ya mere “a kọọrọ ha” na-echekwa obosara ihe okwu ahụ nwere ike ịpụta.
- source_word: οὐδέν ἐστιν
  choice: enweghị ihe ndabere
  rationale: N’ọnọdụ a, okwu ahụ na-egosi na akụkọ ndị ahụ enweghị isi ma ọ bụ ezi ntọala; “enweghị ihe ndabere” na-enye ihe ahụ pụtara n’Igbo doro anya.
- source_word: ἀλλὰ στοιχεῖς
  choice: kama na ... na-ebi ndụ n’usoro kwesịrị ekwesị
  rationale: στοιχέω pụtara ịga n’ahịrị, iso usoro, ma ọ bụ ibi ndụ kwekọrọ n’ihe. Nsụgharị a na-egosi omume na-aga n’ihu n’enweghị iji ihe atụ “ije” nke nwere ike ghara ido anya.
- source_word: καὶ αὐτὸς
  choice: gị onwe gị kwa
  rationale: Nkebiokwu a na-emesi Pọl n’onwe ya ike ma gosikwa mgbakwunye; “gị onwe gị kwa” na-echekwa ihe abụọ ahụ.
- source_word: φυλάσσων τὸν νόμον
  choice: na-edebe Iwu ahụ
  rationale: φυλάσσω ya na νόμος pụtara idebe ma ọ bụ irube isi n’Iwu. E debere ya dịka nkebiokwu doro anya, n’akụkụ στοιχεῖς, ka echiche abụọ dị na Grik ghara ịla n’iyi.
- source_word: νόμον
  choice: Iwu ahụ
  rationale: N’ọnọdụ a νόμος na-ezo aka n’Iwu ndị Juu. “Iwu ahụ” na-echekwa okwu isi mmalite n’etinyeghị nkọwa “nke Mosis” n’ahịrị bụ isi.
theological_decisions:
- issue: Ụdị mmekọrịta Pọl na Iwu ahụ n’akụkọ a
  choice: 'A sụgharịrị ya dịka nkọwa banyere omume Pọl a pụrụ ịhụ anya: “gị onwe gị kwa na-ebi ndụ n’usoro kwesịrị ekwesị, na-edebe Iwu ahụ.”'
  alternative: “gị onwe gị kwa na-edebe Iwu ahụ” ma ọ bụ “gị onwe gị kwa na-eje ije n’usoro, na-edebe Iwu ahụ”
  rationale: Amaokwu a na-akọ ihe ndị ọzọ ga-aghọta site na Pọl isonye n’emume ịdị ọcha na ịkwụ ụgwọ ndị ikom ahụ. Nsụgharị ahụ anaghị ekpebi n’ebe a ajụjụ sara mbara banyere nkuzi Pọl gbasara Iwu ahụ, kama ọ na-echekwa esemokwu nkà mmụta okpukpe dị n’akụkọ ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. “Emume ịdị ọcha” na-eme ka ọdịdị okpukpe nke ἁγνίζω doo anya; “Iwu ahụ” na-echekwa ntụaka ahụ n’enweghị ịgbakwunye nkọwa òtù ụka. Akara nkọwa ala ala [a] na [b] pụtara n’ahịrị bụ isi.
