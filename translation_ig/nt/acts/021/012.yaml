id: ACT.21.12
reference: Acts 21:12
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὡς δὲ ἠκούσαμεν ταῦτα, παρεκαλοῦμεν ἡμεῖς τε καὶ οἱ ἐντόπιοι τοῦ μὴ ἀναβαίνειν αὐτὸν εἰς Ἰερουσαλήμ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/012.yaml
  text: When we heard these things[a], we and the local people urged him not to go up to Jerusalem.
translation:
  language: ig
  text: Mgbe anyị nụrụ ihe ndị a[a], ma anyị ma ndị bi n’ebe ahụ nọ na-arịọ ya ka ọ ghara ịrịgo Jerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “rịọsiri ya ike ka ọ ghara ịrịgo Jerusalem.” Ngwaa Grik ahụ pụkwara ịpụta ịrịọsi mmadụ ike.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ
  choice: Mgbe
  rationale: Ọ na-egosi oge ihe a mere ma na-eme ka akụkọ gaa n’ihu n’ụzọ dị nro; “Mgbe” bụ okwu Igbo dị mfe ma kwekọọ n’echiche ahụ.
- source_word: ἠκούσαμεν
  choice: anyị nụrụ
  rationale: Oge gara aga nke ngwaa ahụ na-ekwu na ndị so na Luk nụrụ amụma Agabus; nsụgharị a bụ nke kwụ ọtọ ma bụrụ Igbo ebumpụta ụwa.
- source_word: ταῦτα
  choice: ihe ndị a
  rationale: Ọ na-ezo aka n’ihe dị iche iche e kwuru n’amụma gara aga ma na-edebe ụdị ọtụtụ nke okwu Grik.
- source_word: παρεκαλοῦμεν
  choice: rịọrọ ya
  rationale: N’ebe a, παρακαλέω pụtara ịrịọ mmadụ ka o mee ma ọ bụ ghara ime ihe. “Rịọrọ ya” bụ okwu doro anya, ebe nkọwa ala peeji na-egosi na arịrịọ ahụ nwere ike ịbụ nke siri ike.
- source_word: ἡμεῖς τε καὶ οἱ ἐντόπιοι
  choice: ma anyị ma ndị bi n’ebe ahụ
  rationale: Usoro “ma ... ma ...” na-eme ka o doo anya na ìgwè abụọ ahụ—ndị njem ahụ na ndị obodo—sonyere n’arịrịọ ahụ.
- source_word: οἱ ἐντόπιοι
  choice: ndị bi n’ebe ahụ
  rationale: Nke a bụ Igbo doro anya ma bụrụ nke mmadụ niile ga-aghọta maka ndị obodo ahụ ma ọ bụ ndị bi n’ebe ahụ.
- source_word: τοῦ μὴ ἀναβαίνειν αὐτὸν
  choice: ka ọ ghara ịrịgo
  rationale: Ọ na-egosi kpọmkwem ihe ha rịọrọ Pọl ka ọ ghara ime. “Ịrịgo” na-edebe okwu ntụziaka e ji ekwu maka ịga Jerusalem.
- source_word: εἰς Ἰερουσαλήμ
  choice: Jerusalem
  rationale: Aha ebe ahụ sochiri ngwaa ngagharị n’ụzọ Igbo ebumpụta ụwa ma na-egosi ebe Pọl na-aga.
theological_decisions:
- issue: Okwu ntụziaka e ji ekwu maka njem Jerusalem
  choice: ịrịgo Jerusalem
  alternative: ịga Jerusalem
  rationale: Okwu Grik ἀναβαίνειν pụtara “ịrịgo,” bụ́kwa ụzọ a na-ejikarị ekwu maka ịga Jerusalem. Idebe ya na-egosipụta isi mmalite ahụ nke ọma n’etinyeghị nkọwa okpukpe ọzọ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta mee ihe. Usoro “ma anyị ma...” na-edebe nkwusi ike dị na Grik, ebe “ịrịgo Jerusalem” na-echekwa okwu ntụziaka nke isi mmalite ahụ.
