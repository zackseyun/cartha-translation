  terminology: ‘Ndị bi n’ebe ahụ’ is an appropriate neutral rendering of οἱ ἐντόπιοι. ‘Ịrịgo Jerusalem’ appropriately preserves the conventional directional expression in the Greek. The lexical footnote correctly offers the stronger sense of earnest pleading.
