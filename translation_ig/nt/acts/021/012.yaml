  rationale: The revision changes only the appeal verb to an idiomatic progressive construction, preserving the imperfect aspect and earnest contextual force of παρεκαλοῦμεν. All other source-sensitive elements, including the plural demonstrative, paired subjects, negative infinitival content, and ‘go up’ idiom, are retained.
