id: ACT.21.35
reference: Acts 21:35
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὅτε δὲ ἐγένετο ἐπὶ τοὺς ἀναβαθμούς, συνέβη βαστάζεσθαι αὐτὸν ὑπὸ τῶν στρατιωτῶν διὰ τὴν βίαν τοῦ ὄχλου,
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/035.yaml
  text: When he came to the steps[a], it happened that he was being carried by the soldiers because of the violence of the crowd[b],
translation:
  language: ig
  text: Mgbe ọ rutere na steepụ ndị ahụ[b], o mere na ndị agha nọ na-ebu ya[a] n’ihi ime ihe ike nke igwe mmadụ ahụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “ndị agha aghaghị ibu ya.” Okwu Grik ahụ pụrụ igosi na ime ihe ike nke igwe mmadụ ahụ mere ka ọ dị mkpa ka ndị agha buru ya.
    reason: lexical_alternative
  - marker: b
    text: O yikarịrị ka “steepụ ndị ahụ” bụ nrịgo na-eduga n’ụlọ ndị agha Rom (lee Ọrụ Ndịozi 21:34, 37).
    reason: cross_reference
lexical_decisions:
- source_word: ὅτε δὲ
  choice: Mgbe
  rationale: ὅτε na-egosi oge ihe mere; δέ bụ njikọ dị nro nke na-adịghị achọ ka e jiri okwu mmegide pụta ìhè n’Igbo.
- source_word: ἐγένετο ἐπὶ τοὺς ἀναβαθμούς
  choice: ọ rutere na steepụ ndị ahụ
  rationale: γίνομαι tinyere ἐπί na accusative bụ akpaalaokwu pụtara iru ebe; nsụgharị a doro anya ma bụrụkwa Igbo a na-asụ ugbu a.
- source_word: ἀναβαθμούς
  choice: steepụ ndị ahụ
  rationale: Okwu ahụ na-ezo aka na nrịgo ma ọ bụ usoro steepụ; ‘steepụ’ bụ okwu ndị Igbo nke oge a na-aghọta ngwa ngwa.
- source_word: συνέβη
  choice: o mere na
  rationale: Nke a na-edobe ụzọ Luk si kọwaa ihe si n’ọnọdụ ahụ pụta, n’enweghị ịgbakwunye nkọwa na-adịghị n’ederede.
- source_word: βαστάζεσθαι
  choice: ndị agha nọ na-ebu ya
  rationale: Present passive infinitive na-egosi na ibu ya nọ na-aga n’ihu; ‘nọ na-ebu ya’ na-echekwa echiche ahụ, ebe ndị agha ka bụ ndị na-eme ihe ahụ.
- source_word: ὑπὸ τῶν στρατιωτῶν
  choice: ndị agha
  rationale: στρατιῶται pụtara ndị agha, ma ὑπό na-egosi na ọ bụ ha buuru ya.
- source_word: διὰ τὴν βίαν τοῦ ὄχλου
  choice: n’ihi ime ihe ike nke igwe mmadụ ahụ
  rationale: διά na accusative na-egosi ihe kpatara ya; βία bụ ike ma ọ bụ ime ihe ike, ebe ὄχλος bụ igwe mmadụ. N’ọnọdụ ọgba aghara a, ‘ime ihe ike’ na-egosipụta ihe okwu ahụ pụtara nke ọma.
