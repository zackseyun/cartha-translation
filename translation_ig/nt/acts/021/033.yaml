id: ACT.21.33
reference: Acts 21:33
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸂τότε ἐγγίσας⸃ ὁ χιλίαρχος ἐπελάβετο αὐτοῦ καὶ ἐκέλευσε δεθῆναι ἁλύσεσι δυσί, καὶ ἐπυνθάνετο ⸀τίς εἴη καὶ τί ἐστιν πεποιηκώς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/033.yaml
  text: Then the commander came up[a], seized him, and ordered him to be bound with two chains[b], and was asking who he was and what he had done.
translation:
  language: ig
  text: Mgbe ahụ, ọchịagha ahụ bịaruru nso[a], jidere ya, nyekwa iwu ka e jiri agbụ abụọ kee ya[b]. Ọ na-ajụkwa onye ọ bụ na ihe o mere.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “onyeisi agha.” Okwu Grik bụ χιλίαρχος na-ezo aka n’otu onyeisi agha Rom; n’ụzọ nkịtị, ọ pụtara “onyeisi otu puku ndị agha.”
    reason: lexical_alternative
  - marker: b
    text: “Agbụ abụọ” nwere ike ịbụ nkwughachi nke amụma dị n’Ọrụ Ndị Ozi 21:11 banyere e kekọta Pọl agbụ na Jerusalem.
    reason: cross_reference
lexical_decisions:
- source_word: χιλίαρχος
  choice: ọchịagha
  rationale: Okwu a na-ezo aka n’otu onyeisi agha Rom nke na-achị ndị agha n’ọkwa dị elu. “Ọchịagha” bụ okwu Igbo doro anya nke na-egosi ikike agha ya, ebe nkọwa zuru ezu dị n’okpuru peeji.
- source_word: ἐγγίσας
  choice: bịaruru nso
  rationale: Nke a na-egosi na ọ bịara nso tupu o jide Pọl; okwu Igbo a na-edobe usoro omume ahụ n'ụzọ eke.
- source_word: ἐπελάβετο αὐτοῦ
  choice: jide ya
  rationale: N’ọnọdụ njide a, okwu Grik ahụ pụtara ijide mmadụ n’ike. “Jide ya” dị nkenke ma doo anya.
- source_word: ἐκέλευσε δεθῆναι
  choice: nye iwu ka e ... kee ya
  rationale: Nke a na-echekwa ma ikike dị n’iwu ahụ ma ụdị nnara-eme nke δεθῆναι, ya bụ, na ndị ọzọ ga-eke ya.
- source_word: ἁλύσεσι δυσί
  choice: jiri agbụ abụọ
  rationale: “Agbụ abụọ” bụ ntụgharị kwụ ọtọ nke okwu Grik ahụ ma na-ahapụkwa njikọ o nwere ike inwe na Ọrụ Ndị Ozi 21:11.
- source_word: ἐπυνθάνετο
  choice: Ọ nọkwa na-ajụ
  rationale: Ụdị imperfect na-egosi ajụjụ na-aga n’ihu n’etiti ọgba aghara ahụ; “ọ nọ ... na-ajụ” na-echekwa akụkụ a.
- source_word: τίς εἴη
  choice: onye ọ bụ
  rationale: Nke a bụ ụzọ Igbo si ekwu ajụjụ na-apụtaghị kpọmkwem mgbe ngwaa dị n’oge gara aga.
- source_word: τί ἐστιν πεποιηκώς
  choice: ihe o mere
  rationale: Periphrastic perfect na-atụ aka n’ihe e mere nke ka dị mkpa n’oge ahụ. “Ihe o mere” bụ ụzọ Igbo dị eke isi gosipụta ya n’akụkọ gara aga.
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta, dee ya. A họọrọ ahịrịokwu abụọ iji mee ka usoro omume ahụ doo anya ma ka ajụjụ na-aga n’ihu pụta nke ọma.
