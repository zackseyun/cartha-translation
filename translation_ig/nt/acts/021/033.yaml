  to: Mgbe ahụ, ọchịagha ahụ bịaruru nso[a], jidere ya, nyekwa iwu ka e jiri agbụ abụọ kee ya[b]. Ọ na-ajụkwa onye ọ bụ na ihe o mere.
  rationale: The revision changes the two imperative forms to past-tense narrative verbs, retaining the passive sense of the order to bind Paul. It also makes the imperfect inquiry natural in Standard Igbo and revises footnote b to preserve the English audit trail’s cautious ‘may echo’ wording rather than asserting prophetic fulfillment.
