translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị mfe ma dị ugwu, dee ya. E tinyere akara nkọwa [a] n’akụkụ okwu προπέμπω nke ọ na-akọwa, kama itinye ya n’akụkụ ‘ụbọchị ndị ahụ.’
