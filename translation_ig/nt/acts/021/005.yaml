  text: ὅτε δὲ ἐγένετο ⸂ἐξαρτίσαι ἡμᾶς⸃ τὰς ἡμέρας, ἐξελθόντες ἐπορευόμεθα προπεμπόντων ἡμᾶς πάντων σὺν γυναιξὶ καὶ τέκνοις ἕως ἔξω τῆς πόλεως, καὶ θέντες τὰ γόνατα ἐπὶ τὸν αἰγιαλὸν ⸀προσευξάμενοι
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/005.yaml
  text: When it came time for us to complete those days[a], we departed and went on our way, while they all, with wives and children, were accompanying us as far as outside the city. And after kneeling down on the beach[b], we prayed.
translation:
  language: ig
  text: 'Mgbe oge ruru ka anyị mechaa ụbọchị ndị ahụ, anyị pụrụ wee gaa n’ụzọ anyị. Ha niile, tinyere ndị nwunye ha na ụmụ ha, nọ na-eso anyị aga[a] ruo ná mpụga obodo ahụ. Mgbe anyị gburu ikpere n’ala n’ụsọ osimiri[b], anyị kpere ekpere.


    [a] A pụkwara ịsụgharị ya, “na-eso anyị mgbe anyị na-apụ.” Okwu Grik ahụ nwere ike ịpụta iso onye na-apụ aga iji sị ya jee nke ọma.


    [b] A pụkwara ịsụgharị ya, “n’akụkụ mmiri” ma ọ bụ “n’akụkụ osimiri.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “na-eso anyị mgbe anyị na-apụ.” Okwu Grik ahụ nwere ike ịpụta iso onye na-apụ aga iji sị ya jee nke ọma.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, “n’akụkụ mmiri” ma ọ bụ “n’akụkụ osimiri.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο ἐξαρτίσαι ἡμᾶς τὰς ἡμέρας
  choice: Mgbe oge ruru ka anyị mechaa ụbọchị ndị ahụ
  rationale: Nke a na-egosipụta na oge eruola imecha oge ha ga-anọ ebe ahụ, ma na-edobe okwu ahụ kpọmkwem bụ́ ‘ụbọchị ndị ahụ.’
- source_word: ἐξελθόντες ἐπορευόμεθα
  choice: anyị pụrụ, gawa njem anyị
  rationale: Ọ na-edobe ma omume ịpụ ma ịga n’ihu n’ụzọ, n’Igbo dị mfe ma dịkwa n’usoro akụkọ.
- source_word: προπεμπόντων ἡμᾶς πάντων
  choice: Ha niile ... nọ na-eso anyị aga
  rationale: προπέμπω nwere ike ịpụta iso ndị na-apụ aga ma ọ bụ ịkpọga ha iji sị ha nọrọ nke ọma. Isi ederede na-ahapụ ohere abụọ ahụ, ebe nkọwa ala peeji na-egosi ụzọ ọzọ.
- source_word: σὺν γυναιξὶ καὶ τέκνοις
  choice: tinyere ndị nwunye ha na ụmụ ha
  rationale: N’ọnọdụ a, γυναιξίν na-ezo aka n’ụzọ kacha kwe omume n’ebe ndị nwunye ndị ahụ nọ, ya na ụmụ ha, dị ka ezinụlọ ndị so n’ịkpọga ha.
- source_word: ἕως ἔξω τῆς πόλεως
  choice: ruo ná mpụga obodo ahụ
  rationale: Nke a na-egosi na ha sooro ha ruo ebe dị n’èzí ókè obodo ahụ.
- source_word: θέντες τὰ γόνατα
  choice: Mgbe anyị gburu ikpere n’ala
  rationale: ‘Igbu ikpere n’ala’ bụ ụzọ Igbo si ekwu omume a n’ụzọ ebumpụta ụwa.
- source_word: ἐπὶ τὸν αἰγιαλόν
  choice: n’ụsọ osimiri
  rationale: αἰγιαλός pụtara ụsọ mmiri ma ọ bụ aja dị n’akụkụ mmiri; ‘ụsọ osimiri’ bụ okwu doro anya ma dịkwa ugwu n’Igbo.
- source_word: προσευξάμενοι
  choice: anyị kpere ekpere
  rationale: Ọ bụ ezie na okwu Grik ahụ bụ participle na-ejikọta ihe a na ihe na-esote, ịsụgharị ya dị ka ngwaa zuru ezu na-eme ka amaokwu a bụrụ Igbo na-aga nke ọma, n’emeghị mgbanwe n’omume ahụ.
