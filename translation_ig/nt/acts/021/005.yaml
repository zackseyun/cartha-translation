  rationale: E meela naanị mmezi asụsụ na nkọwa ala peeji. “anyị pụrụ wee gaa n’ụzọ anyị” na-eme ka usoro Grik ahụ, nke jikọtara ịpụ na ịga n'ihu, bụrụ Igbo eke. E degharịrị [a] ka nhọrọ ọzọ maka προπέμπω ghara ịpụta na ndị obodo ahụ na-eduru ndị njem ahụ, kama na ha na-eso ha n'oge ịla.
