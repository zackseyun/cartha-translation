review_pass:
  verdict: revise
  source_fidelity: 'Ihe ederede ahụ na-anọchi anya ihe Grik ahụ nke ọma n''ozuzu ya: imecha ụbọchị e kenyere, ịpụ gaa n''ihu, ndị nile iso ha ruo n''èzí obodo, ikpere n''ala n''ụsọ osimiri, na ekpere. Otú ọ dị, “anyị pụrụ, gawa njem anyị” anaghị egosipụta njikọ ἐξελθόντες ἐπορευόμεθα n''Igbo zuru oke n''ihi na “gawa” nọ ebe a n''enweghị njikọ kwesịrị ekwesị.'
  naturalness: 'Ihe ka ukwuu bụ Igbo Izugbe doro anya ma kwekọọ na ndekọ akụkọ Akwụkwọ Nsọ. A ga-eme ka ahịrịokwu gbasara ịpụ na ịga n''ihu bụrụ nke na-aga nke ọma karịa: “anyị pụrụ wee gaa n’ụzọ anyị.” A ga-edozikwa ụzọ e si akọwa nhọrọ ọzọ n''ala peeji [a] ka ọ bụrụ Igbo eke karịa.'
  terminology: “ndị nwunye ha na ụmụ ha,” “mpụga obodo ahụ,” “gburu ikpere n’ala,” “ụsọ osimiri,” na “kpere ekpere” dabara nke ọma. “Ụsọ osimiri” na-edobe αἰγιαλός nke ọma, ebe [b] na-enye nhọrọ ndị ọzọ kwesịrị ekwesị.
  issues:
  - severity: medium
    issue: “anyị pụrụ, gawa njem anyị”
    rationale: “gawa” dị ka e si jiri ya ebe a enweghị njikọ ma ọ bụ mgbanwe ngwaa zuru oke. “anyị pụrụ wee gaa n’ụzọ anyị” na-asụgharị ma ἐξελθόντες (‘mgbe anyị pụtasịrị’) na ἐπορευόμεθα (‘anyị gara n'ihu’) n'Igbo eke.
  - severity: low
    issue: Nkọwa ala peeji [a] enweghị okwu Igbo eke nke ọma n’ime nhọrọ ọzọ.
    rationale: “na-akpọga anyị mgbe anyị na-apụ” nwere ike ịda ka ha na-eduru ndị njem ahụ, kama iso ha dị ka nkwado n'oge ịla. “na-eso anyị mgbe anyị na-apụ” na-anọchi anya προπέμπω nke ọma; nkọwa ahụ nwere ike ịkọwa nzube ịsị ndị na-apụ jee nke ọma.
