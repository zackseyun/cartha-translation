revisions:
- from: na-eti mkpu, sị, “Ndị ikom Izrel, nyerenụ aka! Onye a bụ nwoke ahụ na-akụziri mmadụ niile n’ebe niile ihe megidere ndị anyị na iwu na ebe a. Ọzọkwa, o webatala ọbụna ndị Gris n’ime ụlọnsọ ukwu[a], wee merụọ ebe nsọ a.”
  to: na-eti mkpu, sị, “Ndị ikom Izrel, nyerenụ aka! Onye a bụ nwoke ahụ na-akụzi mmadụ niile n’ebe niile megide ndị anyị na iwu na ebe a. Ọzọkwa, o webatala ọbụna ndị Gris n’ime ụlọnsọ ukwu[a], wee metọọ ebe nsọ a.”
  rationale: The revision removes the added object “ihe,” so that the charge of opposition is attached directly to his teaching, as in the Greek. It also replaces the general verb “merụọ” with “metọọ,” which better conveys the claimed ritual defilement of the holy place. The existing temple-complex footnote is retained unchanged.
  reviewer_model: gpt-5.6-terra
