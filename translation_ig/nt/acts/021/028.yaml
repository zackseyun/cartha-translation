id: ACT.21.28
reference: Acts 21:28
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: κράζοντες· Ἄνδρες Ἰσραηλῖται, βοηθεῖτε· οὗτός ἐστιν ὁ ἄνθρωπος ὁ κατὰ τοῦ λαοῦ καὶ τοῦ νόμου καὶ τοῦ τόπου τούτου πάντας ⸀πανταχῇ διδάσκων, ἔτι τε καὶ Ἕλληνας εἰσήγαγεν εἰς τὸ ἱερὸν καὶ κεκοίνωκεν τὸν ἅγιον τόπον τοῦτον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/028.yaml
  text: shouting[a], “Men of Israel, help! This is the man who teaches everyone everywhere against the people and the law and this place. And besides that, he has even brought Greeks into the temple and has defiled this holy place.”
translation:
  language: ig
  text: na-eti mkpu, sị, “Ndị ikom Izrel, nyerenụ aka! Onye a bụ nwoke ahụ na-akụzi mmadụ niile n’ebe niile megide ndị anyị na iwu na ebe a. Ọzọkwa, o webatala ọbụna ndị Gris n’ime ụlọnsọ ukwu[a], wee metọọ ebe nsọ a.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Okwu Grik ἱερόν na-ezo aka n’ụlọ nsọ na ogige ya niile, ọ bụghị kpọmkwem naanị ime ebe nsọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: κράζοντες
  choice: na-eti mkpu
  rationale: Na-egosi mkpu ha na-eti n’ihu ọha, n’olu ike na ngwa ngwa, dịka participle nke na-akọ ụzọ ha si kwuo ebubo ahụ.
- source_word: Ἄνδρες Ἰσραηλῖται
  choice: Ndị ikom Izrel
  rationale: Na-edobe kpọmkwem okwu a kpọrọ ụmụ nwoke Izrel, n’ụdị Igbo doro anya ma dị nsọpụrụ.
- source_word: βοηθεῖτε
  choice: nyerenụ aka!
  rationale: Ọ bụ iwu e nyere ọtụtụ mmadụ ka ha nyere aka; etinyeghị ‘anyị’ n’ihi na Grik ekwughị ya kpọmkwem.
- source_word: οὗτός ἐστιν ὁ ἄνθρωπος
  choice: Onye a bụ nwoke ahụ
  rationale: Na-echekwa ike nke ịmata ma bo onye ahụ ebubo, ma bụrụkwa okwu Igbo sitere n’okike.
- source_word: ὁ κατὰ τοῦ λαοῦ καὶ τοῦ νόμου καὶ τοῦ τόπου τούτου
  choice: ihe megidere ndị anyị na iwu na ebe a
  rationale: κατά na genitive pụtara mmegide. ‘Ndị anyị’ na-eme ka ndị Igbo ghọta na λαός ebe a bụ ndị Izrel/Juu nke ndị na-ekwu okwu so na ha, ebe ‘iwu’ na-anọgideghị n’ụdị nkọwa agbakwunyere.
- source_word: πάντας πανταχῇ διδάσκων
  choice: na-akụziri mmadụ niile n’ebe niile
  rationale: 'Na-echekwa nkwusie ike abụọ ahụ: πάντας, mmadụ niile; πανταχῇ, n’ebe niile.'
- source_word: ἔτι τε καὶ
  choice: Ọzọkwa
  rationale: Na-egosi na ha na-agbakwụnye ebubo ọzọ siri ike n’elu nke mbụ.
- source_word: Ἕλληνας
  choice: ndị Gris
  rationale: Grik kwuru kpọmkwem ndị Gris, ọ bụghị okwu sara mbara nke pụtara ndị mba ọzọ niile.
- source_word: εἰσήγαγεν εἰς τὸ ἱερὸν
  choice: o webatala ọbụna ndị Gris n’ime ụlọnsọ ukwu[a]
  rationale: Perfect ahụ gosiri omume e mere nke nsonaazụ ya ka dị mkpa n’ebubo ahụ. ‘Ụlọnsọ ukwu’ bụ okwu Igbo a na-aghọta ngwa ngwa; ndetu kọwara na ἱερόν bụ ogige ụlọ nsọ dum, ọ bụghị nanị ime ebe nsọ.
- source_word: κεκοίνωκεν
  choice: wee merụọ
  rationale: N’ọnọdụ ofufe a, κοινόω pụtara ime ka ihe ghara ịdị ọcha ma ọ bụ bụrụ ihe e merụrụ n’usoro nsọ; ‘merụọ’ na-ebute echiche ahụ n’Igbo nkịtị.
- source_word: τὸν ἅγιον τόπον τοῦτον
  choice: ebe nsọ a
  rationale: Na-echekwa ma ịdị nsọ nke ebe ahụ ma nkwusie ike nke demonstrative ‘a.’
theological_decisions:
- issue: Ihe τοῦ νόμου na-ezo aka na ya
  choice: iwu
  alternative: Iwu Mosis
  rationale: N’ọnọdụ ndị Juu na ụlọ nsọ dị na Jerusalem, ọ na-ezo aka n’iwu ndị Juu, karịchaa Iwu Mosis. Ma ederede Grik kwuru naanị ‘iwu,’ ya mere nsụgharị bụ ‘iwu’ iji ghara ịgbakwunye nkọwa n’ahịrịokwu ahụ.
- issue: Nkọwa nke ἱερόν
  choice: ụlọnsọ ukwu n’ederede, tinyere ndetu na-akọwa ogige ya
  alternative: ogige ụlọnsọ ukwu
  rationale: ‘Ụlọnsọ ukwu’ bụ nke na-agụ nke ọma n’Igbo, ma ἱερόν nwere ike ịgụnye ogige ụlọ nsọ dum, ọ bụghị naanị ime ebe nsọ. Ndetu na-echekwa ezi nkọwa akụkọ ihe mere eme ahụ.
- issue: Ebubo banyere imerụ ebe nsọ
  choice: wee merụọ ebe nsọ a
  alternative: wee mee ka ebe nsọ a ghara ịdị ọcha
  rationale: ‘Merụọ’ na-echekwa asụsụ ebubo nke mmetọ n’usoro ofufe n’enweghị ịkọwa karịa ka okwu Grik kwuru.
translation_notes:
  register: Standard Igbo nke oge a, dị mfe nghọta ma nwee ugwu. A họọrọ usoro okwu na-agụ nke ọma n’ọnụ, ma debe nkwusie ike, ebubo, na nghọtahie ọ bụla dị n’ederede Grik.
