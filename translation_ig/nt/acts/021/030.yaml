review_pass:
  verdict: revise
  source_fidelity: The draft conveys the sequence and principal sense well, including the temple-precinct sense of ἱερόν. However, «wee nọ n'ọgba aghara» is aspectually and idiomatically weak for the city's sudden disturbance, and «dọkpụrụ» does not reflect the imperfective force of εἷλκον as well as a progressive Igbo construction can.
  naturalness: «Obodo ahụ dum wee banye n'ọgba aghara» is more natural Standard Igbo for a city thrown into public turmoil. «ha nọ na-adọkpụ ya» clearly and naturally presents the dragging as an action in progress. Removing the possessive «ya» from «ọnụ ụzọ ya» also avoids an unnecessary and potentially unclear antecedent.
  terminology: «Mpaghara ụlọ nsọ» appropriately represents ἱερόν as the temple complex/precincts rather than the inner sanctuary. Pọl is the standard Igbo form of the name. No theological terminology is at issue.
  issues:
  - severity: medium
    issue: «wee nọ n'ọgba aghara» is not the most idiomatic expression for the Greek passive ἐκινήθη in this context.
    rationale: The Greek describes the whole city being set in motion or thrown into an uproar. «Wee banye n'ọgba aghara» expresses that sudden civic disturbance more naturally without adding interpretation.
  - severity: low
    issue: The imperfect εἷλκον is rendered as a simple completed action in «dọkpụrụ ya».
    rationale: The Greek portrays the mob in the process of dragging Paul out. «Ha nọ na-adọkpụ ya» preserves this imperfective presentation in clear modern Igbo.
  - severity: low
    issue: «ọnụ ụzọ ya» supplies a singular possessive not expressed in the Greek.
    rationale: The source has the definite plural «the doors.» «E mechiri ọnụ ụzọ» is natural Igbo and avoids an unnecessary referential addition.
  revised_text: Obodo ahụ dum wee banye n'ọgba aghara, ndị mmadụ wee gbakọta ọnụ[a]. Mgbe ha jidesịrị Pọl, ha nọ na-adọkpụ ya pụọ na mpaghara ụlọ nsọ[b], ozugbo ahụ e mechiri ọnụ ụzọ[c].
  revised_footnotes:
