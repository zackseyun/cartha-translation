revisions:
- from: Obodo ahụ dum wee nọ n'ọgba aghara, ndị mmadụ wee gbakọta n'ìgwè[a]. Ha jidere Pọl, dọkpụrụ ya pụọ n'ogige ụlọ nsọ[b], ozugbo ahụkwa, e mechiri ọnụ ụzọ ya[c].
  to: Obodo ahụ dum wee banye n'ọgba aghara, ndị mmadụ wee gbakọta ọnụ[a]. Mgbe ha jidesịrị Pọl, ha nọ na-adọkpụ ya pụọ na mpaghara ụlọ nsọ[b], ozugbo ahụ e mechiri ọnụ ụzọ[c].
  rationale: The revision retains the draft's accurate treatment of the crowd, Paul's seizure, the temple precincts, and the immediate closing of the doors. It replaces an awkward idiom for the city's turmoil, represents the imperfect dragging action more explicitly, and removes an unstated possessive. Footnote anchors are placed directly after the relevant terms and are retained in a consistent order.
