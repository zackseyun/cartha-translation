  text: ἐκινήθη τε ἡ πόλις ὅλη καὶ ἐγένετο συνδρομὴ τοῦ λαοῦ, καὶ ἐπιλαβόμενοι τοῦ Παύλου εἷλκον αὐτὸν ἔξω τοῦ ἱεροῦ, καὶ εὐθέως ἐκλείσθησαν αἱ θύραι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/030.yaml
  text: And the whole city was stirred up[a], and a crowd of the people formed; and after seizing Paul, they dragged him outside the temple[c][b], and immediately the doors were shut.
translation:
  language: ig
  text: Obodo ahụ dum wee banye n'ọgba aghara, ndị mmadụ wee gbakọta ọnụ[a]. Mgbe ha jidesịrị Pọl, ha nọ na-adọkpụ ya pụọ na mpaghara ụlọ nsọ[b], ozugbo ahụ e mechiri ọnụ ụzọ[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “ndị mmadụ ji ọsọ gbakọta ọnụ.” Okwu Grik ahụ na-egosi na ìgwè mmadụ gbakọtara na mberede.
    reason: lexical_alternative
  - marker: b
    text: Okwu Grik bụ ἱερόν, nke na-ezo aka na mpaghara ụlọ nsọ niile, ọ bụghị naanị ime ebe nsọ ahụ.
    reason: cultural_note
  - marker: c
    text: A pụkwara ịsụ ya, “e mechiri ọnụ ụzọ ámá,” n'ihi na okwu ahụ nwere ike ịpụta ọnụ ụzọ ámá ndị e ji abanye na mpaghara ụlọ nsọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκινήθη
  choice: wee nọ n'ọgba aghara
  rationale: N'ebe a, ngwaa a na-egosi na ọgba aghara kpaliri obodo ahụ dum, ọ bụghị naanị na ihe mere ka obodo ahụ megharịa ahụ. Nhọrọ a bụ Igbo doro anya ma na-edobe echiche nke mkpasu iwe ọha.
- source_word: ἡ πόλις ὅλη
  choice: Obodo ahụ dum
  rationale: Nke a na-edobe oke okwu Grik ahụ nke na-ekwu banyere obodo ahụ niile.
- source_word: ἐγένετο συνδρομὴ τοῦ λαοῦ
  choice: ndị mmadụ wee gbakọta n'ìgwè
  rationale: συνδρομή na-akọwa ndị mmadụ ji ọsọ ma ọ bụ na mberede gbakọta ọnụ. Nsụgharị a na-egosi nnọkọ ìgwè mmadụ n'Igbo eke.
- source_word: ἐπιλαβόμενοι τοῦ Παύλου
  choice: Ha jidere Pọl
  rationale: ἐπιλαμβάνομαι ebe a pụtara ijide mmadụ n'ike. Usoro ahịrịokwu ahụ na-eme ka o doo anya na njide ahụ buru ụzọ tupu ịdọkpụrụ ya.
- source_word: εἷλκον
  choice: dọkpụrụ ya
  rationale: Imperfect Grik na-egosi omume na-aga n'ihu, ma n'Igbo, ngwaa a n'ime usoro akụkọ na-egosi omume ahụ nke ọma n'enweghị mgbagwoju anya.
- source_word: ἔξω τοῦ ἱεροῦ
  choice: pụọ n'ogige ụlọ nsọ
  rationale: ἱερόν na-ezo aka n'ogige na mpaghara ụlọ nsọ niile, ọ bụghị kpọmkwem ime ebe nsọ ahụ. 'Ogige ụlọ nsọ' na-egosipụta nkọwa a n'ụzọ ndị na-agụ akwụkwọ ga-aghọta.
- source_word: εὐθέως
  choice: ozugbo ahụkwa
  rationale: Nke a na-edobe echiche nke ihe mere n'otu ntabi anya ma na-ejikọta nkebi ahịrịokwu ahụ nke ọma.
- source_word: ἐκλείσθησαν αἱ θύραι
  choice: e mechiri ọnụ ụzọ ya
  rationale: Ụdị a na-edobe olu nnara nke Grik. 'Ọnụ ụzọ' nwere ike ịgụnye ọnụ ụzọ ámá ndị e ji abanye n'ogige ụlọ nsọ; nnọchiaha 'ya' na-egosi na ha bụ nke ogige ụlọ nsọ ahụ.
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E kewara ahịrịokwu ahụ ụzọ abụọ maka ịdị mfe ịgụ, ma e debere njikọ na usoro ihe omume dị na Grik.
