base_translation:
  language: en
  yaml_path: translation/nt/acts/021/023.yaml
  text: 'Therefore do what we tell you: we have four men who are under a vow of their own[a][b].'
translation:
  language: ig
  text: 'Ya mere, mee ihe anyị na-agwa gị: anyị nwere ndị ikom anọ ndị nkwa dị n’ahụ ha[a][b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị kwere nkwa.” N’okwu Grik, a sị kpọmkwem, “ndị nwere nkwa.”
    reason: lexical_alternative
  - marker: b
    text: Ihe ndị gbara amaokwu a gburugburu nwere ike igosi nkwa yiri nke onye Naziraịtị, ma amaokwu a n’onwe ya kwuru naanị “nkwa.”
    reason: cultural_note
lexical_decisions:
- source_word: τοῦτο οὖν
  choice: Ya mere
  rationale: οὖν na-egosi nkwubi okwu sitere n'ihe e kwuru tupu ya; ‘Ya mere’ bụ ụzọ Igbo dị mfe ma kwesị ekwesị isi jikọta echiche ahụ, ebe ihe ποίησον ga-eme pụtara n'okwu na-esote.
- source_word: ποίησον
  choice: mee
  rationale: Aorist imperative nke ποιέω bụ iwu kpọmkwem; ‘mee’ na-enye ya n'ụzọ doro anya ma bụrụkwa Igbo nkịtị.
- source_word: ὅ σοι λέγομεν
  choice: ihe anyị na-agwa gị
  rationale: Nkebi okwu a bụ ihe e nyere iwu ka Pọl mee. ‘Ihe anyị na-agwa gị’ na-egosipụta present λέγομεν n'Igbo dị ndụ.
- source_word: εἰσὶν ἡμῖν
  choice: anyị nwere
  rationale: Ọdịdị existential ya na dative ἡμῖν na-arụ ọrụ dị ka inwe ihe; ‘anyị nwere’ bụ ntụgharị Igbo kachasị eke.
- source_word: ἄνδρες τέσσαρες
  choice: ndị ikom anọ
  rationale: ἀνήρ na-ezo aka n'ụmụ nwoke torola eto; ‘ndị ikom anọ’ na-echekwa ma ọnụọgụ ma nwoke ha bụ.
- source_word: εὐχὴν ἔχοντες
  choice: ndị nọ n'okpuru nkwa
  rationale: Participial phrase ahụ na-egosi ọnọdụ na-aga n'ihu nke ndị nkwa ahụ ji. ‘Nọ n'okpuru nkwa’ bụ Igbo a na-aghọta nke ọma ma ọ naghị akọwapụta ụdị nkwa ahụ karịa ihe Grik kwuru.
- source_word: ἀφ’ ἑαυτῶν
  choice: ha ji aka ha kwe
  rationale: Nkebi okwu a na-egosi na nkwa ahụ bụ nke ndị ikom ahụ onwe ha, ọ bụghị nke onye ọzọ nyere ha. ‘Ha ji aka ha kwe’ na-enye echiche ahụ n'Igbo eke, n'enweghị ịmanye nkọwa omenala pụrụ iche.
theological_decisions:
- issue: Ụdị nkwa ahụ
  choice: E dere ya naanị dị ka ‘nkwa.’
  alternative: ‘Nkwa onye Naziraịt’ ma ọ bụ ‘nkwa yiri nke ndị Naziraịt.’
  rationale: Ọ bụ ezie na ihe gbara amaokwu a gburugburu nwere ike ime ka a chee maka nkwa ndị Naziraịt, amaokwu a n'onwe ya kwuru naanị εὐχήν, ya bụ ‘nkwa.’ Ya mere, ederede bụ isi anaghị etinye nkọwa karịrị ihe isi mmalite kwuru.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-agbaso usoro echiche nke Grik, ma e mere ọdịdị ‘εἰσὶν ἡμῖν’ ka ọ bụrụ ‘anyị nwere’ n'ihi na nke ahụ bụ Igbo eke. E chekwara mgbagwoju anya banyere ụdị nkwa ahụ site n'ịghara ịkpọ ya nkwa onye Naziraịt n'ederede bụ isi.
