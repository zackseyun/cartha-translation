    issue: Unnatural expression for the ship’s route
    rationale: “na-agafe ịga Finishia” combines “crossing” and “going” in an unidiomatic way. “na-agafe gaa Finishia” preserves the participial idea while reading naturally.
  - severity: medium
    issue: Potentially misleading rendering of ἀνήχθημεν
    rationale: “malite ịkwọpụ n’ụsọ mmiri” may imply rowing or specifically leaving a shore. The Greek maritime idiom means to put to sea/set sail; “malite njem n’ụgbọ mmiri” conveys this without adding a means of propulsion or an unmentioned shore.
