  yaml_path: translation/nt/acts/021/002.yaml
  text: And after finding a ship crossing over to Phoenicia[a], we went aboard and set sail.
translation:
  language: ig
  text: Mgbe anyị chọtara ụgbọ mmiri na-agafe gaa Finishia[a], anyị banyere n’ụgbọ ahụ, wee malite njem n’ụgbọ mmiri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ụgbọ mmiri na-aga Finishia.” N’asụsụ Grik, a kọwara ya kpọmkwem dị ka ụgbọ mmiri “na-agafe gaa Finishia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εὑρόντες
  choice: Mgbe anyị chọtara
  rationale: Aorist participle a na-egosi na ịchọta ụgbọ mmiri mere tupu ha abanye ma malite njem; ‘Mgbe anyị chọtara’ na-egosi usoro ihe ndị ahụ n’Igbo dị mfe.
- source_word: πλοῖον
  choice: ụgbọ mmiri
  rationale: Nke a bụ okwu Igbo a na-ejikarị akọwa ụgbọ e ji aga njem n’oké osimiri, dabara n’ọnọdụ njem Mediterenian.
- source_word: διαπερῶν εἰς Φοινίκην
  choice: na-agafe ịga Finishia
  rationale: Nke a na-edobe echiche participle nke ụgbọ mmiri ahụ na-agafe mmiri gaa ebe a kpọrọ aha, kama ịkọwa ya naanị dị ka ụgbọ ‘na-aga’ ebe ahụ.
- source_word: ἐπιβάντες
  choice: anyị banyere n’ime ya
  rationale: N’ọnọdụ njem mmiri, okwu a pụtara ịbanye n’ụgbọ; ịgbakwunye ‘n’ime ya’ na-eme ka ntụaka ya nye ụgbọ mmiri doo anya n’Igbo.
- source_word: ἀνήχθημεν
  choice: wee malite ịkwọpụ n’ụsọ mmiri
  rationale: N’ojiji gbasara ụgbọ mmiri, okwu a pụtara isi n’ụsọ mmiri pụọ ma malite njem n’oké osimiri; nsụgharị a bụ nke doro anya ma dị ndụ n’Igbo.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke oge a, dị ùgwù ma dị mfe nghọta. E debere usoro omume ndị dị n’amaokwu ahụ na nkọwa Grik nke ụgbọ ahụ ‘na-agafe,’ ebe ihe odide ntụaka na-enye ụzọ okwu Igbo nke na-adịkarị mfe.
