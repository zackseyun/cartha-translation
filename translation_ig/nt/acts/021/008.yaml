- from: N’echi ya, anyị si ebe ahụ pụọ, bịaruo Sizaria. Mgbe anyị banyere n’ụlọ Filip, onye na-ezisa ozi ọma, onye bụ otu n’ime mmadụ asaa ahụ[a], anyị nọrọ n’ụlọ ya.
  to: N’echi ya, anyị hapụrụ ebe ahụ ma bịarute Sizaria. Mgbe anyị banyere n’ụlọ Filip, onye na-ekwusa ozi ọma, onye bụ otu n’ime ndị asaa ahụ[a], anyị nọrọ na ya.
  rationale: The revision retains the source’s sequence and ambiguity while using more idiomatic Standard Igbo for arrival and a more precise expression for Philip’s role as εὐαγγελιστής. The footnote anchor remains attached to “ndị asaa ahụ,” the phrase it explains.
