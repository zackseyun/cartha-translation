id: ACT.21.8
reference: Acts 21:8
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τῇ δὲ ἐπαύριον ἐξελθόντες ⸀ἤλθομεν εἰς Καισάρειαν, καὶ εἰσελθόντες εἰς τὸν οἶκον Φιλίππου τοῦ εὐαγγελιστοῦ ὄντος ἐκ τῶν ἑπτὰ ἐμείναμεν παρ’ αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/008.yaml
  text: On the next day we departed and came to Caesarea[a], and entering the house of Philip the evangelist, who was one of the seven, we stayed with him.
translation:
  language: ig
  text: N’echi ya, anyị hapụrụ ebe ahụ ma bịarute Sizaria. Mgbe anyị banyere n’ụlọ Filip, onye na-ekwusa ozi ọma, onye bụ otu n’ime ndị asaa ahụ[a], anyị nọrọ na ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ya bụ, otu n’ime ndị ikom asaa ahụ a họpụtara na mbụ maka ọrụ ije ozi na Jerusalem (lee Ọrụ Ndịozi 6:3–6).
    reason: cross_reference
lexical_decisions:
- source_word: τῇ δὲ ἐπαύριον
  choice: N’echi ya
  rationale: Nke a bụ ụzọ Igbo dị mfe ma bụrụkwa nke e ji akọ akụkọ iji gosi na ihe a mere n’ụbọchị sochirinụ; ọ na-eburu usoro akụkọ δέ n’enweghị ịgbatị ya.
- source_word: ἐξελθόντες
  choice: anyị si ebe ahụ pụọ
  rationale: Nkebi a na-egosi na ha hapụrụ ebe ha nọ tupu ha amalite njem; ‘si ebe ahụ pụọ’ doro anya ma na-ada ka Igbo nkịtị.
- source_word: ἤλθομεν εἰς Καισάρειαν
  choice: bịaruo Sizaria
  rationale: N’akụkọ njem, ‘bịaruo’ na-egosi iru ebe a na-aga nke ọma. ‘Sizaria’ bụ nsụgharị mkpụrụokwu aha obodo Καισάρεια dabara n’Igbo.
- source_word: εἰσελθόντες εἰς τὸν οἶκον
  choice: Mgbe anyị banyere n’ụlọ
  rationale: ‘Mgbe anyị banyere’ na-edobe usoro omume nke participle Grik ma na-eme ka ahịrịokwu ahụ bụrụ Igbo sitere n’ọnụ.
- source_word: Φιλίππου
  choice: Filip
  rationale: Nke a bụ ọdịdị aha Φίλιππος a na-eji n’Igbo, nke dị mfe ịgụ na ịkpọ.
- source_word: τοῦ εὐαγγελιστοῦ
  choice: onye na-ezisa ozi ọma
  rationale: Nkọwa a na-ebupụta ọrụ εὐαγγελιστής n’Igbo doro anya, n’enweghị ịdabere n’okwu ụka pụrụ iche nke ụfọdụ ndị nwere ike ghara ịghọta.
- source_word: ὄντος ἐκ τῶν ἑπτὰ
  choice: onye bụ otu n’ime mmadụ asaa ahụ
  rationale: Nke a na-echekwa njirimara Filip dị ka otu onye n’ime ndị asaa a kpọtụrụ aha na mbụ, ma ghara ime ka okwu ahụ bụrụ aha ọkwa ọchịchị ụka.
- source_word: ἐμείναμεν παρ’ αὐτῷ
  choice: anyị nọrọ n’ụlọ ya
  rationale: N’ọnọdụ ile ọbịa a, okwu a pụtara na ha biri n’ebe Filip nọ ruo oge ụfọdụ. ‘Nọrọ n’ụlọ ya’ na-eme ka ihe παρά na-egosi doo anya n’Igbo.
theological_decisions:
- issue: Njirimara Filip dị ka ‘otu n’ime mmadụ asaa ahụ’
  choice: E debere ya dị ka nkọwa akụkọ ihe mere eme, ‘onye bụ otu n’ime mmadụ asaa ahụ.’
  alternative: Iji ‘otu n’ime Ndị Asaa’ mee ya ka ọ bụrụ aha ọkwa pụrụ iche.
  rationale: Amaokwu ahụ na-ezo aka na ndị ikom asaa a họpụtara na Ọrụ Ndịozi 6, ma ọ kpọghị ọrụ ha aha dịka ọkwa ụka e mechara hazie. Nsụgharị ahụ anaghị etinye echiche ọchịchị ụka nke ederede ahụ ekwughị.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E tinyere akara nkọwa ala peeji [a] ozugbo n’akụkụ ‘mmadụ asaa ahụ,’ ebe ihe nkọwa ahụ na-ezo aka, kama itinye ya n’akụkụ aha Sizaria.
