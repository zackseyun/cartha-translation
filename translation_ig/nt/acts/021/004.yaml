id: ACT.21.4
reference: Acts 21:4
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸂ἀνευρόντες δὲ τοὺς⸃ μαθητὰς ἐπεμείναμεν αὐτοῦ ἡμέρας ἑπτά, οἵτινες τῷ Παύλῳ ἔλεγον διὰ τοῦ πνεύματος μὴ ⸀ἐπιβαίνειν εἰς ⸀Ἱεροσόλυμα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/004.yaml
  text: After finding the disciples[a], we stayed there seven days. They kept telling Paul through the Spirit not to go up to Jerusalem.
translation:
  language: ig
  text: Mgbe anyị chọtara ndị na-eso ụzọ ahụ, anyị nọrọ n’ebe ahụ ụbọchị asaa. Ha nọgidere na-agwa Pọl site na Mmụọ[a] ka ọ ghara ịrịgo Jeruselem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Okwu a pụkwara ịsụgharị ya, “site n’aka Mmụọ.” O nwere ike ịbụ na Mmụọ kpughere Pọl ahụhụ na-echere ya, ndị na-eso ụzọ ahụ wee si na nke ahụ kwubie na o kwesịghị ịga Jeruselem.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνευρόντες
  choice: Mgbe anyị chọtara
  rationale: Aorist participle a na-egosi ihe mere tupu ngwaa bụ isi; nsụgharị a na-egosi usoro ihe omume ahụ n’Igbo doro anya.
- source_word: μαθητάς
  choice: ndị na-eso ụzọ ahụ
  rationale: Nke a bụ okwu Igbo a na-ejikarị akọwa μαθητής, ma na-echekwa echiche nke ndị na-eso Jizọs karịa okwu sara mbara dịka ‘ndị kwere ekwe.’
- source_word: ἐπεμείναμεν αὐτοῦ
  choice: anyị nọrọ n’ebe ahụ
  rationale: ἐπιμένω pụtara ịnọgide ma ọ bụ ịnọ, ebe αὐτοῦ bụ okwu na-egosi ebe n’ebe a; agbakwụnyeghị ‘anyị na ha’ n’ihi na nke ahụ adịghị kpọmkwem n’ihe odide Grik.
- source_word: ἡμέρας ἑπτά
  choice: ụbọchị asaa
  rationale: Accusative a na-egosi ogologo oge; usoro Igbo a na-enye echiche ahụ n'ụzọ eke.
- source_word: οἵτινες
  choice: Ha
  rationale: Ọ na-alaghachi n’ebe ‘ndị na-eso ụzọ ahụ’ nọ; ịmalite ahịrịokwu ọhụrụ na ‘Ha’ doro anya ma dịkwa mfe nghọta.
- source_word: ἔλεγον
  choice: nọgidere na-agwa
  rationale: Imperfect ahụ na-egosi omume gara n’ihu ma ọ bụ e mere ugboro ugboro; ‘nọgidere na-agwa’ na-echekwa nke a.
- source_word: διὰ τοῦ πνεύματος
  choice: site na Mmụọ
  rationale: διά na genitive na-egosi ụzọ ma ọ bụ onye e si n’aka ya mee ihe. ‘Site na Mmụọ’ na-echekwa okwu ahụ n’ebughị ụzọ kpebie ma Mmụọ nyere iwu kpọmkwem, ma ọ bụ kpughere ahụhụ ndị na-eso ụzọ jiri mee nkwubi okwu.
- source_word: μὴ ἐπιβαίνειν
  choice: ka ọ ghara ịrịgo
  rationale: N’ọnọdụ njem a, ἐπιβαίνω na-egosi ịga n’ebe ahụ; ‘ịrịgo’ na-echekwa ụzọ Akwụkwọ Nsọ si ekwu banyere njem a na-aga Jeruselem.
- source_word: εἰς Ἱεροσόλυμα
  choice: Jeruselem
  rationale: Aha obodo a na-arụ ọrụ dịka ebe njem ahụ na-aga; n’Igbo, ngwaa ‘ịrịgo’ nwere ike iso aha ebe ahụ ozugbo n’enweghị preposition ọzọ.
theological_decisions:
- issue: Mmekọrịta okwu διὰ τοῦ πνεύματος na njem Pọl na-aga Jeruselem
  choice: site na Mmụọ
  alternative: Mmụọ gwara ha ka ha machibido Pọl ịga
  rationale: Ihe odide ahụ kwuru na ha gwara Pọl okwu ‘site na Mmụọ,’ ma ọ naghị akọwa ma mmachibido ahụ n’onwe ya sitere n’aka Mmụọ, ka Mmụọ kpughere ahụhụ na-echere Pọl, ndị na-eso ụzọ wee si na ya kwubie na ọ gaghị aga. Nsụgharị bụ isi na-ahapụ esemokwu a ka ọ dị.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. ‘Ndị na-eso ụzọ,’ ‘nọgidere na-agwa,’ na ‘ịrịgo Jeruselem’ na-echekwa okwu ndị bụ isi na ọdịdị akụkọ ahụ n’enweghị mgbakwunye nkọwa n’ahịrịokwu bụ isi.
