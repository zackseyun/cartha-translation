  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἀσπασάμενος αὐτοὺς ἐξηγεῖτο καθ’ ἓν ἕκαστον ὧν ἐποίησεν ὁ θεὸς ἐν τοῖς ἔθνεσιν διὰ τῆς διακονίας αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/019.yaml
  text: And after greeting them[b][a], he began to relate one by one the things that God had done among the Gentiles through his ministry.
translation:
  language: ig
  text: Mgbe o kelechara ha, ọ kọọrọ ha n’otu n’otu[b] ihe ndị Chineke mere n’etiti ndị mba ọzọ[a] site n’ọrụ ozi ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’etiti mba dị iche iche.” N’ebe a, okwu ahụ na-ezo aka ná ndị mba ọzọ, ya bụ, ndị na-abụghị ndị Juu.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, “ọ kọwara ha nke ọma.” Ngwaa Grik ahụ na-egosi akụkọ sara mbara nke a kọrọ otu ihe n’otu oge.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπασάμενος
  choice: Mgbe o kelechara ha
  rationale: Nkebi a na-egosi omume mere tupu isi omume ahụ. Nke a bụ ụzọ Igbo dị mfe ma doo anya isi gosipụta usoro ihe ndị ahụ.
- source_word: ἐξηγεῖτο
  choice: ọ kọọrọ ha
  rationale: Okwu Grik a nwere ike ịpụta ịkọwa ma ọ bụ ịkọ akụkọ nke ọma. N’ebe a, ọ na-ezo aka n’akụkọ Pọl nyere ha banyere ọrụ ahụ; ọdịdị imperfect na-egosi na ọ bụ akụkọ na-aga n’ihu, ma Igbo ekwesịghị ịgbakwunye echiche ‘malitere’ nke ngwaa ahụ n’onwe ya anaghị achọ kpọmkwem.
- source_word: καθ’ ἓν ἕκαστον
  choice: n’otu n’otu
  rationale: Nke a na-echekwa echiche nke ịkọ ihe ndị ahụ otu ihe soro ibe ya, ọ bụghị nanị nchịkọta nkenke.
- source_word: ὧν ἐποίησεν ὁ θεὸς
  choice: ihe ndị Chineke mere
  rationale: Nsụgharị a na-edebe Chineke dịka onye mere ihe ndị ahụ ma na-ezo aka n’omume ndị a kapịrị ọnụ.
- source_word: ἐν τοῖς ἔθνεσιν
  choice: n’etiti ndị mba ọzọ
  rationale: N’ọnọdụ a, ἔθνη na-ezo aka ná ndị na-abụghị ndị Juu. ‘Ndị mba ọzọ’ bụ okwu Igbo a na-aghọta nke ọma ma ka na-enye ohere ịkọwa okwu ahụ n’ala ala peeji.
- source_word: διὰ τῆς διακονίας αὐτοῦ
  choice: site n’ọrụ ozi ya
  rationale: ‘Site n’ọrụ ozi ya’ na-egosi na ọrụ Pọl bụ ụzọ Chineke si rụọ ihe ndị ahụ, n’enweghị ịtụgharị διακονία ka ọ bụrụ ọkwa ụka pụrụ iche.
theological_decisions:
- issue: Onye bụ isi onye rụrụ ọrụ n’akụkọ ozi Pọl
  choice: E gosipụtara Chineke dịka onye mere ihe ndị ahụ, ebe ọrụ ozi Pọl bụ ụzọ o si mee ha.
  alternative: Ịsị na Pọl kọrọ ihe ndị ya onwe ya rụzuru n’etiti ndị mba ọzọ.
  rationale: ὁ θεὸς bụ isiokwu nke ἐποίησεν, ebe διὰ τῆς διακονίας αὐτοῦ na-egosi ụzọ e si rụọ ọrụ ahụ. Ya mere, nsụgharị ahụ na-edebe ma ọrụ Chineke ma ọrụ Pọl dịka onye na-eje ozi.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. ‘Ọrụ ozi’ na-ezere ime διακονία ka ọ bụrụ aha ọkwa ụka, ebe ‘n’otu n’otu’ na-echekwa ike nkesa nke akpaala okwu Grik.
