  text: ζητούντων ⸀τε αὐτὸν ἀποκτεῖναι ἀνέβη φάσις τῷ χιλιάρχῳ τῆς σπείρης ὅτι ὅλη ⸀συγχύννεται Ἰερουσαλήμ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/031.yaml
  text: And as they were seeking to kill him[b][a], a report went up to the commander of the cohort that all Jerusalem was in an uproar.
translation:
  language: ig
  text: Mgbe ha nọ na-achọ igbu ya, ozi rutere onyeisi otu ndị agha ahụ[b] na Jerusalem dum nọ n’ọgba aghara.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “Jerusalem dum nọ ná mgbagwoju anya,” ma ọ bụ “Jerusalem dum nọ n’ọnọdụ ọgba aghara.”
    reason: lexical_alternative
  - marker: b
    text: “Onyeisi otu ndị agha ahụ” bụ onyeisi agha Rom nọ n’ọkwa a na-akpọ tribune, onye na-achị otu ngalaba ndị agha Rom (cohort) e dọbara n’ebe ahụ.
    reason: cultural_note
lexical_decisions:
- source_word: ζητούντων τε
  choice: Mgbe ha nọ na-achọ
  rationale: Nkebiokwu a na-egosi omume na-aga n’ihu n’otu oge ahụ ihe ọzọ mere; nsụgharị a na-edobe echiche ahụ n’Igbo nkịtị.
- source_word: αὐτὸν ἀποκτεῖναι
  choice: igbu ya
  rationale: Nke a bụ ụzọ Igbo kpọmkwem na nke doro anya isi kwuo ἀποκτεῖναι.
- source_word: ἀνέβη φάσις
  choice: akụkọ rutere
  rationale: Ọ bụ akpaalaokwu na-egosi na ozi gara ruo n’ebe onyeisi agha nọ; 'rutere' bụ Igbo eke ma ghara ime ka ntụaka banyere ịrịgo ghọọ ihe na-edoghị anya.
- source_word: τῷ χιλιάρχῳ
  choice: onyeisi ndị agha
  rationale: χілίαρχος bụ onyeisi agha Rom nọ n'ọkwa dị elu; okwu a ghọtara ngwa ngwa karịa iji aha ọkwa Gris ma ọ bụ Latịn.
- source_word: τῆς σπείρης
  choice: nke otu agha ahụ
  rationale: σπεῖρα bụ ngalaba ndị agha Rom a na-akpọ cohort; 'otu agha' bụ okwu Igbo dị mfe, ebe nkọwa ala peeji na-enye nkọwa omenala zuru ezu.
- source_word: ὅτι ὅλη Ἰερουσαλήμ
  choice: na ... Jerusalem dum
  rationale: Nke a na-edobe metonymi nke obodo ahụ n’ụzọ dị mkpirikpi ma kwekọọ n’Igbo.
- source_word: συγχύννεται
  choice: ọgbaaghara jupụtara na
  rationale: Okwu a na-egosi na obodo ahụ nọ n’ọnọdụ mgbagwoju anya na ọgba aghara; nhọrọ a dabara n’ọnọdụ igwe mmadụ na-eme mkpọtụ.
