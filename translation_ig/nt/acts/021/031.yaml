revisions:
- from: Mgbe ha nọ na-achọ igbu ya, akụkọ rutere onyeisi ndị agha nke otu agha ahụ[b] na ọgbaaghara jupụtara na Jerusalem dum.[a]
  to: Mgbe ha nọ na-achọ igbu ya, ozi rutere onyeisi otu ndị agha ahụ[b] na Jerusalem dum nọ n’ọgba aghara.[a]
  rationale: The revision renders the report as “ozi” and expresses the Greek description of Jerusalem as being in a state of public turmoil rather than as turmoil filling the city. It also makes the command relationship to the cohort more concise and clear. The alternatives and historical footnote remain properly anchored and do not alter the verse’s meaning.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T09:22:06Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the ongoing attempt to kill Paul, the report reaching the military commander, and the citywide disturbance. However, “ọgbaaghara jupụtara na Jerusalem dum” shifts the Greek predicate into an idiom of disorder ‘filling’ the city, whereas συγχύννεται directly predicates a state of turmoil/confusion of the whole city. “Ozi rutere” is also a more natural equivalent for φάσις in this context.
  naturalness: “Ozi rutere ... na Jerusalem dum nọ n’ọgba aghara” is clear, idiomatic Standard Igbo and retains the narrative register. “Onyeisi otu ndị agha ahụ” avoids the slightly cumbersome and potentially broader “onyeisi ndị agha nke otu agha ahụ.”
  terminology: The revised wording keeps the military unit general in the text while the footnote identifies it as a Roman cohort and its commander as a tribune. This appropriately supplies historical context without adding it to the verse itself.
  issues:
  - severity: medium
    issue: The expression “ọgbaaghara jupụtara na Jerusalem dum” is not the closest rendering of συγχύννεται.
    rationale: The Greek says that all Jerusalem ‘was in confusion/turmoil,’ not specifically that turmoil filled it. Recasting it as a citywide state preserves both the predicate and the present/imperfective sense.
  - severity: low
    issue: “Akụkọ rutere” is less natural here than “ozi rutere.”
    rationale: Φάσις denotes a report or news. In this narrative context, “ozi rutere” naturally expresses that information reached the commander.
  revised_text: Mgbe ha nọ na-achọ igbu ya, ozi rutere onyeisi otu ndị agha ahụ[b] na Jerusalem dum nọ n’ọgba aghara.[a]
  revised_footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “Jerusalem dum nọ ná mgbagwoju anya,” ma ọ bụ “Jerusalem dum nọ n’ọnọdụ ọgba aghara.”
    reason: lexical_alternative
  - marker: b
    text: “Onyeisi otu ndị agha ahụ” bụ onyeisi agha Rom nọ n’ọkwa a na-akpọ tribune, onye na-achị otu ngalaba ndị agha Rom (cohort) e dọbara n’ebe ahụ.
    reason: cultural_note
  revision_rationale: The revision renders the report as “ozi” and expresses the Greek description of Jerusalem as being in a state of public turmoil rather than as turmoil filling the city. It also makes the command relationship to the cohort more concise and clear. The alternatives and historical footnote remain properly anchored and do not alter the verse’s meaning.
