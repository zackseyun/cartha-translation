  text: οὐκ ἄρα σὺ εἶ ὁ Αἰγύπτιος ὁ πρὸ τούτων τῶν ἡμερῶν ἀναστατώσας καὶ ἐξαγαγὼν εἰς τὴν ἔρημον τοὺς τετρακισχιλίους ἄνδρας τῶν σικαρίων;
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/038.yaml
  text: Then you are not the Egyptian who some days ago stirred up a revolt and led the four thousand men of the assassins out into the wilderness?[a]
translation:
  language: ig
  text: “Ọ̀ bụ na ị bụghị onye Ijipt ahụ, bụ́ onye kpalitere nnupụisi ụbọchị ole na ole gara aga, durukwa ndị ikom puku anọ ahụ, bụ́ ndị Sicarii, gaa n’ọzara?[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “ndị ji mma mkpụmkpụ egbu mmadụ”; n’asụsụ Grik, “ndị Sicarii,” bụ́ otu ndị a maara maka iji mma zoro ezo wakpo ma gbuo mmadụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ἄρα
  choice: Ọ̀ bụ na ị bụghị
  rationale: Ajụjụ a na-egosi nkwubi okwu onyeisi agha ahụ na-amalite iwepụta mgbe ọ nụrụ Pọl ka ọ na-asụ Grik; usoro a bụ nke okike n’Igbo ma na-edobe ajụjụ na-atụ anya nkwenye.
- source_word: ὁ Αἰγύπτιος
  choice: onye Ijipt ahụ
  rationale: Mkpọaha ahụ na-ezo aka n’otu onye a ma ama ma ọ bụ onye ọjọọ amaara ndị na-ekwu okwu; “ahụ” na-egosipụta kpọmkwem onye ahụ.
- source_word: πρὸ τούτων τῶν ἡμερῶν
  choice: ụbọchị ole na ole gara aga
  rationale: Nke a na-enye echiche nke obere oge tupu oge ahụ n’Igbo doro anya, n’etinyeghị oge a na-akọwaghị n’isi mmalite.
- source_word: ἀναστατώσας
  choice: kpalitere nnupụisi
  rationale: N’ọnọdụ ndọrọ ndọrọ ọchịchị a, ngwaa ahụ na-egosi ịkpali ọgba aghara ma ọ bụ nnupụisi, ọ bụghị naanị ime ka ihe ghara ịdị n’usoro.
- source_word: ἐξαγαγὼν
  choice: durukwa ... gaa
  rationale: Ọ na-egosi idu otu ìgwè mmadụ pụọ gaa ebe ọzọ; ebe mmalite adịghị mkpa ikwupụta n’Igbo ka ihe okwu ahụ pụtara wee doo anya.
- source_word: εἰς τὴν ἔρημον
  choice: gaa n’ọzara
  rationale: “Ọzara” nwere ike ịpụta ala kpọrọ nkụ ma ọ bụ ebe mmadụ na-ebighị, ya mere ọ naghị amanye echiche nke ala ájá naanị.
- source_word: τοὺς τετρακισχιλίους ἄνδρας
  choice: puku ndị ikom anọ ahụ
  rationale: “Ahụ” na-edobe nkọwapụta nke otu ìgwè a kapịrị ọnụ nke mkpụrụokwu Grik nwere artịkụl na-egosi.
- source_word: τῶν σικαρίων
  choice: so ná ndị ogbu mmadụ
  rationale: Nke a na-agwa onye na-agụ Igbo ọrụ otu a nke ọma. Ihe odide ala peeji na-edobe nsụgharị nkịtị na aha akụkọ ihe mere eme Sicarii.
theological_decisions: []
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-edobe ụda ajụjụ onyeisi agha nke na-enyo enyo ma na-eme nkwubi okwu. E tinyere akara ụda naanị n’ebe ọ na-enyere aka izere mgbagwoju anya; e jighị okwu okpukpe nke otu ụka pụrụ iche.
