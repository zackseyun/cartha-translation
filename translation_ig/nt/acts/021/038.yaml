  to: “Ọ̀ bụ na ị bụghị onye Ijipt ahụ, bụ́ onye kpalitere nnupụisi ụbọchị ole na ole gara aga, durukwa ndị ikom puku anọ ahụ, bụ́ ndị Sicarii, gaa n’ọzara?[a]”
