source:
  edition: SBLGNT
  text: ⸀ἀναφάναντες δὲ τὴν Κύπρον καὶ καταλιπόντες αὐτὴν εὐώνυμον ἐπλέομεν εἰς Συρίαν, καὶ ⸀κατήλθομεν εἰς Τύρον, ἐκεῖσε γὰρ ⸂τὸ πλοῖον ἦν⸃ ἀποφορτιζόμενον τὸν γόμον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/003.yaml
  text: After sighting Cyprus and leaving it on our left[a], we sailed on to Syria and came down to Tyre[d][c][b], for there the ship was unloading its cargo.
translation:
  language: ig
  text: Mgbe anyị hụrụ Saịprọs, anyị hapụrụ ya n’aka ekpe anyị[a], jiri ụgbọ mmiri gawa Siria, wee rute Taya[b], n’ihi na ọ bụ n’ebe ahụ ka ụgbọ mmiri ahụ nọ na-ebutu ngwongwo ya[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ya bụ, Saịprọs nọgidere n’aka ekpe nke ụgbọ mmiri ahụ ka ha na-aga.
    reason: cultural_note
  - marker: b
    text: N’ụzọ nkịtị, ‘wee gbadata Taya.’ A pụkwara ịsụ ya, ‘wee bịarute Taya.’
    reason: lexical_alternative
  - marker: c
    text: A pụkwara ịsụ ya, ‘ka a nọ na-ebutu ngwongwo dị n’ụgbọ mmiri ahụ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναφάναντες
  choice: Mgbe anyị hụrụ
  rationale: Nkebi aorist a na-egosi ihe mere tupu njem ahụ gara n’ihu. ‘Mgbe anyị hụrụ’ bụ okwu Igbo doro anya nke na-egosi na Saịprọs batara ha n’anya ka ha nọ n’oké osimiri.
- source_word: καταλιπόντες αὐτὴν εὐώνυμον
  choice: anyị hapụrụ ya n’aka ekpe anyị
  rationale: εὐώνυμον pụtara ‘n’aka ekpe.’ Nsụgharị a na-edobe nkọwa ụzọ ụgbọ mmiri ahụ si gafee Saịprọs n’enweghị iji okwu ndị ọrụ ụgbọ mmiri pụrụ iche.
- source_word: ἐπλέομεν εἰς Συρίαν
  choice: jiri ụgbọ mmiri gawa Siria
  rationale: ἐπλέομεν na-akọ njem mmiri na-aga n’ihu. Okwu a bụ Igbo eke ma na-egosi ma ụzọ njem ahụ ma ebe ha na-aga.
- source_word: κατήλθομεν εἰς Τύρον
  choice: wee rute Taya
  rationale: Ọ bụ ezie na κατέρχομαι pụtara n’ụzọ nkịtị ‘rịdata/gadata,’ n’akụkọ njem ọ na-arụkarị ọrụ nke ịkọ iru ebe. ‘Rute Taya’ bụ Igbo eke; e debere ụzọ okwu Grik si dị na nkọwa ala peeji.
- source_word: ἀποφορτιζόμενον
  choice: nọ na-ebutu
  rationale: Present middle/passive participle ya na ἦν na-egosi ihe nọ na-eme. ‘Nọ na-ebutu’ na-enye ụgbọ mmiri ahụ dị ka isiokwu dịka usoro okwu Grik si dị, ma olu mmebe a pụkwara ịghọta dịka passive.
- source_word: τὸν γόμον
  choice: ibu ya
  rationale: γόμος bụ ibu ma ọ bụ ngwongwo e bu n’ụgbọ mmiri. ‘Ibu ya’ bụ okwu Igbo dị mfe ma doo anya na ọ bụ ibu dị n’ụgbọ mmiri ahụ.
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. A zere okwu ndị ọrụ ụgbọ mmiri pụrụ iche, ma debe nkọwa ụzọ njem ahụ na ihe na-aga n’ihu n’ụgbọ mmiri ahụ.
