  verdict: revise
  source_fidelity: The draft accurately represents the sequence of sighting Cyprus, leaving it on the left, sailing to Syria, arriving at Tyre, and the ship’s ongoing unloading. The expression “ibu ya,” however, is broader than γόμος and can sound like a burden rather than a ship’s freight.
  naturalness: The sentence is generally natural Standard Igbo. Replacing “ibu ya” with “ngwongwo ya” gives a clearer and more idiomatic reference to cargo in this nautical setting.
  terminology: Saịprọs, Siria, and Taya are suitable established Igbo forms. “Ngwongwo” is preferable here for γόμος, while “na-ebutu” appropriately conveys the ongoing unloading activity without forcing a disputed active/passive distinction.
  issues:
  - severity: low
    issue: “ibu ya” is semantically broad for the ship’s cargo.
    rationale: Greek γόμος specifically denotes freight or cargo. “Ngwongwo ya” more clearly identifies the goods being unloaded while preserving the sense.
