id: ACT.21.20
reference: Acts 21:20
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οἱ δὲ ἀκούσαντες ἐδόξαζον τὸν ⸀θεόν, ⸂εἶπόν τε⸃ αὐτῷ· Θεωρεῖς, ἀδελφέ, πόσαι μυριάδες εἰσὶν ⸂ἐν τοῖς Ἰουδαίοις⸃ τῶν πεπιστευκότων, καὶ πάντες ζηλωταὶ τοῦ νόμου ὑπάρχουσιν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/020.yaml
  text: When they heard this[a], they glorified God, and they said to him, “You see, brother, how many myriads there are among the Jews who have believed[b], and they are all zealous for the law.”
translation:
  language: ig
  text: Mgbe ha nụrụ nke a, ha na-enye Chineke otuto, sịkwa ya, “Nwanne, ị na-ahụ ọtụtụ puku kwuru puku[a] ndị dị n’etiti ndị Juu[b] bụ́ ndị kweere, ha niile na-anụ ọkụ n’obi n’ebe Iwu ahụ dị.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ọtụtụ iri puku.” Okwu Grik μυριάδες nwere ike ịpụta otu otu iri puku, ma ọ bụ, n’ozuzu ya, ọnụ ọgụgụ dị nnọọ ukwuu.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ndị Judia,” ma ọ bụrụ na a ghọta okwu a dị ka nke na-ezo aka n’ebe ha si, kama ịbụ agbụrụ na okpukpe ha.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσαντες
  choice: Mgbe ha nụrụ nke a
  rationale: Nkebi a na-egosi oge; e tinyere “nke a” n’ụzọ Igbo si ekwu okwu iji zoo aka n’akụkọ Pọl kwuru n’amaokwu bu ụzọ.
- source_word: ἐδόξαζον τὸν θεόν
  choice: ha nyere Chineke otuto
  rationale: Nke a na-echekwa echiche nke inye Chineke ebube ma na-ada ka Igbo dị ugwu ma bụrụkwa nke a na-aghọta ngwa ngwa.
- source_word: εἶπόν τε αὐτῷ
  choice: sịkwa ya
  rationale: “-kwa” na-egosipụta njikọ τε n’ụzọ dị mkpirikpi ma dị n’usoro akụkọ Igbo.
- source_word: Θεωρεῖς, ἀδελφέ
  choice: Nwanne anyị, ị na-ahụ
  rationale: “Ị na-ahụ” na-egosipụta okwu e ji adọta uche Pọl; “nwanne anyị” bụ ụzọ Igbo nkịtị na nke nkwanye ùgwù si akpọ otu nwoke nọ n’ọgbakọ okwukwe.
- source_word: πόσαι μυριάδες
  choice: ọtụtụ puku kwuru puku
  rationale: μυριάδες pụrụ ịpụta ọtụtụ iri puku kpọmkwem ma ọ bụ ọnụ ọgụgụ dị nnọọ ukwuu. “Puku kwuru puku” na-echekwa nnukwu ọnụ ọgụgụ ahụ n’Igbo nkịtị, ebe ndetu na-enye nkọwa a kapịrị ọnụ karị.
- source_word: ἐν τοῖς Ἰουδαίοις
  choice: ndị dị n’etiti ndị Juu
  rationale: Nke a na-echekwa ọdịdị “n’etiti ndị Juu” nke Grik, n’enweghị ime ka ọ bụrụ naanị ebe obibi ha.
- source_word: τῶν πεπιστευκότων
  choice: bụ́ ndị kweere
  rationale: 'Nke a na-echekwa ọdịdị ngwaa nke participle zuru oke: ha abịala n’okwukwe ma nọgide bụrụ ndị kweere.'
- source_word: πάντες ζηλωταὶ τοῦ νόμου ὑπάρχουσιν
  choice: ha niile na-anụkwa ọkụ n’obi n’ebe Iwu ahụ dị
  rationale: Nke a na-egosipụta ịnụ ọkụ n’obi siri ike ha nwere maka Iwu Mosis, ma ọ naghị agbakwụnye ihe gbasara otu ha si eme ya.
theological_decisions:
- issue: Ihe ἐν τοῖς Ἰουδαίοις na-ezo aka na ya
  choice: n’etiti ndị Juu
  alternative: n’etiti ndị Judia
  rationale: Ọnọdụ a na-ekwu banyere njirimara ndị Juu na ịnụ ọkụ n’obi ha maka Iwu ahụ, ọ bụghị naanị banyere ibi na Judia. Ma a hapụrụ nghọta metụtara ebe n’ime ndetu.
- issue: Ike okwu μυριάδες
  choice: ọtụtụ puku kwuru puku
  alternative: ọtụtụ iri puku
  rationale: Okwu Grik ahụ nwere ike ịbụ nkeji iri puku kpọmkwem ma ọ bụ okwu sara mbara maka ọnụ ọgụgụ dị ukwuu. Nsụgharị isi na-echekwa ịdị obosara ahụ, ndetu echekwakwa nghọta a kapịrị ọnụ.
- issue: Ihe “Iwu ahụ” pụtara
  choice: Iwu ahụ
  alternative: Iwu Mosis
  rationale: Ọnọdụ okwu ahụ na-eme ka o doo anya na ọ bụ Iwu Mosis, ya mere ekwesịghị itinye “Mosis” n’ahịrị ma mee ihe zoro ezo ka ọ bụrụ ihe e kwuru kpọmkwem.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. A họọrọ usoro okwu na-aga nke ọma n’Igbo, ma e chekwara nghọta sara mbara nke μυριάδες na Ἰουδαῖοι site na ndetu.
