revisions:
- from: Mgbe ha nụrụ nke a, ha nyere Chineke otuto, sịkwa ya, “Nwanne anyị, ị na-ahụ ọtụtụ puku kwuru puku[a] ndị dị n’etiti ndị Juu[b] bụ́ ndị kweere, ha niile na-anụkwa ọkụ n’obi n’ebe Iwu ahụ dị.”
  to: Mgbe ha nụrụ nke a, ha na-enye Chineke otuto, sịkwa ya, “Nwanne, ị na-ahụ ọtụtụ puku kwuru puku[a] ndị dị n’etiti ndị Juu[b] bụ́ ndị kweere, ha niile na-anụ ọkụ n’obi n’ebe Iwu ahụ dị.”
  rationale: Removed the added possessive from the address to Paul, represented the imperfective force of ἐδόξαζον more closely, removed an unrequired emphatic -kwa from the final clause, and made footnote a natural and lexically precise. The ambiguity concerning μυριάδες and Ἰουδαίοις remains preserved in the notes.
