  text: μὴ πειθομένου δὲ αὐτοῦ ἡσυχάσαμεν εἰπόντες· ⸂Τοῦ κυρίου τὸ θέλημα⸃ ⸀γινέσθω.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/014.yaml
  text: And since he would not be persuaded[a], we became quiet, saying, “The Lord’s will be done.”
translation:
  language: ig
  text: Ma ebe ọ bụ na a pụghị ime ka o kwenye, anyị dara jụụ[a], sị, “Ka e mee uche Onyenweanyị.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “anyị gbachiri nkịtị.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ πειθομένου δὲ αὐτοῦ
  choice: Ma ebe ọ bụ na o kweghị ka anyị mee ka ọ gbanwee obi
  rationale: Nkebiokwu a na-egosi na Pọl ekweghị ka arịrịọ ha mee ka ọ gbanwee mkpebi ya. Nsụgharị a na-edobe echiche nke πείθω n’ọnọdụ a n’enweghị ịkọwa ya dị ka nanị ‘ige ntị.’
- source_word: ἡσυχάσαμεν
  choice: anyị kwụsịrị okwu ahụ[a]
  rationale: N’ebe a, ἡσυχάζω pụtara na ha kwụsịrị ịrụ ụka ma ọ bụ ịrịọsi ya ike. ‘Anyị kwụsịrị okwu ahụ’ bụ Igbo nkịtị ma doo anya, ebe nkọwa ala peeji na-edobe nsụgharị nke dị nso n’ụdị okwu Grik.
- source_word: εἰπόντες
  choice: sị
  rationale: ‘Sị’ na-ejikọta ihe ha kwuru na omume bụ́ isi n’ụzọ dị mkpụmkpụ ma bụrụkwa Igbo ebumpụta ụwa.
- source_word: Τοῦ κυρίου
  choice: Onyenweanyị
  rationale: ‘Onyenweanyị’ bụ aha nsọpụrụ a na-aghọta nke ọma n’Igbo maka κύριος; ọ naghị akpọpụta onye okwu ahụ na-ezo aka na ya karịa ka Grik mere.
- source_word: τὸ θέλημα
  choice: uche
  rationale: ‘Uche’ n’ahịrịokwu a na-egosi ihe Onyenweanyị chọrọ ma ọ bụ kpebiri, ya bụ θέλημα.
- source_word: γινέσθω
  choice: Ka e mee
  rationale: Ụdị a na-egosi iwu/arịrịọ nke onye na-edo onwe ya n’okpuru ihe Onyenweanyị chọrọ, ma na-edobe okwu ahụ n’enweghị ime ka ọ bụrụ naanị amụma banyere ihe ga-eme.
theological_decisions:
- issue: Nsụgharị κύριος
  choice: Onyenweanyị
  alternative: Nna ukwu
  rationale: ‘Onyenweanyị’ bụ okwu Igbo a na-eji n’ụzọ kwesịrị ekwesị maka aha nsọpụrụ ‘Lord.’ A hapụrụ onye ọ na-ezo aka na ya n’ogo ahụ ederede Grik hapụrụ ya, kama ịgbakwunye ‘Jizọs.’
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. ‘Anyị kwụsịrị okwu ahụ’ na-egosi na ha kwụsịrị ịrụgide Pọl, ebe nkọwa ala peeji na-edobe nsụgharị nkịtị ọzọ nke ἡσυχάσαμεν.
