id: ACT.21.29
reference: Acts 21:29
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἦσαν γὰρ ⸀προεωρακότες Τρόφιμον τὸν Ἐφέσιον ἐν τῇ πόλει σὺν αὐτῷ, ὃν ἐνόμιζον ὅτι εἰς τὸ ἱερὸν εἰσήγαγεν ὁ Παῦλος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/029.yaml
  text: For they had previously seen Trophimus the Ephesian in the city with him[a], and they supposed that Paul had brought him into the temple.
translation:
  language: ig
  text: N’ihi na ha ahụbuola Trofimọs, onye Efesọs, mgbe ya na Pọl nọ n’obodo ahụ; ha wee chee na Pọl kpọbatara ya n’ogige ụlọ nsọ ahụ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Okwu Grik a sụgharịrị “ogige ụlọ nsọ” na-ezo aka n’ogige na mpaghara ụlọ nsọ dum, ọ bụghị naanị n’ime ebe nsọ ahụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦσαν ... προεωρακότες
  choice: ha ahụbuola
  rationale: Ngwaa ‘ahụbuola’ na-egosi na ịhụ ahụ mere tupu ọgba aghara a, ma na-asụgharị periphrastic pluperfect Greek n’ụzọ Igbo dị nkenke ma bụrụ nke eke.
- source_word: Τρόφιμον τὸν Ἐφέσιον
  choice: Trofimọs onye Efesọs
  rationale: Nkebi a na-akọwa ebe Trofimọs si; ‘onye Efesọs’ bụ ụzọ Igbo doro anya si chekwaa apposition ahụ.
- source_word: ἐν τῇ πόλει
  choice: n’obodo ahụ
  rationale: Ọ na-ezo aka n’obodo Jerusalem nke a maara site n’akụkọ gbara ya gburugburu, dị iche n’ogige ụlọ nsọ.
- source_word: σὺν αὐτῷ
  choice: ka ya na Pọl nọ
  rationale: A kpọrọ Pọl aha kama iji naanị nnọchiaha, iji gbochie mgbagwoju anya n’Igbo; nke a ka na-echekwa echiche nke Trofimọs iso ya nọ.
- source_word: ἐνόμιζον
  choice: ha wee chee
  rationale: ‘Chee’ na-egosi nkwubi okwu ha mere site n’ihe ha hụrụ, ọ bụghị ihe ha maara n’ezie.
- source_word: εἰς τὸ ἱερόν
  choice: n’ogige ụlọ nsọ ahụ
  rationale: ἱερόν na-ezo aka n’ụlọ nsọ dum na ogige ya, ọ bụghị kpọmkwem ime ebe nsọ (ναός). ‘Ogige ụlọ nsọ’ na-eme ka nke a doo anya n’Igbo.
- source_word: εἰσήγαγεν
  choice: kpọbatara
  rationale: ‘Kpọbatara’ na-egosi iduru ma ọ bụ iweta mmadụ banye n’ebe ahụ, ma kwekọọ na ebubo a na-ekwu.
theological_decisions:
- issue: Ihe ἱερόν pụtara n’ebubo e boro Pọl
  choice: n’ogige ụlọ nsọ ahụ
  alternative: n’ụlọ nsọ ahụ
  rationale: A họọrọ okwu nke na-egosi mpaghara na ogige ụlọ nsọ, n’ihi na Greek jiri ἱερόν, ọ bụghị ναός nke pụrụ izo aka n’ime ebe nsọ n’onwe ya. Nke a na-echekwa nkọwa akụkọ ihe mere eme n’enweghị itinye nkọwa otu ụka.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ usoro ahịrịokwu eke n’Igbo, kpọọ Pọl aha iji mee ka onye nnọchiaha Greek na-ezo aka na ya doo anya, ma debe akara ntụaka [a] ozugbo n’ebe okwu ọ na-akọwa dị.
