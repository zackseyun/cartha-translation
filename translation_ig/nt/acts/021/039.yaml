id: ACT.21.39
reference: Acts 21:39
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἶπεν δὲ ὁ Παῦλος· Ἐγὼ ἄνθρωπος μέν εἰμι Ἰουδαῖος, Ταρσεὺς τῆς Κιλικίας, οὐκ ἀσήμου πόλεως πολίτης· δέομαι δέ σου, ἐπίτρεψόν μοι λαλῆσαι πρὸς τὸν λαόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/039.yaml
  text: But Paul said[a], “I am indeed a Jewish man, a citizen of Tarsus in Cilicia, of no insignificant city. And I beg you, permit me to speak to the people.”
translation:
  language: ig
  text: Ma Pọl kwuru, “Abụ m onye Juu, nwa amaala Tasọs nke dị na Silisia, obodo na-abụghị nke a na-eleda anya. Ana m arịọ gị, kwe ka m gwa ndị mmadụ okwu.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄνθρωπος ... Ἰουδαῖος
  choice: onye Juu
  rationale: N'Igbo nkịtị, ‘onye Juu’ na-egosipụta njirimara Pọl n'ụzọ doro anya ma bụrụkwa ihe e ji akọwa nwoke ma ọ bụ mmadụ; ịgbakwunye ‘nwoke’ adịghị mkpa n'ọnọdụ a.
- source_word: Ταρσεὺς τῆς Κιλικίας ... πολίτης
  choice: nwa amaala Tasọs nke dị na Silisia
  rationale: Nke a na-edobe nkwupụta Pọl banyere ịbụ nwa amaala obodo ahụ, ma na-eme ka njikọ Tasọs na Silisia doo onye Igbo nke oge a anya.
- source_word: οὐκ ἀσήμου πόλεως
  choice: obodo na-abụghị nke a na-eleda anya
  rationale: Nke a na-echekwa usoro litotes nke Grik—ịkọwa obodo ahụ site n'ịsị na ọ bụghị nke na-enweghị aha ma ọ bụ uru—na-enweghị ime ya naanị ‘obodo a ma ama.’
- source_word: δέομαι
  choice: Ana m arịọ gị
  rationale: Ọ na-egosi arịrịọ siri ike ma dị nsọpụrụ, n'enweghị ụda dị oke egwu nke ụfọdụ nsụgharị ‘ana m implọ gị’ ga-enwe.
- source_word: ἐπίτρεψόν μοι λαλῆσαι πρὸς τὸν λαόν
  choice: kwe ka m gwa ndị mmadụ okwu
  rationale: Ọ bụ ụzọ Igbo dị ndụ na nke kwesịrị ekwesị isi kwuo arịrịọ maka ikike ikwu okwu n'ihu ndị ahụ.
- source_word: μέν
  choice: egosiri site n'usoro nkwupụta ahụ, ọ bụghị otu mkpụrụokwu pụrụ iche
  rationale: N'Igbo, itinye okwu dịka ‘n'ezie’ ebe a nwere ike ịdị arọ ma ọ bụ gbanwee ụda; nkwupụta ‘Abụ m onye Juu’ n'onwe ya na-eburu nkwusi ike ahụ.
theological_decisions:
- issue: Nkọwa Ἰουδαῖος n'ọnọdụ a
  choice: onye Juu
  alternative: onye Judia
  rationale: Pọl na-ekwu maka njirimara agbụrụ na okpukpe ya, ebe ọ kpọrọ Tasọs dị na Silisia iche dịka obodo ya. ‘Onye Judia’ nwere ike ime ka a ghọta na ọ bụ Judia ka o si.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke oge a, dị ùgwù ma dị mfe nghọta. E debere okwu Pọl n'ụdị arịrịọ nsọpụrụ nye onyeisi agha, ma zere okwu ochie ma ọ bụ nke otu ụka pụrụ iche.
