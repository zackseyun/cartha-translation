  rationale: Only the duration expression has been adjusted for closer semantic equivalence and more idiomatic modern Igbo. The revised wording retains the temporal genitive-absolute sense, the first-person narrative perspective, Agabus’s identity as a prophet, his origin in Judea, and the directional nuance of “came down.”
