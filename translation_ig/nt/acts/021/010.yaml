  text: ἐπιμενόντων ⸀δὲ ἡμέρας πλείους κατῆλθέν τις ἀπὸ τῆς Ἰουδαίας προφήτης ὀνόματι Ἅγαβος,
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/010.yaml
  text: While we were staying there for several days, a prophet named Agabus came down from Judea.
translation:
  language: ig
  text: Mgbe anyị nọgidere n’ebe ahụ ụbọchị ole na ole, otu onye amụma aha ya bụ Agabọs si Judia gbadata.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιμενόντων
  choice: Mgbe anyị nọgidere n’ebe ahụ
  rationale: Nkebi a bụ present participle dị na genitive absolute ma na-egosi oge. Onye ọ na-ekwu maka ya ezughị ezu n'okwu Grik, ma ihe gbara ya gburugburu na-egosi Pọl na ndị ibe ya; ya mere, ‘anyị’ dabara n'akụkọ a.
- source_word: δὲ
  choice: Mgbe
  rationale: δὲ na-eme obere ntụgharị n'akụkọ, ma n'ịjikọta ya na genitive absolute, a tinyere echiche ya n'okwu oge ‘Mgbe’ ka Igbo wee daa nke ọma.
- source_word: ἡμέρας πλείους
  choice: ruo ọtụtụ ụbọchị
  rationale: Ọ bụ okwu na-egosi ogologo oge. πλείους nwere ike ịpụta ụbọchị ndị ọzọ ma ọ bụ ọtụtụ ụbọchị; ‘ruo ọtụtụ ụbọchị’ bụ Igbo ebumpụta ụwa nke na-edobe echiche na ọnụnọ ahụ gara n'ihu.
- source_word: κατῆλθέν
  choice: gbadata
  rationale: A hapụrụ echiche ntụziaka dị na κατέρχομαι, ya bụ isi n'ebe dị elu gbadata, kama iji naanị ‘bịa’.
- source_word: τις
  choice: otu onye
  rationale: Ọ na-ewebata onye ọhụrụ a na-akọwabeghị; ‘otu onye amụma’ na-egosipụta nke a n'ụzọ Igbo dị mma.
- source_word: ἀπὸ τῆς Ἰουδαίας
  choice: si Judia
  rationale: Nke a na-egosi ebe o si bịa n'ụzọ kwụ ọtọ.
- source_word: προφήτης
  choice: onye amụma
  rationale: Nke a bụ okwu Igbo a na-ejikarị akọwa προφήτης ma na-edobe ọrụ amụma e nyere Agabọs.
- source_word: ὀνόματι Ἅγαβος
  choice: aha ya bụ Agabọs
  rationale: ὀνόματι bụ akpaalaokwu na-akọwa aha mmadụ; ‘aha ya bụ Agabọs’ bụ ụzọ Igbo doro anya ma dị ebumpụta ụwa.
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-edobe usoro oge, ebe Agabọs si, ọrụ ya dị ka onye amụma, na echiche nke ‘ịgbadata’ dị n'okwu Grik.
