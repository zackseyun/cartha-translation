  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Μετὰ δὲ τὰς ἡμέρας ταύτας ἐπισκευασάμενοι ἀνεβαίνομεν εἰς ⸀Ἱεροσόλυμα·
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/015.yaml
  text: After these days[a], having packed up, we went up to Jerusalem.
translation:
  language: ig
  text: Mgbe ụbọchị ndị a gasịrị, anyị kwadebere onwe anyị[a], wee rịgoro Jerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “anyị kwakọbara ngwongwo anyị” ma ọ bụ “anyị jikere.” Okwu Grik ahụ nwere ike izo aka n’ịkwadebe maka njem n’ozuzu ya, ọ bụghị naanị n’ịkwakọba ibu.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δὲ τὰς ἡμέρας ταύτας
  choice: Mgbe ụbọchị ndị a gasịrị
  rationale: Μετά ya na ebubo na-egosi oge sochirinụ. Nsụgharị a na-ezo aka n’ụbọchị ndị a kọwara ozugbo tupu nke a, n’enweghị ịgbakwụnye ihe odide ahụ na-ekwughị.
- source_word: ἐπισκευασάμενοι
  choice: anyị kwadebere onwe anyị
  rationale: Okwu a nwere ike ịpụta ịkwadebe ma ọ bụ ijikere maka njem, ikekwe gụnyere ịkwakọba ibu. Nhọrọ sara mbara a na-echekwa ihe okwu Grik ahụ nwere ike ịpụta n’enweghị ime ka ọ bụrụ naanị ịkwakọba ngwongwo.
- source_word: ἀνεβαίνομεν
  choice: anyị ... rịgoro
  rationale: Imperfect a na-akọ njem ahụ dịka ihe mere n’oge gara aga. ‘Rịgoro’ na-echekwa echiche nke ịrịgo Jerusalem, ma n’ọnọdụ ala ya ma n’otú e si ekwu maka njem gaa obodo ahụ.
- source_word: εἰς Ἱεροσόλυμα
  choice: Jerusalem
  rationale: εἰς na-egosi ebe njem ahụ na-aga. N’Igbo, itinye aha ebe ahụ ozugbo n’azụ ngwaa ngagharị bụ ụzọ ebumpụta ụwa isi kwuo ‘gaa Jerusalem.’
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị ùgwù ma doo ndị nkịtị anya. E debere ‘rịgoro’ iji chekwaa ntụziaka dị na okwu Grik na ụzọ omenala e si akọ njem gaa Jerusalem.
