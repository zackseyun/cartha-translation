source:
  edition: SBLGNT
  text: Μέλλων τε εἰσάγεσθαι εἰς τὴν παρεμβολὴν ὁ Παῦλος λέγει τῷ χιλιάρχῳ· Εἰ ἔξεστίν μοι εἰπεῖν ⸀τι πρὸς σέ; ὁ δὲ ἔφη· Ἑλληνιστὶ γινώσκεις;
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/037.yaml
  text: As Paul was about to be brought into the barracks[a], he said to the tribune, “Is it permitted for me to say something to you?” And he said[c][b], “Do you know Greek?”
translation:
  language: ig
  text: Mgbe ọ fọrọ nke nta ka a kpọbata Pọl n’ogige ndị agha[c], ọ sịrị ọchịagha ahụ[b], “Ọ̀ kwere ka m gwa gị ihe?” Ọchịagha ahụ wee sị ya, “Ị maara asụsụ Grik?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Okwu Grik a na-ezo aka n’otu onyeisi ndị agha Rom; a pụkwara ịkpọ ya “onyeisi ndị agha.”
    reason: cultural_note
  - marker: c
    text: “Ogige ndị agha” ebe a bụ ebe ndị agha Rom biri ma rụọ ọrụ, ma eleghị anya n’ime ebe e wusiri ike.
    reason: cultural_note
lexical_decisions:
- source_word: Μέλλων τε εἰσάγεσθαι
  choice: Mgbe a na-achọ ịkpọbata Pọl
  rationale: 'Nkebiokwu a na-egosi na ihe ahụ na-achọ ime ozugbo ma na-edobekwa echiche pasivụ ahụ: ọ bụghị Pọl ji aka ya abanye, kama a na-akpọbata ya.'
- source_word: παρεμβολή
  choice: ogige ndị agha
  rationale: N’ọnọdụ a, okwu ahụ na-ezo aka n’ebe ndị agha Rom nọ n’ime ebe e wusiri ike. “Ogige ndị agha” bụ okwu Igbo doro anya ma ghara ime ka a chee naanị otu ụlọ ebe ndị agha na-ehi ụra.
- source_word: χιλίαρχος
  choice: ọchịagha ahụ
  rationale: Ọ bụ onyeisi ndị agha Rom nọ n’ọkwa dị elu. “Ọchịagha” bụ ntụgharị Igbo dị mfe nghọta; ndetu na-akọwa ọkwa ahụ n’ụzọ zuru ezu.
- source_word: Εἰ ἔξεστίν μοι εἰπεῖν τι πρὸς σέ
  choice: È kwere ka m gwa gị ihe?
  rationale: Nke a na-egosipụta arịrịọ Pọl maka ikike ikwu okwu, ma na-ada ka ajụjụ nkwanye ùgwù n’Igbo ugbu a.
- source_word: τι
  choice: ihe
  rationale: N’ebe a, nnọchiaha a pụtara “ihe” ma ọ bụ “otu ihe,” nke kwekọrọ n’otú e si ekwu ya n’Igbo.
- source_word: Ἑλληνιστί γινώσκεις
  choice: Ị maara asụsụ Grik?
  rationale: A na-edobe ngwaa “ịma” nke dị n’asụsụ Grik, ebe “asụsụ Grik” na-eme ka o doo anya na ihe a na-ajụ bụ asụsụ.
