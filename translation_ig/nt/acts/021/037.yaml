translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ “È kwere ka m…” ka arịrịọ ahụ bụrụ nke e ji nkwanye ùgwù kwuo, ebe a hapụrụ ihe Pọl chọrọ ikwu n’ozuzu dịka isi mmalite si mee.
