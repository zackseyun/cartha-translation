  text: Ὡς δὲ ἐγένετο ἀναχθῆναι ἡμᾶς ἀποσπασθέντας ἀπ’ αὐτῶν, εὐθυδρομήσαντες ἤλθομεν εἰς τὴν ⸀Κῶ, τῇ δὲ ἑξῆς εἰς τὴν Ῥόδον, κἀκεῖθεν εἰς Πάταρα·
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/001.yaml
  text: After we had torn ourselves away from them and put out to sea[a], we ran a straight course and came to Cos, and on the next day to Rhodes, and from there to Patara.
translation:
  language: ig
  text: Mgbe anyị dọkapụsịrị onwe anyị n’ebe ha nọ ma pụọ n’ụsọ mmiri, anyị ji ụgbọ mmiri gawa kpọmkwem ruo Kọs[a]; n’echi ya, anyị rutere Rọdos, sikwa n’ebe ahụ gaa Patara.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, Kos.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὡς δὲ ἐγένετο
  choice: Mgbe
  rationale: Akpaokwu Grik a na-ewebata ihe omume sochirinụ n’akụkọ. “Mgbe” na-enye ntụgharị oge ahụ n’Igbo nkịtị n’enweghị ịsụgharị usoro Grik ahụ n’ụzọ isiike.
- source_word: ἀναχθῆναι
  choice: banye n’ụgbọ mmiri
  rationale: N’ọnọdụ njem mmiri, okwu a pụtara ịpụ n’ụsọ mmiri malite njem. N’Igbo, “banye n’ụgbọ mmiri” na-egosi mmalite njem mmiri n’ụzọ doro anya, ọ bụ ezie na echiche ịpụ n’ụsọ dị n’usoro ahịrịokwu ahụ.
- source_word: ἀποσπασθέντας ἀπ’ αὐτῶν
  choice: siri n’ebe ha nọ dọkapụ onwe anyị
  rationale: ἀποσπάω karịrị nanị ịhapụ mmadụ; ọ na-egosi nkewa siri ike ma na-egbu mgbu. “Dọkapụ onwe anyị” na-echekwa ike mmetụta ahụ.
- source_word: εὐθυδρομήσαντες
  choice: ji ụzọ kwụ ọtọ ruo
  rationale: Ngwaa njem mmiri a pụtara iji ụzọ kwụ ọtọ ma ọ bụ kpọmkwem gawa. Nhọrọ a bụ Igbo ebumpụta ụwa ma na-echekwa kpọmkwem ụzọ njem ahụ.
- source_word: ἤλθομεν εἰς
  choice: ruo
  rationale: N’akụkọ njem, okwu a na-egosi ịbịarute ebe a na-aga. “Ruo” dị nkenke ma na-aga nke ọma n’usoro aha ebe ndị a.
- source_word: Κῶ
  choice: Kos
  rationale: “Kos” bụ nsụgharị mkpụrụokwu nke aha agwaetiti Grik Κῶ, ma kwekọọ n’ịkpọ aha ahụ n’oge a.
- source_word: τῇ δὲ ἑξῆς
  choice: n’echi ya
  rationale: Akpaokwu oge a pụtara ụbọchị sochirinụ. “N’echi ya” bụ Igbo nkịtị ma zie ezi.
- source_word: Ῥόδον
  choice: Rọds
  rationale: Nke a bụ idegharị aha Ῥόδος n’ụdị dabara n’usoro ụda na mkpụrụedemede Igbo.
- source_word: κἀκεῖθεν
  choice: sikwa n’ebe ahụ
  rationale: Ọ na-ejikọta ụkwụ njem na-esote ma pụta “sitekwa n’ebe ahụ.”
- source_word: Πάταρα
  choice: Patara
  rationale: Nke a bụ idegharị aha ebe Grik Πάταρα n’ụdị doro anya n’Igbo.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E chekwara ike mmetụta dị na nkewa ahụ na usoro njem site n’otu ebe ruo ebe ọzọ. Enweghị nkọwa ụka ma ọ bụ ozizi agbakwunyere.
