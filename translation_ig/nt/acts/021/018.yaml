  text: τῇ δὲ ἐπιούσῃ εἰσῄει ὁ Παῦλος σὺν ἡμῖν πρὸς Ἰάκωβον, πάντες τε παρεγένοντο οἱ πρεσβύτεροι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/018.yaml
  text: On the next day[a], Paul went in with us to James[b], and all the elders were present.
translation:
  language: ig
  text: N’echi ya[a], Pọl so anyị banye n’ebe Jemis nọ, ndị okenye niile nọkwa ebe ahụ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “N’ụbọchị sochirinụ.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ndị okenye niile bịara” ma ọ bụ “ndị okenye niile bịarutere.” Ngwaa Grik ahụ nwere ike imesi ma ọbịbịa ha ike ma ọ bụ ịnọ ha n’ebe ahụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ δὲ ἐπιούσῃ
  choice: N’echi ya
  rationale: Nkebiokwu a bụ ụzọ e si ekwu ụbọchị na-esote. “N’echi ya” bụ Igbo nkịtị, doo anya, ma na-echekwa nghọta oge ahụ.
- source_word: εἰσῄει
  choice: jekwuru
  rationale: Ngwaa a na-egosi ịbanye ma ọ bụ ịga n’ime ebe mmadụ nọ. N’ọnọdụ a, “jekwuru” na-egosi njem Pọl gara ịhụ Jemis n’ụzọ Igbo si ada nke ọma, n’agbanyeghị na ọ naghị emesi ịbanye ike dịka okwu Grik ahụ.
- source_word: σὺν ἡμῖν
  choice: so anyị
  rationale: Ọ na-egosi na Pọl na ndị na-akọ akụkọ ahụ gara ọnụ. “So anyị” bụ ntụgharị Igbo doro anya ma dị mfe.
- source_word: πρὸς Ἰάκωβον
  choice: jekwuru Jemis
  rationale: πρός na-egosi ije n’ebe mmadụ nọ. “Jekwuru Jemis” na-echekwa ntụziaka ahụ n’etinyeghị nkọwa na-adịghị n’amaokwu ahụ.
- source_word: πάντες τε
  choice: ndị ... niile ... kwa
  rationale: “Niile” na-egosi πάντες, ebe “kwa” na-ejikọta nkebiokwu nke abụọ n’ụzọ dị nro dịka τέ si eme.
- source_word: παρεγένοντο
  choice: nọ ya
  rationale: παραγίνομαι nwere ike igosi ma ọbịbịa ma ịnọ ebe ahụ. N’ebe a, “nọ ya” na-elekwasị anya n’ọnọdụ ndị okenye bịara nzukọ ahụ, ma ihe odide ala peeji na-echekwa nghọta ọzọ.
- source_word: οἱ πρεσβύτεροι
  choice: ndị okenye
  rationale: N’Ọrụ Ndị Ozi, okwu a na-ezo aka n’ụmụ nwoke a maara dịka ndị ndu ọgbakọ. “Ndị okenye” na-echekwa isi okwu ahụ n’etinyeghị usoro ọchịchị nke otu ụka pụrụ iche.
theological_decisions:
- issue: Onye Ἰάκωβον bụ na ọrụ ya
  choice: A sụgharịrị naanị aha ya dịka “Jemis,” n’etinyeghị nkọwa ọzọ.
  alternative: “Jemis nwanne Onyenwe anyị” ma ọ bụ “Jemis onye ndu ụka dị na Jerusalem.”
  rationale: Amaokwu a kpọrọ naanị aha Jemis. Ọ bụ ezie na ọnọdụ gbara ya gburugburu na-egosi onye a na-ekwu maka ya, itinye ọkwa ma ọ bụ mmekọrịta ezinụlọ ya ga-agbakwunye ihe amaokwu a n’onwe ya na-ekwughị.
- issue: Uche gbasara ọchịchị ụka dị na οἱ πρεσβύτεροι
  choice: “ndị okenye”
  alternative: “ndị presbịta” ma ọ bụ “ndị ndu ụka.”
  rationale: “Ndị okenye” na-echekwa echiche nke ndị ndu ọgbakọ a họpụtara ma ghara ịkwado usoro ọchịchị nke ụka ọ bụla kpọmkwem.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ugwu ma dị mfe nghọta, dee ya. “Jekwuru” na-eme ka ahịrịokwu ahụ daa nke ọma n’Igbo, ebe “ndị okenye” na-anọgide na-anọpụ iche n’ihe gbasara usoro ọchịchị ụka.
