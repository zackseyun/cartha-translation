    reason: lexical_alternative
  - marker: c
    text: 'Okwu Grik ahụ kwusiri ike: “ma e wezụga naanị ndị Juu” ma ọ bụ “ma e wezụga ndị Juu naanị ha.”'
    reason: lexical_alternative
  revision_rationale: The revision corrects the over-specific causal paraphrase concerning Stephen, preserves the broader semantic range of θλίψεως in the main text, and streamlines the explanatory footnote. It retains the Greek emphasis that the word was spoken only to Jews and keeps all footnote markers anchored in the text.
