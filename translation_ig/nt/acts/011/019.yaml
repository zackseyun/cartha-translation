id: ACT.11.19
reference: Acts 11:19
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Οἱ μὲν οὖν διασπαρέντες ἀπὸ τῆς θλίψεως τῆς γενομένης ἐπὶ Στεφάνῳ διῆλθον ἕως Φοινίκης καὶ Κύπρου καὶ Ἀντιοχείας μηδενὶ λαλοῦντες τὸν λόγον εἰ μὴ μόνον Ἰουδαίοις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/019.yaml
  text: So then[a], those who had been scattered because of the affliction that arose over Stephen went as far as Phoenicia and Cyprus and Antioch[c][b], speaking the word to no one except Jews.
translation:
  language: ig
  text: Ya mere, ndị ahụ a chụsasịrị n’ihi ahụhụ[a] ahụ dapụtara n’isi Stivin gara ruo Fonishia, Saịprọs na Antiọk, n’ekwughị onye ọ bụla okwu ahụ[b] ma e wezụga naanị ndị Juu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “mkpagbu” ma ọ bụ “nsogbu.” Okwu Grik ahụ nwere ike ịpụta nhụjuanya, nsogbu, ma ọ bụ mkpagbu n’ọnọdụ a.
    reason: lexical_alternative
  - marker: b
    text: “Okwu ahụ” n’ebe a na-ezo aka n’ozi a na-ekwusa banyere Jizọs; a pụkwara ịsị, “ozi ahụ.”
    reason: lexical_alternative
  - marker: c
    text: 'Okwu Grik ahụ kwusiri ike: “ma e wezụga naanị ndị Juu” ma ọ bụ “ma e wezụga ndị Juu naanị ha.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: διασπαρέντες
  choice: ndị ahụ a chụsasịrị
  rationale: 'Na-echekwa nghọta participle aorist passive ahụ: ndị ọzọ chụsasịrị ha, ihe a mekwara tupu njem a kọwara.'
- source_word: θλίψεως
  choice: mkpagbu
  rationale: Ọ bụ ezie na okwu Grik ahụ nwere ike ịpụta ahụhụ ma ọ bụ nsogbu n’ozuzu, ọnọdụ akụkọ a na-egosi nrụgide iro na ịchụ ndị kwere ekwe ọsọ; “mkpagbu” bụ okwu Igbo doro anya n’ọnọdụ a, ebe nkọwa ala peeji na-echekwa obosara okwu ahụ.
- source_word: τῆς γενομένης ἐπὶ Στεφάνῳ
  choice: ahụ malitere n’ihi ihe mere Stivin
  rationale: Na-egosi na mkpagbu ahụ bilitere n’ihe metụtara Stivin, n’emeghị ka ọ bụrụ naanị ahụhụ Stivin n’onwe ya tara.
- source_word: διῆλθον ἕως
  choice: gara ruo
  rationale: Usoro Igbo dị mfe ma bụrụ nke ebumpụta ụwa iji gosi njem ruru ebe ndị a kpọrọ aha.
- source_word: Φοινίκης καὶ Κύπρου καὶ Ἀντιοχείας
  choice: Fonishia, Saịprọs na Antiọk
  rationale: Aha ebe ndị a n’ụdị ntụgharị mkpụrụokwu dabara n’usoro ụda Igbo nke oge a.
- source_word: μηδενὶ λαλοῦντες τὸν λόγον
  choice: Ha ekwughị okwu ahụ nye onye ọ bụla
  rationale: Na-edobe “okwu ahụ” dịka aha Luk ji eme ihe ugboro ugboro maka ozi a na-ekwusa, ma na-egosikwa mmachibido ndị ha gwara ya.
- source_word: εἰ μὴ μόνον Ἰουδαίοις
  choice: ma e wezụga naanị ndị Juu
  rationale: “Naanị” na-echekwa nkwusi ike nke μόνον, ebe “ma e wezụga” na-egosipụta εἰ μή n’Igbo dị mma.
theological_decisions:
- issue: Ụdị nsogbu bilitere mgbe ihe mere Stivin gasịrị
  choice: Jiri “mkpagbu” n’isiokwu, tinyekwa obosara θλῖψις na nkọwa ala peeji.
  alternative: ahụhụ; nsogbu
  rationale: Ọnọdụ Ndị Ozi na-egosi ịchụso ndị kwere ekwe, ma nkọwa ahụ na-egbochi ịtụfu obosara okwu Grik.
- issue: Ihe τὸν λόγον pụtara n’akwụkwọ Ndị Ozi
  choice: Chekwaa “okwu ahụ” n’isiokwu.
  alternative: ozi ahụ; ozi banyere Jizọs
  rationale: Nke a na-echekwa okwu isiokwu Luk ji eme ihe ma ghara itinye nkọwa sara mbara n’ime isiokwu; a kọwara ihe ọ na-ezo aka na ya n’ala peeji.
- issue: Nkwusi ike banyere ndị natara ozi ahụ
  choice: “ma e wezụga naanị ndị Juu”
  alternative: ma e wezụga ndị Juu
  rationale: Ntinye “naanị” na-echekwa nkwusi ike dị na εἰ μὴ μόνον n’enweghị ịgbanwe ihe akụkọ ahụ kwuru.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E kewara ahịrịokwu ahụ ụzọ abụọ iji mee ka ọ na-agụ nke ọma n’Igbo, ma njikọ echiche na mmachi nke ndị natara ozi ahụ ka echekwara. Akara ala peeji [a], [b], na [c] niile dị n’isiokwu.
