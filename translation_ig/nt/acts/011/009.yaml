base_translation:
  language: en
  yaml_path: translation/nt/acts/011/009.yaml
  text: But a voice answered from heaven a second time[a], ‘What God has made clean, you must not call common.’
translation:
  language: ig
  text: Ma olu si n’eluigwe zara nke ugboro abụọ, sị, “Ihe Chineke mere ka ọ dị ọcha, gị akpọla ya ihe nkịtị[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ: “elela ya anya dị ka ihe na-adịghị ọcha” ma ọ bụ “akpọla ya ihe rụrụ arụ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: zaghachi ya
  rationale: Okwu a pụtara ‘zara’ ma ọ bụ ‘zaghachi.’ Ịtinye ‘ya’ na-eme ka ahịrịokwu ahụ bụrụ Igbo a na-asụ nke ọma n’usoro akụkọ a.
- source_word: φωνὴ
  choice: olu
  rationale: ‘Olu’ na-edobe onye nwe olu ahụ n’amaghị ama, dịka Grik si mee.
- source_word: ἐκ δευτέρου
  choice: nke ugboro abụọ
  rationale: Nke a na-egosi kpọmkwem na olu ahụ zaghachiri nke ugboro abụọ, ọ bụghị nanị na o mere ọzọ n’enweghị ọnụ ọgụgụ doro anya.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: si n’eluigwe
  rationale: N’ọnọdụ a, οὐρανός na-ezo aka n’eluigwe, ọ bụghị naanị na mbara igwe.
- source_word: Ἃ
  choice: Ihe
  rationale: ‘Ihe’ bụ ụzọ Igbo dị nkenke na nke ebumpụta ụwa si webata ihe niile okwu a na-ezo aka na ha.
- source_word: ὁ θεὸς
  choice: Chineke
  rationale: Nke a bụ ntụgharị Igbo kwesịrị ekwesị na nke a na-anabata n’ozuzu maka θεός n’ebe a.
- source_word: ἐκαθάρισεν
  choice: mere ka ọ dị ọcha
  rationale: Nhọrọ a na-egosi omume Chineke nke ime ka ihe dị ọcha, ma debe ọdịiche dị n’etiti ‘dị ọcha’ na ‘ihe nkịtị.’
- source_word: σὺ
  choice: gị
  rationale: Ịgụnye ‘gị’ na-echekwa nkwusi ike nke nnọchiaha ahụ e kwuru hoo haa na Grik.
- source_word: μὴ κοίνου
  choice: akpọla ya ihe nkịtị
  rationale: κοινόω nwere echiche nke ime ma ọ bụ ịkpọ ihe ‘ihe nkịtị,’ nke megidere ihe e mere ka ọ dị ọcha n’usoro echiche ndị Juu banyere ịdị ọcha. Ihe odide ala peeji na-enye nsụgharị ndị na-akọwa ya dịka ihe na-adịghị ọcha.
theological_decisions:
- issue: Ihe κοινόω pụtara n’okwu gbasara ịdị ọcha
  choice: akpọla ya ihe nkịtị
  alternative: elela ya anya dị ka ihe na-adịghị ọcha; akpọla ya ihe rụrụ arụ
  rationale: Isiokwu Grik ahụ na-egosi ọdịiche dị n’etiti ihe Chineke mere ka ọ dị ọcha na mmadụ ịkpọ ya κοινός. ‘Ihe nkịtị’ na-edobe ụdị okwu ahụ na esemokwu echiche dị na ya; ihe odide ala peeji na-akọwa echiche ịdịghị ọcha n’ebugharịghị nkọwa ahụ n’ime isi okwu.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-agbaso usoro akụkọ Igbo nke ọma ma na-edobe okwu ịdị ọcha na mgbagwoju echiche dị na Grik.
