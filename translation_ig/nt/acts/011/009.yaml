  to: Ma olu si n’eluigwe zara nke ugboro abụọ, sị, “Ihe Chineke mere ka ọ dị ọcha, gị akpọla ya ihe nkịtị[a].”
  rationale: The only required correction is removal of the added object in “zaghachi ya.” The revised wording follows the Greek clause structure, reads naturally in Standard Igbo, and preserves the source’s distinction between cleansing and treating something as κοινός (“common”), with explanatory alternatives kept in the footnote.
