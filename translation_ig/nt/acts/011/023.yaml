  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὃς παραγενόμενος καὶ ἰδὼν τὴν χάριν ⸀τὴν τοῦ θεοῦ, ἐχάρη καὶ παρεκάλει πάντας τῇ προθέσει τῆς καρδίας ⸀προσμένειν τῷ κυρίῳ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/023.yaml
  text: When he arrived and saw the grace of God, he rejoiced and kept urging them all to remain devoted to the Lord with purpose of heart,
translation:
  language: ig
  text: Mgbe ọ bịarutere ma hụ amara Chineke[a], ọ ṅụrịrị ọṅụ, wee na-agba ha niile ume ka ha jiri nzube nke obi nọgide n’Onyenwe anyị[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ihu ọma Chineke.” Okwu a nwere ike izo aka n’ihe akaebe pụtara ìhè nke ọrụ ebere Chineke n’etiti ha.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “nọgide na-arara onwe ha nye Onyenwe anyị,” ma ọ bụ, “nọgide na-ekwesị ntụkwasị obi nye Onyenwe anyị.”
    reason: alternative_reading
lexical_decisions:
- source_word: παραγενόμενος
  choice: Mgbe ọ bịarutere
  rationale: Na-egosi ọbịbịa Banabas n’ebe ahụ; usoro ‘Mgbe ọ bịarutere’ bụ Igbo nkịtị ma na-edobe njikọ nke participle ahụ na ihe sochiri ya.
- source_word: ἰδὼν
  choice: hụ
  rationale: A sụgharịrị okwu ọhụụ ahụ n’ụzọ kwụ ọtọ; ihe gbara ya gburugburu nwere ike ịgụnye ịghọta ọrụ Chineke, ma e tinyeghị nkọwa ahụ n’ime amaokwu.
- source_word: τὴν χάριν τὴν τοῦ θεοῦ
  choice: amara Chineke
  rationale: ‘Amara’ na-edobe ịdị arọ nke χάρις n’okwu okpukpe ma na-ahapụ ya ka ọ gụnye ọrụ ebere Chineke a pụrụ ịhụ n’etiti ndị kwere ekwe.
- source_word: ἐχάρη
  choice: ọ ṅụrịrị ọṅụ
  rationale: Nke a bụ ụzọ Igbo doro anya ma dị ugwu isi kwuo na obi tọrọ ya ụtọ nke ukwuu.
- source_word: παρεκάλει
  choice: na-agbakwa ha niile ume
  rationale: Ụdị imperfect na-egosi ihe ọ nọ na-eme n’ihu; ‘na-agbakwa ... ume’ na-ebunye agbamume na arịrịọ siri ike n’ụzọ ebumpụta ụwa.
- source_word: πάντας
  choice: ha niile
  rationale: Na-ezo aka n’ebe ndị kwere ekwe niile nọ n’akụkọ ahụ, n’enweghị itinye ihe ọhụrụ.
- source_word: τῇ προθέσει τῆς καρδίας
  choice: jiri mkpebi siri ike nke obi
  rationale: πρόθεσις bụ nzube ma ọ bụ mkpebi e mere; καρδία bụ ime mmadụ, ebe uche na ọchịchọ ya dị. Okwu a na-eme ka echiche ahụ doo anya n’Igbo.
- source_word: προσμένειν
  choice: nọgide
  rationale: Na-egosi ịnọgide na njikọ na iguzosi ike; e jikọtara ya na ‘n’Onyenwe anyị’ ka e ghara ịkọwa ya karịa ihe Grik kwuru.
- source_word: τῷ κυρίῳ
  choice: n’Onyenwe anyị
  rationale: A na-eji aha nsọ Igbo a na-ahụkarị maka κύριος; preposition ‘n’—’ na-ebunye dative nke mmekọrịta n’ụzọ dị mma n’Igbo.
theological_decisions:
- issue: Ihe ‘amara Chineke’ pụtara n’ebe a
  choice: E debere ‘amara Chineke,’ nke nwere ike ịpụta ọrụ ebere Chineke pụtara ìhè n’etiti ndị kwere ekwe.
  alternative: ‘ihe Chineke ji amara ya mee’ ma ọ bụ ‘ihu ọma Chineke’
  rationale: Nsụgharị kpọmkwem na-edobe obosara na ịdị arọ nke okwu ahụ, kama imechi ya naanị n’ihe Chineke mere ma ọ bụ n’otú obi ya dị.
- issue: Ike nke προσμένειν τῷ κυρίῳ
  choice: ‘nọgide n’Onyenwe anyị,’ ya bụ ịnọgide na mmekọrịta siri ike na ya
  alternative: ‘nọgide na-arara onwe ha nye Onyenwe anyị’ ma ọ bụ ‘nọgide na-ekwesị ntụkwasị obi nye Onyenwe anyị’
  rationale: Nhọrọ ahụ na-anọ nso n’usoro Grik ma na-ahapụ echiche nke nrara onwe na ikwesị ntụkwasị obi n’ime okwu ahụ, n’etinyeghị usoro ozizi dị warara.
translation_notes:
  register: Igbo Izugbe nke oge a, doro anya ma dị ugwu. E ji ‘mkpebi siri ike nke obi’ mee ka akpaalaokwu Grik bụrụ nke ndị na-agụ Igbo ga-aghọta, ebe ‘nọgide n’Onyenwe anyị’ na-edobe ịdị mfe na obosara nke okwu mbụ.
