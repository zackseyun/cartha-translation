review_pass:
  verdict: revise
  source_fidelity: 'The draft retains the principal elements of the Greek: Peter''s first-person setting in Joppa, prayer, an altered visionary state and a vision, an indefinite object compared with a large sheet, its descent from heaven by four extremities, and its arrival at him. However, «n’ọhụ» is too readily understood as ‘in a vision’ and thus obscures the distinction between ἐν ἐκστάσει and ὅραμα. «isi ya anọ» is also less precise and less idiomatic for the sheet’s four extremities than «akụkụ anọ»; the possessive is not required by the Greek.'
  naturalness: The overall register is clear Standard Igbo. «n’ọnọdụ pụrụ iche nke nsụhọ» is a natural, non-sectarian way to convey the altered state meant by ἐκστάσει without equating it with the vision itself. «n’akụkụ anọ» gives the ordinary image of a sheet lowered by its four corners.
  terminology: «ọhụụ» appropriately renders ὅραμα. The revised wording distinguishes it from ἐκστάσει without importing a denominational account of the experience. «ihe» remains a suitably broad rendering of σκεῦός τι, with «arịa» retained as a lexical alternative in the footnote.
  issues:
  - severity: medium
    issue: «mgbe m nọ n’ọhụ» for ἐν ἐκστάσει
    rationale: Because «ọhụụ» immediately renders ὅραμα, «n’ọhụ» can collapse the Greek’s altered state and the vision into the same concept. A neutral description of an unusual state of consciousness better preserves the lexical distinction.
  - severity: low
    issue: «isi ya anọ» for τέσσαρσιν ἀρχαῖς
    rationale: In this context ἀρχαί denotes the sheet’s extremities/corners. «akụkụ anọ» is clearer and more idiomatic, and it avoids the unnecessary possessive.
  revised_text: '“Anọ m n’obodo Jọpa na-ekpe ekpere, mgbe m nọ n’ọnọdụ pụrụ iche nke nsụhọ, ahụkwara m ọhụụ: otu ihe[a] yiri nnukwu akwa na-agbadata; e ji akụkụ anọ na-eweda ya site n’eluigwe[b], o wee rute n’ebe m nọ.”'
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “otu arịa.” Okwu Grik e ji mee ihe ebe a sara mbara; ọ pụrụ ịpụta ihe ma ọ bụ arịa, tupu e jiri nnukwu akwa tụnyere ya.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “a na-eweda ya site n’eluigwe n’akụkụ anọ.”
    reason: lexical_alternative
  revision_rationale: The revision clarifies the distinction between the trance-like state (ἐκστάσει) and the vision (ὅραμα), replaces the less suitable «isi» with «akụkụ» for the four extremities, and uses «rute n’ebe m nọ» to render the object’s arrival without redundantly reasserting its descent. No doctrinal interpretation is added.
