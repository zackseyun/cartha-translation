revisions:
- from: '“Anọ m n’obodo Jọpa na-ekpe ekpere, mgbe m nọ n’ọhụ, ahụkwara m ọhụụ: otu ihe[a] yiri nnukwu akwa na-agbadata; e ji isi ya anọ na-eweda ya site n’eluigwe[b], o wee gbadata ruo n’ebe m nọ.”'
  to: '“Anọ m n’obodo Jọpa na-ekpe ekpere, mgbe m nọ n’ọnọdụ pụrụ iche nke nsụhọ, ahụkwara m ọhụụ: otu ihe[a] yiri nnukwu akwa na-agbadata; e ji akụkụ anọ na-eweda ya site n’eluigwe[b], o wee rute n’ebe m nọ.”'
  rationale: The revision clarifies the distinction between the trance-like state (ἐκστάσει) and the vision (ὅραμα), replaces the less suitable «isi» with «akụkụ» for the four extremities, and uses «rute n’ebe m nọ» to render the object’s arrival without redundantly reasserting its descent. No doctrinal interpretation is added.
  reviewer_model: gpt-5.6-terra
