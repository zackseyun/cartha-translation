  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἐγὼ ἤμην ἐν πόλει Ἰόππῃ προσευχόμενος καὶ εἶδον ἐν ἐκστάσει ὅραμα, καταβαῖνον σκεῦός τι ὡς ὀθόνην μεγάλην τέσσαρσιν ἀρχαῖς καθιεμένην ἐκ τοῦ οὐρανοῦ, καὶ ἦλθεν ἄχρι ἐμοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/005.yaml
  text: 'I was in the city of Joppa praying[a], and in a trance I saw a vision: something like a large sheet was coming down, being lowered from heaven by four corners[b], and it came to me.'
translation:
  language: ig
  text: '“Anọ m n’obodo Jọpa na-ekpe ekpere, mgbe m nọ n’ọnọdụ pụrụ iche nke nsụhọ, ahụkwara m ọhụụ: otu ihe[a] yiri nnukwu akwa na-agbadata; e ji akụkụ anọ na-eweda ya site n’eluigwe[b], o wee rute n’ebe m nọ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “otu arịa.” Okwu Grik e ji mee ihe ebe a sara mbara; ọ pụrụ ịpụta ihe ma ọ bụ arịa, tupu e jiri nnukwu akwa tụnyere ya.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “a na-eweda ya site n’eluigwe n’akụkụ anọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγὼ ἤμην ἐν πόλει Ἰόππῃ προσευχόμενος
  choice: Anọ m n’obodo Jọpa na-ekpe ekpere
  rationale: Nke a na-edobe onye mbụ, okwu ‘obodo,’ na omume ekpere na-aga n’ihu n’Igbo dị mfe ma bụrụkwa nke a na-asụ ugbu a.
- source_word: ἐν ἐκστάσει
  choice: mgbe m nọ n’ọhụ
  rationale: ‘N’ọhụ’ bụ okwu Igbo e ji akọ ọnọdụ mmadụ nọ n’ime ya mgbe ọhụụ sitere n’aka Chineke bịara ya; ọ naghị atụgharị okwu ahụ ka ọ bụrụ naanị mmetụta obi ụtọ.
- source_word: ὅραμα
  choice: ọhụụ
  rationale: ‘Ọhụụ’ bụ okwu Igbo doro anya maka ihe e gosiri mmadụ n’ụzọ pụrụ iche. A hapụrụ ya iche na ‘n’ọhụ’ ka okwu Grik abụọ ahụ ghara ịghọ otu echiche.
- source_word: σκεῦός τι
  choice: otu ihe
  rationale: σκεῦος bụ okwu sara mbara nke pụrụ ịpụta ihe, arịa, ma ọ bụ ihe e ji etinye ihe; ‘otu ihe’ na-edobe enweghị nkọwa kpọmkwem tupu e jiri nnukwu akwa tụnyere ya.
- source_word: ὡς ὀθόνην μεγάλην
  choice: yiri nnukwu akwa
  rationale: Nke a na-egosi ntụnyere ahụ nke ọma n’enweghị ịgbakwunye na akwa ahụ bụ linen, ihe Grik na-ekwughị kpọmkwem.
- source_word: καταβαῖνον … καθιεμένην ἐκ τοῦ οὐρανοῦ
  choice: na-agbadata; e ji … na-eweda ya site n’eluigwe
  rationale: A na-edobe ma ngagharị ya na-agbadata ma ọnọdụ ya dị ka ihe a na-eweda, dịka participle abụọ dị n’asụsụ Grik si gosi.
- source_word: τέσσαρσιν ἀρχαῖς
  choice: ji isi ya anọ
  rationale: N’ebe a, ἀρχαί na-ezo aka na nsọtụ ma ọ bụ isi anọ nke akwa ahụ. ‘Isi ya anọ’ na-enye onye Igbo ihe oyiyi doro anya n’enweghị ịkọwa karịa ihe ederede kwuru.
- source_word: ἦλθεν ἄχρι ἐμοῦ
  choice: o wee gbadata ruo n’ebe m nọ
  rationale: Nke a na-egosi na ihe ahụ bịaruru ebe Pita nọ, ma na-ejikọkwa ngagharị ahụ na mgbadata a kọwara n’ahịrịokwu ahụ.
theological_decisions:
- issue: Ịsụgharị okwu ọhụụ n’enweghị ịgbakwunye echiche banyere ahụmahụ ime mmụọ
  choice: mgbe m nọ n’ọhụ, ahụkwara m ọhụụ
  alternative: mgbe uche m banyere n’ọnọdụ pụrụ iche, ahụkwara m ọhụụ
  rationale: 'Nhọrọ a na-edobe ἐκστάσει na ὅραμα dịka ihe abụọ nwere njikọ ma na-adịghị otu: Pita nọ n’ọnọdụ ọhụ, n’ime ya ka ọ hụkwara ọhụụ. Ọ naghị ewebata nkọwa ụka ma ọ bụ echiche banyere ahụmahụ omimi nke okwu Grik na-ekwughị.'
translation_notes:
  register: E ji Igbo Izugbe dị ugbu a, dị ùgwù ma dị mfe nghọta. A zere okwu ụka nke otu nzukọ pụrụ iche. Akara nkọwa [a] dị n’akụkụ ‘otu ihe,’ ebe ọ bụ ebe mgbanwe okwu ahụ metụtara; [b] dị n’akụkụ nkọwa banyere otú e si wedata akwa ahụ.
