  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἶπεν δὲ ⸂τὸ πνεῦμά μοι⸃ συνελθεῖν αὐτοῖς μηδὲν ⸀διακρίναντα. ἦλθον δὲ σὺν ἐμοὶ καὶ οἱ ἓξ ἀδελφοὶ οὗτοι, καὶ εἰσήλθομεν εἰς τὸν οἶκον τοῦ ἀνδρός.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/012.yaml
  text: And the Spirit told me to go with them[a], making no distinction. These six brothers also came with me, and we entered the man's house.
translation:
  language: ig
  text: Mmụọ ahụ gwara m ka m soro ha gaa, n’emeghị ọdịiche ọ bụla.[a] Ụmụnna isii ndị a sokwa m gaa, anyị wee banye n’ụlọ nwoke ahụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’enweghị ịla azụ” ma ọ bụ “n’enweghị obi abụọ.” Okwu Grik ahụ nwere ike ịpụta ma ịghara ime ọdịiche ma ọ bụ ịghara inwe obi abụọ.
    reason: alternative_reading
lexical_decisions:
- source_word: τὸ πνεῦμά
  choice: Mmụọ ahụ
  rationale: N’ọnọdụ a nke nduzi sitere n’aka Chineke n’Ọrụ Ndịozi, okwu ahụ na-ezo aka na Mmụọ Nsọ; ‘Mmụọ ahụ’ na-edobe usoro okwu Grik n’etinyeghị ‘Nsọ,’ nke adịghị n’amaokwu a.
- source_word: εἶπεν ... μοι
  choice: gwara m
  rationale: N’Igbo, ‘gwara m’ bụ ụzọ doro anya ma kwekọọ n’okwu ndụmọdụ ma ọ bụ iwu a nyere Pita.
- source_word: συνελθεῖν αὐτοῖς
  choice: ka m soro ha gaa
  rationale: Nke a na-egosi iso ndị ikom ahụ jee njem, ma bụrụkwa okwu Igbo dị mfe nghọta.
- source_word: μηδὲν διακρίναντα
  choice: n’emeghị ọdịiche ọ bụla
  rationale: N’ọnọdụ Pita ji kọwaa ịbanye n’ụlọ onye mba ọzọ, nke a na-egosi ịghara ikewa ma ọ bụ ile ndị mmadụ anya n’ụzọ dị iche; ihe ndị ọzọ okwu Grik ahụ pụrụ ịpụta ka edobere n’ala ala peeji.
- source_word: οἱ ἓξ ἀδελφοὶ οὗτοι
  choice: Ụmụnna isii ndị a
  rationale: Ndị a bụ ndị nwoke isii so Pita; ‘ụmụnna’ bụ okwu Igbo kwesịrị ekwesị maka ụmụnna nwoke n’okwukwe, ebe ‘ndị a’ na-edobe οὗτοι.
- source_word: εἰσήλθομεν
  choice: anyị wee banye
  rationale: ‘Banye’ na-enye ihe εἰσήλθομεν pụtara n’Igbo akụkọ dị ndụ ma bụrụkwa nke sitere n’okwu Grik ozugbo.
- source_word: τὸν οἶκον τοῦ ἀνδρός
  choice: n’ụlọ nwoke ahụ
  rationale: Nke a na-edobe aha nwoke ahụ nke ọma kama iji nnọchiaha dochie ya, ma na-ada nke ọma n’Igbo.
theological_decisions:
- issue: Ihe μηδὲν διακρίναντα pụtara n’akụkọ Pita
  choice: n’emeghị ọdịiche ọ bụla
  alternative: n’egbughị oge; n’enweghị obi abụọ
  rationale: Ọnọdụ gbara amaokwu ahụ gburugburu bụ ịgafe oke kewara ndị Juu na ndị mba ọzọ, ya mere echiche nke ịghara ime ọdịiche dabara nke ọma. Ma ebe okwu Grik ahụ nwekwara ike ịpụta ịghara ịla azụ ma ọ bụ inwe obi abụọ, e debere nghọta ndị ahụ n’ala ala peeji ka a ghara ikpochapụ nghọtahie ziri ezi dị n’asụsụ mbụ.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji usoro akụkọ nkịtị ‘anyị wee banye’ mee ka amaokwu ahụ na-aga were were, ebe e debere nghọtahie dị na μηδὲν διακρίναντα n’ala ala peeji.
