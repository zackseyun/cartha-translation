id: ACT.11.20
reference: Acts 11:20
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἦσαν δέ τινες ἐξ αὐτῶν ἄνδρες Κύπριοι καὶ Κυρηναῖοι, οἵτινες ⸀ἐλθόντες εἰς Ἀντιόχειαν ἐλάλουν ⸀καὶ πρὸς τοὺς ⸀Ἑλληνιστάς, εὐαγγελιζόμενοι τὸν κύριον Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/020.yaml
  text: But some of them were men from Cyprus and Cyrene[a], who, when they came to Antioch, were also speaking to the Hellenists, proclaiming the good news about the Lord Jesus.
translation:
  language: ig
  text: Ma ụfọdụ n’ime ha bụ ndị ikom si Saịprọs na Sairini, mgbe ha bịarutere Antiọk, ha na-agwakwa ndị Juu na-asụ Grik[a] okwu, na-ekwusa ozi ọma banyere Onyenwe anyị Jizọs.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ụfọdụ ihe odide nwere “ndị Grik” kama “ndị Juu na-asụ Grik.” Ọ bụrụ na ọ bụ ya bụ ọgụgụ izizi, ihe ọ pụtara bụ na ha na-agwa ndị mba ọzọ okwu, ọ bụghị naanị ndị Juu na-asụ Grik.
    reason: textual_variant
lexical_decisions:
- source_word: τινες
  choice: ụfọdụ
  rationale: Ọ na-ezo aka n’otu akụkụ a na-akọwaghị kpọmkwem n’etiti ndị ahụ e kwuru okwu ha; “ụfọdụ” bụ Igbo doro anya ma dịkwa eke.
- source_word: ἄνδρες
  choice: ndị ikom
  rationale: Aha Grik a na-ekwu kpọmkwem banyere ndị nwoke toro eto, ya mere e chekwara nkọwa nwoke ahụ.
- source_word: Κύπριοι καὶ Κυρηναῖοι
  choice: si Saịprọs na Sairini
  rationale: Okwu ndị a na-egosi ebe ha si; usoro “si ... na ...” bụ Igbo eke nke na-echekwa ihe isi mmalite ahụ pụtara.
- source_word: ἐλθόντες εἰς Ἀντιόχειαν
  choice: Mgbe ha bịarutere Antiọk
  rationale: A sụgharịrị participle aorist ahụ dị ka nkebiokwu oge, nke dabara n’usoro akụkọ Igbo.
- source_word: ἐλάλουν
  choice: ha na-agwakwa ... okwu
  rationale: “Na-agwa ... okwu” na-egosipụta omume na-aga n’ihu ma ọ bụ na-eme ugboro ugboro nke imperfect ahụ; “kwa” na-eburu καί nke na-agbasa ndị a na-agwa ozi ahụ.
- source_word: πρὸς τοὺς Ἑλληνιστάς
  choice: ndị Juu na-asụ Grik
  rationale: Ἑλληνισταί na SBLGNT na-apụtakarị ndị Juu na-asụ Grik. A kọwara ya kama iji aha teknụzụ nke ọtụtụ ndị na-agụ Igbo agaghị aghọta ngwa ngwa.
- source_word: εὐαγγελιζόμενοι
  choice: na-ekwusa ozi ọma banyere
  rationale: Nke a na-egosi ma omume ikwusa ma ọdịnaya ya dịka ozi ọma, n’asụsụ Igbo dị mfe nghọta.
- source_word: τὸν κύριον Ἰησοῦν
  choice: Onyenwe anyị Jizọs
  rationale: “Onyenwe anyị” bụ ụzọ Igbo dị ùgwù ma bụrụkwa nke a na-aghọta nke ọma isi nye aha Kraịst κύριος; e chekwara aha Jizọs.
theological_decisions:
- issue: Njirimara τοὺς Ἑλληνιστάς na ụdị ọgụgụ Ἕλληνας
  choice: Isi ederede gbasoro SBLGNT, “ndị Juu na-asụ Grik,” ma debe “ndị Grik” n’ala ala peeji.
  alternative: ndị Grik, ya bụ ndị mba ọzọ
  rationale: Nsogbu a bụ nke ọdịiche n’ihe odide ma nwekwaa mmetụta n’otú a ga-esi ghọta mgbasawanye ozi ọma. Ịgụ “ndị Juu na-asụ Grik” na “ndị Grik” adịghị ekwu otu ndị; ya mere e zoghị ọdịiche ahụ ma ọ bụ kpebie ya n’enweghị ihe akaebe.
translation_notes:
  register: Asụsụ ahụ bụ Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E jiri “ndị Juu na-asụ Grik” kọwaa Hellenists n'ụzọ onye nkịtị ga-aghọta, ebe akara ala ala peeji [a] na-echekwa ọdịiche dị mkpa n’ihe odide.
