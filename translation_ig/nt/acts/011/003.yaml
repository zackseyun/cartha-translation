  yaml_path: translation/nt/acts/011/003.yaml
  text: saying[a], “You went in to uncircumcised men and ate with them.”
translation:
  language: ig
  text: na-ekwu[a] sị, “Ị banyere n’ebe ndị ikom na-enweghị úgwù nọ, sorokwa ha rie nri.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “na-ekwu sị, ‘Ị banyere n’ebe ndị ikom ndị e bighị úgwù nọ.’” Okwu a na-ezo aka n’ebe ndị na-anọghị n’okpuru akara ọgbụgba ndụ ndị Juu, bú úgwù, nọ; ya bụ, ndị mba ọzọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντες
  choice: na-asị
  rationale: Ọ bụ participle nke na-ejikọta ebubo a na akụkọ bu ya ụzọ; ‘na-asị’ bụ ụzọ Igbo doro anya ma dịkwa nkenke isi webata okwu ha.
- source_word: ὅτι
  choice: “
  rationale: Ọ na-webata okwu e kwuru kpọmkwem; akara nhota dabara n’usoro Igbo karịa ịtụgharị ya dịka njikọokwu.
- source_word: Εἰσῆλθες πρὸς
  choice: Ị banyere n’ebe ... nọ
  rationale: Nke a na-echekwa echiche nke ịbanye n’ebe ndị ahụ nọ na iso ha nwee mmekọrịta, nke bụ isi ebubo ahụ.
- source_word: ἄνδρας
  choice: ndị ikom
  rationale: ἀνήρ ebe a na-ezo aka n’ụmụ nwoke, ọ bụghị mmadụ niile n’ozuzu.
- source_word: ἀκροβυστίαν ἔχοντας
  choice: ndị ikom a na-ebighị úgwù
  rationale: Nke a na-edobe okwu ahụ n’ụzọ metụtara akara ọgbụgba ndụ, kama ịkọwa ya ozugbo dịka ‘ndị mba ọzọ.’
- source_word: καὶ συνέφαγες αὐτοῖς
  choice: gị na ha eriekwa nri
  rationale: Ọ na-egosi iri nri ọnụ n’ụzọ Igbo dị mfe ma na-edobe ebubo nke abụọ.
theological_decisions:
- issue: Ma a ga-atụgharị ἀκροβυστίαν ἔχοντας dịka ‘ndị mba ọzọ’ ka ọ bụ dịka ndị a na-ebighị úgwù
  choice: ndị ikom a na-ebighị úgwù
  alternative: ndị mba ọzọ
  rationale: Okwu ndị na-ebo Pita ebubo lekwasịrị anya kpọmkwem n’úgwù dịka akara ọgbụgba ndụ na ókè mmekọrịta. Ịhapụ okwu ahụ n’ụdị a na-echekwa esemokwu okpukpe na mmekọrịta mmadụ dị na Grik.
translation_notes:
  register: Igbo Izugbe nke oge a, dị nsọ ma doo onye nkịtị anya. E ji ‘ndị ikom’ chekwaa kpọmkwem nwoke nke ἄνδρας, e jikwara ‘a na-ebighị úgwù’ chekwaa ụda ebubo na echiche akara ọgbụgba ndụ dị na isi mmalite.
