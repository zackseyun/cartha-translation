revisions:
- from: N’ihi na ọ bụ ezigbo nwoke[a], onye jupụtara na Mmụọ Nsọ na okwukwe. Ọtụtụ mmadụ sonyekwara n’ebe Onyenwe anyị nọ.
  to: N’ihi na ọ bụ ezigbo nwoke[a], onye jupụtara na Mmụọ Nsọ na okwukwe. Ọtụtụ mmadụ sonyekwara Onyenwe anyị.
  rationale: The revision corrects the final clause by removing the unsupported spatial expression while maintaining the sense that a substantial number of people came to be joined to the Lord. It also narrows the footnote quotation to the phrase affected by the lexical alternative.
