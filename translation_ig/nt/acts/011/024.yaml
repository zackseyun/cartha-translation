    text: Ma ọ bụ, “onye jupụtara na Mmụọ Nsọ na ikwesị ntụkwasị obi.” Okwu Grik bụ pistis nwekwara ike ịpụta “ikwesị ntụkwasị obi” ma ọ bụ “ntụkwasị obi”; n’isi ederede, a sụgharịrị ya dịka “okwukwe.”
    reason: lexical_alternative
  revision_rationale: The revision corrects the final clause by removing the unsupported spatial expression while maintaining the sense that a substantial number of people came to be joined to the Lord. It also narrows the footnote quotation to the phrase affected by the lexical alternative.
