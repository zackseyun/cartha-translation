id: ACT.11.24
reference: Acts 11:24
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὅτι ἦν ἀνὴρ ἀγαθὸς καὶ πλήρης πνεύματος ἁγίου καὶ πίστεως. καὶ προσετέθη ὄχλος ἱκανὸς τῷ κυρίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/024.yaml
  text: For he was a good man[a], full of the Holy Spirit and of faith. And a considerable crowd was added to the Lord.
translation:
  language: ig
  text: N’ihi na ọ bụ ezigbo nwoke[a], onye jupụtara na Mmụọ Nsọ na okwukwe. Ọtụtụ mmadụ sonyekwara Onyenwe anyị.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “onye jupụtara na Mmụọ Nsọ na ikwesị ntụkwasị obi.” Okwu Grik bụ pistis nwekwara ike ịpụta “ikwesị ntụkwasị obi” ma ọ bụ “ntụkwasị obi”; n’isi ederede, a sụgharịrị ya dịka “okwukwe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: N’ihi na
  rationale: Ọ na-ewebata ihe mere e ji kwuo okwu ọma banyere Banabas n’amaokwu bu ụzọ, ma na-edobe ike nkọwa nke njikọ Grik ahụ.
- source_word: ἀνὴρ ἀγαθὸς
  choice: ezigbo nwoke
  rationale: “Nwoke” na-ezo kpọmkwem aka na Banabas, ebe “ezigbo” na-egosi àgwà ọma n’etinyeghị nkọwa karịrị nke Grik kwuru.
- source_word: πλήρης πνεύματος ἁγίου
  choice: onye jupụtara na Mmụọ Nsọ
  rationale: Nke a bụ ụzọ Igbo si ekwu ya nke ọma ma doo anya na ọ na-ekwu banyere Mmụọ Nsọ, ọ bụghị nanị mmụọ ma ọ bụ àgwà dị nsọ.
- source_word: πίστεως
  choice: okwukwe
  rationale: “Okwukwe” bụ ntụgharị bụ isi nke πίστις n’ebe a; e debere ohere nke “ikwesị ntụkwasị obi” n’okpuru amaokwu n’ihi na okwu Grik ahụ nwere ike ibu nghọta ahụ.
- source_word: προσετέθη
  choice: sonyekwara
  rationale: Ụdị a na-egosi na e tinyere ndị ahụ n’ebe Onyenwe anyị nọ n’asụsụ Igbo dị ndụ. Ọ bụ ezie na ọ naghị edobe passive Grik n’ụdị okwu kpọmkwem, ọ na-edobe isi ihe omume ahụ n’enweghị ịgbanwe ihe e tinyere ha na ya.
- source_word: ὄχλος ἱκανὸς
  choice: Ọtụtụ mmadụ
  rationale: N’ebe a, ὄχλος ἱκανός pụtara ìgwè mmadụ bara ụba; “ọtụtụ mmadụ” bụ okwu Igbo nkịtị, doro anya, nke na-egosi ọnụ ọgụgụ dị ukwuu.
- source_word: τῷ κυρίῳ
  choice: n’ebe Onyenwe anyị nọ
  rationale: A nọgidere na-eme Onyenwe anyị onye ndị ahụ sonyeere, kama iji “ụka” ma ọ bụ “ọgbakọ” dochie ihe Grik kwuru.
theological_decisions:
- issue: Ihe πνεύματος ἁγίου pụtara
  choice: Mmụọ Nsọ dịka Mmụọ Chineke
  alternative: mmụọ ma ọ bụ àgwà dị nsọ
  rationale: N’akwụkwọ Luk na Ọrụ Ndị Ozi, okwu a na-ezokarị aka na Mmụọ Nsọ; ihe e kwuru banyere Banabas kwekọrọ na ndụ onye Mmụọ Nsọ na-achị.
- issue: Nghọta πίστεως n’àgwà Banabas
  choice: okwukwe
  alternative: ikwesị ntụkwasị obi
  rationale: Ebe okwu ahụ nwere ike ịpụta ntụkwasị obi n’ebe Chineke nọ ma ọ bụ ịdị kwesịrị ntụkwasị obi dịka àgwà, e ji “okwukwe” mee isi ntụgharị ma debe nke ọzọ n’okpuru amaokwu.
- issue: Onye ma ọ bụ ihe ndị ahụ sonyeere na προσετέθη ... τῷ κυρίῳ
  choice: Onyenwe anyị
  alternative: ụka ma ọ bụ ọgbakọ ndị kwere ekwe
  rationale: Grik kpọrọ Onyenwe anyị aha kpọmkwem. Ọ bụ ezie na isonyere ọgbakọ ndị kwere ekwe so n’ihe a na-atụ anya ya, ntụgharị ekwesịghị iji nkọwa ahụ dochie ihe ederede kwuru.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. A họọrọ “ezigbo nwoke” maka nkọwa kpọmkwem banyere Banabas, “Onyenwe anyị” maka κύριος, ma zere iji “ụka” dochie onye Grik kwuru na ndị mmadụ sonyeere.
