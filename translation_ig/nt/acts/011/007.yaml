  text: ἤκουσα δὲ ⸀καὶ φωνῆς λεγούσης μοι· Ἀναστάς, Πέτρε, θῦσον καὶ φάγε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/007.yaml
  text: And I also heard a voice saying to me, ‘Get up, Peter; kill and eat.’
translation:
  language: ig
  text: M wee nụkwa otu olu ka ọ na-asị m, ‘Bilie, Pita; gbuo ma rie.’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤκουσα δὲ καὶ
  choice: M wee nụkwa
  rationale: Na-egosipụta njikọ akụkọ nke δὲ na mgbakwunye nke καὶ n'Igbo dị larịị.
- source_word: φωνῆς λεγούσης μοι
  choice: otu olu ka ọ na-asị m
  rationale: Na-edobe ihe owuwu nke olu na-agwa Pita okwu n'ụzọ Igbo nkịtị.
- source_word: Ἀναστάς
  choice: Bilie
  rationale: Iwu a pụtara ibili ma ọ bụ kwụrụ gawa ime ihe; “Bilie” bụ okwu Igbo doro anya ma kwekọọ n'ọnọdụ a.
- source_word: θῦσον
  choice: gbuo
  rationale: N'ọnọdụ anụmanụ ndị a hụrụ n'ọhụụ, okwu a bụ iwu igbu anụ ka e rie ya; “gbuo” na-ezere itinye echiche àjà nke ọnọdụ a anaghị achọ.
- source_word: φάγε
  choice: rie
  rationale: Ọ bụ iwu kpọmkwem nke pụtara iri nri.
theological_decisions:
- issue: Ma θῦσον ọ̀ ga-egosi àjà okpukpe
  choice: gbuo
  alternative: chụọ àjà
  rationale: Ọ bụ ezie na θύω nwere ike ịpụta ịchụ àjà n'ọnọdụ ụfọdụ, ebe a ọ na-ezo aka n'igbu anụ ndị dị n'ọhụụ ka Pita rie; ya mere a naghị etinye echiche àjà n'amaghị ama.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E debere okwu ahụ dị mkpụmkpụ dịka iwu ndị dị na Grik.
