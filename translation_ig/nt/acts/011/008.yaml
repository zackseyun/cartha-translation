revisions:
- from: Ma m kwuru, ‘Mba, Onyenwe anyị, n’ihi na ọ dịghị ihe ọ bụla e weere dị ka ihe na-adịghị nsọ ma ọ bụ ihe na-adịghị ọcha batụtụrụla n’ọnụ m.’
  to: Ma m sịrị, ‘Mba, Onyenwe anyị, n’ihi na ọ dịbeghị mgbe ihe ọbụla na-adịghị nsọ ma ọ bụ na-adịghị ọcha batara n’ọnụ m.’
  rationale: The revision corrects the central action from merely touching the mouth to entering it, and streamlines the rendering of κοινόν without collapsing it into ἀκάθαρτον or adding explanatory material not present in the text.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T09:17:54Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves Peter’s emphatic refusal, the causal clause, and the distinction between κοινόν and ἀκάθαρτον. However, “batụtụrụla n’ọnụ m” means “has touched my mouth,” not “has entered my mouth,” and so weakens the source expression εἰσῆλθεν εἰς τὸ στόμα μου.
  naturalness: The revised wording uses idiomatic Standard Igbo. “Ọ dịbeghị mgbe ... batara n’ọnụ m” naturally conveys “has never entered my mouth” without adding an interpretive paraphrase about eating.
  terminology: “Ihe na-adịghị nsọ” retains the cultic/profane force of κοινόν, while “ihe na-adịghị ọcha” renders ἀκάθαρτον. They remain distinct, as in Greek. “Onyenwe anyị” is retained as the established respectful title and does not identify the speaker’s addressee beyond the Greek κύριε.
  issues:
  - severity: medium
    issue: “batụtụrụla n’ọnụ m” does not render ‘entered my mouth.’
    rationale: The verb batụ refers to touching. The Greek says that no common or unclean thing has entered Peter’s mouth; the wording should retain this image.
  - severity: low
    issue: “ihe e weere dị ka ihe na-adịghị nsọ” is more interpretive and cumbersome than necessary.
    rationale: κοινόν can be rendered clearly as “ihe na-adịghị nsọ” in this ritual context, while preserving its distinction from “ihe na-adịghị ọcha.”
  revised_text: Ma m sịrị, ‘Mba, Onyenwe anyị, n’ihi na ọ dịbeghị mgbe ihe ọbụla na-adịghị nsọ ma ọ bụ na-adịghị ọcha batara n’ọnụ m.’
  revised_footnotes: []
  revision_rationale: The revision corrects the central action from merely touching the mouth to entering it, and streamlines the rendering of κοινόν without collapsing it into ἀκάθαρτον or adding explanatory material not present in the text.
