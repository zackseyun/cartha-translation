  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἶπον δέ· Μηδαμῶς, κύριε, ⸀ὅτι κοινὸν ἢ ἀκάθαρτον οὐδέποτε εἰσῆλθεν εἰς τὸ στόμα μου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/008.yaml
  text: But I said, ‘By no means, Lord, because nothing common or unclean has ever entered my mouth.’
translation:
  language: ig
  text: Ma m sịrị, ‘Mba, Onyenwe anyị, n’ihi na ọ dịbeghị mgbe ihe ọbụla na-adịghị nsọ ma ọ bụ na-adịghị ọcha batara n’ọnụ m.’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μηδαμῶς
  choice: Mba
  rationale: Na-egosipụta ọjụjụ siri ike n’Igbo nkịtị; ihe gbara ya gburugburu na-eme ka ike okwu ahụ doo anya.
- source_word: κύριε
  choice: Onyenwe anyị
  rationale: Aha nkwanye ùgwù kwesịrị ekwesị maka onye a na-agwa okwu n’ọhụụ ahụ, ma na-edobe ohere nghọta okwu Grik ahụ.
- source_word: κοινὸν
  choice: ihe e weere dị ka ihe na-adịghị nsọ
  rationale: N’ebe a κοινός abụghị naanị ‘ihe nkịtị’; ọ na-ezo aka n’ihe e lere anya dị ka nke emetọworo n’usoro okpukpe ma ọ bụ nke na-abụghị ihe nsọ.
- source_word: ἀκάθαρτον
  choice: ihe na-adịghị ọcha
  rationale: Na-edobe okwu dị iche n’etiti κοινόν na ἀκάθαρτον, karịsịa n’ihe gbasara nri e nyere iwu ka a ghara iri.
- source_word: εἰσῆλθεν εἰς τὸ στόμα μου
  choice: batụtụrụla n’ọnụ m
  rationale: Ụzọ okwu Igbo doro anya nke na-edobe ihe oyiyi nke ihe ịbanye n’ọnụ, ya bụ iri ya.
- source_word: ὅτι
  choice: n’ihi na
  rationale: Na-egosipụta ihe kpatara Pita ji jụ, kwekọrọ na njikọ okwu nke amaokwu ahụ.
theological_decisions:
- issue: Mmekọrịta dị n’etiti κοινόν na ἀκάθαρτον
  choice: 'E debere ha dị ka echiche abụọ metụtara ibe ha: ‘ihe na-adịghị nsọ’ na ‘ihe na-adịghị ọcha.’'
  alternative: Ịchịkọta ha abụọ ka ha bụrụ naanị ‘ihe rụrụ arụ.’
  rationale: Isi mmalite ahụ ji okwu abụọ dị iche, ya mere nsụgharị ahụ ekwesịghị ihichapụ ọdịiche ahụ ma ọ bụ kpebie karịa ihe ederede kwuru.
- issue: Onye κύριε na-ezo aka na ya
  choice: A sụgharịrị ya ‘Onyenwe anyị’ n’enweghị nkọwa agbakwunyere.
  alternative: Ịkpọ onye ahụ kpọmkwem ‘Jizọs’ ma ọ bụ ịsụgharị ya naanị ‘nna ukwu.’
  rationale: Ederede ahụ n’onwe ya adịghị akọwa njirimara onye a na-agwa okwu n’ahịrịokwu a; nsụgharị ahụ na-echekwa ohere nghọta ahụ.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E ji ‘batụtụrụla’ gosipụta οὐδέποτε na perfect ahụ n’ụzọ eke, ebe ‘ihe e weere dị ka’ na-eme ka echiche omenala/usoro okpukpe dị na κοινόν pụta ìhè.
