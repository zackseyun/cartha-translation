  verdict: revise
  source_fidelity: The added phrase “ihe niile” (“everything/all things”) has no counterpart in the Greek and unnecessarily broadens the object of Peter’s account. The Greek leaves the object implicit from context; Igbo may express it with the resumptive pronoun “ya.” The revised wording also supplies the natural Igbo infinitive after “malitere,” accurately conveying ἀρξάμενος with the ongoing imperfect ἐξετίθετο.
  naturalness: “Malitere ịkọwaara ha ya n’usoro” is idiomatic Standard Igbo. It avoids the less natural serial construction “malitere kọwaara” and retains a suitably formal, clear narrative register.
  terminology: “Pita,” “kọwaara,” “n’usoro,” and “sị” are appropriate Standard Igbo choices. The footnote remains anchored to “n’usoro” and gives natural alternatives for καθεξῆς without introducing a doctrinal or historical interpretation.
  issues:
  - severity: medium
    issue: The draft adds “ihe niile.”
    rationale: Neither ἀρξάμενος, ἐξετίθετο, nor any other word in the verse means “all/everything.” This addition should be removed to preserve the source’s contextual implicitness.
  - severity: low
    issue: “malitere kọwaara” lacks the expected infinitival complement in polished Standard Igbo.
    rationale: “Malitere ịkọwaara” is the natural construction for “began to explain.”
