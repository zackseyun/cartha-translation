  text: 'Ma Pita malitere ịkọwaara ha ya n’usoro[a], sị:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “kọọrọ ha ya n’usoro” ma ọ bụ “nyeere ha akụkọ ahụ n’usoro haziri ahazi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀρξάμενος
  choice: malitere
  rationale: Aorist middle participle a na-arụ ọrụ dị ka adverb; “malitere” na-enye echiche ahụ n’Igbo dị mfe ma jikọta ya na omume ịkọwa.
- source_word: δὲ
  choice: Ma
  rationale: N’ebe a δέ na-egosi obere ntụgharị ma ọ bụ ihe dị iche n’etiti ebubo dị n’amaokwu gara aga na nzaghachi Pita.
- source_word: Πέτρος
  choice: Pita
  rationale: Aha onye ahụ ka e dere n’ụdị a na-ejikarị ede Peter n’Igbo.
- source_word: ἐξετίθετο
  choice: kọwaara
  rationale: Okwu a pụtara ịtọpụ ma ọ bụ ịkọwa otu ihe; “kọwaara” bụ okwu Igbo doro anya nke dabara n’akụkọ Pita na-akọ.
- source_word: αὐτοῖς
  choice: ha
  rationale: Nnọchiaha dative plural a na-ezo aka n’ebe ndị Pita na-agwa okwu nọ; ngwaa “kọwaara” na-eburu echiche “to them” n’ụzọ ebumpụta ụwa.
- source_word: καθεξῆς
  choice: n’usoro
  rationale: Ọ na-egosi na Pita kọọrọ ha ihe ndị ahụ otu ha siri na-esochi ibe ha, n’usoro haziri ahazi.
- source_word: λέγων
  choice: sị
  rationale: Present participle a na-ewebata okwu Pita ga-ekwu; “sị” bụ ụzọ Igbo dị mfe na nke ebumpụta ụwa isi webata okwu kpọmkwem.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo izugbe, nke ugbu a ma dị ùgwù. A họọrọ “ihe niile” iji mee ka ihe Pita kọwara pụta ìhè n’Igbo, ebe Greek hapụrụ ihe a na-ekwu maka ya ka ọnọdụ okwu kọwaa. Akara nkọwa ala peeji [a] dị n’akụkụ “n’usoro” dịka achọrọ.
