id: ACT.11.26
reference: Acts 11:26
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ εὑρὼν ⸀ἤγαγεν εἰς Ἀντιόχειαν. ἐγένετο δὲ ⸂αὐτοῖς καὶ⸃ ἐνιαυτὸν ὅλον συναχθῆναι ⸀ἐν τῇ ἐκκλησίᾳ καὶ διδάξαι ὄχλον ἱκανόν, χρηματίσαι τε ⸀πρώτως ἐν Ἀντιοχείᾳ τοὺς μαθητὰς Χριστιανούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/026.yaml
  text: And when he found him, he brought him to Antioch. And for a whole year they met together with the church and taught a considerable crowd; and it was in Antioch that the disciples were first called Christians.
translation:
  language: ig
  text: Mgbe ọ chọtara ya, ọ kpọtara ya gaa Antiọk. Ha na ọgbakọ ahụ zukọtara otu afọ dum, kụzikwaara ọtụtụ mmadụ ihe; ọ bụkwa n’Antiọk ka a kpọrọ ndị na-eso ụzọ ahụ Ndị Kraịst na nke mbụ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Grik kwuru, “a kpọrọ ndị na-eso ụzọ ahụ Ndị Kraịst na nke mbụ.” O yikarịrị ka aha a malitere dị ka aha ndị mmadụ ji akpọ ha n’Antiọk.
    reason: cultural_note
lexical_decisions:
- source_word: εὑρὼν
  choice: Mgbe ọ chọtara ya
  rationale: A tụgharịrị participle aorist ahụ dị ka nkebiokwu oge iji gosi na ịchọta ya buru ụzọ mee, n’Igbo dị mfe ma doo anya.
- source_word: ἤγαγεν
  choice: ọ kpọtaara ya
  rationale: N’ebe a ἄγω pụtara iduga ma ọ bụ ịkpọta Sọl n’Antiọk; ‘kpọtaara’ bụ okwu Igbo eke dabara n’ọnọdụ ahụ.
- source_word: ἐνιαυτὸν ὅλον
  choice: ruo otu afọ zuru ezu
  rationale: Nke a na-egosi ogologo oge ahụ dum; nsụgharị ahụ bụ Igbo nkịtị ma debe echiche nke ‘a whole year.’
- source_word: συναχθῆναι ἐν τῇ ἐκκλησίᾳ
  choice: Ha na nzukọ ahụ zukọtara
  rationale: Nke a na-egosi na Banabas na Sọl zukọrọ ọnụ na obodo ndị kwere ekwe, kama ime ka a ghọta ἐκκλησία dị ka ụlọ.
- source_word: ἐκκλησίᾳ
  choice: nzukọ ahụ
  rationale: N’ebe a okwu ahụ na-ezo aka n’ọgbakọ ma ọ bụ obodo ndị kwere ekwe, ọ bụghị n’ụlọ ụka.
- source_word: διδάξαι
  choice: kụzikwaara ... ihe
  rationale: A haziri infinitive ahụ ka ọ bụrụ ngwaa Igbo jikọrọ omume nke abụọ nke Banabas na Sọl.
- source_word: ὄχλον ἱκανόν
  choice: ọtụtụ mmadụ
  rationale: ἱκανός n’ebe a na-egosi ìgwè mmadụ buru ibu ma ọ bụ bara ụba; ‘ọtụtụ mmadụ’ bụ okwu Igbo doro ndị mmadụ anya, n’enweghị ikwubiga ókè.
- source_word: χρηματίσαι
  choice: a kpọrọ
  rationale: Passive Igbo a na-egosi na e nyere ndị na-eso ụzọ ahụ aha ahụ, ma ọ naghị ekpebi onye kpọrọ ha ya.
- source_word: πρώτως
  choice: na nke mbụ
  rationale: Nke a na-egosi ebe na oge aha ahụ malitere iji mee ihe.
- source_word: Χριστιανούς
  choice: Ndị Kraịst
  rationale: Nke a bụ aha otu ndị a maara nke ọma n’Igbo, ọ bụghị naanị ntụgharị nkịtị nke utu aha Χριστός.
theological_decisions:
- issue: Otu e si tụgharịa Χριστιανούς mgbe Χριστός bụ utu aha
  choice: Ndị Kraịst
  alternative: Ndị Mesaya
  rationale: Χριστιανούς bụ aha e ji mara otu ndị na-eso Kraịst. ‘Ndị Kraịst’ bụ aha Igbo kwụụrụ onwe ya ma bụrụ nke a na-aghọta nke ọma; ‘Ndị Mesaya’ nwere ike ime ka a ghọta ihe ọzọ ma ọ bụ mee ka etymology karịa ọrụ okwu ahụ n’amaokwu a.
- issue: Ma χρηματίσαι ọ na-egosi na Chineke kpọrọ ha aha ahụ ma ọ bụ na ndị mmadụ kpọrọ ha ya
  choice: a kpọrọ
  alternative: Chineke kpọrọ ha
  rationale: Greek ekwughị onye nyere aha ahụ. Passive na-enweghị onye mere ihe na-echekwa mgbagwoju anya ahụ ma zere itinye nkọwa nkà mmụta okpukpe na-adịghị n’ederede.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. ‘Nzukọ’ na-egosi obodo ndị kwere ekwe kama ụlọ; ‘Ndị Kraịst’ na-edebe aha otu ahụ a maara nke ọma. A hapụrụ onye nyere aha ahụ n’amaghị ama dịka Greek si mee.
