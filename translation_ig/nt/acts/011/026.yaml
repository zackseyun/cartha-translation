revisions:
- from: Mgbe ọ chọtara ya, ọ kpọtaara ya n’Antiọk. Ha na nzukọ ahụ zukọtara ruo otu afọ zuru ezu[a], kụzikwaara ọtụtụ mmadụ ihe; ọ bụkwa n’Antiọk ka a kpọrọ ndị na-eso ụzọ ahụ Ndị Kraịst na nke mbụ[b].
  to: Mgbe ọ chọtara ya, ọ kpọtara ya gaa Antiọk. Ha na ọgbakọ ahụ zukọtara otu afọ dum, kụzikwaara ọtụtụ mmadụ ihe; ọ bụkwa n’Antiọk ka a kpọrọ ndị na-eso ụzọ ahụ Ndị Kraịst na nke mbụ[b].
  rationale: The revision corrects the destination verb construction, improves the assembly terminology and temporal expression, and retains the Greek ambiguity concerning the unnamed agent who called the disciples Christians. Footnote a is retained as an alternative for the locative phrase, but its wording is aligned with ‘ọgbakọ.’
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T09:18:13Z'
review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately conveys the sequence, the year-long gathering and teaching, and the passive, unspecified agent in ‘were called.’ However, ‘ọ kpọtaara ya n’Antiọk’ is not an idiomatic or precise rendering of ἤγαγεν εἰς Ἀντιόχειαν: kpọtaara introduces an unnecessary benefactive sense, while n’Antiọk can read locatively rather than as a destination.'
  naturalness: Standard Igbo is generally clear and suitably formal. Replacing ‘nzukọ’ with ‘ọgbakọ’ more naturally denotes the gathered Christian community, and ‘otu afọ dum’ expresses the full-year duration without the potentially endpoint-oriented nuance of ‘ruo.’
  terminology: ‘Ndị Kraịst’ is the established, natural Igbo designation for Χριστιανούς. ‘ọgbakọ’ appropriately represents ἐκκλησία here as a community/assembly rather than a building. The impersonal passive ‘a kpọrọ’ correctly leaves unnamed whoever applied the designation.
  issues:
  - severity: medium
    issue: The rendering of ἤγαγεν εἰς Ἀντιόχειαν is imprecise.
    rationale: ‘Ọ kpọtaara ya n’Antiọk’ may mean that he called/brought him for someone and places the action in Antioch. ‘Ọ kpọtara ya gaa Antiọk’ plainly expresses bringing Saul to Antioch and introduces no extra participant.
  - severity: low
    issue: ‘Nzukọ’ and ‘ruo otu afọ zuru ezu’ are less natural in this context.
    rationale: ‘Ọgbakọ’ more readily identifies the Christian assembly/community, and ‘otu afọ dum’ directly conveys ἐνιαυτὸν ὅλον (‘a whole year’).
  revised_text: Mgbe ọ chọtara ya, ọ kpọtara ya gaa Antiọk. Ha na ọgbakọ ahụ zukọtara otu afọ dum, kụzikwaara ọtụtụ mmadụ ihe; ọ bụkwa n’Antiọk ka a kpọrọ ndị na-eso ụzọ ahụ Ndị Kraịst na nke mbụ[b].
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “Ha zukọtara n’ọgbakọ ahụ.” Okwu Grik ahụ nwere ike igosi na ha na ọgbakọ ndị kwere ekwe zukọrọ, kama ịbụ na ha zukọrọ n’otu ụlọ.
    reason: lexical_alternative
  - marker: b
    text: Grik kwuru, “a kpọrọ ndị na-eso ụzọ ahụ Ndị Kraịst na nke mbụ.” O yikarịrị ka aha a malitere dị ka aha ndị mmadụ ji akpọ ha n’Antiọk.
    reason: cultural_note
  revision_rationale: The revision corrects the destination verb construction, improves the assembly terminology and temporal expression, and retains the Greek ambiguity concerning the unnamed agent who called the disciples Christians. Footnote a is retained as an alternative for the locative phrase, but its wording is aligned with ‘ọgbakọ.’
