id: ACT.11.15
reference: Acts 11:15
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐν δὲ τῷ ἄρξασθαί με λαλεῖν ἐπέπεσεν τὸ πνεῦμα τὸ ἅγιον ἐπ’ αὐτοὺς ὥσπερ καὶ ἐφ’ ἡμᾶς ἐν ἀρχῇ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/015.yaml
  text: And as I began to speak[c][b][a], the Holy Spirit fell on them just as it had on us at the beginning.
translation:
  language: ig
  text: Ma ka m malitere ikwu okwu[a], Mmụọ Nsọ dakwasịrị ha, dị nnọọ ka ọ dakwasịrịkwa anyị[c] na mmalite.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “mgbe m malitere ikwu okwu.” Nhazi okwu Grik ahụ nwere ike ịpụta “ka” ma ọ bụ “mgbe.”
    reason: lexical_alternative
  - marker: b
    text: O yikarịrị ka “na mmalite” na-ezo aka na mmalite nke mwụpụ Mmụọ Nsọ n'ahụ ndị na-eso ụzọ, ya bụ, Pentikọst.
    reason: cross_reference
  - marker: c
    text: 'N''ụzọ dị nso karị n''usoro okwu Grik: “dị nnọọ ka ọ dịkwara n''ahụ anyị.”'
    reason: previous_rendering
lexical_decisions:
- source_word: ἐν δὲ τῷ ἄρξασθαί με λαλεῖν
  choice: Ma ka m malitere ikwu okwu
  rationale: Nhazi ἐν + infinitive nwere article na-egosi oge ihe abụọ na-eme n'otu oge. “Ka m malitere” bụ Igbo dị mfe nke na-egosi na Mmụọ Nsọ bịara ozugbo Pita malitere okwu.
- source_word: λαλεῖν
  choice: ikwu okwu
  rationale: N'ebe a, λαλέω na-ekwu maka Pita ịgwa ndị nọ ebe ahụ okwu; “ikwu okwu” bụ okwu Igbo nkịtị ma dịkwa ùgwù.
- source_word: ἐπέπεσεν
  choice: dakwasịrị
  rationale: Okwu a na-edobe ihe oyiyi siri ike dị na ἐπιπίπτω, nke Ọrụ Ndị Ozi ji akọwa Mmụọ ịbịakwasị mmadụ, n'enweghị ịkọwa ya karịa ihe odide ahụ kwuru.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: Mmụọ Nsọ
  rationale: Nke a bụ aha a na-ejikarị eme ihe n'Igbo ugbu a maka aha Grik a, ma o ziri ezi ma doo anya.
- source_word: ἐπ’ αὐτούς
  choice: ha
  rationale: Mgbe e jikọtara ya na “dakwasịrị,” “ha” na-enye “dakwasịrị ha,” nke bụ ụzọ Igbo si kwuo ἐπ’ αὐτούς n'ụzọ doro anya.
- source_word: ὥσπερ καὶ ἐφ’ ἡμᾶς
  choice: dị nnọọ ka ọ dakwasịrịkwa anyị
  rationale: “Dị nnọọ ka” na-egosipụta ntụnyere siri ike nke ὥσπερ, ebe “-kwa” na-echekwa καί. E tinyere ngwaa a na-aghọta n'okwu Grik ka ahịrịokwu Igbo wee zuo oke ma bụrụ ihe e ji ọnụ ekwu.
- source_word: ἐν ἀρχῇ
  choice: na mmalite
  rationale: Nke a na-echekwa ntụaka oge nke okwu Grik n'emeghị ka ntụgharị n'onwe ya kpebie kpọmkwem ihe “mmalite” ahụ bụ.
theological_decisions:
- issue: Ihe “na mmalite” (ἐν ἀρχῇ) na-ezo aka na ya
  choice: 'E debere ya dịka ntụaka oge sara mbara: “na mmalite.”'
  alternative: Ịsụgharị ya n'ụzọ ga-akpọ Pentikọst aha kpọmkwem, ma ọ bụ “na mbụ” n'enweghị ntụaka pụrụ iche.
  rationale: Ihe gbara amaokwu ahụ gburugburu na-eme ka o yie ka Pita na-ezo aka na mwụpụ mbụ nke Mmụọ Nsọ n'ahụ ndị na-eso ụzọ, karịchaa na Pentikọst. Ma ebe okwu Grik akpọghị Pentikọst aha, isi amaokwu ahụ na-echekwa oghere ahụ, ebe nkọwa ala peeji na-egosi ihe o yikarịrị ka ọ bụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ “dakwasịrị” iji chekwaa ike nke ihe oyiyi Grik, ma e zere itinye nkọwa ụka ma ọ bụ ozizi pụrụ iche n'ime isi amaokwu ahụ.
