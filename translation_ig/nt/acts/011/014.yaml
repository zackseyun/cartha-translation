revisions:
- from: Ọ ga-agwa gị okwu ndị ị ga-esite na ha bụrụ onye a zọpụtara, gị na ndị niile nọ n’ezinụlọ gị.[a]
  to: Ọ ga-agwa gị okwu ndị site na ha ka a ga-azọpụta gị na ndị niile n’ezinụlọ gị.[a]
  rationale: 'The revision preserves every major source feature: the referential ‘Ọ,’ future speech addressed to ‘gị,’ plural ‘okwu,’ the instrumental force of ἐν οἷς, the future passive sense of σωθήσῃ, and the stated scope of the household. It uses a more natural Standard Igbo passive construction and does not add qualifications concerning how household members receive salvation.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T09:18:01Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders the future speaking, the plural ‘words,’ their instrumental relation to salvation, and the household-wide scope. However, ‘ị ga-esite na ha bụrụ onye a zọpụtara’ is a somewhat cumbersome construction and makes the relationship between the words and the passive saving event less direct than the Greek.
  naturalness: ‘Ọ ga-agwa gị okwu’ is natural Standard Igbo. Recasting the salvation clause with the impersonal future passive, ‘a ga-azọpụta,’ is clearer and more idiomatic while retaining the Greek passive sense.
  terminology: ‘azọpụta’ appropriately conveys σωθήσῃ in this Acts context. ‘ndị niile n’ezinụlọ gị’ naturally expresses the persons constituting the household without reducing οἶκος to a physical house or importing a doctrinal explanation.
  issues:
  - severity: medium
    issue: The instrumental salvation clause is syntactically heavy.
    rationale: ‘okwu ndị ị ga-esite na ha bụrụ onye a zọpụtara’ can be understood, but it is less direct and less natural than an explicit instrumental phrase followed by Igbo’s normal impersonal passive expression. The revision more plainly conveys ‘words by/through which you will be saved.’
  - severity: low
    issue: The phrase ‘ndị niile nọ n’ezinụlọ gị’ may overfocus on physical presence or residence.
    rationale: οἶκος denotes the household unit. ‘ndị niile n’ezinụlọ gị’ is slightly more idiomatic and retains the collective-personal scope without specifying mere location.
  revised_text: Ọ ga-agwa gị okwu ndị site na ha ka a ga-azọpụta gị na ndị niile n’ezinụlọ gị.[a]
  revised_footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “n’ime ha” ma ọ bụ “site na ha”; okwu Grik ahụ na-egosi na okwu ndị ahụ bụ ụzọ e si enweta nzọpụta.
    reason: lexical_alternative
  revision_rationale: 'The revision preserves every major source feature: the referential ‘Ọ,’ future speech addressed to ‘gị,’ plural ‘okwu,’ the instrumental force of ἐν οἷς, the future passive sense of σωθήσῃ, and the stated scope of the household. It uses a more natural Standard Igbo passive construction and does not add qualifications concerning how household members receive salvation.'
