  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὃς λαλήσει ῥήματα πρὸς σὲ ἐν οἷς σωθήσῃ σὺ καὶ πᾶς ὁ οἶκός σου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/014.yaml
  text: He will speak words to you by which you and all your household will be saved[a].
translation:
  language: ig
  text: Ọ ga-agwa gị okwu ndị site na ha ka a ga-azọpụta gị na ndị niile n’ezinụlọ gị.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “n’ime ha” ma ọ bụ “site na ha”; okwu Grik ahụ na-egosi na okwu ndị ahụ bụ ụzọ e si enweta nzọpụta.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς
  choice: Ọ
  rationale: Nnọchiaha a na-ezo aka n’azụ n’ebe nwoke ahụ a kpọtụrụ aha nọ; Igbo na-eji “Ọ” malite nkebiokwu a n’ụzọ doro anya ma dịkwa mma.
- source_word: λαλήσει
  choice: ga-agwa
  rationale: Ọdịnihu nke λαλέω pụtara ikwu okwu; “ga-agwa gị” na-egosipụta nke ọma na okwu ahụ na-aga n’ebe onye na-ege ntị nọ.
- source_word: ῥήματα
  choice: okwu ndị
  rationale: E ji aha ọtụtụ kpọmkwem “okwu ndị” mee ka ọdịdị ọtụtụ nke Grik dịgide, kama ime ya naanị “ozi.”
- source_word: πρὸς σὲ
  choice: gị
  rationale: N’ahịrịokwu “ga-agwa gị,” nke a na-egosipụta ntụziaka okwu ahụ n’ebe onye na-anụ ya nọ n’Igbo ebumpụta ụwa.
- source_word: ἐν οἷς
  choice: ị ga-esite na ha
  rationale: Nke a na-egosipụta ọrụ ἐν dị ka ụzọ ma ọ bụ ihe e ji enweta nzọpụta, ma na-ahapụkwa ihe njikọ ahụ pụtara ka ọ dị n’ụzọ kwekọrọ n’Igbo.
- source_word: σωθήσῃ
  choice: bụrụ onye a zọpụtara
  rationale: 'Ụdị nnara nke σῴζω ka e debere: onye ahụ anaghị azọpụta onwe ya, kama a na-azọpụta ya. Okwu a dabara n’ọnọdụ nzọpụta dị n’Ọrụ Ndịozi.'
- source_word: σὺ
  choice: gị
  rationale: E debere nkwusiri ike nke nnọchiaha Grik site n’itinye “gị” ọzọ tupu njikọ ya na ezinụlọ ya.
- source_word: πᾶς ὁ οἶκός σου
  choice: ndị niile nọ n’ezinụlọ gị
  rationale: οἶκος ebe a bụ ndị mejupụtara ụlọ, ọ bụghị naanị ụlọ ahụ dị ka ihe owuwu; okwu Igbo a na-egosipụta mmadụ niile so n’ezinụlọ ahụ.
theological_decisions:
- issue: Ihe σωθήσῃ pụtara n’ihe gbasara ezinụlọ Kọniliọs
  choice: “bụrụ onye a zọpụtara”
  alternative: “bụrụ onye a napụtara”
  rationale: Ọnọdụ gbara amaokwu a gburugburu bụ ịnụ ozi ọma na inweta nzọpụta. Nsụgharị ahụ anaghị atụkwasị nkọwa ozizi ọzọ banyere usoro nzọpụta.
- issue: Oke okwu πᾶς ὁ οἶκός σου ruru
  choice: “ndị niile nọ n’ezinụlọ gị”
  alternative: “ezinụlọ gị dum”
  rationale: E debere oke ezinụlọ ahụ dịka Grik si kwuo ya, ma e tinyeghị echiche na onye ọ bụla ga-enweta nzọpụta n’onwe ya n’enweghị nzaghachi; amaokwu a akọwaghị nke ahụ.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E ji “ndị niile nọ n’ezinụlọ gị” zere nghọtahie na a na-ekwu maka ụlọ dịka ihe owuwu. Akara nkọwa ala [a] dị n’isiokwu ahụ.
