id: ACT.11.1
reference: Acts 11:1
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἤκουσαν δὲ οἱ ἀπόστολοι καὶ οἱ ἀδελφοὶ οἱ ὄντες κατὰ τὴν Ἰουδαίαν ὅτι καὶ τὰ ἔθνη ἐδέξαντο τὸν λόγον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/001.yaml
  text: The apostles and the brothers who were throughout Judea heard that the Gentiles also had received the word of God[a].
translation:
  language: ig
  text: Ndịozi na ụmụnna ndị nọ n’ala Judia niile nụrụ na ndị mba ọzọ natakwara okwu Chineke.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ụmụnna nwoke na ụmụnna nwanyị.” Okwu Grik ahụ dị n’ụdị nwoke, ma ọ pụrụ izo aka n’ebe ndị kwere ekwe ibe ha nọ n’ozuzu ha.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἤκουσαν
  choice: nụrụ
  rationale: Oge ngwaa a na-akọ na ha nụrụ ozi ahụ; “nụrụ” bụ ntụgharị Igbo dị mfe ma kwekọọ na ihe odide Grik.
- source_word: δὲ
  choice: —
  rationale: N’ebe a δέ bụ njikọ na-eme ka akụkọ gaa n’ihu, ọ bụghị nnukwu ọdịiche. Igbo anaghị achọ ka e jiri okwu pụrụ iche malite ahịrịokwu a, ya mere a hapụrụ ya ka usoro akụkọ gosipụta njikọ ahụ.
- source_word: οἱ ἀπόστολοι
  choice: Ndịozi
  rationale: Nke a bụ aha a maara nke ọma maka ndị otu ahụ e nyere ọrụ pụrụ iche dịka ndịozi n’akwụkwọ Ọrụ Ndịozi.
- source_word: οἱ ἀδελφοὶ
  choice: ụmụnna
  rationale: “Ụmụnna” bụ okwu Igbo dị ugwu ma bụrụkwa nke a na-ejikarị akọwa ndị otu okwukwe. Ihe odide Grik ji ụdị nwoke, ma ọ pụrụ ịgụnye ndị kwere ekwe n’ozuzu ha; e debere nke a n’ala peeji.
- source_word: οἱ ὄντες κατὰ τὴν Ἰουδαίαν
  choice: ndị nọ n'akụkụ niile nke Judia
  rationale: Nkebi a na-egosi na ha nọ ebe dị iche iche gbasasịrị na Judia; “n'akụkụ niile” na-echekwa nghọta nkesa nke κατά.
- source_word: Ἰουδαίαν
  choice: Judia
  rationale: “Judia” bụ nsụgharị aha mpaghara ahụ n’ụzọ dabara n’usoro mkpọpụta na ide aha n’Igbo.
- source_word: ὅτι
  choice: na
  rationale: “Na” na-ewebata ọdịnaya nke ozi ha nụrụ n’ụzọ nkịtị n’Igbo.
- source_word: καὶ
  choice: kwa
  rationale: A gbakwụnyere “kwa” n’ime “anabatakwala” iji chekwaa nkwusi ike na ndị mba ọzọ sokwa nata okwu ahụ.
- source_word: τὰ ἔθνη
  choice: ndị mba ọzọ
  rationale: N’ọnọdụ a okwu ahụ na-ezo aka ná ndị na-abụghị ndị Juu, ọ bụghị mba dị iche iche dịka ọchịchị.
- source_word: ἐδέξαντο
  choice: anabatakwala
  rationale: “Anabata” dabara n’usoro okwu banyere ịnabata ozi Chineke; mgbakwunye “-kwa” na-egosi na ndị mba ọzọ sokwa mee ya. Ọnọdụ akụkọ na-eme ka o doo anya na nke a mere tupu ndịozi na ụmụnna anụ akụkọ ya.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: okwu Chineke
  rationale: Nke a na-echekwa akpaalaokwu Akwụkwọ Nsọ na ịdị arọ ya, ma na-ezo aka n’ozi Chineke e kwusara.
theological_decisions:
- issue: Otú e si sụgharịa ἀδελφοὶ mgbe ọ pụrụ ịgụnye obodo ndị kwere ekwe dum
  choice: ụmụnna
  alternative: ụmụnna nwoke na ụmụnna nwanyị; ndị kwere ekwe
  rationale: “Ụmụnna” na-echekwa ihe oyiyi ezinụlọ nke okwu ahụ ma bụrụ okwu ndị Kraịst Igbo na-aghọta nke ọma. Ihe odide Grik ji ụdị nwoke, mana ọ pụrụ izo aka n’ebe ndị kwere ekwe ibe ha n’ozuzu ha nọ; nkọwa ala peeji na-edobe mgbagwoju a n’enweghị ịmanye otu nkọwa.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị mfe ma dị ugwu. Usoro ahịrịokwu ahụ na-agbaso Igbo nkịtị, ebe okwu ndị bụ isi—“Ndịozi,” “ụmụnna,” na “okwu Chineke”—na-echekwa ụda na akpaalaokwu Akwụkwọ Nsọ.
