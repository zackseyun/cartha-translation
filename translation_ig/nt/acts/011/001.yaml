review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately renders the principal sense: the apostles and the brothers in Judea heard the report that Gentiles too had received God''s word. However, “n''akụkụ niile nke Judia” literally evokes ‘all sides/parts of Judea’ and is less idiomatic for the distributive geographical force of κατὰ τὴν Ἰουδαίαν. “Anabatakwala” is understandable, but its layered perfect/additive morphology is less direct than the Greek aorist and slightly awkward here.'
  naturalness: A small revision produces more natural Standard Igbo. “N’ala Judia niile” idiomatically expresses being throughout Judea, and “natakwara” clearly conveys that the Gentiles also received the word.
  terminology: “Ndịozi,” “ụmụnna,” “ndị mba ọzọ,” and “okwu Chineke” are appropriate established biblical Igbo terms. The footnote should not imply that the Greek lexical item itself specifically says ‘male brothers’; rather, it is grammatically masculine and can refer more broadly to fellow believers.
  issues:
  - severity: medium
    issue: Geographical phrase is not fully idiomatic.
    rationale: “N'akụkụ niile nke Judia” can suggest the sides of Judea. The Greek means that the brothers were distributed throughout/in the whole of Judea; “ndị nọ n’ala Judia niile” conveys this naturally.
  - severity: low
    issue: Verb form is unnecessarily heavy.
    rationale: “Anabatakwala” combines completed-action and additive nuance in a form that is less smooth in this context. “Natakwara” naturally renders ἐδέξαντο together with καί (‘also received’).
  - severity: low
    issue: Footnote inaccurately characterizes the Greek form as explicitly ‘ụmụnna nwoke.’
    rationale: ἀδελφοί is masculine plural, but in this ecclesial context may be representative. The note should identify its grammatical masculine form while preserving the possible broader reference.
  revised_text: Ndịozi na ụmụnna ndị nọ n’ala Judia niile nụrụ na ndị mba ọzọ natakwara okwu Chineke.[a]
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “ụmụnna nwoke na ụmụnna nwanyị.” Okwu Grik ahụ dị n’ụdị nwoke, ma ọ pụrụ izo aka n’ebe ndị kwere ekwe ibe ha nọ n’ozuzu ha.
    reason: lexical_alternative
  revision_rationale: The revision retains the source’s syntax and additive emphasis while using idiomatic Standard Igbo for geographical distribution and receipt of the proclaimed word. The footnote preserves the lexical and grammatical nuance without overclaiming that the Greek explicitly names only males.
