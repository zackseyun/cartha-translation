revisions:
- from: Ndịozi na ụmụnna ndị nọ n'akụkụ niile nke Judia nụrụ na ndị mba ọzọ anabatakwala okwu Chineke.[a]
  to: Ndịozi na ụmụnna ndị nọ n’ala Judia niile nụrụ na ndị mba ọzọ natakwara okwu Chineke.[a]
  rationale: The revision retains the source’s syntax and additive emphasis while using idiomatic Standard Igbo for geographical distribution and receipt of the proclaimed word. The footnote preserves the lexical and grammatical nuance without overclaiming that the Greek explicitly names only males.
  reviewer_model: gpt-5.6-terra
