  to: 'Aka Onyenwe anyị dịnyere ha[a], ọtụtụ ndị kweere[b] chigharịkwuru Onyenwe anyị.


    [a] A pụkwara ịsụ ya, “Aka nke Onyenwe anyị.” Okwu a bụ akpaalaokwu Akwụkwọ Nsọ nke na-egosi ike Onyenwe anyị na-arụ ọrụ ma ọ bụ nkwado ya.


    [b] A pụkwara ịsụ ya, “ndị kwere ekwe.”'
  rationale: The revision replaces the cumbersome nominal subject with natural Igbo while retaining the source sense that a great many believing people turned to the Lord. It also corrects footnote b so that it remains an alternative collective rendering of the Greek articular participle rather than introducing an unsupported temporal relation.
