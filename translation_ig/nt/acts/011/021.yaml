  text: καὶ ἦν χεὶρ κυρίου μετ’ αὐτῶν, πολύς τε ἀριθμὸς ⸀ὁ πιστεύσας ἐπέστρεψεν ἐπὶ τὸν κύριον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/021.yaml
  text: And the hand of the Lord was with them[b][a], and a great number who believed turned to the Lord.
translation:
  language: ig
  text: 'Aka Onyenwe anyị dịnyere ha[a], ọtụtụ ndị kweere[b] chigharịkwuru Onyenwe anyị.


    [a] A pụkwara ịsụ ya, “Aka nke Onyenwe anyị.” Okwu a bụ akpaalaokwu Akwụkwọ Nsọ nke na-egosi ike Onyenwe anyị na-arụ ọrụ ma ọ bụ nkwado ya.


    [b] A pụkwara ịsụ ya, “ndị kwere ekwe.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “Aka nke Onyenwe anyị.” Okwu a bụ akpaalaokwu Akwụkwọ Nsọ nke na-egosi ike Onyenwe anyị na-arụ ọrụ ma ọ bụ nkwado ya.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụ ya, “ndị kwere ekwe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: χεὶρ κυρίου
  choice: Aka Onyenwe anyị
  rationale: E debere ihe atụ ahụ dị ka ọ dị n’asụsụ Grik n’ihi na ọ bụ akpaalaokwu Akwụkwọ Nsọ na-egosi ike Onyenwe anyị na-arụ ọrụ ma ọ bụ nkwado ya. Ihe odide ala ala peeji na-akọwa ya n’enweghị iwepụ njikọ ya na akụkụ Akwụkwọ Nsọ ndị ọzọ.
- source_word: κύριος
  choice: Onyenwe anyị
  rationale: Nke a bụ aha nsọpụrụ Igbo a na-ejikarị asụgharị κύριος. Ọ naghị eme ka okwu ahụ bụrụ naanị “nna ukwu,” ma ọ bụ tinye “Jizọs” ebe ihe odide Grik kwuru naanị “Onyenwe anyị.”
- source_word: μετ’ αὐτῶν
  choice: dịnyere ha
  rationale: Nke a na-egosi na Onyenwe anyị nọnyere ha ma na-akwado ọrụ ha; ọ bụ ụzọ Igbo dị ụtọ isi kwuo “was with them.”
- source_word: πολύς τε ἀριθμός
  choice: ọnụ ọgụgụ buru ibu
  rationale: Nhọrọ a na-echekwa usoro aha dị n’asụsụ Grik ma ka bụrụ okwu Igbo doro anya maka ìgwè mmadụ buru ibu.
- source_word: ὁ πιστεύσας
  choice: ndị kweere
  rationale: Participụl aorist ahụ na-akọwa ndị ahụ n’ìgwè. “Ndị kweere” bụ ụzọ Igbo dị mfe ma doo anya; ihe odide ala ala peeji na-echekwa ohere ịghọta ya dị ka “mgbe ha kweere.”
- source_word: ἐπέστρεψεν ἐπὶ τὸν κύριον
  choice: wee chigharịkwuru Onyenwe anyị
  rationale: “Chigharịkwuru” na-egosi ịtụgharị ndụ na ntụziaka mmadụ gaa n’ebe Onyenwe anyị nọ, n’etinyeghị okwu “nchegharị” nke na-adịghị n’ahịrị Grik kpọmkwem. “Wee” na-eme ka ahịrịokwu Igbo na-aga nke ọma.
theological_decisions:
- issue: Onye okwu “Onyenwe anyị” na-ezo aka na ya n’ebe a
  choice: E debere “Onyenwe anyị” n’ebe abụọ ahụ n’akọwaghị ya ọzọ.
  alternative: Ịsụgharị ya kpọmkwem dị ka “Jizọs,” ma ọ bụ kọwaa ya dị ka Chineke n’ozuzu.
  rationale: N’Ọrụ Ndịozi, κύριος nwere ike izo aka na Jizọs, karịchaa n’okwu gbasara ntọghata, ma ihe odide Grik kwuru naanị “Onyenwe anyị.” Ya mere, nsụgharị ahụ na-echekwa obosara na esemokwu nkà mmụta okpukpe dị n’ihe odide ahụ.
- issue: Mmekọrịta dị n’etiti ikwere na ichigharịkwuru Onyenwe anyị
  choice: E ji “ndị kweere” kọwaa ìgwè ahụ, ebe e tinyere nhọrọ “mgbe ha kweere” n’ihe odide ala ala peeji.
  alternative: Ịsụgharị ya n’ụzọ ga-eme ka ikwere bụrụ kpọmkwem ihe mere tupu ichigharị, ma ọ bụ ka ha bụrụ otu ihe kpamkpam.
  rationale: Participụl aorist ὁ πιστεύσας nwere ike ịkọwa ndị ahụ ma ọ bụ nwee nghọta metụtara oge. E kwesịghị imechi ohere a site n’ịkọwa usoro nzọpụta karịa ihe Grik kwuru.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. E debere akpaalaokwu “Aka Onyenwe anyị” iji chekwaa ihe atụ na njikọ Akwụkwọ Nsọ; a kọwara ya n’ihe odide ala ala peeji. “Ọnụ ọgụgụ buru ibu” dị ntakịrị elu n’ogo asụsụ karịa “ọtụtụ,” ma ọ ka doro anya ma na-esochi usoro isi mmalite ahụ.
