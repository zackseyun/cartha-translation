revisions:
- from: Ihe a mere ugboro atọ, e mesịakwa dọpụta ihe niile elu banye n'eluigwe.
  to: Ihe a mere ugboro atọ, a dọpụtakwara ihe niile elu ọzọ banye n'eluigwe.
  rationale: 'The revision replaces the temporal ‘e mesịa’ with ‘ọzọ’ to preserve πάλιν, and uses a natural Igbo impersonal passive for ἀνεσπάσθη. ‘Ihe niile’ deliberately retains the Greek’s broad, non-specific referent. No footnote is necessary: the translation itself preserves the relevant ambiguity, and no footnote anchor is present or required.'
  reviewer_model: gpt-5.6-terra
