id: ACT.11.10
reference: Acts 11:10
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τοῦτο δὲ ἐγένετο ἐπὶ τρίς, καὶ ⸂ἀνεσπάσθη πάλιν⸃ ἅπαντα εἰς τὸν οὐρανόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/010.yaml
  text: This happened three times[a], and everything was drawn up again into heaven.
translation:
  language: ig
  text: Ihe a mere ugboro atọ, a dọpụtakwara ihe niile elu ọzọ banye n'eluigwe.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῦτο
  choice: Ihe a
  rationale: Ọ na-ezo aka n'ihe ahụ e kwuru na ọ mere n'ọhụụ ahụ, n'etinyeghị okwu “ọhụụ” nke adịghị kpọmkwem na Grik.
- source_word: δὲ
  choice: -kwa
  rationale: N'ebe a, δέ bụ njikọ dị nro n'akụkọ; mgbakwunye “-kwa” na nkebi nke abụọ na-eme ka njikọ ahụ daa nke ọma n'Igbo.
- source_word: ἐγένετο
  choice: mere
  rationale: Ọ na-egosi na otu ihe mere; “mere” bụ okwu Igbo doro anya ma kwekọọ n'ụdị akụkọ.
- source_word: ἐπὶ τρίς
  choice: ugboro atọ
  rationale: Nke a bụ ụzọ Igbo nkịtị si egosi na ihe ahụ mere ugboro atọ.
- source_word: ἀνεσπάσθη
  choice: e dọpụta ... elu
  rationale: Ọ na-echekwa olu nnara na echiche nke ike si n'èzí dọpụta ihe ahụ gbagoo, n'ekwughị onye mere ya.
- source_word: πάλιν
  choice: e mesịa
  rationale: N'usoro akụkọ a, ọ na-egosi na mgbe ihe ahụ mere ugboro atọ gasịrị, e weghachiri ihe niile elu; “e mesịa” na-enye echiche ahụ n'Igbo n'enweghị nkwughachi na-adịghị eke.
- source_word: ἅπαντα
  choice: ihe niile
  rationale: Ọ na-echekwa nkọwa sara mbara nke Grik, n'akọwaghị ya kpọmkwem dịka akwa ahụ ma ọ bụ anụmanụ ndị ahụ.
- source_word: εἰς τὸν οὐρανόν
  choice: banye n'eluigwe
  rationale: “Banye” na-echekwa ntụziaka nke εἰς, ebe “eluigwe” dabara n'ọnọdụ ọhụụ a karịa naanị mbara igwe a na-ahụ anya.
theological_decisions:
- issue: Ihe ἅπαντα na-ezo aka na ya n'akụkọ ọhụụ Pita
  choice: ihe niile
  alternative: ihe ahụ dum; anụmanụ niile
  rationale: Grik ahụ na-ekwu n'ụzọ sara mbara ma ọ kọwaghị kpọmkwem ma ọ bụ akwa ahụ, ihe dị n'ime ya, ma ọ bụ ọhụụ ahụ dum. Nsụgharị sara mbara na-echekwa enweghị nkọwa ahụ.
translation_notes:
  register: Standard Igbo nke oge a, dị mfe nghọta ma nwee ugwu. E chekwara olu nnara na enweghị aha onye dọpụtara ihe ahụ.
