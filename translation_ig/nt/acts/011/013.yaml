revisions:
- from: Ọ kọọrọ anyị otú ọ hụrụ mmụọ ozi ahụ ka o guzo n’ụlọ ya, na-ekwu, “Ziga ozi gaa Jọpa ka a kpọta Saịmọn onye a na-akpọ Pita.[a]”
  to: Ọ kọọrọ anyị otú ọ hụrụ mmụọ ozi ahụ ka mmụọ ozi ahụ guzo n’ụlọ ya, sị, “Ziga ndị mmadụ na Jọpa ka ha kpọta Saịmọn, onye a na-akpọ Pita.[a]”
  rationale: The revision explicitly identifies the standing speaker as the angel, uses a natural Igbo construction for the direct speech, and clarifies that the command involves sending people to Joppa. The footnote preserves the lexical alternative for μεταπέμψαι (‘send for/call for’) without adding doctrinal interpretation.
