    text: Ma ọ bụ, “kpọọ Saịmọn ...”
    reason: lexical_alternative
  revision_rationale: The revision explicitly identifies the standing speaker as the angel, uses a natural Igbo construction for the direct speech, and clarifies that the command involves sending people to Joppa. The footnote preserves the lexical alternative for μεταπέμψαι (‘send for/call for’) without adding doctrinal interpretation.
