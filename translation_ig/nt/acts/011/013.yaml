source:
  edition: SBLGNT
  text: ἀπήγγειλεν ⸀δὲ ἡμῖν πῶς εἶδεν τὸν ἄγγελον ἐν τῷ οἴκῳ αὐτοῦ σταθέντα καὶ ⸀εἰπόντα· Ἀπόστειλον εἰς ⸀Ἰόππην καὶ μετάπεμψαι Σίμωνα τὸν ἐπικαλούμενον Πέτρον,
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/013.yaml
  text: And he reported to us how he had seen the angel standing in his house and saying[a], ‘Send to Joppa and summon Simon, who is called Peter.’
translation:
  language: ig
  text: Ọ kọọrọ anyị otú ọ hụrụ mmụọ ozi ahụ ka mmụọ ozi ahụ guzo n’ụlọ ya, sị, “Ziga ndị mmadụ na Jọpa ka ha kpọta Saịmọn, onye a na-akpọ Pita.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “kpọọ Saịmọn ...”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπήγγειλεν
  choice: Ọ kọọrọ anyị
  rationale: Ngwaa a na-egosi na ọ kọọrọ ha ihe mere ma nye ha akụkọ ya; ‘kọọrọ’ bụ okwu Igbo doro anya ma kwekọọ n’ụdị akụkọ a.
- source_word: δὲ
  choice: (egosighị ya iche)
  rationale: δέ bụ njikọ dị nro na-aga n’ihu n’akụkọ. N’Igbo, ịmalite ozugbo na ‘Ọ kọọrọ’ na-eme ka okwu ahụ bụrụ nke ekeghị ekè na nke na-aga were were, n’enweghị itinye ọdịiche na-adịghị n’isiokwu ahụ.
- source_word: πῶς εἶδεν
  choice: otú ọ hụrụ
  rationale: ‘Otú’ na-echekwa πῶς kama ime ka ọ bụrụ naanị ‘na’; ‘ọ hụrụ’ na-egosi ihe o buru ụzọ hụ tupu ọ kọọrọ ha ya, nke usoro akụkọ ahụ mere ka doo anya.
- source_word: τὸν ἄγγελον
  choice: mmụọ ozi ahụ
  rationale: Mkpụrụokwu njirimara Grik na-ekwu maka mmụọ ozi a kapịrị ọnụ, onye akụkọ gara aga metụtara; ‘ahụ’ na-egosi njirimara ahụ n’Igbo.
- source_word: ἐν τῷ οἴκῳ αὐτοῦ
  choice: n’ụlọ ya
  rationale: Nke a bụ ntụgharị kwụ ọtọ ma bụrụkwa Igbo nkịtị maka ebe obibi ya.
- source_word: σταθέντα καὶ εἰπόντα
  choice: ka o guzo ... na-ekwu
  rationale: Nke a na-echekwa onyinyo mmụọ ozi ahụ ka o guzo ma na-ekwu okwu, ma na-eme ka usoro participle Grik daa nke ọma n’Igbo.
- source_word: Ἀπόστειλον εἰς Ἰόππην
  choice: Ziga ozi gaa Jọpa
  rationale: Ngwaa ahụ bụ iwu nke onye nke abụọ, ihe a ga-eziga akọwaghịkwa ya kpọmkwem. ‘Ziga ozi’ anaghị etinye ‘ndị ikom’ nke na-anọghị n’amaokwu a ma na-enye iwu ahụ n’Igbo eke.
- source_word: μετάπεμψαι
  choice: ka a kpọta
  rationale: μεταπέμπομαι pụtara iziga ka a kpọọ mmadụ ka ọ bịa. ‘Ka a kpọta’ na-egosi nzube ahụ n’Igbo n’enweghị ụda iwu siri ike nke ‘kpọọ ya oku’ nwere ike iweta.
- source_word: Σίμωνα τὸν ἐπικαλούμενον Πέτρον
  choice: Saịmọn onye a na-akpọ Pita
  rationale: Nke a na-echekwa ọrụ participle ahụ nke na-akọwa Saịmọn site n’aha ọzọ ndị mmadụ na-akpọ ya.
theological_decisions: []
translation_notes:
  register: Asụsụ Standard Igbo nke ugbu a, dị ùgwù ma dị mfe nghọta. E ji ‘mmụọ ozi’ mee ihe dịka okwu Baịbụl a maara nke ọma; e dekwara aha ebe na aha mmadụ dịka Jọpa, Saịmọn, na Pita. Akara ntụaka [a] dị n’isiokwu amaokwu ahụ.
