review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the report, the angel’s presence in Cornelius’s house, and the command to obtain Simon Peter. However, “ka o guzo” can momentarily leave the antecedent of “o” unclear, and “Ziga ozi” shifts the implicit persons being dispatched toward a message. A small revision makes the angel explicit and renders the imperative naturally in Igbo while retaining its sense.
  naturalness: The proposed wording is idiomatic Standard Igbo narrative prose. Using “mmụọ ozi ahụ guzo ... sị” avoids an ambiguous pronoun and gives the quoted speech a more natural biblical narrative flow. “Ziga ndị mmadụ na Jọpa ka ha kpọta ...” is clear Igbo for sending people to fetch someone.
  terminology: “Mmụọ ozi,” “Jọpa,” “Saịmọn,” and “Pita” are appropriate Standard Igbo biblical terms and names. The alternative in the footnote is revised to address “kpọta” directly and is placed at the word it qualifies.
  issues:
  - severity: medium
    issue: Possible ambiguity in “ka o guzo”
    rationale: Although it can refer to “mmụọ ozi ahụ,” the pronoun may briefly be read as referring to Cornelius, the subject of “ọ hụrụ.” Repeating the noun safely preserves the Greek participle’s referent.
  - severity: medium
    issue: “Ziga ozi” may mean ‘send a message’ rather than dispatch people
    rationale: ἀπόστειλον has an implicit object, which in the immediate narrative is the people being sent. In Igbo, “ozi” commonly denotes a message/news, so “ndị mmadụ” communicates the command’s intended action more clearly.
  - severity: low
    issue: Footnote wording and anchor do not clearly correspond to the lexical alternative
    rationale: The existing note gives a broad rephrasing and is anchored after “Pita,” rather than directly identifying the alternative for “kpọta.” A concise alternative at “kpọta” is clearer.
  revised_text: Ọ kọọrọ anyị otú ọ hụrụ mmụọ ozi ahụ ka mmụọ ozi ahụ guzo n’ụlọ ya, sị, “Ziga ndị mmadụ na Jọpa ka ha kpọta Saịmọn, onye a na-akpọ Pita.[a]”
  revised_footnotes:
