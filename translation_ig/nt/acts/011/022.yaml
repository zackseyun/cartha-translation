id: ACT.11.22
reference: Acts 11:22
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἠκούσθη δὲ ὁ λόγος εἰς τὰ ὦτα τῆς ἐκκλησίας τῆς ⸀οὔσης ἐν ⸀Ἰερουσαλὴμ περὶ αὐτῶν, καὶ ἐξαπέστειλαν ⸀Βαρναβᾶν ἕως Ἀντιοχείας·
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/022.yaml
  text: The report about them reached the ears of the church in Jerusalem[a], and they sent out Barnabas as far as Antioch.
translation:
  language: ig
  text: Akụkọ banyere ha ruru n’ntị ọgbakọ dị na Jerusalem[a], ha wee ziga Banabas ruo Antiọk.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “A nụrụ akụkọ banyere ha n’ọgbakọ dị na Jerusalem”; n’ụzọ nkịtị, “A nụrụ akụkọ ahụ banye n’ntị ọgbakọ dị na Jerusalem.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠκούσθη
  choice: ruru ntị
  rationale: N’usoro okwu a, ngwaa ahụ pụtara na a nụrụ akụkọ ahụ ma ọ bụ na ọ bịara ná ntị ha. “Ruru ntị” bụ ụzọ Igbo doro anya nke na-echekwa ihe oyiyi dị n’asụsụ Grik.
- source_word: ὁ λόγος
  choice: Akụkọ
  rationale: N’ebe a, λόγος bụ akụkọ ma ọ bụ ozi gbasara ndị a kpọtụrụ aha n’amaokwu ndị bu ụzọ, ọ bụghị naanị “okwu” e kwuru.
- source_word: εἰς τὰ ὦτα
  choice: ruru ntị
  rationale: Nke a bụ akpaalaokwu na-egosi na ozi bịara ná ntị mmadụ. Nsụgharị a bụ Igbo ebumpụta ụwa ma na-echekwa ihe oyiyi nke ntị.
- source_word: ἐκκλησίας
  choice: ọgbakọ
  rationale: Ọ na-ezo aka n’ọgbakọ ndị kwere ekwe, ọ bụghị ụlọ nzukọ. “Ọgbakọ” na-ezere ime ka okwu ahụ bụrụ naanị ụlọ ma ọ bụ òtù ụka pụrụ iche.
- source_word: τῆς οὔσης ἐν Ἰερουσαλήμ
  choice: dị na Jerusalem
  rationale: Nkebi a na-akọwa ọgbakọ a na-ekwu maka ya; “dị na Jerusalem” bụ Igbo dị mkpirikpi ma zuru ezu.
- source_word: περὶ αὐτῶν
  choice: banyere ha
  rationale: Aha nnọchiaha ahụ na-ezo n’ụzọ kacha kwe omume nye ndị a kpọtụrụ aha na mbụ, ma nsụgharị ahụ anaghị akọwa ya karịa ihe odide Grik kwuru.
- source_word: ἐξαπέστειλαν
  choice: ha wee ziga
  rationale: “Ziga” na-enye echiche izipụ mmadụ ka ọ gaa rụọ ọrụ, ebe “wee” na-ejikọta ihe omume abụọ ahụ n’usoro akụkọ n’ụzọ Igbo ebumpụta ụwa.
- source_word: Βαρναβᾶν
  choice: Banabas
  rationale: E dere aha onye ahụ n’ụdị a na-ahụkarị n’Igbo.
- source_word: ἕως Ἀντιοχείας
  choice: ruo Antiọk
  rationale: “Ruo” na-echekwa echiche nke ἕως, nke nwere ike igosi ebe njem ahụ kwụsịrị ma ọ bụ ebe e zigara ya, n’enweghị imechi mgbagwoju anya ahụ.
theological_decisions:
- issue: Onye “ha” na-ezo aka na ya n’okwu “ha wee ziga”
  choice: Ọgbakọ dị na Jerusalem n’ozuzu ya
  alternative: Ndị ndu a na-akọwaghị aha ha n’ime ọgbakọ ahụ
  rationale: Aha kacha nso “ha” nwere ike ịlaghachikwuru bụ ọgbakọ dị na Jerusalem. Ihe odide ahụ ekwughị kpọmkwem na ọ bụ ndịozi, ndị okenye, ma ọ bụ ndị ndu ọzọ, ya mere a hapụrụ isiokwu ahụ ka ọ bụrụ “ha.”
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị mfe ma dị ùgwù dee ya. “Ọgbakọ” na-egosi ndị kwere ekwe dịka otu ndị mmadụ, ebe “ruru ntị” bụ akpaalaokwu Igbo doro anya nke na-echekwa ihe oyiyi dị na Grik.
