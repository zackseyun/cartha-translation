translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị ùgwù ma dị mfe nghọta. E debere usoro ndepụta nke Grik na ọdịiche dị n’etiti ilegide anya, ịnọgide na-enyocha, na ịhụ.
