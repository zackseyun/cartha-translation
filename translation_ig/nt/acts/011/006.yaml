id: ACT.11.6
reference: Acts 11:6
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἰς ἣν ἀτενίσας κατενόουν καὶ εἶδον τὰ τετράποδα τῆς γῆς καὶ τὰ θηρία καὶ τὰ ἑρπετὰ καὶ τὰ πετεινὰ τοῦ οὐρανοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/006.yaml
  text: As I looked intently into it[a], I was considering it, and I saw the four-footed animals of the earth, the wild beasts, the reptiles, and the birds of the sky.
translation:
  language: ig
  text: M legidere anya n’ime ya, m na-enyocha ya nke ọma, wee hụ anụmanụ ndị nwere ụkwụ anọ nke ụwa, anụ ọhịa, anụ ndị na-akpụ akpụ[a], na nnụnụ ndị na-efe n’eluigwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ihe ndị na-akpụ akpụ.”
    reason: Nhọrọ a na-edobe okwu ahụ dịka ụdị ihe e kere eke sara mbara, ọ bụghị naanị otu ìgwè anụ a na-akpọ reptiles.
lexical_decisions:
- source_word: εἰς ἣν
  choice: n’ime ya
  rationale: Nkebi a na-arụtụ aka n’ihe yiri akwa ahụ Pita hụrụ; ‘n’ime ya’ na-egosi ebe anya ya lekwasịrị anya.
- source_word: ἀτενίσας
  choice: M legidere anya
  rationale: Nke a na-egosi ile ihe anya nke ọma na nlebara anya siri ike.
- source_word: κατενόουν
  choice: anọgidekwara m na-enyocha ya nke ọma
  rationale: Ụdị imperfect na-egosi omume gara n’ihu; nsụgharị a na-edobe ọdịiche ya na εἶδον, bụ́ ịhụ nke sochiri ya.
- source_word: εἶδον
  choice: wee hụ
  rationale: Okwu a na-egosi ịhụ ihe ahụ n’ụzọ doro anya ma na-aga n’ihu n’usoro akụkọ ahụ.
- source_word: τὰ τετράποδα τῆς γῆς
  choice: anụmanụ ụwa ndị nwere ụkwụ anọ
  rationale: Ọ na-edobe ma echiche nke anụmanụ nwere ụkwụ anọ ma njikọ ha na ụwa, dịka nkewa dị n’isi mmalite.
- source_word: τὰ θηρία
  choice: anụ ọhịa
  rationale: Nke a bụ okwu Igbo nkịtị ma doo anya maka anụ ndị na-abụghị anụ ụlọ, ma na-edobe ha dịka otu dị iche.
- source_word: τὰ ἑρπετὰ
  choice: anụ ndị na-akpụ akpụ[a]
  rationale: Okwu a sara mbara karịa naanị anụ ndị a na-akpọ reptiles, ma kwekọọ na nkewa gbasara ihe e kere eke na iwu ịdị ọcha.
- source_word: τὰ πετεινὰ τοῦ οὐρανοῦ
  choice: nnụnụ ndị na-efe n’eluigwe
  rationale: Nke a bụ ụzọ Igbo doro anya isi kọwaa nnụnụ/flying creatures nke mbara elu, na-enweghị ime ka ‘eluigwe’ pụta naanị dịka ebe obibi Chineke.
