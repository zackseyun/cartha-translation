  to: M legidere anya n’ime ya, m na-enyocha ya nke ọma, wee hụ anụmanụ ndị nwere ụkwụ anọ nke ụwa, anụ ọhịa, anụ ndị na-akpụ akpụ[a], na nnụnụ ndị na-efe n’eluigwe.
