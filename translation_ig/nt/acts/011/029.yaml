id: ACT.11.29
reference: Acts 11:29
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τῶν δὲ μαθητῶν καθὼς εὐπορεῖτό τις ὥρισαν ἕκαστος αὐτῶν εἰς διακονίαν πέμψαι τοῖς κατοικοῦσιν ἐν τῇ Ἰουδαίᾳ ἀδελφοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/029.yaml
  text: So the disciples determined[a], each according to his ability[b], to send relief to the brothers living in Judea.
translation:
  language: ig
  text: N’ihi ya, ndị na-eso ụzọ ahụ kpebiri na onye ọ bụla n’ime ha ga-eziga ihe enyemaka nye ụmụnna[b] bi na Judia, dịka ike onye ọ bụla nwere siri dị[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “dịka onye ọ bụla si nwee ọganihu,” ma ọ bụ, “dịka ihe onye ọ bụla nwere ike inye.”
    reason: lexical_alternative
  - marker: b
    text: “Ụmụnna” n’ebe a nwere ike ịbụ ndị kwere ekwe ibe ha bi na Judia.
    reason: lexical_alternative
lexical_decisions:
- source_word: μαθητῶν
  choice: ndị na-eso ụzọ
  rationale: Nke a bụ okwu Igbo a na-ejikarị akọwa ndị na-amụta ihe n’aka Jizọs ma na-eso ya; ọ dabara n’otú okwu ahụ si arụ ọrụ n’Ọrụ Ndịozi.
- source_word: καθὼς εὐπορεῖτό τις
  choice: dịka ihe o nwere siri dị
  rationale: Akpaokwu a na-egosi na onyinye onye ọ bụla dabere n’ihe o nwere ma ọ bụ n’ike akụnụba ya, ọ bụghị nanị ikike nkịtị.
- source_word: ὥρισαν
  choice: kpebiri
  rationale: Ọ na-egosi mkpebi e mere n’ụzọ doro anya; ‘kpebiri’ bụ okwu Igbo dị mfe ma kwekọọ na ὁρίζω n’ebe a.
- source_word: ἕκαστος αὐτῶν
  choice: onye ọ bụla n’ime ha
  rationale: 'Nke a na-echekwa echiche nkesa ahụ: onye nke ọ bụla n’etiti ndị na-eso ụzọ ga-eme ihe dịka ihe o nwere siri dị.'
- source_word: εἰς διακονίαν
  choice: ihe enyemaka
  rationale: N’ọnọdụ a, διακονία bụ ọrụ enyemaka a na-enye ndị kwere ekwe nọ ná mkpa. ‘Ihe enyemaka’ na-eme ka ihe e zigara doo anya n’Igbo n’enweghị ịkọwa ụdị ya karịa ihe odide ahụ.
- source_word: πέμψαι
  choice: ga-ezigara
  rationale: Infinitive ahụ na-adabere ná mkpebi ha; nhazi ‘kpebiri na ... ga-ezigara’ bụ Igbo nkịtị nke na-echekwa nzube iziga ihe ahụ.
- source_word: τοῖς κατοικοῦσιν ἐν τῇ Ἰουδαίᾳ
  choice: bi na Judia
  rationale: Nke a bụ ntụgharị kpọmkwem ma dịkwa mfe nghọta nke nkebi na-akọwa ndị bi na Judia.
- source_word: ἀδελφοῖς
  choice: ụmụnna
  rationale: ‘Ụmụnna’ na-echekwa okwu ezinụlọ nke Grik ma nwee ike, dịka ojiji ya n’Igbo, ịgụnye ọgbakọ ndị kwere ekwe n’ozuzu ya.
theological_decisions:
- issue: Ma ἀδελφοῖς ọ na-ezo aka naanị n’ụmụ nwoke ka ọ bụ n’ọgbakọ ndị kwere ekwe niile na Judia
  choice: ụmụnna
  alternative: ndị kwere ekwe ibe ha / ụmụnna nwoke na ụmụnna nwanyị
  rationale: Grik ji aha ezinụlọ n'ụdị nwoke ọtụtụ, ma n’ojiji Ndị Kraịst oge mbụ ọ pụrụ ịgụnye ụmụ nwoke na ụmụ nwanyị. ‘Ụmụnna’ na-echekwa ihe oyiyi ezinụlọ ahụ ma ghara ikpebi n’isiokwu bụ́ onye kpọmkwem ọ gụnyere; nkọwa ala peeji na-akọwa obosara o nwere ike inwe.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ugwu ma dị mfe nghọta. Nhazi ahịrịokwu ahụ bụ nke Igbo nkịtị, ebe ‘onye ọ bụla n’ime ha’ na-echekwa nkesa nke Grik, ‘dịka ihe o nwere siri dị’ na-egosikwa na enyemaka ahụ dabere n’akụnụba onye ọ bụla.
