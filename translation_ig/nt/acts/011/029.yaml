    text: A pụkwara ịsụ ya, “dịka onye ọ bụla si nwee ọganihu,” ma ọ bụ, “dịka ihe onye ọ bụla nwere ike inye.”
    reason: lexical_alternative
  - marker: b
    text: “Ụmụnna” n’ebe a nwere ike ịbụ ndị kwere ekwe ibe ha bi na Judia.
    reason: lexical_alternative
  revision_rationale: The revision preserves the Greek distributive sense and the practical-aid context while using smoother Standard Igbo. It also narrows the explanatory note to what the term and context support, retaining ambiguity concerning the precise membership of “the brothers.”
