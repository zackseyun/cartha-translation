id: ACT.11.11
reference: Acts 11:11
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ ἐξαυτῆς τρεῖς ἄνδρες ἐπέστησαν ἐπὶ τὴν οἰκίαν ἐν ᾗ ⸀ἦμεν, ἀπεσταλμένοι ἀπὸ Καισαρείας πρός με.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/011.yaml
  text: And behold[a], immediately three men arrived at the house where we were, having been sent to me from Caesarea.
translation:
  language: ig
  text: Ma lee, ozugbo ahụ[a], ndị ikom atọ bịarutere n’ụlọ ahụ anyị nọ na ya; e si Sesaria zite ha ka ha bịakwute m.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “n’otu oge ahụ kpọmkwem” ma ọ bụ “n’egbughị oge.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: lee
  rationale: “Lee” na-arụ ọrụ dị ka akara okwu na-adọta uche onye na-agụ n’ihe dị mkpa mere na mberede, ma ọ ka bụ okwu Igbo doro anya ma dị ùgwù.
- source_word: ἐξαυτῆς
  choice: ozugbo ahụ
  rationale: Nhọrọ a na-egosipụta na ihe ahụ mere n’egbughị oge ma jikọta ya nke ọma na ọhụụ ahụ e kwuru okwu ya tupu amaokwu a.
- source_word: τρεῖς ἄνδρες
  choice: ndị ikom atọ
  rationale: Nke a na-asụgharị ma ọnụọgụ ahụ ma nwoke ndị a bụ n’ụzọ ziri ezi ma doo anya.
- source_word: ἐπέστησαν ἐπὶ τὴν οἰκίαν
  choice: bịarutere n’ụlọ ahụ
  rationale: N’ọnọdụ akụkọ a, ngwaa ahụ na-egosi ọbịbịa ha n’ebe ụlọ ahụ dị; “bịarutere” bụ Igbo e ji eme ihe ugbu a ma na-ezere nsụgharị nkịtị na-adịghị eke.
- source_word: ἐν ᾗ ἦμεν
  choice: anyị nọ na ya
  rationale: Nke a na-edebe nnọchiaha ọtụtụ “anyị” na nkọwa ebe ahụ n’etinyeghị echiche ọzọ dịka na ha biri ma ọ bụ nọrọ ogologo oge n’ụlọ ahụ.
- source_word: ἀπεσταλμένοι
  choice: e si ... zite ha
  rationale: Usoro a na-egosipụta olu nnabata nke participle ahụ nakwa na iziga ha mere tupu ha abịarute.
- source_word: ἀπὸ Καισαρείας
  choice: e si Sesaria
  rationale: “Si” na-egosi ebe ha siri bịa, ebe “Sesaria” bụ ntụgharị aha obodo Καισάρεια a na-aghọta n’Igbo.
- source_word: πρός με
  choice: ka ha bịakwute m
  rationale: Nke a na-egosipụta na Pita bụ onye e zigara ndị ikom ahụ ka ha gakwuru, n’Igbo dị mfe ma kwekọọ n’ụzọ okwu ahụ si arụ ọrụ n’ebe a.
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “Ma lee” na-edebe ịdị ndụ nke akụkọ ahụ, ebe nkebiokwu nke fọdụrụ na-aga n’usoro Igbo eke.
