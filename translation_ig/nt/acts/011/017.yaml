id: ACT.11.17
reference: Acts 11:17
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἰ οὖν τὴν ἴσην δωρεὰν ἔδωκεν αὐτοῖς ὁ θεὸς ὡς καὶ ἡμῖν πιστεύσασιν ἐπὶ τὸν κύριον Ἰησοῦν Χριστόν, ⸀ἐγὼ τίς ἤμην δυνατὸς κωλῦσαι τὸν θεόν;
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/017.yaml
  text: If then God gave to them the same gift as also to us who believed in the Lord Jesus the Messiah[b][a], who was I that I could hinder God?
translation:
  language: ig
  text: Ya mere, ọ bụrụ na Chineke nyere ha otu onyinye ahụ o nyekwara anyị, bụ́ ndị kwere n’Onyenwe Jizọs, bụ́ Mesaịa ahụ,[a][b] ònye ka m bụ ka m nwee ike igbochi Chineke?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ, “Kraịst”: okwu Grik bụ Χριστόν. A sụgharịrị ya ebe a “Mesaịa ahụ” n’ihi na ọ ka na-arụ ọrụ dị ka utu aha.'
    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ, “anyị mgbe anyị kwere n’Onyenwe Jizọs, bụ́ Mesaịa ahụ.” Okwu Grik ahụ nwere ike ịkọwa “anyị” dịka ndị kwere ekwe ma ọ bụ igosi oge ha kwere.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἴσην δωρεάν
  choice: otu onyinye ahụ
  rationale: Nke a na-egosi na onyinye e nyere ha na nke e nyere anyị hà nhata ma bụrụ otu n’ụdị; ọ bụkwa okwu Igbo dị mfe ma kwekọọ n’ntụnyere Pita.
- source_word: πιστεύσασιν ἐπὶ τὸν κύριον Ἰησοῦν Χριστόν
  choice: bụ́ ndị kwere n’Onyenwe anyị Jizọs, bụ́ Mesaịa ahụ
  rationale: πιστεύσασιν kwekọrọ na ἡμῖν ma na-akọwa ‘anyị’ dị ka ndị kwere. ‘Kwere n’…’ na-egosi onye okwukwe ahụ dabeere na ya, ebe Χριστόν ka e debere dị ka utu aha ‘Mesaịa.’
- source_word: κύριον
  choice: Onyenwe anyị
  rationale: N’ebe a κύριος bụ utu aha e ji akpọ Jizọs; ‘Onyenwe anyị’ bụ ntụgharị Igbo a na-aghọta nke ọma ma na-egosi mmekọrịta dị na ‘anyị.’
- source_word: Χριστόν
  choice: Mesaịa ahụ
  rationale: Χριστός ka nwere ike utu aha n’ebe a, ya mere ‘Mesaịa ahụ’ na-echekwa ihe ọ pụtara kama ime ya ka ọ bụrụ naanị akụkụ aha mmadụ.
- source_word: ἐγὼ τίς ἤμην δυνατὸς
  choice: ònye ka m bụ nke na m gaara
  rationale: 'Nke a na-ebupụta ajụjụ nkwulu onwe Pita: ọ bụghị onye nwere ikike iguzogide ihe Chineke mere.'
- source_word: κωλῦσαι τὸν θεόν
  choice: egbochi Chineke
  rationale: Nke a na-echekwa okwu siri ike nke Grik ahụ, nke na-ekwu na iguzogide nnabata ndị mba ọzọ ga-abụ igbochi Chineke n’onwe ya.
theological_decisions:
- issue: Utu aha Χριστόν n’okwu κύριον Ἰησοῦν Χριστόν
  choice: Mesaịa ahụ
  alternative: Kraịst
  rationale: ‘Mesaịa ahụ’ na-echekwa ike utu aha Χριστός n’ọnọdụ a, ma ọ naghị eme ka ọ bụrụ aha ezinụlọ ma ọ bụ tinye ozizi otu ụka.
- issue: Mmekọrịta πιστεύσασιν na ἡμῖν
  choice: anyị, bụ́ ndị kwere
  alternative: anyị mgbe anyị kwere
  rationale: Ntụgharị nkọwa a na-eso njikọ ụtọasụsụ nke participle ahụ na ἡμῖν nke ọma. A na-edebe ntụgharị oge dị ka nhọrọ ọzọ n’ala peeji, ka a ghara idozi nghọtahie dị n’ụdị Grik ahụ n’ụzọ siri ike.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. ‘Ya mere, ọ bụrụ na…’ na-echekwa njikọ nkwubi okwu εἰ οὖν; ajụjụ ikpeazụ ka bụ ajụjụ nkwulu onwe nwere ike siri ike.
