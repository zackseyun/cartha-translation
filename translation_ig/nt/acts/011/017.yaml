    text: 'Ma ọ bụ, “Kraịst”: okwu Grik bụ Χριστόν. A sụgharịrị ya ebe a “Mesaịa ahụ” n’ihi na ọ ka na-arụ ọrụ dị ka utu aha.'
    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ, “anyị mgbe anyị kwere n’Onyenwe Jizọs, bụ́ Mesaịa ahụ.” Okwu Grik ahụ nwere ike ịkọwa “anyị” dịka ndị kwere ekwe ma ọ bụ igosi oge ha kwere.
    reason: lexical_alternative
