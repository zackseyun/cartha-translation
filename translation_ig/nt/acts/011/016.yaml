id: ACT.11.16
reference: Acts 11:16
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐμνήσθην δὲ τοῦ ῥήματος ⸀τοῦ κυρίου ὡς ἔλεγεν· Ἰωάννης μὲν ἐβάπτισεν ὕδατι, ὑμεῖς δὲ βαπτισθήσεσθε ἐν πνεύματι ἁγίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/016.yaml
  text: Then I remembered the word of the Lord[a], how he said, ‘John baptized with water, but you will be baptized in the Holy Spirit.’
translation:
  language: ig
  text: Mgbe ahụ, echetara m okwu Onyenwe anyị, otu o si kwuo, ‘Jọn ji mmiri mee baptizim, ma a ga-eji Mmụọ Nsọ mee unu baptizim[a].’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “a ga-eme unu baptizim n’ime Mmụọ Nsọ.” Okwu Grik a nwere ike ịpụta “n’ime” ma ọ bụ “jiri.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἐμνήσθην
  choice: echetara m
  rationale: Ụdị a na-egosi n’Igbo nkịtị na Pita chetara okwu ahụ; ọ na-ebute ọrụ nke ụdị Grik a n'ụzọ doro anya.
- source_word: δὲ
  choice: Mgbe ahụ
  rationale: N’ebe a, δέ na-akwalite akụkọ gaa n’ihe sochirinụ kama igosi nnukwu mmegide; ‘Mgbe ahụ’ dabara n’usoro akụkọ.
- source_word: τοῦ ῥήματος τοῦ κυρίου
  choice: okwu Onyenwe anyị
  rationale: ῥῆμα bụ okwu e kwuru, ebe ‘Onyenwe anyị’ na-echekwa ịdị arọ na ikike nke κύριος ma na-ezo aka n’ebe a na Jizọs.
- source_word: ὡς ἔλεγεν
  choice: otu o si kwuo
  rationale: Nke a bụ okwu Igbo dị mma maka iwebata ihe Onyenwe anyị kwuru, na-enweghị ịmanye echiche na ọ na-ekwukarị ya ugboro ugboro.
- source_word: Ἰωάννης
  choice: Jọn
  rationale: Nke a bụ aha a na-ejikarị eme ihe n’Igbo maka Ἰωάννης.
- source_word: ἐβάπτισεν ὕδατι
  choice: ji mmiri mee baptizim
  rationale: Dative ὕδατι na-egosi ụzọ ma ọ bụ ihe e ji mee ya; ‘ji mmiri’ na-ekwupụta nke a n’Igbo nke ọma.
- source_word: μὲν ... δὲ
  choice: ma
  rationale: ‘Ma’ na-egosi ọdịiche dị n’etiti baptizim Jọn mere na nke a ga-eme ndị na-ege ntị.
- source_word: ὑμεῖς
  choice: unu
  rationale: ‘Unu’ na-egosi nke ọma na nnọchiaha Grik ahụ bụ ọtụtụ mmadụ, ma na-echekwa ọdịiche ya na Jọn.
- source_word: βαπτισθήσεσθε
  choice: a ga-eme unu baptizim
  rationale: Nhazi a na-echekwa ọdịnihu na olu nnabata nke ngwaa Grik ahụ n’Igbo dị mfe nghọta.
- source_word: ἐν πνεύματι ἁγίῳ
  choice: a ga-eji Mmụọ Nsọ mee unu baptizim
  rationale: ‘Jiri’ na-enye nghọta nke ụzọ ma ọ bụ onye e ji mee baptizim, nke ἐν nwere ike ịpụta; ihe ọzọ bụ ịghọta ya dị ka ọnọdụ ‘n’ime Mmụọ Nsọ,’ nke e debere n’ala peeji.
theological_decisions:
- issue: Nsụgharị κύριος
  choice: Onyenwe anyị
  alternative: Nna ukwu
  rationale: ‘Onyenwe anyị’ bụ ụzọ Igbo e ji asọpụrụ ma gosipụta ikike κύριος, ma n’ebe a ọ na-ezo aka na Jizọs.
- issue: Ihe ἐν pụtara na ἐν πνεύματι ἁγίῳ
  choice: jiri Mmụọ Nsọ
  alternative: n’ime Mmụọ Nsọ
  rationale: Preposition ἐν nwere ike igosi ụzọ e si mee ihe ma ọ bụ ọnọdụ e mere ya. Isi ederede họọrọ ‘jiri,’ ebe nkọwa ala peeji na-echekwa nghọta ‘n’ime’ ka a ghara idozi ihe Grik hapụrụ ka ọ nwee nghọta abụọ.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. ‘Mee baptizim’ na-echekwa okwu Ndị Kraịst maara nke ọma; ‘unu’ na-eme ka ọtụtụ onye e kwuru okwu nye pụta ìhè. Akara ala peeji [a] dị n’isi ederede, kpọmkwem n’ebe nhọrọ ἐν metụtara.
