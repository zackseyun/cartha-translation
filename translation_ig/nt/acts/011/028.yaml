id: ACT.11.28
reference: Acts 11:28
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀναστὰς δὲ εἷς ἐξ αὐτῶν ὀνόματι Ἅγαβος ἐσήμανεν διὰ τοῦ πνεύματος λιμὸν ⸀μεγάλην μέλλειν ἔσεσθαι ἐφ’ ὅλην τὴν οἰκουμένην· ⸀ἥτις ἐγένετο ἐπὶ ⸀Κλαυδίου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/028.yaml
  text: And one of them[a], named Agabus, stood up and indicated by the Spirit that a great famine was about to come over the whole inhabited world—which happened in the time of Claudius.
translation:
  language: ig
  text: Ma otu onye n’ime ha, aha ya bụ Agabọs, biliri mee ka a mara site na Mmụọ Nsọ na oké ụnwụ ga-adị n’ụwa mmadụ bi na ya niile[a]—nke mere n’oge Klọdiọs.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ụwa dum.” N’akwụkwọ Luk na Ọrụ Ndị Ozi, “ụwa mmadụ bi na ya niile” nwekwara ike izo aka karịsịa n’ala ndị Rom na-achị.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστὰς
  choice: biliri
  rationale: Ọ na-egosi na Agabọs biliri n’ọgbakọ ahụ ka o kwuo okwu, ma ọ bụ okwu Igbo dị mfe ma kwekọọ n’omume ahụ.
- source_word: ἐσήμανεν
  choice: mee ka a mara
  rationale: Nhọrọ a na-egosipụta echiche nke igosi ma ọ bụ ime ka ihe doo anya, n’etinyeghị nkọwa ọzọ banyere ụdị amụma ahụ.
- source_word: διὰ τοῦ πνεύματος
  choice: site na Mmụọ Nsọ
  rationale: ‘Site na’ na-egosi ụzọ ma ọ bụ onye e ji mee ka ozi ahụ pụta. N’ọnọdụ amụma dị n’Ọrụ Ndị Ozi, ‘Mmụọ’ na-ezo aka na Mmụọ Nsọ.
- source_word: λιμὸν μεγάλην
  choice: oké ụnwụ
  rationale: ‘Oké’ na-edobe echiche nkịtị nke μεγάλην, ebe ‘ụnwụ’ bụ okwu Igbo doro anya maka λιμός.
- source_word: μέλλειν ἔσεσθαι
  choice: na-achọ ịdakwasị
  rationale: Ọ na-egosi ihe na-aga ime n’oge na-adịghị anya ma na-adaba n’ụzọ ndị Igbo si ekwu maka ụnwụ na-abịakwasị ndị mmadụ.
- source_word: ἐφ’ ὅλην τὴν οἰκουμένην
  choice: ịdakwasị ụwa niile mmadụ bi na ya
  rationale: Ọ na-edobe isi echiche nke οἰκουμένη dị ka ụwa mmadụ bi na ya, n’emeghị ka isi ederede kpebie na ọ bụ naanị Alaeze Rom.
- source_word: ἥτις ἐγένετο
  choice: nke ahụ mekwara
  rationale: Ọ na-ejikọta amụma ahụ na mmezu ya n’ụzọ Igbo dị larịị ma doo anya.
- source_word: ἐπὶ Κλαυδίου
  choice: n’oge Klọdiọs
  rationale: Ọ na-egosi oge ọchịchị Klọdiọs n’enweghị ịgbakwụnye okwu na-adịghị n’isi mmalite.
theological_decisions:
- issue: Ihe ‘Mmụọ’ pụtara na διὰ τοῦ πνεύματος
  choice: Mmụọ Nsọ
  alternative: mmụọ n’echiche na-akọwaghị kpọmkwem onye ọ bụ
  rationale: N’Ọrụ Ndị Ozi, mgbe ‘Mmụọ’ pụtara n’ọnọdụ amụma dị otu a, ọ na-ezokarị aka na Mmụọ Nsọ.
- issue: Ókè οἰκουμένη ruru
  choice: ụwa niile mmadụ bi na ya
  alternative: ụwa dum; ma ọ bụ ụwa Alaeze Rom dum
  rationale: Okwu Grik ahụ nwere ike ịpụta ụwa mmadụ bi na ya n’ozuzu, ma n’akwụkwọ Luk na Ọrụ Ndị Ozi ọ nwekwara ike izo aka n’ụwa dị n’okpuru Alaeze Rom. Isi ederede na-edobe obosara okwu ahụ, ebe nkọwa ala peeji na-egosi ụzọ ọzọ e nwere ike isi ghọta ya.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke oge a, dị ùgwù ma dị mfe nghọta. E ji ‘oké ụnwụ’ na ‘na-achọ ịdakwasị’ mee ka okwu ahụ bụrụ nke ndị na-agụ Igbo taa na-aghọta nke ọma, ma a hapụrụ ókè ‘ụwa niile mmadụ bi na ya’ ka ọ ghara ịbụ nke a kpebiri karịa ihe isi mmalite kwuru.
