- from: Ha mekwara otú ahụ[a], zigaara ndị okenye ya site n’aka Banabas na Sọl.
  to: Ha mekwara otú ahụ, zigaara ndị okenye ihe enyemaka ahụ site n’aka Banabas na Sọl.[a]
  rationale: The revision preserves the verse’s concise report and its agency construction. “Ihe enyemaka ahụ” clearly resumes the relief contribution from the preceding verse, where Greek supplies the object by context; it prevents “ya” from being misread as modifying “ndị okenye.” The footnote records the literal agency idiom and its natural alternative.
