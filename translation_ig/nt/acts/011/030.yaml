  yaml_path: translation/nt/acts/011/030.yaml
  text: And they did so[a], sending it to the elders by the hand of Barnabas and Saul.
translation:
  language: ig
  text: Ha mekwara otú ahụ, zigaara ndị okenye ihe enyemaka ahụ site n’aka Banabas na Sọl.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “site n’aka Banabas na Sọl.” N’ụzọ nkịtị, akpaalaokwu Grik ahụ sịrị, “site n’aka Banabas na Sọl.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃ καὶ ἐποίησαν
  choice: Ha mekwara otú ahụ
  rationale: Nkebi a na-ezo aka n’ihe ndị na-eso ụzọ kpebiri ime n’amaokwu bu ụzọ. ‘Otú ahụ’ na-egosipụta ntụaka ahụ n’Igbo dị mfe, ebe ‘kwara’ na-eburu καί n’ụzọ dabara n’akụkọ.
- source_word: ἀποστείλαντες
  choice: zigaara
  rationale: Aorist participle a na-akọ ụzọ ha si mee ihe ahụ. Ngwaa ‘zigaara’ na-ejikọta omume iziga ihe ahụ na ndị natara ya n’Igbo eke.
- source_word: πρὸς τοὺς πρεσβυτέρους
  choice: ndị okenye
  rationale: ‘Ndị okenye’ bụ okwu Igbo doro anya maka ndị ndu obodo okwukwe a kpọrọ πρεσβύτεροι, na-enweghị itinye aha ọkwa ụka nke otu nzukọ pụrụ iche.
- source_word: implicit object from context
  choice: ya
  rationale: Ihe e zigara adịghị n’amaokwu Grik a kpọmkwem, ma a na-aghọta ya site n’enyemaka ahụ e kwuru n’amaokwu bu ụzọ. ‘Ya’ na-edobe ntụaka ahụ n’enweghị ịkọwapụta karịa isi mmalite.
- source_word: διὰ χειρὸς
  choice: site n’aka
  rationale: Nke a na-edobe ihe oyiyi dị n’akpaokwu Grik ma na-egosikwa na Banabas na Sọl bụ ndị e ji zie ihe ahụ.
- source_word: Βαρναβᾶ καὶ Σαύλου
  choice: Banabas na Sọl
  rationale: E degharịrị aha ndị a n’usoro mkpọpụta na odide a na-ejikarị eme ihe n’Igbo.
theological_decisions: []
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe nke oge a, dị mfe ma nwee ugwu. E debere akpaokwu ‘site n’aka’ iji chekwaa akpaalaokwu Grik διὰ χειρός, ebe nkọwa okwu na-adịgide nghọta nye ndị na-agụ akwụkwọ taa.
