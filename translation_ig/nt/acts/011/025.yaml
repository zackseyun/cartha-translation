lexical_decisions:
- source_word: ἐξῆλθεν
  choice: ọ pụrụ gaa
  rationale: Ngwaa a na-egosi na ọ hapụrụ ebe ọ nọ gawa ebe ọzọ. “Ọ pụrụ gaa” na-edobe echiche ngagharị ahụ ma bụrụkwa Igbo doro anya.
- source_word: δὲ
  choice: Mgbe ahụ
  rationale: N’ebe a, δέ bụ njikọ dị nro nke na-eme ka akụkọ gaa n’ihu; “Mgbe ahụ” na-egosi usoro ihe mere n’enweghị itinye echiche nke mmegide.
- source_word: εἰς Ταρσόν
  choice: gaa Tasọs
  rationale: εἰς na ngwaa ngagharị na-egosi ebe onye ahụ na-aga. “Gaa Tasọs” bụ ụzọ e si ekwu ya nke ọma n’Igbo.
- source_word: ἀναζητῆσαι
  choice: ịchọ
  rationale: Ngwaa infinitive a na-egosi nzube njem ahụ. “Ịchọ” bụ okwu Igbo nkịtị ma doo anya; “ịchọgharị” nwekwara ike igosi mgbalị siri ike nke okwu Grik ahụ pụrụ ịpụta.
- source_word: Σαῦλον
  choice: Sọl
  rationale: E dere aha mmadụ a n’ụdị nsụgharị mkpụrụokwu a na-ahụkarị n’Igbo.
