    issue: Ambiguous/awkward rendering of ἐξῆλθεν
    rationale: “Ọ pụrụ gaa” may be parsed as ‘he could go’ and does not idiomatically express the completed departure as clearly as “o wee pụọ gaa.”
  - severity: low
    issue: Footnote alternative may introduce ‘again’ nuance
    rationale: Igbo “ịchọgharị” can suggest doing the search again or searching around. The Greek verb denotes seeking/searching for, not necessarily repetition.
