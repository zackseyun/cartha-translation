  text: ⸂ὅτε δὲ⸃ ἀνέβη Πέτρος εἰς ⸀Ἰερουσαλήμ, διεκρίνοντο πρὸς αὐτὸν οἱ ἐκ περιτομῆς
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/002.yaml
  text: But when Peter went up to Jerusalem[a], those of the circumcision were disputing with him.
translation:
  language: ig
  text: Ma mgbe Pita rịgoro Jerusalem, ndị e ji ibi úgwù mara[a] nọ na-arụrịta ya ụka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịtụgharị ya dịka “ndị nke ibi úgwù,” “òtù ndị na-akwado ibi úgwù,” ma ọ bụ “ndị kwere ekwe e biri úgwù.” Okwu Grik ahụ ji njikọ ha na ibi úgwù kọwaa ndị a.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε δὲ
  choice: Ma mgbe
  rationale: δέ na-egosi ntughari n’akụkọ, ya na obere ọdịiche; “Ma mgbe” na-edobe njikọ ahụ n’Igbo dị mfe.
- source_word: ἀνέβη
  choice: gara
  rationale: Ọ bụ ezie na okwu Grik ahụ pụtara n'ụzọ nkịtị ‘rịgoro/gara n’elu,’ Igbo nkịtị na-ekwu ‘gara Jeruselem’; nke a na-ezere okwu siri ike ma na-edobe ihe omume ahụ.
- source_word: Ἰερουσαλήμ
  choice: Jeruselem
  rationale: Ụdị aha ebe a maara nke ọma n’Igbo.
- source_word: διεκρίνοντο
  choice: nọ na-arụrịta ụka
  rationale: Ụdị imperfect na-egosi esemokwu na-aga n’ihu; okwu a n’ọnọdụ a bụ ịrụrịta ụka, ọ bụghị nanị inwe obi abụọ.
- source_word: πρὸς αὐτόν
  choice: megide ya
  rationale: N’ebe ngwaa esemokwu dị, πρός na-egosi na arụmụka ahụ chere Pita ihu; ‘megide ya’ na-egosi mmegide ahụ n’Igbo eke.
- source_word: οἱ ἐκ περιτομῆς
  choice: ndị e ji ibi úgwù mara
  rationale: Nke a na-edobe ụzọ Grik si kọwaa otu ndị ahụ site ná njikọ ha na ibi úgwù, n’ebughị ụzọ kpọọ ha òtù ndọrọ echiche e guzobere n’ụzọ iwu.
theological_decisions:
- issue: Ndị οἱ ἐκ περιτομῆς bụ
  choice: ndị kwere ekwe e ji njikọ ha na ibi úgwù mara
  alternative: ndị Juu niile kwere ekwe, ma ọ bụ otu iwu a kpọrọ ‘òtù ibi úgwù’
  rationale: Akụkụ okwu Grik ahụ na-akọwa ndị a site n’ibi úgwù, ma ọ naghị ekpebi hoo haa ma ọ bụ òtù iwu e guzobere ma ọ bụ ndị Juu niile kwere ekwe. Nsụgharị ahụ na-edobe ohere nghọta a.
translation_notes:
  register: Igbo izugbe, nke ugwu ma dị mfe nghọta. E ji ‘ibi úgwù’ mee ihe dịka okwu a na-ahụkarị maka circumcision; akara nkọwa [a] dị kpọmkwem n’ebe okwu metụtara ya dị.
