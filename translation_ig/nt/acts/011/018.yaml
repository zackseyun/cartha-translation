id: ACT.11.18
reference: Acts 11:18
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀκούσαντες δὲ ταῦτα ἡσύχασαν καὶ ⸀ἐδόξασαν τὸν θεὸν λέγοντες· ⸀Ἄρα καὶ τοῖς ἔθνεσιν ὁ θεὸς τὴν μετάνοιαν ⸂εἰς ζωὴν ἔδωκεν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/018.yaml
  text: When they heard these things[a], they became quiet and glorified God, saying[b], “Then God has also granted to the Gentiles the change of mind that leads to life.”
translation:
  language: ig
  text: Mgbe ha nụrụ ihe ndị a, ha gbachiri nkịtị wee nye Chineke otuto, na-asị, “Ya mere, Chineke enyewokwa ndị mba ọzọ[a] nchegharị nke na-eduga ná ndụ[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị na-abụghị ndị Juu.” N’ebe a, “ndị mba ọzọ” na-ezo aka ná ndị na-abụghị ndị Juu.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “nchegharị ruo ná ndụ” ma ọ bụ “nchegharị maka ndụ.” Okwu Grik ahụ nwere ike igosi ntụziaka gaa ná ndụ ma ọ bụ ndụ dịka ihe si na nchegharị ahụ pụta.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσαντες δὲ ταῦτα
  choice: Mgbe ha nụrụ ihe ndị a
  rationale: A na-egosipụta participle aorist ahụ dị ka ọnọdụ oge bu ụzọ mee; δέ bụ njikọ dị nro nke usoro Igbo anaghị achọ ka a sụgharịa ya iche.
- source_word: ἡσύχασαν
  choice: ha kwụsịrị ịrụ ụka
  rationale: N’ọnọdụ a, okwu ahụ pụtara na ha kwụsịrị mmegide ha wee daa jụụ; nsụgharị a na-eme ka ihe gbara ya gburugburu doo onye Igbo anya.
- source_word: ἐδόξασαν τὸν θεόν
  choice: wee nye Chineke otuto
  rationale: Nke a bụ ụzọ Igbo dị ugwu ma bụrụkwa nke a na-ahụkarị isi kwuo na ha nyere Chineke ebube ma ọ bụ otuto.
- source_word: λέγοντες
  choice: na-asị
  rationale: Ọ na-edobe ọdịdị participle ahụ ma webata kpọmkwem ihe ha kwuru.
- source_word: Ἄρα καὶ
  choice: Ya mere ... kwa
  rationale: “Ya mere” na-egosi nkwubi okwu ha si n’akụkọ Pita nweta, ebe “kwa” na-egosi na onyinye Chineke rutekwara ndị na-abụghị ndị Juu.
- source_word: τοῖς ἔθνεσιν
  choice: ndị mba ọzọ
  rationale: N’ebe a ἔθνεσιν na-ezo aka ná ndị na-abụghị ndị Juu, ọ bụghị nanị mba dị iche iche dịka ngalaba ndọrọ ndọrọ ọchịchị.
- source_word: τὴν μετάνοιαν
  choice: nchegharị
  rationale: “Nchegharị” bụ okwu Igbo doro anya ma sie ike nke na-egosipụta ntụgharị uche na ụzọ ndụ, karịa ịkọwa ya naanị dịka mgbanwe echiche.
- source_word: εἰς ζωὴν
  choice: nke na-eduga ná ndụ
  rationale: Ọ na-echekwa nghọta nke εἰς dịka ntụziaka ma ọ bụ ihe si na nchegharị ahụ pụta, n’enweghị imechi ohere nghọta ahụ n’otu ụzọ naanị.
- source_word: ἔδωκεν
  choice: enyewokwa
  rationale: Perfect Igbo a na-egosi omume Chineke mezuru nke ihe ọ pụtara ka dị ugbu a; “nye” na-edobekwa nchegharị dịka ihe Chineke nyere.
theological_decisions:
- issue: Nchegharị dịka onyinye Chineke
  choice: “Chineke enyewokwa ... nchegharị”
  alternative: “Chineke mere ka ... chegharịa”
  rationale: Grik kwuru na Chineke nyere nchegharị; a hapụrụ okwu ahụ otú ahụ n’ebughị ụzọ kpebie nkuzi sara mbara banyere mmekọrịta ọrụ Chineke na nzaghachi mmadụ.
- issue: Mmekọrịta nchegharị na ndụ
  choice: “nchegharị nke na-eduga ná ndụ”
  alternative: “nchegharị maka ndụ” ma ọ bụ “nchegharị ruo ná ndụ”
  rationale: Nhọrọ a na-edobe ike ntụziaka ma ọ bụ nsonaazụ dị na εἰς ζωήν, ma ọ naghị akọwa ihe karịrị ihe amaokwu ahụ kwuru.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ugwu ma dị mfe nghọta. E jiri “ha kwụsịrị ịrụ ụka” mee ka ihe ἡσύχασαν pụtara n’ọnọdụ esemokwu gara aga doo anya; e zere okwu ụka siri ike na-adịghị mkpa.
