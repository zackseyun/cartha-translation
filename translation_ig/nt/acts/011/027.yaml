  text: Ἐν ταύταις δὲ ταῖς ἡμέραις κατῆλθον ἀπὸ Ἱεροσολύμων προφῆται εἰς Ἀντιόχειαν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/027.yaml
  text: In those days prophets came down from Jerusalem to Antioch[a].
translation:
  language: ig
  text: N’ụbọchị ndị ahụ, ndị amụma si Jerusalem gbadata Antiọk[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “si Jerusalem gaa gbadata Antiọk.” Ngwaa Grik ahụ pụrụ ịpụta “bịa gbadata” ma ọ bụ “gaa gbadata”; ntụgharị a na-elekwasị anya n’ebe ha rutere, bụ Antiọk.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν ταύταις δὲ ταῖς ἡμέραις
  choice: N’ụbọchị ndị ahụ
  rationale: Nke a na-edobe okwu oge dị na Grik n’ụzọ Igbo dị mfe ma kwe ka δέ bụrụ njikọ akụkọ dị nro n’enweghị ịgbakwụnye okwu na-adịghị mkpa.
- source_word: κατῆλθον
  choice: gbadata
  rationale: Ngwaa a nwere echiche ịga ma ọ bụ ịbịa n’ebe dị ala. “Gbadata” na-echekwa echiche ahụ, ebe ihe gbara ya gburugburu na-egosi na ha rutere Antiọk.
- source_word: ἀπὸ Ἱεροσολύμων
  choice: si na Jerusalem
  rationale: ἀπό na-egosi ebe ha siri pụta; “si na Jerusalem” bụ ụzọ Igbo nkịtị si kwuo ya. A na-eji aha obodo ahụ n’ụdị a maara nke ọma.
- source_word: προφῆται
  choice: ndị amụma
  rationale: Nke a bụ okwu Igbo sara mbara ma guzosie ike maka ndị amụma, n’enweghị ịkọwa ọrụ ha karịa ihe Grik kwuru.
- source_word: εἰς Ἀντιόχειαν
  choice: Antiọk
  rationale: Ebe ngwaa “gbadata” na-egosilarị mmegharị ruo ebe ahụ, aha obodo ahụ na-abịa dịka ebe ha gara n’ụzọ Igbo dị mma.
theological_decisions:
- issue: Ụdị ọrụ ndị a kpọrọ προφῆται rụrụ n’ọgbakọ Jerusalem na Antiọk
  choice: ndị amụma
  alternative: ndị ozizi amụma; ndị ozi sitere n’ike mmụọ nsọ
  rationale: Grik kpọrọ ha naanị προφῆται, ọ kọwaghị kpọmkwem ókè ọrụ ha. Ya mere, “ndị amụma” na-echekwa obosara okwu ahụ ma ghara itinye nkọwa otu ụka ma ọ bụ ozizi pụrụ iche.
translation_notes:
  register: Standard Igbo; asụsụ dị ugbu a, dị ùgwù, ma dị mfe nghọta. E debere usoro okwu ka ọ bụrụ nke Igbo nkịtị, ma e chekwara echiche ala/elu dị na κατῆλθον na obosara ihe προφῆται pụtara.
