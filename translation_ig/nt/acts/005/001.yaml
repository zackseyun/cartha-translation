  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἀνὴρ δέ τις Ἁνανίας ὀνόματι σὺν Σαπφίρῃ τῇ γυναικὶ αὐτοῦ ἐπώλησεν κτῆμα
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/001.yaml
  text: But a man named Ananias[a], with Sapphira his wife, sold a piece of property.
translation:
  language: ig
  text: Ma otu nwoke aha ya bụ Ananayas, ya na Safaira, nwunye ya, rere ihe onwunwe[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “ala” ma ọ bụ “ihe onwunwe.” Okwu Grik ahụ pụrụ ịpụta ihe mmadụ nwere n’ozuzu ya ma ọ bụ ala/ihe onwunwe na-adịghị akwagharị.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀνὴρ δέ τις
  choice: Ma otu nwoke
  rationale: “Nwoke” na-egosi onye a kpọbatara n’akụkọ ahụ, ebe “Ma” na-echekwa obere ọdịiche dị n’etiti omume Banabas a kọwara tupu nke a na ihe na-esote.
- source_word: Ἁνανίας ὀνόματι
  choice: aha ya bụ Ananayas
  rationale: Nke a bụ ụzọ Igbo dị mfe ma bụrụkwa nke e ji nsọpụrụ ekwu na aha nwoke ahụ bụ Ananayas.
- source_word: σὺν Σαπφίρῃ τῇ γυναικὶ αὐτοῦ
  choice: ya na Safaira nwunye ya
  rationale: “Ya na” na-echekwa echiche nke iso ya mee ihe n’enweghị ịkọwa karịa ihe Grik kwuru; “nwunye ya” bụ ihe γυνή pụtara n’ebe a.
- source_word: ἐπώλησεν
  choice: rere
  rationale: Oge gara aga dị mfe dabara n’omume e mere otu mgbe n’akụkọ ahụ.
- source_word: κτῆμα
  choice: otu ihe onwunwe
  rationale: Nhọrọ a na-echekwa obosara okwu Grik ahụ, nke nwere ike ịpụta ihe mmadụ nwere ma ọ bụ ala, n’akwụsịghị ya naanị n’ala.
theological_decisions:
- issue: Ọdịiche dị n’etiti ihe Banabas mere na omume Ananayas
  choice: Ịsụgharị δέ dị ka “Ma”
  alternative: “Mgbe ahụ” ma ọ bụ “Ọzọkwa”
  rationale: “Ma” na-egosi ọdịiche akụkọ ahụ bu n’obi n’etinyeghị nkọwa ozizi ọzọ.
- issue: Oke òkè Safaira nwere n’ire ihe ahụ
  choice: “ya na Safaira nwunye ya”
  alternative: “ya na Safaira nwunye ya rere”
  rationale: Grik ji ngwaa dị n’otu onye maka Ananayas ma kwuo na Safaira so ya; nsụgharị a na-echekwa nhazi ahụ ma ghara ikpebi karịa ederede ma ha abụọ hà bụ ndị rere ya n’otu ogo.
translation_notes:
  register: 'E ji Igbo Izugbe nke oge a, dị mfe ma nwee ugwu dee ya. A haziri aha mmadụ dịka a na-akpọkarị ha n’Igbo: Ananayas na Safaira. E tinyere akara nkọwa [a] n’akụkụ “ihe onwunwe,” bụ okwu nkọwa ahụ metụtara.'
