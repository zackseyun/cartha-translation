  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἄγγελος δὲ κυρίου ⸀διὰ νυκτὸς ⸀ἤνοιξε τὰς θύρας τῆς φυλακῆς ἐξαγαγών τε αὐτοὺς εἶπεν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/019.yaml
  text: But an angel of the Lord opened the doors of the prison during the night, brought them out, and said,
translation:
  language: ig
  text: Ma mmụọ ozi nke Onyenwe anyị meghere ọnụ ụzọ ụlọ mkpọrọ ahụ n'abalị, kpọpụtara ha, sị,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄγγελος
  choice: otu mmụọ ozi
  rationale: “Mmụọ ozi” bụ okwu Igbo a na-ejikarị akọwa onye ozi si n’eluigwe. “Otu” na-egosi na aha Grik ahụ enweghị article, n’ebughị ụzọ mee ya ‘mmụọ ozi ahụ.’
- source_word: κυρίου
  choice: nke Onyenwe anyị
  rationale: “Onyenwe anyị” bụ nsụgharị Igbo a maara nke ọma maka κύριος n’aha nsọ a bụ ‘mmụọ ozi nke Onyenwe anyị.’
- source_word: διὰ νυκτός
  choice: n'abalị
  rationale: Nkebiokwu a na-egosi oge ihe ahụ mere. “N'abalị” bụ ụzọ Igbo dị mfe ma bụrụkwa nke e ji eme ihe ugbu a.
- source_word: ἤνοιξε
  choice: meghere
  rationale: Ngwaa a pụtara imeghe; ọ naghị ekwu kpọmkwem na e ji mkpịsị ugodi kpọghee ya.
- source_word: τὰς θύρας τῆς φυλακῆς
  choice: ọnụ ụzọ ụlọ mkpọrọ ahụ
  rationale: “Ọnụ ụzọ” na “ụlọ mkpọrọ” na-anọchi anya θύραι na φυλακή n'ụzọ doro anya ma dịkwa n'okike n'Igbo; Igbo anaghị achọ akara ọtụtụ n'aha ebe a.
- source_word: ἐξαγαγών
  choice: kpọpụta ha
  rationale: “Kpọpụta ha” na-egosi na o mere ka ha si n'ime ụlọ mkpọrọ pụta, n’etinyeghị nkọwa ọzọ na-adịghị na Grik.
- source_word: τε
  choice: —
  rationale: E tinyere njikọ dị nro nke τέ n'usoro ngwaa ndị Igbo na kọma, kama ịgbakwunye okwu njikọ ga-eme ka ahịrịokwu ahụ sie ike n'ụzọ na-adịghị mkpa.
- source_word: εἶπεν
  choice: sị
  rationale: “Sị” bụ ụzọ Igbo kachasị dị n'okike isi webata okwu onye ahụ ga-ekwu n'amaokwu na-esonụ.
theological_decisions:
- issue: Ụdị onye ἄγγελος na-ekwu maka ya
  choice: mmụọ ozi si n'eluigwe
  alternative: onye ozi mmadụ
  rationale: Imeghe ọnụ ụzọ ụlọ mkpọrọ n'abalị na ịkpọpụta ndị mkpọrọ na-egosi ọrụ karịrị nke mmadụ; ya mere “mmụọ ozi” dabara n'ọnọdụ a.
- issue: Nsụgharị κύριος
  choice: Onyenwe anyị
  alternative: Nna ukwu
  rationale: N'okwu a maara nke ọma bụ ‘mmụọ ozi nke Onyenwe anyị,’ “Onyenwe anyị” na-edobe aha nsọ na ọdịnala okwu Akwụkwọ Nsọ n'Igbo, ebe “Nna ukwu” nwere ike ịpụta naanị onye nwe mmadụ.
translation_notes:
  register: Asụsụ ahụ bụ Standard Igbo dị ugbu a, dị ugwu ma dị mfe nghọta. E debere ahịrịokwu ahụ ka ọ gaa n'ihu n'amaokwu na-esonụ site n'ịkwụsị na “sị,” dịka isi mmalite Grik si mee.
