  text: Ἐγένετο δὲ ὡς ὡρῶν τριῶν διάστημα καὶ ἡ γυνὴ αὐτοῦ μὴ εἰδυῖα τὸ γεγονὸς εἰσῆλθεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/007.yaml
  text: After an interval of about three hours, his wife came in, not knowing what had happened.
translation:
  language: ig
  text: Mgbe ihe dị ka awa atọ gachara, nwunye ya batara n'amaghị ihe merenụ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: Mgbe ... gachara
  rationale: N'ebe a, ἐγένετο δὲ na-akwalite akụkọ gaa n'ihe sochirinụ. Igbo eke anaghị achọ ka a sụgharịa ya n'ụzọ siri ike dịka “O wee ruo”; nhazi oge a na njikọ “ma” n'ahịrịokwu ahụ na-egosi ọganihu akụkọ ahụ nke ọma.
- source_word: ὡς ὡρῶν τριῶν διάστημα
  choice: ihe dị ka awa atọ gachara
  rationale: ὡς na-egosi na oge ahụ bụ ntụnyere, ebe διάστημα na-ekwu maka ogologo oge gafere. “Ihe dị ka awa atọ gachara” bụ Igbo doro anya ma na-echekwa echiche abụọ ahụ.
- source_word: ἡ γυνὴ αὐτοῦ
  choice: nwunye ya
  rationale: N'ọnọdụ akụkọ a, γυνή pụtara nwunye Ananayas, ọ bụghị naanị nwanyị.
- source_word: μὴ εἰδυῖα
  choice: ma ọ maghị
  rationale: Nke a na-egosi ọnọdụ amaghị ihe nke nwunye ahụ mgbe ọ batara. Ahịrịokwu Igbo zuru ezu na-ada eke karịa iji nkebiokwu participle nke ga-esi ike.
- source_word: τὸ γεγονὸς
  choice: ihe merenụ
  rationale: Perfect participle ahụ e ji dịka aha na-ezo aka n'ihe merela tupu ọ bata; “ihe merenụ” na-egosi nke a n'Igbo n'ụzọ dị nkenke.
- source_word: εἰσῆλθεν
  choice: batara
  rationale: “Batara” na-egosi ịbanye n'ebe ihe ndị a na-eme, ma dabara n'echiche akụkọ nke εἰσῆλθεν.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị mfe ma nwee ugwu. E chekwaghị njikọ okwu Grik n'ụzọ ga-eme ka Igbo sie ike; e jikwa “ihe dị ka” chekwaa enweghị kpọmkwem nke ὡς.
