  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀκούων δὲ ὁ Ἁνανίας τοὺς λόγους τούτους πεσὼν ἐξέψυξεν· καὶ ἐγένετο φόβος μέγας ἐπὶ πάντας τοὺς ⸀ἀκούοντας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/005.yaml
  text: But when Ananias heard these words[a], he fell down and died. And great fear came upon all who heard.
translation:
  language: ig
  text: Ma mgbe Ananayas nụrụ okwu ndị a, ọ dara n’ala wee nwụọ.[a] Oké egwu wee dakwasị ndị niile nụrụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n’ụzọ nkịtị karịa, “kubie ume ikpeazụ” ma ọ bụ “kupu ume.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούων
  choice: mgbe ... nụrụ
  rationale: A sụgharịrị participle dị ugbu a dị ka nkebiokwu oge, n’ihi na nke a na-egosi n’ụzọ Igbo si aga na ọnwụ ya mere ozugbo ọ nụrụ okwu ahụ.
- source_word: δὲ
  choice: Ma
  rationale: Ma na-egosi ntakịrị mgbanwe na ọdịiche dị n’etiti okwu Pita na ihe mere Ananayas ozugbo.
- source_word: Ἁνανίας
  choice: Ananayas
  rationale: E degharịrị aha Grik ahụ n’ụdị a na-eji eme ihe n’Igbo.
- source_word: λόγους τούτους
  choice: okwu ndị a
  rationale: N’ebe a λόγοι bụ okwu Pita kwuru; ‘okwu ndị a’ bụ ntụgharị kpọmkwem ma dịkwa mfe nghọta.
- source_word: πεσὼν
  choice: ọ dara n’ala
  rationale: Nke a na-echekwa ihe oyiyi ahụ kpọmkwem, kama ịkọwa ya naanị dị ka ịda mba.
- source_word: ἐξέψυξεν
  choice: kubie ume ikpeazụ
  rationale: Nhọrọ a na-echekwa ihe oyiyi nke ngwaa Grik nke pụtara ịpụ ume ma na-egosikwa ọnwụ n’ụzọ doro anya n’Igbo.
- source_word: ἐγένετο φόβος μέγας ἐπὶ
  choice: Oké egwu wee dakwasị
  rationale: Nkebiokwu Igbo a na-egosi mbata mberede nke egwu n’ahụ ndị ahụ ma kwekọọ na ἐπί.
- source_word: πάντας τοὺς ἀκούοντας
  choice: ndị niile nụrụ ihe ahụ
  rationale: Participle ahụ na-arụ ọrụ dị ka aha ndị nụrụ akụkọ ma ọ bụ ihe mere; ‘ihe ahụ’ anaghị ekpebi kpọmkwem ma ha nụrụ okwu ahụ n’onwe ha ka ha nụrụ akụkọ ya.
theological_decisions:
- issue: Ụdị ọnwụ Ananayas
  choice: Kọwaa na ọ dara n’ala wee kubie ume ikpeazụ, n’akọwaghị kpọmkwem ihe kpatara ọnwụ ahụ.
  alternative: Ikwu na ụjọ gburu ya ma ọ bụ na Chineke tiri ya ozugbo.
  rationale: Grik kwuru ihe mere, ma ọ kọwaghị usoro ma ọ bụ ihe kpọmkwem kpatara ọnwụ ahụ. Ya mere, ntụgharị ahụ echekwaghị ihe ederede hapụrụ n’amaghị ama.
translation_notes:
  register: Igbo ọkọlọtọ nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ ‘kubie ume ikpeazụ’ iji debe ihe oyiyi Grik, ebe nkọwa ala peeji na-eme ka ihe ọ pụtara doo anya.
