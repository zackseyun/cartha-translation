revisions:
- from: “Gaanụ, guzoro n’ogige ụlọnsọ ukwu[a][c], gwakwa ndị mmadụ okwu niile banyere ndụ a[b].”
  to: “Gaanụ, guzonụ n’ogige ụlọ nsọ[a][c], gwaanụ ndị mmadụ okwu niile nke ndụ a[b].”
  rationale: The revision restores the direct genitive sense, “okwu niile nke ndụ a,” thereby preserving the source’s ambiguity and the English POB audit trail. It also uses natural plural Igbo imperatives and the standard term “ụlọ nsọ,” while retaining “ogige” to express the broader temple precincts. Footnote anchors remain attached to the relevant phrases, and the alternatives are updated to match the revised wording.
