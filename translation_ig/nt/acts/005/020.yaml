  text: Πορεύεσθε καὶ σταθέντες λαλεῖτε ἐν τῷ ἱερῷ τῷ λαῷ πάντα τὰ ῥήματα τῆς ζωῆς ταύτης.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/020.yaml
  text: Go and stand in the temple[c][b][a], and speak to the people all the words of this life.
translation:
  language: ig
  text: “Gaanụ, guzonụ n’ogige ụlọ nsọ[a][c], gwaanụ ndị mmadụ okwu niile nke ndụ a[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’ime mpaghara ụlọ nsọ.” Okwu Grik ahụ na-ezo aka na mpaghara ụlọ nsọ dum, ọ bụghị naanị n’ime ebe nsọ.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, “okwu niile banyere ndụ a” ma ọ bụ “okwu niile banyere ụzọ ndụ a.” Okwu ahụ pụrụ izo aka ná ndụ a na-ekwusa n’ozi ọma.
    reason: alternative_reading
  - marker: c
    text: Ma ọ bụ, “Gaanụ, mgbe unu guzoro n’ogige ụlọ nsọ, gwaanụ ndị mmadụ…”
    reason: previous_rendering
lexical_decisions:
- source_word: Πορεύεσθε
  choice: Gaanụ
  rationale: Ọ bụ iwu ka ọtụtụ mmadụ gaa; “Gaanụ” bụ ụzọ Igbo kacha doo anya ma dịkwa n'okike isi nye iwu a.
- source_word: σταθέντες
  choice: guzoro
  rationale: Ọ bụ participle aorist nke na-eso iwu ahụ dị ka omume ọzọ a ga-eme. Igbo dị n'okike na-enye ya dịka ngwaa e jikọtara na “gaanụ,” n’enweghị ịgbanwe usoro omume ahụ.
- source_word: λαλεῖτε
  choice: gwakwa
  rationale: Ọ pụtara ịgwa ma ọ bụ ikwu okwu. “Gwakwa” na-egosi na ha ga-agwa ndị mmadụ ihe ahụ, ma ọ naghị atụkwasị echiche nke ikwusa ozi n’ihu ọha nke okwu Grik ahụ n’onwe ya na-ekwughị kpọmkwem.
- source_word: ἐν τῷ ἱερῷ
  choice: n’ogige ụlọnsọ ukwu
  rationale: ἱερόν na-ezo aka n’ebe niile gbara ụlọnsọ ahụ, ọ bụghị kpọmkwem ime ebe nsọ. “N’ogige ụlọnsọ ukwu” na-eme ka nke a doo onye Igbo anya ma ghara ime ka ọ chee na ọ bụ n’ime ebe nsọ ahụ.
- source_word: τῷ λαῷ
  choice: ndị mmadụ
  rationale: Nke a na-anọchi ndị nọ ebe ahụ n’enweghị ịgbakwunye nkọwa agbụrụ nke amaokwu ahụ ekwughị kpọmkwem.
- source_word: πάντα τὰ ῥήματα
  choice: okwu niile
  rationale: Nke a na-edobe ma echiche nke “niile” ma nke “okwu,” n’ụzọ dị mkpirikpi ma dị n'okike n’Igbo.
- source_word: τῆς ζωῆς ταύτης
  choice: banyere ndụ a
  rationale: Genitive Grik a nwere ike ịbụ “okwu nke ndụ a” ma ọ bụ okwu ndị metụtara ndụ a. “Banyere ndụ a” bụ Igbo doro anya, ebe e ji ihe odide ala kọwaa na nsụgharị kpọmkwem ka nwere ike ịbụ “nke ndụ a.”
theological_decisions:
- issue: Ihe “τῆς ζωῆς ταύτης” (“ndụ a”) pụtara
  choice: E debere okwu ahụ dịka “ndụ a,” n’enweghị itinye “ndụ ọhụrụ,” “ụzọ ndụ,” ma ọ bụ “ozi na-enye ndụ.”
  alternative: “okwu niile nke ndụ a” ma ọ bụ “okwu niile banyere ụzọ ndụ a”
  rationale: 'Okwu Grik ahụ dị mkpirikpi ma nwee nghọta karịrị otu: ọ pụrụ izo aka ná ndụ a na-ekwusa n’ozi ọma, ndụ ọhụrụ n’ime Kraịst, ma ọ bụ ozi metụtara ndụ. Nsụgharị ahụ ekwesịghị ikpebi otu nkọwa naanị.'
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Ụdị ọtụtụ mmadụ dị na “Gaanụ” na-agbasokwa ndịozi ahụ e nyere iwu. E ji “ụlọnsọ ukwu” maka temple, “ogige” wee mee ka obosara ἱερόν pụta ìhè.
