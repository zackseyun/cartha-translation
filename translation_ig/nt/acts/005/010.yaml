review_pass:
  verdict: revise
  source_fidelity: Draft accurately reflects the sequence and principal actions in the Greek. However, the coordinated aorist ἐξέψυξεν requires a finite, properly connected Igbo verb; the bare infinitive-like form “nwụọ” after “ọ dara” is ungrammatical. “Ha hụrụ na ọ nwụọla” shifts εὗρον αὐτὴν νεκράν (‘found her dead’) toward discovering that she had died; “ha hụrụ ya nwụrụ anwụ” preserves the predicative state more closely.
  naturalness: “Ozugbo ahụ” and the narrative register are natural Standard Igbo. Adding “wee” makes the first sentence idiomatic, and “hụrụ ya nwụrụ anwụ” is a more direct and natural rendering of finding her dead.
  terminology: “Ụmụ okorobịa,” “di ya,” and “n’akụkụ di ya” are suitable. “N’ụkwụ ya” naturally conveys ‘at his feet’ in this context and retains the Greek pronoun without unnecessarily supplying Peter’s name.
  issues:
  - severity: medium
    issue: Unconnected verb form in “ọ dara n’ụkwụ ya, nwụọ.”
    rationale: The clause needs a connective and finite verbal construction in Standard Igbo, such as “wee nwụọ,” to express ‘fell ... and died.’
  - severity: low
    issue: “Ha hụrụ na ọ nwụọla” does not directly render the predicative adjective νεκράν.
    rationale: The Greek says they found her in the state of being dead. “Ha hụrụ ya nwụrụ anwụ” retains that meaning without implying a separate inference.
  revised_text: Ozugbo ahụ, ọ dara n’ụkwụ ya wee nwụọ. Mgbe ụmụ okorobịa ahụ batara, ha hụrụ ya nwụrụ anwụ, ha burukwa ya pụọ lie ya n’akụkụ di ya.
  revised_footnotes: []
  revision_rationale: The revision corrects the Igbo clause linkage and renders ‘found her dead’ more directly, while preserving the source’s immediacy, sequence, ambiguity of the pronoun ‘his,’ and burial beside her husband. No footnotes are required.
