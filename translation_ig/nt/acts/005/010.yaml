base_translation:
  language: en
  yaml_path: translation/nt/acts/005/010.yaml
  text: Then she immediately fell at his feet and died. When the young men came in, they found her dead, and they carried her out and buried her beside her husband.
translation:
  language: ig
  text: Ozugbo ahụ, ọ dara n’ụkwụ ya wee nwụọ. Mgbe ụmụ okorobịa ahụ batara, ha hụrụ ya nwụrụ anwụ, ha burukwa ya pụọ lie ya n’akụkụ di ya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραχρῆμα
  choice: Ozugbo ahụ
  rationale: Na-egosipụta na ihe a mere n’otu ntabi anya, dịka okwu Grik si kwuo.
- source_word: πρὸς τοὺς πόδας αὐτοῦ
  choice: n’ụkwụ ya
  rationale: Na-edobe nnọchiaha nke dị n’ederede Grik; ihe gbara amaokwu a gburugburu na-egosi na ọ bụ ụkwụ Pita.
- source_word: ἐξέψυξεν
  choice: nwụọ
  rationale: Okwu a pụtara na ndụ ya kwụsịrị; ‘nwụọ’ bụ ụzọ doro anya ma bụrụkwa nke e ji ekwu ya n’Igbo ugbu a.
- source_word: οἱ νεανίσκοι
  choice: ụmụ okorobịa ahụ
  rationale: Na-akọwa ndị ikom na-eto eto ahụ e kwuru okwu ha n’akụkọ a.
- source_word: πρὸς τὸν ἄνδρα αὐτῆς
  choice: n’akụkụ di ya
  rationale: N’ebe a, πρός na-egosi ili ya nso ma ọ bụ n’akụkụ di ya.
