id: ACT.5.21
reference: Acts 5:21
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀκούσαντες δὲ εἰσῆλθον ὑπὸ τὸν ὄρθρον εἰς τὸ ἱερὸν καὶ ἐδίδασκον. Παραγενόμενος δὲ ὁ ἀρχιερεὺς καὶ οἱ σὺν αὐτῷ συνεκάλεσαν τὸ συνέδριον καὶ πᾶσαν τὴν γερουσίαν τῶν υἱῶν Ἰσραήλ, καὶ ἀπέστειλαν εἰς τὸ δεσμωτήριον ἀχθῆναι αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/021.yaml
  text: When they heard this[a], they entered the temple courts at daybreak and were teaching. But when the high priest arrived, and those with him, they called together the Sanhedrin and the whole council of the sons of Israel, and sent to the prison to have them brought.
translation:
  language: ig
  text: Mgbe ha nụrụ ihe ahụ, ha banyere n’ogige ụlọ nsọ mgbe chi bọrọ, na-akụzi ihe. Ma mgbe onyeisi nchụàjà na ndị ha na ya nọ bịarutere, ha kpọkọtara Sanhedrin ahụ na ọgbakọ ndị okenye niile nke ụmụ Izrel[a], wee ziga ka e si n’ụlọ mkpọrọ kpọta ha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ọgbakọ ndị okenye niile nke Izrel” ma ọ bụ “òtù ndị okenye niile nke Izrel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσαντες
  choice: Mgbe ha nụrụ ihe ahụ
  rationale: Nkebi a na-egosi oge ma na-ezo aka n'iwu mmụọ ozi nyere n'amaokwu bu ụzọ; ntụgharị a doro anya ma ghara ịkọwa karịa ihe odide ahụ kwuru.
- source_word: ὑπὸ τὸν ὄρθρον
  choice: mgbe chi bọrọ
  rationale: Nke a bụ ụzọ Igbo si ekwu oge chi na-amalite ịbọ, kwekọrọ n'oge chi ọbụbọ nke okwu Grik ahụ na-egosi.
- source_word: ἱερὸν
  choice: ogige ụlọ nsọ
  rationale: ἱερόν ebe a bụ akụkụ niile nke ụlọ nsọ, ọ bụghị naanị ebe nsọ dị n'ime ya; 'ogige ụlọ nsọ' na-eme ka ọdịiche ahụ doo anya.
- source_word: ἐδίδασκον
  choice: na-ezikwa ndị mmadụ ihe
  rationale: Oge ngwaa Grik ahụ na-egosi omume na-aga n'ihu; usoro 'na-ezi ... ihe' na-echekwa echiche ahụ n'Igbo.
- source_word: Παραγενόμενος
  choice: mgbe ... bịarutere
  rationale: Participul a na-ewebata ihe ọzọ mere n'usoro oge; ntụgharị a bụ Igbo nkịtị ma doo anya.
- source_word: οἱ σὺν αὐτῷ
  choice: ndị ya na ha nọ
  rationale: Nke a na-egosi ndị so nnukwu onye nchụàjà n'enweghị ịkọwapụta ndị ha bụ karịa ihe Grik kwuru.
- source_word: συνεκάλεσαν
  choice: ha kpọkọtara
  rationale: Ngwaa a pụtara ịkpọ ndị otu ka ha zukọta; 'kpọkọtara' bụ okwu Igbo dị mfe ma kwesị ekwesị.
- source_word: συνέδριον
  choice: Sanhedrin ahụ
  rationale: N'ebe a okwu ahụ na-ezo aka n'otu kansụl ọchịchị ndị Juu a maara n'akụkọ ihe mere eme dị ka Sanhedrin; ide aha ahụ na-echekwa kpọmkwem òtù a na-ekwu maka ya.
- source_word: πᾶσαν τὴν γερουσίαν τῶν υἱῶν Ἰσραήλ
  choice: ọgbakọ ndị okenye niile nke ụmụ Izrel
  rationale: γερουσία bụ òtù ma ọ bụ ọgbakọ ndị okenye. Nsụgharị a na-echekwa ma echiche òtù ndị okenye ma okwu ọdịnala 'ụmụ Izrel,' na-ahapụghị mgbagwoju anya gbasara njikọ ya na Sanhedrin.
- source_word: δεσμωτήριον
  choice: ụlọ mkpọrọ
  rationale: Nke a bụ okwu Igbo a na-ejikarị eme ihe maka ebe a na-edebe ndị mkpọrọ.
- source_word: ἀχθῆναι αὐτούς
  choice: ka a kpọta ha
  rationale: 'Infinitiv pasiv a na-egosi nzube nke iziga ndị ozi: ka e si n''ụlọ mkpọrọ kpọta ndị ahụ.'
theological_decisions:
- issue: Nsụgharị τῶν υἱῶν Ἰσραήλ
  choice: nke ụmụ Izrel
  alternative: nke Izrel; nke ndị Izrel
  rationale: Okwu Grik ahụ bụ aha ọdịnala nke mba ahụ nke pụtara n'ụzọ nkịtị 'ụmụ ndị ikom Izrel.' 'Ụmụ Izrel' na-echekwa ọdịdị ezinụlọ na mba dị n'okwu mbụ, ebe nkọwa ala peeji na-enye ụzọ Igbo dị ire ụtọ karị.
- issue: Mmekọrịta συνέδριον na πᾶσαν τὴν γερουσίαν
  choice: Sanhedrin ahụ na ọgbakọ ndị okenye niile
  alternative: Sanhedrin ahụ, ya bụ, ọgbakọ ndị okenye niile
  rationale: Grik nwere καί ('na'), ma njikọ òtù abụọ ahụ nwere ike ịbụ mgbasawanye ma ọ bụ nkọwa nke mbụ. E debere 'na' ka a ghara ikpebi na ha bụ otu òtù kpọmkwem ma ọ bụ òtù abụọ dị iche kpamkpam.
translation_notes:
  register: Ejiri Igbo ọkọlọtọ nke oge a, dị ùgwù ma dị mfe nghọta. 'Sanhedrin' ka edebere dị ka aha akụkọ ihe mere eme; 'ogige ụlọ nsọ' na-egosi nnukwu mpaghara ụlọ nsọ kama ebe nsọ dị n'ime ya. Akara nkọwa ala peeji [a] pụtara n'ederede isi.
