revisions:
- from: Mgbe ha nụrụ ihe ahụ, ha banyere n'ogige ụlọ nsọ mgbe chi bọrọ, na-ezikwa ndị mmadụ ihe. Ma mgbe nnukwu onye nchụàjà na ndị ya na ha nọ bịarutere, ha kpọkọtara Sanhedrin ahụ na ọgbakọ ndị okenye niile nke ụmụ Izrel[a], wee zipụ ndị ozi n'ụlọ mkpọrọ ka a kpọta ha.
  to: Mgbe ha nụrụ ihe ahụ, ha banyere n’ogige ụlọ nsọ mgbe chi bọrọ, na-akụzi ihe. Ma mgbe onyeisi nchụàjà na ndị ha na ya nọ bịarutere, ha kpọkọtara Sanhedrin ahụ na ọgbakọ ndị okenye niile nke ụmụ Izrel[a], wee ziga ka e si n’ụlọ mkpọrọ kpọta ha.
  rationale: The changes correct the technical title for the high priest, repair pronoun agreement, and remove unnecessary supplied participants while preserving the Greek’s temporal flow, ongoing teaching, institutional terminology, and the ambiguity in the relationship between the Sanhedrin and the whole elder-body.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T08:28:21Z'
review_pass:
  verdict: revise
  source_fidelity: 'The draft largely follows the Greek sequence and aspect well: the apostles enter the temple precincts at dawn and continue teaching; the high priest and his associates convene the Sanhedrin and the whole elder-body, then arrange for the apostles to be brought from prison. However, “nnukwu onye nchụàjà” is not the standard or accurate designation for ἀρχιερεύς in this office; “onyeisi nchụàjà” is required. The draft also unnecessarily supplies “ndị mmadụ” as the object of teaching and “ndị ozi” as those sent, neither of which is stated in the verse.'
  naturalness: The revision uses idiomatic Standard Igbo. “Ndị ha na ya nọ” correctly refers to the high priest’s companions, unlike the draft’s mismatched “ndị ya na ha nọ.” “Na-akụzi ihe” naturally conveys the ongoing teaching without adding an explicit audience.
  terminology: “Onyeisi nchụàjà” is the established Standard Igbo term for the high priest. “Sanhedrin” appropriately retains the historical institutional name. “Ọgbakọ ndị okenye niile nke ụmụ Izrel” adequately represents the elder-body while preserving the traditional national expression “ụmụ Izrel.”
  issues:
  - severity: high
    issue: “nnukwu onye nchụàjà” for ὁ ἀρχιερεύς
    rationale: This literally suggests a physically or generally ‘great/big priest’ rather than the specific office of high priest. Standard Igbo biblical usage is “onyeisi nchụàjà.”
  - severity: medium
    issue: “ndị ya na ha nọ” for οἱ σὺν αὐτῷ
    rationale: The pronouns are not aligned with the singular high priest. “Ndị ha na ya nọ” means ‘those who were with him.’
  - severity: low
    issue: 'Added explicit objects: “ndị mmadụ” and “ndị ozi”'
    rationale: The Greek says only that they were teaching and that the authorities sent [someone] to the prison. The additions are plausible contextual inferences but are not needed and reduce formal precision.
  revised_text: Mgbe ha nụrụ ihe ahụ, ha banyere n’ogige ụlọ nsọ mgbe chi bọrọ, na-akụzi ihe. Ma mgbe onyeisi nchụàjà na ndị ha na ya nọ bịarutere, ha kpọkọtara Sanhedrin ahụ na ọgbakọ ndị okenye niile nke ụmụ Izrel[a], wee ziga ka e si n’ụlọ mkpọrọ kpọta ha.
  revised_footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ọgbakọ ndị okenye niile nke Izrel” ma ọ bụ “òtù ndị okenye niile nke Izrel.”
    reason: lexical_alternative
  revision_rationale: The changes correct the technical title for the high priest, repair pronoun agreement, and remove unnecessary supplied participants while preserving the Greek’s temporal flow, ongoing teaching, institutional terminology, and the ambiguity in the relationship between the Sanhedrin and the whole elder-body.
