- from: Ma mgbe ndị nche ahụ rutere, ha ahụghị ha n’ụlọ mkpọrọ ahụ; ya mere, ha laghachiri kọọ ihe merenụ,
  to: Ma mgbe ndị nche ahụ rutere, ha ahụghị ha n’ụlọ mkpọrọ ahụ; ya mere, ha laghachiri wee kọọ,
  rationale: The revision removes the unsupported addition “ihe merenụ” and uses the natural connective “wee” to express the participial sequence “returned and reported.” It retains the draft’s suitable rendering of the officers and the specific prison, as well as the trailing comma required by the continuation in Acts 5:23.
