  text: οἱ δὲ ⸂παραγενόμενοι ὑπηρέται⸃ οὐχ εὗρον αὐτοὺς ἐν τῇ φυλακῇ, ἀναστρέψαντες δὲ ἀπήγγειλαν
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/022.yaml
  text: But when the officers arrived, they did not find them in the prison; so they returned and reported,
translation:
  language: ig
  text: Ma mgbe ndị nche ahụ rutere, ha ahụghị ha n’ụlọ mkpọrọ ahụ; ya mere, ha laghachiri wee kọọ,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραγενόμενοι
  choice: mgbe ... rutere
  rationale: Nkebi a na-egosi oge ndị nche ahụ bịaruru n’ụlọ mkpọrọ; “mgbe ... rutere” bụ Igbo nkịtị ma doo anya.
- source_word: ὑπηρέται
  choice: ndị nche
  rationale: N’ọnọdụ a, okwu ahụ na-ezo aka n’ụmụ ọrụ gọọmenti okpukpe e zigara ịkpọpụta ndịozi, ọ bụghị ndị na-eje ozi n’ụlọ. “Ndị nche” dabara n’ọnọdụ ụlọ mkpọrọ, ma ọ naghị akọwapụta kpọmkwem na ha bụ ndị nche ụlọ nsọ karịa ihe Grik kwuru.
- source_word: οὐχ εὗρον
  choice: ha ahụghị
  rationale: Nke a bụ ụzọ Igbo si ekwu n'ụzọ dị mfe na ha achọtaghị ndị ahụ ebe ahụ.
- source_word: ἐν τῇ φυλακῇ
  choice: n’ụlọ mkpọrọ ahụ
  rationale: “Ahụ” na-echekwa nkọwa nke artịkụl Grik, nke na-ezo aka n’ụlọ mkpọrọ a kpọtụrụla aha.
- source_word: ἀναστρέψαντες
  choice: ha laghachiri
  rationale: N’ebe a, okwu ahụ pụtara na ha si n’ụlọ mkpọrọ laghachi n’ebe ndị zitere ha nọ.
- source_word: ἀπήγγειλαν
  choice: kọọ ihe merenụ
  rationale: Ngwaa ahụ pụtara iweta akụkọ ma ọ bụ ịkọghachi ihe. Nkebi a bụ Igbo sitere n’okike nke na-egosi na ha nyere ndị zitere ha akụkọ.
- source_word: δέ
  choice: Ma / ya mere
  rationale: “Ma” na-egosi ọdịiche dị n’etiti ihe a tụrụ anya ya na ihe ha hụrụ; “ya mere” na-ejikọta nlọghachi ha na akụkọ ha kọrọ n’usoro dabara adaba n’Igbo.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị nsọ ma dị mfe nghọta. E chekwara usoro akụkọ ahụ na ntụaka doro anya nye ụlọ mkpọrọ ahụ. Akara rikoma ikpeazụ na-egosi na ahịrịokwu ahụ na-aga n’ihu n’amaokwu na-esote.
