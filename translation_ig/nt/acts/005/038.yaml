source:
  edition: SBLGNT
  text: καὶ τὰ νῦν λέγω ὑμῖν, ἀπόστητε ἀπὸ τῶν ἀνθρώπων τούτων καὶ ⸀ἄφετε αὐτούς· (ὅτι ἐὰν ᾖ ἐξ ἀνθρώπων ἡ βουλὴ ⸀αὕτη ἢ τὸ ἔργον τοῦτο, καταλυθήσεται,
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/038.yaml
  text: And now I tell you[a], keep away from these men and leave them alone; for if this plan or this work is from men, it will be overthrown[b],
translation:
  language: ig
  text: 'Ugbu a, ana m agwa unu: Si n’ebe ndị ikom a nọ pụọ, hapụnụ ha aka; n’ihi na ọ bụrụ na atụmatụ a ma ọ bụ ọrụ a sitere n’aka ndị mmadụ[a], a ga-akwatu ya[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “bụ nke mmadụ chepụtara,” ma ọ bụ, “sitere n’aka ụmụ mmadụ.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ọ ga-ala n’iyi,” ma ọ bụ, “a ga-eme ka ọ ghara ịba uru.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ νῦν
  choice: Ugbu a
  rationale: Ọ bụ okwu oge na-ewebata ndụmọdụ Gameliel na-enye ugbu a; “Ugbu a” bụ Igbo doro anya ma dịkwa n’ụzọ e si ekwu okwu taa.
- source_word: ἀπόστητε
  choice: Wepụnụ onwe unu n’ebe ndị a nọ
  rationale: Iwu a na-akpọ ha ka ha kewapụ onwe ha n’ebe ndị ahụ nọ ma ghara itinye aka n’ihe gbasara ha.
- source_word: ἄφετε αὐτούς
  choice: hapụnụ ha aka
  rationale: Nkebiokwu Igbo a na-egosi ka a ghara imetụ ha aka ma ọ bụ gbochie ha, nke dabara n’ọnọdụ a.
- source_word: ὅτι
  choice: n’ihi na
  rationale: Ọ na-ewebata ihe kpatara ndụmọdụ ahụ.
- source_word: ἐὰν ᾖ ἐξ ἀνθρώπων
  choice: ọ bụrụ na ... sitere n’aka ndị mmadụ
  rationale: “Site n’aka ndị mmadụ” na-echekwa echiche nke isi mmalite mmadụ ma na-akwadebe ntụnyere ya na ihe sitere n’aka Chineke n’amaokwu na-esote.
- source_word: βουλή
  choice: atụmatụ
  rationale: Ọ na-egosi atụmatụ, nzube, ma ọ bụ ihe e bu n’obi; “atụmatụ” bụ okwu Igbo nkịtị ma doo anya n’ebe a.
- source_word: ἔργον
  choice: ọrụ
  rationale: Ọ bụ okwu sara mbara maka ihe a na-eme ma ọ bụ ọrụ a malitere; “ọrụ” na-echekwa obosara ya.
- source_word: καταλυθήσεται
  choice: a ga-akwatu ya
  rationale: Ọ na-echekwa olu nnara nke ngwaa Grik ma na-egosi na a ga-eme ka atụmatụ ahụ ma ọ bụ ọrụ ahụ daa ma ghara ịdịgide.
theological_decisions:
- issue: Isi mmalite mmadụ n’okwu ἐξ ἀνθρώπων
  choice: sitere n’aka ndị mmadụ
  alternative: bụ nke mmadụ chepụtara; sitere n’aka ụmụ mmadụ
  rationale: Nsụgharị a na-echekwa ọdịiche dị n’etiti ihe sitere n’aka mmadụ na ihe sitere n’aka Chineke n’amaokwu na-esote, n’ebughị ụzọ kpebie ihe Gameliel ka ga-ekwu.
- issue: Ihe καταλυθήσεται pụtara banyere ọdịda atụmatụ ahụ ma ọ bụ ọrụ ahụ
  choice: a ga-akwatu ya
  alternative: ọ ga-ala n’iyi; a ga-eme ka ọ ghara ịba uru
  rationale: Nhọrọ a na-echekwa olu nnara na echiche nke ịkwatu ma ọ bụ imebi ihe, kama ịkọwa kpọmkwem onye ga-akwatu ya.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. Iwu ndị ahụ nọ n’ụdị ọtụtụ mmadụ (“Wepụnụ,” “hapụnụ”), a na-echekwakwa ntụnyere dị n’etiti isi mmalite mmadụ na nke Chineke n’ebughị echiche okpukpe pụrụ iche banye na ya.
