id: ACT.5.25
reference: Acts 5:25
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: παραγενόμενος δέ τις ἀπήγγειλεν αὐτοῖς ὅτι Ἰδοὺ οἱ ἄνδρες οὓς ἔθεσθε ἐν τῇ φυλακῇ εἰσὶν ἐν τῷ ἱερῷ ἑστῶτες καὶ διδάσκοντες τὸν λαόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/025.yaml
  text: But someone came and reported to them[a], “Look, the men whom you put in prison are standing in the temple and teaching the people.”
translation:
  language: ig
  text: Ma otu onye bịara kọọrọ ha, sị, “Lee, ndị ikom ahụ unu tinyere n’ụlọ mkpọrọ guzo n’ogige ụlọ nsọ[a] na-akụziri ndị mmadụ ihe.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’ụlọ nsọ.” Okwu Grik ἱερόν na-ezo aka n’ogige ụlọ nsọ niile, ọ bụghị kpọmkwem ime ụlọ nsọ ahụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: παραγενόμενος
  choice: bịara
  rationale: Na-egosi na onye ozi ahụ bịarutere tupu ya akọọrọ ha akụkọ ahụ; “bịara” bụ okwu Igbo dị mfe ma kwekọọ n’usoro akụkọ ahụ.
- source_word: δέ
  choice: Ma
  rationale: Na-egosi obere mgbanwe ma ọ bụ ihe megidere ihe a tụrụ anya ya n’akụkọ ahụ.
- source_word: τις
  choice: otu onye
  rationale: Na-edobe onye ahụ dịka onye a na-akpọghị aha, n’etinyeghị nkọwa ọzọ na-adịghị na Grik.
- source_word: ἀπήγγειλεν αὐτοῖς
  choice: kọọrọ ha
  rationale: Na-egosi izigara ndị ọchịchị ahụ ozi ma na-edobe nnọchiaha “ha” dịka isi mmalite si dị.
- source_word: Ἰδοὺ
  choice: Lee
  rationale: Ọ bụ okwu a na-eji adọta uche gaa n’akụkọ dị ịtụnanya; “Lee” bụ Igbo dị ugbu a ma dịkwa nsọpụrụ.
- source_word: οἱ ἄνδρες
  choice: ndị ikom ahụ
  rationale: Na-ezo aka kpọmkwem n’ebe ndịozi ahụ a kpọchiri na mbụ nọ.
- source_word: οὓς ἔθεσθε ἐν τῇ φυλακῇ
  choice: unu tinyere n’ụlọ mkpọrọ
  rationale: Na-asụgharị echiche nke ‘itinye’ mmadụ n’ebe eji kpọchie ya n’ụzọ Igbo na-ada nke ọma.
- source_word: ἐν τῷ ἱερῷ
  choice: n’ogige ụlọ nsọ
  rationale: ἱερόν na-ezo aka n’ụlọ nsọ na ogige ya niile, ọ bụghị kpọmkwem ime ụlọ nsọ kachasị nsọ; “ogige ụlọ nsọ” na-eme ka nke a doo anya.
- source_word: ἑστῶτες καὶ διδάσκοντες τὸν λαόν
  choice: guzo ... na-akụziri ndị mmadụ ihe
  rationale: Na-edobe ọnọdụ ha—ha guzo ebe ahụ ma na-aga n’ihu ịkụziri ndị mmadụ ihe.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo Izugbe dị ugbu a, doro anya ma nwee nsọpụrụ. E tinyere “sị” iji webata okwu onye ozi ahụ n’ụzọ Igbo nkịtị. Akara nkọwa [a] dị ozugbo n’ebe okwu ọ na-akọwa dị.
