  naturalness: The wording is clear, idiomatic Standard Igbo, and suitably formal for Scripture. “Ma otu onye bịara kọọrọ ha, sị” and “na-akụziri ndị mmadụ ihe” read naturally. “Guzo” adequately conveys the reported posture without making the sentence cumbersome.
  terminology: “Ndị ikom ahụ” suitably renders οἱ ἄνδρες in this contextual reference to the apostles. “Ụlọ mkpọrọ” and “ogige ụlọ nsọ” are accurate and understandable. The footnote appropriately explains that ἱερόν denotes the temple complex rather than the inner sanctuary.
