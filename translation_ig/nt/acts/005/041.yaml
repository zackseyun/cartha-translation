revisions:
- from: Ya mere, ha si n’ihu ndị ikpe ahụ pụọ, na-aṅụrị ọṅụ n’ihi na a gụrụ ha dị ka ndị kwesịrị ka e menye ha ihere n’ihi Aha ahụ.[a]
  to: Ha wee si n’ihu nzukọ ikpe ahụ pụọ, na-aṅụrị ọṅụ n’ihi na a gụrụ ha dịka ndị ruru eru ka e menye ha ihere n’ihi Aha ahụ.[a]
  rationale: The revision preserves all key source-language features while correcting the referent of συνέδριον from individual judges to the judicial council. It also improves narrative flow and the naturalness of the explanatory footnote, while retaining the source’s reverential ambiguity concerning “the Name.”
  reviewer_model: gpt-5.6-terra
