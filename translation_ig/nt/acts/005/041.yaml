  text: οἱ μὲν οὖν ἐπορεύοντο χαίροντες ἀπὸ προσώπου τοῦ συνεδρίου ὅτι ⸂κατηξιώθησαν ὑπὲρ τοῦ ὀνόματος⸃ ἀτιμασθῆναι·
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/041.yaml
  text: So they went on their way from the presence of the council[a], rejoicing that they had been counted worthy to be dishonored for the Name.
translation:
  language: ig
  text: Ha wee si n’ihu nzukọ ikpe ahụ pụọ, na-aṅụrị ọṅụ n’ihi na a gụrụ ha dịka ndị ruru eru ka e menye ha ihere n’ihi Aha ahụ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ, “aha Jizọs.” N’asụsụ Grik: “Aha ahụ,” bụ okwu nkwanye ùgwù nke na-akpọghị onye ọ na-ezo aka na ya aha kpọmkwem.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπορεύοντο
  choice: ha ... pụọ
  rationale: N’ọnọdụ a, imperfect ahụ na-akọ mmegharị ha si n’ebe nzukọ ikpe ahụ nọ gawa; “pụọ” bụ okwu Igbo doro anya ma dabara n’usoro akụkọ.
- source_word: χαίροντες
  choice: na-aṅụrị ọṅụ
  rationale: Participle dị ugbu a na-egosi ihe ha nọ na-eme n’otu oge ahụ ha na-apụ; nkebi a na-echekwa omume na-aga n’ihu na ọṅụ ha.
- source_word: ἀπὸ προσώπου τοῦ συνεδρίου
  choice: si n’ihu ndị ikpe ahụ
  rationale: “Si n’ihu” na-anọchi idiom Grik nke pụtara isi n’ebe ndị kansụl ahụ nọ pụọ; “ndị ikpe ahụ” na-eme ka òtù ọchịchị na-ekpe ikpe a doo onye Igbo nke oge a anya.
- source_word: συνεδρίου
  choice: ndị ikpe ahụ
  rationale: N’agbanyeghị na nke a bụ Sanhedrin n’akụkọ ihe mere eme, aha nkịtị Grik na-ezo aka n’òtù na-anọkọ ikpe ikpe. Nsụgharị a na-ezere transliteration nke ọtụtụ ndị na-agụ akwụkwọ agaghị aghọta.
- source_word: κατηξιώθησαν
  choice: a gụrụ ha dị ka ndị kwesịrị
  rationale: Aorist passive na-egosi na e lere ha anya ma kpebie na ha ruru eru; “a gụrụ ha dị ka” na-echekwa passive na echiche nke ịtụle uru ha.
- source_word: ὑπὲρ
  choice: n’ihi
  rationale: N’ebe a, preposition ahụ na-egosi ihe kpatara mmechuihu ahụ ma ọ bụ ihe ọ metụtara; “n’ihi” bụ Igbo ebumpụta ụwa ma dị nkenke.
- source_word: τοῦ ὀνόματος
  choice: Aha ahụ
  rationale: Grik hapụrụ onye nwe Aha ahụ n’ekwughị ya ma jiri “Aha ahụ” dịka okwu nsọ nke na-ezo aka n’ụzọ nkwanye ùgwù. A hapụrụ ya otu ahụ iji chekwaa nghọtahie ziri ezi na ụda okwukwe nke isi mmalite.
- source_word: ἀτιμασθῆναι
  choice: ka e menye ha ihere
  rationale: Infinitive passive na-egosi na ndị ọzọ mere ha ihe na-eweta enweghị nsọpụrụ. “Menye ha ihere” bụ Igbo dị ndụ nke na-echekwa usoro nsọpụrụ/ihere dị n’okwu Grik.
theological_decisions:
- issue: Ojiji “Aha ahụ” n’enweghị ịkpọ onye nwe ya aha
  choice: E debere “Aha ahụ” n’ahịrịokwu bụ isi.
  alternative: aha Jizọs; aha ya
  rationale: τοῦ ὀνόματος bụ okwu zuru onwe ya n’asụsụ Grik. Ọnọdụ akụkọ na-egosi na ọ na-ezo aka na Jizọs, ma ịgbakwunye “Jizọs” n’ahịrịokwu bụ isi ga-akọwapụta ihe isi mmalite hapụrụ n’ụzọ nkwanye ùgwù.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị ùgwù ma dị mfe nghọta. E ji “ndị ikpe ahụ” kọwaa συνέδριον n’ụzọ onye nkịtị ga-aghọta, ebe e chekwara okwu nsọ “Aha ahụ” na ihe isi mmalite hapụrụ n’ụzọ edoghị anya.
