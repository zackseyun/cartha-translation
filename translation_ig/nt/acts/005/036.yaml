language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: πρὸ γὰρ τούτων τῶν ἡμερῶν ἀνέστη Θευδᾶς, λέγων εἶναί τινα ἑαυτόν, ᾧ ⸀προσεκλίθη ⸂ἀνδρῶν ἀριθμὸς ὡς⸃ τετρακοσίων· ὃς ἀνῃρέθη, καὶ πάντες ὅσοι ἐπείθοντο αὐτῷ διελύθησαν καὶ ἐγένοντο εἰς οὐδέν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/036.yaml
  text: For before these days Theudas rose up[a], claiming to be somebody, and a number of men, about four hundred, joined him. He was killed[c][b], and all who had been persuaded by him were scattered and came to nothing.
translation:
  language: ig
  text: N’ihi na tupu ụbọchị ndị a, Teudas biliri, na-azọrọ na ya bụ onye dị mkpa,[a] ihe dị ka ndị ikom narị anọ sonyekwara ya.[b] E gburu ya, ndị niile o mere ka ha kwenye gbasasịrị wee ghọọ ihe efu.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’ụzọ nkịtị, “na-ekwu na ya bụ otu onye.” Akpaalaokwu Grik a pụtara na o mere onwe ya onye a ga-eji kpọrọ ihe.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, “rapaara ya n’ahụ” ma ọ bụ “gbakọrọ n’akụkụ ya.”
    reason: lexical_alternative
  - marker: c
    text: A pụkwara ịsụgharị ya, “ndị niile soro ya.” N’ụzọ nkịtị, “ndị niile o mere ka ha kwenye.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸ γὰρ τούτων τῶν ἡμερῶν
  choice: N’ihi na tupu ụbọchị ndị a
  rationale: A nọgidere na njikọ nkọwa γάρ site na ‘N’ihi na,’ ebe πρό na genitive na-egosi oge bu ụzọ; ‘ụbọchị ndị a’ na-edobe demonstrative ahụ n'ụzọ doro anya.
- source_word: ἀνέστη
  choice: biliri
  rationale: N’ebe a, okwu ahụ na-egosi na Teudas pụtara dị ka onye ndu ma ọ bụ onye malitere otu, ọ bụghị mbilite n’ọnwụ nkịtị.
- source_word: Θευδᾶς
  choice: Teudas
  rationale: E depụtara aha Grik ahụ n’ụdị dabara n’usoro mkpụrụokwu Igbo.
- source_word: λέγων εἶναί τινα ἑαυτόν
  choice: na-azọrọ na ya bụ onye dị mkpa
  rationale: Nkebiokwu Grik a bụ akpaalaokwu nke na-egosi na ọ na-eme onwe ya onye a ga-eji kpọrọ ihe; nsụgharị a na-eme ka ihe ọ pụtara doo onye Igbo nke oge a anya.
- source_word: ᾧ προσεκλίθη
  choice: sonyekwara ya
  rationale: Ọ na-egosi ịrapara n’akụkụ onye ndu ma sonyere òtù ya; ‘sonyekwara ya’ bụ okwu Igbo dị mfe ma kwekọọ na ọnọdụ a.
- source_word: ἀνδρῶν ἀριθμὸς ὡς τετρακοσίων
  choice: ihe dị ka narị ndị ikom anọ
  rationale: ὡς na-egosi atụmatụ ọnụ ọgụgụ, ἀνδρῶν pedigosi kpọmkwem ndị ikom; e debere ha abụọ.
- source_word: ὃς ἀνῃρέθη
  choice: E gburu ya
  rationale: ἀναιρέω pụtara igbu ma ọ bụ iwepụ ndụ n’ọnọdụ a; passive ahụ ka e debere.
- source_word: πάντες ὅσοι ἐπείθοντο αὐτῷ
  choice: ndị niile o mere ka ha kwere ya
  rationale: Nke a na-edobe echiche πείθω nke ịbụ ndị e mere ka ha kwenye, kama ime ka ọ bụrụ naanị ‘ndị na-eso ya.’
- source_word: διελύθησαν
  choice: gbasasịrị
  rationale: Okwu a na-egosi na ndị òtù ahụ gbasara, òtù ahụ wee tisaa.
- source_word: ἐγένοντο εἰς οὐδέν
  choice: ihe niile ahụ wee ghọọ ihe efu
  rationale: Nke a bụ ụzọ Igbo sitere n’okike si kwuo na mmegharị ahụ dara kpamkpam ma ghara ịmịpụta ihe.
theological_decisions:
- issue: Akụkọ banyere Teudas dị n’okwu Gamaliel
  choice: E sụgharịrị ya n’ụzọ kwụ ọtọ dịka ihe atụ Gamaliel jiri kwado arụmụka ya.
  alternative: Ịtinye okwu na-egosi na akụkọ ahụ edoghị anya, ma ọ bụ ịgbanwe ya iji kwekọọ na mwughachi akụkọ ihe mere eme sitere n’èzí.
  rationale: Ihe odide Grik na-enye akụkọ a dịka akụkụ nke okwu Gamaliel. Nsụgharị ekwesịghị ịgbakwunye mkpebi banyere eziokwu akụkọ ahụ ma ọ bụ mee ka esemokwu akụkọ ihe mere eme kwụsị n’ime ederede.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A zere akpaalaokwu Bekee kpọmkwem, ma e debere njikọ arụmụka, ịbụ passive, atụmatụ ọnụ ọgụgụ, na nkọwa kpọmkwem na ndị ahụ bụ ndị ikom.
