revisions:
- from: N’ihi na tupu ụbọchị ndị a, Teudas biliri, na-azọrọ na ya bụ onye dị mkpa,[a] ihe dị ka narị ndị ikom anọ sonyekwara ya.[b] E gburu ya, ndị niile o mere ka ha kwere ya[c] gbasasịrị, ihe niile ahụ wee ghọọ ihe efu.
  to: N’ihi na tupu ụbọchị ndị a, Teudas biliri, na-azọrọ na ya bụ onye dị mkpa,[a] ihe dị ka ndị ikom narị anọ sonyekwara ya.[b] E gburu ya, ndị niile o mere ka ha kwenye gbasasịrị wee ghọọ ihe efu.[c]
  rationale: The revision corrects the final clause’s subject so that the people persuaded by Theudas are both scattered and brought to nothing, as in the Greek. It also improves the idiomatic order of the approximate male headcount. No historical harmonization or doctrinal interpretation has been added.
  reviewer_model: gpt-5.6-terra
