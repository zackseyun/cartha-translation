- from: Ma Pita sịrị ya, “Gịnị mere unu ji kwekọrịta[a] ịnwale Mmụọ nke Onyenwe anyị?[b] Lee, ụkwụ ndị liri di gị nọ n’ọnụ ụzọ, ha ga-ebupụkwa gị.”
  to: Ma Pita sịrị ya, “Gịnị mere unu ji kwekọrịta[a] ịnwale Mmụọ nke Onyenwe anyị[b]? Lee, ụkwụ nke ndị liri di gị nọ n’ọnụ ụzọ, ha ga-ebupụkwa gị.”
  rationale: The revision preserves the source's wording and ambiguity while making the Greek genitive relationship in “the feet of those who buried your husband” explicit and natural in Standard Igbo. Footnote b is moved to its precise lexical referent; no theological expansion has been introduced.
