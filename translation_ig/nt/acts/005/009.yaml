id: ACT.5.9
reference: Acts 5:9
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ δὲ ⸀Πέτρος πρὸς αὐτήν· Τί ὅτι συνεφωνήθη ὑμῖν πειράσαι τὸ πνεῦμα κυρίου; ἰδοὺ οἱ πόδες τῶν θαψάντων τὸν ἄνδρα σου ἐπὶ τῇ θύρᾳ καὶ ἐξοίσουσίν σε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/009.yaml
  text: But Peter said to her[a], “Why did you agree together to test the Spirit of the Lord? Look, the feet of those who buried your husband are at the door[b], and they will carry you out.”
translation:
  language: ig
  text: Ma Pita sịrị ya, “Gịnị mere unu ji kwekọrịta[a] ịnwale Mmụọ nke Onyenwe anyị[b]? Lee, ụkwụ nke ndị liri di gị nọ n’ọnụ ụzọ, ha ga-ebupụkwa gị.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “unu gbara izu ọnụ.”
    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ, “Mmụọ Onyenwe anyị.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί ὅτι
  choice: Gịnị mere
  rationale: Nke a na-enye ajụjụ ịba mba ahụ n’Igbo nkịtị ma doo anya.
- source_word: συνεφωνήθη ὑμῖν
  choice: unu ji kwekọrịta
  rationale: Ụdị okwu a na-egosi nkwekọrịta ha abụọ; nnọchiaha ọtụtụ ‘unu’ na-echekwa ὑμῖν n’agbanyeghị na Pita na-agwa Safaịra okwu ozugbo.
- source_word: πειράσαι
  choice: ịnwale
  rationale: ‘Ịnwale’ na-egosipụta itinye Mmụọ Onyenwe anyị n’ule, na-enweghị echiche ‘ịnwa ọnwụnwa’ nke nwere ike iduhie ebe a.
- source_word: τὸ πνεῦμα κυρίου
  choice: Mmụọ nke Onyenwe anyị
  rationale: Nke a na-echekwa njikọ genitiv ahụ n’ụzọ doro anya ma ghara ịgbasa ya ka ọ bụrụ ‘Mmụọ Nsọ’ n’agbanyeghị na nke ahụ bụ onye a na-atụ aka na ya n’akụkọ a.
- source_word: ἰδοὺ
  choice: Lee
  rationale: ‘Lee’ bụ okwu Igbo dị ndụ nke na-adọta uche n’ihe na-eme ozugbo.
- source_word: οἱ πόδες τῶν θαψάντων
  choice: ụkwụ ndị liri
  rationale: A hapụrụ ihe oyiyi nkịtị nke okwu Grik, ‘ụkwụ,’ kama ịgbanwe ya ka ọ bụrụ ‘ụda nzọụkwụ.’
- source_word: τὸν ἄνδρα σου
  choice: di gị
  rationale: N’ọnọdụ a ἀνήρ pụtara di Safaịra, ọ bụghị naanị nwoke.
- source_word: ἐπὶ τῇ θύρᾳ
  choice: n’ọnụ ụzọ
  rationale: Nke a na-egosi na ha erutela ebe mbata ahụ.
- source_word: ἐξοίσουσίν σε
  choice: ha ga-ebupụkwa gị
  rationale: ‘Ibupụ’ na-echekwa omume iburu ya pụọ na nkwuwa okwu dị egwu ahụ, na-etinyeghị ‘ozu gị,’ nke adịghị kpọmkwem n’ederede Grik.
theological_decisions:
- issue: Onye ‘Mmụọ nke Onyenwe anyị’ na-atụ aka na ya
  choice: E debere okwu ahụ dịka ‘Mmụọ nke Onyenwe anyị,’ nke n’ọnọdụ Ọrụ Ndị Ozi 5 na-atụ aka na Mmụọ Nsọ.
  alternative: Ịkọwa ya ozugbo dịka ‘Mmụọ Nsọ’ ma ọ bụ dịka ọnụnọ ime mmụọ nke Onyenwe anyị n’ozuzu.
  rationale: Ọrụ Ndị Ozi 5:3 na-akwado na ọ bụ Mmụọ Nsọ ka a na-ekwu maka ya, ma ntụgharị ahụ anaghị etinye okwu ‘Nsọ’ nke na-adịghị na amaokwu Grik a.
- issue: Ike ebubo Pita
  choice: ‘unu ji kwekọrịta’
  alternative: ‘unu gbara izu’
  rationale: συμφωνέω pụtara ikwekọrịta. Ọnọdụ akụkọ ahụ na-egosi na nkwekọrịta ahụ bụ nke ọjọọ, ma e kwesịghị itinye ike nkọwa ‘ịgba izu’ n’ime ngwaa ahụ n’akwụkwọ isi.
translation_notes:
  register: 'Ejiri Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. E debere mgbanwe dị n’etiti ‘gị’ na ‘unu’: Pita na-agwa Safaịra okwu, ma ‘unu’ na-ezo aka na nkwekọrịta ya na di ya. E dozikwara ebe akara nkọwa ala peeji dị ka ihe okwu nke ọ bụla na-akọwa si dị.'
