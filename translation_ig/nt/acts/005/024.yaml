id: ACT.5.24
reference: Acts 5:24
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὡς δὲ ἤκουσαν τοὺς λόγους τούτους ὅ ⸀τε στρατηγὸς τοῦ ἱεροῦ καὶ οἱ ἀρχιερεῖς, διηπόρουν περὶ αὐτῶν τί ἂν γένοιτο τοῦτο.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/024.yaml
  text: When the captain of the temple and the chief priests heard these words[a], they were perplexed about them, wondering what this might come to.
translation:
  language: ig
  text: Mgbe onyeisi ndị nche ụlọ nsọ na ndị isi nchụàjà nụrụ okwu ndị a, ha gbagwojuru anya nke ukwuu banyere ha, na-atụgharị uche ihe ga-esi n’ihe a pụta.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “ihe ihe a ga-emesị bụrụ.” Okwu Grik a na-ajụ banyere njedebe ma ọ bụ ihe ga-esi n’ọnọdụ ahụ pụta.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ
  choice: Mgbe
  rationale: Ọ na-ewebata ihe mere na-esote dị ka nkebi oge; Igbo na-egosipụta njikọ ahụ nke ọma n’enweghị itinye okwu ọzọ na-adịghị mkpa.
- source_word: ἤκουσαν
  choice: nụrụ
  rationale: Nke a bụ okwu Igbo nkịtị ma doo anya maka ịnụ ozi e kwuru.
- source_word: τοὺς λόγους τούτους
  choice: okwu ndị a
  rationale: Ọ na-anọgide nso n'ụdị Grik ma nwee ike ịpụta okwu ma ọ bụ ozi a ka kọọrọ ha.
- source_word: ὅ τε στρατηγὸς τοῦ ἱεροῦ
  choice: onyeisi ndị nche ụlọ nsọ
  rationale: στρατηγός bụ onyeisi nwere ikike n’ọrụ nche ụlọ nsọ; nsụgharị a na-eme ka ọrụ ya doo onye Igbo nke oge a anya n’enweghị ịkpọ ya onyeisi agha n’ozuzu.
- source_word: οἱ ἀρχιερεῖς
  choice: ndị isi nchụàjà
  rationale: N’ọnọdụ a, ọtụtụ okwu ahụ na-ezo aka n’ọchịchị ndị nchụàjà kachasị elu, ọ bụghị na e nwere ọtụtụ ndị isi nchụàjà na-achị otu oge.
- source_word: διηπόρουν
  choice: ihe a gbagwojuru ha anya nke ukwuu
  rationale: Ọ na-egosipụta mgbagwoju anya na enweghị ike ịmata ihe ga-eme; okwu ‘nke ukwuu’ na-ebupụta ike dị n’ụdị διαπορέω.
- source_word: περὶ αὐτῶν
  choice: ihe a
  rationale: N’Igbo, ntụaka a na-alaghachi n’ozi na ọnọdụ ahụ dum n’ụzọ eke; iji nnọchiaha ọtụtụ kpọmkwem ga-ada mgbagwoju anya.
- source_word: τί ἂν γένοιτο τοῦτο
  choice: ihe ihe a ga-emesị bụrụ
  rationale: Ọ na-echekwa ajụjụ banyere njedebe ma ọ bụ ihe ga-esi n’ọnọdụ ahụ pụta, tinyere ejighị n'aka nke ἄν na optative.
theological_decisions:
- issue: Ihe περὶ αὐτῶν na-ezo aka na ya
  choice: E debere ya dị ka ntụaka sara mbara nye ozi na ọnọdụ ahụ dum.
  alternative: Ịkọwa ya kpọmkwem dị ka ‘banyere ndịozi ahụ’ ma ọ bụ ‘banyere okwu ndị ahụ.’
  rationale: Grik nwere ike ịlaghachi n’okwu a nụrụ ma ọ bụ n’ihe ndị a kọrọ; nsụgharị ekwesịghị idozi ntụaka ahụ karịa ihe isi mmalite kwadoro.
translation_notes:
  register: Asụsụ Igbo izugbe, nke oge a ma dị ùgwù. E ji ‘ụlọ nsọ’ mee ἱερόν, ‘ndị isi nchụàjà’ mee ἀρχιερεῖς, ma zere okwu ụka pụrụ iche nke otu denomination. Akara nkọwa ala [a] pụtara n’ederede isi.
