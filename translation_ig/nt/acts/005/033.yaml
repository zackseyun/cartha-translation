  text: Οἱ δὲ ⸀ἀκούσαντες διεπρίοντο καὶ ἐβούλοντο ἀνελεῖν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/033.yaml
  text: But when they heard this, they were enraged and wanted to kill them.
translation:
  language: ig
  text: Ma mgbe ha nụrụ ihe a, iwe were ha nke ukwuu[a], ha wee chọọ igbu ha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N'ụzọ nkịtị karị, “a na-adọwa ha abụọ”; ọ na-egosi oke iwe na mkpali imegide.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἱ δὲ
  choice: Ma ... ha
  rationale: A sụgharịrị δέ dị ka “Ma” iji gosi ngbanwe akụkọ ahụ site n'okwu ndịozi gaa n'ihe ndị kansụl mere; “ha” na-anọchi ndị a kpọtụrụ aha n'amaokwu ndị bu ụzọ.
- source_word: ἀκούσαντες
  choice: mgbe ha nụrụ ihe a
  rationale: Nkebi-ngwaa aorist a na-egosi oge; “ihe a” na-ezo aka n'okwu ndịozi ha ka nụrụ.
- source_word: διεπρίοντο
  choice: iwe were ha nke ukwuu[a]
  rationale: Ngwaa ahụ na-ese onyinyo ịbụ ndị a wara ma ọ bụ ndị ihe mapụrụ n'ime, ma n'ebe a ọ na-egosi oke iwe na mkpali ọjọọ. Nsụgharị a na-eme ka ihe ọ pụtara n'ọnọdụ a doo onye Igbo nke oge a anya, ebe nkọwa ala peeji na-echekwa onyinyo okwu Grik ahụ.
- source_word: ἐβούλοντο
  choice: ha wee chọọ
  rationale: Imperfect ahụ na-egosi ọchịchọ ma ọ bụ ebumnuche ha nwere n'oge ahụ; “chọọ” bụ okwu Igbo dị n'okike ma ghara ime ka ike ebumnuche ahụ karịa nke isi mmalite.
- source_word: ἀνελεῖν
  choice: igbu
  rationale: N'ọnọdụ a, ἀναιρέω pụtara iwepụ ndụ mmadụ; “igbu” bụ nsụgharị doro anya ma kwụ ọtọ.
- source_word: αὐτούς
  choice: ha
  rationale: Nnọchiaha ahụ na-ezo aka n'ebe ndịozi ahụ nọ.
theological_decisions:
- issue: Ma διεπρίοντο ọ̀ na-egosi nchegharị nke obi ka ọ bụ iwe ọjọọ
  choice: 'E gosipụtara ya dị ka oke iwe: “iwe were ha nke ukwuu.”'
  alternative: “o ruru ha n'obi” ma ọ bụ “a wara ha n'obi.”
  rationale: Ọnọdụ akụkọ ahụ—ọchịchọ ha igbu ndịozi—na-egosi mmeghachi omume nke iwe na mmegide, ọ bụghị nchegharị. Nkọwa ala peeji ka na-echekwa ihe atụ nkịtị nke ngwaa Grik ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. “Iwe were ha nke ukwuu” bụ akpaalaokwu Igbo doro anya; e tinyere nkọwa ala peeji iji chekwaa onyinyo siri ike dị na διεπρίοντο.
