language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἶπεν δὲ ⸀ὁ Πέτρος· Ἁνανία, διὰ τί ἐπλήρωσεν ὁ Σατανᾶς τὴν καρδίαν σου, ψεύσασθαί σε τὸ πνεῦμα τὸ ἅγιον καὶ ⸀νοσφίσασθαι ἀπὸ τῆς τιμῆς τοῦ χωρίου;
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/003.yaml
  text: But Peter said[a], “Ananias[d][c][b], why has Satan filled your heart to lie to the Holy Spirit and to keep back some of the price of the land?”
translation:
  language: ig
  text: Ma Pita sịrị, “Ananayas, gịnị mere Setan ji mejupụta obi gị, ka i ghaara Mmụọ Nsọ ụgha ma zobe ụfọdụ n’ime ego e nwetara n’ire ala ahụ?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶπεν δὲ ὁ Πέτρος
  choice: Ma Pita sịrị
  rationale: δέ bụ njikọ dị nro; “Ma” dabara n’oge Pita chere Ananayas ihu ma na-ada nke ọma n’Igbo.
- source_word: διὰ τί
  choice: gịnị mere
  rationale: Nke a bụ ụzọ Igbo nkịtị na nke doro anya si ajụ ihe kpatara ihe.
- source_word: ἐπλήρωσεν ὁ Σατανᾶς τὴν καρδίαν σου
  choice: Setan ji mejupụta obi gị
  rationale: Ọ na-edobe Setan dị ka onye mere omume ahụ, na-edobekwa ihe atụ nke imeju obi, n’enweghị ịkọwa ya dị ka njide mmụọ ma ọ bụ mmanye a na-apụghị iguzogide.
- source_word: ψεύσασθαί σε τὸ πνεῦμα τὸ ἅγιον
  choice: ka i ghaara Mmụọ Nsọ ụgha
  rationale: “Ịghara mmadụ ụgha” na-egosipụta okwu ụgha a gwara onye ahụ; “ka” na-egosipụta njikọ nke infinitive ahụ na imeju obi n’Igbo eke.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: Mmụọ Nsọ
  rationale: Nke a bụ aha a na-ejikarị eme ihe n’Igbo ugbu a ma dịkwa nsọpụrụ.
- source_word: νοσφίσασθαι
  choice: zobe ụfọdụ
  rationale: Ngwaa ahụ na-ekwu maka izochiri onwe onye akụkụ ihe e kwesịrị inye; okwu a na-eme ka nzuzo dị n’omume ahụ pụta ìhè.
- source_word: ἀπὸ τῆς τιμῆς
  choice: ụfọdụ n’ego e rere
  rationale: ἀπό na genitive na-egosi akụkụ e wepụtara n’ihe dum; “ụfọdụ n’ego e rere” na-eme nke ahụ ka o doo anya n’Igbo.
- source_word: τοῦ χωρίου
  choice: ala ahụ
  rationale: χωρίον nwere ike ịbụ ibé ala, ubi, ma ọ bụ ihe onwunwe; “ala” bụ okwu eke nke na-adịghị akpa oke karịa isi mmalite.
theological_decisions:
- issue: Ọrụ Setan n’imeju obi Ananayas
  choice: E debere okwu ahụ kpọmkwem dịka “Setan ji mejupụta obi gị.”
  alternative: “Ị hapụrụ Setan ka o jupụta obi gị” ma ọ bụ “Setan achịkwala gị.”
  rationale: Greek mere Setan onye na-eme omume ahụ, ma amaokwu ahụ ka na-ewere Ananayas dịka onye nwere ibu ọrụ. Nsụgharị ahụ anaghị atụgharị nke a ka ọ bụrụ njide mmụọ zuru ezu, mmanye, ma ọ bụ ikike Ananayas nyere Setan.
- issue: Ịgha Mmụọ Nsọ ụgha
  choice: “ghaara Mmụọ Nsọ ụgha”
  alternative: “duhie Mmụọ Nsọ” ma ọ bụ “gha ụgha n’ihu Mmụọ Nsọ.”
  rationale: Nke a na-edobe ntụaka ahụ dịka okwu e kwuru megide Onye ahụ n’onwe ya, n’enweghị itinye nkọwa ozizi ọzọ.
translation_notes:
  register: Standard Igbo nke oge a, dị mfe nghọta ma nwee ugwu. E debere ihe atụ “mejupụta obi” na esemokwu gbasara ọrụ Setan na ibu ọrụ Ananayas; e tinyeghị nkọwa ụka pụrụ iche.
