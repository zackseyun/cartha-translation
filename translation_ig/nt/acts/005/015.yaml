id: ACT.5.15
reference: Acts 5:15
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὥστε ⸂καὶ εἰς⸃ τὰς πλατείας ἐκφέρειν τοὺς ἀσθενεῖς καὶ τιθέναι ἐπὶ ⸀κλιναρίων καὶ κραβάττων, ἵνα ἐρχομένου Πέτρου κἂν ἡ σκιὰ ⸀ἐπισκιάσῃ τινὶ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/015.yaml
  text: so that they even carried the sick out into the streets and laid them on cots and mats[a], so that as Peter was coming by[c][b], even his shadow might overshadow some of them.
translation:
  language: ig
  text: N’ihi ya, ha na-ebupụ ọbụna ndị ọrịa gaa n’okporo ámá[a], na-edina ha n’elu akwa nta na ute[b], ka, mgbe Pita na-agafe, ọ bụrụgodị na onyinyo ya dakwasị onye ọ bụla n’ime ha.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “gaa n’ámá ọha.” Okwu Grik bụ πλατείας nwere ike ịpụta okporo ámá sara mbara ma ọ bụ ebe ghe oghe ndị ọha na-ezukọ.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “akwa na ihe ndina ndị e ji ebu ebu.” Okwu Grik ahụ ji okwu abụọ dị iche iche kọwaa ụdị ihe ndina abụọ.
    reason: lexical_alternative
  - marker: c
    text: 'Amaokwu a na-akọ ebumnuche ndị mmadụ: ha dọbara ndị ọrịa ka, ọ bụrụgodị na onyinyo Pita dakwasị onye ọ bụla n’ime ha. N’ebe a, amaokwu ahụ ekwughị kpọmkwem na onyinyo ahụ n’onwe ya gwọrọ ha.'
    reason: theological_clarification
lexical_decisions:
- source_word: ὥστε
  choice: N’ihi ya
  rationale: Na-egosi ihe omume a dịka ihe si n’ihe ndị a kọrọ n’amaokwu ndị bu ya ụzọ pụta.
- source_word: καὶ εἰς τὰς πλατείας
  choice: ọbụna ... gaa n’okporo ámá
  rationale: “Ọbụna” na-egosipụta nkwusi ike dị na καί, ebe “okporo ámá” bụ okwu ndị mmadụ na-aghọta nke ọma maka πλατεῖαι; ihe odide ala peeji na-edebe ihe ọzọ okwu ahụ nwere ike ịpụta.
- source_word: ἐκφέρειν
  choice: na-ebupụ
  rationale: Na-egosi ibupụta ndị ọrịa site n’ụlọ ma ọ bụ n’ebe ọzọ gaa n’ebe ọha na-ahụ ha.
- source_word: τοὺς ἀσθενεῖς
  choice: ndị ọrịa
  rationale: N’ọnọdụ akụkọ ọgwụgwọ a, okwu Grik ahụ na-ezo aka n’ahụ́ adịghị ndị mmadụ.
- source_word: τιθέναι
  choice: na-edina ha
  rationale: Ọ bụ ụzọ Igbo si ekwu n’ụzọ ebumpụta ụwa banyere idowe ndị ọrịa n’elu ihe ha ga-edina.
- source_word: ἐπὶ κλιναρίων καὶ κραβάττων
  choice: n’elu akwa nta na ute
  rationale: Na-edebe ụdị ihe ndina abụọ dị iche iche okwu Grik abụọ ahụ na-egosi, ma jiri okwu Igbo dị mfe nghọta.
- source_word: ἵνα
  choice: ka
  rationale: Na-egosipụta ebumnuche ndị mmadụ ji dọba ndị ọrịa n’ebe ahụ.
- source_word: ἐρχομένου Πέτρου
  choice: mgbe Pita na-agafe
  rationale: Na-egosipụta mmegharị Pita ka ọ na-agafe n’akụkụ ebe ha nọ, dịka genitive absolute ahụ si kwuo.
- source_word: κἂν
  choice: ọbụna
  rationale: Na-egosipụta olileanya na ihe kacha nta—ọbụna naanị onyinyo Pita—ga-erute onye n’ime ha.
- source_word: σκιὰ
  choice: onyinyo
  rationale: Ọ bụ ntụgharị nkịtị na nke ziri ezi; ihe a na-ekwu abụghị ihe atụ.
- source_word: ἐπισκιάσῃ
  choice: wee kpuchie
  rationale: Na-egosipụta onyinyo ịdakwasị ma ọ bụ ikpuchi mmadụ, ma na-edebe ọnọdụ nke ihe ha tụrụ anya ya kama ikwu na o mere n’ezie.
- source_word: τινὶ αὐτῶν
  choice: ụfọdụ n’ime ha
  rationale: Na-egosi onye ọ bụla ma ọ bụ ụfọdụ n’etiti ndị ọrịa ahụ, n’Igbo na-aga were were.
theological_decisions:
- issue: Ma amaokwu a ò kwuru na onyinyo Pita n’onwe ya nwere ike ịgwọ ọrịa
  choice: 'E dere ya dịka ebumnuche na olileanya ndị mmadụ: ha chọrọ ka onyinyo Pita kpuchie ụfọdụ ndị ọrịa.'
  alternative: Iji okwu ga-ekwusi ike na onyinyo ahụ n’onwe ya gwọrọ ndị ọrịa.
  rationale: ἵνα tinyere subjunctive na-akọ ihe ndị mmadụ zubere ma tụọ anya ya. Amaokwu a n’onwe ya ekwughị kpọmkwem na onyinyo ahụ gwọrọ onye ọ bụla, ọ bụ ezie na ọnọdụ gbara ya gburugburu na-akọ ọtụtụ ọgwụgwọ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. E zere okwu ụka pụrụ iche na nkwubi okwu karịrị ihe ederede Grik kwuru; a hapụrụ olileanya ndị mmadụ na ajụjụ banyere ihe onyinyo ahụ mere dịka akụkọ ahụ si hapụ ha.
