revisions:
- from: N’ihi ya, ha na-ebupụ ọbụna ndị ọrịa gaa n’okporo ámá[a], na-edina ha n’elu akwa nta na ute[b], ka mgbe Pita na-agafe, ọbụna onyinyo ya wee kpuchie ụfọdụ n’ime ha.[c]
  to: N’ihi ya, ha na-ebupụ ọbụna ndị ọrịa gaa n’okporo ámá[a], na-edina ha n’elu akwa nta na ute[b], ka, mgbe Pita na-agafe, ọ bụrụgodị na onyinyo ya dakwasị onye ọ bụla n’ime ha.[c]
  rationale: The revision retains the source's consecutive setting and public placement of the sick, while making the final purpose clause idiomatic in Standard Igbo. It preserves the force of κἄν ('even if') and the singular indefinite τινί ('any one person'), and it does not imply that Peter's shadow actually healed anyone in this verse.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T08:28:17Z'
review_pass:
  verdict: revise
  source_fidelity: 'The draft conveys the sick being brought into public spaces and placed on bedding, but its final clause weakens two source details: κἄν τινι is singular and indefinite (''even if/on any one of them''), not ''some of them''; and ''wee kpuchie'' can sound like an asserted subsequent event rather than the intended possibility expressed by ἵνα with the subjunctive.'
  naturalness: The main sentence is generally clear Standard Igbo. However, 'ka mgbe Pita na-agafe, ọbụna onyinyo ya wee kpuchie...' is syntactically strained. A conditional formulation is natural and accurately conveys the minimal hoped-for result.
  terminology: '''Ndị ọrịa,'' ''okporo ámá,'' ''akwa nta,'' ''ute,'' and ''onyinyo'' are appropriate. ''Dakwasị'' is more idiomatic for a shadow falling upon someone than ''kpuchie,'' while avoiding any claim that healing occurred.'
  issues:
  - severity: medium
    issue: τινὶ αὐτῶν is rendered 'ụfọdụ n’ime ha.'
    rationale: 'The Greek has singular indefinite τινί: the hoped-for outcome concerns even any one individual among them, not a plural subset.'
  - severity: medium
    issue: The purpose/possibility in the final clause is not clearly retained.
    rationale: The combination 'ka ... wee kpuchie' may be read as a sequence or outcome. 'Ọ bụrụgodị na ... dakwasị onye ọ bụla n’ime ha' explicitly preserves κἄν and the subjunctive's minimal hoped-for possibility.
  - severity: low
    issue: Footnote c repeats the plural implication.
    rationale: Its wording should likewise refer to a person among them and should use the same natural shadow expression as the revised text.
  revised_text: N’ihi ya, ha na-ebupụ ọbụna ndị ọrịa gaa n’okporo ámá[a], na-edina ha n’elu akwa nta na ute[b], ka, mgbe Pita na-agafe, ọ bụrụgodị na onyinyo ya dakwasị onye ọ bụla n’ime ha.[c]
