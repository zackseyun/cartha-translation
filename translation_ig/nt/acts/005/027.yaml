  text: Ἀγαγόντες δὲ αὐτοὺς ἔστησαν ἐν τῷ συνεδρίῳ. καὶ ἐπηρώτησεν αὐτοὺς ὁ ἀρχιερεὺς
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/027.yaml
  text: After bringing them in, they stood them before the council, and the high priest questioned them.
translation:
  language: ig
  text: Mgbe ha kpọbatara ha, ha mere ka ha guzo n’ihu kansụl ahụ[a], nnukwu onye nchụaja ahụ wee jụọ ha ajụjụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Sanhedrin.” Okwu Grik συνέδριον na-ezo aka na kansụl ọchịchị na-ekpe ikpe nke ndị Juu.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀγαγόντες
  choice: Mgbe ha kpọbatara ha
  rationale: Aorist participle a na-egosi ihe mere tupu ngwaa bụ isi. Nkebiokwu a na-egosi usoro ihe omume ahụ n’Igbo doro anya ma dịkwa mfe.
- source_word: δὲ
  choice: —
  rationale: Ọ bụ njikọ dị nro nke na-akwalite akụkọ ahụ. Ọ dịghị mkpa ịtụgharị ya iche n’Igbo ebe usoro ahịrịokwu ahụ na-egosilarị njikọ ahụ.
- source_word: ἔστησαν
  choice: ha mere ka ha guzo n’ihu
  rationale: Nke a na-echekwa echiche transitive nke ἵστημι, ya bụ ime ka mmadụ guzo ma ọ bụ idobe ya n’ihu ndị na-ekpe ikpe.
- source_word: ἐν τῷ συνεδρίῳ
  choice: n’ihu ndị kansụl[a]
  rationale: συνέδριον na-ezo aka n’òtù ọchịchị na-ekpe ikpe nke ndị Juu. ‘N’ihu ndị kansụl’ bụ okwu Igbo kwụ ọtọ maka ọnọdụ ikpe a; ihe odide ala ala kọwara aha ọdịnala ‘Sanhedrin.’
- source_word: ἐπηρώτησεν
  choice: jụọ ha ajụjụ
  rationale: N’ọnọdụ ikpe a, okwu a na-egosi ịjụ mmadụ ajụjụ n’ụzọ iwu kwadoro, na-enweghị ime ka ike okwu ahụ karịa nke Grik.
- source_word: ὁ ἀρχιερεὺς
  choice: Onyeisi nchụaja
  rationale: Nke a bụ okwu Igbo doro anya maka nnukwu onye nchụaja na-achị ndị nchụaja n’ọnọdụ a.
theological_decisions:
- issue: Otu e si sụgharịa συνέδριον
  choice: ndị kansụl
  alternative: Sanhedrin
  rationale: Isi ederede sụgharịrị ihe okwu Grik pụtara kama iji naanị aha ọdịnala a na-edeghị n’Igbo. Ihe odide ala ala na-echekwa ‘Sanhedrin’ dị ka ụzọ ọzọ ma kọwaa onye okwu ahụ na-ezo aka.
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E ji ‘mere ka ha guzo n’ihu’ chekwaa ihe oyiyi ụlọikpe dị na Grik, ebe ‘ndị kansụl’ na-egosi òtù ahụ kama ụlọ ha nọ n’ime ya.
