    reason: alternative_reading
  revision_rationale: The revision corrects the singular/definite reference to the council, retains the courtroom presentation imagery, and uses the more precise Standard Igbo expression for “the high priest.” The footnote remains anchored to the term it explains and preserves the traditional alternative without imposing it in the main text.
