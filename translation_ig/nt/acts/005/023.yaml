    text: Ma ọ bụ, “a kpọchiri ya n’ụzọ zuru oke ka ọ dị nchebe.” Okwu Grik ahụ na-emesi ike na a hụrụ ụlọ mkpọrọ ahụ ka a kpọchiri ma chebe ya nke ọma.
    reason: lexical_alternative
