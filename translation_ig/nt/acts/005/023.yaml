revisions:
- from: na-asị, “Anyị hụrụ na e mechiri ụlọ mkpọrọ ahụ nke ọma, ka ọ dị nnọọ nchebe[a], ndị nche na-eguzokwa n’ọnụ ụzọ ya; ma mgbe anyị meghere ọnụ ụzọ ya, anyị ahụghị onye ọ bụla n’ime ya.”
  to: na-asị, “Anyị hụrụ ụlọ mkpọrọ ahụ ka a kpọchiri ya nke ọma[a], ndị nche na-eguzo n’ọnụ ụzọ ya; ma mgbe anyị meghere ọnụ ụzọ ndị ahụ, anyị ahụghị onye ọ bụla n’ime ụlọ mkpọrọ ahụ.”
  rationale: The revision replaces an unnatural, repetitive security clause with idiomatic Igbo that retains the Greek perfect-state sense of a securely locked prison. It retains the contextual rendering of the unstated object of “opened” as the doors, and clarifies that no one was found inside the prison.
