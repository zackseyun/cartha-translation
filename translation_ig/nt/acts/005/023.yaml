source:
  edition: SBLGNT
  text: λέγοντες ὅτι ⸀Τὸ δεσμωτήριον εὕρομεν κεκλεισμένον ἐν πάσῃ ἀσφαλείᾳ καὶ τοὺς φύλακας ἑστῶτας ⸀ἐπὶ τῶν θυρῶν, ἀνοίξαντες δὲ ἔσω οὐδένα εὕρομεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/023.yaml
  text: saying[a], “We found the prison securely locked, and the guards standing at the doors; but when we opened it, we found no one inside.”
translation:
  language: ig
  text: na-asị, “Anyị hụrụ ụlọ mkpọrọ ahụ ka a kpọchiri ya nke ọma[a], ndị nche na-eguzo n’ọnụ ụzọ ya; ma mgbe anyị meghere ọnụ ụzọ ndị ahụ, anyị ahụghị onye ọ bụla n’ime ụlọ mkpọrọ ahụ.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “a kpọchiri ya n’ụzọ zuru oke ka ọ dị nchebe.” Okwu Grik ahụ na-emesi ike na a hụrụ ụlọ mkpọrọ ahụ ka a kpọchiri ma chebe ya nke ọma.
    reason: lexical_alternative
lexical_decisions:
- source_word: δεσμωτήριον
  choice: ụlọ mkpọrọ
  rationale: Nke a bụ okwu Igbo a na-ejikarị eme ihe maka ebe a na-ejide ndị mkpọrọ, ọ dabakwara n’akụkọ a.
- source_word: κεκλεισμένον ἐν πάσῃ ἀσφαλείᾳ
  choice: e mechiri ... nke ọma, ka ọ dị nnọọ nchebe
  rationale: Ụdị participle ahụ na-egosi na a ka hụrụ ya n’ọnọdụ e mechiri emechi; ἐν πάσῃ ἀσφαλείᾳ na-emesi ike na e mere ka ebe ahụ dị nchebe nke ukwuu.
- source_word: φύλακας ἑστῶτας
  choice: ndị nche na-eguzo
  rationale: Ọ na-echekwa ihe oyiyi ndị nche nọ n’ebe ha guzo n’akọwaghị karịa ihe Grik kwuru.
- source_word: ἐπὶ τῶν θυρῶν
  choice: n’ọnụ ụzọ ya
  rationale: N’ebe a, ἐπί na-egosi ebe dị n’akụkụ ọnụ ụzọ; Igbo a bụ nke nkịtị ma doo anya.
- source_word: ἀνοίξαντες
  choice: mgbe anyị meghere ọnụ ụzọ ya
  rationale: A sụgharịrị participle a dị ka nkebiokwu oge. Ọ bụ ezie na Grik ekwughị ihe a meghere ọzọ, ‘ọnụ ụzọ’ sitere n’okwu bu ya ụzọ ma mee ka Igbo doo anya.
- source_word: ἔσω
  choice: n’ime ya
  rationale: Ọ na-egosi ime ụlọ mkpọrọ ahụ n’ụzọ doro anya ma bụrụ Igbo nkịtị.
- source_word: οὐδένα
  choice: onye ọ bụla ... ahụghị
  rationale: Nhazi a bụ ụzọ Igbo nkịtị si kwuo na ha ahụghị mmadụ ọbụla.
- source_word: λέγοντες ὅτι
  choice: na-asị, “
  rationale: Ọ na-ejikọta amaokwu a na ndị ozi a kpọtụrụ aha n’amaokwu bu ya ụzọ ma webata okwu ha kpọmkwem.
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. A hapụrụ ọdịdị akụkọ ahụ n’okwu kpọmkwem, tinyekwa ihe oyiyi ndị nche guzo n’ọnụ ụzọ.
