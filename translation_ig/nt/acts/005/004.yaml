id: ACT.5.4
reference: Acts 5:4
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οὐχὶ μένον σοὶ ἔμενεν καὶ πραθὲν ἐν τῇ σῇ ἐξουσίᾳ ὑπῆρχεν; τί ὅτι ἔθου ἐν τῇ καρδίᾳ σου τὸ πρᾶγμα τοῦτο; οὐκ ἐψεύσω ἀνθρώποις ἀλλὰ τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/004.yaml
  text: While it remained unsold[a], did it not remain yours? And after it was sold[b], was it not under your authority? Why is it that you have set this matter in your heart? You have not lied to men but to God.
translation:
  language: ig
  text: Mgbe ọ ka dị n'aka gị, ọ̀ nọgideghị bụrụ nke gị? Mgbe e resịrị ya, ego e retara n'ire ya, ọ̀ nọghị n'okpuru ikike gị? Gịnị mere i ji tinye ihe a n'obi gị? Ọ bụghị ụmụ mmadụ ka ị ghaara ụgha, kama ọ bụ Chineke.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μένον / ἔμενεν
  choice: Mgbe ala ahụ ka dị, ọ̀ bụ na ọ bụghị nke gị?
  rationale: E jigidere nkwughachi echiche nke μένω na ọnọdụ ihe onwunwe tupu ere ya. A kpọrọ ya “ala ahụ” n'ihi ihe a na-ekwu maka ya n'amaokwu ndị gbara ya gburugburu, ka Igbo wee bụrụ nke doro anya ma dị ndụ.
- source_word: σοὶ
  choice: nke gị
  rationale: Dative a na-egosi na ihe ahụ bụ nke Ananayas; “nke gị” bụ ụzọ Igbo nkịtị si egosipụta nke a.
- source_word: πραθὲν
  choice: mgbe e rekwara ya
  rationale: Nke a na-echekwa passive participle na usoro oge ya, ma na-ada nke ọma n'Igbo.
- source_word: ἐν τῇ σῇ ἐξουσίᾳ ὑπῆρχεν
  choice: ego ya anọghị n'okpuru ikike gị?
  rationale: ἐξουσία pụtara ikike ma ọ bụ ikike ime mkpebi. “N'okpuru ikike gị” na-egosi na Ananayas ka nwere ikike ikpebi ihe ọ ga-eji ego ire ahụ mee. “Ego ya” na-eme ka ihe e rere na ihe dị n'ikike ya mgbe e rere ya doo anya n'Igbo.
- source_word: τί ὅτι
  choice: Gịnị mere ...?
  rationale: Nke a bụ ajụjụ ịba mba na nyocha; “Gịnị mere” na-eburu ike ahụ n'Igbo nkịtị.
- source_word: ἔθου ἐν τῇ καρδίᾳ σου
  choice: i ji tinye ... n'obi gị
  rationale: E chekwara okwu gbasara obi na echiche nke mkpebi e mere n'ime mmadụ, n'enweghị ịkọwa ya karịa ihe Greek kwuru.
- source_word: τὸ πρᾶγμα τοῦτο
  choice: ihe a
  rationale: πρᾶγμα sara mbara; “ihe a” na-ahapụ ka ọnọdụ amaokwu kọwaa ịdị njọ ya, kama ịkpọ ya atụmatụ aghụghọ ozugbo.
- source_word: οὐκ ἐψεύσω ἀνθρώποις ἀλλὰ τῷ θεῷ
  choice: Ọ bụghị mmadụ ka ị ghaara ụgha, kama ọ bụ Chineke
  rationale: “Mmadụ” nwere ike ịpụta ụmụ mmadụ n'ozuzu ya n'Igbo, ya mere ọ dabara na ἀνθρώποις ma na-echekwa ọdịiche dị n'etiti mmadụ na Chineke.
theological_decisions:
- issue: Ihe okwu banyere Mmụọ Nsọ n'amaokwu 3 na “Chineke” n'amaokwu 4 na-egosi
  choice: A sụgharịrị τῷ θεῷ kpọmkwem dịka “Chineke,” n'enweghị mgbakwunye.
  alternative: “Chineke, ya bụ, Mmụọ Nsọ”
  rationale: Amaokwu a n'onwe ya kwuru “Chineke.” Ọnọdụ gbara ya gburugburu nwere mkpa n'ozizi banyere Chineke, ma nsụgharị ekwesịghị itinye nkọwa ahụ n'ime ederede.
- issue: Ikike Ananayas nwere n'elu ala na ego e retara
  choice: E gosipụtara na ihe ahụ bụ nke ya tupu ire ya, nakwa na ego ahụ nọ n'okpuru ikike ya mgbe e rere ya.
  alternative: Ikwupụta naanị na o nwere ihe ahụ, n'emeghị ka ikike ikpebi ihe a ga-eme pụta ìhè.
  rationale: Arụmụka Pita na-egosi na mmehie ahụ abụghị na Ananayas enyeghị ihe niile, kama na ọ ghọrọ onye ụgha. Nsụgharị a na-echekwa isi okwu ahụ n'enweghị ịgbakwunye ozizi otu ụka.
- issue: ἀνθρώποις dị ka ụmụ mmadụ n'ozuzu
  choice: “mmadụ”
  alternative: “ndị ikom” ma ọ bụ “ụmụ mmadụ”
  rationale: N'Igbo, “mmadụ” n'ụdị a bụ okwu mkpokọta nke na-agụnye mmadụ niile ma na-echekwa ọdịiche okwu ahụ na “Chineke.”
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. E debere usoro ajụjụ abụọ na nkwughachi nke Greek. Enweghị akara nkọwa ala peeji n'ihi na isi okwu ndị ahụ nwere ike ịpụta nke ọma n'Igbo n'enweghị nkọwa ọzọ.
