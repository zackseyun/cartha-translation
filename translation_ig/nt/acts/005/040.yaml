    rationale: ‘Nyerẹ ha iwu’ supplies the natural finite past verb and clearly coordinates the action with beating and release.
  - severity: low
    issue: ‘Pịara ha ihe’ is less neutral than the source wording.
    rationale: While possible, it can sound more colloquial or suggest a particular manner of beating. ‘Tiri ha ihe’ is standard, broad, and preserves δέρω without specifying flogging.
  - severity: low
    issue: The footnote’s expression ‘site n’aha Jizọs dị ka ihe ndabere’ is cumbersome Igbo.
    rationale: A smoother alternative can convey the possible ‘on the basis of/because of the name’ sense while the explanatory sentence preserves the authority nuance.
