  naturalness: ‘Ha pịara ha ihe’ is understandable, but ‘ha tiri ha ihe’ is more neutral and idiomatic Standard Igbo for δέρω. The coordinated past actions also read more naturally with finite verbs (‘nyere’) rather than ‘nye.’ ‘Kpọrọ ... ka ha bịa’ makes the summoning sense explicit.
  terminology: ‘Ndịozi’ and ‘Jizọs’ are appropriate Standard Igbo biblical terms. The footnote is revised for smoother idiom while retaining the lexical alternatives without forcing a single interpretation.
  issues:
