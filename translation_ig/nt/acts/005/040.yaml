source:
  edition: SBLGNT
  text: καὶ προσκαλεσάμενοι τοὺς ἀποστόλους δείραντες παρήγγειλαν μὴ λαλεῖν ἐπὶ τῷ ὀνόματι τοῦ Ἰησοῦ καὶ ⸀ἀπέλυσαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/040.yaml
  text: And after summoning the apostles[a], they beat them, ordered them not to speak in the name of Jesus, and released them.
translation:
  language: ig
  text: Mgbe ha kpọrọ ndịozi ahụ ka ha bịa, ha tiri ha ihe, nyere ha iwu ka ha ghara ikwu okwu n’aha Jizọs[a], ma hapụ ha ka ha laa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “banyere aha Jizọs” ma ọ bụ “n’ihi aha Jizọs.” Akpaalaokwu Grik a pụrụ ịgụnye ikwu okwu banyere Jizọs nakwa ikwu okwu n’okpuru ikike ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκαλεσάμενοι
  choice: mgbe ha kpọbatara
  rationale: Nkebi a na-egosi ihe mere tupu ngwaa ndị bụ isi; ‘mgbe ha kpọbatara’ na-egosi usoro ihe ndị ahụ n’Igbo dị mfe ma doo anya.
- source_word: ἀποστόλους
  choice: ndịozi
  rationale: ‘Ndịozi’ bụ okwu Igbo a maara nke ọma maka ndị Jizọs họpụtara ma zipụ dị ka ndị akaebe ya; ọ kapịrị ọnụ karịa ‘ndị ozi’ n’ebe a.
- source_word: δείραντες
  choice: ha pịara ha ihe
  rationale: δέρω pụtara iti mmadụ ihe ma ọ bụ pịa ya ihe. Nsụgharị a na-egosi ime ihe ike ahụ n’enweghị ịkọwa ya kpọmkwem dị ka ntaramahụhụ ụtarị nke okwu Grik ahụ n’onwe ya na-akọwaghị.
- source_word: παρήγγειλαν
  choice: nye ha iwu
  rationale: Okwu a pụtara inye iwu siri ike; ‘nye ha iwu’ bụ okwu Igbo doro anya ma kwekọọ n’ọnọdụ ndị ọchịchị na ndị mkpọrọ.
- source_word: μὴ λαλεῖν
  choice: ka ha ghara ikwu okwu
  rationale: μή tinyere infinitive na-egosi ihe a machibidoro iwu. ‘Ikwu okwu’ dabara n’ụdị asụsụ dị ùgwù ma ghara ime ka ihe ọ pụtara dị warara.
- source_word: ἐπὶ τῷ ὀνόματι τοῦ Ἰησοῦ
  choice: n’aha Jizọs
  rationale: Nkebi okwu a nwere ike ịgụnye ikwu banyere Jizọs na ikwu okwu n’okpuru ikike ya. ‘N’aha Jizọs’ na-edobe akpaalaokwu Akwụkwọ Nsọ na obosara ihe ọ pụrụ ịpụta.
- source_word: ἀπέλυσαν
  choice: hapụ ha ka ha laa
  rationale: ἀπολύω n’ebe a pụtara ịtọhapụ ndị e jidere. ‘Hapụ ha ka ha laa’ bụ Igbo ebumpụta ụwa ma na-egosi na ejighịzi ha.
theological_decisions:
- issue: Nsụgharị ἐπὶ τῷ ὀνόματι τοῦ Ἰησοῦ
  choice: n’aha Jizọs
  alternative: banyere aha Jizọs; site n’aha Jizọs dị ka ihe ndabere
  rationale: 'Nkebi ahụ nwere obosara echiche n’Ọrụ Ndịozi: ọ pụrụ izo aka n’ikwu banyere Jizọs, n’ịkpọku aha ya, ma ọ bụ n’ikwu okwu n’okpuru ikike ya. Nsụgharị bụ isi na nkọwa ala peeji na-edobe nghọta ndị a kama ịhọrọ naanị otu.'
translation_notes:
  register: Standard Igbo; asụsụ dị ugbu a, dị ùgwù, ma dị mfe nghọta. E ji ‘ndịozi’ mee ihe dị ka okwu Akwụkwọ Nsọ a maara nke ọma, ebe ‘pịara ha ihe’ na-ezere ịgbakwunye ụdị ntaramahụhụ a na-akọwaghị kpọmkwem na Grik.
