revisions:
- from: Kwa ụbọchị, n’ụlọ nsọ nakwa n’ụlọ dị iche iche, ha akwụsịghị izi ihe na ikwusa ozi ọma banyere Jizọs bụ́ Mesaya.[a]
  to: Kwa ụbọchị, n’ụlọ nsọ nakwa site n’ụlọ ruo n’ụlọ, ha akwụsịghị izi ihe na ikwusa ozi ọma na Jizọs bụ Mesaya.[a]
  rationale: The revision more clearly renders both the distributive force of κατ’ οἶκον and the messianic content of the good news. The footnote retains the more appositional/object-oriented alternative without making it the primary wording.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T08:28:29Z'
review_pass:
  verdict: revise
  source_fidelity: ‘N’ụlọ dị iche iche’ only generally suggests multiple homes; it does not clearly convey the distributive movement/activity of κατ’ οἶκον (‘from house to house’). More importantly, ‘ikwusa ozi ọma banyere Jizọs bụ́ Mesaya’ can mean good news generally concerning Jesus, whereas the Greek accusative construction presents Jesus as the Messiah as the proclamation’s content. The revision states that claim directly.
  naturalness: ‘Site n’ụlọ ruo n’ụlọ’ is a natural Standard Igbo expression for distributive house-to-house activity. ‘Ikwusa ozi ọma na Jizọs bụ Mesaya’ is clear, modern, and suitably formal in this context.
  terminology: ‘ụlọ nsọ,’ ‘izi ihe,’ ‘ikwusa ozi ọma,’ and ‘Mesaya’ are appropriate. ‘Mesaya’ correctly translates the titular force of Χριστός rather than merely transliterating it as ‘Kraịst.’
  issues:
  - severity: medium
    issue: The distributive sense of κατ’ οἶκον is understated.
    rationale: ‘N’ụlọ dị iche iche’ means ‘in different houses’ but does not clearly represent the source’s house-to-house distribution. ‘Site n’ụlọ ruo n’ụlọ’ does.
  - severity: medium
    issue: The wording ‘banyere Jizọs bụ́ Mesaya’ weakens the propositional content of the proclamation.
    rationale: It can be read broadly as good news about Jesus. In context, εὐαγγελιζόμενοι τὸν χριστὸν Ἰησοῦν proclaims Jesus as Messiah; the revised wording makes this explicit, as does the English audit trail.
  revised_text: Kwa ụbọchị, n’ụlọ nsọ nakwa site n’ụlọ ruo n’ụlọ, ha akwụsịghị izi ihe na ikwusa ozi ọma na Jizọs bụ Mesaya.[a]
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “na-ekwusa ozi ọma banyere Jizọs, bụ́ Mesaya.”
    reason: lexical_alternative
  revision_rationale: The revision more clearly renders both the distributive force of κατ’ οἶκον and the messianic content of the good news. The footnote retains the more appositional/object-oriented alternative without making it the primary wording.
