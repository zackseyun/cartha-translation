  variant: Standard Igbo
source:
  edition: SBLGNT
  text: πᾶσάν τε ἡμέραν ἐν τῷ ἱερῷ καὶ κατ’ οἶκον οὐκ ἐπαύοντο διδάσκοντες καὶ εὐαγγελιζόμενοι ⸂τὸν χριστὸν Ἰησοῦν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/042.yaml
  text: And every day[a], in the temple and from house to house, they did not stop teaching and proclaiming the good news that Jesus is the Messiah.
translation:
  language: ig
  text: Kwa ụbọchị, n’ụlọ nsọ nakwa site n’ụlọ ruo n’ụlọ, ha akwụsịghị izi ihe na ikwusa ozi ọma na Jizọs bụ Mesaya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “na-ekwusa ozi ọma banyere Jizọs, bụ́ Mesaya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶσάν τε ἡμέραν
  choice: Kwa ụbọchị
  rationale: Nke a na-egosi omume ha nọgidere na-eme ụbọchị niile, ma bụrụkwa okwu Igbo doro anya ma kwekọọ n’accusative nke oge.
- source_word: ἐν τῷ ἱερῷ
  choice: n’ụlọ nsọ
  rationale: ἱερόν na-ezo aka n’ogige na mpaghara ụlọ nsọ dum; ‘n’ụlọ nsọ’ bụ ụzọ Igbo a na-aghọta nke ọma n’enweghị ịkọwapụta ihe karịrị isi mmalite ahụ.
- source_word: κατ’ οἶκον
  choice: n’ụlọ dị iche iche
  rationale: 'κατά nwere nghọta nkesa ebe a: ọrụ ahụ na-aga n’ụlọ ndị mmadụ n’otu n’otu, ọ bụghị naanị n’ụlọ nke ha. Nhọrọ a bụ Igbo dị mfe ma dị ndụ.'
- source_word: οὐκ ἐπαύοντο
  choice: ha akwụsịghị
  rationale: Imperfect middle na-egosi na ha nọgidere na-eme ya n’akwụsịghị akwụsị; ‘ha akwụsịghị’ na-enye nghọta ahụ n’ụzọ nkịtị.
- source_word: διδάσκοντες
  choice: izi ihe
  rationale: Nke a bụ okwu Igbo a na-ejikarị akọwa ịkụziri ndị ọzọ ihe, ma na-edobe ọrụ na-aga n’ihu nke participle ahụ.
- source_word: εὐαγγελιζόμενοι
  choice: ikwusa ozi ọma
  rationale: Ọ na-egosi ịkpọsa ma ọ bụ izisa ozi ọma; okwu a doro ndị na-agụ Igbo anya ma chekwaa ike nke nkwusa ahụ.
- source_word: τὸν χριστὸν Ἰησοῦν
  choice: banyere Jizọs bụ́ Mesaya
  rationale: Nhazi Greek ahụ nwere ike ịbụ ihe a na-ekwusa banyere ya, ‘Jizọs bụ́ Mesaya,’ ma ọ bụ ọdịnaya nkwusa ahụ, ‘na Jizọs bụ Mesaya.’ Isi ederede na-edobe njikọ appositional ahụ, ebe ihe odide ala na-egosi ụzọ nke abụọ.
theological_decisions:
- issue: Nsụgharị Χριστός
  choice: Mesaya
  alternative: Kraịst
  rationale: N’ebe a Χριστός na-arụ ọrụ dị ka aha ọkwá nke Onye E Tere Mmanụ, ọ bụghị naanị aha onwe. ‘Mesaya’ na-eme ka ihe aha ọkwá ahụ pụtara pụta ìhè n’Igbo.
- issue: Ike syntactic nke τὸν χριστὸν Ἰησοῦν mgbe εὐαγγελιζόμενοι gasịrị
  choice: ikwusa ozi ọma banyere Jizọs bụ́ Mesaya
  alternative: ikwusa ozi ọma na Jizọs bụ Mesaya
  rationale: Accusative phrase ahụ pụrụ ịbụ ihe nkwusa ahụ lekwasịrị anya ma ọ bụ ọdịnaya ya. Isi ederede na-agbasochi nhazi Greek anya, ebe ihe odide ala na-echekwa nghọta predicative ahụ n’enweghị idozi ambiguity ahụ n’amaghị ama.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ ‘n’ụlọ dị iche iche’ kama okwu siri ike ma ọ bụ nke ochie iji gosipụta echiche nkesa nke κατ’ οἶκον. Akara ụda dị na ‘bụ́’ na-enyere aka igosi njikọ appositional nke ọma.
