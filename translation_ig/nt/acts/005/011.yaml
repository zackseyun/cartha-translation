id: ACT.5.11
reference: Acts 5:11
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἐγένετο φόβος μέγας ἐφ’ ὅλην τὴν ἐκκλησίαν καὶ ἐπὶ πάντας τοὺς ἀκούοντας ταῦτα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/011.yaml
  text: And great fear came upon the whole church and upon all who heard these things[a].
translation:
  language: ig
  text: Oké egwu wee dakwasị ụka ahụ dum na ndị niile nụrụ ihe ndị a.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị “ụka” dị ka “ọgbakọ” ma ọ bụ “nzukọ” (ἐκκλησία).
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: wee dakwasị
  rationale: Mgbe φόβος bụ isiokwu, okwu a na ἐπί na-egosi na egwu bịakwasịrị ma ọ bụ dakwasịrị ndị mmadụ; “wee dakwasị” bụ Igbo e ji ekwu okwu n'ụzọ ebumpụta ụwa ma na-edebe ike nke ihe ahụ mere.
- source_word: φόβος μέγας
  choice: Oké egwu
  rationale: N'ihi ikpe dakwasịrị Ananayas na Safaịra n'akụkụ akụkọ a, φόβος pụtara egwu karịa naanị nsọpụrụ; μέγας na-eme ka ọ sie ike, ya mere “oké egwu.”
- source_word: ἐφ’ ὅλην τὴν ἐκκλησίαν
  choice: dakwasị ọgbakọ Kraịst ahụ dum
  rationale: “Ọgbakọ Kraịst” na-egosi obodo ndị kwere ekwe nke ἐκκλησία na-ezo aka na ya n'Ọrụ Ndị Ozi, n'ebughị echiche ụka dị ka ụlọ; “ahụ dum” na-edebe ὅλην.
- source_word: πάντας τοὺς ἀκούοντας ταῦτα
  choice: ndị niile nụrụ ihe ndị a
  rationale: Nke a na-edebe nghọta nke participle ἀκούοντας n'ime akụkọ gara aga na ụbara nke ταῦτα, “ihe ndị a.”
theological_decisions:
- issue: Nsụgharị ἐκκλησία
  choice: ọgbakọ Kraịst
  alternative: ụka; ọgbakọ
  rationale: N'ebe a okwu ahụ na-ezo aka n'obodo ndị kwere ekwe. “Ọgbakọ Kraịst” doro onye na-agụ Igbo anya ma zere ime ka ọ bụrụ naanị ụlọ ụka; ihe odide ala peeji na-edebe ụzọ ndị ọzọ okwu Grik ahụ pụrụ isi ghọta.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji “wee dakwasị” mee ka usoro akụkọ ahụ na mmetụta mberede nke egwu ahụ pụta ìhè; e debere “ihe ndị a” n'ụbara dịka Grik si dị.
