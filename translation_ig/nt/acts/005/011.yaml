review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys that great fear came upon both the entire ἐκκλησία and all who heard these things. However, “ọgbakọ Kraịst” explicitly supplies “Christ,” which is not present in the Greek text. The immediate context identifies the community, but the translation should not add that qualifier.
  naturalness: “Oké egwu wee dakwasị …” is natural Standard Igbo and suitably reflects the narrative force. “Ụka ahụ dum” is the established, clear term for the Christian community in this context and reads more naturally than the explanatory phrase “ọgbakọ Kraịst.”
  terminology: Use “ụka” for ἐκκλησία here. It corresponds well to the referent in Acts without adding wording absent from the source. Retain a lexical-alternative footnote for “ọgbakọ” or “nzukọ.”
  issues:
  - severity: medium
    issue: The text renders ἐκκλησία as “ọgbakọ Kraịst.”
    rationale: “Kraịst” has no direct counterpart in Acts 5:11. Though the referent is the believing community, adding it narrows and expands the wording beyond the source.
  - severity: low
    issue: The footnote is framed as though “ọgbakọ Kraịst” were the base rendering.
    rationale: Once the source-faithful conventional rendering “ụka” is used in the text, the alternatives should be stated in relation to “ụka.”
  revised_text: Oké egwu wee dakwasị ụka ahụ dum na ndị niile nụrụ ihe ndị a.[a]
