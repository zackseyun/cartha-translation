- from: Oké egwu wee dakwasị ọgbakọ Kraịst ahụ dum na ndị niile nụrụ ihe ndị a.[a]
  to: Oké egwu wee dakwasị ụka ahụ dum na ndị niile nụrụ ihe ndị a.[a]
  rationale: The revision removes the added qualifier “Kraịst” while preserving the scope of “the whole” and the plural “these things.” “Ụka” is idiomatic Standard Igbo for the Christian community intended by ἐκκλησία in this context; the footnote preserves legitimate lexical alternatives without imposing a different ecclesiology.
