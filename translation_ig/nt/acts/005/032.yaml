  to: Anyị bụ ndị akaebe nke okwu ndị a[a]; Mmụọ Nsọ bụkwa onye akaebe[b], onye Chineke nyere ndị na-erubere ya isi.
  rationale: E dochiela “ihe ndị a” anya na “okwu ndị a” iji soro ῥημάτων anya nke ọma, ma debere “ihe ndị a” dịka nhọrọ ọzọ na ndetu ala. E wepụrụ “kwa” n’akụkụ “Anyị” ma debe ya n’akụkụ Mmụọ Nsọ, ka nhazi njikọ abụọ Grik na-egosi na Mmụọ Nsọ bụ onye akaebe ọzọ pụta ìhè. A hapụrụ “onye Chineke nyere ndị na-erubere ya isi” dịka o si dị, n’ihi na ọ na-asụgharị ὃ ἔδωκεν ὁ θεὸς τοῖς πειθαρχοῦσιν αὐτῷ n’enweghị mgbakwunye.
