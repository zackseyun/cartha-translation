  text: καὶ ἡμεῖς ⸀ἐσμεν μάρτυρες τῶν ῥημάτων τούτων, καὶ τὸ ⸀πνεῦμα τὸ ἅγιον ὃ ἔδωκεν ὁ θεὸς τοῖς πειθαρχοῦσιν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/032.yaml
  text: And we are witnesses of these things[a], and so is the Holy Spirit[c][b], whom God has given to those who obey him.
translation:
  language: ig
  text: Anyị bụ ndị akaebe nke okwu ndị a[a]; Mmụọ Nsọ bụkwa onye akaebe[b], onye Chineke nyere ndị na-erubere ya isi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “ihe ndị a” ma ọ bụ “okwu ndị metụtara ihe ndị a.”
    reason: lexical_alternative
  - marker: b
    text: 'N’asụsụ Grik, ọ bụ “na Mmụọ Nsọ”; a ghọtara ngwaa na nkọwa e kwuru na nkebi mbụ ka ọ na-aga n’ihu ebe a: “Mmụọ Nsọ [bụkwa onye akaebe].”'
    reason: alternative_reading
lexical_decisions:
- source_word: μάρτυρες
  choice: ndị akaebe
  rationale: Ọ bụ okwu Igbo doro anya ma bụrụkwa nke a na-ejikarị akọwa ndị na-agba akaebe banyere ihe ha maara ma ọ bụ hụrụ.
- source_word: ῥημάτων
  choice: ihe
  rationale: N'ebe a, ῥήματα na-ezo aka n'ihe omume ma ọ bụ okwu ndị a na-agba akaebe banyere ha; “ihe ndị a” bụ Igbo eke, ebe “okwu ndị a” ka bụkwa ntụgharị kwere omume.
- source_word: πνεῦμα τὸ ἅγιον
  choice: Mmụọ Nsọ
  rationale: Nke a bụ ntụgharị Igbo ọkọlọtọ, nke dị ugbu a ma kwanyere aha ahụ ùgwù.
- source_word: ὃ
  choice: onye
  rationale: Ọ bụ ezie na nnọchiaha Grik kwekọrọ n'ụdị aha πνεῦμα nke bụ neuter, “onye” na Igbo na-egosi nke ọma na ebe a a na-ekwu maka Mmụọ Nsọ dị ka onye.
- source_word: ἔδωκεν
  choice: nyere
  rationale: Oge gara aga dị mfe na Igbo na-eburu ihe aorist ahụ n'ụzọ eke, na-enweghị ịgbakwụnye nkọwa gbasara oge.
- source_word: πειθαρχοῦσιν
  choice: na-erubere ... isi
  rationale: Nkebiokwu a na-egosi nrubeisi nye onye nwere ikike, ma jikọta nke ọma na isiokwu nke irubere Chineke isi na Ọrụ Ndị Ozi 5:29.
- source_word: αὐτῷ
  choice: ya
  rationale: Nnọchiaha a na-ezo azụ n'ebe Chineke nọ ma na-echekwa njikọ nnọchiaha nke Grik.
theological_decisions:
- issue: Ma a na-egosi Mmụọ Nsọ dịka onye ya na ndị ozi na-agbakọ akaebe
  choice: “Mmụọ Nsọ bụkwa onye akaebe”
  alternative: “Mmụọ Nsọ kwa” ma ọ bụ “Mmụọ Nsọ [bụkwa onye akaebe]”
  rationale: Nkebi nke abụọ enweghị ngwaa e dere, ma ọ na-eburu predicate “bụ ndị akaebe” site na nkebi mbụ. Ikwupụta “bụkwa onye akaebe” na-eme ka Igbo doo anya na-enweghị ịgbakwụnye echiche ọhụrụ.
- issue: Ụdị nnọchiaha e ji zoo aka na Mmụọ Nsọ
  choice: “onye”
  alternative: Ụdị nnọchiaha na-abụghị nke mmadụ
  rationale: Ọ bụ ezie na ὃ bụ neuter n'ụdị n'ihi nkwekọrịta ya na πνεῦμα, ọrụ ya n'ahịrịokwu a na-ezo aka na Mmụọ Nsọ dịka onye na-agba akaebe ma bụrụ onye Chineke nyere.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke dị mfe nghọta ma dịkwa nsọpụrụ. E jiri “ndị akaebe” na “na-erubere ya isi” mee ka echiche iwu na nrubeisi dị na Grik pụta ìhè. Akara ntụaka ukwu abụọ dị n'ahịrịokwu isi.
