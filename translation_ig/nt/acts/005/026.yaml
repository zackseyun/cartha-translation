revisions:
- from: Mgbe ahụ, onyeisi ndị nche ụlọ nsọ[a] na ndị nche ya gara kpọta ha, ma ha ejighị ike mee ya, n’ihi na ha na-atụ ndị mmadụ egwu, ka a ghara iji nkume tugbuo ha.
  to: Mgbe ahụ, onyeisi ndị nche ụlọ nsọ[a] na ndị nche ya gara kpọta ha, ma ha ejighị ike mee ya, n’ihi na ha na-atụ ndị mmadụ egwu, ka a ghara iji nkume tụọ ha.
  rationale: Revised only the final verb to avoid specifying that the threatened stoning would necessarily result in death, while preserving the passive, unspecified agency, and feared-result sense of the Greek.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T08:28:18Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the temple captain’s going with subordinate officers, their bringing the apostles, the absence of force, and their fear of the people. However, “iji nkume tugbuo ha” explicitly means to kill them with stones and therefore makes the outcome more explicit than λιθασθῶσιν (“be stoned”), which does not itself state death.
  naturalness: The Standard Igbo is clear and suitably formal. “Ha ejighị ike mee ya” is natural in context, and the revised final clause remains idiomatic.
  terminology: “Onyeisi ndị nche ụlọ nsọ” appropriately identifies στρατηγός as the temple captain rather than a Roman general. “Ndị nche” is a suitable contextual rendering of ὑπηρέται. The footnote’s alternative and explanation are accurate.
  issues:
  - severity: medium
    issue: “tugbuo” adds an explicit result of death.
    rationale: The Greek λιθάζω denotes stoning but does not explicitly include “to death” in this clause. A rendering with “tụọ ... nkume” retains the threatened act without adding that result.
  revised_text: Mgbe ahụ, onyeisi ndị nche ụlọ nsọ[a] na ndị nche ya gara kpọta ha, ma ha ejighị ike mee ya, n’ihi na ha na-atụ ndị mmadụ egwu, ka a ghara iji nkume tụọ ha.
