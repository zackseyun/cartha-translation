  text: τότε ἀπελθὼν ὁ στρατηγὸς σὺν τοῖς ὑπηρέταις ⸀ἤγαγεν αὐτούς, οὐ μετὰ βίας, ἐφοβοῦντο γὰρ τὸν λαόν, ⸀μὴ λιθασθῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/026.yaml
  text: Then the captain went with the officers and brought them[a], not with force, for they were afraid of the people, lest they be stoned.
translation:
  language: ig
  text: Mgbe ahụ, onyeisi ndị nche ụlọ nsọ[a] na ndị nche ya gara kpọta ha, ma ha ejighị ike mee ya, n’ihi na ha na-atụ ndị mmadụ egwu, ka a ghara iji nkume tụọ ha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “ọchịagha.” Okwu Grik a n’ebe a na-ezo aka n’onyeisi na-ahụ maka nchekwa na usoro n’ụlọ nsọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: στρατηγὸς
  choice: onyeisi ndị nche ụlọ nsọ
  rationale: N’ebe a, okwu ahụ na-ezo aka n’onyeisi na-ahụ maka nchekwa na usoro n’ụlọ nsọ, ọ bụghị ọchịagha ndị Rom. Nsụgharị a na-eme ka ọrụ ya doo onye na-agụ Igbo anya.
- source_word: ὑπηρέταις
  choice: ndị nche ya
  rationale: Ndị a bụ ndị ọrụ nọ n’okpuru onyeisi ndị nche ma soro ya gaa kpọta ndịozi. “Ndị nche” dabara n’ọnọdụ nchekwa a karịa “ndị na-eje ozi,” nke nwere ike ịdị obosara karịa.
- source_word: ἤγαγεν αὐτούς
  choice: kpọta ha
  rationale: ἄγω nwere ike ịpụta idu ma ọ bụ ịkpọta. N’ebe a, “kpọta ha” na-egosi na ha kpọọrọ ndịozi laghachi n’ihu ndị kansụl, na-agbakwụnyeghị ebe njem ahụ kwụsịrị.
- source_word: οὐ μετὰ βίας
  choice: ha ejighị ike mee ya
  rationale: Nke a na-egosi na ha amanyeghị ndịozi ma ọ bụ jiri ihe ike mesoo ha. Ọ bụ okwu Igbo doro anya ma dịkwa n’okike.
- source_word: ἐφοβοῦντο
  choice: ha na-atụ ... egwu
  rationale: Ụdị ngwaa gara aga na-egosi egwu nọgidere n’ọnọdụ ahụ. Usoro “na-atụ egwu” na-enye echiche ahụ n’Igbo nkịtị.
- source_word: τὸν λαόν
  choice: ndị mmadụ
  rationale: Nke a na-ezo aka n’ọha ndị Juu gbakọrọ ebe ahụ. “Ndị mmadụ” bụ nsụgharị sara mbara ma kwekọọ n’okwu Grik.
- source_word: μὴ λιθασθῶσιν
  choice: ka a ghara iji nkume tugbuo ha
  rationale: Usoro a na-echekwa ihe ha tụrụ egwu nakwa ụdị okwu nke na-ekwughị kpọmkwem ndị ga-atụ nkume ahụ.
- source_word: τότε ἀπελθὼν
  choice: Mgbe ahụ ... gara
  rationale: A tụgharịrị participle ahụ dịka omume sochiri ihe gara aga n’akụkọ ahụ, nke na-eme ka Igbo ya bụrụ nke na-aga were were.
