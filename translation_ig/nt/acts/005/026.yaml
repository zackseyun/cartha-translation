translation_notes:
  register: Ejiri Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. E zere okwu agha ndị Rom maka στρατηγός, e chekwakwara na ndị mere ihe ahụ n’onwe ha ekwughị kpọmkwem n’ahịrịokwu ikpeazụ.
