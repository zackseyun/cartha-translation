id: ACT.5.29
reference: Acts 5:29
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ Πέτρος καὶ οἱ ἀπόστολοι εἶπαν· Πειθαρχεῖν δεῖ θεῷ μᾶλλον ἢ ἀνθρώποις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/029.yaml
  text: But Peter and the apostles answered[a], “We must obey God rather than men.”
translation:
  language: ig
  text: Ma Pita na ndịozi zara, sị, “Anyị aghaghị irubere Chineke isi karịa ụmụ mmadụ[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị mmadụ.” Okwu Grik ahụ na-ezo aka n’ụmụ mmadụ n’ozuzu; n’ebe a, ọ gụnyere ndị ọchịchị mmadụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς ... εἶπαν
  choice: zara, sị
  rationale: Okwu abụọ a jikọtara ọnụ bụ usoro a na-ejikarị akọwa nzaghachi. “Zara, sị” bụ ụzọ Igbo doro anya ma kwekọọ n’usoro akụkọ ahụ.
- source_word: δὲ
  choice: Ma
  rationale: Ọ na-egosi ntakịrị ngbanwe ma ọ bụ mmegide n’ihe ndị isi ahụ kwuru tupu nke a.
- source_word: Πέτρος
  choice: Pita
  rationale: Nke a bụ ụdị aha Peter a na-ejikarị n’Igbo.
- source_word: οἱ ἀπόστολοι
  choice: ndịozi
  rationale: “Ndịozi” bụ okwu Igbo a maara nke ọma maka ndị Jizọs zigara ozi, ọ bụghị nanị ndị ozi n’ozuzu.
- source_word: Πειθαρχεῖν
  choice: irubere ... isi
  rationale: Nkebiokwu a na-egosi nrubeisi nye onye nwere ikike ma bụrụkwa ụzọ Igbo ebumpụta ụwa isi kwuo “obey.”
- source_word: δεῖ
  choice: Anyị aghaghị
  rationale: Ọ na-egosi mkpa ma ọ bụ iwu dịịrị mmadụ ime ihe; “Anyị” na-eme ka onye e bu n’uche doo anya dịka okwu ndị na-ekwu ya.
- source_word: θεῷ
  choice: Chineke
  rationale: Ọ bụ onye a ga-erubere isi; ntụgharị a kwụ ọtọ ma doo anya.
- source_word: μᾶλλον ἢ
  choice: karịa
  rationale: Ọ na-edobe ntụnyere ahụ nke na-enye nrubeisi nye Chineke ọnọdụ kachasị elu mgbe ihe mmadụ nyere n’iwu na-emegide ya.
- source_word: ἀνθρώποις
  choice: ụmụ mmadụ
  rationale: Okwu Grik a na-ezo aka n’ụmụ mmadụ n’ozuzu, na-emegide Chineke. “Ụmụ mmadụ” na-ebute echiche ahụ n’Igbo n’enweghị ịgbakwunye nkọwa gbasara okike nwoke ma ọ bụ nwanyị.
theological_decisions:
- issue: Otu e si gosipụta ntụnyere nrubeisi nye Chineke na nrubeisi nye mmadụ
  choice: “irubere Chineke isi karịa ụmụ mmadụ”
  alternative: “irubere Chineke isi kama irubere ụmụ mmadụ isi”
  rationale: “Karịa” na-echekwa ọdịdị ntụnyere dị na μᾶλλον ἢ ma ghara ịkọwa ya dịka iwu zuru ụwa ọnụ ka a ghara irubere ọchịchị mmadụ isi mgbe ọ bụla. N’ọnọdụ a, okwu ahụ na-ekwu na iwu Chineke ka elu mgbe ha abụọ na-emegiderịta onwe ha.
- issue: Ihe ἀνθρώποις pụtara
  choice: ụmụ mmadụ
  alternative: ndị mmadụ
  rationale: Okwu ahụ bụ maka mmadụ n’ozuzu ha n’iche ha na Chineke, ọ bụ ezie na n’ọnọdụ akụkọ a ọ gbasara ndị ọchịchị na-enye iwu. Nhọrọ a anaghị akpọchi ihe okwu ahụ pụtara nanị n’otu ìgwè.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. “Zara, sị” na “irubere ... isi” bụ usoro okwu ebumpụta ụwa n’Igbo, ebe “aghaghị” na-egosipụta ike nke mkpa dị na δεῖ.
