base_translation:
  language: en
  yaml_path: translation/nt/acts/005/035.yaml
  text: And he said to them[a], “Men of Israel, be careful what you are about to do with these men.”
translation:
  language: ig
  text: O wee sị ha[a], “Ndị ikom Izrel, kpacharanụ anya n’ihe unu na-achọ ime ndị ikom a.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “O wee sị ha, ‘Ndị ikom Izrel, kpacharanụ anya banyere ndị ikom a n’ihe unu na-achọ ime.’”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπέν τε
  choice: O wee sị
  rationale: τέ ji nwayọọ jikọta okwu a na akụkọ bu ya ụzọ; “wee” na-egosipụta njikọ akụkọ ahụ n’Igbo n’emeghị ka ọ bụrụ nkwubi okwu siri ike.
- source_word: πρὸς αὐτούς
  choice: ha
  rationale: Mgbe πρός na-esochi ngwaa nke ikwu okwu, ọ na-egosi ndị a na-agwa okwu; “sị ha” bụ ụzọ Igbo si ekwu ya nke ọma.
- source_word: Ἄνδρες Ἰσραηλῖται
  choice: Ụmụ nwoke Izrel
  rationale: Nke a na-echekwa kpọmkwem ụdị ịkpọ ndị nwoke Izrel okwu dị na Grik, ma bụrụkwa okwu doro anya nye onye Igbo nke oge a.
- source_word: προσέχετε ἑαυτοῖς
  choice: kpacharanụ anya
  rationale: Iwu a na-adọ ndị na-ege ntị aka ná ntị ka ha nyochaa onwe ha nke ọma tupu ha emee ihe; “kpacharanụ anya” na-eburu ike ịdọ aka ná ntị ahụ n'ụzọ ebumpụta ụwa.
- source_word: ἐπὶ τοῖς ἀνθρώποις τούτοις
  choice: ndị a
  rationale: ἐπί na dative ebe a na-egosi ndị ihe a chọrọ ime metụtara. Nhazi Igbo “ihe unu na-aga ime ndị a” na-egosipụta mmekọrịta ahụ n’etinyeghị echiche nke iro nke Grik ekwughị hoo haa.
- source_word: τί μέλλετε πράσσειν
  choice: ihe unu na-aga ime
  rationale: μέλλω na infinitive na-egosi ihe a na-atụ anya ime ma ọ bụ ihe dị nso ime; “na-aga ime” na-echekwa echiche ahụ nke omume na-abịa nso.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo izugbe, nke ugwu ma dị mfe nghọta. E ji ọtụtụ “unu” mee ka iwu ahụ kwekọọ n’ìgwè ndị a na-agwa okwu; a hapụrụ okwu ahụ n’ụdị ịdọ aka ná ntị na-enweghị itinye iro ma ọ bụ nkọwa okpukpe ọzọ.
