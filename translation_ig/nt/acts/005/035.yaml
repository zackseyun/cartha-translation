  to: O wee sị ha[a], “Ndị ikom Izrel, kpacharanụ anya n’ihe unu na-achọ ime ndị ikom a.”
  rationale: The revision corrects the vocative from a term for male children/sons to one for adult men, retains the light narrative connection in “O wee sị,” and represents Gamaliel’s warning about the action they intend or are preparing to take with respect to these men. The alternative footnote preserves the possible “concerning these men” construal without forcing an adversarial sense.
