id: ACT.5.37
reference: Acts 5:37
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: μετὰ τοῦτον ἀνέστη Ἰούδας ὁ Γαλιλαῖος ἐν ταῖς ἡμέραις τῆς ἀπογραφῆς καὶ ἀπέστησε ⸀λαὸν ὀπίσω αὐτοῦ· κἀκεῖνος ἀπώλετο καὶ πάντες ὅσοι ἐπείθοντο αὐτῷ διεσκορπίσθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/037.yaml
  text: After this[a], Judas the Galilean rose up in the days of the census and drew away people after him. He also perished[b], and all who were persuaded by him were scattered.
translation:
  language: ig
  text: Mgbe nke a gasịrị, Judas onye Galili biliri n’oge a na-edeba aha ndị mmadụ[a], dọpụkwa ndị mmadụ ka ha soro ya[b]. Ya onwe ya kwa lara n’iyi, ndị niile o mere ka ha kwenye gbasasịrị.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’oge ọnụ ọgụgụ ndị mmadụ.” Okwu Grik ahụ nwere ike ịpụta ọnụ ọgụgụ ndị mmadụ ma ọ bụ ndebanye aha gọọmentị.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “mere ka ndị mmadụ hapụ ndị ha na-eso wee soro ya.” Ngwaa Grik ahụ nwere ike igosi ime ka mmadụ hapụ nrubeisi ya gara aga.
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ τοῦτον
  choice: Mgbe nke a gasịrị
  rationale: Nke a na-egosi usoro oge ma na-ezo aka n’ihe ma ọ bụ onye a kpọtụrụ aha tupu ya, n’ebughị ụzọ kpebie kpọmkwem nke ọ bụ.
- source_word: ἀνέστη
  choice: biliri
  rationale: N’ebe a, ọ pụtara na Judas pụtara dị ka onye ndu ma ọ bụ malitere ime ihe, ọ bụghị mbilite n’ọnwụ.
- source_word: Ἰούδας ὁ Γαλιλαῖος
  choice: Judas onye Galili
  rationale: Ọ bụ ụzọ Igbo doro anya isi kwuo aha ya na ebe o si.
- source_word: ἐν ταῖς ἡμέραις τῆς ἀπογραφῆς
  choice: n’oge a na-edeba aha ndị mmadụ
  rationale: ἀπογραφή nwere ike ịbụ ọnụ ọgụgụ ndị mmadụ ma ọ bụ ndebanye aha gọọmentị; okwu a na-edebe nghọta sara mbara nke okwu Grik.
- source_word: ἀπέστησε λαὸν ὀπίσω αὐτοῦ
  choice: dọpụkwa ụfọdụ ndị ka ha soro ya
  rationale: ἀφίστημι ebe a na-egosi ime ka ndị mmadụ hapụ ihe ha na-eso ma tụgharịa soro ya; ‘ụfọdụ ndị’ na-egosipụta λαόν na-enweghị ịkọwa ya dị ka mba ahụ dum.
- source_word: κἀκεῖνος ἀπώλετο
  choice: Ya onwe ya kwa lara n’iyi
  rationale: Nke a na-echekwa nkwuwa okwu dị na κἀκεῖνος na nghọta sara mbara nke ἀπώλετο, na-akọghị ụzọ o si nwụọ.
- source_word: πάντες ὅσοι ἐπείθοντο αὐτῷ
  choice: ndị niile o mere ka ha kweta iso ya
  rationale: Nke a na-egosipụta echiche nke ịbụ ndị e mere ka ha kwenye, kama ịsụgharị ya naanị dị ka iso mmadụ.
- source_word: διεσκορπίσθησαν
  choice: gbasasịkwara
  rationale: Ọ na-egosi na a chụsara ma ọ bụ kewasịa ndị otu ahụ.
theological_decisions:
- issue: Nkọwa ndọrọ ndọrọ ọchịchị banyere òtù Judas
  choice: A kọwara Judas dị ka onye biliri ma dọpụ ndị ka ha soro ya, n’etinyeghị okwu doro anya banyere nnupụisi.
  alternative: ‘duuru ndị mmadụ n’ime nnupụisi’
  rationale: Ọ bụ ezie na akụkọ ihe mere eme jikọtara Judas na nnupụisi, amaokwu Grik a ekwughị okwu ahụ kpọmkwem; ya mere, nsụgharị ahụ anaghị etinye nkọwa ndọrọ ndọrọ ọchịchị karịrị isi mmalite.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta mee ihe. A họọrọ ‘lara n’iyi’ iji ghara ịkọwa ụzọ Judas si nwụọ, ebe ‘gbasasịkwara’ na-enye ọdịdị eke nke passive Grik n’Igbo.
