revisions:
- from: Mgbe nke a gasịrị, Judas onye Galili biliri n’oge a na-edeba aha ndị mmadụ[a], dọpụkwa ụfọdụ ndị ka ha soro ya[b]. Ya onwe ya kwa lara n’iyi, ndị niile o mere ka ha kweta iso ya gbasasịkwara.
  to: Mgbe nke a gasịrị, Judas onye Galili biliri n’oge a na-edeba aha ndị mmadụ[a], dọpụkwa ndị mmadụ ka ha soro ya[b]. Ya onwe ya kwa lara n’iyi, ndị niile o mere ka ha kwenye gbasasịrị.
  rationale: Removed “ụfọdụ” because it adds a quantitative restriction absent from λαόν. Also streamlined the final clause to “ndị niile o mere ka ha kwenye,” which retains the passive sense of people being persuaded by Judas without unnecessarily repeating “iso ya,” already stated in the preceding clause.
