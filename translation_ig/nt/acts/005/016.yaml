review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents the gathering of people from settlements around Jerusalem, the sick, the unclean spirits, and the comprehensive passive healing. However, the phrase “ndị mmụọ na-adịghị ọcha na-enye nsogbu” grammatically makes the unclean spirits the people being brought, rather than identifying people afflicted by those spirits. The Greek ὀχλουμένους ὑπὸ πνευμάτων ἀκαθάρτων requires the latter sense.
  naturalness: The revised wording is clear, contemporary Standard Igbo, and maintains the narrative register. “A na-enye nsogbu site n'aka mmụọ na-adịghị ọcha” unambiguously identifies the afflicted people without adding interpretation.
  terminology: “Mmụọ na-adịghị ọcha” suitably preserves the established biblical rendering of πνεύματα ἀκάθαρτα. “Na-ebute” naturally renders φέροντες in this healing context. “A na-agwọ ha niile” retains the passive and durative sense of ἐθεραπεύοντο while expressing ἅπαντες clearly.
  issues:
  - severity: high
    issue: The phrase “ndị mmụọ na-adịghị ọcha na-enye nsogbu” reverses the relationship between the afflicted people and the unclean spirits.
    rationale: In Igbo, this construction presents “unclean spirits” as the noun phrase that gives trouble, not as the agents by whom a separate group of people are troubled. This changes the referent of the Greek participle ὀχλουμένους.
  - severity: medium
    issue: Footnote b repeats the same reversed syntax.
    rationale: “ndị mmụọ na-adịghị ọcha na-emekpa ahụ” likewise describes unclean spirits as acting, without naming the people afflicted by them. It is therefore not a valid lexical alternative for the source phrase.
  revised_text: Ọtụtụ ndị si n’obodo ndị gbara Jerusalem gburugburu na-ezukọtakwa[a], na-ebute ndị ọrịa na ndị a na-enye nsogbu site n'aka mmụọ na-adịghị ọcha; a na-agwọkwa ha niile.
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “Ọtụtụ ndị si n’obodo ndị gbara Jerusalem gburugburu na-agbakọtakwa.”
    reason: lexical_alternative
  revision_rationale: The revision corrects the grammatical role of the people troubled by unclean spirits and removes the invalid alternative footnote. It also uses “na-ebute” for bringing afflicted persons, while preserving the imperfect gathering and healing actions and the totality of those healed.
