id: ACT.5.16
reference: Acts 5:16
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: συνήρχετο δὲ καὶ τὸ πλῆθος τῶν πέριξ ⸀πόλεων Ἰερουσαλήμ, φέροντες ἀσθενεῖς καὶ ὀχλουμένους ὑπὸ πνευμάτων ἀκαθάρτων, οἵτινες ἐθεραπεύοντο ἅπαντες.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/016.yaml
  text: And even the multitude from the towns around Jerusalem was coming together[a], bringing the sick and those troubled by unclean spirits[b], and they were all being healed.
translation:
  language: ig
  text: Ọtụtụ ndị si n’obodo ndị gbara Jerusalem gburugburu na-ezukọtakwa[a], na-ebute ndị ọrịa na ndị a na-enye nsogbu site n'aka mmụọ na-adịghị ọcha; a na-agwọkwa ha niile.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Ọtụtụ ndị si n’obodo ndị gbara Jerusalem gburugburu na-agbakọtakwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: συνήρχετο
  choice: na-agbakọtakwa
  rationale: Ọdịdị imperfect na-egosi omume gara n’ihu ma ọ bụ nke na-eme ugboro ugboro; “na-agbakọta” na-echekwa echiche ahụ, ebe “-kwa” na-anọchi δὲ καὶ n’ụzọ Igbo dị n’ụzọ ebumpụta ụwa.
- source_word: τὸ πλῆθος
  choice: ọtụtụ ndị
  rationale: Nke a na-egosi ìgwè mmadụ buru ibu. “Ọtụtụ ndị” bụ Igbo doro anya ma dị mfe nghọta karịa ntụgharị siri ike nke collective singular.
- source_word: τῶν πέριξ πόλεων Ἰερουσαλήμ
  choice: si n’obodo ndị gbara Jeruselem gburugburu
  rationale: Ọ na-egosi obodo ndị dị Jeruselem nso; ntụgharị a na-echekwa njikọ ebe ahụ n’Igbo dị n’ụzọ ebumpụta ụwa.
- source_word: φέροντες
  choice: na-akpọta
  rationale: Participle a na-akọwa ihe ndị mmadụ ahụ na-eme mgbe ha na-agbakọta. “Na-akpọta” dabara n’ịkpọtara ndị ọrịa ndịozi, ma ọ dịghị amanye echiche na a na-eburu ha n’aka.
- source_word: ἀσθενεῖς
  choice: ndị ọrịa
  rationale: N’ọnọdụ ọgwụgwọ, okwu a pụtara ndị na-arịa ọrịa n’ahụ.
- source_word: ὀχλουμένους
  choice: ndị ... na-enye nsogbu
  rationale: Nke a na-echekwa echiche nke ịbụ ndị a na-enye nsogbu ma ọ bụ na-emekpa ahụ, n’enweghị ime ka ike okwu ahụ sie karịa ihe Grik ji kpọmkwem kwuo.
- source_word: ὑπὸ πνευμάτων ἀκαθάρτων
  choice: ndị mmụọ na-adịghị ọcha na-enye nsogbu
  rationale: A haziri ahịrịokwu ahụ dịka ụtọasụsụ Igbo si dị, ma “mmụọ na-adịghị ọcha” na-echekwa okwu Baịbụl a na-eji maka mmụọ ọjọọ.
- source_word: οἵτινες
  choice: ha
  rationale: Ọ na-alaghachi n’ìgwè abụọ e kwuru—ndị ọrịa na ndị mmụọ na-adịghị ọcha na-enye nsogbu—n’ụzọ Igbo dị larịị.
- source_word: ἐθεραπεύοντο
  choice: a na-agwọkwa
  rationale: Usoro “a na-agwọ” na-echekwa olu nnara na omume na-aga n’ihu ma ọ bụ na-eme ugboro ugboro nke imperfect passive.
- source_word: ἅπαντες
  choice: ha niile
  rationale: Ọ na-ekwusi ike na onye ọ bụla n’ime ndị ahụ natara ọgwụgwọ.
theological_decisions:
- issue: Ntụgharị πνευμάτων ἀκαθάρτων
  choice: mmụọ na-adịghị ọcha
  alternative: mmụọ rụrụ arụ
  rationale: “Mmụọ na-adịghị ọcha” na-echekwa okwu ọdịnala Akwụkwọ Nsọ na echiche nke mmụọ ọjọọ dị ndụ, n’emeghị ya naanị ọnọdụ uche ma ọ bụ ihe atụ.
- issue: Oke ἅπαντες
  choice: a na-agwọkwa ha niile
  alternative: a gwọrọ ha niile
  rationale: “Ha niile” metụtara ndị ọrịa na ndị mmụọ na-adịghị ọcha na-enye nsogbu a kpọtara; usoro imperfect na-egosi usoro ọgwụgwọ na-aga n’ihu, ọ bụghị naanị otu ihe mere otu ugboro.
translation_notes:
  register: Standard Igbo dị ugbu a, dị nsọ ma dị mfe nghọta. E jiri “ọtụtụ ndị” mee ka τὸ πλῆθος bụrụ okwu mmadụ nkịtị ga-aghọta; e chekwara imperfect abụọ ahụ site na usoro “na-”. Akara ndetu [a] na [b] dị n’ahịrịokwu isi.
