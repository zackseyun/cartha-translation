- from: Ọtụtụ ndị si n’obodo ndị gbara Jeruselem gburugburu na-agbakọtakwa[a], na-akpọta ndị ọrịa na ndị mmụọ na-adịghị ọcha na-enye nsogbu[b]; a na-agwọkwa ha niile.
  to: Ọtụtụ ndị si n’obodo ndị gbara Jerusalem gburugburu na-ezukọtakwa[a], na-ebute ndị ọrịa na ndị a na-enye nsogbu site n'aka mmụọ na-adịghị ọcha; a na-agwọkwa ha niile.
