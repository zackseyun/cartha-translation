  source_fidelity: 'Text ahụ na-anọchi anya Grik ahụ nke ọma: ‘onye a’ na-edobe nrụsi aka τοῦτον; ‘Onye Ndú na Onye Nzọpụta’ na-ekpughe ἀρχηγός καὶ σωτήρ n’enweghị ịgbakwunye nkọwa okpukpe; ‘buliri ... elu’ kwekọrọ na ὕψωσεν n’ọnọdụ mbuli nsọpụrụ; ‘nchegharị na mgbaghara mmehie’ na-asụgharị μετάνοιαν na ἄφεσιν ἁμαρτιῶν nke ọma. ‘Ka o nye’ na-edobe njikọ ebumnuche τοῦ δοῦναι n’enweghị idozi onye na-enye ya n’ụzọ siri ike karịa Grik.'
  naturalness: Igbo Izugbe ahụ dị mma, dị mfe ịgụ, ma dabara na ndekọ Akwụkwọ Nsọ nke oge a. Usoro ‘Chineke buliri onye a elu n’aka nri ya’ na ‘ka ọ bụrụ Onye Ndú na Onye Nzọpụta’ bụ nke a pụrụ ịghọta nke ọma ma na-agụ nke ọma.
  terminology: ‘Onye Ndú,’ ‘Onye Nzọpụta,’ ‘nchegharị,’ na ‘mgbaghara mmehie’ bụ nhọrọ ndị ziri ezi, a na-ahụkarị, ma na-edobe ibu okwu ndị dị na Grik. Aha ‘Izrel’ ziri ezi. Ihe ndetu ala peeji na-echekwa nghọta ọzọ nke τῇ δεξιᾷ αὐτοῦ n’enweghị ikwu na nghọta ahụ bụ nke a ga-anabata n’ụzọ doro anya.
