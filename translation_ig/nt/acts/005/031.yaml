  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τοῦτον ὁ θεὸς ἀρχηγὸν καὶ σωτῆρα ὕψωσεν τῇ δεξιᾷ αὐτοῦ, ⸀τοῦ δοῦναι μετάνοιαν τῷ Ἰσραὴλ καὶ ἄφεσιν ἁμαρτιῶν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/031.yaml
  text: God exalted this one to his right hand as Leader and Savior[a], to give repentance to Israel and forgiveness of sins.
translation:
  language: ig
  text: Chineke buliri onye a elu n’aka nri ya ka ọ bụrụ Onye Ndú na Onye Nzọpụta[a], ka o nye Izrel nchegharị na mgbaghara mmehie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Chineke ji aka nri ya bulie onye a elu ka ọ bụrụ Onye Ndú na Onye Nzọpụta.” Okwu Grik ahụ nwekwara ike igosi na aka nri Chineke bụ ihe o ji bulie ya elu; ma n’ebe a, o yikarịrị ka ọ na-ekwu banyere ibuli ya n’ọnọdụ nsọpụrụ kachasị elu n’aka nri Chineke.
    reason: alternative_reading
lexical_decisions:
- source_word: τοῦτον
  choice: onye a
  rationale: Na-edobe ike nke nnọchiaha ngosi ahụ, nke na-arụtụ aka kpọmkwem na Jizọs.
- source_word: ἀρχηγὸν
  choice: Onye Ndú
  rationale: Na-egosi onye nọ n’isi ma na-achị ma ọ bụ na-edu, ma ghara ibubata echiche ọzọ nke okwu Grik ahụ anaghị amanye.
- source_word: σωτῆρα
  choice: Onye Nzọpụta
  rationale: Ọ bụ okwu Igbo doro anya nke na-eburu echiche nzọpụta nke σωτήρ n’ọnọdụ a.
- source_word: ὕψωσεν
  choice: buliri ... elu
  rationale: Na-egosi ibuli Jizọs n’ọnọdụ nsọpụrụ na ikike dị elu, ọ bụghị naanị mbilite n’ọnwụ.
- source_word: τῇ δεξιᾷ αὐτοῦ
  choice: n’aka nri ya
  rationale: N’ahịrịokwu bụ isi, nke a na-egosi ọnọdụ nsọpụrụ kachasị elu n’aka nri Chineke; a na-edobe nghọta nke ngwá ọrụ n’ala ala peeji.
- source_word: τοῦ δοῦναι
  choice: ka o nye
  rationale: Na-egosipụta ebumnuche nke articular infinitive n’ụzọ Igbo na-aga were were.
- source_word: μετάνοιαν
  choice: nchegharị
  rationale: Na-egosi ntụgharị uche na ndụ laghachikwuru Chineke, ọ bụghị naanị ịgbanwe echiche n’obi.
- source_word: τῷ Ἰσραὴλ
  choice: Izrel
  rationale: Dative ahụ bụ onye a na-enye ihe; usoro Igbo ‘nye Izrel’ na-egosi nke a nke ọma.
- source_word: ἄφεσιν ἁμαρτιῶν
  choice: mgbaghara mmehie
  rationale: Ọ bụ okwu Igbo doro anya na nke a na-ahụkarị maka mgbaghara mmehie.
theological_decisions:
- issue: Ihe τῇ δεξιᾷ αὐτοῦ pụtara n’ịbulite Jizọs elu
  choice: Chineke buliri Jizọs elu n’aka nri ya, ya bụ, n’ọnọdụ nsọpụrụ na ikike kachasị elu.
  alternative: Chineke ji aka nri ya bulie Jizọs elu.
  rationale: Usoro okwu a na ihe oyiyi NT banyere ịnọ n’aka nri Chineke na-akwado nghọta nke ọnọdụ nsọpụrụ, ma dative Grik ahụ nwekwara ike ịbụ nke ngwá ọrụ; ya mere e debere nke ọzọ n’ala ala peeji.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E ji ‘onye a’ chekwaa nrụsi aka demonstrative ahụ; e ji ‘nchegharị’ zere ime ka μετάνοια bụrụ naanị mgbanwe echiche.
