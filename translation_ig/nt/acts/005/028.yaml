review_pass:
  verdict: revise
  source_fidelity: The draft accurately retains the emphatic prohibition, the name-language, the Jerusalem-filling metaphor, and the bloodguilt idiom. However, «unu ejupụtala Jerusalem» uses an intransitive/fullness verb where the Greek requires that the speakers have caused Jerusalem to be full; «unu emejuwo Jerusalem» expresses the transitive sense clearly. «na-achọkwa» is a more direct modern rendering of βούλεσθε (“you want/intend”) while preserving its accusatory force.
  naturalness: 'The revision uses natural Standard Igbo syntax: «emejuwo Jerusalem n’ozizi unu» rather than making the apostles themselves “be full” of Jerusalem. The footnote is also adjusted so that its explanation consistently refers to the plural «anyị».'
  terminology: «Ozizi» suitably renders διδαχή as the content taught. «N’aha a» preserves the source’s deliberately indirect reference, and «ọbara nwoke a» keeps both the blood imagery and the dismissive “this man” wording without importing an interpretation into the main line.
  issues:
  - severity: medium
    issue: «unu ejupụtala Jerusalem» does not naturally convey the transitive sense of filling Jerusalem.
    rationale: 'πεπληρώκατε has Jerusalem as its object: “you have filled Jerusalem.” In Standard Igbo, «jupụta/ejupụta» primarily expresses becoming full, whereas «imeju» clearly expresses causing something to be full.'
  - severity: low
    issue: The footnote’s final clause uses singular wording, «onye ahụ bụ onye a na-ata ụta», after explaining a plural «anyị».
    rationale: The explanatory idiom concerns the council members collectively. Plural wording avoids an unnecessary mismatch while leaving the meaning unchanged.
