id: ACT.5.28
reference: Acts 5:28
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸀λέγων· Παραγγελίᾳ παρηγγείλαμεν ὑμῖν μὴ διδάσκειν ἐπὶ τῷ ὀνόματι τούτῳ, καὶ ἰδοὺ πεπληρώκατε τὴν Ἰερουσαλὴμ τῆς διδαχῆς ὑμῶν, καὶ βούλεσθε ἐπαγαγεῖν ἐφ’ ἡμᾶς τὸ αἷμα τοῦ ἀνθρώπου τούτου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/028.yaml
  text: saying[a], “We strictly ordered you not to teach in this name, and look, you have filled Jerusalem with your teaching, and you intend to bring this man's blood upon us.”
translation:
  language: ig
  text: na-ekwu, “Anyị nyere unu iwu siri ike ka unu ghara izi ihe n’aha a; ma lee, unu emejuwo Jerusalem n’ozizi unu, unu na-achọkwa ịkwasị anyị ọbara nwoke a[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n’ụzọ doro anya karị, “ime ka anyị buru ibu ọrụ maka ọnwụ nwoke a.” N’asụsụ Grik, “ịkwasị mmadụ ọbara” bụ akpaalaokwu na-egosi na a na-ata ndị ahụ ụta maka ọnwụ ahụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγων
  choice: na-asị
  rationale: Nke a na-egosi na okwu na-esonụ bụ ihe onye na-ekwu okwu ahụ kwuru; nsụgharị a bụ nke e ji eme ihe n’Igbo ugbu a.
- source_word: Παραγγελίᾳ παρηγγείλαμεν
  choice: Anyị nyere unu iwu siri ike
  rationale: Aha na ngwaa Grik ndị sitere n’otu mgbọrọgwụ na-eme ka iwu ahụ sie ike. Igbo anaghị ekwughachi ha n’ụzọ ahụ n’enweghị mgbagwoju anya, ya mere ‘iwu siri ike’ na-ebupụta ike okwu ahụ.
- source_word: μὴ διδάσκειν
  choice: ka unu ghara izi ihe
  rationale: Nke a na-asụgharị ihe a machibidoro ha ime n’enweghị ịgbakwụnye echiche doro anya nke ‘kwụsị’ nke na-adịghị mkpa n’ebe a.
- source_word: ἐπὶ τῷ ὀνόματι τούτῳ
  choice: n’aha a
  rationale: N’Ọrụ Ndị Ozi, ‘n’aha’ nwere ike ịpụta ikwu ma ọ bụ ime ihe n’okpuru ikike aha ahụ. Nsụgharị a na-edebe ma okwu ahụ ma obosara ihe ọ pụrụ ịpụta.
- source_word: ἰδοὺ
  choice: Ma lee
  rationale: ‘Lee’ na-edebe ike nke ịdọrọ uche ndị a na-agwa okwu n’ụzọ dabara n’Igbo nke oge a.
- source_word: πεπληρώκατε τὴν Ἰερουσαλὴμ
  choice: unu ejupụtala Jerusalem
  rationale: Ụdị ngwaa Grik ahụ na-egosi ihe e mere nke mmetụta ya ka dị ugbu a; ‘ejupụtala’ na-edebe nke a nakwa ihe atụ nke ime ka obodo ahụ jupụta.
- source_word: τῆς διδαχῆς ὑμῶν
  choice: na nkuzi unu
  rationale: ‘Nkuzi’ bụ okwu doro anya maka ihe ha na-akụzi, ebe ‘na’ na-egosi ihe e ji mee ka Jerusalem jupụta.
- source_word: βούλεσθε
  choice: unu na-ezubekwa
  rationale: Okwu a na-egosi ọchịchọ ma ọ bụ ebumnuche. ‘Na-ezube’ dabara n’ụda ebubo dị n’okwu ahụ, ebe ‘-kwa’ jikọtara ebubo a na nke bu ya ụzọ.
- source_word: ἐπαγαγεῖν ἐφ’ ἡμᾶς
  choice: ịkwasị anyị
  rationale: Nke a na-edebe ihe oyiyi nke iweta ma ọ bụ ịtụkwasị ihe n’ahụ mmadụ, nke n’ebe a metụtara ịkwanye ha ibu ọrụ ma ọ bụ ikpe ọmụma.
- source_word: τὸ αἷμα τοῦ ἀνθρώπου τούτου
  choice: ọbara nwoke a
  rationale: Nsụgharị a na-edebe akpaalaokwu gbasara ọbara nakwa ụzọ mkparị e si kpọọ Jizọs ‘nwoke a,’ kama ịkọwa ihe ọ pụtara ozugbo n’ahịrị bụ isi.
theological_decisions:
- issue: Ihe ‘ịkwasị anyị ọbara nwoke a’ pụtara
  choice: E debere akpaalaokwu nke ọbara n’ahịrị bụ isi dị ka ebubo na ndị ozi chọrọ ime ka ha buru ibu ọrụ ma ọ bụ ikpe ọmụma maka ọnwụ Jizọs.
  alternative: Ịsụgharị ya ozugbo dịka ‘ime ka anyị buru ibu ọrụ maka ọnwụ nwoke a.’
  rationale: Okwu Grik na-eji ihe oyiyi ọbara a na-ebute n’ahụ mmadụ egosi ibu ọrụ maka ọnwụ ma ọ bụ ikpe ọmụma ọbara. Idebe ihe oyiyi ahụ na-echekwa esemokwu na ike okwu mbụ ahụ; nkọwa ala peeji na-eme ka akpaalaokwu ahụ doo onye na-agụ anya.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta, dee ya. A hapụrụ ihe oyiyi ‘ọbara nwoke a’ n’ahịrị bụ isi iji chekwaa akpaalaokwu na ụda ebubo nke Grik; a kọwara ya n’ala peeji.
