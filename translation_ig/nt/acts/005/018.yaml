review_pass:
  verdict: revise
  source_fidelity: “Ha wee jide ndị ozi ahụ” accurately conveys the hostile apprehension expressed by ἐπέβαλον τὰς χεῖρας ἐπὶ in this context. The second clause correctly reflects their being placed in detention, but “ụlọ njide ọha” is less idiomatic and leans toward a specific facility despite the lexical breadth of τηρήσει.
  naturalness: The main sentence is clear Standard Igbo. Recasting “ụlọ njide ọha” as “ụlọ mkpọrọ ọha” gives a more established and natural expression for a public place of detention. The footnote’s introductory wording “A pụkwara ịsụ ya” is not idiomatic in this translation-register context.
  terminology: “ndị ozi” is the established Igbo rendering for ἀπόστολοι and should be retained. “jide” appropriately avoids the misleading ritual sense that a literal rendering of “lay hands on” could carry. The note should preserve that τηρήσει may refer more broadly to custody or confinement, rather than only a jail building.
  issues:
  - severity: low
    issue: The phrase “ụlọ njide ọha” is somewhat unnatural as a Standard Igbo designation for a public jail or detention place.
    rationale: “Ụlọ mkpọrọ ọha” is more idiomatic while the note can retain the source word’s broader sense of custody/confinement.
  - severity: low
    issue: The footnote wording “A pụkwara ịsụ ya” is awkward, and its alternative “n’okpuru njide ọha” is not the clearest natural Igbo phrasing.
    rationale: Using “Ma ọ bụ” and explaining the broader detention sense directly is more natural and preserves the intended lexical alternative.
