  text: And they laid hands on the apostles and put them in public custody[a].
translation:
  language: ig
  text: Ha wee jide ndị ozi ahụ, tinye ha n’ụlọ mkpọrọ ọha.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “debe ha n’ụlọ njide.” Okwu Grik ahụ nwere ike ịpụta njide ma ọ bụ mmechi n’ozuzu ya, ọ bụghị naanị ụlọ mkpọrọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέβαλον τὰς χεῖρας ἐπὶ
  choice: jide
  rationale: Akpaalaokwu Grik a pụtara ibikwasị mmadụ aka n’ụzọ ike iji nwụchie ya n’ọnọdụ a. “Jide” na-egosi nke a n’Igbo nkịtị ma zere nghọtahie nke ibikwasị aka maka ngọzi ma ọ bụ ido mmadụ n’ọrụ.
- source_word: ἀποστόλους
  choice: ndị ozi
  rationale: N’Ọrụ Ndị Ozi, okwu a bụ aha a na-akpọ ndị Jizọs nyere ọrụ pụrụ iche iziga ha. “Ndị ozi” bụ okwu Igbo a maara nke ọma maka aha a, ọ bụghị naanị ndị na-ezi ozi nkịtị n’ọnọdụ a.
- source_word: ἔθεντο
  choice: tinye
  rationale: “Tinye” na-enye echiche τίθημι n’ụzọ dị mfe ma kwekọọ n’okwu na-esochi banyere njide.
- source_word: ἐν τηρήσει
  choice: n’ụlọ njide
  rationale: τήρησις nwere ike ịpụta ọnọdụ ịnọ n’okpuru nche ma ọ bụ ebe a na-edebe ndị e jidere. “Ụlọ njide” na-egosi mmechi ahụ n’ụzọ doro anya, ebe nkọwa ala peeji na-echekwa obosara okwu Grik ahụ.
- source_word: δημοσίᾳ
  choice: ọha
  rationale: Okwu a na-akọwa τηρήσει dịka ebe ma ọ bụ njide nke ọha na-achị, ọ bụghị njide nzuzo. “Ọha” na-echekwa nkọwa ahụ n’enweghị ịkọwa ya karịa ihe Grik kwuru.
