- from: Ha wee jide ndị ozi ahụ, tinye ha n’ụlọ njide ọha.[a]
  to: Ha wee jide ndị ozi ahụ, tinye ha n’ụlọ mkpọrọ ọha.[a]
  rationale: The revision retains the arrestive force of the first Greek idiom and the recognized title “ndị ozi.” It uses the more idiomatic “ụlọ mkpọrọ ọha” for the public detention setting, while the footnote preserves the fact that τηρήσει can denote custody or confinement generally and need not specify a jail building.
  reviewer_model: gpt-5.6-terra
