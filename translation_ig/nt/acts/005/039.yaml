  text: εἰ δὲ ἐκ θεοῦ ἐστιν, οὐ ⸀δυνήσεσθε καταλῦσαι ⸀αὐτούς·) μήποτε καὶ θεομάχοι εὑρεθῆτε. ἐπείσθησαν δὲ αὐτῷ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/039.yaml
  text: But if it is from God[a], you will not be able to overthrow them. You may even be found to be fighting against God.” So they were persuaded by him[c][b],
translation:
  language: ig
  text: Ma ọ bụrụ na o sitere n’aka Chineke, unu agaghị enwe ike ịkwatu ha.[a] Unu pụrụ ọbụna bụrụ ndị a chọpụtara na ha na-alụso Chineke ọgụ.” Ha wee kwenye n’okwu ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ibibi ha” ma ọ bụ “ime ka ha daa.” “Ha” na-atụkarị aka n’ebe ndị ozi nọ, ọ bụ ezie na ụfọdụ na-aghọta ya n’ụzọ sara mbara dịka òtù ha ma ọ bụ ọrụ ha.
    reason: lexical_alternative_and_alternative_reading
lexical_decisions:
- source_word: ἐκ θεοῦ
  choice: o sitere n’aka Chineke
  rationale: Nke a na-egosi ebe ihe ahụ si malite, ma na-edowe okwu ahụ n’ụzọ ebumpụta ụwa n’Igbo.
- source_word: δυνήσεσθε
  choice: unu agaghị enwe ike
  rationale: Nke a na-echekwa ọdịnihu nke ngwaa Grik na echiche nke enweghị ike ime ihe ahụ.
- source_word: καταλῦσαι
  choice: ịkwatu
  rationale: “Ịkwatu” nwere ike ịpụta ime ka ndị ahụ ma ọ bụ ọrụ ha daa, n’emeghị ka okwu ahụ bụrụ naanị igbu ma ọ bụ ikpochapụ kpamkpam.
- source_word: αὐτούς
  choice: ha
  rationale: Nnochiaha Grik bụ nke ọtụtụ mmadụ, ya mere “ha” na-atụ aka n’ụzọ kacha nso n’ebe ndị ozi nọ, ma ihe gbara ya gburugburu ka na-enye ohere ịhụ ọrụ ha n’ime ya.
- source_word: μήποτε
  choice: Ka a ghara ọbụna
  rationale: Nke a na-egosipụta ịdọ aka ná ntị banyere ihe ọjọọ nwere ike ịpụta.
- source_word: θεομάχοι
  choice: ndị na-alụso Chineke ọgụ
  rationale: 'Nke a na-enye ihe okwu Grik ahụ pụtara n’ụzọ doro anya ma dị mma n’Igbo: ndị na-ebuso Chineke agha ma ọ bụ na-emegide ya.'
- source_word: εὑρεθῆτε
  choice: ịchọpụta na unu bụ
  rationale: Nke a na-echekwa echiche nke ịbụ ndị a hụrụ ma ọ bụ gosipụta na ha nọ n’ọnọdụ ahụ.
- source_word: ἐπείσθησαν δὲ αὐτῷ
  choice: Ya mere, okwu ya mere ka ha kwenye
  rationale: Nke a bụ ụzọ ebumpụta ụwa n’Igbo isi kwuo na ndụmọdụ Gamaliel dọtara ha ma mee ka ha nabata ya.
theological_decisions:
- issue: Ihe αὐτούς (“ha”) na-atụ aka na ya
  choice: E ji “ha” mee ihe ka ọ na-atụ aka n’ebe ndị ozi nọ.
  alternative: A pụrụ ịghọta ya n’ụzọ sara mbara dịka ọrụ ma ọ bụ òtù ha.
  rationale: Nnochiaha Grik ahụ bụ nke nwoke ọtụtụ, nke na-atụkarị aka n’ebe ndị ozi nọ. Ihe odide ala ala peeji na-echekwa ohere nke nghọta sara mbara n’enweghị idozi esemokwu ahụ n’ike.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta mee ihe. A họọrọ “ịkwatu” iji chekwaa mbara ihe καταλύω pụrụ ịpụta; e tinyere nhọrọ ndị ọzọ n’ala ala peeji. E debere ịdọ aka ná ntị Gamaliel dịka ihe nwere ike ime, ọ bụghị dịka nkwupụta ozizi zuru ụwa ọnụ.
