revisions:
- from: Ma a nọgidere na-agbakwụnye ọtụtụ ndị ọzọ kwere n’Onyenwe anyị—ìgwè mmadụ dị ukwuu, ma ndị nwoke ma ndị nwaanyị[a].
  to: Ma a nọgidere na-agbakwụnye ndị kwere n’Onyenwe anyị n’ọnụ ọgụgụ ka ukwuu—ọtụtụ ndị ikom na ndị nwanyị[a].
  rationale: The revision preserves the imperfect passive force of προσετίθεντο with “a nọgidere na-agbakwụnye,” identifies those added as believers in the Lord, and renders μᾶλλον as their addition in greater numbers. It retains the appositional indication that these were many men and women, without adding an unstated recipient to the alternative joining sense.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T08:28:24Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly identifies faith in the Lord, the ongoing sense of προσετίθεντο, and the inclusion of men and women. However, “ọtụtụ ndị ọzọ kwere” can read as an assertion that additional people came to believe, rather than that believers were being added. The revision makes the believers the people being added and expresses μᾶλλον as increase in greater numbers.
  naturalness: The revised wording is natural, modern Standard Igbo. “N’ọnụ ọgụgụ ka ukwuu” conveys the comparative increase without the ambiguity created by attaching “ọzọ” directly to “ndị.”
  terminology: “Ndị kwere n’Onyenwe anyị” appropriately renders πιστεύοντες τῷ κυρίῳ in a natural Igbo construction, while retaining the established reverential title. “Ndị ikom na ndị nwanyị” accurately represents the explicitly inclusive ἀνδρῶν τε καὶ γυναικῶν.
  issues:
  - severity: medium
    issue: The clause “ọtụtụ ndị ọzọ kwere n’Onyenwe anyị” can shift the sense from passive addition of believers to additional people believing.
    rationale: προσετίθεντο is the governing verb and is passive in form; πιστεύοντες designates those who were being added. The Igbo should keep that relationship clear.
  - severity: low
    issue: The footnote’s alternative “nọgidere na-esonyere ha” adds an explicit object (“ha,” them) not present in the Greek.
    rationale: A joining/intransitive nuance may be noted, but the translation note should not specify whom they joined.
  revised_text: Ma a nọgidere na-agbakwụnye ndị kwere n’Onyenwe anyị n’ọnụ ọgụgụ ka ukwuu—ọtụtụ ndị ikom na ndị nwanyị[a].
  revised_footnotes:
