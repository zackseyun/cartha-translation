  text: μᾶλλον δὲ προσετίθεντο πιστεύοντες τῷ κυρίῳ πλήθη ἀνδρῶν τε καὶ γυναικῶν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/014.yaml
  text: And even more believers in the Lord were being added—multitudes of both men and women[a].
translation:
  language: ig
  text: Ma a nọgidere na-agbakwụnye ndị kwere n’Onyenwe anyị n’ọnụ ọgụgụ ka ukwuu—ọtụtụ ndị ikom na ndị nwanyị[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị kwere n’Onyenwe anyị nọgidere na-esonyekwu.” Ngwaa Grik ahụ nwere ike ịpụta na ọnụ ọgụgụ ha nọgidere na-abawanye; olu passive ya nwekwara ike igosi na Chineke bụ onye na-agbakwụnye ha.
    reason: lexical_alternative
lexical_decisions:
- source_word: μᾶλλον
  choice: ọtụtụ ndị ọzọ
  rationale: Nke a na-egosipụta mmụba e mesiri ike n’akụkọ a, n’ụzọ Igbo na-ada nke ọma.
- source_word: δὲ
  choice: Ma
  rationale: N’ebe a, δέ na-ejikọta ihe na-aga n’ihu n’akụkọ ahụ; “Ma” bụ njikọ dị nro, ọ bụghị nnukwu mmegide.
- source_word: προσετίθεντο
  choice: a nọgidere na-agbakwụnye
  rationale: Nke a na-echekwa ọdịdị imperfect nke na-egosi omume nọ na-aga n’ihu, tinyere olu passive nke na-ahapụghị onye na-agbakwụnye ha n’aha.
- source_word: πιστεύοντες
  choice: ndị ... kwere
  rationale: Participle a na-arụ ọrụ dịka aha ndị mmadụ; okwu a bụ Igbo nkịtị ma na-akọwa ndị nwere okwukwe.
- source_word: τῷ κυρίῳ
  choice: n’Onyenwe anyị
  rationale: Ọ na-egosi na okwukwe ha dị n’Onyenwe anyị; nke a bụ ụzọ doro anya ma bụrụkwa nke sitere n’okwu Grik.
- source_word: κύριος
  choice: Onyenwe anyị
  rationale: Aha nsọpụrụ a na-echekwa ịdị arọ nke κύριος, n’agbanyeghị na ihe gbara ya gburugburu na-arụtụ aka na Jizọs.
- source_word: πλήθη
  choice: ìgwè mmadụ dị ukwuu
  rationale: Nke a na-egosipụta ọtụtụ ìgwè ma ọ bụ ọnụ ọgụgụ mmadụ buru ibu, kama ime ka okwu ahụ bụrụ naanị mmụba ọnụ ọgụgụ.
- source_word: ἀνδρῶν τε καὶ γυναικῶν
  choice: ma ndị nwoke ma ndị nwaanyị
  rationale: Usoro “ma ... ma ...” na-echekwa ike njikọ τε καί ma na-akpọpụta otu abụọ ahụ kpọmkwem.
theological_decisions:
- issue: Onye “Onyenwe anyị” na-ezo aka na ya na ike aha ahụ nwere
  choice: E debere “Onyenwe anyị,” ebe ihe gbara amaokwu ahụ gburugburu na-egosi Jizọs na ndị mmadụ na-ekwere na ya.
  alternative: A pụrụ ịghọta “Onyenwe anyị” n’ụzọ sara mbara dịka Chineke.
  rationale: N’akwụkwọ Ọrụ Ndịozi, κύριος na-ezokarị aka na Jizọs ahụ e mere ka o si n’ọnwụ bilie. Ma ntụgharị ahụ akọwaghị aha ahụ ka ọ bụrụ “Jizọs,” ka o wee chekwaa okwu na obere ohere nghọta nke Grik.
- issue: Olu na ọdịdị oge nke προσετίθεντο
  choice: 'A sụgharịrị ya dịka omume passive nọ na-aga n’ihu: “a nọgidere na-agbakwụnye.”'
  alternative: A pụrụ ịghọta ya n’ụzọ middle/intransitive dịka “ha nọgidere na-esonyere ha.”
  rationale: Passive na-echekwa echiche na e nwere onye na-agbakwụnye ha—ikekwe Chineke—ma ọ naghị eme Chineke onye isiokwu kpọmkwem ebe Grik akpọghị ya aha.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “Nwaanyị” bụ mkpụrụokwu Standard Igbo a na-ejikarị eme ihe; a zere okwu ụka pụrụ iche nke otu denominashọn. Ahịrị ogologo e ji kewaa nkọwa “ìgwè mmadụ dị ukwuu” na-enyere aka igosi na ọ na-akọwa etu ndị a si dị ọtụtụ.
