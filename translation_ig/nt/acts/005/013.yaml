- from: Ma ọ dịghị onye ọ bụla n’ime ndị ọzọ nwara anwa isonyere ha; kama, ndị mmadụ na-akwanyere ha ùgwù nke ukwuu.
  to: Ma ọ dịghị onye ọ bụla n’ime ndị ọzọ nwere obi ike isonyere ha; kama, ndị mmadụ kwanyere ha ùgwù nke ukwuu.
  rationale: The revision replaces an unnatural and semantically imprecise expression for “dared” with idiomatic Standard Igbo, and uses past narration for the people’s esteem. It retains the source’s contrast, intensity, and unresolved referents without adding interpretive identification.
