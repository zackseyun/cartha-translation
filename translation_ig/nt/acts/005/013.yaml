  text: τῶν δὲ λοιπῶν οὐδεὶς ἐτόλμα κολλᾶσθαι αὐτοῖς, ἀλλ’ ἐμεγάλυνεν αὐτοὺς ὁ λαός,
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/013.yaml
  text: But none of the rest dared to join them; rather, the people held them in high esteem.
translation:
  language: ig
  text: Ma ọ dịghị onye ọ bụla n’ime ndị ọzọ nwere obi ike isonyere ha; kama, ndị mmadụ kwanyere ha ùgwù nke ukwuu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τῶν δὲ λοιπῶν
  choice: Ma ... n’ime ndị ọzọ
  rationale: Ọ na-egosipụta ìgwè ndị ọzọ a kpọrọ iche n’ebe ‘ha’ nọ, ma na-edobe njikọ δέ n’ụzọ Igbo si ada nke ọma.
- source_word: οὐδεὶς ἐτόλμα
  choice: ọ dịghị onye ọ bụla ... nwara anwa
  rationale: ‘Nwara anwa’ na-ebupụta echiche nke inwe obi ike ime ihe, ọ bụghị nanị ịnwa ime ya.
- source_word: κολλᾶσθαι αὐτοῖς
  choice: isonyere ha
  rationale: N’ebe a, okwu a pụtara ijikọta onwe onye na ha ma ọ bụ ịbanye n’òtù ha; ‘isonyere ha’ bụ okwu Igbo doro anya ma bụrụkwa ihe e bu n’obi n’akụkọ a.
- source_word: ἀλλ’
  choice: kama
  rationale: 'Ọ na-egosipụta mgbanwe dị iche: ndị ọzọ atụghị anya isonyere ha, ma ndị mmadụ ji ha kpọrọ ihe.'
- source_word: ἐμεγάλυνεν αὐτοὺς ὁ λαός
  choice: ndị mmadụ na-akwanyere ha ùgwù nke ukwuu
  rationale: Aorist imperfective-looking context aside, Igbo habitual/progressive wording naturally conveys the public’s high regard; ‘nke ukwuu’ preserves the intensifying sense of μεγα-.
theological_decisions:
- issue: Ndị ‘ha’ na ‘ndị ọzọ’ na-ezo aka na ha
  choice: E debere nnọchiaha ndị ahụ n’enweghị nkọwa agbakwunyere.
  alternative: Ịkọwa ‘ha’ dị ka ndịozi ma ọ bụ ndị kwere ekwe, na ‘ndị ọzọ’ dị ka ndị na-abụghị ndị kwere ekwe.
  rationale: Amaokwu Grik ahụ n’onwe ya anaghị akpọpụta ndị nnọchiaha ahụ aha; nkọwa na-esite n’akụkụ gbara ya gburugburu, ma a gaghị edozi mgbagwoju anya ahụ n’ime ntụgharị.
translation_notes:
  register: Standard Igbo dị ugbu a, dị nsọ ma dị mfe nghọta. E jiri ‘nwara anwa’ kwupụta egwu ma ọ bụ enweghị obi ike dị na ἐτόλμα, ebe ‘na-akwanyere ... ùgwù nke ukwuu’ na-enye okwu ọha na eze nke dabara n’ἐμεγάλυνεν.
