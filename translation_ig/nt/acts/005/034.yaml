revisions:
- from: Ma otu onye Farisii aha ya bụ Gameliel, onye na-akụzi Iwu ahụ nke ndị mmadụ niile na-asọpụrụ, biliri n’ọdụ nzukọ ahụ[a], nye iwu ka a kpọpụ ndị ikom ahụ n’èzí nwa oge.[b]
  to: Ma otu onye Farisii, aha ya bụ Gamaliel, onye nkuzi Iwu, onye mmadụ niile na-asọpụrụ, biliri n’ụlọikpe ahụ[a] nye iwu ka a kpọpụ ndị ikom ahụ n’èzí ruo obere oge.[b]
  rationale: The revision replaces an imprecise institutional expression with a natural contextual term for the Jewish judicial council, corrects the name to “Gamaliel,” and smooths the appositional description. It preserves the Greek sequence of actions, Gamaliel’s public esteem, the male referent in context, and the limited duration of the removal. The two existing footnote anchors and their respective functions remain correctly aligned.
