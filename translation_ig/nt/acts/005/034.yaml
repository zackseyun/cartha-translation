id: ACT.5.34
reference: Acts 5:34
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀναστὰς δέ τις ἐν τῷ συνεδρίῳ Φαρισαῖος ὀνόματι Γαμαλιήλ, νομοδιδάσκαλος τίμιος παντὶ τῷ λαῷ, ἐκέλευσεν ἔξω ⸀βραχὺ τοὺς ⸀ἀνθρώπους ποιῆσαι,
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/034.yaml
  text: But a Pharisee named Gamaliel stood up in the council[a], a teacher of the law honored by all the people[b], and ordered the men to be put outside for a short time.
translation:
  language: ig
  text: Ma otu onye Farisii, aha ya bụ Gamaliel, onye nkuzi Iwu, onye mmadụ niile na-asọpụrụ, biliri n’ụlọikpe ahụ[a] nye iwu ka a kpọpụ ndị ikom ahụ n’èzí ruo obere oge.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ụlọikpe ahụ” na-ezo aka n’ụlọikpe ọchịchị na ikpe ndị Juu, nke a na-akpọ Sanhedrin.
    reason: cultural_note
  - marker: b
    text: N’asụsụ Grik, okwu a pụtara n’ụzọ nkịtị, “ime ka ndị ikom ahụ nọrọ n’èzí ruo obere oge”; ọ bụ ụzọ e si ekwu ka a kpọpụ ha nwa oge.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστὰς
  choice: biliri
  rationale: Ọ na-egosi na Gameliel si n’oche bilie ka o kwuo okwu n’ihu nzukọ ahụ; “biliri” bụ okwu Igbo doro anya ma kwekọọ n’omume ahụ.
- source_word: δέ
  choice: Ma
  rationale: Ọ na-egosi ntakịrị mgbanwe ma ọ bụ ntụgharị n’akụkọ ahụ, site n’ihe ndị ọzọ chọrọ ime gaa n’itinye aka Gameliel.
- source_word: τις
  choice: otu onye
  rationale: Ọ na-ewebata onye ọhụrụ a na-akọ banyere ya n’ụzọ na-akọwaghị ya tupu mgbe ahụ.
- source_word: συνεδρίῳ
  choice: ọdụ nzukọ ahụ
  rationale: N’ebe a, ọ pụtara nzukọ ọchịchị na ikpe ndị Juu; e debere nkọwa omenala ahụ n’ala peeji kama iji aha teknịkal dochie okwu Grik.
- source_word: Φαρισαῖος
  choice: onye Farisii
  rationale: Nke a bụ aha otu okpukpe ahụ a na-ejikarị n’Igbo.
- source_word: ὀνόματι Γαμαλιήλ
  choice: aha ya bụ Gameliel
  rationale: Nke a bụ ụzọ Igbo dị mfe ma bụrụkwa nke e ji ekwu na a na-akpọ onye otu aha.
- source_word: νομοδιδάσκαλος
  choice: onye na-akụzi Iwu ahụ
  rationale: Ọ na-egosi onye ọrụ ya bụ ịkụzi Iwu; mkpụrụedemede ukwu na “Iwu” na-eme ka o doo anya na ọ bụ Iwu ndị Juu, ọ bụghị iwu nkịtị.
- source_word: τίμιος παντὶ τῷ λαῷ
  choice: nke ndị mmadụ niile na-asọpụrụ
  rationale: Ọ na-egosipụta ugwu na nkwanye ùgwù ndị mmadụ niile nwere n’ebe ọ nọ, n’asụsụ Igbo dị ndụ.
- source_word: ἐκέλευσεν
  choice: nye iwu
  rationale: Ọ na-egosipụta ntụziaka e nyere n’ike n’ọnọdụ ikpe a.
- source_word: ἔξω ... ποιῆσαι
  choice: ka a kpọpụ ... n’èzí
  rationale: 'Nke a na-ebuga ilu Grik ahụ n’Igbo nkịtị: ime ka ndị ahụ pụọ n’ụlọ nzukọ ruo nwa oge.'
- source_word: βραχύ
  choice: nwa oge
  rationale: Ọ na-echekwa echiche nke obere oge, ọ bụghị naanị ọsọ e ji mee ihe ahụ.
theological_decisions:
- issue: Ihe τοὺς ἀνθρώπους na-ezo aka na ya
  choice: ndị ikom ahụ
  alternative: ndị ahụ; ndị mmadụ ahụ
  rationale: N’ọnọdụ a, okwu ahụ na-ezo aka n’ụmụ nwoke bụ́ ndị ozi nọ n’ihu nzukọ ahụ; “ndị ikom” na-echekwa nkọwa nwoke dị n’okwu na ọnọdụ ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “Iwu” nwere mkpụrụedemede ukwu iji gosi Iwu ndị Juu, ebe “onye na-akụzi Iwu ahụ” na-ezere okwu teknịkal siri ike. E tinyere akara ala peeji [a] na [b] kpọmkwem n’ebe ha metụtara n’ahịrịokwu ahụ.
