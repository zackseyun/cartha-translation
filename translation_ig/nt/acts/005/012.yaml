  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Διὰ δὲ τῶν χειρῶν τῶν ἀποστόλων ἐγίνετο σημεῖα καὶ τέρατα ⸂πολλὰ ἐν τῷ λαῷ⸃· καὶ ἦσαν ὁμοθυμαδὸν ⸀ἅπαντες ἐν τῇ Στοᾷ Σολομῶντος·
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/012.yaml
  text: Many signs and wonders were being done among the people through the hands of the apostles[b][a], and they were all together in Solomon’s Portico.
translation:
  language: ig
  text: Site n’aka ndịozi ka a nọ na-eme ọtụtụ ihe ịrịba ama na ihe ebube n’etiti ndị mmadụ; ha niile nọkọkwara ọnụ[a] n’Ụzọ Ogidi Solomọn[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ha niile nọ n’otu obi.” Okwu Grik na-egosi ma nnọkọ ọnụ ma ịdị n’otu n’ebumnobi.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “n’ụlọ mbata Solomọn.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὰ ... τῶν χειρῶν τῶν ἀποστόλων
  choice: Site n’aka ndịozi
  rationale: “Site n’aka” bụ akpaala okwu Igbo doro anya nke na-echekwa echiche Grik banyere aka dị ka ụzọ e si rụọ ọrụ, ma na-egosikwa na ndịozi bụ ndị e si n’aka ha mee ihe ndị ahụ.
- source_word: δὲ
  choice: -kwa na “nọkọkwara”
  rationale: N’ebe a δέ na-aga n’ihu n’akụkọ kama igosi nnukwu esemokwu. Mgbakwunye “-kwa” na nkebi nke abụọ na-ejikọta ihe omume abụọ ahụ n’ụzọ Igbo na-asụkarị, n’enweghị itinye okwu oge dịka “ugbu a” nke na-adịghị na isi mmalite.
- source_word: ἐγίνετο
  choice: a nọ na-eme
  rationale: Ụdị imperfect ahụ na-egosi ọrụ na-aga n’ihu ma ọ bụ nke a na-eme ugboro ugboro n’oge gara aga. “A nọ na-eme” na-ebute nke a n’Igbo ma na-echekwa olu passive na onye na-eme ihe abụghị isiokwu ahịrịokwu.
- source_word: σημεῖα καὶ τέρατα
  choice: ihe ịrịba ama na ọrụ ebube
  rationale: 'Nke a na-echekwa njikọ okwu abụọ Luk ji eme ihe: σημεῖα dị ka “ihe ịrịba ama,” na τέρατα dị ka ọrụ na-akpata ihe ijuanya, ya bụ “ọrụ ebube.”'
- source_word: πολλὰ
  choice: ọtụtụ
  rationale: “Ọtụtụ” na-akọwa ma ihe ịrịba ama ma ọrụ ebube n’ụzọ dị mfe ma bụrụ Igbo nke oge a.
- source_word: ἐν τῷ λαῷ
  choice: n’etiti ndị mmadụ
  rationale: Nke a na-egosi ebe ma ọ bụ gburugburu ndị e mere ihe ndị ahụ, n’etinyeghị nkọwa agbụrụ nke okwu Grik ekwughị kpọmkwem.
- source_word: ὁμοθυμαδὸν
  choice: nọkọrọ ọnụ
  rationale: “Nọkọrọ ọnụ” bụ okwu Igbo dị mfe nke na-egosi nnọkọ ọnụ. E tinyere echiche ọzọ nke ịdị n’otu obi n’ala ala peeji n’ihi na okwu Grik nwekwara ike imesi ịdị n’otu n’ebumnobi ike.
- source_word: ἅπαντες
  choice: ha niile
  rationale: “Ha niile” na-echekwa oke zuru ezu nke okwu Grik ma hapụ onye kpọmkwem ọ na-ezo aka na ya ka ọ bụrụ nke a na-aghọta site n’okirikiri okwu.
- source_word: Στοᾷ Σολομῶντος
  choice: Ụlọ Ogidi Solomọn
  rationale: στοά bụ ebe ogologo e kpuchiri elu nke ogidi na-akwado. “Ụlọ Ogidi Solomọn” bụ aha dị mkpirikpi, doro anya, ma na-egosi ụdị ihe owuwu ahụ; e debere nsụgharị nkọwa ọzọ n’ala ala peeji.
theological_decisions:
- issue: Onye “ha niile” na-ezo aka na ya
  choice: E hapụrụ “ha niile” n’enweghị ịkọwa ma ọ bụ ndịozi naanị ka ọ bụ ìgwè ndị kwere ekwe niile.
  alternative: Ịsụgharị ya dịka “ndịozi niile” ma ọ bụ “ndị niile kwere ekwe.”
  rationale: Isiokwu nke ἦσαν adịghị n’ahịrịokwu Grik n’ụzọ kpọmkwem, ya mere nsụgharị ekwesịghị idozi ihe isi mmalite hapụrụ ka ọ ghe oghe.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke kwanyere ugwu ma dị mfe nghọta. E zere okwu ochie na nkọwa ụka pụrụ iche. Akara ala ala peeji [a] na [b] dị n’ebe okwu ha na-akọwa nọ.
