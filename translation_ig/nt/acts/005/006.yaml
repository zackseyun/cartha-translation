  text: ἀναστάντες δὲ οἱ νεώτεροι συνέστειλαν αὐτὸν καὶ ἐξενέγκαντες ἔθαψαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/006.yaml
  text: Then the young men rose[a], wrapped him up, carried him out, and buried him.
translation:
  language: ig
  text: Mgbe ahụ, ụmụ okorobịa ahụ[a] biliri, kechie ya, buru ya pụọ, lie ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị ikom ndị ka dị obere.” Okwu Grik νεώτεροι dị n’ụdị ntụnyere, ya mere ọ pụrụ ịpụta “ndị ikom ndị ka dị obere” ma ọ bụ, n’ozuzu, “ụmụ okorobịa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστάντες
  choice: biliri
  rationale: Ọ bụ participle aorist nke ἀνίστημι; n’ebe a ọ na-egosi na ha biliri wee malite ime ihe. “Biliri” na-edobe usoro akụkọ ahụ n’ụzọ Igbo dị mfe.
- source_word: δὲ
  choice: Mgbe ahụ
  rationale: δὲ na-akwalite akụkọ gaa n’ihu; “Mgbe ahụ” na-egosi usoro ihe mere n’Igbo nke ọma.
- source_word: οἱ νεώτεροι
  choice: ụmụ okorobịa ahụ
  rationale: νεώτεροι nwere ọdịdị comparative, ma ọ pụrụ izo aka n’ụmụ nwoke ndị ka dị obere ma ọ bụ n’ụmụ okorobịa n’ozuzu. “Ụmụ okorobịa ahụ” bụ okwu Igbo kwụụrụ onwe ya ma dị mfe nghọta; e debere nhọrọ “ụmụ nwoke ndị ka nta” n’okpuru ala peeji.
- source_word: συνέστειλαν
  choice: kechie ozu ya
  rationale: N’ọnọdụ a, συστέλλω na-egosi ịchịkọta ma ọ bụ ikechi ahụ onye nwụrụ anwụ maka ibupụ ya na ili ya. Ịkpọ “ozu ya” na-eme ka ihe a na-ekwu doo anya n’Igbo n’enweghị ịgbasa ya ka ọ bụrụ nkwadebe olili niile.
- source_word: αὐτὸν
  choice: ozu ya / ya
  rationale: Ọ na-ezo aka n’Ananayas. N’ahịrịokwu nke ikechi, “ozu ya” bụ Igbo nkịtị n’ihi na ọ nwụọla; n’omume ndị sochirinụ, “ya” zuru ezu.
- source_word: ἐξενέγκαντες
  choice: buru ya pụọ
  rationale: Aorist participle nke ἐκφέρω pụtara ibupụ ya n’ebe ahụ; “buru ya pụọ” dabara n’ọnọdụ iburu ozu.
- source_word: ἔθαψαν
  choice: lie ya
  rationale: θάπτω pụtara ili; “lie ya” bụ okwu Igbo doro anya ma bụrụkwa nke a na-ejikarị eme ihe.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke oge a, dị ùgwù ma dị mfe nghọta. E ji “ozu ya” mee ka συνέστειλαν bụrụ ihe a na-ahụ anya ma kwekọọ n’ọnọdụ ọnwụ na olili, ebe ihe edere n’okpuru ala na-echekwa nghọta abụọ nke νεώτεροι.
