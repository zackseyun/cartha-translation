  text: καὶ ἐνοσφίσατο ἀπὸ τῆς τιμῆς, συνειδυίης καὶ τῆς ⸀γυναικός, καὶ ἐνέγκας μέρος τι παρὰ τοὺς πόδας τῶν ἀποστόλων ἔθηκεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/002.yaml
  text: And he kept back some of the price[a], with his wife also knowing it, and bringing a certain part[b], he laid it at the apostles’ feet.
translation:
  language: ig
  text: O ji nzuzo debe ụfọdụ n’ego e rere ala ahụ nye onwe ya[a], nwunye ya makwaara nke a; mgbe o wetara otu akụkụ, o tinye ya n’ụkwụ ndịozi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “o zoro ụfọdụ n’ego e rere ala ahụ.” Ngwaa Grik ahụ na-egosi idebe ụfọdụ ihe nye onwe onye n’ụzọ nzuzo na aghụghọ.
    reason: lexical_alternative
  - marker: b
    text: N’ụzọ nkịtị, “n’ụkwụ ndịozi”; nke a bụ okwu pụtara itinye ego ahụ n’ihu ha.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνοσφίσατο
  choice: wepụrụ ụfọdụ
  rationale: Okwu Grik a na-egosi na o ji aghụghọ zobe ma debe ụfọdụ ihe ahụ nye onwe ya; ‘wepụrụ ụfọdụ’ na-ebute echiche ọjọọ ahụ n’Igbo n’enweghị ịkpọ ya izu ohi n’ụzọ iwu.
- source_word: ἀπὸ τῆς τιμῆς
  choice: n’ego e rere ala ahụ
  rationale: τιμή n’ebe a bụ ego e nwetara n’ire ala ahụ. Nsụgharị a bụ Igbo doro anya ma dabara n’ọnọdụ amaokwu gbara ya gburugburu.
- source_word: συνειδυίης καὶ τῆς γυναικός
  choice: nwunye ya makwaara ihe ahụ
  rationale: 'Nke a na-egosi ọnọdụ so omume ahụ: nwunye ya maara ihe o mere. ‘-kwa-’ na-anọchi καί.'
- source_word: ἐνέγκας
  choice: o wee weta
  rationale: Aorist participle ahụ na-egosi omume mere tupu isi omume ahụ; ‘wee’ na-egosipụta usoro omume ndị ahụ n’Igbo eke.
- source_word: μέρος τι
  choice: otu akụkụ ego ahụ
  rationale: μέρος τι bụ akụkụ a na-akọwaghị oke ya. ‘Otu akụkụ’ na-edobe enweghị nkọwa ahụ ma mee ka ihe a na-ekwu pụta ìhè.
- source_word: παρὰ τοὺς πόδας τῶν ἀποστόλων ἔθηκεν
  choice: dọba ya n’ụkwụ ndịozi
  rationale: Nke a na-edobe ihe oyiyi nkịtị nke itinye ego n’ụkwụ ndịozi, kama ịgbanwe ya naanị ka ọ bụrụ itinye ya n’ihu ha.
theological_decisions:
- issue: Ụdị omume Ananayas mere
  choice: E gosipụtara ya dị ka iji aghụghọ wepụ ma debe ụfọdụ ego ahụ.
  alternative: Ọ hapụrụ naanị ụfọdụ ego ahụ nye onwe ya n’enweghị echiche aghụghọ.
  rationale: νοσφίζομαι na akụkọ gbara ya gburugburu na-egosi izochi ma debe ihe nye onwe ya n’ụzọ na-ezighị ezi; nsụgharị ahụ na-edobe ike omume ọjọọ a ma ghara ịgbakwụnye nkọwa ozizi.
translation_notes:
  register: E ji Standard Igbo nke dị ugbu a, dị ùgwù ma dị mfe nghọta. E debere usoro akụkọ ahụ na ihe oyiyi ‘n’ụkwụ ndịozi,’ ma kọwaa ihe nwere ike ghara ido anya n’ala ala peeji.
