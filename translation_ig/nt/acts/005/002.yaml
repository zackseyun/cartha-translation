revisions:
- from: O wepụrụ ụfọdụ n’ego e rere ala ahụ[a], nwunye ya makwaara ihe ahụ; o wee weta otu akụkụ ego ahụ, dọba ya n’ụkwụ ndịozi[b].
  to: O ji nzuzo debe ụfọdụ n’ego e rere ala ahụ nye onwe ya[a], nwunye ya makwaara nke a; mgbe o wetara otu akụkụ, o tinye ya n’ụkwụ ndịozi[b].
  rationale: The revision restores the morally marked sense of ἐνοσφίσατο as covert personal withholding, makes the prior participial action explicit in idiomatic Standard Igbo, and relocates both footnote anchors to the words their notes actually explain. It retains the source’s ambiguity regarding the exact amount and preserves the physical image of placing the money at the apostles’ feet.
