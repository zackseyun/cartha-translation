  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ θεὸς τῶν πατέρων ἡμῶν ἤγειρεν Ἰησοῦν, ὃν ὑμεῖς διεχειρίσασθε κρεμάσαντες ἐπὶ ξύλου·
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/030.yaml
  text: The God of our fathers raised up Jesus[b][a], whom you killed by hanging on a tree.
translation:
  language: ig
  text: Chineke nke nna nna anyị kpọlitere Jizọs[a], onye unu gburu site n’ịkwụgbu ya n’osisi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “welitere.” N'ebe a, ngwaa ahụ nwere ike izo aka na mbilite n'ọnwụ, ọ bụ ezie na Grik ekwughị kpọmkwem “site n'ọnwụ” n'amaokwu a.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “n'elu obe.” Grik kwuru “n'osisi,” ikekwe iji cheta Diuterọnọmi 21:23.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ θεὸς τῶν πατέρων ἡμῶν
  choice: Chineke nke ndị nna nna anyị
  rationale: Nke a bụ ụzọ doro anya ma bụrụkwa asụsụ Igbo a na-asụ ugbu a isi chekwaa usoro okwu ahụ nke na-ezo aka na Chineke ndị nna nna Izrel.
- source_word: ἤγειρεν
  choice: kpọlitere
  rationale: “Kpọlitere” nwere ike izo aka na mbilite n'ọnwụ n'ọnọdụ a, ma ọ naghị agbakwụnye kpọmkwem okwu “n'ọnwụ” nke na-adịghị n'amaokwu Grik a.
- source_word: Ἰησοῦν
  choice: Jizọs
  rationale: Ọ bụ odide aha a nabatara n'Igbo Ọkọlọtọ.
- source_word: διεχειρίσασθε
  choice: gburu
  rationale: Ngwaa ahụ na-egosi ime ihe ike nke kpatara ọnwụ; “gburu” bụ okwu Igbo kpọmkwem, dị mfe nghọta, nke dabara n'okwu na-esochi ya.
- source_word: κρεμάσαντες
  choice: site n'ịkpọgide ya
  rationale: Nke a na-egosi ụzọ ha si gbuo ya ma na-ada nke ọma n'Igbo; “kpọgide” dabara na ọnọdụ igbu mmadụ n'osisi.
- source_word: ἐπὶ ξύλου
  choice: n'elu osisi
  rationale: “Osisi” na-echekwa ihe ξύλον pụtara na njikọ ya na Diuterọnọmi 21:23, kama ịkọwa ya ozugbo dị ka “obe.”
theological_decisions:
- issue: Ma a ga-eme ka ἤγειρεν kwuo kpọmkwem banyere mbilite n'ọnwụ
  choice: kpọlitere
  alternative: kpọlitere ya n'ọnwụ
  rationale: Ọnọdụ gbara amaokwu ahụ gburugburu na-egosi mbilite n'ọnwụ, ma amaokwu Grik a etinyeghị okwu “n'ọnwụ”; ya mere nsụgharị ahụ na-echekwa nghọta na esemokwu dị na isi mmalite.
- issue: Ma a ga-asụgharị ξύλον dị ka “obe”
  choice: n'elu osisi
  alternative: n'elu obe
  rationale: Isi mmalite ji ξύλον, ọ bụghị σταυρός. “Osisi” na-echekwa okwu ahụ na njikọ o nwere ike inwe na Diuterọnọmi 21:23, ebe “obe” bụ nkọwa dabara n'ọnọdụ ahụ.
translation_notes:
  register: Igbo Ọkọlọtọ dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji “ndị nna nna anyị” chekwaa usoro okwu Akwụkwọ Nsọ; e jikwa “osisi” chekwaa okwu Grik na njikọ Agba Ochie ya.
