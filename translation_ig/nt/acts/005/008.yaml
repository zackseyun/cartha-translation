base_translation:
  language: en
  yaml_path: translation/nt/acts/005/008.yaml
  text: But Peter answered her[a], “Tell me, did you sell the land for this much?” And she said, “Yes, for this much.”
translation:
  language: ig
  text: Ma Pita zara ya, sị, “Gwa m, ọ̀ bụ n’ego a ka unu rere ala ahụ[a]?” Ọ sịrị, “Ee, ọ bụ n’ego a.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “ihe onwunwe ahụ” ma ọ bụ “ubi ahụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη δὲ πρὸς αὐτὴν
  choice: Ma Pita zara ya, sị
  rationale: “Ma” na-egosi ntụgharị dị n’akụkọ ahụ; “zara ya, sị” bụ ụzọ Igbo nkịtị si webata okwu onye kwuru, ma na-echekwa na Pita gwara nwanyị ahụ okwu.
- source_word: Εἰπέ μοι
  choice: Gwa m
  rationale: Nke a bụ ntụgharị Igbo doro anya nke iwu a nyere mmadụ ka ọ gwa onye na-ajụ ajụjụ ihe.
- source_word: εἰ
  choice: ajụjụ ee-ma-ọbụ-mba e gosiri site n’usoro ajụjụ Igbo
  rationale: N’ebe a εἰ na-ewebata ajụjụ a ga-aza ee ma ọ bụ mba; Igbo na-egosi nke a nke ọma site n’usoro ajụjụ kpọmkwem n’enweghị okwu ọzọ pụrụ ime ka ahịrịokwu sie ike.
- source_word: τοσούτου
  choice: n’ego a / ego a
  rationale: Okwu a na-arụtụ aka n’ọnụ ego e kwuru ma ọ bụ e gosiri n’ọnọdụ ahụ. Ikwughachi “ego a” n’ajụjụ na n’azịza na-echekwa nkwughachi nke Grik.
- source_word: τὸ χωρίον
  choice: ala ahụ
  rationale: χωρίον nwere ike ịbụ otu ibé ala, ubi, ma ọ bụ ihe onwunwe. “Ala ahụ” bụ okwu nkịtị, doro anya n’ọnọdụ ire ihe ahụ, ma ọ naghị akọwa ụdị ala ahụ karịa ihe ederede kwuru.
- source_word: ἀπέδοσθε
  choice: unu rere
  rationale: N’ọnọdụ azụmahịa a, ἀποδίδωμι pụtara ire. “Unu” na-echekwa ụdị onye nke abụọ ọtụtụ nke ngwaa Grik, nke nwere ike ịgụnye Safaịra na di ya.
- source_word: Ναί
  choice: Ee
  rationale: Nke a bụ azịza nkwenye dị mfe ma kwekọọ n’okwu Grik.
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị mfe ma nwee ugwu, dee ya. E debere “unu” iji gosipụta ọtụtụ mmadụ dị na ἀπέδοσθε, ma e zere ịgbakwunye nkọwa gbasara ihe mere ala ahụ ji bụrụ nke di na nwunye ahụ.
