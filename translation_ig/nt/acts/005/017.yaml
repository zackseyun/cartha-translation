revisions:
- from: Ma nnukwu onye nchụàjà biliri, ya na ndị niile ha na ya nọ—ya bụ, òtù ndị Sadusii[a]—iwe anyaụfụ wee jupụta ha.[b]
  to: Ma onyeisi nchụàjà biliri, ya na ndị niile so ya—ya bụ, òtù ndị Sadusii[a]—ha wee jupụta n'anyaụfụ[b].
  rationale: The revision corrects the Igbo syntax so that the high priest and his associates, rather than jealousy itself, are the ones filled. It also uses the idiomatic title “onyeisi nchụàjà.” The appositional identification of the associates and both lexical alternatives are retained, with each footnote marker placed beside the term it explains.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T08:28:17Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly identifies the high priest, his associates as the Sadducees' party, and their hostile ζῆλος. However, “iwe anyaụfụ wee jupụta ha” says, in effect, that jealous anger filled them, rather than that they were filled with jealousy; it does not appropriately render the Greek passive ἐπλήσθησαν.
  naturalness: “Nnukwu onye nchụàjà” is less idiomatic and may sound merely descriptive. “Onyeisi nchụàjà” is the established, natural Standard Igbo title. The revised predicate “ha wee jupụta n'anyaụfụ” is clear, grammatical Igbo.
  terminology: “Òtù ndị Sadusii” suitably renders αἵρεσις without importing later polemical senses. “Anyaụfụ” appropriately conveys the negative contextual force of ζῆλος. The alternative “ekworo” remains useful in the footnote.
  issues:
  - severity: medium
    issue: The clause “iwe anyaụfụ wee jupụta ha” reverses the filling construction.
    rationale: ἐπλήσθησαν ζήλου means that the high priest and those with him were filled with jealousy. In Igbo, “ha jupụtara n'anyaụfụ” preserves both the plural subject and the passive/resultative sense.
  - severity: low
    issue: “Nnukwu onye nchụàjà” is not the most natural title for the high priest.
    rationale: “Onyeisi nchụàjà” is a more idiomatic Standard Igbo office title and does not alter the singular referent.
  revised_text: Ma onyeisi nchụàjà biliri, ya na ndị niile so ya—ya bụ, òtù ndị Sadusii[a]—ha wee jupụta n'anyaụfụ[b].
  revised_footnotes:
  - marker: a
    text: A pụkwara ịsị, “ngalaba ndị Sadusii.” Okwu Grik ahụ nwere ike ịpụta òtù, ngalaba, ma ọ bụ ìgwè nwere otu echiche.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsị, “ekworo.” Okwu Grik ahụ nwekwara ike ịpụta “ịnụ ọkụ n'obi,” ma n'ebe a ọnọdụ akụkọ ahụ na-akwado nghọta ọjọọ.
    reason: lexical_alternative
