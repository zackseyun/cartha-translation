  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἀναστὰς δὲ ὁ ἀρχιερεὺς καὶ πάντες οἱ σὺν αὐτῷ, ἡ οὖσα αἵρεσις τῶν Σαδδουκαίων, ἐπλήσθησαν ζήλου
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/017.yaml
  text: But the high priest rose up[a], and all those with him—that is[b], the party of the Sadducees—and were filled with jealousy.
translation:
  language: ig
  text: Ma onyeisi nchụàjà biliri, ya na ndị niile so ya—ya bụ, òtù ndị Sadusii[a]—ha wee jupụta n'anyaụfụ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “ngalaba ndị Sadusii.” Okwu Grik ahụ nwere ike ịpụta òtù, ngalaba, ma ọ bụ ìgwè nwere otu echiche.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsị, “ekworo.” Okwu Grik ahụ nwekwara ike ịpụta “ịnụ ọkụ n'obi,” ma n'ebe a ọnọdụ akụkọ ahụ na-akwado nghọta ọjọọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀναστὰς
  choice: biliri
  rationale: Okwu a bụ participle aorist nke ἀνίστημι, nke na-amalite omume siri ike n'akụkọ; “biliri” na-edobe ike akụkọ ahụ n'Igbo eke.
- source_word: δὲ
  choice: Ma
  rationale: N'ebe a δέ na-egosi ntakịrị ntụgharị megide nnabata ọma ndịozi nwetara tupu nke a.
- source_word: ὁ ἀρχιερεὺς
  choice: nnukwu onye nchụàjà
  rationale: Nke a bụ aha ọkwá onyeisi ndị nchụàjà n'ọnọdụ a, ọ bụghị nanị otu onye nchụàjà dị elu n'ọkwa.
- source_word: πάντες οἱ σὺν αὐτῷ
  choice: ndị niile ha na ya nọ
  rationale: Ọ na-ezo aka n'òtù ndị kwadoro nnukwu onye nchụàjà, na-akọwaghị karịa ihe Grik kwuru banyere ọnọdụ ha kpọmkwem.
- source_word: ἡ οὖσα αἵρεσις τῶν Σαδδουκαίων
  choice: ya bụ, òtù ndị Sadusii
  rationale: αἵρεσις ebe a pụtara otu ma ọ bụ ngalaba okpukpe n'etiti ndị Juu, ọ bụghị “ozizi ụgha” n'echiche e mesịrị; “òtù” bụ okwu doro anya na nke na-adịghị ebubata ikpe ozizi.
- source_word: ἐπλήσθησαν
  choice: wee jupụta ha
  rationale: A na-edobe akpaalaokwu Grik nke ịbụ ihe jupụtara mmadụ, ma hazie ya n'ụdị Igbo eke.
- source_word: ζήλου
  choice: iwe anyaụfụ
  rationale: ζῆλος nwere ike ịpụta ịnụ ọkụ n'obi, ekworo, ma ọ bụ anyaụfụ; n'ọnọdụ mmegide a, “iwe anyaụfụ” na-egosi mmetụta ọjọọ na-akpali omume ha n'emebighị ndò nke iwe dị na ya.
theological_decisions:
- issue: Nsụgharị αἵρεσις
  choice: òtù
  alternative: ngalaba okpukpe
  rationale: “Òtù” na-egosi ìgwè a maara ama n'ime okpukpe ndị Juu, ma zere ibubata echiche e mesịrị nke ịkatọ ozizi dị ka heresy.
- issue: Nsụgharị ζῆλος n'ọnọdụ a
  choice: iwe anyaụfụ
  alternative: ekworo; ịnụ ọkụ n'obi
  rationale: Okwu Grik ahụ nwere nghọta ọma ma ọ bụ ọjọọ, ma omume mmegide sochirinụ na-akwado nghọta ọjọọ. Ihe odide ala peeji na-echekwa nghọta ndị ọzọ okwu ahụ nwere.
translation_notes:
  register: Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E jiri “ya bụ” mee ka apposition Grik doo anya; e debere ihe nrịbama ala peeji [a] na [b] n'akụkụ okwu ha na-akọwa.
