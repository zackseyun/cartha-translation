review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the governing sense of ὡς οὐδὲν ὑπεστειλάμην, the paired actions of declaring and teaching, δημόσια, and the distributive κατ’ οἴκους. However, “ga-abara unu uru” gives the beneficial quality an unnecessarily future-oriented sense; the Greek refers to things beneficial/helpful. The footnote’s added “kama” introduces a contrast not present in the source and its wording does not cleanly function as a lexical alternative.
  naturalness: The register is clear, modern Standard Igbo. “N’ụlọ n’ụlọ” is a more idiomatic and compact way to express the distributive ‘from house to house’ than “site n’ụlọ ruo n’ụlọ.”
  terminology: “Ịla azụ n’ikwusara” suitably conveys Paul’s not shrinking back/holding back. “Ihe ọ bụla bara unu uru” preserves the broad sense of τῶν συμφερόντων without restricting it to financial or explicitly spiritual benefit. “N’ihu ọha” and “ịkụziri unu ihe” are natural and appropriate.
  issues:
  - severity: low
    issue: Future-oriented wording for τῶν συμφερόντων
    rationale: “Ga-abara unu uru” can suggest what will benefit them later. “Bara unu uru” more directly expresses the Greek’s description of beneficial things.
  - severity: low
    issue: House-to-house idiom
    rationale: “N’ụlọ n’ụlọ” naturally marks the distributive sense of κατ’ οἴκους in Standard Igbo.
  - severity: medium
    issue: Footnote adds an unsupported contrast
    rationale: The phrase “kama m kwusara ya nye unu” adds a ‘but’ contrast not expressed in the Greek and is not needed for the lexical alternative. A concise alternative should preserve the sense of not withholding.
  revised_text: otu m si ghara ịla azụ n’ikwusara unu ihe ọ bụla bara unu uru na ịkụziri unu ihe n’ihu ọha nakwa n’ụlọ n’ụlọ.[a]
  revised_footnotes:
