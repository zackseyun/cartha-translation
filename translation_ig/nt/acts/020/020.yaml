revisions:
- from: otu m si ghara ịla azụ n’ikwusara unu ihe ọ bụla ga-abara unu uru, na ịkụziri unu ihe n’ihu ọha nakwa site n’ụlọ ruo n’ụlọ.[a]
  to: otu m si ghara ịla azụ n’ikwusara unu ihe ọ bụla bara unu uru na ịkụziri unu ihe n’ihu ọha nakwa n’ụlọ n’ụlọ.[a]
  rationale: The revision removes the prospective nuance from “ga-abara,” uses the idiomatic distributive expression “n’ụlọ n’ụlọ,” and replaces the footnote with a faithful lexical alternative that does not add a contrast or omit relevant nuance through paraphrase. The main text retains the source’s coordinated declaring and teaching under the single idea of not shrinking back.
  reviewer_model: gpt-5.6-terra
