  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὡς οὐδὲν ὑπεστειλάμην τῶν συμφερόντων τοῦ μὴ ἀναγγεῖλαι ὑμῖν καὶ διδάξαι ὑμᾶς δημοσίᾳ καὶ κατ’ οἴκους,
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/020.yaml
  text: how I did not shrink back from declaring to you anything that was profitable and teaching you publicly and from house to house,[a]
translation:
  language: ig
  text: otu m si ghara ịla azụ n’ikwusara unu ihe ọ bụla bara unu uru na ịkụziri unu ihe n’ihu ọha nakwa n’ụlọ n’ụlọ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “otu m si ghara izochiri unu ihe ọ bụla bara unu uru.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς
  choice: otu m si
  rationale: N’ọnọdụ a, ὡς na-ewebata ụzọ Pọl si jee ozi, ya mere “otu m si” na-ejikọta amaokwu a nke ọma na ncheta dị n’amaokwu ndị bu ya ụzọ.
- source_word: ὑπεστειλάμην
  choice: ghara ịla azụ
  rationale: Nkebiokwu a na-egosi na Pọl atụghị ụjọ ma ọ bụ zere ime ka ha mata ihe bara uru; ọ na-edobekwa ike nke middle ὑποστέλλω n’asụsụ Igbo dị mfe nghọta.
- source_word: τῶν συμφερόντων
  choice: ihe ọ bụla ga-abara unu uru
  rationale: Nke a na-egosipụta ihe bara ndị na-ege ntị uru n’enweghị ime ka isi okwu ahụ bụrụ naanị uru ego ma ọ bụ ịkọwa ya n’ụzọ okpukpe karịrị ihe Grik kwuru.
- source_word: τοῦ μὴ ἀναγγεῖλαι / ἀναγγεῖλαι
  choice: n’ikwusara unu
  rationale: Articular infinitive a na-akọwa ihe Pọl na-alaghị azụ ime. “Ikwusara” na-enye echiche nke ime ka ozi mara n’ụzọ doro anya ma kwesịkwa ọnọdụ ozi ya.
- source_word: διδάξαι
  choice: na ịkụziri unu ihe
  rationale: “Ịkụziri unu ihe” bụ ụzọ Igbo kwụ ọtọ ma dị ndụ isi gosipụta διδάσκω, ma ọ na-anọgide bụrụ ọrụ jikọrọ ya na ikwusa ozi.
- source_word: δημοσίᾳ
  choice: n’ihu ọha
  rationale: Nke a bụ ụzọ Igbo nkịtị si ekwu na ihe mere n’ebe ọha na-ahụ ma na-anụ ya.
- source_word: κατ’ οἴκους
  choice: site n’ụlọ ruo n’ụlọ
  rationale: 'Nke a na-edobe echiche distributive nke κατά: ozi ahụ ruru ụlọ dị iche iche n’otu n’otu, ọ bụghị naanị na e mere ya n’ụlọ n’ozuzu.'
theological_decisions:
- issue: Ihe “ga-abara unu uru” pụtara
  choice: E debere ya n’ụzọ sara mbara dịka ihe ga-abara ndị na-ege ntị uru.
  alternative: Ịkọwa ya kpọmkwem dịka naanị uru ime mmụọ ma ọ bụ uru nkuzi okpukpe.
  rationale: Ọnọdụ ahụ na-egosi uru ime mmụọ na nke nlekọta ndị kwere ekwe, ma okwu Grik n’onwe ya sara mbara. Ya mere, nsụgharị ahụ anaghị etinye nkọwa ozizi karịrị ihe ederede kwuru.
- issue: Mmekọrịta dị n’etiti ikwusa na ịkụzi
  choice: E mere ha ka ha bụrụ ọrụ abụọ jikọrọ ọnụ nke Pọl na-alaghị azụ ime.
  alternative: Ịgụ nke ọ bụla dịka okwu nwere usoro njikwa nke ya.
  rationale: Otu ngwaa a jụrụ ajụ na-achị infinitive abụọ ahụ na Grik; nsụgharị Igbo ahụ na-egosipụta njikọ ahụ n’enweghị ime ka ha bụrụ otu ihe kpamkpam.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. “Ịla azụ” na-edobe idiom nke isi mmalite, ebe nkọwa ala peeji na-enye echiche ọzọ nke “ijighị ihe azụ” ma ọ bụ “izochighị” n’enweghị ịgbanwe isi ederede.
