revisions:
- from: Otu nwa okorobịa aha ya bụ Yutikọs, onye nọ ọdụ na windo, nọ na-adaba n’oké ụra mgbe Pọl nọ na-ekwu okwu ogologo oge. Mgbe ụra rikpuru ya, o si n’ụlọ elu nke atọ daa n’ala, e wee bulie ya, ọ nwụọla.[a]
  to: Otu nwa okorobịa aha ya bụ Yutikọs nọ ọdụ na windo, na-emikpu n’ụra miri emi mgbe Pọl na-ekwu okwu ruo ogologo oge. Mgbe ụra rikpuru ya, o si n’ụlọ elu nke atọ daa n’ala, e wee bulie ya, ọ nwụrụ anwụ.[a]
  rationale: The revision retains the source’s syntax and narrative force while correcting the result clause so that it says Eutychus was picked up dead, not that he had already died. It also improves idiomatic Standard Igbo for sinking into deep sleep and gives a restrained footnote that reflects the stated lexical alternative.
  reviewer_model: gpt-5.6-terra
