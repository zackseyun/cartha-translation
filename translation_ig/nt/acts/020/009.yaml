  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸀καθεζόμενος δέ τις νεανίας ὀνόματι Εὔτυχος ἐπὶ τῆς θυρίδος, καταφερόμενος ὕπνῳ βαθεῖ διαλεγομένου τοῦ Παύλου ἐπὶ πλεῖον, κατενεχθεὶς ἀπὸ τοῦ ὕπνου ἔπεσεν ἀπὸ τοῦ τριστέγου κάτω καὶ ἤρθη νεκρός.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/009.yaml
  text: And a certain young man named Eutychus[a], sitting in the window, was sinking into a deep sleep while Paul was speaking at length; and being overcome by sleep, he fell down from the third story and was picked up dead.
translation:
  language: ig
  text: Otu nwa okorobịa aha ya bụ Yutikọs nọ ọdụ na windo, na-emikpu n’ụra miri emi mgbe Pọl na-ekwu okwu ruo ogologo oge. Mgbe ụra rikpuru ya, o si n’ụlọ elu nke atọ daa n’ala, e wee bulie ya, ọ nwụrụ anwụ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ịsụgharị ya: “e wee bulie ya elu, ọ nwụrụ anwụ.” Ngwaa Grik ahụ nwere ike ịpụta “ibuli” ma ọ bụ “ibuli elu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθεζόμενος
  choice: onye nọ ọdụ
  rationale: Na-egosi ọnọdụ Yutikọs nọ na ya n’oge ihe ndị a na-eme; okwu a bụ asụsụ Igbo nkịtị ma doo anya.
- source_word: τις νεανίας
  choice: otu nwa okorobịa
  rationale: “Otu” na-egosipụta indefiniteness nke τις, ebe “nwa okorobịa” na-egosi nwoke na-eto eto nke νεανίας pụtara.
- source_word: ὀνόματι Εὔτυχος
  choice: aha ya bụ Yutikọs
  rationale: Nke a bụ ụzọ e si ekwu ya n’Igbo n'ụzọ dị mfe ma kwekọọ n’echiche dative ὀνόματι.
- source_word: ἐπὶ τῆς θυρίδος
  choice: na windo
  rationale: θυρίς bụ oghere windo; ọnọdụ akụkọ ahụ na-egosi na ọ nọ n’ebe windo ahụ dị, nke mere ka o nwee ike ịda.
- source_word: καταφερόμενος ὕπνῳ βαθεῖ
  choice: nọ na-adaba n’oké ụra
  rationale: 'Na-echekwa mmegharị nke participle ahụ: ọ bụghị naanị na ụra bịara ya, kama ọ nọ na-emikpu n’ụra miri emi.'
- source_word: διαλεγομένου τοῦ Παύλου ἐπὶ πλεῖον
  choice: mgbe Pọl nọ na-ekwu okwu ogologo oge
  rationale: Genitive absolute ahụ na-enye ọnọdụ oge; ebe a διαλέγομαι bụ ikwu okwu, ἐπὶ πλεῖον bụ ime ya ogologo oge.
- source_word: κατενεχθεὶς ἀπὸ τοῦ ὕπνου
  choice: mgbe ụra rikpuru ya
  rationale: Na-egosi oge ụra meriri ya kpamkpam, ma na-edobe njikọ ihe kpatara ọdịda ahụ.
- source_word: ἔπεσεν ἀπὸ τοῦ τριστέγου κάτω
  choice: o si n’ụlọ elu nke atọ daa n’ala
  rationale: Na-egosi ma ebe o si daa—ọkwa nke atọ—ma mmegharị ya gbadaa dịka κάτω si kwuo.
- source_word: ἤρθη νεκρός
  choice: e wee bulie ya, ọ nwụọla
  rationale: αἴρω passive pụtara ibuli ma ọ bụ iwepụ; nkebi nke abụọ na-ekwupụta νεκρός n’enweghị ime ka ọ dị nro dịka “ọ dị ka onye nwụrụ anwụ.”
theological_decisions:
- issue: Ma a ga-eme ka νεκρός dị nro ka ọ bụrụ “ọ dị ka onye nwụrụ anwụ”
  choice: ọ nwụọla
  alternative: ọ dị ka onye nwụrụ anwụ
  rationale: Grik kwuru νεκρός ozugbo n’enweghị ihe na-egosi ejighị n’aka; ya mere ntụgharị ahụ na-edobe nkwupụta akụkọ ahụ na esemokwu ya.
- issue: Otu a ga-esi ghọta ἤρθη
  choice: e wee bulie ya
  alternative: e wee buru ya pụọ
  rationale: Ngwaa ahụ nwere ike ịpụta ibuli mmadụ ma ọ bụ iwepụ ya; isi ederede họọrọ okwu sara mbara, ebe nkọwa ala peeji na-echekwa ụzọ ọzọ.
translation_notes:
  register: Asụsụ Igbo Ọha bụ nke ugbu a, dị ùgwù ma dị mfe nghọta. E ji “Yutikọs” na “Pọl” dee aha ndị ahụ n’ụdị a na-ahụkarị n’Igbo. E tinyere akara [a] kpọmkwem n’isi ederede ka o kwekọọ na nkọwa ala peeji.
