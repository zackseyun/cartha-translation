id: ACT.20.24
reference: Acts 20:24
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀλλ’ οὐδενὸς ⸀λόγου ⸀ποιοῦμαι τὴν ⸀ψυχὴν τιμίαν ἐμαυτῷ ὡς ⸀τελειῶσαι τὸν δρόμον ⸀μου καὶ τὴν διακονίαν ἣν ἔλαβον παρὰ τοῦ κυρίου Ἰησοῦ, διαμαρτύρασθαι τὸ εὐαγγέλιον τῆς χάριτος τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/024.yaml
  text: 'But I do not count my life as of any value to myself[c][b][a], if only I may finish my course and the ministry that I received from the Lord Jesus: to testify to the gospel of the grace of God.'
translation:
  language: ig
  text: Ma anaghị m ewere ndụ m dị ka ihe bara uru nye onwe m[a], ọ bụrụ naanị na m ga-emecha ọsọ m[b] na ozi ahụ m natara n'aka Onyenwe anyị Jizọs—ịgba akaebe[c] banyere ozi ọma nke amara Chineke.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “mkpụrụ obi m dị ka ihe dị oké ọnụ ahịa nye m.” N'ebe a, “ndụ” ka mma n'ihi na Pọl na-ekwu maka ịdị njikere ya iche ọnwụ ihu ka o wee mezuo ozi ya.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ụzọ ọsọ m.” Okwu Grik ahụ bụ δρόμος, ya bụ ụzọ ma ọ bụ ọsọ a na-agba ruo n'ọgwụgwụ.
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “ịgba akaebe siri ike” banyere ozi ọma nke amara Chineke.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδενὸς λόγου ποιοῦμαι ... τιμίαν ἐμαυτῷ
  choice: anaghị m ewere ndụ m dị ka ihe bara uru nye onwe m
  rationale: Nke a na-egosipụta akpaalaokwu Grik nke ịghara ịgụ ihe dị ka ihe bara uru, ma na-ada nke ọma n'Igbo ugbu a.
- source_word: ψυχήν
  choice: ndụ
  rationale: N'ebe a, Pọl na-ekwu maka ịdị njikere ya iche ọnwụ ihu ka o wee mezuo ozi ya; ya mere ‘ndụ’ dabara karịa ‘mkpụrụ obi.’
- source_word: ὡς τελειῶσαι
  choice: ọ bụrụ naanị na m ga-emecha
  rationale: Nke a na-egosipụta na imecha ọrụ ahụ bụ ihe kacha Pọl mkpa, ma na-edobe mkpirikpi na mgbagwoju anya dị n'usoro Grik.
- source_word: δρόμον
  choice: ọsọ m
  rationale: ‘Ọsọ’ na-echekwa ihe atụ nke onye na-agba ọsọ ruo n'ọgwụgwụ, nke δρόμος nwere ike ịpụta n'okwu a.
- source_word: διακονίαν
  choice: ozi
  rationale: N'ebe a, okwu ahụ bụ ọrụ e nyere Pọl ka ọ rụọ. ‘Ozi’ bụ okwu Igbo doro anya ma kwekọọ n'ọrụ sitere n'aka Onyenwe anyị.
- source_word: παρὰ τοῦ κυρίου Ἰησοῦ
  choice: n'aka Onyenwe anyị Jizọs
  rationale: ‘N'aka’ na-egosi isi mmalite nke ozi ahụ n'ụzọ Igbo ebumpụta ụwa, ebe ‘Onyenwe anyị Jizọs’ na-echekwa utu aha κύριος.
- source_word: διαμαρτύρασθαι
  choice: ịgba akaebe
  rationale: Okwu a na-egosi ịgba akaebe siri ike ma ọ bụ nke e ji nkwụsi ike kwuo; ‘ịgba akaebe’ bụ ntụgharị doro anya na nke a na-aghọta nke ọma.
- source_word: εὐαγγέλιον
  choice: ozi ọma
  rationale: ‘Ozi ọma’ na-ebute ihe εὐαγγέλιον pụtara kpọmkwem ma bụrụkwa okwu Ndị Kraịst maara nke ọma n'Igbo.
- source_word: τῆς χάριτος τοῦ θεοῦ
  choice: nke amara Chineke
  rationale: Nke a na-echekwa njikọ genitive Grik, nke nwere ike ịpụta ozi ọma nke amara Chineke ji mara ma ọ bụ ozi ọma banyere amara ya, n'ebughị ụzọ mechie otu nghọta.
theological_decisions:
- issue: Ihe ψυχή pụtara n'okwu Pọl banyere onwe ya
  choice: ndụ
  alternative: mkpụrụ obi
  rationale: Ọnọdụ okwu a bụ ịdị njikere Pọl iche ahụhụ na ọnwụ ihu iji mezuo ozi ya; ‘ndụ’ anaghị ebubata nkewa ahụ na mkpụrụ obi nke akụkụ Akwụkwọ Nsọ a anaghị elekwasị anya na ya.
- issue: Ike na ọrụ ὡς τελειῶσαι
  choice: ọ bụrụ naanị na m ga-emecha
  alternative: ka m wee mecha
  rationale: Nhọrọ a na-egosi na imecha ọsọ na ozi ya bụ ọchịchọ kachasị Pọl mkpa, ma ghara ime ka okwu ahụ bụrụ naanị nkebiokwu na-egosi nzube.
- issue: Njikọ dị na τὸ εὐαγγέλιον τῆς χάριτος τοῦ θεοῦ
  choice: ozi ọma nke amara Chineke
  alternative: ozi ọma banyere amara Chineke
  rationale: Usoro a na-edobe ohere na genitive ahụ na-akọwa ma ọdịdị ozi ọma ahụ ma ihe ọ na-ekwu banyere ya, kama ịhọrọ naanị otu n'ime ha.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-echekwa ihe atụ nke ịgba ọsọ, isi mmalite nke ozi Pọl, na mgbagwoju anya dị na ‘ozi ọma nke amara Chineke.’ Ihe nrịbama nkọwa ala ala [a], [b], na [c] niile pụtara n'ederede bụ isi.
