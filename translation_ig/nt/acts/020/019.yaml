  variant: Standard Igbo
source:
  edition: SBLGNT
  text: δουλεύων τῷ κυρίῳ μετὰ πάσης ταπεινοφροσύνης ⸀καὶ δακρύων καὶ πειρασμῶν τῶν συμβάντων μοι ἐν ταῖς ἐπιβουλαῖς τῶν Ἰουδαίων·
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/019.yaml
  text: serving the Lord with all humility and with tears and trials that happened to me through the plots of the Jews[a][b].
translation:
  language: ig
  text: na-ejere Onyenwe anyị ozi n’ịdị umeala n’obi niile, na anya mmiri na ọnwụnwa[a] ndị dakwasịrị m site n’atụmatụ ọjọọ nke ndị Juu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya ‘ule’ ma ọ bụ ‘mkpagbu.’ N’ebe a, ọ pụtara ahụhụ sitere na mmegide, ọ bụghị ọnwụnwa nke ime mmehie.
    reason: lexical_alternative
  - marker: b
    text: Nke a na-ekwu maka ụfọdụ ndị Juu bụ ndị megidere Pọl ma kpara atụmatụ ọjọọ megide ya, ọ bụghị ndị Juu niile.
    reason: cultural_note
lexical_decisions:
- source_word: δουλεύων
  choice: na-ejere ... ozi
  rationale: Ọ bụ participle nke na-egosi otú Pọl si nọgide na-eje ozi. Nkebi a bụ okwu Igbo dị mfe ma bụrụkwa nke kwesịrị nsọpụrụ, nke na-egosi ọrụ o ji obi ya niile rụọ n’akọwaghị ya kpọmkwem dị ka ọnọdụ ohu.
- source_word: τῷ κυρίῳ
  choice: Onyenwe anyị
  rationale: Nke a na-edobe utu aha κύριος n’enweghị ịkọwapụta aha onye e bu n’obi karịa otú Grik si mee; n’ebe a, ọ na-ezo aka n’Onyenwe anyị Jizọs.
- source_word: μετὰ πάσης ταπεινοφροσύνης
  choice: n’ịdị umeala n’obi n’ụzọ zuru ezu
  rationale: Ọ na-egosi ụzọ e si jee ozi, ebe πάσης na-eme ka echiche ịdị umeala n’obi sie ike ma zuo oke.
- source_word: δακρύων
  choice: anya mmiri
  rationale: A sụgharịrị aha ahụ n’ụzọ nkịtị iji chekwaa mmetụta miri emi dị n’okwu Pọl.
- source_word: πειρασμῶν
  choice: ọnwụnwa
  rationale: Okwu Igbo a nwere ike ịpụta ọnwụnwa, ule, ma ọ bụ mkpagbu siri ike. Ihe gbara amaokwu ahụ gburugburu na-egosi na ebe a ọ bụ ahụhụ sitere na mmegide, nke nkọwa ala peeji mere ka doo anya.
- source_word: τῶν συμβάντων μοι
  choice: ndị dakwasịrị m
  rationale: Nke a na-egosi na ọnwụnwa ndị ahụ mere Pọl n’onwe ya; ‘dakwasịrị m’ bụ okwu Igbo ebumpụta ụwa maka nsogbu bịara mmadụ.
- source_word: ἐν ταῖς ἐπιβουλαῖς
  choice: n’ihi izu ọjọọ
  rationale: ἐν nwere ike igosi ọnọdụ, ụzọ, ma ọ bụ ihe kpatara ya. N’ebe a, ‘n’ihi’ na-eme ka njikọ dị n’etiti izu ọjọọ ahụ na ọnwụnwa Pọl doo anya, ebe ‘izu ọjọọ’ na-egosi atụmatụ nzuzo e mere imerụ ya ahụ.
- source_word: τῶν Ἰουδαίων
  choice: nke ndị Juu
  rationale: A nọgidere n’okwu nkịtị nke Grik kama ịgbanwe ya ka ọ bụrụ ‘ndị ndú ndị Juu.’ Nkọwa ala peeji na-egbochi mmadụ ịghọta ya dị ka ebubo megide ndị Juu niile.
theological_decisions:
- issue: Enwere ike ịghọta ‘ndị Juu’ dịka ebubo megide ndị Juu niile
  choice: E debere ‘ndị Juu’ n’ahịrịokwu, ma kọwaa na ọ bụ ndị mmegide Juu ụfọdụ gbara Pọl izu ọjọọ.
  alternative: ndị ndú ndị Juu; ndị mmegide Juu
  rationale: Grik kwuru τῶν Ἰουδαίων n’enweghị okwu pụtara ‘ndị ndú.’ Ya mere, ntụgharị ahụ na-edobe okwu isi mmalite, ebe nkọwa ala peeji na-egosi oke ihe ọnọdụ akụkọ ahụ pụtara ma gbochie ịgbasa ebubo ahụ n’ebe ndị Juu niile nọ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Nhazi ahịrịokwu ahụ na-ejigide ụzọ atọ e si kọwaa ije ozi Pọl—ịdị umeala n’obi, anya mmiri, na ọnwụnwa—ma jiri akara nkọwa [a] na [b] kpọmkwem n’ebe okwu ndị metụtara ha dị.
