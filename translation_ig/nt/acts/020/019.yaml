revisions:
- from: na-ejere Onyenwe anyị ozi n’ịdị umeala n’obi n’ụzọ zuru ezu, na anya mmiri, nakwa n’ọnwụnwa[a] ndị dakwasịrị m n’ihi izu ọjọọ nke ndị Juu[b].
  to: na-ejere Onyenwe anyị ozi n’ịdị umeala n’obi niile, na anya mmiri na ọnwụnwa[a] ndị dakwasịrị m site n’atụmatụ ọjọọ nke ndị Juu[b].
  rationale: The revision makes the humility phrase idiomatic and concise, and replaces the strictly causal “n’ihi” with “site n’,” which better accommodates the Greek preposition’s instrumental/circumstantial force. It retains the source’s reference to “the Jews” while the footnote explicitly limits the reference to the hostile people in this context.
