id: ACT.20.25
reference: Acts 20:25
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Καὶ νῦν ἰδοὺ ἐγὼ οἶδα ὅτι οὐκέτι ὄψεσθε τὸ πρόσωπόν μου ὑμεῖς πάντες ἐν οἷς διῆλθον κηρύσσων τὴν ⸀βασιλείαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/025.yaml
  text: And now, look, I know that none of you among whom I went about proclaiming the kingdom will see my face again.
translation:
  language: ig
  text: Ma ugbu a, leenụ, ama m na unu niile ndị m jere n’etiti unu na-ekwusa alaeze ahụ agaghị ahụ ihu m ọzọ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ νῦν ἰδοὺ
  choice: Ma ugbu a, leenụ
  rationale: “Ma ugbu a” na-eme ka ntụgharị okwu ahụ doo anya; “leenụ” na-eburu ọrụ ἰδοὺ dị ka oku ka ndị na-ege ntị ṅaa ntị.
- source_word: οἶδα
  choice: ama m
  rationale: Nke a na-egosipụta nkwenye Pọl kwuru n'ụzọ nkịtị ma doo anya.
- source_word: ἐν οἷς διῆλθον
  choice: ndị m jere n'etiti unu
  rationale: Ọ na-egosi na Pọl gara ebe dị iche iche n'etiti ndị ahụ, kama ịkọwa ya dịka nanị otu njem gafere agafe.
- source_word: κηρύσσων
  choice: na-ekwusa
  rationale: “Na-ekwusa” bụ okwu Igbo a na-aghọta nke ọma maka ikwusa ozi n'ihu ọha.
- source_word: τὴν βασιλείαν
  choice: alaeze ahụ
  rationale: E debere okwu Grik ahụ n'enweghị itinye “nke Chineke,” ebe ihe odide SBLGNT kwuru naanị “alaeze ahụ.”
- source_word: οὐκέτι ὄψεσθε τὸ πρόσωπόν μου
  choice: agaghị ahụ ihu m ọzọ
  rationale: Nke a na-edobe akpaala okwu nke isi mmalite ma na-ada nke ọma n'Igbo dịka ịghara ịhụ mmadụ ọzọ.
theological_decisions:
- issue: Onye nwe alaeze ahụ
  choice: alaeze ahụ
  alternative: alaeze Chineke
  rationale: Ọ bụ ezie na ihe gbara amaokwu ahụ gburugburu nwere ike ime ka a ghọta ya dịka alaeze Chineke, e kwesịghị itinye “Chineke” n'ime amaokwu ebe isi mmalite ekwughị ya.
- issue: Oke okwu “unu niile” na-emetụta
  choice: unu niile, ndị m jere n'etiti unu
  alternative: ọ dịghị onye n'ime unu ndị m jere n'etiti unu
  rationale: Nhazi a na-edobe πάντες na ndị Pọl jere n'etiti ha, ma ghara ime ka okwu ahụ bụrụ nkwupụta sara mbara karịa ndị ọ na-agwa.
translation_notes:
  register: Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. E ji “leenụ” mee oku nlebara anya nke ἰδοὺ, ma zere okwu ụka pụrụ iche na nkọwa agbakwunyere.
