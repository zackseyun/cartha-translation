- from: Ma ugbu a, leenụ, ama m na unu niile, ndị m jere n'etiti unu na-ekwusa alaeze ahụ, agaghị ahụ ihu m ọzọ.
  to: Ma ugbu a, leenụ, ama m na unu niile ndị m jere n’etiti unu na-ekwusa alaeze ahụ agaghị ahụ ihu m ọzọ.
  rationale: A minor punctuation revision makes the relative clause directly modify 'unu niile,' matching the Greek syntax and improving natural Igbo flow. No theological expansion or interpretive addition has been made.
