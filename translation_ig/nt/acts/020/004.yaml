  text: συνείπετο δὲ ⸀αὐτῷ Σώπατρος ⸀Πύρρου Βεροιαῖος, Θεσσαλονικέων δὲ Ἀρίσταρχος καὶ Σεκοῦνδος, καὶ Γάϊος Δερβαῖος καὶ Τιμόθεος, Ἀσιανοὶ δὲ Τυχικὸς καὶ Τρόφιμος·
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/004.yaml
  text: And Sopater son of Pyrrhus[a], a Berean, accompanied him; and Aristarchus and Secundus from Thessalonica; and Gaius of Derbe, and Timothy[b]; and Tychicus and Trophimus from Asia.
translation:
  language: ig
  text: Sopata, nwa Pịrọs, onye Beria, sooro ya; Aristakọs na Sekọndọs, ndị si Tesalonaịka[a]; Gaiọs, onye Debe, na Timoti; Taịkikọs na Trofimọs, ndị si n’Eshia[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ, n’ụzọ dị nso n’okwu Grik: “ndị si n’etiti ndị Tesalonaịka.”'
    reason: lexical_alternative
  - marker: b
    text: Nke a bụ ógbè Eshia nke ọchịchị Rom, ọ bụghị kọntinent Eshia nke oge a.
    reason: cultural_note
lexical_decisions:
- source_word: συνείπετο
  choice: sooro ya
  rationale: Ngwaa a na-egosi iso mmadụ na-eme njem. “Sooro ya” bụ okwu Igbo doro anya ma kwekọọ n’ụdị imperfect nke Grik n’ọnọdụ a.
- source_word: Σώπατρος Πύρρου Βεροιαῖος
  choice: Sopata nwa Pịrọs, onye Beria
  rationale: Πύρρου bụ genitive e ji akọwa nna ya, ya mere a sụgharịrị ya “nwa Pịrọs”; Βεροιαῖος na-egosi na o si Beria.
- source_word: Θεσσαλονικέων
  choice: ndị si Tesalonaịka
  rationale: Genitive plural a na-achịkọta Aristakọs na Sekọndọs dịka ndị obodo ahụ. Nke a bụ Igbo nkịtị maka “ndị si n’etiti ndị Tesalonaịka.”
- source_word: Γάϊος Δερβαῖος
  choice: Gaiọs onye Debe
  rationale: Δερβαῖος bụ aha na-akọwa ebe Gaiọs si; “onye Debe” na-ekwupụta njikọ obodo ahụ n’ụzọ Igbo dị mfe.
- source_word: Ἀσιανοὶ
  choice: ndị si n’Eshia
  rationale: N’ebe a okwu ahụ pụtara ndị si n’ógbè Eshia nke ọchịchị Rom, ọ bụghị kọntinent Eshia nke oge a.
- source_word: δέ ... δέ ... δέ
  choice: ; ndị ọzọ bụ ... , ... , na ...
  rationale: A haziri njikọ ndị a ka ndepụta ahụ bụrụ Igbo na-aga were were, ma a ka chekwara nkewa nke ìgwè ndị ahụ.
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. E debere aha mmadụ na ebe n’ụdị ntụgharị mkpụrụokwu dabara n’Igbo, ma tinye akara nkọwa ala peeji n’ebe okwu ha na-akọwa dị.
