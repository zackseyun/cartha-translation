lexical_decisions:
- source_word: ἱκανὸς κλαυθμὸς ἐγένετο πάντων
  choice: Ha niile bere akwa nke ukwuu
  rationale: Nke a na-egosi na onye ọ bụla nọ ebe ahụ bere akwa nke ukwuu; ntụgharị a bụ Igbo doro anya ma na-echekwa ike okwu Grik ahụ.
- source_word: ἐπιπεσόντες ἐπὶ τὸν τράχηλον τοῦ Παύλου
  choice: makụọ Pọl n’olu
  rationale: Nke a na-egosipụta omume ịmakụ onye n’olu n’ụzọ Igbo sitere n’okike, ma na-echekwa nkọwa doro anya banyere olu Pọl.
- source_word: κατεφίλουν αὐτόν
  choice: nọgidekwa na-esusu ya ọnụ
  rationale: Ụdị ngwaa Grik ahụ na-egosi omume gara n’ihu ma ọ bụ nke e mere ugboro ugboro; ‘nọgidekwa na-esusu ya ọnụ’ na-echekwa akụkụ ahụ.
