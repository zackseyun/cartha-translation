  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἡμεῖς δὲ ⸀προελθόντες ⸀ἐπὶ τὸ πλοῖον ἀνήχθημεν ἐπὶ τὴν Ἆσσον, ἐκεῖθεν μέλλοντες ἀναλαμβάνειν τὸν Παῦλον, οὕτως γὰρ ⸂διατεταγμένος ἦν⸃ μέλλων αὐτὸς πεζεύειν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/013.yaml
  text: But we[a], having gone ahead to the ship, set sail for Assos, intending to take Paul on board from there, for so he had arranged[b], since he himself intended to go by land.
translation:
  language: ig
  text: Ma anyị bu ụzọ gaa n’ụgbọ mmiri, wee pụọ n’ọdụ ụgbọ mmiri gawa Asọs, ka anyị si ebe ahụ kpọrọ Pọl banye n’ụgbọ mmiri. N’ihi na ọ dozila ya otu a,[a] ebe ya onwe ya bu n’obi ije n’ala.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’ihi na e dozila ya otu a.” Usoro okwu Grik ahụ bụ nke nnara-ọrụ n’ụdị ya; ma n’ọnọdụ okwu a, o yikarịrị ka ọ na-ekwu maka nhazi ma ọ bụ ntụziaka Pọl mere tupu ahụ.
    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ, “iji ụkwụ gaa.” Ngwaa Grik πεζεύειν na-egosi ije n’ala, n’ụzọ dị iche na njem ụgbọ mmiri; n’ebe a ọ pụkwara ịpụta iji ụkwụ gaa.
    reason: lexical_alternative
lexical_decisions:
- source_word: προελθόντες
  choice: bu ụzọ gaa
  rationale: Na-egosi na ndị otu Luk gara n’ihu tupu Pọl, ma na omume a mere tupu ha abanye n’oké osimiri.
- source_word: ἐπὶ τὸ πλοῖον
  choice: gaa n’ụgbọ mmiri
  rationale: N’ọnọdụ ngagharị a, ọ na-ezo aka n’ịga ebe ụgbọ mmiri dị ma banye na ya; ngwaa na-esote na-eme ka njem mmiri doo anya.
- source_word: ἀνήχθημεν
  choice: banye n’oké osimiri
  rationale: N’asụsụ njem ụgbọ mmiri, ngwaa a pụtara isi n’ọdụ ụgbọ mmiri pụọ ma malite njem n’oké osimiri.
- source_word: ἐπὶ τὴν Ἆσσον
  choice: gawa Asọs
  rationale: Na-egosi ebe ụgbọ mmiri ahụ na-aga; “Asọs” bụ nsụgharị mkpụrụokwu aha Ἆσσος dabara n’usoro ụda Igbo.
- source_word: μέλλοντες ἀναλαμβάνειν
  choice: bu n’obi ... kpọrọ Pọl banye n’ụgbọ mmiri
  rationale: μέλλω na-egosi ebumnobi, ebe ἀναλαμβάνω n’akụkọ njem a pụtara ịkpọrọ mmadụ banye n’ụgbọ mmiri.
- source_word: ἐκεῖθεν
  choice: isi n’ebe ahụ
  rationale: Na-echekwa echiche nke ebe ha ga-esi kpọrọ Pọl, ọ bụghị naanị ebe ha ga-ahụ ya.
- source_word: διατεταγμένος ἦν
  choice: ọ bụ otú ahụ ka o si hazie ya
  rationale: N’agbanyeghị na usoro Grik ahụ bụ nke nnara-ọrụ n’ụdị ya, ọnọdụ okwu ahụ na-akwado Pọl dịka onye mere nhazi ahụ; e debere ụzọ ọzọ n’ala ala peeji.
- source_word: μέλλων αὐτὸς πεζεύειν
  choice: ebe ya onwe ya bu n’obi iji ụkwụ gaa
  rationale: πεζεύειν na-egosi njem n’elu ala, ma n’ebe a o nwere ike ịpụta kpọmkwem iji ụkwụ gaa; αὐτός bụ nkwusi ike, ya mere “ya onwe ya.”
- source_word: δὲ
  choice: Ma
  rationale: Na-egosi obere ọdịiche dị n’etiti ihe ndị otu onye na-akọ akụkọ mere na ihe Pọl mere.
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. E chekwara ọdịiche dị n’etiti njem ụgbọ mmiri nke ndị otu Luk na njem Pọl ji ụkwụ ma ọ bụ n’elu ala mee. Akara ala ala peeji [a] na [b] dị n’ederede isi.
