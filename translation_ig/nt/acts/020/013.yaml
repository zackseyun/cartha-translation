revisions:
- from: Ma anyị onwe anyị bu ụzọ gaa n’ụgbọ mmiri, wee banye n’oké osimiri gawa Asọs. Anyị bu n’obi isi n’ebe ahụ kpọrọ Pọl banye n’ụgbọ mmiri, n’ihi na ọ bụ otú ahụ ka o si hazie ya,[a] ebe ya onwe ya bu n’obi iji ụkwụ gaa.[b]
  to: Ma anyị bu ụzọ gaa n’ụgbọ mmiri, wee pụọ n’ọdụ ụgbọ mmiri gawa Asọs, ka anyị si ebe ahụ kpọrọ Pọl banye n’ụgbọ mmiri. N’ihi na ọ dozila ya otu a,[a] ebe ya onwe ya bu n’obi ije n’ala.[b]
  rationale: The revision removes added emphasis on “we,” uses more natural Standard Igbo for setting sail and taking Paul aboard, and renders the prior arrangement with a completed form. The footnote preserves the grammatical passive alternative without forcing an interpretation. It also retains the source’s explicit emphasis on Paul himself and the sea-versus-land contrast.
