id: ACT.20.29
reference: Acts 20:29
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐγὼ ⸀οἶδα ὅτι εἰσελεύσονται μετὰ τὴν ἄφιξίν μου λύκοι βαρεῖς εἰς ὑμᾶς μὴ φειδόμενοι τοῦ ποιμνίου,
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/029.yaml
  text: I know that after my departure fierce wolves will come in among you[b][a], not sparing the flock.
translation:
  language: ig
  text: Ama m na mgbe m lawara,[a] anụ ọhịa wolf ndị dị obi ọjọọ[b] ga-abata n'etiti unu, ha agaghị emere ìgwè atụrụ ahụ ebere.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N'ụzọ nkịtị, “mgbe ọbịbịa m gasịrị.” Ma n'ọnọdụ okwu a, ihe ọ pụtara bụ “mgbe m lawara.”
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya “ndị dị oke egwu.” Okwu Grik ahụ pụrụ igosi omume siri ike, mmegbu, ma ọ bụ obi ọjọọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἶδα
  choice: Ama m
  rationale: Nke a na-egosi na Pọl maara nke a n'ezie, ọ bụghị nanị na ọ na-eche otú ahụ.
- source_word: εἰσελεύσονται
  choice: ga-abata n'etiti unu
  rationale: Ọ na-egosi mbata n'ime ọgbakọ ahụ ma kwekọọ n'onyinyo anụ ọhịa na-abanye n'ìgwè atụrụ.
- source_word: μετὰ τὴν ἄφιξίν μου
  choice: mgbe m lawara
  rationale: Ọ bụ ezie na ἄφιξις na-apụtakarị ọbịbịa, ọnọdụ okwu a na-ekwu banyere ihe ga-eme mgbe Pọl hapụrụ ha.
- source_word: λύκοι βαρεῖς
  choice: anụ ọhịa wolf ndị dị obi ọjọọ
  rationale: Nke a na-edebe ihe atụ anụ ọhịa ahụ ma na-egosi ịdị ike, obi ọjọọ, na ihe ize ndụ βαρεῖς pụtara n'ebe a.
- source_word: μὴ φειδόμενοι τοῦ ποιμνίου
  choice: ha agaghị emere ìgwè atụrụ ahụ ebere
  rationale: Nke a na-egosipụta omume obi tara mmiri nke ndị ahụ n'Igbo doro anya ma na-edebe ihe atụ ìgwè atụrụ.
theological_decisions:
- issue: Ihe atụ ‘wolves’ pụtara
  choice: E debere ya dịka “anụ ọhịa wolf” n'ahịrịokwu ahụ.
  alternative: ndị ozizi ụgha; ndị na-ebibi mmadụ; ndị mmegbu
  rationale: Amaokwu a akọwaghị kpọmkwem ndị anụ ọhịa ahụ nọchiri anya ha; idebe ihe atụ ahụ na-echekwa ike okwu ahụ ma ghara imechi ihe ọ pụtara n'otu nkọwa.
- issue: Ihe ἄφιξις pụtara n'ọnọdụ a
  choice: mgbe m lawara
  alternative: mgbe m bịara; mgbe m rutere
  rationale: Ọnọdụ okwu ahụ na-egosi na Pọl na-adọ ha aka ná ntị banyere ihe ga-eme mgbe ọ na-anọkwaghị n'etiti ha, n'agbanyeghị na okwu Grik ahụ n'onwe ya na-apụtakarị ọbịbịa.
translation_notes:
  register: Igbo ọkọlọtọ nke oge a, dị nsọ ma dị mfe nghọta. E debere ihe atụ anụ ọhịa wolf na ìgwè atụrụ. E ji “anụ ọhịa wolf” mee ka aha anụmanụ ahụ doo onye Igbo nke oge a anya; akara ụkwụ ederede niile dị n'ahịrịokwu ahụ.
