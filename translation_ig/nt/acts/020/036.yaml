  register: 'Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E debere usoro omume nke Grik: Pọl kwuchara, sekpuru ala n''ikpere ya, soro ndị niile nọ ebe ahụ kpee ekpere.'
