  text: Καὶ ταῦτα εἰπὼν θεὶς τὰ γόνατα αὐτοῦ σὺν πᾶσιν αὐτοῖς προσηύξατο.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/036.yaml
  text: And after saying these things, he knelt down with them all and prayed.
translation:
  language: ig
  text: Mgbe o kwusịrị ihe ndị a, o gburu ikpere n'ala, ya na ha niile kpee ekpere.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: Mgbe ... wee
  rationale: N'usoro akụkọ Igbo, njikọ a na-egosi ihe mere ozugbo okwu ahụ gasịrị n'ụzọ sitere n'okike, n'agbanyeghị na Καί n'onwe ya bụ njikọ dị mfe.
- source_word: ταῦτα εἰπὼν
  choice: Mgbe o kwusịrị ihe ndị a
  rationale: Nkebi aorist participle na-egosi na ikwu okwu ahụ buru ụzọ mee tupu isi omume; ntụgharị a doro anya ma bụrụ Igbo a na-asụ ugbu a.
- source_word: θεὶς τὰ γόνατα αὐτοῦ
  choice: o sekpuru ala n'ikpere ya
  rationale: Okwu Grik ahụ pụtara n'ụzọ nkịtị 'itinye ikpere ya,' ya bụ idiom maka isekpuru ala n'ikpere; nhọrọ a na-egosi omume ahụ n'enweghị ịgbakwụnye echiche nke ịdaba.
- source_word: σὺν πᾶσιν αὐτοῖς
  choice: ya na ha niile
  rationale: σύν na dative na-egosi iso ndị ọzọ mee ihe, ebe πᾶσιν na-emesi ike na ndị otu ahụ niile sonyere.
- source_word: προσηύξατο
  choice: kpee ekpere
  rationale: Nke a bụ ngwaa a na-ejikarị ekwu ikpe ekpere; okwu Igbo a bụ ntụgharị kpọmkwem, doro anya, ma kwesịkwa ekwesị.
