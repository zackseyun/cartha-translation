reference: Acts 20:7
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἐν δὲ τῇ μιᾷ τῶν σαββάτων συνηγμένων ⸀ἡμῶν κλάσαι ἄρτον ὁ Παῦλος διελέγετο αὐτοῖς, μέλλων ἐξιέναι τῇ ἐπαύριον, παρέτεινέν τε τὸν λόγον μέχρι μεσονυκτίου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/007.yaml
  text: On the first day of the week[a], when we had gathered to break bread, Paul was speaking to them, intending to depart the next day[b], and he prolonged the message until midnight.
translation:
  language: ig
  text: N’ụbọchị mbụ n’izu, mgbe anyị zukọtara ịnyawa achịcha[a], Pọl nọ na-agwa ha okwu; ebe ọ ga-apụ n’echi ya[b], ọ gbatịkwara okwu ya ruo etiti abalị.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, ‘iji nyawaa achịcha.’ Nkebiokwu a nwere ike ịpụta nri ha na-erikọ ọnụ, ma nwekwaa ihe ọ na-egosi banyere Oriri Onyenwe Anyị.
    reason: lexical_alternative
  - marker: b
    text: 'A pụkwara ịghọta ya dị ka: ‘Pọl nọ na-agwa ha okwu, ebe ọ ga-apụ n’echi ya, o wee gbatịa okwu ahụ ruo etiti abalị.’'
    reason: previous_rendering
lexical_decisions:
- source_word: Ἐν δὲ τῇ μιᾷ τῶν σαββάτων
  choice: N’ụbọchị mbụ n’izu
  rationale: Nkebiokwu Grik a bụ akpaala okwu a na-eji akọwa ụbọchị mbụ nke izu; nsụgharị nkịtị dịka ‘otu n’ime ụbọchị izu ike’ ga-eduhie onye na-agụ Igbo.
- source_word: συνηγμένων ἡμῶν
  choice: mgbe anyị zukọtara
  rationale: Ọ na-egosi ọnọdụ mere n’otu oge na omume bụ isi, ma na-echekwa olu onye mbụ n’ọnụọgụ ọtụtụ.
- source_word: κλάσαι ἄρτον
  choice: ịnyawa achịcha
  rationale: A hapụrụ akpaala okwu ahụ ka ọ ghara ikpebi ma ọ bụ nri ha na-erikọ ọnụ, Oriri Nsọ, ma ọ bụ ha abụọ ka a na-ekwu maka ya.
- source_word: διελέγετο αὐτοῖς
  choice: nọ na-agwa ha okwu
  rationale: Ụdị ngwaa ahụ na-egosi omume na-aga n’ihu. Nhọrọ a bụ Igbo nkịtị, ma ọ naghị amanye nghọta ahụ ka ọ bụrụ naanị okwuchukwu otu onye na-ekwu.
- source_word: μέλλων ἐξιέναι τῇ ἐπαύριον
  choice: Ebe ọ na-ezube ịpụ n’echi ya
  rationale: Ọ na-egosi na ọpụpụ ahụ dị nso ma dị n’uche Pọl, n’enweghị nsụgharị nkịtị na-adịghị eke eke dịka ‘ịga apụ.’
- source_word: παρέτεινέν τε τὸν λόγον
  choice: ọ gbatịkwara okwu ya
  rationale: παρατείνω pụtara ịgbatị ma ọ bụ ime ka ihe dịtee; λόγος n’ebe a bụ okwu Pọl na-ekwu nye ndị zukọtara.
- source_word: μέχρι μεσονυκτίου
  choice: ruo etiti abalị
  rationale: Nke a na-egosi oke oge okwu Pọl ruru.
theological_decisions:
- issue: Ihe ‘ịnyawa achịcha’ pụtara n’ọgbakọ Ndị Kraịst oge mbụ
  choice: E jigidere akpaala okwu ahụ ‘ịnyawa achịcha.’
  alternative: ‘iri nri ọnụ’ ma ọ bụ ‘ime Oriri Nsọ’
  rationale: Nkebiokwu ahụ nwere ike ịpụta nri ndị kwere ekwe na-erikọ ọnụ, ma nwekwaa ihe ọ na-egosi banyere Oriri Onyenwe Anyị. Isiokwu Grik ekpebighị otu n’ime ha naanị, ya mere nsụgharị ahụ ekwesịghị idozi esemokwu ahụ n’ụzọ ụka pụrụ iche.
- issue: Mmekọrịta μέλλων ἐξιέναι na omume Pọl nke ikwu okwu ogologo oge
  choice: 'E gosiri ya dị ka ebumnuche dị nso: ‘Ebe ọ na-ezube ịpụ n’echi ya.’'
  alternative: 'Ịkọwa ya kpọmkwem dị ka ihe kpatara ya: ‘n’ihi na ọ na-aga ịpụ n’echi ya’'
  rationale: Participle Grik ahụ na-egosi ọnọdụ na ebumnuche dị nso, ma ọ naghị eji mkpụrụokwu doro anya kpọọ mmekọrịta ahụ ihe kpatara ya. Ihe odide ukwu na ndetu ala na-echekwa oghere nghọta a.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. ‘Pọl’ bụ mkpọpe aha a na-ahụkarị n’Igbo; ‘etiti abalị’ bụ ụzọ doro anya e si ekwu midnight. E tinyere akara ndetu [a] n’akụkụ ‘ịnyawa achịcha,’ ebe ọ bụ okwu ndetu ahụ na-akọwa, kama itinye ya n’akụkụ ‘ụbọchị mbụ n’izu.’
