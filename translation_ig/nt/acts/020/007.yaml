revisions:
- from: N’ụbọchị mbụ n’izu, mgbe anyị zukọtara ịnyawa achịcha[a], Pọl nọ na-agwa ha okwu. Ebe ọ na-ezube ịpụ n’echi ya[b], ọ gbatịkwara okwu ya ruo etiti abalị.
  to: N’ụbọchị mbụ n’izu, mgbe anyị zukọtara ịnyawa achịcha[a], Pọl nọ na-agwa ha okwu; ebe ọ ga-apụ n’echi ya[b], ọ gbatịkwara okwu ya ruo etiti abalị.
  rationale: Revised the departure clause to express the imminence conveyed by μέλλων, joined the related clauses in one natural narrative sentence, and adjusted footnote b so that it does not impose an explicit causal relation absent from the Greek. The bread-breaking idiom and its theologically open footnote are retained.
