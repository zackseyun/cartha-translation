base_translation:
  language: en
  yaml_path: translation/nt/acts/020/005.yaml
  text: These men went on ahead and were waiting for us in Troas[a].
translation:
  language: ig
  text: Mgbe ndị ikom a buru ụzọ gaa, ha nọ na-eche anyị na Troas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ, n’ụzọ soro usoro okwu Grik nso: “Ndị ikom a, mgbe ha buru ụzọ gaa, nọ na-eche anyị na Troas.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτοι
  choice: Ndị ikom a
  rationale: Nnọchiaha ngosi a dị n'ụdị nwoke ọtụtụ ma na-ezo aka n'òtù ndị e kpọrọ aha tupu amaokwu a; ‘Ndị ikom a’ na-eme ka ndị ọ na-ezo aka na ha doo anya n'Igbo.
- source_word: δὲ
  choice: —
  rationale: δέ bụ njikọ dị nro. Ịhapụ ya n'ekwughị okwu iche na-eme ka Igbo gaa were were n'ebughị ibu, ebe usoro akụkọ ka na-egosi njikọ ya.
- source_word: προσελθόντες
  choice: buru ụzọ gawa
  rationale: N'ọnọdụ njem a, participle ahụ na-egosi na ha gara n'ihu tupu ndị otu onye na-akọ akụkọ; ‘buru ụzọ gawa’ na-enye echiche ahụ n'Igbo nkịtị.
- source_word: ἔμενον
  choice: na-echekwa
  rationale: Ọ bụ imperfect nke μένω. N'ebe a, ya na ἡμᾶς na-egosi ịnọ na-eche ọbịbịa ha; ‘na-echekwa’ na-egosipụta omume ahụ nọ na-aga n'ihu.
- source_word: ἡμᾶς
  choice: anyị
  rationale: Nnọchiaha onye mbụ ọtụtụ n'ọnọdụ ihe a na-eme ihe; ‘anyị’ bụ ntụgharị kwụ ọtọ.
- source_word: ἐν Τρῳάδι
  choice: na Troas
  rationale: ἐν na aha ebe dị na dative na-egosi ebe ha nọ; n'Igbo, ‘na Troas’ bụ ụzọ ebumpụta ụwa isi kwuo ya.
theological_decisions: []
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. ‘Ndị ikom a’ mere ndị οὗτοι na-ezo aka na ha doo anya; e debere nkọwa ọzọ nke na-agbasochi usoro Grik anya na ndetu ala peeji.
