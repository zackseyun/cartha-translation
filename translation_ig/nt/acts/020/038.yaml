    issue: Footnote c’s proposed paraphrase adds an unsupported action.
    rationale: “Ha sooro ya gaa ka ha kele ya mgbe ọ na-apụ” introduces greeting them as the purpose of accompanying him. προπέμπω denotes accompanying or escorting someone on departure, often as a respectful farewell, but does not specifically mean greeting him.
  - severity: low
    issue: Footnote c’s alternative “Ha duuru ya” can suggest leading rather than escorting.
    rationale: The Greek concerns accompanying/seeing someone off, not directing or leading him. “Ha sooro ya” or “Ha duru ya soro” is safer, with the former most idiomatic here.
