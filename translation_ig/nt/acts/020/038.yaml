translation_notes:
  register: Standard Igbo nke oge a, dị mfe nghọta ma dị ùgwù. E jiri ‘na-eru uju’ gosipụta mwute miri emi; e debere ‘ihu ya’ iji chekwaa okwu oyiyi na mmetụta mmekọrịta onwe onye dị na Greek. A họọrọ ‘ha agaghị ... ọzọ’ kama usoro ga-adị arọ n’Igbo nke ga-anwa idobe μέλλω iche.
