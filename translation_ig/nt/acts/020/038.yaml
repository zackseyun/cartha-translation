base_translation:
  language: en
  yaml_path: translation/nt/acts/020/038.yaml
  text: grieving especially over the word that he had spoken[a], that they would no longer see his face[d][c][b]. And they were accompanying him to the ship.
translation:
  language: ig
  text: Ha nọ na-eru uju karịsịa n’ihi okwu ahụ o kwuru[a], na ha agaghị ahụ ihu ya ọzọ[b]. Ha sokwa ya ruo n’ụgbọ mmiri[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “n’ihi ihe o kwuru.” N’asụsụ Greek, ọ bụ n’ụzọ nkịtị, “n’ihi okwu ahụ o kwuru.”
    reason: lexical_alternative
  - marker: b
    text: N’asụsụ Greek, ọ bụ, “ha agaghị ahụ ihu ya ọzọ,” nke bụ ụzọ na-egosi na ha agaghị ahụ ya ọzọ.
    reason: lexical_alternative
  - marker: c
    text: A pụkwara ịsị, “Ha sooro ya ruo n’ụgbọ mmiri,” ma ọ bụ, “Ha duuru ya soro ruo n’ụgbọ mmiri.” Ngwaa Greek ahụ pụrụ ịpụta iso onye na-apụ n’ụzọ, ma ọ bụ iduru ya soro, dị ka nkwanye ùgwù n’oge nkewa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀδυνώμενοι
  choice: na-eru uju
  rationale: Na-egosi ihe mgbu na mwute dị n’obi; okwu a bụ Igbo nkịtị ma dị ùgwù n’ọnọdụ nkewa a.
- source_word: μάλιστα
  choice: karịsịa
  rationale: Na-egosi na okwu Pọl kwuru bụ isi ihe kacha wute ha.
- source_word: ἐπὶ τῷ λόγῳ ᾧ εἰρήκει
  choice: n’ihi okwu ahụ o kwuru
  rationale: Na-enye ihe Greek pụtara n'ụzọ Igbo si aga nke ọma, ma ka na-edobe λόγος dịka ‘okwu.’
- source_word: οὐκέτι μέλλουσιν
  choice: ha agaghị ... ọzọ
  rationale: Na-egosipụta ọdịnihu a tụrụ anya ya site n’oge gara aga n’Igbo eke, ma ghara ime ka οὐκέτι sie ike karịa ‘ọzọ.’
- source_word: τὸ πρόσωπον αὐτοῦ θεωρεῖν
  choice: ahụ ihu ya
  rationale: Na-edobe okwu oyiyi Greek ‘ihu ya,’ nke na-egosi mmekọrịta onwe onye karịa nanị ‘ịhụ ya.’
- source_word: προέπεμπον
  choice: sokwa ya ruo
  rationale: Na-egosi na ha sonyere ya n’ụzọ iji kele ya nke ọma mgbe ọ na-apụ; ‘ruo’ dabara na ebe ngwụcha e kwuru.
- source_word: εἰς τὸ πλοῖον
  choice: ruo n’ụgbọ mmiri
  rationale: ‘Ụgbọ mmiri’ bụ okwu Standard Igbo doro anya maka πλοῖον n’ọnọdụ njem mmiri.
