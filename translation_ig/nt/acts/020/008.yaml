  text: There were many lamps in the upper room where we were gathered[a].
translation:
  language: ig
  text: E nwere ọtụtụ oriọna n’ọnụ ụlọ dị n’elu ebe anyị gbakọtara[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ihe ọkụ a na-ebu.” Okwu Grik ahụ pụrụ ịpụta ụdị ihe ọkụ a na-ebu n’ozuzu ya, ma n’ebe a a nọ n’ime ụlọ, “oriọna” yiri ka ọ ka dabara.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: E gosipụtaghị ya iche
  rationale: δέ bụ njikọ dị nro nke na-aga n'ihu n’akụkọ ahụ; n'Igbo, ahịrịokwu ọhụrụ na usoro ihe gbara ya gburugburu na-enye njikọ ahụ n'ụzọ eke, n'etinyeghị ‘ugbu a’ ma ọ bụ ‘ma’ nke nwere ike ịgbakwunye oge ma ọ bụ esemokwu na-adịghị n'isiokwu a.
- source_word: λαμπάδες
  choice: oriọna
  rationale: λαμπάς nwere ike ịpụta oriọna ma ọ bụ ọwa ọkụ. N'ime ụlọ elu, ‘oriọna’ bụ ihe kacha kwekọọ n'ọnọdụ ahụ, ebe e debere nhọrọ ọzọ na nkọwa ala peeji.
- source_word: ἱκαναὶ
  choice: ọtụtụ
  rationale: N'ebe a ἱκαναί na-akọwa ọnụ ọgụgụ oriọna dị ka nke buru ibu; ‘ọtụtụ’ bụ Igbo doro anya ma dị eke.
- source_word: ἐν τῷ ὑπερῴῳ
  choice: n'ime ụlọ elu ahụ
  rationale: ὑπερῷον bụ ọnụ ụlọ dị n'akụkụ elu ụlọ; ‘ụlọ elu’ bụ okwu Igbo dị mfe ma na-ekwupụta ebe ahụ nke ọma.
- source_word: οὗ
  choice: ebe
  rationale: οὗ bụ okwu na-egosi ebe; ‘ebe’ na-ejikọta nkebi ahịrịokwu ahụ n'ụzọ eke.
- source_word: ἦμεν συνηγμένοι
  choice: anyị gbakọtara
  rationale: Perfect passive participle ya na imperfect nke εἰμί na-egosi na ndị ahụ abịakọtala ma nọkọkwa ọnụ. ‘Anyị gbakọtara’ na-enye nkọwa akụkọ ahụ n'Igbo dị mfe ma na-echekwa echiche nke nzukọ ha.
