  text: οὐ γὰρ ὑπεστειλάμην τοῦ μὴ ἀναγγεῖλαι ⸂πᾶσαν τὴν βουλὴν τοῦ θεοῦ ὑμῖν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/027.yaml
  text: For I did not shrink back from declaring to you the whole counsel of God[a].
translation:
  language: ig
  text: N’ihi na alaghị m azụ ikwupụtara unu atụmatụ Chineke dum[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “nzube Chineke dum,” “uche Chineke dum,” ma ọ bụ “ndụmọdụ Chineke dum.”
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: N’ihi na
  rationale: Ọ na-egosi na okwu a na-enye ihe mere e ji kwuo okwu bu ya ụzọ, dị ka γάρ si eme n’ebe a.
- source_word: ὑπεστειλάμην
  choice: alaghị m azụ
  rationale: Akpaalaokwu a bụ nke Igbo nkịtị ma na-echekwa echiche nke ịla azụ ma ọ bụ izere ime ihe, kama ime ka ọ bụrụ naanị ‘ịla azụ n’obi’.
- source_word: τοῦ μὴ ἀναγγεῖλαι
  choice: n’ikwupụtara
  rationale: Ọ na-egosi ihe Pọl na-alaghị azụ ime; ‘ikwupụtara’ dabara n’ọnọdụ nkwusa na izi ihe dị nsọ.
- source_word: πᾶσαν
  choice: dum
  rationale: E tinyere ya n’azụ aha dịka Igbo si eme, iji gosi izu oke nke nzube ahụ.
- source_word: βουλήν
  choice: nzube
  rationale: ‘Nzube’ na-enye echiche sara mbara banyere ebumnuche ma ọ bụ atụmatụ e kpebiri, ma ọ naghị ada ka ndụmọdụ Chineke na-anata ma ọ bụ na-enye. E debere ihe ndị ọzọ okwu Grik ahụ pụrụ ịpụta n’ala peeji.
- source_word: τοῦ θεοῦ
  choice: Chineke
  rationale: Njikọ aha ndị a na Igbo na-egosi na nzube ahụ bụ nke Chineke ma ọ bụ sitere n’aka ya.
- source_word: ὑμῖν
  choice: unu
  rationale: Ọ bụ nnọchiaha onye nke abụọ n’ọnụọgụ, bụrụkwa ndị Pọl na-agwa okwu kpọmkwem.
theological_decisions:
- issue: Ihe βουλή τοῦ θεοῦ pụtara
  choice: nzube Chineke dum
  alternative: atụmatụ Chineke dum; uche Chineke dum; ihe niile Chineke kpebiri
  rationale: βουλή nwere ike ịrụtụ aka na nzube, atụmatụ, mkpebi, ma ọ bụ uche Chineke. ‘Nzube’ bụ okwu sara mbara nke na-adịghị amanye naanị otu nkọwa ozizi; ihe odide ala peeji na-echekwa ụzọ ndị ọzọ e si aghọta ya.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. ‘Alaghị m azụ’ na-echekwa ihe atụ dị na ὑποστέλλω, ebe ‘nzube’ na ihe odide ala peeji na-edobe obosara na nghọtahie ziri ezi nke βουλή.
