  yaml_path: translation/nt/acts/020/002.yaml
  text: After passing through those regions and encouraging them with many words[a], he came into Greece.
translation:
  language: ig
  text: Mgbe o jisịrị ógbè ndị ahụ gafee ma jiri ọtụtụ okwu[a] gbaa ha ume, ọ bịaruru Gris.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “gbaa ha ume ogologo oge” ma ọ bụ, “jiri nnukwu agbamume gbaa ha ume.” N’asụsụ Grik, ọ pụtara n’ụzọ nkịtị, “jiri ọtụtụ okwu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διελθὼν
  choice: Mgbe ọ gafesịrị
  rationale: Aorist participle a na-egosi ihe mere tupu ngwaa bụ isi; nkebi a na-egosipụta usoro ahụ n’Igbo doro anya.
- source_word: τὰ μέρη ἐκεῖνα
  choice: n’ógbè ndị ahụ
  rationale: μέρη n’ebe a na-ezo aka n’akụkụ ala ma ọ bụ mpaghara ndị ahụ; “ógbè” bụ okwu Igbo ebumpụta ụwa maka echiche a.
- source_word: παρακαλέσας
  choice: gbaa ha ume
  rationale: παρακαλέω nwere ike ịpụta ịgba ume, ịdụ ọdụ, ma ọ bụ ịkasị obi. N’ọnọdụ nleta Pọl gara ileta ndị kwere ekwe, “ịgba ume” na-edobe obosara echiche ahụ n’emechighị ya naanị n’ịdọ aka ná ntị.
- source_word: αὐτοὺς
  choice: ha
  rationale: Nnọchiaha a na-ezo aka n’ebe ndị kwere ekwe nọ n’ógbè ndị ahụ.
- source_word: λόγῳ πολλῷ
  choice: jiri ọtụtụ okwu
  rationale: Nke a na-edobe ọdịdị okwu Grik ahụ, nke pụtara n’ụzọ nkịtị “site n’okwu dị ukwuu/ọtụtụ,” ma ndetu ala na-egosi nkọwa ndị ọzọ o nwere ike ibu.
- source_word: ἦλθεν εἰς τὴν Ἑλλάδα
  choice: ọ bịaruru Gris
  rationale: Nkebi a na-egosi njem ya ruo Gris. “Bịaruru” bụ Igbo dị mfe ma dịkwa ebumpụta ụwa maka iru ebe njem na-aga.
- source_word: δὲ
  choice: Mgbe
  rationale: δὲ bụ njikọ dị nro; n’Igbo, a tinyere ọrụ ntụgharị ya n’usoro oge bụ “Mgbe ọ gafesịrị,” nke na-eme ka ahịrịokwu ahụ na-aga nke ọma.
