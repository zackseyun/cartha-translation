id: ACT.20.22
reference: Acts 20:22
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ νῦν ἰδοὺ ⸂δεδεμένος ἐγὼ⸃ τῷ πνεύματι πορεύομαι εἰς Ἰερουσαλήμ, τὰ ἐν αὐτῇ συναντήσοντά ⸀μοι μὴ εἰδώς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/022.yaml
  text: And now, behold, bound in the Spirit, I am going to Jerusalem, not knowing what will happen to me there,
translation:
  language: ig
  text: Ma ugbu a, lee, a kekọtara m n’ime Mmụọ[a], ana m aga Jeruselem, n’amaghị ihe ga-eme m n’ebe ahụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’ime mmụọ m”; okwu Greek ahụ nwere ike izo aka na mmụọ Pọl n’onwe ya ma ọ bụ na Mmụọ Nsọ. A pụkwara ịghọta ya dị ka, “Mmụọ na-akwagide m.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδοὺ
  choice: lee
  rationale: Na-echekwa ọrụ ya dị ka okwu na-adọta uche ma na-egosi mgbanwe okwu siri ike, n’ụzọ Igbo dị nkenke ma dị ùgwù.
- source_word: δεδεμένος
  choice: a kekọtara m
  rationale: Na-echekwa ihe atụ nkịtị nke ịbụ onye e kere agbụ, kama ịkọwa ya ozugbo dị ka naanị ịbụ onye a manyere amanye.
- source_word: τῷ πνεύματι
  choice: n’ime Mmụọ
  rationale: Ọ dabara n’ọgụgụ nke na-ezo aka na Mmụọ Nsọ, ma ọ naghị eme ka echiche nke onye mere ihe pụta ìhè karịa otú Greek si mee; ihe odide ala na-edebe nghọta ndị ọzọ.
- source_word: πορεύομαι
  choice: ana m aga
  rationale: Na-egosi omume na-aga n’ihu ma ọ bụ njem dị nso n’asụsụ Igbo nkịtị.
- source_word: τὰ ἐν αὐτῇ συναντήσοντά μοι
  choice: ihe ga-eme m n’ebe ahụ
  rationale: Nke a bụ ụzọ Igbo doro anya ma dị ndụ isi kwuo ihe ndị ga-ezute Pọl na Jeruselem, na-echekwa echiche nke ihe na-echere ya.
- source_word: μὴ εἰδώς
  choice: n’amaghị
  rationale: Ọ bụ nsụgharị dị mkpirikpi ma kwụ ọtọ nke participle ahụ, na-akọwa ọnọdụ Pọl mgbe ọ na-aga.
- source_word: Ἰερουσαλήμ
  choice: Jeruselem
  rationale: Ụdị aha obodo ahụ a na-ejikarị eme ihe n’Igbo.
theological_decisions:
- issue: Ihe τῷ πνεύματι na-ezo aka na ya
  choice: Mmụọ Nsọ, nke a sụgharịrị “n’ime Mmụọ”
  alternative: mmụọ nke Pọl n’onwe ya; ma ọ bụ “Mmụọ na-akwagide m/na-amanye m”
  rationale: N’Akwụkwọ Ọrụ Ndịozi, πνεῦμα na-ezokarị aka na Mmụọ Nsọ, ebe amaokwu ndị na-esote na-ekwu banyere akaebe Mmụọ. Ma usoro Greek ahụ ka nwere mgbagwoju anya ziri ezi; ya mere e debere nghọta ndị ọzọ n’ihe odide ala.
translation_notes:
  register: Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E jiri “lee” chekwaa nkwusi ike nke ἰδοὺ, ma jiri ihe odide ala chekwaa mgbagwoju anya dị na τῷ πνεύματι.
