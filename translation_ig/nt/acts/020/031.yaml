  variant: Standard Igbo
source:
  edition: SBLGNT
  text: διὸ γρηγορεῖτε, μνημονεύοντες ὅτι τριετίαν νύκτα καὶ ἡμέραν οὐκ ἐπαυσάμην μετὰ δακρύων νουθετῶν ἕνα ἕκαστον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/031.yaml
  text: Therefore stay alert[a], remembering that for three years, night and day, I did not stop admonishing each one with tears.
translation:
  language: ig
  text: Ya mere, nọrọnụ na nche, na-echeta na, n’ime afọ atọ, abalị na ehihie, akwụsịghị m ịdụ onye ọ bụla ọdụ na anya mmiri[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “na-adọ onye ọ bụla aka ná ntị.” Ngwaa Grik ahụ pụrụ imesi ịdọ aka ná ntị iji gbazie mmadụ ike, tinyere inye ya ntụziaka.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ
  choice: Ya mere
  rationale: Ọ na-egosi nkwubi okwu Pọl wepụtara site n’ịdọ aka ná ntị dị n’amaokwu ndị bu ụzọ.
- source_word: γρηγορεῖτε
  choice: nọrọnụ na nche
  rationale: Iwu a dị n’ụdị na-egosi omume na-aga n’ihu; okwu a na-akpọ ha ka ha nọgide na-amụ anya ma na-elezi anya.
- source_word: μνημονεύοντες
  choice: na-echetakwa
  rationale: Ọ na-ejikọta icheta ihe atụ Pọl na ịnọ na nche, ma na-echekwa njikọ participle ahụ n’asụsụ Igbo sitere n’okike.
- source_word: τριετίαν
  choice: ruo afọ atọ
  rationale: Ọ na-egosi ogologo oge ihe a mere. ‘Ruo afọ atọ’ bụ ụzọ Igbo doro anya e si kwuo oge ahụ.
- source_word: νύκτα καὶ ἡμέραν
  choice: abalị na ehihie
  rationale: Ọ na-echekwa usoro okwu Grik ma na-egosi na Pọl nọgidere n’ọrụ a mgbe niile.
- source_word: οὐκ ἐπαυσάμην
  choice: akwụsịghị m
  rationale: Ọ bụ ntụgharị Igbo dị mfe ma kpọmkwem nke na-egosi na Pọl akwụsịghị omume ahụ.
- source_word: μετὰ δακρύων
  choice: iji anya mmiri
  rationale: Ọ na-egosi na ịdụ ọdụ ya sooro akwa na mmetụta miri emi, n’asụsụ Igbo sitere n’okike.
- source_word: νουθετῶν
  choice: na-adụ ... ọdụ
  rationale: ‘Ịdụ ọdụ’ na-egosi ndụmọdụ na ntụziaka e nyere mmadụ iji mee ka ọ gbanwee; ihe odide ala peeji na-echekwa echiche ọzọ nke ịdọ aka ná ntị.
- source_word: ἕνα ἕκαστον
  choice: onye ọ bụla
  rationale: Ọ na-echekwa ike nkesa nke okwu Grik, nke na-emesi nlekọta e nyere mmadụ n’otu n’otu ike.
theological_decisions:
- issue: Ike nlekọta na mgbazi dị na νουθετῶν
  choice: na-adụ onye ọ bụla ọdụ
  alternative: na-adọ onye ọ bụla aka ná ntị
  rationale: Nhọrọ bụ isi na-egosi ozi Pọl nke ntụziaka onwe onye na mgbazi n’enweghị ime ka ọ bụrụ naanị iyi egwu; ihe odide ala peeji na-echekwa nkọwa siri ike nke ịdọ aka ná ntị.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. ‘Nọrọnụ na nche’ na-egosi ịmụrụ anya na-aga n’ihu; e debere ‘abalị na ehihie’ n’usoro isi mmalite Grik. E tinyere akara ihe odide ala peeji ozugbo n’akụkụ okwu ọ na-akọwa.
