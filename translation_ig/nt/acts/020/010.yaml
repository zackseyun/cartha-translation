id: ACT.20.10
reference: Acts 20:10
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καταβὰς δὲ ὁ Παῦλος ἐπέπεσεν αὐτῷ καὶ συμπεριλαβὼν εἶπεν· Μὴ θορυβεῖσθε, ἡ γὰρ ψυχὴ αὐτοῦ ἐν αὐτῷ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/010.yaml
  text: But Paul went down and fell upon him[a], and embracing him said, “Do not be alarmed[b], for his life is in him.”
translation:
  language: ig
  text: Ma Pọl ridara, dakwasị ya, makụọ ya, wee sị, “Unu atụla ụjọ,[b] n’ihi na ndụ ya[a] dị n’ime ya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “mkpụrụ obi ya dị n’ime ya.” Okwu Grik bụ ψυχή nwere ike ịpụta “ndụ,” “onwe mmadụ,” ma ọ bụ “mkpụrụ obi”; n’ebe a, “ndụ” kacha daba n’ajụjụ banyere ma ọ nwụrụ ka ọ̀ dị ndụ.
    reason: lexical_alternative
  - marker: b
    text: A pụrụ ịghọta okwu Pọl dị ka na nwa okorobịa ahụ anwụghị n’ezie, ma ọ bụ na e weghachiri ndụ ya. Okwu Grik ahụ n’onwe ya ekpebighị nke ọ bụ.
    reason: alternative_reading
lexical_decisions:
- source_word: καταβὰς
  choice: ridara
  rationale: Ọ na-egosi na Pọl si n’ebe dị elu rida gaa n’ebe nwa okorobịa ahụ nọ; okwu a dị nkenke ma bụrụkwa Igbo nkịtị.
- source_word: δὲ
  choice: Ma
  rationale: Ọ na-egosi ntakịrị mgbanwe ma ọ bụ ọdịiche n’etiti akụkọ ọdịda nwa okorobịa ahụ na ihe Pọl mere ozugbo.
- source_word: ἐπέπεσεν αὐτῷ
  choice: dakwasị ya
  rationale: Nke a na-echekwa omume anụ ahụ nke Pọl mere, na-enweghị ịkọwa ya dị ka ọdịda mberede; ọ na-ahapụkwa ohere maka myirịta ya na akụkọ ndị amụma mere ụdị ihe a.
- source_word: συμπεριλαβὼν
  choice: makụọ ya
  rationale: Ọ na-egosi iji aka gbaa mmadụ gburugburu ma jide ya nso; ‘makụọ ya’ bụ okwu Igbo doro anya ma dị ndụ.
- source_word: Μὴ θορυβεῖσθε
  choice: Unu atụla ụjọ
  rationale: Okwu Grik ahụ nwere ike ịpụta ịma jijiji, inwe ọgba aghara, ma ọ bụ ime mkpọtụ n’ihi nchegbu. N’ọnọdụ a, ‘Unu atụla ụjọ’ na-egosi nchegbu ndị gbakọrọ ebe ahụ n’ụzọ Igbo nkịtị.
- source_word: ἡ γὰρ ψυχὴ αὐτοῦ
  choice: n’ihi na ndụ ya
  rationale: ψυχή nwere ike ịpụta ndụ, onwe mmadụ, ma ọ bụ mkpụrụ obi. Ebe a, ihe a na-ekwu bụ ma nwa okorobịa ahụ ọ̀ dị ndụ ka ọ̀ nwụrụ, ya mere ‘ndụ ya’ dabara n’ọnọdụ ahụ karịa.
- source_word: ἐν αὐτῷ ἐστιν
  choice: dị n’ime ya
  rationale: Nke a na-esochi okwu Grik ahụ anya ma hapụ ya ka ọ ghara ikpebi ma ndụ ahụ anọgidewo n’ime ya, ka e weghachiri ya.
theological_decisions:
- issue: Ihe ψυχή pụtara n’ebe a na-ekwu banyere ndụ na ọnwụ
  choice: A sụgharịrị ya ‘ndụ,’ ọ bụghị ‘mkpụrụ obi.’
  alternative: ‘mkpụrụ obi’
  rationale: Ihe gbara amaokwu a gburugburu bụ ọnọdụ anụ ahụ Yutikọs mgbe ọ dara. ‘Ndụ’ na-egosipụta ojiji Grik a nke ọma, ma ọ naghị ebubata ozizi pụrụ iche banyere mkpụrụ obi nke amaokwu ahụ na-adịghị akọwa.
- issue: Ma okwu Pọl ọ̀ pụtara na Yutikọs anwụghị, ka ọ̀ pụtara na e weghachiri ya ná ndụ
  choice: E debere okwu bụ ‘ndụ ya dị n’ime ya’ n’enweghị nkọwa ga-ekpebi otu n’ime ha.
  alternative: Nkọwa dịka ‘ọ dị ndụ’ ma ọ bụ ‘ndụ ya alọghachila n’ime ya.’
  rationale: Okwu Grik ahụ na-ekwu na ndụ ya dị n’ime ya, ma ọ naghị ekwu kpọmkwem ma ọ bụ na ọ nwụghị ma ọlị, ka ọ bụ na Chineke weghachiri ndụ ya site n’ihe Pọl mere.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. A họọrọ ‘ridara,’ ‘dakwasị ya,’ na ‘makụọ ya’ iji mee ka usoro omume ahụ doo anya ma ghara iwepụ myirịta omume a nwere ike inwe na akụkọ ndị amụma. A hapụrụ ahịrịokwu ikpeazụ n’ụdị na-adịghị ekpebi ma nwa okorobịa ahụ anwụtụbeghị ma ọ bụ na e weghachiri ya ná ndụ.
