    rationale: Okwu “Akpaalaokwu Grik a na-ekwu maka ịbụ onye ikpe na ibu ọrụ banyere ihe ga-eme ndị ọzọ na-adịghị” nwere ike ịpụta ihe megidere ebumnuche ya, ma o nweghịkwa nhazi Igbo dị mma. A ga-ekwu n’ụzọ doro anya na ọ pụtara enweghị ikpe ma ọ bụ ibu ọrụ gbasara ndị ọzọ.
  - severity: low
    issue: “mmadụ niile” dị ntakịrị ihe na-adịghị nkịtị n’ọnọdụ a.
    rationale: “ndị mmadụ niile” bụ ụzọ Igbo dị mma karịa iji gosipụta ọtụtụ mmadụ nke πάντων, na-enweghị mgbanwe n’ihe amaokwu ahụ pụtara.
