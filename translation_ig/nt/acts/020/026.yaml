  verdict: revise
  source_fidelity: Isi ederede na-echekwa nke ọma njikọ nkwubi okwu (διότι), akaebe dị nsọ (μαρτύρομαι), na akpaalaokwu banyere ọbara. “Aka m dị ọcha n’ọbara ...” bụ ụzọ Igbo a na-anabata nke na-edobe ihe oyiyi ‘ịdị ọcha,’ ọ bụ ezie na Grik n’onwe ya kwuru ‘adịghị m ọcha/aka m dị ọcha’ n’enweghị ‘aka.’ Iji “ndị mmadụ niile” na-eme ka πάντων doo anya n’Igbo ma ghara imechi ihe ọ pụtara karịa isi mmalite.
  naturalness: 'Ahịrịokwu ahụ dị mfe nghọta ma dabara n’Igbo ọkọlọtọ na ndekọ Akwụkwọ Nsọ. A gbanwere naanị “mmadụ niile” gaa “ndị mmadụ niile” maka nkịtị na nghọta ka mma. Ndetu ala mbụ nke draft nwere nkebiokwu na-adịghị aga nke ọma: “onye ikpe na ibu ọrụ ... na-adịghị.”'
  terminology: “Agba unu akaebe,” “aka m dị ọcha,” na “ikpe ọbara” dabara na ndekọ okpukpe na asụsụ Igbo nke oge a. “Ikpe ọbara” n’ndetu b na-egosi bloodguilt nke ọma; a naghị atụgharị ya ka ọ bụrụ naanị ọnwụ anụ ahụ.
  issues:
