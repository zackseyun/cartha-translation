  text: ⸀διότι μαρτύρομαι ὑμῖν ἐν τῇ σήμερον ἡμέρᾳ ὅτι καθαρός ⸀εἰμι ἀπὸ τοῦ αἵματος πάντων,
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/026.yaml
  text: Therefore I testify to you on this day that I am innocent of the blood of all[a][b].
translation:
  language: ig
  text: N’ihi ya, ana m agba unu akaebe taa na aka m dị ọcha n’ọbara ndị mmadụ niile[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “aka m dị ọcha n’ọbara mmadụ niile.” Akpaalaokwu Grik a na-ekwu maka enweghị ikpe ma ọ bụ ibu ọrụ gbasara ndị ọzọ.
    reason: lexical_alternative
  - marker: b
    text: Okwu a yiri ka ọ na-ezo aka n’ihe oyiyi onye nche n’Ezikiel banyere ikpe ọbara; lee Ezikiel 3:18–19; 33:6–9.
    reason: cross_reference
lexical_decisions:
- source_word: διότι
  choice: N’ihi ya
  rationale: N’ọnọdụ okwu a, ọ na-egosi nkwubi okwu Pọl si n’ihe o kwuru tupu ya pụta; nke a bụ ụzọ Igbo si ekwu ya n'ụzọ doro anya.
- source_word: μαρτύρομαι
  choice: ana m agba unu akaebe
  rationale: Nke a na-echekwa ịdị arọ na nkwupụta siri ike nke ngwaa Grik ahụ, ma bụrụkwa okwu Igbo a na-aghọta nke ọma.
- source_word: ἐν τῇ σήμερον ἡμέρᾳ
  choice: taa
  rationale: Ọ bụ ụzọ Igbo dị ugbu a na nke ebumpụta ụwa si kwuo ‘n’ụbọchị taa,’ n’enweghị ime ka ahịrịokwu ahụ sie ike nghọta.
- source_word: καθαρός
  choice: aka m dị ọcha
  rationale: Akpaalaokwu Igbo a na-egosi na onye ahụ enweghị ikpe ma ọ bụ ibu ọrụ n’ihe ọjọọ ahụ, ma na-echekwakwa ihe oyiyi nke ‘ịdị ọcha’ dị na Grik.
- source_word: ἀπὸ τοῦ αἵματος πάντων
  choice: n’ọbara mmadụ niile
  rationale: Nke a na-echekwa akpaalaokwu gbasara ọbara na echiche nke enweghị ikpe ma ọ bụ ibu ọrụ maka mmadụ niile; itinye ‘mmadụ’ na-eme ka πάντων doo anya n’Igbo n’enweghị ịkpa oke karịa isi mmalite.
theological_decisions:
- issue: Ihe ‘aka m dị ọcha n’ọbara mmadụ niile’ pụtara
  choice: E debere ya dịka akpaalaokwu nke na-egosi na Pọl enweghị ikpe ma ọ bụ ibu ọrụ banyere mbibi ndị ọzọ, n’ihi na o mezuru ọrụ ya nke ịdọ aka ná ntị na izi ihe.
  alternative: Ịghọta ya naanị dịka ịsị na Pọl etinyeghị aka n’ọnwụ anụ ahụ nke onye ọ bụla.
  rationale: Ọnọdụ okwu ahụ na ihe oyiyi onye nche dị n’Ezikiel na-akwado echiche sara mbara nke ikpe ọbara na ibu ọrụ. Nsụgharị ahụ echekwala akpaalaokwu ahụ kama ịkọwa ya kpamkpam n’ime isi ederede.
translation_notes:
  register: Ejiri Standard Igbo nke dị ugbu a, dị ùgwù ma dị mfe nghọta. ‘Ana m agba unu akaebe taa’ bụ okwu ebumpụta ụwa, ebe ‘aka m dị ọcha n’ọbara’ na-echekwa ma ihe oyiyi Grik ma ụda Akwụkwọ Nsọ. E tinyere nkọwa akpaalaokwu na ndetu ala peeji ka a ghara imechi nghọta ya n’isi ederede.
