revisions:
- from: N’ihi na Pọl ekpebiela isi n’ụgbọ mmiri gafee Efesọs[a], ka ọ ghara ịnọ ọdụ n’Eshia; n’ihi na ọ na-eme ngwa ngwa ka ọ nọrọ na Jerusalem, ma ọ bụrụ na ọ ga-ekwe omume[b], n’ụbọchị Pentikọst.
  to: N’ihi na Pọl ekpebiela ịgafe Efesọs[a] n’ụgbọ mmiri, ka ọ ghara igbu oge n’Eshia; n’ihi na ọ na-eme ọsọ ọsọ ka ọ nọrọ na Jerusalem, ma ọ bụrụ na ọ ga-ekwe omume[b], n’ụbọchị Pentikọst.
  rationale: 'The revision corrects the sole substantive idiomatic and semantic weakness: Paul sought to avoid delay, not merely sitting or remaining seated. It also uses a more natural expression for his haste, while retaining the original’s temporal, maritime, and contingent nuances and preserving both footnote anchors.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T09:21:28Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys Paul’s prior decision, the maritime passing of Ephesus, his haste, the contingency ('if possible'), and his goal of being in Jerusalem for Pentecost. However, 'ịnọ ọdụ n’Eshia' normally means 'to sit/stay seated in Asia' and does not adequately convey χρονοτριβῆσαι, 'to spend time/delay.'
  naturalness: The wording is generally clear and appropriately formal. Replacing 'ịnọ ọdụ' with the idiomatic 'igbu oge' makes the purpose clause natural and precise. 'ọ na-eme ọsọ ọsọ' is a more natural expression of ongoing haste in this context.
  terminology: Pọl, Efesọs, Eshia, Jerusalem, and Pentikọst are suitable established forms. The provincial referent of Eshia is correctly explained in footnote a. Footnote b appropriately preserves the source expression’s possible emphasis on presence versus arrival.
  issues:
  - severity: medium
    issue: ‘ka ọ ghara ịnọ ọdụ n’Eshia’
    rationale: This says literally that Paul might not sit/stay seated in Asia. The Greek χρονοτριβῆσαι refers to spending time or being delayed; ‘ka ọ ghara igbu oge n’Eshia’ directly and naturally conveys this.
  - severity: low
    issue: ‘ọ na-eme ngwa ngwa’
    rationale: Though understandable, ‘ọ na-eme ọsọ ọsọ’ is the more idiomatic Standard Igbo expression for being in a hurry.
  revised_text: N’ihi na Pọl ekpebiela ịgafe Efesọs[a] n’ụgbọ mmiri, ka ọ ghara igbu oge n’Eshia; n’ihi na ọ na-eme ọsọ ọsọ ka ọ nọrọ na Jerusalem, ma ọ bụrụ na ọ ga-ekwe omume[b], n’ụbọchị Pentikọst.
  revised_footnotes:
  - marker: a
    text: “Eshia” n’ebe a bụ ógbè Eshia nke Alaeze Rom, nke dị n’ọdịda anyanwụ Eshia Maịnọ; ọ bụghị kọntinent Eshia nke oge a.
    reason: cultural_note
  - marker: b
    text: Ma ọ bụ, “ka ọ bịarute Jerusalem n’ụbọchị Pentikọst.” Okwu Grik ahụ nwere ike imesi ike ma ịdị na Jerusalem n’ụbọchị ahụ ma ịbịarute ebe ahụ n’ụbọchị ahụ.
    reason: alternative_reading
  revision_rationale: 'The revision corrects the sole substantive idiomatic and semantic weakness: Paul sought to avoid delay, not merely sitting or remaining seated. It also uses a more natural expression for his haste, while retaining the original’s temporal, maritime, and contingent nuances and preserving both footnote anchors.'
