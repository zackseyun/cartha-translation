  register: Asụsụ Igbo ọkọlọtọ, nke oge a, dị ùgwù ma dị mfe nghọta. E ji “ịnọ ọdụ” gosipụta igbu oge n’ụzọ sitere n’okike, ebe akara nkọwa [a] na [b] dị kpọmkwem n’ahụ amaokwu.
