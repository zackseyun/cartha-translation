id: ACT.20.16
reference: Acts 20:16
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸀κεκρίκει γὰρ ὁ Παῦλος παραπλεῦσαι τὴν Ἔφεσον, ὅπως μὴ γένηται αὐτῷ χρονοτριβῆσαι ἐν τῇ Ἀσίᾳ, ἔσπευδεν γὰρ εἰ δυνατὸν ⸀εἴη αὐτῷ τὴν ἡμέραν τῆς πεντηκοστῆς γενέσθαι εἰς Ἱεροσόλυμα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/016.yaml
  text: For Paul had decided to sail past Ephesus[a], so that he might not have to spend time in Asia; for he was hurrying to be in Jerusalem, if possible[b], on the day of Pentecost.
translation:
  language: ig
  text: N’ihi na Pọl ekpebiela ịgafe Efesọs[a] n’ụgbọ mmiri, ka ọ ghara igbu oge n’Eshia; n’ihi na ọ na-eme ọsọ ọsọ ka ọ nọrọ na Jerusalem, ma ọ bụrụ na ọ ga-ekwe omume[b], n’ụbọchị Pentikọst.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Eshia” n’ebe a bụ ógbè Eshia nke Alaeze Rom, nke dị n’ọdịda anyanwụ Eshia Maịnọ; ọ bụghị kọntinent Eshia nke oge a.
    reason: cultural_note
  - marker: b
    text: Ma ọ bụ, “ka ọ bịarute Jerusalem n’ụbọchị Pentikọst.” Okwu Grik ahụ nwere ike imesi ike ma ịdị na Jerusalem n’ụbọchị ahụ ma ịbịarute ebe ahụ n’ụbọchị ahụ.
    reason: alternative_reading
lexical_decisions:
- source_word: κεκρίκει
  choice: ekpebiela
  rationale: Na-egosipụta mkpebi Pọl mere ma kwụsie ike tupu njem a a na-akọ ugbu a.
- source_word: παραπλεῦσαι
  choice: isi n’ụgbọ mmiri gafee
  rationale: Na-echekwa kpọmkwem echiche nke ịgafe ebe site n’ụzọ mmiri, n’Igbo doro anya.
- source_word: ὅπως μὴ γένηται αὐτῷ χρονοτριβῆσαι
  choice: ka ọ ghara ịnọ ọdụ
  rationale: Ọ bụ ụzọ Igbo sitere n’okike isi kwuo na ọ chọrọ izere igbu oge ma ọ bụ ịnọ ogologo oge n’ebe ahụ.
- source_word: ἐν τῇ Ἀσίᾳ
  choice: n’Eshia
  rationale: E debere aha mpaghara ahụ n’ahụ amaokwu; ihe ọ pụtara n’oge Rom kọwara na nkọwa ala peeji.
- source_word: ἔσπευδεν
  choice: ọ na-eme ngwa ngwa
  rationale: Na-egosipụta omume na-aga n’ihu nke ime ọsọ n’usoro njem ahụ.
- source_word: εἰ δυνατὸν εἴη αὐτῷ
  choice: ma ọ bụrụ na ọ ga-ekwe omume
  rationale: Na-echekwa ọnọdụ ejighị n’aka dị n’okwu Grik ahụ n’Igbo nkịtị.
- source_word: τὴν ἡμέραν τῆς πεντηκοστῆς
  choice: n’ụbọchị Pentikọst
  rationale: Na-enye oge ememme ahụ n’ụzọ kwụ ọtọ, ma hapụ nghọta ‘ịnọ ebe ahụ’ ma ọ bụ ‘ịbịarute mgbe ahụ’ ka nkọwa ala peeji chekwaa ya.
- source_word: γενέσθαι εἰς Ἱεροσόλυμα
  choice: ka ọ nọrọ na Jerusalem
  rationale: Na-egosipụta ebumnuche ịbụ onye nọ na Jerusalem n’oge ahụ, ebe nkọwa ala peeji na-edekọkwa ohere nke ịghọta ya dị ka ịbịarute.
- source_word: Ἱεροσόλυμα
  choice: Jerusalem
  rationale: Aha obodo a kacha mara amara n’Igbo.
- source_word: πεντηκοστῆς
  choice: Pentikọst
  rationale: Aha ememme a nabatara ma ghọta nke ọma n’Igbo Ndị Kraịst.
