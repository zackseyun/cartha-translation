  text: διαμαρτυρόμενος Ἰουδαίοις τε καὶ Ἕλλησιν τὴν ⸀εἰς θεὸν μετάνοιαν καὶ ⸀πίστιν εἰς τὸν κύριον ἡμῶν ⸀Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/021.yaml
  text: solemnly testifying to both Jews and Greeks about repentance toward God and faith in our Lord Jesus[a].
translation:
  language: ig
  text: na-agba ma ndị Juu ma ndị Grik akaebe n’ụzọ siri ike banyere nchegharị n’ebe Chineke nọ na okwukwe n’Onyenwe anyị Jizọs[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ịtụkwasị Onyenwe anyị Jizọs obi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διαμαρτυρόμενος
  choice: na-agbara ... akaebe siri ike
  rationale: Nke a na-echekwa ma echiche nke ịgba akaebe ma ịdị arọ na nkwusi ike dị n’ụdị okwu Grik ahụ.
- source_word: Ἰουδαίοις τε καὶ Ἕλλησιν
  choice: ma Ndị Juu ma ndị Grik
  rationale: Ọ na-echekwa ụzọ Luk si kpọọ ìgwè abụọ ahụ aha, na-egosikwa na akaebe ahụ ruru ha abụọ.
- source_word: μετάνοιαν
  choice: nchegharị
  rationale: “Nchegharị” bụ okwu Igbo a na-aghọta nke ọma maka mgbanwe nke obi na ụzọ ndụ nke na-echigharịkwuru Chineke; ọ bụghị naanị ịgbanwe echiche.
- source_word: εἰς θεόν
  choice: chere ihu n’ebe Chineke nọ
  rationale: εἰς na-egosi ntụziaka ma ọ bụ ebe nchegharị ahụ lekwasịrị anya; nkebi a na-echekwa echiche nke ichigharịkwuru Chineke.
- source_word: πίστιν
  choice: okwukwe
  rationale: “Okwukwe” kwekọrọ n’ụdị okwu πίστις ma bụrụ okwu Igbo nkịtị n’ebe a; “ịtụkwasị obi” ka bụ nkọwa ọzọ kwesịrị ekwesị.
- source_word: εἰς τὸν κύριον ἡμῶν Ἰησοῦν
  choice: n’Onyenwe anyị Jizọs
  rationale: N’usoro a, εἰς na-egosi onye okwukwe ahụ dabeere na ya. “Onyenwe anyị” na-echekwa ịdị arọ nke κύριος, ebe “Jizọs” bụ aha onye ahụ.
theological_decisions:
- issue: Ụzọ e si sụgharịa πίστις mgbe Jizọs bụ onye okwukwe ahụ lekwasịrị anya
  choice: okwukwe n’Onyenwe anyị Jizọs
  alternative: ịtụkwasị Onyenwe anyị Jizọs obi
  rationale: Ihe odide Grik kpọrọ Jizọs kpọmkwem dị ka onye okwukwe ahụ lekwasịrị anya. “Okwukwe” na-echekwa okwu bụ isi, ebe e debere “ịtụkwasị ... obi” n’ala peeji dịka nhọrọ nkọwa.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E jiri “Ndị Juu” na “ndị Grik” chekwaa njikọ ìgwè abụọ ahụ; e zere iji “ndị mba ọzọ” dochie okwu Luk kpọmkwem.
