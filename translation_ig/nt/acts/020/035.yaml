id: ACT.20.35
reference: Acts 20:35
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: πάντα ὑπέδειξα ὑμῖν ὅτι οὕτως κοπιῶντας δεῖ ἀντιλαμβάνεσθαι τῶν ἀσθενούντων, μνημονεύειν τε τῶν λόγων τοῦ κυρίου Ἰησοῦ ὅτι αὐτὸς εἶπεν Μακάριόν ἐστιν μᾶλλον διδόναι ἢ λαμβάνειν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/035.yaml
  text: In everything I showed you that by laboring in this way it is necessary to help the weak[a], and to remember the words of the Lord Jesus, that he himself said, ‘It is more blessed to give than to receive.’
translation:
  language: ig
  text: Egosila m unu n’ihe niile na unu ga-arụsi ọrụ ike otu a inyere ndị na-adịghị ike aka[a], nakwa icheta okwu Onyenwe anyị Jizọs, n’ihi na ya onwe ya kwuru sị, ‘Inye ihe ka dị ngọzi karịa ịnara ihe.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ịkwado ndị na-adịghị ike.” Ngwaa Grik ahụ nwere ike ịpụta inye nkwado na-adịgide adịgide, ọ bụghị naanị enyemaka otu oge.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα
  choice: N'ihe niile
  rationale: A ghọtara ya dị ka okwu na-akọwa otú Pọl si gosi ha ihe n'ụzọ zuru ezu, ọ bụghị nanị dị ka ihe e mere ihe n'ahụ ya.
- source_word: ὑπέδειξα
  choice: egosiri m
  rationale: Ọ na-egosi igosi ma ọ bụ ịkụziri site n'omume na ihe atụ; usoro a dị mfe ma doo anya n'Igbo.
- source_word: οὕτως κοπιῶντας
  choice: site n'ịrụsi ọrụ ike otu a
  rationale: Nke a na-echekwa echiche nke ịdọgbu onwe n'ọrụ ma na-ezo aka n'ụdị ọrụ Pọl kọwara.
- source_word: δεῖ
  choice: ọ dị mkpa
  rationale: Ọ na-echekwa ike nke mkpa ma ọ bụ ibu ọrụ n'etinyeghị onye a na-akpọ aha n'ebe Grik na-akpọghị ya.
- source_word: ἀντιλαμβάνεσθαι
  choice: inyere ... aka
  rationale: Ọ bụ Igbo nkịtị maka inyere onye nọ ná mkpa aka; ohere nke nkwado na-adịgide adịgide ka e debere n'ala ala peeji.
- source_word: τῶν ἀσθενούντων
  choice: ndị na-adịghị ike
  rationale: Nke a na-ahapụ okwu ahụ ka ọ gbasaa ruo n'adịghị ike nke anụ ahụ, akụ na ụba, ma ọ bụ ọnọdụ mmadụ, n'ebughị ụzọ kpebie otu naanị.
- source_word: μνημονεύειν τε τῶν λόγων
  choice: na icheta okwu
  rationale: Ọ na-echekwa njikọ ya na ọrụ gara aga ma na-asụ ya n'ụzọ doro anya n'Igbo.
- source_word: τοῦ κυρίου Ἰησοῦ
  choice: Onyenwe anyị Jizọs
  rationale: ‘Onyenwe anyị’ bụ aha nsọpụrụ a na-aghọta nke ọma n'Igbo, ma ọ na-echekwa κύριος dị ka utu aha.
- source_word: αὐτὸς εἶπεν
  choice: ya onwe ya kwuru
  rationale: Nke a na-echekwa nkwusi ike dị na αὐτός na-egosi na okwu ahụ sitere n'ọnụ Jizọs n'onwe ya.
- source_word: Μακάριόν ἐστιν μᾶλλον διδόναι ἢ λαμβάνειν
  choice: Inye ihe na-eweta ngọzi karịa ịnara ihe
  rationale: Usoro a bụ Igbo ebumpụta ụwa, na-echekwa ntụnyere μᾶλλον na echiche μακάριον nke ọnọdụ nwere ihu ọma ma ọ bụ ngọzi.
theological_decisions:
- issue: Oke ihe ‘ndị na-adịghị ike’ pụtara
  choice: ndị na-adịghị ike
  alternative: ndị ogbenye; ndị ọrịa; ndị okwukwe ha na-adịghị ike
  rationale: ἀσθενούντων sara mbara. Ọnọdụ okwu gbasara ọrụ na inye ihe na-atụ aka ná ndị nọ ná mkpa, ma ihe odide ahụ akọwaghị kpọmkwem ụdị adịghị ike ha; ya mere, a hapụrụ mgbagwoju ahụ ka ọ dị.
- issue: Ihe μακάριον pụtara n'okwu Jizọs
  choice: na-eweta ngọzi
  alternative: dịrị ngọzi; na-enye obi ụtọ
  rationale: ‘Na-eweta ngọzi’ na-ezere ime ka okwu ahụ bụrụ naanị mmetụta obi ụtọ, ma na-echekwa echiche nke ọnọdụ onye Chineke hụrụ n'anya ma ọ bụ nke nwere ihu ọma.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke kwụ ọtọ ma nwee ugwu. Ahịrịokwu ahụ na-agbaso usoro echiche Grik, ma e mere ya ka ọ na-aga were were n'Igbo. E zere ịkọwa kpọmkwem ụdị adịghị ike ndị ahụ nwere.
