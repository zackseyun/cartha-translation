revisions:
- from: N'ihe niile, egosiri m unu na site n'ịrụsi ọrụ ike otu a, ọ dị mkpa inyere ndị na-adịghị ike aka[a], na icheta okwu Onyenwe anyị Jizọs, na ya onwe ya kwuru, ‘Inye ihe na-eweta ngọzi karịa ịnara ihe.’
  to: Egosila m unu n’ihe niile na unu ga-arụsi ọrụ ike otu a inyere ndị na-adịghị ike aka[a], nakwa icheta okwu Onyenwe anyị Jizọs, n’ihi na ya onwe ya kwuru sị, ‘Inye ihe ka dị ngọzi karịa ịnara ihe.’
  rationale: The active “Egosila m unu” restores Paul as the subject of ὑπέδειξα. “Unu ga-arụsi ọrụ ike” supplies the hearers as the understood subject of the coordinated infinitives, while preserving the force of δεῖ. The saying is recast so that giving itself is “more blessed,” as in the Greek comparative.
  reviewer_model: gpt-5.6-terra
