review_pass:
  verdict: revise
  source_fidelity: A safe revision is needed. The draft’s “egosiri m unu” is passive in form and does not clearly mean “I showed you”; the Greek ὑπέδειξα is active, with Paul as subject. The final saying also renders μακάριον as a causative (“brings blessing”) rather than as the comparative quality of giving (“more blessed”).
  naturalness: The revised wording uses an active, idiomatic Standard Igbo construction and makes the understood obligation of the hearers explicit in a way licensed by the Greek infinitive construction. “Kwuru sị” introduces the direct quotation naturally.
  terminology: “Ndị na-adịghị ike” appropriately retains the broad scope of τῶν ἀσθενούντων. “Onyenwe anyị Jizọs” is retained as a natural rendering of τοῦ κυρίου Ἰησοῦ. “Ka dị ngọzi” better represents μακάριον without importing a particular explanation of blessing.
  issues:
  - severity: medium
    issue: “egosiri m unu” is passive/ambiguous.
    rationale: It can be understood as “I was shown [to] you,” whereas ὑπέδειξα means “I showed/demonstrated to you.”
  - severity: medium
    issue: “Inye ihe na-eweta ngọzi karịa ịnara ihe” changes the predicate of the saying.
    rationale: Μακάριόν ἐστιν describes giving as more blessed; it does not directly say that giving produces more blessing.
  revised_text: Egosila m unu n’ihe niile na unu ga-arụsi ọrụ ike otu a inyere ndị na-adịghị ike aka[a], nakwa icheta okwu Onyenwe anyị Jizọs, n’ihi na ya onwe ya kwuru sị, ‘Inye ihe ka dị ngọzi karịa ịnara ihe.’
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “ịkwado ndị na-adịghị ike.” Ngwaa Grik ahụ nwere ike ịpụta inye nkwado na-adịgide adịgide, ọ bụghị naanị enyemaka otu oge.
    reason: lexical_alternative
  revision_rationale: The active “Egosila m unu” restores Paul as the subject of ὑπέδειξα. “Unu ga-arụsi ọrụ ike” supplies the hearers as the understood subject of the coordinated infinitives, while preserving the force of δεῖ. The saying is recast so that giving itself is “more blessed,” as in the Greek comparative.
