  text: And they took the boy away alive[a], and were not a little comforted.
translation:
  language: ig
  text: Ha kpọọrọ nwa okorobịa ahụ laa, ọ dị ndụ; a kasiri ha obi nke ukwuu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'N''ụzọ nkịtị: “ọ bụghị ntakịrị”; nke a bụ okwu e ji ibelata ihe n’elu ọnụ, nke pụtara “nke ukwuu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤγαγον
  choice: kpọrọ ... laa
  rationale: Ngwaa ἄγω pụtara idu ma ọ bụ ịkpọrọ mmadụ gaa. N'ọnọdụ a, “kpọrọ ... laa” na-egosi n'ụzọ Igbo doro anya na ha si ebe ahụ pụọ ya na nwa okorobịa ahụ.
- source_word: παῖδα
  choice: nwa okorobịa
  rationale: παῖς nwere ike ịpụta nwa, nwata, ma ọ bụ ohu. Ebe amaokwu 9 kpọrọ Yutikọs νεανίας, “nwa okorobịa” na-ejikọta okwu abụọ ahụ n'ụzọ ebumpụta ụwa ma ghara ime ka a ghọta ya dịka ohu.
- source_word: ζῶντα
  choice: mgbe ọ dị ndụ
  rationale: Okwu a na-akọ ọnọdụ nwa okorobịa ahụ mgbe ha kpọrọ ya laa; “mgbe ọ dị ndụ” na-egosipụta nke a nke ọma n'Igbo.
- source_word: παρεκλήθησαν
  choice: obi ... mma
  rationale: N'ebe a παρακαλέω na-egosi nkasi obi na nnwere onwe pụtara mgbe ha hụrụ na ọ dị ndụ. Akpaokwu Igbo “obi dị mmadụ mma” na-ekwupụta mmetụta ahụ n'ụzọ nkịtị.
- source_word: οὐ μετρίως
  choice: kasị
  rationale: 'Nke a bụ okwu e ji ibelata ihe n''elu ọnụ ma mee ka ike ya pụta: n''ụzọ nkịtị, “ọ bụghị ntakịrị,” ya bụ, nke ukwuu. “Kasị” na-ebuga ike okwu ahụ n''Igbo dị mfe nghọta.'
theological_decisions: []
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. Akpaokwu “obi wee kasị ha mma” na-ebuga nkasi obi na nnukwu ọṅụ nke ndị ahụ n'ụzọ Igbo ebumpụta ụwa, ebe ihe odide ala ala na-echekwa ụdị okwu Grik nke ibelata ihe iji mesie ya ike.
