- from: Ha wee kpọrọ nwa okorobịa ahụ laa mgbe ọ dị ndụ, obi wee kasị ha mma.[a]
  to: Ha kpọọrọ nwa okorobịa ahụ laa, ọ dị ndụ; a kasiri ha obi nke ukwuu.[a]
  rationale: 'The revision preserves the sequence and ambiguity of the Greek: the unnamed group took the young man away, he was alive, and they received great comfort. It replaces an unnatural superlative construction with the established Igbo expression “a kasiri ha obi,” and the note now accurately explains the emphatic Greek litotes.'
