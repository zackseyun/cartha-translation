id: ACT.20.3
reference: Acts 20:3
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ποιήσας τε μῆνας τρεῖς· γενομένης ⸂ἐπιβουλῆς αὐτῷ⸃ ὑπὸ τῶν Ἰουδαίων μέλλοντι ἀνάγεσθαι εἰς τὴν Συρίαν ἐγένετο ⸀γνώμης τοῦ ὑποστρέφειν διὰ Μακεδονίας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/003.yaml
  text: After spending three months there[a], when a plot was made against him by the Jews as he was about to sail for Syria[d][c][b], he decided to return through Macedonia.
translation:
  language: ig
  text: Mgbe ọ nọsịrị ọnwa atọ n’ebe ahụ, ndị Juu[a] gbara izu megide ya[b] mgbe ọ na-achọ iji ụgbọ mmiri gawa Siria.[c] O kpebiri ịlaghachi site n’ụzọ Masedonia.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Grik kwuru, “ndị Juu.” N’akwụkwọ Ọrụ Ndị Ozi, okwu a na-ezokarị aka n’otu ndị Juu kpọmkwem na-emegide Pọl n’ọnọdụ a, ọ bụghị ndị Juu niile n’ozuzu.
    reason: cultural_note
  - marker: b
    text: Ma ọ bụ, “mgbe izu ọjọọ bilitere imegide ya.”
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “mgbe ọ na-achọ iji ụgbọ mmiri gawa Siria.”
    reason: lexical_alternative
  - marker: d
    text: Ma ọ bụ, “o mere mkpebi ịlaghachi site n’ụzọ Masedonia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιήσας τε μῆνας τρεῖς
  choice: Mgbe ọ nọsịrị ọnwa atọ n’ebe ahụ
  rationale: Nkebi ahịrị a na-egosi na ọ nọrọ ọnwa atọ; a gbakwụnyere “n’ebe ahụ” site n’ihe amaokwu bu ụzọ kwuru banyere Gris, ka Igbo wee na-aga were were.
- source_word: γενομένης ἐπιβουλῆς αὐτῷ
  choice: gbara izu megide ya
  rationale: ἐπιβουλή bụ atụmatụ nzuzo e mere iji merụọ mmadụ ahụ; “ịgba izu megide” bụ ụzọ Igbo doro anya ma kwekọọ n’echiche ahụ.
- source_word: ὑπὸ τῶν Ἰουδαίων
  choice: ndị Juu
  rationale: E debere aha ahụ Grik kwuru n’ahịrị bụ isi, na-enweghị ịgbanwe ya ka ọ bụrụ “ụfọdụ ndị Juu” ma ọ bụ “ndị Juu na-emegide ya.” Ihe odide ala peeji na-akọwa ókè okwu ahụ ruru n’ọnọdụ a.
- source_word: μέλλοντι ἀνάγεσθαι
  choice: ka ọ na-akwado iji ụgbọ mmiri gawa
  rationale: μέλλω na-egosi ihe na-achọ ime n’oge na-adịghị anya, ebe ἀνάγεσθαι n’akụkọ njem a na-egosi ịpụ n’oké osimiri. Okwu Igbo a na-egosi ma nkwadebe dị nso ma njem ụgbọ mmiri.
- source_word: εἰς τὴν Συρίαν
  choice: gawa Siria
  rationale: εἰς na-egosi ebe njem ahụ na-aga; “gawa Siria” bụ okwu Igbo e ji ekwu ebe mmadụ na-aga n’ụzọ nkịtị.
- source_word: ἐγένετο γνώμης
  choice: o kpebiri
  rationale: Akpaalaokwu Grik a pụtara na mmadụ mere mkpebi. “O kpebiri” dị mfe, doo anya, ma bụrụ Igbo nke oge a.
- source_word: τοῦ ὑποστρέφειν
  choice: ịlaghachi
  rationale: Infinitive a na-akọ ihe mkpebi ahụ bụ; “ịlaghachi” na-edobe echiche nke ịga azụ.
- source_word: διὰ Μακεδονίας
  choice: site na Masedonia
  rationale: διά tinyere genitive na-egosi ụzọ njem ahụ si aga; “site na Masedonia” na-egosi na ọ ga-agafe ebe ahụ.
theological_decisions:
- issue: Ihe “ndị Juu” na-ezo aka na ya n’akụkọ esemokwu a
  choice: E debere “ndị Juu” n’ahịrị bụ isi, ma kọwaa ya n’ihe odide ala peeji dịka otu ndị Juu na-emegide Pọl n’ọnọdụ a.
  alternative: “ụfọdụ ndị Juu” ma ọ bụ “ndị Juu na-emegide ya”
  rationale: Grik kwuru τῶν Ἰουδαίων kpọmkwem. Ịgbakwunye “ụfọdụ” n’ahịrị bụ isi ga-abụ ịkọwapụta ihe Grik ekwughị kpọmkwem; ma ihe odide ala peeji na-egbochi ndị na-agụ ya iche na okwu ahụ metụtara ndị Juu niile n’enweghị iche.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dịkwa mfe nghọta. “Ịgba izu megide,” “iji ụgbọ mmiri gawa,” na “site na Masedonia” bụ okwu njem na esemokwu ndị mmadụ na-aghọta ngwa ngwa. E tinyere akara ihe odide ala peeji niile n’ebe okwu ha na-akọwa dị.
