revisions:
- from: Anyị si ebe ahụ[a] kwapụ n’ụgbọ mmiri, n’echi ya anyị eruo n’ihu agwaetiti Kios; n’ụbọchị sochirinụ, anyị kwụsịrị n’ụgbọ mmiri na Samos[b]; n’ụbọchị so nke ahụ, anyị bịaruru Miletọs.
  to: Anyị sikwa ebe ahụ[a] jiri ụgbọ mmiri pụọ; n’echi ya, anyị rutere n’ebe chere Kios ihu; n’ụbọchị sochirinụ, anyị kwụsịrị na Samos[b]; n’ụbọchị na-esote, anyị bịaruru Miletọs.
  rationale: The revision corrects the past-tense verb, renders the position opposite Chios without implying a landing, makes the stop at Samos unambiguous in natural Igbo, and replaces an unidiomatic day-sequence expression. It retains the source’s chronological progression, nautical register, and established place-name forms.
