source:
  edition: SBLGNT
  text: κἀκεῖθεν ἀποπλεύσαντες τῇ ἐπιούσῃ κατηντήσαμεν ⸀ἄντικρυς Χίου, τῇ δὲ ἑτέρᾳ παρεβάλομεν εἰς ⸀Σάμον, τῇ ⸀δὲ ἐχομένῃ ἤλθομεν εἰς Μίλητον·
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/015.yaml
  text: And from there[a], after setting sail, on the next day we came opposite Chios; on the following day we touched at Samos[b]; and on the day after that we came to Miletus.
translation:
  language: ig
  text: Anyị sikwa ebe ahụ[a] jiri ụgbọ mmiri pụọ; n’echi ya, anyị rutere n’ebe chere Kios ihu; n’ụbọchị sochirinụ, anyị kwụsịrị na Samos[b]; n’ụbọchị na-esote, anyị bịaruru Miletọs.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “site n’ebe ahụ.” Okwu Grik ahụ jikọtara “na” na “site n’ebe ahụ.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “anyị webatara ụgbọ mmiri na Samos.” Ngwaa Grik ahụ bụ okwu njem mmiri nke pụtara iweta ụgbọ nso n’akụkụ mmiri ma ọ bụ ịkwụsị ebe ahụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀκεῖθεν
  choice: Anyị si ebe ahụ
  rationale: Crasis a jikọtara καί na ἐκεῖθεν. Usoro akụkọ Igbo na-egosi njikọ ahụ nke ọma n’enweghị ịmalite amaokwu ahụ na “Ma,” ebe “si ebe ahụ” na-echekwa ebe ha siri pụọ.
- source_word: ἀποπλεύσαντες
  choice: kwapụ n’ụgbọ mmiri
  rationale: Nke a na-egosi ịpụ ma malite njem n’oké osimiri; nkebi oge a na-esochi “Anyị si ebe ahụ” n’ụzọ Igbo dị mfe ma doo anya.
- source_word: τῇ ἐπιούσῃ
  choice: n’echi ya
  rationale: Nke a bụ okwu Igbo nkịtị ma zie ezi maka ụbọchị na-esote.
- source_word: κατηντήσαμεν
  choice: anyị eruo
  rationale: N’akụkọ njem, ngwaa a pụtara iru ebe; “eruo” na-adabara ọnọdụ ebe e kwuru na ha nọ n’ihu Kios, ọ bụghị na ha rutere n’agwaetiti ahụ.
- source_word: ἄντικρυς Χίου
  choice: n’ihu agwaetiti Kios
  rationale: “N’ihu” na-egosi na ụgbọ ahụ nọ n’akụkụ mmiri chere Kios ihu, na-enweghị ikwu na ha kwụsịrị ma ọ bụ rịdata n’agwaetiti ahụ. Etinyere “agwaetiti” iji mee ka ọnọdụ njem ahụ doo ndị na-agụ akwụkwọ anya.
- source_word: τῇ δὲ ἑτέρᾳ
  choice: n’ụbọchị sochirinụ
  rationale: Ọ na-echekwa usoro ụbọchị ndị ahụ ma na-agụ nke ọma n’Igbo.
- source_word: παρεβάλομεν εἰς Σάμον
  choice: anyị kwụsịrị n’ụgbọ mmiri na Samos
  rationale: N’ebe a παραβάλλω bụ okwu njem mmiri nke na-egosi iweta ụgbọ nso ma ọ bụ ịkwụsị n’ebe ahụ; nsụgharị a na-ezere ịkọwa ogologo oge nkwụsị ahụ.
- source_word: τῇ δὲ ἐχομένῃ
  choice: n’ụbọchị so nke ahụ
  rationale: Nke a na-egosi ụbọchị ọzọ na usoro ahụ n’enweghị mgbagwoju anya.
- source_word: ἤλθομεν εἰς Μίλητον
  choice: anyị bịaruru Miletọs
  rationale: “Bịaruru” bụ okwu Igbo eke maka iru ebe njem na-aga, ebe εἰς na-egosi ebe ha rutere.
- source_word: Χίου / Σάμον / Μίλητον
  choice: Kios / Samos / Miletọs
  rationale: E dere aha ebe ndị a n’ụdị dabara ụda na usoro odide Igbo, ma debe ọdịiche dị n’etiti aha atọ ahụ.
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. A họọrọ okwu njem mmiri ndị a na-aghọta ngwa ngwa, ma e chekwara ọdịiche dị n’etiti ịnọ n’ihu Kios, ịkwụsị na Samos, na ịbịaru Miletọs.
