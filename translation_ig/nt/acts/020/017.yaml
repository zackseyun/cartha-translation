review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents the origin (Miletus), destination (Ephesus), the summoning, and the church elders. However, the main wording "ziga ozi" necessarily specifies a message, whereas πέμψας leaves the thing sent unstated (message or messengers). This is a minor idiomatic expansion, but the note should explicitly preserve and explain the Greek ambiguity. The proposed wording retains the idiomatic Igbo expression while making that limitation clear.
  naturalness: The sentence is clear and suitably formal in Standard Igbo. Using the completed past form "zipụrụ" makes the narrative sequence slightly smoother. "Ndị okenye ọgbakọ ahụ" is natural and concise.
  terminology: '"Ndị okenye" appropriately renders πρεσβυτέρους in its church-leadership context without imposing a particular polity. "Ọgbakọ" is a suitable rendering of ἐκκλησία. Miletọs and Efesọs are acceptable established Igbo forms.'
  issues:
  - severity: low
    issue: The expression "ziga ozi" specifies what was sent.
    rationale: πέμψας does not state whether Paul sent a message or messengers. Igbo idiom reasonably calls for an object, but the accompanying note should state that the source leaves this unspecified rather than implying that only a message was sent.
  - severity: low
    issue: The existing footnote’s alternative can imply a more coercive act of having people brought.
    rationale: '"O ziri ka a kpọtaara ya" may sound like an order to bring the elders, while μετεκαλέσατο means that he sent for or summoned them. A wording with "zigara ... ozi ka ha bịakwute ya" is closer and more natural.'
  revised_text: O si na Miletọs zipụrụ ozi gaa Efesọs, kpọọ ndị okenye ọgbakọ ahụ ka ha bịakwute ya.[a]
