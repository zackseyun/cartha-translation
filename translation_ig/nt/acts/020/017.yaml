  text: Ἀπὸ δὲ τῆς Μιλήτου πέμψας εἰς Ἔφεσον μετεκαλέσατο τοὺς πρεσβυτέρους τῆς ἐκκλησίας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/017.yaml
  text: From Miletus he sent to Ephesus and called for the elders of the church[a].
translation:
  language: ig
  text: O si na Miletọs zipụrụ ozi gaa Efesọs, kpọọ ndị okenye ọgbakọ ahụ ka ha bịakwute ya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “O si na Miletọs zigaara ndị okenye ọgbakọ ahụ ozi ka ha bịakwute ya.” Okwu Grik ahụ ekwughị kpọmkwem ihe e zigara; ọ jikọtara iziga na Efesọs na ịkpọ ndị okenye ka ha bịa.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπὸ δὲ τῆς Μιλήτου
  choice: O si na Miletọs
  rationale: “Si na” na-egosi ebe omume ahụ malitere. A hapụrụ δέ ka usoro ahịrịokwu na gburugburu ya gosi njikọ dị nro ọ na-eme, kama ịgbakwụnye okwu ga-eme ka o yie nnukwu ntụgharị.
- source_word: πέμψας εἰς Ἔφεσον
  choice: ziga ozi gaa Efesọs
  rationale: Aorist participle πέμψας na-egosi omume mere tupu ma jikọọ na ịkpọ ndị okenye. N’Igbo, “ziga ozi” na-akọwa nke ọma na e zigara Efesọs ozi ma ọ bụ onye bu ozi, n’agbanyeghị na Grik ekwughị ihe e zigara kpọmkwem.
- source_word: μετεκαλέσατο
  choice: kpọọ … ka ha bịakwute ya
  rationale: Middle verb a pụtara ịkpọ mmadụ ka ọ bịa n’ebe onye kpọrọ ya nọ. Nsụgharị a doro anya n’Igbo ma ọ naghị etinye echiche nke iwu ike dị ka ụfọdụ okwu ndị ọzọ nwere ike ime.
- source_word: τοὺς πρεσβυτέρους
  choice: ndị okenye
  rationale: N’ebe a, okwu ahụ na-ezo aka n’ụmụ nwoke a ma ama dị ka ndị ndu ọgbakọ, ọ bụghị nanị ndị kara afọ. “Ndị okenye” na-echekwa aha ọrụ ahụ n’enweghị ịmanye usoro ọchịchị ụka nke otu denomination.
- source_word: τῆς ἐκκλησίας
  choice: nke ọgbakọ ahụ
  rationale: ἐκκλησία n’ebe a bụ obodo ndị kwere ekwe. “Ọgbakọ ahụ” na-egosi ndị ahụ zukọtara dị ka obodo okwukwe, ọ bụghị ụlọ ma ọ bụ denomination.
theological_decisions:
- issue: Ihe πρεσβυτέρους pụtara n’ọgbakọ ndị kwere ekwe
  choice: ndị ndu ọgbakọ a na-akpọ “ndị okenye”
  alternative: ndị nwoke kara afọ; ma ọ bụ okwu teknụzụ “presbịta”
  rationale: Akụkọ Ọrụ Ndịozi na ọnọdụ a na-egosi na Pọl kpọrọ ndị ndu a maara ama nke ọgbakọ Efesọs. “Ndị okenye” na-echekwa ihe okwu Grik pụtara n’enweghị itinye usoro ọchịchị ụka e guzobere n’oge e mesịrị.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị nsọ ma dị mfe nghọta, dee ya. “Ziga ozi” na-eme ka ahịrịokwu ahụ bụrụ nke e ji ọnụ ekwu nke ọma, ebe “ọgbakọ” na-ezere ime ka ἐκκλησία bụrụ naanị ụlọ ụka ma ọ bụ otu denomination.
