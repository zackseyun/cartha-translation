id: ACT.20.11
reference: Acts 20:11
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀναβὰς δὲ καὶ κλάσας ⸀τὸν ἄρτον καὶ γευσάμενος ἐφ’ ἱκανόν τε ὁμιλήσας ἄχρι αὐγῆς, οὕτως ἐξῆλθεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/011.yaml
  text: Then he went upstairs[a], broke the bread, and ate; and after talking for a long time, until dawn[b], he departed.
translation:
  language: ig
  text: Mgbe ahụ, ọ rịgoro n’elu, nyawaa achịcha ahụ[a], rie nri[b], kwuo okwu ogologo oge ruo mgbe chi bọrọ; mgbe ahụ ọ pụrụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “nyawaa achịcha.” Okwu Grik a nwere ike ịpụta iso ndị ọzọ rie nri; ụfọdụ na-aghọta na Oriri Nsọ sokwa na ya n’ebe a.
    reason: alternative_reading
  - marker: b
    text: N’ụzọ nkịtị, “detụ”; o nwekwara ike ịpụta “rie” ma ọ bụ “soro rie nri.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναβὰς
  choice: ọ rịgoro n’elu
  rationale: Okwu a pụtara ‘ịrịgo’ ma ọ bụ ‘ịga n’elu.’ N’akụkọ a, Pọl si n’ala laghachi n’ụlọ elu ahụ; nsụgharị a na-egosi ngagharị ahụ n’ụzọ doro anya n’Igbo, n’agbanyeghị na okwu Grik n’onwe ya ekwughị kpọmkwem ‘ụlọ elu.’
- source_word: κλάσας τὸν ἄρτον
  choice: nyawaa achịcha ahụ
  rationale: E debere aha ngosi dị n’okwu Grik (τὸν), ya mere ‘achịcha ahụ’ dabara nke ọma. Okwu a na-akọ ihe o mere n’ebughị ụzọ kpebie ma ọ bụ nri nkịtị ka ọ bụ Oriri Nsọ.
- source_word: γευσάμενος
  choice: rie ya
  rationale: Ọ bụ ezie na γεύομαι pụrụ ịpụta ‘detụ ire,’ n’ọnọdụ iri nri ọ pụkwara ịpụta iri ma ọ bụ iso rie nri. ‘Rie ya’ bụ Igbo nkịtị ma kwekọọ n’achịcha e kwuru okwu ya.
- source_word: ἐφ’ ἱκανόν
  choice: ruo ogologo oge
  rationale: Nkebiokwu a na-egosi oge dị ukwuu; ‘ruo ogologo oge’ na-egosipụta ogologo oge ahụ n’ụzọ ndị na-agụ Igbo ga-aghọta ngwa ngwa.
- source_word: ὁμιλήσας
  choice: mgbe ọ kwuchara okwu
  rationale: ὁμιλέω n’ebe a na-egosi ikwu okwu ma ọ bụ mkparịta ụka gara ogologo oge. Nhọrọ a bụ asụsụ Igbo dị mfe ma dị ùgwù, n’ebughị ụzọ kpebie ma ọ bụ naanị nkwusa ka ọ bụ mkparịta ụka.
- source_word: ἄχρι αὐγῆς
  choice: ruo mgbe chi bọrọ
  rationale: αὐγή pụtara chi ọbụbọ; ‘mgbe chi bọrọ’ bụ ụzọ Igbo nkịtị si ekwu ‘until dawn.’
- source_word: οὕτως ἐξῆλθεν
  choice: ọ pụrụ
  rationale: ἐξέρχομαι pụtara ịpụ ma ọ bụ ịla. Usoro ahịrịokwu Igbo na ihe ndị bu ya ụzọ na-eme ka njikọ οὕτως (‘otu a/ya mere’) doo anya n’enweghị mgbakwunye siri ike nke ga-ada ka nkọwa.
theological_decisions:
- issue: Ma κλάσας τὸν ἄρτον ọ̀ bụ aha doro anya maka Oriri Nsọ
  choice: A sụgharịrị ya n’ụzọ na-anọpụ iche dịka ‘nyawaa achịcha ahụ.’
  alternative: Ụfọdụ pụrụ ịghọta ya dịka iso ndị ọzọ rie nri nkịtị; ndị ọzọ pụrụ ịghọta na Oriri Nsọ sokwa na ya.
  rationale: Nkebiokwu ahụ nwere ike inwe njikọ na Oriri Nsọ n’Akwụkwọ Ọrụ Ndị Ozi, ma amaokwu a ekwughị nke ahụ hoo haa. Nsụgharị ahụ na-edebe mgbagwoju anya na esemokwu echiche dị n’ihe odide ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị mfe ma dị ùgwù, dee ya. E tinyere akara ala peeji [a] ozugbo e kwuchara ‘achịcha ahụ,’ na [b] ozugbo e kwuchara ‘rie ya,’ ka akara ndị ahụ kwekọọ kpọmkwem n’ihe nkọwa ha na-ekwu.
