revisions:
- from: Mgbe ahụ, ọ rịgoro n’elu, nyawaa achịcha ahụ[a], rie ya[b]. Mgbe ọ kwuchara okwu ruo ogologo oge, ruo mgbe chi bọrọ, ọ pụrụ.
  to: Mgbe ahụ, ọ rịgoro n’elu, nyawaa achịcha ahụ[a], rie nri[b], kwuo okwu ogologo oge ruo mgbe chi bọrọ; mgbe ahụ ọ pụrụ.
  rationale: The revision retains the neutral reference to breaking bread, preserves the Greek’s unstated object after γευσάμενος by using the broader "rie nri," and improves the natural flow of the duration and departure clauses. Footnote anchors remain attached to the precise expressions they explain.
