id: ACT.20.18
reference: Acts 20:18
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὡς δὲ παρεγένοντο πρὸς αὐτὸν εἶπεν αὐτοῖς· Ὑμεῖς ἐπίστασθε ἀπὸ πρώτης ἡμέρας ἀφ’ ἧς ἐπέβην εἰς τὴν Ἀσίαν πῶς μεθ’ ὑμῶν τὸν πάντα χρόνον ἐγενόμην,
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/018.yaml
  text: When they came to him[a], he said to them[b], “You yourselves know how I lived among you the whole time from the first day that I set foot in Asia,”
translation:
  language: ig
  text: Mgbe ha bịakwutere ya, ọ sịrị ha, “Unu onwe unu maara otú m si biri n’etiti unu[b] oge niile, malite n’ụbọchị mbụ m zọrọ ụkwụ n’Eshia[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Eshia n’ebe a bụ ógbè Rom a na-akpọ Eshia, nke dị n’ọdịda anyanwụ Eshia Maịnọ; ọ bụghị kọntinent Eshia nke oge a.
    reason: cultural_note
  - marker: b
    text: Ma ọ bụ, “otú m si nọnyere unu oge niile.” Okwu Grik ahụ pụrụ imesi ụzọ Pọl si bie ndụ ike, ma ọ bụ ịdịnyere ha mgbe niile.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεγένοντο πρὸς αὐτόν
  choice: ha bịakwutere ya
  rationale: Nke a na-egosi na ndị okenye Efesọs bịara n’ebe Pọl nọ; ọ bụkwa okwu Igbo dị mfe ma kwekọọ na mmegharị mmadụ na-aga n’ebe onye ọzọ nọ.
- source_word: Ὑμεῖς
  choice: Unu onwe unu
  rationale: Nnọchiaha Grik a pụtara ìhè iji mesie ndị na-ege ntị ike; ‘Unu onwe unu’ na-echekwa nkwusi ike ahụ n’Igbo.
- source_word: ἐπίστασθε
  choice: maara
  rationale: Okwu a na-egosi ihe mmadụ maara nke ọma site n’ahụmahụ ma ọ bụ mmekọrịta; ‘maara’ bụ okwu Igbo doro anya n’ebe a.
- source_word: ἀπὸ πρώτης ἡμέρας ἀφ’ ἧς ἐπέβην
  choice: malite n’ụbọchị mbụ m zọnyere ụkwụ
  rationale: ‘Zọnyere ụkwụ’ na-echekwa onyonyo doro anya nke ἐπιβαίνω, ebe ‘malite n’ụbọchị mbụ’ na-egosi mmalite oge ahụ.
- source_word: εἰς τὴν Ἀσίαν
  choice: n’Eshia
  rationale: A hapụrụ aha mpaghara ahụ dịka ederede Grik si kwuo ya, ebe nkọwa na ọ bụ ógbè Rom dị n’ihe odide ala ala peeji.
- source_word: πῶς μεθ’ ὑμῶν τὸν πάντα χρόνον ἐγενόμην
  choice: otú m si biri n’etiti unu oge ahụ niile
  rationale: Nsụgharị a bụ Igbo ebumpụta ụwa ma na-egosi ụzọ Pọl si bie ndụ n’etiti ha n’oge ahụ dum, ma ọ naghị ewepụ kpamkpam echiche nke ịnọnyere ha mgbe niile.
theological_decisions:
- issue: Ma ἐγενόμην ọ na-elekwasị anya n’ụzọ Pọl si bie ndụ ka ọ bụ n’ịnọnyere ha mgbe niile
  choice: otú m si biri n’etiti unu oge ahụ niile
  alternative: otú m si nọnyere unu oge ahụ niile
  rationale: Ihe gbara amaokwu ahụ gburugburu na-akwado echiche banyere omume na ibi ndụ Pọl, ma okwu Grik ahụ nwekwara ike imesi ịnọnyere ha ike. A họọrọ okwu kacha bụrụ Igbo ebumpụta ụwa, ebe a na-edebe ụzọ ọzọ n’ala ala peeji.[b]
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E chekwara nkwusi ike dị na ‘Unu onwe unu’ na onyonyo dị na ‘m zọnyere ụkwụ.’ Akara [a] dị n’ederede isi; akara [b] kwesịkwara iso nkebi ‘otú m si biri n’etiti unu oge ahụ niile’ iji gosi ụzọ nsụgharị ọzọ.
