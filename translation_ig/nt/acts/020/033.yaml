  text: ἀργυρίου ἢ χρυσίου ἢ ἱματισμοῦ οὐδενὸς ἐπεθύμησα·
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/033.yaml
  text: I coveted no one's silver or gold or clothing[a].
translation:
  language: ig
  text: Ọ dịghị ọlaọcha, ọlaedo, ma ọ bụ uwe onye ọ bụla m chọsiri ike.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Achọghị m ọlaọcha, ọlaedo, ma ọ bụ uwe onye ọ bụla.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀργυρίου
  choice: ọlaọcha
  rationale: Ọ pụtara ọlaọcha n'ụzọ doro anya; ijikọta ya na ọlaedo na uwe na-egosi ihe onwunwe bara uru, ya mere a hapụrụ ihe oyiyi ahụ kpọmkwem.
- source_word: χρυσίου
  choice: ọlaedo
  rationale: Nke a bụ ntụgharị kwụ ọtọ nke aha ahụ, nke e depụtara n'etiti ihe onwunwe mmadụ nwere ike ịchọsi ike.
- source_word: ἱματισμοῦ
  choice: uwe
  rationale: “Uwe” bụ okwu Igbo nkịtị, nke oge a, ma na-ekpuchi uwe ma ọ bụ akwa mmadụ na-eyi n'enweghị ụda ochie.
- source_word: οὐδενὸς
  choice: ọ dịghị onye ... ya
  rationale: Usoro a na-egosipụta na ihe ndị ahụ bụ nke onye ọzọ, ma na-eme ka ike nke genitive doo anya n'Igbo eke.
- source_word: ἐπεθύμησα
  choice: m chọsiri ... ike
  rationale: Ọ na-egosipụta ọchịchọ siri ike. N'ọnọdụ a, ọchịchọ ahụ bụ maka ihe ndị ọzọ nwere, ya mere ahịrịokwu dum na-ebute nghọta omume nke anyaukwu n'enweghị ịgbakwunye nkọwa na-adịghị n'isi mmalite.
- source_word: ἢ ... ἢ ... ἢ
  choice: ma ọ bụ ... ma ọ bụ ... ma ọ bụ
  rationale: Nke a na-echekwa usoro nkewa ugboro ugboro nke Grik ma na-ada nke ọma n'Igbo.
theological_decisions:
- issue: Ụdị omume nke ἐπιθυμέω gbasara ihe onwunwe ndị ọzọ
  choice: Jiri “chọsiri ... ike” n'ahịrịokwu na-ekwu banyere ihe onye ọzọ nwere, nke na-enye ya echiche nke ịchọ ihe mmadụ na-ekwesịghị ịchọ.
  alternative: “Achọghị m ọlaọcha onye ọ bụla...”
  rationale: Ọnọdụ okwu a bụ ịgbachitere iguzosi ike n'ezi ihe na enweghị anyaukwu Pọl. Nhọrọ a na-echekwa ike ọchịchọ dị na ngwaa Grik, ebe ihe ndị a kpọrọ aha na-eme ka echiche omume ya pụta ìhè.
translation_notes:
  register: Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E ji usoro possessive “onye ... ya” mee ka οὐδενὸς doo anya, ma debe ndepụta atọ na njikọ ya dịka isi Grik si dị.
