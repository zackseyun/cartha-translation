- from: Ọ dịghị onye m chọsiri ọlaọcha ya ike, ma ọ bụ ọlaedo ya, ma ọ bụ uwe ya.[a]
  to: Ọ dịghị ọlaọcha, ọlaedo, ma ọ bụ uwe onye ọ bụla m chọsiri ike.[a]
  rationale: The revised wording preserves the Greek list, its repeated “or” coordination, and the possessive force of οὐδενός while reading naturally in Standard Igbo. The footnote offers the less emphatic lexical alternative “achọghị m” without adding “never.”
  reviewer_model: gpt-5.6-terra
