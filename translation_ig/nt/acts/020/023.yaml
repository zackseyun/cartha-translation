  yaml_path: translation/nt/acts/020/023.yaml
  text: except that the Holy Spirit testifies to me in city after city[c][b][a], saying that chains and afflictions await me.
translation:
  language: ig
  text: Naanị na Mmụọ Nsọ na-agbara m akaebe n'obodo ọ bụla[a], na-ekwu na agbụ[b] na mkpagbu na-echere m.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “site n'obodo ruo n'obodo” ma ọ bụ “n'obodo dị iche iche.” Akpaalaokwu Grik ahụ na-egosi akaebe a na-enye ugboro ugboro, obodo site n'obodo.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, “ihe e ji kee mmadụ.” “Agbụ” na-echekwa ihe oyiyi pụtara ìhè nke okwu Grik ahụ, nke nwekwara ike ịpụta ịnọ n'ụlọ mkpọrọ.
    reason: lexical_alternative
  - marker: c
    text: Ụfọdụ ihe odide aka ochie nwere obere ọdịiche n'ebe okwu “m” dị ma ọ bụ ma ọ dị n'akụkụ “mkpagbu”; ma ihe ọ pụtara ka bụ na agbụ na mkpagbu na-echere Pọl.
    reason: textual_variant
lexical_decisions:
- source_word: πλὴν ὅτι
  choice: ma e wezụga na
  rationale: Ọ na-egosi nanị ihe e wepụrụ n'okwu Pọl kwuru n'amaokwu bu ụzọ, ma na-echekwa ike nke okwu Grik ahụ.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: Mmụọ Nsọ
  rationale: Nke a bụ okwu Igbo a na-ejikarị eme ihe maka Mmụọ Chineke ahụ e kwuru kpọmkwem.
- source_word: κατὰ πόλιν
  choice: n'obodo dị iche iche
  rationale: Ọ na-egosi na akaebe ahụ na-eme ugboro ugboro n'obodo ndị Pọl na-agafe, n'ekwughị na ọ bụ obodo niile n'enweghị otu fọdụrụ.
- source_word: διαμαρτύρεταί μοι
  choice: na-agbara m akaebe
  rationale: Ọ na-echekwa echiche nke ịgba akaebe siri ike ma ghara ịkọwa ya naanị dị ka ịdọ aka ná ntị.
- source_word: λέγον
  choice: na-ekwu
  rationale: Ọ na-ewebata kpọmkwem ihe Mmụọ Nsọ na-agba akaebe banyere ya.
- source_word: δεσμὰ
  choice: agbụ
  rationale: Ọ na-echekwa ihe oyiyi pụtara ìhè nke ihe e ji kee mmadụ, kama ịgbanwe ya ozugbo ka ọ bụrụ naanị mkpọrọ.
- source_word: θλίψεις
  choice: mkpagbu
  rationale: Ọ na-enye echiche nke nrụgide, ahụhụ, na ihe isi ike siri ike n'asụsụ Igbo doro anya.
- source_word: με
  choice: m
  rationale: E tinyere ya dị ka onye agbụ na mkpagbu ndị ahụ na-echere, dịka ederede SBLGNT si dị.
- source_word: μένουσιν
  choice: na-echere
  rationale: Ọ na-egosi na ihe ndị ahụ dị n'ihu ma na-abịara Pọl.
theological_decisions:
- issue: Onye okwu ahụ bụ “Mmụọ Nsọ” na-ezo aka na ya
  choice: Mmụọ Nsọ dị ka onye na-agbara Pọl akaebe ma na-ekwu okwu
  alternative: Ike ime mmụọ na-enweghị njirimara onye
  rationale: Ngwaa ịgba akaebe na ikwu okwu na-egosi onye na-eme ihe; ntụgharị ahụ na-echekwa nke a n'enweghị itinye nkọwa karịrị ihe amaokwu ahụ kwuru.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị nsọ ma dị mfe nghọta. E ji “n'obodo dị iche iche” gosipụta omume na-eme ugboro ugboro nke κατὰ πόλιν; e jikwa “agbụ” chekwaa ihe oyiyi kpọmkwem nke δεσμά.
