id: ACT.20.32
reference: Acts 20:32
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ τὰ νῦν παρατίθεμαι ⸀ὑμᾶς τῷ ⸀θεῷ καὶ τῷ λόγῳ τῆς χάριτος αὐτοῦ, τῷ δυναμένῳ ⸀οἰκοδομῆσαι καὶ δοῦναι ⸀τὴν κληρονομίαν ἐν τοῖς ἡγιασμένοις πᾶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/032.yaml
  text: And now I entrust you to God and to the word of his grace[a], which is able to build up and to give the inheritance among all those who have been sanctified.
translation:
  language: ig
  text: Ma ugbu a, ana m enyefe unu n’aka Chineke na n’aka okwu amara ya[a], nke pụrụ iwulite unu ma nye unu ihe nketa n’etiti ndị niile e doro nsọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “onye pụrụ,” ma ọ bụrụ na a ghọta na nkebi okwu a na-ezo n’ụzọ bụ isi na Chineke kama ịzo aka na “okwu amara ya.”
    reason: alternative_reading
lexical_decisions:
- source_word: παρατίθεμαι
  choice: ana m enyefe unu n’aka
  rationale: Nkebi okwu a na-egosi na Pọl na-etinye ndị na-ege ya ntị n’aka onye ọzọ ka o lekọta ha; ọ bụ ụzọ Igbo doro anya ma dịkwuo ndụ isi kwuo ‘entrust.’
- source_word: τῷ θεῷ
  choice: n’aka Chineke
  rationale: Ọ na-egosi onye Pọl nyefere ha n’aka ya, ma kwekọọ n’ụzọ Igbo si ekwu inyefe mmadụ n’aka onye ọzọ.
- source_word: τῷ λόγῳ τῆς χάριτος αὐτοῦ
  choice: n’aka okwu amara ya
  rationale: E chekwara njikọ okwu Grik ahụ na ịdị arọ nke λόγος; ‘okwu’ nwekwara ike ịpụta ozi a na-ekwusa.
- source_word: τῷ δυναμένῳ
  choice: nke pụrụ
  rationale: A na-ejikọta ya na ‘okwu amara ya,’ bụ́ aha kacha nso, ma e debere ohere nke ijikọta ya na Chineke na nkọwa ala peeji.
- source_word: οἰκοδομῆσαι
  choice: iwulite unu
  rationale: ‘Iwulite’ na-echekwa ihe atụ nke iwuli ụlọ, ebe ‘unu’ na-eme ka onye a na-ewulite pụta ìhè site n’okwu gbara ya gburugburu.
- source_word: δοῦναι τὴν κληρονομίαν
  choice: nye unu ihe nketa
  rationale: ‘Ihe nketa’ na-echekwa isi echiche Akwụkwọ Nsọ; agbakwụnyere ‘unu’ dị ka onye a na-enye ya, nke okwu gbara ya gburugburu na-egosi.
- source_word: ἐν τοῖς ἡγιασμένοις πᾶσιν
  choice: n’etiti ndị niile e doro nsọ
  rationale: Nke a na-echekwa participle perfect passive dịka okwu omume, ma ‘n’etiti’ na-egosipụta ἐν n’echiche nke iso ndị otu ahụ nweta oke.
theological_decisions:
- issue: Onye τῷ δυναμένῳ na-ezo aka na ya
  choice: Isi ederede jikọtara ‘nke pụrụ’ na ‘okwu amara ya.’
  alternative: A pụkwara ịghọta ya dị ka ‘onye pụrụ,’ ya bụ, na ọ na-ezo n’ụzọ bụ isi na Chineke.
  rationale: Ụtọasụsụ Grik nwere ike ịnabata ụzọ abụọ ahụ. ‘Okwu amara ya’ bụ ihe kacha nso n’ahịrịokwu, ma Chineke nwekwara ike ịbụ onye na-arụ ọrụ nke iwulite na inye ihe nketa; ya mere e debere ụzọ nke ọzọ na nkọwa ala peeji.
translation_notes:
  register: Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta. E ji ‘inyefe n’aka’ mee ka echiche nlekọta pụta ìhè; e chekwara okwu ndị dị mkpa dịka ‘amara,’ ‘iwulite,’ ‘ihe nketa,’ na ‘ndị e doro nsọ.’
