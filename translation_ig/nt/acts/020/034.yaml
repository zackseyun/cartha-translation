  text: αὐτοὶ γινώσκετε ὅτι ταῖς χρείαις μου καὶ τοῖς οὖσι μετ’ ἐμοῦ ὑπηρέτησαν αἱ χεῖρες αὗται.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/034.yaml
  text: You yourselves know that these hands served my needs and the needs of those who were with me[a].
translation:
  language: ig
  text: Unu onwe unu maara na aka ndị a rụrụ ọrụ gboo mkpa m na mkpa ndị mụ na ha nọ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “aka ndị a lebara mkpa m na mkpa ndị mụ na ha nọ anya.” Ngwaa Grik ahụ nwere ike imesi inye aka n’ọrụ bara uru nke na-eduga n’inweta nkwado ihe onwunwe ike.
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτοὶ
  choice: unu onwe unu
  rationale: Nnọchiaha ahụ na-emesi ndị na-ege ntị ike; ‘unu onwe unu’ na-echekwa nkwusi ike ahụ n’Igbo.
- source_word: γινώσκετε
  choice: maara
  rationale: Ọ na-egosi na ndị na-ege ntị maara omume Pọl nke ọma site n’ihe ha hụrụ.
- source_word: ταῖς χρείαις μου
  choice: mkpa m
  rationale: χρεία na-ezo aka n’ihe ndị dị mkpa ná ndụ, karịchaa ihe e ji ebi ndụ n’ọnọdụ a.
- source_word: τοῖς οὖσι μετ’ ἐμοῦ
  choice: ndị mụ na ha nọ
  rationale: Nke a na-edobe okwu Grik ahụ n’enweghị ịkọwa kpọmkwem ụdị mmekọrịta ha na Pọl nwere.
- source_word: ὑπηρέτησαν
  choice: rụrụ ọrụ iji gboo
  rationale: Ngwaa ahụ pụtara ije ozi ma ọ bụ inye aka n’ụzọ bara uru; ebe ‘aka ndị a’ bụ isiokwu ya, okwu a na-egosi ọrụ aka nke wetara ihe e ji gboo mkpa.
- source_word: αἱ χεῖρες αὗται
  choice: aka ndị a
  rationale: Nsụgharị a na-edobe ihe atụ doro anya na nkwusi ike nke Pọl ji aka ya na-arụ ọrụ.
theological_decisions: []
translation_notes:
  register: E ji Igbo Izugbe dị ugbu a, nke dị ùgwù ma dị mfe nghọta. A hapụrụ ihe atụ ‘aka ndị a’ ka nkwusi ike na ọrụ aka Pọl pụta ìhè; akara nkọwa ala peeji [a] dịkwa n’ahịrịokwu ahụ.
