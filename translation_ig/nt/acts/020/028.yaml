id: ACT.20.28
reference: Acts 20:28
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸀προσέχετε ἑαυτοῖς καὶ παντὶ τῷ ποιμνίῳ, ἐν ᾧ ὑμᾶς τὸ πνεῦμα τὸ ἅγιον ἔθετο ἐπισκόπους, ποιμαίνειν τὴν ἐκκλησίαν τοῦ ⸀θεοῦ, ἣν περιεποιήσατο διὰ τοῦ ⸂αἵματος τοῦ ἰδίου⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/028.yaml
  text: Pay careful attention to yourselves and to all the flock[a], in which the Holy Spirit has appointed you overseers, to shepherd the church of God[c][b], which he obtained through the blood of his own.
translation:
  language: ig
  text: Lezienụ onwe unu anya nke ọma, leziekwanụ ìgwè atụrụ ahụ niile anya. N’etiti ìgwè ahụ ka Mmụọ Nsọ họpụtara unu ịbụ ndị nlekọta, ka unu zụọ ọgbakọ Chineke[a], nke o nwetara nye onwe ya site n’ọbara onye nke ya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ụfọdụ akwụkwọ odide gụrụ, “ọgbakọ nke Onyenwe anyị,” kama “ọgbakọ Chineke.”
    reason: textual_variant
  - marker: b
    text: 'A pụkwara ịsụgharị ya, “nke o nwetara site n’ọbara Ọkpara nke ya”; nsụgharị ọdịnala bụ, “nke o nwetara site n’ọbara nke ya onwe ya.” N’asụsụ Grik, okwu ahụ dị nkenke: “site n’ọbara onye nke ya.”'
    reason: alternative_reading
lexical_decisions:
- source_word: προσέχετε
  choice: Lezienụ ... anya nke ọma
  rationale: Ọ bụ iwu na-aga n’ihu nke na-akpọ ha ka ha na-akpachara anya mgbe niile; okwu Igbo a bụ nke a na-aghọta nke ọma ma na-egosikwa nlekọta.
- source_word: παντὶ τῷ ποιμνίῳ
  choice: ìgwè atụrụ ahụ niile
  rationale: E debere ihe atụ onye ọzụzụ atụrụ dị n’asụsụ Grik, ebe ‘niile’ na-anọchi anya παντί.
- source_word: ἐν ᾧ
  choice: n’etiti ìgwè ahụ
  rationale: N’ihi na ποιμνίον bụ ìgwè mmadụ e ji ìgwè atụrụ tụnyere, ‘n’etiti’ bụ Igbo eke nke na-egosi na e tinyere ndị nlekọta ahụ n’ime ìgwè ahụ.
- source_word: ἔθετο
  choice: họpụtara
  rationale: N’ebe a τίθημι pụtara ido mmadụ n’ọrụ ma ọ bụ ịhọpụta ya maka ọrụ pụrụ iche.
- source_word: ἐπισκόπους
  choice: ndị nlekọta
  rationale: Nke a na-egosi ọrụ ilekọta na ile anya n’ahụ ndị ọzọ, n’etinyeghị echiche ọkwa ụka nke oge ndị mechara.
- source_word: ποιμαίνειν
  choice: na-azụ
  rationale: E debere ihe atụ nke ịzụ atụrụ; n’Igbo, ‘ịzụ ìgwè atụrụ’ na-egosi inye nri, idu na ilekọta ha.
- source_word: ἐκκλησίαν
  choice: ọgbakọ
  rationale: N’ebe a okwu ahụ na-ezo aka n’ọgbakọ ndị nke Chineke; ‘ọgbakọ’ bụ okwu Igbo doro anya ma ghara ime ka ụlọ bụrụ isi ihe.
- source_word: τοῦ θεοῦ
  choice: Chineke
  rationale: E soro ihe SBLGNT gụrụ, θεοῦ, ebe e tinyere nsụgharị ọzọ dị mkpa n’okpuru peeji.
- source_word: περιεποιήσατο
  choice: nwetara nye onwe ya
  rationale: ‘Nwetara’ anaghị amanye echiche azụmahịa nke ‘zụtara,’ ebe ‘nye onwe ya’ na-egosipụta ike middle voice nke inweta ihe ka ọ bụrụ nke onwe ya.
- source_word: διὰ τοῦ αἵματος
  choice: site n’ọbara
  rationale: διά ya na genitive na-egosi ụzọ ma ọ bụ ihe e ji mee ihe; ‘site n’ọbara’ na-edebekwa echiche àjà na mgbapụta.
- source_word: τοῦ ἰδίου
  choice: onye nke ya
  rationale: Nke a na-edebe adjective ahụ dịka okwu na-anọchi aha—‘onye nke ya’—na-agbakwụnyeghị ‘Ọkpara’ nke na-adịghị n’ederede Grik, ma na-ahapụ nghọta ya ka ọ dị nkenke dịka isi mmalite.
theological_decisions:
- issue: Onye okwu τοῦ αἵματος τοῦ ἰδίου na-ezo aka na ya na otú e kwesịrị isi sụgharịa ya
  choice: site n’ọbara onye nke ya
  alternative: site n’ọbara Ọkpara nke ya; ma ọ bụ, site n’ọbara nke ya onwe ya
  rationale: Grik kwuru nkenke ‘ọbara nke onye/nke ya.’ Ịtinye ‘Ọkpara’ na-eme ka otu nghọta a ma ama doo anya, ma aha ahụ adịghị kpọmkwem na Grik. Isi ederede na-edebe mgbagwoju anya ahụ, ebe nkọwa ala peeji na-enye nghọta abụọ bụ isi n’enweghị idozi esemokwu nkà mmụta okpukpe n’ụzọ nzuzo.
- issue: Ụdị ederede dị iche n’etiti ‘ọgbakọ Chineke’ na ‘ọgbakọ Onyenwe anyị’
  choice: ọgbakọ Chineke
  alternative: ọgbakọ Onyenwe anyị
  rationale: SBLGNT e nyere gụrụ θεοῦ (‘Chineke’). E debeere ụdị κυρίου (‘Onyenwe anyị’) nke ụfọdụ ihe odide nwere n’okpuru peeji.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E debere ihe atụ ìgwè atụrụ na ịzụ atụrụ, ma jiri ‘ndị nlekọta’ zere ibubata usoro ọkwa ụka nke oge ndị mechara. E kewara ahịrịokwu ahụ ụzọ abụọ iji mee ka ọ na-agụ nke ọma n’Igbo n’emebighị njikọ echiche nke Grik.
