revisions:
- from: Lezienụ onwe unu anya nke ọma, leziekwanụ ìgwè atụrụ ahụ niile anya. Ọ bụ n’etiti ìgwè ahụ ka Mmụọ Nsọ họpụtara unu ịbụ ndị nlekọta, ka unu na-azụ ọgbakọ Chineke[a], nke o nwetara nye onwe ya site n’ọbara onye nke ya[b].
  to: Lezienụ onwe unu anya nke ọma, leziekwanụ ìgwè atụrụ ahụ niile anya. N’etiti ìgwè ahụ ka Mmụọ Nsọ họpụtara unu ịbụ ndị nlekọta, ka unu zụọ ọgbakọ Chineke[a], nke o nwetara nye onwe ya site n’ọbara onye nke ya[b].
  rationale: 'The revision is limited to a safe grammatical improvement: it renders the purpose of the overseers’ appointment with Igbo subjunctive ‘ka unu zụọ.’ It also refines the footnote’s manuscript terminology. The main text continues to follow θεοῦ (‘Chineke’) and deliberately preserves the compact ambiguity of τοῦ ἰδίου rather than adding ‘Ọkpara’ as though it were explicit in the Greek.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T09:21:42Z'
review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately represents the SBLGNT reading: vigilance directed to the leaders and entire flock; the Holy Spirit’s appointment of overseers within the flock; shepherding God’s church; and acquisition through the blood of ‘his own.’ ‘N’etiti ìgwè ahụ’ is a sound, idiomatic contextual rendering of ἐν ᾧ. The ambiguous substantival τοῦ ἰδίου is appropriately retained rather than being resolved as ‘Son’ in the text.'
  naturalness: The register is clear Standard Igbo and preserves the pastoral imagery. However, ‘ka unu na-azụ ọgbakọ’ is progressive in form and does not express the Greek purpose infinitive as clearly as the subjunctive ‘ka unu zụọ ọgbakọ.’ The revision makes that syntactic relation explicit and smooths the manuscript-note wording.
  terminology: ‘Ìgwè atụrụ,’ ‘ndị nlekọta,’ ‘ọgbakọ Chineke,’ and ‘ịzụ’ preserve the source metaphors and avoid later denominational office terminology. ‘Onye nke ya’ is somewhat compact but is a viable Igbo way to preserve the deliberately terse, disputed reference; the footnote supplies the principal interpretive alternatives without imposing one.
  issues:
  - severity: medium
    issue: Purpose infinitive rendered with progressive form
    rationale: 'Greek ποιμαίνειν depends on the appointment and expresses purpose: the Spirit appointed them overseers ‘to shepherd.’ Igbo ‘ka unu na-azụ’ can describe an ongoing activity, whereas ‘ka unu zụọ’ more directly conveys the intended purpose/result without changing the pastoral metaphor.'
  - severity: low
    issue: Manuscript footnote wording can be more idiomatic
    rationale: ‘Akwụkwọ odide’ is clearer Standard Igbo terminology for manuscripts than bare ‘ihe odide’; adding ‘nke ọzọ’ clarifies that the alternative is a textual reading.
  revised_text: Lezienụ onwe unu anya nke ọma, leziekwanụ ìgwè atụrụ ahụ niile anya. N’etiti ìgwè ahụ ka Mmụọ Nsọ họpụtara unu ịbụ ndị nlekọta, ka unu zụọ ọgbakọ Chineke[a], nke o nwetara nye onwe ya site n’ọbara onye nke ya[b].
  revised_footnotes:
  - marker: a
    text: Ụfọdụ akwụkwọ odide gụrụ, “ọgbakọ nke Onyenwe anyị,” kama “ọgbakọ Chineke.”
    reason: textual_variant
  - marker: b
    text: 'A pụkwara ịsụgharị ya, “nke o nwetara site n’ọbara Ọkpara nke ya”; nsụgharị ọdịnala bụ, “nke o nwetara site n’ọbara nke ya onwe ya.” N’asụsụ Grik, okwu ahụ dị nkenke: “site n’ọbara onye nke ya.”'
    reason: alternative_reading
  revision_rationale: 'The revision is limited to a safe grammatical improvement: it renders the purpose of the overseers’ appointment with Igbo subjunctive ‘ka unu zụọ.’ It also refines the footnote’s manuscript terminology. The main text continues to follow θεοῦ (‘Chineke’) and deliberately preserves the compact ambiguity of τοῦ ἰδίου rather than adding ‘Ọkpara’ as though it were explicit in the Greek.'
