- from: Ọ ga-abụkwa n'etiti unu onwe unu ka ndị ikom ga-esi bilie, na-ekwu ihe ndị agbagọworo[a], ka ha dọpụ ndị na-eso ụzọ ka ha soro ha.
  to: Sitekwa n’etiti unu onwe unu, ndị ikom ga-ebili, na-ekwu ihe ndị gbagọrọ agbagọ[a], ka ha dọpụta ndị na-eso ụzọ ka ndị na-eso ụzọ soro ha.
  rationale: The revision restores the explicit “from among yourselves” relationship, smooths the Igbo syntax, and revises the lexical note so that its alternatives remain within the semantic range of διεστραμμένα. It does not narrow the warning to a defined doctrinal or moral category.
