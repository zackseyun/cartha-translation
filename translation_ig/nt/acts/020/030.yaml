  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἐξ ὑμῶν αὐτῶν ἀναστήσονται ἄνδρες λαλοῦντες διεστραμμένα τοῦ ἀποσπᾶν τοὺς μαθητὰς ὀπίσω ⸀ἑαυτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/030.yaml
  text: and from among your own selves men will arise[a], speaking twisted things, to draw away the disciples after themselves.
translation:
  language: ig
  text: Sitekwa n’etiti unu onwe unu, ndị ikom ga-ebili, na-ekwu ihe ndị gbagọrọ agbagọ[a], ka ha dọpụta ndị na-eso ụzọ ka ndị na-eso ụzọ soro ha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ihe ndị e megharịrị”; ma ọ bụ, “ihe ndị na-adịghị ọtọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξ ὑμῶν αὐτῶν
  choice: n'etiti unu onwe unu
  rationale: 'Nke a na-edobe nkwusi ike nke αὐτῶν: ndị ga-eweta nsogbu ahụ ga-esi kpọmkwem n''ime ọgbakọ ahụ pụta.'
- source_word: ἀναστήσονται
  choice: ga-esi bilie
  rationale: N'ebe a, ngwaa ahụ pụtara na ndị dị otú ahụ ga-apụta ma ọ bụ bilie n'etiti ha; ọdịnihu ya ka e debere.
- source_word: ἄνδρες
  choice: ndị ikom
  rationale: ἀνήρ bụ okwu kpọmkwem maka ndị nwoke, ya mere e meghị ya okwu na-anọpụ iche gbasara okike.
- source_word: λαλοῦντες
  choice: na-ekwu
  rationale: Nke a bụ ụzọ Igbo dị mfe ma bụrụkwa nke nkịtị isi gosipụta omume ikwu okwu nke participle ahụ.
- source_word: διεστραμμένα
  choice: ihe ndị agbagọworo
  rationale: Nhọrọ a na-egosi ihe e si n'ezi ụzọ ma ọ bụ n'eziokwu gbagọọ, n'emeghị ka amaokwu ahụ kwuo kpọmkwem ụdị ozizi ụgha ọ bụ.
- source_word: τοῦ ἀποσπᾶν
  choice: ka ha dọpụ
  rationale: τοῦ na infinitive na-egosi ebumnuche, ebe ‘dọpụ’ na-edobe ihe oyiyi nke ịdọpụ mmadụ n'ebe ọ nọ.
- source_word: τοὺς μαθητὰς
  choice: ndị na-eso ụzọ
  rationale: Nke a bụ okwu Igbo a maara nke ọma maka μαθηταί n'ọnọdụ Ndịozi.
- source_word: ὀπίσω ἑαυτῶν
  choice: ka ha soro ha
  rationale: Akpaokwu ahụ na-ekwu maka ime ka ndị na-eso ụzọ tụkwasị ndị ikom ahụ obi ma ghọọ ndị na-eso ha; ntụgharị a na-ada eke n'Igbo.
theological_decisions:
- issue: Ụdị okwu ndị nkuzi ụgha ahụ ga-ekwu
  choice: ihe ndị agbagọworo
  alternative: ihe rụrụ arụ; ihe e megharịrị ka ọ ghara ịbụ eziokwu
  rationale: Grik ahụ na-enye ịdọ aka ná ntị sara mbara banyere ihe e si n'ezi ụzọ gbagọọ, ma ọ kọwaghị otu ozizi ụgha pụrụ iche; ntụgharị ahụ anaghị emechi ihe okwu ahụ nwere ike ịpụta.
- issue: Nsụgharị okike nke ἄνδρες
  choice: ndị ikom
  alternative: ndị mmadụ
  rationale: E debere ihe okwu Grik ahụ kwuru kpọmkwem banyere ndị nwoke kama ime ka ọ bụrụ okwu na-anọpụ iche.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị ùgwù ma doo anya. E jiri ‘unu onwe unu’ mesie ike na ihe ize ndụ ahụ ga-esi n'ime ha pụta; e zere okwu ụka pụrụ iche nke otu denominashọn.
