review_pass:
  verdict: revise
  source_fidelity: 'A correction is needed for the opening clause: “Ọ ga-abụkwa n''etiti … ka” is an unnecessarily periphrastic construction and does not directly render ἐξ (“from/out of”). “Sitekwa n’etiti unu onwe unu” clearly preserves both the source-within sense and the emphasis of αὐτῶν. The purpose and personal-following sense in the latter clause are retained.'
  naturalness: The revised wording is fluent, modern Standard Igbo. Explicitly repeating “ndị na-eso ụzọ” as the subject of the final clause removes avoidable ambiguity in the consecutive pronouns while retaining the Greek sense.
  terminology: “Ndị ikom” accurately retains the masculine ἄνδρες. “Ndị na-eso ụzọ” is established and suitable for μαθητάς. “Ihe ndị gbagọrọ agbagọ” communicates distorted/perverted speech without specifying a particular error. The former footnote alternative “ihe rụrụ arụ” is too morally narrow for διεστραμμένα and is replaced by closer lexical alternatives.
  issues:
  - severity: medium
    issue: The opening phrase does not directly express “from among.”
    rationale: “Ọ ga-abụkwa n’etiti unu onwe unu ka …” foregrounds a copular/future construction rather than the Greek prepositional source phrase ἐξ ὑμῶν αὐτῶν. “Sitekwa n’etiti unu onwe unu” is both faithful and idiomatic.
  - severity: low
    issue: The footnote’s “ihe rụrụ arụ” narrows the meaning.
    rationale: That expression primarily denotes shameful or immoral things, whereas διεστραμμένα broadly denotes things distorted, crooked, or perverted.
  revised_text: Sitekwa n’etiti unu onwe unu, ndị ikom ga-ebili, na-ekwu ihe ndị gbagọrọ agbagọ[a], ka ha dọpụta ndị na-eso ụzọ ka ndị na-eso ụzọ soro ha.
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “ihe ndị e megharịrị”; ma ọ bụ, “ihe ndị na-adịghị ọtọ.”
    reason: lexical_alternative
  revision_rationale: The revision restores the explicit “from among yourselves” relationship, smooths the Igbo syntax, and revises the lexical note so that its alternatives remain within the semantic range of διεστραμμένα. It does not narrow the warning to a defined doctrinal or moral category.
