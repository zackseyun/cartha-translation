  to: Ma anyị ji ụgbọ mmiri si Filipa pụọ mgbe ụbọchị Achịcha Na-enweghị Eko gasịrị, anyị wee bịakwute ha na Troas n’ime ụbọchị ise[a]. Anyị nọrọ ebe ahụ ụbọchị asaa.
