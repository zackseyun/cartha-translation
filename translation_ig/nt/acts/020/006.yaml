source:
  edition: SBLGNT
  text: ἡμεῖς δὲ ἐξεπλεύσαμεν μετὰ τὰς ἡμέρας τῶν ἀζύμων ἀπὸ Φιλίππων, καὶ ἤλθομεν πρὸς αὐτοὺς εἰς τὴν Τρῳάδα ἄχρι ἡμερῶν πέντε, ⸀οὗ διετρίψαμεν ἡμέρας ἑπτά.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/006.yaml
  text: But we sailed away from Philippi after the days of Unleavened Bread[a], and came to them at Troas within five days, where we stayed seven days.
translation:
  language: ig
  text: Ma anyị ji ụgbọ mmiri si Filipa pụọ mgbe ụbọchị Achịcha Na-enweghị Eko gasịrị, anyị wee bịakwute ha na Troas n’ime ụbọchị ise[a]. Anyị nọrọ ebe ahụ ụbọchị asaa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’ụbọchị ise.” Okwu Grik ahụ na-egosi ogologo oge njem ahụ were ruo mgbe ha bịarutere.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξεπλεύσαμεν
  choice: anyị ji ụgbọ mmiri ... pụọ
  rationale: Ngwaa a pụtara isi n’otu ebe pụọ n’ụgbọ mmiri; okwu Igbo a doro anya ma bụrụkwa nke a na-asụ n’ụzọ ebumpụta ụwa.
- source_word: μετὰ τὰς ἡμέρας τῶν ἀζύμων
  choice: mgbe Ụbọchị Achịcha Na-ekoghị Eko gasịrị
  rationale: Nke a na-echekwa ntụaka oge nke Grik na aha oge ememme ndị Juu, na-agbakwụnyeghị okwu ‘ememme’ nke na-adịghị n’ahịrịokwu ahụ kpọmkwem.
- source_word: ἀπὸ Φιλίππων
  choice: si Filipa
  rationale: ‘Si’ bụ ụzọ Igbo nkịtị e si egosi ebe njem malitere; ‘Filipa’ bụ nsụgharị aha obodo ahụ dabara n’usoro ụda Igbo.
- source_word: ἤλθομεν πρὸς αὐτοὺς
  choice: anyị wee bịakwute ha
  rationale: ‘Bịakwute ha’ na-egosi ije ruo n’ebe ndị ahụ nọ, n’etinyeghị echiche ọzọ dịka ‘sonyere ha.’
- source_word: εἰς τὴν Τρῳάδα
  choice: na Troas
  rationale: Ebe ‘bịakwute ha’ egosilarị mmegharị ahụ, ‘na Troas’ na-egosi ebe ha nọ n’Igbo dị nro.
- source_word: ἄχρι ἡμερῶν πέντε
  choice: n’ụbọchị ise
  rationale: Okwu a na-egosi oge njem ahụ were ruo mgbe ha bịarutere. ‘N’ụbọchị ise’ na-echekwa nghọta bụ isi nke ụbọchị ise zuru ruo mbata.
- source_word: οὗ
  choice: ebe ahụ
  rationale: Ọ na-alaghachi azụ n’obodo Troas n’ụzọ doro anya ma dị mma n’Igbo.
- source_word: διετρίψαμεν ἡμέρας ἑπτά
  choice: Anyị nọrọ ebe ahụ ụbọchị asaa
  rationale: ‘Nọrọ’ na-egosi ịnọgide n’otu ebe ruo oge a kpọrọ aha, n’ụzọ Igbo nkịtị.
theological_decisions: []
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E kewara ahịrịokwu ahụ ụzọ abụọ iji mee ka usoro njem na oge ịnọ na Troas doo anya, na-enweghị ịgbanwe ihe Grik kwuru.
