  source_fidelity: 'The verse accurately represents the Greek travel sequence: Paul met the group at Assos, they took him aboard, and they arrived at Mitylene. “n’Asọs” is idiomatic for the meeting location, and “kpọọrọ ya banye n’ụgbọ mmiri” appropriately makes explicit the nautical implication of ἀναλαβόντες without altering the sense.'
