  text: ὡς δὲ ⸀συνέβαλλεν ἡμῖν εἰς τὴν Ἆσσον, ἀναλαβόντες αὐτὸν ἤλθομεν εἰς Μιτυλήνην,
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/014.yaml
  text: And when he met us at Assos[a], we took him on board and came to Mitylene.
translation:
  language: ig
  text: Mgbe ọ zutere anyị n’Asọs[a], anyị kpọọrọ ya banye n’ụgbọ mmiri, wee ruo Mitilini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “sonyere anyị n’Asọs” ma ọ bụ “ya na anyị zukọrọ n’Asọs.” Ngwaa Grik ahụ nwere ike ịpụta izute ma ọ bụ ịbịakọta ọnụ; n’ebe a, echiche ya bụ na Pọl sonyeere ndị otu ahụ ọzọ n’ebe ahụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνέβαλλεν
  choice: zutere
  rationale: N’akụkọ njem a, ngwaa ahụ pụtara n’ụzọ kacha kwekọọ na Pọl zutere ndị otu ahụ ọzọ n’Asọs. ‘Zutere’ bụ okwu Igbo doro anya ma dịkwa eke, ebe nkọwa ndị ọzọ nwere ike ịbụ ‘sonyere’ ma ọ bụ ‘zukọtara.’
- source_word: ἡμῖν
  choice: anyị
  rationale: Nnọchiaha dative plural a na-ezo aka n’ìgwè ahụ ji ụgbọ mmiri na-eme njem; n’Igbo, ọ na-esochi ‘zutere’ n’enweghị mgbakwunye ọzọ.
- source_word: εἰς τὴν Ἆσσον
  choice: n’Asọs
  rationale: Ọ bụ ezie na εἰς na-egosikarị ntụziaka gaa ebe, ya na ngwaa nzute, ‘n’Asọs’ na-egosi ebe nzute ahụ mere n’Igbo eke.
- source_word: ἀναλαβόντες
  choice: anyị kpọọrọ ya banye n’ụgbọ mmiri
  rationale: N’ọnọdụ njem n’oké osimiri a, participle ahụ na-egosi na ha nabatara Pọl n’ụgbọ mmiri ka o soro ha. Nsụgharị a na-eme ka ọnọdụ ahụ doo anya n’Igbo n’enweghị ịgbakwunye ihe ọhụrụ.
- source_word: αὐτόν
  choice: ya
  rationale: Ọ na-ezo aka na Pọl, onye a kpọtụrụ aha n’akụkụ okwu bu ụzọ.
- source_word: ἤλθομεν
  choice: wee ruo
  rationale: N’akụkọ njem Igbo, ‘ruo’ na-ekwupụta nke ọma na ha bịarutere ebe ha na-aga; ‘wee’ jikọtara omume ahụ na ịkpọrọ Pọl banye n’ụgbọ mmiri.
- source_word: εἰς Μιτυλήνην
  choice: Mitilini
  rationale: 'A sụgharịrị ahịrịokwu ntụziaka ahụ site n’iji ‘ruo,’ ebe a degharịrị aha obodo Μιτυλήνη n’ụdị Igbo dị mfe ịgụ: ‘Mitilini.’'
theological_decisions: []
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-agbaso usoro akụkọ njem eke n’Igbo, ma ihe odide ala peeji na-echekwa obosara ihe συνέβαλλεν nwere ike ịpụta.
