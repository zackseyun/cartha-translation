  to: Mgbe ọgbaaghara ahụ kwụsịrị, Pọl zigara ka a kpọta ndị na-eso ụzọ ahụ. Mgbe ọ gbasịrị ha ume ma sị ha nọrọ nke ọma[a], ọ hapụrụ ebe ahụ gawa Masedonia.
  rationale: The sole revision replaces the ambiguous “ọ pụrụ” with “ọ hapụrụ ebe ahụ,” which clearly expresses Paul’s departure (ἐξῆλθεν) while retaining the following infinitival purpose, “gawa Masedonia.” The source order, its farewell nuance, and the existing footnote anchor are preserved.
