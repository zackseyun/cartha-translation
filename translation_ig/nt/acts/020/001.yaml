id: ACT.20.1
reference: Acts 20:1
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Μετὰ δὲ τὸ παύσασθαι τὸν θόρυβον ⸀μεταπεμψάμενος ὁ Παῦλος τοὺς μαθητὰς καὶ ⸀παρακαλέσας, ἀσπασάμενος ἐξῆλθεν ⸀πορεύεσθαι ⸀εἰς Μακεδονίαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/001.yaml
  text: After the uproar had ceased[a], Paul sent for the disciples, and after encouraging them and saying farewell, he departed to go to Macedonia.
translation:
  language: ig
  text: Mgbe ọgbaaghara ahụ kwụsịrị, Pọl zigara ka a kpọta ndị na-eso ụzọ ahụ. Mgbe ọ gbasịrị ha ume ma sị ha nọrọ nke ọma[a], ọ hapụrụ ebe ahụ gawa Masedonia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ma kelee ha.” Okwu Grik ahụ nwere ike ịpụta ikele mmadụ, ma n'ọnọdụ onye na-apụ apụ, ọ pụkwara ịpụta ịsị ndị mmadụ nọrọ nke ọma.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δὲ τὸ παύσασθαι
  choice: Mgbe ... kwụsịrị
  rationale: 'Nkebi ahịrịokwu a na-egosi oge: ihe Pọl mere bịara mgbe ọgbaaghara ahụ kwụsịrị.'
- source_word: θόρυβον
  choice: ọgbaaghara ahụ
  rationale: N'ebe a, okwu ahụ na-ezo aka n'ọgbaaghara ọha na eze dị ukwuu nke mere n'Efesọ.
- source_word: μεταπεμψάμενος
  choice: zigara ka a kpọta
  rationale: Okwu Grik a pụtara iziga mmadụ ka ọ kpọta ndị ọzọ bịakwute onye zitere ya.
- source_word: τοὺς μαθητὰς
  choice: ndị na-eso ụzọ ahụ
  rationale: N'Ọrụ Ndị Ozi, okwu a na-akpọkarị ndị na-eso Jizọs; ntụgharị a na-edobe okwu Luk ji mee ihe.
- source_word: παρακαλέσας
  choice: gbasịrị ha ume
  rationale: Okwu a nwere ike ịpụta ịgba ume, ịdụ ọdụ, ma ọ bụ ịkasi obi. N'ọnọdụ a, 'ịgba ume' na-egosi iwusi ha ike n'ebughị ụzọ mechie ihe ọ pụtara n'otu ụzọ naanị.
- source_word: ἀσπασάμενος
  choice: sị ha nọrọ nke ọma
  rationale: Ọ bụ ezie na okwu a na-apụtakarị ikele mmadụ, n'ọnọdụ onye na-apụ apụ ọ pụrụ ịpụta ịsị ndị mmadụ nọrọ nke ọma. Ihe odide bụ isi na-egosipụta ọnọdụ ọpụpụ ahụ, ebe nkọwa ala peeji na-edobe ụzọ ọzọ e nwere ike isi ghọta ya.
- source_word: ἐξῆλθεν
  choice: ọ pụrụ
  rationale: N'akụkọ njem a, okwu ahụ na-egosi na Pọl hapụrụ ebe ahụ ma malite njem.
- source_word: πορεύεσθαι εἰς Μακεδονίαν
  choice: gawa Masedonia
  rationale: Nke a na-egosi ebumnuche njem ahụ na ebe ọ na-aga n'ụzọ dị mkpirikpi ma doo anya n'Igbo.
theological_decisions: []
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta mee ntụgharị ahụ. A kewara ahịrịokwu ahụ ụzọ abụọ ka ọ gụọ nke ọma n'Igbo, ma e debere usoro ihe ndị mere na njikọ ha dịka isi mmalite Grik si dị.
