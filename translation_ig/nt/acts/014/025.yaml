  text: καὶ λαλήσαντες ἐν Πέργῃ τὸν λόγον κατέβησαν εἰς Ἀττάλειαν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/025.yaml
  text: And after speaking the word in Perga[a], they went down to Attalia,
translation:
  language: ig
  text: Mgbe ha kwuchara okwu ahụ na Pega[a], ha rịdatara gaa Atalia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Mgbe ha kwusịrị okwu ahụ na Pega.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λαλήσαντες
  choice: Mgbe ha kwusịrị
  rationale: Aorist participle a na-egosi ihe ha buru ụzọ mee tupu omume bụ isi; usoro a bụ Igbo eke ma doo anya. “Kwusịrị” na-edobe echiche izisa okwu n'ekwughị na ngwaa ahụ pụtara kpọmkwem “kpọsa.”
- source_word: τὸν λόγον
  choice: okwu ahụ
  rationale: N'ebe a, λόγος bụ ozi Ndị Kraịst ha na-ezisa. “Okwu ahụ” na-edobe okwu Lọk ji eme ihe ugboro ugboro, na-etinyeghị “nke Onyenwe anyị,” nke na-adịghị n'ihe odide Grik.
- source_word: ἐν Πέργῃ
  choice: na Pega
  rationale: ἐν tinyere aha obodo na-egosi ebe ihe mere; “na Pega” bụ ụzọ Igbo nkịtị si kwuo ya.
- source_word: κατέβησαν
  choice: ha rịdara gaa
  rationale: καταβαίνω pụtara ịrịdata ma ọ bụ ịga ala. “Rịdara gaa” na-echekwa echiche ọnọdụ ala—site n'ime ala gaa n'ụsọ oké osimiri—ma na-egosikwa njem ruo ebe ọzọ.
- source_word: εἰς Ἀττάλειαν
  choice: gaa Atalia
  rationale: εἰς na-egosi ebe njem ahụ na-aga; “gaa Atalia” bụ Igbo eke maka njem ruo obodo ahụ.
- source_word: καὶ
  choice: ha
  rationale: Njikọ καί na-aga n'ihu n'akụkọ njem ahụ. N'Igbo, njikọ oge “Mgbe...” sochiri ahịrịokwu bụ isi na-eme ka usoro ahụ doo anya n'ụzọ eke, n'enweghị mkpa itinye “Na” n'isi amaokwu.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke dị ugwu ma dị mfe nghọta. E ji “Pega” na “Atalia” dee aha obodo ndị ahụ n'ụzọ dabara n'ụda Igbo. Akara nkọwa [a] dị n'ahịrị isi ozugbo aha Pega gasịrị.
