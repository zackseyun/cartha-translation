- from: Ha nọkwa ebe ahụ na-ekwusa ozi ọma.[a]
  to: N’ebe ahụ kwa, ha nọ na-ekwusa ozi ọma.[a]
  rationale: The revision only adjusts word order for natural Standard Igbo and aligns the alternative footnote’s orthography with the main text. It retains the ongoing past action expressed by εὐαγγελιζόμενοι ἦσαν, the connective/additive force of κἀκεῖ, and the nontechnical sense of proclaiming good news.
