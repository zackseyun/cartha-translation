  source_fidelity: 'The draft conveys the periphrastic imperfect καλά: the apostles were engaged in the continuing activity of proclaiming good news. Its ''-kwa'' appropriately represents the connective/additive force of κἀκεῖ. Reordering the location to the front more directly reflects ''and/there also'' without adding meaning.'
