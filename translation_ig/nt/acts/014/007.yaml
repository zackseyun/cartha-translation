  yaml_path: translation/nt/acts/014/007.yaml
  text: And there they were preaching the good news[a].
translation:
  language: ig
  text: N’ebe ahụ kwa, ha nọ na-ekwusa ozi ọma.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “N’ebe ahụ kwa, ha nọ na-akpọsa ozi ọma.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀκεῖ
  choice: Ha nọkwa ebe ahụ
  rationale: κἀκεῖ jikọtara καί na ἐκεῖ; “-kwa ebe ahụ” na-egosipụta ma njikọ ya na amaokwu gara aga ma echiche nke ‘n’ebe ahụ kwa.’ A tinyere ‘Ha nọ’ ka ọ sonyere n’usoro okwu ἦσαν nke ọma n’Igbo.
- source_word: εὐαγγελιζόμενοι
  choice: na-ekwusa ozi ọma
  rationale: Nkebiokwu a pụtara ịkpọsa ozi ọma. “Na-ekwusa ozi ọma” bụ Igbo doro anya, nke oge a, ma na-ezere okwu ụka pụrụ iche.
- source_word: ἦσαν
  choice: Ha nọ... na-ekwusa
  rationale: ἦσαν na participle εὐαγγελιζόμενοι mejupụtara usoro na-egosi omume na-aga n’ihu n’oge gara aga. “Ha nọ... na-ekwusa” na-eburu ọdịdị a n’Igbo.
theological_decisions: []
translation_notes:
  register: Standard Igbo dị mfe nghọta ma dịkwa ugwu. E ji “ozi ọma” mee ihe n’ahịrị isi iji gosipụta ihe εὐαγγελίζω pụtara ozugbo; “oziọma” dị ka okwu e jikọtara ọnụ ka edebere n’ala ala peeji dịka okwu ọzọ a na-ejikarị eme ihe.
