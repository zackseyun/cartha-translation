  terminology: ‘Ozi ọma’ is a clear, current rendering of εὐαγγέλιον / the good news and ‘na-ekwusa’ suitably renders εὐαγγελιζόμενοι. The footnote’s ‘na-akpọsa oziọma’ is a legitimate lexical/register alternative; standardizing it as ‘ozi ọma’ maintains the spelling used in the main text.
