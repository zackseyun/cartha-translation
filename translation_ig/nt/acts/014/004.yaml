  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐσχίσθη δὲ τὸ πλῆθος τῆς πόλεως, καὶ οἱ μὲν ἦσαν σὺν τοῖς Ἰουδαίοις οἱ δὲ σὺν τοῖς ἀποστόλοις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/004.yaml
  text: But the people of the city were divided[a], and some were with the Jews and some with the apostles.
translation:
  language: ig
  text: 'Ma ndị obodo ahụ kewara abụọ[a]: ụfọdụ nọ n''akụkụ ndị Juu, ndị ọzọ nọkwa n''akụkụ ndịozi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Ìgwè mmadụ nke obodo ahụ gbawara ụzọ abụọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσχίσθη
  choice: kewara abụọ
  rationale: Okwu a bụ n'ụdị nnara, na-egosi na ndị ahụ gbawara gaa n'akụkụ abụọ. “Kewara abụọ” bụ Igbo doro anya ma na-adịkwa mfe nghọta n'ọnọdụ esemokwu ọha.
- source_word: τὸ πλῆθος τῆς πόλεως
  choice: ndị obodo ahụ
  rationale: N'ebe a, πλῆθος na-ezo aka n'ọtụtụ ndị bi n'obodo ahụ, ọ bụghị naanị ìgwè gbakọtara n'otu ebe. “Ndị obodo ahụ” na-enye echiche a n'Igbo nkịtị.
- source_word: δὲ
  choice: Ma
  rationale: δέ na-egosi ntakịrị ntụgharị ma ọ bụ ihe dị iche na ihe e kwuru tupu ya; “Ma” na-egosipụta nke a nke ọma.
- source_word: οἱ μὲν ... οἱ δὲ
  choice: ụfọdụ ... ndị ọzọ
  rationale: Usoro a na-ekewa ndị ahụ n'òtù abụọ na-emegide onwe ha. “Ụfọdụ ... ndị ọzọ” bụ ụzọ Igbo si ekwu ya nke ọma.
- source_word: σὺν
  choice: nọ n'akụkụ
  rationale: σύν pụtara ịnọnyere mmadụ, ma n'ọnọdụ a ọ na-egosikwa nkwado ma ọ bụ isonyere otu akụkụ. “Nọ n'akụkụ” na-eme ka echiche ahụ doo anya n'ebughị nkọwa ọzọ n'ime amaokwu ahụ.
- source_word: Ἰουδαίοις
  choice: ndị Juu
  rationale: Amaokwu ahụ ekwughị kpọmkwem na ọ bụ naanị ndị ndú; ya mere, a hapụrụ ya dị ka “ndị Juu,” nke kwekọrọ n'okwu Grik ahụ.
- source_word: ἀποστόλοις
  choice: ndị ozi
  rationale: N'Ọrụ Ndị Ozi, okwu a bụ aha e ji mara ndị e zipụrụ ozi. N'ebe a ọ na-ezo aka na Pọl na Banabas, ndị Luk kpọkwara ndị ozi na Ọrụ Ndị Ozi 14:14.
theological_decisions:
- issue: Ndị okwu ahụ bụ “ndị ozi” na-ezo aka na ha
  choice: E debere “ndị ozi” dị ka aha akụkọ ahụ nyere Pọl na Banabas.
  alternative: ndị e zipụrụ ozi
  rationale: Luk kpọrọ Banabas na Pọl “ndị ozi” n'isiakwụkwọ a (Ọrụ Ndị Ozi 14:14). Nsụgharị a na-edebe okwu Luk n'etinyeghị nkọwa ozizi karịrị ihe amaokwu ahụ kwuru.
translation_notes:
  register: E ji Igbo Izugbe dị ugbu a, nke dị ugwu ma dị mfe nghọta. “Nọ n'akụkụ” na-egosi mmekọrịta na nkwado nke σύν n'ọnọdụ a, ebe “ndị obodo ahụ” na-ezere ime ka πλῆθος yie naanị ìgwè mmadụ gbakọtara n'otu ebe.
