  text: ὡς δὲ ἐγένετο ὁρμὴ τῶν ἐθνῶν τε καὶ Ἰουδαίων σὺν τοῖς ἄρχουσιν αὐτῶν ὑβρίσαι καὶ λιθοβολῆσαι αὐτούς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/005.yaml
  text: And when an attempt was made by both the Gentiles and the Jews[a], together with their rulers, to mistreat them and to stone them[b],
translation:
  language: ig
  text: Ma mgbe ndị mba ọzọ na ndị Juu[b], tinyere ndị ọchịchị ha, gbara mbọ[a] imeso ha ihe ọjọọ na ịtụ ha nkume,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “mgbaba” ma ọ bụ “mbuso agha.” Okwu Grik ὁρμή nwere ike ịpụta ngagharị ike ma ọ bụ mbuso agha. A họọrọ “mbọ” n’ebe a n’ihi na e kwuru imeso ha ihe ọjọọ na ịtụ ha nkume dịka ihe ndị iro ahụ bu n’obi ime, ọ bụghị dịka ihe ndị ha mechaala.
    reason: lexical_alternative
  - marker: b
    text: N’ọnọdụ ụfọdụ, a pụkwara ịsụgharị “ndị Juu” dịka “ndị Judia.” N’ebe a, o yiri ka ọ na-ezo aka n’òtù ndị Juu na-emegide ha, ọ bụghị kpọmkwem ndị si Judia.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ
  choice: Ma mgbe
  rationale: “Ma” na-ejigide njikọ dị nro nke δέ, ebe “mgbe” na-egosi ọrụ oge nke ὡς n’akụkọ a.
- source_word: ἐγένετο ὁρμὴ
  choice: mere mbọ
  rationale: Nkebiokwu a na-egosi na omume iro bidoro ma ọ bụ na a nwara ime ya. “Mere mbọ” bụ Igbo doro anya nke na-adịghị ekwu na ihe ahụ mezuru.
- source_word: τῶν ἐθνῶν
  choice: ndị mba ọzọ
  rationale: N’Ọrụ Ndị Ozi, mgbe e ji ἔθνη tụnyere ndị Juu, ọ na-ezokarị aka n’ebe ndị na-abụghị ndị Juu nọ, ọ bụghị mba dị iche iche dịka ọchịchị.
- source_word: τε καὶ
  choice: ndị mba ọzọ na ndị Juu
  rationale: Njikọ “na” n’usoro a na-egosi na otu abụọ ahụ sonyere n’omume ahụ.
- source_word: Ἰουδαίων
  choice: ndị Juu
  rationale: N’ebe a, okwu ahụ na-ezo aka n’òtù ndị Juu na-emegide ndị ozi, ọ bụghị nanị ndị si Judia.
- source_word: σὺν τοῖς ἄρχουσιν αὐτῶν
  choice: tinyere ndị ọchịchị ha
  rationale: “Tinyere” na-egosipụta σύν, ebe “ndị ọchịchị” na-echekwa echiche nke ndị nwere ikike dị na ἄρχοντες.
- source_word: ὑβρίσαι
  choice: imeso ha ihe ọjọọ
  rationale: ὑβρίζω nwere ike ịgụnye mmegbu, mkparị, na mmeso ike. Nkebiokwu Igbo a sara mbara nke ọma ma ọ naghị akpọchi ya naanị na mkparị ọnụ.
- source_word: καὶ λιθοβολῆσαι
  choice: na iji nkume tụgbuo ha
  rationale: Nke a na-egosipụta omume iji nkume wakpo mmadụ nke λιθοβολέω pụtara, na-agbakwụghị okwu doro anya “gbuo ha,” nke isi mmalite ahụ na-ekwughị iche.
- source_word: αὐτούς
  choice: ha
  rationale: Nnọchiaha a na-ezo aka na Pọl na Banabas dịka okwu ndị gbara ya gburugburu si gosi.
theological_decisions: []
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, nke dị ugwu ma dị mfe nghọta. E debere usoro ahịrịokwu ahụ ka ọ gaa n’ihu n’amaokwu na-esote, dịka nkebiokwu Grik si eme. E tinyere akara nkọwa [a] n’akụkụ “mbọ” na [b] n’akụkụ “ndị Juu,” ka akara nke ọ bụla kwekọọ n’ezi okwu nkọwa ya.
