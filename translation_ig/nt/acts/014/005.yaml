  verdict: revise
  source_fidelity: The draft accurately represents the coordinated hostile intent of Gentiles and Jews with their rulers, and it correctly leaves the verse syntactically open for continuation. However, “iji nkume tụgbuo ha” is less idiomatic and can suggest merely throwing them down with stones rather than the conventional act of stoning.
  naturalness: “Mere mbọ” is understandable, but “gbara mbọ” is the more natural Standard Igbo collocation. “Tụọ ha nkume” is the clear, established Igbo expression for stoning.
  terminology: '“Ndị mba ọzọ,” “ndị Juu,” and “ndị ọchịchị ha” are suitable contextual equivalents. The lexical footnote for ὁρμή needs an idiomatic alternative: “ịbanye ha n’ike” is not a natural or precise rendering in this setting.'
  issues:
  - severity: medium
    issue: The rendering “iji nkume tụgbuo ha” is not the most idiomatic expression for λιθοβολῆσαι.
    rationale: In Standard Igbo, “tụọ ha nkume” naturally and specifically denotes stoning. “Tụgbuo” may convey throwing down or knocking down and thus weakens the lexical precision.
  - severity: low
    issue: “Mere mbọ” is a less natural collocation than “gbara mbọ.”
    rationale: Both preserve the uncompleted hostile purpose, but “gbara mbọ” is more idiomatic in contemporary Standard Igbo.
  - severity: medium
    issue: The first footnote gives “ịbanye ha n’ike” as an alternative for ὁρμή.
    rationale: That phrase is not idiomatic here and does not clearly convey a hostile rush/onset. It should be replaced by a natural alternative such as “mgbaba” or “mbuso agha.”
