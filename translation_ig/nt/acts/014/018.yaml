- from: Ọbụna mgbe ha kwuchara ihe ndị a, ọ fọrọ obere ka ha ghara inwe ike igbochi ìgwè mmadụ ahụ ịchụrụ ha àjà.
  to: Ma, ọbụna ka ha na-ekwu ihe ndị a, o siiri ha nnọọ ike igbochi ìgwè mmadụ ndị ahụ ịchụrụ ha àjà.
  rationale: The revision retains the concessive force reflected in the English audit trail, preserves the participle’s contemporaneous aspect, and renders μόλις as successful restraint achieved only with great difficulty. No footnote is needed because the pronoun “ha” is clear from the immediate narrative context and no textual ambiguity requires explanation.
