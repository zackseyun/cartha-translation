  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ταῦτα λέγοντες μόλις κατέπαυσαν τοὺς ὄχλους τοῦ μὴ θύειν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/018.yaml
  text: Even by saying these things, they barely restrained the crowds from sacrificing to them.
translation:
  language: ig
  text: Ma, ọbụna ka ha na-ekwu ihe ndị a, o siiri ha nnọọ ike igbochi ìgwè mmadụ ndị ahụ ịchụrụ ha àjà.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ ταῦτα λέγοντες
  choice: Ọbụna mgbe ha kwuchara ihe ndị a
  rationale: N'ọnọdụ a, καί na-egosi na ọbụna okwu ndị ahụ siri ike ime ka ìgwè mmadụ kwụsị; “mgbe ha kwuchara” na-enye echiche nke participle ahụ n'Igbo nkịtị.
- source_word: μόλις κατέπαυσαν
  choice: ọ fọrọ obere ka ha ghara inwe ike igbochi
  rationale: μόλις pụtara na ha jisiri ike mee ya n'ókè ikpeazụ, ya bụ na ọ siri ha nnọọ ike; ntụgharị a na-egosipụta ihe ize ndụ nke na ọ fọrọ obere ka mbọ ha ghara ịga nke ọma.
- source_word: τοὺς ὄχλους
  choice: ìgwè mmadụ ahụ
  rationale: Ọ bụ ìgwè ndị mmadụ e kwuburu banyere ha n'akụkọ ahụ; singular collective na-ada nke ọma n'Igbo.
- source_word: τοῦ μὴ θύειν αὐτοῖς
  choice: ịchụrụ ha àjà
  rationale: Genitive articular infinitive na μὴ na-akọwa ihe e gbochiri ìgwè mmadụ ime; θύειν bụ ịchụ àjà, αὐτοῖς bụ “ha,” ya bụ Pọl na Banabas.
theological_decisions:
- issue: Ndị a chọrọ ịchụrụ àjà
  choice: E debere nnọchiaha “ha” dịka isi mmalite si kwuo.
  alternative: Ịkpọ Pọl na Banabas aha kpọmkwem.
  rationale: Nnọchiaha αὐτοῖς doro anya site n'ọnọdụ gbara ya gburugburu, ma idebe ya na-echekwa ụdị okwu isi mmalite ma ghara ịgbakwunye nkọwa n'amaokwu ahụ.
translation_notes:
  register: Standard Igbo; okwu dị ugbu a, dị nsọ ma dị mfe nghọta. E jiri “ọ fọrọ obere ka ha ghara inwe ike” gosipụta μόλις n'ụzọ eke, na-enweghị ibelata echiche na ha mechara gbochie àjà ahụ.
