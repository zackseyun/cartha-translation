source:
  edition: SBLGNT
  text: οἱ δὲ ⸀ἀπειθήσαντες Ἰουδαῖοι ἐπήγειραν καὶ ἐκάκωσαν τὰς ψυχὰς τῶν ἐθνῶν κατὰ τῶν ἀδελφῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/002.yaml
  text: But the Jews who were disobedient stirred up the Gentiles and poisoned their minds against the brothers[a][b][c].
translation:
  language: ig
  text: Ma ndị Juu ahụ jụrụ ikwere kpaliri ndị mba ọzọ, meekwa ka obi ha jọọ njọ megide ụmụnna[a][b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ndị nupụrụ isi.” Okwu Grik ahụ pụrụ ịpụta ịjụ ikwere ozi ahụ; n’ebe a, o yikarịrị ka ọ na-ekwu maka ịjụ oziọma ahụ.
    reason: lexical_alternative
  - marker: b
    text: N’asụsụ Grik, “mkpụrụ obi ha”; n’ebe a ọ pụtara ọnọdụ ime ha, ya bụ, echiche ma ọ bụ mmetụta ha.
    reason: lexical_alternative
  - marker: c
    text: “Ụmụnna” n’ebe a yiri ka ọ na-ezo aka n’ebe ndị kwere ekwe n’ozuzu ha nọ, gụnyere ụmụ nwanyị.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπειθήσαντες
  choice: jụrụ ikwere
  rationale: N’ọnọdụ nkwusa oziọma a, okwu ahụ na-egosi na ha jụrụ ikwere ozi ahụ; nsụgharị a na-edokwa echiche nke ịjụ n’amaghị amaghị.
- source_word: Ἰουδαῖοι
  choice: ndị Juu ahụ
  rationale: Ọ na-ezo aka n’ìgwè ndị Juu ahụ nọ n’ebe a bụ́ ndị megidere ozi ahụ, ọ bụghị ndị Juu niile.
- source_word: ἐπήγειραν
  choice: kpaliri
  rationale: Okwu Igbo a na-egosi ịkpali ndị ọzọ ka ha nwee mmegide ma ọ bụ mee ihe.
- source_word: ἐκάκωσαν
  choice: meekwa ka obi ha jọọ njọ
  rationale: Ebe mkpụrụ obi bụ ihe e mere ihe, ngwaa a na-ekwu maka imebi ọnọdụ ime mmụọ ma ọ bụ echiche ha ka ha bụrụ ndị iro; akpaokwu a bụ nke doro ndị Igbo anya.
- source_word: τὰς ψυχὰς
  choice: obi ha
  rationale: N’ebe a ψυχή pụtara ọnọdụ ime mmadụ, echiche, ma ọ bụ mmetụta ya, ọ bụghị okwu nkà mmụta okpukpe pụrụ iche banyere mkpụrụ obi.
- source_word: τῶν ἐθνῶν
  choice: ndị mba ọzọ
  rationale: N’ọnọdụ ọdịiche dị n’etiti ndị Juu na ndị na-abụghị ndị Juu n’Ọrụ Ndịozi, okwu a pụtara ndị mba ọzọ.
- source_word: κατὰ τῶν ἀδελφῶν
  choice: megide ụmụnna
  rationale: “Ụmụnna” na-edobe ihe oyiyi ezinụlọ dị na Grik ma nwee ike ịgụnye ndị kwere ekwe n’ozuzu ha.
theological_decisions:
- issue: Ma ἀδελφῶν ọ na-ezo naanị aka n’ụmụ nwoke ka ọ bụ n’ọgbakọ ndị kwere ekwe niile
  choice: ụmụnna
  alternative: ụmụnna nwoke na ụmụnna nwanyị; ndị kwere ekwe
  rationale: Ụdị Grik bụ ọtụtụ nke nwoke, ma n’okwu Ndị Kraịst mbụ ọ na-ejikarị ezo aka n’ọgbakọ ndị kwere ekwe niile. Isi ederede debere okwu ezinụlọ ahụ, ebe nkọwa ala peeji na-akọwa na ọ pụrụ ịgụnye ụmụ nwanyị.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “Jụrụ ikwere” na-eme ka ọnọdụ nkwusa oziọma doo anya; “meekwa ka obi ha jọọ njọ” na-ebuga akpaokwu Grik n’Igbo nkịtị n’enweghị itinye nkà mmụta banyere mkpụrụ obi nke okwu ahụ na-achọghị.
