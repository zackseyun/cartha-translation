id: ACT.14.20
reference: Acts 14:20
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: κυκλωσάντων δὲ ⸂τῶν μαθητῶν αὐτὸν⸃ ἀναστὰς εἰσῆλθεν εἰς τὴν πόλιν. καὶ τῇ ἐπαύριον ἐξῆλθεν σὺν τῷ Βαρναβᾷ εἰς Δέρβην.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/020.yaml
  text: But after the disciples had gathered around him[a], he got up and went into the city[b]. And on the next day he went out with Barnabas to Derbe.
translation:
  language: ig
  text: Ma mgbe ndị na-eso ụzọ gbara ya gburugburu[a], o biliri[b] banye n’obodo ahụ. N’echi ya, ya na Banabas pụrụ gaa Debe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “nọchiri ya gburugburu.”
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsị, “o guzoro ọtọ.” Okwu Grik ahụ pụrụ ịpụta otú a, ma n’ebe a, o yikarịrị ka ọ na-ekwu na Pọl biliri n’ala, ọ bụghị na ọ na-akọ kpọmkwem banyere mbilite n’ọnwụ.
    reason: alternative_reading
lexical_decisions:
- source_word: κυκλωσάντων
  choice: gbara ya gburugburu
  rationale: Nkebiokwu a na-egosipụta na ndị na-eso ụzọ nọchiri Pọl gburugburu; ọ bụ Igbo doro anya nke na-edobe echiche nke ịgba mmadụ gburugburu n’enweghị ịkọwa ebumnuche ha dị ka nke iro.
- source_word: δὲ
  choice: Ma
  rationale: Ọ na-egosi obere ntụgharị ma ọ bụ ihe dị iche na ihe mere n’amaokwu bu ụzọ, mgbe a tụgburu Pọl nkume ma dọkpụrụ ya pụọ n’obodo.
- source_word: τῶν μαθητῶν
  choice: ndị na-eso ụzọ
  rationale: Nke a bụ okwu Igbo a na-ejikarị akọwa μαθητής, ma kwekọọ n’ojiji ya n’Ọrụ Ndị Ozi.
- source_word: ἀναστὰς
  choice: o biliri
  rationale: N’ebe a, okwu ahụ na-akọwa omume Pọl nke ibili n’ala; ọ naghị ekwu n’onwe ya na e mere ka o si n’ọnwụ bilie.
- source_word: εἰσῆλθεν εἰς τὴν πόλιν
  choice: banye n’obodo ahụ
  rationale: Nke a na-edobe ngagharị ịbanye n’ime obodo ahụ ma na-ada nke ọma n’Igbo mgbe ọ na-esochi ‘o biliri.’
- source_word: τῇ ἐπαύριον
  choice: N’echi ya
  rationale: Nke a bụ ụzọ Igbo e si akọwa ụbọchị sochirinụ n’ụzọ dị nkenke ma dị eke.
- source_word: ἐξῆλθεν
  choice: pụrụ gaa
  rationale: ‘Pụrụ’ na-edobe echiche nke isi n’obodo ahụ pụọ, ebe ‘gaa’ na-ejikọta ya nke ọma na ebe ha na-aga, bụ́ Debe.
- source_word: σὺν τῷ Βαρναβᾷ
  choice: ya na Banabas
  rationale: Nke a bụ usoro Igbo doro anya maka igosi na Banabas so Pọl.
- source_word: Δέρβην
  choice: Debe
  rationale: A sụgharịrị aha obodo ahụ n’ụdị a na-eji n’Igbo, kama ịgbakwunye nkọwa na-adịghị n’ihe odide Grik.
theological_decisions:
- issue: Ma ἀναστὰς ò kwesịrị ịpụta na Pọl si n’ọnwụ bilie ma ọ bụ na e mere ọrụ ebube n’ahụ ya
  choice: 'A sụgharịrị ya dị ka omume anụ ahụ nkịtị: ‘o biliri.’'
  alternative: ‘e mere ka o bilie’ ma ọ bụ okwu ga-egosi kpọmkwem na o si n’ọnwụ bilie
  rationale: Ọ bụ ezie na ọnọdụ ahụ na-egosi mgbake dị ịtụnanya mgbe a tụgburu Pọl nkume, amaokwu a ekwughị kpọmkwem na ọ nwụrụ ma ọ bụ na e mere ka o si n’ọnwụ bilie. Nsụgharị ahụ anaghị atụkwasị nkwupụta nkà mmụta okpukpe nke okwu Grik n’onwe ya na-ekwughị.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. ‘Ndị na-eso ụzọ’ na ‘o biliri’ bụ okwu ndị nkịtị ga-aghọta, ebe e debere ihe odide ahụ n’enweghị ịkọwapụta ihe karịrị ihe Grik kwuru.
