source:
  edition: SBLGNT
  text: Ἐπῆλθαν δὲ ἀπὸ Ἀντιοχείας καὶ Ἰκονίου Ἰουδαῖοι, καὶ πείσαντες τοὺς ὄχλους καὶ λιθάσαντες τὸν Παῦλον ἔσυρον ἔξω τῆς πόλεως, ⸀νομίζοντες αὐτὸν τεθνηκέναι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/019.yaml
  text: But Jews came from Antioch and Iconium[a], and after persuading the crowds and stoning Paul, they dragged him outside the city, supposing that he was dead.
translation:
  language: ig
  text: Ma ndị Juu si Antiọk na Aịkoniọm bịara. Mgbe ha mere ka ìgwè mmadụ ndị ahụ kwenye, ha tụrụ Pọl nkume, dọkpụrụ ya n'èzí obodo ahụ, na-eche na ọ nwụọla.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ya bụ, ha chere na ọ nwụọla. Okwu Grik na-akọ ihe ha chere; ọ naghị ekwu hoo haa na Pọl nwụrụ n’ezie.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐπῆλθαν δὲ
  choice: Ma ... bịa
  rationale: “Ma” na-egosi mgbanwe nwere obere mmegide n'ihe ọma mere tupu ya; “bịa” na-egosi ọbịbịa ndị mmegide ahụ n'ụzọ Igbo dị mfe.
- source_word: Ἰουδαῖοι
  choice: ndị Juu
  rationale: N'ebe a okwu ahụ na-ekwu maka ụfọdụ ndị Juu bịara imegide Pọl, ọ bụghị ndị bi na Judia naanị.
- source_word: πείσαντες τοὺς ὄχλους
  choice: Mgbe ha mere ka ìgwè mmadụ ahụ kwenye n'okwu ha
  rationale: 'Nke a na-edobe usoro omume ahụ: ha buru ụzọ mee ka ìgwè mmadụ kwenye, e mesịa ha atụ Pọl nkume. Mgbakwunye “n''okwu ha” na-eme ka Igbo doo anya n''ebughị echiche ọhụrụ bata.'
- source_word: λιθάσαντες τὸν Παῦλον
  choice: ha tụrụ Pọl nkume
  rationale: Nke a bụ ụzọ Igbo kwụ ọtọ ma doo anya isi kwuo mwakpo e ji nkume mee.
- source_word: ἔσυρον ἔξω τῆς πόλεως
  choice: dọkpụrụ ya pụọ n'obodo ahụ
  rationale: “Dọkpụrụ” na-egosi ike na ihe ike dị na σύρω, “pụọ n'obodo ahụ” na-egosikwa na e bugara ya n'èzí obodo.
- source_word: νομίζοντες αὐτὸν τεθνηκέναι
  choice: na-eche na ọ nwụọla
  rationale: Okwu a na-akọ echiche ndị wakporo ya, ọ bụghị nkwupụta onye ode akwụkwọ na Pọl nwụrụ n'ezie. “Ọ nwụọla” na-egosipụta perfect infinitive n'Igbo nkịtị.
theological_decisions:
- issue: Ma amaokwu ahụ kwuru na Pọl nwụrụ n'ezie, ka ọ bụ naanị na ndị wakporo ya chere otú ahụ
  choice: 'E debere ya dị ka echiche ha: “na-eche na ọ nwụọla.”'
  alternative: A pụrụ ịsụgharị ya n'ụzọ ga-eme ka ọ dị ka Pọl nwụrụ n'ezie ma mesịa dịghachi ndụ.
  rationale: Grik νομίζοντες na-egosi ihe ha chere. Amaokwu ahụ n'onwe ya ekwughị hoo haa na Pọl nwụrụ n'ezie, ya mere ntụgharị a anaghị edozi okwu ahụ karịa ihe isi mmalite kwuru.
translation_notes:
  register: Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E jiri “ìgwè mmadụ” maka ὄχλοι ma zere okwu ụka pụrụ iche. A tinyere akara [a] ozugbo n'akụkụ ahịrịokwu ọ na-akọwa.
