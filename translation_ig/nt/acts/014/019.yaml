revisions:
- from: Ma ndị Juu si Antiọk na Aịkoniọm bịa. Mgbe ha mere ka ìgwè mmadụ ahụ kwenye n'okwu ha, ha tụrụ Pọl nkume, dọkpụrụ ya pụọ n'obodo ahụ, na-eche na ọ nwụọla.[a]
  to: Ma ndị Juu si Antiọk na Aịkoniọm bịara. Mgbe ha mere ka ìgwè mmadụ ndị ahụ kwenye, ha tụrụ Pọl nkume, dọkpụrụ ya n'èzí obodo ahụ, na-eche na ọ nwụọla.[a]
  rationale: The revision preserves the source’s sequence and ambiguity while correcting the plural “crowds,” removing an unnecessary added specification, and making the destination explicitly outside the city. The note retains the audit-trail function of clarifying that the Greek reports the opponents’ assumption only.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T09:19:10Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the hostile arrival of Jews from Antioch and Iconium, the stoning of Paul, the dragging of him beyond the city, and—importantly—the attackers’ belief that he had died rather than an assertion that he actually died. However, “ìgwè mmadụ ahụ” is singular where ὄχλους is plural, and “n'okwu ha” adds an element not expressed in the Greek. “Pụọ n'obodo ahụ” can be less precise than the source’s destination outside the city.
  naturalness: The register is generally clear Standard Igbo. A single connected narrative sentence better reflects the Greek participial sequence. “Dọkpụrụ ya n'èzí obodo ahụ” is natural and explicitly reaches the required location outside the city.
  terminology: “Ndị Juu,” “Pọl,” “Antiọk,” and “Aịkoniọm” are suitable. “Tụrụ Pọl nkume” is idiomatic. The explanatory note should not present “ọ nwụrụ anwụ” as an alternative, since that wording is less natural and does not improve the distinction at issue.
  issues:
  - severity: medium
    issue: The crowds are rendered as singular.
    rationale: ὄχλους is plural. “Ìgwè mmadụ ndị ahụ” preserves the plural reference naturally in Igbo.
  - severity: low
    issue: “n'okwu ha” is added to the persuasion clause.
    rationale: The Greek says only that they persuaded the crowds; it does not specify that persuasion was by their words. The addition is plausible but unnecessary.
  - severity: low
    issue: The footnote’s proposed alternative is not idiomatic or meaningfully distinct.
    rationale: “Ọ nwụrụ anwụ” is not the best Standard Igbo expression here. The note can directly explain that the Greek reports their supposition rather than Paul’s actual death.
  revised_text: Ma ndị Juu si Antiọk na Aịkoniọm bịara. Mgbe ha mere ka ìgwè mmadụ ndị ahụ kwenye, ha tụrụ Pọl nkume, dọkpụrụ ya n'èzí obodo ahụ, na-eche na ọ nwụọla.[a]
  revised_footnotes:
  - marker: a
    text: Ya bụ, ha chere na ọ nwụọla. Okwu Grik na-akọ ihe ha chere; ọ naghị ekwu hoo haa na Pọl nwụrụ n’ezie.
    reason: lexical_alternative
  revision_rationale: The revision preserves the source’s sequence and ambiguity while correcting the plural “crowds,” removing an unnecessary added specification, and making the destination explicitly outside the city. The note retains the audit-trail function of clarifying that the Greek reports the opponents’ assumption only.
