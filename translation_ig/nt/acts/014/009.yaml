  text: οὗτος ⸀ἤκουσεν τοῦ Παύλου λαλοῦντος· ὃς ἀτενίσας αὐτῷ καὶ ἰδὼν ὅτι ⸂ἔχει πίστιν⸃ τοῦ σωθῆναι
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/009.yaml
  text: This man listened to Paul speaking[a], who, looking intently at him and seeing that he had faith to be saved,
translation:
  language: ig
  text: Nwoke a gere Pọl ntị ka ọ na-ekwu okwu. Pọl legidere ya anya nke ọma ma hụ na o nwere okwukwe a ga-eji gwọọ ya,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ịsụgharị ya n’ụzọ sara mbara: “okwukwe a ga-eji zọpụta ya.” Ngwaa Grik ahụ nwere ike ịpụta “ịzọpụta” ma ọ bụ “ịgwọ”; n’ebe a, ihe ndị gbara ya gburugburu na-akwado ọgwụgwọ anụ ahụ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτος
  choice: Nwoke a
  rationale: Okwu nrụtụaka a na-ezo aka kpọmkwem n’ebe nwoke ahụ ngwọrọ nọ n’amaokwu bu ụzọ; ‘Nwoke a’ doro anya ma bụrụkwa Igbo nkịtị.
- source_word: ἤκουσεν
  choice: nọ na-ege ... ntị
  rationale: Nke a na-egosi na nwoke ahụ ji ntị na mmasị na-anụ okwu Pọl, ọ bụghị nanị na olu rutere ya ná ntị.
- source_word: τοῦ Παύλου λαλοῦντος
  choice: Pọl ... ka ọ na-ekwu okwu
  rationale: Ọ na-echekwa echiche nke Pọl nọ n’ọrụ ikwu okwu n’oge nwoke ahụ na-ege ya ntị, n’asụsụ Igbo dị ire.
- source_word: ἀτενίσας αὐτῷ
  choice: legidere ya anya nke ọma
  rationale: ‘Legidere ... anya’ na-egosi ile mmadụ anya kpọmkwem na nlebara anya siri ike, dịka ngwaa Grik ahụ si pụta.
- source_word: ἰδὼν
  choice: hụkwa
  rationale: A họọrọ okwu nkịtị maka ịhụ ma ọ bụ ịghọta ihe; ọ naghị akọwa ụzọ Pọl si mata ya karịa ka isi mmalite kwuru.
- source_word: ἔχει πίστιν
  choice: o nwere okwukwe
  rationale: πίστις ebe a bụ ntụkwasị obi nke nwoke ahụ nwere maka ịnata enyemaka Chineke, ọ bụghị ‘ikwesị ntụkwasị obi’ ya.
- source_word: τοῦ σωθῆναι
  choice: a ga-eji gwọọ ya
  rationale: N’ọnọdụ akụkọ a, σωθῆναι na-ezo aka n’ịgwọ nwoke ngwọrọ ahụ ma mee ka ahụ dị ya mma. Ihe okwu ahụ nwekwara ike ịpụta n’ụzọ sara mbara ka e debere n’ala peeji.
theological_decisions:
- issue: Ihe σωθῆναι pụtara n’akụkọ ọgwụgwọ a
  choice: ọgwụgwọ anụ ahụ (‘a ga-eji gwọọ ya’)
  alternative: nzọpụta n’ụzọ sara mbara (‘a ga-eji zọpụta ya’)
  rationale: Ihe na-esote amaokwu a bụ ọgwụgwọ ahụ nwoke ahụ ozugbo. Ya mere, ‘gwọọ’ na-egosipụta ihe okwu ahụ pụtara kpọmkwem n’ọnọdụ a, ebe nkọwa ala peeji na-echekwa nghọta sara mbara nke ngwaa Grik ahụ.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị mfe nghọta ma nwee ugwu. E kewara ahịrịokwu ahụ ụzọ abụọ ka njikọ nke nnọchiaha Grik ὃς doo anya na ọ bụ Pọl legidere nwoke ahụ anya. Akara rịkọm n’ikpeazụ na-egosi na amaokwu 9 na-aga n’ihu n’amaokwu 10.
