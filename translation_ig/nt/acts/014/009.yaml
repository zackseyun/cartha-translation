  source_fidelity: The referents, Paul's intent gaze, the man's faith, and the contextual rendering of τοῦ σωθῆναι as physical healing are conveyed accurately. However, Greek ἤκουσεν is an aorist and is better represented by the completed event ‘gere ... ntị’ than by the progressive construction ‘nọ na-ege ... ntị.’ The explicit repetition of ‘Pọl’ appropriately removes any possible Igbo ambiguity concerning the relative pronoun ὃς.
  naturalness: The revision uses natural Standard Igbo. ‘Gere Pọl ntị ka ọ na-ekwu okwu’ is idiomatic and retains the contemporaneous sense of Paul’s speaking. ‘Legidere ya anya nke ọma ma hụ na...’ is clear and fluent.
  terminology: ‘Okwukwe’ properly renders πίστις. ‘A ga-eji gwọọ ya’ naturally expresses faith directed toward being healed in this miracle context; the footnote responsibly retains the broader ‘zọpụta’ alternative without imposing a doctrinal interpretation.
