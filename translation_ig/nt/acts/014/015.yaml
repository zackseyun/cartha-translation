id: ACT.14.15
reference: Acts 14:15
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ λέγοντες· Ἄνδρες, τί ταῦτα ποιεῖτε; καὶ ἡμεῖς ὁμοιοπαθεῖς ἐσμεν ὑμῖν ἄνθρωποι, εὐαγγελιζόμενοι ὑμᾶς ἀπὸ τούτων τῶν ματαίων ἐπιστρέφειν ἐπὶ ⸀θεὸν ζῶντα ὃς ἐποίησεν τὸν οὐρανὸν καὶ τὴν γῆν καὶ τὴν θάλασσαν καὶ πάντα τὰ ἐν αὐτοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/015.yaml
  text: and saying[a], “Men, why are you doing these things? We also are men with the same nature as you, bringing you good news to turn from these worthless things to the living God[c][b], who made the heaven and the earth and the sea and everything in them.”
translation:
  language: ig
  text: na-asị, “Ndị nwoke, gịnị mere unu ji eme ihe ndị a? Anyị onwe anyị bụkwa ụmụ mmadụ dị ka unu[a]. Anyị na-ewetara unu ozi ọma ka unu si n’ihe ndị a na-abaghị uru[b] chigharịkwuru Chineke dị ndụ, onye kere eluigwe[c] na ụwa na oké osimiri na ihe niile dị n’ime ha.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ndị nwere otu ọnọdụ mmadụ ahụ unu nwere.” Ihe ọ pụtara bụ na Pọl na Banabas na ndị na-ege ha ntị bụcha mmadụ nkịtị.
    reason: lexical_alternative
  - marker: b
    text: N’ọnọdụ akụkọ a, “ihe ndị a na-abaghị uru” na-ezo aka n’ofufe chi ndị ọzọ nke na-enweghị isi, tinyere arụsị.
    reason: cultural_note
  - marker: c
    text: Okwu Grik ji ụdị otu ọnụ nke okwu “eluigwe” mee ihe n’usoro okwu okike a maara nke ọma, nke yiri asụsụ e ji dee Akwụkwọ Nsọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄνδρες
  choice: Ndị nwoke
  rationale: Ọ bụ okwu a kpọrọ ìgwè ndị nwoke kpọmkwem; “Ndị nwoke” na-edobe nkọwa nwoke dị na okwu Grik ma bụrụkwa okwu Igbo a pụrụ ịghọta nke ọma.
- source_word: ὁμοιοπαθεῖς ... ἄνθρωποι
  choice: ụmụ mmadụ dị ka unu
  rationale: Nke a na-egosi na Pọl na Banabas bụkwa mmadụ nkịtị ndị ha na ndị na-ege ha ntị nwere otu ọnọdụ mmadụ; ọ bụghị naanị na ha nwere otu mmetụta.
- source_word: εὐαγγελιζόμενοι
  choice: na-ewetara unu ozi ọma
  rationale: Nke a na-edobe ya dị ka omume nke iweta ma ọ bụ ikwusa ozi ọma, n’enweghị ịgbakwunye okwu ụka pụrụ iche nke na-adịghị mkpa.
- source_word: ματαίων
  choice: ihe ndị a na-abaghị uru
  rationale: Okwu Grik ahụ pụtara ihe efu, ihe na-enweghị isi, ma ọ bụ ihe na-abaghị uru. Nhọrọ a na-edobe obosara okwu ahụ kama ịgbanwe ya ozugbo ka ọ bụrụ “arụsị.”
- source_word: ἐπιστρέφειν ἐπὶ θεὸν ζῶντα
  choice: ka unu si ... chigharịkwuru Chineke dị ndụ
  rationale: “Chigharịkwuru” na-egosi ntụgharị pụọ n’otu ihe gaa n’ebe Chineke nọ; “dị ndụ” na-emegide ihe ofufe na-adịghị ndụ n’ọnọdụ akụkọ a.
- source_word: ἐποίησεν
  choice: kere
  rationale: N’ebe a ποιέω na-ekwu maka ọrụ okike Chineke; “kere” bụ okwu Igbo doro anya ma dịkwa mma n’usoro okwu okike.
- source_word: τὸν οὐρανὸν ... πάντα τὰ ἐν αὐτοῖς
  choice: eluigwe ... na ihe niile dị n’ime ha
  rationale: Nke a na-edobe ndepụta zuru ezu nke eluigwe, ụwa, na oké osimiri, tinyere ihe niile dị n’ime ha.
theological_decisions:
- issue: Ọnọdụ Pọl na Banabas n’ịjụ nsọpụrụ dị ka chi
  choice: Anyị onwe anyị bụkwa ụmụ mmadụ dị ka unu
  alternative: Anyị onwe anyị nwekwara ụdị ndụ unu nwere
  rationale: Nhọrọ a na-ekwusi ike na ha bụ mmadụ nkịtị, ọ naghịkwa ebelata ὁμοιοπαθεῖς ka ọ bụrụ naanị mmetụta ma ọ bụ agụụ mmadụ.
- issue: Ihe mataίων gụnyere
  choice: ihe ndị a na-abaghị uru
  alternative: arụsị ndị a
  rationale: Ọnọdụ akụkọ ahụ gụnyere arụsị na ofufe arụsị, ma okwu Grik ahụ sara mbara karịa aha “arụsị”; ya mere ederede bụ isi na-edobe obosara ya, ebe nkọwa ala peeji na-akọwa ọnọdụ ya.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta, dee ya. A hapụrụ usoro okwu ahụ ka ọ gosipụta ntụgharị pụọ n’ihe na-abaghị uru gaa n’ebe Chineke dị ndụ nọ, ma e debere njikọ “na” ugboro ugboro n’usoro okike ahụ.
