translation_notes:
  register: Standard Igbo; asụsụ dị ugbu a, dị nsọ ma dị mfe nghọta. E debere nkọwa abụọ nke Greek—enweghị ike n'ụkwụ na ịbụ onye ngwọrọ—iche iche.
