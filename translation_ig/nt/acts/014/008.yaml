review_pass:
  verdict: revise
  source_fidelity: 'Ntụgharị ahụ na-edobe usoro na nkọwa Grik nke ọma: nwoke a nọ ọdụ, enweghị ike metụtara ụkwụ ya, ọ bụ onye ngwọrọ kemgbe n’afọ nne ya, ọ dịbeghịkwa mgbe ọ jere ije. Otú ọ dị, «ụkwụ ya enweghị ike» anaghị ada n’ụzọ eke n’Igbo; a chọrọ ka e gosipụta onye ahụ dịka onye na-enweghị ike n’ụkwụ ya.'
  naturalness: «Onye na-enweghị ike n’ụkwụ ya» bụ asụsụ Igbo dị mfe ma doo anya karịa «ụkwụ ya enweghị ike». E mezikwara nkebiokwu nke ihe odide ala peeji ka ọ bụrụ Igbo ziri ezi, wepụtakwa mmejọ mbugharị «enweghị ike ike».
  terminology: «Onye ngwọrọ» dabara nke ọma maka χωλός, ebe «n’afọ nne ya» na-echekwa okwu Grik banyere ọnọdụ ahụ kemgbe n’afọ nne ya. A na-edobe echiche abụọ ahụ iche, dị ka Grik si eme.
