source:
  edition: SBLGNT
  text: Καί τις ἀνὴρ ⸂ἀδύνατος ἐν Λύστροις⸃ τοῖς ποσὶν ἐκάθητο, χωλὸς ἐκ κοιλίας μητρὸς ⸀αὐτοῦ, ὃς οὐδέποτε ⸀περιεπάτησεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/008.yaml
  text: And in Lystra a certain man was sitting[a], powerless in his feet, lame from his mother's womb, who had never walked.
translation:
  language: ig
  text: Na Listra, otu nwoke nọ ọdụ, onye na-enweghị ike n’ụkwụ ya[a]; ọ bụ onye ngwọrọ site n’afọ nne ya, ọ dịbeghịkwa mgbe ọ bụla ọ jere ije.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “enweghị ike n’ụkwụ ya.” Grik buru ụzọ mesie enweghị ike n’ụkwụ ya ike tupu o kwuo hoo haa na nwoke ahụ bụ onye ngwọrọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καί
  choice: Na
  rationale: N'Igbo, “Na” na-aga n'ihu n'akụkọ a n'ụzọ dị mfe ma dị eke.
- source_word: τις ἀνὴρ
  choice: otu nwoke
  rationale: Ọ na-egosi otu nwoke a kapịrị ọnụ ma a kpọghị aha ya.
- source_word: ἀδύνατος ... τοῖς ποσίν
  choice: ụkwụ ya enweghị ike
  rationale: Nke a na-echekwa echiche mbụ nke enweghị ike n'ụkwụ, n'agwakọtaghị ya ozugbo na χωλός nke na-esochi.
- source_word: ἐν Λύστροις
  choice: na Listra
  rationale: A tụgharịrị aha obodo ahụ n'ụdị a na-asụkarị n'Igbo.
- source_word: ἐκάθητο
  choice: nọ ọdụ
  rationale: Ọ na-egosipụta ọnọdụ na-aga n'ihu nke imperfect Greek n'ụzọ eke n'Igbo.
- source_word: χωλός
  choice: onye ngwọrọ
  rationale: Nke a bụ okwu Igbo doro anya maka onye na-enweghị ike ịga ije nke ọma, ma ọ na-edobe nkọwa a iche na enweghị ike n'ụkwụ.
- source_word: ἐκ κοιλίας μητρὸς αὐτοῦ
  choice: site n'afọ nne ya
  rationale: Nke a na-echekwa ihe atụ doro anya nke Greek karịa ịsị naanị “site n'ọmụmụ.”
- source_word: οὐδέποτε περιεπάτησεν
  choice: ọ dịghịkwa mgbe ọ bụla ọ jere ije
  rationale: Ọ na-egosi na nwoke ahụ ejeghị ije n'oge ọ bụla ruo mgbe akụkọ a mere.
