  text: καὶ διελθόντες τὴν Πισιδίαν ἦλθον εἰς ⸀τὴν Παμφυλίαν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/024.yaml
  text: And after passing through Pisidia, they came into Pamphylia.
translation:
  language: ig
  text: Mgbe ha gafesịrị Pisidia, ha bịarutere Pamfilia.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διελθόντες
  choice: mgbe ha gafesịrị
  rationale: Aorist participle a na-egosi ihe mere tupu ngwaa bụ isi; nkebi a na-egosipụta usoro oge ahụ n'Igbo dị mfe ma bụrụkwa nke e ji asụ asụ.
- source_word: Πισιδίαν
  choice: Pisidia
  rationale: Aha mpaghara; e dere ya n'ụdị ntụgharịmkpụrụokwu dabara n'usoro ụda na mkpụrụedemede Igbo.
- source_word: ἦλθον
  choice: ha bịarutere
  rationale: N'akụkọ njem a, ọ na-egosi na ha rutere ebe ha na-aga; 'bịarutere' bụ okwu Igbo doro anya ma kwekọọ n'ọnọdụ a.
- source_word: εἰς τὴν Παμφυλίαν
  choice: Pamfilia
  rationale: εἰς na-egosi ije ruo ma ọ bụ banye n'otu ebe. Ngwaa 'bịarutere' na aha ebe ahụ na-enye echiche ntụziaka ahụ n'Igbo eke, n'agbanyeghị na e tinyeghị 'n'ime' nke pụrụ ịdị arọ ebe a.
- source_word: καὶ
  choice: Mgbe
  rationale: Njikọ καὶ na participle na-aga n'ihu n'akụkọ ahụ. N'Igbo, 'Mgbe ...' na-ejikọta amaokwu ahụ na ihe bu ụzọ ma mee ka mmekọrịta oge pụta ìhè n'enweghị 'na' na-adịghị eke na mmalite.
theological_decisions: []
translation_notes:
  register: Igbo Izugbe nke oge a, dị mfe ma nwee ugwu. E ji 'gafesịrị' gosipụta ịgafe mpaghara ahụ, e jikwa 'bịarutere' mee ka njedebe njem ahụ doo anya.
