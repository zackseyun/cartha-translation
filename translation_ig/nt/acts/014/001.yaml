    text: A pụkwara ịtụgharị ya, “n’ụlọ nzukọ ndị Juu.” N’asụsụ Grik, okwu ahụ bụ n’ụzọ nkịtị, “n’ụlọ nzukọ nke ndị Juu.”
    reason: lexical_alternative
  revision_rationale: The revision preserves the source’s genitive expression in the main text (“ụlọ nzukọ nke ndị Juu”), supplies a distinct and natural alternative in the footnote, and clarifies the footnote’s literal-language claim. The added coordinator “ma” improves natural Igbo prose while preserving the Greek καί coordination.
