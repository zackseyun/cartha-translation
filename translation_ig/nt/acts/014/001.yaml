  text: Ἐγένετο δὲ ἐν Ἰκονίῳ κατὰ τὸ αὐτὸ εἰσελθεῖν αὐτοὺς εἰς τὴν συναγωγὴν τῶν Ἰουδαίων καὶ λαλῆσαι οὕτως ὥστε πιστεῦσαι Ἰουδαίων τε καὶ Ἑλλήνων πολὺ πλῆθος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/001.yaml
  text: In Iconium they entered together into the synagogue of the Jews and spoke in such a way that a great multitude of both Jews and Greeks believed[a].
translation:
  language: ig
  text: N’Ikoniọm, ha abụọ banyere n’ụlọ nzukọ nke ndị Juu ma kwuo okwu n’ụzọ mere ka ọtụtụ ndị Juu na ndị Grik kwere.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịtụgharị ya, “n’ụlọ nzukọ ndị Juu.” N’asụsụ Grik, okwu ahụ bụ n’ụzọ nkịtị, “n’ụlọ nzukọ nke ndị Juu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: (egosighị ya iche)
  rationale: Nkebiokwu a na-arụ ọrụ dị ka njikọ akụkọ. Igbo sitere n’okike achọghị ka e jiri okwu dịka “Ugbu a” ma ọ bụ “O wee ruo” malite amaokwu a.
- source_word: ἐν Ἰκονίῳ
  choice: N’Ikoniọm
  rationale: Ntụgharị kpọmkwem nke nkebiokwu na-egosi ebe; e dere aha obodo ahụ n’ụdị dabara n’Igbo.
- source_word: κατὰ τὸ αὐτό
  choice: ha abụọ
  rationale: N’ebe a, akpaalaokwu ahụ na-egosi na Pọl na Banabas jikọrọ aka mee ihe ahụ; “ha abụọ” na-egosipụta nke a n’Igbo nkịtị.
- source_word: εἰσελθεῖν αὐτοὺς
  choice: ha abụọ banyere
  rationale: A gbanwere infinitive nke dabere n’usoro ἐγένετο ka ọ bụrụ ngwaa zuru ezu n’Igbo.
- source_word: εἰς τὴν συναγωγὴν τῶν Ἰουδαίων
  choice: n’ụlọ nzukọ ndị Juu
  rationale: “Ụlọ nzukọ” bụ okwu doro ndị na-agụ Igbo anya maka συναγωγή, ma e chekwara genitive “ndị Juu” n’ahịrịokwu ahụ.
- source_word: λαλῆσαι
  choice: kwuo okwu
  rationale: Nke a na-anọchi anya ikwu ma ọ bụ ikwusa okwu n’enweghị ịgbakwunye ihe onye dere ekwughị.
- source_word: οὕτως ὥστε
  choice: n’ụzọ mere ka
  rationale: Nhọrọ a na-echekwa ma ụzọ ha si kwuo okwu ma nsonaazụ nke sochiri ya.
- source_word: πιστεῦσαι
  choice: kwere
  rationale: “Kwere” bụ ntụgharị Igbo nkịtị nke πιστεύω ma ọ naghị akọwapụta ihe e kwere karịa ka isi mmalite si mee.
- source_word: Ἰουδαίων τε καὶ Ἑλλήνων
  choice: ndị Juu na ndị Grik
  rationale: A chekwara ìgwè abụọ ahụ nke njikọ τε καὶ jikọrọ.
- source_word: πολὺ πλῆθος
  choice: ọtụtụ
  rationale: “Ọtụtụ” na-egosipụta nnukwu ọnụ ọgụgụ ahụ n’Igbo dị mfe ma dị ugbu a.
theological_decisions:
- issue: Ihe πιστεῦσαι pụtara n’akụkọ banyere ndị nabatara ozi
  choice: kwere
  alternative: bịara nwee okwukwe; kwere ozi ahụ
  rationale: Isi mmalite kwuru nanị na ha kwere, n’akọwaghị kpọmkwem ihe e kwere n’ahịrịokwu a. Ya mere, e chekwara okwu sara mbara ahụ ka a ghara ịgbakwunye nkọwa ozizi.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke oge a, dị ùgwù ma dị mfe nghọta. E ji “ụlọ nzukọ” mee ka συναγωγή doo onye nkịtị anya; e zere okwu njikọ mmalite na-adịghị mkpa. Akara ntụaka [a] dị n’isi ederede.
