  rationale: The revision preserves the source’s genitive expression in the main text (“ụlọ nzukọ nke ndị Juu”), supplies a distinct and natural alternative in the footnote, and clarifies the footnote’s literal-language claim. The added coordinator “ma” improves natural Igbo prose while preserving the Greek καί coordination.
