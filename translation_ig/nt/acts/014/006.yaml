- from: Mgbe ha matara ihe ahụ[a], ha gbara ọsọ gaa n’obodo ndị dị na Likaonia—Listra na Debe—nakwa n’ógbè ndị gbara ha gburugburu.
  to: Mgbe ha matara nke a[a], ha gbapụrụ gaa n’obodo ndị dị na Likaonia—Listra na Debe—na n’ógbè gbara ha gburugburu.
  rationale: The revision renders the flight sense of κατέφυγον more directly and aligns the number of «ógbè» with the singular περίχωρον, while preserving the source’s contextual ambiguity about what exactly they came to understand.
