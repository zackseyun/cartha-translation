  text: συνιδόντες κατέφυγον εἰς τὰς πόλεις τῆς Λυκαονίας Λύστραν καὶ Δέρβην καὶ τὴν περίχωρον,
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/006.yaml
  text: when they learned of it[a], they fled to the cities of Lycaonia—Lystra and Derbe—and the surrounding region,
translation:
  language: ig
  text: Mgbe ha matara nke a[a], ha gbapụrụ gaa n’obodo ndị dị na Likaonia—Listra na Debe—na n’ógbè gbara ha gburugburu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “Mgbe ha ghọtara nke a” ma ọ bụ “mgbe ha matara banyere ya.” Nkebi okwu Grik ahụ na-egosi na ha bịara ghọta ihe ize ndụ ahụ a kọwara n’amaokwu bu ụzọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνιδόντες
  choice: Mgbe ha matara ihe ahụ
  rationale: Nkebi a na-egosi na ha bịara ghọta ma ọ bụ mata ihe ize ndụ ahụ a kọwara n’amaokwu bu ụzọ. ‘Ihe ahụ’ na-eweta ihe a na-ekwu maka ya site n’ihe gbara ya gburugburu, dịka Igbo si achọ.
- source_word: κατέφυγον
  choice: ha gbara ọsọ gaa
  rationale: N’ebe a, ngwaa ahụ na-egosi ịgbapụ ngwa ngwa n’ihi ihe ize ndụ. Nkebi a bụ Igbo doro anya ma dị ndụ, n’agbanyeghị na echiche nke ịchọ ebe mgbaba dịkwa n’okpuru ya.
- source_word: εἰς
  choice: gaa n’
  rationale: Ọ na-akọwa ebe ngagharị ahụ na-aga; ‘gaa n’obodo’ bụ usoro okwu Igbo kwesịrị ekwesị.
- source_word: τὰς πόλεις τῆς Λυκαονίας
  choice: n’obodo ndị dị na Likaonia
  rationale: Nke a na-egosi obodo ndị nọ n’ógbè Likaonia n’Igbo eke, ma na-ahapụ Listra na Debe ka ha kọwaa obodo ndị ahụ.
- source_word: Λύστραν καὶ Δέρβην
  choice: Listra na Debe
  rationale: E ji ụdị aha ndị kwekọrọ n’usoro mkpọpụta na ide okwu Igbo mee ihe.
- source_word: τὴν περίχωρον
  choice: n’ógbè ndị gbara ha gburugburu
  rationale: περίχωρος na-arụ ọrụ dịka aha maka mpaghara gbara obodo ndị a gburugburu; ntụgharị a gụnyere ma ime obodo ma ebe ndị ọzọ dị nso.
- source_word: καὶ ... καὶ
  choice: —Listra na Debe—nakwa
  rationale: Akara ogologo abụọ na-egosi na Listra na Debe bụ obodo ndị a kpọtụrụ aha, ebe ‘nakwa’ na-agbakwụnye ógbè ndị gbara ha gburugburu.
theological_decisions: []
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị mfe nghọta ma nwee ugwu, mee ntụgharị ahụ. A hapụrụ mmekọrịta dị n’etiti obodo abụọ ahụ na mpaghara gbara ha gburugburu ka usoro okwu na akara ogologo mee ka ọ doo anya.
