id: ACT.14.27
reference: Acts 14:27
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: παραγενόμενοι δὲ καὶ συναγαγόντες τὴν ἐκκλησίαν ⸀ἀνήγγελλον ὅσα ἐποίησεν ὁ θεὸς μετ’ αὐτῶν καὶ ὅτι ἤνοιξεν τοῖς ἔθνεσιν θύραν πίστεως.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/027.yaml
  text: And when they arrived and gathered the church together[a], they reported all that God had done with them[b], and that he had opened a door of faith to the Gentiles.
translation:
  language: ig
  text: Mgbe ha rutere, ha kpọkọtara ọgbakọ ahụ ọnụ, wee kọọrọ ha ihe niile Chineke so ha mee[a], nakwa na o mepeere ndị mba ọzọ ọnụ ụzọ nke okwukwe.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ihe niile Chineke mere site n’aka ha.” N’okwu Grik, ihe e kwuru kpọmkwem karị bụ “ihe niile Chineke so ha mee.”
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, “o meghere mba dị iche iche ọnụ ụzọ nke okwukwe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: παραγενόμενοι
  choice: Mgbe ha rutere
  rationale: Ọ na-egosi na mbata ha buru ụzọ mee tupu ha akpọkọta ọgbakọ ahụ; usoro a bụ Igbo doro anya ma dịkwa n'okike.
- source_word: συναγαγόντες τὴν ἐκκλησίαν
  choice: ha kpọkọtara ọgbakọ ahụ ọnụ
  rationale: “Ọgbakọ” na-egosi ndị Kraịst zukọrọ ọnụ, ọ bụghị ụlọ ụka; “kpọkọtara ... ọnụ” na-ebute omume nke ịkpọkọta ha.
- source_word: ἀνήγγελλον
  choice: wee kọọrọ ha
  rationale: N'ọnọdụ a, okwu ahụ pụtara ịkọ akụkọ banyere ọrụ ozi ha; “kọọrọ” bụ okwu Igbo nkịtị ma kwesịrị ekwesị.
- source_word: ὅσα
  choice: ihe niile
  rationale: Nke a bụ ụzọ Igbo si ekwu nkebiokwu ahụ n'ụzọ dị mfe ma zuru oke.
- source_word: ἐποίησεν ὁ θεὸς μετ’ αὐτῶν
  choice: ihe niile Chineke so ha mee
  rationale: “So ha mee” na-edobe isi echiche μετά, ya bụ, na Chineke mere ihe ndị ahụ ya na ha, n'emeghị ka ọ bụrụ naanị na o ji ha mee ihe.
- source_word: ἤνοιξεν
  choice: o mepeere
  rationale: Ngwaa a na-egosi ihe Chineke mezuru, ebe “-ere” na-egosikwa ndị ihe ahụ baara uru.
- source_word: τοῖς ἔθνεσιν
  choice: ndị mba ọzọ
  rationale: N'ebe a, okwu ahụ na-ezo aka ná ndị na-abụghị ndị Juu, ọ bụghị naanị mba dị iche iche dịka ngalaba ndọrọ ndọrọ ọchịchị.
- source_word: θύραν πίστεως
  choice: ọnụ ụzọ nke okwukwe
  rationale: Nke a na-edobe ihe atụ nke ọnụ ụzọ nakwa njikọ mkpụrụokwu ahụ n'enweghị ịkọwa ya karịa ihe Grik kwuru.
- source_word: πίστεως
  choice: okwukwe
  rationale: “Okwukwe” bụ okwu Igbo a na-ejikarị akọwa πίστις n'ọnọdụ a.
theological_decisions:
- issue: Ihe μετ’ αὐτῶν pụtara mgbe a na-akọ ọrụ Chineke
  choice: Chineke so ha mee
  alternative: Chineke ji ha mee
  rationale: Nhọrọ a na-edobe Chineke dịka onye na-eme ihe, ma na-ahapụkwa mmekọrịta Pọl na Banabas n'ọrụ ahụ dịka Grik si kwuo, n'emeghị ka μετά bụrụ okwu ngwá ọrụ naanị.
- issue: Nkọwa nke ἔθνεσιν
  choice: ndị mba ọzọ
  alternative: mba dị iche iche
  rationale: N'akụkọ Ọrụ Ndịozi a, okwu ahụ na-emesi nnabata ndị na-abụghị ndị Juu ike; “ndị mba ọzọ” na-egosipụta nke ahụ n'ụzọ ndị na-agụ Igbo ga-aghọta.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “Ọgbakọ” na-ezere nghọtahie nke “ụka” dịka ụlọ ma ọ bụ otu okpukpe, ebe “ọnụ ụzọ nke okwukwe” na-edobe ihe atụ dị n'asụsụ Grik.
