  to: Mgbe ha rutere, ha kpọkọtara ọgbakọ ahụ ọnụ, wee kọọrọ ha ihe niile Chineke so ha mee[a], nakwa na o mepeere ndị mba ọzọ ọnụ ụzọ nke okwukwe.[b]
  rationale: A gbanwere naanị ndetu a ka nhọrọ “site n’aka ha” bụrụ Igbo zuru ezu ma na-egosipụta n'ụzọ doro anya nhọrọ ntụgharị ‘through them.’ E debere ederede bụ isi, nke na-edobe mgbagwoju anya kwesịrị ekwesị nke μετ’ αὐτῶν, na ebe akara ndetu abụọ ahụ dị.
