  terminology: “Ọgbakọ,” “ndị mba ọzọ,” na “okwukwe” dabara adaba n’akwụkwọ Ọrụ Ndịozi. Otú ọ dị, nhọrọ ọzọ dị na ndetu a kwesịrị iji nkebiokwu Igbo zuru ezu, nke na-ekwu n’enweghị mgbagwoju anya na Chineke rụrụ ọrụ ahụ site n’aka ha.
