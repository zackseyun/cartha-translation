  text: ἐκάλουν τε ⸀τὸν Βαρναβᾶν Δία, τὸν δὲ Παῦλον Ἑρμῆν, ἐπειδὴ αὐτὸς ἦν ὁ ἡγούμενος τοῦ λόγου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/012.yaml
  text: And they were calling Barnabas Zeus[a], and Paul Hermes[b], because he was the chief speaker.
translation:
  language: ig
  text: Ha na-akpọ Banabas Zeus, Pọlkwa Hemes,[a] n’ihi na ọ bụ ya bụ onye na-ebute ụzọ n’okwu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ụfọdụ nsụgharị ọdịnala na-eji aha Rom bụ “Jupita” na “Mekuri”; ma ihe odide Grik nwere “Zeus” na “Hemes.”
    reason: alternative_reading
  - marker: b
    text: 'N’ụzọ nkịtị: “onye na-edu n’okwu”; a pụkwara ịsụ ya “onye isi na-ekwu okwu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκάλουν
  choice: Ha nọ ... na-akpọ
  rationale: Ụdị ngwaa imperfect na-egosi omume na-aga n’ihu ma ọ bụ nke a na-eme ugboro ugboro; usoro ‘nọ ... na-akpọ’ na-egosipụta nke a n’Igbo nkịtị.
- source_word: τε
  choice: -kwa
  rationale: ‘-kwa’ ji nwayọọ jikọta okwu a na akụkọ bu ya ụzọ, n’ebughị njikọ ahụ ibu karịa ka Grik si mee.
- source_word: Δία
  choice: Zeus
  rationale: E debere aha chi Grik dị n’ihe odide mbụ kama iji aha Rom bụ Jupita dochie ya.
- source_word: Ἑρμῆν
  choice: Hemes
  rationale: ‘Hemes’ bụ ntụgharị aha Grik Hermes n’usoro mkpọpụta Igbo; a naghị eji aha Rom bụ Mekuri dochie ya.
- source_word: ἐπειδὴ
  choice: n’ihi na
  rationale: Nke a na-egosi ihe mere ìgwè mmadụ ji were Pọl dịka Hemes n’ụzọ doro anya ma bụrụkwa Igbo e ji eme ihe taa.
- source_word: αὐτὸς
  choice: ọ bụ ya bụ
  rationale: Usoro a na-egosipụta ntakịrị nkwusi ike dị na nnọchiaha Grik, ma na-ekewapụ Pọl na Banabas n’ọnọdụ a.
- source_word: ὁ ἡγούμενος τοῦ λόγου
  choice: onye na-ebute ụzọ n’ikwu okwu
  rationale: Nke a na-echekwa echiche nke onye na-edu ma ọ bụ na-ewere ọnọdụ mbụ n’ikwu okwu, n’ebughị ụzọ kpebie na ọ bụ naanị ọkwa iwu nke ‘ọnụ na-ekwuru ha.’
theological_decisions:
- issue: Otú e si dee aha chi ndị ọgọ mmụọ
  choice: Zeus na Hemes
  alternative: Jupita na Mekuri
  rationale: Akụkụ a na-akọ echiche ìgwè mmadụ, ọ naghị akwado ofufe chi ndị ahụ. Iji aha Grik na-agbaso ihe odide mbụ ma zere ịgbaso omenala nsụgharị Latin.
- issue: Ọrụ Pọl n’ikwu okwu
  choice: onye na-ebute ụzọ n’ikwu okwu
  alternative: onye isi na-ekwu okwu
  rationale: Nhọrọ a na-echekwa ma echiche idu ndú ma mmekọrịta ya na okwu e kwuru, n’enweghị itinye ọkwa pụrụ iche nke ahịrịokwu Grik ekwughị kpọmkwem.
translation_notes:
  register: E ji Igbo Izugbe dị ugbu a, nke dị mfe ma dị nsọpụrụ. Usoro ‘onye na-ebute ụzọ n’ikwu okwu’ bụ okwu ndị mmadụ ga-aghọta, ma ọ ka na-echekwa obosara echiche dị n’ahịrịokwu Grik.
