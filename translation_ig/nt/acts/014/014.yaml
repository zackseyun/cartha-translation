  text: ἀκούσαντες δὲ οἱ ἀπόστολοι Βαρναβᾶς καὶ Παῦλος, διαρρήξαντες τὰ ἱμάτια ⸀αὐτῶν ⸀ἐξεπήδησαν εἰς τὸν ὄχλον κράζοντες
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/014.yaml
  text: But when the apostles Barnabas and Paul heard, they tore their garments and rushed out into the crowd, crying out,
translation:
  language: ig
  text: Ma mgbe ndị ozi ahụ, bụ Banabas na Pọl, nụrụ, ha dọwara uwe ha[a], wụbara n’ime ìgwè mmadụ ahụ, na-eti mkpu,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ịdọwa uwe bụ omenala e ji egosi oke mwute, oke ịtụ n’anya n’ụjọ, ma ọ bụ ngagharị iwe megide nsọpụrụ nkwulu e nyere mmadụ.
    reason: cultural_note
lexical_decisions:
- source_word: ἀκούσαντες
  choice: mgbe ... nụrụ ihe a
  rationale: Aorist participle ahụ nwere ọrụ oge n'okwu a; Igbo chọrọ ihe a na-anọchi anya ihe ha nụrụ ka ahịrịokwu ahụ wee bụrụ nke eke ma doo anya.
- source_word: δὲ
  choice: Ma
  rationale: Ọ na-egosi obere ntụgharị dị iche n'etiti ihe ìgwè mmadụ ahụ chọrọ ime na mmeghachi omume ndị ozi ahụ.
- source_word: οἱ ἀπόστολοι Βαρναβᾶς καὶ Παῦλος
  choice: ndị ozi ahụ, bụ Banabas na Pọl
  rationale: Nke a na-edobe njikọ apposition nke Grik, nke kpọrọ Banabas na Pọl ndị ozi, n'ebughị ụzọ kọwaa ókè okwu ahụ gbasara.
- source_word: διαρρήξαντες τὰ ἱμάτια αὐτῶν
  choice: ha dọwara uwe ha
  rationale: Nke a bụ nsụgharị eke nke omume ịdọwa uwe, bụ ihe na-egosi oke mwute, ụjọ, ma ọ bụ ngagharị iwe n'omenala ahụ.
- source_word: ἐξεπήδησαν
  choice: wụba
  rationale: Ngwaa ahụ na-egosi ngagharị mberede na nke siri ike; “wụba” na-ebunye ike ahụ n'Igbo ma kwekọọ na ntụziaka εἰς.
- source_word: εἰς τὸν ὄχλον
  choice: n'ime ìgwè mmadụ ahụ
  rationale: εἰς na-egosi ngagharị banye n'ime ìgwè mmadụ, ọ bụghị naanị ịnọ n'etiti ha.
- source_word: κράζοντες
  choice: na-eti mkpu
  rationale: Present participle ahụ na-egosi iti mkpu dị ike nke so ngagharị ha aga.
- source_word: Βαρναβᾶς καὶ Παῦλος
  choice: Banabas na Pọl
  rationale: E degharịrị aha ndị ahụ n'ụdị a na-ahụkarị n'Igbo.
theological_decisions:
- issue: Ịkpọ Banabas na Pọl “ndị ozi”
  choice: ndị ozi ahụ, bụ Banabas na Pọl
  alternative: Banabas na Pọl, ndị ozi ahụ
  rationale: Grik kpọmkwem na-akọwa Banabas na Pọl dịka ndị ozi n'ọnọdụ a. Nsụgharị ahụ na-edobe nke a n'ebughị echiche ụka ọ bụla banyere ma okwu “ndị ozi” ọ̀ bụ naanị mmadụ iri na abụọ ahụ ka ọ gbasara.
translation_notes:
  register: Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. “Wụba n'ime” na-edobe ngagharị mberede na ntụziaka dị na Grik; akara nkọwa ụkwụ abụọ ahụ pụtara n'isiokwu ahụ kpọmkwem.
