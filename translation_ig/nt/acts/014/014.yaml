    reason: cultural_note
  - marker: b
    text: Ma ọ bụ, “wụba n’ime ìgwè mmadụ ahụ.”
    reason: lexical_alternative
  revision_rationale: The revision corrects the narrative verb to “wụbara,” removes the unnecessary explicit object of “nụrụ,” and refines both notes for idiomatic Standard Igbo and closer alignment with the source and English audit trail. The footnote b remains a valid lexical alternative, though the corrected main rendering already conveys the sudden forceful movement.
