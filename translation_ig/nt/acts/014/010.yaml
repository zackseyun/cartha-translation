- from: O ji olu dara ụda kwuo, “Bilie, kwụrụ chịm n'ụkwụ gị.”[a] O wee wụlie elu ma malite ịga ije.[b]
  to: O kwuru n'oké olu, “Bilie, guzo ọtọ n'ụkwụ gị.”[a] O wee wụlie elu ma malite ịga ije.[b]
  rationale: The revision replaces an unclear/non-imperative posture expression with the natural imperative “guzo ọtọ,” preserving the explicit sense of ὀρθός. It also makes the loud-voice phrase more idiomatic and corrects the imperfect footnote so that it retains the source’s ambiguity without introducing ‘walking about’ or an unwarranted additive nuance.
