  text: εἶπεν ⸀μεγάλῃ φωνῇ· Ἀνάστηθι ἐπὶ τοὺς πόδας σου ⸀ὀρθός· καὶ ⸀ἥλατο καὶ περιεπάτει.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/010.yaml
  text: He said in a loud voice[b][a], “Stand upright on your feet.” And he leaped up and began walking.
translation:
  language: ig
  text: O kwuru n'oké olu, “Bilie, guzo ọtọ n'ụkwụ gị.”[a] O wee wụlie elu ma malite ịga ije.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Bilie, guzozie ọtọ n'ụkwụ gị.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “O wee wụlie elu ma na-aga ije.” Ngwaa ikpeazụ dị n'ụdị imperfect; ọ pụrụ imesi omume na-aga n'ihu ike ma ọ bụ gosi mmalite ịga ije.
    reason: lexical_alternative
lexical_decisions:
- source_word: μεγάλῃ φωνῇ
  choice: ji olu dara ụda
  rationale: Nke a bụ ụzọ Igbo nkịtị si akọwa ikwu okwu n'olu ike, ma na-echekwa echiche nke okwu a kwuru n'ihu ọha na n'ụzọ siri ike.
- source_word: Ἀνάστηθι
  choice: Bilie
  rationale: Iwu a na-agwa nwoke ahụ ka o si n'ọnọdụ ya bilie; okwu ndị na-esochi ya kọwakwuru na ọ ga-eguzo n'ụkwụ ya.
- source_word: ἐπὶ τοὺς πόδας σου
  choice: n'ụkwụ gị
  rationale: Nke a bụ nsụgharị Igbo doro anya na nke ebumpụta ụwa maka iguzo n'elu ụkwụ mmadụ.
- source_word: ὀρθός
  choice: kwụrụ chịm
  rationale: Ọ na-egosi iguzo ọtọ nke ọma, ọ bụghị nanị ibili; okwu a na-adaba n'okwu ọnụ Igbo nke oge a.
- source_word: ἥλατο
  choice: wụlie elu
  rationale: Ọ na-echekwa mmegharị mberede na nke siri ike nke ngwaa Greek ahụ, nke na-egosi na nwoke ahụ wụlitere ozugbo.
- source_word: περιεπάτει
  choice: malite ịga ije
  rationale: Imperfect ahụ nwere ike igosi omume na-aga n'ihu ma ọ bụ mmalite omume ahụ; n'ọnọdụ a, 'malite ịga ije' na-egosi mmalite nke ije ahụ n'ụzọ doro anya.
theological_decisions:
- issue: Asụsụ ọrụ ebube na iwu banyere iguzo
  choice: A sụgharịrị iwu ahụ na nzaghachi ya dịka ọgwụgwọ anụ ahụ mere ozugbo, n'etinyeghị nkọwa ọzọ.
  alternative: Ịgbakwunye nkọwa banyere isi mmalite ma ọ bụ ihe ọgwụgwọ ahụ pụtara n'ụzọ okwukwe.
  rationale: Greek na-akọ iwu kpọmkwem na nzaghachi a hụrụ anya ozugbo. Nsụgharị ahụ kwesịrị ikwu naanị ihe ederede ahụ kwuru.
translation_notes:
  register: Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E ji 'kwụrụ chịm' mee ka ọnọdụ iguzo ọtọ pụta ìhè; ndetu ala peeji na-echekwa ụzọ ọzọ e nwere isi ghọta imperfect ikpeazụ.
