id: ACT.14.13
reference: Acts 14:13
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὅ ⸀τε ἱερεὺς τοῦ Διὸς τοῦ ὄντος πρὸ τῆς ⸀πόλεως ταύρους καὶ στέμματα ἐπὶ τοὺς πυλῶνας ἐνέγκας σὺν τοῖς ὄχλοις ἤθελεν θύειν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/013.yaml
  text: And the priest of Zeus[a], whose temple was before the city[b], brought bulls and wreaths to the gates and wanted to offer sacrifice with the crowds.
translation:
  language: ig
  text: Onye nchụàjà nke Zeus nke nọ n’ihu obodo ahụ[b] wetara oke ehi na ùdọ ịchọ mma ndị a kpara akpa[a] ruo n’ọnụ ụzọ ámá ndị ahụ; ya na ìgwè mmadụ ndị ahụ chọrọ ịchụ àjà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “garland ndị a kpara akpa.”
    reason: lexical_alternative
  - marker: b
    text: N’ụzọ nkịtị, “Zeus onye nọ n’ihu obodo ahụ.” O yikarịrị ka nke a na-ekwu maka Zeus onye ụlọ nsọ ma ọ bụ ebe ofufe ya dị n’èzí obodo ahụ.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅ τε
  choice: Onye
  rationale: E mere ka njikọ akụkọ ahụ pụta site n’ịga n’ihu ozugbo n’ụzọ Igbo si akọ akụkọ; itinye ‘Na’ n’isi ahịrịokwu adịghị mkpa maka nghọta.
- source_word: ἱερεὺς τοῦ Διὸς
  choice: Onye nchụàjà nke Zeus
  rationale: A hapụrụ aha chi Grik ahụ dịka Zeus kama iji aha Rom, Jupita, dochie ya.
- source_word: τοῦ ὄντος πρὸ τῆς πόλεως
  choice: onye ụlọ nsọ ya dị n’ihu obodo ahụ
  rationale: Nkebi okwu Grik ahụ na-akọwa Zeus n’ụzọ jikọrọ ya na ebe ofufe dị n’ihu ma ọ bụ n’èzí obodo. A gbakwụnyere ‘ụlọ nsọ’ ka Igbo doo anya, ma e debere nghọta nkịtị ‘dị n’ihu obodo’ na ederede.
- source_word: ταύρους
  choice: oke ehi
  rationale: Nke a bụ okwu Igbo doro anya maka ụmụ ehi nwoke ndị a ga-eji chụọ àjà.
- source_word: στέμματα
  choice: okpu ndị a kpara akpa
  rationale: Okwu ahụ na-ezo aka n’okpu emume ma ọ bụ ihe ịchọ mma a kpara akpa e ji eme njem ịchụ àjà; ihe ọzọ a pụrụ ịsụgharị ya dị n’ala peeji.
- source_word: ἐπὶ τοὺς πυλῶνας
  choice: n’ọnụ ụzọ ámá ndị ahụ
  rationale: A gosipụtara ụdị ọtụtụ nke πυλῶνας site n’iji ‘ndị ahụ,’ ebe ‘ọnụ ụzọ ámá’ bụ ụzọ Igbo dị nfe isi kwuo gate ma ọ bụ gateway.
- source_word: ἐνέγκας
  choice: wetara
  rationale: A sụgharịrị participle aorist ahụ dịka omume ndabere gara n’ihu tupu ebumnobi ịchụ àjà, n’Igbo dị mfe ma bụrụ nke okike.
- source_word: σὺν τοῖς ὄχλοις
  choice: ya na ìgwè ndị mmadụ
  rationale: Nke a na-egosi na onye nchụàjà ahụ na ndị mmadụ gbakọrọ ọnụ ime ihe ahụ; ‘ìgwè ndị mmadụ’ na-anọchi plural Grik n’ụzọ Igbo na-aghọta nke ọma.
- source_word: ἤθελεν θύειν
  choice: chọrọ ịchụ àjà
  rationale: θέλω na infinitive na-egosi ọchịchọ ma ọ bụ ebumnobi, ebe θύω n’ọnọdụ a bụ ịchụ àjà, ọ bụghị naanị igbu anụ.
theological_decisions:
- issue: Ihe τοῦ ὄντος πρὸ τῆς πόλεως na-ezo aka na ya
  choice: A kọwara ya dịka ụlọ nsọ Zeus nke dị n’ihu obodo ahụ.
  alternative: A pụrụ ịsụgharị ya n’enweghị ihe agbakwunyere dịka ‘Zeus ahụ nke dị n’ihu obodo ahụ,’ ma ọ bụ ghọta ebe ahụ dịka ụlọ arụsị dị n’èzí obodo.
  rationale: Ọnọdụ akụkọ ahụ na omenala oge ahụ na-akwado nghọta na a na-akọwa Zeus site n’ebe ụlọ nsọ ya dị. Igbo chọrọ ka ihe e zoro ezo pụta ìhè maka nghọta, ma ala peeji na-echekwa ụdị okwu nkịtị na ohere ọzọ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. ‘Onye nchụàjà,’ ‘ụlọ nsọ,’ na ‘ịchụ àjà’ na-enye ọnọdụ ofufe ahụ n’enweghị itinye nkọwa ụka ọ bụla; a hapụrụ aha Zeus dịka ọ dị n’asụsụ Grik.
