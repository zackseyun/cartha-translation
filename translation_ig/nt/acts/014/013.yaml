  to: Onye nchụàjà nke Zeus nke nọ n’ihu obodo ahụ[b] wetara oke ehi na ùdọ ịchọ mma ndị a kpara akpa[a] ruo n’ọnụ ụzọ ámá ndị ahụ; ya na ìgwè mmadụ ndị ahụ chọrọ ịchụ àjà.
