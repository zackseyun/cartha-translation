    text: Ma ọ bụ, “mgbe ha họpụtara ndị okenye nye ha n’ọgbakọ nke ọ bụla site n’ịwelite aka.” Ngwaa Greek ahụ nwere ike n’ọnọdụ ụfọdụ ịpụta ịhọrọ site n’ịtụ vootu ma ọ bụ n’ịwelite aka, ma n’ebe a ọ pụkwara ịpụta nanị ịhọpụta.
    reason: alternative_reading
  - marker: b
    text: “Ha” nwere ike izo aka n’ebe ndị kwere ekwe niile nọ, ma ọ bụ kpọmkwem n’ebe ndị okenye e họpụtara ọhụrụ nọ.
    reason: alternative_reading
  revision_rationale: The revision removes the unsupported additive nuance in "họpụtakwara," makes the coordinated preparatory actions idiomatic in Standard Igbo, relocates footnote b to its actual referent, and uses "kwereworị" to represent the pluperfect's prior-belief sense. It retains the source's ambiguity about whom Paul and Barnabas entrusted and does not imply a particular church-selection procedure.
