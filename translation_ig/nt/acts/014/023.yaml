id: ACT.14.23
reference: Acts 14:23
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: χειροτονήσαντες δὲ αὐτοῖς ⸂κατ’ ἐκκλησίαν πρεσβυτέρους⸃ προσευξάμενοι μετὰ νηστειῶν παρέθεντο αὐτοὺς τῷ κυρίῳ εἰς ὃν πεπιστεύκεισαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/023.yaml
  text: And after appointing elders for them in every church[a], and praying with fasting, they entrusted them to the Lord[c][b], in whom they had believed.
translation:
  language: ig
  text: Mgbe ha họpụtara ndị okenye nye ha n’ọgbakọ ọ bụla[a], ma kpee ekpere ma buo ọnụ, ha nyefere ha[b] n’aka Onyenwe anyị, onye ha kwereworị na ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “mgbe ha họpụtara ndị okenye nye ha n’ọgbakọ nke ọ bụla site n’ịwelite aka.” Ngwaa Greek ahụ nwere ike n’ọnọdụ ụfọdụ ịpụta ịhọrọ site n’ịtụ vootu ma ọ bụ n’ịwelite aka, ma n’ebe a ọ pụkwara ịpụta nanị ịhọpụta.
    reason: alternative_reading
  - marker: b
    text: “Ha” nwere ike izo aka n’ebe ndị kwere ekwe niile nọ, ma ọ bụ kpọmkwem n’ebe ndị okenye e họpụtara ọhụrụ nọ.
    reason: alternative_reading
lexical_decisions:
- source_word: χειροτονήσαντες
  choice: Mgbe ha họpụtakwara
  rationale: Ngwaa a na-egosi ịhọrọ ma ọ bụ ịhọpụta ndị ga-eje ozi. “Họpụta” na-egosi isi ihe ahụ n’enweghị ịmanye usoro ọchịchị ụka pụrụ iche; ihe gbasara ịhọrọ site n’ịwelite aka dị n’ihe odide ala peeji.
- source_word: κατ’ ἐκκλησίαν
  choice: n’ọgbakọ ọ bụla
  rationale: κατά ya na aha dị n’otu na-arụ ọrụ nkesa, ya bụ, otu ọgbakọ n’otu ọgbakọ.
- source_word: πρεσβυτέρους
  choice: ndị okenye
  rationale: N’ebe a okwu ahụ na-ezo aka n’òtù ndị ndu a ma ama n’ọgbakọ, ọ bụghị nanị ndị nwoke merela agadi.
- source_word: προσευξάμενοι μετὰ νηστειῶν
  choice: kpee ekpere ma buo ọnụ
  rationale: Nsụgharị a na-egosi na ekpere na ibu ọnụ so n’omume ndị mere tupu ngwaa bụ isi, ma na-ada nke ọma n’Igbo ugbu a.
- source_word: παρέθεντο
  choice: ha nyefere ha n’aka
  rationale: Nkebiokwu a na-egosi inyefe mmadụ nlekọta onye ọzọ; “nyefere ha n’aka” bụ Igbo doro anya ma dị ndụ.
- source_word: τῷ κυρίῳ
  choice: Onyenwe anyị
  rationale: Nke a bụ okwu Igbo a na-ejikarị asụ κύριος dị ka aha nsọ n’ebe a, onye e nyefere ha nlekọta ya.
- source_word: εἰς ὃν πεπιστεύκεισαν
  choice: onye ha kweere na ya
  rationale: Nke a na-edobe ntụkwasị obi ha tinyere n’Onyenwe anyị; usoro oge nke Greek na-egosi okwukwe malitere tupu mgbe ahụ, ebe Igbo na-ahapụ ọnọdụ okwu ka o doo nke ahụ anya.
- source_word: αὐτοῖς ... αὐτοὺς
  choice: nye ha ... ha
  rationale: E debere nnọchiaha ndị ahụ ka a ghara imechi ihe Greek hapụrụ ntakịrị ghe oghe. “Ha” nke abụọ nwere ike ịgụnye ndị kwere ekwe niile ma ọ bụ zoo aka kpọmkwem n’ebe ndị okenye ahụ nọ.
theological_decisions:
- issue: Ihe χειροτονήσαντες pụtara banyere usoro ịhọpụta ndị ndu ụka
  choice: họpụta ndị okenye
  alternative: họrọ ndị okenye site n’ịtụ vootu ma ọ bụ n’ịwelite aka
  rationale: Ọ bụ ezie na okwu Greek a nwere ike n’ọnọdụ ụfọdụ ịgụnye ịhọrọ site n’ịwelite aka, amaokwu a akọwaghị usoro e ji mee ya. “Họpụta” na-ezere itinye usoro otu ụka pụrụ iche n’ihe odide ahụ.
- issue: Onye αὐτοὺς na παρέθεντο αὐτοὺς τῷ κυρίῳ na-ezo aka na ya
  choice: hapụ ya dịka nnọchiaha “ha,” nke nwere ike izo aka n’ebe ndị kwere ekwe nọ
  alternative: ndị okenye e họpụtara ọhụrụ
  rationale: Akụkọ gbara ya gburugburu na-akwado ndị na-eso ụzọ ma ọ bụ ọgbakọ niile, ma ịdị nso nke okwu “ndị okenye” na-eme ka nghọta ọzọ kwe omume. Nsọgharị isi na-edobe nnọchiaha ahụ, ihe odide ala peeji na-akọwa mgbagwoju anya ahụ.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, dị nsọpụrụ ma dị mfe nghọta. “Ọgbakọ” na-egosipụta ọgbakọ ndị kwere ekwe n’ebe dị iche iche; “ndị okenye” bụ okwu ndu ụka na-adịghị akwalite usoro otu denomination. E tinyere akara ihe odide ala peeji niile n’ederede isi.
