  to: na-eme ka mkpụrụ obi ndị na-eso ụzọ sie ike[a], na-agba ha ume ka ha nọgide n’okwukwe ahụ[b], na-agwakwa ha na ọ dị mkpa ka anyị banye n’alaeze Chineke site n’ọtụtụ mkpagbu[c].
