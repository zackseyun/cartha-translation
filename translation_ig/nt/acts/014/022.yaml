review_pass:
  verdict: revise
  source_fidelity: The three present participles are represented well, and the rendering of τὰς ψυχὰς, τῇ πίστει, διὰ πολλῶν θλίψεων, and βασιλείαν τοῦ θεοῦ is substantively faithful. However, “ọ bụ site n’ọtụtụ mkpagbu ka anyị ga-esi banye” primarily presents the route or means of entry and uses a future-oriented construction; it does not state the impersonal necessity of δεῖ as explicitly as the Greek does. The revision renders that necessity directly without explaining its theological basis.
  naturalness: The draft is clear, dignified Standard Igbo. The revised final clause is more direct and idiomatic while retaining the intended sense of passing through many afflictions in entering God’s kingdom.
  terminology: “Ndị na-eso ụzọ,” “mkpụrụ obi,” “okwukwe ahụ,” “mkpagbu,” and “alaeze Chineke” are suitable established terms. The article in “okwukwe ahụ” is defensible, and footnote b appropriately preserves the broader alternative. No doctrinal expansion is introduced.
  issues:
  - severity: medium
    issue: The force of δεῖ is not explicit in “ọ bụ site n’ọtụtụ mkpagbu ka anyị ga-esi banye.”
    rationale: δεῖ expresses necessity (“we must” / “it is necessary”). The existing wording can be understood chiefly as “it is through many afflictions that we will enter” or as the manner of entry. “Ọ dị mkpa ka anyị…” makes the necessary force explicit and remains noncommittal about why such necessity exists.
  revised_text: na-eme ka mkpụrụ obi ndị na-eso ụzọ sie ike[a], na-agba ha ume ka ha nọgide n’okwukwe ahụ[b], na-agwakwa ha na ọ dị mkpa ka anyị banye n’alaeze Chineke site n’ọtụtụ mkpagbu[c].
