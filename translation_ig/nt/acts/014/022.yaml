id: ACT.14.22
reference: Acts 14:22
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐπιστηρίζοντες τὰς ψυχὰς τῶν μαθητῶν, παρακαλοῦντες ἐμμένειν τῇ πίστει καὶ ὅτι διὰ πολλῶν θλίψεων δεῖ ἡμᾶς εἰσελθεῖν εἰς τὴν βασιλείαν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/022.yaml
  text: strengthening the souls of the disciples[a], encouraging them to remain in the faith[c][b], and saying that through many afflictions we must enter the kingdom of God.
translation:
  language: ig
  text: na-eme ka mkpụrụ obi ndị na-eso ụzọ sie ike[a], na-agba ha ume ka ha nọgide n’okwukwe ahụ[b], na-agwakwa ha na ọ dị mkpa ka anyị banye n’alaeze Chineke site n’ọtụtụ mkpagbu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “ime ndị na-eso ụzọ ahụ n’onwe ha ka ha sie ike,” ma ọ bụ “ime ka obi ha sie ike.”
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsị, “n’okwukwe.” Mkpụrụokwu nrụtụ aka dị n’asụsụ Grik na-akwado “okwukwe ahụ,” ma enwere ike ịghọta ya n’ụzọ sara mbara karị.
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “ọtụtụ ahụhụ,” ma ọ bụ “ọtụtụ nsogbu siri ike.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιστηρίζοντες
  choice: na-eme ka ... sie ike
  rationale: Nke a na-egosi ọrụ na-aga n’ihu nke ime ka ndị na-eso ụzọ guzosie ike; ọ bụkwa okwu Igbo doro anya ma dị ndụ.
- source_word: τὰς ψυχὰς
  choice: mkpụrụ obi
  rationale: Ọ na-echekwa ịdị arọ nke ψυχή dị ka ime mmadụ ma ọ bụ onye ahụ n’onwe ya, n’agbanyeghị na a gaghị aghọta ya dị ka ịkewa mmadụ ụzọ abụọ n’ụzọ nkà ihe ọmụma.
- source_word: τῶν μαθητῶν
  choice: ndị na-eso ụzọ
  rationale: Nke a bụ okwu Igbo a na-anabata nke ọma maka μαθηταί, ndị na-amụta ihe ma na-eso onye nkụzi ha.
- source_word: παρακαλοῦντες
  choice: na-agba ha ume
  rationale: Ọ na-ejikọta nkwado na ịrịọsi ha ike, bụ́ ihe ọnọdụ a chọrọ.
- source_word: ἐμμένειν
  choice: ka ha nọgide
  rationale: Ọ na-enye echiche nke ịnọgide na ihe ma ghara ịhapụ ya.
- source_word: τῇ πίστει
  choice: n’okwukwe ahụ
  rationale: Mkpụrụokwu nrụtụ aka Grik ahụ na-akwado okwukwe a maara, ya bụ okwukwe ndị Kraịst, ma ihe odide ahụ ka nwere ike ịpụta okwukwe n’ozuzu ya.
- source_word: διὰ πολλῶν θλίψεων
  choice: site n’ọtụtụ mkpagbu
  rationale: Mkpagbu na-egosi nhụjuanya, nrụgide, na nsogbu siri ike dị na θλίψεις, ma ọ ka bụ okwu nkịtị ndị Igbo na-aghọta.
- source_word: δεῖ ἡμᾶς
  choice: ka anyị ga-esi
  rationale: N’usoro Igbo a, njikọ ‘ọ bụ ... ka anyị ga-esi’ na-egosipụta mkpa ma ọ bụ ihe a na-apụghị izere ezere nke δεῖ n’enweghị ịgbakwunye ihe kpatara ya n’ụzọ ozizi.
- source_word: εἰσελθεῖν εἰς
  choice: banye n’ime
  rationale: ‘Banye n’ime’ bụ ụzọ Igbo ebumpụta ụwa isi kwupụta ngagharị ịbanye n’ebe ma ọ bụ ọnọdụ.
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: alaeze Chineke
  rationale: Ọ bụ okwu Igbo a maara nke ọma nke na-echekwa ma echiche ọchịchị Chineke ma echiche alaeze ya.
theological_decisions:
- issue: Ihe τῇ πίστει pụtara
  choice: okwukwe ahụ
  alternative: okwukwe
  rationale: Mkpụrụokwu nrụtụ aka τῇ na-akwado ihe a kapịrị ọnụ, ma ntụaka ala peeji na-echekwa ohere nke ịghọta ya dị ka okwukwe n’ozuzu ya.
- issue: Ike nke δεῖ
  choice: ọ bụ site n’ọtụtụ mkpagbu ka anyị ga-esi banye
  alternative: ọ dị mkpa ka anyị site n’ọtụtụ mkpagbu banye
  rationale: Nhazi ahịrịokwu a na-echekwa echiche nke mkpa dị n’ihe odide ahụ, ma ọ naghị akọwa ma mkpagbu ahụ bụ ihe mmadụ ji enweta alaeze ahụ ma ọ bụ gbasaa ozizi ọzọ.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta, dee ya. Usoro ‘na-eme..., na-agba..., na-agwakwa...’ na-echekwa participle atọ na-aga n’ihu n’ihe gbara amaokwu a gburugburu. E tinyere ‘ha’ na nkebi nke abụọ na nke atọ maka nghọta doro anya n’Igbo, ebe ndị na-eso ụzọ bụ ndị a na-agwa okwu.
