  text: κἀκεῖθεν ἀπέπλευσαν εἰς Ἀντιόχειαν, ὅθεν ἦσαν παραδεδομένοι τῇ χάριτι τοῦ θεοῦ εἰς τὸ ἔργον ὃ ἐπλήρωσαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/026.yaml
  text: And from there they sailed to Antioch[b][a], where they had been committed to the grace of God for the work that they had fulfilled.
translation:
  language: ig
  text: Ha sikwa n’ebe ahụ jiri ụgbọ mmiri gaa Antiọk, site n’ebe e nyefeworị ha n’aka amara Chineke maka ọrụ ahụ ha rụzuru.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “ọrụ ahụ ha mezuru.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀκεῖθεν
  choice: Ha sikwa n’ebe ahụ
  rationale: “kwa” na-ejigide njikọ akụkọ ahụ, ebe “n’ebe ahụ” na-egosi ebe ha si pụọ.
- source_word: ἀπέπλευσαν
  choice: jiri ụgbọ mmiri gaa
  rationale: Nke a na-egosi n’ụzọ Igbo dị mfe ma doo anya na ha mere njem ahụ n’oké osimiri.
- source_word: εἰς Ἀντιόχειαν
  choice: gaa Antiọk
  rationale: “gaa” dabara n’okwu ngagharị, ebe “Antiọk” bụ nsụgharị mkpọpụta aha obodo ahụ.
- source_word: ὅθεν
  choice: bụ́ ebe
  rationale: Nke a bụ okwu Igbo dị nwayọọ nke na-ejikọta Antiọk na ebe ihe ahụ e kwuru banyere ha mere; echiche nke “ebe ha si” pụta ìhè site n’usoro akụkọ ahụ.
- source_word: ἦσαν παραδεδομένοι
  choice: e nyefere ha
  rationale: Ọ na-egosi ihe e mewororị tupu njem a ma na-echekwa echiche nke inyefe ha nlekọta ma ọ bụ nchedo amara Chineke, n’enweghị itinye nkọwa ụka pụrụ iche.
- source_word: τῇ χάριτι τοῦ θεοῦ
  choice: n’amara Chineke
  rationale: “nyefere ... n’amara Chineke” bụ usoro Igbo sitere n’okwu ahụ nke na-echekwa ịdị arọ nke χάρις na njikọ genitiv nke Chineke.
- source_word: εἰς τὸ ἔργον
  choice: maka ọrụ ahụ
  rationale: “ọrụ” bụ ntụgharị sara mbara ma kwụ ọtọ nke ἔργον; “ahụ” na-egosi ọrụ ahụ akọwarala n’akụkọ.
- source_word: ὃ ἐπλήρωσαν
  choice: ha rụzuru
  rationale: “rụzuru” na-ekwupụta na ha wetara ọrụ ahụ n’isi njedebe, ma ọ bụ mezue ya, n’Igbo eke.
theological_decisions:
- issue: Ụdị inyefe Pọl na Banabas n’amara Chineke
  choice: e nyefere ha n’amara Chineke
  alternative: e tinyere ha n’aka amara Chineke
  rationale: “E nyefere ha” na-echekwa ihe παραδίδωμι pụtara ma na-ahapụ “amara Chineke” dị ka ihe e nyefere ha n’aka ya, n’etinyeghị echiche okpukpe otu nzukọ pụrụ iche.
- issue: Ihe πληρόω pụtara n’ihe gbasara ọrụ ahụ
  choice: ọrụ ahụ ha rụzuru
  alternative: ọrụ ahụ ha mezuru
  rationale: Ha abụọ na-egosi imecha ọrụ ahụ; “rụzuru” na-echekwa ma echiche mmezu ma echiche iweta ihe e nyere ha n’isi njedebe.
translation_notes:
  register: Standard Igbo; asụsụ dị ugbu a, dị ùgwù, ma dị mfe nghọta. E ji “Antiọk” dee aha obodo ahụ n’ụdị mkpọpụta Igbo, e zerekwa okwu ụka pụrụ iche.
