revisions:
- from: Mgbe ìgwè mmadụ ahụ hụrụ ihe Pọl mere, ha weliri olu ha elu, na-ekwu n'asụsụ ndị Likaonia, sị, “Chi dị iche iche, ebe ha yiri mmadụ[a], arịdatala bịakwute anyị!”
  to: Mgbe ìgwè mmadụ ndị ahụ hụrụ ihe Pọl mere, ha weliri olu ha elu, na-ekwu n’asụsụ Likaonia, sị, “Chi dị iche iche, ebe e mere ka ha yie mmadụ[a], arịdatala n'ebe anyị nọ!”
  rationale: The revision corrects the designation of the Lycaonian language, more clearly reflects the passive form of “having been made like humans,” and smooths the final movement expression without changing the crowd’s excited, mistaken interpretation.
