  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οἵ ⸀τε ὄχλοι ἰδόντες ὃ ⸀ἐποίησεν Παῦλος ἐπῆραν τὴν φωνὴν αὐτῶν Λυκαονιστὶ λέγοντες· Οἱ θεοὶ ὁμοιωθέντες ἀνθρώποις κατέβησαν πρὸς ἡμᾶς
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/011.yaml
  text: And when the crowds saw what Paul had done[a], they raised their voices, saying in the Lycaonian language, “The gods, having become like men[b], have come down to us!”
translation:
  language: ig
  text: Mgbe ìgwè mmadụ ndị ahụ hụrụ ihe Pọl mere, ha weliri olu ha elu, na-ekwu n’asụsụ Likaonia, sị, “Chi dị iche iche, ebe e mere ka ha yie mmadụ[a], arịdatala n'ebe anyị nọ!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ebe ha yiri mmadụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἵ τε ὄχλοι ἰδόντες
  choice: Mgbe ìgwè mmadụ ahụ hụrụ
  rationale: A tụgharịrị participle a dị ka nkebi oge, nke na-aga nke ọma n'Igbo ma na-egosi na ihe ha hụrụ kpaliri mkpu ha.
- source_word: ὃ ἐποίησεν Παῦλος
  choice: ihe Pọl mere
  rationale: Nke a na-ezo aka n'ọrụ ebube Pọl ka mere; oge gara aga dị mfe bụ nke kachasị eke n'Igbo.
- source_word: ἐπῆραν τὴν φωνὴν αὐτῶν
  choice: ha weliri olu ha elu
  rationale: Nke a na-echekwa ihe atụ dị n'akpaokwu Grik ma na-egosi na ha kwuru okwu n'olu dara ụda.
- source_word: Λυκαονιστί
  choice: n'asụsụ ndị Likaonia
  rationale: Adverb Grik a pụtara ikwu okwu n'asụsụ Likaonia; ịkpọpụta ‘asụsụ’ na-eme ka ọ doo onye na-agụ taa anya.
- source_word: Οἱ θεοὶ
  choice: Chi dị iche iche
  rationale: Plural ahụ na-ezo aka na ọtụtụ chi ndị ọgọ mmụọ, ọ bụghị otu Chineke eziokwu.
- source_word: ὁμοιωθέντες ἀνθρώποις
  choice: ebe ha yiri mmadụ
  rationale: Nke a na-echekwa echiche nke ịdị ka mmadụ n'ebughị ụzọ kpebie ma ọ bụ tinye ozizi banyere nnwogha anụahụ; ‘mmadụ’ na-anọchi ụmụ mmadụ n'ozuzu.
- source_word: κατέβησαν πρὸς ἡμᾶς
  choice: arịdatala bịakwute anyị
  rationale: ‘Arịdatala’ na-egosi mmegharị si n'elu rịdata, ebe ‘bịakwute anyị’ na-ebute πρὸς ἡμᾶς n'Igbo eke ma na-echekwa mkpali dị n'okwu ìgwè mmadụ ahụ.
theological_decisions:
- issue: Ikwupụta nghọta ndị ọgọ mmụọ ahụ n'etinyeghị ozizi Ndị Kraịst banyere ịghọ mmadụ
  choice: Chi dị iche iche, ebe ha yiri mmadụ, arịdatala bịakwute anyị
  alternative: Chi dị iche iche aghọọla ka mmadụ ma rịdata bịakwute anyị
  rationale: Ihe odide ahụ na-akọ nghọta na-ezighị ezi nke ìgwè mmadụ ahụ. ‘Yiri mmadụ’ na-egosipụta ὁμοιωθέντες dị ka myirịta ma ghara ime ka okwu ahụ bụrụ nkwupụta ozizi banyere nnwogha anụahụ.
translation_notes:
  register: Igbo Ọkọlọtọ nke oge a, dị ugwu ma dị mfe nghọta. A họọrọ ‘ìgwè mmadụ’ maka plural ὄχλοι, ‘Pọl’ dịka nsụpe aha a na-ahụkarị, na ‘ndị Likaonia’ iji mee ka aha asụsụ ahụ doo anya. Akara ụda dị na ‘ìgwè’ na-enyere aka izere mgbagwoju anya.
