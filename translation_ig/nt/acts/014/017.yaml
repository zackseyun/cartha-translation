- from: Ka o sina dị, ọ hapụghị onwe ya n’enweghị ihe na-agbara ya akaebe[a]; ọ na-eme ihe ọma site n’inye unu mmiri ozuzo si n’eluigwe na oge ndị na-amị mkpụrụ[b], na-ejikwa ihe oriri na ọṅụ mejupụta obi unu[c].
  to: 'Ka o sina dị, ọ hapụghị onwe ya n’enweghị akaebe[a], site n’ime ihe ọma: o nyere unu mmiri ozuzo si n’eluigwe na oge mkpụrụ bara ụba[b], na-ejupụtakwa obi unu n’ihe oriri na ọṅụ[c].'
  rationale: The revision keeps the source’s concessive statement and its three participial descriptions of God’s beneficence, while using more idiomatic Standard Igbo. It avoids implying that an unspecified external object or person is necessarily the witness, retains “hearts,” and preserves the textual-variant note and its anchor.
