source:
  edition: SBLGNT
  text: ⸀καίτοι οὐκ ἀμάρτυρον ⸀αὑτὸν ἀφῆκεν ⸀ἀγαθουργῶν, οὐρανόθεν ὑμῖν ὑετοὺς διδοὺς καὶ καιροὺς καρποφόρους, ἐμπιπλῶν τροφῆς καὶ εὐφροσύνης τὰς καρδίας ⸀ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/017.yaml
  text: Yet he did not leave himself without witness[a], doing good by giving you rains from heaven and fruitful seasons[c][b], filling your hearts with food and gladness.
translation:
  language: ig
  text: 'Ka o sina dị, ọ hapụghị onwe ya n’enweghị akaebe[a], site n’ime ihe ọma: o nyere unu mmiri ozuzo si n’eluigwe na oge mkpụrụ bara ụba[b], na-ejupụtakwa obi unu n’ihe oriri na ọṅụ[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “n’enweghị ihe akaebe.” Grik na-emesi ike na Chineke hapụghị onwe ya n’enweghị akaebe banyere onye ọ bụ.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsị, “oge ndị na-eweta mkpụrụ.”
    reason: lexical_alternative
  - marker: c
    text: Ụfọdụ ihe odide Grik nwere “obi anyị,” ma SBLGNT nwere “obi unu.”
    reason: textual_variant
lexical_decisions:
- source_word: καίτοι
  choice: Ka o sina dị
  rationale: Nkebiokwu a na-egosi na ihe na-esote dị iche n’ụzọ ụfọdụ n’ihe e kwuru tupu ya, ma ọ ka jikọtara ha n’ụzọ dị mma n’Igbo.
- source_word: ἀμάρτυρον
  choice: n’enweghị ihe na-agbara ya akaebe
  rationale: Nke a na-echekwa echiche nke akaebe ma ọ bụ ịgba ama, ma na-ada ka Igbo e ji eme ihe taa karịa ntụgharị mkpụrụokwu n’otu n’otu.
- source_word: αὑτὸν
  choice: onwe ya
  rationale: Ọ na-echekwa ike nnọchiaha nlaghachi nke Grik, ya bụ na Chineke nyere akaebe banyere onwe ya.
- source_word: ἀγαθουργῶν
  choice: ọ na-eme ihe ọma
  rationale: Ọ na-egosi ọrụ ọma Chineke na-arụ, bụ́ ụzọ o si hapụghị onwe ya n’enweghị akaebe.
- source_word: οὐρανόθεν ὑμῖν ὑετοὺς διδοὺς
  choice: site n’inye unu mmiri ozuzo si n’eluigwe
  rationale: Ọ na-egosi ma isi mmiri ozuzo ahụ si bịa ma na inye ya bụ otu n’ime ụzọ Chineke si eme ihe ọma.
- source_word: καιροὺς καρποφόρους
  choice: oge ndị na-amị mkpụrụ
  rationale: 'Nke a na-echekwa ihe atụ ọrụ ugbo dị n’original ahụ: oge ndị na-eweta mkpụrụ.'
- source_word: ἐμπιπλῶν τροφῆς καὶ εὐφροσύνης τὰς καρδίας ὑμῶν
  choice: na-ejikwa ihe oriri na ọṅụ mejupụta obi unu
  rationale: Ọ na-echekwa njikọ Grik dị n’etiti obi, ihe oriri, na ọṅụ kama ịgbanwe ‘obi’ ka ọ bụrụ ‘afọ’ ma ọ bụ ‘ahụ.’
theological_decisions:
- issue: Ụdị akaebe Chineke nyere banyere onwe ya
  choice: E gosiri ihe ọma Chineke na-eme n’okike na nlekọta ya—mmiri ozuzo, oge mkpụrụ, ihe oriri na ọṅụ—dị ka ihe na-agbara ya akaebe.
  alternative: Iwere ihe ndị a nanị dị ka usoro okike nke na-enweghị ihe ha na-egosi banyere Chineke.
  rationale: Okwu ‘onwe ya,’ ‘akaebe,’ na nkọwa banyere ihe Chineke na-eme na-ejikọta onyinye ndị a na akaebe banyere ya, n’enweghị itinye ozizi karịrị ihe amaokwu ahụ kwuru.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. A hapụrụ okwu atụ ‘mejupụta obi unu n’ihe oriri na ọṅụ’ ka ọ chekwaa ihe oyiyi na esemokwu dị n’usoro Grik, kama ime ka ọ dị larịị site n’ịgbanwe ‘obi’ gaa n’akụkụ ahụ ọzọ.
