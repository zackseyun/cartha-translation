revisions:
- from: Ya mere, ha nọrọ ebe ahụ ogologo oge, na-ekwusara Onyenwe anyị okwu n’atụghị egwu.[a] Onyenwe anyị na-agbara okwu amara ya akaebe, na-emekwa ka e site n’aka ha rụọ ihe ịrịba ama na ọrụ ebube.
  to: Ya mere, ha nọrọ ebe ahụ ogologo oge, na-ekwu okwu n’atụghị egwu n’ime Onyenwe anyị,[a] onye na-agbara okwu amara ya akaebe, na-ekwe ka e mee ihe ịrịba ama na ọrụ ebube site n’aka ha.
  rationale: The revision replaces a construction that makes the Lord the recipient of their speech with “n’ime Onyenwe anyị,” a close rendering that leaves the Greek phrase’s relational force open. The footnote preserves viable contextual senses without deciding among them. It also regularizes the final clause while keeping the Lord as the one who grants the signs and wonders to be done through the missionaries’ hands.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T09:19:01Z'
review_pass:
  verdict: revise
  source_fidelity: The draft conveys the duration, the Lord’s ongoing testimony to the word of his grace, and the granting of signs and wonders. However, “na-ekwusara Onyenwe anyị okwu” normally means speaking words to the Lord, rather than speaking boldly in relation to/reliance on the Lord; it therefore does not represent ἐπὶ τῷ κυρίῳ adequately. The wording for the miracles is also syntactically strained.
  naturalness: Most vocabulary is natural Standard Igbo, but the first clause’s construction with “na-ekwusara Onyenwe anyị okwu” is semantically misleading, and “na-emekwa ka e site n’aka ha rụọ” has unnatural word order. The revision uses clearer, current Igbo syntax.
  terminology: “Onyenwe anyị,” “okwu amara ya,” “ihe ịrịba ama,” and “ọrụ ebube” are appropriate. The revised wording retains “Onyenwe anyị” without supplying “Jizọs,” and retains “amara” for χάρις.
  issues:
  - severity: high
    issue: The phrase “na-ekwusara Onyenwe anyị okwu” misrepresents ἐπὶ τῷ κυρίῳ.
    rationale: In Igbo, -ekwusara mmadụ okwu ordinarily takes that person as the recipient of the speech. The Greek phrase qualifies their bold speech as being in relation to, or dependent upon, the Lord; it does not say that they spoke to him.
  - severity: medium
    issue: “na-emekwa ka e site n’aka ha rụọ” is awkwardly ordered.
    rationale: Although its intended meaning is recoverable, placing “site n’aka ha” before “rụọ” after “ka e” is less idiomatic. Recasting the infinitival clause clearly expresses that the signs and wonders were done through them.
  revised_text: Ya mere, ha nọrọ ebe ahụ ogologo oge, na-ekwu okwu n’atụghị egwu n’ime Onyenwe anyị,[a] onye na-agbara okwu amara ya akaebe, na-ekwe ka e mee ihe ịrịba ama na ọrụ ebube site n’aka ha.
  revised_footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “na-ekwu okwu n’atụghị egwu, na-adabere n’Onyenwe anyị,” ma ọ bụ “na-ekwu okwu n’atụghị egwu n’ihi Onyenwe anyị.” Akpaokwu Grik ahụ nwere ike igosi na obi ike ha dabere n’Onyenwe anyị, ma ọ bụ na ha na-ekwu okwu n’ihe metụtara ya.
    reason: alternative_reading
  revision_rationale: The revision replaces a construction that makes the Lord the recipient of their speech with “n’ime Onyenwe anyị,” a close rendering that leaves the Greek phrase’s relational force open. The footnote preserves viable contextual senses without deciding among them. It also regularizes the final clause while keeping the Lord as the one who grants the signs and wonders to be done through the missionaries’ hands.
