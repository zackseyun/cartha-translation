id: ACT.14.3
reference: Acts 14:3
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἱκανὸν μὲν οὖν χρόνον διέτριψαν παρρησιαζόμενοι ἐπὶ τῷ κυρίῳ τῷ μαρτυροῦντι ⸀τῷ λόγῳ τῆς χάριτος αὐτοῦ, διδόντι σημεῖα καὶ τέρατα γίνεσθαι διὰ τῶν χειρῶν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/003.yaml
  text: So they stayed there a considerable time[a], speaking boldly for the Lord, who was bearing witness to the word of his grace, granting signs and wonders to be done through their hands.
translation:
  language: ig
  text: Ya mere, ha nọrọ ebe ahụ ogologo oge, na-ekwu okwu n’atụghị egwu n’ime Onyenwe anyị,[a] onye na-agbara okwu amara ya akaebe, na-ekwe ka e mee ihe ịrịba ama na ọrụ ebube site n’aka ha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “na-ekwu okwu n’atụghị egwu, na-adabere n’Onyenwe anyị,” ma ọ bụ “na-ekwu okwu n’atụghị egwu n’ihi Onyenwe anyị.” Akpaokwu Grik ahụ nwere ike igosi na obi ike ha dabere n’Onyenwe anyị, ma ọ bụ na ha na-ekwu okwu n’ihe metụtara ya.
    reason: alternative_reading
lexical_decisions:
- source_word: ἱκανὸν ... χρόνον
  choice: ogologo oge
  rationale: Akpaokwu a na-egosi oge dị ukwuu; “ogologo oge” bụ Igbo doro anya ma na-adịghị ekwubiga ogologo ya ókè.
- source_word: διέτριψαν
  choice: ha nọrọ ebe ahụ
  rationale: Ọ na-egosi ịnọgide n’otu ebe ruo oge ụfọdụ; itinye “ebe ahụ” na-eme ka ọnọdụ akụkọ doo anya.
- source_word: παρρησιαζόμενοι
  choice: na-ekwusara ... okwu n’atụghị egwu
  rationale: Nke a na-egosipụta ikwu okwu n’ihu ọha n’enweghị ụjọ, nke bụ isi echiche ngwaa Grik a.
- source_word: ἐπὶ τῷ κυρίῳ
  choice: na-ekwusara Onyenwe anyị okwu
  rationale: Nke a na-egosi na okwu obi ike ha bụ n’ozi na n’ihi Onyenwe anyị, ma ihe odide ala peeji na-edebe nghọta ọzọ nke ịdị n’ime ya ma ọ bụ ịdabere na ya.
- source_word: τῷ κυρίῳ
  choice: Onyenwe anyị
  rationale: Aha a na-edebe κύριος n’enweghị ịgbakwunye “Jizọs” ebe ihe odide Grik na-ekwughị ya kpọmkwem.
- source_word: τῷ μαρτυροῦντι
  choice: na-agbara ... akaebe
  rationale: Ọ na-edebe echiche nke akaebe na-adịgide adịgide nke Onyenwe anyị na-enye n’oge ozi ha.
- source_word: τῷ λόγῳ τῆς χάριτος αὐτοῦ
  choice: okwu amara ya
  rationale: “Okwu” na “amara” na-edebe usoro na ịdị arọ nke okwu Grik, ma ka bụkwa Igbo a na-aghọta nke ọma.
- source_word: διδόντι
  choice: na-emekwa ka ... rụọ
  rationale: Usoro a na-egosi na Onyenwe anyị bụ onye nyere ike ma mee ka ọrụ ndị ahụ kwe omume, n’agbanyeghị na ha si n’aka ndị ozi pụta.
- source_word: σημεῖα καὶ τέρατα
  choice: ihe ịrịba ama na ọrụ ebube
  rationale: 'Nke a na-edebe njikọ okwu abụọ ahụ: ihe ndị na-egosi eziokwu ozi ahụ na ihe ndị na-eju anya.'
- source_word: διὰ τῶν χειρῶν αὐτῶν
  choice: site n’aka ha
  rationale: Ọ bụ akpaokwu Igbo sitere n’okwu nkịtị nke na-edebe echiche na ndị ozi bụ ndị e ji rụọ ọrụ ndị ahụ.
theological_decisions:
- issue: Onye “Onyenwe anyị” na-ezo aka na ya
  choice: E dere naanị “Onyenwe anyị.”
  alternative: “Onyenwe anyị Jizọs” ma ọ bụ “Chineke.”
  rationale: Ihe odide Grik nwere naanị κύριος. Ịhapụ ya ka ọ bụrụ “Onyenwe anyị” na-ezere itinye nkọwa nke ihe odide ahụ ekwughị kpọmkwem.
- issue: Ike okwu ἐπὶ τῷ κυρίῳ
  choice: Isi ahịrịokwu na-egosi na ha na-ekwu okwu n’ozi Onyenwe anyị.
  alternative: “n’ime Onyenwe anyị” ma ọ bụ “na-adabere n’Onyenwe anyị.”
  rationale: ἐπί ya na dative nwere ike igosi ihe a dabere na ya, ọnọdụ e ji eme ihe, ma ọ bụ mmekọrịta ya na Onyenwe anyị. Ihe odide ala peeji na-edebe nghọta ndị a n’ebughị ụzọ mechie esemokwu ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. Ahịrịokwu abụọ na-egbochi ogologo usoro okwu ka ọ ghara ịda arọ, ebe njikọ nke Onyenwe anyị na akaebe ya ka doro anya.
