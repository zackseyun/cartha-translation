id: ACT.14.28
reference: Acts 14:28
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: διέτριβον ⸀δὲ χρόνον οὐκ ὀλίγον σὺν τοῖς μαθηταῖς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/028.yaml
  text: And they stayed with the disciples for no little time[a].
translation:
  language: ig
  text: Ha na ndị na-eso ụzọ ahụ nọrọkwa ogologo oge.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’okwu Grik, e kwuru ya kpọmkwem dịka “oge na-adịchaghị nta,” ya bụ, ogologo oge ma ọ bụ oge dị nnọọ ukwuu.
    reason: lexical_alternative
lexical_decisions:
- source_word: διέτριβον
  choice: nọrọ
  rationale: Ngwaa a n’ụdị imperfect na-egosi na ha nọgidere n’ebe ahụ ruo oge ụfọdụ; “nọrọ” bụ okwu Igbo dị mfe ma na-egosipụta ịnọgide ebe ahụ.
- source_word: δὲ
  choice: -kwa
  rationale: δὲ bụ njikọ dị nro na-aga n’ihu n’akụkọ ahụ; mgbakwunye “-kwa” na ngwaa na-eme ka njikọ ahụ daa nke ọma n’Igbo.
- source_word: χρόνον οὐκ ὀλίγον
  choice: ogologo oge
  rationale: N’asụsụ Grik, nke a bụ litotes, ya bụ, “oge na-adịchaghị nta,” nke pụtara oge dị ukwuu. “Ogologo oge” na-ebute ihe ọ pụtara n’Igbo nkịtị, ebe nkọwa ala peeji na-echekwa usoro okwu mbụ.
- source_word: σὺν τοῖς μαθηταῖς
  choice: ha na ndị na-eso ụzọ ahụ
  rationale: σύν na dative pụtara ịnọ “na” mmadụ. Usoro “ha na ndị na-eso ụzọ ahụ” bụ ụzọ Igbo e si ekwu na ha nọnyere ndị ahụ, ndị n’ebe a bụ ndị kwere ekwe nọ n’obodo ahụ.
theological_decisions: []
translation_notes:
  register: Standard Igbo dị ugbu a, nke dị mfe nghọta ma nwee ugwu. E ji “ogologo oge” mee ka litotes Grik bụrụ okwu Igbo ebumpụta ụwa, ma chekwaa ọdịdị okwu mbụ na nkọwa ala peeji.
