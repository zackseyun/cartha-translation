id: ACT.14.21
reference: Acts 14:21
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Εὐαγγελισάμενοί τε τὴν πόλιν ἐκείνην καὶ μαθητεύσαντες ἱκανοὺς ὑπέστρεψαν εἰς τὴν Λύστραν καὶ ⸀εἰς Ἰκόνιον καὶ ⸁εἰς Ἀντιόχειαν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/021.yaml
  text: And after proclaiming the good news in that city and making many disciples[a], they returned to Lystra and to Iconium and to Antioch,
translation:
  language: ig
  text: Mgbe ha kwusara ozi ọma n’obodo ahụ ma mee ka ọtụtụ mmadụ bụrụ ndị na-eso ụzọ, ha laghachiri na Listra, na Ikoniọm, nakwa na Antiọk.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εὐαγγελισάμενοί
  choice: Mgbe ha kwusara ozi ọma
  rationale: Aorist participle a na-egosi ihe mere tupu isi ngwaa ahụ; ‘Mgbe ha kwusara ozi ọma’ bụ Igbo doro anya nke na-echekwa echiche nke ikwusa ozi ọma.
- source_word: τε
  choice: ma
  rationale: A tụgharịrị njikọ a n’ụzọ dabara n’usoro Igbo, ka o jikọta ‘ikwusa ozi ọma’ na ‘ime ka ndị mmadụ bụrụ ndị na-eso ụzọ’.
- source_word: τὴν πόλιν ἐκείνην
  choice: n’obodo ahụ
  rationale: Ntụgharị kpọmkwem nke na-ezo aka n’obodo Debe nke a kpọtụrụ aha n’amaokwu bu ụzọ.
- source_word: μαθητεύσαντες
  choice: mee ka ... bụrụ ndị na-eso ụzọ
  rationale: 'Nke a na-echekwa ike ngwaa ahụ: ime ka mmadụ ghọọ onye na-eso ụzọ, ọ bụghị naanị izi onye dịlarị otú ahụ ihe.'
- source_word: ἱκανοὺς
  choice: ọtụtụ mmadụ
  rationale: N’ebe a, okwu ahụ pụtara ọnụ ọgụgụ buru ibu; ‘ọtụtụ mmadụ’ bụ okwu Igbo dị mfe ma bụrụkwa nke ebumpụta ụwa.
- source_word: ὑπέστρεψαν
  choice: ha laghachiri
  rationale: Ọ na-egosi na ha gara azụ n’ebe ndị a ha garala mbụ.
- source_word: εἰς τὴν Λύστραν
  choice: Listra
  rationale: Aha ebe njem ahụ na-aga; ‘laghachiri’ emeela ka echiche εἰς nke ịga ebe ahụ doo anya n’Igbo.
- source_word: εἰς Ἰκόνιον
  choice: Ikoniọm
  rationale: Aha obodo ahụ ka e depụtara n’ụdị dabara n’ọdịdị ụda Igbo; njikọ ndepụta ahụ na-egosi ebe ọzọ ha laghachiri.
- source_word: εἰς Ἀντιόχειαν
  choice: Antiọk
  rationale: Aha obodo ikpeazụ n’usoro njem ahụ; ‘laghachiri’ na-achịkwa aha ebe atọ ahụ n’ụzọ Igbo dị mma.
theological_decisions: []
translation_notes:
  register: 'Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ ‘mee ka ọtụtụ mmadụ bụrụ ndị na-eso ụzọ’ iji zere okwu ụka pụrụ iche ma chekwaa ihe μαθητεύσαντες pụtara. Enweghị akara nkọwa ala peeji n’ihi na nkọwa ala peeji Bekee e nyere adabaghị na marker ya: ihe ọzọ o kwuru metụtara Εὐαγγελισάμενοί, ọ bụghị μαθητεύσαντες.'
