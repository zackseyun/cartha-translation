  text: ὃς ἐν ταῖς παρῳχημέναις γενεαῖς εἴασεν πάντα τὰ ἔθνη πορεύεσθαι ταῖς ὁδοῖς αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/016.yaml
  text: In past generations he allowed all the nations to walk in their own ways[a].
translation:
  language: ig
  text: N’ọgbọ ndị gara aga, o kwere ka mba niile jee n’ụzọ nke ha.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “o kwere ka ndị mba ọzọ niile jee n’ụzọ nke ha.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς
  choice: o
  rationale: Nnọchiaha a na-ezo aka na Chineke a kpọtụrụ aha n’amaokwu bu ụzọ; iji “o” gaa n’ihu na-eme ka Igbo dị were were karịa ịmaliteghachi ya na “onye.”
- source_word: ἐν ταῖς παρῳχημέναις γενεαῖς
  choice: N’ọgbọ ndị gara aga
  rationale: Nke a na-egosi ọgbọ ndị gafeworo, ma bụrụkwa okwu Igbo nke oge a, doro anya ma dị ùgwù.
- source_word: εἴασεν
  choice: kwere ka
  rationale: “Kwere ka” na-egosi inye ohere ma ọ bụ ịhapụ ka ihe mee, ọ bụghị na Chineke kwadoro ụzọ ndị ahụ.
- source_word: πάντα τὰ ἔθνη
  choice: mba niile
  rationale: “Mba niile” na-edobe nghọta sara mbara nke ἔθνη dịka ndị dị iche iche ma ọ bụ mba dị iche iche; “ndị mba ọzọ” ka bụkwa ntụgharị kwere omume dabere n’echiche ndị Juu na ndị na-abụghị Juu.
- source_word: πορεύεσθαι
  choice: na-aga
  rationale: “Na-aga” na-edobe ihe atụ nke njem dị n’ọrụ Grik ma, mgbe e jikọtara ya na “ụzọ,” na-egosikwa omume na usoro ndụ.
- source_word: ταῖς ὁδοῖς αὐτῶν
  choice: n’ụzọ nke ha
  rationale: Nke a na-edobe ma ihe atụ “ụzọ” ma nnọchiaha αὐτῶν, na-egosi ụzọ mba ndị ahụ họọrọ ma ọ bụ gbasoro.
theological_decisions:
- issue: Ikwe ka ihe mee megide ịkwado ya
  choice: “O kwere ka” na-egosi na Chineke hapụrụ mba niile ka ha soro ụzọ nke ha n’oge ahụ, n’ebughị ụzọ kwuo na ọ kwadoro ụzọ ha.
  alternative: Ịsị na Chineke kwadoro ụzọ mba ndị ahụ, ma ọ bụ na ọ bụ ya kpebiri kpọmkwem ka ha soro ha.
  rationale: εἴασεν pụtara ikwe ma ọ bụ inye ohere. Okwu a kwesịrị idobe esemokwu dị n’etiti ọchịchị Chineke na ibu ọrụ mmadụ n’ebughị nkọwa okwukwe ọzọ banye na ya.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe nghọta ma dị ùgwù. A hapụrụ ihe atụ nke ‘ịga n’ụzọ’ n’ihi na ọ na-arụ ọrụ nke ọma n’Igbo ma na-egosikwa usoro ndụ.
