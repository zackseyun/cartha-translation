  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὃν καὶ πιάσας ἔθετο εἰς φυλακήν, παραδοὺς τέσσαρσιν τετραδίοις στρατιωτῶν φυλάσσειν αὐτόν, βουλόμενος μετὰ τὸ πάσχα ἀναγαγεῖν αὐτὸν τῷ λαῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/004.yaml
  text: After arresting him[a], he put him in prison, handing him over to four squads of soldiers to guard him[b], intending to bring him out to the people after the Passover.
translation:
  language: ig
  text: Mgbe o jidere ya, o tinyere ya n’ụlọ mkpọrọ ma nyefee ya n’aka ìgwè ndị agha anọ[a] ka ha na-eche ya nche. O zubere ịkpọpụta ya n’ihu ndị mmadụ mgbe Ememme Ngabiga[b] gasịrị.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’ụzọ nkịtị, “ìgwè anọ nke ndị agha anọ,” ya bụ, ìgwè anọ, nke ọ bụla nwere ndị agha anọ.
    reason: lexical_alternative
  - marker: b
    text: Okwu Grik bụ πάσχα, nke pụtara “Ememme Ngabiga.” Ụfọdụ nsụgharị ochie sụgharịrị ya “Ista” n’ebe a.
    reason: alternative_reading
lexical_decisions:
- source_word: πιάσας
  choice: mgbe o jidekwara ya
  rationale: Aorist participle ahụ na-egosi ihe mere tupu e tinye ya n’ụlọ mkpọrọ; “jidekwara” na-edobekwa ike nke καί n’usoro akụkọ ahụ.
- source_word: ἔθετο εἰς φυλακήν
  choice: o tinyere ya n’ụlọ mkpọrọ
  rationale: Nke a bụ ụzọ Igbo doro anya ma dị mma isi kwuo na e tinyere mmadụ n’ụlọ mkpọrọ.
- source_word: παραδοὺς
  choice: ma nyefee ya n’aka
  rationale: Ọ na-egosi na e tinyere Pita n’okpuru nlekọta ndị agha ahụ.
- source_word: τέσσαρσιν τετραδίοις στρατιωτῶν
  choice: ìgwè ndị agha anọ[a]
  rationale: τετράδιον bụ ìgwè nwere mmadụ anọ. Isi okwu ahụ na-aga were were n’Igbo, ebe nkọwa ala peeji na-egosi ọnụ ọgụgụ ziri ezi nke ìgwè ọ bụla.
- source_word: φυλάσσειν αὐτόν
  choice: ka ha na-eche ya nche
  rationale: Nke a na-egosipụta infinitive nke nzube ma na-ada ka Igbo nkịtị.
- source_word: βουλόμενος
  choice: O bu n’obi
  rationale: Ọ na-egosi atụmatụ Herọd kpebiri ime, n’ebughị mmetụta ma ọ bụ ihe ọzọ a na-ekwughị n’amaokwu ahụ.
- source_word: μετὰ τὸ πάσχα
  choice: mgbe Ememme Ngabiga[b] gasịrị
  rationale: πάσχα bụ Ememme Ngabiga ndị Juu; usoro a bụ Igbo doro anya nke na-egosi na ọ ga-eme mgbe ememme ahụ gachara.
- source_word: ἀναγαγεῖν αὐτὸν τῷ λαῷ
  choice: ịkpọpụta ya nye ndị mmadụ
  rationale: “Ịkpọpụta” na-egosi iwepụta ya n’ụlọ mkpọrọ ka e mee ka ndị mmadụ hụ ya, na-enweghị ịgbakwunye ikpe ụlọikpe nke isi mmalite ahụ ekwughị kpọmkwem.
- source_word: λαῷ
  choice: ndị mmadụ
  rationale: Nhọrọ a na-edobe okwu ahụ n’obosara ya dịka ọha mmadụ, n’akọwaghị ya karịa ihe Grik kwuru.
theological_decisions:
- issue: Ntughari πάσχα
  choice: Ememme Ngabiga
  alternative: Ista
  rationale: πάσχα n’ebe a pụtara Ememme Ngabiga ndị Juu. “Ista” sitere n’omenala ụfọdụ nke nsụgharị, ma ọ bụghị ihe okwu Grik ahụ pụtara kpọmkwem n’ebe a.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta mee ihe. E debere usoro akụkọ ahụ n’ụzọ na-aga were were, ma nkọwa ala peeji chekwara nkọwa kpọmkwem banyere ìgwè ndị agha na ọdịiche omenala nsụgharị nke πάσχα.
