revisions:
- from: Mgbe o jidekwara ya, o tinyere ya n’ụlọ mkpọrọ ma nyefee ya n’aka ìgwè ndị agha anọ[a] ka ha na-eche ya nche. O bu n’obi ịkpọpụta ya nye ndị mmadụ mgbe Ememme Ngabiga[b] gasịrị.
  to: Mgbe o jidere ya, o tinyere ya n’ụlọ mkpọrọ ma nyefee ya n’aka ìgwè ndị agha anọ[a] ka ha na-eche ya nche. O zubere ịkpọpụta ya n’ihu ndị mmadụ mgbe Ememme Ngabiga[b] gasịrị.
  rationale: The revision removes a potentially misleading nuance from “jidekwara,” uses more natural Standard Igbo for deliberate intent, and clarifies the public-facing sense of bringing Peter out. The first note is reworded to preserve explicitly the Greek’s four groups of four soldiers. “Ememme Ngabiga” is retained as the source-faithful rendering of πάσχα, and the alternative traditional rendering remains confined to the note.
