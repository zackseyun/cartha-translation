    reason: lexical_alternative
  - marker: b
    text: Okwu Grik bụ πάσχα, nke pụtara “Ememme Ngabiga.” Ụfọdụ nsụgharị ochie sụgharịrị ya “Ista” n’ebe a.
    reason: alternative_reading
  revision_rationale: The revision removes a potentially misleading nuance from “jidekwara,” uses more natural Standard Igbo for deliberate intent, and clarifies the public-facing sense of bringing Peter out. The first note is reworded to preserve explicitly the Greek’s four groups of four soldiers. “Ememme Ngabiga” is retained as the source-faithful rendering of πάσχα, and the alternative traditional rendering remains confined to the note.
