  to: Mgbe ọ ghọtara ihe merenụ, ọ gara n’ụlọ Meri, nne Jọn. A na-akpọ Jọn ahụ Mak[a]. Ọtụtụ mmadụ zukọtara ọnụ n’ebe ahụ, na-ekpe ekpere.
  rationale: The revision makes explicit that John, rather than Mary, was called Mark. It retains the contextual rendering “ihe merenụ,” the location at Mary's house, the substantial gathered group, and their continuing prayer. The footnote remains anchored to Mak and now matches the unambiguous main-text construction.
