review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys Peter's realization, his going to Mary's house, Mary's identification as John's mother, the gathered group, and their ongoing prayer. However, the relative phrase “onye a na-akpọ Mak” immediately after “Meri, nne Jọn” can naturally be read as identifying Mary—not John—as the person called Mark. The source explicitly identifies John as the one called Mark.
  naturalness: The Igbo is generally clear and modern. Separating the identification of John called Mark into a short sentence removes the attachment ambiguity and reads naturally. “na-ekpe ekpere” is sufficient and avoids the additive nuance of “-kwa,” which is not required by καί here.
  terminology: Meri, Jọn, and Mak are appropriate established Igbo biblical name forms. “ekpe ekpere” appropriately renders προσεύχομαι. The footnote accurately preserves the possible “also called” nuance without imposing it on the main text.
  issues:
  - severity: medium
    issue: Ambiguous antecedent for “onye a na-akpọ Mak.”
    rationale: In “Meri, nne Jọn, onye a na-akpọ Mak,” the final relative expression may modify Meri. Greek τοῦ ἐπικαλουμένου Μάρκου modifies Ἰωάννου, so the translation should identify John unambiguously as the one called Mark.
  - severity: low
    issue: “na-ekpekwa ekpere” adds an unnecessary additive nuance.
    rationale: The Greek καί simply coordinates the praying with the gathered state. “na-ekpe ekpere” is direct, natural, and fully conveys the ongoing action.
  revised_text: Mgbe ọ ghọtara ihe merenụ, ọ gara n’ụlọ Meri, nne Jọn. A na-akpọ Jọn ahụ Mak[a]. Ọtụtụ mmadụ zukọtara ọnụ n’ebe ahụ, na-ekpe ekpere.
  revised_footnotes:
