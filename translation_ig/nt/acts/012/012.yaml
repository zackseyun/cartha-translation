    text: A pụkwara ịsụgharị ya, “A na-akpọkwa Jọn ahụ Mak.” Okwu Grik ji aha ọzọ kọwaa Jọn, ma ọ dịghị amanye ka e tinye okwu “kwa.”
    reason: lexical_alternative
  revision_rationale: The revision makes explicit that John, rather than Mary, was called Mark. It retains the contextual rendering “ihe merenụ,” the location at Mary's house, the substantial gathered group, and their continuing prayer. The footnote remains anchored to Mak and now matches the unambiguous main-text construction.
