id: ACT.12.12
reference: Acts 12:12
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Συνιδών τε ἦλθεν ἐπὶ τὴν οἰκίαν ⸀τῆς Μαρίας τῆς μητρὸς Ἰωάννου τοῦ ἐπικαλουμένου Μάρκου, οὗ ἦσαν ἱκανοὶ συνηθροισμένοι καὶ προσευχόμενοι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/012.yaml
  text: And when he realized this[a], he went to the house of Mary, the mother of John who was called Mark, where many had gathered together and were praying.
translation:
  language: ig
  text: Mgbe ọ ghọtara ihe merenụ, ọ gara n’ụlọ Meri, nne Jọn. A na-akpọ Jọn ahụ Mak[a]. Ọtụtụ mmadụ zukọtara ọnụ n’ebe ahụ, na-ekpe ekpere.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “A na-akpọkwa Jọn ahụ Mak.” Okwu Grik ji aha ọzọ kọwaa Jọn, ma ọ dịghị amanye ka e tinye okwu “kwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Συνιδών
  choice: Mgbe ọ ghọtara ihe merenụ
  rationale: Okwu a na-egosi na Pita bịara ghọta nke ọma ọnọdụ ya mgbe mmụọ ozi ahụ hapụrụ ya. ‘Ihe merenụ’ sitere n’ihe gbara amaokwu a gburugburu, ma na-eme ka Igbo bụrụ nke doro anya ma dịkwa n’okike.
- source_word: τε
  choice: —
  rationale: Njikọ a dị nro n’asụsụ Grik; usoro akụkọ Igbo anaghị achọ ka a sụgharịa ya iche n’ebe a.
- source_word: ἦλθεν ἐπὶ τὴν οἰκίαν
  choice: ọ gara n’ụlọ
  rationale: Nke a na-egosi ngagharị ruo n’otu ebe. ‘Ọ gara n’ụlọ’ dabara n’echiche onye na-akọ akụkọ.
- source_word: τῆς Μαρίας
  choice: Meri
  rationale: A sụgharịrị aha Μαρία n’ụdị aha a maara nke ọma n’Igbo.
- source_word: τῆς μητρὸς Ἰωάννου
  choice: nne Jọn
  rationale: Nke a na-edobe mmekọrịta ezinụlọ ahụ kpọmkwem ma na-enyekwa aka ịmata Meri a na-ekwu maka ya.
- source_word: τοῦ ἐπικαλουμένου Μάρκου
  choice: onye a na-akpọ Mak[a]
  rationale: Nke a na-egosi na Jọn nwere aha ọzọ e ji amata ya, n’etinyeghị ‘kwa,’ nke okwu Grik n’onwe ya na-achọghị.
- source_word: οὗ
  choice: n’ebe ahụ
  rationale: Ọ na-ezo aka n’ụlọ Meri dịka ebe ndị ahụ zukọtara; ikewa ya dịka ahịrịokwu nke abụọ na-eme ka Igbo gụọ nke ọma.
- source_word: ἱκανοὶ
  choice: ọtụtụ mmadụ
  rationale: N’ebe a, okwu ahụ pụtara ọnụ ọgụgụ mmadụ buru ibu ma ọ bụ nke bara ụba.
- source_word: συνηθροισμένοι
  choice: zukọtara ọnụ
  rationale: Nke a na-egosipụta ọnọdụ sitere n’ịgbakọta ha n’otu ebe.
- source_word: καὶ προσευχόμενοι
  choice: na-ekpekwa ekpere
  rationale: Ụdị ngwaa a na-egosi na ekpere ahụ ka na-aga n’ihu mgbe Pita rutere.
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E kewara okwu ahụ ụzọ abụọ ka usoro ya ghara ịdị arọ, ma e chekwara njikọ echiche na omume ekpere na-aga n’ihu.
