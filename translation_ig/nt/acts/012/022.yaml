  text: ὁ δὲ δῆμος ἐπεφώνει· ⸂Θεοῦ φωνὴ⸃ καὶ οὐκ ἀνθρώπου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/022.yaml
  text: And the crowd kept shouting[a], “The voice of a god, and not of a man!”
translation:
  language: ig
  text: Ìgwè mmadụ ahụ nọ na-eti mkpu, sị, “Ọ bụ olu chi, ọ bụghị nke mmadụ!”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịtụgharị ya, “Ọ bụ olu Chineke, ọ bụghị nke mmadụ!” A pụrụ ịghọta Grik ahụ n'ụzọ a, ma n'ihe gbara ya gburugburu, “olu chi” yikarịrị ka ọ bụ ya, n'ihi na nke a na-egosi otuto ndị ọgọ mmụọ nyere Herọd dịka chi.
    reason: alternative_reading
lexical_decisions:
- source_word: δῆμος
  choice: ìgwè mmadụ ahụ
  rationale: N'ebe a, okwu ahụ na-ezo aka n'ọha mmadụ gbakọtara, ọ bụghị òtù ọchịchị; “ìgwè mmadụ ahụ” bụ Igbo doro anya ma kwekọọ n'ọnọdụ ahụ.
- source_word: ἐπεφώνει
  choice: nọ na-eti mkpu
  rationale: Ụdị imperfect Grik na-egosi omume na-aga n'ihu ma ọ bụ a na-eme ugboro ugboro; nkebi a na-echekwa echiche ahụ.
- source_word: Θεοῦ
  choice: chi
  rationale: N'ọnọdụ ndị ọgọ mmụọ na-eto Herọd dị ka onye nwere ọnọdụ chi, θεοῦ na-enweghị article yikarịrị ka ọ pụtara chi n'ozuzu ya, ọ bụghị kpọmkwem Chineke nke Izrel.
- source_word: φωνὴ
  choice: olu
  rationale: “Olu” na-echekwa ụdị aha ahụ ma na-egosipụta ihe ìgwè mmadụ kwuru banyere okwu Herọd.
- source_word: ἀνθρώπου
  choice: mmadụ
  rationale: “Mmadụ” na-echekwa ọdịiche kpọmkwem dị n'etiti chi na mmadụ, n'enweghị ịgbasa nkọwa ahụ karịa ihe Grik kwuru.
theological_decisions:
- issue: Ma θεοῦ ga-abụ “chi” ka ọ bụ “Chineke”
  choice: chi
  alternative: Chineke
  rationale: Ihe gbara amaokwu ahụ gburugburu bụ ìgwè ndị ọgọ mmụọ na-enye Herọd nsọpụrụ dịka chi; Grik ahụ enweghị article. “Chi” na-echekwa ọnọdụ akụkọ na okpukpe ahụ, ebe “Chineke” nwere ike ime ka a ghọta na ha na-ekwu kpọmkwem banyere otu Chineke.
translation_notes:
  register: Standard Igbo nke oge a, dị mfe nghọta ma dịkwa ùgwù. E ji “nọ na-eti mkpu” gosipụta omume na-aga n'ihu, ma jiri “chi” obere mkpụrụedemede chekwaa echiche nke nkwupụta ndị ọgọ mmụọ.
