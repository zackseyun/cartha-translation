  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀνεῖλεν δὲ Ἰάκωβον τὸν ἀδελφὸν Ἰωάννου μαχαίρῃ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/002.yaml
  text: And he killed James[a], the brother of John, with the sword.
translation:
  language: ig
  text: O wee jiri mma agha gbuo Jemis[a], nwanne nwoke Jọn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “mee ka Jemis nwụọ,” ma ọ bụ “nye ya ntaramahụhụ ọnwụ.” Okwu Grik ahụ kwuru nanị na o mere ka Jemis nwụọ; gburugburu akụkọ ahụ nwere ike igosi na ọ bụ ogbugbu e mere site n'iwu ọchịchị.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνεῖλεν
  choice: gbuo
  rationale: N'ebe a, ἀναιρέω pụtara ime ka mmadụ nwụọ. “Gbuo” bụ okwu Igbo doro anya ma dịkwa mfe, n'ebughị ụzọ kwuo kpọmkwem na ọ bụ ikpe ọchịchị.
- source_word: δὲ
  choice: O wee
  rationale: δέ na-aga n'ihu n'akụkọ ahụ. “O wee” na-ejikọta ihe a na ihe bu ya ụzọ n'ụzọ dị n'okike n'Igbo, n'emeghị ka ọdịiche sie ike karịa ka Grik si kwuo.
- source_word: Ἰάκωβον
  choice: Jemis
  rationale: A sụgharịghị aha mmadụ; e dere ya n'ụdị a maara nke ọma n'Igbo.
- source_word: τὸν ἀδελφὸν Ἰωάννου
  choice: nwanne Jọn
  rationale: Nkebi ahịrịokwu a na-akọwa Jemis a na-ekwu maka ya. “Nwanne Jọn” bụ usoro Igbo dị n'okike ma na-edobe njirimara ahụ n'enweghị ịkọwa ma ọ bụ nwanne nwoke tọrọ ibe ya ma ọ bụ nke nta.
- source_word: μαχαίρῃ
  choice: jiri mma agha
  rationale: μάχαιρα bụ mma agha ma ọ bụ mma agha dị mkpụmkpụ; dative ahụ na-egosi ngwa e ji mee ihe. “Jiri mma agha” na-edobe ihe oyiyi doro anya nke isi mmalite ahụ.
theological_decisions:
- issue: Ụdị ihe Herọd mere
  choice: E kwuru ya dịka igbu mmadụ, n'ekwughị n'ahịrị bụ isi na ọ bụ ogbugbu e mere site n'iwu ọchịchị.
  alternative: “O wee nye iwu ka e jiri mma agha gbuo Jemis” ma ọ bụ okwu ga-akọwa ya dịka ntaramahụhụ ọnwụ nke ọchịchị.
  rationale: ἀνεῖλεν kwuru na e gburu Jemis, ebe μαχαίρῃ kwuru ngwa e ji gbuo ya. Ọ bụ ezie na gburugburu akụkọ ahụ nwere ike igosi mkpagbu gọọmenti na ogbugbu iwu kwadoro, amaokwu a n'onwe ya ekwughị usoro ikpe ma ọ bụ iwu Herọd nyere. Ya mere, a hapụrụ okwu ahụ n'obosara ya.
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe nke oge a, dị mfe ma dị ùgwù. E ji “O wee” mee ka akụkọ ahụ gaa n'ihu n'ụzọ sitere n'okike, ma e debere “mma agha” dịka ihe e ji gbuo ya.
