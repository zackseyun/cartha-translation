  source_fidelity: The draft accurately renders ἀνεῖλεν as “gbuo” and μαχαίρῃ instrumentally as “jiri mma agha.” However, τὸν ἀδελφὸν Ἰωάννου explicitly identifies James as John’s male sibling. “Nwanne Jọn” is grammatically natural but gender-neutral in Igbo, so it loses a stated source detail.
  naturalness: “O wee jiri mma agha gbuo Jemis” is clear, idiomatic Standard Igbo narrative prose. Adding “nwoke” in the apposition remains natural and restores the explicit meaning.
  terminology: “Jemis,” “Jọn,” and “mma agha” are suitable established/natural forms. The footnote appropriately keeps “ntaramahụhụ ọnwụ” as a possible, but more legally specific, alternative rather than placing it in the main text.
  issues:
