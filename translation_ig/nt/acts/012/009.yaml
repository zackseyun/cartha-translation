id: ACT.12.9
reference: Acts 12:9
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἐξελθὼν ⸀ἠκολούθει, καὶ οὐκ ᾔδει ὅτι ἀληθές ἐστιν τὸ γινόμενον διὰ τοῦ ἀγγέλου, ἐδόκει δὲ ὅραμα βλέπειν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/009.yaml
  text: And he went out and followed[a], and he did not know that what was happening through the angel was real, but thought he was seeing a vision.
translation:
  language: ig
  text: O wee pụọ soro mmụọ ozi ahụ, ma ọ maghị na ihe na-eme site n’aka mmụọ ozi ahụ[a] bụ eziokwu; kama o chere na ọ na-ahụ ọhụụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “nke mmụọ ozi ahụ mere.” Okwu Grik ahụ nwere ike igosi ọrụ ma ọ bụ ụzọ e si mee ihe; “site n’aka mmụọ ozi ahụ” na-echekwa echiche a.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθὼν
  choice: Ọ pụrụ
  rationale: A sụgharịrị aorist participle ahụ dị ka ngwaa zuru ezu nke na-ebute ihe sochirinụ; nke a bụ ụzọ Igbo si ekwu akụkọ n'ụzọ dị mma ma na-echekwa mmegharị ahụ.
- source_word: ἠκολούθει
  choice: soro mmụọ ozi ahụ
  rationale: Ngwaa imperfect ahụ na-egosi omume na-aga n’ihu. N’Igbo, “soro” dabara n’akụkọ ma ihe gbara ya gburugburu na-egosi na Pita nọgidere na-eso mmụọ ozi ahụ.
- source_word: οὐκ ᾔδει
  choice: Ọ maghị
  rationale: Nke a na-egosipụta enweghị ihe ọmụma ma ọ bụ nghọta n'ụzọ doro anya na nke nkịtị n’Igbo.
- source_word: ἀληθές
  choice: bụ ihe mere n’ezie
  rationale: N’ebe a, okwu ahụ na-emegide ọhụụ; “ihe mere n’ezie” na-egosi na ihe ahụ bụ ezi ọnọdụ, ọ bụghị naanị ihe a hụrụ n’ọhụụ.
- source_word: τὸ γινόμενον
  choice: ihe ahụ ... na-eme
  rationale: Nke a na-echekwa echiche nke ihe na-aga n’ihu n’oge ahụ ma na-ada nke ọma n’Igbo.
- source_word: διὰ τοῦ ἀγγέλου
  choice: mmụọ ozi ahụ na-eme
  rationale: Nrụpụta a na-egosi mmụọ ozi ahụ dị ka onye e si n’aka ya mee ihe ahụ, kwekọrọ n’ọrụ διά na genitive, n’enweghị ikwu ihe karịrị ederede banyere ike nke aka ya.
- source_word: ἐδόκει
  choice: o chere
  rationale: Ọ na-egosi ihe Pita weere na ọ bụ ya na-eme ya n’uche ya, n’ụzọ dị mkpirikpi ma bụrụ nke nkịtị.
- source_word: ὅραμα
  choice: ọhụụ
  rationale: “Ọhụụ” bụ okwu Igbo a na-ejikarị maka ihe mmadụ hụrụ nke sitere n’ụzọ mkpughe ma ọ bụ nke yiri nrọ.
- source_word: βλέπειν
  choice: ọ na-ahụ
  rationale: Ya na “o chere” jikọtara, okwu a na-egosi ahụmahụ Pita chere na ọ nọ na ya n’oge ahụ.
theological_decisions:
- issue: Ụdị ọrụ mmụọ ozi ahụ
  choice: ihe ahụ mmụọ ozi ahụ na-eme
  alternative: ihe ahụ e si n’aka mmụọ ozi ahụ mee
  rationale: Nhọrọ a na-echekwa echiche nke mediated agency dị na διά ya na genitive, ma ọ naghị ekpebi echiche nkà mmụta okpukpe banyere ma mmụọ ozi ahụ ji ike nke aka ya mee ihe ahụ.
translation_notes:
  register: 'Ejiri Standard Igbo nke oge a, nke dị mfe nghọta ma nwee ugwu. E tinyere “mmụọ ozi ahụ” dịka ihe okwu “soro” na-ezo aka na ya iji gbochie nghọtahie n’Igbo; onye ahụ pụtara ìhè site n’amaokwu ndị gbara ya gburugburu. E jighị akara ntụaka ala peeji n’ihi na ihe edere n’ala peeji nke English POB yiri ka akara ya nọ n’ebe na-ekwesịghị ekwesị: ọ na-akọwa διὰ τοῦ ἀγγέλου, ọ bụghị ἠκολούθει.'
