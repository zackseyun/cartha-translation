revisions:
- from: Ọ pụrụ, soro mmụọ ozi ahụ. Ọ maghị na ihe ahụ mmụọ ozi ahụ na-eme bụ ihe mere n’ezie, kama o chere na ọ na-ahụ ọhụụ.
  to: O wee pụọ soro mmụọ ozi ahụ, ma ọ maghị na ihe na-eme site n’aka mmụọ ozi ahụ[a] bụ eziokwu; kama o chere na ọ na-ahụ ọhụụ.
  rationale: The revision preserves the ongoing force of τὸ γινόμενον, expresses ἀληθές as the actuality of the event rather than a completed past occurrence, and renders διὰ τοῦ ἀγγέλου with an agency/instrumentality phrase that does not overstate the angel’s independent action. The footnote is placed at the Igbo rendering of the relevant Greek phrase.
