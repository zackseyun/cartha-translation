  source_fidelity: 'The Igbo accurately preserves the sequence of the Greek: Herod searched, failed to find Peter, questioned/examined the guards, ordered their removal for the implied execution, then went down from Judea to Caesarea and remained there. “Gbadaa” appropriately retains the geographic travel idiom. The rendering of ἀπαχθῆναι makes the contextual implication explicit while the footnote preserves the literal sense.'
