  terminology: “Herọd,” “Judia,” and “Sizaria” are suitable established Igbo forms. “Ndị nche” and “jụsịrị ndị nche ahụ ajụjụ” communicate the intended guards and official questioning adequately. The execution implication is responsibly qualified in the footnote rather than presented as a lexical meaning of ἀπαχθῆναι itself.
