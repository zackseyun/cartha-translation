id: ACT.12.19
reference: Acts 12:19
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἡρῴδης δὲ ἐπιζητήσας αὐτὸν καὶ μὴ εὑρὼν ἀνακρίνας τοὺς φύλακας ἐκέλευσεν ἀπαχθῆναι, καὶ κατελθὼν ἀπὸ τῆς Ἰουδαίας ⸀εἰς Καισάρειαν διέτριβεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/019.yaml
  text: But Herod[a], after searching for him and not finding him, examined the guards and ordered them to be led away to execution. Then he went down from Judea to Caesarea and stayed there.
translation:
  language: ig
  text: Ma Herọd chọsịrị ya ma ọ hụghị ya. Mgbe ọ jụsịrị ndị nche ahụ ajụjụ, o nyere iwu ka a kpọpụ ha gaa gbuo ha.[a] Mgbe ahụ, o si na Judia gbadaa Sizaria, nọrọkwa n’ebe ahụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’ụzọ nkịtị, ‘ka a kpọpụ ha.’ N’ọnọdụ a, o yikarịrị ka ihe ọ pụtara bụ na a kpọpụtara ha ka e gbuo ha.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιζητήσας
  choice: chọsịrị ya
  rationale: Aorist participle a na-egosi nchọ ahụ mere tupu Herọd ajụọ ndị nche ajụjụ; okwu a na-egosi na ọ kpachapụrụ anya na-achọ Pita n’emeghị ka ike nchọ ahụ karịa ihe Greek kwuru.
- source_word: μὴ εὑρὼν
  choice: ma ọ hụghị ya
  rationale: Nke a na-egosi n'ụzọ Igbo doro anya na nchọ ahụ amịtaghị mkpụrụ, ma na-edobe usoro ihe ndị mere.
- source_word: ἀνακρίνας
  choice: jụsịrị ndị nche ahụ ajụjụ
  rationale: Ngwaa Greek nwere ike ịpụta nyocha ma ọ bụ ịjụ ajụjụ n’ụzọ ọchịchị ma ọ bụ ikpe; nsụgharị a bụ Igbo nkịtị ma na-egosi ajụjụ siri ike metụtara ọrụ ha.
- source_word: φύλακας
  choice: ndị nche ahụ
  rationale: Ọ na-ezo aka n’ụmụ agha e nyere ọrụ iche Pita nche; ‘ndị nche’ bụ okwu Igbo doro anya ma dị mfe nghọta.
- source_word: ἐκέλευσεν ἀπαχθῆναι
  choice: o nyere iwu ka a kpọpụ ha gaa gbuo ha
  rationale: ἀπαχθῆναι pụtara n’ụzọ nkịtị ‘ka a kpọpụ ha,’ ma n’ọnọdụ akụkọ a ọ na-egosi na a kpọpụtara ha ka e gbuo ha. Nsụgharị ahụ mere ihe okwu ahụ pụtara n’ọnọdụ a ka ọ doo anya, ebe ihe odide ala peeji na-edobe okwu nkịtị ahụ.
- source_word: κατελθὼν
  choice: o si na Judia gbadaa
  rationale: ‘Gbadaa’ na-edobe okwu njem Greek nke na-akọ njem site n’ala Judia dị elu gaa n’ụsọ oké osimiri ebe Sizaria dị.
- source_word: Ἰουδαίας
  choice: Judia
  rationale: Nke a bụ aha mpaghara ahụ n’ụdị dabara n’asụsụ Igbo.
- source_word: Καισάρειαν
  choice: Sizaria
  rationale: Nke a bụ ntụgharị aha obodo Caesarea n’ụdị a na-amata n’asụsụ Igbo.
- source_word: διέτριβεν
  choice: nọrọkwa n’ebe ahụ
  rationale: Imperfect Greek na-egosi ịnọgide ruo oge ụfọdụ; nkebiokwu Igbo a na-enye echiche ahụ n'ụzọ dị mfe ma bụrụkwa nke e ji eme ihe ugbu a.
theological_decisions:
- issue: Ma a ga-asụgharị ἀπαχθῆναι naanị dị ka ‘ka a kpọpụ ha,’ ka a ga-eme ka ntaramahụhụ ọ na-egosi pụta ìhè
  choice: ka a kpọpụ ha gaa gbuo ha
  alternative: ka a kpọpụ ha
  rationale: Greek ejighị ngwaa nkịtị pụtara ‘igbu,’ n’ihi ya e kwesịghị izochi na okwu ya bụ n’ezie ‘ịkpọpụ.’ Ma n’akụkọ a banyere ndị nche onye mkpọrọ gbapụrụ n’aka ha, iwu Herọd yiri nnọọ ka ọ bụ ka e gbuo ha. Isi okwu mere ka nghọta a pụta ìhè, ebe ihe odide ala peeji chekwara ihe Greek kwuru kpọmkwem.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta, dee ya. E kewara participle ndị Greek ka ha bụrụ ahịrịokwu Igbo na-aga were were, ma e debere usoro ihe ndị mere na ntụaka njem ‘gbadaa.’
