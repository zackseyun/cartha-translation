id: ACT.12.20
reference: Acts 12:20
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἦν ⸀δὲ θυμομαχῶν Τυρίοις καὶ Σιδωνίοις· ὁμοθυμαδὸν δὲ παρῆσαν πρὸς αὐτόν, καὶ πείσαντες Βλάστον τὸν ἐπὶ τοῦ κοιτῶνος τοῦ βασιλέως ᾐτοῦντο εἰρήνην διὰ τὸ τρέφεσθαι αὐτῶν τὴν χώραν ἀπὸ τῆς βασιλικῆς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/020.yaml
  text: He was very angry with the Tyrians and Sidonians[a]. But they came to him with one accord, and after persuading Blastus, the king’s chamberlain, they were asking for peace[d][c][b], because their country was fed from the king’s domain.
translation:
  language: ig
  text: Ọ nọ n’oké iwe megide ndị Taịa na ndị Saịdọn[a]. Ma ha ji otu obi bịakwute ya. Mgbe ha mechara mee ka Blastọs, onye na-ahụ maka ọnụ ụlọ ndina eze[b], kwenye, ha nọ na-arịọ ka e mee udo, n’ihi na ala ha na-enweta ihe oriri site n’ala eze[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “Ọ nọ n’iro megide ndị Taịa na ndị Saịdọn.” Okwu Grik a na-egosi oké iwe ma ọ bụ iro siri ike.
    reason: lexical_alternative
  - marker: b
    text: N’ụzọ nkịtị, “onye na-ahụ maka ọnụ ụlọ ndina eze”; o yiri ka ọ bụ onye ọrụ ụlọ eze nke nwere ike ịbịaru ebe nzuzo eze nso.
    reason: cultural_note
  - marker: c
    text: Ma ọ bụ, “n’ihi na mpaghara ha na-enweta ihe oriri site n’ókèala eze.”
    reason: lexical_alternative
lexical_decisions:
- source_word: θυμομαχῶν
  choice: were ... oké iwe
  rationale: Nkebi a na-egosi iwe siri ike ma ọ bụ ọnọdụ iro; okwu Igbo a bụ nke mmadụ nkịtị ga-aghọta, ma ọ naghị eme ka ihe ahụ bụrụ naanị esemokwu agha.
- source_word: Τυρίοις καὶ Σιδωνίοις
  choice: ndị Taịa na ndị Saịdọn
  rationale: A sụgharịrị aha agbụrụ ndị a dịka ndị obodo Taịa na Saịdọn n’ụzọ dabara n’Igbo.
- source_word: ὁμοθυμαδόν
  choice: ha niile jiri otu obi
  rationale: Nke a na-egosi ịdị n’otu n’ebumnuche, ọ bụghị naanị na ha bịara n’otu oge.
- source_word: παρῆσαν πρὸς αὐτόν
  choice: bịakwute ya
  rationale: Ọ na-egosi na ha bịara n’ihu ya ma ọ bụ bịakwuru ya; ụdị a bụ Igbo doro anya.
- source_word: πείσαντες
  choice: Mgbe ha ratachara
  rationale: Ọ na-echekwa na ime ka Blastọs kwado ha mere tupu arịrịọ udo ahụ.
- source_word: Βλάστον
  choice: Blastọs
  rationale: E dere aha onye ahụ n’ụzọ dabara n’usoro ụda na mkpụrụedemede Igbo.
- source_word: τὸν ἐπὶ τοῦ κοιτῶνος τοῦ βασιλέως
  choice: onye na-elekọta ọnụ ụlọ eze
  rationale: Nke a na-egosi onye ọrụ ụlọ eze nwere ọrụ metụtara ọnụ ụlọ nzuzo eze, na-enweghị iji aha ọkwa ochie nke ọtụtụ ndị na-agụ Igbo agaghị aghọta.
- source_word: ᾐτοῦντο εἰρήνην
  choice: ha nọ na-arịọ ka e mee udo
  rationale: “Nọ na-arịọ” na-egosipụta omume na-aga n’ihu nke imperfect, ebe “ka e mee udo” na-enye echiche ndọrọ ndọrọ ọchịchị nke arịrịọ ahụ.
- source_word: διὰ τὸ τρέφεσθαι
  choice: n’ihi na ... na-enweta ihe oriri
  rationale: Ọ na-enye ihe kpatara arịrịọ ahụ ma kọwaa n'ụzọ ebumpụta ụwa na mpaghara ha dabere n’ebe ọzọ maka nri.
- source_word: αὐτῶν τὴν χώραν
  choice: ala ha
  rationale: χώρα nwere ike ịbụ ala, mpaghara, ma ọ bụ obodo; “ala ha” bụ okwu Igbo sara mbara nke dabara n’ebe a.
- source_word: ἀπὸ τῆς βασιλικῆς
  choice: site n’ala eze
  rationale: Adjective ahụ e ji dịka noun na-ezo aka n’ókèala ma ọ bụ ihe onwunwe eze; “ala eze” na-echekwa mkpụmkpụ na obere mgbagwoju anya nke Grik.
