translation_notes:
  register: E ji Standard Igbo nke oge a, nke nwere nsọpụrụ ma dị mfe nghọta. A hapụrụ njikọ “Ma” maka δὲ nke abụọ, ma a tinyeghị “Ugbu a” n’isi amaokwu ahụ. E mere ka akara ụkwụ [a], [b], na [c] pụta kpọmkwem n’ebe okwu ndị ha na-akọwa dị.
