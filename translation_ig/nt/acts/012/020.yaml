- from: Ọ were ndị Taịa na ndị Saịdọn oké iwe[a]. Ma ha niile jiri otu obi bịakwute ya. Mgbe ha ratachara Blastọs, onye na-elekọta ọnụ ụlọ eze[b], ha nọ na-arịọ ka e mee udo, n’ihi na ala ha na-enweta ihe oriri site n’ala eze[c].
  to: Ọ nọ n’oké iwe megide ndị Taịa na ndị Saịdọn[a]. Ma ha ji otu obi bịakwute ya. Mgbe ha mechara mee ka Blastọs, onye na-ahụ maka ọnụ ụlọ ndina eze[b], kwenye, ha nọ na-arịọ ka e mee udo, n’ihi na ala ha na-enweta ihe oriri site n’ala eze[c].
  rationale: The revision corrects an unidiomatic opening, restores the bedchamber specificity of κοιτών in the main text, and clarifies footnote c. It otherwise preserves the draft’s faithful handling of aspect, sequence, register, and the territorial sense of βασιλική.
