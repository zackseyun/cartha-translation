revisions:
- from: Mgbe ọ matara olu Pita, n’ihi ọṅụ ya, o meghereghị ọnụ ụzọ ámá ahụ[a], kama ọ gbara ọsọ banye n’ime ụlọ gwa ha na Pita guzo n’ihu ọnụ ụzọ ámá ahụ.[b]
  to: Mgbe ọ matara olu Pita, n’ihi ọṅụ ya o meghereghị ọnụ ụzọ ámá ahụ; kama, ọ gbara ọsọ banye kọọ na Pita guzo n’ihu ọnụ ụzọ ámá ahụ.[a]
  rationale: 'The revision removes the unsupported specifications “n’ime ụlọ” and “ha,” while preserving the source’s sequence: recognition of Peter’s voice, joy preventing her from opening the outer gate, her running in, and her report that Peter stood before it. The surviving note gives the useful lexical alternative for πυλών and is anchored directly to “ọnụ ụzọ ámá.”'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T09:18:25Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys Peter’s voice, joy as the cause, the failure to open the outer entrance, Peter’s standing before it, and the brisk inward movement. However, “n’ime ụlọ” adds a specific destination not stated by εἰσδραμοῦσα, and “gwa ha” adds explicit recipients absent from ἀπήγγειλεν.
  naturalness: The narrative is generally clear Standard Igbo. Recasting the final coordinated actions as “ọ gbara ọsọ banye kọọ na …” is more concise and avoids the added objects while retaining the natural narrative flow.
  terminology: “Olu Pita,” “ọṅụ,” “ọnụ ụzọ ámá,” and “guzo n’ihu” are suitable renderings. “Ọnụ ụzọ ámá” appropriately represents the outer gate/gateway (πυλών).
  issues:
  - severity: medium
    issue: “n’ime ụlọ” specifies a house as the destination.
    rationale: εἰσδραμοῦσα means that Rhoda ran in/inside; it does not identify the interior as a house. The property may be understood from context, but it should not be supplied in the translation.
  - severity: medium
    issue: “gwa ha” explicitly introduces recipients.
    rationale: ἀπήγγειλεν states that she reported it, while the persons addressed remain implicit. Igbo can retain that implicitness with “kọọ na …”.
  - severity: low
    issue: Footnote b is labeled as literal although its wording merely restates the main clause and does not provide a meaningful alternative.
    rationale: The Greek construction can be represented in an Igbo literal note as a report that Peter was standing before the gate; the note should be phrased consistently with the revised rendering.
  revised_text: Mgbe ọ matara olu Pita, n’ihi ọṅụ ya o meghereghị ọnụ ụzọ ámá ahụ; kama, ọ gbara ọsọ banye kọọ na Pita guzo n’ihu ọnụ ụzọ ámá ahụ.[a]
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “ọnụ ụzọ mpụta,” ya bụ, ụzọ e si n’okporo ámá abanye n’ogige ma ọ bụ n’ụlọ.
    reason: lexical_alternative
  revision_rationale: 'The revision removes the unsupported specifications “n’ime ụlọ” and “ha,” while preserving the source’s sequence: recognition of Peter’s voice, joy preventing her from opening the outer gate, her running in, and her report that Peter stood before it. The surviving note gives the useful lexical alternative for πυλών and is anchored directly to “ọnụ ụzọ ámá.”'
