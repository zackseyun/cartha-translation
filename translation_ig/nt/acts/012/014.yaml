source:
  edition: SBLGNT
  text: καὶ ἐπιγνοῦσα τὴν φωνὴν τοῦ Πέτρου ἀπὸ τῆς χαρᾶς οὐκ ἤνοιξεν τὸν πυλῶνα, εἰσδραμοῦσα δὲ ἀπήγγειλεν ἑστάναι τὸν Πέτρον πρὸ τοῦ πυλῶνος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/014.yaml
  text: And when she recognized Peter’s voice[a], because of her joy she did not open the gate[b], but ran in and reported that Peter was standing at the gate.
translation:
  language: ig
  text: Mgbe ọ matara olu Pita, n’ihi ọṅụ ya o meghereghị ọnụ ụzọ ámá ahụ; kama, ọ gbara ọsọ banye kọọ na Pita guzo n’ihu ọnụ ụzọ ámá ahụ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ọnụ ụzọ mpụta,” ya bụ, ụzọ e si n’okporo ámá abanye n’ogige ma ọ bụ n’ụlọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιγνοῦσα
  choice: mgbe ọ matara
  rationale: Nke a na-egosi na ọ ghọtara onye nwe olu ahụ ozugbo ọ nụrụ ya; usoro a bụ Igbo dị mfe ma na-edobe mmekọrịta oge nke participle ahụ.
- source_word: τὴν φωνὴν τοῦ Πέτρου
  choice: olu Pita
  rationale: “Olu” bụ okwu Igbo kwesịrị ekwesị maka ụda olu mmadụ a matara.
- source_word: ἀπὸ τῆς χαρᾶς
  choice: n’ihi ọṅụ ya
  rationale: Nkebiokwu ahụ na-egosi ihe kpatara o ji ghara imeghe ụzọ, ya bụ ọṅụ ya.
- source_word: οὐκ ἤνοιξεν
  choice: o meghereghị
  rationale: A tụgharịrị ἀνοίγω dịka “imeghe” n’enweghị ịgbakwụnye echiche nke ịkpọghe mkpọchi, nke adịghị n’isi mmalite.
- source_word: τὸν πυλῶνα / τοῦ πυλῶνος
  choice: ọnụ ụzọ ámá ahụ
  rationale: πυλών na-ezo aka n’ọnụ ụzọ mpụta e si n’okporo ámá abanye n’ogige ma ọ bụ n’ụlọ; “ọnụ ụzọ ámá” na-eme ka nke a doo anya n’Igbo.
- source_word: εἰσδραμοῦσα
  choice: ọ gbara ọsọ banye n’ime ụlọ
  rationale: Nke a na-edobe ngagharị ngwa ngwa banye n’ime; “ụlọ” na-eme ka ntụziaka ngagharị ahụ bụrụ nke doro anya n’Igbo, dịka ọnọdụ akụkọ ahụ si dị.
- source_word: ἀπήγγειλεν
  choice: gwa ha
  rationale: N’akụkọ Igbo, “gwa ha” na-ekwupụta omume nke izi ndị nọ n’ime ozi n’ụzọ eke, n’agbanyeghị na ihe e dere n’asụsụ Grik ekwughị “ha” kpọmkwem.
- source_word: ἑστάναι
  choice: guzo
  rationale: Perfect infinitive ahụ na-egosi ọnọdụ Pita nọgidere na ya; n’usoro Igbo a, “guzo” na-egosi ọnọdụ ahụ nke ọma.
- source_word: πρὸ τοῦ πυλῶνος
  choice: n’ihu ọnụ ụzọ ámá ahụ
  rationale: Nke a na-edobe kpọmkwem echiche πρό na genitive, ya bụ ịnọ n’ihu ma ọ bụ n’akụkụ mpụta nke ọnụ ụzọ ámá.
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta, dee ya. A họọrọ “ọnụ ụzọ ámá” iji kewapụ πυλών n’ọnụ ụzọ ụlọ nkịtị, ma debe ngwa ngwa na ihe ọchị dị n’akụkọ ahụ.
