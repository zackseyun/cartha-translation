source:
  edition: SBLGNT
  text: εἶπεν ⸀δὲ ὁ ἄγγελος πρὸς αὐτόν· ⸀Ζῶσαι καὶ ὑπόδησαι τὰ σανδάλιά σου· ἐποίησεν δὲ οὕτως. καὶ λέγει αὐτῷ· Περιβαλοῦ τὸ ἱμάτιόν σου καὶ ἀκολούθει μοι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/008.yaml
  text: And the angel said to him[a], “Tie on your belt and put on your sandals.” And he did so. And he says to him[c][b], “Put on your cloak and follow me.”
translation:
  language: ig
  text: Mmụọ ozi ahụ wee sị ya, “Kechie onwe gị[a], yirikwa sandalụ gị.” O wee mee otú ahụ. Ọ na-asịkwa ya[b], “Yirikwa uwe mwụda gị[c], soro m.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Kechie eriri úkwù gị.” Iwu Grik a na-ekwu maka ijikere site n'ikechi uwe n'úkwù.
    reason: lexical_alternative
  - marker: b
    text: N'asụsụ Grik, ọ bụ “ọ na-asị.” E ji oge ugbu a kọọ ihe mere n'oge gara aga iji mee ka akụkọ ahụ dị ndụ.
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “Tụkwasị uwe mwụda gị gburugburu ahụ gị.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄγγελος
  choice: Mmụọ ozi
  rationale: N'ọnọdụ akụkọ a, okwu ahụ na-ezo aka n'onye eluigwe pụtara n'ụlọ mkpọrọ; “mmụọ ozi” bụ okwu Igbo a na-ahụkarị maka onye dị otu a.
- source_word: Ζῶσαι
  choice: Kechie ihe okike gị n'úkwù
  rationale: Iwu a pụtara ijike ma ọ bụ kee ihe e ji ekekọta uwe n'úkwù iji dị njikere; nsụgharị a na-egosi omume ahụ n'ụzọ doro anya.
- source_word: ὑπόδησαι τὰ σανδάλιά σου
  choice: yirikwa akpụkpọ ụkwụ gị
  rationale: Ọ bụ iwu ka ọ yikwasị akpụkpọ ụkwụ ya; nke a bụ ụzọ Igbo dị mfe ma kwekọọ n'omume ahụ.
- source_word: ἐποίησεν δὲ οὕτως
  choice: O wee mee otú ahụ
  rationale: οὕτως na-achịkọta nrubeisi Pita nye iwu abụọ ahụ; okwu Igbo a dị nkenke ma bụrụ ihe e ji akọ akụkọ n'ụzọ eke.
- source_word: λέγει
  choice: Ọ na-asịkwa ya
  rationale: E ji oge ugbu a sụgharịa historical present nke Grik, iji chekwaa ịdị ndụ nke usoro akụkọ ahụ.
- source_word: Περιβαλοῦ τὸ ἱμάτιόν σου
  choice: Yirikwa uwe mwụda gị
  rationale: ἱμάτιον bụ uwe elu a na-eyikwasị n'elu uwe ndị ọzọ, ebe περιβάλλω na-egosi iyikwasị ya ma ọ bụ ịtụkwasị ya gburugburu ahụ.
- source_word: ἀκολούθει μοι
  choice: soro m
  rationale: Nke a na-echekwa ihe ἀκολουθέω pụtara kpọmkwem—iso onye ọzọ—ma dịkwa eke n'Igbo.
