translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E debere mgbanwe Grik site n'oge gara aga gaa n'oge ugbu a na “Ọ na-asịkwa,” ma tinye nkọwa n'ala peeji ka onye na-agụ ghọta usoro akụkọ ahụ.
