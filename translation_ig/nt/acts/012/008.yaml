revisions:
- from: Mmụọ ozi ahụ wee sị ya, “Kechie ihe okike gị n'úkwù[a], yirikwa akpụkpọ ụkwụ gị.” O wee mee otú ahụ. Ọ na-asịkwa ya[b], “Yirikwa uwe mwụda gị[c], soro m.”
  to: Mmụọ ozi ahụ wee sị ya, “Kechie onwe gị[a], yirikwa sandalụ gị.” O wee mee otú ahụ. Ọ na-asịkwa ya[b], “Yirikwa uwe mwụda gị[c], soro m.”
  rationale: The revision replaces the inaccurate, unnatural “ihe okike gị” with “Kechie onwe gị,” which renders the Greek imperative without inventing a dubious object. It uses “sandalụ” to reflect σανδάλια specifically, retains the Greek narrative present in “Ọ na-asịkwa,” and preserves the outer-garment sense of ἱμάτιον. Footnote anchors are placed in their natural textual order.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T09:18:21Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly identifies the angel, preserves the paired imperatives, Peter’s compliance, the historical present in λέγει, and the command to follow. However, “ihe okike gị” ordinarily means “your creation/created thing,” not a belt or a garment-fastening, and therefore substantially misrenders Ζῶσαι. “Akpụkpọ ụkwụ” is understandable but generic; “sandalụ” retains the specific footwear named in the Greek.
  naturalness: Most narrative phrasing is clear and suitably formal. “Kechie ihe okike gị n'úkwù” is not idiomatic Standard Igbo in this context. “Kechie onwe gị” is a natural established-style imperative for girding oneself, while the note can explain the readiness sense.
  terminology: “Mmụọ ozi,” “uwe mwụda,” and “soro m” are appropriate. Retain “uwe mwụda” for the outer garment/cloak, with an alternative note indicating wrapping it around oneself. “Sandalụ” is preferable to the nonspecific “akpụkpọ ụkwụ” here.
  issues:
  - severity: high
    issue: “ihe okike gị” misrenders Ζῶσαι.
    rationale: In Standard Igbo, “ihe okike” denotes a creation or created thing; it does not naturally denote a belt. This introduces an unintelligible and inaccurate object into the command.
  - severity: low
    issue: “akpụkpọ ụkwụ” is less specific than σανδάλια.
    rationale: The Greek explicitly refers to sandals. “Sandalụ” is clear modern Igbo and preserves that specificity.
  - severity: low
    issue: The historical-present and cloak footnote markers are ordered irregularly in the text.
    rationale: The prior [c][b] sequence is structurally valid but reader-unfriendly. Assigning [b] to λέγει and [c] to the cloak follows their order of occurrence.
  revised_text: Mmụọ ozi ahụ wee sị ya, “Kechie onwe gị[a], yirikwa sandalụ gị.” O wee mee otú ahụ. Ọ na-asịkwa ya[b], “Yirikwa uwe mwụda gị[c], soro m.”
  revised_footnotes:
