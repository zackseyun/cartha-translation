  variant: Standard Igbo
source:
  edition: SBLGNT
  text: παραχρῆμα δὲ ἐπάταξεν αὐτὸν ἄγγελος κυρίου ἀνθ’ ὧν οὐκ ἔδωκεν ⸀τὴν δόξαν τῷ θεῷ, καὶ γενόμενος σκωληκόβρωτος ἐξέψυξεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/023.yaml
  text: Immediately an angel of the Lord struck him[a], because he did not give the glory to God, and becoming worm-eaten[c][b], he died.
translation:
  language: ig
  text: Ozugbo ahụ, mmụọ ozi nke Onyenwe anyị tiri ya, n’ihi na o nyeghị Chineke otuto ahụ[a]. Ikpuru wee rie ya[b], ọ nwụrụ[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “o nyeghị Chineke otuto.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ikpuru riri ya.”
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “ọ kupụrụ ume ikpeazụ ya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: παραχρῆμα
  choice: Ozugbo ahụ
  rationale: Nke a na-egosi na ihe ahụ mere n’egbughị oge ma na-edobe ịdị mberede nke ikpe ahụ.
- source_word: ἐπάταξεν
  choice: tiri ya ihe
  rationale: Nhọrọ a na-egosi iti ma ọ bụ imerụ ahụ n’etinyeghị n’ime ngwaa ahụ na ọ nwụrụ ozugbo, ebe e kwuru ọnwụ ya n’ikpeazụ.
- source_word: ἄγγελος κυρίου
  choice: otu mmụọ ozi nke Onyenwe anyị
  rationale: ‘Otu’ na-egosi na aha Grik ahụ enweghị article, ebe ‘nke Onyenwe anyị’ na-edobe aha nsọ ahụ n’ụzọ a na-aghọta nke ọma n’Igbo.
- source_word: ἀνθ’ ὧν
  choice: n’ihi na
  rationale: Akpaokwu a na-ewebata ihe kpatara ikpe ahụ; ‘n’ihi na’ bụ ụzọ Igbo doro anya ma bụrụkwa nke ebumpụta ụwa.
- source_word: ἔδωκεν τὴν δόξαν τῷ θεῷ
  choice: nyeghị Chineke otuto ahụ
  rationale: ‘Otuto ahụ’ na-egosipụta article dị na Grik ma na-ezo aka n’otuto kwesịrị Chineke nke Herọd na-enyeghị ya.
- source_word: γενόμενος
  choice: O wee ghọọ
  rationale: Nke a na-edobe mmegharị gaa n’ọnọdụ ọhụrụ nke participle ahụ n’enweghị ịkọwa kpọmkwem oge ma ọ bụ usoro ahụike ihe ndị ahụ mere.
- source_word: σκωληκόβρωτος
  choice: onye ikpuru na-eri
  rationale: Nke a na-ebute onyonyo siri ike nke onye ikpuru na-eri, ma bụrụ okwu Igbo a na-aghọta karịa ntụgharị mkpụmkpụ nke nwere ike ịdị arọ.
- source_word: ἐξέψυξεν
  choice: ọ nwụrụ
  rationale: Nke a bụ ụzọ Igbo kachasị doo anya ma bụrụ nke ebumpụta ụwa isi kwuo na ume ndụ ya kwụsịrị.
theological_decisions:
- issue: Ụdị ikpe a kọwara
  choice: Amaokwu ahụ na-egosi ọnwụ Herọd dị ka ikpe Chineke nke otu mmụọ ozi nke Onyenwe anyị wetara, n’ihi na Herọd enyeghị Chineke otuto.
  alternative: Ịghọta ya naanị dị ka ọnwụ sitere n’ihe okike, ma ọ bụ ikwu na ọ nwụrụ kpọmkwem n’otu ntabi anya mmụọ ozi ahụ tiri ya.
  rationale: Ihe odide ahụ kpọrọ mmụọ ozi nke Onyenwe anyị aha ma kwuo ihe kpatara ikpe ahụ. Ma usoro ‘ọ wee ghọọ onye ikpuru na-eri, ọ nwụrụ’ anaghị enye anyị ikike ịgbakwunye nkọwa ahụike ma ọ bụ usoro oge kpọmkwem nke Luk ekwughị.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A hapụrụ ịdị mberede nke ikpe ahụ, onye mere ya, ihe kpatara ya, na usoro okwu Grik n’enweghị ịgbakwunye nkọwa ahụike ma ọ bụ ozizi ụka pụrụ iche.
