revisions:
- from: Ozugbo ahụ, otu mmụọ ozi nke Onyenwe anyị tiri ya ihe, n’ihi na o nyeghị Chineke otuto ahụ[a]. O wee ghọọ onye ikpuru na-eri[b], ọ nwụrụ[c].
  to: Ozugbo ahụ, mmụọ ozi nke Onyenwe anyị tiri ya, n’ihi na o nyeghị Chineke otuto ahụ[a]. Ikpuru wee rie ya[b], ọ nwụrụ[c].
  rationale: 'The revision corrects the reversed meaning of the worm-eaten expression while retaining the Greek’s non-medical, non-over-specified sequence: an angel struck him; worms consumed him; he died. It also uses more idiomatic Standard Igbo for the strike and the alternative expression for death, without importing doctrinal or medical interpretation.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T09:18:32Z'
review_pass:
  verdict: revise
  source_fidelity: 'The draft correctly retains the immediacy, the angelic agent, the causal clause, and the distinction between the striking and the subsequent death. However, “onye ikpuru na-eri” reverses the meaning: it describes a person who eats worms, whereas σκωληκόβρωτος describes Herod as being consumed by worms.'
  naturalness: “Tiri ya ihe” is understandable but less idiomatic and more expansive than needed here; “tiri ya” is natural. The revised wording for the worm-eaten condition is clear Standard Igbo and reads smoothly.
  terminology: “Mmụọ ozi nke Onyenwe anyị,” “Chineke,” and “otuto” are appropriate, dignified Standard Igbo biblical terms. The indefinite Greek noun is adequately represented without requiring “otu,” which can add unnecessary numerical emphasis in Igbo.
  issues:
  - severity: high
    issue: The phrase “onye ikpuru na-eri” assigns Herod the role of eating worms.
    rationale: The Greek σκωληκόβρωτος means ‘worm-eaten’/‘consumed by worms.’ The draft’s construction means ‘a person who eats worms,’ reversing the participant roles and thus the verse’s sense.
  - severity: medium
    issue: “Tiri ya ihe” is unnecessarily marked and less natural in this context.
    rationale: ἐπάταξεν can be rendered naturally as “tiri ya”; adding “ihe” is not required and can suggest a more general beating rather than the stated strike.
  - severity: low
    issue: Footnote c is not idiomatic Standard Igbo.
    rationale: “Ume ikpeazụ ya wee pụọ” is understandable but awkward. “Ọ kupụrụ ume ikpeazụ ya” is a more natural lexical alternative for ‘he breathed his last.’
  revised_text: Ozugbo ahụ, mmụọ ozi nke Onyenwe anyị tiri ya, n’ihi na o nyeghị Chineke otuto ahụ[a]. Ikpuru wee rie ya[b], ọ nwụrụ[c].
  revised_footnotes:
