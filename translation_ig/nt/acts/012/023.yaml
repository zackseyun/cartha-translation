    text: Ma ọ bụ, “o nyeghị Chineke otuto.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ikpuru riri ya.”
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “ọ kupụrụ ume ikpeazụ ya.”
    reason: lexical_alternative
  revision_rationale: 'The revision corrects the reversed meaning of the worm-eaten expression while retaining the Greek’s non-medical, non-over-specified sequence: an angel struck him; worms consumed him; he died. It also uses more idiomatic Standard Igbo for the strike and the alternative expression for death, without importing doctrinal or medical interpretation.'
