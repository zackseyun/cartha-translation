id: ACT.12.5
reference: Acts 12:5
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ μὲν οὖν Πέτρος ἐτηρεῖτο ἐν τῇ φυλακῇ· προσευχὴ δὲ ἦν ⸀ἐκτενῶς γινομένη ὑπὸ τῆς ἐκκλησίας πρὸς τὸν θεὸν ⸀περὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/005.yaml
  text: So Peter was being kept in the prison[a], but earnest prayer was being made to God by the church for him.
translation:
  language: ig
  text: Ya mere, a na-eche Pita nche n’ụlọ mkpọrọ; ma ọgbakọ ndị kwere ekwe nọ na-ekpegara Chineke ekpere nke ukwuu maka ya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “na-ekpegara Chineke ekpere n’ịnọgidesi ike.” Okwu Grik ahụ pụrụ igosi ịdị uchu ma ọ bụ ịnọgidesi ike n’ekpere.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐτηρεῖτο
  choice: a nọ na-eche ... nche
  rationale: Oge imperfect na passive na-egosi na nche ahụ gara n’ihu. Usoro Igbo a na-ekwupụta idobe onye n’okpuru nche n’ụzọ doro anya ma kwekọọ n’ọnọdụ ụlọ mkpọrọ.
- source_word: φυλακῇ
  choice: n’ụlọ mkpọrọ
  rationale: Nke a bụ okwu Igbo a na-ejikarị akọwa ebe a kpọchiri onye mkpọrọ, kwekọọkwa n’article dị n’asụsụ Grik nke na-arụtụ aka n’ụlọ mkpọrọ ahụ.
- source_word: προσευχὴ ... ἦν ... γινομένη
  choice: nọ na-ekpe ... ekpere
  rationale: Usoro 'nọ na-' na-echekwa omume na-aga n’ihu nke periphrastic imperfect Grik, ma bụrụkwa Igbo dị ndụ karịa ntụgharị passive siri ike.
- source_word: ἐκτενῶς
  choice: na-ekpesiri ... ike
  rationale: Nke a na-egosi ịdị uchu na ike e tinyere n’ekpere, ma hapụkwa ohere na okwu Grik ahụ pụrụ ịgụnye ekpere e ji ịnọgidesi ike na-ekpe.
- source_word: ὑπὸ τῆς ἐκκλησίας
  choice: nzukọ ndị kwere ekwe
  rationale: N’ebe a ἐκκλησία bụ obodo Ndị Kraịst na-ekpe ekpere. 'Nzukọ ndị kwere ekwe' na-enye nghọta ahụ n’Igbo nkịtị ma zere ime ka ọ bụrụ nanị ụlọ ụka ma ọ bụ otu denominashọn.
- source_word: πρὸς τὸν θεὸν
  choice: Chineke
  rationale: N’usoro Igbo 'ikpe Chineke ekpere' na-egosi onye a na-ekpegara ekpere n’ụzọ eke, n’agbanyeghị na a naghị atụgharị πρός iche.
- source_word: περὶ αὐτοῦ
  choice: maka ya
  rationale: N’ọnọdụ ekpere arịrịọ, nke a na-egosi na ha na-arịọ arịrịọ n’ihi Pita ma ọ bụ n’ọnọdụ ya.
- source_word: μὲν οὖν ... δὲ
  choice: Ya mere ... ma ...
  rationale: Nke a na-echekwa ọganihu akụkọ na ọdịiche dị n’etiti mkpọchi Pita na ekpere nzukọ ahụ, n’enweghị ntụgharị kpọrọ nkụ.
theological_decisions:
- issue: Ntughari ἐκκλησία
  choice: nzukọ ndị kwere ekwe
  alternative: ụka; ọgbakọ
  rationale: Okwu ahụ na-arụtụ aka n’obodo Ndị Kraịst na-ekpe ekpere maka Pita. Nhọrọ a doro onye Igbo nke oge a anya ma ọ naghị ebubata nghọta denominashọn ma ọ bụ mee ka okwu ahụ pụta naanị dịka ụlọ.
translation_notes:
  register: Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A haziri ahịrịokwu ahụ ka ọ bụrụ nke eke n’Igbo, ma e chekwara omume abụọ na-aga n’ihu na ọdịiche dị n’etiti ha.
