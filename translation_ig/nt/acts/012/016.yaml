id: ACT.12.16
reference: Acts 12:16
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ δὲ Πέτρος ἐπέμενεν κρούων· ἀνοίξαντες δὲ εἶδαν αὐτὸν καὶ ἐξέστησαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/016.yaml
  text: But Peter kept on knocking[a], and when they opened the door[b], they saw him and were astonished.
translation:
  language: ig
  text: Ma Pita nọgidere na-akụ aka n’ọnụ ụzọ[a]. Mgbe ha meghere ya[b], ha hụrụ ya, o wee ju ha anya nke ukwuu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “gara n’ihu na-akụ aka” ma ọ bụ “kwụsịghị ịkụ aka.”
    reason: lexical_alternative
  - marker: b
    text: N’okwu nkịtị, “mgbe ha meghere, ha hụrụ ya, o wee ju ha anya.” Okwu Grik ahụ akpọghị “ọnụ ụzọ” aha n’ebe a.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέμενεν
  choice: nọgidere
  rationale: Oge imperfect na-egosi omume gara n’ihu; “nọgidere” na-enye echiche ahụ n’Igbo dị mfe ma kwekọọ na nkebi participle so ya.
- source_word: κρούων
  choice: na-akụ aka n’ọnụ ụzọ
  rationale: N’ọnọdụ a, κρούω pụtara ịkụ aka n’ọnụ ụzọ. Ịkpọ “ọnụ ụzọ” aha na-eme ka okwu ahụ doo anya n’Igbo, dịka ihe gbara amaokwu ahụ gburugburu si gosi.
- source_word: ἀνοίξαντες
  choice: Mgbe ha meghere ya
  rationale: A sụgharịrị aorist participle ahụ dị ka nkebi oge iji gosi usoro ihe mere n’Igbo sitere n’okike. “Ya” na-ezo aka n’ọnụ ụzọ e kwuru kpọmkwem n’ahịrị bu ụzọ.
- source_word: εἶδαν αὐτόν
  choice: ha hụrụ ya
  rationale: Nke a bụ ntụgharị kwụ ọtọ nke okwu ahụ n’akụkọ, na-enweghị itinye nkọwa ọzọ.
- source_word: ἐξέστησαν
  choice: o wee ju ha anya nke ukwuu
  rationale: Okwu a na-egosi oke iju anya. “Nke ukwuu” na-echekwa ike okwu Grik ahụ n’Igbo nke oge a.
- source_word: δὲ
  choice: Ma
  rationale: δὲ nke mbụ na-egosi ọdịiche dị n’etiti Pita nọgidere na-akụ aka na ihe ndị ọzọ nọ n’ụlọ mere tupu nke a; δὲ nke abụọ abanyela n’usoro ahịrịokwu Igbo site na “Mgbe… wee.”
- source_word: Πέτρος
  choice: Pita
  rationale: “Pita” bụ ụdị aha a na-ejikarị eme ihe n’Igbo.
theological_decisions: []
translation_notes:
  register: Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. E ji “ịkụ aka n’ọnụ ụzọ” mee ka omume ahụ bụrụ nke sitere n’okike n’Igbo, ma e debere nkọwa okwu nkịtị n’ala peeji.
