id: ACT.12.10
reference: Acts 12:10
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: διελθόντες δὲ πρώτην φυλακὴν καὶ δευτέραν ἦλθαν ἐπὶ τὴν πύλην τὴν σιδηρᾶν τὴν φέρουσαν εἰς τὴν πόλιν, ἥτις αὐτομάτη ἠνοίγη αὐτοῖς, καὶ ἐξελθόντες προῆλθον ῥύμην μίαν, καὶ εὐθέως ἀπέστη ὁ ἄγγελος ἀπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/010.yaml
  text: After they had passed the first guard and the second[a], they came to the iron gate leading into the city, which opened to them by itself; and after they went out, they went along one street[b], and immediately the angel departed from him.
translation:
  language: ig
  text: Mgbe ha gafesịrị ebe nche nke mbụ na nke abụọ, ha rutere n’ọnụ ụzọ ámá ígwè nke na-eduba n’ime obodo. Ọnụ ụzọ ahụ meghere n’onwe ya nye ha[a]. Mgbe ha pụtara, ha gara n’ihu otu okporo ámá[b], ozugbo ahụ mmụọ ozi ahụ wee hapụ ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ya bụ, ọ meghere nye ha na-enweghị onye meghere ya.
    reason: lexical_alternative
  - marker: b
    text: O yikarịrị ka “otu okporo ámá” pụtara na ha gara ogologo otu okporo ámá tupu mmụọ ozi ahụ ahapụ ya.
    reason: cultural_note
lexical_decisions:
- source_word: διελθόντες
  choice: Mgbe ha gafesịrị
  rationale: Nkebiokwu a na-egosi na ha buru ụzọ gafee ebe nche tupu ha erute n’ọnụ ụzọ ámá; ụdị a na-eme ka usoro ihe mere doo anya n’Igbo.
- source_word: φυλακὴν ... πρώτην ... καὶ δευτέραν
  choice: ebe nche nke mbụ na nke abụọ
  rationale: N’ọnọdụ a, okwu ahụ na-ezo aka n’ebe ndị nche nọ ma ọ bụ ebe a na-eche nche, ọ bụghị n’ụlọ mkpọrọ abụọ dị iche iche.
- source_word: πύλην τὴν σιδηρᾶν
  choice: ọnụ ụzọ ámá ígwè
  rationale: Nke a na-egosi kpọmkwem na ígwè ka e ji mee ọnụ ụzọ ámá ahụ, n’asụsụ Igbo dị mfe ma bụrụkwa nke kwesịrị ekwesị.
- source_word: τὴν φέρουσαν εἰς τὴν πόλιν
  choice: nke na-eduba n’ime obodo
  rationale: Nkebiokwu a na-akọwa ebe ọnụ ụzọ ámá ahụ na-enye ụzọ ịbanye.
- source_word: αὐτομάτη
  choice: n’onwe ya
  rationale: Nke a na-egosi na ọnụ ụzọ ahụ meghere na-enweghị onye meghere ya, ma ọ naghị etinye echiche nke igwe ọgbara ọhụrụ na-eme ihe n’onwe ya.
- source_word: ῥύμην μίαν
  choice: otu okporo ámá
  rationale: ῥύμη nwere ike ịpụta okporo ámá ma ọ bụ ụzọ nta; n’ebe a, accusative ahụ yikarịrị ka ọ na-egosi ogologo ebe ha gara.
- source_word: εὐθέως
  choice: ozugbo ahụ
  rationale: Ọ na-echekwa ọsọ nke usoro akụkọ ahụ n’Igbo a na-asụ ugbu a.
- source_word: ἀπέστη ὁ ἄγγελος ἀπ’ αὐτοῦ
  choice: mmụọ ozi ahụ wee si n’ebe ọ nọ pụọ
  rationale: Nke a na-egosi na mmụọ ozi ahụ kewapụrụ onwe ya n’ebe Pita nọ, ma na-edebe nnọchiaha nke isi mmalite kama itinye aha Pita n’ahịrịokwu ahụ.
theological_decisions:
- issue: Ụzọ ọnụ ụzọ ámá ahụ si meghee
  choice: Ọnụ ụzọ ahụ meghere n’onwe ya nye ha
  alternative: Ọnụ ụzọ ahụ meghere nye ha na-enweghị onye meghere ya
  rationale: Isi mmalite na-akọ ihe ịtụnanya ahụ n’enweghị nkọwa banyere otú o si mee. Nsụgharị a anaghị atụgharị ya ka ọ bụrụ usoro igwe ma ọ bụ tinye nkọwa ọzọ n’ime ya.
- issue: Ihe φυλακή na-ezo aka na ya
  choice: ebe nche nke mbụ na nke abụọ
  alternative: ndị nche nke mbụ na nke abụọ
  rationale: Akụkọ ahụ na-egosi na ha gafere ebe nche abụọ n’ụzọ ha si n’ụlọ mkpọrọ pụta. ‘Ebe nche’ na-egosipụta nke a nke ọma ma ghara ikwu na e nwere ụlọ mkpọrọ abụọ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta, dee ya. A họọrọ ‘ọnụ ụzọ ámá’ maka πύλη, ‘ebe nche’ maka φυλακή n’ọnọdụ akụkọ a, ma zere okwu nwere ike ime ka αὐτομάτη daa ka teknụzụ ọgbara ọhụrụ.
