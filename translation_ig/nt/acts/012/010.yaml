revisions:
- from: Mgbe ha gafesịrị ebe nche nke mbụ na nke abụọ, ha rutere n’ọnụ ụzọ ámá ígwè nke na-eduba n’ime obodo. Ọnụ ụzọ ahụ meghere n’onwe ya nye ha[a]. Mgbe ha pụtara, ha gara n’ihu otu okporo ámá[b], ozugbo ahụ mmụọ ozi ahụ wee si n’ebe ọ nọ pụọ.
  to: Mgbe ha gafesịrị ebe nche nke mbụ na nke abụọ, ha rutere n’ọnụ ụzọ ámá ígwè nke na-eduba n’ime obodo. Ọnụ ụzọ ahụ meghere n’onwe ya nye ha[a]. Mgbe ha pụtara, ha gara n’ihu otu okporo ámá[b], ozugbo ahụ mmụọ ozi ahụ wee hapụ ya.
  rationale: The revision corrects the final clause so that the angel departs from the singular person indicated by the Greek, rather than merely leaving a place. It preserves the source’s unnamed pronoun and all other narrative details. Footnote b is lightly smoothed without altering its interpretive restraint.
