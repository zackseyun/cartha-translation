    issue: The form “nọdụkwa” carries an additive sense (‘also sat down’).
    rationale: καί coordinates the participial actions but does not specifically mark the sitting as additional in contrast to another action. “Wee nọdụ” expresses the intended sequence naturally.
  - severity: low
    issue: Footnote b’s wording “oche gọọmenti” and “n’oche ọchịchị dị elu” is less precise and less idiomatic for βῆμα.
    rationale: βῆμα commonly denotes an official judgment seat or a raised platform/dais; it need not be a government chair. The revision states these alternatives more clearly while preserving ambiguity.
