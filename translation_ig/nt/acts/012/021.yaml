  text: τακτῇ δὲ ἡμέρᾳ ὁ Ἡρῴδης ἐνδυσάμενος ἐσθῆτα βασιλικὴν ⸀καὶ καθίσας ἐπὶ τοῦ βήματος ἐδημηγόρει πρὸς αὐτούς·
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/021.yaml
  text: On an appointed day[a], Herod, having put on royal clothing and having sat down on the tribunal[b], was delivering a public address to them.
translation:
  language: ig
  text: N’ụbọchị a kara aka, Herọd yi uwe eze[a], wee nọdụ n’elu ikpo okwu ọchịchị[b], wee na-agwa ha okwu n’ihu ọha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ejiji eze.” Okwu Grik ahụ nwekwara ike ịpụta uwe ma ọ bụ ejiji mara mma n’ozuzu ya.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “oche ikpe” ma ọ bụ “ebe dị elu.” Okwu Grik βῆμα na-apụtakarị oche onye ọchịchị na-anọ ma ọ bụ ikpo okwu dị elu.
    reason: lexical_alternative
lexical_decisions:
- source_word: τακτῇ ... ἡμέρᾳ
  choice: N’ụbọchị a kara aka
  rationale: Nkebiokwu a na-egosi ụbọchị e doziri ma ọ bụ họpụta tupu oge eruo. “A kara aka” bụ ụzọ Igbo doro anya ma bụrụkwa nke e ji ekwu ihe e doziri tupu oge ya.
- source_word: ἐνδυσάμενος
  choice: yi
  rationale: Nke a na-egosi na Herọd buru ụzọ yikwasị uwe ahụ. N’Igbo, “yi uwe” na-enye echiche ahụ n'ụzọ dị nkenke ma bụrụkwa eke.
- source_word: ἐσθῆτα βασιλικὴν
  choice: uwe eze
  rationale: ἐσθής nwere ike ịpụta uwe ma ọ bụ ejiji n’ozuzu ya; “uwe eze” na-egosi ejiji ọchịchị n’etinyeghị nkọwa na ọ bụ ọtụtụ rọb kpọmkwem.
- source_word: καθίσας
  choice: nọdụkwa
  rationale: Aorist participle a na-egosi ihe Herọd mere tupu o kwuo okwu. “Nọdụkwa” na-edobe usoro omume ndị ahụ n’Igbo dị mfe ma dị mma.
- source_word: ἐπὶ τοῦ βήματος
  choice: n’elu ikpo okwu ọchịchị
  rationale: βῆμα nwere ike ịbụ ebe dị elu e ji arụ ọrụ ọchịchị ma ọ bụ oche ikpe. N’ebe a, “ikpo okwu ọchịchị” na-echekwa ọdịdị ọhaneze na nke ọchịchị n’amanyeghị echiche na ikpe na-aga n’ihu.
- source_word: ἐδημηγόρει
  choice: wee na-agwa ha okwu n’ihu ọha
  rationale: δημηγορέω pụtara ịgwa ọgbakọ okwu n’ihu ọha. “Na-agwa” na-egosikwa omume na-aga n’ihu nke imperfect ahụ.
- source_word: πρὸς αὐτούς
  choice: ha
  rationale: Nnochiaha a na-egosi ndị Herọd na-agwa okwu; itinye “ha” n’ime “na-agwa ha okwu” bụ usoro Igbo kacha eke.
theological_decisions: []
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E debere usoro omume Herọd na ọdịdị okwu ọhaneze ahụ, ma a hapụrụ obosara ihe βῆμα nwere ike ịpụta site n’isiokwu ukwu na nkọwa ala peeji.
