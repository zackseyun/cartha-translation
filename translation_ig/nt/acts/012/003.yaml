id: ACT.12.3
reference: Acts 12:3
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸂ἰδὼν δὲ⸃ ὅτι ἀρεστόν ἐστιν τοῖς Ἰουδαίοις προσέθετο συλλαβεῖν καὶ Πέτρον (ἦσαν ⸀δὲ ἡμέραι τῶν ἀζύμων),
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/003.yaml
  text: And when he saw that it was pleasing to the Jews[a], he proceeded to arrest Peter also[b]. (Now these were the days of Unleavened Bread.)
translation:
  language: ig
  text: Mgbe ọ hụrụ na ihe ahụ masịrị ndị Juu[a], ọ gara n’ihu jidekwa Pita. (Ọ bụkwa n’oge Ememme Achịcha Na-ekoghị Eko[b].)
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “ndị Judia,” ma ọ bụ, ma e were ihe gbara ya gburugburu mee ka ihe ọ na-ekwu dị warara, “ndị isi ndị Juu.” Okwu Grik ahụ nwere ike ịpụta ihe ndị a n’ọnọdụ ụfọdụ, ma n’ebe a ederede ahụ kwuru naanị “ndị Juu.”
    reason: lexical_alternative
  - marker: b
    text: Ya bụ, oge ememme na-esochi Ngabiga, mgbe a na-eri achịcha na-ekoghị eko.
    reason: cultural_note
lexical_decisions:
- source_word: ἰδὼν δὲ
  choice: Mgbe ọ hụrụ
  rationale: Aorist participle ahụ na-egosi na Herọd buru ụzọ hụ otú ndị mmadụ si nabata ihe o mere tupu o mee ihe ọzọ. ‘Mgbe ọ hụrụ’ na-egosipụta usoro a n’Igbo dị mfe ma doo anya.
- source_word: ἀρεστόν ἐστιν
  choice: nke a dị ... mma
  rationale: Nkebiokwu a pụtara na ihe ahụ masịrị ha ma ọ bụ na ha nabatara ya. ‘Dị ... mma’ bụ ụzọ Igbo sitere n’okike si kwuo ya ma na-echekwa ọdịdị okwu ahụ na-adịghị akpọ ihe masịrị ha aha ọzọ.
- source_word: τοῖς Ἰουδαίοις
  choice: ndị Juu
  rationale: Okwu Grik ahụ kwuru kpọmkwem ‘ndị Juu.’ Ọ bụ ezie na ihe gbara amaokwu ahụ gburugburu nwere ike ime ka e chee karị banyere ndị Juu nọ na Judia ma ọ bụ ndị ndú ha, ederede ahụ n’onwe ya akọwaghị ya otú ahụ.
- source_word: προσέθετο
  choice: ọ gara n’ihu
  rationale: Mgbe προστίθημι sochiri infinitive, ọ nwere ike ịpụta ịga n’ihu ime ihe ọzọ. Nsụgharị a na-egosipụta na Herọd tinyere njide Pita n’ihe o mewororị n’akụkọ ahụ.
- source_word: συλλαβεῖν
  choice: jide
  rationale: N’ebe a συλλαμβάνω pụtara ijide mmadụ ma kpọchie ya n’okpuru ikike ọchịchị. ‘Jide’ bụ okwu Igbo doro anya n’ọnọdụ akụkọ a.
- source_word: καὶ Πέτρον
  choice: jidekwa Pita
  rationale: 'Mgbakwụnye ‘-kwa’ na-egosipụta καί: Pita ghọkwara onye ọzọ Herọd jidere, dị ka Jemis e kwuru okwu ya n’amaokwu gara aga.'
- source_word: ἦσαν δὲ ἡμέραι τῶν ἀζύμων
  choice: Ọ bụkwa n’oge Ememme Achịcha Na-ekoghị Eko
  rationale: Nkebiokwu a na-enye oge ihe ahụ mere. A hapụrụ aha ememme ahụ kpọmkwem kama ịgbanwe ya ka ọ bụrụ Ngabiga, n’ihi na Grik kpọrọ ụbọchị Achịcha Na-ekoghị Eko aha.
theological_decisions:
- issue: Otú e si sụgharịa Ἰουδαίοις n’Ọrụ Ndị Ozi
  choice: ndị Juu
  alternative: ndị Judia; ndị isi ndị Juu
  rationale: A họọrọ ihe okwu Grik ahụ na-ekwukarị n’ihi na amaokwu ahụ akọwaghị na ọ bụ naanị ndị Judia ma ọ bụ ndị isi ndị Juu. Ihe odide ala peeji na-echekwa nghọta ndị ọzọ okwu ahụ nwere ike inwe n’ọnọdụ ụfọdụ.
- issue: Otú e si sụgharịa τῶν ἀζύμων
  choice: Ememme Achịcha Na-ekoghị Eko
  alternative: Ngabiga
  rationale: Grik kpọrọ oge Achịcha Na-ekoghị Eko aha kpọmkwem, ọ bụghị naanị Ngabiga. Idebe aha a na-egbochi ijikọta ememme abụọ nwere njikọ chiri anya ka ha bụrụ otu ihe n’enweghị ihe ederede kwuru.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. A na-akpọ ememme ahụ ‘Ememme Achịcha Na-ekoghị Eko’ iji dobe aha omenala ndị Juu nke Grik ji mee ihe. E tinyere ihe odide a n’ime akara mkpọchi dịka nkọwa oge nke onye dere akụkọ ahụ.
