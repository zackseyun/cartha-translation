  to: N’ihe dị ka oge ahụ[a], Eze Herọd bịakwasịrị ụfọdụ n’ime ndị ọgbakọ ahụ aka[b], ka o wee mesoo ha ihe ọjọọ[c].
  rationale: The revised wording preserves the Greek ambiguity of the idiom ‘laid hands on’ while the following purpose clause clarifies the intended mistreatment. It improves idiomatic Igbo and identifies the affected people as part of the Christian community, without adding a technical notion of persecution or arrest.
