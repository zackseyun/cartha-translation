  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Κατ’ ἐκεῖνον δὲ τὸν καιρὸν ἐπέβαλεν Ἡρῴδης ὁ βασιλεὺς τὰς χεῖρας κακῶσαί τινας τῶν ἀπὸ τῆς ἐκκλησίας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/001.yaml
  text: About that time Herod the king laid hands on some from the church to mistreat them[a][b][c].
translation:
  language: ig
  text: N’ihe dị ka oge ahụ[a], Eze Herọd bịakwasịrị ụfọdụ n’ime ndị ọgbakọ ahụ aka[b], ka o wee mesoo ha ihe ọjọọ[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “N’oge ahụ” ma ọ bụ “N’akụkụ oge ahụ.”
    reason: lexical_alternative
  - marker: b
    text: N’ụzọ nkịtị, “bịakwasịrị ... aka.” N’ebe a, okwu a na-egosi na o mere ihe megide ụfọdụ n’ime ndị ọgbakọ ahụ.
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “ka o wee merụọ ha ahụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Κατ’ ἐκεῖνον δὲ τὸν καιρόν
  choice: N’ihe dị ka oge ahụ
  rationale: 'Nkebi a na-egosi oge n’ụzọ na-abụghị kpọmkwem: ‘n’ihe dị ka oge ahụ.’ A hapụrụ δέ ka usoro akụkọ na ọnọdụ gbara amaokwu ahụ gburugburu gosi njikọ ya, kama ịtinye okwu mgbanwe na-adịghị mkpa.'
- source_word: ἐπέβαλεν ... τὰς χεῖρας
  choice: bịakwasịrị ... aka
  rationale: Nke a na-edobe ihe oyiyi dị n’okwu Grik, ma ebumnuche ọjọọ ya na-apụta ìhè site n’okwu na-esochi ya. Ọ dị obosara karịa ‘jidere,’ nke nwere ike ime ka ihe a pụtara bụrụ naanị njide.
- source_word: Ἡρῴδης ὁ βασιλεύς
  choice: Eze Herọd
  rationale: Nke a bụ usoro aha eze a na-asụ n’Igbo nke ọma, ma ọ na-edobe ma aha ya ma ọkwa ya.
- source_word: κακῶσαί
  choice: ka o wee mesoo ha mmeso ọjọọ
  rationale: Nke a na-egosi ime mmadụ ihe ọjọọ ma ọ bụ imeso ya omume ọjọọ, n’etinyeghị echiche pụrụ iche nke mkpagbu okpukpe nke ngwaa ahụ n’onwe ya na-amanyeghị.
- source_word: τινας τῶν ἀπὸ τῆς ἐκκλησίας
  choice: ụfọdụ ndị nọ n’ọgbakọ ahụ
  rationale: Nkebi a na-akọwa ụfọdụ ndị so n’obodo ndị Kraịst ahụ. ‘Ndị nọ n’ọgbakọ ahụ’ bụ okwu Igbo doro anya ma dị mfe nghọta.
theological_decisions:
- issue: Nsụgharị ἐκκλησία
  choice: ọgbakọ
  alternative: ụka; nzukọ
  rationale: N’ebe a okwu ahụ na-ezo aka n’obodo ndị Kraịst, ọ bụghị ụlọ. ‘Ọgbakọ’ na-egosipụta obodo ahụ n’ụzọ doro anya ma zere ime ka ọ bụrụ aha otu ụka pụrụ iche.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ugwu ma dị mfe nghọta. A hapụrụ ihe oyiyi nke ‘ịbịakwasị mmadụ aka,’ ma nkebi ebumnuche mere ka o doo anya na ọ bụ omume iro, ọ bụghị ịgọzi ma ọ bụ ichi mmadụ echichi.
