  text: οἱ δὲ πρὸς αὐτὴν εἶπαν· Μαίνῃ. ἡ δὲ διϊσχυρίζετο οὕτως ἔχειν. οἱ δὲ ἔλεγον· Ὁ ἄγγελός ⸂ἐστιν αὐτοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/015.yaml
  text: But they said to her[a], “You are out of your mind.” But she kept insisting that it was so. And they kept saying, “It is his angel.”
translation:
  language: ig
  text: Ma ha sịrị ya[a], “Ara na-agba gị.” Ma ọ nọgidere na-ekwusi ike na ọ dị otu ahụ. Ha nọgidekwara na-ekwu, “Ọ bụ mmụọ ozi ya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma eleghị anya, “mmụọ ozi na-eche ya nche,” “mmụọ ozi na-anọchite anya ya,” ma ọ bụ, dịka ụfọdụ ndị nkọwa si kwuo, “mmụọ ya” ma ọ bụ “mmụọ onye nwụrụ anwụ.” Grik kwuru naanị, “mmụọ ozi ya.”
    reason: alternative_reading
lexical_decisions:
- source_word: Μαίνῃ
  choice: Isi adịghị gị mma
  rationale: Nke a bụ ụzọ Igbo nkịtị si ekwu na mmadụ anaghị eche echiche nke ọma ma ọ bụ na ara na-agba ya; ọ na-egosipụta ike nke ebubo ahụ n’enweghị okwu ahụike siri ike.
- source_word: διϊσχυρίζετο
  choice: ọ nọgidere na-ekwusi ike
  rationale: Oge imperfect na ike ngwaa ahụ na-egosi na ọ gara n’ihu na-ekwusi okwu ya ike.
- source_word: οὕτως ἔχειν
  choice: na ọ bụ eziokwu
  rationale: Nke a na-enye echiche akpaalaokwu ahụ—na ihe o kwuru dị otú ahụ n’ezie—n’Igbo dị mfe ma bụrụ nke e ji eme ihe ugbu a.
- source_word: ἔλεγον
  choice: Ha onwe ha nọgidekwara na-asị
  rationale: Imperfect ahụ na-egosi okwu ha gara n’ihu ma ọ bụ nke ha kwuru ugboro ugboro; “nọgidekwara na-asị” na-echekwa nke a.
- source_word: ἄγγελός
  choice: mmụọ ozi
  rationale: N’ọnọdụ a, okwu ahụ yiri ka ọ na-ezo aka n’otu ihe e kere eke nke eluigwe, ọ bụghị naanị onye ozi mmadụ; “mmụọ ozi” bụ okwu Igbo a na-ejikarị eme ihe.
- source_word: αὐτοῦ
  choice: ya
  rationale: Nnọchiaha genitive ahụ na-egosi ihe metụtara Pita; “mmụọ ozi ya” bụ usoro Igbo eke nke na-ahapụghị nkọwa mmekọrịta ahụ ka ọ bụrụ otu ozizi kpọmkwem.
theological_decisions:
- issue: Ihe “mmụọ ozi ya” pụtara
  choice: A sụgharịrị ya ozugbo dịka “mmụọ ozi ya,” n’enweghị mgbakwunye nkọwa n’ahịrịokwu ahụ.
  alternative: “mmụọ ozi na-eche ya nche,” “mmụọ ozi nọchiri anya ya,” ma ọ bụ, dịka ụfọdụ si akọwa, “mmụọ/ụjọ ya.”
  rationale: Grik kwuru naanị ὁ ἄγγελος αὐτοῦ, ya bụ, “mmụọ ozi ya,” ma ọ kọwaghị nkwenkwe ndị kwuru okwu ahụ. Ịhapụ ya otú ahụ na-echekwa mgbagwoju anya na esemokwu nkà mmụta okpukpe kama ịhọrọ otu nkọwa.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke oge a, dị ùgwù ma dị mfe nghọta. E jiri “Isi adịghị gị mma” mee ka ebubo ara ahụ bụrụ nke eke n’Igbo; a chekwara omume na-aga n’ihu nke ngwaa imperfect site na “nọgidere.” Akara nkọwa ala peeji [a] dị n’ahịrịokwu bụ isi.
