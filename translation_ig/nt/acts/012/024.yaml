id: ACT.12.24
reference: Acts 12:24
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ὁ δὲ λόγος τοῦ ⸀θεοῦ ηὔξανεν καὶ ἐπληθύνετο.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/024.yaml
  text: But the word of God continued to grow and multiply[a].
translation:
  language: ig
  text: Ma okwu Chineke nọ na-eto ma na-amụbakwa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ịsụgharị ya: “Ma ozi Chineke nọ na-eto ma na-amụbakwa.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: λόγος
  choice: okwu
  rationale: “Okwu Chineke” na-echekwa akpaokwu Luk ji eme ihe ugboro ugboro, ma n’ebe a ọ pụtara ozi Chineke a na-ekwusa.
- source_word: τοῦ θεοῦ
  choice: Chineke
  rationale: 'E ji usoro “okwu Chineke” gosipụta genitive ahụ n’Igbo n''ụzọ ebumpụta ụwa: okwu ahụ sitere n’aka Chineke ma bụrụ nke ya.'
- source_word: ηὔξανεν
  choice: nọ na-eto
  rationale: Ụdị imperfect na-egosi omume gara n’ihu; “nọ na-eto” na-egosipụta uto ahụ na-aga n’ihu.
- source_word: ἐπληθύνετο
  choice: na-agbasakwa
  rationale: N’ọnọdụ a, ngwaa ahụ na-egosi na okwu ahụ na-erute ọtụtụ mmadụ ma na-agbasa ebe niile. Nke a na-edobe ọdịiche ya na “na-eto” ma na-eme ka Igbo bụrụ nke mmadụ na-aghọta nke ọma.
- source_word: δὲ
  choice: Ma
  rationale: “Ma” na-egosi ntụgharị nwere ọdịiche n’etiti ọnwụ Herọd n’akụkọ bu ụzọ na mgbasawanye okwu Chineke.
theological_decisions:
- issue: Ma a ga-asụgharị “okwu Chineke” n’ụzọ nkọwa karịa dịka “ozi Chineke”
  choice: okwu Chineke
  alternative: ozi Chineke
  rationale: “Okwu Chineke” na-echekwa usoro okwu Luk na njikọ ya na ebe ndị ọzọ, ebe ihe odide ala peeji na-eme ka nghọta “ozi” doo anya n’enweghị imechi obosara λόγος.
translation_notes:
  register: Igbo Izugbe nke oge a, dị mfe ma nwee ugwu. E jiri “na-agbasa” mee ka ihe ἐπληθύνετο pụtara n’ọnọdụ mgbasa ozi ọma doo anya, ebe “okwu Chineke” na-echekwa akpaokwu Akwụkwọ Nsọ a maara nke ọma.
