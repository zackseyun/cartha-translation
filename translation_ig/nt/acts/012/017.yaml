id: ACT.12.17
reference: Acts 12:17
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: κατασείσας δὲ αὐτοῖς τῇ χειρὶ σιγᾶν διηγήσατο αὐτοῖς πῶς ὁ κύριος αὐτὸν ἐξήγαγεν ἐκ τῆς φυλακῆς, εἶπέν ⸀τε· Ἀπαγγείλατε Ἰακώβῳ καὶ τοῖς ἀδελφοῖς ταῦτα. καὶ ἐξελθὼν ἐπορεύθη εἰς ἕτερον τόπον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/017.yaml
  text: But motioning to them with his hand to be silent[a], he explained to them how the Lord had brought him out of the prison. And he said, “Report these things to James and to the brothers.” Then he departed and went to another place.
translation:
  language: ig
  text: Ma o ji aka ya gosi ha ka ha nọrọ jụụ, wee kọọrọ ha otú Onyenwe anyị si kpọpụta ya n’ụlọ mkpọrọ. O wee sị, “Gwanụ Jemis na ụmụnna[a] ihe ndị a.” Mgbe ahụ, o si ebe ahụ pụọ gaa ebe ọzọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ụmụnna nwoke na ụmụnna nwanyị.” Okwu Grik ahụ kwuru “ụmụnna”; dịka ọnọdụ si dị, ọ pụrụ ịgụnye obodo ndị kwere ekwe n’ozuzu, ma ndị nwoke ma ndị nwanyị.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατασείσας ... τῇ χειρὶ σιγᾶν
  choice: o ji aka ya gosi ha ka ha nọrọ jụụ
  rationale: Nke a na-egosipụta mmegharị aka e mere iji mee ka ndị nọ ebe ahụ daa jụụ, n’Igbo dị mfe ma kwekọọ n’ebumnuche okwu Grik.
- source_word: διηγήσατο
  choice: kọọrọ ha
  rationale: Okwu a pụtara ịkọ ma ọ bụ ịkọwa ihe mere; “kọọrọ ha” dabara n’akụkọ Pita banyere nnapụta ya.
- source_word: πῶς
  choice: otú ... si
  rationale: Usoro Igbo a na-ewebata ụzọ ihe ahụ si mee n’enweghị ịgbanwe ya ka ọ bụrụ nanị nkwupụta na ihe mere.
- source_word: ὁ κύριος
  choice: Onyenwe anyị
  rationale: Nke a bụ ntụgharị Igbo a na-ejikarị maka κύριος dịka utu aha Chineke, ma ọ naghị ekpebi kpọmkwem ma ebe a ọ na-ezo aka na Jizọs ma ọ bụ Chineke n’ozuzu.
- source_word: ἐξήγαγεν ἐκ τῆς φυλακῆς
  choice: kpọpụta ya n’ụlọ mkpọrọ
  rationale: “Kpọpụta” na-edobe echiche nke idupụta ma ọ bụ iwepụta mmadụ, ebe “ụlọ mkpọrọ” na-akọwa ebe e ji ya.
- source_word: Ἀπαγγείλατε
  choice: Gwanụ
  rationale: Iwu a bụ ka ha zie ozi ahụ; “Gwanụ” bụ okwu Igbo nkịtị, kpọmkwem, ma dị ùgwù.
- source_word: Ἰακώβῳ
  choice: Jemis
  rationale: A họọrọ ụdị aha a maara nke ọma n’ọdịnala Agba Ọhụrụ Igbo maka onye a kpọrọ Ἰάκωβος/Ἰακώβ.
- source_word: τοῖς ἀδελφοῖς
  choice: ụmụnna
  rationale: “Ụmụnna” na-edobe okwu mmekọrịta ezinụlọ nke Grik ma nwee ike ịrụ ọrụ maka ụmụ nwoke kpọmkwem ma ọ bụ obodo ndị kwere ekwe dịka ọnọdụ si dị.
- source_word: ἐξελθὼν ἐπορεύθη εἰς ἕτερον τόπον
  choice: ọ pụrụ gaa ebe ọzọ
  rationale: Nke a na-edobe ma ọpụpụ ya ma njem ya gaa ebe a na-akọwaghị, n’usoro Igbo na-adịghị arọ.
theological_decisions:
- issue: Onye ὁ κύριος na-ezo aka na ya
  choice: Onyenwe anyị
  alternative: Onyenwe anyị Jizọs kpọmkwem; ma ọ bụ Chineke n’ozuzu
  rationale: Ederede Grik akpọghị onye ahụ aha ọzọ. Ịsụgharị ya “Onyenwe anyị” na-edobe utu aha ahụ na mgbagwoju anya ziri ezi banyere onye ọ na-ezo aka na ya.
- issue: Oke ndị τοῖς ἀδελφοῖς gụnyere
  choice: ụmụnna, tinyere nkọwa ala peeji
  alternative: ụmụnna nwoke kpọmkwem; ma ọ bụ ndị kwere ekwe niile, ndị nwoke na ndị nwanyị
  rationale: Ọtụtụ nwoke dị na Grik nwere ike ịpụta ụmụ nwoke ma ọ bụ obodo ndị kwere ekwe n’ozuzu dịka ọnọdụ si dị; isi ederede na nkọwa ala peeji na-echekwa ohere abụọ ahụ.
translation_notes:
  register: Igbo ọkọlọtọ, nke oge a ma dị ùgwù. Ahịrịokwu ahụ na-eji okwu ndị nkịtị ndị na-agụ akwụkwọ ga-aghọta ngwa ngwa, ma na-edobe usoro akụkọ, iwu Pita, na enweghị nkọwa kpọmkwem banyere ebe ọzọ ahụ.
