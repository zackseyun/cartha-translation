  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ὅτε δὲ ἤμελλεν ⸂προαγαγεῖν αὐτὸν⸃ ὁ Ἡρῴδης, τῇ νυκτὶ ἐκείνῃ ἦν ὁ Πέτρος κοιμώμενος μεταξὺ δύο στρατιωτῶν δεδεμένος ἁλύσεσιν δυσίν, φύλακές τε πρὸ τῆς θύρας ἐτήρουν τὴν φυλακήν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/006.yaml
  text: When Herod was about to bring him out[a], on that very night Peter was sleeping between two soldiers, bound with two chains[b], and guards before the door were keeping watch over the prison.
translation:
  language: ig
  text: Mgbe Herọd fọrọ nke nta ka ọ kpọpụta ya[a], n'abalị ahụ, Pita nọ na-ehi ụra n'etiti ndị agha abụọ, e jiri agbụ abụọ kee ya; ndị nche nọkwa n'ihu ọnụ ụzọ na-eche ụlọ mkpọrọ ahụ nche.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “ịkpọga ya n'ihu.” Ngwaa Grik ahụ nwere ike ịpụta ịkpọpụta mmadụ ka ọ pụta n'ihu ọha ma ọ bụ ka e kpee ya ikpe.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤμελλεν
  choice: na-achọ
  rationale: N'ọnọdụ a, ọ na-egosi ihe Herọd na-achọ ime nke dị nso imezu; njikọ ya na ahịrịokwu oge na-eme ka ịdị nso ahụ doo anya n'Igbo.
- source_word: προαγαγεῖν αὐτόν
  choice: ịkpọpụta ya
  rationale: Ọ na-egosi ịkpọpụta Pita site n'ụlọ mkpọrọ ka e mee ka ọ pụta n'ihu ọha ma ọ bụ n'ikpe, n'emeghị ka otu nzube ahụ bụrụ naanị nke a ga-ekwe omume.
- source_word: τῇ νυκτὶ ἐκείνῃ
  choice: n'abalị ahụ
  rationale: Nnọchiaha ngosi ahụ na-akọwapụta abalị ahụ kpọmkwem; okwu a bụ Igbo nkịtị ma doo anya.
- source_word: κοιμώμενος
  choice: nọ na-ehi ụra
  rationale: Ọ na-egosipụta omume ihi ụra nke nọ na-aga n'oge ahụ.
- source_word: μεταξὺ δύο στρατιωτῶν
  choice: n'etiti ndị agha abụọ
  rationale: Nke a na-edobe ọnọdụ Pita n'ụzọ doro anya ma bụrụ okwu Igbo e ji eme ihe.
- source_word: δεδεμένος ἁλύσεσιν δυσίν
  choice: e jiri agbụ ígwè abụọ kee ya
  rationale: Ọ na-egosi ọnọdụ nke ịbụ onye e kechara nakwa ihe e ji kee ya; 'agbụ ígwè' na-eme ka ụdị agbụ ụlọ mkpọrọ ahụ doo anya.
- source_word: φύλακες
  choice: ndị nche
  rationale: Nke a bụ okwu Igbo doro anya maka ndị na-eche ụlọ mkpọrọ nche.
- source_word: πρὸ τῆς θύρας
  choice: n'ihu ọnụ ụzọ
  rationale: Ọ na-edobe ihe πρό na-egosi gbasara ọnọdụ ha n'ihu ọnụ ụzọ.
- source_word: ἐτήρουν τὴν φυλακήν
  choice: na-eche ụlọ mkpọrọ ahụ nche
  rationale: N'ọnọdụ a, φυλακή na-ezo aka n'ụlọ mkpọrọ, ebe τηρέω na-egosi ilekọta ma ọ bụ iche ya nche.
