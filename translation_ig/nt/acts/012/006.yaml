review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys Peter’s sleep, position between two soldiers, restraint by two chains, and the guards stationed before the door guarding the prison. However, “na-achọ ịkpọpụta” can primarily suggest that Herod was seeking or trying to bring Peter out, rather than that the action was imminent. Also, “agbụ ígwè” specifies iron, which the Greek ἁλύσεις does not explicitly state.
  naturalness: The sentence is generally clear and idiomatic Standard Igbo. “Fọrọ nke nta ka ọ kpọpụta” gives a natural expression of imminent action in this context.
  terminology: “Ndị agha,” “ndị nche,” “ụlọ mkpọrọ,” and “kee ya” are suitable, clear terms. “Agbụ abụọ” retains the source term without adding an unwarranted material specification. The name “Herọd” and “Pita” are appropriate established Igbo biblical forms.
  issues:
  - severity: medium
    issue: “na-achọ ịkpọpụta” weakens the imminence of ἤμελλεν.
    rationale: It may mean “was trying/seeking to bring out,” whereas the Greek indicates that Herod was on the point of doing so.
  - severity: low
    issue: “agbụ ígwè abụọ” adds “iron.”
    rationale: Although prison chains would ordinarily be metal, the Greek says only “two chains”; the added material is unnecessary and slightly more specific than the source.
  revised_text: Mgbe Herọd fọrọ nke nta ka ọ kpọpụta ya[a], n'abalị ahụ, Pita nọ na-ehi ụra n'etiti ndị agha abụọ, e jiri agbụ abụọ kee ya; ndị nche nọkwa n'ihu ọnụ ụzọ na-eche ụlọ mkpọrọ ahụ nche.
  revised_footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “ịkpọga ya n'ihu.” Ngwaa Grik ahụ nwere ike ịpụta ịkpọpụta mmadụ ka ọ pụta n'ihu ọha ma ọ bụ ka e kpee ya ikpe.
    reason: lexical_alternative
  revision_rationale: The revision replaces a potentially intentional/attemptive expression with an idiomatic expression of imminence, and removes the unsupported specification that the chains were iron. A semicolon more clearly separates the guards’ concurrent duty while preserving the source’s coordination. The existing footnote is retained and remains correctly anchored to the verb phrase.
