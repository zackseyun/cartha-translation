  to: Mgbe Herọd fọrọ nke nta ka ọ kpọpụta ya[a], n'abalị ahụ, Pita nọ na-ehi ụra n'etiti ndị agha abụọ, e jiri agbụ abụọ kee ya; ndị nche nọkwa n'ihu ọnụ ụzọ na-eche ụlọ mkpọrọ ahụ nche.
