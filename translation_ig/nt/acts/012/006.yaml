translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta. E tinyere akara ala ala peeji [a] ozugbo n'akụkụ okwu metụtara ya. Etinyeghị [b], n'ihi na n'English consultation layer akara ahụ yiri ka ọ nọ n'akụkụ 'two chains' ebe ihe odide ala peeji ya metụtara ἐτήρουν τὴν φυλακήν; kama ịmepụta akara na-eduhie eduhie, e depụtara nkebi ahịrịokwu ahụ n'ụzọ doro anya n'ahịrị bụ isi.
