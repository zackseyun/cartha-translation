source:
  edition: SBLGNT
  text: Βαρναβᾶς δὲ καὶ Σαῦλος ὑπέστρεψαν, ⸀εἰς Ἰερουσαλὴμ πληρώσαντες τὴν διακονίαν, ⸀συμπαραλαβόντες Ἰωάννην τὸν ἐπικληθέντα Μᾶρκον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/025.yaml
  text: But Barnabas and Saul returned to Jerusalem after completing the ministry, taking along John, who was called Mark.
translation:
  language: ig
  text: Ma Banabas na Sọl laghachiri na Jeruselem[a] mgbe ha rụchara ozi ahụ, kpọọrọ Jọn, onye a na-akpọ Mak, soro ha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ụfọdụ ihe odide na-agụ, “laghachiri site na Jeruselem,” kama “laghachiri na Jeruselem.”
    reason: textual_variant
lexical_decisions:
- source_word: ὑπέστρεψαν
  choice: laghachiri
  rationale: Okwu a na-egosi ịlaghachi ma ọ bụ ịga azụ; “laghachiri” bụ okwu Igbo doro anya ma dịkwa nkenke.
- source_word: εἰς Ἰερουσαλήμ
  choice: Jeruselem
  rationale: εἰς na-egosikarị ebe a na-aga, ya mere ahịrịokwu ahụ pụtara na ha laghachiri Jeruselem. A kọwara ọdịiche dị n’ihe odide ụfọdụ n’ala peeji.
- source_word: πληρώσαντες τὴν διακονίαν
  choice: mgbe ha rụchara ozi ahụ
  rationale: Nke a na-egosi na ha mezuru ozi e nyere ha; nsụgharị a bụ nke a na-aghọta ngwa ngwa ma na-edobe echiche nke ịrụcha ọrụ ije ozi.
- source_word: διακονίαν
  choice: ozi ahụ
  rationale: διακονία nwere ike ịbụ ije ozi, ọrụ enyemaka, ma ọ bụ ozi e nyere mmadụ. “Ozi ahụ” na-edobe obosara okwu Grik n’enweghị ịkọwa ya kpọmkwem dị ka ozi enyemaka.
- source_word: συμπαραλαβόντες
  choice: kpọrọkwa ... ka o soro ha
  rationale: Nkebiokwu a na-egosi na ha kpọọrọ Jọn ka ọ gaa soro ha; nke a bụ ụzọ Igbo dị ndụ na nke doro anya isi kwuo ya.
- source_word: ἐπικληθέντα Μᾶρκον
  choice: onye a na-akpọ Mak
  rationale: Passive nke ἐπικαλέω ebe a pụtara onye a na-akpọ ma ọ bụ onye e nyere aha; nsụgharị a anaghị etinye okwu “ọzọ” nke na-adịghị n’aha Grik ahụ.
theological_decisions:
- issue: Ọdịiche ihe odide banyere ebe ha laghachiri
  choice: laghachiri Jeruselem
  alternative: si Jeruselem laghachi
  rationale: Ihe odide SBLGNT e nyere nwere εἰς Ἰερουσαλήμ, nke pụtara “Jeruselem” dị ka ebe ha na-aga. Ebe ụfọdụ ihe odide nwere ἐξ Ἰερουσαλήμ, e debere nke ahụ n’ala peeji kama iji ọnọdụ akụkọ gbanwee ihe odide a họpụtara.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “Rụchara ozi ahụ” na “kpọrọkwa ... ka o soro ha” na-eme ka ahịrịokwu ahụ bụrụ Igbo ebumpụta ụwa, ebe e chekwara ọdịiche dị mkpa nke ihe odide n’ala peeji.
