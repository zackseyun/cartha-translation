- from: Ma Banabas na Sọl laghachiri Jeruselem[a] mgbe ha rụchara ozi ahụ, kpọrọkwa Jọn, onye a na-akpọ Mak, ka o soro ha.
  to: Ma Banabas na Sọl laghachiri na Jeruselem[a] mgbe ha rụchara ozi ahụ, kpọọrọ Jọn, onye a na-akpọ Mak, soro ha.
  rationale: The revision retains the supplied Greek text’s destination, “to Jerusalem,” while expressing it idiomatically in Standard Igbo with “na Jeruselem.” It also revises the textual-variant note so that the alternative “from Jerusalem” is complete, clear, and accurately contrasted with the adopted reading. No interpretive resolution of the variant has been introduced.
