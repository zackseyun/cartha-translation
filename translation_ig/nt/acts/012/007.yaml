revisions:
- from: Ma lee[a], otu mmụọ ozi nke Onyenwe anyị bịara guzo n'akụkụ Pita, ìhè wee nwupụta n'ime ọnụ ụlọ mkpọrọ ahụ.[b] Ọ kụrụ Pita n'akụkụ ahụ ya, kpọtee ya, sị, “Bilie ọsọ ọsọ!” Agbụ ndị ahụ wee dapụ n'aka ya.
  to: Ma, lee[a], otu mmụọ ozi nke Onyenwe anyị bịara guzo n'akụkụ Pita[c], ìhè wee nwupụta n'ime ọnụ ụlọ mkpọrọ ahụ.[b] Ọ kụrụ Pita n'akụkụ, kpọtee ya, sị, “Bilie ọsọ ọsọ!” Agbụ ndị ahụ wee dapụ n'aka ya.
  rationale: The revision removes the redundant “ahụ ya” while preserving the physical force of πατάξας. It also separates the notes for οἰκήματι and ἐπέστη and places each at its relevant expression. No theological or interpretive expansion has been introduced.
