review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the angel's sudden presence beside Peter, the light in the prison room, the blow to Peter's side that woke him, the urgent command, and the chains falling from his hands. The rendering of ἐπέστη as “bịara guzo n'akụkụ” is a defensible optimal-equivalence choice, provided its sudden-presence nuance is retained in a properly anchored note.
  naturalness: Most of the verse is clear Standard Igbo. “n'akụkụ ahụ ya” is redundant and less idiomatic than “n'akụkụ.” The coordinated wording “Ọ kụrụ Pita n'akụkụ, kpọtee ya” is direct and natural.
  terminology: “mmụọ ozi nke Onyenwe anyị” and “Onyenwe anyị” are appropriate, established Standard Igbo renderings. “ọnụ ụlọ mkpọrọ” appropriately reflects οἴκημα in this narrative context without treating the lexical sense as intrinsically limited to a prison cell.
  issues:
  - severity: low
    issue: Redundant expression in the phrase for striking Peter's side
    rationale: “Ọ kụrụ Pita n'akụkụ ahụ ya” repeats the possessive sense already supplied by “Pita” and is less idiomatic. Greek simply says that the angel struck Peter's side.
  - severity: medium
    issue: The note on ἐπέστη is attached to the room/cell anchor
    rationale: The existing [b] note discusses both οἰκήματι and ἐπέστη, but [b] is placed after “ọnụ ụlọ mkpọrọ ahụ.” A separate anchor after the phrase rendering ἐπέστη lets each lexical note correspond to its source expression.
  revised_text: Ma, lee[a], otu mmụọ ozi nke Onyenwe anyị bịara guzo n'akụkụ Pita[c], ìhè wee nwupụta n'ime ọnụ ụlọ mkpọrọ ahụ.[b] Ọ kụrụ Pita n'akụkụ, kpọtee ya, sị, “Bilie ọsọ ọsọ!” Agbụ ndị ahụ wee dapụ n'aka ya.
