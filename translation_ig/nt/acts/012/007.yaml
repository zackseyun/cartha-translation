id: ACT.12.7
reference: Acts 12:7
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ ἄγγελος κυρίου ἐπέστη, καὶ φῶς ἔλαμψεν ἐν τῷ οἰκήματι· πατάξας δὲ τὴν πλευρὰν τοῦ Πέτρου ἤγειρεν αὐτὸν λέγων· Ἀνάστα ἐν τάχει· καὶ ἐξέπεσαν αὐτοῦ αἱ ἁλύσεις ἐκ τῶν χειρῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/007.yaml
  text: And behold[a], an angel of the Lord stood near, and a light shone in the cell. Striking Peter on the side, he woke him, saying[b], “Get up quickly.” And his chains fell off from his hands.
translation:
  language: ig
  text: Ma, lee[a], otu mmụọ ozi nke Onyenwe anyị bịara guzo n'akụkụ Pita[c], ìhè wee nwupụta n'ime ọnụ ụlọ mkpọrọ ahụ.[b] Ọ kụrụ Pita n'akụkụ, kpọtee ya, sị, “Bilie ọsọ ọsọ!” Agbụ ndị ahụ wee dapụ n'aka ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “Ma hụkwa.” Okwu Grik a na-adọta uche n'ihe na-esote.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, “ọnụ ụlọ” ma ọ bụ “ụlọ.” Okwu Grik ahụ sara mbara, ma “ọnụ ụlọ mkpọrọ” dabara n'ọnọdụ akụkọ a.
    reason: lexical_alternative
  - marker: c
    text: A pụkwara ịsụgharị ya, “guzoro nso,” “guzoro n'akụkụ,” ma ọ bụ “pụtara na mberede.” Ngwaa Grik ahụ pụrụ igosi ịnọ nso nakwa ọbịbịa ma ọ bụ mpụta na mberede.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: Ma lee
  rationale: Na-edobe ike okwu ahụ nke na-adọta uche ma na-eme ka akụkọ ahụ dị ndụ, n'Igbo dị ugbu a ma dịkwa ùgwù.
- source_word: ἄγγελος κυρίου
  choice: otu mmụọ ozi nke Onyenwe anyị
  rationale: Na-egosi onye ozi sitere n'aka Onyenwe anyị ma ọ bụ nke ya, n'enweghị itinye nkọwa okpukpe ọzọ.
- source_word: ἐπέστη
  choice: bịara guzo n'akụkụ Pita
  rationale: Na-ejikọta echiche nke ọbịbịa mberede na iguzo nso; ihe odide ala peeji na-edobe ụzọ ndị ọzọ e si aghọta ngwaa ahụ.
- source_word: φῶς ἔλαμψεν
  choice: ìhè wee nwupụta
  rationale: Nsụgharị doro anya nke na-egosi ìhè malitere ịcha n'ebe ahụ.
- source_word: ἐν τῷ οἰκήματι
  choice: n'ime ọnụ ụlọ mkpọrọ ahụ
  rationale: οἴκημα bụ okwu sara mbara maka ọnụ ụlọ ma ọ bụ ebe obibi, ma ọnọdụ akụkọ a na-egosi na ọ bụ ọnụ ụlọ dị n'ụlọ mkpọrọ.
- source_word: πατάξας τὴν πλευρὰν
  choice: Ọ kụrụ Pita n'akụkụ ahụ ya
  rationale: Na-edobe ike nkịtị nke πατάσσω karịa okwu dị nro dịka imetụ aka, ma na-asụkwa Igbo n'ụzọ ebumpụta ụwa.
- source_word: ἤγειρεν αὐτόν
  choice: kpọtee ya
  rationale: N'ọnọdụ a, ἐγείρω pụtara ịkpọte Pita n'ụra, ọ bụghị nanị ibuli ya elu.
- source_word: Ἀνάστα ἐν τάχει
  choice: Bilie ọsọ ọsọ!
  rationale: Iwu dị mkpirikpi, nke doro anya, na-egosikwa ngwa ngwa dị na okwu Grik.
- source_word: ἐξέπεσαν αὐτοῦ αἱ ἁλύσεις ἐκ τῶν χειρῶν
  choice: Agbụ ndị ahụ wee dapụ n'aka ya
  rationale: Na-edobe ihe oyiyi Grik nke agbụ ndị ahụ dapụrụ site n'aka Pita, n'agbanyeghị na n'ọnọdụ ahụ ọ pụrụ ịbụ n'akụkụ nkwụji aka.
theological_decisions:
- issue: Nsụgharị κύριος n'okwu ἄγγελος κυρίου
  choice: Onyenwe anyị
  alternative: Nna ukwu
  rationale: “Onyenwe anyị” bụ ụzọ Igbo a na-ahụkarị ma dị ùgwù isi sụgharịa κύριος n'ọnọdụ Agba Ọhụrụ a, n'etinyeghị nkọwa ụka pụrụ iche.
translation_notes:
  register: E jiri Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ “Ma lee” iji chekwaa ụdị akụkọ Luk nke na-adọta uche; e zere okwu ochie gabiga ókè. Akara [a] na [b] dị n'ahụ ederede ma kwekọọ na ihe odide ala peeji.
