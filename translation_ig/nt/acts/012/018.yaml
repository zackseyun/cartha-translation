  text: Γενομένης δὲ ἡμέρας ἦν τάραχος οὐκ ὀλίγος ἐν τοῖς στρατιώταις, τί ἄρα ὁ Πέτρος ἐγένετο.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/018.yaml
  text: When day came[a], there was no small disturbance among the soldiers over what had become of Peter.
translation:
  language: ig
  text: Mgbe chi bọrọ, nnukwu ọgba aghara[a] bilitere n’etiti ndị agha banyere ihe mere Pita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'N’ụzọ okwu Grik ahụ si dị kpọmkwem: “ọgba aghara na-adịghị nta.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Γενομένης δὲ ἡμέρας
  choice: Mgbe chi bọrọ
  rationale: Nkebiokwu a na-egosi oge ihe mere. “Mgbe chi bọrọ” bụ ụzọ Igbo nkịtị si ekwu na ụbọchị abịala, ebe δέ na-eme ka akụkọ gafee n’ihe sochirinụ n’enweghị mkpa itinye okwu ọzọ n’isi ahịrịokwu.
- source_word: τάραχος οὐκ ὀλίγος
  choice: nnukwu ọgba aghara
  rationale: οὐκ ὀλίγος bụ okwu e ji ịgọnahụ ihe nta akọwa na ihe ahụ dị ukwuu. “Nnukwu ọgba aghara” na-enye ihe ọ pụtara n’Igbo doro anya; ihe odide ala peeji chekwara usoro okwu ahụ kpọmkwem.
- source_word: ἐν τοῖς στρατιώταις
  choice: n’etiti ndị agha
  rationale: στρατιώταις pụtara ndị agha, ebe ἐν ebe a na-egosi ìgwè mmadụ ọgba aghara ahụ dị n’etiti ha. A họrọghị “ndị nche” n’ihi na nke ahụ ga-abụ nkọwa sitere n’ọnọdụ akụkọ karịa ihe okwu Grik ahụ pụtara kpọmkwem.
- source_word: τί ἄρα
  choice: banyere ihe
  rationale: Okwu ndị a na-ebute ajụjụ na-apụtaghị ìhè ma na-egosi mgbagwoju anya ha nwere. “Banyere ihe” jikọtara ajụjụ ahụ na ọgba aghara ahụ n’ụzọ dị mma n’Igbo.
- source_word: ὁ Πέτρος
  choice: Pita
  rationale: E ji ụdị aha a maara nke ọma n’Igbo dee aha onye ahụ.
- source_word: ἐγένετο
  choice: mere Pita
  rationale: N’usoro τί ... ἐγένετο mgbe a na-ekwu banyere mmadụ, ihe ọ pụtara bụ “ihe mere ya” ma ọ bụ “ebe ọ nọzi,” ọ bụghị na onye ahụ ghọrọ ihe ọzọ. “Ihe mere Pita” na-egosipụta okwu ahụ nke ọma ma na-ahapụ mgbagwoju anya ndị agha ahụ ka ọ dị.
theological_decisions: []
translation_notes:
  register: E ji asụsụ Igbo Izugbe dị ugbu a, nke dị mfe ma nwee ugwu, sụgharịa amaokwu ahụ. A họọrọ “nnukwu ọgba aghara” maka ịdị mfe nghọta, ebe ihe odide ala peeji chekwara atụmatụ ikwu ihe n’ụzọ ịgọnahụ “obere” dị n’asụsụ Grik.
