  text: κρούσαντος δὲ ⸀αὐτοῦ τὴν θύραν τοῦ πυλῶνος προσῆλθε παιδίσκη ὑπακοῦσαι ὀνόματι Ῥόδη,
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/013.yaml
  text: When he knocked at the door of the gateway[a], a servant girl named Rhoda came to answer.
translation:
  language: ig
  text: Mgbe ọ kụrụ aka n’ọnụ ụzọ ámá, otu nwa agbọghọ bụ odibo, aha ya bụ Roda, bịara ịza ọnụ ụzọ ahụ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κρούσαντος δὲ αὐτοῦ
  choice: Mgbe ọ kụrụ aka
  rationale: Aorist participle ahụ na δέ na-egosi ihe sochiri n’usoro akụkọ; ‘Mgbe ọ kụrụ aka’ bụ Igbo nkịtị nke na-echekwa echiche oge ahụ.
- source_word: θύραν τοῦ πυλῶνος
  choice: n’ọnụ ụzọ nke ọnụ ụlọ mbata
  rationale: A sụgharịrị θύρα dị ka ‘ọnụ ụzọ,’ ebe πυλών bụ ebe mbata nwere ọnụ ụzọ ma ọ bụ ụlọ ọnụ ụzọ; nsụgharị a na-echekwa aha abụọ ahụ ma na-egosi na ọ bụ mbata dị n’èzí.
- source_word: προσῆλθε
  choice: bịara
  rationale: N’ọnọdụ akụkọ a, ‘bịara’ bụ okwu Igbo dị mfe ma kwekọọ na mmegharị mmadụ bịara nso n’ọnụ ụzọ.
- source_word: παιδίσκη
  choice: otu nwa agbọghọ na-eje ozi
  rationale: παιδίσκη nwere ike ịpụta nwa agbọghọ bụ ohu ma ọ bụ onye na-eje ozi n’ụlọ. Okwu a bụ nke doro anya n’Igbo, ebe e debere ihe ọzọ ọ pụrụ ịpụta n’ala ala peeji.
- source_word: ὑπακοῦσαι
  choice: ịza oku ahụ
  rationale: Ọ bụ ezie na ὑπακούω nwere ike ịpụta ịnụ ma ọ bụ irube isi, n’ọnọdụ ịkụ aka n’ọnụ ụzọ ọ pụtara ịbịa zaa onye nọ n’ọnụ ụzọ. ‘Ịza oku ahụ’ na-eme ka echiche ọnọdụ ahụ doo anya n’Igbo.
- source_word: ὀνόματι Ῥόδη
  choice: aha ya bụ Roda
  rationale: Dative ὀνόματι na-ewebata aha onye ahụ. ‘Aha ya bụ Roda’ bụ ụzọ Igbo nkịtị isi kwuo ya; e dere aha Grik Ῥόδη n’ụdị Igbo dị mfe.
theological_decisions: []
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji ‘ọnụ ụlọ mbata’ gosi πυλών n’enweghị ime ya naanị ‘ọnụ ụzọ ámá,’ ma e chekwara mgbagwoju anya gbasara ọnọdụ παιδίσκη site n’ala ala peeji.
