revisions:
- from: Mgbe ahụ Pita matara onwe ya[a], ọ sịrị, “Ugbu a, amaara m n’ezie na Onyenwe anyị zitere mmụọ ozi ya, napụtakwa m n’aka Herọd[b] na n’ihe niile ndị Juu nọ na-atụ anya ya[c].”
  to: Mgbe Pita matara onwe ya[a], ọ sịrị, “Ugbu a, amaara m n’ezie na Onyenwe anyị zitere mmụọ ozi ya, napụtakwa m n’aka Herọd[b] na n’atụmanya niile nke ndị Juu[c].”
  rationale: The revision removes the added “Mgbe ahụ” and restores a close, natural rendering of πάσης τῆς προσδοκίας τοῦ λαοῦ τῶν Ἰουδαίων as “n’atụmanya niile nke ndị Juu.” This preserves the source’s deliberately unelaborated sense of the anticipated outcome while maintaining clear Standard Igbo. Footnote c now supplies the more explicit alternative without introducing an ambiguous pronoun.
