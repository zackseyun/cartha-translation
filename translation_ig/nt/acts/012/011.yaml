id: ACT.12.11
reference: Acts 12:11
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ὁ Πέτρος ⸂ἐν ἑαυτῷ γενόμενος⸃ εἶπεν· Νῦν οἶδα ἀληθῶς ὅτι ἐξαπέστειλεν ⸀ὁ κύριος τὸν ἄγγελον αὐτοῦ καὶ ἐξείλατό με ἐκ χειρὸς Ἡρῴδου καὶ πάσης τῆς προσδοκίας τοῦ λαοῦ τῶν Ἰουδαίων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/011.yaml
  text: And Peter[a], coming to himself, said[c][b], “Now I truly know that the Lord sent his angel and rescued me from Herod’s hand and from all the expectation of the people of the Jews.”
translation:
  language: ig
  text: Mgbe Pita matara onwe ya[a], ọ sịrị, “Ugbu a, amaara m n’ezie na Onyenwe anyị zitere mmụọ ozi ya, napụtakwa m n’aka Herọd[b] na n’atụmanya niile nke ndị Juu[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “mgbe uche ya lọghachiri,” ma ọ bụ “mgbe ọ nwetaghachiri onwe ya.”
    reason: lexical_alternative
  - marker: b
    text: Okwu a bụ “n’aka Herọd” pụtara ịnapụta ya n’ike ma ọ bụ n’okpuru ọchịchị Herọd.
    reason: cultural_note
  - marker: c
    text: Ma ọ bụ, “n’ihe niile ndị Juu nọ na-atụ anya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἑαυτῷ γενόμενος
  choice: matara onwe ya
  rationale: Nkebi okwu a na-egosi na uche Pita lọghachiri nke ọma mgbe ihe ahụ yiri ọhụụ gasịrị. ‘Matara onwe ya’ na-edobe oyiyi dị n’asụsụ Grik, ebe nkọwa ala peeji na-enye ụzọ doro anya karị.
- source_word: ἀληθῶς
  choice: n’ezie
  rationale: Nke a na-egosi nkwenye siri ike Pita nwere ugbu a, ma bụrụkwa okwu Igbo nkịtị ma dị ùgwù.
- source_word: ἐξαπέστειλεν
  choice: zitere
  rationale: ‘Zitere’ na-egosipụta iziga ahụ nke ọma n’enweghị ịgbakwunye echiche na-adịghị mkpa.
- source_word: κύριος
  choice: Onyenwe anyị
  rationale: Nke a bụ ntụgharị Igbo a na-ahụkarị maka κύριος ma ọ naghị ekpebi kpọmkwem ma ebe a ọ na-ezo aka na Chineke ka ọ bụ Jizọs bilitere n’ọnwụ.
- source_word: ἄγγελον
  choice: mmụọ ozi
  rationale: N’akụkọ a, okwu ahụ na-ezo aka n’onye ozi si n’eluigwe, ya mere ‘mmụọ ozi’ dabara karịa ‘onye ozi’ nkịtị.
- source_word: ἐξείλατό με
  choice: napụtakwa m
  rationale: Ngwaa a pụtara ịzọpụta mmadụ n’ihe ize ndụ ma ọ bụ n’aka onye nwere ya n’ike; ‘napụtakwa m’ bụ Igbo doro anya ma kwekọọ n’ọnọdụ a.
- source_word: ἐκ χειρὸς Ἡρῴδου
  choice: n’aka Herọd
  rationale: ‘N’aka’ na-edobe oyiyi nke aka dị na Grik, ma n’Igbo ọ na-egosikwa ịbụ n’ike ma ọ bụ n’okpuru ọchịchị mmadụ.
- source_word: πάσης τῆς προσδοκίας
  choice: n’ihe niile ... nọ na-atụ anya ya
  rationale: Nke a bụ ụzọ Igbo dị ndụ e si kwuo atụmanya niile a na-ekwu maka ha, n’agbanyeghị na Grik ekwughị kpọmkwem ihe ndị ahụ bụ.
- source_word: τοῦ λαοῦ τῶν Ἰουδαίων
  choice: ndị Juu
  rationale: ‘Ndị Juu’ bụ ụzọ Igbo nkịtị ma ziri ezi e si kpọọ ndị Juu dị ka otu ndị mmadụ; ọ na-ezere usoro okwu siri ike nke na-agaghị ada ka Igbo.
theological_decisions:
- issue: Onye κύριος na-ezo aka na ya
  choice: Onyenwe anyị
  alternative: Chineke; Jizọs bilitere n’ọnwụ
  rationale: Ihe odide Grik kwuru κύριος n’akọwaghị ya ọzọ. ‘Onyenwe anyị’ na-edobe oghere ahụ kama ikpebi ihe ederede ahụ na-ekwughị kpọmkwem.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta, dee ya. A hapụrụ oyiyi ‘matara onwe ya’ na ‘n’aka Herọd’ n’ahịrị bụ isi, ma jiri nkọwa ala peeji kọwaa ha. Ahịrịokwu ahụ na-asọ dị ka Igbo nkịtị ma ọ naghị akọwapụta onye ‘Onyenwe anyị’ bụ karịa ka Grik si mee.
