  text: ὁ δὲ ⸀Παῦλος· Οὐ μαίνομαι, φησίν, κράτιστε Φῆστε, ἀλλὰ ἀληθείας καὶ σωφροσύνης ῥήματα ἀποφθέγγομαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/025.yaml
  text: But Paul said[a], “I am not out of my mind, most excellent Festus[c][b], but I am speaking words of truth and sound judgment.”
translation:
  language: ig
  text: Ma Pọl sịrị, “Onye a na-akwanyere ùgwù nke ukwuu, Festọs, anaghị m ara ara; kama ana m ekwu okwu nke eziokwu na nke ezi uche.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Okwu a bụ aha nkwanye ùgwù e ji akpọ onye ọchịchị nọ n’ọkwa dị elu.
    reason: cultural_note
  - marker: b
    text: A pụkwara ịsụgharị ya, “okwu nke eziokwu na nke ịdị n’uche zuru oke,” ma ọ bụ “okwu nke eziokwu na nke njide onwe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Ma
  rationale: Ọ na-egosi na Pọl na-emegide ebubo Festọs kwuru n’amaokwu bu ụzọ.
- source_word: μαίνομαι
  choice: Isi adịghị agba m
  rationale: Nke a bụ ụzọ Igbo nkịtị si ekwu na mmadụ adịghị ara ma ọ bụ na uche ya adịghị aghasa.
- source_word: φησίν
  choice: kwuru
  rationale: Ọ bụ ezie na Grik ji oge ugbu a akụkọ ihe mere eme, oge gara aga dabara n’akụkọ Igbo ebe a.
- source_word: κράτιστε
  choice: onye a na-akwanyere ùgwù nke ukwuu
  rationale: Ọ na-ebupụta aha nkwanye ùgwù e ji akpọ onye ọchịchị nọ n’ọkwa dị elu, n’enweghị ụda ochie ma ọ bụ nke òtù okpukpe.
- source_word: ἀληθείας
  choice: eziokwu
  rationale: Ọ na-echekwa echiche na okwu ndị ahụ nwere àgwà nke eziokwu.
- source_word: σωφροσύνης
  choice: ezi uche
  rationale: N’ọnọdụ a ọ na-egosi uche zuru oke, iche echiche nke ọma, na ikwu okwu nwayọọ nwayọọ; ‘ezi uche’ bụ okwu doro onye Igbo nke oge a anya.
- source_word: ῥήματα
  choice: okwu
  rationale: Ọ na-echekwa aha ọtụtụ nke Grik n’ụzọ ebumpụta ụwa n’Igbo, ebe ‘okwu’ nwere ike ịrụ ọrụ dị ka aha ọnụ ọgụgụ ma ọ bụ nke a na-apụghị ịgụta ọnụ.
- source_word: ἀποφθέγγομαι
  choice: okwu m na-ekwu
  rationale: Ọ na-egosi ikwuputa okwu n’olu doro anya ma ghara itinye ike nkwupụta karịrị nke isi mmalite chọrọ.
