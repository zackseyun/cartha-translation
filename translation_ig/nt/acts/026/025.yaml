translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E debere nkwanye ùgwù Pọl nyere Festọs na esemokwu dị n’etiti ebubo ara na nzaghachi nke ezi uche. Akara nkọwa ala ala [a] na [b] pụtara n’ebe ha metụtara n’ederede.
