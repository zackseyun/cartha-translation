id: ACT.26.2
reference: Acts 26:2
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Περὶ πάντων ὧν ἐγκαλοῦμαι ὑπὸ Ἰουδαίων, βασιλεῦ Ἀγρίππα, ἥγημαι ἐμαυτὸν μακάριον ἐπὶ σοῦ μέλλων ⸂σήμερον ἀπολογεῖσθαι⸃,
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/002.yaml
  text: Concerning all the things of which I am accused by the Jews[a], King Agrippa, I consider myself fortunate that I am about to make my defense before you today,
translation:
  language: ig
  text: N’ihe banyere ihe niile ndị Juu ji ebo m ebubo, Eze Agrịpa, ana m ewere onwe m dị ka onye nwere ihu ọma[a], ebe ọ bụ na taa ka m ga-agbachitere onwe m n’ihu gị,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “onye a gọziri agọzi.” N’ebe a, ihe okwu ahụ yiri ka ọ pụtara bụ “onye nwere ihu ọma” ma ọ bụ “onye e nyere ihe ùgwù,” n’ihi ohere Pọl nwere ịza ebubo n’ihu Agrịpa.
    reason: lexical_alternative
lexical_decisions:
- source_word: Περὶ πάντων ὧν
  choice: N’ihe banyere ihe niile
  rationale: Nke a na-edobe περί na genitive dị ka okwu na-egosi isiokwu a na-ekwu maka ya, ma na-ada nke ọma n’Igbo.
- source_word: ἐγκαλοῦμαι ὑπὸ Ἰουδαίων
  choice: ndị Juu ji ebo m ebubo
  rationale: “Ibo mmadụ ebubo” bụ okwu Igbo doro anya maka ebubo iwu; “ndị Juu” n’ebe a na-ezo aka ná ndị Juu na-ebo Pọl ebubo n’ọnọdụ a, ọ bụghị ndị Juu niile.
- source_word: βασιλεῦ Ἀγρίππα
  choice: Eze Agrịpa
  rationale: Nke a na-egosipụta aha ọkwá na okwu a kpọrọ Agrịpa kpọmkwem, n’enweghị ụdị okwu ochie na-adịghị mkpa.
- source_word: ἥγημαι ἐμαυτὸν
  choice: ana m ewere onwe m dị ka
  rationale: Nke a na-edobe echiche nke ile onwe onye anya ma ọ bụ ịgụ onwe onye dịka ihe, n’Igbo nkịtị.
- source_word: μακάριον
  choice: onye nwere ihu ọma
  rationale: N’ọnọdụ ikpe a, okwu ahụ na-egosi na Pọl hụrụ ya dịka ohere ọma ma ọ bụ ihe ùgwù ịza ọnụ n’ihu Agrịpa, kama ịbụ nanị mmetụta obi ụtọ.
- source_word: ἐπὶ σοῦ
  choice: n’ihu gị
  rationale: Nke a bụ ụzọ Igbo doro anya isi kwuo na mmadụ na-apụta n’ihu onye nọ n’ọnọdụ ịnụrụ okwu ikpe.
- source_word: μέλλων σήμερον ἀπολογεῖσθαι
  choice: ebe ọ bụ na taa ka m ga-agbachitere onwe m
  rationale: “Ga-agbachitere onwe m” na-egosipụta ihe dị nso ime na ọrụ iwu nke ikwu okwu iji zaa ebubo; “taa ka” na-enye σήμερον ọnọdụ pụtara ìhè.
theological_decisions:
- issue: Ihe μακάριον pụtara n’ọnọdụ a
  choice: onye nwere ihu ọma
  alternative: onye a gọziri agọzi
  rationale: Ọnọdụ ahụ bụ ịza ebubo n’ihu eze, ya mere echiche nke ohere ọma ma ọ bụ ihe ùgwù bụ nke kacha pụta ìhè. A hapụrụ nhọrọ “onye a gọziri agọzi” n’ala ala peeji ka a ghara izochi obosara okwu Grik ahụ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ugwu ma dịkwa mfe nghọta. Ahịrịokwu ahụ na-edobe ụda okwu ikpe, ma ọ naghị eme ka ebubo ndị a bụrụ ebubo sitere n’aka ndị Juu niile. Akara rikoma ikpeazụ na-egosi na amaokwu a na-aga n’ihu ruo n’amaokwu na-esote.
