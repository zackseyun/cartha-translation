id: ACT.26.23
reference: Acts 26:23
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἰ παθητὸς ὁ χριστός, εἰ πρῶτος ἐξ ἀναστάσεως νεκρῶν φῶς μέλλει καταγγέλλειν τῷ ⸀τε λαῷ καὶ τοῖς ἔθνεσιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/023.yaml
  text: that the Messiah would suffer[a], and that, as the first to rise from the dead[d][c][b], he would proclaim light both to the people and to the Gentiles.
translation:
  language: ig
  text: na Kraịst ahụ ga-ata ahụhụ[a], nakwa na, dị ka onye mbụ ga-esi ná ndị nwụrụ anwụ bilie[d], ọ ga-ekwusa ìhè nye ma ndị mmadụ ahụ[b] ma ndị mba ọzọ[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “Mesaịa ahụ ga-ata ahụhụ.” Okwu Grik bụ Χριστός, ya bụ Onye E Tere Mmanụ.
    reason: alternative_reading
  - marker: b
    text: N'ụzọ nkịtị, “ndị mmadụ ahụ.” N'ebe a, o yiri ka ọ na-ezo aka ná ndị Juu, ya bụ ndị Izrel, n'adịghị ka ndị mba ọzọ.
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “mba dị iche iche.” N'ebe a, okwu ahụ na-apụtakarị ndị na-abụghị ndị Juu.
    reason: lexical_alternative
  - marker: d
    text: A pụkwara ịhazi okwu ahụ, “nakwa na ọ ga-abụ onye mbụ ga-esi ná mbilite n'ọnwụ nke ndị nwụrụ anwụ kwusaa ìhè.” Grik ahụ dị nkenke, o nwekwara ike ikwe ka e jikọta ahịrịokwu ya n'ụzọ a.
    reason: previous_rendering
lexical_decisions:
- source_word: παθητὸς
  choice: ga-ata ahụhụ
  rationale: N'okwu amụma a, nkọwa okwu Grik ahụ bụ na Kraịst ga-ata ahụhụ; ntụgharị a bụ nke Igbo nkịtị ma na-ezere okwu nkà ihe ọmụma na-adịghị mfe.
- source_word: ὁ χριστός
  choice: Kraịst ahụ
  rationale: Χριστός bụ aha-ọkwa nke Onye E Tere Mmanụ. “Kraịst” bụ okwu Baịbụl ndị Igbo maara nke ọma, ebe “ahụ” na-egosi onye ahụ ndị amụma kwuru banyere ya.
- source_word: πρῶτος ἐξ ἀναστάσεως νεκρῶν
  choice: onye mbụ ga-esi ná ndị nwụrụ anwụ bilie
  rationale: Nke a na-edobe okwu πρῶτος nke na-egosi ịbụ onye mbụ, ma na-asụgharị ahịrịokwu Grik ahụ n'Igbo doro anya n'enweghị ịgbakwunye nkọwa ozizi banyere ụdị mbilite n'ọnwụ ahụ.
- source_word: φῶς
  choice: ìhè
  rationale: A hapụrụ ihe atụ Baịbụl nke ìhè ka o nwee obosara echiche ya banyere mkpughe, nzọpụta, na olileanya.
- source_word: μέλλει καταγγέλλειν
  choice: ọ ga-ekwusa
  rationale: N'usoro okwu a, μέλλω na infinitive na-egosi ihe a kara aka ma ọ bụ nke ga-eme; “ga-ekwusa” bụ Igbo dị mfe nke na-adịghị eme ka ọ dị ka ihe ga-eme ozugbo ahụ.
- source_word: τῷ τε λαῷ
  choice: ndị Izrel
  rationale: Ntụnyere ya na τοῖς ἔθνεσιν na-egosi na λαός ebe a na-ezo aka n'ebe ndị Juu, ya bụ ndị Izrel, nọ. Ikwupụta ya otú a na-eme ka ọdịiche ahụ doo onye Igbo anya.
- source_word: τοῖς ἔθνεσιν
  choice: ndị mba ọzọ
  rationale: N'ebe a ἔθνη pụtara ndị na-abụghị ndị Juu, ọ bụghị naanị mba dị iche iche; “ndị mba ọzọ” na-egosipụta ọdịiche ahụ n'Igbo nkịtị.
- source_word: τε ... καὶ
  choice: ma ... ma
  rationale: Usoro “ma ... ma” na-anọchi njikọ Grik nke na-ejikọta otu abụọ a na-enye ìhè ahụ.
theological_decisions:
- issue: Ihe ịbụ onye mbụ bilitere n'ọnwụ pụtara
  choice: E debere na Kraịst bụ onye mbụ si ná ndị nwụrụ anwụ bilie, n'enweghị nkọwa ọzọ n'ahịrịokwu bụ isi.
  alternative: onye mbụ bilitere ka ọ ghara ịnwụ ọzọ; mkpụrụ mbụ nke mbilite n'ọnwụ ikpeazụ
  rationale: Grik na-ekwu banyere ịbụ onye mbụ, ma ọ kọwaghị n'ụzọ zuru ezu otú nke ahụ si metụta ndị e mere ka ha dị ndụ tupu mgbe ahụ. Tụgharị ya n'ụzọ sara mbara na-echekwa esemokwu ozizi ahụ.
- issue: Onye τῷ λαῷ na-ezo aka na ya
  choice: ndị Izrel
  alternative: ndị ahụ; ndị Juu
  rationale: N'okwu a, ọdịiche dị n'etiti λαός na ἔθνη na-eme ka ndị Izrel bụrụ ebe ntụaka ahụ doro anya. Nke a na-ezere okwu Igbo “ndị ahụ,” nke nwere ike ghara igosi onye a na-ekwu banyere ya.
translation_notes:
  register: Ejiri Standard Igbo nke dị ùgwù ma dị mfe nghọta. E debere okwu Baịbụl ndị mmadụ maara dịka “Kraịst,” “bilie,” “kwusaa,” na “ìhè,” ma zere itinye nkọwa ụka pụrụ iche n'ahịrịokwu bụ isi. Akara nkọwa ala ala [a]–[d] niile pụtara n'ederede.
