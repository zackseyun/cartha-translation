revisions:
- from: na Kraịst ahụ ga-ata ahụhụ[a], nakwa na, ebe ọ bụ onye mbụ ga-esi ná ndị nwụrụ anwụ bilie[d], ọ ga-ekwusa ìhè nye ma ndị Izrel[b] ma ndị mba ọzọ[c].
  to: na Kraịst ahụ ga-ata ahụhụ[a], nakwa na, dị ka onye mbụ ga-esi ná ndị nwụrụ anwụ bilie[d], ọ ga-ekwusa ìhè nye ma ndị mmadụ ahụ[b] ma ndị mba ọzọ[c].
  rationale: The revision preserves the Greek's wording and the English audit trail by retaining the less explicit collective expression for τῷ λαῷ in the text, while keeping its likely Jewish/Israelite sense in footnote b. It also replaces an unintended causal construction with a non-causal phrase corresponding to the Greek relation introduced by πρῶτος.
  reviewer_model: gpt-5.6-terra
