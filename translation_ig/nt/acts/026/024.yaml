source:
  edition: SBLGNT
  text: Ταῦτα δὲ αὐτοῦ ἀπολογουμένου ὁ Φῆστος μεγάλῃ τῇ φωνῇ ⸀φησιν· Μαίνῃ, Παῦλε· τὰ πολλά σε γράμματα εἰς μανίαν περιτρέπει.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/024.yaml
  text: As he was saying these things in his defense[a], Festus said with a loud voice, “You are out of your mind, Paul! Your great learning is driving you into madness.”
translation:
  language: ig
  text: Mgbe ọ na-ekwu ihe ndị a n'ịgbachitere onwe ya, Festọs ji oke olu sị, “Pọl, ị na-ara ara! Ọtụtụ ihe ọmụma gị na-eme ka ị na-ara ara.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπολογουμένου
  choice: mgbe ọ nọ na-ekwu ihe ndị a iji zaa ebubo e boro ya
  rationale: Nke a na-egosi omume na-aga n’otu oge ma na-echekwa echiche nke ịza ebubo n’ọnọdụ ikpe, n’Igbo doro anya.
- source_word: μεγάλῃ τῇ φωνῇ
  choice: ji olu dara ụda
  rationale: Akpaokwu Igbo a na-egosi ụzọ Festọs si tie mkpu ma na-echekwa ịdị ndụ nke nkwụsị okwu ahụ.
- source_word: φησιν
  choice: kwuo
  rationale: E ji oge gara aga mee akụkọ ahụ n’Igbo ka ọ bụrụ nke na-aga were were.
- source_word: Μαίνῃ
  choice: isi adịghị gị mma
  rationale: Akpaokwu a na-egosi ebubo na mmadụ adịghị n’uche ya nke ọma, ma ọ bụ onye ara, n’asụsụ Igbo nke oge a.
- source_word: τὰ πολλά ... γράμματα
  choice: ọtụtụ ihe ị mụtara
  rationale: N’ebe a γράμματα na-ezo aka n’ọmụmụ na ihe ọmụma buru ibu, ọ bụghị naanị akwụkwọ ozi ma ọ bụ ihe e dere ede.
- source_word: εἰς μανίαν
  choice: ka ị zewe isi
  rationale: Nke a na-egosi nsonaazụ nke ịbanye n’ọnọdụ ara ma ọ bụ enweghị ezi uche.
- source_word: περιτρέπει
  choice: na-eme
  rationale: N’ime usoro ‘na-eme ka,’ okwu a na-egosi ihe na-akpata mmadụ ịbanye n’ọnọdụ ahụ.
theological_decisions: []
translation_notes:
  register: Asụsụ ahụ bụ Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. A họọrọ ‘Festọs’ na ‘Pọl’ dịka nsụpe aha ndị a na-ahụkarị n’Igbo. E debere mmetụta ikpe dị na ἀπολογουμένου n’enweghị itinye nkọwa okpukpe pụrụ iche.
