id: ACT.26.19
reference: Acts 26:19
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ὅθεν, βασιλεῦ Ἀγρίππα, οὐκ ἐγενόμην ἀπειθὴς τῇ οὐρανίῳ ὀπτασίᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/019.yaml
  text: Therefore[a], King Agrippa, I was not disobedient to the heavenly vision,
translation:
  language: ig
  text: “N’ihi ya, Eze Agrịpa, enupụghị m isi n’ọhụụ ahụ sitere n’eluigwe.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’ọhụụ ahụ nke eluigwe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅθεν
  choice: N’ihi ya
  rationale: Ọ na-egosi nkwubi okwu Pọl wepụtara site n’akụkọ nzute na ọrụ e nyere ya; okwu a bụ Igbo doro anya ma bụrụkwa nke e ji eme ihe ugbu a.
- source_word: βασιλεῦ Ἀγρίππα
  choice: Eze Agrịpa
  rationale: Ọ bụ okwu a na-agwa Agrịpa ihu na ihu, na-edebekwa aha nsọpụrụ ya n’ụzọ Igbo dị mma.
- source_word: οὐκ ἐγενόμην ἀπειθὴς
  choice: enupụghị m isi
  rationale: N’ebe a, okwu Grik ahụ pụtara na Pọl ajụghị irube isi n’iwu Chineke nyere ya; akpaokwu Igbo a na-egosipụta nnupụisi ma ọ bụ ịjụ ime ihe e nyere n’iwu.
- source_word: τῇ οὐρανίῳ ὀπτασίᾳ
  choice: n’ọhụụ ahụ sitere n’eluigwe
  rationale: “Ọhụụ” na-egosi ihe pụrụ iche e mere ka mmadụ hụ, ebe “sitere n’eluigwe” na-edobe ohere na adjective ahụ na-ekwu karịsịa banyere ebe ọhụụ ahụ si bịa, na-enweghị ịkọwa ọdịdị ahụ gabiga ihe ederede kwuru.
theological_decisions:
- issue: Ụdị ahụmahụ Pọl n’ụzọ Damaskọs
  choice: ọhụụ
  alternative: mpụta; mkpughe sitere n’eluigwe
  rationale: ὀπτασία na-ezo aka n’ọhụụ ma ọ bụ mpụta a hụrụ. “Ọhụụ” na-edobe ụdị okwu ederede n’onwe ya ji kọwaa ahụmahụ ahụ, n’etinyeghị nkọwa ozizi ọzọ.
- issue: Ihe οὐρανίῳ na-akọwa banyere ọhụụ ahụ
  choice: sitere n’eluigwe
  alternative: nke eluigwe
  rationale: Adjective ahụ nwere ike igosi ebe ọhụụ ahụ si bịa ma ọ bụ ụdị ya. Isi ederede họọrọ nkọwa mmalite ya nke na-ada nke ọma n’Igbo, ebe ndetu ala na-edobe ụzọ ọzọ a pụrụ isi ghọta ya.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị ugwu ma dị mfe nghọta. E ji “enupụghị m isi” mee ka echiche nke ịghara irubere ọrụ Chineke isi pụta ìhè n’ụzọ nkịtị; e tinyere akara ndetu [a] n’isi ederede dịka achọrọ.
