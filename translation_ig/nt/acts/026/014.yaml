id: ACT.26.14
reference: Acts 26:14
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: πάντων ⸀τε καταπεσόντων ἡμῶν εἰς τὴν γῆν ἤκουσα φωνὴν ⸀λέγουσαν πρός ⸀με τῇ Ἑβραΐδι διαλέκτῳ· Σαοὺλ Σαούλ, τί με διώκεις; σκληρόν σοι πρὸς κέντρα λακτίζειν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/014.yaml
  text: And when we had all fallen to the ground[a], I heard a voice saying to me in the Hebrew language, ‘Saul, Saul[b], why are you persecuting me? It is hard for you to kick against the goads.’
translation:
  language: ig
  text: Mgbe anyị niile dara n’ala, anụrụ m olu na-agwa m okwu n’asụsụ Hibru[a], sị, “Sọl, Sọl, gịnị mere i ji na-akpagbu m? Ọ na-esiri gị ike ịgba ụkwụ megide mkpanaka ndị e ji achị anụ[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma eleghị anya, “n’asụsụ Arameik.” Okwu Grik ahụ pụtara n’ụzọ nkịtị “n’asụsụ Hibru” ma ọ bụ “n’olumba Hibru.”
    reason: alternative_reading
  - marker: b
    text: 'Nke a bụ ilu: anụ na-agba mkpanaka e ji achị ya ụkwụ na-emerụ onwe ya ahụ; otú ahụkwa, onye na-eguzogide onye na-ekwu okwu a na-ewetara onwe ya nsogbu.'
    reason: cultural_note
lexical_decisions:
- source_word: πάντων τε καταπεσόντων ἡμῶν εἰς τὴν γῆν
  choice: Mgbe anyị niile dara n’ala
  rationale: A gbanwere genitive absolute ka ọ bụrụ nkebiokwu oge nke na-ada nke ọma n’Igbo, ma chekwaa echiche na ha niile dara n’ala tupu Pọl anụ olu ahụ.
- source_word: ἤκουσα φωνὴν λέγουσαν πρός με
  choice: anụkwara m olu na-agwa m
  rationale: “Olu” dabara n’ebe okwu a na-aghọta aghọta sochiri ya; “na-agwa m” na-egosi na e duziri okwu ahụ kpọmkwem n’ebe Pọl nọ.
- source_word: τῇ Ἑβραΐδι διαλέκτῳ
  choice: n’asụsụ Hibru
  rationale: Nke a na-esochi okwu Grik ahụ kpọmkwem ma hapụ nkọwa nwere ike ịbụ Arameik n’ihe odide ala peeji.
- source_word: Σαοὺλ Σαούλ
  choice: Sọl, Sọl
  rationale: E degharịrị aha ahụ n’ụdị Igbo a na-ejikarị, ma chekwaa nkwughachi ya maka ike okwu ahụ.
- source_word: τί με διώκεις;
  choice: gịnị mere i ji na-akpagbu m?
  rationale: “Na-akpagbu” na-egosipụta omume iro na-aga n’ihu nke διώκεις pụtara n’ebe a.
- source_word: σκληρόν σοι
  choice: Ọ na-esiri gị ike
  rationale: Nke a bụ ụzọ Igbo ebumpụta ụwa si kwuo ihe na-esiri mmadụ ike, n’agbanyeghị na ilu ahụ nwekwara echiche nke ihe na-eweta mgbu ma ọ bụ mmerụ ahụ.
- source_word: πρὸς κέντρα λακτίζειν
  choice: ịgba ụkwụ megide mkpanaka ndị e ji achị anụ
  rationale: A kọwara κέντρα dị ka mkpanaka ndị nwere ọnụ a na-eji achị ma ọ bụ kpalie anụ, ka ihe oyiyi ilu ahụ doo onye Igbo nke oge a anya n’enweghị ịkọwa ihe ọ pụtara n’ime amaokwu ahụ.
theological_decisions:
- issue: Ihe τῇ Ἑβραΐδι διαλέκτῳ pụtara
  choice: n’asụsụ Hibru
  alternative: n’asụsụ Arameik
  rationale: Isi amaokwu na-egosipụta okwu Grik ahụ nke na-ekwu “Hibru.” E debere nghọta ndị ọzọ na ọ pụrụ ịpụta Arameik n’ihe odide ala peeji, kama iji ya dochie okwu dị n’isi amaokwu.
- issue: Njikọ Jizọs na ndị a na-akpagbu
  choice: gịnị mere i ji na-akpagbu m?
  alternative: gịnị mere i ji na-akpagbu ndị nke m?
  rationale: A chekwara “m” nke dị na Grik ka esemokwu na ịdị omimi nke okwu Jizọs banyere mkpagbu ahụ ghara ịla n’iyi site n’ịgbakwunye nkọwa na-adịghị n’ederede.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ugwu ma dị mfe nghọta, dee ya. A họọrọ “mkpanaka ndị e ji achị anụ” kama okwu nka na-adịghị ama ọtụtụ ndị, iji chekwaa ihe oyiyi mbụ ma mee ka ilu ahụ doo anya. E debere akara [a] n’akụkụ “Hibru” na [b] n’akụkụ ilu ha na-akọwa.
