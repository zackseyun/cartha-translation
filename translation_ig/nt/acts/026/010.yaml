revisions:
- from: 'Nke a bụkwa ihe m mere na Jerusalem: E ji m ikike m natara n’aka ndị isi nchụàjà kpọchie ọtụtụ ndị nsọ[a] n’ụlọ mkpọrọ dị iche iche; mgbe a na-egbu ha, m tụkwara vootu m megide ha.[b]'
  to: 'Nke a bụkwa ihe m mere na Jeruselem: ọ bụghị naanị na m kpọchiri ọtụtụ ndị nsọ[a] n’ụlọ mkpọrọ dị iche iche, mgbe m natara ikike n’aka ndị isi nchụàjà, kamakwa mgbe e na-egbu ha, m tụkwara votu megide ha.[b]'
  rationale: The revision retains the source meaning while more explicitly reflecting τε ... τε with “ọ bụghị naanị ... kamakwa.” It uses idiomatic Standard Igbo for the passive temporal clause, conventional Igbo biblical spelling for Jeruselem, and the integrated spelling “votu.” Footnote anchors remain correctly attached to “ndị nsọ” and the voting expression.
