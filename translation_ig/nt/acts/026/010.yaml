id: ACT.26.10
reference: Acts 26:10
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὃ καὶ ἐποίησα ἐν Ἱεροσολύμοις, καὶ πολλούς ⸀τε τῶν ἁγίων ἐγὼ ⸀ἐν φυλακαῖς κατέκλεισα τὴν παρὰ τῶν ἀρχιερέων ἐξουσίαν λαβών, ἀναιρουμένων τε αὐτῶν κατήνεγκα ψῆφον,
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/010.yaml
  text: 'And this is what I did in Jerusalem: I not only locked up many of the saints in prisons[a], having received authority from the chief priests, but also, when they were being put to death[b], I cast my vote against them.'
translation:
  language: ig
  text: 'Nke a bụkwa ihe m mere na Jeruselem: ọ bụghị naanị na m kpọchiri ọtụtụ ndị nsọ[a] n’ụlọ mkpọrọ dị iche iche, mgbe m natara ikike n’aka ndị isi nchụàjà, kamakwa mgbe e na-egbu ha, m tụkwara votu megide ha.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ndị nsọ” n’ebe a bụ ndị Chineke doro nsọ, ya bụ, ndị kwere na Jizọs.
    reason: lexical_alternative
  - marker: b
    text: N’ụzọ nkịtị, okwu Grik na-ekwu maka ịtụ “votu” (ψῆφος). N’ọnọdụ a, ọ na-egosi na Pọl tụpụtara votu megide ha; ederede ahụ akọwaghị kpọmkwem ụdị nzukọ ma ọ bụ usoro e ji mee ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃ καὶ ἐποίησα
  choice: Nke a bụkwa ihe m mere
  rationale: Ọ na-ezo aka n’ọrụ mkpagbu Pọl kwuru okwu ya n’amaokwu bu ụzọ, ma na-asụ ya n’Igbo dị mfe ma doo anya.
- source_word: ἐν Ἱεροσολύμοις
  choice: na Jerusalem
  rationale: Ọ bụ aha obodo ahụ n’ụdị a na-amata nke ọma n’Igbo nke oge a.
- source_word: πολλούς τε τῶν ἁγίων
  choice: ọtụtụ ndị nsọ
  rationale: “Ndị nsọ” na-echekwa echiche nke ndị e doro nsọ nye Chineke, ya bụ ndị kwere na Jizọs; ọ pụtaghị naanị otu ìgwè pụrụ iche e mesịrị kpọọ ndị nsọ.
- source_word: ἐν φυλακαῖς κατέκλεισα
  choice: kpọchie ... n’ụlọ mkpọrọ dị iche iche
  rationale: “Kpọchie” na-egosipụta ike nke κατακλείω, ebe “ụlọ mkpọrọ dị iche iche” na-eme ka ọtụtụ ụlọ mkpọrọ dị na φυλακαῖς pụta ìhè n’Igbo.
- source_word: τὴν παρὰ τῶν ἀρχιερέων ἐξουσίαν λαβών
  choice: E ji m ikike m natara n’aka ndị isi nchụàjà
  rationale: Ọ na-egosi ma ikike Pọl ji mee ihe ndị ahụ ma ebe ikike ahụ si bịa.
- source_word: ἀναιρουμένων τε αὐτῶν
  choice: mgbe a na-egbu ha
  rationale: Ọ na-echekwa ụdị nnara na oge nke participle ahụ n’enweghị ịgbakwunye nkọwa banyere usoro iwu e ji gbuo ha.
- source_word: κατήνεγκα ψῆφον
  choice: m tụkwara vootu m megide ha
  rationale: Ọ na-echekwa ihe ψῆφος pụtara kpọmkwem—ịtụ vootu—ma “megide ha” na-eme ka ntụziaka nke omume ahụ doo anya dịka ọnọdụ okwu ahụ si gosi.
theological_decisions:
- issue: Ihe ἅγιοι pụtara n’Ọrụ Ndịozi
  choice: ndị nsọ, ya bụ ndị kwere na Jizọs
  alternative: ndị Chineke; ndị e doro nsọ
  rationale: Nhọrọ a na-echekwa okwu bụ isi nke Agba Ọhụrụ, ebe nkọwa ala peeji na-egbochi ndị na-agụ ya iche na ọ bụ naanị ndị pụrụ iche e nyere ọkwa nsọ.
- issue: Ike okwu κατήνεγκα ψῆφον nwere
  choice: m tụkwara vootu m megide ha
  alternative: m kwadoro ka e gbuo ha
  rationale: Isi ihe okwu Grik na-egosi bụ ịtụ vootu. Nsụgharị ahụ anaghị ekpebi kpọmkwem ụlọ ikpe ma ọ bụ nzukọ e mere ya, ebe nkọwa ala peeji na-ekweta na ọ pụkwara ịkọwa nkwado Pọl nyere ọnwụ ha.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. A hapụrụ echiche nke “ịtụ vootu” n’ahịrị isi ka a ghara ime ka ọ bụrụ naanị nkwado n’ozuzu, ma a kọwara oke ihe anyị nwere ike ikwu banyere usoro ahụ n’ala peeji. Akara ala peeji [a] na [b] dị n’ebe okwu ha na-akọwa dị.
