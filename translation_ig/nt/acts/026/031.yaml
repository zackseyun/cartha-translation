  text: καὶ ἀναχωρήσαντες ἐλάλουν πρὸς ἀλλήλους λέγοντες ὅτι Οὐδὲν θανάτου ⸂ἢ δεσμῶν ἄξιον⸃ ⸀τι πράσσει ὁ ἄνθρωπος οὗτος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/031.yaml
  text: And after they withdrew[a], they were speaking to one another, saying, “This man is doing nothing worthy of death or imprisonment.”
translation:
  language: ig
  text: Mgbe ha siri n'ebe ahụ pụọ[a], ha na-ekwu okwu n'etiti onwe ha, sị, “Nwoke a anaghị eme ihe ọ bụla kwesịrị ọnwụ ma ọ bụ mkpọrọ.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Mgbe ha pụụrụ gaa n'akụkụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναχωρήσαντες
  choice: Mgbe ha pụrụ iche
  rationale: Nkebi a na-egosi na ha si n'ebe nzukọ ahụ nọ pụọ tupu ha amalite mkparịta ụka; ‘pụrụ iche’ bụ Igbo dị mfe nke na-egosi ịpụ n'ebe ahụ gaa n'akụkụ.
- source_word: ἐλάλουν πρὸς ἀλλήλους
  choice: ha nọ na-agwa ibe ha okwu
  rationale: Ụdị imperfect na-egosi mkparịta ụka na-aga n'ihu, ebe ‘ibe ha’ na-echekwa echiche nke reciprocal expression ahụ.
- source_word: λέγοντες
  choice: sị
  rationale: ‘Sị’ bụ ụzọ dị nkenke ma dịkwa eke n'Igbo isi webata kpọmkwem ihe ha kwuru.
- source_word: Οὐδὲν ... ἄξιον
  choice: adịghị eme ihe ọ bụla kwesịrị
  rationale: Nke a na-echekwa nkwupụta ahụ na ọ dịghị ihe ọ na-eme nke ruru ntaramahụhụ ndị a kpọrọ aha.
- source_word: θανάτου ἢ δεσμῶν
  choice: ọnwụ ma ọ bụ ịtụ ya mkpọrọ
  rationale: ‘Ọnwụ’ na-egosi ntaramahụhụ ọnwụ n'ọnọdụ ikpe a; ‘ịtụ ya mkpọrọ’ na-enye nghọta iwu nke δεσμῶν n'Igbo nke oge a, ebe e debere ‘agbụ’ na nkọwa ala peeji.
- source_word: τι πράσσει
  choice: na-eme ihe ọ bụla
  rationale: Nke a na-egosi omume n'ozuzu ya, n'etinyeghị echiche mmehie ma ọ bụ mpụ nke okwu Grik ahụ ekwughị kpọmkwem.
- source_word: ὁ ἄνθρωπος οὗτος
  choice: Nwoke a
  rationale: Ọ na-ezo aka kpọmkwem n'ebe Pọl nọ ma na-ada nke ọma n'Igbo.
