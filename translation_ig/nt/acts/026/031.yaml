translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke oge a, dị ùgwù ma dị mfe nghọta. E ji usoro na-egosi omume na-aga n'ihu chekwaa imperfect ἐλάλουν, ma e ji okwu ikpe nke ndị nkịtị ga-aghọta sụgharịa δεσμῶν.
