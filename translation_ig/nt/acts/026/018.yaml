id: ACT.26.18
reference: Acts 26:18
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀνοῖξαι ὀφθαλμοὺς αὐτῶν, τοῦ ⸀ἐπιστρέψαι ἀπὸ σκότους εἰς φῶς καὶ τῆς ἐξουσίας τοῦ Σατανᾶ ἐπὶ τὸν θεόν, τοῦ λαβεῖν αὐτοὺς ἄφεσιν ἁμαρτιῶν καὶ κλῆρον ἐν τοῖς ἡγιασμένοις πίστει τῇ εἰς ἐμέ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/018.yaml
  text: to open their eyes[a], so that they may turn from darkness to light and from the authority of Satan to God[b], that they may receive forgiveness of sins and an inheritance among those who have been sanctified by faith in me.
translation:
  language: ig
  text: imeghe anya ha, ka ha wee si n'ọchịchịrị chigharịkwuru ìhè, sikwa n'ikike Setan[a] chigharịkwuru Chineke, ka ha wee nata mgbaghara mmehie na òkè nketa n'etiti ndị e doro nsọ[b] site n'okwukwe ha nwere n'ebe m nọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ike Setan” ma ọ bụ “ọchịchị Setan.” Okwu Grik ahụ nwere ike izo aka n'ikike, ike ịchị achị, ma ọ bụ ókè ọchịchị.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ndị e mere ka ha dị nsọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνοῖξαι ὀφθαλμοὺς αὐτῶν
  choice: imeghe anya ha
  rationale: Nke a debere ihe atụ doro anya nke imeghe anya, kama ịkọwa ya naanị dị ka ime ka ha ghọta ihe ime mmụọ.
- source_word: τοῦ ἐπιστρέψαι
  choice: ka ha wee ... chigharịkwuru
  rationale: Ọ na-egosi ebumnuche ma na-echekwa echiche nke isi n'otu ụzọ tụgharịa gaa n'ụzọ ọzọ, n'enweghị ịgbakwunye nkọwa okpukpe karịrị ihe Grik kwuru.
- source_word: ἀπὸ σκότους εἰς φῶς
  choice: si n'ọchịchịrị chigharịkwuru ìhè
  rationale: A hapụrụ ihe atụ nke ọchịchịrị na ìhè dịka ọ dị n'isi mmalite; ọ bụkwa okwu Igbo doro anya ma dị ebube.
- source_word: τῆς ἐξουσίας τοῦ Σατανᾶ
  choice: ikike ọchịchị Setan
  rationale: ἐξουσία nwere ike ịpụta ikike, ike ọchịchị, ma ọ bụ ókè onye na-achị. “Ikike ọchịchị” na-egosipụta echiche nke ikike ịchị karịa naanị ike anụ ahụ.
- source_word: ἐπὶ τὸν θεόν
  choice: chigharịkwuru Chineke
  rationale: N'usoro okwu na-egosi isi n'otu ebe gaa ebe ọzọ, nke a na-egosi ntụgharị uche na nrubeisi gaa n'ebe Chineke nọ.
- source_word: τοῦ λαβεῖν
  choice: ka ha wee nata
  rationale: Ọ na-aga n'ihu n'usoro ebumnuche nke ahịrịokwu ahụ; “nata” na-egosi ihe a na-enye ha, ọ bụghị ihe ha ji aka ha nweta.
- source_word: ἄφεσιν ἁμαρτιῶν
  choice: mgbaghara mmehie
  rationale: Nke a bụ okwu Igbo nke oge a, nke doro anya maka ịgbaghara mmehie.
- source_word: κλῆρον
  choice: òkè nketa
  rationale: κλῆρος n'ebe a bụ òkè e kenyere mmadụ n'ihe nketa dị n'etiti ndị Chineke. “Òkè nketa” na-echekwa ma echiche òkè ma echiche ihe nketa.
- source_word: ἐν τοῖς ἡγιασμένοις
  choice: n'etiti ndị e doro nsọ
  rationale: Ụdị participle perfect passive ahụ na-egosi ihe e meere ha nke ka na-akọwa ọnọdụ ha ugbu a. “Ndị e doro nsọ” na-echekwa omume ahụ na ọnọdụ si na ya pụta.
- source_word: πίστει τῇ εἰς ἐμέ
  choice: site n'okwukwe ha nwere n'ebe m nọ
  rationale: Dative ahụ na-egosi ụzọ e si enweta òkè ahụ, ebe εἰς ἐμέ na-akọwapụta Jizọs dị ka onye okwukwe ahụ lekwasịrị anya na ya.
theological_decisions:
- issue: Ụzọ a ga-esi sụgharịa πίστις na πίστει τῇ εἰς ἐμέ
  choice: site n'okwukwe ha nwere n'ebe m nọ
  alternative: site na ntụkwasị obi ha nwere n'ebe m nọ
  rationale: “Okwukwe” bụ okwu Igbo a maara nke ọma maka πίστις, ma njikọ ya na “n'ebe m nọ” na-egosi n'ụzọ doro anya na Jizọs bụ onye okwukwe ahụ dị n'ime ya. A hapụghị okwu ahụ ka ọ bụrụ nkwenkwe nkịtị na-enweghị onye ọ dabeere na ya.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. E debere ihe atụ ndị bụ isi—anya, ọchịchịrị na ìhè, na ịchigharị—ma zere ịkọwa ha n'ụzọ ga-emechi nghọta ndị ọzọ okwu Grik nwere ike ibu. E debere akara nkọwa [a] n'akụkụ “ikike ọchịchị Setan” na [b] n'akụkụ “ndị e doro nsọ,” ka akara ọ bụla kwekọọ kpọmkwem n'ihe nkọwa ya na-akọwa.
