  text: Ἐν ⸀οἷς πορευόμενος εἰς τὴν Δαμασκὸν μετ’ ἐξουσίας καὶ ἐπιτροπῆς ⸀τῆς τῶν ἀρχιερέων
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/012.yaml
  text: In this connection[a], as I was traveling to Damascus with authority and a commission from the chief priests,
translation:
  language: ig
  text: N'ime ihe ndị a[a], ka m na-aga Damaskọs, jiri ikike na ọrụ e nyere m site n'aka ndị isi nchụaja,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N'ụzọ nkịtị, “N'ime ihe ndị a,” na-ezo azụ n'ihe Pọl kwuru na mbụ banyere omume na ebumnuche ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν οἷς
  choice: Mgbe m na-eme ihe ndị a
  rationale: Nkebiokwu a na-ezo azụ n'ihe Pọl kwuru na ọ na-eme na ebumnuche ya megide ndị kwere ekwe. Nsụgharị a na-eme ka njikọ ahụ doo anya n'Igbo ma ghara itinye echiche ‘ozi’ nke na-adịghị kpọmkwem n'okwu Grik.
- source_word: πορευόμενος εἰς τὴν Δαμασκὸν
  choice: agara m Damaskọs
  rationale: Ọ bụ ụzọ Igbo dị mfe ma dị ndụ isi kwuo njem ọ na-aga Damaskọs; ọnọdụ ahịrịokwu ahụ na-egosi na nke a mere n'ime ihe ndị ọ na-akọ.
- source_word: μετ’ ἐξουσίας
  choice: jiri ikike
  rationale: ἐξουσία ebe a pụtara ikike e nyere mmadụ ime ihe, ọ bụghị naanị ike anụ ahụ.
- source_word: ἐπιτροπῆς
  choice: ọrụ ... nyere m
  rationale: Okwu a na-egosi ọrụ ma ọ bụ iwu e nyefere ya n'ụzọ ọchịchị. Nhọrọ a bụ Igbo nkịtị ma na-egosi na e nyere ya ọrụ ahụ n'ụzọ iwu kwadoro.
- source_word: τῆς τῶν ἀρχιερέων
  choice: ndịisi nchụaja nyere m
  rationale: Genitive Grik a na-egosi ebe ikike na ọrụ ahụ siri bịa; usoro Igbo a na-akọwa nke ahụ n'ụzọ doro anya.
- source_word: ἀρχιερέων
  choice: ndịisi nchụaja
  rationale: Ọ na-ezo aka n'òtù ndị ndu nchụaja dị elu, ọ bụghị ọtụtụ ndị ji otu ọkwa onyeisi nchụaja n'otu oge.
theological_decisions: []
translation_notes:
  register: E ji Igbo ọkọlọtọ nke oge a, dị mfe ma dị ùgwù. A họọrọ ‘ọrụ ... nyere m’ kama okwu mbinye ma ọ bụ usoro siri ike, iji gosipụta ọrụ e nyere Pọl n'ụzọ ọchịchị. Akara nkịtị na njedebe na-egosi na ahịrịokwu ahụ na-aga n'ihu n'amaokwu na-esote.
