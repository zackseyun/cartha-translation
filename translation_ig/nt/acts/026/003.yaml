  text: μάλιστα γνώστην ὄντα σε πάντων τῶν κατὰ Ἰουδαίους ⸀ἐθῶν τε καὶ ζητημάτων· διὸ ⸀δέομαι μακροθύμως ἀκοῦσαί μου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/003.yaml
  text: especially because you are knowledgeable about all the customs and disputes among the Jews[b][a]. Therefore I beg you to listen to me patiently.
translation:
  language: ig
  text: karịsịa ebe ị maara nke ọma omenala niile nke ndị Juu na okwu niile a na-arụrịta ụka banyere ha.[a] N’ihi ya, ana m arịọ gị[b] ka i jiri ndidi gee m ntị.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “omenala niile na okwu ndị a na-arụrịta ụka banyere ha n’etiti ndị Juu.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ana m arịọsi gị ike”; ngwaa Grik ahụ na-egosi arịrịọ sitere n’obi.
    reason: lexical_alternative
lexical_decisions:
- source_word: μάλιστα
  choice: karịsịa ebe
  rationale: Ọ na-eme ka ihe mere Pọl ji nwee obi ike ikwu okwu n’ihu Agrịpa pụta ìhè; ‘karịsịa ebe’ na-egosikwa njikọ nke ihe kpatara ya n’Igbo ebumpụta ụwa.
- source_word: γνώστην ὄντα σε
  choice: ị maara nke ọma
  rationale: Nke a na-akọwa Agrịpa dị ka onye maara ihe ndị a nke ọma, ma ọ naghị ekwu hoo haa na ọ bụ ọkachamara n’ụzọ ọrụ.
- source_word: πάντων τῶν κατὰ Ἰουδαίους ἐθῶν
  choice: omenala niile ... n’etiti ndị Juu
  rationale: Nhazi a na-edobe echiche nke ihe dị n’okirikiri ndụ ndị Juu ma na-ada nke ọma n’Igbo.
- source_word: τε καὶ
  choice: na
  rationale: Njikọ dị mfe ‘na’ na-ejikọta ụdị ihe abụọ ahụ n’ụzọ Igbo na-anabata nke ọma.
- source_word: ζητημάτων
  choice: okwu ndị a na-arụrịta ụka banyere ha
  rationale: Ọ na-eburu echiche nke ajụjụ ma ọ bụ okwu ndị mmadụ na-arụrịta ụka banyere ha, n’etinyeghị nkọwa okpukpe pụrụ iche.
- source_word: διὸ
  choice: N’ihi ya
  rationale: Ọ na-egosi nkwubi okwu sitere n’ọmụma Agrịpa nwere.
- source_word: δέομαι
  choice: ana m arịọ gị
  rationale: Ọ na-egosi arịrịọ siri ike n’ụzọ dị ùgwù ma bụrụkwa Igbo a na-asụ ugbu a; ihe ọzọ nwere ike ịbụ ‘ana m akpọku gị arịrịọ,’ nke siri ike karịa.
- source_word: μακροθύμως
  choice: jiri ndidi
  rationale: Ọ na-egosi na Pọl chọrọ ka Agrịpa nwee ndidi mgbe ọ na-ege ya ntị.
- source_word: ἀκοῦσαί μου
  choice: gee m ntị
  rationale: Nke a bụ ụzọ Igbo ebumpụta ụwa si ekwu ịnụrụ mmadụ nke ọma ma ṅaa ya ntị.
