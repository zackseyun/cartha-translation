translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke dị ùgwù ma doo ndị nkịtị anya. E debere okwu ụlọikpe ahụ n’ụzọ dị nro ma kwanyere Agrịpa ùgwù; e zere okwu ochie ma ọ bụ nke otu ụka pụrụ iche.
