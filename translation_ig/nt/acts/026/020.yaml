revisions:
- from: Ma eburu m ụzọ kwusaara ndị nọ na Damaskọs, mesịa ndị nọ na Jerusalem, nakwa ndị nọ n’ala Judia niile na ndị mba ọzọ[a], na ha kwesịrị ichegharị, chigharịkwute Chineke, na-emekwa omume ndị dabara na nchegharị ha[b].
  to: Ma, nke mbụ, ekwusaara m ndị nọ na Damaskọs, mesịa kwa ndị nọ na Jerusalem, nakwa ndị nọ n’ala Judia niile na ndị mba ọzọ[a], ka ha chegharịa ma chigharịkwute Chineke, na-eme omume ndị dabara na nchegharị[b].
  rationale: The revision makes the introductory clause more idiomatic, avoids an unnecessary possessive, and relocates footnote b to its proper lexical anchor. It retains the source’s sequence and presents deeds as conduct appropriate to repentance, without imposing a doctrinal interpretation.
  reviewer_model: gpt-5.6-terra
