id: ACT.26.20
reference: Acts 26:20
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀλλὰ τοῖς ἐν Δαμασκῷ πρῶτόν ⸀τε καὶ Ἱεροσολύμοις, ⸀πᾶσάν τε τὴν χώραν τῆς Ἰουδαίας, καὶ τοῖς ἔθνεσιν ⸀ἀπήγγελλον μετανοεῖν καὶ ἐπιστρέφειν ἐπὶ τὸν θεόν, ἄξια τῆς μετανοίας ἔργα πράσσοντας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/020.yaml
  text: but first to those in Damascus[a], then also in Jerusalem, and throughout all the region of Judea, and to the Gentiles, I proclaimed that they should repent and turn to God[b], doing works worthy of repentance.
translation:
  language: ig
  text: Ma, nke mbụ, ekwusaara m ndị nọ na Damaskọs, mesịa kwa ndị nọ na Jerusalem, nakwa ndị nọ n’ala Judia niile na ndị mba ọzọ[a], ka ha chegharịa ma chigharịkwute Chineke, na-eme omume ndị dabara na nchegharị[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “mba dị iche iche.” N’ebe a, okwu Grik ahụ na-ezo aka ná ndị na-abụghị ndị Juu, ya mere e ji “ndị mba ọzọ” mee ihe n’ahịrịokwu ahụ.
    reason: lexical_alternative
  - marker: b
    text: N’ụzọ nkịtị, “omume ndị kwesịrị nchegharị,” ma ọ bụ “ọrụ ndị kwekọrọ na nchegharị.” Ihe a na-ekwu bụ omume ndị kwesịrị iso nchegharị ma gosipụta ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Ma
  rationale: Ọ na-egosi ọdịiche dị n’etiti okwu a na ihe Pọl kwuru tupu ya; “Ma” bụ njikọ Igbo dị mfe ma kwekọọ n’ebe a.
- source_word: τοῖς ἐν Δαμασκῷ
  choice: ndị nọ na Damaskọs
  rationale: Dative plural a na-ezo aka n’ebe ndị mmadụ nọ, ọ bụghị naanị n’obodo ahụ dịka ebe.
- source_word: πρῶτόν τε καὶ Ἱεροσολύμοις
  choice: eburu m ụzọ ... mesịa ndị nọ na Jerusalem
  rationale: 'Nke a na-eme ka usoro ebe Pọl kwusara ozi pụta nke ọma n’Igbo: Damaskọs na mbụ, Jerusalem esochie ya.'
- source_word: πᾶσάν τε τὴν χώραν τῆς Ἰουδαίας
  choice: ndị nọ n’ala Judia niile
  rationale: χώρα na-egosi mpaghara ma ọ bụ ala sara mbara; ntụgharị a na-ejigidekwa na Pọl na-agwa ndị bi n’ebe ahụ okwu.
- source_word: τοῖς ἔθνεσιν
  choice: ndị mba ọzọ
  rationale: N’ọnọdụ a, okwu ahụ na-ezo aka ná ndị na-abụghị ndị Juu, ọ bụghị naanị ná mba dị iche iche dịka ókèala.
- source_word: ἀπήγγελλον
  choice: kwusaara
  rationale: N’ọrụ ozi Pọl, ngwaa a pụtara ikwupụta ozi n’ihu ọha; “kwusaara” na-egosikwa ndị a gwara ya.
- source_word: μετανοεῖν
  choice: ichegharị
  rationale: “Ichegharị” bụ okwu Igbo a na-aghọta nke ọma maka mgbanwe obi na echiche n’ebe Chineke nọ, ọ bụghị naanị ịgbanwe echiche n’otu ihe.
- source_word: ἐπιστρέφειν ἐπὶ τὸν θεόν
  choice: chigharịkwute Chineke
  rationale: Nke a na-egosi ịtụgharị n’ebe Chineke nọ. E jighị “laghachikwute” ka a ghara ịpụta na ndị mba ọzọ bụbu ndị nọ ná mmekọrịta ọgbụgba ndụ ahụ.
- source_word: ἄξια τῆς μετανοίας ἔργα
  choice: omume ndị dabara na nchegharị ha
  rationale: “Dabara na” na-egosi omume kwekọrọ na nchegharị ma na-egosipụta ya, na-enweghị ikwu na omume ndị ahụ bụ ụgwọ e ji enweta nnabata Chineke.
- source_word: πράσσοντας
  choice: na-emekwa
  rationale: Ọ na-egosi omume na-eso ichegharị na ịchịgharịkwute Chineke, ma na-edobe echiche nke ime ihe n’ezie.
theological_decisions:
- issue: Mmekọrịta dị n’etiti nchegharị, ịchịgharịkwute Chineke, na omume
  choice: E gosiri omume dịka ihe dabara na nchegharị ma na-eso ya.
  alternative: A pụrụ ịghọta omume dịka ọdịnaya nchegharị n’onwe ya, ma ọ bụ dịka ihe mmadụ ji enweta nnabata Chineke.
  rationale: Usoro okwu Grik buru ụzọ kwuo ichegharị na ịchịgharịkwute Chineke, mgbe participle πράσσοντας kọwara omume na-eso ha. “Omume ndị dabara na nchegharị ha” na-echekwa usoro na esemokwu ahụ n’enweghị itinye ozizi gbasara uru ọrụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. “Kwusaara” na-edobe ụda nkwupụta ozi n’ihu ọha; “ndị mba ọzọ” bụ okwu nkịtị maka ndị na-abụghị ndị Juu; “omume ndị dabara na nchegharị” na-ada nke ọma n’Igbo ma na-echekwa njikọ dị n’etiti nchegharị na omume.
