    reason: lexical_alternative
  revision_rationale: The revision makes the introductory clause more idiomatic, avoids an unnecessary possessive, and relocates footnote b to its proper lexical anchor. It retains the source’s sequence and presents deeds as conduct appropriate to repentance, without imposing a doctrinal interpretation.
