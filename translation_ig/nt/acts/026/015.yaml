  to: M wee sị, “Ị bụ onye, Onyenweanyị?”[a] Onyenweanyị wee sị, “Abụ m Jizọs, onye ị na-akpagbu.”
  rationale: The revision makes only orthographic and idiomatic corrections. It preserves the source’s ambiguity in κύριε through the footnote, retains “Onyenweanyị” in the main text in accordance with the immediate heavenly context and the subsequent identification as Jesus, and leaves the verse’s syntax and meaning unchanged.
