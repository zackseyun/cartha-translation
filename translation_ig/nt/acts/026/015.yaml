  text: ἐγὼ δὲ εἶπα· Τίς εἶ, κύριε; ὁ δὲ ⸀κύριος εἶπεν· Ἐγώ εἰμι Ἰησοῦς ὃν σὺ διώκεις·
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/015.yaml
  text: And I said[a], ‘Who are you, Lord?’ And the Lord said, ‘I am Jesus, whom you are persecuting.’
translation:
  language: ig
  text: M wee sị, “Ị bụ onye, Onyenweanyị?”[a] Onyenweanyị wee sị, “Abụ m Jizọs, onye ị na-akpagbu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Ị bụ onye, nna ukwu?” Okwu Grik κύριε pụrụ ịbụ okwu e ji nkwanye ùgwù akpọ mmadụ; ma n’ebe a, “Onyenweanyị” ka a họọrọ n’ihi na onye ahụ pụtara n’ọhụụ eluigwe kọwara onwe ya ozugbo dị ka Jizọs.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγὼ δὲ εἶπα
  choice: M wee sị
  rationale: δέ bụ njikọ akụkọ dị nro; “wee” na-eme ka usoro akụkọ gaa n’ihu n’Igbo nkịtị, ebe “M” na-egosi onye na-ekwu okwu n’enweghị ịgbakwunye nkwusi ike na-adịghị mkpa.
- source_word: Τίς εἶ, κύριε;
  choice: Ị bụ onye, Onyenwe anyị?
  rationale: τίς εἶ bụ ajụjụ gbasara njirimara. “Onyenwe anyị” na-eburu ibu nkwanye ùgwù na nke okpukpe nke κύριε n’ọnọdụ ọhụụ eluigwe a, ma a na-edebe ohere nke “nna anyị ukwu” na nkọwa ala peeji.
- source_word: ὁ δὲ κύριος εἶπεν
  choice: Onyenwe anyị wee sị
  rationale: ὁ κύριος na-akọwa onye ahụ a matalarị dị ka Onyenwe anyị; “wee sị” na-anọchi δὲ n’ụzọ akụkọ Igbo dị mma.
- source_word: Ἐγώ εἰμι Ἰησοῦς
  choice: Abụ m Jizọs
  rationale: Nke a bụ nkwupụta njirimara kpọmkwem. “Abụ m” na-enye ἐγώ εἰμι nke ọma n’enweghị ịgbakwunye nkwusi ike dịka “mụ onwe m.”
- source_word: ὃν σὺ διώκεις
  choice: onye ị na-akpagbu
  rationale: διώκεις n’ebe a pụtara imegide ma na-akpagbu mmadụ; usoro “na-akpagbu” na-egosi omume na-aga n’ihu, ebe “ị” na-anọchi σὺ n'ụzọ nkịtị.
theological_decisions:
- issue: Nsụgharị κύριε n’okwu Sọl na κύριος n’akụkọ onye kwuru okwu
  choice: Onyenwe anyị
  alternative: nna anyị ukwu
  rationale: Ọhụụ eluigwe na nzaghachi ozugbo, “Abụ m Jizọs,” na-akwado “Onyenwe anyị” n’isi ederede. Otú ọ dị, vocative κύριε pụrụ ịbụ okwu nkwanye ùgwù n’onwe ya, ya mere e debere nhọrọ ahụ n’ala peeji kama ihichapụ mgbagwoju anya ahụ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta, dee ya. Usoro “wee sị” na-eme ka akụkọ na-aga were were; e zere okwu ụka pụrụ iche na nkwusi ike a na-ahụghị n’asụsụ Grik.
