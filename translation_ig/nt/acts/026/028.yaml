  text: ὁ δὲ Ἀγρίππας πρὸς τὸν ⸀Παῦλον· Ἐν ὀλίγῳ με πείθεις Χριστιανὸν ⸀ποιῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/028.yaml
  text: Then Agrippa said to Paul[a], “In a short time you are persuading me to become a Christian.”
translation:
  language: ig
  text: Agripa wee sị Pọl[a], “N’oge dị mkpirikpi, ị na-eme ka m kweta ịghọ Onye Kraịst.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ịsụgharị ya: “Ọ fọrọ obere ka i mee ka m kweta ịghọ Onye Kraịst,” ma ọ bụ ikekwe, “Ì chere na n’oge dị mkpirikpi dị otu a ị ga-eme m Onye Kraịst?” Nkebiokwu Grik ahụ nwere ike ịpụta obere oge ma ọ bụ obere ogo; ụda okwu Agripa nwekwara ike ịbụ nke ezi obi ma ọ bụ nke ịkwa emo.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ δὲ Ἀγρίππας
  choice: Agripa wee
  rationale: δέ bụ njikọ dị nro; “wee” na-egosi usoro akụkọ n’Igbo n’etinyeghị esemokwu siri ike. E bugharịghị isiokwu Grik dị n’aha ahụ.
- source_word: πρὸς τὸν Παῦλον
  choice: sị Pọl
  rationale: πρός na usoro okwu a nwere ngwaa ikwu nke a na-aghọta n’agbanyeghị na edeghị ya; “sị Pọl” bụ ụzọ Igbo dị mkpirikpi ma doo anya isi gosi onye a gwara okwu.
- source_word: Ἐν ὀλίγῳ
  choice: N’ime obere oge
  rationale: Nkebiokwu ahụ nwere ike izo aka n’obere oge ma ọ bụ n’obere ogo. Nhọrọ a na-edebe nghọta nke oge n’ederede bụ isi, ebe nkọwa ala peeji na-echekwa nghọta ndị ọzọ.
- source_word: με πείθεις
  choice: ị na-eme ka m kweta
  rationale: πείθεις bụ ngwaa dị n’oge ugbu a ma na-egosi ime ka mmadụ kweta; usoro “ị na-eme ka m kweta” na-egosipụta ihe na-aga n’ihu n’okwu a na-akparịta.
- source_word: Χριστιανὸν
  choice: Onye Kraịst
  rationale: Nke a bụ aha Igbo a na-ejikarị eme ihe maka Χριστιανός, na-egosi njirimara ma ọ bụ ọnọdụ onye ahụ ga-abanye na ya.
- source_word: ποιῆσαι
  choice: ịghọ
  rationale: N’usoro πείθω tinyere onye a na-eme ihe na infinitive, ποιῆσαι na-egosi ime ka mmadụ bụrụ ihe. “Ịghọ” bụ Igbo sitere n’okike karịa ntụgharị mkpụrụokwu “ime m ka m bụrụ,” ma na-edebe echiche nke nsonaazụ ahụ.
theological_decisions:
- issue: Ụda olu na ike okwu Agripa
  choice: Okwu dị larịị nke na-egosi na Pọl na-eme ka Agripa kweta n’ime obere oge.
  alternative: Ọ pụrụ ịbụ okwu ịkwa emo ma ọ bụ ịjụ ajụjụ, “Ì chere na n’ime obere oge dị otu a ị ga-eme m Onye Kraịst?”; ma ọ bụ, “Ọ fọrọ obere ka i mee ka m kweta ịghọ Onye Kraịst.”
  rationale: Ἐν ὀλίγῳ na ụda okwu Agripa edoghị anya nke ọma. Ederede bụ isi na-edebe nghọta oge nke dị nso n’ụdị Grik, ebe nkọwa ala peeji na-echekwa ma nghọta nke ogo ma ohere na ọ bụ okwu ịkwa emo, n’ebughị ụzọ kpebie ebumnuche Agripa.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke oge a ma dị ùgwù. Ahịrịokwu ahụ dị mfe nghọta nye ndị nkịtị; e debere mgbagwoju anya dị n’Ἐν ὀλίγῳ na ụda okwu Agripa site na nkọwa ala peeji.
