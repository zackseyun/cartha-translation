  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Τὴν μὲν οὖν βίωσίν μου ⸀τὴν ἐκ νεότητος τὴν ἀπ’ ἀρχῆς γενομένην ἐν τῷ ἔθνει μου ἔν ⸀τε Ἱεροσολύμοις ἴσασι ⸀πάντες Ἰουδαῖοι,
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/004.yaml
  text: So then[a], all the Jews know my manner of life from my youth, which from the beginning took place among my own nation and also in Jerusalem,
translation:
  language: ig
  text: Ya mere, ndị Juu niile maara ụzọ m si ebi ndụ[a] site n’oge m bụ nwata—ụzọ m si biri site ná mmalite n’etiti ndị obodo m nakwa na Jerusalem,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ndụ m” ma ọ bụ “ụzọ m si ebi ndụ.” Okwu Grik a na-ekwu banyere ụzọ Pọl si ebi ndụ, ọ bụghị naanị ịdị ndụ ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: βίωσίν
  choice: otú m si bie ndụ
  rationale: Nkebiokwu a na-egosi ụzọ Pọl si ebi ndụ na omume ndụ ya, ọ bụghị naanị ịdị ndụ ya; ọ bụkwa okwu Igbo dị mfe ma doo anya.
- source_word: ἐκ νεότητος
  choice: kemgbe m bụ okorobịa
  rationale: Nke a na-egosi na ihe Pọl na-ekwu malitere n’oge ọ bụ nwata nwoke toro eto; ‘kemgbe’ na-echekwa echiche nke mmalite na ịga n’ihu ruo oge e kwuru okwu.
- source_word: ἀπ’ ἀρχῆς
  choice: site ná mmalite
  rationale: Ọ na-echekwa nkwusi ike nke okwu Grik banyere oge ndụ ahụ malitere.
- source_word: γενομένην
  choice: ndụ m biri
  rationale: N’ihi na participle a na-akọwa βίωσιν, nsụgharị a na-egosi n’Igbo n’ụzọ nkịtị na ọ bụ ndụ Pọl biri n’ebe ndị a.
- source_word: ἐν τῷ ἔθνει μου
  choice: n’etiti ndị nke m
  rationale: ἔθνος ebe a bụ agbụrụ ma ọ bụ ndị Pọl, ọ bụghị mba ndọrọ ndọrọ ọchịchị nke oge a; okwu a na-ewepụta echiche ahụ n’Igbo nke ọma.
- source_word: ἔν τε Ἱεροσολύμοις
  choice: nakwa na Jerusalem
  rationale: ‘Nakwa’ na-egosi ike njikọ τε, na-agbakwụnye Jerusalem n’ebe ndụ Pọl mere.
- source_word: ἴσασι
  choice: maara
  rationale: Ụdị Grik a nwere nghọta nke ugbu a, ya mere ‘maara’ bụ nsụgharị Igbo dabara adaba.
- source_word: πάντες Ἰουδαῖοι
  choice: ndị Juu niile
  rationale: Nke a bụ nsụgharị kpọmkwem ma na-edobe njirimara agbụrụ nke okwu Grik n’enweghị ime ka ọ dị nro.
- source_word: μὲν οὖν
  choice: Ya mere
  rationale: Ọ na-egosi ntụgharị na ịga n’ihu n’okwu Pọl n’ụzọ Igbo dị mma.
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ugwu ma dị mfe nghọta, sụgharịa amaokwu a. Akara ogologo (—) na-eme ka nkọwa nke abụọ banyere ndụ Pọl doo anya, ebe rikoma ikpeazụ na-egosi na ahịrịokwu ahụ na-aga n’ihu n’amaokwu na-esote.
