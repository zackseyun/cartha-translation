  text: Ἀγρίππας δὲ τῷ Φήστῳ ἔφη· Ἀπολελύσθαι ἐδύνατο ὁ ἄνθρωπος οὗτος εἰ μὴ ἐπεκέκλητο Καίσαρα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/032.yaml
  text: Then Agrippa said to Festus[a], “This man could have been released if he had not appealed to Caesar.”
translation:
  language: ig
  text: Agrịpa wee sị Festọs[a], “A gaara atọhapụ nwoke a ma a sị na ọ kpọkụghị Siza.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Enwere ike ịtọhapụ nwoke a ma a sị na ọ kpọkụghị Siza.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Mgbe ahụ
  rationale: N'ebe a, δέ na-egosi ngafe n'akụkọ gaa n'okwu ikpeazụ Agrịpa kwuru; ‘Mgbe ahụ’ na-enye Igbo dị eke ma na-edobe njikọ ahụ.
- source_word: ἔφη
  choice: gwara ... sị
  rationale: Ọ bụ ụzọ Igbo nkịtị na nke doro anya si ewebata okwu mmadụ gwara onye ọzọ, n'agbanyeghị na ụdị Grik bụ imperfect.
- source_word: Ἀπολελύσθαι
  choice: ahapụ ... ka ọ laa
  rationale: ἀπολύω n'ọnọdụ ikpe a pụtara ịtọhapụ ma ọ bụ ikwe ka onye ahụ laa; nhọrọ a anaghị eme ka ọ bụrụ kpọmkwem ikpe ịsachasị mmadụ n'ikpe.
- source_word: ἐδύνατο
  choice: A gaara
  rationale: N'usoro a, δύναμαι na-egosi ihe gaara ekwe omume ma o meghị; ‘A gaara’ na-eweta nke a n'Igbo n'ụzọ dị eke.
- source_word: ὁ ἄνθρωπος οὗτος
  choice: nwoke a
  rationale: Ọ na-ezo aka n'otu nwoke a maara, ya bụ Pọl, ma na-edobe ike okwu ngosi οὗτος.
- source_word: εἰ μὴ
  choice: ma a sị na ...ghị
  rationale: 'Usoro a na-egosi ọnọdụ megidere ihe mere eme: a gaara ahapụ ya, ma arịrịọ ya gbochiri nke ahụ.'
- source_word: ἐπεκέκλητο
  choice: rịọghị ... ka o kpee okwu ya
  rationale: N'ọnọdụ iwu Rom, ἐπικαλέω Καίσαρα pụtara ịrịọ ka Siza nụrụ ma kpee okwu ikpe ahụ; ntụgharị a na-eme ka nghọta iwu ahụ doo onye Igbo anya.
- source_word: Καίσαρα
  choice: Siza
  rationale: ‘Siza’ na-edobe aha-ọkwa akụkọ ihe mere eme na usoro iwu dị na Grik kama iji nkọwa sara mbara dịka ‘eze ukwu.’
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E debere ụda okwu ikpe Agrịpa kwuru n'enweghị ịgbakwunye na a mara Pọl ikpe ma ọ bụ na a sachasịla ya n'ikpe.
