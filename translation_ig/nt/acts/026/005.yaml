source:
  edition: SBLGNT
  text: προγινώσκοντές με ἄνωθεν, ἐὰν θέλωσι μαρτυρεῖν, ὅτι κατὰ τὴν ἀκριβεστάτην αἵρεσιν τῆς ἡμετέρας θρησκείας ἔζησα Φαρισαῖος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/005.yaml
  text: They have known me from the beginning[a], if they are willing to testify[b], that I lived as a Pharisee according to the strictest sect of our religion.
translation:
  language: ig
  text: Ndị a amarala m site na mbụ. Ọ bụrụ na ha dị njikere ịgba akaebe, ha ga-agba akaebe na ebiri m ndụ dịka onye Farisii, n’usoro òtù kacha akpachapụ anya n’okpukpe anyị.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Okwu Grik a bụ αἵρεσις; n’ebe a ọ pụtara “òtù” ma ọ bụ “ngalaba,” ọ bụghị “ozizi ụgha” n’echiche pụrụ iche e nyere ya mgbe e mesịrị.
    reason: lexical_alternative
lexical_decisions:
- source_word: προγινώσκοντές με
  choice: Ha maara m
  rationale: N’ọnọdụ a, okwu ahụ na-egosi na ndị ahụ maara Pọl tupu oge ikpe a ma nọgide na-ama onye ọ bụ; ‘Ha maara m’ bụ ụzọ Igbo dị mfe ma bụrụkwa nke okike isi kwuo ya.
- source_word: ἄνωθεν
  choice: kemgbe mbụ
  rationale: N’ebe a ọ pụtara site ná mmalite ma ọ bụ site n’oge gara aga, ọ bụghị ‘site n’elu.’
- source_word: ἐὰν θέλωσι μαρτυρεῖν
  choice: ọ bụrụ na ha dị njikere ịgba akaebe
  rationale: θέλωσι na-egosi ịdị njikere, ebe μαρτυρεῖν bụ okwu metụtara ịgba akaebe n’ọnọdụ ikpe.
- source_word: κατὰ
  choice: n’usoro
  rationale: N’ebe a ọ na-egosi usoro ma ọ bụ ụkpụrụ otu okpukpe ahụ nke Pọl gbasoro ná ndụ ya.
- source_word: ἀκριβεστάτην
  choice: kacha sie ike
  rationale: Ọ bụ ụdị nkwubiga nke na-egosi otu kacha agbasosi ụkpụrụ ya ike; ntụgharị a bụ nke nkịtị ma doo anya n’Igbo.
- source_word: αἵρεσιν
  choice: otu
  rationale: N’Ọrụ Ndị Ozi, okwu a na-ezo aka n’otu ma ọ bụ òtù a maara nke ọma n’etiti ndị Juu, ọ bụghị ozizi ụgha n’echiche e nyere okwu ‘heresy’ mgbe e mesịrị.
- source_word: τῆς ἡμετέρας θρησκείας
  choice: n’okpukpe anyị
  rationale: Ọ na-ezo aka n’okpukpe ndị Juu nke Pọl na ndị na-ege ya ntị nwere njikọ ọnụ na ya.
- source_word: ἔζησα Φαρισαῖος
  choice: ebiri m ndụ dị ka onye Farisii
  rationale: Nke a na-achịkọta ụzọ ndụ Pọl n’oge gara aga ma na-egosi njirimara ya dị ka onye Farisii.
theological_decisions:
- issue: Ihe αἵρεσις pụtara n’akụkọ banyere okpukpe ndị Juu
  choice: otu
  alternative: òtù ozizi ụgha
  rationale: N’amaokwu a, okwu ahụ na-akọwa ndị Farisii dị ka otu dị n’ime okpukpe ndị Juu. Ịsụgharị ya dị ka ‘òtù ozizi ụgha’ ga-etinye echiche nkà mmụta okpukpe nke oge e mesịrị n’ihe odide ahụ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta mee ntụgharị ahụ. E tinyere akara [b] n’akụkụ ‘otu,’ nke bụ okwu αἵρεσις footnote ahụ na-akọwa; nke a na-ezere njikọ na-ezighị ezi ya na ‘ịgba akaebe.’
