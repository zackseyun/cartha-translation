revisions:
- from: Ha maara m kemgbe mbụ[a]; ọ bụrụ na ha dị njikere ịgba akaebe, ha pụrụ ikwu na ebiri m ndụ dị ka onye Farisii n’usoro otu[b] kacha sie ike n’okpukpe anyị.
  to: Ndị a amarala m site na mbụ. Ọ bụrụ na ha dị njikere ịgba akaebe, ha ga-agba akaebe na ebiri m ndụ dịka onye Farisii, n’usoro òtù kacha akpachapụ anya n’okpukpe anyị.[a]
  rationale: The revision retains the source’s legal setting and its conditional appeal for testimony, while making the testimony clause explicit and idiomatic in Igbo. It renders ἀκριβεστάτην as exceptional rigor rather than mere difficulty and places the αἵρεσις note directly after ‘òtù.’ The alternative senses of ἄνωθεν are not required in a footnote because ‘site na mbụ’ is a clear, source-faithful contextual rendering.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T10:23:03Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly identifies the Pharisees as the most rigorous recognized group within Judaism and appropriately avoids the later technical sense of αἵρεσις as ‘heresy.’ However, ‘ha pụrụ ikwu’ adds a possibility/ability nuance after the conditional rather than directly expressing the requested testimony, and ‘kacha sie ike’ can naturally mean physically hard or difficult rather than rigorous/strict.
  naturalness: The proposed revision uses a clear conditional-testimonial construction in modern Standard Igbo. ‘Òtù kacha akpachapụ anya’ naturally conveys the comparative rigor intended by ἀκριβεστάτην in this context.
  terminology: ‘Onye Farisii,’ ‘òtù,’ and ‘okpukpe anyị’ are suitable. The footnote should consistently use ‘òtù’ for a religious party/group, rather than offering unmarked ‘otu,’ which can primarily mean ‘one.’
  issues:
  - severity: medium
    issue: The clause ‘ha pụrụ ikwu na’ does not directly render the conditional invitation to testify.
    rationale: ἐὰν θέλωσι μαρτυρεῖν is ‘if they are willing to testify.’ Rendering it with ‘pụrụ ikwu’ introduces ability/possibility and weakens the forensic sense of μαρτυρεῖν.
  - severity: medium
    issue: ‘kacha sie ike’ is semantically imprecise for ἀκριβεστάτην.
    rationale: In ordinary Igbo it may suggest what is hard or difficult. Here Paul refers to the Pharisees’ especially exacting or rigorous religious observance; ‘kacha akpachapụ anya’ conveys this more naturally.
  - severity: low
    issue: The αἵρεσις footnote gives ‘otu’ alongside ‘òtù.’
    rationale: For the intended sense of a recognized group or party, ‘òtù’ is clearer and avoids ambiguity with ‘otu’ (‘one’).
  revised_text: Ndị a amarala m site na mbụ. Ọ bụrụ na ha dị njikere ịgba akaebe, ha ga-agba akaebe na ebiri m ndụ dịka onye Farisii, n’usoro òtù kacha akpachapụ anya n’okpukpe anyị.[a]
  revised_footnotes:
  - marker: a
    text: Okwu Grik a bụ αἵρεσις; n’ebe a ọ pụtara “òtù” ma ọ bụ “ngalaba,” ọ bụghị “ozizi ụgha” n’echiche pụrụ iche e nyere ya mgbe e mesịrị.
    reason: lexical_alternative
  revision_rationale: The revision retains the source’s legal setting and its conditional appeal for testimony, while making the testimony clause explicit and idiomatic in Igbo. It renders ἀκριβεστάτην as exceptional rigor rather than mere difficulty and places the αἵρεσις note directly after ‘òtù.’ The alternative senses of ἄνωθεν are not required in a footnote because ‘site na mbụ’ is a clear, source-faithful contextual rendering.
