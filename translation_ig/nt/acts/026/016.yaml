id: ACT.26.16
reference: Acts 26:16
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀλλὰ ἀνάστηθι καὶ στῆθι ἐπὶ τοὺς πόδας σου· εἰς τοῦτο γὰρ ὤφθην σοι, προχειρίσασθαί σε ὑπηρέτην καὶ μάρτυρα ὧν τε εἶδές ⸀με ὧν τε ὀφθήσομαί σοι,
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/016.yaml
  text: 'But rise and stand on your feet[a], for I have appeared to you for this purpose: to appoint you as a servant and witness both of the things in which you have seen me and of the things in which I will appear to you,'
translation:
  language: ig
  text: 'Ma bilie, guzo n’ụkwụ gị; n’ihi na ọ bụ maka nke a ka m pụtara ìhè nye gị: ka m họpụta gị ka ị bụrụ onye na-ejere m ozi na onye akaebe banyere ma ihe ndị ị hụrụ m n’ime ha ma ihe ndị m ga-apụta ìhè nye gị n’ime ha.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ, n’ụzọ nkịtị karịa: “banyere ihe ndị ị hụrụ m n’ime ha na ihe ndị m ga-apụta ìhè nye gị n’ime ha.” Usoro okwu Grik a pịkọrọ ọnụ; a sụgharịala ya n’ụzọ na-echekwa asụsụ mpụta ahụ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνάστηθι
  choice: bilie
  rationale: Iwu a na-akpọ ka e mee ihe ozugbo; “bilie” bụ okwu Igbo doro anya ma kwekọọ n’ihe a na-ekwu.
- source_word: στῆθι ἐπὶ τοὺς πόδας σου
  choice: guzo ọtọ n’ụkwụ gị
  rationale: Nke a na-edobe onyonyo ahụ nke iwu ka ọ kwụrụ n’ụkwụ ya, ma bụrụkwa Igbo a na-aghọta nke ọma.
- source_word: εἰς τοῦτο γὰρ
  choice: n’ihi na ọ bụ maka nke a
  rationale: Ọ na-egosi nzube nke mpụta ahụ, na-enweghị ịgbakwunye nkọwa na-adịghị na Grik.
- source_word: ὤφθην σοι
  choice: m pụta ìhè nye gị
  rationale: Ọ na-echekwa asụsụ nke mpụta onwe onye dị na ὤφθην, kama ime ya naanị ‘ị hụrụ m’ ma ọ bụ ‘ekpughere m onwe m.’
- source_word: προχειρίσασθαί σε
  choice: ịhọpụta gị
  rationale: N’ọnọdụ a ọ pụtara ịhọrọ ma tinye onye ahụ n’ọrụ a kapịrị ọnụ; “ịhọpụta” na-egosi ọrụ enyere ya nke ọma.
- source_word: ὑπηρέτην
  choice: onye na-ejere m ozi
  rationale: Ọ na-egosi onye nọ n’okpuru onye ọzọ na-arụ ọrụ ya, na-enweghị ụda ọkwa ụka pụrụ iche.
- source_word: μάρτυρα
  choice: onye akaebe
  rationale: Nke a bụ okwu Igbo a na-ejikarị akọwa onye na-agba akaebe banyere ihe ọ hụrụ ma ọ bụ mara.
- source_word: ὧν τε εἶδές με
  choice: ihe ndị ị hụrụ m n’ime ha
  rationale: Nke a na-agbalị idobe njikọ Grik a pịkọrọ ọnụ ma ghara ikpebi n’ime ederede ma ọ bụ ‘ihe ị hụrụ banyere m’ ka ọ pụtara.
- source_word: ὧν τε ὀφθήσομαί σοι
  choice: ihe ndị m ga-apụta ìhè nye gị n’ime ha
  rationale: Ọ na-edobe ngwaa mpụta ahụ n’ọdịnihu ma na-echekwa njikọ a pịkọrọ ọnụ nke Grik.
theological_decisions:
- issue: Ụdị mkpughe dị na ὤφθην na ὀφθήσομαί
  choice: A sụgharịrị ha abụọ dịka “pụta ìhè nye gị.”
  alternative: “ị hụrụ m / ị ga-ahụ m” ma ọ bụ “ekpughere m onwe m / m ga-ekpughere gị onwe m.”
  rationale: Nhọrọ ahụ na-echekwa echiche nke Jizọs pụtara n’onwe ya nye Pọl, ma ọ naghị ekpebi kpọmkwem ụzọ mpụta ahụ si mee.
- issue: Njikọ a pịkọrọ ọnụ dị na ὧν ... ὧν
  choice: E debere usoro “ihe ndị ... n’ime ha” n’ederede, tinyekwa nkọwa ọzọ n’ala peeji.
  alternative: “ihe ị hụrụ banyere m na ihe m ga-egosi gị.”
  rationale: Grik ahụ nwere nghọta siri ike ma na-edoghị anya n’ụzọ zuru ezu; nsụgharị ahụ na-ezere idozi esemokwu ahụ n’amaghị ama.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. A zere okwu ụka pụrụ iche; e debere asụsụ mpụta na nhọpụta ọrụ nke amaokwu ahụ.
