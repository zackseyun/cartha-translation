revisions:
- from: 'Ma bilie, guzo ọtọ n’ụkwụ gị, n’ihi na ọ bụ maka nke a ka m ji pụta ìhè nye gị: ịhọpụta gị ka ị bụrụ onye na-ejere m ozi na onye akaebe banyere ma ihe ndị ị hụrụ m n’ime ha ma ihe ndị m ga-apụta ìhè nye gị n’ime ha.[a]'
  to: 'Ma bilie, guzo n’ụkwụ gị; n’ihi na ọ bụ maka nke a ka m pụtara ìhè nye gị: ka m họpụta gị ka ị bụrụ onye na-ejere m ozi na onye akaebe banyere ma ihe ndị ị hụrụ m n’ime ha ma ihe ndị m ga-apụta ìhè nye gị n’ime ha.[a]'
  rationale: The revision corrects the aspect of the initial appearance, uses more idiomatic Standard Igbo for the command to stand, and repairs the footnote so that it does not replace Jesus’ future appearance with a causative act of making Paul see. The difficult, compressed relationship expressed by the two relative clauses is retained rather than doctrinally resolved.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T10:23:35Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves the paired commands, the purpose of the appearance, the commissioning as servant and witness, and the future appearance language. However, “ka m ji pụta ìhè” is aspectually awkward for the completed appearance in ὤφθην, and the footnote’s “m ga-eme ka ị hụ” changes the future appearance verb into causative seeing.
  naturalness: “Guzo n’ụkwụ gị” is more natural Standard Igbo than “guzo ọtọ n’ụkwụ gị.” The revised wording also makes the purpose clause and commissioning construction idiomatic while retaining the compressed relative construction as far as Igbo permits.
  terminology: “Pụtara ìhè nye gị” appropriately renders the appearance language without specifying its mode. “Onye na-ejere m ozi” and “onye akaebe” are suitable renderings of ὑπηρέτης and μάρτυς. The revised footnote retains appearance language rather than recasting it as merely making Paul see.
  issues:
  - severity: medium
    issue: The verbal form “ka m ji pụta ìhè nye gị” does not naturally express the completed appearance of ὤφθην in this context.
    rationale: The Greek aorist refers to the appearance that has occurred; “m pụtara ìhè nye gị” is the natural Igbo form here.
  - severity: high
    issue: The footnote’s alternative, “m ga-eme ka ị hụ,” does not preserve ὀφθήσομαί σοι.
    rationale: The Greek retains appearance/revelation language in the future; a causative ‘make you see’ introduces a different verbal sense.
  - severity: low
    issue: “Guzo ọtọ n’ụkwụ gị” is somewhat redundant and less idiomatic.
    rationale: “Guzo n’ụkwụ gị” naturally conveys the bodily command while preserving the source image.
  revised_text: 'Ma bilie, guzo n’ụkwụ gị; n’ihi na ọ bụ maka nke a ka m pụtara ìhè nye gị: ka m họpụta gị ka ị bụrụ onye na-ejere m ozi na onye akaebe banyere ma ihe ndị ị hụrụ m n’ime ha ma ihe ndị m ga-apụta ìhè nye gị n’ime ha.[a]'
  revised_footnotes:
