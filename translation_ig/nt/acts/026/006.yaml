source:
  edition: SBLGNT
  text: καὶ νῦν ἐπ’ ἐλπίδι τῆς ⸀εἰς τοὺς πατέρας ⸀ἡμῶν ἐπαγγελίας γενομένης ὑπὸ τοῦ θεοῦ ἕστηκα κρινόμενος,
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/006.yaml
  text: And now I stand on trial because of the hope of the promise made by God to our fathers,[a]
translation:
  language: ig
  text: Na ugbu a, a na-ekpe m ikpe n’ihi olileanya nke nkwa ahụ Chineke kwere ndị nna nna anyị.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ndị nna ochie anyị.” Grik kwuru “ndị nna anyị,” nke na-ezo aka ná ndị nna nna Izrel.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ νῦν
  choice: Ma ugbu a
  rationale: Ọ na-ejikọta okwu a na ihe Pọl kwuru tupu ya ma gosi ọnọdụ ya ugbu a; “Ma ugbu a” dabara n'Igbo dị ndụ n'ebe a.
- source_word: ἐπ’ ἐλπίδι
  choice: n’ihi olileanya
  rationale: ἐπί tinyere dative n'ebe a na-egosi ihe kpatara ikpe ahụ ma ọ bụ ihe ọ dabeere na ya; “n’ihi olileanya” na-enye echiche ahụ n'ụzọ doro anya.
- source_word: ἐπαγγελίας
  choice: nkwa
  rationale: Genitive ahụ jikọtara nkwa na olileanya ahụ. “Nkwa” bụ okwu Igbo kwụ ọtọ ma doo anya maka ihe Chineke kwere.
- source_word: τῆς εἰς τοὺς πατέρας ἡμῶν ἐπαγγελίας
  choice: nkwa ahụ Chineke kwere ndị nna nna anyị
  rationale: εἰς τοὺς πατέρας ἡμῶν na-egosi ndị e kwere nkwa ahụ; n'Igbo, usoro “nkwa ... kwere ndị ...” na-egosipụta mmekọrịta a nke ọma.
- source_word: γενομένης ὑπὸ τοῦ θεοῦ
  choice: Chineke kwere
  rationale: Participial phrase ahụ na-ekwu na nkwa ahụ sitere n'aka Chineke. Igbo na-eji “Chineke kwere nkwa” eme ka onye mere ya pụta ìhè n'ụzọ nkịtị.
- source_word: πατέρας ἡμῶν
  choice: ndị nna nna anyị
  rationale: N'okwu a, ọ na-ezo aka n'otú ndị Juu si akpọ ndị nna ha ochie, karịsịa ndị nna nna Izrel. “Ndị nna nna anyị” na-echekwa ọdịdị nwoke nke okwu Grik ma bụrụkwa Igbo a na-aghọta nke ọma.
- source_word: ἕστηκα κρινόμενος
  choice: a na-ekpe m ikpe
  rationale: N'agbanyeghị na ἕστηκα pụtara n'ụzọ nkịtị “eguzoro m,” ya na κρινόμενος na-akọ ọnọdụ Pọl n'ụlọ ikpe. “A na-ekpe m ikpe” bụ ụzọ Igbo sitere n'okike isi kwuo ọnọdụ iwu ahụ n'emebighị ihe ọ pụtara.
theological_decisions:
- issue: Ndị “nna nna anyị” bụ ndị ole?
  choice: Ndị nna nna Izrel bụ́ ndị e kwere nkwa Chineke
  alternative: Ndị nna ochie nke ndị Juu n'ozuzu ha
  rationale: N'okwu Pọl n'ihu Agrịpa, ahịrịokwu a na-akpọghachi akụkọ ọgbụgba ndụ Izrel na ndị nna nna ha. Isiokwu ahụ anaghị akọwapụta aha ha, ya mere nsụgharị ahụ anaghị emechi nghọta ahụ karịa ka Grik mere.
translation_notes:
  register: Ejiri Standard Igbo nke dị ugbu a, dị ùgwù ma dị mfe nghọta. E debere okwu ikpe n'ụzọ sitere n'okike, ma e chekwara njikọ dị n'etiti olileanya na nkwa Chineke.
