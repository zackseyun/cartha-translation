revisions:
- from: N’ihi na eze maara ihe ndị a nke ọma, ọ bụkwa ya ka m ji nkwuwa okwu na-agwa okwu.[a] Ekwenyesiri m ike na ọ dịghị otu n’ime ihe ndị a nke ọ na-amaghị,[b] n’ihi na e meghị ihe a n’otu akụkụ zoro ezo.[c]
  to: N’ihi na eze maara banyere ihe ndị a; ana m agwakwa ya okwu n’atụghị egwu.[a] N’ihi na ekwenyesiri m ike na ọ dịghị nke ọ bụla n’ihe ndị a zoro ya ezo,[b] n’ihi na e meghị ihe a n’otu nkuku.[c]
  rationale: The revision removes an added intensifier from ἐπίσταται, makes Paul's bold address idiomatic in modern Standard Igbo, and replaces an unnatural calque for ἐν γωνίᾳ with “n’otu nkuku.” The demonstrative “ihe a” remains appropriately broad, and all footnote anchors are retained in their proper locations.
