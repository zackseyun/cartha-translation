id: ACT.26.26
reference: Acts 26:26
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐπίσταται γὰρ περὶ τούτων ὁ βασιλεύς, πρὸς ὃν ⸀καὶ παρρησιαζόμενος λαλῶ· λανθάνειν γὰρ ⸀αὐτὸν τούτων οὐ πείθομαι ⸀οὐθέν, οὐ γάρ ⸀ἐστιν ἐν γωνίᾳ πεπραγμένον τοῦτο.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/026.yaml
  text: For the king knows about these things[a], and I speak boldly to him. For I am persuaded that none of these things has escaped his notice[c][b], because this has not been done in a corner.
translation:
  language: ig
  text: N’ihi na eze maara banyere ihe ndị a; ana m agwakwa ya okwu n’atụghị egwu.[a] N’ihi na ekwenyesiri m ike na ọ dịghị nke ọ bụla n’ihe ndị a zoro ya ezo,[b] n’ihi na e meghị ihe a n’otu nkuku.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ana m agwa ya okwu n’ezoghị ọnụ.” Okwu Grik ahụ na-egosi ikwu okwu n’olu nwere obi ike, n’ezoghị ọnụ, na n’atụghị egwu.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, “ọ dịghị ihe ọ bụla n’ihe ndị a zoro ya ezo,” ma ọ bụ “ọ dịghị ihe ọ bụla n’ihe ndị a ọ na-amaghị.”
    reason: lexical_alternative
  - marker: c
    text: “E meghị ihe a n’otu nkuku” na-edobe akpaala okwu Grik ahụ. Ọ pụtara na e meghị ya na nzuzo ma ọ bụ n’ụzọ ndị mmadụ na-agaghị ama.
    reason: cultural_note
lexical_decisions:
- source_word: ἐπίσταται
  choice: maara ... nke ọma
  rationale: Ngwaa a na-egosi ịma ihe ma ọ bụ ịbụ onye maara ya nke ọma; okwu a na-egosipụta na eze maara ihe ndị a nke ọma.
- source_word: περὶ τούτων
  choice: ihe ndị a
  rationale: Ọ na-ezo aka n’ihe ndị Pọl na-ekwu maka ha, n’ụzọ dị mfe ma bụrụkwa Igbo nkịtị.
- source_word: παρρησιαζόμενος
  choice: ji nkwuwa okwu
  rationale: Ọ na-egosi ikwu okwu n’atụghị egwu, n’ezoghị ọnụ, na n’obi siri ike.
- source_word: πρὸς ὃν ... λαλῶ
  choice: ọ bụkwa ya ka m ... na-agwa okwu
  rationale: Nhazi a bụ Igbo sitere n’ọnụ ma na-edobe na Pọl na-agwa eze okwu kpọmkwem.
- source_word: λανθάνειν ... αὐτὸν
  choice: nke ọ na-amaghị
  rationale: N’ebe a λανθάνω pụtara ihe zoro mmadụ ma ọ bụ ihe mmadụ na-ahụghị; nsụgharị a na-enye echiche ahụ n’Igbo doro anya.
- source_word: οὐ πείθομαι οὐθέν
  choice: Ekwenyesiri m ike na ọ dịghị otu
  rationale: Ọ na-egosi nkwenye siri ike Pọl nwere na ọ dịghị nke ọ bụla furu eze n’amaghị ama.
- source_word: πεπραγμένον
  choice: e meghị
  rationale: Ọ bụ ọdịdị zuru ezu nke πράσσω, ya mere ọ na-ezo aka n’ihe e mere ma mezue.
- source_word: ἐν γωνίᾳ
  choice: n’otu akụkụ zoro ezo
  rationale: A na-edobe onyonyo nke ‘akụkụ’ ma mee ka ihe ọ pụtara—ọ bụghị na nzuzo ma ọ bụ n’ebe mmadụ na-agaghị ama—doo anya n’Igbo.
- source_word: τοῦτο
  choice: ihe a
  rationale: Ọ na-ahapụ oke ihe a na-ezo aka na ya ka ọ saa mbara dịka Grik si mee, n’akọwaghị ya karịa ederede.
theological_decisions:
- issue: Oke ihe “ihe a” na-ezo aka na ya na ọdịdị ọhaneze nke ihe ndị ahụ
  choice: A hapụrụ ya dịka “ihe a,” nke na-egosi ihe ndị mmadụ pụrụ ịma n’emeghị ka ihe ọ na-ezo aka na ya dị warara.
  alternative: Ịkọwa ya kpọmkwem dịka ọnwụ na mbilite n’ọnwụ Jizọs naanị, ma ọ bụ dịka ngagharị Ndị Kraịst dum na ikpe Pọl.
  rationale: Amaokwu ahụ akọwaghị oke ihe τοῦτο na-ezo aka na ya n’ụzọ kpọmkwem; ya mere nsụgharị ahụ na-echekwa obosara na mgbagwoju anya dị n’ederede.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. E chekwara nkwuwa okwu Pọl na onyonyo akpaala okwu Grik, ma e nyere nkọwa n’ala ala peeji ebe ọ dị mkpa.
