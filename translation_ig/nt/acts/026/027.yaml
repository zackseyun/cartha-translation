id: ACT.26.27
reference: Acts 26:27
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: πιστεύεις, βασιλεῦ Ἀγρίππα, τοῖς προφήταις; οἶδα ὅτι πιστεύεις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/027.yaml
  text: King Agrippa, do you believe the prophets? I know that you do believe.
translation:
  language: ig
  text: Eze Agrịpa, ì kwere ihe ndị amụma kwuru[a]? Ama m na i kwere.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ì kwere ndị amụma?” ma ọ bụ “ì tụkwasịrị ndị amụma obi?”
    reason: lexical_alternative
lexical_decisions:
- source_word: πιστεύεις
  choice: ì kwere
  rationale: Ngwaa a dị n'ụdị ajụjụ a na-ajụ otu onye, n'oge ugbu a. “Ì kwere” bụ ụzọ Igbo nkịtị na nke doro anya si egosi ịnakwere ihe akaebe ndị amụma kwuru.
- source_word: βασιλεῦ Ἀγρίππα
  choice: Eze Agrịpa
  rationale: A sụgharịrị aha ọkwá βασιλεῦ dị ka “Eze,” ma degharịa aha Ἀγρίππα n'ụdị dabara n'usoro mkpọpụta na odide Igbo.
- source_word: τοῖς προφήταις
  choice: ihe ndị amụma kwuru
  rationale: Ọ bụ ezie na Grik kwuru kpọmkwem “ndị amụma,” n'okwu a ihe a na-ekwere bụ akaebe ma ọ bụ ozi ha. Nke a na-ada n'ụzọ ebumpụta ụwa n'Igbo ma na-edebe ihe okwu ahụ pụtara n'ọnọdụ ya.
- source_word: οἶδα
  choice: Ama m
  rationale: Ngwaa Grik a nwere nghọta nke oge ugbu a n'ebe a; “Ama m” na-edebe nkwupụta Pọl n'ụzọ kwụ ọtọ.
- source_word: ὅτι πιστεύεις
  choice: na i kwere
  rationale: E debeghachiri otu ngwaa ahụ maka ịdị n'otu. N'Igbo, usoro okwu na ọnọdụ ajụjụ ahụ na-enye nkwupụta ikpeazụ ahụ ike n'enweghị itinye okwu enyemaka na-adịghị mkpa.
theological_decisions:
- issue: Ụdị okwukwe e nwere n'okwu “ikwere ndị amụma”
  choice: E gosiri ya dị ka ikwere ihe ndị amụma kwuru, ya bụ, ịnakwere akaebe ha.
  alternative: Ịnakwere ndị amụma; ịtụkwasị ndị amụma obi.
  rationale: πιστεύω ya na dative nwere ike ịpụta ikwere mmadụ ma ọ bụ ịnakwere akaebe ya. Nsụgharị a na-eme ka Igbo doo anya, ma ihe e dere n'ala peeji na-edebe ụzọ ndị ọzọ okwu Grik ahụ nwere ike isi pụta; ọ naghị etinye ozizi sara mbara karịa arịrịọ Pọl nyere Agrịpa.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị mfe ma dị ùgwù. “Eze Agrịpa” bụ okwu ịkpọ onye ahụ ihu n'ihu; akara ụda olu dị na “ì” na-egosi ajụjụ nke ọma.
