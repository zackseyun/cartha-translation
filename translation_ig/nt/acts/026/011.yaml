  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ κατὰ πάσας τὰς συναγωγὰς πολλάκις τιμωρῶν αὐτοὺς ἠνάγκαζον βλασφημεῖν, περισσῶς τε ἐμμαινόμενος αὐτοῖς ἐδίωκον ἕως καὶ εἰς τὰς ἔξω πόλεις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/011.yaml
  text: And in all the synagogues[a], punishing them many times, I tried to force them to blaspheme; and being exceedingly enraged against them, I kept persecuting them even to the foreign cities.
translation:
  language: ig
  text: N’ụlọ nzukọ ndị Juu niile, ọtụtụ mgbe, m na-atakarị ha ahụhụ ma na-agbalị ịmanye ha ikwu okwu nkwulu; n’oke iwe m megide ha, anọgidere m na-akpagbu ha ruo ọbụna n’obodo ndị dị n’èzí[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’okwu nkịtị, ‘obodo ndị dị n’èzí.’ O nwere ike ịbụ obodo ndị dị ná mpụga Judia.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ πάσας τὰς συναγωγάς
  choice: N’ụlọ nzukọ ndị Juu niile
  rationale: 'Κατά na accusative nwere nghọta nkesa ebe a: ihe a mere n’ụlọ nzukọ dị iche iche niile. Ịtinye ‘ndị Juu’ na-eme ka ‘ụlọ nzukọ’ doo onye Igbo nke oge a anya n’ebughị ihe ọzọ na-abụghị συναγωγή bata.'
- source_word: πολλάκις τιμωρῶν αὐτούς
  choice: ọtụtụ mgbe, ana m ata ha ahụhụ
  rationale: ‘Ọtụtụ mgbe’ na-edobe nkwughachi nke πολλάκις, ebe ‘ana m ata ha ahụhụ’ na-egosipụta omume ntaramahụhụ na-aga n’ihu nke participle τιμωρῶν.
- source_word: ἠνάγκαζον
  choice: na-agbalị ịmanye ha
  rationale: Imperfect ahụ nwere ike igosi mgbalị a na-eme ugboro ugboro n’enweghị nkwupụta na o mezuru mgbe niile; ya mere ‘na-agbalị ịmanye’ na-edobe nghọta ahụ.
- source_word: βλασφημεῖν
  choice: ikwu okwu nkwulu
  rationale: Nke a na-edobe omume ikwu nkwulu n’akọwaghị onye ma ọ bụ ihe a na-ekwulu, dịka Greek ahụ na-ahapụghị object ya.
- source_word: περισσῶς τε ἐμμαινόμενος αὐτοῖς
  choice: Ọnụma m megide ha gabigakwara ókè
  rationale: Nkebi a na-egosipụta iwe ọkụ, nke karịrị akarị, megide ha; nsụgharị a bụ Igbo eke ma na-ezere okwu nwere ike ịpụta ọrịa uche.
- source_word: ἐδίωκον
  choice: anọgidere m na-akpagbu ha
  rationale: ‘Anọgidere m’ na-egosipụta imperfective, omume mkpagbu gara n’ihu ma mee ugboro ugboro.
- source_word: ἕως καὶ εἰς τὰς ἔξω πόλεις
  choice: ruo ọbụna n’obodo ndị dị n’èzí
  rationale: ‘N’obodo ndị dị n’èzí’ na-edobe nghọta nkịtị na ntakịrị mgbagwoju anya nke ἔξω kama ikpebi ozugbo na ọ pụtara obodo mba ọzọ.
theological_decisions:
- issue: Ihe ma ọ bụ onye βλασφημεῖν metụtara
  choice: A sụgharịrị ya n’ozuzu dịka ‘ikwu okwu nkwulu,’ n’akọwaghị object ya.
  alternative: ‘ikwulu Jizọs’ ma ọ bụ ‘ịkọcha okwukwe Ndị Kraịst’
  rationale: Ọnọdụ akụkọ ahụ nwere ike igosi Jizọs ma ọ bụ nkwupụta okwukwe Ndị Kraịst, ma Greek ahụ ekwughị object. Nsụgharị ahụ na-edobe oghere na esemokwu ahụ.
- issue: Ma ἠνάγκαζον pụtara mgbalị ma ọ bụ mmanye mezuru
  choice: ‘na-agbalị ịmanye ha’
  alternative: ‘na-amanye ha’
  rationale: Imperfect nwere ike ịbụ conative n’ebe a, ma ọ naghị ekwu hoo haa na ndị a na-amanye kwuru nkwulu n’ezie; ‘na-agbalị’ na-ezere ikwu na mmezu ahụ doro anya.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta mee ihe. A họọrọ ‘ụlọ nzukọ ndị Juu’ maka συναγωγή, ‘okwu nkwulu’ iji ghara ịkọwa object Greek na-ekwughị, na ‘obodo ndị dị n’èzí’ iji chekwaa nghọta sara mbara nke ἔξω.
