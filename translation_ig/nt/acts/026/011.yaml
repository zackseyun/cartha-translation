revisions:
- from: N’ụlọ nzukọ ndị Juu niile, ọtụtụ mgbe, ana m ata ha ahụhụ ma na-agbalị ịmanye ha ikwu okwu nkwulu. Ọnụma m megide ha gabigakwara ókè, nke mere na anọgidere m na-akpagbu ha ruo ọbụna n’obodo ndị dị n’èzí[a].
  to: N’ụlọ nzukọ ndị Juu niile, ọtụtụ mgbe, m na-atakarị ha ahụhụ ma na-agbalị ịmanye ha ikwu okwu nkwulu; n’oke iwe m megide ha, anọgidere m na-akpagbu ha ruo ọbụna n’obodo ndị dị n’èzí[a].
  rationale: The revision makes the repeated past persecution explicit in idiomatic Standard Igbo and removes an unexpressed causal connector. It otherwise preserves the draft’s lexical choices, ambiguity concerning the object of blasphemy, and footnote anchor and content.
  reviewer_model: gpt-5.6-terra
