  text: τί ἄπιστον κρίνεται παρ’ ὑμῖν εἰ ὁ θεὸς νεκροὺς ἐγείρει;
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/008.yaml
  text: Why is it judged unbelievable by you if God raises the dead?
translation:
  language: ig
  text: Ma ọ bụrụ na Chineke na-akpọlite ndị nwụrụ anwụ, gịnị mere unu ji ewere nke a dị ka ihe a na-apụghị ikwere ekwere?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τί
  choice: Gịnị mere
  rationale: N’ụdị ajụjụ a, τί na-ajụ ihe kpatara ikpe ahụ; ‘Gịnị mere’ bụ ụzọ Igbo si kwuo ya nke ọma.
- source_word: ἄπιστον
  choice: ihe a na-apụghị ikwere ekwere
  rationale: Nke a na-egosi ihe e weere dị ka ihe na-ekweghị omume ma ọ bụ ihe siri ike ikwere, n’emebighị ike ajụjụ ahụ.
- source_word: κρίνεται παρ’ ὑμῖν
  choice: unu ji were ya dị ka
  rationale: Nke a na-eburu echiche nke ‘unu na-ekpebi/na-ewere ya dị ka’ ma na-eme ka ‘unu’ bụrụ ndị na-ekpe ikpe ahụ, dịka παρ’ ὑμῖν si dị n’ebe a.
- source_word: ἐγείρει
  choice: na-akpọlite
  rationale: Okwu a dabara n’omume Chineke ịkpọlite ndị nwụrụ anwụ; ọdịdị ugbu a na-echekwa nkebi ọnọdụ nke Grik.
- source_word: νεκρούς
  choice: ndị nwụrụ anwụ
  rationale: Nke a bụ ntụgharị nkịtị ma doo anya nke νεκρούς.
theological_decisions:
- issue: Ma εἰ bụ ọnọdụ ‘ọ bụrụ na’ ka ọ bụ ihe ajụjụ ahụ na-ekwu dịka eziokwu
  choice: na Chineke na-akpọlite ndị nwụrụ anwụ
  alternative: ọ bụrụ na Chineke akpọlite ndị nwụrụ anwụ
  rationale: N’ajụjụ Grik a, εἰ na-ewebata isi ihe e weere dị ka ihe a na-apụghị ikwere ekwere. Igbo ‘na’ na-eme ka ajụjụ ahụ bụrụ ihe eke ma na-edobe ebumnuche Pọl n’enweghị ikwu na o nwere obi abụọ banyere ike Chineke.
translation_notes:
  register: Standard Igbo nke oge a, n’usoro okwu dị ùgwù ma dị mfe nghọta. E ji ‘unu’ chekwaa ọnụọgụ ọtụtụ nke ὑμῖν.
