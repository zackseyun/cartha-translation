review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys God raising the dead and retains the plural addressees. However, its clause order makes “ya” lack a clear referent and weakens the direct relationship between what is judged incredible and the proposition that God raises the dead. Fronting the conditional clause preserves εἰ (“if”) explicitly and makes the judged matter unambiguous.
  naturalness: “Gịnị mere unu ji were ya dị ka ihe a na-apụghị ikwere ekwere na Chineke…” is syntactically awkward in Standard Igbo, since “ya” is not clearly identified before the following clause. The revised wording is clear, idiomatic, and retains the rhetorical-question register.
  terminology: “Chineke,” “na-akpọlite,” and “ndị nwụrụ anwụ” are appropriate Standard Igbo renderings. “Ihe a na-apụghị ikwere ekwere” accurately conveys ἄπιστον without imposing a doctrinal interpretation.
  issues:
  - severity: medium
    issue: Ambiguous antecedent and clause attachment
    rationale: In the draft, “ya” (“it”) has no explicit antecedent, and the following “na Chineke…” can be read less clearly than the Greek construction. The verse concerns judging the resurrection of the dead incredible.
  - severity: low
    issue: Conditional εἰ is not explicit
    rationale: The draft’s “na Chineke…” is idiomatic in some contexts, but “ma ọ bụrụ na” more directly preserves the source’s conditional framing and the English audit trail’s “if.”
  revised_text: Ma ọ bụrụ na Chineke na-akpọlite ndị nwụrụ anwụ, gịnị mere unu ji ewere nke a dị ka ihe a na-apụghị ikwere ekwere?
  revised_footnotes: []
