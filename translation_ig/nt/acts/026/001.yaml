base_translation:
  language: en
  yaml_path: translation/nt/acts/026/001.yaml
  text: 'Then Agrippa said to Paul[b][a], “You are permitted to speak on your own behalf.” Then Paul stretched out his hand and made his defense:'
translation:
  language: ig
  text: 'Mgbe ahụ, Agrịpa sịrị Pọl, “E kwere gị ikwu okwu maka onwe gị[a].” Mgbe ahụ, Pọl setịrị aka ya wee zaa ọnụ n’ịgbachitere onwe ya[b]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịtụgharị ya, “ikwu okwu n’ọnọdụ onwe gị.”
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịtụgharị ya, “wee gbachitere onwe ya.” Ngwaa Grik ahụ pụrụ ịpụta ịkọwa ma ọ bụ ịza ebubo n’ụzọ iwu.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀγρίππας
  choice: Agrịpa
  rationale: E dere aha onye ahụ n’ụzọ kwekọrọ n’usoro mkpọpụta na odide Igbo a na-ahụkarị.
- source_word: δὲ
  choice: Mgbe ahụ
  rationale: N’ebe a, δέ na-akwalite akụkọ gaa n’ihu; “Mgbe ahụ” na-egosi usoro ihe mere n’Igbo dị mfe nghọta.
- source_word: πρὸς τὸν Παῦλον ἔφη
  choice: sịrị Pọl
  rationale: Nke a bụ ụzọ Igbo sitere n’okike e si akọ na mmadụ gwara onye ọzọ okwu.
- source_word: Ἐπιτρέπεταί σοι
  choice: E nyere gị ikike
  rationale: Ọ na-echekwa echiche nke nkwenye e nyere Pọl, ma na-adabara ọnọdụ ikpe ahụ.
- source_word: ὑπὲρ σεαυτοῦ λέγειν
  choice: ikwu okwu n’aha onwe gị
  rationale: ὑπέρ na nnọchiaha ntụgharị onwe onye nwere echiche ikwu okwu maka ọdịmma ma ọ bụ ịgbachitere onwe onye; ntụgharị a na-echekwa obosara ahụ.
- source_word: τότε
  choice: Mgbe ahụ
  rationale: Ọ na-egosi usoro oge nke ederede Grik kwuru kpọmkwem.
- source_word: ἐκτείνας τὴν χεῖρα
  choice: setịrị aka ya
  rationale: Nke a na-asụgharị mmegharị ahụ kpọmkwem n’enweghị ịkọwa ihe mmegharị ahụ pụtara karịa ihe ederede kwuru.
- source_word: ἀπελογεῖτο
  choice: kwuo okwu ịgbachitere onwe ya
  rationale: Ngwaa ahụ na-egosi ịza ebubo ma ọ bụ ikwu okwu nchebe n’ọnọdụ ikpe; ahịrịokwu Igbo a bụ nke doro anya ma ghara itinye echiche ‘malitere’ nke na-adịghị n’ngwaa ahụ kpọmkwem.
