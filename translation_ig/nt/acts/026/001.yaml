  to: 'Mgbe ahụ, Agrịpa sịrị Pọl, “E kwere gị ikwu okwu maka onwe gị[a].” Mgbe ahụ, Pọl setịrị aka ya wee zaa ọnụ n’ịgbachitere onwe ya[b]:'
  rationale: The revision replaces a literal but misleading expression for speaking on one’s own behalf with idiomatic Standard Igbo, and it recasts the final clause so that it naturally communicates Paul’s formal legal defense. It preserves the Greek narrative order, gesture, courtroom register, and absence of any added interpretation of the gesture.
