source:
  edition: SBLGNT
  text: ἕνεκα τούτων ⸂με Ἰουδαῖοι⸃ ⸀συλλαβόμενοι ἐν τῷ ἱερῷ ἐπειρῶντο διαχειρίσασθαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/021.yaml
  text: Because of these things the Jews seized me in the temple and were trying to kill me[a][b].
translation:
  language: ig
  text: N’ihi ihe ndị a[a] ka ndị Juu jidere m n’ụlọ nsọ[b], na-achọ igbu m.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Ọ bụ n’ihi nke a” ma ọ bụ “N’ihi ihe ndị a.”
    reason: lexical_alternative
  - marker: b
    text: Okwu Grik a sụgharịrị “ụlọ nsọ” na-ezo aka n’ogige ụlọ nsọ ahụ dum, ọ bụghị naanị ebe nsọ dị n’ime ya.
    reason: cultural_note
lexical_decisions:
- source_word: ἕνεκα τούτων
  choice: N’ihi ihe ndị a
  rationale: Nkebiokwu a na-egosi ihe kpatara ihe mere ma na-atụ aka n’ihe Pọl kwuru tupu amaokwu a; nsụgharị a bụ Igbo nkịtị ma debe njikọ ahụ.
- source_word: με
  choice: m
  rationale: Ọ bụ nnọchiaha onye mbụ, otu onye, nke bụ ihe omume ‘jidere’ metụtara kpọmkwem.
- source_word: Ἰουδαῖοι
  choice: ndị Juu
  rationale: Nke a na-akpọ ndị Juu ahụ so n’ihe a mere; n’Igbo enweghị mkpụrụokwu pụrụ iche kwekọrọ kpọmkwem na article Bekee, ya mere ihe gbara amaokwu ahụ gburugburu na-egosi na ọ bụghị ndị Juu niile ka a na-ekwu.
- source_word: συλλαβόμενοι
  choice: jidere
  rationale: Okwu a pụtara ijide mmadụ n’ike. ‘Jidere’ dabara n’omume iro a karịa okwu ga-egosi njide iwu kwadoro.
- source_word: ἐν τῷ ἱερῷ
  choice: n’ụlọnsọ ukwu
  rationale: ἱερόν na-ezo aka n’ogige ụlọ nsọ ahụ dum, ọ bụghị naanị ebe nsọ dị n’ime ya. ‘Ụlọnsọ ukwu’ bụ okwu Igbo doro anya maka Temple dị na Jerusalem, ebe nkọwa ala ala dị na ndetu.
- source_word: ἐπειρῶντο
  choice: na-achọkwa
  rationale: Ụdị imperfect ahụ na-egosi mgbalị na-aga n’ihu n’oge gara aga; ‘na-achọkwa’ na-edebe echiche nke ịnọ na-agbalị ime ihe ahụ.
- source_word: διαχειρίσασθαι
  choice: igbu
  rationale: N’ebe a, ngwaa ahụ pụtara ime ka mmadụ nwụọ n’ike. ‘Igbu’ doro anya ma ọ naghị atụkwasị nkọwa ikpe iwu nke na-adịghị n’okwu Grik ahụ.
theological_decisions:
- issue: Ihe ‘ndị Juu’ na-ezo aka n’ebe okwu a nwere ike ịkpalite nghọtahie
  choice: E debere ‘ndị Juu’ dị ka ndị ahụ kpọmkwem jidere Pọl n’ihe akụkọ a na-akọ.
  alternative: Ịsụgharị ya n’ụzọ ga-adị ka ọ na-ebo ndị Juu niile ebubo, ma ọ bụ ikpochapụ njirimara ndị ahụ kpamkpam.
  rationale: Grik kpọrọ ndị so mee ihe ahụ aha, ma ọ naghị ekwu na ndị Juu niile so mee ya. Nsụgharị ahụ na-edebe onye akụkọ ahụ kwuru maka ya n’etinyeghị ebubo sara mbara.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị mfe ma dị ugwu. Nhazi ‘N’ihi… ka…’ na-egosipụta ihe kpatara ihe mere n’ụzọ Igbo nkịtị; ‘na-achọkwa igbu m’ na-edebe mgbalị na-aga n’ihu nke imperfect Grik.
