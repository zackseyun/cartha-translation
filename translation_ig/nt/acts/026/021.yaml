    reason: cultural_note
  revision_rationale: The revision preserves the source’s causal connection, its reference to the Jewish opponents in the narrative, and the imperfective attempted killing. It removes the unsupported additive '-kwa,' uses the standard term 'ụlọ nsọ,' and adjusts the lexical footnote so that it does not introduce an unstated eventive sense.
