revisions:
- from: N’ihi ihe ndị a[a] ka ndị Juu jidere m n’ụlọnsọ ukwu[b], na-achọkwa igbu m.
  to: N’ihi ihe ndị a[a] ka ndị Juu jidere m n’ụlọ nsọ[b], na-achọ igbu m.
  rationale: The revision preserves the source’s causal connection, its reference to the Jewish opponents in the narrative, and the imperfective attempted killing. It removes the unsupported additive '-kwa,' uses the standard term 'ụlọ nsọ,' and adjusts the lexical footnote so that it does not introduce an unstated eventive sense.
  reviewer_model: gpt-5.6-terra
