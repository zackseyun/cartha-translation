  to: Ma Pọl kwuru[a], “Aga m arịọ Chineke ka, ma ọ̀ bụ n’oge dị mkpirikpi ma ọ̀ bụ n’oge dị ogologo, ọ bụghị naanị gị, kama ka ndị niile na-ege m ntị taa ghọọ ndị dị ka m—ma e wezụga agbụ ndị a.”
