    reason: alternative_reading
  revision_rationale: A single source-fidelity correction replaces “na-anụ olu m” (“hear my voice”) with “na-ege m ntị” (“listen to me/hear me”). The footnote marker remains correctly placed after “kwuru,” corresponding to the disputed expression that follows, and its explanation preserves the principal alternatives without resolving the ambiguity beyond the audit trail’s chosen temporal rendering.
