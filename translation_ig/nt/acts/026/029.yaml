  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ δὲ ⸀Παῦλος· Εὐξαίμην ἂν τῷ θεῷ καὶ ἐν ὀλίγῳ καὶ ἐν ⸀μεγάλῳ οὐ μόνον σὲ ἀλλὰ καὶ πάντας τοὺς ἀκούοντάς μου σήμερον γενέσθαι τοιούτους ὁποῖος καὶ ἐγώ εἰμι παρεκτὸς τῶν δεσμῶν τούτων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/029.yaml
  text: But Paul said[a], “I would pray to God that whether in a short time or in a long time, not only you but also all who hear me today might become such as I am—except for these chains.”
translation:
  language: ig
  text: Ma Pọl kwuru[a], “Aga m arịọ Chineke ka, ma ọ̀ bụ n’oge dị mkpirikpi ma ọ̀ bụ n’oge dị ogologo, ọ bụghị naanị gị, kama ka ndị niile na-ege m ntị taa ghọọ ndị dị ka m—ma e wezụga agbụ ndị a.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ma ọ̀ fọrọ obere ka ọ bụrụ ma ọ̀ bụ kpamkpam”; okwu Grik ahụ siri ike, o nwekwara ike izo aka n’ogo ihe, ná mgbalị, ma ọ bụ n’ogologo oge.
    reason: alternative_reading
lexical_decisions:
- source_word: Εὐξαίμην ἂν τῷ θεῷ
  choice: M ga-arịọ Chineke
  rationale: Nke a na-egosipụta ọchịchọ e ji ekpere tụkwasị Chineke, ma na-asụ Igbo n'ụzọ doro anya na nke ebumpụta ụwa.
- source_word: ἐν ὀλίγῳ καὶ ἐν μεγάλῳ
  choice: ma ọ̀ bụ n’oge dị mkpirikpi ma ọ̀ bụ n’oge dị ogologo
  rationale: Nke a na-enye nkọwa oge nke kwekọrọ n’ọnọdụ okwu ahụ, ebe e debere nkọwa ndị ọzọ okwu Grik nwere ike ịpụta n’ihe odide ala peeji.
- source_word: οὐ μόνον σὲ ἀλλὰ καὶ πάντας τοὺς ἀκούοντάς μου σήμερον
  choice: ọ bụghị naanị gị, kama ka ndị niile na-anụ olu m taa
  rationale: Ọ na-echekwa nrụgide dị n’etiti ‘ọ bụghị naanị gị’ na ‘ndị niile,’ ma na-egosi ndị nọ na-ege Pọl ntị ugbu a.
- source_word: γενέσθαι τοιούτους ὁποῖος καὶ ἐγώ εἰμι
  choice: ghọọ ndị dị ka m
  rationale: Ọ na-egosipụta mgbanwe gaa n’ọnọdụ Pọl chọrọ ka ndị na-ege ya ntị ruo, n’Igbo dị mfe ma kwesịkwa ugwu.
- source_word: παρεκτὸς τῶν δεσμῶν τούτων
  choice: ma e wezụga agbụ ndị a
  rationale: ‘Ma e wezụga’ na-egosipụta nnọpụiche nke παρεκτός; ‘agbụ’ bụ okwu pụtara ìhè maka δεσμοί n’ọnọdụ mkpọrọ Pọl.
theological_decisions:
- issue: Ihe ἐν ὀλίγῳ καὶ ἐν μεγάλῳ pụtara n’ihe metụtara okwu Agrịpa kwuru tupu nke a
  choice: ma ọ̀ bụ n’oge dị mkpirikpi ma ọ̀ bụ n’oge dị ogologo
  alternative: ma ọ̀ fọrọ obere ka ọ bụrụ ma ọ̀ bụ kpamkpam; ma ọ bụ site ná mgbalị nta ma ọ bụ nnukwu mgbalị
  rationale: Nkebiokwu Grik a siri ike ma nwee ọtụtụ nkọwa ndị a na-agbachitere. Isi ederede họọrọ nkọwa oge dị mma n’ọnọdụ ahụ, ma ihe odide ala peeji echekwala nghọta ndị ọzọ kama idozi ihe mgbagwoju anya ahụ n’amaghị ama.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta, dee ya. A họọrọ ‘Pọl,’ ‘Chineke,’ na ‘agbụ’ dịka okwu ndị a na-ahụkarị n’Igbo Akwụkwọ Nsọ na n’okwu ndị mmadụ taa.
