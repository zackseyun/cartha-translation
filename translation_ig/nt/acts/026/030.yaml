  text: ⸀Ἀνέστη ⸀τε ὁ βασιλεὺς καὶ ὁ ἡγεμὼν ἥ τε Βερνίκη καὶ οἱ συγκαθήμενοι αὐτοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/030.yaml
  text: Then the king rose[a], and the governor and Bernice and those seated with them,
translation:
  language: ig
  text: Mgbe ahụ, eze ahụ, gọvanọ ahụ, Berenis, na ndị ha na ha nọ ọdụ biliri,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀνέστη
  choice: biliri
  rationale: Okwu a na-egosi na eze ahụ si n'oche ya bilie; “biliri” bụ okwu Igbo doro anya ma kwesịkwa ọnọdụ nzukọ a.
- source_word: τε
  choice: Mgbe ahụ
  rationale: Ọ na-ejikọta ihe omume a na nke bu ya ụzọ ma na-egosi na nke a bụ ihe sochiri ya.
- source_word: ὁ βασιλεὺς
  choice: eze ahụ
  rationale: Aha nsọpụrụ dị n'okwu Grik ka e debere, kama itinye aha Agrịpa nke na-adịghị n'amaokwu a.
- source_word: ὁ ἡγεμὼν
  choice: gọvanọ ahụ
  rationale: N'Ọrụ Ndị Ozi, okwu a na-ezokarị aka n'onye ọchịchị Rom na-achị ógbè; “gọvanọ” bụ okwu Igbo a na-aghọta nke ọma.
- source_word: Βερνίκη
  choice: Berenis
  rationale: “Berenis” bụ nsụgharị mkpụrụokwu nke aha ahụ nke na-adabara ụda na usoro odide Igbo.
- source_word: οἱ συγκαθήμενοι αὐτοῖς
  choice: ndị ha na ha nọ ọdụ
  rationale: Nke a na-echekwa ihe oyiyi dị n'okwu Grik nke ndị mmadụ nọkọtara ọdụ, na-enweghị ịkọwa ọrụ ma ọ bụ ọkwa ha karịa ihe ederede kwuru.
- source_word: καὶ
  choice: ya na … na
  rationale: Usoro a na-ejikọta ndị niile e depụtara n'ụzọ na-ada nke ọma n'Igbo ma na-echekwa nhazi mgbakwunye nke Grik.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo Izugbe dị ugbu a, dị ùgwù ma dị mfe nghọta. E jiri “Mgbe ahụ” gosipụta ọganihu akụkọ ahụ, ebe “ya na … na” mere ka ndepụta ndị ahụ daa nke ọma n'Igbo. Enweghị akara nkọwa ụkwụ n'amaokwu ahụ n'ihi na nkọwa ụkwụ Bekee banyere aha Bernice/Berenice adabaghị kpọmkwem na ụdị aha Igbo ahọpụtara.
