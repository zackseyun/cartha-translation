  to: na-anapụta gị n’aka ndị mmadụ na n’aka ndị mba ọzọ,[a] bụ ndị m na-eziga gị ka ị gakwuru.
  rationale: The main text replaces the demonstrative “ndị ahụ” with “ndị mmadụ,” preserving the Greek’s less explicit “the people” while allowing the contrast with “ndị mba ọzọ” to signal the likely Jewish referent. The wording retains the rescue sense, the plural scope of the relative pronoun, and the present commissioning action.
