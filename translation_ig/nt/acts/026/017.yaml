  yaml_path: translation/nt/acts/026/017.yaml
  text: delivering you from the people and from the Gentiles[a], to whom I am sending you
translation:
  language: ig
  text: na-anapụta gị n’aka ndị mmadụ na n’aka ndị mba ọzọ,[a] bụ ndị m na-eziga gị ka ị gakwuru.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “na-anapụta gị n’aka ndị Juu na n’aka ndị mba ọzọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξαιρούμενός
  choice: na-anapụta
  rationale: Okwu a bụ participle nke na-egosi ọrụ Jizọs na-arụ n’ịzọpụta Pọl n’aka ndị nwere ike imerụ ya; “na-anapụta” bụ okwu Igbo doro anya ma dịkwa ebube.
- source_word: τοῦ λαοῦ
  choice: ndị ahụ
  rationale: N’ọnọdụ a, λαός na-ezo aka n’ụmụ Izrel ma e jiri ha tụnyere ndị mba ọzọ. “Ndị ahụ” na-ahapụ ntụaka ahụ ka ihe gbara amaokwu ahụ gburugburu kọwaa ya, n’agbanyeghị na ọ dịchaghị nso n’ụdị Grik dịka “ndị mmadụ ahụ.”
- source_word: τῶν ἐθνῶν
  choice: ndị mba ọzọ
  rationale: N’ọdịnala ndị Juu nke Ọrụ Ndịozi, ἔθνη ebe a pụtara ndị na-abụghị ndị Juu; “ndị mba ọzọ” na-ekwupụta nke a n’Igbo nkịtị.
- source_word: εἰς οὓς
  choice: ndị ... ka ị gakwuru
  rationale: Mgbe εἰς οὓς soro ngwaa iziga, ọ pụtara ndị a na-ezigara mmadụ ka ọ gakwuru; nhazi a bụ Igbo e ji ọnụ ekwu nke ọma.
- source_word: ἀποστέλλω
  choice: m na-eziga
  rationale: Ụdị present na-egosi ọrụ iziga ahụ dị ugbu a n’oge e nyere Pọl ozi ahụ; “m na-eziga” chekwara nke a.
theological_decisions:
- issue: Onye τοῦ λαοῦ na-ezo aka na ya mgbe e ji ya tụnyere ndị mba ọzọ
  choice: E debere okwu na-adịghị akpọ “ndị Juu” aha kpọmkwem n’ahịrị bụ isi, ebe ihe gbara ya gburugburu na-egosi na ọ bụ ndị Juu/ụmụ Izrel.
  alternative: “ndị Juu” ma ọ bụ “ụmụ Izrel”
  rationale: Grik kwuru nanị “ndị ahụ/ndị mmadụ ahụ,” ọ bụ ezie na ntụnyere ya na ndị mba ọzọ na-eme ka ndị Juu bụrụ nghọta kacha sie ike. Ihe odide bụ isi anaghị etinye nkọwa zuru ezu karịa isi mmalite; ndetu ala na-eme ka nghọta ahụ doo anya.
translation_notes:
  register: Igbo ọkọlọtọ, dị ugbu a ma dị ebube. E ji “n’aka” gosi ịnapụta mmadụ n’ike ma ọ bụ n’ihe ize ndụ nke ndị ọzọ. Ahịrịokwu ahụ bụ akụkụ nke ahịrịokwu ka ukwuu, dịka ọ dị n’isi mmalite.
