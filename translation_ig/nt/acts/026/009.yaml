id: ACT.26.9
reference: Acts 26:9
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἐγὼ μὲν οὖν ἔδοξα ἐμαυτῷ πρὸς τὸ ὄνομα Ἰησοῦ τοῦ Ναζωραίου δεῖν πολλὰ ἐναντία πρᾶξαι·
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/009.yaml
  text: So I myself indeed thought that I ought to do many things in opposition to the name of Jesus the Nazarene[a].
translation:
  language: ig
  text: Ya mere, mụ onwe m chere na m kwesịrị ime ọtụtụ ihe megide aha Jizọs onye Nazaret[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “megide aha Jizọs nke Nazaret.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγὼ
  choice: mụ onwe m
  rationale: Nnochiaha ahụ e kwuru hoo haa na Grik na-emesi onye na-ekwu okwu ike; “mụ onwe m” na-edobe nkwusi ike Pọl ji ekwupụta ihe banyere onwe ya.
- source_word: μὲν οὖν
  choice: Ya mere
  rationale: Ngwakọta mkpụrụokwu a na-aga n'ihu n'okwu ma na-egosi ntakịrị nkwubi okwu na nkwusi ike. “Ya mere” bụ ụzọ Igbo dị mfe ma dị ndụ isi jikọta amaokwu a na okwu bu ya ụzọ, ebe nkwusi ike ọzọ dị na “mụ onwe m.”
- source_word: ἔδοξα ἐμαυτῷ
  choice: chere
  rationale: Akpaalaokwu Grik a pụtara ikpebi n'uche ma ọ bụ iche na ihe kwesịrị ekwesị. “Chere” bụ okwu Igbo nkịtị ma doo anya; “mụ onwe m” enyeworị nghọta nke mkpebi onwe onye.
- source_word: πρὸς τὸ ὄνομα
  choice: megide aha
  rationale: N'ebe a πρός na ἐναντία so na-egosi mmegide. “Megide aha” na-edobe ma ike mmegide ahụ ma akpaalaokwu Akwụkwọ Nsọ banyere “aha.”
- source_word: ὄνομα
  choice: aha
  rationale: A hapụrụ ya dịka “aha” ka o wee nọgide na-anọchi anya Jizọs n'onwe ya, aha ọma ya, na ikike ya n'enweghị imechi nghọta ahụ n'otu nkọwa naanị.
- source_word: Ἰησοῦ τοῦ Ναζωραίου
  choice: Jizọs onye Nazaret
  rationale: “Onye Nazaret” bụ aha njirimara sitere n'ebe Jizọs si, ma na-eburu ụdị aha njirimara dị na Ναζωραῖος n'Igbo eke.
- source_word: δεῖν
  choice: kwesịrị
  rationale: Ọ na-egosi ihe Pọl, n'echiche mbụ ya, weere dị ka ọrụ dị mkpa ma ọ bụ ihe ziri ezi ime; “kwesịrị” adịghị eme ka ọ bụrụ iwu sitere n'èzí.
- source_word: πολλὰ ἐναντία πρᾶξαι
  choice: ime ọtụtụ ihe megide
  rationale: Nsụgharị a na-edobe ọtụtụ omume (πολλά) na ọdịdị mmegide ha (ἐναντία), ma na-ada ka Igbo nkịtị.
theological_decisions:
- issue: Ihe “aha” pụtara n'ihe metụtara Jizọs
  choice: Idobe akpaalaokwu Akwụkwọ Nsọ bụ “aha”
  alternative: ikike Jizọs; ozi ma ọ bụ ụzọ Jizọs
  rationale: Ederede ahụ akọwaghị na ọ bụ naanị ikike ma ọ bụ naanị ozi Jizọs ka ọ na-ekwu. Idobe “aha” na-echekwa ohere nghọta ya dum n'enweghị itinye nkọwa okpukpe pụrụ iche.
translation_notes:
  register: Igbo ọkọlọtọ, nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ “Jizọs onye Nazaret” dịka aha njirimara eke; ihe odide ala peeji na-egosi nsụgharị ọzọ nke njikọ ahụ.
