id: ACT.26.7
reference: Acts 26:7
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἰς ἣν τὸ δωδεκάφυλον ἡμῶν ἐν ἐκτενείᾳ νύκτα καὶ ἡμέραν λατρεῦον ἐλπίζει καταντῆσαι· περὶ ἧς ἐλπίδος ἐγκαλοῦμαι ⸂ὑπὸ Ἰουδαίων, βασιλεῦ⸃·
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/007.yaml
  text: to which our twelve tribes hope to attain[a], as they earnestly serve God night and day. It is concerning this hope that I am accused by the Jews[c][b], O king.
translation:
  language: ig
  text: Nkwa ahụ ka mba anyị nke ebo iri na abụọ[a] na-atụ anya iru, mgbe ha ji ịnụ ọkụ n’obi na-ejere Chineke ozi[b] abalị na ehihie. Ọ bụ banyere olileanya a ka ndị Juu[c] na-ebo m ebubo, Eze.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “mba anyị nke ebo iri na abụọ.” Okwu Grik ahụ dị n’otu ọnụọgụ ma na-ekwu maka Izrel dịka otu mba ebo iri na abụọ.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “na-efe Chineke ofufe.” Ngwaa Grik ahụ pụrụ ịpụta ọrụ okpukpe ma ọ bụ ofufe a na-enye Chineke.
    reason: lexical_alternative
  - marker: c
    text: N’ebe a, “ndị Juu” pụtara ndị Juu na-ebo Pọl ebubo n’ikpe a; ọ pụtaghị ndị Juu niile.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς ἣν
  choice: Nkwa ahụ ka
  rationale: Ọ na-ezo azụ n’ebe nkwa ahụ dị n’amaokwu bu ụzọ ma na-egosi na ọ bụ ihe olileanya ha na-achọ iru.
- source_word: τὸ δωδεκάφυλον ἡμῶν
  choice: ndị anyị, bú ebo iri na abụọ
  rationale: Nke a na-edebe echiche nke ndị Izrel dịka otu mba ebo iri na abụọ, ma ọ ka bụ okwu Igbo doro anya.
- source_word: ἐν ἐκτενείᾳ
  choice: ji ịnụ ọkụ n’obi
  rationale: Ọ na-egosi ịdị uchu na nraranye siri ike n’ọrụ ha na-arụrụ Chineke.
- source_word: νύκτα καὶ ἡμέραν
  choice: abalị na ehihie
  rationale: Ọ na-edebe usoro okwu Grik ma na-egosi ọrụ na-aga n’ihu mgbe niile.
- source_word: λατρεῦον
  choice: na-ejere Chineke ozi
  rationale: Ngwaa ahụ na-ekwu maka ọrụ ofufe a na-arụrụ Chineke; ịkpọ Chineke aha na-eme ka ihe ọ pụtara doo onye na-agụ anya.
- source_word: ἐλπίζει καταντῆσαι
  choice: na-atụ anya iru
  rationale: ‘Iru’ na-egosi ịbịarute n’ihe e kwere ná nkwa n’etinyeghị nkọwa ọzọ na-adịghị n’amaokwu a.
- source_word: περὶ ἧς ἐλπίδος
  choice: banyere olileanya a
  rationale: Nke a na-edebe ihe περί na genitive pụtara n’ụzọ kwụ ọtọ, n’agbanyeghị na gburugburu okwu nwekwara ike inye echiche ‘n’ihi olileanya a.’
- source_word: ἐγκαλοῦμαι
  choice: ji ebo m ebubo
  rationale: Ọ bụ okwu ikpe na-egosi na a na-ebo Pọl ebubo.
- source_word: ὑπὸ Ἰουδαίων
  choice: ndị Juu
  rationale: Nke a bụ nsụgharị kpọmkwem nke ndị na-ebo Pọl ebubo n’ọnọdụ ikpe a, ọ bụghị okwu gbasara ndị Juu niile.
- source_word: βασιλεῦ
  choice: Eze
  rationale: Ọ na-edebe okwu Pọl ji kpọkuo Agrịpa ozugbo n’enweghị itinye aha na-adịghị n’amaokwu ahụ.
theological_decisions:
- issue: Ihe λατρεῦον na-ezo aka na ya
  choice: na-ejere Chineke ozi
  alternative: na-efe ofufe
  rationale: Ọ bụ ezie na okwu Grik ahụ akpọghị Chineke aha kpọmkwem, gburugburu okwu banyere ofufe Izrel na-egosi na ọ bụ Chineke ka a na-ejere ozi. Nke a na-eme ka Igbo bụrụ ihe doro anya n’etinyeghị ozizi ọhụrụ.
- issue: Ihe olileanya ahụ bụ
  choice: E debere ya dịka nkwa a kpọtụrụ aha n’amaokwu bu ụzọ, n’akọwaghị ya ọzọ n’amaokwu a
  alternative: Ịkpọlite ndị nwụrụ anwụ aha kpọmkwem
  rationale: Amaokwu a anaghị akọwa ọdịnaya nkwa ahụ ọzọ; ya mere nsụgharị ahụ na-edebe njikọ ya na amaokwu bu ụzọ ma ghara idozi ihe ederede hapụrụ ka gburugburu okwu kọwaa.
- issue: περὶ dịka isiokwu ma ọ bụ ihe kpatara ebubo
  choice: banyere olileanya a
  alternative: n’ihi olileanya a
  rationale: ‘Banyere’ dị nso n’usoro Grik ma na-ahapụ ohere nghọta na olileanya ahụ bụ ma isiokwu ma ihe kpatara ikpe ahụ.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị nsọpụrụ ma dị mfe nghọta. E debere usoro ‘abalị na ehihie’ dịka ọ dị na Grik, ma jiri ‘Eze’ mee okwu ịkpọku eze ozugbo. Akara ụkwụokwu [a], [b], na [c] niile dị n’ahịrịokwu ebe ha metụtara.
