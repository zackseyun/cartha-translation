review_pass:
  verdict: revise
  source_fidelity: The draft correctly links the relative pronoun to the preceding promise, retains the collective twelve-tribe reference, conveys earnest continual sacred service, and preserves the legal accusation and direct address. The wording for the collective subject is, however, syntactically awkward in Igbo and does not clearly express the Greek collective singular.
  naturalness: “ndị anyị, bú ebo iri na abụọ” is not idiomatic Standard Igbo in this construction. “Mba anyị nke ebo iri na abụọ” is clear, natural, and properly conveys Israel as a collective people. Recasting the accusation with the active Igbo legal expression “na-ebo m ebubo” is also more natural while retaining the Greek passive sense.
  terminology: “Nkwa ahụ,” “na-atụ anya iru,” “ji ịnụ ọkụ n’obi na-ejere Chineke ozi,” “olileanya,” “ndị Juu,” and “Eze” are appropriate in register and meaning. The footnotes accurately preserve relevant alternatives and contextual scope.
  issues:
  - severity: medium
    issue: The phrase “ndị anyị, bú ebo iri na abụọ” is awkward and underrepresents the collective-singular force of τὸ δωδεκάφυλον.
    rationale: The source refers collectively to Israel as the twelve-tribe people. “Mba anyị nke ebo iri na abụọ” gives a natural Igbo collective expression without shifting the referent to separate tribes.
  - severity: low
    issue: “ndị Juu ji ebo m ebubo” is less idiomatic than the straightforward legal construction “ndị Juu na-ebo m ebubo.”
    rationale: The revision is natural modern Standard Igbo and retains the ongoing legal-accusation sense of ἐγκαλοῦμαι.
