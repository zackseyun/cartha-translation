revisions:
- from: Nkwa ahụ ka ndị anyị, bú ebo iri na abụọ[a], na-atụ anya iru, ebe ha ji ịnụ ọkụ n’obi na-ejere Chineke ozi[b] abalị na ehihie. Ọ bụ banyere olileanya a ka ndị Juu[c] ji ebo m ebubo, Eze.
  to: Nkwa ahụ ka mba anyị nke ebo iri na abụọ[a] na-atụ anya iru, mgbe ha ji ịnụ ọkụ n’obi na-ejere Chineke ozi[b] abalị na ehihie. Ọ bụ banyere olileanya a ka ndị Juu[c] na-ebo m ebubo, Eze.
