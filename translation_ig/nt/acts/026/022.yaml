    reason: lexical_alternative
  revision_rationale: The revision replaces ‘ga-emezu’ with ‘ga-eme’ to preserve the source’s unmarked ‘happen/take place’ and explicitly represents the prophets–Moses pairing. It also makes ‘saying’ a participial clause coordinated with Paul’s standing and testifying, as in the Greek.
