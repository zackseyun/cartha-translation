  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐπικουρίας οὖν τυχὼν τῆς ⸀ἀπὸ τοῦ θεοῦ ἄχρι τῆς ἡμέρας ταύτης ἕστηκα μαρτυρόμενος μικρῷ τε καὶ μεγάλῳ, οὐδὲν ἐκτὸς λέγων ὧν τε οἱ προφῆται ἐλάλησαν μελλόντων γίνεσθαι καὶ Μωϋσῆς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/022.yaml
  text: Therefore[a], having received the help that is from God, I stand to this day, testifying to both small and great, saying nothing except what both the prophets and Moses said was going to happen[c][b],
translation:
  language: ig
  text: Ya mere, ebe m natara enyemaka sitere n’aka Chineke[a], eguzowokwa m ruo taa, na-agbara ma ndị nta ma ndị ukwu àmà[b], na-adịghị ekwu ihe ọ bụla gafere ihe ma ndị amụma ma Mosis kwuru na ga-eme[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, ‘ebe m nwetara enyemaka n’aka Chineke.’
    reason: lexical_alternative
  - marker: b
    text: ‘Ndị nta na ndị ukwu’ pụtara ndị nọ n’ọkwa niile n’etiti mmadụ.
    reason: cultural_note
  - marker: c
    text: A pụkwara ịsụgharị ya, ‘na-adịghị ekwu ihe ọ bụla karịa ihe ma ndị amụma ma Mosis kwuru na ga-eme.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπικουρίας ... τυχὼν τῆς ἀπὸ τοῦ θεοῦ
  choice: ebe m natara enyemaka sitere n’aka Chineke
  rationale: Ọ na-egosi na Pọl nwetara enyemaka nke si n’aka Chineke; ‘natara enyemaka’ bụ Igbo doro anya ma kwekọọ n’echiche τυγχάνω na ἐπικουρία.
- source_word: ἄχρι τῆς ἡμέρας ταύτης ἕστηκα
  choice: eguzowokwa m ruo taa
  rationale: Ụdị a na-egosi ọnọdụ nke malitere na mbụ ma dịgide ruo ugbu a, dịka perfect ἕστηκα si dị.
- source_word: μαρτυρόμενος
  choice: na-agbara ... àmà
  rationale: ‘Ịgbara àmà’ bụ okwu Igbo nkịtị nke na-echekwa echiche ịgba akaebe na nke iwu dị n’okwu Grik.
- source_word: μικρῷ τε καὶ μεγάλῳ
  choice: ma ndị nta ma ndị ukwu
  rationale: E debere ọdịdị ilu ahụ na nhazi ya; ọ na-ezo aka n’ọkwa mmadụ niile.
- source_word: οὐδὲν ἐκτὸς λέγων
  choice: Anaghị m ekwu ihe ọ bụla gafere
  rationale: ‘Gafere’ na-echekwa ohere nghọta nke ‘beyond/outside’ ma gosipụta nkwupụta siri ike na ozi ya abụghị ihe ọhụrụ gafere Akwụkwọ Nsọ.
- source_word: ὧν τε οἱ προφῆται ἐλάλησαν ... καὶ Μωϋσῆς
  choice: ihe ndị amụma na Mosis kwuru
  rationale: E debere usoro Grik nke kpọrọ ndị amụma ụzọ tupu Mosis, n’enweghị ịgbakwunye nkọwa.
- source_word: μελλόντων γίνεσθαι
  choice: na ha ga-emezu
  rationale: Ọ na-egosipụta ihe ndị e kwuru n’amụma na-aga imezu, ma zere ịkọwa na ha ga-eme ozugbo.
theological_decisions:
- issue: Oke nkwupụta Pọl banyere nkwekọrịta ozi ya na Akwụkwọ Nsọ Izrel
  choice: Ozi Pọl adịghị agafe ihe ndị amụma na Mosis kwuru na ha ga-emezu.
  alternative: Pọl na-ekwu naanị na ozi ya kwekọrọ n’Akwụkwọ Nsọ n’ozuzu, ọ bụghị na ihe ndị ahụ bụ amụma ga-emezu kpọmkwem.
  rationale: οὐδὲν ἐκτὸς na-egosi nkwupụta siri ike banyere ịdị n’otu na mkpughe gara aga; nsụgharị ahụ echekwala ike a n’enweghị itinye ozizi ọzọ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. E debere usoro okwu na esemokwu dị n’isi mmalite ebe ọ na-ekwe omume, ma jiri usoro Igbo nkịtị mee ka amaokwu ahụ na-aga were were.
