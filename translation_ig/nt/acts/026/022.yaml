revisions:
- from: Ya mere, ebe m natara enyemaka sitere n’aka Chineke[a], eguzowokwa m ruo taa, na-agbara ma ndị nta ma ndị ukwu àmà[b]. Anaghị m ekwu ihe ọ bụla gafere ihe ndị amụma na Mosis kwuru na ha ga-emezu[c],
  to: Ya mere, ebe m natara enyemaka sitere n’aka Chineke[a], eguzowokwa m ruo taa, na-agbara ma ndị nta ma ndị ukwu àmà[b], na-adịghị ekwu ihe ọ bụla gafere ihe ma ndị amụma ma Mosis kwuru na ga-eme[c],
  rationale: The revision replaces ‘ga-emezu’ with ‘ga-eme’ to preserve the source’s unmarked ‘happen/take place’ and explicitly represents the prophets–Moses pairing. It also makes ‘saying’ a participial clause coordinated with Paul’s standing and testifying, as in the Greek.
