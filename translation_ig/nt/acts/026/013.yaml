id: ACT.26.13
reference: Acts 26:13
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἡμέρας μέσης κατὰ τὴν ὁδὸν εἶδον, βασιλεῦ, οὐρανόθεν ὑπὲρ τὴν λαμπρότητα τοῦ ἡλίου περιλάμψαν με φῶς καὶ τοὺς σὺν ἐμοὶ πορευομένους·
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/013.yaml
  text: At midday[a], along the road, I saw, O king, a light from heaven, brighter than the sun, shining around me and those traveling with me.
translation:
  language: ig
  text: N'etiti ehihie[a], mgbe m nọ n’ụzọ, ahụrụ m, eze, ìhè si n’eluigwe nke karịrị nchapụta anyanwụ ma gbaa mụ na ndị mụ na ha na-eme njem gburugburu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “n’etiti ụbọchị.” Grik na-ekwu kpọmkwem banyere etiti ụbọchị.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμέρας μέσης
  choice: N'etiti ehihie
  rationale: Nkebi okwu a na-egosi kpọmkwem etiti ụbọchị; nsụgharị a bụ Igbo nkịtị ma doo anya.
- source_word: κατὰ τὴν ὁδὸν
  choice: mgbe m nọ n'ụzọ
  rationale: Ọ na-egosi ebe ihe ahụ mere n'oge njem, n'okwu Igbo na-aga were were.
- source_word: εἶδον
  choice: ahụrụ m
  rationale: Nke a na-asụgharị ngwaa ịhụ n'ụzọ kwụ ọtọ.
- source_word: βασιλεῦ
  choice: eze
  rationale: Aha a dị n'ụdị ịkpọ onye okwu ozugbo; Igbo anaghị achọ ihe yiri ‘O’ iji mee ka ọ bụrụ nkwanye ùgwù.
- source_word: οὐρανόθεν
  choice: si n'eluigwe
  rationale: Ọ na-echekwa echiche banyere ebe ìhè ahụ si bịa, ma ghara ime ya naanị ka ọ bụrụ mbara igwe nkịtị.
- source_word: ὑπὲρ τὴν λαμπρότητα τοῦ ἡλίου
  choice: nke na-enwu karịa anyanwụ
  rationale: Ọ na-egosi na ìhè ahụ karịrị ìhè anyanwụ ma bụrụkwa okwu Igbo dị mfe ma na-agụ were were.
- source_word: φῶς
  choice: ìhè
  rationale: Nke a bụ okwu Igbo nkịtị maka ìhè; enweghị edemede na Igbo, ya mere ọ dịghị mkpa ịgbakwunye ihe dabara ‘a’.
- source_word: περιλάμψαν με
  choice: ka ọ na-enwu mụ ... gburugburu
  rationale: Ọ na-echekwa echiche nke ìhè gbara Pọl gburugburu, ọ bụghị naanị na ọ nwukwasịrị ya.
- source_word: τοὺς σὺν ἐμοὶ πορευομένους
  choice: ndị mụ na ha na-eme njem
  rationale: Ọ na-egosipụta ndị ya na ha nọ na-aga njem n'etinyeghị nkọwa ọzọ na-adịghị na Grik.
theological_decisions:
- issue: Nsụgharị οὐρανόθεν n'ọnọdụ mkpughe
  choice: si n'eluigwe
  alternative: si na mbara igwe
  rationale: ‘Si n'eluigwe’ na-echekwa ike akụkọ na nke okwukwe nke okwu ahụ n'Ọrụ Ndịozi, n'agbanyeghị na okwu ahụ nwekwara ike ịrụtụ aka n'elu ma ọ bụ mbara igwe.
translation_notes:
  register: Ejiri Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. A hapụrụ ịkpọ eze okwu ozugbo dịka “eze,” ma jiri usoro ahịrịokwu na-aga were were n'Igbo. Akara ndetu ala [a] dị n'ahụ ederede.
