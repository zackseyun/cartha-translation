review_pass:
  verdict: revise
  source_fidelity: The draft correctly identifies ψυχαί as a count of people and preserves the total of 276 and the ship setting. However, its main sentence uses an unidiomatic and structurally defective count construction (“... ahụ dị narị mmadụ abụọ ...”). The revision retains the first-person plural perspective of ἤμεθα while expressing the total naturally.
  naturalness: In Standard Igbo, a human total is idiomatically introduced with “dị mmadụ ...” or “ruo mmadụ ...”. “Anyị niile nọ n’ụgbọ mmiri ahụ dị mmadụ narị abụọ na iri asaa na isii” is clear, natural narrative Igbo. The footnote is also recast so that its quoted alternative is grammatical Igbo and does not place an Arabic numeral awkwardly after “mkpụrụ obi.”
  terminology: “Ụgbọ mmiri” is appropriate for πλοῖον. Rendering ψυχαί as “mmadụ” in the main text is contextually accurate and avoids importing a claim about an immaterial soul. The alternative “mkpụrụ obi” is retained only in the explanatory footnote, with an explicit contextual clarification.
  issues:
  - severity: medium
    issue: The numerical predicate in the main text is malformed.
    rationale: “anyị niile nọ n’ụgbọ mmiri ahụ dị narị mmadụ abụọ ...” does not use the normal Igbo construction for counting people. “dị mmadụ narị abụọ ...” is required.
  - severity: low
    issue: The footnote’s quoted alternative is awkwardly ordered and mixes an Arabic numeral into an otherwise worded literal alternative.
    rationale: Reordering it as a complete Igbo clause and spelling out the number improves readability while preserving the lexical alternative.
