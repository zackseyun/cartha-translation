base_translation:
  language: en
  yaml_path: translation/nt/acts/027/037.yaml
  text: There were 276 persons in the ship in all[a].
translation:
  language: ig
  text: Anyị niile nọ n’ụgbọ mmiri ahụ dị mmadụ narị abụọ na iri asaa na isii.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ịsụgharị ya: “Anyị niile nọ n’ụgbọ mmiri ahụ bụ mkpụrụ obi narị abụọ na iri asaa na isii.” N’ebe a, “mkpụrụ obi” pụtara ndị mmadụ, ọ bụghị kpọmkwem mkpụrụ obi na-adịghị ahụ anya.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤμεθα
  choice: Anyị ... nọ
  rationale: Ngwaa a bụ onye mbụ n’ọnụọgụ ọtụtụ, ‘anyị nọ’; Igbo na-eji usoro a ekwu ọnụ ọgụgụ ndị nọ n’otu ebe n’ụzọ doro anya ma dịkwa eke.
- source_word: δὲ
  choice: (a hapụrụ ya n’enweghị okwu pụrụ iche)
  rationale: N’ebe a, δέ bụ njikọ akụkọ dị nro. Ọ dịghị mkpa itinye okwu dị ka ‘ma’ nke nwere ike ime ka ọdịiche sie ike karịa nke Grik.
- source_word: αἱ πᾶσαι ψυχαὶ
  choice: Anyị niile ... mmadụ
  rationale: ψυχαί n’ebe a pụtara ndị mmadụ, ọ bụghị nanị mkpụrụ obi na-adịghị ahụ anya. ‘Anyị niile’ na ‘mmadụ’ na-egosipụta ma mmadụ ndị ahụ ma ngụkọta ha.
- source_word: ἐν τῷ πλοίῳ
  choice: n’ụgbọ mmiri ahụ
  rationale: Nke a bụ nsụgharị Igbo doro anya ma kwekọọ na nkebiokwu Grik nke na-ekwu na ha nọ n’ime ụgbọ mmiri ahụ.
- source_word: διακόσιαι ἑβδομήκοντα ἕξ
  choice: narị mmadụ abụọ na iri asaa na isii
  rationale: E depụtara ọnụ ọgụgụ 276 n’okwu Igbo nkịtị, n’enweghị mgbanwe n’ọnụ ọgụgụ ahụ.
theological_decisions:
- issue: Ihe ψυχαί pụtara n’ebe a
  choice: mmadụ
  alternative: mkpụrụ obi
  rationale: N’ọnọdụ a, okwu ahụ bụ ụzọ e si agụ ndị mmadụ nọ n’ụgbọ mmiri; ịsụgharị ya ‘mkpụrụ obi’ pụrụ ime ka onye na-agụ ya chee na amaokwu ahụ na-ekwu kpọmkwem banyere akụkụ mmadụ na-adịghị ahụ anya.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị mfe nghọta ma nwee ugwu. E chekwara onye mbụ n’ọnụọgụ ọtụtụ nke dị na Grik, ebe a kọwara ψυχαί n’ụzọ na-agaghị eweta nghọtahie nkà mmụta okpukpe.
