- from: Anyị niile nọ n’ụgbọ mmiri ahụ dị narị mmadụ abụọ na iri asaa na isii.[a]
  to: Anyị niile nọ n’ụgbọ mmiri ahụ dị mmadụ narị abụọ na iri asaa na isii.[a]
