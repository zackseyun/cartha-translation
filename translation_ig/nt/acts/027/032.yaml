base_translation:
  language: en
  yaml_path: translation/nt/acts/027/032.yaml
  text: Then the soldiers cut away the ropes of the skiff and let it fall off[a][b].
translation:
  language: ig
  text: Mgbe ahụ, ndị agha ahụ bepụrụ ụdọ nke obere ụgbọ ahụ[a], hapụrụ ya ka ọ kpafuo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị “ụgbọ” ma ọ bụ “obere ụgbọ nke ụgbọ mmiri ahụ.” Okwu Grik bụ skaphē, nke na-ezo aka n'obere ụgbọ e jikọtara n'ụgbọ mmiri ukwu ahụ.
    reason: lexical_alternative
  - marker: b
    text: N'ọnọdụ akụkọ a, a pụkwara ịghọta ngwaa a n'ụzọ nkịtị dịka “ka ọ dapụ” ma ọ bụ “ka ọ pụọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Mgbe ahụ
  rationale: Na-egosi na ihe a mere bụ ihe sochiri ihe a kọrọ tupu ya; ọ bụkwa ụzọ Igbo nkịtị si egosipụta usoro akụkọ.
- source_word: ἀπέκοψαν
  choice: bepụrụ
  rationale: Na-egosipụta igbubi ma kewapụ ụdọ kpamkpam, dịka ngwaa Grik si kwuo.
- source_word: οἱ στρατιῶται
  choice: ndị agha ahụ
  rationale: Ọ bụ ntụgharị doro anya nke ndị mere ihe ahụ, ndị agha a kpọtụrụ aha n'akụkọ ahụ.
- source_word: τὰ σχοινία
  choice: ụdọ
  rationale: “Ụdọ” bụ okwu Igbo doro anya maka eriri ndị e ji jide ma ọ bụ kee ụgbọ n'ọnọdụ a.
- source_word: τῆς σκάφης
  choice: e ji kegide obere ụgbọ ahụ
  rationale: σκάφη bụ obere ụgbọ dị iche n'ụgbọ mmiri ukwu; ntụgharị a na-eme ka njikọ ụdọ na obere ụgbọ ahụ doo anya n'Igbo n'enweghị ịkpọ ya ụdị ụgbọ a kapịrị ọnụ karịa ihe Grik kwuru.
- source_word: εἴασαν αὐτὴν
  choice: hapụ ya
  rationale: Na-echekwa echiche nke ikwe ka obere ụgbọ ahụ gawa n'enweghịzi ihe na-ejide ya.
- source_word: ἐκπεσεῖν
  choice: ka ọ dapụ
  rationale: “Dapụ” na-echekwa onyonyo bụ isi nke ἐκπίπτω, ya bụ isi n'ebe ọ nọ pụọ ma ọ bụ daa pụọ, ma a kọwara nghọta nke ịkpafu na nkọwa ala peeji.
