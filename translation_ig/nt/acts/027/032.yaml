translation_notes:
  register: E ji asụsụ Igbo Izugbe nke dị ugbu a, dị mfe nghọta ma dị ùgwù. “Obere ụgbọ” na-ekewa skaphē n'ụgbọ mmiri ukwu ahụ, ebe “dapụ” na-edobe ihe onyonyo nke Grik ma hapụ nkọwa ọzọ nke ịkpafu n'ala peeji.
