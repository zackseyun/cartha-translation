  to: Mgbe ahụ, ndị agha ahụ bepụrụ ụdọ nke obere ụgbọ ahụ[a], hapụrụ ya ka ọ kpafuo.[b]
  rationale: The revision corrects the past-tense coordination, renders the boat's departure in natural maritime Igbo, and keeps the literal 'fall away' possibility in a footnote. It retains the distinction between the ship and its smaller boat and makes no doctrinal interpretation.
