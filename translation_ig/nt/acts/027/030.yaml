  text: τῶν δὲ ναυτῶν ζητούντων φυγεῖν ἐκ τοῦ πλοίου καὶ χαλασάντων τὴν σκάφην εἰς τὴν θάλασσαν προφάσει ὡς ἐκ πρῴρης ⸂ἀγκύρας μελλόντων⸃ ἐκτείνειν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/030.yaml
  text: And when the sailors were seeking to escape from the ship and had lowered the skiff into the sea under the pretense of being about to lay out anchors from the bow[b][a],
translation:
  language: ig
  text: Ma mgbe ndị ọrụ ụgbọ mmiri ahụ na-achọ ịgbapụ n’ụgbọ ahụ, ha wedatara obere ụgbọ ahụ n’oké osimiri, na-eme ka à ga-asị na ha ga-esi n’ihu ụgbọ ahụ tọpụ arịlịka[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ịgbatị arịlịka site n’ihu ụgbọ ahụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ναυτῶν
  choice: ndị ọrụ ụgbọ mmiri
  rationale: Nke a bụ okwu Igbo doro anya, nke ndị nkịtị na-aghọta, maka ndị na-arụ ọrụ ịkwọ na ilekọta ụgbọ mmiri.
- source_word: ζητούντων φυγεῖν
  choice: nọ na-achọ isi ... gbapụ
  rationale: Ọ na-egosi na ha na-agbalị ma na-ezube ịhapụ ụgbọ ahụ na nzuzo.
- source_word: ἐκ τοῦ πλοίου
  choice: n’ụgbọ ahụ
  rationale: N’usoro okwu Igbo a, ‘isi n’ụgbọ ahụ gbapụ’ na-egosipụta ịgbapụ pụọ n’ụgbọ mmiri ahụ n’ụzọ ebumpụta ụwa.
- source_word: χαλασάντων τὴν σκάφην
  choice: ha wedatara obere ụgbọ ahụ
  rationale: σκάφη bụ obere ụgbọ nke nnukwu ụgbọ mmiri bu; ‘obere ụgbọ’ doro ndị na-agụ Igbo anya karịa okwu nka pụrụ iche.
- source_word: εἰς τὴν θάλασσαν
  choice: n’oké osimiri
  rationale: Nsụgharị kpọmkwem ma bụrụkwa nke a na-asụkarị maka θάλασσα n’ebe a.
- source_word: προφάσει ὡς
  choice: na-eme ka à ga-asị na
  rationale: Nkebiokwu a na-egosi na ihe ha kwuru ma ọ bụ mere bụ naanị ihe mkpuchi maka ebumnuche ha n’ezie.
- source_word: ἐκ πρῴρης
  choice: isite n’ihu ụgbọ ahụ
  rationale: πρῷρα bụ akụkụ ihu ụgbọ mmiri; okwu a bụ nke nghọta ya dị mfe n’Igbo.
- source_word: ἀγκύρας
  choice: arịlịka
  rationale: Okwu mgbazinye a bụ aha a na-ejikarị eme ihe maka anchor; ọdịdị Igbo anaghị achọkarị akara ọtụtụ n’aha mgbe ihe gbara ya gburugburu gosiri ọtụtụ.
- source_word: μελλόντων ἐκτείνειν
  choice: na-aga ... tọpụ ... gaa n’ihu
  rationale: N’ọnọdụ ọrụ ụgbọ mmiri a, ἐκτείνειν pụtara ịtọpụ ma ọ bụ ịgbatị arịlịka pụọ n’ụgbọ, ọ bụghị naanị iweda ya ala.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo Izugbe dị ugbu a, dị ùgwù ma dị mfe nghọta. A họọrọ ‘obere ụgbọ’ kama okwu nka na-adịghị ahụkarị, ma e debere nkọwa ọrụ ụgbọ mmiri nke ἐκτείνειν n’isiokwu na ihe odide ala peeji.
