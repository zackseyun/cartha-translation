- from: Ma mgbe ndị ọrụ ụgbọ mmiri ahụ nọ na-achọ isi n’ụgbọ ahụ gbapụ, ha wedatara obere ụgbọ ahụ n’oké osimiri, na-eme ka à ga-asị na ha na-aga isite n’ihu ụgbọ ahụ tọpụ arịlịka gaa n’ihu[a],
  to: Ma mgbe ndị ọrụ ụgbọ mmiri ahụ na-achọ ịgbapụ n’ụgbọ ahụ, ha wedatara obere ụgbọ ahụ n’oké osimiri, na-eme ka à ga-asị na ha ga-esi n’ihu ụgbọ ahụ tọpụ arịlịka[a],
