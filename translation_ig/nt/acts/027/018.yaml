translation_notes:
  register: Ejiri Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-edobe ike nke oké ifufe, echiche nnara nke χειμαζομένων, na okwu ọrụ ụgbọ mmiri nke ἐκβολή. E tinyere akara ndetu [a] ozugbo n'akụkụ okwu ọ na-akọwa.
