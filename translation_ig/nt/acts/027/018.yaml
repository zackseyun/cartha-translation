revisions:
- from: Ebe oké ifufe ahụ nọ na-ebugharị anyị n'ike, n'echi ya, ha malitere ịtụ ibu dị n'ụgbọ mmiri ahụ n'oké osimiri.[a]
  to: Ebe oké ifufe na-akpagbu anyị nke ukwuu, n'echi ya ha malitere ịtụfu ibu n'ime mmiri.[a]
  rationale: The revision replaces a verb that can imply mere transportation with one that naturally communicates the sailors’ being severely afflicted by the storm. It also makes the jettisoning clause idiomatic while retaining the implied cargo and the ongoing/onset sense represented in the draft and English audit trail.
  reviewer_model: gpt-5.6-terra
