  yaml_path: translation/nt/acts/027/018.yaml
  text: As we were being violently storm-tossed[a], on the next day they began to throw the cargo overboard.
translation:
  language: ig
  text: Ebe oké ifufe na-akpagbu anyị nke ukwuu, n'echi ya ha malitere ịtụfu ibu n'ime mmiri.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N'ụzọ nkịtị, “ha mere ịtụfu.” Okwu Grik a bụ okwu ọrụ ụgbọ mmiri maka ịtụfu ihe, karịsịa ibu, n’ụgbọ mmiri iji mee ka ụgbọ ahụ dị mfe.
    reason: lexical_alternative
lexical_decisions:
- source_word: σφοδρῶς
  choice: n'ike
  rationale: Na-egosi otú oké ifufe ahụ siri dị ike ma dị egwu, n'Igbo nkịtị na nke doro anya.
- source_word: χειμαζομένων
  choice: oké ifufe ahụ nọ na-ebugharị anyị
  rationale: 'Na-edobe echiche nnara nke participle ahụ: ndị nọ n''ụgbọ mmiri bụ ndị ifufe na ebili mmiri na-akwagharị, ọ bụghị ndị na-eme ihe ahụ.'
- source_word: ἡμῶν
  choice: anyị
  rationale: A tụgharịrị genitive absolute ahụ dịka nkebiokwu oge nwere ‘anyị’ dịka nnọchiaha isiokwu.
- source_word: τῇ ἑξῆς
  choice: n'echi ya
  rationale: Nke a bụ ụzọ Igbo dị mkpụmkpụ ma bụrụkwa nke e ji ekwu ‘n'ụbọchị sochirinụ’ n'ụzọ nkịtị.
- source_word: ἐκβολὴν
  choice: ịtụ ibu dị n'ụgbọ mmiri ahụ n'oké osimiri
  rationale: Ọ bụ okwu ndị ọrụ ụgbọ mmiri ji akọwa ịtụ ihe e buru n'ụgbọ mmiri n'ime mmiri iji mee ka ụgbọ ahụ dị mfe; ‘ibu’ sitere na ọnọdụ akụkọ a, ọ bụ ezie na Grik ekwughị ihe a tụụrụ kpọmkwem.
- source_word: ἐποιοῦντο
  choice: ha malitere ịtụ
  rationale: Na-enye imperfect middle dị ka mmalite na omume na-aga n'ihu n'ụbọchị ahụ, n'ụzọ Igbo na-ada nke ọma.
