  text: φοβούμενοί τε ⸂μή που κατὰ⸃ τραχεῖς τόπους ἐκπέσωμεν ἐκ πρύμνης ῥίψαντες ἀγκύρας τέσσαρας ηὔχοντο ἡμέραν γενέσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/029.yaml
  text: And fearing that we might run aground on rocky places[b][a], they dropped four anchors from the stern and prayed for day to come.
translation:
  language: ig
  text: Ebe ha na-atụ egwu na ụgbọ ahụ nwere ike ịdaba n’ebe ndị tara akpụ[a], ha si n’azụ ụgbọ ahụ tụnye arịlịka anọ, na-ekpe ekpere ka chi bọọ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ka ụgbọ ahụ ghara ịdaba n’elu nkume ndị tara akpụ,” ma ọ bụ, “ka ụgbọ ahụ ghara ịdaba n’ebe ndị tara akpụ.”
    reason: lexical_alternative
  - marker: b
    text: N’ụzọ nkịtị, “ka ụbọchị bụrụ”; ya bụ, ha nọ na-atụ anya ka ìhè ụtụtụ rute.
    reason: lexical_alternative
lexical_decisions:
- source_word: φοβούμενοί
  choice: Ebe ha na-atụ egwu
  rationale: Ọ na-egosi ọnọdụ na ihe kpaliri omume ndị sochirinụ, ma na-edobe njikọ participle ahụ n’ụzọ Igbo dị ire.
- source_word: μή που κατὰ τραχεῖς τόπους ἐκπέσωμεν
  choice: na ụgbọ ahụ nwere ike ịdaba n’ebe nkume jupụtara
  rationale: Nkebiokwu a na-egosi ụjọ na ifufe ma ọ bụ ebili mmiri nwere ike iburu ụgbọ ahụ gaa n’ebe siri ike ma dị ize ndụ; nsụgharị a anaghị akọwapụta karịa ihe Grik kwuru.
- source_word: ἐκπέσωμεν
  choice: ịdaba
  rationale: N’ọnọdụ njem mmiri a, okwu ahụ pụtara ụgbọ mmiri ịbanye ma ọ bụ ịdakwasị ebe ala, nkume, ma ọ bụ mmiri na-emighị emi; ihe gbara ya gburugburu na-eme ka ihe ọ pụtara doo anya.
- source_word: ἐκ πρύμνης
  choice: si n’azụ ụgbọ ahụ
  rationale: πρύμνα bụ azụ ụgbọ mmiri; okwu a bụ Igbo nkịtị ma doo ndị na-agụ akwụkwọ anya karịa iji okwu nka a na-amaghịkarị.
- source_word: ῥίψαντες ἀγκύρας τέσσαρας
  choice: tụnye arịlịka anọ
  rationale: Ọ na-egosi na ha buru ụzọ tụnye arịlịka anọ tupu omume bụ isi nke ikpe ekpere na-aga n’ihu.
- source_word: ηὔχοντο
  choice: na-ekpekwa ekpere
  rationale: εὔχομαι nwere ike ịpụta ikpe ekpere ma ọ bụ ịchọsi ihe ike; n’ebe a, ‘ikpe ekpere’ bụ nghọta dabara adaba, ebe ọdịdị imperfect na-egosi omume na-aga n’ihu.
- source_word: ἡμέραν γενέσθαι
  choice: ka chi bọọ
  rationale: Nke a bụ ụzọ Igbo ebumpụta ụwa isi kwuo na ha chọrọ ka ìhè ụtụtụ rute, ma na-echekwa echiche nke ‘ụbọchị ịbịa.’
theological_decisions:
- issue: Ma ηὔχοντο pụtara ikpe ekpere nye Chineke ka ọ bụ naanị ịchọsi ike
  choice: na-ekpekwa ekpere
  alternative: na-achọsikwa ike
  rationale: N’ọnọdụ a, ‘ikpe ekpere’ bụ ihe okwu Grik ahụ nwere ike ịpụta n’ụzọ zuru oke, mana a gaghị akpọ onye ha na-ekpegara ekpere aha n’ihi na ederede ekwughị ya kpọmkwem.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta, dee ya. ‘Azụ ụgbọ ahụ’ na-akọwa okwu nka πρύμνα n’ụzọ doro anya; ‘arịlịka’ bụ okwu a na-ejikarị eme ihe maka anchor. E debere ọdịdị omume na-aga n’ihu nke ηὔχοντο site na ‘na-ekpekwa ekpere.’
