    text: Ma ọ bụ, “ka ụgbọ ahụ ghara ịdaba n’elu nkume ndị tara akpụ,” ma ọ bụ, “ka ụgbọ ahụ ghara ịdaba n’ebe ndị tara akpụ.”
    reason: lexical_alternative
  - marker: b
    text: N’ụzọ nkịtị, “ka ụbọchị bụrụ”; ya bụ, ha nọ na-atụ anya ka ìhè ụtụtụ rute.
    reason: lexical_alternative
  revision_rationale: The revision preserves the Greek’s broad reference to rough or rugged danger spots without asserting that they were rock-filled, removes an unstated wind reference from the alternative note, preserves the sequence of casting anchors from the stern and then praying, and gives a closer literal gloss for the infinitive phrase about day coming.
