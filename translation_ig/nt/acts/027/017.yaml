  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἣν ἄραντες βοηθείαις ἐχρῶντο ὑποζωννύντες τὸ πλοῖον· φοβούμενοί τε μὴ εἰς τὴν Σύρτιν ἐκπέσωσιν, χαλάσαντες τὸ σκεῦος, οὕτως ἐφέροντο.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/017.yaml
  text: After hoisting it up[a], they used supporting cables to undergird the ship; and fearing that they might run aground on the Syrtis[c][b], they lowered the sea anchor and so were driven along.
translation:
  language: ig
  text: Mgbe ha buliri ya elu, ha ji ụdọ nkwado gbaa ụgbọ mmiri ahụ gburugburu iji kwado ya[a]; ebe ha na-atụ egwu na ha nwere ike ịdaba na Sirtis[b], ha wedatara ngwa ụgbọ mmiri[c], e wee na-eburu ha aga otú ahụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’asụsụ Grik, nke a bụ iji “ihe nkwado” gbaa ụgbọ mmiri ahụ gburugburu iji mee ka ahụ ya sie ike.
    reason: lexical_alternative
  - marker: b
    text: Sirtis bụ mpaghara a ma ama n’ihi ájá mmiri na ebe mmiri na-emighị emi dị n’akụkụ ụsọ oké osimiri Ugwu Afrịka.
    reason: cultural_note
  - marker: c
    text: A pụkwara ịsụgharị ya, “ha wedatara akụrụngwa,” “ha wedatara eriri na ngwa ụgbọ mmiri,” ma ọ bụ “ha wedatara arịlịka mmiri.” Okwu Grik ahụ pụtara “ngwa” ma ọ bụ “akụrụngwa,” ma ihe kpọmkwem ọ na-ekwu maka ya ebe a ejighị n’aka.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἣν ἄραντες
  choice: Mgbe ha buliri ya elu
  rationale: ‘Ya’ na-ezo aka n’obere ụgbọ mmiri e kwuru okwu ya n’amaokwu bu ụzọ; ahịrịokwu a na-egosikwa na ha buru ụzọ bulie ya tupu ihe ndị ọzọ.
- source_word: βοηθείαις ... ὑποζωννύντες τὸ πλοῖον
  choice: ha ji ụdọ nkwado kee ụgbọ mmiri ahụ gburugburu n’okpuru
  rationale: N’ọnọdụ njem mmiri a, okwu ndị a na-ekwu maka iji ụdọ gbaa ahụ ụgbọ mmiri gburugburu iji mee ka ọ sie ike; nsụgharị a na-echekwa echiche nke ịkwado ya site n’okpuru n’asụsụ Igbo doro anya.
- source_word: φοβούμενοί τε μὴ εἰς τὴν Σύρτιν ἐκπέσωσιν
  choice: ebe ha na-atụ egwu na ụgbọ mmiri ahụ nwere ike ịbanye n’ájá mmiri Saịtis
  rationale: Nke a na-egosi ụjọ ha nwere na a ga-ebuba ụgbọ mmiri ahụ n’ebe ájá mmiri dị ize ndụ, ma na-edobe Saịtis dị ka aha mpaghara ahụ.
- source_word: χαλάσαντες τὸ σκεῦος
  choice: ha wedatara ngwa ụgbọ mmiri
  rationale: σκεῦος bụ okwu sara mbara nke pụtara ngwa ma ọ bụ akụrụngwa. Ihe kpọmkwem ha wedatara ejighị n’aka, ya mere isi ederede anaghị ekpebi na ọ bụ arịlịka mmiri.
- source_word: οὕτως ἐφέροντο
  choice: e wee na-eburu ha aga otú ahụ
  rationale: Ụdị ngwaa Grik ahụ na-egosi mmegharị na-aga n’ihu nke ike dị n’èzí na-akpata, n’ebughị ụzọ kpọọ ike ahụ aha.
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. A hapụrụ mgbagwoju anya dị na τὸ σκεῦος n’isi ederede ma kọwaa nhọrọ ndị ọzọ n’ala ala peeji; e tinyebeghị nkọwa okpukpe pụrụ iche.
