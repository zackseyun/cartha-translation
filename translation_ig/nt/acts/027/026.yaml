  yaml_path: translation/nt/acts/027/026.yaml
  text: But we must run aground on some island[a].
translation:
  language: ig
  text: Ma anyị aghaghị ịdakwasị n’otu agwaetiti[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “anyị aghaghị ịdaba n’akụkụ ala n’otu agwaetiti.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δέ
  choice: Ma
  rationale: Ọ na-egosi ntakịrị ọdịiche n’ihe e kwuru tupu ya; “Ma” dabara n’usoro okwu a.
- source_word: εἰς νῆσον
  choice: n’ala n’otu agwaetiti
  rationale: N’ọnọdụ njem mmiri a, okwu ndị a na-egosi iru ala n’agwaetiti a na-akọwaghị kpọmkwem.
- source_word: τινα
  choice: otu
  rationale: “Otu” na-egosi na a maghị ma ọ bụ na a kpọghị agwaetiti ahụ aha, dịka nnọchiaha Grik ahụ si dị.
- source_word: δεῖ ἡμᾶς
  choice: anyị aghaghị
  rationale: Nke a na-enye ike nke mkpa ma ọ bụ ihe na-apụghị izere ezere n’asụsụ Igbo dị mfe.
- source_word: ἐκπεσεῖν
  choice: ịbanye n’ala
  rationale: N’ojiji metụtara ụgbọ mmiri, okwu a nwere ike ịpụta ụgbọ mmiri ịdaba ma ọ bụ ịbụ nke ifufe na ebili mmiri chụgara n’akụkụ ala; “ịbanye n’ala” bụ okwu Igbo doro anya ma dị mfe, ebe nkọwa ọzọ dị n’ala ala peeji.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo zuru ọha, nke dị ugbu a ma nwee ugwu. A zere okwu ụgbọ mmiri siri ike nke ọtụtụ ndị na-agụ akwụkwọ agaghị aghọta, ma e debere echiche nke ọnọdụ mmiri ahụ n’ala ala peeji.
