review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the contrast (δέ), necessity (δεῖ), first-person reference, and the unspecified island. However, “ịbanye n’ala” primarily means “go/enter onto land” and is too weak for ἐκπεσεῖν in this maritime context, which denotes being cast/landing upon an island, potentially by grounding.
  naturalness: “Ma anyị aghaghị ịdakwasị n’otu agwaetiti” is concise, natural Standard Igbo, and suits the immediate maritime context without importing an explicit agent or details not stated in Greek.
  terminology: “ịdakwasị” retains the event-like force of the nautical expression better than “ịbanye n’ala.” The alternative footnote removes the added “ifufe na ebili mmiri,” since the Greek verse does not explicitly name wind and waves as the agent.
  issues:
  - severity: medium
    issue: The main rendering “anyị aghaghị ịbanye n’ala n’otu agwaetiti” understates the nautical force of ἐκπεσεῖν.
    rationale: It can mean simply reaching or entering land, whereas the Greek describes an involuntary or forced landfall/grounding upon an island.
  - severity: medium
    issue: The footnote adds “ifufe na ebili mmiri” and makes them the grammatical agents of the necessity.
    rationale: Those details are contextually plausible but are not expressed in this verse; a lexical alternative should not add them.
  revised_text: Ma anyị aghaghị ịdakwasị n’otu agwaetiti[a].
