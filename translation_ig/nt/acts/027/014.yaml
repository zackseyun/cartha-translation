  yaml_path: translation/nt/acts/027/014.yaml
  text: But not long after[b][a], a typhonic wind called Euraquilo rushed down against it.
translation:
  language: ig
  text: Ma obere oge agafebeghị, ifufe dị ike nke na-agbagharị agbagharị, nke a na-akpọ Yurakụlọn[b][a], si n’agwaetiti ahụ fedata n’ike.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ụfọdụ akwụkwọ aka ochie nwere “Yuroklidọn” kama “Yurakụlọn.”
    reason: textual_variant
  - marker: b
    text: A pụkwara ịsụgharị ya “ifufe siri ike nke si n’ebe ugwu ọwụwa anyanwụ.” O yikarịrị ka aha ahụ na-ezo aka n’oké ifufe si n’ebe ugwu ọwụwa anyanwụ, ma ederede Grik gosiri ya dịka aha.
    reason: lexical_alternative
lexical_decisions:
- source_word: μετ’ οὐ πολὺ
  choice: obere oge agafebeghị
  rationale: Nke a bụ ụzọ Igbo sitere n’okike e si egosi na ihe ahụ mere obere oge ka e mesịrị.
- source_word: δὲ
  choice: Ma
  rationale: Ọ na-egosi mgbanwe mberede n’akụkọ ahụ na ntakịrị ọdịiche megide ọnọdụ gara aga.
- source_word: ἔβαλεν κατ’ αὐτῆς
  choice: si n’agwaetiti ahụ fedata n’ike
  rationale: N’ọnọdụ akụkọ a, αὐτῆς yikarịrị ka ọ na-ezo aka n’agwaetiti ahụ; okwu ahụ na-egosi ifufe nke ji ike si n’elu ala ahụ fedata. Nke a na-ezere Igbo na-edoghị anya dịka ‘megide ya.’
- source_word: ἄνεμος τυφωνικὸς
  choice: ifufe dị ike nke na-agbagharị agbagharị
  rationale: Ọ na-egosi ifufe oke mmiri ozuzo na-agbagharị agbagharị, n’etinyeghị ya n’ụdị nhazi ihu igwe nke oge a.
- source_word: ὁ καλούμενος Εὐρακύλων
  choice: nke a na-akpọ Yurakụlọn
  rationale: E debere ya dịka aha ifufe n’ederede Grik, ma degharịa ụda aha ahụ n’usoro mkpụrụokwu Igbo.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E ji nkọwa sitere n’okike dochie ntụgharị mkpụrụokwu ‘typhonic,’ ebe ụdị okwu ahụ abụghị nke a na-ejikarị eme ihe n’Igbo. E debere akara nkọwa [b][a] n’akụkụ aha/ụdị ifufe ha na-akọwa.
