  text: ὁ δὲ ἑκατοντάρχης τῷ κυβερνήτῃ καὶ τῷ ναυκλήρῳ ⸂μᾶλλον ἐπείθετο⸃ ἢ τοῖς ⸀ὑπὸ Παύλου λεγομένοις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/011.yaml
  text: But the centurion paid more attention to the pilot and the shipowner than to what was being said by Paul[a].
translation:
  language: ig
  text: Ma ọchịagha narị ndị agha ahụ kwere n'okwu onye na-edu ụgbọ mmiri na onye nwe ụgbọ mmiri karịa ihe Pọl kwuru[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ọchịagha narị ndị agha ahụ gere onye na-edu ụgbọ mmiri na onye nwe ụgbọ mmiri ntị karịa ihe Pọl kwuru.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑκατοντάρχης
  choice: ọchịagha narị
  rationale: Ọ bụ okwu Igbo doro anya maka onyeisi ndị agha Rom nke a na-akpọ centurion, ma na-egosikwa njikọ ya na narị ndị agha.
- source_word: κυβερνήτῃ
  choice: onye na-anya ụgbọ mmiri
  rationale: N'ọnọdụ njem mmiri a, okwu ahụ na-ezo aka n'onye na-eduzi ma ọ bụ na-achịkwa ụzọ ụgbọ mmiri; ntụgharị a dị mfe nghọta ma kewapụ ọrụ ya n'ọrụ onye nwe ụgbọ mmiri.
- source_word: ναυκλήρῳ
  choice: onye nwe ụgbọ mmiri
  rationale: Okwu ahụ nwere ike ịpụta onye nwe ụgbọ mmiri ma ọ bụ onyeisi na-elekọta ya; ebe κυβερνήτης bụ onye na-anya ya, nhọrọ a na-echekwa ọdịiche dị n'etiti ọrụ abụọ ahụ.
- source_word: μᾶλλον ἐπείθετο
  choice: gere ... ntị karịa
  rationale: N'ọnọdụ ime mkpebi a, nkebiokwu Igbo a na-egosi na ọ nakweere ndụmọdụ ha karịa nke Pọl, n'ebughị ụzọ kwuo hoo haa ihe niile mere n'ime obi ya.
- source_word: τοῖς ὑπὸ Παύλου λεγομένοις
  choice: ihe Pọl na-ekwu
  rationale: Nke a na-ewepụta okwu ma ọ bụ ndụmọdụ Pọl n'ụzọ Igbo dị ndụ ma na-echekwa echiche nke participle dị na isi mmalite.
- source_word: δὲ
  choice: Ma
  rationale: Ọ na-egosi ọdịiche dị n'etiti ịdọ aka ná ntị Pọl kwuru n'amaokwu bu ụzọ na nzaghachi ọchịagha ahụ.
- source_word: ἢ
  choice: karịa
  rationale: Nke a bụ ụzọ Igbo kwesịrị ekwesị isi gosipụta ntụnyere nke jikọtara ya na μᾶλλον.
theological_decisions: []
