  text: Ὅτε δὲ ἡμέρα ἐγένετο, τὴν γῆν οὐκ ἐπεγίνωσκον, κόλπον δέ τινα κατενόουν ἔχοντα αἰγιαλὸν εἰς ὃν ⸀ἐβουλεύοντο εἰ ⸀δύναιντο ⸀ἐξῶσαι τὸ πλοῖον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/039.yaml
  text: When day came[a], they did not recognize the land, but they noticed a certain bay with a beach, into which they planned, if they could, to run the ship ashore.
translation:
  language: ig
  text: Mgbe chi bọrọ, ha amataghị ala ahụ; ma ha hụrụ otu ọnụ mmiri nwere ụsọ mmiri. Ha zubere, ma ọ bụrụ na ha enwee ike, ịkwọ ụgbọ mmiri ahụ banye n’ọnụ mmiri ahụ ka ha kụnye ya n’ụsọ mmiri ahụ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ịkwọ ụgbọ mmiri ahụ banye n’ọnụ mmiri ahụ ka ọ rute n’ụsọ mmiri.” Ngwaa Grik ahụ na-ekwu maka ịkwọ ma ọ bụ ịmanye ụgbọ mmiri ahụ n’ụsọ mmiri.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅτε δὲ ἡμέρα ἐγένετο
  choice: Mgbe chi bọrọ
  rationale: Nke a bụ ụzọ Igbo sitere n’okike e si ekwu na ìhè ụtụtụ abịala; ọ na-edobe ọrụ nkebiokwu oge ahụ n’enweghị ịgbakwunye okwu pụtara ‘ugbu a.’
- source_word: τὴν γῆν οὐκ ἐπεγίνωσκον
  choice: ha amataghị ala ahụ
  rationale: ‘Amataghị’ na-egosi na ha enweghị ike ịmata ma ọ bụ chọpụta ebe ala ahụ bụ; ‘ala’ na-edobe obosara γῆ, ọ bụ ezie na ọnọdụ ahụ metụtara ụsọ ala.
- source_word: κόλπον δέ τινα κατενόουν
  choice: ma ha hụrụ otu ọnụ mmiri
  rationale: ‘Ọnụ mmiri’ bụ okwu Igbo a na-aghọta maka bay ma ọ bụ inlet; ‘otu’ na-edobe enweghị nkọwa doro anya dị na τινα, ebe ‘hụrụ’ na-enye echiche nke ileba anya wee chọpụta.
- source_word: ἔχοντα αἰγιαλὸν
  choice: nke nwere osimiri
  rationale: N’Igbo ọkọlọtọ, ‘osimiri’ nwere ike ịpụta ụsọ mmiri ma ọ bụ ebe aja dị n’akụkụ oke osimiri n’ọnọdụ a, na-enweghị ịgbakwunye na ọ bụ aja ka Grik na-ekwughị kpọmkwem.
- source_word: εἰς ὃν
  choice: n’elu osimiri ahụ
  rationale: Ebe a, ebumnobi nke ịbanye n’ọnụ mmiri ahụ bụ ime ka ụgbọ ahụ ruo n’ụsọ ya; ntụgharị a na-eme ka njikọ ebe a na-aga doo anya n’Igbo.
- source_word: ἐβουλεύοντο
  choice: wee kpebie
  rationale: Okwu a na-egosi na ha tụlere ihe ha ga-eme ma mee atụmatụ ma ọ bụ mkpebi; ‘kpebie’ dabara n’usoro akụkọ a.
- source_word: εἰ δύναιντο
  choice: ma ọ bụrụ na ha enwee ike
  rationale: Nke a na-edobe echiche nke ihe ga-ekwe omume, ọ bụghị nkwenye na ha ga-eme ya n’ezie.
- source_word: ἐξῶσαι τὸ πλοῖον
  choice: ịkwọbanye ụgbọ mmiri ahụ n’elu osimiri ahụ
  rationale: Nke a na-egosi ịmanye ma ọ bụ ịkwọ ụgbọ ahụ ka ọ rịgoro n’ụsọ mmiri; nkọwa ọzọ dị n’ala ala peeji na-eme ka ike dị n’omume Grik pụta ìhè.
