translation_notes:
  register: Ejiri Igbo ọkọlọtọ nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ ‘ọnụ mmiri’ maka κόλπος, ma jiri ‘osimiri’ n’echiche ụsọ/beach dịka ọnọdụ njem mmiri si gosi. Ihe nrịbama ala ala peeji [a] dị n’isiokwu ahụ ma na-akọwa ngwaa ụgbọ mmiri ahụ.
