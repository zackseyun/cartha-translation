id: ACT.27.10
reference: Acts 27:10
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: λέγων αὐτοῖς· Ἄνδρες, θεωρῶ ὅτι μετὰ ὕβρεως καὶ πολλῆς ζημίας οὐ μόνον τοῦ φορτίου καὶ τοῦ πλοίου ἀλλὰ καὶ τῶν ψυχῶν ἡμῶν μέλλειν ἔσεσθαι τὸν πλοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/010.yaml
  text: saying to them[a], “Men, I perceive that the voyage is about to be with disaster and great loss, not only of the cargo and the ship[b], but also of our lives.”
translation:
  language: ig
  text: Ọ sịrị ha, “Ndị ikom, achọpụtara m na njem a anyị ji ụgbọ mmiri eme ga-enwe oke ọdachi na nnukwu mfu, ọ bụghị naanị nke ibu na ụgbọ mmiri, kamakwa nke ndụ anyị.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγων αὐτοῖς
  choice: ọ na-asị ha
  rationale: Nke a na-edobe mmeghe participle ahụ n’ụzọ na-aga nke ọma n’akụkọ Igbo, dị ka omume na-eso ihe a kọrọ tupu ya.
- source_word: Ἄνδρες
  choice: Ụmụ nwoke
  rationale: Ọ bụ ịkpọ ìgwè ndị nwoke okwu kpọmkwem; nsụgharị a na-edobe ụdị nwoke dị n’asụsụ isi mmalite.
- source_word: θεωρῶ
  choice: ahụrụ m
  rationale: N’ebe a, ngwaa ahụ pụtara nghọta ma ọ bụ mkpebi sitere n’ịtụle ọnọdụ, ọ bụghị naanị ịhụ ihe n’anya; n’Igbo, ‘ahụrụ m na’ nwere ike ibu nghọta a n’ụzọ ebumpụta ụwa.
- source_word: μετὰ ὕβρεως καὶ πολλῆς ζημίας
  choice: ga-eweta ọdachi na nnukwu mfu
  rationale: ὕβρις n’ọnọdụ njem mmiri a na-egosi ahụhụ ma ọ bụ mbibi siri ike, ebe ζημία bụ mfu ma ọ bụ mmebi. Nkebi a na-egosipụta ihe ọjọọ ga-eso njem ahụ n’Igbo doro anya.
- source_word: οὐ μόνον τοῦ φορτίου καὶ τοῦ πλοίου ἀλλὰ καὶ
  choice: ọ bụghị naanị ibu na ụgbọ mmiri ahụ, kama ọ ga-etinyekwa
  rationale: Genitive ndị a dabere n’echiche mfu; Igbo na-egosipụta ihe ndị mfu ahụ metụtara n’enweghị preposition pụrụ iche. ‘Ibu’ bụ okwu nkịtị maka ngwongwo e bu n’ụgbọ mmiri.
- source_word: τῶν ψυχῶν ἡμῶν
  choice: ndụ anyị
  rationale: ψυχή n’ọnọdụ ihe ize ndụ nke ụgbọ mmiri na ọnwụ pụtara ndụ anụ ahụ, ọ bụghị mkpụrụ obi dị iche n’ahụ.
- source_word: μέλλειν ἔσεσθαι
  choice: ga-eweta
  rationale: N’ebe a μέλλω na-egosi ihe a tụrụ anya na ọ ga-eme n’oge na-abịa nso. ‘Ga-eweta’ na-eme ka amụma banyere nsonaazụ njem ahụ doo anya n’Igbo.
- source_word: τὸν πλοῦν
  choice: njem ụgbọ mmiri a
  rationale: πλοῦς bụ njem e ji ụgbọ mmiri eme; ‘njem ụgbọ mmiri’ bụ okwu Igbo doro anya ma dị mfe nghọta.
theological_decisions:
- issue: Ihe τῶν ψυχῶν ἡμῶν pụtara
  choice: ndụ anyị
  alternative: mkpụrụ obi anyị
  rationale: N’akụkụ a, ihe a na-ekwu bụ ọnwụ nwere ike ịbịa site na mbibi ụgbọ mmiri; ya mere ‘ndụ anyị’ bụ ihe okwu Grik ahụ pụtara n’ọnọdụ a, na-enweghị itinye ozizi banyere ọdịdị mkpụrụ obi.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke ugbu a ma dị ùgwù. A họọrọ ahịrịokwu dị mfe nghọta nye ndị nkịtị, ma e chekwara ịdị njọ nke ịdọ aka ná ntị Pọl. Enweghị ihe odide ala peeji n’ihi na enweghị nkọwa dị mkpa nke a na-apụghị iburu nke ọma n’ahịrịokwu bụ isi.
