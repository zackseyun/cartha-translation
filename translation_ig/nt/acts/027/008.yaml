  variant: Standard Igbo
source:
  edition: SBLGNT
  text: μόλις τε παραλεγόμενοι αὐτὴν ἤλθομεν εἰς τόπον τινὰ καλούμενον Καλοὺς Λιμένας ᾧ ἐγγὺς ⸂ἦν πόλις⸃ ⸀Λασαία.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/008.yaml
  text: And with difficulty coasting along it[a], we came to a certain place called Fair Havens, near which was a city named Lasea.
translation:
  language: ig
  text: N'oke ihe isi ike, anyị ji ụgbọ mmiri soro ụsọ ya[a], wee ruo otu ebe a na-akpọ Ọdụ ụgbọ mmiri ndị mara mma, nke dị nso n'otu obodo a na-akpọ Lasea.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “Ọ fọrọ nke nta ka anyị ghara inwe ike iji ụgbọ mmiri soro ụsọ ya, wee ruo…” Okwu Grik bụ παραλεγόμενοι bụ okwu ndị ọrụ ụgbọ mmiri ji akọwa ịkwọ ụgbọ mmiri n'akụkụ ụsọ mmiri.
    reason: lexical_alternative
lexical_decisions:
- source_word: μόλις
  choice: ji nnukwu ihe isi ike
  rationale: Na-egosi na njem ahụ gara n’ihu naanị site n’oké mgbalị; nke a bụ okwu Igbo doro anya nke na-edobe nrụgide dị n’akụkọ ahụ.
- source_word: τε
  choice: wee
  rationale: Na-ejikọta ihe a mere na akụkọ gara aga n’ụzọ dị mma n’Igbo, n’enweghị ịgbakwụnye echiche ọzọ.
- source_word: παραλεγόμενοι
  choice: na-akwọ ụgbọ mmiri n'akụkụ ụsọ
  rationale: Okwu Grik a bụ okwu njem mmiri nke pụtara ịga n’ụgbọ mmiri n’akụkụ ụsọ mmiri; nsụgharị a na-eme ka ihe ahụ doo onye Igbo anya.
- source_word: αὐτὴν
  choice: ya
  rationale: Nnọchiaha ahụ na-ezo aka na Krit nke a kpọtụrụ aha n’amaokwu bu ụzọ; ‘ya’ na-edobe njikọ ahụ n’enweghị ịkọwa ya karịa isi mmalite.
- source_word: ἤλθομεν
  choice: anyị ... ruo
  rationale: ‘Ruo’ bụ ụzọ ebumpụta ụwa e si ekwu na Igbo na ndị njem bịarutere ebe ha na-aga.
- source_word: εἰς τόπον τινά
  choice: otu ebe
  rationale: Na-edobe enweghị nkọwa kpọmkwem nke τινά ma na-ada ka Igbo nke oge a.
- source_word: καλούμενον
  choice: a na-akpọ
  rationale: Ọ bụ ntụgharị doro anya na nke a na-ejikarị ewebata aha ebe.
- source_word: Καλοὺς Λιμένας
  choice: Ọdụ Ụgbọ Mmiri Ndị Mara Mma
  rationale: A sụgharịrị ihe aha Grik ahụ pụtara kama iji ụdị aha Bekee; ọtụtụ ọdụ mmiri dị na aha ahụ ka e debere.
- source_word: ᾧ ἐγγὺς ἦν πόλις Λασαία
  choice: nke otu obodo a na-akpọ Lasea dị ya nso
  rationale: Na-edobe njikọ nke nnọchiaha ᾧ na ebe ahụ, echiche ịdị nso, nakwa na πόλις enweghị mkpụrụokwu na-eme ka ọ bụrụ otu obodo a maara kpọmkwem.
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A kọwara okwu njem mmiri n'ụzọ doro anya; a hapụrụ Lasea dị ka aha obodo, ebe a sụgharịrị Καλοὺς Λιμένας dịka aha nwere ihe ọ pụtara.
