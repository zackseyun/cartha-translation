  to: N'oke ihe isi ike, anyị ji ụgbọ mmiri soro ụsọ ya[a], wee ruo otu ebe a na-akpọ Ọdụ ụgbọ mmiri ndị mara mma, nke dị nso n'otu obodo a na-akpọ Lasea.
