  text: συναρπασθέντος δὲ τοῦ πλοίου καὶ μὴ δυναμένου ἀντοφθαλμεῖν τῷ ἀνέμῳ ἐπιδόντες ἐφερόμεθα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/015.yaml
  text: And when the ship was caught and could not face the wind[a], we gave way and were driven along.
translation:
  language: ig
  text: Ma mgbe e jidere ụgbọ mmiri ahụ, ụgbọ ahụ enweghịkwa ike ịga n’ihu megide ifufe ahụ, anyị kwụsịrị iguzogide ya, ifufe ahụ wee na-ebugharị anyị.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συναρπασθέντος
  choice: ifufe ahụ jidere
  rationale: Nke a na-egosi na ike si n’èzí jidere ụgbọ mmiri ahụ na mberede. Ikwupụta ‘ifufe ahụ’ dị ka onye mere ya dabara n’ahịrịokwu a ma doo ndị na-agụ ya anya n’Igbo.
- source_word: πλοίου
  choice: ụgbọ mmiri
  rationale: ‘Ụgbọ mmiri’ bụ okwu Igbo a na-ejikarị eme ihe maka πλοῖον n’akụkọ njem n’oké osimiri.
- source_word: μὴ δυναμένου
  choice: enweghịkwa ike
  rationale: Nke a na-egosi enweghị ike ime ihe, ma na-aga were were n’Igbo mgbe e mere ya ngwaa zuru ezu.
- source_word: ἀντοφθαλμεῖν
  choice: ihu ... ihu
  rationale: Akpaalaokwu a na-echekwa echiche nke ụgbọ mmiri ịtụ ihu megide ifufe, n’ebughị nkọwa teknụzụ ndị na-adịghị n’okwu Grik ahụ.
- source_word: ἀνέμῳ
  choice: ifufe ahụ
  rationale: Ἄνεμος pụtara ‘ifufe’; a naghị etinye ‘oké’ n’ihi na ọ bụ ezie na ọnọdụ ahụ bụ nke ajọ ifufe, okwu a n’onwe ya ekwughị ya.
- source_word: ἐπιδόντες
  choice: anyị kwụsịrị iguzogide ifufe ahụ
  rationale: N’ọnọdụ njem ụgbọ mmiri, participle a na-egosi na ha kwụsịrị ịgbalị ịlụso ike ifufe ọgụ ma kwe ka ọ chịrị. Nsụgharị a bụ Igbo doro anya ma ghara iji okwu ụgbọ mmiri ochie.
- source_word: ἐφερόμεθα
  choice: a na-ebukwa anyị aga
  rationale: Ụdị imperfect passive na-egosi na ike si n’èzí nọgidere na-ebu ha aga; usoro Igbo a na-echekwa ma passive ma mmegharị na-aga n’ihu.
- source_word: δέ
  choice: Ma mgbe
  rationale: δέ na-aga n’ihu n’akụkọ ahụ, ebe ‘Ma mgbe’ jikọtara amaokwu a n’ụzọ sitere n’okike na nke gara aga.
theological_decisions: []
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta mee ihe. E chekwara ihe atụ nke ụgbọ ahụ ‘ihu ifufe ihu’ na mmetụta passive nke ịbụ ndị a na-ebu aga, ma zere okwu teknụzụ ndị ọrụ ụgbọ mmiri naanị ga-aghọta.
