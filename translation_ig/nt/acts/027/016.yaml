  register: Ejiri Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. A kọwara okwu njem mmiri n’ụzọ nkịtị n’ahịrịokwu ahụ, ebe nkọwa ala peeji na-edobe ụdị okwu ọrụ ụgbọ mmiri dị na Grik.
