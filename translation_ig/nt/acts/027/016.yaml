  text: νησίον δέ τι ὑποδραμόντες καλούμενον ⸀Καῦδα ⸂ἰσχύσαμεν μόλις⸃ περικρατεῖς γενέσθαι τῆς σκάφης,
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/016.yaml
  text: But after running under the shelter of a small island called Cauda[a], we were barely able to secure the ship’s boat.
translation:
  language: ig
  text: Ma mgbe anyị gbagara n’ebe obere agwaetiti a na-akpọ Kauda chebere pụọ n’ifufe, ọ fọrọ obere ka anyị ghara inwe ike ijide obere ụgbọ mmiri ahụ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νησίον ... τι
  choice: otu obere agwaetiti
  rationale: νησίον bụ ụdị okwu na-egosi ihe nta; “obere agwaetiti” na-egosipụta nke a n’Igbo doro anya ma dịkwa mfe nghọta.
- source_word: δέ
  choice: Ma
  rationale: δέ na-egosi ntakịrị mgbanwe ma ọ bụ ọdịiche n’akụkọ ahụ; “Ma” dabara n’usoro akụkọ a.
- source_word: ὑποδραμόντες
  choice: mgbe anyị gafere n’akụkụ ebe ... chebere anyị pụọ n’ifufe
  rationale: N’okwu ndị ọkwọ ụgbọ mmiri, ὑποτρέχω pụtara ịgafe n’akụkụ ebe agwaetiti na-egbochi ifufe. Nhọrọ a na-eme ka ihe okwu ahụ pụtara doo onye na-agụ Igbo anya, ebe nkọwa ala peeji na-edobe ihe atụ okwu Grik ahụ.
- source_word: καλούμενον Καῦδα
  choice: a na-akpọ Kauda
  rationale: Nke a na-akọwa aha agwaetiti ahụ n’ụzọ kwụ ọtọ; “Kauda” bụ nsụgharị mkpụrụokwu nke Καῦδα.
- source_word: ἰσχύσαμεν μόλις
  choice: ọ bụ naanị n’oke ihe isi ike ka anyị jisiri ike
  rationale: Nkebiokwu ahụ na-egosi na ọ fọrọ obere ka ha ghara inwe ike ime ihe sochiri ya. Okwu Igbo a na-edobe ma ike ọrụ ahụ ma nso ha nọ n’ịda mba.
- source_word: περικρατεῖς γενέσθαι
  choice: jide ... nke ọma
  rationale: Nkebiokwu a pụtara inweta njide ma ọ bụ ịchịkwa ihe. N’ọnọdụ ụgbọ mmiri a, “jide ... nke ọma” na-egosi na ha nwetara njide n’ụgbọ nta ahụ ma mee ka ọ ghara ịpụ n’aka ha.
- source_word: τῆς σκάφης
  choice: ụgbọ mmiri nta nke ụgbọ ahụ
  rationale: σκάφη bụ obere ụgbọ e ji eso nnukwu ụgbọ mmiri, ikekwe nke a na-adọkpụ n’azụ ya. Nhọrọ a na-ekewa ya nke ọma na nnukwu ụgbọ mmiri ahụ n’enweghị iji okwu ọrụ aka na-adịghị mfe nghọta.
