  text: καὶ τῇ τρίτῃ αὐτόχειρες τὴν σκευὴν τοῦ πλοίου ⸀ἔρριψαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/019.yaml
  text: And on the third day they threw the ship’s gear overboard with their own hands[a].
translation:
  language: ig
  text: N’ụbọchị nke atọ, ha ji aka ha tụba ngwa ụgbọ mmiri ahụ n’oké osimiri.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ha onwe ha tụpụrụ akụrụngwa ụgbọ mmiri ahụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ τρίτῃ
  choice: N’ụbọchị nke atọ
  rationale: Dative ya na ordinal bụ okwu na-egosi oge; nsụgharị a na-eme ka ụbọchị ahụ doro anya ma bụrụ Igbo nkịtị.
- source_word: αὐτόχειρες
  choice: ha ji aka ha
  rationale: Nke a na-echekwa nkwusi ike dị n’okwu Grik ahụ na ndị nọ n’ụgbọ mmiri ji aka ha rụọ ihe ahụ.
- source_word: σκευὴν τοῦ πλοίου
  choice: ngwa ụgbọ mmiri ahụ
  rationale: N’ọnọdụ njem mmiri a, σκευή na-ezo aka n’ihe eji arụ ọrụ ma ọ bụ akụrụngwa ụgbọ mmiri; ‘ngwa ụgbọ mmiri’ bụ okwu doro anya nye ndị na-agụ Igbo taa.
- source_word: ἔρριψαν
  choice: tụba ... n’oké osimiri
  rationale: Ngwaa ahụ pụtara ịtụpụ ma ọ bụ ịtụba; ebe akụkọ a kwuru banyere ụgbọ mmiri nọ n’oké osimiri, okwu a na-eme ka ntụziaka mmegharị ahụ pụta ìhè n’ụzọ ebumpụta ụwa.
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. ‘Ha ji aka ha’ na-edobe nkwusi ike nke αὐτόχειρες, ebe ‘ngwa ụgbọ mmiri’ na-ezere okwu nka nke ọtụtụ ndị na-agụ agaghị aghọta.
