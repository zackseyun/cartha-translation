source:
  edition: SBLGNT
  text: μήτε δὲ ἡλίου μήτε ἄστρων ἐπιφαινόντων ἐπὶ πλείονας ἡμέρας, χειμῶνός τε οὐκ ὀλίγου ἐπικειμένου, λοιπὸν περιῃρεῖτο ⸂ἐλπὶς πᾶσα⸃ τοῦ σῴζεσθαι ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/020.yaml
  text: And when neither sun nor stars appeared for many days[a], and no small storm was pressing on us, from then on all hope of our being saved was gradually taken away.
translation:
  language: ig
  text: Ruo ọtụtụ ụbọchị, ma anyanwụ ma kpakpando apụtaghị, ajọ ifufe ahụ nọgidekwara na-akpagide anyị. Site n’oge ahụ gawa, e ji nwayọọ nwayọọ na-anapụ anyị olileanya ọ bụla nke a ga-azọpụta anyị[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “a ga-anapụta anyị.” N’ebe a, okwu Grik ahụ na-ekwu maka ịnapụta ha n’oké ifufe na ọnwụ n’oké osimiri.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιφαινόντων
  choice: apụtaghị
  rationale: N’ebe a okwu ahụ na-ekwu na a hụghị anyanwụ na kpakpando n’ihi ọnọdụ ihu igwe; ‘apụtaghị’ bụ Igbo doro anya ma ghara ịgbakwunye na ha aghaghị ịcha ọkụ.
- source_word: ἐπὶ πλείονας ἡμέρας
  choice: Ruo ọtụtụ ụbọchị
  rationale: Nke a na-egosi ogologo oge gafere ọtụtụ ụbọchị n’ụzọ Igbo nkịtị.
- source_word: χειμῶνός
  choice: oké ifufe
  rationale: N’ọnọdụ njem mmiri a, okwu ahụ pụtara ajọ ihu igwe ma ọ bụ ifufe mmiri, ọ bụghị oge oyi.
- source_word: οὐκ ὀλίγου
  choice: oké
  rationale: N’agbanyeghị na Grik ji okwu mgbagwoju ‘ọ bụghị obere,’ ‘oké’ na-ebunye ike nke litotes ahụ n’Igbo nkịtị ma doo anya.
- source_word: ἐπικειμένου
  choice: nọgidekwara na-amanyesi anyị ike
  rationale: Nhọrọ a na-egosi na ifufe ahụ nọgidere na-abịakwasị ha n’ike, dịka participle na imperfect si gosi ọnọdụ na-aga n’ihu.
- source_word: λοιπὸν
  choice: Site mgbe ahụ gaa n'ihu
  rationale: Ọ na-egosi oge ọnọdụ ọhụrụ malitere, ọ bụghị naanị mmechi nke akụkọ.
- source_word: περιῃρεῖτο
  choice: ji nwayọọ nwayọọ na-apụ n’anya
  rationale: Imperfect passive na-egosi na olileanya ahụ na-ebelata n’usoro oge, ọ bụghị na ọ kwụsịrị n’otu ntabi anya.
- source_word: ἐλπὶς πᾶσα
  choice: olileanya niile
  rationale: Nke a na-echekwa echiche nke ngụkọta olileanya ha nile.
- source_word: τοῦ σῴζεσθαι ἡμᾶς
  choice: anyị nwere na a ga-azọpụta anyị
  rationale: Nke a bụ ụzọ Igbo dị nfe isi kwuo ihe olileanya ahụ metụtara, ma na-echekwa sara mbara nke σῴζω.
theological_decisions:
- issue: Ihe σῴζεσθαι pụtara n’akụkọ njem mmiri a
  choice: nnapụta anụ ahụ pụọ n’ọnwụ n’oké osimiri, nke a sụgharịrị ‘a ga-azọpụta anyị’
  alternative: a ga-anapụta anyị
  rationale: Ọnọdụ Acts 27 bụ ihe gbasara ifufe, mbibi ụgbọ mmiri, na ịdị ndụ. Ya mere, okwu a na-ekwu maka nnapụta anụ ahụ, ọ bụghị nzọpụta ime mmụọ; ihe odide bụ isi na-echekwa okwu sara mbara, ebe nkọwa ala peeji na-eme ka ọnọdụ ya doo anya.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-echekwa ogologo oge nke enweghị anyanwụ na kpakpando, ike ifufe ahụ, na nwayọọ nwayọọ nke olileanya ha na-apụ n’anya.
