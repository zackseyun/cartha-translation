revisions:
- from: Ruo ọtụtụ ụbọchị, anyanwụ ma ọ bụ kpakpando ọ bụla apụtaghị, oké ifufe nọgidekwara na-amanyesi anyị ike. Site mgbe ahụ gaa n'ihu, olileanya niile anyị nwere na a ga-azọpụta anyị[a] ji nwayọọ nwayọọ na-apụ n’anya.
  to: Ruo ọtụtụ ụbọchị, ma anyanwụ ma kpakpando apụtaghị, ajọ ifufe ahụ nọgidekwara na-akpagide anyị. Site n’oge ahụ gawa, e ji nwayọọ nwayọọ na-anapụ anyị olileanya ọ bụla nke a ga-azọpụta anyị[a].
  rationale: The revision preserves the duration of the obscured heavenly bodies, the continuing pressure of the severe storm, the temporal transition introduced by λοιπὸν, and especially the imperfect passive force of περιῃρεῖτο. It also retains the textual breadth of ‘saved’ while clarifying the physical context only in the footnote.
  reviewer_model: gpt-5.6-terra
