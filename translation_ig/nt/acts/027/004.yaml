  text: κἀκεῖθεν ἀναχθέντες ὑπεπλεύσαμεν τὴν Κύπρον διὰ τὸ τοὺς ἀνέμους εἶναι ἐναντίους,
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/004.yaml
  text: And from there[a], after putting out to sea, we sailed under the lee of Cyprus, because the winds were against us.
translation:
  language: ig
  text: Site n'ebe ahụ, mgbe anyị malitesịrị njem anyị n’oké osimiri, anyị ji ụgbọ mmiri gaa n’akụkụ Saịprọs nke ifufe na-adịghị efesi ike,[a] n’ihi na ifufe ahụ na-emegide anyị.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “anyị jiri ụgbọ mmiri gaa n’akụkụ Saịprọs a na-echebe site n’ifufe.” Ngwaa Grik e ji mee ihe ebe a bụ okwu ndị njem ụgbọ mmiri ji ekwu maka ịkwọ ụgbọ mmiri n’akụkụ agwaetiti nke ifufe na-adịghị efesi ike.
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀκεῖθεν
  choice: Mgbe anyị si ebe ahụ
  rationale: “Si ebe ahụ” na-egosipụta ἐκεῖθεν n’Igbo nkịtị; njikọ “mgbe” na-ejikọta ya na participle na-esote n’ụzọ dị larịị ma na-edobe usoro akụkọ ahụ.
- source_word: ἀναχθέντες
  choice: banye n’oké osimiri
  rationale: N’ọnọdụ njem ụgbọ mmiri, ἀνάγω pụtara isi n’ọdụ ụgbọ mmiri pụọ banye n’oké osimiri. Nhọrọ a anaghị agbakwụnye nkọwa pụrụ iche nke ‘ịdọpụta arịlịka,’ nke okwu Grik ahụ anaghị achọ kpọmkwem.
- source_word: ὑπεπλεύσαμεν
  choice: anyị jiri ụgbọ mmiri gafee n’akụkụ ... nke chebere anyị pụọ n’ifufe
  rationale: ὑποπλέω bụ okwu njem ụgbọ mmiri nke na-egosi ịgafe n’akụkụ agwaetiti nke na-enye nchebe pụọ n’ifufe. A sụgharịrị echiche ahụ n’Igbo doro anya kama iji okwu ọrụ ụgbọ mmiri na-agaghị adị ọtụtụ ndị mfe.
- source_word: τὴν Κύπρον
  choice: Saịprọs
  rationale: Nke a bụ nsụgharị mkpụrụokwu aha agwaetiti Κύπρος n’usoro mkpọpụta Igbo.
- source_word: διὰ τὸ ... εἶναι
  choice: n’ihi na
  rationale: διά tinyere infinitive nwere article na-egosi ihe kpatara omume ahụ; “n’ihi na” bụ ụzọ Igbo doro anya e si kwuo ya.
- source_word: τοὺς ἀνέμους
  choice: ifufe
  rationale: “Ifufe” bụ okwu Igbo nkịtị maka ἄνεμος, ọ dịghịkwa mkpa ịmanye akara ọtụtụ n’aha Igbo a n’ihi na ngwaa na ihe gbara ya gburugburu na-enye echiche ahụ.
- source_word: ἐναντίους
  choice: na-emegide anyị
  rationale: Nke a na-egosipụta na ifufe ahụ na-aga n’ụzọ megidere njem ha. “Anyị” bụ ihe okwu ahụ na-ezo aka na ya n’ọnọdụ a, ọ bụ ezie na e kwughị nnọchiaha ahụ iche na Grik.
theological_decisions: []
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ugwu ma dịkwa mfe nghọta, mee ihe. A kọwara okwu ọrụ ụgbọ mmiri ahụ n'ụzọ onye na-agụ akwụkwọ nkịtị ga-aghọta, ebe nkọwa ala mmiri ya ka echekwara na ihe odide ukwu na nkọwa ala peeji.
