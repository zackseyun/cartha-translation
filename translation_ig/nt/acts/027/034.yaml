  text: διὸ παρακαλῶ ὑμᾶς ⸀μεταλαβεῖν τροφῆς, τοῦτο γὰρ πρὸς τῆς ὑμετέρας σωτηρίας ὑπάρχει· οὐδενὸς γὰρ ὑμῶν θρὶξ ⸀ἀπὸ τῆς κεφαλῆς ⸀ἀπολεῖται.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/034.yaml
  text: Therefore I urge you to take some food[a], for this is for your preservation; for not a hair from the head of any of you will perish.
translation:
  language: ig
  text: N’ihi ya, ana m arịọsi unu ike ka unu rie nri,[a] n’ihi na nke a bụ maka ịlanarị unu; n’ihi na ọbụna otu ntutu isi agaghị efu n’isi onye ọ bụla n’ime unu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’ihi na nke a bụ maka nzọpụta unu.” Okwu Grik a pụrụ ịpụta “nzọpụta,” “nnapụta,” ma ọ bụ “nchekwa”; n’ebe a, ọ na-ezo aka n’ịlanarị anụ ahụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ
  choice: N’ihi ya
  rationale: Ọ na-egosi nkwubi okwu sitere n’ọnọdụ na ndụmọdụ ndị bu ụzọ; okwu a bụ nke Igbo nkịtị ma na-edobe njikọ echiche ahụ.
- source_word: παρακαλῶ
  choice: ana m arịọsi unu ike
  rationale: N’ebe a, Pọl na-arịọ ha arịrịọ siri ike ka ha mee ihe; ntụgharị a na-egosi ịdị ngwa na ịdị mkpa n’enweghị asụsụ siri ike nghọta.
- source_word: μεταλαβεῖν τροφῆς
  choice: ka unu rie nri
  rationale: Nkebiokwu Grik a pụtara iri ma ọ bụ ịnara ihe oriri. ‘Rie nri’ bụ ụzọ kacha eke na Igbo isi kwuo ya.
- source_word: τοῦτο γὰρ πρὸς τῆς ὑμετέρας σωτηρίας ὑπάρχει
  choice: n’ihi na nke a ga-enyere unu aka ịlanarị
  rationale: N’ọnọdụ ihe ize ndụ n’oké osimiri, σωτηρία na-ezo aka n’ịzọpụta ndụ ma ọ bụ ịlanarị. Okwu a na-eme ka uru iri nri bara maka nlanarị ha doo anya.
- source_word: σωτηρίας
  choice: ịlanarị
  rationale: Ọnọdụ akụkọ ahụ na-akwado nzọpụta pụọ n’ọnwụ anụ ahụ. ‘Ịlanarị’ doro ndị na-agụ Igbo anya, ebe nkọwa ala peeji na-echekwa obosara okwu Grik ahụ.
- source_word: οὐδενὸς γὰρ ὑμῶν
  choice: onye ọ bụla n’ime unu
  rationale: 'Nke a na-edobe ike nkesa nke mkpụrụokwu Grik: ọ dịghị otu onye n’ime ha a ga-ahapụ n’ezi nkwa ahụ.'
- source_word: θρὶξ ἀπὸ τῆς κεφαλῆς
  choice: ọbụna otu agịrị isi ... n’isi
  rationale: Nke a na-edobe ihe atụ doro anya nke otu agịrị isi, bụ́ akpaalaokwu na-emesi nchebe zuru ezu ike.
- source_word: ἀπολεῖται
  choice: agaghị efu
  rationale: N’ebe ọ gbasara agịrị isi, ‘efu’ bụ okwu Igbo eke ma na-egosipụta nkwa siri ike na ọbụna otu agịrị isi agaghị ala n’iyi.
theological_decisions:
- issue: Ihe σωτηρία pụtara n’ọnọdụ a
  choice: ịlanarị ma ọ bụ ịzọpụta ndụ anụ ahụ
  alternative: nzọpụta
  rationale: Ihe gbara amaokwu a gburugburu bụ oké ifufe na nkwa na ndị niile nọ n’ụgbọ mmiri ga-adị ndụ. Isi ederede na-enye nghọta nke ọnọdụ ahụ, ma nkọwa ala peeji na-echekwa ohere sara mbara nke okwu Grik, gụnyere ‘nzọpụta.’
translation_notes:
  register: Asụsụ Igbo izugbe, nke oge a ma dị ùgwù. A họọrọ ‘rie nri’ kama okwu emume ma ọ bụ okwu ochie; ‘arịọsi unu ike’ na-egosi arịrịọ siri ike. Akpaalaokwu banyere otu agịrị isi ka e debere iji chekwaa ike na onyonyo nke isi mmalite.
