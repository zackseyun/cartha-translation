  text: Ἄχρι δὲ οὗ ⸂ἡμέρα ἤμελλεν⸃ γίνεσθαι παρεκάλει ὁ Παῦλος ἅπαντας μεταλαβεῖν τροφῆς λέγων· Τεσσαρεσκαιδεκάτην σήμερον ἡμέραν προσδοκῶντες ἄσιτοι διατελεῖτε, μηθὲν προσλαβόμενοι·
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/033.yaml
  text: Until the day was about to dawn[a], Paul kept urging them all to take some food, saying, “Today is the fourteenth day that you have continued in suspense without eating, having taken nothing.”
translation:
  language: ig
  text: Ruo mgbe chi fọrọ ịbọ[a], Pọl nọgidere na-arịọ ha niile ka ha rie nri, na-asị, “Taa bụ ụbọchị nke iri na anọ unu nọgidere na-eche, na-erighị nri, na-etinyeghị ihe ọ bụla n’ọnụ.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Ruo mgbe ụbọchị fọrọ ịmalite.” N’ụzọ nkịtị, “ruo mgbe ụbọchị na-achọ ịmalite.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄχρι δὲ οὗ
  choice: Ka ... na-achọ
  rationale: Na-ejikọta omume Pọl na oge chi na-achọ ịbọ, ma na-echekwa echiche nke njedebe oge dị na nkebi Grik ahụ.
- source_word: ἡμέρα ἤμελλεν γίνεσθαι
  choice: chi na-achọ ịbọ
  rationale: Nke a bụ ụzọ Igbo nkịtị si ekwu na ìhè ụtụtụ adịla nso; ọ na-enye echiche nke ihe na-aga ime n’oge na-adịghị anya.
- source_word: παρεκάλει
  choice: nọgidere na-arịọ
  rationale: Ọ na-egosipụta omume gara n’ihu ma ọ bụ e mere ugboro ugboro dị ka imperfect Grik si dị, tinyekwa ume dị n’ịrịọ ha ka ha rie.
- source_word: ἅπαντας
  choice: ha niile
  rationale: Ọ na-agụnye onye ọ bụla nọ ebe ahụ n’enweghị ịhapụ onye ọ bụla.
- source_word: μεταλαβεῖν τροφῆς
  choice: ka ha rie nri
  rationale: Ọ bụ okwu Igbo doro anya ma dị ndụ maka iri ihe iji nweta ume; ọ na-ezere ntụgharị siri ike nke na-agaghị ada nke ọma n’Igbo.
- source_word: Τεσσαρεσκαιδεκάτην σήμερον ἡμέραν
  choice: Taa bụ ụbọchị nke iri na anọ
  rationale: Ọ na-echekwa nkwusi ike Grik na taa bụ kpọmkwem ụbọchị nke iri na anọ.
- source_word: προσδοκῶντες
  choice: nọ na nchegbu na-eche
  rationale: Ọ na-echekwa isi echiche nke ichere ma gosipụta ọnọdụ ụjọ na enweghị obi iru ala nke oke ifufe ahụ, n’ebughị ụzọ mee ka naanị otu nghọta bụrụ iwu.
- source_word: ἄσιτοι διατελεῖτε
  choice: unu erighị nri
  rationale: Ọ na-egosi ọnọdụ nke ịnọgide n’erighị nri, ma zere okwu nwere ike ime ka a ghọta ya dị ka ibu ọnụ nke okpukpe.
- source_word: μηθὲν προσλαβόμενοι
  choice: unu etinyebeghịkwa ihe ọ bụla n’ọnụ
  rationale: Ọ bụ akpaalaokwu Igbo ebumpụta ụwa nke pụtara na ha eribeghị ihe ọ bụla; ọ na-echekwa nkwusi ike nke nkebi mmechi ahụ.
