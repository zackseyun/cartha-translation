  - severity: low
    issue: 'Nsụpe okwu n’ala ala peeji: ‘otu agha’'
    rationale: N’ebe a a chọrọ ‘òtù agha,’ ya bụ, otu military unit. ‘otu agha’ nwere ike ịpụta otu onye agha.
