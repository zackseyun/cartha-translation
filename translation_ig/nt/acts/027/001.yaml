  to: Mgbe e kpebiri na anyị ga-eji ụgbọ mmiri gaa Ịtali, ha nyefere ma Pọl ma ụfọdụ ndị mkpọrọ ndị ọzọ n’aka otu onyeisi ndị agha otu narị aha ya bụ Julịọs, onye so n’Òtù Ndị Agha nke Eze Ukwu.[a]
  rationale: 'E mere naanị ndozi nchekwa abụọ: e ji ‘ma ... ma ...’ gosipụta τε...καί nke ọma, ma dozie ‘otu agha’ ka ọ bụrụ ‘òtù agha’ n’ala ala peeji. A hapụrụ ambiguity akụkọ ihe mere eme nke σπείρης Σεβαστῆς ka ọ dị, a naghị atụkwasịkwa nkọwa ozizi ọ bụla.'
