id: ACT.27.1
reference: Acts 27:1
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ὡς δὲ ἐκρίθη τοῦ ἀποπλεῖν ἡμᾶς εἰς τὴν Ἰταλίαν, παρεδίδουν τόν τε Παῦλον καί τινας ἑτέρους δεσμώτας ἑκατοντάρχῃ ὀνόματι Ἰουλίῳ σπείρης Σεβαστῆς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/001.yaml
  text: When it was decided that we should sail for Italy[a], they handed over both Paul and some other prisoners to a centurion named Julius, of the Augustan Cohort.
translation:
  language: ig
  text: Mgbe e kpebiri na anyị ga-eji ụgbọ mmiri gaa Ịtali, ha nyefere ma Pọl ma ụfọdụ ndị mkpọrọ ndị ọzọ n’aka otu onyeisi ndị agha otu narị aha ya bụ Julịọs, onye so n’Òtù Ndị Agha nke Eze Ukwu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “Òtù Ndị Agha Ọgọstọs”; ikekwe, “òtù ndị agha Sebaste.” Okwu Grik bụ Σεβαστῆς na-egosi utu aha metụtara Ọgọstọs ma ọ bụ eze ukwu, ma a maghị kpọmkwem òtù agha akụkọ ihe mere eme ọ na-ezo aka na ya.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκρίθη
  choice: e kpebiri
  rationale: Ọ bụ ụzọ Igbo dị nkenke ma dịkwa ebumpụta ụwa isi gosipụta aorist passive e ji n’ụzọ na-akọwaghị onye mere mkpebi ahụ; ọ na-edobe echiche nke mkpebi ọchịchị n’agbanyeghị na akpọghị ndị kpebiri ya aha.
- source_word: τοῦ ἀποπλεῖν ἡμᾶς
  choice: na anyị ga-eji ụgbọ mmiri gaa
  rationale: Nke a na-egosipụta ihe e kpebiri, na-edobe ‘anyị’ nke akụkọ onye mbụ, ma na-eme ka ụzọ njem n’oké osimiri pụta ìhè.
- source_word: παρεδίδουν
  choice: ha nyefere ... n’aka
  rationale: Akpaalaokwu Igbo a na-egosipụta inyefe ndị mkpọrọ n’okpuru nlekọta onye ọzọ. Oge gara aga dị mfe na-aga nke ọma n’usoro akụkọ Igbo, ọ bụ ezie na Grik ji imperfect.
- source_word: τόν τε Παῦλον καί τινας ἑτέρους δεσμώτας
  choice: Pọl na ụfọdụ ndị mkpọrọ ndị ọzọ
  rationale: Ọ na-edobe Pọl tinyere ndị mkpọrọ ndị ọzọ n’enweghị ịgbakwunye nkọwa na-adịghị na isi mmalite.
- source_word: ἑκατοντάρχῃ
  choice: otu onyeisi ndị agha otu narị
  rationale: Nkọwa a na-eme ka ọrụ agha ahụ doo onye Igbo nke oge a anya karịa iji naanị aha ọkwa agha e si n’asụsụ ọzọ webata.
- source_word: ὀνόματι Ἰουλίῳ
  choice: aha ya bụ Julịọs
  rationale: Nke a bụ usoro Igbo nkịtị na nke doro anya e ji ewebata aha mmadụ.
- source_word: σπείρης Σεβαστῆς
  choice: Òtù Ndị Agha nke Eze Ukwu
  rationale: Nke a na-enye echiche bụ isi nke otu agha metụtara eze ukwu, ma e debere nsụgharị ndị ka nso n’ụdị okwu Grik na ihe a na-ejighị n’aka banyere otu agha ahụ n’ala ala peeji.
theological_decisions:
- issue: Ihe σπείρης Σεβαστῆς kpọrọ kpọmkwem n’akụkọ ihe mere eme
  choice: Òtù Ndị Agha nke Eze Ukwu
  alternative: Òtù Ndị Agha Ọgọstọs; ma ọ bụ òtù ndị agha Sebaste
  rationale: Okwu a abụghị okwu ozizi, ma njirimara otu agha ahụ edoghị anya kpamkpam. Nsụgharị isi na-eme ka njikọ ya na eze ukwu doo anya n’Igbo, ebe ala ala peeji na-echekwa ụzọ ndị ọzọ e si aghọta aha ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A kọwara centurion dịka onyeisi ndị agha otu narị, e jikwara mkpụrụedemede ukwu gosi na Òtù Ndị Agha nke Eze Ukwu bụ aha otu agha. E debere akara ala ala peeji [a] ozugbo n’aha otu agha ọ na-akọwa.
