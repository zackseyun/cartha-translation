  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐπιβάντες δὲ πλοίῳ Ἀδραμυττηνῷ ⸀μέλλοντι πλεῖν ⸀εἰς τοὺς κατὰ τὴν Ἀσίαν τόπους ἀνήχθημεν ὄντος σὺν ἡμῖν Ἀριστάρχου Μακεδόνος Θεσσαλονικέως·
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/002.yaml
  text: So we boarded an Adramyttian ship that was about to sail to the places along Asia, and put out to sea, with Aristarchus, a Macedonian from Thessalonica, being with us.
translation:
  language: ig
  text: Anyị banyere n’ụgbọ mmiri si Adramitium, nke ga-aga n’ebe dị iche iche n’akụkụ Eshia[a][b], wee pụọ n’ọdụ ụgbọ mmiri. Aristakọs, onye Masedonia si Tesalonaịka, sokwa anyị.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Eshia a bụ ógbè ọchịchị Rom dị n’ọdịda anyanwụ Eshia Maịnọ n’oge ahụ; ọ bụghị kọntinent Eshia nke oge a.
    reason: cultural_note
  - marker: b
    text: Ma ọ bụ, “n’ọdụ ụgbọ mmiri dị iche iche n’akụkụ ụsọ oké osimiri Eshia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιβάντες
  choice: anyị banyere n’ụgbọ mmiri
  rationale: N’ọnọdụ njem mmiri, okwu a pụtara ịbanye n’ụgbọ mmiri; nsụgharị a bụ Igbo nkịtị ma debe usoro ihe ndị mere.
- source_word: δὲ
  choice: Ya mere
  rationale: N’ebe a, δέ na-aga n’ihu n’akụkọ kama igosi nnukwu esemokwu; “Ya mere” jikọtara amaokwu a na nke bu ya ụzọ nke ọma.
- source_word: πλοίῳ Ἀδραμυττηνῷ
  choice: n’ụgbọ mmiri si Adramitium
  rationale: Adjective ahụ na-egosi ebe ụgbọ mmiri ahụ si ma ọ bụ ọdụ ụgbọ mmiri ya; ikwu “si Adramitium” doro ndị na-agụ Igbo anya karịa ime aha ahụ adjective.
- source_word: μέλλοντι πλεῖν
  choice: nke na-aga ịkwọga
  rationale: μέλλω na infinitive na-egosi ebumnobi ma ọ bụ ihe na-aga ime; n’ebe a, ọ bụ njem ụgbọ mmiri a haziri ime.
- source_word: εἰς τοὺς κατὰ τὴν Ἀσίαν τόπους
  choice: n’ebe dị iche iche n’akụkụ Esia
  rationale: “Ebe dị iche iche” na-egosipụta echiche nkesa nke τόπους na κατὰ, ebe “n’akụkụ Esia” na-edebe nkọwa ala ahụ n’enweghị itinye “ọdụ ụgbọ mmiri” n’amaokwu n’onwe ya.
- source_word: Ἀσίαν
  choice: Esia[a]
  rationale: E debere aha ala ahụ, ma ihe odide ala ala peeji na-akọwa na ọ bụ ógbè Rom oge ahụ, ọ bụghị kọntinent Esia nke oge a.
- source_word: ἀνήχθημεν
  choice: anyị wee pụọ n’ọdụ ụgbọ mmiri
  rationale: ἀνάγω n’ọnọdụ njem mmiri pụtara ịpụ n’ọdụ ụgbọ mmiri banye n’oké osimiri; nsụgharị a doro anya ma dịrị Igbo mma.
- source_word: ὄντος σὺν ἡμῖν
  choice: sokwa anyị
  rationale: Genitive absolute ahụ na-enye ọnọdụ onye so ha; e mere ya ahịrịokwu dị mfe ma debe ihe ọ pụtara.
- source_word: Ἀριστάρχου
  choice: Aristakọs
  rationale: E degharịrị aha Grik ahụ n’ụzọ kwekọrọ na ụda na mkpụrụedemede Igbo.
- source_word: Μακεδόνος
  choice: onye Masedonia
  rationale: Okwu ahụ na-akọwa mpaghara Aristakọs si; “onye Masedonia” bụ usoro Igbo doro anya.
- source_word: Θεσσαλονικέως
  choice: si Tesalonaịka
  rationale: Nke a na-akọwa obodo ya; “si Tesalonaịka” na-ezere ịchịkọta aha abụọ a na-akpọ ndị obodo n’usoro na-adịghị eke eke n’Igbo.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E kewara ahịrịokwu ogologo Grik ahụ ụzọ abụọ ka ọ bụrụ nke a na-agụ nke ọma, ma e debere usoro njem ahụ na ozi gbasara Aristakọs.
