revisions:
- from: Mgbe ha tọpụsịrị arịlịka ndị ahụ, ha hapụrụ ha n’oké osimiri. N’otu mgbe ahụ, ha tọpụkwara ụdọ ndị e ji kee ihe ndị e ji akwọ ụgbọ mmiri[a], welie ákwà dị n’ihu ụgbọ mmiri ka ifufe jide ya[b], wee chee ihu n’ụsọ aja.
  to: Mgbe ha tọpụsịrị arịlịka ndị ahụ, ha hapụrụ ha n’oké osimiri. N’otu mgbe ahụ, ha tọpụkwara ụdọ ndị e ji ejide ihe nduzi ụgbọ mmiri[a], welie ákwà ụgbọ mmiri ahụ n’ihu ifufe na-efe[b], wee duru ụgbọ ahụ gaa n’ụsọ aja.
  rationale: The revision preserves the Greek nautical actions and their order while avoiding an added assertion that the wind caught the sail. It makes the final action an actual course toward the beach, and it restores the full uncertainty surrounding the technical name of the sail.
  reviewer_model: gpt-5.6-terra
