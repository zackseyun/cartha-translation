id: ACT.27.40
reference: Acts 27:40
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ τὰς ἀγκύρας περιελόντες εἴων εἰς τὴν θάλασσαν, ἅμα ἀνέντες τὰς ζευκτηρίας τῶν πηδαλίων, καὶ ἐπάραντες τὸν ἀρτέμωνα τῇ πνεούσῃ κατεῖχον εἰς τὸν αἰγιαλόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/040.yaml
  text: And after casting off the anchors[a], they left them in the sea; at the same time loosening the ropes of the rudders, and hoisting the foresail to the wind[b], they made for the beach.
translation:
  language: ig
  text: Mgbe ha tọpụsịrị arịlịka ndị ahụ, ha hapụrụ ha n’oké osimiri. N’otu mgbe ahụ, ha tọpụkwara ụdọ ndị e ji ejide ihe nduzi ụgbọ mmiri[a], welie ákwà ụgbọ mmiri ahụ n’ihu ifufe na-efe[b], wee duru ụgbọ ahụ gaa n’ụsọ aja.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ihe nkekọ ma ọ bụ ihe e ji ejide ihe nduzi ụgbọ mmiri.” Okwu Grik a bụ okwu ụgbọ mmiri a na-adịghị ahụkarị; ọ na-ezo aka n’ihe e ji ejide ngwa nduzi ụgbọ ahụ.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ákwà elu ụgbọ mmiri” ma ọ bụ “ákwà dị n’ihu ụgbọ mmiri.” A maghị kpọmkwem ụdị ákwà ụgbọ mmiri okwu Grik a na-ezo aka na ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: περιελόντες
  choice: Mgbe ha tọpụsịrị
  rationale: Aorist participle ahụ na-egosi ihe ha buru ụzọ mee. N’ọnọdụ ụgbọ mmiri a, “tọpụsịrị” na-egosi na ha kewapụrụ arịlịka ndị ahụ n’ụgbọ ahụ, n’agbanyeghị na okwu Grik ahụ ekwughị kpọmkwem ma hà gbubiri ụdọ ya.
- source_word: τὰς ἀγκύρας
  choice: arịlịka ndị ahụ
  rationale: “Arịlịka” bụ okwu Igbo a na-aghọta nke ọma maka ihe e ji ejide ụgbọ mmiri ka ọ ghara ịkwaga.
- source_word: εἴων εἰς τὴν θάλασσαν
  choice: ha hapụrụ ha n’oké osimiri
  rationale: Nke a na-egosi na ha kwụsịrị ijide arịlịka ndị ahụ ma hapụ ha n’ime mmiri.
- source_word: ἅμα
  choice: N’otu mgbe ahụ
  rationale: Ọ na-egosi na ihe ndị na-esochi ya mere n’otu oge ahụ.
- source_word: ἀνέντες
  choice: ha tọpụkwara
  rationale: N’ebe a, okwu ahụ pụtara ịhapụ ma ọ bụ ịtọpụ ihe e kechiri ekechi.
- source_word: τὰς ζευκτηρίας τῶν πηδαλίων
  choice: ụdọ ndị e ji kee ihe ndị e ji akwọ ụgbọ mmiri
  rationale: ζευκτηρίας bụ okwu ụgbọ mmiri a na-adịghị ahụkarị, nke na-ezo aka n’ihe e ji kee ma ọ bụ jide ngwa ndị e ji eduzi ụgbọ ahụ. Nsụgharị a doro onye na-agụ oge a anya, ebe e debere ekwe omume ọzọ n’ala peeji.
- source_word: ἐπάραντες
  choice: welie
  rationale: Ọ pụtara ibuli ihe elu; nke a dabara n’ibuli ákwà ụgbọ mmiri ka ifufe jide ya.
- source_word: τὸν ἀρτέμωνα
  choice: ákwà dị n’ihu ụgbọ mmiri
  rationale: Nke a bụ okwu pụrụ iche gbasara ụgbọ mmiri, ma kpọmkwem ụdị ákwà ụgbọ mmiri ọ bụ edochaghị anya. “Ákwà dị n’ihu ụgbọ mmiri” na-enye nghọta bụ isi n’etinyeghị nkọwa a na-ejighị n’aka.
- source_word: τῇ πνεούσῃ
  choice: ka ifufe jide ya
  rationale: Participle ahụ na-ezo aka n’ifufe na-efe. Nsụgharị a na-egosi nzube nke ibuli ákwà ahụ n’asụsụ Igbo dị mfe ma bụrụ nke ebumpụta ụwa.
- source_word: κατεῖχον εἰς τὸν αἰγιαλόν
  choice: wee chee ihu n’ụsọ aja
  rationale: κατέχω nwere nghọta ụgbọ mmiri nke idobe ụzọ ma ọ bụ ịga n’ebe a chọrọ iru; αἰγιαλός bụ ụsọ mmiri nwere aja, ya bụ ebe ha chọrọ ịdabere ụgbọ ahụ.
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A kọwara okwu ụgbọ mmiri ndị pụrụ iche n’ụzọ onye nkịtị ga-aghọta, ma e debere ejighị n’aka banyere ζευκτηρίας na ἀρτέμων n’ala peeji. Ebugharịghị ntụaka [a] nke English POB dị n’akụkụ “anchors” n’ebe ahụ, n’ihi na nkọwa ya metụtara ζευκτηρίας, ọ bụghị ἀγκύρας; e tinyere ya n’ebe okwu gbasara ụdọ e ji kee ngwa nduzi ụgbọ mmiri dị.
