  text: λέγων· Μὴ φοβοῦ, Παῦλε· Καίσαρί σε δεῖ παραστῆναι, καὶ ἰδοὺ κεχάρισταί σοι ὁ θεὸς πάντας τοὺς πλέοντας μετὰ σοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/024.yaml
  text: saying, ‘Do not be afraid, Paul. You must stand before Caesar, and look, God has granted to you all those sailing with you.’
translation:
  language: ig
  text: na-ekwu, “Atụla egwu, Pọl. Ị ghaghị iguzo n’ihu Siza; lee, Chineke enyela gị ndị niile ha na gị na-akwọ ụgbọ mmiri.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μὴ φοβοῦ
  choice: Atụla egwu
  rationale: Nke a bụ ụzọ Igbo nkịtị na nke doro anya si enye iwu ka mmadụ kwụsị ịtụ egwu.
- source_word: Καίσαρί
  choice: Siza
  rationale: Aha/utu aha eze ukwu Rom a na-asụkarị n’Igbo dị ka “Siza.”
- source_word: δεῖ παραστῆναι
  choice: Ị ga-eguzorịrị n’ihu
  rationale: “Ga-...rịrị” na-egosipụta mkpa ma ọ bụ ihe a kara aka dị na δεῖ; “iguzo n’ihu” na-echekwa ihe oyiyi ikpe/ịpụta n’ihu onye ọchịchị dị na παραστῆναι.
- source_word: ἰδοὺ
  choice: lee
  rationale: “Lee” bụ oku ebumpụta ụwa n’Igbo ka onye na-ege ntị ṅaa ntị n’ihe dị mkpa.
- source_word: κεχάρισταί σοι ὁ θεὸς
  choice: Chineke ejirila amara nye gị
  rationale: Nke a na-echekwa echiche nke inye ihe n’amara dị na χαρίζομαι, yana nsonaazụ nke perfect tense.
- source_word: πάντας τοὺς πλέοντας μετὰ σοῦ
  choice: ndị niile gị na ha so n’ụgbọ mmiri
  rationale: 'Nsụgharị a na-enye ihe okwu Grik pụtara n’Igbo dị mfe ma doo anya: mmadụ niile ha na Pọl nọ n’otu njem mmiri ahụ.'
theological_decisions:
- issue: Ihe “Chineke nyere Pọl” pụtara
  choice: E debere okwu ahụ dịka “Chineke ejirila amara nye gị ndị niile...” n’enweghị nkọwa ọzọ banyere ụdị nzọpụta ha ga-enweta.
  alternative: Ịsụgharị ya hoo haa dịka “Chineke ga-azọpụta ndụ ndị niile...”
  rationale: Okwu Grik na-egosi na Chineke nyere Pọl ndị niile ya na ha na-eme njem, ma amaokwu a n’onwe ya akọwaghị kpọmkwem ọdịdị onyinye ahụ. Nsụgharị ahụ na-echekwa ntakịrị mgbagwoju anya a ma hapụ ọnọdụ gbara ya gburugburu ka ọ kọwaa ya.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E ji “ga-eguzorịrị” gosipụta mkpa siri ike nke δεῖ, ebe “ejirila amara nye” na-edobe agba amara nke κεχάρισται.
