  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τῶν δὲ στρατιωτῶν βουλὴ ἐγένετο ἵνα τοὺς δεσμώτας ἀποκτείνωσιν, μή τις ἐκκολυμβήσας διαφύγῃ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/042.yaml
  text: The soldiers’ plan was to kill the prisoners, so that no one might swim away and escape.
translation:
  language: ig
  text: Ma atụmatụ ndị agha ahụ bụ ka ha gbuo ndị mkpọrọ ahụ, ka onye ọbụla ghara igwu mmiri gbanahụ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βουλὴ ἐγένετο
  choice: kpebiri
  rationale: N'ọnọdụ a, nkebiokwu ahụ na-egosi na ndị agha ahụ mere atụmatụ ma kpebie ime ya; ‘kpebiri’ bụ ụzọ Igbo doro anya ma dị eke isi kwuo ya.
- source_word: τοὺς δεσμώτας
  choice: ndị mkpọrọ ahụ
  rationale: Ọ na-ezo aka n’ụmụ mmadụ e ji agbụ ma na-eche nche dịka ndị mkpọrọ; mgbakwunye ‘ahụ’ na-ejikọta ha na ndị a kpọtụrụla n’akụkọ ahụ.
- source_word: ἀποκτείνωσιν
  choice: igbu
  rationale: 'Nke a na-eburu ihe okwu Grik pụtara kpọmkwem: ime ka mmadụ nwụọ.'
- source_word: ἐκκολυμβήσας διαφύγῃ
  choice: igwu mmiri gbapụ
  rationale: Ọ na-echekwa ụzọ mgbapụ ahụ—igwu mmiri—na nsonaazụ ya, bụ́ ịgbapụ.
- source_word: μή τις
  choice: ka onye ọ bụla ghara
  rationale: 'Nke a na-egosipụta ebumnuche mgbochi ahụ n’Igbo eke: ka a ghara inwe onye ga-agbanahụ.'
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị mfe ma dị ùgwù. E jighị okwu mmalite pụrụ iche dochie δέ; ‘Ma’ na-egosi ntụgharị dị nro n’akụkọ ahụ n’enweghị itinye echiche oge na-adịghị na isi mmalite.
