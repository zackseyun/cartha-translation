  to: Ma ugbu a, ana m agba unu ume ka obi sie unu ike[a], n’ihi na ọ dịghị onye ọ bụla n’ime unu ga-atụfu ndụ ya[b]; ọ bụ naanị ụgbọ mmiri ahụ ga-efu.
  rationale: 'The revision changes only the final verb, from a passive meaning “be thrown away” to the natural expression “ga-efu” (“will be lost”), preserving the Greek contrast: no person among them will lose life, but the ship will be lost. Footnote a is lightly smoothed for natural Igbo aspect.'
