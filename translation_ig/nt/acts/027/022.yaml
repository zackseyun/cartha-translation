  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ τὰ νῦν παραινῶ ὑμᾶς εὐθυμεῖν, ἀποβολὴ γὰρ ψυχῆς οὐδεμία ἔσται ἐξ ὑμῶν πλὴν τοῦ πλοίου·
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/022.yaml
  text: And now I urge you to take courage[a], for there will be no loss of life among you[b], except for the ship.
translation:
  language: ig
  text: Ma ugbu a, ana m agba unu ume ka obi sie unu ike[a], n’ihi na ọ dịghị onye ọ bụla n’ime unu ga-atụfu ndụ ya[b]; ọ bụ naanị ụgbọ mmiri ahụ ga-efu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ka unu nwee obi ụtọ” ma ọ bụ “nọgidenụ na-enwe obi ike.”
    reason: lexical_alternative
  - marker: b
    text: 'N’asụsụ Grik: “ọ dịghị mfu ndụ ọ bụla.” Okwu ψυχή n’ebe a na-ezo aka ná ndụ anụ ahụ, ọ bụghị kpọmkwem mkpụrụ obi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ νῦν
  choice: ma ugbu a
  rationale: Ọ bụ okwu oge na-ewebata ndụmọdụ Pọl na-enye ha n’ọnọdụ ha nọ ugbu a; “ugbu a” bụ ụzọ Igbo nkịtị si kwuo ya.
- source_word: παραινῶ
  choice: ana m agba unu ume
  rationale: Nke a na-egosi ndụmọdụ siri ike nke na-agbakwa ndị na-ege ntị ume, n’ụzọ dị ndụ ma bụrụ Igbo a na-aghọta ngwa ngwa.
- source_word: εὐθυμεῖν
  choice: ka obi sie unu ike
  rationale: Nkebiokwu a na-egosi inwe obi ike na ịnọgide n’ezigbo mmụọ n’etiti ihe egwu; ọ dabara n’ọnọdụ oke ifufe n’oké osimiri.
- source_word: ἀποβολὴ
  choice: ga-atụfu
  rationale: N’ebe a, okwu ahụ pụtara mfu, ọ bụghị ịtụpụ ihe n’ụzọ nkịtị. E jiri ngwaa mee ya ka ahịrịokwu Igbo bụrụ nke e ji ọnụ ekwu nke ọma.
- source_word: ψυχῆς
  choice: ndụ ya
  rationale: ψυχή n’ọnọdụ a na-ezo aka ná ndụ anụ ahụ nke mmadụ, ọ bụghị kpọmkwem mkpụrụ obi dị iche n’ahụ.
- source_word: οὐδεμία ἔσται
  choice: ọ dịghị onye ọ bụla ... ga-atụfu
  rationale: Nke a na-echekwa nkwusi ike nke ngọnarị ahụ ma na-eme ka okwu ahụ doo anya n’Igbo.
- source_word: ἐξ ὑμῶν
  choice: n’ime unu
  rationale: Ọ na-egosi ìgwè ahụ nke ọ na-agaghị adị onye ndụ ya ga-efu; “n’ime unu” bụ okwu Igbo dabara adaba.
- source_word: πλὴν τοῦ πλοίου
  choice: naanị ụgbọ mmiri ahụ ka a ga-atụfu
  rationale: 'πλήν na-egosi ihe e wepụrụ n’ihe e kwuru: ndị mmadụ agaghị anwụ, ma ụgbọ mmiri ahụ ga-ala n’iyi. Nhazi a na-eme ka ọdịiche ahụ doo anya n’Igbo.'
theological_decisions:
- issue: Ihe ψυχή pụtara n’ebe a
  choice: ndụ anụ ahụ nke onye ọ bụla
  alternative: mkpụrụ obi
  rationale: Ọnọdụ akụkọ ahụ bụ nzọpụta ndị nọ n’ụgbọ mmiri pụọ n’ọnwụ; ya mere, ịsụgharị ya “mkpụrụ obi” nwere ike iweta nkewa ahụ na mkpụrụ obi nke okwu Grik ahụ anaghị ekwusi ike n’ebe a.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. “Ka obi sie unu ike” bụ okwu e ji ọnụ ekwu nke ọma maka nkwado obi n’oge ihe egwu; ahịrịokwu ikpeazụ gbanwere gaa n’usoro Igbo ebumpụta ụwa ma chekwaa ọdịiche dị n’etiti ndụ ndị mmadụ na mfu ụgbọ mmiri.
