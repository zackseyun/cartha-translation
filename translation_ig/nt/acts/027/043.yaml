translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. A kọwara aha ọkwa agha Rom ahụ kama iji okwu mbịarambịa; e chekwara njikọ akụkọ ahụ na amaokwu bu ụzọ na usoro ndị e nyere iwu ka ha mee ihe.
