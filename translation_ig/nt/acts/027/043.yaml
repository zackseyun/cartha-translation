  text: ὁ δὲ ⸀ἑκατοντάρχης βουλόμενος διασῶσαι τὸν Παῦλον ἐκώλυσεν αὐτοὺς τοῦ βουλήματος, ἐκέλευσέν τε τοὺς δυναμένους κολυμβᾶν ἀπορίψαντας πρώτους ἐπὶ τὴν γῆν ἐξιέναι,
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/043.yaml
  text: But the centurion[a], wanting to save Paul, kept them from their plan, and ordered those who were able to swim to jump overboard first and get to land[b],
translation:
  language: ig
  text: Ma ọchịagha na-achị otu narị ndị agha ahụ, n’ịchọ ịzọpụta Pọl, gbochiri ha ime ihe ha zubere[a]. O nyekwara ndị nwere ike igwu mmiri iwu ka ha buru ụzọ si n’ụgbọ mmiri wụba n’ime mmiri, gaa n’ala[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, ‘gbochiri ha imezu nzube ha.’ Nke a na-ezo aka n’ebumnuche ndị agha ahụ e kwuru n’amaokwu bu ụzọ.
    reason: lexical_alternative
  - marker: b
    text: N’ụzọ nkịtị, ‘mgbe ha wụpụsịrị onwe ha, ha ga-ebu ụzọ gaa n’ala.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑκατοντάρχης
  choice: ọchịagha na-achị otu narị ndị agha
  rationale: Nkọwa a na-egosipụta ọkwa onyeisi ndị agha Rom n'ụzọ onye Igbo nke oge a ga-aghọta, kama iji okwu mbịarambịa na-edoghị anya.
- source_word: βουλόμενος
  choice: chọrọ
  rationale: Okwu a na-egosi ọchịchọ ma ọ bụ ebumnuche ọchịagha ahụ n’ụzọ dị mfe ma bụrụkwa nke sitere n’ọnọdụ akụkọ ahụ.
- source_word: διασῶσαι
  choice: ịzọpụta
  rationale: N’ebe a, ọ pụtara ichebe Pọl ka ọ ghara ịnwụ; ‘ịzọpụta’ na-eburu echiche ahụ nke ọma n’enweghị itinye nkọwa ọzọ na-adịghị n’isi mmalite.
- source_word: ἐκώλυσεν αὐτοὺς τοῦ βουλήματος
  choice: gbochiri ha ime ihe ha zubere
  rationale: Nke a na-egosi na ọchịagha ahụ kwụsịrị ndị agha ahụ imezu ihe ha bu n’obi ime, ya bụ, ihe e kwuru n’amaokwu bu ụzọ.
- source_word: ἐκέλευσέν τε
  choice: O wee nye ... iwu
  rationale: Nhazi a na-egosipụta iwu siri ike nke onyeisi agha nyere, ma na-aga were were n’Igbo.
- source_word: τοὺς δυναμένους κολυμβᾶν
  choice: ndị nwere ike igwu mmiri
  rationale: Ọ na-akọwapụta otu ndị nọ n’ụgbọ mmiri nwere nkà igwu mmiri n’ụzọ doro anya.
- source_word: ἀπορίψαντας
  choice: wụpụ n’ụgbọ mmiri
  rationale: Ọ bụ ụzọ Igbo si ekwu omume ịtụpụ onwe ha n’ụgbọ mmiri banye na mmiri n’ụzọ eke.
- source_word: πρώτους
  choice: buru ụzọ
  rationale: 'Ọ na-echekwa usoro ihe omume ahụ: ndị nwere ike igwu mmiri ga-ebu ndị ọzọ ụzọ.'
- source_word: ἐπὶ τὴν γῆν ἐξιέναι
  choice: gawa n’ala
  rationale: Nke a na-echekwa echiche mmegharị site n’oké osimiri gaa n’ala, na-ekwughị hoo haa na ha erutela mgbe iwu ahụ ka na-enye ha ntụziaka.
