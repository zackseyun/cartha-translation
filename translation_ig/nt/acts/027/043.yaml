revisions:
- from: Ma ọchịagha na-achị otu narị ndị agha ahụ chọrọ ịzọpụta Pọl, ya mere o gbochiri ha ime ihe ha zubere[a]. O wee nye ndị nwere ike igwu mmiri iwu ka ha buru ụzọ wụpụ n’ụgbọ mmiri, gawa n’ala[b],
  to: Ma ọchịagha na-achị otu narị ndị agha ahụ, n’ịchọ ịzọpụta Pọl, gbochiri ha ime ihe ha zubere[a]. O nyekwara ndị nwere ike igwu mmiri iwu ka ha buru ụzọ si n’ụgbọ mmiri wụba n’ime mmiri, gaa n’ala[b],
  rationale: The revision preserves the source sequence and sense while removing the unexpressed inference ‘therefore.’ It also makes the jump from the ship into the water explicit in natural Igbo and revises the literal footnote to reflect the participle and infinitive more faithfully.
