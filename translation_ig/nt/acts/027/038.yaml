  verdict: revise
  source_fidelity: 'Nkebiokwu ahụ na-anọchi anya κορεσθέντες τροφῆς, ἐκούφιζον, na participle ἐκβαλλόμενοι nke ọma: ha rijuru afọ, ha malitere ime ka ụgbọ mmiri dị mfe, site n’ịtụba ọka wit ahụ. Ma εἰς τὴν θάλασσαν pụtara kpọmkwem ‘n’ime oké osimiri,’ bụghị naanị ‘n’ime osimiri,’ n’ihi na ‘osimiri’ n’Igbo na-apụtakarị river ma nwee ike ime ka ebe a ghara ido anya.'
  naturalness: Asụsụ ahụ bụ Igbo Standard doro anya ma kwekọọ na ndebanye akụkọ. ‘Ụgbọ mmiri’ na ‘ọka wit’ bụ nhọrọ ndị nkịtị. Ịgbakwunye ‘oké’ n’ihu ‘osimiri’ na-eme ka nkọwa ebe a bụrụ nke eke ma kpọmkwem.
  terminology: ‘Ọka wit’ na-edobe nkọwa a kapịrị ọnụ nke σῖτος n’ọnọdụ a, ebe ihe odide ala peeji na-echekwa ohere ‘ọka.’ ‘Oké osimiri’ bụ okwu kwesịrị ekwesị maka θάλασσα n’akụkọ njem ụgbọ mmiri a.
