  text: κορεσθέντες ⸀δὲ τροφῆς ἐκούφιζον τὸ πλοῖον ἐκβαλλόμενοι τὸν σῖτον εἰς τὴν θάλασσαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/038.yaml
  text: And when they had eaten enough[c][b][a], they began to lighten the ship by throwing the wheat into the sea.
translation:
  language: ig
  text: Mgbe ha richara nri ruo afọ ojuju[a], ha malitere ime ka ụgbọ mmiri ahụ dị mfe[b] site n’ịtụba ọka wit[c] ahụ n’ime oké osimiri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “mgbe nri juru ha afọ” ma ọ bụ “mgbe ha rijuru afọ.”
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụ ya, “ha nọ na-eme ka ụgbọ mmiri ahụ dị mfe” ma ọ bụ naanị, “ha mere ka ụgbọ mmiri ahụ dị mfe.” Oge ngwaa Grik ahụ nwere ike imesi usoro omume ahụ ma ọ bụ mmalite ya ike.
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ “ọka.” Okwu Grik ahụ nwere ike ịpụta ụdị ọka n’ozuzu, ma n’ebe a o yikarịrị ka ọ bụ wit kpọmkwem.
    reason: lexical_alternative
lexical_decisions:
- source_word: κορεσθέντες … τροφῆς
  choice: mgbe ha richara nri ruo afọ ojuju
  rationale: Nke a na-egosipụta ịbụ ndị nri juru ma nyekwa participle aorist ahụ ike nke oge n’Igbo dị mfe nghọta.
- source_word: δὲ
  choice: mgbe
  rationale: N’ebe a δέ bụ njikọ dị nro na-aga n’ihu n’akụkọ; nhazi ahịrịokwu Igbo na-eme ka a ghara ịtụgharị ya iche n’enweghị imebi ihe ọ pụtara.
- source_word: ἐκούφιζον
  choice: ha malitere ime ka … dị mfe
  rationale: Imperfect ahụ nwere ike igosi mmalite ma ọ bụ usoro omume ahụ; ‘malitere ime’ na-enye nkọwa mmalite n’ụzọ eke.
- source_word: τὸ πλοῖον
  choice: ụgbọ mmiri ahụ
  rationale: Nke a bụ okwu Igbo nkịtị ma doo anya maka ship n’ọnọdụ njem n’oké osimiri.
- source_word: ἐκβαλλόμενοι
  choice: site n’ịtụba
  rationale: Participle a na-akọwa ụzọ ha si mee ka ụgbọ ahụ dị mfe; ‘site n’ịtụba’ na-egosipụta ụzọ ahụ nke ọma.
- source_word: τὸν σῖτον
  choice: ọka wit ahụ
  rationale: σῖτος nwere ike ịpụta ọka n’ozuzu, ma n’ọnọdụ a ọ ga-abụkarị wit; ‘ọka wit’ bụ okwu doro anya nye ndị na-agụ Igbo.
- source_word: εἰς τὴν θάλασσαν
  choice: n’ime osimiri
  rationale: N’Igbo Standard, ‘osimiri’ nwere ike ịpụta oké osimiri n’ọnọdụ njem ụgbọ mmiri a; nkebiokwu ahụ na-egosi ntụziaka nke ịtụba ibu ahụ.
