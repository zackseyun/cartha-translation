translation_notes:
  register: Standard Igbo dị ugbu a, kwụ ọtọ ma nwee ugwu. E debere ihe mgbagwoju anya dị na imperfect na σῖτος n’ihe odide ala peeji; e zere asụsụ ụka pụrụ iche.
