revisions:
- from: Mgbe ha tụnyere eriri e ji atụ omimi mmiri[a], ha chọpụtara na omimi ya dị ama iri abụọ. Mgbe ha gara n'ihu ntakịrị, tụnyekwa ya ọzọ, ha chọpụtara na omimi ya dị ama iri na ise.
  to: Ha tụrụ omimi mmiri[a], wee chọpụta na ọ dị ama iri abụọ. Mgbe ha gagasịrị n’ihu ntakịrị, ha tụrụ omimi mmiri ọzọ, wee chọpụta na ọ dị ama iri na ise.
  rationale: A dochiri ngwaa nwere ike ịpụta “itule” anya na «tụrụ omimi mmiri», nke bụ ụzọ Igbo doro anya na nke eke isi kwuo maka βολίσαντες n’ọnọdụ a. E megharịrịkwa akụkụ nke abụọ ka omume e mere ugboro abụọ na ihe a tụrụ ghara ịgbagwoju anya. Ọnụọgụ, usoro oge, na nkeji «ama» ka dị ka ọ dị n’asụsụ Grik.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T10:24:19Z'
review_pass:
  verdict: revise
  source_fidelity: Ihe e dere ugbu a na-ezipụta usoro ịtụ omimi mmiri ugboro abụọ na ọnụọgụ iri abụọ na iri na ise nke ọma. Ma «tụnyere eriri» adịghị akọwa omume βολίσαντες nke ọma; ọ pụtara karịa itule eriri abụọ ọnụ karịa ịtụ omimi mmiri. «Ha tụrụ omimi mmiri» na-ewepụta ihe okwu Grik ahụ pụtara n’ọnọdụ ụgbọ mmiri a n’enweghị nkọwa gabigara ókè.
  naturalness: 'Nsụgharị a gbanwere dị mkpụmkpụ, na-agụ nke ọma n’Igbo ọkọlọtọ, ma na-edobe usoro akụkọ ahụ: ịtụ omimi, ịga n’ihu ntakịrị, na ịtụ ya ọzọ.'
  terminology: E debere «ama» dịka ntụgharị nke ὀργυιά, tinyere nkọwa ala peeji banyere ihe ọ̀tụ̀tụ̀ ahụ. «Tụrụ omimi mmiri» bụ okwu doro anya maka ịtụ omimi n’ụzọ ụgbọ mmiri; nkọwa ala peeji na-echekwa ihe atụgharị okwu ahụ kpọmkwem, ya bụ ịtụnye ihe arọ e jikọtara n’eriri.
  issues:
  - severity: medium
    issue: «tụnyere eriri e ji atụ omimi mmiri»
    rationale: Ngwaa «tụnyere» na-adịkarị ka itule ma ọ bụ iji ihe abụọ mee ntụnyere, ọ bụghị ịtụnye ụdọ/ịtụ omimi mmiri. Nke a nwere ike ime ka omume ụgbọ mmiri e kwuru n’asụsụ Grik ghara ịdị kpọmkwem.
  - severity: low
    issue: «tụnyekwa ya ọzọ»
    rationale: «ya» enweghị aha doro anya ọ na-ezo aka na ya n’ahịrịokwu ahụ, ebe ọ bụ na e kpebisighị ike na ha tụrụ eriri ahụ n’ọrụ mbụ. Ikwughachi «ha tụrụ omimi mmiri ọzọ» na-eme ka isiokwu ahụ doo anya.
