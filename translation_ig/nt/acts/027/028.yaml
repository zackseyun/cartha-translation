  text: καὶ βολίσαντες εὗρον ὀργυιὰς εἴκοσι, βραχὺ δὲ διαστήσαντες καὶ πάλιν βολίσαντες εὗρον ὀργυιὰς δεκαπέντε·
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/028.yaml
  text: And after taking soundings[a], they found twenty fathoms; then after going a little farther and taking soundings again, they found fifteen fathoms.
translation:
  language: ig
  text: Ha tụrụ omimi mmiri[a], wee chọpụta na ọ dị ama iri abụọ. Mgbe ha gagasịrị n’ihu ntakịrị, ha tụrụ omimi mmiri ọzọ, wee chọpụta na ọ dị ama iri na ise.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’ụzọ nkịtị karị, “mgbe ha tụnyere ihe arọ e ji atụ omimi mmiri.” Ha na-atụnye eriri e kekọtara ihe arọ n’ime mmiri iji mata omimi ya. Otu ama dị ihe dị ka mita 1.8.
    reason: lexical_alternative
lexical_decisions:
- source_word: βολίσαντες
  choice: tụnyere eriri e ji atụ omimi mmiri
  rationale: Okwu Grik a na-ekwu maka ịtụ eriri nwere ihe arọ iji mata omimi mmiri. Nsụgharị a na-akọwa omume ahụ n'ụzọ doro anya nye onye Igbo nke oge a.
- source_word: εὗρον
  choice: ha chọpụtara
  rationale: N'ọnọdụ a, okwu ahụ na-akọ ihe ha matara site n'ịtụ omimi mmiri.
- source_word: ὀργυιὰς
  choice: ama
  rationale: ὀργυιά bụ nkeji ogologo oge ochie, ihe dị ka ogologo ogwe aka abụọ e setịrị, ma n'ebe a e ji ya atụ omimi mmiri. Ide 'ama' na-edebe nkeji ahụ n'usoro Bible Igbo, ebe nkọwa ala peeji na-eme ka uru ya doo anya.
- source_word: εἴκοσι
  choice: iri abụọ
  rationale: Ọ bụ nsụgharị kpọmkwem nke ọnụọgụ ahụ.
- source_word: βραχὺ
  choice: ntakịrị
  rationale: Ọ na-egosi obere anya ha gara tupu ha atụgharịa omimi mmiri ọzọ.
- source_word: διαστήσαντες
  choice: mgbe ha gara n'ihu
  rationale: N'ọnọdụ njem a, ọ pụtara na ha gara n'ihu obere anya.
- source_word: πάλιν
  choice: ọzọ
  rationale: Ọ na-egosi na ha megharịrị omume ịtụ omimi mmiri.
- source_word: δεκαπέντε
  choice: iri na ise
  rationale: Ọ bụ nsụgharị kpọmkwem nke ọnụọgụ ahụ.
- source_word: καὶ ... δὲ ... καὶ
  choice: Mgbe ... Mgbe ... -kwa ọzọ
  rationale: Njikọ ndị a na-akọ usoro ihe mere karịa igosi nnukwu mmegide; usoro Igbo a na-eme ka akụkọ ahụ na-aga nke ọma.
