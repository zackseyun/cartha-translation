  to: Ma ha dabara n’ebe oke mmiri abụọ na-ezukọ[a], ha kwọnyere ụgbọ mmiri ahụ n’ala mmiri. Ihu ụgbọ ahụ rapaara n’ala ma nọgide na-enweghị mmegharị; ma azụ ụgbọ ahụ na-agbajikwa n’ihi ike ahụ.
