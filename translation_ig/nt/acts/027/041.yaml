source:
  edition: SBLGNT
  text: περιπεσόντες δὲ εἰς τόπον διθάλασσον ⸀ἐπέκειλαν τὴν ναῦν, καὶ ἡ μὲν πρῷρα ἐρείσασα ἔμεινεν ἀσάλευτος, ἡ δὲ πρύμνα ἐλύετο ὑπὸ τῆς ⸀βίας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/041.yaml
  text: But falling into a place where two seas met[a], they ran the ship aground; and the bow, having stuck fast, remained immovable, but the stern was being broken up by the force.
translation:
  language: ig
  text: Ma ha dabara n’ebe oke mmiri abụọ na-ezukọ[a], ha kwọnyere ụgbọ mmiri ahụ n’ala mmiri. Ihu ụgbọ ahụ rapaara n’ala ma nọgide na-enweghị mmegharị; ma azụ ụgbọ ahụ na-agbajikwa n’ihi ike ahụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ebe dị n’etiti oke mmiri abụọ.” Okwu Grik a adịghị ahụkarị; ọ pụrụ izo aka n’ọwa mmiri, n’akụkụ aja mmiri, ma ọ bụ n’ebe mmiri abụọ ma ọ bụ iyi mmiri abụọ na-ezukọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: περιπεσόντες
  choice: ha dabara
  rationale: Okwu a na-egosi na ụgbọ ahụ zutere ọnọdụ ahụ na mberede, n’ụzọ na-adịghị mma; “ha dabara” na-eburu echiche ahụ n’Igbo eke.
- source_word: τόπον διθάλασσον
  choice: ebe oke mmiri abụọ na-ezukọ
  rationale: διθάλασσος bụ okwu a na-adịghị ahụkarị, nke metụtara oke mmiri abụọ ma ọ bụ mmiri na-asọ ụzọ abụọ. Nsụgharị a na-edobe ihe oyiyi okwu Grik ahụ n’enweghị ịkpọ ebe ahụ aja mmiri ma ọ bụ ọwa mmiri kpọmkwem.
- source_word: ἐπέκειλαν τὴν ναῦν
  choice: ha kwọnyere ụgbọ mmiri ahụ n’ala mmiri
  rationale: ἐπικέλλω bụ okwu njem mmiri nke pụtara ime ka ụgbọ daba ma rapara n’ala dị n’okpuru mmiri. Nhọrọ a doro onye Igbo nke oge a anya.
- source_word: πρῷρα
  choice: ihu ụgbọ ahụ
  rationale: Nke a bụ akụkụ dị n’ihu ụgbọ mmiri; okwu nkịtị a ga-aghọta karịa okwu ọrụ ụgbọ mmiri pụrụ iche.
- source_word: ἐρείσασα
  choice: rapaara n’ala
  rationale: ἐρείδω na-egosi na ihe jidere ma guzosie ike; n’ọnọdụ a, ihu ụgbọ ahụ rapaara n’ala mmiri.
- source_word: ἔμεινεν ἀσάλευτος
  choice: ghara imegharị
  rationale: Nkebi a na-egosi na ihu ụgbọ ahụ nọgidere ebe o rapaara, na-enweghị ike ịkwaga.
- source_word: πρύμνα
  choice: azụ ya
  rationale: Nke a bụ akụkụ azụ ụgbọ mmiri; nnọchiaha ahụ na-eme ka Igbo ahụ ghara ịdị arọ ma ntụaka ya ka doo anya.
- source_word: ἐλύετο
  choice: nọ na-etisasị
  rationale: Ụdị imperfect passive na-egosi mbibi nke nọ na-aga n’ihu, ya mere “nọ na-etisasị” na-egosipụta usoro ahụ nke ọma.
- source_word: ὑπὸ τῆς βίας
  choice: n’ihi ike mmiri ahụ
  rationale: βία pụtara ike ma ọ bụ ime ihe ike. Ebe ọnọdụ a bụ n’ime oke mmiri, “ike mmiri ahụ” na-eme ka ihe e bu n’obi doo anya n’Igbo, n’enweghị ịkọwapụta ya kpọmkwem dị ka ebili mmiri.
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. E họọrọ “ihu ụgbọ” na “azụ ụgbọ” kama okwu ọrụ ụgbọ mmiri ndị pụrụ ịdị mgbagwoju anya; e debekwara nghọtahie nwere ike ịdị na διθάλασσος n’ihe odide ala peeji.
