  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τό τε πέλαγος τὸ κατὰ τὴν Κιλικίαν καὶ Παμφυλίαν διαπλεύσαντες κατήλθομεν εἰς Μύρα τῆς Λυκίας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/005.yaml
  text: After sailing across the open sea along Cilicia and Pamphylia[b][a], we came down to Myra in Lycia.
translation:
  language: ig
  text: Mgbe anyị ji ụgbọ mmiri gafesịrị oké osimiri ahụ n'akụkụ Kilisịa na Pamfilia[a], anyị rutere Mira, nke dị na Lisia.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “n'akụkụ mmiri Kilisịa na Pamfilia,” ya bụ, n'akụkụ ụsọ mpaghara ndị ahụ.
    reason: lexical_alternative
  - marker: b
    text: N'ụzọ nkịtị, “anyị gbadatara Mira, nke dị na Lisia.” N'akụkọ njem, ngwaa Grik ahụ nwekwara ike ịpụta iru ebe.
    reason: lexical_alternative
lexical_decisions:
- source_word: πέλαγος
  choice: oké osimiri
  rationale: Okwu a na-ezo aka n'oké osimiri sara mbara, ọ bụghị naanị mmiri osimiri n'ozuzu; “oké osimiri” bụ ụzọ Igbo dị mfe ma kwekọọ na nkọwa njem mmiri ahụ.
- source_word: τὸ κατὰ τὴν Κιλικίαν καὶ Παμφυλίαν
  choice: nke dị n'akụkụ Kiliki na Pamfilia
  rationale: κατά na accusative ebe a na-egosi ụzọ ụgbọ mmiri gafere n'akụkụ ụsọ mpaghara ndị ahụ; ntụgharị a na-edobe nkọwa ala ahụ n'Igbo eke.
- source_word: διαπλεύσαντες
  choice: Mgbe anyị gafesịrị
  rationale: Aorist participle ahụ na-egosi na ha buru ụzọ gafee mmiri ahụ tupu ihe isi ngwaa kwuru emee; “Mgbe anyị gafesịrị” na-eme ka usoro oge ahụ doo anya.
- source_word: κατήλθομεν
  choice: anyị ruturu
  rationale: Ọ bụ ezie na ngwaa Grik ahụ pụtara n'ụzọ nkịtị ‘anyị gbadatara,’ n'akụkọ njem mmiri ọ na-arụkarị ọrụ nke ịkọwa iru ebe; “anyị ruturu” bụ Igbo eke, ebe ndetu ala na-echekwa okwu nkịtị ahụ.
- source_word: Μύρα τῆς Λυκίας
  choice: Mira nke dị na Lisia
  rationale: Genitive ahụ na-akọwa mpaghara Mira dị na ya; ụdị a doro onye Igbo nke oge a anya.
- source_word: τε
  choice: njikọ dị n'ime usoro ahịrịokwu
  rationale: τε na-ejikọta nke a n'ụzọ dị nro na akụkọ bu ya ụzọ; usoro Igbo anaghị achọ ka e jiri otu okwu pụrụ iche sụgharịa ya ebe a.
