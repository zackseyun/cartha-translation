review_pass:
  verdict: revise
  source_fidelity: The draft conveys the major clauses, but “ọtụtụ oge” means ‘many times’ or ‘many occasions,’ not a considerable lapse of time. The genitive absolute is more accurately represented by a temporal clause, ‘Mgbe ogologo oge gafesịrị.’
  naturalness: “Oge Ibu Ọnụ” is not idiomatic as the designation for the well-known fast; “Ibu Ọnụ ahụ” is clearer and more natural in this context. The revised sentence also avoids the awkward causal opening ‘Ebe ọ bụ na ...’ followed by a second causal clause.
  terminology: “Njem ụgbọ mmiri,” “ize ndụ,” and “na-adụ ha ọdụ” are appropriate Standard Igbo renderings. The footnote’s “Ụbọchị Mkpuchi Mmehie” is overly literal and less natural than “Ụbọchị Mgbaghara Mmehie”; the note should retain its tentative identification.
  issues:
  - severity: medium
    issue: “ọtụtụ oge” inaccurately renders Ἱκανοῦ ... χρόνου.
    rationale: The Greek refers to much/considerable time having elapsed, whereas the Igbo phrase normally suggests many separate times or occasions.
  - severity: low
    issue: “Oge Ibu Ọnụ” is an unnatural main-text form for ‘the Fast.’
    rationale: “Ibu Ọnụ ahụ” naturally expresses the known, specific fast while preserving the Greek’s concise designation.
  - severity: low
    issue: The footnote uses an overly literal name for the Day of Atonement.
    rationale: “Ụbọchị Mgbaghara Mmehie” is more comprehensible Standard Igbo, while the note continues to mark the identification as likely rather than certain.
  revised_text: Mgbe ogologo oge gafesịrị, ma njem ụgbọ mmiri ahụ adịlarị ize ndụ n’ihi na ọbụna Ibu Ọnụ ahụ agafeelarị, Pọl nọ na-adụ ha ọdụ[b],[a]
  revised_footnotes:
