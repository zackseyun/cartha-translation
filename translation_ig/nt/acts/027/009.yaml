  text: Ἱκανοῦ δὲ χρόνου διαγενομένου καὶ ὄντος ἤδη ἐπισφαλοῦς τοῦ πλοὸς διὰ τὸ καὶ τὴν νηστείαν ἤδη παρεληλυθέναι, παρῄνει ὁ Παῦλος
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/009.yaml
  text: Since considerable time had passed and the voyage was already dangerous[a], because even the Fast had already gone by, Paul was advising them[b],
translation:
  language: ig
  text: Mgbe ogologo oge gafesịrị, ma njem ụgbọ mmiri ahụ adịlarị ize ndụ n’ihi na ọbụna Ibu Ọnụ ahụ agafeelarị, Pọl nọ na-adụ ha ọdụ[b],[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ibu ọnụ nke Ụbọchị Mgbaghara Mmehie.” Grik kwuru, “Ibu Ọnụ ahụ,” ma o yikarịrị ka ọ na-ekwu maka ibu ọnụ ndị Juu na-eme kwa afọ, bụ́ nke na-egosi oge njem n’osimiri na-amalite ịdị ize ndụ.
    reason: cultural_note
  - marker: b
    text: Ma ọ bụ, “Pọl nọ na-agba ha ume.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἱκανοῦ ... χρόνου διαγενομένου
  choice: Ebe ọ bụ na ọtụtụ oge agafeela
  rationale: Nkebi okwu a na-egosi na oge buru ibu agafeela. Nsụgharị a bụ Igbo dị mfe ma na-edobe usoro nke genitive absolute dị ka ọnọdụ oge.
- source_word: ὄντος ἤδη ἐπισφαλοῦς τοῦ πλοὸς
  choice: njem ụgbọ mmiri ahụ adịlarị ize ndụ
  rationale: πλοῦς na-ezo aka na njem n’osimiri, ebe ἐπισφαλής na-egosi ọnọdụ nwere ihe ize ndụ. ‘Adịlarị’ na-egosipụta ἤδη na ọnọdụ ahụ n’oge ahụ.
- source_word: διὰ τὸ ... παρεληλυθέναι
  choice: n’ihi na ... agafeelarị
  rationale: διά tinyere infinitive nwere article na-enye ihe kpatara ihe ize ndụ ahụ; perfect infinitive na-egosi na oge ahụ agafechaala.
- source_word: καὶ τὴν νηστείαν
  choice: ọbụna Oge Ibu Ọnụ
  rationale: Nkọwa a na-edobe ‘the Fast’ dị ka aha oge ndị Juu maara nke ọma, na-akọwaghị kpọmkwem n’ahịrị bụ isi na ọ bụ Ụbọchị Mkpuchi Mmehie.
- source_word: παρῄνει
  choice: nọ na-adụ ha ọdụ
  rationale: Imperfect a na-egosi omume Pọl na-eme n’oge ahụ ma na-edobe echiche nke inye ndụmọdụ n’etinyeghị ike nke ‘ịdọ aka ná ntị’ nke okwu Grik ahụ apụtaghị n’ụzọ doro anya.
