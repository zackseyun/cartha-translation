revisions:
- from: Ebe ọ bụ na ọtụtụ oge agafeela, njem ụgbọ mmiri ahụ adịlarị ize ndụ, n’ihi na ọbụna Oge Ibu Ọnụ[a] agafeelarị, Pọl nọ na-adụ ha ọdụ[b],
  to: Mgbe ogologo oge gafesịrị, ma njem ụgbọ mmiri ahụ adịlarị ize ndụ n’ihi na ọbụna Ibu Ọnụ ahụ agafeelarị, Pọl nọ na-adụ ha ọdụ[b],[a]
