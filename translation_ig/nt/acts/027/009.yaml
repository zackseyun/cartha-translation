translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. ‘Njem ụgbọ mmiri’ mere ka ụdị njem ahụ doo anya; ‘Oge Ibu Ọnụ’ bụ aha e ji nnukwu mkpụrụedemede dee iji gosi emume a maara nke ọma. Akara nkọwa ụkwụ [a] na [b] dị n’ahịrị bụ isi.
