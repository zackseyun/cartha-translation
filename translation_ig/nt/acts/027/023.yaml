    rationale: παρέστη pụtara na mmụọ ozi ahụ guzoro n’akụkụ Pọl/ nọ ya nso. «Bịara» bụ nkọwa mgbakwunye, ọ bụ ezie na ọ dabara n’akụkọ ahụ; «guzoro n’akụkụ m» na-adị nso n’okwu isi.
