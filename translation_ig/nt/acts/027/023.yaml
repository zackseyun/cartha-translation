  to: N’ihi na n’abalị a kpọmkwem, mmụọ ozi nke Chineke, onye m bụ nke ya[a], onye m na-efekwa ofufe[b], guzoro n’akụkụ m.
  rationale: E degharịrị naanị ebe njikọ okwu Igbo na izi ezi n’ebe isi Grik dị chọrọ mmezi. Nsụgharị ahụ ugbu a na-egosi n’ụzọ doro anya na Chineke bụ onye Pọl bụ nke ya na onye ọ na-efe ofufe, ma na-echekwa «kwa» maka καί. A wepụrụ echiche mgbakwunye nke «bịara» ka e wee soro παρέστη anya karịa.
