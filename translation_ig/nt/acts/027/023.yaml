  text: παρέστη γάρ μοι ταύτῃ τῇ ⸀νυκτὶ τοῦ θεοῦ, οὗ ⸀εἰμι, ᾧ καὶ λατρεύω, ⸀ἄγγελος
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/023.yaml
  text: For this very night an angel of the God to whom I belong and whom I also worship stood by me[b][a],
translation:
  language: ig
  text: N’ihi na n’abalị a kpọmkwem, mmụọ ozi nke Chineke, onye m bụ nke ya[a], onye m na-efekwa ofufe[b], guzoro n’akụkụ m.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’ụzọ nkịtị, “onye m bụ nke ya.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “onye m na-ejekwara ozi”; ngwaa Grik a nwere ike ịpụta ije ozi nsọ ma ọ bụ ofufe a na-efe Chineke.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρέστη
  choice: bịara guzoro n’akụkụ m
  rationale: Nke a na-echekwa echiche nke mmụọ ozi ahụ ịbịa nọrọ nso Pọl, ma na-ada nke ọma n’Igbo karịa ịsị nanị na ọ pụtara n’ihu ya.
- source_word: γάρ
  choice: N’ihi na
  rationale: Ọ na-egosi na amaokwu a bụ ihe mere Pọl ji nwee obi ike n’okwu gbara ya gburugburu.
- source_word: ταύτῃ τῇ νυκτί
  choice: n’abalị a kpọmkwem
  rationale: ‘Kpọmkwem’ na-egosipụta ike nke okwu nrụtụ aka ahụ, ya bụ abalị a n’onwe ya.
- source_word: τοῦ θεοῦ
  choice: nke Chineke ahụ
  rationale: Ọ na-ejikọta mmụọ ozi ahụ na Chineke, onye nkebi okwu ndị na-esochi na-akọwa.
- source_word: οὗ εἰμι
  choice: m bụ nke ya
  rationale: Nke a dị nso n’ụdị okwu Grik, ‘onye m bụ nke ya,’ ma na-egosipụta na Pọl bụ nke Chineke n’Igbo doro anya.
- source_word: ᾧ καὶ λατρεύω
  choice: onye m na-efekwa
  rationale: ‘Ifè’ n’ebe Chineke nọ nwere ike ịgụnye ofufe na ọrụ nsọ; ‘na-efekwa’ na-echekwa καί (‘kwa’).
- source_word: ἄγγελος
  choice: mmụọ ozi
  rationale: N’ọnọdụ akụkọ a, ọ bụ onye ozi eluigwe, ọ bụghị mmadụ nkịtị zitere ozi.
theological_decisions:
- issue: Nsụgharị οὗ εἰμι
  choice: m bụ nke ya
  alternative: onye m nweere onwe m nye / onye m bụ nke ya n'ụzọ nkịtị
  rationale: Nhọrọ ahụ na-echekwa okwu banyere ịbụ nke Chineke na nrubeisi nye ya, n’etinyeghị nkọwa ozizi karịrị ihe Grik kwuru.
- issue: Nsụgharị λατρεύω
  choice: na-efekwa
  alternative: na-ejekwara ozi
  rationale: ‘Ifè’ na-egosipụta ofufe ma nwee ike iburu echiche nke ije ozi dị nsọ; ihe odide ala peeji na-echekwa ‘ije ozi’ dịka ụzọ ọzọ ziri ezi.
translation_notes:
  register: Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ ‘bịara guzoro n’akụkụ m’ iji chekwaa ọnọdụ oghere nke παρέστη, ebe ‘m bụ nke ya’ na ‘na-efekwa’ na-echekwa nghọta na esemokwu okwu Grik.
