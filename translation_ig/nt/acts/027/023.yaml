    rationale: «Ahụ» enweghị ihe kwekọrọ kpọmkwem n’isi Grik ebe a, a na-etinyekwa nkebiokwu mmekọrịta ahụ n’ụzọ na-adịghị eke. Iwepụ «ahụ» na itinye mkpụrụedemede nkwụsị na-eme ka Chineke bụrụ onye «onye m bụ nke ya» na-ekwu maka ya n’enweghị mgbagwoju anya.
  - severity: low
