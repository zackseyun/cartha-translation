review_pass:
  verdict: revise
  source_fidelity: 'A na-echekwa isi ihe Grik nke ọma: γάρ, «abalị a kpọmkwem», mmụọ ozi Chineke, ịbụ nke Chineke, ife ya, na mmụọ ozi iguzo nso Pọl. Ma «bịara guzoro» na-etinye echiche «ịbịa» nke παρέστη anaghị ekwupụta kpọmkwem; «guzoro n’akụkụ m» zuru ezu ma na-echekwa echiche ọnọdụ ya.'
  naturalness: «Chineke ahụ m bụ nke ya» anaghị ada nke ọma n’Igbo Izugbe ma nwere ike ime ka njikọ nkebiokwu ahụ ghara ido anya. «Chineke, onye m bụ nke ya, onye m na-efekwa ofufe» na-ekwu okwu ahụ n’ụzọ doro anya na nke sitere n’usoro Igbo.
  terminology: «Mmụọ ozi» bụ okwu ziri ezi maka ἄγγελος n’ọnọdụ a. «Ịfe ... ofufe» na-egosipụta λατρεύω dị ka ofufe/ọrụ nsọ; ihe odide ala peeji na-echekwa «ije ozi» dịka ụzọ ọzọ kwere omume.
