  text: καὶ τοὺς λοιποὺς οὓς μὲν ἐπὶ σανίσιν οὓς δὲ ἐπί τινων τῶν ἀπὸ τοῦ πλοίου· καὶ οὕτως ἐγένετο πάντας διασωθῆναι ἐπὶ τὴν γῆν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/044.yaml
  text: and the rest[a], some on planks and some on pieces from the ship. And so it happened that all were brought safely to land.
translation:
  language: ig
  text: Ndị fọdụrụ, ụfọdụ n’elu mbadamba osisi, ndị ọzọkwa n’elu ihe ụfọdụ sitere n’ụgbọ mmiri. Ọ bụkwa otú a ka ha niile si rute n’ala n’enweghị nsogbu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “a zọpụtara ha niile ruo n’ala,” ma ọ bụ, “ha niile gbapụrụ n’enweghị nsogbu ruo n’ikpere mmiri.” Ngwaa Grik e ji mee ihe n’ebe a na-ekwu maka ịlanarị ihe ize ndụ nke ụgbọ mmiri kụrisịrị.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοὺς λοιποὺς
  choice: ndị ọzọ fọdụrụ
  rationale: Nkebiokwu a na-ezo aka ná ndị fọdụrụ mgbe e kwuchara banyere ìgwè mbụ n’amaokwu bu ụzọ.
- source_word: οὓς μὲν ... οὓς δὲ
  choice: ụfọdụ ... ndị ọzọkwa
  rationale: Nke a na-ekewa ndị fọdụrụ ụzọ abụọ n’ụzọ doro anya ma bụrụkwa Igbo a na-asụ nke ọma.
- source_word: ἐπὶ σανίσιν
  choice: n’elu mbadamba osisi
  rationale: σανίς pụtara mbadamba osisi ma ọ bụ plank; okwu a dabara n’ọnọdụ ụgbọ mmiri kụrisịrị.
- source_word: ἐπί τινων τῶν ἀπὸ τοῦ πλοίου
  choice: n’elu ihe ụfọdụ sitere n’ụgbọ mmiri
  rationale: Asụsụ Grik akọwaghị kpọmkwem ihe ndị ahụ bụ; nsụgharị a na-echekwa enweghị nkọwa ahụ kama ịkpọ ha iberibe ụgbọ mmiri n’ụzọ siri ike karịa isi mmalite.
- source_word: καὶ οὕτως ἐγένετο
  choice: Ọ bụkwa otú a ka ... si
  rationale: Nke a na-ejikọta ụzọ ahụ ha si pụọ n’oké osimiri na ihe mechara mee, n’ụdị okwu Igbo dị ndụ.
- source_word: πάντας διασωθῆναι
  choice: ha niile ... rute ... n’enweghị nsogbu
  rationale: N’ebe a διασῴζω na-ekwu maka ịgbanahụ ihe ize ndụ nke ụgbọ mmiri kụrisịrị, ọ bụghị nzọpụta ime mmụọ; okwu a na-egosi na onye ọ bụla lanarịrị n’udo.
- source_word: ἐπὶ τὴν γῆν
  choice: n’ala
  rationale: N’ọnọdụ njem mmiri a, γῆ bụ ala dị iche n’oké osimiri; ‘n’ala’ bụ okwu Igbo dị mfe ma doo anya.
theological_decisions:
- issue: Mmetụta okwu nzọpụta nwere ike ịdị na διασωθῆναι
  choice: rute n’ala n’enweghị nsogbu
  alternative: a zọpụtara ha niile ruo n’ala / ha niile gbapụrụ n’udo ruo n’ikpere mmiri
  rationale: Ihe gbara amaokwu ahụ gburugburu na-egosi nzọpụta anụ ahụ site n’ihe ize ndụ nke ụgbọ mmiri kụrisịrị. Nhọrọ a adịghị etinye echiche banyere nzọpụta ime mmụọ, ma ọ ka na-egosi nlanarị ha niile.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ ‘ihe ụfọdụ sitere n’ụgbọ mmiri’ iji ghara ịkọwapụta ihe ndị ahụ karịa ka asụsụ Grik si kọwaa ha.
