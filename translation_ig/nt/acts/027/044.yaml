  to: Ndị fọdụrụ, ụfọdụ n’elu mbadamba osisi, ndị ọzọkwa n’elu ihe ụfọdụ sitere n’ụgbọ mmiri. Ọ bụkwa otú a ka ha niile si rute n’ala n’enweghị nsogbu.[a]
  rationale: The revision removes a minor redundancy in the rendering of “the rest” and improves the lexical-alternative footnote so that it clearly denotes physical escape from danger. It preserves the source’s unspecified objects from the ship, its division into two groups, and its affirmation that all reached land safely.
