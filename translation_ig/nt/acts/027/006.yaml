    issue: The final boarding expression is somewhat literal/awkward.
    rationale: “Wee mee ka anyị banye n'ime ya” preserves causation but is less natural than an explicit vessel-oriented causative expression. “Wee kpọbatara anyị n’ụgbọ mmiri ahụ” preserves ἐνεβίβασεν while reading more smoothly.
  revised_text: N'ebe ahụ, ọchịagha na-elekọta otu narị ndị agha hụrụ ụgbọ mmiri Aleksandria nke na-aga Ịtali, wee kpọbatara anyị n’ụgbọ mmiri ahụ.
