  text: κἀκεῖ εὑρὼν ὁ ⸀ἑκατοντάρχης πλοῖον Ἀλεξανδρῖνον πλέον εἰς τὴν Ἰταλίαν ἐνεβίβασεν ἡμᾶς εἰς αὐτό.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/006.yaml
  text: There the centurion found an Alexandrian ship sailing for Italy[a], and he put us on board it.
translation:
  language: ig
  text: N'ebe ahụ, ọchịagha na-elekọta otu narị ndị agha hụrụ ụgbọ mmiri Aleksandria nke na-aga Ịtali, wee kpọbatara anyị n’ụgbọ mmiri ahụ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κἀκεῖ
  choice: N'ebe ahụ
  rationale: Ọ na-egosi ebe ihe a mere; njikọ dị na κἀκεῖ na-aga n'ihu n'ụzọ e si kọọ akụkọ ahụ n'Igbo, ọ dịghịkwa mkpa ịgbakwunye “na” n'ihu ya.
- source_word: εὑρὼν
  choice: hụrụ
  rationale: Ọ bụ participle aorist nke mere tupu isi ngwaa; ịsụgharị ya dịka ngwaa zuru ezu na-eme ka usoro ihe omume doo anya ma bụrụ Igbo eke.
- source_word: ἑκατοντάρχης
  choice: ọchịagha na-elekọta otu narị ndị agha
  rationale: Nkọwa a na-egosi ọkwa onyeisi agha Rom ahụ n'ụzọ onye Igbo nke oge a ga-aghọta, n'enweghị ịdabere n'okwu mbinye pụrụ ịdị onye nkịtị na-amaghị.
- source_word: πλοῖον Ἀλεξανδρῖνον
  choice: ụgbọ mmiri Aleksandria
  rationale: Ọ na-edobe aha obodo/geographical designation ahụ ma hapụkwa ohere na adjective ahụ pụrụ ịpụta ụgbọ mmiri si Aleksandria ma ọ bụ nke e debara aha ya n'ebe ahụ.
- source_word: πλέον εἰς τὴν Ἰταλίαν
  choice: nke na-aga Ịtali
  rationale: Ọ na-egosi njem ụgbọ mmiri na ebe ọ na-aga n'Igbo doro anya ma dị mfe, n'agbanyeghị na ihe a na-ekwu kpọmkwem bụ ịkwọ ụgbọ mmiri.
- source_word: ἐνεβίβασεν ἡμᾶς εἰς αὐτό
  choice: wee mee ka anyị banye n'ime ya
  rationale: 'Nke a na-echekwa causative sense nke ngwaa ahụ: onyeisi agha ahụ mere ka ha rịgoro/banye n''ụgbọ mmiri ahụ.'
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke ugbu a, dị ùgwù ma dị mfe nghọta. E jiri nkọwa ọrụ agha dochie okwu teknịkal “senturịọn,” ma zere ịkọwa karịa ihe Grik kwuru banyere njikọ ụgbọ mmiri ahụ na Aleksandria.
