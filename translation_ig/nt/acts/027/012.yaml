id: ACT.27.12
reference: Acts 27:12
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀνευθέτου δὲ τοῦ λιμένος ὑπάρχοντος πρὸς παραχειμασίαν οἱ πλείονες ἔθεντο βουλὴν ἀναχθῆναι ⸀ἐκεῖθεν, εἴ πως δύναιντο καταντήσαντες εἰς Φοίνικα παραχειμάσαι, λιμένα τῆς Κρήτης βλέποντα κατὰ λίβα καὶ κατὰ χῶρον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/012.yaml
  text: And because the harbor was unsuitable for wintering[a], the majority decided to put out from there[c][b], if somehow they might reach Phoenix and spend the winter there—a harbor of Crete facing southwest and northwest.
translation:
  language: ig
  text: Ebe ọ bụ na ọdụ ụgbọ mmiri ahụ na-adịghị adaba maka ịgafe oge oyi, ihe ka ọtụtụ n’ime ha kpebiri isi n’ebe ahụ banye n’oké osimiri[a], ma eleghị anya ha ga-enwe ike iru Foiniks[b] ma nọrọ oge oyi n’ebe ahụ—ọdụ ụgbọ mmiri dị na Krit nke chere ihu na ndịda ọdịda anyanwụ na ugwu ọdịda anyanwụ.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “isi n’ebe ahụ kwọpụ ụgbọ mmiri.” Ngwaa Grik a bụ okwu ndị ọrụ ụgbọ mmiri ji ekwu maka ịpụ n’ọdụ ụgbọ mmiri banye n’oké osimiri.
    reason: lexical_alternative
  - marker: b
    text: Foiniks bụ ọdụ ụgbọ mmiri dị n’agwaetiti Krit.
    reason: cultural_note
  - marker: c
    text: Nkebiokwu Grik ikpeazụ a siri ike ịkọwa. A na-asụgharịkarị ya, “nke chere ihu na ndịda ọdịda anyanwụ na ugwu ọdịda anyanwụ”; ụfọdụ na-aghọta ntụziaka nke abụọ ahụ kpọmkwem dị ka “ọdịda anyanwụ–ugwu ọdịda anyanwụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνευθέτου
  choice: ekwesịghị ekwesị
  rationale: Na-akọwa ọdụ ụgbọ mmiri ahụ dị ka ebe na-adabaghị nke ọma maka ịnọ n’oge oyi; okwu a bụ Igbo doro anya ma dịkwa mma n’ọnọdụ njem mmiri.
- source_word: λιμένος
  choice: ọdụ ụgbọ mmiri
  rationale: Nke a bụ okwu Igbo a na-ejikarị akọwa harbor ma ọ bụ ebe ụgbọ mmiri na-akwụsị ma na-echebe onwe ha.
- source_word: πρὸς παραχειμασίαν
  choice: ịnọ n’oge oyi
  rationale: Na-egosi ebumnuche nke ịnọ ebe ahụ ruo mgbe oge oyi gafere, n’asụsụ Igbo dị mfe ma kwekọọ n’isi mmalite.
- source_word: οἱ πλείονες
  choice: ihe ka ọtụtụ n’ime ha
  rationale: Na-echekwa echiche nke ọnụ ọgụgụ ka ukwuu n’etinyeghị onye ọ bụla na-adịghị n’ederede.
- source_word: ἔθεντο βουλήν
  choice: kpebiri
  rationale: Na-enye echiche nke mkpebi otu ìgwè mere n’ụzọ Igbo dị nkenke ma bụrụ nke e ji eme ihe ugbu a.
- source_word: ἀναχθῆναι ἐκεῖθεν
  choice: isi n’ebe ahụ banye n’oké osimiri
  rationale: Na-egosipụta okwu ụgbọ mmiri nke pụtara ịhapụ ọdụ ụgbọ mmiri wee gawa n’oké osimiri.
- source_word: εἴ πως δύναιντο
  choice: ka ha hụ ma hà ga-
  rationale: Na-echekwa olileanya na ejighị n’aka dị n’okwu Grik ahụ n’ụzọ Igbo sitere n’okike.
- source_word: καταντήσαντες εἰς Φοίνικα
  choice: erute Foiniks
  rationale: Na-enye echiche nke iru ebe a na-aga ma na-ede aha ebe ahụ n’ụdị dabara n’ụda Igbo.
- source_word: παραχειμάσαι
  choice: nọrọ oge oyi n’ebe ahụ
  rationale: Na-ekwughachi ebumnuche ịnọ n’ebe ahụ n’oge oyi, dị ka isi mmalite si mee.
- source_word: βλέποντα κατὰ λίβα καὶ κατὰ χῶρον
  choice: chere ihu na ndịda ọdịda anyanwụ na ugwu ọdịda anyanwụ
  rationale: Na-agbaso nghọta ọdịnala nke ntụziaka abụọ ahụ, ma na-etinye ihe isi ike nke nkebiokwu ahụ n’akwụkwọ ala peeji.
