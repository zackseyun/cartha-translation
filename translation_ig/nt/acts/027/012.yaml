translation_notes:
  register: Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E ji okwu njem mmiri ndị nkịtị ga-aghọta, chekwaa ejighị n’aka dị na εἴ πως, ma kọwaa ntụziaka ala ahụ na akwụkwọ ala peeji n’ihi mgbagwoju anya ya.
