revisions:
- from: Ebe ọ bụ na ọdụ ụgbọ mmiri ahụ ekwesịghị ekwesị ịnọ n’oge oyi, ihe ka ọtụtụ n’ime ha kpebiri isi n’ebe ahụ banye n’oké osimiri[a], ka ha hụ ma hà ga-erute Foiniks[b] ma nọrọ oge oyi n’ebe ahụ. Ọ bụ ọdụ ụgbọ mmiri dị na Krit, nke chere ihu na ndịda ọdịda anyanwụ na ugwu ọdịda anyanwụ.[c]
  to: Ebe ọ bụ na ọdụ ụgbọ mmiri ahụ na-adịghị adaba maka ịgafe oge oyi, ihe ka ọtụtụ n’ime ha kpebiri isi n’ebe ahụ banye n’oké osimiri[a], ma eleghị anya ha ga-enwe ike iru Foiniks[b] ma nọrọ oge oyi n’ebe ahụ—ọdụ ụgbọ mmiri dị na Krit nke chere ihu na ndịda ọdịda anyanwụ na ugwu ọdịda anyanwụ.[c]
  rationale: The revision removes an added deliberative nuance, improves idiomatic Standard Igbo for the harbor’s suitability for wintering, links the final harbor description directly to Phoenix, and corrects the directional alternative in the footnote. It retains the source’s uncertainty and does not attempt to settle the disputed geographical phrase.
