  text: Then all of them became encouraged and also took food[a][b].
translation:
  language: ig
  text: Mgbe ahụ, obi siri ha niile ike, ha onwe ha wee rikwa nri[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “obi tọrọ ha ụtọ” ma ọ bụ “ha nwere mmụọ ọma.”
    reason: lexical_alternative
  - marker: b
    text: N'ụzọ nkịtị, “ha onwe ha weere nri,” nke na-emesi ike na ndị ọzọ gbasoro ihe Pọl mere.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὔθυμοι
  choice: obi siri ha ike
  rationale: N'ọnọdụ a, okwu ahụ na-egosi na ụjọ belatara, ha enwetakwa ume na nkwuwa okwu; akpaokwu Igbo a bụ nke doro anya ma bụrụkwa ihe ndị mmadụ na-ekwu n'ụzọ nkwanye ùgwù.
- source_word: δὲ
  choice: Mgbe ahụ
  rationale: N'ebe a, δέ na-akwalite akụkọ gaa n'ihe mere ọzọ, kama igosi nnukwu mmegide.
- source_word: γενόμενοι
  choice: siri ... ike
  rationale: E jikọtara participle a na εὔθυμοι iji gosipụta na ha banyere n'ọnọdụ ọhụrụ nke inwe obi ike.
- source_word: πάντες
  choice: ha niile
  rationale: Nke a na-eme ka o doo anya na ndị niile nọ n'ụgbọ ahụ so na ya.
- source_word: καὶ αὐτοὶ
  choice: ha onwe ha wee rikwa
  rationale: “Ha onwe ha” na-echekwa nkwusi ike nke αὐτοὶ, ebe “-kwa” na-egosi na ha gbasoro ihe Pọl mere.
- source_word: προσελάβοντο
  choice: ri
  rationale: Mgbe ihe a na-ekwu bụ nri, ngwaa a pụtara iri ma ọ bụ iwere nri; “ri” bụ ụzọ Igbo kacha eke nghọta n'ọnọdụ a.
- source_word: τροφῆς
  choice: nri
  rationale: Nke a bụ okwu Igbo nkịtị ma zie ezi maka ihe a na-eri iji nye ahụ ike.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị mfe nghọta ma dịkwa ùgwù. E debere nkwusi ike dị na καὶ αὐτοὶ n'okwu bụ “ha onwe ha ... -kwa,” ebe isiokwu ntụgharị ọnọdụ dị na εὔθυμοι γενόμενοι pụtara “obi siri ha ike.”
