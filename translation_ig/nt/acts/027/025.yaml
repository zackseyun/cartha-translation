  text: διὸ εὐθυμεῖτε, ἄνδρες· πιστεύω γὰρ τῷ θεῷ ὅτι οὕτως ἔσται καθ’ ὃν τρόπον λελάληταί μοι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/025.yaml
  text: Therefore[a], take courage, men, for I believe God that it will be just as it has been told to me.
translation:
  language: ig
  text: Ya mere, ndị ikom, nwee obi ike; n’ihi na ekwere m Chineke[a] na ọ ga-adị kpọmkwem dịka e gwaworo m.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “atụkwasịrị m Chineke obi.” Usoro okwu Grik a pụrụ imesi ike n’ịtụkwasị Chineke obi ma ọ bụ n’ikwere ihe Chineke kwuru.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ
  choice: Ya mere
  rationale: Na-egosi nkwubi okwu sitere ná nkwa na agbamume e kwuru n’amaokwu ndị bu ụzọ.
- source_word: εὐθυμεῖτε
  choice: nwee obi ike
  rationale: Ọ bụ iwu ka ndị nọ n’ihe ize ndụ ghara ịda mbà kama ka ha nwee ntụkwasị obi; okwu a bụ Igbo doro anya ma bụrụ nke a na-eji ugbu a.
- source_word: ἄνδρες
  choice: dimkpa
  rationale: Na-edobe kpọmkwem na Pọl na-agwa ndị ikom nọ n’ụgbọ mmiri okwu, kama ime ka adreesị ahụ ghara igosi okike.
- source_word: πιστεύω τῷ θεῷ
  choice: ekwere m Chineke
  rationale: Dative na πιστεύω na-egosi ikwere ma ọ bụ ịtụkwasị onye ahụ obi, ya bụ, iwere Chineke n’okwu ya; Igbo a na-edobe ike ahụ.
- source_word: ὅτι
  choice: na
  rationale: Na-ebute ọdịnaya nke ihe Pọl kweere, ọ bụghị ihe kpatara o ji kwere.
- source_word: οὕτως ἔσται καθ’ ὃν τρόπον
  choice: ihe ahụ ga-adị kpọmkwem otú
  rationale: Na-egosi na ihe ga-eme ga-adaba n’ụzọ zuru ezu n’ihe e kwuru.
- source_word: λελάληταί μοι
  choice: a gwara m
  rationale: Na-edobe olu nnara nke perfect passive na ozi e nyerela Pọl nke ka dị irè ugbu a.
theological_decisions:
- issue: Nsụgharị πιστεύω τῷ θεῷ
  choice: ekwere m Chineke
  alternative: atụkwasịrị m Chineke obi
  rationale: Nhọrọ bụ isi na-edobe ma akụkụ nke ịtụkwasị Chineke obi ma akụkụ nke ikwere okwu ya, n’enweghị ịgbasa ya ka ọ bụrụ nkwupụta ozizi sara mbara.
translation_notes:
  register: Igbo Ọha zuru oke, nke dị ugbu a ma nwee ugwu. E ji “dimkpa” kpọọ ndị ikom ahụ ozugbo; e zere okwu ochie ma ọ bụ nkọwa agbakwunyere nke na-adịghị na Grik.
