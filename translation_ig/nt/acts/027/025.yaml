- from: Ya mere, dimkpa, nwee obi ike, n’ihi na ekwere m Chineke[a] na ihe ahụ ga-adị kpọmkwem otú a gwara m.
  to: Ya mere, ndị ikom, nwee obi ike; n’ihi na ekwere m Chineke[a] na ọ ga-adị kpọmkwem dịka e gwaworo m.
  rationale: The revision uses a more natural vocative, avoids adding an unnecessary explicit subject, and represents the prior, continuing relevance of the divine message more clearly through “e gwaworo m.” It retains the source’s ambiguity and the footnote’s lexical alternative.
