revisions:
- from: Ruo ọtụtụ ụbọchị, anyị ji nwayọọ na-akwọ ụgbọ mmiri,[a] ọ bụkwa n’oké ihe isi ike ka anyị rutere n’ebe chere Knịdọs ihu. Ebe ifufe ekweghị ka anyị gaa n’ihu, anyị gafere n’akụkụ Krit nke ifufe na-adịghị eti ike,[b] n’akụkụ Salmone.
  to: Ọtụtụ ụbọchị ka anyị ji nwayọọ na-akwọ ụgbọ mmiri,[a] ma o siiri anyị ike iru n’ebe chere Knidos ihu. Ebe ifufe ekweghị ka anyị gaa n’ihu, anyị ji ụgbọ mmiri gafee n’akụkụ Krit nke agwaetiti ahụ chebere anyị pụọ n’ifufe,[b] n’akụkụ Salmone.
  rationale: The revision corrects the duration expression, distinguishes shelter from weak wind, and improves the natural flow of the arrival-at-Cnidus clause. It preserves the Greek sequence and the route’s geographic ambiguity while keeping the explanatory maritime sense in a footnote.
