source:
  edition: SBLGNT
  text: ἐν ἱκαναῖς δὲ ἡμέραις βραδυπλοοῦντες καὶ μόλις γενόμενοι κατὰ τὴν Κνίδον, μὴ προσεῶντος ἡμᾶς τοῦ ἀνέμου, ὑπεπλεύσαμεν τὴν Κρήτην κατὰ Σαλμώνην,
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/007.yaml
  text: For many days we were sailing slowly[a], and with difficulty we came opposite Cnidus. Since the wind did not allow us to go farther, we sailed under the lee of Crete[b], off Salmone.
translation:
  language: ig
  text: Ọtụtụ ụbọchị ka anyị ji nwayọọ na-akwọ ụgbọ mmiri,[a] ma o siiri anyị ike iru n’ebe chere Knidos ihu. Ebe ifufe ekweghị ka anyị gaa n’ihu, anyị ji ụgbọ mmiri gafee n’akụkụ Krit nke agwaetiti ahụ chebere anyị pụọ n’ifufe,[b] n’akụkụ Salmone.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “anyị na-eji nwayọọ aga n’ihu n’ụgbọ mmiri.”
    reason: lexical_alternative
  - marker: b
    text: N’ụzọ nkịtị, “anyị ji ụgbọ mmiri gafee n’okpuru Krit”—ya bụ, n’akụkụ agwaetiti ahụ nke chebere ha pụọ n’ifufe.
    reason: cultural_note
lexical_decisions:
- source_word: ἐν ἱκαναῖς δὲ ἡμέραις
  choice: Ruo ọtụtụ ụbọchị
  rationale: Nkebiokwu a na-egosi ogologo oge njem ahụ ji na-aga; ‘Ruo ọtụtụ ụbọchị’ bụ Igbo doro anya ma na-egosi igbu oge ahụ.
- source_word: βραδυπλοοῦντες
  choice: anyị ji nwayọọ na-akwọ ụgbọ mmiri
  rationale: Nke a na-edobe ihe oyiyi nke njem ụgbọ mmiri ma kewapụ ya na μόλις, nke na-egosi ihe isi ike.
- source_word: μόλις γενόμενοι κατὰ τὴν Κνίδον
  choice: ọ bụkwa n’oké ihe isi ike ka anyị rutere n’ebe chere Knịdọs ihu
  rationale: μόλις na-egosi na o siri ike, ebe κατά n’ọnọdụ njem mmiri a na-egosi ebe dị n’ihu ma ọ bụ n’akụkụ obodo ahụ.
- source_word: μὴ προσεῶντος ἡμᾶς τοῦ ἀνέμου
  choice: Ebe ifufe ekweghị ka anyị gaa n’ihu
  rationale: Genitive absolute a na-enye ihe kpatara mgbanwe ụzọ ha; ntụgharị a na-eme ka ihe ahụ pụta ìhè n’Igbo na-enweghị iwepụ nghọta nke igbochi ịga n’ihu.
- source_word: ὑπεπλεύσαμεν τὴν Κρήτην
  choice: anyị gafere n’akụkụ Krit nke ifufe na-adịghị eti ike
  rationale: ὑποπλέω bụ okwu njem mmiri nke pụtara ịgafe n’akụkụ agwaetiti nke ọ na-echebe pụọ n’ifufe; a kọwara ya n’ụzọ onye Igbo nkịtị ga-aghọta.
- source_word: κατὰ Σαλμώνην
  choice: n’akụkụ Salmone
  rationale: κατά na akara ala dị n’ụsọ mmiri na-egosi ọnọdụ ụgbọ mmiri n’akụkụ ma ọ bụ n’ihu ebe ahụ.
- source_word: Κνίδον / Κρήτην / Σαλμώνην
  choice: Knịdọs / Krit / Salmone
  rationale: A haziri aha ebe ndị Grik ka ha kwekọọ n’ụda na usoro mkpụrụokwu Igbo, ma ghara ịgbanwe ebe ha na-ezo aka.
theological_decisions: []
translation_notes:
  register: E ji Igbo Izugbe dị ugbu a, dị ùgwù ma dị mfe nghọta. A kọwara okwu ndị pụrụ iche gbasara njem mmiri n’ahịrịokwu na nkọwa ala peeji kama iji okwu ọrụ ụgbọ mmiri ndị na-adịghị ama ama.
