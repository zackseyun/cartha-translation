id: ACT.27.35
reference: Acts 27:35
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸀εἴπας δὲ ταῦτα καὶ λαβὼν ἄρτον εὐχαρίστησεν τῷ θεῷ ἐνώπιον πάντων καὶ κλάσας ἤρξατο ἐσθίειν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/035.yaml
  text: And after saying these things and taking bread[a], he gave thanks to God in the presence of all, and after breaking it, he began to eat.
translation:
  language: ig
  text: Mgbe o kwuchara ihe ndị a, o weere achịcha, kelee Chineke n’ihu mmadụ niile,[a] mgbe ọ nyawachara ya, ọ malitere iri ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ịsụgharị ya: “n’ihu onye ọ bụla.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴπας δὲ ταῦτα
  choice: Mgbe o kwuchara ihe ndị a
  rationale: Aorist participle εἴπας presents speech completed before the following actions. “Mgbe o kwuchara” expresses that sequence naturally in Standard Igbo, while “ihe ndị a” retains the plural reference of ταῦτα to Paul’s preceding statements. The mild connective δέ is conveyed by the continuing narrative flow rather than a contrastive expression.
- source_word: λαβὼν ἄρτον
  choice: o weere achịcha
  rationale: This keeps ἄρτον indefinite without specifying either one whole loaf or merely a portion. The finite Igbo clause is natural and preserves the action’s sequence.
- source_word: εὐχαρίστησεν τῷ θεῷ
  choice: kelee Chineke
  rationale: “Kelee Chineke” naturally means “thanked God” and preserves God as the explicit recipient of the thanksgiving.
- source_word: ἐνώπιον πάντων
  choice: n’ihu mmadụ niile
  rationale: 'This idiomatic Igbo expression preserves the public nature of the action: it occurred in the presence or sight of all those there.'
- source_word: κλάσας
  choice: mgbe ọ nyawachara ya
  rationale: The completion form “nyawachara” represents the aorist participle as action prior to beginning to eat. “Ya” explicitly refers back to the bread, as Igbo clarity requires.
- source_word: ἤρξατο ἐσθίειν
  choice: ọ malitere iri ya
  rationale: This directly preserves the ingressive sense, “he began to eat.” The pronoun “ya” identifies the bread as what he ate without adding a sacramental interpretation.
theological_decisions:
- issue: Possible Eucharistic resonance in the sequence of taking bread, giving thanks, breaking, and eating
  choice: The actions are rendered as an ordinary meal narrative without explicit sacramental terminology.
  alternative: Use wording shaped by traditional Lord’s Supper formulas, potentially suggesting that this was a Eucharistic observance.
  rationale: The sequence may recall other bread-breaking scenes, but the verse itself describes Paul eating publicly aboard the ship and does not explicitly identify the meal as the Lord’s Supper. The translation therefore preserves the possible resonance without turning it into a doctrinal assertion.
translation_notes:
  register: Standard Igbo; natural, current, and dignified narrative prose. Participial clauses are expressed through ordinary Igbo sequencing, while the wording remains close to the source and avoids denominationally marked sacramental language.
