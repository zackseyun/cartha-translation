  text: Ὑποπνεύσαντος δὲ νότου δόξαντες τῆς προθέσεως κεκρατηκέναι ἄραντες ἆσσον παρελέγοντο τὴν Κρήτην.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/013.yaml
  text: And when a south wind began to blow gently[a], thinking that they had obtained their purpose, they weighed anchor and sailed along Crete[c][b], close inshore.
translation:
  language: ig
  text: Mgbe ifufe ndịda malitere ife nwayọọ, ha chere na ha enwetala ihe ha zubere; ya mere, ha weliri arịlịka[a] ma jiri ụgbọ mmiri soro ụsọ Krit gaa, na-adị nso karị n’ụsọ ya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N'ụzọ nkịtị, “ha weliri [ihe ahụ].” N'okwu njem mmiri, ihe e bu n'uche bụ iweli arịlịka.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsị, “ha ji ụgbọ mmiri soro ụsọ Krit gaa, nọdebe ụsọ ahụ nso karị.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὑποπνεύσαντος ... νότου
  choice: Mgbe ifufe ndịda malitere iji nwayọọ fee
  rationale: Nke a na-egosi ma ifufe si n'ebe ndịda bịa ma ịdị nwayọọ nke nfụ ya; ‘malitere’ dabara n'ọnọdụ akụkọ ahụ.
- source_word: δόξαντες
  choice: ha chere
  rationale: Ọ na-egosi echiche ma ọ bụ nkwenye ha n'onwe ha, ọ bụghị ihe pụtara ìhè n'ezie.
- source_word: τῆς προθέσεως κεκρατηκέναι
  choice: na ha enwetala ihe ha zubere
  rationale: Akpaokwu a pụtara na ha chere na ọnọdụ ahụ enyela ha ohere imezu atụmatụ ma ọ bụ ebumnuche njem ha.
- source_word: ἄραντες
  choice: ha weliri arịlịka
  rationale: Ọ bụ ezie na ngwaa ahụ pụtara ‘iweli,’ n'ọnọdụ njem mmiri ihe e bu n'uche bụ iweli arịlịka tupu ụgbọ apụ.
- source_word: παρελέγοντο τὴν Κρήτην
  choice: jiri ụgbọ mmiri gafee n'akụkụ ụsọ Krit
  rationale: Ngwaa ụgbọ mmiri a na-egosi ịga n'akụkụ ụsọ ala; ịkpọ ụsọ aha n'Igbo na-eme ka ihe ọ pụtara doo anya.
- source_word: ἆσσον
  choice: na-aga ya nso
  rationale: Ọ bụ adverb comparative nke pụtara ‘nso karị’; n'ọnọdụ a ọ na-akọwa na ha nọdebere ụsọ Krit.
theological_decisions: []
translation_notes:
  register: E ji Igbo Izugbe nke dị ugbu a, dị ùgwù ma dị mfe nghọta. ‘Arịlịka’ bụ okwu njem mmiri a na-aghọta nke ọma; nhazi ahịrịokwu ahụ na-edebe usoro echiche nke Grik ma na-ada ka Igbo nkịtị.
