  to: Mgbe ifufe ndịda malitere ife nwayọọ, ha chere na ha enwetala ihe ha zubere; ya mere, ha weliri arịlịka[a] ma jiri ụgbọ mmiri soro ụsọ Krit gaa, na-adị nso karị n’ụsọ ya[b].
