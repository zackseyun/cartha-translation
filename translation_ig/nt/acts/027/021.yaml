id: ACT.27.21
reference: Acts 27:21
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Πολλῆς ⸀τε ἀσιτίας ὑπαρχούσης τότε σταθεὶς ὁ Παῦλος ἐν μέσῳ αὐτῶν εἶπεν· Ἔδει μέν, ὦ ἄνδρες, πειθαρχήσαντάς μοι μὴ ἀνάγεσθαι ἀπὸ τῆς Κρήτης κερδῆσαί τε τὴν ὕβριν ταύτην καὶ τὴν ζημίαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/021.yaml
  text: Since they had gone a long time without food, then Paul stood up among them and said, “Men, you should have listened to me and not set sail from Crete, and so have avoided this damage and loss.”
translation:
  language: ig
  text: Mgbe ha nọworo ogologo oge n’erighị nri[a], Pọl biliri n’etiti ha wee sị, “Ndị ikom, unu kwesịrị ige m ntị[b], ghara isi na Krit banye n’oké osimiri; otu a, unu gaara ezere mmebi na mfu a[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “Mgbe ha nọworo ogologo oge na-ebu ọnụ.” Okwu Grik ἀσιτία nwere ike ịpụta enweghị nri ma ọ bụ ịghara iri nri; n’ọnọdụ oke ifufe a, ọ kacha yie na ọ bụ ịnọ ogologo oge n’erighị nri.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “irubere m isi.” Ngwaa Grik ahụ nwere ike ịpụta irube isi n’iwu ma ọ bụ ige ntị n’ihe mmadụ kwuru; n’ebe a ọ na-ekwu maka ige ntị na ndụmọdụ Pọl.
    reason: lexical_alternative
  - marker: c
    text: O yikarịrị ka okwu abụọ ahụ, “mmebi na mfu,” na-egosi mmebi ma ọ bụ mmerụ na mfu nke si na ya pụta.
    reason: cultural_note
lexical_decisions:
- source_word: Πολλῆς τε ἀσιτίας ὑπαρχούσης
  choice: Mgbe ha nọworo ogologo oge n’erighị nri
  rationale: Nkebi a na-akọ ọnọdụ dị tupu Pọl ekwuo okwu. ἀσιτία nwere ike ịpụta enweghị nri ma ọ bụ ịghara iri nri; n’ọnọdụ oke ifufe a, ọ kacha yie ịnọ ogologo oge n’erighị nri.
- source_word: σταθεὶς
  choice: biliri
  rationale: N’ebe a, participle ahụ na-egosi na Pọl biliri ma guzo iji gwa ìgwè ahụ okwu; “biliri” bụ ụzọ Igbo dị mfe ma dị ndụ isi kwuo ya.
- source_word: ἐν μέσῳ αὐτῶν
  choice: n’etiti ha
  rationale: Nke a na-echekwa echiche na Pọl nọ n’etiti ìgwè ahụ mgbe ọ na-agwa ha okwu.
- source_word: Ἔδει μέν
  choice: unu kwesịrị
  rationale: Imperfect δεῖ na-egosi ihe ha kwesịrị ime na mbụ ma ha emeghị; n’usoro okwu dum, “unu kwesịrị ... ghara” na-ebute echiche ahụ nke ọma.
- source_word: ὦ ἄνδρες
  choice: Ụmụ nwoke
  rationale: ἄνδρες bụ okwu a kpọrọ ndị ikom nọ n’ụgbọ ahụ kpọmkwem; “Ụmụ nwoke” na-echekwa ntụaka nwoke ahụ n’Igbo nkịtị.
- source_word: πειθαρχήσαντάς μοι
  choice: ige m ntị
  rationale: πειθαρχέω nwere ike ịpụta irubere mmadụ isi ma ọ bụ ịṅa ntị na ndụmọdụ ya. N’ebe a Pọl na-ezo aka na ndụmọdụ njem ya, ya mere “ige m ntị” dabara nke ọma n’enweghị ime ka ikike iwu pụta karịa ihe odide ahụ kwuru.
- source_word: μὴ ἀνάγεσθαι ἀπὸ τῆς Κρήτης
  choice: ghara isi na Krit banye n’oké osimiri
  rationale: ἀνάγω bụ okwu njem mmiri nke pụtara ịpụ n’ọdụ ụgbọ mmiri banye n’oké osimiri. Nsụgharị a na-eme ka ihe ahụ doo onye Igbo anya.
- source_word: κερδῆσαί τε
  choice: otu a, unu gaara ezere
  rationale: κερδαίνω bụkarị ‘irite uru,’ ma n’ọnọdụ a ọ na-egosi uru nke ịghara ịdakwasị mmebi na mfu; “gaara ezere” na-enye echiche ahụ n’Igbo eke.
- source_word: τὴν ὕβριν ταύτην
  choice: mmebi ... a
  rationale: Ọ bụ ezie na ὕβρις nwere ike ịpụta mkparị, ihe ike, ma ọ bụ mmerụ, n’ọnọdụ njem mmiri a ọ na-ezo aka n’ihe ọjọọ ma ọ bụ mmebi ha tara.
- source_word: τὴν ζημίαν
  choice: mfu
  rationale: ζημία na-egosi ihe furu efu ma ọ bụ ọghọm. “Mfu” na-eme ka ọ dị iche ntakịrị na “mmebi,” dị ka njikọta okwu Grik ahụ si mee.
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta, sụgharịa amaokwu ahụ. A họọrọ usoro okwu nke na-ada ka okwu mmadụ gwara ìgwè n’ọnọdụ ihe mberede, ma e debere ọdịiche dị n’etiti mmebi na mfu nakwa nhọrọ pụtara na ἀσιτία na πειθαρχέω n’ala peeji.
