revisions:
- from: Mgbe ha nọworo ogologo oge n’erighị nri[a], Pọl biliri n’etiti ha kwuo, sị, “Ụmụ nwoke, unu kwesịrị ige m ntị[b], ghara isi na Krit banye n’oké osimiri; otu a, unu gaara ezere mmebi na mfu a[c].”
  to: Mgbe ha nọworo ogologo oge n’erighị nri[a], Pọl biliri n’etiti ha wee sị, “Ndị ikom, unu kwesịrị ige m ntị[b], ghara isi na Krit banye n’oké osimiri; otu a, unu gaara ezere mmebi na mfu a[c].”
  rationale: The revision corrects the adult male address, improves the narrative syntax, and refines the footnotes for idiomatic Standard Igbo and cautious lexical explanation. It preserves the draft’s temporal opening and its rendering of the counterfactual consequence without imposing a doctrinal interpretation.
