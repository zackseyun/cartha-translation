  to: Mgbe abalị nke iri na anọ ruru, ka a na-ebugharị anyị n’Adria[a], n’ihe dị ka etiti abalị, ndị ọrụ ụgbọ mmiri malitere iche na ala ụfọdụ na-abịaru ha nso[b].
