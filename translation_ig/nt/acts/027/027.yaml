  text: Ὡς δὲ τεσσαρεσκαιδεκάτη νὺξ ἐγένετο διαφερομένων ἡμῶν ἐν τῷ Ἀδρίᾳ, κατὰ μέσον τῆς νυκτὸς ὑπενόουν οἱ ναῦται προσάγειν τινὰ αὐτοῖς χώραν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/027.yaml
  text: When the fourteenth night had come[a], as we were being driven along in the Adriatic Sea[b], about midnight the sailors began to suspect that some land was drawing near to them.
translation:
  language: ig
  text: Mgbe abalị nke iri na anọ ruru, ka a na-ebugharị anyị n’Adria[a], n’ihe dị ka etiti abalị, ndị ọrụ ụgbọ mmiri malitere iche na ala ụfọdụ na-abịaru ha nso[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Adria» bụ aha ochie e ji akọwa mpaghara mmiri sara mbara n’akụkụ etiti Mediterenian; ọ bụghị naanị Oké Osimiri Adriatic nke oge a.
    reason: cultural_note
  - marker: b
    text: N’ụzọ nkịtị, “ndị ọrụ ụgbọ mmiri nọ na-eche na ala ụfọdụ na-abịaru ha nso.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τεσσαρεσκαιδεκάτη νὺξ ἐγένετο
  choice: abalị nke iri na anọ bịara
  rationale: Nke a na-egosi na abalị nke iri na anọ n’usoro ụbọchị oké ifufe ahụ eruola, n’ụzọ Igbo doro anya ma dịkwa mfe.
- source_word: διαφερομένων ἡμῶν
  choice: ka ifufe na-ebugharị anyị
  rationale: Ụdị okwu passive na-egosi mmegharị na-abụghị nke ndị nọ n’ụgbọ mmiri na-achịkwa. Ịkpọ ifufe aha na-eme ka ọnọdụ oké ifufe ahụ doo anya n’Igbo, n’agbanyeghị na ọ dịghị n’okwu ahụ kpọmkwem.
- source_word: ἐν τῷ Ἀδρίᾳ
  choice: n’Oké Osimiri Adria
  rationale: Aha Adria ka e debere iji zere ime ka ókèala ya bụrụ naanị Oké Osimiri Adriatic nke oge a.
- source_word: κατὰ μέσον τῆς νυκτός
  choice: ihe dị ka etiti abalị
  rationale: Nke a na-echekwa nghọta nke oge dị nso n’etiti abalị, ọ bụghị oge a tụrụ kpọmkwem.
- source_word: ὑπενόουν οἱ ναῦται
  choice: ndị ọrụ ụgbọ mmiri malitere iche
  rationale: ‘Malitere iche’ na-egosipụta ma ọdịdị imperfect nke ngwaa ahụ ma nkwubi okwu na-edochaghị ha anya.
- source_word: προσάγειν τινὰ αὐτοῖς χώραν
  choice: otu ala na-abịaru ha nso
  rationale: Nke a na-echekwa usoro echiche Grik nke na-ekwu dị ka a ga-asị na ala ahụ na-abịaru ha nso, ma ‘otu ala’ na-egosi na ha amaghị ala ahụ.
