  register: Asụsụ Igbo ọkọlọtọ, nke oge a, dị ùgwù ma dị mfe nghọta. E debere aha ochie ‘Adria’ ka a ghara ijikọta ya n’ụzọ na-ezighị ezi naanị na Oké Osimiri Adriatic nke oge a.
