  text: τῇ τε ἑτέρᾳ κατήχθημεν εἰς Σιδῶνα, φιλανθρώπως τε ὁ Ἰούλιος τῷ Παύλῳ χρησάμενος ἐπέτρεψεν πρὸς τοὺς φίλους ⸀πορευθέντι ἐπιμελείας τυχεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/003.yaml
  text: And on the next day we put in at Sidon[a], and Julius, treating Paul kindly[b], permitted him to go to his friends and receive care.
translation:
  language: ig
  text: N’echi ya, anyị kwụsịrị n’ọdụ ụgbọ mmiri Saịdọn. Julịọs ji obiọma mesoo Pọl[a], kwe ka ọ gakwuru ndị enyi ya ka o nweta nlekọta[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “mesoro Pọl n’ụzọ kwesị mmadụ,” nke na-emesi omume obiọma Julịọs n’ebe Pọl, onye mkpọrọ, nọ ike.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụ ya, “ka ọ nata nlekọta” ma ọ bụ “ka o nweta enyemaka.” Okwu Grik ahụ nwere ike ịpụta enyemaka dị iche iche Pọl nwere ike inweta n’aka ndị enyi ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ τε ἑτέρᾳ
  choice: N’echi ya
  rationale: Nke a bụ ụzọ Igbo si ekwu oge n’ụzọ ebumpụta ụwa, ọ na-egosikwa na ọ bụ ụbọchị sochirinụ n’usoro akụkọ ahụ.
- source_word: κατήχθημεν εἰς Σιδῶνα
  choice: anyị banyere n’ọdụ ụgbọ mmiri Saịdọn
  rationale: N’akụkọ njem ụgbọ mmiri, κατάγω na-ezo aka n’ịbanye ma ọ bụ ịkwụsị n’ọdụ ụgbọ mmiri; nsụgharị a na-eme ka nghọta ụgbọ mmiri ahụ doo anya.
- source_word: φιλανθρώπως ... χρησάμενος
  choice: mesoro Pọl omume ọma
  rationale: Nkebiokwu a na-egosi na Julịọs ji obiọma na omume kwesị mmadụ mesoo Pọl; okwu Igbo a bụ nke doro anya ma dịkwa ugwu.
- source_word: ἐπέτρεψεν
  choice: kwekwara ka
  rationale: Ọ na-egosi na Julịọs nyere Pọl ikike ime ihe ahụ.
- source_word: πρὸς τοὺς φίλους πορευθέντι
  choice: ka ọ gaa hụ ndị enyi ya
  rationale: Ọ bụ ụzọ Igbo dị mfe ma zuru oke isi gosipụta na e nyere Pọl ikike ịgakwuru ndị enyi ya.
- source_word: ἐπιμελείας τυχεῖν
  choice: ka ha lekọta ya
  rationale: Ọ na-egosipụta nnata nlekọta ma ọ bụ enyemaka dị mkpa n’ụzọ Igbo na-asụkarị, na-ahapụghị oke ụdị enyemaka ahụ kpọmkwem.
