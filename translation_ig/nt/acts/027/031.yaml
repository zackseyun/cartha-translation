source:
  edition: SBLGNT
  text: εἶπεν ὁ Παῦλος τῷ ἑκατοντάρχῃ καὶ τοῖς στρατιώταις· Ἐὰν μὴ οὗτοι μείνωσιν ἐν τῷ πλοίῳ, ὑμεῖς σωθῆναι οὐ δύνασθε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/031.yaml
  text: Paul said to the centurion and the soldiers[a], “Unless these men remain in the ship, you cannot be saved.”
translation:
  language: ig
  text: Pọl gwara ọchịagha na-ahụ maka otu narị ndị agha na ndị agha ahụ, “Ọ bụrụ na ndị a anọgideghị n’ime ụgbọ mmiri ahụ, unu agaghị enwe ike ịlanarị.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “ịzọpụta.” Okwu Grik ahụ kwuru, “ịzọpụta,” ma n’ebe a ọ na-ekwu maka ịlanarị ihe ize ndụ a.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑκατοντάρχῃ
  choice: ọchịagha narị ndị agha
  rationale: Nke a na-egosi ọkwa onyeisi ndị agha Rom nke na-elekọta ihe dị ka otu narị ndị agha, n'ụzọ onye Igbo nke oge a ga-aghọta.
- source_word: οὗτοι
  choice: ndị a
  rationale: Ọ bụ okwu ngosi na-ezo aka n’ụzọ doro anya n’ebe ndị ọrụ ụgbọ mmiri a kpọtụrụ aha n’okwu gbara ya gburugburu nọ; isiokwu ahụ na-eme ka ndị a bụ ndị mmadụ pụta ìhè.
- source_word: μείνωσιν
  choice: anọgideghị
  rationale: “Ịnọgide” na-echekwa echiche nke ịnọgide n’otu ebe kama ịhapụ ya, ma dabara n’ịdọ aka ná ntị nwere ọnọdụ.
- source_word: πλοίῳ
  choice: ụgbọ mmiri a
  rationale: “Ụgbọ mmiri” bụ okwu Igbo nkịtị maka nnukwu ụgbọ na-aga n’oké osimiri; “a” na-egosipụta ụgbọ ahụ a na-ekwu maka ya n’ọnọdụ a.
- source_word: σωθῆναι
  choice: ịzọpụta onwe unu
  rationale: N’ebe a, ngwaa ahụ na-ekwu maka ịlanarị ihe ize ndụ nke ụgbọ mmiri, ọ bụghị kpọmkwem nzọpụta ime mmụọ. Okwu a ka na-echekwa echiche sara mbara nke ‘ịzọpụta.’
- source_word: οὐ δύνασθε
  choice: unu agaghị enwe ike
  rationale: Nke a bụ ụzọ Igbo dị mma ma doo anya isi kwuo enweghị ike nke οὐ δύνασθε.
theological_decisions:
- issue: Ma σωθῆναι ò kwesịrị ịsụgharị ya n’okwu na-ekwu kpọmkwem banyere ịlanarị n’anụ ahụ, ka e jiri okwu sara mbara nke ‘ịzọpụta.’
  choice: ịzọpụta onwe unu
  alternative: ịlanarị / ịbụ ndị a napụtara
  rationale: Ọnọdụ akụkọ ahụ na-egosi na ihe a na-ekwu bụ ịlanarị ihe ize ndụ n’oké osimiri. Ma okwu a họọrọ na-edobe njikọ ya na ngwaa Grik nkịtị maka ‘ịzọpụta,’ ebe nkọwa ala peeji na-eme ka ụdị nzọpụta a doo anya.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke dị ugwu ma dị mfe nghọta. E ji “ọchịagha narị ndị agha” kọwaa ọkwa agha Rom kama ibubata aha Bekee. Akara nkọwa [a] dị n’ederede bụ isi ozugbo e kwuchara okwu ọ na-akọwa.
