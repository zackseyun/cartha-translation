id: ACT.7.45
reference: Acts 7:45
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἣν καὶ εἰσήγαγον διαδεξάμενοι οἱ πατέρες ἡμῶν μετὰ Ἰησοῦ ἐν τῇ κατασχέσει τῶν ἐθνῶν ὧν ἐξῶσεν ὁ θεὸς ἀπὸ προσώπου τῶν πατέρων ἡμῶν ἕως τῶν ἡμερῶν Δαυίδ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/045.yaml
  text: which our fathers in turn brought in with Joshua at the dispossession of the nations that God drove out from before our fathers[b][a], until the days of David.
translation:
  language: ig
  text: Ndị nna nna anyị, mgbe ha natara ya n’usoro[b], so Jọshụa[a] kpọbata ya mgbe ha were ala n’aka mba ndị Chineke chụpụrụ n’ihu ndị nna nna anyị, ruo n’oge Devid.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’asụsụ Grik, aha e dere ebe a bụ otu ụdị aha a na-eji maka “Jizọs” na “Jọshụa.” N’ebe a, ọ na-ezo aka na Jọshụa nwa Nun.
    reason: alternative_reading
  - marker: b
    text: A pụkwara ịsụgharị ya, “mgbe ha natara ya n’usoro.” Okwu Grik ahụ na-emesi ike na ha natara ya site n’aka ọgbọ ndị bu ha ụzọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἣν
  choice: Ụlọikwuu ahụ ka
  rationale: Nnọchiaha nwanyị a na-ezo aka n’ụlọikwuu nke amaokwu bu ụzọ. Ikwughachi ‘ụlọikwuu ahụ’ na-eme ka amaokwu ahụ doo anya n’Igbo ma na-echekwa njikọ ya na amaokwu gara aga.
- source_word: εἰσήγαγον
  choice: kpọbatara
  rationale: Okwu a pụtara iweta ma ọ bụ ịkpọbata ihe n’ime ebe; ‘kpọbatara’ dabara n’ụlọikwuu a na-eburu abata n’ala ahụ.
- source_word: διαδεξάμενοι
  choice: bú ndị natara ya n’aka ndị bu ha ụzọ
  rationale: Nke a na-egosipụta na ndị nna nna ahụ natara ụlọikwuu ahụ n’usoro site n’aka ọgbọ ndị bu ha ụzọ.
- source_word: οἱ πατέρες ἡμῶν
  choice: ndị nna nna anyị
  rationale: Nke a bụ okwu Igbo doro anya maka ndị nna ochie, ma na-echekwa nkwughachi okwu ahụ n’okwu Stivin.
- source_word: μετὰ Ἰησοῦ
  choice: ha na Jọshụa
  rationale: N’akụkọ banyere ịbanye n’ala Kenan mgbe Mosis nwụsịrị, aha Grik Ἰησοῦ na-ezo aka na Jọshụa nwa Nun.
- source_word: ἐν τῇ κατασχέσει τῶν ἐθνῶν
  choice: mgbe a na-eweghara ala n’aka mba ndị
  rationale: Nsụgharị a na-egosi ọnọdụ nke iweghara ala ahụ n’aka mba ndị bi na ya, na-enweghị ime ka njikọ ụtọasụsụ Grik bụrụ nke siri ike ma ọ bụ nke na-eduhie eduhie n’Igbo.
- source_word: ὧν ἐξῶσεν ὁ θεὸς
  choice: ndị Chineke chụpụrụ
  rationale: ‘Chụpụrụ’ na-enye ike nke ἐξωθέω, ya bụ ịchụpụ ma ọ bụ ịkwapụ n’ebe ahụ.
- source_word: ἀπὸ προσώπου τῶν πατέρων ἡμῶν
  choice: n’ihu ndị nna nna anyị
  rationale: Nke a na-echekwa akpaalaokwu sitere n’asụsụ Hibru nke dị na Grik, ma ọ ka bụ Igbo a na-aghọta nke ọma.
- source_word: ἕως τῶν ἡμερῶν Δαυίδ
  choice: ruo n’oge Devid
  rationale: Nke a bụ ụzọ Igbo dị mma isi gosipụta ókè oge ahụ, ma na-eduga nke ọma n’amaokwu na-esote.
theological_decisions:
- issue: Onye Ἰησοῦ na-ezo aka na ya
  choice: Jọshụa nwa Nun
  alternative: Jizọs
  rationale: Ụdị aha Grik ahụ nwere ike ịbụ Jizọs ma ọ bụ Jọshụa, ma ọnọdụ akụkọ banyere ịbanye n’ala ahụ mgbe Mosis gasịrị na-egosi Jọshụa nwa Nun. Ihe odide ala peeji na-echekwa eziokwu gbasara ọdịdị aha Grik ahụ.
- issue: Ihe διαδεξάμενοι na-emesi ike
  choice: Ndị nna nna natara ụlọikwuu ahụ n’usoro site n’aka ndị bu ha ụzọ
  alternative: Ndị nna nna webatara ya n’otu n’otu
  rationale: Okwu participle ahụ nwere echiche nke ịnata ihe n’usoro site n’aka ndị gara aga; nsụgharị ahụ na-egosipụta ma nnata ma ịdịgide n’etiti ọgbọ dị iche iche.
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, nke dị ugwu ma dị mfe nghọta. E kewara ahịrịokwu ahụ ụzọ abụọ ka ogologo usoro Grik ghara ịghọ ihe siri ike n’Igbo; ‘Ọ dịgidere’ na-eme ka ihe ἕως τῶν ἡμερῶν Δαυίδ na-ejikọta na ya doo anya, ya bụ ụlọikwuu ahụ.
