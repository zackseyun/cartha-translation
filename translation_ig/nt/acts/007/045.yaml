  source_fidelity: Ndịiche Ἰησοῦ dịka Jọshụa nwa Nun ziri ezi, ma nsụgharị a ga-edobe ἐν τῇ κατασχέσει dịka oge ndị nna nna ahụ nwetara/were ala ahụ n’aka mba ndị Chineke chụpụrụ. E tinyere “ala” n’ụzọ nkọwa a na-anabata n’ihi na ihe a na-ekwu maka ya bụ mbata Israel n’ala ahụ.
