  terminology: “Ndị nna nna anyị,” “Jọshụa,” “Chineke,” na “Devid” dabara n’usoro na ndebanye aha Baịbụl Igbo. Ihe odide ala peeji na-akọwa aha Grik Ἰησοῦ n’enweghị ịmanye nkọwa okpukpe ọ bụla.
