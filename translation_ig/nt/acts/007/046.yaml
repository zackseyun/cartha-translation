id: ACT.7.46
reference: Acts 7:46
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὃς εὗρεν χάριν ἐνώπιον τοῦ θεοῦ καὶ ᾐτήσατο εὑρεῖν σκήνωμα τῷ ⸀θεῷ Ἰακώβ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/046.yaml
  text: who found favor before God and asked to find a dwelling place for the God of Jacob[a].
translation:
  language: ig
  text: onye nwetara ihu ọma n’ihu Chineke, rịọkwara ka o chọta ebe obibi maka Chineke Jekọb[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ụlọikwuu maka Chineke Jekọb.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εὗρεν χάριν
  choice: nwetara ihu ọma
  rationale: Akpaalaokwu a pụtara inweta nnabata na ihu ọma n’aka onye ọzọ; “nwetara ihu ọma” bụ Igbo doro anya nke na-echekwa echiche mmekọrịta ahụ.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: n’ihu Chineke
  rationale: Nke a na-egosipụta ịnọ n’ihu ma ọ bụ n’anya Chineke, ma ọ bụkwa ụzọ e si ekwu ya nke ọma n’Igbo.
- source_word: ᾐτήσατο
  choice: rịọkwara
  rationale: Ngwaa a na-egosi na o mere arịrịọ; “rịọrọ” bụ okwu Igbo nkịtị ma dị ùgwù.
- source_word: εὑρεῖν
  choice: ka o chọta
  rationale: A nọgidere na isi ihe ngwaa Grik ahụ pụtara, “ịchọta,” kama ịkọwa ya n’ụzọ ga-abụ “iweta” ma ọ bụ “ịkwadebe.”
- source_word: σκήνωμα
  choice: ebe obibi
  rationale: Okwu a nwere ike ịpụta ebe obibi n’ozuzu ya; nhọrọ a anaghị ekpebi tupu oge eruo ma ọ bụ ụlọikwuu ma ọ bụ ụlọ ọzọ.
- source_word: τῷ θεῷ Ἰακώβ
  choice: maka Chineke Jekọb
  rationale: “Maka” na-egosipụta ọrụ dative ahụ nke ọma, ebe “Chineke Jekọb” na-echekwa usoro okwu ọgbụgba ndụ dị na isi mmalite.
theological_decisions:
- issue: Ụdị ebe ahụ Devid rịọrọ maka ya n’akụkọ Stivin
  choice: ebe obibi
  alternative: ụlọikwuu maka Chineke Jekọb
  rationale: σκήνωμα sara mbara karịa okwu teknụzụ a na-eji maka ụlọ nsọ. “Ebe obibi” na-echekwa esemokwu akụkọ ahụ, ebe Devid chọrọ ebe maka Chineke ma Solomọn mechara wuo ụlọ ahụ, n’ebughị ụzọ kpebie kpọmkwem ụdị ihe owuwu ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe nghọta ma dị ùgwù. A hapụrụ “ka o chọta” ka ọ soro okwu Grik n’ụzọ chiri anya, n’agbanyeghị na “ka o nweta” nwere ike ịdị mfe karịa n’okwu nkịtị.
