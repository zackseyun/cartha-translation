  source_fidelity: 'The translation accurately represents the Greek relative clause: “nwetara ihu ọma n’ihu Chineke” conveys εὗρεν χάριν ἐνώπιον τοῦ θεοῦ; “rịọkwara ka o chọta” preserves the request plus the infinitive εὑρεῖν; and “ebe obibi maka Chineke Jekọb” faithfully renders σκήνωμα τῷ θεῷ Ἰακώβ without prematurely identifying the structure as the temple.'
