id: ACT.7.55
reference: Acts 7:55
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὑπάρχων δὲ πλήρης πνεύματος ἁγίου ἀτενίσας εἰς τὸν οὐρανὸν εἶδεν δόξαν θεοῦ καὶ Ἰησοῦν ἑστῶτα ἐκ δεξιῶν τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/055.yaml
  text: But being full of the Holy Spirit[a], he gazed into heaven and saw the glory of God, and Jesus standing at the right hand of God[b],
translation:
  language: ig
  text: Ma, ebe o jupụtara na Mmụọ Nsọ, o legidere eluigwe anya nke ọma[a], wee hụ ebube Chineke na Jizọs ka o guzoro n’aka nri Chineke[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “lekwasịrị anya nke ọma n’eluigwe.”
    reason: lexical_alternative
  - marker: b
    text: Okwu ahụ bụ “n’aka nri Chineke” bụ akpaalaokwu Akwụkwọ Nsọ nke na-egosi ọnọdụ nsọpụrụ na ikike kachasị elu.
    reason: cross_reference
lexical_decisions:
- source_word: ὑπάρχων δὲ
  choice: Ma ebe ọ
  rationale: Nke a na-egosi ọnọdụ Stivin nọ na ya tupu ihe bụ isi emee, ma ‘Ma’ na-egosikwa ọdịiche dị nro n’etiti ya na ìgwè ndị iro e kwuru banyere ha n’amaokwu bu ụzọ.
- source_word: πλήρης πνεύματος ἁγίου
  choice: jupụtara na Mmụọ Nsọ
  rationale: Nke a bụ ụzọ Igbo doro anya ma bụrụ nke a na-ejikarị ekwu na mmadụ juputara n’ike na nduzi nke Mmụọ Nsọ; ọ naghị eme Mmụọ ahụ ka ọ bụrụ naanị àgwà ma ọ bụ ike na-enweghị onye.
- source_word: ἀτενίσας εἰς τὸν οὐρανὸν
  choice: ọ legidesiri anya ike n’eluigwe
  rationale: ‘Legidesiri anya ike’ na-echekwa echiche nke ilekwasị anya nke ọma, ebe ‘n’eluigwe’ dabara n’ọhụụ pụrụ iche a karịa ‘na mbara igwe.’
- source_word: εἶδεν δόξαν θεοῦ
  choice: hụ ebube Chineke
  rationale: ‘Hụ’ bụ okwu Igbo nkịtị ma doo anya maka εἶδεν, ebe ‘ebube Chineke’ na-echekwa usoro na echiche nke okwu Grik.
- source_word: Ἰησοῦν ἑστῶτα
  choice: Jizọs ka ọ na-eguzo
  rationale: Usoro a na-eme ka o doo anya na Stivin hụrụ Jizọs n’ọnọdụ iguzo, ma na-echekwa ndụ nke ọhụụ ahụ.
- source_word: ἐκ δεξιῶν τοῦ θεοῦ
  choice: n’aka nri Chineke
  rationale: Nke a bụ akpaalaokwu Akwụkwọ Nsọ a maara n’Igbo maka ọnọdụ nsọpụrụ na ikike; ọ ka mma karịa ịsụgharị ἐκ n’ụzọ nkịtị dị ka ‘site n’aka nri.’
theological_decisions:
- issue: Ma πνεύματος ἁγίου ọ na-ekwu maka Onye Mmụọ Nsọ ma ọ bụ naanị mmụọ/àgwà dị nsọ
  choice: Mmụọ Nsọ
  alternative: mmụọ dị nsọ
  rationale: Ojiji okwu a n’akwụkwọ Luk na Ọrụ Ndịozi, tinyere ọnọdụ akụkọ a, na-egosi na ọ na-ekwu maka Mmụọ Nsọ dị ka Onye, ọ bụghị naanị àgwà ọma ma ọ bụ ike na-enweghị onye.
- issue: Ọnọdụ Jizọs n’aka nri Chineke
  choice: Jizọs ka ọ na-eguzo n’aka nri Chineke
  alternative: Jizọs ka ọ na-eguzo site n’aka nri Chineke
  rationale: Nsụgharị a na-echekwa ọdịiche dị n’etiti Chineke na Jizọs, ọnọdụ Jizọs nke iguzo, na akpaalaokwu nke na-egosi nsọpụrụ na ikike, n’ebughị nkọwa ozizi ọzọ bata n’amaokwu ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta, dee ya. E debere akpaalaokwu Akwụkwọ Nsọ ‘n’aka nri Chineke,’ ma kọwaa ya n’ala ala peeji kama ịgbasa nkọwa ahụ n’ime amaokwu. E tinyere akara [a] n’ebe okwu ἀτενίσας dị n’ezie, ka nkọwa ala peeji kwekọọ kpọmkwem na okwu ọ na-akọwa.
