revisions:
- from: Mgbe ha chụpụtasịrị ya gaa n’èzí obodo ahụ, ha nọ na-eji nkume atụ ya. Ndị akaebe ahụ dọbara uwe ndị ha yi n’elu[a] n’ụkwụ otu nwa okorobịa a na-akpọ Sọl.
  to: Mgbe ha chụpụtasịrị ya gaa n’èzí obodo ahụ, ha nọ na-eji nkume atụ ya. Ndị akaebe ahụ dobeere uwe elu ha[a] n’akụkụ ụkwụ otu nwa okorobịa a na-akpọ Sọl.
  rationale: The revision retains the draft’s faithful representation of the Greek verbal sequence and imperfect aspect. It replaces the potentially misleading placement phrase with ‘n’akụkụ ụkwụ,’ which clearly represents παρὰ τοὺς πόδας, and uses the more idiomatic ‘uwe elu ha’ for the witnesses’ outer garments. The footnote remains anchored to the expression for ἱμάτια and preserves its lexical breadth.
  reviewer_model: gpt-5.6-terra
