id: ACT.7.58
reference: Acts 7:58
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἐκβαλόντες ἔξω τῆς πόλεως ἐλιθοβόλουν. καὶ οἱ μάρτυρες ἀπέθεντο τὰ ἱμάτια ⸀αὐτῶν παρὰ τοὺς πόδας νεανίου καλουμένου Σαύλου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/058.yaml
  text: And after they had driven him out of the city[a], they were stoning him. And the witnesses laid their outer garments at the feet of a young man called Saul.
translation:
  language: ig
  text: Mgbe ha chụpụtasịrị ya gaa n’èzí obodo ahụ, ha nọ na-eji nkume atụ ya. Ndị akaebe ahụ dobeere uwe elu ha[a] n’akụkụ ụkwụ otu nwa okorobịa a na-akpọ Sọl.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “uwe ha” ma ọ bụ “akwa mwụda ha”; okwu Grik ahụ na-ezo n’ozuzu aka n’uwe a na-eyi n’elu uwe ndị ọzọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκβαλόντες
  choice: Mgbe ha chụpụtasịrị ya
  rationale: Ụdị a na-egosi na ha ji ike chụpụ ya, nakwa na omume a buru ụzọ mee tupu ịtụ ya nkume amalite.
- source_word: ἔξω τῆς πόλεως
  choice: gaa n’èzí obodo ahụ
  rationale: Nke a na-egosi mmegharị site n’ime obodo ruo n’èzí ya, dịka okwu Grik si kwuo.
- source_word: ἐλιθοβόλουν
  choice: ha nọ na-eji nkume atụ ya
  rationale: Okwu Grik ahụ dị n’ụdị imperfect, ya mere ‘nọ na-eji ... atụ’ na-egosi omume na-aga n’ihu.
- source_word: οἱ μάρτυρες
  choice: Ndị akaebe ahụ
  rationale: N’ebe a, okwu ahụ pụtara ndị gbara akaebe n’okwu ikpe, ọ bụghị ndị nwụrụ n’ihi okwukwe.
- source_word: ἀπέθεντο
  choice: dọbara
  rationale: ‘Dọbara’ na-egosi na ha debere uwe ahụ n’ebe a kpọrọ aha, n’enweghị ịgbakwunye echiche na-adịghị n’amaokwu ahụ.
- source_word: τὰ ἱμάτια αὐτῶν
  choice: uwe ndị ha yi n’elu
  rationale: ἱμάτια na-ezo n’ozuzu aka n’uwe elu mmadụ na-eyi; ntụgharị a doro ndị na-agụ Igbo nke oge a anya ma zere ime ka ọ bụrụ naanị otu ụdị uwe.
- source_word: παρὰ τοὺς πόδας
  choice: n’ụkwụ
  rationale: Nke a bụ ụzọ dị nkenke ma dịkwa eke n’Igbo isi kwuo na e debere ihe n’akụkụ ụkwụ mmadụ.
- source_word: νεανίου
  choice: otu nwa okorobịa
  rationale: Nke a na-egosi nwoke ka na-eto eto n’asụsụ Igbo a na-asụ ugbu a.
- source_word: καλουμένου Σαύλου
  choice: a na-akpọ Sọl
  rationale: Nke a na-agbasochi okwu Grik anya ma na-ada nke ọma n’Igbo.
theological_decisions:
- issue: Ihe οἱ μάρτυρες pụtara n’ọnọdụ ogbugbu a
  choice: Ndị akaebe ahụ
  alternative: Ndị nwụrụ n’ihi okwukwe
  rationale: Akụkọ a na-ekwu banyere ndị gbara akaebe n’usoro ikpe ma sonye n’ogbugbu ahụ. Ịsụgharị ya dịka ndị nwụrụ n’ihi okwukwe ga-ebubata nghọta okwu ahụ nwetara mgbe e mesịrị, nke ọnọdụ amaokwu a anaghị akwado.
translation_notes:
  register: 'E ji Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta. E debere ọdịiche oge omume abụọ ahụ: a chụpụtasịrị Stivin, ma ịtụ ya nkume nọ na-aga n’ihu. E tinyere akara nkọwa ala peeji [a] ozugbo n’akụkụ okwu ọ na-akọwa.'
