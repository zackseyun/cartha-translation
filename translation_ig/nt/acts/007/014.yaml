source:
  edition: SBLGNT
  text: ἀποστείλας δὲ Ἰωσὴφ μετεκαλέσατο ⸂Ἰακὼβ τὸν πατέρα αὐτοῦ⸃ καὶ πᾶσαν τὴν συγγένειαν ἐν ψυχαῖς ἑβδομήκοντα πέντε,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/014.yaml
  text: Then Joseph sent and summoned Jacob his father and all his relatives[a], seventy-five persons in all.
translation:
  language: ig
  text: Josef wee zipụ ozi kpọọ Jekọb, nna ya, na ndị ikwu ya niile, mmadụ iri asaa na ise n’ọnụ ọgụgụ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ụfọdụ akụkụ Agba Ochie kwuru na ngụkọta ahụ bụ “iri asaa” (dịka ọmụmaatụ, ihe odide Hibru nke Jenesis 46:27 na Ọpụpụ 1:5); ma n'ebe a, Ọrụ Ndị Ozi kwuru “iri asaa na ise.”
    reason: cross_reference
lexical_decisions:
- source_word: ἀποστείλας
  choice: zipụ ozi
  rationale: Ọ bụ participle aorist nke na-egosi ihe Josef mere tupu ọ kpọọ ha. N'Igbo, “zipụ ozi” na-egosi n'ụzọ ebumpụta ụwa na o mere ka a gaa kpọọ ha, n'agbanyeghị na Grik ekwughị kpọmkwem onye ma ọ bụ ihe o zipụrụ.
- source_word: δὲ
  choice: wee
  rationale: “Wee” na-ejikọta ihe a na akụkọ gara aga ma na-egosi nzọụkwụ ọzọ n'akụkọ ahụ n'Igbo dị mfe.
- source_word: μετεκαλέσατο
  choice: kpọọ ... ka ha bịa
  rationale: Ngwaa a pụtara ịkpọ ma ọ bụ iziga ka mmadụ bịa. Nkebiokwu a na-enye echiche ahụ nke ọma n'Igbo ugbu a.
- source_word: Ἰακὼβ τὸν πατέρα αὐτοῦ
  choice: Jekọb nna ya
  rationale: Nke a na-edebe apposition nke Grik n'ụzọ doro anya ma dịkwa mfe n'Igbo.
- source_word: πᾶσαν τὴν συγγένειαν
  choice: ndị ikwu ya niile
  rationale: “Ndị ikwu” na-egosi ìgwè ndị ha na ya bụ otu ọbara ma ọ bụ ezinụlọ, na-enweghị ime ka okwu ahụ dị warara naanị n'ụlọ ya.
- source_word: ἐν ψυχαῖς
  choice: Ha dị mmadụ ... n’ọnụ ọgụgụ
  rationale: N'ebe a, “mkpụrụ obi” bụ akpaala okwu e ji agụ ndị mmadụ. Nsụgharị a na-enye nghọta nke ọnụ ọgụgụ n'Igbo n'ebughị echiche nkà mmụta okpukpe banyere mkpụrụ obi bata.
- source_word: ἑβδομήκοντα πέντε
  choice: iri asaa na ise
  rationale: Nke a bụ nsụgharị kpọmkwem nke ọnụọgụ dị n'ihe odide Grik.
theological_decisions:
- issue: Ọnụ ọgụgụ ndị ezinụlọ Jekọb ma e jiri ya tụnyere ọdịnala ederede Jenesis na Ọpụpụ
  choice: mmadụ iri asaa na ise
  alternative: mmadụ iri asaa
  rationale: Ihe odide Grik nke Ọrụ Ndị Ozi kwuru kpọmkwem iri asaa na ise. Ya mere, a hapụrụ ọnụ ọgụgụ ahụ n'amaokwu ahụ ma kọwaa n'okpuru peeji na ụfọdụ ebe n'Agba Ochie nwere iri asaa, kama ime ka ọdịiche ahụ pụọ.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dịkwa mfe nghọta. “Wee zipụ ozi kpọọ ... ka ha bịa” bụ ụzọ Igbo si ekwu ihe Grik ahụ pụtara n'ụzọ ebumpụta ụwa; e zere “mkpụrụ obi” n'ihi na ebe a ọ bụ naanị ụzọ e si agụ mmadụ.
