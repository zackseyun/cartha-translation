  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἐλιθοβόλουν τὸν Στέφανον ἐπικαλούμενον καὶ λέγοντα· Κύριε Ἰησοῦ, δέξαι τὸ πνεῦμά μου·
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/059.yaml
  text: And they were stoning Stephen as he called out and said[a], “Lord Jesus, receive my spirit.”
translation:
  language: ig
  text: Ha nọ na-atụ Stivin nkume mgbe ọ na-akpọku, na-asị,[a] “Onyenwe Jizọs, nara mmụọ m.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “mgbe ọ na-akpọku ma na-asị.” Okwu Grik ahụ pụrụ igosi nke ọma karị ịkpọku mmadụ ma ọ bụ ịrịọ ya n’ekpere.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλιθοβόλουν
  choice: Ha nọkwa na-atụ Stivin nkume
  rationale: Oge imperfect na-egosi omume na-aga n’ihu; ‘nọkwa na-atụ ... nkume’ na-egosipụta nke a n’Igbo dị mfe ma doo anya.
- source_word: ἐπικαλούμενον
  choice: mgbe ọ na-akpọku
  rationale: ‘Ịkpọku’ nwere ike igosi ịkpọ onye enyemaka ma ọ bụ ịrịọ ya n’ekpere; ebe a, okwu Stivin kpọmkwem na-egosi na ọ na-akpọku Jizọs.
- source_word: λέγοντα
  choice: ma na-asị
  rationale: Nke a na-ejikọta participle nke abụọ na nke mbụ n’ụzọ kwekọrọ n’usoro Grik ma bụrụkwa Igbo a na-asụ nke ọma.
- source_word: Κύριε Ἰησοῦ
  choice: Onyenwe anyị Jizọs
  rationale: ‘Onyenwe anyị’ bụ nsụgharị Igbo kwesịrị ekwesị maka κύριος n’ịkpọ mmadụ aha n’ụzọ nsọpụrụ, ma na-echekwa ịdị arọ nke aha e nyere Jizọs.
- source_word: δέξαι
  choice: nara
  rationale: ‘Nara’ na-enye iwu/arịrịọ dị mkpirikpi ma dị nsọ, nke dabara n’ọnọdụ Stivin na-enyefe mmụọ ya.
- source_word: τὸ πνεῦμά μου
  choice: mmụọ m
  rationale: ‘Mmụọ m’ bụ nsụgharị kpọmkwem na nke doro anya maka πνεῦμά μου n’ọnọdụ ọnwụ a, na-enweghị ịkọwa ya karịa ihe ederede kwuru.
theological_decisions:
- issue: Ma a ga-eme ka o doo anya na Stivin kpọkuru Jizọs n’arịrịọ yiri ekpere
  choice: E ji ‘mgbe ọ na-akpọku’ mee ka onye a na-akpọku pụta ìhè site n’okwu sochirinụ, ‘Onyenwe anyị Jizọs.’
  alternative: mgbe ọ na-eti mkpu; mgbe ọ na-akpọku ya n’ekpere
  rationale: ἐπικαλούμενον nwere nghọta nke ịkpọku ma ọ bụ ịrịọ; okwu kpọmkwem na-egosi na ọ bụ Jizọs ka Stivin na-agwa. Nsụgharị ahụ anaghị ezobe nke a, ma ọ naghị etinye okwu ‘n’ekpere’ n’ahụ ederede mgbe okwu ahụ n’onwe ya enweghị ya kpọmkwem.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. ‘Stivin’ na ‘Jizọs’ bụ ụdị aha ndị a na-ahụkarị n’Igbo. A debere usoro omume na-aga n’ihu nke imperfect Grik, ma chekwaa mgbagwoju nghọta dị na ἐπικαλούμενον site n’isiokwu ala peeji.
