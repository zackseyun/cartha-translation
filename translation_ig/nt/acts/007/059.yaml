    text: A pụkwara ịsụ ya, “mgbe ọ na-akpọku ma na-asị.” Okwu Grik ahụ pụrụ igosi nke ọma karị ịkpọku mmadụ ma ọ bụ ịrịọ ya n’ekpere.
    reason: lexical_alternative
  revision_rationale: The revision removes the unexpressed possessive from the direct address and lightly improves punctuation. The note continues to present the lexical alternative for ἐπικαλούμενον without making its implied object part of the Greek wording itself.
