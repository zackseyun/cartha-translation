revisions:
- from: Mgbe ọ na-eru afọ iri anọ[a], echiche batara ya n’obi[b] ịga leta ụmụnne ya, bú ụmụ Izrel.[c]
  to: Mgbe oge ya nke afọ iri anọ na-achọ imezu[a], ọ batara ya n’obi[b] ịga leta ụmụnne ya, bụ ụmụ Izrel.[c]
  rationale: The revision improves the rendering of the Greek forty-year temporal idiom and uses a more idiomatic Igbo heart expression. It retains the source’s ambiguity between an inward impulse and a settled intention, as well as the appositional identification of Moses’ brothers as the sons of Israel. Footnote markers remain correctly attached to the temporal expression, heart idiom, and ethnic designation.
