source:
  edition: SBLGNT
  text: Ὡς δὲ ἐπληροῦτο αὐτῷ τεσσερακονταετὴς χρόνος, ἀνέβη ἐπὶ τὴν καρδίαν αὐτοῦ ἐπισκέψασθαι τοὺς ἀδελφοὺς αὐτοῦ τοὺς υἱοὺς Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/023.yaml
  text: When he was approaching forty years of age[a], it came into his heart to visit his brothers[c][b], the sons of Israel.
translation:
  language: ig
  text: Mgbe oge ya nke afọ iri anọ na-achọ imezu[a], ọ batara ya n’obi[b] ịga leta ụmụnne ya, bụ ụmụ Izrel.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “mgbe ọ dị ihe dị ka afọ iri anọ” ma ọ bụ “mgbe ọ gbara afọ iri anọ.” Okwu Grik na-ekwu n’ụzọ akpaala okwu na oge afọ iri anọ ya na-achọ imezu.
    reason: lexical_alternative
  - marker: b
    text: N’ụzọ nkịtị, okwu Grik na-ekwu na ihe ahụ “rigoro n’obi ya”; ọ bụ akpaala okwu na-egosi ọchịchọ ma ọ bụ mkpebi sitere n’ime mmadụ.
    reason: lexical_alternative
  - marker: c
    text: “Ụmụnne ya” ebe a bụ ndị Izrel ibe ya; “ụmụ Izrel” na-akọwa ndị a na-ekwu maka ha.
    reason: cultural_note
lexical_decisions:
- source_word: Ὡς δὲ
  choice: Mgbe
  rationale: Ọ na-ewebata oge ihe sochirinụ mere. “Mgbe” bụ ụzọ Igbo dị mfe ma dị mma isi gosi njikọ oge a; ọnọdụ gbara amaokwu ahụ gburugburu na-eburu ike njikọ nke δὲ.
- source_word: ἐπληροῦτο αὐτῷ τεσσερακονταετὴς χρόνος
  choice: ọ na-eru afọ iri anọ
  rationale: Nke a na-egosi na oge afọ iri anọ ya na-emezu. Nsụgharị a na-ada nke ọma n’Igbo ma na-ahapụ obere oghere dị n’etiti ‘ọ na-eru’ na ‘ọ gbara’ afọ iri anọ, dịka usoro okwu Grik si dị.
- source_word: ἀνέβη ἐπὶ τὴν καρδίαν αὐτοῦ
  choice: echiche batara ya n’obi
  rationale: Nke a na-echekwa ihe atụ nke ihe batara n’obi, ma na-eme ka ahịrịokwu ahụ doo onye na-agụ Igbo anya. Ọ na-egosi ọchịchọ ma ọ bụ mkpebi sitere n’ime mmadụ n’enweghị ime ka ọ bụrụ naanị ‘o kpebiri.’
- source_word: ἐπισκέψασθαι
  choice: ịga leta
  rationale: N’ebe a, okwu ahụ pụtara ịgakwuru ndị nke ya ịhụ ha na ọnọdụ ha. “Ịga leta” bụ okwu Igbo e ji eme ihe kwa ụbọchị, ma ọnọdụ akụkọ ahụ ka na-egosi mmasị na nchebara echiche ya.
- source_word: τοὺς ἀδελφοὺς αὐτοῦ
  choice: ụmụnne ya
  rationale: “Ụmụnne” bụ okwu Igbo kwesịrị ekwesị maka ndị e jikọtara n’ezinụlọ ma ọ bụ n’otu agbụrụ; nkebi okwu na-esochi ya kọwara na ndị a bụ ụmụ Izrel ibe ya.
- source_word: τοὺς υἱοὺς Ἰσραήλ
  choice: ụmụ Izrel
  rationale: Nke a na-echekwa akpaala okwu Akwụkwọ Nsọ ma na-ada nke ọma n’Igbo. Ọ na-akọwa kpọmkwem ndị a kpọrọ ụmụnne Mosis.
theological_decisions:
- issue: Aha njikọ ezinụlọ na njirimara agbụrụ
  choice: ụmụnne ya, bú ụmụ Izrel
  alternative: ndị Izrel ibe ya
  rationale: Nhọrọ a na-echekwa ma ihe oyiyi ezinụlọ dị na ἀδελφοί ma nkọwa agbụrụ dị na υἱοὶ Ἰσραήλ. Okwu Igbo “ụmụnne” apụtaghị na ọ bụ naanị ụmụ nwoke, ya mere ọ naghị eme ka ihe Grik bu n’obi dị warara.
- issue: Ọchịchọ dị n’obi ma ọ bụ mkpebi doro anya
  choice: echiche batara ya n’obi
  alternative: o kpebiri
  rationale: Grik ji akpaala okwu nke obi kọwaa ebumnobi ime ihe. Ide ya dịka “o kpebiri” ga-eme ka ihe atụ ahụ na obere nghọta dị n’etiti ọchịchọ na mkpebi pụọ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta, dee ya. “Echiche batara ya n’obi” na-echekwa akpaala okwu nke isi mmalite n’enweghị asụsụ siri ike; “ụmụnne ya, bú ụmụ Izrel” na-echekwa njikọ ezinụlọ na njirimara agbụrụ dị n’Grik.
