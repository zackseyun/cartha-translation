id: ACT.7.42
reference: Acts 7:42
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἔστρεψεν δὲ ὁ θεὸς καὶ παρέδωκεν αὐτοὺς λατρεύειν τῇ στρατιᾷ τοῦ οὐρανοῦ, καθὼς γέγραπται ἐν βίβλῳ τῶν προφητῶν· Μὴ σφάγια καὶ θυσίας προσηνέγκατέ μοι ἔτη τεσσεράκοντα ἐν τῇ ἐρήμῳ, οἶκος Ἰσραήλ;
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/042.yaml
  text: 'But God turned away and gave them over to serve the host of heaven[a], just as it is written in the book of the prophets: ‘Did you offer to me slain offerings and sacrifices for forty years in the wilderness[d][c][b], O house of Israel?’'
translation:
  language: ig
  text: 'Ma Chineke chigharịrị ma nyefee ha ka ha fee usuu nke eluigwe[a], dị nnọọ ka e dere n''akwụkwọ ndị amụma[b], sị: “Ụmụ Izrel, ọ̀ bụ m ka unu wetara anụ e gburu maka àjà na àjà n''ime afọ iri anọ n''ọzara?[c]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ka ha na-efe ofufe nye usuu nke eluigwe.” Akpaokwu a na-ezo aka n'ihe ndị dị na mbara igwe, nakwa n'ike eluigwe ndị e jikọtara ha na ha n'ofufe arụsị.
    reason: lexical_alternative_and_cultural_note
  - marker: b
    text: Ma ọ bụ, “n'akwụkwọ mpịakọta nke ndị amụma.”
    reason: lexical_alternative
  - marker: c
    text: E hotara nke a n'Amọs 5:25.
    reason: cross_reference
lexical_decisions:
- source_word: ἔστρεψεν
  choice: gbakụtara ha azụ
  rationale: N'ọnọdụ a, okwu ahụ na-egosi na Chineke hapụrụ ha n'ihi nnupụisi ha, ọ bụghị nanị na ọ tụgharịrị ahụ ya.
- source_word: παρέδωκεν
  choice: nyefee ha
  rationale: Nke a na-echekwa echiche nke ikpe Chineke nke mere ka ọ hapụ ha ka ha soro ọchịchọ ha, n'ekwughị na Chineke bụ onye kpatara mmehie ha.
- source_word: λατρεύειν
  choice: ka ha na-efe
  rationale: ‘Ife’ n'Igbo nwere ike ịpụta ọrụ okpukpe na ofufe, ya mere ọ dabara n'okwu banyere ikpere ihe ndị dị n'eluigwe isi.
- source_word: τῇ στρατιᾷ τοῦ οὐρανοῦ
  choice: usuu ndị dị n'eluigwe
  rationale: Nsụgharị a na-echekwa akpaokwu ihe atụ nke Akwụkwọ Nsọ n'ebughị ụzọ kpebie ma ọ bụ kpakpando, ihe ndị ọzọ dị na mbara igwe, ma ọ bụ ike ndị e jikọtara ha na ha.
- source_word: ἐν βίβλῳ τῶν προφητῶν
  choice: n'akwụkwọ ndị amụma
  rationale: Ọ bụ nsụgharị doro anya ma dị mfe nghọta; ‘akwụkwọ mpịakọta’ bụkwa ihe ga-ekwe omume n'akụkọ ihe mere eme.
- source_word: Μὴ ... προσηνέγκατέ μοι
  choice: ọ̀ bụ m ka unu wetara ...?
  rationale: Ajụjụ a na-atụ anya azịza na-adịghị mma, ebe nhazi ‘ọ̀ bụ m’ na-echekwa nrụgide dị n'okwu ‘m’.
- source_word: σφάγια καὶ θυσίας
  choice: anụ e gburu n'àjà na àjà ndị ọzọ
  rationale: Nke mbụ na-eme ka o doo anya na a na-ekwu maka anụ e gburu dịka onyinye; nke abụọ bụ okwu sara mbara maka àjà.
- source_word: ἔτη τεσσεράκοντα ἐν τῇ ἐρήμῳ
  choice: ruo iri afọ anọ n'ọzara
  rationale: Nke a bụ Igbo ebumpụta ụwa nke na-echekwa ogologo oge ahụ na ọnọdụ njem Izrel n'ọzara.
theological_decisions:
- issue: Omume Chineke n'ikpe
  choice: Chineke gbakụtara ha azụ ma nyefee ha
  alternative: Chineke mere ka ha fee ihe ndị dị n'eluigwe
  rationale: Ngwaa abụọ ahụ na-egosi ikpe nke ịhapụ ndị nnupụisi ka ha soro ụzọ ha; nsụgharị ahụ anaghị ekwu na Chineke kere mmehie ha.
- issue: Ihe ‘usuu ndị dị n'eluigwe’ na-ezo aka na ya
  choice: E debere akpaokwu ahụ n'ụdị sara mbara
  alternative: Kpakpando naanị, ma ọ bụ ndị mmụọ ozi
  rationale: N'ebe a ọ metụtara ihe ma ọ bụ ike eluigwe ndị a na-efe arụsị, ma isi okwu Grik anaghị akọwapụta naanị otu ụdị.
- issue: Ajụjụ e hotara n'Amọs 5:25
  choice: E debere ya dịka ajụjụ na-atụ anya azịza ‘mba’
  alternative: Ịkọwa ya ozugbo dịka nkwupụta na Izrel achụghị àjà nye Chineke
  rationale: Ụdị ajụjụ ahụ bụ akụkụ nke esemokwu amụma ahụ, ya mere a gaghị edozi mgbagwoju anya ya n'ime nkwupụta nkọwa.
translation_notes:
  register: Standard Igbo dị ugbu a, nwee ugwu ma dịrị ndị nkịtị mfe nghọta. E jiri ‘Ụmụ Izrel’ mee vocative ebumpụta ụwa; e debere akpaokwu ‘usuu ndị dị n'eluigwe’ ka ọ ghara ịkọwapụta referent karịa isi Greek.
