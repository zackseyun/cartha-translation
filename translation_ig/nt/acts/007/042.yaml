revisions:
- from: 'Ma Chineke gbakụtara ha azụ, nyefee ha ka ha na-efe usuu ndị dị n''eluigwe[a], dị nnọọ ka e dere n''akwụkwọ ndị amụma[b], sị: “Ụmụ Izrel, ọ̀ bụ m ka unu wetara anụ e gburu n''àjà na àjà ndị ọzọ ruo iri afọ anọ n''ọzara?[c]”'
  to: 'Ma Chineke chigharịrị ma nyefee ha ka ha fee usuu nke eluigwe[a], dị nnọọ ka e dere n''akwụkwọ ndị amụma[b], sị: “Ụmụ Izrel, ọ̀ bụ m ka unu wetara anụ e gburu maka àjà na àjà n''ime afọ iri anọ n''ọzara?[c]”'
  rationale: The revision corrects the temporal expression to duration, removes the unsupported “other,” and adopts the direct, idiomatic biblical expression “usuu nke eluigwe.” It retains the source's rhetorical ambiguity and the judicial force of the opening verbs without doctrinal expansion.
