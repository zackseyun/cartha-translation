    text: Ụfọdụ nsụgharị, n’ịgbaso okwu Hibru dị n’Amọs 5:26, na-asị, “chi unu Refan,” kama “chi Refan.” Ederede Ọrụ Ndịozi ebe a nwere “chi Refan.”
    reason: alternative_reading
  - marker: b
    text: Ọrụ Ndịozi nwere, “gafee Babịlọn.” N’Amọs 5:27, a na-asụgharịkarị ya “gafee Damaskọs.”
    reason: cross_reference
  - marker: c
    text: A pụkwara ịsụgharị “ihe oyiyi” dịka “ụdị” ma ọ bụ “ihe nnọchianya.”
    reason: lexical_alternative
  revision_rationale: The revision removes an unsupported causal connector and the added specification of war, while retaining the Greek sequence and its sense of forced removal beyond Babylon. Footnote wording has also been made more precise and natural in Standard Igbo.
