id: ACT.7.43
reference: Acts 7:43
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἀνελάβετε τὴν σκηνὴν τοῦ Μολὸχ καὶ τὸ ἄστρον τοῦ ⸀θεοῦ ⸀Ῥαιφάν, τοὺς τύπους οὓς ἐποιήσατε προσκυνεῖν αὐτοῖς. καὶ μετοικιῶ ὑμᾶς ἐπέκεινα Βαβυλῶνος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/043.yaml
  text: And you took up the tent of Moloch and the star of the god Rephan[a], the images that you made to worship them[c][b], and I will deport you beyond Babylon.
translation:
  language: ig
  text: Unu bukwara ụlọikwuu nke Molọk na kpakpando nke chi Refan[a]—ihe oyiyi unu mere ka unu fee ha ofufe[c]; aga m achụga unu gafee Babịlọn[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ụfọdụ nsụgharị, n’ịgbaso okwu Hibru dị n’Amọs 5:26, na-asị, “chi unu Refan,” kama “chi Refan.” Ederede Ọrụ Ndịozi ebe a nwere “chi Refan.”
    reason: alternative_reading
  - marker: b
    text: Ọrụ Ndịozi nwere, “gafee Babịlọn.” N’Amọs 5:27, a na-asụgharịkarị ya “gafee Damaskọs.”
    reason: cross_reference
  - marker: c
    text: A pụkwara ịsụgharị “ihe oyiyi” dịka “ụdị” ma ọ bụ “ihe nnọchianya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνελάβετε
  choice: Unu bukwara
  rationale: Okwu a na-egosi iburu ma ọ bụ ịkwagharị ihe; “buru” na-egosipụta ibu ihe ndị e ji efe arụsị n’enweghị ịgbakwụnye nkọwa na-adịghị n’ederede.
- source_word: σκηνὴν
  choice: ụlọikwuu
  rationale: σκηνή pụtara ụlọikwuu. Nhọrọ a na-edobe ihe okwu Grik pụtara, kama iji okwu nwere ike ime ka ndị na-agụ ya chee kpọmkwem banyere ụlọikwuu Chineke.
- source_word: Μολὸχ
  choice: Molọk
  rationale: A sụgharịghị aha ahụ kama e dere ya n’ụzọ kwekọrọ na ụda Grik ma dịrị ndị Igbo mfe ịgụ.
- source_word: ἄστρον
  choice: kpakpando
  rationale: Nke a bụ ihe ἄστρον pụtara ozugbo; e tinyeghị “akara” ma ọ bụ “oyiyi” n’ihi na nke ahụ ga-abụ nkọwa ọzọ.
- source_word: τοῦ θεοῦ Ῥαιφάν
  choice: nke chi Refan
  rationale: Ederede Grik nke Ọrụ Ndịozi kwuru “chi Refan,” ọ bụghị “chi unu Refan”; a gbasoro okwu dị n’ebe a ma debe ọdịiche Amos n’okpuru peeji.
- source_word: τύπους
  choice: ihe oyiyi
  rationale: N’ọnọdụ a nke ofufe arụsị, “ihe oyiyi” na-akọwa ụdị ihe ndị a kpụrụ akpụ e ji anọchi anya chi, ma “ụdị” ma ọ bụ “ihe nnọchianya” ka bụ nhọrọ ndị ọzọ.
- source_word: προσκυνεῖν αὐτοῖς
  choice: ka unu fee ha ofufe
  rationale: N’ọnọdụ okpukpe, “ife ha ofufe” na-enye ihe προσκυνέω pụtara n’Igbo eke ma na-edobe αὐτοῖς dịka “ha.”
- source_word: μετοικιῶ
  choice: aga m achụga unu n’agha
  rationale: Okwu a na-egosi ịkwaga ndị mmadụ n’ike gaa mba ọzọ. Akpaalaokwu Igbo a na-egosipụta nchụpụ n’agha na ike ikpe dị n’okwu ahụ.
- source_word: ἐπέκεινα Βαβυλῶνος
  choice: gafee Babịlọn
  rationale: “Gafee” na-egosipụta ‘n’ofe’ ma ọ bụ ‘karịa’; “Babịlọn” na-esochi ederede Grik nke Ọrụ Ndịozi n’emeghị ka ọ kwekọọ na Amos.
theological_decisions:
- issue: Ebe a na-ekwu na a ga-achụga ha dị iche n’okwu Amos 5:27
  choice: gafee Babịlọn
  alternative: gafee Damaskọs
  rationale: Ederede Grik nke Ọrụ Ndịozi kwuru Babịlọn kpọmkwem. A naghị agbanwe ya ka o kwekọọ na Amos; e debere ọdịiche ahụ n’okpuru peeji.
- issue: Njikọ chi Refan na ndị a na-agwa okwu
  choice: chi Refan
  alternative: chi unu Refan
  rationale: A gbasoro SBLGNT, nke nwere τοῦ θεοῦ Ῥαιφάν. A naghị ebubata “unu” site n’ederede Hibru nke Amos n’ime isi ederede Ọrụ Ndịozi.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke oge a ma dị ùgwù. E ji “ụlọikwuu” debe ihe σκηνή pụtara n’enweghị ịkpọ ya ụlọ nsọ; e ji “achụga unu n’agha” mee ka nchụpụ n’ike doo anya. Akara ala peeji [a], [b], na [c] niile pụtara n’isi ederede.
