revisions:
- from: Unu bukwara ụlọikwuu nke Molọk na kpakpando nke chi Refan[a]—ihe oyiyi unu mere ka unu fee ha ofufe[c]. N’ihi ya, aga m achụga unu n’agha gafee Babịlọn[b].
  to: Unu bukwara ụlọikwuu nke Molọk na kpakpando nke chi Refan[a]—ihe oyiyi unu mere ka unu fee ha ofufe[c]; aga m achụga unu gafee Babịlọn[b].
  rationale: The revision removes an unsupported causal connector and the added specification of war, while retaining the Greek sequence and its sense of forced removal beyond Babylon. Footnote wording has also been made more precise and natural in Standard Igbo.
