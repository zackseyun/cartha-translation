    text: Ma ọ bụ, “Osimiri Amị.” Ederede Grik nwere “Oké Osimiri Uhie” (Ἐρυθρὰ Θάλασσα), bụ aha a na-ahụkarị n’Agba Ọhụrụ na Septuagint maka ebe Izrel si gafee.
    reason: lexical_alternative
  revision_rationale: The revision completes the directional meaning of ἐξήγαγεν, clarifies the forty-year temporal phrase while retaining its source ambiguity, and corrects the footnote’s Reed Sea alternative and idiom. It preserves the emphatic reference to Moses, the source’s repeated locative structure, and the established Greek designation “Red Sea.”
