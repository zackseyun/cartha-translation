  text: οὗτος ἐξήγαγεν αὐτοὺς ποιήσας τέρατα καὶ σημεῖα ἐν ⸀γῇ Αἰγύπτῳ καὶ ἐν Ἐρυθρᾷ Θαλάσσῃ καὶ ἐν τῇ ἐρήμῳ ἔτη τεσσεράκοντα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/036.yaml
  text: This man led them out[a], performing wonders and signs in the land of Egypt and at the Red Sea and in the wilderness for forty years.
translation:
  language: ig
  text: Nwoke a kpọpụtara ha pụọ, na-eme ọrụ ebube na ihe ịrịba ama n’ala Ijipt, n’Oké Osimiri Uhie[a], nakwa n’ọzara n’ime afọ iri anọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Osimiri Amị.” Ederede Grik nwere “Oké Osimiri Uhie” (Ἐρυθρὰ Θάλασσα), bụ aha a na-ahụkarị n’Agba Ọhụrụ na Septuagint maka ebe Izrel si gafee.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτος
  choice: Nwoke a
  rationale: Ngosipụta a siri ike ma na-arụtụ aka azụ n’ebe Mosis nọ; ‘Nwoke a’ na-echekwa ike okwu ahụ karịa naanị ‘Ọ.’
- source_word: ἐξήγαγεν
  choice: kpọpụtara ha
  rationale: Okwu a pụtara iduru ma ọ bụ ịkpọpụta ndị mmadụ. ‘Kpọpụtara ha’ bụ Igbo dị nkenke ma kwekọọ n’ihe gbasara ọpụpụ Izrel n’Ijipt.
- source_word: ποιήσας
  choice: na-eme
  rationale: Ụdị participle a na-ejikọta ọrụ ebube ndị ahụ na idupụta ha. ‘Na-eme’ na-eme ka njikọ ahụ doo anya n’Igbo eke n’enweghị ịgbanwe onye na-eme ihe ahụ.
- source_word: τέρατα καὶ σημεῖα
  choice: ọrụ ebube na ihe ịrịba ama
  rationale: Nke a na-echekwa ụzọ abụọ okwu Grik si kọwaa ihe ndị na-akpali ịtụnanya na ndị na-egosi ihe ma ọ bụ na-akwado ozi.
- source_word: ἐν γῇ Αἰγύπτῳ
  choice: n’ala Ijipt
  rationale: ‘Ala’ na-anọchi anya γῇ ma na-echekwa usoro ebe atọ dị n’amaokwu ahụ.
- source_word: ἐν Ἐρυθρᾷ Θαλάσσῃ
  choice: n’Oké Osimiri Uhie
  rationale: Nke a bụ nsụgharị kpọmkwem nke aha Grik Ἐρυθρὰ Θάλασσα ma na-echekwa preposition ἐν dịka ‘n’.’
- source_word: ἐν τῇ ἐρήμῳ
  choice: n’ọzara
  rationale: ‘Ọzara’ bụ okwu Igbo a na-aghọta nke ọma maka ebe tọgbọrọ n’efu Izrel gagharịrị; ọ bụghị iwu na ọ pụtara naanị ala aja.
- source_word: ἔτη τεσσεράκοντα
  choice: ruo afọ iri anọ
  rationale: ‘Ruo’ na-egosi ogologo oge a kpọrọ aha ma na-eme ka okwu ahụ bụrụ Igbo eke.
theological_decisions:
- issue: Onye οὗτος na-arụtụ aka na ya na ọrụ Mosis n’Ọpụpụ ahụ
  choice: E gosiri Mosis dịka mmadụ Chineke ji kpọpụta Izrel, ma e kwughị na ọ rụrụ ọrụ ahụ n’ike nke aka ya n’enweghị Chineke.
  alternative: Iji naanị ‘Ọ’ mee ka nrụtụ aka Stivin siri ike n’ebe Mosis nọ ghara ịpụta ìhè.
  rationale: N’okwu Stivin, ọ na-ekwughachi nrụtụ aka siri ike n’ebe ‘Mosis a’ nọ. ‘Nwoke a’ na-echekwa nrụgide ahụ, ebe asụsụ Akwụkwọ Nsọ nwekwara ike ikwu na mmadụ mere ihe Chineke ji ya mee.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. A hapụrụ usoro ebe atọ—ala Ijipt, Oké Osimiri Uhie, na ọzara—ka ọ dị n’isi iyi Grik. E tinyere akara nkọwa ụkwụ kpọmkwem n’aha ‘Oké Osimiri Uhie,’ ebe nkọwa ahụ metụtara.
