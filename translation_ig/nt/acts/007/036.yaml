revisions:
- from: Nwoke a kpọpụtara ha, na-eme ọrụ ebube na ihe ịrịba ama n’ala Ijipt, n’Oké Osimiri Uhie[a], nakwa n’ọzara ruo afọ iri anọ.
  to: Nwoke a kpọpụtara ha pụọ, na-eme ọrụ ebube na ihe ịrịba ama n’ala Ijipt, n’Oké Osimiri Uhie[a], nakwa n’ọzara n’ime afọ iri anọ.
  rationale: The revision completes the directional meaning of ἐξήγαγεν, clarifies the forty-year temporal phrase while retaining its source ambiguity, and corrects the footnote’s Reed Sea alternative and idiom. It preserves the emphatic reference to Moses, the source’s repeated locative structure, and the established Greek designation “Red Sea.”
