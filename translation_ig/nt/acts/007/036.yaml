review_pass:
  verdict: revise
  source_fidelity: The draft correctly identifies Moses emphatically as “Nwoke a” and preserves the three locations, the wonder/sign pair, and the forty-year duration. However, “kpọpụtara ha” needs the directional complement “pụọ” to fully express ἐξήγαγεν (“brought/led them out”).
  naturalness: The main sentence is otherwise clear Standard Igbo. “n’ime afọ iri anọ” expresses the duration of the wilderness activity more naturally and with less risk that “ruo” modifies the preceding clause. The footnote requires idiomatic and lexical refinement.
  terminology: “ọrụ ebube na ihe ịrịba ama,” “ala Ijipt,” “Oké Osimiri Uhie,” and “ọzara” are suitable. The lexical alternative “Oké Osimiri Ahịhịa” is imprecise for “Reed Sea”; “Osimiri Amị” is more accurate. The footnote should describe Ἐρυθρὰ Θάλασσα as the customary designation found in the Greek New Testament and Septuagint.
  issues:
  - severity: medium
    issue: The rendering of ἐξήγαγεν lacks an explicit ‘out’ complement.
    rationale: “kpọpụtara ha” can mean brought forth/produced; “kpọpụtara ha pụọ” clearly renders the exodus-direction sense of ἐξήγαγεν without adding a source location.
  - severity: low
    issue: “ruo afọ iri anọ” may attach loosely to the entire preceding sequence.
    rationale: The Greek duration naturally describes the wilderness period. “n’ime afọ iri anọ” clearly expresses activity during those forty years.
  - severity: medium
    issue: The footnote’s alternative term and wording need correction.
    rationale: “Ahịhịa” denotes grass/vegetation broadly, rather than reeds specifically. “Amị” is the appropriate term. “Ihe odide Grik kwuru” is also less idiomatic than “Ederede Grik nwere.”
  revised_text: Nwoke a kpọpụtara ha pụọ, na-eme ọrụ ebube na ihe ịrịba ama n’ala Ijipt, n’Oké Osimiri Uhie[a], nakwa n’ọzara n’ime afọ iri anọ.
  revised_footnotes:
