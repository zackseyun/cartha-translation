  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Εἶπεν δὲ ὁ ἀρχιερεύς· ⸀Εἰ ταῦτα οὕτως ἔχει;
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/001.yaml
  text: Then the high priest said[a], “Are these things so?”
translation:
  language: ig
  text: Mgbe ahụ, nnukwu onye nchụàjà ahụ kwuru[a], “Ihe ndị a hà dị otu a?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “Ọ̀ dị otu a?” ma ọ bụ, n’ụzọ doro anya karị, “Ebubo ndị a hà bụ eziokwu?”
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἶπεν
  choice: kwuru
  rationale: Aorist nke λέγω pụtara n'ụzọ nkịtị ‘kwuru.’ Ọ bụ ezie na ajụjụ na-esochi ya, Igbo nwekwara ike iji ‘kwuru’ webata okwu ajụjụ n’ebughị ụzọ kọwaa ya dị ka ‘jụrụ.’
- source_word: δὲ
  choice: Mgbe ahụ
  rationale: δέ na-egosi na akụkọ ahụ gara n’ihu. ‘Mgbe ahụ’ na-ejikọta ajụjụ a na ebubo ndị e kwuru n’amaokwu bu ya ụzọ n’ụzọ Igbo na-ada nke ọma.
- source_word: ὁ ἀρχιερεύς
  choice: nnukwu onye nchụàjà ahụ
  rationale: Nke a na-egosi otu onyeisi nchụàjà nke nọ n’isi ikpe ahụ, ọ bụghị ìgwè ndị isi nchụàjà. Mkpụrụokwu ‘ahụ’ na-anọchi Greek definite article ma na-ezo aka n’onye a maara n’ọnọdụ ahụ.
- source_word: Εἰ
  choice: hà
  rationale: εἰ na-amalite ajụjụ chọrọ azịza ee ma ọ bụ mba. Akara ajụjụ Igbo ‘hà’ na-egosipụta ọrụ ahụ n’ụzọ ebumpụta ụwa kama ịsụgharị ya dịka ‘ọ bụrụ.’
- source_word: ταῦτα
  choice: Ihe ndị a
  rationale: Nhọrọ a na-edobe ụdị ọtụtụ nke demonstrative ahụ ma na-ezo aka n’ihe ndị akaebe boro Stivin ebubo, n’akọwaghị ya kpọmkwem dịka ‘ebubo ndị a.’
- source_word: οὕτως ἔχει
  choice: dị otu a
  rationale: Nkebiokwu οὕτως ἔχει bụ akpaala okwu pụtara ‘ịdị otú ahụ’ ma ọ bụ ‘ịbụ eziokwu dịka e kwuru.’ ‘Dị otu a’ na-edobe nkenke na ntakịrị enweghị nkọwa zuru ezu nke Greek.
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. A hapụrụ okwu ajụjụ ahụ ka ọ na-ezo n’ozuzu aka n’ihe ndị e kwuru, kama ịgbakwunye ‘ebubo’ n’ahịrị bụ isi; nkọwa ahụ dị n’okpuru peeji.
