  text: Ἐγὼ ὁ θεὸς τῶν πατέρων σου, ὁ θεὸς Ἀβραὰμ ⸀καὶ Ἰσαὰκ ⸁καὶ Ἰακώβ. ἔντρομος δὲ γενόμενος Μωϋσῆς οὐκ ἐτόλμα κατανοῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/032.yaml
  text: I am the God of your fathers[a], the God of Abraham and Isaac and Jacob[b]. Then Moses became terrified and did not dare to look closely.
translation:
  language: ig
  text: “Abụ m Chineke nke ndị nna gị ochie, Chineke nke Abraham na Aịzik na Jekọb.” Mgbe ahụ, ụjọ tụrụ Mosis, ọ dịghịkwa anwa ilee anya nke ọma.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “inyocha nke ọma” ma ọ bụ “ịtụle nke ọma.” Ngwaa Grik ahụ nwere ike ịpụta ile ihe anya nlezianya ma ọ bụ ịtụle ya nke ọma.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγὼ ὁ θεὸς
  choice: Abụ m Chineke
  rationale: Ἐγώ na-emesi onye na-ekwu okwu ike, ebe ahịrịokwu njirimara ahụ enweghị ngwaa e dere ede. Igbo chọrọ ‘Abụ m’ ka nkwupụta ahụ bụrụ nke zuru oke ma bụrụkwa nke e ji asụsụ nkịtị ekwu.
- source_word: τῶν πατέρων σου
  choice: nke nna nna gị
  rationale: πατέρων na-ezo aka n’ebe a n’ebe ndị nna ochie Mosis nọ. ‘Nna nna gị’ bụ okwu Igbo doro anya nke na-echekwa echiche nke ndị nna ochie, kama ime ka ọ bụrụ naanị ndị nna mụrụ mmadụ ozugbo.
- source_word: ὁ θεὸς Ἀβραὰμ καὶ Ἰσαὰκ καὶ Ἰακώβ
  choice: Chineke nke Abraham na Aịzik na Jekọb
  rationale: A hapụrụ njirimara nke abụọ n’ụdị apposition, ma kwughachi ‘na’ iji chekwaa ụda na nhazi nke okwu Grik.
- source_word: ἔντρομος δὲ γενόμενος
  choice: Mgbe ahụ, ụjọ jidere Mosis
  rationale: Nkebi okwu a na-egosi na Mosis batara n’ọnọdụ egwu na ịma jijiji. ‘Ụjọ jidere’ bụ Igbo sitere n’ọnụ, ma ka na-egosi ike nke egwu ahụ na mgbanwe ọnọdụ.
- source_word: οὐκ ἐτόλμα
  choice: o nweghịkwa obi ike
  rationale: Nke a na-enye echiche nke na ọ naghị anwa anwa ime ya; ọ bụ ụzọ Igbo dị mma isi kwuo ‘did not dare.’
- source_word: κατανοῆσαι
  choice: ilegide anya nke ọma
  rationale: N’ọnọdụ ọhụụ nke ọhịa na-ere ọkụ, ngwaa ahụ nwere ike ịpụta ile ihe anya nke ọma ma ọ bụ nyochaa ya nke ọma. Nhọrọ a na-echekwa isi ọhụụ ya n’enweghị iwepụ obosara okwu Grik.
theological_decisions:
- issue: Njirimara onwe Chineke n’okwu e hotara site n’Ọpụpụ
  choice: Abụ m Chineke nke nna nna gị
  alternative: Mụ onwe m bụ Chineke nke nna nna gị
  rationale: ‘Abụ m’ na-eme ka ahịrịokwu ahụ bụrụ Igbo eke, ma na-echekwa nkwupụta njirimara Chineke. Agbakwụnyeghị ‘Mụ onwe m’ n’isi ederede n’ihi na ‘Abụ m’ zuru ezu, ma a hapụghịkwa njirimara ahụ ka ọ bụrụ aha okwu na-enweghị ngwaa.
- issue: Ma κατανοῆσαι ọ bụ ile anya ka ọ bụ inyocha nke ọma
  choice: ilegide anya nke ọma
  alternative: inyocha ya nke ọma
  rationale: Ọnọdụ ọhịa na-ere ọkụ na-akwado echiche nke ile anya, ma okwu Grik nwekwara ike ịpụta nlebara anya ma ọ bụ nnyocha. Ihe odide bụ isi na-eji okwu anya, ebe nkọwa ala na-echekwa nhọrọ nke nnyocha.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. ‘Nna nna gị’ na-enye echiche ndị nna ochie n’ụzọ ndị nkịtị ga-aghọta; ‘ụjọ jidere Mosis’ bụ okwu Igbo eke nke na-egosi oke egwu. E debere akara nkọwa ala [a] ozugbo n’ebe okwu ọ na-akọwa dị.
