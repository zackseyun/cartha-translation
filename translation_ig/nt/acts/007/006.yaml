id: ACT.7.6
reference: Acts 7:6
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐλάλησεν ⸀δὲ οὕτως ὁ θεὸς ὅτι ἔσται τὸ σπέρμα αὐτοῦ πάροικον ἐν γῇ ἀλλοτρίᾳ, καὶ δουλώσουσιν αὐτὸ καὶ κακώσουσιν ἔτη τετρακόσια·
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/006.yaml
  text: 'But God spoke in this way: that his offspring would be a foreign resident in a strange land[a], and they would enslave it and mistreat it for four hundred years.'
translation:
  language: ig
  text: 'Ma Chineke kwuru otu a, sị: “Mkpụrụ ya ga-abụ onye ọbịa n’ala na-abụghị nke ya,[a] ha ga-eme ya ohu, mekpaa ya ahụ ruo afọ narị anọ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ikwu ya n’ụzọ Igbo na-aga were were: “Ụmụ ụmụ ya ga-abụ ndị ọbịa n’ala na-abụghị nke ha, ha ga-eme ha ndị ohu ma mekpaa ha ahụ ruo afọ narị anọ.” N’asụsụ Grik, e ji aha nchịkọta otu, “mkpụrụ,” na nnọchiaha otu, “ya,” kwuo ya.'
    reason: Na-enye ụdị ọtụtụ mmadụ nke na-adị mfe nghọta, ma kọwaa na isiokwu Grik ji aha nchịkọta na nnọchiaha otu.
lexical_decisions:
- source_word: ἐλάλησεν δὲ οὕτως ὁ θεὸς
  choice: Ma Chineke kwuru otu a
  rationale: “Ma” na-egosi njikọ nwere obere ntụgharị nke δέ, ebe “kwuru otu a” na-edobe οὕτως n’ụzọ doro anya ma bụrụkwa Igbo dị mma.
- source_word: τὸ σπέρμα αὐτοῦ
  choice: mkpụrụ ya
  rationale: “Mkpụrụ” na-edobe ihe atụ nke σπέρμα na ọdịdị ya dị ka otu aha na-anọchi anya ụmụ na ụmụ ụmụ Abraham niile.
- source_word: πάροικον
  choice: onye ọbịa
  rationale: N’ebe a, okwu ahụ pụtara onye bi n’ala na-abụghị ala nke ya; “onye ọbịa” bụ okwu Igbo nkịtị nke na-egosi ọnọdụ onye na-abụghị nwa amaala ebe ahụ.
- source_word: ἐν γῇ ἀλλοτρίᾳ
  choice: n’ala na-abụghị nke ya
  rationale: Nke a na-egosipụta isi echiche ἀλλοτρίᾳ—ala bụ nke onye ọzọ, ọ bụghị nke mkpụrụ ahụ—n’enweghị ịkpọ otu mba aha.
- source_word: δουλώσουσιν αὐτὸ
  choice: ha ga-emekwa ya ohu
  rationale: “Ime mmadụ ohu” na-egosi kpọmkwem itinye ya n’ọnọdụ ohu. “Ya” na-edobe nnọchiaha otu nke Grik nke na-ezo aka na mkpụrụ dị ka otu ìgwè.
- source_word: κακώσουσιν
  choice: mekpaa ya ahụ
  rationale: “Mekpaa ... ahụ” bụ Igbo doro anya maka ime mmadụ ihe ọjọọ na ime ka ọ taa ahụhụ, n’ebughị ụzọ kọwaa ụdị mkpagbu ahụ karịa ihe Grik kwuru.
- source_word: ἔτη τετρακόσια
  choice: ruo narị afọ anọ
  rationale: Nke a bụ ụzọ Igbo si egosi ogologo oge omume ahụ ga-adị; ọ na-edobe afọ 400 ahụ kpọmkwem.
theological_decisions:
- issue: Otu aha nke na-anọchi anya ọtụtụ mmadụ n’okwu banyere mkpụrụ Abraham
  choice: 'E debere otu aha na otu nnọchiaha: “mkpụrụ ya ... onye ọbịa ... ya.”'
  alternative: “Ụmụ ụmụ ya ... ndị ọbịa ... ha.”
  rationale: Grik nwere otu aha nchịkọta na otu nnọchiaha (σπέρμα ... αὐτό). Idebe nke a na-echekwa ọdịdị okwu nkwa ahụ, ebe nkọwa ala peeji na-enye ụdị ọtụtụ mmadụ nke na-adịkarị mfe n’Igbo.
- issue: Ndị na-eme ka mkpụrụ ahụ bụrụ ohu
  choice: E debere “ha” n’enweghị ịkpọ ndị ahụ aha.
  alternative: “Ndị bi n’ala ahụ ga-eme ya ohu.”
  rationale: Grik nwere ngwaa onye nke atọ ọtụtụ mana ọ kpọghị ndị na-eme ihe ahụ aha. Ịghara itinye “ndị bi n’ala ahụ” na-ezere ịgbakwunye nkọwa na-adịghị n’ahịrịokwu ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “Mkpụrụ” na-edobe ụda Akwụkwọ Nsọ na njikọ ya na nkwa e kwere Abraham; nkọwa ala peeji na-enyere onye na-agụ ya aka ịghọta na ọ na-anọchi anya ụmụ na ụmụ ụmụ ya niile.
