  source_fidelity: 'Isi ederede na-esochi Grik nke ọma: ọ na-edobe “Ma ... otu a,” aha nchịkọta otu “mkpụrụ,” nnọchiaha otu, ndị na-eme ihe a na-akpọghị aha, na ogologo oge ahụ. Otú ọ dị, nkọwa ala peeji tinye “ndị mmadụ,” ebe Grik na-enye naanị ngwaa ọtụtụ mmadụ n’enweghị isiokwu a kpọrọ aha.'
