id: ACT.7.5
reference: Acts 7:5
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ οὐκ ἔδωκεν αὐτῷ κληρονομίαν ἐν αὐτῇ οὐδὲ βῆμα ποδός, καὶ ἐπηγγείλατο δοῦναι αὐτῷ εἰς κατάσχεσιν αὐτὴν καὶ τῷ σπέρματι αὐτοῦ μετ’ αὐτόν, οὐκ ὄντος αὐτῷ τέκνου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/005.yaml
  text: And he gave him no inheritance in it[a], not even a foot's length, but promised to give it to him as a possession, and to his offspring after him[b], though he had no child.
translation:
  language: ig
  text: O nyeghị ya ihe nketa ọbụla n’ala ahụ[a], ọbụnadị ebe ọ ga-etinye otu ụkwụ. Ma o kwere nkwa inye ya ala ahụ ka ọ bụrụ ihe onwunwe ya, na nke ụmụ ya mgbe ọ gasịrị[b], ọ bụ ezie na o nweghị nwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịtụgharị ya, “ọbụnadị otu ibé ala nta.” Akpaalaokwu Grik a na-ekwu maka akụkụ ala kacha nta a pụrụ ịnwe.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịtụgharị ya, “mgbe o nweghị nwa.” Nhazi okwu Grik ahụ nwere ike igosi oge, ọ bụ ezie na ihe gbara ya gburugburu na-akwado echiche nke “ọ bụ ezie na o nweghị nwa.”
    reason: alternative_reading
lexical_decisions:
- source_word: κληρονομίαν
  choice: ihe nketa
  rationale: “Ihe nketa” na-echekwa echiche iwu na ọgbụgba ndụ nke oke ala mmadụ na-enweta dị ka nketa.
- source_word: οὐδὲ βῆμα ποδός
  choice: ọbụnadị ala nta ebe ọ ga-azọ otu ụkwụ
  rationale: Nke a na-egosipụta akpaalaokwu Grik nke pụtara ọbụna ibé ala kacha nta, ma na-edobe onyinyo ụkwụ dị n’okwu mbụ.
- source_word: ἐπηγγείλατο
  choice: o kwere nkwa
  rationale: Nke a bụ ụzọ Igbo doro anya ma kwekọọ n’okwu Grik nke na-egosi nkwa siri ike.
- source_word: εἰς κατάσχεσιν
  choice: ka ọ bụrụ ihe onwunwe ya
  rationale: Ọ na-egosi na a ga-enye ya ala ahụ ka o nwee ya n’ezie.
- source_word: σπέρματι αὐτοῦ
  choice: ụmụ ya
  rationale: N’ebe a, okwu Grik bụ otu n’ụdị mana ọ na-arụ ọrụ dị ka mkpokọta; “ụmụ ya” na-egosi ndị sitere n’aka Abraham n’asụsụ Igbo dị mfe ma dị ndụ.
- source_word: μετ’ αὐτόν
  choice: ndị ga-esochi ya
  rationale: Nke a na-egosi usoro ndị sitere n’aka ya ga-abịa mgbe ya gasịrị, n’ebughị ụzọ kọwaa ya dị ka naanị mgbe ọ nwụsịrị.
- source_word: οὐκ ὄντος αὐτῷ τέκνου
  choice: ọ bụ ezie na o nweghị nwa ọbụla n’oge ahụ
  rationale: 'Nke a na-eweta ike nkwenye megidere ọnọdụ ahụ: e nyere nkwa ahụ mgbe Abraham ka na-enweghị nwa.'
theological_decisions:
- issue: Ụdị njikọ dị n’etiti nkwa ahụ na enweghị nwa Abraham
  choice: ọ bụ ezie na o nweghị nwa ọbụla n’oge ahụ
  alternative: mgbe o nweghị nwa ọbụla
  rationale: 'Genitive absolute ahụ nwere ike igosi oge naanị, ma ihe gbara ya gburugburu na-eme ka echiche nkwenye megidere ọnọdụ pụta ìhè: Chineke kwere nkwa ahụ n’agbanyeghị na Abraham enweghị nwa mgbe ahụ. Ihe odide ala peeji na-echekwa ntụgharị nke na-elekwasị anya n’oge.'
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị ugwu ma dị mfe nghọta. A họọrọ “ihe nketa” iji chekwaa ụda ọgbụgba ndụ; a zere “mkpụrụ” maka σπέρμα n’ihi na ọ nwere ike ịdị ka ntụgharị nkịtị na-adịghị eke n’Igbo ebe a. Akara ihe odide ala peeji [a] na [b] dị n’ederede isi.
