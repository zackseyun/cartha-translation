  text: οὗτος κατασοφισάμενος τὸ γένος ἡμῶν ἐκάκωσεν τοὺς ⸀πατέρας τοῦ ποιεῖν ⸂τὰ βρέφη ἔκθετα⸃ αὐτῶν εἰς τὸ μὴ ζῳογονεῖσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/019.yaml
  text: This man[a], having dealt shrewdly with our people, mistreated our fathers[c][b], causing their infants to be exposed so that they would not be kept alive.
translation:
  language: ig
  text: Nwoke a[a] ji aghụghọ mesoro ndị anyị, mesoro ndị nna nna anyị[c] ihe ọjọọ, mee ka a hapụ ụmụ ọhụrụ ha[b] n’èzí ka a ghara idebe ha ndụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “Nwoke a mesoro ndị anyị n’ụzọ aghụghọ.” Okwu Grik ahụ na-emesi omume aghụghọ ma ọ bụ atụmatụ ọjọọ ike.
    reason: lexical_alternative
  - marker: b
    text: Ya bụ, ịhapụ ụmụ ọhụrụ n’èzí n’enweghị onye ga-elekọta ha, nke a na-eme ka ha nwụọ.
    reason: cultural_note
  - marker: c
    text: “Ndị nna nna anyị” bụ ndị nna ochie nke ndị Izrel.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτος
  choice: Nwoke a
  rationale: Ọ na-ezo aka n’otu eze a kpọtụrụ aha n’amaokwu bu ụzọ ma na-echekwa ike ngosipụta nke οὗτος.
- source_word: κατασοφισάμενος
  choice: ji aghụghọ mesoo
  rationale: Nke a na-egosi omume e ji amamihe ọjọọ ma ọ bụ aghụghọ mee megide ndị Izrel, n’asụsụ Igbo doro anya.
- source_word: τὸ γένος ἡμῶν
  choice: ndị anyị
  rationale: N’ebe a γένος pụtara ndị Izrel dịka otu agbụrụ; ‘ndị anyị’ bụ okwu Igbo dị mfe ma kwekọọ n’ọnọdụ ahụ.
- source_word: ἐκάκωσεν
  choice: mekpaa
  rationale: Ngwaa a na-egosi imerụ mmadụ ahụ ma ọ bụ imeso ya ihe ọjọọ; ‘mekpaa’ na-enye echiche ahụ nkenke.
- source_word: τοὺς πατέρας
  choice: ndị nna nna anyị
  rationale: Ọ na-ezo aka n’ọgbọ ndị Izrel gara aga. ‘Ndị nna nna anyị’ na-ada n'ụzọ ebumpụta ụwa karịa ntụgharị nkịtị ‘ndị nna anyị’ n’ọnọdụ a.
- source_word: τοῦ ποιεῖν
  choice: mee ka
  rationale: Articular infinitive ahụ nwere ike igosi ụzọ e si mekpa ha ahụ ma ọ bụ ihe si na ya pụta. ‘Mee ka’ anaghị etinye echiche mmanye siri ike nke ederede ekwughị kpọmkwem.
- source_word: τὰ βρέφη
  choice: ụmụ ọhụrụ ha
  rationale: βρέφη bụ ụmụaka ka dị nnọọ nta, ọkachasị ụmụ amụrụ ọhụrụ; okwu a ziri ezi ma doo ndị na-agụ anya.
- source_word: ἔκθετα
  choice: a tụpụ
  rationale: N’ọnọdụ akụkọ a, ọ pụtara ịhapụ ụmụ ọhụrụ n’èzí ka ha nwụọ. ‘A tụpụ’ bụ okwu Igbo a na-aghọta ngwa ngwa, ebe nkọwa ala peeji na-akọwa omenala ahụ.
- source_word: εἰς τὸ μὴ ζῳογονεῖσθαι
  choice: ka a ghara idebe ha ndụ
  rationale: Nke a na-echekwa echiche nzube ma ọ bụ ihe si na omume ahụ pụta, tinyere ọdịdị passive nke ζῳογονεῖσθαι.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo Izugbe dị ugbu a, dị ùgwù ma dị mfe nghọta. E debere ‘ndị nna nna anyị’ iji gosi ndị nna ochie n’enweghị mgbagwoju anya; a hapụrụ njikọ nzube/nhụta dị na εἰς τό ka ọ ghara idozi ihe Grik hapụrụ ntakịrị ghe oghe.
