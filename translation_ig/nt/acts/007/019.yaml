revisions:
- from: Nwoke a[a] ji aghụghọ mesoo ndị anyị, mekpaa ndị nna nna anyị[c] ahụ, mee ka a tụpụ ụmụ ọhụrụ ha[b], ka a ghara idebe ha ndụ.
  to: Nwoke a[a] ji aghụghọ mesoro ndị anyị, mesoro ndị nna nna anyị[c] ihe ọjọọ, mee ka a hapụ ụmụ ọhụrụ ha[b] n’èzí ka a ghara idebe ha ndụ.
  rationale: The revision supplies the essential exposure sense of ἔκθετα and improves the idiomatic rendering of ἐκάκωσεν. It preserves the source’s demonstrative reference, the adverbial nuance of κατασοφισάμενος, the people/ancestors terminology, and the purpose/result ambiguity in εἰς τὸ μὴ ζῳογονεῖσθαι.
