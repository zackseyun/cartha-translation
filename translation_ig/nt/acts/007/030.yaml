  text: Καὶ πληρωθέντων ἐτῶν τεσσεράκοντα ὤφθη αὐτῷ ἐν τῇ ἐρήμῳ τοῦ ὄρους Σινᾶ ⸀ἄγγελος ἐν φλογὶ πυρὸς βάτου·
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/030.yaml
  text: And after forty years had passed[a], an angel appeared to him in the wilderness of Mount Sinai[c][b], in a flame of fire from a bush.
translation:
  language: ig
  text: Mgbe afọ iri anọ zuru[a], otu mmụọ ozi pụtara ìhè n’ebe ọ nọ, n’ọzara nke Ugwu Saịnaị[c], n’ire ọkụ n’otu ọhịa nta[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, ‘Mgbe e mezuru afọ iri anọ.’
    reason: lexical_alternative
  - marker: b
    text: N’okwu nkịtị, ‘n’ire ọkụ nke ọhịa nta’; ya bụ, ire ọkụ ahụ nwere njikọ na ọhịa nta, dịka e kwuru na Ọpụpụ 3:2.
    reason: cross_reference
  - marker: c
    text: Ụfọdụ ndị nkọwa na-ejikọta nke a na ‘mmụọ ozi Onyenwe anyị’ dị na Ọpụpụ 3:2, ma n’ebe a Ọrụ Ndị Ozi kwuru naanị ‘otu mmụọ ozi.’
    reason: alternative_reading
lexical_decisions:
- source_word: πληρωθέντων ἐτῶν τεσσεράκοντα
  choice: Mgbe afọ iri anọ zuru
  rationale: Nkebi a na-egosi oge; ‘afọ iri anọ zuru’ na-echekwa echiche nke πληρόω ma bụrụkwa okwu Igbo dị mfe ma kwekọọ n’usoro asụsụ.
- source_word: ὤφθη αὐτῷ
  choice: pụtara n’ihu ya
  rationale: ὤφθη na-arụ ọrụ ebe a dịka okwu ngosipụta nke onye si n’ụwa mmụọ pụta ìhè; ‘pụtara n’ihu ya’ bụ Igbo eke karịa ntụgharị nkịtị dịka ‘a hụrụ ya.’
- source_word: ἐν τῇ ἐρήμῳ τοῦ ὄρους Σινᾶ
  choice: n’ọzara Ugwu Saịnaị
  rationale: ‘Ọzara’ na-egosi ebe mmadụ na-ebighị nke ọma ma dabara na ọnọdụ akụkọ Ọpụpụ; ‘Ugwu Saịnaị’ bụ usoro aha ebe dị mma n’Igbo.
- source_word: ἄγγελος
  choice: otu mmụọ ozi
  rationale: N’ọnọdụ a, okwu ahụ na-ezo aka n’onye ozi nke eluigwe, ọ bụghị onye ozi mmadụ; ‘otu’ na-egosipụta na Grik ekwughị ‘mmụọ ozi ahụ’ ma ọ bụ ‘mmụọ ozi Onyenwe anyị.’
- source_word: ἐν φλογὶ πυρὸς βάτου
  choice: n’ire ọkụ nke si n’otu ọhịa nta
  rationale: ‘Ire ọkụ’ na-ebuga φλόξ n’Igbo eke, ebe ‘nke si n’otu ọhịa nta’ na-akọwa njikọ genitive a chịkọtara ọnụ n’ụzọ dabara n’ọnọdụ osisi na-ere ọkụ.
theological_decisions:
- issue: Onye mmụọ ozi ahụ bụ n’ọnọdụ ngosipụta Chineke
  choice: otu mmụọ ozi
  alternative: mmụọ ozi Onyenwe anyị
  rationale: Amaokwu Grik a kwuru naanị ἄγγελος, ọ bụghị ‘mmụọ ozi Onyenwe anyị.’ Ya mere, ederede bụ isi anaghị etinye njirimara sara mbara sitere n’Ọpụpụ 3:2 ma ọ bụ n’ụzọ ndị nkọwa si aghọta ya.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. ‘Mgbe afọ iri anọ zuru’ bụ okwu eke ma na-echekwa ịdị nso n’usoro Grik. E debere ‘otu mmụọ ozi’ iji ghara itinye nkọwa okpukpe nke ederede a ekwughị kpọmkwem.
