id: ACT.7.17
reference: Acts 7:17
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Καθὼς δὲ ἤγγιζεν ὁ χρόνος τῆς ἐπαγγελίας ἧς ⸀ὡμολόγησεν ὁ θεὸς τῷ Ἀβραάμ, ηὔξησεν ὁ λαὸς καὶ ἐπληθύνθη ἐν Αἰγύπτῳ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/017.yaml
  text: But as the time of the promise that God had made to Abraham was drawing near[a], the people increased and multiplied in Egypt,
translation:
  language: ig
  text: Ma ka oge nkwa ahụ Chineke kwere Ebreham na-eru nso,[a] ndị mmadụ ahụ mụbara, baakwa ụba n'Ijipt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ịsụgharị ya: “nkwa ahụ Chineke kwupụtara nye Ebreham” ma ọ bụ “nkwa ahụ Chineke pledịrị Ebreham.” Ngwaa Grik a nwere ike igosi nkwa ma ọ bụ nkwa e kwupụtara n''ụzọ siri ike.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καθὼς δὲ
  choice: Ma mgbe
  rationale: “Mgbe” na-egosi ọnọdụ oge nke καθώς, ebe “Ma” na-egosi ntakịrị mgbanwe n'usoro akụkọ nke δέ n'enweghị ime ka ọ bụrụ nnukwu mmegide.
- source_word: ἤγγιζεν
  choice: na-eru nso
  rationale: Ụdị imperfect na-egosi ihe nọ na-aga n'ihu; “na-eru nso” na-enye echiche ahụ n'Igbo dị ugbu a.
- source_word: ὁ χρόνος τῆς ἐπαγγελίας
  choice: oge mmezu nke nkwa ahụ
  rationale: N'Igbo, “oge nke nkwa” nwere ike ịdị mgbagwoju anya; itinye “mmezu” na-eme ka mmekọrịta genitive ahụ doo anya n'okwu a, ya bụ oge nkwa ahụ ga-emezu, n'ebughị ihe ọhụrụ n'echiche ahụ.
- source_word: ἧς ὡμολόγησεν ὁ θεὸς τῷ Ἀβραάμ
  choice: Chineke kwere Ebreham
  rationale: N'okwu banyere ἐπαγγελία, ὁμολογέω na-egosi nkwupụta ma ọ bụ nkwa siri ike. “Chineke kwere Ebreham” bụ ụzọ Igbo nkịtị si ekwu na Chineke nyere ya nkwa, ma ọ naghị etinye echiche iyi iyi nke okwu Grik ahụ na-ekwughị kpọmkwem.
- source_word: ηὔξησεν ὁ λαὸς καὶ ἐπληθύνθη
  choice: ndị Izrel mụbara, baakwa ụba
  rationale: λαός n'ebe a bụ ndị Izrel dịka otu ndị. Ngwaa abụọ ahụ yiri ibe ha ma na-emesi mmụba ike; “mụbara, baakwa ụba” na-echekwa ha abụọ n'Igbo eke.
- source_word: ἐν Αἰγύπτῳ
  choice: n'Ijipt
  rationale: Nke a bụ nkebiokwu ebe; “Ijipt” bụ aha obodo ahụ a na-ejikarị eme ihe n'Igbo.
theological_decisions:
- issue: Ihe ὡμολόγησεν pụtara n'ihe gbasara nkwa Chineke nyere Ebreham
  choice: “Chineke kwere Ebreham”
  alternative: “Chineke kwupụtara nye Ebreham” ma ọ bụ “Chineke gbara Ebreham ndụ”
  rationale: Nhọrọ a na-egosi nkwa Chineke n'ụzọ doro anya ma dị eke n'Igbo. Ọ naghị eme ka okwu ahụ bụrụ iyi iyi, ebe ngwaa Grik abụghị okwu pụrụ iche maka ịṅụ iyi.
- issue: Ihe “oge nke nkwa” na-ezo aka na ya
  choice: “oge mmezu nke nkwa ahụ”
  alternative: “oge nke nkwa ahụ”
  rationale: N'ọnọdụ akụkọ a, oge ahụ bụ oge nkwa ahụ na-eru ná mmezu. “Mmezu” na-akọwa mmekọrịta okwu ndị ahụ n'Igbo ma ọ naghị akọwa kpọmkwem otú nkwa ahụ ga-esi mezuo.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị ugbu a ma nwee ugwu. E ji “ndị Izrel” mee ka onye “ndị ahụ” na-ezo aka na ya doo onye na-agụ akwụkwọ anya n'usoro akụkọ, ebe larịị λαός na-ezo aka n'Izrel.
