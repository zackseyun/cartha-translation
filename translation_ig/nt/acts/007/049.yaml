id: ACT.7.49
reference: Acts 7:49
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ὁ οὐρανός μοι θρόνος, ⸂ἡ δὲ⸃ γῆ ὑποπόδιον τῶν ποδῶν μου· ποῖον οἶκον οἰκοδομήσετέ μοι, λέγει κύριος, ἢ τίς τόπος τῆς καταπαύσεώς μου;
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/049.yaml
  text: Heaven is my throne[a], and the earth is the footstool for my feet. What kind of house will you build for me, says the Lord, or what is the place of my rest?
translation:
  language: ig
  text: Eluigwe bụ ocheeze m, ụwa bụkwa ihe mgbakwasị ụkwụ m. Ụlọ ụdị dị aṅaa ka unu ga-ewuru m, ka Onyenweanyị kwuru, ma ọ bụ ebe dị aṅaa ga-abụ ebe izu ike m?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐρανός
  choice: Eluigwe
  rationale: N'okwu a e hotara n'Aịzaya, ọ na-ezo aka n'eluigwe n'ụzọ sara mbara, nke e tinyere n'akụkụ ụwa, ọ bụghị naanị mbara igwe a na-ahụ anya.
- source_word: θρόνος
  choice: ocheeze
  rationale: Nke a bụ okwu Igbo doro anya maka oche ọchịchị eze ma na-echekwa ihe atụ nke ọchịchị Chineke.
- source_word: γῆ
  choice: ụwa
  rationale: E jikọtara ya na eluigwe, ya mere ọ pụtara ụwa dum, ọ bụghị naanị ala ma ọ bụ otu obodo.
- source_word: ὑποπόδιον τῶν ποδῶν μου
  choice: ihe mgbakwasị ụkwụ m
  rationale: Nke a bụ ụzọ Igbo dị mma ma doo anya isi chekwaa ihe oyiyi nke ihe a na-edebe ụkwụ n'elu; 'ụkwụ m' na-egosikwa genitive Grik ahụ n'ụzọ ebumpụta ụwa.
- source_word: ποῖον
  choice: Ụdị ... dị aṅaa
  rationale: Ọ na-ajụ ụdị ma ọ bụ àgwà ụlọ ahụ, ọ bụghị nanị ụlọ nke bụ́ nke a na-ekwu maka ya.
- source_word: οἶκον
  choice: ụlọ
  rationale: A hapụrụ okwu ahụ dịka 'ụlọ' kama ịkọwa ya ozugbo dịka ụlọnsọ, ka okwu e hotara nọgide nwee obosara ya.
- source_word: οἰκοδομήσετέ
  choice: unu ga-ewuru
  rationale: Ọ na-egosipụta future indicative na ajụjụ nkwugharị ahụ, ma na-egosikwa na a ga-ewuru Chineke ụlọ ahụ.
- source_word: κύριος
  choice: Onyenwe anyị
  rationale: Nke a bụ okwu Igbo a na-ejikarị asụgharị κύριος mgbe ọ bụ aha nsọpụrụ Chineke n'okwu Agba Ọhụrụ.
- source_word: τόπος
  choice: ebe
  rationale: Ọ bụ okwu Igbo nkịtị ma ziri ezi maka ebe ma ọ bụ ọnọdụ.
- source_word: καταπαύσεώς
  choice: izu ike
  rationale: Ọ na-echekwa echiche nke izu ike Chineke na nhazi 'ebe izu ike m' n'ụzọ dị mfe ma dị nso na Grik.
theological_decisions:
- issue: Nsụgharị κύριος n'okwu Aịzaya ebe Chineke Izrel bụ onye na-ekwu okwu
  choice: Onyenwe anyị
  alternative: Yahweh / ONYENWE ANYỊ
  rationale: Ebe isi mmalite Agba Ọhụrụ ji κύριος, a sụgharịrị okwu Grik ahụ dịka 'Onyenwe anyị' kama iweghachite Tetragrammaton ma ọ bụ jiri mkpụrụedemede ukwu mee ọdịiche na-adịghị na Grik.
- issue: Ụlọ ahụ ọ̀ ga-abụrịrị ụlọnsọ?
  choice: ụlọ
  alternative: ụlọnsọ
  rationale: Ọnọdụ okwu ahụ metụtara ụlọnsọ, ma Grik ji οἶκος, 'ụlọ.' Ide 'ụlọ' na-echekwa okwu na esemokwu nkwupụta ahụ n'ebughị nkọwa ọnọdụ ya banye n'ime amaokwu.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. E debere usoro uri na ajụjụ nkwugharị nke okwu e hotara. Enweghị akara nkọwa ala peeji n'ihi na ọ dịghị lexical alternative dị mkpa nke ederede bụ isi na-enweghị ike ibu.
