review_pass:
  verdict: revise
  source_fidelity: The verse accurately preserves the cosmic contrast, royal metaphor, rhetorical questions, future verb, and the non-specific term “house.” The final question is better rendered as a question about what place may be God’s resting place, rather than simply asking where it is.
  naturalness: “Ụlọ ụdị dị aṅaa” is a more natural Standard Igbo ordering than “Ụdị ụlọ dị aṅaa.” “Ebe dị aṅaa ga-abụ ebe izu ike m?” also gives the rhetorical parallel a smoother, more precise Igbo form.
  terminology: Eluigwe, ocheeze, ụwa, ụlọ, and Onyenweanyị are appropriate in this elevated biblical register. “Ihe mgbakwasị ụkwụ m” is an intelligible and idiomatic rendering of “the footstool of my feet.”
  issues:
  - severity: low
    issue: Word order in the first rhetorical question
    rationale: “Ụdị ụlọ dị aṅaa” is understandable, but “Ụlọ ụdị dị aṅaa” is the more usual and fluent Standard Igbo way to ask “What kind of house?”
  - severity: low
    issue: Force of τίς τόπος in the second question
    rationale: “Olee ebe izu ike m dị?” can sound principally like a request for the location of an already identified resting place. “Ebe dị aṅaa ga-abụ ebe izu ike m?” retains the rhetorical question concerning what place could serve as that rest.
  revised_text: Eluigwe bụ ocheeze m, ụwa bụkwa ihe mgbakwasị ụkwụ m. Ụlọ ụdị dị aṅaa ka unu ga-ewuru m, ka Onyenweanyị kwuru, ma ọ bụ ebe dị aṅaa ga-abụ ebe izu ike m?
