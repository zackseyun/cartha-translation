  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀκούσας δὲ Ἰακὼβ ὄντα ⸂σιτία εἰς Αἴγυπτον⸃ ἐξαπέστειλεν τοὺς πατέρας ἡμῶν πρῶτον·
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/012.yaml
  text: But when Jacob heard that there was grain in Egypt[a], he sent out our fathers the first time.
translation:
  language: ig
  text: Ma mgbe Jekọb nụrụ na e nwere ọka n’Ijipt[a], o zipụrụ ndị nna anyị na nke mbụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịtụgharị ya, “ihe oriri dị n’Ijipt.” Okwu Grik bú σιτία nwere ike ịpụta ihe oriri e kwakọbara n’ozuzu ya, ma n’akụkọ a, o yikarịrị ka ọ na-ekwu maka ọka.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσας
  choice: mgbe ... nụrụ
  rationale: Ọ bụ participle aorist nke na-egosi oge ihe mere; “mgbe ... nụrụ” bụ ụzọ Igbo dị mfe ma doo anya isi gosi usoro ihe ndị ahụ.
- source_word: δὲ
  choice: Ma
  rationale: Ọ na-egosi ntakịrị mgbanwe n’akụkọ Stivin; “Ma” na-edobe mmegharị ahụ n’emeghị ka esemokwu ya sie ike karịa otú Grik si kwuo ya.
- source_word: ὄντα σιτία εἰς Αἴγυπτον
  choice: na e nwere ọka n’Ijipt
  rationale: E tinyere usoro accusative na participle nke na-eso ἀκούω n’ụdị okwu Igbo e ji akọ ihe mmadụ nụrụ. N’akụkọ ụnwụ Josef, “ọka” dabara nke ọma karịa okwu sara mbara maka ihe oriri.
- source_word: σιτία
  choice: ọka
  rationale: Okwu a nwere ike ịpụta ọka ma ọ bụ ihe oriri e kwakọbara. N’ọnọdụ akụkọ Josef na ụnwụ ahụ, ọka bụ ihe a na-ekwu maka ya n’ụzọ kachasị kwekọọ n’ihe gbara amaokwu ahụ gburugburu.
- source_word: ἐξαπέστειλεν
  choice: o zipụrụ ... gaa ebe ahụ
  rationale: “Zipụrụ” na-egosi iziga mmadụ n’ọrụ ma ọ bụ njem; “gaa ebe ahụ” na-eme ka njem ahụ gaa Ijipt pụta ìhè n’Igbo n’enweghị mgbanwe n’echiche.
- source_word: τοὺς πατέρας ἡμῶν
  choice: ndị nna anyị
  rationale: Nke a na-edobe okwu ezinụlọ nke Grik ma na-ezo kpọmkwem aka n’ụmụ nwoke Jekọb bú ndị nna Izrel oge ochie, kama ime ya ka ọ bụrụ okwu sara mbara maka ndị nna nna niile.
- source_word: πρῶτον
  choice: na nke mbụ
  rationale: Ọ na-egosi na nke a bụ njem mbụ tupu njem nke abụọ e mesịrị; okwu Igbo a doro anya ma bụrụ nke e ji eme ihe ugbu a.
theological_decisions:
- issue: Nsụgharị τοὺς πατέρας ἡμῶν
  choice: ndị nna anyị
  alternative: ndị nna nna anyị; ndị bu anyị ụzọ
  rationale: A hapụrụ okwu nwoke na nke ezinụlọ dịka ọ dị na Grik, n’ihi na ebe a ọ na-ezo aka kpọmkwem n’ụmụ nwoke Jekọb, ọ bụghị n’ụmụ nna nna niile n’ozuzu.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị mfe ma dị ùgwù mee ihe. Ahịrịokwu ahụ na-edobe usoro akụkọ Grik, ma na-agbakwụnye “gaa ebe ahụ” dịka ihe Igbo chọrọ iji mee ka ebe e zigara ha doo anya. Akara nkọwa ala [a] dị n’ederede isi.
