id: ACT.7.37
reference: Acts 7:37
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οὗτός ἐστιν ὁ Μωϋσῆς ὁ ⸀εἴπας τοῖς υἱοῖς Ἰσραήλ· Προφήτην ὑμῖν ἀναστήσει ⸂ὁ θεὸς⸃ ἐκ τῶν ἀδελφῶν ὑμῶν ὡς ἐμέ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/037.yaml
  text: This is the Moses who said to the sons of Israel[a], ‘God will raise up for you a prophet from among your brothers[c][b], like me.’
translation:
  language: ig
  text: Onye a bụ Mozis ahụ, onye gwara ụmụ Izrel[a], sị, “Chineke ga-eme ka otu onye amụma[b] bilie maka unu site n’etiti ụmụnne unu[c], onye dị ka m.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’asụsụ Grik, okwu a bụ kpọmkwem “ụmụ ndị ikom Izrel”; a pụkwara ịsụ ya “ndị Izrel.”
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịghọta ya n’ụzọ nkọwa dị ka “Onye Amụma ahụ,” n’ihi amụma a maara nke ọma dị na Diuterọnọmi 18:15 na otu Ọrụ Ndị Ozi si jikọta ya na Jizọs.
    reason: alternative_reading
  - marker: c
    text: “Ụmụnne unu” n’ebe a pụtara ndị Izrel ibe unu; okwu Grik ahụ dị n’ụdị ọtụtụ nke nwoke.
    reason: cultural_note
lexical_decisions:
- source_word: οὗτός ἐστιν ὁ Μωϋσῆς
  choice: Onye a bụ Mozis ahụ
  rationale: “Onye a” na “ahụ” jikọrọ aka mee ka nrụtụ aka ahụ sie ike, ma nọgide bụrụ Igbo dị eke karịa ntụgharị nke ga-asị “Mozis ahụ bụ onye a.”
- source_word: εἴπας
  choice: gwara ... sị
  rationale: Nke a na-atụgharị participle a dị ka nkebiokwu mmekọrịta n’ụzọ Igbo si ewebata okwu mmadụ kwuru.
- source_word: τοῖς υἱοῖς Ἰσραήλ
  choice: ụmụ Izrel
  rationale: Nke a bụ okwu Igbo doro anya maka ụmụ/ndị Izrel, ma ndetu ala na-egosi na okwu Grik ahụ pụtara kpọmkwem “ụmụ ndị ikom.”
- source_word: Προφήτην
  choice: otu onye amụma
  rationale: “Otu” na-egosi na aha ahụ enweghị article n’ebe a, n’ebughị ụzọ kpebie na ọ ga-abụ aha pụrụ iche “Onye Amụma ahụ.”
- source_word: ἀναστήσει
  choice: ga-eme ka ... bilie
  rationale: Nke a na-echekwa ihe oyiyi nke ime ka mmadụ bilie ma ọ bụ pụta, kama ịkọwa ya naanị dị ka “ịhọpụta.”
- source_word: ὁ θεὸς
  choice: Chineke
  rationale: Nke a bụ aha Igbo nkịtị na nke kwesịrị ekwesị maka θεός n’ebe a.
- source_word: ἐκ τῶν ἀδελφῶν ὑμῶν
  choice: site n’etiti ụmụnne unu
  rationale: “Site n’etiti” na-echekwa echiche ἐκ nke ịbụ onye si n’ime otu ahụ; “ụmụnne unu” na-echekwa okwu ezinụlọ e ji akọwa ndị Izrel ibe ha.
- source_word: ὡς ἐμέ
  choice: onye dị ka m
  rationale: Nke a na-egosipụta ntụnyere ahụ nke ọma n’Igbo ma mee ka o doo anya na ọ bụ onye amụma ahụ ka a na-atụnyere Mozis.
theological_decisions:
- issue: Amụma dị na Diuterọnọmi 18:15 na ntụnyere ya na Jizọs
  choice: otu onye amụma
  alternative: Onye Amụma ahụ
  rationale: Προφήτην enweghị article n’okwu Grik a. Ọnọdụ ya n’Ọrụ Ndị Ozi nwere mkpa gbasara Kraịst, ma isiokwu ahụ ekwesịghị ịmanye nkọwa ahụ site n’itinye mkpụrụedemede ukwu ma ọ bụ article pụrụ iche n’ahịrị bụ isi.
- issue: Ihe ἀναστήσει pụtara n’ebe a
  choice: ga-eme ka ... bilie
  alternative: ga-ahọpụta
  rationale: '“Mee ka ... bilie” na-echekwa obosara okwu Grik ahụ: Chineke ga-eme ka onye amụma ahụ pụta ma guzoro maka ọrụ ya. Ọ naghị amanye echiche mbilite n’ọnwụ, ma ọ naghịkwa belata ya ka ọ bụrụ naanị nhọpụta ọchịchị.'
translation_notes:
  register: E ji Igbo ọkọlọtọ nke oge a, dị ùgwù ma dị mfe nghọta. “Onye a bụ Mozis ahụ” na-echekwa nrụsi ike nke ahịrị Grik; “gwara ... sị” bụ usoro Igbo dị eke maka iwebata okwu e hotara. E debere okwu ezinụlọ “ụmụnne” iji chekwaa njikọ agbụrụ dị n’isi mmalite.
