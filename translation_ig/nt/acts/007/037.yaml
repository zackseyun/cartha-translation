revisions:
- from: Onye a bụ Mozis ahụ gwara ụmụ Izrel[a], sị, “Chineke ga-eme ka otu onye amụma[b] bilie maka unu site n’etiti ụmụnne unu[c], onye dị ka m.”
  to: Onye a bụ Mozis ahụ, onye gwara ụmụ Izrel[a], sị, “Chineke ga-eme ka otu onye amụma[b] bilie maka unu site n’etiti ụmụnne unu[c], onye dị ka m.”
  rationale: The revision only adds the Igbo relative marker “onye” and punctuation after “Mozis ahụ.” This resolves the structural ambiguity while retaining the source’s emphasis, wording, ambiguity concerning the prophet’s identity, and all existing footnote anchors and content.
