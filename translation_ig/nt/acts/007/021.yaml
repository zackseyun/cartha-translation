  text: ⸂ἐκτεθέντος δὲ αὐτοῦ ἀνείλατο αὐτὸν⸃ ἡ θυγάτηρ Φαραὼ καὶ ἀνεθρέψατο αὐτὸν ἑαυτῇ εἰς υἱόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/021.yaml
  text: But when he had been exposed[b][a], Pharaoh’s daughter took him up and raised him as her own son.
translation:
  language: ig
  text: Ma mgbe a hapụsịrị ya n’èzí[a], ada Fero bulitere ya[b] ma zụlite ya dịka nwa ya nwoke.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “mgbe e debere ya n’èzí.”
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsị, “weere ya.” N’ebe a, okwu Grik ahụ nwere ike ịpụta ibuli nwa a hapụrụ n’èzí.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκτεθέντος
  choice: mgbe a hapụsịrị ya n’èzí
  rationale: Nke a na-egosi na e wepụtara nwa ahụ hapụ ya n’èzí, ma ọ naghị ekwusi ike na ebumnuche bụ ịgbahapụ ya kpamkpam.
- source_word: δὲ
  choice: Ma
  rationale: Ọ na-egosi ntụgharị na ọdịiche dị n’etiti ịhapụ Mosis n’èzí na nnapụta ya.
- source_word: ἀνείλατο
  choice: kpọlitere ya
  rationale: N’ọnọdụ a, ngwaa ahụ pụtara ibuli ma kpọrọ nwa a hapụrụ n’èzí; ọ naghị ebute echiche nke ịbụ nwa ya, nke e kwuru iche n’ikpeazụ.
- source_word: θυγάτηρ Φαραὼ
  choice: ada Fero
  rationale: Nke a bụ ụzọ Igbo dị nkenke ma bụrụkwa ihe a na-asụkarị iji gosi nwa nwanyị Fero.
- source_word: ἀνεθρέψατο
  choice: zụlitekwaa ya
  rationale: Ọ na-egosi ilekọta nwa ma zụọ ya ruo mgbe o toro.
- source_word: ἑαυτῇ εἰς υἱόν
  choice: ka ọ bụrụ nwa ya
  rationale: 'Nke a na-egosi ihe si na nzụlite ahụ pụta: ọ zụlitere ya n’ọnọdụ nwa nke ya, ma ọ bụghị naanị ilekọta ya.'
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo nke dị mfe, dị ugwu, ma bụrụ nke ndị na-agụ akwụkwọ taa ga-aghọta. E kewapụrụ omume ịkpọlite nwa ahụ na nzụlite ya dị ka nwa, dịka usoro okwu Grik si dị.
