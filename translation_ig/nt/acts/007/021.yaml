revisions:
- from: Ma mgbe a hapụsịrị ya n’èzí[a], ada Fero kpọlitere ya[b], zụlitekwaa ya ka ọ bụrụ nwa ya.
  to: Ma mgbe a hapụsịrị ya n’èzí[a], ada Fero bulitere ya[b] ma zụlite ya dịka nwa ya nwoke.
  rationale: The revision replaces the potentially misleading kpọlitere with bulitere, which directly conveys taking up an exposed child. It also uses zụlite without unnecessary emphasis and renders εἰς υἱόν explicitly as “dịka nwa ya nwoke.” Both footnotes are rewritten for clarity and source fidelity, with the unsupported reference to calling/naming removed.
