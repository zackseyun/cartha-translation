  text: μὴ ἀνελεῖν με σὺ θέλεις ὃν τρόπον ἀνεῖλες ⸀ἐχθὲς τὸν Αἰγύπτιον;
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/028.yaml
  text: Do you want to kill me the way you killed the Egyptian yesterday?
translation:
  language: ig
  text: Ị chọghị igbu m otú i si gbuo onye Ijipt ahụ ụnyaahụ?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μὴ ... θέλεις
  choice: Ị chọrọ ...?
  rationale: Ajụjụ a, nke μὴ ji malite, na-atụ anya azịza na-adịghị mma, ma n'Igbo nkịtị ụzọ kacha doo anya bụ ajụjụ kpọmkwem ‘Ị chọrọ ...?’; ọnọdụ okwu ahụ na-egosi ụjọ na ebubo dị n'ime ya.
- source_word: ἀνελεῖν / ἀνεῖλες
  choice: igbu / i si gbuo
  rationale: N'ebe a, ἀναιρέω pụtara iwepụ ndụ, ya bụ igbu mmadụ; otu mgbọrọgwụ ahụ ka e gosipụtara n'okwu abụọ ahụ.
- source_word: ὃν τρόπον
  choice: otú ... si
  rationale: Nke a bụ usoro Igbo dị ndụ ma kwekọọ n'echiche nke ‘n'ụzọ ahụ’ ma ọ bụ ‘dị ka’.
- source_word: τὸν Αἰγύπτιον
  choice: onye Ijipt ahụ
  rationale: Akara njirimara ahụ na-ezo aka n'onye Ijipt a maara site n'ihe mere n'ụbọchị gara aga; ‘ahụ’ na-egosipụta ntụaka ahụ nke ọma.
- source_word: ἐχθές
  choice: ụnyaahụ
  rationale: 'Ọ bụ nkọwa oge kpọmkwem: ụbọchị gara aga.'
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị mfe ma nwee ugwu. E debere ya dịka ajụjụ ebubo kpọmkwem, na-enweghị ịgbakwunye nkọwa okpukpe ma ọ bụ idozi ihe ederede ahụ na-ahapụghị kpọmkwem.
