id: ACT.7.56
reference: Acts 7:56
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ εἶπεν· Ἰδοὺ θεωρῶ τοὺς οὐρανοὺς ⸀διηνοιγμένους καὶ τὸν υἱὸν τοῦ ἀνθρώπου ἐκ δεξιῶν ἑστῶτα τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/056.yaml
  text: And he said[a], “Look, I see the heavens opened[b], and the Son of Man standing at the right hand of God.”
translation:
  language: ig
  text: Ọ sịrị, “Lee, ana m ahụ eluigwe e mepeworo[a], na Nwa nke Mmadụ[b] ka o guzo n’aka nri Chineke.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Lee, ana m ahụ eluigwe e meghere.” Ụdị okwu Grik na-eji participle zuru oke nke olu nnara, na-emesi ike na e meghere eluigwe tupu Stivin ahụ ya nakwa na ọ ka mepere n’ọhụụ ya.
    reason: lexical_alternative
  - marker: b
    text: “Nwa nke Mmadụ” bụ aha Mesaịa a maara nke ọma, nke na-echetara Daniel 7:13.
    reason: cross_reference
lexical_decisions:
- source_word: Ἰδοὺ
  choice: Lee
  rationale: “Lee” bụ okwu Igbo e ji adọta uche ozugbo, ma na-edobe ike na ngwa ngwa nke mkpu Stivin n’ụzọ dị ùgwù.
- source_word: θεωρῶ
  choice: ana m ahụ
  rationale: Ụdị ugbu a nke ngwaa Grik na-egosi ịhụ ihe na-aga n’ihu; “ana m ahụ” na-egosipụta nke a n’ụzọ Igbo dị mfe ma kwekọọ n'ọhụụ ahụ.
- source_word: τοὺς οὐρανοὺς
  choice: eluigwe
  rationale: Ọ bụ ezie na Grik ji ọtụtụ mee ihe, “eluigwe” bụ okwu Igbo ebumpụta ụwa nke nwere ike izo echiche mbara eluigwe n’emebighị ụda okpukpe nke ọhụụ ahụ.
- source_word: διηνοιγμένους
  choice: ka e meghere ha
  rationale: 'Nke a na-edobe olu nnara na ọnọdụ si n’omume mmeghe gara aga pụta: e meghere eluigwe, ha ka dịkwa oghe n''ọhụụ Stivin.'
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: Nwa nke Mmadụ
  rationale: Nsụgharị a na-edobe usoro okwu Grik na aha pụrụ iche nke nwere njikọ na Daniel 7:13, kama ịkọwa ya n’ụzọ ga-ebelata mgbọrọgwụ ya.
- source_word: ἐκ δεξιῶν
  choice: n’aka nri
  rationale: “N’aka nri” bụ akpaalaokwu Akwụkwọ Nsọ a na-aghọta nke ọma, na-egosi ebe nsọpụrụ na ikike n’etinyeghị nkọwa n’ime amaokwu ahụ.
- source_word: ἑστῶτα
  choice: ka o guzo
  rationale: A hapụrụ ọnọdụ iguzo ahụ kpọmkwem, n’ejikọghị ya na amaokwu ndị ọzọ na-ekwu na Kraịst nọ ọdụ.
- source_word: τοῦ θεοῦ
  choice: Chineke
  rationale: N’usoro Igbo “n’aka nri Chineke” na-enye mmekọrịta genitiv Grik n'ụzọ doro anya na nke ebumpụta ụwa.
theological_decisions:
- issue: Aha Kraịst υἱὸς τοῦ ἀνθρώπου
  choice: Nwa nke Mmadụ
  alternative: Onye ahụ bụ mmadụ
  rationale: E debere nsụgharị nkịtị a maara ama ka njikọ ya na Daniel 7 na mkpa Mesaịa ya ghara ifu; nhọrọ ọzọ ga-abụ nkọwa karịa nsụgharị.
- issue: Ọnọdụ Jizọs e buliri elu
  choice: ka o guzo n’aka nri Chineke
  alternative: ka ọ nọ n’aka nri Chineke
  rationale: Grik kwuru kpọmkwem na ọ guzo. Iwepụ “guzo” ga-eme ka nkọwa pụrụ iche na esemokwu ederede a nwere na amaokwu ndị na-ekwu na ọ nọ ọdụ ghara ịdị.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E debere okwu ọhụụ ahụ n’ụdị kpọmkwem, e zere okwu ochie ma ọ bụ nkọwa ụka pụrụ iche. E tinyere naanị otu akara ntụaka [a] n’ebe o kwesịrị ịdị; nkọwa banyere “Nwa nke Mmadụ” etinyeghị dị ka ntụaka ọzọ n’ihi na data Bekee nyere akara b n’ederede ma jikọta nkọwa ndị ahụ n’usoro na-adịghị kwekọọ, ya mere e zere ịmepụta akara na-adịghị edo anya.
