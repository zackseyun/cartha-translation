  text: εἶπεν δὲ αὐτῷ ὁ κύριος· Λῦσον τὸ ὑπόδημα τῶν ποδῶν σου, ὁ γὰρ τόπος ⸀ἐφ’ ᾧ ἕστηκας γῆ ἁγία ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/033.yaml
  text: Then the Lord said to him[a], ‘Take off the sandals from your feet, for the place on which you are standing is holy ground.’
translation:
  language: ig
  text: Mgbe ahụ, Onyenwe anyị sịrị ya, “Yipụ akpụkpọ ụkwụ gị[a], n’ihi na ebe ị guzo bụ ala dị nsọ.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n’ụzọ nkịtị karị, “Tọpụ akpụkpọ ụkwụ ahụ n’ụkwụ gị abụọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριος
  choice: Onyenwe anyị
  rationale: Nke a bụ nsụgharị Igbo a na-ejikarị eme ihe maka aha nsọpụrụ κύριος. Ọ na-egosi nsọpụrụ Chineke n’akụkọ a ma ọ naghị etinye aha Chineke nke mkpụrụokwu Grik ahụ na-ekwughị kpọmkwem.
- source_word: Λῦσον
  choice: Yipụ
  rationale: Ọ bụ ezie na λύω pụtara n'ụzọ nkịtị ‘tọpụ’ ma ọ bụ ‘hapụ ka ọ tọpụ,’ mgbe a na-ekwu maka akpụkpọ ụkwụ, ‘yipụ’ bụ okwu Igbo ebumpụta ụwa nke na-egosi ihe iwu ahụ chọrọ.
- source_word: τὸ ὑπόδημα τῶν ποδῶν σου
  choice: akpụkpọ ụkwụ gị
  rationale: Akpụkpọ ụkwụ bụ okwu Igbo ebumpụta ụwa maka ὑπόδημα. Asụsụ Igbo anaghị egosi otu na ọtụtụ n’ụdị aha a dịka Grik si eme; ya mere nkebi a na-ada nke ọma ma ghara ịmanye ọtụtụ ebe Grik ji otu.
- source_word: ὁ γὰρ τόπος ἐφ’ ᾧ ἕστηκας
  choice: n’ihi na ebe ahụ ị kwụ
  rationale: ‘N’ihi na’ na-egosi ọrụ nkọwa nke γάρ; ‘ebe ahụ ị kwụ’ bụ ụzọ Igbo dị mfe ma zie ezi isi kwuo ebe mmadụ nọ guzo.
- source_word: γῆ ἁγία
  choice: ala dị nsọ
  rationale: N’ọnọdụ a, γῆ bụ ala a na-azọ ụkwụ, ebe ἁγία na-akọwa ya dị ka ihe e doro nsọ. ‘Ala dị nsọ’ bụ okwu Igbo doro anya ma dị ebube.
theological_decisions:
- issue: Nsụgharị κύριος n’okwu e hotara banyere mkpughe Chineke n’ọhịa na-ere ọkụ
  choice: Onyenwe anyị
  alternative: Jehova / YHWH
  rationale: Mkpụrụokwu Agba Ọhụrụ dị ebe a bụ κύριος, ọ bụghị mkpụrụedemede anọ nke aha Chineke. Ya mere ‘Onyenwe anyị’ na-agbaso ihe Grik kwuru ma na-echekwa nsọpụrụ Chineke n’enweghị itinye aha ọzọ n’amaokwu ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị mfe ma dị nsọpụrụ, dee amaokwu ahụ. ‘Yipụ akpụkpọ ụkwụ gị’ bụ okwu a na-asụkarị; ihe e dere n’ala peeji na-echekwa echiche nkịtị nke Λῦσον na otu aha ὑπόδημα.
