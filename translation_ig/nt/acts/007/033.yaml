  to: Mgbe ahụ, Onyenwe anyị sịrị ya, “Yipụ akpụkpọ ụkwụ gị[a], n’ihi na ebe ị guzo bụ ala dị nsọ.”
  rationale: The revision changes only the standing clause, replacing a potentially past-oriented form with natural present-state Igbo that corresponds to ἕστηκας. The footnote is slightly clarified to preserve both the literal ‘untie/loosen’ sense and the source’s plural ‘feet.’ No doctrinal or interpretive expansion has been introduced.
