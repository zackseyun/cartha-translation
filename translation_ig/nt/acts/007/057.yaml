revisions:
- from: Ma ha tiri mkpu n’olu dara ụda, mechie ntị ha, ha niile wee jiri otu obi[a] gbara ọsọ wakwasị ya.
  to: Ma, ha tiri mkpu n’olu dara ụda, kpuchie ntị ha, wee jiri otu obi[a] gbara ọsọ wakwasị ya.
  rationale: The revision replaces the less idiomatic expression for blocking one’s ears and corrects the lexical-alternative footnote so that it reflects the Greek emphasis on united purpose and action. No theological interpretation has been added.
