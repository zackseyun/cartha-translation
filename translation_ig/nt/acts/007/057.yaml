  text: κράξαντες δὲ φωνῇ μεγάλῃ συνέσχον τὰ ὦτα αὐτῶν, καὶ ὥρμησαν ὁμοθυμαδὸν ἐπ’ αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/057.yaml
  text: But crying out with a loud voice[a], they covered their ears and rushed together at him,
translation:
  language: ig
  text: Ma, ha tiri mkpu n’olu dara ụda, kpuchie ntị ha, wee jiri otu obi[a] gbara ọsọ wakwasị ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’otu uche.” Okwu Grik ὁμοθυμαδόν na-emesi ike na ha ji otu obi mee ihe.
    reason: lexical_alternative
lexical_decisions:
- source_word: κράξαντες
  choice: ha tiri mkpu
  rationale: Nkebi ngwaa a na-egosi iti mkpu n’olu ike. “Tiri mkpu” bụ okwu Igbo doro anya, ọ naghịkwa atụkwasị ụdị mmetụta uche Grik ahụ na-akọwaghị.
- source_word: δὲ
  choice: Ma
  rationale: δὲ na-egosi mgbanwe dị nro site n’ọhụụ Stivin gaa ná mmeghachi omume ọjọọ nke ndị ahụ; “Ma” na-egosipụta mgbanwe a nke ọma.
- source_word: φωνῇ μεγάλῃ
  choice: n’olu dara ụda
  rationale: Nke a bụ ụzọ Igbo nkịtị si akọ olu siri ike ma ọ bụ olu dị ukwuu, ma na-echekwa ihe oyiyi doro anya dị na Grik.
- source_word: συνέσχον τὰ ὦτα αὐτῶν
  choice: mechie ntị ha
  rationale: Akpaalaokwu Grik a pụtara imechi ntị ka mmadụ ghara ịnụ ihe. “Mechie ntị ha” bụ okwu Igbo dị mfe ma kwekọọ n’echiche ahụ.
- source_word: ὥρμησαν
  choice: gbara ọsọ wakwasị
  rationale: Ngwaa ahụ na-egosi ngagharị mberede na nke siri ike. “Gbara ọsọ wakwasị” na-egosi ọsọ ahụ na ebe ọ na-aga n’enweghị ịgbakwụnye nkọwa karịrị isi iyi.
- source_word: ὁμοθυμαδὸν
  choice: jiri otu obi
  rationale: Okwu a na-emesi ịdị n’otu n’ebumnobi na n’omume ike. “Jiri otu obi” na-egosipụta ịdị n’otu ahụ n’Igbo dị ugbu a.
- source_word: ἐπ’ αὐτόν
  choice: wakwasị ya
  rationale: ἐπί ya na ngwaa ngagharị na-egosi na ọsọ ha gbara chere ihu n’ebe ọ nọ. “Wakwasị ya” dabara na ọnọdụ mmegide a ma dịkwa nkenke.
