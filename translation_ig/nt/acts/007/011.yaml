source:
  edition: SBLGNT
  text: ἦλθεν δὲ λιμὸς ἐφ’ ὅλην τὴν ⸀Αἴγυπτον καὶ Χανάαν καὶ θλῖψις μεγάλη, καὶ οὐχ ηὕρισκον χορτάσματα οἱ πατέρες ἡμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/011.yaml
  text: A famine came over all Egypt and Canaan[a], and great distress, and our fathers could not find food.
translation:
  language: ig
  text: Oke ụnwụ bịara n’ala Ijipt dum na Kenan dum, nnukwu mkpagbu bịakwara, ndị nna anyị enweghịkwa ike ịchọta nri.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “ndị nna ochie anyị.” Greek kwuru “ndị nna anyị,” na-ezo aka na ndị nna ochie ndị Izrel.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθεν δὲ λιμὸς
  choice: Ụnwụ bịara
  rationale: “Ụnwụ” bụ okwu Igbo a na-ejikarị akọwa ụkọ nri zuru ebe niile; “bịara” na-echekwa ọdịdị ihe merenụ nke ἦλθεν. A naghị atụgharị δέ iche n’ebe a, n’ihi na ọ bụ njikọ akụkọ dị nro nke usoro ahịrịokwu Igbo na-eburu nke ọma.
- source_word: ἐφ’ ὅλην τὴν Αἴγυπτον καὶ Χανάαν
  choice: n’Ijipt niile na Kenan
  rationale: Nke a na-egosi na ụnwụ ahụ gbasara ógbè Ijipt dum na Kenan, n’asụsụ Igbo dị mfe ma doo anya.
- source_word: θλῖψις μεγάλη
  choice: nnukwu mkpagbu
  rationale: “Nnukwu mkpagbu” na-egosi ahụhụ na ọnọdụ siri ike nke ụnwụ kpatara, n’enweghị itinye nkọwa banyere mkpagbu nke ọgwụgwụ ụwa.
- source_word: οὐχ ηὕρισκον
  choice: enwekwaghị ike ịchọta
  rationale: Nhọrọ a na-egosi enweghị ike na-aga n’ihu n’oge nsogbu ahụ, dịka imperfect Greek si dị.
- source_word: χορτάσματα
  choice: ihe oriri
  rationale: “Ihe oriri” bụ okwu sara mbara maka nri ma ọ bụ ihe e ji azụ ndụ; ọ naghị emechi ihe ahụ naanị n’ọka ma ọ bụ nri anụmanụ.
- source_word: οἱ πατέρες ἡμῶν
  choice: ndị nna nna anyị
  rationale: Ọ na-echekwa okwu ezinụlọ nwoke nke Greek ma na-ezo aka n’ụmụ nna Izrel ndị gara aga n’ụzọ Igbo na-aghọta nke ọma.
theological_decisions:
- issue: Okwu nwoke e ji akọwa ndị nna ochie Izrel
  choice: ndị nna nna anyị
  alternative: ndị nna ochie anyị
  rationale: Greek kwuru kpọmkwem “ndị nna anyị.” “Ndị nna nna anyị” na-echekwa ihe nwoke ahụ pụtara na njikọ ya na ndị nna Izrel, ebe ndetu ala na-enye nkọwa sara mbara n’enweghị ịgbanwe isi ederede.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị ugbu a, dị ugwu ma dị mfe nghọta. E debere njikọ ahịrịokwu ahụ n’ụzọ eke n’Igbo, ma chekwaa oke ala, ịdị ukwuu nke mkpagbu, na enweghị ike na-aga n’ihu ịchọta nri.
