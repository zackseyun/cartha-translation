language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Τοῦτον τὸν Μωϋσῆν, ὃν ἠρνήσαντο εἰπόντες· Τίς σε κατέστησεν ἄρχοντα καὶ δικαστήν, τοῦτον ὁ θεὸς ⸀καὶ ἄρχοντα καὶ λυτρωτὴν ⸂ἀπέσταλκεν σὺν⸃ χειρὶ ἀγγέλου τοῦ ὀφθέντος αὐτῷ ἐν τῇ βάτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/035.yaml
  text: This Moses[a], whom they rejected, saying, ‘Who appointed you a ruler and a judge?’—this man God sent as both ruler and redeemer by the hand of the angel who appeared to him in the bush.
translation:
  language: ig
  text: “Mosis a, onye ha jụrụ, na-asị, ‘Ònye họpụtara gị ka ị bụrụ onye ọchịchị na onye ikpe?’—ọ bụ Mosis a ka Chineke zitere ka ọ bụrụ ma onye ọchịchị ma onye mgbapụta[a], site n’aka mmụọ ozi ahụ nke pụtara n’ihu ya n’osisi ogwu ahụ.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “onye nnapụta.” Okwu Grik ahụ na-ezo aka n’onye na-eweta ntọhapụ ma ọ bụ mgbapụta.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠρνήσαντο
  choice: ha jụrụ ajụ
  rationale: N’ebe a, okwu ahụ na-egosi na ha jụrụ Mosis na ikike ya kpamkpam; ‘jụrụ ajụ’ na-egosipụta nkwusiri ike ahụ n’Igbo nkịtị.
- source_word: κατέστησεν
  choice: họpụtara
  rationale: Ajụjụ ahụ gbasara onye nyere Mosis ọkwa na ikike; ‘họpụtara’ dabara n’echiche nke ido mmadụ n’ọrụ ọchịchị.
- source_word: ἄρχοντα
  choice: onye ọchịchị
  rationale: 'Ọ na-akọwa onye nwere ikike ịchị, ma na-edobekwa nkwughachi dị mkpa: onye ha jụrụ dị ka onye ọchịchị bụ ya ka Chineke zigara dị ka onye ọchịchị.'
- source_word: δικαστήν
  choice: onye ikpe
  rationale: Nke a bụ okwu Igbo doro anya maka onye na-ekpe ikpe.
- source_word: λυτρωτὴν
  choice: onye mgbapụta
  rationale: Nhọrọ a na-echekwa echiche nke ịtọhapụ na mgbapụta dị n’okwu Grik, karịa okwu ga-egosi naanị inyere mmadụ aka ịpụ ná nsogbu.
- source_word: ἀπέσταλκεν
  choice: zitere
  rationale: Oge gara aga dị mfe na-ada nke ọma n’akụkọ Igbo ma na-egosi omume Chineke zuru ezu.
- source_word: σὺν χειρὶ
  choice: site n’aka
  rationale: Nke a na-echekwa akpaala okwu nke na-egosi onye e si n’aka ya mee ihe, ma na-ada nke ọma n’Igbo.
- source_word: ἀγγέλου
  choice: mmụọ ozi ahụ
  rationale: N’akụkọ banyere osisi ogwu ahụ, okwu Grik a na-ezo aka n’otu onye si n’eluigwe pụta, ya mere ‘mmụọ ozi’ bụ ntụgharị kwesịrị ekwesị.
- source_word: τοῦ ὀφθέντος αὐτῷ ἐν τῇ βάτῳ
  choice: nke pụtara n’ihu ya n’ime osisi ogwu ahụ
  rationale: ‘Pụtara n’ihu ya’ na-enye nghọta ebumpụta ụwa nke participle ahụ; ‘osisi ogwu’ na-ejigide βάτος n’etinyeghị ‘na-ere ọkụ,’ nke amaokwu a ekwughị kpọmkwem.
- source_word: Τοῦτον ... τοῦτον
  choice: Mosis a ... ọ bụ Mosis a
  rationale: 'Nkwughachi aha Mosis na-eme ka nkwusi okwu Grik pụta ìhè n’Igbo ma na-egosi ihe ịtụnanya dị n’amaokwu ahụ: otu onye ahụ ha jụrụ bụ onye Chineke zitere.'
- source_word: καὶ ἄρχοντα καὶ λυτρωτὴν
  choice: ma onye ọchịchị ma onye mgbapụta
  rationale: Usoro ‘ma ... ma ...’ na-egosipụta ọrụ abụọ ahụ e jikọtara ọnụ ma na-echekwa nkwusi nke καὶ ... καὶ.
theological_decisions:
- issue: Otú e si sụgharị λυτρωτής ebe Mosis bụ onye Chineke ji mee ihe n’akụkọ nzọpụta
  choice: onye mgbapụta
  alternative: onye nnapụta
  rationale: ‘Onye mgbapụta’ na-echekwa ịdị arọ nke echiche ịtọhapụ na mgbapụta n’okwu ahụ, n’etinyeghị ozizi ọzọ na Mosis ma ọ bụ mee ka ya na Kraịst bụrụ otu n’ụzọ amaokwu ahụ na-ekwughị.
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, nke dị ugwu ma dị mfe nghọta. E debere usoro nkwusi okwu nke amaokwu Grik, tinyere nkwughachi ‘Mosis a’ na njikọ ọrụ abụọ ahụ. E jighị okwu ụka pụrụ iche nke otu òtù.
