id: ACT.7.16
reference: Acts 7:16
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ μετετέθησαν εἰς Συχὲμ καὶ ἐτέθησαν ἐν τῷ μνήματι ⸀ᾧ ὠνήσατο Ἀβραὰμ τιμῆς ἀργυρίου παρὰ τῶν υἱῶν Ἑμμὼρ ⸀ἐν Συχέμ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/016.yaml
  text: and they were carried over to Shechem and laid in the tomb that Abraham had bought for a price of silver from the sons of Hamor in Shechem[a].
translation:
  language: ig
  text: E bufere ha na Shekem, wee lie ha n’ili ahụ Ebreham ji ego ọlaọcha zụta n’aka ụmụ Hamo na Shekem.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Okwu Stivin ebe a jikọtara nkọwa ndị a pụrụ iji tụnyere Jenesis 23, ebe Ebreham zụtara ebe olili n’aka Efrọn na Makpela, na Jenesis 33:19, ebe Jekọb zụtara ala dị nso na Shekem n’aka ụmụ Hamo.
    reason: cross_reference
lexical_decisions:
- source_word: μετετέθησαν
  choice: E bukwara ozu ha gaa
  rationale: Ụdị nnọchiaha a na-egosi na e bufere ha; n’ọnọdụ olili a, ịkpọpụta “ozu ha” na-eme ka Igbo doo anya n’enweghị ịgbanwe ihe okwu ahụ pụtara.
- source_word: Συχὲμ / Συχέμ
  choice: Shekem
  rationale: Nke a bụ ntụgharị mkpụrụokwu aha ebe ahụ n’ụdị dabara n’usoro mkpọpụta na odide Igbo.
- source_word: ἐτέθησαν
  choice: lie ha
  rationale: N’ọnọdụ olili, “lie ha” bụ okwu Igbo dị mfe ma kwekọọ na echiche nke ịtọgbọ ha n’ili.
- source_word: μνήματι
  choice: ili
  rationale: “Ili” bụ okwu Igbo nkịtị na nke kwesịrị ekwesị maka ebe a na-eli ozu.
- source_word: ᾧ
  choice: ahụ
  rationale: “Ahụ” na-ejikọta nkebiokwu na-akọwa ili ahụ n’ụzọ sitere n’okwu Grik ma dịkwa ụtọ n’Igbo.
- source_word: ὠνήσατο
  choice: zụta
  rationale: “Zụta” na-enye kpọmkwem echiche nke ịkwụ ụgwọ nweta ihe; usoro ahịrịokwu ahụ na-egosi na nzụta ahụ mere tupu olili.
- source_word: τιμῆς ἀργυρίου
  choice: ji ego ọlaọcha
  rationale: Nke a na-echekwa echiche nke ọnụahịa e ji ọlaọcha kwụọ, ma na-ada n’ụzọ ebumpụta ụwa n’Igbo.
- source_word: παρὰ τῶν υἱῶν Ἑμμὼρ
  choice: n’aka ụmụ Hamọ
  rationale: “N’aka” na-egosi ebe ihe ahụ si nweta, ebe “ụmụ Hamọ” na-anọchi anya okwu Grik ahụ n’enweghị mgbakwunye.
- source_word: ἐν Συχέμ
  choice: na Shekem
  rationale: E debere nkebiokwu ikpeazụ ahụ n’ụzọ na-adịghị amanye mkpebi ma ọ na-akọwa Hamọ, ụmụ ya, ma ọ bụ ebe azụmahịa ahụ mere.
theological_decisions:
- issue: Esemokwu akụkọ a na akụkọ nzụta ebe olili dị na Jenesis
  choice: 'E debere okwu Stivin dịka ihe odide Grik si dị: Ebraham zụtara ili ahụ n’aka ụmụ Hamọ na Shekem.'
  alternative: Ịgbanwe ya ka ọ kwekọọ na nzụta Jekọb na Jenesis 33:19, ma ọ bụ na nzụta Ebraham na Makpela na Jenesis 23.
  rationale: Nsụgharị kwesịrị igosi ihe odide Grik dịka ọ dị, kama idozi esemokwu ahụ n’ime isiokwu. Ihe ndị a ga-atụnyere dị n’ihe odide ala peeji.
translation_notes:
  register: Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ usoro okwu olili nke ndị nkịtị na-aghọta, ma e chekwara esemokwu dị n’ihe odide ahụ n’enweghị ime ka ọ kwekọọ n’ike na akụkọ Jenesis.
