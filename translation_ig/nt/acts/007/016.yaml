- from: E bukwara ozu ha gaa Shekem, lie ha n’ili ahụ Ebraham ji ego ọlaọcha zụta n’aka ụmụ Hamọ na Shekem.[a]
  to: E bufere ha na Shekem, wee lie ha n’ili ahụ Ebreham ji ego ọlaọcha zụta n’aka ụmụ Hamo na Shekem.[a]
  rationale: 'The revision preserves the Greek text’s historical tension rather than harmonizing it with Genesis. It makes only safe linguistic and orthographic improvements: a less explicit rendering of the transferred persons, smoother coordination, and a clearer cross-reference footnote.'
