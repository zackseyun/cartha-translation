translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta, dee ya. E chekwara usoro okwu nke iwu ahụ na ntụgharị ihu dị na δεῦρο, ma hazie ahịrịokwu ahụ ka ọ daa nke ọma n’Igbo.
