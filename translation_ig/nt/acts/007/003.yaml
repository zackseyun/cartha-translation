review_pass:
  verdict: revise
  source_fidelity: 'The verse accurately represents the Greek command: the repeated departure from Abraham’s land and kinship group, the deictic force of δεῦρο (‘come’), and the future-oriented ‘I will show you’ are all preserved. ‘N’etiti ndị ikwu gị’ appropriately conveys departure from one’s kindred.'
  naturalness: The main text is clear, idiomatic Standard Igbo, and maintains an appropriately dignified biblical narrative register. The footnote’s final explanatory sentence is less natural and should be recast.
  terminology: '‘Ala’ is a sound broad equivalent for γῆ, and ‘ndị ikwu’ suitably expresses συγγένεια in context. The proposed footnote alternative ‘agbụrụ gị’ is not suitable: it normally denotes one’s tribe/ethnic group and can overstate the lexical sense of συγγένεια.'
  issues:
  - severity: medium
    issue: The footnote offers ‘agbụrụ gị’ as an alternative for συγγένεια.
    rationale: συγγένεια denotes relatives, kin, or a kinship group; ‘agbụrụ’ commonly means tribe or ethnic group in Standard Igbo and introduces a potentially different social category.
  - severity: low
    issue: The footnote explanation uses the awkward wording ‘ìgwè ndị mmadụ na onye nwere njikọ ọmụmụ.’
    rationale: It is clearer and more natural to describe the term as a group of relatives—people with whom one has a family/kinship connection.
  revised_text: Ọ sịrị ya, “Si n’ala gị na n’etiti ndị ikwu gị[a] pụọ, bịakwa n’ala ahụ m ga-egosi gị.”
