  text: καὶ εἶπεν πρὸς αὐτόν· Ἔξελθε ἐκ τῆς γῆς σου καὶ ⸀ἐκ τῆς συγγενείας σου, καὶ δεῦρο εἰς ⸀τὴν γῆν ἣν ἄν σοι δείξω.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/003.yaml
  text: And he said to him[a], ‘Go out from your land and from your kindred, and come into the land that I will show you.’
translation:
  language: ig
  text: Ọ sịrị ya, “Si n’ala gị na n’etiti ndị ikwu gị[a] pụọ, bịakwa n’ala ahụ m ga-egosi gị.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “ezinụlọ gị” ma ọ bụ “ndị ikwu gị.” Okwu Grik συγγένεια na-ezo aka n’ìgwè ndị ikwu, ya bụ, ndị mmadụ onye na ha nwere njikọ ezinụlọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν πρὸς αὐτόν
  choice: Ọ sịrị ya
  rationale: Nke a bụ ụzọ Igbo dị mfe ma bụrụkwa nke sitere n’usoro Grik; a hapụrụ nnọchiaha ‘ya’ kama itinye aha Ebreham ebe Grik na-eji αὐτόν.
- source_word: Ἔξελθε ἐκ τῆς γῆς σου
  choice: Si n’ala gị ... pụọ
  rationale: Usoro ‘si ... pụọ’ na-egosipụta nke ọma iwu ịpụ n’ebe mmadụ nọ. ‘Ala’ na-echekwa nghọta sara mbara nke γῆ n’etinyeghị echiche mba nke oge a.
- source_word: ἐκ τῆς συγγενείας σου
  choice: na n’etiti ndị ikwu gị pụọ
  rationale: ‘Ndị ikwu gị’ bụ okwu Igbo doro anya maka ìgwè ndị mmadụ na onye nwere njikọ ọmụmụ; ‘n’etiti ... pụọ’ na-eme ka mmegharị isi n’ìgwè ahụ pụọ bụrụ nke e ji asụsụ Igbo nkịtị kwuo.
- source_word: δεῦρο εἰς τὴν γῆν
  choice: bịakwa n’ala ahụ
  rationale: ‘Bịa’ na-echekwa ntụgharị ihu nke δεῦρο karịa ‘gaa,’ ebe ‘n’ala ahụ’ na-egosi mmegharị iru ebe ahụ n’ụzọ Igbo na-asụkarị.
- source_word: ἣν ἄν σοι δείξω
  choice: m ga-egosi gị
  rationale: Nkebiokwu a nwere nghọta nke ihe ga-eme n’ọdịnihu; ‘m ga-egosi gị’ bụ ụzọ Igbo doro anya ma dịkwa ebumpụta ụwa, n’emeghị ka okwu ahụ yie ihe a na-ejighị n’aka.
