revisions:
- from: Ọ napụtakwara ya n’ahụhụ ya niile[a], nye ya ihu ọma[b] na amamihe n’ihu Fero, eze Ijipt, ma họpụta ya ka ọ bụrụ onye na-achị Ijipt na ụlọ ya dum.[c]
  to: Ọ napụtara ya n’ahụhụ ya niile[a], ma nye ya ihu ọma[b] na amamihe n’ihu Fero, eze Ijipt; ọ họpụtakwara ya ka ọ bụrụ onye na-achị Ijipt na ụlọ eze Fero dum.[c]
  rationale: The revision keeps the implied divine subject and all three coordinated actions in the Greek. It regularizes the Igbo verbal sequence and makes explicit that the final household is Pharaoh’s royal household, preventing an unintended reference to Joseph or a merely physical house. The alternatives retain the lexical range of “troubles,” “grace,” and “governor/administrator.”
