id: ACT.7.10
reference: Acts 7:10
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἐξείλατο αὐτὸν ἐκ πασῶν τῶν θλίψεων αὐτοῦ, καὶ ἔδωκεν αὐτῷ χάριν καὶ σοφίαν ἐναντίον Φαραὼ βασιλέως Αἰγύπτου, καὶ κατέστησεν αὐτὸν ἡγούμενον ἐπ’ Αἴγυπτον ⸀καὶ ὅλον τὸν οἶκον αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/010.yaml
  text: and rescued him from all his afflictions[a], and gave him favor and wisdom before Pharaoh king of Egypt[c][b], and appointed him ruler over Egypt and over all his household.
translation:
  language: ig
  text: Ọ napụtara ya n’ahụhụ ya niile[a], ma nye ya ihu ọma[b] na amamihe n’ihu Fero, eze Ijipt; ọ họpụtakwara ya ka ọ bụrụ onye na-achị Ijipt na ụlọ eze Fero dum.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “napụta ya ná nsogbu ya niile.”
    reason: lexical_alternative
  - marker: b
    text: “Ihu ọma” n’ebe a pụtara na Fero lere ya anya nke ọma ma nabata ya; a pụkwara ịsụgharị ya “amara.”
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “mee ya onyeisi na-elekọta Ijipt na ụlọ eze Fero dum.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξείλατο
  choice: napụtakwara
  rationale: “Ịnapụta” na-egosi na e wepụtara Josef n’ihe ize ndụ na mkpagbu, ọ bụghị nanị na a kpọpụtara ya n’otu ebe. Mgbakwunye “-kwara” na-ejikọta omume a na akụkọ gara aga.
- source_word: θλίψεων
  choice: ahụhụ
  rationale: “Ahụhụ” bụ okwu Igbo doro anya nke na-ekpuchi mkpagbu, nsogbu, na nhụjuanya Josef tara, n’etinyeghị echiche pụrụ iche banyere ahụhụ nke ọgwụgwụ ụwa.
- source_word: χάριν
  choice: ihu ọma
  rationale: N’ebe a, okwu ahụ pụtara na Fero lere Josef anya nke ọma ma nabata ya; “ihu ọma” na-egosipụta nke a karịa okwu nwere ike ịdị ka amara nzọpụta.
- source_word: σοφίαν
  choice: amamihe
  rationale: “Amamihe” na-enye kpọmkwem echiche nke nghọta na ikike ime mkpebi ọma nke Fero hụrụ n’ime Josef.
- source_word: ἐναντίον
  choice: n’ihu
  rationale: “N’ihu Fero” bụ ụzọ Igbo dị nkenke ma bụrụkwa nke ebumpụta ụwa iji gosi ịnọ n’ihu ya ma ọ bụ ịbụ onye ọ na-ele anya.
- source_word: κατέστησεν
  choice: họpụta
  rationale: “Ịhọpụta” na-egosi itinye mmadụ n’ọkwa ma nye ya ọrụ ọchịchị, dịka ngwaa Grik si pụta n’ebe a.
- source_word: ἡγούμενον
  choice: onye na-achị
  rationale: Nkebi a na-egosi onye nwere ikike idu na ịchị. “Onye na-achị” bụ okwu ndị nkịtị ga-aghọta nke ọma, na-enweghị ime ka ọ bụrụ aha ọkwa ọchịchị pụrụ iche nke ederede ahụ ekwughị.
- source_word: ἐπ’ Αἴγυπτον
  choice: na-achị Ijipt
  rationale: N’usoro Igbo, “onye na-achị Ijipt” na-egosi n’ụzọ eke na e nyere ya ikike n’elu Ijipt.
- source_word: ὅλον τὸν οἶκον αὐτοῦ
  choice: ụlọ ya dum
  rationale: “Ụlọ” n’ebe a nwere ike ịgụnye ezinụlọ, ndị na-eje ozi, na ihe ndị dị n’okpuru nlekọta Fero. Ide “ya” na-echekwa nnọchiaha dị na Grik kama ịkpọ Fero aha ọzọ n’ime nkebi ahụ.
theological_decisions:
- issue: Onye bụ isiokwu nke ngwaa ndị dị n’amaokwu a
  choice: E jighị aha “Chineke” tinye n’amaokwu ahụ; “Ọ” na-alaghachi n’ebe Chineke nọ n’amaokwu bu ụzọ.
  alternative: Ikwu kpọmkwem, “Chineke napụtara ya…”
  rationale: Ngwaa Grik nwere isiokwu otu onye mana akpọghị aha ya n’amaokwu a. Ihe gbara ya gburugburu na-egosi Chineke, ya mere nnọchiaha Igbo “Ọ” na-eme ka ahịrịokwu doo anya ma na-echekwa usoro nke isi mmalite ahụ.
- issue: Onye nnọchiaha dị na “ụlọ ya dum” na-ezo aka na ya
  choice: E debere nnọchiaha “ya,” nke ihe gbara ya gburugburu na-ejikọkarị na Fero.
  alternative: “ụlọ Fero dum”
  rationale: Ịkpọ Fero aha ga-eme ka ntụaka ahụ doo anya, ma Grik jiri nnọchiaha. Ide “ụlọ ya dum” na-echekwa ụdị okwu ahụ na ntakịrị ohere ntụaka ya, ebe usoro ahịrịokwu ka na-eduga onye na-agụ ya n’ebe Fero nọ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ usoro okwu dị eke n’Igbo, ma e chekwara njikọ ahịrịokwu ahụ na amaokwu bu ụzọ, nnọchiaha ndị isi mmalite, na obosara nke okwu ọchịchị ahụ.
