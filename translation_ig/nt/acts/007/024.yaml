  text: καὶ ἰδών τινα ἀδικούμενον ἠμύνατο καὶ ἐποίησεν ἐκδίκησιν τῷ καταπονουμένῳ πατάξας τὸν Αἰγύπτιον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/024.yaml
  text: And when he saw someone being wronged[b][a], he defended him and brought justice for the one being oppressed by striking down the Egyptian.
translation:
  language: ig
  text: Mgbe ọ hụrụ onye a na-emegbu, ọ gbachitere ya ma bọọrọ onye ahụ a na-akpagbu ọbọ site n'iti onye Ijipt ahụ ihe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “mgbe o tisịrị onye Ijipt ahụ ihe.” Okwu Grik ahụ pụtara “iti ihe”; n'akụkọ ahụ, iti a butere ọnwụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδών
  choice: Mgbe ọ hụrụ
  rationale: A sụgharịrị participle aorist a dị ka ọnọdụ oge iji mee ka Igbo bụrụ nke eke ma gosipụta na ịhụ ahụ butere omume ndị sochiri.
- source_word: τινα
  choice: onye
  rationale: Nnọchiaha a akọwaghị onye ọ bụ; ‘onye’ na-edobe enweghị nkọwa ahụ n'Igbo na-enweghị ịgbakwunye ‘nwoke.’
- source_word: ἀδικούμενον
  choice: a na-emegbu emegbu
  rationale: Ọ na-egosi onye a na-eme ihe na-ezighị ezi; okwu a bụ Igbo a na-aghọta nke ọma ma na-edobe akụkụ nke ikpe na-ezighị ezi.
- source_word: ἠμύνατο
  choice: ọ gbachitere ya
  rationale: Middle verb a pụtara ịbịara onye ọzọ ọgụ ma ọ bụ ịzọpụta ya n'aka onye na-emegbu ya; ‘gbachitere’ dabara n'ọnọdụ a.
- source_word: ἐποίησεν ἐκδίκησιν
  choice: ma megwara
  rationale: Nkebiokwu a nwere echiche nke imegwara ma ọ bụ ikpechitere onye e mejọrọ. ‘Megwara’ na-egosipụta ike okwu Grik ahụ nke ọma, ebe nkebiokwu na-esochi ya na-eme ka o doo anya na ọ bụ ime ihe n'aha onye a na-akpagbu.
- source_word: τῷ καταπονουμένῳ
  choice: onye ahụ a na-akpagbu
  rationale: Ọ na-egosi onye a na-emeso n'ụzọ siri ike ma na-akpagbu; ‘onye ahụ a na-akpagbu’ na-edobe omume ahụ na-aga n'ihu nakwa dative nke uru.
- source_word: πατάξας
  choice: site n'iti ... ihe
  rationale: πατάσσω n'onwe ya pụtara iti ihe. Nsụgharị a anaghị etinye ‘gbuo’ n'ime okwu ahụ, ọ bụ ezie na gburugburu akụkọ ahụ na-egosi na ihe ahụ butere ọnwụ.
- source_word: τὸν Αἰγύπτιον
  choice: onye Ijipt ahụ
  rationale: Nke a bụ ụzọ Igbo si ekwu aha agbụrụ a n'ụzọ doro anya ma bụrụkwa nke eke.
theological_decisions:
- issue: Ihe ἐκδίκησιν pụtara n'omume Mosis
  choice: Jiri ‘megwara’ nke na-edobe echiche imegwara/ịzọpụta aha onye e mejọrọ.
  alternative: ‘wetara onye ahụ ikpe ziri ezi’
  rationale: Okwu Grik ahụ nwere ike ịpụta ịbọ ọbọ, imegwara, ma ọ bụ ikpechitere onye e mejọrọ. ‘Megwara’ na-edobe esemokwu na ike okwu mbụ ahụ, na-enweghị ịsị na amaokwu a na-akụzi nkwado izugbe nye ịbọ ọbọ onwe onye.
translation_notes:
  register: Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E ji ‘a na-emegbu emegbu’ na ‘a na-akpagbu’ kewaa echiche ἀδικέω na καταπονέω; e debere ike na nghọtahie nwere ike ịdị na ἐποίησεν ἐκδίκησιν kama ime ka ọ bụrụ naanị okwu ikpe.
