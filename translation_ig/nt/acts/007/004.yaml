id: ACT.7.4
reference: Acts 7:4
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τότε ἐξελθὼν ἐκ γῆς Χαλδαίων κατῴκησεν ἐν Χαρράν. κἀκεῖθεν μετὰ τὸ ἀποθανεῖν τὸν πατέρα αὐτοῦ μετῴκισεν αὐτὸν εἰς τὴν γῆν ταύτην εἰς ἣν ὑμεῖς νῦν κατοικεῖτε,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/004.yaml
  text: Then, after he had gone out from the land of the Chaldeans, he settled in Haran. And from there, after his father died, God moved him into this land in which you now live,
translation:
  language: ig
  text: Mgbe ahụ, mgbe ọ hapụsịrị ala ndị Kaldia, o biri na Haran. Sitekwa n'ebe ahụ, mgbe nna ya nwụsịrị, Chineke mere ka ọ kwaga n'ala a unu bi na ya ugbu a.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “o mere ka ọ kwaga.” Grik ekwughị onye mere ihe ahụ kpọmkwem, ọ bụ ezie na ihe gbara okwu ahụ gburugburu na-egosi Chineke.
    reason: lexical_alternative
  - marker: b
    text: Stivin kwuru na njem a mere mgbe nna ya nwụsịrị. Tụlee Jenesis 11:32; 12:4 maka usoro oge metụtara ya.
    reason: cross_reference
lexical_decisions:
- source_word: τότε
  choice: Mgbe ahụ
  rationale: Na-egosi oge na usoro ihe omume n'ụzọ doro anya ma bụrụkwa Igbo a na-asụ ugbu a.
- source_word: ἐξελθὼν ἐκ γῆς Χαλδαίων
  choice: mgbe ọ hapụsịrị ala ndị Kaldia
  rationale: Na-egosi na ọpụpụ ahụ buru ụzọ mee tupu o biri na Haran; ‘ala ndị Kaldia’ na-edobe usoro okwu Grik.
- source_word: κατῴκησεν ἐν Χαρράν
  choice: o biri na Haran
  rationale: ‘O biri’ bụ okwu Igbo dị mfe ma kwekọọ n'ịbanye biri n'otu ebe; e debere aha ebe ahụ dị ka Haran.
- source_word: κἀκεῖθεν
  choice: Sitekwa n'ebe ahụ
  rationale: Na-edobe ma njikọ καί ma echiche ‘site n'ebe ahụ’ nke ἐκεῖθεν.
- source_word: μετὰ τὸ ἀποθανεῖν τὸν πατέρα αὐτοῦ
  choice: mgbe nna ya nwụsịrị
  rationale: Na-enye usoro oge nke articular infinitive n'Igbo nkịtị ma doo anya.
- source_word: μετῴκισεν αὐτὸν
  choice: Chineke mere ka ọ kwaga
  rationale: Ngwaa ahụ bụ causative, ya bụ ime ka mmadụ kwaga ma ọ bụ biri n'ebe ọzọ. E tinyere ‘Chineke’ maka nghọta dịka isiokwu a ghọtara site n'akụkụ okwu gbara ya gburugburu, ma ndetu [a] na-echekwa na Grik ekwughị isiokwu ahụ kpọmkwem.
- source_word: εἰς τὴν γῆν ταύτην εἰς ἣν ὑμεῖς νῦν κατοικεῖτε
  choice: n'ala a unu bi na ya ugbu a
  rationale: Na-egosi ebe njem ahụ kwụsịrị ma na-asụkwa relative clause ahụ n'Igbo eke na nke a na-aghọta ngwa ngwa.
theological_decisions:
- issue: Isiokwu a na-ekwughị kpọmkwem na μετῴκισεν
  choice: E tinyere ‘Chineke’ n'ahịrị isi, tinyekwa ndetu na-akọwa na Grik ekwughị ya kpọmkwem.
  alternative: ‘o mere ka ọ kwaga’ ma ọ bụ ‘o kwagara ya’
  rationale: Ihe gbara amaokwu ahụ gburugburu na-egosi Chineke dịka onye na-eme ihe ahụ, ma ndetu na-echekwa ezigbo ọdịiche dị n'ụdị asụsụ Grik.
- issue: Usoro oge gbasara ọnwụ Tera na njem Ebreham
  choice: A sụgharịrị ya ‘mgbe nna ya nwụsịrị’ n'enweghị ime ka ọ kwekọọ n'ụzọ ọzọ.
  alternative: Ịgbanwe usoro okwu iji dozie ọdịiche a na-ahụ mgbe e jiri ya tụnyere Jenesis 11:32; 12:4.
  rationale: Nsụgharị kwesịrị idebe ihe Stivin kwuru na usoro akụkọ Ọrụ Ndịozi, ọ bụghị idozi esemokwu oge ahụ n'ụzọ nzuzo.
translation_notes:
  register: Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ ‘mere ka ọ kwaga’ iji gosipụta causative nke μετοικίζω n'ụzọ eke; a zere okwu ochie na nkọwa okpukpe otu ụka.
