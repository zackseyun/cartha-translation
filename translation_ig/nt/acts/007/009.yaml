revisions:
- from: Ndị nna ochie ahụ wee nwee anyaụfụ n’ebe Josef nọ, ree ya ka a kpọga ya Ijipt. Ma Chineke nọnyeere ya.
  to: Ndị nna ochie ahụ, n’ihi anyaụfụ ha nwere n’ebe Josef nọ, rere ya gaa Ijipt; Chineke nọnyere ya.
  rationale: The revision keeps the historical referent and the motive explicit, renders the sale and destination directly without adding a passive transport agent, and replaces the added adversative with source-neutral coordination. No footnote is needed because the Greek wording is straightforward and no disputed ambiguity requires preservation.
  reviewer_model: gpt-5.6-terra
