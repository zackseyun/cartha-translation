id: ACT.7.9
reference: Acts 7:9
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Καὶ οἱ πατριάρχαι ζηλώσαντες τὸν Ἰωσὴφ ἀπέδοντο εἰς Αἴγυπτον· καὶ ἦν ὁ θεὸς μετ’ αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/009.yaml
  text: And the patriarchs, being jealous of Joseph, sold him into Egypt; and God was with him,
translation:
  language: ig
  text: Ndị nna ochie ahụ, n’ihi anyaụfụ ha nwere n’ebe Josef nọ, rere ya gaa Ijipt; Chineke nọnyere ya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πατριάρχαι
  choice: ndị nna ochie ahụ
  rationale: N’ebe a okwu ahụ na-ezo aka kpọmkwem n’ụmụ Jekọb, bụ́ ndị nna mbụ nke agbụrụ Izrel. “Ndị nna ochie” bụ okwu Igbo dị mfe ma dị ùgwù nke na-egosi ọnọdụ ha n’akụkọ ihe mere eme.
- source_word: ζηλώσαντες
  choice: wee nwee anyaụfụ n’ebe Josef nọ
  rationale: Okwu a na-egosi ihe kpaliri omume ha. “Inwe anyaụfụ n’ebe mmadụ nọ” na-ebute ike mmetụta ζηλόω nke ọma n’Igbo nkịtị.
- source_word: ἀπέδοντο
  choice: ree ya
  rationale: N’ihe gbasara akụkọ Josef, ngwaa a pụtara ire mmadụ, ọ bụghị naanị inyefe ya. “Ree ya” na-ekwu omume ahụ n’ụzọ doro anya.
- source_word: εἰς Αἴγυπτον
  choice: ka a kpọga ya Ijipt
  rationale: εἰς na-egosi ebe e zigara Josef. N’Igbo, ijikọ ire ya na ebumnuche ka a kpọga ya Ijipt na-ada eke ma na-echekwa ntụziaka mmegharị ahụ.
- source_word: ἦν ὁ θεὸς μετ’ αὐτοῦ
  choice: Chineke nọnyeere ya
  rationale: “Nọnyeere ya” na-egosi ọnụnọ Chineke n’ụzọ dị mfe ma kwesị ntụkwasị obi, na-enweghị ịgbakwụnye nkọwa gbasara otú Chineke si nyere ya aka.
theological_decisions:
- issue: Ọnụnọ Chineke n’ahụhụ Josef
  choice: Ma Chineke nọnyeere ya
  alternative: Chineke nọkwa ya nso
  rationale: 'Nsụgharị a na-echekwa esemokwu dị n’amaokwu ahụ: ụmụnne Josef rere ya, ma Chineke ka nọnyeere ya. “Ma” na-egosi ọdịiche ahụ n’enweghị ịkọwa ozizi gbasara ọchịchị Chineke karịa ihe ederede kwuru.'
translation_notes:
  register: Standard Igbo dị ugbu a, dị mfe ma dị ùgwù. E ji “ndị nna ochie” mee ka ndị na-agụ akwụkwọ ghọta ndị guzobere agbụrụ Izrel n’enweghị okwu teknụzụ na-adịghị eke n’Igbo. Enweghị akara nkọwa ala peeji n’ihi na amaokwu a achọghị ya.
