  text: ὁ δὲ Μωϋσῆς ἰδὼν ⸀ἐθαύμασεν τὸ ὅραμα. προσερχομένου δὲ αὐτοῦ κατανοῆσαι ἐγένετο φωνὴ ⸀κυρίου·
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/031.yaml
  text: 'When Moses saw it[a], he marveled at the sight. And as he came near to look closely[c][b], a voice of the Lord came:'
translation:
  language: ig
  text: 'Mgbe Mosis hụrụ ihe ahụ[a], ihe ọ hụrụ tụrụ ya n’anya. Ka ọ na-abịaru nso ile ya anya nke ọma, olu Onyenweanyị wee bịa[b][c] sị:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ọhụụ ahụ.” Okwu Grik ahụ nwere ike ịpụta ihe a na-ahụ anya ma ọ bụ ọhụụ.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “olu Onyenweanyị wee daa.”
    reason: lexical_alternative
  - marker: c
    text: Ụfọdụ nwere ike ịtụ anya “ONYENWEANYỊ” n’ihi na akụkọ a na-echetara Ọpụpụ 3; ma okwu Grik dị ebe a bụ “Onyenweanyị” (κύριος).
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδὼν
  choice: Mgbe Mosis hụrụ ihe ahụ
  rationale: Aorist participle ahụ na-egosi ihe mere tupu ngwaa bụ isi; ụdị a bụ Igbo eke, ebe “ihe ahụ” na-ezo aka n’ihe a hụrụ anya n’akụkọ ahụ.
- source_word: ἐθαύμασεν
  choice: ihe ọ hụrụ tụrụ ya n’anya
  rationale: Nke a na-egosi oke ijuanya nke θαυμάζω n’asụsụ Igbo dị ugbu a ma na-ejikọ ya n’ihe Mosis hụrụ.
- source_word: τὸ ὅραμα
  choice: ihe ọ hụrụ
  rationale: ὅραμα nwere ike ịbụ ọhụụ ma ọ bụ ihe pụtara n’anya. N’ebe a, ntụgharị a na-anọgide n’ihe Mosis hụrụ anya n’etinyeghị echiche na ọ bụ naanị ọhụụ ime mmụọ.
- source_word: προσερχομένου
  choice: Ka ọ na-abịaru nso
  rationale: Na-egosipụta genitive absolute dị ka ọnọdụ oge na-aga n’ihu, ma na-echekwa mmegharị Mosis ịbịaru nso.
- source_word: κατανοῆσαι
  choice: ile ya anya nke ọma
  rationale: Na-egosi ile ihe anya nke ọma ma ọ bụ nyocha anya nke κατανοέω pụtara n’ọnọdụ a.
- source_word: ἐγένετο φωνὴ
  choice: olu ... wee daa
  rationale: Ọ bụ ụzọ Igbo si ekwu na olu malitere ịda ma ọ bụ bịara, na-echekwa ọdịdị ihe omume nke ἐγένετο + aha, n’etinyeghị okwu na e ‘nụrụ’ ya nke na-adịghị kpọmkwem na Grik.
- source_word: κυρίου
  choice: Onyenwe anyị
  rationale: Ọ bụ ntụgharị Igbo a na-ahụkarị ma dị ùgwù maka κύριος dị ka aha nsọ ma ọ bụ utu aha; anaghị eji ụdị pụrụ iche e ji anọchi YHWH ebe Grik nwere κύριος.
theological_decisions:
- issue: Ntughari κύριος n’ọnọdụ Chineke pụtara ìhè
  choice: Onyenwe anyị
  alternative: ONYENWE ANYỊ
  rationale: Ederede Grik kwuru κύριος, ọ bụghị Tetragrammaton. “Onyenwe anyị” na-anọchi Lord, ebe “ONYENWE ANYỊ” nwere ike ime ka onye na-agụ ya chee na ederede ahụ kpọmkwem nwere YHWH. Ntụaka akụkọ ahụ na Ọpụpụ 3 anaghị agbanwe okwu Grik dị ebe a.
translation_notes:
  register: 'E ji Standard Igbo nke dị ugbu a, dị mfe nghọta ma dị ùgwù dee ya. E debere usoro akụkọ ahụ n’ụdị eke: ịhụ ihe ahụ, iju anya, ịbịaru nso, na olu ịda. Akara nkọwa ala peeji niile dị n’ederede bụ isi.'
