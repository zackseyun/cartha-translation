revisions:
- from: “Unu ndị olu kpọrọ nkụ, ndị a na-ebighị úgwù n’obi na ná ntị! Unu na-eguzogide Mmụọ Nsọ mgbe niile. Dị ka nna unu[a] mere, otu ahụkwa ka unu na-eme.”
  to: “Unu ndị olu unu siri ike, ndị a na-ebighị úgwù n’obi na n’ntị! Unu na-eguzogide Mmụọ Nsọ mgbe niile. Dị ka nna unu[a] mere, otu ahụkwa ka unu na-eme.”
  rationale: The revision replaces an inaccurate Igbo image of dryness with a direct hard-neck image, preserving the Greek and biblical metaphor. It also corrects the footnote alternative from “grandfathers” to “ancestors,” without altering the main text’s gendered familial term or the verse’s meaning.
