review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the continuing resistance to the Holy Spirit and the comparison with the audience’s fathers. However, “olu kpọrọ nkụ” means a dry throat/neck more naturally than the Greek image of a stiff or hard neck, and its footnote’s proposed alternative means “your grandfathers,” not the broader alternative “your ancestors.”
  naturalness: “Olu kpọrọ nkụ” is not a natural Standard Igbo equivalent for this biblical rebuke. “Ndị olu unu siri ike” is a clear, idiomatic-enough preservation of the bodily metaphor. “N’obi na n’ntị” is standard and smooth.
  terminology: “Ebighị úgwù,” “Mmụọ Nsọ,” “na-eguzogide,” and “mgbe niile” faithfully retain the covenantal metaphor, established theological term, active opposition, and durative force. “Nna unu” appropriately represents the Greek masculine plural in this context.
  issues:
  - severity: medium
    issue: The rendering “ndị olu kpọrọ nkụ” does not accurately communicate “stiff-necked.”
    rationale: In Standard Igbo, kpọrọ nkụ primarily describes dryness; it does not naturally express a rigid neck or the biblical metaphor for obstinacy. “Ndị olu unu siri ike” preserves the source image without replacing it with an interpretive abstraction.
  - severity: medium
    issue: The footnote alternative “ndị nna nna unu” is too narrow for English “your ancestors.”
    rationale: “Ndị nna nna unu” ordinarily means “your grandfathers.” The contextual alternative should be “ndị nna ochie unu,” while the main text retains the source-form “nna unu.”
  revised_text: “Unu ndị olu unu siri ike, ndị a na-ebighị úgwù n’obi na n’ntị! Unu na-eguzogide Mmụọ Nsọ mgbe niile. Dị ka nna unu[a] mere, otu ahụkwa ka unu na-eme.”
  revised_footnotes:
  - marker: a
    text: 'Ma ọ bụ, “ndị nna ochie unu.” N’asụsụ Grik: “nna unu.”'
    reason: lexical_alternative
  revision_rationale: The revision replaces an inaccurate Igbo image of dryness with a direct hard-neck image, preserving the Greek and biblical metaphor. It also corrects the footnote alternative from “grandfathers” to “ancestors,” without altering the main text’s gendered familial term or the verse’s meaning.
