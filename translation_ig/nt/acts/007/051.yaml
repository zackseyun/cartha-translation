  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Σκληροτράχηλοι καὶ ἀπερίτμητοι ⸀καρδίαις καὶ τοῖς ὠσίν, ὑμεῖς ἀεὶ τῷ πνεύματι τῷ ἁγίῳ ἀντιπίπτετε, ὡς οἱ πατέρες ὑμῶν καὶ ὑμεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/051.yaml
  text: You stiff-necked people[a], uncircumcised in hearts and ears, you always resist the Holy Spirit; as your fathers did, so do you.
translation:
  language: ig
  text: “Unu ndị olu unu siri ike, ndị a na-ebighị úgwù n’obi na n’ntị! Unu na-eguzogide Mmụọ Nsọ mgbe niile. Dị ka nna unu[a] mere, otu ahụkwa ka unu na-eme.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ, “ndị nna ochie unu.” N’asụsụ Grik: “nna unu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Σκληροτράχηλοι
  choice: ndị olu kpọrọ nkụ
  rationale: Nke a na-edobe ihe atụ doro anya nke okwu Grik, bụ́ olu siri ike nke na-anọchi anya isi ike, kama ịsụgharị ya naanị dịka “ndị isi ike.”
- source_word: ἀπερίτμητοι
  choice: ndị a na-ebighị úgwù
  rationale: E debeere okwu ọgbụgba ndụ ahụ n’ụdị ihe atụ ya, n’ihi na ebighị úgwù n’obi na ná ntị na-egosi nnupụisi ime mmụọ, ọ bụghị naanị adịghị ọcha n’ozuzu.
- source_word: καρδίαις καὶ τοῖς ὠσίν
  choice: n’obi na ná ntị
  rationale: Nke a na-egosipụta dative nke akụkụ ma ọ bụ ebe n’Igbo dị ire, ma na-edobe njikọ dị n’etiti obi na ntị.
- source_word: ἀεὶ
  choice: mgbe niile
  rationale: Ọ na-egosi omume mmegide nke na-aga n’ihu mgbe nile.
- source_word: τῷ πνεύματι τῷ ἁγίῳ
  choice: Mmụọ Nsọ
  rationale: Nke a bụ aha Igbo a na-ejikarị eme ihe maka Mmụọ Nsọ dịka onye Chineke n’ebe a.
- source_word: ἀντιπίπτετε
  choice: na-eguzogide
  rationale: Ọ na-egosi iguzoro megide ma ọ bụ ịlụso Mmụọ Nsọ ọgụ n’enweghị ịgbatị ihe okwu ahụ pụtara.
- source_word: οἱ πατέρες ὑμῶν
  choice: nna unu
  rationale: A hapụrụ okwu nwoke nke Grik n’ụdị ya kpọmkwem, ebe nkọwa ala peeji na-enye “ndị nna nna unu” dịka ụzọ ọzọ dabara n’ihe a na-ekwu.
- source_word: καὶ ὑμεῖς
  choice: otu ahụkwa ka unu na-eme
  rationale: Nke a na-emezu ntụnyere ahụ n’Igbo dị mma, ma na-edobe “kwa” nke na-ejikọta ndị a na-agwa okwu na nna ha.
theological_decisions:
- issue: Onye τῷ πνεύματι τῷ ἁγίῳ na-ezo aka na ya
  choice: Mmụọ Nsọ dịka onye Chineke
  alternative: mmụọ nsọ dịka naanị ike, mmetụta, ma ọ bụ àgwà sitere n’aka Chineke
  rationale: N’Ọrụ Ndịozi, ahịrịokwu a n’ọnọdụ a na-ezo aka n’ebe Mmụọ Nsọ nọ dịka onye; nsụgharị ahụ anaghị etinye nkọwa ọzọ n’elu okwu Grik.
- issue: Ihe atụ nke ebighị úgwù n’obi na ná ntị
  choice: Idobe “ndị a na-ebighị úgwù” n’ụdị ihe atụ ya
  alternative: Ịkọwa ya dịka “ndị obi ha mechiri emechi, ndị ntị ha chiri”
  rationale: Okwu ahụ na-akpọghachi asụsụ amụma na ọgbụgba ndụ dị n’Akwụkwọ Nsọ Izrel; ịkọwa ya naanị dịka ekweghị ịnụ ihe ga-ewepụ njikọ ahụ.
- issue: Okwu nwoke e ji kpọọ ọgbọ ndị gara aga
  choice: nna unu
  alternative: ndị nna nna unu
  rationale: Grik kwuru “nna” kpọmkwem. E debeere ya n’ahịrịokwu, ma tinye ụzọ ọzọ nke na-egosi ndị nna ochie na nkọwa ala peeji ka a ghara imechi nghọta nke ọnọdụ ahụ.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. “Ndị olu kpọrọ nkụ” na-edobe ihe atụ siri ike nke isi ike; akara mkpu na-egosipụta ebubo dị ọkụ nke okwu ahụ. E debere okwu ọgbụgba ndụ “ibighị úgwù” na aha “Mmụọ Nsọ” n’enweghị itinye nkọwa ụka pụrụ iche.
