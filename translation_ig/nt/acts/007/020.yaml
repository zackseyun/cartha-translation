  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐν ᾧ καιρῷ ἐγεννήθη Μωϋσῆς, καὶ ἦν ἀστεῖος τῷ θεῷ· ὃς ἀνετράφη μῆνας τρεῖς ἐν τῷ οἴκῳ τοῦ πατρός·
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/020.yaml
  text: At that time Moses was born[a], and he was beautiful to God. He was brought up for three months in his father's house.
translation:
  language: ig
  text: N’oge ahụ ka a mụrụ Mosis, ọ mara mma n’anya Chineke[a]. A zụlitere ya ọnwa atọ n’ụlọ nna ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “ọ mara Chineke mma.” Okwu Grik ahụ nwekwara ike ịpụta “ọ mara mma” ma ọ bụ “ọ dị ebube,” ma e kwuru Chineke aha hoo haa, ya mere a chekwara ntụaka ahụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ᾧ καιρῷ
  choice: N’oge ahụ
  rationale: Nke a bụ ụzọ Igbo nkịtị na nke doro anya si egosipụta oge ahụ e kwuru okwu ya.
- source_word: ἐγεννήθη
  choice: a mụrụ
  rationale: N’ọnọdụ a, ụdị ngwaa a pụtara na a mụrụ mmadụ.
- source_word: Μωϋσῆς
  choice: Mosis
  rationale: Nke a bụ odide aha ahụ a na-ejikarị eme ihe n’Igbo.
- source_word: ἀστεῖος
  choice: makwara mma
  rationale: Ọ na-echekwa echiche bụ ịma mma ma ghara ịkọwa ya karịa ka okwu Grik si kwuo.
- source_word: τῷ θεῷ
  choice: n’anya Chineke
  rationale: Ọ na-egosipụta n’Igbo na ọ mara mma dịka Chineke si hụ ma ọ bụ tụlee ya, ma na-echekwa aha Chineke e kwuru kpọmkwem.
- source_word: ὃς
  choice: ya
  rationale: Ntụtụaka a laghachiri n’ebe Mosis nọ; ahịrịokwu Igbo ọhụrụ nwere nnọchiaha na-ada nke ọma.
- source_word: ἀνετράφη
  choice: A zụlitere
  rationale: Ọ na-egosi na e lekọtara ya ma zụlite ya n’ụlọ n’oge ahụ.
- source_word: μῆνας τρεῖς
  choice: ọnwa atọ
  rationale: Nke a bụ ụzọ Igbo ebumpụta ụwa si kwuo ogologo oge ahụ.
- source_word: ἐν τῷ οἴκῳ τοῦ πατρός
  choice: n’ụlọ nna ya
  rationale: Ọ na-echekwa echiche ụlọ na ezinụlọ nna ya n’asụsụ Igbo dị mfe.
theological_decisions:
- issue: Ihe ἀστεῖος τῷ θεῷ pụtara
  choice: ọ makwara mma n’anya Chineke
  alternative: ọ mara Chineke mma; ọ bụ nwa mara ezigbo mma
  rationale: Nhọrọ a na-echekwa ma echiche ịma mma ma ntụaka Grik kpọmkwem banyere Chineke. Ọ naghị eme ka okwu ahụ bụrụ naanị echiche mmadụ, ma ọ bụ tinye nkọwa okpukpe siri ike karịa ihe e dere.
translation_notes:
  register: Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E ji “n’anya Chineke” gosipụta ntụle Chineke n’ụzọ na-ada nke ọma n’Igbo, ma e debere nhọrọ ọzọ na nkọwa ala peeji.
