    text: A pụkwara ịsị, “ọ mara Chineke mma.” Okwu Grik ahụ nwekwara ike ịpụta “ọ mara mma” ma ọ bụ “ọ dị ebube,” ma e kwuru Chineke aha hoo haa, ya mere a chekwara ntụaka ahụ.
    reason: lexical_alternative
  revision_rationale: The revision corrects the predicate expression for ἀστεῖος, preserves the explicit divine reference without imposing an interpretation beyond divine evaluation, relocates the note anchor to the relevant words, and replaces an inappropriate contextual alternative in the footnote.
