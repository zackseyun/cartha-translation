  text: ἔφυγεν δὲ Μωϋσῆς ἐν τῷ λόγῳ τούτῳ, καὶ ἐγένετο πάροικος ἐν γῇ Μαδιάμ, οὗ ἐγέννησεν υἱοὺς δύο.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/029.yaml
  text: So Moses fled at this word[a], and became a sojourner in the land of Midian[b], where he fathered two sons.
translation:
  language: ig
  text: N’ihi okwu a, Mozis gbapụrụ[a], wee ghọọ onye ọbịa bi n’ala ọzọ n’ala Midian[b], ebe ọ ghọrọ nna ụmụ nwoke abụọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Mgbe okwu a gasịrị.” Nkebiokwu Grik ahụ nwere ike igosi na okwu a bụ ihe kpaliri mgbapụ Mozis ozugbo.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “wee ghọọ onye mba ọzọ bi n’ala Midian.” Okwu ahụ na-ekwu banyere onye bi n’ala na-abụghị ala nke ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφυγεν
  choice: gbara ọsọ
  rationale: Nkebiokwu a na-egosi na Mozis si ebe ahụ gbapụ n’ihi egwu ma ọ bụ ihe ize ndụ; ọ bụ okwu Igbo doro anya ma dịkwa ike.
- source_word: δὲ
  choice: wee
  rationale: N’ebe a δέ na-aga n’ihu n’akụkọ ma jikọta mgbapụ Mozis na ihe e kwuru tupu ya; “wee” na-eme njikọ ahụ n’ụzọ Igbo sitere n’okike.
- source_word: ἐν τῷ λόγῳ τούτῳ
  choice: N’ihi okwu a
  rationale: Ọ na-egosi na okwu ahụ bụ ihe kpaliri mgbapụ Mozis. Nkebiokwu a na-edobe nghọta nke ihe kpatara ya, ebe e dere ntụgharị ọzọ na nkọwa ala peeji.
- source_word: ἐγένετο πάροικος
  choice: biri dị ka onye mba ọzọ
  rationale: πάροικος bụ onye bi n’ala na-abụghị ala nke ya. Nhọrọ a bụ Igbo nkịtị ma na-echekwa ọnọdụ ya dị ka onye ọbịa bi n’ala ọzọ.
- source_word: ἐν γῇ Μαδιάμ
  choice: n’ala Midian
  rationale: Ọ na-egosipụta γῇ n'ụzọ doro anya ma na-edobe aha ebe ahụ.
- source_word: οὗ
  choice: ebe
  rationale: Ọ na-ezo aka n’ala Midian dịka ebe ihe sochirinụ mere.
- source_word: ἐγέννησεν
  choice: ọ mụtara
  rationale: Mgbe nwoke bụ isiokwu, “ịmụ ụmụ” n’Igbo nwere ike ịpụta na ọ ghọrọ nna ha; ọ dị mfe ma bụrụkwa okwu a na-aghọta nke ọma.
- source_word: υἱοὺς δύο
  choice: ụmụ nwoke abụọ
  rationale: Nke a na-enye kpọmkwem ihe nkebiokwu Grik pụtara.
theological_decisions: []
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ “biri dị ka onye mba ọzọ” kama okwu pụrụ ịdị ochie ma ọ bụ sie ndị mmadụ ike; e debere ụzọ ndị ọzọ e nwere ike isi ghọta nkebiokwu ndị ahụ na nkọwa ala peeji.
