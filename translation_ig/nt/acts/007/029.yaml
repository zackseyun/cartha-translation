    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “wee ghọọ onye mba ọzọ bi n’ala Midian.” Okwu ahụ na-ekwu banyere onye bi n’ala na-abụghị ala nke ya.
    reason: lexical_alternative
