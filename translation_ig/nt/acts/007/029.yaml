revisions:
- from: N’ihi okwu a, Mozis gbara ọsọ[a], wee biri dị ka onye mba ọzọ n’ala Midian[b], ebe ọ mụtara ụmụ nwoke abụọ.
  to: N’ihi okwu a, Mozis gbapụrụ[a], wee ghọọ onye ọbịa bi n’ala ọzọ n’ala Midian[b], ebe ọ ghọrọ nna ụmụ nwoke abụọ.
  rationale: The revision removes the unsupported addition “when he heard,” retains the source phrase’s possible causal sense with a temporal alternative in the footnote, makes the “became a sojourner/resident foreigner” sense explicit, and renders Moses’ fathering of two sons without maternal ambiguity.
