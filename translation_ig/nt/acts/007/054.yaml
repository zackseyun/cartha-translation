  text: Ἀκούοντες δὲ ταῦτα διεπρίοντο ταῖς καρδίαις αὐτῶν καὶ ἔβρυχον τοὺς ὀδόντας ἐπ’ αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/054.yaml
  text: When they heard these things[a], they were cut to the heart and gnashed their teeth at him.
translation:
  language: ig
  text: Mgbe ha nụrụ ihe ndị a[a], obi ha na-adọwa, ha na-ata ikikere ezé megide ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “iwe were ha nke ukwuu.” Ngwaa Grik ahụ pụtara kpọmkwem ịbụ ndị a na-egbutu ma ọ bụ na-adọwa, na-edobe onyonyo siri ike nke oke mkpasu iwe dị n’ime ha.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀκούοντες δὲ ταῦτα
  choice: Mgbe ha nụrụ ihe ndị a
  rationale: “Mgbe ha nụrụ” na-egosi ọnọdụ oge nke participle ahụ n’Igbo nkịtị. A hapụrụ δέ ka usoro ahịrịokwu na “wee” n’ahịrị na-esonụ gosipụta mmegharị akụkọ ahụ, n’ihi na ọ dịghị mkpa itinye okwu pụrụ iche dịka “ugbu a.”
- source_word: διεπρίοντο ταῖς καρδίαις αὐτῶν
  choice: o wee dị ha ka a na-egbutu obi ha
  rationale: Nke a na-edobe onyonyo siri ike nke ịbụ ndị a ‘kpụchapụrụ’ ma ọ bụ ‘gbuturu’ n’obi, ma na-eme ka ọ bụrụ Igbo nghọta. Ọ naghị ebelata okwu ahụ ka ọ bụrụ naanị iwe.
- source_word: ἔβρυχον τοὺς ὀδόντας
  choice: ha wee taa iké ha n’ihi iwe ha
  rationale: “Taa iké” bụ ụzọ Igbo si egosi ịta ma ọ bụ ịkịrịkọta ezé; mgbakwunye “n’ihi iwe ha” na-eme ka mmetụta iro dị n’omume ahụ doo onye na-agụ anya.
- source_word: ἐπ’ αὐτόν
  choice: were megide ya
  rationale: Nke a na-egosi na iro na omume ịta iké ahụ chere Stivin ihu, dịka ἐπί si arụ ọrụ n’ebe a.
