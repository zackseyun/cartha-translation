- from: Mgbe ha nụrụ ihe ndị a[a], o wee dị ha ka a na-egbutu obi ha, ha wee taa iké ha n’ihi iwe ha were megide ya.
  to: Mgbe ha nụrụ ihe ndị a[a], obi ha na-adọwa, ha na-ata ikikere ezé megide ya.
  rationale: The revision removes the unsupported simile and the added causal phrase, uses a clear Standard Igbo idiom for gnashing teeth, and preserves the source’s vivid heart-cutting imagery. The alternative footnote reflects the contextual sense of intense anger without replacing the imagery in the main text.
