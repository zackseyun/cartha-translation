  text: Ἡ σκηνὴ τοῦ μαρτυρίου ἦν τοῖς πατράσιν ἡμῶν ἐν τῇ ἐρήμῳ, καθὼς διετάξατο ὁ λαλῶν τῷ Μωϋσῇ ποιῆσαι αὐτὴν κατὰ τὸν τύπον ὃν ἑωράκει,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/044.yaml
  text: The tent of testimony was with our fathers in the wilderness[a], just as the one speaking to Moses directed him to make it according to the pattern that he had seen[c][b],
translation:
  language: ig
  text: Ụlọikwuu nke àmà dị n’etiti ndị nna nna anyị n’ọzara, dị nnọọ ka onye ahụ na-agwa Mosis okwu nyere Mosis iwu ka o mee ya dị ka ụkpụrụ ahụ ọ hụburu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Onye ahụ na-agwa Mosis okwu bụ onye a na-akpọghị aha kpọmkwem n’asụsụ Grik; a pụkwara ịsụgharị ya, “onye ahụ gwara Mosis okwu,” ma ọ bụ “Chineke/Onyenwe anyị na-agwa Mosis okwu.”
    reason: alternative_reading
lexical_decisions:
- source_word: σκηνὴ
  choice: ụlọikwuu
  rationale: Okwu a pụtara ụlọ a na-akwagharị akwagharị; “ụlọikwuu” bụ okwu Igbo doro anya ma kwekọọ n’ebe nsọ e wuru n’ọzara.
- source_word: τοῦ μαρτυρίου
  choice: nke ihe àmà
  rationale: E debere njikọ genitive ahụ n’ụzọ dị nso n’asụsụ Grik, na-egosi ụlọikwuu e jikọrọ ya na ihe àmà Chineke.
- source_word: ἦν τοῖς πατράσιν ἡμῶν ἐν τῇ ἐρήμῳ
  choice: dịnyere ndị nna nna anyị n’ọzara
  rationale: “Dịnyere” na-egosipụta dative nke ịbụ n’etiti/anyị na ha, ebe “ọzara” bụ okwu Igbo a na-ejikarị akọwa wilderness n’akụkọ Akwụkwọ Nsọ.
- source_word: πατράσιν ἡμῶν
  choice: ndị nna nna anyị
  rationale: Nhọrọ a na-echekwa ntụaka nwoke dị na Grik ma na-ada ka okwu ebumpụta ụwa n’Igbo maka ndị nna ochie Izrel.
- source_word: καθὼς
  choice: dị nnọọ ka
  rationale: Ọ na-egosi nkwekọ kpọmkwem n’etiti iwu e nyere Mosis na otú e si mee ụlọikwuu ahụ.
- source_word: διετάξατο
  choice: nyere ya iwu
  rationale: Ngwaa a na-egosi ntụziaka nwere ikike; “nyere ya iwu” bụ okwu Igbo doro anya ma dị ebube.
- source_word: ὁ λαλῶν τῷ Μωϋσῇ
  choice: onye ahụ na-agwa Mosis okwu
  rationale: A hapụrụ onye na-ekwu okwu ahụ n’enweghị aha dịka Grik si mee, ma chekwaa ọdịdị participle nke na-aga n’ihu.
- source_word: ποιῆσαι αὐτὴν
  choice: ka o mee ya
  rationale: Nke a bụ nsụgharị Igbo dị mfe ma kwekọọ na infinitive na ihe ọ na-arụtụ aka.
- source_word: κατὰ τὸν τύπον
  choice: dịka ụkpụrụ ahụ ... si dị
  rationale: “Ụkpụrụ” na-egosi ihe nlereanya e gosiri Mosis nke a ga-agbaso mgbe a na-ewu ụlọikwuu ahụ.
- source_word: ὃν ἑωράκει
  choice: ọ hụrụ
  rationale: N’usoro akụkọ Igbo, “ọ hụrụ” na-egosipụta ihe Mosis hụburu tupu o mee ụlọikwuu ahụ, n’enweghị usoro okwu siri ike ma ọ bụ nke na-adịghị ebumpụta ụwa.
theological_decisions:
- issue: Onye ὁ λαλῶν τῷ Μωϋσῇ na-ezo aka na ya
  choice: 'A hapụrụ ya n’ụzọ na-akpọghị aha: “onye ahụ na-agwa Mosis okwu.”'
  alternative: “Chineke na-agwa Mosis okwu” ma ọ bụ “Onyenwe anyị na-agwa Mosis okwu.”
  rationale: Grik akpọghị onye ahụ Chineke ma ọ bụ Onyenwe anyị n’amaokwu a. Nhọrọ a na-echekwa ihe ederede kwuru kpọmkwem, kama ịkọwapụta ihe ọ hapụrụ n’ime nghọta.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị mfe nghọta ma dịkwa ebube. E ji “ụlọikwuu” zere okwu ụka pụrụ iche, ma e chekwara ụdị okwu Grik na-ahapụghị aha onye na-agwa Mosis okwu.
