source:
  edition: SBLGNT
  text: καὶ ἐπαιδεύθη ⸀Μωϋσῆς πάσῃ σοφίᾳ Αἰγυπτίων, ἦν δὲ δυνατὸς ἐν λόγοις καὶ ἔργοις ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/022.yaml
  text: And Moses was educated in all the wisdom of the Egyptians, and he was mighty in his words and deeds.
translation:
  language: ig
  text: A kụziiri Mosis n'amamihe niile nke ndị Ijipt, ọ dịkwa ike n'okwu ya na n'omume ya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n'okwu na n'omume.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπαιδεύθη
  choice: A kụziiri
  rationale: Ụdị a na-egosi na Mosis natara nkuzi na ọzụzụ. Ọ bụ okwu Igbo doro anya ma kwekọọ n'ọnọdụ mmụta n'obí eze Ijipt.
- source_word: πάσῃ σοφίᾳ Αἰγυπτίων
  choice: amamihe niile nke ndị Ijipt
  rationale: Nke a na-echekwa obosara πάσῃ na njikọ Αἰγυπτίων, ya bụ amamihe sitere n'aka ndị Ijipt ma ọ bụ nke ha nwere.
- source_word: δυνατὸς
  choice: dịkwa ike
  rationale: “Dị ike” na-egosipụta ike ma ọ bụ ikike dị na δυνατός, ma na-ada ka Igbo e ji eme ihe taa.
- source_word: ἐν λόγοις καὶ ἔργοις
  choice: n'okwu ya na n'omume ya
  rationale: Nke a na-echekwa nhazi okwu abụọ ahụ—λόγοις na ἔργοις—n'Igbo dị mfe nghọta. “Omume” ebe a na-egosi ihe mmadụ na-eme, ọ bụghị naanị àgwà ya.
- source_word: αὐτοῦ
  choice: ya ... ya
  rationale: 'A gbasara nnọchiaha ahụ n''aha abụọ ahụ ka Igbo wee doo anya: okwu Mosis na omume Mosis.'
theological_decisions:
- issue: Oke ike Mosis n'ihe gbasara λόγοις
  choice: ọ dịkwa ike n'okwu ya na n'omume ya
  alternative: ọ dị ike n'ikwu okwu na n'ime ihe
  rationale: A sụgharịrị okwu Stivin dịka ọ dị, n'emeghị ka ọ kwekọọ n'ụzọ nkọwa na Ọpụpụ 4:10. Ya mere, ntụgharị a hapụrụ esemokwu dị n'etiti amaokwu ndị ahụ ka ọ dị.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. “A kụziiri” na-egosi nkuzi na ọzụzụ Mosis natara; “okwu ya na omume ya” na-echekwa ịdị n'otu na ịdị nha nke okwu Grik ahụ.
