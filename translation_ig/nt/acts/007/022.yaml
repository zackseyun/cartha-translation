  to: A kụziiri Mosis n'amamihe niile nke ndị Ijipt, ọ dịkwa ike n'okwu ya na n'omume ya.[a]
  rationale: The revision adds n’ to mark the sphere of Moses’ education, closely reflecting the Greek construction. The footnote is tightened to a direct lexical alternative for “words and deeds,” without changing the sense or resolving the stated tension with Exodus 4:10.
