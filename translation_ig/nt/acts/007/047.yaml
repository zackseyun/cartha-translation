  yaml_path: translation/nt/acts/007/047.yaml
  text: But Solomon built a house for him[a].
translation:
  language: ig
  text: Ma Solomọn wuru ụlọ nye ya[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ụlọnsọ”; n'okwu Grik, “ụlọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Σολομῶν
  choice: Solomọn
  rationale: Ụdị a bụ nsụgharị aha onye ahụ a na-ejikarị n'Igbo, ọ na-edebekwa aha Grik ahụ dịka aha, ọ bụghị ịtụgharị ihe ọ pụtara.
- source_word: δὲ
  choice: Ma
  rationale: Ọ na-egosi ntakịrị ọdịiche ma ọ bụ ntụgharị n'akụkọ ahụ; “Ma” dabara n'okwu gbara ya gburugburu.
- source_word: οἰκοδόμησεν
  choice: wuru
  rationale: Ngwaa ahụ na-ekwu kpọmkwem banyere iwu ụlọ; “wuru” bụ okwu Igbo doro anya ma bụrụ nke e ji ekwu nke a n'ụzọ nkịtị.
- source_word: αὐτῷ
  choice: nye ya
  rationale: Nnọchiaha a na-ezo aka n'ebe Chineke nọ; “wuru ụlọ nye ya” na-egosi na e wuru ya maka ya ma ọ bụ iji sọpụrụ ya.
- source_word: οἶκον
  choice: ụlọ
  rationale: Okwu Grik ahụ pụtara “ụlọ” n'ụzọ nkịtị. Idowe “ụlọ” na-echekwa usoro okwu Stivin na esemokwu dị n'etiti ụlọ e wuru nye Chineke na okwu na-esochi banyere Onye Kachasị Elu na-adịghị ebi n'ụlọ aka mmadụ wuru.
theological_decisions:
- issue: Ma a ga-atụgharị οἶκον dịka “ụlọ” ka ọ bụ kọwaa ya dịka “ụlọnsọ”
  choice: ụlọ
  alternative: ụlọnsọ
  rationale: Ederede Grik ji οἶκος, bụ́ okwu nkịtị maka “ụlọ,” kama iji okwu a kapịrị ọnụ maka ụlọ nsọ. “Ụlọ” na-echekwa okwu na esemokwu nkà mmụta okpukpe dị n'amaokwu ndị a; “ụlọnsọ” bụ nkọwa ziri ezi n'ọnọdụ a, ya mere e tinyere ya n'okpuru ederede.
translation_notes:
  register: Asụsụ Igbo Izugbe dị mfe, dị ùgwù, ma bụrụ nke ndị na-agụ akwụkwọ taa ga-aghọta. E debere “ụlọ” n'ahịrị isi iji ghara iwepụ ihe okwu Grik kwuru kpọmkwem.
