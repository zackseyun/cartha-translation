  text: οἵτινες ἐλάβετε τὸν νόμον εἰς διαταγὰς ἀγγέλων, καὶ οὐκ ἐφυλάξατε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/053.yaml
  text: you who received the law as delivered by angels[a], and did not keep it.
translation:
  language: ig
  text: unu ndị natara iwu ahụ dịka ndị mmụọ ozi si nye ya[a], ma unu edebeghị ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “site ná nhazi ndị mmụọ ozi,” ma ọ bụ, “dịka ntụziaka ndị mmụọ ozi si dị.” Nkebi okwu Grik a siri ike, ma ọ na-ezo aka n’inye iwu ahụ site n’ọrụ ndị mmụọ ozi.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἵτινες
  choice: unu ndị
  rationale: Nke a na-echekwa ịkpọ ndị na-ege Stivin ntị okwu ozugbo, tinyere ike nke ebubo ahụ.
- source_word: ἐλάβετε
  choice: natara
  rationale: “Natara” bụ okwu Igbo doro anya maka ịnata iwu ahụ, n’ebughị ụzọ kwuo na ha ji obi ha nabata ya.
- source_word: τὸν νόμον
  choice: iwu ahụ
  rationale: N’ebe a, okwu ahụ na-ezo aka n’iwu Mosis; “iwu ahụ” na-eme ka ihe a na-ekwu pụta ìhè n’ụzọ dị mfe ma dị ebube.
- source_word: εἰς διαταγὰς ἀγγέλων
  choice: dịka ndị mmụọ ozi si nye ya
  rationale: Nkebi Grik a siri ike ma nwee ike ịpụta nhazi, ntụziaka, ma ọ bụ inyefe iwu site n’aka ndị mmụọ ozi. Nsụgharị a na-ekwupụta isi echiche nke ọrụ ndị mmụọ ozi n’inye iwu ahụ n’enweghị ịkọwa kpọmkwem otú o si mee.
- source_word: ἀγγέλων
  choice: ndị mmụọ ozi
  rationale: N’ọnọdụ a, ọ na-ezo aka n’ụmụ mmụọ nke eluigwe, ọ bụghị ndị ozi mmadụ.
- source_word: οὐκ ἐφυλάξατε
  choice: unu edebeghị ya
  rationale: “Idebe iwu” bụ ụzọ Igbo e si ekwu irubere iwu isi ma ọ bụ ime ihe ọ chọrọ; “ya” na-eme ka ihe e debereghị doo anya.
theological_decisions:
- issue: Ihe εἰς διαταγὰς ἀγγέλων pụtara gbasara ọrụ ndị mmụọ ozi n’inye iwu ahụ
  choice: Iwu ahụ bịara n’ụzọ ndị mmụọ ozi sonyere n’inyefe ya.
  alternative: A pụrụ ịsụgharị ya dịka “site ná nhazi ndị mmụọ ozi” ma ọ bụ “dịka ntụziaka ndị mmụọ ozi si dị.”
  rationale: Amaokwu ahụ na-egosi n’ezie na ndị mmụọ ozi tinyere aka n’inye iwu ahụ, ma nkebi Grik akọwaghị kpọmkwem ụdị ọrụ ahụ. Nsụgharị na nkọwa ala peeji na-echekwa nghọta ndị a n’ebughị ụzọ kpebie otu naanị ya.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe nghọta ma dịkwa ugwu. E debere ịkpọ ndị na-ege ntị okwu ozugbo site n’iji “unu,” ma e zere okwu pụrụ iche nke otu ụka.
