id: ACT.7.26
reference: Acts 7:26
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τῇ τε ἐπιούσῃ ἡμέρᾳ ὤφθη αὐτοῖς μαχομένοις καὶ ⸀συνήλλασσεν αὐτοὺς εἰς εἰρήνην εἰπών· Ἄνδρες, ἀδελφοί ⸀ἐστε· ἱνατί ἀδικεῖτε ἀλλήλους;
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/026.yaml
  text: And on the following day he appeared to them as they were fighting and was trying to reconcile them to peace[a], saying, ‘Men, you are brothers[b]; why are you wronging one another?’
translation:
  language: ig
  text: N’ụbọchị sochirinụ, ọ pụtara n’ihu ha mgbe ha na-alụ ọgụ, ọ nọkwa na-agbalị ime ka ha kpezie, ka udo dịrị n’etiti ha,[a] na-asị, “Ndị ikom, unu bụ ụmụnne.[b] Gịnị mere unu ji na-emejọ ibe unu?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ọ nọkwa na-eme ka ha kpezie, ka udo dịrị n’etiti ha.” Ụdị ngwaa Grik ahụ pụrụ igosi omume na-aga n’ihu, ma n’ebe a, n’ihi ihe na-esote, ọ pụrụ igosi mgbalị Mozis mere ime ka ha dịrị n’udo.
    reason: lexical_alternative
  - marker: b
    text: N’ọnọdụ a, Mozis na-eji “ụmụnne” arịọ ha ka ha cheta na ha bụ ndị otu ya, bụ ndị Izrel ibe ha; ọ dịghị ekwu na ha bụ ụmụ otu nne na nna.
    reason: contextual_clarification
lexical_decisions:
- source_word: τῇ τε ἐπιούσῃ ἡμέρᾳ
  choice: N’echi ya
  rationale: Nke a bụ ụzọ Igbo kwụ ọtọ ma dị mfe isi kwuo ụbọchị sochirinụ n’akụkọ.
- source_word: ὤφθη
  choice: ọ pụtara n’ihu ha
  rationale: Ọ bụ ezie na ụdị Grik bụ nke a pụrụ ịsụgharị ‘a hụrụ ya,’ n’akụkọ a ọ na-arụ ọrụ n’echiche ‘ọ pụtara,’ ya bụ, ọ bịara ka ha hụ ya.
- source_word: αὐτοῖς μαχομένοις
  choice: mgbe ha na-alụ ọgụ
  rationale: Ọ na-egosi ihe ha nọ na-eme mgbe Mozis pụtara; usoro ‘na-alụ’ na-echekwa omume ahụ na-aga n’ihu.
- source_word: συνήλλασσεν αὐτοὺς εἰς εἰρήνην
  choice: ọ nọkwa na-agbalị ime ka ha kpezie, ka udo dịrị n’etiti ha
  rationale: Ụdị imperfect ahụ nwere ike igosi mgbalị na-aga n’ihu nke na-erughị isi; amaokwu na-esonụ na-egosi na a jụrụ mgbalị Mozis. ‘Ime ka ha kpezie’ bụ Igbo sitere n’okike, ebe nkebi so ya na-echekwa echiche nke ịkpọbata ha n’udo.
- source_word: Ἄνδρες
  choice: Ndị ikom
  rationale: Nke a na-echekwa kpọmkwem ịkpọ ndị nwoke abụọ ahụ okwu n’asụsụ dị ùgwù.
- source_word: ἀδελφοί ἐστε
  choice: unu bụ ụmụnne
  rationale: ‘Ụmụnne’ bụ okwu Igbo sitere n’okike maka ndị nwere njikọ nwanne; n’ebe a ọ na-ezo aka n’ịbụ ndị otu Izrel.
- source_word: ἱνατί
  choice: Gịnị mere
  rationale: Nke a bụ ajụjụ Igbo nkịtị na nke doro anya maka ihe kpatara omume ahụ.
- source_word: ἀδικεῖτε ἀλλήλους
  choice: unu ji emejọ ibe unu
  rationale: ‘Imejọ’ na-ejide echiche nke ime ibe mmadụ ihe na-ezighị ezi ma ọ bụ ikpe na-ezighị ezi, ebe ‘ibe unu’ na-echekwa mmekọrịta reciprocal.
theological_decisions:
- issue: Ihe ‘ụmụnne’ pụtara n’ebe a
  choice: E jidere okwu ahụ dịka njikọ nke ndị Izrel ibe ha, ọ bụghị naanị ụmụ otu nne na nna.
  alternative: Ịsụgharị ya dịka ụmụnne nwoke sitere n’otu ezinụlọ kpọmkwem.
  rationale: Ọnọdụ akụkọ ahụ na Ọrụ Ndịozi 7:23–25 na-egosi na Mozis na-ekwu maka ndị obodo ya, ụmụ Izrel ibe ya; nke a na-echekwa arịrịọ ya dabere na njikọ ha n’enweghị ịgbakwunye ozizi pụrụ iche.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. ‘Ime ka ha kpezie’ bụ akpaalaokwu sitere n’okike karịa nsụgharị siri ike dịka ‘ime ka ha laghachi n’udo,’ ebe ‘ka udo dịrị n’etiti ha’ na-echekwa ntụziaka εἰς εἰρήνην.
