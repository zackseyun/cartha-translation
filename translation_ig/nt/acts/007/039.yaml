  text: ᾧ οὐκ ἠθέλησαν ὑπήκοοι γενέσθαι οἱ πατέρες ἡμῶν, ἀλλὰ ἀπώσαντο καὶ ἐστράφησαν ⸂ἐν ταῖς καρδίαις⸃ αὐτῶν εἰς Αἴγυπτον,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/039.yaml
  text: Our fathers were unwilling to become obedient to him[a], but rejected him and turned back in their hearts to Egypt[b],
translation:
  language: ig
  text: Ndị nna nna anyị achọghị ịghọ ndị na-erubere ya isi, kama ha jụrụ ya[a] ma n’obi ha tụgharịrị laghachi Ijipt[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ha kwapụrụ ya n’akụkụ.” Okwu Grik ahụ nwekwara ike igosi n’ụzọ nkịtị na ha kwapụrụ Mosis.
    reason: lexical_alternative
  - marker: b
    text: Ya bụ, mgbe ha ka nọ n’ọzara, ha nọ na-achọsi ike n’ime obi ha ịlaghachi Ijipt.
    reason: cultural_note
lexical_decisions:
- source_word: ᾧ
  choice: ya
  rationale: Nnọchiaha a dị na dative na-ezo aka na Mosis n’amaokwu bu ụzọ; n’Igbo, ‘na-erubere ya isi’ na-egosi nke ọma na ọ bụ ya ka ha kwesịrị irubere isi.
- source_word: οὐκ ἠθέλησαν
  choice: achọghị
  rationale: Ọ na-egosi na ha ekweghị n’obi ime ya, ọ bụghị naanị na ha emeghị ya; ‘achọghị’ bụ okwu Igbo doro anya ma na-adịkwa ike n’ebe a.
- source_word: ὑπήκοοι γενέσθαι
  choice: ịghọ ndị na-erubere ya isi
  rationale: Nke a na-echekwa echiche nke ‘ịghọ ndị na-erube isi,’ kama ime ka ọ bụrụ naanị otu omume nke irube isi.
- source_word: οἱ πατέρες ἡμῶν
  choice: ndị nna nna anyị
  rationale: N’Igbo a bụ ụzọ e si ekwu maka ndị nna ochie ma ọ bụ ndị bu anyị ụzọ; ọ na-eburu echiche nke ndị nna Izrel nke Stivin na-ekwu maka ha.
- source_word: ἀπώσαντο
  choice: ha jụrụ ya
  rationale: Okwu a na-egosi na ha kpapụrụ Mosis ma jụ ikike ya. ‘Jụrụ ya’ na-enye isi mmekọrịta ahụ n’Igbo dị ugbu a, ebe e debere nkọwa nke ịkwapụ ya n’ihe odide ala peeji.
- source_word: ἐστράφησαν
  choice: tụgharịa … laghachi
  rationale: N’ọnọdụ akụkọ a, ntụgharị ahụ bụ nlọghachi n’ebe Ijipt nọ; okwu abụọ a na-eme ka ntụgharị azụ ahụ doo anya n’Igbo.
- source_word: ἐν ταῖς καρδίαις αὐτῶν
  choice: n’obi ha
  rationale: Nke a na-echekwa akpaalaokwu Akwụkwọ Nsọ banyere ọchịchọ, echiche na mkpebi dị n’ime mmadụ.
- source_word: εἰς Αἴγυπτον
  choice: Ijipt
  rationale: Ebe ‘laghachi’ gosilarị ntụziaka, ‘Ijipt’ bụ mmeju ebumnobi dị mfe ma bụrụ nke e ji eme ihe n’Igbo.
theological_decisions:
- issue: Ụdị nlọghachi Izrel n’Ijipt
  choice: tụgharịa n’obi ha laghachi Ijipt
  alternative: tụgharịa obi ha gawa Ijipt
  rationale: Akpaokwu ‘n’obi ha’ na-egosi ntụgharị nke ọchịchọ na nkwado ha n’ime, ọ bụ ezie na ha anọgideghị na Ijipt n’ahụ. Nsụgharị ahụ na-echekwa esemokwu dị n’etiti ọnọdụ ahụ ha na ntụgharị obi ha n’enweghị ịkọwa ya gabiga ihe odide ahụ.
translation_notes:
  register: Ejiri Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. ‘Ndị nna nna anyị’ na-ekwu maka ndị nna ochie Izrel n’ụzọ nkịtị n’Igbo; ‘n’obi ha’ na-echekwa akpaalaokwu Akwụkwọ Nsọ na nghọta nke ntụgharị dị n’ime mmadụ. E tinyere akara [a] ozugbo n’akụkụ ‘jụrụ ya,’ ebe ọ bụ ἀπώσαντο ka nkọwa okwu ọzọ ahụ na-akọwa.
