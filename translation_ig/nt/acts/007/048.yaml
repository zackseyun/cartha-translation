  text: ἀλλ’ οὐχ ὁ ὕψιστος ἐν ⸀χειροποιήτοις κατοικεῖ· καθὼς ὁ προφήτης λέγει·
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/048.yaml
  text: 'But the Most High does not dwell in things made by hands[a], just as the prophet says:'
translation:
  language: ig
  text: 'Ma Onye Kasị Elu anaghị ebi n’ihe aka mmadụ mere[a], dị ka onye amụma na-ekwu, sị:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ, “n’ụlọ nsọ ndị aka mmadụ wuru.” Okwu Grik sara mbara karịa nke a: “n’ihe aka mmadụ mere”; ọ bụ ezie na ụlọ nsọ bụ ihe a na-ekwu banyere ya ozugbo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: Ma
  rationale: Na-egosi mgbanwe siri ike megide okwu bu ya ụzọ banyere ụlọ Solomọn wuru; “Ma” bụ okwu Igbo doro anya ma dịkwa eke.
- source_word: οὐχ
  choice: adịghị
  rationale: Ejikọtara ya na ngwaa “ebi” iji gosipụta ngọnarị nke κατοικεῖ n’ụzọ Igbo si ekwu ya.
- source_word: ὁ ὕψιστος
  choice: Onye Kasị Elu
  rationale: Na-echekwa aha nsọ a dịka utu aha Chineke, n’etinyeghị “Chineke,” nke a ghọtara mana adịghị n’ihe odide Grik.
- source_word: ἐν χειροποιήτοις
  choice: n’ihe ndị aka mmadụ mere
  rationale: Na-echekwa obosara nke χειροποιήτοις, nke pụtara ihe mmadụ ji aka mee, kama ime ka ọ bụrụ naanị ụlọ nsọ; ọnọdụ okwu ahụ ka na-egosi ụlọ nsọ ozugbo.
- source_word: κατοικεῖ
  choice: ebi
  rationale: “Ibi” bụ okwu Igbo kwụ ọtọ ma dabara n’okwu banyere ebe ọnụnọ Chineke dị.
- source_word: καθὼς
  choice: dị nnọọ ka
  rationale: Na-egosi n'ụzọ doro anya na okwu onye amụma na-akwado ihe a ka kwuru.
- source_word: ὁ προφήτης
  choice: onye amụma ahụ
  rationale: Na-edebe ihe Grik kwuru n’akpọghị Aịzaya aha, ma njirimara “ahụ” na-egosi onye amụma a maara site n’okwu ga-esochi.
- source_word: λέγει
  choice: kwuru
  rationale: Igbo na-ejikarị oge gara aga webata ihe e dere n’Akwụkwọ Nsọ. Ọ na-arụ ọrụ nke usoro okwu Grik λέγει n'ụzọ eke, n’agbanyeghị na Grik ji oge ugbu a.
theological_decisions:
- issue: Ma a ga-akọwa χειροποιήτοις kpọmkwem dịka “ụlọ nsọ” n’ahịrị bụ isi
  choice: E debere okwu sara mbara, “ihe ndị aka mmadụ mere.”
  alternative: “ụlọ nsọ ndị aka mmadụ wuru” ma ọ bụ “ebe nsọ ndị aka mmadụ mere”
  rationale: Ọ bụ ezie na ụlọ nsọ bụ isi ọnọdụ okwu a, adjective Grik ahụ sara mbara ma nwee ike iburu nkatọ Akwụkwọ Nsọ banyere ihe nsọ mmadụ ji aka ya mee. Nsụgharị sara mbara na-echekwa ike na ambiguiti nke okwu ahụ.
- issue: Ma a ga-agbasa ὁ ὕψιστος ka ọ bụrụ “Chineke Onye Kasị Elu”
  choice: A sụgharịrị ya naanị dịka “Onye Kasị Elu.”
  alternative: “Chineke Onye Kasị Elu”
  rationale: Utu aha ahụ na-ezo aka na Chineke n’enweghị mgbagha, ma θεός adịghị n’ihe odide Grik; ya mere etinyeghị okwu ọzọ n’ahịrị bụ isi.
- issue: Oge ngwaa e ji sụgharịa λέγει
  choice: “kwuru”
  alternative: “na-ekwu”
  rationale: “Kwuru” bụ ụzọ Igbo dị eke isi webata okwu onye amụma e dere, mana “na-ekwu” ga-echekwa oge ugbu a nke Grik n’ụzọ ka kpọmkwem. Nhọrọ a adịghị agbanwe ikike ma ọ bụ ọdịnaya amụma ahụ.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E jiri “Onye Kasị Elu” chekwaa utu aha Chineke, ma e jiri “ihe ndị aka mmadụ mere” zere ime ka okwu Grik sara mbara bụrụ naanị ụlọ nsọ. Akara nkọwa ala [a] pụtara n’ahịrị bụ isi dịka achọrọ.
