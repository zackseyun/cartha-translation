id: ACT.7.2
reference: Acts 7:2
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ δὲ ἔφη· Ἄνδρες ἀδελφοὶ καὶ πατέρες, ἀκούσατε· Ὁ θεὸς τῆς δόξης ὤφθη τῷ πατρὶ ἡμῶν Ἀβραὰμ ὄντι ἐν τῇ Μεσοποταμίᾳ πρὶν ἢ κατοικῆσαι αὐτὸν ἐν Χαρράν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/002.yaml
  text: 'And he said[a], “Brothers and fathers, listen: the God of glory appeared to our father Abraham when he was in Mesopotamia[b], before he lived in Haran.”'
translation:
  language: ig
  text: 'O wee sị, “Ụmụnna m na ndị nna m[a], geenụ ntị: Chineke nke ebube pụtara n’ihu nna anyị Ebreham mgbe ọ nọ na Mesopotemia, tupu ọ biri na Haran[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “Ndị ikom, ụmụnna m na ndị nna m.” Usoro okwu Grik e ji kpọọ ha bụ nke nkwanye ùgwù ma kpọọ ndị nwoke aha n’ụzọ doro anya.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsị, “tupu ọ dozie ebe obibi ya na Haran.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ ἔφη
  choice: O wee sị
  rationale: “Wee” na-ejikọta okwu a na akụkọ gara aga n’ụzọ dị mfe ma dịrị δέ nso, ebe “sị” na-enye ἔφη n’Igbo nkịtị.
- source_word: Ἄνδρες ἀδελφοὶ καὶ πατέρες
  choice: Ụmụnna m na ndị nna anyị
  rationale: Nke a bụ ụzọ nkwanye ùgwù na nke kwụ ọtọ e si agwa ndị nwoke nọ n’ọgbakọ okwu. “M” na “anyị” na-eme ka njikọ ezinụlọ na nkwanye ùgwù nke okwu Grik pụta nke ọma n’Igbo; e debere ụdị zuru ezu nke kpọrọ “ndị ikom” aha na nkọwa ala peeji.
- source_word: ἀκούσατε
  choice: geenụ ntị
  rationale: Ọ bụ iwu a na-enye ọtụtụ mmadụ ka ha lebara okwu anya; nke a bụ Igbo doro anya ma dị ugbu a.
- source_word: Ὁ θεὸς τῆς δόξης
  choice: Chineke nke ebube
  rationale: Nke a na-echekwa usoro genitive nke Grik na ụda okwu Akwụkwọ Nsọ, kama ime ya naanị “Chineke dị ebube.”
- source_word: ὤφθη
  choice: pụtara n’ihu
  rationale: N’ọnọdụ ngosipụta Chineke, okwu a pụtara na Chineke mere ka a hụ ya; “pụtara n’ihu” na-anọgide nso na “appeared” n’etinyeghị nkọwa ọzọ dịka “kpughere onwe ya.”
- source_word: τῷ πατρὶ ἡμῶν Ἀβραὰμ
  choice: nna anyị Ebreham
  rationale: Nke a na-echekwa okwu otu onye bụ “nna anyị” na njikọ obodo Stivin na-eme n’etiti ndị na-ege ya ntị na Ebreham.
- source_word: ὄντι ἐν τῇ Μεσοποταμίᾳ
  choice: mgbe ọ nọ na Mesopotemia
  rationale: A tụgharịrị participle ahụ dị ka ọnọdụ oge n’Igbo doro anya ma dị mfe nghọta.
- source_word: πρὶν ἢ κατοικῆσαι αὐτὸν ἐν Χαρράν
  choice: tupu ọ biri na Haran
  rationale: “Biri” bụ okwu sara mbara ma dị mfe maka κατοικέω; ọ naghị amanye echiche nke ibi ebe ahụ kpamkpam dịka “gaa biri” nwere ike ime.
theological_decisions:
- issue: Ụzọ e si tụgharịa okwu a na-agwa ndị nwoke nọ n’ọgbakọ
  choice: Ụmụnna m na ndị nna anyị
  alternative: Ndị ikom, ụmụnna m na ndị nna anyị
  rationale: Nsụgharị bụ isi na-enye usoro a n’Igbo dị ndụ ma na-edobe mmekọrịta ụmụnna na nkwanye ùgwù nye ndị okenye. N’ihi na Grik kpọrọ ndị nwoke aha n’ụzọ doro anya, e debere ụdị zuru ezu na nkọwa ala peeji kama ime ka okwu ahụ bụrụ nke na-enweghị njirimara nwoke.
- issue: Ụdị aha Chineke bụ θεὸς τῆς δόξης
  choice: Chineke nke ebube
  alternative: Chineke dị ebube
  rationale: Nhọrọ a na-echekwa nhazi okwu Grik na nkwughachi okwu Akwụkwọ Nsọ ọ pụrụ ibu, na-enweghị ime ka njikọ “nke ebube” bụrụ naanị adjective.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. A hapụrụ aha Chineke “Chineke nke ebube” n’usoro dị nso na Grik; okwu ịkpọ ọgbakọ ahụ bụ nke nkwanye ùgwù, ebe nkọwa ala peeji na-egosi ọdịdị nwoke nke usoro Grik n’uju.
