  text: ⸂καὶ κατέβη⸃ Ἰακὼβ εἰς Αἴγυπτον. καὶ ἐτελεύτησεν αὐτὸς καὶ οἱ πατέρες ἡμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/015.yaml
  text: And Jacob went down into Egypt[a], and he died, he and our fathers.
translation:
  language: ig
  text: Jekọb wee gbadaa Ijipt; ya na ndị nna nna anyị wee nwụọ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị nna ochie anyị.” Okwu Grik ahụ sịrị “ndị nna anyị,” na-ekwu maka ndị nna ochie Izrel.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατέβη
  choice: gbadaa
  rationale: Ọ na-echekwa echiche ntụziaka nke ịrịda ala dị na ngwaa Grik, ma bụrụkwa ụzọ ebumpụta ụwa e si ekwu njem gaa Ijipt n'Igbo.
- source_word: Ἰακώβ
  choice: Jekọb
  rationale: A sụgharịrị aha ahụ dịka odide aha a na-ejikarị eme ihe n'Igbo.
- source_word: εἰς Αἴγυπτον
  choice: Ijipt
  rationale: N'usoro 'gbadaa Ijipt,' Igbo na-egosi njem ruo n'ebe ahụ n'ụzọ doro anya na-enweghị mkpa itinye okwu ọzọ maka εἰς.
- source_word: ἐτελεύτησεν
  choice: nwụrụ
  rationale: Nke a bụ okwu Igbo kwụ ọtọ ma doo anya maka ọnwụ, na-enweghị iji okwu mgbagwoju anya ma ọ bụ okwu e ji ezere ikwu ọnwụ.
- source_word: αὐτὸς
  choice: ya
  rationale: N'usoro 'ebe ya na... nwụrụ,' nnọchiaha ahụ na-egosi Jekọb kpọmkwem ma na-edobe njikọ ya na ndị nna nna.
- source_word: οἱ πατέρες ἡμῶν
  choice: ndị nna nna anyị
  rationale: Ọ na-ezo aka n'ụzọ doro anya n'ebe ndị ikom bụ́ ndị nna ochie Izrel nọ, ma na-ada nke ọma karịa nsụgharị mkpụrụ okwu 'ndị nna anyị' n'Igbo n'ọnọdụ a.
theological_decisions:
- issue: Nsụgharị πατέρες n'akụkọ banyere ndị nna ochie Izrel
  choice: ndị nna nna anyị
  alternative: ndị nna ochie anyị
  rationale: Nhọrọ a na-echekwa ntụaka nwoke na mmekọrịta ezinụlọ dị n'okwu Grik, ma na-egosi ndị nna ochie Izrel kama ime ya ka ọ bụrụ naanị ndị nna nna niile n'ozuzu.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị mfe nghọta ma nwee ugwu, mee ihe. Ahịrịokwu ahụ jikọtara ọnwụ Jekọb na nke ndị nna nna ya n'ụzọ Igbo na-asụkarị, ebe ndetu ala na-echekwa ọdịdị mkpụrụ okwu Grik.
