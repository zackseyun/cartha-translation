revisions:
- from: Jekọb wee gbadaa Ijipt, ebe ya na ndị nna nna anyị nwụrụ.[a]
  to: Jekọb wee gbadaa Ijipt; ya na ndị nna nna anyị wee nwụọ.[a]
  rationale: The revision removes the unsupported locative-relative “ebe,” preserves the explicit reference to Jacob and the coordinated death of “our fathers,” and clarifies the lexical footnote without imposing an interpretation beyond the patriarchal referent supplied by the context.
