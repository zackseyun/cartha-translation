  to: “Mụ onwe m ga-ekpe mba ahụ nke ha ga-ejere ozi[a] ikpe,” ka Chineke kwuru, “mgbe ihe ndị a gasịrị, ha ga-apụta ma fee m ofufe[b] n’ebe a.”
