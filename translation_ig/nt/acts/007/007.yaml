  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ τὸ ἔθνος ᾧ ⸀ἐὰν ⸀δουλεύσουσιν κρινῶ ἐγώ, ⸂ὁ θεὸς εἶπεν⸃, καὶ μετὰ ταῦτα ἐξελεύσονται καὶ λατρεύσουσίν μοι ἐν τῷ τόπῳ τούτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/007.yaml
  text: And I will judge the nation that they will serve[a], God said[b], and after these things they will come out and worship me in this place.
translation:
  language: ig
  text: “Mụ onwe m ga-ekpe mba ahụ nke ha ga-ejere ozi[a] ikpe,” ka Chineke kwuru, “mgbe ihe ndị a gasịrị, ha ga-apụta ma fee m ofufe[b] n’ebe a.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “mba ahụ nke ha ga-abụ ndị ohu nye ya” ma ọ bụ “mba ahụ nke ha ga-ejere ozi dị ka ndị ohu.” Okwu Grik ahụ pụtara “ije ozi,” ma ọdịnaya ya na-ekwu maka ịgba Izrel ohu n’Ijipt.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, “jere m ozi.” Ngwaa Grik ahụ nwere ike ịpụta ijere Chineke ozi n’ụzọ okpukpe ma ọ bụ ife ya ofufe.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔθνος
  choice: mba
  rationale: N’ebe a, okwu a na-ezo aka ná mba nke ga-eme ka ụmụ Ebreham bụrụ ndị nọ n’ohu; “mba” bụ okwu Igbo doro anya nke na-echekwa echiche nke otu ndọrọ ndọrọ ọchịchị.
- source_word: ᾧ ἐὰν δουλεύσουσιν
  choice: ha ga-ejere ozi
  rationale: Nsụgharị a na-agbaso ụdị ngwaa Grik ahụ, ma ihe gbara ya gburugburu na-egosi na ọ bụ ozi a na-eje n’ohu; e debere nkọwa ahụ n’ala peeji.
- source_word: κρινῶ ἐγώ
  choice: Mụ onwe m ga-ekpe ... ikpe
  rationale: “Ikpe ... ikpe” na-echekwa echiche ikpe ziri ezi dị na κρίνω, ebe “mụ onwe m” na-egosipụta nkwusi ike nke ἐγώ.
- source_word: ὁ θεὸς εἶπεν
  choice: ka Chineke kwuru
  rationale: Nke a bụ usoro Igbo dị mfe ma kwekọọ n’okwu onye na-akọ onye kwuru ihe ahụ.
- source_word: μετὰ ταῦτα
  choice: mgbe ihe ndị a gasịrị
  rationale: Ọ na-echekwa ihe ngosi ọtụtụ dị na ταῦτα nakwa usoro oge e kwuru na ya.
- source_word: ἐξελεύσονται
  choice: ha ga-apụta
  rationale: Ọ na-egosi ọpụpụ ha site n’ebe a na-agba ha ohu, ma na-adabara akụkọ Ọpụpụ.
- source_word: λατρεύσουσίν μοι
  choice: fee m ofufe
  rationale: λατρεύω mgbe e ji ya gbasara Chineke na-egosi ozi okpukpe ma ọ bụ ofufe, ya mere “fee m ofufe” na-eme ka ihe ahụ pụta ìhè n’Igbo ugbu a.
- source_word: ἐν τῷ τόπῳ τούτῳ
  choice: n’ebe a
  rationale: Nke a bụ ụzọ Igbo kachasị eke isi kwuo “n’ebe a,” na-enweghị itinye nkọwa ọzọ banyere kpọmkwem ebe ahụ.
theological_decisions:
- issue: Ịsụgharị δουλεύω n’ọnọdụ ịgba ohu
  choice: ha ga-ejere ozi
  alternative: ha ga-abụ ndị ohu nye mba ahụ / ha ga-ejere mba ahụ ozi dị ka ndị ohu
  rationale: Ọ bụ ezie na akụkọ ahụ bụ banyere ịgba ohu n’Ijipt, isi mmalite ji ngwaa “ije ozi.” Isi ederede debere ụdị ahụ, ebe nkọwa ala peeji na-egosi ike echiche nke ịgba ohu dị n’ọnọdụ a.
- issue: Ịsụgharị λατρεύω mgbe ọ na-ezo aka n’ihe a na-emere Chineke
  choice: fee m ofufe
  alternative: jere m ozi
  rationale: N’ebe a, okwu ahụ abụghị nanị ọrụ nkịtị kama ọ bụ ozi nsọ a na-enye Chineke. “Fee m ofufe” na-egosi nke a nke ọma n’enweghị itinye ozizi ọzọ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ugwu ma dị mfe nghọta. Usoro okwu ahụ na-echekwa ọdịdị okwu Chineke e hotara, nkwusi ike dị na “mụ onwe m,” na ọdịiche dị n’etiti ozi a manyere n’ohu na ofufe a na-enye Chineke.
