id: ACT.7.18
reference: Acts 7:18
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἄχρι οὗ ἀνέστη βασιλεὺς ἕτερος ⸂ἐπ’ Αἴγυπτον⸃, ὃς οὐκ ᾔδει τὸν Ἰωσήφ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/018.yaml
  text: until another king arose over Egypt[b][a], who did not know Joseph.
translation:
  language: ig
  text: ruo mgbe eze ọzọ bilitere ịchị Ijipt[a], onye na-amaghị Josef[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ, “malitere ịchị Ijipt.” Okwu Grik pụtara n’ụzọ nkịtị “bilitere.”
    reason: lexical_alternative
  - marker: b
    text: “Na-amaghị Josef” nwekwara ike ịpụta na ọ naghị anabata Josef ma ọ bụ na o jighị ya kpọrọ ihe.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄχρι οὗ
  choice: ruo mgbe
  rationale: Nkebiokwu a na-egosi njedebe nke oge ọnọdụ ahụ gara n’ihu; “ruo mgbe” bụ ụzọ Igbo doro anya ma dịkwa mfe isi kwuo ya.
- source_word: ἀνέστη
  choice: bilitere
  rationale: “Bilitere” na-edobe ihe oyiyi dị n’okwu Grik, ebe okwu ndị so ya, “ịchị Ijipt,” na-eme ka o doo anya na ihe a na-ekwu bụ ịmalite ọchịchị.
- source_word: βασιλεὺς
  choice: eze
  rationale: “Eze” bụ nhata kpọmkwem nke okwu Grik, kwekọọkwa n’ọnọdụ akụkọ ihe mere eme a.
- source_word: ἕτερος
  choice: ọzọ
  rationale: “Ọzọ” na-ekewa eze a na nke bu ya ụzọ n’asụsụ Igbo dị mfe, n’etinyeghị nkọwa karịrị ihe odide ahụ kwuru.
- source_word: ἐπ’ Αἴγυπτον
  choice: ịchị Ijipt
  rationale: N’ebe a, ἐπί tinyere aha eze na-egosi ikike ọchịchị n’elu ala ahụ. “Ịchị Ijipt” na-ekwupụta echiche a n’Igbo eke.
- source_word: οὐκ ᾔδει
  choice: na-amaghị
  rationale: Nke a na-edobe isi ihe okwu Grik pụtara, “amaghị,” ma hapụkwa ohere ka ọnọdụ ahụ gosi ma ọ gụnyere ịghara ịnabata ma ọ bụ ịkwanyere Josef ùgwù.
- source_word: τὸν Ἰωσήφ
  choice: Josef
  rationale: E dere aha onye ahụ dịka a na-edekarị ya n’Igbo.
theological_decisions:
- issue: Ihe “amaghị Josef” nwere ike ịpụta
  choice: E debere okwu ahụ dịka “na-amaghị Josef.”
  alternative: “na-anabataghị Josef” ma ọ bụ “na-ejighị Josef kpọrọ ihe.”
  rationale: Okwu Grik nwere ike ịgụnye echiche nke ịghara ịnabata ma ọ bụ ịkwanyere mmadụ ùgwù, ma ọ naghị ekwu nke ahụ hoo haa. Nsụgharị ahụ na-edobe mgbagwoju anya a, ebe nkọwa ala peeji na-egosi ihe ọzọ o nwere ike ịpụta.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, dị ugwu ma dị mfe nghọta. Ahịrịokwu ahụ na-edobe usoro oge na njikọ okwu nke Grik, ma jiri “bilitere ịchị” mee ka okwu ọchịchị doo onye na-agụ ya anya.
