    text: Ma ọ bụ, “arụsị.” N’okwu Greek, ọ bụ “chi” kpọmkwem, dịka e si kwuo ya n’akụkọ Ọpụpụ. Nke a na-edebe ihe ndị ahụ n’onwe ha kwuru kama iji okwu nkọwa dochie ya.
    reason: lexical_alternative
