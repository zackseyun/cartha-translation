  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἰπόντες τῷ Ἀαρών· Ποίησον ἡμῖν θεοὺς οἳ προπορεύσονται ἡμῶν· ὁ γὰρ Μωϋσῆς οὗτος, ὃς ἐξήγαγεν ἡμᾶς ἐκ γῆς Αἰγύπτου, οὐκ οἴδαμεν τί ⸀ἐγένετο αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/040.yaml
  text: saying to Aaron[a], ‘Make gods for us who will go before us, for this Moses[b], who led us out from the land of Egypt—we do not know what has happened to him.’
translation:
  language: ig
  text: Ha gwara Erọn, sị, “Meere anyị chi[a] ndị ga-aga n’ihu anyị; n’ihi na Mozis a[b], onye kpọpụtara anyị n’ala Ijipt—anyị amaghị ihe mere ya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “arụsị.” N’okwu Greek, ọ bụ “chi” kpọmkwem, dịka e si kwuo ya n’akụkọ Ọpụpụ. Nke a na-edebe ihe ndị ahụ n’onwe ha kwuru kama iji okwu nkọwa dochie ya.
    reason: lexical_alternative
  - marker: b
    text: E nwekwara ike ikwu “banyere Mozis a” iji gosi na e mere Mozis isiokwu pụrụ iche n’ahịrịokwu a.
    reason: previous_rendering
lexical_decisions:
- source_word: εἰπόντες τῷ Ἀαρών
  choice: Ha gwara Erọn, sị
  rationale: A na-eji usoro a n’Igbo akọwa okwu e kwuru n’ụzọ dị mfe ma kwekọọ na participle εἰπόντες nke na-ewebata okwu ha.
- source_word: Ποίησον ἡμῖν
  choice: Meere anyị
  rationale: Imperative a pụtara imepụta ihe maka ha; “Meere anyị” bụ okwu Igbo doro anya ma dịrị ndụ.
- source_word: θεοὺς
  choice: chi
  rationale: θεοὺς bụ plural nke θεός. N’Igbo, “chi” anaghị agbanwe ọdịdị ya n’otutu, ndị na-esochi ya na-egosikwa na ọ bụ ọtụtụ. A hapụrụ ya dịka “chi” kama “arụsị” iji debe okwu ndị mmadụ ji kọwaa ihe ha chọrọ.
- source_word: οἳ προπορεύσονται ἡμῶν
  choice: ndị ga-ebu anyị ụzọ
  rationale: Nke a na-egosi ịga n’ihu ha ma ọ bụ iburu ha ụzọ, na-agbakwụnyeghị echiche siri ike karịa nke ngwaa Greek.
- source_word: ὁ γὰρ Μωϋσῆς οὗτος
  choice: n’ihi na Mozis a
  rationale: “N’ihi na” na-egosipụta ihe kpatara arịrịọ ahụ; “Mozis a” na-edebe demonstrative οὗτος na ụda nke ikewapụ onwe ha n’ebe ọ nọ.
- source_word: ἐξήγαγεν ἡμᾶς ἐκ γῆς Αἰγύπτου
  choice: onye kpọpụtara anyị n’ala Ijipt
  rationale: “Kpọpụtara” na-egosipụta idupụta ma ọ bụ ibupụta ha, ebe “n’ala Ijipt” na-edebe γῆς n’ụzọ Igbo dị mma.
- source_word: οὐκ οἴδαμεν τί ἐγένετο αὐτῷ
  choice: anyị amaghị ihe mere ya
  rationale: Nke a bụ ụzọ Igbo nke oge a si ekwu n'ụzọ doro anya na ha amaghị ihe dakwasịrị ya ma ọ bụ ebe ọ nọ.
theological_decisions:
- issue: Nsụgharị θεοὺς n’ọnọdụ ofufe arụsị
  choice: chi
  alternative: arụsị
  rationale: Greek kwuru θεοὺς, ya bụ “chi,” ọ bụghị okwu pụrụ iche pụtara “arụsị.” Isi okwu na-edebe nkwupụta ndị mmadụ n’onwe ha na esemokwu okpukpe dị na ya; nkọwa ala peeji na-enye ụzọ ọzọ.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke kwụ ọtọ ma dị nsọ n’ụda. “Erọn,” “Mozis,” na “Ijipt” bụ ụdị aha a na-aghọta nke ọma. Akara ogologo ahụ na-ekewapụ nkọwa gbasara Mozis na nkwubi okwu ha, ma na-eme ka okwu ahụ na-agụ nke ọma.
