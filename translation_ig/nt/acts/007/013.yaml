  text: καὶ ἐν τῷ δευτέρῳ ⸀ἀνεγνωρίσθη Ἰωσὴφ τοῖς ἀδελφοῖς αὐτοῦ, καὶ φανερὸν ἐγένετο τῷ Φαραὼ τὸ ⸀γένος Ἰωσήφ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/013.yaml
  text: And on the second visit Joseph was recognized by his brothers[b][a], and Joseph’s family became known to Pharaoh.
translation:
  language: ig
  text: Mgbe ha bịara nke ugboro abụọ, ụmụnne Josef matara onye ọ bụ[a], Fero wee mata ezinụlọ Josef[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Josef mere ka ụmụnne ya mata onye ọ bụ.” Ngwaa Grik dị n’ụdị nnara omume, ma n’akụkọ a, ọ ga-abụ na ọ na-ekwu banyere Josef ikpughere ha onye ọ bụ.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ndị ikwu Josef” ma ọ bụ “usoro ọmụmụ Josef.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῷ δευτέρῳ
  choice: mgbe ha bịara nke ugboro abụọ
  rationale: Nkebiokwu a pụtara oge nke abụọ n’usoro ihe ndị ahụ mere. Ihe gbara amaokwu ahụ gburugburu na-egosi na ọ bụ ọbịbịa ụmụnne Josef nke ugboro abụọ, ya mere ntụgharị a doro anya ma bụrụkwa Igbo e ji eme ihe ugbu a.
- source_word: ἀνεγνωρίσθη
  choice: ụmụnne Josef matara onye ọ bụ
  rationale: Ngwaa Grik dị n’ụdị nnara omume, nke nwere ike ịpụta na a matara Josef. N’akụkọ Jenesis, nke a mere mgbe Josef kpughere onye ọ bụ; ntụgharị a na-edebe echiche nke ịmata ya n’asụsụ Igbo dị mfe, ebe nkọwa ala peeji na-egosi ụzọ ọzọ e nwere isi ghọta ya.
- source_word: ἀδελφοῖς
  choice: ụmụnne Josef
  rationale: N’ebe a, okwu ahụ na-ezo aka kpọmkwem n’ụmụ nwoke ndị ha na Josef bụ otu nne na nna ma ọ bụ otu nna, ma okwu Igbo “ụmụnne” bụ ụzọ ebumpụta ụwa e si kpọọ ha n’akụkọ a.
- source_word: φανερὸν ἐγένετο
  choice: e mekwara ka ... mata
  rationale: Nke a na-egosi na ihe a bịara doo Fero anya ma ọ bụ bụrụ ihe ọ maara. Usoro a bụ Igbo kwụ ọtọ nke na-egosipụta mgbanwe ahụ gaa n’ịmara.
- source_word: γένος
  choice: ezinụlọ
  rationale: N’ebe a γένος na-ezo aka n’ebo ikwu ma ọ bụ ndị ezinụlọ Josef, ọ bụghị “agbụrụ” n’echiche nke oge a. “Ezinụlọ” bụ okwu kacha doo ndị na-agụ akwụkwọ anya.
- source_word: τῷ Φαραώ
  choice: ka Fero mata
  rationale: Dative ahụ na-egosi onye ozi banyere ezinụlọ Josef ruru. Nhazi a bụ ụzọ Igbo dị mma isi kwuo na Fero bịara mara ha.
theological_decisions:
- issue: Ma ἀνεγνωρίσθη ọ pụtara na ụmụnne Josef matara ya ka ọ bụ na Josef mere ka ha mata onye ọ bụ
  choice: ụmụnne Josef matara onye ọ bụ
  alternative: Josef mere ka ụmụnne ya mata onye ọ bụ
  rationale: Ụdị ngwaa Grik bụ passive ma na-akwado “a matara Josef,” ebe akụkọ Jenesis na-egosi na Josef kpughere onwe ya. E debere ọdịdị passive n’isiokwu, ma tinye ụzọ ọzọ ahụ na nkọwa ala peeji ka a ghara idozi ihe Grik hapụrụ ntakịrị ghe oghe.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ ahịrịokwu na-aga were were kama ịrapara n’usoro okwu Grik n’ụzọ ga-ada arọ; a ka debere passive nke nkebi mbụ na nkọwa ala peeji. E tinyere akara nkọwa [a] na [b] n’ebe okwu ndị ha na-akọwa dị.
