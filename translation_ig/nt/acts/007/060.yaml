revisions:
- from: O wee gbuo ikpere n’ala, jiri oké olu tie mkpu, sị, “Onyenwe anyị, agụnyekwala ha mmehie a.”[a] Mgbe o kwusịrị nke a, ọ dara n’ụra.[b]
  to: O wee gbuo ikpere n’ala, jiri oké olu tie mkpu, sị, “Onyenwe anyị, agụla ha mmehie a.”[a] Mgbe o kwusịrị nke a, ọ dara n’ụra.[b]
  rationale: The revision changes only the rendering of the petition’s accounting idiom. It preserves the referents, demonstrative force, prayer register, and ambiguity of the Greek while using idiomatic Standard Igbo. The footnote wording is also lightly regularized for natural Igbo.
