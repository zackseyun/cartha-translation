  text: θεὶς δὲ τὰ γόνατα ἔκραξεν φωνῇ μεγάλῃ· Κύριε, μὴ στήσῃς αὐτοῖς ⸂ταύτην τὴν ἁμαρτίαν⸃· καὶ τοῦτο εἰπὼν ἐκοιμήθη.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/060.yaml
  text: Then[a], kneeling down, he cried out with a loud voice, “Lord, do not hold this sin against them.” And after saying this[b], he fell asleep.
translation:
  language: ig
  text: O wee gbuo ikpere n’ala, jiri oké olu tie mkpu, sị, “Onyenwe anyị, agụla ha mmehie a.”[a] Mgbe o kwusịrị nke a, ọ dara n’ụra.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “Ejila mmehie a megide ha,” ma ọ bụ, “Ebokwala ha mmehie a n’isi.”
    reason: lexical_alternative
  - marker: b
    text: 'N’asụsụ Grik: “ọ dara n’ụra,” okwu a na-ejikarị ekwu maka ọnwụ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: θεὶς δὲ τὰ γόνατα
  choice: O wee gbuo ikpere n’ala
  rationale: Nkebiokwu Grik a pụtara n’ụzọ nkịtị ‘itinye ikpere,’ ya bụ igbu ikpere n’ala. ‘O wee’ na-egosi otú akụkọ ahụ si na-aga n’ihu ma na-eme ka okwu Igbo daa nke ọma.
- source_word: ἔκραξεν φωνῇ μεγάλῃ
  choice: jiri oké olu tie mkpu
  rationale: Nke a na-edobe ma omume iti mkpu ma nkwusi ike dị na ‘oké olu,’ n’Igbo doro anya ma dị ndụ.
- source_word: Κύριε
  choice: Onyenwe anyị
  rationale: Nke a bụ aha nsọpụrụ a na-ejikarị sụgharị κύριος n’Agba Ọhụrụ. N’ọnọdụ a, okwu ahụ na-agakwuru Jizọs, dịka amaokwu bu ya ụzọ na-egosi.
- source_word: μὴ στήσῃς αὐτοῖς ταύτην τὴν ἁμαρτίαν
  choice: agụnyekwala ha mmehie a
  rationale: ‘Ịgụnyere mmadụ mmehie’ na-egosipụta echiche nke idebe ma ọ bụ itinye mmehie ahụ n’akaụntụ ha. Ọ na-edobekwa ‘mmehie a’ nke ταύτην na-eme ka ọ pụta ìhè.
- source_word: καὶ τοῦτο εἰπὼν
  choice: Mgbe o kwusịrị nke a
  rationale: Nke a na-enye participle Grik ahụ n’usoro oge doro anya ma bụrụkwa Igbo e ji eme ihe ugbu a.
- source_word: ἐκοιμήθη
  choice: ọ dara n’ụra
  rationale: Ọ na-edobe ihe atụ nke ụra Grik ji kwuo ọnwụ, kama ịgbanwe ya ozugbo ka ọ bụrụ ‘ọ nwụrụ.’
theological_decisions:
- issue: Ihe atụ nke ụra na ἐκοιμήθη
  choice: ọ dara n’ụra
  alternative: ọ nwụrụ
  rationale: Grik ji ụra kwuo ọnwụ Stivin. Idebe ihe atụ ahụ na-asọpụrụ ụdị okwu na ụda nkà mmụta okpukpe dị n’amaokwu ahụ, n’etinyeghị nkọwa karịrị ihe ederede kwuru.
- issue: Aha Κύριε n’ekpere Stivin
  choice: Onyenwe anyị
  alternative: Nna ukwu
  rationale: Ihe gbara amaokwu a gburugburu na-egosi na Stivin na-agwa Jizọs okwu. ‘Onyenwe anyị’ na-edobe aha nsọpụrụ Kraịst ahụ n’enweghị itinye nkọwa nkwenkwe ọzọ n’ime amaokwu ahụ.
- issue: Echiche ikpe ma ọ bụ ịgụnye mmehie n’okwu μὴ στήσῃς αὐτοῖς
  choice: agụnyekwala ha mmehie a
  alternative: ejikwala mmehie a megide ha
  rationale: Nhọrọ a na-edobe echiche nke itinye mmehie n’akaụntụ mmadụ, ma ihe odide ala peeji na-egosi ụzọ ọzọ e si aghọta otu echiche ahụ n’Igbo.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ugwu ma dị mfe nghọta, dee ya. A hapụrụ ihe atụ ‘ịda n’ụra’ dịka ọ dị na Grik, ebe ihe odide ala peeji na-akọwa na ọ na-ezo aka n’ọnwụ.
