    text: 'N’asụsụ Grik: “ọ dara n’ụra,” okwu a na-ejikarị ekwu maka ọnwụ.'
    reason: lexical_alternative
  revision_rationale: The revision changes only the rendering of the petition’s accounting idiom. It preserves the referents, demonstrative force, prayer register, and ambiguity of the Greek while using idiomatic Standard Igbo. The footnote wording is also lightly regularized for natural Igbo.
