id: ACT.7.38
reference: Acts 7:38
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οὗτός ἐστιν ὁ γενόμενος ἐν τῇ ἐκκλησίᾳ ἐν τῇ ἐρήμῳ μετὰ τοῦ ἀγγέλου τοῦ λαλοῦντος αὐτῷ ἐν τῷ ὄρει Σινᾶ καὶ τῶν πατέρων ἡμῶν, ὃς ἐδέξατο ⸀λόγια ζῶντα δοῦναι ⸀ἡμῖν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/038.yaml
  text: This is the one who was in the assembly in the wilderness with the angel who was speaking to him on Mount Sinai[a], and with our fathers[c][b]; he received living oracles to give to us.
translation:
  language: ig
  text: Onye a bụ onye nọ n’ọgbakọ[a] n’ọzara, ya na mmụọ ozi ahụ nke na-agwa ya okwu n’Ugwu Saịnaị, nakwa ndị nna nna anyị[b]. Ọ natara okwu nsọ dị ndụ[c] ka o nye anyị.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “nzukọ”; n’ọdịnala ụfọdụ, “ụka dị n’ọzara.”
    reason: alternative_reading
  - marker: b
    text: “Ndị nna nna anyị” pụtara ndị nna ochie nke Izrel.
    reason: lexical_alternative
  - marker: c
    text: A pụkwara ịsụgharị ya “okwu ndị dị ndụ” ma ọ bụ “okwu nsọ ndị na-enye ndụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ γενόμενος
  choice: onye nọ
  rationale: N’ebe a, nkebi okwu a na-akọwa Mozis dị ka onye nọ n’etiti nzukọ ahụ; “onye nọ” bụ Igbo dị mfe ma bụrụkwa nke na-adịghị etinye nkọwa ọzọ n’ihe odide ahụ.
- source_word: ἐκκλησίᾳ
  choice: ọgbakọ
  rationale: “Ọgbakọ” na-egosi ndị Izrel zukọtara ọnụ n’ọzara, na-enweghị ibubata echiche nke nzukọ ụka nke oge e mesịrị.
- source_word: ἐρήμῳ
  choice: n’ọzara
  rationale: Nke a bụ okwu Igbo a na-ejikarị akọwa ebe ndị Izrel nọ mgbe ha na-agagharị n’ala ịkpa.
- source_word: ἀγγέλου
  choice: mmụọ ozi
  rationale: N’ọnọdụ Saịnaị a, okwu Grik a na-ezo aka n’onye ozi nke eluigwe, ọ bụghị mmadụ nkịtị zitere ozi.
- source_word: λαλοῦντος
  choice: nke na-agwa ya okwu
  rationale: Ụdị a na-eme ka omume na-aga n’ihu nke participle Grik ahụ pụta ìhè n’Igbo dị ndụ.
- source_word: ὄρει Σινᾶ
  choice: Ugwu Saịnaị
  rationale: Nke a bụ aha ebe ahụ n’ụdị dabara n’asụsụ Igbo.
- source_word: πατέρων ἡμῶν
  choice: ndị nna nna anyị
  rationale: Ọ na-ezo aka na ndị nna ochie nke Izrel ma na-edobe njirimara akụkọ ihe mere eme nke Stivin na ndị na-ege ya ntị.
- source_word: ἐδέξατο
  choice: ọ natara
  rationale: “Natara” na-egosi Mozis dị ka onye e nyere mkpughe Chineke, dịka okwu Grik ahụ si kwuo.
- source_word: λόγια
  choice: okwu nsọ
  rationale: λόγια bụ okwu sitere n’aka Chineke, ọ bụghị naanị okwu nkịtị; “okwu nsọ” na-eme ka ọdịdị mkpughe ha pụta ìhè n’Igbo a na-aghọta ngwa ngwa.
- source_word: ζῶντα
  choice: dị ndụ
  rationale: A sụgharịrị ya ozugbo dịka “dị ndụ” iji chekwaa okwu ihe odide ahụ na obosara ihe ọ pụrụ ịpụta, kama ịkọwa ya naanị dịka “na-enye ndụ.”
- source_word: δοῦναι
  choice: ka o nye
  rationale: 'Nke a na-egosi nzube nke nnata ahụ: Mozis natara okwu ndị ahụ ka o nyefee ha ndị Izrel.'
- source_word: ἡμῖν
  choice: anyị
  rationale: “Anyị” na-edobe ụzọ Stivin si jikọta onwe ya na ndị na-ege ya ntị n’akụkọ ọgbụgba ndụ Izrel.
theological_decisions:
- issue: Ma a ga-asụgharị ἐκκλησίᾳ dịka “ụka” mgbe ọ na-ekwu maka Izrel n’ọzara
  choice: ọgbakọ
  alternative: ụka; nzukọ
  rationale: “Ọgbakọ” na-egosi ndị a kpọkọtara ọnụ n’enweghị ikwubi na amaokwu ahụ na-akpọ Izrel nzukọ ụka nke ọgbụgba ndụ ọhụrụ.
- issue: Ma λόγια ζῶντα ga-abụ nkọwa doro anya dịka “okwu na-enye ndụ”
  choice: okwu nsọ dị ndụ
  alternative: okwu dị ndụ; okwu nsọ na-enye ndụ
  rationale: Nhọrọ a na-echekwa ma ọdịdị okwu ndị ahụ dịka mkpughe Chineke ma ihe omimi dị n’ịkpọ ha “ndị dị ndụ,” n’enweghị imechi ya naanị n’echiche na ha na-enye ndụ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị nsọ ma dị mfe nghọta. A họọrọ “ọgbakọ” kama “ụka” iji zere ibubata echiche ụlọ ọrụ ụka nke oge e mesịrị. “Okwu nsọ dị ndụ” na-anọ nso n’usoro na mgbagwoju ihe okwu Grik ahụ pụtara.
