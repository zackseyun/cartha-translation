  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οὐχὶ ἡ χείρ μου ἐποίησεν ταῦτα πάντα;
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/050.yaml
  text: Did not my hand make all these things?[a][b]
translation:
  language: ig
  text: Ọ̀ bụghị aka m mere ihe ndị a niile?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n’ụzọ sara mbara karị, “Ọ̀ bụghị m mere ihe ndị a niile?”
    reason: lexical_alternative
  - marker: b
    text: Ahịrịokwu a na-ekwughachi Aịzaya 66:2.
    reason: cross_reference
lexical_decisions:
- source_word: οὐχὶ
  choice: Ọ̀ bụghị
  rationale: Ọ̀ bụghị na-egosi ajụjụ nkwupụta nke na-atụ anya azịza nkwenye, kwekọrọ n’ike οὐχί nwere ebe a.
- source_word: ἡ χείρ μου
  choice: aka m
  rationale: A hapụrụ ihe oyiyi nkịtị ahụ bụ ‘aka m’ iji chekwaa asụsụ e ji akụkụ ahụ mmadụ kọwaa ọrụ Chineke nakwa njikọ ya na Aịzaya 66:2.
- source_word: ἐποίησεν
  choice: mere
  rationale: ‘Mere’ bụ okwu Igbo dị mfe ma bụrụkwa nke e ji ekwu imepụta ma ọ bụ ime ka ihe dịrị n’ọnọdụ a.
- source_word: ταῦτα πάντα
  choice: ihe ndị a niile
  rationale: Nkebi a na-echekwa ma ntụaka nke ταῦτα (‘ndị a’) ma oke zuru ezu nke πάντα (‘niile’).
theological_decisions:
- issue: Iji akụkụ ahụ mmadụ kọwaa Chineke
  choice: Idowe ‘aka m’ dịka ihe na-ezo aka n’ọrụ okike Chineke
  alternative: Ịsụgharị ya n’ụzọ sara mbara dịka ‘Ọ̀ bụghị m mere ihe ndị a niile?’
  rationale: Idowe ‘aka m’ na-echekwa ihe oyiyi dị n’amaokwu Aịzaya 66:2 nke e hotara, n’ebughị ụzọ gbanwee ya ka ọ bụrụ nkọwa nkà mmụta okpukpe.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A hapụrụ usoro ajụjụ nkwupụta na ihe oyiyi ‘aka m,’ ebe ihe odide ala ala peeji na-enye nsụgharị sara mbara karị.
