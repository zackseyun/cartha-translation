  to: O nyekwara ya ọgbụgba ndụ nke ibi úgwù. Ya mere, Ebreham mụrụ Aịzik, birikwa ya úgwù n’ụbọchị nke asatọ. Aịzik mụrụ Jekọb, Jekọb mụrụ ndị nna ochie iri na abụọ ahụ.
