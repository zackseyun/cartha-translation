id: ACT.7.8
reference: Acts 7:8
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἔδωκεν αὐτῷ διαθήκην περιτομῆς· καὶ οὕτως ἐγέννησεν τὸν Ἰσαὰκ καὶ περιέτεμεν αὐτὸν τῇ ἡμέρᾳ τῇ ὀγδόῃ, ⸀καὶ Ἰσαὰκ τὸν Ἰακώβ, ⸁καὶ Ἰακὼβ τοὺς δώδεκα πατριάρχας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/008.yaml
  text: And he gave him the covenant of circumcision. And so he fathered Isaac and circumcised him on the eighth day, and Isaac fathered Jacob, and Jacob the twelve patriarchs.
translation:
  language: ig
  text: O nyekwara ya ọgbụgba ndụ nke ibi úgwù. Ya mere, Ebreham mụrụ Aịzik, birikwa ya úgwù n’ụbọchị nke asatọ. Aịzik mụrụ Jekọb, Jekọb mụrụ ndị nna ochie iri na abụọ ahụ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διαθήκην περιτομῆς
  choice: ọgbụgba ndụ nke ibi úgwù
  rationale: “Ọgbụgba ndụ” bụ okwu Igbo doro anya maka διαθήκη n’ọnọdụ akụkọ Akwụkwọ Nsọ a; “nke ibi úgwù” na-egosi ọgbụgba ndụ ahụ e ji ibi úgwù mara, dị ka Jenesis 17 si kọwaa.
- source_word: οὕτως
  choice: Ya mere
  rationale: Nke a na-edobe njikọ dị n’etiti inye ọgbụgba ndụ ahụ na ihe sochiri ya, ma na-ada ka Igbo nke oge a.
- source_word: ἐγέννησεν
  choice: mụrụ
  rationale: N’usoro ọmụmụ a, “mụrụ” na-egosi na nwoke ahụ ghọrọ nna onye a kpọrọ aha; ọ bụ okwu Igbo dị mfe ma bụrụkwa nke a na-ejikarị akọ usoro ọmụmụ.
- source_word: περιέτεμεν
  choice: birikwa ya úgwù
  rationale: “Ibi úgwù” bụ okwu Igbo a na-ahụkarị maka omume περιτέμνω; “ya” na-egosi Aịzik dịka onye e mere ya.
- source_word: τῇ ἡμέρᾳ τῇ ὀγδόῃ
  choice: n’ụbọchị nke asatọ
  rationale: Nke a na-asụgharị nkebi oge ahụ ozugbo, n’etinyeghị “mgbe a mụsịrị ya,” nke na-adịghị n’ederede Grik.
- source_word: πατριάρχας
  choice: ndị nna ochie
  rationale: N’ebe a okwu ahụ na-ezo aka n’ụmụ nwoke iri na abụọ bụ ndị nna malitere ebo Izrel; “ndị nna ochie” bụ Igbo kwụ ọtọ ma ghọta ya ngwa ngwa.
- source_word: Ἰσαὰκ / Ἰακώβ
  choice: Aịzik / Jekọb
  rationale: E ji ụdị aha ndị a a maara nke ọma n’Igbo mee ihe, kama ịsụgharị ihe aha ndị ahụ pụtara.
theological_decisions:
- issue: Ịkọwa kpọmkwem ọgbụgba ndụ e nyere Ebreham
  choice: ọgbụgba ndụ nke ibi úgwù
  alternative: otu ọgbụgba ndụ ibi úgwù
  rationale: Ederede a na-ezo aka n’ọgbụgba ndụ a kapịrị ọnụ Chineke nyere Ebreham, karịchaa nke a kọrọ na Jenesis 17; nhazi okwu a na-egosi na ọ bụ nke a maara kpọmkwem n’etinyeghị nkọwa okpukpe ọzọ.
- issue: Okwu e ji kọ usoro ọmụmụ maka γεννάω
  choice: mụrụ
  alternative: ghọrọ nna nke
  rationale: “Mụrụ” na-edobe usoro ọmụmụ sitere n’aka ndị nna n’ụzọ Igbo dị ndụ ma dị nkenke; a naghị agbanwe ya ka ọ bụrụ naanị mmekọrịta nna na nwa nke nwere ike ime ka ike okwu γεννάω belata.
- issue: Onye mere ibi úgwù
  choice: Ebreham mụrụ Aịzik, birikwa ya úgwù
  alternative: A mụrụ Aịzik, e biekwa ya úgwù
  rationale: Isiokwu nwoke nke ngwaa Grik abụọ ahụ bụ Ebreham; ntụgharị a na-eme ka nke ahụ doo anya n’agbanyeghị na aha ya adịghị n’amaokwu Grik a n’onwe ya, ebe ọ bụ onye “ya” nke ahịrịokwu bu ụzọ.
translation_notes:
  register: Asụsụ ahụ bụ Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E jiri “úgwù” dee ụdaume ya iji kewapụ okwu ahụ n’ụdị ndị ọzọ nwere ike ịdị mgbagwoju anya. Aha “Ebreham” bụ ntụaka doro anya nye onye nnọchiaha αὐτῷ na isiokwu ngwaa sitere n’amaokwu ndị bu ụzọ, ma ọ na-enyere onye na-agụ Igbo aka ịghọta ahịrịokwu ahụ n’enweghị mgbagwoju anya.
