revisions:
- from: Olee onye n’ime ndị amụma ndị nna unu[c] na-akpagbughị? Ha gbukwara ndị buru ụzọ kwuo maka ọbịbịa Onye Ezi Omume ahụ[a]. Ma ugbu a, unu aghọọla ndị raara Onye ahụ nye na ndị gburu ya[b].
  to: Olee onye n'ime ndị amụma ka ndị nna unu[c] kpagbughị? Ha gburu ndị buru ụzọ kwuo maka ọbịbịa Onye Ziri Ezi ahụ[a], onye unu aghọọla ugbu a ndị raara ya nye na ndị gburu ya[b].
  rationale: The revision corrects the historical verbal reference, removes connective and emphatic nuances not explicit in the source, and uses a more natural Standard Igbo title for the Righteous One. It also revises the ancestry footnote so that its alternative accurately communicates the broader sense of 'ancestors' while noting the Greek's literal 'fathers.'
