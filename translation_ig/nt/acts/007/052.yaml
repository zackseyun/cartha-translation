id: ACT.7.52
reference: Acts 7:52
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τίνα τῶν προφητῶν οὐκ ἐδίωξαν οἱ πατέρες ὑμῶν; καὶ ἀπέκτειναν τοὺς προκαταγγείλαντας περὶ τῆς ἐλεύσεως τοῦ δικαίου οὗ νῦν ὑμεῖς προδόται καὶ φονεῖς ⸀ἐγένεσθε,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/052.yaml
  text: Which of the prophets did your fathers not persecute? And they killed those who announced beforehand the coming of the Righteous One[a], of whom you have now become betrayers and murderers[c][b],
translation:
  language: ig
  text: Olee onye n'ime ndị amụma ka ndị nna unu[c] kpagbughị? Ha gburu ndị buru ụzọ kwuo maka ọbịbịa Onye Ziri Ezi ahụ[a], onye unu aghọọla ugbu a ndị raara ya nye na ndị gburu ya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Onye Ezi Omume ahụ.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ndị sabara ya na ndị ogbu mmadụ.”
    reason: lexical_alternative
  - marker: c
    text: A pụkwara ịsụgharị “ndị nna unu” dịka “ndị nna ochie unu”; okwu Grik n’onwe ya pụtara “ndị nna.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τίνα τῶν προφητῶν
  choice: Olee onye n’ime ndị amụma
  rationale: Nke a na-egosipụta usoro nkewa dị na Grik ma na-edokwa ike ajụjụ ahụ nke na-atụ anya azịza, ‘ọ dịghị onye.’
- source_word: ἐδίωξαν
  choice: na-akpagbughị
  rationale: ‘Ịkpagbu’ na-egosi ịchụ na imegbu ndị amụma n’ihi ozi ha, kama ịbụ naanị ịchụ mmadụ ọsọ.
- source_word: οἱ πατέρες ὑμῶν
  choice: ndị nna unu
  rationale: Nke a na-esochi okwu Grik n’ụzọ chiri anya ma na-edokwa njikọ ebubo Stivin mere n’etiti ndị na-ege ya ntị na ndị nna ha; ihe odide ala peeji na-enye ‘ndị nna nna unu’ dị ka ụzọ ọzọ doro anya.
- source_word: ἀπέκτειναν
  choice: Ha gbukwara
  rationale: ‘Igbu’ bụ okwu Igbo doro anya nke na-enye ihe aorist ahụ n’enweghị okwu ochie ma ọ bụ nkọwa agbakwunyere.
- source_word: τοὺς προκαταγγείλαντας περὶ τῆς ἐλεύσεως
  choice: ndị buru ụzọ kwuo maka ọbịbịa
  rationale: ‘Buru ụzọ kwuo’ na-echekwa echiche nke nkwupụta e mere tupu oge ahụ, ebe ‘ọbịbịa’ na-egosipụta ἔλευσις n’ụzọ nkịtị.
- source_word: τοῦ δικαίου
  choice: Onye Ezi Omume ahụ
  rationale: Nke a na-arụ ọrụ dịka aha e ji amata otu onye kpọmkwem n’okwu a, ma na-egosipụta ezi omume nke δίκαιος n’Igbo a na-aghọta ngwa ngwa.
- source_word: οὗ νῦν ὑμεῖς προδόται καὶ φονεῖς ἐγένεσθε
  choice: Ma ugbu a, unu aghọọla ndị raara Onye ahụ nye na ndị gburu ya
  rationale: E kewara ahịrịokwu ahụ maka Igbo dị ire, ma e chekwara ‘ugbu a,’ ọnọdụ ha ghọrọ, na ebubo abụọ ahụ. Ikwughachi ‘Onye ahụ’ na-eme ka njikọ nnọchiaha Grik doo anya n’Igbo.
theological_decisions:
- issue: τοῦ δικαίου dịka aha na-ezo aka na Jizọs
  choice: Onye Ezi Omume ahụ
  alternative: Onye Ziri Ezi ahụ
  rationale: Akụkụ okwu Stivin na-ezo aka n’otu onye ndị amụma buru ụzọ kwuo banyere ọbịbịa ya. Mkpụrụedemede ukwu na ‘ahụ’ na-egosi na ọ bụ aha e ji amata onye ahụ, n’agbakwụnyeghị ozizi ọzọ.
- issue: Ike ebubo dị na προδόται καὶ φονεῖς
  choice: ndị raara Onye ahụ nye na ndị gburu ya
  alternative: ndị sabara ya na ndị ogbu mmadụ
  rationale: Nhọrọ bụ isi na-egosipụta omume ịrara Jizọs nye na igbu ya n’Igbo nkịtị, ma zere ime ka προδόται bụrụ naanị okwu ndọrọ ndọrọ ọchịchị.
translation_notes:
  register: Asụsụ ahụ bụ Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E ji ‘Ha gbukwara’ chekwaa καὶ n’enweghị itinye nkwusi ike ọzọ. E kewara nkebi ikpeazụ ka ọ bụrụ ahịrịokwu ọhụrụ iji mee ka Igbo na-aga were were, ma njikọ ya na Onye Ezi Omume ahụ ka doro anya.
