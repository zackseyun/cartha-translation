id: ACT.7.34
reference: Acts 7:34
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἰδὼν εἶδον τὴν κάκωσιν τοῦ λαοῦ μου τοῦ ἐν Αἰγύπτῳ, καὶ τοῦ στεναγμοῦ ⸀αὐτοῦ ἤκουσα, καὶ κατέβην ἐξελέσθαι αὐτούς· καὶ νῦν δεῦρο ⸀ἀποστείλω σε εἰς Αἴγυπτον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/034.yaml
  text: I have surely seen the mistreatment of my people in Egypt[a], and I have heard their groaning, and I have come down to deliver them. And now come[b], I will send you to Egypt.
translation:
  language: ig
  text: “N’ezie, ahụla m mmekpa ahụ ndị m nọ n’Ijipt na-ata[a], anụwokwa m ude ha, agbadatawokwa m ịnapụta ha[b]. Ugbu a, bịa, m ga-eziga gị n’Ijipt.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị “ahụhụ” ma ọ bụ “mmeso ọjọọ” n’ọnọdụ “mmekpa ahụ.”
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsị “ịzọpụta ha” n’ọnọdụ “ịnapụta ha.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν εἶδον
  choice: N’ezie, ahụla m
  rationale: E ji ‘N’ezie’ gosipụta nkwusi ike dị n’usoro okwu Grik ahụ n’Igbo na-ada nke ọma, kama ịsụgharị ya n’ụzọ isiike dị ka ‘n’ịhụ, ahụrụ m.’
- source_word: κάκωσιν
  choice: ahụhụ ... na-ata
  rationale: Nke a bụ okwu Igbo doro anya maka nhụjuanya sitere ná mmeso ọjọọ; ọ hapụkwara ohere maka echiche ‘mkpagbu’ n’enweghị ime ka okwu ahụ dị warara karịa isi Grik.
- source_word: λαοῦ μου τοῦ ἐν Αἰγύπτῳ
  choice: ndị m nọ n’Ijipt
  rationale: ‘Ndị m’ bụ ụzọ Igbo nkịtị ma dị ùgwù isi kwuo ‘my people,’ ebe ‘nọ n’Ijipt’ na-egosi ebe ha nọ n’enweghị okwu gabigara ókè.
- source_word: τοῦ στεναγμοῦ αὐτοῦ
  choice: ude ha
  rationale: Ọ bụ ezie na nnọchiaha Grik dị n’otu, ọ na-ezo aka n’ìgwè ndị ahụ; Igbo na-eji ‘ha’ eme nke a nke ọma. ‘Ude’ na-egosipụta ịsụ ude n’ihi ahụhụ.
- source_word: κατέβην
  choice: agbadatawokwa m
  rationale: Nke a na-echekwa okwu ihe oyiyi ahụ banyere Chineke ịgbadata, n’akọwaghị ya ma ọ bụ wepụ esemokwu nkà mmụta okpukpe dị n’ime ya.
- source_word: ἐξελέσθαι
  choice: ịnapụta ha
  rationale: ‘Ịnapụta’ na-egosi iwepụ mmadụ n’ihe ize ndụ ma ọ bụ n’okpuru mmegbu, ma bụrụ okwu Igbo doro anya na nke kwesịrị ekwesị n’ebe a.
- source_word: δεῦρο
  choice: bịa
  rationale: ‘Bịa’ na-enye kpọmkwem òkù/ntụziaka dị n’okwu Grik n’Igbo nkịtị.
- source_word: ἀποστείλω σε εἰς Αἴγυπτον
  choice: m ga-eziga gị n’Ijipt
  rationale: Nke a na-echekwa ọdịnihu kpọmkwem nke ngwaa Grik na ebe a na-eziga Mosis.
theological_decisions:
- issue: Okwu mmadụ e ji kọwaa Chineke ịgbadata
  choice: agbadatawokwa m
  alternative: abịawokwa m
  rationale: A hapụrụ ihe oyiyi nke ‘ịgbadata’ dịka isi mmalite si kwuo ya, kama ịkọwa ya dịka naanị ‘ịbịa’ ma si otú ahụ mee ka esemokwu dị n’okwu ahụ laa n’iyi.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe nghọta ma dịkwa ùgwù. Usoro ahịrịokwu ahụ na-echekwa nkwusi ike, usoro omume atọ Chineke kwuru—ịhụ, ịnụ, na ịgbadata—na okwu iziga Mosis. E debere akara ntụaka ụkwụ [a] na [b] n’akụkụ okwu ndị ha na-akọwa.
