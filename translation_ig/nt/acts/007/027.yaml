  text: ὁ δὲ ἀδικῶν τὸν πλησίον ἀπώσατο αὐτὸν εἰπών· Τίς σε κατέστησεν ἄρχοντα καὶ δικαστὴν ἐφ’ ⸀ἡμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/027.yaml
  text: But the man who was wronging his neighbor pushed him away[a], saying, ‘Who appointed you ruler and judge over us?’
translation:
  language: ig
  text: Ma nwoke ahụ na-eme onye agbata obi ya ihe na-ezighị ezi kwapụrụ ya[a], sị, “Ònye họpụtara gị ịbụ onye ọchịchị na onye ikpe n'elu anyị?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “chụpụrụ ya n'akụkụ.” Ngwaa Grik ahụ nwere ike imesi ikwapụ mmadụ n'ike ma ọ bụ ịjụ ya n'ụzọ siri ike ike.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀδικῶν
  choice: na-emeso ... ikpe na-ezighị ezi
  rationale: Ọ na-egosi omume na-aga n'ihu nke ime mmadụ ihe na-ezighị ezi, ma debe echiche bụ isi nke ἀδικέω karịa okwu sara mbara dịka ‘na-emegbu.’
- source_word: πλησίον
  choice: onye agbata obi ya
  rationale: Nke a bụ ụzọ Igbo kwụ ọtọ si akọwa onye nọ mmadụ nso ma ọ bụ onye ibe ya; ọ naghị akọwapụta karịa ihe Grik kwuru.
- source_word: ἀπώσατο
  choice: chụpụrụ ya n'akụkụ
  rationale: Ọ na-egosi ịchụpụ mmadụ n'ụzọ nwere ike ịbụ nke anụ ahụ ma ọ bụ nke ịjụ ya n'ụzọ siri ike, dịka ọnọdụ akụkọ ahụ si dị.
- source_word: κατέστησεν
  choice: mere gị
  rationale: N'okwu a, ‘mere gị onye ọchịchị’ bụ Igbo e ji eme ihe n'ụzọ dị mfe ma na-ebute echiche nke ịhọpụta ma ọ bụ idobe mmadụ n'ọkwa.
- source_word: ἄρχοντα
  choice: onye ọchịchị
  rationale: Ọ na-egosi onye nwere ikike ịchị, kwekọọkwa n'okwu Grik ahụ.
- source_word: δικαστὴν
  choice: onye ikpe
  rationale: Nke a bụ okwu Igbo doro anya maka onye na-ekpe ikpe, ma debe njikọ ya na ‘onye ọchịchị.’
- source_word: ἐφ’ ἡμῶν
  choice: n'isi anyị
  rationale: Akpaala okwu Igbo a na-egosi ịchị ma ọ bụ inwe ikike n'ebe ndị ọzọ nọ, nke dabara n'ajụjụ a na-ajụ banyere ikike Mosis.
