revisions:
- from: Ma nwoke ahụ nke na-emeso onye agbata obi ya ikpe na-ezighị ezi chụpụrụ ya n'akụkụ[a], sị, “Ònye mere gị onye ọchịchị na onye ikpe n'isi anyị?”
  to: Ma nwoke ahụ na-eme onye agbata obi ya ihe na-ezighị ezi kwapụrụ ya[a], sị, “Ònye họpụtara gị ịbụ onye ọchịchị na onye ikpe n'elu anyị?”
  rationale: The revision more closely reflects the forceful dismissive action of ἀπώσατο, improves idiomatic Standard Igbo, and makes the authority relation explicit. The footnote preserves the alternative nuance without over-interpreting the scene.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T08:28:50Z'
review_pass:
  verdict: revise
  source_fidelity: The draft conveys the continuing injustice of ἀδικῶν and correctly retains the two offices, but “chụpụrụ ya n'akụkụ” can suggest driving/expelling someone aside rather than the concrete forceful repulse of ἀπώσατο. “n'elu anyị” is the clearer ordinary Igbo equivalent for authority exercised ‘over us.’
  naturalness: 'The revision uses more idiomatic modern Standard Igbo: “na-eme ... ihe na-ezighị ezi” is smoother than “na-emeso ... ikpe na-ezighị ezi,” and “kwapụrụ ya” naturally expresses pushing someone away.'
  terminology: “onye ọchịchị” and “onye ikpe” accurately represent ἄρχων and δικαστής. “Họpụtara gị ịbụ” explicitly and naturally conveys appointment to an office in this context without adding doctrinal interpretation.
  issues:
  - severity: medium
    issue: The rendering of ἀπώσατο is imprecise.
    rationale: “Chụpụrụ ya n'akụkụ” tends toward driving or sending someone away, whereas the Greek describes thrusting/pushing Moses away in the immediate confrontation. “Kwapụrụ ya” better preserves the physical, dismissive action.
  - severity: low
    issue: The idiom for ἐφ’ ἡμῶν can be clearer.
    rationale: Although “n'isi anyị” can denote rule, “n'elu anyị” is the more direct and widely natural wording for ‘over us’ in a challenge to authority.
  - severity: low
    issue: The footnote contains a duplicated word and its alternative should match the revised main rendering.
    rationale: “ike ike” is an accidental repetition. The note is revised to give a meaningful alternate while retaining the lexical ambiguity between physical repulse and firm rejection.
  revised_text: Ma nwoke ahụ na-eme onye agbata obi ya ihe na-ezighị ezi kwapụrụ ya[a], sị, “Ònye họpụtara gị ịbụ onye ọchịchị na onye ikpe n'elu anyị?”
