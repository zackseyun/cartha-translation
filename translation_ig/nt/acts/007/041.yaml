id: ACT.7.41
reference: Acts 7:41
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἐμοσχοποίησαν ἐν ταῖς ἡμέραις ἐκείναις καὶ ἀνήγαγον θυσίαν τῷ εἰδώλῳ, καὶ εὐφραίνοντο ἐν τοῖς ἔργοις τῶν χειρῶν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/041.yaml
  text: And in those days they made a calf and offered a sacrifice to the idol[b][a], and they were rejoicing in the works of their hands.
translation:
  language: ig
  text: N’ụbọchị ndị ahụ, ha kpụrụ nwa ehi[a], chụọrọ arụsị ahụ àjà, na-aṅụrịkwa ọṅụ n’ọrụ aka ha.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ha mere nwa ehi.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “na-aṅụrị ọṅụ n’ihe aka ha mere.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμοσχοποίησαν
  choice: ha kpụrụ nwa ehi
  rationale: “Kpụ” na-egosi imepụta ihe n’ụdị a chọrọ, ya mere ọ na-ebute echiche nke ịkpụpụta nwa ehi nke ọma; okwu na-esochi, “arụsị ahụ,” emeela ka o doo anya na ọ bụ arụsị.
- source_word: ἐν ταῖς ἡμέραις ἐκείναις
  choice: N’ụbọchị ndị ahụ
  rationale: Nke a bụ okwu oge doro anya ma kwekọọ n’usoro Grik, bụrụkwa Igbo a na-asụ nke ọma.
- source_word: ἀνήγαγον θυσίαν
  choice: chụọrọ ... àjà
  rationale: “Ịchụ àjà” bụ ụzọ Igbo kwesịrị ekwesị isi kwuo omume ịchụ ma ọ bụ inye àjà n’ofufe.
- source_word: τῷ εἰδώλῳ
  choice: arụsị ahụ
  rationale: Ngosi aha ahụ na-atụ aka kpọmkwem n’oyiyi nwa ehi a ka kpọtụrụ aha; “arụsị” na-echekwa ụda nkatọ dị na εἴδωλον.
- source_word: εὐφραίνοντο
  choice: na-aṅụrịkwa ọṅụ
  rationale: Ụdị na-aga n’ihu na-egosipụta imperfect Grik, nke na-akọwa ọṅụ ha dị ka ihe na-aga n’ihu n’oge ahụ.
- source_word: ἐν τοῖς ἔργοις τῶν χειρῶν αὐτῶν
  choice: n’ọrụ aka ha
  rationale: Nke a na-echekwa ihe oyiyi na ụda nkatọ Akwụkwọ Nsọ banyere ihe mmadụ ji aka ya rụọ, n’enweghị ịkọwa ya karịa ihe ederede kwuru.
theological_decisions:
- issue: Asụsụ arụsị na ike nkatọ ya
  choice: Jiri “arụsị” ma debe “ọrụ aka ha.”
  alternative: Jiri “oyiyi” na “ihe aka ha mere.”
  rationale: “Arụsị” na-echekwa nkatọ okpukpe dị na εἴδωλον, ebe “ọrụ aka ha” na-edebe nkwughachi okwu Akwụkwọ Nsọ banyere ife ihe mmadụ ji aka ya rụọ.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E debere usoro ahịrịokwu ahụ n'ụzọ eke n’Igbo, ma chekwaa ọdịdị omume na-aga n’ihu na ụda nkatọ megide arụsị.
