  text: ἐνόμιζεν δὲ συνιέναι τοὺς ⸀ἀδελφοὺς ὅτι ὁ θεὸς διὰ χειρὸς αὐτοῦ δίδωσιν ⸂σωτηρίαν αὐτοῖς⸃, οἱ δὲ οὐ συνῆκαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/025.yaml
  text: He supposed that his brothers understood that God was giving them deliverance through his hand[b][a], but they did not understand.
translation:
  language: ig
  text: O chere na ụmụnne ya[a] ghọtara na Chineke na-enye ha nnapụta site n'aka Mosis[b], ma ha aghọtaghị.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ụmụnne ya” na-ezo aka n’ebe a na ndị Izrel ibe Mosis nọ. Okwu Grik ahụ bụ okwu ikwu metụtara ụmụnne nwoke, n’ụdị ọtụtụ.
    reason: cultural_note
  - marker: b
    text: A pụkwara ịsụgharị ya “nzọpụta.” Okwu Grik nwere ike ịpụta nnapụta, ịzọpụta, ma ọ bụ nzọpụta; n’ebe a, ihe gbara ya gburugburu na-arụtụ aka na nnapụta Izrel Chineke ga-arụ site n'aka Mosis.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνόμιζεν
  choice: O chere
  rationale: Ụdị gara aga na-egosi ihe Mosis nọ na-eche n'ọnọdụ ahụ; “O chere” bụ ụzọ Igbo dị mfe ma bụrụkwa nke ebumpụta ụwa isi kwuo ya.
- source_word: συνιέναι / συνῆκαν
  choice: ghọtara / aghọtaghị
  rationale: Iji otu mgbọrọgwụ okwu ahụ ugboro abụọ na-echekwa nkwugharị na ọdịiche dị n'okwu Grik.
- source_word: ἀδελφοὺς
  choice: ụmụnne ya
  rationale: Nke a na-echekwa okwu ikwu nwanne nke Grik, ebe ndị a na-ekwu maka ha bụ ndị Izrel ibe Mosis.
- source_word: διὰ χειρὸς αὐτοῦ
  choice: ji aka ya
  rationale: Nke a na-echekwa onyonyo “aka” nke Grik ma na-egosikwa na Chineke ga-eji Mosis rụọ ọrụ ahụ.
- source_word: δίδωσιν
  choice: na-enye
  rationale: Oge ugbu a dị n'okwu Grik nọ n'ime echiche e kwuru; “na-enye” na-echekwa omume ahụ dịka ihe na-aga n'ihu.
- source_word: σωτηρίαν
  choice: nzọpụta
  rationale: “Nzọpụta” nwere ike ịpụta ịnapụta mmadụ n'ihe ize ndụ ma ọ bụ nzọpụta n'ụzọ sara mbara; nkọwa ala peeji na-eme ka uche dị n'akụkọ a doo anya.
- source_word: αὐτοῖς
  choice: ha
  rationale: Ọ na-egosi ndị ga-anata nzọpụta ahụ n'ụzọ Igbo dị mma.
theological_decisions:
- issue: Uche σωτηρία n'akụkọ Mosis
  choice: nzọpụta
  alternative: nnapụta
  rationale: “Nzọpụta” na-echekwa obosara okwu Grik, ebe nkọwa ala peeji na-akọwa na n'ọnọdụ a ọ na-elekwasị anya na nnapụta Izrel site n'ahụhụ Ijipt; nke a anaghị amachi okwu ahụ naanị n'echiche ime mmụọ.
translation_notes:
  register: Igbo ọkọlọtọ nke oge a, dị mfe ma dị ùgwù. E debere onyonyo “aka” na nkwugharị “ghọtara/agaghị aghọta” nke ihe odide Grik; akara nkọwa ala peeji niile dị n'ahịrị isi.
