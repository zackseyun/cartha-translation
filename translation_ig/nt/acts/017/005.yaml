revisions:
- from: Ma ndị Juu, n’ihi ekworo, kpọọrọ ụfọdụ ndị ajọ omume nọ n’ahịa sonyere ha. Ha kpọkọtara ìgwè ọgbaaghara ma kpalite ọgbaaghara n’obodo ahụ. Mgbe ha bịarutere n’ụlọ Jesọn, ha nọ na-achọ ịkpọpụta ha ka ha gaa n’ihu ọgbakọ ọha[a].
  to: Ma ndị Juu, ebe ekworo jidere ha, kpọọrọ ụfọdụ ndị nwoke ajọ omume sitere n’ahịa. Ha kpọkọtara ìgwè mmadụ, ma na-akpata ọgbaaghara n’obodo ahụ. Ha bịara n’ụlọ Jesọn, na-achọ ibute ha n’ihu ọgbakọ ọha[a].
  rationale: The revision corrects the unnatural rendering of mob formation, explicitly retains the source’s reference to male wrongdoers, gives the jealousy participle a natural motivating sense, and renders the intended presentation before the civic assembly more precisely. It retains the three-sentence Igbo structure, the ongoing force of ἐθορύβουν and ἐζήτουν through “na-akpata” and “na-achọ,” and the Greek pronoun’s contextual ambiguity.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T09:20:15Z'
review_pass:
  verdict: revise
  source_fidelity: The draft generally follows the Greek sequence and preserves the unspecified referent of αὐτούς. However, “ìgwè ọgbaaghara” is not a natural or accurate Igbo expression for ὄχλον ποιεῖν, and “ịkpọpụta” can overfocus on calling people out rather than bringing them before the civic body. The revision renders the hostile crowd and the intended public presentation more directly while retaining the source’s ambiguity about the persons sought.
  naturalness: Several expressions are understandable, but “kpọkọtara ìgwè ọgbaaghara” is awkward in Standard Igbo. “Ebe ekworo jidere ha,” “kpọkọtara ìgwè mmadụ,” and “ibute ha n’ihu ọgbakọ ọha” are more idiomatic and maintain the elevated narrative register.
  terminology: “ndị Juu” correctly reflects οἱ Ἰουδαῖοι without interpretively narrowing its reference. “Ụfọdụ ndị nwoke ajọ omume” retains the explicitly male ἄνδρας. “Ọgbakọ ọha” appropriately conveys δῆμος as a civic/public assembly, with the footnote preserving alternatives.
  issues:
  - severity: medium
    issue: “ìgwè ọgbaaghara” for ὀχλοποιήσαντες
    rationale: This phrase is not idiomatic Standard Igbo and can sound like an abstract ‘group of disorder.’ The Greek denotes making/gathering a crowd, hostile in context. “kpọkọtara ìgwè mmadụ” is natural; the following clause carries the uproar sense.
  - severity: low
    issue: “n’ihi ekworo” does not fully express the participle’s ingressive/motivating force
    rationale: It is understandable, but “ebe ekworo jidere ha” more naturally portrays jealousy as having arisen and motivated their following actions.
  - severity: medium
    issue: “ịkpọpụta ha” for προαγαγεῖν
    rationale: It may mean simply call them out. In this public-judicial context, προαγαγεῖν means bring/lead them before the δημόs. “ibute ha n’ihu ọgbakọ ọha” conveys that function without identifying the persons or adding a formal charge.
  revised_text: Ma ndị Juu, ebe ekworo jidere ha, kpọọrọ ụfọdụ ndị nwoke ajọ omume sitere n’ahịa. Ha kpọkọtara ìgwè mmadụ, ma na-akpata ọgbaaghara n’obodo ahụ. Ha bịara n’ụlọ Jesọn, na-achọ ibute ha n’ihu ọgbakọ ọha[a].
  revised_footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “n’ihu ọgbakọ ndị obodo” ma ọ bụ “n’ihu ọha mmadụ.” Okwu Grik bụ δῆμος, nke na-ezo aka n’òtù ndị obodo zukọtara n’ihu ọha, ọ bụghị naanị ìgwè mmadụ a na-akọwaghị.
    reason: lexical_alternative
  revision_rationale: The revision corrects the unnatural rendering of mob formation, explicitly retains the source’s reference to male wrongdoers, gives the jealousy participle a natural motivating sense, and renders the intended presentation before the civic assembly more precisely. It retains the three-sentence Igbo structure, the ongoing force of ἐθορύβουν and ἐζήτουν through “na-akpata” and “na-achọ,” and the Greek pronoun’s contextual ambiguity.
