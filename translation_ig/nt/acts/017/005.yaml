id: ACT.17.5
reference: Acts 17:5
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸂ζηλώσαντες δὲ οἱ Ἰουδαῖοι καὶ προσλαβόμενοι⸃ τῶν ἀγοραίων ⸂ἄνδρας τινὰς⸃ πονηροὺς καὶ ὀχλοποιήσαντες ἐθορύβουν τὴν πόλιν, ⸂καὶ ἐπιστάντες⸃ τῇ οἰκίᾳ Ἰάσονος ἐζήτουν αὐτοὺς ⸀προαγαγεῖν εἰς τὸν δῆμον·
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/005.yaml
  text: But the Jews[a], becoming jealous and taking along some wicked men from the marketplace, formed a mob and were throwing the city into an uproar; and coming to Jason’s house, they were seeking to bring them out to the assembly.
translation:
  language: ig
  text: Ma ndị Juu, ebe ekworo jidere ha, kpọọrọ ụfọdụ ndị nwoke ajọ omume sitere n’ahịa. Ha kpọkọtara ìgwè mmadụ, ma na-akpata ọgbaaghara n’obodo ahụ. Ha bịara n’ụlọ Jesọn, na-achọ ibute ha n’ihu ọgbakọ ọha[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “n’ihu ọgbakọ ndị obodo” ma ọ bụ “n’ihu ọha mmadụ.” Okwu Grik bụ δῆμος, nke na-ezo aka n’òtù ndị obodo zukọtara n’ihu ọha, ọ bụghị naanị ìgwè mmadụ a na-akọwaghị.
    reason: lexical_alternative
lexical_decisions:
- source_word: ζηλώσαντες
  choice: n’ihi ekworo
  rationale: Ọ na-egosi ihe kpaliri omume ndị sochirinụ. Nke a na-ebuga echiche ekworo n’Igbo n’enweghị ịgbakwunye nkọwa ọzọ.
- source_word: οἱ Ἰουδαῖοι
  choice: ndị Juu
  rationale: Ederede Grik kwuru kpọmkwem ‘ndị Juu’; a naghị agbanwe ya ka ọ bụrụ ‘ndị isi Juu,’ ebe okwu ahụ n’onwe ya emeghị ka ọ dị warara otú ahụ.
- source_word: προσλαβόμενοι
  choice: kpọọrọ ... sonyere ha
  rationale: Nke a na-egosi na ha tinyere ndị ọzọ n’otu ha, ma ọ naghị ekwu hoo haa na ha goro ha ọrụ.
- source_word: τῶν ἀγοραίων
  choice: ndị ... nọ n’ahịa
  rationale: Ọ na-egosi ndị a hụrụ ma ọ bụ ndị na-anọ n’ámá ahịa, na-enweghị ịgbakwunye nkọwa dịka ndị umengwụ.
- source_word: ἄνδρας τινὰς πονηρούς
  choice: ụfọdụ ndị ajọ omume
  rationale: Ọ na-echekwa ọnụọgụ na nkọwa omume ọjọọ nke πονηρούς n’asụsụ Igbo dị ugbu a.
- source_word: ὀχλοποιήσαντες
  choice: kpọkọtara ìgwè ọgbaaghara
  rationale: Ọ na-egosi ịchịkọta ìgwè mmadụ nwere ebumnobi ịkpalite nsogbu, karịa naanị ịkpọkọta ndị mmadụ n’ụzọ nkịtị.
- source_word: ἐθορύβουν τὴν πόλιν
  choice: kpalite ọgbaaghara n’obodo ahụ
  rationale: Ọ na-ebuga echiche nke ime ka obodo nọgide na-enwe mkpọtụ na ọgbaaghara; usoro akụkọ Igbo na-eme ka omume ahụ doo anya.
- source_word: ἐπιστάντες τῇ οἰκίᾳ Ἰάσονος
  choice: Mgbe ha bịarutere n’ụlọ Jesọn
  rationale: ἐφίστημι ebe a pụtara ịbịarute ma ọ bụ ịbịakwasị; ‘bịarutere’ adịghị agbakwunye echiche mwakpo nke okwu ahụ ekwughị hoo haa.
- source_word: ἐζήτουν
  choice: ha nọ na-achọ
  rationale: Ụdị a na-egosi mbọ ma ọ bụ ọchịchọ na-aga n’ihu, ma na-ahapụ ohere ma ha na-achọ ndị ahụ ma ọ bụ na-agbalị ịkpọpụta ha.
- source_word: αὐτοὺς
  choice: ha
  rationale: A na-echekwa nnọchiaha Grik kama ịkọwa ya dịka Pọl na Saịlas n’ime isiokwu ahụ.
- source_word: προαγαγεῖν
  choice: ịkpọpụta ha
  rationale: Ọ dabara n’ọnọdụ nke ịkpọpụta ndị nọ n’ụlọ ka e du ha n’ihu ndị mmadụ.
- source_word: εἰς τὸν δῆμον
  choice: ka ha gaa n’ihu ọgbakọ ọha
  rationale: δῆμος ebe a bụ ndị obodo zukọtara dịka òtù ọha, ọ bụghị naanị ìgwè mmadụ a na-akọwaghị.
theological_decisions:
- issue: Nsụgharị οἱ Ἰουδαῖοι n’akụkọ esemokwu
  choice: ndị Juu
  alternative: ndị isi Juu; ndị Judia
  rationale: A gbasoro okwu Grik n’ụzọ kwụ ọtọ. Ihe gbara ya gburugburu na-egosi na ọ bụ otu ìgwè ndị Juu nọ na Tesalonaịka, ọ bụghị ndị Juu niile n’ebe niile; ma isiokwu ahụ ekwesịghị ime ka okwu ahụ saa mbara ma ọ bụ warara karịa isi mmalite.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji ahịrịokwu atọ mee ka usoro ọtụtụ participle Grik bụrụ nke na-aga were were n’Igbo, ebe a ka chekwara mmekọrịta nke ihe kpatara ihe, omume, na ebumnobi.
