source:
  edition: SBLGNT
  text: εὐθέως δὲ τότε τὸν Παῦλον ἐξαπέστειλαν οἱ ἀδελφοὶ πορεύεσθαι ⸀ἕως ἐπὶ τὴν θάλασσαν· ⸂ὑπέμεινάν τε⸃ ὅ τε Σιλᾶς καὶ ὁ Τιμόθεος ἐκεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/014.yaml
  text: Then the brothers immediately sent Paul away to go as far as the sea[b][a], but both Silas and Timothy remained there.
translation:
  language: ig
  text: Mgbe ahụ, ụmụnna[a] zigara Pọl ozugbo ka ọ gaa ruo n’oké osimiri[b], ma Saịlas na Timoti ha abụọ nọgidere n’ebe ahụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “ụmụnna nwoke” ma ọ bụ “ndị kwere ekwe.” Okwu Grik ahụ pụtara “ụmụnna nwoke,” ma n’ebe a ọ pụrụ izo aka n’otu ndị kwere ekwe n’ozuzu ha, gụnyere ụmụnna nwanyị.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya “gaa n’oké osimiri” ma ọ bụ “gaa n’akụkụ oké osimiri.” Okwu Grik ahụ pụrụ igosi ịga ruo n’ụsọ oké osimiri, n’akọwaghị ma Pọl gara n’ihu site n’ebe ahụ.
    reason: alternative_reading
lexical_decisions:
- source_word: εὐθέως
  choice: ozugbo
  rationale: Ọ na-egosi na e mere ihe ahụ n’egbughị oge, n’Igbo dị mfe ma bụrụkwa nke a na-asụ ugbu a.
- source_word: δὲ τότε
  choice: Mgbe ahụ
  rationale: Ọ na-egosi ngafe gaa n’ihe ọzọ mere n’akụkọ ahụ, n’etinyeghị nkọwa karịrị ihe mkpụrụokwu Grik kwuru.
- source_word: ἐξαπέστειλαν
  choice: zigara ... ka ọ gaa
  rationale: N’ebe a, ngwaa ahụ pụtara izipụ mmadụ ka o si n’otu ebe pụọ; ahịrịokwu a na-egosipụta ma iziga ya ma ọpụpụ ya n’Igbo eke.
- source_word: οἱ ἀδελφοὶ
  choice: ụmụnna
  rationale: “Ụmụnna” dabara na ἀδελφοί ma nwee ike ịpụta ndị otu okwukwe n’ozuzu ha n’Igbo, ebe ihe odide Grik ji aha nwoke n’ụdị ọtụtụ.
- source_word: πορεύεσθαι
  choice: ka ọ gaa
  rationale: Ọ na-egosi nzube e ji zipụ Pọl, ma bụrụ ụzọ doro anya e si ekwu ya n’Igbo.
- source_word: ἕως ἐπὶ τὴν θάλασσαν
  choice: ruo n’oké osimiri
  rationale: “Ruo” na-echekwa echiche nke ịga ruo ebe ahụ, ma ahịrịokwu ahụ anaghị ekpebi ma ọ gara naanị n’ụsọ oké osimiri ma ọ bụ na ọ gara n’ihu site n’ụzọ mmiri.
- source_word: ὑπέμεινάν
  choice: nọgidere
  rationale: N’ebe a, ngwaa ahụ pụtara ịnọgide n’otu ebe, ọ bụghị ịtachi obi n’ahụhụ.
- source_word: ὅ τε Σιλᾶς καὶ ὁ Τιμόθεος
  choice: Saịlas na Timoti abụọ
  rationale: “Abụọ” na-echekwa nkwusi ike nke τε ... καὶ na-etinye n’ebe mmadụ abụọ ahụ nọ n’Igbo eke.
- source_word: ἐκεῖ
  choice: n’ebe ahụ
  rationale: Nke a bụ ụzọ Igbo doro anya e si egosi ebe a kpọtụrụla aha.
theological_decisions:
- issue: Otú e si sụgharịta ἀδελφοί mgbe ọ na-ezo aka n’ọgbakọ ndị kwere ekwe
  choice: ụmụnna
  alternative: ụmụnna nwoke; ndị kwere ekwe
  rationale: A họọrọ “ụmụnna” ka e debe oyiyi nke okwu Grik ma kwekwa ka ọ na-ezo aka n’otu ndị kwere ekwe. Ihe e dere n’ala peeji na-eme ka o doo anya na okwu Grik dị n’ụdị nwoke ọtụtụ, ma n’ọnọdụ a ọ pụrụ ịgụnye ụmụnna nwanyị.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A haziri usoro okwu ka ọ bụrụ nke Igbo eke, ma e chekwara ọsọ omume ahụ, ọdịiche dị n’etiti ọpụpụ Pọl na ịnọgide Saịlas na Timoti, nakwa ihe a na-ejighị n’aka banyere ebe njem ahụ kwụsịrị.
