id: ACT.17.32
reference: Acts 17:32
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἀκούσαντες δὲ ἀνάστασιν νεκρῶν οἱ μὲν ἐχλεύαζον οἱ δὲ εἶπαν Ἀκουσόμεθά σου ⸂περὶ τούτου καὶ πάλιν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/032.yaml
  text: When they heard of the resurrection of the dead[a], some mocked, but others said, “We will hear you again about this.”
translation:
  language: ig
  text: Mgbe ha nụrụ banyere mbilite n’ọnwụ nke ndị nwụrụ anwụ, ụfọdụ kwara ya emo, ma ndị ọzọ sịrị, “Anyị ga-ege gị ntị ọzọ banyere okwu a.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ịhazi ya: “Anyị ga-ege gị ntị banyere okwu a ọzọ.”'
    reason: Usoro okwu Grik περὶ τούτου καὶ πάλιν na-enye ohere ka “ọzọ” jikọọ n’ụzọ doro anya na oge ha ga-ege ntị ọzọ ma ọ bụ n’ịnụ banyere okwu a ọzọ; ụzọ abụọ ahụ na-enye otu isi echiche n’Igbo.
lexical_decisions:
- source_word: Ἀκούσαντες δὲ
  choice: Mgbe ha nụrụ
  rationale: Nkebi a na-egosi oge mmeghachi omume ahụ malitere. “Mgbe ha nụrụ” bụ Igbo dị mfe ma doo anya; a naghị atụkwasị okwu pụtara ‘ugbu a’ n’ihi na ọ dịghị n’isi mmalite Grik ahụ.
- source_word: ἀνάστασιν νεκρῶν
  choice: mbilite n’ọnwụ nke ndị nwụrụ anwụ
  rationale: Nke a na-egosipụta echiche banyere ndị nwụrụ anwụ isi n’ọnwụ bilie, na-agbakwụnyeghị nkọwa ozizi nke okwu Grik ahụ ekwughị.
- source_word: οἱ μὲν ... οἱ δὲ
  choice: ụfọdụ ... ma ndị ọzọ
  rationale: Ọ na-edobe ọdịiche doro anya dị n’etiti ìgwè abụọ ahụ n’Igbo nkịtị.
- source_word: ἐχλεύαζον
  choice: kwara ya emo
  rationale: Nke a bụ ụzọ ebumpụta ụwa e si ekwu na ha jiri ihe Pọl kwuru mee ihe ọchị ma ọ bụ kwaa ya emo. Ọ naghị amanye echiche na ha ‘malitere’ ime ya, nke imperfect ahụ adịghị achọ ka a kọwaa otu ụzọ naanị.
- source_word: Ἀκουσόμεθά σου
  choice: Anyị ga-ege gị ntị
  rationale: Genitive σου na ἀκούω ebe a na-egosi ige mmadụ ntị. “Ige gị ntị” bụ Igbo doro anya karịa nsụgharị mkpụrụokwu nke ‘ịnụ gị.’
- source_word: περὶ τούτου καὶ πάλιν
  choice: ọzọ banyere okwu a
  rationale: “Ọzọ” na-edobe καὶ πάλιν n’ahịrịokwu ahụ, ebe “banyere okwu a” na-egosi isiokwu ha chọrọ ịnụ ọzọ.
theological_decisions:
- issue: Ma ἀνάστασιν νεκρῶν ọ pụtara mbilite ndị nwụrụ anwụ n’ozuzu ya ma ọ bụ isi n’etiti ndị nwụrụ anwụ bilie
  choice: mbilite n’ọnwụ nke ndị nwụrụ anwụ
  alternative: isi n’etiti ndị nwụrụ anwụ bilie
  rationale: Usoro okwu Grik ahụ na-ekwu maka mbilite n’ọnwụ metụtara ndị nwụrụ anwụ dịka otu ìgwè. Nhọrọ a na-edobe okwu ahụ n’ozuzu ya ma ghara ịkọwapụta ya karịa ihe odide ahụ.
- issue: Ihe nzaghachi ndị kwuru na ha ga-ege Pọl ntị ọzọ pụtara
  choice: A hapụrụ ya dịka nkwa ha kwuru, n’enweghị ịkọwa ma ha nwere ezi mmasị ma ọ bụ na ha chọrọ ịkwụsị mkparịta ụka ahụ
  alternative: Ịkọwa ya dịka nnabata ma ọ bụ dịka ọjụjụ nwayọọ
  rationale: Ihe odide ahụ akọwaghị ebumnobi ha, ya mere nsụgharị ahụ ekwesịghị ikpebi ya.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. “Mbilite n’ọnwụ” bụ okwu Baịbụl a maara nke ọma, ebe “kwara ya emo” na “ga-ege gị ntị” bụ okwu nkịtị na nke doro anya.
