  text: πολλοὶ μὲν οὖν ἐξ αὐτῶν ἐπίστευσαν, καὶ τῶν Ἑλληνίδων γυναικῶν τῶν εὐσχημόνων καὶ ἀνδρῶν οὐκ ὀλίγοι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/012.yaml
  text: Therefore many of them believed[b][a], and not a few of the prominent Greek women and men.
translation:
  language: ig
  text: N’ihi ya, ọtụtụ n’ime ha kwere, tinyere ụmụ nwanyị Gris ndị a na-akwanyere ùgwù[a] na ụmụ nwoke ndị na-adịghị ole na ole[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ndị a ma ama” ma ọ bụ “ndị nọ n’ọkwá dị elu n’obodo.”
    reason: lexical_alternative
  - marker: b
    text: N’asụsụ Grik, “ọ bụghị mmadụ ole na ole,” bụ akpaala okwu pụtara “ọtụtụ mmadụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ μὲν οὖν
  choice: N’ihi ya, ọtụtụ
  rationale: “N’ihi ya” na-egosi nkwubi okwu sitere n’ihe amaokwu gara aga kwuru, ebe “ọtụtụ” na-asụgharị πολλοί n’ụzọ doro anya.
- source_word: ἐξ αὐτῶν
  choice: n’ime ha
  rationale: Nke a na-echekwa echiche nke akụkụ nke otu ìgwè ahụ, ma na-ezo aka ná ndị Beria e kwuru okwu ha.
- source_word: ἐπίστευσαν
  choice: kwere
  rationale: “Kwere” bụ nsụgharị kwụ ọtọ nke πιστεύω; ọ naghị agbakwụnye ihe ha kwere ma ọ bụ nkọwa ozizi nke amaokwu ahụ ekwughị kpọmkwem.
- source_word: τῶν Ἑλληνίδων γυναικῶν
  choice: ụmụ nwanyị ndị Gris
  rationale: Ἑλληνίδων na-akọwa ụmụ nwanyị ahụ dị ka ndị Gris; ihe a na-ekwu abụghị na ha bụ nwunye.
- source_word: τῶν εὐσχημόνων
  choice: a na-akwanyere ùgwù
  rationale: Nke a na-egosipụta ọnọdụ ọma na nkwanye ùgwù ha nwere n’obodo, ma na-anọgide bụrụ okwu Igbo dị mfe ma dị ugwu.
- source_word: καὶ ἀνδρῶν οὐκ ὀλίγοι
  choice: na ọtụtụ ụmụ nwoke[b]
  rationale: οὐκ ὀλίγοι bụ akpaala okwu pụtara ọnụ ọgụgụ buru ibu; “ọtụtụ” na-enye ihe ọ pụtara n’Igbo dị ugbu a, ebe nkọwa ala peeji na-echekwa ọdịdị Grik ahụ.
theological_decisions:
- issue: Ma a ga-akọwapụta ἐπίστευσαν site n’ịgbakwụnye ihe ma ọ bụ onye ha kweere na ya
  choice: kwere
  alternative: bịara nwee okwukwe n’ime Kraịst; kwere ozi ahụ
  rationale: Amaokwu a n’onwe ya ekwughị kpọmkwem ihe e kweere; “kwere” na-ahapụ ihe ahụ ka ọnọdụ gbara amaokwu ahụ gburugburu kọwaa ya, n’etinyeghị nkọwa ozizi ọzọ.
translation_notes:
  register: Ejiri Standard Igbo dị ugbu a, dị ugwu ma dị mfe nghọta. A haziri njikọ nke ìgwè ndị kweere ka ọ bụrụ ihe na-aga nke ọma n’Igbo, ma debe akara nkọwa ala peeji niile n’ederede.
