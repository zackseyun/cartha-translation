  text: ὁ θεὸς ὁ ποιήσας τὸν κόσμον καὶ πάντα τὰ ἐν αὐτῷ, οὗτος οὐρανοῦ καὶ γῆς ⸂ὑπάρχων κύριος⸃ οὐκ ἐν χειροποιήτοις ναοῖς κατοικεῖ
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/024.yaml
  text: The God who made the world and everything in it[a], being Lord of heaven and earth, does not dwell in temples made by hands.
translation:
  language: ig
  text: Chineke, onye kere ụwa na ihe niile dị n’ime ya, bụ Onyenwe eluigwe na ụwa. Ọ naghị ebi n’ụlọ nsọ ndị e ji aka mmadụ rụọ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ụlọ nsọ ndị e ji aka rụọ.” Okwu a pụtara ụlọ nsọ ụmụ mmadụ rụrụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιήσας
  choice: onye kere
  rationale: Nkebi a na-akọwa Chineke dị ka onye mere ụwa. “Onye kere” bụ Igbo doro anya ma na-egosipụta ọrụ okike ahụ n'ụzọ kwesịrị ekwesị.
- source_word: κόσμον
  choice: ụwa
  rationale: N’ebe a, κόσμος na-ezo aka n’ụwa e kere eke n’ozuzu ya; “ụwa” bụ okwu Igbo nkịtị, sara mbara, nke dabara n’ọnọdụ a.
- source_word: πάντα τὰ ἐν αὐτῷ
  choice: ihe niile dị n’ime ya
  rationale: Nhọrọ a na-echekwa ike zuru ezu nke πάντα ma na-akọwa na ihe niile dị n’ụwa so n’ihe Chineke kere.
- source_word: ὑπάρχων κύριος
  choice: bụ Onyenwe
  rationale: Nke a na-egosipụta ọnọdụ Chineke dị ugbu a dị ka Onyenwe, n’etinyeghị echiche na participle ahụ pụtara kpọmkwem ihe kpatara ihe na-esochi ya.
- source_word: οὐρανοῦ καὶ γῆς
  choice: eluigwe na ụwa
  rationale: Nke a bụ ụzọ Igbo a na-ejikarị ekwu njikọ a, genitive ndị ahụ na-adaberekwa na “Onyenwe.”
- source_word: χειροποιήτοις
  choice: ndị aka mmadụ wuru
  rationale: Okwu a pụtara ihe ụmụ mmadụ ji aka ha rụọ. “Ndị aka mmadụ wuru” bụ Igbo eke ma na-eme ka ntụnyere dị n’etiti Onye Okike na ụlọ ụmụ mmadụ rụrụ doo anya.
- source_word: ναοῖς
  choice: ụlọ nsọ
  rationale: ναός na-ezo aka n’ụlọ a na-ewere dị ka ebe chi bi ma ọ bụ ebe a na-efe ya; “ụlọ nsọ” bụ okwu Igbo doro anya maka temple n’ọnọdụ a.
- source_word: κατοικεῖ
  choice: na-ebi
  rationale: “Na-ebi” na-enye echiche κατοικέω nke ibi ma ọ bụ ịnọgide n’ebe, ma bụrụkwa okwu Igbo dị mfe nghọta.
theological_decisions:
- issue: Ịdị elu Chineke karịa ihe e kere eke megide iche na ọ nọ naanị n’ụlọ nsọ
  choice: E kwuru kpọmkwem na Chineke anaghị ebi n’ụlọ nsọ ndị mmadụ wuru.
  alternative: A pụrụ ịkọwawanye ya dị ka, “a pụghị imechi Chineke n’ime ụlọ nsọ.”
  rationale: Nhọrọ a na-anọgide nso n’okwu Grik, na-egosipụta na Onye kere ihe niile na Onyenwe eluigwe na ụwa abụghị onye a kpọchiri n’ụlọ ụmụ mmadụ wuru, n’etinyeghị nkọwa nkà mmụta okpukpe ọzọ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E kewara ahịrịokwu Grik ahụ ụzọ abụọ ka ọ bụrụ Igbo eke ma ghara ime ka njikọ echiche ya ghara ido anya. “Onyenwe” na-echekwa aha ọchịchị κύριος, ebe “ụlọ nsọ” na-egosipụta ebe ofufe nke ναός.
