    issue: Footnote a uses “obodo ndị kwere ekwe niile” for the wider believing community.
    rationale: In Standard Igbo, “obodo” commonly denotes a town, village, or locality. “Òtù ndị kwere ekwe dum” unambiguously expresses the wider community of believers intended by the note.
