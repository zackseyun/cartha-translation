id: ACT.17.10
reference: Acts 17:10
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Οἱ δὲ ἀδελφοὶ εὐθέως ⸀διὰ νυκτὸς ἐξέπεμψαν τόν τε Παῦλον καὶ τὸν Σιλᾶν εἰς Βέροιαν, οἵτινες παραγενόμενοι εἰς τὴν συναγωγὴν ⸂τῶν Ἰουδαίων ἀπῄεσαν⸃·
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/010.yaml
  text: Then the brothers immediately sent both Paul and Silas away by night to Berea[a], and when they arrived[c][b], they went into the synagogue of the Jews.
translation:
  language: ig
  text: Ma ụmụnna[a] zigara ma Pọl ma Saịlas ozugbo n'abalị[b] ka ha gaa Beria. Mgbe ha rutere, ha banyere n'ụlọ nzukọ ndị Juu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ụmụnna ndị nwoke na ndị nwanyị”; okwu Grik bụ “ụmụnna,” ma ọ pụrụ izo aka n’òtù ndị kwere ekwe dum.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “n’oge abalị.”
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “ụlọ nzukọ Juu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀδελφοὶ
  choice: ụmụnna
  rationale: “Ụmụnna” na-egosipụta okwu ezinụlọ e ji akpọ ndị otu obodo ndị kwere ekwe; ọ pụkwara ịgụnye ndị nwoke na ndị nwanyị dịka ihe gbara ya gburugburu si dị.
- source_word: εὐθέως
  choice: ozugbo
  rationale: “Ozugbo” na-egosi na ha mere ihe ahụ n’egbughị oge, n’asụsụ Igbo dị mfe ma bụrụkwa nke a na-asụ ugbu a.
- source_word: διὰ νυκτός
  choice: n'abalị
  rationale: Nkebiokwu a na-egosi na iziga ha na njem ha mere n’oge abalị.
- source_word: ἐξέπεμψαν
  choice: zigara ... ka ha gaa
  rationale: Nke a na-egosi izipụ ha pụọ n’ebe ahụ gaa ebe ọzọ, ma na-ada nke ọma n’Igbo.
- source_word: τόν τε Παῦλον καὶ τὸν Σιλᾶν
  choice: ma Pọl ma Saịlas
  rationale: Usoro “ma ... ma ...” na-echekwa ike njikọ τε ... καί, ya bụ na e zipụrụ ha abụọ.
- source_word: Βέροιαν
  choice: Beria
  rationale: “Beria” bụ ntụgharị aha obodo Βέροια n’ụdị dabara n’usoro mkpụrụokwu Igbo.
- source_word: οἵτινες παραγενόμενοι
  choice: Mgbe ha rutere
  rationale: A ghọtara participle ahụ dịka nke na-egosi oge, ya mere okwu a na-egosi usoro ihe omume n’Igbo eke.
- source_word: συναγωγὴν τῶν Ἰουδαίων
  choice: ụlọ nzukọ ndị Juu
  rationale: Nke a na-echekwa njikọ genitive ahụ ma mee ka o doo anya na ọ bụ ụlọ nzukọ nke obodo ndị Juu.
- source_word: ἀπῄεσαν
  choice: ha banyere
  rationale: Ebe ebumnuche ahụ bụ εἰς τὴν συναγωγήν, “ha banyere” na-enye echiche ịga n’ime ụlọ nzukọ n’Igbo dị mfe.
theological_decisions:
- issue: Otú e si sụgharị ἀδελφοὶ mgbe o nwere ike ịgụnye obodo ndị kwere ekwe niile
  choice: ụmụnna
  alternative: ụmụnna ndị nwoke na ndị nwanyị; ndị kwere ekwe
  rationale: “Ụmụnna” na-echekwa ihe atụ ezinụlọ dị na Grik ma nwee ike, n’Igbo, ịgụnye obodo ahụ dum n’enweghị ịgbakwunye nkọwa na-adịghị n’ụdị okwu Grik.
- issue: Otú e si sụgharị τῶν Ἰουδαίων
  choice: ndị Juu
  alternative: ụlọ nzukọ Juu
  rationale: “Ụlọ nzukọ ndị Juu” na-egosipụta okwu Grik nke ọma; ebe a, okwu ahụ na-akọwa obodo nwere ụlọ nzukọ ahụ, ọ bụghị ikpe okpukpe megide ndị Juu.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta mee ihe. Ahịrịokwu abụọ ahụ na-eme ka usoro akụkọ doo anya, ebe “ụmụnna” na “ụlọ nzukọ ndị Juu” na-echekwa ọdịdị na mgbagwoju nghọta dị n’asụsụ isi.
