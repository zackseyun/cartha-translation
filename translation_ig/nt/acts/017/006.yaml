  yaml_path: translation/nt/acts/017/006.yaml
  text: But when they did not find them[a], they dragged Jason and some brothers before the city authorities, shouting[c][b], “These men who have turned the world upside down have come here also,”
translation:
  language: ig
  text: Ma mgbe ha na-achọtaghị ha, ha dọkpụrụ Jesọn na ụfọdụ ụmụnna[a] kpọga n’ihu ndị ọchịchị obodo[b], na-eti mkpu, sị, “Ndị a kpaghasịrị ụwa mmadụ bi[c], abịakwala ebe a.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Okwu Grik ahụ bụ “ụfọdụ ụmụnna”; n’ebe a, ọ na-ezo aka n’ụfọdụ ndị kwere ekwe. N’ụfọdụ ọnọdụ, “ụmụnna” pụrụ ịgụnye ụmụ nwanyị.
    reason: lexical_alternative
  - marker: b
    text: Aha ọkwa Grik ahụ bụ “politarchs,” aha pụrụ iche a na-eji akpọ ndị isi ọchịchị obodo n’ala Masedonia.
    reason: cultural_note
  - marker: c
    text: Ma ọ bụ, “ụwa niile a maara.” Okwu ahụ na-ezo aka n’ụwa mmadụ bi, ma n’ọnọdụ ụfọdụ ọ pụrụ izo aka karịchaa n’ụwa ọchịchị Rom.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ εὑρόντες
  choice: mgbe ha na-ahụghị ha
  rationale: Nke a na-egosi ọnọdụ mere tupu omume bụ isi, ma na-asụkwa ya n’ụzọ Igbo dị mfe ma doo anya.
- source_word: ἔσυρον
  choice: ha dọkpụrụ
  rationale: Okwu Grik a pụtara ịdọ mmadụ n’ike; “dọkpụrụ” na-echekwa ike na mmegbu dị n’omume ahụ.
- source_word: τινας ἀδελφοὺς
  choice: ụfọdụ ụmụnna
  rationale: “Ụmụnna” bụ okwu Ndị Kraịst ji akpọ ndị ha na ha kweere; ọ na-echekwakwa ohere na okwu ahụ nwere ike ịgụnye ndị nwoke na ndị nwanyị.
- source_word: ἐπὶ τοὺς πολιτάρχας
  choice: gaa n’ihu ndị ọchịchị obodo
  rationale: Nke a na-egosi na a kpọgara ha n’ihu ndị ọrụ ọchịchị obodo ka ha zaa ebubo, n’enweghị iji aha ọkwa Masedonia nke ọtụtụ ndị agaghị ama.
- source_word: βοῶντες
  choice: na-eti mkpu
  rationale: Ọ na-egosi mkpu dara ụda e ji ebo ebubo n’ihu ọha.
- source_word: οἱ τὴν οἰκουμένην ἀναστατώσαντες
  choice: Ndị a kpaghasịrị ụwa mmadụ bi
  rationale: “Kpaghasịrị” na-egosi ọgbaaghara na nnukwu nsogbu, ebe “ụwa mmadụ bi” na-echekwa ihe οἰκουμένη pụtara n’ụzọ nkịtị.
- source_word: οὗτοι καὶ ἐνθάδε πάρεισιν
  choice: abịakwala ebe a
  rationale: Nke a na-egosi ma ọbịbịa ha ma ọnụnọ ha ugbu a; “-kwala” na-ebupụta echiche καί, ya bụ, “ebe a kwa.”
