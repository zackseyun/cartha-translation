translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-echekwa olu ebubo siri ike nke ìgwè mmadụ ahụ, tinyere ihe ike dị na “dọkpụrụ” na nnukwu ọgbaaghara dị na “kpaghasịrị.”
