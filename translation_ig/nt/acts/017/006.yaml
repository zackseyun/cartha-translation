review_pass:
  verdict: revise
  source_fidelity: Isi ederede na-ezipụta nke ọma na ha enweghị ike ịhụ ndị a na-achọ, dọkpụrụ Jesọn na ụfọdụ ụmụnna n’ihu ndị ọchịchị obodo, ma tie mkpu ebubo. A gbanwere “na-ahụghị” ka ọ bụrụ “na-achọtaghị” iji gosipụta n’ụzọ doro anya na ha chọpụtara ma ha enweghị ike ịchọta ha. A na-echekwa οἰκουμένη dị ka “ụwa mmadụ bi.”
  naturalness: “Kpọga n’ihu” dịkwa n’Igbo Izugbe eke karịa ijikọta “dọkpụrụ ... gaa n’ihu.” Edegharịkwaa okwu ebubo ahụ site n’itinye rikoma, ka njikọ dị n’etiti “Ndị a” na nkebi na-akọwa ha doo anya.
  terminology: “Ụmụnna” kwesịrị ekwesị maka ἀδελφοί n’ebe a. Ma nkọwa ala peeji a anaghị ekwesị ikwu na okwu Grik ahụ pụtara kpọmkwem “ụmụnna nwoke”; n’amaokwu a ọ bụ “ụfọdụ ụmụnna.” A na-edozikwa aha ọkwa Masedonia ka ọ bụrụ “politarchs,” kama “ndị politak,” nke na-adịghị edo anya dịka aha Grik.
  issues:
  - severity: medium
    issue: Nkọwa ala peeji a na-ekwu na ἀδελφούς pụtara n’ụzọ nkịtị “ụfọdụ ụmụnna nwoke.”
    rationale: Okwu Grik ahụ bụ “ụfọdụ ụmụnna”; ọ bụ ezie na ọ dị n’ụdị okike nwoke, nke a anaghị ekpebi na naanị ụmụ nwoke ka a na-ekwu maka ha n’ọnọdụ a.
  - severity: medium
    issue: “Ndị politak” anaghị akọwa aha πολιτάρχας n’ụzọ a pụrụ ịtụkwasị obi ma ọ bụ n’ụzọ doro anya.
    rationale: Ọ dị mma iji aha ọmụmụ akụkọ ihe mere eme a na-ahụkarị, “politarchs,” ma kọwaa na ha bụ ndị isi ọchịchị obodo Masedonia.
  - severity: low
    issue: “Mgbe ha na-ahụghị ha” anaghị egosi nke ọma ọchụchọ dara ada nke μὴ εὑρόντες.
    rationale: “Mgbe ha na-achọtaghị ha” bụ okwu eke ma na-egosi na ha chọpụtara ma ha enweghị ike ịchọta ndị ahụ.
