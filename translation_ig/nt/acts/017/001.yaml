revisions:
- from: Mgbe ha gafesịrị Amfịpọlis na Apọlọni[a], ha bịarutere Tesalonaịka, ebe e nwere ụlọ nzukọ ndị Juu.[b]
  to: Mgbe ha gafesịrị Amfịpọlis na Apọlọnia[a], ha bịarutere Tesalonaịka, ebe e nwere ụlọ nzukọ ndị Juu.[b]
  rationale: The revision corrects the full form of Apollonia, retains the source’s temporal and locative relations in idiomatic Standard Igbo, and adjusts both notes so that they are natural and do not add unwarranted definiteness to the anarthrous Greek noun.
