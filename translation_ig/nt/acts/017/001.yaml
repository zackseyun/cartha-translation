id: ACT.17.1
reference: Acts 17:1
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Διοδεύσαντες δὲ τὴν Ἀμφίπολιν καὶ ⸀τὴν Ἀπολλωνίαν ἦλθον εἰς Θεσσαλονίκην, ὅπου ⸀ἦν συναγωγὴ τῶν Ἰουδαίων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/001.yaml
  text: After passing through Amphipolis and Apollonia[a], they came to Thessalonica[b], where there was a synagogue of the Jews.
translation:
  language: ig
  text: Mgbe ha gafesịrị Amfịpọlis na Apọlọnia[a], ha bịarutere Tesalonaịka, ebe e nwere ụlọ nzukọ ndị Juu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “Mgbe ha gafere Amfịpọlis na Apọlọnia.”
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsị, “ebe ụlọ nzukọ ndị Juu dị”; n’asụsụ Grik, enweghị mkpụrụokwu akọwapụtara aha n’ihu “ụlọ nzukọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Διοδεύσαντες
  choice: Mgbe ha gafesịrị
  rationale: Ngwaa a dị n’ụdị aorist participle ma na-egosi ihe mere tupu ἦλθον. Nkebi a na-egosi n’Igbo doro anya na ha si n’obodo ndị ahụ gafee tupu ha erute Tesalonaịka.
- source_word: δὲ
  choice: —
  rationale: N’ebe a, δέ bụ njikọ akụkọ dị nro. Igbo achọghị ka a sụgharịa ya iche, n’ihi na ‘Mgbe’ na usoro ahịrịokwu ahụ ejikọtalarị akụkọ ahụ nke ọma.
- source_word: Ἀμφίπολιν
  choice: Amfịpọlis
  rationale: A kpụgharịrị aha obodo Grik ahụ n’ụzọ kwekọrọ n’usoro ụda na odide Igbo.
- source_word: Ἀπολλωνίαν
  choice: Apọlọni
  rationale: A kpụgharịrị aha obodo ahụ n’ụdị dị mfe ma kwekọọ n’usoro ụda Igbo.
- source_word: ἦλθον
  choice: ha bịarutere
  rationale: Ọ bụ aorist indicative plural nke ἔρχομαι. ‘Ha bịarutere’ na-egosi mmegharị ruo ebe a na-aga n’Igbo nkịtị ma dabara n’akụkọ njem a.
- source_word: εἰς Θεσσαλονίκην
  choice: Tesalonaịka
  rationale: εἰς na aha obodo na-egosi ebe njem ahụ na-aga; ngwaa ‘bịarutere’ emeela ka mmekọrịta a pụta ìhè n’Igbo, ya mere preposition ọzọ adịghị mkpa.
- source_word: ὅπου
  choice: ebe
  rationale: Nke a bụ okwu njikọ na-egosi ebe; ‘ebe’ bụ ntụgharị Igbo kachasị eke.
- source_word: συναγωγὴ
  choice: ụlọ nzukọ
  rationale: N’ọnọdụ ndị Juu, ‘ụlọ nzukọ’ na-ezo aka n’ebe obodo ndị Juu na-ezukọ maka ofufe na ọmụmụ Akwụkwọ Nsọ. Greek enweghị article, ya mere ‘e nwere ụlọ nzukọ’ na-echekwa ọdịiche ahụ.
- source_word: τῶν Ἰουδαίων
  choice: ndị Juu
  rationale: Genitive a na-egosi njikọ ụlọ nzukọ ahụ na obodo ndị Juu. ‘Ndị Juu’ bụ okwu kpọmkwem ma ghara ime ka ha bụrụ nanị ndị si Judia.
theological_decisions:
- issue: Ntụgharị Ἰουδαίων n’akụkọ a
  choice: ndị Juu
  alternative: ndị Judia
  rationale: N’ebe a, okwu ahụ na-ezo aka n’obodo ndị Juu nwere ụlọ nzukọ na Tesalonaịka, ọ bụghị naanị ndị bi na Judia. ‘Ndị Juu’ na-echekwa ihe gbasara agbụrụ na okpukpe nke okwu Greek ahụ.
- issue: Ma συναγωγή ọ bụ ‘otu ụlọ nzukọ’ ka ọ bụ ‘ụlọ nzukọ ahụ’
  choice: ụlọ nzukọ
  alternative: ụlọ nzukọ ahụ
  rationale: Greek enweghị article tupu συναγωγή, ya mere ederede bụ isi ekwesịghị ịmanye nghọta doro anya nke ‘ụlọ nzukọ ahụ.’ Ihe odide ala peeji na-edebe nhọrọ ọzọ ahụ n’enweghị idozi nghọta nwere ike ịdị iche.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta, dee ya. A kpụgharịrị aha obodo ndị ahụ ka ha kwekọọ n’usoro ụda Igbo. E tinyere akara ihe odide ala peeji [a] na [b] n’ederede bụ isi.
