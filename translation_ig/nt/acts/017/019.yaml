id: ACT.17.19
reference: Acts 17:19
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐπιλαβόμενοί ⸀τε αὐτοῦ ἐπὶ τὸν Ἄρειον Πάγον ἤγαγον, λέγοντες· Δυνάμεθα γνῶναι τίς ἡ καινὴ αὕτη ἡ ὑπὸ σοῦ λαλουμένη διδαχή;
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/019.yaml
  text: So they took hold of him and brought him to the Areopagus, saying, “May we know what this new teaching is that is being spoken by you?”
translation:
  language: ig
  text: Ha wee jide ya, kpọga ya n’Areọpagọs,[a] na-asị, “Ànyị nwere ike ịmata ihe ozizi ọhụrụ a ị na-ekwu bụ?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Areọpagọs” nwere ike izo aka n’ugwu ahụ n’onwe ya ma ọ bụ na kansụl e jikọtara ya na ya; n’asụsụ Bekee ọdịnala, a na-akpọkwa ya “Mars Hill.”
    reason: cultural_note
lexical_decisions:
- source_word: ἐπιλαβόμενοί
  choice: ha jidere ya aka
  rationale: Nke a na-egosi na ha metụrụ ya aka ma were ya duuru, n’emeghị ka ọ bụrụ ijide ya dịka onye omekome ma ọ bụ naanị ịkpọ ya òkù nwayọọ.
- source_word: τε
  choice: Ya mere
  rationale: Ọ bụ njikọ dị nro nke na-aga n’ihu n’akụkọ ahụ; “Ya mere” na-egosi njikọ ya na amaokwu bu ụzọ n’Igbo dị ire.
- source_word: ἐπὶ τὸν Ἄρειον Πάγον
  choice: n’Areọpagọs
  rationale: E dere aha Grik ahụ n’ụdị Igbo iji hapụ ya ka ọ nwee ike ịpụta ugwu ahụ ma ọ bụ ọgbakọ kansụl e jikọtara ya na ya.
- source_word: ἤγαγον
  choice: kpọga ya
  rationale: “Kpọga” bụ ụzọ Igbo si ekwu iduru ma ọ bụ iburu mmadụ gaa n’ebe a kpọrọ aha.
- source_word: λέγοντες
  choice: na-asị
  rationale: 'Nke a na-echekwa njikọ participle ahụ: ha kwuru okwu ndị a ka ha na-akpọga ya.'
- source_word: Δυνάμεθα γνῶναι
  choice: Ànyị nwere ike ịmata
  rationale: Nke a bụ arịrịọ a jụrụ n’ụzọ nkwanye ùgwù, ma ọ ka na-echekwa ọdịdị ajụjụ banyere ike ịmata dị n’asụsụ Grik.
- source_word: καινὴ
  choice: ọhụrụ
  rationale: “Ọhụrụ” bụ okwu Igbo doro anya ma saa mbara maka ihe ndị na-ege ntị na-anụbeghị mbụ.
- source_word: ὑπὸ σοῦ λαλουμένη
  choice: ị na-ekwu
  rationale: Nke a bụ Igbo ebumpụta ụwa nke na-egosipụta onye na-ekwu ozizi ahụ n’enweghị passive na-adịghị aga nke ọma n’Igbo.
- source_word: διδαχή
  choice: ozizi
  rationale: “Ozizi” bụ okwu Igbo a na-aghọta nke ọma maka teaching, n’enweghị mkpa itinye nghọta ụka pụrụ iche.
theological_decisions:
- issue: Ụdị ha si kpọrọ Pọl gaa Areọpagọs
  choice: Ha jidere ya aka kpọga ya n’ụzọ siri ike ntakịrị, ma ọ pụtaghị n’onwe ya na ha nwụchiri ya dịka onye omekome.
  alternative: Ha nwụchiri ya; ma ọ bụ, ha kpọrọ ya òkù nanị n’ụzọ ọma.
  rationale: ἐπιλαμβάνομαι nwere ike ịpụta ijide ma ọ bụ iwere duru mmadụ. Ihe gbara ya gburugburu na-egosi ọchịchọ ịmata ihe karịa ikpe doro anya, ya mere nsụgharị ahụ anaghị eme ka omume ahụ dị nro gabiga ókè ma ọ bụ mee ya njide iwu.
- issue: Ihe Ἄρειος Πάγος na-ezo aka na ya
  choice: E ji aha nke aka ya, “Areọpagọs,” mee ihe n’akụkụ isi.
  alternative: Ugwu Areọpagọs kpọmkwem; ma ọ bụ kansụl Areọpagọs kpọmkwem.
  rationale: Aha Grik ahụ nwere ike izo aka n’ugwu ahụ ma ọ bụ n’ọgbakọ e jikọtara ya na ya. Ịhapụ aha ahụ n’onwe ya na-echekwa nghọtahie ziri ezi nke isi mmalite.
translation_notes:
  register: Standard Igbo dị ugbu a, dị nsọ ma dị mfe nghọta. A họọrọ “ị na-ekwu” kama ịmanye passive Grik n’ụzọ na-adịghị eke n’Igbo. Akara [a] dị n’akụkụ aha ọ na-akọwa.
