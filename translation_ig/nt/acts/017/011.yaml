  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οὗτοι δὲ ἦσαν εὐγενέστεροι τῶν ἐν Θεσσαλονίκῃ, οἵτινες ἐδέξαντο τὸν λόγον μετὰ πάσης προθυμίας, ⸀τὸ καθ’ ἡμέραν ἀνακρίνοντες τὰς γραφὰς εἰ ἔχοι ταῦτα οὕτως.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/011.yaml
  text: These were more noble-minded than those in Thessalonica[a], for they received the word with all eagerness[b], examining the Scriptures daily to see whether these things were so.
translation:
  language: ig
  text: Ndị a dị mma n’àgwà karịa ndị nọ na Tesalonaịka[a], n’ihi na ha ji ịnụ ọkụ n’obi dị ukwuu[b] nabata okwu ahụ, na-enyocha Akwụkwọ Nsọ kwa ụbọchị ka ha mara ma ihe ndị a ọ̀ dị otu a.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị dị elu n’ọkwa karịa.” Okwu Grik ahụ nwere ike ịpụta àgwà kwesịrị otuto karịa ma ọ bụ, nke yikarịrị obere n’ebe a, ọkwa mmadụ dị elu karịa.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ha ji njikere zuru ezu nabata ozi ahụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐγενέστεροι
  choice: nwere ezi uche karịa
  rationale: N’ebe a, okwu ahụ na-egosi àgwà kwesịrị otuto karịa ịbụ ndị a mụrụ n’ezinụlọ dị elu; ahịrịokwu na-esonụ kọwara àgwà ọma ahụ site n’otú ha si nabata okwu ahụ ma nyochaa Akwụkwọ Nsọ.
- source_word: οἵτινες
  choice: n’ihi na ha
  rationale: Okwu njikọ a na-akọwa ihe mere e ji kwuo na ha nwere ezi uche karịa ndị ọzọ.
- source_word: ἐδέξαντο τὸν λόγον
  choice: nabata okwu ahụ
  rationale: Nke a na-edobe λόγος dịka ‘okwu,’ ma na-egosikwa nnabata ha nabatara ozi ahụ.
- source_word: μετὰ πάσης προθυμίας
  choice: ji ịnụ ọkụ n’obi niile
  rationale: Ọ na-egosi njikere na ịnụ ọkụ n’obi zuru ezu, dịka πάσης si eme ka echiche ahụ sie ike.
- source_word: τὸ καθ’ ἡμέραν
  choice: kwa ụbọchị
  rationale: Nke a na-egosi na omume ahụ na-eme ụbọchị niile mgbe niile.
- source_word: ἀνακρίνοντες
  choice: na-enyocha
  rationale: ‘Na-enyocha’ na-egosi nyocha nke ọma iji chọpụta ma ihe a na-ekwu ò ziri ezi, n’enweghị itinye echiche ọzọ na-adịghị na isiokwu ahụ.
- source_word: τὰς γραφὰς
  choice: Akwụkwọ Nsọ
  rationale: N’ebe a, okwu ahụ na-ezo aka n’ihe odide dị nsọ nke ndị Juu.
- source_word: εἰ ἔχοι ταῦτα οὕτως
  choice: ka ha mara ma ihe ndị a hà dị otu ahụ
  rationale: 'Nke a na-echekwa echiche nke ajụjụ na-enweghị mkpebi tupu nyocha: ha chọrọ ịchọpụta ma okwu ndị ahụ hà dị ka e kwuru.'
theological_decisions:
- issue: Ihe εὐγενέστεροι pụtara n’ebe a
  choice: àgwà kwesịrị otuto—‘nwere ezi uche karịa’
  alternative: ndị a mụrụ n’ezinụlọ ma ọ bụ ọkwa dị elu karịa
  rationale: Ihe na-esote kọwara ịdị mma ha site n’ịnabata okwu ahụ nke ọma na inyocha Akwụkwọ Nsọ; ya mere, àgwà ha bụ isi echiche, ọ bụghị ọkwa mmadụ.
- issue: Nsụgharị λόγος
  choice: ‘okwu ahụ’ n’ahịrị bụ isi
  alternative: ‘ozi ahụ’
  rationale: ‘Okwu ahụ’ na-echekwa okwu sara mbara nke Grik na njikọ ya na ojiji λόγος n’Akwụkwọ Ọrụ Ndị Ozi, ebe nkọwa ala peeji na-enye ‘ozi ahụ’ dịka ụzọ ọzọ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. ‘Tesalonaịka’ bụ ntụgharị mkpụrụokwu aha obodo ahụ; ‘Akwụkwọ Nsọ’ bụ okwu ndị na-agụ Baịbụl maara nke ọma. E debere ihe nrịbama ala peeji [a] na [b] kpọmkwem n’ahịrị bụ isi.
