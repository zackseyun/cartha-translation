revisions:
- from: Ndị a nwere ezi uche karịa ndị nọ na Tesalonaịka[a], n’ihi na ha ji ịnụ ọkụ n’obi niile[b] nabata okwu ahụ, na-enyocha Akwụkwọ Nsọ kwa ụbọchị ka ha mara ma ihe ndị a hà dị otu ahụ.
  to: Ndị a dị mma n’àgwà karịa ndị nọ na Tesalonaịka[a], n’ihi na ha ji ịnụ ọkụ n’obi dị ukwuu[b] nabata okwu ahụ, na-enyocha Akwụkwọ Nsọ kwa ụbọchị ka ha mara ma ihe ndị a ọ̀ dị otu a.
  rationale: The revision renders εὐγενέστεροι as superior commendable character without asserting social rank, while footnote a preserves the less likely social-status sense. It also corrects the Igbo interrogative construction for “whether these things were so.” All original footnote anchors are retained.
