revisions:
- from: Ụfọdụ n’ime ndị ọkà ihe ọmụma òtù Epikurọs na òtù Stọik sokwa ya na-ekwurịta okwu.[a] Ụfọdụ na-asị, “Gịnị ka onye a na-atụtụ okwu iberibe[b] na-achọ ikwu?” Ma ndị ọzọ sịrị, “Ọ dị ka ọ bụ onye na-ekwusa chi ndị mba ọzọ[c],” n’ihi na ọ nọ na-ekwusa ozi ọma banyere Jizọs na mbilite n’ọnwụ.[d]
  to: Ụfọdụ n’ime ndị ọkà ihe ọmụma Epikurean na ndị Stọik soro ya kparịta ụka.[a] Ụfọdụ na-ekwu, “Gịnị ka onye a na-atụtụ iberibe echiche[b] chọrọ ikwu?” Ma ndị ọzọ na-ekwu, “Ọ dị ka ọ bụ onye na-ekwusa chi ndị mba ọzọ[c],” n’ihi na ọ nọ na-ekwusa ozi ọma banyere Jizọs na mbilite n’ọnwụ.[d]
  rationale: The revision preserves the source text’s ambiguity and rhetorical force while improving Standard Igbo idiom. It identifies the Epicureans as philosophers of that school, clarifies the culturally specific insult without making the main text excessively explanatory, and retains all four correctly placed footnote anchors and their functions.
