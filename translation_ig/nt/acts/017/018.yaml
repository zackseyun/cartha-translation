id: ACT.17.18
reference: Acts 17:18
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τινὲς δὲ καὶ τῶν Ἐπικουρείων ⸀καὶ Στοϊκῶν φιλοσόφων συνέβαλλον αὐτῷ, καί τινες ἔλεγον· Τί ἂν θέλοι ὁ σπερμολόγος οὗτος λέγειν; οἱ δέ· Ξένων δαιμονίων δοκεῖ καταγγελεὺς εἶναι· ὅτι τὸν Ἰησοῦν καὶ τὴν ἀνάστασιν εὐηγγελίζετο.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/018.yaml
  text: Some of the Epicurean and Stoic philosophers also engaged with him[a], and some were saying, “What is this babbler trying to say?” But others said[d][c][b], “He seems to be a proclaimer of foreign deities,” because he was proclaiming the good news about Jesus and the resurrection.
translation:
  language: ig
  text: Ụfọdụ n’ime ndị ọkà ihe ọmụma Epikurean na ndị Stọik soro ya kparịta ụka.[a] Ụfọdụ na-ekwu, “Gịnị ka onye a na-atụtụ iberibe echiche[b] chọrọ ikwu?” Ma ndị ọzọ na-ekwu, “Ọ dị ka ọ bụ onye na-ekwusa chi ndị mba ọzọ[c],” n’ihi na ọ nọ na-ekwusa ozi ọma banyere Jizọs na mbilite n’ọnwụ.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “rụrịta ụka” ma ọ bụ “kparịta ụka” ya na ya; ngwaa Grik ahụ nwere ike ịpụta mkparịta ụka siri ike ma ọ bụ esemokwu.
    reason: lexical_alternative
  - marker: b
    text: Nke a bụ okwu nlelị nke pụtara n’ụzọ nkịtị “onye na-atụtụ mkpụrụ.” A na-eji ya akọwa onye a na-ele anya dị ka onye na-achịkọta iberibe echiche ndị ọzọ ma na-ekwughachi ha.
    reason: cultural_note
  - marker: c
    text: A pụkwara ịsị, “mmụọ ndị mba ọzọ” ma ọ bụ “chi ndị a na-amaghị ama.” N’ebe a, o yikarịrị ka ndị ahụ na-ekwu maka chi ma ọ bụ ndị dị nsọ ha na-amaghị n’usoro nkwenkwe ha, ọ bụghị kpọmkwem mmụọ ọjọọ n’echiche Ndị Kraịst.
    reason: alternative_reading
  - marker: d
    text: Ụfọdụ ndị na-akọwa akụkụ a chere na ndị Atens nwere ike iwere “mbilite n’ọnwụ” dị ka aha chi ọzọ, n’ihi na Pọl na-ekwusa banyere Jizọs na mbilite n’ọnwụ.
    reason: alternative_reading
lexical_decisions:
- source_word: συνέβαλλον αὐτῷ
  choice: sokwa ya na-ekwurịta okwu
  rationale: Okwu Grik a nwere ike ịpụta mkparịta ụka, arụmụka, ma ọ bụ esemokwu. Nhọrọ a na-edobe nghọta sara mbara n’ebughị ụzọ kpebie na mkparịta ụka ahụ bụ ọgụ okwu.
- source_word: σπερμολόγος
  choice: onye a na-atụtụ okwu iberibe
  rationale: Nke a na-egosipụta okwu nlelị ahụ e ji akọwa onye na-achịkọta iberibe echiche ma na-ekwughachi ha, ma ọ ka na-enye onye Igbo nke oge a nghọta.
- source_word: Τί ἂν θέλοι ... λέγειν
  choice: Gịnị ka ... na-achọ ikwu?
  rationale: Ụdị ajụjụ a na-egosipụta ntule nke nwere ntakịrị nlelị; ‘na-achọ ikwu’ bụ ụzọ Igbo dị ndụ e si gosipụta ya.
- source_word: Ξένων δαιμονίων
  choice: chi ndị mba ọzọ
  rationale: N’ọnọdụ ndị Atens na-ekwu okwu, δαιμόνια na-ezo aka n’ihe ndị ha weere dị ka chi ma ọ bụ ndị dị nsọ, ọ bụghị kpọmkwem ndị mmụọ ọjọọ dị ka nghọta Ndị Kraịst si dị.
- source_word: καταγγελεὺς
  choice: onye na-ekwusa
  rationale: Ọ na-akọwa onye na-eme ka ihe mara n’ihu ọha; ‘onye na-ekwusa’ bụ okwu Igbo doro anya ma kwesịkwa ekwesị.
- source_word: εὐηγγελίζετο
  choice: ọ nọ na-ekwusa ozi ọma
  rationale: Nhọrọ a na-edobe echiche kpọmkwem nke ikwusa ozi ọma, ọ bụghị naanị ikwu okwu ma ọ bụ izi ihe n’ozuzu.
- source_word: ἀνάστασιν
  choice: mbilite n’ọnwụ
  rationale: Nke a bụ okwu Igbo a na-aghọta nke ọma maka isi n’ọnwụ bilie, ma e meghị ya aha nke chi n’ahịrịokwu bụ isi.
- source_word: τινὲς ... καί τινες ... οἱ δέ
  choice: Ụfọdụ ... Ụfọdụ ... Ma ndị ọzọ
  rationale: Usoro a na-edobe mgbanwe dị n’etiti mmeghachi omume dị iche iche nke ndị nọ ebe ahụ.
- source_word: Ἐπικουρείων καὶ Στοϊκῶν φιλοσόφων
  choice: ndị ọkà ihe ọmụma òtù Epikurọs na òtù Stọik
  rationale: Nke a na-egosi na ha bụ ndị ọkà ihe ọmụma so n’ụlọ echiche abụọ a ma na-edobe aha òtù ndị ahụ.
theological_decisions:
- issue: Otú e si tụgharị δαιμόνια mgbe ndị na-ekpere arụsị na-ekwu okwu
  choice: chi ndị mba ọzọ
  alternative: mmụọ ọjọọ ndị mba ọzọ; chi ndị a na-amaghị ama
  rationale: Ndị na-ekwu okwu bụ ndị Atens na-eji usoro echiche okpukpe nke ha ekwu. ‘Chi’ na-egosipụta echiche ha n’etinyeghị nghọta Ndị Kraịst banyere mmụọ ọjọọ n’ọnụ ha.
- issue: Ma a ga-eme ‘mbilite n’ọnwụ’ aha pụrụ iche dị ka a ga-asị na e mere ya chi
  choice: mbilite n’ọnwụ
  alternative: Mbilite-n’Ọnwụ dị ka aha pụrụ iche
  rationale: Nkọwa Luk n’onwe ya na-ekwu ihe Pọl na-ekwusa. Ya mere, isi ederede na-edobe ya dị ka ihe omume, ebe ndetu ala na-echekwa echiche ọzọ na ndị Atens nwere ike iche na ọ bụ aha chi ọzọ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. A hapụrụ aha ụlọ echiche Grik dị ka Epikurọs na Stọik, tinyekwa ‘òtù’ iji mee ka mmekọrịta ndị ọkà ihe ọmụma ahụ na ụlọ echiche ha doo anya. E debere mkparị dị na σπερμολόγος n’ụzọ na-adịghị eji okwu rụrụ arụ.
