id: ACT.17.23
reference: Acts 17:23
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: διερχόμενος γὰρ καὶ ἀναθεωρῶν τὰ σεβάσματα ὑμῶν εὗρον καὶ βωμὸν ἐν ᾧ ἐπεγέγραπτο· Ἀγνώστῳ θεῷ. ⸀ὃ οὖν ἀγνοοῦντες εὐσεβεῖτε, ⸀τοῦτο ἐγὼ καταγγέλλω ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/023.yaml
  text: For as I was passing through and observing your objects of worship[a], I even found an altar on which had been inscribed, ‘To an unknown god.’ Therefore[b], what you worship in ignorance—this I proclaim to you.
translation:
  language: ig
  text: 'N’ihi na, mgbe m na-agafe ma na-eleru ihe ndị unu na-efe anya nke ọma, ahụrụ m ọbụna ebe ịchụàjà nke e dere n’elu ya, sị: “Nye chi a na-amaghị.”[a] Ya mere, ihe unu na-efe n’amaghị ama—ihe ahụ ka m na-ekwusara unu.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “Nye chi ahụ a na-amaghị.” Okwu Grik ahụ enweghị okwu mmejuputa aha, ya mere a pụrụ ịghọta ya dịka “chi a na-amaghị” ma ọ bụ, n’ụzọ e si ekwu ụdị ederede nraranye a, “chi ahụ a na-amaghị.”
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ikwu, “onye unu na-efe n’amaghị ama.” Ma Grik ji nnọchiaha nke na-adịghị akọwa nwoke ma ọ bụ nwanyị, nke pụtara “ihe” ma ọ bụ “ihe ahụ,” ọ bụghị nnọchiaha na-ezo aka n’ụlọ nwoke nke pụtara “onye.”
    reason: alternative_reading
lexical_decisions:
- source_word: διερχόμενος
  choice: mgbe m na-agafe
  rationale: A sụgharịrị participle dị ugbu a dịka nkebiokwu oge na-aga n’ihu, nke na-ada nke ọma n’Igbo ma jikọta ya na ihe Pọl nọ na-eme n’otu oge ahụ.
- source_word: ἀναθεωρῶν
  choice: na-eleru … anya nke ọma
  rationale: Nke a na-egosi ile ihe anya nke ọma na nlebara anya, ọ bụghị naanị ile ya anya ngwa ngwa.
- source_word: τὰ σεβάσματα ὑμῶν
  choice: ihe ndị unu na-efe
  rationale: Okwu Grik a sara mbara, na-ezo aka n’ihe okpukpe ndị mmadụ na-asọpụrụ ma ọ bụ na-efe; nsụgharị a ezere ime ka ọ bụrụ naanị arụsị, ụlọ arụsị, ma ọ bụ ebe nsọ.
- source_word: βωμόν
  choice: ebe ịchụàjà
  rationale: Nke a bụ okwu Igbo a na-ejikarị akọwa ebe a na-achụ àjà n’okpukpe.
- source_word: ἐπεγέγραπτο
  choice: nke e dere ihe a n’elu ya
  rationale: Ọ na-egosi na e deela ihe ahụ n’elu ebe ịchụàjà tupu Pọl ahụ ya; ahịrịokwu a bụkwa nke doro ndị na-agụ Igbo anya.
- source_word: Ἀγνώστῳ θεῷ
  choice: Nye chi a na-amaghị
  rationale: Nke a dabara n’ụdị okwu e ji arara ihe nye chi ma na-ahapụ chi ahụ dị ka nke a na-amaghị; enweghị article n’okwu Grik ahụ.
- source_word: ὃ οὖν
  choice: Ya mere, ihe
  rationale: “Ihe” na-echekwa neuter relative pronoun nke Grik, ebe “Ya mere” na-egosi nkwubi okwu οὖν.
- source_word: ἀγνοοῦντες
  choice: n’amaghị ama
  rationale: Ọ na-akọwa ụzọ ha si efe, ma na-echekwa njikọ okwu dị n’etiti “a na-amaghị” na “n’amaghị ama.”
- source_word: εὐσεβεῖτε
  choice: unu na-efe
  rationale: N’ọnọdụ a, ngwaa ahụ pụtara inye ihe nsọpụrụ okpukpe; “ife” bụ ụzọ doro anya ma bụrụkwa nke nkịtị n’Igbo.
- source_word: καταγγέλλω
  choice: m na-ekwusara unu
  rationale: Ọ na-egosi nkwupụta a na-eme n’ihu ọha n’ike na n’ụzọ doro anya.
theological_decisions:
- issue: Ihe neuter relative pronoun ὃ na-ezo aka na ya
  choice: ihe unu na-efe n’amaghị ama
  alternative: onye unu na-efe n’amaghị ya
  rationale: Okwu Grik ji nnọchiaha neuter, ya mere nsụgharị bụ isi ekwughị kpọmkwem “onye.” Nke a na-echekwa otú Pọl si malite n’ihe e dere n’ebe ịchụàjà ahụ n’emeghị ka asụsụ ahụ bụrụ nke na-akọwapụta onye karịa ihe Grik kwuru.
- issue: Ma Ἀγνώστῳ θεῷ ọ bụ chi ọ bụla a na-amaghị ka ọ bụ chi ahụ a na-amaghị
  choice: Nye chi a na-amaghị
  alternative: Nye chi ahụ a na-amaghị
  rationale: E nweghị article n’ahịrịokwu Grik ahụ, ya mere nsụgharị bụ isi na-eji ụdị na-abụghị definite; ma ụdị definite ka nwere ike ịbụ ụzọ e si aghọta ederede nraranye ahụ, nke mere e ji debe ya n’akụkụ nkọwa.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. Ahịrịokwu ahụ na-edebe usoro arụmụka Pọl, nkwughachi echiche “a na-amaghị/n’amaghị ama,” na nkwusi ike dị na “ihe ahụ ka,” ma na-ezere okwu nke otu ụka ma ọ bụ nkọwa okpukpe agbakwunyere.
