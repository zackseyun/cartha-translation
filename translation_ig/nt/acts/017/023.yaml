  terminology: “Ebe ịchụàjà,” “chi,” “ife,” and “ikwuputa/ikwusara” are appropriate. The footnote should not leave the grammatical labels “article,” “neuter,” and “masculine” unexplained in English; Standard Igbo equivalents make the note accessible and maintain its grammatical point.
