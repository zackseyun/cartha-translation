revisions:
- from: Ụfọdụ n’ime ha kwetara n’ihe ahụ, wee sonyere Pọl na Saịlas[a], tinyere ọtụtụ ndị Gris na-atụ egwu Chineke na ụmụ nwanyị ndị a ma ama, bụ́ ndị na-abụghị ole na ole.
  to: Ụfọdụ n’ime ha kwetara n’ihe ahụ, wee sonyere Pọl na Saịlas[a], tinyere ọtụtụ ndị Gris na-atụ egwu Chineke na ụmụ nwanyị ndị a ma ama n’obodo, ndị na-abụghị ole na ole.
  rationale: The revision keeps the draft’s faithful rendering of ἐπείσθησαν as assent/persuasion and its historically appropriate rendering of the God-fearing Greeks. It clarifies that “not a few” modifies only the prominent women, sharpens the social sense of τῶν πρώτων, and revises the note to express the rare verb’s association/allotment nuance without implying a formal organization.
