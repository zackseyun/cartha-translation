  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καί τινες ἐξ αὐτῶν ἐπείσθησαν καὶ προσεκληρώθησαν τῷ Παύλῳ καὶ τῷ Σιλᾷ, τῶν τε σεβομένων Ἑλλήνων ⸂πλῆθος πολὺ⸃ γυναικῶν τε τῶν πρώτων οὐκ ὀλίγαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/004.yaml
  text: And some of them were persuaded and joined Paul and Silas[a], along with a large number of the God-fearing Greeks and not a few of the leading women.
translation:
  language: ig
  text: Ụfọdụ n’ime ha kwetara n’ihe ahụ, wee sonyere Pọl na Saịlas[a], tinyere ọtụtụ ndị Gris na-atụ egwu Chineke na ụmụ nwanyị ndị a ma ama n’obodo, ndị na-abụghị ole na ole.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n’ụzọ ka nso n’okwu Grik, “e jikọtara ha na Pọl na Saịlas dịka ndị ha na ha na-eketa òkè.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τινες ἐξ αὐτῶν
  choice: ụfọdụ n’ime ha
  rationale: Nke a na-egosipụta nkebi nke ndị a kpọtụrụ aha n’amaokwu gara aga n’ụzọ doro anya ma bụrụkwa Igbo nkịtị.
- source_word: ἐπείσθησαν
  choice: kwetara n’ihe ahụ
  rationale: Nke a na-egosi na ozi ahụ mere ka ha kwenye, ma ọ naghị eji okwu a kapịrị ọnụ pụtara ‘ikwere’ dochie πείθω.
- source_word: προσεκληρώθησαν
  choice: sonyere
  rationale: Ngwaa Grik a na-adịghị ahụkarị na-egosi na e jikọtara ha na Pọl na Saịlas ma ọ bụ na ha sonyeere ha. ‘Sonyere’ bụ okwu Igbo doro anya ma dị ndụ; e debere echiche nke òkè ma ọ bụ nke ikenye na nkọwa ala peeji.
- source_word: τῶν τε σεβομένων Ἑλλήνων
  choice: ọtụtụ ndị Gris na-atụ egwu Chineke
  rationale: N’Ọrụ Ndị Ozi, okwu a na-akọwakarị ndị mba ọzọ na-asọpụrụ Chineke Izrel ma na-eso ofufe ndị Juu. ‘Na-atụ egwu Chineke’ na-echekwa echiche nke nsọpụrụ okpukpe dị n’okwu ahụ.
- source_word: πλῆθος πολὺ
  choice: ọtụtụ
  rationale: Ọ bụ ụzọ Igbo dị mfe ma bụrụ ihe e ji ekwu ọnụ ọgụgụ buru ibu.
- source_word: γυναικῶν τε τῶν πρώτων
  choice: ụmụ nwanyị ndị a ma ama
  rationale: πρῶτος n’ebe a na-egosi ịbụ onye nwere ugwu ma ọ bụ ọkwá n’obodo, ọ bụghị onye mbụ n’usoro oge.
- source_word: οὐκ ὀλίγαι
  choice: ndị na-abụghị ole na ole
  rationale: Nke a na-echekwa ụzọ Lụk si mesie ọnụ ọgụgụ ha ike site n’ikwu na ha abụghị ole na ole, kama ịgbanwe ya nanị ka ọ bụrụ ‘ọtụtụ.’
theological_decisions:
- issue: Ma a ga-eji okwu pụtara nkwere n'ụzọ okpukpe kpọmkwem sụgharịa ἐπείσθησαν
  choice: kwetara n’ihe ahụ
  alternative: kweere
  rationale: Ebe ọ bụ na Grik ji πείθω, ọ bụghị πιστεύω, nsụgharị a na-egosi na e mere ka ha kwenye n’ozi ahụ n’ebughị ụzọ mee ka okwu ahụ bụrụ okwu okwukwe a kapịrị ọnụ.
- issue: Ogo a ga-eme ka njirimara okpukpe nke σεβομένων Ἑλλήνων pụta ìhè
  choice: ndị Gris na-atụ egwu Chineke
  alternative: ndị Gris ji okpukpe kpọrọ ihe
  rationale: N’ọnọdụ akụkọ Ọrụ Ndị Ozi, ihe ha na-asọpụrụ bụ Chineke Izrel. Nsụgharị a na-eme ka ihe ahụ doro anya ma ghara itinye njirimara otu ụka ọ bụla.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta, dee amaokwu ahụ. E chekwara usoro okwu ‘ndị na-abụghị ole na ole’ iji hapụ nkwusi ike dị n’ụdị okwu Grik, ebe e tinyere nkọwa nke ngwaa a na-adịghị ahụkarị n’ala peeji.
