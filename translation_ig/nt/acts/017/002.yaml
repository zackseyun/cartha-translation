  text: κατὰ δὲ τὸ εἰωθὸς τῷ Παύλῳ εἰσῆλθεν πρὸς αὐτοὺς καὶ ἐπὶ σάββατα τρία διελέξατο αὐτοῖς ἀπὸ τῶν γραφῶν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/002.yaml
  text: And according to Paul's custom[a], he went in to them, and on three Sabbaths he reasoned with them from the Scriptures[c][b],
translation:
  language: ig
  text: Dị ka Pọl si emekarị[a], ọ banyere n’ebe ha nọ, n’ụbọchị Izu Ike atọ[b], ya na ha kparịtara ụka site n’Akwụkwọ Nsọ[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “dị ka ọ bụ omenala Pọl.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “n’ime ụbọchị Izu Ike atọ.”
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “ya na ha kwurịtara okwu” ma ọ bụ “ya na ha tụlere ihe ọnụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ δὲ τὸ εἰωθὸς τῷ Παύλῳ
  choice: Dịkwa ka Pọl si eme mgbe niile
  rationale: Nkebiokwu a na-egosi omume Pọl guzosiri ike, ya bụ, ihe ọ na-emekarị. Nsụgharị a bụ Igbo dị mfe ma doo anya, ma debe echiche nke omume a na-eme mgbe niile.
- source_word: εἰσῆλθεν πρὸς αὐτοὺς
  choice: ọ banyere n’etiti ha
  rationale: Nke a na-edebe echiche εἰσέρχομαι nke ịbanye na ntụziaka πρὸς αὐτούς, n’agbanyeghị na ọ naghị etinye ‘ụlọ nzukọ’ n’amaokwu ahụ ebe Grik ji nnọchiaha naanị.
- source_word: ἐπὶ σάββατα τρία
  choice: ụbọchị Izu Ike atọ
  rationale: Nke a na-egosi oge atọ dị iche iche nke ụbọchị Izu Ike, kwekọọkwa n’echiche nkesa ma ọ bụ ogologo oge nke ἐπί na accusative n’ebe a.
- source_word: διελέξατο
  choice: ya na ha ... tụlekọrịta ihe
  rationale: ‘Tụlekọrịta ihe’ na-egosi mkparịta ụka nwere ntụgharị uche na ịkọwa ihe, n’ebughị ụzọ mee ka ọ bụrụ esemokwu iwe ma ọ bụ nkuzi otu akụkụ.
- source_word: ἀπὸ τῶν γραφῶν
  choice: ihe sitere n’Akwụkwọ Nsọ
  rationale: ‘Akwụkwọ Nsọ’ bụ okwu Igbo a na-ahụkarị maka γραφαί dị ka ihe odide dị nsọ nke nwere ikike; ‘sitere’ na-edebe ἀπό dịka isi mmalite nke ntụlekọrịta ahụ.
theological_decisions:
- issue: Ndị nnọchiaha ‘ha’ na-ezo aka n’ebe Pọl banyere
  choice: E debere ‘ha’ n’amaokwu ahụ n’akọwaghị ha ọzọ.
  alternative: ‘ọ banyere n’ụlọ nzukọ’ ma ọ bụ ‘ọ gakwuuru ndị Juu nọ ebe ahụ’
  rationale: Amaokwu ndị gbara ya gburugburu na-egosi ụlọ nzukọ, ma amaokwu Grik a ji naanị nnọchiaha. Idebe ‘ha’ na-ezere itinye nkọwa karịrị ihe amaokwu a kwuru.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke kwụ ọtọ ma dị ugwu. ‘Ụbọchị Izu Ike’ na ‘Akwụkwọ Nsọ’ bụ okwu ndị nkịtị na-aghọta ngwa ngwa; ahịrịokwu ahụ na-edebekwa nnọchiaha na mmekọrịta mkparịta ụka dị na Grik.
