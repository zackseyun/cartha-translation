id: ACT.17.30
reference: Acts 17:30
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τοὺς μὲν οὖν χρόνους τῆς ἀγνοίας ὑπεριδὼν ὁ θεὸς τὰ νῦν ⸀παραγγέλλει τοῖς ἀνθρώποις ⸀πάντας πανταχοῦ μετανοεῖν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/030.yaml
  text: Therefore[a], having overlooked the times of ignorance, God now commands all people everywhere to repent[b],
translation:
  language: ig
  text: Ya mere, mgbe Chineke leghaara oge nke amaghị ama anya[a], ugbu a ọ na-enye mmadụ niile nọ n’ebe niile iwu ka ha chegharịa[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “hapụrụ oge ndị ahụ ka ha gafee.” Ihe ọ pụtara bụ na Chineke ji ndidi nagide oge amaghị ama ndị ahụ, ọ bụghị na ọ kwadoro ha.
    reason: lexical_alternative
  - marker: b
    text: “Chegharịa” na-egosi mgbanwe nke uche na ụzọ ndụ.
    reason: lexical_clarification
lexical_decisions:
- source_word: τοὺς μὲν οὖν χρόνους τῆς ἀγνοίας
  choice: Ya mere, mgbe ... oge ndị mmadụ nọ n’amaghị ama
  rationale: “Ya mere” na-egosi ngafe echiche nke μὲν οὖν, ebe “oge ndị mmadụ nọ n’amaghị ama” na-enye τῆς ἀγνοίας n’Igbo doro anya n’etinyeghị kpọmkwem ihe ha na-amaghị.
- source_word: ὑπεριδὼν
  choice: leghaara ... anya
  rationale: Nkebi a na-egosi na Chineke hapụrụ oge ndị ahụ ka ha gafee n’enyeghị ikpe ozugbo; ọ pụtaghị na ọ kwadoro amaghị ama ahụ.
- source_word: τὰ νῦν παραγγέλλει
  choice: ugbu a ọ na-enye ... iwu
  rationale: “Ugbu a” na-echekwa ọdịiche dị n’etiti oge gara aga na ọnọdụ dị ugbu a, ebe “na-enye iwu” na-edobe ike nke παραγγέλλει.
- source_word: τοῖς ἀνθρώποις πάντας πανταχοῦ
  choice: mmadụ niile nọ n’ebe niile
  rationale: Nke a na-egosi na iwu ahụ metụtara mmadụ nile, ọ bụghị naanị ndị nwoke ma ọ bụ naanị ndị mba ọzọ.
- source_word: μετανοεῖν
  choice: ka ha chegharịa
  rationale: “Chegharịa” bụ okwu Igbo a na-ejikarị akọwa ntụgharị nke uche na omume nke μετανοεῖν na-achọ, n’enweghị ịkọwa ya karịa ihe Grik kwuru.
theological_decisions:
- issue: Ihe Chineke mere banyere oge amaghị ama
  choice: “leghaara ... anya” n’echiche nke ntachi obi na enweghị ikpe ozugbo
  alternative: Chineke kwadoro ma ọ bụ gbaghara amaghị ama ahụ kpamkpam
  rationale: ὑπεριδὼν na iwu dị ugbu a ka mmadụ chegharịa na-ejikọta ntachi obi Chineke na ibu ọrụ mmadụ; ntụgharị a anaghị ekwu na Chineke kwadoro ikpere arụsị.
- issue: Ndị iwu nchegharị ahụ metụtara
  choice: mmadụ niile nọ n’ebe niile
  alternative: naanị ndị nwoke ma ọ bụ naanị ndị mba ọzọ
  rationale: τοῖς ἀνθρώποις πάντας πανταχοῦ nwere oke zuru ụwa ọnụ ma na-ezo aka n’ụmụ mmadụ n’ozuzu.
translation_notes:
  register: Standard Igbo; asụsụ dị ugbu a, dị nsọ ma dị mfe nghọta. E ji “mmadụ niile” chekwaa izugbe nke ἄνθρωποι, ma debe ọdịiche dị n’etiti oge gara aga na “ugbu a.”
