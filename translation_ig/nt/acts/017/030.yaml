    reason: lexical_alternative
  - marker: b
    text: “Chegharịa” na-egosi mgbanwe nke uche na ụzọ ndụ.
    reason: lexical_clarification
  revision_rationale: The revision removes an added referent from “the times of ignorance” and limits the repentance note to an explanation warranted by the lexical sense, while retaining the draft’s accurate, natural renderings of divine forbearance, command, and universal scope.
