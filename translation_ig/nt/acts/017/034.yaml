  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τινὲς δὲ ἄνδρες κολληθέντες αὐτῷ ἐπίστευσαν, ἐν οἷς καὶ Διονύσιος ὁ Ἀρεοπαγίτης καὶ γυνὴ ὀνόματι Δάμαρις καὶ ἕτεροι σὺν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/034.yaml
  text: But some men joined him and believed[a], among whom were also Dionysius the Areopagite, and a woman named Damaris[b], and others with them.
translation:
  language: ig
  text: Ma ụfọdụ ndị ikom rapaara ya n’ahụ, kwere[a]. Ndị so n’ime ha bụ Dionisiọs, onye Areọpagọs[b], na Damaris, otu nwanyị, na ndị ọzọ sokwa ha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ịsụgharị ya: “sonyeere ya,” “jikọtara onwe ha na ya,” ma ọ bụ “rapaara ya n’ahụ.” Okwu Grik ahụ na-egosi mmekọrịta chiri anya ha na Pọl.'
    reason: lexical_alternative
  - marker: b
    text: “Onye Areọpagọs” nwere ike ịpụta onye so n’ọgbakọ ikpe Areọpagọs, ma ọ bụ onye e jikọtara n’ụzọ pụrụ iche na òtù ahụ.
    reason: cultural_note
lexical_decisions:
- source_word: τινὲς δὲ ἄνδρες
  choice: Ma ụfọdụ ndị ikom
  rationale: “Ụfọdụ” na-egosi otu akụkụ nke ìgwè ndị gere ntị; “ma” na-egosipụta ọdịiche dị nro n’etiti ha na mmeghachi omume ndị e kwuru n’amaokwu bu ụzọ. “Ndị ikom” na-edobe ụdị nwoke nke ἄνδρες.
- source_word: κολληθέντες αὐτῷ
  choice: sonyeere ya
  rationale: Nkebiokwu a na-egosi na ha jikọtara onwe ha na Pọl ma soro ya nke ọma; “sonyeere ya” bụ Igbo dị mfe ma na-edobe echiche nke mmekọrịta chiri anya.
- source_word: ἐπίστευσαν
  choice: kwerekwa
  rationale: Nke a sụgharịrị πιστεύω ozugbo dị ka “kwere,” n’ebughị ụzọ kọwaa ihe odide ahụ na-ekwughị kpọmkwem banyere ihe okwukwe ha niile gụnyere.
- source_word: ἐν οἷς καὶ
  choice: N’ime ha, e nwere
  rationale: Ọ na-ewebata ndị a kpọrọ aha dị ka ụfọdụ n’ime ndị ahụ sonyere Pọl ma kwere.
- source_word: Διονύσιος
  choice: Daịọnisiọs
  rationale: Nsụpe Igbo nke aha Grik ahụ, nke na-enyere onye na-agụ Igbo aka ịkpọ ya nke ọma.
- source_word: ὁ Ἀρεοπαγίτης
  choice: onye òtù Areọpagọs
  rationale: Aha njirimara a nwere ike ịpụta onye so n’òtù Areọpagọs ma ọ bụ onye e jikọtara na ya. N’ebe a, a họọrọ okwu dị mfe nke na-egosi òtù ahụ, ebe nkọwa ala peeji na-echekwa ohere ọzọ.
- source_word: γυνὴ ὀνόματι Δάμαρις
  choice: otu nwanyị aha ya bụ Damaris
  rationale: Nsụgharị a bụ Igbo nkịtị ma doo anya, na-edobekwa okike na aha onye ahụ.
- source_word: ἕτεροι σὺν αὐτοῖς
  choice: ndị ọzọ ha na ha nọ
  rationale: Ọ na-egosi ndị ọzọ a na-akpọghị aha, ndị so ndị ahụ a kpọrọ aha.
theological_decisions:
- issue: Ihe πιστεύω pụtara n’ebe a
  choice: kwere
  alternative: bịara nwee okwukwe
  rationale: “Kwere” na-edobe nkwupụta akụkọ ahụ n’ụzọ kwụ ọtọ, n’etinyeghị usoro ozizi zuru ezu nke amaokwu ahụ na-akọwaghị.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E debere ọdịiche dị n’etiti ndị ikom na nwanyị ahụ, ma zere ịgbakwunye onye ma ọ bụ ihe ha kweere n’ime ahịrịokwu n’ihi na Grik ekwughị ya kpọmkwem.
