id: ACT.17.31
reference: Acts 17:31
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸀καθότι ἔστησεν ἡμέραν ἐν ᾗ μέλλει κρίνειν τὴν οἰκουμένην ἐν δικαιοσύνῃ ἐν ἀνδρὶ ᾧ ὥρισεν, πίστιν παρασχὼν πᾶσιν ἀναστήσας αὐτὸν ἐκ νεκρῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/031.yaml
  text: because he has fixed a day on which he is going to judge the inhabited world in righteousness by a man whom he appointed[b][a], having given proof to all by raising him from the dead.
translation:
  language: ig
  text: N’ihi na o debela ụbọchị ọ ga-ekpe ụwa mmadụ bi n’ime ya ikpe n’ezi omume[a] site n’aka otu nwoke ọ họpụtara. O nyela mmadụ niile ihe àmà site n’ịkpọlite ya site n’etiti ndị nwụrụ anwụ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “n’ikpe ziri ezi.”
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, “o nyela mmadụ niile nkwesi-ike.” N’ụzọ nkịtị, okwu Grik ahụ bụ “o nyela mmadụ niile okwukwe,” ma n’ebe a ọ pụtara ihe àmà ma ọ bụ nkwesi-ike e nyere mmadụ niile.
    reason: alternative_reading
lexical_decisions:
- source_word: καθότι
  choice: N’ihi na
  rationale: Ọ na-egosi ihe mere oku e kpọrọ mmadụ ka ha chegharịa n’amaokwu bu ụzọ ji dị mkpa, ma na-ada nke ọma n’Igbo nke oge a.
- source_word: ἔστησεν ἡμέραν
  choice: o dowo ụbọchị
  rationale: Nkebi a na-egosi na Chineke ekpebiela ma guzobe otu ụbọchị; ‘dowo ụbọchị’ na-egosipụta mkpebi a n’ụzọ doro anya.
- source_word: ἐν ᾗ μέλλει κρίνειν
  choice: ọ ga-eji ... kpee ... ikpe
  rationale: Nke a na-egosi ikpe nke e bu n’obi ime n’ụbọchị ahụ ma bụrụ usoro okwu Igbo ebumpụta ụwa.
- source_word: τὴν οἰκουμένην
  choice: ụwa mmadụ bi
  rationale: Ọ na-echekwa echiche nke ụwa mmadụ bi na ya na oke mmadụ niile metụtara, kama ịsị naanị ‘ụwa’ n’ụzọ nwere ike ịdị obosara karịa.
- source_word: ἐν δικαιοσύνῃ
  choice: jiri ezi omume
  rationale: ‘Ezi omume’ na-echekwa okwu δικαιοσύνη, ebe ihe gbara ya gburugburu na-egosi ikpe ziri ezi. E debere ‘ikpe ziri ezi’ dị ka nhọrọ ọzọ n’okpuru amaokwu.
- source_word: ἐν ἀνδρὶ ᾧ ὥρισεν
  choice: site n’aka otu nwoke ọ họpụtara
  rationale: ‘Otu nwoke’ na-egosipụta ἀνήρ nke ọma ma na-echekwa enweghị mkpụrụokwu na-akọwapụta aha n’asụsụ Grik; ‘site n’aka’ na-egosi na Chineke ga-eji nwoke ahụ kpee ikpe.
- source_word: πίστιν παρασχὼν πᾶσιν
  choice: o nyela mmadụ niile ihe àmà doro anya banyere nke a
  rationale: N’usoro okwu a, πίστις ya na παρέχω pụtara ihe àmà ma ọ bụ nkwenye e nyere, ọ bụghị okwukwe mmadụ nwere. Nkebi ‘banyere nke a’ na-eme ka ihe àmà ahụ jikọọ n’ụzọ doro anya na nhọpụta nwoke ahụ na ikpe na-abịa.
- source_word: ἀναστήσας αὐτὸν ἐκ νεκρῶν
  choice: site n’ịkpọlite nwoke ahụ n’etiti ndị nwụrụ anwụ
  rationale: ‘Site n’ịkpọlite’ na-egosi na mbilite n’ọnwụ bụ ụzọ Chineke si nye ihe àmà ahụ; ‘n’etiti ndị nwụrụ anwụ’ na-echekwa ụdị ọtụtụ nke νεκρῶν.
theological_decisions:
- issue: Nsụgharị δικαιοσύνη
  choice: ezi omume
  alternative: ikpe ziri ezi
  rationale: ‘Ezi omume’ na-echekwa ịdị obosara nke okwu ahụ, ebe ‘ikpe ziri ezi’ dabara nke ọma n’ihe gbasara ikpe. E tinyere nhọrọ nke abụọ n’okpuru amaokwu ka a ghara izochi nghọta abụọ ahụ.
- issue: Nsụgharị πίστις n’okwu πίστιν παρασχὼν πᾶσιν
  choice: ihe àmà doro anya
  alternative: nkwenye; n’ụzọ nkịtị, okwukwe
  rationale: N’ebe a, njikọ πίστις na παρέχω na-egosi ihe e nyere mmadụ niile iji mee ka okwu ahụ bụrụ nke a pụrụ ịtụkwasị obi. Ịsụgharị ya naanị dị ka ‘okwukwe’ nwere ike ime ka a ghọta na Chineke nyere mmadụ niile okwukwe nzọpụta, nke okwu a anaghị ekwu kpọmkwem.
- issue: Nsụgharị ἀνδρί
  choice: otu nwoke
  alternative: nwoke ahụ
  rationale: Okwu Grik ahụ kpọmkwem bụ ‘nwoke’ ma o nweghị mkpụrụokwu na-akọwapụta aha n’ebe a. N’agbanyeghị na ihe gbara ya gburugburu na-eme ka onye a bụrụ onye a maara, nsụgharị ahụ anaghị etinye aha Jizọs n’amaokwu ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. E chekwara otu ahịrịokwu nwere usoro siri ike nke amaokwu Grik site n’iji semicolon kewaa isi omume abụọ. ‘Ụwa mmadụ bi’ bụ okwu nkọwa doro anya maka οἰκουμένη, ebe ‘n’etiti ndị nwụrụ anwụ’ na-echekwa ụdị okwu Grik nke ọma.
