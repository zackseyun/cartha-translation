review_pass:
  verdict: revise
  source_fidelity: The draft preserves the principal clauses and correctly represents the appointed day, universal scope, righteous judgment through an appointed man, public assurance, and resurrection. However, «o dowo ụbọchị» is not idiomatic Standard Igbo for setting/appointing a day, and «ihe àmà doro anya banyere nke a» adds both the intensifier “clear” and an explicit referential phrase not stated in Greek.
  naturalness: 'The revised wording uses more natural Standard Igbo syntax: «o debela ụbọchị» for an established day and «ụwa mmadụ bi n’ime ya» for the inhabited world. It also avoids repeating «nwoke ahụ» where the Greek uses a pronoun.'
  terminology: «ezi omume» suitably renders δικαιοσύνῃ, with the justice-related alternative retained. «otu nwoke» preserves the explicitly male, formally indefinite ἀνδρί without importing the name of Jesus. «ihe àmà» appropriately conveys πίστιν παρασχών in this idiom; the footnote records assurance and the more literal lexical sense.
  issues:
  - severity: medium
    issue: «o dowo ụbọchị»
    rationale: This is not a natural Standard Igbo expression for God’s having fixed or appointed a day. «o debela ụbọchị» clearly conveys an established, determined day.
  - severity: low
    issue: «ihe àmà doro anya banyere nke a»
    rationale: «doro anya» intensifies “proof,” and «banyere nke a» supplies an explicit object not present in the source. «ihe àmà» is sufficient, while the following participial phrase states how the assurance was provided.
  revised_text: N’ihi na o debela ụbọchị ọ ga-ekpe ụwa mmadụ bi n’ime ya ikpe n’ezi omume[a] site n’aka otu nwoke ọ họpụtara. O nyela mmadụ niile ihe àmà site n’ịkpọlite ya site n’etiti ndị nwụrụ anwụ.[b]
  revised_footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “n’ikpe ziri ezi.”
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, “o nyela mmadụ niile nkwesi-ike.” N’ụzọ nkịtị, okwu Grik ahụ bụ “o nyela mmadụ niile okwukwe,” ma n’ebe a ọ pụtara ihe àmà ma ọ bụ nkwesi-ike e nyere mmadụ niile.
    reason: alternative_reading
  revision_rationale: The revision corrects an unnatural verbal expression, removes minor unsupported intensification and explicitation, and keeps the Greek participle’s means sense (“by raising him”). The two sentences are natural Igbo while retaining the causal and logical sequence of the verse. Footnote anchors remain attached to the relevant phrases.
