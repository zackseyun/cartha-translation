- from: N’ihi na o dowo ụbọchị ọ ga-eji ezi omume[a] kpee ụwa mmadụ bi ikpe site n’aka otu nwoke ọ họpụtara; o nyela mmadụ niile ihe àmà doro anya banyere nke a[b] site n’ịkpọlite nwoke ahụ n’etiti ndị nwụrụ anwụ.
  to: N’ihi na o debela ụbọchị ọ ga-ekpe ụwa mmadụ bi n’ime ya ikpe n’ezi omume[a] site n’aka otu nwoke ọ họpụtara. O nyela mmadụ niile ihe àmà site n’ịkpọlite ya site n’etiti ndị nwụrụ anwụ.[b]
