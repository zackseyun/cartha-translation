id: ACT.17.3
reference: Acts 17:3
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: διανοίγων καὶ παρατιθέμενος ὅτι τὸν χριστὸν ἔδει παθεῖν καὶ ἀναστῆναι ἐκ νεκρῶν, καὶ ὅτι οὗτός ἐστιν ⸂ὁ χριστός, ὁ⸃ Ἰησοῦς ὃν ἐγὼ καταγγέλλω ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/003.yaml
  text: explaining and demonstrating that the Messiah had to suffer and rise from the dead[a], and that this Jesus, whom I proclaim to you[b], is the Messiah.
translation:
  language: ig
  text: Ọ na-akọwa ma na-egosi na Mesaịa ahụ[a] aghaghị ịta ahụhụ ma si n’etiti ndị nwụrụ anwụ bilie[b], nakwa na Jizọs a, onye m na-ekwusara unu, bụ Mesaịa ahụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “Kraịst ahụ” n’ebe abụọ e dere “Mesaịa ahụ.”
    reason: alternative_reading
  - marker: b
    text: A pụkwara ịsụgharị ya “ka e mee ka o si n’etiti ndị nwụrụ anwụ bilie.” Ma ngwaa Grik dị n’ebe a nọ n’olu ọrụ, ya bụ, “bilie,” ọ bụ ezie na Agba Ọhụrụ kwukwara n’ebe ndị ọzọ na Chineke mere ka Jizọs si n’ọnwụ bilie.
    reason: lexical_alternative
lexical_decisions:
- source_word: διανοίγων
  choice: na-akọwa
  rationale: Okwu a na-egosi ime ka ihe Akwụkwọ Nsọ pụtara doo anya; “na-akọwa” bụ okwu Igbo doro anya ma kwekọọ n’arụmụka Pọl nọ na-eme.
- source_word: παρατιθέμενος
  choice: na-egosi
  rationale: N’ebe a, ọ pụtara iweta ihe akaebe ma ọ bụ ịtọpụta arụmụka. “Na-egosi” na-enye echiche ahụ n’ụzọ dị mfe n’etinyeghị echiche nke ihe akaebe iwu siri ike.
- source_word: τὸν χριστόν / ὁ χριστός
  choice: Mesaịa ahụ
  rationale: Χριστός bụ utu aha n’ebe abụọ a, na-ezo aka n’Onye E Tere Mmanụ ahụ ndị Juu na-atụ anya ya; “Mesaịa ahụ” na-echekwa ọnọdụ Akwụkwọ Nsọ na arụmụka amaokwu ahụ.
- source_word: ἔδει
  choice: aghaghị
  rationale: Ọ na-egosi mkpa dị n’atụmatụ Chineke dịka Akwụkwọ Nsọ siri kwuo, ọ bụghị naanị na ihe ahụ nwere ike ime.
- source_word: παθεῖν
  choice: ịta ahụhụ
  rationale: Nke a bụ ụzọ Igbo nkịtị na nke doro anya isi kwuo nhụjuanya Mesaịa ahụ.
- source_word: ἀναστῆναι ἐκ νεκρῶν
  choice: si n’etiti ndị nwụrụ anwụ bilie
  rationale: “Bilie” na-edobe olu nke ngwaa Grik ahụ, ebe “si n’etiti ndị nwụrụ anwụ” na-egosipụta ἐκ νεκρῶν nke ọma.
- source_word: καταγγέλλω ὑμῖν
  choice: m na-ekwusara unu
  rationale: “Ikwusa” na-egosipụta izisa ozi n’ihu ọha, “unu” bụkwa nnọchiaha ọtụtụ nke ὑμῖν.
theological_decisions:
- issue: Nsụgharị Χριστός dịka utu aha n’ebe abụọ a
  choice: Mesaịa ahụ
  alternative: Kraịst ahụ
  rationale: Arụmụka amaokwu ahụ bụ na Onye E Tere Mmanụ ahụ aghaghị ịta ahụhụ ma bilie, nakwa na Jizọs bụ onye ahụ. “Mesaịa” na-eme ka ọnọdụ ndị Juu na Akwụkwọ Nsọ pụta ìhè, ebe e debere “Kraịst” dịka nsụgharị ọzọ na nkọwa ala peeji.
- issue: Olu ngwaa ἀναστῆναι
  choice: bilie
  alternative: ka e si n’etiti ndị nwụrụ anwụ bilie ya
  rationale: Ụdị Grik bụ infinitive na-arụ ọrụ n’olu ike, ya mere “bilie” na-agbaso okwu amaokwu a ozugbo. Nke a anaghị agọnahụ ebe ndị ọzọ na-ekwu na Chineke mere ka Jizọs si n’ọnwụ bilie.
translation_notes:
  register: 'E ji Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta. Ahịrịokwu ahụ na-edobe usoro arụmụka Grik: ịkọwa, igosi, mkpa Mesaịa ahụ ịta ahụhụ na ibili, na njirimara Jizọs dịka Mesaịa ahụ. E tinyere akara nkọwa [a] n’akụkụ “Mesaịa” na [b] n’akụkụ “bilie” ka ha kwekọọ kpọmkwem n’ihe nkọwa nke ọ bụla gbasara.'
