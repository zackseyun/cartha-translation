source:
  edition: SBLGNT
  text: ὡς δὲ ἔγνωσαν οἱ ἀπὸ τῆς Θεσσαλονίκης Ἰουδαῖοι ὅτι καὶ ἐν τῇ Βεροίᾳ κατηγγέλη ὑπὸ τοῦ Παύλου ὁ λόγος τοῦ θεοῦ, ἦλθον κἀκεῖ σαλεύοντες ⸂καὶ ταράσσοντες⸃ τοὺς ὄχλους.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/013.yaml
  text: But when the Jews from Thessalonica learned that the word of God had been proclaimed by Paul in Berea also[a], they came there too[b], stirring up and troubling the crowds.
translation:
  language: ig
  text: Ma mgbe ndị Juu si Tesalonaịka matara na Pọl kwusara okwu Chineke na Beria kwa,[a] ha bịakwara ebe ahụ, na-akpalite ma na-akpaghasị igwe mmadụ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ịsụgharị ya: “na e kwusara okwu Chineke na Beria kwa.” Aorist passive Grik anaghị achọ ka Igbo kọwaa kpọmkwem ma nkwusa ahụ buru ụzọ zuru ezu tupu ha anụ akụkọ ya.'
    reason: lexical_alternative
  - marker: b
    text: 'A pụkwara ịsụgharị okwu ikpeazụ ahụ: “na-akpali ma na-enye igwe mmadụ nsogbu.” Ngwaa abụọ ahụ yiri ibe ha, ma ijikọ ha na-eme ka oke ọgba aghara ahụ pụta ìhè.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ
  choice: Ma mgbe
  rationale: Na-egosi mgbanwe n’akụkọ na obere ntụnyere megide nnabata ọma e nwere na Beria.
- source_word: ἔγνωσαν
  choice: matara
  rationale: N’ebe a, ọ pụtara na ha nwetara ozi ma ọ bụ chọpụta ihe merenụ.
- source_word: οἱ ἀπὸ τῆς Θεσσαλονίκης Ἰουδαῖοι
  choice: ndị Juu si Tesalonaịka
  rationale: Na-akọwa otu ndị a kpọmkwem site n’obodo ha si, n’enweghị ikwu banyere ndị Juu niile.
- source_word: ὅτι καὶ ἐν τῇ Βεροίᾳ
  choice: na ... kwusakwara ... na Beria
  rationale: Ngwaa mgbakwunye “-kwara” na-egosi na Beria bụkwa ebe ọzọ a kpọsara ozi ahụ, dịka Tesalonaịka.
- source_word: κατηγγέλη
  choice: kwusara
  rationale: Na-egosi nkwupụta ozi n’ihu ọha; usoro Igbo a na-agụ nke ọma ma ghara ịmanye ọdịiche oge gara aga nke Bekee n’elu aorist Grik.
- source_word: ὑπὸ τοῦ Παύλου
  choice: Pọl kwusara
  rationale: A gbanwere passive Grik ka ọ bụrụ active nkịtị n’Igbo, ma onye mere ihe ahụ ka bụ Pọl.
- source_word: ὁ λόγος τοῦ θεοῦ
  choice: okwu Chineke
  rationale: Na-edobe okwu Akwụkwọ Nsọ a maara nke ọma ma na-ezo aka n’ozi Chineke a na-ekwusa.
- source_word: ἦλθον κἀκεῖ
  choice: ha bịakwara ebe ahụ
  rationale: “-kwara” na-edobe echiche nke ‘ebe ahụ kwa,’ ya bụ na mmegide ha rutekwara Beria.
- source_word: σαλεύοντες
  choice: na-akpalite
  rationale: Na-egosi ime ka igwe mmadụ bilie ma nwee ọgba aghara.
- source_word: καὶ ταράσσοντες
  choice: ma na-akpaghasị ha
  rationale: 'Na-edobe participle nke abụọ dịka echiche ọzọ jikọtara ya: ịkpata nsogbu, mgbagwoju anya, ma ọ bụ ọgba aghara.'
- source_word: τοὺς ὄχλους
  choice: igwe mmadụ
  rationale: Ọ bụ okwu Igbo nkịtị maka ìgwè ndị mmadụ gbakọrọ; ọ naghị eme ka ha bụrụ ndị ọgba aghara tupu ederede ahụ ekwuo ya.
theological_decisions:
- issue: Nsụgharị ὁ λόγος τοῦ θεοῦ
  choice: okwu Chineke
  alternative: ozi Chineke
  rationale: “Okwu Chineke” na-edobe ụda nkà mmụta okpukpe na-adị n’akpaokwu Grik ahụ, ma n’ebe a ka a na-aghọta ya dịka ozi sitere n’aka Chineke a na-ekwusa.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma doo ndị nkịtị anya. A họọrọ usoro active maka passive Grik n’ihi ịdị eke n’Igbo, na-edobe Pọl dịka onye nkwusa ahụ. Akara nkọwa [a] na [b] dị n’ederede isi.
