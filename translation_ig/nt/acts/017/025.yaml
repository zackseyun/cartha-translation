  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οὐδὲ ὑπὸ χειρῶν ⸀ἀνθρωπίνων θεραπεύεται προσδεόμενός τινος, αὐτὸς διδοὺς πᾶσι ζωὴν καὶ πνοὴν ⸂καὶ τὰ⸃ πάντα·
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/025.yaml
  text: Nor is he served by human hands[a], as though he needed anything, since he himself gives to all life and breath and all things.
translation:
  language: ig
  text: A dịghịkwa eji aka mmadụ ejere ya ozi[a], dị ka a ga-asị na ọ chọrọ ihe ọ bụla, ebe ọ bụ na ya onwe ya na-enye mmadụ niile ndụ, ume, na ihe niile.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “efe ya ofufe site n'aka mmadụ.” Ngwaa Grik a nwere ike izo aka n'ozi ma ọ bụ nlekọta a na-enye n'ihe gbasara okpukpe; ebe a, ihe a na-ekwu bụ na Chineke adabereghị n'ozi mmadụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: θεραπεύεται
  choice: ejere ya ozi
  rationale: N'ọnọdụ a, ngwaa ahụ pụtara ijere onye ozi ma ọ bụ ilekọta ya, karịchaa n'ihe gbasara okpukpe; ọ pụtaghị ịgwọ ọrịa. Nhọrọ a na-egosi na Chineke adabereghị n'ozi aka mmadụ.
- source_word: ὑπὸ χειρῶν ἀνθρωπίνων
  choice: eji aka mmadụ
  rationale: Nke a na-edobe ihe atụ doro anya dị n'asụsụ Grik ma na-ada nke ọma n'Igbo.
- source_word: προσδεόμενός τινος
  choice: dị ka a ga-asị na ọ chọrọ ihe ọ bụla
  rationale: 'Nke a na-egosipụta arụmụka ahụ: a naghị ejere Chineke ozi dịka onye ihe na-akpa.'
- source_word: αὐτὸς
  choice: ya onwe ya
  rationale: Ọ na-edobe nkwusi ike dị na nnọchiaha Grik, na-egosi ọdịiche dị n'etiti Chineke onye na-enye ihe na ihe e kere eke ndị na-anata.
- source_word: πᾶσι
  choice: mmadụ niile
  rationale: N'okwu Pọl na-agwa ndị mmadụ ebe a, nke a bụ ụzọ Igbo doro anya isi gosi na onyinye Chineke ruru onye ọ bụla, n'agbanyeghị na okwu Grik n'onwe ya sara mbara.
- source_word: ζωὴν
  choice: ndụ
  rationale: Nke a bụ ntụgharị kwụ ọtọ ma bụrụkwa okwu Igbo a na-ejikarị eme ihe.
- source_word: πνοὴν
  choice: ume
  rationale: N'ịgbaso ‘ndụ,’ okwu a na-ezo aka na ume ihe dị ndụ na-ekuru, ọ bụghị mmụọ.
- source_word: καὶ τὰ πάντα
  choice: na ihe niile
  rationale: Ọ na-edobe ịdị ukwuu zuru ezu nke okwu Grik ma na-egosi na ihe Chineke na-enye agwụghị naanị na ndụ na ume.
- source_word: οὐδὲ
  choice: A dịghịkwa
  rationale: Ọ na-aga n'ihu n'okwu nkwọnye sitere n'amaokwu gara aga ma na-ada nke ọma n'Igbo.
theological_decisions:
- issue: Ma a ga-atụgharị θεραπεύεται kpọmkwem dịka ife ofufe ka ọ bụ dịka ijere ozi
  choice: ejere ya ozi
  alternative: efe ya ofufe
  rationale: ‘Ijere ya ozi’ na-anabata ọnọdụ okpukpe nke okwu ahụ ma ghara ime ka ihe ọ pụtara dị warara. Isi arụmụka Pọl bụ na Chineke adabereghị n'ozi ma ọ bụ nlekọta mmadụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ugwu ma dị mfe nghọta, dee ya. E debere ‘aka mmadụ’ dịka ihe atụ doro anya, tinyekwa ‘ya onwe ya’ iji chekwaa nkwusi ike dị n'asụsụ Grik.
