    text: A pụkwara ịsụgharị ya, “mmụọ ya were iwe” ma ọ bụ “mmụọ ya kpaliri nke ukwuu”; ngwaa Grik ahụ na-egosi mkpali dị nkọ n'ime mmadụ.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, “obodo ahụ raara onwe ya nye n'arụsị.”
    reason: lexical_alternative
