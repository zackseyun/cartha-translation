  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἐν δὲ ταῖς Ἀθήναις ἐκδεχομένου αὐτοὺς τοῦ Παύλου, παρωξύνετο τὸ πνεῦμα αὐτοῦ ἐν αὐτῷ ⸀θεωροῦντος κατείδωλον οὖσαν τὴν πόλιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/016.yaml
  text: While Paul was waiting for them in Athens[b][a], his spirit was provoked within him as he saw that the city was full of idols.
translation:
  language: ig
  text: Mgbe Pọl nọ n'Atens na-eche ha, mmụọ ya kpasuru iwe n'ime ya[a] ka ọ na-ahụ na obodo ahụ jupụtara n'arụsị.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “mmụọ ya were iwe” ma ọ bụ “mmụọ ya kpaliri nke ukwuu”; ngwaa Grik ahụ na-egosi mkpali dị nkọ n'ime mmadụ.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, “obodo ahụ raara onwe ya nye n'arụsị.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκδεχομένου
  choice: na-echere
  rationale: Ọ na-egosi ọnọdụ gara n'ihu nke Pọl nọ na ya mgbe ọ na-eche ndị ibe ya; okwu a bụ Igbo nkịtị ma doo anya.
- source_word: παρωξύνετο
  choice: iwe juru ya
  rationale: Ngwaa ahụ na-egosi mkpali dị nkọ na nke na-aga n'ihu n'ime mmadụ; ntụgharị a anaghị eme ka ọ bụrụ naanị mwute.
- source_word: τὸ πνεῦμα αὐτοῦ
  choice: mmụọ ya
  rationale: Nke a na-ezo aka n'ime mmụọ Pọl, dịka nnọchiaha nwe-onye gosiri, ọ bụghị kpọmkwem Mmụọ Nsọ.
- source_word: ἐν αὐτῷ
  choice: n'ime
  rationale: Ọ na-eme ka o doo anya na mkpali ahụ mere n'ime Pọl n'onwe ya.
- source_word: θεωροῦντος
  choice: mgbe ọ hụrụ
  rationale: Ọ na-egosi na ịhụ na ileba obodo ahụ anya mere n'otu oge ahụ mkpali ahụ na-eme.
- source_word: κατείδωλον
  choice: arụsị jupụtara
  rationale: Ọ na-egosi obodo nke ihe oyiyi arụsị juru ebe niile; nke a bụ ntụgharị Igbo doro anya nke na-anọ nso n'okwu Grik.
- source_word: πόλιν
  choice: obodo ahụ
  rationale: Grik kwuru kpọmkwem ‘obodo ahụ,’ nke na-ezo azụ na Atens.
- source_word: δὲ
  choice: Mgbe
  rationale: N'ọnọdụ a δέ na-enyere aka n'ịga n'ihu n'akụkọ ahụ, ebe genitive absolute na-enye ọnọdụ oge; ahịrịokwu Igbo ji ‘Mgbe’ kwupụta njikọ oge ahụ n'ụzọ eke n'etinyeghị okwu pụtara ‘ugbu a.’
theological_decisions:
- issue: Ihe ‘mmụọ ya’ na-ezo aka na ya
  choice: Mmụọ nke Pọl n'onwe ya
  alternative: Mkpali sitere n'aka Mmụọ Nsọ
  rationale: Usoro okwu ‘mmụọ ya’ na ‘n'ime ya’ na-egosi mmeghachi omume nke Pọl n'ime onwe ya. Amaokwu ahụ ekwughị kpọmkwem na ọ bụ Mmụọ Nsọ kpaliri ya, ya mere ntụgharị ahụ etinyeghị nkọwa ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E debere ‘mmụọ ya’ iji nọgide nso n'usoro Grik ma ghara ịkọwa ya dịka Mmụọ Nsọ. E tinyere akara nkọwa ala peeji ozugbo n'akụkụ okwu ha na-akọwa.
