  text: Ἀθηναῖοι δὲ πάντες καὶ οἱ ἐπιδημοῦντες ξένοι εἰς οὐδὲν ἕτερον ηὐκαίρουν ἢ λέγειν τι ⸀ἢ ἀκούειν ⸀τι καινότερον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/021.yaml
  text: All the Athenians and the foreigners staying there would spend their time in nothing else than telling or hearing something newer[a].
translation:
  language: ig
  text: Ndị Atens niile na ndị mba ọzọ nọ n’ebe ahụ enweghị ihe ọzọ ha na-etinye oge ha n’ime ya karịa ikwu ma ọ bụ ịnụ ihe ka ọhụrụ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya n’ụzọ Igbo na-adịkarị mfe, “ihe ọhụrụ.” Okwu Greek ji ụdị ntụnyere, “ka ọhụrụ,” ikekwe iji gosi na ha na-achọ mgbe niile ịnụ ihe ọhụrụ kachasị ọhụrụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀθηναῖοι δὲ πάντες
  choice: Ndị Atens niile
  rationale: “Ndị Atens” bụ ụzọ Igbo dị mfe ma doo anya isi kpọọ ndị obodo Atens; “niile” na-egosipụta πάντες. A hapụrụ δέ ka ọ bụrụ njikọ dị nro nke usoro okwu Igbo na ọnọdụ gbara amaokwu ahụ gburugburu na-egosi, kama ịgbakwunye okwu oge na-adịghị na Greek.
- source_word: οἱ ἐπιδημοῦντες ξένοι
  choice: ndị mba ọzọ bi nwa oge n’ebe ahụ
  rationale: Nke a na-egosi ma na ha bụ ndị si mba ọzọ ma na ọnụnọ ha n’Atens nwere ike ịbụ nke nwa oge, dịka ἐπιδημοῦντες si pụta.
- source_word: εἰς οὐδὲν ἕτερον ηὐκαίρουν
  choice: anaghị eji oge ha eme ihe ọ bụla ọzọ
  rationale: Nkebiokwu a na-enye Igbo ebumpụta ụwa maka omume ha na-emekarị n’oge gara aga, ma chekwaa echiche nke iji oge emeghị ihe ọzọ.
- source_word: ἢ λέγειν τι ἢ ἀκούειν
  choice: karịa ịkọ ma ọ bụ ịnụ ihe
  rationale: “Ịkọ” dabara n’ịgwa ndị ọzọ otu ihe, ebe “ịnụ” na-edobe nhata nke infinitive abụọ ahụ n’enweghị ịgbakwunye nkọwa na-adịghị na isi mmalite.
- source_word: τι καινότερον
  choice: ihe ka ọhụrụ
  rationale: A chekwara ụdị ntụnyere nke καινότερον (“ka ọhụrụ”), ọ bụghị naanị “ihe ọhụrụ,” iji gosi agụụ ha maka ihe kacha ọhụrụ.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo Standard dị ugbu a, dị ùgwù ma dị mfe nghọta. A họọrọ “bi nwa oge” iji zere ịkọwa ndị mba ọzọ ahụ dị ka ndị biri ebe ahụ kpamkpam; a chekwara “ka ọhụrụ” n’ahịrị bụ isi, ebe e nyere ụdị okwu Igbo kachasị mfe n’ala ala peeji.
