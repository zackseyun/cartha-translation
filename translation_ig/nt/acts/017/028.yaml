revisions:
- from: N’ihi na ọ bụ n’ime ya ka anyị na-adị ndụ, na-agagharị, na-adịkwa; dịka ụfọdụ ndị na-ede abụ n’etiti unu kwukwara, sị, “N’ihi na anyị onwe anyị bụkwa ụmụ ya.”
  to: N’ihi na ọ bụ n’ime ya ka anyị na-adị ndụ, na-agagharị, na-adịkwa, dịka ụfọdụ ndị ode uri unu kwukwara, sị, “N’ihi na anyị bụkwa ụmụ ya.”
  rationale: The revision retains the draft’s viable rendering of the three verbs, including its deliberate openness for ἐσμέν, while making ‘poets’ precise and removing an unsupported emphatic expression from the quotation.
