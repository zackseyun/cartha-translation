id: ACT.17.28
reference: Acts 17:28
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐν αὐτῷ γὰρ ζῶμεν καὶ κινούμεθα καὶ ἐσμέν, ὡς καί τινες τῶν καθ’ ὑμᾶς ποιητῶν εἰρήκασιν· Τοῦ γὰρ καὶ γένος ἐσμέν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/028.yaml
  text: For in him we live and move and exist, as even some of your own poets have said, ‘For we also are his offspring.’
translation:
  language: ig
  text: N’ihi na ọ bụ n’ime ya ka anyị na-adị ndụ, na-agagharị, na-adịkwa, dịka ụfọdụ ndị ode uri unu kwukwara, sị, “N’ihi na anyị bụkwa ụmụ ya.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν αὐτῷ
  choice: n’ime ya
  rationale: Na-edobe okwu Grik nke pụtara ‘n’ime ya,’ ma na-ada nke ọma n’Igbo n’ọnọdụ a.
- source_word: ζῶμεν
  choice: anyị na-adị ndụ
  rationale: Nke a na-enye kpọmkwem echiche nke ịdị ndụ.
- source_word: κινούμεθα
  choice: anyị na-agagharị
  rationale: Na-egosipụta mmegharị ma ọ bụ ịgagharị n’enweghị ịgbakwunye nkọwa nkà mmụta okpukpe.
- source_word: ἐσμέν
  choice: anyị na-adị
  rationale: Na-edobe ịdị mfe na ịdị omimi nke ngwaa Grik ‘anyị bụ/anyị dị,’ kama imechi ihe ọ pụtara naanị n’echiche nke ịdị adị.
- source_word: ποιητῶν
  choice: ndị na-ede abụ
  rationale: Ọ bụ okwu Igbo doro ndị nkịtị anya maka ndị ode uri ma ọ bụ ndị na-ede abụ.
- source_word: γένος
  choice: ụmụ
  rationale: N’okwu e hotara, ‘ụmụ ya’ na-enye echiche nke offspring/progeny n’Igbo ebumpụta ụwa, n’ebughị ụzọ kwuo na mmadụ niile bụ ụmụ Chineke n’otu ụzọ nkà mmụta okpukpe pụrụ iche.
theological_decisions:
- issue: Ihe ἐσμέν pụtara n’usoro ‘anyị na-adị ndụ, na-agagharị, na-adị’
  choice: na-adịkwa
  alternative: dịkwa adị
  rationale: ‘Na-adịkwa’ na-echekwa obosara na mgbagwoju anya nke ἐσμέν (‘anyị bụ/anyị dị’), ebe ‘dị adị’ nwere ike ime ka okwu ahụ bụrụ naanị nkwupụta banyere existence.
- issue: Ihe ‘γένος’ pụtara n’okwu onye na-ede abụ
  choice: ụmụ ya
  alternative: agbụrụ ya / ihe sitere n’aka ya
  rationale: ‘Ụmụ ya’ bụ ụzọ ebumpụta ụwa isi kwuo offspring n’Igbo, ma amaokwu ahụ ka bụ okwu e hotara n’ọnọdụ okwu Pọl, ọ bụghị nkọwa zuru ezu banyere ụdị mmekọrịta mmadụ na Chineke.
translation_notes:
  register: Ejiri Standard Igbo nke dị ugbu a, dị ùgwù ma dị mfe nghọta. Usoro ahịrịokwu ahụ na-ejigide mmegharị atọ nke Grik—ịdị ndụ, ịgagharị, na ịdị—yana ọdịdị okwu e hotara.
