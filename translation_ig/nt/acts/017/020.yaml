  rationale: The revision replaces an unclear expression with idiomatic Standard Igbo for unfamiliar things and restores the source’s reference to the hearers’ ears. The final question continues to communicate the Greek idiom’s meaning rather than a merely literal identity question. The notes are adjusted for accuracy and natural Igbo while retaining the stated alternatives.
