source:
  edition: SBLGNT
  text: ξενίζοντα γάρ τινα εἰσφέρεις εἰς τὰς ἀκοὰς ἡμῶν· βουλόμεθα οὖν γνῶναι ⸂τίνα θέλει⸃ ταῦτα εἶναι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/020.yaml
  text: For you are bringing some strange things to our ears[b][a]. Therefore we want to know what these things mean.
translation:
  language: ig
  text: N’ihi na ị na-eweta ụfọdụ ihe anyị na-amabughị na ntị anyị.[a] Ya mere, anyị chọrọ ịmata ihe ihe ndị a pụtara.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “ihe ndị si mba ọzọ” ma ọ bụ “ihe ndị anyị na-amabughị.” Okwu Grik ahụ na-ekwu maka ihe na-adị ọhụrụ, na-amaghị ama, ma ọ bụ nke si mba ọzọ nye ndị na-anụ ya.
    reason: lexical_alternative
  - marker: b
    text: N’ụzọ nkịtị, “ihe ihe ndị a chọrọ ịbụ”; nke a bụ akpaokwu pụtara “ihe ihe ndị a pụtara” ma ọ bụ “ihe ha chọrọ ikwu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ξενίζοντα
  choice: ihe ... na-amaghị anyị ama
  rationale: Nke a na-egosi na ihe Pọl na-eweta bụ ihe ọhụrụ ma ọ bụ ihe si mba ọzọ nke ndị na-ege ya ntị na-amabeghị, n’enweghị ime ka ọ pụta na ha tụrụ nnọọ n’anya.
- source_word: τινα
  choice: ihe ụfọdụ
  rationale: Nke a na-edobe echiche nke ihe a na-akọwaghị kpọmkwem.
- source_word: εἰσφέρεις εἰς τὰς ἀκοὰς ἡμῶν
  choice: ị na-ewetara anyị
  rationale: Nke a bụ ụzọ Igbo dị mfe ma kwekọọ n’echiche nke iweta ozi n’ebe ndị na-anụ ya nọ; ịsụ ya kpọmkwem dịka ‘n’ime ntị anyị’ agaghị adị ezigbo ụtọ n’Igbo.
- source_word: βουλόμεθα οὖν γνῶναι
  choice: Ya mere, anyị chọrọ ịmata
  rationale: Nke a na-egosi ma nkwubi okwu οὖν na ọchịchọ nke βουλόμεθα n’asụsụ Igbo nke oge a.
- source_word: τίνα θέλει ταῦτα εἶναι
  choice: ihe ihe ndị a pụtara
  rationale: Akpaokwu Grik a na-ajụ maka ihe okwu ndị ahụ pụtara ma ọ bụ uru ha nwere, ọ bụghị nanị ihe ha bụ.
- source_word: γάρ
  choice: N’ihi na
  rationale: Ọ na-ejikọta amaokwu a na arịrịọ dị n’amaokwu bu ya ụzọ dịka ihe kpatara arịrịọ ahụ.
