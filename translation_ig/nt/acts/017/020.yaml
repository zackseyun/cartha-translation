  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ ntụgharị dabara n’echiche karịa ịrapara n’usoro okwu Grik ebe nke ahụ ga-eme ka Igbo sie ike; ihe atụ ahụ na nghọta ọzọ dị na ndetu ala peeji.
