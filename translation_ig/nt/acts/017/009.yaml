- from: Mgbe ha nara Jason na ndị ọzọ ihe ga-ezuru ka ọ bụrụ nkwa[a], ha hapụrụ ha ka ha laa.
  to: Mgbe ha natara ihe nkwụnye n'aka Jason na ndị ọzọ[a], ha hapụrụ ha ka ha laa.
  rationale: The revision makes explicit that the authorities received the security from Jason and the others, improves the idiomatic rendering of the legal-security expression, and preserves the source’s cautious level of specificity through the footnote.
