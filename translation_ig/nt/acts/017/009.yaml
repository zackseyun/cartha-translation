  text: καὶ λαβόντες τὸ ἱκανὸν παρὰ τοῦ Ἰάσονος καὶ τῶν λοιπῶν ἀπέλυσαν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/009.yaml
  text: And after taking security from Jason and the others[a], they released them.
translation:
  language: ig
  text: Mgbe ha natara ihe nkwụnye n'aka Jason na ndị ọzọ[a], ha hapụrụ ha ka ha laa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ihe zuru ezu”; o yikarịrị ka ọ bụ ego ma ọ bụ ihe e tinyere n’aka ndị ọchịchị dịka nkwa na ha ga-akpa àgwà n’udo.
    reason: lexical_alternative
lexical_decisions:
- source_word: λαβόντες
  choice: Mgbe ha nara
  rationale: Aorist participle a na-egosi omume mere tupu isi ngwaa; “Mgbe ha nara” na-egosi usoro ahụ nke ọma n’Igbo nkịtị.
- source_word: τὸ ἱκανὸν
  choice: ihe ga-ezuru ka ọ bụrụ nkwa
  rationale: Akpaokwu Grik a pụtara ihe zuru oke e nyere dịka nkwa n’ọnọdụ iwu. Nsụgharị a na-edobe ma echiche nke ‘ihe zuru ezu’ ma ọrụ ya dịka nkwa, n’emeghị ka ọ bụrụ ụdị iwu pụrụ iche.
- source_word: παρὰ τοῦ Ἰάσονος καὶ τῶν λοιπῶν
  choice: Jason na ndị ọzọ
  rationale: παρά tinyere genitive na-egosi ebe e si nata ihe; ngwaa Igbo “nara” na-egosipụtala nke a. “Ndị ọzọ” bụ asụsụ doro anya maka λοιποί n’ìgwè ahụ.
- source_word: ἀπέλυσαν
  choice: ha hapụrụ ha ka ha laa
  rationale: N’ọnọdụ ikpe a, ἀπολύω pụtara ịtọhapụ ndị e jidere ma kwe ka ha pụọ. Akpaokwu a bụ Igbo ebumpụta ụwa ma na-edobe echiche iwu ahụ.
- source_word: αὐτούς
  choice: ha
  rationale: Nnọchiaha ụbara a na-ezo aka na Jason na ndị ọzọ ahụ e jidere.
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ “ihe ga-ezuru ka ọ bụrụ nkwa” iji zere okwu iwu nke nwere ike ịkọwa kpọmkwem karịa ihe Grik kwuru, ebe ihe odide ala peeji na-edobe nsụgharị nkịtị na nkọwa iwu nwere ike ịdị na ya.
