  text: διελέγετο μὲν οὖν ἐν τῇ συναγωγῇ τοῖς Ἰουδαίοις καὶ τοῖς σεβομένοις καὶ ἐν τῇ ἀγορᾷ κατὰ πᾶσαν ἡμέραν πρὸς τοὺς παρατυγχάνοντας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/017.yaml
  text: So he was reasoning in the synagogue with the Jews and those who worshiped God[b][a], and in the marketplace every day with those who happened to be there.
translation:
  language: ig
  text: Ya mere, ọ na-arụrịta ụka n’ụlọ nzukọ ya na ndị Juu na ndị na-efe Chineke[a], nakwa n’ọma ahịa kwa ụbọchị ya na ndị ọ na-ezute n’ebe ahụ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị na-atụ egwu Chineke,” ya bụ, ndị mba ọzọ na-esonyere n’ofufe ndị Juu.
    reason: lexical_alternative
  - marker: b
    text: “Ọma ahịa” abụghị naanị ebe a na-azụ ma na-ere ihe; ọ bụkwa ebe ọha na eze na-ezukọ maka ihe gbasara obodo.
    reason: cultural_note
lexical_decisions:
- source_word: διελέγετο
  choice: ọ nọ na-atụgharị uche n'Akwụkwọ Nsọ ... ya na
  rationale: Oge imperfect na-egosi omume a na-eme ugboro ugboro. N'ọnọdụ ụlọ nzukọ na ozi Pọl, okwu a na-egosi mkparịta ụka nwere ịkọwa na ịrụrịta ụka; nsụgharị a na-eme ka nke ahụ doo anya n'Igbo nkịtị.
- source_word: μὲν οὖν
  choice: Ya mere
  rationale: Na-ejikọta ihe omume a na ihe e kwuru tupu ya ma na-egosi ihe si na ya pụta, n'ụzọ dabara n'Igbo.
- source_word: συναγωγῇ
  choice: ụlọ nzukọ ndị Juu
  rationale: N'ebe a ọ bụ ụlọ na nzukọ ofufe ndị Juu, ọ bụghị naanị nzukọ mmadụ n'ozuzu.
- source_word: τοῖς Ἰουδαίοις
  choice: ndị Juu
  rationale: Ọ na-ezo aka n'obodo ndị Juu nọ n'ụlọ nzukọ ahụ, ọ bụghị naanị ndị si Judia.
- source_word: τοῖς σεβομένοις
  choice: ndị na-efe Chineke
  rationale: Na-egosi ndị mba ọzọ sonyere n'ofufe ndị Juu; e tinyere ‘Chineke’ dịka ihe okwu ahụ na-ezo aka na ọnọdụ a.
- source_word: ἀγορᾷ
  choice: ọma ahịa
  rationale: Okwu Igbo a na-aghọta ngwa ngwa maka ebe azụmahịa, ebe ahụ bụkwa ebe ọha na eze na-ezukọ.
- source_word: κατὰ πᾶσαν ἡμέραν
  choice: kwa ụbọchị
  rationale: Na-egosipụta omume a na-eme ụbọchị niile n'ụzọ dị mfe ma bụrụ Igbo ebumpụta ụwa.
- source_word: πρὸς τοὺς παρατυγχάνοντας
  choice: ya na ndị ọ bụla ọ hụrụ n'ebe ahụ
  rationale: Na-egosi ndị nọ ebe ahụ ma ọ bụ ndị o zutere na mberede, na-enweghị ime ka ọ bụrụ naanị ndị na-agafe agafe.
theological_decisions:
- issue: Ndị τοῖς σεβομένοις bụ ndị ole?
  choice: ndị na-efe Chineke
  alternative: ndị na-atụ egwu Chineke
  rationale: Nhọrọ a na-enye ihe participle ahụ pụtara n'ụzọ doro anya, ebe nkọwa ala peeji na-echekwa nghọta ya dịka otu ndị mba ọzọ sonyere n'ofufe ndị Juu.
translation_notes:
  register: Igbo ọkọlọtọ, nke ugwu na nke dị mfe nghọta. E jiri ‘ụlọ nzukọ ndị Juu’ zere okwu mbite na-adịghị doo onye nkịtị anya. A haziri ahịrịokwu ahụ ka mmeghachi omume kwa ụbọchị pụta ìhè, ma debekwa akara nkọwa ala peeji niile n'ederede.
