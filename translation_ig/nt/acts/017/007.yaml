  text: οὓς ὑποδέδεκται Ἰάσων· καὶ οὗτοι πάντες ἀπέναντι τῶν δογμάτων Καίσαρος πράσσουσι, βασιλέα ⸂ἕτερον λέγοντες⸃ εἶναι Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/007.yaml
  text: These men[a], whom Jason has welcomed, are all acting against Caesar’s decrees[c][b], saying that there is another king—Jesus.
translation:
  language: ig
  text: Ndị a Jeysọ́n nabatara n’ụlọ ya[a], ha niile na-eme ihe megidere iwu Siza[b], na-ekwu na Jizọs bụ eze ọzọ[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “anabatara” ma ọ bụ “kpọbatara n’ụlọ ya.” Ngwaa Grik ahụ nwere ike ịpụta ịnabata ndị ọbịa ma ọ bụ inye ha ebe obibi.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “iwu ọchịchị Siza nyere.” Okwu Grik ahụ na-ezo aka n’iwu, mkpebi, ma ọ bụ ntụziaka ọchịchị e nyere n’usoro iwu.
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “eze dị iche.” Grik kwuru “eze ọzọ”; ebubo ahụ na-eweta Jizọs dịka onye eze ọzọ n’akụkụ Siza.
    reason: alternative_reading
lexical_decisions:
- source_word: ὑποδέδεκται
  choice: nabatara n’ụlọ ya
  rationale: Ngwaa Grik a na-egosi ịnabata mmadụ dịka ọbịa ma ọ bụ inye ya ebe obibi. Oge perfect na-egosikwa na ihe Jeysọ́n mere ka bụ ihe e ji ebo ya ebubo ugbu a.
- source_word: ἀπέναντι
  choice: megidere
  rationale: N’ebe a, okwu ahụ pụtara ime ihe na-emegide ma ọ bụ na-adabaghị n’iwu e nyere; “megidere” bụ okwu Igbo doro anya n’ọnọdụ ebubo iwu a.
- source_word: δογμάτων
  choice: iwu ndị Siza tiri
  rationale: N’ọnọdụ ọchịchị Rom a, δόγματα bụ iwu ma ọ bụ mkpebi ndị ọchịchị nyere. “Iwu ndị Siza tiri” bụ Igbo dị mfe ma na-edobe ụda ọchịchị nke okwu ahụ.
- source_word: πράσσουσι
  choice: na-eme ihe
  rationale: Present tense na-egosi omume a na-ekwu na ọ na-aga n’ihu; “na-eme ihe” na-ejikọta nke ọma na “megidere iwu” n’Igbo.
- source_word: βασιλέα ἕτερον
  choice: eze ọzọ
  rationale: βασιλεύς bụ “eze,” ebe ἕτερον na-egosi onye ọzọ dị iche. Nsụgharị a na-edobe ebubo na Jizọs bụ eze ọzọ na-asọ Siza mpi.
- source_word: λέγοντες
  choice: na-ekwu
  rationale: Okwu a na-akọwa ihe ha na-ekwu nke e weere dị ka mmegide ha; “na-ekwu” anaghị etinye ike ọzọ na-adịghị n’ederede.
- source_word: εἶναι Ἰησοῦν
  choice: na e nwere eze ọzọ—ya bụ Jizọs
  rationale: A haziri infinitive Grik ahụ n’ụzọ Igbo si ekwu ya nke ọma, ma e debe Jizọs n’ọgwụgwụ dịka onye a na-akpọ eze ọzọ.
- source_word: οὗτοι πάντες
  choice: Ndị a niile
  rationale: Nke a na-edobe ma ntụaka “ndị a” ma nkwusi ike nke “niile” n’asụsụ Igbo dị nfe.
theological_decisions:
- issue: Ike ndọrọ ndọrọ ọchịchị dị n’ebubo na Jizọs bụ eze
  choice: 'E debere ebubo ahụ n’ụzọ kwụ ọtọ: ha na-ekwu na e nwere eze ọzọ, ya bụ Jizọs.'
  alternative: Ịsụgharị “eze” dịka “onye ndu” ma ọ bụ “onye ọchịchị” iji belata echiche na ọ na-asọ Siza mpi.
  rationale: Ederede ahụ jikọtara ebubo a kpọmkwem na iwu Siza. Ya mere, “eze” na-edobe esemokwu ndọrọ ndọrọ ọchịchị na nke okwukwe dị n’ederede, n’ebughị ụzọ kọwaa ụdị alaeze Jizọs.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “Nabatara n’ụlọ ya” na-eme ka echiche ile ọbịa pụta ìhè; “iwu ndị Siza tiri” na-edobe ọnọdụ ọchịchị Rom; “eze ọzọ” na-ahapụ ike ndọrọ ndọrọ ọchịchị na esemokwu okpukpe dị n’ederede ka ha guzo n’enweghị ime ka ha dị nro.
