  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οἱ δὲ ⸀καθιστάνοντες τὸν Παῦλον ⸀ἤγαγον ἕως Ἀθηνῶν, καὶ λαβόντες ἐντολὴν πρὸς τὸν Σιλᾶν καὶ ⸀τὸν Τιμόθεον ἵνα ὡς τάχιστα ἔλθωσιν πρὸς αὐτὸν ἐξῄεσαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/015.yaml
  text: Those who were escorting Paul brought him as far as Athens[a], and after receiving instructions for Silas and Timothy to come to him as quickly as possible[b], they departed.
translation:
  language: ig
  text: Ndị na-eso Pọl kpọgara ya ruo Atens[a]. Mgbe ha natara ntụziaka nye Saịlas na Timoti ka ha bịakwute ya ngwa ngwa dị ka o kwere mee[b], ha wee laa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, ‘kpọgara ya Atens.’ Okwu Grik ahụ na-egosi na ha sooro Pọl ruo ebe ahụ.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, ‘mgbe ha natara iwu.’ Okwu Grik ahụ nwere ike ịpụta ntụziaka ma ọ bụ iwu e nyere n’ike.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθιστάνοντες
  choice: ndị na-eduga Pọl n’ụzọ
  rationale: N’ebe a, participle a na-ekwu maka ndị so Pọl na njem ma na-eduga ya n’ebe ọ na-aga; nkebi a na-egosi iso ya na enyemaka njem, ọ bụghị nanị ‘ịkpọga.’
- source_word: ἤγαγον
  choice: kpọgara ya
  rationale: Ngwaa aorist a na-akọ omume e mezuru nke ịkpọga Pọl n’Atens; ‘kpọgara ya’ bụ okwu Igbo doro anya ma kwekọọ na ọnọdụ njem ahụ.
- source_word: ἕως Ἀθηνῶν
  choice: ruo Atens
  rationale: '‘Ruo’ na-echekwa echiche nke oke njem ahụ: ha sooro ya ruo ebe ahụ.'
- source_word: λαβόντες ἐντολήν
  choice: mgbe ha natara ntụziaka
  rationale: A sụgharịrị participle ahụ dị ka ihe mere tupu ha alaa. ‘Ntụziaka’ na-edobe ohere ἐντολή nwere ịbụ ntụziaka ma ọ bụ iwu n’ebughị ụzọ mee ka ike iwu ya sie karịa ihe ọnọdụ a chọrọ.
- source_word: πρὸς τὸν Σιλᾶν καὶ τὸν Τιμόθεον
  choice: ka Saịlas na Timoti
  rationale: Aha ndị a bụ ndị e zubere ka ozi ahụ ruo, ebe nkebi ἵνα na-esote na-enye ọdịnaya ntụziaka ahụ; nhazi a bụ Igbo ebumpụta ụwa.
- source_word: ἵνα ὡς τάχιστα ἔλθωσιν πρὸς αὐτόν
  choice: ka Saịlas na Timoti bịakwute ya ngwa ngwa dị ka o kwere mee
  rationale: Nke a na-egosi ọdịnaya ntụziaka ahụ ma na-echekwa ọsọ na mkpa dị na ὡς τάχιστα. ‘Ya’ na-edobe nnọchiaha αὐτόν kama itinye aha Pọl ọzọ.
- source_word: ἐξῄεσαν
  choice: ha wee laa
  rationale: Nke a bụ ụzọ Igbo dị mfe ma dị n’usoro akụkọ iji kwuo na ha hapụrụ ebe ahụ mgbe ha natara ozi ahụ.
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe ma nwee ugwu. ‘Ndị na-eduga Pọl n’ụzọ’ na-eme ka ọrụ ndị so ya doo anya; ‘ruo Atens’ na-echekwa echiche ἕως nke iso ya ruo ebe njem ahụ kwụsịrị. Akara ndetu [a] na [b] dị n’ederede isi ma kwekọọ na ndetu ala peeji.
