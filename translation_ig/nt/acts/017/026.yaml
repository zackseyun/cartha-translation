base_translation:
  language: en
  yaml_path: translation/nt/acts/017/026.yaml
  text: And he made from one man every nation of mankind to live on the whole face of the earth[a], having determined their appointed times and the boundaries of their dwelling place[b],
translation:
  language: ig
  text: O mekwara mba niile nke ụmụ mmadụ site n’otu onye, ka ha biri n’elu ụwa dum[a], ebe o kpebirila oge ndị a kara aka nye ha na ókèala ebe obibi ha[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ụfọdụ ihe odide nwere “site n’otu ọbara” kama “site n’otu.” Ntụgharị a na-agbaso SBLGNT, nke nwere “site n’otu”; a gbakwụnyere “onye” n’isi ederede ka ihe ọ pụtara doo anya.
    reason: textual_variant
  - marker: b
    text: A pụkwara ịtụgharị ya, “oge ndị e debere maka ha.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐποίησέν τε
  choice: O sikwa … mee
  rationale: “Mee” na-egosipụta ποιέω n’ụzọ sara mbara, ebe “-kwa” na-ejigide njikọ nke τε na okwu bu ya ụzọ.
- source_word: ἐξ ἑνὸς
  choice: site n’otu onye
  rationale: Grik kwuru naanị “site n’otu”; a gbakwụnyere “onye” ka okwu ahụ doo anya n’Igbo, n’ihi na ihe a na-ekwu bụ otu onye mmadụ nke mba mmadụ niile si na ya.
- source_word: πᾶν ἔθνος ἀνθρώπων
  choice: mba niile nke ụmụ mmadụ
  rationale: “Mba niile” na-ejigide echiche nke mba dị iche iche, ebe “nke ụmụ mmadụ” na-egosi na ha niile so n’ụmụ mmadụ.
- source_word: κατοικεῖν ἐπὶ παντὸς προσώπου τῆς γῆς
  choice: ka ha biri n’elu ụwa dum
  rationale: Nke a bụ Igbo ebumpụta ụwa maka ibi n’akụkụ niile nke elu ụwa, na-enweghị ịmanye akpaokwu “ihu ụwa” nke na-adịghị ada ụtọ n’Igbo.
- source_word: ὁρίσας
  choice: o burula ụzọ kpebie
  rationale: Na-egosi na Chineke edoziela ma kpebie ihe ndị a; ọ naghị agbakwụnye nkọwa karịrị echiche nke ịtụpụta ókè.
- source_word: προστεταγμένους καιρούς
  choice: oge ndị a kara aka nye ha
  rationale: “Oge” nwere ike ịbụ oge ma ọ bụ usoro oge pụrụ iche, ebe “a kara aka” na-ejigide echiche nke oge e dobere.
- source_word: τὰς ὁροθεσίας τῆς κατοικίας αὐτῶν
  choice: ókèala ebe obibi ha
  rationale: “Ókèala” na-egosi oke e nyere ebe ndị mba ahụ ga-ebi; “ebe obibi ha” na-ejigide κατοικία n’ụzọ doro anya.
theological_decisions:
- issue: Ihe ἐξ ἑνὸς na-ezo aka na ya
  choice: site n’otu onye
  alternative: site n’otu
  rationale: SBLGNT enweghị okwu “ọbara.” “Onye” bụ ihe e tinyere maka nghọta Igbo, ma ihe odide ala peeji na-eme ka o doo anya na Grik kwuru naanị “otu,” ka a ghara izochi mgbagwoju anya ahụ.
- issue: Ụdị mkpebi Chineke a na-egosi na ὁρίσας
  choice: o burula ụzọ kpebie
  alternative: o debere
  rationale: A na-egosipụta na Chineke kpebiri oge na ókè, ma a naghị akọwa kpọmkwem otú mkpebi ahụ si metụta nnwere onwe mmadụ ma ọ bụ akụkọ ihe mere eme.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. A họọrọ “n’elu ụwa dum” kama nsụgharị mkpụrụokwu “n’ihu ụwa dum,” n’ihi na nke mbụ bụ okwu Igbo ebumpụta ụwa ma na-eburu otu echiche ahụ. Akara [a] na [b] dị n’ebe okwu ha na-akọwa pụtara.
