  to: O mekwara mba niile nke ụmụ mmadụ site n’otu onye, ka ha biri n’elu ụwa dum[a], ebe o kpebirila oge ndị a kara aka nye ha na ókèala ebe obibi ha[b].
  rationale: E degharịrị isi ahịrịokwu ahụ naanị iji mee ka usoro okwu Igbo bụrụ nke eke ma doo anya, n’enweghị mgbanwe n’ihe Grik pụtara. E jigidere “otu onye” dịka nkọwa ziri ezi a gbakwụnyere maka ἐξ ἑνός, ma ala peeji a na-egosi n’ụzọ doro anya na isi Grik nwere naanị “otu.” E mekwara obere ndozi n’asụsụ ala peeji abụọ ahụ.
