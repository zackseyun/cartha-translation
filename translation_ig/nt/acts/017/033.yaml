  text: Otu a ka Pọl si n’etiti ha pụọ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “Ya mere, Pọl si n’etiti ha laa.”
