  source_fidelity: The draft accurately renders Paul, his departure, and departure from the group. However, «Ya mere» more readily expresses a result ('therefore') than οὕτως, which here most directly means 'thus/so, in this way' as the narrative conclusion. «Otu a ka» preserves that force without adding a stronger causal inference.
  naturalness: «Otu a ka Pọl si n’etiti ha pụọ» is concise, idiomatic Standard Igbo, and matches the compact narrative style of the Greek.
  terminology: «Pọl» is the established Igbo form of the name. «si n’etiti ha pụọ» naturally conveys ἐξῆλθεν ἐκ μέσου αὐτῶν. No theological terminology is involved.
  issues:
