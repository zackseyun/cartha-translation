    issue: The main rendering of οὕτως as «Ya mere» is slightly more inferential than the Greek.
    rationale: Although contextually possible, «Ya mere» commonly means 'therefore.' «Otu a ka» more directly represents οὕτως ('thus/so') and preserves the source's narrative connective.
