lexical_decisions:
- source_word: οὕτως
  choice: Ya mere
  rationale: N’ebe a, okwu a jikọtara akụkọ ahụ ma gosi ihe sochiri okwu Pọl; “Ya mere” bụ Igbo nkịtị ma na-edobe ike nke “otu a/ya mere.”
- source_word: Παῦλος
  choice: Pọl
  rationale: E dere aha onye ahụ n’ụdị a na-ejikarị ede ya n’Igbo.
- source_word: ἐξῆλθεν
  choice: pụọ
  rationale: Okwu a pụtara ịpụ ma ọ bụ isi n’otu ebe laa; “pụọ” na-edobe echiche nke mmegharị ahụ n'ụzọ doro anya.
- source_word: ἐκ μέσου αὐτῶν
  choice: si n’etiti ha
  rationale: Nkebiokwu a na-egosi na Pọl hapụrụ ebe ndị ahụ gbakọrọ; “si n’etiti ha” bụ ụzọ ebumpụta ụwa isi kwuo ya n’Igbo.
