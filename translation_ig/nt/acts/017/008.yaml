  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐτάραξαν δὲ τὸν ὄχλον καὶ τοὺς πολιτάρχας ἀκούοντας ταῦτα,
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/008.yaml
  text: And they disturbed the crowd and the city officials when they heard these things,[a]
translation:
  language: ig
  text: Ha kpasuru ìgwè mmadụ ahụ na ndị isi obodo ọgba aghara mgbe ha nụrụ ihe ndị a.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n’ụzọ kpọmkwem karị, “ndị politak” (politarchs), aha ọkwá pụrụ iche ndị Masedonia na-enye ndị ọchịchị obodo.
    reason: cultural_note
lexical_decisions:
- source_word: ἐτάραξαν
  choice: ha kpasuru ha ọgba aghara
  rationale: Nkebi okwu a na-egosi na ndị ahụ kpatara ma ìgwè mmadụ ma ndị isi obodo inwe nchekasị na ọgba aghara; ọ na-ezere ime ka okwu Grik ahụ sie ike karịa ka ọ dị.
- source_word: δὲ
  choice: (egosighị ya iche)
  rationale: δέ bụ njikọ dị nro n’akụkọ a. Usoro ahịrịokwu Igbo ahụ na-aga nke ọma n’enweghị ịsụgharị ya dịka okwu kwụụrụ onwe ya.
- source_word: ὄχλον
  choice: ìgwè mmadụ ahụ
  rationale: Nke a bụ okwu Igbo doro anya na nke na-anọpụ iche maka ndị mmadụ gbakọtara; ọ naghị etinye echiche nke ìgwè na-eme ihe ike.
- source_word: πολιτάρχας
  choice: ndị isi obodo
  rationale: Nke a na-enye onye na-agụ Igbo nghọta banyere ndị ọchịchị obodo, ebe nkọwa ala peeji na-echekwa aha ọkwá pụrụ iche nke ndị Masedonia.
- source_word: ἀκούοντας ταῦτα
  choice: Mgbe ... nụrụ ihe ndị a
  rationale: A sụgharịrị participle ahụ dịka nkebi oge, ọ metụtakwara ma ìgwè mmadụ ahụ ma ndị isi obodo. “Ihe ndị a” na-echekwa ọtụtụ nke ταῦτα.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị mfe nghọta ma nwee ugwu. A gbanwere usoro okwu ka o doo anya na ndị nụrụ ihe ndị ahụ bụ ìgwè mmadụ na ndị isi obodo, ebe ndị e kwuru okwu ha n’amaokwu bu ụzọ bụ ndị kpasuru ha ọgba aghara.
