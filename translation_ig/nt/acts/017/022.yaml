    text: A pụkwara ịsị, “unu na-atụ egwu chi nke ukwuu,” ma ọ bụ, “unu ji okpukpe kpọrọ ihe karịa ndị ọzọ.” Okwu Grik ahụ nwere ike inwe echiche ọjọọ ma ọ bụ nke ọma.
    reason: lexical_alternative
  revision_rationale: The revision removes the unwarranted causal force introduced by “Ya mere” and streamlines the neutral main rendering of δεισιδαιμονεστέρους. The footnote continues to preserve the word’s possible pejorative sense (“too superstitious”) and its formal comparative force, without deciding Paul’s intended tone.
