  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Σταθεὶς ⸀δὲ Παῦλος ἐν μέσῳ τοῦ Ἀρείου Πάγου ἔφη· Ἄνδρες Ἀθηναῖοι, κατὰ πάντα ὡς δεισιδαιμονεστέρους ὑμᾶς θεωρῶ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/022.yaml
  text: So Paul[a], standing in the midst of the Areopagus, said, “Men of Athens, I see that in every way you are very religious.”
translation:
  language: ig
  text: Pọl guzoro n’etiti Areọpagọs wee sị, “Ndị ikom Atens, ana m ahụ na n’ụzọ niile unu ji okpukpe kpọrọ ihe nke ukwuu.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “unu na-atụ egwu chi nke ukwuu,” ma ọ bụ, “unu ji okpukpe kpọrọ ihe karịa ndị ọzọ.” Okwu Grik ahụ nwere ike inwe echiche ọjọọ ma ọ bụ nke ọma.
    reason: lexical_alternative
lexical_decisions:
- source_word: Σταθεὶς
  choice: guzoro
  rationale: Ngwaa a na-akọwa otú Pọl si bilie guzo malite okwu ya; “guzoro” bụ okwu Igbo dị mfe ma kwekọọ n’ọnọdụ ahụ.
- source_word: δὲ
  choice: Ya mere
  rationale: δὲ na-eme njikọ dị nro n’akụkọ a; “Ya mere” na-enye usoro okwu doro anya n’Igbo n’enweghị ime ya ka ọ bụrụ mmegide siri ike.
- source_word: ἐν μέσῳ τοῦ Ἀρείου Πάγου
  choice: n’etiti Areọpagọs
  rationale: Nke a na-edobe nkọwa ebe dị n’asụsụ Grik, kama ịkọwa ya ozugbo dịka naanị ịnọ n’ihu otu kansụl.
- source_word: Ἀρείου Πάγου
  choice: Areọpagọs
  rationale: E degharịrị aha Grik ahụ n’ụdị dabara n’usoro mkpọpụta na nsụpe Igbo, kama iji aha Latịn ọdịnala bụ́ “Ugwu Mas.”
- source_word: ἔφη
  choice: wee sị
  rationale: N’okwu mmeghe akụkọ, nke a bụ ụzọ Igbo ebumpụta ụwa si webata okwu mmadụ kwuru.
- source_word: Ἄνδρες Ἀθηναῖοι
  choice: Ndị ikom Atens
  rationale: Nke a na-echekwa ụdị ịkpọ ndị nwoke obodo Atens okwu nke dị n’asụsụ Grik, ma na-ada ka okwu nkwanye ùgwù n’Igbo.
- source_word: κατὰ πάντα
  choice: n’ụzọ niile
  rationale: Ọ na-egosi obosara ihe Pọl hụrụ banyere ha—n’akụkụ niile ma ọ bụ n’ihe niile o lebara anya.
- source_word: ὡς
  choice: na
  rationale: “Na” na-ewebata ọdịnaya nke ihe Pọl hụrụ n’ụzọ Igbo na-aga were were.
- source_word: δεισιδαιμονεστέρους
  choice: ndị ji ihe gbasara okpukpe kpọrọ ihe nke ukwuu
  rationale: Okwu Grik a nwere ike ịdị mma ma ọ bụ bụrụ nkatọ. Nhọrọ a na-edobe ụda dịtụ n’etiti ma na-agụ nke ọma n’Igbo; e debere nkọwa ndị ọzọ n’ala peeji.
- source_word: θεωρῶ
  choice: ana m ahụ
  rationale: Ọ na-egosi ihe Pọl chọpụtara site n’ileba anya; “ana m ahụ” dị mfe ma bụrụ okwu Igbo nkịtị.
theological_decisions:
- issue: Ụda okwu Pọl ji kọwaa otú ndị Atens si emeso ihe gbasara chi
  choice: ndị ji ihe gbasara okpukpe kpọrọ ihe nke ukwuu
  alternative: ndị na-ekwebiga nkwenkwe ụgha ókè; ndị ji okpukpe kpọrọ ihe karịa ndị ọzọ
  rationale: δεισιδαιμονεστέρους nwere ike ịbụ okwu nkwanye ùgwù ma ọ bụ okwu nkatọ. Isi ederede ahọrọghị otu akụkụ nke ukwuu, ebe nkọwa ala peeji na-echekwa ma nghọta ọjọọ ya ma ọdịdị ntụnyere ya.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. A hapụrụ aha Areọpagọs dịka aha pụrụ iche, ma debe okwu Pọl n’ụdị nkwupụta dị akọ nke na-adịghị ekpebi ozugbo ma ọ na-eto ha ma ọ bụ na-akatọ ha.
