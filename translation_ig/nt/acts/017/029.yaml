    text: A pụkwara ịsụgharị ya “Chi ahụ,” “ọdịdị Chineke,” ma ọ bụ “Ihe bụ chi.” Okwu Grik τὸ θεῖον sara mbara maka ihe bụ chi; n’arụmụka Pọl ebe a, ọ na-ezo aka n’ezi Chineke.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ “ihe a wapụtara” ma ọ bụ “ihe a kanyeere akanye.”
    reason: lexical_alternative
  revision_rationale: The revision corrects the central lexical error in rendering τὸ θεῖον while preserving Paul’s philosophically framed reference to the true God. It also makes χαράγματι and its qualifying phrase explicit as a carved image produced by human skill and thought, without adding doctrinal interpretation.
