id: ACT.17.29
reference: Acts 17:29
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: γένος οὖν ὑπάρχοντες τοῦ θεοῦ οὐκ ὀφείλομεν νομίζειν χρυσῷ ἢ ἀργύρῳ ἢ λίθῳ, χαράγματι τέχνης καὶ ἐνθυμήσεως ἀνθρώπου, τὸ θεῖον εἶναι ὅμοιον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/029.yaml
  text: Therefore[a], since we are God’s offspring, we ought not to think that the Divine Being is like gold or silver or stone[b], an image formed by human skill and imagination.
translation:
  language: ig
  text: Ya mere, ebe anyị bụ ụmụ Chineke, anyị ekwesịghị iche na ihe bụ chi[a] yiri ọlaedo, ọlaọcha, ma ọ bụ nkume—ihe a kpụrụ akpụ[b] nke nkà na echiche mmadụ mere.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “Chi ahụ,” “ọdịdị Chineke,” ma ọ bụ “Ihe bụ chi.” Okwu Grik τὸ θεῖον sara mbara maka ihe bụ chi; n’arụmụka Pọl ebe a, ọ na-ezo aka n’ezi Chineke.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ “ihe a wapụtara” ma ọ bụ “ihe a kanyeere akanye.”
    reason: lexical_alternative
lexical_decisions:
- source_word: γένος
  choice: ụmụ
  rationale: N'ebe a, ọ na-egosi na mmadụ sitere n'aka Chineke ma nwee njikọ n'ebe ọ nọ; “ụmụ” bụ okwu Igbo doro anya nke na-adịghị ezo aka n'agbụrụ.
- source_word: οὖν
  choice: Ya mere
  rationale: Ọ na-egosi nkwubi okwu Pọl wepụtara site n'ihe o kwuru tupu nke a.
- source_word: ὑπάρχοντες
  choice: ebe anyị bụ
  rationale: Nkọwa participle a na-enye ihe kpatara nkwubi okwu ahụ; ụdị a bụ Igbo nkịtị ma doo anya.
- source_word: τοῦ θεοῦ
  choice: Chineke
  rationale: “Ụmụ Chineke” bụ ụzọ ebumpụta ụwa e si kwuo genitive a n'Igbo.
- source_word: οὐκ ὀφείλομεν
  choice: anyị ekwesịghị
  rationale: Ọ na-egosi na echiche ahụ ezighị ezi ma bụrụ ihe mmadụ na-ekwesịghị iche, ọ bụghị naanị ihe na-agaghị ekwe omume.
- source_word: νομίζειν
  choice: iche
  rationale: Ọ bụ okwu Igbo sara mbara ma dị mfe maka inwe echiche ma ọ bụ ikwere na ihe dị otu a.
- source_word: χρυσῷ ἢ ἀργύρῳ ἢ λίθῳ
  choice: ọlaedo ma ọ bụ ọlaọcha ma ọ bụ nkume
  rationale: Ọ na-edebe ihe atọ e depụtara n'asụsụ Grik na njikọ ha n'otu usoro.
- source_word: χαράγματι
  choice: ihe a tụrụ atụ
  rationale: Ọ na-egosi ihe mmadụ sere, wapụtara, ma ọ bụ tụrụ n'ihe siri ike; nkọwa ọzọ dị n'ala peeji na-echekwa obosara okwu ahụ.
- source_word: τέχνης
  choice: nka
  rationale: “Nka” na-ekpuchi nkà ọrụ na ikike onye na-emepụta ihe.
- source_word: ἐνθυμήσεως
  choice: echiche
  rationale: Ọ na-egosi echiche ma ọ bụ atụmatụ sitere n'uche onye kere arụsị ahụ, n'Igbo dị mfe nghọta.
- source_word: ἀνθρώπου
  choice: mmadụ
  rationale: Ọ na-ezo aka n'ụmụ mmadụ n'ozuzu, ọ bụghị naanị otu nwoke.
- source_word: τὸ θεῖον
  choice: Ihe Dị Nsọ
  rationale: Ọ na-echekwa ụdị okwu Grik sara mbara nke na-ekwu banyere onye ma ọ bụ ihe bụ chi, ma n'arụmụka Pọl ọ na-ezo aka n'ezi Chineke; mkpụrụedemede ukwu na-enyere aka igosi ntụaka ahụ n'ebughị nkọwa nkà mmụta okpukpe ọzọ.
theological_decisions:
- issue: Otu e si sụgharịta τὸ θεῖον n'okwu nke na-ekwu maka otu Chineke ma jiri asụsụ nkà ihe ọmụma
  choice: Ihe Dị Nsọ
  alternative: Chi ahụ; ọdịdị Chineke; Ihe bụ chi
  rationale: “Ihe Dị Nsọ” na-echekwa obosara na obere mgbagwoju anya nke neuter substantive Grik, ebe ọnọdụ okwu Pọl na-eme ka o doo anya na ọ na-ekwu banyere ezi Chineke. A naghị eme ya okwu ụka pụrụ iche ma ọ bụ mee ka ọ bụrụ naanị ike na-enweghị onye.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke oge a, dị ugwu ma dị mfe nghọta. E debere usoro arụmụka ahụ nke ọma, tinyere njikọ “Ya mere” na ihe kpatara ya, “ebe anyị bụ ụmụ Chineke.” Ihe akara ala peeji [a] na [b] pụtara kpọmkwem n'ederede.
