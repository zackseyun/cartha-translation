revisions:
- from: Ya mere, ebe anyị bụ ụmụ Chineke, anyị ekwesịghị iche na Ihe Dị Nsọ[a] yiri ọlaedo ma ọ bụ ọlaọcha ma ọ bụ nkume—ihe a tụrụ atụ[b] site na nka na echiche mmadụ.
  to: Ya mere, ebe anyị bụ ụmụ Chineke, anyị ekwesịghị iche na ihe bụ chi[a] yiri ọlaedo, ọlaọcha, ma ọ bụ nkume—ihe a kpụrụ akpụ[b] nke nkà na echiche mmadụ mere.
  rationale: The revision corrects the central lexical error in rendering τὸ θεῖον while preserving Paul’s philosophically framed reference to the true God. It also makes χαράγματι and its qualifying phrase explicit as a carved image produced by human skill and thought, without adding doctrinal interpretation.
