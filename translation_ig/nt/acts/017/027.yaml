  text: ζητεῖν τὸν ⸀θεὸν εἰ ἄρα γε ψηλαφήσειαν αὐτὸν καὶ εὕροιεν, καί γε οὐ μακρὰν ἀπὸ ἑνὸς ἑκάστου ἡμῶν ὑπάρχοντα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/027.yaml
  text: that they should seek God[a], if perhaps they might grope for him and find him—though indeed he is not far from each one of us.
translation:
  language: ig
  text: ka ha chọọ Chineke, ma eleghị anya ha nwere ike iji aka na-achọgharị ya wee chọta ya—ọ bụ ezie na n’ezie ọ nọghị onye ọ bụla n’ime anyị anya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “jiri aka chọọ ya.” Ngwaa Grik ahụ na-egosi ịchọ ihe site n’imetụ aka, dị ka mgbe mmadụ na-adịghị ahụ ụzọ nke ọma ma ọ bụ nọ n’ọchịchịrị.
    reason: lexical_alternative
lexical_decisions:
- source_word: ζητεῖν
  choice: ka ha chọọ
  rationale: Ngwaa nke a dabere n’ahịrịokwu bu ụzọ ma na-egosi nzube; ‘ka ha chọọ’ bụ ụzọ Igbo sitere n’okike si chekwaa echiche ahụ.
- source_word: τὸν θεόν
  choice: Chineke
  rationale: N’Igbo, aha a anaghị achọ mkpụrụokwu ọzọ nke ga-anọchi artikul Grik n’ebe a.
- source_word: εἰ ἄρα γε
  choice: ma eleghị anya
  rationale: Nke a na-echekwa echiche nke ihe a na-ejighị n’aka na olileanya dị ntakịrị n’ịchọ ahụ.
- source_word: ψηλαφήσειαν
  choice: ha ga-amụrụgharị aka chọọ ya
  rationale: Nhọrọ a na-egosipụta ịchọ ihe site n’imetụ aka ma ọ bụ ịmụgharị aka, dịka onye nghọta ya pere mpe ma ọ bụ onye nọ n’ọchịchịrị.
- source_word: καὶ εὕροιεν
  choice: wee chọta ya
  rationale: ‘Wee’ jikọtara nchọta ahụ na ịmụgharị aka, ebe ike nke ọnọdụ a na-ejighị n’aka ka sitere na ‘ma eleghị anya.’
- source_word: καί γε
  choice: ọ bụ ezie na n’ezie
  rationale: 'Nke a na-ebute nkọwa na-emegide adịghị ike nke nchọ mmadụ: n’ezie Chineke nọ nso.'
- source_word: οὐ μακρὰν ἀπὸ ἑνὸς ἑκάστου ἡμῶν ὑπάρχοντα
  choice: ọ nọghị onye ọ bụla n’ime anyị anya
  rationale: Ọ bụ okwu Igbo sitere n’okike nke na-echekwa nkwusi ike nkesa dị na ‘onye ọ bụla’ nakwa eziokwu nke ịdị Chineke nso.
theological_decisions:
- issue: Ịdị Chineke nso na nchọ mmadụ nwere oke
  choice: E chekwara ma ọnọdụ nchọ mmadụ a na-ejighị n’aka, site n’onyonyo ịmụgharị aka, ma nkwupụta doro anya na Chineke anọghị onye ọ bụla anya.
  alternative: Ịsụgharị ya naanị dịka ‘chọọ ya’ n’enweghị onyonyo imetụ aka, ma ọ bụ ime ka ịchọta ya yie ihe doro anya kpamkpam.
  rationale: Grik jikọtara oke nghọta mmadụ na ịdị Chineke nso; nsụgharị ekwesịghị ihichapụ esemokwu echiche a.
translation_notes:
  register: Igbo Izugbe nke oge a, dị ùgwù ma doo ndị nkịtị anya. ‘Amụrụgharị aka’ na-eme ka onyonyo Grik pụta ìhè n’enweghị okwu siri ike ma ọ bụ nkwenkwe otu ụka.
