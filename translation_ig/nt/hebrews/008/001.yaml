id: HEB.8.1
reference: Hebrews 8:1
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Κεφάλαιον δὲ ἐπὶ τοῖς λεγομένοις, τοιοῦτον ἔχομεν ἀρχιερέα, ὃς ἐκάθισεν ἐν δεξιᾷ τοῦ θρόνου τῆς μεγαλωσύνης ἐν τοῖς οὐρανοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/001.yaml
  text: 'The main point in what is being said is this: we have such a high priest[a], who sat down at the right hand of the throne of the Majesty in the heavens[b],'
translation:
  language: ig
  text: 'Isi okwu[a] n’ihe ndị a na-ekwu bụ nke a: anyị nwere onyeisi nchụàjà dị otu a, onye nọdụrụ ala n’aka nri nke ocheeze nke Ebube ahụ n’eluigwe[b],


    [a] A pụkwara ịsụgharị ya, “Nchịkọta” ma ọ bụ “Isi ihe kachasị mkpa” n’ihe ndị e kwuworo.


    [b] N’asụsụ Grik, e ji ọtụtụ ọnụ ọgụgụ mee okwu a: “n’eluigwe.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “Nchịkọta” ma ọ bụ “Isi ihe kachasị mkpa” n’ihe ndị e kwuworo.
    reason: lexical_alternative
  - marker: b
    text: 'N’asụsụ Grik, e ji ọtụtụ ọnụ ọgụgụ mee okwu a: “n’eluigwe.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Κεφάλαιον
  choice: Isi okwu
  rationale: N’ebe a, okwu ahụ na-egosi isi ihe ma ọ bụ nchịkọta arụmụka ahụ, ọ bụghị ‘isi’ n’ụzọ nkịtị ma ọ bụ otu isi akwụkwọ.
- source_word: δὲ
  choice: E gosighị ya site n’otu okwu pụrụ iche
  rationale: δὲ na-eme ka okwu gafee n’isi ihe na-esonụ. Nhazi ahịrịokwu Igbo na-egosi ngafe ahụ nke ọma n’enweghị ịgbakwụnye ‘Ugbu a’ ma ọ bụ ‘Ma,’ nke nwere ike ime ka oge ma ọ bụ mmegide pụta karịa ka Grik kwuru.
- source_word: ἐπὶ τοῖς λεγομένοις
  choice: n’ihe ndị a na-ekwu
  rationale: Nke a na-echekwa echiche nke ihe a na-ekwu ugbu a ma na-ada nke ọma n’Igbo.
- source_word: τοιοῦτον ἔχομεν ἀρχιερέα
  choice: anyị nwere onyeisi nchụàjà dị otu a
  rationale: Ọ na-ezo aka n’ụdị onyeisi nchụàjà a kọwara n’arụmụka gara aga ma na-echekwa nkwupụta dị mfe nke ἔχομεν.
- source_word: ἐκάθισεν
  choice: nọdụrụ ala
  rationale: Ọ na-egosi omume nke ịnọdụ ala nke mere eme, n’enweghị ịgbakwụnye nkọwa gbasara ihe omume ahụ pụtara n’ozizi.
- source_word: ἐν δεξιᾷ τοῦ θρόνου
  choice: n’aka nri nke ocheeze
  rationale: Ọ na-echekwa akpaalaokwu Akwụkwọ Nsọ banyere ọnọdụ nsọpụrụ na ọchịchị, yana ihe oyiyi ocheeze.
- source_word: τῆς μεγαλωσύνης
  choice: nke Onye ahụ dị Ebube
  rationale: Igbo chọrọ ka ntụaka a doo anya n’ụzọ ụtọ asụsụ. Nsụgharị a na-echekwa aha nkwanye ùgwù na ntụaka na-apụtachaghị aha Chineke kpọmkwem.
- source_word: ἐν τοῖς οὐρανοῖς
  choice: n’eluigwe
  rationale: Nke a bụ okwu Igbo doro anya ma bụrụkwa nke a na-ejikarị eme ihe; ihe odide Grik ji ọtụtụ ọnụ ọgụgụ, nke e mere ka ọ pụta na nkọwa ala peeji.
theological_decisions:
- issue: Ma a ga-akpọ onye τῆς μεγαλωσύνης na-ezo aka na ya ‘Chineke’ kpọmkwem
  choice: Onye ahụ dị Ebube
  alternative: Chineke; Onye Kachasị Elu
  rationale: Grik ji okwu nkwanye ùgwù na-apụtaghị aha θεός kpọmkwem. Ya mere, nsụgharị ahụ anaghị akpọ ‘Chineke’ n’ebe isi mmalite ahụ na-akpọghị ya, ọ bụ ezie na ọ na-eme ka ntụaka ahụ bụrụ nke mmadụ dịka ụtọ asụsụ Igbo chọrọ.
- issue: Ma a ga-akọwa ịnọdụ ala ahụ dịka ihe akaebe na ọrụ nchụàjà agwụla
  choice: nọdụrụ ala
  alternative: were ọnọdụ ya n’ihi na ọ rụchaala ọrụ ya
  rationale: Ihe gbara amaokwu ahụ gburugburu nwere ike igosi ihe omume ahụ pụtara, ma nsụgharị ekwesịghị itinye nkọwa ozizi nke okwu ἐκάθισεν n’onwe ya ekwughị.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ugwu ma dị mfe nghọta. E debere akpaalaokwu Akwụkwọ Nsọ ‘n’aka nri’ na ihe oyiyi ‘ocheeze,’ ma zere okwu ụka pụrụ iche ma ọ bụ nkọwa ozizi agbakwunyere.
