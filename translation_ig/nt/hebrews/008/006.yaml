    text: Okwu Grik a pụkwara ịpụta “akwụkwọ nketa” n’ọnọdụ ụfọdụ; ma n’ebe a, “ọgbụgba ndụ” dabara na nkwa Jeremaịa banyere ọgbụgba ndụ ọhụrụ nke a ga-ehota n’amaokwu ndị na-esote.
    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ, “bụ́ nke e tinyere n’ọrụ dịka iwu, dabere na nkwa ndị ka mma.”
    reason: lexical_alternative
  revision_rationale: The text is revised only to make the Greek comparative-correlative relation more explicit and to correct the misleading alternative-reading footnote. The covenant rendering, legal-establishment sense, and formal modern Standard Igbo register are retained.
