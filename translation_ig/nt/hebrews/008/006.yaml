id: HEB.8.6
reference: Hebrews 8:6
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸀νυνὶ δὲ διαφορωτέρας τέτυχεν λειτουργίας, ὅσῳ καὶ κρείττονός ἐστιν διαθήκης μεσίτης, ἥτις ἐπὶ κρείττοσιν ἐπαγγελίαις νενομοθέτηται.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/006.yaml
  text: But as it is[a], he has obtained a more excellent ministry, by as much as he is also the mediator of a better covenant[c][b], which has been enacted on better promises.
translation:
  language: ig
  text: Ma ugbu a, ọ nwetala ozi dị elu karị; ka ozi ahụ siri dị elu, otu ahụkwa ka ọ bụ onye ogbugbo nke ọgbụgba ndụ ka mma[a], bụ́ nke e hiwere n’elu nkwa ndị ka mma.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Okwu Grik a pụkwara ịpụta “akwụkwọ nketa” n’ọnọdụ ụfọdụ; ma n’ebe a, “ọgbụgba ndụ” dabara na nkwa Jeremaịa banyere ọgbụgba ndụ ọhụrụ nke a ga-ehota n’amaokwu ndị na-esote.
    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ, “bụ́ nke e tinyere n’ọrụ dịka iwu, dabere na nkwa ndị ka mma.”
    reason: lexical_alternative
lexical_decisions:
- source_word: νυνὶ δὲ
  choice: Ma ugbu a
  rationale: Na-egosi mgbanwe na ntụnyere ya na ndị nchụàjà nọ n’ụwa a kpọtụrụ aha tupu nke a, ma na-edobe ma echiche oge ma nke mmegide.
- source_word: διαφορωτέρας
  choice: dị elu karị
  rationale: Na-egosi na ozi ahụ ka nke ọzọ mma n’ịdị mma; okwu a bụ nke Igbo dị ugbu a ma dịkwa ugwu.
- source_word: τέτυχεν
  choice: o nwetala
  rationale: 'Na-egosipụta ihe emere nke rụpụtara ọnọdụ ka dị ugbu a: ọ natara ozi ahụ ma nwee ya ugbu a.'
- source_word: λειτουργίας
  choice: ozi
  rationale: N’ebe a ọ bụ ọrụ nsọ Kraịst dị ka onye nchụàjà. “Ozi” doro anya n’Igbo, ebe amaokwu ndị gbara ya gburugburu na-eme ka ụdị ọrụ ahụ pụta ìhè.
- source_word: ὅσῳ καὶ
  choice: dịka ọ bụkwa
  rationale: Na-ejikọta ịdị elu nke ozi Kraịst na ịdị mma nke ọgbụgba ndụ ọ na-agbachitere; ọ bụ nsụgharị Igbo sitere n’okike nke na-edobe ntụnyere ahụ.
- source_word: κρείττονός ... διαθήκης
  choice: ọgbụgba ndụ ka mma
  rationale: “Ka mma” na-edobe isi okwu ntụnyere a na-ekwughachi n’Akwụkwọ Ndị Hibru, ebe “ọgbụgba ndụ” dabara na nkwa ọgbụgba ndụ ọhụrụ Jeremaịa a ga-ehota.
- source_word: μεσίτης
  choice: onye ogbugbo
  rationale: Ọ bụ okwu Igbo a maara nke ọma maka onye nọ n’etiti ndị abụọ iji mee ka mmekọrịta ma ọ bụ nkwekọrịta guzosie ike.
- source_word: ἥτις
  choice: bụ́ nke
  rationale: Na-alaghachi n’ọgbụgba ndụ ma webata nkọwa gbasara ya, n’enweghị ịgbakwunye echiche na-adịghị n’isi mmalite.
- source_word: ἐπὶ κρείττοσιν ἐπαγγελίαις
  choice: n’elu nkwa ndị ka mma
  rationale: 'Na-edobe ihe atụ nke ntọala: nkwa ndị ka mma bụ ihe ọgbụgba ndụ ahụ dabere na ya.'
- source_word: νενομοθέτηται
  choice: e hiwere
  rationale: Na-egosi na e tinyela ọgbụgba ndụ ahụ n’ọrụ ma ọ ka guzosiri ike. Ihe odide ala peeji na-edobe ụda iwu siri ike nke okwu Grik ahụ.
theological_decisions:
- issue: Nsụgharị διαθήκη na Ndị Hibru 8:6
  choice: ọgbụgba ndụ
  alternative: ọgbụgba ndụ nke akwụkwọ ikike
  rationale: Ọnọdụ Ndị Hibru 8 dabeere kpọmkwem na nkwa Jeremaịa banyere ọgbụgba ndụ ọhụrụ na ọrụ onye ogbugbo. Ya mere, “ọgbụgba ndụ” na-egosipụta ọnọdụ Akwụkwọ Nsọ Ochie nke ọma karịa echiche nke akwụkwọ nketa, ọ bụ ezie na okwu Grik ahụ nwere ike inwe echiche nke akwụkwọ ikike n’ọnọdụ ụfọdụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ugwu ma dị mfe nghọta, sụgharịa ya. Ahịrịokwu ahụ na-edobe usoro ntụnyere nke Grik, ma zere okwu ụka pụrụ iche. E tinyere akara ala peeji niile [a], [b] n’ederede isi.
