  text: καὶ οὐ μὴ διδάξωσιν ἕκαστος τὸν πολίτην αὐτοῦ καὶ ἕκαστος τὸν ἀδελφὸν αὐτοῦ, λέγων· Γνῶθι τὸν κύριον, ὅτι πάντες εἰδήσουσίν με ἀπὸ ⸀μικροῦ ἕως μεγάλου αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/011.yaml
  text: And they will certainly not teach[a], each one his fellow citizen and each one his brother, saying, ‘Know the Lord,’ because they will all know me, from the least of them to the greatest.
translation:
  language: ig
  text: Onye ọ bụla agaghị akụziri nwa amaala ibe ya ma ọlị, onye ọ bụla agaghị akụzikwara nwanne ya, sị, “Mara Onyenwe anyị,” n’ihi na ha niile ga-amara m, malite n’onye kacha nta n’etiti ha ruo n’onye kacha ukwuu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐ μὴ διδάξωσιν
  choice: Ha agaghịkwa akụziri ibe ha ma ọlị
  rationale: “Ma ọlị” na-egosipụta ike nke nkwụsi ike dị na οὐ μή, ebe “agaghịkwa” na-ejikọta amaokwu a na ihe bu ya ụzọ n’asụsụ Igbo dị ugbu a.
- source_word: ἕκαστος
  choice: onye ọ bụla
  rationale: 'Nke a na-echekwa echiche nkesa ahụ: a na-ekwu banyere onye nke ọ bụla n’ime obodo ọgbụgba ndụ ahụ.'
- source_word: πολίτην αὐτοῦ
  choice: nwa amaala ibe ya
  rationale: πολίτης pụtara nwa amaala ma ọ bụ onye obodo ibe mmadụ; nhọrọ a na-agbaso okwu Grik nke Hibru kpọmkwem kama iji okwu a na-ahụkarị na Jeremaịa dochie ya.
- source_word: ἀδελφὸν αὐτοῦ
  choice: nwanne ya
  rationale: “Nwanne” bụ okwu Igbo ebumpụta ụwa maka ἀδελφός n’ọnọdụ a, ma ọ na-echekwa asụsụ ezinụlọ nke ọgbụgba ndụ ahụ n’enweghị itinye nkọwa ụka pụrụ iche.
- source_word: Γνῶθι τὸν κύριον
  choice: Mara Onyenwe anyị
  rationale: “Mara” na-enye iwu ahụ n’ụzọ kwụ ọtọ ma dị mfe; “Onyenwe anyị” bụ nsụgharị Igbo a na-ahụkarị ma dị ùgwù maka κύριος.
- source_word: πάντες εἰδήσουσίν με
  choice: ha niile ga-amara m
  rationale: Nke a na-echekwa πάντες, ọdịnihu nke οἶδα, na ihe nnọchiaha “m” kpọmkwem.
- source_word: ἀπὸ μικροῦ ἕως μεγάλου αὐτῶν
  choice: malite n’onye kacha nta n’etiti ha ruo n’onye kacha ukwuu
  rationale: Nkebiokwu a na-egosi mmadụ niile n’ime ìgwè ahụ, site n’ókè ala ruo n’ókè elu, n’enweghị ikpebi na ọ bụ naanị afọ ndụ, ọkwa, ma ọ bụ akụnụba ka a na-ekwu maka ya.
theological_decisions:
- issue: Okwu obodo ọgbụgba ndụ πολίτην n’amaokwu e si na Jeremaịa nweta
  choice: nwa amaala ibe ya
  alternative: onye agbata obi ya
  rationale: Ihe odide Grik nke Hibru nwere πολίτην, “nwa amaala/onye obodo ibe ya.” Ya mere, isi amaokwu na-agbaso ihe odide Grik ahụ; e debere “onye agbata obi” n’ala peeji n’ihi na ọ bụ okwu ndị na-agụ Jeremaịa nwere ike ịtụ anya.
- issue: Asụsụ ezinụlọ dị na ἀδελφόν
  choice: nwanne ya
  alternative: nwanna nwoke ya
  rationale: Ọ bụ ezie na ụdị Grik ahụ bụ otu nwoke, “nwanne” n’Igbo bụ nsụgharị ebumpụta ụwa nke na-echekwa mmekọrịta ezinụlọ ahụ ma ghara ịmanye nwoke ebe okwu Igbo nkịtị anaghị achọ ka e kọwaa okike.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E tinyere “ma ọlị” iji mee ka nkwụsi ike nke οὐ μή pụta ìhè. E buru ụzọ kwuo “akụziri ibe ha” maka ịdị mfe nghọta, e mesịakwa chekwaa usoro nkesa “onye ọ bụla ... onye ọ bụla” nke isi mmalite ahụ.
