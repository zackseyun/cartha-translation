- from: ọ bụghị dịka ọgbụgba ndụ ahụ mụ na nna nna ha gbara n’ụbọchị ahụ m jidere aka ha iji kpọpụta ha n’ala Ijipt[a], n’ihi na ha anọgideghị n’ọgbụgba ndụ m, mụ onwe m leghaara ha anya[b], ka Onyenwe anyị kwuru.
  to: ọ bụghị dịka ọgbụgba ndụ ahụ mụ na ndị nna ochie ha gbara n’ụbọchị m jidere aka ha iji kpọpụta ha n’ala Ijipt[a], n’ihi na ha anọgideghị n’ọgbụgba ndụ m, mụ onwe m leghaara ha anya[b], ka Onyenwe anyị kwuru.
