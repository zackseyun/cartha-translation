id: HEB.8.9
reference: Hebrews 8:9
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οὐ κατὰ τὴν διαθήκην ἣν ἐποίησα τοῖς πατράσιν αὐτῶν ἐν ἡμέρᾳ ἐπιλαβομένου μου τῆς χειρὸς αὐτῶν ἐξαγαγεῖν αὐτοὺς ἐκ γῆς Αἰγύπτου, ὅτι αὐτοὶ οὐκ ἐνέμειναν ἐν τῇ διαθήκῃ μου, κἀγὼ ἠμέλησα αὐτῶν, λέγει κύριος.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/009.yaml
  text: not like the covenant that I made with their fathers on the day when I took hold of their hand to bring them out of the land of Egypt[a], because they did not continue in my covenant, and I disregarded them[b], says the Lord.
translation:
  language: ig
  text: ọ bụghị dịka ọgbụgba ndụ ahụ mụ na ndị nna ochie ha gbara n’ụbọchị m jidere aka ha iji kpọpụta ha n’ala Ijipt[a], n’ihi na ha anọgideghị n’ọgbụgba ndụ m, mụ onwe m leghaara ha anya[b], ka Onyenwe anyị kwuru.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ikwu ya n’ụzọ okwu Igbo si aga: “m jidere ha n’aka.”'
    reason: lexical_alternative
  - marker: b
    text: 'Ntụgharị a na-agbaso okwu Grik e hotara n’Akwụkwọ Ndị Hibru: “m leghaara ha anya.” Ma ihe odide Hibru nke Jeremaya 31:32 nwere echiche dị iche, nke a na-atụgharịkarị, “ọ bụ ezie na m bụ di ha,” ma ọ bụ, “ọ bụ ezie na m bụ nna ukwu ha.”'
    reason: alternative_reading
lexical_decisions:
- source_word: διαθήκην
  choice: ọgbụgba ndụ
  rationale: Nke a bụ okwu Igbo a na-ejikarị akọwa ọgbụgba ndụ Chineke; ọ dabara n’ọrụ διαθήκη n’Akwụkwọ Ndị Hibru karịa ‘nkwekọrịta’ ma ọ bụ ‘ọgbụgba ama.’
- source_word: ἐποίησα τοῖς πατράσιν αὐτῶν
  choice: mụ na nna nna ha gbara
  rationale: N’Igbo, a na-asị na mmadụ na mmadụ ‘gbara ọgbụgba ndụ’; ‘nna nna ha’ na-ezo aka kpọmkwem n’ụmụ nwoke bụ́ ndị nna ochie Izrel.
- source_word: ἐν ἡμέρᾳ
  choice: n’ụbọchị ahụ
  rationale: Nke a na-edobe ọdịdị oge doro anya nke Grik ma na-ada nke ọma n’Igbo.
- source_word: ἐπιλαβομένου μου τῆς χειρὸς αὐτῶν
  choice: m jidere aka ha
  rationale: Ọ na-edobe ihe oyiyi Grik nke ijide aka ha, ma bụrụkwa okwu Igbo doro anya.
- source_word: ἐξαγαγεῖν
  choice: iji kpọpụta ha
  rationale: ‘Kpọpụta’ na-egosi ime ka ha si n’otu ebe pụta, dabara n’ihe gbasara ọpụpụ ha n’Ijipt.
- source_word: γῆς Αἰγύπτου
  choice: n’ala Ijipt
  rationale: Ọ na-edobe γῆς (‘ala’) nke dị n’ihe odide Grik.
- source_word: οὐκ ἐνέμειναν ἐν τῇ διαθήκῃ μου
  choice: ha anọgideghị n’ọgbụgba ndụ m
  rationale: ‘Anọgideghị’ na-enye echiche nke ἐμμένω—ịnọgide ma ọ bụ ịrapara n’ihe mmadụ kwere ná nkwa.
- source_word: κἀγὼ ἠμέλησα αὐτῶν
  choice: mụ onwe m leghaara ha anya
  rationale: ‘Leghara … anya’ na-egosipụta ileghara mmadụ anya ma ọ bụ ịghara ilekọta ya, n’enweghị itinye echiche siri ike karịa ἀμελέω; ‘mụ onwe m’ na-egosipụta κἀγώ nke ọma.
- source_word: λέγει κύριος
  choice: ka Onyenwe anyị kwuru
  rationale: Nke a bụ usoro okwu Igbo sitere n’okike maka usoro nkwupụta amụma; ‘Onyenwe anyị’ na-anọchi κύριος.
theological_decisions:
- issue: Ihe ἠμέλησα αὐτῶν pụtara n’ebe Ndị Hibru na-ehota Jeremaya 31:32, ebe ihe odide Grik na nke Hibru dị iche
  choice: mụ onwe m leghaara ha anya
  alternative: ọ bụ ezie na m bụ di ha / onyeisi ha
  rationale: Ihe odide Grik nke Ndị Hibru kwuru ἠμέλησα αὐτῶν, ya bụ ‘m leghaara ha anya.’ A soro Grik nke amaokwu a, ma debe ọdịiche dị n’ihe odide Hibru nke Jeremaya n’okpuru peeji ka a ghara izochi esemokwu ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E debere ihe oyiyi nke ijide aka, asụsụ ọgbụgba ndụ, na ọdịiche dị n’etiti ihe odide Grik nke Ndị Hibru na ihe odide Hibru nke Jeremaya.
