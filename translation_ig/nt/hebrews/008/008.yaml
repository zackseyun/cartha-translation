revisions:
- from: N’ihi na, mgbe ọ na-ata ha ụta, ọ sịrị, “Lee, ụbọchị na-abịa, ka Onyenwe anyị kwuru, mgbe mụ na ụlọ Izrel na ụlọ Juda ga-agba ọgbụgba ndụ ọhụrụ,”
  to: N’ihi na, mgbe ọ na-ata ha ụta, ọ na-ekwu, “Lee, ụbọchị na-abịa, ka Onyenweanyị na-ekwu, mgbe mụ na ụlọ Izrel na ụlọ Juda ga-agba ọgbụgba ndụ ọhụrụ,”
  rationale: Only the Lord-speech formula has been revised to preserve λέγει κύριος as a present-tense prophetic formula and to avoid the potentially misleading separated possessive reading. The source’s ambiguity concerning precisely whom “them” identifies is retained.
