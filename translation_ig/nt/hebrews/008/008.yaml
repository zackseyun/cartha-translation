id: HEB.8.8
reference: Hebrews 8:8
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: μεμφόμενος γὰρ ⸀αὐτοὺς λέγει· Ἰδοὺ ἡμέραι ἔρχονται, λέγει κύριος, καὶ συντελέσω ἐπὶ τὸν οἶκον Ἰσραὴλ καὶ ἐπὶ τὸν οἶκον Ἰούδα διαθήκην καινήν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/008.yaml
  text: For in finding fault with them he says, “Look, days are coming, says the Lord, when I will establish a new covenant with the house of Israel and with the house of Judah,”
translation:
  language: ig
  text: N’ihi na, mgbe ọ na-ata ha ụta, ọ na-ekwu, “Lee, ụbọchị na-abịa, ka Onyenweanyị na-ekwu, mgbe mụ na ụlọ Izrel na ụlọ Juda ga-agba ọgbụgba ndụ ọhụrụ,”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μεμφόμενος ... αὐτοὺς
  choice: mgbe ọ na-ata ha ụta
  rationale: Ọ na-egosipụta ịkatọ ndị a kpọrọ ‘ha’ n'ụzọ doro anya, ma na-ahapụ onye nnọchiaha ahụ dịka ọ dị n’ihe odide Grik.
- source_word: Ἰδοὺ
  choice: Lee
  rationale: Okwu mkpu a na-adọta uche onye na-agụ ya n’ihe dị mkpa na-abịa.
- source_word: συντελέσω ... διαθήκην καινήν
  choice: mụ na ... ga-agba ọgbụgba ndụ ọhụrụ
  rationale: N’Igbo, ‘ịgba ọgbụgba ndụ’ bụ ụzọ ebumpụta ụwa isi kwuo ime ma ọ bụ iguzobe ọgbụgba ndụ; ‘ọhụrụ’ na-asụgharị καινήν.
- source_word: οἶκον Ἰσραὴλ ... οἶκον Ἰούδα
  choice: ụlọ Izrel ... ụlọ Juda
  rationale: E debere ihe atụ ‘ụlọ’ nke na-anọchi anya obodo ma ọ bụ agbụrụ ndị ahụ, dị ka n’isi mmalite.
theological_decisions:
- issue: Onye a na-ata ụta na μεμφόμενος ... αὐτοὺς
  choice: ọ na-ata ha ụta
  alternative: ọ na-ahụ ntụpọ n’ọgbụgba ndụ ahụ
  rationale: Ihe odide SBLGNT nyere αὐτοὺς (‘ha’), ya mere nsụgharị ahụ ekwesịghị ịgbanwe ihe a na-akatọ ka ọ bụrụ ọgbụgba ndụ.
- issue: Ụdị ime ọgbụgba ndụ ọhụrụ
  choice: ga-agba ọgbụgba ndụ ọhụrụ
  alternative: ga-eme ka ọgbụgba ndụ ọhụrụ zuo oke
  rationale: συντελέσω nwere echiche imezu ma ọ bụ iweta ihe ruo n’isi; okwu Igbo a na-enye ihe ọ pụtara n’ọnọdụ a n’enweghị ịgbakwụnye nkọwa gbasara usoro nkà mmụta okpukpe.
translation_notes:
  register: Asụsụ Igbo Izugbe dị ugbu a, dị ùgwù ma dị mfe nghọta. E debere nhazi amụma ahụ na aha ‘Onyenwe anyị,’ ma jiri ‘ụlọ’ mee ihe n’ụzọ ihe atụ dịka isi mmalite.
