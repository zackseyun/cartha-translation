id: HEB.8.3
reference: Hebrews 8:3
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: πᾶς γὰρ ἀρχιερεὺς εἰς τὸ προσφέρειν δῶρά τε καὶ θυσίας καθίσταται· ὅθεν ἀναγκαῖον ἔχειν τι καὶ τοῦτον ὃ προσενέγκῃ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/003.yaml
  text: For every high priest is appointed to offer both gifts and sacrifices[a]; therefore it is necessary for this one also to have something that he may offer.
translation:
  language: ig
  text: N’ihi na a na-ahọpụta onyeisi nchụàjà ọ bụla ka o nye onyinye na àjà; ya mere, ọ dị mkpa ka onye a kwa[a] nwee ihe ọ ga-enye.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ka ya onwe ya kwa nwee ihe ọ ga-enye.” Okwu Grik ahụ akpọghị onye a aha n’ahịrịokwu; n’ihe gbara ya gburugburu, ọ na-ezo aka na Jizọs dịka onyeisi nchụàjà.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς γὰρ ἀρχιερεὺς
  choice: N’ihi na ... onyeisi nchụàjà ọ bụla
  rationale: “Onyeisi nchụàjà ọ bụla” na-egosipụta echiche nkesa nke πᾶς ya na aha otu ihe, ebe “N’ihi na” na-egosipụta njikọ nkọwa nke γάρ na amaokwu bu ụzọ.
- source_word: εἰς τὸ προσφέρειν
  choice: ka o weta ... ma chụọ
  rationale: Nhazi εἰς na infinitive na-egosi nzube. E kewara ngwaa ahụ ụzọ abụọ n’Igbo ka okwu gbasara iweta onyinye na ịchụ àjà dịrị ndị na-agụ ya mfe ma bụrụ nke e ji eme ihe n’asụsụ Igbo.
- source_word: δῶρά τε καὶ θυσίας
  choice: onyinye ma ... àjà
  rationale: E debere δῶρα na θυσίαι dịka ụdị abụọ dị iche iche n’ọrụ nchụàjà; “ma” na-ejikọta ha dịka τε καὶ si eme.
- source_word: καθίσταται
  choice: a na-ahọpụta
  rationale: N’ọnọdụ a, ngwaa passive a na-ekwu maka ịhọpụta ma ọ bụ idobe mmadụ n’ọrụ onyeisi nchụàjà. Usoro “a na-ahọpụta” na-egosikwa na nke a bụ ụkpụrụ izugbe.
- source_word: ὅθεν
  choice: ya mere
  rationale: Okwu a na-ewebata ihe a na-ekwubi site n’ihe e kwuru tupu ya.
- source_word: ἀναγκαῖον ἔχειν
  choice: ọ dị mkpa ... nwee
  rationale: Nke a bụ ụzọ Igbo doro anya ma dị ndụ isi kwupụta mkpa nke ihe ahụ.
- source_word: τι
  choice: ihe
  rationale: “Ihe” na-edebe onyinye ahụ dịka ihe a na-akọwaghị kpọmkwem, dịka nnọchiaha na-enweghị nkọwa τι si mee.
- source_word: καὶ τοῦτον
  choice: onye a kwa
  rationale: “Onye a” na-edebe ike demonstrative nke τοῦτον, ebe “kwa” na-anọchi καί, n’agbanyeghị na ihe gbara amaokwu ahụ gburugburu na-egosi na ọ bụ Jizọs ka a na-ekwu maka ya.
- source_word: ὃ προσενέγκῃ
  choice: ihe ọ ga-enye
  rationale: Nkebi a na-egosi ihe dịịrị onye ahụ iji nye dịka onyinye. “Ọ ga-enye” na-egosipụta omume e bu n’obi n’Igbo na-enweghị ịkọwa ihe ahụ karịa ka Grik mere.
theological_decisions:
- issue: Onye καὶ τοῦτον (“onye a kwa”) na-ezo aka na ya
  choice: E debere “onye a kwa” n’ahịrịokwu, ebe nkọwa ala peeji na-egosi na ihe gbara ya gburugburu na-ekwu maka Jizọs dịka onyeisi nchụàjà.
  alternative: Itinye “Jizọs” ma ọ bụ “Kraịst” kpọmkwem n’ahịrịokwu.
  rationale: Ihe gbara amaokwu ahụ gburugburu mere onye a na-ekwu maka ya doo anya, ma Grik n’onwe ya ji demonstrative mee ihe. Nhọrọ a na-ezere itinye aha na-adịghị n’ahịrịokwu ma na-enyere onye na-agụ ya aka site na nkọwa ala peeji.
- issue: Okwu gbasara ofufe na ịchụ àjà
  choice: E debere “onyinye” na “àjà” dịka ụdị abụọ dị iche iche.
  alternative: Ijikọta ha dịka “onyinye àjà” ma ọ bụ ịkọwa ha dịka àjà Kraịst ji onwe ya chụọ.
  rationale: Amaokwu ahụ kwuru ụkpụrụ izugbe banyere ọrụ onyeisi nchụàjà; ọ naghị akọwa n’ebe a kpọmkwem ihe Jizọs nyere. Ya mere, nsụgharị ahụ anaghị etinye nkọwa nkà mmụta okpukpe karịrị ihe ederede kwuru.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. “Onyeisi nchụàjà” na “àjà” na-edebe okwu ofufe dị mkpa, ebe nhazi “weta onyinye ma chụọ àjà” na-eme ka ahịrịokwu ahụ bụrụ Igbo e kere eke.
