  text: ὅτι ἵλεως ἔσομαι ταῖς ἀδικίαις αὐτῶν, καὶ τῶν ἁμαρτιῶν ⸀αὐτῶν οὐ μὴ μνησθῶ ἔτι.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/012.yaml
  text: For I will be merciful toward their unrighteousness[b][a], and I will remember their sins no more.
translation:
  language: ig
  text: N’ihi na m ga-enwe ebere n’ebe ajọ omume ha dị,[a] agaghịkwa m echeta mmehie ha ọzọ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, ‘m ga-adị ebere n’ebe ikpe na-ezighị ezi ha dị.’ Okwu Grik ἀδικίαις nwere ike ịpụta omume ọjọọ ma ọ bụ ikpe na-ezighị ezi.
    reason: lexical_alternative
  - marker: b
    text: N’ụzọ okwu si dị kpọmkwem, ‘agaghị m echeta mmehie ha ọzọ ma ọlị.’ Nke a bụ akpaalaokwu ọgbụgba ndụ nke na-egosi mgbaghara zuru ezu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: N’ihi na
  rationale: Ọ na-ewebata ihe mere nkwa ọgbụgba ndụ dị n’ihu ya ji guzosie ike; ‘N’ihi na’ na-egosipụta njikọ nkọwa ahụ nke ọma n’Igbo.
- source_word: ἵλεως ἔσομαι
  choice: m ga-emere ... ebere
  rationale: Akpaalaokwu Igbo a na-egosipụta ọnọdụ obi ebere na mgbaghara nke ἵλεως, ma dịkwa mfe ma bụrụ nke ebumpụta ụwa karịa nsụgharị okwu n’otu n’otu.
- source_word: ταῖς ἀδικίαις αὐτῶν
  choice: ajọ omume ha
  rationale: Ụdị ọtụtụ nke ἀδικία nwere ike izo aka n’omume ọjọọ ma ọ bụ ikpe na-ezighị ezi; ‘ajọ omume ha’ na-edobe echiche omume ọjọọ na ọdịdị ya dịka ihe ndị e mere.
- source_word: καὶ
  choice: -kwa
  rationale: Mgbakwunye ‘-kwa’ na ngwaa nke abụọ na-ejikọta ahịrịokwu abụọ ahụ n’ụzọ Igbo si ekwu okwu nke ọma.
- source_word: τῶν ἁμαρτιῶν αὐτῶν
  choice: mmehie ha
  rationale: ‘Mmehie’ bụ okwu Igbo a na-ejikarị akọwa ἁμαρτίαι, ma ọ nwere ike ịgụnye ọtụtụ mmehie dịka ihe gbara ya gburugburu si dị.
- source_word: οὐ μὴ μνησθῶ ἔτι
  choice: agaghịkwa m echeta ... ọzọ
  rationale: ‘Agaghị ... ọzọ’ na-egosipụta ngọnarị siri ike nke οὐ μή yana echiche nke ἔτι, n’Igbo dị ire ma na-edobe akpaalaokwu Akwụkwọ Nsọ ahụ.
theological_decisions:
- issue: Ihe ‘agaghị m echeta mmehie ha ọzọ’ pụtara
  choice: E debere akpaalaokwu ọgbụgba ndụ ahụ n’isiokwu n’onwe ya, nke na-egosi mgbaghara zuru ezu na ịghara ijide mmehie ha megide ha.
  alternative: Ịkọwa ya dịka Chineke chefuru mmehie ndị ahụ kpamkpam n’ihe ọmụma ya.
  rationale: Isiokwu Grik na-eji asụsụ nke ‘icheta’ eme ihe n’enweghị nkọwa ọzọ. Nsụgharị ahụ ekwesịghị iwepụ esemokwu nkà mmụta okpukpe dị na ya; ihe odide ala peeji na-akọwa ọrụ akpaalaokwu ahụ n’ọgbụgba ndụ n’enweghị ịgbanwe isiokwu.
translation_notes:
  register: Igbo Izugbe dị ugbu a, dị ùgwù ma dị mfe nghọta. E jiri ‘emere ... ebere’ mee ka ἵλεως bụrụ akpaalaokwu Igbo ebumpụta ụwa, ma debe ‘echeta ... ọzọ’ iji chekwaa oyiyi na esemokwu dị n’asụsụ isi mmalite.
