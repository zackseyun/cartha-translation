  source_fidelity: The translation accurately represents the conditional-inferential force of Εἰ γὰρ with “N’ihi na ọ bụrụ na,” the implied referent “ọgbụgba ndụ” in ἡ πρώτη ἐκείνη, the contrary-to-fact result in “a garaghị achọ,” and the elliptical “maka nke abụọ.” “Enweghị ihe a ga-ata ya ụta” faithfully conveys ἄμεμπτος without specifying the nature or location of the fault. “Ohere” is a valid contextual rendering of τόπος in this idiom, and the footnote supplies the more literal “ebe.”
