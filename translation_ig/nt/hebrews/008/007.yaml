id: HEB.8.7
reference: Hebrews 8:7
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Εἰ γὰρ ἡ πρώτη ἐκείνη ἦν ἄμεμπτος, οὐκ ἂν δευτέρας ἐζητεῖτο τόπος·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/007.yaml
  text: For if that first covenant had been faultless[b][a], no place would have been sought for a second.
translation:
  language: ig
  text: N’ihi na ọ bụrụ na ọgbụgba ndụ mbụ ahụ[a] enweghị ihe a ga-ata ya ụta, a garaghị achọ ohere[b] maka nke abụọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’asụsụ Grik, ọ bụ n’ụzọ nkịtị, “nke mbụ ahụ”; e tinyere “ọgbụgba ndụ” site n’ihe amaokwu ndị gbara ya gburugburu na-ekwu.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “a garaghị achọ ebe maka nke abụọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰ γὰρ
  choice: N’ihi na ọ bụrụ na
  rationale: “N’ihi na” na-egosi na amaokwu a na-akọwa arụmụka gara aga, ebe “ọ bụrụ na” na-edobe ọnọdụ echiche dị n’okwu Grik.
- source_word: ἡ πρώτη ἐκείνη
  choice: ọgbụgba ndụ mbụ ahụ
  rationale: N’asụsụ Grik, okwu a pụtara n’ụzọ nkịtị “nke mbụ ahụ,” ma ihe a na-ekwu maka ya site n’amaokwu ndị gbara ya gburugburu bụ ọgbụgba ndụ. Ịkpọ ya aha na-eme ka Igbo doo anya.
- source_word: ἦν ἄμεμπτος
  choice: enweghị ihe a ga-ata ya ụta
  rationale: Nke a na-egosipụta echiche nke ịbụ onye ma ọ bụ ihe na-enweghị ihe e ji ata ya ụta, n’ebughị ụzọ kọwaa ebe ụta ahụ dị.
- source_word: οὐκ ἂν ... ἐζητεῖτο
  choice: a garaghị achọ
  rationale: Ụdị a na Igbo na-egosi ihe na-agaghị eme ma ọ bụrụ na ọnọdụ e kwuru mezuru, ya mere ọ na-edobe ike nke ọnọdụ na-abụghị eziokwu n’arụmụka ahụ.
- source_word: τόπος
  choice: ohere
  rationale: N’okwu a, τόπος nwere ike ịpụta ohere ma ọ bụ ọnọdụ e nyere ihe ọzọ, ọ bụghị naanị ebe a na-anọ. “Ohere” bụ okwu Igbo doro anya ma kwekọọ n’idiọm ahụ.
- source_word: δευτέρας
  choice: maka nke abụọ
  rationale: Dị ka Grik si mee, a hapụrụ aha “ọgbụgba ndụ” n’azụ “nke abụọ,” ebe e kwuworị ya na mmalite ahịrịokwu ahụ.
theological_decisions:
- issue: Ịkpọ “ọgbụgba ndụ” aha n’agbanyeghị na e kwughị aha ahụ ọzọ na Grik
  choice: ọgbụgba ndụ mbụ ahụ
  alternative: nke mbụ ahụ
  rationale: Ihe gbara amaokwu a gburugburu na-egosi na “nke mbụ ahụ” bụ ọgbụgba ndụ. Ịkpọ ya aha na-eme ka okwu ahụ doo anya n’Igbo n’etinyeghị ozizi ọhụrụ.
- issue: Ihe ntụpọ ma ọ bụ ụta dị n’ọgbụgba ndụ mbụ pụtara
  choice: enweghị ihe a ga-ata ya ụta
  alternative: zuru oke n’enweghị ntụpọ
  rationale: Nsụgharị a anaghị ekpebi ma nsogbu ahụ ọ dị n’ọgbụgba ndụ ahụ n’onwe ya, n’otú e si jeere ya ozi, ma ọ bụ n’ebe ndị nọ n’okpuru ya nọ. Ọ na-edobe esemokwu echiche nke amaokwu ahụ ruo mgbe amaokwu na-esote kọwakwuru ya.
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-agbaso usoro arụmụka nke Grik, ma jiri “ohere” mee ka idiọm ahụ bụrụ ihe onye Igbo nkịtị ga-aghọta.
