id: HEB.8.5
reference: Hebrews 8:5
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: (οἵτινες ὑποδείγματι καὶ σκιᾷ λατρεύουσιν τῶν ἐπουρανίων, καθὼς κεχρημάτισται Μωϋσῆς μέλλων ἐπιτελεῖν τὴν σκηνήν, Ὅρα γάρ, φησίν, ποιήσεις πάντα κατὰ τὸν τύπον τὸν δειχθέντα σοι ἐν τῷ ὄρει)·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/005.yaml
  text: who serve a copy and shadow of the heavenly things[a], just as Moses was divinely instructed when he was about to erect the tabernacle; for he says[b], “See that you make everything according to the pattern shown to you on the mountain.”
translation:
  language: ig
  text: ndị na-arụ ọrụ nsọ n’oyiyi na onyinyo nke ihe ndị dị n’eluigwe, dị nnọọ ka Chineke nyere Mosis ntụziaka[a] mgbe ọ na-achọ ịrụcha ụlọikwuu ahụ[b]; n’ihi na ọ na-ekwu, “Hụ na i mee ihe niile dịka ụkpụrụ ahụ e gosiri gị n’elu ugwu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Chineke dọrọ Mosis aka ná ntị”; okwu Grik ahụ nwekwara ike imesi ịdọ aka ná ntị ma ọ bụ ịdụ ọdụ sitere n’aka Chineke ike.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ịrụ ụlọikwuu ahụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἵτινες
  choice: ndị
  rationale: Ọ na-ejikọta nkebiokwu a na ndị nchụàjà e kwuru okwu ha tupu ya; ‘ndị’ bụ ụzọ Igbo dị mfe ma doo anya isi mee nke a.
- source_word: ὑποδείγματι
  choice: ihe bụ oyiyi
  rationale: N’ebe a, okwu ahụ na-egosi ihe dị n’ụwa nke yiri ihe dị n’eluigwe ma dabere na ya; ‘ihe bụ oyiyi’ na-echekwa njikọ ahụ n’ebughị ụzọ kọwaa ya gabiga ókè.
- source_word: σκιᾷ
  choice: onyinyo
  rationale: ‘Onyinyo’ na-echekwa ihe atụ okwu Grik nke na-egosi ihe dị adị ma na-erughị ihe nke eluigwe ọ na-anọchi anya ya.
- source_word: λατρεύουσιν
  choice: na-arụ ọrụ nsọ
  rationale: Okwu a na-ekwu maka ije ozi okpukpe n’ebe nsọ; ‘ọrụ nsọ’ na-eme ka echiche ahụ doo anya n’Igbo.
- source_word: τῶν ἐπουρανίων
  choice: nke ihe ndị dị n’eluigwe
  rationale: Nke a na-echekwa obosara okwu Grik ahụ n’emeghị ka ọ bụrụ naanị ebe ma ọ bụ kọwaa ya kpọmkwem dịka ‘ihe ndị bụ eziokwu.’
- source_word: κεχρημάτισται
  choice: Chineke nyere Mosis ntụziaka
  rationale: Ọ na-egosi ozi ma ọ bụ ntụziaka sitere n’aka Chineke. Nsụgharị a na-egosipụta ma isi iyi nke ozi ahụ ma nzube nduzi ya, ebe a na-edebe echiche ịdọ aka ná ntị na nkọwa ala peeji.
- source_word: μέλλων
  choice: mgbe ọ na-achọ
  rationale: Ọ na-egosi na Mosis nọ na njikere ime ọrụ ahụ n’oge na-adịghị anya.
- source_word: ἐπιτελεῖν
  choice: ịrụ
  rationale: N’ihe gbasara ụlọikwuu ahụ, ‘ịrụ’ bụ okwu Igbo nkịtị nke na-ekpuchi iwulite ma ọ bụ mezue ọrụ ahụ; a na-edebe ‘ịrụcha’ dịka nhọrọ ọzọ na nkọwa ala peeji.
- source_word: σκηνήν
  choice: ụlọikwuu ahụ
  rationale: Nke a bụ okwu Igbo doro anya maka ebe nsọ a na-akwagharị akwagharị nke oge Mosis.
- source_word: Ὅρα
  choice: Hụ na
  rationale: Ọ na-echekwa iwu siri ike dị n’okwu ahụ ma na-ada ka Igbo e ji enye ntụziaka.
- source_word: ποιήσεις πάντα
  choice: i mere ihe niile
  rationale: Ọdịdị a na-arụ ọrụ dịka iwu n’Igbo ma na-ekwupụta na a ga-eme ihe niile a nyere n’iwu.
- source_word: τύπον
  choice: ụkpụrụ
  rationale: ‘Ụkpụrụ’ na-egosi ihe nlereanya e nyere Mosis ka o soro rụọ ụlọikwuu ahụ.
theological_decisions:
- issue: Mmekọrịta dị n’etiti ebe nsọ dị n’ụwa na ihe ndị dị n’eluigwe
  choice: ihe bụ oyiyi na onyinyo nke ihe ndị dị n’eluigwe
  alternative: ihe atụ na onyinyo nke ezi ihe ndị dị n’eluigwe
  rationale: Nhọrọ a na-echekwa echiche na ebe nsọ dị n’ụwa kwekọrọ n’ihe dị n’eluigwe ma dịkwa ala karịa ya, n’akọwaghị kpọmkwem ụdị mmekọrịta ahụ n’ụzọ otu ozizi.
- issue: Ike okwu κεχρημάτισται
  choice: Chineke nyere Mosis ntụziaka
  alternative: Chineke dọrọ Mosis aka ná ntị
  rationale: Okwu Grik ahụ nwere ike igosi ozi Chineke, ntụziaka, ma ọ bụ ịdọ aka ná ntị. Isi nsụgharị ahụ na-edebe echiche sara mbara nke ntụziaka sitere n’aka Chineke, ebe nkọwa ala peeji na-echekwa echiche ịdọ aka ná ntị.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta mee ya. ‘Ọrụ nsọ,’ ‘ụlọikwuu,’ na ‘ụkpụrụ’ na-eme ka ọnọdụ ofufe na iwu Chineke doo anya n’enweghị okwu ụka nke otu òtù pụrụ iche.
