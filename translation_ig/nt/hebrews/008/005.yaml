- from: ndị na-arụ ọrụ nsọ n’ihe bụ oyiyi na onyinyo nke ihe ndị dị n’eluigwe, dị nnọọ ka Chineke nyere Mosis ntụziaka[a] mgbe ọ na-achọ ịrụ ụlọikwuu ahụ[b]; n’ihi na ọ na-ekwu, “Hụ na i mere ihe niile dịka ụkpụrụ ahụ e gosiri gị n’elu ugwu.”
  to: ndị na-arụ ọrụ nsọ n’oyiyi na onyinyo nke ihe ndị dị n’eluigwe, dị nnọọ ka Chineke nyere Mosis ntụziaka[a] mgbe ọ na-achọ ịrụcha ụlọikwuu ahụ[b]; n’ihi na ọ na-ekwu, “Hụ na i mee ihe niile dịka ụkpụrụ ahụ e gosiri gị n’elu ugwu.”
