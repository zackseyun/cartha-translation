  text: εἰ μὲν ⸀οὖν ἦν ἐπὶ γῆς, οὐδ’ ἂν ἦν ἱερεύς, ⸀ὄντων τῶν προσφερόντων κατὰ ⸀νόμον τὰ δῶρα·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/004.yaml
  text: If he were on earth[a], he would not even be a priest, since there are those who offer the gifts according to the law.
translation:
  language: ig
  text: A sị na ọ nọ n’ụwa, ọ garaghị abụdị onye nchụàjà, ebe ọ bụ na e nwere ndị na-eweta onyinye[a] dị ka iwu ahụ si dị.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ihe àjà.” N’asụsụ Grik, okwu ahụ bụ “onyinye,” bụ́ okwu a na-ejikarị eme ihe banyere àjà n’ebe a.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ μὲν οὖν
  choice: Ya mere, a sị na
  rationale: “Ya mere” na-egosi njikọ nkwubi okwu nke οὖν, ebe “a sị na” na-ebute ọnọdụ e chere n’echiche n’Igbo dị ugbu a ma dị mfe nghọta.
- source_word: ἦν ἐπὶ γῆς
  choice: ọ nọ n’ụwa
  rationale: Nke a na-egosi ọnọdụ ya n’ụwa, nke e ji tụnyere ọnọdụ eluigwe n’okwu ndị gbara amaokwu a gburugburu.
- source_word: οὐδ’ ἂν ἦν ἱερεύς
  choice: ọ garaghị abụdị onye nchụàjà
  rationale: “Garaghị” na-egosi ọnọdụ na-abụghị eziokwu a tụrụ n’uche, “-dị” na-echekwa ike nke οὐδέ, “onye nchụàjà” bụkwa okwu doro anya maka ọrụ ἱερεύς.
- source_word: ὄντων τῶν προσφερόντων
  choice: ebe ọ bụ na e nwere ndị na-eweta
  rationale: Nkebi a na-enye ihe kpatara okwu bu ya ụzọ; “ndị na-eweta” na-echekwa echiche nke iwebata ma ọ bụ inye ihe n’ọrụ ofufe.
- source_word: κατὰ νόμον
  choice: dị ka iwu ahụ si dị
  rationale: Nke a bụ ụzọ Igbo sitere n’okike isi kwuo na ihe ahụ kwekọrọ n’iwu ahụ na-achị usoro ịchụ àjà.
- source_word: τὰ δῶρα
  choice: onyinye
  rationale: “Onyinye” na-esochi isi okwu δῶρα n’ụzọ kpọmkwem, ma ihe gbara ya gburugburu na-egosi na ọ bụ onyinye a na-eweta n’ọrụ ịchụ àjà.
theological_decisions:
- issue: Onye a na-ekwu maka ya n’ọnọdụ ahụ
  choice: E tinyere “ọ,” nke na-ezo aka n’ebe Jizọs/Mesaịa nọ n’okwu ndị gbara ya gburugburu.
  alternative: Ịhapụ onye a na-ekwu maka ya n’amaghị ama.
  rationale: Ọ bụ ezie na Grik ekwughị aha onye ahụ ọzọ, ụtọasụsụ Igbo chọrọ ka e gosipụta ya; amaokwu ndị gbara ya gburugburu na-eme ka onye ọ bụ doo anya.
- issue: Ike nke ọnọdụ e kwuru
  choice: “A sị na ọ nọ n’ụwa, ọ garaghị abụdị...”
  alternative: “Ọ bụrụ na ọ nọ n’ụwa, ọ gaghị abụ...”
  rationale: Nhazi εἰ + imperfect na ἄν + imperfect na-egosi ọnọdụ megidere ihe dị adị; “a sị na ... garaghị” na-echekwa nke a n’Igbo n’etinyeghị nkọwa ozizi ọzọ.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “Onye nchụàjà” na “iwu ahụ” na-edobe ọnọdụ ofufe na usoro iwu ahụ n’enweghị itinye nkọwa otu ụka.
