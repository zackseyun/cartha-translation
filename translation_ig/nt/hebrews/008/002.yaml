  rationale: The revision removes the added sense ‘different/various’ from the cultic plural, makes the adjective ‘true/genuine’ modify ‘tabernacle’ naturally in Igbo, and repairs the footnote for the tent-pitching image. It retains the Greek syntax and theological contrast without adding interpretive claims.
