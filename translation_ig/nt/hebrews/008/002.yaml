  text: τῶν ἁγίων λειτουργὸς καὶ τῆς σκηνῆς τῆς ἀληθινῆς, ἣν ἔπηξεν ὁ κύριος, ⸀οὐκ ἄνθρωπος.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/002.yaml
  text: a minister of the holy places and of the true tabernacle[a], which the Lord set up[b], not man.
translation:
  language: ig
  text: onye na-eje ozi n’ebe nsọ nakwa n’ezi ụlọikwuu ahụ[a], nke Onyenwe anyị guzobere[b], ọ bụghị mmadụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ebe ofufe”; okwu Grik ahụ nwere ike izo aka n’ebe nsọ, ọ bụghị ndị nsọ.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “nke Onyenwe anyị tọrọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τῶν ἁγίων
  choice: ebe nsọ dị iche iche
  rationale: N’ọnọdụ okwu gbasara ofufe na ọrụ onyeisi nchụaja dị na Ndị Hibru, nkebi a na-ezo aka n’ebe nsọ nke eluigwe, ọ bụghị ndị nsọ. Nsụgharị a na-edebekwa echiche nke ụdị ọtụtụ dị na Grik.
- source_word: λειτουργὸς
  choice: onye na-eje ozi
  rationale: Nke a na-egosi onye na-arụ ọrụ ofufe ma ọ bụ ọrụ nchụaja. Okwu a bụ nke mmadụ nkịtị ga-aghọta ma ka na-echekwa ọnọdụ ofufe ahụ.
- source_word: σκηνῆς
  choice: ụlọikwuu
  rationale: Ọ na-akpalite ụlọikwuu Mozis na ihe nke eluigwe kwekọrọ na ya; “ụlọikwuu” na-echekwa oyiyi ahụ nke ọma.
- source_word: ἀληθινῆς
  choice: ahụ bụ eziokwu
  rationale: Nke a na-echekwa echiche nke ihe bụ nke bụ́ isi ma kwekọọ n’ezi ọnọdụ, n’etinyeghị nkọwa ọzọ n’ime amaokwu ahụ.
- source_word: ἔπηξεν
  choice: guzobere
  rationale: Ngwaa ahụ pụtara ịkwụnye ma ọ bụ ịtọ ụlọikwuu. “Guzobere” bụ okwu Igbo doro anya ma dabara n’echiche nke Onyenwe anyị mere ka ọ dị.
- source_word: ὁ κύριος
  choice: Onyenwe anyị
  rationale: Nke a bụ nsụgharị Igbo a na-ejikarị eme κύριος dịka aha nsọpụrụ n’ọnọdụ a.
- source_word: οὐκ ἄνθρωπος
  choice: ọ bụghị mmadụ
  rationale: Ọ na-echekwa ọdịiche dị mkpirikpi n’etiti ihe Onyenwe anyị mere na ihe mmadụ mere, ebe “mmadụ” nwere ike ịnọchite anya mmadụ ọ bụla.
theological_decisions:
- issue: Ihe “τῶν ἁγίων” na-ezo aka na ya na njikọ ya na ebe nsọ nke eluigwe
  choice: ebe nsọ dị iche iche n’ọnọdụ ofufe nke eluigwe
  alternative: ndị nsọ; ebe nsọ
  rationale: Ndị Hibru 8:1–5 na-ekwu maka ọrụ Mesaịa dịka Onyeisi Nchụaja n’ebe nsọ nke eluigwe. Nsụgharị a na-echekwa usoro ụlọikwuu na ebe nsọ ma zere ime ka okwu ahụ yie ozi a na-ejere ndị mmadụ.
- issue: Ike izugbe nke ἄνθρωπος
  choice: mmadụ n’ozuzu ya, n’ụzọ e ji ya tụnyere Onyenwe anyị
  alternative: otu nwoke
  rationale: Isi okwu bụ ọdịiche n’etiti onye guzobere ụlọikwuu ahụ—Onyenwe anyị—na mmadụ; ọ bụghị ọdịiche metụtara nwoke na nwanyị.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E debere asụsụ nke ofufe na ụlọikwuu, tinyere ụdị ọtụtụ nke τῶν ἁγίων, ma zere okwu teknụzụ na nkọwa ụka pụrụ iche.
