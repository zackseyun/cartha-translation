id: HEB.8.10
reference: Hebrews 8:10
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὅτι αὕτη ἡ διαθήκη ἣν διαθήσομαι τῷ οἴκῳ Ἰσραὴλ μετὰ τὰς ἡμέρας ἐκείνας, λέγει κύριος, διδοὺς νόμους μου εἰς τὴν διάνοιαν αὐτῶν, καὶ ἐπὶ καρδίας αὐτῶν ἐπιγράψω αὐτούς, καὶ ἔσομαι αὐτοῖς εἰς θεόν καὶ αὐτοὶ ἔσονταί μοι εἰς λαόν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/010.yaml
  text: 'For this is the covenant that I will make with the house of Israel after those days[a], says the Lord: putting my laws into their minds, and I will write them on their hearts; and I will be their God, and they will be my people.'
translation:
  language: ig
  text: 'N’ihi na nke a bụ ọgbụgba ndụ m ga-eso ụlọ Izrel gbaa mgbe ụbọchị ndị ahụ gasịrị[a], ka Onyenwe anyị kwuru: site n’itinye iwu m n’uche ha, m ga-edekwa ha n’obi ha; m ga-abụ Chineke ha, ha ga-abụkwa ndị m.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ikwu ya n’ụzọ dị larịị karị: “M ga-etinye iwu m n’uche ha, m ga-edekwa ha n’obi ha.” N’asụsụ Grik, e ji participle (“na-etinye/na-enye”) soro ngwaa ọdịnihu (“m ga-ede”).'
    reason: lexical_alternative
lexical_decisions:
- source_word: διαθήκη
  choice: ọgbụgba ndụ
  rationale: Nke a bụ okwu Igbo a na-aghọta nke ọma maka nkwekọrịta siri ike nke Chineke na ndị ya; ọ na-echekwa njikọ ya na Jeremaịa karịa okwu gbasara ikike e dere tupu ọnwụ.
- source_word: διαθήσομαι
  choice: m ga-agba n’etiti mụ na
  rationale: N'Igbo, ‘ịgba ọgbụgba ndụ n’etiti’ bụ ụzọ doro anya e si kwuo ime ka ọgbụgba ndụ dịrị n’etiti akụkụ abụọ, n’enweghị ime ka ụlọ Izrel bụrụ onye malitere ya.
- source_word: οἴκῳ Ἰσραήλ
  choice: ụlọ Izrel
  rationale: Ọ na-echekwa okwu amụma ochie nke na-ele Izrel anya dịka otu ụlọ ma ọ bụ otu agbụrụ jikọrọ ọnụ.
- source_word: μετὰ τὰς ἡμέρας ἐκείνας
  choice: mgbe ụbọchị ndị ahụ gasịrị
  rationale: Ọ bụ nsụgharị eke n’Igbo nke na-echekwa usoro oge na ụda okwu amụma ahụ.
- source_word: κύριος
  choice: Onyenwe anyị
  rationale: Nke a bụ okwu Igbo a na-ejikarị asụgharị κύριος n’Agba Ọhụrụ, ma ọ dabara n’ọnọdụ ebe Onyenwe anyị bụ onye na-ekwu.
- source_word: διδοὺς
  choice: site n’itinye
  rationale: Ọ na-echekwa ọdịdị participle nke Grik ma gosipụta na nke a bụ ụzọ e si emezu ọgbụgba ndụ ahụ, kama ịgbanwe ya ozugbo ka ọ bụrụ ngwaa ọdịnihu ọzọ.
- source_word: νόμους
  choice: iwu
  rationale: ‘Iwu’ nwere ike ịbụ otu ma ọ bụ ọtụtụ n’Igbo dabere n’ọnọdụ; ebe nnọchiaha ‘ha’ na-esote na-egosi na ọtụtụ iwu ka a na-ekwu maka ha.
- source_word: διάνοιαν
  choice: uche
  rationale: ‘Uche’ na-egosi ebe mmadụ na-eche echiche ma na-aghọta ihe, ya mere ọ dabara nke ọma na διάνοια.
- source_word: ἐπὶ καρδίας αὐτῶν
  choice: n’obi ha
  rationale: Nke a bụ ụzọ Igbo si ekwu ihe e dere n’ime ndụ na mmụọ mmadụ, ma na-echekwa ihe oyiyi nke ide ihe n’obi.
- source_word: ἐπιγράψω
  choice: m ga-edekwa
  rationale: ‘Ga-ede’ na-echekwa ngwaa ọdịnihu; ‘-kwa’ na-ejikọta ya nke ọma na ahịrịokwu gara aga n’Igbo.
- source_word: ἔσομαι αὐτοῖς εἰς θεόν
  choice: m ga-abụ Chineke ha
  rationale: Ọ bụ usoro okwu ọgbụgba ndụ doro anya ma bụrụkwa Igbo eke.
- source_word: αὐτοὶ ἔσονταί μοι εἰς λαόν
  choice: ha ga-abụkwa ndị nke m
  rationale: Nke a na-egosipụta na ha bụ ndị Chineke n’ụzọ eke n’Igbo, ma na-echekwa mmekọrịta nke ọgbụgba ndụ ahụ.
theological_decisions:
- issue: Ichekwa njikọ nke okwu a na ọgbụgba ndụ e kwere ná Jeremaịa
  choice: E ji okwu ndị dịka ‘ụlọ Izrel,’ ‘iwu m,’ ‘obi ha,’ ‘Chineke ha,’ na ‘ndị nke m.’
  alternative: Ịsụgharị ya n’ụzọ dị larịị nke ga-ewepụ ọtụtụ n’ụda na usoro okwu amụma ochie ahụ.
  rationale: Ike nkà mmụta okpukpe nke amaokwu a sitere n’ịkpọghachi nkwa ọgbụgba ndụ Jeremaịa; ya mere, e kwesịghị ihichapụ njikọ ahụ.
- issue: Ma a ga-eme ka διδοὺς na ἐπιγράψω bụrụ ngwaa ọdịnihu abụọ
  choice: E chekwara participle ahụ dịka ‘site n’itinye ... m ga-edekwa.’
  alternative: ‘M ga-etinye iwu m n’uche ha, m ga-edekwa ha n’obi ha.’
  rationale: Grik nwere participle ‘na-etinye/na-enye’ tupu ngwaa ọdịnihu ‘m ga-ede.’ Nsụgharị bụ isi na-eme ka ọdịiche ahụ pụta, ebe nkọwa ala peeji na-enye usoro Igbo ka dị larịị karị.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. A hapụrụ ụda okwu ọgbụgba ndụ na njikọ ya na Jeremaịa ka ha pụta ìhè, ma e zere okwu ụka nke otu ngalaba pụrụ iche.
