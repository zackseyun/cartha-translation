source:
  edition: SBLGNT
  text: ἐν τῷ λέγειν Καινὴν πεπαλαίωκεν τὴν πρώτην, τὸ δὲ παλαιούμενον καὶ γηράσκον ἐγγὺς ἀφανισμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/013.yaml
  text: By saying[a], “new,” he has made the first obsolete[c][b]. And what is becoming obsolete and growing old is near to disappearing.
translation:
  language: ig
  text: N’ikwu[a], “ọhụrụ,”[b] o mewo ka nke mbụ bụrụ ihe ochie. Ihe na-aghọ ochie ma na-akawanye nká dị nso n’ịpụ n’anya.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịtụgharị ya, “Site n’ikwu” ma ọ bụ “Mgbe o kwuru.”
    reason: lexical_alternative
  - marker: b
    text: N’asụsụ Grik, ọ bụ naanị “ọhụrụ” ka e hotara. Ọ na-ezo aka n’okwu ahụ bụ “ọgbụgba ndụ ọhụrụ” dị na nhota Jeremaya 31:31, na Hibru 8:8.
    reason: cross_reference
  - marker: c
    text: A pụkwara ịsụ ya, “ifụ n’anya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῷ λέγειν
  choice: Site n’ịsị
  rationale: Nkebiokwu a nwere ike igosi ọnọdụ ma ọ bụ ụzọ e si mee ihe. “Site n’ịsị” na-egosipụta nke ọma na ịkpọ ọgbụgba ndụ ahụ “ọhụrụ” bụ ihe mere e ji lee nke mbụ anya dị ka nke ochie.
- source_word: Καινὴν
  choice: “ọhụrụ”
  rationale: N’asụsụ Grik, ọ bụ naanị nkọwa ahụ bụ “ọhụrụ” ka e hotara; a hapụrụ aha “ọgbụgba ndụ” n’ihi na amaokwu ndị bu ụzọ emeela ka ihe a na-ekwu doo anya.
- source_word: πεπαλαίωκεν
  choice: o meela nke mbụ ka ọ bụrụ nke ochie
  rationale: Oge ngwaa Grik a na-egosi ihe e mecharala nke nsonaazụ ya ka dị ugbu a. Nsụgharị a na-edobe ihe oyiyi nke ime ka ihe bụrụ ochie, ma zere itinye nkọwa ozizi karịrị ihe ederede kwuru.
- source_word: τὴν πρώτην
  choice: nke mbụ
  rationale: Nkọwa a na-anọchi aha, na-ezo aka n’ọgbụgba ndụ mbụ site n’ihe ndị gbara ya gburugburu. A naghị agbakwụnye aha ahụ n’ahịrị bụ isi.
- source_word: τὸ ... παλαιούμενον
  choice: Ihe ahụ na-aghọ ochie
  rationale: Ngwaa nkọwa nke oge ugbu a na-egosi usoro na-aga n’ihu, ya mere “na-aghọ ochie” na-echekwa echiche ahụ.
- source_word: γηράσκον
  choice: na-aka nka
  rationale: Nke a na-echekwa ihe atụ nke ihe na-eto nká ma na-adịkwa ka okwu Igbo nkịtị.
- source_word: ἐγγὺς
  choice: dị nso
  rationale: Ọ na-egosi ịdị nso n’ihe ga-eme.
- source_word: ἀφανισμοῦ
  choice: ịpụ n’anya
  rationale: Aha Grik a pụtara ịla ma ọ bụ ịpụ n’anya. Nhọrọ a bụ Igbo doro anya ma na-echekwa echiche ahụ n’etinyeghị “mbibi,” nke nwere ike ịdị ike karịa okwu Grik n’ebe a.
theological_decisions:
- issue: Onye a na-aghọta dị ka isiokwu nke “Site n’ịsị, ‘ọhụrụ’”
  choice: E jiri nnọchiaha “o” mee ihe, na-akpọghị onye ahụ Chineke ma ọ bụ Akwụkwọ Nsọ kpọmkwem.
  alternative: “Mgbe Chineke kwuru” ma ọ bụ “Mgbe Akwụkwọ Nsọ kwuru.”
  rationale: Asụsụ Grik ekwughị isiokwu ahụ kpọmkwem, kama ọ na-ezo azụ n’onye na-ekwu okwu na nhota Jeremaya. Nnọchiaha ahụ na-echekwa mkpụmkpụ na nghọta abụọ ahụ nke ederede.
- issue: Ọnọdụ ọgbụgba ndụ mbụ
  choice: “o meela nke mbụ ka ọ bụrụ nke ochie”
  alternative: “o meela ka nke mbụ gharazie ịdị ire” ma ọ bụ “gharazie ịba uru.”
  rationale: Ederede ahụ na-egosi na nke mbụ aghọọla ochie n’ihi nke ọhụrụ, ma nhọrọ a anaghị etinye nkwupụta ozizi sara mbara banyere iwu ma ọ bụ uru ya nke amaokwu ahụ n’onwe ya na-ekwughị.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta mee ihe. E debere mkpụmkpụ nke Grik n’okwu “ọhụrụ” na “nke mbụ,” ebe ihe ndị gbara amaokwu ahụ gburugburu na-eme ka ọgbụgba ndụ a na-ekwu maka ya doo anya. “Ịpụ n’anya” na-echekwa echiche ἀφανισμός n’enweghị ikwubiga okwu ókè.
