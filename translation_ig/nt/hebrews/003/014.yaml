id: HEB.3.14
reference: Hebrews 3:14
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: μέτοχοι γὰρ ⸂τοῦ Χριστοῦ γεγόναμεν⸃, ἐάνπερ τὴν ἀρχὴν τῆς ὑποστάσεως μέχρι τέλους βεβαίαν κατάσχωμεν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/014.yaml
  text: For we have become sharers in the Messiah, if indeed we hold the beginning of our assurance firm to the end.
translation:
  language: ig
  text: N’ihi na anyị aghọwo ndị nwere òkè n’ime Mesaịa[a], ma ọ bụrụ n’ezie na anyị ejidesie mmalite nke ntụkwasị obi anyị[b] ike ruo ọgwụgwụ.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ndị sonyere n’ihe nke Mesaịa” ma ọ bụ “ndị na-ekere òkè n’ime Mesaịa.”
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, “nkwenye” ma ọ bụ “obi ike.” Okwu Grik a nwekwara ike ịpụta “ihe bụ́ eziokwu n’onwe ya” ma ọ bụ “ihe dị adị” n’ọnọdụ ụfọdụ.
    reason: lexical_alternative
  - marker: c
    text: 'N’ụzọ dị nso n’usoro okwu Grik: “ma ọ bụrụ n’ezie na anyị ejidesie mmalite nke ntụkwasị obi anyị ike ruo ọgwụgwụ.”'
    reason: structural_alternative
lexical_decisions:
- source_word: μέτοχοι
  choice: ndị ha na ... na-ekekọrịta òkè
  rationale: Nkebiokwu a na-egosi ndị sonyere ma nwee òkè n’ihe metụtara onye ọzọ; ọ bụ Igbo doro anya nke na-ezere okwu ochie ma na-echekwa echiche nke participation.
- source_word: γὰρ
  choice: N’ihi na
  rationale: Ọ na-ejikọta amaokwu a na ịdọ aka ná ntị gara aga dịka ihe kpatara ya ma ọ bụ nkọwa ya.
- source_word: τοῦ Χριστοῦ
  choice: Mesaịa
  rationale: Χριστός nọ ebe a dịka utu aha; “Mesaịa” na-egosipụta nke ahụ n’enweghị ime ya naanị aha mmadụ.
- source_word: γεγόναμεν
  choice: anyị aghọwo
  rationale: Ụdị perfect na-egosi ihe mere n’oge gara aga nke nsonaazụ ya ka dị ugbu a; “anyị aghọwo” na-echekwa echiche abụọ ahụ.
- source_word: ἐάνπερ
  choice: ma ọ bụrụ n’ezie
  rationale: Ọ na-echekwa ike e tinyere n’ọnọdụ ahụ karịa naanị “ma ọ bụrụ.”
- source_word: τὴν ἀρχὴν τῆς ὑποστάσεως
  choice: ntụkwasị obi anyị nwere site ná mmalite
  rationale: Nke a bụ ntụgharị Igbo ebumpụta ụwa nke na-ejikọta ἀρχή na ọnọdụ mbụ nke ὑπόστασις, ebe a ghọtara nke ikpeazụ dịka nkwenye ma ọ bụ ntụkwasị obi siri ike.
- source_word: μέχρι τέλους
  choice: ruo ọgwụgwụ
  rationale: Ọ na-egosi ịnọgide n’ụzọ ahụ ruo mgbe ihe ahụ zuru ezu.
- source_word: βεβαίαν κατάσχωμεν
  choice: anyị ejidesie ... ike
  rationale: “Ejidesie ... ike” na-enye echiche nke ijigide ihe n’ụzọ kwụsiri ike ma ghara ịhapụ ya.
theological_decisions:
- issue: Ọnọdụ e kwuru banyere ịnọgide ruo ọgwụgwụ
  choice: 'E debere ya dịka ezigbo ọnọdụ: “ma ọ bụrụ n’ezie na anyị ejidesie ... ike ruo ọgwụgwụ.”'
  alternative: Ịkọwa ya hoo haa dịka ihe akaebe na mmadụ sonyeburu, ma ọ bụ dịka nkwupụta na òkè mmadụ ga-adị naanị mgbe ọ nọgidere.
  rationale: Grik na-ekwu ọnọdụ n’ezie, ma ọ naghị ekpebi n’onwe ya esemokwu nkà mmụta okpukpe banyere ntachi obi, ịdapụ n’okwukwe, ma ọ bụ ihe akaebe nke nzọpụta.
- issue: Mmekọrịta genitive na μέτοχοι τοῦ Χριστοῦ
  choice: “ndị ha na Mesaịa na-ekekọrịta òkè”
  alternative: “ndị nwere òkè n’ime Mesaịa” ma ọ bụ “ndị Mesaịa na ha bụ ndị mmekọ”
  rationale: Nhọrọ ahụ na-echekwa echiche sara mbara nke isonye ma ọ bụ ikekọrịta òkè n’ihe metụtara Mesaịa, n’emeghị ka njikọ ahụ bụrụ nkọ karịa ka Grik si dị.
translation_notes:
  register: Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ “Mesaịa” dịka utu aha. Usoro okwu ahụ bụ nke Igbo ebumpụta ụwa, ebe ndetu ala na-echekwa ụzọ ọzọ e nwere isi ghọta ὑπόστασις na nhazi τὴν ἀρχὴν τῆς ὑποστάσεως.
