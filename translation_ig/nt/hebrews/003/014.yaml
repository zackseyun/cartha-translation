revisions:
- from: N’ihi na anyị aghọwo ndị ha na Mesaịa na-ekekọrịta òkè[a], ma ọ bụrụ n’ezie na anyị ejidesie ntụkwasị obi[b] anyị nwere site ná mmalite ike ruo ọgwụgwụ.[c]
  to: N’ihi na anyị aghọwo ndị nwere òkè n’ime Mesaịa[a], ma ọ bụrụ n’ezie na anyị ejidesie mmalite nke ntụkwasị obi anyị[b] ike ruo ọgwụgwụ.[c]
  rationale: The revision makes participation in Christ unambiguous and restores “mmalite” as the head of the object being held firmly. It retains the real conditional force without deciding theological debates about perseverance. Footnote a is adjusted to avoid repeating the ambiguity corrected in the main text, and footnote b aligns its alternatives with the contextual rendering.
  reviewer_model: gpt-5.6-terra
