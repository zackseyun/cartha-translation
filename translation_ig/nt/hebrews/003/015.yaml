  text: ἐν τῷ λέγεσθαι· Σήμερον ἐὰν τῆς φωνῆς αὐτοῦ ἀκούσητε, Μὴ σκληρύνητε τὰς καρδίας ὑμῶν ὡς ἐν τῷ παραπικρασμῷ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/015.yaml
  text: while it is being said[a], “Today, if you hear his voice, do not harden your hearts as in the rebellion.”
translation:
  language: ig
  text: mgbe a na-ekwu, sị, “Taa, ọ bụrụ na unu anụ olu ya, unu emela ka obi unu sie ike dịka n’oge nnupụisi ahụ[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’oge mkpasu iwe ahụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῷ λέγεσθαι
  choice: mgbe a na-ekwu
  rationale: Nkebiokwu a na-egosi oge ma ọ bụ ọnọdụ okwu ahụ; usoro ‘a na-ekwu’ na-echekwa echiche nke okwu a ka na-ada ma na-emetụta ndị na-anụ ya ugbu a.
- source_word: Σήμερον
  choice: Taa
  rationale: Nke a bụ okwu oge doro anya nke na-echekwa ịdị ngwa nke ịdọ aka ná ntị ahụ.
- source_word: ἐὰν
  choice: ọ bụrụ na
  rationale: Ọ na-ewebata ahịrịokwu ọnọdụ, dịka ọ dị n’asụsụ Grik.
- source_word: τῆς φωνῆς αὐτοῦ
  choice: olu ya
  rationale: Nke a bụ nsụgharị Igbo kwụ ọtọ ma dịkwa mma nke na-echekwa onye nwe olu ahụ.
- source_word: ἀκούσητε
  choice: unu anụ
  rationale: N’ọnọdụ a, ‘anụ’ na-egosi ịnụ olu ahụ, ma ọnọdụ amaokwu dum na-akpọkwa ndị na-anụ ya ka ha zaghachi ya.
- source_word: Μὴ σκληρύνητε
  choice: unu emela ka ... sie ike
  rationale: 'Nke a na-echekwa iwu mgbochi na ọdịdị transitive nke ngwaa Grik: ndị a na-agwa okwu ekwesịghị ime ka obi ha sie ike.'
- source_word: τὰς καρδίας ὑμῶν
  choice: obi unu
  rationale: ‘Obi’ na-echekwa echiche Akwụkwọ Nsọ banyere ime mmadụ—uche, ọchịchọ, na mkpebi—ọ bụghị naanị mmetụta.
- source_word: ὡς ἐν τῷ παραπικρασμῷ
  choice: dịka n’oge nnupụisi
  rationale: ‘Nnupụisi’ na-eme ka mmegide Izrel megide Chineke n’ọzara doo onye Igbo nke oge a anya; ‘n’oge’ na-egosi na okwu ahụ na-atụ aka n’ihe mere eme.
theological_decisions:
- issue: Nsụgharị παραπικρασμός n’ụzọ o si kpọtụrụ Abụ Ọma 95
  choice: nnupụisi
  alternative: mkpasu iwe
  rationale: Okwu ahụ na-ezo aka na nnupụisi Izrel n’ọzara, ọ bụghị naanị na ha kpasuru Chineke iwe. ‘Nnupụisi’ na-egosipụta mmegide ha nke ọma, ebe a na-edebe ‘mkpasu iwe’ n’okpuru dị ka ụzọ ọzọ nwere ike isi sụgharịa okwu Grik ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. E debere nkwughachi ‘obi unu’ n’agbanyeghị na Igbo na-ejikarị otu mkpụrụ okwu ahụ eme ihe maka ọtụtụ mmadụ. Enweghị akara nkọwa n’isiokwu n’ihi na nkọwa Bekee enyere n’okpuru akara [a] adabaghị na ebe e tinyere akara ahụ n’ahịrịokwu; agbanyeghị, a tụlere ụzọ ọzọ ‘mkpasu iwe’ n’ime mkpebi okwu.
