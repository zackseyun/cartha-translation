    rationale: The Greek expression, in its Psalm 95 citation, refers to a particular remembered rebellion/provocation. Adding “ahụ” preserves this specificity. Since the draft’s theological decision identifies “mkpasu iwe” as an alternative, it should be supplied as an anchored footnote for auditability.
  - severity: low
    issue: The quotation introducer omits “sị.”
    rationale: “Mgbe a na-ekwu, sị,” is clearer and more idiomatic Standard Igbo before a direct quotation than “mgbe a na-ekwu,” alone.
