- from: onye kwesịrị ntụkwasị obi n’ebe onye họpụtara ya[a] nọ, dị nnọọ ka Mosis kwesịkwara ntụkwasị obi n’ụlọ ya.[b]
  to: onye na-eguzosi ike n’ihe nye onye họpụtara ya[a], dịka Mosis kwa si guzosi ike n’ihe n’ụlọ ya.[b]
  rationale: The revision preserves the SBLGNT’s shorter reading (“in his house”), the contextual sense “appointed,” and the Greek pronoun’s ambiguity. It replaces an expression that can imply being trustworthy with a natural Igbo expression for being faithful, and it corrects the two footnotes for idiomatic clarity and grammatical completeness.
