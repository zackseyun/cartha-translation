  yaml_path: translation/nt/hebrews/003/002.yaml
  text: who was faithful to the one who appointed him[b][a], just as Moses also was in all his house.
translation:
  language: ig
  text: onye na-eguzosi ike n’ihe nye onye họpụtara ya[a], dịka Mosis kwa si guzosi ike n’ihe n’ụlọ ya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịtụgharị ya, “nye onye mere ya.” Okwu Grik a pụrụ ịpụta “mere,” ma n’ebe a o yikarịrị ka ọ pụtara “họpụtara” ma ọ bụ “nyere ọrụ.”
    reason: lexical_alternative
  - marker: b
    text: Ụfọdụ akwụkwọ aka ochie nwere “n’ụlọ ya niile,” nke yiri nnọọ okwu dị n’Ọnụ Ọgụgụ 12:7; ndị ọzọ nwere naanị “n’ụlọ ya.” O yikarịrị ka nkebiokwu a na-ekwu banyere ụlọ Chineke.
    reason: textual_variant
lexical_decisions:
- source_word: πιστὸν ὄντα
  choice: onye kwesịrị ntụkwasị obi
  rationale: Nkebi a na-akọwa Jizọs e kwuru okwu ya n’amaokwu nke 1. “Kwesịrị ntụkwasị obi” na-egosi ikwesị ntụkwasị obi na ịbụ onye a pụrụ ịdabere na ya, ọ bụghị nanị ịbụ onye kwere ekwe.
- source_word: τῷ ποιήσαντι αὐτὸν
  choice: n’ebe onye họpụtara ya nọ
  rationale: N’agbanyeghị na ποιέω pụrụ ịpụta “ime,” ọnọdụ okwu a banyere ọrụ e nyere Jizọs na ntụnyere ya na Mosis na-akwado “họpụtara.” Usoro “n’ebe ... nọ” na-egosi onye Jizọs kwesịrị ntụkwasị obi nye n’Igbo doro anya.
- source_word: ὡς καὶ
  choice: dị nnọọ ka ... kwesịkwara
  rationale: Nke a na-edobe ma ntụnyere ahụ ma echiche nke καί, ya bụ na Mosis kwa kwesịrị ntụkwasị obi.
- source_word: Μωϋσῆς
  choice: Mosis
  rationale: Nke a bụ ụdị aha ahụ a na-ejikarị eme ihe n’Igbo.
- source_word: ἐν τῷ οἴκῳ αὐτοῦ
  choice: n’ụlọ ya
  rationale: Nke a na-agbaso ederede SBLGNT nke na-enweghị okwu pụtara “niile.” A hapụrụ “ụlọ” na “ya” dịka ihe atụ na nnọchiaha Grik si dị, n’ihi na amaokwu ndị na-esochi na-aga n’ihu iji ihe atụ ụlọ ahụ.
theological_decisions:
- issue: Ihe ποιήσαντι pụtara mgbe ọ na-ekwu banyere Ọkpara ahụ
  choice: họpụtara
  alternative: mere
  rationale: “Mere” ga-ekwe omume n’ụzọ mkpụrụokwu, ma ọ pụrụ ime ka onye na-agụ ya chee na Chineke kere Ọkpara ahụ. N’ọnọdụ a, nke na-ekwu banyere ọrụ na ikwesị ntụkwasị obi, “họpụtara” na-egosi nke ọma echiche nke inye ọrụ ma ọ bụ ikenye ọrụ.
- issue: Onye nnọchiaha αὐτοῦ (“ya”) na-ezo aka na ya
  choice: E debere ya dịka “ya,” ebe ihe gbara okwu ahụ gburugburu na-egosi na ọ ga-abụ ụlọ Chineke.
  alternative: ụlọ Mosis
  rationale: Ntụnyere ahụ na Ọnụ Ọgụgụ 12:7 na-akwado ụlọ Chineke, ma ịhapụ nnọchiaha ahụ dịka “ya” na-echekwa ọdịdị na ntakịrị oghere nkọwa dị n’ederede Grik.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ bụ ihe na-aga n’ihu site n’amaokwu nke 1, ya mere e bidoro ya na “onye.” E debere ihe atụ “ụlọ” kama ịkọwa ya dịka “ezinụlọ” ma ọ bụ “ndị ụlọ,” ka njikọ ya na arụmụka nke amaokwu ndị na-esochi ghara ifu.
