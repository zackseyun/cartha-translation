revisions:
- from: Ụmụnna m,[a] kpacharanụ anya, ka onye ọ bụla n’ime unu ghara inwe obi ọjọọ nke enweghị okwukwe,[b] wee gbakụta Chineke dị ndụ azụ.[c]
  to: Kpacharanụ anya, ụmụnna,[a] ka onye ọ bụla n’ime unu ghara inwe obi ọjọọ nke enweghị okwukwe,[b] n’ịgbakụta Chineke dị ndụ azụ.[c]
  rationale: Removed the unsupported possessive “m” and replaced the sequential connective “wee” with “n’ịgbakụta,” preserving the Greek articular-infinitive construction and its deliberate breadth. Footnote c was adjusted so that its alternatives correspond grammatically to the revised nominal construction.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T21:27:59Z'
review_pass:
  verdict: revise
  source_fidelity: The draft conveys the warning, the possibility involving any individual in the audience, the evil/unbelieving heart, and turning away from the living God. However, “Ụmụnna m” adds the possessive “my,” which is absent from ἀδελφοί. The connective “wee” makes the turning away sound more distinctly sequential/resultative than the Greek ἐν + articular infinitive, whose relation should remain open.
  naturalness: “Kpacharanụ anya, ụmụnna” is natural, dignified Standard Igbo. Recasting the final clause with the nominal infinitive “n’ịgbakụta ... azụ” better retains the source construction without forcing a sequential relation.
  terminology: “obi ọjọọ,” “enweghị okwukwe,” and “Chineke dị ndụ” are suitable and theologically non-sectarian. “Ụmụnna” should stand without “m.”
  issues:
  - severity: medium
    issue: The main text adds “m” (‘my’) in “Ụmụnna m.”
    rationale: The Greek vocative ἀδελφοί means “brothers” here and contains no first-person possessive. The addition is customary-sounding in Igbo but is not source-faithful.
  - severity: medium
    issue: “Wee gbakụta ... azụ” narrows the relationship expressed by ἐν τῷ ἀποστῆναι.
    rationale: “Wee” presents the turning away as a following/resulting action. The Greek construction can indicate circumstance or closely related action and should not be made more definite than necessary.
  revised_text: Kpacharanụ anya, ụmụnna,[a] ka onye ọ bụla n’ime unu ghara inwe obi ọjọọ nke enweghị okwukwe,[b] n’ịgbakụta Chineke dị ndụ azụ.[c]
  revised_footnotes:
