id: HEB.3.12
reference: Hebrews 3:12
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: βλέπετε, ἀδελφοί, μήποτε ἔσται ἔν τινι ὑμῶν καρδία πονηρὰ ἀπιστίας ἐν τῷ ἀποστῆναι ἀπὸ θεοῦ ζῶντος,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/012.yaml
  text: Watch out[a], brothers[c][b], lest there be in any of you an evil heart of unbelief in turning away from the living God.
translation:
  language: ig
  text: Kpacharanụ anya, ụmụnna,[a] ka onye ọ bụla n’ime unu ghara inwe obi ọjọọ nke enweghị okwukwe,[b] n’ịgbakụta Chineke dị ndụ azụ.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Okwu Grik a sụgharịrị “Ụmụnna” dị n’ụdị ọtụtụ nke nwoke, ma a pụkwara iji ya kpọọ ndị nwoke na ndị nwanyị bụ ndị otu n’okwukwe.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “obi ọjọọ na-ekwesịghị ntụkwasị obi.”
    reason: alternative_reading
  - marker: c
    text: Ma ọ bụ, “n’ịpụ n’ebe Chineke dị ndụ nọ” ma ọ bụ “n’ịdapụ n’ebe Chineke dị ndụ nọ.”
    reason: alternative_reading
lexical_decisions:
- source_word: βλέπετε
  choice: kpacharanụ anya
  rationale: Ọ bụ iwu dị n’ụdị ọtụtụ nke na-adọ ndị a na-agwa aka ná ntị ka ha mụrụ anya. “Kpacharanụ anya” bụ Igbo doro anya ma na-eburu ike ịdọ aka ná ntị dị na okwu Grik ahụ.
- source_word: ἀδελφοί
  choice: Ụmụnna m
  rationale: Okwu Grik ahụ bụ aha a na-akpọ ọtụtụ ndị n’ezinụlọ okwukwe. “Ụmụnna m” bụ ụzọ Igbo e si akpọ ndị mmadụ n’ụzọ ịhụnanya na ịdị n’otu; ihe odide ala peeji kọwara na ụdị Grik ahụ bụ nke nwoke ma nwee ike ịgụnye ndị nwoke na ndị nwanyị.
- source_word: καρδία πονηρὰ
  choice: obi ọjọọ
  rationale: “Obi” na-egosi ebe echiche, ọchịchọ na mkpebi mmadụ si apụta, ebe “ọjọọ” na-echekwa ịdị arọ nke nrụrụ omume dị na πονηρά.
- source_word: ἀπιστίας
  choice: nke enweghị okwukwe
  rationale: N’ọnọdụ a, okwu ahụ na-egosi ịghara ikwere Chineke, dịka ihe atụ Izrel dị n’akụkụ a si gosi. Nsụgharị a ka na-ahapụ akụkụ nke ekwesịghị ntụkwasị obi ka e kwuo ya n’ihe odide ala peeji.
- source_word: ἐν τῷ ἀποστῆναι
  choice: wee gbakụta ... azụ
  rationale: Nke a bụ ụzọ Igbo dị mfe ma dị ike isi kwuo ịpụ ma ọ bụ ịtụgharị site n’ebe mmadụ nọ. “Wee” na-ejikọta ọnọdụ obi ahụ na ịgbakụta Chineke azụ n’enweghị iji okwu nkà mmụta okpukpe ga-akọwa ya karịa ihe Grik kwuru.
- source_word: ἀπὸ θεοῦ ζῶντος
  choice: Chineke dị ndụ
  rationale: Nke a na-echekwa aha Akwụkwọ Nsọ nke na-egosi Chineke dị ka onye dị ndụ, ma na-eme ka ọ pụta ìhè na ọ bụ ya ka mmadụ na-agbakụta azụ.
theological_decisions:
- issue: Ma ἀπιστίας pụtara enweghị okwukwe ka ọ bụ ekwesịghị ntụkwasị obi
  choice: enweghị okwukwe
  alternative: ekwesịghị ntụkwasị obi
  rationale: Ihe gbara amaokwu ahụ gburugburu na-elekwasị anya n’ịghara ikwere olu na nkwa Chineke. Otú ọ dị, ebe okwu Grik ahụ nwekwara ike ịgụnye ekwesịghị ntụkwasị obi, e debere nke ahụ dị ka nhọrọ ọzọ n’ihe odide ala peeji.
- issue: Ma ἀποστῆναι kwesịrị ịbụ okwu nkà mmụta okpukpe siri ike maka ịdapụ n’okwukwe
  choice: gbakụta ... azụ
  alternative: si n’ebe ... nọ pụọ; dapụ n’ebe ... nọ
  rationale: Ngwaa Grik ahụ pụtara ịpụ, iwezụga onwe, ma ọ bụ ịgbakụta azụ. Nhọrọ isi amaokwu ahụ na-echekwa ịdị njọ nke ịdọ aka ná ntị ahụ n’etinyeghị nkọwa otu ụka kpọmkwem banyere ndapụ n’okwukwe.
- issue: Mmekọrịta ἐν τῷ ἀποστῆναι na obi enweghị okwukwe
  choice: Ejikọtara ha site na “wee,” n’enweghị ikwu hoo haa ma ịgbakụta azụ ọ bụ ihe kpatara obi ahụ ka ọ bụ ihe obi ahụ mụtara
  alternative: site n’ịgbakụta; nke ga-eme ka ọ gbakụta
  rationale: Ihe owuwu Grik ahụ nwere ike igosi ọnọdụ, ụzọ, ma ọ bụ ihe si na ya pụta. Nsụgharị ahụ na-ahapụ mmekọrịta ahụ ntakịrị ghe oghe kama idozi esemokwu ahụ n’otu ụzọ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “Kpacharanụ anya” na-edobe ụda ịdọ aka ná ntị; “obi ọjọọ” na “Chineke dị ndụ” na-echekwa okwu atụ na ụda Akwụkwọ Nsọ. E tinyere akara ihe odide ala peeji [a], [b], na [c] niile n’isi amaokwu ahụ.
