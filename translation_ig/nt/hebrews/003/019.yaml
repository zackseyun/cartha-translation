id: HEB.3.19
reference: Hebrews 3:19
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ βλέπομεν ὅτι οὐκ ἠδυνήθησαν εἰσελθεῖν δι’ ἀπιστίαν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/019.yaml
  text: And we see that they were not able to enter because of unbelief[a].
translation:
  language: ig
  text: Anyị na-ahụkwa na ha enweghị ike ịbanye n’ihi ekweghị ekwe ha[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’ihi na ha emeghị ntụkwasị obi.” Okwu Grik a nwere ike ịpụta ọ bụghị naanị enweghị nkwenye, kamakwa ịjụ ịtụkwasị obi nke na-egosi ekwesịghị ntụkwasị obi.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: -kwa
  rationale: E tinyere njikọ a n'okwu ngwaa ahụ dịka “na-ahụkwa” iji nọgide na-ejikọta nkwubi okwu a na ihe e kwuru tupu ya, n'etinyeghị ike nkwubi okwu ọzọ na-adịghị na Grik.
- source_word: βλέπομεν
  choice: anyị na-ahụ
  rationale: Nke a na-echekwa onye mbụ ọtụtụ na oge ugbu a nke ngwaa Grik, ma na-ada nke ọma n'Igbo.
- source_word: ὅτι
  choice: na
  rationale: “Na” na-ewebata ọdịnaya nke ihe anyị na-ahụ n'ụzọ doro anya ma kwekọọ n'usoro okwu Igbo.
- source_word: οὐκ ἠδυνήθησαν
  choice: ha enweghị ike
  rationale: Nke a na-echekwa echiche nke enweghị ike dị na δύναμαι, kama ịkọwa ya naanị dịka na ihe ahụ emeghị.
- source_word: εἰσελθεῖν
  choice: ịbanye
  rationale: Ọ bụ ntụgharị kpọmkwem ma bụrụkwa okwu Igbo a na-ahụkarị maka ịbanye n'ebe ahụ e kwuru okwu ya n'akụkụ a.
- source_word: δι’
  choice: n’ihi
  rationale: Ebe διά so ebubo nnara (accusative), ọ na-egosi ihe kpatara ya; “n’ihi” na-egosipụta nke a nke ọma.
- source_word: ἀπιστίαν
  choice: ekweghị ekwe ha
  rationale: “Ekweghị ekwe” na-egosi enweghị nkwenye na ịjụ ịtụkwasị Chineke obi n'ọnọdụ a. Ịgbakwunye “ha” na-eme ka okwu Igbo doo anya n'emebighị ihe Grik pụtara.
theological_decisions:
- issue: Otú e si tụgharị ἀπιστία n'ihe metụtara πίστις
  choice: ekweghị ekwe
  alternative: emeghị ntụkwasị obi
  rationale: Ihe ndị gbara amaokwu a gburugburu na-elekwasị anya n'ịjụ ikwere na ịtụkwasị nkwa Chineke obi, ya mere “ekweghị ekwe” bụ nke kacha doo anya n'ahịrị isi. Ma okwu Grik ahụ nwekwara ike igosi emeghị ntụkwasị obi ma ọ bụ ekwesịghị ntụkwasị obi; e debere nke ahụ n'okpuru peeji ka a ghara iwepụ nghọta abụọ ahụ.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji “na-ahụkwa” mee ka njikọ okwu dị larịị; e jighị okwu ụka pụrụ iche ma ọ bụ nkọwa otu okpukpe tinye n'amaokwu ahụ.
