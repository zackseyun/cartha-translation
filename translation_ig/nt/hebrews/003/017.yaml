source:
  edition: SBLGNT
  text: τίσιν δὲ προσώχθισεν τεσσεράκοντα ἔτη; οὐχὶ τοῖς ἁμαρτήσασιν, ὧν τὰ κῶλα ἔπεσεν ἐν τῇ ἐρήμῳ;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/017.yaml
  text: And with whom was he angry for forty years? Was it not with those who sinned[a], whose bodies fell in the wilderness?
translation:
  language: ig
  text: Ole ndị ka o wesaara iwe ruo afọ iri anọ? Ọ̀ bụghị ndị ahụ mere mmehie, ndị ozu ha dara n’ọzara?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσώχθισεν
  choice: wesoro iwe
  rationale: Nkebi okwu a na-egosi iwe ma ọ bụ oke iwe e nwere megide mmadụ. “Wesoro iwe” bụ Igbo doro anya ma kwekọọ n’ajụjụ a.
- source_word: τεσσεράκοντα ἔτη
  choice: ruo afọ iri anọ
  rationale: N’ebe a, ebubo aha a na-egosi ogologo oge. “Ruo afọ iri anọ” na-egosipụta oge iwe ahụ gara n’ụzọ Igbo si ada nke ọma.
- source_word: ἁμαρτήσασιν
  choice: ndị ahụ mere mmehie
  rationale: Nke a na-akọwa ndị mere mmehie n’ọzara; ntụgharị a bụ nke doro anya ma bụrụkwa Igbo mmadụ na-asụ ugbu a.
- source_word: κῶλα
  choice: ozu
  rationale: Ọ bụ ezie na okwu Grik a pụtara akụkụ ahụ ma ọ bụ aka na ụkwụ n’ụzọ nkịtị, n’ọnọdụ a ọ na-ezo aka n’ahụ ndị ahụ nwụrụ anwụ. “Ozu” na-egosipụta ọnwụ na ikpe dị n’okwu a n’ụzọ doro anya.
- source_word: ἔπεσεν
  choice: dara
  rationale: “Dara” na-echekwa ihe oyiyi dị na ngwaa Grik ahụ, ebe ọnọdụ okwu ahụ na-eme ka o doo anya na ọnwụ so na ya.
- source_word: ἐν τῇ ἐρήμῳ
  choice: n’ọzara
  rationale: “Ọzara” bụ okwu Igbo a na-ejikarị akọwa ebe ụmụ Izrel wagharịrị, ma na-echekwa ọnọdụ akụkọ Akwụkwọ Nsọ ahụ.
theological_decisions:
- issue: Onye nnọchiaha e zoro ezo na προσώχθισεν na-ezo aka na ya
  choice: “ọ” na-ezo aka na Chineke dịka ihe gbara amaokwu ahụ gburugburu si gosi
  alternative: Ikwupụta “Chineke” kpọmkwem n’ahịrịokwu ahụ
  rationale: Grik ekwughị aha Chineke n’amaokwu a kama o mere ka onye na-agụ ya ghọta ya site n’ihe gbara ya gburugburu. Iji “ọ” na-echekwa usoro ahụ ma ghara ịgbakwunye aha na-adịghị n’ahịrịokwu Grik.
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, nke dị ugwu ma dị mfe nghọta. Ajụjụ abụọ ahụ na-echekwa ụdị ajụjụ nkwuwa okwu nke Grik, ebe “Ọ̀ bụghị” na-atụ anya azịza nkwenye.
