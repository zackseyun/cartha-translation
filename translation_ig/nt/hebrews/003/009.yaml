    issue: ‘ndị nna nna unu’ is overly specific.
    rationale: It ordinarily means ‘your grandfathers,’ whereas the Greek fathers in this Psalm quotation are Israel’s forefathers in the wilderness, not merely a grandparental generation.
  - severity: low
    issue: Footnote anchors are both placed at the end and in reverse clause order.
    rationale: Footnote a concerns n’ule, while footnote b concerns ma hụ ọrụ m. Placing each marker after its referent improves usability without changing meaning.
