  text: ebe ndị nna unu ochie nwara m n’ule[a], ma hụ ọrụ m[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “ebe ndị nna unu ochie ji nnwale nwaa m,” ma ọ bụ, “tinye m n’ule.” Nkebiokwu Greek ἐν δοκιμασίᾳ siri ike, ọ pụkwara igosi otú ha si mee ya ma ọ bụ ihe ha ji mee ya.
    reason: lexical_alternative
  - marker: b
    text: 'Ụfọdụ nsụgharị na-eme ka nkebiokwu na-esonụ gosi ihe megidere ihe a tụrụ anya ya: “ma ha hụrụ ọrụ m” ma ọ bụ “ọ bụ ezie na ha hụrụ ọrụ m.” Ma Greek kwuru naanị, “ma hụ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗ
  choice: ebe
  rationale: Ọ bụ adverb na-ezo aka n’ebe ahụ dị n’ọzara a kpọtụrụ aha n’amaokwu bu ụzọ; “ebe” na-echekwa nghọta nke ọnọdụ.
- source_word: ἐπείρασαν
  choice: nwara
  rationale: N’ebe a, okwu ahụ pụtara itinye Chineke n’ule n’ụzọ mkpali na-adịghị mma; “nwara” dị mkpụmkpụ ma bụrụkwa asụsụ Igbo doro anya.
- source_word: οἱ πατέρες ὑμῶν
  choice: ndị nna nna unu
  rationale: N’Igbo, “ndị nna nna unu” na-egosi ndị nna ochie/ndị bu ha ụzọ n’akụkọ ihe mere eme, ma na-echekwa ọdịdị okwu ezinụlọ nke Greek.
- source_word: ἐν δοκιμασίᾳ
  choice: n’ule
  rationale: Nkebiokwu a siri ike ma nwee ike ịkọwa ọnọdụ, ụzọ, ma ọ bụ ihe e ji nwalee. “N’ule” na-echekwa preposition ahụ n’enweghị imechi nkọwa ya n’otu ụzọ naanị.
- source_word: καὶ εἶδον
  choice: ma hụ
  rationale: Greek ji njikọ dị mfe καί; “ma hụ” na-edobe njikọ ahụ n’enweghị ịgbakwunye echiche ‘ọ bụ ezie na’ n’ahịrị isi.
- source_word: τὰ ἔργα μου
  choice: ọrụ m
  rationale: “Ọrụ m” na-echekwa ụdị okwu ἔργα ma na-ezo aka n’ihe Chineke mere n’ọzara.
theological_decisions:
- issue: Ihe ἐπείρασαν metụtara
  choice: nwara m
  alternative: nwara
  rationale: Ọ bụ ezie na SBLGNT edeghị “m” dịka object n’ahịrị a, okwu Chineke n’ime abụ ahụ na ọnọdụ Salm 95 na-egosi na ọ bụ Chineke ka ha nwara. Itinye “m” na-eme ka Igbo doo anya n’enweghị ịgbakwunye ozizi ọzọ.
- issue: Mmekọrịta καὶ εἶδον na nkebiokwu bu ya ụzọ
  choice: ma hụ
  alternative: ọ bụ ezie na ha hụrụ
  rationale: A naghị eme καί ka ọ bụrụ concessive n’ahịrị isi; a na-edobe njikọ Greek dị mfe, ebe a na-enye nkọwa ọzọ na ihe odide ala peeji.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “Ndị nna nna unu” na-eburu echiche nke ndị nna ochie n’enweghị ịtụnye nkọwa ụka pụrụ iche. E debere mgbagwoju anya dị na ἐν δοκιμασίᾳ na ihe odide ala peeji, ma e meghị καί ka ọ bụrụ concessive n’ahịrị isi.
