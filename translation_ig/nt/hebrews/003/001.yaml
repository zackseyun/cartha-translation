    reason: lexical_alternative
  revision_rationale: The revision improves idiomatic Standard Igbo while preserving the Greek syntax and semantic scope. It keeps the masculine-form communal address with an inclusive explanatory note, preserves “onyeozi” and “nnukwu onye nchụàjà” as the verse’s titles for Jesus, and retains the ambiguity of the genitive phrase through footnote c.
