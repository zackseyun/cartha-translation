id: HEB.3.1
reference: Hebrews 3:1
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ὅθεν, ἀδελφοὶ ἅγιοι, κλήσεως ἐπουρανίου μέτοχοι, κατανοήσατε τὸν ἀπόστολον καὶ ἀρχιερέα τῆς ὁμολογίας ἡμῶν ⸀Ἰησοῦν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/001.yaml
  text: Therefore[a], holy brothers, sharers in a heavenly calling, consider Jesus, the apostle and high priest of our confession[c][b],
translation:
  language: ig
  text: Ya mere, ụmụnna dị nsọ[a], ndị na-eketa òkè n’ọkpụkpọ nke eluigwe[b], tuleenụ Jizọs nke ọma, onyeozi na nnukwu onye nchụàjà nke nkwupụta anyị[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ụmụnna” n’ebe a na-agwa ọgbakọ ndị kwere ekwe niile, ụmụ nwanyị sokwa na ha.
    reason: cultural_note
  - marker: b
    text: A pụkwara ịsụgharị ya, “ndị sonyere n’ọkpụkpọ nke eluigwe.”
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “tuleenụ onye anyị na-ekwupụta, ya bụ, Jizọs, onyeozi na nnukwu onye nchụàjà.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅθεν
  choice: Ya mere
  rationale: Ọ na-egosi nkwubi okwu sitere n’ihe e kwuru tupu nke a, ma bụrụkwa okwu Igbo doro anya ma dịrị mmadụ niile mfe.
- source_word: ἀδελφοὶ ἅγιοι
  choice: ụmụnna dị nsọ
  rationale: “Ụmụnna” na-edobe ụdị okwu a kpọrọ ndị kwere ekwe ọnụ, ebe “dị nsọ” na-egosi na e doro ha nsọ nye Chineke.
- source_word: κλήσεως ἐπουρανίου
  choice: n’ọkpụkpọ nke eluigwe
  rationale: “Ọkpụkpọ” na-edobe echiche nke ọkpụkpọ Chineke; “nke eluigwe” na-ahapụ ohere ka a ghọta ma ebe ọkpụkpọ ahụ si bịa ma ụdị àgwà ya.
- source_word: μέτοχοι
  choice: ndị so nwee òkè
  rationale: Nkebi okwu a na-egosi isonye na iketa òkè n’ihe, n’asụsụ Igbo nke oge a na-ada nke ọma.
- source_word: κατανοήσατε
  choice: tụgharịa uche unu nke ọma na
  rationale: Ọ na-egosi ilekwasị uche anya na ịtụle ihe nke ọma, dịka iwu a dị n’asụsụ Grik si chọọ.
- source_word: ἀπόστολον
  choice: onyeozi
  rationale: Ọ na-edobe aha ọrụ onye e zitere, nke a na-eji kpọọ Jizọs n’amaokwu a, n’enweghị ịkọwa ya karịa ihe ederede kwuru.
- source_word: ἀρχιερέα
  choice: nnukwu onye nchụàjà
  rationale: Nke a bụ okwu Igbo doro anya maka onye nchụàjà kachasị elu, ọ bụkwa isiokwu dị mkpa n’akwụkwọ Ndị Hibru.
- source_word: τῆς ὁμολογίας ἡμῶν
  choice: nke nkwupụta anyị
  rationale: Ọ na-edobe njikọ genitiv ahụ na “onyeozi na nnukwu onye nchụàjà,” ma ghara imechi ụzọ ọzọ e nwere isi ghọta nkebi okwu ahụ.
- source_word: Ἰησοῦν
  choice: Jizọs
  rationale: Nke a bụ nsụgharị aha Ἰησοῦς a na-ejikarị eme ihe n’Igbo.
theological_decisions:
- issue: Ndị okwu ἀδελφοὶ na-agwa
  choice: E ji “ụmụnna” mee ya n’ahịrị bụ isi, ma kọwaa n’ala peeji na ọ gụnyere ụmụ nwanyị kwere ekwe.
  alternative: ụmụnne nwoke na ụmụnne nwanyị; ụmụ Chineke ibe m
  rationale: Ụdị okwu Grik bụ nke nwoke n’ụdị ọtụtụ, ma n’ebe a ọ na-agwa ọgbakọ ndị kwere ekwe niile. Nke a na-edobe ọdịdị okwu ahụ ma mee ka oke ndị ọ gụnyere doo anya.
- issue: Ike aha ἀπόστολον mgbe e ji ya kpọọ Jizọs
  choice: Idowe ya dịka “onyeozi.”
  alternative: onye e zitere; onye nnọchiteanya
  rationale: Amaokwu ahụ kpọrọ Jizọs ἀπόστολος kpọmkwem. Idowe aha ahụ na-echekwa ịdị arọ nke okwu ahụ n’akụkụ mmụta okpukpe ma ghara ịtinye nkọwa ụka e mesịrị.
- issue: Njikọ τῆς ὁμολογίας ἡμῶν
  choice: “onyeozi na nnukwu onye nchụàjà nke nkwupụta anyị”
  alternative: '“onye anyị na-ekwupụta: Jizọs, onyeozi na nnukwu onye nchụàjà”'
  rationale: Nhazi Grik kacha kwe ka nkebi genitiv ahụ metụta utu aha abụọ ahụ, ma ụzọ ọzọ isi ghọta ya ka nwere ike ịdị; e debere ya n’ala peeji kama idozi mgbagwoju ahụ n’enweghị ihe akaebe zuru ezu.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ugwu ma dị mfe nghọta, mee ihe. A họọrọ “onyeozi,” “nnukwu onye nchụàjà,” na “nkwupụta” iji chekwaa isi okwu mmụta okpukpe na njikọ edemede nke Ndị Hibru, ma a zere okwu pụrụ iche nke otu ụka.
