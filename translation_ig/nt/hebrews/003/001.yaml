revisions:
- from: Ya mere, ụmụnna dị nsọ[a], ndị so nwee òkè n’ọkpụkpọ nke eluigwe[b], tụgharịa uche unu nke ọma na Jizọs, onyeozi na nnukwu onye nchụàjà nke nkwupụta anyị[c].
  to: Ya mere, ụmụnna dị nsọ[a], ndị na-eketa òkè n’ọkpụkpọ nke eluigwe[b], tuleenụ Jizọs nke ọma, onyeozi na nnukwu onye nchụàjà nke nkwupụta anyị[c].
  rationale: The revision improves idiomatic Standard Igbo while preserving the Greek syntax and semantic scope. It keeps the masculine-form communal address with an inclusive explanatory note, preserves “onyeozi” and “nnukwu onye nchụàjà” as the verse’s titles for Jesus, and retains the ambiguity of the genitive phrase through footnote c.
