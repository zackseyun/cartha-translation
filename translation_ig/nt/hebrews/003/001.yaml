review_pass:
  verdict: revise
  source_fidelity: The draft retains the inferential force of Ὅθεν, the consecrated communal address, participation in the heavenly calling, and Jesus’ two titles. However, the imperative κατανοήσατε calls for deliberate consideration; the present wording is less idiomatic and somewhat obscures that direct command.
  naturalness: “Ndị so nwee òkè” and “tụgharịa uche unu nke ọma na Jizọs” are understandable but not the most natural Standard Igbo forms in this context. “Ndị na-eketa òkè” and “tuleenụ ... nke ọma” are smoother and retain the intended sense.
  terminology: “Ụmụnna dị nsọ,” “onyeozi,” “nnukwu onye nchụàjà,” “nkwupụta anyị,” and “Jizọs” are suitable, dignified Standard Igbo renderings. “Ọkpụkpọ nke eluigwe” appropriately leaves open the calling’s heavenly origin/character.
  issues:
  - severity: medium
    issue: The rendering of κατανοήσατε is awkward in Standard Igbo.
    rationale: “Tụgharịa uche unu nke ọma na” is not as idiomatic as a direct imperative of attentive consideration. “Tuleenụ Jizọs nke ọma” naturally expresses the command without adding interpretive content.
  - severity: low
    issue: The expression for μέτοχοι is slightly cumbersome.
    rationale: “Ndị so nwee òkè” is comprehensible, but “ndị na-eketa òkè” is the more natural current Igbo expression for people who share/participate in something.
  - severity: low
    issue: Footnote c needs a more natural Igbo expression of the proposed alternative construal.
    rationale: The alternative should identify Jesus as the one confessed without implying a different meaning or obscuring the appositional relationship.
  revised_text: Ya mere, ụmụnna dị nsọ[a], ndị na-eketa òkè n’ọkpụkpọ nke eluigwe[b], tuleenụ Jizọs nke ọma, onyeozi na nnukwu onye nchụàjà nke nkwupụta anyị[c].
  revised_footnotes:
