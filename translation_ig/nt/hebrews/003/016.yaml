  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τίνες γὰρ ἀκούσαντες παρεπίκραναν; ἀλλ’ οὐ πάντες οἱ ἐξελθόντες ἐξ Αἰγύπτου διὰ Μωϋσέως;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/016.yaml
  text: For who[a], when they heard, rebelled? Was it not all those who came out of Egypt through Moses?
translation:
  language: ig
  text: N’ihi na, ònye ka ndị nụrụ ma nupụrụ isi bụ[a]? Ọ̀ bụghị ndị niile si n’Ijipt pụta site n’aka Mosis?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ndị nụrụ ma kpasuo [ya] iwe,” ma ọ bụ “ndị nụrụ ma mee ka obi [ya] ilu.” N’ebe a, ngwaa Grik ahụ na-ekwu banyere nnupụisi Izrel n’ọzara.
    reason: lexical_alternative
lexical_decisions:
- source_word: τίνες
  choice: ònye bụ ndị
  rationale: Ajụjụ a na-achọ ịmata ìgwè mmadụ kpọmkwem; usoro a na-eme ka ọtụtụ mmadụ e zoro aka na ha pụta ìhè n’Igbo.
- source_word: γὰρ
  choice: N’ihi na
  rationale: Ọ na-ejikọta ajụjụ a na ihe e kwuru tupu ya dị ka nkọwa ma ọ bụ ihe na-akwado ya.
- source_word: ἀκούσαντες
  choice: ndị nụrụ olu ya
  rationale: Ọ na-egosi na ha nụrụ tupu ha enupụ isi. ‘Olu ya’ na-eme ka ihe a nụrụ doo anya site n’akụkụ okwu ndị gbara amaokwu a gburugburu, na-enweghị ịgbanwe isi ajụjụ ahụ.
- source_word: παρεπίκραναν
  choice: nupụ isi
  rationale: N’ọnọdụ akụkọ ọzara a, ngwaa ahụ na-ekwu maka nnupụisi Izrel nke kpasuru Chineke iwe; ‘nupụ isi’ na-enye ndị na-agụ Igbo nghọta ahụ kpọmkwem.
- source_word: ἀλλ’ οὐ πάντες
  choice: Ọ̀ bụghị ndị niile
  rationale: Ọ na-edobe ike ajụjụ ntụgharị uche nke na-atụ anya azịza ee; a naghị achọ ịsụgharị ἀλλά iche n’Igbo ebe a.
- source_word: οἱ ἐξελθόντες ἐξ Αἰγύπτου
  choice: ndị niile si n’Ijipt pụta
  rationale: Nke a bụ ụzọ Igbo dị mfe ma kwekọọ n’echiche ọpụpụ ha site n’Ijipt.
- source_word: διὰ Μωϋσέως
  choice: site n’aka Mosis
  rationale: Ọ na-egosi na Mosis bụ onye Chineke ji kpọpụta ha, ma ọ naghị agbasa okwu ahụ ruo n’ịkọwa ya naanị dị ka idu ndú.
theological_decisions:
- issue: Ihe παραπικραίνω pụtara n’akụkọ ọgbọ ọzara
  choice: nupụ isi
  alternative: kpasuru ya iwe / mee ka obi ya ilu
  rationale: ‘Nupụ isi’ na-egosipụta omume nnupụisi ha n’ụzọ doro anya n’Igbo ugbu a; ihe ntụgharị nke dị nso n’ụdị okwu Grik ka edebere n’ala peeji iji chekwaa obosara okwu ahụ.
- issue: Onye a nupụrụ isi megide ya
  choice: E tinyụghị ‘Chineke’ n’ahịrị isi
  alternative: nupụụrụ Chineke isi
  rationale: Grik ekwughị onye e mere ihe ahụ kpọmkwem n’ahịrị a, ọ bụ ezie na gburugburu okwu na-eme ka ọ pụta ìhè. Ịhapụ aha ahụ n’ahịrị isi na-echekwa mkpụmkpụ na esemokwu nke isi mmalite.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji ‘Mosis’ dịka ụdị aha a na-ahụkarị n’Igbo. Akara ụda dị mkpa n’ajụjụ ‘Ọ̀’ ka e tinyere iji gbochie mgbagwoju anya.
