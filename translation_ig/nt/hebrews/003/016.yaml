revisions:
- from: N’ihi na, ònye bụ ndị nụrụ olu ya ma nupụ isi[a]? Ọ̀ bụghị ndị niile si n’Ijipt pụta site n’aka Mosis?
  to: N’ihi na, ònye ka ndị nụrụ ma nupụrụ isi bụ[a]? Ọ̀ bụghị ndị niile si n’Ijipt pụta site n’aka Mosis?
  rationale: The revision removes the contextually inferable but unstated “olu ya,” repairs the interrogative construction for natural Standard Igbo, and retains the source’s ambiguity concerning the unstated person affected by the rebellion. The revised footnote supplies literal alternatives while marking the contextually implied object with brackets.
  reviewer_model: gpt-5.6-terra
