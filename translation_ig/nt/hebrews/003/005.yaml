id: HEB.3.5
reference: Hebrews 3:5
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ Μωϋσῆς μὲν πιστὸς ἐν ὅλῳ τῷ οἴκῳ αὐτοῦ ὡς θεράπων εἰς μαρτύριον τῶν λαληθησομένων,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/005.yaml
  text: And Moses indeed was faithful in all his house as a servant[a], for a testimony of the things that would be spoken later[b],
translation:
  language: ig
  text: Mosis n'ezie bụ onye kwesịrị ntụkwasị obi n’ụlọ ya dum dịka onye na-eje ozi[a], ka ọ bụrụ ihe akaebe banyere ihe ndị a ga-ekwu[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “dịka onye ozi.” Okwu Grik a na-egosi onye na-eje ozi n’ụzọ nwere nsọpụrụ; ọ bụghị okwu a na-ejikarị akọwa ohu e ji agbụ.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, “banyere ihe ndị a ga-ekwu n’ọdịnihu.” Nkebiokwu ahụ na-atụ aka n’ihe a ga-ekwu ma emesịa.
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ
  choice: n'ezie
  rationale: N'usoro okwu Igbo, njikọ a na μὲν na-eme ka a malite akụkụ mbụ nke ntụnyere ahụ; a na-egosipụta ya n'ụzọ dị ire site na “n'ezie,” ebe njikọ dị n'amaokwu bu ụzọ ka na-apụta ìhè.
- source_word: Μωϋσῆς
  choice: Mosis
  rationale: Nke a bụ nsụgharị aha ahụ a na-ejikarị eme ihe n'Igbo Baịbụl na n'okwu Ndị Kraịst.
- source_word: μὲν
  choice: n'ezie
  rationale: Ọ na-egosi akụkụ mbụ nke ọdịiche a ga-emecha site na δέ n'amaokwu na-esonụ; “n'ezie” na-edobe atụmanya ahụ n'Igbo dị mma.
- source_word: πιστὸς
  choice: kwesịkwara ntụkwasị obi
  rationale: Nkebiokwu a na-egosi na Mosis bụ onye a pụrụ ịtụkwasị obi ma nọgide na-emezu ọrụ e nyere ya.
- source_word: ἐν ὅλῳ τῷ οἴκῳ αὐτοῦ
  choice: n'ụlọ ya dum
  rationale: Ọ na-edobe ihe atụ nke “ụlọ” sitere na Ọnụọgụgụ 12:7, nke Ndị Hibru gara n'ihu ịkọwa n'amaokwu ndị na-esonụ, kama ịgbanwe ya ozugbo ka ọ bụrụ naanị ezinaụlọ.
- source_word: ὡς
  choice: dịka
  rationale: Ọ na-ewebata ọnọdụ ma ọ bụ ọrụ Mosis ji jee ozi.
- source_word: θεράπων
  choice: onye na-eje ozi
  rationale: Nke a na-egosi ọrụ nsọpụrụ nke onye na-enyere nna ya ukwu aka, n'ebughị echiche siri ike nke ohu e ji agbụ nke δοῦλος nwere ike ibu.
- source_word: εἰς μαρτύριον
  choice: iji gbaa ama
  rationale: 'Ọ na-egosi nzube ma ọ bụ ihe ọrụ Mosis rụpụtara: ịbụ ihe akaebe banyere ihe Chineke ga-eme ka a kwuo.'
- source_word: τῶν λαληθησομένων
  choice: banyere ihe ndị a ga-ekwu
  rationale: A na-edobe ọdịdị ọdịnihu na nke enweghị onye kpọmkwem kwuru ha; e tinyeghị “emesịa” n'ahịrị bụ isi n'ihi na ọdịnihu ahụ apụtalarị na “a ga-ekwu,” ma nkọwa ala peeji kọwara ntụaka ya n'ihu.
theological_decisions:
- issue: Ihe “ụlọ ya” pụtara n'ebe Mosis nọ
  choice: E debere “ụlọ ya dum” dịka ihe atụ Akwụkwọ Nsọ maka ndị Chineke na usoro ụlọ ya, bụ́ ebe Mosis jere ozi.
  alternative: “ezinaụlọ ya dum” ma ọ bụ “ndị niile nọ n'ụlọ ya”
  rationale: Ihe gbara amaokwu a gburugburu na Ọnụọgụgụ 12:7 na-egosi na “ụlọ” karịrị ụlọ nkịtị; idebe okwu ahụ na-echekwa njikọ ahụ n'ebughị ụzọ kpebie nkọwa ya niile.
- issue: Ike na nsọpụrụ dị na θεράπων
  choice: “onye na-eje ozi”
  alternative: “ohu” ma ọ bụ “onye enyemaka”
  rationale: θεράπων na-egosi onye ozi nwere nsọpụrụ ma dị iche na δοῦλος; nhọrọ a na-echekwa ọdịiche dị n'etiti Mosis dịka onye ozi na Ọkpara ahụ n'amaokwu na-esonụ.
- issue: Ihe ndị a ga-ekwu
  choice: 'E debere okwu ahụ n''ụdị sara mbara: “ihe ndị a ga-ekwu.”'
  alternative: Ịkọwa ya kpọmkwem dịka ozi Kraịst ma ọ bụ mkpughe nke Ọkpara
  rationale: Future passive participle na-atụ aka n'ihe a ga-ekwu n'ọdịnihu, ma amaokwu a n'onwe ya akọwaghị onye ga-ekwu ya ma ọ bụ kpọọ ọdịnaya ya aha; nsụgharị ahụ anaghị emechi ambiguity ahụ.
translation_notes:
  register: Standard Igbo; okwu ndị dị ugbu a, dị ùgwù, ma dị mfe nghọta. E debere ihe atụ “ụlọ” maka njikọ ya na amaokwu ndị gbara ya gburugburu. Akara ala peeji [a] na [b] dị n'ahịrị bụ isi.
