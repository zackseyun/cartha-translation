  variant: Standard Igbo
source:
  edition: SBLGNT
  text: πᾶς γὰρ οἶκος κατασκευάζεται ὑπό τινος, ὁ ⸀δὲ πάντα κατασκευάσας θεός.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/004.yaml
  text: For every house is built by someone[a], but God is the one who built all things.
translation:
  language: ig
  text: N’ihi na ụlọ ọ bụla nwere onye wuru ya, ma onye wuru ihe niile bụ Chineke.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πᾶς … οἶκος
  choice: ụlọ ọ bụla
  rationale: 'N’Igbo, ‘ụlọ ọ bụla’ na-egosi nkesa nke πᾶς tinyere aha otu ọnụọgụ: ụlọ nke ọ bụla. Ọ na-edobekwa oyiyi ụlọ nke gbara amaokwu ndị a gburugburu, n’ebughị ụzọ kọwaa ya dị ka ezi-na-ụlọ.'
- source_word: γὰρ
  choice: N’ihi na
  rationale: γάρ na-enye ihe kpatara ma ọ bụ nkọwa nke okwu gara aga; ‘N’ihi na’ na-eme ka njikọ arụmụka ahụ doo anya n’Igbo.
- source_word: κατασκευάζεται ὑπό τινος
  choice: nwere onye wuru ya
  rationale: Nke a bụ ụzọ Igbo dị mfe ma bụrụkwa eke isi kwuo na ụlọ ọ bụla sitere n’ọrụ onye wuru ya. Ọ na-echekwa echiche onye na-eme ihe nke ὑπό τινος, n’agbanyeghị na e gbanwere passive Greek ka ọ bụrụ ahịrịokwu kwekọrọ n’usoro Igbo.
- source_word: ὁ δὲ
  choice: ma onye
  rationale: ‘Ma’ na-egosi ntụgharị dị nro site n’eziokwu zuru ebe niile gaa na nkwupụta kachasị mkpa; ‘onye’ na-anọchi participle e ji mee aha.
- source_word: πάντα
  choice: ihe niile
  rationale: ‘Ihe niile’ bụ ụzọ Igbo nkịtị isi gosipụta oke zuru ezu nke πάντα, n’etinyeghị nkọwa sara mbara dịka ‘eluigwe na ụwa dum.’
- source_word: κατασκευάσας
  choice: wuru
  rationale: ‘Wuru’ na-ejikọta nkebi nke abụọ na oyiyi ụlọ dị na nkebi mbụ ma na-egosi onye mere ka ihe ndị ahụ dịrị n’usoro.
- source_word: θεός
  choice: Chineke
  rationale: ‘Chineke’ bụ ntụgharị doro anya na nke kwesịrị ekwesị nke θεός n’ebe a.
theological_decisions:
- issue: Otu e si egosi na Chineke bụ onye wuru ihe niile
  choice: onye wuru ihe niile bụ Chineke
  alternative: Chineke bụ onye wuru ihe niile
  rationale: 'Nhọrọ a na-agbaso usoro na ịdị arọ nke Greek: ọ na-ebu ụzọ kpọọ ‘onye wuru ihe niile’ wee mata onye ahụ dị ka Chineke. Ọ naghị eme ka nkwupụta ahụ daa mbà ma ọ bụ tinye nkọwa metaphysical na-adịghị n’amaokwu ahụ.'
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe nke oge a, dị nsọ ma dị mfe nghọta. E ji ‘ụlọ’ debe oyiyi ụlọ nke okwu Greek, e jighịkwa ‘ezi-na-ụlọ’ mechie ihe okwu ahụ nwere ike ịpụta n’ọdịnaya gbara ya gburugburu. A hapụrụ ndetu Bekee ‘Or everything’ n’ihi na ‘all things’ na ‘everything’ abụọ na-abanye n’otu ntụgharị Igbo, ‘ihe niile’; ya mere ndetu ahụ agaghị enye onye na-agụ Igbo ọdịiche bara uru.
