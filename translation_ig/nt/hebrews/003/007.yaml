source:
  edition: SBLGNT
  text: Διό, καθὼς λέγει τὸ πνεῦμα τὸ ἅγιον· Σήμερον ἐὰν τῆς φωνῆς αὐτοῦ ἀκούσητε,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/007.yaml
  text: 'Therefore, just as the Holy Spirit says: “Today, if you hear his voice,”'
translation:
  language: ig
  text: 'Ya mere, dị ka Mmụọ Nsọ na-ekwu, sị: “Taa, ọ bụrụ na unu anụ olu ya,”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διό
  choice: Ya mere
  rationale: Ọ na-egosi nkwubi okwu sitere n'ihe e kwuru tupu ya; “Ya mere” bụ okwu Igbo doro anya ma bụrụkwa nke a na-ejikarị egosi njikọ echiche a.
- source_word: καθὼς
  choice: dị nnọọ ka
  rationale: Ọ na-ebute ntụnyere na okwu e hotara; “dị nnọọ ka” na-echekwa ike okwu ahụ karịa naanị “dị ka.”
- source_word: λέγει
  choice: na-ekwu
  rationale: Ọ na-echekwa oge ugbu a nke okwu Grik ahụ ma na-egosi Akwụkwọ Nsọ dị ka olu ka na-ekwu okwu ugbu a.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: Mmụọ Nsọ
  rationale: Nke a bụ ntụgharị Igbo kwesịrị ekwesị nke aha ahụ, na-enweghị itinye nkwusi ike na-adịghị na Grik.
- source_word: Σήμερον
  choice: Taa
  rationale: Ọ bụ okwu oge kpọmkwem nke malitere ihe e hotara n'Abụ Ọma.
- source_word: ἐὰν
  choice: ọ bụrụ na
  rationale: Ọ na-egosi ọnọdụ n'ụzọ kpọmkwem ma bụrụkwa okwu Igbo ebumpụta ụwa.
- source_word: τῆς φωνῆς αὐτοῦ
  choice: olu ya
  rationale: Ọ na-echekwa ihe okwu Grik pụtara n'ụzọ dị nkenke, gosi na ọ bụ olu onye, ọ bụghị naanị ụda.
- source_word: ἀκούσητε
  choice: unu anụ
  rationale: Ọ na-asụgharị isi echiche nke ịnụ ihe ma na-echekwa onye nke abụọ n'ọnụọgụ ọtụtụ; “gee ntị” gaara agbakwụnye echiche irube isi karịa ka okwu a n'onwe ya kwuru.
theological_decisions:
- issue: Onye e kwuru na ọ na-ekwu ihe e hotara n'Abụ Ọma
  choice: E kwuru kpọmkwem na Mmụọ Nsọ na-ekwu ya.
  alternative: Mmụọ Nsọ na-ekwu site n'Akwụkwọ Nsọ ma ọ bụ site n'ọnụ onye dere Abụ Ọma.
  rationale: Grik kwuru hoo haa, “Mmụọ Nsọ na-ekwu.” A hapụrụ nkwupụta a ka ọ dị, n'enweghị ime ka ọ bụrụ naanị okwu mmadụ ma ọ bụ ịgbakwunye nkọwa ozizi gbasara otu Mmụọ Nsọ si kwuo ya.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. “Unu” na-egosi na okwu ahụ bụ maka ọtụtụ mmadụ. Akara rikoma n'ikpeazụ na-egosi na ahịrịokwu e hotara na-aga n'ihu n'amaokwu na-esote.
