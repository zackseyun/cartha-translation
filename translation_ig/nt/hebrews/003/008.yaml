source:
  edition: SBLGNT
  text: μὴ σκληρύνητε τὰς καρδίας ὑμῶν ὡς ἐν τῷ παραπικρασμῷ, κατὰ τὴν ἡμέραν τοῦ πειρασμοῦ ἐν τῇ ἐρήμῳ,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/008.yaml
  text: do not harden your hearts as in the rebellion[a], as on the day of testing in the wilderness,
translation:
  language: ig
  text: unu emela ka obi unu sie ike, dị ka n’oge nnupụisi ahụ[a], n’ụbọchị ule ahụ n’ọzara,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ, ma e soro aha ebe ndị Hibru dị n’azụ Abụ Ọma 95:8: “dị ka na Meriba, n’ụbọchị ule ahụ na Masa n’ọzara.”'
    reason: alternative_reading
lexical_decisions:
- source_word: μὴ σκληρύνητε
  choice: unu emela ka … sie ike
  rationale: 'Nke a na-enye iwu mgbochi kpọmkwem ma na-echekwa olu na-eme ihe: ndị a na-agwa okwu ekwesịghị ime ka obi ha sie ike.'
- source_word: τὰς καρδίας ὑμῶν
  choice: obi unu
  rationale: “Obi” bụ okwu Akwụkwọ Nsọ a na-ejikarị akọwa ime mmadụ—uche, ọchịchọ na ọnọdụ ya—ebe “unu” na-egosi na a na-agwa ọgbakọ dum okwu.
- source_word: ὡς ἐν τῷ παραπικρασμῷ
  choice: dị ka n’oge nnupụisi ahụ
  rationale: “Nnupụisi” na-egosipụta omume Izrel nke ịjụ Chineke ma kpasuo ya iwe; “n’oge” na-eme ka ntụaka ahụ gaa n’ihe mere n’akụkọ ihe mere eme n’ụzọ Igbo dị mma.
- source_word: κατὰ τὴν ἡμέραν
  choice: dịkwa ka n’ụbọchị
  rationale: “Dịkwa ka” na-echekwa ntụnyere nke nkebi nke abụọ na nke mbụ, ebe “n’ụbọchị” bụ ụzọ Igbo nkịtị isi kwuo oge ahụ.
- source_word: τοῦ πειρασμοῦ
  choice: ule ahụ
  rationale: “Ule” na-egosipụta testing/trial n’etinyeghị echiche kpọmkwem nke ọnwụnwa ime mmehie; “ahụ” na-egosi ihe omume amaara nke e zoro aka na ya.
- source_word: ἐν τῇ ἐρήμῳ
  choice: n’ọzara
  rationale: “Ọzara” bụ okwu Igbo doro anya ma kwekọọ na ebe Izrel nọ na-awagharị.
theological_decisions:
- issue: Otu e si sụgharịa ntụaka akụkọ dị na Abụ Ọma 95
  choice: A kọwara okwu Grik ndị ahụ dịka “nnupụisi” na “ụbọchị ule” n’ahịrị bụ isi.
  alternative: “dị ka na Meriba, n’ụbọchị ahụ na Masa n’ọzara”
  rationale: Ndị Hibru 3:8 na-eso okwu Grik nke Septuagint, nke sụgharịrị aha ebe Hibru dịka okwu na-akọwa ihe mere. Ya mere, ahịrị bụ isi na-eso Grik ahụ, ebe nkọwa ala peeji na-echekwa aha ebe ndị dị n’ederede Hibru.
translation_notes:
  register: Ejiri Igbo Izugbe dị ugbu a, dị ùgwù ma dị mfe nghọta. Ahịrị ahụ na-edobe ọdịdị nke nkwupụta e hotara, tinyere rikọm nke na-egosi na amaokwu ahụ na-aga n’ihu.
