  text: τεσσεράκοντα ἔτη· διὸ προσώχθισα τῇ γενεᾷ ⸀ταύτῃ καὶ εἶπον· Ἀεὶ πλανῶνται τῇ καρδίᾳ· αὐτοὶ δὲ οὐκ ἔγνωσαν τὰς ὁδούς μου·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/010.yaml
  text: For forty years[a], therefore, I was provoked with this generation, and said, ‘They always go astray in their hearts[b], but they have not known my ways.’
translation:
  language: ig
  text: N’ime afọ iri anọ[a], n’ihi ya, iwe were m n’ọgbọ a, m wee sị, “Ha na-akpafu mgbe niile n’obi ha[b], ma ha amataghị ụzọ m.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “Iwe were m megide ọgbọ a”; ngwaa Grik ahụ nwere ike igosi oke iwe ma ọ bụ enweghị afọ ojuju siri ike.
    reason: lexical_alternative
  - marker: b
    text: N’asụsụ Grik, “obi” dị n’otu mkpụrụokwu. O yikarịrị ka a na-ele ọgbọ ahụ dum anya dịka otu ìgwè; “obi ha” bụ ụzọ Igbo si ekwu ya n’ụzọ ebumpụta ụwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: τεσσεράκοντα ἔτη
  choice: Ruo iri afọ anọ
  rationale: Ọ na-egosi ogologo oge ahụ, afọ iri anọ, n’ụzọ Igbo na-ada nke ọma n’ọnọdụ a.
- source_word: διὸ
  choice: n’ihi ya
  rationale: Ọ na-echekwa njikọ nke ihe si n’ihe e kwuru tupu ya pụta.
- source_word: προσώχθισα
  choice: ọgbọ a kpasuru m iwe
  rationale: Nke a na-egosi iwe siri ike na enweghị afọ ojuju, ma ọ naghị eme ka okwu ahụ sie ike karịa ihe Grik kwuru.
- source_word: τῇ γενεᾷ ταύτῃ
  choice: ọgbọ a
  rationale: Ọ na-akọwa kpọmkwem ndị ọgbọ ahụ dịka okwu Grik si dị.
- source_word: καὶ εἶπον
  choice: m wee sị
  rationale: Usoro a bụ Igbo ebumpụta ụwa maka ịga n’ihu n’okwu onye na-ekwu.
- source_word: Ἀεὶ πλανῶνται τῇ καρδίᾳ
  choice: Ha na-esi n’obi ha akpafu mgbe niile
  rationale: Ọ na-egosi omume na-aga n’ihu nke ịkpafu nke sitere n’ime mmadụ; ‘obi ha’ bụkwa ụzọ Igbo doro anya ma dị mma isi kwuo otu obi nke a na-ele dịka nke ọgbọ ahụ dum.
- source_word: αὐτοὶ δὲ οὐκ ἔγνωσαν
  choice: ma ha amataghị
  rationale: ‘Ma’ na-echekwa ọdịiche ahụ, ebe ‘amataghị’ na-egosi na ha enwetaghị ịmata ụzọ Chineke n’ezie.
- source_word: τὰς ὁδούς μου
  choice: ụzọ m
  rationale: Ọ na-echekwa ihe atụ Akwụkwọ Nsọ banyere omume Chineke na ụzọ ọ chọrọ ka ndị ya soro.
theological_decisions:
- issue: Ike nke iwe Chineke na προσώχθισα
  choice: ọgbọ a kpasuru m iwe
  alternative: iwe were m megide ọgbọ a; ọgbọ a kpọrọ m asị
  rationale: Nhọrọ a na-echekwa ezi iwe na enweghị afọ ojuju Chineke n’ebe ọgbọ ahụ nọ, ma ọ naghị akwalite ya ruo n’ịkpọ asị ma ọ bụ mee ka ọ dị nro.
- issue: Otu mkpụrụokwu dị na τῇ καρδίᾳ
  choice: n’obi ha
  alternative: n’ime obi ha dị iche iche
  rationale: Igbo ‘obi ha’ na-ada nke ọma ma nwee ike izo aka n’obi nke ndị ahụ dịka otu ìgwè, n’enweghị ịmanye nkọwa na-ele onye ọ bụla n’otu n’otu.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ usoro okwu ebumpụta ụwa, ebe e debere njikọ echiche, ihe atụ ‘ụzọ,’ na ike nke iwe Chineke n’enweghị itinye nkọwa ụka pụrụ iche.
