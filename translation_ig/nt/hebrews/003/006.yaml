id: HEB.3.6
reference: Hebrews 3:6
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Χριστὸς δὲ ὡς υἱὸς ἐπὶ τὸν οἶκον αὐτοῦ· ⸀ὃς οἶκός ἐσμεν ἡμεῖς, ⸀ἐὰν τὴν παρρησίαν καὶ τὸ καύχημα τῆς ⸀ἐλπίδος κατάσχωμεν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/006.yaml
  text: But the Messiah was faithful as a Son over his house[a], whose house we are[c][b], if we hold fast our boldness and the boast of our hope.
translation:
  language: ig
  text: Ma Mesaịa ahụ bụ onye kwesịrị ntụkwasị obi dịka Ọkpara na-achị ụlọ ya[a]. Anyị bụ ụlọ ya, ma ọ bụrụ na anyị ejidesie obi ike anyị na ịnya isi anyị banyere olileanya anyị ike[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Kraịst” n'ọnọdụ “Mesaịa ahụ.” Okwu Grik bụ Χριστός nwere ike ịbụ utu aha (“Mesaịa”) ma ọ bụ okwu yiri aha mmadụ (“Kraịst”).
    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ, “nkwenye siri ike anyị” n'ọnọdụ “obi ike anyị.” Okwu Grik bụ παρρησία nwere ike ịpụta ikwu okwu n'ezoghị ọnụ, ime ihe n'atụghị egwu, ma ọ bụ inwe nkwenye siri ike.
    reason: lexical_alternative
  - marker: c
    text: A pụkwara ịsụgharị ya, “nkwenye olileanya anyị na-enye anyị” ma ọ bụ “ọṅụ dị ukwuu nke olileanya anyị.” Okwu Grik bụ καύχημα nwere ike ịpụta ihe e ji anya isi, ihe mere e ji etu ọnụ, ma ọ bụ nkwenye e ji ṅụrịa ọṅụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Χριστὸς
  choice: Mesaịa ahụ
  rationale: N'ebe a, okwu ahụ na-arụ ọrụ dị ka utu aha n'iji Mesaịa tụnyere Mosis; ‘Mesaịa’ na-egosipụta nke a nke ọma.
- source_word: δὲ
  choice: Ma
  rationale: Ọ na-egosi ọdịiche dị n'etiti Mosis n'amaokwu bu ụzọ na Mesaịa ebe a.
- source_word: ὡς υἱὸς
  choice: dị ka Ọkpara
  rationale: Ọ na-edobe ntụnyere nke ὡς ma jiri ‘Ọkpara’ kpọọ onye a na-ekwu maka ya n'ụzọ dabara adaba n'Igbo.
- source_word: ἐπὶ τὸν οἶκον αὐτοῦ
  choice: na-achị ụlọ ya
  rationale: ἐπί ebe a na-egosi ịbụ onye nọ n'isi ma ọ bụ onye nwere ikike n'elu ụlọ ahụ. ‘Ụlọ’ na-edobe ihe atụ nke ndị Chineke.
- source_word: ὃς οἶκός ἐσμεν ἡμεῖς
  choice: Anyị bụkwa ụlọ ahụ
  rationale: Nke a bụ Igbo doro anya nke na-edobe ihe atụ ahụ n'agbanyeghị na ọ naghị eso usoro okwu Grik kpọmkwem.
- source_word: ἐὰν
  choice: ma ọ bụrụ na
  rationale: Ọ na-edobe ọnọdụ a dị ka ezigbo ọnọdụ n'emeghị ka nkọwa banyere ntachi obi ma ọ bụ ịdapụ n'okwukwe bata na ya.
- source_word: παρρησίαν
  choice: nkwuwa okwu anyị
  rationale: ‘Nkwuwa okwu’ na-egosi ikwu ma ọ bụ ime ihe n'atụghị egwu, n'ụzọ nwere obi ike; a na-enye ‘nkwenye siri ike’ dị ka nhọrọ ọzọ n'ala peeji.
- source_word: καύχημα
  choice: ihe anyị ji ... anya isi
  rationale: Nke a na-egosipụta ihe mmadụ ji etu ọnụ ma ọ bụ ṅụrịa ọṅụ, ma bụrụkwa okwu Igbo eke karịa aha nkịtị a ga-asụgharị n'ụzọ kpọmkwem.
- source_word: τῆς ἐλπίδος
  choice: olileanya anyị
  rationale: Ọ bụ ezie na ‘anyị’ adịghị n'okwu Grik a n'onwe ya, onye mbụ ọtụtụ e ji mee ahịrịokwu ahụ na-eme ka njikọ a doo anya n'Igbo.
- source_word: κατάσχωμεν
  choice: anyị ejidesie ... ike
  rationale: Ọ na-egosi ijigide ihe nke ọma na ịnọgide na ya, nke dabara n'ike agbamume dị n'akwụkwọ Ndị Hibru.
theological_decisions:
- issue: Ma a ga-asụgharị Χριστός dị ka utu aha ka ọ bụ dị ka aha
  choice: Mesaịa ahụ
  alternative: Kraịst
  rationale: Ọnọdụ a na-atụnyere Mosis na Ọkpara ahụ, ya mere ike utu aha ahụ pụtara ìhè; ihe e dere n'ala peeji na-edobe nhọrọ nke aha ‘Kraịst.’
- issue: Ike a ga-enye ọnọdụ ἐὰν ... κατάσχωμεν
  choice: ma ọ bụrụ na anyị ejidesie ... ike
  alternative: ọ bụrụhaala na anyị ejidesie ... ike
  rationale: ‘Ma ọ bụrụ na’ na-edobe ezigbo ọnọdụ dị n'okwu Grik n'ekpebighị ozizi gbasara ntachi obi ma ọ bụ ịdapụ n'okwukwe.
- issue: Onye nwe ‘ụlọ ya’
  choice: ụlọ ya
  alternative: ụlọ Chineke / ụlọ Ọkpara ahụ
  rationale: 'Aha nnọchi ‘ya’ na-edobe nghọtahie ziri ezi nke Grik: ọnọdụ gbara ya gburugburu na-atụ aka n''ụlọ Chineke, ma usoro okwu ahụ nwekwara ike ime ka e jikọta ụlọ ahụ na Ọkpara ahụ. Nsụgharị ahụ anaghị ekpebi ya n''amaghị ama.'
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. ‘Ụlọ’ na-edobe ihe atụ isi nke akụkụ Akwụkwọ Nsọ a. A haziri ngwụcha ahịrịokwu ahụ ka ọ bụrụ Igbo eke, ebe a ka na-edobe ma nkwuwa okwu ma ihe e ji olileanya anya isi. Ihe nrịbama ala peeji [a], [b], na [c] niile dị n'ederede isi.
