  text: τίσιν δὲ ὤμοσεν μὴ εἰσελεύσεσθαι εἰς τὴν κατάπαυσιν αὐτοῦ εἰ μὴ τοῖς ἀπειθήσασιν;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/018.yaml
  text: And to whom did he swear that they would not enter his rest[a], if not to those who disobeyed?
translation:
  language: ig
  text: Ọ̀ bụkwa ndị aṅaa ka ọ ṅụrụ iyi na ha agaghị abanye n’izuike ya, ma ọ bụghị ndị ahụ jụrụ irube isi[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ndị ahụ nupụrụ isi.” Okwu Grik ahụ na-emesi ịjụ nrubeisi ike; n’ebe a, nnupụisi a nwere njikọ chiri anya na ekweghị ekwe (lee Hib. 3:19).
    reason: lexical_alternative
lexical_decisions:
- source_word: τίσιν
  choice: ndị dị aṅaa
  rationale: Ajụjụ a na-ezo aka n’ọtụtụ mmadụ; okwu a na Igbo na-eme ka usoro ajụjụ nkwughachi ahụ doo anya n’enweghị echiche nke ịjụ ọnụ ọgụgụ ha.
- source_word: δὲ
  choice: Ọ bụkwa
  rationale: “-kwa” jikọtara ajụjụ a na usoro ajụjụ nke bu ya ụzọ, n’ebughị echiche nke nnukwu esemokwu n’ime δέ.
- source_word: ὤμοσεν
  choice: ọ ṅụrụ iyi
  rationale: Nke a bụ ụzọ Igbo nkịtị ma dịkwa nsọpụrụ si ekwu mmadụ ikwe ihe n’iyi; ọ na-echekwa ịdị arọ nke ὀμνύω.
- source_word: μὴ εἰσελεύσεσθαι
  choice: na ha agaghị abanye
  rationale: Nkebi infinitive ahụ na-ekwupụta ihe dị n’iyi ahụ; usoro a bụ Igbo sitere n’okike ma na-echekwa ọdịnihu e lere anya site n’oge iyi ahụ.
- source_word: εἰς τὴν κατάπαυσιν αὐτοῦ
  choice: n’izuike ya
  rationale: “Izuike ya” na-echekwa isiokwu κατάπαυσις dị n’Akwụkwọ Ndị Hibru nakwa njikọ ya na Chineke, ebe “banye n’” na-egosipụta ngagharị εἰς.
- source_word: εἰ μὴ
  choice: ma ọ bụghị
  rationale: N’ime ajụjụ nkwughachi a, okwu a na-ewebata azịza a tụrụ anya ya ma na-agbaso ike okwu Grik.
- source_word: τοῖς ἀπειθήσασιν
  choice: ndị ahụ jụrụ irube isi
  rationale: Nhọrọ a na-egosipụta omume ịjụ nrubeisi dị na ἀπειθέω, ma ọ naghị agbanwe okwu ahụ ka ọ bụrụ naanị ekweghị ekwe; ụdị aorist ahụ pụtara ihe n’omume ha mere.
theological_decisions:
- issue: Mmekọrịta dị n’etiti nnupụisi na ekweghị ekwe n’ἀπειθήσασιν
  choice: ndị ahụ jụrụ irube isi
  alternative: ndị ahụ na-ekweghị ekwe
  rationale: Amaokwu a ji ἀπειθέω, ebe amaokwu 19 ji okwu metụtara ekweghị ekwe. Isi odide ahụ na-echekwa ọdịiche mkpụrụokwu ahụ, ebe nkọwa ala peeji na-egosi na echiche abụọ ahụ nwere njikọ chiri anya n’ọnọdụ a.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị mfe nghọta ma dịkwa nsọpụrụ. “N’izuike ya” na-echekwa isiokwu pụrụ iche nke izuike Chineke n’Akwụkwọ Ndị Hibru, ebe “jụrụ irube isi” na-egosipụta omume kpachara anya n’enweghị itinye nkọwa ụka pụrụ iche.
