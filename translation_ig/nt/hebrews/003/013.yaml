id: HEB.3.13
reference: Hebrews 3:13
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀλλὰ παρακαλεῖτε ἑαυτοὺς καθ’ ἑκάστην ἡμέραν, ἄχρις οὗ τὸ Σήμερον καλεῖται, ἵνα μὴ σκληρυνθῇ ⸂τις ἐξ ὑμῶν⸃ ἀπάτῃ τῆς ἁμαρτίας·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/013.yaml
  text: But encourage one another every day[b][a], as long as it is called “Today,” so that none of you may be hardened by the deceitfulness of sin.
translation:
  language: ig
  text: Kama, na-agbarịta ibe unu ume[b] kwa ụbọchị, ọ bụrụhaala na a ka na-akpọ ya “Taa”[a], ka mmehie ghara iji aghụghọ ya mee ka obi onye ọbụla n’ime unu sie ike.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Taa” na-echetara Abụ Ọma 95; ọ na-ekwu maka oge dị ugbu a nke a ga-aza ọkpụkpọ Chineke.
    reason: cross_reference
  - marker: b
    text: A pụkwara ịsị, “na-adụrịta ibe unu ọdụ.” Okwu Grik ahụ nwere ike ịpụta ịgba ume, ịdụ ọdụ, ịrịọsi ike, ma ọ bụ ịkasi obi, dịka ihe gbara ya gburugburu si dị.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Kama
  rationale: Ọ na-egosi ntụgharị siri ike site n’ịdọ aka ná ntị dị n’amaokwu bu ụzọ gaa n’ihe ha kwesịrị ime.
- source_word: παρακαλεῖτε
  choice: na-agbarịta ibe unu ume
  rationale: Ọ na-egosi omume na-aga n’ihu nke ịgba ibe ha ume ma na-adụ ibe ha ọdụ; ihe odide ala peeji na-echekwa obosara okwu Grik ahụ.
- source_word: ἑαυτοὺς
  choice: ibe unu
  rationale: N’agbanyeghị na ọdịdị ya bụ nnọchiaha nlọghachi nke ọtụtụ, n’iwu a ọ na-arụ ọrụ mmekọrịta, ya bụ, onye ọ bụla ime nke a nye ibe ya.
- source_word: καθ’ ἑκάστην ἡμέραν
  choice: kwa ụbọchị
  rationale: Nke a na-egosi na omume ahụ ga-eme ugboro ugboro, ụbọchị niile.
- source_word: ἄχρις οὗ
  choice: ogologo oge a ka
  rationale: Ọ na-echekwa echiche nke oge omume ahụ kwesịrị ịga n’ihu, ọ bụghị naanị njedebe oge.
- source_word: τὸ Σήμερον καλεῖται
  choice: a na-akpọ “Taa”
  rationale: Akara nhota na-echekwa “Taa” dị ka okwu pụrụ iche na-echetara Abụ Ọma 95, ebe ntụgharị a na-edobekwa olu nnara nke καλεῖται.
- source_word: ἵνα μὴ σκληρυνθῇ
  choice: ka ... ghara ... mee ka obi ... sie ike
  rationale: Usoro Igbo a na-egosi nzube nke izere obi ịghọ nke siri ike ma na-ekwupụta passive Grik ahụ n'ụzọ doro anya ma dị eke.
- source_word: τις ἐξ ὑμῶν
  choice: onye ọ bụla n’ime unu
  rationale: N’okpuru nkwusioru ‘ghara,’ nke a na-enye echiche na ọ dịghị otu onye n’ime ha kwesịrị ịdaba n’ihe ahụ.
- source_word: ἀπάτῃ τῆς ἁμαρτίας
  choice: mmehie ... iji aghụghọ ya
  rationale: Ọ na-ewere dative ahụ dị ka ụzọ mmehie si eme ka obi sie ike, ma na-egosi mmehie dịka ihe na-eduhie mmadụ.
theological_decisions:
- issue: Iwu nke ịgba ibe ha ume na ntụgharị ἑαυτούς
  choice: ibe unu
  alternative: onwe unu
  rationale: N’ebe a, iwu nye ọtụtụ mmadụ na-eme ka nnọchiaha nlọghachi ahụ nwee echiche mmekọrịta. “Ibe unu” na-eme ka ibu ọrụ obodo ndị kwere ekwe pụta ìhè n’enweghị itinye nkọwa otu ụka.
- issue: Ihe “Taa” pụtara
  choice: E debere ya n’akara nhota dịka oge dị ugbu a nke ọkpụkpọ Chineke
  alternative: taa dịka naanị ụbọchị nkịtị
  rationale: Ihe gbara amaokwu ahụ gburugburu na-ezo aka n’Abụ Ọma 95. Akara nhota na-echekwa njikọ ahụ na ịdị ngwa ịza Chineke, ebe ihe odide ala peeji na-akọwa ya n’enweghị ịgbasa isiokwu ahụ n’ahịrị amaokwu.
- issue: Onye ma ọ bụ ihe na-eme ka obi sie ike
  choice: mmehie na-eme ya site n’aghụghọ ya
  alternative: ịsị naanị na onye ahụ ‘aghọọ onye obi siri ike’
  rationale: Nke a na-echekwa olu nnara σκληρυνθῇ na instrumental force nke ἀπάτῃ, n’enweghị ikpebi karịa ihe odide ahụ ma Chineke, mmadụ, ma ọ bụ usoro ọzọ bụ onye na-eme ihe ahụ ozugbo.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “Na-agbarịta ibe unu ume” na-egosi omume mmekọrịta na-aga n’ihu; “obi ... sie ike” bụ akpaalaokwu Igbo doro anya maka hardening. E debere akara [b] ozugbo n’akụkụ okwu ọ na-akọwa, ebe [a] dị n’akụkụ “Taa.”
