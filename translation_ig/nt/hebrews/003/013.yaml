revisions:
- from: Kama, na-agbarịta ibe unu ume kwa ụbọchị[b], ogologo oge a ka a na-akpọ “Taa”[a], ka mmehie ghara iji aghụghọ ya mee ka obi onye ọ bụla n’ime unu sie ike.
  to: Kama, na-agbarịta ibe unu ume[b] kwa ụbọchị, ọ bụrụhaala na a ka na-akpọ ya “Taa”[a], ka mmehie ghara iji aghụghọ ya mee ka obi onye ọbụla n’ime unu sie ike.
  rationale: The revision corrects the temporal clause so that it expresses the Greek’s durative limit rather than an unspecified long duration. It also relocates the lexical footnote marker to its proper referent. The reciprocal imperative, the marked Psalm-derived “Taa,” the purpose clause, and the instrumental sense of sin’s deceit are retained.
