id: HEB.3.3
reference: Hebrews 3:3
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: πλείονος γὰρ ⸂οὗτος δόξης⸃ παρὰ Μωϋσῆν ἠξίωται καθ’ ὅσον πλείονα τιμὴν ἔχει τοῦ οἴκου ὁ κατασκευάσας αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/003.yaml
  text: For this one has been counted worthy of more glory than Moses, just as the one who built the house has greater honor than the house.
translation:
  language: ig
  text: N’ihi na a gụọla Onye a ka o kwesịrị inweta ebube karịa nke Mosis, n’ihi na onye wuru ụlọ ahụ nwere nsọpụrụ karịa ụlọ ahụ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὗτος
  choice: Onye a
  rationale: Na-ezo aka n’ebe Jizọs nọ dịka amaokwu ndị gbara ya gburugburu si gosi, ma na-edobe ụzọ ntụaka nke Grik kama itinye aha ahụ ozugbo.
- source_word: δόξης
  choice: otuto
  rationale: ‘Otuto’ bụ okwu Igbo doro anya maka δόξα n’ebe a, nke pụtara ebube ma ọ bụ nsọpụrụ a na-enye onye.
- source_word: ἠξίωται
  choice: e weere ... dị ka onye kwesịrị
  rationale: 'Na-egosipụta perfect passive nke Grik: e kpebiela na Onye a kwesịrị otuto ahụ.'
- source_word: παρὰ Μωϋσῆν
  choice: karịrị nke Mosis
  rationale: 'παρά ya na accusative ebe a na-egosi ntụnyere: otuto nke Onye a karịrị otuto Mosis.'
- source_word: καθ’ ὅσον
  choice: dịka ... si
  rationale: Na-egosipụta ogo ntụnyere na ndabere ihe atụ ahụ n’Igbo na-asụkarị.
- source_word: ὁ κατασκευάσας αὐτόν
  choice: onye wuru ụlọ
  rationale: κατασκευάζω nwere ike ịpụta iwulite, idozi, ma ọ bụ kwadebe; ‘wuru’ dabara kpọmkwem n’ihe atụ ụlọ a ma bụrụ okwu nkịtị doro anya.
- source_word: τιμὴν
  choice: nsọpụrụ
  rationale: Na-edobe ọdịiche okwu dị n’etiti δόξα (‘otuto’) na τιμή (‘nsọpụrụ’).
- source_word: τοῦ οἴκου
  choice: karịrị ụlọ ahụ
  rationale: Na-eme ka ihe e ji atụnyere onye wuru ụlọ pụta ìhè n’Igbo, dịka ihe odide Grik si kwuo.
theological_decisions:
- issue: Onye οὗτος na-ezo aka na ya
  choice: Onye a
  alternative: Jizọs
  rationale: Amaokwu ndị gbara ya gburugburu na-eme ka o doo anya na ọ bụ Jizọs, ma ntụgharị ahụ na-edobe ntụaka nkịtị nke isi mmalite ma ghara ime ka ihe a na-atụghị aha ya bụrụ aha kpọmkwem.
- issue: Mmekọrịta dị n’etiti onye wuru ụlọ na ụlọ
  choice: onye wuru ụlọ ... karịrị ụlọ ahụ
  alternative: onye kwadebere ya ... karịrị ya
  rationale: Nke a na-edobe arụmụka nke onye dere akwụkwọ ahụ n’enweghị ịkọwa n’ime amaokwu a kpọmkwem onye ‘ụlọ’ ahụ ma ọ bụ onye wuru ya bụ.
translation_notes:
  register: Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. E ji ‘Mosis’ mee aha Μωϋσῆς n’ụdị a maara nke ọma n’Igbo. E debeghị akara nkọwa ala peeji n’ihi na ọ dịghị nke dị mkpa n’amaokwu a.
