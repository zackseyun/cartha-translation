revisions:
- from: N’ihi na e weere Onye a dị ka onye kwesịrị otuto karịrị nke Mosis, dịka onye wuru ụlọ si nwee nsọpụrụ karịrị ụlọ ahụ.
  to: N’ihi na a gụọla Onye a ka o kwesịrị inweta ebube karịa nke Mosis, n’ihi na onye wuru ụlọ ahụ nwere nsọpụrụ karịa ụlọ ahụ.
  rationale: The revision preserves the unnamed demonstrative reference (“Onye a”), the contrast between glory and honor, and the house-builder image. It clarifies the inferential force of καθ’ ὅσον without adding an interpretive identification of either the builder or the house.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T21:27:50Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly retains the comparative structure, distinguishes δόξα from τιμή, and keeps the referent of οὗτος unexpanded. However, καθ’ ὅσον expresses the ground/measure of the preceding comparison (“inasmuch as/to the extent that”), rather than a simple illustrative “just as”; the Igbo should make that relationship explicit. The perfect passive ἠξίωται is also better represented by a completed passive assessment.
  naturalness: “Karịrị nke Mosis” is understandable, but “karịa nke Mosis” is more natural in this comparison, and “a gụọla ... ka o kwesịrị inweta” reads more idiomatically while retaining the passive-perfect sense.
  terminology: “Ebube” is the more usual direct equivalent for δόξα in this elevated biblical register, while “nsọpụrụ” suitably renders τιμή. “Mosis” is an appropriate Standard Igbo form of the name.
  issues:
  - severity: medium
    issue: The connector “dịka” does not adequately express καθ’ ὅσον.
    rationale: 'The Greek gives the basis or corresponding measure for Christ’s greater glory: it is because/to the extent that the builder has greater honor than the house. “N’ihi na” preserves this logical relation more clearly in Igbo.'
  - severity: low
    issue: The perfect passive force of ἠξίωται is only loosely represented by “e weere ... dị ka onye kwesịrị.”
    rationale: “A gụọla ... ka o kwesịrị inweta” more naturally conveys that this status has been accorded or judged, with a completed-result nuance.
  revised_text: N’ihi na a gụọla Onye a ka o kwesịrị inweta ebube karịa nke Mosis, n’ihi na onye wuru ụlọ ahụ nwere nsọpụrụ karịa ụlọ ahụ.
  revised_footnotes: []
  revision_rationale: The revision preserves the unnamed demonstrative reference (“Onye a”), the contrast between glory and honor, and the house-builder image. It clarifies the inferential force of καθ’ ὅσον without adding an interpretive identification of either the builder or the house.
