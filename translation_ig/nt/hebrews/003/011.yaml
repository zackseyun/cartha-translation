  text: ὡς ὤμοσα ἐν τῇ ὀργῇ μου· Εἰ εἰσελεύσονται εἰς τὴν κατάπαυσίν μου.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/011.yaml
  text: as I swore in my wrath[a], ‘They shall never enter my rest.’
translation:
  language: ig
  text: Dị ka m ṅụrụ iyi n’iwe m, sị, “Ha agaghị abanye n’izuike m ma ọlị.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’asụsụ Grik, okwu ya kpọmkwem bụ, “Ọ bụrụ na ha ga-abanye n’izuike m.” Nke a bụ usoro e ji aṅụ iyi nke pụtara, “Ha agaghị abanye n’izuike m ma ọlị.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς
  choice: dị ka
  rationale: Ọ na-ejikọta amaokwu a na okwu e hotara n’amaokwu ndị bu ya ụzọ, ma na-egosipụta echiche nke ‘dị ka’ n'ụzọ dị nkenke.
- source_word: ὤμοσα
  choice: m ṅụrụ iyi
  rationale: Nke a bụ ụzọ Igbo nkịtị ma dịkwa nsọpụrụ si ekwu na mmadụ ji iyi kwadoo okwu ya.
- source_word: ἐν τῇ ὀργῇ μου
  choice: n’iwe m
  rationale: ‘Iwe’ bụ okwu Igbo doro anya nke na-eburu ịdị arọ nke iwe Chineke n’ọnọdụ ikpe a, na-enweghị itinye nkọwa okpukpe ọzọ.
- source_word: Εἰ εἰσελεύσονται
  choice: Ha agaghị abanye ... ma ọlị
  rationale: Nke a bụ usoro iyi sitere n’asụsụ Hibru nke Grik depụtaghachiri n’ụdị ‘ọ bụrụ na ha abanye’; ihe ọ pụtara bụ nkwupụta siri ike na ha agaghị abanye. ‘Ma ọlị’ na-egosipụta ike nke ịgọnahụ ahụ n’Igbo.
- source_word: εἰς τὴν κατάπαυσίν μου
  choice: n’izuike m
  rationale: ‘Izuike’ na-echekwa isiokwu banyere izuike Chineke nke akwụkwọ Ndị Hibru na-akọwa, n’ebughị ụzọ kpebie na ọ bụ ala, eluigwe, ma ọ bụ udo nke obi naanị.
theological_decisions:
- issue: Otu e si asụgharị usoro iyi Εἰ εἰσελεύσονται
  choice: “Ha agaghị abanye n’izuike m ma ọlị.”
  alternative: “Ọ bụrụ na ha abanye n’izuike m.”
  rationale: Nsụgharị mkpụrụokwu n’ụdị ‘ọ bụrụ na’ nwere ike ime ka onye Igbo ghọta ya dị ka ọnọdụ nkịtị. Ịgọnahụ ya hoo haa na-echekwa ihe usoro iyi ahụ pụtara na ike ịdọ aka ná ntị ya.
- issue: Ihe κατάπαυσις pụtara n’ebe a
  choice: izuike
  alternative: ebe izuike
  rationale: ‘Izuike’ na-echekwa njikọ ya na Abụ Ọma 95 na arụmụka sara mbara nke Ndị Hibru, n’emeghị ka ihe ọ pụtara bụrụ naanị otu ụdị izuike.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị mfe nghọta ma dịkwa nsọpụrụ. Ahịrịokwu ahụ na-edobe ọdịdị nke okwu Chineke e hotara, ma na-akọwa usoro iyi ahụ n'ụzọ onye Igbo ga-aghọta nke ọma.
