id: HEB.10.29
reference: Hebrews 10:29
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: πόσῳ δοκεῖτε χείρονος ἀξιωθήσεται τιμωρίας ὁ τὸν υἱὸν τοῦ θεοῦ καταπατήσας, καὶ τὸ αἷμα τῆς διαθήκης κοινὸν ἡγησάμενος ἐν ᾧ ἡγιάσθη, καὶ τὸ πνεῦμα τῆς χάριτος ἐνυβρίσας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/029.yaml
  text: How much worse punishment do you think will be deserved by the one who has trampled underfoot the Son of God[a], and has regarded the blood of the covenant by which he was sanctified as common[c][b], and has insulted the Spirit of grace?
translation:
  language: ig
  text: Ùnu chere na ntaramahụhụ ka njọ ole ka a ga-ekpebi na onye zọgidere Ọkpara Chineke n’okpuru ụkwụ, were ọbara nke ọgbụgba ndụ ahụ dị ka ihe nkịtị[a], nke e ji doo ya nsọ[b], ma kparịakwa Mmụọ nke amara[c], kwesịrị?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “dị ka ihe na-adịghị ọcha” ma ọ bụ “dị ka ihe na-adịghị nsọ.”
    reason: lexical_alternative
  - marker: b
    text: N’asụsụ Grik, nkebiokwu “nke e ji doo ya nsọ” jikọtara n’usoro ahịrịokwu ya na onye na-eme mmehie ahụ; ụfọdụ ndị na-akọwa ya na-ewere onye ọ na-ezo aka na ya n’ụzọ ọzọ. Nsụgharị a debere nghọtahie ahụ kama idozi esemokwu nkà mmụta okpukpe ahụ.
    reason: alternative_reading
  - marker: c
    text: Ma ọ bụ, “megbukwaa Mmụọ nke amara n’ụzọ jọgburu onwe ya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πόσῳ … χείρονος
  choice: ntaramahụhụ ka njọ ruo ókè hà aṅaa
  rationale: Nke a na-egosipụta ajụjụ nkwuwa okwu ahụ n’Igbo dị mfe ma debe ntụnyere nke χείρονος, ‘ka njọ.’
- source_word: ἀξιωθήσεται
  choice: ka a ga-ewere na … kwesịrị
  rationale: 'Nke a na-edebe ọdịdị nnara-eme na echiche ikpe nke okwu Grik ahụ: a ga-ekpebi na onye ahụ kwesịrị ntaramahụhụ.'
- source_word: τιμωρίας
  choice: ntaramahụhụ
  rationale: Ọ bụ okwu Igbo doro anya maka ahụhụ a na-enye n’ihi ikpe mara mmadụ.
- source_word: καταπατήσας
  choice: zọnyere … n’okpuru ụkwụ
  rationale: Nke a na-edebe ihe atụ siri ike nke iji nlelị zọgide mmadụ n’ụkwụ.
- source_word: υἱὸν τοῦ θεοῦ
  choice: Ọkpara Chineke
  rationale: Nke a bụ nsụgharị Igbo a maara nke ọma nke aha nsọ ahụ ma debe kpọmkwem njikọ Nna na Ọkpara dị n’ederede.
- source_word: κοινὸν
  choice: ihe nkịtị
  rationale: Okwu a na-egosi ihe a na-ewereghị dị ka ihe dị nsọ; ‘ihe nkịtị’ na-edebe ọdịiche dị n’etiti ihe nkịtị na ihe e doro nsọ, ebe ndetu ala peeji na-enye nghọta ndị ọzọ.
- source_word: ἡγησάμενος
  choice: were … dị ka
  rationale: Nke a bụ ụzọ Igbo ebumpụta ụwa si egosi mkpebi mmadụ mere banyere ụdị ihe ahụ bụ.
- source_word: αἷμα τῆς διαθήκης
  choice: ọbara ọgbụgba ndụ ahụ
  rationale: Nke a na-edebe okwu ọgbụgba ndụ na ihe ọbara pụtara n’àjà n’ụzọ doro anya.
- source_word: ἐν ᾧ
  choice: nke e ji
  rationale: Nke a na-egosi na ọbara ahụ bụ ihe e ji mee ka e doo onye ahụ nsọ, nke dabara n’echiche ngwá ọrụ nke nkebiokwu Grik ahụ.
- source_word: ἡγιάσθη
  choice: doo ya nsọ
  rationale: Nke a na-edebe ọdịdị nnara-eme na echiche nke ikewapụ mmadụ nye Chineke dị ka onye dị nsọ.
- source_word: ἐνυβρίσας
  choice: kparịakwa
  rationale: ‘Ịkparị’ na-egosi okwu ma ọ bụ omume nlelị megide Mmụọ ahụ, n’Igbo dị ike ma dịkwa mfe nghọta.
- source_word: τὸ πνεῦμα τῆς χάριτος
  choice: Mmụọ nke amara
  rationale: Nke a na-edebe usoro okwu Grik ahụ na njikọ ya n’etiti Mmụọ na amara.
theological_decisions:
- issue: Onye okwu ‘e ji doo ya nsọ’ (ἐν ᾧ ἡγιάσθη) na-ezo aka na ya
  choice: 'E dere ya ka ọ na-ezo n’ụzọ kacha nso n’onye na-eme mmehie ahụ: ‘nke e ji doo ya nsọ.’'
  alternative: Ụfọdụ na-ewere ya ka ọ na-ezo aka na Kraịst, n’ọgbụgba ndụ ahụ, ma ọ bụ n’ọgbakọ ahụ kama onye mmehie ahụ.
  rationale: Usoro ahịrịokwu Grik na-ejikọta ‘ya’ n’ụzọ kacha nso na otu onye ahụ participle ndị ahụ na-akọwa. Nsụgharị ahụ na-edebe usoro a na esemokwu nkà mmụta okpukpe dị na ya, kama ikpebi ozizi banyere ndapụ n’okwukwe ma ọ bụ ịnọgide n’okwukwe.
- issue: Ike okwu ἐνυβρίσας megide Mmụọ
  choice: kparịakwa Mmụọ nke amara
  alternative: megbukwaa Mmụọ nke amara n’ụzọ jọgburu onwe ya
  rationale: ‘Kparịa’ na-egosi nlelị na mkparị dị n’okwu ahụ; ndetu na-egosi nsụgharị ka sie ike karịa n’emebighị ederede isi.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-edebe ajụjụ nkwuwa okwu nke Grik, ihe atụ nke ịzọgide n’ụkwụ, na ọdịiche dị n’etiti ihe nkịtị na ihe dị nsọ. E debere akara ndetu [a], [b], na [c] n’ebe okwu ha na-akọwa dị.
