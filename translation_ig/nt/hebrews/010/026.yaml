id: HEB.10.26
reference: Hebrews 10:26
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἑκουσίως γὰρ ἁμαρτανόντων ἡμῶν μετὰ τὸ λαβεῖν τὴν ἐπίγνωσιν τῆς ἀληθείας, οὐκέτι περὶ ἁμαρτιῶν ἀπολείπεται θυσία,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/026.yaml
  text: For if we go on sinning deliberately after receiving the knowledge of the truth[a], there no longer remains a sacrifice for sins,
translation:
  language: ig
  text: N’ihi na, ọ bụrụ na anyị anọgide na-eme mmehie ụma mgbe anyị natachara ihe ọmụma nke eziokwu[a], ọ dịkwaghị àjà fọdụrụ maka mmehie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ihe ọmụma zuru ezu nke eziokwu.” Okwu Grik a nwekwara ike iburu echiche nke ihe ọmụma zuru ezu ma ọ bụ nke mmadụ ji n’aka.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἑκουσίως
  choice: ụma
  rationale: Nke a na-egosi ime ihe n’amaghị ama abụghị ya, kama ime ya site n’uche na mkpebi; ọ bụ okwu Igbo dị mfe ma doo anya.
- source_word: γὰρ
  choice: N’ihi na
  rationale: Ọ na-edobe njikọ nkọwa amaokwu a na arụmụka dị n’amaokwu ndị bu ya ụzọ.
- source_word: ἁμαρτανόντων ἡμῶν
  choice: ọ bụrụ na anyị anọgide na-eme mmehie
  rationale: Ọdịdị participle nke oge ugbu a na-egosi omume na-aga n’ihu ma ọ bụ nke a na-anọgide na-eme, ọ bụghị naanị otu mmehie mere otu ugboro.
- source_word: μετὰ τὸ λαβεῖν
  choice: mgbe anyị natachara
  rationale: Ọ na-egosi na ịnata ihe ọmụma ahụ eburula ụzọ mee tupu ịnọgide na mmehie; ngwụcha -chara na-egosipụta nke a n’Igbo.
- source_word: ἐπίγνωσιν
  choice: ihe ọmụma
  rationale: Nke a bụ nsụgharị nkịtị na nke doro anya; echiche nke ihe ọmụma zuru ezu ma ọ bụ nke miri emi ka edobere n’ala peeji.
- source_word: τῆς ἀληθείας
  choice: nke eziokwu
  rationale: Ọ na-edobe njikọ genitive ahụ n'ụzọ dị mma n’Igbo, n’enweghị ịgbakwụnye nkọwa ozizi nke ederede ahụ ekwughị kpọmkwem.
- source_word: οὐκέτι
  choice: adịghịzi
  rationale: Ọ na-egosi na site n’oge ahụ gaa n’ihu, ọ dịghịzi ihe fọdụrụ.
- source_word: περὶ ἁμαρτιῶν
  choice: maka mmehie
  rationale: N’ọnọdụ metụtara àjà, nke a na-egosi àjà e ji mee ihe banyere mmehie ma ọ bụ n’ihi mmehie.
- source_word: ἀπολείπεται
  choice: ọ bụla ... adịghịzi
  rationale: Nhazi a na-enye echiche nke ‘ọ dịghị nke fọdụrụ’ n’Igbo dị ugbu a ma kwekọọ na οὐκέτι.
- source_word: θυσία
  choice: àjà
  rationale: Ọ bụ okwu Igbo a na-ejikarị eme ihe maka sacrifice, ma dabara na arụmụka Akwụkwọ Ndị Hibru banyere àjà.
theological_decisions:
- issue: Ọdịdị omume na ike ịdọ aka ná ntị nke ἁμαρτανόντων
  choice: “ọ bụrụ na anyị anọgide na-eme mmehie ụma” dị ka omume na-aga n’ihu
  alternative: “ọ bụrụ na anyị emee mmehie ụma”
  rationale: Present participle ahụ na-akwado echiche nke ịnọgide ma ọ bụ ịga n’ihu na mmehie. Nke a na-edobe ịdị arọ nke ịdọ aka ná ntị ahụ n’ebughị ụzọ kpebie na ọ na-ekwu maka otu mmehie e mere nanị otu ugboro.
- issue: Ike nke ἐπίγνωσις n’ọnọdụ ịdọ aka ná ntị
  choice: “ihe ọmụma nke eziokwu” n’isi ederede
  alternative: “ihe ọmụma zuru ezu nke eziokwu” ma ọ bụ “ihe ọmụma nzọpụta nke eziokwu”
  rationale: Ederede ahụ kwuru na ha natara ihe ọmụma nke eziokwu, ma ọ kọwaghị kpọmkwem ogo ahụmahụ ime mmụọ nke ihe ọmụma ahụ. Ya mere, nsụgharị ahụ anaghị ekpebi arụmụka banyere ma ndị a bụ ndị a mụgharịrị ọzọ, ndị na-ekwupụta okwukwe, ma ọ bụ ndị nọ n’ime ọgbakọ ọgbụgba ndụ.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke ugbu a, dị ùgwù ma dị mfe nghọta. E ji “anọgide na-eme” gosipụta omume na-aga n’ihu, ma e zere okwu ụka pụrụ iche nke nwere ike ikpebi esemokwu ozizi. Akara ala peeji [a] dị n’isi ederede dịka achọrọ.
