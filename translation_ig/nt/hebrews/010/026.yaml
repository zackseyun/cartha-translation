revisions:
- from: N’ihi na ọ bụrụ na anyị anọgide na-eme mmehie ụma mgbe anyị natachara ihe ọmụma nke eziokwu[a], àjà ọ bụla maka mmehie adịghịzi,
  to: N’ihi na, ọ bụrụ na anyị anọgide na-eme mmehie ụma mgbe anyị natachara ihe ọmụma nke eziokwu[a], ọ dịkwaghị àjà fọdụrụ maka mmehie.
  rationale: The revision makes the Igbo final clause explicitly convey that no sacrifice for sins remains, matching ἀπολείπεται, while preserving the source’s ambiguity and the draft’s appropriate rendering of the present participle as continued deliberate sinning. The footnote is slightly tightened to mirror the English audit trail’s ‘fuller or decisive knowledge’ nuance without importing a doctrinal conclusion.
