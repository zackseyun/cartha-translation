    text: Ma ọ bụ, “ụmụnne ndị nwoke”; okwu Grik ahụ bụ nke nwoke n’ụdị ya, ma ọ pụrụ ịdị na-agwa ọgbakọ dum okwu.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ebe nsọ ahụ”; n’ihe oyiyi ụlọikwuu dị n’akwụkwọ Ndị Hibru, okwu a na-ezo aka n’ebe nsọ nke ọnụnọ Chineke.
    reason: lexical_alternative
  revision_rationale: Replaced “ebe nsọ dị iche iche” with “ebe nsọ” to avoid adding the sense of varied or separate holy places while retaining the cultic spatial reference and its contextual breadth. The family-address footnote has been clarified without changing the main-text rendering or imposing a gender distinction unnatural to Igbo.
