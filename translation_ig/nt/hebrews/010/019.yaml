id: HEB.10.19
reference: Hebrews 10:19
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἔχοντες οὖν, ἀδελφοί, παρρησίαν εἰς τὴν εἴσοδον τῶν ἁγίων ἐν τῷ αἵματι Ἰησοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/019.yaml
  text: Therefore, brothers, since we have boldness to enter the holy places by the blood of Jesus,
translation:
  language: ig
  text: Ya mere, ụmụnna[a], ebe anyị nwere nkwuwa okwu ịbanye n’ebe nsọ[b] site n’ọbara Jizọs,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ụmụnne ndị nwoke”; okwu Grik ahụ bụ nke nwoke n’ụdị ya, ma ọ pụrụ ịdị na-agwa ọgbakọ dum okwu.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ebe nsọ ahụ”; n’ihe oyiyi ụlọikwuu dị n’akwụkwọ Ndị Hibru, okwu a na-ezo aka n’ebe nsọ nke ọnụnọ Chineke.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔχοντες
  choice: ebe anyị nwere
  rationale: Ọ bụ ezie na okwu Grik a bụ participle nke pụtara ‘anyị nwere,’ n’ebe a ọ na-egosi ihe ndabere nke agbamume na-esote; ‘ebe anyị nwere’ na-egosipụta nke a n’Igbo dị ire.
- source_word: οὖν
  choice: Ya mere
  rationale: Ọ na-egosi nkwubi okwu sitere n’arụmụka gara aga ma na-ejikọta amaokwu a nke ọma na ya.
- source_word: ἀδελφοί
  choice: ụmụnna
  rationale: ‘Ụmụnna’ bụ okwu Igbo e ji akpọ ndị otu ezinụlọ ma ọ bụ ọgbakọ ọnụ; ọ dabara n’okwu a na-agwa ọgbakọ dum ma ghara ịmanye ọdịiche nwoke na nwanyị nke usoro okwu Igbo anaghị egosipụta n’otu ụzọ ahụ Grik si egosi ya.
- source_word: παρρησίαν
  choice: nkwuwa okwu
  rationale: N’ebe a ọ pụtara nnwere onwe na obi ike mmadụ nwere ịbịaru Chineke nso; ‘nkwuwa okwu’ na-edobe ike nke okwu ahụ karịa naanị ‘ntụkwasị obi.’
- source_word: εἰς τὴν εἴσοδον
  choice: ịbanye
  rationale: N’agbanyeghị na Grik ji aha pụtara ‘ụzọ mbata/ịbanye,’ infinitive Igbo bụ ụzọ eke na nke doro anya isi kwuo ikike nke ịbanye.
- source_word: τῶν ἁγίων
  choice: ebe nsọ dị iche iche
  rationale: N’ọnọdụ ihe oyiyi ụlọikwuu dị n’akwụkwọ Ndị Hibru, ọ na-ezo aka n’ebe nsọ nke ọnụnọ Chineke. Nsụgharị a na-edobe ụdị plural nke Grik ma ghara ime ka ọ bụrụ naanị Ebe Kachasị Nsọ.
- source_word: ἐν τῷ αἵματι Ἰησοῦ
  choice: site n’ọbara Jizọs
  rationale: ‘Site na’ na-egosi ụzọ ma ọ bụ ihe ndabere e ji enweta ohere ahụ, ma na-edobe ihe okwu ahụ kwuru banyere àjà n’enweghị ịkọwa ya gabiga ókè.
theological_decisions:
- issue: Ihe τῶν ἁγίων na-ezo aka na ya
  choice: Ebe nsọ nke ọnụnọ Chineke, nke e gosipụtara dịka ‘ebe nsọ dị iche iche’
  alternative: ‘ebe nsọ ahụ’ ma ọ bụ ‘Ebe Kachasị Nsọ’
  rationale: Ihe oyiyi ụlọikwuu na àjà nke gbara amaokwu a gburugburu na-akwado nghọta gbasara ebe nsọ, ọ bụghị ‘ndị nsọ.’ Ịsị ‘Ebe Kachasị Nsọ’ ga-eme ka ihe Grik kwuru saa mbara bụrụ nke kpọmkwem karịa ka ọ dị.
- issue: Ndị ἀδελφοί gụnyere
  choice: ‘ụmụnna’ n’isiokwu, na nkọwa na ọ na-agwa ọgbakọ dum
  alternative: ‘ụmụnne ndị nwoke’ ma ọ bụ ‘ụmụnna nwoke na nwanyị’
  rationale: Grik bụ masculine plural ma ọ nwere ike ịnọchite anya ọgbakọ dum. ‘Ụmụnna’ bụ okwu Igbo eke nke na-edobe okwu ezinụlọ ahụ ma kwe ka nkọwa ala peeji mee ka oke ndị a na-agwa doo anya.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta, dee ya. A họọrọ ‘ụmụnna’ dịka okwu nkịtị e ji agwa otu okwukwe okwu, ‘nkwuwa okwu’ iji chekwaa obi ike na nnwere onwe nke παρρησία, na ‘ebe nsọ dị iche iche’ iji chekwaa plural na obosara nke τῶν ἁγίων.
