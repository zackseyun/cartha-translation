- from: “Nke a bụ ọgbụgba ndụ mụ na ha ga-agba mgbe ụbọchị ndị ahụ gasịrị,” ka Onyenwe anyị kwuru, “site n’itinye iwu m n’obi ha; m ga-edekwa ha n’uche ha.”[a]
  to: “Nke a bụ ọgbụgba ndụ nke m ga-agba na ha mgbe ụbọchị ndị ahụ gasịrị,” ka Onyenwe anyị kwuru, “site n’itinye iwu m n’obi ha; m ga-edekwa ha n’uche ha.”[a]
  rationale: The revision only clarifies that the Lord, not the Lord together with the people, is the one who will make the covenant with them. It retains the Greek verse’s participial first promise and finite future second promise, as well as the existing footnote anchor and its legitimate smoother alternative.
