id: HEB.10.16
reference: Hebrews 10:16
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Αὕτη ἡ διαθήκη ἣν διαθήσομαι πρὸς αὐτοὺς μετὰ τὰς ἡμέρας ἐκείνας, λέγει κύριος, διδοὺς νόμους μου ἐπὶ καρδίας αὐτῶν, καὶ ἐπὶ ⸂τὴν διάνοιαν⸃ αὐτῶν ἐπιγράψω αὐτούς,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/016.yaml
  text: 'This is the covenant that I will make with them after those days[a], says the Lord: putting my laws upon their hearts, and I will write them on their minds,'
translation:
  language: ig
  text: “Nke a bụ ọgbụgba ndụ nke m ga-agba na ha mgbe ụbọchị ndị ahụ gasịrị,” ka Onyenwe anyị kwuru, “site n’itinye iwu m n’obi ha; m ga-edekwa ha n’uche ha.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ikwu ya n’Igbo dị ire ụtọ karịa: “M ga-etinye iwu m n’obi ha, m ga-edekwa ha n’uche ha.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: διαθήκη
  choice: ọgbụgba ndụ
  rationale: Nke a bụ okwu Igbo a na-ejikarị akọwa nkwekọrịta siri ike nke Chineke na ndị ya; ọ na-echekwa njikọ amaokwu a na nkwa ọgbụgba ndụ dị na Jeremaya.
- source_word: διαθήσομαι πρὸς αὐτούς
  choice: mụ na ha ga-agba
  rationale: N’Igbo, a na-asị ‘mụ na ha ga-agba ọgbụgba ndụ’; nke a na-enye πρὸς αὐτούς echiche nke iso ha gbaa ya, ma na-edebe onye na-ekwu okwu dị ka onye ga-eme ya.
- source_word: μετὰ τὰς ἡμέρας ἐκείνας
  choice: mgbe ụbọchị ndị ahụ gasịrị
  rationale: Ọ na-egosipụta oge ahụ kpọmkwem n’Igbo dị ugbu a ma ghara ịkọwa ihe ‘ụbọchị ndị ahụ’ bụ.
- source_word: κύριος
  choice: Onyenwe anyị
  rationale: Nke a bụ nsụgharị Igbo a maara nke ọma maka κύριος n’ọnọdụ ebe Chineke na-ekwu okwu.
- source_word: διδοὺς
  choice: site n’itinye
  rationale: Ụdị a na-echekwa participle Grik ahụ kama ime ka ọ bụrụ ngwaa ọdịnihu ọzọ n’enweghị nkọwa; ‘itinye’ dabara n’ihe atụ nke idebe iwu n’obi.
- source_word: νόμους μου
  choice: iwu m
  rationale: ‘Iwu’ nwere ike igosi otu iwu ma ọ bụ ọtụtụ iwu dịka ọnọdụ okwu si dị; ebe a, ihe nnọchiaha ‘ha’ na-eme ka ọtụtụ ihe e kwuru doo anya.
- source_word: ἐπὶ καρδίας αὐτῶν
  choice: n’obi ha
  rationale: Nke a bụ ụzọ Igbo si ekwu n’ụzọ ebumpụta ụwa na a tinyere ihe n’ime mmadụ; ọ na-echekwa obi dịka ebe ọchịchọ na ndụ ime mmụọ dị.
- source_word: διάνοιαν
  choice: uche
  rationale: ‘Uche’ na-ekpuchi echiche, nghọta, na ikike iche echiche nke διάνοια na-egosi.
- source_word: ἐπιγράψω αὐτούς
  choice: m ga-edekwa ha
  rationale: ‘Ga-ede’ na-egosipụta ọdịnihu, ‘ha’ na-alaghachi n’iwu ndị ahụ, ebe ‘-kwa’ na-ejikọta omume nke abụọ na nke mbụ.
theological_decisions:
- issue: Nhazi ahịrịokwu dị n’okwu Jeremaya e hotara
  choice: E debere διδοὺς dịka participle site n’okwu ‘site n’itinye,’ e mesịa debe ἐπιγράψω dịka ngwaa ọdịnihu ‘m ga-edekwa.’
  alternative: “M ga-etinye iwu m n’obi ha, m ga-edekwa ha n’uche ha.”
  rationale: Nke a na-agbaso ụdị okwu nke Grik Hibru 10:16 n’onwe ya, nke nwere participle na mbụ ma nwee ngwaa ọdịnihu na nke abụọ, kama ime ka ya na nsụgharị Jeremaya ndị a maara nke ọma yie kpamkpam.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. ‘Ọgbụgba ndụ,’ ‘obi,’ na ‘uche’ na-echekwa ihe atụ na okwu nkà mmụta okpukpe nke isi mmalite ahụ. E tinyere akara nkọwa [a] n’ebe ngwụcha ahịrịokwu ahụ n’ihi na nkọwa ahụ metụtara nhazi akụkụ abụọ nke nkwa ahụ dum.
