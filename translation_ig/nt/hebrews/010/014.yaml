  text: μιᾷ γὰρ προσφορᾷ τετελείωκεν εἰς τὸ διηνεκὲς τοὺς ἁγιαζομένους.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/014.yaml
  text: For by one offering he has perfected for all time those who are being sanctified[a].
translation:
  language: ig
  text: N’ihi na n’otu àjà, o meela ndị a na-edo nsọ[a] ka ha zuo oke ruo mgbe ebighị ebi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị a na-eme ka ha dị nsọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μιᾷ
  choice: otu
  rationale: Ọ bụ ọnụọgụ otu nke na-akọwa προσφορᾷ; ‘otu’ na-emesi ike na onyinye ahụ bụ naanị otu.
- source_word: γὰρ
  choice: N’ihi na
  rationale: Ọ na-egosi ihe kpatara ma ọ bụ nkọwa na-ejikọta amaokwu a na arụmụka dị n’ihu ya.
- source_word: προσφορᾷ
  choice: onyinye
  rationale: ‘Onyinye’ bụ okwu sara mbara maka ihe e nyere Chineke, ma ọ ka dabara n’ọnọdụ àjà nke akwụkwọ Ndị Hibru; ‘àjà’ ga-abụkwa nhọrọ nwere ike ime ma ọ na-akọwakwu okwu ahụ.
- source_word: τετελείωκεν
  choice: o meela ... ka ha zuo oke
  rationale: Ụdị perfect ahụ na-egosi ihe e mezuru nke nsonaazụ ya ka na-adịgide; usoro a bụ Igbo dị mfe ma na-echekwa echiche nke ime ka ihe zuo oke.
- source_word: εἰς τὸ διηνεκές
  choice: ruo mgbe ebighị ebi
  rationale: Akpaokwu a na Ndị Hibru na-egosi nsonaazụ na-adịgide adịgide; ‘ruo mgbe ebighị ebi’ bụ okwu Igbo doro anya nke na-egosipụta ịdịgide ahụ.
- source_word: τοὺς ἁγιαζομένους
  choice: ndị a na-edo nsọ
  rationale: Present passive participle ahụ na-egosi ndị ihe a na-eme ka ọ na-aga n’ihu. ‘A na-edo nsọ’ na-echekwa passive na akụkụ omume na-aga n’ihu.
theological_decisions:
- issue: Mmekọrịta dị n’etiti izu oke e mezuru na ido nsọ na-aga n’ihu
  choice: E debere ma ‘o meela ... ka ha zuo oke’ ma ‘ndị a na-edo nsọ.’
  alternative: A pụrụ ịsụgharị ya n’ụzọ ga-eme ka ido nsọ bụrụ naanị ihe e mechara eme, ma ọ bụ n’ụzọ ga-ebelata nsonaazụ izu oke e mezuru.
  rationale: Grik ahụ ji ụma jikọta omume e mezuru nke nsonaazụ ya na-adịgide (τετελείωκεν) na participle na-egosi ido nsọ na-aga n’ihu (ἁγιαζομένους). Nsụgharị ahụ anaghị edozi esemokwu a dịka ozizi otu ụka si dị.
translation_notes:
  register: Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E ji ‘onyinye’ kama ‘àjà’ mee ka ihe προσφορά pụtara ghara ịdị warara karịa Grik, ebe ọnọdụ akwụkwọ ahụ ka na-eme ka ihe gbasara àjà doo anya. Akara ndetu [a] dị n’isiokwu ahụ.
