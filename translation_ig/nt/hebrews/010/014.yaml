revisions:
- from: N’ihi na site n’otu onyinye ahụ, o meela ndị a na-edo nsọ[a] ka ha zuo oke ruo mgbe ebighị ebi.
  to: N’ihi na n’otu àjà, o meela ndị a na-edo nsọ[a] ka ha zuo oke ruo mgbe ebighị ebi.
  rationale: The revision removes the added demonstrative and avoids an unnecessary periphrastic rendering of the instrumental phrase. It uses “àjà” for the sacrificial offering intended by προσφορά in this context, while retaining the deliberate tension between “o meela ... ka ha zuo oke” (completed act with enduring result) and “ndị a na-edo nsọ” (ongoing passive process).
  reviewer_model: gpt-5.6-terra
