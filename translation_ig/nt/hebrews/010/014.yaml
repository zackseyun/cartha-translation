    issue: The demonstrative in “onyinye ahụ” is not represented in the Greek.
    rationale: μιᾷ ... προσφορᾷ means “by/with one offering”; it contains no demonstrative corresponding to “ahụ.”
  - severity: low
    issue: “Site n’otu” unnecessarily recasts the instrumental construction.
    rationale: The dative μιᾷ προσφορᾷ is conveyed more directly and idiomatically here by “n’otu àjà.”
  - severity: low
    issue: “Onyinye” can be too broad outside a sacrificial frame.
    rationale: In Hebrews 10, προσφορά specifically functions within sacrificial language. “Àjà” makes this lexical and contextual sense clear without altering the source meaning.
  revised_text: N’ihi na n’otu àjà, o meela ndị a na-edo nsọ[a] ka ha zuo oke ruo mgbe ebighị ebi.
