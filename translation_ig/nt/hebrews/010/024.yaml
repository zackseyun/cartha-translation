  text: καὶ κατανοῶμεν ἀλλήλους εἰς παροξυσμὸν ἀγάπης καὶ καλῶν ἔργων,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/024.yaml
  text: and let us consider one another[a], to stir up love and good works,
translation:
  language: ig
  text: Ka anyị chebarakwa ibe anyị echiche nke ọma, ka anyị kpalite[a] ịhụnanya na ezi ọrụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “ịkwalite” ma ọ bụ “ịkpali” ịhụnanya na ezi ọrụ. Aha Grik παροξυσμός nwere ike ịpụta mkpali siri ike ma ọ bụ mkpasu.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατανοῶμεν
  choice: Ka anyị na-echebara … echiche
  rationale: Ụdị ngwaa a bụ okwu agbamume nke onye na-ekwu okwu tinyere onwe ya na ya. “Ichebara … echiche” na-egosi ilebara mmadụ anya nke ọma ma tụlee ya, ọ bụghị nanị iche echiche n’ụzọ nkịtị.
- source_word: ἀλλήλους
  choice: ibe anyị
  rationale: Nke a bụ ụzọ Igbo nkịtị si egosi omume ndị otu na-emere ibe ha, ma dabara n’agbamume a na-enye ọgbakọ.
- source_word: εἰς
  choice: iji
  rationale: N’ebe a, εἰς na-egosi ebumnuche ma ọ bụ ihe a chọrọ ka ntụle ahụ rụpụta. “Iji” na-ewebata ebumnuche ahụ nke ọma n’Igbo.
- source_word: παροξυσμὸν
  choice: kpalite
  rationale: Aha Grik a na-egosi mkpali siri ike ma ọ bụ ịkwali ihe ka ọ malite ịrụ ọrụ. “Kpalite” na-echekwa ike okwu ahụ, ma ọ naghị enye ya ụda ọjọọ ebe ihe a na-akpalite bụ ịhụnanya na ezi ọrụ.
- source_word: ἀγάπης
  choice: ịhụnanya
  rationale: “Ịhụnanya” bụ okwu Igbo doro anya ma bụrụkwa ntụgharị kwesịrị ekwesị nke ἀγάπη n’ebe a.
- source_word: καλῶν ἔργων
  choice: ezi ọrụ
  rationale: Nke a na-edobe usoro adjective na noun nke Grik ma na-ezere itinye echiche pụrụ iche banyere uru mmadụ na-enweta site n’ọrụ.
- source_word: καὶ
  choice: -kwa; na
  rationale: “-kwa” jikọtara agbamume a na ihe bu ya ụzọ, ebe “na” jikọtara ịhụnanya na ezi ọrụ n’ụzọ nkịtị n’Igbo.
theological_decisions:
- issue: Ụda okwu παροξυσμός nwere ike ịbụ nke na-adịghị mma
  choice: Jiri “kpalite” n’ahịrị bụ isi dị ka mkpali siri ike nke na-eduga n’ịhụnanya na ezi ọrụ.
  alternative: “ịgba ibe anyị ume nke ukwuu” ma ọ bụ “ịkwali ibe anyị” n’ịhụnanya na ezi ọrụ
  rationale: Okwu Grik ahụ nwere ike ịpụta ịkpasu iwe ma ọ bụ ịkpali n’ike, ma ihe ndị so ya ozugbo—ịhụnanya na ezi ọrụ—na-egosi ebumnuche dị mma. “Kpalite” na-echekwa ike ya n’enweghị itinye ajọ ebumnuche.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ugwu ma dị mfe nghọta. Ahịrịokwu ahụ na-edobe ụdị agbamume nke Grik, mmekọrịta nke “ibe anyị,” njikọ ya na amaokwu bu ụzọ site na “-kwa,” na ike dị n’okwu παροξυσμός.
