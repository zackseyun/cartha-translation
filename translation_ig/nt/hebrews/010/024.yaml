  naturalness: “Ka anyị chebarakwa ibe anyị echiche nke ọma” is smoother than the progressive form “Ka anyị na-echebarakwa…,” while retaining the communal exhortation and the connective force of καί.
  terminology: “Ịhụnanya” and “ezi ọrụ” are suitable, modern renderings. “Kpalite” appropriately expresses the strong positive stimulation of παροξυσμός. The footnote should offer alternatives that modify love and good works directly, rather than adding “ibe anyị” to the Greek expression.
  issues:
