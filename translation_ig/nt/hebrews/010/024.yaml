    issue: The footnote alternatives add “ibe anyị” (‘one another’) as the object of the alternative expression.
    rationale: παροξυσμόν is governed by εἰς and is followed by ‘of/to love and good works’; it does not itself say ‘spur one another on.’ The main thought can imply mutual action, but the lexical footnote should retain the source construction.
  - severity: low
    issue: The progressive wording “Ka anyị na-echebarakwa…” is less direct for the hortatory subjunctive.
    rationale: A simple hortatory construction is more natural and direct in this brief exhortation.
