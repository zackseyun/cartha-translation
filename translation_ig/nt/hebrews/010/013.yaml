base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/013.yaml
  text: from then on waiting until his enemies are made a footstool for his feet[b][a],
translation:
  language: ig
  text: Site n’oge ahụ gaa n’ihu, ọ nọ na-echere[a] ruo mgbe e mee ndị iro ya ka ha bụrụ ihe mgbakwasị ụkwụ ya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “na-atụ anya” ma ọ bụ “na-eche.” Okwu Grik ahụ nwere ike igosi ichere n’atụmatụ.
    reason: lexical_alternative
  - marker: b
    text: 'Okwu a na-ekwughachi Abụ Ọma 110:1: “Nọdụ n’aka nri m ruo mgbe m mere ndị iro gị ihe mgbakwasị ụkwụ gị.”'
    reason: cross_reference
lexical_decisions:
- source_word: τὸ λοιπὸν
  choice: Site n’oge ahụ gaa n’ihu
  rationale: Nkebiokwu a na-arụ ọrụ dịka nkọwa oge, na-egosi ihe na-aga n’ihu mgbe Kraịst nọchara ala dịka amaokwu bu ụzọ kwuru.
- source_word: ἐκδεχόμενος
  choice: ọ nọ na-echere
  rationale: Nke a na-egosi ọnọdụ ichere nke na-aga n’ihu, ma ọ nwekwara echiche nke ịtụ anya ihe a maara na ọ ga-eme.
- source_word: ἕως
  choice: ruo mgbe
  rationale: Ọ na-egosi njedebe oge nke ichere ahụ n'ụzọ doro anya ma bụrụkwa Igbo e ji eme ihe ugbu a.
- source_word: τεθῶσιν
  choice: e mere ... ka ha bụrụ
  rationale: Nke a na-echekwa olu nnara nke ngwaa Grik ma na-adaba nke ọma na aha-ọrụ ‘ihe mgbakwasị ụkwụ.’
- source_word: οἱ ἐχθροὶ αὐτοῦ
  choice: ndị iro ya
  rationale: Nke a bụ ntụgharị kpọmkwem na nke e ji asụ Igbo n'ụzọ nkịtị.
- source_word: ὑποπόδιον τῶν ποδῶν αὐτοῦ
  choice: ihe mgbakwasị ụkwụ ya
  rationale: Ọ na-echekwa ihe atụ ocheeze eze sitere n’Abụ Ọma 110:1, na-enweghị ịkọwa ya naanị dịka imeri ndị iro.
theological_decisions:
- issue: Ihe atụ banyere ọchịchị Mesaịa sitere n’Abụ Ọma 110:1
  choice: Chekwaa okwu ahụ bụ ‘ihe mgbakwasị ụkwụ ya.’
  alternative: ruo mgbe e meriri ndị iro ya; ruo mgbe e debere ndị iro ya n’okpuru ụkwụ ya
  rationale: Onye dere Ndị Hibru kpachaara anya kpọọ ihe atụ dị n’Abụ Ọma 110:1. Ịhapụ ihe mgbakwasị ụkwụ ahụ n’ụdị a na-echekwa njikọ Akwụkwọ Nsọ na ike echiche ọchịchị ahụ, na-enweghị itinye nkọwa karịrị ihe ederede kwuru.
translation_notes:
  register: Ejiri Standard Igbo dị ugbu a, nke nwere ugwu ma dịkwa mfe nghọta. A haziri usoro okwu ahụ ka ọ jikọọ nke ọma na ọnọdụ amaokwu bu ụzọ, ma chekwaa ihe atụ eze na ọchịchị dị n’asụsụ mmalite.
