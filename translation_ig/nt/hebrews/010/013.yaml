revisions:
- from: Site n’oge ahụ gaa n’ihu, ọ nọ na-echere[a] ruo mgbe e mere ndị iro ya ka ha bụrụ ihe mgbakwasị ụkwụ ya[b].
  to: Site n’oge ahụ gaa n’ihu, ọ nọ na-echere[a] ruo mgbe e mee ndị iro ya ka ha bụrụ ihe mgbakwasị ụkwụ ya[b].
  rationale: The revision changes only the Igbo verbal form in the temporal clause, from completed “e mere” to prospective/subjunctive “e mee,” thereby representing the Greek construction more faithfully. It also removes an unsupported object from the lexical footnote. The Psalm 110 imagery and the ambiguity-free, non-paraphrastic wording are retained.
  reviewer_model: gpt-5.6-terra
