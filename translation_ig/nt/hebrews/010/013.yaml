review_pass:
  verdict: revise
  source_fidelity: The temporal sequence, ongoing waiting, passive action, enemies, and Psalm 110 footstool image are all retained. However, “e mere” is a completed/past-form reading and does not suitably represent the prospective dependent passive subjunctive τεθῶσιν after ἕως; “e mee” is required here.
  naturalness: The sentence is clear, idiomatic Standard Igbo, and appropriately continues the preceding context. “Site n’oge ahụ gaa n’ihu” and “ọ nọ na-echere” are natural. The revised verb form makes the temporal clause natural as well.
  terminology: “Ndị iro ya” and “ihe mgbakwasị ụkwụ ya” are suitable, retaining the concrete enthronement image without theological paraphrase. Footnote a must not offer “na-echere ọbịbịa ya,” since the Greek supplies no object such as “his coming.”
  issues:
  - severity: medium
    issue: The main text uses “e mere” after “ruo mgbe.”
    rationale: This reads as a completed past passive (“were made”), whereas τεθῶσιν is an aorist passive subjunctive in a clause marking the awaited endpoint. “Ruo mgbe e mee...” preserves the prospective/passive sense in Igbo.
  - severity: medium
    issue: Footnote a adds “ọbịbịa ya” (“his coming”) as a lexical alternative.
    rationale: ἐκδεχόμενος means waiting/expecting/awaiting, but no object, and specifically no “coming,” appears in the Greek. The note should state only supported lexical alternatives.
  revised_text: Site n’oge ahụ gaa n’ihu, ọ nọ na-echere[a] ruo mgbe e mee ndị iro ya ka ha bụrụ ihe mgbakwasị ụkwụ ya[b].
