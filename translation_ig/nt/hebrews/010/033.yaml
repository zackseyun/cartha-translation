  text: sometimes being publicly exposed to insults and afflictions[b][a], and at other times becoming partners with those who were treated that way.
translation:
  language: ig
  text: N'otu akụkụ, e ji mkparị na mkpagbu mee unu ihe ngosi n'ihu ọha[a]; n'akụkụ nke ọzọ, unu so ndị e mesoro otu ahụ kerịta ahụhụ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N'ụzọ doro anya karịa n'onyinyo okwu ahụ, “e mere unu ihe nkiri n'ihu ọha.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “unu ghọrọ ndị mmekọ nke ndị na-ebi ndụ ma ọ bụ na-akpa àgwà otu a.” Okwu Grik ahụ pụrụ izo aka n'ụzọ mmadụ si ebi ndụ; ma ọnọdụ mkparị na mkpagbu ebe a na-akwado nghọta “ndị e mesoro otu ahụ.”
    reason: alternative_reading
lexical_decisions:
- source_word: τοῦτο μὲν ... τοῦτο δὲ
  choice: Mgbe ụfọdụ ... mgbe ụfọdụkwa
  rationale: Usoro a na-egosi ụzọ abụọ ahụmahụ ha gara aga siri dị; okwu Igbo a bụ nke dị mfe ma na-egosipụta nkewa ahụ nke ọma.
- source_word: ὀνειδισμοῖς
  choice: mkparị
  rationale: Ọ na-egosi okwu ihere, nkọcha, ma ọ bụ mmegbu e ji ọnụ eme; “mkparị” bụ okwu Igbo doro anya ma kwekọọ n'ọnọdụ a.
- source_word: θλίψεσιν
  choice: mkpagbu
  rationale: N'ọnọdụ a, okwu ahụ na-ezo aka ná nsogbu na ahụhụ ndị iro kpatara; “mkpagbu” na-edobe ịdị arọ nke ọnọdụ ahụ.
- source_word: θεατριζόμενοι
  choice: e ji ... mee unu ihe nkiri n'ihu ọha
  rationale: Okwu Grik ahụ na-enye onyinyo mmadụ e gosipụtara n'ihu ọha dị ka ihe nkiri ka e wee menye ya ihere; nsụgharị a na-edobe onyinyo ahụ nke ọma.
- source_word: κοινωνοὶ
  choice: ndị ... so kerịta ahụhụ
  rationale: Ọ na-egosi iso ndị ọzọ nwee oke n'ihe ha na-agabiga, ọ bụghị naanị ịbụ enyi ha; itinye “ahụhụ” na-eme ka njikọ ya na ọnọdụ mkpagbu doo anya.
- source_word: τῶν οὕτως ἀναστρεφομένων
  choice: ndị e mesoro otu ahụ
  rationale: Ọ bụ ezie na participle a nwekwara ike ịpụta ndị na-ebi ndụ ma ọ bụ na-akpa àgwà otu ahụ, ọnọdụ mkparị na mkpagbu na-akwado nghọta nke ndị e mesoro otu ahụ.
- source_word: γενηθέντες
  choice: unu ghọrọ
  rationale: Nke a na-egosi na ha batara n'ọnọdụ nke iso ndị a na-emegbu emegbu kerịta ahụhụ ha.
theological_decisions:
- issue: Ihe ἀναστρεφομένων pụtara n'ọnọdụ a
  choice: ndị e mesoro otu ahụ
  alternative: ndị biri ndụ ma ọ bụ kpara àgwà otu ahụ
  rationale: Amaokwu gbara ya gburugburu na-ekwu banyere mkparị, mkpagbu, na iso ndị a na-emegbu emegbu nwee oke. Ya mere, nghọta nke mmeso a mesoro ha dabara nke ọma, ma a hapụrụ nghọta ọzọ n'ihe odide ala peeji iji chekwaa mgbagwoju anya dị n'okwu Grik ahụ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ “mee unu ihe nkiri n'ihu ọha” iji chekwaa onyinyo doro anya nke θεατριζόμενοι, ebe e debere mgbagwoju anya nke ἀναστρεφομένων n'ihe odide ala peeji.
