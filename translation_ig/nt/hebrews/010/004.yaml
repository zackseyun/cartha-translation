  yaml_path: translation/nt/hebrews/010/004.yaml
  text: For it is impossible for the blood of bulls and goats to take away sins[a].
translation:
  language: ig
  text: N’ihi na ọ gaghị ekwe omume ka ọbara oke ehi na ewu wepụ mmehie[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “kpochapụ mmehie.” Ngwaa Grik a nwere ike ịpụta iwepụ ma ọ bụ ikpochapụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀδύνατον
  choice: ọ gaghị ekwe omume
  rationale: 'Nkọwa a na-egosipụta adjective ahụ dị ka okwu na-abụghị nke onye kpọmkwem ma jigide ike ya zuru oke: ihe ahụ agaghị ekwe omume.'
- source_word: γὰρ
  choice: N’ihi na
  rationale: Ọ na-ejikọta amaokwu a na arụmụka bu ya ụzọ dịka ihe kpatara ma ọ bụ nkọwa nkwado.
- source_word: αἷμα
  choice: ọbara
  rationale: E jigidere okwu nkịtị gbasara ọbara àjà, ebe ọ bụ isi okwu n’arụmụka Hibru.
- source_word: ταύρων
  choice: oke ehi
  rationale: Nke a na-enye ụdị anụmanụ ahụ n’Igbo doro anya ma kwekọọ na genitive plural n’echiche mkpokọta.
- source_word: τράγων
  choice: ewu
  rationale: τράγος bụ ewu nwoke kpọmkwem, ma “ewu” bụ okwu Igbo nkịtị na nke dabara n’asụsụ àjà ebe mmekọahụ anụmanụ abụghị isi ihe a na-emesi ike.
- source_word: ἀφαιρεῖν
  choice: wepụ
  rationale: “Wepụ” na-eburu echiche iwepụ ihe kpamkpam, ma na-ahapụkwa ike okwu Grik ahụ n’enweghị ịgbakwunye nkọwa ozizi.
- source_word: ἁμαρτίας
  choice: mmehie
  rationale: “Mmehie” nwere ike ịrụ ọrụ dịka aha mkpokọta ma ọ bụ ọtụtụ n’Igbo, ya mere ọ na-anọchite plural Grik ahụ n'ụzọ eke.
theological_decisions:
- issue: Ike àjà anụmanụ n’arụmụka Hibru
  choice: Amaokwu ahụ kwuru na ọbara anụmanụ enweghị ike iwepụ mmehie n’echiche ikpeazụ nke arụmụka ahụ.
  alternative: Àjà ndị ahụ kpuchiri mmehie nwa oge ma ọ bụ mee ka mmadụ dị ọcha n’usoro ofufe n’enweghị iwepụ mmehie n’ikpeazụ.
  rationale: Isi ederede anabataghị otu nkọwa ozizi kpọmkwem; “wepụ mmehie” na-anọ nso n’asụsụ Grik ma na-echekwa esemokwu dị n’etiti àjà ndị a na-eme ugboro ugboro na àjà dị irè e kwuru banyere ya n’akụkụ ndị ọzọ.
translation_notes:
  register: Standard Igbo nke oge a, dị mfe nghọta ma nwee ugwu. A họọrọ usoro okwu eke “ọ gaghị ekwe omume ka…” ma jigide “ọbara” na “mmehie” dịka okwu ndị bụ isi n’arụmụka ahụ.
