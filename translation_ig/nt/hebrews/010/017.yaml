revisions:
- from: Agaghịkwa m echeta mmehie ha na omume mmebi iwu ha ọzọ.[a][b]
  to: Na agaghị m echeta mmehie ha na omume mmebi iwu ha ọzọ.[a][b]
  rationale: The revision explicitly renders the initial conjunction with “Na” and removes the redundant pairing of -kwa and ọzọ. It keeps the source’s sequence, distinction between sins and lawless deeds, future divine first-person statement, and biblical non-remembrance idiom.
