  text: and I will no longer remember their sins and their lawless deeds[a][b].
translation:
  language: ig
  text: Na agaghị m echeta mmehie ha na omume mmebi iwu ha ọzọ.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ, n''ụzọ na-egosipụta nkwụsi ike nke okwu Grik ahụ nke ọma karị: “N’ezie, agaghị m echeta mmehie ha na omume mmebi iwu ha ọzọ.”'
    reason: lexical_alternative
  - marker: b
    text: “Omume mmebi iwu” sụgharịrị ἀνομίαι; a pụkwara ịsụgharị ya “omume megidere iwu” ma ọ bụ, dịka nsụgharị ọdịnala si kwuo, “ajọ omume.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: -kwa
  rationale: E ji mgbakwunye “-kwa” malite ahịrịokwu ahụ iji gosi na ọ na-aga n'ihu n'okwu e hotara n'amaokwu bu ụzọ.
- source_word: τῶν ἁμαρτιῶν αὐτῶν
  choice: mmehie ha
  rationale: Nke a bụ ntụgharị kpọmkwem, dị mfe, nke aha ọtụtụ ἁμαρτιῶν na nnọchiaha αὐτῶν.
- source_word: καὶ τῶν ἀνομιῶν αὐτῶν
  choice: na omume mmebi iwu ha
  rationale: ἀνομίαι na-egosi omume ndị megidere iwu; “omume mmebi iwu” na-eme ka ọtụtụ ahụ pụta ìhè n'Igbo nke oge a.
- source_word: οὐ μὴ μνησθήσομαι
  choice: Agaghị m echeta
  rationale: Ụdị a na-egosipụta nkwụsi ike nke njụ emphatic οὐ μή tinyere ngwaa ọdịnihu, ma na-edowe okwu atụ nke icheta kama ịkọwa ya n'ụzọ nkà mmụta okpukpe.
- source_word: ἔτι
  choice: ọzọ
  rationale: N'usoro njụ a, “ọzọ” pụtara ‘ọ bụghịkwa ọzọ’ ma ọ bụ ‘site ugbu a gaa n'ihu, agaghịkwa,’ n'ụzọ dị mma n'Igbo.
theological_decisions:
- issue: Chineke agaghị echeta mmehie
  choice: 'E debere okwu ahụ n''ụzọ kwụ ọtọ: “Agaghịkwa m echeta ... ọzọ.”'
  alternative: “Agaghị m eji mmehie ha na omume mmebi iwu ha megide ha ọzọ.”
  rationale: Nhọrọ bụ isi na-echekwa okwu Baịbụl banyere Chineke ‘icheta’ ma ọ bụ ‘ịghara icheta,’ n'ebughị ụzọ kpebie na nke a bụ ọnwụ ihe ọmụma ma ọ bụ naanị ịghara ịta mmadụ ahụhụ.
translation_notes:
  register: Standard Igbo; asụsụ dị ugbu a, dị ùgwù, ma dị mfe nghọta. E debere njikọ ya na amaokwu bu ụzọ site na “-kwa,” ma e chekwara nkwughachi nke ‘mmehie’ na ‘omume mmebi iwu.’
