revisions:
- from: N’ihi na Iwu ahụ nwere naanị onyinyo nke ihe ọma ndị gaje ịbịa, ọ bụghị ọdịdị n’ezie nke ihe ndị ahụ[a]. Ya mere, Iwu ahụ apụghị mgbe ọ bụla iji otu àjà ndị ahụ ha na-achụ mgbe niile, kwa afọ, mee ka ndị na-abịaru nso[b] zuo oke[c].
  to: N’ihi na Iwu ahụ nwere naanị onyinyo nke ihe ọma ndị gaje ịbịa, ọ bụghị oyiyi n’onwe ya nke ihe ndị ahụ[a], ọ pụghị mgbe ọ bụla site n’àjà ndị ahụ a na-emegharị, ndị ha na-achụ kwa afọ na-aga n’ihu, ime ka ndị na-abịaru nso[b] zuo oke[c].
  rationale: E wepụrụ njikọ nkwubi okwu na-adịghị na Grik, dochie “ọdịdị n’ezie” anya na “oyiyi n’onwe ya” iji soro εἰκών na αὐτήν, ma hazie nkebi àjà ahụ ka ọ bụrụ Igbo eke nke na-echekwa àjà ndị a na-emegharị, omume ịchụ ha, ugboro kwa afọ, na ịga n’ihu. Ihe passage ahụ pụtara agbanweghị.
