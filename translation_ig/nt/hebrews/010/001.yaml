    rationale: εἰκών bụ “oyiyi/image/representation,” ọ bụghị “ọdịdị” n’ozuzu. “Oyiyi n’onwe ya” na-echekwa ihe atụ onyinyo–oyiyi na nkwusi ike αὐτήν nke ọma.
  - severity: low
