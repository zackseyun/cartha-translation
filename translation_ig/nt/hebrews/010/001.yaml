id: HEB.10.1
reference: Hebrews 10:1
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Σκιὰν γὰρ ἔχων ὁ νόμος τῶν μελλόντων ἀγαθῶν, οὐκ αὐτὴν τὴν εἰκόνα τῶν πραγμάτων, κατ’ ἐνιαυτὸν ταῖς αὐταῖς θυσίαις ἃς προσφέρουσιν εἰς τὸ διηνεκὲς οὐδέποτε ⸀δύναται τοὺς προσερχομένους τελειῶσαι·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/001.yaml
  text: For since the law has only a shadow of the good things to come[a], not the very form of the realities, it can never, by the same sacrifices that they continually offer year after year[c][b], perfect those who draw near.
translation:
  language: ig
  text: N’ihi na Iwu ahụ nwere naanị onyinyo nke ihe ọma ndị gaje ịbịa, ọ bụghị oyiyi n’onwe ya nke ihe ndị ahụ[a], ọ pụghị mgbe ọ bụla site n’àjà ndị ahụ a na-emegharị, ndị ha na-achụ kwa afọ na-aga n’ihu, ime ka ndị na-abịaru nso[b] zuo oke[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ọ bụghị oyiyi ahụ n’onwe ya nke ihe ndị ahụ.”
    reason: lexical_alternative
  - marker: b
    text: “Ndị na-abịaru nso” pụtara ndị na-abịaru Chineke nso n’ofufe.
    reason: cultural_note
  - marker: c
    text: Ma ọ bụ, “mee ka ha zuo oke,” ma ọ bụ “mee ka ha ruo na njedebe e zubere.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Σκιὰν
  choice: onyinyo
  rationale: “Onyinyo” na-echekwa ihe atụ ahụ nke ihe na-egosi ihe ga-abịa ma ọ bụghị ihe ahụ n’onwe ya.
- source_word: τῶν μελλόντων ἀγαθῶν
  choice: nke ihe ọma ndị gaje ịbịa
  rationale: Nke a na-echekwa echiche nke ihe ọma ndị ka dị n’ihu n’etinyeghị oge nkà mmụta okpukpe a na-akọwaghị n’amaokwu ahụ.
- source_word: οὐκ αὐτὴν τὴν εἰκόνα τῶν πραγμάτων
  choice: ọ bụghị ọdịdị n’ezie nke ihe ndị ahụ
  rationale: “Ọdịdị n’ezie” na-egosi ihe zuru oke nke a na-atụnyere “onyinyo,” ebe “ihe ndị ahụ” na-ahapụ obosara okwu πραγμάτων dịka Grik si dị.
- source_word: κατ’ ἐνιαυτὸν
  choice: kwa afọ
  rationale: Ọ na-egosi àjà ndị a na-eme ugboro ugboro n’afọ ọ bụla.
- source_word: ταῖς αὐταῖς θυσίαις
  choice: iji otu àjà ndị ahụ
  rationale: “Iji” na-egosi na àjà ndị ahụ bụ ụzọ e si anwa ime ka ndị na-abịaru nso zuo oke; “otu” na-echekwa nkwusi ike n’àjà ndị ahụ a na-emeghachi.
- source_word: ἃς προσφέρουσιν εἰς τὸ διηνεκές
  choice: ha na-achụ mgbe niile
  rationale: Ọ na-echekwa olu na-eme ihe na omume a na-aga n’ihu, ma hapụkwa ndị “ha” na-ezo aka na ha dịka isi Grik si hapụ ya.
- source_word: οὐδέποτε δύναται
  choice: apụghị mgbe ọ bụla
  rationale: Nke a na-echekwa ma enweghị ike ahụ ma nkwugide zuru oke nke οὐδέποτε.
- source_word: τοὺς προσερχομένους
  choice: ndị na-abịaru nso
  rationale: Ọ na-echekwa okwu ịbịaru nso ahụ n’emeghị ka ihe e zoro ezo—ịbịaru Chineke nso n’ofufe—ghọọ ihe e kwuru kpọmkwem n’ahịrị isi.
- source_word: τελειῶσαι
  choice: mee ka … zuo oke
  rationale: “Zuo oke” na-echekwa okwu dị mkpa n’Akwụkwọ Ndị Hibru banyere iru ebumnuche a chọrọ na inweta ohere ịbịaru Chineke nso, n’emeghị ka ọ bụrụ naanị izu oke n’omume.
theological_decisions:
- issue: Otu e si kwuo ọdịiche dị n’etiti onyinyo na ezi ihe n’usoro àjà
  choice: Iwu ahụ nwere onyinyo nke ihe ọma ndị ga-abịa, ma ọ bụghị ọdịdị n’ezie nke ihe ndị ahụ.
  alternative: Iwu ahụ bụ ihe nnọchianya zuru ezu nke ihe ọma ndị ahụ.
  rationale: Grik na-ekewa σκιά na εἰκών/πράγματα n'ụzọ doro anya. Nsụgharị a na-echekwa ọrụ Iwu ahụ nke igosi ihe ga-abịa, ma ọ naghị eme ka ọ bụrụ eziokwu ikpeazụ ahụ n’onwe ya.
- issue: Ihe τελειῶσαι pụtara n’ihe gbasara àjà
  choice: mee ka … zuo oke
  alternative: mee ka … ruo na njedebe e zubere
  rationale: “Zuo oke” na-echekwa okwu nkà mmụta okpukpe a na-emegharị n’Akwụkwọ Ndị Hibru, ebe nkọwa ala peeji na-egosi na ọ pụkwara ịpụta iru ebumnuche ma ọ bụ mmezu, ọ bụghị nanị enweghị ntụpọ n’omume.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta, dee ya. E kewara ahịrịokwu ogologo Grik ahụ ụzọ abụọ iji mee ka ọ doo anya n’Igbo, ma a hapụghị njikọ echiche ya. Okwu ndị dị ka “onyinyo,” “àjà,” “ịbịaru nso,” na “zuo oke” na-echekwa ụda ofufe na arụmụka nkà mmụta okpukpe nke amaokwu ahụ.
