    rationale: γάρ pụtara “n’ihi na/ihi na”; ọ bụghị njikọ nkwubi okwu. “Ya mere” na-eme ka mmekọrịta echiche ahụ bụrụ nkwubi okwu karịa ka Grik si kwuo.
  - severity: medium
