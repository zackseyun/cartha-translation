  naturalness: Igbo a bụ Standard Igbo doro anya ma na-agụ nke ọma. ‘Onye nchụàjà,’ ‘na-eje ozi,’ ‘ịchụ àjà,’ na ‘iwepụ mmehie’ bụ okwu a na-ahụkarị ma dabara n’usoro ederede dị nsọ. ‘Otu àjà ndị ahụ ... ugboro ugboro’ na-ekwupụta nke ọma àjà ndị a na-emegharị emegharị.
  terminology: Okwu nchụàjà na àjà kwekọrọ n’ọnọdụ ụlọ nsọ na n’ụdị okwu Hibru. A hapụghị ‘onye nchụàjà’ ka ọ bụrụ ‘nnukwu onye nchụàjà,’ n’ihi na isi Grik nwere ἱερεύς, ọ bụghị ἀρχιερεύς. Nkọwa ala ibe maka ‘ịnapụ mmehie’ na-enye nhọrọ okwu maka περιελεῖν, ma ọ naghị agbanwe ihe amaokwu ahụ pụtara.
