id: HEB.10.11
reference: Hebrews 10:11
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Καὶ πᾶς μὲν ἱερεὺς ἕστηκεν καθ’ ἡμέραν λειτουργῶν καὶ τὰς αὐτὰς πολλάκις προσφέρων θυσίας, αἵτινες οὐδέποτε δύνανται περιελεῖν ἁμαρτίας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/011.yaml
  text: And every priest stands day after day ministering and offering the same sacrifices again and again[a], which can never take away sins.
translation:
  language: ig
  text: Onye nchụàjà ọ bụla na-eguzo kwa ụbọchị na-eje ozi, na-achụkwa otu àjà ndị ahụ ugboro ugboro; àjà ndị a apụghị iwepụ mmehie ma ọlị.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ịnapụ mmehie.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς ... ἱερεὺς
  choice: Onye nchụàjà ọ bụla
  rationale: 'Nke a na-egosipụta echiche nkesa nke πᾶς ya na aha otu onye: onye ọ bụla n’ime ndị nchụàjà, ọ bụghị naanị nnukwu onye nchụàjà.'
- source_word: ἕστηκεν
  choice: na-eguzo
  rationale: Ọ na-egosipụta ọnọdụ onye nchụàjà nke guzoro, ma na-echekwa ọdịiche dị n’etiti ya na Mesaịa nke nọ ọdụ n’amaokwu na-esote.
- source_word: καθ’ ἡμέραν
  choice: kwa ụbọchị
  rationale: Ọ bụ ụzọ Igbo dị mfe ma doo anya isi gosi ọrụ a na-eme ụbọchị niile n’enweghị nkwụsị.
- source_word: λειτουργῶν
  choice: na-eje ozi
  rationale: N’ọnọdụ a, okwu ahụ na-ekwu maka ije ozi dị nsọ nke onye nchụàjà; ‘na-eje ozi’ bụ okwu e ji eme ihe n’Igbo nke oge a ma kwekọọ n’ọnọdụ ahụ.
- source_word: τὰς αὐτὰς ... θυσίας
  choice: otu àjà ndị ahụ
  rationale: Nke a na-echekwa nkwusi ike na ọ bụ àjà ndị ahụ otu ahụ ka a na-achụ ugboro ugboro.
- source_word: πολλάκις
  choice: ugboro ugboro
  rationale: Ọ na-egosipụta omume a na-emegharị ọtụtụ mgbe n’ụzọ doro anya ma dịkwa ike.
- source_word: προσφέρων
  choice: na-achụkwa
  rationale: N’ihe gbasara àjà, ‘ịchụ àjà’ bụ okwu Igbo ziri ezi ma bụrụ nke a na-aghọta nke ọma maka προσφέρω.
- source_word: αἵτινες
  choice: àjà ndị a
  rationale: E ji ahịrịokwu nkọwa kwụụrụ onwe ya dochie nnọchiaha njikọ ahụ ka ntụaka ya gaa n’àjà doo anya n’Igbo, na-enweghị ịgbakwunye nkọwa ọzọ.
- source_word: οὐδέποτε δύνανται
  choice: apụghị ... ma ọlị
  rationale: Njikọ a na-egosipụta enweghị ike zuru oke ma chekwaa ike okwu Grik ahụ.
- source_word: περιελεῖν ἁμαρτίας
  choice: iwepụ mmehie
  rationale: ‘Iwepụ mmehie’ na-enye kpọmkwem echiche nke iwepụ ma ọ bụ ịnapụ mmehie n’enweghị itinye okwu nkà mmụta okpukpe ọzọ.
theological_decisions:
- issue: Mmekọrịta ọnọdụ onye nchụàjà na arụmụka Hibru 10
  choice: E sụgharịrị ἕστηκεν dị ka ‘na-eguzo’ iji chekwaa ọdịiche dị n’etiti ọrụ ndị nchụàjà na-aga n’ihu na ịnọ ọdụ nke Mesaịa n’amaokwu na-esote.
  alternative: Iji okwu na-adịghị egosi ọnọdụ ahụ nke ọma, dị ka nanị ‘na-anọ.’
  rationale: Ọnọdụ iguzo bụ akụkụ nke ọdịiche onye dere akwụkwọ ahụ ji arụ ụka; nsụgharị ahụ na-echekwa ya ma ghara ịkọwa karịa ihe ederede kwuru.
- issue: Ókè enweghị ike nke àjà ndị ahụ
  choice: ‘Apụghị iwepụ mmehie ma ọlị’ na-echekwa nkwupụta siri ike na àjà ndị a enweghị ike iwepụ mmehie.
  alternative: Ibelata ike ya site n’ịsị na ha ‘apụghị idozi mmehie kpamkpam.’
  rationale: οὐδέποτε δύνανται na-ekwu maka enweghị ike n’ụzọ zuru oke n’ime arụmụka a; e kwesịghị ime ka nkwupụta ahụ dị nro.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. ‘Onye nchụàjà,’ ‘ịchụ àjà,’ na ‘iwepụ mmehie’ na-edobe asụsụ ofufe nke akụkụ ahụ n’enweghị okwu ụka nke otu denominashọn pụrụ iche.
