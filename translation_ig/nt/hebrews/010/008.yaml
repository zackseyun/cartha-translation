  to: N'okwu o kwuru n'elu, “Àjà na onyinye, na àjà nsure ọkụ dum[a], na àjà maka mmehie[b], ị chọghị ha, ọ dịghịkwa gị ụtọ na ha”—ndị a na-achụ dịka Iwu ahụ si dị[c]—
  rationale: 'The revision removes the unwarranted concessive meaning and restores the Greek relative-clause relationship: the listed offerings are those offered according to the Law. It also improves the opening’s idiomatic reference to the preceding statement while retaining the draft’s accurate sacrificial terminology and existing note anchors.'
