id: HEB.10.8
reference: Hebrews 10:8
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀνώτερον λέγων ὅτι ⸂Θυσίας καὶ προσφορὰς⸃ καὶ ὁλοκαυτώματα καὶ περὶ ἁμαρτίας οὐκ ἠθέλησας οὐδὲ εὐδόκησας, αἵτινες κατὰ ⸀νόμον προσφέρονται,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/008.yaml
  text: After saying above[a], “Sacrifices and offerings and whole burnt offerings and sin offerings you did not desire[c][b], nor did you delight in”—which are offered according to the law—
translation:
  language: ig
  text: N'okwu o kwuru n'elu, “Àjà na onyinye, na àjà nsure ọkụ dum[a], na àjà maka mmehie[b], ị chọghị ha, ọ dịghịkwa gị ụtọ na ha”—ndị a na-achụ dịka Iwu ahụ si dị[c]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ya bụ, àjà a na-esure ọkụ kpamkpam n'elu ebe ịchụ àjà.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, “onyinye maka mmehie.”
    reason: lexical_alternative
  - marker: c
    text: Ya bụ, dịka Iwu Mosis si dị.
    reason: cultural_note
lexical_decisions:
- source_word: ἀνώτερον λέγων
  choice: Mgbe o kwusịrị n'elu
  rationale: Na-arụtụ aka n'okwu e hotara tupu nke a n'ime arụmụka ahụ, ma na-anọgide n'ụdị Igbo doro anya.
- source_word: Θυσίας καὶ προσφορὰς
  choice: Àjà na onyinye
  rationale: Na-echekwa okwu abụọ dị iche iche nke usoro ịchụ àjà, n'asụsụ Igbo a na-aghọta nke ọma.
- source_word: ὁλοκαυτώματα
  choice: àjà nsure ọkụ dum
  rationale: Na-egosi na a na-esure ụdị àjà a ọkụ kpamkpam, kama iwepụ echiche dị na ngwakọta okwu Grik ahụ.
- source_word: περὶ ἁμαρτίας
  choice: àjà maka mmehie
  rationale: Na-egosi ụdị àjà metụtara mmehie ma na-ezere ime ka nkebiokwu Grik ahụ bụrụ okwu teknụzụ nke ga-emechi ezi nghọta ọzọ o nwere.
- source_word: οὐκ ἠθέλησας
  choice: ị chọghị ha
  rationale: Na-enye echiche nke enweghị ọchịchọ n'Igbo ebumpụta ụwa; ‘ha’ na-eme ka ihe a na-ekwu banyere ha doo anya.
- source_word: οὐδὲ εὐδόκησας
  choice: ọ dịghịkwa gị ụtọ na ha
  rationale: Na-echekwa ọdịiche dị n'etiti ‘ịchọ’ na ‘inwe mmasị/obi ụtọ,’ ma na-enye nkebiokwu zuru oke n'Igbo.
- source_word: κατὰ νόμον προσφέρονται
  choice: a na-achụ ha dị ka Iwu ahụ si dị
  rationale: Na-egosi na àjà ndị ahụ kwekọrọ n'ihe Iwu ahụ nyere n'iwu; ‘a na-achụ’ dabara nke ọma n'àjà karịa okwu izugbe banyere iweta ihe.
theological_decisions:
- issue: Otu e si edepụta ụdị àjà ndị dị n'okwu Abụ Ọma e hotara
  choice: Àjà na onyinye, na àjà nsure ọkụ dum, na àjà maka mmehie
  alternative: Àjà na onyinye, na àjà nsure ọkụ, na onyinye mmehie
  rationale: Nhọrọ a na-echekwa ụdị àjà dị iche iche na nkọwa nke àjà a na-esure dum, n'enweghị itinye nkọwa ozizi ọzọ.
- issue: Ihe okwu Chineke megide àjà ndị ahụ pụtara
  choice: ị chọghị ha, ọ dịghịkwa gị ụtọ na ha
  alternative: ị chọghị, ị kwadoghịkwa
  rationale: Na-echekwa ahịrịokwu abụọ yiri ibe ha ma dị iche n'okwu Grik, ebe nkebi ikpeazụ ka na-egosi na a na-achụ àjà ndị a dị ka Iwu si dị; ya mere, nsụgharị ahụ anaghị ekwu na Iwu ahụ n'onwe ya ezighị ezi.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke oge a ma dị ùgwù. E ji “Iwu ahụ” dee νόμος ebe a iji rụtụ aka n'Iwu Mosis, ma kọwaa ya na ndetu ala peeji. Akara ndetu [a], [b], na [c] niile dị n'ahịrị isi.
