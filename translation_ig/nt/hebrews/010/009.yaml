id: HEB.10.9
reference: Hebrews 10:9
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τότε εἴρηκεν· Ἰδοὺ ἥκω τοῦ ⸀ποιῆσαι τὸ θέλημά σου· ἀναιρεῖ τὸ πρῶτον ἵνα τὸ δεύτερον στήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/009.yaml
  text: Then he said[a], ‘Behold, I have come to do your will.’ He takes away the first so that he may establish the second.
translation:
  language: ig
  text: Mgbe ahụ, o kwuru, “Lee, abịawo m ime uche gị.” Ọ na-ewepụ nke mbụ ka o wee mee ka nke abụọ guzosie ike.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τότε
  choice: Mgbe ahụ
  rationale: 'Na-egosi usoro ihe: okwu a na-esochi ihe e kwuru na mbụ.'
- source_word: εἴρηκεν
  choice: o kwuru
  rationale: Ọ bụ ezie na Grik ji perfect, Igbo nkịtị na-eji oge gara aga ebe a; njikọ ya na τότε na-eme ka usoro okwu doo anya, n’enweghị ịkwụsị ịdị irè nke okwu ahụ ugbu a.
- source_word: Ἰδοὺ
  choice: Lee
  rationale: Na-echekwa oku e ji adọta uche na ụda Akwụkwọ Nsọ n’Igbo dị ugbu a.
- source_word: ἥκω
  choice: abịawo m
  rationale: Na-egosi na ọ bịarutela ma nọkwa ebe ahụ, dịka ike okwu ἥκω si dị.
- source_word: τοῦ ποιῆσαι
  choice: ime
  rationale: Infinitive nke nzube; ‘ime’ bụ Igbo dị mfe ma na-egosi nzube ahụ n'ụzọ doro anya.
- source_word: τὸ θέλημά σου
  choice: uche gị
  rationale: ‘Uche’ bụ ụzọ Igbo a na-ejikarị akọwa ọchịchọ ma ọ bụ nzube mmadụ; ebe a ọ na-ezo aka n’ihe Chineke chọrọ.
- source_word: ἀναιρεῖ
  choice: Ọ na-ewepụ
  rationale: Na-anọ nso n’okwu Grik ma ghara ịgbasa ya ka ọ bụrụ nkọwa kpọmkwem banyere ịkagbu ọgbụgba ndụ.
- source_word: τὸ πρῶτον
  choice: nke mbụ
  rationale: Na-echekwa mkpụmkpụ na amaghị kpọmkwem ihe okwu Grik na-ezo aka na ya, ka ihe gbara ya gburugburu kọwaa ya.
- source_word: ἵνα
  choice: ka ... wee
  rationale: Usoro Igbo nkịtị nke na-egosi nzube ma ọ bụ ihe e bu n’obi.
- source_word: τὸ δεύτερον
  choice: nke abụọ
  rationale: Na-echekwa nhazi yiri ‘nke mbụ’ na nkenke okwu mbụ.
- source_word: στήσῃ
  choice: mee ka ... guzosie ike
  rationale: Na-enye echiche nke ime ka ihe dịrị ma nwee nkwụsi ike, nke dabara na ntụnyere ya na iwepụ nke mbụ.
theological_decisions:
- issue: Ihe ‘nke mbụ’ na ‘nke abụọ’ na-ezo aka na ya
  choice: E debere ha nkenke dịka ‘nke mbụ’ na ‘nke abụọ,’ n’enweghị itinye nkọwa kpọmkwem n’ahịrịokwu ahụ.
  alternative: A pụrụ ịkọwa ha dịka usoro àjà mbụ na imezu uche Chineke nke abụọ, ma ọ bụ dịka ọgbụgba ndụ ochie na nke ọhụrụ.
  rationale: Amaokwu 8–10 na-atụnyere àjà na onyinye na ime uche Chineke site n’onyinye Kraịst nyere onwe ya. Ma ebe Grik n’onwe ya ekwughị aha ihe abụọ ahụ n’amaokwu a, nsụgharị ahụ na-echekwa nhịahụ nkọwa ahụ kama idozi ya n’aha otu ozizi.
translation_notes:
  register: Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E ji ‘Lee’ chekwaa ụda oku nke Ἰδοὺ; e zere ịgbasa ‘nke mbụ’ na ‘nke abụọ’ n’ime isi amaokwu.
