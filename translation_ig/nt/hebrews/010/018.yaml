    text: A pụkwara ịsụgharị okwu a “nhapụ.” “Ihe ndị a” na-atụ aka ná mmehie na omume megidere iwu ndị a kpọtụrụ aha n’amaokwu gara aga.
    reason: lexical_alternative
  revision_rationale: The revision corrects the locative sense introduced by “N’ebe a,” uses a natural Igbo nominal expression for forgiveness, and renders οὐκέτι with “adịkwaghị,” preserving the assertion that no offering for sin remains. It retains the Greek demonstrative’s contextual ambiguity rather than replacing it in the text with an explicit antecedent.
