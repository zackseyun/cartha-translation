  yaml_path: translation/nt/hebrews/010/018.yaml
  text: Where there is forgiveness of these[a], there is no longer any offering for sin.
translation:
  language: ig
  text: Ebe e nwere mgbaghara maka ihe ndị a[a], àjà maka mmehie adịkwaghị.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị okwu a “nhapụ.” “Ihe ndị a” na-atụ aka ná mmehie na omume megidere iwu ndị a kpọtụrụ aha n’amaokwu gara aga.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπου
  choice: N’ebe a
  rationale: Ọ na-egosi ọnọdụ ebe nkwubi okwu a dị ire; nke a bụ ụzọ Igbo doro anya si kwuo ya.
- source_word: δὲ
  choice: -kwa
  rationale: E ji njikọ dị nro dị n’ime ‘ọ dịghịkwa’ gosi na okwu a na-aga n’ihu dịka nkwubi okwu, n’enweghị ime ka ọ bụrụ nnukwu mmegide.
- source_word: ἄφεσις
  choice: mgbaghara
  rationale: N’ọnọdụ a, okwu ahụ pụtara mgbaghara mmehie; ‘mgbaghara’ bụ okwu Igbo nke oge a, doo anya ma nwee ibu kwesịrị ekwesị.
- source_word: τούτων
  choice: ihe ndị a
  rationale: Ọ na-atụ aka n’azụ gaa na mmehie na omume megidere iwu ndị e kwuru n’amaokwu gara aga, ma ọ naghị akpọ ha aha ọzọ n’amaokwu a.
- source_word: οὐκέτι
  choice: ọzọ
  rationale: N’ime ahịrịokwu na-adịghị mma ‘ọ dịghịkwa ... ọzọ,’ ọ na-egosi na ihe ahụ adịghịzi.
- source_word: προσφορὰ
  choice: àjà a ga-achụ
  rationale: N’ọnọdụ ofufe a, ọ bụ ihe a na-eweta nye Chineke dịka àjà; nsụgharị a bụ Igbo nkịtị ma ghara ime ka okwu Grik ahụ dị warara karịa ka ọ dị.
- source_word: περὶ ἁμαρτίας
  choice: maka mmehie
  rationale: Ọ na-echekwa echiche àjà gbasara mmehie n’enweghị ịgbakwunye nkọwa na ọ bụ otu ụdị àjà pụrụ iche.
theological_decisions:
- issue: Njedebe nke àjà Kraịst na uru ya
  choice: Amaokwu ahụ na-ekwu na ebe e nwere mgbaghara, àjà ọzọ maka mmehie adịghịzi.
  alternative: Ịsụgharị ya ka ọ na-ekwu na ụdị onyinye ma ọ bụ àjà niile akwụsịla, ma ọ bụ na ọ na-ekwu naanị banyere emume ndị Livaị n’ụzọ dị warara.
  rationale: Ihe gbara amaokwu ahụ gburugburu na-atụnyere àjà ndị a na-achụ ugboro ugboro na àjà Kraịst dị irè nke e nyere otu ugboro. Nsụgharị ahụ na-echekwa nkwupụta banyere àjà maka mmehie, ma ọ naghị agbatị ya ruo ihe ederede ahụ na-ekwughị.
translation_notes:
  register: Standard Igbo; asụsụ dị ugbu a, dị ùgwù, ma dị mfe nghọta. E debere ntụaka ‘ihe ndị a’ ka o kwekọọ na mgbagwoju anya dị n’okwu Grik, a kọwakwara ya n’ala ala peeji.
