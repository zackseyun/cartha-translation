- from: N’ebe a gbaghaara ihe ndị a[a], ọ dịghịkwa àjà ọzọ a ga-achụ maka mmehie.
  to: Ebe e nwere mgbaghara maka ihe ndị a[a], àjà maka mmehie adịkwaghị.
  rationale: The revision corrects the locative sense introduced by “N’ebe a,” uses a natural Igbo nominal expression for forgiveness, and renders οὐκέτι with “adịkwaghị,” preserving the assertion that no offering for sin remains. It retains the Greek demonstrative’s contextual ambiguity rather than replacing it in the text with an explicit antecedent.
