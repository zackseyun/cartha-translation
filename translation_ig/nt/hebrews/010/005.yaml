  text: διὸ εἰσερχόμενος εἰς τὸν κόσμον λέγει· Θυσίαν καὶ προσφορὰν οὐκ ἠθέλησας, σῶμα δὲ κατηρτίσω μοι·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/005.yaml
  text: 'Therefore[a], when he comes into the world, he says: “Sacrifice and offering you did not desire, but a body you prepared for me.”'
translation:
  language: ig
  text: 'N’ihi ya[a], mgbe ọ na-abata n’ụwa, ọ na-ekwu, sị: “Ị chọghị àjà na onyinye, kama ị kwadebeere m ahụ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'N’ebe a, Akwụkwọ Ndị Hibru na-agbaso okwu Grik nke Abụ Ọma 40:6: “ị kwadebeere m ahụ.” Ma ederede Hibru nke Abụ Ọma 40:6 na-ekwu, “ị meghere m ntị.”'
    reason: alternative_reading
lexical_decisions:
- source_word: διὸ
  choice: N’ihi ya
  rationale: Na-egosi nkwubi okwu sitere n’ihe e kwuru tupu ya, ma bụrụkwa okwu Igbo doro anya.
- source_word: εἰσερχόμενος εἰς τὸν κόσμον
  choice: mgbe ọ na-abata n’ụwa
  rationale: Na-echekwa ọdịdị participle nke okwu Grik na ihe ọ pụtara banyere ịbata n’usoro ndụ mmadụ, n’enweghị ịmanye oge gara aga.
- source_word: λέγει
  choice: ọ na-ekwu, sị
  rationale: Na-echekwa present tense e ji ewebata okwu Akwụkwọ Nsọ ma bụrụkwa usoro okwu Igbo e ji ewebata nkwupụta kpọmkwem.
- source_word: Θυσίαν καὶ προσφορὰν
  choice: Àjà na onyinye
  rationale: 'Na-edobe okwu abụọ metụtara ofufe iche: àjà na onyinye; ha bụ okwu ndị nkịtị na-aghọta.'
- source_word: οὐκ ἠθέλησας
  choice: abụghị ihe ị chọrọ
  rationale: Na-egosipụta ọchịchọ ma ọ bụ mmasị nke θέλω n’ụzọ Igbo dị ndụ, n’enweghị ịtụgharị ya ka ọ bụrụ nanị iwu uche.
- source_word: σῶμα
  choice: ahụ
  rationale: Ọ bụ aha otu ihe kpọmkwem; Igbo anaghị achọ indefinite article dịka Bekee.
- source_word: δὲ
  choice: kama
  rationale: Na-egosipụta ọdịiche dị n’etiti àjà na onyinye a na-achọghị na ahụ a kwadebere.
- source_word: κατηρτίσω μοι
  choice: ị kwadebeere m
  rationale: Na-enye echiche nke ime ka ihe dị njikere, ebe suffix benefactive “-ere m” na-egosipụta dative μοι nke ọma.
theological_decisions:
- issue: Okwu e hotara na Hibru 10:5 dị iche na ederede Hibru nke Abụ Ọma 40:6.
  choice: “ị kwadebeere m ahụ” dịka ederede Grik Hibru si kwuo
  alternative: “ị meghere m ntị” dịka ederede Hibru nke Abụ Ọma 40:6 si kwuo
  rationale: A sụgharịrị σῶμα δὲ κατηρτίσω μοι dị ka ọ dị na SBLGNT, n’enweghị ime ka ya na ederede Hibru nke Abụ Ọma kwekọọ. Ihe dị iche ahụ ka e debere n’okpuru peeji iji chekwaa esemokwu ederede na mkpa nkà mmụta okpukpe ya.
translation_notes:
  register: Standard Igbo dị ugbu a, dị nsọ ma dị mfe nghọta. E ji “mgbe ọ na-abata” chekwaa citation-present na participial frame; e zere okwu ụka pụrụ iche ma ọ bụ nkọwa na-ekpebi ihe ederede hapụrụ n’ọnọdụ esemokwu.
