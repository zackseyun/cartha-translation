  to: 'N’ihi ya[a], mgbe ọ na-abata n’ụwa, ọ na-ekwu, sị: “Ị chọghị àjà na onyinye, kama ị kwadebeere m ahụ.”'
  rationale: The revision makes the negated verb directly govern “àjà na onyinye,” matching οὐκ ἠθέλησας while using natural Standard Igbo. It retains the Greek wording “ahụ” in the quotation and preserves the significant difference from the Hebrew wording of Psalm 40:6 in the footnote.
