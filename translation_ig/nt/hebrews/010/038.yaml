id: HEB.10.38
reference: Hebrews 10:38
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ δὲ δίκαιός ⸀μου ἐκ πίστεως ζήσεται, καὶ ἐὰν ὑποστείληται, οὐκ εὐδοκεῖ ἡ ψυχή μου ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/038.yaml
  text: But my righteous one will live by faith[a], and if he shrinks back[c][b], my soul takes no pleasure in him.
translation:
  language: ig
  text: Ma onye ezi omume m[b] ga-adị ndụ site n’okwukwe[a]; ọ bụrụkwa na ọ laghachi azụ[c], mkpụrụ obi m adịghị enwe mmasị n’ebe ọ nọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya “site n’ikwesị ntụkwasị obi” ma ọ bụ “site na ntụkwasị obi.” Okwu Grik bụ́ pistis nwere ike ibu echiche ndị a, ma isi ederede jiri “okwukwe.”
    reason: lexical_alternative
  - marker: b
    text: Ụfọdụ akwụkwọ aka ochie na-agụ naanị “onye ezi omume,” kama “onye ezi omume m.”
    reason: textual_variant
  - marker: c
    text: N’asụsụ Grik, nnọchiaha ndị a dị n’otu nwoke. N’ebe a, otu onye ahụ nwere ike ịnọchite anya mmadụ niile, ọ bụghị naanị nwoke.
    reason: cultural_note
lexical_decisions:
- source_word: ὁ δὲ δίκαιός μου
  choice: Ma onye ezi omume nke m
  rationale: “Onye ezi omume” na-egosi na adjective ahụ na-anọchi anya mmadụ; “nke m” na-edobe μου dị ka ọ dị na SBLGNT.
- source_word: ἐκ πίστεως
  choice: site n’okwukwe
  rationale: Nke a bụ ụzọ Igbo si egosipụta ndabere ma ọ bụ isi iyi nke ndụ ahụ. “Okwukwe” bụ ntụgharị bụ́ isi nke πίστις, ebe e debere echiche ndị ọzọ na nkọwa ala peeji.
- source_word: ζήσεται
  choice: ga-adị ndụ
  rationale: Ọ na-egosipụta ọdịnihu nke ζάω n'ụzọ doro anya ma bụrụkwa Igbo nkịtị.
- source_word: ὑποστείληται
  choice: laghachi azụ
  rationale: Nkebiokwu a na-egosi ịla azụ ma ọ bụ ịkwụsị iguzosi ike n’ihi nrụgide, nke dabara n’ịdọ aka ná ntị dị n’ebe a.
- source_word: οὐκ εὐδοκεῖ ἡ ψυχή μου
  choice: mkpụrụ obi m agaghị enwe mmasị
  rationale: A hapụrụ “mkpụrụ obi m” dịka okwu Grik si kwuo ya, kama ime ka ọ bụrụ naanị “agaghị m enwe mmasị.” N’usoro ahịrịokwu ọnọdụ a, ọdịnihu Igbo na-eme ka njikọ ya na “ọ bụrụ” pụta ìhè.
- source_word: ἐν αὐτῷ
  choice: n’ebe ọ nọ
  rationale: Nke a bụ ụzọ Igbo dị ndụ si ekwu na mmadụ enweghị mmasị n’ebe onye ọzọ nọ; ọ na-ezere “n’ime ya,” nke nwere ike ịdị ka ebe anụ ahụ n’Igbo.
theological_decisions:
- issue: Ihe πίστις pụtara na ἐκ πίστεως
  choice: okwukwe
  alternative: ikwesị ntụkwasị obi; ntụkwasị obi
  rationale: “Okwukwe” na-edobe isi ntụgharị ahụ, ma nkọwa ala peeji na-echekwa ohere πίστις nwere ịpụta ikwesị ntụkwasị obi ma ọ bụ ntụkwasị obi.
- issue: Onye a na-ekwu maka ya na “ọ bụrụkwa na ọ laghachi azụ”
  choice: otu onye ahụ a kpọrọ “onye ezi omume nke m”
  alternative: onye ọ bụla ọzọ a na-akọwaghị
  rationale: Okwu Grik nọgidere n’otu onye n’ahịrịokwu abụọ ahụ ma o gosighị mgbanwe nke onye a na-ekwu maka ya. A hapụrụ esemokwu nkà mmụta okpukpe dị na ịdọ aka ná ntị ahụ ka ọ dị.
- issue: Ụdị onye nnọchianya
  choice: nnọchiaha otu onye “ọ”
  alternative: ịgbanwe ya ka ọ bụrụ ọtụtụ mmadụ ma ọ bụ ikwughachi “onye ahụ”
  rationale: Igbo “ọ” anaghị akọwa nwoke ma ọ bụ nwanyị, ma ọ na-edobe otu onye dịka Grik si dị ma nwee ike ịnọchite anya mmadụ ọ bụla.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. “Onye ezi omume nke m” na-edobe ọdịdị nke isi mmalite, ebe “laghachi azụ” na-ekwupụta ịla azụ n’okwukwe n'ụzọ ndị na-agụ Igbo ga-aghọta ngwa ngwa.
