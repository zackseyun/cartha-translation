review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately represents the SBLGNT text: solidarity with the imprisoned, forceful loss of possessions, joyful acceptance, and the better enduring possession are all retained. The reflexive emphasis in ἑαυτούς is appropriately conveyed by “unu onwe unu.”'
  naturalness: The wording is generally clear Standard Igbo. However, “nabata mgbe a kwakọrọ ihe onwunwe unu” can sound as though they accepted a time/event (“when [their property] was plundered”), rather than accepting the plundering itself. A nominal expression makes the object of “nabata” direct and natural.
  terminology: “Ndị mkpọrọ,” “kerịta ahụhụ ha,” “ihe onwunwe,” and “kwakọrọ” are suitable, modern choices. The textual-variant note should avoid the reduplicated “na-adịgidekwa adịgide”; “nke na-adịgide adịgide” is sufficient and matches the main text.
  issues:
  - severity: medium
    issue: The phrase “nabata mgbe a kwakọrọ ihe onwunwe unu” uses a temporal clause where the Greek has a noun phrase, “the plundering of your possessions.”
    rationale: Replacing it with “nabata ịkwakọrọ ihe onwunwe unu” directly expresses that they accepted/endured the plundering, without altering the sense.
  - severity: low
    issue: The textual-variant footnote says “nke na-adịgidekwa adịgide.”
    rationale: The wording is unnecessarily repetitive. “Nke na-adịgide adịgide” naturally renders μένουσαν and preserves the variant’s meaning.
  revised_text: N’ihi na unu sokwa ndị mkpọrọ kerịta ahụhụ ha[a], unu jikwa ọṅụ nabata ịkwakọrọ ihe onwunwe unu, ebe unu maara na unu onwe unu nwere ihe onwunwe ka mma, nke na-adịgide adịgide.[b]
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “unu nwere ọmịiko n’ebe ndị mkpọrọ nọ.” Ngwaa Grik ahụ nwere ike ịpụta inwe ọmịiko, ma n’ebe a o yikarịrị ka ọ gụnyere iso ha kerịta ahụhụ ha.
    reason: lexical_alternative
  - marker: b
    text: Ụfọdụ akwụkwọ aka ochie sịrị, “ebe unu maara na unu nwere ihe onwunwe ka mma n’eluigwe, nke na-adịgide adịgide.”
    reason: textual_variant
  revision_rationale: The revision makes the plundering, rather than the time at which it occurred, the direct object of joyful acceptance. It also regularizes the wording of the textual-variant note. No theological specification, such as heaven, is added to the main text; “n’eluigwe” remains confined to the variant footnote.
