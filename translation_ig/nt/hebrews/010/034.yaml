id: HEB.10.34
reference: Hebrews 10:34
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ γὰρ τοῖς ⸀δεσμίοις συνεπαθήσατε, καὶ τὴν ἁρπαγὴν τῶν ὑπαρχόντων ὑμῶν μετὰ χαρᾶς προσεδέξασθε, γινώσκοντες ἔχειν ⸀ἑαυτοὺς κρείττονα ⸀ὕπαρξιν καὶ μένουσαν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/034.yaml
  text: For you also suffered together with the prisoners[a], and you accepted with joy the plundering of your possessions[b], knowing that you yourselves have a better and lasting possession.
translation:
  language: ig
  text: N’ihi na unu sokwa ndị mkpọrọ kerịta ahụhụ ha[a], unu jikwa ọṅụ nabata ịkwakọrọ ihe onwunwe unu, ebe unu maara na unu onwe unu nwere ihe onwunwe ka mma, nke na-adịgide adịgide.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “unu nwere ọmịiko n’ebe ndị mkpọrọ nọ.” Ngwaa Grik ahụ nwere ike ịpụta inwe ọmịiko, ma n’ebe a o yikarịrị ka ọ gụnyere iso ha kerịta ahụhụ ha.
    reason: lexical_alternative
  - marker: b
    text: Ụfọdụ akwụkwọ aka ochie sịrị, “ebe unu maara na unu nwere ihe onwunwe ka mma n’eluigwe, nke na-adịgide adịgide.”
    reason: textual_variant
lexical_decisions:
- source_word: δεσμίοις
  choice: ndị mkpọrọ
  rationale: Okwu a pụtara ndị e kere agbụ ma ọ bụ ndị nọ n’ụlọ mkpọrọ. “Ndị mkpọrọ” bụ okwu Igbo doro anya ma dị nkenke.
- source_word: συνεπαθήσατε
  choice: unu sokwa ... kerịta ahụhụ ha
  rationale: Ngwaa a nwere ike ịpụta imere mmadụ ebere ma ọ bụ iso ya nwee ahụhụ. N’ebe a, ntụgharị a na-egosi ịdị n’otu na ndị a na-akpagbu, ọ bụghị naanị inwe mwute n’obi maka ha.
- source_word: ἁρπαγήν
  choice: mgbe a kwakọrọ
  rationale: Okwu Grik a na-egosi ịnara ihe n’ike ma ọ bụ ịpụnara mmadụ ihe n’ụzọ na-ezighị ezi. “Kwakọrọ” na-echekwa ike na ajọ omume dị n’okwu ahụ.
- source_word: τῶν ὑπαρχόντων ὑμῶν
  choice: ihe onwunwe unu
  rationale: Nkebiokwu a na-ezo aka n’ihe mmadụ nwere. “Ihe onwunwe unu” bụ Igbo nkịtị ma na-egosi ihe ha nwere n’ụwa.
- source_word: μετὰ χαρᾶς
  choice: jikwa ọṅụ
  rationale: Nke a na-egosipụta kpọmkwem na ha nabatara ọnwụnwa ahụ n’ọṅụ.
- source_word: προσεδέξασθε
  choice: nabata
  rationale: Ngwaa ahụ nwere ike ịpụta ịnabata ma ọ bụ ịnata. N’ebe a, “nabata” na-egosi na ha diri mfu ahụ n’obi dị njikere, na-enweghị ikwu na ha kwadoro ajọ omume ahụ.
- source_word: γινώσκοντες
  choice: ebe unu maara
  rationale: Nke a na-echekwa echiche nke ihe ọmụma ha so mee ka ha jiri ọṅụ nagide mfu ahụ, ma ghara ime ka njikọ ahụ sie ike karịa ka Grik si kwuo.
- source_word: ἑαυτοὺς ἔχειν
  choice: unu onwe unu nwere
  rationale: “Unu onwe unu” na-echekwa nkwusi ike nke nnọchiaha nlọghachi dị na ederede SBLGNT.
- source_word: κρείττονα
  choice: ka mma
  rationale: Nke a bụ ntụgharị eke nke okwu ntụnyere ahụ ma na-edobe isiokwu “ka mma” nke na-apụta ugboro ugboro n’akwụkwọ Ndị Hibru.
- source_word: ὕπαρξιν
  choice: ihe onwunwe
  rationale: Okwu a nwere ike ịpụta ihe mmadụ nwere ma ọ bụ ihe onwunwe ya. Iji otu okwu ahụ e ji sụgharịa echiche dị na ὑπαρχόντων na-eme ka ọdịiche dị n’etiti ihe ha furu efu na ihe ka mma ha nwere pụta ìhè.
- source_word: μένουσαν
  choice: nke na-adịgide adịgide
  rationale: Nke a na-egosipụta ịdịgide na enweghị njedebe nke ihe onwunwe ahụ n’ụzọ doro anya ma dị n’Igbo ugbu a.
theological_decisions:
- issue: Ihe iso ndị kwere ekwe nọ n’ụlọ mkpọrọ taa ahụhụ pụtara
  choice: E gosipụtara ya dị ka iso ha kerịta ahụhụ ha n’ịdị n’otu.
  alternative: “Unu nwere ọmịiko n’ebe ndị mkpọrọ nọ.”
  rationale: συμπαθέω nwere ike igosi ọmịiko, ma n’ọnọdụ mkpagbu dị na Ndị Hibru 10:32–34, okwu ahụ nwere ike ịgụnye isoro ha buru ibu nke ahụhụ ha. Ntụgharị a anaghị eme ka ọ bụrụ naanị mmetụta dị n’obi.
- issue: Ụdị “ihe onwunwe ka mma, nke na-adịgide adịgide”
  choice: A hapụrụ ya ka ọ bụrụ ihe onwunwe ka mma nke na-adịgide, n’akọwaghị ebe ọ dị ma ọ bụ kpọọ ya ụgwọ ọrụ ma ọ bụ nzọpụta.
  alternative: “Ihe onwunwe ka mma dị n’eluigwe” ma ọ bụ “ihe nketa ka mma.”
  rationale: Ederede SBLGNT n’ebe a ekwughị “n’eluigwe.” Ọ bụ ezie na ụfọdụ akaebe ederede tinyere ya ma ndị na-akọwa Akwụkwọ Nsọ na-ahụkarị echiche ọdịnihu n’okwu ahụ, isi ederede ekwesịghị ịgbakwunye nkọwa okpukpe karịrị ihe Grik kwuru.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ “kwakọrọ” iji gosipụta ịnara ihe n’ike, ebe “unu onwe unu” na-echekwa nkwusi ike dị na ederede Grik. E tinyere akara ndetu ala ala [a] na [b] n’ebe okwu ha na-akọwa dị na isi ederede.
