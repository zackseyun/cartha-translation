revisions:
- from: N’ihi na unu sokwa ndị mkpọrọ kerịta ahụhụ ha[a], unu jikwa ọṅụ nabata mgbe a kwakọrọ ihe onwunwe unu, ebe unu maara na unu onwe unu nwere ihe onwunwe ka mma, nke na-adịgide adịgide.[b]
  to: N’ihi na unu sokwa ndị mkpọrọ kerịta ahụhụ ha[a], unu jikwa ọṅụ nabata ịkwakọrọ ihe onwunwe unu, ebe unu maara na unu onwe unu nwere ihe onwunwe ka mma, nke na-adịgide adịgide.[b]
  rationale: The revision makes the plundering, rather than the time at which it occurred, the direct object of joyful acceptance. It also regularizes the wording of the textual-variant note. No theological specification, such as heaven, is added to the main text; “n’eluigwe” remains confined to the variant footnote.
