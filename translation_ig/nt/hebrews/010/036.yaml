revisions:
- from: N’ihi na ntachi obi dị unu mkpa, ka unu wee nata nkwa ahụ[a] mgbe unu mesịrị uche Chineke.
  to: N’ihi na ntachi obi dị unu mkpa ka, mgbe unu mesịrị ime uche Chineke, unu wee nata nkwa ahụ[a].
  rationale: The revision adds ime to render ποιήσαντες faithfully and places the temporal clause before the receiving clause to express its prior action clearly. It retains the formal yet natural register, the source ambiguity of ‘the promise,’ and the existing alternative-reading footnote.
  reviewer_model: gpt-5.6-terra
