review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders the principal terms and preserves the antecedent sense of the aorist participle. However, “mgbe unu mesịrị uche Chineke” omits the verb ‘to do’ (ime) and can be understood less precisely than the Greek ποιήσαντες τὸ θέλημα τοῦ θεοῦ.
  naturalness: “Ntachi obi dị unu mkpa” is natural Standard Igbo. Repositioning the temporal participial clause makes the sequence—doing God's will before receiving—clearer and more idiomatic.
  terminology: “Ntachi obi” suitably conveys ὑπομονή; “uche Chineke” is an established, natural rendering of ‘the will of God’; and “nkwa ahụ” retains the productive ambiguity of τὴν ἐπαγγελίαν.
  issues:
  - severity: medium
    issue: The phrase “mgbe unu mesịrị uche Chineke” lacks “ime” (‘to do’).
    rationale: The Greek explicitly says ‘having done the will of God.’ Adding ime supplies the necessary Igbo verbal expression and avoids an imprecise reading of ‘finish God’s will/mind.’
  revised_text: N’ihi na ntachi obi dị unu mkpa ka, mgbe unu mesịrị ime uche Chineke, unu wee nata nkwa ahụ[a].
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “ihe e kwere ná nkwa.”
    reason: alternative_reading
  revision_rationale: The revision adds ime to render ποιήσαντες faithfully and places the temporal clause before the receiving clause to express its prior action clearly. It retains the formal yet natural register, the source ambiguity of ‘the promise,’ and the existing alternative-reading footnote.
