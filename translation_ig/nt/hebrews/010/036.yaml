id: HEB.10.36
reference: Hebrews 10:36
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὑπομονῆς γὰρ ἔχετε χρείαν ἵνα τὸ θέλημα τοῦ θεοῦ ποιήσαντες κομίσησθε τὴν ἐπαγγελίαν·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/036.yaml
  text: For you have need of endurance[a], so that after doing the will of God you may receive the promise.
translation:
  language: ig
  text: N’ihi na ntachi obi dị unu mkpa ka, mgbe unu mesịrị ime uche Chineke, unu wee nata nkwa ahụ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ihe e kwere ná nkwa.”
    reason: alternative_reading
lexical_decisions:
- source_word: ὑπομονῆς
  choice: ntachi obi
  rationale: Okwu a na-egosi ịnọgide na-eguzosi ike n’okpuru nrụgide ma ghara ịda mba; “ntachi obi” bụ okwu Igbo doro anya ma dịkwa mma n’ọgụgụ.
- source_word: χρείαν ἔχετε
  choice: dị unu mkpa
  rationale: Nke a bụ ụzọ Igbo sitere n’okike isi kwuo na ihe dị mmadụ mkpa, ma ọ na-edobe ike okwu Grik ahụ.
- source_word: ἵνα
  choice: ka unu wee
  rationale: Ọ na-egosi ebumnuche ma ọ bụ ihe a na-atụ anya na ọ ga-esi na ya pụta.
- source_word: τὸ θέλημα τοῦ θεοῦ
  choice: uche Chineke
  rationale: “Uche Chineke” bụ ntụgharị Igbo kwụ ọtọ, nke a na-aghọta nke ọma, maka ihe Chineke chọrọ.
- source_word: ποιήσαντες
  choice: mgbe unu mesịrị
  rationale: Aorist participle a na-egosi na ime uche Chineke buru ụzọ tupu ịnata; “mgbe unu mesịrị” na-eme ka usoro oge ahụ doo anya.
- source_word: κομίσησθε
  choice: unu wee nata
  rationale: N’ebe a, ngwaa ahụ pụtara ịnata ma ọ bụ inweta ihe e kwere ná nkwa; “nata” bụ okwu Igbo kachasị mfe ma kwekọọ n’ọnọdụ ahụ.
- source_word: τὴν ἐπαγγελίαν
  choice: nkwa ahụ
  rationale: Nke a na-edobe okwu Grik ahụ n’ụzọ kwụ ọtọ ma hapụ ohere ma ọ̀ bụ nkwa ahụ n’onwe ya ka a na-ekwu maka ya, ma ọ bụ ihe e kwere ná nkwa.
theological_decisions:
- issue: Ma ἐπαγγελίαν ọ̀ na-ezo aka na nkwa ahụ n’onwe ya ka ọ̀ bụ n’ihe e kwere ná nkwa
  choice: nkwa ahụ
  alternative: ihe e kwere ná nkwa
  rationale: Okwu Grik ahụ bụ “nkwa,” ma mgbe e jikọtara ya na κομίσησθε, ọ pụkwara ịpụta ịnata ihe Chineke kwere ná nkwa. Isi ederede na-edobe nghọtahie ziri ezi dị na isi mmalite, ebe nkọwa ala peeji na-enye ụzọ ọzọ.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke dị ugwu ma dị mfe nghọta. Ahịrịokwu ahụ na-edobe usoro echiche Grik ma na-ada ka Igbo sitere n’okike.
