  text: ἡμεῖς δὲ οὐκ ἐσμὲν ὑποστολῆς εἰς ἀπώλειαν, ἀλλὰ πίστεως εἰς περιποίησιν ψυχῆς.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/039.yaml
  text: But we are not of shrinking back to destruction[d][c][b][a], but of faith to the preservation of the soul.
translation:
  language: ig
  text: Ma anyị abụghị ndị na-alaghachi azụ ruo na mbibi,[a] kama anyị bụ ndị nwere okwukwe[b] ruo ná nchekwa ndụ.[c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “ndị na-adaghachi azụ.” Okwu Grik ahụ nwere ike ịpụta ịlaghachi azụ ma ọ bụ ịwepụ onwe; ụfọdụ na-aghọta ya n’ụzọ siri ike dịka ịhapụ okwukwe.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ikwesị ntụkwasị obi.” Okwu Grik ahụ, okwukwe, nwere ike ịgụnye ịnọgidesi ike n’ikwesị ntụkwasị obi.
    reason: alternative_reading
  - marker: c
    text: Ma ọ bụ, “ruo n’ichekwa,” “ruo n’inweta,” ma ọ bụ “ruo n’inwe ndụ/onwe onye.” Okwu Grik ahụ a sụgharịrị “ndụ” pụkwara ịpụta “mkpụrụ obi,” “onwe onye,” ma ọ bụ onye ahụ dum; ọ bụghị naanị mkpụrụ obi n’echiche dị warara.
    reason: lexical_alternative
  - marker: d
    text: Nsụgharị ọzọ bụ, “ruo n’ichekwa mkpụrụ obi.”
    reason: previous_rendering
lexical_decisions:
- source_word: ἡμεῖς δὲ
  choice: Ma anyị
  rationale: E debere nnọchiaha doro anya ahụ iji mesie ‘anyị’ ike, ebe ‘Ma’ na-egosi ọdịiche siri ike n’ihe e kwuru tupu ya.
- source_word: οὐκ ἐσμὲν ὑποστολῆς
  choice: anyị abụghị ndị na-alaghachi azụ
  rationale: Ụdị a na-egosipụta echiche nke ịbụ ndị e ji ịla azụ mara, ma ọ naghị ekpebi na okwu ahụ pụtara ịjụ okwukwe kpamkpam.
- source_word: εἰς ἀπώλειαν
  choice: ruo na mbibi
  rationale: ‘Ruo na’ na-egosi njedebe ma ọ bụ ihe ga-esi n’ịla azụ pụta; ‘mbibi’ bụ okwu Igbo doro anya maka ἀπώλεια.
- source_word: ἀλλὰ πίστεως
  choice: kama anyị bụ ndị nwere okwukwe
  rationale: E mere njikọ ahụ ka ọ bụrụ Igbo ebumpụta ụwa, ma debe okwukwe dịka isi nghọta nke πίστις n’ebe a.
- source_word: εἰς περιποίησιν ψυχῆς
  choice: ruo na nzọpụta nke ndụ anyị
  rationale: N’ọdịiche ya na ‘mbibi,’ περιποίησις nwere echiche ichekwa ma ọ bụ inweta; ψυχή n’ebe a metụtara ndụ/onwe onye dum. ‘Nzọpụta nke ndụ anyị’ bụ Igbo kwụ ọtọ ma saa mbara, ebe nkọwa ala peeji na-echekwa nhọrọ ndị ọzọ.
theological_decisions:
- issue: Ihe πίστις pụtara n’ọdịiche ya na ὑποστολή
  choice: okwukwe
  alternative: ikwesị ntụkwasị obi / ịnọgide n’okwukwe
  rationale: ‘Okwukwe’ na-edobe isi nghọta nke okwu Grik ahụ n’emebighị ohere na ọ gụnyere ịnọgidesi ike n’ikwesị ntụkwasị obi.
- issue: Ihe περιποίησις ψυχῆς pụtara
  choice: nzọpụta nke ndụ anyị
  alternative: ichekwa ndụ/onwe onye; inweta ndụ/onwe onye
  rationale: Ọdịiche ya na mbibi na-akwado echiche nzọpụta ma ọ bụ ichekwa, ma okwu Grik ahụ nwekwara ike igosi inweta ma ọ bụ inwe. Nkọwa ala peeji na-edobe mgbagwoju anya ahụ.
translation_notes:
  register: Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ usoro ‘anyị abụghị ndị… kama anyị bụ ndị…’ iji mee ka genitive nke ụdị/òtù dị na Grik doo anya n’Igbo. E zere iji ‘ịjụ okwukwe’ n’isi ederede n’ihi na ọ ga-eme ka ὑποστολή sie ike karịa ihe okwu ahụ n’onwe ya chọrọ.
