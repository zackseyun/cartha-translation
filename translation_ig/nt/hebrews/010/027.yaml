  text: φοβερὰ δέ τις ἐκδοχὴ κρίσεως καὶ πυρὸς ζῆλος ἐσθίειν μέλλοντος τοὺς ὑπεναντίους.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/027.yaml
  text: but a fearful expectation of judgment[a], and a fury of fire about to consume the adversaries.
translation:
  language: ig
  text: kama ọ bụ atụmanya dị egwu banyere ikpe[a], na ọnụma ọkụ nke ga-eripịa ndị mmegide.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ: “atụmanya na-atụ mmadụ egwu banyere ikpe, na oke ọkụ nke ga-eripịa ndị mmegide.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: φοβερὰ
  choice: dị egwu
  rationale: Ọ na-egosi ihe na-akpata oke ụjọ ma na-edobe ịdị arọ nke ịdọ aka ná ntị ahụ n'Igbo dị ugbu a.
- source_word: δέ
  choice: kama
  rationale: Ọ na-egosi ọdịiche dị n'etiti ihe a na ihe a jụrụ na amaokwu bu ụzọ.
- source_word: τις ἐκδοχὴ
  choice: atụmanya
  rationale: ‘Atụmanya’ na-egosi ichere ihe a maara na ọ na-abịa; ịsụgharị τις iche dịka ‘otu’ ga-eme ka okwu Igbo sie ike n'ụzọ na-adịghị eke.
- source_word: κρίσεως
  choice: nke ikpe
  rationale: ‘Ikpe’ na-edobe echiche sara mbara nke mkpebi ikpe, n'etinyeghị nkọwa ozizi karịrị ihe amaokwu ahụ kwuru.
- source_word: πυρὸς ζῆλος
  choice: ọnụma ọkụ
  rationale: N'ọnọdụ a ζῆλος na-egosi ike ọkụ ahụ na oke ọnụma ya; ‘ọnụma ọkụ’ bụ okwu Igbo doro anya ma na-edobe onyinyo ahụ dị ndụ.
- source_word: ἐσθίειν
  choice: iripịa
  rationale: ‘Iripịa’ na-edobe ihe oyiyi nke iri ihe kpamkpam ma na-ekwupụta mbibi ahụ n'ụzọ siri ike.
- source_word: μέλλοντος
  choice: nke na-aga
  rationale: Ọ na-egosi na omume ahụ na-abịa ma dị nso, n'enweghị itinye nkọwa oge nke Greek ekwughị kpọmkwem.
- source_word: τοὺς ὑπεναντίους
  choice: ndị mmegide
  rationale: Ọ na-akọwa ndị guzoro n'akụkụ mmegide n'etinyeghị onye ha na-emegide nke ọma n'ime ederede.
theological_decisions:
- issue: Ụdị ihe oyiyi nke ikpe
  choice: E debere ihe oyiyi siri ike nke ọkụ na-aga iripịa ndị mmegide.
  alternative: Ịkọwa ya kpọmkwem dịka ntaramahụhụ ebighị ebi, ma ọ bụ ime ka ọ bụrụ naanị ihe atụ.
  rationale: Amaokwu ahụ na-egosi ikpe dị egwu, ma ọ naghị akọwa n'onwe ya ogologo oge ya ma ọ bụ akụkụ ozizi ya niile; nsụgharị ahụ ekwesịghị idozi ihe ederede ahụ hapụrụ ghe oghe.
translation_notes:
  register: E ji Igbo Izugbe dị ugbu a, nke dị ugwu ma dị mfe nghọta. Ahịrịokwu ahụ na-aga n'ihu n'echiche amaokwu bu ụzọ; ‘kama ọ bụ’ na-eme ka njikọ ahụ doo anya n'Igbo. Akara nkọwa ala ala [a] dị n'ederede isi.
