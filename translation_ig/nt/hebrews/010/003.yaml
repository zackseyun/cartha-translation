  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀλλ’ ἐν αὐταῖς ἀνάμνησις ἁμαρτιῶν κατ’ ἐνιαυτόν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/003.yaml
  text: But in these sacrifices there is a reminder of sins year after year,[a]
translation:
  language: ig
  text: Ma n’àjà ndị a, e nwere ncheta mmehie kwa afọ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “afọ ruo n’afọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: Ma
  rationale: 'Ọ bụ njikọ na-egosi ọdịiche n’ihe e kwuru tupu ya: àjà ndị ahụ enweghị ike ime ka ndị na-efe ofufe zuo oke.'
- source_word: ἐν αὐταῖς
  choice: n’àjà ndị a
  rationale: Nnọchiaha ahụ na-ezo aka n’àjà ndị a kpọrọ aha n’amaokwu ndị bu ụzọ; ikwupụta ‘àjà’ na-eme ka ihe ọ na-ezo aka na ya doo anya n’Igbo.
- source_word: ἀνάμνησις
  choice: a na-echetara ndị mmadụ
  rationale: Nke a na-egosipụta ime ka a cheta ihe. Usoro a bụ Igbo dị mfe ma doo anya, ma ọ naghị ekwu na àjà ndị ahụ na-ewepụ mmehie.
- source_word: ἁμαρτιῶν
  choice: mmehie ha
  rationale: Mmehie bụ ihe a na-echetara mmadụ. ‘Ha’ na-eme ka ahịrịokwu ahụ bụrụ Igbo eke, na-ezo aka n’ebe ndị na-efe ofufe nọ n’okwu gbara ya gburugburu.
- source_word: κατ’ ἐνιαυτόν
  choice: kwa afọ
  rationale: Nkebiokwu ahụ pụtara ihe na-eme ugboro ugboro n’afọ ọ bụla; ‘kwa afọ’ bụ okwu Igbo eke ma zie ezi.
theological_decisions:
- issue: Ihe αὐταῖς na-ezo aka na ya
  choice: E mere ya ka ọ pụta ìhè dịka ‘àjà ndị a.’
  alternative: Ịsụgharị ya naanị dịka ‘n’ime ha.’
  rationale: Amaokwu ndị bu ụzọ na-ekwu banyere àjà ndị a na-achụ ugboro ugboro. Ikwupụta ihe nnọchiaha ahụ na-ezo aka na ya na-eme ka okwu doo anya n’enweghị ịgbakwụnye echiche ọhụrụ.
- issue: Ike okwu κατ’ ἐνιαυτόν
  choice: ‘kwa afọ,’ nke na-egosi nlọghachi ya n’afọ ọ bụla.
  alternative: ‘afọ ruo n’afọ.’
  rationale: Okwu Grik ahụ na-egosi mmegharị kwa afọ. Isi ederede jiri ụdị Igbo kachasị eke, ebe ihe odide ala peeji na-edebe ụzọ ọzọ nke na-emesi mmegharị ahụ ike.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke ugbu a, dị ùgwù ma dị mfe nghọta. E ji akara ụda olu mee ka ‘àjà’ pụọ iche n’‘aja,’ ma ahịrịokwu ahụ ka na-adị mfe ịgụ.
