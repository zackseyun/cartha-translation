revisions:
- from: Ma n’àjà ndị a, a na-echetara ndị mmadụ mmehie ha kwa afọ.[a]
  to: Ma n’àjà ndị a, e nwere ncheta mmehie kwa afọ.[a]
  rationale: The revision removes added participants and possession while retaining the explicit sacrificial referent supplied from the immediate context. It uses a nominal expression corresponding closely to ἀνάμνησις ἁμαρτιῶν and preserves the recurring annual force of κατ’ ἐνιαυτόν.
