review_pass:
  verdict: revise
  source_fidelity: The draft correctly identifies the referent of ἐν αὐταῖς as the sacrifices and renders the annual recurrence accurately. However, “ndị mmadụ” and the possessive “ha” introduce an explicit human referent and possession not stated in the Greek, which simply says that there is a remembrance of sins.
  naturalness: “E nwere ncheta mmehie” is concise, idiomatic Standard Igbo in a formal biblical register and preserves the source’s nominal construction better than the verbal paraphrase.
  terminology: “Àjà” appropriately renders the sacrificial referent, and “mmehie” correctly renders ἁμαρτιῶν. “Ncheta” adequately conveys ἀνάμνησις here without implying removal or forgiveness of sins.
  issues:
  - severity: medium
    issue: The phrase “a na-echetara ndị mmadụ mmehie ha” adds “ndị mmadụ” (“people”) and “ha” (“their”).
    rationale: Neither an explicit recipient nor a possessive pronoun occurs in ἀνάμνησις ἁμαρτιῶν. The surrounding context may suggest worshipers, but the translation should retain the Greek’s concise, non-explicit formulation.
  revised_text: Ma n’àjà ndị a, e nwere ncheta mmehie kwa afọ.[a]
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “afọ ruo n’afọ.”
    reason: lexical_alternative
