  text: ἔτι γὰρ μικρὸν ὅσον ὅσον, ὁ ἐρχόμενος ἥξει καὶ οὐ χρονίσει·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/037.yaml
  text: For yet a very little while[b][a], the one who is coming will come and will not delay.
translation:
  language: ig
  text: N’ihi na, obere oge fọdụrụ—obere oge nnọọ—[b] onye na-abịa[a] ga-abịa, ọ gaghị egbu oge.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “Onye Na-abịa.” Okwu Grik ahụ nwekwara ike ịpụta nanị “onye na-abịa,” ma n’ọnọdụ a o nwekwara ike ịbụ aha e ji atụ Mesaya aka.
    reason: alternative_reading
  - marker: b
    text: Okwu Grik ahụ na-emegharị ὅσον (“ole/as much”) ugboro abụọ; ọ bụ akpaalaokwu na-emesi ike na oge ahụ dị nnọọ mkpụmkpụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔτι γὰρ
  choice: N’ihi na, ọ fọdụrụ
  rationale: γάρ na-egosi ihe mere e ji kwuo agbamume gara aga, ebe ἔτι na-egosi na oge ka fọdụrụ. Nkebiokwu a na-ebupụta ha abụọ n’Igbo dị ire.
- source_word: μικρὸν ὅσον ὅσον
  choice: naanị nwa oge dị nnọọ ntakịrị
  rationale: Nkwughachi ὅσον ὅσον na-emesi ịdị mkpụmkpụ nke oge ike; nsụgharị a na-egosipụta nkwusi ike ahụ n’Igbo nke oge a kama ịmegharị okwu Grik n'ụzọ na-ekwekọghị n'usoro Igbo.
- source_word: ὁ ἐρχόμενος
  choice: Onye ahụ na-abịa
  rationale: Nke a na-echekwa participle nwere article dị ka aha onye, ma na-ahapụkwa ohere nke ịbụ okwu nkịtị ma ọ bụ aha a na-eji atụ Mesaya aka, dịka ihe gbara amaokwu ahụ gburugburu si kwe omume.
- source_word: ἥξει
  choice: ga-abịa
  rationale: Oge ọdịnihu a na-ekwu kpọmkwem na ọ ga-abịa, ma na-echekwa nkwughachi mgbọrọgwụ okwu ‘ịbịa’ nke dị na Grik.
- source_word: οὐ χρονίσει
  choice: ọ gaghị egbu oge
  rationale: Nke a bụ ụzọ Igbo doro anya ma bụrụ nke oge a isi kwuo na onye ahụ agaghị anọ ọdụ ma ọ bụ bịarute n’oge gafere.
theological_decisions:
- issue: Ma ὁ ἐρχόμενος ò kwesịrị ịbụ aha Mesaya pụrụ iche ka ọ bụ nkebiokwu participle nkịtị
  choice: Onye ahụ na-abịa
  alternative: Onye Na-abịa
  rationale: E ji okwu nkịtị nwere nkwanye ugwu sụgharịa ya ka e chekwaa ọdịdị participle nke Grik na ike o nwere ịrụ ọrụ dị ka aha e ji amata Mesaya, n’ebughị ụzọ kpebie ihe Grik hapụrụ ka ọnọdụ ya kọwaa.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E jiri “nwa oge dị nnọọ ntakịrị” mee ka akpaalaokwu Grik doo anya, ma e zere okwu ochie na nkọwa ụka pụrụ iche.
