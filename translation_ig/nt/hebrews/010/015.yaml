revisions:
- from: Mmụọ Nsọ na-agbakwaara anyị àmà[a]; n’ihi na mgbe o kwusịrị,
  to: Mmụọ Nsọ na-agbakwa anyị àmà[a]; n’ihi na, mgbe ọ kwusịrị,
  rationale: 'The revision preserves the Greek syntax and sense: the Holy Spirit presently testifies to the readers, with -kwa- expressing the additive καί; “n’ihi na, mgbe ọ kwusịrị” retains γάρ and the temporal sequence of μετὰ τὸ εἰρηκέναι. It corrects the idiomatic form of the Igbo witness expression and pronoun orthography without resolving any ambiguity beyond the source text.'
  reviewer_model: gpt-5.6-terra
