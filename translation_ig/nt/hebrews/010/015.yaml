  yaml_path: translation/nt/hebrews/010/015.yaml
  text: And the Holy Spirit also testifies to us[a]; for after saying,
translation:
  language: ig
  text: Mmụọ Nsọ na-agbakwa anyị àmà[a]; n’ihi na, mgbe ọ kwusịrị,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “na-agbakwa anyị akaebe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μαρτυρεῖ
  choice: na-agbakwaara … àmà
  rationale: Ọ na-egosipụta omume ịgba àmà nke dị na ngwaa Grik μαρτυρέω n’asụsụ Igbo dị ugbu a; ọdịdị ugbu a nke ngwaa ahụ ka e chekwara.
- source_word: δὲ
  choice: na-
  rationale: N’ebe a, δέ bụ njikọ dị nro na-aga n’ihu n’arụmụka ahụ, ọ bụghị nnukwu mmegide; usoro Igbo a jikọtara ahịrịokwu ahụ n’ụzọ eke.
- source_word: ἡμῖν
  choice: anyị
  rationale: E tinyere onye a na-agbara àmà n’usoro ngwaa Igbo ‘ịgbara mmadụ àmà,’ nke kwekọrọ na dative Grik.
- source_word: καὶ
  choice: -kwa-
  rationale: 'Mgbakwunye -kwa- na-egosipụta ike mgbakwunye nke καί: Mmụọ Nsọ sokwa bụrụ onye àmà.'
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: Mmụọ Nsọ
  rationale: Nke a bụ aha a na-ejikarị n’Igbo ugbu a maka Mmụọ ahụ a kapịrị ọnụ; ọ naghị egosi naanị mmụọ nke dị nsọ.
- source_word: μετὰ γὰρ τὸ εἰρηκέναι
  choice: n’ihi na mgbe o kwusịrị
  rationale: ‘Mgbe … kwusịrị’ na-egosipụta usoro oge nke μετά tinyere infinitive; ‘o’ na-eme ka Igbo doo anya ma na-ezo aka n’azụ nye Mmụọ Nsọ dịka onye kwuru okwu.
theological_decisions:
- issue: Mmụọ Nsọ dị ka onye ji aka ya agba àmà
  choice: Mmụọ Nsọ na-agbakwaara anyị àmà
  alternative: Mmụọ Nsọ na-enyekwa anyị akaebe
  rationale: Nhọrọ ahụ na-echekwa syntax Grik nke na-egosi Mmụọ Nsọ dịka onye na-eme omume ịgba àmà, n’ebughị nkọwa ụka ọzọ abụghị nke ederede.
translation_notes:
  register: Asụsụ Igbo Izugbe dị ugbu a, dị ugwu ma dị mfe nghọta. A họọrọ ‘ịgbara mmadụ àmà’ iji chekwaa echiche onye-àmà; ahịrịokwu ahụ kwụsịrị na koma n’ihi na amaokwu na-esonụ ga-eweta okwu e hotara.
