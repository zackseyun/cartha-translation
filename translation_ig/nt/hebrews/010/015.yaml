review_pass:
  verdict: revise
  source_fidelity: The draft correctly identifies the Holy Spirit as the subject of μαρτυρεῖ, retains the present testimony/witness sense, represents the additive force of καί with -kwa-, and appropriately understands the implied subject of εἰρηκέναι as the Holy Spirit. The temporal construction is retained. However, the verbal complementation in the main clause needs adjustment for idiomatic Igbo.
  naturalness: “Na-agbakwaara anyị àmà” is not the most natural realization of the standard construction “ịgba mmadụ àmà.” “Na-agbakwa anyị àmà” is idiomatic Standard Igbo. The third-person pronoun should be written “ọ,” not “o.” A comma after “n’ihi na” helps reflect the subordinate temporal phrase without adding meaning.
  terminology: “Mmụọ Nsọ” is the established, natural Standard Igbo designation. “Àmà” preserves the witness/testimony imagery of μαρτυρέω. The alternative “na-agbakwa anyị akaebe” is a closer and more idiomatic lexical alternative than “na-enyekwa anyị akaebe.”
  issues:
  - severity: medium
    issue: Main-clause verb form is unidiomatic
    rationale: The draft’s “na-agbakwaara anyị àmà” unnecessarily uses the applicative-like -ara- form. In Standard Igbo, “ịgba mmadụ àmà” is naturally expressed here as “na-agba anyị àmà.”
  - severity: low
    issue: Third-person pronoun orthography
    rationale: The implied subject in the temporal clause should be spelled “ọ” rather than “o.”
  - severity: low
    issue: Footnote alternative is less precise and less idiomatic
    rationale: “Na-enyekwa anyị akaebe” can suggest giving us evidence, whereas “na-agbakwa anyị akaebe” directly retains the witnessing/testifying sense and is a natural alternative expression.
  revised_text: Mmụọ Nsọ na-agbakwa anyị àmà[a]; n’ihi na, mgbe ọ kwusịrị,
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “na-agbakwa anyị akaebe.”
    reason: lexical_alternative
  revision_rationale: 'The revision preserves the Greek syntax and sense: the Holy Spirit presently testifies to the readers, with -kwa- expressing the additive καί; “n’ihi na, mgbe ọ kwusịrị” retains γάρ and the temporal sequence of μετὰ τὸ εἰρηκέναι. It corrects the idiomatic form of the Igbo witness expression and pronoun orthography without resolving any ambiguity beyond the source text.'
