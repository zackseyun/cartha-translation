id: HEB.10.12
reference: Hebrews 10:12
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸀οὗτος δὲ μίαν ὑπὲρ ἁμαρτιῶν προσενέγκας θυσίαν εἰς τὸ διηνεκὲς ἐκάθισεν ἐν δεξιᾷ τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/012.yaml
  text: But this one[a], after offering one sacrifice for sins for all time, sat down at the right hand of God[b],
translation:
  language: ig
  text: Ma onye a, ebe ọ chụchara otu aja maka mmehie nke na-adị irè ruo mgbe ebighị ebi[a], nọdụụrụ ala n'aka nri Chineke[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ebe ọ chụchara otu aja maka mmehie ruo mgbe ebighị ebi.” Ahịrịokwu Grik ahụ nwekwara ike ịkọwa ịnọdụ ala ya ruo mgbe ebighị ebi; ma ebe e tinyere ya ebe a na-emesi ịdị irè na-adịgide adịgide nke aja ahụ ike.
    reason: alternative_reading
  - marker: b
    text: “N'aka nri Chineke” na-echetara Abụ Ọma 110:1, amaokwu dị mkpa n'akwụkwọ Ndị Hibru nke na-ekwu banyere ibuli Mesaya elu.
    reason: cross_reference
lexical_decisions:
- source_word: οὗτος
  choice: onye a
  rationale: Ọ na-edobe ike ngosipụta nke okwu Grik ahụ ma na-egosipụta ọdịiche dị n'etiti Kraịst na ndị nchụaja a kpọtụrụ aha n'amaokwu bu ụzọ.
- source_word: δὲ
  choice: Ma
  rationale: Ọ na-egosi ọdịiche dị n'etiti onye a na ndị nchụaja na-eguzo kwa ụbọchị na-achụ aja ugboro ugboro.
- source_word: μίαν ... θυσίαν
  choice: otu aja
  rationale: Ọ na-edobe nkwusi ike Grik ahụ na ọ bụ naanị otu aja, n'adịghị ka ọtụtụ aja a na-achụ ugboro ugboro.
- source_word: ὑπὲρ ἁμαρτιῶν
  choice: maka mmehie
  rationale: Nke a bụ ụzọ Igbo doro anya ma kwekọọ na ọnọdụ ịchụ aja; a debekwara ọtụtụ nke okwu Grik ahụ site n'iji “mmehie.”
- source_word: προσενέγκας
  choice: mgbe ọ chụchara
  rationale: Ọ na-egosi na ịchụ aja ahụ buru ụzọ mee tupu ọ nọdụ ala, ma na-eji okwu Igbo a na-ejikarị ekwu banyere ịchụ aja.
- source_word: εἰς τὸ διηνεκές
  choice: nke na-adịgide ruo mgbe ebighị ebi
  rationale: Ọ na-egosipụta ịdịgide adịgide nke otu aja ahụ na uru ya, ma ihe e dere n'okpuru peeji na-echekwa ụzọ ọzọ e nwere ike isi jikọta ahịrịokwu Grik ahụ.
- source_word: ἐκάθισεν
  choice: ọ nọdụrụ ala
  rationale: Ọ na-edobe omume ahụ dị ka ihe mezuru ma kwekọọ n'onyonyo nke onye e buliri elu wee nọdụ n'oche nsọpụrụ.
- source_word: ἐν δεξιᾷ τοῦ θεοῦ
  choice: n'aka nri Chineke
  rationale: Ọ bụ okwu Igbo doro anya nke na-echekwa njikọ ya na Abụ Ọma 110:1 na isiokwu ibuli Mesaya elu.
theological_decisions:
- issue: Ihe εἰς τὸ διηνεκές na-akọwa
  choice: 'E jikọtara ya n''ụzọ bụ isi na ịdịgide adịgide nke otu aja ahụ: “nke na-adịgide ruo mgbe ebighị ebi.”'
  alternative: A pụrụ ijikọ ya kpọmkwem na ịchụ aja ahụ—“ọ chụrụ otu aja maka mmehie otu ugboro ruo mgbe ebighị ebi”—ma ọ bụ na ịnọdụ ala—“ọ nọdụrụ ala ruo mgbe ebighị ebi n'aka nri Chineke.”
  rationale: N'ime arụmụka Hibru 10, ahịrịokwu ahụ na-emesi ịdị irè na-adịgide adịgide nke otu aja ahụ ike n'ụzọ dabara na ọdịiche dị n'etiti ya na aja ndị a na-achụ ugboro ugboro. Ihe e dere n'okpuru peeji na-echekwa nghọtahie nhazi okwu Grik ahụ kama imechi ụzọ ndị ọzọ kpamkpam.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “Onye a” na-echekwa nkwusi ike nke οὗτος; “chụọ aja” bụ okwu ọdịnala ma ka bụkwa okwu ndị mmadụ na-aghọta nke ọma n'ọnọdụ ofufe.
