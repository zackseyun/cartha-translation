revisions:
- from: Ma onye a, mgbe ọ chụchara otu aja maka mmehie, nke na-adịgide ruo mgbe ebighị ebi[a], ọ nọdụrụ ala n'aka nri Chineke[b].
  to: Ma onye a, ebe ọ chụchara otu aja maka mmehie nke na-adị irè ruo mgbe ebighị ebi[a], nọdụụrụ ala n'aka nri Chineke[b].
  rationale: The revision moves the permanent-effect wording into a relative clause whose antecedent is unmistakably “otu aja.” It maintains the source’s contrast, singular sacrifice, sacrificial terminology, and Psalm 110 enthronement language. The footnote preserves the relevant grammatical alternatives rather than treating one attachment as certain.
