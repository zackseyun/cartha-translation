id: HEB.10.25
reference: Hebrews 10:25
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: μὴ ἐγκαταλείποντες τὴν ἐπισυναγωγὴν ἑαυτῶν, καθὼς ἔθος τισίν, ἀλλὰ παρακαλοῦντες, καὶ τοσούτῳ μᾶλλον ὅσῳ βλέπετε ἐγγίζουσαν τὴν ἡμέραν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/025.yaml
  text: not neglecting our own gathering together[a], as is the habit of some[b], but encouraging one another—and all the more as you see the Day drawing near.
translation:
  language: ig
  text: Ka anyị ghara ileghara nzukọ anyị anya[a], dị ka ọ ghọworo omume ụfọdụ; kama ka anyị na-agbarịta ibe anyị ume, karịakwa ka unu na-ahụ na Ụbọchị ahụ na-abịaru nso.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “ịhapụ” ma ọ bụ “ịgbahapụ” nzukọ anyị.
    reason: lexical_alternative
  - marker: b
    text: “Ụbọchị ahụ” nwere ike ịbụ ụbọchị ọbịbịa Onyenweanyị ma ọ bụ ụbọchị ikpe ikpeazụ.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγκαταλείποντες
  choice: ileghara ... anya
  rationale: N'ọnọdụ a, okwu ahụ na-egosi ịhapụ ilekọta ma ọ bụ ịkwụsị iso nzukọ; nkebi a na-egosi eleghara anya n'ụzọ Igbo dị ugbu a n'etinyeghị ozugbo echiche nke ịhapụ okwukwe kpamkpam.
- source_word: ἐπισυναγωγὴν ἑαυτῶν
  choice: nzukọ anyị na-ezukọ
  rationale: Nke a na-egosi nzukọ ndị kwere ekwe na-ezukọta ọnụ, ma zere itinye echiche ụlọ ụka ma ọ bụ usoro ofufe nke okwu Grik ahụ ekwughị kpọmkwem.
- source_word: καθὼς ἔθος τισίν
  choice: dị ka ụfọdụ si eme ka ọ bụrụ omume ha
  rationale: Ọ na-edobe echiche nke omume mmadụ na-eme ugboro ugboro, tinyere ịdọ aka ná ntị dị nro nke onye dere akwụkwọ ahụ.
- source_word: παρακαλοῦντες
  choice: na-agbarịta ibe anyị ume
  rationale: Okwu a nwere ike ịbụ ịgba ume, ịrịọsi ike, ma ọ bụ ịdụ ọdụ. N'ebe a, ịgbarịta ibe ume dabara na ọnọdụ obodo na nkwụsi ike, ma gosipụta mmekọrịta a na-aghọta n'okwu ahụ.
- source_word: τοσούτῳ μᾶλλον ὅσῳ
  choice: ọbụna karịa ka
  rationale: Nkebi a na-egosi na ịgba ume ahụ kwesịrị ịba ụba dịka Ụbọchị ahụ na-abịaru nso.
- source_word: βλέπετε
  choice: unu na-ahụ
  rationale: Ọ na-edobe ụdị onye nke abụọ ọtụtụ na nghọta sara mbara nke ịhụ ma ọ bụ ịmata.
- source_word: ἐγγίζουσαν
  choice: na-abịaru nso
  rationale: Nke a bụ okwu Igbo nkịtị ma doo anya nke na-egosi na oge ahụ na-eru nso.
- source_word: τὴν ἡμέραν
  choice: Ụbọchị ahụ
  rationale: Mkpụrụedemede ukwu na okwu nrụaka ‘ahụ’ na-egosi ụbọchị ikpeazụ a maara n'ọnọdụ ahụ, n'agbanyeghị na ederede Grik akpọghị ya kpọmkwem ‘Ụbọchị Onyenweanyị’.
theological_decisions:
- issue: Ihe ‘Ụbọchị ahụ’ na-ezo aka na ya
  choice: Ụbọchị ahụ
  alternative: ụbọchị Onyenweanyị; ụbọchị ikpe ikpeazụ
  rationale: Ọnọdụ ahụ na-egosi ụbọchị ikpeazụ nke Chineke, ma nsụgharị ahụ ekwesịghị ịgbasa okwu Grik site n'ịkpọ ya aha karịa ka ederede si kwuo.
- issue: Onye a na-agba ume na παρακαλοῦντες
  choice: na-agbarịta ibe anyị ume
  alternative: na-agba ume
  rationale: Ọ bụ ezie na Grik etinyeghị nnara okwu ahụ n'ahịrị a, ọnọdụ nzukọ obodo na-egosi omume ibe na ibe; ụdị Igbo a na-eme ka mmekọrịta ahụ doo anya n'ụzọ ebumpụta ụwa.
translation_notes:
  register: Standard Igbo dị ugbu a, nwee nsọpụrụ ma dị mfe nghọta. E ji ‘anyị’ mee ihe dịka n'ederede Grik nke gụnyere onye na-ekwu okwu na ndị ọ na-agwa; e zere okwu ụka pụrụ iche na nkọwa nke otu denomination.
