revisions:
- from: Ka anyị ghara ileghara nzukọ anyị na-ezukọ anya[a], dị ka ụfọdụ si eme ka ọ bụrụ omume ha; kama, ka anyị na-agbarịta ibe anyị ume—ọbụna karịa ka unu na-ahụ na Ụbọchị ahụ na-abịaru nso.[b]
  to: Ka anyị ghara ileghara nzukọ anyị anya[a], dị ka ọ ghọworo omume ụfọdụ; kama ka anyị na-agbarịta ibe anyị ume, karịakwa ka unu na-ahụ na Ụbọchị ahụ na-abịaru nso.[b]
  rationale: The revision removes a redundant expression for “gathering,” improves the idiomatic rendering of the habitual conduct and the increasing exhortation, and clarifies the footnote’s possible eschatological identification without expanding the translation itself.
