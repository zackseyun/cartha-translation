  text: ἀθετήσας τις νόμον Μωϋσέως χωρὶς οἰκτιρμῶν ἐπὶ δυσὶν ἢ τρισὶν μάρτυσιν ἀποθνῄσκει·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/028.yaml
  text: Anyone who has set aside the law of Moses dies without mercy on the testimony of two or three witnesses[a].
translation:
  language: ig
  text: Onye ọ bụla jụrụ iwu Mosis na-anwụ n’enweghị ebere, dabere n’agba ama ndị akaebe abụọ ma ọ bụ atọ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “a na-egbu ya.” N’asụsụ Grik, okwu ahụ pụtara kpọmkwem “na-anwụ,” ma ebe a ọ na-ekwu banyere igbu onye a mara ikpe dịka iwu Mosis si dị.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀθετήσας
  choice: jụrụ
  rationale: Ngwaa a na-egosi ịjụ ma ọ bụ ileghara ihe nwere ikike anya. “Jụrụ” na-egosipụta ịjụ ikike iwu ahụ n’ụzọ doro anya n’Igbo, n’ebughị ụzọ kọwaa ụdị mmehie ahụ karịa ihe Grik kwuru.
- source_word: τις
  choice: Onye ọ bụla
  rationale: Nnọchiaha a na-ekwu banyere onye ọ bụla n’ozuzu ya; nhọrọ a bụ Igbo nkịtị ma na-edobe ike okwu ahụ.
- source_word: νόμον Μωϋσέως
  choice: iwu Mosis
  rationale: Nke a bụ ntụgharị doro anya na nke a na-aghọta ngwa ngwa nke genitive Grik ahụ.
- source_word: χωρὶς οἰκτιρμῶν
  choice: n’enweghị ebere
  rationale: Ọ bụ ụzọ Igbo si ekwu okwu n’ụzọ ebumpụta ụwa ma dabara n’ọnọdụ ikpe a.
- source_word: ἐπὶ δυσὶν ἢ τρισὶν μάρτυσιν
  choice: ma akaebe ndị akaebe abụọ ma ọ bụ atọ kwado ikpe ahụ
  rationale: ἐπί na dative na-egosi ihe e ji tụọ ma kpebie ikpe. Nhọrọ a na-eme ka usoro ikpe pụta ìhè n’Igbo ma na-edobe ndị akaebe abụọ ma ọ bụ atọ dịka ntọala mkpebi ahụ.
- source_word: ἀποθνῄσκει
  choice: na-anwụ
  rationale: Nke a na-edobe okwu Grik nkịtị “na-anwụ” na ọdịdị present nke na-ekwupụta ihe iwu na-eme mgbe niile, kama ịgbakwunye causative n’ahịrị bụ isi.
theological_decisions:
- issue: Ma a ga-eme ka echiche igbu mmadụ dịka ntaramahụhụ ikpe pụta ìhè n’ἀποθνῄσκει
  choice: E debere “na-anwụ” n’ahịrị bụ isi.
  alternative: a na-egbu ya
  rationale: Ọnọdụ iwu Mosis na akaebe ndị akaebe na-egosi ikpe ọnwụ, ma ngwaa Grik n’onwe ya pụtara “na-anwụ.” Ya mere, ahịrị bụ isi na-edobe njide onwe nke isi mmalite, ebe ndetu ala na-akọwa nhọrọ ikpe ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. A họọrọ usoro ahịrịokwu nke na-eme ka ọnọdụ ikpe doo anya n’enweghị itinye nkọwa okpukpe pụrụ iche.
