    text: A pụkwara ịsị, “a na-egbu ya.” N’asụsụ Grik, okwu ahụ pụtara kpọmkwem “na-anwụ,” ma ebe a ọ na-ekwu banyere igbu onye a mara ikpe dịka iwu Mosis si dị.
    reason: lexical_alternative
  revision_rationale: The revision replaces the redundant, interpretively expanded witness clause with an idiomatic Standard Igbo expression meaning “on the testimony of two or three witnesses.” It preserves the Greek legal-evidentiary basis without adding a separate assertion that the witnesses validate a case. The main verb remains “na-anwụ,” corresponding closely to ἀποθνῄσκει; the footnote retains the judicial-execution alternative.
