    text: Ma ọ bụ, “ntụkwasị obi.” Okwu Grik a pụrụ ịpụta obi ike na nnwere onwe mmadụ nwere, karịsịa n'ịbịaru Chineke nso; ọ pụkwara ịgụnye ikwu okwu n'ezoghị ọnụ.
    reason: lexical_alternative
  revision_rationale: The revision changes only the rendering of παρρησία. “Obi ike” is an idiomatic Standard Igbo expression for the courageous confidence urged in the verse. The revised note preserves the lexical alternative and the term’s associated sense of open speech.
