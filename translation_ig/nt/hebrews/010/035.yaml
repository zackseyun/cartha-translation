  text: μὴ ἀποβάλητε οὖν τὴν παρρησίαν ὑμῶν, ἥτις ἔχει ⸂μεγάλην μισθαποδοσίαν⸃,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/035.yaml
  text: Therefore[a], do not throw away your boldness, which has a great reward,
translation:
  language: ig
  text: Ya mere, unu atụfula obi ike unu[a], nke nwere ụgwọ ọrụ dị ukwuu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ntụkwasị obi.” Okwu Grik a pụrụ ịpụta obi ike na nnwere onwe mmadụ nwere, karịsịa n'ịbịaru Chineke nso; ọ pụkwara ịgụnye ikwu okwu n'ezoghị ọnụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ ἀποβάλητε
  choice: unu atụfula
  rationale: 'Ọ bụ mmachibido iwu nke na-egosi omume mmadụ kpachapụrụ anya mee: ịtụfu ma ọ bụ ịhapụ ihe, ọ bụghị naanị ka ihe funahụ mmadụ.'
- source_word: οὖν
  choice: Ya mere
  rationale: Na-egosi nkwubi okwu sitere n'okwu agbamume na ihe atụ ndị bu ụzọ.
- source_word: παρρησίαν
  choice: nkwuwa okwu
  rationale: N'akwụkwọ Ndị Hibru, okwu a na-egosi nnwere onwe na obi ike mmadụ nwere ịbịaru Chineke nso, nakwa iguzosi ike n'okwukwe n'ihu ọha. “Nkwuwa okwu” na-echekwa echiche nke obi ike na nnwere onwe ikwu okwu.
- source_word: ὑμῶν
  choice: unu
  rationale: Na-egosi na nkwuwa okwu ahụ bụ nke ndị a na-agwa okwu.
- source_word: ἥτις
  choice: nke
  rationale: Na-ewebata nkọwa banyere ụdị uru nkwuwa okwu ahụ nwere.
- source_word: ἔχει
  choice: nwere
  rationale: Nsụgharị kwụ ọtọ nke ngwaa dị n'oge ugbu a; ọ naghị akọwakarị mmekọrịta ahụ karịa ihe Grik kwuru.
- source_word: μεγάλην
  choice: dị ukwuu
  rationale: Na-echekwa ike nke nkọwa ahụ ma bụrụkwa okwu Igbo e ji akọwa ụgwọ ọrụ bara nnukwu uru.
- source_word: μισθαποδοσίαν
  choice: ụgwọ ọrụ
  rationale: Na-egosi ụgwọ ma ọ bụ ihe a na-akwụghachi mmadụ n'ụzọ dị mma; ọ dabara n'echiche nke ụgwọ ọrụ dị n'ọdịnihu n'akwụkwọ Ndị Hibru.
theological_decisions:
- issue: Ihe παρρησία pụtara na Ndị Hibru 10:35
  choice: “Nkwuwa okwu” na-egosi obi ike na nnwere onwe ndị kwere ekwe nwere n'ihu Chineke nakwa n'iguzosi ike n'okwukwe.
  alternative: “Ntụkwasị obi”
  rationale: “Ntụkwasị obi” bụ ihe okwu Grik ahụ nwekwara ike ịpụta, ma ọ pụrụ ime ka uche gaa naanị n'obi mmadụ. “Nkwuwa okwu” na-echekwa echiche nke nnwere onwe, obi ike, na okwukwe a na-egosipụta n'ihu ọha, n'emechighị ohere nke ntụkwasị obi n'ihu Chineke.
translation_notes:
  register: E ji Standard Igbo dị ugwu ma dị mfe nghọta. “Atụfula” na-echekwa ike nke ἀποβάλλω dị ka omume ịjụ ma ọ bụ ịhapụ ihe kpachapụrụ anya; “nkwuwa okwu” na-ahapụkwa obosara ihe παρρησία pụtara, ebe ndetu ala na-egosi nhọrọ “ntụkwasị obi.”
