  yaml_path: translation/nt/hebrews/010/031.yaml
  text: It is a fearful thing to fall into the hands of the living God[a].
translation:
  language: ig
  text: Ọ dị egwu ịdaba n'aka Chineke dị ndụ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Ọ dị nnọọ egwu ịdaba n'aka Chineke dị ndụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: φοβερὸν
  choice: ihe na-atụ egwu
  rationale: Okwu a na-egosi ihe na-akpalite egwu ma ọ bụ ụjọ dị ukwuu. Nkebiokwu Igbo a na-edobe ịdị arọ nke ịdọ aka ná ntị ahụ n’asụsụ doro anya ma dị ùgwù.
- source_word: τὸ ἐμπεσεῖν
  choice: ịdaba
  rationale: Infinitive a pụtara ‘ịdaba’; ya na nkebiokwu na-esochi ya na-egosi ịbanye n’okpuru ike onye ọzọ, ọ bụghị nanị izute ya.
- source_word: εἰς χεῖρας
  choice: n’aka
  rationale: Nke a bụ ụzọ e si ekwu na mmadụ abanyela n’okpuru ike ma ọ bụ ikpe onye ọzọ. ‘N’aka’ na-edobe onyinyo okwu Hibru na Grik nke Akwụkwọ Nsọ n’Igbo nkịtị.
- source_word: θεοῦ
  choice: Chineke
  rationale: Ọ bụ genitive nke na-akọwa onye aka ahụ bụ nke ya; ntụgharị kwụ ọtọ bụ ‘Chineke.’
- source_word: ζῶντος
  choice: dị ndụ
  rationale: Ọ na-akọwa Chineke dịka onye dị ndụ ma na-arụ ọrụ. ‘Chineke dị ndụ’ bụ okwu Igbo doro anya nke na-edobe aha nkọwa ahụ.
theological_decisions:
- issue: Ike nke okwu ịdọ aka ná ntị a
  choice: Nkwupụta siri ike banyere egwu dị n’ịbanye n’okpuru ike ikpe nke Chineke dị ndụ
  alternative: Ịdọ aka ná ntị gbasara naanị ntaramahụhụ nke oge a, ma ọ bụ okwu banyere egwu n’enweghị echiche ikpe
  rationale: Ọnọdụ gbara amaokwu ahụ gburugburu bụ ịdọ aka ná ntị, ‘ịdaba n’aka’ nwekwara echiche nke ịbanye n’okpuru ikike ikpe. Agbanyeghị, e tinyeghị okwu ‘ikpe’ n’amaokwu ahụ n’ihi na Grik ekwughị ya kpọmkwem; a hapụrụ nkebiokwu ahụ ka ọ buru ibu echiche ya.
translation_notes:
  register: Standard Igbo nke oge a, dị mfe nghọta ma dị ùgwù. A họọrọ ‘ihe na-atụ egwu’ iji debe ọdịdị predicate adjective na infinitive nke Grik; ‘n’aka’ na-edobe ihe atụ Akwụkwọ Nsọ ma na-ada nke ọma n’Igbo.
