- from: Ọ bụ ihe na-atụ egwu ịdaba n’aka Chineke dị ndụ.[a]
  to: Ọ dị egwu ịdaba n'aka Chineke dị ndụ.[a]
  rationale: 'The revision preserves the Greek articular-infinitive sense idiomatically: “it is dreadful to fall.” It retains “ịdaba n''aka Chineke dị ndụ,” including the biblical hands/power imagery, while replacing an ambiguous Igbo expression with the customary and clear predicate “Ọ dị egwu.” The footnote supplies a slightly stronger lexical alternative corresponding to “terrifying.”'
