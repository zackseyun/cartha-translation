  text: ὁλοκαυτώματα καὶ περὶ ἁμαρτίας οὐκ εὐδόκησας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/006.yaml
  text: In whole burnt offerings and sin offerings you took no pleasure[a].
translation:
  language: ig
  text: Àjà nsure ọkụ kpamkpam na àjà maka mmehie emeghị gị obi ụtọ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịtụgharị ya, “Àjà nsure ọkụ na àjà a na-achụ maka mmehie.” Nkebiokwu Grik περὶ ἁμαρτίας bụ akpaalaokwu metụtara àjà, nke pụtara àjà a na-achụ maka mmehie.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁλοκαυτώματα
  choice: àjà nsure ọkụ kpamkpam
  rationale: Nke a na-egosi àjà a na-esure ọkụ ya dum, ma na-edokwa ya iche n’ụdị àjà ndị ọzọ.
- source_word: καὶ
  choice: na
  rationale: Njikọ nkịtị nke jikọtara ụdị àjà abụọ ahụ.
- source_word: περὶ ἁμαρτίας
  choice: àjà maka mmehie
  rationale: N’ọnọdụ okwu gbasara àjà, nkebiokwu Grik a bụ aha e ji akọwa àjà a na-achụ maka mmehie; ntụgharị a bụ nke doro anya ma bụrụkwa nke okike n’Igbo.
- source_word: οὐκ εὐδόκησας
  choice: emeghị gị obi ụtọ
  rationale: Na-echekwa ngọnarị ahụ na okwu a gwara Chineke n’onye nke abụọ, ma na-enye echiche nke enweghị afọ ojuju ma ọ bụ mmasị n’ụzọ Igbo nkịtị.
theological_decisions:
- issue: Okwu kpọmkwem banyere ụdị àjà dị na nhota Abụ Ọma 40:6 LXX na arụmụka Ndị Hibru 10
  choice: E ji “àjà nsure ọkụ kpamkpam” na “àjà maka mmehie” mee ka ụdị àjà abụọ ahụ pụta ìhè.
  alternative: “àjà nsure ọkụ na àjà mmehie” ma ọ bụ okwu izugbe “àjà dị iche iche”
  rationale: Ịhapụ aha ụdị àjà ndị ahụ kpọmkwem na-enyere onye na-agụ ya aka iso ọdịiche akwụkwọ ahụ na-eme n’etiti àjà ndị a na nrubeisi na onyinye nke Ọkpara, n’etinyeghị nkọwa ozizi ọzọ.
translation_notes:
  register: Standard Igbo; asụsụ dị ugbu a, kwụ ọtọ ma dị nsọ. E debere okwu àjà ndị ahụ kpọmkwem ma zere okwu okpukpe nke otu ụka pụrụ iche.
