  text: and a great priest over the house of God[b][a],
translation:
  language: ig
  text: anyị nwekwara onye nchụàjà dị ukwuu nke na-ahụ maka ụlọ Chineke[b][a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “onyeisi nchụàjà.” Akwụkwọ Ndị Hibru na-akọwakarị Jizọs dị ka onyeisi nchụàjà, ma okwu e dere kpọmkwem n'amaokwu a bụ “onye nchụàjà dị ukwuu.”
    reason: alternative_reading
  - marker: b
    text: “Ụlọ Chineke” nwekwara ike ịpụta ezinụlọ Chineke, ya bụ, ndị ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: anyị nwekwara
  rationale: N'usoro ahịrịokwu sara mbara nke amaokwu 19–21, καὶ jikọtara ihe ọzọ ndị kwere ekwe nwere na nke e kwuru tupu ya; “anyị nwekwara” na-eme ka njikọ ahụ doo anya n'Igbo.
- source_word: ἱερέα
  choice: onye nchụàjà
  rationale: ἱερεύς pụtara onye nchụàjà. E jighị ἀρχιερεύς, okwu a na-ejikarị akọwa nnukwu onye nchụàjà, n'amaokwu a.
- source_word: μέγαν
  choice: nnukwu
  rationale: μέγας na-egosi ịdị ukwuu ma ọ bụ ịdị elu; “nnukwu” na-edobe ya dị ka nkọwa e nyere onye nchụàjà, kama ime ya ozugbo ka ọ bụrụ aha ọkwa pụrụ iche.
- source_word: ἐπὶ
  choice: na-achị
  rationale: N'ebe a, ἐπί tinyere accusative na-egosi ikike na nlekọta onye ahụ nwere n'ebe ụlọ Chineke dị; “na-achị” bụ ụzọ Igbo doro anya si kwuo nke a.
- source_word: τὸν οἶκον
  choice: ụlọ
  rationale: οἶκος nwere ike ịpụta ụlọ ma ọ bụ ezi-na-ụlọ/ndị ụlọ. “Ụlọ” na-edobe ihe atụ Akwụkwọ Nsọ ma hapụkwa nghọta gbasara ndị Chineke ka ọ dị.
- source_word: τοῦ θεοῦ
  choice: Chineke
  rationale: Genitive a na-egosi na ụlọ ahụ bụ nke Chineke; usoro “ụlọ Chineke” bụ Igbo ebumpụta ụwa.
theological_decisions:
- issue: Ma a ga-atụgharị ἱερέα μέγαν dị ka aha ọkwa pụrụ iche bụ́ “nnukwu onye nchụàjà” n'echiche nke high priest
  choice: nnukwu onye nchụàjà
  alternative: onyeisi nchụàjà / nnukwu onye nchụàjà dị ka aha ọkwa high priest
  rationale: N'agbanyeghị na akwụkwọ Ndị Hibru na-akọwa Jizọs dịka high priest n'ọtụtụ ebe, okwu Grik ebe a bụ ἱερεύς + μέγας, ọ bụghị ἀρχιερεύς. Ya mere, “nnukwu” ka bụ nkọwa banyere ịdị ukwuu ya, ọ bụghị imechi okwu ahụ n'aha ọkwa teknụzụ.
- issue: Ihe “ụlọ Chineke” na-ezo aka na ya
  choice: e debere ihe atụ ahụ dịka “ụlọ Chineke”
  alternative: ezinụlọ Chineke, ya bụ ndị ya
  rationale: οἶκος nwere ma nghọta nke ụlọ ma nke ndị mejupụtara ezinụlọ ma ọ bụ obodo. Idebe “ụlọ” na-echekwa mgbagwoju nghọta ahụ na njikọ ya na Ndị Hibru 3:2–6.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke dị ugbu a ma dị ùgwù. E ji “onye nchụàjà” maka priest; “na-achị” na-egosi ikike/nlekọta nke ἐπὶ. A haziri akara nkọwa ala peeji dịka [b][a] ozugbo e kwuchara “ụlọ Chineke,” kwekọrọ na ihe nke ọ bụla na-akọwa.
