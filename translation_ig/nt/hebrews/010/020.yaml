    reason: cultural_note
  revision_rationale: The revision makes the clause idiomatic in Standard Igbo, expresses the definite curtain, and corrects both footnotes. It preserves the Greek apposition without supplying a second “through” before “his flesh” or imposing an interpretation beyond the text.
