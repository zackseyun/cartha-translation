revisions:
- from: ụzọ ọhụrụ dịkwa ndụ nke o hiwere nye anyị, nke si n’ákwà mgbochi[a] gafee—ya bụ, anụ ahụ ya[b],
  to: nke o hiwere nye anyị dị ka ụzọ ọhụrụ na nke dị ndụ, site n’ákwà mgbochi ahụ[a]—ya bụ, anụ ahụ ya[b],
  rationale: The revision makes the clause idiomatic in Standard Igbo, expresses the definite curtain, and corrects both footnotes. It preserves the Greek apposition without supplying a second “through” before “his flesh” or imposing an interpretation beyond the text.
