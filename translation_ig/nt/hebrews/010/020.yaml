  text: ἣν ἐνεκαίνισεν ἡμῖν ὁδὸν πρόσφατον καὶ ζῶσαν διὰ τοῦ καταπετάσματος, τοῦτ’ ἔστιν τῆς σαρκὸς αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/020.yaml
  text: which he inaugurated for us as a new and living way through the curtain—that is[a], his flesh[b],
translation:
  language: ig
  text: nke o hiwere nye anyị dị ka ụzọ ọhụrụ na nke dị ndụ, site n’ákwà mgbochi ahụ[a]—ya bụ, anụ ahụ ya[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ákwà mkpuchi.”
    reason: lexical_alternative
  - marker: b
    text: Okwu “ya bụ, anụ ahụ ya” na-akọwa ákwà mgbochi ahụ dịka anụ ahụ Jizọs.
    reason: cultural_note
lexical_decisions:
- source_word: ἣν … ὁδὸν
  choice: ụzọ … nke
  rationale: E ji usoro a mee ka nnọchiaha njikọ ahụ na ‘ụzọ’ doo anya n’Igbo, n’agbanyeghị na okwu ndị ahụ kewara onwe ha n’usoro Grik.
- source_word: ἐνεκαίνισεν
  choice: o hiwere
  rationale: ‘O hiwere’ na-egosi na Kraịst guzobere ụzọ ahụ ọhụrụ maka iji ya eme ihe; ọ karịrị naanị ikwu na o meghere ihe mechiri emechi, ma ọ naghị etinye echiche agbakwunyere nke na-adịghị n’amaokwu ahụ.
- source_word: ἡμῖν
  choice: nye anyị
  rationale: Nke a na-egosi na ihe ahụ bụ maka uru anyị.
- source_word: πρόσφατον καὶ ζῶσαν
  choice: ọhụrụ dịkwa ndụ
  rationale: Nke a na-edobe ma ịdị ọhụrụ ụzọ ahụ ma okwu atụ nke na-akpọ ya ụzọ dị ndụ, n’etinyeghị nkọwa ‘na-enye ndụ’ nke ederede ekwughị kpọmkwem.
- source_word: διὰ τοῦ καταπετάσματος
  choice: nke si n’ákwà mgbochi gafee
  rationale: ‘Ákwà mgbochi’ bụ okwu Igbo doro anya maka ákwà nke kewara ebe nsọ ahụ; ‘si … gafee’ na-egosi ụzọ mbata nke διὰ.
- source_word: τοῦτ’ ἔστιν
  choice: ya bụ
  rationale: Nke a bụ usoro nkọwa nkịtị n’Igbo nke na-ejikọta ihe atụ ahụ na nkọwa so ya.
- source_word: τῆς σαρκὸς αὐτοῦ
  choice: anụ ahụ ya
  rationale: ‘Anụ ahụ’ bụ ụzọ Igbo si ekwu σάρξ n’echiche anụ ahụ n’ezie, ma ọ naghị agbanwe ya ka ọ bụrụ echiche nke ‘ọdịdị mmehie.’
theological_decisions:
- issue: Njikọ dị n’etiti ákwà mgbochi ahụ na anụ ahụ Jizọs
  choice: “ya bụ, anụ ahụ ya”
  alternative: “ya bụ, site n’anụ ahụ ya”
  rationale: 'Usoro ahọpụtara na-edobe apposition Grik kpọmkwem: nkebi nke abụọ na-akọwa ákwà mgbochi ahụ dị ka anụ ahụ ya. Ọ naghị ekpebi ma διὰ ga-ekwughachi n’echiche n’ihu ‘anụ ahụ ya,’ ya mere ọ na-echekwa nrụgide na mgbagwoju anya nke ihe atụ ahụ.'
- issue: Nsụgharị σάρξ
  choice: anụ ahụ
  alternative: ahụ
  rationale: ‘Anụ ahụ’ na-eme ka okwu σάρξ pụta ìhè karịa ‘ahụ,’ ma na-egosi mmadụ Kraịst n’anụ ahụ na-enweghị ịgbakwunye nkọwa ụka pụrụ iche.
translation_notes:
  register: Asụsụ a bụ Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta. E debere amaokwu ahụ dịka nkebi ahịrịokwu na-aga n’ihu site n’amaokwu 19, ya mere ọ kwụsịrị na rikoma. E tinyere akara ndetu [a] n’akụkụ okwu ọ na-akọwa kpọmkwem, ma [b] n’akụkụ ‘anụ ahụ ya.’
