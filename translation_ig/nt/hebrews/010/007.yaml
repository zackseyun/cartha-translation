source:
  edition: SBLGNT
  text: τότε εἶπον· Ἰδοὺ ἥκω, ἐν κεφαλίδι βιβλίου γέγραπται περὶ ἐμοῦ, τοῦ ποιῆσαι, ὁ θεός, τὸ θέλημά σου.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/007.yaml
  text: Then I said[a], ‘Behold, I have come—in the scroll of the book it is written about me—to do your will, O God.’
translation:
  language: ig
  text: Mgbe ahụ, m kwuru, “Lee, abịala m—e dere banyere m n’ime mpịakọta akwụkwọ[a]—ịme uche gị, Chineke.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ya bụ, mpịakọta akwụkwọ e dere n’ogologo ma pịakọta; ọ bụghị akwụkwọ e jikọtara ọnụ dịka akwụkwọ nke oge a.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Mgbe ahụ
  rationale: Ọ na-egosi usoro oge ma bụrụ ụzọ Igbo dị nkenke na nke ebumpụta ụwa isi webata okwu a.
- source_word: εἶπον
  choice: m kwuru
  rationale: Nke a bụ nsụgharị Igbo kacha kwekọọ n’usoro okwu nke onye na-akọ ihe kwuru.
- source_word: Ἰδοὺ
  choice: Lee
  rationale: Ọ na-edobe ike okwu nke na-adọta uche na ụda dị nsọ nke ihe e hotara.
- source_word: ἥκω
  choice: abịala m
  rationale: Ọ na-egosi na onye ahụ abịarutela, ebe nsonaazụ ọbịbịa ya ka dị ugbu a.
- source_word: ἐν κεφαλίδι βιβλίου
  choice: n’akwụkwọ mpịakọta[a]
  rationale: N’okwu a, κεφαλίς na-ezo aka n’akwụkwọ e dere n’ogologo ma tụgharịa ya ka ọ bụrụ mpịakọta, ọ bụghị isiakwụkwọ ma ọ bụ akwụkwọ e jikọtara ọnụ dịka nke oge a.
- source_word: γέγραπται
  choice: e dere
  rationale: Nke a na-ekwupụta na ihe ahụ dị n’ihe e dere; okwu gbara ya gburugburu na-eme ka ịdịgide nke ihe e dere doo anya.
- source_word: περὶ ἐμοῦ
  choice: banyere m
  rationale: Ọ bụ okwu Igbo doro anya ma kwekọọ kpọmkwem n’ihe περί na genitive pụtara ebe a.
- source_word: τοῦ ποιῆσαι
  choice: ịme
  rationale: Infinitive a na-egosi ebumnuche ọbịbịa onye na-ekwu okwu, ma ‘ịme’ na-edobe njikọ ahụ nkenke.
- source_word: ὁ θεός
  choice: Chineke
  rationale: Ọ bụ ezie na ọdịdị Grik ya bụ nominative, ọrụ ya ebe a bụ ịkpọ Chineke okwu ozugbo; akara rikoma na-egosi nke a n’Igbo.
- source_word: τὸ θέλημά σου
  choice: uche gị
  rationale: ‘Uche gị’ bụ okwu Igbo a na-ejikarị eme ihe maka θέλημα ma na-edobe echiche nke ihe Chineke chọrọ.
theological_decisions:
- issue: Ntụaka onye Mesaya banyere onwe ya n’ihe e hotara n’Abụ Ọma, dịka e si tinye ya n’ọrụ n’akwụkwọ Ndị Hibru
  choice: E debere ya dịka okwu onye mbụ kwuru, n’etinyeghị aha Kraịst ma ọ bụ Mesaya n’amaokwu a.
  alternative: Ịkpọ onye na-ekwu okwu ahụ Kraịst ma ọ bụ Mesaya kpọmkwem n’amaokwu ahụ.
  rationale: Ihe gbara amaokwu a gburugburu na Ndị Hibru na-egosi na e tinyere okwu a n’ọrụ n’ebe Ọkpara ahụ nọ, ma okwu amaokwu a n’onwe ya bụ nkwupụta onye mbụ. Nsụgharị ahụ kwesịrị ịhapụ ihe gbara ya gburugburu ka ọ kọwaa onye na-ekwu okwu.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ugwu ma dị mfe nghọta, dee ya. ‘Lee’ na-edobe ụda siri ike nke ihe e hotara n’Akwụkwọ Nsọ, ebe ‘akwụkwọ mpịakọta’ na-ezere nghọtahie na ọ bụ akwụkwọ e jikọtara ọnụ nke oge a.
