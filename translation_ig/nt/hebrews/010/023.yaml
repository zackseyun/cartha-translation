  variant: Standard Igbo
source:
  edition: SBLGNT
  text: κατέχωμεν τὴν ὁμολογίαν τῆς ἐλπίδος ἀκλινῆ, πιστὸς γὰρ ὁ ἐπαγγειλάμενος·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/023.yaml
  text: Let us hold fast the confession of our hope without wavering[a], for the one who promised is faithful.
translation:
  language: ig
  text: Ka anyị jidesie nkwupụta olileanya anyị ike n’enweghị ịma jijiji, n’ihi na onye kwere nkwa kwesịrị ntụkwasị obi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατέχωμεν
  choice: Ka anyị jidesie ... ike
  rationale: Ụdị ngwaa a bụ agbamume nye ndị niile a na-agwa okwu; “jidesie ... ike” na-egosi ijigide ihe nke ọma ma ghara ịhapụ ya.
- source_word: ὁμολογίαν
  choice: nkwupụta
  rationale: “Nkwupụta” na-egosi ikwupụta okwukwe ma ọ bụ olileanya n’ihu ọha, n’asụsụ Igbo dị mfe ma dị ùgwù.
- source_word: τῆς ἐλπίδος
  choice: olileanya anyị
  rationale: Ọ bụ ezie na Grik ekwughị “anyị” kpọmkwem, okwu a bụ nke ọgbakọ a na-agba ume; “anyị” na-eme ka Igbo bụrụ nke eke, ebe nkọwa ọzọ dị n’ala peeji.
- source_word: ἀκλινῆ
  choice: ghara ịda mba
  rationale: Nke a na-egosi ịnọgidesi ike n’enweghị ịgbagha ma ọ bụ ịkwụsị; ọ bụ okwu Igbo a na-aghọta nke ọma n’ọnọdụ agbamume a.
- source_word: πιστὸς
  choice: kwesịrị ntụkwasị obi
  rationale: Nke a na-egosipụta na onye ahụ bụ onye a pụrụ ịtụkwasị obi na ọ ga-emezu nkwa ya, ma ghara itinye nkọwa okpukpe na-adịghị n’ahịrịokwu ahụ.
- source_word: ὁ ἐπαγγειλάμενος
  choice: onye ahụ kwere nkwa
  rationale: Ọ na-edobe ụzọ Grik si hapụ aha onye ahụ n’ekwughị ya, ma na-egosi nkwa e kwere n’oge gara aga.
theological_decisions:
- issue: Onye “kwere nkwa” bụ onye?
  choice: A hapụrụ ya dịka “onye ahụ kwere nkwa,” dị ka Grik si mee.
  alternative: “Chineke, onye kwere nkwa”
  rationale: Ọnọdụ okwu ahụ na-egosi Chineke, ma isi mmalite akpọghị aha Chineke kpọmkwem; ịhapụ ya otu a na-echekwa usoro na nrụgide nke ederede ahụ.
- issue: Ịtinye “anyị” na “olileanya”
  choice: “olileanya anyị”
  alternative: “olileanya”
  rationale: Grik enweghị nnọchiaha nke pụtara “anyị,” ma agbamume ahụ bụ nke ndị niile a na-agwa; e tinyere ya ka Igbo daa nke ọma, ma debe nhọrọ nke soro Grik kpọmkwem n’ala peeji.
translation_notes:
  register: Standard Igbo nke oge a, dị mfe nghọta ma dị ùgwù. E ji “Ka anyị” chekwaa agbamume ọnụ, e zerekwa ịkpọ Chineke aha ebe Grik hapụrụ onye ahụ n’ime nghọta nke ọnọdụ okwu.
