source:
  edition: SBLGNT
  text: Ἀναμιμνῄσκεσθε δὲ τὰς πρότερον ἡμέρας, ἐν αἷς φωτισθέντες πολλὴν ἄθλησιν ὑπεμείνατε παθημάτων,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/032.yaml
  text: But remember the former days[a], when, after you were enlightened, you endured a great struggle of sufferings[c][b],
translation:
  language: ig
  text: Ma chetanụ ụbọchị ndị mbụ ahụ, mgbe e mechara mee ka ìhè bịa n’ime unu,[a][b] unu tachiri obi n’oké mgba nke ịta ahụhụ.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “mgbe a na-eme ka ìhè bịa n’ime unu.” Okwu Grik ahụ nwere ike igosi na nke a mere n'otu oge ahụ, ma ọ bụ na o mere tupu ha atachie obi.
    reason: lexical_alternative
  - marker: b
    text: “Mee ka ìhè bịa n’ime unu” nwere ike ịpụta nnweta ìhè ime mmụọ n’ozuzu ya. Ndị na-akọwa Akwụkwọ Nsọ ejikọtala ya n’ụzọ dị iche iche na ịtụgharị n’okwukwe, baptizim, ma ọ bụ nkuzi n’okwukwe.
    reason: alternative_reading
  - marker: c
    text: Ma ọ bụ, “unu tachiri obi n’asọmpi siri ike nke ahụhụ.” Okwu Grik ahụ nwere echiche nke mgba ma ọ bụ asọmpi.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀναμιμνῄσκεσθε
  choice: chetanụ
  rationale: Ọ bụ iwu e nyere ọtụtụ mmadụ ka ha cheta; “chetanụ” bụ okwu Igbo nkịtị ma doo anya nke na-egosipụta ike iwu ahụ.
- source_word: δὲ
  choice: Ma
  rationale: Ọ na-egosi ntughari ma ọ bụ obere ọdịiche n'ihe e kwuru tupu ya; “Ma” na-egosipụta nke a nke ọma.
- source_word: τὰς πρότερον ἡμέρας
  choice: ụbọchị ndị mbụ ahụ
  rationale: Nke a na-egosipụta ụbọchị ndị gara aga nke onye dere akwụkwọ na-akpọ ndị na-agụ ya ka ha cheta.
- source_word: ἐν αἷς
  choice: mgbe
  rationale: Ọ bụ ezie na nsụgharị nkịtị ya bụ “n'ime ha,” ebe a ọ na-arụ ọrụ oge; “mgbe” bụ Igbo dị ire ma na-edobe echiche ahụ.
- source_word: φωτισθέντες
  choice: mgbe e mesịrị mee ka unu nweta ìhè
  rationale: Nke a na-edobe ihe atụ nke ìhè na olu nnara nke participle Grik ahụ, ma ghara ịkọwa ya kpọmkwem dị ka nchegharị, baptizim, ma ọ bụ nkuzi okwukwe.
- source_word: πολλὴν ἄθλησιν
  choice: oké ọgụ
  rationale: ἄθλησις nwere echiche nke asọmpi ma ọ bụ ọgụ siri ike; “oké ọgụ” bụ okwu Igbo dị nkenke nke na-egosipụta ịdị ukwuu na ike ya.
- source_word: ὑπεμείνατε
  choice: unu tachiri obi
  rationale: “Tachiri obi” na-egosipụta ịnọgide na-edi ihe siri ike, nke dabara n'ọnọdụ ahụhụ a.
- source_word: παθημάτων
  choice: nke ahụhụ
  rationale: Ọ na-akọwa ụdị ọgụ ahụ—ọgụ nke ahụhụ dị iche iche—ma na-edobe obosara okwu Grik ahụ.
theological_decisions:
- issue: Ihe φωτισθέντες pụtara n'ọnọdụ ịdọ aka ná ntị na agbamume
  choice: E debere ihe atụ ahụ dịka “mee ka unu nweta ìhè.”
  alternative: Ịsụgharị ya kpọmkwem dịka mgbe unu chegharịrị, mgbe e mere unu baptizim, ma ọ bụ mgbe a kụziiri unu okwukwe.
  rationale: Amaokwu ahụ na-ekwu maka nnweta ìhè ime mmụọ, ma ọ naghị ekpebi kpọmkwem ihe omume ụka ma ọ bụ ahụmahụ ọ bụ. Nsụgharị a na-edobe mgbagwoju anya na esemokwu nkà mmụta okpukpe dị na isi mmalite.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. A họọrọ “tachiri obi” maka idi ahụhụ, “oké ọgụ” iji chekwaa ike ihe atụ asọmpi ahụ, ma debekwa ihe atụ nke ìhè n'enweghị ịmanye nkọwa otu ụka.
