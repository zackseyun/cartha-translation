id: HEB.10.22
reference: Hebrews 10:22
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: προσερχώμεθα μετὰ ἀληθινῆς καρδίας ἐν πληροφορίᾳ πίστεως, ῥεραντισμένοι τὰς καρδίας ἀπὸ συνειδήσεως πονηρᾶς καὶ λελουσμένοι τὸ σῶμα ὕδατι καθαρῷ·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/022.yaml
  text: let us draw near with a true heart in full assurance of faith[d][c][b][a], with our hearts sprinkled clean from an evil conscience and our bodies washed with pure water.
translation:
  language: ig
  text: Ka anyị jiri ezi obi bịaruo nso, n’ntụkwasị obi zuru ezu n’okwukwe,[a] ebe e fesara obi anyị ka o dị ọcha pụọ n’akọnuche ọjọọ,[b] ma sachakwa ahụ anyị na mmiri dị ọcha.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “jiri obi eziokwu, nwee nkwenye zuru ezu n’okwukwe.”
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụ “akọnuche na-ama mmadụ ikpe”; ma okwu Grik ahụ pụtara “ọjọọ,” nke sara mbara karịa naanị ikpe ọmụma.
    reason: lexical_alternative
  - marker: c
    text: Ihe oyiyi nke ịfesa na ịsacha nwere ike ime ka a cheta emume ime ka mmadụ dị ọcha, nakwa baptizim; ma amaokwu a ekwughị hoo haa ihe ịsacha ahụ bụ.
    reason: cultural_note
lexical_decisions:
- source_word: προσερχώμεθα
  choice: Ka anyị ... bịaruo nso
  rationale: Na-egosipụta hortatory subjunctive nke onye mbụ ọtụtụ ma chekwaa echiche nke ịbịaru Chineke nso.
- source_word: ἀληθινῆς καρδίας
  choice: jiri ezi obi
  rationale: “Ezi obi” bụ okwu Igbo dị nkenke ma dị ndụ, nke nwere ike ịpụta obi bụ eziokwu ma bụrụkwa nke na-enweghị aghụghọ.
- source_word: ἐν πληροφορίᾳ πίστεως
  choice: n’ime ntụkwasị obi zuru ezu nke sitere n’okwukwe
  rationale: Na-egosipụta njupụta nke nkwenye siri ike, ma na-edobe πίστις dị ka “okwukwe,” ọ bụghị “ikwesị ntụkwasị obi.”
- source_word: ῥεραντισμένοι τὰς καρδίας
  choice: ebe a fesara obi anyị mmiri ka e mee ka ọ dị ọcha
  rationale: Perfect passive participle na-egosi ọnọdụ sitere n’omume emechara; “fesara ... mmiri” na-echekwa ihe oyiyi nke emume ime ka ihe dị ọcha, ebe nkebi na-esote na-eme ka nzube ịdị ọcha doo anya.
- source_word: ἀπὸ συνειδήσεως πονηρᾶς
  choice: pụọ n’akọnuche ọjọọ
  rationale: “Ọjọọ” na-edobe obosara nke πονηρός kama imechi ya naanị n’echiche nke akọnuche na-ama mmadụ ikpe.
- source_word: λελουσμένοι τὸ σῶμα
  choice: sachakwa ahụ anyị
  rationale: Na-egosipụta perfect participle nke abụọ dịka ọnọdụ ịdị ọcha, ma jiri “ahụ anyị” mee ka nkebi ahụ bụrụ Igbo ebumpụta ụwa.
- source_word: ὕδατι καθαρῷ
  choice: na mmiri dị ọcha
  rationale: “Mmiri dị ọcha” bụ okwu Igbo doro anya nke na-echekwa ma ịdị ọcha nkịtị ma echiche ịdị ọcha n’emume.
theological_decisions:
- issue: Ma ịsacha ahụ̀ a bụ baptizim kpọmkwem
  choice: Edeghị “baptizim” n’ahịrị isi; echekwara ihe oyiyi nke ịfesa na ịsacha.
  alternative: Ịkpọ ya baptizim kpọmkwem, ma ọ bụ ịkọwa ya naanị dịka ime ka ime mmụọ dị ọcha.
  rationale: Amaokwu ahụ na-eji asụsụ emume ime ka ihe dị ọcha, nke nwere ike ime ka a cheta baptizim ma ọ bụ ịsacha ndị Livayị, ma ọ naghị akọwa ya hoo haa.
- issue: Ihe συνειδήσεως πονηρᾶς pụtara
  choice: akọnuche ọjọọ
  alternative: akọnuche na-ama mmadụ ikpe
  rationale: Nke a na-edobe okwu Grik “ọjọọ” na obosara ya ma zere ịkọwa ya naanị dịka mmetụta ikpe ọmụma.
translation_notes:
  register: Standard Igbo dị ugbu a, kwụ ọtọ ma dị nsọ n’ụda. A họọrọ ahịrịokwu a na-aghọta ngwa ngwa, ebe e chekwara myirịta dị n’etiti ịfesa obi na ịsacha ahụ, yana nghọtahie ziri ezi banyere baptizim.
