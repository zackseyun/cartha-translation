revisions:
- from: Ka anyị jiri ezi obi bịaruo nso, n’ime ntụkwasị obi zuru ezu nke sitere n’okwukwe,[a] ebe a fesara obi anyị mmiri ka e mee ka ọ dị ọcha pụọ n’akọnuche ọjọọ,[b] sachakwa ahụ anyị na mmiri dị ọcha.[c]
  to: Ka anyị jiri ezi obi bịaruo nso, n’ntụkwasị obi zuru ezu n’okwukwe,[a] ebe e fesara obi anyị ka o dị ọcha pụọ n’akọnuche ọjọọ,[b] ma sachakwa ahụ anyị na mmiri dị ọcha.[c]
  rationale: The revision corrects the source-relation of “full assurance of faith,” removes the unsupported explicit object “water” from the sprinkling clause, and uses a more natural parallel Igbo construction. It retains the Greek text’s purification imagery and does not resolve the possible baptismal echo.
