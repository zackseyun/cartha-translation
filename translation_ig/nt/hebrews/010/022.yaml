review_pass:
  verdict: revise
  source_fidelity: The draft preserves the hortatory appeal, true heart, evil conscience, and pure-water washing. However, “nke sitere n’okwukwe” changes the relation in ἐν πληροφορίᾳ πίστεως by making assurance derive from faith, rather than expressing full assurance in/of faith. It also expressly supplies “mmiri” as the substance of the sprinkling, though the Greek only states pure water with the washing phrase.
  naturalness: The principal sentence is understandable, but “ebe a fesara obi anyị mmiri ka e mee ka ọ dị ọcha” is heavy and less idiomatic. A coordinated passive construction is clearer and preserves the two parallel perfect participles.
  terminology: “Ezi obi,” “akọnuche ọjọọ,” “ahụ anyị,” and “mmiri dị ọcha” are suitable Standard Igbo renderings. The revision keeps the cleansing and ritual imagery without identifying the washing as baptism.
  issues:
  - severity: medium
    issue: The phrase “nke sitere n’okwukwe” adds a derivational sense.
    rationale: πίστεως qualifies πληροφορίᾳ; it does not say that assurance originates from faith. “N’ntụkwasị obi zuru ezu n’okwukwe” more closely preserves the source relation.
  - severity: medium
    issue: “A fesara obi anyị mmiri” explicitly assigns water to the sprinkling.
    rationale: The dative ὕδατι καθαρῷ is stated alongside λελουσμένοι (“washed”), and the verse does not explicitly say that the hearts are sprinkled with water. Avoiding the supplied object preserves the imagery and its ambiguity.
  - severity: low
    issue: The first cleansing clause is syntactically cumbersome.
    rationale: Using “ebe e fesara ... ma sachakwa ...” gives natural Igbo parallelism for the two completed passive cleansing states.
  revised_text: Ka anyị jiri ezi obi bịaruo nso, n’ntụkwasị obi zuru ezu n’okwukwe,[a] ebe e fesara obi anyị ka o dị ọcha pụọ n’akọnuche ọjọọ,[b] ma sachakwa ahụ anyị na mmiri dị ọcha.[c]
  revised_footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “jiri obi eziokwu, nwee nkwenye zuru ezu n’okwukwe.”
    reason: lexical_alternative
