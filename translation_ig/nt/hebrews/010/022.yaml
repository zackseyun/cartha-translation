    text: A pụkwara ịsụ “akọnuche na-ama mmadụ ikpe”; ma okwu Grik ahụ pụtara “ọjọọ,” nke sara mbara karịa naanị ikpe ọmụma.
    reason: lexical_alternative
  - marker: c
    text: Ihe oyiyi nke ịfesa na ịsacha nwere ike ime ka a cheta emume ime ka mmadụ dị ọcha, nakwa baptizim; ma amaokwu a ekwughị hoo haa ihe ịsacha ahụ bụ.
    reason: cultural_note
  revision_rationale: The revision corrects the source-relation of “full assurance of faith,” removes the unsupported explicit object “water” from the sprinkling clause, and uses a more natural parallel Igbo construction. It retains the Greek text’s purification imagery and does not resolve the possible baptismal echo.
