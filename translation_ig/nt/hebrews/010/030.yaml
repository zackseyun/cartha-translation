  terminology: '“Ịbọ ọbọ,” “kwụghachi,” “Onyenwe anyị,” and “ikpe ... ikpe” are appropriate solemn, modern Standard Igbo terms. The first footnote’s claimed near-literal wording needs correction: the Greek is elliptical, literally “To me [is] vengeance,” rather than “It is I who own vengeance.”'
  issues:
