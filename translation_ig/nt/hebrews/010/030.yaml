  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οἴδαμεν γὰρ τὸν εἰπόντα· Ἐμοὶ ἐκδίκησις, ἐγὼ ⸀ἀνταποδώσω· καὶ πάλιν· ⸂Κρινεῖ κύριος⸃ τὸν λαὸν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/030.yaml
  text: For we know the one who said[a], “Vengeance is mine; I will repay,” and again[b], “The Lord will judge his people.”
translation:
  language: ig
  text: N’ihi na anyị maara onye sịrị[a], “Ịbọ ọbọ bụ nke m; m ga-akwụghachi,” kwuokwa ọzọ[b], “Onyenwe anyị ga-ekpe ndị ya ikpe.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'N’ụzọ kpọmkwem karịa, okwu Grik ahụ sịrị: “Nye m ka ịbọ ọbọ dị.”'
    reason: lexical_alternative
  - marker: b
    text: Ihe a e hotara na-eme ka Diuterọnọmi 32:35–36 cheta. N’ebe ahụ e si hota ya, “ikpe” nwere ike ịgụnye ma inye ntaramahụhụ ma ịkwado onye ikpe ziri ezi; ma n’ebe a, ebe a na-adọ aka ná ntị, ikpe Chineke bụ ihe e mesiri ike.
    reason: cross_reference
lexical_decisions:
- source_word: οἴδαμεν
  choice: anyị maara
  rationale: οἶδα bụ ezie na ọdịdị ya bụ perfect, ọ na-enwe nghọta nke oge ugbu a na Grik Koine; “anyị maara” bụ Igbo doro anya ma kwekọọ na ya.
- source_word: γὰρ
  choice: N’ihi na
  rationale: Na-egosi njikọ nkọwa ya na amaokwu gara aga.
- source_word: τὸν εἰπόντα
  choice: Onye ahụ kwuru sị
  rationale: Na-egosipụta participle ahụ dị ka onye, ya bụ Chineke bụ́ Onye kwuru ihe e hotara, n’ụzọ Igbo sitere n’okike.
- source_word: Ἐμοὶ ἐκδίκησις
  choice: Ịbọ ọbọ bụ nke m
  rationale: Na-echekwa usoro okwu Grik dị mkpirikpi, “nke m ka ịbọ ọbọ dị,” ma na-ekwu ya n’Igbo doro anya na nke dị nsọpụrụ.
- source_word: ἀνταποδώσω
  choice: m ga-akwụghachi
  rationale: Okwu ahụ pụtara ịkwụghachi ma ọ bụ inyeghachi mmadụ ihe kwekọrọ n’omume ya; “kwụghachi” na-echekwa ịdị arọ ya n’ebe a.
- source_word: καὶ πάλιν
  choice: o kwukwara ọzọ sị
  rationale: Igbo chọrọ ka e mee onye na-ekwu okwu na ngwaa pụta ìhè n’usoro a; ihe agbakwunyere adịghị agbanwe onye na-ekwu okwu ma na-eme ka amaokwu ahụ na-aga nke ọma.
- source_word: Κρινεῖ
  choice: ga-ekpe ... ikpe
  rationale: Na-echekwa ike ikpe nke κρίνω, ma ghara imechi ohere ọ nwere ịgụnye ntaramahụhụ ma ọ bụ ịkwado onye ikpe ziri ezi n’ebe e si hota ya.
- source_word: κύριος
  choice: Onyenwe anyị
  rationale: Nke a bụ nsụgharị Igbo a na-ahụkarị maka κύριος mgbe ọ na-ezo aka n’ebe Chineke nọ.
- source_word: τὸν λαὸν αὐτοῦ
  choice: ndị ya
  rationale: Nke a bụ ụzọ Igbo sitere n’okike isi kwuo ndị nke ya, ma na-echekwa echiche banyere ndị Chineke.
theological_decisions:
- issue: Asụsụ ikpe dị n’ihe e hotara na Diuterọnọmi
  choice: “Ịbọ ọbọ bụ nke m; m ga-akwụghachi” na “Onyenwe anyị ga-ekpe ndị ya ikpe.”
  alternative: “Onyenwe anyị ga-akwado ndị ya n’ikpe.”
  rationale: N’ọnọdụ ịdọ aka ná ntị nke Ndị Hibru 10, “ga-ekpe ikpe” na-echekwa ike ikpe Chineke nke ederede ahụ. N'otu oge ahụ, nkọwa ala peeji na-ekweta na okwu ahụ n’ebe mbụ e si hota ya nwere ike ịgụnye ma ntaramahụhụ ma ịkwado ndị ya.
translation_notes:
  register: E jiri Standard Igbo nke oge a, dị nsọpụrụ ma dị mfe nghọta. “Onye ahụ” na-ejigide ntụaka onwe onye nye Chineke; “ịbọ ọbọ” na “ịkwụghachi” na-echekwa ịdị arọ na ụda ikpe nke amaokwu ahụ.
