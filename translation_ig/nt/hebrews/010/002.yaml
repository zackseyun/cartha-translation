id: HEB.10.2
reference: Hebrews 10:2
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐπεὶ οὐκ ἂν ἐπαύσαντο προσφερόμεναι, διὰ τὸ μηδεμίαν ἔχειν ἔτι συνείδησιν ἁμαρτιῶν τοὺς λατρεύοντας ἅπαξ ⸀κεκαθαρισμένους;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/002.yaml
  text: Otherwise[a], would they not have stopped being offered, because those who worship, having once been cleansed[b], would no longer have any consciousness of sins?
translation:
  language: ig
  text: Ma ọ bụghị ya, àjà ndị ahụ hà agaraghị akwụsị ịbụ ndị a na-achụ, n’ihi na ndị na-efe ofufe, mgbe e sachara ha ọcha otu ugboro[b], agaraghịzi enwe mmata mmehie[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “akọnuche banyere mmehie.” Okwu Grik ahụ nwere ike ịpụta akọnuche, ịma, ma ọ bụ mmata banyere mmehie; n’ebe a, ọ na-ezo aka ná mmetụta ikpe ọmụma nke na-adịgide n’ihu Chineke.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsị, “otu ugboro na-enweghị imegharị.” N’ọnọdụ a, “otu ugboro” nwere ike igosi ime ka ọ dị ọcha e mezuru n’ụzọ doro anya, nke a na-adịghị emegharị.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεὶ
  choice: Ma ọ bụghị ya
  rationale: N’usoro arụmụka a, okwu ahụ na-ewebata ihe gaara abụ eziokwu ma a sị na ihe e kwuru n’amaokwu gara aga dị iche; nkebi a na-egosipụta echiche ‘ọ bụrụ na ọ bụghị otú ahụ’ n’Igbo doro anya.
- source_word: οὐκ ἂν ἐπαύσαντο προσφερόμεναι
  choice: àjà ndị ahụ hà agaraghị akwụsị ịbụ ndị a na-achụ
  rationale: Ajụjụ a na-egosipụta ihe megidere eziokwu. ‘Ịbụ ndị a na-achụ’ na-edebe olu nnara nke προσφερόμεναι, ebe ‘àjà ndị ahụ’ na-eme ka ihe e zoro aka na ya site n’amaokwu gara aga doo anya.
- source_word: διὰ τὸ μηδεμίαν ἔχειν ἔτι
  choice: n’ihi na ... agaraghịzi enwe
  rationale: ‘N’ihi na’ na-egosipụta ihe kpatara ya, ‘-ghịzi’ na-egosikwa na ọnọdụ ahụ agaghị aga n’ihu ọzọ.
- source_word: συνείδησιν ἁμαρτιῶν
  choice: mmata mmehie
  rationale: ‘Mmata mmehie’ na-edebe ohere okwu Grik ahụ nwere ịpụta ịma ma ọ bụ inwe mmetụta banyere mmehie, n’emeghị ka ọ pụta na ndị na-efe ofufe agaghịzi amata ihe ọma na ihe ọjọọ.
- source_word: τοὺς λατρεύοντας
  choice: ndị na-efe ofufe
  rationale: Nke a bụ okwu Igbo e ji akọwa ndị na-arụ ọrụ ife Chineke, ma na-edebekwa ụdị ngwaa nke participle Grik ahụ.
- source_word: ἅπαξ
  choice: otu mgbe
  rationale: ‘Otu mgbe’ na-asụgharị isi ihe adverb ahụ pụtara, ma ihe ọ pụrụ ịpụta dịka ihe e mere otu ugboro ruo mgbe ebighị ebi ka akọwara n’ala peeji.
- source_word: κεκαθαρισμένους
  choice: mgbe e sachara ha ọcha
  rationale: Nkebi a na-egosipụta omume e mezuru nke nsonaazụ ya ka dịgide, ma jiri okwu Igbo a na-aghọta nke ọma maka ịdị ọcha n’ihu Chineke.
theological_decisions:
- issue: Ihe συνείδησιν ἁμαρτιῶν pụtara mgbe e sachara ndị na-efe ofufe ọcha
  choice: mmata mmehie
  alternative: akọ na uche banyere mmehie
  rationale: Nhọrọ a na-egosipụta ibu nke ịma mmehie na ikpe ọmụma n’ihu Chineke, n’ekwughị na onye e mere ka ọ dị ọcha agaghịzi enwe ikike ịmata mmehie n’omume.
- issue: Ike okwu ἅπαξ nwere n’ebe a
  choice: otu mgbe n’ahịrịokwu bụ isi, tinyere nkọwa n’ala peeji
  alternative: otu ugboro ruo mgbe ebighị ebi
  rationale: Okwu Grik ahụ nwere ike ibu echiche nke ihe a na-agaghị emegharị ọzọ n’ọnọdụ a, ma ‘otu mgbe’ na-edebe obosara okwu ahụ n’ahịrịokwu bụ isi kama idozi nkọwa ahụ kpamkpam.
translation_notes:
  register: Ejiri Standard Igbo dị ugwu ma dị mfe nghọta. Ajụjụ nkwupụta ahụ na ọnọdụ megidere eziokwu ka e debere; a zere okwu pụrụ ime ka a ghọta na e bibiri akọ na uche mmadụ kpamkpam.
