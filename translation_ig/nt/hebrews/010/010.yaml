  text: ἐν ᾧ θελήματι ἡγιασμένοι ⸀ἐσμὲν διὰ τῆς προσφορᾶς τοῦ σώματος Ἰησοῦ Χριστοῦ ἐφάπαξ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/010.yaml
  text: By that will we have been sanctified through the offering of the body of Jesus the Messiah once for all[a][b].
translation:
  language: ig
  text: N’ọchịchọ ahụ[a] ka e doola anyị nsọ, site n’ịchụ anụ ahụ Jizọs, bụ Mesaya[b], àjà otu ugboro maka mgbe niile.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n’ụzọ dabara nnọọ n’okwu Grik, “n’ime ọchịchọ ahụ.” Ihe a na-ekwu bụ na e doro ndị kwere ekwe nsọ site n’ọchịchọ Chineke ahụ e kwuru okwu ya n’amaokwu ndị bu ụzọ.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “Jizọs Kraịst.” Okwu Grik bụ Χριστός, utu aha nke pụtara “Mesaya.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν ᾧ θελήματι
  choice: site n’uche ahụ
  rationale: Nkebiokwu a na-ezo aka n’uche Chineke e kwuru okwu ya n’amaokwu ndị bu ụzọ. “Site na” na-egosi na uche ahụ bụ ụzọ ma ọ bụ ihe kpatara e ji doo anyị nsọ, ebe “ahụ” na-ejigide ntụaka ahụ.
- source_word: ἡγιασμένοι ἐσμὲν
  choice: e doola anyị nsọ
  rationale: Ụdị a na-egosi ihe e merela nke nsonaazụ ya ka dị. “E doola anyị nsọ” na-echekwa ma mmezu ahụ ma ọnọdụ ya na-aga n’ihu, n’etinyeghị nkọwa otu ụka pụrụ iche.
- source_word: διὰ τῆς προσφορᾶς τοῦ σώματος
  choice: site n’iji anụ ahụ ... chụọ àjà
  rationale: διά na genitive na-egosi ụzọ e si mee ihe. N’Igbo, okwu a na-akọ n’ụzọ doro anya na nke sitere n’okike na ọ bụ anụ ahụ Jizọs ka e nyere dị ka àjà, ọ bụ ezie na προσφορά n’onwe ya pụtara onyinye a na-enye.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jizọs bụ Mesaya
  rationale: Χριστός bụ utu aha pụtara Mesaya. Itinye “bụ” na-eme ka okwu ahụ bụrụ Igbo sitere n’okike ma na-echekwa ọrụ ya dị ka utu aha, ọ bụghị naanị aha mmadụ.
- source_word: ἐφάπαξ
  choice: naanị otu ugboro, o zuokwa ezu
  rationale: Nke a na-egosi na àjà ahụ mere otu ugboro ma bụrụ nke a na-agaghị achọ imegharị. Nkebiokwu Igbo a na-echekwa ike nke “otu ugboro maka mgbe niile” n’enweghị echiche na-adịghị doo anya banyere ogologo oge.
theological_decisions:
- issue: Ụdị oge na ihe ἡγιασμένοι ἐσμὲν pụtara banyere ido nsọ
  choice: e doola anyị nsọ
  alternative: e doro anyị nsọ; a na-edo anyị nsọ
  rationale: Perfect participle tinyere present nke “ịbụ” na-egosi omume mezuru nke mmetụta ya ka dị. Nsụgharị a anaghị agbanwe ya ka ọ bụrụ omume na-aga n’ihu, ma ọ bụ kpebie nkọwa ozizi karịrị ihe ụtọasụsụ kwuru.
- issue: Utu aha Χριστοῦ
  choice: Mesaya
  alternative: Kraịst
  rationale: N’ebe a, Χριστός ka nwere ike doro anya dị ka utu aha. “Mesaya” na-ewetara onye na-agụ ihe utu aha ahụ pụtara, ebe nkọwa ala peeji na-edebe ụdị “Kraịst” a na-ejikarị eme ihe.
- issue: Ike nke ἐφάπαξ
  choice: naanị otu ugboro, o zuokwa ezu
  alternative: otu ugboro; otu ugboro maka mgbe niile
  rationale: A họọrọ okwu na-egosi na onyinye ahụ bụ nke ikpeazụ na nke a na-adịghị emegharị, n’etinyeghị ozizi ọzọ banyere otú uru ya si eru ndị mmadụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta, dee ya. “Ido nsọ” na-echekwa asụsụ okpukpe nke ἁγιάζω; “anụ ahụ” na-eme ka σῶμα doo anya; “chụọ àjà” na-eme ka onyinye ahụ bụrụ okwu Igbo sitere n’okike n’ọnọdụ àjà nke isiakwụkwọ a.
