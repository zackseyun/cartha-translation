revisions:
- from: Ọ bụ site n’uche ahụ[a] ka e doola anyị nsọ, site n’iji anụ ahụ Jizọs bụ Mesaya[b] chụọ àjà naanị otu ugboro, o zuokwa ezu.
  to: N’ọchịchọ ahụ[a] ka e doola anyị nsọ, site n’ịchụ anụ ahụ Jizọs, bụ Mesaya[b], àjà otu ugboro maka mgbe niile.
  rationale: The revision preserves the source’s completed-with-abiding-result sanctification, its reference to God’s will, the sacrificial offering of Jesus’ body, the titular sense of Mesaya, and the once-for-all force. It chiefly corrects an ambiguity in which the body could be read as the instrument of sacrifice rather than the offered reality.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T21:29:14Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents the periphrastic perfect ('e doola anyị nsọ') and the definitive force of ἐφάπαξ. However, 'site n’iji anụ ahụ ... chụọ àjà' makes the body sound primarily like an instrument used to perform a sacrifice, rather than the body being offered. The revision makes the body the direct object of the sacrificial offering. 'Ọchịchọ' is a more precise Standard Igbo equivalent for θελήματι in this context than the broader 'uche.'
  naturalness: The revised wording is idiomatic, reverent Standard Igbo. 'Site n’ịchụ anụ ahụ ... àjà' clearly expresses the offering of Jesus’ body without the instrumental ambiguity of 'iji anụ ahụ ... chụọ àjà.'
  terminology: '''Ido nsọ'' appropriately retains the theological register of ἁγιάζω; ''Mesaya'' appropriately renders Χριστός as a title. ''Anụ ahụ'' is retained for σώματος, and ''otu ugboro maka mgbe niile'' expresses the unrepeatable finality of ἐφάπαξ without adding doctrinal interpretation.'
  issues:
  - severity: medium
    issue: The phrase 'site n’iji anụ ahụ Jizọs bụ Mesaya chụọ àjà' is syntactically ambiguous.
    rationale: It can suggest that Jesus’ body was the means by which someone offered a sacrifice, whereas διὰ τῆς προσφορᾶς τοῦ σώματος means through the offering of Jesus’ body itself. Recasting the body as the object of 'ịchụ ... àjà' resolves this while preserving the sacrificial sense.
  - severity: low
    issue: '''Uche'' is broader than the source term θέλημα.'
    rationale: In Hebrews 10:10, θέλημα refers specifically to God’s will/desire just mentioned. 'Ọchịchọ' is more precise in this context and preserves the contextual reference.
  revised_text: N’ọchịchọ ahụ[a] ka e doola anyị nsọ, site n’ịchụ anụ ahụ Jizọs, bụ Mesaya[b], àjà otu ugboro maka mgbe niile.
