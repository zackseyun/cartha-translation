revisions:
- from: N’ihi ya, ọ dị mkpa ka o yie ụmụnne ya n’ụzọ niile[a], ka o wee bụrụ nnukwu onye nchụàjà nwere obi ebere na nke kwesịrị ntụkwasị obi n’ihe ndị metụtara Chineke, iji kpuchie mmehie ndị mmadụ[b].
  to: N’ihi ya, o kwesịrị ịdị ka ụmụnne ya n’ihe niile[a], ka o wee bụrụ Onye Nchụàjà Ukwu nwere ebere, nke kwesịkwara ntụkwasị obi n’ihe ndị metụtara Chineke, iji mee ka e gbaghara mmehie ndị mmadụ[b].
  rationale: The revision strengthens the rendering of ὤφειλεν as an obligation, adopts the standard priestly title, and replaces “kpuchie mmehie” with a clearer broad rendering of the atonement action. The footnote continues to preserve the expiatory and propitiatory alternatives without imposing either as the sole sense.
