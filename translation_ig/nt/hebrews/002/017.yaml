id: HEB.2.17
reference: Hebrews 2:17
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὅθεν ὤφειλεν κατὰ πάντα τοῖς ἀδελφοῖς ὁμοιωθῆναι, ἵνα ἐλεήμων γένηται καὶ πιστὸς ἀρχιερεὺς τὰ πρὸς τὸν θεόν, εἰς τὸ ἱλάσκεσθαι τὰς ἁμαρτίας τοῦ λαοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/017.yaml
  text: Therefore he had to become like his brothers in every respect[a], so that he might become a merciful and faithful high priest in the things pertaining to God[b], to make atonement for the sins of the people.
translation:
  language: ig
  text: N’ihi ya, o kwesịrị ịdị ka ụmụnne ya n’ihe niile[a], ka o wee bụrụ Onye Nchụàjà Ukwu nwere ebere, nke kwesịkwara ntụkwasị obi n’ihe ndị metụtara Chineke, iji mee ka e gbaghara mmehie ndị mmadụ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'N’ụzọ nkịtị: “n’ihe niile.”'
    reason: lexical_alternative
  - marker: b
    text: 'A pụkwara ịsụgharị okwu Grik a: “iji kpochapụ mmehie ndị mmadụ,” ma ọ bụ “iji mee ka iwe Chineke dajụọ n’ihi mmehie ndị mmadụ.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ὅθεν
  choice: N’ihi ya
  rationale: Na-egosi nkwubi okwu sitere n’ihe e kwuru tupu ya, ma bụrụ okwu Igbo doro anya ma dịkwa mma.
- source_word: ὤφειλεν
  choice: ọ dị mkpa
  rationale: Na-egosi mkpa ma ọ bụ ọrụ dịịrị ya n’ime nzube nzọpụta Chineke, n’ebughị echiche nke ịmanye ya n’èzí.
- source_word: κατὰ πάντα
  choice: n’ụzọ niile
  rationale: Na-echekwa obosara nke oyiyi ahụ n’asụsụ Igbo a na-asụ taa.
- source_word: τοῖς ἀδελφοῖς
  choice: ụmụnne ya
  rationale: “Ụmụnne” bụ okwu ezinụlọ Igbo na-agụnye nwoke na nwanyị n’enweghị imebi echiche nke okwu Grik banyere ndị otu ezinụlọ.
- source_word: ὁμοιωθῆναι
  choice: ka o yie
  rationale: Na-enye echiche ịbụ onye yiri ndị ọzọ n’ụzọ eke ma dị mfe nghọta.
- source_word: ἵνα
  choice: ka o wee
  rationale: Na-egosipụta ebumnuche nke ọma.
- source_word: ἐλεήμων
  choice: nwere obi ebere
  rationale: Okwu Igbo a na-ahụkarị nke na-echekwa echiche ebere n’ọrụ onye nchụàjà.
- source_word: πιστὸς
  choice: nke kwesịrị ntụkwasị obi
  rationale: Na-egosi onye a pụrụ ịtụkwasị obi nakwa onye na-emezu ọrụ ya n’ikwesị ntụkwasị obi.
- source_word: ἀρχιερεὺς
  choice: nnukwu onye nchụàjà
  rationale: Ọ bụ nsụgharị doro anya nke ọkwá onyeisi nchụàjà n’usoro ofufe.
- source_word: τὰ πρὸς τὸν θεόν
  choice: n’ihe ndị metụtara Chineke
  rationale: Na-echekwa usoro okwu sara mbara banyere ọrụ onye nchụàjà n’ihu Chineke n’enweghị ịkọwa ya karịa isi mmalite.
- source_word: εἰς τὸ ἱλάσκεσθαι
  choice: iji kpuchie
  rationale: Na-eji okwu Akwụkwọ Nsọ Igbo a pụrụ ịghọta maka omume onye nchụàjà nke na-emeso mmehie, ebe nkọwa ala peeji na-echekwa ụzọ ndị ọzọ e si aghọta okwu Grik ahụ.
- source_word: τὰς ἁμαρτίας τοῦ λαοῦ
  choice: mmehie ndị mmadụ
  rationale: Na-egosi nke ọma na mmehie nke ndị ahụ bụ ihe omume onye nchụàjà metụtara.
theological_decisions:
- issue: Nkọwa nke ἱλάσκεσθαι n’okwu banyere mkpuchi mmehie
  choice: iji kpuchie mmehie ndị mmadụ
  alternative: iji mee ka a gbaghara mmehie ndị mmadụ; iji wepụ iwe Chineke n’ihi mmehie ndị mmadụ
  rationale: “Kpuchie mmehie” dabara n’ọnọdụ ọrụ onye nchụàjà ma ghara ikpebi naanị otu n’ime echiche ndị a na-arụrịta ụka—iwepụ mmehie ma ọ bụ ime ka iwe Chineke dajụọ. Nkọwa ala peeji na-eme ka obosara ahụ pụta ìhè.
- issue: Okwu ezinụlọ ἀδελφοῖς
  choice: ụmụnne ya
  alternative: ụmụnne ya ndị nwoke
  rationale: N’Igbo, “ụmụnne” bụ okwu ezinụlọ sitere n’okike nke nwere ike ịgụnye nwoke na nwanyị; ya mere ọ na-ebuga ihe okwu ahụ na-ezo aka na ya n’ọnọdụ a n’enweghị ịtinye nkọwa na-adịghị na isi mmalite.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A hapụrụ okwu gbasara ọrụ nnukwu onye nchụàjà ka ọ nwee ịdị arọ nke Akwụkwọ Nsọ, ma a zere okwu nkà mmụta okpukpe ndị mmadụ nkịtị agaghị aghọta. Akara nkọwa ala peeji [a] na [b] dị n’ahịrịokwu ahụ.
