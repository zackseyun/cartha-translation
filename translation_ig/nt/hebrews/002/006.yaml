id: HEB.2.6
reference: Hebrews 2:6
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: διεμαρτύρατο δέ πού τις λέγων· Τί ἐστιν ἄνθρωπος ὅτι μιμνῄσκῃ αὐτοῦ, ἢ υἱὸς ἀνθρώπου ὅτι ἐπισκέπτῃ αὐτόν;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/006.yaml
  text: But someone has testified somewhere[a], saying, “What is man, that you remember him, or the son of man[c][b], that you care for him?”
translation:
  language: ig
  text: 'Ma otu onye gbara akaebe n’ebe ụfọdụ[a], sị: “Gịnị ka mmadụ bụ, na ị na-echeta ya, ma ọ bụ nwa mmadụ[b], na ị na-elekọta ya[c]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Okwu a pụtara “n’ebe ụfọdụ.” Ọ bụ ụzọ e si ewebata amaokwu Akwụkwọ Nsọ a maara, ọ bụghị ikwu na onye dere akwụkwọ ahụ amaghị ebe ọ dị.
    reason: discourse_clarification
  - marker: b
    text: “Nwa mmadụ” n’ebe a na-ekwughachi Abụ Ọma 8:4, ebe ọ bụ okwu abụ na-anọchi ụmụ mmadụ; n’ihe gbara ya gburugburu na Ndị Hibru, amaokwu ahụ nwekwara mkpa gbasara Jizọs.
    reason: cross_reference
  - marker: c
    text: A pụkwara ịsụgharị ya “ị na-eleta ya” ma ọ bụ “ị na-elebara ya anya.” Ngwaa Grik ahụ nwere ike igosi nlekọta e ji nleta ma ọ bụ ilebara mmadụ anya gosipụta.
    reason: lexical_alternative
lexical_decisions:
- source_word: διεμαρτύρατο
  choice: gbara akaebe
  rationale: Nke a na-egosi ịgba akaebe siri ike ma dabara n’ụzọ e si ewebata ihe Akwụkwọ Nsọ kwuru.
- source_word: δέ
  choice: Ma
  rationale: Ọ na-egosi ntakịrị ntụgharị ma ọ bụ ọdịiche n’arụmụka ahụ.
- source_word: πού τις
  choice: otu onye ... n’otu ebe
  rationale: Ọ na-edobe usoro amaghị onye na ebe a kpọrọ aha, n’enweghị igosi na onye dere akwụkwọ ahụ amaghị ebe ahụ.
- source_word: Τί ἐστιν ἄνθρωπος
  choice: Gịnị ka mmadụ bụ
  rationale: “Mmadụ” bụ okwu nkịtị na Igbo nke na-anọchi mmadụ niile ma na-edobe otu onye e ji mee ihe n’abụ ahụ.
- source_word: μιμνῄσκῃ αὐτοῦ
  choice: ị na-echeta ya
  rationale: Nke a bụ nsụgharị doro anya ma dị ugbu a maka icheta ma ọ bụ iburu mmadụ n’uche.
- source_word: υἱὸς ἀνθρώπου
  choice: nwa mmadụ
  rationale: Ọ na-edobe okwu abụ dị na Abụ Ọma nke na-ezo aka n’ụmụ mmadụ, ma ghara ikpebi ngwa ngwa na ọ bụ naanị aha Mesaya.
- source_word: ἐπισκέπτῃ αὐτόν
  choice: ị na-elekọta ya
  rationale: Ngwaa ahụ nwere ike ịpụta ileta ma ọ bụ ilebara mmadụ anya; “ilekọta” na-egosipụta nlekọta e ji anya na-eme n’Igbo doro anya.
theological_decisions:
- issue: Ma a ga-asụgharị υἱὸς ἀνθρώπου dịka aha Mesaya kpọmkwem
  choice: nwa mmadụ
  alternative: Nwa nke Mmadụ; mmadụ
  rationale: N’Abụ Ọma 8 okwu ahụ bụ okwu abụ na-anọchi mmadụ; ihe gbara ya gburugburu na Ndị Hibru na-enyekwa ya mkpa gbasara Jizọs. Nsụgharị a na-edobe esemokwu na njikọ abụọ ahụ n’enweghị imechi otu ụzọ.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, dị nsọ ma dị mfe nghọta. Ahịrị ajụjụ ahụ na-edobe ọdịdị abụ nke Abụ Ọma 8, ebe “mmadụ” na “nwa mmadụ” bụ okwu abụọ yiri ibe ha; e zere ime ka nke abụọ bụrụ aha Mesaya doro anya n’amaokwu a naanị.
