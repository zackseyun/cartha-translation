- from: 'Ma otu onye gbara akaebe n’otu ebe[a], sị: “Gịnị ka mmadụ bụ, nke na ị na-echeta ya, ma ọ bụ nwa mmadụ[b], nke na ị na-elekọta ya[c]?”'
  to: 'Ma otu onye gbara akaebe n’ebe ụfọdụ[a], sị: “Gịnị ka mmadụ bụ, na ị na-echeta ya, ma ọ bụ nwa mmadụ[b], na ị na-elekọta ya[c]?”'
  rationale: The revision corrects the indefinite force of πού and updates its explanatory footnote accordingly. It also smooths the rhetorical question with idiomatic na clauses, without altering its meaning, poetic structure, or the deliberate non-messianic presentation of nwa mmadụ in this Psalm quotation.
