reference: Hebrews 2:8
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: πάντα ὑπέταξας ὑποκάτω τῶν ποδῶν αὐτοῦ· ἐν ⸂τῷ γὰρ⸃ ⸀ὑποτάξαι τὰ πάντα οὐδὲν ἀφῆκεν αὐτῷ ἀνυπότακτον. νῦν δὲ οὔπω ὁρῶμεν αὐτῷ τὰ πάντα ὑποτεταγμένα·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/008.yaml
  text: You subjected all things under his feet.” For in subjecting all things to him[a], he left nothing not subjected to him[b]. But now we do not yet see all things subjected to him.
translation:
  language: ig
  text: “I dobere ihe niile n'okpuru ụkwụ ya.” N'ihi na n'ido ihe niile n'okpuru ya[a], ọ hapụghị ihe ọ bụla nke na-adịghị n'okpuru ya[b]. Ma ugbu a, anyị anaghị ahụ ihe niile ka e debere n'okpuru ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nnọchiaha “ya” na-ekwughachi Abụ Ọma 8. N'ọnọdụ ya, ọ pụrụ izo aka n'ụmụ mmadụ dịka nghọta mbụ nke Abụ Ọma ahụ si dị, ma ọ pụkwara izo aka na Jizọs dịka Ndị Hibru si tinye ya n'ọrụ.
    reason: cross_reference
  - marker: b
    text: 'A pụkwara ịsụgharị ya: “N''ihi na, mgbe o mere ka ihe niile nọrọ n''okpuru ya.” Usoro okwu Grik ahụ pụkwara igosi oge ihe ahụ mere.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα
  choice: ihe niile
  rationale: Okwu a bụ ụdị neuter plural nwere nghọta zuru ụwa ọnụ; “ihe niile” bụ Igbo doro anya nke na-echekwa oke okwu ahụ.
- source_word: ὑπέταξας
  choice: I mere ka ... nọrọ n'okpuru
  rationale: Nke a na-egosipụta ido ihe n'okpuru ọchịchị ma na-adabara akpaalaokwu Igbo karịa iji otu okwu siri ike ma ọ bụ nke ochie.
- source_word: ὑποκάτω τῶν ποδῶν αὐτοῦ
  choice: n'okpuru ụkwụ ya
  rationale: Ọ na-echekwa akpaalaokwu Akwụkwọ Nsọ nke na-egosi ọchịchị na ido n'okpuru.
- source_word: ἐν τῷ ... ὑποτάξαι
  choice: site n'ime ka ... nọrọ n'okpuru
  rationale: Ọ na-echekwa nghọta nke ihe e mere dị ka ihe ndabere nke nkwubi okwu ahụ; nghọta oge, “mgbe o mere ka,” ka edere na nkọwa ala peeji.
- source_word: γὰρ
  choice: N'ihi na
  rationale: Ọ na-egosi na ahịrịokwu na-esote na-akọwa ihe e hotara tupu ya.
- source_word: οὐδὲν ἀφῆκεν
  choice: ọ hapụghị ihe ọ bụla
  rationale: Nke a bụ ụzọ Igbo dị mfe ma kwụ ọtọ isi chekwaa nkwupụta na ọ dịghị ihe ewepụrụ.
- source_word: ἀνυπότακτον
  choice: nke na-anọghị n'okpuru ya
  rationale: Ọ na-eme ka mmeghachi nke otu ezinụlọ okwu ὑποτάσσω pụta ìhè n'ụzọ Igbo na-agụ nke ọma.
- source_word: νῦν δὲ
  choice: Ma ugbu a
  rationale: Ọ na-egosi ọdịiche dị n'etiti nkwupụta Abụ Ọma na ihe a na-ahụ ugbu a.
- source_word: οὔπω ὁρῶμεν
  choice: anyị ahụbeghị
  rationale: Ụdị a bụ Igbo nkịtị maka ọnọdụ nke mmezu ya a na-ahụbeghị ruo ugbu a, ma na-echekwa echiche “not yet.”
- source_word: ὑποτεταγμένα
  choice: ka ha nọ n'okpuru ya
  rationale: Ọ na-egosipụta ọnọdụ sitere n'ido ihe n'okpuru, na-ezere ahịrịokwu Igbo na-adịghị eke.
theological_decisions:
- issue: Onye nnọchiaha αὐτοῦ / αὐτῷ na-ezo aka na ya
  choice: E debere naanị “ya” n'amaokwu ahụ n'ekwughị kpọmkwem onye ọ bụ.
  alternative: Ọ pụrụ izo aka n'ọdọ mmadụ n'echiche mbụ nke Abụ Ọma 8, ma ọ bụ n'ebe Jizọs nọ n'otú Ndị Hibru si tinye ya n'ọrụ.
  rationale: Ndị Hibru na-akọwa Abụ Ọma 8. N'Abụ Ọma ahụ, okwu ahụ metụtara mmadụ, ebe gburugburu amaokwu a na-eduga n'itinye ya n'ebe Jizọs nọ. Idebe nnọchiaha ahụ na-echekwa nghọta abụọ na esemokwu nkà mmụta okpukpe nke edemede ahụ n'onwe ya.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ “ime ka ... nọrọ n'okpuru” iji mee ka echiche ido n'okpuru ọchịchị doo anya ma chekwaa mmeghachi okwu dị n'asụsụ Grik. E debere “ya” n'enweghị ịkọwa onye ọ na-ezo aka na ya, ka e wee ghara idozi mgbagwoju anya edemede ahụ kpachaara anya hapụ.
