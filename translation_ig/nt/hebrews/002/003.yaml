id: HEB.2.3
reference: Hebrews 2:3
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: πῶς ἡμεῖς ἐκφευξόμεθα τηλικαύτης ἀμελήσαντες σωτηρίας, ἥτις, ἀρχὴν λαβοῦσα λαλεῖσθαι διὰ τοῦ κυρίου, ὑπὸ τῶν ἀκουσάντων εἰς ἡμᾶς ἐβεβαιώθη,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/003.yaml
  text: How will we escape if we neglect so great a salvation? This salvation[a], having at first been spoken through the Lord, was confirmed to us by those who heard him,
translation:
  language: ig
  text: Olee otú anyị ga-esi gbanahụ ma ọ bụrụ na anyị eleghara nzọpụta dị ukwuu otu a anya? Nzọpụta a[a], nke e malitere ikwusa site n’aka Onyenwe anyị, bụ ndị nụrụ kwadoro nye anyị,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ: “nke e malitere ikwu site n’aka Onyenwe anyị, ndị nụrụ kwadoro nye anyị.”'
    reason: Ụdị ọzọ na-edobe ngwaa “ikwu” nso na λαλεῖσθαι, ebe ederede bụ isi ji “ikwusa” mee ka nkwupụta ozi nzọpụta ahụ pụta ìhè n’Igbo.
lexical_decisions:
- source_word: πῶς … ἐκφευξόμεθα
  choice: Olee otú anyị ga-esi gbanahụ
  rationale: Na-edobe ajụjụ ịdọ aka ná ntị nke Grik na ọdịnihu ya, n’agbanyeghị na ọ na-egosi na ụzọ mgbapụ adịghị.
- source_word: τηλικαύτης ἀμελήσαντες σωτηρίας
  choice: ma ọ bụrụ na anyị eleghara nzọpụta dị ukwuu otu a anya
  rationale: A sụgharịrị participle ahụ dị ka ọnọdụ n’Igbo ka ahịrịokwu ahụ bụrụ nke okike, ebe ‘dị ukwuu otu a’ na-edobe ike τηλικαύτης.
- source_word: ἥτις, ἀρχὴν λαβοῦσα λαλεῖσθαι
  choice: Nzọpụta a[a], nke … buru ụzọ kwuo banyere ya
  rationale: Ikwughachi ‘Nzọpụta a’ na-eme ka ihe pronoun ahụ na-ezo aka na ya doo anya; ‘buru ụzọ kwuo banyere ya’ na-egosi mmalite nke ikwusa ozi nzọpụta ahụ n’Igbo dị mfe nghọta.
- source_word: διὰ τοῦ κυρίου
  choice: nke Onyenwe anyị … kwuo
  rationale: N’ụdị passive nke isi mmalite, διά na-egosi onye e si n’aka ya kwuo ozi ahụ. Igbo active a na-egosipụta Onyenwe anyị dị ka onye mbụ kwuru ya n’ụzọ okike.
- source_word: ὑπὸ τῶν ἀκουσάντων εἰς ἡμᾶς ἐβεβαιώθη
  choice: bụ ndị nụrụ ya mere ka o doo anyị anya
  rationale: 'Na-edobe usoro akaebe ahụ: ndị nụrụ ozi ahụ kwadoro ya nye ‘anyị.’ ‘Mere ka o doo anyị anya’ na-enye echiche nke ἐβεβαιώθη n’Igbo nkịtị na-enweghị ịgbakwunye nkọwa ọzọ.'
theological_decisions:
- issue: Onye ‘Onyenwe anyị’ na-ezo aka na ya
  choice: A hapụrụ aha nsọpụrụ ahụ dịka ‘Onyenwe anyị,’ n’ebe okwu gbara ya gburugburu na-egosi Jizọs.
  alternative: Ịsụgharị ya dịka aha izugbe maka Chineke.
  rationale: Ndị ‘nụrụ’ Onyenwe anyị wee kwado ozi ahụ nye ndị ọzọ na-egosi ozi Jizọs kwuru na akaebe ndị nụrụ ya; nsụgharị ahụ anaghị etinye aha ‘Jizọs’ n’ime amaokwu ahụ.
- issue: Ike ajụjụ ịdọ aka ná ntị ahụ
  choice: 'E debere ya dịka ajụjụ: ‘Olee otú anyị ga-esi gbanahụ…?’'
  alternative: Ikwupụta ya hoo haa dịka ‘Anyị agaghị agbanahụ…’
  rationale: Grik na-eji ajụjụ rhetorical; idebe ajụjụ ahụ na-echekwa ike na esemokwu nke ịdọ aka ná ntị ahụ.
- issue: Ihe ndị ahụ ‘nụrụ’
  choice: ‘ndị nụrụ ya’ na-ezo ozugbo n’ozi nzọpụta e kwuru.
  alternative: ‘ndị nụrụ Onyenwe anyị,’ nke na-etinye object a na-ekwughị kpọmkwem na Grik.
  rationale: Grik nwere naanị ‘ndị nụrụ.’ Pronoun ‘ya’ n’Igbo nwere ike izo aka n’ozi ahụ ma na-ezere ikpebi object ahụ karịa ka isi mmalite si mee.
translation_notes:
  register: Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. A họọrọ ‘nzọpụta’ na ‘Onyenwe anyị’ dịka okwu Baịbụl a maara nke ọma; a zere okwu ụka pụrụ iche na nkọwa na-edozi ambiguity nke isi mmalite.
