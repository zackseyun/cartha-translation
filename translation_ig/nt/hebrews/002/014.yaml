id: HEB.2.14
reference: Hebrews 2:14
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἐπεὶ οὖν τὰ παιδία κεκοινώνηκεν ⸂αἵματος καὶ σαρκός⸃, καὶ αὐτὸς παραπλησίως μετέσχεν τῶν αὐτῶν, ἵνα διὰ τοῦ θανάτου καταργήσῃ τὸν τὸ κράτος ἔχοντα τοῦ θανάτου, τοῦτ’ ἔστι τὸν διάβολον,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/014.yaml
  text: Therefore[a], since the children share in flesh and blood, he himself likewise partook of the same things, so that through death he might nullify the one who has the power of death—that is, the devil[b],
translation:
  language: ig
  text: Ya mere, ebe ụmụaka ahụ na-ekekọrịta ọbara na anụ ahụ[a], ya onwe ya sokwara n’otu ihe ndị ahụ n’ụzọ yiri nke ha, ka o wee site n’ọnwụ mee ka onye nwere ike nke ọnwụ ghara inwe ike—ya bụ, Ekwensu[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “anụ ahụ na ọbara.” N’asụsụ Grik, usoro ya bụ “ọbara na anụ ahụ.”
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, “bibie” ma ọ bụ “mee ka ọ ghara ịdị irè.” Ngwaa Grik ahụ nwere ike ịpụta ime ka ihe ghara ịrụ ọrụ, iwepụ ike ya, ma ọ bụ ịkwụsị ọrụ ya.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐπεὶ οὖν
  choice: Ya mere, ebe
  rationale: “Ya mere” na-egosi nkwubi okwu οὖν, ebe “ebe” na-egosi ihe kpatara ya dị n’ἐπεί, n’Igbo dị mfe ma na-aga nke ọma.
- source_word: τὰ παιδία
  choice: ụmụ ahụ
  rationale: Na-ejikọta okwu a na ụmụ ndị a kpọtụrụ aha n’akụkụ amaokwu a, n’enweghị ịgbakwụnye nkọwa ọzọ.
- source_word: κεκοινώνηκεν
  choice: nwere oke n’
  rationale: Na-egosi isoro nweta ma ọ bụ ikere òkè n’ihe, ya bụ ọnọdụ ụmụ mmadụ nwere n’ọbara na anụ ahụ.
- source_word: αἵματος καὶ σαρκός
  choice: ọbara na anụ ahụ
  rationale: Na-edobe usoro okwu Grik, “ọbara na anụ ahụ”; “anụ ahụ” ebe a bụ ahụ mmadụ, ọ bụghị “ọdịdị mmehie.”
- source_word: παραπλησίως
  choice: n’ụzọ yiri nke ha
  rationale: Na-egosi ezigbo myirịta n’enweghị ikwu na ụzọ isonye ya na nke ụmụ ahụ bụ otu n’akụkụ niile.
- source_word: μετέσχεν τῶν αὐτῶν
  choice: sokwara n’otu ihe ndị ahụ
  rationale: Na-egosi na ya onwe ya sonyere n’ezie n’ihe ụmụ ahụ nwere, ma na-edobe ntakịrị ọdịiche dị n’etiti ngwaa abụọ Grik.
- source_word: ἵνα
  choice: ka o wee
  rationale: Na-egosi ebumnuche nke isonye ya n’ọbara na anụ ahụ.
- source_word: διὰ τοῦ θανάτου
  choice: site n’ọnwụ
  rationale: Na-egosi na ọnwụ bụ ụzọ e si mezuo ihe ahụ.
- source_word: καταργήσῃ
  choice: mee ka ... ghara ịdị irè
  rationale: Na-egosi ime ka ike ma ọ bụ ọrụ onye ahụ ghara ịrụ ọrụ, n’enweghị echiche na onye ahụ akwụsịla ịdị adị.
- source_word: τὸ κράτος ἔχοντα τοῦ θανάτου
  choice: onye nwere ike nke ọnwụ
  rationale: “Ike” na-enye κράτος n’ụzọ doro anya ma dị mma n’Igbo, ebe njikọ “nke ọnwụ” na-edobe ihe Grik kwuru n’enweghị ịkọwa ókè ike ahụ.
- source_word: τοῦτ’ ἔστι
  choice: ya bụ
  rationale: Ụzọ Igbo a na-ahụkarị e si kọwaa onye ma ọ bụ ihe e kwuru tupu ya.
- source_word: τὸν διάβολον
  choice: Ekwensu
  rationale: Aha a maara nke ọma n’Igbo maka onye Grik kpọrọ διάβολος n’ebe a.
theological_decisions:
- issue: Iso Kraịst sonye n’ọnọdụ mmadụ
  choice: “ya onwe ya sokwara n’otu ihe ndị ahụ n’ụzọ yiri nke ha”
  alternative: “ya onwe ya ghọkwara mmadụ dịka ha”
  rationale: Nhọrọ a na-ekwupụta na o sonyere n’ezie n’ọbara na anụ ahụ, ma na-edobe παραπλησίως na ọdịiche ngwaa ahụ n’enweghị itinye usoro nkà mmụta okpukpe nke amaokwu ahụ ekwughị kpọmkwem.
- issue: Ihe καταργήσῃ pụtara banyere Ekwensu
  choice: “mee ka ... ghara ịdị irè”
  alternative: “bibie” ma ọ bụ “mee ka ... ghara inwe ike”
  rationale: Nke a na-edobe echiche nke iwepụ ịdị irè ma ọ bụ ime ka ike ghara ịrụ ọrụ, kama ịsị na Ekwensu kwụsịrị ịdị adị. E debere “bibie” na nkọwa ala peeji dịka ntụgharị ọzọ kwe omume.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji “ọbara na anụ ahụ” debe usoro Grik; e ji “n’ụzọ yiri nke ha” chekwaa myirịta παραπλησίως; e zere okwu pụrụ iche nke otu ụka.
