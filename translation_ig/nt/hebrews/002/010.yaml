id: HEB.2.10
reference: Hebrews 2:10
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἔπρεπεν γὰρ αὐτῷ, δι’ ὃν τὰ πάντα καὶ δι’ οὗ τὰ πάντα, πολλοὺς υἱοὺς εἰς δόξαν ἀγαγόντα τὸν ἀρχηγὸν τῆς σωτηρίας αὐτῶν διὰ παθημάτων τελειῶσαι.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/010.yaml
  text: For it was fitting for him—for whom are all things and through whom are all things—in bringing many sons to glory[d][c][b][a], to perfect the pioneer of their salvation through sufferings.
translation:
  language: ig
  text: N’ihi na ọ dabara adaba ka ya—onye ihe niile dịrị maka ya, onye ihe niile dịkwa site n’aka ya—n’ịkpọbata ọtụtụ ụmụ[a] n’ebube[d], mee ka onye na-ebute ụzọ n’ịzọpụta ha zuo oke[b] site n’ahụhụ dị iche iche[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Okwu Grik ahụ bụ “ọtụtụ ụmụ nwoke,” nke na-edobe echiche ịbụ nwa na iketa ihe; n’ebe a ọ gụnyere ụmụ Chineke niile, ọ bụghị naanị ndị nwoke.
    reason: lexical_alternative
  - marker: b
    text: “Mee ka ... zuo oke” ebe a pụtara ime ka o ruo n’uju nke ọrụ e zubere site n’ahụhụ; ọ pụtaghị idozi ntụpọ omume dị n’ime ya.
    reason: lexical_alternative
  - marker: c
    text: Okwu ahụ nwekwara ike ịbụ “site n’ahụhụ.” Ụdị ọtụtụ dị na Grik na-atụ aka n’ahụhụ ndị a tara n’ezie.
    reason: lexical_alternative
  - marker: d
    text: 'A pụkwara ịghọta njikọ ahụ dịka: “ka o site n’ahụhụ dị iche iche mee ka onye na-ebute ụzọ n’ịzọpụta ha zuo oke, n’ịkpọbata ọtụtụ ụmụ n’ebube.”'
    reason: syntactic_alternative
lexical_decisions:
- source_word: Ἔπρεπεν
  choice: o kwesịrị ekwesị
  rationale: Nke a na-egosi na ihe ahụ dabara adaba ma kwesịkwa ekwesị n’ime nzube Chineke, n’enweghị ime ka okwu ahụ sie ike nghọta.
- source_word: αὐτῷ
  choice: ka onye ahụ
  rationale: Aha nnọchi a na-ezo aka na Chineke dịka ihe gbara amaokwu ahụ gburugburu si gosi; ‘onye ahụ’ na-edobe ụzọ Grik si jiri aha nnọchi mee ihe, ebe nkebi na-esote na-akọwa onye ọ bụ.
- source_word: δι’ ὃν τὰ πάντα καὶ δι’ οὗ τὰ πάντα
  choice: onye ihe niile dị maka ya, onye ihe niile sikwa n’aka ya dị
  rationale: ‘Dị maka ya’ na-egosi na ya bụ ebe ihe niile na-ejedebe, ebe ‘sikwa n’aka ya dị’ na-egosi na ọ bụ site n’aka ya ka ihe niile ji dị. Nke a na-edobe ọdịiche dị n’etiti ụzọ abụọ e si jiri διά mee ihe.
- source_word: πολλοὺς υἱοὺς
  choice: ọtụtụ ụmụ nwoke
  rationale: A sụgharịrị υἱούς kpọmkwem ka e wee debe echiche nke ịbụ nwa nwoke na nke iketa ihe; nkọwa ala peeji na-eme ka o doo anya na ihe a gbasara ụmụ Chineke niile.
- source_word: εἰς δόξαν
  choice: n’ebube
  rationale: Nke a na-egosi mbata n’ọnọdụ ebube n’asụsụ Igbo dị mfe ma dịkwa ebube.
- source_word: ἀγαγόντα
  choice: mgbe ọ na-akpọbata
  rationale: Nke a na-ejikọta omume ịkpọbata ụmụ n’ebube na ime ka onye na-edu ụzọ zuo oke, na-enweghị ime ya ka ọ bụrụ naanị nkebi na-egosi ebumnuche.
- source_word: ἀρχηγὸν
  choice: onye na-edu ụzọ
  rationale: Okwu a na-egosi onye bidoro ụzọ ma na-edu ndị ọzọ n’ụzọ ahụ. Nkọwa ala peeji na-edobe nhọrọ ndị ọzọ okwu Grik ahụ nwere ike ịpụta.
- source_word: τῆς σωτηρίας αὐτῶν
  choice: ná nzọpụta ha
  rationale: Nke a bụ ụzọ Igbo si ekwu ya nke ọma, ma na-edobe njikọ onye na-edu ụzọ ahụ na nzọpụta ha.
- source_word: τελειῶσαι
  choice: mee ka ... zuo oke
  rationale: ‘Zuo oke’ na-edobe njikọ okwu τελειόω n’akwụkwọ Ndị Hibru; nkọwa ala peeji na-akọwa na ọ pụtara ime ka o ruo n’uju nke ọrụ e zubere, ọ bụghị idozi mmehie ma ọ bụ ntụpọ omume.
- source_word: διὰ παθημάτων
  choice: site n’ahụhụ dị iche iche
  rationale: Ịsị ‘ahụhụ dị iche iche’ na-egosipụta ụdị ọtụtụ nke παθημάτων ma na-atụ aka n’ahụhụ ndị e mere n’ezie, ọ bụghị naanị echiche ahụhụ n’ozuzu.
theological_decisions:
- issue: Ihe τελειῶσαι pụtara mgbe ọ na-ekwu banyere Ọkpara ahụ
  choice: mee ka ... zuo oke
  alternative: mee ka ... ruo n’uju; mee ka ... ruo n’isi njedebe e zubere
  rationale: N’akwụkwọ Ndị Hibru, okwu a na-ekwu maka ime ka onye ahụ ruo n’uju nke ọrụ na nzube e nyere ya site n’ahụhụ. Ọ naghị ekwu na Ọkpara ahụ nwere ntụpọ omume e kwesịrị idozi.
- issue: Otu e si sụgharị πολλοὺς υἱοὺς
  choice: ọtụtụ ụmụ nwoke
  alternative: ọtụtụ ụmụ
  rationale: Ụdị Grik ahụ bụ nke nwoke ma na-akpalite echiche ịbụ nwa na iketa ihe. E debere ya n’ahịrị amaokwu, ma kọwaa n’ala peeji na ọ gụnyere ụmụ Chineke niile, ọ bụghị naanị ndị nwoke.
- issue: Njikọ ἀγαγόντα na τελειῶσαι
  choice: mgbe ọ na-akpọbata ... mee ka ... zuo oke
  alternative: mee ka ... zuo oke ... ka o wee kpọbata
  rationale: Ụdị participle Grik na-ejikọta ịkpọbata ọtụtụ ụmụ n’ebube na ime ka onye na-edu ụzọ zuo oke. Nsụgharị bụ isi anaghị agbanwe ya ozugbo ka ọ bụrụ nkebi ebumnuche, ebe nkọwa ala peeji na-edobe nsụgharị ọzọ enwere ike.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. A hapụrụ nhazi ahịrịokwu ahụ ka ọ gosipụta njikọ Grik n’etiti ịkpọbata ụmụ n’ebube na ime ka onye na-edu ụzọ zuo oke, ma jiri akara ogologo kewaa nkọwa banyere Chineke ka a gụọ ya nke ọma.
