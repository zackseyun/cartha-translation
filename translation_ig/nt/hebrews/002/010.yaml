revisions:
- from: N’ihi na o kwesịrị ekwesị ka onye ahụ—onye ihe niile dị maka ya, onye ihe niile sikwa n’aka ya dị—mgbe ọ na-akpọbata ọtụtụ ụmụ nwoke[a] n’ebube[d], mee ka onye na-edu ụzọ[b] ná nzọpụta ha zuo oke[c] site n’ahụhụ dị iche iche.
  to: N’ihi na ọ dabara adaba ka ya—onye ihe niile dịrị maka ya, onye ihe niile dịkwa site n’aka ya—n’ịkpọbata ọtụtụ ụmụ[a] n’ebube[d], mee ka onye na-ebute ụzọ n’ịzọpụta ha zuo oke[b] site n’ahụhụ dị iche iche[c].
  rationale: The revision corrects target-language overrestriction and improves Standard Igbo idiom while retaining the Greek clause order and the circumstantial/closely linked force of ἀγαγόντα. It neither makes the bringing of the children an unambiguous purpose clause nor imports a doctrinal conclusion into the verse.
