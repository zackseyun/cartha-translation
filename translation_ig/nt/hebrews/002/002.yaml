  source_fidelity: 'A na-echekwa usoro na isi ihe Grik nke ọma: ozi e kwuru site n’aka ndị mmụọ ozi, ịdị ike ya, na nkwụghachi ikpe ziri ezi maka omume ọ bụla. Otú ọ dị, “njehie iwu” na-eme ka παράβασις dị ka mmejọ na-enweghị ụma, ebe okwu Grik ahụ pụtara mmebi ma ọ bụ ịda iwu. “Nnupụisi” nwekwara ike ịpụta mgba megide ọchịchị karịa παρακοή, nke bụ enweghị nrubeisi ma ọ bụ ịjụ ige ntị.'
