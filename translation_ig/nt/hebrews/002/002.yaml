  text: εἰ γὰρ ὁ δι’ ἀγγέλων λαληθεὶς λόγος ἐγένετο βέβαιος, καὶ πᾶσα παράβασις καὶ παρακοὴ ἔλαβεν ἔνδικον μισθαποδοσίαν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/002.yaml
  text: For if the message spoken through angels proved firm[a], and every transgression and disobedience received a just penalty[b],
translation:
  language: ig
  text: N’ihi na ọ bụrụ na ozi ahụ e kwuru site n’aka ndị mmụọ ozi guzosiri ike[a], ma mmebi iwu ọ bụla na enweghị nrubeisi ọ bụla natara ntaramahụhụ ziri ezi[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ya bụ, o nwere ike ịbụ iwu ahụ, nke e lere n’omenala ndị Juu anya dị ka nke e nyere site n’aka ndị mmụọ ozi; tulee Ọrụ Ndị Ozi 7:53 na Ndị Galeshia 3:19.
    reason: cross_reference
  - marker: b
    text: Ma ọ bụ, “nkwụghachi ziri ezi” ma ọ bụ “nkwụghachi kwesịrị ekwesị.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δι’ ἀγγέλων λαληθεὶς λόγος
  choice: ozi ahụ e kwuru site n’aka ndị mmụọ ozi
  rationale: “Ozi” na-egosi λόγος dị ka ihe Chineke mere ka a gwa mmadụ; “site n’aka” na-echekwa echiche διά nke onye e ji mee ihe, ebe “e kwuru” na-asụgharị λαληθείς n’ụzọ doro anya.
- source_word: ἀγγέλων
  choice: ndị mmụọ ozi
  rationale: N’ọnọdụ a, okwu ahụ na-ezo aka n’ụmụ mmụọ nke eluigwe, ọ bụghị nanị ndị ozi mmadụ.
- source_word: ἐγένετο βέβαιος
  choice: guzosiri ike
  rationale: Nke a na-egosi na ozi ahụ dịgidere bụrụ ihe a pụrụ ịdabere na ya ma bụrụkwa nke nwere ikike, n’etinyeghị nkọwa karịrị ihe Grik kwuru.
- source_word: πᾶσα παράβασις
  choice: njehie iwu ọ bụla
  rationale: παράβασις bụ ịgafe ókè iwu ma ọ bụ imebi iwu; “njehie iwu” na-eme ka echiche iwu ahụ doo ndị na-agụ akwụkwọ anya.
- source_word: παρακοὴ
  choice: nnupụisi ọ bụla
  rationale: παρακοή bụ ịghara ige ntị nke na-apụta dị ka enweghị nrubeisi; “nnupụisi” na-enye ịdị arọ nke omume ahụ, ma edobere ya iche na mmebi iwu.
- source_word: ἔλαβεν
  choice: natara
  rationale: Nke a na-echekwa usoro okwu Grik nke na-ekwu na omume ọ bụla natara nkwụghachi kwekọrọ na ya.
- source_word: ἔνδικον μισθαποδοσίαν
  choice: ntaramahụhụ ziri ezi
  rationale: “Ntaramahụhụ” na-egosi nkwụghachi ikpe dị n’ọnọdụ a, ebe “ziri ezi” na-echekwa ἔνδικον, ya bụ, ihe ikpe ziri ezi chọrọ.
theological_decisions:
- issue: Ihe “ozi ahụ e kwuru site n’aka ndị mmụọ ozi” na-ezo aka na ya
  choice: E debere ya dị ka ozi e kwuru site n’aka ndị mmụọ ozi, ebe ọ na-atụ aka n’iwu e nyere site n’ọrụ ndị mmụọ ozi.
  alternative: Ịkpọ ya “iwu ahụ ndị mmụọ ozi kwuru” ma ọ bụ ịghọta ya dị ka ozi Chineke n’ozuzu nke ndị mmụọ ozi wetara.
  rationale: Ọnọdụ akwụkwọ ahụ na omenala ndị Juu na-akwado na ọ na-atụ aka n’iwu Saịnaị, ma Grik ekwughị “iwu” kpọmkwem. Ya mere, isi ederede echekwala nhụjuanya ahụ, ebe nkọwa ala peeji na-enye ihe o yikarịrị ka ọ na-ezo aka na ya.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke ugwu ya dị mma ma dịkwa mfe nghọta. E ji “ndị mmụọ ozi” mee ka ndị mmụọ nke eluigwe pụta ìhè; e chekwara usoro ahịrịokwu ahụ dị ka akụkụ nke arụmụka na-aga n’ihu n’amaokwu na-esote.
