  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οὐ γὰρ δήπου ἀγγέλων ἐπιλαμβάνεται, ἀλλὰ σπέρματος Ἀβραὰμ ἐπιλαμβάνεται.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/016.yaml
  text: For surely it is not angels that he helps[a], but the offspring of Abraham.
translation:
  language: ig
  text: N’ihi na, n’ezie, ọ bụghị ndị mmụọ ozi ka ọ na-enyere aka[a], kama ọ bụ ụmụ Ebreham.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “na-ejide.” Ngwaa Grik ahụ nwere ike ịpụta ‘ijide’ n’ụzọ nkịtị, ma n’ebe a o yikarịrị ka ọ pụtara inyere mmadụ aka ma ọ bụ ịgbata ya ọsọ enyemaka.
    reason: lexical_alternative
lexical_decisions:
- source_word: δήπου
  choice: n’ezie
  rationale: Ọ na-egosi nkwusi ike n’ihe onye na-ekwu chere na ndị na-ege ya ntị ga-amata na ọ bụ eziokwu; “n’ezie” na-enye nghọta a n’Igbo dị ugbu a.
- source_word: ἀγγέλων
  choice: ndị mmụọ ozi
  rationale: Nke a bụ okwu Igbo a na-ejikarị akọwa ndị ozi nke eluigwe, ma na-edobe ìgwè e ji tụnyere ụmụ Ebreham.
- source_word: ἐπιλαμβάνεται
  choice: ọ na-enyere aka
  rationale: N’ọnọdụ a, ngwaa ahụ yikarịrị ka ọ pụtara ijide mmadụ iji nyere ya aka ma ọ bụ ịgbata ya ọsọ enyemaka, ọ bụghị nanị imetụ ya aka ma ọ bụ ijide ya nkịtị.
- source_word: σπέρματος Ἀβραὰμ
  choice: ụmụ Ebreham
  rationale: σπέρμα bụ aha otu e ji akọwa ọtụtụ ụmụ ma ọ bụ ụmụ ụmụ. “Ụmụ Ebreham” bụ Igbo ebumpụta ụwa nke na-edobe echiche nke ndị sitere n’Ebreham n’enweghị ịkọwa kpọmkwem ókè ndị a bụ.
- source_word: οὐ γὰρ ... ἀλλὰ
  choice: N’ihi na ... ọ bụghị ... kama ọ bụ ...
  rationale: Nhazi a na-edobe njikọ nke γάρ na amaokwu ndị bu ya ụzọ, ma na-eme ka ọdịiche siri ike dị n’etiti ndị mmụọ ozi na ụmụ Ebreham pụta ìhè.
theological_decisions:
- issue: Ihe ἐπιλαμβάνεται pụtara n’ihe gbasara ọrụ nzọpụta Kraịst
  choice: Amaokwu ahụ kwuru na ọ na-enyere ụmụ Ebreham aka, ọ bụghị ndị mmụọ ozi.
  alternative: Ọ na-ejide ụmụ Ebreham, nke ụfọdụ na-aghọta dị ka ntụaka n’ịnakwere ọdịdị mmadụ.
  rationale: Ihe ndị gbara amaokwu ahụ gburugburu na-ekwu maka ịdị n’otu Ọkpara ahụ na ụmụ mmadụ nakwa ọrụ ya ịzọpụta ha. Nghọta nke ịbụ onye na-enyere aka dabara nke ọma n’ebe a, ma nkọwa nkịtị nke ‘ijide’ ka e debere n’ala peeji ka a ghara ikpochapụ mgbagwoju anya na esemokwu nkà mmụta okpukpe dị na ngwaa Grik ahụ.
translation_notes:
  register: Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. E ji “n’ezie” gosipụta nkwusi ike nke δήπου; e jighị okwu ụka nke otu denominashọn. “Ụmụ Ebreham” bụ okwu ebumpụta ụwa ma na-ahapụ njirimara zuru ezu nke ìgwè ahụ ka ọnọdụ akwụkwọ ozi ahụ kọwaa ya.
