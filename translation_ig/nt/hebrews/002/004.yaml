id: HEB.2.4
reference: Hebrews 2:4
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: συνεπιμαρτυροῦντος τοῦ θεοῦ σημείοις τε καὶ τέρασιν καὶ ποικίλαις δυνάμεσιν καὶ πνεύματος ἁγίου μερισμοῖς κατὰ τὴν αὐτοῦ θέλησιν;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/004.yaml
  text: while God also bore witness with signs and wonders and various miracles and distributions of the Holy Spirit according to his will.
translation:
  language: ig
  text: Chineke sokwa jiri ihe ịrịba ama, ihe ịtụnanya, ọrụ ebube dị iche iche[a], na nkesa nke Mmụọ Nsọ[b] gbaa akaebe, dị ka uche ya si dị.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ngosipụta ike dị iche iche” ma ọ bụ “ọrụ ike dị iche iche.” Okwu Grik ahụ nwere ike ịpụta ngosipụta nke ike; n’ebe a, ọ na-ezo aka n’omume ebube.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “nkè Mmụọ Nsọ” ma ọ bụ “oke Mmụọ Nsọ.” Ihe odide ahụ ekwughị kpọmkwem “onyinye.”
    reason: lexical_alternative
lexical_decisions:
- source_word: συνεπιμαρτυροῦντος τοῦ θεοῦ
  choice: Chineke sokwa ... gbaa akaebe
  rationale: “Sokwa” na-egosipụta ike mgbakwunye dị na συν-, ebe “gbaa akaebe” bụ ụzọ Igbo doro anya si kwuo μαρτυρέω. Nhazi ahịrịokwu ahụ na-egosikwa na nke a bụ omume so ihe e kwuru n’amaokwu bu ya ụzọ.
- source_word: σημείοις
  choice: jiri ihe ịrịba ama
  rationale: “Jiri” na-egosipụta dative nke ihe e ji mee ihe; “ihe ịrịba ama” na-echekwa ọrụ ihe ndị ahụ dị ka ihe akaebe.
- source_word: τέρασιν
  choice: ihe ịtụnanya
  rationale: Nke a na-egosipụta ihe ndị na-akpali oke ijuanya, ma na-ezere iji otu okwu ahụ a na-ejikarị akọwa ọrụ ebube n’akụkụ δυνάμεσιν.
- source_word: ποικίλαις δυνάμεσιν
  choice: ọrụ ebube dị iche iche
  rationale: N’ọnọdụ a, δυνάμεις na-ezo aka n’omume ndị na-egosipụta ike Chineke. “Ọrụ ebube” bụ okwu Igbo doro anya, ebe “dị iche iche” na-asụgharị ποικίλαις.
- source_word: πνεύματος ἁγίου
  choice: nke Mmụọ Nsọ
  rationale: Nke a na-echekwa njikọ genitive nke okwu Grik ahụ na μερισμοῖς, na-ejighị nkọwa ozizi ọzọ tinye n’ime ya.
- source_word: μερισμοῖς
  choice: nkesa
  rationale: “Nkesa” na-egosipụta ikesa ma ọ bụ inye onye ọ bụla oke ya. A naghị etinye “onyinye” n’ahịrịokwu bụ isi n’ihi na okwu ahụ adịghị kpọmkwem na Grik.
- source_word: κατὰ τὴν αὐτοῦ θέλησιν
  choice: dị ka uche ya si dị
  rationale: Nke a bụ okwu Igbo sitere n’okike nke na-egosipụta ime ihe kwekọrọ n’uche ya.
theological_decisions:
- issue: Onye “ya” na-ezo aka na ya n’okwu “dị ka uche ya si dị”
  choice: “Ya” na-ezo aka na Chineke, onye bụ isiokwu nke “gbaa akaebe.”
  alternative: A pụrụ ịghọta ya n’ụzọ sara mbara dị ka ọ na-ezo aka na Mmụọ Nsọ, ọ bụ ezie na nhazi okwu Grik anaghị akwado nke a nke ukwuu.
  rationale: Chineke bụ isiokwu na-achị ahịrịokwu a, onye ji ihe ịrịba ama, ihe ịtụnanya, ọrụ ebube, na nkesa nke Mmụọ Nsọ gbaa akaebe. Ya mere, “uche ya” na-ezo aka na Chineke n’ụzọ kacha kwekọọ na syntax, n’etinyeghị nkọwa ozizi ọzọ.
- issue: Ụdị πνεύματος ἁγίου
  choice: Mmụọ Nsọ
  alternative: Enweghị ụzọ ọzọ dị mkpa n’ọnọdụ a.
  rationale: Nke a bụ aha Igbo kwụ ọtọ ma bụrụ nke a na-aghọta nke ọma maka okwu Grik ahụ; ọ naghị agbakwunye nkọwa na-adịghị n’ederede.
translation_notes:
  register: E ji asụsụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E debere ahịrịokwu ahụ dịka akụkụ na-aga n’ihu site n’amaokwu bu ya ụzọ, ma e zere okwu ụka pụrụ iche ma ọ bụ nkọwa na-emechi nghọta ndị Grik ka nwere ike ibu.
