  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ πάλιν· Ἐγὼ ἔσομαι πεποιθὼς ἐπ’ αὐτῷ· καὶ πάλιν· Ἰδοὺ ἐγὼ καὶ τὰ παιδία ἅ μοι ἔδωκεν ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/013.yaml
  text: And again[a], “I will put my trust in him.” And again, “Behold[d][c][b], I and the children whom God has given me.”
translation:
  language: ig
  text: Ọzọkwa, “M ga-atụkwasị ya obi[a].” Ọzọkwa, “Lee[b], mụ na ụmụaka ndị Chineke nyere m.[c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'N’ụzọ nke na-esochi mkpụrụokwu Grik nso karị: “M ga-anọgide na-atụkwasị ya obi,” ma ọ bụ, “M ga-enwe obi ike n’ebe ọ nọ.”'
    reason: lexical_alternative
  - marker: b
    text: A kpọghị onye na-ekwu okwu aha n’ahịrịokwu Grik a; n’okwu ndị gbara ya gburugburu, akwụkwọ ozi Ndị Hibru na-etinye ntụaka ndị a n’ebe Ọkpara ahụ nọ.
    reason: cross_reference
  - marker: c
    text: 'A pụkwara ịsụgharị ya: “ụmụaka ndị Chineke nyeworo m.”'
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ πάλιν
  choice: Ọzọkwa
  rationale: Nke a na-ewebata ntụaka ọzọ. E tinyereghị ngwaa dịka ‘ọ na-ekwu’ n’ihi na ọ dịghị na Grik.
- source_word: Ἐγὼ
  choice: M
  rationale: A hapụrụ nnọchiaha onye mbụ ahụ n’ihi na e kwusiri ya ike n’akwụkwọ Grik.
- source_word: ἔσομαι πεποιθὼς ἐπ’ αὐτῷ
  choice: M ga-atụkwasị ya obi
  rationale: Nke a bụ ụzọ Igbo dị ndụ si egosipụta ọnọdụ ntụkwasị obi ga-adịgide; ọ na-eburu echiche nke okwu ọdịnihu na participle zuru ezu dị na Grik.
- source_word: Ἰδοὺ
  choice: Lee
  rationale: ‘Lee’ na-echekwa ike okwu a ji adọta uche, ma bụrụkwa okwu Igbo dị ugwu ma doo anya.
- source_word: τὰ παιδία
  choice: ụmụntakịrị
  rationale: Ọ na-egosi ụmụ nọ n’okpuru nlekọta onye na-ekwu okwu; ‘ụmụntakịrị’ na-echekwa ọdịiche dị n’etiti παιδία na okwu sara mbara maka ụmụ.
- source_word: ἅ μοι ἔδωκεν ὁ θεός
  choice: ndị Chineke nyere m
  rationale: Igbo na-eji ‘ndị’ akọwa mmadụ n’agbanyeghị na nnọchiaha Grik kwekọrọ n'ụdị etiti nke παιδία. A sụgharịrị aorist ἔδωκεν n'ụzọ nkịtị dịka ‘nyere.’
theological_decisions:
- issue: Onye na-ekwu okwu na ntụaka ndị a na otú e si etinye ha n’ebe Kraịst nọ
  choice: E debere okwu ndị ahụ dịka okwu onye mbụ, na-akpọghị onye na-ekwu ha aha n’ahịrịokwu bụ isi.
  alternative: Ịgbakwunye ‘ọ na-ekwu’ ma ọ bụ ‘Ọkpara ahụ na-ekwu.’
  rationale: Grik kwuru naanị ‘ọzọkwa.’ Ọ bụ gburugburu akwụkwọ Hibru na-etinye okwu ndị a n’ọnụ Ọkpara ahụ; ntụgharị ekwesịghị ịgbakwunye njirimara na-adịghị n’ahịrịokwu a.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị ugwu ma dị mfe nghọta. ‘Lee’ na-echekwa ụda ntụaka ahụ; e zere ịgbakwunye onye na-ekwu okwu. E tinyere akara nkọwa ala akwụkwọ niile n’ahịrịokwu bụ isi.
