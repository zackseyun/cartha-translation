  variant: Standard Igbo
source:
  edition: SBLGNT
  text: λέγων· Ἀπαγγελῶ τὸ ὄνομά σου τοῖς ἀδελφοῖς μου, ἐν μέσῳ ἐκκλησίας ὑμνήσω σε·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/012.yaml
  text: saying[a], “I will proclaim your name to my brothers[b]; in the midst of the assembly I will sing praise to you.”
translation:
  language: ig
  text: na-asị, “Aga m ekwusara ụmụnne m[a] aha gị; n’etiti ọgbakọ[b], aga m eji abụ too gị.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Okwu Grik ahụ pụtara n’ụzọ nkịtị “ụmụnne nwoke m,” ma n’ebe a okwu ezinụlọ ahụ pụrụ ịgụnye ụmụ nwoke na ụmụ nwanyị niile bụ ndị kwere ekwe.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsị “nzuko ndị mmadụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγων
  choice: na-asị
  rationale: Ọ bụ participle na-ewebata okwu e hotara; “na-asị” na-egosipụta nke a n’ụzọ dị mfe ma kwekọọ n’usoro Igbo.
- source_word: Ἀπαγγελῶ
  choice: Aga m ekwusara
  rationale: Okwu a pụtara ikwupụta ma ọ bụ ime ka ihe mara n’ihu ọha; “ekwusara” na-echekwa ike nke nkwupụta ahụ.
- source_word: τὸ ὄνομά σου
  choice: aha gị
  rationale: A hapụrụ “aha” dịka o si dị na Grik, n’ihi na ọ pụrụ ịgụnye onye mmadụ bụ na otú e si mara ya, ma ekwesịghị ịgbasa ya n’ime isiokwu.
- source_word: τοῖς ἀδελφοῖς μου
  choice: ụmụnne m
  rationale: “Ụmụnne” bụ okwu Igbo nkịtị maka ndị otu ezinụlọ ma ọ bụ ndị otu okwukwe; ọ na-adabara okwu ezinụlọ dị n’ebe a ma ghara itinye nwoke naanị n’ebe asụsụ Igbo na-adịghị amanye ya.
- source_word: ἐν μέσῳ
  choice: n’etiti
  rationale: Ntụgharị a na-echekwa echiche nke ịnọ n’etiti ndị gbakọrọ, tinyere ụda uri nke okwu ahụ.
- source_word: ἐκκλησίας
  choice: ọgbakọ
  rationale: N’ebe a okwu ahụ na-ezo aka n’ebe ndị mmadụ zukọrọ, ọ bụghị n’ụlọ ụka ma ọ bụ n’òtù ụka dịka ụlọ ọrụ.
- source_word: ὑμνήσω
  choice: aga m eji abụ too
  rationale: Ngwaa Grik ahụ bụ ito mmadụ site n’abụ; okwu Igbo a na-echekwa ma otuto ma ịbụ abụ.
- source_word: σε
  choice: gị
  rationale: “Gị” bụ onye a na-eto, wee bụrụ ihe ngwaa ahụ na-erute n’ụzọ doro anya n’Igbo.
theological_decisions:
- issue: Otú a ga-esi tụgharị ἀδελφοῖς dịka okwu ezinụlọ na-anọchi anya ndị ọzọ
  choice: ụmụnne m
  alternative: ụmụnna m; ụmụnne m ndị nwoke na ndị nwanyị
  rationale: Ụdị Grik bụ ọtụtụ nwoke, ma n’ọnọdụ a ọ pụrụ ịgụnye ndị kwere ekwe niile. “Ụmụnne” bụ okwu Igbo sitere n’okike na-adịghị edozi ajụjụ ahụ n’ike; nkọwa ala peeji na-eme ka ọdịdị Grik na ohere nghọta sara mbara pụta ìhè.
- issue: Otú a ga-esi tụgharị ἐκκλησία n’okwu e hotara n’Abụ Ọma
  choice: ọgbakọ
  alternative: nzukọ; ụka
  rationale: “Ọgbakọ” na-egosi ndị Chineke gbakọrọ ọnụ n’achọghị itinye echiche ụlọ ọrụ ụka nke oge ndị ọzọ n’ime okwu ahụ.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị ugwu ma dị mfe nghọta. E chekwara ụda uri nke okwu e hotara site n’iji “n’etiti” na “eji abụ too.”
