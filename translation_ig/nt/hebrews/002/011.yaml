review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the sanctifier, those being sanctified, their common origin, and the Son's lack of shame in calling them brothers. However, “sitere n’otu onye” specifies that the unstated referent is a person, whereas ἐξ ἑνός leaves that referent open. “ụmụnne ya” also adds possessive force not explicitly present in ἀδελφοὺς αὐτούς καλεῖν.
  naturalness: The revision uses idiomatic, modern Standard Igbo while retaining the compact parallelism of the Greek. “Si n’otu pụta” is a natural way to preserve the unspecified common origin.
  terminology: “na-edo nsọ” consistently represents ἁγιάζω, and “ụmụnne” is an appropriate Igbo family term. The footnotes should avoid describing the Greek “one” as necessarily a person.
  issues:
  - severity: medium
    issue: “sitere n’otu onye” narrows the referent of ἐξ ἑνός.
    rationale: The Greek says only “from one” and can refer to a father, ancestor, source, or other shared origin. Adding “onye” makes it explicitly a person and conflicts with the ambiguity retained in the source and English audit trail.
  - severity: low
    issue: “ụmụnne ya” adds an explicit possessive.
    rationale: The Greek means “to call them brothers”; although the relationship is clear in context, the possessive is not stated and is unnecessary in Igbo.
  - severity: low
    issue: Footnote a says the Greek does not identify which person “one” is.
    rationale: Because the Greek does not require a personal referent, the note should instead say that it does not specify what “one” refers to.
  revised_text: N’ihi na onye na-edo nsọ na ndị a na-edo nsọ si n’otu pụta, ha niile. Ọ bụ ya mere ihere adịghị eme ya ịkpọ ha ụmụnne[b].
  revised_footnotes:
