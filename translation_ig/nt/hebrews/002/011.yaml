    text: A pụkwara ịsụgharị ya, “sitere n’otu Nna,” “sitere n’otu isi mmalite,” ma ọ bụ “sitere n’otu nna nna.” Asụsụ Grik akọwaghị ihe “otu” ahụ na-ezo aka na ya.
    reason: alternative_reading
  - marker: b
