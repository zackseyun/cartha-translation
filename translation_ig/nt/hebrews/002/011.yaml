id: HEB.2.11
reference: Hebrews 2:11
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὅ τε γὰρ ἁγιάζων καὶ οἱ ἁγιαζόμενοι ἐξ ἑνὸς πάντες· δι’ ἣν αἰτίαν οὐκ ἐπαισχύνεται ἀδελφοὺς αὐτοὺς καλεῖν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/011.yaml
  text: For both the one who sanctifies and those who are being sanctified are all from one[a]; for this reason he is not ashamed to call them brothers[b],
translation:
  language: ig
  text: N’ihi na onye na-edo nsọ na ndị a na-edo nsọ si n’otu pụta, ha niile. Ọ bụ ya mere ihere adịghị eme ya ịkpọ ha ụmụnne[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Okwu Grik a sụgharịrị “ụmụnne” dị n’ụdị ọtụtụ nke nwoke; n’ihe gbara ya gburugburu, ọ pụrụ ịgụnye ezinụlọ ndị kwere ekwe dum, ma ndị nwoke ma ndị nwanyị.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἁγιάζων
  choice: onye ahụ na-edo nsọ
  rationale: Ọ bụ participle nke na-arụ ọrụ dị ka aha; ‘na-edo nsọ’ na-egosipụta omume dị ugbu a ma na-ejigide okwu okpukpe ahụ n’ụzọ ndị Igbo nke oge a ga-aghọta.
- source_word: οἱ ἁγιαζόμενοι
  choice: ndị a na-edo nsọ
  rationale: Ụdị passive present participle ahụ na-egosi ndị a na-eme ka ha dị nsọ, dị ka usoro na-aga n’ihu ma ọ bụ ọnọdụ a na-ele anya ka ọ na-aga n’ihu.
- source_word: ἐξ ἑνὸς
  choice: sitere n’otu onye
  rationale: E deghị onye ‘otu’ ahụ bụ n’asụsụ Grik. Igbo chọrọ ka e nwee ihe aha ahụ na-adabere na ya; ‘otu onye’ na-ahapụ njirimara ya ghe oghe kama ịkọwa ya dịka Nna, nna nna, ma ọ bụ isi mmalite.
- source_word: πάντες
  choice: ha niile
  rationale: Na-ejikọta ma onye na-edo nsọ ma ndị a na-edo nsọ, ma na-egosipụta nkwusi ike nke πάντες.
- source_word: δι’ ἣν αἰτίαν
  choice: Ọ bụ ya mere
  rationale: Nke a bụ ụzọ Igbo dị mma ma doo anya isi gosi ihe si n’okwu gara aga pụta.
- source_word: οὐκ ἐπαισχύνεται
  choice: ihere adịghị eme ya
  rationale: Nke a bụ akpaalaokwu Igbo sitere n’okike nke na-echekwa echiche banyere ihere, n’enweghị ịgbatị nkọwa.
- source_word: ἀδελφοὺς
  choice: ụmụnne ya
  rationale: ‘Ụmụnne’ bụ okwu ezinụlọ sitere n’okike n’Igbo; ọ naghị amanye okike nwoke n’ebe Igbo na-adịghị egosi ya n’ụdị a, ya mere ndetu na-akọwa ụdị okwu Grik ahụ.
- source_word: καλεῖν
  choice: ịkpọ
  rationale: Ọ bụ okwu Igbo nkịtị na nke ziri ezi maka ịkpọ mmadụ aha ma ọ bụ ikwu na ọ bụ ihe.
theological_decisions:
- issue: Onye bụ isiokwu a na-aghọta (‘ya’) na onye ‘otu’ ahụ bụ
  choice: ‘Ya’ na-ezo site n’ihe gbara amaokwu ahụ gburugburu aka n’ebe Ọkpara/onye na-edo nsọ nọ; ma a kọwaghị onye ‘otu’ ahụ bụ.
  alternative: Ịsụgharị ya ‘sitere n’otu Nna,’ ‘sitere n’otu nna nna,’ ma ọ bụ ‘sitere n’otu isi mmalite.’
  rationale: Ihe gbara amaokwu ahụ gburugburu na-egosi na onye na-edo nsọ bụ Ọkpara/Jizọs. Ma ἐξ ἑνὸς ekwughị kpọmkwem ma ‘otu’ ahụ bụ Chineke, Adam, Abraham, ma ọ bụ otu agbụrụ mmadụ; ya mere a hapụrụ esemokwu nkọwa ahụ ghe oghe.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke oge a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu nke mbụ na-ejigide myirịta dị n’etiti onye na-edo nsọ na ndị a na-edo nsọ; ndetu ala peeji na-echekwa nghọtahie ἐξ ἑνὸς na oke okwu ἀδελφοὺς.
