revisions:
- from: N’ihi na onye ahụ na-edo nsọ na ndị a na-edo nsọ, ha niile sitere n’otu onye[a]. Ọ bụ ya mere ihere adịghị eme ya ịkpọ ha ụmụnne ya[b].
  to: N’ihi na onye na-edo nsọ na ndị a na-edo nsọ si n’otu pụta, ha niile. Ọ bụ ya mere ihere adịghị eme ya ịkpọ ha ụmụnne[b].
  rationale: The main revision removes “onye” so that the Igbo, like ἐξ ἑνός, does not determine the identity or nature of the shared “one.” It also removes the added possessive from “ụmụnne ya.” Footnote a is adjusted to preserve the same ambiguity. Footnote marker a belongs after “otu” in the revised text.
  reviewer_model: gpt-5.6-terra
