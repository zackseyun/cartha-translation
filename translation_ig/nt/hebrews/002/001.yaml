id: HEB.2.1
reference: Hebrews 2:1
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Διὰ τοῦτο δεῖ περισσοτέρως ⸂προσέχειν ἡμᾶς⸃ τοῖς ἀκουσθεῖσιν, μήποτε παραρυῶμεν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/001.yaml
  text: For this reason[a], we must pay much closer attention to what we have heard, lest we drift away.
translation:
  language: ig
  text: N’ihi nke a, anyị aghaghị itinyekwu uche n’ihe anyị nụrụ, ka anyị ghara ikpafu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ka anyị ghara ịkpafu gafee ha,” ma ọ bụ, “ka anyị ghara ikwe ka ihe ndị ahụ sipụ anyị n’aka.” Ngwaa Grik bụ παραρυῶμεν na-akpọte onyinyo nke ịkpafu ma ọ bụ nke ihe na-asọ gafee.
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: N’ihi nke a
  rationale: Ọ na-egosi njikọ nke ihe a na-ekwu na arụmụka bu ya ụzọ n'ụzọ doro anya ma bụrụkwa Igbo nkịtị.
- source_word: δεῖ
  choice: anyị aghaghị
  rationale: Ọ na-egosipụta mkpa siri ike dị n’okwu Grik ahụ, ebe ‘anyị’ na-anọchi ἡμᾶς.
- source_word: περισσοτέρως
  choice: nke ukwuu
  rationale: Ọ na-eme ka iwu ilekwasị anya sikwuo ike, n’ụzọ dabara n’asụsụ Igbo ugbu a.
- source_word: προσέχειν ἡμᾶς
  choice: anyị aghaghị ilekwasị anya
  rationale: ‘Ilekwasị anya’ na-egosipụta ịtụgharị uche na inye ihe ntị nke ọma n’enweghị itinye echiche nke ‘ijidesi ike’ nke na-agafe okwu ahụ.
- source_word: τοῖς ἀκουσθεῖσιν
  choice: n’ihe ndị anyị nụrụ
  rationale: Ọ na-edobe ihe e kwuru n’ozuzu ya, kama ịkọwa ya kpọmkwem dịka ‘ozi,’ ma na-egosi na ihe ahụ a nụrụ ka dị mkpa ugbu a.
- source_word: μήποτε
  choice: ka anyị ghara
  rationale: Nke a bụ ụzọ Igbo dị mfe ma doo anya isi gosipụta ịdọ aka ná ntị banyere ihe ọjọọ nwere ike ime.
- source_word: παραρυῶμεν
  choice: anyị ... jiri nwayọọ kpafuo
  rationale: ‘Kpafuo’ na-edobe echiche nke ndị na-anụ okwu ahụ isi n’ebe ọ nọ pụọ; ‘jiri nwayọọ’ na-eme ka onyinyo nke ịkpafu n’amaghị ama pụta ìhè n’enweghị ịkọwafe ya.
theological_decisions:
- issue: Onyinyo ịdọ aka ná ntị dị na παραρυῶμεν
  choice: Kọwaa ya dịka ndị na-anụ ihe ahụ ji nwayọọ kpafuo.
  alternative: Ihe ndị a nụrụ esipụ ha n’aka, ma ọ bụ ha agafee ihe ahụ n’akụkụ.
  rationale: Ngwaa ahụ nwere ike igosi ịkpafu pụọ, ịgafe ihe n’akụkụ, ma ọ bụ ihe isipu mmadụ n’aka. Nhazi ahịrịokwu na-etinye ‘anyị’ dịka onye nwere ike ịkpafu; nsụgharị a na-edobe ịdọ aka ná ntị ahụ n’agbanyeghị na nkọwa ọzọ ka ekwuru n’ala peeji.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke ugwu ya dị nwayọọ ma dị mfe nghọta. E ji ‘aghaghị’ chekwaa ike nke iwu ahụ; e debere onyinyo παραρυῶμεν n’ahịrịokwu na nkọwa ala peeji n’enweghị itinye ozizi ụka pụrụ iche.
