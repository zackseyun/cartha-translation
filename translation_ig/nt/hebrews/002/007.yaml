id: HEB.2.7
reference: Hebrews 2:7
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἠλάττωσας αὐτὸν βραχύ τι παρ’ ἀγγέλους, δόξῃ καὶ τιμῇ ἐστεφάνωσας ⸀αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/007.yaml
  text: You made him lower than the angels for a little while[a]; you crowned him with glory and honor.
translation:
  language: ig
  text: I mere ka ọ dị ala karịa ndị mmụọ ozi ruo nwa oge[a]; i jiri ebube na nsọpụrụ kpube ya okpueze.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “I mere ka ọ dị ntakịrị ala karịa ndị mmụọ ozi.” Nkebiokwu Grik ahụ nwere ike ịkọwa ogo kama ịkọwa ogologo oge.
    reason: alternative_reading
lexical_decisions:
- source_word: ἠλάττωσας
  choice: I mere ka ọ dị ala
  rationale: Ngwaa a bụ aorist active indicative, onye nke abụọ otu, ma n’ebe a ọ nwere nghọta nke ime ka onye ahụ dị ala n’iji ya tụnyere ndị mmụọ ozi.
- source_word: αὐτὸν
  choice: ọ / ya
  rationale: Nnochiaha nwoke otu ahụ na-ezo aka n’onye mmadụ Abụ Ọma ahụ na-ekwu banyere ya; Igbo na-eji “ọ” dịka isiokwu nke nkebi dabara adaba, ma jiri “ya” dịka mmeju n’ikpeazụ.
- source_word: βραχύ τι
  choice: nwa oge nta
  rationale: A họọrọ nghọta nke oge, nke dabara nke ọma n’otú Ndị Hibru si akọwa iweda Ọkpara ala ruo nwa oge; e debere nghọta nke ogo n’ala ala peeji.
- source_word: παρ’ ἀγγέλους
  choice: karịa ndị mmụọ ozi
  rationale: Παρά ya na accusative mgbe e ji ihe atụnyere ibe ya pụtara “karịa/ala karịa,” ọ bụghị ịnọ n’akụkụ.
- source_word: δόξῃ
  choice: jiri ebube
  rationale: Dative a na-egosi ihe e ji kpube onye ahụ okpueze; “jiri ebube” bụ okwu Igbo doro anya ma dị ebube.
- source_word: τιμῇ
  choice: na nsọpụrụ
  rationale: τιμή na-egosi nsọpụrụ ma ọ bụ ọkwa e nyere mmadụ; ọ na δόξα jikọrọ ọnụ dịka “ebube na nsọpụrụ.”
- source_word: ἐστεφάνωσας
  choice: i ... kpube ya okpueze
  rationale: Aorist active indicative, onye nke abụọ otu; okwu a na-egosi ikpube mmadụ okpueze dịka ihe nnọchianya nke inye ya ebube na nsọpụrụ.
theological_decisions:
- issue: Ihe βραχύ τι pụtara n’okwu sitere n’Abụ Ọma 8
  choice: 'oge: “nwa oge nta”'
  alternative: 'ogo: “ntakịrị ala karịa”'
  rationale: Grik nwere ike ịpụta ogologo oge dị nta ma ọ bụ ogo dị nta. N’ọnọdụ Ndị Hibru 2, nghọta nke oge kwekọrọ n’iweda Ọkpara ala ruo nwa oge tupu e bulie ya elu; ihe odide ala ala peeji na-echekwa nghọta nke ogo ka a ghara iwepụ mgbagwoju anya dị n’asụsụ mbụ.
translation_notes:
  register: Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. E ji “ndị mmụọ ozi” mee ἀγγέλους, ma jiri ahịrịokwu nkịtị “kpube ya okpueze” chekwaa onyinyo eze dị na στεφανόω.
