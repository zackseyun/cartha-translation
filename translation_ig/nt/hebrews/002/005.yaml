  text: Οὐ γὰρ ἀγγέλοις ὑπέταξεν τὴν οἰκουμένην τὴν μέλλουσαν, περὶ ἧς λαλοῦμεν·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/005.yaml
  text: For he did not subject the world to come to angels[a], about which we are speaking.
translation:
  language: ig
  text: N’ihi na ọ bụghị n’okpuru ndị mmụọ ozi ka o doro ụwa nke ga-abịa[a], nke anyị na-ekwu maka ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ụwa mmadụ bi na ya nke ga-abịa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐ γὰρ
  choice: N’ihi na ...ghị
  rationale: “N’ihi na” na-egosi na amaokwu a na-akọwa ma na-ejikọta echiche ya na ihe e kwuru tupu ya; mgbakwunye -ghị na ngwaa na-egosi nkwugide Οὐ.
- source_word: ἀγγέλοις
  choice: n’okpuru ndị mmụọ ozi
  rationale: N’ebe a, okwu ahụ na-ezo aka n’ebe ndị mmụọ ozi nke eluigwe nọ, ọ bụghị ndị ozi mmadụ; “n’okpuru” na-arụkọ ọrụ na ngwaa “doro” iji gosipụta onye e nyere ikike.
- source_word: ὑπέταξεν
  choice: o doghị ... n’okpuru
  rationale: Nkebiokwu Igbo “ido ... n’okpuru” na-egosipụta itinye ihe n’okpuru ikike ma ọ bụ ọchịchị onye ọzọ, ma na-anọgide nso n’echiche ὑποτάσσω.
- source_word: τὴν οἰκουμένην
  choice: ụwa
  rationale: “Ụwa” bụ okwu Igbo doro anya ma dị mfe maka ụwa ma ọ bụ usoro ụwa mmadụ bi na ya; nkọwa ala peeji na-edebe echiche kpọmkwem nke “ụwa mmadụ bi na ya.”
- source_word: τὴν μέλλουσαν
  choice: nke ga-abịa
  rationale: Nke a na-edebe echiche ọdịnihu dị na μέλλουσαν ma na-ada nke ọma n’Igbo ugbu a.
- source_word: περὶ ἧς λαλοῦμεν
  choice: nke anyị na-ekwu maka ya
  rationale: Nke a na-edebe nrụtụ aka onye dere akwụkwọ ahụ n’okwu ọ ka na-atụle, n’asụsụ Igbo nkịtị ma doo anya.
theological_decisions:
- issue: Ihe “ụwa nke ga-abịa” na-ezo aka na ya
  choice: E debere ya dị ka ụwa ma ọ bụ usoro ụwa nke ga-abịa.
  alternative: Ụwa mmadụ bi na ya n’ozuzu, ma ọ bụ kpọmkwem oge ozi ọma.
  rationale: τὴν οἰκουμένην τὴν μέλλουσαν na-egosi ụwa ma ọ bụ usoro ga-abịa. Nsụgharị ahụ akọwaghị kpọmkwem ọdịdị ya ma ọ bụ oge ọ ga-abịa, ka esemokwu na nghọta sara mbara nke okwu Grik ahụ wee nọgide.
translation_notes:
  register: Asụsụ ahụ bụ Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. A họọrọ “o doghị ... n’okpuru” iji mee ka echiche ọchịchị pụta ìhè n’enweghị itinye nkọwa okpukpe ọzọ.
