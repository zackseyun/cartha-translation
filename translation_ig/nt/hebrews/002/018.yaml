- from: N’ihi na, ebe ọ bụ na ya onwe ya tara ahụhụ mgbe a nwara ya[a], o nwere ike inyere ndị a na-anwa aka.
  to: N’ihi na ya onwe ya tara ahụhụ mgbe a nwara ya[a], o nwere ike inyere ndị a na-anwa aka.
  rationale: The revision removes an unnatural doubling of causal phrases while preserving the verse’s causal explanation, Christ’s personal suffering, and his ability to help those currently undergoing πειράζω. It also corrects the footnote’s idiom and aspect without deciding between “tempt” and “test.”
  reviewer_model: gpt-5.6-terra
