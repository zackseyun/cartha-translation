review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents Christ's emphatic personal suffering (αὐτὸς, πέπονθεν), the passive experience expressed by πειρασθείς, his present ability to aid (δύναται), and the ongoing experience of those being tempted/tested (τοῖς πειραζομένοις). The causal force is retained, though the two consecutive causal expressions in the draft are unnecessarily heavy in natural Igbo.
  naturalness: “N’ihi na, ebe ọ bụ na” is awkward and redundant in Standard Igbo, especially with the comma. A single natural causal introduction conveys the combined causal-explanatory relationship without obscuring the argument. The footnote's proposed alternative uses the less fitting perfective form “a nwalechara ya”; the Greek participle is better represented here by “a nwalere ya.”
  terminology: '“Tara ahụhụ,” “ya onwe ya,” “o nwere ike,” and “inyere ... aka” are accurate and suitably dignified. “Nwara/anwa” appropriately leaves room for both temptation and testing, while the footnote should state the two lexical senses idiomatically: “ịnwa mmadụ ọnwụnwa” and “ịnwale mmadụ.”'
  issues:
  - severity: low
    issue: Stacked causal expressions
    rationale: The wording “N’ihi na, ebe ọ bụ na” is not idiomatic Standard Igbo. Although it mirrors two Greek connective elements, retaining both as consecutive causal phrases produces unnatural style; one causal expression adequately conveys the explanatory causal relationship.
  - severity: medium
    issue: Footnote alternative has an aspectual and idiomatic problem
    rationale: “mgbe a nwalechara ya” introduces a completed/after-testing nuance not required by πειρασθείς. “mgbe a nwalere ya” more directly represents the passive participial sense. The lexical explanation should use the idiomatic infinitive phrase “ịnwa mmadụ ọnwụnwa.”
  revised_text: N’ihi na ya onwe ya tara ahụhụ mgbe a nwara ya[a], o nwere ike inyere ndị a na-anwa aka.
  revised_footnotes:
  - marker: a
    text: 'A pụkwara ịsụgharị ya “nwalee” n’ebe abụọ ahụ: “N’ihi na ya onwe ya tara ahụhụ mgbe a nwalere ya, o nwere ike inyere ndị a na-anwale aka.” Okwu Grik ahụ nwere ike ịpụta “ịnwa mmadụ ọnwụnwa” ma ọ bụ “ịnwale mmadụ,” dabere n’ihe gbara ya gburugburu.'
    reason: lexical_alternative
