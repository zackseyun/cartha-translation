source:
  edition: SBLGNT
  text: ἐν ᾧ γὰρ πέπονθεν αὐτὸς πειρασθείς, δύναται τοῖς πειραζομένοις βοηθῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/018.yaml
  text: For because he himself suffered when he was tempted[a], he is able to help those who are being tempted.
translation:
  language: ig
  text: N’ihi na ya onwe ya tara ahụhụ mgbe a nwara ya[a], o nwere ike inyere ndị a na-anwa aka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ịsụgharị ya “nwalee” n’ebe abụọ ahụ: “N’ihi na ya onwe ya tara ahụhụ mgbe a nwalere ya, o nwere ike inyere ndị a na-anwale aka.” Okwu Grik ahụ nwere ike ịpụta “ịnwa mmadụ ọnwụnwa” ma ọ bụ “ịnwale mmadụ,” dabere n’ihe gbara ya gburugburu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ᾧ
  choice: ebe ọ bụ na
  rationale: Nkebiokwu a na-arụ ọrụ dị ka ihe na-egosi ihe kpatara ya; ‘ebe ọ bụ na’ na-egosipụta nke a n’Igbo nkịtị.
- source_word: γὰρ
  choice: N’ihi na
  rationale: Ọ na-ejikọta amaokwu a na nke bu ya ụzọ dị ka nkọwa; ijikọ ya na ‘ebe ọ bụ na’ na-echekwa ike nkọwa na ihe kpatara ya dị na Grik.
- source_word: πέπονθεν
  choice: tara ahụhụ
  rationale: Ọ na-egosi ahụhụ o nwetara n’onwe ya, nke ka dị mkpa nye ikike ya inyere ndị ọzọ aka.
- source_word: αὐτὸς
  choice: ya onwe ya
  rationale: 'Nke a na-echekwa nkwusi ike dị na nnọchiaha Grik: ọ bụghị naanị na ihe ahụ mere, kama ya onwe ya gabigara ya.'
- source_word: πειρασθείς
  choice: mgbe a nwara ya
  rationale: ‘Nwaa’ n’Igbo nwere ike ibu echiche nke ọnwụnwa ma ọ bụ ule, ya mere ọ na-echekwa obosara okwu Grik; ihe e dere n’okpuru na-akọwa ụzọ abụọ ahụ.
- source_word: δύναται
  choice: o nwere ike
  rationale: Nke a na-egosipụta ikike ya n’asụsụ Igbo doro anya ma dị ugbu a.
- source_word: τοῖς πειραζομένοις
  choice: ndị a na-anwa
  rationale: Ụdị a na-egosi ndị nọ ugbu a n’ọnwụnwa ma ọ bụ n’ule, na-echekwa omume na-aga n’ihu nke participle Grik.
- source_word: βοηθῆσαι
  choice: inyere ... aka
  rationale: Nke a bụ ụzọ Igbo ebumpụta ụwa si kwuo ‘help’ ma na-egosi ịbịara ndị nọ ná mkpa enyemaka.
theological_decisions:
- issue: Ihe πειράζω pụtara mgbe e ji ya kwuo banyere Jizọs na ndị kwere ekwe
  choice: nwara / anwa, nke nwere ike ịgụnye ‘nwa ọnwụnwa’
  alternative: nwalee / a na-anwale
  rationale: Okwu Grik nwere ike ịpụta ịnwa mmadụ ọnwụnwa ma ọ bụ ịnwale ya. Isiokwu nke amaokwu ahụ bụ na Ọkpara ahụ n’onwe ya tara ahụhụ n’ihe o gabigara, ya mere o nwere ike inyere ndị ọzọ aka. Nsụgharị ahụ na ihe e dere n’okpuru na-ahapụ ụzọ abụọ ahụ ka ha dị, n’ebughị ụzọ kwụsị esemokwu ahụ.
translation_notes:
  register: Standard Igbo dị ugbu a, doro anya ma nwee nsọpụrụ. E ji ‘ya onwe ya’ chekwaa nkwusi ike, e jikwa ‘ndị a na-anwa’ gosipụta na ọnọdụ ahụ ka na-aga n’ihu.
