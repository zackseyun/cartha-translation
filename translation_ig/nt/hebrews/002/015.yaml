source:
  edition: SBLGNT
  text: καὶ ἀπαλλάξῃ τούτους, ὅσοι φόβῳ θανάτου διὰ παντὸς τοῦ ζῆν ἔνοχοι ἦσαν δουλείας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/015.yaml
  text: and free those who[a], through fear of death, were subject to slavery all their lives.
translation:
  language: ig
  text: ka ọ tọhapụkwa ndị ahụ, bụ ndị n'ihi egwu ọnwụ nọ n'ịgba ohu n'oge ndụ ha niile.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ndị e jigidere n'ịgba ohu” ma ọ bụ “ndị nọ n'agbụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπαλλάξῃ
  choice: tọpụtakwa
  rationale: “Ịtọpụ” na-egosi ịhapụ mmadụ n’ọnọdụ nke jidere ya; mgbakwunye “-kwa” na-eburu njikọ καί nke malitere ahịrịokwu ahụ.
- source_word: τούτους, ὅσοι
  choice: ndị ahụ niile ndị
  rationale: Nke a na-eburu demonstrative τούτους na ike gụnyere òtù dum nke ὅσοι, n’Igbo a na-aghọta nke ọma.
- source_word: φόβῳ θανάτου
  choice: egwu ọnwụ mere ka
  rationale: Nke a na-egosipụta na egwu ọnwụ bụ ihe kpatara ma ọ bụ ụzọ ọnọdụ ịgba ohu ahụ si dịrị, n’enweghị ikpebi karịa ihe Grik kwuru.
- source_word: διὰ παντὸς τοῦ ζῆν
  choice: n'ime ndụ ha niile
  rationale: Ọ bụ ụzọ Igbo dị mfe ma bụrụkwa nke ebumpụta ụwa isi kwuo oge dum mmadụ dị ndụ.
- source_word: ἔνοχοι ἦσαν δουλείας
  choice: ha nọrọ n'okpuru ịgba ohu
  rationale: “Ịnọ n’okpuru ịgba ohu” na-egosipụta ezigbo ọnọdụ nke ịbụ onye e ji n’agbụ, ma na-ezere ime ἔνοχος naanị okwu gbasara ikpe iwu.
theological_decisions:
- issue: Ụdị ịgba ohu nke egwu ọnwụ na-akpata
  choice: E debere ya dịka ịnọ n'okpuru ịgba ohu n'ihi egwu ọnwụ, n'ekwughị kpọmkwem na ọ bụ ịgba ohu nye ekwensu, mmehie, ma ọ bụ ọnọdụ ọzọ.
  alternative: Ịsụgharị ya kpọmkwem dịka ịgba ohu nye ekwensu, ịgba ohu nye mmehie, ma ọ bụ egwu nke ndụ mmadụ na-anwụ anwụ.
  rationale: Ọ bụ ezie na amaokwu 14 kwuru banyere ekwensu na ike ọnwụ, amaokwu 15 n'onwe ya ekwughị onye ma ọ bụ ihe nwe ndị ahụ dịka ndị ohu. Ya mere, nsụgharị ahụ na-echekwa nghọta sara mbara na esemokwu nkà mmụta okpukpe dị n'okwu ahụ.
translation_notes:
  register: Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. “Ịgba ohu” na-edobe ịdị ike nke δουλεία karịa okwu dị nro; akara ntụaka [a] dị n'isiokwu ahụ dịka achọrọ.
