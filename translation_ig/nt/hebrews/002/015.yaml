    text: A pụkwara ịsụgharị ya, “ndị e jigidere n'ịgba ohu” ma ọ bụ “ndị nọ n'agbụ.”
    reason: lexical_alternative
  revision_rationale: 'The revision preserves the Greek sequence and ambiguity: Christ frees those characterized by lifelong slavery associated with fear of death. It improves the idiomatic rendering of the demonstrative-relative construction, chooses a more precise verb for release, and retains “ịgba ohu” without importing a particular theological explanation for that bondage.'
