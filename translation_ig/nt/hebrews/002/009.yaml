  to: Ma anyị na-ahụ Jizọs, onye e mere ka ọ dị ala karịa ndị mmụọ ozi ruo nwa oge, ka e were ebube na nsọpụrụ kpube ya okpueze n’ihi ahụhụ nke ọnwụ, ka o wee, n’enweghị Chineke[a], detụ ọnwụ ire maka onye ọ bụla.
