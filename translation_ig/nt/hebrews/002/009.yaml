id: HEB.2.9
reference: Hebrews 2:9
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τὸν δὲ βραχύ τι παρ’ ἀγγέλους ἠλαττωμένον βλέπομεν Ἰησοῦν διὰ τὸ πάθημα τοῦ θανάτου δόξῃ καὶ τιμῇ ἐστεφανωμένον, ὅπως ⸀χωρὶς θεοῦ ὑπὲρ παντὸς γεύσηται θανάτου.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/009.yaml
  text: But we see Jesus[a], who was made lower than the angels for a little while, crowned with glory and honor because of the suffering of death, so that by the grace of God he might taste death for everyone.
translation:
  language: ig
  text: Ma anyị na-ahụ Jizọs, onye e mere ka ọ dị ala karịa ndị mmụọ ozi ruo nwa oge, ka e were ebube na nsọpụrụ kpube ya okpueze n’ihi ahụhụ nke ọnwụ, ka o wee, n’enweghị Chineke[a], detụ ọnwụ ire maka onye ọ bụla.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ụfọdụ akwụkwọ aka ochie na-agụ, “site n’amara Chineke,” kama “n’enweghị Chineke.”
    reason: textual_variant
lexical_decisions:
- source_word: βραχύ τι
  choice: ruo nwa oge
  rationale: A ghọtara nkebiokwu a dị ka oge dị mkpirikpi, dịka njikọ ya na Abụ Ọma 8 na ọnọdụ Jizọs n’amaokwu a si kwado.
- source_word: παρ’ ἀγγέλους
  choice: karịa ndị mmụọ ozi
  rationale: 'παρά na accusative, mgbe ọ na-eso echiche nke ime ka ihe dị ala, na-egosi ntụnyere: ‘dị ala karịa.’'
- source_word: ἠλαττωμένον
  choice: onye e mere ka ọ dị ala
  rationale: Nke a na-echekwa olu passive na echiche nke ọnọdụ e mere Jizọs ka ọ nọrọ, n’etinyeghị nkọwa ọzọ banyere ụdị iweda ala ahụ.
- source_word: διὰ τὸ πάθημα τοῦ θανάτου
  choice: n’ihi ahụhụ nke ọnwụ
  rationale: διά na accusative kacha pụta ihe dịka ihe kpatara e ji kpuo ya okpueze; ntụgharị a na-echekwakwa njikọ genitive nke ‘ahụhụ nke ọnwụ.’
- source_word: δόξῃ καὶ τιμῇ ἐστεφανωμένον
  choice: e kpuwo ya okpueze nke ebube na nsọpụrụ
  rationale: Ọ na-echekwa ihe atụ nke στεφανόω na echiche nke ịbulite Jizọs elu, n’Igbo doro anya ma dị ugwu.
- source_word: ὅπως
  choice: ka o wee
  rationale: Ọ na-egosi ebumnuche ma ọ bụ ihe si na ya pụta n’enweghị ịkpebi nke ahụ karịa ka Greek si mee.
- source_word: χωρὶς θεοῦ
  choice: n’enweghị Chineke
  rationale: Nke a na-agbaso kpọmkwem ihe SBLGNT e nyere bipụtara, ‘apart from God,’ kama iji variant χάριτι θεοῦ dochie ya na-enweghị ịkọwa ya.
- source_word: ὑπὲρ παντός
  choice: maka onye ọ bụla
  rationale: N’ọnọdụ a, παντός nwere nghọta nkesa metụtara mmadụ; ‘maka onye ọ bụla’ bụ Igbo nkịtị ma na-echekwa echiche nke ịnwụ n’ihi ha.
- source_word: γεύσηται θανάτου
  choice: detụ ọnwụ ire
  rationale: Ọ na-echekwa ihe atụ Greek nke ‘ịta/detụ ọnwụ ire’ kama ịgbanwe ya naanị ka ọ bụrụ ‘ịnwụ.’
theological_decisions:
- issue: Variant ederede dị na nkebiokwu ebumnuche
  choice: n’enweghị Chineke
  alternative: site n’amara Chineke
  rationale: Ederede SBLGNT e nyere nwere χωρὶς θεοῦ, ya bụ ‘n’enweghị Chineke’ ma ọ bụ ‘n’ebe Chineke na-anọghị.’ Variant ochie na nke a maara nke ọma bụ χάριτι θεοῦ, ‘site n’amara Chineke.’ E tinyere ihe SBLGNT bipụtara n’ahịrị isi, ma debe variant ahụ n’ala ala peeji ka a ghara izochi esemokwu ederede ma ọ bụ dozie mgbagwoju anya ya n’ụzọ ozizi.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta, dee ya. E chekwara ihe atụ ‘detụ ọnwụ ire’ na ‘kpuchie okpueze.’ E tinyere ‘ugbu a’ iji mee ka ntụgharị dị n’etiti iweda Jizọs ala ruo nwa oge na ịhụ ya ka e buliri ya elu doo anya n’Igbo, n’agbanyeghị na ọ bụghị otu mkpụrụokwu pụrụ iche na Greek.
