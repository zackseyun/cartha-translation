reference: Hebrews 6:4
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἀδύνατον γὰρ τοὺς ἅπαξ φωτισθέντας γευσαμένους τε τῆς δωρεᾶς τῆς ἐπουρανίου καὶ μετόχους γενηθέντας πνεύματος ἁγίου
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/004.yaml
  text: For it is impossible[a], in the case of those who were once enlightened, and who tasted the heavenly gift, and became partakers of the Holy Spirit[c][b],
translation:
  language: ig
  text: N’ihi na ọ gaghị ekwe omume[a] n’ebe ndị e mere ka ìhè ruo ha otu ugboro[c], ndị detụrụ onyinye nke eluigwe ire, bụrụkwa ndị ghọrọ ndị na-eketa òkè na Mmụọ Nsọ[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’ụzọ nkịtị, “ọ bụ ihe na-agaghị ekwe omume.” Ahịrịokwu a na-aga n’ihu n’amaokwu ndị na-esote.
    reason: syntax_clarification
  - marker: b
    text: A pụkwara ịsị, “ndị sonyere na Mmụọ Nsọ” ma ọ bụ “ndị ghọrọ ndị na-eketa òkè na Mmụọ Nsọ.”
    reason: lexical_alternative
  - marker: c
    text: “E mere ka ìhè ruo ha” nwere ike izo aka n’ịnata ìhè ma ọ bụ nkuzi ime mmụọ n’ozuzu; ụfọdụ na-akọwa ya kpọmkwem dị ka ntọghata ma ọ bụ ìhè e jikọtara na baptizim.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀδύνατον
  choice: ọ gaghị ekwe omume
  rationale: Na-egosipụta adjective ahụ e ji malite ahịrịokwu n’ụzọ Igbo dị ire, ma na-edowe ike nkwupụta ahụ.
- source_word: γὰρ
  choice: N’ihi na
  rationale: Na-ejikọta nkọwa a na ịdọ aka ná ntị bu ya ụzọ, n’ebughị ụzọ kpebie kpọmkwem ụdị njikọ echiche ahụ.
- source_word: ἅπαξ
  choice: otu mgbe
  rationale: Na-egosi ihe mere n’oge gara aga otu ugboro, n’etinyeghị echiche siri ike karịa nke okwu Grik kwuru.
- source_word: φωτισθέντας
  choice: ndị e mere ka ìhè ruo ha
  rationale: Na-edowe ihe atụ nke ìhè na passive nke okwu Grik, na-akọwaghị ya kpọmkwem dị ka nchegharị ma ọ bụ baptizim.
- source_word: γευσαμένους
  choice: ndị detụrụ ... ire
  rationale: Na-edowe ihe atụ nkịtị nke ‘idetụ ire’; n’Igbo ọ pụkwara ịpụta inweta ahụmahụ n’ezie, ya mere ọ naghị ekpebi ịdị omimi nke ahụmahụ ahụ.
- source_word: δωρεᾶς τῆς ἐπουρανίου
  choice: onyinye nke eluigwe
  rationale: Ọ bụ okwu Igbo doro anya nke na-edowe ebe ma ọ bụ agwa onyinye ahụ n’akọwaghị kpọmkwem ihe onyinye ahụ bụ.
- source_word: τε ... καὶ
  choice: ndị ... bụrụkwa
  rationale: Na-achịkọta nkọwa ndị ahụ n’usoro na-aga n’ihu n’Igbo dị ire.
- source_word: μετόχους
  choice: ndị ... nwere oke
  rationale: Akpaalaokwu ‘inwe oke na’ na-egosi isonye ma ọ bụ iketa òkè, ma ọ naghị amanye nkọwa ozizi pụrụ iche.
- source_word: γενηθέντας
  choice: bụrụkwa
  rationale: Na-egosi na ha banyere n’ọnọdụ ahụ, dịka aorist participle γίνομαι si kwuo.
- source_word: πνεύματος ἁγίου
  choice: Mmụọ Nsọ
  rationale: Na-ezo aka n’Onye Mmụọ Nsọ, ma dabara n’usoro okwu Igbo ‘inwe oke na’.
theological_decisions:
- issue: Ma φωτισθέντας ọ na-ezo kpọmkwem n’ịlọghachi n’ebe Chineke nọ ma ọ bụ na baptizim
  choice: ndị e mere ka ìhè ruo ha
  alternative: ndị chegharịrị; ndị e mere baptizim ma nata ìhè
  rationale: Okwu Grik na-edowe ihe atụ nke ìhè ma ọ naghị akọwa kpọmkwem ihe ahụ bụ; nsụgharị ahụ na-echekwa obosara na esemokwu ahụ.
- issue: Ma γευσαμένους ọ pụtara naanị ịnụtụ ihe ntakịrị ma ọ bụ inweta ahụmahụ zuru ezu
  choice: ndị detụrụ ... ire
  alternative: ndị nwetara ahụmahụ nke ...; ndị nwara naanị ntakịrị
  rationale: ‘Idetụ ire’ na-edowe ihe atụ ahụ ma ghara idozi esemokwu banyere ịdị omimi nke ahụmahụ ahụ.
- issue: Ma μετόχους γενηθέντας πνεύματος ἁγίου na-egosi nnabata nzọpụta zuru ezu ma ọ bụ ụdị isonye na-erughị ya
  choice: ndị ha na Mmụọ Nsọ nwere oke
  alternative: ndị sonyere na Mmụọ Nsọ; ndị ghọrọ ndị na-eketa oke na Mmụọ Nsọ
  rationale: Nke a na-egosipụta ike okwu ahụ n’enweghị ibubata mkpebi otu ụka banyere ndapụ n’okwukwe ma ọ bụ ịnọgide ruo ọgwụgwụ.
translation_notes:
  register: Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. E debere usoro participle nke Grik dịka ndepụta na-aga n’ihu, ya mere amaokwu a kwụsịrị na kọma n’ihi na echiche ahụ na-aga n’ihu na Hibru 6:5–6. Akpaalaokwu ‘ha na Mmụọ Nsọ nwere oke’ bụ nke eke n’Igbo ma na-echekwa enweghị mkpebi ozizi dị n’isi mmalite.
