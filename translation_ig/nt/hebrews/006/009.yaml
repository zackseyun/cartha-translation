  text: Πεπείσμεθα δὲ περὶ ὑμῶν, ἀγαπητοί, τὰ κρείσσονα καὶ ἐχόμενα σωτηρίας, εἰ καὶ οὕτως λαλοῦμεν·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/009.yaml
  text: But we are convinced of better things concerning you[a], beloved—things that belong to salvation—even though we speak in this way.
translation:
  language: ig
  text: Ma, ndị anyị hụrụ n’anya, anyị kwenyesiri ike na unu nwere ihe ndị ka mma, bụ ihe ndị metụtara nzọpụta, n’agbanyeghị na anyị na-ekwu otu a.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ihe ndị jikọtara na nzọpụta.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Πεπείσμεθα
  choice: anyị kwenyesiri ike
  rationale: Oge perfect na-egosi nkwenye siri ike nke nọgidere; okwu a bụ Igbo dị ugbu a ma na-egosipụta obi ike onye dere akwụkwọ ahụ.
- source_word: δὲ
  choice: Ma
  rationale: Ọ na-egosi ntụgharị dị iche na ịdọ aka ná ntị siri ike dị n’amaokwu ndị bu ụzọ.
- source_word: περὶ ὑμῶν
  choice: dị banyere unu
  rationale: Ọ na-egosipụta kpọmkwem na nkwenye ahụ metụtara ndị a na-agwa okwu.
- source_word: ἀγαπητοί
  choice: ndị anyị hụrụ n’anya
  rationale: Ọ na-echekwa ịhụnanya dị n’aha a ji kpọọ ha, n’Igbo doro anya ma dị ùgwù.
- source_word: τὰ κρείσσονα
  choice: ihe ndị ka mma
  rationale: Ọ na-echekwa ọdịdị aha nke adjective neuter plural na ike ntụnyere ya.
- source_word: ἐχόμενα σωτηρίας
  choice: ihe ndị metụtara nzọpụta
  rationale: ‘Metụtara’ na-ahapụ mmekọrịta ahụ obosara dịka Grik si dị, n’akọwaghị ya kpọmkwem dịka ihe akaebe, ihe si na nzọpụta pụta, ma ọ bụ ihe na-eduga na ya.
- source_word: εἰ καὶ
  choice: n’agbanyeghị na
  rationale: Ọ na-egosipụta concession nke ọma n’Igbo eke.
- source_word: οὕτως
  choice: otu a
  rationale: Ọ na-ezo aka n’ụzọ na ọdịnaya siri ike e si kwuo ịdọ aka ná ntị gara aga.
- source_word: λαλοῦμεν
  choice: anyị na-ekwu
  rationale: Ọ bụ nsụgharị dị mfe ma bụrụkwa nke eke maka present indicative n’ebe a.
theological_decisions:
- issue: Mmekọrịta ἐχόμενα na σωτηρίας n’ime akụkụ ịdọ aka ná ntị
  choice: ihe ndị metụtara nzọpụta
  alternative: ihe ndị na-eso nzọpụta
  rationale: Nsụgharị bụ isi na-egosi na ihe ndị ahụ nwere njikọ kwesịrị ekwesị na nzọpụta, ma ọ naghị ekpebi ma ha bụ ihe akaebe ya, ihe na-eso ya, ma ọ bụ ihe si na ya pụta; nke a na-echekwa esemokwu nkà mmụta okpukpe dị n’amaokwu ahụ.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E bugara nkebi concession n’ihu ka ahịrịokwu ahụ na-asọ nke ọma n’Igbo, ebe a ka chekwara ọdịiche na ịdọ aka ná ntị gara aga. Akara [a] dị n’isiokwu ederede.
