id: HEB.6.17
reference: Hebrews 6:17
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐν ᾧ περισσότερον βουλόμενος ὁ θεὸς ἐπιδεῖξαι τοῖς κληρονόμοις τῆς ἐπαγγελίας τὸ ἀμετάθετον τῆς βουλῆς αὐτοῦ ἐμεσίτευσεν ὅρκῳ,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/017.yaml
  text: So when God desired to show more clearly to the heirs of the promise the unchangeable character of his purpose[a], he guaranteed it with an oath[b],
translation:
  language: ig
  text: N’ihi nke a, Chineke, ebe ọ chọrọ igosikwu ndị ga-eketa nkwa ahụ na nzube ya enweghị mgbanwe[a], ji iyi mesie nke a ike[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ịdị na-adịghị agbanwe agbanwe nke nzube ya.”
    reason: lexical_alternative
  - marker: b
    text: N’ụzọ rapara n’okwu Grik karị, “o ji iyi tinye aka n’etiti.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ᾧ
  choice: N’ihi ya, mgbe
  rationale: Ọ na-ejikọta amaokwu a na ihe e kwuru tupu ya banyere nkwa Chineke na iyi ya; nsụgharị a na-egosi ma njikọ echiche ma ọnọdụ oge n’Igbo doro anya.
- source_word: περισσότερον
  choice: nke ọma karị
  rationale: Ọ na-eme ka ἐπιδεῖξαι sie ike, ya bụ na Chineke chọrọ ime ka ihe ahụ pụta ìhè karịa.
- source_word: βουλόμενος
  choice: chọrọ
  rationale: N’ebe a, okwu ahụ na-egosi ọchịchọ nwere nzube na mkpebi siri ike, ọ bụghị nanị ihe Chineke tụrụ anya ya.
- source_word: ἐπιδεῖξαι
  choice: igosi
  rationale: Nke a bụ okwu Igbo dị mfe ma kpọmkwem maka ime ka ihe pụta ìhè ma ọ bụ igosi ya nke ọma.
- source_word: τοῖς κληρονόμοις τῆς ἐπαγγελίας
  choice: ndị ga-eketa nkwa ahụ
  rationale: Ọ na-echekwa ihe atụ nke ihe nketa na njikọ ya na nkwa ahụ, ma na-ada ka Igbo a na-asụ taa.
- source_word: τὸ ἀμετάθετον
  choice: apụghị ịgbanwe
  rationale: Ọ na-egosi kpọmkwem na a pụghị ịtụgharị ma ọ bụ gbanwee nzube ahụ, n’enweghị iji okwu nkà mmụta okpukpe siri ike.
- source_word: τῆς βουλῆς αὐτοῦ
  choice: nzube ya
  rationale: βουλή n’ebe a bụ nzube ma ọ bụ mkpebi Chineke zubere nke ọma; “nzube ya” bụ okwu doro anya ma dị arọ n’Igbo.
- source_word: ἐμεσίτευσεν
  choice: mee ka o guzosie ike
  rationale: N’ọnọdụ a, ngwaa ahụ na-egosi na Chineke nyere ndị ahụ mmesi obi ike site n’iyi; nsụgharị a na-ekwupụta ọrụ ngwaa ahụ n’Igbo nkịtị.
- source_word: ὅρκῳ
  choice: ji iyi
  rationale: Dative ahụ na-egosi ụzọ Chineke si mee ka nzube ahụ guzosie ike—site n’iyi.
theological_decisions:
- issue: Igosipụta na nzube Chineke enweghị ike ịgbanwe n’etinyeghị echiche nkà ihe ọmụma e mepụtara mgbe e mesịrị
  choice: nzube ya apụghị ịgbanwe
  alternative: mkpebi ya adịghị agbanwe agbanwe
  rationale: Nhọrọ ahụ na-echekwa ike okwu Grik ahụ banyere ịdịgide nke nzube Chineke, ma ọ dị mfe nghọta ma ghara ibubata okwu nkà mmụta okpukpe na-adịghị mkpa.
- issue: Ihe ἐμεσίτευσεν pụtara n’ihe gbasara iyi Chineke
  choice: o ji iyi mee ka o guzosie ike
  alternative: o tinyere iyi n’etiti
  rationale: Ihe gbara amaokwu ahụ gburugburu bụ mmesi obi ike Chineke nyere ndị ga-eketa nkwa ahụ. Nhọrọ bụ isi na-egosi ọrụ iyi ahụ nke ọma, ebe ntụgharị nke na-arapara n’ụdị okwu Grik nwere ike ịda ọchịchịrị n’Igbo.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A hapụrụ ihe atụ nke ndị nketa na nkwa ahụ, ma zere okwu ochie ma ọ bụ okwu nkà mmụta okpukpe siri ike. Akara ndetu [a] na [b] dị n’ebe okwu ndị ha na-akọwa nọ.
