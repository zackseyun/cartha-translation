  text: καὶ τοῦτο ⸀ποιήσομεν ἐάνπερ ἐπιτρέπῃ ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/003.yaml
  text: And this we will do[a], if indeed God permits.
translation:
  language: ig
  text: Anyị ga-emekwa nke a[a], ma ọ bụrụ n’ezie na Chineke ekwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “Anyị ga-emekwa nke a, ma Chineke kwe.” Mkpụrụokwu Grik a sụgharịrị “n’ezie” na-emesi ọnọdụ ahụ ike.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: ga-emekwa
  rationale: E tinyere njikọ καὶ n’ụdị mgbakwunye “-kwa” n’ime ngwaa, nke na-ejikọta okwu a na ndụmọdụ dị n’amaokwu ndị bu ya ụzọ n’ụzọ Igbo kwụ ọtọ.
- source_word: τοῦτο
  choice: nke a
  rationale: Nnọchiaha ngosi dị n’otu na-ezo aka n’ihe ma ọ bụ nzọụkwụ a kọwara ozugbo tupu ya; “nke a” na-echekwa otu ọnụọgụ ahụ.
- source_word: ποιήσομεν
  choice: anyị ga-eme
  rationale: Nke a na-egosipụta ọdịnihu nke ποιέω n’ụzọ doro anya, n’etinyeghị nkọwa sara mbara dịka “anyị ga-aga n’ihu” nke okwu Grik n’onwe ya ekwughị kpọmkwem.
- source_word: ἐάνπερ
  choice: ma ọ bụrụ n’ezie
  rationale: “Ma ọ bụrụ” na-egosi ọnọdụ, ebe “n’ezie” na-echekwa nkwusi ike nke -περ n’etinyeghị obi abụọ karịrị nke isi mmalite ahụ.
- source_word: ἐπιτρέπῃ
  choice: ekwe
  rationale: “Ikwe” bụ okwu Igbo dị ndụ ma dị ebube nke pụtara inye ohere ma ọ bụ ikike, kwekọrọ na ἐπιτρέπω.
- source_word: ὁ θεός
  choice: Chineke
  rationale: A sụgharịrị aha onye na-eme ihe ahụ n’ụdị Igbo a na-ejikarị akpọ God, n’enweghị mkpa igosipụta isiokwu Grik ahụ iche.
theological_decisions:
- issue: Ahịrị ọnọdụ gbasara nkwenye Chineke
  choice: 'E chekwara ebumnobi onye dere akwụkwọ ahụ ime nke a, ma dobe ya n’okpuru nkwenye Chineke: “ma ọ bụrụ n’ezie na Chineke ekwe.”'
  alternative: “Ọ bụrụ na Chineke chọrọ” ma ọ bụ nkọwa na-ekwu na Chineke kpebisiri ihe niile kpọmkwem.
  rationale: Grik ahụ na-ekwu maka ọnọdụ n’ezie ma na-emesi ya ike. Nsụgharị a anaghị eme ka ọ bụrụ naanị akpaala okwu, ọ naghịkwa etinye ozizi banyere ọchịchị Chineke ma ọ bụ ihe kpatara omume mmadụ nke okwu ahụ ekwughị.
translation_notes:
  register: Standard Igbo dị ugbu a, dị mfe nghọta ma nwee ugwu. “Ga-emekwa” na-ejikọta καὶ na ngwaa n’ụzọ e ji ekwu Igbo nke ọma; a hapụrụ ọnọdụ ahụ na nkwusi ike ya n’enweghị ịgbatị nkà mmụta okpukpe.
