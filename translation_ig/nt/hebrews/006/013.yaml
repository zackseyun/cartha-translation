source:
  edition: SBLGNT
  text: Τῷ γὰρ Ἀβραὰμ ἐπαγγειλάμενος ὁ θεός, ἐπεὶ κατ’ οὐδενὸς εἶχεν μείζονος ὀμόσαι, ὤμοσεν καθ’ ἑαυτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/013.yaml
  text: For when God made the promise to Abraham[a], since he could swear by no one greater, he swore by himself[b],
translation:
  language: ig
  text: N’ihi na, mgbe Chineke kwere Ebreham nkwa[a], ebe ọ bụ na o nweghị onye ka ya ukwuu ọ ga-eji ṅụọ iyi, o ji onwe ya ṅụọ iyi[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “mgbe Chineke kwere Ebreham nkwa.”
    reason: lexical_alternative
  - marker: b
    text: N’ụzọ nkịtị, “ebe ọ bụ na o nweghị onye ka ya ukwuu onye ọ pụrụ iji ṅụọ iyi.”
    reason: previous_rendering
lexical_decisions:
- source_word: γὰρ
  choice: N’ihi na
  rationale: Ọ na-egosi na amaokwu a na-akọwa ma na-akwado arụmụka dị n’amaokwu ndị bu ya ụzọ.
- source_word: Τῷ ... Ἀβραὰμ ἐπαγγειλάμενος
  choice: mgbe Chineke kwere Ebreham nkwa
  rationale: Ụdị a na-egosi nke ọma na Ebreham bụ onye natara nkwa ahụ, ma na-ada ka Igbo nkịtị ma doo anya.
- source_word: ἐπεὶ
  choice: ebe ọ bụ na
  rationale: N'ebe a okwu ahụ na-ewebata ihe kpatara Chineke ji jiri onwe ya ṅụọ iyi.
- source_word: κατ’ οὐδενὸς ... μείζονος ὀμόσαι
  choice: o nweghị onye ka ya ukwuu ọ ga-eji ṅụọ iyi
  rationale: N'agbanyeghị na οὐδενός nwere ike izo aka n'ihe ma ọ bụ n'onye, ọnọdụ ịṅụ iyi na-akwado onye ka ukwuu; nsụgharị a na-echekwa echiche nke enweghị onye dị elu karịa Chineke.
- source_word: ὤμοσεν καθ’ ἑαυτοῦ
  choice: o ji onwe ya ṅụọ iyi
  rationale: N'okwu metụtara iyi, κατά na nnọchiaha nlaghachi pụtara iji onwe onye dị ka onye a na-akpọku n'iyi ahụ.
theological_decisions:
- issue: Ụdị iyi Chineke ṅụrụ
  choice: Chineke ji onwe ya ṅụọ iyi n’ihi na o nweghị onye ka ya ukwuu ọ ga-eji ṅụọ iyi.
  alternative: Chineke ṅụrụ iyi n’aha onwe ya.
  rationale: Nhọrọ a na-echekwa ihe odide ahụ kwuru banyere ịdị ukwuu pụrụ iche nke Chineke, n’etinyeghị nkọwa ozizi ọzọ na-adịghị n’amaokwu ahụ.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. E debere njikọ nkọwa nke γάρ na ihe kpatara iyi ahụ; e jighị okwu ụka pụrụ iche ma ọ bụ nkọwa otu okpukpe.
