revisions:
- from: Anyị na-achọsikwa ike ka onye ọ bụla n’ime unu gosi otu ịdị uchu ahụ, ka unu wee nwee ntụkwasị obi zuru ezu n’olileanya ruo ọgwụgwụ[a][b].
  to: anyị na-achọsi ike ka onye ọ bụla n’ime unu gosi otu ịdị uchu ahụ, ka onye ọ bụla wee nwee ntụkwasị obi zuru ezu n’olileanya ruo ọgwụgwụ[a][b].
  rationale: A gbanwere naanị akụkụ “ka unu wee nwee” ka ọ bụrụ “ka onye ọ bụla wee nwee,” iji mee ka okwu Igbo ahụ soro ike nkesa dị na ἕκαστον ὑμῶν. E debere usoro ebumnuche ahụ, nke bụ ụzọ Igbo sitere n’okike isi gosipụta mmekọrịta πρὸς na “ntụkwasị obi zuru ezu n’olileanya,” ma e mechighị esemokwu gbasara ma ọ bụ ọnọdụ obi ike nke onye kwere ekwe ma ọ bụ nkwụsi ike nke olileanya ka okwu ahụ na-atụ aka na ya.
