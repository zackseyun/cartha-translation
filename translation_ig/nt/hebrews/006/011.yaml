review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders the principal terms, including the distributive force of ἕκαστον ὑμῶν, “diligence,” and the temporal phrase “until the end.” However, the purpose construction makes the resulting assurance apply to plural “unu,” after the Greek has emphasized each individual. Repeating “onye ọ bụla” makes the Igbo application correspond more closely to the source without resolving the debated nuance of πρὸς.
  naturalness: The wording is clear and suitably formal in modern Standard Igbo. The revised sentence improves agreement and flow by retaining the individual subject through the purpose clause.
  terminology: “Ịdị uchu,” “ntụkwasị obi zuru ezu,” “olileanya,” and “ruo ọgwụgwụ” are appropriate and theologically non-sectarian. The footnotes preserve legitimate lexical alternatives without imposing a doctrinal interpretation.
  issues:
  - severity: medium
    issue: Number/reference mismatch in the purpose clause
    rationale: “Ka unu wee nwee” shifts from “each one of you” to a collective plural outcome. Although not impossible idiomatically, it weakens the explicitly distributive emphasis of ἕκαστον ὑμῶν. Repeating “onye ọ bụla” retains that emphasis.
  revised_text: anyị na-achọsi ike ka onye ọ bụla n’ime unu gosi otu ịdị uchu ahụ, ka onye ọ bụla wee nwee ntụkwasị obi zuru ezu n’olileanya ruo ọgwụgwụ[a][b].
  revised_footnotes:
