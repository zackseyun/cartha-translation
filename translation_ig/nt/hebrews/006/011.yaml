language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐπιθυμοῦμεν δὲ ἕκαστον ὑμῶν τὴν αὐτὴν ἐνδείκνυσθαι σπουδὴν πρὸς τὴν πληροφορίαν τῆς ἐλπίδος ἄχρι τέλους,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/011.yaml
  text: And we desire each one of you to show the same diligence for the full assurance of hope until the end[b][a],
translation:
  language: ig
  text: anyị na-achọsi ike ka onye ọ bụla n’ime unu gosi otu ịdị uchu ahụ, ka onye ọ bụla wee nwee ntụkwasị obi zuru ezu n’olileanya ruo ọgwụgwụ[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “obi ike zuru oke n’olileanya.” Okwu Grik ahụ nwere ike ịpụta nkwenye ma ọ bụ ntụkwasị obi zuru ezu.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, “ruo na njedebe.” Nkebiokwu a na-emesi nnọgidesi ike ruo mgbe ihe ahụ zuru ezu ike.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιθυμοῦμεν
  choice: anyị na-achọsi ike
  rationale: Nke a na-egosipụta ọchịchọ siri ike nke onye na-adụ ha ọdụ, ma ọ naghị ada ka agụụ na-adịghị mma.
- source_word: δὲ
  choice: kwa (n’ime “na-achọsikwa”)
  rationale: Ọ na-egosi njikọ na ntụgharị dị nro site n’ihe e kwuru tupu nke a, kama igosi nnukwu esemokwu.
- source_word: ἕκαστον ὑμῶν
  choice: onye ọ bụla n’ime unu
  rationale: 'Ọ na-edobe ike nkesa nke okwu Grik ahụ: ndụmọdụ a metụtara onye ọ bụla n’otu n’otu.'
- source_word: τὴν αὐτὴν
  choice: otu ... ahụ
  rationale: Ọ na-ezo aka n’otu ịdị uchu ahụ e kwuru ma ọ bụ gosipụta n’amaokwu ndị bu ụzọ.
- source_word: ἐνδείκνυσθαι
  choice: gosi
  rationale: “Gosi” bụ okwu Igbo doro anya ma dịkwa mma maka igosipụta àgwà n’omume.
- source_word: σπουδὴν
  choice: ịdị uchu
  rationale: Ọ na-egosipụta mgbalị siri ike, nlezianya, na nnọgidesi ike, ọ bụghị naanị mmetụta ịnụ ọkụ n’obi.
- source_word: πρὸς
  choice: ka ... wee nwee
  rationale: Nhazi a na-egosipụta ebumnuche ma ọ bụ ihe ịdị uchu ahụ na-eduga na ya n’Igbo sitere n’okike.
- source_word: πληροφορίαν
  choice: ntụkwasị obi zuru ezu
  rationale: Ọ na-eburu echiche nke njupụta nke obi ike ma ọ bụ nkwenye siri ike, n’enweghị imechi okwu ahụ n’otu nkọwa ozizi.
- source_word: ἐλπίδος
  choice: n’olileanya
  rationale: “Olileanya” bụ okwu Igbo kwesịrị ekwesị maka atụmanya dabeere ná nkwa, ọ bụghị naanị ọchịchọ efu.
- source_word: ἄχρι τέλους
  choice: ruo ọgwụgwụ
  rationale: Ọ na-edobe echiche nke ịga n’ihu ruo mgbe ihe ahụ ruru njedebe ya.
theological_decisions:
- issue: Mmekọrịta dị n’etiti “ntụkwasị obi zuru ezu” na olileanya, tinyere nnọgidesi ike
  choice: A sụgharịrị ya dị ka “ntụkwasị obi zuru ezu n’olileanya ruo ọgwụgwụ,” nke na-ahapụ ohere maka obi ike nke onye kwere ekwe na nkwụsi ike nke olileanya ya.
  alternative: A pụrụ ịsụgharị ya dị ka “izu oke nke olileanya” ma ọ bụ “mmezu zuru ezu nke ihe a na-ele anya ya.”
  rationale: Okwu Grik ahụ nwere ike ịgụnye ma nkwenye zuru ezu dị n’ime mmadụ ma ịdị n’aka nke olileanya dabeere ná nkwa Chineke. Nsụgharị ahụ anaghị amanye otu usoro ozizi n’elu ihe odide ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta mee ihe. “Ịdị uchu” na “ntụkwasị obi zuru ezu n’olileanya” na-edobe ụda ndụmọdụ nke onye ọzụzụ ime mmụọ, ma zere okwu pụrụ iche nke otu ụka.
