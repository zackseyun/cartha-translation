  text: βαπτισμῶν ⸀διδαχὴν ἐπιθέσεώς τε χειρῶν, ἀναστάσεώς ⸀τε νεκρῶν καὶ κρίματος αἰωνίου.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/002.yaml
  text: instruction about washings[a], the laying on of hands, the resurrection of the dead, and eternal judgment.
translation:
  language: ig
  text: nkuzi banyere omume ịsa ahụ dị iche iche nke okpukpe, ịbikwasa aka, mbilite n’ọnwụ nke ndị nwụrụ anwụ, na ikpe ebighị ebi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βαπτισμῶν
  choice: ịsa ahụ n'ụzọ okpukpe
  rationale: Ụdị ọtụtụ nke okwu Grik a nwere ike ịpụta ịsa ahụ dị iche iche a na-eme dịka usoro okpukpe, ọ bụghị naanị baptizim Ndị Kraịst. Nhọrọ a na-edobe ụdị ọtụtụ na obosara ihe okwu ahụ nwere ike ịpụta.
- source_word: διδαχὴν
  choice: nkuzi
  rationale: “Nkuzi” bụ okwu Igbo doro anya ma bụrụkwa nke a na-ejikarị eme ihe maka ihe a na-akụzi; ebe a ọ na-achịkwa ihe ndị sochirinụ na ndepụta ahụ.
- source_word: ἐπιθέσεώς τε χειρῶν
  choice: ibikwasị aka n’ahụ mmadụ
  rationale: Nke a bụ ụzọ Igbo eke si kọwaa omume ibikwasị mmadụ aka, ma na-ezere ịhapụ onye a na-ebikwasị aka n’amaghị ama.
- source_word: ἀναστάσεώς τε νεκρῶν
  choice: mbilite n’ọnwụ nke ndị nwụrụ anwụ
  rationale: Nhọrọ a na-egosipụta kpọmkwem echiche nke ndị nwụrụ anwụ isi n’ọnwụ bilie, ma na-edobe mkpokọta nke νεκρῶν.
- source_word: κρίματος αἰωνίου
  choice: ikpe ebighị ebi
  rationale: “Ikpe” na-edobe κρίμα n’enweghị ime ka ọ bụrụ naanị amamikpe; “ebighị ebi” na-egosipụta αἰώνιος n’ọnọdụ a.
- source_word: τε ... τε καὶ
  choice: '..., ..., na ...'
  rationale: Njikọ ndepụta nkịtị n’Igbo na-enye otu nhazi ahụ n'ụzọ dị mfe ma dịkwa eke.
theological_decisions:
- issue: Ihe βαπτισμῶν pụtara n’ime ndepụta nkuzi ndị bụ ntọala
  choice: ịsa ahụ n'ụzọ okpukpe
  alternative: baptizim dị iche iche
  rationale: Ụdị ọtụtụ na ojiji okwu a n’asụsụ Grik na-ekwe ka ọ kọwaa ịsa ahụ emume okpukpe n’ozuzu. Nke a na-ezere ime ka amaokwu ahụ bụrụ kpọmkwem banyere baptizim Ndị Kraịst, ma ihe ọzọ nwere ike ịpụta ka edepụtara n’ala peeji.
- issue: Oke echiche κρίματος αἰωνίου
  choice: ikpe ebighị ebi
  alternative: amamikpe ebighị ebi
  rationale: Okwu Grik ahụ bụ “ikpe,” ọ bụghị kpọmkwem “amamikpe.” Ya mere, nsụgharị ahụ anaghị ekpebi ihe ga-esi n’ikpe ahụ pụta karịa ihe ederede kwuru.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji “ịsa ahụ n'ụzọ okpukpe” mee ka echiche emume dị na βαπτισμῶν pụta ìhè, ebe ndetu ala peeji na-edobe “baptizim” dịka nhọrọ ọzọ.
