id: HEB.6.10
reference: Hebrews 6:10
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οὐ γὰρ ἄδικος ὁ θεὸς ἐπιλαθέσθαι τοῦ ἔργου ὑμῶν ⸀καὶ τῆς ἀγάπης ἧς ἐνεδείξασθε εἰς τὸ ὄνομα αὐτοῦ, διακονήσαντες τοῖς ἁγίοις καὶ διακονοῦντες.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/010.yaml
  text: For God is not unjust so as to forget your work and the love that you showed for his name in having served the saints and in continuing to serve them[a][b][c].
translation:
  language: ig
  text: N’ihi na Chineke abụghị onye na-ezighị ezi nke ga-echefu ọrụ unu na ịhụnanya unu gosiri maka aha ya[a], site n’ijere ndị nsọ[b] ozi na n’ịnọgide na-ejere ha ozi[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, ‘n’ihi aha ya.’
    reason: lexical_alternative
  - marker: b
    text: Ya bụ, ndị ha na ha kwere ekwe, ndị Chineke doro nsọ; ebe a, ‘ndị nsọ’ na-ekwu maka ndị Chineke, ọ bụghị otu òtù e mechara nye ọkwa pụrụ iche.
    reason: cultural_note
  - marker: c
    text: A pụkwara ịsụ ya, ‘mgbe unu jere ndị nsọ ozi ma ka na-ejere ha ozi.’
    reason: previous_rendering
lexical_decisions:
- source_word: ἄδικος
  choice: onye na-ezighị ezi
  rationale: Nke a na-egosi onye na-adịghị eme ihe n’ụzọ ziri ezi ma ọ bụ n’ụzọ kwekọrọ n’ikpe ziri ezi. Ọ bụ okwu Igbo doro anya, nke na-ezere ịgbakwunye echiche na-adịghị n’amaokwu ahụ.
- source_word: ἐπιλαθέσθαι
  choice: ga-echefu
  rationale: A họọrọ ihe okwu ahụ pụtara kpọmkwem, ‘ichefu,’ ebe ihe gbara ya gburugburu na-egosi na Chineke agaghị eleghara ọrụ ha anya.
- source_word: τοῦ ἔργου ὑμῶν
  choice: ọrụ unu
  rationale: ‘Ọrụ’ na-edobe otu mkpokọta nke ἔργον ma na-adaba nke ọma na ozi a kọwara n’ikpeazụ.
- source_word: τῆς ἀγάπης
  choice: ịhụnanya
  rationale: Nke a bụ okwu Igbo nkịtị ma sie ike maka ἀγάπη, ebe amaokwu ahụ na-ekwu maka ịhụnanya e mere ka ọ pụta ìhè n’omume.
- source_word: ἐνεδείξασθε
  choice: unu gosiri
  rationale: Ọ na-enye echiche nke ime ka ihe pụta ìhè site n’ihe mmadụ mere.
- source_word: εἰς τὸ ὄνομα αὐτοῦ
  choice: maka aha ya
  rationale: ‘Maka’ na-anabata echiche nke ntụziaka, nkwanye ùgwù, na ime ihe n’ihi aha Chineke, ma na-edobe ‘aha’ kama ịkọwa ya n’ụzọ sara mbara.
- source_word: διακονήσαντες
  choice: mgbe unu jere ... ozi
  rationale: Oge gara aga nke ‘jere’ na-egosi ozi ha rụrụla, dị iche na ozi ha ka na-arụ ugbu a.
- source_word: τοῖς ἁγίοις
  choice: ndị nsọ
  rationale: Nke a na-edobe aha Agba Ọhụrụ na-eji maka ndị Chineke doro nsọ, n’agbanyeghị na a kọwara ya n’okpuru peeji ka a ghara ịghọta ya dịka naanị otu òtù e nyere ọkwa mgbe e mesịrị.
- source_word: διακονοῦντες
  choice: ka na-ejere ha ozi
  rationale: ‘Ka na-’ na-eme ka ọdịiche dị n’etiti ozi gara aga na ozi na-aga n’ihu doo anya n’Igbo nkịtị.
theological_decisions:
- issue: Ma amaokwu a na-akụzi na ọrụ mmadụ na-enweta nzọpụta dịka ụgwọ, ka ọ bụ na Chineke ji ikwesị ntụkwasị obi echeta ọrụ ndị kwere ekwe
  choice: E debere nkwupụta ahụ na Chineke abụghị onye na-ezighị ezi nke ga-echefu ọrụ na ịhụnanya ha.
  alternative: Ịkọwa ya n’ụzọ siri ike dịka Chineke ji ụgwọ ịkwụ mmadụ ụgwọ ọrụ n’ihi na ọrụ ya n’onwe ya ritere nzọpụta.
  rationale: Grik na-ekwu maka ikpe ziri ezi nke Chineke na icheta ọrụ ha, ma ọ naghị ekwu kpọmkwem na ọrụ ndị ahụ zụtara ma ọ bụ ritere nzọpụta. Nsụgharị ahụ anaghị etinye nkwubi okwu ahụ n’amaokwu.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke nwere ugwu ma dị mfe nghọta. A hapụrụ usoro ‘ọrụ ... na ịhụnanya’ yana ọdịiche dị n’etiti ozi ha rụrụla na nke ha ka na-arụ. Akara nkọwa [a], [b], na [c] niile dị n’ederede bụ isi.
