revisions:
- from: N’ihi na Chineke abụghị onye na-ezighị ezi nke ga-echefu ọrụ unu na ịhụnanya unu gosiri maka aha ya[a], mgbe unu jere ndị nsọ[b] ozi ma ka na-ejere ha ozi[c].
  to: N’ihi na Chineke abụghị onye na-ezighị ezi nke ga-echefu ọrụ unu na ịhụnanya unu gosiri maka aha ya[a], site n’ijere ndị nsọ[b] ozi na n’ịnọgide na-ejere ha ozi[c].
  rationale: The final clause is revised from a temporal “mgbe” construction to “site n’...” so that it expresses the service as the concrete demonstration of love, as in the Greek participial construction. “N’ịnọgide” explicitly retains the ongoing force of διακονοῦντες. Footnote c preserves the former temporal-style rendering as an alternative, and footnote b is made more exact.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T21:28:26Z'
review_pass:
  verdict: revise
  source_fidelity: The core sense is preserved, including God's justice, the believers' work and love, service to the saints, and the past/ongoing contrast. However, “mgbe” (“when”) makes the final participial clause primarily temporal, whereas the Greek participles explain how the love was shown. An instrumental/explanatory construction better represents the source.
  naturalness: The revised wording is clear, contemporary Standard Igbo and avoids an unnecessarily temporal reading. “N’ihi na” is retained as a natural causal opening.
  terminology: “onye na-ezighị ezi,” “ọrụ,” “ịhụnanya,” “aha ya,” “ndị nsọ,” and “ijere ... ozi” are appropriate. The saints note is refined so that it explains the New Testament usage without implying a later canonized or specially ranked group.
  issues:
  - severity: medium
    issue: The phrase “mgbe unu jere ndị nsọ ozi ma ka na-ejere ha ozi” is temporal.
    rationale: Greek διακονήσαντες ... καὶ διακονοῦντες functions as the means/evidence by which their love for God's name was displayed, while retaining the aorist/present contrast. “Site n’...” represents this relation more faithfully than “mgbe” (“when”).
  - severity: low
    issue: Footnote b's wording about a later special status is imprecise.
    rationale: The note should state plainly that “ndị nsọ” means God's holy people/fellow believers here, rather than a group later officially declared holy.
  revised_text: N’ihi na Chineke abụghị onye na-ezighị ezi nke ga-echefu ọrụ unu na ịhụnanya unu gosiri maka aha ya[a], site n’ijere ndị nsọ[b] ozi na n’ịnọgide na-ejere ha ozi[c].
