id: HEB.6.8
reference: Hebrews 6:8
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐκφέρουσα δὲ ἀκάνθας καὶ τριβόλους ἀδόκιμος καὶ κατάρας ἐγγύς, ἧς τὸ τέλος εἰς καῦσιν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/008.yaml
  text: But if it bears thorns and thistles[a], it is worthless and near to being cursed, and its end is for burning.
translation:
  language: ig
  text: Ma ọ bụrụ na ọ na-amịpụta ogwu na uke, ọ baghị uru[a], ọ dịkwa nso ka a bụrụ ya ọnụ; ọgwụgwụ ya bụ ka a gbaa ya ọkụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “a jụrụ ya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκφέρουσα
  choice: na-amịpụta
  rationale: Okwu a na-aga n’ihu na-ekwu banyere ala e kwuru okwu ya n’amaokwu bu ụzọ; “na-amịpụta” bụ okwu Igbo doro anya maka ihe ala na-ewepụta.
- source_word: ἀκάνθας καὶ τριβόλους
  choice: ogwu na uke
  rationale: Nke a na-echekwa ụzọ ihe ọkụkụ abụọ na-adụ mmadụ n’ahụ si pụta n’ihe atụ ọrụ ugbo ahụ.
- source_word: ἀδόκιμος
  choice: ọ baghị uru
  rationale: N’ebe a, okwu ahụ na-akọwa ala nke na-emezughị ihe a tụrụ anya ya, ya mere “ọ baghị uru” dabara n’ihe atụ ọrụ ugbo ahụ; e debere “a jụrụ ya” n’ala peeji dịka ụzọ ọzọ.
- source_word: κατάρας ἐγγύς
  choice: ọ dịkwa nso ka a bụrụ ya ọnụ
  rationale: Nke a bụ Igbo e ji eme ihe ugbu a nke na-egosi na ọbụbụ ọnụ dị nso, n’emeghị ka o doo anya na e meela ya eme.
- source_word: ἧς τὸ τέλος εἰς καῦσιν
  choice: ọgwụgwụ ya bụ ka a gbaa ya ọkụ
  rationale: Nke a na-echekwa ma “ọgwụgwụ” ma onyinyo ịgba ọkụ, n’agbakwụnyeghị nkọwa pụrụ iche banyere ikpe ikpeazụ.
theological_decisions:
- issue: Ma a ga-akpọghachi “ala” nke amaokwu bu ụzọ kpọmkwem
  choice: Jiri nnọchiaha “ọ” gaa n’ihu n’ihe atụ ahụ
  alternative: Ma ala nke na-amịpụta ogwu na uke...
  rationale: Ụdị nwanyị nke participle Grik na-ezo aka n’ala e kwuru okwu ya na amaokwu 7. Igbo nwere ike iji “ọ” gaa n’ihu n’enweghị ịtinye aha a na-ekwughachighị na Grik.
- issue: Ike ihe ἀδόκιμος pụtara
  choice: ọ baghị uru
  alternative: a jụrụ ya
  rationale: “Ọ baghị uru” kwekọrọ n’ala na-adịghị amị ihe bara uru, ebe ala peeji na-echekwa echiche ọzọ nke ịbụ ihe a jụrụ.
- issue: Ma a ga-akọwa εἰς καῦσιν ozugbo dịka ikpe ikpeazụ
  choice: ka a gbaa ya ọkụ
  alternative: maka ikpe ọkụ
  rationale: Grik ahụ na-ahapụ onyinyo ọrụ ugbo ahụ n’enweghị ịkpọ kpọmkwem ihe ọkụ ahụ na-anọchi anya ya; nsụgharị ahụ na-echekwa nghọta na esemokwu nkà mmụta okpukpe ahụ.
translation_notes:
  register: Asụsụ Igbo izugbe, nke oge a, dị ùgwù ma dị mfe nghọta. E ji okwu ọrụ ugbo ndị a maara nke ọma mee ihe, a hapụkwara onyinyo na mgbagwoju anya nke Grik ka ha dị.
