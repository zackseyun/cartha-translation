  text: καὶ οὕτως μακροθυμήσας ἐπέτυχεν τῆς ἐπαγγελίας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/015.yaml
  text: And so[a], after waiting patiently, he obtained the promise.
translation:
  language: ig
  text: N’ụzọ dị otú a, mgbe o jiri ndidi chere, o nwetara nkwa ahụ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “o nwetara ihe e kwere ná nkwa.” N’okwu Grik, ihe e kwuru n’ụzọ kwụ ọtọ karị bụ, “o nwetara nkwa ahụ.”
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ οὕτως
  choice: Ya mere
  rationale: N'ọnọdụ a, njikọ okwu abụọ ahụ na-ejikọta ihe mere Ebreham na ihe e kwuru n'amaokwu bu ụzọ, na-egosikwa nsonaazụ ya n'Igbo dị mfe.
- source_word: μακροθυμήσας
  choice: mgbe o ji ndidi chere ogologo oge
  rationale: Nke a na-egosipụta ntachi obi na ichere ruo oge dị anya, ma na-enye participle aorist ahụ nghọta nke ọnọdụ ma ọ bụ usoro gara aga.
- source_word: ἐπέτυχεν
  choice: o nwetara
  rationale: ‘Nwetara’ na-egosipụta iru ma ọ bụ inweta ihe a na-achọ, n'ebughị ụzọ kọwaa ya dị ka mmezu zuru ezu.
- source_word: τῆς ἐπαγγελίας
  choice: nkwa ahụ
  rationale: Nke a na-edobe aha ahụ dịka ‘nkwa’ ma na-ezo aka na nkwa Chineke a kpọtụrụ aha n'akụkụ amaokwu a.
theological_decisions:
- issue: Ma okwu ἐπέτυχεν τῆς ἐπαγγελίας ọ pụtara na Ebreham natara mmezu nkwa ahụ n'uju, ka ọ bụ na o nwetara nkwa ahụ.
  choice: o nwetara nkwa ahụ
  alternative: o nwetara ihe e kwere ná nkwa
  rationale: Nsụgharị ahọrọla na-edobe okwu Grik ahụ n'ụzọ na-adịghị ekpebi ma ọ bụ mmezu zuru ezu, ma si otú ahụ chekwaa esemokwu nke echiche dị n'okwu ahụ.
translation_notes:
  register: Standard Igbo dị ugbu a, nke dị ugwu ma doo ndị nkịtị anya. E ji ‘chere ogologo oge’ mee ka echiche nke μακροθυμέω pụta ìhè n'ụzọ ebumpụta ụwa.
