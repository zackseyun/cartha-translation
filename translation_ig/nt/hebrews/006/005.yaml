  text: ma detụtakwa okwu ọma nke Chineke ire, nakwa ike nke oge na-abịa[b][a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “oge ahụ nke ga-abịa.”
    reason: lexical_alternative
  - marker: b
