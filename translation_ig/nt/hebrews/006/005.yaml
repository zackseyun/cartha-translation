lexical_decisions:
- source_word: καλὸν
  choice: ọma
  rationale: Ọma na-akọwa okwu Chineke dị ka ihe bara uru ma magburu onwe ya, n’enweghị itinyekwu nkọwa na-adịghị na Grik.
- source_word: γευσαμένους
  choice: detụrụ ... ire
  rationale: Akpaalaokwu a na-echekwa ihe atụ nke γεύομαι ma ghara ikpebi ma ahụmahụ ahụ ò zuru ezu ma ọ bụ na o zughi ezu.
- source_word: θεοῦ ῥῆμα
  choice: okwu ... Chineke
  rationale: Nke a bụ ụzọ doro anya ma bụrụkwa nke mmadụ na-asụ n’Igbo iji gosi okwu sitere n’aka Chineke.
- source_word: δυνάμεις
  choice: ike dị iche iche
  rationale: Ọtụtụ nke okwu ahụ na-egosi ngosipụta dị iche iche nke ike; nhọrọ a na-ahapụ oghe ma ihe a na-ekwu ọ̀ bụ ọrụ ebube, ọrụ ndị dị ike, ma ọ bụ ike n’ụzọ sara mbara.
- source_word: τε
  choice: nweekwa
  rationale: Nke a jikọtara ihe nke abụọ na nke mbụ n’ụzọ na-aga were were n’Igbo.
- source_word: μέλλοντος αἰῶνος
  choice: oge na-abịa
  rationale: Nke a na-echekwa echiche eskatọlọjị banyere oge ọdịnihu nke na-abịa, ma na-ada ka Igbo nke oge a.
theological_decisions:
- issue: Ihe “detụrụ ire” pụtara n’akụkụ amaokwu ịdọ aka ná ntị
  choice: E debere ihe atụ ahụ dịka “detụrụ ... ire,” n’enweghị ịgbasa ya ka ọ bụrụ ahụmahụ zuru ezu ma ọ bụ ibelata ya ka ọ bụrụ nanị mmetụ elu elu.
  alternative: “nwetụrụ ahụmahụ” ma ọ bụ “nwetara ahụmahụ zuru ezu”
  rationale: γευσαμένους n’onwe ya anaghị edozi arụmụka banyere omimi nke òkè ndị a nwere; nsụgharị kwesịrị idobe esemokwu nkà mmụta okpukpe ahụ.
- issue: Uru δυνάμεις nwere n’ọnọdụ eskatọlọjị
  choice: “ike dị iche iche”
  alternative: “ọrụ ebube” ma ọ bụ “ọrụ ndị dị ike”
  rationale: Okwu Grik nwere ike izo aka na ngosipụta ọrụ ebube nke oge na-abịa ma ọ bụ n’ike n’ụzọ sara mbara; nhọrọ a anaghị eme ka ihe ọ pụtara dị warara.
translation_notes:
  register: Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E jiri “detụrụ ... ire” chekwaa ihe atụ Grik; e jikwa “ike dị iche iche” chekwaa obosara na mgbagwoju anya nke δυνάμεις. Usoro akara ukwu [b][a] kwekọrọ n’ebe okwu ndị ha na-akọwa dị na ederede.
