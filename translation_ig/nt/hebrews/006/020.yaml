reference: Hebrews 6:20
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὅπου πρόδρομος ὑπὲρ ἡμῶν εἰσῆλθεν Ἰησοῦς, κατὰ τὴν τάξιν Μελχισέδεκ ἀρχιερεὺς γενόμενος εἰς τὸν αἰῶνα.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/020.yaml
  text: where Jesus has entered as a forerunner on our behalf[b][a], having become a high priest forever according to the order of Melchizedek.
translation:
  language: ig
  text: ebe Jizọs banyere dịka onye butere ụzọ maka anyị[a], mgbe ọ ghọchara Onyeisi Nchụàjà ruo mgbe ebighị ebi n’usoro nke Melkizedek[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “maka anyị.” Okwu Grik ahụ nwere ike igosi ime ihe maka ọdịmma ndị ọzọ; n’ebe a, ọ na-egosi na Jizọs banyere dị ka onye na-anọchite anya anyị.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “dị ka usoro Melkizedek si dị.” Nke a na-ekwughachi Abụ Ọma 110:4.
    reason: cross_reference
lexical_decisions:
- source_word: ὅπου
  choice: ebe
  rationale: Ọ na-ezo aka n’ebe dị n’ime ákwà mgbochi ahụ e kwuru okwu ya n’amaokwu bu ụzọ; “ebe” na-edobe echiche nke ọnọdụ ahụ n’ụzọ doro anya ma bụrụkwa Igbo nkịtị.
- source_word: πρόδρομος
  choice: onye bu ụzọ gaa n’ihu
  rationale: Nke a na-egosi onye gara n’ihu ndị ọzọ ma megheere ha ụzọ, na-enweghị ime ka okwu ahụ bụrụ naanị aha teknụzụ nke ọtụtụ ndị na-agụ agaghị aghọta.
- source_word: ὑπὲρ ἡμῶν
  choice: n’ihi anyị
  rationale: Ọ na-egosi na Jizọs banyere maka ọdịmma anyị ma na-anọchite anya anyị, ma ọ naghị amanye nkọwa siri ike nke ịbụ onye nọchiri anyị kpọmkwem n’ebe a.
- source_word: εἰσῆλθεν
  choice: banyere
  rationale: Oge gara aga dabara n’omume ahụ e mechara otu ugboro; ihe gbara amaokwu ahụ gburugburu ka na-egosi na uru ya ka dị ugbu a.
- source_word: Ἰησοῦς
  choice: Jizọs
  rationale: Nke a bụ ọdịdị aha ahụ a na-ejikarị eme ihe n’Igbo ọkọlọtọ.
- source_word: κατὰ τὴν τάξιν Μελχισέδεκ
  choice: dị ka usoro Melkizedek si dị
  rationale: Ọ na-edobe echiche nke ụkpụrụ ma ọ bụ usoro nke Melkizedek, tinyere njikọ okwu a na Abụ Ọma 110:4.
- source_word: ἀρχιερεὺς
  choice: nnukwu onye nchụàjà
  rationale: Nke a bụ okwu Igbo doro anya maka ọkwa onyeisi nchụàjà nke dị mkpa n’arụmụka akwụkwọ Ndị Hibru.
- source_word: γενόμενος
  choice: mgbe ọ ghọworo
  rationale: Ọ na-edobe participle ahụ ma na-egosi na ọkwa nchụàjà a metụtara mbanye Jizọs; ọ naghị ekwu na Jizọs malitere ịdị ndụ n’oge ahụ.
- source_word: εἰς τὸν αἰῶνα
  choice: ruo mgbe ebighị ebi
  rationale: Nke a bụ ụzọ Igbo nkịtị na nke doro anya isi gosipụta ịdịgide na-enweghị ọgwụgwụ.
theological_decisions:
- issue: Mmekọrịta γενόμενος (“mgbe ọ ghọworo”) na onye Kraịst bụ
  choice: E debere echiche nke ịghọ nnukwu onye nchụàjà dị ka ịbanye n’ọkwa na ọrụ nchụàjà.
  alternative: “mgbe e mere ya nnukwu onye nchụàjà” ma ọ bụ “mgbe a họpụtara ya nnukwu onye nchụàjà”
  rationale: Amaokwu ahụ na-ekwu maka ọkwa na ọrụ Jizọs n’akụkọ nzọpụta, ọ bụghị na ọ malitere ịdị adị ma ọ bụ na ọdịdị ya gbanwere. Nsụgharị ahụ anaghị ehichapụ ngwaa ahụ, ma ọ naghịkwa etinye nkọwa karịrị ihe Grik kwuru.
- issue: Ike okwu ὑπὲρ ἡμῶν
  choice: “n’ihi anyị,” nke na-egosi ime ihe maka ọdịmma anyị na ịnọchite anya anyị
  alternative: “maka anyị” ma ọ bụ “n’ọnọdụ anyị”
  rationale: Ihe gbara ya gburugburu na-elekwasị anya n’otú Jizọs si buru ụzọ banye n’ebe nsọ nke eluigwe. Nhọrọ a na-edobe nghọta nke ịnọchite anya anyị n’agbanyeghị na ọ naghị amanye usoro nkọwa mgbaghara mmehie nke amaokwu a ekwughị kpọmkwem.
translation_notes:
  register: E ji Igbo ọkọlọtọ nke oge a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-edobe njikọ ya na amaokwu bu ụzọ site n’okwu “ebe,” ma na-eji “onye bu ụzọ gaa n’ihu” kọwaa ihe atụ πρόδρομος n’enweghị okwu teknụzụ siri ike. E tinyere akara ndetu ala peeji [a] na [b] kpọmkwem n’ebe okwu ndị ha na-akọwa dị.
