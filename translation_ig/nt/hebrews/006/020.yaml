revisions:
- from: ebe Jizọs, dị ka onye bu ụzọ gaa n’ihu, banyere n’ihi anyị[a], mgbe ọ ghọworo nnukwu onye nchụàjà ruo mgbe ebighị ebi dị ka usoro Melkizedek si dị[b].
  to: ebe Jizọs banyere dịka onye butere ụzọ maka anyị[a], mgbe ọ ghọchara Onyeisi Nchụàjà ruo mgbe ebighị ebi n’usoro nke Melkizedek[b].
  rationale: 'The revision replaces potentially causal “n’ihi anyị” with “maka anyị,” adopts idiomatic Standard Igbo terminology for forerunner and high priest, and streamlines the Melchizedek-order expression. It retains the source’s syntax and theological restraint: Jesus entered ahead for believers and became high priest forever in the Melchizedekian order.'
  reviewer_model: gpt-5.6-terra
