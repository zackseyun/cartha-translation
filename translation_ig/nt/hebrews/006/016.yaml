- from: N’ihi na ndị mmadụ na-eji onye ka ha ukwuu aṅụ iyi, iyi ahụ na-emekwa ka arụmụka niile kwụsị site n’ịkwado ihe e kwuru.[a]
  to: N’ihi na ndị mmadụ na-aṅụ iyi site n’ịkpọ onye dị ukwuu karịa ha; iyi na-abụkwa njedebe nke esemokwu ọ bụla n’etiti ha, iji mee ka ihe guzosie ike.[a]
  rationale: E degharịrị nkebi okwu banyere onye a na-eji aṅụ iyi ka ọ bụrụ Igbo eke ma chekwaa κατά μείζονος. E wepụrụ “ihe e kwuru” iji ghara itinye onye ma ọ bụ ihe βεβαίωσις na-ezo aka na ya; “ime ka ihe guzosie ike” na-echekwa ọrụ nkwado nke okwu ahụ. E debere “ndị mmadụ,” “ịṅụ iyi,” na “esemokwu” dịka okwu Igbo Ọkọlọtọ kwesịrị ekwesị.
