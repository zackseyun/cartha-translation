  text: ⸀ἄνθρωποι γὰρ κατὰ τοῦ μείζονος ὀμνύουσιν, καὶ πάσης αὐτοῖς ἀντιλογίας πέρας εἰς βεβαίωσιν ὁ ὅρκος·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/016.yaml
  text: For people swear by one greater than themselves[b][a], and for them an oath is the end of every dispute for confirmation.
translation:
  language: ig
  text: N’ihi na ndị mmadụ na-aṅụ iyi site n’ịkpọ onye dị ukwuu karịa ha; iyi na-abụkwa njedebe nke esemokwu ọ bụla n’etiti ha, iji mee ka ihe guzosie ike.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “iyi bụ njedebe nke esemokwu ọ bụla n’etiti ha maka ime ka ihe guzosie ike.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄνθρωποι
  choice: ndị mmadụ
  rationale: Ọ bụ okwu izugbe maka ụmụ mmadụ niile, ọ bụghị naanị ụmụ nwoke; “ndị mmadụ” bụ Igbo nkịtị ma doo anya.
- source_word: κατὰ τοῦ μείζονος
  choice: na-eji onye ka ha ukwuu
  rationale: Κατά ya na genitive n’usoro iyi pụtara ịkpọ onye nwere ikike ka elu dịka onye akaebe; nkebi a na-edobe ntụnyere μείζονος n’ụzọ Igbo si ekwu ya.
- source_word: ὀμνύουσιν
  choice: aṅụ iyi
  rationale: Nke a bụ ụzọ Igbo kacha kwekọọ n’omume ịṅụ iyi.
- source_word: πάσης ... ἀντιλογίας
  choice: arụmụka niile
  rationale: N’ebe a, ἀντιλογία na-ezo aka n’esemokwu ma ọ bụ ihe a na-arụrịta ụka, ọ bụghị naanị mgbagha n’echiche.
- source_word: πέρας
  choice: na-emekwa ka ... kwụsị
  rationale: Ntughari a na-egosipụta njedebe ma ọ bụ mmechi nke πέρας n’Igbo dị ndụ ma doo anya.
- source_word: εἰς βεβαίωσιν
  choice: site n’ịkwado ihe e kwuru
  rationale: Βεβαίωσις bụ nkwado ma ọ bụ ime ka ihe guzosie ike; a kọwara ihe a na-akwado dịka “ihe e kwuru” iji mee ka Igbo doo anya n’enweghị ịkọwa onye ma ọ bụ okwu pụrụ iche.
- source_word: ὁ ὅρκος
  choice: iyi ahụ
  rationale: Ihe ngosi - ahụ na-egosipụta article Grik ma na-ezoghachi n’iyi a kpọrọ aha na mbido ahịrịokwu.
theological_decisions:
- issue: Okwu izugbe gbasara ụmụ mmadụ
  choice: ndị mmadụ
  alternative: ụmụ nwoke
  rationale: ἄνθρωποι n’ebe a na-ekwu maka omume mmadụ n’ozuzu ya, ọ bụghị omume naanị ụmụ nwoke.
- issue: Ihe iyi na-eme n’arụmụka
  choice: iyi ahụ na-eme ka arụmụka kwụsị site n’ịkwado ihe e kwuru
  alternative: iyi ahụ bụ njedebe nke arụmụka niile maka nkwado
  rationale: A họọrọ usoro Igbo dị mfe nghọta nke na-echekwa ma echiche πέρας nke njedebe ma echiche βεβαίωσις nke nkwado, n’ebughị ụzọ kpebie ihe karịrị ihe Grik kwuru.
translation_notes:
  register: Igbo Ọkọlọtọ nke oge a, dị ùgwù ma dị mfe nghọta. E ji “ndị mmadụ” zere ime ka okwu izugbe bụrụ nke ụmụ nwoke naanị; e jikwa usoro okwu nkịtị “aṅụ iyi” na “arụmụka” mee ka ilu ahụ daa nke ọma n’Igbo.
