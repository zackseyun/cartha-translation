  source_fidelity: 'Draft ahụ na-ejigide echiche bụ isi nke amaokwu ahụ: omume mmadụ nke ịṅụ iyi site n’aka onye ka ha elu, na ọrụ iyi n’imechi esemokwu. Otú ọ dị, “site n’ịkwado ihe e kwuru” na-akọwapụta βεβαίωσιν n’ụzọ na-agbakwunye ihe Grik ahụ ekwughị kpọmkwem—ya bụ, na ọ bụ naanị “ihe e kwuru” ka a na-akwado. A gbanwere ya ka o chekwaa nkịtị na mgbagwoju anya nke εἰς βεβαίωσιν.'
