  rationale: The revision replaces a potentially over-moralized rendering of νωθροί with a contextually faithful, idiomatic Standard Igbo expression and marks the characteristic ongoing force of κληρονομούντων. It otherwise retains the draft’s sound handling of the Greek syntax, key terms, plural ‘promises,’ and lexical footnote.
