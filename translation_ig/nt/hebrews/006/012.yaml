id: HEB.6.12
reference: Hebrews 6:12
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἵνα μὴ νωθροὶ γένησθε, μιμηταὶ δὲ τῶν διὰ πίστεως καὶ μακροθυμίας κληρονομούντων τὰς ἐπαγγελίας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/012.yaml
  text: so that you may not become sluggish[a], but imitators of those who through faith and patience inherit the promises.
translation:
  language: ig
  text: ka unu ghara ịghọ ndị na-adịghị uchu, kama ka unu bụrụ ndị na-eṅomi ndị ahụ ji okwukwe[a] na ndidi na-eketa nkwa ndị ahụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ji ikwesị ntụkwasị obi na ndidi.” N’ọnọdụ ụfọdụ, okwu Grik a sụgharịrị “okwukwe” nwekwara ike ịpụta “ikwesị ntụkwasị obi” ma ọ bụ “ntụkwasị obi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: νωθροὶ
  choice: ndị umengwụ
  rationale: Nke a na-egosi ndị na-adị nwayọọ ma ọ bụ ndị na-enweghị uchu n’omume. Ọ dabara n’ịdọ aka ná ntị dị n’akụkụ a banyere ịdị uchu, ma bụrụkwa okwu ndị Igbo nke oge a na-aghọta nke ọma.
- source_word: γένησθε
  choice: ịghọ
  rationale: Ọ na-echekwa echiche nke ịbanye n’ọnọdụ ọhụrụ—‘ịghọ’—kama ikwu nanị na ha ‘bụ’ otu ahụ.
- source_word: μιμηταὶ
  choice: ndị na-eṅomi
  rationale: Ọ na-egosipụta kpọmkwem ọkpụkpọ òkù ka ndị na-agụ ya were ndụ ndị ọzọ mee ihe nlereanya.
- source_word: διὰ πίστεως
  choice: ji okwukwe
  rationale: ‘Okwukwe’ bụ ntụgharị sara mbara ma bụrụ nke a na-ejikarị eme ihe maka πίστις; ‘ji’ na-egosi ụzọ ma ọ bụ ihe e ji enweta ihe ahụ n’Igbo dị mfe nghọta.
- source_word: μακροθυμίας
  choice: ndidi
  rationale: ‘Ndidi’ na-egosi iji ndidi chere ogologo oge n’enweghị iwepụ aka, ma bụrụ okwu Igbo dị ugbu a ma doo anya.
- source_word: κληρονομούντων
  choice: eketa
  rationale: Ọ na-echekwa oyiyi nke inweta ihe dịka ihe nketa, tinyere ike nke participle nke ugbu a nke na-akọwa ụdị ndị a bụ.
- source_word: τὰς ἐπαγγελίας
  choice: nkwa ndị ahụ
  rationale: Ọ na-echekwa ọtụtụ nke okwu Grik ma na-ezo aka na nkwa ndị a maara n’ime okwu gbara amaokwu a gburugburu.
- source_word: ἵνα μὴ
  choice: ka unu ghara
  rationale: Ọ na-egosi nzube ma ọ bụ ihe a chọrọ ka ọ pụta, ma jikọta amaokwu a nke ọma na agbamume dị n’amaokwu bu ya ụzọ.
theological_decisions:
- issue: Ihe πίστις pụtara n’agbamume a
  choice: okwukwe
  alternative: ntụkwasị obi; ikwesị ntụkwasị obi
  rationale: N’ebe a, πίστις nwere ike ịgụnye ịtụkwasị Chineke obi, ma ‘okwukwe’ na-echekwa obosara okwu ahụ n’emeghị ka ọ pụta nanị ịtụkwasị obi ma ọ bụ ikwesị ntụkwasị obi. E debere ụzọ ọzọ n’ala ala peeji.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta mee ihe. Ahịrịokwu ahụ na-echekwa njikọ nke nzube, ọdịiche dị n’etiti umengwụ na iṅomi, nakwa oyiyi nke iketa nkwa.
