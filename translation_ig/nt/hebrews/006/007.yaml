source:
  edition: SBLGNT
  text: γῆ γὰρ ἡ πιοῦσα τὸν ἐπ’ αὐτῆς ⸂ἐρχόμενον πολλάκις⸃ ὑετόν, καὶ τίκτουσα βοτάνην εὔθετον ἐκείνοις δι’ οὓς καὶ γεωργεῖται, μεταλαμβάνει εὐλογίας ἀπὸ τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/007.yaml
  text: For land that drinks the rain that often comes upon it and produces vegetation useful to those for whose sake it is also cultivated receives blessing from God[a][b].
translation:
  language: ig
  text: N’ihi na ala nke na-aṅụ mmiri ozuzo nke na-ezokwasị n’elu ya ọtụtụ mgbe, ma na-amịpụta ahịhịa[a] bara uru nye ndị a na-akọ ya maka ha, na-enweta ngọzi site n’aka Chineke.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “osisi,” “ihe ndị na-epupụta,” ma ọ bụ “ihe ọkụkụ.”
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịghọta ya dịka “site n’aka ndị na-akọ ala ahụ”; ma “maka ndị a na-akọ ya” ka mma n’igosipụta διά tinyere accusative n’ebe a.
    reason: alternative_reading
lexical_decisions:
- source_word: γῆ
  choice: ala
  rationale: N’ọnọdụ ihe atụ banyere ọrụ ugbo, “ala” na-egosi ebe a na-akọ ihe nke ọma, n’enweghị echiche sara mbara nke ụwa dum.
- source_word: πιοῦσα
  choice: na-aṅụ
  rationale: Nke a na-edobe ihe osise doro anya nke na-eme ka ala dị ka ihe dị ndụ nke na-aṅụ mmiri, kama ịsụgharị ya nanị dị ka “na-amịkọrọ.”
- source_word: τὸν ἐπ’ αὐτῆς ἐρχόμενον πολλάκις ὑετόν
  choice: mmiri ozuzo nke na-ezokwasị ya ọtụtụ mgbe
  rationale: Nke a na-egosipụta ma ugboro ugboro nke πολλάκις ma echiche nke mmiri ozuzo na-abịakwasị ala ahụ.
- source_word: τίκτουσα
  choice: na-amịpụta
  rationale: “Na-amịpụta” bụ okwu Igbo nkịtị ma dabara n’ala nke na-eme ka ihe ọkụkụ pụta.
- source_word: βοτάνην
  choice: ahịhịa
  rationale: “Ahịhịa” nwere ike ịpụta ihe ndị na-epupụta n’ala n’ozuzu, ma ọ naghị amanye nghọta na ọ bụ otu ụdị mkpụrụ ubi kpọmkwem.
- source_word: εὔθετον
  choice: bara uru
  rationale: Nke a na-egosipụta na ihe ahụ dabara adaba ma na-abara ndị a na-akọrọ ya uru.
- source_word: ἐκείνοις δι’ οὓς καὶ γεωργεῖται
  choice: nye ndị ọ bụkwa maka ha ka a na-akọ ya
  rationale: διά tinyere accusative na-egosikarị ihe kpatara ya ma ọ bụ ndị a na-eme ihe ahụ maka ha; nsụgharị a na-edobe nghọta ahụ ma na-egosikwa καί site na “kwa.”
- source_word: μεταλαμβάνει
  choice: na-anata
  rationale: N’ebe a, okwu ahụ na-egosi na ala ahụ na-enweta ngọzi; “na-anata” bụ okwu doro anya ma bụrụkwa Igbo e ji eme ihe ugbu a.
- source_word: εὐλογίας ἀπὸ τοῦ θεοῦ
  choice: ngọzi n’aka Chineke
  rationale: Nke a na-edobe isi iyi ngọzi ahụ n'ụzọ Igbo si ekwu ya nke ọma, na-etinyeghị nkọwa ozizi ọzọ.
theological_decisions:
- issue: Ihe atụ ọrụ ugbo n’etiti ịdọ aka ná ntị
  choice: E debere ihe atụ ahụ otú o si dị, n’etinyeghị nkwubi okwu ozizi banyere nnọgidesi ike ma ọ bụ ịdapụ n’okwukwe.
  alternative: Ịsụgharị ya n’ụzọ ga-egosi kpọmkwem ndị bụ ezi ndị kwere ekwe na ndị na-abụghị, ma ọ bụ kwuo na ọ bụ nkwado Chineke nye ndị kwere ekwe na-amị mkpụrụ.
  rationale: Amaokwu a na-enye akụkụ dị mma nke ihe atụ ọrụ ugbo ahụ. Grik ahụ anaghị ekpebi n’onwe ya arụmụka ozizi ndị sara mbara dị n’akụkụ amaokwu a.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị mfe nghọta ma dịkwa ugwu, dee ya. E debere ọdịdị mmadụ e nyere ala n’okwu “na-aṅụ,” tinyere nghọta ebumnuche dị na nkebi banyere ndị a na-akọrọ ala ahụ.
