  rationale: 'E megharịrị ahịrịokwu ahụ naanị iji mee ka mmekọrịta nkebi okwu ndị Grik dị doo anya ma bụrụ Igbo nkịtị: ala ahụ bụ isiokwu nke na-aṅụ, na-amịpụta, ma na-enweta. E dochiri nkebi na-adịghị asọ asọ banyere ndị e ji akọ ala ahụ, ma debeere διά + accusative echiche ‘maka/ihi’ karịa echiche onye na-arụ ọrụ. Ihe odide ala ala b na-edozikwa ihe nwere ike ime ka a ghọta na a na-akọ ndị mmadụ kama ala.'
