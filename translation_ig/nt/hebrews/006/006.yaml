id: HEB.6.6
reference: Hebrews 6:6
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ παραπεσόντας, πάλιν ἀνακαινίζειν εἰς μετάνοιαν, ἀνασταυροῦντας ἑαυτοῖς τὸν υἱὸν τοῦ θεοῦ καὶ παραδειγματίζοντας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/006.yaml
  text: and having fallen away[a], to renew them again to repentance[b], since they are crucifying again for themselves the Son of God and exposing him to public shame.
translation:
  language: ig
  text: ma ndị dapụrụ n’okwukwe[a], ime ka ha dị ọhụrụ ọzọ ruo na nchegharị[b], ebe ha na-akpọgide Ọkpara Chineke n’obe ọzọ maka onwe ha ma na-eme ka ihere mee ya n’ihu ọha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị jụrụ okwukwe.” Ngwaa Grik ahụ nwere ike ịpụta ndapụ dị oké njọ.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “mgbe ha na-akpọgide Ọkpara Chineke n’obe ọzọ maka onwe ha ma na-eme ka ihere mee ya n’ihu ọha.” Ụdị ngwaa sonye Grik abụọ ahụ nwere ike igosi omume na-eme n’otu oge, ọ bụghị naanị ihe kpatara ya.
    reason: alternative_reading
lexical_decisions:
- source_word: παραπεσόντας
  choice: ndị dapụrụ n’okwukwe
  rationale: “Dapụrụ” na-egosi ịda n’ụzọ dị oké njọ; mgbakwunye “n’okwukwe” na-eme ka okwu ahụ doo anya n’Igbo n’enweghị iji aha nkà mmụta okpukpe nke ga-ekpebi ụdị ndapụ ahụ.
- source_word: πάλιν
  choice: ọzọ
  rationale: Ọ na-akọwa ἀνακαινίζειν ma na-egosi imeghachi omume ahụ.
- source_word: ἀνακαινίζειν
  choice: ime ka ha dị ọhụrụ
  rationale: Nke a na-egosipụta ime ka mmadụ laghachi n’ọnọdụ ọhụrụ ma ọ bụ iweghachi ya, ma na-anọ nso n’echiche okwu Grik ahụ.
- source_word: εἰς μετάνοιαν
  choice: ruo na nchegharị
  rationale: “Ruo na” na-echekwa ike ntụziaka ma ọ bụ ebumnuche nke εἰς; “nchegharị” bụ okwu Igbo doro anya maka μετάνοια n’ọnọdụ a.
- source_word: ἀνασταυροῦντας
  choice: na-akpọgide ... n’obe ọzọ
  rationale: Ụdị a na-echekwa omume na-aga n’ihu nke participle dị ugbu a na echiche nke ịkpọgide ọzọ.
- source_word: ἑαυτοῖς
  choice: nwere onwe ha
  rationale: E tinyere ya n’usoro “na-akpọgidekwara onwe ha” iji gosipụta na omume a bụ nke ha na-eme n’akụkụ nke ha; ọ naghị ekwu na ha na-akpọgide onwe ha n’obe.
- source_word: τὸν υἱὸν τοῦ θεοῦ
  choice: Ọkpara Chineke
  rationale: Nke a bụ nsụgharị Igbo kwụ ọtọ nke aha Kraịst a ma na-echekwa ịdị arọ ya.
- source_word: παραδειγματίζοντας
  choice: na-eme ka ihere mee ya n’ihu ọha
  rationale: Ọ na-egosipụta ikpughe mmadụ nye mmechuihu ọha, nke bụ isi echiche ngwaa Grik ahụ.
- source_word: καὶ ... καὶ
  choice: ma ... ma
  rationale: Njikọ ndị a jikọtara omume abụọ ahụ n’usoro Igbo eke.
theological_decisions:
- issue: Ma a ga-ekwughachi “ọ gaghị ekwe omume” nke dị n’amaokwu bu ụzọ
  choice: A malitere amaokwu a na “ma” ma etinyeghị ngwaa ọhụrụ nke na-ekwu na ọ gaghị ekwe omume.
  alternative: Ọ gaghị ekwe omume ... ime ka ndị dapụrụ laghachi ọzọ na nchegharị.
  rationale: Ahịrịokwu Grik a dabere n’ihe e kwuru na Hibru 6:4–5. Idebe ndabere ahụ na-echekwa usoro isi mmalite ma ghara ịgbakwunye nkwubi okwu n’amaokwu a naanị ya.
- issue: Ụdị ndapụ a na-ekwu maka ya
  choice: ndị dapụrụ n’okwukwe
  alternative: ndị jụrụ okwukwe kpamkpam
  rationale: Nsụgharị ahụ na-echekwa ịdị njọ nke ịdapụ ahụ, ma ọ naghị ekpebi arụmụka banyere ma ọ bụ ọnwụ nzọpụta, okwukwe yiri ezi okwukwe, ma ọ bụ ụdị ndapụ ọzọ.
- issue: Ike nke ἀνασταυροῦντας na παραδειγματίζοντας
  choice: “ebe ha na-...” nke nwere ike ịkọwa ọnọdụ na ihe kpatara ya
  alternative: “n’ihi na ha na-...” nke ga-eme ka ihe kpatara ya pụta ìhè karị
  rationale: Participles Grik ahụ nwere ike ịbụ nkọwa ihe kpatara ya ma ọ bụ omume na-eme n’otu oge. “Ebe” na-ahapụ ntakịrị ohere maka nghọta abụọ ahụ.
translation_notes:
  register: Standard Igbo; okwu dị ugwu ma dị mfe nghọta. E ji “Ọkpara Chineke,” “nchegharị,” na “n’ihu ọha” mee ka aha okpukpe na ihe gbasara ihere ọha doo anya. Akara [a] na [b] dị n’ederede isi.
