revisions:
- from: ma ndị dapụrụ n’okwukwe[a], ime ka ha dị ọhụrụ ọzọ ruo na nchegharị[b], ebe ha na-akpọgidekwara onwe ha Ọkpara Chineke n’obe ọzọ ma na-eme ka ihere mee ya n’ihu ọha.
  to: ma ndị dapụrụ n’okwukwe[a], ime ka ha dị ọhụrụ ọzọ ruo na nchegharị[b], ebe ha na-akpọgide Ọkpara Chineke n’obe ọzọ maka onwe ha ma na-eme ka ihere mee ya n’ihu ọha.
  rationale: The sole substantive correction moves the reflexive phrase to “maka onwe ha,” so that it clearly qualifies their recrucifying of the Son of God and cannot be mistaken for an object meaning ‘themselves.’ The causal/contemporaneous ambiguity of the Greek present participles is retained by “ebe,” with the contemporaneous alternative preserved in footnote b. No doctrinal interpretation is introduced.
