id: HEB.6.18
reference: Hebrews 6:18
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἵνα διὰ δύο πραγμάτων ἀμεταθέτων, ἐν οἷς ἀδύνατον ψεύσασθαι ⸀θεόν, ἰσχυρὰν παράκλησιν ἔχωμεν οἱ καταφυγόντες κρατῆσαι τῆς προκειμένης ἐλπίδος·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/018.yaml
  text: so that through two unchangeable things[a], in which it is impossible for God to lie[b], we who have fled for refuge might have strong encouragement to take hold of the hope set before us.
translation:
  language: ig
  text: ka site n'ihe abụọ a na-apụghị ịgbanwe agbanwe[a], bụ́ ndị ọ na-apụghị ikwe omume na Chineke ga-agha ụgha n'ime ha, anyị bụ́ ndị gbabara ọsọ ịchọ ebe mgbaba wee nwee agbamume siri ike ijidesi olileanya ahụ e debere n'ihu anyị ike.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ihe abụọ ahụ na-ezo aka ná nkwa Chineke na iyi ọ ṅụrụ.
    reason: contextual_clarification
  - marker: b
    text: Ma ọ bụ, “ijide olileanya ahụ e debere n'ihu anyị.” Ngwaa Grik ahụ nwere ike ịpụta ijide, ịchịkọta n'aka, ma ọ bụ ijidesi ike. Okwu “gbabara ọsọ ịchọ ebe mgbaba” na-enye onyinyo nke onye na-agba ọsọ ịchọ nchebe, ikekwe na-echetara obodo mgbaba ndị e kwuru banyere ha n'Agba Ochie.
    reason: lexical_alternative_and_cross_reference
lexical_decisions:
- source_word: ἵνα
  choice: ka
  rationale: Na-egosi nzube ma ọ bụ ihe si n'okwu bu ụzọ pụta, n'ụzọ dị mkpirikpi ma bụrụkwa Igbo nkịtị.
- source_word: διὰ δύο πραγμάτων ἀμεταθέτων
  choice: site n'ihe abụọ a na-apụghị ịgbanwe agbanwe
  rationale: “Ihe” na-edobe obosara πράγματα, ebe nkebi a na-egosi na ihe abụọ ahụ enweghị ike ịgbanwe; n'ọnọdụ a, ha na-ezo aka ná nkwa Chineke na iyi ya.
- source_word: ἐν οἷς
  choice: n'ime ha
  rationale: Na-edobe njikọ nke nnọchiaha a na “ihe abụọ” ndị e kwuru tupu ya, n'agbanyeghị na usoro okwu ahụ dị ntakịrị arọ n'Igbo.
- source_word: ἀδύνατον ψεύσασθαι θεόν
  choice: ọ na-apụghị ikwe omume na Chineke ga-agha ụgha
  rationale: 'Na-echekwa usoro na nkwusi ike nke Grik: ịgha ụgha bụ ihe na-apụghị ikwe omume nye Chineke, n''enweghị mgbakwunye nkà mmụta okpukpe ọzọ.'
- source_word: ἰσχυρὰν παράκλησιν
  choice: agbamume siri ike
  rationale: παράκλησις nwere ike ịbụ agbamume, nkasi obi, ma ọ bụ ndụmọdụ; “agbamume” dabara n'okwu a nke na-eme ka ndị kwere nkwa sie ike.
- source_word: ἔχωμεν
  choice: wee nwee
  rationale: Na-egosi ihe e bu n'obi ma ọ bụ ihe ga-esi na nzube ahụ pụta, dị ka subjunctive nke so ἵνα.
- source_word: οἱ καταφυγόντες
  choice: anyị bụ́ ndị gbabara ọsọ ịchọ ebe mgbaba
  rationale: Na-edobe ma mmegharị nke ịgbapụ ọsọ ma nzube nke ịchọ nchebe, kama ime ka onyinyo ahụ ghọọ naanị echiche nkịtị.
- source_word: κρατῆσαι
  choice: ijidesi ... ike
  rationale: κρατέω nwere ike ịpụta ijide, ijidesi ike, ma ọ bụ ịchịkọta n'aka; “ijidesi ... ike” bụ Igbo doro anya nke na-egosi ijide olileanya ahụ nke ọma ma nọgide na ya.
- source_word: τῆς προκειμένης ἐλπίδος
  choice: olileanya ahụ e debere n'ihu anyị
  rationale: Na-echekwa onyinyo nke olileanya e tinyere ma ọ bụ e debere n'ihu mmadụ ka o ruo ya aka.
theological_decisions:
- issue: Onyinyo nke mgbaba na ijide olileanya
  choice: anyị bụ́ ndị gbabara ọsọ ịchọ ebe mgbaba ... ijidesi olileanya ahụ e debere n'ihu anyị ike
  alternative: anyị bụ́ ndị chọtara ebe mgbaba ... ịnọgide n'olileanya ahụ
  rationale: Nhọrọ ahụ na-echekwa onyinyo abụọ dị ndụ n'okwu Grik—ịgbaga ebe nchebe na ijide olileanya—n'emeghị ka ha bụrụ naanị nkwenye ime mmụọ a kọwara n'ụzọ nkịtị.
- issue: Eziokwu Chineke
  choice: ọ na-apụghị ikwe omume na Chineke ga-agha ụgha
  alternative: Chineke apụghị ịgha ụgha
  rationale: Nke a na-edobe usoro impersonal nke Grik na nkwusi ike ya, ma ọ naghị agbakwunye nkọwa nkà mmụta okpukpe gafere ihe amaokwu ahụ kwuru.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị ugwu ma dịkwa mfe nghọta. E chekwara usoro ebumnuche nke amaokwu ahụ na onyinyo mgbaba ya; a họọrọ “ijidesi ... ike” ka ọ bụrụ okwu Igbo eke nke na-anọgide na-emeghe obosara κρατῆσαι.
