  text: ἣν ὡς ἄγκυραν ἔχομεν τῆς ψυχῆς, ⸀ἀσφαλῆ τε καὶ βεβαίαν καὶ εἰσερχομένην εἰς τὸ ἐσώτερον τοῦ καταπετάσματος,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/019.yaml
  text: We have this as an anchor of the soul[a], both secure and firm, and entering into the inner place behind the curtain,
translation:
  language: ig
  text: Anyị nwere olileanya a dịka arịlịka nke mkpụrụobi, nke dị nchebe ma sie ike, nke na-abanye n’ebe dị n’ime, n’azụ ákwà mgbochi ahụ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ịsụgharị ya: “n’ebe dị n’ime nke ákwà mgbochi ahụ” ma ọ bụ “n’ime ákwà mgbochi ahụ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἣν
  choice: Olileanya a
  rationale: Nnọchiaha nwanyị a na-ezo azụ n’olileanya e kwuru na amaokwu gara aga; ikwughachi “olileanya a” na-eme ka njikọ ahụ doo anya n’Igbo.
- source_word: ὡς ἄγκυραν ἔχομεν
  choice: bụụrụ anyị arịlịka
  rationale: Nke a na-enye Igbo dị mfe ma na-edobe ihe atụ nke arịlịka na echiche nke ihe anyị nwere.
- source_word: τῆς ψυχῆς
  choice: nke mkpụrụobi
  rationale: “Mkpụrụobi” na-edobe uru okwu ψυχή n’enweghị ime ka ọ bụrụ naanị mmetụta uche ma ọ bụ ndụ anụ ahụ.
- source_word: ἀσφαλῆ τε καὶ βεβαίαν
  choice: nke dị nchebe ma sie ike
  rationale: “Dị nchebe” na “sie ike” na-edobe àgwà abụọ dị iche iche nke arịlịka ahụ na njikọ τε καὶ.
- source_word: εἰσερχομένην
  choice: nke na-abanyekwa
  rationale: Nkebi ahịrị a na-aga n’ihu ịkọwa arịlịka ahụ; “-kwa” na-egosi na nke a bụ nkọwa ọzọ e tinyere n’àgwà abụọ ahụ.
- source_word: εἰς τὸ ἐσώτερον τοῦ καταπετάσματος
  choice: n’ebe dị n’ime, n’azụ ákwà mgbochi ahụ
  rationale: Nke a na-egosi ebe dị n’ime ebe nsọ n’ofe ákwà mgbochi ahụ, ma ghara ịkọwapụta ya karịa ihe Grik kwuru.
theological_decisions:
- issue: Ihe atụ nke ebe nsọ dị n’eluigwe
  choice: ákwà mgbochi
  alternative: ákwà e ji ekpuchi ụzọ; n’ime ákwà mgbochi
  rationale: “Ákwà mgbochi” bụ okwu Igbo nke oge a ma doo anya maka ihe kewara akụkụ ebe nsọ; “n’azụ” na-eme ka mmekọrịta ọnọdụ ahụ pụta ìhè n’enweghị itinye nkọwa ozizi ọzọ.
translation_notes:
  register: Standard Igbo; asụsụ dị ugbu a, dị ùgwù, ma dị mfe nghọta. E debere ihe atụ nke arịlịka na nke ebe nsọ, tinyekwa akara nkọwa ala ala [a] n’ederede.
