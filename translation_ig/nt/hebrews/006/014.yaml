translation:
  language: ig
  text: na-asị[a], “N’ezie, m ga-agọzi gị; n’eziekwa, m ga-amụba gị.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'N’asụsụ Grik: “N’ịgọzi ka m ga-agọzi gị, n’ịmụbakwa ka m ga-amụba gị.” Nke a bụ usoro okwu nkwusi ike nke na-ekwughachi Jenesis 22:17.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγων
  choice: na-asị
  rationale: Ọ bụ participle nke na-ewebata ihe Chineke kwuru n’iyi ya; ‘na-asị’ na-ejigide usoro ahịrịokwu ahụ n'ụzọ doro anya ma bụrụkwa Igbo nkịtị.
- source_word: Εἰ μὴν
  choice: N’ezie
  rationale: N’ebe a, ọ bụghị ọnọdụ ‘ọ bụrụ na’; ọ bụ okwu nkwusi ike e ji ekwe iyi. ‘N’ezie’ na-egosi nkwenye siri ike ahụ.
- source_word: εὐλογῶν εὐλογήσω
  choice: aga m agọzi gị
  rationale: Ntughari a na-eme ka Igbo dị mma ma doo anya; ‘N’ezie’ na-eburu nkwusi ike nke nkwugharị ngwaa Grik, ebe nkọwa ala peeji na-echekwa ọdịdị ya kpọmkwem.
- source_word: σε
  choice: gị
  rationale: Ọ bụ nnọchiaha onye nke abụọ otu, na-ezo aka n’Abraham.
- source_word: καὶ
  choice: n’eziekwa
  rationale: ‘-kwa’ na-ejikọta nkwa abụọ ahụ, ebe nkwughachi ‘n’ezie’ na-egosipụta na ngwaa nke abụọ nwekwara nkwusi ike nke ya.
- source_word: πληθύνων πληθυνῶ
  choice: aga m amụba gị
  rationale: ‘Amụba gị’ na-ejigide echiche ngwaa nke ime ka Abraham baa ụba, karịsịa site n’ụmụ ya, n’enweghị ịkọwapụta ihe Grik hapụrụ n’ozuzu ya; ‘n’ezie’ na-egosi nkwusi ike.
theological_decisions:
- issue: Otú e si tụgharị usoro iyi siri ike e hotara n’ihe e kwere Abraham ná nkwa
  choice: Jiri Igbo dị larịị—‘N’ezie, aga m agọzi gị, n’eziekwa, aga m amụba gị’—ma kọwaa nkwugharị ngwaa Grik n’ala peeji.
  alternative: ‘N’ezie, n’ịgọzi aga m agọzi gị, n’ịmụbakwa aga m amụba gị.’
  rationale: Grik na-emegharị ngwaa abụọ ahụ n’ụdị na-ekwughachi usoro Semitik nke Jenesis 22:17. Isi ederede kwesịrị ịbụ Igbo eke ma chekwaa nkwusi ike dị n’akụkụ abụọ; nkọwa ala peeji na-edebe ọdịdị okwu ahụ maka ntụnyere.
translation_notes:
  register: Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. E ji ‘aga m’ gosipụta nkwa ọdịnihu, ‘N’ezie’ gosipụta asụsụ iyi siri ike, ma zere okwu ụka pụrụ iche.
