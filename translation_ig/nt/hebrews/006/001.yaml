id: HEB.6.1
reference: Hebrews 6:1
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Διὸ ἀφέντες τὸν τῆς ἀρχῆς τοῦ Χριστοῦ λόγον ἐπὶ τὴν τελειότητα φερώμεθα, μὴ πάλιν θεμέλιον καταβαλλόμενοι μετανοίας ἀπὸ νεκρῶν ἔργων, καὶ πίστεως ἐπὶ θεόν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/001.yaml
  text: Therefore[a], leaving the elementary message about the Messiah, let us be carried on to maturity, not laying again a foundation of repentance from dead works and of faith toward God[d][c][b],
translation:
  language: ig
  text: Ya mere, ka anyị hapụ ozi mbụ banyere Mesaịa ahụ[a], ka e buru anyị gaa n’ihu ruo n’ịtozu oke[b][c], na-enweghị ịtọ ntọala ọzọ nke nchegharị pụọ n’ọrụ nwụrụ anwụ na nke okwukwe n’ebe Chineke nọ[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ozi mmalite nke Mesaịa ahụ,” ma ọ bụ, “nkuzi ndị bụ isi banyere Mesaịa ahụ.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ruo n’izu oke,” ma ọ bụ, “ruo n’izu ezu.”
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “ka anyị gaa n’ihu.” N’asụsụ Grik, ngwaa ahụ dị n’olu nnara; n’ụzọ nkịtị, “ka e buru anyị gaa n’ihu.”
    reason: lexical_alternative
  - marker: d
    text: Ma ọ bụ, “okwukwe na Chineke.”
    reason: alternative_reading
lexical_decisions:
- source_word: Διὸ
  choice: Ya mere
  rationale: Ọ na-egosi na ndụmọdụ a bụ ihe e si n’okwu ndị bu ya ụzọ nweta; okwu a bụkwa Igbo doro anya ma kwesị ekwesị.
- source_word: ἀφέντες
  choice: ka anyị hapụ
  rationale: Ọ na-egosi ịga n’ihu site n’ihe ndị bụ isi, ọ bụghị ịjụ ha ma ọ bụ tụfuo ha kpamkpam.
- source_word: τὸν τῆς ἀρχῆς τοῦ Χριστοῦ λόγον
  choice: ozi ndị mbụ banyere Mesaịa ahụ
  rationale: Nke a na-egosi ozi ma ọ bụ nkuzi mmalite banyere Mesaịa ahụ, ma ọ naghị eme ka usoro genitive Grik ahụ nwee naanị otu nkọwa.
- source_word: Χριστοῦ
  choice: Mesaịa ahụ
  rationale: N’ebe a Χριστός na-arụ ọrụ dị ka utu aha, ya mere ‘Mesaịa’ dabara nke ọma.
- source_word: ἐπὶ τὴν τελειότητα
  choice: ruo n’ịtozu oke
  rationale: Ọ na-egosi iru ntozu na izu ezu n’ụzọ ime mmụọ, n’enweghị echiche na onye ahụ aghaghị ịbụ onye na-enweghị mmehie kpamkpam.
- source_word: φερώμεθα
  choice: ka e buru anyị gaa n’ihu
  rationale: E jigidere olu nnara nke Grik ahụ kama ime ya naanị ‘ka anyị gaa n’ihu’; nke a na-ahapụ echiche na ọ bụghị naanị ike mmadụ na-akwalite ọganihu ahụ.
- source_word: θεμέλιον καταβαλλόμενοι
  choice: ịtọkwa ọzọ ntọala
  rationale: Nke a na-echekwa ihe atụ nke iwu ụlọ ma bụrụkwa okwu Igbo nkịtị.
- source_word: μετανοίας ἀπὸ νεκρῶν ἔργων
  choice: nchegharị pụọ n’ọrụ ndị nwụrụ anwụ
  rationale: ‘Nchegharị’ na-egosi mgbanwe nke uche na ntụgharị ụzọ, ebe ‘ọrụ ndị nwụrụ anwụ’ na-echekwa ihe atụ dị na Grik n’emeghị ka ọ bụrụ naanị ọrụ na-eduga n’ọnwụ.
- source_word: πίστεως ἐπὶ θεόν
  choice: okwukwe chere ihu n’ebe Chineke nọ
  rationale: Nke a na-echekwa nghọta ntụziaka dị na ἐπί, ọ bụ ezie na ‘okwukwe na Chineke’ bụ ụzọ Igbo dị mfe karị.
theological_decisions:
- issue: Ma ‘ịhapụ ozi ndị mbụ’ ọ pụtara ịjụ nkuzi banyere Mesaịa kpamkpam
  choice: E gosipụtara ya dị ka isi n’ihe ndị bụ isi gaa n’ihu, ọ bụghị ịjụ ha.
  alternative: Ịhapụ ozi banyere Mesaịa kpamkpam.
  rationale: Nkebi na-esote banyere ịghara ịtọ ntọala ọzọ na-egosi ọganihu site na ntọala ahụ, ọ bụghị ịkwatu ma ọ bụ jụ ya.
- issue: Ma τελειότης bụ ‘izu oke’ ma ọ bụ ‘ịtozu oke’
  choice: ịtozu oke
  alternative: izu oke; izu ezu
  rationale: N’okwu ndụmọdụ a, ọdịiche dị n’etiti ntọala na ọganihu na-akwado nghọta nke ntozu, ma ihe ndị ọzọ nwere ike ịdịkwa na nkọwa ala peeji.
- issue: Ma a ga-eme φερώμεθα ka ọ bụrụ olu omume
  choice: 'E jigidere olu nnara: ‘ka e buru anyị gaa n’ihu.’'
  alternative: ka anyị gaa n’ihu
  rationale: Nke a na-asọpụrụ ụdị ngwaa Grik ma na-ezere ime ka ọganihu ahụ yie ihe sitere naanị n’ike mmadụ.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. E jigidere ihe atụ nke ntọala na ọrụ ndị nwụrụ anwụ, yana olu nnara nke φερώμεθα. E kewara ahịrịokwu ahụ ụzọ abụọ iji mee ka ọ gụọ nke ọma n’Igbo n’emebighị njikọ echiche ya.
