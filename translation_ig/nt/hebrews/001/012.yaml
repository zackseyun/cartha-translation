id: HEB.1.12
reference: Hebrews 1:12
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ὡσεὶ περιβόλαιον ἑλίξεις αὐτούς, ⸂ὡς ἱμάτιον⸃ καὶ ἀλλαγήσονται· σὺ δὲ ὁ αὐτὸς εἶ, καὶ τὰ ἔτη σου οὐκ ἐκλείψουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/012.yaml
  text: and like a cloak you will roll them up[a]; like a garment they will be changed. But you are the same[b], and your years will not fail.
translation:
  language: ig
  text: Ọzọkwa, dịka uwe mkpuchi ka ị ga-atụkọta ha[a]; dịka uwe, a ga-agbanwe ha. Ma gị onwe gị bụ otu ahụ, afọ gị agaghị akwụsị[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ị ga-apịakọta ha.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “afọ gị agaghị agwụ agwụ” ma ọ bụ “afọ gị agaghị abịa ná njedebe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡσεὶ περιβόλαιον
  choice: dịka uwe mwụda
  rationale: Nke a na-echekwa ntụnyere ahụ na ihe mmadụ na-eyikwasị n'elu uwe ndị ọzọ, ma jiri okwu Igbo nke onye nkịtị ga-aghọta.
- source_word: ἑλίξεις
  choice: ị ga-apịakọta
  rationale: Ngwaa a pụrụ ịpụta ịkpọkọta site n'ịpịakọta ma ọ bụ ịtụkọta; “ị ga-apịakọta” na-egosipụta ihe e mere uwe ma na-echekwa ihe oyiyi uri ahụ.
- source_word: αὐτούς
  choice: ha
  rationale: Nnọchiaha a na-ezo aka n'ihe ndị e kere eke a kpọtụrụ aha n'amaokwu ndị bu ụzọ.
- source_word: ὡς ἱμάτιον
  choice: dịka uwe
  rationale: “Uwe” bụ okwu Igbo sara mbara ma doo anya nke na-echekwa ntụnyere nke abụọ gbasara uwe.
- source_word: ἀλλαγήσονται
  choice: a ga-agbanwe ha
  rationale: Nke a na-echekwa olu nnara nke Grik ma na-egosi na mgbanwe ahụ ga-adakwasị ihe ndị e kere eke.
- source_word: σὺ δὲ ὁ αὐτὸς εἶ
  choice: Ma gị onwe gị bụ otu onye ahụ
  rationale: “Ma” na-egosi ọdịiche siri ike, ebe “gị onwe gị bụ otu onye ahụ” na-echekwa nkwupụta Grik banyere ịdịgide otu onye ahụ n'enweghị itinye okwu nkà mmụta okpukpe ọzọ.
- source_word: τὰ ἔτη σου οὐκ ἐκλείψουσιν
  choice: afọ gị agaghịkwa agwụ agwụ
  rationale: Akpaalaokwu Igbo a na-egosi na afọ ya agaghị akwụsị ma ọ bụ bịaruo n'isi njedebe, nke bụ isi echiche nke ἐκλείπω n'ebe a.
theological_decisions:
- issue: Asụsụ banyere ịdịgide otu onye ahụ n'amaokwu e ji akọwa Ọkpara
  choice: Ma gị onwe gị bụ otu onye ahụ
  alternative: Ma gị onwe gị adịghị agbanwe agbanwe
  rationale: Nhọrọ a na-anọ nso n'okwu Grik ὁ αὐτός, na-egosipụta ọdịiche dị n'etiti ihe e kere eke na-agbanwe agbanwe na onye a na-agwa okwu, ma ọ naghị ebubata nkọwa nkà mmụta okpukpe karịrị ihe amaokwu ahụ kwuru.
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E chekwara usoro uri, ntụnyere uwe abụọ, ọdịiche dị n'etiti mgbanwe nke ihe e kere eke na ịdịgide nke onye a na-agwa okwu. Akara nkọwa ala ala [a] na [b] pụtara n'ederede isi.
