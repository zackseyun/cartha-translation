revisions:
- from: Ọ̀ bụ na ha niile abụghị mmụọ ndị na-eje ozi, ndị a na-eziga ka ha jee ozi n’ihi ndị ahụ ga-eketa nzọpụta?[a]
  to: Ha niile ọ̀ bụghị mmụọ na-eje ozi, ndị a na-eziga ka ha jee ozi maka ndị ahụ ga-eketa nzọpụta?[a]
  rationale: The revision places “ha niile” before the negative rhetorical question to make the universal scope unambiguous. It also uses “maka” for the benefactive force of διά. The passive, ongoing sense of ἀποστελλόμενα remains in “ndị a na-eziga,” and the footnote preserves the more immediate/prospective alternative for μέλλοντας.
  reviewer_model: gpt-5.6-terra
