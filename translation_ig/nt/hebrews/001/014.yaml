id: HEB.1.14
reference: Hebrews 1:14
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οὐχὶ πάντες εἰσὶν λειτουργικὰ πνεύματα εἰς διακονίαν ἀποστελλόμενα διὰ τοὺς μέλλοντας κληρονομεῖν σωτηρίαν;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/014.yaml
  text: Are they not all ministering spirits, being sent out for service for the sake of those who are about to inherit salvation?[a]
translation:
  language: ig
  text: Ha niile ọ̀ bụghị mmụọ na-eje ozi, ndị a na-eziga ka ha jee ozi maka ndị ahụ ga-eketa nzọpụta?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ndị ahụ na-aga iketa nzọpụta.” Okwu Grik ahụ na-egosi ihe a na-atụ anya n’ọdịnihu.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐχὶ
  choice: Ọ̀ bụ na ... abụghị
  rationale: Na-egosipụta ajụjụ nkwupụta nke na-atụ anya azịza nkwenye, ma na-ada nke ọma n’Igbo.
- source_word: πάντες
  choice: ha niile
  rationale: Na-echekwa oke zuru ezu nke okwu Grik ahụ n’enweghị mgbasawanye na-adịghị mkpa.
- source_word: λειτουργικὰ πνεύματα
  choice: mmụọ ndị na-eje ozi
  rationale: Na-egosipụta mmụọ ndị ọrụ, ya bụ ndị mmụọ ozi n’ọnọdụ a, n’ebughị echiche banyere ọkwa ọrụ ụka.
- source_word: εἰς διακονίαν
  choice: ka ha jee ozi
  rationale: Na-egosipụta nzube nke iziga ha n’Igbo dị mfe ma doo anya.
- source_word: ἀποστελλόμενα
  choice: ndị a na-eziga
  rationale: Na-echekwa ọdịdị passive participle na echiche nke ịbụ ndị a na-ezipụ ịrụ ọrụ.
- source_word: διὰ
  choice: n’ihi
  rationale: N’ọnọdụ a ọ na-egosi na e zigara ha maka uru ndị ga-enweta nzọpụta.
- source_word: τοὺς μέλλοντας
  choice: ndị ahụ ga-
  rationale: Na-egosipụta ihe a na-atụ anya n’ọdịnihu; nkọwa ala peeji na-echekwa ohere nke ịsụgharị ya dịka ihe dị nso ime.
- source_word: κληρονομεῖν
  choice: keta
  rationale: Na-echekwa ihe oyiyi nke ihe nketa, nke dị mkpa n’Akwụkwọ Ndị Hibru.
- source_word: σωτηρίαν
  choice: nzọpụta
  rationale: Ọ bụ okwu Igbo a na-ejikarị maka σωτηρία, ma na-anabata akụkụ ya nke ugbu a na nke ọdịnihu.
theological_decisions:
- issue: Ike okwu μέλλοντας κληρονομεῖν σωτηρίαν
  choice: ndị ahụ ga-eketa nzọpụta
  alternative: ndị ahụ na-aga iketa nzọpụta
  rationale: Isi ederede na-eji ọdịnihu eke nke Igbo mee ka okwu ahụ doo anya, ebe nkọwa ala peeji na-echekwa echiche Grik nke ihe a na-atụ anya ma ọ bụ nke dị nso ime; a naghị etinye ozizi pụrụ iche banyere akara aka ma ọ bụ nkwenye nzọpụta.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke dị ugwu ma dị mfe nghọta. A họọrọ “mmụọ ndị na-eje ozi” iji zere echiche na ọ bụ ọkwa ọrụ ụka, ma debe ntụaka ya nye ndị mmụọ ozi site n’ọnọdụ amaokwu ahụ.
