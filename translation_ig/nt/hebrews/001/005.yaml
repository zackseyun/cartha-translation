id: HEB.1.5
reference: Hebrews 1:5
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Τίνι γὰρ εἶπέν ποτε τῶν ἀγγέλων· Υἱός μου εἶ σύ, ἐγὼ σήμερον γεγέννηκά σε, καὶ πάλιν· Ἐγὼ ἔσομαι αὐτῷ εἰς πατέρα, καὶ αὐτὸς ἔσται μοι εἰς υἱόν;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/005.yaml
  text: For to which of the angels did he ever say[a], “You are my Son; today I have begotten you”? And again, “I will be to him a father[c][b], and he will be to me a son”?
translation:
  language: ig
  text: 'N’ihi na, ònye n’ime ndị mmụọ ozi ka Chineke gwara mgbe ọ bụla, sị,


    “Ị bụ Nwa m;


    taa ka m mụrụ gị”[a]?


    Ọzọkwa,


    “M ga-abụrụ ya nna,


    yakwa ga-abụrụ m nwa nwoke”[b]?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Taa ka m mụrụ gị” na-ekwughachi Abụ Ọma 2:7. A kọwawo okwu a n’ihe gbasara echichi eze, mbilite n’ọnwụ, ma ọ bụ mmekọrịta ebighị ebi nke Nwa na Nna; nsụgharị a na-edobe okwu ahụ n’enweghị ikpebi n’etiti nkọwa ndị a.
    reason: cross_reference
  - marker: b
    text: 'Okwu e hotara na 2 Samuel 7:14. A pụkwara ikwu ya n’ụzọ Igbo ka mfe: “M ga-abụ nna ya, yakwa ga-abụ nwa m nwoke.”'
    reason: alternative_reading
lexical_decisions:
- source_word: Τίνι γὰρ ... τῶν ἀγγέλων
  choice: N’ihi na, ọ̀ bụ onye n’ime ndị mmụọ ozi
  rationale: “Onye n’ime” na-egosipụta ajụjụ gbasara otu onye n’etiti ndị mmụọ ozi, ebe “N’ihi na” na-ejigide njikọ nkọwa γὰρ na okwu bu ụzọ.
- source_word: εἶπέν ποτε
  choice: ka o kwuru mgbe ọ bụla
  rationale: Nke a na-ejigide echiche nke ποτέ—ma ọ dịtụla mgbe o kwuru ya—n’ime ajụjụ a na-ajụ iji gosi na azịza ya bụ mba.
- source_word: ἀγγέλων
  choice: ndị mmụọ ozi
  rationale: N’ọnọdụ Hibru 1, okwu a na-ezo aka n’ụmụ mmụọ nke eluigwe, ọ bụghị ndị ozi mmadụ.
- source_word: Υἱός μου εἶ σύ
  choice: Ị bụ Ọkpara m
  rationale: “Ọkpara” bụ ụzọ Igbo a na-aghọta nke ọma iji kwupụta aha pụrụ iche nke Ọkpara n’ọnọdụ a; usoro okwu ahụ bụkwa nke dị ndụ n’Igbo.
- source_word: σήμερον γεγέννηκά σε
  choice: taa ka m mụrụ gị
  rationale: “Mụrụ” na-ejigide ihe atụ nna na nwa nke γεννάω n’enweghị ịkọwa ya dị ka ọmụmụ anụ ahụ naanị ma ọ bụ kpebie otu nkọwa nkà mmụta okpukpe.
- source_word: καὶ πάλιν
  choice: Ọzọkwa
  rationale: Ọ na-ewebata amaokwu Akwụkwọ Nsọ ọzọ n’ụzọ dị nkenke ma bụrụkwa Igbo nkịtị.
- source_word: Ἐγὼ ἔσομαι αὐτῷ εἰς πατέρα
  choice: M ga-abụrụ ya Nna
  rationale: Nke a na-ejigide usoro ‘ịbụụrụ ya nna’ nke Greek ma na-ada nke ọma n’Igbo.
- source_word: καὶ αὐτὸς ἔσται μοι εἰς υἱόν
  choice: ya onwe ya ga-abụrụkwa m nwa nwoke
  rationale: “Ya onwe ya” na-egosipụta ike αὐτός, ebe “ga-abụrụ m nwa nwoke” na-edobe ntụnyere na nhazi nke nkebi bu ya ụzọ.
theological_decisions:
- issue: Nkọwa nke “taa ka m mụrụ gị”
  choice: E debere okwu ọmụmụ ahụ n’onwe ya n’enweghị ịkọwa oge ma ọ bụ ụdị ọmụmụ a na-ekwu.
  alternative: Ịkọwa ya kpọmkwem dị ka echichi eze, mbilite n’ọnwụ, ọbịbịa n’ụwa, ma ọ bụ mmekọrịta ebighị ebi nke Ọkpara na Nna.
  rationale: Amaokwu ahụ na-ekwughachi Abụ Ọma 2:7, ma okwu ya n’ebe a ekpebighị n’onwe ya n’etiti nghọta ndị ahụ. Nsụgharị ahụ kwesịrị idebe esemokwu na omimi ahụ.
- issue: Asụsụ Ọkpara/nwa n’amaokwu abụọ ahụ
  choice: E ji “Ọkpara” mee aha pụrụ iche n’okwu mbụ, ma jiri “nwa nwoke” mee usoro ọgbụgba ndụ n’okwu nke abụọ.
  alternative: Iji “Ọkpara” n’ebe abụọ ahụ, ma ọ bụ iji “nwa nwoke” n’ebe abụọ ahụ.
  rationale: 'Hibru na-etinye amaokwu abụọ ahụ n’ọrụ banyere Ọkpara, ma ha sitere n’usoro edemede abụọ dị iche: nke mbụ bụ okwu a na-agwa Ọkpara ozugbo, nke abụọ bụ usoro nna na nwa sitere na 2 Samuel 7:14. Nhọrọ a anaghị ekpochapụ ọdịiche edemede ahụ.'
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma doo anya, mee ya. E debere ụda ajụjụ nkwupụta ahụ, nhazi uri nke amaokwu abụọ ahụ, na asụsụ nna na nwa, ma zere ịtinye nkọwa otu ụka ma ọ bụ otu onye.
