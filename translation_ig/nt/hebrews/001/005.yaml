  - severity: medium
    issue: Nhazi ajụjụ mbụ
    rationale: Ntụgharị dị ugbu a anaghị akọwa nke ọma na Chineke bụ onye na-ekwu okwu nye mmụọ ozi; ọ na-ada ntakịrị mgbagwoju anya n’usoro Igbo.
