  source_fidelity: A chọrọ mmezi dị nta ma dị mkpa. “Ọkpara” pụtara nwa mbụ n’Igbo, ebe υἱός n’ebe a pụtara “nwa nwoke/Son” naanị, ọ bụghị “nwa mbụ.” Ajụjụ mmalitekwa kwesịrị igosi nke ọma na e kwuru okwu ahụ *nye* otu n’ime ndị mmụọ ozi.
  naturalness: Usoro “ọ̀ bụ onye n’ime ndị mmụọ ozi ka o kwuru mgbe ọ bụla sị” adịghị ada nke ọma n’Igbo nke oge a, n’ihi na o nwere ike ịdị ka onye mmụọ ozi bụ onye kwuru okwu ahụ. “Ònye n’ime ndị mmụọ ozi ka Chineke gwara mgbe ọ bụla, sị” doro anya ma bụrụkwa nke okike.
  terminology: E dochiela “Ọkpara” anya na “Nwa m,” ka a ghara itinye echiche “nwa mbụ” nke na-adịghị na Greek. E debere “nwa nwoke” n’okwu nke abụọ iji gosipụta υἱόν, ma e jighị mkpụrụedemede ukwu na “nna” na “nwa nwoke,” dịka okwu ọgbụgba ndụ e hotara.
