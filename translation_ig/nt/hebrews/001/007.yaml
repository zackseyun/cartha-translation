  text: καὶ πρὸς μὲν τοὺς ἀγγέλους λέγει· Ὁ ποιῶν τοὺς ἀγγέλους αὐτοῦ πνεύματα, καὶ τοὺς λειτουργοὺς αὐτοῦ πυρὸς φλόγα·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/007.yaml
  text: And about the angels he says[a], “He makes his angels winds, and his ministers a flame of fire.”
translation:
  language: ig
  text: Ma banyere ndị mmụọ ozi, ọ na-ekwu, “Ọ na-eme ka ndị mmụọ ozi ya bụrụ ifufe[a], na-emekwa ka ndị na-ejere ya ozi bụrụ ire ọkụ.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ, “mmụọ”: okwu Grik ahụ nwere ike ịpụta ma “ifufe” ma “mmụọ.”'
    reason: alternative_reading
lexical_decisions:
- source_word: πρὸς μὲν τοὺς ἀγγέλους
  choice: Ma banyere ndị mmụọ ozi
  rationale: A ghọtara πρός n’ebe a dị ka ihe a na-ekwu banyere ya, ọ bụghị okwu a na-agwa ndị mmụọ ozi kpọmkwem. “Ma” na-egosikwa ntụnyere dị n’etiti ha na Ọkpara n’amaokwu ndị gbara ya gburugburu.
- source_word: λέγει
  choice: ọ na-ekwu
  rationale: E debere oge ugbu a nke usoro e ji webata ihe e dere n’Akwụkwọ Nsọ.
- source_word: Ὁ ποιῶν
  choice: Ọ na-eme ka ... bụrụ
  rationale: Nke a na-egosipụta ọrụ ποιῶν n'ụzọ Igbo dị ndụ ma doo anya, na-enweghị ịgbanwe ya ka ọ bụrụ ‘na-ahọpụta.’
- source_word: ἀγγέλους
  choice: ndị mmụọ ozi
  rationale: Ihe ndị gbara amaokwu a gburugburu na-ekwu maka ndị mmụọ ozi nke eluigwe, ya mere okwu a ka ‘ndị ozi’ n’ozuzu ya dabara.
- source_word: πνεύματα
  choice: ifufe
  rationale: πνεύματα nwere ike ịpụta ‘ifufe’ ma ọ bụ ‘mmụọ.’ ‘Ifufe’ dabara nke ọma na ndabere Abụ Ọma 104:4 na ihe oyiyi yiri ya, ‘ire ọkụ’; e debere ‘mmụọ’ n’ala peeji iji ghara ikpochapụ mgbagwoju anya ahụ.
- source_word: λειτουργοὺς
  choice: ndị na-ejere ya ozi
  rationale: Nkebiokwu a na-egosi ndị na-arụ ọrụ n’ozi ya, ma na-ezere itinye aha ọkwa ụka nke oge ọzọ n’ime ederede ahụ.
- source_word: πυρὸς φλόγα
  choice: ire ọkụ
  rationale: “Ire ọkụ” bụ okwu Igbo e ji eme ihe n’ụzọ okike maka otu flame, ma na-echekwa ihe oyiyi uri nke okwu Grik ahụ.
- source_word: αὐτοῦ
  choice: ya
  rationale: Nnochiaha nwe a na-ezo aka n’ebe Chineke nọ, dịka ọnọdụ okwu ahụ si dị.
theological_decisions:
- issue: Ihe πνεύματα pụtara n’ihe e hotara n’Abụ Ọma 104:4
  choice: ifufe
  alternative: mmụọ
  rationale: “Ifufe” dabara na ndabere Hibru na ntụnyere ya na ‘ire ọkụ,’ ma okwu Grik ahụ nwekwara ike ịpụta ‘mmụọ.’ Ya mere, e chekwara nhọrọ ọzọ ahụ n’ala peeji kama idozi esemokwu nkọwa ahụ kpamkpam.
translation_notes:
  register: Igbo Izugbe nke oge a, dị nsọ ma dị mfe nghọta. E ji “ndị na-ejere ya ozi” zere nghọtahie nke aha ọkwa ụka, ebe “ire ọkụ” na-enye ihe oyiyi uri n’ụzọ Igbo sitere n’okike.
