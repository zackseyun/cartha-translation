    issue: Verb coordination in the quotation is awkward.
    rationale: “Ọ na-eme ka ... bụrụ ..., meekwa ka ... bụrụ ...” is less idiomatic because “meekwa” does not clearly coordinate with the present indicative “na-eme.” Use “na-emekwa ka” for a parallel present-tense clause.
