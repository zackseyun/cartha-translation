review_pass:
  verdict: revise
  source_fidelity: 'The principal clauses and referents are accurately represented: the plural pronouns refer to the created order, the contrast is retained, and the garment simile is preserved. However, διαμένεις is present tense, so the future form “ga-anọgide” should be changed to a present durative expression. “Ga-akakwa nká” is not the best standard rendering of the future passive παλαιωθήσονται; “ga-aka nká” directly conveys ‘will grow old/become old.’'
  naturalness: “Ma gị onwe gị na-adịgide” is idiomatic, dignified Standard Igbo for the continuing permanence expressed by διαμένεις. Placing the lexical footnote immediately after “ga-ala n’iyi” makes its scope clear.
  terminology: “Ala n’iyi,” “dịgide,” “aka nká,” and “uwe” are clear, modern Standard Igbo choices and do not add doctrinal interpretation. The cross-reference note should not add “ruo mgbe ebighị ebi,” since that wording exceeds this verse’s explicit statement.
  issues:
  - severity: medium
    issue: Tense/aspect of διαμένεις
    rationale: The Greek form is present indicative (‘you remain/continue’), whereas “gị onwe gị ga-anọgide” is future. “Gị onwe gị na-adịgide” preserves the ongoing contrast.
  - severity: medium
    issue: Rendering of παλαιωθήσονται
    rationale: “Ga-akakwa nká” is awkward and does not straightforwardly render the future sense. “Ga-aka nká” is natural Standard Igbo and retains the image of becoming old.
  - severity: low
    issue: Cross-reference footnote overstates the verse
    rationale: “Ruo mgbe ebighị ebi” is not stated in Hebrews 1:11. The note may describe the contrast in endurance without adding that temporal expression.
  - severity: low
    issue: Footnote-a anchor placement
    rationale: The lexical alternative concerns “ga-ala n’iyi,” not the final garment clause; it should be anchored directly after that expression.
  revised_text: Ha ga-ala n’iyi[a], ma gị onwe gị na-adịgide; ha niile ga-aka nká dị ka uwe.[b]
