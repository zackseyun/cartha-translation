  text: αὐτοὶ ἀπολοῦνται, σὺ δὲ διαμένεις· καὶ πάντες ὡς ἱμάτιον παλαιωθήσονται,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/011.yaml
  text: They will perish[a], but you remain; and they all will wear out like a garment[b],
translation:
  language: ig
  text: Ha ga-ala n’iyi[a], ma gị onwe gị na-adịgide; ha niile ga-aka nká dị ka uwe.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ga-agafe.”
    reason: lexical_alternative
  - marker: b
    text: Ihe oyiyi a na-ekwughachi Abụ Ọma 102:25–27, na-egosi ọdịiche dị n’etiti ihe e kere eke na-adịru nwa oge na onye a na-agwa okwu, bụ́ onye na-adịgide.
    reason: cross_reference
lexical_decisions:
- source_word: αὐτοὶ
  choice: Ha
  rationale: Ọ na-ezo aka n’eluigwe na ụwa ndị a kpọtụrụ aha n’amaokwu bu ụzọ; ‘Ha’ bụ ụzọ nkịtị e si kwuo ya n’Igbo.
- source_word: ἀπολοῦνται
  choice: ga-ala n’iyi
  rationale: Ọ na-egosi na ha ga-akwụsị ịdị adị ma ọ bụ laa n’iyi, n’ebughị ụzọ kọwaa onye ma ọ bụ ihe ga-eme ka nke ahụ mee.
- source_word: σὺ δὲ
  choice: ma gị onwe gị
  rationale: ‘Ma’ na-egosi nnukwu ọdịiche, ebe ‘gị onwe gị’ na-ebupụta ike dị na nnọchiaha Greek a kpọmkwem.
- source_word: διαμένεις
  choice: ga-anọgide
  rationale: Ọ na-egosi ịnọgide ịdị adị, n’ụzọ na-emegide ihe e kere eke nke ga-ala n’iyi.
- source_word: πάντες
  choice: ha niile
  rationale: Ọ na-achịkọta ihe niile e kere eke a kpọtụrụ aha n’ọnọdụ a.
- source_word: ὡς ἱμάτιον
  choice: dị ka uwe
  rationale: ‘Uwe’ bụ okwu sara mbara ma doo anya nke na-edobe ntụnyere ahụ n’ebughị ụzọ mee ka ọ bụrụ otu ụdị uwe kpọmkwem.
- source_word: παλαιωθήσονται
  choice: ga-akakwa nká
  rationale: Ọ na-egosi ịka nká ma ọ bụ ịgwụ n’ihi ogologo oge; okwu a na-edobe ma echiche ịka nká ma ihe oyiyi uwe na-eyi ochie.
theological_decisions:
- issue: Onye a na-agwa okwu na ihe ọ pụtara banyere Kraịst
  choice: 'E debere ya dị ka okwu a na-agwa Ọkpara ozugbo: ‘gị onwe gị ga-anọgide.’'
  alternative: Ịgbakwunye aha ‘Ọkpara’ ma ọ bụ nkọwa ozizi n’ahịrị amaokwu ahụ.
  rationale: N’ọnọdụ Hibru 1, onye dere akwụkwọ ahụ tinyere okwu Abụ Ọma 102 n’Ọkpara. Nsụgharị ahụ na-edobe onye nke abụọ a na-agwa okwu ozugbo, ma ọ naghị etinye nkọwa ozizi na-adịghị n’ahịrị Greek.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị ùgwù ma dị mfe nghọta. E ji ‘ga-ala n’iyi’ chekwaa ike okwu Greek ahụ, jiri ‘ga-akakwa nká dị ka uwe’ mee ka ihe oyiyi uwe na-eyi ochie pụta ìhè. Akara nkọwa ala ala [a] na [b] dị n’ederede isi.
