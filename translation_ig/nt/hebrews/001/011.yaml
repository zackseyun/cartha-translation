revisions:
- from: Ha ga-ala n’iyi, ma gị onwe gị ga-anọgide; ha niile ga-akakwa nká dị ka uwe.[a][b]
  to: Ha ga-ala n’iyi[a], ma gị onwe gị na-adịgide; ha niile ga-aka nká dị ka uwe.[b]
  rationale: The revision preserves the direct address and emphatic contrast while matching the Greek present tense of διαμένεις and the future sense of παλαιωθήσονται. It also corrects the scope of the lexical footnote and limits the cross-reference note to what the verse and its cited imagery support.
