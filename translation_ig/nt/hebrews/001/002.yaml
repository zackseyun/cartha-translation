id: HEB.1.2
reference: Hebrews 1:2
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐπ’ ἐσχάτου τῶν ἡμερῶν τούτων ἐλάλησεν ἡμῖν ἐν υἱῷ, ὃν ἔθηκεν κληρονόμον πάντων, δι’ οὗ καὶ ⸂ἐποίησεν τοὺς αἰῶνας⸃·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/002.yaml
  text: in these last days he has spoken to us in a Son[a], whom he appointed heir of all things[b], through whom he also made the ages.
translation:
  language: ig
  text: N’ụbọchị ikpeazụ ndị a, ọ gwala anyị okwu n’ime Ọkpara[a], onye ọ họpụtara ka ọ bụrụ onye nketa ihe niile, onye o sikwa n’aka ya kee usoro oge niile[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “site n’Ọkpara.” N’asụsụ Grik, okwu ahụ bụ n’ụzọ nkịtị “n’ime Ọkpara”; enweghịkwa mkpụrụokwu nkọwa (article) n’ihu “Ọkpara.” Nke a na-emesi ụzọ Chineke si kwuo okwu, nakwa ịdị elu okwu a, ike.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsị, “kee eluigwe na ụwa dum” ma ọ bụ “kee ụwa niile.” Okwu Grik a sụgharịrị “usoro oge niile” nwere ike ịpụta oge dị iche iche, ma n’ọnọdụ ụfọdụ ọ na-agụnyekwa usoro ihe niile e kere eke.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπ’ ἐσχάτου τῶν ἡμερῶν τούτων
  choice: N’ụbọchị ikpeazụ ndị a
  rationale: Nke a bụ ụzọ Igbo dị mfe ma bụrụkwa nke e ji asụ okwu ugbu a si egosipụta oge ikpeazụ ahụ, na-edebe ike okwu banyere njedebe oge.
- source_word: ἐλάλησεν ἡμῖν
  choice: ọ gwala anyị okwu
  rationale: Ụdị ngwaa zuru ezu “gwala” na-egosi na okwu ahụ emeela, ma ihe ọ pụtara ka dị mkpa ugbu a; ọ bụkwa okwu Igbo nkịtị.
- source_word: ἐν υἱῷ
  choice: n’ime Ọkpara
  rationale: “N’ime” na-edebe ọdịdị ἐν ma na-egosipụta na Ọkpara bụ ụzọ na ọnọdụ nke okwu Chineke kacha elu. E tinyeghị “ya” ma ọ bụ “otu” n’ihi na ha adịghị n’asụsụ Grik, Igbo enweghịkwa articles kwekọrọ kpọmkwem na nke Grik.
- source_word: ὃν ἔθηκεν κληρονόμον πάντων
  choice: onye ọ họpụtara ka ọ bụrụ onye nketa ihe niile
  rationale: “Họpụtara ka ọ bụrụ” na-egosipụta nhọpụta ma ọ bụ idobe mmadụ n’ọrụ; “onye nketa ihe niile” na-edebe oke sara mbara nke πάντων.
- source_word: δι’ οὗ
  choice: onye o sikwa n’aka ya
  rationale: Akpaalaokwu Igbo a na-egosi onye e sitere n’aka ya mee ihe, ya bụ agency/instrumentality nke διά tinyere genitive; “-kwa” na-edebekwa καί.
- source_word: ἐποίησεν
  choice: kee
  rationale: N’ọnọdụ a, “kee” bụ okwu Igbo kacha doo anya maka ime ka usoro e kere eke dịrị, ọ bụ ezie na ποιέω n’onwe ya pụtara n’obosara “mee.”
- source_word: τοὺς αἰῶνας
  choice: oge niile
  rationale: “Oge niile” na-edebe akụkụ oge nke αἰῶνες ma ghara imechi ihe ọ pụtara naanị n’ụwa a na-ahụ anya. Ihe okwu ahụ nwere ike ịpụta gbasara eluigwe na ụwa dum dị n’ala ala peeji.
theological_decisions:
- issue: Ike gbasara Ọkpara dị na ἐν υἱῷ
  choice: n’ime Ọkpara
  alternative: site n’Ọkpara; n’ime Ọkpara ya
  rationale: Nhọrọ a na-edebe usoro okwu Grik nke na-enweghị article tupu υἱῷ ma ghara ịgbakwunye nnọchiaha “ya.” Ọ na-ahapụkwa ἐν ka ọ gosi ihe karịrị naanị onye e ji mee ihe, n’agbanyeghị na “site n’Ọkpara” bụ ntụgharị Igbo dị mfe karị.
- issue: Oke ihe τοὺς αἰῶνας pụtara n’ọrụ Ọkpara n’okike
  choice: oge niile
  alternative: eluigwe na ụwa dum; ụwa niile
  rationale: Okwu Grik nwere ike ịpụta oge dị iche iche ma gbasaa ruo n’usoro ihe niile e kere eke. Isi okwu na-edebe nghọta gbasara oge; ala ala peeji na-egosi nghọta gbasara eluigwe na ụwa dum, n’enweghị ime ka otu akụkụ kpuchie nke ọzọ.
translation_notes:
  register: E ji Standard Igbo nke dị ugwu ma doo ndị mmadụ nkịtị anya. “N’ime Ọkpara” bụ ụkpụrụ dị ntakịrị elu karịa okwu mkparịta ụka iji chekwaa ọdịdị na nrụgide nke Grik; ala ala peeji na-enye ụdị Igbo dị mfe karị. E zere “Ọkpara ya” ka a ghara ịgbakwunye ihe na-adịghị n’usoro okwu isi mmalite.
