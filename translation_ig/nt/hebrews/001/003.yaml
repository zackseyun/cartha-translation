id: HEB.1.3
reference: Hebrews 1:3
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὃς ὢν ἀπαύγασμα τῆς δόξης καὶ χαρακτὴρ τῆς ὑποστάσεως αὐτοῦ, φέρων τε τὰ πάντα τῷ ῥήματι τῆς δυνάμεως, ⸂δι’ αὑτοῦ⸃ καθαρισμὸν ⸂τῶν ἁμαρτιῶν ποιησάμενος⸃ ἐκάθισεν ἐν δεξιᾷ τῆς μεγαλωσύνης ἐν ὑψηλοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/003.yaml
  text: He[a], being the radiance of his glory and the exact imprint of his being, and sustaining all things by the word of his power, after making purification for sins through himself[b], sat down at the right hand of the Majesty on high[c],
translation:
  language: ig
  text: Onye ahụ[a] bụ ìhè na-apụta n'ebube Chineke na akara kpọmkwem nke ihe Chineke bụ[b]. Ọ na-eji okwu nke ike ya akwado ihe niile. Mgbe o mesịrị nsachapụ mmehie site n'onwe ya[c], ọ nọdụụrụ ala n'aka nri nke Onye Ukwu ahụ n'ebe kachasị elu[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Onye ahụ” na-ezo aka n'Ọkpara ahụ a kpọrọ aha n'amaokwu nke 2.
    reason: referent_clarification
  - marker: b
    text: Ma ọ bụ, “akara kpọmkwem nke ọdịdị ya” ma ọ bụ “nke ezi ịdị adị ya.”
    reason: lexical_alternative
  - marker: c
    text: Ụfọdụ ihe odide oge ochie enweghị “site n'onwe ya”; ihe odide SBLGNT gụnyere ya.
    reason: textual_variant
  - marker: d
    text: Ma ọ bụ, “n'elu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπαύγασμα
  choice: ìhè na-enwu site n'ebube Chineke
  rationale: Nke a na-egosipụta ìhè ebube nke na-enwupụta, kama iji okwu nwere ike ime ka Ọkpara yie nanị onyinyo na-egosipụta ìhè ọzọ.
- source_word: χαρακτήρ
  choice: akara zuru nnọọ oke
  rationale: Ọ na-echekwa oyiyi nke akara e biri nke kwekọrọ kpọmkwem n'ihe e ji bie ya.
- source_word: ὑπόστασις
  choice: ihe Chineke bụ
  rationale: Nke a na-egosi ezi ịdị adị ya n'okwu Igbo doro anya, na-ebubataghị okwu nkà ihe ọmụma e guzobere ọtụtụ afọ ka e mesịrị.
- source_word: φέρων
  choice: na-akwado
  rationale: Na-egosi ọrụ na-aga n'ihu nke ijide na idobe ihe niile.
- source_word: τὰ πάντα
  choice: ihe niile
  rationale: Na-echekwa obosara okwu Grik n'enweghị imechi ya naanị n'ụwa a na-ahụ anya.
- source_word: τῷ ῥήματι τῆς δυνάμεως
  choice: okwu nke ike ya
  rationale: Na-echekwa njikọ kpọmkwem dị n'etiti okwu ya na ike ya.
- source_word: δι’ αὑτοῦ
  choice: site n'onwe ya
  rationale: Na-anọchi anya preposition διά na reflexive αὑτοῦ dịka ihe odide SBLGNT siri dị.
- source_word: καθαρισμὸν τῶν ἁμαρτιῶν
  choice: mee ka e sachapụ mmehie
  rationale: Na-egosi nsachapụ nke metụtara mmehie ma na-adịkwa mfe nghọta n'Igbo ugbu a.
- source_word: ἐν δεξιᾷ
  choice: n'aka nri
  rationale: Ọ bụ ụzọ Igbo a na-ejikarị egosi ọnọdụ nsọpụrụ n'aka nri.
- source_word: ἐν ὑψηλοῖς
  choice: n'ebe kachasị elu
  rationale: Na-edobe echiche nke eluigwe ma ghara ịkọwa okwu ahụ karịa ka Grik si kwuo.
theological_decisions:
- issue: Ike okwu ἀπαύγασμα na χαρακτήρ gbasara onye Ọkpara bụ
  choice: ìhè na-enwu site n'ebube Chineke na akara zuru nnọọ oke
  alternative: onyinyo ebube na onye nnọchiteanya ya
  rationale: Nhọrọ a na-echekwa nkwupụta siri ike nke amaokwu ahụ banyere njikọ Ọkpara na ebube na ezi ịdị adị Chineke, na-emeghị ya naanị onye na-anọchi anya Chineke.
- issue: Nkọwa ὑπόστασις
  choice: ihe Chineke bụ
  alternative: ụdịdị ya / ihe mejupụtara ịdị adị ya
  rationale: Ọ na-echekwa echiche banyere ezi ịdị adị Chineke ma zere ibubata kpọmkwem asụsụ nkà mmụta okpukpe nke e guzobere mgbe e mesịrị.
- issue: Ọdịiche ihe odide gbasara δι’ αὑτοῦ
  choice: gụnye “site n'onwe ya” n'ahịrị bụ isi
  alternative: hapụ okwu ahụ
  rationale: SBLGNT nyere maka ọrụ a gụnyere δι’ αὑτοῦ; a kọwara ọdịiche ihe odide ahụ n'ala ala peeji.
- issue: Onye okwu “ya” na-ezo aka na ya na nkebi mbụ
  choice: mee ka “ebube Chineke” na “ihe Chineke bụ” pụta ìhè
  alternative: hapụ naanị nnọchiaha “ya”
  rationale: N'Igbo, ikwughachi “Chineke” na-eme ka okwu doo anya n'enweghị ịgbanwe onye nnọchiaha Grik na-ezo aka na ya.
translation_notes:
  register: 'Standard Igbo dị ugwu ma dị mfe nghọta. E kewara ogologo ahịrịokwu Grik ahụ n''ahịrịokwu atọ ka ọ na-agụ nke ọma n''Igbo, ebe a ka debere usoro echiche ya: onye Ọkpara bụ, ọrụ ọ na-arụ, nsachapụ mmehie, na ịnọdụ n''aka nri Onye Ukwu ahụ. A kpọrọ θεός “Chineke” naanị iji mee ka onye nnọchiaha αὐτοῦ na-ezo aka na ya doo anya; “Onye Ukwu ahụ” na-echekwa ụzọ mgbagharị okwu μεγαλωσύνη.'
