revisions:
- from: Onye ahụ[a] bụ ìhè na-enwu site n'ebube Chineke na akara zuru nnọọ oke nke ihe Chineke bụ[b]. Ọ na-ejikwa okwu nke ike ya akwado ihe niile. Mgbe o sitere n'onwe ya mee ka e sachapụ mmehie[c], ọ nọdụrụ ala n'aka nri nke Onye Ukwu ahụ n'ebe kachasị elu[d].
  to: Onye ahụ[a] bụ ìhè na-apụta n'ebube Chineke na akara kpọmkwem nke ihe Chineke bụ[b]. Ọ na-eji okwu nke ike ya akwado ihe niile. Mgbe o mesịrị nsachapụ mmehie site n'onwe ya[c], ọ nọdụụrụ ala n'aka nri nke Onye Ukwu ahụ n'ebe kachasị elu[d].
  rationale: E megharịala naanị ebe ndị nwere nsogbu doro anya n'ihe gbasara nkwekọrịta na Grik na asụsụ Igbo. E debere «site n'onwe ya» n'ahịrị bụ isi, dịka ọgụgụ SBLGNT δι’ ἑαυτοῦ siri dị, ma a hapụghị nkọwa ụka ma ọ bụ ntụgharị na-agbakwunye nkọwa karịa ihe Grik kwuru. Akara ala peeji niile dabara ugbu a n'okwu ndị e tinyere akara ha.
  reviewer_model: gpt-5.6-terra
