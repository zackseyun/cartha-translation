  text: Πολυμερῶς καὶ πολυτρόπως πάλαι ὁ θεὸς λαλήσας τοῖς πατράσιν ἐν τοῖς προφήταις
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/001.yaml
  text: Long ago[c][b][a], God spoke to the fathers in many parts and in many ways by the prophets.
translation:
  language: ig
  text: N’oge gara aga[a], Chineke gwara ndị nna ochie[b] okwu n’ọtụtụ akụkụ, nakwa n’ụzọ dị iche iche site n’aka ndị amụma[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “N’oge ochie.”
    reason: lexical_alternative
  - marker: b
    text: N’ụzọ nkịtị, “ndị nna”; a pụkwara ịsụgharị ya, “ndị nna ochie.”
    reason: lexical_alternative
  - marker: c
    text: A pụkwara ịsụgharị ya, “site n’aka ndị amụma”; n’ụzọ nkịtị, “n’ime ndị amụma.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Πολυμερῶς
  choice: n’ọtụtụ akụkụ
  rationale: Nke a na-egosi na mkpughe mbụ bịara n’akụkụ dị iche iche, ma na-edobe ọdịiche ya na πολυτρόπως, nke na-ekwu maka ụzọ dị iche iche.
- source_word: πολυτρόπως
  choice: n’ụzọ dị iche iche
  rationale: Ọ bụ okwu Igbo doro anya ma bụrụkwa nke a na-eji taa akọwa ụdị ụzọ ma ọ bụ usoro dị iche iche.
- source_word: πάλαι
  choice: N’oge gara aga
  rationale: Ọ na-egosi oge dị anya gara aga n’asụsụ Igbo dị ugbu a, na-enweghị iji okwu ochie siri ike.
- source_word: ὁ θεὸς
  choice: Chineke
  rationale: Nke a bụ nsụgharị kwụ ọtọ nke onye na-eme ihe n’ahịrịokwu ahụ.
- source_word: λαλήσας
  choice: gwara ... okwu
  rationale: Ọ bụ ụzọ Igbo ebumpụta ụwa si ekwu ‘spoke to’; e mere participle Grik ahụ ka ọ bụrụ ngwaa zuru ezu maka nghọta amaokwu a, ma a naghị ehichapụ njikọ oge ya na amaokwu nke abụọ.
- source_word: τοῖς πατράσιν
  choice: ndị nna nna
  rationale: Nke a na-echekwa okwu metụtara ndị nna ochie nke ndị ahụ, n’agbanyeghị na n’Igbo ọ pụkwara ịgụnye echiche nke ndị nna ochie n’ozuzu.
- source_word: ἐν τοῖς προφήταις
  choice: site n’ọnụ ndị amụma
  rationale: Nke a na-egosi na Chineke bụ onye kwuru okwu, ebe ndị amụma bụ ndị o ji kwuo ya; ọ bụ ụzọ Igbo dị mma isi gosipụta instrumental sense nke ἐν.
theological_decisions:
- issue: Otu e si sụgharị participle λαλήσας n’ihe metụtara Ndị Hibru 1:2
  choice: Iji ngwaa zuru ezu, ‘Chineke gwara ... okwu,’ ma hapụ ọdịiche oge na amaokwu nke abụọ ka ọ dị.
  alternative: ‘Chineke, ebe o kwuworo okwu...’ ma ọ bụ usoro participle yiri nke ahụ.
  rationale: Usoro Grik na-ejikọta participle nke amaokwu 1 na ngwaa bụ isi nke amaokwu 2. Otú ọ dị, ebe a na-asụgharị amaokwu a naanị ya, ngwaa zuru ezu na-eme ka Igbo bụrụ nke nghọta ma ghara ịgbakwunye nkọwa ozizi ọzọ.
- issue: Ihe τοῖς πατράσιν na-ezo aka na ya
  choice: ndị nna nna
  alternative: ndị nna ochie anyị; ndị nna
  rationale: A naghị etinye ‘anyị,’ n’ihi na ọ dịghị na Grik. ‘Ndị nna nna’ na-edobe ntụaka akụkọ ọgbụgba ndụ ahụ ma bụrụkwa okwu Igbo a na-aghọta.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-edobe ọdịiche dị n’etiti ‘n’ọtụtụ akụkụ’ na ‘n’ụzọ dị iche iche,’ ma jiri ‘site n’ọnụ’ gosipụta ọrụ ndị amụma dị ka ndị Chineke ji kwuo okwu.
