  rationale: E dochiela "ndị nna nna" anya na "ndị nna ochie" ka e wee ghara ịpụta "grandparents" ma ka ntụaka τοῖς πατράσιν dịgide. E dochikwara "site n’ọnụ" anya na "site n’aka" iji ghara itinye "ọnụ" na-enweghị isi na Grik, ma ka ọrụ ndị amụma dị ka ndị Chineke ji kwuo okwu pụta ìhè. A hapụrụ "n’ọtụtụ akụkụ" na "n’ụzọ dị iche iche" iche iche, n’ihi na Πολυμερῶς na πολυτρόπως abụghị otu echiche.
