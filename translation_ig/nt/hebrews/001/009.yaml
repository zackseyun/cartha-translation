id: HEB.1.9
reference: Hebrews 1:9
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἠγάπησας δικαιοσύνην καὶ ἐμίσησας ἀνομίαν· διὰ τοῦτο ἔχρισέν σε ὁ θεός, ὁ θεός σου, ἔλαιον ἀγαλλιάσεως παρὰ τοὺς μετόχους σου·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/009.yaml
  text: You have loved righteousness and hated lawlessness; therefore God[a], your God, has anointed you with the oil of gladness beyond your companions.
translation:
  language: ig
  text: Ị hụrụ ezi omume[a] n’anya, kpọrọ mmebi iwu asị; n’ihi nke a, Chineke, Chineke gị, ejirila mmanụ ọṅụ tee gị karịa ndị ibe gị.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ikpe ziri ezi.” Okwu Grik a nwere ike ịpụta ezi omume ma ọ bụ ikpe ziri ezi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠγάπησας
  choice: Ị hụrụ … n’anya
  rationale: Oge gara aga dị mfe na Igbo na-egosipụta omume ahụ nke ọma ma na-adabara usoro okwu e hotara n’Abụ Ọma.
- source_word: δικαιοσύνην
  choice: ezi omume
  rationale: “Ezi omume” bụ okwu Igbo doro anya maka ịdị ezi omume n’ụzọ omume na mmekọrịta; ọ na-ahapụkwa “ikpe ziri ezi” dịka nghọta ọzọ kwesịrị ekwesị.
- source_word: ἐμίσησας
  choice: kpọọ … asị
  rationale: Nkebi a bụ ụzọ Igbo siri ike ma bụrụkwa nke e ji eme ihe mgbe niile iji gosi ịkpọ ihe asị, ma na-echekwa ọdịiche ya na ịhụ n’anya.
- source_word: ἀνομίαν
  choice: mmebi iwu
  rationale: “Mmebi iwu” na-egosipụta echiche nke ileghara iwu anya ma ọ bụ imegide ya, kama iji okwu sara mbara dịka ajọ omume.
- source_word: διὰ τοῦτο
  choice: n’ihi nke a
  rationale: Ọ na-echekwa njikọ nke ihe kpatara ya na ihe sochiri ya n’ụzọ Igbo dị eke.
- source_word: ἔχρισέν
  choice: ejirila … tee gị
  rationale: “Iji mmanụ tee mmadụ” bụ okwu Igbo kwesịrị ekwesị maka χρίω, ebe “-la” na-egosi omume emechara nke ka nwere mkpa ugbu a.
- source_word: ὁ θεός, ὁ θεός σου
  choice: Chineke, bụ Chineke gị
  rationale: Ọ na-echekwa nkwughachi ahụ na mmekọrịta dị n’okwu Grik n’enweghị ịgbakwunye nkọwa ozizi.
- source_word: ἔλαιον ἀγαλλιάσεως
  choice: mmanụ ọṅụ
  rationale: Ọ na-echekwa ihe atụ nke mmanụ e ji ete mmadụ na ọṅụ dị ukwuu nke okwu Grik na-egosi.
- source_word: παρὰ
  choice: karịa
  rationale: N’ebe a παρά na-egosi ntụnyere na ịdị elu karịa ndị ọzọ; “karịa” bụ ụzọ Igbo kwụ ọtọ isi kwuo ya.
- source_word: μετόχους
  choice: ndị ibe gị
  rationale: “Ndị ibe gị” bụ okwu Igbo nkịtị maka ndị mmadụ na mmadụ nọkọrọ ma ọ bụ nwere oke ọnụ, n’enweghị ụda azụmahịa.
theological_decisions:
- issue: Nkọwa δικαιοσύνη n’okwu gbasara Eze/Mesaịa
  choice: ezi omume
  alternative: ikpe ziri ezi
  rationale: Isi okwu a na-elekwasị anya n’ịdị mma nke onye a na-agwa okwu, ma okwu Grik ahụ nwekwara ike ịpụta ikpe ziri ezi; e debere nghọta ọzọ ahụ n’ala peeji.
- issue: Ike okwu Kraịst dị na “Chineke, bụ Chineke gị”
  choice: Idobe nkwughachi na mmekọrịta ahụ dịka e dere ya
  alternative: Ịgbasa ya iji kọwaa mmekọrịta dị n’etiti Nna na Ọkpara
  rationale: Okwu ahụ na-ekwu banyere Ọkpara n’ụzọ dị elu ma na-akpọkwa Chineke “Chineke gị.” Nsụgharị ahụ na-echekwa esemokwu ozizi a n’enweghị ịkọwa ya karịa ihe odide kwuru.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị ugwu ma dị mfe nghọta. Ahịrịokwu ahụ na-echekwa ụdị uri na ntụnyere nke ihe e hotara, ma zere okwu ụka pụrụ iche ma ọ bụ nkọwa ozizi agbakwunyere.
