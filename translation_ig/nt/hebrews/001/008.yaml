source:
  edition: SBLGNT
  text: πρὸς δὲ τὸν υἱόν· Ὁ θρόνος σου ὁ θεὸς εἰς τὸν αἰῶνα τοῦ αἰῶνος, ⸂καὶ ἡ ῥάβδος τῆς εὐθύτητος⸃ ῥάβδος τῆς βασιλείας ⸀σου.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/008.yaml
  text: But of the Son he says[a], “Your throne, O God, is forever and ever[b], and the scepter of uprightness is the scepter of your kingdom.”
translation:
  language: ig
  text: Ma gbasara Ọkpara ahụ, ọ sịrị[a], “O Chineke, ocheeze gị dị ruo mgbe ebighị ebi; mkpanaka ọchịchị nke izi ezi[b] bụ mkpanaka ọchịchị nke alaeze gị.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ, n’agbanyeghị na nke a yikarịghị: “Chineke bụ ocheeze gị ruo mgbe ebighị ebi.” A na-arụrịta ụka banyere usoro okwu Grik ahụ, ma ịgụ ya dịka okwu a na-agwa Ọkpara ahụ kpọmkwem—“O Chineke, ocheeze gị”—kacha daba n’ihe gbara ya gburugburu na n’ike nke ihe e hotara.'
    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ, “ezi omume.” Okwu Grik ahụ nwere ike ịpụta izi ezi ma ọ bụ ịdị omume ziri ezi.
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸς δὲ τὸν υἱόν
  choice: Ma banyere Ọkpara ahụ, ọ sịrị
  rationale: N’usoro amaokwu ndị a, πρός na akara nnara nwere ike igosi onye a na-agwa okwu ma ọ bụ onye okwu ahụ gbasara. Nsụgharị a na-eweta ngwaa ikwu nke ahapụchara n’asụsụ Grik ma na-eme ka ọdịiche dị n’etiti Ọkpara ahụ na ndị mmụọ ozi doo anya n’Igbo.
- source_word: υἱόν
  choice: Ọkpara ahụ
  rationale: Ọ bụ aha pụrụ iche e ji akọwa Ọkpara ahụ n’ebe a. “Ọkpara ahụ” bụ okwu Igbo doro anya ma dịkwa ùgwù, nke na-echekwa ọnọdụ ya dịka aha.
- source_word: Ὁ θρόνος σου ὁ θεὸς
  choice: O Chineke, ocheeze gị
  rationale: A na-ewere ὁ θεός dịka okwu a na-akpọ onye a na-agwa okwu kpọmkwem. Nke a kacha daba n’usoro okwu na n’ike nke ihe e hotara, ebe a na-agwa Ọkpara ahụ okwu dịka “Chineke.” E debere nghọta ọzọ nwere ike ịdị na nkọwa ala peeji.
- source_word: εἰς τὸν αἰῶνα τοῦ αἰῶνος
  choice: ga-adị ruo mgbe niile ebighị ebi
  rationale: Nke a bụ akpaala okwu Grik na-egosi oge na-enweghị njedebe. Okwu Igbo a na-egosipụta ịdịgide ruo mgbe ebighị ebi n’asụsụ a na-aghọta ngwa ngwa.
- source_word: ῥάβδος
  choice: mkpanaka ọchịchị
  rationale: N’ọnọdụ eze na alaeze, ῥάβδος bụ mkpanaka eze nke na-anọchi anya ikike ịchị. “Mkpanaka ọchịchị” na-eme ka ihe ahụ na ọrụ ya doo onye Igbo nke oge a anya.
- source_word: τῆς εὐθύτητος
  choice: nke izi ezi
  rationale: εὐθύτης pụtara ịdị kwụ ọtọ, izi ezi, ma ọ bụ omume ziri ezi. “Izi ezi” na-echekwa isi echiche ahụ n’Igbo dị mfe ma dị ùgwù; “ezi omume” ka edebere dịka ụzọ ọzọ na nkọwa ala peeji.
- source_word: ῥάβδος τῆς βασιλείας σου
  choice: mkpanaka ọchịchị nke alaeze gị
  rationale: βασιλεία nwere ike ịpụta alaeze, ọchịchị eze, ma ọ bụ ịchị achị. “Alaeze gị” na-echekwa ihe oyiyi alaeze nke okwu Grik ahụ, ebe “mkpanaka ọchịchị” na-egosi akara ikike eze.
theological_decisions:
- issue: Ma ὁ θεός ọ̀ bụ okwu a na-akpọ Ọkpara ahụ “Chineke” kpọmkwem, ka ọ̀ bụ akụkụ ahịrịokwu pụtara “Chineke bụ ocheeze gị.”
  choice: 'A na-agwa Ọkpara ahụ okwu kpọmkwem: “O Chineke, ocheeze gị.”'
  alternative: “Chineke bụ ocheeze gị ruo mgbe niile ebighị ebi.”
  rationale: N’usoro Hibru 1, ihe ndị e hotara na-egosi ịdị elu na ọnọdụ pụrụ iche nke Ọkpara ahụ. Ịgụ ὁ θεός dịka onye a na-akpọ okwu dabara nke ọma n’usoro okwu Grik, n’isi iyi Septuagint nke Abụ Ọma 45:6, na n’ike nke arụmụka ahụ. Ma ebe usoro okwu ahụ ekwela ka e nwee nghọta ọzọ, e zoghị ya; e debere ya na nkọwa ala peeji.
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ “ocheeze” na “mkpanaka ọchịchị” iji chekwaa ihe oyiyi eze. Akara nkọwa ala peeji [a] na [b] nọ n’ahịrịokwu bụ isi, ebe nkọwa ndị ahụ na-echekwa nghọta ọzọ nke usoro okwu na nhọrọ mkpụrụokwu.
