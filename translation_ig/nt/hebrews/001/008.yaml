- from: Ma banyere Ọkpara ahụ, ọ sịrị[a], “O Chineke, ocheeze gị ga-adị ruo mgbe niile ebighị ebi, mkpanaka ọchịchị nke izi ezi bụkwa mkpanaka ọchịchị nke alaeze gị.”
