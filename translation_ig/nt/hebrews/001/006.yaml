id: HEB.1.6
reference: Hebrews 1:6
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὅταν δὲ πάλιν εἰσαγάγῃ τὸν πρωτότοκον εἰς τὴν οἰκουμένην, λέγει· Καὶ προσκυνησάτωσαν αὐτῷ πάντες ἄγγελοι θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/006.yaml
  text: And when he again brings the Firstborn into the world[a], he says[b], “And let all God’s angels worship him.”
translation:
  language: ig
  text: Mgbe ọ ga-akpọbatakwa Onye Mbụ a Mụrụ n’ụwa[a], ọ na-ekwu, “Ka ndị mmụọ ozi Chineke niile kpọọ isiala nye ya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Ọzọkwa, mgbe ọ ga-akpọbata Onye Mbụ a Mụrụ n’ụwa, ọ na-ekwu, ‘Ka ndị mmụọ ozi Chineke niile kpọọ isiala nye ya.’” Okwu Grik a sụgharịrị “-kwa-” nwere ike ịkọwa ma “akpọbata” ma “ọ na-ekwu.”
    reason: alternative_reading
lexical_decisions:
- source_word: ὅταν
  choice: Mgbe
  rationale: Na-ewebata nkebiokwu oge; n’ebe a, “mgbe” dabara n’ihe omume a kapịrị ọnụ karịa okwu ga-egosi ihe na-eme ugboro ugboro.
- source_word: δὲ
  choice: —
  rationale: Ọ bụ njikọ dị nro na Greek. A hapụrụ ya ka usoro Igbo wee bụrụ nke eke; “mgbe” na-aga n’ihu n’echiche gara aga n’enweghị itinye esemokwu na-adịghị n’ederede.
- source_word: πάλιν
  choice: -kwa- (akpọbatakwa)
  rationale: E jikọtara ya na ngwaa “akpọbata,” dịka “ọ ga-akpọbatakwa.” Ma Greek nwekwara ike ijikọ ya na “ọ na-ekwu”; e debere nke ahụ n’ala ala peeji.
- source_word: εἰσαγάγῃ
  choice: ọ ga-akpọbata
  rationale: “Ịkpọbata” na-egosi ime ka mmadụ bata n’ebe ma ọ bụ n’ọnọdụ a kpọrọ aha, ma bụrụkwa Igbo doro anya n’ebe a.
- source_word: τὸν πρωτότοκον
  choice: Onye Mbụ e Mụrụ
  rationale: E jiri ya dịka aha nsọpụrụ nke Ọkpara n’akụkụ okwu a. Nsụpe mkpụrụedemede ukwu na-egosi ojiji ahụ, ma okwu ahụ ka na-echekwa echiche ịbụ onye mbụ a mụrụ.
- source_word: εἰς τὴν οἰκουμένην
  choice: n’ụwa
  rationale: οἰκουμένη nwere ike ịpụta ụwa mmadụ bi na ya; “ụwa” bụ okwu Igbo eke ma doo anya n’ebe a.
- source_word: λέγει
  choice: ọ na-ekwu
  rationale: E chekwaghị onye isiokwu ahụ n’aha, dịka Greek si mee; n’usoro amaokwu ndị a, a na-aghọta na ọ bụ Chineke.
- source_word: προσκυνησάτωσαν
  choice: Ka ... kpọọ isiala nye
  rationale: “Ịkpọ isiala nye” na-egosi omume ofufe na nsọpụrụ miri emi, ma usoro “Ka...” na-echekwa ike iwu/arịrịọ nke ụdị ngwaa Greek ahụ.
- source_word: αὐτῷ
  choice: nye ya
  rationale: Nke a bụ ụzọ Igbo eke isi gosipụta onye a na-akpọ isiala nye.
- source_word: πάντες ἄγγελοι θεοῦ
  choice: ndị mmụọ ozi Chineke niile
  rationale: Nke a na-echekwa “niile,” “ndị mmụọ ozi,” na njikọ ha na Chineke n’usoro Igbo doro anya.
theological_decisions:
- issue: Ihe πάλιν na-akọwa
  choice: 'E jikọtara πάλιν na “akpọbata”: “ọ ga-akpọbatakwa Onye Mbụ e Mụrụ n’ụwa.”'
  alternative: 'A pụrụ ijikọ ya na “ọ na-ekwu”: “Ọzọkwa, mgbe ọ ga-akpọbata Onye Mbụ e Mụrụ n’ụwa, ọ na-ekwu...”'
  rationale: Ụtọasụsụ Greek kwere ka a gụọ ya n’ụzọ abụọ. Isi ederede gbasoro njikọ ya na ngwaa na-esote ya, ma ala ala peeji chekwara nghọta nke ọzọ ka e wee ghara ikpochapụ mgbagwoju anya dị n’isi mmalite.
- issue: Ike okwu προσκυνέω mgbe a na-ekwu banyere Ọkpara
  choice: “kpọọ isiala nye,” n’echiche ofufe
  alternative: “kpọọ isi ala n’ihu” ma ọ bụ “sọpụrụ”
  rationale: N’arụmụka Hibru 1 banyere ịdị elu Ọkpara karịa ndị mmụọ ozi, iwu ka ndị mmụọ ozi niile mee προσκυνέω nye ya karịrị nsọpụrụ nkịtị. “Kpọọ isiala nye” na-echekwa ma omume ahụ ma ịdị arọ nke ofufe, n’etinyeghị nkọwa ozizi ọzọ n’ederede.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ugwu ma dị mfe nghọta. “Onye Mbụ e Mụrụ” na-arụ ọrụ dịka aha nsọpụrụ n’ebe a. “Kpọọ isiala nye” bụ okwu ofufe doro anya nye ọtụtụ ndị na-asụ Igbo ma na-echekwa ihe oyiyi nke προσκυνέω. E tinyeghị ala ala peeji nke abụọ sitere na English POB n’ihi na “ndị mmụọ ozi Chineke niile” abụghị n’Igbo ihe ọzọ dị iche na “ndị mmụọ ozi niile nke Chineke” nke chọrọ nkọwa akwụkwọ.
