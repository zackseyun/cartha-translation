  to: Mgbe ọ ga-akpọbatakwa Onye Mbụ a Mụrụ n’ụwa[a], ọ na-ekwu, “Ka ndị mmụọ ozi Chineke niile kpọọ isiala nye ya.”
  rationale: Only the wording of the title for τὸν πρωτότοκον has been adjusted, from “Onye Mbụ e Mụrụ” to the more natural Standard Igbo “Onye Mbụ a Mụrụ.” The placement of πάλιν with “akpọbatakwa” is retained, and its alternative attachment to “ọ na-ekwu” remains explicitly preserved in the footnote.
