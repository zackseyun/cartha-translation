    reason: cross_reference
  revision_rationale: The revision preserves the Greek participial/resultant sense with “Ọ ghọworo,” renders κρείττων as superiority of rank, and explicitly represents the τοσούτῳ … ὅσῳ proportional comparison with “n’ókè … si ….” It retains the text’s ambiguity concerning the precise content of the inherited name, while the cross-reference footnote appropriately notes the ensuing context. Footnote a is corrected for Standard Igbo grammar and naturalness.
