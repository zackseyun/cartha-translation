translation:
  language: ig
  text: Ọ ghọworo onye karịrị ndị mmụọ ozi n’ịdị elu, n’ókè aha ahụ o ketara si dị ebube karịa nke ha.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “onye ka ndị mmụọ ozi mma ... aha ahụ o ketara ka nke ha pụtara ìhè karịa.”
    reason: lexical_alternative
  - marker: b
    text: Amaokwu ndị na-esote na-eme ka o doo anya na “aha” a metụtara utu aha na ọnọdụ ya dịka Ọkpara.
    reason: cross_reference
lexical_decisions:
- source_word: τοσούτῳ ... ὅσῳ
  choice: nke ukwuu ... dịka ... si
  rationale: 'Usoro a na-egosi ntụnyere nwere nha: ịdị elu ya karịa ndị mmụọ ozi kwekọrọ n’ịdị ebube nke aha o ketara karịa nke ha. Nke a bụ ụzọ Igbo dị ndụ si chekwaa mmekọrịta ntụnyere ahụ.'
- source_word: κρείττων
  choice: onye ka ... elu
  rationale: N’ebe a okwu ahụ na-egosi ịdị elu n’ọkwa, ọ bụghị ịdị mma n’omume; ya mere ‘onye ka ndị mmụọ ozi elu’ na-eme ka ebumnuche ahụ doo anya.
- source_word: γενόμενος
  choice: Ọ ghọwokwa
  rationale: ‘Ọ ghọwokwa’ na-anọchite aorist participle n'ụzọ Igbo dị mfe ma chekwaa echiche nke ịbanye n’ọnọdụ a, n’enweghị ikwu na e kere Ọkpara.
- source_word: τῶν ἀγγέλων
  choice: ndị mmụọ ozi
  rationale: Nke a bụ okwu Igbo a na-ejikarị eme ihe maka ndị mmụọ ozi, ma ọ dabara na genitive nke na-eso comparative.
- source_word: διαφορώτερον
  choice: dị ebube karịa
  rationale: N’okwu banyere aha e ketara, ‘dị ebube karịa’ na-egosi ùgwù na ịdị pụrụ iche karịrị nke ọzọ. ‘Ka mma’ nwekwara ike ịdị, ma ọ naghị egosi ọkwa na ùgwù nke ọma otú a.
- source_word: παρ’ αὐτοὺς
  choice: karịa nke ha
  rationale: '‘Nke ha’ na-emeju aha a na-atụnyere n’ụzọ Igbo nkịtị: aha o ketara dị ebube karịa aha nke ha.'
- source_word: κεκληρονόμηκεν
  choice: o ketara
  rationale: Igbo anaghị egosipụtakarị perfect tense dịka Bekee; ‘o ketara’ na-ekwupụta inweta ihe nketa, ebe ọnọdụ nke na-adịgide ruo ugbu a pụtara site n’ahịrịokwu dum.
- source_word: ὄνομα
  choice: aha ahụ
  rationale: ‘Aha ahụ’ na-echekwa okwu nkịtị nke Grik ma na-egosi otu aha pụrụ iche nke amaokwu ndị na-esote ga-akọwa, n’ebughị ụzọ kpọọ ya ‘Ọkpara’ n’amaokwu a.
theological_decisions:
- issue: Ihe γενόμενος (‘ọ ghọrọ’) nwere ike ịpụta banyere ọnọdụ Ọkpara
  choice: A sụgharịrị ya n’ụzọ kwụ ọtọ dịka ‘Ọ ghọwokwa,’ nke na-ezo aka n’ọnọdụ ya dị elu n’ebe a, n’enweghị ịkọwa na ọ malitere ịdị adị ma ọ bụ na ọ ghọrọ Chineke mgbe e mesịrị.
  alternative: ‘E mere ya’ ma ọ bụ ịkọwa ya dịka ihe na-egosi na e kere Ọkpara.
  rationale: Ọnọdụ okwu dị nso na-atụnyere Ọkpara na ndị mmụọ ozi ma na-ekwu maka ùgwù, ihe nketa, na ịnọ n’ocheeze. Nsụgharị ahụ kwesịrị ichekwa ngwaa Grik ma ghara itinye nkwubi okwu banyere ọdịdị ya nke amaokwu ahụ ekwughị.
- issue: Ihe ‘aha’ pụtara n’ọnọdụ okwu a
  choice: E debere ya dịka ‘aha ahụ,’ ka amaokwu ndị na-esote kọwaa aha na ọnọdụ Ọkpara ahụ.
  alternative: Ịsụgharị ya ozugbo dịka ‘utu aha Ọkpara’ ma ọ bụ nanị ‘ọkwa.’
  rationale: Grik kwuru naanị ‘aha.’ Idebe ya otú ahụ na-echekwa usoro edemede ahụ na nghọta sara mbara nke aha dịka njirimara na ùgwù, n’ebughị ụzọ kpebie nkọwa niile.
translation_notes:
  register: Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. E ji ‘onye ka ... elu’ gosipụta ntụnyere ọkwa n’enweghị echiche nke ịdị mma n’omume; e chekwara ‘aha’ n’ụdị nkịtị ka ọnọdụ okwu na-esote kọwaa ya.
