  - severity: medium
    issue: «eluigwe dị iche iche» maka οἱ οὐρανοί
    rationale: «dị iche iche» na-ekwu na eluigwe ndị ahụ dị iche n’iche, echiche nke Grik anaghị ekwu. «Eluigwe» bụ ụzọ Igbo nkịtị ma kwekọọ maka plural/cosmic “the heavens.”
