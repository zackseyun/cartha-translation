  text: καί· Σὺ κατ’ ἀρχάς, κύριε, τὴν γῆν ἐθεμελίωσας, καὶ ἔργα τῶν χειρῶν σού εἰσιν οἱ οὐρανοί·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/010.yaml
  text: And[a], “You, Lord, in the beginning laid the foundation of the earth, and the heavens are the works of your hands.”
translation:
  language: ig
  text: Ọzọkwa, “Gị, Onyenwe anyị, na mmalite[a], tọrọ ntọala ụwa; eluigwe bụ ọrụ aka gị.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “na mbụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καί
  choice: Ọ sịkwara
  rationale: Njikọ a na-ewebata amaokwu ọzọ n'usoro ihe e hotara. N'Igbo, ‘Ọ sịkwara’ na-eme ka njikọ ahụ na okwu ndị bu ya ụzọ doo anya n'ụzọ ebumpụta ụwa.
- source_word: Σὺ
  choice: Gị onwe gị
  rationale: Nnọchiaha ahụ pụtara ìhè ma nwee nkwusi ike na Grik; ‘Gị onwe gị’ na-echekwa nkwusi ike ahụ.
- source_word: κατ’ ἀρχάς
  choice: na mmalite
  rationale: Nke a na-egosi oge mbụ ma ọ bụ mgbe ihe niile malitere; ‘na mmalite’ bụ Igbo doro anya ma dabara n'ọnọdụ okike.
- source_word: κύριε
  choice: Onyenwe anyị
  rationale: Ọ bụ okwu ịkpọ κύριος aha ozugbo. ‘Onyenwe anyị’ bụ nsụgharị Igbo a na-aghọta nke ọma maka ‘Lord’ ma na-echekwa nkwanye ùgwù dị n'okwu ahụ.
- source_word: τὴν γῆν
  choice: ụwa
  rationale: N'ihi na e jikọtara ya na eluigwe n'okwu banyere okike, γῆ pụtara ụwa, ọ bụghị otu ala pụrụ iche.
- source_word: ἐθεμελίωσας
  choice: tọrọ ntọala
  rationale: Nke a na-echekwa ihe atụ ụlọ dị na ngwaa Grik, ya bụ ịtọ ntọala.
- source_word: ἔργα τῶν χειρῶν σού
  choice: ọrụ aka gị
  rationale: Akpaokwu Igbo a bụ nke ebumpụta ụwa ma na-echekwa echiche nke ihe aka mmadụ rụrụ na ihe oyiyi ahụ.
- source_word: οἱ οὐρανοί
  choice: eluigwe dị iche iche
  rationale: Ụdị ọtụtụ nke okwu Grik ka e gosiri n'ụzọ doro anya, ebe ọ ka na-adaba n'asụsụ okike nke Akwụkwọ Nsọ.
theological_decisions:
- issue: Itinye okwu Abụ Ọma 102 a na-agwa Onyenwe anyị n'Ọkpara n'ime Ndị Hibru 1
  choice: E debere okwu a na-agwa ya ozugbo, ‘Gị onwe gị, Onyenwe anyị,’ n'enweghị ime ka ike ya belata.
  alternative: Ịsụgharị ya n'ụzọ na-anọpụ iche ka njikọ ya na Ọkpara ghara ịpụta nke ọma.
  rationale: Grik kpọrọ κύριε aha ozugbo, ebe usoro isiokwu ahụ na-etinye okwu ahụ n'Ọkpara. Nsụgharị ahụ kwesịrị ichekwa nke a ma ghara ịgbakwunye nkọwa ozizi nke ederede n'onwe ya ekwughị.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke dị ugwu ma dịkwa mfe nghọta. E chekwara ụdị okwu e hotara, nkwusi ike dị na Σὺ, na ihe atụ nke ịtọ ntọala; a zere okwu ochie ma ọ bụ nkọwa metụtara otu ụka pụrụ iche.
