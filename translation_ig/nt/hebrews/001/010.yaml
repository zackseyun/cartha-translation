  verdict: revise
  source_fidelity: A chọrọ mmegharị obere ma dị mkpa. «Ọ sịkwara» na-agbakwunye ngwaa na isiokwu (“he also said”) nke καί naanị ya enweghị; a ga-asụgharị ya dịka njikọ, «Ọzọkwa». «Eluigwe dị iche iche» pụtara heavens ndị na-adị iche iche, ọ bụghị naanị ọtụtụ οἱ οὐρανοί.
  naturalness: «Gị, Onyenwe anyị, na mmalite, tọrọ ntọala ụwa; eluigwe bụ ọrụ aka gị» bụ Igbo ọkọlọtọ doro anya, na-echekwa ụda okwu e hotara na nkwanye ugwu ya. «Eluigwe» na-arụ ọrụ nke ọma dịka okwu nchịkọta maka “the heavens”; enweghị mkpa itinye «dị iche iche».
  terminology: «Onyenwe anyị» dabara dịka ụzọ Igbo Akwụkwọ Nsọ si akpọ κύριε n’ọrụ ịkpọ aha ozugbo. «Tọrọ ntọala» na «ọrụ aka gị» na-echekwa ihe atụ okike na ọrụ aka dị n’asụsụ Grik. Edebere «Gị» iji gosipụta nkwusi ike nke Σὺ n’enweghị ịgbakwunye echiche ọzọ.
