  to: Ma ònye n’ime ndị mmụọ ozi ka o kwuwo mgbe ọ bụla, sị, “Nọdụ ala n’aka nri m ruo mgbe m ga-eme ndị iro gị ka ha bụrụ ihe mgbakwasị ụkwụ gị[a]”?
