source:
  edition: SBLGNT
  text: πρὸς τίνα δὲ τῶν ἀγγέλων εἴρηκέν ποτε· Κάθου ἐκ δεξιῶν μου ἕως ἂν θῶ τοὺς ἐχθρούς σου ὑποπόδιον τῶν ποδῶν σου;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/013.yaml
  text: But to which of the angels has he ever said[a], ‘Sit at my right hand until I make your enemies a footstool for your feet’?”
translation:
  language: ig
  text: Ma ònye n’ime ndị mmụọ ozi ka o kwuwo mgbe ọ bụla, sị, “Nọdụ ala n’aka nri m ruo mgbe m ga-eme ndị iro gị ka ha bụrụ ihe mgbakwasị ụkwụ gị[a]”?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ruo mgbe m ga-edobe ndị iro gị n’okpuru ụkwụ gị.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸς τίνα δὲ τῶν ἀγγέλων
  choice: Ma ònye n’ime ndị mmụọ ozi
  rationale: “Ma” na-egosi ọdịiche dị n’etiti Ọkpara ahụ na ndị mmụọ ozi n’arụmụka ahụ; “ònye n’ime” na-egosipụta ajụjụ πρὸς τίνα n’Igbo dị ugbu a.
- source_word: εἴρηκέν ποτε
  choice: ka ọ gwatụworo mgbe ọ bụla
  rationale: Ụdị a na-edobe echiche nke okwu e kwuworo nke ka nwere ike, ebe “mgbe ọ bụla” na-egosipụta ποτέ, ya bụ, ma ọ dịtụla mgbe o kwuru ya.
- source_word: Κάθου
  choice: Nọdụ ala
  rationale: Nke a bụ iwu doro anya ma bụrụkwa ụzọ ndị Igbo si ekwu ya n’ụzọ ebumpụta ụwa.
- source_word: ἐκ δεξιῶν μου
  choice: n’aka nri m
  rationale: Nke a bụ akpaalaokwu Igbo kwesịrị ekwesị maka ọnọdụ nsọpụrụ dị n’akụkụ aka nri, ma ọ naghị akọwafe ihe oyiyi ọchịchị dị n’amaokwu ahụ.
- source_word: ἕως ἂν θῶ
  choice: ruo mgbe m ga-eme
  rationale: “Ruo mgbe” na “ga-eme” na-egosipụta ihe a na-atụ anya ime n’ọdịnihu, ma kwekọọ na njikọ nke τίθημι na aha na-esochi ya.
- source_word: τοὺς ἐχθρούς σου
  choice: ndị iro gị
  rationale: Nke a bụ ntụgharị kpọmkwem na nke a na-aghọta nke ọma.
- source_word: ὑποπόδιον τῶν ποδῶν σου
  choice: ihe mgbakwasị ụkwụ gị
  rationale: Ọ na-edobe ihe oyiyi Akwụkwọ Nsọ nke imeri na ido ndị iro n’okpuru ọchịchị, n’asụsụ Igbo dị mfe nghọta.
theological_decisions:
- issue: Idobe ike okwu eze nke Abụ Ọma 110:1 n’arụmụka gbasara Ọkpara na ndị mmụọ ozi
  choice: 'E debere okwu ahụ dịka okwu Chineke gwara otu onye pụrụ iche: “Nọdụ ala n’aka nri m ruo mgbe m ga-eme ndị iro gị ka ha bụrụ ihe mgbakwasị ụkwụ gị.”'
  alternative: Ịkọwa ya n’ụzọ sara mbara dịka “ruo mgbe m ga-emeri ndị iro gị kpamkpam.”
  rationale: Arụmụka Ndị Hibru dabere n’okwu ahụ n’onwe ya na ọdịiche ọ na-egosi n’etiti Ọkpara na ndị mmụọ ozi. Ya mere, ntụgharị ahụ na-edobe ihe oyiyi nke ịnọ n’oche ọchịchị na ido ndị iro n’okpuru ya kama ịtụgharị ya ka ọ bụrụ nkọwa.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị ùgwù ma dịkwa mfe nghọta. A hapụrụ ajụjụ ahụ dịka ajụjụ nkwupụta, ma debeekwa ihe oyiyi ọchịchị na mmeri dị n’ederede mbụ.
