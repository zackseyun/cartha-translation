id: HEB.9.11
reference: Hebrews 9:11
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Χριστὸς δὲ παραγενόμενος ἀρχιερεὺς τῶν ⸀γενομένων ἀγαθῶν διὰ τῆς μείζονος καὶ τελειοτέρας σκηνῆς οὐ χειροποιήτου, τοῦτ’ ἔστιν οὐ ταύτης τῆς κτίσεως,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/011.yaml
  text: But the Messiah came as high priest of the good things that have come[a], through the greater and more perfect tabernacle not made by hands—that is[b], not of this creation—
translation:
  language: ig
  text: Ma Mesaịa ahụ bịara dị ka nnukwu onye nchụàjà nke ezi ihe ndị bịarala[a]; site n’ụlọikwuu ka ukwuu ma zuo oke karịa, nke aka mmadụ na-emeghị—ya bụ, nke na-abụghị nke ihe e kere eke a[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ụfọdụ ihe odide na-agụ, “nke ezi ihe ndị ka ga-abịa.”
    reason: textual_variant
  - marker: b
    text: Okwu “site n’ụlọikwuu ...” na-aga n’ihu ruo n’amaokwu 12, ebe a na-ekwu maka ịbanye.
    reason: previous_rendering
lexical_decisions:
- source_word: Χριστὸς
  choice: Mesaịa ahụ
  rationale: E ji Χριστός mee aha-ọkwa n’ebe a; “Mesaịa” na-echekwa echiche nke Onye E Tere Mmanụ n’asụsụ Igbo doro anya.
- source_word: δὲ
  choice: Ma
  rationale: Ọ na-egosi ntụgharị na ọdịiche dị n’etiti ọrụ nchụàjà nke ụwa a a kọwara tupu ya na ọrụ Mesaịa.
- source_word: παραγενόμενος
  choice: mgbe ... bịara
  rationale: Nke a na-egosipụta ọbịbịa Mesaịa n’ọrụ ya dị ka nnukwu onye nchụàjà, ma na-edebe usoro participle nke Grik n’ụzọ Igbo sitere n’okike.
- source_word: ἀρχιερεὺς
  choice: nnukwu onye nchụàjà
  rationale: Nke a bụ okwu Igbo doro anya maka ọkwa nchụàjà kachasị elu nke akwụkwọ Ndị Hibru na-ekwu maka ya.
- source_word: τῶν γενομένων ἀγαθῶν
  choice: nke ezi ihe ndị bịarala
  rationale: A gbasoro γενομένων nke SBLGNT, nke pụtara na ezi ihe ndị ahụ abịala, kama ịtụgharị ya dị ka ihe ndị ka ga-abịa.
- source_word: διὰ τῆς ... σκηνῆς
  choice: o si n’ụlọikwuu ahụ ...
  rationale: “Ụlọikwuu” na-echekwa ihe oyiyi ụlọ nsọ a na-ebugharị ebugharị nke ọzara. “Si n’...” na-ekwe ka ahịrịokwu ahụ gaa n’ihu ruo n’omume bụ isi dị n’amaokwu 12 n’enweghị ịkọwa mmekọrịta okwu ahụ karịa ihe Grik kwuru.
- source_word: μείζονος
  choice: ka ukwuu
  rationale: Ọ na-egosi ịdị elu ma ọ bụ ịdị mma karịa, ọ bụghị naanị ibu n’ahụ.
- source_word: τελειοτέρας
  choice: zuru oke karịa
  rationale: Ọ na-echekwa isiokwu Ndị Hibru banyere izu oke na mmezu.
- source_word: οὐ χειροποιήτου
  choice: nke aka mmadụ na-emeghị
  rationale: Ọ na-echekwa ọdịiche dị n’etiti ihe mmadụ rụrụ na ebe nsọ nke na-abụghị ọrụ aka mmadụ.
- source_word: τοῦτ’ ἔστιν
  choice: ya bụ
  rationale: Nke a bụ ụzọ Igbo sitere n’okike isi webata nkọwa na-esote.
- source_word: οὐ ταύτης τῆς κτίσεως
  choice: nke na-abụghị akụkụ nke ihe e kere eke a
  rationale: Nke a na-egosi na ụlọikwuu ahụ adịghị n’usoro ihe e kere eke a, ma ghara ịgbakwunye nkọwa banyere ọdịdị ya.
theological_decisions:
- issue: Ọgụgụ ederede na nkọwa τῶν γενομένων ἀγαθῶν
  choice: nke ezi ihe ndị bịarala
  alternative: nke ezi ihe ndị ka ga-abịa
  rationale: Isi ederede gbasoro γενομένων dị na SBLGNT. E debere ọgụgụ μελλόντων nke ụfọdụ ihe odide n’ala peeji ka ndị na-agụ mara ọdịiche ahụ n’enweghị ikpuchi esemokwu ederede.
- issue: Ihe διὰ τῆς ... σκηνῆς jikọrọ na ya
  choice: E debere ahịrịokwu ahụ ka ọ gaa n’ihu ruo amaokwu 12
  alternative: Ijikọ ya kpọmkwem na ọbịbịa Mesaịa dị ka ụzọ o si pụta
  rationale: Usoro Grik nwere ike iduhie ma e kewapụ amaokwu 11 naanị ya; n’usoro ahịrịokwu zuru ezu, okwu a na-eduga n’omume ịbanye dị n’amaokwu 12. Dash ikpeazụ na-egosi na echiche ahụ agwụbeghị.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị ùgwù ma dị mfe nghọta. E ji “nnukwu onye nchụàjà” na “ụlọikwuu” mee ka okwu ofufe nke Ndị Hibru doo anya. E debere dash ikpeazụ n’ihi na ahịrịokwu Grik na-aga n’ihu n’amaokwu 12. Ihe nrịbama ala peeji [a] na [b] abụọ dị n’isi ederede.
