  text: And behind the second curtain was a tabernacle called the Most Holy Place,[a]
translation:
  language: ig
  text: N’azụ ákwà mgbochi nke abụọ ahụ bụ ụlọikwuu nke dị n'ime ụlọikwuu ahụ a na-akpọ Ebe Kachasị Nsọ,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n’ụzọ omenala, “Ebe Nsọ Kachasị Nsọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ ... τὸ δεύτερον καταπέτασμα
  choice: N’azụ ákwà mgbochi nke abụọ ahụ
  rationale: μετά ya na accusative na-egosi ọnọdụ n’ebe a, ya mere ‘n’azụ’ na-enye echiche ahụ n’Igbo nke ọma. καταπέτασμα bụ ákwà mgbochi dị n’ime ụlọikwuu ahụ.
- source_word: δὲ
  choice: (egosighị ya iche)
  rationale: δὲ bụ njikọ dị nro na-aga n’ihu n’ịkọwa ebe nsọ ahụ. N’Igbo, usoro ahịrịokwu a na-aga nke ọma n’enweghị ịgbakwunye ‘ma’ nke nwere ike igosi mmegide na-adịghị ebe ahụ.
- source_word: σκηνὴ
  choice: akụkụ nke ụlọikwuu ahụ
  rationale: σκηνή nwere ike ịpụta ụlọikwuu, ma n’ebe a ọ na-ekwu maka ime ụlọ nke abụọ n’ime ụlọikwuu ofufe ahụ. ‘Akụkụ nke ụlọikwuu ahụ’ na-echekwa njikọ ya na ụlọikwuu ma na-eme ka onye na-agụ ghọta na ọ bụ otu akụkụ dị n’ime ya.
- source_word: ἡ λεγομένη
  choice: a na-akpọ
  rationale: Nke a bụ ụzọ Igbo si kwuo aha e nyere ebe ahụ n’ụzọ doro anya ma bụrụkwa nke ebumpụta ụwa.
- source_word: Ἅγια Ἁγίων
  choice: Ebe Kachasị Nsọ
  rationale: Nkebiokwu Grik a bụ ụzọ e si egosi ogo kachasị elu, ya bụ ebe dị nsọ karịa ebe nsọ ndị ọzọ. ‘Ebe Kachasị Nsọ’ na-enye nghọta ahụ n’Igbo dị ugbu a.
theological_decisions:
- issue: Nsụgharị aha ebe nsọ Ἅγια Ἁγίων
  choice: Ebe Kachasị Nsọ
  alternative: Ebe Nsọ nke Ebe Nsọ Nile
  rationale: Nhọrọ bụ isi na-eme ka ihe ọ pụtara doo ndị na-agụ Igbo anya, ebe ntụaka ala peeji na-echekwa ọdịdị akpaalaokwu Grik ahụ n’ụzọ dị nso.
translation_notes:
  register: E ji Standard Igbo nke dị ugbu a, dị ùgwù ma dị mfe nghọta. A họọrọ ‘ákwà mgbochi’ kama okwu ochie ma ọ bụ nke nwere nghọta uwe ihu; a kọwakwara σκηνή dị ka akụkụ nke ụlọikwuu ka ọnọdụ ụlọ nsọ ahụ doo anya n’enweghị iwepụ ihe oyiyi ụlọikwuu dị na Grik.
