  source_fidelity: Isi nsụgharị ahụ na-atụgharị μετὰ ... τὸ δεύτερον καταπέτασμα n'ụzọ ziri ezi dịka ọnọdụ, ọ bụghị oge, ma na-echekwa na ebe a nọ n'ime ụlọikwuu ahụ. Otú ọ dị, σκηνή bụ aha maka ụlọikwuu/ogige ụlọikwuu n'okwu Grik; n'ọnọdụ a ọ na-arụtụ aka n'akụkụ ime ya. “Akụkụ nke ụlọikwuu” kwekọrọ n'ọnọdụ ahụ, ma “nke dị n'ime ụlọikwuu” na-egosi njikọ a nke ọma karịa ma ghara ime ka akụkụ ahụ dị ka okwu isi Grik n'onwe ya.
