  terminology: “Ákwà mgbochi,” “ụlọikwuu,” na “Ebe Kachasị Nsọ” dabara n'ọrụ na ndekọ nsọ a. Ma ihe ntụaka ala mbụ, “Ebe Nsọ nke Ebe Nsọ Nile,” abụghị ụzọ Igbo sitere n'okike isi gosipụta akpaalaokwu ahụ, ọ na-atụgharịkwa okwu ahụ n'ụzọ na-adịghị edo anya. “Ebe Nsọ Kachasị Nsọ” bụ nhọrọ omenala na nke doro anya karị.
