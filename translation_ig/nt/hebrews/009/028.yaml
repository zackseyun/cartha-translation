  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οὕτως καὶ ὁ Χριστός, ἅπαξ προσενεχθεὶς εἰς τὸ πολλῶν ἀνενεγκεῖν ἁμαρτίας, ἐκ δευτέρου χωρὶς ἁμαρτίας ὀφθήσεται τοῖς αὐτὸν ἀπεκδεχομένοις εἰς σωτηρίαν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/028.yaml
  text: so also the Messiah[a], having been offered once to bear the sins of many, will appear a second time, apart from sin, to those who eagerly await him, for salvation.
translation:
  language: ig
  text: Otú ahụ kwa, ebe e chụụrụ Mesaya aja otu ugboro ka o buru mmehie nke ọtụtụ mmadụ, ọ ga-apụta nke ugboro abụọ na-enweghị ihe gbasara mmehie[a], nye ndị ji agụụ na-echere ya, maka nzọpụta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “na-enweghị ihe gbasara mmehie”; ya bụ, ọ bụghị iji buru mmehie dị ka n’ịchụ aja ya nke mbụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως καὶ
  choice: Otu a kwa
  rationale: Na-ejikọta amaokwu a na ntụnyere dị n’amaokwu 27, ma na-ada ka Igbo nkịtị.
- source_word: ὁ Χριστός
  choice: Mesaya
  rationale: Χριστός bụ aha ọkwa ebe a n’arụmụka gbasara nzọpụta; ‘Mesaya’ na-egosipụta nke ahụ nke ọma.
- source_word: ἅπαξ
  choice: otu ugboro
  rationale: Na-asụgharị kpọmkwem echiche nke otu oge, n’etinyeghị ‘otu ugboro ruo mgbe ebighị ebi,’ nke okwu Grik a ekwughị n’onwe ya.
- source_word: προσενεχθεὶς
  choice: ebe e chụụrụ ... aja
  rationale: Na-edobe ọdịdị passive nke participle ahụ ma na-eme ka echiche ịchụ aja doo anya n’Igbo.
- source_word: εἰς τὸ πολλῶν ἀνενεγκεῖν ἁμαρτίας
  choice: ka o buru mmehie nke ọtụtụ mmadụ
  rationale: ‘Buru mmehie’ na-edobe ụda ịchụ aja na ntụaka nwere ike ịdị n’Aịzaya 53; ‘ọtụtụ mmadụ’ na-eme ka plural ahụ doo anya n’Igbo.
- source_word: ἐκ δευτέρου
  choice: nke ugboro abụọ
  rationale: Ụzọ Igbo doro anya isi kwuo na ihe ahụ ga-eme nke abụọ.
- source_word: χωρὶς ἁμαρτίας
  choice: n’enweghị ihe jikọrọ ya na mmehie
  rationale: Na-edobe ịdị mkpụmkpụ na nghọtahie nwere ike ịdị na okwu Grik, na-akọwaghị ya kpamkpam dị ka ‘ọ bụghị iburu mmehie.’
- source_word: ὀφθήσεται
  choice: ọ ga-apụta
  rationale: Ọ bụ ụzọ Igbo sitere n’okike maka asụsụ banyere mpụta n’ọdịnihu karịa ‘a ga-ahụ ya.’
- source_word: τοῖς αὐτὸν ἀπεκδεχομένοις
  choice: nye ndị ji agụụ na-echere ya
  rationale: ‘Ji agụụ na-echere’ na-egosipụta nchekwube na ịnụ ọkụ n’obi dị n’ἀπεκδέχομαι.
- source_word: εἰς σωτηρίαν
  choice: iji wetara ha nzọpụta
  rationale: Na-egosipụta ebumnuche/nsonaazụ nke εἰς σωτηρίαν n’Igbo doro anya; ‘ha’ na-akọwa ndị na-echere ya, ọ bụghị mgbakwunye nkuzi.
theological_decisions:
- issue: Ihe ‘χωρὶς ἁμαρτίας’ pụtara mgbe Mesaya ga-apụta nke abụọ
  choice: n’enweghị ihe jikọrọ ya na mmehie
  alternative: ọ bụghịkwa maka iburu mmehie, dị ka mgbe a chụrụ ya aja na mbụ
  rationale: Isi ederede na-edobe okwu ahụ n’ụzọ na-adịghị ekpebi nkọwa ya kpamkpam; ndetu ala na-enye nkọwa dabara n’okirikiri okwu ahụ na-enweghị itinye ya n’isi ederede.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji ‘Mesaya’ mee ihe dịka aha ọkwa; e jikwa asụsụ ịchụ aja na iburu mmehie chekwaa njikọ nke amaokwu ahụ na arụmụka Akwụkwọ Ndị Hibru.
