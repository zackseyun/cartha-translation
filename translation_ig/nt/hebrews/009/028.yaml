  to: Otú ahụ kwa, ebe e chụụrụ Mesaya aja otu ugboro ka o buru mmehie nke ọtụtụ mmadụ, ọ ga-apụta nke ugboro abụọ na-enweghị ihe gbasara mmehie[a], nye ndị ji agụụ na-echere ya, maka nzọpụta.
