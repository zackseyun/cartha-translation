revisions:
- from: N’ihi na a kwadebere ụlọikwuu nke mbụ, ebe ihe ndọba oriọna, tebụl, na achịcha ndị e debere n’ihu Chineke[a] dị. A na-akpọ ya Ebe Nsọ.[b]
  to: N’ihi na a kwadebere ọnụ ụlọ mbụ nke ụlọikwuu ahụ; n’ime ya dị ihe idọba oriọna, tebụl, na achịcha ndị e debere n’ihu Chineke[a]. A na-akpọ ya Ebe Nsọ.[b]
  rationale: The revision makes the first-compartment sense explicit, preserves the verse’s list and cultic terminology, and substitutes a more idiomatic expression for “lampstand.” Footnote markers remain attached to the relevant expressions and both notes retain their intended lexical information.
