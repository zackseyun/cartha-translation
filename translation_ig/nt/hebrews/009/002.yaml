    text: N’ụzọ nkịtị, “ndokwa achịcha ndị ahụ”; a na-akpọkwa ha “achịcha nke Ọnụnọ.”
    reason: lexical_alternative
  - marker: b
    text: N’asụsụ Grik, “Ebe Ndị Nsọ”; n’ebe a, ọ na-ezo aka n’ọnụ ụlọ mbụ nke ụlọikwuu ahụ, ya bụ, Ebe Nsọ.
    reason: lexical_alternative
