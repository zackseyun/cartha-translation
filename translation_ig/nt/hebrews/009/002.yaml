review_pass:
  verdict: revise
  source_fidelity: The draft correctly identifies the three furnishings and correctly understands Ἅγια as the first, outer sacred compartment. However, “ụlọikwuu nke mbụ” can naturally be read as the first tabernacle in a chronological sequence, whereas the immediate context identifies the first compartment. The wording for the lampstand also needs a more idiomatic Igbo noun phrase.
  naturalness: The two-sentence structure and register are clear and suitable for Standard Igbo. “ihe ndọba oriọna” is less idiomatic than “ihe idọba oriọna,” and explicit reference to the first room improves coherence with “Ebe Nsọ.”
  terminology: “tebụl,” “achịcha ndị e debere n’ihu Chineke,” and “Ebe Nsọ” are appropriate. The bread expression is a clear contextual rendering of πρόθεσις τῶν ἄρτων; its lexical alternative is retained in the note. The note on Ἅγια appropriately preserves the Greek plural without imposing a doctrinal interpretation.
  issues:
  - severity: medium
    issue: “ụlọikwuu nke mbụ” is potentially chronological rather than compartmental.
    rationale: In Hebrews 9:2–3, πρώτη and δεύτερα distinguish the two spaces of the tabernacle. Rendering the referent as the first room/compartment communicates the source-context contrast clearly in Igbo.
  - severity: low
    issue: “ihe ndọba oriọna” is awkward terminology for a lampstand.
    rationale: “Ihe idọba oriọna” is the more natural Standard Igbo construction for the furnishing on which lamps are placed.
  revised_text: N’ihi na a kwadebere ọnụ ụlọ mbụ nke ụlọikwuu ahụ; n’ime ya dị ihe idọba oriọna, tebụl, na achịcha ndị e debere n’ihu Chineke[a]. A na-akpọ ya Ebe Nsọ.[b]
  revised_footnotes:
