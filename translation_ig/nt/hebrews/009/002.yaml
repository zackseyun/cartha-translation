id: HEB.9.2
reference: Hebrews 9:2
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: σκηνὴ γὰρ κατεσκευάσθη ἡ πρώτη ἐν ᾗ ἥ τε λυχνία καὶ ἡ τράπεζα καὶ ἡ πρόθεσις τῶν ἄρτων, ἥτις λέγεται Ἅγια·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/002.yaml
  text: For a first tabernacle was prepared[a], in which were the lampstand and the table and the bread of the Presence[b], which is called the Holy Place.
translation:
  language: ig
  text: N’ihi na a kwadebere ọnụ ụlọ mbụ nke ụlọikwuu ahụ; n’ime ya dị ihe idọba oriọna, tebụl, na achịcha ndị e debere n’ihu Chineke[a]. A na-akpọ ya Ebe Nsọ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’ụzọ nkịtị, “ndokwa achịcha ndị ahụ”; a na-akpọkwa ha “achịcha nke Ọnụnọ.”
    reason: lexical_alternative
  - marker: b
    text: N’asụsụ Grik, “Ebe Ndị Nsọ”; n’ebe a, ọ na-ezo aka n’ọnụ ụlọ mbụ nke ụlọikwuu ahụ, ya bụ, Ebe Nsọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: σκηνὴ
  choice: ụlọikwuu
  rationale: “Ụlọikwuu” na-echekwa njikọ okwu a na ebe nsọ a rụrụ n’oge Mozis, ọ bụghị naanị ụlọ ma ọ bụ ebe nsọ n’ozuzu.
- source_word: κατεσκευάσθη
  choice: a kwadebere
  rationale: Okwu a na-egosi na e mere ka ụlọikwuu ahụ dị njikere, ma ọ naghị amachi ihe a na-ekwu naanị n’ịrụ ụlọ ahụ.
- source_word: ἡ πρώτη
  choice: nke mbụ
  rationale: Nke a na-esochi usoro Grik ma na-akwadebe ọdịiche dị n’etiti akụkụ mbụ na akụkụ nke abụọ a ga-ekwu maka ya n’amaokwu na-esote.
- source_word: λυχνία
  choice: ihe ndọba oriọna
  rationale: Nke a na-akọwa ihe e ji adọba oriọna mmanụ n’ụzọ doro onye Igbo nke oge a anya, na-enweghị iji okwu ga-eme ka a ghọta kandụl.
- source_word: τράπεζα
  choice: tebụl
  rationale: Ọ bụ okwu Igbo a na-ejikarị eme ihe maka tebụl ahụ dị nsọ.
- source_word: ἡ πρόθεσις τῶν ἄρτων
  choice: achịcha ndị e debere n’ihu Chineke
  rationale: Nke a na-enye echiche nke achịcha e setịpụrụ n’ihu Chineke n’ebe nsọ ahụ, ma na-ezere okwu ọdịnala na-agaghị adị mfe nghọta nye ọtụtụ ndị na-agụ akwụkwọ taa.
- source_word: ἥτις λέγεται
  choice: A na-akpọ ya
  rationale: Nke a bụ ụzọ Igbo dị ire ụtọ isi kwuo na e nyere ụlọikwuu ma ọ bụ akụkụ ahụ aha.
- source_word: Ἅγια
  choice: Ebe Nsọ
  rationale: Ọ bụ ezie na ọdịdị okwu Grik ahụ bụ ọtụtụ, ihe gbara ya gburugburu na-ezo aka n’ọnụ ụlọ mbụ nke ụlọikwuu ahụ, nke dị iche n’ọnụ ụlọ ime ime n’amaokwu na-esote.
theological_decisions:
- issue: Ihe Ἅγια na-ezo aka na ya n’ime ụlọikwuu ahụ
  choice: Ebe Nsọ
  alternative: ebe ndị nsọ; ebe nsọ ahụ
  rationale: “Ebe Nsọ” na-eme ka ọdịiche dị n’etiti ọnụ ụlọ mbụ na ọnụ ụlọ ime ime doo anya, ma ọ naghị etinye nkọwa ozizi ọzọ n’amaokwu ahụ.
- issue: Ihe πρόθεσις τῶν ἄρτων pụtara
  choice: achịcha ndị e debere n’ihu Chineke
  alternative: ndokwa achịcha ndị ahụ; achịcha ngosi
  rationale: Nhọrọ a na-egosipụta ọrụ ofufe nke achịcha ahụ n’asụsụ Igbo a na-aghọta nke ọma, ebe ihe odide ala ala peeji na-echekwa ụzọ ọzọ dị nso n’usoro okwu Grik.
translation_notes:
  register: E ji asụsụ Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta mee ihe. “Ụlọikwuu” na-echekwa ụda akụkọ ebe nsọ nke oge Mozis; “ihe ndọba oriọna” na-ezere echiche kandụl; e kewara ahịrịokwu ahụ ụzọ abụọ ka ọ na-agụ nke ọma n’Igbo.
