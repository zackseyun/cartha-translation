id: HEB.9.24
reference: Hebrews 9:24
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οὐ γὰρ εἰς χειροποίητα ⸂εἰσῆλθεν ἅγια⸃ Χριστός, ἀντίτυπα τῶν ἀληθινῶν, ἀλλ’ εἰς αὐτὸν τὸν οὐρανόν, νῦν ἐμφανισθῆναι τῷ προσώπῳ τοῦ θεοῦ ὑπὲρ ἡμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/024.yaml
  text: For Messiah did not enter into holy places made by hands[a], copies of the true things, but into heaven itself[c][b], now to appear in the presence of God on our behalf.
translation:
  language: ig
  text: N’ihi na Mesaya abanyeghị n’ebe nsọ e ji aka mee, ndị bụ ihe nnọchianya nke ihe ndị bụ eziokwu, kama ọ banyere n’eluigwe n’onwe ya, ka ọ pụta ugbu a n’ihu Chineke[a] maka anyị.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’ụzọ nkịtị, “n’ihu ihu Chineke.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Χριστός
  choice: Mesaya
  rationale: A sụgharịrị aha ọkwá ahụ dị ka “Mesaya,” n’ihi na ọrụ ya dị ka Onye E Tere Mmanụ na nnukwu onye nchụàjà pụtara ìhè n’arụmụka a.
- source_word: χειροποίητα ἅγια
  choice: ebe nsọ ndị e ji aka mee
  rationale: Nke a na-edobe ọtụtụ nke ἅγια nakwa ọdịiche dị n’etiti ebe ụmụ mmadụ wuru na eziokwu nke eluigwe.
- source_word: ἀντίτυπα τῶν ἀληθινῶν
  choice: ihe oyiyi nke ihe ndị bụ eziokwu
  rationale: “Ihe oyiyi” na-egosi ihe ndị kwekọrọ na ezi ihe nke eluigwe ma na-anọchi anya ha, na-emeghị ka okwu ahụ bụrụ naanị oyiri zuru oke.
- source_word: αὐτὸν τὸν οὐρανόν
  choice: eluigwe n’onwe ya
  rationale: “N’onwe ya” na-ebute ike nkwusi okwu nke αὐτόν, na-emegide ebe nsọ e ji aka mee.
- source_word: ἐμφανισθῆναι τῷ προσώπῳ τοῦ θεοῦ
  choice: ka ọ pụta ugbu a n’ihu Chineke
  rationale: Nke a bụ Igbo doro anya ma dịkwa nso n’okwu Grik “ịpụta n’ihu Chineke”; ọ na-edobe νῦν, “ugbu a.”
- source_word: ὑπὲρ ἡμῶν
  choice: n’ihi anyị
  rationale: Nkebiokwu a na-egosi na ọ pụtara n’ihu Chineke maka ọdịmma anyị na n’ọnọdụ nnọchiteanya, n’etinyeghị ozizi mgbaghara mmehie sara mbara karịa amaokwu ahụ.
theological_decisions:
- issue: Ọtụtụ nke ἅγια n’okwu ofufe
  choice: ebe nsọ
  alternative: ebe nsọ ahụ; ụlọ nsọ
  rationale: “Ebe nsọ” na-edobe ụdị ọtụtụ nke Grik ma ghara ikpebi tupu oge eruo ma okwu ahụ na-ekwu kpọmkwem otu ime ụlọ ma ọ bụ ebe nsọ dum.
- issue: Aha ọkwá Χριστός
  choice: Mesaya
  alternative: Kraịst
  rationale: “Mesaya” na-eme ka ihe aha ọkwá ahụ pụtara doo anya n’ebe a, ebe a na-ekwu banyere ọrụ onye nchụàjà na mmezu ya.
- issue: Ike nnọchiteanya nke ὑπὲρ ἡμῶν
  choice: n’ihi anyị
  alternative: maka anyị; n’ọnọdụ anyị
  rationale: “N’ihi anyị” bụ okwu Igbo ebumpụta ụwa nke na-egosi uru na nnọchiteanya, ma ọ naghị amanye nkọwa pụrụ iche banyere etu ọrụ mgbaghara mmehie si arụ ọrụ.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E debere okwu ofufe “ebe nsọ,” aha ọkwá “Mesaya,” na ọdịiche dị n’etiti ihe e ji aka mee na eluigwe n’onwe ya. Akara ndetu ala peeji [a] dị n’ederede isi.
