revisions:
- from: N’ihi na Mesaya abanyeghị n’ebe nsọ ndị e ji aka mee, bụ́ ihe oyiyi nke ihe ndị bụ eziokwu, kama ọ banyere n’eluigwe n’onwe ya, ka ọ pụta ugbu a n’ihu Chineke[a] n’ihi anyị.
  to: N’ihi na Mesaya abanyeghị n’ebe nsọ e ji aka mee, ndị bụ ihe nnọchianya nke ihe ndị bụ eziokwu, kama ọ banyere n’eluigwe n’onwe ya, ka ọ pụta ugbu a n’ihu Chineke[a] maka anyị.
  rationale: The revision preserves the verse’s syntax and ambiguity while clarifying that the hand-made holy places are corresponding representations of the true realities. It also renders ὑπὲρ ἡμῶν with the less ambiguous Standard Igbo phrase “maka anyị.” The footnote now reflects the literal Greek idiom behind the natural main-text expression.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T21:29:07Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the contrast between hand-made holy places and heaven itself, the present temporal force of νῦν, and Messiah’s appearance before God. However, “n’ihi anyị” can naturally mean “because of us,” and does not consistently convey the representative sense of ὑπὲρ ἡμῶν; “maka anyị” is clearer. Rendering ἀντίτυπα as singular-sounding “ihe oyiyi” also weakens the Greek plural and can suggest visual images rather than corresponding representations.
  naturalness: The sentence is generally fluent Standard Igbo. The revision makes the apposition agree explicitly with the plural “ebe nsọ” and uses more idiomatic wording for the final beneficiary/representative phrase.
  terminology: “Mesaya,” “ebe nsọ,” and “eluigwe n’onwe ya” are appropriate and retain the cultic, titular, and emphatic features of the Greek. “Ihe nnọchianya” better communicates ἀντίτυπα in this context than “ihe oyiyi.”
  issues:
  - severity: medium
    issue: “n’ihi anyị” is potentially causal rather than representative.
    rationale: ὑπὲρ ἡμῶν here means “for/on behalf of us.” “Maka anyị” expresses this naturally without imposing a more specific theological theory.
  - severity: low
    issue: “ihe oyiyi” is less precise for ἀντίτυπα and does not clearly mark the plural relationship.
    rationale: The term refers to corresponding representations/counterparts of the true heavenly realities, not necessarily images. An explicitly plural relative clause with “ihe nnọchianya” better reflects the source.
  - severity: low
    issue: The existing footnote repeats the main-text wording and its proposed alternative is unnatural.
    rationale: The Greek phrase is literally “before the face of God.” This supplies a meaningful lexical note while keeping natural Igbo in the main text.
  revised_text: N’ihi na Mesaya abanyeghị n’ebe nsọ e ji aka mee, ndị bụ ihe nnọchianya nke ihe ndị bụ eziokwu, kama ọ banyere n’eluigwe n’onwe ya, ka ọ pụta ugbu a n’ihu Chineke[a] maka anyị.
  revised_footnotes:
  - marker: a
    text: N’ụzọ nkịtị, “n’ihu ihu Chineke.”
    reason: lexical_alternative
  revision_rationale: The revision preserves the verse’s syntax and ambiguity while clarifying that the hand-made holy places are corresponding representations of the true realities. It also renders ὑπὲρ ἡμῶν with the less ambiguous Standard Igbo phrase “maka anyị.” The footnote now reflects the literal Greek idiom behind the natural main-text expression.
