revisions:
- from: N’ihi na ọ bụrụ na ọbara ewu na oke ehi, ya na ntụ nwa ehi nke a na-efesa ndị merụrụ onwe ha, na-edo ha nsọ ka anụ ahụ ha dị ọcha,[a][b][c]
  to: N’ihi na ọ bụrụ na ọbara ewu na oke ehi, ya na ntụ nke nwa ehi nwanyị[a] a na-eji efesa ndị e metọrọ[b], na-edo ha nsọ maka ịdị ọcha nke anụ ahụ,[c]
  rationale: The correction restores the Greek direction of the sprinkling action, accurately identifies ritual defilement, and retains the female meaning of “heifer.” It also preserves the deliberate cultic distinction between sanctification and external bodily purification without adding doctrinal interpretation.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T21:29:04Z'
review_pass:
  verdict: revise
  source_fidelity: The draft reverses the participial ritual action by saying that the ashes are sprinkled on the defiled persons ("nke a na-efesa ndị ..."). The Greek has the ashes as the means performing the sprinkling. It also renders τοὺς κεκοινωμένους as "ndị merụrụ onwe ha," which means people who injured themselves rather than people rendered ritually defiled. Finally, "nwa ehi" does not preserve δαμάλεως, a female heifer.
  naturalness: The proposed revisions use natural Standard Igbo while retaining the verse's unfinished conditional syntax and cultic register. "A na-eji ... efesa" avoids unnatural personal agency being assigned to ashes without reversing the ritual relation.
  terminology: '"Nwa ehi nwanyị" preserves the female referent of δάμαλις. "Ndị e metọrọ" conveys defilement rather than physical self-injury. "Na-edo ha nsọ maka ịdị ọcha nke anụ ahụ" retains ἁγιάζει and the cultic, external sense of καθαρότης τῆς σαρκός.'
  issues:
  - severity: high
    issue: The phrase "nke a na-efesa ndị merụrụ onwe ha" reverses the relationship expressed by ῥαντίζουσα.
    rationale: It says the ashes are sprinkled on the people, whereas the Greek describes the ashes as sprinkling the defiled people. Rendering the ashes as what is used for sprinkling preserves the ritual action naturally in Igbo.
  - severity: high
    issue: '"ndị merụrụ onwe ha" mistranslates τοὺς κεκοινωμένους.'
    rationale: This Igbo expression denotes people who have hurt themselves. The Greek denotes persons made ritually defiled or unclean.
  - severity: medium
    issue: '"nwa ehi" omits the female sense of δαμάλεως.'
    rationale: A δάμαλις is a heifer, not merely an unspecified calf. "Nwa ehi nwanyị" keeps the lexical and Numbers 19 connection.
  - severity: low
    issue: The existing footnote anchors do not stand beside the terms they explain.
    rationale: Moving the lexical and Numbers 19 notes to "ndị e metọrọ" and "nwa ehi nwanyị" makes their referents clear; the external-purification note remains at the final phrase.
  revised_text: N’ihi na ọ bụrụ na ọbara ewu na oke ehi, ya na ntụ nke nwa ehi nwanyị[a] a na-eji efesa ndị e metọrọ[b], na-edo ha nsọ maka ịdị ọcha nke anụ ahụ,[c]
  revised_footnotes:
  - marker: a
    text: Nke a na-ezo aka n’emume ime ka mmadụ dị ọcha site na ntụ nwa ehi nwanyị dị n’Ọnụọgụgụ 19.
    reason: cross_reference
  - marker: b
    text: Ma ọ bụ, “ndị ghọrọ ndị na-adịghị ọcha.” Okwu Grik a na-ekwu banyere adịghị ọcha n’usoro emume.
    reason: lexical_alternative
  - marker: c
    text: Ya bụ, ime ka mmadụ dị ọcha n’ụzọ mpụta, nke metụtara anụ ahụ, n’usoro emume ọgbụgba ndụ ochie.
    reason: cultural_note
  revision_rationale: The correction restores the Greek direction of the sprinkling action, accurately identifies ritual defilement, and retains the female meaning of “heifer.” It also preserves the deliberate cultic distinction between sanctification and external bodily purification without adding doctrinal interpretation.
