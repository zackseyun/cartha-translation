id: HEB.9.13
reference: Hebrews 9:13
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἰ γὰρ τὸ αἷμα ⸂τράγων καὶ ταύρων⸃ καὶ σποδὸς δαμάλεως ῥαντίζουσα τοὺς κεκοινωμένους ἁγιάζει πρὸς τὴν τῆς σαρκὸς καθαρότητα,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/013.yaml
  text: For if the blood of goats and bulls[a], and the ashes of a heifer that sprinkle those who have been defiled, sanctify for the purification of the flesh[d][c][b],
translation:
  language: ig
  text: N’ihi na ọ bụrụ na ọbara ewu na oke ehi, ya na ntụ nke nwa ehi nwanyị[a] a na-eji efesa ndị e metọrọ[b], na-edo ha nsọ maka ịdị ọcha nke anụ ahụ,[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nke a na-ezo aka n’emume ime ka mmadụ dị ọcha site na ntụ nwa ehi nwanyị dị n’Ọnụọgụgụ 19.
    reason: cross_reference
  - marker: b
    text: Ma ọ bụ, “ndị ghọrọ ndị na-adịghị ọcha.” Okwu Grik a na-ekwu banyere adịghị ọcha n’usoro emume.
    reason: lexical_alternative
  - marker: c
    text: Ya bụ, ime ka mmadụ dị ọcha n’ụzọ mpụta, nke metụtara anụ ahụ, n’usoro emume ọgbụgba ndụ ochie.
    reason: cultural_note
lexical_decisions:
- source_word: εἰ γὰρ
  choice: N’ihi na ọ bụrụ na
  rationale: Na-echekwa njikọ nke nkọwa na ọnọdụ nkwenye nke ahịrịokwu Grik; mmezu ntụnyere ahụ na-abịa n’amaokwu na-esonụ.
- source_word: αἷμα τράγων καὶ ταύρων
  choice: ọbara ewu na oke ehi
  rationale: Ọbara bụ okwu ziri ezi n’ọnọdụ àjà; “oke ehi” na-egosi ehi nwoke, ebe “ewu” bụ okwu nkịtị ma doo anya n’Igbo.
- source_word: σποδὸς δαμάλεως
  choice: ntụ nwa ehi
  rationale: “Nwa ehi” na-enye nghọta ebumpụta ụwa maka ehi nwanyị na-eto eto n’ememe Ọnụọgụgụ 19; ihe gbara ya gburugburu na nkọwa ala peeji na-eme ka njikọ ahụ doo anya.
- source_word: ῥαντίζουσα
  choice: nke a na-efesa
  rationale: A họọrọ usoro a na-eme ihe n’ahụ ka Igbo ghara ikwu n’ụzọ na-adịghị ebumpụta ụwa na ntụ ahụ n’onwe ya bụ onye na-efesa; ọ ka na-egosi ọrụ emume ahụ.
- source_word: τοὺς κεκοινωμένους
  choice: ndị merụrụ onwe ha
  rationale: N’ebe a okwu ahụ na-ezo aka n’adịghị ọcha nke emume, ọ bụghị nanị mmehie omume; nkọwa ala peeji na-akọwa nke a.
- source_word: ἁγιάζει
  choice: na-edo ha nsọ
  rationale: Na-echekwa asụsụ nsọ na nke emume, ma ghara ịgbanwe ya ka ọ bụrụ mgbanwe omume ime mmụọ.
- source_word: πρὸς τὴν τῆς σαρκὸς καθαρότητα
  choice: ka anụ ahụ ha dị ọcha
  rationale: Nke a bụ Igbo dị mfe ma na-echekwa echiche banyere ịdị ọcha nke anụ ahụ ma ọ bụ nke elu ahụ, nke a ga-atụnyere ịdị ọcha nke akọ na uche n’amaokwu 14.
theological_decisions:
- issue: Ihe “na-edo ha nsọ” pụtara n’emume ọgbụgba ndụ ochie
  choice: Ido nsọ n’usoro emume, ruo n’ịdị ọcha nke anụ ahụ
  alternative: Ime ka mmadụ dị nsọ n’ime mmụọ na n’omume
  rationale: Akụkụ ikpeazụ nke amaokwu ahụ na-amachi mmetụta ya n’ịdị ọcha nke anụ ahụ, ebe amaokwu 14 na-atụnyere nke a na ime ka akọ na uche dị ọcha.
- issue: Ihe σάρξ pụtara n’ebe a
  choice: anụ ahụ, ya bụ akụkụ elu ahụ metụtara emume
  alternative: ọdịdị mmehie mmadụ
  rationale: Ihe a na-ekwu bụ emume ndị Livayị na ịdị ọcha a na-ahụ anya; ya mere σάρξ abụghị aha maka ọchịchọ mmehie n’ebe a.
- issue: Onye ma ọ bụ ihe na-eme omume ῥαντίζουσα
  choice: 'A sụgharịrị ya n’usoro a na-eme ihe n’ahụ: ntụ ahụ bụ ihe a na-efesa ndị ahụ'
  alternative: Ikwu na ntụ ahụ n’onwe ya “na-efesa” ndị ahụ
  rationale: Ụdị nwanyị otu nke participle ahụ kwekọrọ na σποδός (“ntụ”), ma n’Igbo usoro a na-eme ihe n’ahụ na-ezere ikwu na ntụ bụ onye ọrụ, n’enweghị ịgbanwe ọrụ emume ahụ.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị ugwu ma dị mfe nghọta. A hapụrụ ahịrịokwu ahụ ka ọ bụrụ ọnọdụ “ọ bụrụ na,” n’ihi na mmezu ntụnyere ya dị n’amaokwu na-esonụ. E tinyere akara nkọwa ala peeji niile n’isiokwu n’usoro [a][b][c].
