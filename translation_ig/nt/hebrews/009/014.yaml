revisions:
- from: ọ̀ bụkwanụ otú ọbara Mesaịa ahụ—onye sitere na Mmụọ ebighị ebi chụọrọ Chineke onwe ya n’aja n’enweghị ntụpọ—ga-esi sachapụ akọ na uche anyị n’ọrụ ndị nwụrụ anwụ karị, ka anyị wee na-efe Chineke dị ndụ[a]!
  to: Lee ka ọbara Mesaịa ahụ—onye site na Mmụọ ebighị ebi chụrụ Chineke onwe ya n’aja n’enweghị ntụpọ—ga-aka sachapụ akọ na uche anyị n’ọrụ nwụrụ anwụ, ka anyị wee fee Chineke dị ndụ!
  rationale: The revision corrects the comparative syntax, more accurately represents the instrumental preposition, and improves the natural rendering of “dead works,” without resolving the disputed referent of πνεύματος αἰωνίου beyond the source-supported main-text reading and its footnoted alternative.
  reviewer_model: gpt-5.6-terra
