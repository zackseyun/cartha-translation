source:
  edition: SBLGNT
  text: πόσῳ μᾶλλον τὸ αἷμα τοῦ Χριστοῦ, ὃς διὰ πνεύματος αἰωνίου ἑαυτὸν προσήνεγκεν ἄμωμον τῷ θεῷ, καθαριεῖ τὴν συνείδησιν ⸀ἡμῶν ἀπὸ νεκρῶν ἔργων εἰς τὸ λατρεύειν θεῷ ζῶντι.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/014.yaml
  text: how much more will the blood of Messiah—who through the eternal Spirit offered himself without blemish to God—cleanse our conscience from dead works to serve the living God[a].
translation:
  language: ig
  text: Lee ka ọbara Mesaịa ahụ—onye site na Mmụọ ebighị ebi chụrụ Chineke onwe ya n’aja n’enweghị ntụpọ—ga-aka sachapụ akọ na uche anyị n’ọrụ nwụrụ anwụ, ka anyị wee fee Chineke dị ndụ!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πόσῳ μᾶλλον
  choice: ọ̀ bụkwanụ otú ... karị
  rationale: Ọ na-egosipụta ajụjụ ntụnyere siri ike nke na-aga n’ihu site n’amaokwu gara aga, n’ụzọ dị ndụ ma bụrụkwa nke Igbo nkịtị.
- source_word: τὸ αἷμα τοῦ Χριστοῦ
  choice: ọbara Mesaịa ahụ
  rationale: E debere ‘ọbara’ n’ụzọ nkịtị n’ihi mkpa ọ bara n’okwu ịchụ aja; ‘Mesaịa’ na-egosipụta Χριστός dịka utu aha nke Onye E Tere Mmanụ.
- source_word: διὰ πνεύματος αἰωνίου
  choice: sitere na Mmụọ ebighị ebi
  rationale: ‘Sitere na’ na-egosipụta ụzọ ma ọ bụ onye e ji mee ihe; mkpụrụedemede ukwu na-egosi na a ghọtara ya dịka Mmụọ Nsọ, ebe nkọwa ala peeji na-echekwa nghọta ọzọ Greek nwere ike inwe.
- source_word: ἑαυτὸν προσήνεγκεν ἄμωμον τῷ θεῷ
  choice: chụọrọ Chineke onwe ya n’aja n’enweghị ntụpọ
  rationale: Nke a na-echekwa echiche ịchụ aja, ike nnọchiaha ‘onwe ya,’ na okwu gbasara aja na-enweghị ntụpọ.
- source_word: καθαριεῖ τὴν συνείδησιν ἡμῶν
  choice: ga-esi sachapụ akọ na uche anyị
  rationale: ‘Ga-’ na-echekwa ọdịnihu dị na ngwaa Greek; ‘akọ na uche’ bụ okwu Igbo doro anya maka συνείδησις.
- source_word: ἀπὸ νεκρῶν ἔργων
  choice: n’ọrụ ndị nwụrụ anwụ
  rationale: Nsụgharị a na-edebe njupụta na mgbagwoju anya nke ahịrịokwu ahụ kama ịkọwa ya dịka ‘ọrụ na-eduga n’ọnwụ.’
- source_word: εἰς τὸ λατρεύειν θεῷ ζῶντι
  choice: ka anyị wee na-efe Chineke dị ndụ
  rationale: ‘Ka ... wee’ na-egosipụta nzube; ‘na-efe’ nwere ike ịgụnye ma ofufe ma ije ozi nye Chineke.
theological_decisions:
- issue: Onye πνεύματος αἰωνίου na-ezo aka na ya
  choice: Mmụọ Nsọ, nke e dere ‘Mmụọ ebighị ebi’
  alternative: mmụọ ebighị ebi n’ụzọ izugbe, ma ọ bụ mmụọ nke Mesaịa n’onwe ya
  rationale: Ọdịdị Greek nwere ike ịnabata karịa otu nghọta. Isi ederede na-ahọrọ Mmụọ Nsọ dịka nghọta kacha kwekọọ n’okwu ahụ, ma nkọwa ala peeji na-echekwa mgbagwoju anya ahụ.
- issue: Nsụgharị Χριστός
  choice: Mesaịa
  alternative: Kraịst
  rationale: N’ebe a okwu ahụ na-arụ ọrụ dịka utu aha nke Onye E Tere Mmanụ; ‘Mesaịa’ na-eme ka ihe utu aha Greek pụtara pụta ìhè.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta. Ahịrịokwu ahụ na-echekwa usoro arụmụka ntụnyere, asụsụ ịchụ aja, na mgbagwoju anya dị n’okwu gbasara ‘Mmụọ ebighị ebi.’
