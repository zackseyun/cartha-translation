source:
  edition: SBLGNT
  text: καὶ τὴν σκηνὴν δὲ καὶ πάντα τὰ σκεύη τῆς λειτουργίας τῷ αἵματι ὁμοίως ἐράντισεν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/021.yaml
  text: And likewise he sprinkled with the blood both the tabernacle and all the vessels of the ministry[a][b].
translation:
  language: ig
  text: N'otu aka ahụkwa, o ji ọbara ahụ fesa ma ụlọikwuu ahụ[a] ma ngwa niile nke ozi nsọ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ụlọ ákwà.” Okwu Grik ahụ nwere ike ịpụta ụlọ ákwà, ma n'ebe a ọ na-ezo aka n'ụlọikwuu nsọ.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ihe niile nke ozi nsọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: σκηνή
  choice: ụlọikwuu
  rationale: “Ụlọikwuu” bụ okwu Igbo doro anya maka tent, ma n'ọnọdụ a ọ na-ezo aka n'ụlọikwuu nsọ nke ofufe dịka arụmụka Hibru 9 si gosi.
- source_word: σκεύη
  choice: ngwa
  rationale: “Ngwa” na-ekpuchi ihe dị iche iche e ji arụ ọrụ n'ụlọikwuu ahụ, na-enweghị ime ka ha bụrụ naanị arịa a na-etinye ihe n'ime ha.
- source_word: λειτουργία
  choice: ozi nsọ
  rationale: N'ebe a okwu ahụ pụtara ọrụ ndị nchụaja na-arụ n'ofufe; “ozi nsọ” na-egosi ọrụ okpukpe pụrụ iche ahụ n'Igbo dị mfe nghọta.
- source_word: αἷμα
  choice: ọbara
  rationale: Ọ bụ ọbara aja ka a na-ekwu maka ya n'ụzọ nkịtị, ya mere e kwesịghị ịkọwagharị ya.
- source_word: ὁμοίως
  choice: n'otu aka ahụ
  rationale: Ọ na-ejikọta omume a na ifesa ọbara a kpọrọ aha n'amaokwu bu ụzọ.
- source_word: ἐράντισεν
  choice: fesa
  rationale: “Fesa” bụ okwu Igbo nkịtị ma doo anya maka itinye ọbara site n'ifesasa ya n'emume ahụ.
- source_word: καὶ ... καὶ
  choice: ma ... ma
  rationale: Usoro “ma ... ma” na-egosipụta nke ọma na a fesara ma ụlọikwuu ahụ ma ngwa niile.
- source_word: τῷ αἵματι
  choice: ji ọbara ahụ
  rationale: “Ji” na-egosipụta na ọbara bụ ihe e ji fesa ha, ebe “ahụ” na-ezo aka n'ọbara e kwuru banyere ya na amaokwu ndị bu ụzọ.
theological_decisions:
- issue: Mmekọrịta okwu a na akụkọ emume Mozis dị n'Ọpụpụ
  choice: Ịsụgharị ya dịka nchịkọta onye dere Hibru nyere banyere iji ọbara fesa ụlọikwuu ahụ na ngwa ọrụ nsọ ya.
  alternative: Ịgbakwunye nkọwa iji kwekọọ n'ụzọ zuru ezu n'ihe ndị e depụtara n'Ọpụpụ ma ọ bụ dozie ihe yiri ka ọ dị iche.
  rationale: Amaokwu Grik ahụ na-ekwu okwu nchịkọta n'enweghị nkọwa ọzọ. Nsụgharị ahụ ekwesịghị itinye nkọwa akụkọ ihe mere eme ma ọ bụ dozie esemokwu dị n'etiti akụkụ Akwụkwọ Nsọ n'ime isiokwu amaokwu ahụ.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, dị nsọ ma dị mfe nghọta. “Ụlọikwuu” na “ozi nsọ” na-edobe ọnọdụ ofufe na emume aja ahụ, ebe usoro “ma ... ma” na-egosipụta njikọ abụọ dị na Grik. E tinyere akara nkọwa ala ala [a] na [b] kpọmkwem n'isiokwu amaokwu ahụ.
