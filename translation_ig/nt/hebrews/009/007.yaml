revisions:
- from: Ma ọ bụ naanị nnukwu onye nchụàjà na-abanye n'ime ime ụlọ nke abụọ ahụ otu ugboro n'afọ[a]; ọ naghịkwa abanye n'ejighị ọbara, bụ́ nke ọ na-achụ n'àjà maka onwe ya na maka mmehie ndị mmadụ mere n'amaghị ama.[b]
  to: Ma n'akụkụ nke abụọ ahụ[a], ọ bụ naanị onyeisi nchụàjà na-abanye otu ugboro n'afọ, ọ bụghịkwa n'enweghị ọbara, nke ọ na-achụ n'àjà maka onwe ya na maka mmehie ndị mmadụ mere n'amaghị ama.[b]
  rationale: The revision replaces a nonstandardly literal expression for “high priest” with the established Standard Igbo term “onyeisi nchụàjà.” It also renders the elliptical δεύτεραν as “n'akụkụ nke abụọ ahụ,” retaining the contextual reference to the inner tabernacle compartment without claiming that the Greek itself supplies a noun. The blood, sacrificial action, beneficiaries, and ignorance-qualified sins remain unchanged in sense. Footnote anchors are retained and placed directly after the relevant spatial phrase and ignorance-qualified sins.
