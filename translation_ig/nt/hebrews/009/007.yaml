  text: εἰς δὲ τὴν δευτέραν ἅπαξ τοῦ ἐνιαυτοῦ μόνος ὁ ἀρχιερεύς, οὐ χωρὶς αἵματος, ὃ προσφέρει ὑπὲρ ἑαυτοῦ καὶ τῶν τοῦ λαοῦ ἀγνοημάτων,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/007.yaml
  text: But into the second room only the high priest enters once a year[a], and not without blood[b], which he offers for himself and for the people's sins committed in ignorance.
translation:
  language: ig
  text: Ma n'akụkụ nke abụọ ahụ[a], ọ bụ naanị onyeisi nchụàjà na-abanye otu ugboro n'afọ, ọ bụghịkwa n'enweghị ọbara, nke ọ na-achụ n'àjà maka onwe ya na maka mmehie ndị mmadụ mere n'amaghị ama.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n'ime ụlọ nke abụọ,” ya bụ, akụkụ ime nke ụlọikwuu ahụ.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “mmehie ndị mmadụ mere n'ebughị n'obi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς δὲ τὴν δευτέραν
  choice: Ma ... n'ime ime ụlọ nke abụọ ahụ
  rationale: Okwu Grik ahụ hapụrụ aha ihe a na-ekwu banyere ya n'ezoghị ọnụ, ma ihe gbara ya gburugburu na-ezo aka n'akụkụ nke abụọ nke ụlọikwuu ahụ. Ịtinye “ime ụlọ” na-eme ka Igbo doo anya ma na-echekwa ọdịiche ebe ahụ.
- source_word: ἅπαξ τοῦ ἐνιαυτοῦ
  choice: otu ugboro n'afọ
  rationale: Nke a bụ ụzọ Igbo dị mfe ma kwekọọ n'okwu Grik nke na-egosi na ọ bụ naanị otu ugboro kwa afọ.
- source_word: μόνος ὁ ἀρχιερεύς
  choice: ọ bụ naanị nnukwu onye nchụàjà
  rationale: Nhọrọ a na-egosi nke ọma na ọ dịghị onye ọzọ a na-ekwe ka ọ banye.
- source_word: οὐ χωρὶς αἵματος
  choice: ọ naghịkwa abanye n'ejighị ọbara
  rationale: A chekwara ụdị nkwupụta Grik nke na-ekwu ya site n'ịjụ ihe megidere ya, tinyere ihe oyiyi ọbara dị mkpa n'àjà.
- source_word: ὃ προσφέρει
  choice: bụ́ nke ọ na-achụ n'àjà
  rationale: N'ọnọdụ a προσφέρει bụ iweta ma ọ bụ inye ihe àjà; “na-achụ n'àjà” na-eme ka ọrụ ịchụ àjà pụta ìhè n'Igbo.
- source_word: ὑπὲρ ἑαυτοῦ
  choice: maka onwe ya
  rationale: Nke a bụ ntụgharị Igbo ebumpụta ụwa nke na-egosi na àjà ahụ metụtara ya ma bụrụkwa n'ihi ya.
- source_word: τῶν τοῦ λαοῦ ἀγνοημάτων
  choice: mmehie ndị mmadụ mere n'amaghị ama
  rationale: Nhọrọ a na-echekwa na ἀγνοήματα bụ mmehie, ma na-akọwakwa na e mere ha n'amaghị ama, ọ bụghị nanị enweghị ihe ọmụma.
theological_decisions:
- issue: Ụdị mmehie ἀγνοήματα na-ezo aka na ya n'usoro ịchụ àjà
  choice: mmehie ndị mmadụ mere n'amaghị ama
  alternative: mmehie ndị mmadụ mere n'ebughị n'obi
  rationale: Nke a na-echekwa ma ịdị njọ nke mmehie ahụ ma ihe okwu Grik na-egosi banyere amaghị ama, n'ebughị ụzọ tinye nkọwa ozizi karịrị ihe amaokwu ahụ kwuru.
translation_notes:
  register: Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E ji “nnukwu onye nchụàjà” mee ka ἀρχιερεύς doo onye nkịtị anya, ma chekwaa asụsụ ịchụ àjà na ihe oyiyi ọbara.
