revisions:
- from: Ihe ndị a metụtara naanị nri na ihe ọṅụṅụ na ịsa ahụ dị iche iche—ụkpụrụ nke anụ ahụ e nyere ka a na-edebe ruo n’oge a ga-eme ka ihe dịzie n’usoro.
  to: Ihe ndị a metụtara naanị nri na ihe ọṅụṅụ na ịsa dị iche iche—iwu gbasara anụ ahụ nke e nyere ka a na-edebe ruo n’oge a ga-eme ka ihe dịzie n’usoro.
  rationale: The revision clarifies the ritual-washing reference and uses more natural Igbo for fleshly/outward regulations, while retaining the source’s syntax, scope, and theological openness concerning the time of διορθώσεως.
