id: HEB.9.10
reference: Hebrews 9:10
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: μόνον ἐπὶ βρώμασιν καὶ πόμασιν καὶ διαφόροις βαπτισμοῖς, ⸀δικαιώματα σαρκὸς μέχρι καιροῦ διορθώσεως ἐπικείμενα.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/010.yaml
  text: concerned only with foods and drinks and various washings, fleshly regulations imposed until the time of reformation.
translation:
  language: ig
  text: Ihe ndị a metụtara naanị nri na ihe ọṅụṅụ na ịsa dị iche iche—iwu gbasara anụ ahụ nke e nyere ka a na-edebe ruo n’oge a ga-eme ka ihe dịzie n’usoro.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βαπτισμοῖς
  choice: ịsa ahụ
  rationale: N’ebe a, okwu ahụ na-ezo aka n’ịsa ahụ dị iche iche dịka emume nsọ, ọ bụghị naanị baptizim Ndị Kraịst.
- source_word: δικαιώματα σαρκὸς
  choice: ụkpụrụ nke anụ ahụ
  rationale: Nsụgharị a na-edobe njikọ okwu Grik ahụ na ihe metụtara anụ ahụ, n’ebughị ụzọ kọwaa ya naanị dịka iwu gbasara ihe mpụga.
- source_word: καιροῦ διορθώσεως
  choice: oge a ga-eme ka ihe dịzie n’usoro
  rationale: Ọ na-egosipụta echiche nke imezi ma ọ bụ idozigharị ihe nke ọma, ma na-ezere itinye nkọwa ụka pụrụ iche n’okwu ahụ.
- source_word: ἐπικείμενα
  choice: e nyere ka a na-edebe
  rationale: N’ọnọdụ a, participle ahụ pụtara na e tinyere iwu ndị ahụ n’isi ndị mmadụ dịka ihe ha ga-edebe.
theological_decisions:
- issue: Ihe 'oge idozi ihe' pụtara kpọmkwem
  choice: oge a ga-eme ka ihe dịzie n’usoro
  alternative: oge mmezigharị
  rationale: Ahịrịokwu a na-edobe obosara na ntakịrị mgbagwoju anya nke διορθώσεως, n’akọwaghị kpọmkwem ihe omume ma ọ bụ usoro nkà mmụta okpukpe ọ na-ezo aka na ya.
- issue: Njikọ δικαιώματα na σαρκὸς
  choice: ụkpụrụ nke anụ ahụ
  alternative: iwu gbasara anụ ahụ
  rationale: Nhọrọ ahụ na-edobe ịdị ike nke genitive Grik na ụda 'fleshly regulations' n’enweghị ịgbanwe 'anụ ahụ' ka ọ bụrụ echiche nke mmehie.
translation_notes:
  register: Standard Igbo dị ugbu a, nke dị ùgwù ma doo ndị nkịtị anya. E jiri akara ogologo kewaa ndepụta ahụ na nkọwa na-esochi ya, ka usoro ahịrịokwu Grik ahụ ghara ịdị arọ n’Igbo.
