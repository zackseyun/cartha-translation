id: HEB.9.15
reference: Hebrews 9:15
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Καὶ διὰ τοῦτο διαθήκης καινῆς μεσίτης ἐστίν, ὅπως θανάτου γενομένου εἰς ἀπολύτρωσιν τῶν ἐπὶ τῇ πρώτῃ διαθήκῃ παραβάσεων τὴν ἐπαγγελίαν λάβωσιν οἱ κεκλημένοι τῆς αἰωνίου κληρονομίας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/015.yaml
  text: And for this reason he is the mediator of a new covenant[a], so that, since a death has occurred for the redemption of the transgressions committed under the first covenant, those who have been called may receive the promise of the eternal inheritance.
translation:
  language: ig
  text: N’ihi nke a, ọ bụ onye ogbugbo nke ọgbụgba ndụ ọhụrụ[a], ka, ebe ọnwụ mere maka mgbapụta nke mmebi iwu ndị e mere n’okpuru ọgbụgba ndụ mbụ, ndị a kpọrọ òkù nwee ike ịnata nkwa nke ihe nketa ebighị ebi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “akwụkwọ nketa.” Okwu Grik διαθήκη nwere ike ịpụta ma “ọgbụgba ndụ” ma akwụkwọ nke na-ekpebi otu a ga-esi kee ihe nketa mgbe mmadụ nwụsịrị. Ndị Hibru 9:16–17 ji nghọta abụọ ahụ arụ ọrụ, ma “ọgbụgba ndụ” kacha daba n’ọdịiche dị n’etiti nke ọhụrụ na ọgbụgba ndụ mbụ n’amaokwu a.
    reason: alternative_reading
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: n’ihi nke a
  rationale: Na-egosi ihe kpatara okwu a ji soro arụmụka dị n’amaokwu bu ya ụzọ, n’ụzọ Igbo dị mfe ma doo anya.
- source_word: διαθήκης καινῆς
  choice: nke ọgbụgba ndụ ọhụrụ
  rationale: Ọgbụgba ndụ bụ isi ihe okwu ahụ pụtara n’ebe a, karịchaa n’ihi ọdịiche dị n’etiti nke ọhụrụ na ọgbụgba ndụ mbụ; e deberekwa echiche ‘akwụkwọ ikike ikpeazụ’ n’okpuru ala.
- source_word: μεσίτης
  choice: onye ogbugbo
  rationale: Okwu Igbo a na-egosi onye nọ n’etiti ndị abụọ iji mee ka mmekọrịta ma ọ bụ nkwekọrịta guzosie ike.
- source_word: ὅπως
  choice: ka
  rationale: Na-echekwa echiche ebumnuche ma ọ bụ ihe si na ya pụta n’ụzọ Igbo nkịtị.
- source_word: θανάτου γενομένου
  choice: ebe ọnwụ mere
  rationale: Na-egosi na ọnwụ ahụ emeela, nakwa na ọ bụ ntọala nke mgbapụta a na-ekwu maka ya, n’enweghị ịkọwapụta onye nwụrụ karịa ka ahịrịokwu Grik ahụ si mee.
- source_word: ἀπολύτρωσιν
  choice: ịgbapụta
  rationale: Na-egosi ịtọhapụ mmadụ site n’ọnọdụ o ji ụgwọ ma ọ bụ n’agbụ site n’ọnụ ahịa e nyere, nke dabara n’ọnọdụ àjà dị n’Akwụkwọ Ndị Hibru.
- source_word: τῶν ἐπὶ τῇ πρώτῃ διαθήκῃ παραβάσεων
  choice: mmebi iwu ndị e mere n’okpuru ọgbụgba ndụ mbụ
  rationale: ‘N’okpuru’ na-egosi oge ma ọ bụ ọnọdụ ọgbụgba ndụ mbụ; ‘ndị e mere’ na-eme ka njikọ ahụ doo anya n’Igbo.
- source_word: τὴν ἐπαγγελίαν
  choice: nkwa
  rationale: Na-edobe aha otu ihe dị na Grik ma jikọta ya na ihe nketa e kwere ná nkwa.
- source_word: λάβωσιν
  choice: wee nata
  rationale: Na-egosi ihe e bu n’obi ka o mee n’ihi ọrụ onye ogbugbo na ọnwụ mgbapụta ahụ.
- source_word: οἱ κεκλημένοι
  choice: ndị a kpọrọ òkù
  rationale: Na-egosi ndị nọ n’ọnọdụ nke ịbụ ndị a kpọrọ, ma bụrụkwa okwu Igbo a na-aghọta nke ọma.
- source_word: τῆς αἰωνίου κληρονομίας
  choice: nke ihe nketa ebighị ebi
  rationale: Na-echekwa njikọ Grik ahụ na echiche nke ihe nketa na-adịru mgbe ebighị ebi.
theological_decisions:
- issue: Onye bụ isiokwu e zoro ezo na ἐστίν
  choice: E ji ‘ọ’ mee ka isiokwu ahụ pụta ìhè, na-ezo aka na Kraịst/Jesu dịka ọnọdụ okwu bu ụzọ si gosi.
  alternative: Ịhapụ ngwaa ahụ n’enweghị isiokwu a kpọrọ aha.
  rationale: Igbo chọrọ isiokwu doro anya n’ebe a; ọnọdụ okwu ahụ na-eme ka onye a na-ekwu maka ya doo anya n’enweghị itinye ozizi ọhụrụ.
- issue: Ihe διαθήκη pụtara n’amaokwu a
  choice: ọgbụgba ndụ
  alternative: akwụkwọ ikike ikpeazụ
  rationale: Ọdịiche dị n’etiti ọgbụgba ndụ ọhụrụ na nke mbụ na-akwado ‘ọgbụgba ndụ’; ma e chekwara nghọta ọzọ nke okwu Grik ahụ n’okpuru ala n’ihi otú Hibru 9:16–17 si jiri ya.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji ‘onye ogbugbo,’ ‘ịgbapụta,’ na ‘ihe nketa ebighị ebi’ chekwaa ịdị arọ nke okwu okpukpe ahụ n’enweghị ịgbaso okwu otu ụka pụrụ iche.
