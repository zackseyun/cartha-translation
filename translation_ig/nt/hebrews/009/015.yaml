review_pass:
  verdict: revise
  source_fidelity: 'Isi ihe dị na ntụgharị ahụ kwekọrọ n’asụsụ Grik: Kraịst bụ onye ogbugbo nke ọgbụgba ndụ ọhụrụ; ọnwụ emewo maka mgbapụta mmebi iwu n’okpuru ọgbụgba ndụ mbụ; ndị a kpọrọ òkù ga-anata nkwa nke ihe nketa ebighị ebi. Otú ọ dị, nhazi mbụ nke nkebiokwu ebumnuche ahụ anaghị ekpughe ὅπως nke ọma dịka ‘ka ndị a kpọrọ òkù ... nwee ike ịnata.’'
  naturalness: ‘Ọ bụkwa n’ihi nke a ka ọ bụ’ dị ntakịrị arọ na Igbo. ‘N’ihi nke a, ọ bụ ...’ dị mfe ma na-adịkwa n’usoro Standard Igbo. Itinye ndị a kpọrọ òkù ozugbo mgbe ‘ka’ na-eme ka mmekọrịta ebumnuche na nsonaazụ doo anya.
  terminology: ‘Onye ogbugbo,’ ‘ọgbụgba ndụ,’ ‘mgbapụta,’ na ‘ihe nketa ebighị ebi’ dabara nke ọma. N’okpuru ala, ‘akwụkwọ ikike ikpeazụ’ abụghị nkọwa ziri ezi nke ‘testament/will’; ọ kwesịrị ịkọwa ya dị ka ‘akwụkwọ nketa’ ma ọ bụ uche onye nwụrụ anwụ banyere ikesa ihe onwunwe ya.
  issues:
  - severity: medium
    issue: Nhazi nke nkebiokwu ‘ka ... ndị a kpọrọ òkù wee nata’ anaghị egosi ebumnuche ὅπως nke ọma.
    rationale: N’asụsụ Grik, ὅπως kpọmkwem na-eduga na ‘ndị a kpọrọ òkù ... nata.’ Ịhazigharị ya ka ‘ka ndị a kpọrọ òkù ... nwee ike ịnata’ na-echekwa njikọ a n’enweghị mgbanwe pụtara.
  - severity: medium
    issue: Nkọwa ala ‘akwụkwọ ikike ikpeazụ’ maka testament adịghị kpọmkwem.
    rationale: Testament n’echiche iwu abụghị akwụkwọ ikike; ọ bụ akwụkwọ/uche banyere ikesa ihe nketa mgbe mmadụ nwụsịrị. ‘Akwụkwọ nketa’ bụ nhọrọ dị mkpirikpi ma doo anya karịa.
