revisions:
- from: Ọ bụkwa n’ihi nke a ka ọ bụ onye ogbugbo nke ọgbụgba ndụ ọhụrụ[a], ka, ebe ọnwụ mere iji gbapụta mmebi iwu ndị e mere n’okpuru ọgbụgba ndụ mbụ, ndị a kpọrọ òkù wee nata nkwa nke ihe nketa ebighị ebi.
  to: N’ihi nke a, ọ bụ onye ogbugbo nke ọgbụgba ndụ ọhụrụ[a], ka, ebe ọnwụ mere maka mgbapụta nke mmebi iwu ndị e mere n’okpuru ọgbụgba ndụ mbụ, ndị a kpọrọ òkù nwee ike ịnata nkwa nke ihe nketa ebighị ebi.
  rationale: E degharịrị mmalite na nkebiokwu ebumnuche ka ha bụrụ Igbo nkịtị ma chekwaa usoro na ọrụ ὅπως. E dochiri ‘iji gbapụta’ anya na ‘maka mgbapụta nke’ ka ἀπολύτρωσιν nọgide bụrụ aha, dị ka ọ dị n’asụsụ Grik. E meziekwara nkọwa ala banyere testament ka ọ bụrụ nke ziri ezi n’iwu ma ghara ime ka nghọta abụọ nke διαθήκη pụta n’ụzọ na-ezighị ezi.
