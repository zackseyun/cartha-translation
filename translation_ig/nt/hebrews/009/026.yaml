id: HEB.9.26
reference: Hebrews 9:26
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐπεὶ ἔδει αὐτὸν πολλάκις παθεῖν ἀπὸ καταβολῆς κόσμου· ⸀νυνὶ δὲ ἅπαξ ἐπὶ συντελείᾳ τῶν αἰώνων εἰς ἀθέτησιν ⸀ἁμαρτίας διὰ τῆς θυσίας αὐτοῦ πεφανέρωται.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/026.yaml
  text: Otherwise[a], he would have had to suffer many times since the foundation of the world. But as it is[c][b], he has appeared once for all at the consummation of the ages to put away sin through the sacrifice of himself.
translation:
  language: ig
  text: A sị na ọ bụghị otú ahụ, ọ gaara adị mkpa ka ọ taa ahụhụ ọtụtụ ugboro kemgbe e tọrọ ntọala ụwa. Ma ugbu a, ọ pụtawo naanị otu ugboro n'oge mmezu nke oge niile[a], iji wepụ mmehie[b] site n’iji onwe ya chụọ àjà[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ná njedebe nke oge niile.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “iji kagbuo mmehie” ma ọ bụ “iji mee ka mmehie ghara ịdị ire.”
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “site n’àjà ya.” Okwu Grik ahụ na-ekwu n’ụzọ nkịtị, “site n’àjà ya”; n’amaokwu a, “iji onwe ya chụọ àjà” na-eme ka echiche nke inye onwe ya n’àjà pụta ìhè.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεὶ
  choice: A sị na ọ bụghị otú ahụ
  rationale: N’ebe a, okwu ahụ na-egosi ihe gaara esochi ma a sị na Kraịst na-achụ onwe ya n’àjà ugboro ugboro. Nsụgharị a na-egosipụta ọnọdụ ahụ e chere n’echiche n’Igbo doro anya.
- source_word: ἔδει
  choice: ọ gaara adị mkpa ka
  rationale: Ọ na-egosipụta mkpa gaara adị n’ọnọdụ e chere n’echiche, ọ bụghị ihe mere n’eziokwu.
- source_word: πολλάκις
  choice: ọtụtụ ugboro
  rationale: Nke a na-echekwa ọdịiche dị n’etiti ‘ọtụtụ ugboro’ na ἅπαξ, ‘naanị otu ugboro.’
- source_word: παθεῖν
  choice: taa ahụhụ
  rationale: Ọ bụ okwu Igbo dị ugbu a ma dịkwa arọ nke na-egosi ahụhụ Kraịst metụtara ọnwụ àjà ya.
- source_word: ἀπὸ καταβολῆς κόσμου
  choice: kemgbe a tọrọ ntọala ụwa
  rationale: ‘Kemgbe’ na-egosi oge malitere mgbe e kere ma ọ bụ tọrọ ntọala ụwa wee na-aga n’ihu.
- source_word: νυνὶ δὲ
  choice: Ma ugbu a
  rationale: Ọ na-egosi ọdịiche siri ike n’etiti ihe gaara eme na ihe mere n’eziokwu ugbu a.
- source_word: ἅπαξ
  choice: naanị otu ugboro
  rationale: Ọ na-egosi na ihe ahụ mere otu ugboro, ọ bụghị ugboro ugboro, ma ọ naghị atụkwasị nkọwa okpukpe ọzọ n’elu ihe odide ahụ.
- source_word: ἐπὶ συντελείᾳ τῶν αἰώνων
  choice: mgbe oge niile ruru ná mmezu ha
  rationale: Nke a na-echekwa echiche nke oge dị iche iche iru n’isi njedebe ma ọ bụ mmezu ha, kama ime ya naanị ‘njedebe ụwa.’
- source_word: εἰς ἀθέτησιν ἁμαρτίας
  choice: iji wepụ mmehie
  rationale: ‘Wepụ’ bụ okwu mmadụ niile ga-aghọta, ma ọ ka na-egosi ebumnobi siri ike nke ime ka mmehie ghara inwe ọnọdụ ma ọ bụ ịdị ire.
- source_word: ἁμαρτίας
  choice: mmehie
  rationale: E chekwara otu mkpụrụ okwu dị na Grik, nke nwere ike igosi mmehie dịka eziokwu ma ọ bụ ike a na-emeso, ọ bụghị naanị omume mmehie dị iche iche.
- source_word: διὰ τῆς θυσίας αὐτοῦ
  choice: site n’iji onwe ya chụọ àjà
  rationale: Nke a na-eme ka o doo anya na Kraịst nyere onwe ya dịka àjà, nke bụ ihe usoro okwu Grik ahụ nwere ike igosi n’ebe a.
- source_word: πεφανέρωται
  choice: ọ pụtala
  rationale: Ụdị ngwaa Igbo a na-egosi ihe mere eme nke uru ya ka dị ugbu a, ma na-ada nke ọma n’asụsụ ndị mmadụ na-asụ.
theological_decisions:
- issue: Ike ἅπαξ nwere n’ọrụ àjà Kraịst
  choice: naanị otu ugboro
  alternative: otu ugboro
  rationale: ‘Naanị’ na-eme ka ọdịiche ya na ‘ọtụtụ ugboro’ pụta ìhè ma na-egosi na àjà ahụ abụghị ihe a na-emegharị emegharị, n’enweghị ịgbakwunye ozizi na-adịghị n’ihe odide ahụ.
- issue: Oke ihe ἁμαρτίας nke dị n’otu mkpụrụ okwu na-ezo aka na ya
  choice: mmehie
  alternative: mmehie dị iche iche
  rationale: Otu mkpụrụ okwu Grik ahụ nwere ike ile mmehie anya dịka eziokwu ma ọ bụ ike e wepụrụ. Ide ya ‘mmehie’ na-echekwa obosara echiche ahụ.
- issue: Ihe αὐτοῦ na-ezo aka na ya n’okwu gbasara àjà
  choice: iji onwe ya chụọ àjà
  alternative: site n’àjà ya
  rationale: Ihe gbara amaokwu ahụ gburugburu na-ekwu maka Kraịst inye onwe ya. E debere nsụgharị dị mkpirikpi ‘site n’àjà ya’ n’ala ala peeji iji gosi ụzọ ọzọ e nwere ike isi ghọta usoro okwu Grik ahụ.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, dị nsọpụrụ ma dị mfe nghọta. A họọrọ ahịrịokwu ndị na-ada ka Igbo nkịtị, ma e chekwara ọdịiche dị n’etiti ọnọdụ e chere n’echiche na ihe mere n’eziokwu, otu ugboro na ọtụtụ ugboro, nakwa otu mkpụrụ okwu ‘mmehie.’ Akara ala ala peeji [a], [b], na [c] niile dị n’ebe okwu ha na-akọwa nọ.
