  text: διαθήκη γὰρ ἐπὶ νεκροῖς βεβαία, ἐπεὶ ⸀μήποτε ἰσχύει ὅτε ζῇ ὁ διαθέμενος.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/017.yaml
  text: For a covenant is valid over dead ones[b][a], since it is never in force while the one who made it is living.
translation:
  language: ig
  text: N’ihi na ọgbụgba ndụ na-adị irè n’ihe gbasara ọnwụ[a], n’ihi na ọ dịghị mgbe ọ na-adị irè mgbe onye mere ya ka dị ndụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “N’ihi na akwụkwọ nketa na-adị irè nanị mgbe mmadụ nwụsịrị, n’ihi na ọ dịghị mgbe ọ na-adị irè mgbe onye dere ya ka dị ndụ.” Okwu Grik a pụrụ ịpụta ma “ọgbụgba ndụ” ma “akwụkwọ nketa” (testament).
    reason: alternative_reading
lexical_decisions:
- source_word: διαθήκη
  choice: ọgbụgba ndụ
  rationale: Ọ bụ okwu kwekọrọ n’isiokwu gbara amaokwu a gburugburu na Ndị Hibru 8–10. Ma ebe okwu Grik a nwekwara ike ịpụta akwụkwọ ikike e dere banyere ihe a ga-eme mgbe mmadụ nwụrụ, e debere nghọta ahụ n’ala peeji.
- source_word: ἐπὶ νεκροῖς
  choice: n’ebe ndị nwụrụ anwụ nọ
  rationale: Nke a na-edebe mkpụmkpụ na ihe edoghị anya nke okwu Grik ahụ, na-ekweghị kpọmkwem ma ọ na-ekwu banyere ndị nwụrụ anwụ n’ihe gbasara akwụkwọ ikike, ka ọ̀ bụ ọnwụ metụtara ime ka ọgbụgba ndụ guzosie ike.
- source_word: βεβαία
  choice: na-eguzosi ike
  rationale: Nke a na-egosi na ọgbụgba ndụ ahụ akwadoro ma nwee ike iwu, ọ bụghị naanị na o doro anya.
- source_word: ἐπεὶ
  choice: ebe ọ bụ na
  rationale: Ọ na-ewebata ihe kpatara okwu bu ya ụzọ.
- source_word: μήποτε
  choice: ọ dịghị mgbe
  rationale: N’ebe a, okwu ahụ pụtara na ihe ahụ anaghị eme n’oge ọ bụla.
- source_word: ἰσχύει
  choice: na-adị ire
  rationale: Nkebiokwu a na-egosi na ihe ahụ nwere ike iwu ma na-arụ ọrụ n’ụzọ iwu kwadoro.
- source_word: ὅτε ζῇ
  choice: mgbe ... ka dị ndụ
  rationale: Ọ na-eme ka ọdịiche dị n’etiti ọnwụ na ịdị ndụ na-aga n’ihu pụta ìhè n’Igbo dị mfe.
- source_word: ὁ διαθέμενος
  choice: onye mere ya
  rationale: Nke a anaghị ekpebi ma onye ahụ bụ onye mere ọgbụgba ndụ ka ọ̀ bụ onye dere akwụkwọ ikike banyere ihe ya mgbe ọ nwụrụ.
theological_decisions:
- issue: Ma διαθήκη ọ̀ pụtara ọgbụgba ndụ ka ọ̀ bụ akwụkwọ ikike banyere ihe mmadụ mgbe ọ nwụrụ.
  choice: E jiri “ọgbụgba ndụ” mee ihe n’ahụ amaokwu.
  alternative: “akwụkwọ ikike e dere banyere ihe a ga-eme mgbe mmadụ nwụrụ”
  rationale: Ihe gbara amaokwu a gburugburu lekwasịrị anya n’ọgbụgba ndụ na ọbara e ji malite ya, ma okwu ndị dị n’amaokwu 16–17 nwekwara ike inwe nghọta gbasara akwụkwọ ikike. Ya mere, e debere nghọta ọzọ ahụ n’ala peeji kama iwepụ esemokwu dị n’ederede.
- issue: Otu a ga-esi ghọta ἐπὶ νεκροῖς.
  choice: 'E debere ya n’ụdị ghe oghe: “n’ebe ndị nwụrụ anwụ nọ.”'
  alternative: “mgbe ọnwụ mere” ma ọ bụ “n’ihe banyere ndị nwụrụ anwụ”
  rationale: Okwu Grik ahụ dị mkpụmkpụ, ọ pụkwara izo aka n’ọnwụ onye dere akwụkwọ ikike ma ọ bụ n’ọnwụ metụtara ịchụ aja e ji kwado ọgbụgba ndụ. Nsụgharị ahụ anaghị amanye otu nghọta.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta mee ihe. A kpachapụrụ anya debe mgbagwoju anya dị n’okwu Grik, ọ bụ ezie na “n’ebe ndị nwụrụ anwụ nọ” dị ntakịrị mkpụmkpụ n’Igbo, ka a ghara ikpebi otu nkọwa n’ime nkọwa abụọ ahụ.
