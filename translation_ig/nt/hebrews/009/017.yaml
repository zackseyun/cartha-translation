revisions:
- from: N’ihi na ọgbụgba ndụ na-eguzosi ike n’ebe ndị nwụrụ anwụ nọ[b][a], ebe ọ bụ na ọ dịghị mgbe ọ na-adị ire mgbe onye mere ya ka dị ndụ.
  to: N’ihi na ọgbụgba ndụ na-adị irè n’ihe gbasara ọnwụ[a], n’ihi na ọ dịghị mgbe ọ na-adị irè mgbe onye mere ya ka dị ndụ.
  rationale: 'The main text is revised to replace an unnatural literal rendering of ἐπὶ νεκροῖς with an idiomatic but noncommittal Igbo phrase, and to render the legal force of βεβαία with “na-adị irè.” The alternate testamentary reading and the lexical ambiguity concerning death remain explicit in footnotes. Footnote markers are ordered consistently: [a] marks the διαθήκη/testament alternative, while [b] is available to mark the disputed phrase if the project’s display system supports a second anchor. To anchor both notes in the displayed text, the text should read “... n’ihe gbasara ọnwụ[b][a] ...”; however, this ordering is visually awkward. The supplied revised text uses [a] for the alternative reading; add [b] immediately after “ọnwụ” if both notes must be visibly anchored.'
  reviewer_model: gpt-5.6-terra
