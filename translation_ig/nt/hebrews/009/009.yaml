id: HEB.9.9
reference: Hebrews 9:9
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἥτις παραβολὴ εἰς τὸν καιρὸν τὸν ἐνεστηκότα, καθ’ ⸀ἣν δῶρά τε καὶ θυσίαι προσφέρονται μὴ δυνάμεναι κατὰ συνείδησιν τελειῶσαι τὸν λατρεύοντα,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/009.yaml
  text: which is a parable for the present time[a], according to which both gifts and sacrifices are offered that are not able to perfect the worshiper with respect to conscience,
translation:
  language: ig
  text: nke bụ ihe atụ maka oge dị ugbu a[a], nke dịka ya si dị, a na-eweta ma onyinye ma aja ndị na-enweghị ike ime ka onye na-efe ofufe zuo oke n’ihe gbasara akọnuche ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ilu” ma ọ bụ “akara” maka oge dị ugbu a.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἥτις
  choice: nke bụ
  rationale: Ọ na-ejikọta amaokwu a na ụlọikwuu ahụ a kpọtụrụ aha n'amaokwu bu ụzọ, n'emeghị ka ihe ọ na-ezo aka na ya sie ike karịa Grik.
- source_word: παραβολὴ
  choice: ilu e ji akọwa
  rationale: N'ọnọdụ a, okwu ahụ na-egosi ihe e ji atụnyere ma kọwaa ihe ọzọ; ntụgharị a na-edobe echiche ihe atụ ahụ n'Igbo dị mfe nghọta, ebe nkọwa ala peeji na-echekwa ‘akara’ na ‘ihe atụ’ dị ka nhọrọ ndị ọzọ.
- source_word: εἰς τὸν καιρὸν τὸν ἐνεστηκότα
  choice: e ji akọwa oge dị ugbu a
  rationale: Nke a na-egosi oge ahụ dị ugbu a n'arụmụka onye dere akwụkwọ ahụ, ma na-ahapụ njikọ oge ahụ ka ọ dị n'enweghị ịkọwa ya karịa isi mmalite.
- source_word: καθ’ ἣν
  choice: Dị ka usoro ya si dị
  rationale: Ọ na-egosi na iweta onyinye na aja na-aga n'okpuru usoro ihe atụ ma ọ bụ ụlọikwuu ahụ a kọwara.
- source_word: δῶρά τε καὶ θυσίαι
  choice: ma onyinye ma aja
  rationale: Ọ na-echekwa okwu abụọ dị iche iche gbasara ofufe na ike nke τε καὶ, ‘ma ... ma.’
- source_word: προσφέρονται
  choice: a na-eweta
  rationale: Ụdị a na-egosi omume a na-eme ugboro ugboro ma na-echekwa passive nke Grik n'ụzọ ebumpụta ụwa n'Igbo.
- source_word: μὴ δυνάμεναι
  choice: ndị na-enweghị ike
  rationale: Ọ na-egosi enweghị ike nke onyinye na aja ndị ahụ ma na-ejigide njikọ participle ahụ.
- source_word: κατὰ συνείδησιν
  choice: n'ihe banyere akọnuche ya
  rationale: Ọ na-amachi ebe izu oke ahụ metụtara—akọnuche—n'emeghị ka ọ bụrụ naanị ezi obi onye ahụ.
- source_word: τελειῶσαι
  choice: ime ka ... zuo oke
  rationale: 'Ọ na-echekwa ibu okwu τελειόω n''Akwụkwọ Ndị Hibru: ime ka mmadụ ruo ọnọdụ e zubere ma bụrụ onye ruru eru n''ihu Chineke.'
- source_word: τὸν λατρεύοντα
  choice: onye na-efe ofufe
  rationale: Ọ bụ ụzọ Igbo doro anya ma dị ebube isi kwuo onye na-arụ ọrụ ofufe, ma na-echekwa singular nke Grik.
theological_decisions:
- issue: Ntụgharị παραβολή n'ọnọdụ gbasara ụlọ nsọ na ihe ọ na-anọchi anya
  choice: ilu e ji akọwa
  alternative: akara; ihe atụ
  rationale: ‘Ilu e ji akọwa’ na-echekwa echiche nke ntụnyere na ihe na-anọchi anya ihe ọzọ, n'emeghị ka ọ bụrụ naanị akara nkịtị. E debere nhọrọ ndị ọzọ ziri ezi na nkọwa ala peeji ka esemokwu lexical ahụ ghara ịla n'iyi.
- issue: Ihe izu oke ahụ metụtara
  choice: n'ihe banyere akọnuche ya
  alternative: ime ka akọnuche ya zuo oke
  rationale: Nhọrọ a na-echekwa κατὰ συνείδησιν dị ka nkọwa banyere akụkụ ma ọ bụ ebe izu oke ahụ metụtara, kama ime akọnuche ka ọ bụrụ kpọmkwem ihe e mere omume ahụ n'ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. ‘Aja’ na ‘onyinye’ na-edobe asụsụ ofufe; ‘akọnuche’ bụ okwu a na-ejikarị eme ihe maka συνείδησις. Akara nkọwa ala peeji [a] dị n'isi ederede.
