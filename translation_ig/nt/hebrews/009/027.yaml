review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the generic human reference, the single occurrence of death, and the unspecific sense of postmortem judgment. However, “e si kpebie” means more nearly “it is decided how/that,” adding the manner-oriented particle “si” rather than directly expressing what is fixed or appointed. The opening comparison must also remain clear as it continues into verse 28.
  naturalness: “Dịkwa ka” and “ma mgbe nke a gasịrị” are understandable, but “Dị ka …, mgbe nke a gasịrịkwa, ikpe,” is smoother Standard Igbo and retains the verse’s deliberately unfinished comparative construction.
  terminology: “Ụmụ mmadụ,” “otu ugboro,” and “ikpe” are appropriate. “Ikpe” properly leaves κρίσις broad, without imposing condemnation or a specified eschatological scheme.
  issues:
  - severity: medium
    issue: “e si kpebie” does not most directly render ἀπόκειται.
    rationale: The source indicates that death is laid down, reserved, or appointed for human beings. Removing “si” gives the natural impersonal Igbo expression for what has been appointed.
  - severity: low
    issue: The connective “ma” may sound adversative.
    rationale: δέ here marks the next item in sequence, not a strong contrast. The enclitic “-kwa” naturally links the following phrase without adding an unnecessary adversative sense.
  revised_text: Dị ka e kpebiri na ụmụ mmadụ ga-anwụ otu ugboro, mgbe nke a gasịrịkwa, ikpe,
