source:
  edition: SBLGNT
  text: καὶ καθ’ ὅσον ἀπόκειται τοῖς ἀνθρώποις ἅπαξ ἀποθανεῖν, μετὰ δὲ τοῦτο κρίσις,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/027.yaml
  text: And just as it is appointed for men to die once[a], and after this, judgment,
translation:
  language: ig
  text: Dị ka e kpebiri na ụmụ mmadụ ga-anwụ otu ugboro, mgbe nke a gasịrịkwa, ikpe,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθ’ ὅσον
  choice: Dịkwa ka
  rationale: N'ebe a, okwu ahụ na-amalite ntụnyere nke ga-ezu n'amaokwu na-esonụ; “Dịkwa ka” na-egosipụta njikọ ahụ n'Igbo n'ụzọ doro anya.
- source_word: ἀπόκειται
  choice: e si kpebie
  rationale: N'usoro a, ngwaa ahụ na-egosi ihe e doziri ma ọ bụ ihe a kara aka nye mmadụ, ọ bụghị nanị ihe e debere n'ebe.
- source_word: τοῖς ἀνθρώποις
  choice: ụmụ mmadụ
  rationale: Okwu Grik a na-ezo aka n'ozuzu mmadụ niile; “ụmụ mmadụ” bụ okwu Igbo nkịtị nke gụnyere nwoke na nwanyị n'enweghị mgbagwoju anya.
- source_word: ἅπαξ
  choice: otu ugboro
  rationale: Nke a na-egosi na ọnwụ ahụ na-eme naanị otu mgbe; ọ naghị agbakwụnye echiche sara mbara nke “otu ugboro ruo mgbe ebighị ebi.”
- source_word: ἀποθανεῖν
  choice: ga-anwụ
  rationale: Nke a na-enye ihe infinitive Grik pụtara n'usoro Igbo dị mma mgbe ọ na-eso “e si kpebie na.”
- source_word: μετὰ δὲ τοῦτο
  choice: ma mgbe nke a gasịrị
  rationale: 'Nkebi a na-egosi usoro: ọnwụ buru ụzọ, ikpe esochie; “ma” na-echekwa δέ ma mee ka ahịrịokwu ahụ gaa nke ọma.'
- source_word: κρίσις
  choice: ikpe
  rationale: “Ikpe” na-echekwa echiche ikpe ma ọ bụ nyocha ikpe n'enweghị ime ka ọ bụrụrịrị amamikpe ma ọ bụ ịkọwa usoro ikpe ikpeazụ kpọmkwem.
theological_decisions:
- issue: Ihe τοῖς ἀνθρώποις gụnyere
  choice: A sụgharịrị ya “ụmụ mmadụ,” nke na-ezo aka n'ụmụ mmadụ niile.
  alternative: “ndị nwoke”
  rationale: Ọ bụ ezie na ọdịdị okwu Grik ahụ bụ plural nwoke, ike ya n'ebe a bụ izugbe. “Ụmụ mmadụ” na-ebuga ihe ahụ pụtara n'Igbo ma ghara ime ka ndị na-agụ ya chee na ọ bụ naanị nwoke ka a na-ekwu maka ha.
- issue: Oke ihe κρίσις pụtara mgbe ọnwụ gasịrị
  choice: A sụgharịrị ya naanị “ikpe.”
  alternative: “amamikpe” ma ọ bụ “ikpe ikpeazụ”
  rationale: Amaokwu ahụ kwuru na ikpe na-esochi ọnwụ, ma o kọwaghị ebe a nsonaazụ ikpe ahụ ma ọ bụ nkọwa niile gbasara oge ikpeazụ. Ya mere, a hapụrụ okwu ahụ ka o buru ibu dịka nke Grik.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji nhazi ahịrịokwu na akara rikoma chekwaa eziokwu ahụ na amaokwu a bụ akụkụ mbụ nke ntụnyere na-aga n'ihu n'amaokwu 28.
