revisions:
- from: Dịkwa ka e si kpebie na ụmụ mmadụ ga-anwụ otu ugboro, ma mgbe nke a gasịrị, ikpe,
  to: Dị ka e kpebiri na ụmụ mmadụ ga-anwụ otu ugboro, mgbe nke a gasịrịkwa, ikpe,
  rationale: The revision directly renders the appointed/fixed sense of ἀπόκειται with “e kpebiri,” preserves the comparison introduced by καθ’ ὅσον for completion in verse 28, and expresses the sequence from death to judgment without making δέ adversative. No footnote is needed in Igbo, since “ụmụ mmadụ” already unambiguously has the generic human sense.
