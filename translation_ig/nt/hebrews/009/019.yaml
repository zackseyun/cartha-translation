id: HEB.9.19
reference: Hebrews 9:19
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: λαληθείσης γὰρ πάσης ἐντολῆς κατὰ ⸀τὸν νόμον ὑπὸ Μωϋσέως παντὶ τῷ λαῷ, λαβὼν τὸ αἷμα τῶν ⸀μόσχων μετὰ ὕδατος καὶ ἐρίου κοκκίνου καὶ ὑσσώπου αὐτό τε τὸ βιβλίον καὶ πάντα τὸν λαὸν ἐράντισεν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/019.yaml
  text: For when every commandment according to the law had been spoken by Moses to all the people[a], he took the blood of the calves with water and scarlet wool and hyssop, and sprinkled both the scroll itself and all the people,
translation:
  language: ig
  text: N’ihi na, mgbe Mosis gwachara ndị mmadụ niile iwu nke ọ bụla dịka Iwu si dị, o were ọbara ụmụ ehi[a], ya na mmiri, ajị anụ na-acha uhie uhie, na hisọp, fesa ma akwụkwọ mpịakọta ahụ n’onwe ya ma ndị mmadụ niile.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ụmụ oke ehi.” Okwu Grik bụ μόσχων nwere ike ịpụta ụmụ ehi ma ọ bụ ụmụ oke ehi n’ihe gbasara àjà.
    reason: lexical_alternative
lexical_decisions:
- source_word: λαληθείσης γὰρ πάσης ἐντολῆς
  choice: N’ihi na mgbe Mosis gwachara ... iwu nke ọ bụla
  rationale: A sụgharịrị genitive absolute ahụ dị ka nkebiokwu oge. “Iwu nke ọ bụla” na-egosipụta ike nkesa nke πάσης ma mee ka okwu ahụ bụrụ Igbo nkịtị.
- source_word: κατὰ τὸν νόμον
  choice: dị ka Iwu ahụ si dị
  rationale: Nke a na-egosi na ihe Mosis kwuru kwekọrọ n’Iwu ahụ, n’ụzọ doro anya ma bụrụkwa Igbo a na-asụ ugbu a.
- source_word: παντὶ τῷ λαῷ / πάντα τὸν λαόν
  choice: ndị ahụ niile
  rationale: Nhọrọ a na-egosipụta mmadụ niile e kwuru okwu banyere ha ma ghara ịgbakwunye aha ndị a na-akpọghị n’asụsụ Grik.
- source_word: τὸ αἷμα τῶν μόσχων
  choice: ọbara ụmụ ehi[a]
  rationale: μόσχος nwere ike ịbụ nwa ehi n’ozuzu ya ma ọ bụ nwa oke ehi n’ọnọdụ àjà; isi ederede ji okwu sara mbara, ebe nkọwa ala peeji chekwara nhọrọ nke ọzọ.
- source_word: μετὰ ὕδατος καὶ ἐρίου κοκκίνου καὶ ὑσσώπου
  choice: tinyere mmiri, ajị anụ na-acha uhie uhie na hisọp
  rationale: “Tinyere” na-egosi njikọ nke ihe ndị e ji mee emume ahụ; “ajị anụ na-acha uhie uhie” bụ okwu Igbo doro anya maka ἐρίου κοκκίνου.
- source_word: αὐτό τε τὸ βιβλίον
  choice: ma akwụkwọ mpịakọta ahụ n’onwe ya
  rationale: “Akwụkwọ mpịakọta” dabara n’ụdị akwụkwọ oge ahụ, “n’onwe ya” na-echekwa nkwusi ike nke αὐτό, “ma ... ma ...” na-egosikwa njikọ τε ... καί.
- source_word: ἐράντισεν
  choice: fesa ... ọbara ahụ
  rationale: “Fesa” bụ ngwaa Igbo nkịtị maka ịtụsa mmiri ma ọ bụ ọbara n’obere ntụpọ n’emume; ikwughachi “ọbara ahụ” na ngwụcha na-eme ka ihe e fesara doo anya n’Igbo.
theological_decisions:
- issue: Mmekọrịta amaokwu a na akụkọ Ọpụpụ 24, karịchaa okwu μόσχων
  choice: Sụgharịa okwu Grik ahụ dịka o si dị, ghara ime ka ọ kwekọọ n’ụzọ amanyeghị ya na nkọwa Agba Ochie.
  alternative: Ịsụgharị ya naanị dị ka “ụmụ oke ehi” ma ọ bụ ịgbakwunye nkọwa banyere emume ahụ n’ime isi ederede.
  rationale: Nke a na-ahapụ nchịkọta akụkọ Hibru ka ọ guzo dịka onye dere ya si kwuo ya, ma chekwaa ihe μόσχων pụkwara ịpụta na nkọwa ala peeji.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ “Iwu ahụ” maka νόμος n’ọnọdụ a, “akwụkwọ mpịakọta” maka akwụkwọ ọgbụgba ndụ oge ochie, ma zere ịgbakwunye nkọwa emume nke na-adịghị n’amaokwu Grik.
