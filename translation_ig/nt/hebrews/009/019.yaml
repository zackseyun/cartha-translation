revisions:
- from: N’ihi na mgbe Mosis gwachara ndị ahụ niile iwu nke ọ bụla dị ka Iwu ahụ si dị, o were ọbara ụmụ ehi[a], tinyere mmiri, ajị anụ na-acha uhie uhie na hisọp, fesa ma akwụkwọ mpịakọta ahụ n’onwe ya ma ndị ahụ niile ọbara ahụ.
  to: N’ihi na, mgbe Mosis gwachara ndị mmadụ niile iwu nke ọ bụla dịka Iwu si dị, o were ọbara ụmụ ehi[a], ya na mmiri, ajị anụ na-acha uhie uhie, na hisọp, fesa ma akwụkwọ mpịakọta ahụ n’onwe ya ma ndị mmadụ niile.
  rationale: The revision preserves every source element and the τε ... καί coordination (‘ma ... ma ...’), while clarifying that Moses took the blood together with the listed materials and sprinkled the scroll itself and all the people. No explanatory material from Exodus 24 has been introduced.
