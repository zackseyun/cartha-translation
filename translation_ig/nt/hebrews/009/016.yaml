source:
  edition: SBLGNT
  text: ὅπου γὰρ διαθήκη, θάνατον ἀνάγκη φέρεσθαι τοῦ διαθεμένου·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/016.yaml
  text: For where there is a covenant[a], it is necessary for the death of the one who made it to be brought forward.
translation:
  language: ig
  text: N’ihi na n’ebe ọgbụgba ndụ[a] dị, a ghaghị igosi ọnwụ onye mere ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “N’ihi na n’ebe e nwere akwụkwọ nketa, a ghaghị igosi ọnwụ onye mere ya.” Okwu Grik bụ diathēkē nwere ike ịpụta “ọgbụgba ndụ” ma ọ bụ “akwụkwọ nketa” (will/testament); ọtụtụ ndị na-aghọta amaokwu 16–17 n’echiche iwu a.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅπου γὰρ
  choice: N’ihi na n’ebe
  rationale: “N’ihi na” na-egosipụta ọrụ nkọwa nke γάρ, ebe “n’ebe” na-edobe echiche ọnọdụ dị na ὅπου.
- source_word: διαθήκη
  choice: ọgbụgba ndụ
  rationale: Ọgbụgba ndụ bụ isiokwu gbara Hibru 8–10 gburugburu, karịchaa n’okwu banyere ọgbụgba ndụ ọhụrụ na ịchụ àjà e ji mee ka ọ malite. E debere echiche ọzọ, akwụkwọ ikike ikpeazụ, n’ala ala peeji.
- source_word: θάνατον
  choice: ọnwụ
  rationale: Nke a bụ ntụgharị kwụ ọtọ nke θάνατος, na-ezo aka n’ọnwụ n’ezie.
- source_word: ἀνάγκη
  choice: ọ dị mkpa
  rationale: Nke a na-ekwupụta mkpa a na-apụghị izere ezere n’Igbo dị mfe ma dị ùgwù.
- source_word: φέρεσθαι
  choice: ka e weta ... n’ihu
  rationale: Nkebiokwu a na-edobe ụdị nnabata nke ngwaa ahụ na echiche bụ isi nke ‘ịkpọta’ ma ọ bụ ‘iweta n’ihu,’ n’etinyeghị echiche siri ike karịa nke dị n’asụsụ Grik.
- source_word: τοῦ διαθεμένου
  choice: onye mere ya
  rationale: Nke a na-egosi onye mere ma ọ bụ guzobere διαθήκη n’ụzọ doro anya, ma ọ naghị amanye okwu iwu dịka ‘onye dere akwụkwọ ikike ikpeazụ’ n’ahịrị bụ isi.
theological_decisions:
- issue: Ma διαθήκη pụtara ‘ọgbụgba ndụ’ ka ọ bụ ‘akwụkwọ ikike ikpeazụ’ n’ebe a
  choice: E ji “ọgbụgba ndụ” mee ihe n’ahịrị bụ isi, ma tinye “akwụkwọ ikike ikpeazụ” n’ala ala peeji.
  alternative: akwụkwọ ikike ikpeazụ (will/testament)
  rationale: Ọgbụgba ndụ bụ isiokwu sara mbara nke Hibru 8–10, ma amaokwu 16–17 nwekwara ike iji okwu ahụ n’echiche iwu gbasara akwụkwọ ikike ikpeazụ. Idebe nke ọzọ n’ala ala peeji na-ahapụ esemokwu na nghọta abụọ ahụ ka ha dị.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe ma dị ùgwù mee ihe. “Ọgbụgba ndụ” bụ okwu Ndị Kraịst na ndị na-agụ Baịbụl maara nke ọma; nkọwa ala ala peeji na-eme ka nghọta iwu nke okwu Grik ahụ pụta ìhè n’enweghị ịmanye ya n’ahịrị bụ isi.
