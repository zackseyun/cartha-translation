review_pass:
  verdict: revise
  source_fidelity: The draft rightly preserves the explanatory γάρ, the conditional/locative force of ὅπου, and the debated covenant sense of διαθήκη in the main text. However, “ka e weta ọnwụ ... n’ihu” is not natural Standard Igbo and risks suggesting physical presentation of death. In this legal-evidentiary construction, “a ghaghị igosi ọnwụ...” appropriately conveys that the death must be presented/established, without over-specifying the disputed sense of φέρεσθαι.
  naturalness: “N’ihi na n’ebe ọgbụgba ndụ dị, a ghaghị igosi ọnwụ onye mere ya” is concise, idiomatic, and maintains an elevated biblical register. The footnote’s “akwụkwọ ikike ikpeazụ” is not a clear or customary term for a will in Standard Igbo; “akwụkwọ nketa” is clearer.
  terminology: “Ọgbụgba ndụ” is the established Igbo biblical term for covenant and should remain in the main text. “Akwụkwọ nketa” gives the legal alternative of will/testament without forcing that reading into the text. “Onye mere ya” properly retains the broad participial sense of τοῦ διαθεμένου.
  issues:
  - severity: medium
    issue: The main-text phrase “ka e weta ọnwụ onye mere ya n’ihu” is awkward and potentially misleading.
    rationale: Although literal imagery of bringing forward is possible for φέρεσθαι, Standard Igbo does not naturally use this expression with “ọnwụ” in this evidentiary/legal sense. “A ghaghị igosi ọnwụ...” is idiomatic and reflects the requirement that the death be established or adduced.
  - severity: medium
    issue: The footnote term “akwụkwọ ikike ikpeazụ” is not a clear Standard Igbo designation for a will/testament.
    rationale: It can be understood as a final authorization document rather than a testamentary will. “Akwụkwọ nketa” is a clearer legal expression and preserves the intended alternate reading.
  revised_text: N’ihi na n’ebe ọgbụgba ndụ[a] dị, a ghaghị igosi ọnwụ onye mere ya.
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “N’ihi na n’ebe e nwere akwụkwọ nketa, a ghaghị igosi ọnwụ onye mere ya.” Okwu Grik bụ diathēkē nwere ike ịpụta “ọgbụgba ndụ” ma ọ bụ “akwụkwọ nketa” (will/testament); ọtụtụ ndị na-aghọta amaokwu 16–17 n’echiche iwu a.
    reason: alternative_reading
  revision_rationale: The revision retains “ọgbụgba ndụ” in the main text, respecting the wider covenantal argument of Hebrews while leaving the well-supported testamentary reading explicit in the footnote. It replaces an unnatural literal rendering of φέρεσθαι with an idiomatic Igbo legal-evidentiary expression and corrects the alternative legal term for clarity.
