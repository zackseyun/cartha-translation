revisions:
- from: N’ihi na n’ebe e nwere ọgbụgba ndụ[a], ọ dị mkpa ka e weta ọnwụ onye mere ya n’ihu.
  to: N’ihi na n’ebe ọgbụgba ndụ[a] dị, a ghaghị igosi ọnwụ onye mere ya.
  rationale: The revision retains “ọgbụgba ndụ” in the main text, respecting the wider covenantal argument of Hebrews while leaving the well-supported testamentary reading explicit in the footnote. It replaces an unnatural literal rendering of φέρεσθαι with an idiomatic Igbo legal-evidentiary expression and corrects the alternative legal term for clarity.
  reviewer_model: gpt-5.6-terra
