  text: ὑπεράνω δὲ αὐτῆς Χερουβὶν δόξης κατασκιάζοντα τὸ ἱλαστήριον· περὶ ὧν οὐκ ἔστιν νῦν λέγειν κατὰ μέρος.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/005.yaml
  text: And above it were the cherubim of glory overshadowing the atoning sacrifice[a]; about these things it is not now possible to speak in detail.
translation:
  language: ig
  text: N’elu ya dị ndị cherubim nke ebube, ndị na-ekpuchi oche ebere ahụ. Ọ bụghị ugbu a ka a pụrụ ikwu okwu n’otu n’otu banyere ihe ndị a.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπεράνω δὲ αὐτῆς
  choice: N’elu ya kwa
  rationale: Ọ na-egosi ọnọdụ ndị cherub n’elu igbe ọgbụgba ndụ a kpọtụrụ aha n’amaokwu bu ụzọ, ma hapụ onye nnọchiaha ahụ dịka Grik si mee.
- source_word: Χερουβὶν δόξης
  choice: ndị cherub nke ebube
  rationale: ‘Ndị cherub’ bụ ntụgharị aha ndị mmụọ a maara n’Akwụkwọ Nsọ; ‘nke ebube’ na-edobe njikọ genitive dị mkpirikpi nke Grik n’emeghị ka a kọwaa ya karịa ihe odide ahụ.
- source_word: κατασκιάζοντα
  choice: ndị na-ekpuchi ... n’okpuru onyinyo ha
  rationale: Nke a na-egosipụta echiche nke ikpuchi ma ọ bụ ịtụ onyinyo n’elu ihe, n’asụsụ Igbo doro anya ma dị ndụ.
- source_word: τὸ ἱλαστήριον
  choice: ebe mkpuchi mmehie ahụ
  rationale: N’ọnọdụ a okwu ahụ na-ezo aka kpọmkwem ná mkpuchi igbe ọgbụgba ndụ, ebe emume mkpuchi mmehie metụtara. Nhọrọ a na-ejikọta ihe ahụ a na-ahụ anya na ọrụ ya n’emume ahụ, ebe nkọwa ala peeji na-edobe ‘oche ebere’ na echiche nke ihe ịchụ aja na-ekpuchi mmehie.
- source_word: περὶ ὧν
  choice: ihe ndị a
  rationale: Ọ na-ezo aka n’ihe ndị dị n’ebe nsọ a ka kpọtụrụ aha, n’ụzọ Igbo dị mfe ma kwekọọ na Grik.
- source_word: οὐκ ἔστιν νῦν λέγειν κατὰ μέρος
  choice: Ma ugbu a, ọ gaghị ekwe omume ịkọwa ihe ndị a n’otu n’otu
  rationale: Ọ na-edobe echiche nke na ọ bụghị ihe a ga-eme ugbu a, yana κατὰ μέρος nke pụtara ịkọwa ihe n’otu n’otu ma ọ bụ n’uju.
theological_decisions:
- issue: Ihe ἱλαστήριον pụtara n’ebe a na-ekwu banyere ụlọikwuu ahụ
  choice: ebe mkpuchi mmehie ahụ
  alternative: oche ebere; ihe ịchụ aja na-ekpuchi mmehie
  rationale: N’amaokwu a, ἱλαστήριον bụ mkpuchi igbe ọgbụgba ndụ ahụ n’ezie, ma okwu ahụ nwekwara njikọ na mkpuchi mmehie. Isi odide ahụ na-edobe ihe a na-ahụ anya na ọrụ emume ya ọnụ; nkọwa ala peeji na-egosi ụzọ ndị ọzọ e si akọwa okwu ahụ n’ebughị ụzọ dozie esemokwu ahụ n’otu akụkụ.
translation_notes:
  register: Ejiri asụsụ Igbo ọkọlọtọ, nke dị ugwu ma doo ndị mmadụ taa anya. A hapụrụ ‘cherub’ dịka aha Akwụkwọ Nsọ a maara, tinye ‘ndị’ iji gosi ọtụtụ. A zere itinye ‘nku’ n’isi odide n’ihi na, ọ bụ ezie na ihe gbara ya gburugburu na-egosi ya, okwu ahụ adịghị kpọmkwem na Grik nke amaokwu a.
