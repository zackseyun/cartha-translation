revisions:
- from: N’elu ya kwa, e nwere ndị cherub nke ebube, ndị na-ekpuchi ebe mkpuchi mmehie ahụ n’okpuru onyinyo ha[a]. Ma ugbu a, ọ gaghị ekwe omume ịkọwa ihe ndị a n’otu n’otu.
  to: N’elu ya dị ndị cherubim nke ebube, ndị na-ekpuchi oche ebere ahụ. Ọ bụghị ugbu a ka a pụrụ ikwu okwu n’otu n’otu banyere ihe ndị a.
  rationale: E mezigharịrị ἱλαστήριον ka ọ bụrụ “oche ebere” n’ihi na n’amaokwu a ọ bụ mkpuchi igbe ọgbụgba ndụ a na-ekwu maka ya. Nke a na-agbaso ọnọdụ Grik na akụkọ ụlọikwuu nsọ karịa “ebe mkpuchi mmehie,” ebe nkọwa ala peeji na-edobe ụzọ ntụgharị ndị ọzọ. A mekwara usoro ahịrịokwu ahụ ka ọ bụrụ Igbo ọkọlọtọ nke na-ada nke ọma, na-enweghị itinye nkọwa ndị na-adịghị n’amaokwu ahụ.
