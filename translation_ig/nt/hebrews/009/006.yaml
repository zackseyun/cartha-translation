  text: Τούτων δὲ οὕτως κατεσκευασμένων, εἰς μὲν τὴν πρώτην σκηνὴν διὰ παντὸς εἰσίασιν οἱ ἱερεῖς τὰς λατρείας ἐπιτελοῦντες,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/006.yaml
  text: With these things prepared in this way[a], the priests continually enter the first tabernacle, performing the services[b],
translation:
  language: ig
  text: Mgbe a kwadebere ihe ndị a otu a, ndị nchụàjà na-abanye mgbe niile n’ụlọikwuu nke mbụ[a], na-arụ ọrụ ofufe[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ụlọ ntu nke mbụ” ma ọ bụ “akụkụ mbụ.” Okwu Grik σκηνή pụrụ ịpụta ụlọikwuu ahụ n’onwe ya ma ọ bụ, n’ebe a, akụkụ mbụ ya.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “na-eme emume ofufe” ma ọ bụ, “na-arụ ọrụ nsọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τούτων δὲ οὕτως κατεσκευασμένων
  choice: Mgbe e doziri ihe ndị a otu a
  rationale: Nkebi a na-egosi ọnọdụ ihe dị tupu ihe na-esote emewe. “Doziri” dabara n’ihe ndị dị n’ụlọikwuu a kọwara n’amaokwu ndị bu ụzọ, n’enweghị ịkọwapụta ya dịka iwu ụlọ naanị.
- source_word: εἰς μὲν τὴν πρώτην σκηνὴν
  choice: n’ụlọikwuu nke mbụ
  rationale: “Ụlọikwuu” na-echekwa njikọ ya na ebe nsọ Mozis; “nke mbụ” na-ezo aka na akụkụ mbụ ya, ọ bụ ezie na okwu Grik ahụ nwekwara ike ịpụta ụlọikwuu ahụ n’onwe ya.
- source_word: διὰ παντὸς
  choice: mgbe niile
  rationale: Nke a na-egosi omume a na-eme ugboro ugboro dịka usoro ọrụ, ọ bụghị na ndị nchụàjà nọ n’ime ya n’akwụsịghị akwụsị.
- source_word: εἰσίασιν
  choice: na-abanye
  rationale: Oge ngwaa dị ugbu a na-akọwa omume ndị nchụàjà na-eme dịka ọdịnala mgbe niile.
- source_word: οἱ ἱερεῖς
  choice: ndị nchụàjà
  rationale: Ọ na-ezo aka na ndị nchụàjà nkịtị, n’adịghị ka nnukwu onye nchụàjà a ga-ekwu maka ya n’amaokwu na-esote.
- source_word: τὰς λατρείας ἐπιτελοῦντες
  choice: na-arụ ọrụ ofufe ndị ahụ
  rationale: “Ọrụ ofufe” na-egosi ọrụ nsọ na emume ndị e nyere ha ka ha rụọ; “na-arụ” na-asụ Igbo n’ụzọ eke ma na-egosipụta ọrụ ahụ ha na-eme.
theological_decisions:
- issue: Ihe σκηνή pụtara n’okwu gbasara ebe nsọ
  choice: ụlọikwuu nke mbụ
  alternative: akụkụ mbụ nke ụlọikwuu ahụ; ọnụ ụlọ nke mbụ
  rationale: Nhọrọ a na-echekwa okwu pụrụ iche gbasara ụlọikwuu Mozis ma hapụkwa nghọta na ọ bụ akụkụ mbụ nke ebe nsọ ahụ; e debere nkọwa ọzọ n’ala ala peeji.
- issue: Ike okwu διὰ παντὸς n’ọrụ ndị nchụàjà
  choice: mgbe niile
  alternative: mgbe mgbe; mgbe niile dịka usoro si dị
  rationale: Ọ na-echekwa ọdịiche dị n’etiti ịbanye ndị nchụàjà na-abanye ugboro ugboro n’akụkụ mbụ na ịbanye nnukwu onye nchụàjà na-abanye naanị otu ugboro n’afọ n’akụkụ nke abụọ, n’enweghị echiche na ha nọ ebe ahụ n’akwụsịghị akwụsị.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke oge a ma dị ùgwù. E ji “ụlọikwuu” mee ka ọnọdụ ofufe nke Agba Ochie doo anya; e ji “ọrụ ofufe” zere ime ka okwu ahụ bụrụ naanị nzukọ ụka nke oge a. Akara ụkwụ [a] na [b] dị n’ahịrị isi.
