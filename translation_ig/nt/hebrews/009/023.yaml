id: HEB.9.23
reference: Hebrews 9:23
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἀνάγκη οὖν τὰ μὲν ὑποδείγματα τῶν ἐν τοῖς οὐρανοῖς τούτοις καθαρίζεσθαι, αὐτὰ δὲ τὰ ἐπουράνια κρείττοσι θυσίαις παρὰ ταύτας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/023.yaml
  text: Therefore it was necessary for the copies of the things in the heavens to be cleansed with these[c][b][a], but the heavenly things themselves with better sacrifices than these.
translation:
  language: ig
  text: Ya mere, ọ dị mkpa ka e jiri ihe ndị a mee ka ihe ndị bụ nnọchianya[a] nke ihe ndị dị n’eluigwe dị ọcha[b], ma ka e jiri àjà ndị ka ndị a mma[c] mee ka ihe ndị nke eluigwe n’onwe ha dị ọcha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị “oyiyi” ma ọ bụ “ụkpụrụ” n’ọnọdụ “nnọchianya.”
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsị “sachapụ.” Ngwaa Grik a bụ okwu a na-eji maka nsachapụ ma ọ bụ ime ka ihe dị ọcha n’emume okpukpe.
    reason: lexical_alternative
  - marker: c
    text: Grik kwuru “àjà ndị ka mma” n’ọtụtụ, ọ bụ ezie na ihe ndị gbara amaokwu a gburugburu n’Akwụkwọ Ndị Hibru lekwasịrị anya n’àjà Mesaịa nyere otu ugboro ruo mgbe ebighị ebi.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀνάγκη οὖν
  choice: Ya mere, ọ dị mkpa
  rationale: “Ya mere” na-egosi nkwubi okwu sitere n’ihe e kwuru tupu ya; “ọ dị mkpa” bụ ụzọ Igbo sitere n’okike si kwuo ahịrịokwu Grik a na-enweghị onye kpọmkwem na-eme ihe.
- source_word: ὑποδείγματα
  choice: ihe ndị bụ oyiyi
  rationale: Nke a na-egosi ihe ndị dị n’ụwa nke na-anọchi anya ihe ndị dị n’eluigwe, ma na-eme ka ọdịiche dị n’etiti ha na “ihe ndị dị n’eluigwe n’onwe ha” doo anya.
- source_word: τῶν ἐν τοῖς οὐρανοῖς
  choice: nke ihe ndị dị n’eluigwe
  rationale: Ntụgharị a na-edebe echiche nke ihe ndị nọ n’eluigwe, n’ejighị nkọwa ọzọ kpebie kpọmkwem ihe ha bụ.
- source_word: τούτοις
  choice: ihe ndị a
  rationale: E debere nnọchiaha ngosi ahụ n’enweghị ịgbakwụnye “àjà” n’ebe mbụ, dịka Grik si kwuo ya; ihe gbara amaokwu ahụ gburugburu na-enye ihe ọ na-ezo aka na ya.
- source_word: καθαρίζεσθαι
  choice: ka e ... sachapụ
  rationale: “Sachapụ” na-enye echiche nke ime ka ihe dị ọcha ma kwekọọ n’asụsụ emume àjà nke amaokwu ahụ.
- source_word: αὐτὰ δὲ τὰ ἐπουράνια
  choice: ma ... ihe ndị dị n’eluigwe n’onwe ha
  rationale: “N’onwe ha” na-edebe nkwusi ike nke αὐτά, ebe “ihe ndị dị n’eluigwe” na-ahapụ okwu ahụ n’obosara ya n’akọwaghị ya dịka naanị ebe nsọ.
- source_word: κρείττοσι θυσίαις
  choice: àjà ndị ka ... mma
  rationale: “Ka mma” na-egosipụta okwu ntụnyere bụ isi n’Akwụkwọ Ndị Hibru, ebe “àjà ndị” na-edebe ọtụtụ nke θυσίαις.
- source_word: παρὰ ταύτας
  choice: ka ndị a
  rationale: N’ahịrịokwu ntụnyere a, παρά pụtara “karịa/ka ... mma”; “ndị a” na-ezo aka n’àjà ndị e kwuru banyere ha.
theological_decisions:
- issue: Ihe “ihe ndị dị n’eluigwe” bụ na otú e si sachapụ ha
  choice: E debere okwu ahụ dịka “ihe ndị dị n’eluigwe n’onwe ha” ma kwuo na a ga-eji àjà ndị ka mma sachapụ ha.
  alternative: Ịkọwa ya dịka ebe nsọ dị n’eluigwe, ndị nke eluigwe, ma ọ bụ ịgbanwe okwu ahụ ka ọ ghara ikwu na a sachapụrụ ihe dị n’eluigwe.
  rationale: Grik na-etinye ihe ndị bụ oyiyi na ihe ndị dị n’eluigwe n’akụkụ ibe ha ma jiri asụsụ nsachapụ kwuo banyere ha abụọ. Ntụgharị ahụ na-ahapụ esemokwu nkà mmụta okpukpe a ka ọ dị, n’etinyeghị nkọwa pụrụ iche n’ime amaokwu ahụ.
- issue: Ọtụtụ “àjà” n’agbanyeghị na Akwụkwọ Ndị Hibru na-ekwusi ike n’àjà Mesaịa nyere otu ugboro
  choice: 'E debere ya n’ọtụtụ: “àjà ndị.”'
  alternative: Ịtụgharị ya n’otu dịka “àjà ka mma.”
  rationale: θυσίαις dị n’ọtụtụ na Grik. Idebe ọtụtụ ya na-asọpụrụ ihe ederede ahụ kwuru ma ghara ime ka amaokwu a kwekọọ n’ike n’ozizi e kwuru n’ebe ọzọ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Nhazi “ka e jiri ... sachapụ” na-eme ka ụzọ e si sachapụ ihe pụta ìhè n’ụzọ ebumpụta ụwa n’Igbo, ma e debere nkwusi ike, ọdịiche, na mgbagwoju anya nke Grik.
