id: HEB.9.8
reference: Hebrews 9:8
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τοῦτο δηλοῦντος τοῦ πνεύματος τοῦ ἁγίου, μήπω πεφανερῶσθαι τὴν τῶν ἁγίων ὁδὸν ἔτι τῆς πρώτης σκηνῆς ἐχούσης στάσιν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/008.yaml
  text: By this the Holy Spirit is indicating that the way into the holy places has not yet been revealed while the first tabernacle still has standing,
translation:
  language: ig
  text: 'Nke a ka Mmụọ Nsọ na-egosi: na egosibeghị ụzọ e si abanye n’ebe nsọ ndị ahụ[a], mgbe ụlọikwuu mbụ ahụ ka dị[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “ụzọ e si abanye n’ụlọ nsọ ahụ.” Okwu Grik ahụ nwere ike izo aka n’ebe nsọ niile; ụfọdụ na-aghọta ya kpọmkwem dị ka “ụzọ e si abanye n’Ebe Kachasị Nsọ.”
    reason: alternative_reading
  - marker: b
    text: A pụkwara ịsụ ya, “mgbe ụlọikwuu mbụ ahụ ka guzoro.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δηλοῦντος
  choice: na-egosi
  rationale: Ọ na-egosipụta ọrụ nkọwa na-aga n’ihu nke participle dị na genitive absolute, ma bụrụkwa okwu Igbo dị mfe ma kwụ ọtọ.
- source_word: πνεύματος τοῦ ἁγίου
  choice: Mmụọ Nsọ
  rationale: Nke a bụ aha a na-ejikarị eme ihe n’Igbo maka onye a na-ekwu banyere ya n’Agba Ọhụrụ.
- source_word: μήπω πεφανερῶσθαι
  choice: e mepebeghị
  rationale: Perfect passive infinitive na-egosi na e mebeghị ka ụzọ ahụ pụta ìhè ma ọ bụ meghee ruo n’oge ahụ; ‘e mepebeghị’ dabara nke ọma n’echiche nke ụzọ ịbanye, ma debe passive na ọnọdụ na-aga n’ihu.
- source_word: τὴν τῶν ἁγίων ὁδὸν
  choice: ụzọ e si abanye n’ebe nsọ ahụ
  rationale: Ọnọdụ okwu a bụ nke ụlọikwuu na ebe ofufe; ya mere ọ bụ ụzọ ịbanye n’ebe nsọ, ọ bụghị ‘ụzọ ndị nsọ.’ ‘Ebe nsọ’ na-ahapụ ohere nke plural Greek n’enweghị ikwubi na ọ bụ naanị Ebe Kachasị Nsọ.
- source_word: πρώτης σκηνῆς
  choice: ụlọikwuu nke mbụ
  rationale: ‘Ụlọikwuu’ na-echekwa ọnọdụ ofufe nke σκηνή, ebe ‘nke mbụ’ na-agbaso ọdịiche akụkụ abụọ e kwuru n’amaokwu ndị dị ya nso.
- source_word: ἐχούσης στάσιν
  choice: ka nwere ọnọdụ ya
  rationale: Nkebiokwu a nwere ike ịpụta ịdịgide adịgide ma ọ bụ ịnọgide na-enwe ọnọdụ/ọrụ. Nsụgharị a na-echekwa ọdịiche ahụ karịa nanị ịsị na ụlọikwuu ahụ ka guzoro n’ụzọ anụ ahụ.
- source_word: ἔτι
  choice: ka
  rationale: ‘Ka’ na-egosi na ọnọdụ ahụ nọgidere ruo oge a na-ekwu banyere ya.
theological_decisions:
- issue: Ihe τῶν ἁγίων na-ezo aka na ya
  choice: ebe nsọ nke ụlọikwuu a na-abanye na ya
  alternative: ụzọ ndị nsọ
  rationale: Ihe gbara amaokwu ahụ gburugburu bụ nhazi ụlọikwuu na ikike ndị nchụaja nwere ịbanye; ya mere okwu ahụ bụ banyere ebe ofufe, ọ bụghị ndị mmadụ dị nsọ.
- issue: Ma τῶν ἁγίων ọ bụ ebe nsọ niile ka ọ bụ Ebe Kachasị Nsọ kpọmkwem
  choice: ebe nsọ, n’ụzọ na-akọwaghị ya oke
  alternative: Ebe Kachasị Nsọ kpọmkwem
  rationale: Ọ bụ ezie na okwu gbara ya gburugburu nwere ike ime ka a chee karịsịa banyere ime ụlọ ahụ, plural Greek anaghị amanye nsụgharị ahụ ka ọ bụrụ naanị Ebe Kachasị Nsọ. Isi ederede na-echekwa nghọta sara mbara ahụ.
- issue: Ihe ἐχούσης στάσιν pụtara
  choice: ka nwere ọnọdụ ya
  alternative: ka guzoro
  rationale: Ọ nwere ike ịkọwa ma ịdị adị n’ụzọ anụ ahụ ma ọnọdụ ma ọ bụ ịdị irè nke usoro mbụ ahụ. A naghị ekpebi esemokwu ahụ n’isi ederede.
translation_notes:
  register: 'Ejiri Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. ‘Ụlọikwuu’ na ‘ebe nsọ’ na-edobe ọnọdụ ofufe nke amaokwu ahụ, ebe ‘ka nwere ọnọdụ ya’ na-echekwa ohere abụọ dị na Greek: ịnọgide n’ịdị adị na ịnọgide n’ọnọdụ ma ọ bụ n’ọrụ.'
