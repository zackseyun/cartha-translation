review_pass:
  verdict: revise
  source_fidelity: A chọrọ mmezi obere ma dị mkpa. πεφανερῶσθαι pụtara ‘ime ka a pụta ìhè/ikpughe,’ ọ bụghị kpọmkwem ‘imepe’; ya mere ‘e mepebeghị’ na-eme ka ihe oyiyi ụzọ dị n’Igbo sie ike karịa ihe Grik kwuru. τῶν ἁγίων bụ plural cultic, nke ‘ebe nsọ ndị ahụ’ na-echekwa nke ọma.
  naturalness: Usoro ‘Nke a ka Mmụọ Nsọ na-egosi’ na-adịkwu ire ụtọ n’Igbo karịa ‘Site na nke a, Mmụọ Nsọ na-egosi.’ ‘Ka dị’ bụ ụzọ dị mfe na nke eke iji sụgharị ἐχούσης στάσιν, ebe ndetu ala na-edobe nhọrọ ‘ka guzoro.’
  terminology: ‘Mmụọ Nsọ,’ ‘ụlọikwuu mbụ,’ na ‘ebe nsọ’ dabara na Standard Igbo na ndekọ nsọ. ‘E gosibeghị’ na-edobe passive na echiche mkpughe nke φανερόω n’emeghị mkpebi karịrị akarị banyere ụdị nnweta a na-ekwu.
  issues:
  - severity: medium
    issue: ‘e mepebeghị’ maka πεφανερῶσθαι
    rationale: Okwu Grik a sitere na φανερόω, ‘ime ka a hụ/ikpughe,’ ọ bụghị ἀνοίγω, ‘imepe.’ Ọ bụ ezie na ‘imepe ụzọ’ bụ okwu Igbo a na-ahụkarị, ebe a ọ na-atụgharị okwu mkpughe gaa n’okwu mmeghe.
  - severity: low
    issue: ‘ebe nsọ ahụ’ anaghị egosi plural τῶν ἁγίων nke ọma
    rationale: N’agbanyeghị na ‘ebe nsọ’ pụrụ ịdị ka aha mkpokọta n’Igbo, ‘ebe nsọ ndị ahụ’ na-echekwa plural cultic nke Grik nke ọma, na-enweghị ịkọwa ya dịka naanị Ebe Kachasị Nsọ.
  - severity: low
    issue: ‘ka nwere ọnọdụ ya’ na-ada ntakịrị ka ntụgharị okwu n’Igbo
    rationale: ‘Ka dị’ na-ekwu nke a n’ụzọ Igbo dịkwuo eke, ebe o ka na-ahapụ ohere maka ịdị adị ma ọ bụ ‘standing’; ndetu ala na-enye nhọrọ anụ ahụ ‘ka guzoro.’
