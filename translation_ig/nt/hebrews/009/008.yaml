- from: Site na nke a, Mmụọ Nsọ na-egosi na e mepebeghị ụzọ e si abanye n’ebe nsọ ahụ[a], mgbe ụlọikwuu nke mbụ ka nwere ọnọdụ ya[b].
  to: 'Nke a ka Mmụọ Nsọ na-egosi: na egosibeghị ụzọ e si abanye n’ebe nsọ ndị ahụ[a], mgbe ụlọikwuu mbụ ahụ ka dị[b].'
  rationale: E megharịrị ‘e mepebeghị’ ka ọ bụrụ ‘egosibeghị’ iji soro πεφανερῶσθαι—‘ka e mee ka ọ pụta ìhè’—n’ụzọ ziri ezi. E gbanwerekwa usoro mmalite ka ọ bụrụ Igbo eke, mee ‘ebe nsọ’ plural n’isi ederede, ma jiri ‘ka dị’ dochie okwu calque ‘ka nwere ọnọdụ ya.’ Akara ndetu ala a na b nọgidere kpọmkwem n’ebe okwu ha na-akọwa dị.
