  text: ὅθεν οὐδὲ ἡ πρώτη χωρὶς αἵματος ἐγκεκαίνισται·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/018.yaml
  text: Therefore not even the first covenant was inaugurated without blood[a].
translation:
  language: ig
  text: N’ihi ya, ọbụna ọgbụgba ndụ mbụ amaliteghị ịdị irè n’enweghị ọbara[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “nke mbụ”; ya bụ, ọgbụgba ndụ mbụ. Ụfọdụ nsụgharị na-akpọ aha e chere n’echiche ebe a “testamenti.”
    reason: alternative_reading
lexical_decisions:
- source_word: ὅθεν
  choice: N’ihi ya
  rationale: Na-egosi nkwubi okwu sitere n’arụmụka gara aga; okwu a bụ nke a na-aghọta nke ọma n’Igbo ugbu a.
- source_word: οὐδὲ
  choice: ọbụna ... abanyeghị
  rationale: Na-echekwa nkwusi ike nke ‘ọbụna ... adịghị,’ na-egosi na ụkpụrụ ahụ metụtakwara ọgbụgba ndụ nke mbụ.
- source_word: ἡ πρώτη
  choice: ọgbụgba ndụ nke mbụ
  rationale: Ọ bụ adjective e ji dochie aha n’asụsụ Grik; ihe gbara ya gburugburu na-ezo aka n’ọgbụgba ndụ nke mbụ. Ịtinye ‘ọgbụgba ndụ’ na-eme ka Igbo doo anya n’enweghị ịgbakwụnye echiche ọhụrụ.
- source_word: χωρὶς αἵματος
  choice: n’enweghị ọbara
  rationale: Nsụgharị kwụ ọtọ ma bụrụkwa Igbo eke, nke na-echekwa njikọ ya na ịchụ àjà na ọgbụgba ndụ.
- source_word: ἐγκεκαίνισται
  choice: abanyeghị n’ọrụ
  rationale: Na-egosipụta ibido ma ọ bụ ime ka ọgbụgba ndụ malite ịrụ ọrụ. Ọ na-ezere ime ka okwu ahụ bụrụ naanị ‘ịkwado n’iwu,’ ebe perfect passive Grik na-elekwasị anya n’omume e mezuru nke nwere mmetụta na-adịgide.
theological_decisions:
- issue: Ihe ‘nke mbụ’ na-ezo aka na ya
  choice: ọgbụgba ndụ nke mbụ
  alternative: ‘nke mbụ’ naanị ya, ma ọ bụ ‘ọgbụgba ndụ e dere n’akwụkwọ nke mbụ’
  rationale: Ihe gbara amaokwu ahụ gburugburu, tinyere ntụaka dị na Ọpụpụ 24 banyere ọbara, na-akwado na ọ bụ ọgbụgba ndụ nke mbụ ka a na-ekwu. Ihe odide Grik hapụrụ aha ahụ n’ime echiche, ya mere e debere nkọwa ọzọ n’ala peeji iji chekwaa ọdịdị ahụ na nghọtahie nwere ike ịdị.
translation_notes:
  register: Igbo Standard dị ugbu a, dị ugwu ma dị mfe nghọta. ‘Abanye n’ọrụ’ bụ okwu eke nke na-egosipụta mmalite dị irè nke ọgbụgba ndụ, ebe ndetu ala peeji na-echekwa na Grik ekwughị aha ‘ọgbụgba ndụ’ ọzọ n’amaokwu a.
