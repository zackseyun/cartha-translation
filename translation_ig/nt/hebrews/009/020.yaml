    text: 'Ma ọ bụ: “Nke a bụ ọbara ọgbụgba ndụ ahụ Chineke nyere iwu nye unu.”'
    reason: lexical_alternative
  revision_rationale: The revision removes the interpretive addition “banyere ya” and renders the relationship of the covenant, God’s command, and the audience more directly. The alternative footnote retains a transparent possible ordering for the final phrase without altering meaning.
