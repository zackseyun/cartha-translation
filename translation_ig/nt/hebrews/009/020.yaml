  text: saying[a], “This is the blood of the covenant that God commanded for you.”
translation:
  language: ig
  text: na-asị[a], “Nke a bụ ọbara ọgbụgba ndụ ahụ Chineke nyere unu iwu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ: “Nke a bụ ọbara ọgbụgba ndụ ahụ Chineke nyere iwu nye unu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγων
  choice: na-asị
  rationale: Ọ bụ participle nke oge ugbu a nke na-ewebata okwu e hotara ma na-ejikọta ya na ahịrịokwu bu ya ụzọ; “na-asị” na-echekwa njikọ ahụ n’Igbo.
- source_word: Τοῦτο
  choice: Nke a bụ
  rationale: N’asụsụ Grik, e kwughị ngwaa njikọ n’ụzọ doro anya, ma “bụ” dị mkpa ka ahịrịokwu Igbo bụrụ nke e ji eme ihe n’ụzọ ebumpụta ụwa, n’enweghị itinye nkọwa ọhụrụ.
- source_word: αἷμα
  choice: ọbara
  rationale: Nke a bụ okwu kwekọrọ kpọmkwem, ma na-echekwa ihe oyiyi nke ọbara àjà e ji mee ka ọgbụgba ndụ malite.
- source_word: διαθήκης
  choice: ọgbụgba ndụ
  rationale: N’ebe a, okwu ahụ na-ezo aka n’ọgbụgba ndụ Mosis nke Ọpụpụ 24, ọ bụghị akwụkwọ nketa.
- source_word: ἧς
  choice: ahụ ... banyere ya
  rationale: Relative pronoun genitive a na-alaghachi n’ọgbụgba ndụ. Nhazi “ahụ ... banyere ya” na-eme ka njikọ ahụ doo anya n’Igbo ma na-echekwa nghọta nke ihe iwu ahụ metụtara.
- source_word: ἐνετείλατο
  choice: nyere ... iwu
  rationale: ἐντέλλομαι pụtara inye iwu ma ọ bụ ntụziaka; “nyere iwu” bụ okwu Igbo doro anya ma dị mfe nghọta.
- source_word: πρὸς ὑμᾶς
  choice: unu ... banyere ya
  rationale: πρός na accusative nwere ike ịpụta “nye unu” ma ọ bụ ihe gbasara unu. Nhazi a na-egosi na Chineke nyere ndị ahụ iwu metụtara ọgbụgba ndụ ahụ, n’enweghị ime ka ọ bụrụ naanị uru e mere maka ha.
- source_word: ὁ θεός
  choice: Chineke
  rationale: Nke a bụ ntụgharị Igbo a na-ejikarị eme ihe maka θεός.
theological_decisions:
- issue: Ntụgharị διαθήκη n’ọnọdụ e ji ọbara mee ka mmekọrịta ahụ guzosie ike
  choice: ọgbụgba ndụ
  alternative: ọgbụgba ndụ nketa
  rationale: Amaokwu a na-akpọghachi uche n’Ọpụpụ 24:8 na ọgbụgba ndụ Mosis. “Ọgbụgba ndụ” dabara n’ọnọdụ ahụ ma zere ibubata echiche akwụkwọ nketa.
- issue: Itinye ngwaa njikọ a na-ekwughị kpọmkwem mgbe Τοῦτο gasịrị
  choice: Nke a bụ ọbara
  alternative: Nke a, ọbara
  rationale: “Bụ” na-eme ka okwu ahụ bụrụ Igbo zuru oke ma doo anya; ọ na-ekwupụta predication dị n’asụsụ Grik n’enweghị ịgbakwunye ozizi.
- issue: Uzo e si ghọta πρὸς ὑμᾶς
  choice: nyere unu iwu banyere ya
  alternative: nyere unu iwu maka ya
  rationale: Nhọrọ a na-echekwa na iwu ahụ bụ nke e nyere ndị mmadụ ma metụta ọgbụgba ndụ ahụ, kama idozi n’ụzọ siri ike ma ọ bụ uru maka ha ka a na-ekwu ma ọ bụ naanị ntụziaka e zigara ha.
translation_notes:
  register: Standard Igbo dị ugbu a, kwanyere ugwu ma dị mfe nghọta. E ji “ọgbụgba ndụ” mee ihe dịka okwu Baịbụl amaara nke na-anọchi anya covenant; e chekwara participle “na-asị” ka njikọ ya na amaokwu bu ụzọ ghara ịla n’iyi.
