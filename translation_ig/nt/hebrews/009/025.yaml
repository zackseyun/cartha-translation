revisions:
- from: Ọ bụghịkwa ka o wee chụọ onwe ya n’àjà ọtụtụ ugboro, dị ka nnukwu onye nchụàjà si abanye n’ebe ndị dị nsọ[a] kwa afọ, jiri ọbara na-abụghị nke ya.
  to: Ọ bụghịkwa ka o wee chụọ onwe ya n’àjà ọtụtụ ugboro, dị ka onyeisi nchụàjà si abanye n’ebe nsọ[a] kwa afọ, jiri ọbara na-abụghị nke ya.
  rationale: The revision replaces two literal but less idiomatic expressions with established Standard Igbo cultic terminology. It does not narrow the referent of τὰ ἅγια in the text itself; the footnote records both the Greek plural and the possible narrower interpretation. All other wording faithfully represents the Greek contrast and is retained.
