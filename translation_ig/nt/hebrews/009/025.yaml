review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the negated purpose, Christ's self-offering, its non-repetition, the high priest's annual entry, and the contrast that the blood belongs to someone else. However, “ebe ndị dị nsọ” reads as a set of unspecified holy locations rather than the established cultic designation for τὰ ἅγια.
  naturalness: “Nnukwu onye nchụàjà” is understandable but is less idiomatic and less precise for the Jewish cultic office than the standard term “onyeisi nchụàjà.” “Ebe nsọ” is the natural Igbo cultic expression; the footnote can retain the fact that the Greek expression is plural and its possible narrower reference.
  terminology: Use “onyeisi nchụàjà” for ἀρχιερεύς. Retain “chụọ onwe ya n’àjà” for προσφέρῃ ἑαυτόν and “ọbara na-abụghị nke ya” for ἐν αἵματι ἀλλοτρίῳ. Render τὰ ἅγια as “ebe nsọ,” with a footnote giving “ebe nsọ dị iche iche” as a formally plural alternative and noting the possible reference to the Most Holy Place.
  issues:
  - severity: medium
    issue: “Nnukwu onye nchụàjà” for ὁ ἀρχιερεύς
    rationale: Although comprehensible, it can mean simply a great or important priest. “Onyeisi nchụàjà” is the conventional, unambiguous Standard Igbo designation for the high priest.
  - severity: medium
    issue: “n’ebe ndị dị nsọ” for εἰς τὰ ἅγια
    rationale: This is overly literal and unnatural in Igbo, suggesting several places that happen to be holy. “N’ebe nsọ” is the normal cultic expression. The Greek plural and the narrower interpretive possibility can be preserved in a footnote.
  revised_text: Ọ bụghịkwa ka o wee chụọ onwe ya n’àjà ọtụtụ ugboro, dị ka onyeisi nchụàjà si abanye n’ebe nsọ[a] kwa afọ, jiri ọbara na-abụghị nke ya.
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “ebe nsọ dị iche iche.” N’asụsụ Grik, okwu a dị n’ụdị ọtụtụ; ụfọdụ na-aghọta ya kpọmkwem dị ka “Ebe Kachasị Nsọ” n’ọnọdụ ofufe a.
    reason: lexical_alternative
