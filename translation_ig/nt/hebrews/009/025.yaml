  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οὐδ’ ἵνα πολλάκις προσφέρῃ ἑαυτόν, ὥσπερ ὁ ἀρχιερεὺς εἰσέρχεται εἰς τὰ ἅγια κατ’ ἐνιαυτὸν ἐν αἵματι ἀλλοτρίῳ,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/025.yaml
  text: Nor was it so that he might offer himself many times[a], just as the high priest enters the holy places year by year with blood not his own,
translation:
  language: ig
  text: Ọ bụghịkwa ka o wee chụọ onwe ya n’àjà ọtụtụ ugboro, dị ka onyeisi nchụàjà si abanye n’ebe nsọ[a] kwa afọ, jiri ọbara na-abụghị nke ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ebe nsọ dị iche iche.” N’asụsụ Grik, okwu a dị n’ụdị ọtụtụ; ụfọdụ na-aghọta ya kpọmkwem dị ka “Ebe Kachasị Nsọ” n’ọnọdụ ofufe a.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδ’ ἵνα
  choice: Ọ bụghịkwa ka o wee
  rationale: Nke a na-aga n’ihu n’echiche agọnahụrụ nke amaokwu bu ya ụzọ ma na-egosi na ebumnuche Kraịst abụghị ịchụ onwe ya n’àjà ugboro ugboro.
- source_word: πολλάκις
  choice: ọtụtụ ugboro
  rationale: Ọ na-egosipụta ugboro ole na ole a na-eme ihe ma doo ọdịiche dị n’etiti nke ahụ na omume a na-eme kwa afọ anya.
- source_word: προσφέρῃ ἑαυτόν
  choice: chụọ onwe ya n’àjà
  rationale: Nke a na-echekwa echiche ịchụ àjà dị na προσφέρω nakwa nkwughachi onwe dị na ἑαυτόν; ‘ka o wee’ na-egosipụta subjunctive dị n’okpuru ἵνα.
- source_word: ὥσπερ
  choice: dị ka
  rationale: Ọ na-egosi ntụnyere dị n’etiti Kraịst na nnukwu onye nchụàjà n’ụzọ Igbo na-ada nke ọma.
- source_word: ὁ ἀρχιερεὺς
  choice: nnukwu onye nchụàjà
  rationale: Nke a bụ okwu Igbo doro anya maka ọkwa onyeisi nchụàjà ndị Juu.
- source_word: εἰσέρχεται
  choice: si abanye
  rationale: E debere echiche nke omume a na-emekarị, nke present tense Grik na-egosi n’ebe a.
- source_word: εἰς τὰ ἅγια
  choice: n’ebe ndị dị nsọ
  rationale: Nke a na-echekwa ụdị ọtụtụ dị n’okwu Grik ma ghara ikpebi n’ime ederede ma ọ bụ ebe nsọ n’ozuzu ya ma ọ bụ Ebe Kachasị Nsọ.
- source_word: κατ’ ἐνιαυτὸν
  choice: kwa afọ
  rationale: Ọ bụ ụzọ Igbo dị mfe ma bụrụkwa nke ebumpụta ụwa isi gosi omume a na-eme afọ ọ bụla.
- source_word: ἐν αἵματι ἀλλοτρίῳ
  choice: jiri ọbara na-abụghị nke ya
  rationale: ‘Jiri’ na-egosipụta ụzọ e si eme ihe, ebe ‘na-abụghị nke ya’ na-eme ka ọdịiche dị n’etiti ọbara onye ọzọ na Kraịst ịchụ onwe ya pụta ìhè.
theological_decisions:
- issue: Ihe ntụnyere dị n’etiti Kraịst na nnukwu onye nchụàjà nke usoro Livaị na-ezo aka na ya
  choice: Amaokwu ahụ na-egosi ọdịiche dị n’etiti ịchụ onwe Kraịst n’àjà, nke a na-adịghị eme ọtụtụ ugboro, na nnukwu onye nchụàjà nke na-abanye kwa afọ jiri ọbara na-abụghị nke ya.
  alternative: A pụrụ ịghọta ‘ebe ndị dị nsọ’ n’ụzọ kpọmkwem karị dị ka ime ebe nsọ, ya bụ Ebe Kachasị Nsọ.
  rationale: Ihe gbara amaokwu ahụ gburugburu na Ndị Hibru 9 na-emesi àjà Mesaịa nke a na-adịghị eme ugboro ugboro ike, megide ozi nchụàjà nke ọgbụgba ndụ ochie a na-emegharị emegharị. Nsụgharị ahụ anaghị etinye nkọwa ozizi e mechara wulite n’ime amaokwu ahụ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta mee ihe. ‘Chụọ onwe ya n’àjà’ na-eme ka ọnọdụ ịchụ àjà doo anya; ‘ebe ndị dị nsọ’ na-echekwa ọtụtụ dị na Grik na enweghị mkpebi zuru ezu banyere ókè ebe ahụ.
