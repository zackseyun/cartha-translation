  to: nke nwere efere ọlaedo e ji esure ihe nsure ọkụ na-esi ísì ụtọ[a], ya na igbe ọgbụgba ndụ ahụ nke e ji ọlaedo machie n’akụkụ niile. N’ime igbe ahụ ka ite ọlaedo nwere manna dị, ya na mkpara Erọn nke puru ome, na mbadamba ọgbụgba ndụ ahụ,
