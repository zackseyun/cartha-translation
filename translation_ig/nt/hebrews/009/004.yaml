id: HEB.9.4
reference: Hebrews 9:4
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: χρυσοῦν ἔχουσα θυμιατήριον καὶ τὴν κιβωτὸν τῆς διαθήκης περικεκαλυμμένην πάντοθεν χρυσίῳ, ἐν ᾗ στάμνος χρυσῆ ἔχουσα τὸ μάννα καὶ ἡ ῥάβδος Ἀαρὼν ἡ βλαστήσασα καὶ αἱ πλάκες τῆς διαθήκης,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/004.yaml
  text: having the golden censer[a], and the ark of the covenant covered on all sides with gold, in which were a golden jar holding the manna, Aaron’s staff that budded, and the tablets of the covenant,
translation:
  language: ig
  text: nke nwere efere ọlaedo e ji esure ihe nsure ọkụ na-esi ísì ụtọ[a], ya na igbe ọgbụgba ndụ ahụ nke e ji ọlaedo machie n’akụkụ niile. N’ime igbe ahụ ka ite ọlaedo nwere manna dị, ya na mkpara Erọn nke puru ome, na mbadamba ọgbụgba ndụ ahụ,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ebe ịchụàjà ọlaedo maka ihe nsure ọkụ na-esi ísì ụtọ.” Okwu Grik ahụ (θυμιατήριον) nwere ike ịpụta efere e ji esure ihe nsure ọkụ ma ọ bụ ebe ịchụàjà ihe nsure ọkụ; a ka na-arụrịta ụka banyere ihe ọ pụtara n’ebe a.
    reason: alternative_reading
lexical_decisions:
- source_word: χρυσοῦν ἔχουσα θυμιατήριον
  choice: nke nwere ebe ịchụàjà ọlaedo maka ihe nsure ọkụ na-esi ísì ụtọ
  rationale: θυμιατήριον nwere ike ịpụta ebe ịchụàjà a na-esure ihe nsure ọkụ ma ọ bụ ihe e ji esure ya. Nkọwa banyere ụlọikwuu ahụ na-akwado ‘ebe ịchụàjà,’ ebe ntụaka ala peeji na-echekwa nghọta ọzọ.
- source_word: τὴν κιβωτὸν τῆς διαθήκης
  choice: igbe ọgbụgba ndụ ahụ
  rationale: ‘Igbe ọgbụgba ndụ’ bụ okwu Igbo doro anya maka igbe nsọ ahụ, ma na-edobe διαθήκη dị ka ‘ọgbụgba ndụ.’
- source_word: περικεκαλυμμένην πάντοθεν χρυσίῳ
  choice: nke e ji ọlaedo machie n’akụkụ niile
  rationale: Nke a na-egosipụta na ọlaedo kpuchiri igbe ahụ gburugburu, dịka πάντοθεν si mesie ike.
- source_word: στάμνος χρυσῆ ἔχουσα τὸ μάννα
  choice: ite ọlaedo nke manna dị
  rationale: στάμνος bụ ite e ji edobe ihe; nhazi a bụ Igbo nkịtị ma na-egosi na manna dị n’ime ite ahụ.
- source_word: ἡ ῥάβδος Ἀαρὼν ἡ βλαστήσασα
  choice: mkpara Erọn nke puru ome
  rationale: ‘Mkpara’ dabara na ῥάβδος, ‘puru ome’ na-egosikwa ihe βλαστήσασα kwuru banyere ihe mere n’oge gara aga.
- source_word: αἱ πλάκες τῆς διαθήκης
  choice: mbadamba ọgbụgba ndụ ahụ
  rationale: A hapụrụ ‘nkume’ n’ihi na ọ bụ ezie na akụkọ ahụ na-egosi ya, okwu ahụ apụtaghị kpọmkwem n’amaokwu a.
theological_decisions:
- issue: Ihe θυμιατήριον pụtara n’ihe ndị metụtara Ebe Kachasị Nsọ
  choice: ebe ịchụàjà ọlaedo maka ihe nsure ọkụ na-esi ísì ụtọ
  alternative: ihe ọlaedo e ji esure ihe nsure ọkụ na-esi ísì ụtọ
  rationale: Okwu Grik ahụ nwere ike izo aka n’ebe ịchụàjà ma ọ bụ n’ihe a na-ebu e ji esure ihe nsure ọkụ. A họọrọ ebe ịchụàjà n’ahịrịokwu bụ isi dịka ihe dabara n’usoro nkọwa ụlọikwuu, ma e debere nghọta nke ọzọ na ntụaka ala peeji ka a ghara idozi arụmụka ahụ n’amaghị ama.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. A họọrọ ‘ihe nsure ọkụ na-esi ísì ụtọ’ iji mee ka ọrụ ihe ahụ doo onye na-agụ nkịtị anya; ‘ọgbụgba ndụ’ na-echekwa okwu bụ isi n’usoro echiche amaokwu ahụ.
