source:
  edition: SBLGNT
  text: Εἶχε μὲν ⸀οὖν ἡ πρώτη δικαιώματα λατρείας τό τε ἅγιον κοσμικόν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/001.yaml
  text: Even the first covenant had regulations for worship and an earthly sanctuary[a][b].
translation:
  language: ig
  text: Ọbụna ọgbụgba ndụ mbụ ahụ nwere iwu maka ofufe na ebe nsọ dị n'ụwa[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “nke mbụ”—ya bụ, ọgbụgba ndụ mbụ; ụfọdụ na-aghọta ya n'ozuzu dịka “usoro mbụ.”
    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ, “ebe nsọ nke ụwa”; n'ebe a, o yikarịrị ka ihe ọ pụtara bụ “nke dị n'ụwa,” n'adịghị ka ihe ndị dị n'eluigwe a na-atụle ma e mesịa n'isiakwụkwọ a.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἶχε
  choice: nwere
  rationale: Oge imperfect nke ἔχω na-egosi ihe usoro mbụ ahụ nwere; “nwere” bụ okwu Igbo doro anya ma kwekọọ n'echiche nke inwe.
- source_word: μὲν οὖν
  choice: Ọbụna
  rationale: N'ebe a njikọ ahụ na-aga n'ihu n'arụmụka ma na-etinye ntakịrị nkwusi ike; “Ọbụna” na-enye nkwusi ike ahụ n'Igbo nkịtị, ebe njikọ na ihe bu ụzọ pụtara site n'ọnọdụ okwu.
- source_word: ἡ πρώτη
  choice: ọgbụgba ndụ mbụ ahụ
  rationale: Aha a na-ahapụghị n'asụsụ Grik na-ezo aka n'ọgbụgba ndụ mbụ a kpọtụrụ aha na 8:13; itinye “ọgbụgba ndụ” na-eme ka Igbo doo anya n'etinyeghị ụlọikwuu tupu oge ya.
- source_word: δικαιώματα
  choice: ụkpụrụ
  rationale: N'ọnọdụ ofufe a, okwu ahụ pụtara iwu ma ọ bụ usoro a tụrụ maka ofufe; “ụkpụrụ” bụ okwu Igbo dị ugbu a ma dị mfe nghọta.
- source_word: λατρείας
  choice: maka ofufe
  rationale: Ọ na-akọwa ọrụ ma ọ bụ ebe ụkpụrụ ndị ahụ metụtara; “maka ofufe” na-egosipụta echiche ahụ n'Igbo eke.
- source_word: τό τε ἅγιον
  choice: ebe nsọ
  rationale: Nkebiokwu ahụ na-ezo aka n'ebe e doro nsọ nke usoro ofufe mbụ; “ebe nsọ” sara mbara nke ọma tupu amaokwu ndị na-esote akọwaa akụkụ ya.
- source_word: κοσμικόν
  choice: dị n'ụwa
  rationale: N'ebe a ọ na-emegide ihe ndị dị n'eluigwe a ga-atụle n'ihu, ọ bụghị ịdị njọ n'omume; “dị n'ụwa” na-egosi ọdịiche ahụ nke ọma.
theological_decisions:
- issue: Ihe ἡ πρώτη na-ezo aka na ya
  choice: ọgbụgba ndụ mbụ ahụ
  alternative: nke mbụ; usoro mbụ; ụlọikwuu mbụ
  rationale: Ihe kacha nso n'okwu ndị bu ụzọ bụ ọgbụgba ndụ mbụ (8:13). Nsụgharị a na-eme ka ellipsis ahụ doo anya ma ghara ibute echiche ụlọikwuu tupu onye dere akwụkwọ amalite ịkọwa ya.
- issue: Echiche κοσμικόν
  choice: dị n'ụwa
  alternative: nke ụwa
  rationale: Isi ọdịiche dị n'amaokwu a na n'akụkụ akwụkwọ a bụ n'etiti ebe nsọ dị n'ụwa na ihe ndị dị n'eluigwe. “Dị n'ụwa” anaghị ebute echiche na ebe nsọ ahụ rụrụ arụ n'omume.
translation_notes:
  register: Ejiri Standard Igbo dị ugbu a, nke dị ugwu ma dị mfe nghọta. “Ofufe,” “ọgbụgba ndụ,” na “ebe nsọ” bụ okwu Baịbụl ndị a maara nke ọma, ma ahịrịokwu ahụ ka na-ada ka Igbo nkịtị.
