id: HEB.9.12
reference: Hebrews 9:12
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οὐδὲ δι’ αἵματος τράγων καὶ μόσχων διὰ δὲ τοῦ ἰδίου αἵματος, εἰσῆλθεν ἐφάπαξ εἰς τὰ ἅγια, αἰωνίαν λύτρωσιν εὑράμενος.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/012.yaml
  text: and not through the blood of goats and calves[a], but through his own blood, he entered once for all into the holy places, having obtained eternal redemption.
translation:
  language: ig
  text: Ọ bụghịkwa site n'ọbara ewu na ụmụ ehi, kama ọ bụ site n'ọbara nke ya, ka ọ banyere otu ugboro maka oge niile n'ebe nsọ ndị ahụ[a], ebe o nwetara mgbapụta ebighị ebi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “n'ime ebe nsọ ahụ.” Okwu Grik ahụ pụtara n'ụzọ nkịtị “n'ime ebe nsọ ndị ahụ.” Ụfọdụ nsụgharị na-asụ ya kpọmkwem dị ka “Ebe Kachasị Nsọ,” ma okwu ahụ n'onwe ya anaghị achọ ka a kọwaa ya otú ahụ.
    reason: alternative_reading
lexical_decisions:
- source_word: οὐδὲ
  choice: Ọ bụghịkwa
  rationale: Nke a na-edobe njikọ okwu a na ihe e kwuru n'amaokwu bu ụzọ ma na-egosipụta nkwụsị ya na ọbara anụmanụ.
- source_word: δι’ αἵματος τράγων καὶ μόσχων
  choice: site n'ọbara ewu na ụmụ ehi
  rationale: “Site na” na-egosipụta ụzọ ma ọ bụ ihe e ji mee ihe; “ụmụ ehi” na-enye μόσχων n'ụzọ ziri ezi ma dị mfe nghọta.
- source_word: διὰ δὲ τοῦ ἰδίου αἵματος
  choice: kama ọ bụ site n'ọbara nke ya
  rationale: Ekwughachiri “site na” iji chekwaa ntụnyere dị n'etiti ọbara anụmanụ na ọbara nke ya; “nke ya” na-edobe nkwusi ike nke ἰδίου.
- source_word: εἰσῆλθεν
  choice: ọ banyere
  rationale: Nke a bụ okwu Igbo doro anya maka omume ịbanye nke e mere otu mgbe.
- source_word: ἐφάπαξ
  choice: otu ugboro ruo mgbe ebighị ebi
  rationale: Nkebi a na-egosi otu omume zuru oke, nke a na-agaghị emegharị ọzọ.
- source_word: εἰς τὰ ἅγια
  choice: n'ime ebe nsọ ndị ahụ
  rationale: Nke a na-echekwa ọdịdị ọtụtụ nke okwu Grik ma ghara ịkọwa ya kpọmkwem dị ka Ebe Kachasị Nsọ.
- source_word: αἰωνίαν λύτρωσιν
  choice: mgbapụta ebighị ebi
  rationale: Nke a na-egosipụta mgbapụta nke ịdị irè ya na-adịgide adịgide.
- source_word: εὑράμενος
  choice: ebe ọ nwetara
  rationale: N'ọnọdụ a, “inweta” na-enye echiche idiomatic nke εὑράμενος nke ọma karịa ntụgharị nkịtị “ịchọta,” ma na-ahapụ njikọ participle ahụ ka ọ ghara ịkọwa karịa ihe odide kwuru.
theological_decisions:
- issue: Ihe “site n'ọbara nke ya” pụtara banyere nbanye Kraịst
  choice: E debere ya dị ka ụzọ ma ọ bụ ihe e ji banye, n'enweghị ịkọwapụta usoro ịchụ àjà n'ụzọ ihe odide Grik na-ekwughị.
  alternative: Ịsị na ọ buuru ma ọ bụ gosi ọbara ya n'ụzọ nkịtị; ma ọ bụ na ọ banyere naanị mgbe ọ wụsịrị ọbara ya.
  rationale: διά ya na genitive pụtara ụzọ ma ọ bụ ihe e ji mee ihe, ma ntụgharị ahụ ekwesịghị ịmanye nkọwa kpọmkwem banyere otú ọbara ahụ si metụta nbanye n'ebe nsọ nke eluigwe.
- issue: Oke ihe τὰ ἅγια na-ezo aka na ya
  choice: ebe nsọ ndị ahụ
  alternative: ebe nsọ; Ebe Kachasị Nsọ
  rationale: Okwu Grik ahụ dị n'ụdị ọtụtụ, ọ bụ ezie na ọ pụkwara ịbụ aha a na-akpọ ebe ịchụ àjà n'ozuzu ya. A hapụrụ mgbagwoju anya ahụ kama ikpebi na ọ bụ kpọmkwem Ebe Kachasị Nsọ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị nsọ ma dị mfe nghọta. E kwughachiri “ka ọ banyere” iji mee ka ntụnyere ụzọ abụọ ahụ doo anya n'Igbo, ma e chekwara echiche nke otu omume a na-agaghị emegharị ọzọ.
