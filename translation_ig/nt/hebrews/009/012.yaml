revisions:
- from: Ọ bụghịkwa site n'ọbara ewu na ụmụ ehi ka ọ banyere, kama ọ bụ site n'ọbara nke ya ka ọ banyere n'ime ebe nsọ ndị ahụ[a] otu ugboro ruo mgbe ebighị ebi, ebe ọ nwetara mgbapụta ebighị ebi.
  to: Ọ bụghịkwa site n'ọbara ewu na ụmụ ehi, kama ọ bụ site n'ọbara nke ya, ka ọ banyere otu ugboro maka oge niile n'ebe nsọ ndị ahụ[a], ebe o nwetara mgbapụta ebighị ebi.
  rationale: The revision removes the unsupported second occurrence of 'he entered,' retains the repeated instrumental contrast with 'site n'ọbara,' and replaces a duration-oriented expression with one that communicates the single, decisive force of ἐφάπαξ. The footnote preserves the source's ambiguity concerning τὰ ἅγια while correcting the sanctuary/altar distinction.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T21:29:03Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves the contrast of animal blood with Christ's own blood, the cultic reference of τὰ ἅγια, and 'eternal redemption.' However, it repeats 'ọ banyere' ('he entered'), although εἰσῆλθεν occurs only once. Its rendering of ἐφάπαξ as 'otu ugboro ruo mgbe ebighị ebi' can suggest an action continuing eternally rather than a decisive, unrepeatable entry.
  naturalness: The revised wording uses a single, natural Igbo contrast construction and renders the once-for-all force idiomatically as 'otu ugboro maka oge niile.' 'N'ebe nsọ ndị ahụ' retains the plural cultic expression without identifying it as the Most Holy Place.
  terminology: '''Ọbara ewu na ụmụ ehi,'' ''ọbara nke ya,'' ''ebe nsọ ndị ahụ,'' and ''mgbapụta ebighị ebi'' are suitable Standard Igbo equivalents. The footnote''s former alternative ''ebe ịchụ àjà'' is unsuitable here, since it can denote an altar rather than the sanctuary; it is corrected to ''ebe nsọ ahụ.'''
  issues:
  - severity: high
    issue: The draft states 'ka ọ banyere' twice.
    rationale: The Greek has one finite verb, εἰσῆλθεν ('he entered'). Repeating it makes the first clause appear to deny one entry and the second to affirm another, rather than contrasting the means of the one entry.
  - severity: medium
    issue: '''otu ugboro ruo mgbe ebighị ebi'' is an imprecise rendering of ἐφάπαξ.'
    rationale: '''Ruo mgbe ebighị ebi'' normally describes continuing duration. Here ἐφάπαξ denotes an act done once, with permanent/unrepeatable force.'
  - severity: medium
    issue: The footnote's alternative 'ebe ịchụ àjà ahụ' is misleading.
    rationale: That expression can refer to the altar or a place of sacrifice, whereas the alternative under discussion is 'sanctuary,' not altar.
  revised_text: Ọ bụghịkwa site n'ọbara ewu na ụmụ ehi, kama ọ bụ site n'ọbara nke ya, ka ọ banyere otu ugboro maka oge niile n'ebe nsọ ndị ahụ[a], ebe o nwetara mgbapụta ebighị ebi.
  revised_footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “n'ime ebe nsọ ahụ.” Okwu Grik ahụ pụtara n'ụzọ nkịtị “n'ime ebe nsọ ndị ahụ.” Ụfọdụ nsụgharị na-asụ ya kpọmkwem dị ka “Ebe Kachasị Nsọ,” ma okwu ahụ n'onwe ya anaghị achọ ka a kọwaa ya otú ahụ.
    reason: alternative_reading
  revision_rationale: The revision removes the unsupported second occurrence of 'he entered,' retains the repeated instrumental contrast with 'site n'ọbara,' and replaces a duration-oriented expression with one that communicates the single, decisive force of ἐφάπαξ. The footnote preserves the source's ambiguity concerning τὰ ἅγια while correcting the sanctuary/altar distinction.
