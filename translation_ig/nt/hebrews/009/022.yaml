revisions:
- from: Dị ka Iwu ahụ si dị, ọ fọrọ nke nta ka ọ bụrụ na a na-eji ọbara eme ka ihe niile dị ọcha; ma ọ bụrụ na a wụfughị ọbara, mgbaghara[a] adịghị adị.
  to: Dị ka Iwu ahụ si dị, ọ fọrọ nke nta ka ọ bụrụ na e ji ọbara eme ka ihe niile dị ọcha; na-enweghị ịwụfu ọbara, mgbaghara[a] adịghị adị.
  rationale: The revision replaces the conditional paraphrase of χωρὶς with a direct Standard Igbo expression meaning “without,” while retaining the draft’s faithful rendering of the remaining Greek terms and its accessible, dignified register.
